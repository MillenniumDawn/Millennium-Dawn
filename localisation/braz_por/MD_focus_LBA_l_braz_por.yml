 LBA_unit_leader_trait_fezzan_desc: "Este comandante é de uma tribo do Fezzan. Em caso de conflito entre o governo central e sua tribo, é possível que ele escolha a tribo em vez da nação."
 LBA_unit_leader_trait_tuareg: "Afinidade Tribal: Tuaregue"
 LBA_unit_leader_trait_tuareg_desc: "Este comandante é de uma das tribos tuaregues da Líbia. Em caso de conflito entre o governo central e sua tribo, é possível que ele escolha a tribo em vez da nação."
 LBA_unit_leader_trait_toubou: "Afinidade Tribal: Toubou"
 LBA_unit_leader_trait_toubou_desc: "Este comandante é de uma das tribos toubou da Líbia. Em caso de conflito entre o governo central e sua tribo, é possível que ele escolha a tribo em vez da nação."
 LBA_muammar_gaddafi_desc: "Muammar Kadafi tomou o poder na Líbia após derrubar a monarquia líbia em 1969. Rapidamente assumiu o controle de todo o aparato governante e implementou uma mistura de políticas entre ideais antiocidentais, socialismo islâmico e sharia, e nacionalismo árabe. Acabou concentrando suas ideias no Livro Verde, que delineava sua Terceira Teoria Internacional. Embora inicialmente fosse um líder popular em casa e no exterior, Kadafi foi sendo cada vez mais marginalizado na política internacional. O financiamento constante de terroristas, revolucionários e insurgentes deixou Kadafi com pouquíssimos amigos no cenário internacional. As ações de Kadafi deixaram a outrora rica em petróleo nação da Líbia sofrendo sob pressão e sanções internacionais, com risco de se tornar um pária internacional."
 LBA_abdulrahman_sewehli_desc: "Abdulrahman Sewehli é neto de Ramadan Asswehly, o fundador da República Tripolitana. A República Tripolitana foi um país de curta duração que declarou independência da Líbia Italiana no fim da Primeira Guerra Mundial. Foi a primeira forma republicana de governo do mundo árabe."
 LBA_ali_zeidan_desc: "Ali Zeidan foi um diplomata líbio e trabalhou sob o embaixador na Índia Mohammed Magariaf na década de 1970. Ambos desertaram em 1980 e formaram a Frente Nacional para a Salvação da Líbia. Ali Zeidan viveu no exílio em Genebra como advogado de direitos humanos até seu retorno à Líbia. Alguns descreveram Zeidan como um liberal de mente forte."
 LBA_ali_tarhouni_desc: "Ali Tarhouni fugiu da Líbia em 1973 enquanto estudava economia. Foi privado da cidadania, condenado à morte e colocado em uma lista de alvos do governo. Tarhouni fugiu para os Estados Unidos e concluiu seus estudos lá. Após se formar e obter o doutorado, Tarhouni lecionou economia na Escola de Negócios Michael G. Foster da Universidade de Washington até que a situação política na Líbia lhe permitiu retornar ao país."
 LBA_fathi_al_baaja_desc: "Fathi Al-Baaja é cientista político e, antes de entrar na política, lecionou na Universidade Garyounis, em Benghazi."
 LBA_khweldi_hameidi_desc: "Khweldi Hameidi é um dos aliados mais próximos de Muammar Kadafi. Participou do golpe de 1969 e, após os expurgos de Kadafi, acabou em seu círculo íntimo. Ao longo de sua carreira, Hameidi foi ministro do interior, chefe da inteligência militar e chefe dos tribunais militares. Uma das filhas de Hameidi é casada com Al-Saadi Kadafi. Depois que Kadafi foi deposto do poder, Hameidi formou o Movimento Popular Líbio com outros leais a Kadafi."
 LBA_muhammad_muammar_gaddafi_desc: "Muhammad Gaddafi é o filho mais velho de Muammar Gaddafi. Apesar de sua posição na família, Muhammad nunca se interessou em governar o país."
 LBA_saif_al_islam_gaddafi_desc: "Saif al-Islam é o segundo filho de Muammar Kadafi. Tem formação em engenharia (ou arquitetura, dependendo da fonte). Saif al-Islam participou ativamente da política líbia e chegou a falar publicamente contra o pai e sobre como a Líbia precisa de reforma. Segundo relatos, foi-lhe oferecido o cargo de Primeiro-Ministro e a posição de sucessor de Muammar Kadafi, e ele recusou ambos, afirmando que a Líbia 'não é uma fazenda para se herdar'."
 LBA_al_saadi_gaddafi_desc: "Al-Saadi Kadafi é o 3º filho de Muammar Kadafi. É mais conhecido por sua carreira no futebol líbio, embora seus feitos não tenham nada de espetacular. Muitas de suas partidas foram manipuladas a seu favor, e os locutores das partidas eram proibidos de anunciar qualquer outro pelo nome; os demais eram anunciados apenas pelo número da camisa. Em geral, Al-Saadi é visto como a ovelha negra da família, e há rumores de que foi forçado a casar com a filha de um comandante militar para silenciar comentários sobre sua possível bissexualidade."
 LBA_mutassim_gaddafi_desc: "Mutassim Kadafi é o 4º filho de Muammar Kadafi. Embora sua experiência viesse apenas das forças armadas líbias, ele ainda foi autorizado a integrar o círculo íntimo de Muammar Kadafi."
 LBA_hannibal_gaddafi_desc: "Hannibal Kadafi é o 5º filho de Muammar Kadafi. Tem bacharelado em navegação marítima e serviu em várias embarcações da GMNTC. Tanto Hannibal quanto sua esposa têm um histórico de violência, especialmente contra seus empregados."
 LBA_ayesha_gaddafi_desc: "Ayesha Kadafi é a única filha de Muammar Kadafi. Estudou direito na Universidade Paris Diderot e também serviu nas Forças Armadas Líbias, chegando ao posto de tenente-coronel. Participou ativamente das tentativas de melhorar a posição diplomática da Líbia com outros países."
 LBA_saif_al_arab_gaddafi_desc: "Saif al-Arab Kadafi é o 6º filho de Muammar Kadafi. Pouco se sabe sobre ele, exceto que foi ferido em um ataque aéreo dos EUA em 1986, quando tinha quatro anos. Até agora, manteve um perfil muito discreto."
 LBA_khamis_gaddafi_desc: "Khamis Kadafi é o 7º e mais novo filho de Muammar Kadafi. Recebeu educação militar tanto na academia militar de Trípoli quanto na Academia Militar Frunze, na Rússia. Khamis geralmente se interessa mais por assuntos militares do que pela política, e tem um relacionamento muito caloroso com o pai e com os irmãos."
 LBA_ali_al_sallabi_desc: "Ali al-Sallabi é historiador e estudioso religioso. Durante o governo de Kadafi, foi preso na prisão de Abu Salim por oito anos, após os quais estudou teologia na Arábia Saudita e no Sudão. Embora membro da Irmandade Muçulmana e alguém com laços estreitos com o Catar, al-Sallabi foi um dos principais mediadores nas negociações entre Kadafi e o LIFG. Muitos de seus seguidores políticos foram membros da Al-Qaeda e do LIFG, de modo que não está claro se sua verdadeira lealdade está com a Irmandade ou com uma forma mais extremista do Islã."
 LBA_abdelhakim_belhaj_desc: "Abdelhakim Belhaj fundou o Grupo Islâmico Combatente Líbio na década de 1980, com o objetivo de se livrar de Muammar Kadafi. No entanto, antes de conseguir fazer qualquer coisa, o LIFG já havia sido expulso do país. Belhaj e seus compatriotas foram parar no Afeganistão, onde lutaram contra a União Soviética ao lado dos Mujahidin. Quando a guerra terminou, Belhaj voltou à Líbia em 1992 para continuar a resistência anti-Kadafi."
 LBA_emad_al_banani_desc: "Emad Al-Banani é cofundador do ramo da Irmandade Muçulmana em Benghazi. Trabalhou como engenheiro aeronáutico até se mudar para Zurique em 1995. Durante o exílio, al-Banani foi um dos membros mais ativos da Irmandade e há muito planeja o retorno da Irmandade à Líbia. Al-Banani quer substituir as Forças Armadas Líbias por uma guarda nacional, e também vê a Turquia e a Malásia como modelos inspiradores para os países muçulmanos."
 LBA_mahmoud_jibril_desc: "Mahmoud Jibril formou-se em Economia e Ciência Política pela Universidade do Cairo em 1975. Escreveu vários livros sobre planejamento estratégico e tomada de decisões. Nos anos 80, uma equipe liderada por ele publicou o Manual Árabe Unificado de Treinamento, e ele organizou diversos treinamentos de administração e gestão por todo o Oriente Médio. Antes da queda de Kadafi, Jibril trabalhou sob o seu comando como chefe do Conselho Nacional de Planejamento da Líbia e do Conselho Nacional de Desenvolvimento Econômico da Líbia. É amigo próximo de Saif al-Islam Kadafi e defende políticas de privatização e liberalização."
 LBA_mohammed_magariaf_desc: "A carreira de Mohammed Magariaf na Líbia começou como chefe do conselho de auditores do Tribunal de Receitas da Líbia. No entanto, devido à sua forte postura anticorrupção, foi rapidamente transferido para outras funções. Continuou como diplomata líbio na Índia, até desertar para o Marrocos em 1980, por temer ser expurgado pelo governo. No exílio, Magariaf fundou a Frente Nacional para a Salvação, um grupo de resistência anti-Kadafi. Chegou a liderar um grupo de comandos na Líbia numa tentativa de assassinar Kadafi. Magariaf passou a maior parte do exílio nos Estados Unidos, onde sobreviveu a três tentativas de assassinato. Só voltou ao país após a queda de Kadafi. É um forte defensor dos princípios democráticos no país."
 LBA_mustafa_a_g_abushagur_desc: "Mustafa Abushagur deixou a Líbia na década de 1970 para estudar engenharia elétrica nos Estados Unidos. Obteve o doutorado em 1984 e depois trabalhou como professor na Universidade do Alabama em Huntsville. Durante sua estadia nos EUA, Abushagur recebeu vários prêmios de pesquisa da NASA, da NSF, do DoD e da FAA. O foco principal de Abushagur é a optoeletrônica, e ele publicou vários livros sobre o assunto. Enquanto vivia no exílio nos EUA, também trabalhou ativamente com outros exilados para organizar movimentos anti-Kadafi."
 LBA_ahmed_shebani_desc: "Ahmed Shebani é o fundador do Partido Democrático da Líbia. Ele acredita que os EUA (e outras potências ocidentais) deveriam adotar um programa de ajuda à Líbia nos moldes do Plano Marshall para estabilizá-la. Também quer restabelecer as relações com Israel e trazer de volta os judeus que foram expulsos do país."
 LBA_ignore_lifg: "Ignorar o LIFG"
 LBA_ignore_lifg_desc: "Poucos anos atrás, o Grupo Islâmico Combatente Líbio tentou assassinar Kadafi. Nosso exército rapidamente caçou a maior parte de suas forças e eles não são mais uma ameaça. Devemos chamar nossas tropas de volta e nos concentrar em reconstruir a nação."
 LBA_crush_lifg: "Esmagar o LIFG"
 LBA_crush_lifg_desc: "Há apenas alguns anos, o Grupo Islâmico de Combate da Líbia tentou assassinar Gaddafi. Nosso exército rapidamente caçou a maioria de suas forças e elas não são mais uma ameaça. Devemos procurar e destruir quaisquer esconderijos restantes e prender simpatizantes. Não podemos permitir que essa ideologia repugnante venha à tona na Líbia."
 LBA_islam_over_nation: "O Islão Sobre a Nação"
 LBA_islam_over_nation_desc: "Quando Gaddafi assumiu o poder, ele queria modelar o cenário judicial da Líbia segundo a Sharia. No entanto, ele rapidamente voltou atrás, trazendo mais elementos nacionalistas para sua decisão. Houve um equilíbrio entre os dois desde então. No entanto, está claro que para qualquer nação muçulmana e árabe, o islamismo deve ser o princípio orientador."
 LBA_nation_over_islam: "Nação sobre o Islã"
 LBA_nation_over_islam_desc: "Quando Gaddafi assumiu o poder, ele queria modelar o cenário judicial da Líbia segundo a Sharia. No entanto, ele rapidamente voltou atrás, trazendo mais elementos nacionalistas para sua decisão. Houve um equilíbrio entre os dois desde então. Seguir o islamismo é ultrapassado e tribal. Devemos nos concentrar mais em construir uma nação líbia e uma identidade líbia."
 LBA_family_is_a_central_unit: "Família acima de tudo"
 LBA_family_is_a_central_unit_desc: "O cerne da sociedade é a família. Um homem e uma mulher com seus filhos. Este é o objetivo de todos os líbios. Famílias felizes e em crescimento garantirão prosperidade e sucesso nos próximos anos."
 LBA_nation_is_a_central_unit: "Nação acima de tudo"
 LBA_nation_is_a_central_unit_desc: "O cerne da sociedade é um homem que ama seu país. Precisamos encorajar as pessoas a serem mais patriotas e deixar de lado seu passado tribal."
 LBA_follow_religious_law: "Siga a Lei Religiosa"
 LBA_follow_religious_law_desc: "A Lei Islâmica é a melhor base para governar um país. É isso que tornará a Líbia justa para todos."
 LBA_draft_real_constitution: "Redigir uma Constituição de Verdade"
 LBA_draft_real_constitution_desc: "A Líbia não tem uma constituição oficial. É um absurdo que uma nação moderna não tenha uma. Precisamos criar uma constituição adequada, que mostre claramente ao mundo e ao nosso povo qual é a nossa posição."
 LBA_traditional_role_for_women: "Papel Tradicional da Mulher"
 LBA_traditional_role_for_women_desc: "As mulheres devem ser as guardiãs da família. Elas têm a mais alta honra possível ao criar os filhos e servir à família, enquanto os homens precisam se matar de trabalhar."
 LBA_liberate_women: "Libertar as Mulheres"
 LBA_liberate_women_desc: "As mulheres merecem os mesmos direitos e deveres que os homens. Elas trabalham e servem à nação tanto quanto os homens."
 LBA_religious_education: "Educação religiosa"
 LBA_religious_education_desc: "Nossas escolas devem incorporar estudos religiosos de perto ao currículo. As pessoas devem aprender sobre o Alcorão e as práticas islâmicas desde a infância."
 LBA_national_education: "Educação Nacionalista"
 LBA_national_education_desc: "Nossas escolas devem incorporar de perto o nacionalismo e os estudos cívicos ao currículo. O patriotismo e os grandes feitos dos líbios devem ser ensinados a todos os cidadãos."
 LBA_appoint_grand_mufti: "Nomear um Grão-Mufti"
 LBA_appoint_grand_mufti_desc: "A Líbia não tem um Grão-Mufti para interpretar a Lei Islâmica. Isso é vergonhoso para uma nação islâmica devota como a nossa. Devemos nomear Sadiq al-Ghariani como Grão-Mufti."
 LBA_appoint_baathist_advisor: "Nomear um Conselheiro Baathista"
 LBA_appoint_baathist_advisor_desc: "Embora o partido governante de Kadafi seja semelhante ao baathismo, há algumas diferenças. Precisamos contratar um conselheiro especialista em baathismo para ajudar nosso governo a alcançar seus ideais nacionalistas."
 LBA_peace_with_lifg: "Paz com o LIFG"
 LBA_peace_with_lifg_desc: "O conflito com o Grupo Islâmico Combatente Líbio comprometeu a estabilidade de toda a nação. Devemos permitir que eles existam em paz conosco."
 LBA_assassinate_gaddafi: "Assassinar [ROOT.GetLeader]"
 LBA_assassinate_gaddafi_desc: "O povo está farto de [ROOT.GetLeader]. Os guerreiros islâmicos da Líbia devem se levantar e defender os valores tradicionais líbios antes que seja tarde demais."
 LBA_mujahideen_of_libya: "Mujahidin da Líbia"
 LBA_mujahideen_of_libya_desc: "Muitos membros do LIFG são veteranos dos mujahidin da época em que a União Soviética invadiu o Afeganistão. Sua experiência será de grande utilidade."
 LBA_old_taliban_friends: "Velhos Amigos Talibãs"
 LBA_old_taliban_friends_desc: "Temos muitos contatos no Talibã. Devemos utilizar essas conexões."
 LBA_mujahideen_legion: "Legião Mujahidin"
 LBA_mujahideen_legion_desc: "Como veteranos do Afeganistão, sabemos como combater os infiéis. É nosso dever garantir que os muçulmanos estejam protegidos em toda parte."
 LBA_call_back_veterans: "Chamar os Veteranos de Volta"
 LBA_call_back_veterans_desc: "Muitos veteranos e líderes seniores do LIFG vivem no exílio. Agora que estamos no poder e estabelecidos, eles podem começar a voltar para casa."
 LBA_unity_in_islam: "Unidade no Islã"
 LBA_unity_in_islam_desc: "O Islã é uma ferramenta poderosa que ultrapassa as fronteiras tribais. Com ele, todos os líbios se sentirão unidos."
 LBA_work_together_with_brotherhood: "Trabalhar com a Irmandade Muçulmana"
 LBA_work_together_with_brotherhood_desc: "A Irmandade Muçulmana foi banida sob o governo de Kadafi, mas muitas pessoas ainda eram membros da organização. Sendo uma das maiores forças políticas islâmicas do país, faz sentido nos aliarmos a elas."
 LBA_work_together_with_brotherhood_tt: "[Neutral_Muslim_Brotherhood_L] será conhecido como §Y£LBA_Neutral_Muslim_Brotherhood Justice and Construction Party§!"
 LBA_hardline_sharia_law: "Lei Sharia linha dura"
 LBA_hardline_sharia_law_desc: "A Lei Sharia deve ser o princípio norteador da nossa nação. Todas as leis devem ser baseadas nela, e toda a sociedade deve funcionar como ela diz."
 LBA_hardline_sharia_law_tt_alcohol: "Proibiremos o álcool\n"
 LBA_hardline_sharia_law_tt_dress_code: "Reimporemos o código de vestimenta\n"
 LBA_hardline_sharia_law_tt_banned_head_scarf: "Revogaremos a proibição do véu\n"
 LBA_hardline_sharia_law_tt_same_sex_decriminalized: "Criminalizaremos as relações entre pessoas do mesmo sexo\n"
 LBA_de_westernisation: "Desocidentalização"
 LBA_de_westernisation_desc: "O Ocidente decadente tem influência demais em nosso país. Precisamos erodir as tradições ocidentais no país."
 LBA_grand_mufti_rule: "Governo do Grão-Mufti"
 LBA_grand_mufti_rule_desc: "O Grão-Mufti tornou-se um símbolo importante para o nosso povo. É melhor que mais poder político seja dado a ele, para que possa guiar a Líbia rumo à iluminação."
 LBA_denounce_green_book: "Denunciar o Livro Verde"
 LBA_denounce_green_book_desc: "O Livro Verde de Kadafi misturava nacionalismo com Islã e foi usado como base do seu governo. O único livro que o povo deve seguir é o Alcorão, e nada mais."
 LBA_tanasoh_tv: "TV Tanasuh"
 LBA_tanasoh_tv_desc: "Devemos criar uma rede nacional de TV para transmitir a mensagem do Grão-Mufti a todos os líbios."
 LBA_supreme_revolutionaries_council: "Conselho Supremo dos Revolucionários"
 LBA_supreme_revolutionaries_council_desc: "Para proteger o novo Estado, devemos estabelecer o Conselho Supremo dos Revolucionários. Um órgão consultivo do Grão-Mufti para ajudar a governar o país."
 LBA_anti_saudi_coalition: "Coalizão Anti-Saudita"
 LBA_anti_saudi_coalition_desc: "Os sauditas e outras monarquias do Golfo acusam o Grande Mufti de participar do terrorismo apoiado pelo Catar. Essa é uma alegação ridícula e precisamos trabalhar juntos com o Catar para combater essa calúnia."
 LBA_join_sahel_war: "Apoiar a Insurgência do Magrebe"
 LBA_join_sahel_war_desc: "No Saara, vários grupos insurgentes islamistas lutam pela libertação dos muçulmanos. Precisamos nos alinhar a esses grupos."
 LBA_join_sahel_war_threat: "[LBA.GetAdjective] Apoia a Insurgência no Magrebe"
 LBA_islamic_state_of_sahel: "Estado Islâmico do Magrebe"
 LBA_islamic_state_of_sahel_desc: "Devemos nos proclamar governantes únicos do Saara. De agora em diante, a Líbia será conhecida como o Estado Islâmico do Magrebe."
 LBA_islamic_state_of_sahel_tt: "Poderemos transformar estados §YReivindicados§! no Saara em §YNúcleos§!"
 LBA_our_brothers_in_chad: "Nossos Irmãos no Chade"
 LBA_our_brothers_in_chad_desc: "Os insurgentes do norte do Chade seriam aliados perfeitos para tomar o país no futuro."
 LBA_our_brothers_in_chad_tt: "Uma unidade de Mujahidin estabelece sua base em §Y$VICTORY_POINTS_1057$, $STATE_1100$§!"
 LBA_topple_chad: "Derrubar o Chade"
 LBA_topple_chad_desc: "O Chade é um de nossos vizinhos mais fracos. Com a ajuda dos insurgentes locais, derrubar o Chade deve ser fácil."
 LBA_our_brothers_in_niger: "Nossos Irmãos no Níger"
 LBA_our_brothers_in_niger_desc: "O norte do Níger é um foco de atividade militante. Precisamos permitir que esses insurgentes cruzem a fronteira e estabeleçam um acampamento seguro do nosso lado."
 LBA_our_brothers_in_niger_tt: "Uma unidade de Mujahidin estabelece sua base em §Y$VICTORY_POINTS_3257$, $STATE_920$§!"
 LBA_topple_niger: "Derrubar o Níger"
 LBA_topple_niger_desc: "Ao tomar o Níger, garantiremos nossa fronteira sul. O extremo sul do Saara também servirá de trampolim perfeito para atacar a Nigéria."
 LBA_ally_with_boko_haram: "Aliar-se ao Boko Haram"
 LBA_ally_with_boko_haram_desc: "O grupo islâmico nigeriano Boko Haram vem lutando contra o governo nigeriano há anos. Devemos nos aliar a eles para obter seu apoio na destruição da Nigéria. No entanto, não há garantia de que eles serão amigáveis ​​conosco a longo prazo."
 LBA_ally_with_boko_haram_tt: "Quando concluirmos §Y$LBA_invade_nigeria$§!, o Boko Haram se revoltará contra [NIG.GetNameDef] e se juntará ao nosso lado"
 LBA_invade_nigeria: "Invadir a Nigéria"
 LBA_invade_nigeria_desc: "O norte da Nigéria é predominantemente muçulmano. Precisamos libertar nossos irmãos da opressão do sul cristão."
 LBA_our_brothers_in_algeria: "Nossos Irmãos na Argélia"
 LBA_our_brothers_in_algeria_desc: "A Argélia é o berço da insurgência no Magrebe. Desde o fracasso dos islamistas na Guerra Civil Argelina, a parte argelina do Saara continua sendo um foco de atividade insurgente. Embora a maioria dos combatentes tenha sido expulsa pelo Exército Argelino, ainda restam alguns. Devemos contatá-los."
 LBA_our_brothers_in_algeria_tt: "Uma unidade de Mujahidin estabelece sua base em §Y$VICTORY_POINTS_4051$, $STATE_393$§!"
 LBA_topple_algeria: "Derrubar a Argélia"
 LBA_topple_algeria_desc: "Os islamistas fracassaram em derrubar o governo argelino decadente durante a guerra civil. Nós, porém, não falharemos."
 LBA_infiltrate_mali: "Infiltrar o Mali"
 LBA_infiltrate_mali_desc: "Azawad, a região norte do Mali, é um foco de atividade insurgente. O Mali é fraco e já está em turbulência, e agora é a hora de atacar."
 LBA_our_brothers_in_mali_east_tt: "Uma unidade de Mujahidin estabelece sua base em §Y$VICTORY_POINTS_7939$, $STATE_330$§!"
 LBA_our_brothers_in_mali_north_tt: "Uma unidade de Mujahidin estabelece sua base em §Y$VICTORY_POINTS_5095$, $STATE_381$§!"
 LBA_expand_to_mauritania: "Expandir para a Mauritânia"
 LBA_expand_to_mauritania_desc: "A Mauritânia só viu atividade limitada de insurgentes. É hora de aumentar essas operações e terminar de unir o Sahel."
 LBA_destroy_last_crusaders: "Destrua os Últimos Cruzados"
 LBA_destroy_last_crusaders_desc: "Malta é o lar dos Cavaleiros Hospitalários. É um ultraje que os descendentes dos cruzados que massacraram muçulmanos tenham permissão para viver bem ao lado da nossa porta. Este último bastião dos infiéis deve ser destruído."
 LBA_malta_repopulation_campaign: "Campanha de repovoamento de Malta"
 LBA_malta_repopulation_campaign_desc: "Deveríamos criar uma campanha para incentivar nossos cidadãos a imigrar para Malta para mudar a demografia a nosso favor."
 LBA_malta_province: "Província de Malta"
 LBA_malta_province_desc: "Malta agora tem uma população muçulmana considerável. Devemos integrar formalmente Malta como parte integral de [LBA.GetNameDef]."
 LBA_baathism_tunisia: "Baathismo na Tunísia"
 LBA_baathism_tunisia_desc: "A Tunísia tem um movimento baathista ativo desde a década de 1950. No entanto, ele foi banido sob o governo de Zine El Abidine Ben Ali. Devemos criar contatos com o movimento clandestino, pois ele tem laços com grupos baathistas."
 LBA_baathism_algeria: "Baathismo na Argélia"
 LBA_baathism_algeria_desc: "O Partido Baathista da Argélia foi banido e reprimido. O atual líder do partido vive exilado no Iraque por causa disso. Com os baathistas argelinos, teremos contatos tanto na Argélia quanto no Iraque."
 LBA_baathism_mauritania: "Baathismo na Mauritânia"
 LBA_baathism_mauritania_desc: "Na Mauritânia, o Partido Baath é a maior força nacionalista árabe do país. O partido infiltrou-se várias vezes nas forças armadas mauritanas e seus líderes chegaram a servir como ministros. No entanto, quando a Mauritânia normalizou as relações com Israel em 1999, o partido foi banido."
 LBA_baathism_egypt: "Baathismo no Egito"
 LBA_baathism_egypt_desc: "O Partido Baathista do Egito foi banido em 1990 e, apenas um ano depois, dois oficiais da inteligência iraquiana foram presos no país com grandes quantias de dinheiro destinadas a desestabilizar o Egito. Ao contatar nossos irmãos baathistas no Egito, teremos acesso à sua rede internacional de fundos."
 LBA_baathism_levant: "Baathismo no Levante"
 LBA_baathism_levant_desc: "Entre todos os países árabes não baathistas, o movimento vai melhor na Jordânia. O partido não é ilegal, um terço dos jordanianos conhece a existência do Partido Baathista e eles chegaram a ter membros no parlamento. O Partido Baath jordaniano tem um extenso programa de enviar jordanianos para estudar em universidades iraquianas, e essa rede também nos beneficiará. Na Palestina, nossos irmãos baathistas ajudam a OLP em sua luta contra os invasores sionistas."
 LBA_baathism_iraq_kuwait: "Baathismo no Iraque"
 LBA_baathism_iraq_kuwait_desc: "Talvez de todos os países, é no Iraque que o baathismo mais floresceu. Embora, recentemente, Saddam Hussein tenha tentado construir uma identidade iraquiana baseada numa identidade neomesopotâmica, vendo a si mesmo como o novo Hamurabi. Precisamos conduzi-los de volta ao nacionalismo árabe antes que seja tarde demais."
 LBA_baathism_bahrain: "Baathismo no Bahrein"
 LBA_baathism_bahrain_desc: "No Bahrein, os ideais baathistas são liderados pela Assembleia Democrática Nacionalista, antimonarquista. Um de seus principais objetivos é acabar com a política de imigração do governo, que torna injusto para os bareinitas competir com mão de obra estrangeira barata. O Bahrein é um ótimo exemplo de por que devemos priorizar a população árabe em vez dos estrangeiros."
 LBA_baathism_lebanon: "Baathismo no Líbano"
 LBA_baathism_lebanon_desc: "O baathismo tem uma longa história no Líbano. Atualmente há muita competição entre as facções iraquiana e síria entre os apoiadores baathistas. Devemos tentar reconciliar essas diferenças."
 LBA_baathism_sudan: "Baathismo no Sudão"
 LBA_baathism_sudan_desc: "Embora o baathismo seja relativamente pequeno no Sudão, os membros do movimento ainda têm considerável influência devido à grande quantidade de financiamento iraquiano. Com o Sudão mais próximo de nós, será mais fácil controlar esse dinheiro vindo do Iraque."
 LBA_baathism_yemen: "Baathismo no Iêmen"
 LBA_baathism_yemen_desc: "No Iêmen, o Partido Baathista, dominado pelo Iraque, é aliado próximo do Congresso Geral do Povo, que está no poder. Mantendo bom contato com os baathistas no Iêmen, teremos ótimo acesso ao governo iemenita."
 LBA_revise_green_book: "Revisar o Livro Verde"
 LBA_revise_green_book_desc: "Em 1975, Muammar Kadafi lançou seu Livro Verde, que detalhava sua ideologia política. Ele rejeita a democracia representativa em favor da democracia direta, e rejeita tanto o capitalismo quanto o comunismo. Essencialmente, estabelece a base da Terceira Teoria Internacional. No entanto, muitos elementos da sociedade líbia atual não seguem o Livro Verde. Talvez seja hora de levar o livro ao milênio atual e traçar o caminho futuro dos líbios."
 LBA_revise_green_book_tt: "\n[LBA.GetLeader] revisará o Livro Verde. A cada capítulo reescrito, nosso país avança em direção à §YReforma§! ou se afasta dela. A quantidade de §YReforma§! determinará o futuro da Líbia.\n\nSe §YReforma§! > 3, nós §Y$LBA_empower_peoples_congresses$§!\n\nSe §YReforma§! < -3, nós §Y$LBA_empower_revolutionary_committees$§!\n\nCaso contrário, nós §Y$LBA_retain_political_balance$§!\n\n"
 LBA_green_book_part_1_1: "1:1 - O Instrumento de Governo"
 LBA_green_book_part_1_1_desc: "A questão política mais importante é 'que forma de governo deve ser estabelecida?' Tal governo deveria ser uma democracia direta, mas o que costuma ocorrer é o estabelecimento de democracias representativas, que usurpam a vontade de grandes populações que não votaram nos governos existentes, usando sistemas eleitorais de maioria simples."
 LBA_green_book_part_1_3: "1:3 - O Partido"
 LBA_green_book_part_1_3_desc: "Os partidos políticos também usurpam a autoridade do povo e se concentram em manter o poder em vez de melhorar a sociedade para todos, o verdadeiro objetivo do governo. Pior ainda, os partidos políticos são suscetíveis à corrupção."
 LBA_green_book_part_1_8: "1:8 - Quem Supervisiona a Conduta da Sociedade?"
 LBA_green_book_part_1_8_desc: "Assim como o poder político não deve ser delegado a representantes, o poder de policiamento também não deve ser retirado da sociedade como um todo. Novamente, a estrutura de Conferências e Comitês é a solução. O Todo é o legislativo do Todo, e o Todo é a aplicação da lei para o Todo."
 LBA_green_book_part_1_10: "1:10 - A Imprensa"
 LBA_green_book_part_1_10_desc: "Embora indivíduos e empresas tenham o direito de se expressar em caráter privado, 'a imprensa', como meio de expressão da sociedade, deve ser emitida pelas Conferências e Comitês. Caso contrário, os indivíduos novamente usurpariam o poder dos outros no campo das ideias."
 LBA_green_book_part_2_13: "2:13 - Moradia"
 LBA_green_book_part_2_13_desc: "O aluguel de moradias, por exemplo, é exploração e infringe a liberdade do inquilino. Idealmente, todos deveriam ter apenas uma casa, pois, se uma pessoa tem mais de um imóvel, tenderá a alugá-lo, explorando assim seus inquilinos."
 LBA_green_book_part_2_14: "2:14 - Renda"
 LBA_green_book_part_2_14_desc: "A renda individual é essencial para uma economia. Novamente, essa renda não deve ser obtida como salário pago por um proprietário, mas como resultado da sociedade em uma indústria."
 LBA_green_book_part_2_16: "2:16 - Terra"
 LBA_green_book_part_2_16_desc: "A terra, como todas as categorias mencionadas, deve estar igualmente disponível a todos. Em geral, a economia é um jogo de soma zero, e os componentes da economia devem, portanto, ser distribuídos igualmente entre todos, para produzir igualdade de resultados. Ninguém tem o direito de guardar para si além de suas próprias necessidades, exceto até a sua parte aritmética de um dado bem entre toda a população."
 LBA_green_book_part_3_21: "3:21 - Os Méritos da Tribo"
 LBA_green_book_part_3_21_desc: "As tribos têm raízes no sangue, proporcionam coesão social e conseguem se monitorar internamente graças ao seu tamanho. Também garantem a socialização de seus indivíduos, uma educação mais útil do que a educação escolar."
 LBA_green_book_part_3_24: "3:24 - Minorias"
 LBA_green_book_part_3_24_desc: "As minorias são de dois tipos: as que já têm uma nação e as que não têm nenhuma, criando a sua própria. De qualquer forma, seus direitos devem ser protegidos."
 LBA_green_book_part_3_25: "3:25 - Os Negros Prevalecerão no Mundo"
 LBA_green_book_part_3_25_desc: "Os negros estão prestes a dominar a população humana porque sua cultura inclui a poligamia e rejeita o controle de natalidade, e porque vivem em um clima 'continuamente quente', com o resultado de que o trabalho é menos importante para eles do que em outras culturas."
 LBA_green_book_part_3_28: "3:28 - Esporte, Equitação e Palco"
 LBA_green_book_part_3_28_desc: "A audiência em esportes, teatro e outros entretenimentos é tolice. As pessoas deveriam se envolver em esportes diretamente, derivando os benefícios do atletismo para si mesmas, em vez de ficar paradas assistindo os outros se apresentarem."
 LBA_release_new_green_book: "Lançamento do Novo Livro Verde"
 LBA_release_new_green_book_desc: "Está pronto! Depois de meses de trabalho duro, o Green Book recebeu uma nova edição. Estudantes de todo o país se alegram, pois agora têm mais um livro para aprender!"
 LBA_empower_peoples_congresses: "Fortalecer os Congressos Populares"
 LBA_empower_peoples_congresses_desc: "O que começou como uma forma de levar democracia direta às pessoas se desenvolveu em uma farsa de vizinhos espionando uns aos outros para proteger o estado contra atividades revolucionárias. Os Comitês Revolucionários que espionam as pessoas precisam ser abolidos e o poder precisa ser devolvido ao povo."
 LBA_retain_political_balance: "Manter o Equilíbrio Político"
 LBA_retain_political_balance_desc: "O sistema político da Líbia funciona há décadas. Os Congressos Populares e os Comitês Revolucionários se mantêm mutuamente sob controle. Por que balançar o barco quando tudo funciona?"
 LBA_empower_revolutionary_committees: "Fortalecer os Comitês Revolucionários"
 LBA_empower_revolutionary_committees_desc: "Os Comitês Revolucionários já controlam efetivamente a nação. Não deve ser muito difícil tornar o poder dos Congressos Populares meramente nominal, com os Comitês Revolucionários sendo os verdadeiros senhores da nação."
 LBA_allow_political_parties: "Permitir Partidos Políticos"
 LBA_allow_political_parties_desc: "Partidos políticos foram banidos na Líbia desde que Gaddafi assumiu o poder. No entanto, para que as pessoas se apresentem adequadamente, elas precisam de plataformas para isso. Devemos abrir o cenário político para mais atores."
 LBA_allow_political_parties_tt: "Todos os partidos políticos serão legalizados\n[conservatism_L] será conhecido como §Y£generic_conservatism_small Union for Homeland§!\n[liberalism_L] será conhecido como §Y£LBA_liberalism National Party for Development and Welfare§!\n[Autocracy_L] será conhecido como §Y£LBA_Autocracy_democracy Arab Socialist Union§!\n[Kingdom_L] será conhecido como §Y£LBA_Kingdom Homeland Party§!\n[Neutral_Muslim_Brotherhood_L] será conhecido como §Y£LBA_Neutral_Muslim_Brotherhood Justice and Construction Party§!\n[Neutral_Autocracy_L] será conhecido como §Y£LBA_Neutral_Autocracy National Forces Alliance§!\n[Neutral_conservatism_L] será conhecido como §Y£LBA_Neutral_conservatism_democracy National Front Party§!\n[Neutral_Libertarian_L] será conhecido como §Y£LBA_Neutral_Libertarian Democratic Party§!\n[neutral_Social_L] será conhecido como §Y£LBA_neutral_Social Ensaf Movement§!\n"
 LBA_grassroots_democracy: "Democracia Popular"
 LBA_grassroots_democracy_desc: "A democracia e o Estado devem ser do povo, para o povo. A democracia precisa estar presente em todos os níveis de governo, de modo que até no nível mais baixo as pessoas tenham a oportunidade de influenciar as coisas."
 LBA_allow_royal_family_return: "Permitir o Retorno da Família Real"
 LBA_allow_royal_family_return_desc: "Após o golpe de Kadafi em 1969, o rei Idris foi deixado a viver no exílio. O resto de sua família, porém, não teve a mesma sorte. Seu sobrinho e herdeiro, Hasan as-Senussi, junto com a família, foi colocado em prisão domiciliar. A casa foi incendiada em 1984 e a família foi levada a viver num barraco numa praia pública. Quatro anos depois, a família foi autorizada a se mudar para o Reino Unido para o tratamento médico de Hasan, que morreu de derrame apenas quatro anos depois, em 1992. Seu filho e atual Príncipe Herdeiro Mohammed El Senussi ainda vive em Londres. Talvez seja hora de permitir que eles voltem?"
 LBA_compensation_to_royals: "Compensação aos Reais"
 LBA_compensation_to_royals_desc: "Depois do que passaram, devemos dar uma compensação monetária à família real do orçamento do Estado. Apenas uma pequena mesada anual para que se reergam. Com seu status restaurado, um dia serão tão famosos quanto a monarquia britânica."
 LBA_hunt_down_royals: "Caçar os Reais"
 LBA_hunt_down_royals_desc: "Um punhado de membros da família Senussi ainda permanece no exterior, no exílio. Enquanto viverem, nosso regime não estará seguro. Devemos assassinar a linhagem restante da casa de Senussi."
 LBA_hunt_down_royals_tt: "\nTentaremos assassinar o §YPríncipe Herdeiro Mohammed§!, seu primo §YAhmed§! e um pretendente ao trono, §YIdris e seu filho Khaled§!. A probabilidade de §Gsucesso§! e de §Rdescoberta§! depende dos nossos gastos com §YSegurança Interna§!\n"
 LBA_royal_wealth: "Confiscar a Riqueza Real"
 LBA_royal_wealth_desc: "Os Royals têm muito dinheiro atualmente. Precisamos apreender, confiscar e roubar seus ativos em nome do bem-estar da Líbia."
 LBA_peoples_intelligence_agency: "Agência de Inteligência do Povo"
 LBA_peoples_intelligence_agency_desc: "Agora que os Comitês Revolucionários controlam o país, eles podem realmente servir ao povo, impedindo que qualquer pensamento hostil crie raízes no país."
 LBA_trust_revolutionary_guard: "Confiar na Guarda Revolucionária"
 LBA_trust_revolutionary_guard_desc: "A Guarda Revolucionária protegeu o regime por décadas. Precisamos transferir ainda mais responsabilidade para o lado deles. O exército regular não é confiável."
 LBA_trust_army: "Confiar no Exército"
 LBA_trust_army_desc: "Nós delegamos muito da segurança do estado para a Guarda Revolucionária. Precisamos mudar o foco de volta para o exército."
 LBA_presidential_republic: "República Presidencialista"
 LBA_presidential_republic_desc: "A Líbia teve um líder forte durante a maior parte de sua existência. Mesmo quando fizermos a transição para a democracia, precisamos de um líder forte com autoridade. À medida que a Líbia faz a transição, devemos seguir os modelos francês e americano de ser governado por um presidente forte."
 LBA_federation: "Federação Líbia"
 LBA_federation_desc: "A Líbia é composta por Tripolitânia, Cirenaica e Fezzan. Essas regiões são então compostas por várias tribos. Para a estabilidade da nação, é melhor delegar parte do poder aos governos regionais."
 LBA_federation_tt: "A mecânica de §YTribalismo Líbio§! será desativada"
 LBA_minority_rights: "Direitos das Minorias"
 LBA_minority_rights_desc: "Os Toubou, Tuaregs e tribos locais devem ter alguma autonomia. Esta é a melhor maneira de prevenir a opressão do estado central."
 LBA_unitary_state: "Estado Unitário"
 LBA_unitary_state_desc: "A Líbia é dividida em tribos e povos. A melhor maneira de combater essas divisões é ter um governo central forte que possa garantir que o país não entre em colapso."
 LBA_unitary_state_tt: "Dependendo de nossa escolha anterior, uma das seguintes coisas acontecerá:\n\n"
 LBA_minority_protection: "Proteção das Minorias"
 LBA_minority_protection_desc: "Precisamos convencer as tribos de que o estado central existe para proteger seus direitos, e não para oprimi-las."
 LBA_constitutional_monarch: "Monarquia Constitucional"
 LBA_constitutional_monarch_desc: "A Líbia era relativamente estável sob a monarquia. No entanto, após décadas de autocracia, não podemos mais sujeitar o povo líbio a ela. Devemos devolver a monarquia como um símbolo poderoso da unidade da Líbia, mas o verdadeiro poder político ainda deve estar com o povo líbio."
 LBA_the_real_monarch: "O Verdadeiro Monarca"
 LBA_the_real_monarch_desc: "Chegou a hora de devolver a monarquia à Líbia. Precisamos coroar um verdadeiro governante para a Líbia."
 LBA_the_real_monarch_tt_1: "Se tivermos concluído o foco §Y$LBA_compensation_to_royals$§!:\n"
 LBA_the_real_monarch_tt_2: "Se tivermos concluído os focos §Y$LBA_royal_wealth$§! e §Y$LBA_strive_for_african_union$§!:\n"
 LBA_protect_toubou_and_tuaregs: "Proteger os Toubou e os Tuaregues"
 LBA_protect_toubou_and_tuaregs_desc: "O Saara e a Líbia são o lar dos tuaregues e do povo toubou. No entanto, muitos dos países que hospedam essas pessoas são instáveis, autoritários ou ambos. É nosso dever proteger essas minorias de seus opressores."
 LBA_protect_toubou_and_tuaregs_tt: "Podemos exigir que nossos §Yvizinhos§! com baixa estabilidade ou governo autoritário libertem quaisquer núcleos §YTuaregues§! ou §YTibesti§!"
 LBA_protect_toubou_and_tuaregs_threat: "[LBA.GetAdjective] Pretende Libertar os Tuaregues e os Toubou"
 LBA_royal_unity: "Unidade Real"
 LBA_royal_unity_desc: "O propósito de um rei é unir o povo. Sob o monarca líbio, as tribos terão uma figura em comum a quem admirar."
 LBA_revive_senussi_order: "Reviver a Ordem Senussi"
 LBA_revive_senussi_order_desc: "A Ordem Senussi começou como uma organização religiosa que tentava eliminar algumas das crenças mais 'tribais' incorporadas ao Islã sufi, ao mesmo tempo em que reduzia as interpretações mais fundamentalistas do Alcorão. A Ordem cresceu e ganhou grande poder na Líbia, até ser essencialmente extinta por Muammar Kadafi. Kadafi agora se foi, e é hora de a Ordem Senussi renascer."
 LBA_approach_nato: "Aproximar-se da OTAN"
 LBA_approach_nato_desc: "O Reino da Líbia foi fundado originalmente com a ajuda dos britânicos e de outras potências ocidentais. Em nossos primeiros dias, cooperamos de perto com nossos amigos europeus, até que os tolos nacionalistas árabes nos afastaram. Precisamos reparar essas relações e retornar aos nossos amigos originais."
 LBA_call_back_exiles: "Chamar os Exilados de Volta"
 LBA_call_back_exiles_desc: "Muitos foram exilados da Líbia ou fugiram por conta própria durante o reinado de Gaddafi. A situação agora é diferente, e podemos chamar esses exilados de volta."
 LBA_approach_arab_league: "Aproximar-se da Liga Árabe"
 LBA_approach_arab_league_desc: "Por causa de Gaddafi, não estamos nos melhores termos com nossos companheiros estados árabes. Suas explosões políticas deixaram relações frias com muitos de nossos companheiros árabes. Precisamos consertar esse problema."
 LBA_join_war_on_terror: "Juntar-se à Guerra ao Terror"
 LBA_join_war_on_terror_desc: "O islamismo está sob ataque. Jihadistas e extremistas estão tentando tomar o controle de nossa religião e estão desestabilizando dezenas de países e arruinando as vidas de muitos muçulmanos. É nosso dever proteger nossos irmãos muçulmanos desses fanáticos."
 LBA_join_war_on_terror_tt: "O discurso da 'Guerra ao Terror' foi proferido"
 LBA_oef_trans_sahara: "Operação Juniper Shield"
 LBA_oef_trans_sahara_desc: "O Saara é o esconderijo perfeito para extremistas. Nosso aliado, os Estados Unidos, nos ofereceu uma oportunidade de nos juntarmos às suas operações anti-militantes na região."
 LBA_oef_trans_sahara_tt: "Poderemos intervir em países do §YSael§! ou do §YSaara§! que tenham alto apoio ao §YSalafismo§!"
 LBA_oef_trans_sahara_threat: "Operação Juniper Shield"
 LBA_fatherly_leader: "O Líder Paternal"
 LBA_fatherly_leader_desc: "O título actual de Gaddafi é “Líder Fraterno e Guia da Revolução da Grande Jamahiriya Árabe Líbia Popular Socialista”. Mas a verdade é que Gaddafi está mais próximo de um pai da nação do que de um irmão."
 LBA_libyan_military: "As Forças Armadas Líbias"
 LBA_libyan_military_desc: "As forças armadas líbias, oficialmente as Forças Armadas da Jamahiriya Árabe Líbia, são divididas em exército, marinha e força aérea. Destas, o exército é claramente a mais forte. O próprio exército é dividido em exército regular e corpo da guarda revolucionária. O motivo dessa divisão é que Kadafi queria garantir que houvesse uma organização para manter o exército regular leal."
 LBA_lessons_from_the_past: "Lições do Passado"
 LBA_lessons_from_the_past_desc: "Ao longo de nossa história, não participamos de tantas guerras e, definitivamente, não estivemos do lado vencedor. Fomos atacados várias vezes pela força aérea dos EUA, tivemos um breve e desastroso conflito com o Egito e nossa guerra com o Chade acabou nos custando uma parte considerável de nossas forças armadas, apesar das vitórias iniciais. Se quisermos ter sucesso no futuro, devemos analisar o que fizemos de errado."
 LBA_el_dorado_canyon: "Operação El Dorado Canyon"
 LBA_el_dorado_canyon_desc: "Em 1986, os Estados Unidos bombardearam a Líbia em resposta ao bombardeio da Líbia à discoteca da Alemanha Ocidental 'La Belle', que era popular entre as tropas americanas. Os americanos alvejaram várias instalações militares, incluindo o centro de comando de Gaddafi. O ataque destruiu dezenas de nossas aeronaves. Nossas defesas falharam completamente, pois nenhum caça foi lançado como contra-ação e nossas defesas antiaéreas não começaram a disparar até que os aviões americanos estivessem retornando. Apenas 1 F-111 foi abatido, e o resto escapou ileso."
 LBA_better_aa: "Melhor Defesa Antiaérea"
 LBA_better_aa_desc: "O que está claro do que aconteceu durante o El Dorado Canyon é que nossas capacidades antiaéreas são risíveis. Precisamos estar muito mais bem preparados para aeronaves inimigas no futuro."
 LBA_better_fighter_response: "Melhor Resposta de Caças"
 LBA_better_fighter_response_desc: "Claramente, nossa falha durante o El Dorado Canyon foi nossa resposta de caça irremediavelmente lenta. Nossos pilotos precisam ser muito mais rápidos do chão para interceptar quaisquer inimigos."
 LBA_gulf_of_sidra: "Golfo de Sirte"
 LBA_gulf_of_sidra_desc: "Em 1974, Kadafi reivindicou todo o Golfo de Sirte como águas territoriais, contrariando o direito marítimo internacional. Isso foi contestado pelos Estados Unidos e acabou levando a um aumento das tensões no Golfo. Isso resultou em vários incidentes na região; em 1981, dois SU-22 líbios foram abatidos, em 1986 uma corveta líbia foi afundada e outra gravemente danificada, e em 1989 dois MiG-23 líbios foram destruídos. Em todos esses confrontos, os americanos não sofreram nenhuma perda. Esses incidentes só mostraram como nossa força aérea e nossa marinha são inúteis."
 LBA_toyota_war_guerrilla: "Lições da Guerra da Toyota - Guerra de Guerrilha"
 LBA_toyota_war_guerrilla_desc: "O conflito Chadiano-Líbio dos anos 80 terminou com a chamada Guerra da Toyota. As forças líbias estavam entrincheiradas no norte do Chade há anos. Conforme os chadianos lançavam seu contra-ataque, eles o faziam em veículos técnicos altamente móveis (daí o nome da guerra). Isso permitiu que eles contornassem as guarnições líbias, causando estragos nas linhas de suprimento e unidades solitárias. Essa guerra leve é ​​o que devemos focar também."
 LBA_toyota_war_mobility: "Lições da Guerra da Toyota - Mobilidade"
 LBA_toyota_war_mobility_desc: "O conflito Chadiano-Líbio dos anos 80 terminou com a chamada Guerra da Toyota. As forças líbias estavam entrincheiradas no norte do Chade há anos. Conforme os chadianos lançavam seu contra-ataque, eles o faziam em técnicas altamente móveis (daí o nome da guerra). Isso lhes permitiu superar as formações líbias, até mesmo enfrentando tanques mais lentos e cruzando campos minados ilesos. Este é definitivamente o estilo de guerra de que precisamos."
 LBA_desert_warfare: "Mestres do Deserto"
 LBA_desert_warfare_desc: "A maior parte da Líbia é desértica. Não importa de que direção formos atacados, provavelmente estaremos lutando no calor e na areia. Isso é algo a que nosso povo já está acostumado, e nossos inimigos devem nos temer."
 LBA_desert_warfare_tt: "Modifica qualquer ideia da §YGuerra da Toyota§! que tivermos\n"
 LBA_egypt_war_behind_the_lines: "Guerra Egito-Líbia - Comandos"
 LBA_egypt_war_behind_the_lines_desc: "Em 1977, lutamos uma curta guerra de quatro dias contra o Egito, principalmente devido às relações azedas sobre o Egito assinar um acordo de paz com Israel. Durante a guerra, um batalhão de tanques líbios cruzou o Egito, mas foi rapidamente destruído por um contra-ataque mecanizado. Nos dias seguintes, comandos egípcios lançaram vários ataques contra instalações militares líbias. Esses ataques atrás da linha destruíram muitas instalações militares críticas, e usar essa tática contra nossos inimigos seria útil."
 LBA_egypt_war_behind_the_lines_tt: "Modifica a ideia §Y$LBA_desert_warfare_idea$§!"
 LBA_egypt_war_tank_formations: "Guerra Egito-Líbia - Blindados"
 LBA_egypt_war_tank_formations_desc: "Em 1977, lutamos uma curta guerra de quatro dias contra o Egito, principalmente devido às relações azedas sobre o Egito assinar um acordo de paz com Israel. Durante a guerra, comandos egípcios invadiram a instalação militar líbia. Ao mesmo tempo, um batalhão blindado líbio avançou para o Egito, mas foi rapidamente destruído por um contra-ataque mecanizado egípcio, que então avançou 25 km para a Líbia antes de retornar às suas posições originais. O inspirador ataque mecanizado egípcio é algo que devemos almejar alcançar."
 LBA_activate_arsenal_of_islam: "Ativar o Arsenal do Islã"
 LBA_activate_arsenal_of_islam_desc: "Na década de 1970, Gaddafi fez uma grande maratona de compras e construiu um enorme \"Arsenal do Islã\" para ser usado quando a guerra global com os Estados Unidos e Israel começasse. A guerra nunca aconteceu, mas ainda precisamos desse equipamento. Tudo no arsenal tem décadas e levará tempo e dinheiro para fazer tudo funcionar, mas pelo menos nossos soldados terão algo com que lutar."
 LBA_activate_arsenal_of_islam_gaddafi: "A família Kadafi está no poder e temos o espírito nacional §Y$LBA_revolutionary_guard_corps$§!"
 LBA_activate_arsenal_of_islam_no_gaddafi: "A família Kadafi não está no poder e temos o espírito nacional §Y$LBA_armed_forces_of_arab_jamahiriya$§!"
 LBA_foreign_procurement_lines: "Linhas de Aquisição Estrangeiras"
 LBA_foreign_procurement_lines_desc: "Agora que não estamos mais sujeitos às sanções de armas das Nações Unidas, devemos aproveitar a oportunidade para aumentar novamente nossos estoques de armas."
 LBA_foreign_procurement_lines_tt: "Enquanto a ideia §Y$LBA_foreign_procurement_boosted$§! estiver ativa, as aquisições de armas por meio de focos nos darão 25% mais equipamento!\n"
 LBA_weapons_from_balkans: "Armas dos Bálcãs"
 LBA_weapons_from_balkans_desc: "Muitos países nos Bálcãs estão modernizando seus exércitos para serem mais compatíveis com a OTAN. Isso significa que seus estoques antigos precisam ir para algum lugar. Esta é uma ótima oportunidade para conseguirmos um monte de armas por um preço baixo!"
 LBA_foreign_procurement_lines_cheap_tt: "Por causa de §Y$LBA_foreign_procurement_boosted$§!:\n"
 LBA_new_tanks: "Tanques Modernos"
 LBA_new_tanks_desc: "A maioria dos tanques que usamos são os antigos tanques T-55 e T-62. Embora decentes considerando o nível regional. Se tivermos que enfrentar países mais desenvolvidos, seremos irremediavelmente superados. Precisamos obter algo mais moderno para nossos estoques."
 LBA_new_trucks: "Programa de Motorização"
 LBA_new_trucks_desc: "Nossas unidades motorizadas dirigem por aí em caminhões ou Toyota Technicals, fazendo com que nosso exército pareça um bando de guerrilheiros. Exércitos modernos têm veículos de pessoal semelhantes a tanques, que também deveríamos ter."
 LBA_new_artillery: "Apoio de Fogo Aprimorado"
 LBA_new_artillery_desc: "Qualquer exército vai precisar de um elemento de suporte de fogo se quiser ter sucesso no campo de batalha. Precisamos modernizar nosso corpo de artilharia."
 LBA_local_supply_system: "Sistemas de Suprimento Locais"
 LBA_local_supply_system_desc: "Anos de sanções a armas nos mostraram o quão fácil é ser cortado das linhas de suprimento de novos equipamentos. Para remediar isso, devemos expandir nossa produção local para que peças de reposição e substituições estejam mais facilmente disponíveis."
 LBA_expand_airbases: "Expandir Bases Aéreas"
 LBA_expand_airbases_desc: "Muitas das bases da Força Aérea da Líbia estão em condições precárias. Se quisermos expandir nossa força aérea, precisamos primeiro expandir as instalações para armazenar nossos aviões."
 LBA_new_fighters: "Superioridade Aérea"
 LBA_new_fighters_desc: "Nossas experiências anteriores lutando contra a Força Aérea Americana mostram a clara falta de caças adequados. Com nossos aviões atuais, poderíamos muito bem estar empinando pipas contra eles. Precisamos de algo muito melhor."
 LBA_new_helicopters: "Apoio de Combate Aproximado"
 LBA_new_helicopters_desc: "Observando os conflitos africanos, vimos a eficácia dos helicópteros de ataque. Voar baixo contra um inimigo oculto sem capacidades AA é sua principal força. Voar jatos é inútil, quando uma forma mais eficaz de dar suporte às nossas tropas são os helicópteros."
 LBA_sabha_launch_site: "Local de lançamento de Sabha"
 LBA_sabha_launch_site_desc: "Na década de 1980, uma empresa da Alemanha Ocidental, a OTRAG, estava usando o Sabha Oasis como um local de teste para seus foguetes espaciais experimentais. Originalmente testado em Shaba, na República Democrática do Congo (então Zaire), o teste foi transferido para a Líbia até 1987. O local de lançamento de Sabha também foi um local de teste remoto para o programa espacial soviético até 1991. Poderíamos reformar o local de lançamento para ser usado para nossos próprios propósitos de teste."
 LBA_review_the_navy: "Revisar a Marinha"
 LBA_review_the_navy_desc: "Nossa marinha é composta principalmente de velhos submarinos e corvetas soviéticas inoperantes dos anos 1950 e 60, com algumas corvetas pesadas 'mais novas' da classe Koni. A maioria desses navios está em péssimas condições, e eles são realmente adequados apenas para defesa costeira. A marinha precisa urgentemente de modernização."
 LBA_expand_tripoli_docks: "Expandir as Docas de Trípoli"
 LBA_expand_tripoli_docks_desc: "Trípoli atualmente hospeda nosso maior cais. As instalações lá suportam navios de reparo de até 6000 toneladas de porte bruto. Para expansão futura para navios maiores, precisamos aumentar essa capacidade ainda mais."
 LBA_expand_benghazi_docks: "Expandir as Docas de Benghazi"
 LBA_expand_benghazi_docks_desc: "Embora o cais de Benghazi não seja tão impressionante quanto o de Trípoli, ele ainda é uma base vital para nossa marinha. Atualmente, há alguns cais flutuantes no porto. Devemos expandir o cais para uma função similar à de Trípoli."
 LBA_refurbish_submarines: "Reformar os Submarinos"
 LBA_refurbish_submarines_desc: "Temos dois submarinos da classe Foxtrot. Seis no total foram comprados da União Soviética em 1982, mas, infelizmente, quatro deles já chegaram a um estado completamente irreparável. Ainda há dois parados na base naval de Benghazi, em mau estado. Com um pequeno investimento, devemos conseguir deixá-los em condições de navegar novamente."
 LBA_new_corvettes: "Novas Corvetas"
 LBA_new_corvettes_desc: "Para reforçar nossa marinha, precisamos de novas corvetas. As da Guerra Fria simplesmente não servem mais."
 LBA_tripoli_drydocks: "Estaleiros de Trípoli"
 LBA_tripoli_drydocks_desc: "Como Trípoli é nossa maior base naval, faz sentido expandir os estaleiros de lá para poder construir e consertar navios."
 LBA_shuffle_officers: "Reorganizar os Oficiais"
 LBA_shuffle_officers_desc: "Uma das táticas de Gaddafi para manter os militares sob controle é a rotação frequente de oficiais. Os oficiais são frequentemente trocados de uma unidade para outra, e novos são promovidos para tomar seus lugares. Isso significa que sempre há muitos oficiais jovens gratos por suas promoções, e os oficiais dissidentes podem ser enviados para postos distantes e sem importância."
 LBA_expand_rgc: "Expandir a RGC"
 LBA_expand_rgc_desc: "O Corpo da Guarda Revolucionária é a guarda de elite do regime. Não podemos confiar na lealdade do exército regular. Precisamos expandir a Guarda Revolucionária para uma força ainda maior."
 LBA_shift_to_military: "Mudar para o Exército"
 LBA_shift_to_military_desc: "Podemos ter dado muito poder ao Corpo da Guarda Revolucionária. Precisamos mudar o equilíbrio de poder para o exército regular, pois uma pequena elite provavelmente acabará derrubando nosso regime."
 LBA_lock_supplies: "Bloquear os Suprimentos"
 LBA_lock_supplies_desc: "Alguns dos nossos suprimentos militares são controlados pelo Corpo da Guarda Revolucionária. Isso permite que o RGC controle os estoques do exército regular. Devemos colocar toda a logística sob o RGC para que os militares não tenham chance de se revoltar, pois terão acesso limitado a armas e munições. E quando todo o equipamento for armazenado ordenadamente nos depósitos do RGC em vez de ser usado, haverá ainda menos desgaste."
 LBA_disarm_rgc: "Desarmar a RGC"
 LBA_disarm_rgc_desc: "O Corpo da Guarda Revolucionária tem retido armas que são destinadas ao exército. Precisamos apreender essas armas de volta aos seus legítimos donos."
 LBA_new_officer_corps: "Novo Corpo de Oficiais"
 LBA_new_officer_corps_desc: "Há muitas estrelas em ascensão tanto na Guarda Revolucionária quanto no Exército. Precisamos colocar esses homens rapidamente em posições importantes."
 LBA_army_fit_for_libya: "Um Exército Adequado à Líbia"
 LBA_army_fit_for_libya_desc: "Nas palavras de Mutassim Gaddafi, filho de Muammar Gaddafi; 'Há 60 milhões de argelinos a oeste, 80 milhões de egípcios a leste, temos a Europa à nossa frente e enfrentamos a África Subsaariana com seus problemas ao sul'. Simplesmente não podemos competir com números. Portanto, devemos nos concentrar na qualidade em vez da quantidade."
 LBA_army_fit_for_libya_tt: "Modifica o §Y$LBA_revolutionary_guard_corps$§! ou o §Y$LBA_armed_forces_of_arab_jamahiriya$§!"
 LBA_economy_of_libya: "Economia da Líbia"
 LBA_economy_of_libya_desc: "A economia da Líbia é baseada na produção de petróleo. 95% das nossas exportações e 60% do nosso PIB vêm da indústria petrolífera. Embora o nosso petróleo nos gere muito dinheiro (e nos tenha proporcionado o Índice de Desenvolvimento Humano mais alto da África), é arriscado tornar o nosso país tão dependente de um único recurso e das pessoas que o possuem. Para garantir a segurança da economia líbia, a diversificação é necessária."
 LBA_train_depot: "Depósito de Trens"
 LBA_train_depot_desc: "Quando se trata de transporte ferroviário, a Líbia é uma raridade no Norte da África. Não há ferrovias ativas em todo o país. Os colonizadores italianos construíram algumas linhas menores perto de Trípoli e Benghazi, mas ambas foram fechadas nos anos 60. Agora, nada existe. Precisamos levar a Líbia a um sistema de transporte moderno e, para começar, precisamos de locomotivas para nossas futuras ferrovias."
 LBA_tripoli_to_misrata: "De Trípoli a Misrata"
 LBA_tripoli_to_misrata_desc: "Nossa região da capital deve ser nossa primeira prioridade para uma nova ferrovia. Conectar as principais cidades de Trípoli e Misrata mostrará ao mundo que nós também podemos construir ferrovias."
 LBA_misrata_to_sirte: "De Misrata a Sirte"
 LBA_misrata_to_sirte_desc: "Depois de conectar Misrata com Trípoli, devemos continuar a linha para conectar a Sirte, um importante centro para nossa indústria petrolífera."
 LBA_tobruk_to_benghazi: "De Benghazi a Tobruk"
 LBA_tobruk_to_benghazi_desc: "Benghazi é nosso porto mais importante na Cirenaica. Precisamos criar uma conexão de lá perto da nossa fronteira com o Egito para melhorar nosso tempo de resposta militar em caso de conflito. A distância é muito longa, mas com tempo e dinheiro suficientes, podemos fazer isso."
 LBA_benghazi_to_brega: "De Benghazi a Brega"
 LBA_benghazi_to_brega_desc: "Brega é um importante centro de refino para nossa indústria petrolífera. Devemos conectá-la por ferrovia ao nosso porto em Benghazi."
 LBA_connect_east_west_rails: "Conectar Leste e Oeste"
 LBA_connect_east_west_rails_desc: "Agora que construímos redes ferroviárias no leste e no oeste, é hora de conectar as duas redes. Agora os líbios poderão viajar pelo país em poucos instantes."
 LBA_connect_sabha: "Conectar Sabha"
 LBA_connect_sabha_desc: "Sabha é a capital da região de Fezzan, uma importante base aérea da Força Aérea Líbia, e chegou a servir de local de testes para foguetes espaciais da Alemanha Ocidental. Também há alguma mineração de minério de ferro na região e, conectando-a por ferrovia, podemos expandir mais as operações de mineração."
 LBA_connect_jawf: "Conectar Al-Jawf"
 LBA_connect_jawf_desc: "Al-Jawf é basicamente a única cidade maior do distrito de Kufra, no sul da Líbia. Embora economicamente insignificante, poderia servir de base para proteger nosso flanco sul."
 LBA_libyan_rail: "Ferrovia Líbia"
 LBA_libyan_rail_desc: "Finalmente chegamos a uma situação em que o governo não precisa cobrir cada dinar que as ferrovias precisam. Por causa disso, deveríamos organizar as ferrovias em uma empresa ferroviária estatal da Líbia. A quantidade de pessoas ou empresas que usam a ferrovia não é suficiente para cobrir todos os seus custos, mas pelo menos agora há espaço para crescimento."
 LBA_kufra_solar_plant: "Usina Solar de Kufra"
 LBA_kufra_solar_plant_desc: "A Líbia assa sob o sol quente da África. Pesquisas atuais mostram que a Líbia é um lugar ótimo para painéis solares. Painéis solares precisam de muita manutenção, e agora que conectamos Al-Jawf à nossa rede ferroviária, será um bom lugar para construir uma usina de energia solar."
 LBA_expand_tripoli_airport: "Expandir o Aeroporto de Trípoli"
 LBA_expand_tripoli_airport_desc: "O Aeroporto de Trípoli é nosso principal aeroporto internacional. Expandi-lo aumentará nossa conectividade com o resto do mundo."
 LBA_expand_benina_airport: "Expandir o Aeroporto de Benina"
 LBA_expand_benina_airport_desc: "O Aeroporto de Benina é o 2º maior aeroporto da Líbia. Ele está localizado na cidade de Benina, bem ao lado de Benghazi. É um aeroporto vital para trazer trabalhadores migrantes para trabalhar nos campos de petróleo."
 LBA_expand_tripoli_port: "Expandir o Porto de Trípoli"
 LBA_expand_tripoli_port_desc: "O porto de Trípoli é um dos mais antigos do Mediterrâneo, existindo desde os tempos romanos. É a rota de importação mais vital para a Líbia e expandi-lo nos dará mais espaço para expandir nossa economia."
 LBA_expand_benghazi_port: "Expandir o Porto de Benghazi"
 LBA_expand_benghazi_port_desc: "O porto de Benghazi foi fundado pelos gregos no século VI a.C. Atualmente, ele serve como um grande centro de exportação de nossos produtos petrolíferos. É importante que continuemos expandindo para encorajar mais crescimento."
 LBA_organize_desert_trips: "Organizar Viagens ao Deserto"
 LBA_organize_desert_trips_desc: "A Líbia tem muito a oferecer aos turistas: as dunas e os oásis do Saara, ruínas gregas e romanas, fortes otomanos e campos de batalha da Segunda Guerra Mundial. Precisamos aproveitar esses atrativos que temos e atrair mais turistas."
 LBA_derna_windpark: "Parque Eólico de Derna"
 LBA_derna_windpark_desc: "A Líbia tem velocidades médias de vento muito altas. Perto da costa de Derna, por exemplo, o vento tem média de 7,5 m/s. Isso torna Derna um lugar perfeito para construir um parque eólico. Moinhos de vento são usados para bombear água de oásis desde a década de 1940, então definitivamente temos experiência com eles."
 LBA_expand_tourism: "Expandir o Turismo"
 LBA_expand_tourism_desc: "Precisamos expandir ainda mais o turismo para tornar a Líbia um destino mais atraente para os turistas, assim como Latakia na Síria, o Sinai no Egito e Túnis na Tunísia."
 LBA_stock_exchange: "Fundar a Bolsa de Valores"
 LBA_stock_exchange_desc: "A Líbia não tem bolsa de valores. Para nos integrarmos melhor aos mercados internacionais, devemos fundar uma em Trípoli. As pessoas terão a opção de participar de várias empresas estatais."
 LBA_gmmr_kufra: "GMMR Kufra"
 LBA_gmmr_kufra_desc: "A cidade desértica de Al-Jawf, no sul da Líbia, no distrito de Al-Kufrah, é uma das poucas cidades da área. Ela fica bem em cima do Aquífero de Arenito da Núbia. É um bom alvo para expandir o Grande Rio Artificial. Devemos destinar fundos adicionais para acelerar o projeto."
 LBA_gmmr_ghadames: "GMMR Ghadames"
 LBA_gmmr_ghadames_desc: "No oeste do país, perto de Ghadames, há outro aquífero que podemos utilizar. Se adicionarmos essa área à rede do GMMR, aumentaremos sua capacidade."
 LBA_western_mountain_power_plant: "Usina das Montanhas Ocidentais"
 LBA_western_mountain_power_plant_desc: "A Líbia atualmente tem apenas uma usina antiga em operação. Precisamos garantir nosso fornecimento de eletricidade e construir mais usinas perto da capital. Há planos de construir uma usina de turbina a gás de ciclo combinado perto de Al Garbi, e devemos ajudar a financiá-la."
 LBA_gmmr_connect_east_west: "Concluir o GMMR"
 LBA_gmmr_connect_east_west_desc: "A última fase do Grande Rio Artificial consiste em ligar as redes de condutas no Ocidente e no Oriente através da construção de um gasoduto de Sirte a Misrata. Depois disso, construímos verdadeiramente a 8ª Maravilha do Mundo."
 LBA_zawia_power_plant: "Usina de Zawia"
 LBA_zawia_power_plant_desc: "Na cidade de Zawia, há um bom local para uma usina que poderia utilizar tanto gás natural quanto petróleo como combustível. Afinal, temos muito de ambos."
 LBA_convert_pipe_factories: "Converter as Fábricas de Tubos"
 LBA_convert_pipe_factories_desc: "Agora que terminamos o GMMR, precisamos decidir o que fazer com as fábricas de tubos construídas para ele. Embora algumas sejam necessárias para reparos futuros, devemos converter as demais fábricas para produzir uma grande variedade de tubos e equipamentos hidráulicos para exportação."
 LBA_create_ministry_of_agriculture: "Criar o Ministério da Agricultura"
 LBA_create_ministry_of_agriculture_desc: "A Líbia não tem ministério da agricultura, e todos os projetos agrícolas são tratados pelo gabinete do Inspetor-Geral. Se quisermos reformar nosso setor agrícola, precisamos dedicar pessoas exclusivamente à agricultura. Isso permitirá um uso mais eficiente do setor agrícola que temos agora."
 LBA_desalination_plants: "Usinas de Dessalinização"
 LBA_desalination_plants_desc: "Uma maneira de obter água doce é a partir da água do mar. Por meio de processos industriais, podemos reduzir o nível de sal e tornar a água potável. Devemos construir usinas de dessalinização em comunidades costeiras para aumentar seu acesso à água."
 LBA_expand_agriculture: "Expandir a Agricultura"
 LBA_expand_agriculture_desc: "Agora que expandimos nosso suprimento de água, devemos conseguir utilizar mais das terras aráveis que temos."
 LBA_land_reform: "Reforma Agrária"
 LBA_land_reform_desc: "Os maiores desafios da agricultura líbia têm sido a falta de água doce e a lei islâmica de herança. O problema da água foi resolvido, mas a lei permanece. No momento da herança, uma fazenda é dividida entre todos os filhos. Isso fragmentou as fazendas em tamanhos cada vez menores. Essa lei precisa ser reformada para que as fazendas mantenham seu tamanho e até se expandam, se necessário. Isso não eliminará, é claro, os obstáculos naturais que temos para a agricultura, mas é o melhor que podemos fazer em nossa situação."
 LBA_foreign_food_imports: "Importações de Alimentos"
 LBA_foreign_food_imports_desc: "É inútil lutar uma batalha difícil. A Líbia simplesmente não foi feita para cultivar sua própria comida. Precisamos estabelecer uma rede de comércio robusta para garantir o fornecimento de alimentos de outros países. Seremos mais dependentes de outros países, mas isso deve eliminar os problemas com nossa agricultura."
 LBA_continue_nationalised_economy: "Continuar a Economia Nacionalizada"
 LBA_continue_nationalised_economy_desc: "A maioria das grandes corporações da Líbia é controlada pelo Estado. Por razões estratégicas, isso é necessário. Não podemos permitir que empresas estrangeiras venham colonizar nosso povo, mesmo que isso signifique que não teremos um lucro tão grande."
 LBA_liberalise_economy: "Privatizar a Economia"
 LBA_liberalise_economy_desc: "Por décadas, o governo líbio tem controlado ativamente a economia do país, sendo dono de muitas de suas maiores empresas. Para facilitar um crescimento econômico mais rápido, devemos começar a privatizar vários setores da economia."
 LBA_expand_agricultural_bank: "Expandir o Banco Agrícola"
 LBA_expand_agricultural_bank_desc: "O Banco Agrícola da Líbia é responsável por fornecer orientação e aconselhamento sobre problemas agrícolas, conceder empréstimos a cooperativas agrícolas e desenvolver a comunidade agrícola da Líbia. Agora que expandimos nosso setor agrícola, precisamos expandir os recursos do banco para promover o uso eficiente das terras agrícolas."
 LBA_expand_lisco: "Expandir a Lisco"
 LBA_expand_lisco_desc: "A Lisco, ou Companhia Líbia de Ferro e Aço, é uma das maiores siderúrgicas do norte da África. Os maiores usuários internos dos produtos da Lisco são a Companhia Geral de Tubulações e a Corporação Nacional de Petróleo. Investindo neles, podemos expandir a produção de aço da Líbia e oferecer melhores oportunidades de expansão para nosso setor petrolífero."
 LBA_float_national_commercial_bank: "Flutuar O Banco Comercial Nacional"
 LBA_float_national_commercial_bank_desc: "Devemos disponibilizar as ações do National Commercial Bank para o setor público. Isso nos permitirá reunir fundos para a operação do banco e trazer algum capital muito necessário para o país."
 LBA_join_wto: "Ingressar na OMC"
 LBA_join_wto_desc: "Ainda não somos membros da Organização Mundial do Comércio. Devemos solicitar a adesão para garantir ao mundo que queremos seguir os padrões internacionais no comércio. Isso deve incentivar o investimento estrangeiro no país."
 LBA_nationalise_arabian_cement_company: "Nacionalizar a Companhia Árabe de Cimento"
 LBA_nationalise_arabian_cement_company_desc: "A Companhia Árabe de Cimento é a maior produtora de cimento, cal e gesso do país. Devemos nacionalizá-la para garantir que nossas necessidades estratégicas de materiais de construção sejam atendidas."
 LBA_handle_national_oil_corporation: "Lidar com a Corporação Nacional de Petróleo"
 LBA_handle_national_oil_corporation_desc: "A Corporação Nacional de Petróleo controla grande parte dos campos de petróleo do nosso país. Precisamos orientar suas políticas mais em direção à nossa política nacional."
 LBA_handle_national_oil_corporation_tt1: "Se tivermos concluído o foco §Y$LBA_continue_nationalised_economy$§!, então"
 LBA_handle_national_oil_corporation_tt2: "Se tivermos concluído o foco §Y$LBA_liberalise_economy$§!, então"
 LBA_return_arabian_gulf_company_shares: "Devolver as Ações da Arabian Gulf Oil Company"
 LBA_return_arabian_gulf_company_shares_desc: "A Arabian Gulf Oil Company foi formada em 1971, quando a Líbia nacionalizou as ações detidas pela British Petroleum. Atualmente, a petrolífera é uma subsidiária da Corporação Nacional de Petróleo. Devemos tornar as ações da empresa públicas novamente e devolver uma parcela justa à BP. Isso deve garantir uma exploração mais eficiente do petróleo líbio."
 LBA_military_commission_to_truck_and_bus_company: "Militarizar a Companhia de Caminhões e Ônibus"
 LBA_military_commission_to_truck_and_bus_company_desc: "A Companhia de Caminhões e Ônibus é uma fabricante líbia de ônibus e caminhões, criada como joint venture com a empresa italiana IVECO na década de 1970. Ela fabrica veículos pesados há décadas e devemos utilizar seu know-how para produzir veículos para nossas forças armadas."
 LBA_privatise_maritime_transport_company: "Privatizar a GNMTC"
 LBA_privatise_maritime_transport_company_desc: "A GNMTC, ou Companhia Nacional Geral de Transporte Marítimo, é uma empresa estatal de navegação que opera uma frota de embarcações de vários tamanhos ao redor do mundo. Houve até planos de começar a operar navios de cruzeiro. Devemos privatizar a empresa e criar oportunidades para o início da construção naval local na Líbia."
 LBA_state_driven_economy: "Uma Economia Conduzida pelo Estado"
 LBA_state_driven_economy_desc: "A maior parte da economia líbia agora é controlada pelo estado central. Isso pode não afogar nosso povo em dinheiro, mas pelo menos as pessoas sabem que têm empregos disponíveis para elas, e o interesse do estado é fornecer bem-estar para elas, não em gerar lucros para os outros."
 LBA_further_resource_expansion: "Maior Extração de Recursos"
 LBA_further_resource_expansion_desc: "Devemos continuar extraindo recursos do nosso solo e até expandir para novas formas de produção. Precisaremos de mais recursos para sustentar nossa economia futura."
 LBA_modern_economy: "Uma Economia Moderna"
 LBA_modern_economy_desc: "Conseguimos reformar a economia da Líbia tirando-a da estagnação da Guerra Fria. Agora somos mais eficientes, e o crescimento (e os lucros) futuros parecem em tendência de alta."
 LBA_negotiations_with_un: "Negociações com a ONU"
 LBA_negotiations_with_un_desc: "À medida que a receita do petróleo líbio começou a aumentar na década de 1970, Gaddafi aumentou muito seu apoio a vários grupos rebeldes em todo o mundo. A Líbia foi acusada de vários ataques terroristas internacionais, incluindo o atentado de La Belle em 1986, o atentado de Lockerbie em 1988 e a queda do voo 772 da UTA em 1989. Eventualmente, a Líbia foi colocada sob extensas sanções pela ONU, o que levou a Líbia a entregar dois dos suspeitos de Lockerbie às autoridades escocesas em 1999. As sanções ainda estão em vigor e precisamos abrir uma linha de negociação com a ONU para removê-las."
 LBA_meeting_with_taliban: "Reunir-se com o Talibã"
 LBA_meeting_with_taliban_desc: "O Talibã está bravamente lutando contra as potências coloniais ocidentais. Precisamos estreitar laços com eles e ajudá-los em sua luta contra a Nova Ordem Mundial."
 LBA_assassinate_dissidents: "Assassinar Dissidentes"
 LBA_assassinate_dissidents_desc: "Muitos líbios exilados fazem campanha abertamente contra o nosso regime. Essa difamação deve ser interrompida e essas pessoas devem ser eliminadas."
 LBA_meet_hezbollah: "Reunir-se com o Hezbollah"
 LBA_meet_hezbollah_desc: "O Hezbollah luta contra o sionismo com a ajuda do Irã. Ganhando influência no Hezbollah, conquistamos uma forte posição em nossa luta contra Israel."
 LBA_house_terrorists: "Abrigar Terroristas"
 LBA_house_terrorists_desc: "Há muitos lutadores pela liberdade, o que o resto do mundo chama de terroristas, lutando contra o colonialismo no Oriente Médio e no Saara. Precisamos fornecer abrigos seguros para essas pessoas para que tenham um lugar para se reagrupar e se recuperar. Talvez até consigamos recrutar alguns deles para nossas fileiras."
 LBA_celebrate_lockerbie_bombers: "Celebrar o Atentado de Lockerbie"
 LBA_celebrate_lockerbie_bombers_desc: "Quando lançamos um avião bem em cima da cidade de Lockerbie, o mundo sabia do que éramos capazes. Não deveríamos ter vergonha desse ato, pois o mundo deveria tremer de terror com o que podemos fazer quando estamos com raiva."
 LBA_wmds: "Adquirir Centrífugas"
 LBA_wmds_desc: "Desde o início do programa nuclear líbio na década de 1970, a maior parte do conhecimento e da obtenção de materiais ficou a cargo de Friedrich Tinner, um engenheiro nuclear suíço. Ele ainda chefia nosso programa nuclear e devemos usar suas conexões para começar a construir centrífugas para enriquecimento nuclear."
 LBA_start_building_reactor_desc: "Em 1979, a União Soviética construiu um reator de pesquisa em Tajoura sob a supervisão da AIEA. No entanto, isso não é adequado para nossas centrífugas e para a produção de armas nucleares. Precisamos construir um reator nuclear adequado para a produção de urânio."
 LBA_start_building_reactor_tt: "§RSe algum país for louco o suficiente para começar a atacar países com possíveis armas de destruição em massa, podemos ser um alvo para eles!§!"
 LBA_start_building_reactor: "Começar a Construir um Reator"
 LBA_arms_smuggling: "Contrabandear Armas"
 LBA_arms_smuggling_desc: "Devido às sanções internacionais, não podemos realmente comprar armas legalmente. No entanto, ainda temos alguns canais por onde podemos trazer mais armas para nossas tropas."
 LBA_buy_nukes: "Comprar Armas Nucleares"
 LBA_buy_nukes_desc: "Muammar Kadafi tentou adquirir armas nucleares de outros países várias vezes; em 1970, quando Kadafi visitou a China, pediu ao premiê Zhou Enlai que fornecesse à Líbia uma arma nuclear para se proteger do programa nuclear israelense. Em 1974, a Líbia ingressou no programa nuclear Projeto-706 do Paquistão, mas foi expulsa em 1978, quando o general Zia-ul-Haq assumiu o poder. Em 1984, um pacto nuclear foi assinado com a Índia, mas nenhuma ação concreta foi tomada. Quando a União Soviética colapsou, em 1991, Kadafi tentou usar o caos para adquirir materiais nucleares, sem sucesso. Talvez tenha chegado a hora de tentar adquirir armas nucleares de um terceiro país mais uma vez?"
 LBA_buy_nukes_tt: "§RSe formos pegos com uma arma nuclear, as potências ocidentais certamente intervirão!§!"
 LBA_compensation_to_lockerbie_victims: "Compensação às Vítimas de Lockerbie"
 LBA_compensation_to_lockerbie_victims_desc: "Para consertar nossas relações com o Ocidente, especialmente com o Reino Unido, devemos chegar a um acordo para pagar algumas reparações às famílias das vítimas de Lockerbie. Isso mostraria que levamos a sério nosso compromisso de melhorar nossa posição internacional."
 LBA_disarmament_program: "Programa de Desarmamento"
 LBA_disarmament_program_desc: "Temos planos para vários reatores de enriquecimento. Também possuímos centrífugas e urânio. Temos estoques de gás mostarda, gás sarin e os produtos químicos para fazê-los. Tudo isso precisa ir e ser destruído sob supervisão ocidental. Essas são as condições dadas a nós pelo Ocidente. Se continuarmos com o programa deles, eles prometeram começar a aliviar algumas das sanções."
 LBA_disarmament_program_tt: "Entregaremos §Y[LBA.LBA_friedrich_tinner.GetName]§! às autoridades suíças para que decidam o que fazer com ele."
 LBA_remove_sanctions: "Remover as Sanções"
 LBA_remove_sanctions_desc: "O Ocidente finalmente concordou em suspender nossas sanções. Como os convencemos de que não somos mais uma ameaça, somos bem-vindos de volta à comunidade internacional."
 LBA_invite_foreign_investors: "Convidar Investidores Estrangeiros"
 LBA_invite_foreign_investors_desc: "Agora que estamos livres das sanções, devemos convidar investidores estrangeiros para o país a fim de melhorar a economia."
 LBA_arms_deals_with_italy: "Acordo de Armas com a Itália"
 LBA_arms_deals_with_italy_desc: "Apesar de ser nossa antiga senhora colonial, ainda temos relações relativamente cordiais com a Itália. Eles também têm forças armadas muito avançadas. Faz sentido alinharmos nossas forças armadas às deles."
 LBA_arms_deals_with_italy_tt: "Se aceitarem, então\n"
 LBA_approach_western_leaders: "Aproximar-se dos Líderes Ocidentais"
 LBA_approach_western_leaders_desc: "O Ocidente é o principal instigador das sanções contra nós. Devemos nos aproximar de diversos líderes ocidentais para melhorar nossas relações com eles."
 LBA_taxation_deal_with_uk: "Acordo Tributário com o Reino Unido"
 LBA_taxation_deal_with_uk_desc: "O Reino Unido tem uma das maiores redes de tratados de dupla tributação do mundo. Um tratado de dupla tributação permite que uma empresa opere em vários países, sem ter que pagar impostos sobre o mesmo lucro várias vezes. Isso incentiva as empresas a se ramificarem e estabelecerem escritórios permanentes em outros países. Devemos assinar um acordo semelhante com o Reino Unido para aumentar nossa atratividade econômica."
 LBA_compensation_from_italy: "Compensação da Itália"
 LBA_compensation_from_italy_desc: "Por anos, a Itália explorou nosso país como colônia. Ouvimos informações de que a Itália pode reagir positivamente ao pagamento de reparações do período colonial para melhorar sua imagem pública. Devemos contatá-los e tentar negociar algum tipo de acordo."
 LBA_request_usaid: "Solicitar a USAID"
 LBA_request_usaid_desc: "A USAID é um programa de ajuda internacional administrado pelo governo dos EUA, com foco em alívio de desastres e pobreza. Muitos países no mundo em desenvolvimento recebem a ajuda. Nós também deveríamos nos juntar ao programa. Isso aumentará a influência americana no país, mas tapará alguns buracos em nosso orçamento."
 LBA_neighbourly_politics: "Política de Vizinhança"
 LBA_neighbourly_politics_desc: "A Líbia é cercada por muitas nações, mas só temos boas conexões com poucas. As relações com o Egito e o Chade estão estremecidas por guerras passadas, o Sudão, o Níger e a Argélia são separados de nós por vastos desertos e a Europa é muito hostil ao nosso regime. Só a Tunísia mantém relações amistosas conosco e, mesmo assim, eles construíram fortificações defensivas e cercas de fronteira entre nossos dois países. Abrir-nos ao mundo será difícil."
 LBA_close_ties_sahrawi: "Laços Mais Estreitos com os Saarauís"
 LBA_close_ties_sahrawi_desc: "Temos sido um grande apoiador da Frente POLISARIO em Sahrawi desde a década de 1980. Muitas das armas para seu Exército de Libertação vêm de nós ou da Argélia, e não é incomum que estudantes sahrawi viajem para a Líbia para estudar. Nosso apoio aos sahrawi é a maior história de sucesso contra o colonialismo, e precisamos aumentar nosso apoio a eles."
 LBA_switch_to_morocco: "Abandonar os Saarauís"
 LBA_switch_to_morocco_desc: "Apoiar os saharauis azedou nossas relações com o Marrocos. O Marrocos é uma potência econômica em ascensão e eles estão em oposição à Argélia, uma nação poderosa bem ao nosso lado. Faria mais sentido abandonar nosso apoio insensato aos saharauis e construir termos amigáveis ​​com o Marrocos."
 LBA_support_algeria: "Apoie a Argélia"
 LBA_support_algeria_desc: "Tal como nós, a Argélia é um apoiante de longa data do Saharaui. Eles são rivais de Marrocos há muito tempo, por isso faz sentido construirmos laços mais estreitos com eles."
 LBA_condemn_spanish_colonialism: "Condenar o Colonialismo Espanhol"
 LBA_condemn_spanish_colonialism_desc: "O Saara Ocidental era propriedade dos espanhóis antes de eles darem a área ao Marrocos, estabelecendo a base para o conflito do Saara Ocidental. No entanto, os espanhóis se recusaram a devolver as cidades de Ceuta e Melilla ao Marrocos, alegando que elas são parte integrante da Espanha. Isso não passa de uma desculpa. Essas áreas são legitimamente marroquinas."
 LBA_influence_mauritania: "Influenciar a Mauritânia"
 LBA_influence_mauritania_desc: "A Mauritânia travou uma curta guerra contra o Marrocos pelo Saara Ocidental depois que a Espanha se retirou da região. Eles não reivindicam mais o território, mas seguiram o conflito do Saara Ocidental intensamente e são um dos apoiadores da Frente Polisário. É importante aumentar nosso controle sobre eles para resolver o conflito do Saara Ocidental."
 LBA_casablanca_accords: "Acordos de Casablanca"
 LBA_casablanca_accords_desc: "O conflito no Saara Ocidental está congelado há décadas, sem que ninguém consiga resolvê-lo. Precisamos usar nossa influência na região para resolver o conflito."
 LBA_casablanca_accords_tt: "A Missão ficará ativa por §Y365 dias§!. Enquanto a missão estiver ativa, teremos que convencer os outros participantes (§Y[ALG.GetNameWithFlag], [MOR.GetNameWithFlag], [SHA.GetNameWithFlag] e [MAU.GetNameWithFlag]§!) da solução que escolhermos. A principal forma de fazer os países concordarem com nossa solução é a §YInfluência§!\n\n"
 LBA_influence_malta: "Influenciar Malta"
 LBA_influence_malta_desc: "Malta é um importante ponto de apoio entre a Itália e a Líbia. Se uma potência hostil estivesse presente lá, teria facilidade para dominar nossa costa oeste. Devemos garantir que mantenhamos relações amistosas com Malta."
 LBA_italian_trade: "Comércio Italiano"
 LBA_italian_trade_desc: "Apesar de ser nossa antiga senhora colonial, a Itália é uma parceira importante para nós. Sua proximidade faz dela uma boa porta de entrada para a Europa."
 LBA_crete_safety: "Proteger Creta"
 LBA_crete_safety_desc: "Creta é controlada por um país da OTAN e poderia facilmente ser usada para dominar o leste da Líbia. Precisamos tomar medidas para proteger nosso litoral leste."
 LBA_protect_malta: "Proteger Malta"
 LBA_protect_malta_desc: "Nossa influência em Malta está crescendo. Precisamos trazê-la totalmente para nossa esfera de influência para proteger Trípoli de um ataque marítimo."
 LBA_protect_crete: "Proteger Creta"
 LBA_protect_crete_desc: "Creta é de grande importância estratégica para nós. Precisamos pressionar pelo controle da ilha agora, antes que seja tarde demais."
 LBA_libyan_sea_dominance: "Controlar o Mar da Líbia"
 LBA_libyan_sea_dominance_desc: "Com nosso controle sobre Malta e Creta, criamos uma muralha protetora para nosso litoral vulnerável. Nossos navios terão muito mais facilidade para operar no Mar da Líbia."
 LBA_approach_hamas: "Aproximar-se do Hamas"
 LBA_approach_hamas_desc: "O Hamas é a única força verdadeira tentando impedir o sionismo. Precisamos construir laços melhores com eles para nos prepararmos para derrubar Israel."
 LBA_send_fighters_to_hamas: "Enviar Combatentes ao Hamas"
 LBA_send_fighters_to_hamas_desc: "Embora os palestinos estejam resistindo bravamente aos invasores sionistas, a verdade simples é que eles estão em menor número. Precisamos organizar um grupo de voluntários para viajar à Palestina e se juntar às fileiras do Hamas."
 LBA_new_intifada: "Nova Intifada"
 LBA_new_intifada_desc: "Chegou a hora de o Hamas iniciar uma nova intifada contra os sionistas. Com o nosso apoio, ela será mortal."
 LBA_all_are_idiots: "Todos São Idiotas"
 LBA_all_are_idiots_desc: "Como disse o grande líder Kadafi, tanto os israelenses quanto os palestinos são idiotas que não conseguem parar de lutar. Se quisermos resolver os problemas do Levante, as soluções precisam vir de fora."
 LBA_claim_jerusalem_for_arabs: "Reivindicar Jerusalém para os Árabes"
 LBA_claim_jerusalem_for_arabs_desc: "Nem israelenses nem palestinos merecem a região. Eles mostraram que só vão bagunçá-la. Cabe aos verdadeiros árabes governar a região e trazer paz e estabilidade."
 LBA_claim_jerusalem_for_arabs_tt: "Poderemos transformar estados §YReivindicados§! no Levante em §YNúcleos§!"
 LBA_reconcile_with_israel: "Reconciliar-se com Israel"
 LBA_reconcile_with_israel_desc: "Foi tolice da nossa parte sermos tão hostis a Israel. Eles são uma grande potência militar e nuclear na região e sua existência contínua deve significar alguma coisa. Devemos reparar nossas relações hostis com eles."
 LBA_recall_libyan_jews: "Chamar os Judeus Líbios de Volta"
 LBA_recall_libyan_jews_desc: "No final da década de 1940, quase 40.000 judeus viviam na Líbia. A maioria deles migrou para Israel após sua independência devido aos horrores sofridos sob o regime fascista italiano. À medida que a Líbia conquistou a independência, uma atmosfera antijudaica continuou. Quando Gaddafi assumiu o poder em 1969, apenas cerca de 100 judeus permaneceram no país. Ele continuou uma política antijudaica dura e em 2000 apenas alguns judeus (conhecidos) viviam no país. Expulsar essas pessoas foi um erro e devemos oferecer a elas a opção de retornar à Líbia."
 LBA_arms_deal_with_israel: "Acordo de Armas com Israel"
 LBA_arms_deal_with_israel_desc: "Israel é uma potência militar no Oriente Médio. Precisamos cair nas suas graças e obter acesso a armas modernas."
 LBA_champion_of_al_aqsa: "Campeão de Al-Aqsa"
 LBA_champion_of_al_aqsa_desc: "Com nossas ações, tornamo-nos o campeão de todos os muçulmanos. Al-Aqsa está finalmente sob o nosso controle."
 LBA_southern_focus: "Foco no Sul"
 LBA_southern_focus_desc: "Ao sul de nós há uma zona de instabilidade e rivalidade. O Níger sofre com uma insurgência islamista, o Chade é um velho rival nosso e o Sudão está envolvido em conflito ativo em Darfur. Isso cria uma zona de instabilidade e refugiados em nossa fronteira sul, e faria sentido criar algum tipo de zona-tampão."
 LBA_rivalry_with_chad: "Rivalidade com o Chade"
 LBA_rivalry_with_chad_desc: "Desde nossa derrota na Guerra Toyota, o relacionamento com Chad tem sido tenso. Um dia, teremos nossa vingança e recuperaremos a faixa de Aouzou."
 LBA_reconcile_with_chad: "Reconciliar-se com o Chade"
 LBA_reconcile_with_chad_desc: "É infantil da nossa parte guardar rancores de décadas atrás. Devemos nos reconciliar com o Chade e, juntos, trabalhar pela estabilidade da região."
 LBA_reclaim_aouzou_strip: "Reivindicar a Faixa de Aouzou"
 LBA_reclaim_aouzou_strip_desc: "A Faixa de Aouzou é um pedaço de terra que os italianos cederam de sua colônia líbia para os franceses. Tentamos retomar a área nos anos 80, mas fomos derrotados pelo Chade. Embora a região seja pobre e escassamente povoada, ainda é uma questão de orgulho. Além disso, pode haver urânio na região."
 LBA_reclaim_aouzou_strip_threat: "[LBA.GetNameDef] Reivindica a Faixa de Aouzou"
 LBA_strip_toubou_of_citizenship: "Retirar a Cidadania dos Toubou"
 LBA_strip_toubou_of_citizenship_desc: "Os Tobou não são nativos da Líbia. Eles são simplesmente pastores que cruzaram a fronteira do Chade para o nosso lado. Eles não têm lugar na Líbia."
 LBA_strip_toubou_of_citizenship_tt: "§RComo prometemos anteriormente proteger as minorias, as tribos líbias ficarão seriamente ofendidas!§!\n"
 LBA_utilise_toubou: "Utilizar os Toubou"
 LBA_utilise_toubou_desc: "Da última vez, quando invadimos o Chade, financiamos os rebeldes Toubou lutando contra o regime chadiano. Eventualmente, Goukouni Oueddei, o filho do derde (líder) dos Toubou, tornou-se o presidente do Chade. Enquanto nos preparamos para outro conflito com o Chade, devemos repetir esta fórmula e apoiar os Toubou."
 LBA_utilise_toubou_tt: "Se declararmos guerra a §Y[CHA.GetNameWithFlag]§!, o povo Toubou de §Y[TIE.GetNameWithFlag]§! §Ydeclarará independência§! e se tornará um §Y$autonomy_puppet_state$§! nosso"
 LBA_suggest_joint_mining: "Sugerir Mineração Conjunta"
 LBA_suggest_joint_mining_desc: "Se unirmos nossos esforços com o Chade, seremos capazes de extrair uma grande quantidade de urânio da faixa de Aouzou, beneficiando ambos os países."
 LBA_demand_aouzou: "Exigir a Faixa de Aouzou"
 LBA_demand_aouzou_desc: "Chegou a hora de Chad abrir mão do controle da faixa de Aouzou para nós. Se eles se recusarem, não cometeremos os mesmos erros que cometemos na Guerra de Toyota."
 LBA_demand_aouzou_threat: "[LBA.GetNameDef] Exigiu a Faixa de Aouzou"
 LBA_demand_chads_submission: "Exigir a Submissão do Chade"
 LBA_demand_chads_submission_desc: "Embora tenhamos conseguido arrancar a Faixa de Aouzou do Chade, não há como saber o que eles estão planejando. Eles podem estar reunindo aliados enquanto falamos para nos atacar e recuperar suas terras. Devemos exigir que o governo hostil de [CHA.GetLeader] renuncie, e um governo que possa prometer a [ROOT.GetName] alguma segurança assuma o controle do país."
 LBA_demand_chads_submission_tt: "[LBA.GetNameDef] Exigiu a Submissão [CHA.GetAdjective]"
 LBA_invest_in_chadian_cotton: "Investir no Algodão Chadiano"
 LBA_invest_in_chadian_cotton_desc: "Uma das principais exportações do Chade é o algodão. Devemos investir na indústria algodoeira deles e firmar um acordo comercial para importar algodão de qualidade diretamente para [ROOT.GetName]."
 LBA_invest_in_chadian_cotton_tt: "Se [CHA.GetNameWithFlag] concordar, então\n"
 libya_chad_uranium_deal_tt: "[CHA.GetNameWithFlag] concordou com a mineração conjunta"
 LBA_humanitarian_aid_to_chad: "Ajuda Humanitária ao Chade"
 LBA_humanitarian_aid_to_chad_desc: "O Chade tem um dos menores Índices de Desenvolvimento Humano do mundo inteiro. Eles também nunca se recuperaram de fato da guerra civil dos anos 1980, e ainda existem alguns grupos rebeldes no país. Devemos fazer uma enorme campanha de ajuda humanitária para ajudar o país a se desenvolver."
 LBA_exploit_chadian_oil: "Explorar o Petróleo Chadiano"
 LBA_exploit_chadian_oil_desc: "O Chade descobriu recentemente as suas reservas de petróleo e há muitas mais reservas por descobrir. Infelizmente, Chad não tem recursos para fazer a perfuração sozinho. Precisamos de usar a nossa influência no país para extrair esse doce óleo do solo."
 LBA_support_darfur: "Suporte [DAR.GetName]"
 LBA_support_darfur_desc: "Darfur está sob o governo do Sudão desde que o Sudão foi criado como nação. Darfur é majoritariamente povoado por negros não árabes, enquanto o próprio Sudão é majoritariamente árabe. Muitos em Darfur sentem que o governo árabe está fazendo do país o assunto de uma campanha de apartheid árabe. Precisamos apoiar os darfuri em seu estado de opressão. Além disso, um Darfur independente seria um bom estado-tampão perto de nossa fronteira sul."
 LBA_support_sudan: "Suporte [SUD.GetName]"
 LBA_support_sudan_desc: "Desde que Omar al-Bashir assumiu o poder no Sudão, as relações entre nós e o Sudão têm sido bastante boas. Houve até propostas para unificar os dois países no início dos anos 90. O Sudão seria um forte aliado e um grande parceiro pan-árabe e pan-africano."
 LBA_send_mercenaries: "Enviar Mercenários"
 LBA_send_mercenaries_desc: "Precisamos enviar mercenários ao nosso aliado a leste para estabilizar o regime dele."
 LBA_send_mercenaries_tt_1: "Se tivermos concluído o foco §Y$LBA_support_darfur$§!:\n"
 LBA_send_mercenaries_tt_2: "Se tivermos concluído o foco §Y$LBA_support_sudan$§!:\n"
 LBA_gaddafis_dream: "O Sonho de Kadafi"
 LBA_gaddafis_dream_desc: "Assim que chegou ao poder, Muammar Kadafi quis criar os Estados Árabes Unidos e chegou a fazer algum progresso com uniões temporárias com a Tunísia e o Egito. No entanto, após desavenças com líderes árabes e a morte do nacionalismo árabe, esse sonho parece ter desmoronado. Mas há outros caminhos que Kadafi poderia seguir..."
 LBA_approach_algeria: "Aproximar-se da Argélia"
 LBA_approach_algeria_desc: "A Argélia é parceira de longa data na região. Nenhum de nós gosta muito do Ocidente, lutamos juntos contra os islamistas e ambos somos fortes apoiadores da independência saarauí em relação ao Marrocos. É importante mantermos boas relações com a Argélia."
 LBA_approach_egypt: "Aproximar-se do Egito"
 LBA_approach_egypt_desc: "Não temos exatamente laços fortes com o Egito. No entanto, eles são uma potência militar e econômica na região e controlam o estratégico Canal de Suez. Garantir que estejam do nosso lado é vital."
 LBA_approach_eritrea: "Aproximar-se da Eritreia"
 LBA_approach_eritrea_desc: "A Eritreia é governada por um ditador de mentalidade semelhante. Eles também controlam um ponto de estrangulamento vital perto do estreito de Bab el-Mandeb. Uma parceria estratégica com eles nos permitirá projetar mais poder no Mar Vermelho."
 LBA_weapons_to_taylor: "Armas para Taylor"
 LBA_weapons_to_taylor_desc: "Treinamos Charles Taylor para se tornar um guerrilheiro. Em 1989, o enviamos à Libéria para derrubar o governo pró-americano, o que terminou na Primeira Guerra Civil Liberiana. Taylor agora está em apuros, pois rebeldes de dentro e de fora do país ameaçam seu governo. Devemos enviar apoio adicional a ele para garantir que permaneça no poder."
 LBA_central_african_mercs: "Mercenários na África Central"
 LBA_central_african_mercs_desc: "A maior parte da Guarda Presidencial da República Centro-Africana é composta por mercenários líbios. Esse destacamento deve ser reforçado para garantir que nada de ruim aconteça com [CAR.GetLeader]."
 LBA_red_sea_trade_deal: "Acordo Comercial do Mar Vermelho"
 LBA_red_sea_trade_deal_desc: "Com o Egito e a Eritreia amistosos conosco, devemos criar um acordo comercial para facilitar o crescimento."
 LBA_meet_mengistu: "Encontrar Mengistu"
 LBA_meet_mengistu_desc: "Mengistu Haile Mariam governou a Etiópia de 1977 a 1991 como chefe do Derg, a junta militar de esquerda que controlava o país. Ele fugiu da Etiópia em 1991, o que pôs fim à longa guerra civil etíope. Atualmente vive no Zimbábue e está sendo julgado à revelia por genocídio. Mengistu foi um importante combatente anti-Ocidente. Devemos realizar uma reunião com ele e expressar nosso apoio."
 LBA_meet_mengistu_tt_1: "\nSe §YMengistu§! ainda estiver vivendo no exílio:\n"
 LBA_meet_mengistu_tt_2: "\nSe §YMengistu§! estiver governando §Y[ETH.GetNameWithFlag]§!:\n"
 LBA_anti_colonialist: "União Anticolonial"
 LBA_anti_colonialist_desc: "Ao longo de seu governo, Kadafi apoiou inúmeros movimentos de independência e resistência. Sua virulenta atitude anti-Ocidente libertou muitas pessoas da opressão. Ainda há muitos oprimidos no mundo e nosso objetivo deve ser dar liberdade a todos."
 LBA_anti_colonialist_tt: "Poderemos iniciar §YGuerras Civis§! em países §YNão Emergentes§! onde tivermos influência. O levante se juntará à nossa §YFacção§! quando a guerra começar."
 LBA_strive_for_uar: "Lutar pela RAU"
 LBA_strive_for_uar_desc: "O primeiro objetivo de Kadafi era unir o mundo árabe. No entanto, com a morte do nacionalismo árabe e Kadafi entrando em conflito com outros líderes árabes, a possibilidade de unificação morreu. Agora, seria necessária uma grande potência no Oriente Médio para voltar a impulsionar o assunto. Contudo, com poder diplomático suficiente, talvez consigamos reacender a ideia."
 LBA_strive_for_african_union: "Estados Unidos da África"
 LBA_strive_for_african_union_desc: "Com o enfraquecimento do nacionalismo árabe, Kadafi mudou seu foco de unir os árabes para unir o continente africano. Esse deve ser o nosso foco, pois a África sofreu muito com o colonialismo. Somente unificando-nos poderemos impedir que isso aconteça novamente."
 LBA_strive_for_african_union_trigger_tt: "Não formamos uma §YRAU neobaathista§!"
 LBA_strive_for_african_union_tt: "Poderemos controlar as políticas da §YUnião Africana§! mesmo que não sejamos uma §Y$regional_power$§!\n\nIsso também tornará o foco §Y$LBA_the_real_monarch$§! disponível para Kadafi."
 LBA_strive_for_african_union_unlock_shared_tree_tt: "Ativa o ramo compartilhado da árvore de focos da §YUnião Africana§! e a categoria de decisões para todos os países africanos. Eles serão usados para aproximar cada vez mais a União Africana da unificação\n\n"
 LBA_islamic_legion: "A Legião Islâmica"
 LBA_islamic_legion_desc: "Na década de 1970, Kadafi criou uma força paramilitar pan-árabe e pan-islamista, destinada a ser uma força de combate de elite enviada para intervir em conflitos. A legião era composta principalmente por imigrantes pobres do Sahel, além de cidadãos paquistaneses e bangladeshianos que haviam recebido falsas promessas de empregos civis. A legião foi dissolvida após seu mau desempenho na guerra com o Chade. Devemos recriar essa legião, mas melhor desta vez. Ela será composta por voluntários altamente motivados."
 LBA_regional_politics: "Política Regional"
 LBA_regional_politics_desc: "À medida que nosso poder e influência crescem, devemos estender nosso poder para cobrir toda a África e o Oriente Médio."
 LBA_contact_taylor: "Contatar Taylor"
 LBA_contact_taylor_desc: "Charles Taylor é o protegido de Kadafi. Ele é a nossa chave para estender nossa influência na África Ocidental."
 LBA_contact_koroma: "Contatar a RUF"
 LBA_contact_koroma_desc: "A Frente Revolucionária Unida luta como parte da Frente Revolucionária das Forças Armadas contra Serra Leoa e as forças da África Ocidental. A RUF tem laços com Charles Taylor e a Libéria, e mantê-la em funcionamento é importante."
 LBA_new_liberian_revolution: "Nova Revolução Liberiana"
 LBA_new_liberian_revolution_desc: "Apoiar Charles Taylor na Libéria foi uma das operações mais bem-sucedidas de Kadafi no exterior. Precisamos concentrar todo o nosso foco na região."
 LBA_new_liberian_revolution_tt: "§GSe a revolução for bem-sucedida, [THIS.GetNameDef] se tornará nosso fantoche. Se não, uma guerra civil começará e o lado revoltoso se tornará nosso fantoche§!"
 LBA_spread_fire_to_guinea: "Espalhar o Fogo para a Guiné"
 LBA_spread_fire_to_guinea_desc: "A Guiné tentou deter Taylor. É preciso mostrar a eles quem manda."
 LBA_spread_fire_to_ivory_coast: "Espalhar o Fogo para a Costa do Marfim"
 LBA_spread_fire_to_ivory_coast_desc: "A Costa do Marfim serviu de base para milícias anti-Taylor. Precisamos proteger o flanco leste da Libéria."
 LBA_reinforce_central_african_mercs: "Reforçar os Mercenários na África Central"
 LBA_reinforce_central_african_mercs_desc: "Nosso destacamento de mercenários está fazendo maravilhas na República Centro-Africana. Precisamos estender nossa 'proteção' à liderança centro-africana com mais mercenários."
 LBA_mercenary_coup: "Derrubar a República Centro-Africana"
 LBA_mercenary_coup_desc: "Com a Guarda Presidencial Centro-Africana no nosso bolso, não deve ser difícil derrubar o presidente atual em favor de um candidato mais favorável. Por razões de segurança, é claro."
 LBA_incursion_to_rep_congo: "Incursões no Congo"
 LBA_incursion_to_rep_congo_desc: "Ao assumir o controle do Congo, estabeleceremos uma rota marítima a partir da África Central. Isso nos dará melhor acesso ao interior do continente."
 LBA_incursion_to_drc: "Incursões na RDC"
 LBA_incursion_to_drc_desc: "A República Democrática do Congo é rica em recursos naturais. Precisamos colocar as mãos nesses recursos."
 LBA_djibouti_base: "Base Naval de Djibuti"
 LBA_djibouti_base_desc: "Djibuti fica em um ponto de estrangulamento estratégico no Mar Vermelho, bem no estreito de Bab el-Mandeb. Aumentar nossa influência sobre Djibuti nos permitirá controlar o estreito de Suez sem nunca pisar no Egito."
 LBA_destability_somalia: "Financiar a Desestabilização da Somália"
 LBA_destability_somalia_desc: "A Somália está em ruínas desde a queda de Siad Barre nos anos 90. O país está em guerra civil, há áreas separatistas que se desmembraram, a costa somali é infestada de pirataria e jihadistas podem operar livremente no país. Mantendo o país instável, temos um motivo para manter presença na região."
 LBA_destability_somalia_tt: "[SML.GetNameWithFlag] e [PUN.GetNameWithFlag] recebem uma escolha entre as duas opções:\n"
 LBA_arm_ethiopian_tribes: "Armar as Tribos Etíopes"
 LBA_arm_ethiopian_tribes_desc: "Na parte leste da Etiópia fica a região de Ogaden. Essa região é habitada por várias tribos somalis. Os dois países travaram uma breve guerra pela região na década de 1970. Enviar armas às várias tribos certamente causará resistência contra o Estado etíope."
 LBA_organise_eth_som_conflict: "Organizar um Conflito por Procuração"
 LBA_organise_eth_som_conflict_desc: "Com alguns agentes posicionados estrategicamente, podemos incendiar todo o Chifre da África em conflito. Quando a região cair em caos absoluto, teremos a desculpa perfeita para intervir."
 LBA_intervene_for_stability: "Intervenção pela Estabilidade"
 LBA_intervene_for_stability_desc: "O Chifre da África está em caos. Devemos intervir para salvar o pobre povo que sofre sob regimes repressivos. É para o bem da África."
 LBA_influence_yemen: "Influenciar o Iêmen"
 LBA_influence_yemen_desc: "O Iêmen controla o lado norte do estreito de Bab el-Mandeb. Assim como Djibuti, a amizade deles conosco é fundamental."
 LBA_infiltrate_kuwait: "Infiltrar o Kuwait"
 LBA_infiltrate_kuwait_desc: "Os monarcas do Golfo Arábico não passam de fantoches ocidentais que usam seu dinheiro sujo do petróleo para oprimir os árabes fiéis. Os kuwaitianos estão entre os piores infratores. Felizmente, há um pregador islâmico, Hakem Al-Mutairi, que compartilha nossa opinião sobre o regime kuwaitiano."
 LBA_occupy_socotra_desc: "A ilha de Socotra, na ponta do Chifre da África, é uma torre de vigia que protege a entrada do Mar Vermelho. Tomar o controle da ilha nos daria uma boa posição para controlar o Oceano Índico."
 LBA_occupy_socotra: "Ocupar Socotra"
 LBA_fortify_socotra: "Fortificar Socotra"
 LBA_fortify_socotra_desc: "Agora que Socotra está sob nosso controle, precisamos fortificar a ilha para fortalecer nossa posição."
 LBA_contact_qatar: "Contatar o Catar"
 LBA_contact_qatar_desc: "O Catar é diferente dos outros países do Golfo. Em vez de serem cães wahhabitas financiados pela CIA, eles são orientados para a Irmandade Muçulmana. Isso os torna um pouco menos piores. No entanto, eles também não gostam muito dos sauditas, assim como nós. Talvez consigamos persuadi-los a se alinhar mais de perto conosco."
 LBA_overthrow_saudis: "Derrubar os Sauditas"
 LBA_overthrow_saudis_desc: "Os sauditas nos acusaram de tentar assassinar [SAU.GetLeader]. Isso é, claro, um completo absurdo. Eles estão conduzindo uma campanha de difamação contra nós para esconder seu próprio regime cruel e sombrio. Precisamos destruí-los."
 LBA_overthrow_kuwaitis: "Derrubar os Kuwaitianos"
 LBA_overthrow_kuwaitis_desc: "Chegou a hora de acabar com o domínio dos Al-Sabah sobre nossos irmãos kuwaitianos."
 LibyaFocus.1.t: "[FROM.GetNameDef] se Aliou ao Boko Haram"
 LibyaFocus.1.desc: "Recebemos vários relatos preocupantes de que combatentes do Boko Haram têm cruzado a fronteira norte e viajado para [FROM.GetNameDef]. Os líderes seniores do Boko Haram têm conversado com o [FROM.GetAdjective] e combatentes do Boko Haram têm sido vistos em [FROM.GetAdjective] campos de treinamento. Parece que agora há forças poderosas apoiando a insurgência do Boko Haram, e isso pode ser problemático para nós."
 LibyaFocus.1.a: "Preocupante"
 LibyaFocus.2.t: "O Boko Haram se Revolta"
 LibyaFocus.2.desc: "Várias cidades do norte da Nigéria estão sob ataque de militantes do Boko Haram. Há relatos de combatentes do Boko Haram acompanhados por soldados que falam árabe e vestem uniformes do Exército [LBA.GetAdjective]. Parece que os islamistas lançaram um ataque combinado contra nós."
 LibyaFocus.2.a: "Deus Vult!"
 LibyaFocus.2.b: "Allahu Akbar!"
 LibyaFocus.3.t: "O Boko Haram se Revolta"
 LibyaFocus.3.desc: "Várias cidades do norte da Nigéria estão sob ataque de militantes do Boko Haram devido à nossa agitação. Agora é hora de avançar pela fronteira e ajudar nossos irmãos islâmicos."
 LibyaFocus.3.a: "Avante para Lagos!"
 LibyaFocus.4.t: "1:1 - O Instrumento de Governo"
 LibyaFocus.4.desc: "O Livro Verde original exige o estabelecimento de uma democracia direta por meio de congressos populares, para garantir que o povo controle o país. No entanto, o que aconteceu na prática é que a política é ditada de cima e os congressos funcionam como uma ilusão. Ponderando sobre a atual competição entre o Congresso Geral do Povo e os Comitês Revolucionários, [LBA.GetLeader] pega sua caneta e escreve..."
 LibyaFocus.4.a: "'O povo deve ter controle direto sobre o seu próprio governo, pois do contrário...'"
 LibyaFocus.4.b: "'Facções pluralistas devem existir para garantir o debate político sobre temas complexos...'"
 LibyaFocus.4.c: "'Como o povo não é especialista em suas áreas, indivíduos-chave escolhidos devem agir...'"
 LibyaFocus.5.t: "1:3 - O Partido"
 LibyaFocus.5.desc: "No atual ambiente político, os partidos políticos na Líbia são proibidos (alguns operam na clandestinidade). Em vez disso, as pessoas são incentivadas a atuar em nível local, em seu Congresso Popular local. Talvez no futuro..."
 LibyaFocus.5.a: "'As pessoas devem se unir em Uniões Populares, ou partidos, para ter força coletiva...'"
 LibyaFocus.5.b: "'Os Congressos Populares devem ter um papel mais forte na vida das pessoas e ser o caminho principal...'"
 LibyaFocus.5.c: "'A terceira coluna clandestina deve ser eliminada para não minar o povo...'"
 LibyaFocus.6.t: "1:8 - Quem Supervisiona a Conduta da Sociedade?"
 LibyaFocus.6.desc: "O policiamento líbio é duplo: há a polícia normal, mas também há os Comitês Revolucionários, que contratam cidadãos comuns como informantes. Há muito controle político sobre o país, mas será este o caminho certo para a Líbia? Bem, segundo [LBA.GetLeader]..."
 LibyaFocus.6.a: "'O povo deve policiar a si mesmo, pois só ele sabe como deseja ser tratado...'"
 LibyaFocus.6.b: "'Assim como um cão de guarda vigia seu dono, o dono deve vigiar o cão de guarda...'"
 LibyaFocus.6.c: "'O Comitê Revolucionário é feito do povo, para o povo, portanto eles...'"
 LibyaFocus.7.t: "1:10 - A Imprensa"
 LibyaFocus.7.desc: "A imprensa líbia é fortemente controlada pelo governo. Embora a ideia central seja que os Comitês Populares moderem o conteúdo da imprensa, na realidade isso não acontece. Certamente, quando se trata da imprensa..."
 LibyaFocus.7.a: "'O povo deve ter poder para expressar sua própria opinião e comentar a sociedade...'"
 LibyaFocus.7.b: "'Os indivíduos podem enviar seus comentários ao Comitê, que garantirá que nenhum dano...'"
 LibyaFocus.7.c: "'Como os Comitês são feitos de pessoas, eles já conhecem as opiniões do...'"
 LibyaFocus.8.t: "2:13 - Moradia"
 LibyaFocus.8.desc: "Desde a revolução de Kadafi, a propriedade de casas foi restringida a uma por indivíduo, com o governo sendo dono de todas as casas de aluguel. Isso é para impedir que as pessoas aluguem casas e transformem a moradia em mercadoria. Enquanto [LBA.GetLeader] admira a cidade da janela do palácio presidencial em Trípoli, uma ideia lhe vem à cabeça..."
 LibyaFocus.8.a: "'Um homem deve poder comprar uma segunda casa para oferecer moradia barata a seus companheiros...'"
 LibyaFocus.8.b: "'É bom que o governo possa oferecer moradia barata, nenhum senhorio deve...'"
 LibyaFocus.8.c: "'Para igualar a riqueza entre as pessoas, faria sentido que o Estado fosse dono de toda...'"
 LibyaFocus.9.t: "2:14 - Renda"
 LibyaFocus.9.desc: "Embora o Livro Verde peça a propriedade comunal das empresas, que então fornece dinheiro a todos os trabalhadores, na prática ainda há muita propriedade privada e trabalhadores assalariados no país. Após uma recente visita a uma fábrica, [LBA.GetLeader] ficou com uma pergunta na cabeça: um homem não tem direito ao suor do seu rosto?"
 LibyaFocus.9.a: "'Não', diz o homem em Washington, 'Pertence aos pobres'"
 LibyaFocus.9.b: "'Não', diz o homem no Vaticano, 'Pertence a Deus'"
 LibyaFocus.9.c: "'Não', diz o homem em Moscou, 'Pertence a todos'"
 LibyaFocus.10.t: "2:16 - Terra"
 LibyaFocus.10.desc: "Pouco depois de a propriedade privada de várias casas ser proibida, a propriedade de terras foi completamente banida em 1986 (o que, coincidentemente, aconteceu ao mesmo tempo que o incêndio do cartório de registro de terras e de todos os seus registros). Isso significa que toda a terra na Líbia pertence nominalmente ao Estado e as propriedades foram redistribuídas aqui e ali. Após uma recente reunião com alguns líderes tribais, os pensamentos de [LBA.GetLeader] giram em sua cabeça enquanto ele se deita para dormir..."
 LibyaFocus.10.a: "'Certamente um homem trabalhador deveria poder ser dono da terra em que passa seus dias trabalhando...'"
 LibyaFocus.10.b: "'É melhor que o Estado distribua terras para evitar disputas tribais...'"
 LibyaFocus.10.c: "'Talvez devêssemos recomeçar. Preciso redigir uma nova lei de confisco de terras amanhã...'"
 LibyaFocus.11.t: "3:21 - Os Méritos da Tribo"
 LibyaFocus.11.desc: "Kadafi apaziguou as tribos líbias declarando a importância delas para a construção da sociedade. No entanto, isso entra em conflito com suas ideias sobre a nação líbia e a necessidade de construir uma identidade comum e de o Estado controlar as pessoas. Eventualmente, um lado terá que ser escolhido, pois a Líbia não pode avançar com a competição entre a tribo e a nação. Para resolver isso, [LBA.GetLeader] pensou no seguinte..."
 LibyaFocus.11.a: "'A tribo é a família de qualquer pessoa. Só a tribo pode dar as qualidades necessárias...'"
 LibyaFocus.11.b: "'Embora ouvir os mais velhos seja importante, também é preciso estar pronto para servir ao Estado...'"
 LibyaFocus.11.c: "'O Estado deve conduzir as pessoas para longe de seu passado feudal para libertá-las. Um servo...'"
 LibyaFocus.12.t: "3:24 - Minorias"
 LibyaFocus.12.desc: "A Líbia é predominantemente árabe, com uma pequena minoria de Tuaregues e Toubou no sul do país. Assim, a declaração do Livro Verde de proteger as minorias é fácil de fazer, pois na Líbia elas quase podem ser ignoradas. As minorias na Líbia estão consideravelmente pior do que a população majoritária, e parece que o Livro Verde fracassou. Enquanto percorre o interior do país no banco de trás de sua limusine, [LBA.GetLeader] rabisca em um pedaço de papel..."
 LibyaFocus.12.a: "'Minorias sem nação devem ser acolhidas, para que possamos lhes oferecer uma nação...'"
 LibyaFocus.12.b: "'Uma minoria deve traçar seu próprio caminho. Se for seu destino, então uma nação será construída...'"
 LibyaFocus.12.c: "'Só há espaço para uma nação. Minorias sem nação comprometem a nossa nação...'"
 LibyaFocus.13.t: "3:25 - Os Negros Prevalecerão no Mundo"
 LibyaFocus.13.desc: "Depois de [LBA.GetLeader] terminar de ler ao seu conselheiro um capítulo do antigo Livro Verde, detalhando como os negros controlarão a Terra por se multiplicarem rapidamente devido a razões culturais e por não usarem proteção, e como o clima quente da África os faz desvalorizar o trabalho, ele é recebido com um olhar confuso. Após um silêncio constrangedor entre o conselheiro e ele, e justo quando o conselheiro está prestes a falar, [LBA.GetLeader] o interrompe e diz..."
 LibyaFocus.13.a: "'Pode ser só impressão minha, mas acho que isso soa um pouco racista...'"
 LibyaFocus.13.b: "'Olha, eu não sou racista. Mas...'"
 LibyaFocus.13.c: "'Olha, eu sou racista. Mas...'"
 LibyaFocus.14.t: "3:28 - Esporte, Equitação e Palco"
 LibyaFocus.14.desc: "O Livro Verde incentiva os cidadãos a participarem ativamente de esportes e entretenimento, em vez de simplesmente consumi-los. O futebol, especialmente, é um passatempo popular no país. Embora a prática esportiva seja definitivamente boa para a saúde nacional, não ter um setor esportivo monetizado e lucrativo prejudica nossas finanças. Depois de assistir ao Al-Ittihad Football Club vencer mais uma Premier League, [LBA.GetLeader] curtiu uma noite de festa selvagem para comemorar. Enquanto está deitado na cama contemplando a ressaca, assistindo ao noticiário matinal e saboreando pizza, algo que o apresentador diz começa a fazer sentido..."
 LibyaFocus.14.a: "'Nós, líbios, somos apaixonados por futebol. Talvez apaixonados o bastante para pagar mais por ele...'"
 LibyaFocus.14.b: "'Será que vai fazer calor hoje...'"
 LibyaFocus.14.c: "'Por que ficar sentado vendo os outros jogarem quando eu poderia estar jogando? Cadê meus sapatos...'"
 LibyaFocus.15.t: "Família Real Líbia Assassinada"
 LibyaFocus.15.da: "A Família Real Líbia foi assassinada!\n\nEnquanto a família participava de uma festa anual de reunião em Londres, um artefato explosivo foi detonado sob uma das mesas de jantar. Destruindo a maior parte do piso do prédio, o Príncipe Herdeiro Muhammad e seu primo Ahmed foram atingidos pela explosão direta. Um pretendente ao trono, Idris, morreu devido aos ferimentos mais tarde no hospital, enquanto seu filho Khaled já estava morto quando os serviços de emergência chegaram ao local. Vários civis também morreram e ficaram feridos na explosão.\n\nA Scotland Yard já está investigando o caso, e nossos serviços de segurança anunciaram que identificaram o responsável, mas não tiveram tempo de alertar as autoridades britânicas sobre a ameaça."
 LibyaFocus.15.db: "A Família Real Líbia foi assassinada!\n\nEnquanto a família saía de sua festa anual de reunião em Londres, vários SUVs pretos pararam em frente ao prédio, e homens armados e mascarados saltaram deles. Abriram fogo contra a família real e, segundo testemunhas, chegaram a lançar duas granadas de mão. Toda a família foi alvejada, e os guarda-costas reais só conseguiram disparar alguns tiros de volta contra os atacantes. Vários civis também morreram e ficaram feridos no ataque.\n\nA Scotland Yard já está investigando o caso, e nossos serviços de segurança anunciaram que identificaram o responsável, mas não tiveram tempo de alertar as autoridades britânicas sobre a ameaça."
 LibyaFocus.15.dc: "A Família Real Líbia foi assassinada!\n\nNosso agente plantou uma bomba no jato particular que a família usava para viajar nas férias. Quando o avião chegou ao Canal da Mancha, a bomba explodiu. Os destroços da explosão caíram no Canal e não há relatos de sobreviventes.\n\nAs autoridades britânicas já estão investigando o caso, e nossos serviços de segurança anunciaram que identificaram o responsável, mas não tiveram tempo de alertar as autoridades britânicas sobre a ameaça."
 LibyaFocus.15.dd: "A Família Real Líbia foi assassinada!\n\nEnquanto a Família Real partia de férias em seu jato particular, nosso agente nocauteou o piloto e se disfarçou com as roupas dele. Quando entrou no avião, a família nem sequer olhou em sua direção. Ele trancou a porta da cabine e, assim que estavam sobre o Canal da Mancha, o bravo mártir lançou o avião ao mar. Até agora não vimos relatos de sobreviventes.\n\nAs autoridades britânicas já estão investigando o caso, e nossos serviços de segurança anunciaram que identificaram o responsável, mas não tiveram tempo de alertar as autoridades britânicas sobre a ameaça."
 LibyaFocus.15.a: "Esperemos que acreditem"
 LibyaFocus.16.t: "Família Real Líbia Assassinada"
 LibyaFocus.16.da: "A Família Real Líbia foi assassinada!\n\nEnquanto a família participava de uma festa anual de reunião em Londres, um artefato explosivo foi detonado sob uma das mesas de jantar. Destruindo a maior parte do piso do prédio, o Príncipe Herdeiro Muhammad e seu primo Ahmed foram atingidos pela explosão direta. Um pretendente ao trono, Idris, morreu devido aos ferimentos mais tarde no hospital, enquanto seu filho Khaled já estava morto quando os serviços de emergência chegaram ao local. Vários civis também morreram e ficaram feridos na explosão.\n\nA Scotland Yard já está investigando o caso, e os serviços de segurança líbios anunciaram que identificaram o responsável, mas não tiveram tempo de alertar as autoridades britânicas sobre a ameaça."
 LibyaFocus.16.db: "A Família Real Líbia foi assassinada!\n\nEnquanto a família saía de sua festa anual de reunião em Londres, vários SUVs pretos pararam em frente ao prédio, e homens armados e mascarados saltaram deles. Abriram fogo contra a família real e, segundo testemunhas, chegaram a lançar duas granadas de mão. Toda a família foi alvejada, e os guarda-costas reais só conseguiram disparar alguns tiros de volta contra os atacantes. Vários civis também morreram e ficaram feridos no ataque.\n\nA Scotland Yard já está investigando o caso, e os serviços de segurança líbios anunciaram que identificaram o responsável, mas não tiveram tempo de alertar as autoridades britânicas sobre a ameaça."
 LibyaFocus.16.dc: "A Família Real Líbia foi assassinada!\n\nEnquanto o jato particular da família sobrevoava o Canal da Mancha rumo ao destino de férias, uma explosão despedaçou o avião. A explosão foi provavelmente causada por uma bomba plantada dentro da aeronave. Os destroços da explosão caíram no Canal e até agora não encontramos sobreviventes.\n\nAs autoridades britânicas já estão investigando o caso, e os serviços de segurança líbios anunciaram que identificaram o responsável, mas não tiveram tempo de alertar as autoridades britânicas sobre a ameaça."
 LibyaFocus.16.dd: "A Família Real Líbia foi assassinada!\n\nEnquanto o jato particular da família sobrevoava o Canal da Mancha a caminho de um destino de férias, o avião parou de responder às chamadas de rádio e desligou o transponder. Poucos minutos depois, a aeronave mergulhou no oceano. Até agora não vimos relatos de sobreviventes. O motivo da queda ainda não está claro, mas o piloto do avião foi encontrado nocauteado no aeroporto, o que significa que quem estava pilotando o avião não deveria estar fazendo isso.\n\nAs autoridades britânicas já estão investigando o caso, e os serviços de segurança líbios anunciaram que identificaram o responsável, mas não tiveram tempo de alertar as autoridades britânicas sobre a ameaça."
 LibyaFocus.16.a: "Será que é Lockerbie de novo?"
 LibyaFocus.17.t: "Fracassa o Assassinato da Família Real Líbia"
 LibyaFocus.17.da: "O assassinato fracassou!\n\nEnquanto a família participava de uma festa anual de reunião em Londres, nosso agente deveria contrabandear uma bomba para o jantar, disfarçado de garçom. O que ele não previu foi um detector de metais na porta, que disparou por causa de sua arma escondida. O agente tentou salvar a situação sacando a pistola, mas foi rapidamente baleado pelos seguranças.\n\nA Scotland Yard já está investigando o caso, e nossos serviços de segurança anunciaram que identificaram o responsável, mas não tiveram tempo de alertar as autoridades britânicas sobre a ameaça."
 LibyaFocus.17.db: "O assassinato fracassou!\n\nEnquanto a família saía de sua festa anual de reunião em Londres, vários SUVs pretos pararam em frente ao prédio, e homens armados e mascarados saltaram deles. Abriram fogo contra a família real e, segundo testemunhas, chegaram a lançar duas granadas de mão. Por algum motivo inexplicável, nenhum membro da família foi atingido e, após um breve tiroteio entre os agressores e os seguranças, os agressores fugiram com a polícia em seu encalço.\n\nA Scotland Yard já está investigando o caso, e nossos serviços de segurança anunciaram que identificaram o responsável, mas não tiveram tempo de alertar as autoridades britânicas sobre a ameaça."
 LibyaFocus.17.dc: "O assassinato fracassou!\n\nNosso agente deveria plantar uma bomba no jato particular que a família usaria para viajar nas férias. No entanto, durante uma inspeção de rotina antes da decolagem, um técnico notou a bomba e o esquadrão antibombas foi chamado. Felizmente, nosso agente conseguiu escapar, embora a polícia esteja em seu encalço.\n\nAs autoridades britânicas já estão investigando o caso, e nossos serviços de segurança anunciaram que identificaram o responsável, mas não tiveram tempo de alertar as autoridades britânicas sobre a ameaça."
 LibyaFocus.17.dd: "O assassinato fracassou!\n\nEnquanto a Família Real partia de férias em seu jato particular, nosso agente nocauteou o piloto e se disfarçou com as roupas dele. No entanto, quando o Príncipe Herdeiro cumprimentou o piloto com quem havia voado muitas vezes, notou nosso agente. Nosso agente foi rapidamente detido pelos seguranças do Príncipe.\n\nAs autoridades britânicas já estão investigando o caso, e nossos serviços de segurança anunciaram que identificaram o responsável, mas não tiveram tempo de alertar as autoridades britânicas sobre a ameaça."
 LibyaFocus.17.a: "Da próxima vez contratamos o IRA"
 LibyaFocus.18.t: "Atentado contra a Vida da Família Real Líbia"
 LibyaFocus.18.da: "Houve uma tentativa frustrada de assassinato contra a Família Real Líbia.\n\nEnquanto a família participava de uma festa anual de reunião em Londres, um agressor armado foi detectado por um detector de metais. A situação rapidamente se transformou em um tiroteio e, mais tarde, descobriu-se que o agressor também carregava um artefato explosivo.\n\nA Scotland Yard já está investigando o caso, e os serviços de segurança líbios anunciaram que identificaram o responsável, mas não tiveram tempo de alertar as autoridades britânicas sobre a ameaça."
 LibyaFocus.18.db: "Houve uma tentativa frustrada de assassinato contra a Família Real Líbia.\n\nEnquanto a família saía de sua festa anual de reunião em Londres, vários SUVs pretos pararam em frente ao prédio, e homens armados e mascarados saltaram deles. Abriram fogo contra a família real e, segundo testemunhas, chegaram a lançar duas granadas de mão. Por algum motivo inexplicável, nenhum membro da família foi atingido e, após um breve tiroteio entre os agressores e os seguranças, os agressores fugiram com a polícia em seu encalço.\n\nA Scotland Yard já está investigando o caso, e os serviços de segurança líbios anunciaram que identificaram o responsável, mas não tiveram tempo de alertar as autoridades britânicas sobre a ameaça."
 LibyaFocus.18.dc: "Houve uma tentativa frustrada de assassinato contra a Família Real Líbia.\n\nEnquanto a família se preparava para pegar um jato particular rumo ao destino de férias, um técnico encontrou uma bomba presa à aeronave durante a inspeção antes da decolagem. A bomba foi desarmada por um esquadrão antibombas. No entanto, neste momento não há informações sobre quem plantou a bomba.\n\nAs autoridades britânicas já estão investigando o caso, e os serviços de segurança líbios anunciaram que identificaram o responsável, mas não tiveram tempo de alertar as autoridades britânicas sobre a ameaça."
 LibyaFocus.18.dd: "Houve uma tentativa frustrada de assassinato contra a Família Real Líbia.\n\nEnquanto a Família Real partia de férias em seu jato particular, o Príncipe Herdeiro percebeu que o piloto habitual havia sido substituído por outra pessoa, sem qualquer aviso. Após um breve interrogatório, o homem foi detido pelos guardas do Príncipe e entregue à polícia. O verdadeiro piloto foi encontrado mais tarde, nocauteado, no aeroporto.\n\nAs autoridades britânicas já estão investigando o caso, e os serviços de segurança líbios anunciaram que identificaram o responsável, mas não tiveram tempo de alertar as autoridades britânicas sobre a ameaça."
 LibyaFocus.18.a: "Quem será que está por trás disso?"
 LibyaFocus.19.t: "Descobertos Vínculos da Líbia com o Terrorismo"
 LibyaFocus.19.d: "Nossos serviços de segurança investigaram o recente ataque terrorista em que a família real líbia foi alvo. Por meio de interrogatórios, do rastreamento de fluxos de dados, dinheiro e armas, encontraram vínculos entre o governo líbio e os terroristas. É praticamente certo que o regime líbio orquestrou ou ao menos financiou o ataque contra a família real."
 LibyaFocus.19.a: "Exigir um pedido público de desculpas!"
 LibyaFocus.19.b: "Não devemos escalar isso ainda mais"
 LibyaFocus.20.t: "[ROOT.GetNameDef] Exige um Pedido Público de Desculpas"
 LibyaFocus.20.d: "[ROOT.GetNameDef] nos acusa de organizar o ataque terrorista contra a família real líbia. Eles querem que peçamos desculpas publicamente pelo incidente e paguemos indenização às vítimas do ataque."
 LibyaFocus.20.a: "Precisamos pedir desculpas"
 LibyaFocus.20.b: "Não fizemos nada de errado!"
 LBA_terror_attack_no_apology_tt: "§RIsso pode ter consequências graves! [FROM.GetNameDef] pode considerar isso um ataque ao seu território!§!"
 LibyaFocus.21.t: "A Líbia Pede Desculpas"
 LibyaFocus.21.d: "A Líbia concordou em pedir desculpas publicamente pelo ataque terrorista. Também pagará indenização financeira às vítimas do ataque."
 LibyaFocus.21.a: "Justiça!"
 LibyaFocus.22.t: "A Líbia se Recusa a Pedir Desculpas"
 LibyaFocus.22.d: "A Líbia se recusou a pedir desculpas ou a pagar indenização pelo ataque terrorista. Parece que a Líbia está retomando seu caminho de apoio ao terrorismo internacional. Muitas pessoas no Reino Unido ainda se lembram do atentado de Lockerbie, e muitos pedem que a Líbia receba uma lição."
 LibyaFocus.22.a: "Organizar um ataque aéreo!"
 LibyaFocus.22.b: "Isto é um ataque contra nós! Derrubem-nos!"
 LibyaFocus.22.c: "Não vamos escalar mais!"
 ENG_bomb_libya_tt: "§YBombardearemos uma instalação industrial na Líbia!§!"
 ENG_attack_libya_tt: "§YInvadiremos a Líbia para derrubar seu governo que apoia o terrorismo! Como eles atacaram nosso território, isso será considerado um ataque contra nós e nossos aliados§!"
 LibyaFocus.23.t: "[FROM.GetAdjective] Ataque aéreo"
 LibyaFocus.23.d: "Depois de nos recusarmos a pedir desculpas aos britânicos, não recebemos mais nenhuma comunicação deles. Isso até que um de nossos radares na costa detectou vários caças se aproximando. [FROM.GetNameDef] nos enviou um comunicado afirmando que, para nos impedir de apoiar o terrorismo, eles precisam agir. Embora nosso pessoal do exército tenha tentado bravamente afastar os caças com fogo antiaéreo, nenhum acerto foi marcado. Os caças conseguiram atingir e destruir seu alvo."
 LibyaFocus.23.a: "Malditos imperialistas!"
 LibyaFocus.24.t: "[FROM.GetAdjective] Intervenção"
 LibyaFocus.24.d: "Depois de nos recusarmos a pedir desculpas aos britânicos, não recebemos mais nenhuma comunicação deles. Isso até que um de nossos radares na costa detectou vários caças se aproximando. [FROM.GetNameDef] nos enviou um comunicado afirmando que, para nos impedir de apoiar o terrorismo, eles precisam agir. [FROM.GetNameDef] considera nossas ações um ataque contra sua nação e, para evitar novos ataques terroristas, nosso governo deve ser removido do poder."
 LibyaFocus.24.a: "Malditos imperialistas!"
 LibyaFocus.25.t: "Escolhendo um Rei"
 LibyaFocus.25.d: "Chegou a hora de escolher um rei para a Líbia. O sucessor atualmente aceito de forma geral para o trono é Mohammed el-Senussi, neto do irmão do Rei Idris I. O pai de Mohammed foi nomeado por Idris como seu herdeiro, já que ele próprio não tinha filhos.\n\nA reivindicação de Mohammed, porém, é contestada por seu primo Idris el-Senussi. Idris usou sua vasta riqueza para pressionar várias organizações, incluindo vários parlamentares britânicos, a reconhecê-lo como o herdeiro legítimo.\n\nHá também uma terceira opção: Ahmed el-Senussi, outro primo de Mohammed. Ele não fez nenhuma reivindicação ao trono, mas tentou organizar um contragolpe assim que Kadafi tomou o poder, o que terminou com ele passando 30 anos como preso político, sofrendo tortura frequente. Ele lutou pessoalmente contra o antigo regime e perseverou, sendo assim o símbolo perfeito para a Líbia.\n\nQuem devemos escolher?"
 LibyaFocus.25.a: "Mohammed el-Senussi é o herdeiro legítimo!"
 LibyaFocus.25.b: "Idris el-Senussi nos convenceu!"
 LibyaFocus.25.c: "Ahmed el-Senussi é um verdadeiro herói da Líbia!"
 LibyaFocus.26.t: "[FROM.GetNameDef] Exige Autonomia"
 LibyaFocus.26.d: "O governo de [FROM.GetNameDef] alega que estamos maltratando nossas minorias. Eles exigem que essas minorias recebam autonomia plena sob sua proteção. Como devemos responder?"
 LibyaFocus.26.a: "Aceitar as exigências"
 LibyaFocus.26.b: "Isso nunca acontecerá"
 LibyaFocus.27.t: "[FROM.GetNameDef] Aceita as Exigências"
 LibyaFocus.27.d: "O governo de [FROM.GetNameDef] concordou com nossas exigências. Esta é uma grande vitória para a humanidade!"
 LibyaFocus.27.a: "Incrível"
 LibyaFocus.28.t: "[FROM.GetNameDef] Recusa Nossas Exigências"
 LibyaFocus.28.d: "O governo de [FROM.GetNameDef] recusou nossas exigências de maior autonomia. Parece que eles querem continuar oprimindo o nosso povo."
 LibyaFocus.28.a: "Eles vão receber o que merecem"
 LibyaFocus.29.t: "Escolhendo uma Bitola Ferroviária"
 LibyaFocus.29.d: "Como a Líbia não possui ferrovias, precisamos escolher a bitola a seguir. A escolha mais lógica seria usar a bitola padrão, que também é usada por nossos vizinhos do Norte da África. Alternativamente, poderíamos criar uma bitola líbia totalmente nova. Ainda teríamos os benefícios da ferrovia, mas dificultaríamos a conquista da Líbia por nossos vizinhos, caso algum dia decidam tentá-la."
 LibyaFocus.29.a: "A bitola padrão é a mais lógica"
 LibyaFocus.29.b: "Uma bitola líbia parece excelente!"
 LibyaFocus.30.t: "Pequeno Depósito de Minério Encontrado"
 LibyaFocus.30.d: "Após explorar o vale de Wadi Ash-Shat', nossos prospectores encontraram apenas um punhado de locais onde poderíamos escavar minério de ferro."
 LibyaFocus.30.a: "Não é bem o que procurávamos."
 LibyaFocus.31.t: "Depósito de Minério Médio Encontrado"
 LibyaFocus.31.d: "Após explorar o vale de Wadi Ash-Shat', nossos prospectores encontraram um local de tamanho razoável para uma nova mina de ferro. Isso deve aumentar consideravelmente nossa produção de minério de ferro."
 LibyaFocus.31.a: "Não é bem o que queríamos, mas ainda é bom."
 LibyaFocus.32.t: "Mina de Ouro Encontrada"
 LibyaFocus.32.d: "Os rumores são verdadeiros! Há um depósito enorme de minério de ferro sob o vale de Wadi Ash-Shat'! Não é tão grande quanto as histórias contam, mas ainda é imenso. Este é um ótimo desenvolvimento para a Líbia!"
 LibyaFocus.32.a: ":poggies:"
 LibyaFocus.33.t: "Negociando o Acordo"
 LibyaFocus.33.d: "Antes de enviarmos uma oferta a [?LBA_target_of_rail_project.GetNameDef], precisamos primeiro decidir o que vamos sugerir. Podemos oferecer dividir o custo do projeto. Alternativamente, podemos oferecer pagar a conta por completo. Será mais caro para nós, mas [?LBA_target_of_rail_project.GetNameDef] estará muito mais propenso a aceitar."
 LibyaFocus.33.a: "Dividir meio a meio."
 LibyaFocus.33.b: "Podemos pagar tudo."
 LBA_railroad_deal_tt: "Se eles aceitarem, então\n"
 LibyaFocus.34.t: "[FROM.GetNameDef] Oferece um Acordo Ferroviário"
 LibyaFocus.34.d: "O governo [FROM.GetAdjective] apresentou um acordo para combinar nossas redes ferroviárias e as deles. Esta pode ser uma oportunidade lucrativa para ambos os nossos países."
 LibyaFocus.34.a: "Aceitar o acordo."
 LibyaFocus.34.b: "Não queremos nada com eles."
 LibyaFocus.35.t: "[FROM.GetNameDef] Aceitou o Acordo"
 LibyaFocus.35.d: "O governo [FROM.GetAdjective] aceitou o acordo ferroviário oferecido."
 LibyaFocus.35.a: "Brilhante!"
 LibyaFocus.36.t: "[FROM.GetNameDef] Rejeita o Acordo"
 LibyaFocus.36.d: "O governo [FROM.GetAdjective] rejeitou o acordo ferroviário oferecido."
 LibyaFocus.36.a: "Maldição"
 LibyaFocus.37.t: "Escolhendo Nosso Fornecedor"
 LibyaFocus.37.d: "Tentamos adquirir armas nucleares por meio de terceiros várias vezes, mas nunca tivemos sucesso. Para proteger nossa soberania, precisamos de uma arma nuclear. De quem devemos tentar comprar? A China, com seus vastos recursos, seria capaz de entregar a arma com sigilo, mas é improvável que corra o risco. O Paquistão não está nas melhores relações conosco nem com o Ocidente, e sua proximidade permitiria uma entrega rápida. A Coreia do Norte certamente nos ajudaria contra o Ocidente, mas já é vigiada de perto pela comunidade internacional."
 LibyaFocus.37.a: "China"
 LibyaFocus.37.b: "Paquistão"
 LibyaFocus.37.c: "Coreia do Norte"
 Libya_buy_nukes_china_tt: "§GChance de Aceitação:§! §Y25%§!\n§RChance de Descoberta:§! §Y25%§!"
 Libya_buy_nukes_pakistan_tt: "§GChance de Aceitação:§! §Y50%§!\n§RChance de Descoberta:§! §Y50%§!"
 Libya_buy_nukes_north_korea_tt: "§GChance de Aceitação:§! §Y75%§!\n§RChance de Descoberta:§! §Y75%§!"
 LibyaFocus.38.t: "[FROM.GetNameDef] Propõe um Acordo Clandestino"
 LibyaFocus.38.d: "O governo de [FROM.GetNameDef] nos procurou com um acordo; eles querem comprar uma de nossas armas nucleares para si. Vender armas nucleares é estritamente proibido pelo direito internacional. Se formos pegos vendendo nossas armas nucleares, podemos sofrer sanções internacionais."
 LibyaFocus.38.a: "Podemos correr o risco"
 LibyaFocus.38.b: "De jeito nenhum"
 LibyaFocus.39.t: "[FROM.GetNameDef] Aceita Nosso Acordo"
 LibyaFocus.39.d: "[FROM.GetName] concordou com nosso acordo. Eles prepararam a arma nuclear para o transporte e devemos recebê-la em algumas semanas, se nada der errado."
 LibyaFocus.39.a: "Ótimo"
 LibyaFocus.40.t: "[FROM.GetNameDef] Rejeita Nosso Acordo"
 LibyaFocus.40.d: "[FROM.GetName] rejeitou nosso acordo, alegando que ele envolve risco demais e pode até ser imoral. Para nossa sorte, não nos denunciaram à comunidade internacional."
 LibyaFocus.40.a: "Que pena"
 LibyaFocus.41.t: "Armas Nucleares Chegam em Segurança"
 LibyaFocus.41.d: "A arma nuclear que encomendamos chegou em segurança à Líbia. Disfarçada de equipamento de dessalinização de água, a bomba viajou em um cargueiro comum. Finalmente somos uma potência nuclear."
 LibyaFocus.41.a: "Incrível"
 Libya_nuclear_deterrent_tt: "§YOs países terão menos probabilidade de ser hostis a nós devido à nossa dissuasão nuclear!§!"
 LibyaFocus.42.t: "Arma Nuclear Encontrada no Mar"
 LibyaFocus.42.d: "Ontem à noite, recebemos relatos de um possível dispositivo nuclear sendo transportado a bordo de um cargueiro no Mar Vermelho. Uma equipe de Navy Seals embarcou e assumiu o controle dos navios. Foi confirmado que um dispositivo nuclear estava a bordo. Após interrogar a tripulação do [FROM.GetAdjective], eles declararam que estavam indo para a Líbia. Não temos certeza da origem da arma, embora ela tivesse marcações do [FROM.GetAdjective] e o navio tivesse deixado o porto de [FROM.GetNameDef] uma semana antes, o que os torna altamente suspeitos. A arma agora está sendo transportada para os EUA, pronta para ser desativada. Como devemos responder a esse incidente?"
 LibyaFocus.42.a: "A arma está segura, deixe como está"
 LibyaFocus.42.b: "A Líbia foi longe demais, eles vão pagar!"
 LibyaFocus.42.c: "A Líbia foi longe demais, eles e seus aliados vão pagar!"
 LibyaFocus.43.t: "Estados Unidos Confiscam Arma Nuclear"
 LibyaFocus.43.d: "Os Estados Unidos descobriram nossa arma nuclear durante o transporte. Eles garantiram a segurança da arma e começaram a transportá-la para os Estados Unidos para descarte. Enviaram-nos um aviso, mas ficaram nisso. A benevolência deles parece ter nos salvado."
 LibyaFocus.43.a: "Ufa"
 LibyaFocus.44.t: "Estados Unidos Intervêm"
 LibyaFocus.44.d: "Os Estados Unidos descobriram nossa arma nuclear durante o transporte. Eles garantiram a segurança da arma e começaram a transportá-la para os Estados Unidos para descarte. Enviaram-nos um comunicado oficial dizendo que, por causa de nossas ações, somos uma ameaça à paz mundial. É provável que agora tentem derrubar nosso governo."
 LibyaFocus.44.a: "Maldição"
 LibyaFocus.45.t: "Estados Unidos Nos Impõem Sanções"
 LibyaFocus.45.d: "Os Estados Unidos descobriram nossa arma nuclear a caminho da Líbia durante o transporte. Eles garantiram a segurança da arma e começaram a transportá-la para os Estados Unidos para descarte. Por causa de nossas ações ao ajudar outro país a adquirir uma arma nuclear, eles e seus aliados nos impuseram sanções."
 LibyaFocus.45.a: "Maldição"
 LibyaFocus.46.t: "[FROM.GetNameDef] Quer Comprar Armas"
 LibyaFocus.46.d: "O governo [FROM.GetAdjective] nos abordou com um acordo. Eles querem aumentar a cooperação militar conosco comprando [ROOT.GetAdjective] armas. Isso nos permitiria aumentar nossa influência na Líbia."
 LibyaFocus.46.a: "Claro."
 LibyaFocus.46.b: "Não podemos"
 LibyaFocus.47.t: "[FROM.GetNameDef] Aceita Nosso Acordo"
 LibyaFocus.47.d: "[FROM.GetNameDef] aceitou nosso pedido de comprar armas deles."
 LibyaFocus.47.a: "Ótimo"
 LibyaFocus.48.t: "[FROM.GetNameDef] Rejeita Nosso Acordo"
 LibyaFocus.48.d: "[FROM.GetNameDef] negou nosso pedido de comprar armas deles."
 LibyaFocus.48.a: "Maldição"
 LibyaFocus.49.t: "[FROM.GetNameDef] Entra na USAID"
 LibyaFocus.49.d: "[FROM.GetNameDef] entrou no programa da USAID."
 LibyaFocus.49.a: "Ok"
 LibyaFocus.50.t: "[FROM.GetNameDef] Exige Reparações"
 LibyaFocus.50.d: "[FROM.GetAdjective] O governo nos contatou e está exigindo reparações pelos danos causados ​​pelo domínio colonial. Houve discussões na Itália (e em outros países ocidentais) sobre reparações, mas nada foi pago até agora. Compensar a Líbia pelos danos coloniais nos tornaria o primeiro país do mundo a fazê-lo, o que poderia impulsionar nossa imagem. Alguns funcionários do governo estão aconselhando que, em vez disso, deveríamos ter algum tipo de acordo mútuo com a Líbia em troca dessas reparações."
 LibyaFocus.50.a: "Pagar as reparações"
 LibyaFocus.50.b: "Precisamos de algo em troca"
 LibyaFocus.50.c: "Eles não vão receber um centavo nosso"
 LibyaFocus.50_tt: "§GOferecemos reparações a [FROM.GetNameDef] se eles concordarem em trabalhar conosco para conter a imigração ilegal no Mediterrâneo§!\nSe [FROM.GetNameWithFlag] aceitar, então\n"
 LibyaFocus.51.t: "[FROM.GetNameDef] Paga Reparações"
 LibyaFocus.51.d: "O governo [FROM.GetAdjective] concordou em pagar reparações por seu domínio colonial. US$ 5 bilhões serão pagos como compensação direta, e cuidados médicos serão cobertos para pessoas prejudicadas pelos resquícios do colonialismo. Isso faz da Itália a primeira velha potência colonial a pagar indenização por seu domínio colonial."
 LibyaFocus.51.a: "Eles são um exemplo para as potências ocidentais"
 LibyaFocus.52.t: "[FROM.GetNameDef] Recusa-se a Pagar"
 LibyaFocus.52.d: "O governo [FROM.GetAdjective] se recusou a pagar pelos danos causados ​​pelo colonialismo. Segundo eles, a Itália de hoje não é responsável pela Itália de ontem."
 LibyaFocus.52.a: "Canalhas"
 LibyaFocus.53.t: "[FROM.GetNameDef] Propõe Cooperação"
 LibyaFocus.53.d: "Após exigirmos reparações de [FROM.GetNameDef], o governo deles sugeriu uma contraproposta: estão dispostos a pagar as reparações se concordarmos em trabalhar com eles para reduzir a imigração ilegal para a Europa. Isso incluiria patrulhas conjuntas com a Marinha Italiana na costa líbia e o uso de satélites europeus para monitorar nossas fronteiras terrestres."
 LibyaFocus.53.a: "Parece um acordo justo"
 LibyaFocus.53.b: "Eles só estão tentando nos explorar de novo"
 LibyaFocus.54.t: "[FROM.GetNameDef] Aceita Nossa Contraproposta"
 LibyaFocus.54.d: "[FROM.GetNameDef] concordou com nosso acordo para reduzir a imigração ilegal no Mediterrâneo."
 LibyaFocus.54.a: "Ótimo"
 LibyaFocus.55.t: "[FROM.GetNameDef] Rejeita Nossa Contraproposta"
 LibyaFocus.55.d: "[FROM.GetNameDef] rejeitou nosso acordo para reduzir a imigração ilegal no Mediterrâneo."
 LibyaFocus.55.a: "Maldição"
 LibyaFocus.56.t: "[FROM.GetNameDef] Apoia Nossa Independência"
 LibyaFocus.56.d: "[FROM.GetNameDef] reafirmou seu apoio à nossa independência do Marrocos e sinalizou que deseja trabalhar ainda mais perto de nós no futuro."
 LibyaFocus.56.a: "Ótimo"
 LibyaFocus.57.t: "[FROM.GetNameDef] Nos Abandona"
 LibyaFocus.57.d: "[FROM.GetNameDef] retirou seu apoio à nossa independência. Foram nossos apoiadores por décadas, mas parece que agora nos abandonaram para melhorar suas relações com o Marrocos."
 LibyaFocus.57.a: "Traidores!"
 LibyaFocus.58.t: "[FROM.GetNameDef] Realiza Conferência de Paz"
 LibyaFocus.58.d: "[FROM.GetAdjective] organizou uma conferência de paz, chamando-a de Acordos de Casablanca. O objetivo deles é criar uma solução de paz duradoura para o conflito existente no Saara Ocidental. Fomos solicitados a enviar uma delegação para a conferência deles."
 LibyaFocus.58.a: "Enviar uma delegação"
 LibyaFocus.59.t: "Escolhendo um Plano de Paz"
 LibyaFocus.59.d: "Precisamos elaborar uma solução para o conflito no Saara Ocidental. Em essência, há quatro opções válidas:\n\n1. Anexação do Saara Ocidental pelo Marrocos\n2. Autonomia Limitada para o Saara Ocidental\n3. Independência total para os Saarauís\n4. Unir a área à Mauritânia."
 LibyaFocus.59.a: "O Saara Ocidental deve fazer parte do Marrocos"
 libya_western_sahara_peace_plan_annexation_tt: "§YEsta opção é favorecida por [MOR.GetNameWithFlag], mas os demais provavelmente se oporão§!"
 LibyaFocus.59.b: "O Saara Ocidental deve ter autonomia limitada"
 libya_western_sahara_peace_plan_autonomy_tt: "§YEsta é uma solução de compromisso que todas as partes poderiam ser influenciadas a aceitar§!"
 LibyaFocus.59.c: "O Saara Ocidental deve ser independente"
 libya_western_sahara_peace_plan_independence_tt: "§YEsta opção é favorecida por [SHA.GetNameWithFlag] e [ALG.GetNameWithFlag], mas [MOR.GetNameWithFlag] provavelmente se oporá§!"
 LibyaFocus.59.de: "Unir o Saara Ocidental à Mauritânia"
 libya_western_sahara_peace_plan_mauritania_tt: "§YEsta opção provavelmente será rejeitada por todos, exceto por uma [MAU.GetNameWithFlag] nacionalista§!"
 LibyaFocus.60.t: "[FROM.GetNameDef] Pede Nosso Apoio ao Seu Plano de Paz"
 LibyaFocus.60.da: "[FROM.GetName] pede nosso apoio ao seu plano de paz para o Saara Ocidental. O plano é que toda a região seja anexada ao Marrocos. Podemos apoiar isso?"
 LibyaFocus.60.db: "[FROM.GetName] pede nosso apoio ao seu plano de paz para o Saara Ocidental. O plano é que o Saara Ocidental seja uma parte autônoma do Marrocos. Podemos apoiar isso?"
 LibyaFocus.60.dc: "[FROM.GetName] pede nosso apoio ao seu plano de paz para o Saara Ocidental. O plano é que o Saara Ocidental se torne independente do Marrocos. Podemos apoiar isso?"
 LibyaFocus.60.dd: "[FROM.GetName] pede nosso apoio ao seu plano de paz para o Saara Ocidental. O plano é que o Saara Ocidental seja anexado à Mauritânia. Podemos apoiar isso?"
 LibyaFocus.60.a: "Podemos aceitar este plano"
 LibyaFocus.60.b: "Isto não é aceitável para nós"
 LibyaFocus.60.c: "Esta conferência é inútil, retire nossa delegação"
 LibyaFocus.61.t: "[FROM.GetNameDef] Aceita o Plano de Paz"
 LibyaFocus.61.d: "[FROM.GetNameDef] aceitou nossa solução para o conflito do Saara Ocidental."
 LibyaFocus.61.a: "Ótimo"
 LibyaFocus.62.t: "[FROM.GetNameDef] Rejeita o Plano de Paz"
 LibyaFocus.62.d: "[FROM.GetNameDef] rejeitou nossa solução para o conflito do Saara Ocidental."
 LibyaFocus.62.a: "Maldição"
 LibyaFocus.63.t: "[FROM.GetNameDef] Deixa a Conferência de Paz"
 LibyaFocus.63.d: "A delegação [FROM.GetAdjective] anunciou que deixará os Acordos de Casablanca. Eles declararam que nossas demandas por paz são ridículas e que eles não têm mais interesse em participar."
 LibyaFocus.63.a: "Maldição"
 LibyaFocus.64.t: "[FROM.GetNameDef] Exige Autonomia Cretense"
 LibyaFocus.64.d: "O governo [FROM.GetAdjective] declarou que está preocupado com nossa posição na ilha de Creta. Segundo eles, nosso controle rígido sobre a ilha compromete sua segurança. Eles estão exigindo que Creta tenha autonomia limitada para garantir nossa presença militar e política reduzida na área."
 LibyaFocus.64.a: "Acho que podemos"
 LibyaFocus.64.b: "Isso é ridículo"
 LibyaFocus.65.t: "[FROM.GetNameDef] Aceita"
 LibyaFocus.65.d: "O governo [FROM.GetAdjective] aceitou nossas demandas para aumentar a autonomia do povo cretense."
 LibyaFocus.65.a: "Sucesso"
 LibyaFocus.66.t: "[FROM.GetNameDef] Rejeita"
 LibyaFocus.66.d: "O governo [FROM.GetAdjective] rejeitou nossas exigências para aumentar a autonomia do povo cretense."
 LibyaFocus.66.a: "Eles vão se arrepender"
 LibyaFocus.66.b: "Esperaremos nossa hora"
 LibyaFocus.67.t: "Hamas Inicia Nova Intifada"
 LibyaFocus.67.d: "O Hamas convocou uma nova intifada contra nós. Estamos vendo maior movimentação de militantes do Hamas e já houve várias manifestações contra o nosso domínio sobre a Palestina. Temos relatos de que a Líbia pode estar por trás do armamento e da motivação do Hamas para esta nova campanha."
 LibyaFocus.67.a: "Eles vão se arrepender"
 LibyaFocus.68.t: "[FROM.GetNameDef] Patrocina uma Nova Intifada"
 LibyaFocus.68.d: "[FROM.GetAdjective] enviou armas e dinheiro para que comecemos uma nova Intifada contra Israel. Já temos uma fila de novos recrutas perto de nossos escritórios, e as pessoas estão se mobilizando para protestar contra os ocupantes israelenses."
 LibyaFocus.68.a: "Agradecemos à Líbia"
 LibyaFocus.69.t: "Hamas Se Levanta"
 LibyaFocus.69.d: "Estamos recebendo relatos de combatentes do Hamas tomando instituições e prédios importantes na Faixa de Gaza. Eles juraram que Israel sofrerá com uma nova Intifada."
 LibyaFocus.69.a: "Maldição"
 LibyaFocus.69.b: "Esmagá-los!"
 LibyaFocus.70.t: "[FROM.GetNameDef] Contata os Toubou"
 LibyaFocus.70.d: "Recebemos relatos de que a Líbia começou a armar rebeldes toubou no norte do nosso país. Se a Líbia invadir, esses rebeldes certamente se juntarão à causa deles."
 LibyaFocus.70.a: "Preocupante"
 LibyaFocus.71.t: "[FROM.GetNameDef] Sugere Mineração Conjunta"
 LibyaFocus.71.d: "O governo [FROM.GetAdjective] sugeriu um empreendimento conjunto de mineração de urânio na faixa de Aouzou. Isso fornecerá recursos para ambos os nossos países no futuro. Como devemos responder?"
 LibyaFocus.71.a: "Ótima ideia!"
 LibyaFocus.71.b: "Não nos importamos"
 LibyaFocus.72.t: "[FROM.GetNameDef] Aceita Nosso Acordo"
 LibyaFocus.72.d: "O governo [FROM.GetAdjective] aceitou o nosso acordo sobre mineração conjunta"
 LibyaFocus.72.a: "Ótimo"
 LibyaFocus.73.t: "[FROM.GetNameDef] Rejeita Nosso Acordo"
 LibyaFocus.73.d: "O governo [FROM.GetAdjective] rejeitou nosso acordo de mineração conjunta"
 LibyaFocus.73.a: "Maldição"
 LibyaFocus.74.t: "[FROM.GetNameDef] Inicia Mineração de Urânio"
 LibyaFocus.74.d: "[FROM.GetNameDef] começou a minerar urânio na Faixa de Aouzou. Enquanto a maioria dos recursos vai para eles, nós também ganhamos uma pequena parte e os [FROM.GetAdjective] concordaram em cobrir todos os custos da escavação."
 LibyaFocus.74.a: "Ok"
 LibyaFocus.75.t: "Toubou Se Levantam"
 LibyaFocus.75.d: "Assim que as forças [FROM.GetAdjective] começaram a cruzar a fronteira, vários grupos de toubou tomaram o controle de prédios-chave em algumas das cidades maiores do norte do Chade, na esperança de receber os [FROM.GetAdjective]s como libertadores. Os tribais estão mal armados e são poucos, mas causarão perturbações na retaguarda de nossas linhas."
 LibyaFocus.75.a: "Maldição"
 LibyaFocus.76.t: "[FROM.GetNameDef] Patrocina Militantes em Darfur"
 LibyaFocus.76.d: "Recebemos relatos de mercenários [FROM.GetAdjective] cruzando a fronteira para Darfur. Trazendo caminhões de armas com eles, eles armaram milícias locais de Darfur. Com o apoio deles, os Darfuri se levantaram contra nós."
 LibyaFocus.76.a: "Maldição"
 LibyaFocus.77.t: "[FROM.GetNameDef] Envia Mercenários"
 LibyaFocus.77.d: "A Líbia enviou um destacamento de mercenários de elite para se juntar às nossas fileiras como sinal de boa-fé. Com essa ação, eles desejam garantir a estabilidade do nosso regime."
 LibyaFocus.77.a: "Agradecemos muitíssimo"
 LibyaFocus.78.t: "Carregamento de Armas de [FROM.GetNameDef]"
 LibyaFocus.78.d: "Nosso antigo patrocinador [FROM.GetLeader] nos enviou um carregamento de armas para nos ajudar em nosso conflito."
 LibyaFocus.78.a: "Obrigado, velho amigo"
 LibyaFocus.79.t: "[FROM.GetNameDef] Faz Campanha por Mengistu"
 LibyaFocus.79.d: "[FROM.GetNameDef] iniciou uma campanha de apoio popular ao ditador exilado Mengistu. Estão tentando convencer o mundo de que ele não é o ditador genocida que realmente é."
 LibyaFocus.79.a: "Maldição"
 LibyaFocus.79.b: "Lançar uma contracampanha!"
 LibyaFocus.80.t: "Cooperação Industrial com [FROM.GetNameDef]"
 LibyaFocus.80.d: "[FROM.GetNameDef] sugeriu que nossos dois países cooperem no campo industrial. Juntos podemos combater o Imperialismo Ocidental."
 LibyaFocus.80.a: "Somos irmãos"
 LibyaFocus.81.t: "[FROM.GetNameDef] Prepara uma Revolução"
 LibyaFocus.81.d: "Temos relatos de soldados e armas de [FROM.GetNameDef] entrando em nosso país. Eles têm contatado membros da oposição e as projeções atuais mostram que lançarão um levante em três meses."
 LibyaFocus.81.a: "Devemos nos preparar"
 LibyaFocus.81.b: "Devemos lançar um ataque preventivo!"
 LibyaFocus.82.t: "[FROM.GetNameDef] Organiza um Golpe"
 LibyaFocus.82.d: "Inesperadamente, vários aviões de carga pousaram na capital. Os aviões rapidamente descarregaram veículos e um grande grupo de [ROOT.GetAdjective] e [FROM.GetAdjective] soldados. Os soldados imediatamente se mobilizaram e começaram a abrir caminho em direção ao Palácio Presidencial. Também recebemos relatos de bandidos armados vestidos com roupas civis causando confusão e tomando o controle de prédios municipais em todo o país. Parece que um golpe originário de [FROM.GetNameDef] está ocorrendo no país."
 LibyaFocus.82.a: "Eu me rendo!"
 LibyaFocus.82.b: "Lutaremos contra eles até o último homem!"
 LibyaFocus.83.t: "Escaramuças no Vale do Nugaal"
 LibyaFocus.83.d: "Recebemos relatos de troca de tiros na fronteira entre Puntlândia e Somalilândia. A área é contenciosa, pois ambos os lados reivindicam grandes áreas um do outro. Com base nas informações que temos agora, soldados do nosso vizinho cruzaram a fronteira e, após uma breve troca de tiros, recuaram. Nosso vizinho refuta essas alegações, afirmando que foram nossos soldados que cruzaram a fronteira. Parece que a tensão na região está crescendo."
 LibyaFocus.83.a: "Preparar nossas tropas!"
 LibyaFocus.83.b: "Tranquilizar nosso povo"
 LibyaFocus.84.t: "Chega um Misterioso Carregamento de Armas"
 LibyaFocus.84.d: "Várias caixas carregadas de munição e armas foram parar em um de nossos armazéns. Não temos ideia de onde essas armas vieram, pois não as encomendamos. As marcações nas caixas estão escritas em árabe e, segundo o manifesto de carga, elas ao menos passaram pelo porto de Djibuti. De onde poderiam ter vindo?"
 LibyaFocus.84.a: "Quem se importa?"
 LibyaFocus.85.t: "Escaramuças em Ogaden"
 LibyaFocus.85.d: "Recebemos relatos de troca de tiros na fronteira entre Somália e Etiópia. A região de Ogaden é disputada por ambos os lados devido a uma mistura de clãs etíopes e somalis que vivem na área e à falta de demarcação da fronteira oficial do Estado. Com base nas informações que temos agora, soldados do nosso vizinho cruzaram a fronteira e, após uma breve troca de tiros, recuaram. Nosso vizinho refuta essas alegações, afirmando que foram nossos soldados que cruzaram a fronteira. Parece que a tensão na região está crescendo."
 LibyaFocus.85.a: "Preparar nossas tropas!"
 LibyaFocus.85.b: "Tranquilizar nosso povo"
 LibyaFocus.86.t: "Insurgência em Ogaden"
 LibyaFocus.86.d: "Houve um aumento da atividade de rebeldes somalis na região de Ogaden. Não sabemos de onde veio o aumento do fluxo de armas para a região, mas insurgentes locais aproveitaram a situação. A resistência é relativamente local e de baixo nível, ao menos por enquanto."
 LibyaFocus.86.a: "Eles não são uma ameaça"
 LibyaFocus.87.t: "O Inimigo Cruza a Fronteira"
 LibyaFocus.87.d: "Está acontecendo. Nosso inimigo cruzou a fronteira e está tentando tomar o controle de todo o Vale do Nugaal."
 LibyaFocus.87.a: "Mobilizar as tropas!"
 LibyaFocus.88.t: "Somalis de Ogaden Se Levantam"
 LibyaFocus.88.d: "Os insurgentes somalis em Ogaden intensificaram suas operações e atacaram vários prédios do governo e postos de controle militares. Temos provas definitivas de que homens e suprimentos estão cruzando a fronteira vindos da Somália, com o apoio dos governos locais. Parece que a ânsia somali de se unir a Ogaden se inflamou mais uma vez. Devemos extinguir esses sonhos o quanto antes."
 LibyaFocus.88.a: "Ordenar aos nossos soldados que acabem com esta insurgência!"
 LibyaFocus.89.t: "[FROM.GetNameDef] Ocupa Socotra"
 LibyaFocus.89.d: "Nas primeiras horas de hoje, um avião de transporte do exército líbio pousou na ilha de Socotra. O avião descarregou soldados, que rapidamente desarmaram e detiveram nossas confusas unidades militares locais. Como os portos aéreos e marítimos foram protegidos, navios com equipamentos mais pesados ​​começaram a chegar. Não houve nenhuma explicação ou resposta dos oficiais [FROM.GetAdjective]."
 LibyaFocus.89.a: "Expulsá-los!"
 LibyaFocus.89.b: "Não podemos fazer nada a respeito"
 LibyaFocus.90.t: "Anexação do Saara Ocidental"
 LibyaFocus.90.d: "Os acordos de Casablanca sediados em [FROM.GetAdjective] resultaram em uma resolução muito favorável da nossa perspectiva. Os países participantes dos acordos decidiram que o Saara Ocidental deveria fazer parte do Marrocos."
 LibyaFocus.90.a: "Ótimo"
 LibyaFocus.91.t: "Autonomia para o Saara Ocidental"
 LibyaFocus.91.d: "Os acordos de Casablanca sediados em [FROM.GetAdjective] resultaram em uma resolução muito favorável da nossa perspectiva. Todas as partes concordaram que o conflito deveria ser resolvido dando aos saarianos ocidentais, ou saharauis, autonomia limitada dentro do Marrocos."
 LibyaFocus.91.a: "Ótimo"
 LibyaFocus.91.b: "Ótimo"
 LibyaFocus.92.t: "Independência para o Saara Ocidental"
 LibyaFocus.92.d: "Os acordos de Casablanca [FROM.GetAdjective] sediados resultaram no Saara Ocidental ganhando total independência do Marrocos. No futuro, o país será chamado de República Árabe Democrática Saarauí."
 LibyaFocus.92.a: "Ok"
 LibyaFocus.92.b: "Ótimo"
 LibyaFocus.93.t: "Saara Ocidental Une-se à Mauritânia"
 LibyaFocus.93.d: "Os acordos de Casablanca [FROM.GetAdjective] realizados resultaram na anexação do Saara Ocidental pela Mauritânia."
 LibyaFocus.93.a: "Ok"
 LibyaFocus.93.b: "Ótimo"
 LibyaFocus.94.t: "LIFG Incluído na Lista de Terroristas"
 LibyaFocus.94.d: "Após o ataque terrorista contra o World Trace Center nos EUA e a Guerra ao Terror travada pelos EUA, o Grupo Islâmico Combatente Líbio foi designado como organização terrorista tanto pelos EUA quanto pelo Reino Unido devido a ligações com a Al-Qaeda. O próprio LIFG negou quaisquer laços com a Al-Qaeda, afirmando que se recusou a aderir à Jihad que Osama Bin Laden declarou ao Ocidente em 1998."
 LibyaFocus.94.a: "Eles merecem isso"
 LibyaFocus.94.b: "Precisamos trabalhar juntos para destruí-los"
 LibyaFocus.94.c: "Isso não pode ser bom"
 LibyaFocus.95.t: "Tripolitânia Declara Independência"
 LibyaFocus.95.d: "Um conselho de líderes tribais tripolitanos anunciou que não aceita mais a autoridade do Estado sobre sua terra. Segundo eles, o governo mostrou claramente que não tem em mente os melhores interesses da Tripolitânia. Considerando que a maioria de nossas Forças Armadas vem da Tripolitânia, é provável que muitos deles mudem de lado. Com eles, vai embora um de nossos principais centros populacionais e campos de petróleo. Podemos permitir que isso aconteça?"
 LibyaFocus.95.a: "Precisamos destruí-los"
 LibyaFocus.95.b: "Não há nada que possamos fazer agora"
 LibyaFocus.96.t: "Cirenaica Declara Independência"
 LibyaFocus.96.d: "Um conselho de líderes tribais cirenaicos anunciou que não aceita mais a autoridade do Estado sobre sua terra. Segundo eles, o governo mostrou claramente que não tem em mente os melhores interesses da Cirenaica. Felizmente, a maior parte do pessoal de nossas Forças Armadas vem da Tripolitânia, e é improvável que muitos sejam atraídos para o lado cirenaico. No entanto, a Cirenaica detém quase metade de nossas reservas de petróleo. Podemos permitir que isso aconteça?"
 LibyaFocus.96.a: "Precisamos destruí-los"
 LibyaFocus.96.b: "Não há nada que possamos fazer agora"
 LibyaFocus.97.t: "Fezzan Declara Independência"
 LibyaFocus.97.d: "Um conselho de líderes tribais do Fezzan anunciou que não aceita mais a autoridade do Estado sobre sua terra. Segundo eles, o governo mostrou claramente que não tem em mente os melhores interesses do Fezzan. Felizmente, o Fezzan é uma região muito pouco povoada e provavelmente não será um desafio para nós esmagá-los. Podemos permitir que isso aconteça?"
 LibyaFocus.97.a: "Precisamos destruí-los"
 LibyaFocus.97.b: "Não há nada que possamos fazer agora"
 LibyaFocus.98.t: "[FROM.GetNameDef] Exige a Faixa de Aouzou"
 LibyaFocus.98.d: "O governo [FROM.GetAdjective] está exigindo que devolvamos a eles o controle da Faixa de Aouzou. A verdade é que a área nunca foi deles para começar, e nós já lhes demos uma lição na Guerra da Toyota. Podemos derrotá-los novamente?"
 LibyaFocus.98.a: "Não estamos em condições de lutar, entregar a terra"
 LibyaFocus.98.b: "O Chade não se curva a ninguém!"
 LibyaFocus.99.t: "[FROM.GetNameDef] Envia Ajuda Humanitária"
 LibyaFocus.99.d: "O governo [FROM.GetAdjective] nos enviou um grande pacote de ajuda para nos ajudar a melhorar os vários problemas sociais que assolam o país."
 LibyaFocus.99.a: "Agradecemos aos nossos amigos [FROM.GetAdjective]"
 LibyaFocus.100.t: "[FROM.GetNameDef] Oferece um Acordo Comercial de Algodão"
 LibyaFocus.100.d: "O governo [FROM.GetAdjective] demonstrou disposição para investir em nossa indústria de algodão. Em troca, eles querem que assinemos um acordo comercial em que uma grande quantidade de algodão chadiano seria exportada para a Líbia. Este acordo tem uma chance de melhorar muito nossa perspectiva econômica."
 LibyaFocus.100.a: "Sim, claro"
 LibyaFocus.100.b: "Podemos fazer isso sem eles"
 LibyaFocus.101.t: "[FROM.GetNameDef] Concorda com Nosso Acordo Comercial"
 LibyaFocus.101.d: "O governo [FROM.GetAdjective] concordou em assinar o acordo comercial do algodão conosco."
 LibyaFocus.101.a: "Ótimo"
 LibyaFocus.102.t: "[FROM.GetNameDef] Rejeita Nosso Acordo Comercial"
 LibyaFocus.102.d: "O governo [FROM.GetAdjective] se recusou a assinar o acordo comercial de algodão conosco."
 LibyaFocus.102.a: "Então vamos investir o dinheiro em [ROOT.GetName]"
 LibyaFocus.102.b: "Malditos sejam"
 LibyaFocus.103.t: "[FROM.GetNameDef] Assume o Controle do Petróleo"
 LibyaFocus.103.d: "Usando sua influência sobre nosso país, o [FROM.GetAdjective] conseguiu de alguma forma convencer nosso Ministro de Energia a dar direitos de perfuração de recursos para a Libyan National Oil Corporation. Apesar das pesadas objeções de outros políticos, o ministro e os proprietários chadianos dos campos de petróleo ficaram mais do que felizes em dar o controle dos campos. Homens armados vestindo uniformes líbios rapidamente substituíram as unidades de guarda chadianas locais nos campos de petróleo, e parece que eles estão aqui para ficar."
 LibyaFocus.103.a: "Não acredito que fizeram isso"
 LibyaRandomEvents.1.t: "Reforma Ministerial"
 LibyaRandomEvents.1.d: "No ano 2000, a Líbia fez mudanças significativas na estrutura de seu gabinete. Doze ministros no total foram substituídos, incluindo o Primeiro-Ministro (também Secretário-Geral do Comitê Popular Geral) e o Ministro das Relações Exteriores. O cargo de Primeiro-Ministro passou de Muhammad Ahmad al-Mangoush para Imbarek Shamekh, antes Ministro da Habitação e Serviços Públicos."
 LibyaRandomEvents.1.a: "Um governo estável para uma nação estável"
 LibyaRandomEvents.1.b: "Shamekh será um ótimo Primeiro-Ministro"
 LibyaRandomEvents.1.c: "A troca do Ministro das Relações Exteriores foi importante"
 LibyaRandomEvents.2.t: "Tumultos Anti-Negros"
 LibyaRandomEvents.2.d: "A Líbia é um destino comum para migrantes africanos. A maioria desses migrantes vive no país ilegalmente, sem documentação. Esses migrantes são frequentemente alvo de gangues de jovens. Houve uma onda de violência recentemente, com centenas de casas de migrantes incendiadas e dezenas de mortos. Muitos países africanos culpam as forças de segurança do Estado por negligência, já que nenhuma prisão foi feita."
 LibyaRandomEvents.2.a: "Prometer conduzir uma investigação adequada"
 LibyaRandomEvents.2.b: "Fazer algumas prisões para constar"
 LibyaRandomEvents.2.c: "É isso que acontece quando se vem para cá ilegalmente"
 LibyaRandomEvents.3.t: "Queda de Avião Perto de Marsa al-Brega"
 LibyaRandomEvents.3.d: "Ao meio-dia de hoje, uma aeronave Short 360 operada pela Sirte Oil Company caiu no mar perto da cidade de Marsa al-Brega enquanto transportava trabalhadores e suas famílias de Trípoli. É comum que as petrolíferas levem trabalhadores de avião entre locais e cidades, pois não existe um meio de transporte alternativo viável. O avião levava 38 pessoas, a maioria de nacionalidade líbia e britânica. 19 delas sobreviveram à queda e foram resgatadas do mar. A aeronave caiu porque ambos os motores falharam, mas a razão exata ainda é desconhecida."
 LibyaRandomEvents.3.a: "Precisamos investigar o acidente"
 LibyaRandomEvents.3.b: "Essas coisas acontecem"
 LibyaRandomEvents.4.t: "Investigação da Queda do Avião Concluída"
 LibyaRandomEvents.4.d: "A investigação sobre a queda do avião em Marsa al-Brega foi concluída. O avião caiu por causa de motores alagados. O avião havia voado através de uma formação de nuvens, o que fez os motores acumularem umidade e gelo. Quando o avião reduziu a altitude, o gelo derreteu e alagou os motores. O piloto sênior havia ignorado os boletins meteorológicos, pois o tempo na Líbia 'costuma ser ameno'. A tripulação de voo também havia deixado de ligar o sistema antigelo, pois estava distraída com uma conversa sobre o sistema operacional do Fokker F28. Além disso, a tripulação de cabine não havia informado aos passageiros que seus assentos podiam ser usados como dispositivos de flutuação. Isso muito provavelmente causou mortes adicionais por afogamento, já que o avião não estava equipado com coletes salva-vidas, que não são exigidos em voos curtos."
 LibyaRandomEvents.4.a: "A negligência da tripulação de voo foi o que causou isso"
 LibyaRandomEvents.4.b: "Sem coletes salva-vidas? Precisamos de melhor regulamentação"
 LibyaRandomEvents.4.c: "Só precisamos de aviões melhores"
 LibyaRandomEvents.5.t: "Olomby Vence a Copa Premier"
 LibyaRandomEvents.5.d: "A história foi feita na Copa Premier deste ano, a principal copa de futebol da Líbia; o Club Olomby, da cidade de Zawia, venceu o campeonato com 57 pontos, com o Al Ittihad, de Trípoli, em 2º lugar com 52 pontos. O que torna este evento especial é que, pela primeira vez na história da Líbia, um clube que não é de Trípoli nem de Benghazi conseguiu vencer a copa. Este é verdadeiramente um dia histórico para o futebol líbio."
 LibyaRandomEvents.5.a: "Parabéns, Olomby!"
 LibyaRandomEvents.5.b: "Eu queria que o Al Hittihad tivesse vencido"
 LibyaRandomEvents.5.c: "O Al Ahly deveria ter levado a vitória este ano"
 LibyaRandomEvents.5.dd: "A surpresa deveria ter vindo do Ascharara"
 LibyaRandomEvents.6.t: "Um Homem para Salvar a Economia"
 LibyaRandomEvents.6.d: "Com a economia líbia sofrendo sob sanções internacionais, há discussões em andamento sobre se a liderança do país precisa de mudança. Há sugestões de que o atual Primeiro-Ministro seja substituído. O substituto recomendado é Shukri Ghanem, diretor de marketing da Corporação Nacional de Petróleo. Ghanem também foi diretor de pesquisa da OPEP e trabalhou em vários cargos no Ministério do Petróleo e no Ministério da Economia. Nosso atual Primeiro-Ministro deve ser substituído por ele?"
 LibyaRandomEvents.6.a: "Tornar Ghanem o Primeiro-Ministro"
 LibyaRandomEvents.6.b: "Devemos aproveitar sua especialização em pesquisa"
 LibyaRandomEvents.6.c: "Usá-lo como alavanca para motivar o atual Primeiro-Ministro"
 LibyaRandomEvents.7.t: "Origem das Centrífugas Vazada"
 LibyaRandomEvents.7.d: "Vazou para a imprensa mundial que algumas das centrífugas destinadas ao nosso programa nuclear foram adquiridas com a ajuda do Paquistão. As peças foram fabricadas na Malásia e depois enviadas à Líbia via Dubai com a ajuda do Paquistão. As fontes dizem que o Paquistão se envolveu em atividades semelhantes com a Coreia do Norte e o Irã. Autoridades paquistanesas declararam que não tinham conhecimento das negociações e que os materiais foram manuseados por criminosos do mercado negro. De qualquer forma, isso ainda prejudica nossa imagem pública."
 LibyaRandomEvents.7.a: "Podemos comprar o que quisermos"
 LibyaRandomEvents.7.b: "Não adquirimos nada ilegalmente!"
 LibyaRandomEvents.7.c: "O Mundo sabe que estamos corrigindo erros do passado"
 LBA_disarmament_public_tt: "Esta opção está disponível porque concluímos §Y$LBA_disarmament_program$§!"
 LibyaRandomEvents.8.t: "A Declaração do Primeiro-Ministro"
 LibyaRandomEvents.8.d: "Em entrevista à BBC, nosso Primeiro-Ministro declarou que, como oferecemos compensação às vítimas dos Atentados de Lockerbie, a Líbia havia 'comprado a paz', mas não aceitado a culpa. Isso contradiz nossas declarações anteriores de que assumimos a responsabilidade pelos ataques."
 LibyaRandomEvents.8.a: "O Primeiro-Ministro tem razão"
 LibyaRandomEvents.8.b: "Emitir uma declaração de reafirmação"
 LibyaRandomEvents.8.c: "Demitir este imbecil!"
 LibyaRandomEvents.9.t: "Equipamento Nuclear Entregue"
 LibyaRandomEvents.9.d: "Em comunicado à imprensa hoje, a Casa Branca confirmou que a última peça de equipamento nuclear líbio foi entregue aos Estados Unidos. O último carregamento incluía todas as peças de centrífugas, equipamento de conversão de urânio e todos os mísseis de longo alcance e equipamentos de lançamento. [LBA.GetLeader] disse ao Washington Post que está otimista quanto às relações futuras com os EUA, agora que foram 'capazes de conversar'."
 LibyaRandomEvents.9.a: "Um grande passo rumo ao desarmamento!"
 LibyaRandomEvents.9.b: "Agora estamos abertos para negócios"
 LibyaRandomEvents.10.t: "Enfermeiras Condenadas à Morte"
 LibyaRandomEvents.10.d: "Cinco enfermeiras búlgaras e um médico palestino foram condenados à morte por infectar intencionalmente crianças líbias com HIV. Há vários anos, ocorreu um surto de HIV em um hospital infantil de Benghazi. Segundo o tribunal, as enfermeiras e o médico infectaram 426 crianças com o vírus para pesquisar uma possível cura. Dessas crianças, 47 já morreram. Os réus continuam a se declarar inocentes, afirmando que o surto já estava em pleno andamento quando chegaram ao país e foi causado pela má higiene do hospital. Também afirmam que só deram suas confissões depois de serem torturados pela polícia líbia.\n\nOs EUA e a UE têm pressionado a Líbia a reverter a decisão, chegando a pedir que [LBA.GetLeader] intervenha. No entanto, os pais das crianças exigem a pena de morte."
 LibyaRandomEvents.10.a: "Como podemos libertar assassinos de crianças?"
 LibyaRandomEvents.10.b: "Não devemos usá-los como bodes expiatórios da má higiene"
 LibyaRandomEvents.11.t: "Enfermeiras Executadas"
 LibyaRandomEvents.11.d: "Na madrugada de hoje, as cinco enfermeiras búlgaras e o médico palestino foram executados por um pelotão de fuzilamento. Familiares das crianças mortas e infectadas haviam se reunido em volta do tribunal. Ouviu-se uma ovação quando os tiros ecoaram pelas ruas de Benghazi."
 LibyaRandomEvents.11.a: "Justiça"
 LibyaRandomEvents.12.t: "Suprema Corte Anula a Sentença"
 LibyaRandomEvents.12.d: "A Suprema Corte Líbia anulou a sentença de morte das cinco enfermeiras búlgaras e do médico palestino. Essa decisão veio apenas alguns dias antes da data prevista para a execução. Pais e parentes das crianças infectadas ficaram do lado de fora da suprema corte, protestando contra a decisão e exigindo que a pena de morte fosse cumprida. Estão bastante insatisfeitos com a incapacidade de [LBA.GetLeader] de fazer justiça."
 LibyaRandomEvents.12.a: "Por que os juízes não fazem o que eu mando?"
 LibyaRandomEvents.13.t: "Um Novo Primeiro-Ministro?"
 LibyaRandomEvents.13.d: "Com as sanções internacionais suspensas, talvez agora seja a hora de outra troca de Primeiro-Ministro? Um ótimo candidato seria o atual vice-Primeiro-Ministro Baghdadi Mahmudi. Mahmudi tem formação em medicina e foi Ministro da Saúde e da Previdência Social. Também tem experiência em outros ministérios. Ele nos disse que, se fosse feito Primeiro-Ministro, criaria uma Autoridade de Investimento Líbia que pegaria parte de nossos lucros do petróleo e os investiria para as futuras gerações."
 LibyaRandomEvents.13.a: "Uma Autoridade de Investimento Líbia parece uma ótima ideia"
 LibyaRandomEvents.13.b: "Devemos aproveitar sua especialização em pesquisa"
 LibyaRandomEvents.13.c: "Nosso atual Primeiro-Ministro está indo bem"
 LibyaRandomEvents.14.t: "Líbia Removida da Lista de Terrorismo"
 LibyaRandomEvents.14.d: "O Departamento de Estado dos EUA anunciou hoje que a Líbia será removida de sua lista de Estados patrocinadores do terrorismo. Este é um grande passo para melhorar as relações entre a Líbia e o Ocidente."
 LibyaRandomEvents.14.a: "A América agora é nossa amiga"
 LibyaRandomEvents.14.b: "Não merecíamos estar naquela lista, para começar!"
 LibyaRandomEvents.15.t: "Somália Nos Acusa de Apoiar Terroristas"
 LibyaRandomEvents.15.d: "O governo somali que combate os islamistas nos acusou, junto com o Egito e o Irã, de apoiar islamistas na Somália. Alegam que temos entregado armas, alimentando o conflito."
 LibyaRandomEvents.15.a: "Aquelas armas eram para vocês"
 LibyaRandomEvents.15.b: "Podemos enviar nossas armas a quem quisermos"
 LibyaRandomEvents.15.c: "Não enviamos armas a ninguém"
 LibyaRandomEvents.16.t: "Reunião da União Africana"
 LibyaRandomEvents.16.d: "Em uma recente reunião dos membros da União Africana, [LBA.GetLeader] conversou com outros líderes sobre o plano de unificação africana. Ainda há alguma resistência à ideia, já que muitos líderes africanos temem que o foco na união reduza os recursos destinados a resolver os diversos conflitos do continente. Além disso, muitos relatórios externos mostram que a União Africana, mesmo em seu estado atual, apresenta várias irregularidades fiscais, o que corrói a confiança na União."
 LibyaRandomEvents.16.a: "Pelo menos alguns tinham pontos em comum"
 LibyaRandomEvents.16.b: "A África é forte o bastante para resolver seus próprios problemas"
 LibyaRandomEvents.16.c: "As preocupações com a corrupção são válidas"
 LibyaRandomEvents.17.t: "[FRA.GetLeader] visita a Líbia"
 LibyaRandomEvents.17.d: "O presidente francês [FRA.GetLeader] visitou a Líbia para melhorar as relações entre os dois países. Reunidos em uma tenda em Trípoli, ele e [LBA.GetLeader] discutiram a assinatura de um acordo de cooperação militar-industrial, bem como a participação de empresas petrolíferas francesas nos campos de petróleo líbios."
 LibyaRandomEvents.17.a: "Damos boas-vindas às indústrias francesas"
 LibyaRandomEvents.17.b: "O que foi isso sobre petróleo?"
 LibyaRandomEvents.17.c: "E se investíssemos na França em vez disso?"
 LibyaRandomEvents.18.t: "Comprando armas francesas"
 LibyaRandomEvents.18.d: "Os franceses nos ofereceram a oportunidade de comprar alguns mísseis antitanque e equipamentos de comunicação. Devemos aceitar a oferta?"
 LibyaRandomEvents.18.a: "Claro"
 LibyaRandomEvents.18.b: "Por acaso vocês não têm mísseis antiaéreos?"
 LibyaRandomEvents.18.c: "Não, obrigado"
 LibyaRandomEvents.19.t: "Líbia eleita para o Conselho de Segurança da ONU"
 LibyaRandomEvents.19.d: "Fomos eleitos membro não permanente do Conselho de Segurança da ONU pelos próximos dois anos. É uma ótima oportunidade para melhorarmos a segurança do mundo. No entanto, isso tem suas desvantagens. Membros não permanentes costumam receber 60% a mais de ajuda externa, e o crescimento econômico deles tende a ser metade do de não membros. Alguns poderiam chamar isso de uma tentativa dos membros permanentes de influenciar nossas decisões."
 LibyaRandomEvents.19.a: "Acho que um dinheirinho extra é bom"
 LibyaRandomEvents.19.b: "Não abriremos mão de nossa integridade para os grandes países"
 LibyaRandomEvents.20.t: "Base do LIFG invadida"
 LibyaRandomEvents.20.d: "Nosso exército invadiu com sucesso um esconderijo do Grupo Islâmico Combatente Líbio. Cerca de uma dúzia de combatentes foram mortos e nenhum foi feito prisioneiro. Também encontramos um pequeno estoque de armas e outros equipamentos militares que o grupo planejava usar em um ataque contra nosso posto militar."
 LibyaRandomEvents.20.a: "Desfilar com os corpos por Trípoli"
 LibyaRandomEvents.20.b: "Queimar os corpos, ficar com as armas"
 LibyaRandomEvents.21.t: "LIFG ataca posto de controle militar"
 LibyaRandomEvents.21.d: "Um de nossos postos de controle militares foi atacado pelo LIFG. Eles avançaram sobre o posto com alguns veículos improvisados armados, matando a maioria dos guardas. Alguns de nossos soldados conseguiram fugir antes de serem mortos. Satisfeitos com o resultado, os islamistas rapidamente se afastaram em alta velocidade. Os reforços de um quartel próximo não foram rápidos o bastante para alcançá-los."
 LibyaRandomEvents.21.a: "Que covarde foge do inimigo!?"
 LibyaRandomEvents.22.t: "LIFG ataca delegacia de polícia"
 LibyaRandomEvents.22.d: "Uma delegacia em uma grande cidade foi atacada pelo LIFG. Eles arrombaram a porta da frente em plena luz do dia e um tiroteio começou com os policiais, que foram rapidamente dominados. Os combatentes do LIFG conseguiram manter suas posições contra um contra-ataque de nosso exército e, ao mesmo tempo, libertaram membros capturados do LIFG das celas. Por fim, o LIFG se retirou da delegacia sob a cobertura da noite. Embora nosso exército tenha conseguido matar alguns dos islamistas, também sofremos pesadas baixas. Com a libertação dos combatentes do LIFG, o ataque foi um saldo positivo para eles."
 LibyaRandomEvents.22.a: "Em plena luz do dia!?"
 LibyaRandomEvents.23.t: "LIFG ocupa base militar"
 LibyaRandomEvents.23.d: "Uma de nossas bases militares foi temporariamente ocupada pelo LIFG. Eles iniciaram o ataque dirigindo um caminhão carregado de explosivos até o portão principal e detonando-o, causando confusão entre nossos soldados. Pouco depois, combatentes do LIFG começaram a invadir a base por todos os lados. O caos e o pânico fizeram a maioria de nossos soldados abandonar suas posições e entregar a base aos islamistas. Forças especiais foram enviadas de outra base militar e, após algumas horas de cerco, a maioria dos islamistas foi morta, enquanto alguns conseguiram escapar. Mais tarde, o LIFG divulgou um comunicado afirmando que aquilo era só o começo e que, se o governo não lhes entregasse o poder, eles atacariam o próprio [ROOT.GetLeader]."
 LibyaRandomEvents.23.a: "Como podem ocupar uma base militar inteira?!"
 LibyaRandomEvents.24.t: "[ROOT.GetLeader] assassinado"
 LibyaRandomEvents.24.d: "Aconteceu o pior que se podia imaginar. O comboio de carros de [LBA.GetLeader] foi subitamente atacado por vários veículos improvisados armados do LIFG. Com armas leves e pesadas, o carro de [ROOT.GetLeader] foi crivado de balas até receber um impacto direto de RPG. O ataque foi por fim repelido, mas [ROOT.GetLeader] morreu em decorrência dos ferimentos mais tarde, no hospital."
 LibyaRandomEvents.24.a: "Isso é terrível"
 LibyaRandomEvents.25.t: "Combatentes do LIFG retornam do exílio"
 LibyaRandomEvents.25.d: "Com a paz oficial entre o Estado e o LIFG, muitos membros do LIFG que viviam no exílio voltaram à Líbia."
 LibyaRandomEvents.25.a: "Que bom, eu acho?"
 LibyaRandomEvents.26.t: "Aprendendo com os veteranos do Afeganistão"
 LibyaRandomEvents.26.d: "Muitos membros do LIFG lutaram contra a União Soviética ao lado dos mujahedins afegãos. Faria sentido aproveitarmos a experiência deles sempre que possível."
 LibyaRandomEvents.26.a: "O que vocês aprenderam sobre composição do exército?"
 LibyaRandomEvents.26.b: "O que vocês aprenderam sobre táticas?"
 LibyaRandomEvents.27.t: "Recrutas terríveis"
 LibyaRandomEvents.27.d: "Muitos membros do LIFG lutaram contra a União Soviética ao lado dos mujahedins afegãos. No entanto, o estilo de combate e a experiência deles não estão exatamente à altura do que se exige de um exército moderno. Lealdade fanática é boa, mas nem sempre substitui o profissionalismo."
 LibyaRandomEvents.27.a: "Acho que vem o bom junto com o ruim"
 LibyaRandomEvents.28.t: "O debate teológico"
 LibyaRandomEvents.28.d: "Membros do nosso grupo salafista governante tiveram uma discussão acalorada sobre teologia islâmica com membros da Irmandade Muçulmana. Embora tenhamos concordado em trabalhar com a Irmandade, existem grandes diferenças ideológicas. O debate começou a esquentar demais, mas felizmente [ROOT.GetLeader] conseguiu encerrar a discussão antes que chinelos começassem a voar."
 LibyaRandomEvents.28.a: "Obviamente a visão salafista está correta"
 LibyaRandomEvents.28.b: "A Irmandade tem alguns bons argumentos"
 LibyaRandomEvents.28.c: "Basta! Esta cooperação acabou"
 LibyaRandomEvents.29.t: "Grão-Mufti emite fatwa contra as mulheres"
 LibyaRandomEvents.29.d: "O Grão-Mufti emitiu uma fatwa contra o casamento de mulheres líbias com homens estrangeiros. Ele também organizou um protesto com um grupo de mulheres na sede da ONU, emitindo uma segunda fatwa contra o relatório da Comissão sobre o Status da Mulher da ONU, porque este pede que o governo proteja mulheres e meninas contra a violência."
 LibyaRandomEvents.29.a: "Rá, mulheres"
 LibyaRandomEvents.30.t: "Grão-Mufti emite fatwa contra os inimigos do Estado"
 LibyaRandomEvents.30.d: "O Grão-Mufti emitiu uma fatwa contra quaisquer inimigos do nosso partido governante. Ele proibiu a formação de qualquer oposição e declarou que todos os inimigos do Estado devem ser eliminados."
 LibyaRandomEvents.30.a: "Bom saber que ele está do nosso lado"
 LibyaRandomEvents.31.t: "Grão-Mufti protesta contra a Arábia Saudita"
 LibyaRandomEvents.31.d: "O Grão-Mufti decretou um boicote ao Hajj e à Umrah na Arábia Saudita, afirmando que as políticas sauditas estão matando irmãos muçulmanos e crianças."
 LibyaRandomEvents.31.a: "De qualquer forma, não queríamos ser amigos deles"
 LibyaRandomEvents.32.t: "Grão-Mufti dá aval a homens-bomba"
 LibyaRandomEvents.32.d: "Em uma entrevista na TV hoje, o Grão-Mufti declarou que atentados suicidas são plenamente permitidos pela lei islâmica. Isso incomodou alguns de nossos cidadãos, que temem ser obrigados a se martirizar para defender os interesses do Estado."
 LibyaRandomEvents.32.a: "Não vamos obrigar ninguém a se explodir"
 LibyaRandomEvents.33.t: "Jihadistas voluntários"
 LibyaRandomEvents.33.d: "Nossa decisão de declarar Jihad contra o Magrebe está funcionando a nosso favor. Dezenas de voluntários estão afluindo para se juntar ao nosso exército e nos ajudar em nossa Guerra Santa."
 LibyaRandomEvents.33.a: "Damos boas-vindas a estes irmãos!"
 LibyaRandomEvents.34.t: "Pessoas fogem de [ROOT.GetNameDef]"
 LibyaRandomEvents.34.d: "Nossa decisão de declarar Jihad contra o Magrebe assustou parte da população que vive dentro de nossas fronteiras. Preocupadas com o que a Guerra Santa trará, as pessoas estão fugindo, principalmente para a Europa, para evitar o conflito."
 LibyaRandomEvents.34.a: "Eles não merecem o paraíso"
 LibyaRandomEvents.35.t: "Professores protestam contra educação tendenciosa"
 LibyaRandomEvents.35.d: "Um sindicato de professores organizou um protesto contra a recente adoção, pelo governo, de um currículo que incentiva os valores do Estado. Os professores dizem que isso prejudica a capacidade da Líbia de competir em um mundo globalizado e a capacidade dos jovens estudantes de compreender o mundo. Alguns professores até se recusaram a ensinar o novo currículo e continuam com o antigo."
 LibyaRandomEvents.35.a: "Veremos o que eles ensinarão depois de demitidos"
 LibyaRandomEvents.35.b: "Deixe-os protestar"
 LibyaRandomEvents.35.c: "Prometer-lhes um pouco mais de liberdade na educação"
 LibyaRandomEvents.36.t: "Mulheres protestam contra o governo"
 LibyaRandomEvents.36.d: "Uma organização de mulheres organizou um protesto contra o governo. Elas afirmam que as políticas do governo vão contra aquilo que as mulheres da Líbia defendem. O apoio ao protesto é limitado, mas mostra que nem todas as mulheres do país concordam com nossas políticas, e que elas não têm medo de demonstrá-lo."
 LibyaRandomEvents.36.a: "Simplesmente ignorá-las"
 LibyaRandomEvents.37.t: "Mulheres apoiam o governo"
 LibyaRandomEvents.37.d: "Uma organização de mulheres promoveu um comício em apoio ao governo. Elas afirmaram que as recentes mudanças nas políticas voltadas às mulheres não só melhorarão a condição das mulheres na Líbia, como mostrarão ao mundo inteiro como as mulheres devem ser tratadas."
 LibyaRandomEvents.37.a: "Que mulheres corajosas"
 LibyaRandomEvents.38.t: "Apoio baathista do exterior"
 LibyaRandomEvents.38.d: "Nossas políticas baathistas estão sendo recebidas de braços abertos no exterior. Um grupo de políticos baathistas de um país estrangeiro recebeu baathistas líbios em uma reunião política. Esse tipo de articulação é vital para que o baathismo volte a ascender."
 LibyaRandomEvents.38.a: "Isso é ótimo!"
 LibyaRandomEvents.38.b: "Será que lembraram de fazer networking no LinkedIn também?"
 LibyaRandomEvents.39.t: "Protestos contra o baathismo"
 LibyaRandomEvents.39.d: "Um protesto foi organizado perto de uma de nossas embaixadas em um país estrangeiro. Os manifestantes entoavam slogans antibaathistas, alegando que nosso recente apoio ao baathismo é apenas uma tentativa de dominar outros países. Esses protestos estão prejudicando nossos esforços para unificar todos os árabes."
 LibyaRandomEvents.39.a: "Maldição"
 LibyaRandomEvents.39.b: "Tentar limitar os danos"
 LibyaRandomEvents.40.t: "O Livro Verde - Clube do Livro"
 LibyaRandomEvents.40.d: "O novo Livro Verde, escrito por Kadafi, está ganhando popularidade. Desde o lançamento, tornou-se o mais vendido. É comum encontrá-lo nas mochilas de estudantes e ele até se popularizou fora da Líbia."
 LibyaRandomEvents.40.a: "É bom que as pessoas estejam lendo"
 LibyaRandomEvents.41.t: "O Clube do Alcorão"
 LibyaRandomEvents.41.d: "O lançamento do novo Livro Verde não ocorreu sem resistência. Em várias cidades, imãs criaram clubes do livro onde as pessoas podem ler e recitar o Alcorão. Parece que as pessoas querem ler algo mais tradicional em vez de diretrizes do Estado."
 LibyaRandomEvents.41.a: "O Livro Verde é melhor que o Alcorão"
 LibyaRandomEvents.42.t: "O Livro Verde - Clube do Livro"
 LibyaRandomEvents.42.d: "Apesar de nossas tentativas de nos livrar do Livro Verde de Kadafi, o livro continua chegando às mãos do povo. Na noite passada, a polícia desmantelou um clube do livro secreto voltado para fãs da obra. Será mais difícil do que o planejado fazer as pessoas lerem o Alcorão em vez do Livro Verde."
 LibyaRandomEvents.42.a: "Será que podemos simplesmente nos livrar desse livro idiota"
 LibyaRandomEvents.43.t: "O Clube do Alcorão"
 LibyaRandomEvents.43.d: "Depois que proibimos o Livro Verde, vários imãs criaram clubes de leitura onde jovens podem se reunir para ler o Alcorão juntos. Isso despertou maior interesse por questões religiosas, e as pessoas estão sendo educadas no Islã mesmo sem nossa intervenção."
 LibyaRandomEvents.43.a: "Os líbios são filhos de Deus, afinal"
 LibyaRandomEvents.44.t: "Dissidente descoberto"
 LibyaRandomEvents.44.d: "Um informante do Comitê Revolucionário Popular avisou a polícia sobre um possível dissidente dentro do Congresso Geral do Povo. O membro pretendia apresentar ideias de democracia e liberdade de expressão. Felizmente, essa pessoa foi detida antes que pudesse compartilhar suas ideias."
 LibyaRandomEvents.44.a: "O Estado está seguro mais uma vez"
 LibyaRandomEvents.44.b: "E podemos agradecer ao Comitê Revolucionário por isso"
 LibyaRandomEvents.45.t: "Membro do CGP discute reformas"
 LibyaRandomEvents.45.d: "Em uma reunião de um Congresso Geral do Povo hoje, um membro mencionou a possibilidade de aumentar a participação e a opinião dos cidadãos no processo político. Não se sabe como esse dissidente conseguiu esconder suas opiniões do Comitê Revolucionário Popular, mas ideias como essas são perigosas se forem disseminadas."
 LibyaRandomEvents.45.a: "Como o silenciamos?"
 LibyaRandomEvents.45.b: "Dar um jeito nos responsáveis do Comitê Revolucionário"
 LibyaRandomEvents.46.t: "Revolucionário descoberto"
 LibyaRandomEvents.46.d: "Hoje o Congresso Geral do Povo expôs um revolucionário exaltado do Comitê Revolucionário Popular. O membro vociferava que o CGP torna o Estado vulnerável a influências externas e que é preciso uma mão mais forte para governar o país. Felizmente, conseguimos silenciá-lo e tirá-lo de cena antes que algum dano fosse causado."
 LibyaRandomEvents.46.a: "A liberdade foi garantida"
 LibyaRandomEvents.46.b: "E podemos agradecer ao Congresso Geral do Povo por isso"
 LibyaRandomEvents.47.t: "Um revolucionário inflamado"
 LibyaRandomEvents.47.d: "Um membro do Comitê Revolucionário Popular vem percorrendo várias convenções pelo país afirmando que o Congresso Geral do Povo nada mais é que um fantoche de poderes ocultos. Pregando o retorno de um aparato de segurança que proteja o Estado e seu povo, o revolucionário inflamado tem sido bem recebido por muitas plateias."
 LibyaRandomEvents.47.a: "Como o silenciamos?"
 LibyaRandomEvents.47.b: "Dar um jeito nos responsáveis do Congresso Geral do Povo"
 LibyaRandomEvents.48.t: "Alto burocrata preso ao passado"
 LibyaRandomEvents.48.d: "Embora tenhamos reformado nossa forma de governo, muitos funcionários, políticos e burocratas ainda são pessoas que trabalharam sob o regime de Kadafi. Um deles tem reclamado ultimamente que o novo regime é pouco flexível, complicado e menos eficiente que o antigo, e já não está muito motivado a trabalhar com eficiência. Expulsá-lo resolveria o problema, mas é difícil encontrar pessoas experientes como ele. Alternativamente, poderíamos simplesmente 'promovê-lo' a uma função mais confortável, com melhores benefícios."
 LibyaRandomEvents.48.a: "Expulsem-no, encontraremos um substituto"
 LibyaRandomEvents.48.b: "Que tal um aumento e um auxílio-carro?"
 LibyaRandomEvents.49.t: "Velho político elogia o governo"
 LibyaRandomEvents.49.d: "Embora tenhamos reformado nossa forma de governo, muitos funcionários, políticos e burocratas ainda são pessoas que trabalharam sob o regime de Kadafi. Um dos políticos mais experientes declarou recentemente em uma coletiva de imprensa que está feliz em ver mudanças na Líbia. Disse que fará o máximo para corrigir todos os erros e o péssimo legado do antigo regime."
 LibyaRandomEvents.49.a: "Um verdadeiro exemplo de político patriota"
 LibyaRandomEvents.49.b: "Será que ele tem velhos segredos para contar?"
 LibyaRandomEvents.50.t: "Gastança da realeza"
 LibyaRandomEvents.50.d: "O Estado concede à realeza líbia um pequeno 'salário' que lhe permite administrar suas propriedades e sustentar a família. Parece que um membro da família real saiu gastando horrores no fim de semana passado, torrando dinheiro em festas, barcos, carros e imóveis, além de prejudicar vários empreendimentos do Estado."
 LibyaRandomEvents.50.a: "Talvez essa história de monarquia não tenha sido uma boa ideia"
 LibyaRandomEvents.51.t: "Investimentos reais"
 LibyaRandomEvents.51.d: "O Estado concede à realeza líbia um pequeno 'salário' que lhe permite administrar suas propriedades e sustentar a família. Parece que um membro da família real usou parte desse dinheiro para investir em um país estrangeiro. Isso melhorou muito nossa reputação nesse país."
 LibyaRandomEvents.51.a: "Um membro da realeza responsável com o dinheiro?"
 LibyaRandomEvents.52.t: "Dinheiro confiscado desaparece"
 LibyaRandomEvents.52.d: "Temos desviado constantemente fundos da antiga família real para os cofres do Estado. No entanto, recentemente notamos uma anormalidade nos livros contábeis e parece que uma quantia muito grande de dinheiro confiscado foi parar no bolso de algum funcionário."
 LibyaRandomEvents.52.a: "Não dá mais para confiar em ninguém?"
 LibyaRandomEvents.53.t: "Dinheiro extra encontrado"
 LibyaRandomEvents.53.d: "Temos desviado constantemente fundos da antiga família real para os cofres do Estado. Recentemente encontramos um esconderijo de objetos de valor, obras de arte de alto valor e títulos que acrescentarão mais dinheiro aos cofres do que o projetado."
 LibyaRandomEvents.53.a: "Mostre-me o dinheiro!"
 LibyaRandomEvents.54.t: "Forças especiais estrangeiras matam jihadista"
 LibyaRandomEvents.54.d: "Na noite passada houve um incidente armado em uma pequena aldeia no deserto líbio. A aldeia era um esconderijo, conhecido pelo governo, de um terrorista estrangeiro que se escondia temporariamente em nosso país. Soldados armados invadiram o esconderijo, matando o terrorista e seus guardas. Pelo equipamento e pelas táticas usadas, é claro que o ataque foi conduzido por alguma unidade de forças especiais. Não fazemos ideia de que país esses atacantes vieram, como entraram no país ou como escaparam. Nenhum país assumiu a responsabilidade pelo ataque até agora. Trata-se de uma clara violação de nossa soberania, e nada pudemos fazer. É apenas questão de tempo até que essa notícia se torne pública e chegue ao mundo."
 LibyaRandomEvents.54.a: "Como isso é possível? Eram fantasmas?"
 LibyaRandomEvents.55.t: "Forças especiais estrangeiras repelidas"
 LibyaRandomEvents.55.d: "Na noite passada houve um incidente armado em uma pequena aldeia no deserto líbio. A aldeia era um esconderijo, conhecido pelo governo, de um terrorista estrangeiro que se escondia temporariamente em nosso país. Soldados armados invadiram o esconderijo com a intenção de matar os terroristas. No entanto, as forças de segurança locais conseguiram manter suas posições contra os atacantes, apesar de sofrerem pesadas baixas. Os atacantes desapareceram sem deixar rastros nem baixas. Pelo equipamento e pelas táticas usadas, é claro que o ataque foi conduzido por alguma unidade de forças especiais. Não fazemos ideia de que país esses atacantes vieram, como entraram no país ou como escaparam. Nenhum país assumiu a responsabilidade pelo ataque até agora. Trata-se de uma clara violação de nossa soberania, mas ao menos resistimos, o que esperamos que evite novos ataques. É apenas questão de tempo até que essa notícia se torne pública e chegue ao mundo."
 LibyaRandomEvents.55.a: "Pelo menos os repelimos"
 LibyaRandomEvents.56.t: "Laços econômicos impulsionam o crescimento"
 LibyaRandomEvents.56.d: "Nossa decisão de aproximar nossa economia da Europa parece estar dando frutos. O aumento dos investimentos e do crescimento na Europa parece estar nos puxando para cima também. É um bom dia para a economia."
 LibyaRandomEvents.56.a: "Dinheiro!"
 LibyaRandomEvents.57.t: "Laços econômicos reduzem o crescimento"
 LibyaRandomEvents.57.d: "Nossa decisão de aproximar nossa economia da Europa parece não ter sido uma boa ideia. Com a desaceleração das economias ocidentais, nossa economia parece sofrer os efeitos em cadeia."
 LibyaRandomEvents.57.a: "Maldição"
 LibyaRandomEvents.58.t: "Mercenários acusados de crimes de guerra"
 LibyaRandomEvents.58.d: "Um dos grupos de mercenários que enviamos ao exterior foi acusado de crimes de guerra. Moradores locais relatam que eles entraram em uma aldeia, saquearam seus bens de valor e executaram e estupraram várias pessoas. A história foi rapidamente divulgada pela mídia global e agora estamos sob pressão."
 LibyaRandomEvents.58.a: "Que mercenários?"
 LibyaRandomEvents.59.t: "Mercenários trazem experiência"
 LibyaRandomEvents.59.d: "Um dos grupos de mercenários que enviamos ao exterior voltou de suas incursões. Foi imediatamente aconselhado a realizar um workshop com nossos oficiais militares para repassar toda a experiência adquirida."
 LibyaRandomEvents.59.a: "Que mercenários?"
 LibyaRandomEvents.60.t: "O Exército quer seu equipamento"
 LibyaRandomEvents.60.d: "Na Líbia há dois exércitos: o Corpo da Guarda Revolucionária e as forças armadas regulares. O Corpo da Guarda controla a maioria dos depósitos de suprimentos do país. Recentemente, vários oficiais de alta patente do exército reclamaram que é impossível operar o exército quando quase tudo precisa ser requisitado ao Corpo da Guarda. Eles exigem que mais suprimentos lhes sejam destinados."
 LibyaRandomEvents.60.a: "Entreguem-lhes suas armas"
 LibyaRandomEvents.60.b: "Essas armas estão trancadas por um motivo"
 LibyaRandomEvents.61.t: "O CGR quer mais recrutas"
 LibyaRandomEvents.61.d: "Na Líbia há dois exércitos: o Corpo da Guarda Revolucionária e as forças armadas regulares. O equilíbrio de poder foi recentemente deslocado em favor das forças armadas regulares. O Corpo da Guarda Revolucionária tem reclamado que, desde que sua importância foi reduzida, faltam recrutas, pois a maioria é destinada ao exército. Eles estão tendo dificuldade em funcionar apenas tentando manter disponível a mão de obra que já possuem."
 LibyaRandomEvents.61.a: "Destinar alguns recrutas a eles"
 LibyaRandomEvents.61.b: "Parece falta de habilidade deles"
 LibyaRandomEvents.62.t: "Funcionário do governo vende campo de petróleo"
 LibyaRandomEvents.62.d: "Um documento curioso chegou à mesa de [LBA.GetLeader]. Ele mostra que um funcionário do governo vendeu um dos campos de petróleo do Estado a uma operadora internacional sem qualquer aprovação do governo ou da Companhia Nacional de Petróleo. Parece que o dinheiro da venda foi, em sua maior parte, para o bolso desse funcionário."
 LibyaRandomEvents.62.a: "Anular a venda!"
 LibyaRandomEvents.62.b: "Não há nada que possamos fazer"
 LibyaRandomEvents.63.t: "CNP elimina a concorrência"
 LibyaRandomEvents.63.d: "Um documento curioso chegou à mesa de [LBA.GetLeader]. A Companhia Nacional de Petróleo usou algumas manobras políticas para expulsar uma empresa estrangeira de um dos campos de petróleo da Líbia. Parece que alguém na CNP está tentando usar a posição do Estado para arrecadar mais dinheiro para a empresa e para si mesmo."
 LibyaRandomEvents.63.a: "Anular a venda!"
 LibyaRandomEvents.63.b: "Não há nada que possamos fazer"
 LibyaRandomEvents.64.t: "Escassez de alimentos"
 LibyaRandomEvents.64.d: "Devido ao nosso clima adverso, precisamos importar a maior parte de nossos alimentos. Isso nos torna muito dependentes de países estrangeiros, e interrupções sem uma linha de suprimento estável são comuns. Recentemente, houve alguns problemas no transporte de grãos para o país. Com portos congestionados, incapazes de suportar a demanda, e dificuldade em transportar grãos pelo país, surgiram escassezes. Isso afeta especialmente as áreas rurais, enquanto as grandes cidades de Trípoli e Benghazi são menos atingidas. O que devemos fazer?"
 LibyaRandomEvents.64.a: "Tentar conseguir rapidamente uma fonte de alimentos"
 LibyaRandomEvents.64.b: "Que comam brioches!"
 LibyaRandomEvents.65.t: "Turnê de estação em estação"
 LibyaRandomEvents.65.d: "Agora que temos uma ferrovia no país, talvez faça sentido aproveitá-la ao máximo e viajar pelo país em uma turnê política. Poderíamos promover ao mesmo tempo o establishment político e a nova ferrovia."
 LibyaRandomEvents.65.a: "Tchu-tchu-tchu-tchu, piiii!"
 LibyaRandomEvents.65.b: "Parece um tanto vitoriano demais para mim"
 LibyaRandomEvents.66.t: "Trem descarrilado"
 LibyaRandomEvents.66.d: "Parece que a adoção do trem não ocorreu sem percalços. Um trem descarrilou. Dezenas de passageiros ficaram feridos e vários morreram. As pessoas estão chamando nossos novos trens de armadilhas mortais e alegando que nosso novo projeto ferroviário é apenas um projeto de vaidade de [LBA.GetLeader]."
 LibyaRandomEvents.66.a: "Prometer melhorar a segurança ferroviária"
 LibyaRandomEvents.66.b: "Essas coisas acontecem!"
 LibyaRandomEvents.67.t: "Rebelião Tubu"
 LibyaRandomEvents.67.d: "Devido à nossa frágil situação política interna, o povo Tubu que vive no sul da Líbia pegou em armas em rebelião. Sentindo-se marginalizados pelo governo há anos, eles finalmente chegaram ao limite. Numericamente, estão desesperadamente em desvantagem, mesmo com os poucos desertores que já deixaram nossas forças para se juntar a eles. Não deve ser um grande esforço esmagar essa revolta, embora ela nos distraia de nosso principal oponente."
 LibyaRandomEvents.67.a: "É traição, então"
 LibyaRandomEvents.67.b: "Deixe-os em paz"
 LibyaRandomEvents.68.t: "Rebelião Tuaregue"
 LibyaRandomEvents.68.d: "Devido à nossa frágil situação política interna, o povo Tuaregue que vive no sudoeste da Líbia pegou em armas em rebelião. Sentindo-se marginalizados pelo governo há anos, eles finalmente chegaram ao limite. Nossas forças militares com lealdade tuaregue já passaram para o lado dos Tuaregues, e centenas de tribais tuaregues estão cruzando a fronteira vindos do Níger e da Argélia para se juntar à luta. Essa pequena rebelião pode se tornar algo maior se não for contida."
 LibyaRandomEvents.68.a: "É traição, então"
 LibyaRandomEvents.68.b: "Deixe-os em paz"
 LibyaTribes.1.t: "Estrela em ascensão no Exército"
 LibyaTribes.1.d: "Um oficial [tribal_offender] em nosso exército está mostrando grande potencial. Ele subiu rapidamente na hierarquia, embora agora pareça ter esbarrado em um muro quanto a novas promoções. Parece que o alto escalão militar tem interesse pessoal em impedir que esse [tribal_offender] ganhe mais poder. Poderíamos intervir e forçar os militares a dar-lhe outra promoção. Essa medida também nos traria algum apoio das tribos [tribal_offender]. Alternativamente, poderíamos simplesmente aceitar em silêncio o tratamento que os militares dão a esse jovem oficial."
 LibyaTribes.1.a: "Ele merece uma promoção"
 LibyaTribes.1.b: "Não cabe a nós intervir"
 LibyaTribes.2.t: "Estrela em ascensão na Marinha"
 LibyaTribes.2.d: "Um oficial [tribal_offender] em nossa marinha está se mostrando muito promissor. Eles subiram rapidamente na hierarquia, embora agora pareçam ter atingido um obstáculo em relação a novas promoções. Parece que o alto escalão militar tem um interesse pessoal em impedir que este [tribal_offender] obtenha mais poder. Poderíamos intervir e forçar os militares a conceder-lhes outra promoção. Essa mudança também nos reuniria algum apoio das tribos [tribal_offender]. Alternativamente, poderíamos simplesmente aceitar silenciosamente o tratamento dispensado pelos militares a este jovem oficial."
 LibyaTribes.2.a: "Eles merecem uma promoção"
 LibyaTribes.2.b: "Não é nossa função intervir"
 LibyaTribes.3.t: "Estrela em ascensão na Força Aérea"
 LibyaTribes.3.d: "Um oficial [tribal_offender] da nossa Força Aérea está se mostrando muito promissor. Eles subiram rapidamente na hierarquia, embora agora pareçam ter atingido um obstáculo em relação a novas promoções. Parece que o alto escalão militar tem um interesse pessoal em impedir que este [tribal_offender] obtenha mais poder. Poderíamos intervir e forçar os militares a conceder-lhes outra promoção. Essa mudança também nos reuniria algum apoio das tribos [tribal_offender]. Alternativamente, poderíamos simplesmente aceitar silenciosamente o tratamento dispensado pelos militares a este jovem oficial."
 LibyaTribes.3.a: "Eles merecem uma promoção"
 LibyaTribes.3.b: "Não é nossa função intervir"
 LibyaTribes.4.t: "Estudante Universitário Lança Tese"
 LibyaTribes.4.d: "Um estudante [tribal_offender] de uma universidade da Líbia lançou uma nova tese sobre uma nova tecnologia. Esta tese poderá ajudar o nosso setor industrial a avançar. No entanto, também revela algumas críticas ao governo no poder e à forma como as outras tribos estão a atrasar a Líbia. Devemos suprimir esta tese ou deixá-la assim?"
 LibyaTribes.4.a: "Esta tese é uma boa notícia"
 LibyaTribes.4.b: "Suprimir a publicação"
 LibyaTribes.5.t: "Economista oferece solução"
 LibyaTribes.5.d: "Um economista de uma tribo [tribal_offender] declarou recentemente em uma publicação que a produtividade econômica da Líbia poderia ser melhorada com o corte de alguns impostos. Por coincidência, esses benefícios fiscais afetariam principalmente setores econômicos importantes para as tribos [tribal_offender]. Há verdade no que o economista diz, mas adotar os benefícios fiscais faria claramente parecer que favorecemos as tribos [tribal_offender] em detrimento das outras."
 LibyaTribes.5.a: "A economia nacional vem em primeiro lugar"
 LibyaTribes.5.b: "Vamos tentar manter as outras tribos satisfeitas"
 LibyaTribes.6.t: "Político local sugere reforma"
 LibyaTribes.6.d: "'Quando eu era um menino e crescia em uma vila [tribal_offender], as coisas corriam bem. Os nossos mais velhos sabiam como gerir uma comunidade, algo que o nosso governo tem dificuldade em fazer', afirmou recentemente um político [tribal_offender] a nível local numa entrevista televisiva quando lhe perguntaram como iria melhorar a nação líbia. Em sua entrevista, ele destacou alguns pontos positivos sobre como modernizar a nação. Adaptar essas mudanças seria benéfico, mas causaria uma ligeira perda de prestígio."
 LibyaTribes.6.a: "gostei das ideias dele"
 LibyaTribes.6.b: "Ele deveria manter seu nível"
 LibyaTribes.7.t: "Anciãos tribais suspeitos de traição"
 LibyaTribes.7.d: "Um informante do Comitê Revolucionário, de uma tribo [tribal_offender], compartilhou informações de que dois anciãos tribais têm discutido ideias antirrevolucionárias entre si. Aparentemente, eles também estiveram em contato com potências hostis, repassando informações sensíveis. Não podemos confirmar todos os detalhes, mas, se forem verdadeiras, essas alegações são graves. Claro, também pode ser que esse informante esteja apenas tentando fortalecer a posição de sua própria tribo."
 LibyaTribes.7.a: "Livrem-se desses dois anciãos"
 LibyaTribes.7.b: "O informante está claramente mentindo"
 LibyaTribes.8.t: "Uma grande doação"
 LibyaTribes.8.d: "Um grupo de empresários [tribal_offender] procurou o governo. Em troca de o governo considerar algumas leis favoráveis aos negócios, eles estão dispostos a doar uma grande quantia de dinheiro para ajudar o governo a tocar seus assuntos diários. Observando as sugestões deles sobre como tornar a Líbia mais 'favorável aos negócios', muitos itens da lista incluem projetos que claramente só beneficiariam os [tribal_offender]s."
 LibyaTribes.8.a: "Isso parece um bom negócio"
 LibyaTribes.8.b: "Isso é corrupção!"
 LibyaTribes.9.t: "Petrolífera ocupa terra tribal"
 LibyaTribes.9.d: "Um grupo de anciãos [tribal_offender] procurou o governo com um dilema. Um campo de petróleo operado por uma empresa estrangeira funciona em terras pertencentes à tribo deles. Conseguimos encontrar qualquer documentação sobre a propriedade original da terra, ou se a terra foi legalmente transferida para a petrolífera. No entanto, provavelmente poderíamos usar isso como desculpa para colocar os campos de petróleo de volta sob controle do governo, se quiséssemos, embora grande parte dos lucros do petróleo fosse então para os [tribal_offender]s."
 LibyaTribes.9.a: "Retomar o campo"
 LibyaTribes.9.b: "A empresa é a dona legal deste campo"
 LibyaTribes.10.t: "Um pregador inflamado"
 LibyaTribes.10.d: "Um imã de uma mesquita [tribal_offender] afirmou a superioridade das tradições [tribal_offender] em uma khutbah recente, declarando que 'De todos os povos da Líbia, os [tribal_offender]s são os mais leais a Alá'. Seu discurso irritou algumas pessoas em outras partes da Líbia e aumentou as tensões entre as diferentes tribos."
 LibyaTribes.10.a: "Ele está certo"
 LibyaTribes.10.b: "Este pregador não pregará por muito tempo"
 LibyaTribes.11.t: "Abuso nas Forças Armadas"
 LibyaTribes.11.d: "Houve um certo escândalo nas Forças Armadas recentemente: um vídeo de um oficial [tribal_offender] abusando de um grupo de recrutas [tribal_defender] circula na internet. O vídeo mostra os recrutas sendo obrigados a correr em uma pista por horas com equipamento completo, espancados com paus e mantidos debaixo d'água por longos períodos. Questionado sobre o incidente, o oficial [tribal_offender] declarou que 'esses gawad não sabem se comportar como soldados. Guerreiros [tribal_offender] antigos com paus e pedras formariam um exército moderno mais eficaz do que esses cães'. Vários anciãos [tribal_defender] pediram que esse oficial seja expulso das Forças Armadas por manchar o nome das forças armadas da Líbia."
 LibyaTribes.11.a: "Os recrutas estão reclamando à toa"
 LibyaTribes.11.b: "O oficial claramente passou dos limites"
 LibyaTribes.12.t: "Muito barulho por causa de ovelhas"
 LibyaTribes.12.d: "Muitas tribos líbias ainda praticam a pastoreio, levando suas cabras, ovelhas e gado de um pedaço de terra a outro. Um conflito surgiu recentemente entre duas tribos quando pastores [tribal_offender] cruzaram para o território [tribal_defender]. A tribo [tribal_defender] exige que a tribo [tribal_offender] pague indenização pelos danos, que aparentemente consistem, em sua maior parte, em toda a grama que foi comida."
 LibyaTribes.12.a: "É só grama?"
 LibyaTribes.12.b: "Os territórios tribais são sagrados e devem ser respeitados"
 LibyaTribes.13.t: "Ataque tribal"
 LibyaTribes.13.d: "Na noite passada, membros de uma tribo [tribal_offender] atacaram uma fazenda [tribal_defender], alegando que a fazenda foi construída em suas terras. Eles atearam fogo na fazenda durante a noite e voltaram de manhã cedo para expulsar os moradores. Os anciãos da tribo [tribal_defender] imploram que o governo intervenha e puna os invasores [tribal_offender]."
 LibyaTribes.13.a: "Claramente era terra [tribal_offender]"
 LibyaTribes.13.b: "Ataques? Vivemos em uma sociedade"
 LibyaTribes.14.t: "Disputa pela água"
 LibyaTribes.14.d: "O Grande Rio Artificial fornece água gratuita a muitos líbios. No entanto, uma tribo [tribal_defender] alega que membros de uma tribo [tribal_offender] estão impedindo os [tribal_defender]s de acessar uma das fontes de água em uma de nossas maiores cidades."
 LibyaTribes.14.a: "Os [tribal_defender]s têm direito de acessar essa água"
 LibyaTribes.14.b: "Os [tribal_defender]s deveriam beber em suas próprias terras"
 LibyaTribes.15.t: "Político não representativo"
 LibyaTribes.15.d: "Um certo escândalo ocorreu no governo local de uma de nossas pequenas cidades. Um político [tribal_offender] foi eleito para liderar a cidade, apesar de a cidade ser majoritariamente [tribal_defender]. Isso fez a população acusar o governo de fraudar a eleição para favorecer a agenda [tribal_offender], e exigir que um político [tribal_defender] seja eleito em seu lugar. Não nos lembramos de ter fraudado nenhuma eleição recentemente, mas talvez tenha sido a seção local?"
 LibyaTribes.15.a: "As eleições foram justas"
 LibyaTribes.15.b: "Ceder às exigências dos moradores"
 LibyaTribes.16.t: "Distribuição do dinheiro do petróleo"
 LibyaTribes.16.d: "Duas tribos estão brigando pela forma como o governo distribui o dinheiro do petróleo. Membros de uma tribo [tribal_offender] alegam que o governo gasta dinheiro demais melhorando a vida dos [tribal_defender]s. Da mesma forma, membros de uma tribo [tribal_defender] alegam exatamente o contrário."
 LibyaTribes.16.a: "Dar mais dinheiro aos [tribal_offender]s"
 LibyaTribes.16.b: "Os [tribal_defender]s merecem dinheiro extra"
 LibyaFamily.1.t: "Baixa na família"
 LibyaFamily.1.d: "Enquanto engenheiros militares removiam os danos do recente ataque aéreo britânico, descobriram algo chocante. O corpo gravemente queimado e mutilado de um dos filhos de Muammar Kadafi foi encontrado entre os escombros. Parece que ele inspecionava o local sem que ninguém soubesse e foi pego no ataque."
 LibyaFamily.1.a: "Como isso pôde acontecer!?"
 LibyaFamily.2.t: "Apagão da internet"
 LibyaFamily.2.d: "No último fim de semana, um blog na internet criticou o regime de Kadafi, especificamente Muhammad Muammar Kadafi. Em resposta, em seu papel de chefe da GPTC, Muhammad Kadafi desligou toda a internet do país por quase uma semana. Embora estivesse apenas tentando proteger o regime, as ações de Muhammad irritaram muitos líbios. Talvez alguém tão rápido em se irritar não devesse chefiar a GPTC, afinal?"
 LibyaFamily.2.a: "Ninguém precisa de internet"
 LibyaFamily.2.b: "Talvez precisemos de um substituto mais competente"
 LibyaFamily.3.t: "Briga pela Coca"
 LibyaFamily.3.d: "Um conselheiro traz notícias perturbadoras: há uma situação tensa envolvendo Coca, e não do tipo que você está pensando. Recentemente, a Coca-Cola abriu uma fábrica de engarrafamento na Líbia. Muhammad e Mutassim Kadafi reivindicaram a propriedade da fábrica por meio de seus laços comerciais, e esse conflito agora saiu do controle. Tanto Muhammad quanto Mutassim estão na fábrica com seus guardas pessoais, armados até os dentes. Não há sinais de que nenhum dos lados vá se acalmar."
 LibyaFamily.3.a: "Intervir em favor de Muhammad"
 LibyaFamily.3.b: "Intervir em favor de Mutassim"
 LibyaFamily.3.c: "Pode ser Pepsi?"
 LibyaFamily.4.t: "Muhammad Kadafi critica o pai"
 LibyaFamily.4.d: "Muhammad Muammar Kadafi vive no exílio há bastante tempo. Parece que o exílio pesa sobre ele, pois recentemente mencionou em uma entrevista como está decepcionado com o pai. Afirmou que o pai trata seu povo exatamente como tratou Muammar: com negligência e exigências irracionais. Embora Muhammad tenha pouquíssima influência na Líbia atualmente, alguns líbios ainda expressaram simpatia por ele."
 LibyaFamily.4.a: "Eu achava que ele não ligava para política?!"
 LibyaFamily.5.t: "Muhammad reacende sua paixão pela política"
 LibyaFamily.5.d: "Após uma breve conversa com o pai, parece que Muhammad compreendeu seu lugar na família. Embora inicialmente relutante em dar continuidade ao legado da família, ele passou a aceitar que um dia será o líder da Líbia. A sucessão de Kadafi está agora um pouco mais segura."
 LibyaFamily.5.a: "Boa conversa, filho"
 LibyaFamily.6.t: "Muhammad ignora o pai"
 LibyaFamily.6.d: "Parece que Muhammad não está disposto a ouvir o pai. Ele não quer seguir os passos do pai na liderança do país, nem quer ser como ele. Depois de muitos gritos e muitas portas batidas, parece não haver como chegar até Muhammad. Por ora, Muammar precisa se contentar com o fato de que o filho se interessa ao menos por alguns aspectos da administração do país, ainda que não como líder."
 LibyaFamily.6.a: "Como posso conversar com ele?"
 LibyaFamily.7.t: "Muhammad deixa a Líbia"
 LibyaFamily.7.d: "Após uma discussão acalorada sobre suas responsabilidades de um dia governar o país, Muhammad parece ter se cansado do pai. Dizendo que não sente mais a Líbia como seu lar, decidiu deixar o país, ao menos por um tempo. Subindo em seu jato particular, traçou rota para a Argélia sem que ninguém soubesse quando ele estaria disposto a voltar."
 LibyaFamily.7.a: "Volte logo para casa"
 LibyaFamily.8.t: "Uma exposição fenomenal"
 LibyaFamily.8.d: "A exposição de arte de Saif foi um sucesso. Realizada no Museu de Belas-Artes de Montreal, no Canadá, a mostra atraiu a atenção de várias corporações internacionais e de cidadãos canadenses. Aliás, durante a exposição, Saif conseguiu organizar várias reuniões de negócios com representantes de empresas como Siemens, Petro-Canada e SNC-Lavalin. Eles tiveram a chance de discutir várias oportunidades de investimento na Líbia. Embora seja um sucesso pessoal para Saif, pode ser um sucesso ainda maior para a Líbia como um todo. Temos a oportunidade de aprofundar nossa cooperação com uma dessas grandes corporações."
 LibyaFamily.8.a: "A Siemens é conhecida por seus eletrônicos!"
 LibyaFamily.8.b: "Como nação petrolífera, a Petro-Canada é a parceira natural"
 LibyaFamily.8.c: "Para desenvolver a Líbia, uma construtora como a SNC-Lavalin é a melhor"
 LibyaFamily.9.t: "Uma exposição razoável"
 LibyaFamily.9.d: "A exposição de arte de Saif foi realizada no Museu de Belas-Artes de Montreal. Embora tenha conseguido despertar algum interesse, não atraiu a atenção que almejávamos. Muitas corporações retiraram o patrocínio após a reação negativa do público. No entanto, a exposição conseguiu atrair a atenção do público internacional. No mínimo, conseguiu chamar a atenção do mundo para a cultura líbia e para a Líbia em geral."
 LibyaFamily.9.a: "Nós também sabemos fazer arte"
 LibyaFamily.10.t: "Um desastre artístico"
 LibyaFamily.10.d: "A exposição de arte realizada no Museu de Belas-Artes de Montreal foi um desastre total. Muitas corporações retiraram o patrocínio após a reação negativa do público, e os críticos descreveram a obra de Saif como 'sensacionalista' e 'um triunfo da banalidade'. Por fim, a exposição foi desmontada antes do prazo, já que o museu sofreu críticas por apoiar a obra de um artista tão ligado ao regime político da Líbia. Foi uma humilhação total para nós."
 LibyaFamily.10.a: "Sensacionalista? Eles não sabem que arte é subjetiva?"
 LibyaFamily.11.t: "Saif aceita a posição de herdeiro"
 LibyaFamily.11.d: "Embora inicialmente hesitante em passar por cima do direito de primogenitura do irmão mais velho, Saif acabou aceitando a sugestão do pai de ser oficialmente feito seu sucessor. Como preparação para esse papel, Saif recebeu mais poder dentro do regime."
 LibyaFamily.11.a: "Tenho orgulho de você, filho"
 LibyaFamily.12.t: "Saif rejeita a posição de herdeiro"
 LibyaFamily.12.d: "Apesar de uma longa conversa com o pai, Saif rejeitou qualquer posição de sucessor. Disse que, se houver alguma sucessão, o direito é de seu irmão mais velho, Muhammad."
 LibyaFamily.12.a: "Talvez possamos conversar sobre isso de novo mais tarde"
 LibyaFamily.13.t: "Saif se afasta do círculo íntimo do pai"
 LibyaFamily.13.d: "Saif não recebeu muito bem as sugestões do pai de que fosse seu sucessor. Acusando o pai de nepotismo, Saif disse que a Líbia 'não era uma fazenda para se herdar'. Disse que só assumiu um papel maior na administração do país devido à ausência de instituições, não por glória pessoal. Agora afirma que não tem mais interesse em ajudar o pai a governar o país."
 LibyaFamily.13.a: "Você deveria ser o escolhido!"
 LibyaFamily.14.t: "O Sunday Telegraph perde processo judicial"
 LibyaFamily.14.d: "Após dois dias no tribunal em Londres em um caso de difamação, os juízes britânicos condenaram o Sunday Telegraph por difamação. As matérias publicadas pelo jornal não apresentavam fontes para as informações, e o autor não conseguiu mostrar ao tribunal nenhuma prova por trás das alegações. O tribunal decidiu que as matérias claramente pretendiam manchar o nome de Saif al-Islam Kadafi. O jornal foi condenado a pagar indenização em dinheiro a Saif al-Islam pelos danos à sua reputação. Os juízes também o obrigaram a publicar um artigo adicional pedindo desculpas a Saif al-Islam. Saif al-Islam foi visto do lado de fora do tribunal fazendo o sinal de V de vitória. Ao sair, disse à imprensa que a primeira coisa que faria era ligar para o pai, que certamente ficará feliz com o resultado."
 LibyaFamily.14.a: "Justiça!"
 LibyaFamily.15.t: "O Sunday Telegraph aceita acordo"
 LibyaFamily.15.d: "Após dois dias no tribunal em Londres em um caso de difamação, o Sunday Telegraph e Saif al-Islam Kadafi concordaram em encerrar a disputa. Com a ajuda de um diplomata saudita na arbitragem, o Sunday Telegraph aceitou pagar parte dos custos judiciais de Saif al-Islam e publicar um pedido público de desculpas, sem precisar pagar pelos danos à reputação de Saif al-Islam. Saif al-Islam foi visto do lado de fora do tribunal fazendo o sinal de V de vitória. Ao sair, disse à imprensa que a primeira coisa que faria era ligar para o pai, que certamente ficará feliz com o resultado."
 LibyaFamily.15.a: "Um compromisso justo"
 LibyaFamily.16.t: "O Sunday Telegraph vence processo judicial"
 LibyaFamily.16.d: "Após dois dias no tribunal em Londres em um caso de difamação, os juízes britânicos consideraram o Sunday Telegraph inocente. Embora o jornal não tenha apresentado provas das alegações na própria matéria, o autor apresentou as provas separadamente quando solicitado pelo tribunal. Embora as provas não bastem para comprovar uma ligação sólida entre Saif al-Islam e lavagem de dinheiro, há vínculos suficientes para justificar a publicação da matéria. O resultado foi um grande golpe na reputação de Saif al-Islam, que deixou o país às pressas na mesma noite em que o julgamento terminou."
 LibyaFamily.16.a: "Bobagem. Eles são culpados!"
 LibyaFamily.17.t: "Saif al-Islam Kadafi ganha prêmio"
 LibyaFamily.17.d: "O Fórum Econômico Mundial (WEF) concedeu a Saif al-Islam Kadafi o prêmio 'Jovem Líder Global'. O prêmio é voltado a líderes estratégicos e inspiradores, com profundo compromisso em promover mudanças positivas duradouras em suas sociedades e no mundo. Esse prêmio certamente fortalecerá a posição de Saif al-Islam no governo."
 LibyaFamily.17.a: "Muito bom!"
 LibyaFamily.18.t: "Saif al-Islam Kadafi recebe doutorado"
 LibyaFamily.18.d: "Saif al-Islam, filho de Kadafi, recebeu um doutorado da London School of Economics. Sua tese, 'O papel da sociedade civil na democratização das instituições de governança global: do poder brando à tomada de decisão coletiva?', foi examinada por vários acadêmicos respeitados. No entanto, a tese acumulou acusações de plágio, bem como alegações de que foi escrita por consultores do Monitor Group, uma consultoria que recebeu mais de 3 milhões de dólares em honorários do pai de Saif."
 LibyaFamily.18.a: "Não há plágio nenhum!"
 LibyaFamily.19.t: "Saif al-Islam pede reformas"
 LibyaFamily.19.d: "Saif al-Islam sempre foi o mais prodigioso dos filhos de Kadafi. Educado na Europa e com conexões com vários políticos, é versado em política e diplomacia. No entanto, sempre foi um ávido reformista. Parece que agora ele levou seus passos de reforma um pouco mais longe: em uma entrevista recente, quando perguntado do que a Líbia mais precisava, respondeu 'Democracia'. Quando lhe pediram que esclarecesse se queria dizer que a Líbia precisava de mais democracia, foi gravado dizendo: 'Não. 'Mais democracia' implicaria que já tivéssemos alguma'. Ele também criticou o histórico de direitos humanos da Líbia e pediu mais reformas no contexto do atual sistema da Jamahiriya."
 LibyaFamily.19.a: "Democracia? Direitos humanos? Ele enlouqueceu?"
 LibyaFamily.20.t: "Trabalho de caridade de Saif al-Islam"
 LibyaFamily.20.d: "Em 1998, Saif al-Islam fundou uma organização não governamental chamada Fundação Internacional de Caridade e Desenvolvimento Kadafi (GICDF). A organização é conhecida por lidar com situações de reféns com militantes islâmicos e por realizar trabalho de caridade na África Subsaariana. Uma recente campanha de caridade aumentou muito nossa reputação junto a um de nossos irmãos africanos."
 LibyaFamily.20.a: "Ótimo"
 LibyaFamily.21.t: "Um acidente de caça"
 LibyaFamily.21.d: "Saif al-Islam é visitante frequente do Reino Unido, inclusive da família real de lá. Em uma recente viagem de caça nas propriedades da princesa Ana, Saif caiu do cavalo e disparou acidentalmente sua arma contra o próprio abdômen. Foi levado às pressas ao hospital mais próximo, mas morreu mais tarde em decorrência dos ferimentos. O governo britânico já expressou suas mais profundas condolências a Muammar Kadafi e à nação líbia, e começou a fazer preparativos para devolver o corpo de Saif à Líbia. É um golpe terrível para a família Kadafi, pois Saif al-Islam era um dos filhos mais prodigiosos de Kadafi."
 LibyaFamily.21.a: "Vejam o que fizeram com meu garoto!"
 LibyaFamily.22.t: "Al-Saadi encontra sucesso"
 LibyaFamily.22.d: "Após uma grande contribuição financeira da família Kadafi, o Perugia, time da Série A italiana, aceitou Al-Saadi em suas fileiras. O negócio se mostrou muito melhor do que o Perugia esperava. Com Diego Maradona como consultor técnico e Ben Johnson como preparador físico, Al-Saadi estava bem preparado para sua próxima partida. Embora tenha jogado apenas 20 minutos em sua primeira partida, Al-Saadi se revelou uma surpresa positiva para todos. O técnico do Perugia disse a [ROOT.GetLeader] que estavam muito felizes com a contratação de Al-Saadi. Al-Saadi parece estar a caminho de se tornar um verdadeiro jogador de futebol."
 LibyaFamily.22.a: "Eu sabia que ele tinha talento!"
 LibyaFamily.23.t: "Al-Saadi não é escolhido"
 LibyaFamily.23.d: "Não encontramos nenhum time interessado em levar Al-Saadi para suas fileiras. Estávamos em conversas com o Birkirkara F.C., time maltês de nível de Liga dos Campeões, mas eles se retiraram das negociações quando Al-Saadi testou positivo para nandrolona em um exame antidoping. A demonstração das habilidades futebolísticas de Al-Saadi também não impressionou ninguém, com o jornal italiano La Repubblica afirmando que 'mesmo com o dobro de sua velocidade atual ele ainda seria duas vezes mais lento que a própria lentidão'. Al-Saadi provavelmente terá de continuar jogando na Líbia por ora."
 LibyaFamily.23.a: "Sempre há a próxima temporada..."
 LibyaFamily.24.t: "Al-Saadi se perde"
 LibyaFamily.24.d: "Conseguimos encontrar um time europeu adequado para Al-Saadi jogar, mas nem tudo saiu conforme o planejado. Com seu novo acesso à Europa, Al-Saadi piorou ainda mais seu vício em drogas. Ele quase não joga partidas e desperdiça o tempo com festas e drogas, achando que é uma enorme estrela do futebol. Parece uma causa perdida agora."
 LibyaFamily.24.a: "Não é assim que se joga futebol"
 LibyaFamily.25.t: "O tumulto do futebol"
 LibyaFamily.25.d: "É de conhecimento geral nos círculos do futebol líbio que Al-Saadi Kadafi manipula as partidas em que joga. Em um jogo recente de seu clube, o Al Ahly, torcedores do time adversário começaram a vaiá-lo e a seu time, e desfilaram pelo gramado com um burro vestido com as cores do Al Ahly, com a intenção de protestar contra a interferência de Al-Saadi nas partidas. Al-Saadi não gostou nada disso e foi ouvido gritando: 'Vou destruir o seu clube! Vou transformá-lo em ninho de coruja'. Quando um árbitro interveio e tentou acalmar a situação, o técnico do Al Ahly o empurrou para o lado. Isso levou os torcedores mais radicais à violência, invadindo o gramado. Por fim, a situação virou um tumulto generalizado, com as forças de segurança reprimindo duramente os desordeiros. O restante da temporada foi cancelado por medo de novos tumultos."
 LibyaFamily.25.a: "Esse idiota vaidoso!"
 LibyaFamily.26.t: "Al-Saadi morre de overdose"
 LibyaFamily.26.d: "O filho de Muammar Kadafi, Al-Saadi, foi encontrado ontem morto em um quarto de hotel em Milão, na Itália. Parece que morreu de overdose de drogas. Conhecido pelo abuso de drogas e pelo estilo de vida extravagante, isso não chega a ser uma surpresa. Embora fosse a 'ovelha negra' da família Kadafi, ele ainda era muito querido pelo pai e pelos irmãos."
 LibyaFamily.26.a: "Deveríamos tê-lo mandado para a reabilitação"
 LibyaFamily.27.t: "Al-Saadi abandona o vício"
 LibyaFamily.27.d: "Foi uma semana difícil para Al-Saadi. Passar todo o tempo isolado parece ter valido a pena, e ele conseguiu largar o vício em drogas. No entanto, acabou adquirindo um vício bastante pesado em cigarro no processo. Felizmente, cigarros não são nem de longe tão mortais quanto cocaína. Al-Saadi pediu desculpas ao pai pelo comportamento passado e prometeu fazer um trabalho melhor no futuro, tanto pela Líbia quanto pela família."
 LibyaFamily.27.a: "Esta é a única vez que gosto de quem desiste"
 LibyaFamily.28.t: "Al-Saadi tem recaída"
 LibyaFamily.28.d: "A primeira semana na reabilitação correu bem, e Al-Saadi conseguiu ficar longe das drogas. No entanto, na segunda semana ele teve uma forte recaída. Acabou deixando o centro de reabilitação por completo. O pessoal do centro tentou impedir, mas Al-Saadi chamou seu guarda-costas pessoal para buscá-lo e ameaçou matar todos no centro se não o deixassem sair. O vício parece estar muito arraigado."
 LibyaFamily.28.a: "Acho que isso é algum tipo de progresso?"
 LibyaFamily.29.t: "Al-Saadi abandona a Líbia"
 LibyaFamily.29.d: "A primeira semana na reabilitação correu bem, e Al-Saadi conseguiu ficar longe das drogas. No entanto, na segunda semana ele teve uma forte recaída. Por fim, tentou deixar o centro por completo. A equipe do centro tentou impedir, mas Al-Saadi soltou seus guarda-costas pessoais sobre os funcionários. A situação então se agravou quando a polícia local foi chamada ao local. Al-Saadi, em pânico alimentado pelas drogas, surtou e fugiu com seus guarda-costas para o Aeroporto de Trípoli, onde embarcou em seu jato particular e escapou para a Suíça. Desde então não entrou em contato conosco, e não temos certeza se algum dia voltará."
 LibyaFamily.29.a: "Bem, isso escalou rápido"
 LibyaFamily.30.t: "Al-Saadi envergonha a família"
 LibyaFamily.30.d: "Al-Saadi vive no exílio na Suíça há algum tempo, promovendo festas extravagantes para celebridades e amigos. Uma festa recente não saiu exatamente como planejado: Al-Saadi foi encontrado desmaiado, nu, em uma praia, com outro homem nu em cima dele. A notícia se espalhou rapidamente pelos tabloides, com o corpo exposto de Al-Saadi estampando capas de revistas por toda a Europa. Foi certamente um grande golpe para o nome da família Kadafi."
 LibyaFamily.30.a: "Na praia?"
 LibyaFamily.31.t: "Mutassim Kadafi passa dos limites"
 LibyaFamily.31.d: "Parece que Mutassim Kadafi ainda anseia por seu passado militar. Descobriu-se recentemente que, em seu papel de Conselheiro de Segurança Nacional, Mutassim havia solicitado 1,2 bilhão de dólares à Companhia Nacional de Petróleo para formar sua própria brigada de forças especiais. O pedido foi rapidamente negado e rejeitado pelo governo, mas o abuso de Mutassim de sua posição política não passou despercebido."
 LibyaFamily.31.a: "Será que ele não consegue largar o passado?"
 LibyaFamily.32.t: "Mutassim encontra um bom negócio"
 LibyaFamily.32.d: "Na busca por um fornecedor de armas, [SOV.GetNameDef] era a resposta óbvia. Após longas negociações, Mutassim conseguiu que um grande lote de equipamento de última geração fosse entregue às nossas forças armadas. Isso melhorará substancialmente a capacidade do nosso exército."
 LibyaFamily.32.a: "Que grande empresário!"
 LibyaFamily.33.t: "Mutassim encontra um negócio razoável"
 LibyaFamily.33.d: "Ao procurar um fornecedor de armas, [SOV.GetNameDef] foi a resposta clara. Após longas negociações, Mutassim conseguiu um grande lote de armas para as nossas forças armadas. Infelizmente, é tudo material antigo da Guerra Fria que os [SOV.GetAdjective] estavam planejando se livrar de qualquer maneira. Isto não melhorará a nossa capacidade de combate, mas pelo menos temos alguns arsenais extra agora."
 LibyaFamily.33.a: "Melhor que nada, eu acho"
 LibyaFamily.34.t: "Negócio de Mutassim fracassa"
 LibyaFamily.34.d: "Na busca por um fornecedor de armas, [SOV.GetNameDef] era a resposta óbvia. Após longas negociações, nada de notável foi obtido. Os [SOV.GetAdjective]s não estavam dispostos a nos entregar grandes quantidades de armas. A visita a [SOV.GetName] foi uma perda de tempo, e o papel de Mutassim como Conselheiro de Segurança Nacional agora está manchado."
 LibyaFamily.34.a: "Melhor tentarmos de novo algum dia"
 LibyaFamily.35.t: "Mutassim Kadafi amplia a influência egípcia"
 LibyaFamily.35.d: "Embora Mutassim Kadafi viva no exílio no Egito, ele ainda mantém conexões com o regime líbio, especialmente com membros do Comitê Geral do Povo. Recentemente, ele esteve em contato com muitos de seus amigos na Líbia e falou muito bem do presidente egípcio [EGY.GetLeader]."
 LibyaFamily.35.a: "Ele está planejando um golpe?"
 LibyaFamily.36.t: "Muhammad Kadafi deixa a Líbia para sempre"
 LibyaFamily.36.d: "Após mais uma discussão com o pai, Muhammad Kadafi disse que deixaria a Líbia para sempre. Diz que não se sente mais bem-vindo em casa e só quer viver sua vida fora da política. Ele já preparou uma viagem à Argélia, embora não tenha dito se fará dela seu novo lar. Parece que o filho mais velho de Kadafi está fora do jogo."
 LibyaFamily.36.a: "Por favor, não vá"
 LBA_muhammad_muammar_gaddafi_leaves_for_good_tt: "§YMuhammad Kadafi§! está exilado permanentemente"
 LibyaFamily.37.t: "Mutassim Kadafi assassinado"
 LibyaFamily.37.d: "Mutassim Kadafi foi encontrado assassinado em um quarto de hotel em Amsterdã. O principal suspeito do caso é o contrabandista de armas líbio Tarek Kaituni. Parece que Mutassim, que frequentava Amsterdã em 'viagens de negócios', na verdade tinha um caso com Lisa van Goinga, modelo holandesa e esposa de Kaituni. A polícia holandesa ainda não prendeu Tarek Kaituni, e seu paradeiro atual é desconhecido."
 LibyaFamily.37.a: "O quê?!"
 LibyaFamily.38.t: "Hannibal Kadafi preso"
 LibyaFamily.38.d: "Hannibal Kadafi e sua esposa foram presos na Suíça. Dois de seus empregados chamaram a polícia alegando que o casal os havia agredido no hotel em Genebra. Dois guarda-costas de Kadafi também foram presos no processo ao tentarem impedir a entrada da polícia no quarto de hotel dos Kadafi. Hannibal tem um histórico com a polícia na Europa. Há poucos anos, um tribunal francês o multou por bater na namorada, e há apenas um ano dois de seus guarda-costas foram presos quando a polícia francesa tentou impedi-lo de dirigir em alta velocidade. Hannibal foi solto sob fiança de 124 000 euros, e sua esposa, de 186 000 euros. Isso provocou um incidente diplomático entre a Suíça e a Líbia."
 LibyaFamily.38.a: "A Suíça nem é um país de verdade!"
 LibyaFamily.39.t: "Hannibal Kadafi se afoga"
 LibyaFamily.39.d: "Devido à sua formação e ocupação, Hannibal Kadafi embarca e trabalha com frequência em diversas embarcações da Companhia Geral Nacional de Transporte Marítimo, a empresa comercial estatal. Um acidente ocorreu hoje, quando, em meio a uma tempestade, Hannibal caiu no mar. A tripulação do navio fez o possível para salvá-lo, mas não conseguiu puxá-lo de volta ao navio. Por fim, Hannibal desapareceu sob as ondas, para nunca mais ser visto."
 LibyaFamily.39.a: "Deveriam ter se esforçado mais!"
 LibyaFamily.40.t: "Ayesha Kadafi é nomeada Embaixadora da Boa Vontade da ONU"
 LibyaFamily.40.d: "At a a ceremony at Watassemo Charity Association headquarters in Tripoli, Aisha Gaddafi, was appointed as United Nations Development Program National Goodwill Ambassador for Libya due to her past charity work. In her new role as UN Goodwill Ambassador, she will work together with the UNDP to raise awareness on issues related to Millennium Development Goals, advocate for women's rights, work on combating the spread of HIV/AIDs and promote UNDP's work in Libya. This is a tremendous occasion as as we repair our relations with the world."
 LibyaFamily.40.a: "Que bom para ela!"
 LibyaFamily.41.t: "Ayesha Kadafi descobre seu poder oculto"
 LibyaFamily.41.d: "Não sabemos bem o que aconteceu com o treinamento militar de Ayesha, mas foi milagroso. Ela acabou de começar a comandar tropas e, em nossos últimos jogos de guerra, chegou a vencer nossos principais generais. Alguns de nossos soldados começaram a chamá-la de 'Amazona da Líbia', em referência às antigas guerreiras da guarda pessoal exclusivamente feminina de Muammar Kadafi. Sua habilidade militar incentivou muito mais mulheres a procurar os centros de recrutamento na esperança de se tornarem como ela."
 LibyaFamily.41.a: "Poder feminino!"
 LibyaFamily.42.t: "Ayesha Kadafi é promovida a general"
 LibyaFamily.42.d: "Ayesha concluiu seu treinamento para se tornar general. Embora não tenha se destacado particularmente no treinamento, teve algumas ideias singulares que talvez possamos aproveitar mais tarde. Ela declarou que não assumirá um papel ativo nas forças armadas, mas manterá a patente de general como cerimonial."
 LibyaFamily.42.a: "Já é alguma coisa"
 LibyaFamily.43.t: "Ayesha Kadafi se atrapalha no treinamento militar"
 LibyaFamily.43.d: "O treinamento militar de Ayesha não saiu exatamente como o planejado. Primeiro, ela conseguiu perder uma brigada inteira; depois, em um jogo de guerra, fez a brigada atacar na direção errada. Sua personalidade teimosa também causou vários choques com muitos oficiais superiores, chegando a fazer um deles pedir demissão das forças armadas. Ela acabou alcançando a patente de general. No entanto, não servirá ativamente nas forças armadas. Mesmo assim, o fracasso total de seu treinamento fez com que toda a nossa educação militar e o nosso exército se tornassem alvo de ridicularização e suspeita."
 LibyaFamily.43.a: "Como é possível fracassar tanto?"
 LibyaFamily.44.t: "Ayesha Kadafi defende os direitos das mulheres"
 LibyaFamily.44.d: "Em uma entrevista recente, Ayesha Kadafi criticou publicamente a situação das mulheres na Líbia. Afirmou que elas são oprimidas no país e não têm as mesmas oportunidades que os homens. Ela criticou especialmente [ROOT.GetLeader], apontando seu grupo de guarda-costas exclusivamente feminino. Embora, na superfície, isso pareça empoderar as mulheres, na realidade apenas as objetifica, já que as guarda-costas costumam ser escolhidas pela aparência e não pela habilidade militar. A entrevista causou grande alvoroço na Líbia, e já houve várias manifestações pelos direitos das mulheres."
 LibyaFamily.44.a: "As mulheres na Líbia estão tão bem quanto os homens!"
 LibyaFamily.45.t: "Ayesha Kadafi morre no parto"
 LibyaFamily.45.d: "Há notícias trágicas sobre a única filha de Muammar Kadafi. Na noite passada, após o nascimento de seu quarto filho, Ayesha morreu de hemorragia pós-parto. Os médicos fizeram o possível para estancar o sangramento, mas nada pôde ser feito. Felizmente, a criança nasceu saudável, mas ainda assim é uma perda trágica para a família Kadafi."
 LibyaFamily.45.a: "Os médicos deveriam ter feito melhor!"
 LibyaFamily.46.t: "Saif al-Arab suspeito de ataque com ácido"
 LibyaFamily.46.d: "Saif al-Arab é visitante frequente da Alemanha. Recentemente, ele se meteu em confusão em uma boate em Munique. Quando suas namoradas começaram a fazer striptease na pista de dança, o segurança da boate expulsou ele e sua namorada. Uma briga eclodiu entre Saif e o segurança. Mais tarde, ele passou a ser investigado pela polícia alemã por supostamente planejar um ataque com ácido contra o segurança como retaliação. Saif, obviamente, negou as acusações."
 LibyaFamily.46.a: "As acusações obviamente serão retiradas"
 LibyaFamily.46.b: "Enviar-lhe ajuda jurídica!"
 LibyaFamily.47.t: "Saif al-Arab suspeito de contrabando de armas"
 LibyaFamily.47.d: "O Ministério Público alemão acusa Saif al-Arab de contrabando de armas. Aparentemente, há provas de que Saif ajudou a contrabandear uma bolsa com fuzis de assalto, um revólver e munição de Munique para Paris. É uma acusação muito grave."
 LibyaFamily.47.a: "As acusações obviamente serão retiradas"
 LibyaFamily.47.b: "Fazer alguma pressão diplomática sobre os alemães!"
 LibyaFamily.48.t: "Ferrari de Saif al-Arab apreendida"
 LibyaFamily.48.d: "A polícia alemã apreendeu a Ferrari de Saif al-Arab depois que vizinhos reclamaram do barulho alto do escapamento. Saif al-Arab agora enfrenta acusações por perturbação da ordem."
 LibyaFamily.48.a: "As acusações obviamente serão retiradas"
 LibyaFamily.48.b: "Enviar-lhe ajuda jurídica!"
 LibyaFamily.49.t: "Saif al-Arab morre na prisão"
 LibyaFamily.49.d: "Embora Saif al-Arab tenha sido condenado por crimes na Alemanha, ele conseguiu escapar de uma pena de prisão ao retornar à Líbia. No entanto, por motivos desconhecidos, visitava novamente a Alemanha. A polícia alemã conseguiu capturá-lo e ele foi levado a uma cadeia local em Munique. No dia seguinte, foi encontrado enforcado em sua cela. A declaração oficial da polícia alemã é de que foi suicídio, com a motivação mais provável sendo a vergonha que Saif causou à família. No entanto, há teorias alternativas de uma possível vingança de outros detentos ou até de um suicídio forjado pelo serviço de inteligência alemão."
 LibyaFamily.49.a: "Saif al-Arab não se matou!"
 LibyaFamily.50.t: "Khamis Kadafi faz 18 anos"
 LibyaFamily.50.d: "Hoje foi o aniversário de Khamis Kadafi, o filho mais novo de Muammar Kadafi. Ele finalmente completou 18 anos e agora está pronto para começar a assumir um papel maior no governo líbio."
 LibyaFamily.50.a: "Feliz aniversário!"
 khamis_gaddafi_unlock_decisions_tt: "§GNovas §YDecisões§! para Khamis Kadafi foram desbloqueadas!§!"
 LibyaFamily.51.t: "Helicóptero de Khamis Kadafi cai"
 LibyaFamily.51.d: "Durante uma viagem a uma base militar próxima, o helicóptero em que Khamis viajava sofreu uma pane. O helicóptero caiu perto de uma grande rodovia, explodindo em uma bola de fogo e matando todos os ocupantes. O promissor líder militar que Khamis era agora não passa de cinzas."
 LibyaFamily.51.a: "Ah, não"
 LibyaFamily.53.t: "Muammar Kadafi humilha a ONU"
 LibyaFamily.53.d: "Quando Muammar Kadafi subiu ao púlpito da Assembleia Geral da ONU, poucos sabiam o que esperar. Ele levou 17 minutos para chegar ao ponto principal, pedindo uma cadeira africana no Conselho de Segurança. Agitando uma cópia da carta da ONU, denunciou a estrutura permanente do Conselho de Segurança, que, segundo ele, incentivava o tratamento de outros países como 'cidadãos de segunda classe'.\n\n'É feudalismo político para quem tem uma cadeira permanente... Não deveria se chamar Conselho de Segurança, deveria se chamar conselho do terror. Ele não nos deu segurança, mas terror e sanções', disse, enquanto rasgava uma página da carta em desafio.\n\n'Permanente é algo só de Deus. Não somos tolos de dar o poder de veto às grandes potências para que possam nos usar e nos tratar como cidadãos de segunda classe... O poder de veto deve ser anulado', acrescentou antes de jogar a carta da ONU por cima do ombro. Ele também exigiu que a sede da ONU fosse transferida para a Líbia e uma investigação minuciosa das mortes de John F. Kennedy e Martin Luther King, propôs que Israel e Palestina fossem combinados em Isratina, celebrou o Talibã, espalhou teorias da conspiração sobre a gripe suína e exigiu 7,7 trilhões de dólares em reparações à África pelo colonialismo. No total, levou 90 minutos inteiros para encerrar o discurso, quando discursos costumam durar apenas cerca de 15 minutos.\n\nNosso grande líder mostrou ao mundo que a Líbia é sua verdadeira senhora!"
 LibyaFamily.53.a: "Isso sim mostrou a eles!"
 LibyaFamily.54.t: "Muammar Kadafi consegue terminar seu discurso"
 LibyaFamily.54.d: "Quando Muammar Kadafi subiu ao púlpito da Assembleia Geral da ONU, poucos sabiam o que esperar. Ele divagou por pouco tempo sobre como o Conselho de Segurança deveria ter uma cadeira dedicada à África, ao mesmo tempo em que se perdia em digressões sobre colonialismo, gripe suína e Israel. Parecia suar profusamente enquanto tentava concluir suas falas, esforçando-se para não sair do assunto. Após 20 minutos, pediram que encerrasse o discurso, e ele o fez. Um tanto relutante, Muammar Kadafi desceu do púlpito, aparentemente resmungando que aquilo era 'mais um exemplo do Ocidente tentando silenciar a ascensão da África'. Foi sem dúvida um discurso, mas provavelmente não teve o efeito que Kadafi esperava."
 LibyaFamily.54.a: "Kadafi precisa trabalhar seu carisma"
 LibyaFamily.55.t: "Muammar Kadafi é expulso do púlpito"
 LibyaFamily.55.d: "Quando Muammar Kadafi subiu ao púlpito da Assembleia Geral da ONU, poucos sabiam o que esperar. Ele começou a divagar sobre o sionismo, chamando o Conselho de Segurança de organização terrorista financiada por Israel. Também zombou de seus colegas líderes árabes, chamando-os de brinquedos dos britânicos. Não demorou até que uma onda de vaias começasse na Assembleia, com delegados pedindo que Kadafi encerrasse o discurso. Kadafi, em resposta, chamou todos os delegados de idiotas e até jogou uma garrafa de água em direção à delegação israelense. Logo depois, a segurança o arrastou para fora do púlpito, seguida de aplausos da Assembleia. Enquanto era arrastado, foi ouvido gritando: 'Por que estão me vaiando? Eu estou certo!'. Foi um desastre total para a imagem da Líbia."
 LibyaFamily.55.a: "Isso não saiu como planejado"
 LibyaFamily.56.t: "O povo entende a mensagem de Kadafi"
 LibyaFamily.56.d: "Ao meio-dia, Kadafi partiu em um passeio por Trípoli em um longo comboio de veículos. Ao passar pelos bairros, jogou grandes quantidades de dinheiro nas ruas. Ao mesmo tempo, alto-falantes falavam sobre como as instituições de caridade internacionais desperdiçam dinheiro, assim como ele desperdiçava dinheiro jogando-o na rua.\n\nAs pessoas saíram em massa para recolher o dinheiro das ruas, mas, curiosamente, muitas se recusaram. Parece que entenderam a mensagem de Kadafi de que não se deve depender de esmolas. Após o evento, notamos um aumento na quantidade de horas extras que as pessoas fazem no trabalho, e os bancos de alimentos relatam uma diminuição no número de pessoas. Parece que tudo de que o povo precisava era um empurrãozinho."
 LibyaFamily.56.a: "Os líbios são um povo trabalhador"
 LibyaFamily.57.t: "O povo não entende o ponto de Kadafi"
 LibyaFamily.57.d: "Ao meio-dia, Kadafi partiu em um passeio por Trípoli em um longo comboio de veículos. Ao passar pelos bairros, jogou grandes quantidades de dinheiro nas ruas. Ao mesmo tempo, alto-falantes falavam sobre como as instituições de caridade internacionais desperdiçam dinheiro, assim como ele desperdiçava dinheiro jogando-o na rua.\n\nAs pessoas saíram em massa para recolher o dinheiro das ruas e começaram a acumulá-lo. Assim que a rua foi limpa, as pessoas retomaram seus afazeres diários. A mensagem dos alto-falantes caiu em ouvidos moucos, pois as pessoas só queriam ganhar um dinheiro fácil. No mínimo, o povo ficará um pouco mais satisfeito com o regime."
 LibyaFamily.57.a: "Acho que isso é bom?"
 LibyaFamily.58.t: "O povo entende mal a mensagem de Kadafi"
 LibyaFamily.58.d: "Ao meio-dia, Kadafi partiu em um passeio por Trípoli em um longo comboio de veículos. Ao passar pelos bairros, jogou grandes quantidades de dinheiro nas ruas. Ao mesmo tempo, alto-falantes falavam sobre como as instituições de caridade internacionais desperdiçam dinheiro, assim como ele desperdiçava dinheiro jogando-o na rua.\n\nAs pessoas saíram em massa para recolher o dinheiro das ruas e começaram a acumulá-lo. Assim que um trecho da rua foi limpo, as pessoas continuaram seguindo o comboio na esperança de mais dinheiro. Por fim, milhares de pessoas caminhavam atrás da fila de veículos, recolhendo cada moeda que conseguiam encontrar. Mais surpreendente ainda, as pessoas saíram às ruas até no dia seguinte, esperando a chegada do inexistente comboio. Uma tendência semelhante foi notada em algumas outras cidades líbias. Agora o povo parece esperar que o governo simplesmente lhe dê dinheiro, e ficou consideravelmente menos motivado para trabalhar."
 LibyaFamily.58.a: "Eles não entenderam que era uma alegoria? Ou talvez uma metáfora?"
 LibyaFamily.59.t: "O carro tem um bom design"
 LibyaFamily.59.d: "Depois que Muammar Kadafi compartilhou suas ideias com engenheiros líbios e consultores de montadoras europeias, os ouvintes parabenizaram o líder por seu senso aguçado de design. Tinham certeza de que as ideias de Kadafi poderiam ser implementadas na prática com sucesso. No entanto, nem todas as ideias poderiam ser usadas em um único veículo. Qual deve ser o foco principal? Devemos fazer um carro robusto e seguro, um carro barato e feito para produção em massa para o povo, ou um caminhão que possa ser usado em aplicações militares quando necessário? E, claro, precisamos escolher um nome adequado para o veículo."
 LibyaFamily.59.a: "O carro será firme como uma rocha! O Foguete!"
 LibyaFamily.59.b: "Ganharemos dinheiro rápido com o carro! O Balde!"
 LibyaFamily.59.c: "O carro terá muita força! O Pacote!"
 LibyaFamily.60.t: "O carro é um fracasso"
 LibyaFamily.60.d: "Depois que Muammar Kadafi compartilhou suas ideias com engenheiros líbios e consultores de montadoras europeias, os ouvintes ficaram muito céticos quanto à ideia. No entanto, a produção do carro seguiu em frente mesmo assim. Pouco depois, em um salão do automóvel na Líbia, o Saroukh el-Jamahiriya (Foguete Líbio) foi apresentado. Repleto de recursos de segurança, Kadafi o proclamou o carro mais seguro do mundo. No entanto, todos os recursos de segurança do carro são itens padrão de qualquer carro moderno. O que não é padrão, porém, é o formato do carro: tanto o para-choque dianteiro quanto o traseiro têm formato de cunha. A ideia é que, em uma colisão, o carro seja simplesmente desviado de qualquer coisa que atingir. Embora transformar um carro em uma bolinha de pinball talvez não seja o elemento mais seguro das estradas, isso pode ter alguns usos militares."
 LibyaFamily.60.a: "Que diabos é isso!?"
 LibyaFamily.61.t: "O carro é um desastre"
 LibyaFamily.61.d: "Depois que Muammar Kadafi compartilhou suas ideias com engenheiros líbios e consultores de montadoras europeias, os ouvintes ficaram muito céticos quanto à ideia. No entanto, a produção do carro seguiu em frente mesmo assim. Pouco depois, em um salão do automóvel na Líbia, o Saroukh el-Jamahiriya (Foguete Líbio) foi apresentado. Proclamado por Kadafi o carro mais seguro do mundo, o evento continuou com uma apresentação ao vivo do formato de cunha exclusivo do carro, que simplesmente desviaria qualquer coisa contra a qual colidisse. Quando o carro disparou pela pista de testes, ricocheteou no impacto direto para a plateia que assistia. Ao atingir a barreira de segurança, explodiu em uma bola de fogo. Várias pessoas morreram na colisão, e dezenas ficaram feridas. Logo depois, houve uma queda repentina em todas as vendas de carros novos na semana seguinte. As pessoas se recusam a comprar carros novos por temerem por sua segurança. Se o carro novo mais seguro é tão inseguro, como serão os outros? As pessoas chegam a importar carros mais velhos da África Central para conseguir algo antigo e confiável. Esse aumento de carros velhos nas ruas na verdade piorou os acidentes de trânsito e as fatalidades na Líbia."
 LibyaFamily.61.a: "Por que fizeram o carro pontudo!?"
 LibyaFamily.62.t: "Uma visita de Estado bem-sucedida"
 LibyaFamily.62.d: "When Muammar Gaddafi landed in [?libya_state_visit_target.GetNameDef], he brought along with with him his massive Bedouin tent, which he setup in a park in the country's capital. With him were his bodyguard, an entourage of ministers, luxury cars and a small herd of camels so he could drink their milk every morning. While originally, it was planned for Gaddafi to meet [?libya_state_visit_target.GetName]'s leader in a more official setting, eventually [?ibya_state_visit_target.GetLeader] caved in to Gaddafi's demands to have the meeting in his tent. While various business and Libya's future was discussed, nothing fruitful was achieved. However, this humiliation of a foreign head of state has increased Gaddafi's standing in the world and at home."
 LibyaFamily.62.a: "Finalmente Kadafi recebe o respeito que merece"
 LibyaFamily.63.t: "Uma visita de Estado medíocre"
 LibyaFamily.63.d: "When Muammar Gaddafi landed in [?libya_state_visit_target.GetNameDef], he brought along with with him his massive Bedouin tent, which he setup in a park in the country's capital. With him were his bodyguard, an entourage of ministers, luxury cars and a small herd of camels so he could drink their milk every morning. While Gaddafi wanted to have all meetings inside his tent, his host [?libya_state_visit_target.GetLeader] wasn't as eager to do so. Eventually Gaddafi caved in an had all the meetings in a nearby luxury hotel. While various business and Libya's future was discussed, nothing fruitful was achieved. However, this show of luxury has given Gaddafi a small boost at home."
 LibyaFamily.63.a: "Em Roma, como os romanos, eu acho"
 LibyaFamily.64.t: "Uma visita de Estado horrível"
 LibyaFamily.64.d: "When Muammar Gaddafi landed in [?libya_state_visit_target.GetNameDef], he brought along with with him his massive Bedouin tent with the intention of setting it up in a local park. The local authorities however disallowed the tent from being raised however, and Gaddafi was guided to a local hotel. Gaddafi refused to do so, demanding that it is customary to his people to hold meeting in a tent. The person he was suppose to be meeting, [?libya_state_visit_target.GetLeader], eventually cancelled all meetings as Gaddafi refused to budge his stance. This trip has been worthless and the world has seen that the 'Mad Dog' of Libya seems to be completely toothless."
 LibyaFamily.64.a: "Que vergonha"
 LibyaFamily.65.t: "Um ritual poderoso"
 LibyaFamily.65.d: "Enquanto Muammar Kadafi reunia parte de suas tropas de elite em um pátio em Trípoli, um marabu senegalês tomou posição diante das tropas. Escrevendo encantamentos e símbolos estranhos em um pedaço de papel, ele o cobriu com pele seca de leão, plantas que crescem em cemitérios e casca de uma árvore sob a qual um homem morreu. Embrulhando tudo em um pacote bem arrumado, a oferenda foi colocada sobre brasas vermelhas para queimar lentamente e soltar fumaça. Os soldados líbios receberam ordem de passar um a um sobre a fumaça, permitindo que ela penetrasse sua vitalidade. Logo depois, o marabu começou a invocar os espíritos para dar força aos soldados. Em um estado de transe, os soldados começaram a repetir 'Deus... Líbia... Kadafi'. Ao fim do ritual, os soldados estavam sedentos de sangue, vigorosos e prontos para lutar até o último suspiro. A Líbia está salva!"
 LibyaFamily.65.a: "Que porra é essa?"
 LibyaFamily.66.t: "Um ritual revigorante"
 LibyaFamily.66.d: "Enquanto Muammar Kadafi reunia parte de suas tropas de elite em um pátio em Trípoli, um marabu senegalês tomou posição diante das tropas. Escrevendo encantamentos e símbolos estranhos em um pedaço de papel, ele o cobriu com pele seca de leão, plantas que crescem em cemitérios e casca de uma árvore sob a qual um homem morreu. Embrulhando tudo em um pacote bem arrumado, a oferenda foi colocada sobre brasas vermelhas para queimar lentamente e soltar fumaça. Os soldados líbios receberam ordem de passar um a um sobre a fumaça, permitindo que ela penetrasse sua vitalidade. Os soldados fizeram como mandado, embora a maioria parecesse muito confusa. Depois que o marabu invocou os espíritos para dar força aos soldados, a cerimônia terminou. Os soldados não sabiam o que pensar, mas ao menos ficaram contentes em saber que seu líder está disposto a fazer qualquer coisa para fazê-los vencer."
 LibyaFamily.66.a: "Melhor que nada"
 LibyaFamily.67.t: "Um ritual fracassado"
 LibyaFamily.67.d: "Enquanto Muammar Kadafi reunia parte de suas tropas de elite em um pátio em Trípoli, um marabu senegalês tomou posição diante das tropas. Escrevendo encantamentos e símbolos estranhos em um pedaço de papel, ele o cobriu com pele seca de leão, plantas que crescem em cemitérios e casca de uma árvore sob a qual um homem morreu. Embrulhando tudo em um pacote bem arrumado, a oferenda foi colocada sobre brasas vermelhas para queimar lentamente e soltar fumaça. Os soldados líbios receberam ordem de passar um a um sobre a fumaça. No entanto, ninguém deu um passo à frente. Os soldados começaram a chamar o marabu de herege, dizendo que tal invocação dos Jinn era heresia e contrária ao Islã. A situação saiu rapidamente do controle, com Kadafi e o marabu tendo de fugir do pátio em pânico da ira dos soldados furiosos. Muitos soldados largaram seus uniformes e desertaram ali mesmo. A notícia do ritual se espalhou rapidamente pelas forças armadas, e nossos soldados começaram a perder a fé em nosso líder aos montes."
 LibyaFamily.67.a: "Era para ser só um truque de mágica!"
 LibyaFamily.68.t: "Mulheres empolgadas com a palestra"
 LibyaFamily.68.d: "Kadafi decidiu organizar sua palestra em Roma, durante uma visita à Itália. Ele enviou um pedido a uma agência italiana de hospitalidade para convidar centenas de mulheres atraentes, entre 18 e 35 anos (e com pelo menos 1,70 metro de altura), para sua misteriosa palestra. As mulheres foram aconselhadas a não usar minissaias nem decotes profundos devido à devoção do evento. Quando as mulheres se reuniram no auditório, Kadafi chegou vestido todo de preto e iniciou sua palestra. A equipe exclusivamente feminina de Kadafi distribuiu exemplares do Alcorão às mulheres, enquanto o próprio Kadafi discursava sobre o Islã, o fracasso do Cristianismo e o papel das mulheres no Ocidente. As palavras de Kadafi pareceram ressoar com muitas das mulheres, pois logo após a palestra várias já lhe disseram que gostariam de se converter ao Islã. O evento atraiu rapidamente a atenção da mídia global e provocou uma onda de mulheres se convertendo ao Islã e viajando à Líbia para ver a terra onde as mulheres podem ser verdadeiramente livres."
 LibyaFamily.68.a: "O Islã é verdadeiramente a religião das mulheres"
 LibyaFamily.69.t: "Uma palestra medíocre"
 LibyaFamily.69.d: "Kadafi decidiu organizar sua palestra em Roma, durante uma visita à Itália. Ele enviou um pedido a uma agência italiana de hospitalidade para convidar centenas de mulheres atraentes, entre 18 e 35 anos (e com pelo menos 1,70 metro de altura), para sua misteriosa palestra. As mulheres foram aconselhadas a não usar minissaias nem decotes profundos devido à devoção do evento. Quando as mulheres se reuniram no auditório, Kadafi chegou vestido todo de preto e iniciou sua palestra. A equipe exclusivamente feminina de Kadafi distribuiu exemplares do Alcorão às mulheres, enquanto o próprio Kadafi discursava sobre o Islã, o fracasso do Cristianismo e o papel das mulheres no Ocidente. A palestra teve recepção mista entre as mulheres: uma participante a chamou de 'uma experiência muito interessante', enquanto outra comentou: 'Sinto-me muito ofendida em relação à minha religião'. A palestra, no entanto, causou um pequeno aumento na imigração para a Líbia."
 LibyaFamily.69.a: "Pelo menos elas ouviram"
 LibyaFamily.70.t: "Palestra causa indignação"
 LibyaFamily.70.d: "Kadafi decidiu organizar sua palestra em Roma, durante uma visita à Itália. Ele enviou um pedido a uma agência italiana de hospitalidade para convidar centenas de mulheres atraentes, entre 18 e 35 anos (e com pelo menos 1,70 metro de altura), para sua misteriosa palestra. As mulheres foram aconselhadas a não usar minissaias nem decotes profundos devido à devoção do evento. Quando as mulheres se reuniram no auditório, Kadafi chegou vestido todo de preto e iniciou sua palestra. A equipe exclusivamente feminina de Kadafi distribuiu exemplares do Alcorão às mulheres, enquanto o próprio Kadafi discursava sobre o Islã, o fracasso do Cristianismo e o papel das mulheres no Ocidente. Ao fim da palestra, muitas mulheres vaiavam Kadafi. Uma participante comentou que 'nunca tinham sido tão insultadas na vida'. Muitos chamam a visão de Kadafi sobre as mulheres de opressora e a palestra de nada mais que um truque mal disfarçado para conhecer belas jovens. A notícia do evento também chegou à Líbia, onde muitas mulheres planejam deixar o país por não quererem viver em um país governado por um misógino assim."
 LibyaFamily.70.a: "Quem diria que as mulheres eram tão temperamentais?"
 LibyaFamily.71.t: "[FROM.GetNameDef] pede o desmantelamento de [SWI.GetNameDef]"
 LibyaFamily.71.d: "O líder líbio, Muammar Kadafi, pediu que o Estado suíço seja desmantelado. Ele diz que a Suíça é apenas um Estado artificial formado por italianos, alemães e franceses. Kadafi entrou em contato com os três países vizinhos e pediu que nos juntemos a ele nesta declaração sobre a artificialidade suíça."
 LibyaFamily.71.a: "A Suíça não deveria existir"
 LibyaFamily.71.b: "A Suíça é um Estado soberano!"
 LibyaFamily.72.t: "[FROM.GetNameDef] apoia nossa declaração"
 LibyaFamily.72.d: "O governo [FROM.GetAdjective] decidiu apoiar nossa declaração sobre a dissolução da Suíça."
 LibyaFamily.72.a: "Ótimo"
 LibyaFamily.73.t: "[FROM.GetNameDef] condena nossa declaração"
 LibyaFamily.73.d: "O governo [FROM.GetAdjective] decidiu condenar nossa declaração sobre a dissolução da Suíça, afirmando que a Suíça é uma nação soberana e sua soberania deve ser respeitada."
 LibyaFamily.73.a: "Covardes"
 LibyaFamily.74.t: "[FROM.GetNameDef] pede nossa destruição"
 LibyaFamily.74.d: "O líder [FROM.GetAdjective] Muammar Gaddafi divulgou uma declaração dizendo que a Suíça não deveria existir. Eles também pediram aos nossos países vizinhos para se juntarem a essa declaração. Essa declaração é provavelmente o resultado de um dos filhos de Gaddafi ter sido preso pela polícia suíça."
 LibyaFamily.74.a: "Temos o direito de existir!"
 LibyaCivilWar.1.t: "LNDF se expande na Líbia"
 LibyaCivilWar.1.d: "O LNDF ([socialism_L]) é um grupo de oposição sediado nos EUA. Até agora, atuava principalmente nos Estados Unidos. No entanto, desde o início dos protestos contra o governo de Kadafi, encontrou muito mais apoiadores na própria Líbia. Cada vez mais líbios simpatizam com sua causa e desejam que os Estados Unidos intervenham na Líbia contra Kadafi."
 LibyaCivilWar.1.a: "A América não tem nada a fazer aqui"
 LibyaCivilWar.2.t: "Infiltração comunista"
 LibyaCivilWar.2.d: "O [communist_state_L] deixou de existir desde que tanto o Reino da Líbia quanto a Líbia de Kadafi reprimiram o partido. O marxismo na Líbia tem raízes na Itália, para onde muitos comunistas se mudaram no exílio durante as repressões, organizando o partido como sociedades secretas. Com Kadafi perdendo o controle do país, algumas dessas sociedades começaram a atuar de forma mais aberta, fazendo campanha pela implantação do marxismo na Líbia."
 LibyaCivilWar.2.a: "Devemos purgar todos os doentes que falam de comunismo e ateísmo"
 LibyaCivilWar.3.t: "Soldados desertam para extremistas"
 LibyaCivilWar.3.d: "Sentindo o poder do governo diminuindo, muitos de nossos soldados decidiram desertar para o extremista [Caliphate_L]. O grupo vem aumentando suas atividades insurgentes desde que os protestos contra Gaddafi começaram."
 LibyaCivilWar.3.a: "Traidores!"
 LibyaCivilWar.4.t: "NFSL pede unidade entre os rebeldes"
 LibyaCivilWar.4.d: "O [Neutral_conservatism_L] apelou à unidade entre os manifestantes e rebeldes contra Gaddafi. Eles declararam que todos os partidos da oposição devem se juntar à Conferência Nacional para a Oposição Líbia liderada por eles para maximizar o potencial na luta contra Gaddafi. Vários partidos e organizações menores já anunciaram que trabalharão juntos com a NFSL."
 LibyaCivilWar.4.a: "Juntar grãos de areia não cria uma rocha!"
 LibyaCivilWar.5.t: "Baathistas pedem democracia"
 LibyaCivilWar.5.d: "Em um movimento surpreendente, o [Nat_Fascism_L] exigiu publicamente eleições livres e justas na Líbia. Não temos certeza se isso é apenas um golpe publicitário ou se eles realmente abandonaram seu caminho de Baathismo extremo. De qualquer forma, isso lhes deu bastante apoio."
 LibyaCivilWar.5.a: "Eles estão mentindo!"
 LibyaCivilWar.6.t: "Exército ignora manifestantes"
 LibyaCivilWar.6.d: "Em uma grande cidade da Líbia, o Exército Líbio recebeu ordens para dispersar os manifestantes. O comandante da unidade local recusou e permitiu que os protestos continuassem, até mesmo protegendo os manifestantes do Corpo da Guarda Revolucionária. Parece que as divisões que criamos entre o exército regular e o RGC estão começando a aparecer."
 LibyaCivilWar.6.a: "Eles devem fazer o que lhes é dito!"
 LibyaCivilWar.7.t: "Corpo da Guarda Revolucionária ignora manifestantes"
 LibyaCivilWar.7.d: "Em uma grande cidade na Líbia, o Corpo da Guarda Revolucionária recebeu ordens para dispersar os manifestantes. O comandante da unidade local recusou e permitiu que os protestos continuassem, até mesmo protegendo os manifestantes das unidades regulares do Exército Líbio. Parece que as divisões que criamos entre o exército regular e o RGC estão começando a aparecer."
 LibyaCivilWar.7.a: "Eles devem fazer o que lhes é dito!"
 LibyaCivilWar.8.t: "Família Real Faz Campanha Contra Gaddafi"
 LibyaCivilWar.8.d: "A Família Real Líbia no exílio começou a fazer campanha e a coletar fundos contra Gaddafi. Eles têm viajado pela Europa, se reunido com políticos, pedindo que a OTAN intervenha no país para garantir a segurança dos manifestantes. Muitos manifestantes foram vistos agitando bandeiras do antigo Reino da Líbia e carregando retratos do Rei Idris I."
 LibyaCivilWar.8.a: "Eles não passam de marionetes do Ocidente!"
 LibyaCivilWar.9.t: "Ministro do Governo demite-se"
 LibyaCivilWar.9.d: "Em protesto contra a forma como o governo está lidando com as manifestações, um de nossos ministros renunciou e decidiu se juntar aos rebeldes."
 LibyaCivilWar.9.a: "O quê?"
 LibyaCivilWar.10.t: "Embaixador no exterior deserta"
 LibyaCivilWar.10.d: "Um de nossos embaixadores em um país estrangeiro renunciou e desertou para o país anfitrião. Com ele, levou alguns documentos e segredos fundamentais do governo."
 LibyaCivilWar.10.a: "Os textos sagrados!"
 LibyaCivilWar.11.t: "Unidade militar deserta"
 LibyaCivilWar.11.d: "Uma de nossas unidades militares desertou e se juntou ao lado dos manifestantes. O comandante da unidade disse que não machucará seus compatriotas líbios."
 LibyaCivilWar.11.a: "Covardes!"
 LibyaCivilWar.12.t: "Depósito militar saqueado"
 LibyaCivilWar.12.d: "Os manifestantes invadiram um depósito de armas militares com a ajuda de unidades do exército simpatizantes e roubaram uma grande quantidade de armas."
 LibyaCivilWar.12.a: "Aquelas eram para os meus soldados!"
 LibyaCivilWar.13.t: "Pilotos desertam para Malta"
 LibyaCivilWar.13.d: "Vários pilotos líbios decolaram em seus jatos e voaram para Malta, em busca de asilo. Eles se recusaram a bombardear alvos civis por ordem do governo e decidiram deixar o país."
 LibyaCivilWar.13.a: "Podemos recuperar os jatos?"
 LibyaCivilWar.14.t: "Marinheiros afundam navio"
 LibyaCivilWar.14.d: "A tripulação de um de nossos navios de guerra decidiu afundar a embarcação em que servia. Recusando-se a usar suas armas contra os manifestantes, eles conduziram a embarcação até uma costa próxima e a carregaram com explosivos. Depois que a embarcação virou uma carcaça em chamas, anunciaram seu apoio aos manifestantes."
 LibyaCivilWar.14.a: "Essas coisas são caras!"
 LibyaFocusNews.1.t: "Chefe de Estado líbio assassinado"
 LibyaFocusNews.1.coup.d: "Notícias dramáticas surgiram hoje da Líbia: o líder do país foi assassinado pelo radical [LBA.Caliphate_L]. O comboio do líder foi atacado no deserto líbio em uma emboscada dos islamistas. Após o assassinato bem-sucedido, combatentes do grupo ocuparam rapidamente prédios-chave do governo em Trípoli e Benghazi. Sem um líder claro, o regime existente não conseguiu organizar nenhuma resistência. O Emir do [LBA.Caliphate_L], [LBA.GetLeader], declarou-se governante do país. Isso sem dúvida trará mais instabilidade à região."
 LibyaFocusNews.1.civilwar.d: "Notícias dramáticas surgiram hoje da Líbia: o líder do país foi assassinado pelo radical [LBA.Caliphate_L]. O comboio do líder foi atacado no deserto líbio em uma emboscada dos islamistas. Após o assassinato bem-sucedido, combatentes do grupo ocuparam rapidamente prédios-chave do governo em Trípoli e Benghazi. No entanto, os apoiadores do antigo regime conseguiram montar rapidamente uma contraofensiva para combater o golpe. O Emir do [LBA.Caliphate_L], [LBA.GetLeader], declarou-se governante do país e afirmou que, com a ajuda de Deus, os fiéis líbios sairão vitoriosos. Se os islamistas vencerem, isso sem dúvida trará mais instabilidade à região."
 LibyaFocusNews.1.a: "Interessante."
 LibyaFocusNews.2.t: "O clero assume o controle de [FROM.GetNameDef]"
 LibyaFocusNews.2.d: "O governo [FROM.GetAdjective] anunciou hoje uma mudança radical na estrutura de poder existente no país. Citando a necessidade de uma presença mais estável e unificadora, o cargo de [FROM.GetAdjective] Grande Mufti foi elevado como a 'Suprema Autoridade Moral e Social' no país. Em essência, isso torna o Grande Mufti altamente influente na política do país, semelhante ao do Aiatolá do Irã. Algumas pessoas estão preocupadas com essa mudança, pois suspeita-se que o atual Mufti, [LBA.GetLeader], nutre algumas simpatias por elementos mais radicais do islamismo."
 LibyaFocusNews.2.a: "Interessante."
 LibyaFocusNews.3.t: "[FROM.GetNameDef] anunciado"
 LibyaFocusNews.3.d: "O líder da Líbia, [FROM.GetLeader], anunciou hoje a criação de [FROM.GetNameDef]. Motivado pela insurgência islamista existente no Sahel e no Saara, [FROM.GetLeader] planeja unir as várias facções de lá e 'trazer paz aos muçulmanos que o Ocidente e os americanos marginalizaram'. Este é um sinal claro para os países da região de que [FROM.GetNameDef] não está do lado deles."
 LibyaFocusNews.3.a: "Interessante."
 LibyaFocusNews.4.t: "[FROM.GetNameDef] abraça a reforma"
 LibyaFocusNews.4.d: "O [FROM.GetAdjective] chefe de estado [FROM.GetLeader] anunciou planos para reduzir o poder dos Comitês Revolucionários no país. Os Comitês Revolucionários foram criados como uma autoridade para impedir a disseminação de ideais revolucionários depois que Muammar Gaddafi assumiu o poder no país. Na prática, os Comitês controlaram os pseudodemocráticos Congressos Populares que, em teoria, deveriam governar o país. Os Comitês agora foram marginalizados do processo político, permitindo que os Congressos Populares operem com mais liberdade. Essa mudança moverá [FROM.GetNameDef] em direção a uma sociedade mais democrática."
 LibyaFocusNews.4.a: "Interessante."
 LibyaFocusNews.5.t: "[FROM.GetLeader] aperta o controle sobre [FROM.GetNameDef]"
 LibyaFocusNews.5.d: "O [FROM.GetAdjective] chefe de estado [FROM.GetLeader] anunciou planos para reformar o sistema político do país. Afirmando que os Congressos Populares existentes foram infiltrados por agentes estrangeiros, foi tomada a decisão de fechá-los. Os Comitês Revolucionários responsáveis ​​por impedir a disseminação de ideias revolucionárias no país serão responsáveis ​​por 'triar e verificar' todos os membros atuais e futuros dos Congressos até que o '[FROM.GetAdjective] espaço político tenha se tornado seguro para os cidadãos'. Prevê-se que essa mudança seja de fato permanente, e quaisquer vestígios restantes de democracia estão sendo eliminados de [FROM.GetNameDef]."
 LibyaFocusNews.5.a: "Interessante."
 LibyaFocusNews.6.t: "[FROM.GetNameDef] promete proteger as minorias do Sahel"
 LibyaFocusNews.6.d: "Em uma coletiva de imprensa ontem, o líder [FROM.GetAdjective] [FROM.GetLeader] prometeu que [FROM.GetNameDef] fará sua parte para garantir que as minorias regionais no Saara e no Sahel sejam protegidas. Falando principalmente sobre os tuaregues e toubou, [FROM.GetLeader] enfatizou que a instabilidade contínua e as políticas de segregação por países da região pressionariam [FROM.GetNameDef] a tomar medidas contra os ditos países."
 LibyaFocusNews.6.a: "Interessante."
 LibyaFocusNews.7.t: "[FROM.GetNameDef] se junta à Guerra Contra o Terror"
 LibyaFocusNews.7.d: "O governo [FROM.GetAdjective] anunciou hoje que se juntará a [USA.GetNameDef] em sua guerra global contra o terrorismo. Junto com seus parceiros europeus, [FROM.GetNameDef] organizará uma luta contra o islamismo no Saara e no Sahel."
 LibyaFocusNews.7.a: "Interessante."
 LibyaFocusNews.8.t: "Anunciados os Acordos de Casablanca"
 LibyaFocusNews.8.d: "O governo [FROM.GetAdjective] anunciou uma conferência de paz sobre o status do Saara Ocidental. Marrocos, Argélia, Mauritânia e representantes da Frente POLISARIO foram todos convidados para a reunião. [FROM.GetLeader] tem uma meta ambiciosa de tentar encontrar uma solução para o conflito congelado."
 LibyaFocusNews.8.a: "Interessante."
 LibyaFocusNews.9.t: "[FROM.GetNameDef] Anula decisão do TIJ"
 LibyaFocusNews.9.d: "Após o fim da Guerra da Toyota entre a Líbia e o Chade em 1987, a Corte Internacional de Justiça decidiu que a área disputada da Faixa de Aouzou entre os dois países era legalmente chadiana. Após a decisão, a Líbia rapidamente se retirou da área. Agora, o líder [FROM.GetAdjective] [FROM.GetLeader] anulou a decisão, afirmando que [FROM.GetNameDef] apenas seguiu a decisão sob ameaça e pressão internacional. Eles agora reivindicaram o território mais uma vez."
 LibyaFocusNews.9.a: "Interessante."
 LibyaFocusNews.10.t: "[CHA.GetNameDef] Cede Faixa de Aouzou"
 LibyaFocusNews.10.d: "Ontem, o governo [LBA.GetAdjective] enviou um ultimato para [CHA.GetNameDef]; Retirar todas as forças da Faixa de Aouzou e transferir oficialmente o território para [LBA.GetNameDef], ou enfrentar uma intervenção militar. No que era essencialmente uma situação sem esperança, o governo [CHA.GetAdjective] concordou em dar o território para [LBA.GetNameDef]."
 LibyaFocusNews.10.a: "Interessante."
 LibyaFocusNews.11.t: "[CHA.GetNameDef] Desafia [LBA.GetAdjective] Demandas"
 LibyaFocusNews.11.d: "Ontem, o governo [LBA.GetAdjective] enviou um ultimato para [CHA.GetNameDef]; Retirar todas as forças da Faixa de Aouzou e transferir oficialmente o território para [LBA.GetNameDef], ou enfrentar uma intervenção militar. O governo [CHA.GetAdjective] recusou qualquer uma das exigências, afirmando que eles seguem as fronteiras internacionais reconhecidas pela comunidade internacional. É provável que isso leve a um conflito entre as duas nações. No entanto, [CHA.GetName] derrotou os [LBA.GetAdjective]s antes, talvez eles possam fazer isso novamente."
 LibyaFocusNews.11.a: "Interessante."
 LibyaFocusNews.12.t: "[FROM.GetLeader] Promete destruir o colonialismo"
 LibyaFocusNews.12.d: "Ontem, na assembleia geral da ONU, o líder [FROM.GetAdjective] [FROM.GetLeader] anunciou que criaria um \"Eixo do Bem\" internacional para lutar contra o colonialismo americano e sionista. [FROM.GetLeader] convidou todos os seus companheiros anticolonialistas para se juntarem à sua nova aliança, e eles prometeram que o Ocidente pagaria por sua história colonialista."
 LibyaFocusNews.12.a: "Interessante."
 LibyaFocusNews.13.t: "[FROM.GetNameDef] Ocupa Socotra"
 LibyaFocusNews.13.d: "Em um movimento surpresa de hostilidade, [FROM.GetAdjective] forças especiais discretamente desembarcaram e ocuparam instalações importantes na ilha de Socotra, tirando-a do controle de [YEM.GetAdjective]. [YEM.GetNameDef] já condenou esse ato de violação de sua soberania, mas ainda não se sabe qual será sua resposta."
 LibyaFocusNews.13.a: "Interessante."
 LibyaFocusNews.14.t: "Guerra Civil na Líbia"
 LibyaFocusNews.14.d: "O que começou como um protesto contra o governo de [LBA.GetLeader] se transformou em um conflito armado em larga escala. Os protestos começaram na parte leste do país, com pessoas exigindo mais liberdade política e melhores condições de vida. Embora a Líbia tenha o maior PIB per capita da África e um dos melhores IDHs do mundo, um terço dos líbios ainda vive abaixo da linha da pobreza e os lucros do petróleo das vastas reservas do país vão principalmente para o bolso do regime. Os protestos se tornaram violentos quando [LBA.GetLeader] ordenou que os militares interviessem, e logo o povo estava em armas. Os rebeldes formaram [LRB.GetNameDef], que servirá como autoridade de transição até que [LBA.GetLeader] deponha as armas e se renda."
 LibyaFocusNews.14.a: "Interessante."
 LibyaFocusNews.15.t: "Fim da Guerra Civil Líbia"
 LibyaFocusNews.15.LBA.d: "A guerra civil na Líbia chegou ao fim. Apesar da forte resistência dos rebeldes, [FROM.GetLeader] conseguiu retomar o controle do país. É provável que isso leve a mais repressões na sociedade [LBA.GetAdjective]."
 LibyaFocusNews.15.LRB.d: "A guerra civil na Líbia chegou ao fim. Os rebeldes conseguiram derrotar as forças do regime, e [FROM.GetLeader] já delineou planos sobre como o país deve seguir adiante. Isso virou uma nova página para [FROM.GetNameDef]."
 LibyaFocusNews.15.a: "Interessante."
 LibyaFocusNews.16.t: "Os Acordos de Casablanca Chegam a uma Conclusão"
 LibyaFocusNews.16.annex.d: "Quando [LBA.GetLeader] anunciou que realizaria uma reunião internacional para resolver o status do Saara Ocidental, muitos ficaram céticos. No entanto, parece que os acordos chegaram a algum tipo de conclusão. Em sua declaração, apelidada de [GetYear] Acordo de Casablanca, eles delineiam o plano de integrar oficialmente o Saara Ocidental ao Marrocos. Depois de estudar documentos históricos, os acordos chegaram à conclusão de que legalmente o Saara Ocidental é território marroquino. Se [SHA.GetNameDef] aceitará ou não essa decisão, é incerto neste momento."
 LibyaFocusNews.16.autonomy.d: "Quando [LBA.GetLeader] anunciou que realizaria uma reunião internacional para resolver o status do Saara Ocidental, muitos ficaram céticos. No entanto, parece que os acordos chegaram a algum tipo de conclusão. Em sua declaração, apelidada de [GetYear] Acordo de Casablanca, eles descrevem o plano de anexar o Saara Ocidental ao Marrocos, permitindo que os saarauís ainda mantenham autonomia significativa. Há um acordo claro de que o Saara Ocidental terá permissão para ter seu controle militar e direto de sua política interna, enquanto o Marrocos será responsável pelas relações internacionais da região, incluindo a defesa contra ameaças externas."
 LibyaFocusNews.16.independence.d: "Quando [LBA.GetLeader] anunciou que realizaria uma reunião internacional para resolver o status do Saara Ocidental, muitos ficaram céticos. No entanto, parece que os acordos chegaram a algum tipo de conclusão. Em sua declaração, apelidada de [GetYear] Acordo de Casablanca, os signatários descrevem um claro apoio à independência total do Saara Ocidental. Os Acordos claramente viram que o desejo do Saara Ocidental por independência anula quaisquer registros históricos possíveis que legalmente tornariam a área marroquina. Se [MOR.GetNameDef] aceitará ou não essa decisão, é incerto neste momento."
 LibyaFocusNews.16.mauritania.d: "Quando [LBA.GetLeader] anunciou que realizaria uma reunião internacional para resolver o status do Saara Ocidental, muitos ficaram céticos. No entanto, parece que os acordos chegaram a algum tipo de conclusão. Em sua declaração, apelidada de [GetYear] Acordo de Casablanca, eles declaram que o Saara Ocidental é legalmente mauritano. Depois de estudar documentos históricos e acordos diplomáticos anteriores, do ponto de vista deles, fica claro que a Mauritânia deve manter o território. Se [MOR.GetNameDef] e [SHA.GetNameDef] aceitarão ou não essa decisão, é incerto neste momento."
 LibyaFocusNews.16.a: "Interessante."
 LibyaFocusNews.17.t: "Os Acordos de Casablanca Não Chegam a uma Conclusão"
 LibyaFocusNews.17.d: "Quando [LBA.GetLeader] anunciou que realizaria uma reunião internacional para resolver o status do Saara Ocidental, muitos ficaram céticos. Esse ceticismo foi bem colocado, depois de um ano de negociações, nenhum resultado tangível foi alcançado. Frustrado com o processo, [LBA.GetLeader] pediu que os acordos fossem encerrados. Parece que o Saara Ocidental continuará sendo uma área contestada mesmo no futuro."
 LibyaFocusNews.17.a: "Interessante."
 LibyaFocusNews.18.t: "Os acordos de Casablanca desmoronam"
 LibyaFocusNews.18.d: "Quando [LBA.GetLeader] anunciou que realizaria uma reunião internacional para resolver o status do Saara Ocidental, muitos ficaram céticos. Esse ceticismo foi bem colocado, pois sérias divergências entre os países participantes forçaram o fim antecipado dos acordos. Várias delegações já abandonaram os acordos em conteúdo, pois sentiram que suas necessidades não estavam sendo ouvidas. Isso certamente foi um constrangimento para [LBA.GetLeader]."
 LibyaFocusNews.18.a: "Interessante."
 LibyaFocusNews.19.t: "[ENG.GetAdjective] Intervenção na Líbia"
 LibyaFocusNews.19.d: "Após a tentativa de assassinato da família real líbia em [ENG.GetNameDef], o governo [ENG.GetAdjective] exigiu compensação imediata e pedido de desculpas do governo [LBA.GetAdjective]. [ENG.GetNameDef] descobriu que [LBA.GetNameDef] tinha fortes ligações com o ataque terrorista. Como nenhum pedido de desculpas ou compensação chegou, [ENG.GetNameDef] considerou isso um ataque contra a nação. Ainda carregando as cicatrizes do atentado de Lockerbie, [ENG.GetNameDef] não teve escolha a não ser derrubar o governo [LBA.GetAdjective] para impedir novos ataques."
 LibyaFocusNews.19.a: "Interessante."
 LBA_mining_in_aouzou: "Mineração em Aouzou"
 LBA_mining_in_aouzou_desc: "Com a faixa de Aouzou segura, agora podemos começar a extrair esse doce urânio do solo."
 LBA_mining_in_aouzou_tt_1: "Se possuirmos §Y$STATE_580$§!:\n"
 LBA_mining_in_aouzou_tt_2: "Se [CHA.GetNameWithFlag] concordou em minerar em conjunto:\n"
 LBA_gmmr_jaghbub: "GMMR Jaghbub"
 LBA_gmmr_jaghbub_desc: "No leste do país, bem na fronteira com o Egito, ao sul de Tobruk, há uma pequena cidade de Jaghbub. A área é um oásis natural situado no topo de um aquífero. Ao construir um poço aqui, podemos trazer água doce para Tobruk."
 aozou_strip_occupation_decisions: "Ocupação na Faixa de Aouzou"
 aozou_strip_occupation_decisions_desc: "Sendo a Faixa de Aouzou uma região contestada entre nós e os nossos vizinhos, o caos que estão a viver poderá permitir-nos assumir o controlo da região."
 generic_occupy_aouzou_strip: "Ocupe a Faixa de Aouzou"
 generic_occupy_aouzou_strip_desc: "O status atual de [580.owner.GetNameDef] os torna incapazes de estender efetivamente o controle sobre [580.GetName]. Devemos enviar um pequeno contingente de tropas para proteger a área. É improvável que [580.owner.GetName] resista."
 generic_occupy_aouzou_strip_tt: "§R[580.owner.GetNameDef] pode declarar guerra contra nós!§!"
 LibyaFocus.104.t: "[FROM.GetNameDef] Ocupa o [580.GetName]"
 LibyaFocus.104.d: "Com nossas forças de segurança ocupadas em outros lugares, os desertos do [580.GetName] estão basicamente sem patrulha. Aproveitando esse vácuo de poder, [FROM.GetNameDef] enviou um pequeno contingente de tropas para montar uma pequena base na cidade de Aozou. Com o [FROM.GetAdjective] voando no centro da cidade de Aouzou, [FROM.GetNameDef] reivindicou toda a área para si."
 LibyaFocus.104.a: "Não há nada que possamos fazer"
 LibyaFocus.104.b: "Eles vão pagar por isso!"
 LBA_start_building_reactor_threat: "[LBA.GetAdjective]Programa Nuclear"
 LBA_support_south_sudan: "Suporte [SSU.GetName]"
 LBA_support_south_sudan_desc: "Antes de Omar al-Bashir assumir o poder no Sudão, apoiámos o ELPS no sul. Al-Bashir, embora bastante amigável conosco, não é o melhor companheiro de cama. A sua reputação internacional é péssima e é apenas uma questão de tempo até que ele perca o poder. Talvez devêssemos voltar a oferecer suporte a [SSU.GetNameDef]?"
 LBA_send_mercenaries_tt_3: "Se tivermos concluído o foco §Y$LBA_support_south_sudan$§!:\n"
 LibyaFocus.105.t: "Cientista Nuclear [FROM.GetAdjective] Preso"
 LibyaFocus.105.d: "Como parte de seu programa de desarmamento nuclear, as autoridades [FROM.GetAdjective]s divulgaram documentos indicando um cidadão [ROOT.GetAdjective], Friedrich Tinner, como envolvido em seu programa nuclear. Tinner estudou e trabalhou sob o principal cientista nuclear do Paquistão, Abdul Qadeer Khan, antes de ser convidado por Muammar Kadafi para liderar o programa nuclear líbio na década de 1980. Tinner, porém, não conseguiu muito sucesso devido à falta de conhecimento acadêmico e técnico da Líbia, mesmo com a ajuda de Khan.\n\nTinner foi agora preso por nós e aguarda seu destino sob custódia. O que deve ser feito com ele?"
 LibyaFocus.105.a: "Trancafiá-lo"
 LibyaFocus.105.b: "Um cientista nuclear, você diz?"
 LibyaFocus.105.c: "O homem é inocente, deixe-o ir"
 LibyaFocus.106.t: "[FROM.GetNameDef] Prende Tinner"
 LibyaFocus.106.d: "As autoridades [FROM.GetAdjective]s decidiram encarcerar Friedrich Tinner por seu papel no contrabando de materiais para armas nucleares para a Líbia e por auxiliar um país sob sanções internacionais. É improvável que o vejamos novamente."
 LibyaFocus.106.a: "Precisamos de um substituto já"
 LibyaFocus.107.t: "[FROM.GetNameDef] Emprega Tinner"
 LibyaFocus.107.d: "Para nossa surpresa, parece que [FROM.GetNameDef] decidiu empregar Friedrich Tinner em vez de encarcerá-lo. Parece que valorizaram demais sua especialização em pesquisa nuclear para não aproveitá-la."
 LibyaFocus.107.a: "Aquelas cobras!"
 LibyaFocus.108.t: "O Retorno de Friedrich Tinner"
 LibyaFocus.108.d: "Quando Friedrich Tinner apareceu no aeroporto de Trípoli, ficamos surpresos. Parece que as autoridades [FROM.GetAdjective]s não tinham interesse em mantê-lo preso e ele foi livremente autorizado a deixar o país. Só se pode especular o que as levou a fazer isso."
 LibyaFocus.108.a: "Isso deve ser uma armadilha, certo?"
 sp_libya_gmmr_phase3_project: "Grande Rio Artificial - Oleoduto de Al-Jawf"
 sp_libya_gmmr_phase3_project_desc: "O Grande Rio Artificial, que levaria água a toda a Líbia, nunca foi concluído. O duto também deveria se conectar a Al-Jawf, em Kufra, e agora temos a chance de concluir esse trecho."
 sp_libya_gmmr_phase3_project_reward_al_jawf_agriculture: "Agricultura impulsionada"
 sp_libya_gmmr_phase3_project_reward_al_jawf_agriculture_desc: "Al-Jawf é um dos oásis mais irrigados de todo o Saara. Com a construção da fase III, podemos melhorar a irrigação ali, abrindo mais espaço para outros projetos ou permitindo melhorar a eficiência da produção."
 sp_libya_gmmr_phase3_project_reward_al_jawf_agriculture_option_slot: "Expandir o uso da terra"
 sp_libya_gmmr_phase3_project_reward_al_jawf_agriculture_option_productivity: "Melhorar a produtividade"
 sp_libya_gmmr_phase4_west_project: "Grande Rio Artificial - Duto de Ghadames"
 sp_libya_gmmr_phase4_west_project_desc: "O Grande Rio Artificial, que levaria água a toda a Líbia, nunca foi concluído. Ghadames é uma das maiores cidades do deserto ocidental, perto da fronteira com a Tunísia, e uma das cidades mais antigas da Líbia."
 sp_libya_gmmr_phase4_west_project_reward_tourism: "Com o projeto de construção a todo vapor em Ghadames, o aumento da mão de obra criou um pequeno boom turístico em torno da cidade antiga de Ghadames. A Cidade Velha está em mau estado há algum tempo, e poderíamos usar a receita extra para renová-la. Ou poderíamos usar o dinheiro para investir ainda mais nos negócios da região."
 sp_libya_gmmr_phase4_west_project_reward_tourism_option_infra: "Renovar a Cidade Velha"
 sp_libya_gmmr_phase4_west_project_reward_tourism_option_productivity: "Investir o dinheiro"
 sp_libya_gmmr_phase4_east_project: "Grande Rio Artificial - Duto de Jaghbub"
 sp_libya_gmmr_phase4_east_project_desc: "O Grande Rio Artificial, que levaria água a toda a Líbia, nunca foi concluído. Jaghbub é uma pequena cidade-oásis perto da fronteira com o Egito e, na verdade, está mais próxima da cidade egípcia de Siwa do que de qualquer outro povoado líbio. Para integrar melhor a área à Líbia propriamente dita, devemos estender o duto até lá."
 sp_libya_gmmr_phase4_east_project_reward_treasures: "A cidade de Jaghbub é conhecida principalmente por abrigar o movimento Senussi. No entanto, com o tempo a cidade foi saqueada de muitos de seus artefatos históricos e túmulos de figuras históricas. Uma escavação recente descobriu um raro artefato Senussi, e as autoridades agora se perguntam o que fazer com ele. Colocá-lo em um museu ou vendê-lo para obter lucro rápido?"
 sp_libya_gmmr_phase4_east_project_reward_treasures_option_bonus: "Isso pertence a um museu!"
 sp_libya_gmmr_phase4_east_project_reward_treasures_option_productivity: "Vender essa velharia"
 sp_libya_gmmr_phase5_project: "Grande Rio Artificial - Conectar Leste e Oeste"
 sp_libya_gmmr_phase5_project_desc: "O Grande Rio Artificial, que levaria água a toda a Líbia, nunca foi concluído. As partes ocidental e oriental do duto estão atualmente desconectadas entre si. Poderíamos conectar as redes perto da cidade de Sirte para criar um duto unificado."
 sp_libya_gmmr_phase5_project_reward_investment: "Após a ascensão de Kadafi ao poder, ele passou a investir pesadamente na área de Sirte, pois nasceu a apenas 20 km ao sul da cidade. A cidade cresceu rapidamente, tornando-se uma metrópole com amplos programas públicos e departamentos do governo transferidos de Trípoli para lá. Já que estamos trabalhando na região, pode fazer sentido aproveitar para realizar outras obras públicas. Temos dinheiro suficiente no orçamento para um aeroporto ou um porto marítimo."
 sp_libya_gmmr_phase5_project_reward_investment_option_airport: "Um aeroporto!"
 sp_libya_gmmr_phase5_project_reward_investment_option_naval_base: "Um porto marítimo!"
 sp_libya_reward_improve_tripolitania_opinion: "Tripolitanos aprovam o projeto"
 sp_libya_reward_improve_tripolitania_opinion_desc: "As tribos da Cirenaica ficaram impressionadas com a implantação do nosso projeto em suas terras. Estão surpresas por o governo estar disposto a investir tanto nelas."
 sp_libya_reward_reduce_tripolitania_opinion: "Tripolitanos descontentes com o projeto"
 sp_libya_reward_reduce_tripolitania_opinion_desc: "As tribos da Tripolitânia organizaram um protesto contra nosso projeto atual em suas terras. Afirmam que o governo não tem o direito de usar suas terras para projetos de construção de vaidade."
 sp_libya_reward_improve_cyrenaica_opinion: "Cirenaicos aprovam o projeto"
 sp_libya_reward_improve_cyrenaica_opinion_desc: "As tribos da Cirenaica ficaram impressionadas com a implantação do nosso projeto em suas terras. Estão surpresas por o governo estar disposto a investir tanto nelas."
 sp_libya_reward_reduce_cyrenaica_opinion: "Cirenaicos descontentes com o projeto"
 sp_libya_reward_reduce_cyrenaica_opinion_desc: "As tribos da Cirenaica organizaram um protesto contra nosso projeto atual em suas terras. Afirmam que o governo não tem o direito de usar suas terras para projetos de construção de vaidade."
 sp_libya_reward_improve_fezzan_opinion: "Fezzanis aprovam o projeto"
 sp_libya_reward_improve_fezzan_opinion_desc: "As tribos de Fezzan ficaram impressionadas com a implantação do nosso projeto em suas terras. Estão surpresas por o governo estar disposto a investir tanto nelas."
 sp_libya_reward_reduce_fezzan_opinion: "Fezzanis descontentes com o projeto"
 sp_libya_reward_reduce_fezzan_opinion_desc: "As tribos de Fezzan organizaram um protesto contra nosso projeto atual em suas terras. Afirmam que o governo não tem o direito de usar suas terras para projetos de construção de vaidade."
 Libya_focus: "Árvore de Focos da Líbia"
 LBA_humbled_by_the_un_desc: "O discurso inflamado de Muammar Gaddafi na ONU foi recebido com zombaria, e ele foi vaiado e deixou o pódio. Parece que Gaddafi não é tão carismático quanto pensa."
 libya_develop_oil_fields_with_foreign_aid: "Desenvolver os Campos de Petróleo com Ajuda Estrangeira"
 libya_develop_oil_fields_with_foreign_aid_desc: "Há várias petrolíferas multinacionais que operam globalmente. Elas têm o conhecimento e a tecnologia para extrair petróleo de praticamente qualquer lugar. Precisamos usá-las para expandir a indústria petrolífera da Líbia.\n\n§YEstas decisões podem ser tomadas uma vez por ano§!"
 libya_gaddafi_family_anti_government_protests_tt: "§RO protesto escala para uma guerra civil e devemos escolher nosso lado!§!"
 LBA_first_libyan_civil_war_tension: "Primeira Guerra Civil Líbia"
 libya_tribalism_decentralise_state_tt: "§YDescentralizamos a cada 6 meses!§!"
 libya_tribalism_military_crackdown: "Ordenar uma Repressão Militar na Região"
 libya_tribalism_military_crackdown_desc: "Para conter as revoltas, devemos ordenar que nossos militares façam uma dura repressão a toda atividade de oposição em [FROM.GetName]."
 libya_tribalism_use_military_as_workforce: "Usar os Militares como Mão de Obra na Região"
 libya_tribalism_use_military_as_workforce_desc: "Poderíamos usar nossos militares para ajudar em projetos de construção em [FROM.GetName] a fim de desenvolver a região mais depressa."
 libya_tribalism_use_military_as_security: "Fornecer Segurança Extra aos Campos de Petróleo da Região"
 libya_tribalism_use_military_as_security_desc: "A maioria dos campos de petróleo da Líbia tem algum tipo de força de segurança privada. Poderíamos usar nossos militares para fornecer segurança adicional em [FROM.GetName]. Isso deixaria mais recursos disponíveis para a extração propriamente dita."
 libya_tribalism_demobilise_soldiers: "Desmobilizar Soldados na Região"
 libya_tribalism_demobilise_soldiers_desc: "Muitos dos soldados do nosso exército são de [FROM.GetName]. Talvez seja hora de dispensar alguns deles do serviço militar e deixá-los voltar para casa. Isso nos ajudaria a construir confiança com a região local."
 libya_tribalism_end_tribalism: "Acabar com o Tribalismo"
 libya_tribalism_end_tribalism_desc: "Com a lealdade das tribos garantida, podemos finalmente deixar de nos preocupar com uma possível revolta e o esfacelamento da Líbia."
 libya_tribalism_end_tribalism_trp_tt: "Lealdade de [TRP.GetNameWithFlag] > 99% (Atual: [?tripolitania_loyalty|%0])\n"
 libya_tribalism_end_tribalism_cyr_tt: "Lealdade de [CYR.GetNameWithFlag] > 99% (Atual: [?cyrenaica_loyalty|%0])\n"
 libya_tribalism_end_tribalism_fez_tt: "Lealdade de [FEZ.GetNameWithFlag] > 99% (Atual: [?fezzan_loyalty|%0])\n"
 libya_demand_tuareg_territory: "Exigir as Terras Tuaregues de [FROM.GetNameDef]"
 libya_demand_tuareg_territory_desc: "[FROM.GetNameDef] atualmente detém terras habitadas pelos tuaregues. Os tuaregues fazem parte da nação líbia e devemos libertá-los."
 libya_aftermath_of_civil_war: "Consequências da Guerra Civil"
 libya_aftermath_of_civil_war_desc: "\n£LBA_desctext_aftermath_of_civil_war \n\n\n\nCom a guerra civil encerrada, é hora de construir uma nova Líbia. No entanto, o vácuo de poder deixado por Gaddafi criou um equilíbrio de poder instável no país. Jihadistas e islamistas da Irmandade Muçulmana querem impor a Sharia ao país, o recém-formado Exército Nacional Líbio tem muitos comandantes militares ambiciosos e ainda há muitos apoiadores de Gaddafi no país. Se não lidarmos com as facções com equilíbrio ou não conseguirmos eliminá-las por completo, é provável que a Líbia se estilhace mais uma vez."
 libya_integrate_militias_mission: "Integração das Milícias"
 libya_integrate_militias_mission_desc: "Integrar as diversas milícias levará tempo devido a ideologias, lealdades e cadeias de comando conflitantes. No entanto, a cada milícia integrada, aumentamos o grau de controle do nosso governo."
 libya_integrate_militias_mission_create_LNA_tt: "§Y$LBA.Nat_Autocracy_rebels$§! passarão a ser conhecidos como §Y$LBA.Nat_Autocracy_LNA$§!\n"
 libya_attack_ansar_al_sharia_in_benghazi: "Cortar a Cabeça da Serpente em §Y$STATE_395$§!"
 libya_attack_ansar_al_sharia_in_benghazi_desc: "[ASL.GetNameDef] se entrincheirou em $STATE_395$. A cidade é a segunda maior da Líbia e serve de principal reduto da facção. Desalojá-los da cidade será difícil, mas devemos eliminar esta ameaça."
 libya_attack_ansar_al_sharia_in_derna: "Limpar §Y$STATE_396$§!"
 libya_attack_ansar_al_sharia_in_derna_desc: "§Y$STATE_396$§! é uma importante fonte de mão de obra para [ASL.GetNameDef]. Segundo os EUA, a maioria dos combatentes islâmicos líbios no exterior vem desta cidade. Devemos limpá-la para ter um bom ponto de partida contra $STATE_395$."
 libya_attack_ansar_al_sharia_in_derna_tt: "Nossa chance de sucesso depende da §YLealdade de [CYR.GetNameWithFlag]§!. Quanto melhores forem nossas relações com os habitantes locais, maior a probabilidade de limparmos $VICTORY_POINTS_1204$\n"
 libya_attack_ansar_al_sharia_in_ajdabiya: "Tomar o Controle dos Campos de Petróleo de Wahat"
 libya_attack_ansar_al_sharia_in_ajdabiya_desc: "Com [ASL.GetNameDef] controlando $VICTORY_POINTS_1127$, o petróleo dos campos de Wahat não tem para onde ir. Devemos conduzir uma operação militar para retomar a cidade portuária. Isso também abrirá o caminho para $STATE_395$."
 libya_attack_ansar_al_sharia_in_ajdabiya_tt: "Nossa chance de sucesso depende da §YLealdade de [CYR.GetNameWithFlag]§!. Quanto melhores forem nossas relações com os habitantes locais, maior a probabilidade de limparmos $VICTORY_POINTS_1127$\n"
 libya_attack_ansar_al_sharia_in_kufra: "Proteger §Y$VICTORY_POINTS_1057$§!"
 libya_attack_ansar_al_sharia_in_kufra_desc: "A cidade de §Y$VICTORY_POINTS_1057$§! é o único grande povoado em $STATE_1100$. Devemos enviar soldados extras para lá para manter a cidade segura. Talvez, se o único lugar que restar para os islamistas se esconderem for o deserto, eles acabem se dispersando."
 libya_attack_ansar_al_sharia_in_sirte: "Avançar por §Y$STATE_919$§!"
 libya_attack_ansar_al_sharia_in_sirte_desc: "Com $STATE_919$ sob controle de [ASL.GetName], nossa capacidade de nos deslocar entre o oeste e o leste da Líbia fica severamente limitada. Devemos expulsar os islamistas da região para ligar nossas forças novamente."
 libya_attack_ansar_al_sharia_in_sirte_tooltip: "Como §Y[ASL.GetNameDef]§! ainda controla §Y$VICTORY_POINTS_6295$§!, receberemos uma §Rpenalidade de -50%§! em quaisquer ataques contra §Y$STATE_919$§!!"
 libya_attack_ansar_al_sharia_in_sabha: "Retomar §Y$VICTORY_POINTS_6295$§!"
 libya_attack_ansar_al_sharia_in_sabha_desc: "Um ataque terrestre contra $VICTORY_POINTS_6295$ seria avistado de longe pelos islamistas, então devemos conduzir um ataque surpresa. Nossas forças especiais, junto com nossa força aérea, pousarão diretamente no aeródromo e retomarão o controle dele."
 libya_attack_ansar_al_sharia_in_sabha_tt: "Nossa chance de sucesso depende da §YLealdade de [FEZ.GetNameWithFlag]§!. Quanto melhores forem nossas relações com os habitantes locais, maior a probabilidade de limparmos $VICTORY_POINTS_6295$. §RSe o ataque falhar, nossa força aérea bombardeará o aeródromo, tornando-o inutilizável, mas ao menos forçará os islamistas a recuar§!.\n"
 libya_operation_dignity_mission: "Haftar Lança a Operação Dignidade"
 libya_operation_dignity_mission_desc: "Khalifa Haftar e outros atores poderosos do Exército Nacional Líbio estão frustrados com a inação do nosso governo contra os islamistas em nosso país. Se não desalojarmos o Ansar al-Sharia da Líbia, Haftar tomará as rédeas da situação..."
 libya_operation_dignity_mission_tooltip: "§Y[LBA_khalifa_haftar.GetName]§! mobilizará soldados do §Y$LBA.Nat_Autocracy_LNA$§! leais a ele e denunciará nosso governo para destruir os islamistas por conta própria."
 LBA_green_resistance_1: "Resistência Verde"
 LBA_green_resistance_1_desc: "The Green Resistance, or Gaddafi loyalism, is still strong in Libya. Utilised by the current autocrat, the Green Resistance continues to help them bolster their forces.\n\n§RThis national spirit will be removed if we are not ruled by [Western_Autocracy_L], [reactionary_L], [Autocracy_L], [Nat_Populism_L] or [Nat_Fascism_L]§!"
 LBA_green_resistance_2: "Lealistas de Gaddafi"
 LBA_green_resistance_2_desc: "The government has employed Gaddafi loyalists in their administration and military instead of purging them, in the hopes that their loyalty will be a worthy paycheck for them.\n\n§RThis national spirit will be removed if we are not ruled by [Western_Autocracy_L], [reactionary_L], [Autocracy_L], [Nat_Populism_L] or [Nat_Fascism_L]§!"
 LBA_green_resistance_3: "Remanescentes do Antigo Regime"
 LBA_green_resistance_3_desc: "The Libyan government is taking full advantage of the Green Resistance, or Gaddafi loyalism, as it starts building Libya in their own image.\n\n§RThis national spirit will be removed if we are not ruled by [Western_Autocracy_L], [reactionary_L], [Autocracy_L], [Nat_Populism_L] or [Nat_Fascism_L]§!"
 LBA_moderated_quran_and_sunnah: "Alcorão e Sunna Moderados"
 LBA_moderated_quran_and_sunnah_desc: "The ruling establishment has decided to censor and moderate some of the more extreme views that people spread of the Quran and Sunnah, hoping to reduce the presence of more radical views.\n\n§RThis national spirit will be removed if we are not ruled by [Western_Autocracy_L], [reactionary_L], [Autocracy_L], [Nat_Populism_L] or [Nat_Fascism_L]§!"
 LBA_loyalist_purges: "Expurgos dos Leais"
 LBA_loyalist_purges_desc: "Leais a Kadafi e ex-apoiadores foram expurgados da administração líbia. O povo recebeu a promessa de mudança e a recebe bem."
 LBA_ramadan_asswehly_remembrance: "Memória de Ramadan Asswehly"
 LBA_ramadan_asswehly_remembrance_desc: "Ramadan Asswehly foi um dos membros fundadores da República Tripolitana. À medida que a Líbia se volta para a democracia, ela lembra seus heróis.\n\n§REste espírito nacional será removido se não tivermos eleições!§!"
 LBA_tribal_assembly_created: "Conselho Tribal"
 LBA_tribal_assembly_created_desc: "A Líbia criou um Conselho Tribal, cujas responsabilidades incluem resolver conflitos entre tribos e fiscalizar o governo quanto a possíveis abusos ou maus-tratos.\n\n§REste espírito nacional será removido se não tivermos eleições!§!"
 LBA_tripolitania_elite_soldiers: "Forças de Elite Tripolitanas"
 LBA_tripolitania_elite_soldiers_desc: "Tripolitanos estão sendo recrutados em massa para o novo exército líbio.\n\n§REste espírito nacional será removido se [TRP.GetNameWithFlag] existir§!"
 LBA_cyrenaican_oil_expertise: "Especialização Cirenaica em Petróleo"
 LBA_cyrenaican_oil_expertise_desc: "O governo líbio está aproveitando todo o conhecimento sobre perfuração de petróleo que os cirenaicos possuem.\n\n§REste espírito nacional será removido se [CYR.GetNameWithFlag] existir§!"
 LBA_fezzani_desert_expertise: "Caravanas de Suprimento Fezzani"
 LBA_fezzani_desert_expertise_desc: "Aproveitando o conhecimento dos fezzanis sobre viagens no deserto, o exército líbio treina seus soldados para sobreviver com pouca comida ou água.\n\n§REste espírito nacional será removido se [FEZ.GetNameWithFlag] existir§!"
 LBA_tribal_union: "União Tribal"
 LBA_tribal_union_desc: "O governo líbio conseguiu conter as ideias separatistas no país usando as diferenças entre as tribos em seu benefício.\n\n§REste espírito nacional será removido se [TRP.GetNameWithFlag], [CYR.GetNameWithFlag] ou [FEZ.GetNameWithFlag] existir§!"
 LBA_multiple_parties_in_cabinet: "Gabinete Multipartidário"
 LBA_multiple_parties_in_cabinet_desc: "Para reduzir a tensão, o partido governante líbio convidou vários partidos menores para o seu gabinete. Eles esperam que isso reduza a divisão política no país.\n\nEste espírito nacional será removido se não tivermos eleições ou não estivermos em coalizão com outro partido."
 LBA_guaranteed_freedom: "Liberdades Garantidas"
 LBA_guaranteed_freedom_desc: "O novo governo líbio prometeu liberdade a todas as pessoas, independentemente de etnia, raça ou gênero."
 LBA_private_agriculture_encouraged: "Agricultura Privada Incentivada"
 LBA_private_agriculture_encouraged_desc: "O governo está incentivando pequenos agricultores e proprietários de terras a ampliar suas posses e adquirir mais terra."
 LBA_indian_workers: "Trabalhadores Indianos"
 LBA_indian_workers_desc: "Trabalhadores migrantes indianos foram contratados para trabalhar nas fábricas líbias a fim de compensar a baixa população do país.\n\n§REste espírito nacional será removido se [RAJ.GetNameDef] não existir ou estivermos em guerra com eles.§!"
 LBA_swiss_financial_advisors: "Consultores Financeiros Suíços"
 LBA_swiss_financial_advisors_desc: "Consultores financeiros suíços foram contratados para aconselhar o governo sobre como otimizar o crescimento econômico.\n\n§REste espírito nacional será removido se [SWI.GetNameDef] não existir ou estivermos em guerra com eles.§!"
 LBA_french_nuclear_support: "Apoio Nuclear Francês"
 LBA_french_nuclear_support_desc: "Empresas de energia francesas estão ajudando a Líbia no caminho para construir sua própria indústria de energia nuclear.\n\n§REste espírito nacional será removido se [FRA.GetNameDef] não existir ou estivermos em guerra com eles.§!"
 LBA_gaddafist_military: "Militares Kadafistas"
 LBA_gaddafist_military_desc: "O Exército Líbio está cheio de pessoas que antes faziam parte das forças armadas sob Kadafi. O exército pode aproveitar a experiência delas.\n\n§REste espírito nacional será removido se tivermos $no_military$§!"
 LBA_free_officers_movement: "Movimento dos Oficiais Livres"
 LBA_free_officers_movement_desc: "Assim como em 1969, os oficiais do Exército Líbio derrubaram seus governantes corruptos.\n\n§REste espírito nacional será removido se não formos Nacionalistas§!"
 LBA_islamist_crackdown: "Repressão aos Islamistas"
 LBA_islamist_crackdown_desc: "O governo adotou uma postura dura contra qualquer partido ou grupo que fale em Sharia ou supremacia do Islã.\n\n§REste espírito nacional será removido se formos Salafistas ou governados pela [Neutral_Muslim_Brotherhood_L]§!"
 LBA_islamist_cooperation: "Cooperação com os Islamistas"
 LBA_islamist_cooperation_desc: "O governo adotou uma abordagem leniente em relação às milícias islamistas e chega a trabalhar com elas em algum nível."
 LBA_turkish_drone_support: "Apoio Turco em Drones"
 LBA_turkish_drone_support_desc: "O governo líbio está trabalhando junto com a Turquia para modernizar seu estoque de drones.\n\n§REste espírito nacional será removido se [TUR.GetNameDef] não existir ou estivermos em guerra com eles.§!"
 LBA_military_crackdown_modifier: "Repressão Militar"
 LBA_military_as_workforce_modifier: "Força de Trabalho Militar"
 LBA_military_as_security_modifier: "Segurança Extra dos Campos de Petróleo"
 LBA_special_economic_zone: "Zona Econômica Especial"
 LBA_minimum_wage_centralised: "Salário Mínimo Imposto"
 LBA_minimum_wage_centralised_desc: "Um nível de salário mínimo está sendo imposto pelo governo na esperança de estimular o consumo interno e reduzir a pressão sobre os serviços sociais."
 LBA_private_insurance_centralised: "Oferta de Seguro de Saúde Privado"
 LBA_private_insurance_centralised_desc: "O sistema de saúde foi reforçado com a introdução de seguros de saúde privatizados. Isso significa que o cliente gasta menos com a prestação de serviços de saúde, mas as pessoas precisam gastar seu dinheiro com seguros privados.\n\n§REste espírito nacional será removido se tivermos $health_05$ ou $health_06$§!"
 LBA_dinar_tied_to_dollar: "Dinar Atrelado ao Dólar"
 LBA_dinar_tied_to_dollar_desc: "O Dinar Líbio foi atrelado ao dólar americano na esperança de tornar os produtos líbios mais favoráveis nos mercados estrangeiros.\n\n§REste espírito nacional será removido se [USA.GetNameDef]não existir§!"
 LBA_chinese_construction: "Construtoras Chinesas"
 LBA_chinese_construction_desc: "Construtoras chinesas foram contratadas pelo Estado líbio para construir sua infraestrutura.\n\n§REste espírito nacional será removido se [CHI.GetNameDef] não existir ou estivermos em guerra com [CHI.GetNameDef]§!"
 LBA_protected_middle_class: "Classe Média Protegida"
 LBA_protected_middle_class_desc: "O governo líbio decidiu promover a causa da classe média, as pessoas com quantias confortáveis de dinheiro."
 LBA_protected_lower_class: "Classe Baixa Protegida"
 LBA_protected_lower_class_desc: "O governo líbio decidiu promover a causa da classe baixa, as pessoas que realizam a maior parte do trabalho manual no país."
 LBA_marxism_leninism_adopted: "Ideologia Marxista-Leninista"
 LBA_marxism_leninism_adopted_desc: "O governo começou a adotar políticas marxista-leninistas em sua governança cotidiana.\n\n§REste espírito nacional será removido se não formos governados por [socialism_L], [communist_state_L], [anarchist_communism_L], [Neutral_green_L], [neutral_Social_L] ou [Neutral_Communism_L]§!"
 LBA_afrosocialism_adopted: "Ideologia Afrossocialista"
 LBA_afrosocialism_adopted_desc: "O governo começou a adotar políticas afrossocialistas em sua governança cotidiana.\n\n§REste espírito nacional será removido se não formos governados por [socialism_L], [communist_state_L], [anarchist_communism_L], [Neutral_green_L], [neutral_Social_L] ou [Neutral_Communism_L]§!"
 LBA_eurocommunism_adopted: "Ideologia Eurocomunista"
 LBA_eurocommunism_adopted_desc: "O governo começou a adotar políticas eurocomunistas em sua governança cotidiana.\n\n§REste espírito nacional será removido se não formos governados por [socialism_L], [communist_state_L], [anarchist_communism_L], [Neutral_green_L], [neutral_Social_L] ou [Neutral_Communism_L]§!"
 LBA_women_enfrachised: "Mulheres Empoderadas"
 LBA_women_enfrachised_desc: "O governo líbio tomou uma posição pelo empoderamento das mulheres de seu país.\n\n§REste espírito nacional será removido se formos Salafistas ou governados pela [Neutral_Muslim_Brotherhood_L]§!"
 LBA_nordic_model_followed: "Social-Democracia Nórdica"
 LBA_nordic_model_followed_desc: "O governo líbio está tentando recriar na Líbia o modelo nórdico de Estado de bem-estar social.\n\n§REste espírito nacional será removido se não formos governados por [socialism_L], [communist_state_L], [anarchist_communism_L], [Neutral_green_L], [neutral_Social_L] ou [Neutral_Communism_L]§!"
 LBA_workers_republic_created: "República dos Trabalhadores"
 LBA_european_tech_companies: "Cooperação com Empresas de Tecnologia Europeias"
 LBA_european_tech_companies_desc: "A Líbia está cooperando com empresas de tecnologia europeias para ajudá-la a melhorar seu progresso tecnológico.\n\n§REste espírito nacional será removido se estivermos em guerra com qualquer país da UE§!"
 LBA_polygamy_allowed: "Poligamia Permitida"
 LBA_polygamy_allowed_desc: "A Líbia permitiu a poligamia em sua nação na esperança de aumentar o crescimento populacional.\n\n§REste espírito nacional será removido se nosso valor de Conservadorismo Social - Governo estiver abaixo de 50%§!"
 LBA_ali_al_sallabi_sponsored: "Livros de Ali al-Sallabi Patrocinados"
 LBA_ali_al_sallabi_sponsored_desc: "O governo líbio endossou oficialmente os livros de Ali al-Sallabi sobre o Islã e patrocina sua distribuição pelo mundo."
 LBA_tuareg_militias_in_country: "Milícias Tuaregues"
 LBA_tuareg_militias_in_country_desc: "Milícias tuaregues atuam no canto sudoeste do país. Tuaregues do Mali, da Argélia e do Níger estão cruzando a fronteira para se juntar à luta. Supostamente, estão nos ajudando a derrotar nossos inimigos, mas suas lealdades podem estar em outro lugar."
 LBA_toubou_militias_in_country: "Milícias Toubou"
 LBA_toubou_militias_in_country_desc: "Milícias toubou atuam nas partes meridionais do país. Embora não sejam tão numerosas, suas operações militares reduziram o fluxo de migrantes da África Central."
 LBA_tribal_militias: "Milícias Tribais"
 LBA_tribal_militias_desc: "Com a guerra civil se agravando e a segurança no país caindo, mais e mais tribos estão se mobilizando e criando suas próprias milícias para proteger os membros de sua tribo ou para apoiar os rebeldes em seu esforço de guerra. Embora suas milícias reforcem nossas forças, elas criam uma camada de incerteza, pois fazem com que os rebeldes controlem o país cada vez menos."
 LBA_jihadist_militias: "Milícias Jihadistas"
 LBA_jihadist_militias_desc: "Com o início da guerra civil, o Grupo Islâmico Combatente Líbio se reorganizou em uma organização mais legítima sob o Conselho Nacional de Transição. Eles afirmam ser mais moderados, mas até seus líderes admitiram que muitos de seus soldados têm ligações com a Al-Qaeda. Quanto mais poder ganham, mais nosso país escorrega rumo ao extremismo."
 LBA_islamist_militias: "Milícias Islamistas"
 LBA_islamist_militias_desc: "Kadafi suprimiu muitos elementos islâmicos durante todo o seu governo. Isso criou agora um movimento contrarrevolucionário, com muitos líbios esperando uma forma de governo mais centrada no Islã. Em especial a Irmandade Muçulmana, com seus patrocinadores catarianos, vem assumindo um papel cada vez maior entre as milícias islamistas."
 LBA_secularist_militias: "Milícias Secularistas"
 LBA_secularist_militias_desc: "Muitas das milícias sob o Conselho Nacional de Transição têm origem nas Forças Armadas Líbias. Muitas delas temem que dar poder demais aos islamistas traga a destruição da Líbia. À medida que seu poder aumenta, as Forças Armadas poderão controlar o país de forma cada vez mais firme."
 LBA_reformist_militias: "Milícias Reformistas"
 LBA_reformist_militias_desc: "Algumas pessoas na Líbia desejam que o país se torne uma democracia ao estilo ocidental. Essas pessoas, porém, são poucas. É improvável que algum dia obtenham o apoio de que precisam, mas sua presença faz nossos apoiadores desconfiarem de suas próprias causas."
 LBA_military_desertion_government: "Deserção Militar"
 LBA_military_desertion_government_desc: "Todos os dias recebemos relatos de soldados e unidades militares inteiras abandonando o exército líbio para passar para o lado dos rebeldes. É difícil para o governo de Kadafi manter terreno quando posições podem simplesmente ser perdidas porque soldados as abandonam só para se juntar ao inimigo."
 LBA_aftermath_of_the_civil_war: "Consequências da Guerra Civil"
 LBA_aftermath_of_the_civil_war_desc: "Embora a guerra civil tenha sido relativamente rápida, ela ainda causou algum dano ao país. O maior impacto sobre a sociedade é o desmantelamento do regime de Kadafi e das milícias. A organização do regime tinha seus tentáculos até o nível municipal do país, e substituir os leais a Kadafi por novos servidores públicos levará tempo. Além disso, ainda há várias milícias independentes atuando no país, que precisarão ser eliminadas ou integradas ao Exército Nacional Líbio."
 LBA_shura_council_of_derna: "Conselho Shura dos Mujahidin em Derna"
 LBA_shura_council_of_derna_desc: "Islamistas locais em Derna se uniram e formaram um conselho shura para administrar a cidade e preencher o vácuo de poder deixado pelo governo. Derna é uma das cidades mais populosas da Líbia e uma das principais fontes de mão de obra para os jihadistas líbios globais."
 LBA_shura_council_of_ajdabiya: "Conselho Shura dos Revolucionários de Ajdabiya"
 LBA_shura_council_of_ajdabiya_desc: "Islamistas locais em Ajdabiya se uniram e formaram um conselho shura para administrar a cidade e preencher o vácuo de poder deixado pelo governo. Perder o controle de Ajdabiya reduziu consideravelmente nossa capacidade de exportar petróleo dos campos de Wahat."
 LBA_southern_insurgency: "Insurgência em Kufra"
 LBA_southern_insurgency_desc: "Insurgentes leais aos islamistas de Benghazi, a Brigada Rafallah al-Sahati, atuam em Kufra e perturbam a população local. Não são uma ameaça séria, mas sua existência pode provocar o povo toubou local a agir."
 LBA_society_of_muslim_brothers: "Sociedade dos Irmãos Muçulmanos"
 muslim_brotherhood_faction_member: "Membro da Sociedade dos Irmãos Muçulmanos"
 muslim_brotherhood_faction_member_desc: "A Sociedade dos Irmãos Muçulmanos, mais conhecida como Irmandade Muçulmana, é um grupo político e religioso que acredita no pan-islamismo e na implementação da Sharia como lei comum. Vários países que apoiam a Irmandade decidiram criar uma aliança militar para promover melhor seus interesses."
 muslim_brotherhood_faction_member_tt: "Ao influenciar países que são §Y$sunni$§!:\n$foreign_influence_modifier$: §G+10.00%§!"
 muslim_brotherhood_faction_member_tt2: "§RRegra Especial da Facção§!:\n-Apenas países governados pela Irmandade Muçulmana podem entrar na facção"
 shadow_of_gaddafi: "À Sombra de Kadafi"
 marshall_of_libya: "Marechal da Líbia"
 defence_minister_of_libya: "Ministro da Defesa"
 LBA_unit_leader_trait_tribal_commander: "Comandante Tribal"
 LBA_unit_leader_trait_tribal_commander_desc: "Este comandante chegou ao comando em nível nacional começando sua carreira no comando de uma das milícias tribais do país. Várias tribos do país montaram e financiaram suas próprias milícias para proteger suas comunidades em um país que vai se tornando, aos poucos, cada vez mais sem lei."
 LBA_unit_leader_trait_jihadist_commander: "Comandante Jihadista"
 LBA_unit_leader_trait_jihadist_commander_desc: "Este comandante começou liderando jihadistas dentro e fora da Líbia. Com ligações com a Al-Qaeda e o Grupo Islâmico Combatente Líbio, ele viu bastante combate pelo mundo."
 LBA_unit_leader_trait_islamist_commander: "Comandante Islamista"
 LBA_unit_leader_trait_islamist_commander_desc: "Este comandante lidera uma das milícias locais com tendências islamistas. Muitas comunidades montaram conselhos para cuidar da defesa local na forma de milícias. Como muitos na Líbia ainda são muçulmanos conservadores, muitas dessas milícias e conselhos pressionam pela implementação da lei da Sharia, ao menos em certa medida."
 LBA_unit_leader_trait_secularist_commander: "Comandante Secularista"
 LBA_unit_leader_trait_secularist_commander_desc: "Este comandante está fortemente alinhado ao Exército Nacional Líbio. Muitos no ENL desejam uma Líbia mais secular, sem espaço para elementos islamistas. É provável que este comandante também seja muito próximo de Khalifa Haftar, o autoproclamado líder do ENL."
 LBA_unit_leader_trait_reformist_commander: "Comandante Reformista"
 LBA_unit_leader_trait_reformist_commander_desc: "Este comandante é um exilado líbio que voltou para casa. Tendo uma educação ao estilo ocidental, o comandante e as milícias que lidera gostariam que a Líbia fosse reformada em uma democracia liberal ao estilo ocidental."
 LBA_khalifa_haftar_desc: "Khalifa Haftar começou a carreira nas forças armadas líbias, recebendo treinamento na Líbia, na União Soviética e no Egito. Haftar ajudou Muammar Kadafi a derrubar o rei Idris, após o que se tornou Chefe do Estado-Maior das forças armadas líbias. Haftar comandou tropas na desastrosa guerra contra o Chade, durante a qual foi capturado pelas forças chadianas e renegado por Kadafi. Os Estados Unidos levaram Haftar e seus soldados capturados de avião para o Zaire, onde ele fundou um grupo de resistência armada contra Kadafi. Eventualmente, com a ajuda da CIA, encontraram o caminho para os Estados Unidos. Em 1996, Haftar lançou um levante contra Kadafi no leste da Líbia, mas voltou aos EUA depois que fracassou. Após a queda de Kadafi, assumiu o controle das novas forças armadas líbias, subindo nas fileiras até uma posição política influente e tornando-se líder de fato do país."
 LBA_organize_desert_trips_tt: "\n§RSe nos envolvermos em uma guerra, então§!"
 LBA_organize_desert_trips_tt_2: "§RQuando a ideia expirar e não estivermos mais em guerra, receberemos de volta os bônus anteriores. Se ainda estivermos em guerra, os modificadores negativos continuarão por mais um ano.§!"
 LBA_end_of_gaddafi: "O Fim de Kadafi"
 LBA_end_of_gaddafi_desc: "Kadafi foi derrubado e o povo líbio agora está livre para escolher seu próprio caminho!"
 LBA_just_another_gaddafi: "Só Mais um Kadafi"
 LBA_just_another_gaddafi_desc: "Expulsamos um ditador só para acabar com outro. A Líbia simplesmente não foi feita para ser uma democracia, isso se vê claramente em nossa história. [ROOT.GetLeader] será um governante melhor do que Kadafi jamais foi!"
 LBA_just_another_gaddafi_tt: "Não estamos em guerra com uma facção pró-Kadafi"
 LBA_green_resistance: "A Resistência Verde"
 LBA_green_resistance_desc: "Mesmo com Kadafi morto, seus seguidores não se foram. Um novo movimento está se formando em torno de sua Terceira Teoria Internacional. Esses legalistas nos seguirão de bom grado, desde que acreditem que lutamos por Kadafi."
 LBA_employ_gaddafi_loyalists: "Empregar os Legalistas de Kadafi"
 LBA_employ_gaddafi_loyalists_desc: "A administração e as forças armadas ainda estão cheias de pessoas que trabalharam sob o regime de Kadafi. Essas pessoas ainda podem ser úteis para nós e aceitarão de bom grado um salário menor por pura lealdade."
 LBA_moderate_islamism: "Moderar o Alcorão e a Suna"
 LBA_moderate_islamism_desc: "O maior problema do Islã é a interpretação que as pessoas fazem dos ensinamentos. O Islã é um dos pilares da Líbia, então não podemos abandoná-lo completamente. No entanto, podemos retratar e ensinar ao povo uma versão mais moderada do Alcorão e da Suna."
 LBA_expand_tribes: "Expandir as Tribos"
 LBA_expand_tribes_desc: "A Líbia consiste em três tribos principais: Cirenaica, Tripolitânia e Fezzan. No entanto, também há muitos Toubou e Tuaregues vivendo em nossas terras. Essas pessoas são tão líbias quanto as três tribos principais. Elas não têm um Estado próprio, então vamos fazer da Líbia o Estado delas também."
 LBA_expand_tribes_threat: "Expansionismo Líbio no Saara"
 LBA_maintain_territorial_integrity: "Manter a Integridade Territorial"
 LBA_maintain_territorial_integrity_desc: "O território da Líbia é indivisível. Todas as ideias de separatismo devem ser eliminadas e todos os territórios perdidos devem ser trazidos de volta ao seio da nação."
 LBA_liberate_tuareg: "Libertar os Tuaregues"
 LBA_liberate_tuareg_desc: "Os Tuaregues são uma tribo nômade da parte oeste do Saara sem Estado próprio. Devemos uni-los à nação líbia."
 LBA_liberate_tuareg_tt: "Podemos exigir de nossos §Yvizinhos§! quaisquer terras legítimas dos §YTuaregues§!"
 LBA_liberate_toubou: "Libertar os Toubou"
 LBA_liberate_toubou_desc: "Os Toubou são uma tribo nômade da parte leste do Saara sem Estado próprio. Devemos uni-los à nação líbia."
 LBA_liberate_toubou_tt: "Podemos exigir de nossos §Yvizinhos§! quaisquer terras legítimas dos §YToubou§!"
 LBA_ties_with_nato: "Laços com a OTAN"
 LBA_ties_with_nato_desc: "Embora não sejamos tão democráticos, os países ocidentais têm um histórico de cooperar com homens fortes. Eles precisam de nossa força e de nossas forças armadas para manter seus próprios países seguros contra extremistas."
 LBA_ties_with_csto: "Laços com a OTSC"
 LBA_ties_with_csto_desc: "Não se pode confiar no Ocidente. Foram eles que se livraram de Kadafi, para começar, e é apenas uma questão de tempo até virem atrás de nós. Devemos olhar para o Leste, para a Rússia, como nossa amiga."
 LBA_new_libyan_nation: "Nova Nação Líbia"
 LBA_new_libyan_nation_desc: "Uma nova nação líbia nasceu! Junto com os Tuaregues e os Toubou, a identidade líbia agora está completa."
 LBA_control_the_media: "Controlar a Mídia"
 LBA_control_the_media_desc: "As pessoas acham que, só porque Kadafi se foi, agora podem criticar livremente o governo. Isso é um absurdo. Devemos ser nós a dizer às pessoas o que pensar!"
 LBA_arms_deals: "Acordos Internacionais de Armas"
 LBA_arms_deals_desc: "Para proteger o Estado, precisamos de um exército bem abastecido. Nosso aliado pode nos fornecer equipamentos de alta tecnologia e não precisaremos perder tempo desenvolvendo-os nós mesmos."
 LBA_echoes_of_the_past: "Ecos do Passado"
 LBA_echoes_of_the_past_desc: "Após a Primeira Guerra Mundial, a República Tripolitana tentou se separar da Itália, mas acabou fracassando. Foi a primeira nação democrática do Oriente Médio. Agora temos a chance de trazer uma democracia verdadeiramente igualitária de volta à Líbia."
 LBA_purge_gaddafi_loyalists: "Expurgar os Legalistas de Kadafi"
 LBA_purge_gaddafi_loyalists_desc: "A administração está cheia de pessoas que trabalharam alegremente sob Kadafi. Precisamos expulsá-las e prender aqueles que prejudicaram nosso povo. Esse é um passo necessário para um recomeço e para garantir a democracia."
 LBA_memory_of_ramadan_asswehly: "Memória de Ramadan Asswehly"
 LBA_memory_of_ramadan_asswehly_desc: "Ramadan Asswehly foi um dos fundadores e walis da República Tripolitana. Ele lutou contra os italianos para defender a República. A própria República funcionava como uma tetrarquia, governada por quatro walis, o que garantia um equilíbrio de poder entre as facções."
 LBA_soothe_tribal_tension: "Apaziguar as Tensões Tribais"
 LBA_soothe_tribal_tension_desc: "Todos os homens nascem iguais. É tolice colocar as tribos umas contra as outras. Em vez disso, devemos usar os pontos fortes de cada tribo a nosso favor."
 LBA_tribal_assembly: "Criar um Conselho Tribal"
 LBA_tribal_assembly_desc: "Devemos criar um órgão governamental que resolva disputas entre as tribos e garanta que todos sejam tratados com igualdade."
 LBA_invest_in_tripolitania: "Investir na Tripolitânia"
 LBA_invest_in_tripolitania_desc: "A Tripolitânia é o centro econômico do país. Ela abriga a maior parte de nossos centros de tecnologia avançada. Investir lá trará riqueza aos tripolitanos."
 LBA_invest_in_cyrenaica: "Investir na Cirenaica"
 LBA_invest_in_cyrenaica_desc: "A Cirenaica é uma importante fonte do nosso petróleo e um de nossos mais importantes centros de transporte. Devemos utilizar o conhecimento naval da região e investir em empreendimentos de construção naval."
 LBA_invest_in_fezzan: "Investir em Fezzan"
 LBA_invest_in_fezzan_desc: "Fezzan é muito remota, mas é uma área com muitos depósitos minerais. Poderíamos investir em algum trabalho de escavação para encontrar mais."
 LBA_tripolitanian_soldiers: "Guerreiros da Tripolitânia"
 LBA_tripolitanian_soldiers_desc: "A Tripolitânia é a mais populosa de nossas regiões. Faz sentido vasculharmos sua população atrás dos soldados mais capazes."
 LBA_cyrenaican_oil: "Petróleo da Cirenaica"
 LBA_cyrenaican_oil_desc: "Os cirenaicos têm experiência na produção de petróleo. Devemos usar essa experiência para encontrar melhores formas de perfurar petróleo."
 LBA_fezzani_caravans: "Caravanas de Fezzan"
 LBA_fezzani_caravans_desc: "O povo de Fezzan participa há muito tempo do comércio transaariano. Eles têm muita experiência em como sobreviver no deserto. Devemos usar suas habilidades para treinar nossos soldados a sobreviver em ambientes hostis."
 LBA_tribal_unification: "Unificação Tribal"
 LBA_tribal_unification_desc: "Criamos um sistema equilibrado em que todas as tribos podem se sentir seguras. Não precisamos mais nos preocupar com separatismo na Líbia."
 LBA_free_libya: "Uma Líbia Livre"
 LBA_free_libya_desc: "Devemos iniciar um processo rápido de criação de liberdades sociais, políticas e econômicas na Líbia para nos livrarmos o mais depressa possível dos resquícios do regime de Kadafi."
 LBA_emergency_privatisation: "Privatização de Emergência"
 LBA_emergency_privatisation_desc: "Precisamos de dinheiro. Devemos vender uma grande parte dos campos de petróleo controlados pela Corporação Nacional de Petróleo a empresas privadas."
 LBA_emergency_privatisation_tt: "Nível de Nacionalização: §Y-20%§!"
 LBA_multi_party_cabinet: "Gabinete Multipartidário"
 LBA_multi_party_cabinet_desc: "O fim de Kadafi fez surgir inúmeros partidos políticos e organizações, todos disputando o poder. Se quisermos manter a estabilidade, devemos incluir uma multiplicidade de vozes em nosso gabinete."
 LBA_guarantee_freedoms: "Garantir as Liberdades Constitucionais"
 LBA_guarantee_freedoms_desc: "O povo líbio nunca experimentou de fato a liberdade. Sob o nosso governo, haverá mais liberdade do que qualquer um possa aguentar."
 LBA_attract_private_oil_companies: "Atrair Petrolíferas Privadas"
 LBA_attract_private_oil_companies_desc: "A Líbia tem boas reservas de petróleo, mas não a tecnologia nem o ambiente de negócios para extraí-lo. Precisamos atrair petrolíferas privadas para investir na Líbia."
 LBA_allow_private_farming: "Permitir a Agricultura Privada"
 LBA_allow_private_farming_desc: "As leis islâmicas de herança criaram uma colcha de retalhos de pequenas fazendas que não conseguem fornecer alimento de forma eficaz. Devemos permitir que indivíduos comprem fazendas uns dos outros, o que permitiria que fazendas maiores e mais eficientes operassem."
 LBA_freedom_of_conscience: "Liberdade de Consciência"
 LBA_freedom_of_conscience_desc: "Ninguém deve ser perseguido por sua religião. Embora seja importante basear muitas de nossas leis no Islã, por ser parte de nossa herança, não devemos discriminar nenhum outro grupo religioso."
 LBA_free_prisoners: "Libertar os Acusados Injustamente"
 LBA_free_prisoners_desc: "O governo anterior prendeu gente demais simplesmente por suas opiniões. Essas pessoas precisam ser soltas e poder participar da sociedade novamente."
 LBA_dismantle_noc: "Desmantelar a NOC"
 LBA_dismantle_noc_desc: "A Corporação Nacional de Petróleo é uma máquina pesada e ineficiente que serviu apenas como geradora de dinheiro para o antigo regime. Devemos desmantelar todo o sistema e dividir a empresa em partes menores."
 LBA_dismantle_noc_tt: "A mecânica de §YNacionalização do Petróleo§! será desativada"
 libya_noc_dismantled: "A §YCorporação Nacional de Petróleo§! foi desmantelada"
 LBA_approach_india: "Aproximar-se de [RAJ.GetName]"
 LBA_approach_india_desc: "[RAJ.GetName] foi um parceiro fundamental para nós durante a Guerra Fria, mas as relações azedaram. Devemos nos aproximar deles mais uma vez para reconstruir as relações."
 LBA_approach_switzerland: "Aproximar-se de [SWI.GetName]"
 LBA_approach_switzerland_desc: "Muitos dos políticos mais liberais e ativistas de direitos humanos passaram seu exílio vivendo em [SWI.GetName]. É natural que construamos laços mais estreitos com esse grande exemplo de democracia."
 LBA_approach_france: "Aproximar-se de [FRA.GetName]"
 LBA_approach_france_desc: "[FRA.GetName] sempre teve grande interesse na Líbia, apesar de não termos um passado colonial em comum com eles. Os franceses foram muito enfáticos em sua oposição a Kadafi, então podemos confiar que nos ajudarão."
 LBA_hire_indian_workers: "Contratar Trabalhadores [RAJ.GetAdjective]"
 LBA_hire_indian_workers_desc: "Muitos dos países do Golfo empregam um grande número de trabalhadores estrangeiros da Índia, já que sua própria força de trabalho não é grande o suficiente. Devemos fazer o mesmo para aumentar mais rápido nosso potencial econômico."
 LBA_hire_swiss_advisors: "Contratar Consultores Financeiros [SWI.GetAdjective]"
 LBA_hire_swiss_advisors_desc: "Os bancos [SWI.GetAdjective] são conhecidos no mundo todo. Devemos pedir a ajuda deles para administrar nossa própria economia."
 LBA_hire_french_energy_advisors: "Utilizar Empresas de Energia [FRA.GetAdjective]"
 LBA_hire_french_energy_advisors_desc: "[FRA.GetName] é a principal potência em energia nuclear. Devemos obter apoio de empresas francesas na construção de nossas próprias usinas nucleares."
 LBA_libyan_national_army: "Exército Nacional Líbio"
 LBA_libyan_national_army_desc: "Os políticos fracassaram em proteger o povo líbio. Agora cabe às forças armadas fazer o trabalho por eles."
 LBA_rely_on_gaddafists: "Contar com os Militares Kadafistas"
 LBA_rely_on_gaddafists_desc: "A maior parte do exército é composta por pessoas que eram leais a Kadafi. Não faz sentido nos livrarmos delas, pois têm décadas de experiência."
 LBA_call_back_haftar: "A Ascensão de Haftar"
 LBA_call_back_haftar_desc: "Khalifa Haftar era coronel durante a guerra líbio-chadiana, quando foi capturado pelas forças chadianas. Renegado por Kadafi, ele e seus companheiros soldados foram levados de avião ao Zaire pelos Estados Unidos e, com a ajuda da CIA, acabaram chegando aos EUA. Haftar se opõe a Kadafi há décadas e, agora que Kadafi se foi, pode voltar para assumir o controle das forças armadas."
 LBA_legacy_of_the_free_officers: "Legado dos Oficiais Livres"
 LBA_legacy_of_the_free_officers_desc: "O movimento dos Oficiais Livres foi o que Kadafi liderou para derrubar a monarquia líbia. O povo estava cansado de um regime que era fantoche de potências estrangeiras e abusava da riqueza petrolífera do país. Agora fizemos o mesmo, e devemos garantir que a Líbia não caia novamente sob influência estrangeira."
 LBA_no_room_for_islamists: "Sem Espaço para Islamistas"
 LBA_no_room_for_islamists_desc: "Embora o Islã seja a espinha dorsal da Líbia, os islamistas não são. Eles tentam subverter a religião para suas próprias necessidades. Não devemos dar trégua a eles."
 LBA_limited_cooperation: "Cooperação Limitada"
 LBA_limited_cooperation_desc: "O fato é que não podemos escolher nossos aliados neste momento. Poderíamos ter alguma cooperação com várias milícias islamistas para reforçar nossas forças. Podemos tirá-las do quadro mais tarde."
 LBA_improved_training: "Treinamento Aprimorado"
 LBA_improved_training_desc: "A situação do Exército Líbio é horrível. O regime de Kadafi não dedicou muito tempo a treinar o soldado comum nem a se manter atualizado com os mais recentes avanços estratégicos. Devemos realizar alguns treinamentos para nossos soldados."
 LBA_expand_al_saiqa: "Expandir a Al-Saiqa"
 LBA_expand_al_saiqa_desc: "A Al-Saiqa é uma unidade de forças especiais líbia composta por paraquedistas, unidades paramilitares e comandos. Devemos expandir a unidade para que seja maior."
 LBA_expand_al_saiqa_tt: "Uma unidade de §YForças Especiais§! será criada em §Y$VICTORY_POINTS_11954$§!"
 LBA_establish_military_zones: "Estabelecer Zonas Militares"
 LBA_establish_military_zones_desc: "Para controlar as diferentes regiões da Líbia, devemos estabelecer zonas militares com seus próprios governadores."
 LBA_approach_turkey: "Aproximar-se de [TUR.GetName]"
 LBA_approach_turkey_desc: "Nos últimos anos, [TUR.GetName] tem assumido um papel mais ativo no Oriente Médio. Eles buscam governos amistosos na região, e definitivamente somos um."
 LBA_approach_russia: "Aproximar-se de [SOV.GetName]"
 LBA_approach_russia_desc: "[SOV.GetName] é há muito tempo contra o Ocidente. É culpa do Ocidente que a Líbia esteja na situação em que está. Devemos trabalhar junto com [SOV.GetName] para construir uma Líbia melhor."
 LBA_acquire_turkish_drones: "Drones [TUR.GetAdjective]"
 LBA_acquire_turkish_drones_desc: "Os turcos têm excelente tecnologia de drones. Devemos pedir a ajuda deles para produzi-los."
 LBA_acquire_russian_weapons: "Solicitar Armas de [SOV.GetName]"
 LBA_acquire_russian_weapons_desc: "A maioria das armas que usamos vem de [SOV.GetName]. Devemos solicitar equipamento adicional para equipar nosso exército a lutar melhor."
 LBA_military_exercises: "Exercícios Militares"
 LBA_military_exercises_desc: "Devemos realizar jogos de guerra para melhorar a aptidão de nosso estado-maior, para que possa operar melhor no campo de batalha."
 LBA_factory_mobilisation: "Mobilização de Emergência"
 LBA_factory_mobilisation_desc: "Devemos transformar rapidamente parte de nossa base industrial para uso militar. Pode nos prejudicar financeiramente, mas é necessário."
 LBA_mobilise_the_tribes: "Contar com a Milícia Tribal"
 LBA_mobilise_the_tribes_desc: "Devemos mobilizar as várias tribos para lutarem por nós. Não serão bem treinadas, mas conseguiremos o suficiente delas para preencher todas as lacunas que temos."
 LBA_mobilise_the_tribes_tripolitania_tt: "§YTrês brigadas de milícia§! serão mobilizadas na §YTripolitânia§!"
 LBA_mobilise_the_tribes_cyrenaica_tt: "§YDuas brigadas de milícia§! serão mobilizadas na §YCirenaica§!"
 LBA_mobilise_the_tribes_fezzan_tt: "§YUm batalhão de milícia motorizada§! será mobilizado em §YFezzan§!"
 LBA_employ_mercenaries: "Empregar Mercenários"
 LBA_employ_mercenaries_desc: "Não podemos confiar em nosso próprio povo para lutar. Devemos empregar mercenários estrangeiros de elite."
 LBA_employ_mercenaries_tt: "§YUma brigada bloqueada de forças especiais§! será contratada em §Y[ROOT.Capital.GetName]§!"
 LBA_the_libyan_elite: "A Elite Líbia"
 LBA_the_libyan_elite_desc: "A Líbia deve ser governada por seus superiores. As pessoas que sabem administrar um negócio e um país. O que é bom para nós certamente também será bom para a Líbia."
 LBA_begin_centralisation: "Maior Centralização"
 LBA_begin_centralisation_desc: "Para ter um Estado eficaz, precisamos aumentar o controle que a região da capital tem."
 LBA_begin_centralisation_tt: "§YAo aumentar a centralização, todos os focos deste ramo serão mais poderosos, mas também custarão mais!§!"
 LBA_begin_decentralisation: "Menor Centralização"
 LBA_begin_decentralisation_desc: "É melhor delegar algumas das tarefas de administrar o governo a conselhos regionais."
 LBA_begin_decentralisation_tt: "§YAo reduzir a centralização, todos os focos deste ramo serão menos poderosos, mas também custarão menos!§!"
 LBA_increased_centralization_tooltip: "Se tivermos concluído o foco §Y$LBA_begin_centralisation$§!:\n"
 LBA_decreased_centralization_tooltip: "Se tivermos concluído o foco §Y$LBA_begin_decentralisation$§!:\n"
 LBA_build_infrastructure: "Investimentos em Infraestrutura"
 LBA_build_infrastructure_desc: "As estradas sob o regime de Kadafi foram deixadas em estado desesperadoramente precário. Devemos aumentar o nível de infraestrutura do nosso país. Boas estradas são a base de uma boa economia."
 LBA_create_special_economic_zones: "Criar Zonas Econômicas Especiais"
 LBA_create_special_economic_zones_desc: "Devemos criar zonas econômicas especiais em algumas áreas da Líbia. Essas zonas teriam regulamentação flexibilizada, o que daria incentivos para empresas estrangeiras virem à Líbia."
 LBA_introduce_minimum_wage: "Instituir um Salário Mínimo"
 LBA_introduce_minimum_wage_desc: "A Líbia não tem um salário mínimo definido, o que significa que os trabalhadores podem receber valores baixíssimos. Devemos impor algum tipo de salário mínimo. Isso ajudaria a tirar as pessoas da pobreza e reduziria a pressão sobre nossos serviços sociais. Afetará um pouco o setor corporativo, mas talvez, no panorama geral, valha a pena."
 LBA_attract_foreign_investment: "Atrair Investimento Estrangeiro"
 LBA_attract_foreign_investment_desc: "Agora que criamos um ambiente adequado para os negócios, devemos convidar empresas estrangeiras a investir em nós."
 LBA_friends_in_high_places: "Amigos em Altos Cargos"
 LBA_friends_in_high_places_desc: "Com nossos contatos empresariais, podemos começar a moldar a Líbia para ser mais favorável aos negócios. Se as grandes corporações receberem um pouco mais de poder, isso nos trará mais lucro."
 LBA_private_insurance: "Implementar Seguro de Saúde Privado"
 LBA_private_insurance_desc: "Devemos implementar um sistema de seguro de saúde privado para funcionar em paralelo aos serviços fornecidos pelo Estado. Assim podemos transferir parte do fardo financeiro para contratantes privados e para a população. As pessoas terão, é claro, menos renda disponível (e tributável)."
 LBA_approach_usa: "Aproximar-se de [USA.GetName]"
 LBA_approach_usa_desc: "[USA.GetNameDef] é o principal exemplo do que um país de livre mercado pode alcançar. Construir relações mais próximas com eles nos permitirá construir um paraíso semelhante."
 LBA_tie_dinar_to_dollar: "Atrelar o Dinar ao Dólar"
 LBA_tie_dinar_to_dollar_desc: "Atrelar nossa moeda ao dólar permitiria que nossa economia se tornasse mais estável e acompanhasse a dos EUA. Com uma taxa de câmbio fixa, os produtos fabricados na Líbia são um investimento melhor no mercado global. No entanto, como nossa economia é relativamente fraca em comparação com a dos EUA, as importações ficarão mais caras para nossos consumidores e empresas."
 LBA_approach_china: "Aproximar-se de [CHI.GetName]"
 LBA_approach_china_desc: "A China é uma potência em ascensão e tem demonstrado um interesse mais ativo na África recentemente. Devemos construir boas relações com eles e aproveitar sua base industrial."
 LBA_employ_chinese_construction_companies: "Contratar Construtoras Chinesas"
 LBA_employ_chinese_construction_companies_desc: "[CHI.GetName] está construindo ativamente projetos de infraestrutura por toda a África. Devemos contratar construtoras [CHI.GetAdjective] para investir em nossa infraestrutura."
 LBA_national_democracy: "Democracia Nacional"
 LBA_national_democracy_desc: "A Democracia Nacional é uma ideologia em que os pobres são cuidados, o Estado é livre de interferência estrangeira e os líderes governam com o consentimento do povo."
 LBA_protect_the_lower_class: "Proteger a Classe Baixa"
 LBA_protect_the_lower_class_desc: "As classes baixas - os operários de fábrica e os agricultores - são a espinha dorsal de qualquer nação industrial. Devemos fazer tudo o que pudermos para garantir que não sejam esmagadas por um sistema capitalista."
 LBA_protect_the_middle_class: "Proteger a Classe Média"
 LBA_protect_the_middle_class_desc: "A Líbia não tem verdadeira força industrial; nossa economia se baseia em transportar petróleo e fazer negócios. Portanto, devemos proteger a classe média: os trabalhadores de escritório e os estivadores que trazem dinheiro para o nosso país."
 LBA_absolute_national_independence: "Independência Nacional Absoluta"
 LBA_absolute_national_independence_desc: "Não devemos estar sujeitos a nenhuma potência estrangeira. Os líbios precisam ter autonomia para decidir por conta própria."
 LBA_give_power_to_central_committee: "Dar Poder ao Comitê Central"
 LBA_give_power_to_central_committee_desc: "O comitê central do partido deve deter a maior parte do poder do país ou, no mínimo, ter uma influência muito forte sobre a política do país."
 LBA_empower_the_noc: "Fortalecer a NOC"
 LBA_empower_the_noc_desc: "Kadafi nunca foi longe o suficiente com o petróleo da Líbia. Devemos aumentar o controle da Corporação Nacional de Petróleo sobre nossas reservas de petróleo, tirando-as das mãos de outros países."
 LBA_empower_the_noc_tt: "Nível de Nacionalização: §Y+15%§!"
 LBA_improve_infrastructure: "Melhorar as Estradas"
 LBA_improve_infrastructure_desc: "É importante para a nação ter boas estradas, pois, caso contrário, as pessoas não podem se engajar em atividade econômica."
 LBA_adopt_marxism_leninism: "Adotar o Marxismo-Leninismo"
 LBA_adopt_marxism_leninism_desc: "O marxismo-leninismo é a forma predominante de comunismo que resta no mundo. Criando um Estado liderado pelo proletariado, podemos libertar os trabalhadores e lutar contra o capitalismo."
 LBA_return_to_afrosocialism: "Retornar ao Afrossocialismo"
 LBA_return_to_afrosocialism_desc: "A luta de classes de que os comunistas falam não existe na África. Na África, nossa herança tribal significa que o socialismo está embutido em tudo o que fazemos. Devemos promover a herança e a identidade africanas e construir uma África feita para os africanos."
 LBA_shift_to_eurocommunism: "Mudar para o Eurocomunismo"
 LBA_shift_to_eurocommunism_desc: "Muitos dos comunistas históricos da Líbia eram de origem italiana, e na Itália o eurocomunismo teve muito sucesso. O eurocomunismo adota uma abordagem mais moderada e anti-Leste em relação ao socialismo, e abraça a classe média e vários novos movimentos sociais com mais força do que o comunismo tradicional."
 LBA_ties_to_italy: "Laços com a Itália"
 LBA_ties_to_italy_desc: "O [communist_state_L] foi fundado por imigrantes italianos, e muitas organizações de esquerda passaram seu exílio na Itália. Isso nos dá uma forte conexão com os círculos de esquerda italianos."
 LBA_approach_the_eu: "Aproximar-se da UE"
 LBA_approach_the_eu_desc: "A União Europeia é uma importante parceira comercial para nós. A maior parte de nossas exportações de petróleo vai para lá e, com maior integração, podemos expandir bastante nossa economia."
 LBA_secularise_the_state: "Secularizar o Estado"
 LBA_secularise_the_state_desc: "O Islã teve influência forte demais sobre a governança da Líbia. Precisamos separar os elementos religiosos de nossas instituições."
 LBA_womens_rights: "Fortalecer os Direitos das Mulheres"
 LBA_womens_rights_desc: "A tradição islâmica da Líbia é a base da opressão das mulheres que ocorre em nosso país. Devemos incentivar nossas mulheres a se tornarem trabalhadoras dedicadas ao Estado."
 LBA_establish_workers_republic: "Estabelecer uma República dos Trabalhadores"
 LBA_establish_workers_republic_desc: "Os trabalhadores líbios devem se unir para criar um Estado livre da burguesia capitalista."
 LBA_follow_the_nordic_model: "Seguir o Modelo Nórdico"
 LBA_follow_the_nordic_model_desc: "Os países nórdicos criaram um sistema em que as pessoas pagam impostos de bom grado em troca de amplo bem-estar social e saúde. Devemos seguir esse método para melhorar a vida de nossos cidadãos."
 LBA_european_high_tech: "Adquirir Tecnologia Europeia"
 LBA_european_high_tech_desc: "A Europa é conhecida por sua indústria de alta tecnologia. Devemos cooperar com algumas empresas europeias para desenvolver nossa própria indústria tecnológica."
 LBA_the_brotherhood: "A Irmandade"
 LBA_the_brotherhood_desc: "A Irmandade Muçulmana é uma organização religiosa e política pan-islâmica, com membros em todos os países islâmicos. Agora que estão no poder na Líbia, o país pode ser devolvido às suas raízes islâmicas."
 LBA_establish_sharia_law: "Estabelecer a Lei Sharia"
 LBA_establish_sharia_law_desc: "A lei sharia deve ser a base de nossa constituição e de nossas leis. O Islã nos dá as melhores ferramentas para a orientação moral da nação."
 LBA_rehabilitate_lifg_fighters: "Reabilitar os Combatentes do LIFG"
 LBA_rehabilitate_lifg_fighters_desc: "Os membros do Grupo Islâmico Combatente Líbio estão presos ou vivendo no exílio. Devemos estender-lhes a mão e deixá-los voltar à sociedade."
 LBA_scholars_of_brotherhood: "Eruditos da Irmandade"
 LBA_scholars_of_brotherhood_desc: "A Irmandade se envolve ativamente com a comunidade. Eles fazem caridade e ajudam a educar as pessoas. Devemos empregar a Irmandade para ajudar quem ainda for analfabeto no país a aprender a ler."
 LBA_allow_polygamy: "Permitir a Poligamia"
 LBA_allow_polygamy_desc: "Como parte do Islã, os homens devem poder ter várias esposas. Isso garante famílias grandes e felizes."
 LBA_works_of_al_sallabi: "Difundir as Obras de Al-Sallabi"
 LBA_works_of_al_sallabi_desc: "Ali al-Sallabi é um brilhante erudito e escritor líbio. Enquanto Kadafi esteve no poder, ele passou seus anos de exílio estudando na Arábia Saudita, no Sudão e no Catar. É um forte crente no Islã e escreveu vários livros sobre ele e sua história. Devemos patrocinar suas obras para que alcancem um público ainda maior."
 LBA_ties_to_saudi_arabia: "Laços com a Arábia Saudita"
 LBA_ties_to_saudi_arabia_desc: "Muitos de nossos eruditos e líderes da Irmandade estudaram em algum momento na Arábia Saudita. Embora os sauditas não sejam grandes fãs da Irmandade, ainda apreciam nossa dedicação ao Islã."
 LBA_request_religious_funding: "Solicitar Financiamento Religioso"
 LBA_request_religious_funding_desc: "Os sauditas fornecem com entusiasmo financiamento a mesquitas e madraças em outros países muçulmanos. Devemos solicitar a ajuda deles também."
 LBA_military_pact_with_qatar: "Pacto Militar com [QAT.GetName]"
 LBA_military_pact_with_qatar_desc: "[QAT.GetNameDef] é um dos principais apoiadores da Irmandade Muçulmana. Eles apoiam a luta dos muçulmanos por todo o Oriente Médio, e faria sentido unirmos nossas forças."
 LBA_military_pact_with_qatar_tt: "[QAT.GetNameWithFlag] tem mais probabilidade de aceitar se:\n§G-Tiverem uma opinião alta sobre nós\n-Os sauditas tiverem sido tomados pela Al-Qaeda\n-Forem vizinhos nossos ou de nosso subjugado§!\n\n[QAT.GetNameWithFlag] tem menos probabilidade de aceitar se:\n§R-Tiverem uma opinião baixa sobre nós\n-Formos salafistas\n-Estivermos em guerra§!"
 LBA_expand_the_alliance: "Expandir a Aliança"
 LBA_expand_the_alliance_desc: "Há outros países com simpatia pela Irmandade. Devemos buscar expandir nossa aliança para incluir esses países também."
 LBA_expand_the_alliance_trigger_tt: "Existe pelo menos um país que pode ser convidado"
 LBA_expand_the_alliance_tt: "Eles têm mais probabilidade de aceitar se:\n§G-Tiverem uma opinião alta sobre nós\n-Forem vizinhos nossos ou de nosso subjugado§!\n\nEles têm menos probabilidade de aceitar se:\n§R-Tiverem uma opinião baixa sobre nós\n-Formos salafistas\n-Estivermos em guerra§!"
 LBA_use_brotherhood_influence: "Utilizar a Influência da Irmandade"
 LBA_use_brotherhood_influence_desc: "A Irmandade tem membros em vários países muçulmanos. Devemos usá-los para obter mais influência sobre a política local."
 LibyaFocus.109.t: "[FROM.GetNameDef] Exige Terras"
 LibyaFocus.109.d: "O governo de [FROM.GetNameDef] alegou que a população tuaregue que vive em nossas terras deveria fazer parte da nação líbia. Agora exigem que nosso governo ceda o controle dessas terras a eles."
 LibyaFocus.109.a: "Aceitar as exigências"
 LibyaFocus.109.b: "Isso nunca acontecerá"
 LibyaFocus.110.t: "[FROM.GetNameDef] Aceita as Exigências"
 LibyaFocus.110.d: "O governo de [FROM.GetNameDef] concordou com nossas exigências. Esta é uma grande vitória para a nação líbia!"
 LibyaFocus.110.a: "Incrível"
 LibyaFocus.111.t: "[FROM.GetNameDef] Recusa Nossas Exigências"
 LibyaFocus.111.d: "O governo de [FROM.GetNameDef] recusou nossas exigências de território. Parece que eles querem continuar oprimindo o nosso povo."
 LibyaFocus.111.a: "Eles vão receber o que merecem"
 LibyaFocus.112.t: "[FROM.GetNameDef] Exige Terras"
 LibyaFocus.112.d: "O governo de [FROM.GetNameDef] alegou que a população toubou que vive em nossas terras deveria fazer parte da nação líbia. Agora exigem que nosso governo ceda o controle dessas terras a eles."
 LibyaFocus.112.a: "Aceitar as exigências"
 LibyaFocus.112.b: "Isso nunca acontecerá"
 LibyaFocus.113.t: "[FROM.GetNameDef] Aceita as Exigências"
 LibyaFocus.113.d: "O governo de [FROM.GetNameDef] concordou com nossas exigências. Esta é uma grande vitória para a nação líbia!"
 LibyaFocus.113.a: "Incrível"
 LibyaFocus.114.t: "[FROM.GetNameDef] Recusa Nossas Exigências"
 LibyaFocus.114.d: "O governo de [FROM.GetNameDef] recusou nossas exigências de território. Parece que eles querem continuar oprimindo o nosso povo."
 LibyaFocus.114.a: "Eles vão receber o que merecem"
 LibyaFocus.115.t: "[FROM.GetNameDef] Pede uma Aliança"
 LibyaFocus.115.d: "[FROM.GetNameDef] criou uma nova aliança para reunir a Irmandade Muçulmana. Devido aos nossos laços com a Irmandade, pediram que nos juntemos a ela. Devemos aceitar?"
 LibyaFocus.115.a: "Claro"
 LibyaFocus.116.t: "[FROM.GetNameDef] Junta-se à Irmandade"
 LibyaFocus.116.d: "[FROM.GetNameDef] aceitou nosso convite para se juntar à Irmandade Muçulmana."
 LibyaFocus.116.a: "Juntos somos mais fortes!"
 LibyaFocus.117.t: "[FROM.GetNameDef] Rejeita o Convite"
 LibyaFocus.117.d: "[FROM.GetNameDef] rejeitou nosso convite para se juntar à Irmandade Muçulmana."
 LibyaFocus.117.a: "Eles não são verdadeiros crentes"
 LibyaFamily.75.t: "A morte de Muammar Kadafi"
 LibyaFamily.75.d: "À medida que os rebeldes ganhavam cada vez mais terreno, era vital que nosso grande líder Muammar Kadafi se mudasse para um local mais seguro. No entanto, seu comboio foi (sem saber) emboscado pelos rebeldes. Kadafi tentou se esconder após o ataque, mas foi capturado pelos rebeldes. Foi espancado e torturado pelos rebeldes antes de sucumbir aos ferimentos. Vídeos e fotos da morte se espalharam por toda a internet. É este o fim?"
 LibyaFamily.75.d.airstrike: "À medida que os rebeldes ganhavam cada vez mais terreno, era vital que nosso grande líder Muammar Kadafi se mudasse para um local mais seguro. No entanto, durante o deslocamento para um novo local, o comboio foi atingido por um ataque aéreo da OTAN e logo foi assaltado por forças rebeldes. Kadafi tentou se esconder após o ataque, mas foi capturado pelos rebeldes. Foi espancado e torturado pelos rebeldes antes de sucumbir aos ferimentos. Vídeos e fotos da morte se espalharam por toda a internet. É este o fim?"
 LibyaFamily.75.a: "Jamais nos renderemos!"
 LibyaFamily.76.t: "Muhammad capturado pelos rebeldes"
 LibyaFamily.76.d: "Como parte de seu dever para com o pai, Muhammad ajudava a organizar as defesas do Exército Líbio em uma pequena cidade. Durante um ataque rebelde, seu quartel-general foi invadido. Segundo relatos, Muhammad tentou se render aos rebeldes, que não quiseram lhe fazer nenhum favor. Após tortura e espancamentos, foi executado pelo comandante rebelde. [LRB.GetNameDef] declarou que o objetivo era capturar Muhammad, não matá-lo, e que o comandante local agiu por conta própria."
 LibyaFamily.76.a: "Assassinos!"
 LibyaFamily.77.t: "Saif al-Islam apedrejado até a morte"
 LibyaFamily.77.d: "Em uma pequena cidade, Saif al-Islam fazia uma ronda inspecionando as tropas do pai, prometendo-lhes melhores armas e equipamentos. Sem que ele soubesse, porém, a unidade local já havia desertado para o lado rebelde. Ele foi rapidamente capturado e detido pelos rebeldes. Saif conseguiu escapar, mas logo se viu encurralado sem ter para onde ir. Em uma última tentativa de salvar a própria pele, fez um discurso apelando aos ex-soldados de Kadafi. Disse que a guerra foi criada pelo Ocidente e causada por facções tribais e islamistas agindo em suas próprias agendas, bêbados e drogados. Parece que um dos soldados considerou isso um insulto e atirou uma pedra em Saif. Outros logo se juntaram e, pouco depois, Saif jazia morto em uma poça de sangue."
 LibyaFamily.77.a: "Assassinos!"
 LibyaFamily.78.t: "Al-Saadi Kadafi morre em um ataque suicida"
 LibyaFamily.78.d: "Al-Saadi passava o tempo em um dos redutos de Kadafi, destinado a ser a última resistência do regime. Enquanto estava lá, foi alvo de um ataque suicida. Um piloto rebelde chamado Muhammad Mokhtar Osman lançou seu jato diretamente contra o prédio. Embora Al-Saadi aparentemente tenha sobrevivido à queda inicial, ele morreu mais tarde em algum lugar do prédio devido aos incêndios causados pelo ataque. Não está claro como o jato conseguiu chegar tão perto sem ser abatido."
 LibyaFamily.78.a: "Por que ninguém o abateu?!"
 LibyaFamily.79.t: "Mutassim Kadafi executado"
 LibyaFamily.79.d: "Mutassim se retirava de uma das cidades recentemente capturadas pelos rebeldes, mas a caminho do próximo posto militar seu comboio foi interceptado por rebeldes. Mutassim tentou se defender com uma pistola, mas foi ferido na garganta e se rendeu aos rebeldes. Uma discussão começou entre ele e seus captores, que lhe pediram que recitasse a shahada para obter o perdão de Deus. Em vez disso, Mutassim esfregou seu colar, um talismã mágico africano. Os captores repetiram a exigência, dizendo 'este é o Alcorão, a última coisa e a primeira coisa', mas Mutassim continuou rezando com seu talismã. Frustrados, seus captores atiraram nele e queimaram o colar."
 LibyaFamily.79.a: "E essa gente luta por uma Líbia 'livre'..."
 LibyaFamily.80.t: "Hannibal Kadafi morre de fome"
 LibyaFamily.80.d: "Hannibal Kadafi foi sequestrado de seu hotel certa noite, há algumas semanas. O sequestro foi orquestrado por um grupo de militantes xiitas que viajaram do Líbano até a Líbia. O porta-voz dos militantes disse que procuravam os assassinos de Musa al-Sadr, clérigo xiita e líder do Movimento Amal que desapareceu na Líbia em 1978. Hannibal não poderia ter se envolvido, pois tinha apenas dois anos de idade na época do desaparecimento, mas isso parecia importar pouco para seus captores. Como não conseguiram obter nenhuma informação de Hannibal, ele acabou sendo deixado vagando pelo deserto. Não encontrou nenhum povoado próximo e acabou morrendo de sede e fome. Foi encontrado mais tarde por um helicóptero militar que patrulhava a área."
 LibyaFamily.80.a: "O quê?!"
 LibyaFamily.81.t: "Ayesha Kadafi comete suicídio"
 LibyaFamily.81.d: "Quando os rebeldes se aproximaram do complexo controlado pelo governo onde Ayesha estava, sua mente estava tomada pelo pânico. Seus guarda-costas lhe disseram que a área ao redor do complexo havia sido cercada. Eles aconselharam que talvez o melhor curso de ação fosse simplesmente se render aos rebeldes. No entanto, Ayesha estava aterrorizada com o que fariam com ela se fosse capturada. Em um ato de desespero, ordenou que seus guarda-costas a trancassem com os filhos em um dos prédios do complexo e ateassem fogo. Os guarda-costas, relutantes, fizeram como mandado e incendiaram o prédio. Em seguida, entregaram-se aos rebeldes, explicando o que havia acontecido."
 LibyaFamily.81.a: "O quê?!"
 LibyaFamily.82.t: "Saif al-Arab morre em ataque aéreo"
 LibyaFamily.82.d: "Saif al-Arab foi morto em um ataque aéreo da OTAN, junto com três netos de Muammar Kadafi. A OTAN alega que o prédio atingido era usado como centro de comando e controle e que tinha um bunker subterrâneo. Mas quem coloca crianças em um bunker militar? Este é mais um ataque contra civis líbios por parte dos cães da OTAN, que martirizaram um dos maiores heróis da Líbia."
 LibyaFamily.82.a: "Como puderam fazer isso?"
 LibyaFamily.83.t: "Khamis Kadafi morto em tiroteio"
 LibyaFamily.83.d: "Enquanto organizava as defesas na linha de frente, Khamis foi morto em um tiroteio com os rebeldes. Sua posição foi assaltada agressivamente pelos rebeldes, que tentavam expulsá-lo e seus homens de um ponto-chave. Ao tentar se deslocar para uma posição melhor, Khamis foi atingido e ferido. Ele conseguiu continuar lutando por vários minutos antes de ser atingido novamente, desta vez na cabeça."
 LibyaFamily.83.a: "Ele era um lutador"
 LibyaCivilWar.15.t: "A Revolução Líbia"
 LibyaCivilWar.15.d: "As tentativas de Kadafi de sufocar os protestos fracassaram. A violência escalou a níveis elevados, unidades militares desertaram e uma nova coalizão de combatentes da oposição assumiu o controle de Benghazi. A situação agora só pode ser resolvida no campo de batalha."
 LibyaCivilWar.15.a: "Esses 'rebeldes' são apenas agentes da CIA. Destruam-nos!"
 LibyaCivilWar.15.b: "Abaixo Kadafi! Abaixo o ditador!"
 LibyaCivilWarContent.1.t: "Milícia tribal Warfalla"
 LibyaCivilWarContent.1.d: "A tribo Warfalla reside na Tripolitânia, concentrada em torno de Trípoli e Bani Walid, a única cidade da Líbia habitada por uma única tribo. Devido à ameaça de violência no país em consequência da guerra civil, a tribo mobilizou parte de seus membros para reforçar nossas forças."
 LibyaCivilWarContent.1.a: "Agradecemos o apoio deles"
 LibyaCivilWarContent.2.t: "Os Qadhadhfa oferecem apoio a [ROOT.GetLeader]"
 LibyaCivilWarContent.2.d: "Os Qadhadhfa são a tribo da família Kadafi. Estão localizados predominantemente perto da cidade de Sirte, e foi a conexão deles com o regime que permitiu à cidade crescer até os níveis de Trípoli ou Benghazi. Os Qadhadhfa sempre foram leais apoiadores de Kadafi e patrocinaram alguns combatentes adicionais para o nosso exército."
 LibyaCivilWarContent.2.a: "Agradecemos a lealdade deles"
 LibyaCivilWarContent.3.t: "Berberes se levantam contra o regime"
 LibyaCivilWarContent.3.d: "A fronteira da Líbia com a Tunísia abriga uma pequena comunidade de berberes. Sob o regime de Kadafi, seus direitos foram duramente suprimidos, e o próprio Kadafi negava a existência de uma etnia berbere e a chamava de 'produto do colonialismo'. Eles agora decidiram se levantar contra Kadafi na esperança de ver um futuro melhor para si mesmos."
 LibyaCivilWarContent.3.a: "Vamos tratá-los melhor"
 LibyaCivilWarContent.4.t: "Rebeldes berberes no oeste"
 LibyaCivilWarContent.4.d: "A fronteira da Líbia com a Tunísia abriga uma pequena comunidade de berberes. Sob o regime de Kadafi, seus direitos foram duramente suprimidos, e o próprio Kadafi negava a existência de uma etnia berbere e a chamava de 'produto do colonialismo'. Eles agora decidiram se levantar contra Kadafi e jurar lealdade aos rebeldes na esperança de ver um futuro melhor para si mesmos."
 LibyaCivilWarContent.4.a: "Eles nem sequer são reais!"
 LibyaCivilWarContent.5.t: "Milícia tribal Al-Mujabra"
 LibyaCivilWarContent.5.d: "A tribo al-Mujabra reside no oeste da Líbia, perto do distrito de Jabal al Gharbi. O general [LBA_abu_bakr_yunis_jabr.GetName], um membro notável dessa tribo, motivou alguns de seus membros a se mobilizarem e se juntarem ao nosso lado."
 LibyaCivilWarContent.5.a: "Agradecemos o apoio deles"
 LibyaCivilWarContent.6.t: "Milícia tribal Magarha"
 LibyaCivilWarContent.6.d: "A tribo Magarha é a segunda maior da Líbia, logo depois da tribo Warfalla. Embora a tribo seja originária de Fezzan, muitos de seus membros se mudaram para se estabelecer na cidade de Sirte e em outras áreas costeiras. Junto com os Warfalla, a maioria dos Magarha foi extremamente leal a Kadafi. Alguns de seus membros agora mobilizaram combatentes para nos apoiar."
 LibyaCivilWarContent.6.a: "Agradecemos o apoio deles"
 LibyaCivilWarContent.7.t: "Milícia tribal Hassawna"
 LibyaCivilWarContent.7.d: "A tribo Hassawna vive em Fezzan. A área que habitam fornece 60 por cento da água da Líbia. Preocupada com possível vandalismo e tomada de poços na região, a tribo nos forneceu alguns de seus combatentes para manter suas terras seguras."
 LibyaCivilWarContent.7.a: "Agradecemos o apoio deles"
 LibyaCivilWarContent.8.t: "[TUA.TUA_ali_kanna.GetName] se junta à luta"
 LibyaCivilWarContent.8.d: "[TUA.TUA_ali_kanna.GetName] comandou a Brigada especial Maghawir sob Kadafi. A brigada era composta por voluntários tuaregues do Níger e do Mali. [TUA.TUA_ali_kanna.GetName] agora entrou na Líbia com uma multidão de soldados tuaregues, declarando que lutarão ao nosso lado."
 LibyaCivilWarContent.8.a: "Obrigado pela ajuda!"
 LibyaCivilWarContent.9.t: "A TFSL se alia a nós"
 LibyaCivilWarContent.9.d: "A Frente Tubu para a Salvação da Líbia, ou TFSL, pegou em armas contra Kadafi. Eles vêm organizando um conflito de baixa intensidade contra o regime de Kadafi há alguns anos, mas finalmente podem lutar de forma mais aberta."
 LibyaCivilWarContent.9.a: "Vamos aceitá-los, eu acho"
 LibyaCivilWarContent.10.t: "Milícia tribal Farjan"
 LibyaCivilWarContent.10.d: "A tribo Farjan vive principalmente a oeste de Adjabiya, embora membros da tribo possam ser encontrados em toda a costa líbia. A má situação de segurança motivou a tribo a organizar uma milícia local para nos ajudar a combater nossos inimigos."
 LibyaCivilWarContent.10.a: "Agradecemos o apoio deles"
 LibyaCivilWarContent.11.t: "Milícia tribal Misurata"
 LibyaCivilWarContent.11.d: "A maior e mais influente tribo do leste da Líbia, os Misurata (que dão nome à cidade de Misrata), mobilizaram parte de seus soldados para nos ajudar. A tribo tem influência muito forte nas cidades de Benghazi e Derna, e teme que a guerra civil possa fazê-la perder essa influência."
 LibyaCivilWarContent.11.a: "Agradecemos o apoio deles"
 LibyaCivilWarContent.12.t: "Milícia tribal Abaydat"
 LibyaCivilWarContent.12.d: "Uma das principais tribos de Tobruk, a tribo Abaydat, é um conjunto de cerca de 15 subtribos. Para promover a coesão tribal, a tribo criou uma unidade conjunta de soldados de várias de suas subtribos para nos ajudar em nossa luta."
 LibyaCivilWarContent.12.a: "Agradecemos o apoio deles"
 LibyaCivilWarContent.13.t: "A Revolução começa!"
 LibyaCivilWarContent.13.d: "Abaixo Kadafi! Abaixo o ditador! Nosso povo se levantou contra o tirano e a revolução líbia pode começar! Devemos marchar até a capital do inimigo e criar um país livre!"
 LibyaCivilWarContent.13.a: "Pela Líbia!"
 LibyaCivilWarContent.13.tooltip: "§YÀ medida que a guerra se arrasta, cada vez mais milícias, exércitos privados e grupos rebeldes se juntarão à luta. Se quisermos manter o controle do país e evitar novos conflitos no futuro, devemos derrotar nossos inimigos rapidamente!§!"
 LibyaCivilWarContent.14.t: "Povo líbio em revolta"
 LibyaCivilWarContent.14.d: "Os sionistas e a CIA conseguiram: contrataram mercenários estrangeiros para incitar o povo a lutar contra o nosso regime. Como os iludidos e inocentes sofrerão por isso. Precisamos atacar rapidamente e cortar a cabeça da serpente antes que mais pessoas caiam na tentação do diabo."
 LibyaCivilWarContent.14.a: "Pela Líbia!"
 LibyaCivilWarContent.14.tooltip: "§YQuanto mais a guerra durar, mais soldados os rebeldes conseguirão mobilizar. Com o tempo, provavelmente ficaremos em inferioridade numérica§!"
 LibyaCivilWarContent.15.t: "Formação da Brigada Mártires de Abu Salim"
 LibyaCivilWarContent.15.d: "O Grupo Islâmico Combatente Líbio se opõe a Kadafi há décadas. Agora, com a revolta popular contra ele, o grupo mudou de nome para Movimento Islâmico Líbio e criou uma brigada de combatentes chamada Brigada Mártires de Abu Salim, sob o comando de Abdel-Hakim al-Hasidi. O grupo diz que busca uma abordagem mais democrática, mas os líderes admitiram abertamente que seus combatentes têm ligações com a Al-Qaeda. O tempo dirá se eles realmente buscam reformas ou não."
 LibyaCivilWarContent.15.a: "Tenho um mau pressentimento sobre isso..."
 LibyaCivilWarContent.15.tooltip: "§Y[Caliphate_L]§! passará a ser conhecido como §Y$LBA.Caliphate_reform$§!\n"
 LibyaCivilWarContent.16.t: "Fundação da Brigada de Trípoli"
 LibyaCivilWarContent.16.d: "Um exilado líbio da Irlanda, Mahdi al-Harati, junto com outros exilados de países de língua inglesa, formou o que vem sendo chamado de Brigada Revolucionária de Trípoli. A maior parte dos recrutas vem da região de Trípoli, daí o nome da unidade. A brigada recebeu treinamento extensivo de forças especiais do Catar. Desde o início da guerra, o Catar passou a ter um interesse mais ativo no país, muito provavelmente na esperança de espalhar a influência da Irmandade Muçulmana na região."
 LibyaCivilWarContent.16.a: "Finalmente algumas tropas de elite para o nosso exército"
 LibyaCivilWarContent.17.t: "Formação das Brigadas de Zintan"
 LibyaCivilWarContent.17.d: "Na cidade de Zintan, perto de Trípoli, revolucionários se uniram como o Conselho Militar dos Revolucionários de Zintan e formaram uma unidade para combater Kadafi. Eles são liderados por Osama al-Juwaili, ex-capitão do exército líbio. Segundo nossos relatórios de inteligência, as pessoas estão afluindo aos montes para suas bandeiras."
 LibyaCivilWarContent.17.a: "Finalmente algumas tropas de elite para o nosso exército"
 LibyaCivilWarContent.18.t: "Facciosismo no Exército de Libertação Nacional"
 LibyaCivilWarContent.18.d: "Quando iniciamos a revolução, muitas milícias e brigadas de voluntários precisaram ser colocadas sob uma única cadeia de comando, e assim criamos o Exército de Libertação Nacional. Havíamos nomeado um ex-general de Kadafi como seu chefe do estado-maior devido à sua experiência. No entanto, Khalifa Haftar, um exilado e comandante militar vindo dos Estados Unidos, retornou e se autoproclamou no comando do exército. Nossa posição oficial ainda é de apoio ao ex-general de Kadafi, mas Haftar mostra cada vez mais potencial no campo de batalha. Mas um homem que surge do nada e reivindica o comando de um exército é um homem ambicioso, e pode estar ansioso para reivindicar o comando de todo o país se tiver a chance."
 LibyaCivilWarContent.18.a: "Não podemos nos dar ao luxo de rivalidades!"
 LibyaCivilWarContent.19.t: "[ROOT.GetName] foi assassinado!"
 LibyaCivilWarContent.19.d: "[ROOT.GetName], a quem nomeamos chefe do estado-maior de nosso Exército de Libertação Nacional, foi assassinado! Não está claro como aconteceu, mas seu corpo, junto com o de dois outros oficiais, foi encontrado baleado e queimado nos arredores de [FROM.capital.GetCapitalVictoryPointName]. Alguns dizem que foi morto por agressores pró-Kadafi devido à sua traição a Kadafi. No entanto, outros dizem ter visto membros de uma milícia jihadista executando-o por causa do que ele fez a serviço de Kadafi. Seja como for, precisamos escolher um novo chefe do estado-maior. O general Haftar poderia ser uma boa escolha, mas isso só o fortaleceria ainda mais."
 LibyaCivilWarContent.19.a: "Haftar é a melhor escolha!"
 LibyaCivilWarContent.19.b: "Talvez outra pessoa"
 LibyaCivilWarContent.19.tooltip: "§YIsso reduzirá a capacidade de Haftar de minar nosso governo mais tarde!§!"
 LibyaCivilWarContent.20.t: "Nova Brigada dos Mártires"
 LibyaCivilWarContent.20.d: "Um novo grupo de jihadistas se uniu para formar uma unidade militar. Essas 'Brigadas dos Mártires' lutam por uma Líbia islâmica, e muitos dos combatentes têm fortes ligações com a Al-Qaeda ou outras organizações extremistas. Precisamos derrotar o governo rapidamente antes que nosso país seja inundado de potenciais terroristas."
 LibyaCivilWarContent.20.a: "De onde eles continuam vindo?"
 LibyaCivilWarContent.20.tooltip: "Criar uma §YUnidade Jihadista§! em §Y[ROOT.capital.GetName]§!\n"
 LibyaCivilWarContent.21.t: "Novos aliados para as Brigadas de Zintan"
 LibyaCivilWarContent.21.d: "Um novo grupo de milícia se juntou sob a bandeira das Brigadas de Zintan. As Brigadas de Zintan estão se tornando lentamente o grupo de milícia mais forte do país e, se não tomarmos cuidado, podem tentar tomar o controle."
 LibyaCivilWarContent.21.a: "Por que ninguém está do nosso lado?"
 LibyaCivilWarContent.21.tooltip: "Criar uma §YUnidade Islamista§! em §Y[ROOT.capital.GetName]§!\n"
 LibyaCivilWarContent.22.t: "Recrutas do Exército de Libertação Nacional"
 LibyaCivilWarContent.22.d: "O Exército de Libertação Nacional criou outra brigada de milícia para atender às suas necessidades. O alto escalão militar é composto principalmente por ex-oficiais de Kadafi que gostariam de ver uma Líbia mais secular no futuro."
 LibyaCivilWarContent.22.a: "O poder do exército cresce cada vez mais"
 LibyaCivilWarContent.22.tooltip: "Criar uma §YUnidade Secularista§! em §Y[ROOT.capital.GetName]§!\n"
 LibyaCivilWarContent.23.t: "Milícias pró-Ocidente treinadas"
 LibyaCivilWarContent.23.d: "Embora a maioria dos líbios deseje uma nação mais centrada no Islã, há alguns que desejam um governo mais orientado para o Ocidente. Com a ajuda de forças especiais e instrutores do Ocidente, uma pequena milícia profissional foi treinada. Ela agora está pronta para combater Kadafi."
 LibyaCivilWarContent.23.a: "O Ocidente está tentando nos subjugar?"
 LibyaCivilWarContent.23.tooltip: "Criar uma §YUnidade Reformista§! em §Y[ROOT.capital.GetName]§!\n"
 LibyaCivilWarContent.24.t: "Vitória na Guerra Civil!"
 LibyaCivilWarContent.24.d: "Kadafi foi derrotado, finalmente estamos livres do tirano! O Conselho Nacional de Transição deve agora iniciar a transição para um governo legítimo. Muitas milícias e grupos militantes precisam ser integrados. Também devemos organizar eleições para decidir quem governará a Líbia no futuro."
 LibyaCivilWarContent.24.a: "Um brinde ao futuro da Líbia!"
 LibyaCivilWarContent.24.b: "Eleições? Acho que não"
 LibyaCivilWarContent.24.tooltip: "§YRealizaremos eleições daqui a um ano§!"
 LibyaCivilWarContent.25.t: "Ansar al-Sharia assume o controle de Benghazi"
 LibyaCivilWarContent.25.d: "A Ansar al-Sharia é uma organização jihadista global. Durante a guerra civil, um braço local foi criado na Líbia e, aos poucos, o grupo vem ganhando poder. Ontem, uma imensa coluna da Ansar al-Sharia apareceu em Benghazi. Com quase duzentas picapes e outros equipamentos pesados, o grupo se reuniu na Praça Tahrir exigindo que a lei islâmica fosse estabelecida e que os planos de eleições fossem cancelados por serem 'não islâmicos'. O grupo montou postos de controle na cidade e enviou soldados para proteger os principais prédios administrativos e prestadores de serviços, como hospitais. Eles já anunciaram planos de estabelecer tribunais islâmicos e de se engajar em Da'wah, ou caridade, para a população local a fim de ganhar apoio."
 LibyaCivilWarContent.25.a: "De onde diabos eles vieram?"
 LibyaCivilWarContent.25.tooltip: "§YAnsar Al-Sharia§! assume o controle de §Y$STATE_395$§!\n"
 LibyaCivilWarContent.26.t: "Formado o Conselho Shura dos Mujahedins em Derna"
 LibyaCivilWarContent.26.d: "[ROOT.LBA_abdel_hakim_al_hasidi.GetName] criou a Brigada Mártires de Abu Salim a partir de ex-membros do LIFG para combater Kadafi. Logo após a guerra civil, [ROOT.LBA_abdel_hakim_al_hasidi.GetName] passou a se concentrar mais na política do que em liderar a milícia. Isso permitiu que um dos comandantes seniores da milícia, Salim Derby, tomasse o controle efetivo dela. Derby agora desertou junto com sua unidade e assumiu o controle da cidade de Derna, no leste da Líbia, juntamente com o grupo de milícia Jaysh al-Islam. Eles se autodenominaram Conselho Shura dos Mujahedins em Derna. Assim como a Ansar al-Sharia em Benghazi, o grupo começou a implantar a lei islâmica na cidade. Eles também se aliaram ao grupo de Benghazi. O leste da Líbia tem sido a principal fonte de combatentes islamistas do país, e parece que não há fim para eles."
 LibyaCivilWarContent.26.a: "Nunca deveríamos ter confiado neles"
 LibyaCivilWarContent.26.tooltip1: "Para representar melhor os vários grupos de islamistas sob sua asa, a §YAnsar al-Sharia§! criou o §YConselho Shura dos Revolucionários de Benghazi§!. Seu objetivo agora é criar conselhos semelhantes em outras partes do país\n"
 LibyaCivilWarContent.26.tooltip2: "§YLiwa Shuhada Abu Salim§! deserta para §Y[ASL.GetNameDef]§!\n"
 LibyaCivilWarContent.27.t: "$VICTORY_POINTS_1127$ cai nas mãos dos islamistas"
 LibyaCivilWarContent.27.d: "[ASL.GetNameDef] expandiu sua influência para a cidade costeira de $VICTORY_POINTS_1127$. A cidade é um dos principais centros de exportação e refino de petróleo dos campos petrolíferos de Wahat. Assim como em Benghazi, a lei islâmica está sendo implantada com rigoroso fervor pelos islamistas."
 LibyaCivilWarContent.27.a: "Não há como deter essa doença?"
 LibyaCivilWarContent.28.t: "Formada a Brigada Rafallah al-Sahati"
 LibyaCivilWarContent.28.d: "Uma nova milícia islamista foi formada no sul da Líbia. Composta por membros da Brigada Mártires de 17 de Fevereiro, a Brigada Rafallah al-Sahati começou a atuar em $STATE_1100$. Embora some menos de mil homens, está causando grande preocupação à população Tubu local."
 LibyaCivilWarContent.28.a: "Será que nos importamos mesmo com eles?"
 LibyaCivilWarContent.29.t: "$STATE_919$ se alinha a [ASL.GetNameDef]"
 LibyaCivilWarContent.29.d: "A área de $STATE_919$ era a principal base de apoio do regime de Kadafi. Com a queda do regime de Kadafi, muitos soldados, burocratas e administradores tiveram de voltar para casa sem nada além da roupa do corpo. Essa perda de direitos os tornou cada vez mais hostis ao novo governo. A situação agora escalou: um grupo de milícia pró-Kadafi que detém grande influência sobre a cidade de $VICTORY_POINTS_4047$ declarou lealdade a [ASL.GetNameDef]."
 LibyaCivilWarContent.29.a: "Não bastava nos livrarmos de Kadafi?"
 LibyaCivilWarContent.30.t: "[ASL.GetNameDef] ocupa $VICTORY_POINTS_6295$"
 LibyaCivilWarContent.30.d: "Um contingente de [ASL.GetNameDef] deslocou ontem um grande comboio de tropas de $STATE_919$ para $VICTORY_POINTS_6295$. Ao chegar, assumiram o controle da cidade e de seu aeródromo e, segundo relatos, algumas das milícias locais desertaram para o lado deles. $VICTORY_POIINTS_6295$ é um importante posto militar e, embora [ASL.GetNameDef] não tenham uma força aérea própria, controlar o aeródromo lhes permite usar aviões menores para reconhecimento. Isso torna difícil contra-atacar a cidade, e nosso alto comando militar recomenda um assalto aéreo."
 LibyaCivilWarContent.30.a: "Precisamos mesmo do aeródromo?"
 LibyaCivilWarContent.30.tooltip: "Enquanto §Y[ASL.GetNameDef] controlar o aeródromo§!, os ataques contra §Y$STATE_919$§! serão muito mais difíceis!"
 LibyaCivilWarContent.31.t: "[ROOT.LBA_abdel_hakim_al_hasidi.GetName] eleito para um cargo"
 LibyaCivilWarContent.31.d: "Desde que abriu nosso país à democracia, o [Caliphate_L] lançou vários candidatos nas eleições locais. Agora o líder da Brigada Mártires de Abu Salim, [ROOT.LBA_abdel_hakim_al_hasidi.GetName], foi eleito para um cargo local em Derna. Ao assumir o cargo, deixará a maior parte da gestão da brigada a cargo do seu segundo em comando, Salim Derby."
 LibyaCivilWarContent.31.a: "A democracia em ação"
 LibyaCivilWarContent.31.b: "Ainda precisamos dele no campo de batalha"
 LibyaCivilWarContent.32.t: "Nomeando um Ministro da Defesa"
 LibyaCivilWarContent.32.d: "Com o Exército Nacional Líbio sendo reconstruído, precisamos nomear um ministro da defesa. Para melhor efeito, devemos escolher um de nossos generais, pois eles têm a experiência de campo necessária para dirigir o cargo."
 LibyaCivilWarContent.32.a: "Talvez..."
 LibyaCivilWarContent.32.b: "Ou talvez..."
 LibyaCivilWarContent.33.t: "Comandante sequestrado"
 LibyaCivilWarContent.33.d: "Um de nossos comandantes militares foi sequestrado por uma milícia que atua em nosso país. Eles agora exigem resgate pela libertação. Poderíamos pagar o resgate, mas isso apenas legitimaria a milícia. Também poderíamos simplesmente ignorar as exigências, e o comandante provavelmente seria libertado por seus apoiadores. Poderíamos ainda enviar nossas forças especiais para resgatar o comandante, mas isso envolve alguns riscos."
 LibyaCivilWarContent.33.a: "Simplesmente pagar o resgate"
 LibyaCivilWarContent.33.b: "Seus apoiadores podem lidar com eles"
 LibyaCivilWarContent.33.c: "Enviar as forças especiais!"
 LibyaCivilWarContent.34.t: "Comandante procurado por crimes de guerra"
 LibyaCivilWarContent.34.d: "Um de nossos comandantes foi indiciado por crimes de guerra pelo Tribunal Penal Internacional. Com base em vários vídeos publicados na internet, o comandante executou pessoalmente, ou ordenou a execução de, pelo menos 33 pessoas enquanto comandava suas tropas na Líbia. Tanto os EUA quanto a UE colocaram o comandante sob sanções, e um alerta vermelho da Interpol foi emitido contra ele. Se não entregarmos o comandante ao TPI, também seremos alvo dessas sanções."
 LibyaCivilWarContent.34.a: "Devemos prendê-lo"
 LibyaCivilWarContent.34.b: "Ele não fez nada de errado"
 LibyaCivilWarContent.35.t: "Comandante planeja se aposentar"
 LibyaCivilWarContent.35.d: "Um de nossos comandantes anunciou que pretende se aposentar do serviço militar. Ele sente que, agora que a Líbia está livre de Kadafi, seu trabalho está feito. Planeja passar o resto de seus dias ajudando sua comunidade como político local, e não no campo de batalha."
 LibyaCivilWarContent.35.a: "Deixá-lo se aposentar"
 LibyaCivilWarContent.35.b: "Ainda precisamos dele"
 LibyaFocusNews.20.t: "Morte de Muammar Kadafi"
 LibyaFocusNews.20.d.airstrike: "O ditador da Líbia, Muammar Kadafi, foi morto. Enquanto tentava escapar dos rebeldes, seu comboio foi atacado por um ataque aéreo da OTAN. Depois que o comboio parou, também foi atacado por forças rebeldes. Os guardas de Kadafi foram mortos, e ele foi encontrado escondido em um cano de drenagem pelos rebeldes. As imagens horripilantes do evento mostram um Kadafi ensanguentado e machucado sendo arrastado pelos rebeldes, sendo violentado com uma baioneta e aparentemente sofrendo de um ferimento a bala. Kadafi pode ser ouvido dizendo a seus captores 'Deus proíbe isto' e 'O que eu fiz a vocês?', antes que as imagens finais o mostrem morto. Representantes da OTAN negaram saber que Kadafi fazia parte do comboio, e o porta-voz dos rebeldes afirmou que nenhuma ordem foi dada para matar Kadafi. O herdeiro de Kadafi, Saif al-Islam, jurou vingar o pai e continuar a luta pela Líbia."
 LibyaFocusNews.20.d: "O ditador da Líbia, Muammar Kadafi, foi morto. Enquanto tentava escapar dos rebeldes, seu comboio foi atacado por forças rebeldes. Os guardas de Kadafi foram mortos, e ele foi encontrado escondido em um cano de drenagem pelos rebeldes. As imagens horripilantes do evento mostram um Kadafi ensanguentado e machucado sendo arrastado pelos rebeldes, sendo violentado com uma baioneta e aparentemente sofrendo de um ferimento a bala. Kadafi pode ser ouvido dizendo a seus captores 'Deus proíbe isto' e 'O que eu fiz a vocês?', antes que as imagens finais o mostrem morto. O porta-voz dos rebeldes afirmou que nenhuma ordem foi dada para matar Kadafi. O herdeiro de Kadafi, Saif al-Islam, jurou vingar o pai e continuar a luta pela Líbia."
 LibyaFocusNews.20.a: "Será este o fim?"
