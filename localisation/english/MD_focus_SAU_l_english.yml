 SAU_aggressive_foreign_policy_01: "Assertive Foreign Policy"
 SAU_aggressive_foreign_policy_01_desc: "The kingdom pursues its interests aggressively. Military intervention, economic pressure, and diplomatic confrontation become standard tools."
 SAU_ahmed_clerical_blessing: "§HThe Clerical Blessing§!"
 SAU_ahmed_clerical_blessing_desc: "The §LCouncil of Senior Scholars§! receives Ahmed warmly. He is the §Lmost orthodox§! of his generation. He pledges to §Hdefend the sacred mosques§! and the Wahhabi orthodoxy. They pledge, in return, to §Hbless§! his rule."
 SAU_ahmed_consensus_decisions: "§HRule by Consensus§!"
 SAU_ahmed_consensus_decisions_desc: "Every decree passes through the §LSenior Council§!. Every reform must clear the §Lulema and the tribes§!. The kingdom moves §Lslowly§! - but it moves §Htogether, in one piece§!."
 SAU_ahmed_council_rule: "§HCouncil Rule§!"
 SAU_ahmed_council_rule_desc: "The §LAllegiance Council§! gains real power under Ahmed. The §LCouncil of Senior Princes§! gains more. The §LMajlis al-Shura§! gains its first §Helected§! members. A kingdom that is still a kingdom - but a §Lconsultative§! one."
 SAU_ahmed_no_yemen_war: "§HAvoid the Yemen War§!"
 SAU_ahmed_no_yemen_war_desc: "Ahmed refuses to launch the war Salman would have launched. The §LHouthis§! are an internal Yemeni problem, not a Saudi one. Aid is offered, mediation is provided, but §Hno bombs fall§!. The southern border stays §Gquiet§!."
 SAU_ahmed_old_alliances: "§HRevive the Old Alliances§!"
 SAU_ahmed_old_alliances_desc: "The kingdom's historic friends - §LJordan§!, §LMorocco§!, §LBahrain§!, §LKuwait§! - are courted with the kind of §Lpersonal diplomacy§! that died with Faisal. State visits. Royal weddings. The §HArab order of the 1970s§! quietly returns."
 SAU_ahmed_old_kingdom: "§HThe Old Kingdom§!"
 SAU_ahmed_old_kingdom_desc: "No Vision 2030. No NEOM. No Ritz-Carlton purge. No war in Yemen. Just the §Lold kingdom§! of the §L1970s§! and §L80s§!, run by the old §Lprinces§! the old way - quietly, conservatively, with §Hdignity§!."
 SAU_ahmed_quiet_diplomacy: "§HQuiet Diplomacy§!"
 SAU_ahmed_quiet_diplomacy_desc: "No press conferences. No grand summits. Ahmed's envoys travel quietly to §LDamascus§!, to §LTehran§!, to §LCairo§!. Differences are §Lsmoothed§! in private rooms. The kingdom speaks softly - and the region §Hlistens§!."
 SAU_ahmed_quiet_pact: "§HA Quiet Pact with Iran§!"
 SAU_ahmed_quiet_pact_desc: "Through quiet §LOmani§! mediation, Ahmed reaches an §Lunderstanding§! with §LTehran§!. No nuclear war. No proxy wars. No public statements. Just two empires §Hagreeing§! to leave each other alone for a while."
 SAU_ahmed_senior_council: "§HConvene the Senior Princes§!"
 SAU_ahmed_senior_council_desc: "Ahmed governs through the §LCouncil of Senior Princes§! - the §Lold men§! who remember the kingdom of §LFaisal§! and §LKhaled§!. Decisions are made slowly, by consensus, in long evening sessions over coffee and dates."
 SAU_ahmed_traditional_balance: "§HTraditional Regional Balance§!"
 SAU_ahmed_traditional_balance_desc: "The kingdom returns to the foreign policy of King §LFaisal§!: §LSunni-Shia balance§!, §LArab solidarity§!, §Lprudent friendship§! with the West. No grand crusades. No regional wars. Just the §Hold balance§!, slowly restored."
 SAU_ahmed_wahhabi_pact: "§HRenew the Wahhabi Pact§!"
 SAU_ahmed_wahhabi_pact_desc: "The §LAl ash-Sheikh§! - the descendants of §LMuhammad ibn Abd al-Wahhab§! - are restored to their old prominence. Religious courts regain authority. The §LGrand Mufti§! becomes a §Lpolitical§! voice once more. The pact of §L1744§! lives on."
