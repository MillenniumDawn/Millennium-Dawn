 Anti_Air_5: "MANPADS 2045"
 Anti_Air_5_desc: "Man-Portable Air-Defense Systems are shoulder-launched Surface-to-Air Missile Launchers. As the needs for portable weight places strict limits on missile sizes, they are short-ranged systems. They are thus a threat to low-flying Aircraft and lethal for Helicopters."
 SP_Anti_Air_5: "SP AA 2045"
 SP_Anti_Air_5_desc: "Short-Medium Range Vehicle Mounted Air Defence Systems can employ larger and thus longer ranged missiles than MANPADS, posing a threat to all aircraft. They can also carry more missiles. Such Anti-Air Systems are organized in dedicated Air Defence Platoons and Batteries."
