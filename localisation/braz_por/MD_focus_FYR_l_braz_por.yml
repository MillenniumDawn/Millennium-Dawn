l_braz_por:
 FYR_political.1.t: "Insurgência no Noroeste"
 FYR_political.1.d: "Militantes albaneses étnicos que se autodenominam Exército de Libertação Nacional tomaram a vila fronteiriça de Tanuševci, e os confrontos com as forças de segurança estão se espalhando em direção a Tetovo. Skopje teme que a guerra que poupou a Macedônia nos anos noventa finalmente tenha chegado."
 FYR_political.1.a: "Buscar por mediação internacional"
 FYR_political.1.b: "Esmagar a insurgência"
 FYR_political.2.t: "O Acordo-Quadro de Ohrid"
 FYR_political.2.d: "Governo e líderes dos partidos albaneses assinaram um acordo-quadro em Ohrid sob mediação ocidental. A língua albanesa ganha status oficial em municípios onde a minoria excede um quinto da população, o policiamento é descentralizado e os insurgentes entregarão suas armas aos coletores da OTAN sob anistia."
 FYR_political.2.a: "Poder compartilhado é melhor que guerra"
 FYR_political.3.t: "O Acordo de Prespa"
 FYR_political.3.d: "Às margens do Lago Prespa, negociadores de Skopje e Atenas rubricaram um acordo para encerrar a disputa de nome de décadas. O país passará a se chamar República da Macedônia do Norte, e em troca a Grécia suspende seu veto à adesão à OTAN e às negociações de adesão europeia."
 FYR_political.3.a: "Assinar e seguir o caminho euro-atlântico"
 FYR_political.3.b: "Nós não iremos renomear nossa nação"