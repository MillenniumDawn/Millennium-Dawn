name: Changelog Lint

on:
  pull_request:
    branches: [main]
    paths:
      - "Changelog.txt"
      - "tools/linting/check_changelog.py"
      - "tools/merge_changelog.py"
      - ".github/workflows/changelog-lint.yml"
  push:
    branches: [main]
    paths:
      - "Changelog.txt"
      - "tools/linting/check_changelog.py"
      - "tools/merge_changelog.py"
      - ".github/workflows/changelog-lint.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  changelog-lint:
    name: Changelog lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout: |
            Changelog.txt
            tools/linting/check_changelog.py
          sparse-checkout-cone-mode: false

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v6
        with:
          python-version: "3.12"

      - name: Check changelog ordering
        run: python3 tools/linting/check_changelog.py Changelog.txt
