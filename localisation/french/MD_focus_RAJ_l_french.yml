 indian_event.58.t: "Le Turkménistan rejette notre proposition !"
 indian_event.58.d: "Le Turkménistan a rejeté notre généreuse proposition. Nous devrons procéder seuls."
 indian_event.58.a: "Beurk !"
 RAJ_true_market: "Marché véritable"
 RAJ_balancing_approach_idea: "Approche équilibrée"
 RAJ_a_rising_power_idea: "Une puissance montante"
 RAJ_a_rising_power_idea_desc: "L’Inde est en plein essor dans le monde et, à mesure que nous devenons plus forts sur la scène internationale, l’œil vigilant des autres nations continue de nous observer."
 RAJ_pro_lgbtqa_stance_idea: "Position pro-LGBTQIA"
 RAJ_pro_lgbtqa_stance_idea_desc: "Notre gouvernement a adopté une position favorable aux droits LGBTQIA."
 RAJ_anti_lgbtqa_stance_idea: "Position anti-LGBTQIA"
 RAJ_anti_lgbtqa_stance_idea_desc: "Notre gouvernement a adopté une position hostile aux droits LGBTQIA."
 indian_event.59.t: "[FROM.GetName] a accepté notre offre de gazoduc !"
 indian_event.59.d: "[FROM.GetName] a accepté notre offre de gazoduc !"
