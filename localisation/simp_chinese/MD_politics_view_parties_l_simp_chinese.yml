 NIG.anarchist_communism_desc: ""
 NIG.Caliphate: "£NIG_salafist_jihadism 博科圣地"
 NIG.Caliphate_desc: "（萨拉菲圣战主义）- 博科圣地是一个萨拉菲极端组织，主要活动于尼日利亚东北部博尔诺州。该组织正式成立于2002年，倡导严格执行伊斯兰教法，并以建立伊斯兰哈里发国统一尼日利亚为幌子开展活动。博科圣地以针对尼日利亚政府和平民的暴力叛乱而闻名，已成为西非最危险、最知名的圣战组织之一，并与其他国际恐怖组织有联系。其名称大致翻译为“禁止西方教育”，反映了他们反对西方在该地区影响的立场。"
 NIG.Neutral_conservatism: "£NIG_non_aligned_conservative (PDP) - 人民民主党"
 NIG.Neutral_conservatism_desc: "中立保守派 - 人民民主党继续得到全国各地的支持。然而，它最大的力量来自南方占多数的基督教徒。它在意识形态上主要是支持新自由主义市场政策的中右翼政党。该党仍然是尼日利亚历史上最大的政党之一，并继续在政治战场上占据主导地位。"
