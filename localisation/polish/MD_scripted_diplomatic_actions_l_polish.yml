 OFFER_MIL_SPY_ACCESS_RECIEVER_LOC: "Oferują oni dostęp do swojego wojskowego systemu satelitarnego rozpoznania."
 OFFER_MIL_SPY_ACCESS_ACCEPTED_TITLE: "Oferta zaakceptowana!"
 OFFER_MIL_SPY_ACCESS_ACCEPTED_DESC: "Skorzystają oni z naszego wojskowego systemu satelitarnego rozpoznania."
 OFFER_MIL_SPY_ACCESS_REJECTED_TITLE: "Oferta odrzucona"
 OFFER_MIL_SPY_ACCESS_REJECTED_DESC: "Odrzucili naszą ofertę dostępu do naszego wojskowego systemu satelitarnego rozpoznania."
