 tech_combat_radar_5_desc: "Les améliorations apportées à nos systèmes radar nous ont permis d'avoir une meilleure visibilité pendant les combats et les patrouilles."
 tech_combat_sonar_1: "Sonar III"
 tech_combat_sonar_1_desc: "Les systèmes sonar permettent de détecter des objets sous l'eau et de mesurer la profondeur de l'eau en émettant des impulsions sonores et en détectant ou en mesurant leur retour après réflexion."
 tech_combat_sonar_2: "Sonar IV"
 tech_combat_sonar_2_desc: "Les systèmes sonar permettent de détecter des objets sous l'eau et de mesurer la profondeur de l'eau en émettant des impulsions sonores et en détectant ou en mesurant leur retour après réflexion."
