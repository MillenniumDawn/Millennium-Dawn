 SAU_events.110.t:0 "The Syrian Gambit Collapses"
 SAU_events.110.d:0 "The Free Syrian Army has been crushed. The rebels we armed and funded are scattered or dead, and Damascus stands unbroken. Years of treasure and credibility poured into Syria have bought the Kingdom nothing but a humiliating defeat and a regime that now leans harder on Tehran than ever."
 SAU_events.110.a:0 "A costly lesson."
 SAU_houthi_ceasefire_tt:0 "§GIf the Houthis accept, a ceasefire halts Operation Decisive Storm.§!\nThe Yemen war decisions are suspended and air support over Yemen ends. The truce can be broken at any time."
 SAU_events.111.t:0 "A Saudi Offer of Ceasefire"
 SAU_events.111.d:0 "Riyadh has put forward terms for a ceasefire. The Kingdom would halt its air campaign and end direct hostilities, leaving the Sana'a government to fight its own war. The offer sits on the table."
 SAU_events.111.a:0 "Accept the ceasefire"
 SAU_events.111.b:0 "The war goes on"
 SAU_events.112.t:0 "The Houthis Accept"
 SAU_events.112.d:0 "Sana'a has agreed to a ceasefire. Operation Decisive Storm is wound down and the Kingdom steps back from the Yemeni front. The truce will hold only as long as we wish it to."
 SAU_events.112.a:0 "A pause in the fighting"
 SAU_events.113.t:0 "The Houthis Refuse"
 SAU_events.113.d:0 "Sana'a has rejected our terms outright. The war in Yemen grinds on, and Operation Decisive Storm continues."
 SAU_events.113.a:0 "So be it"
 SAU_break_houthi_ceasefire:0 "Break the Ceasefire"
 SAU_break_houthi_ceasefire_desc:0 "Tear up the truce with the Houthis and resume Operation Decisive Storm."
 SAU_break_ceasefire_tt:0 "§RThe ceasefire is broken and Operation Decisive Storm resumes.§!\nThe Yemen war decisions return and air support over Yemen is restored."
 SAU_iraq_friendship:0 "The Saudi-Iraqi Friendship"
 SAU_events.114.t:0 "The Houthis Break the Ceasefire"
 SAU_events.114.d:0 "The truce is over. Emboldened and rearmed, Ansar Allah has torn up the ceasefire and resumed its attacks. The war in Yemen is back, whether the Kingdom wished it or not."
 SAU_events.114.a:0 "Then we fight"
 HOU_break_ceasefire_category:0 "The Saudi Ceasefire"
 SAU_houthi_break_ceasefire:0 "Break the Saudi Ceasefire"
 SAU_houthi_break_ceasefire_desc:0 "The Kingdom's guns have fallen silent, but the war is not won. Tear up the ceasefire and renew the offensive against the Saudis."
 SAU_ceasefire_locked_tt:0 "§RThe truce is too fresh to break. 180 days must pass since it was signed.§!"
 SAU_break_ceasefire_prepare_tt:0 "§YThe order is given. The ceasefire will end in 60 days as the Kingdom remobilizes for war.§!"
 SAU_reigning_monarch_unlocked_tt:0 "The Reigning Monarch decisions are now available. Each king rules with his own instruments; they pass with him."
 SAU_back_mbs_heir:0 "Back Mohammed bin Salman"
 SAU_back_mbs_heir_desc:0 "The King's own son, barely thirty and already gathering ministries around him. He is impatient, untested and utterly certain - and he does not intend to wait his turn."
 SAU_back_mbn_heir:0 "Back Mohammed bin Nayef"
 SAU_back_mbn_heir_desc:0 "The Crown Prince by right and by record. Interior Minister, architect of the campaign against Al-Qaeda, and the man Washington trusts. His claim rests on service rather than blood."
 SAU_heir_rally_support:0 "Rally Support for the Heir"
 SAU_heir_rally_support_desc:0 "Majlis by majlis, the case is made. Senior princes are visited, editors are briefed, and the succession is quietly argued out in private rooms long before it is announced."
 SAU_heir_undermine_mbs:0 "Undermine Mohammed bin Salman"
 SAU_heir_undermine_mbs_desc:0 "Whispers of recklessness: the war in Yemen, the money spent, the elders slighted. A young man in a hurry makes enemies faster than he makes allies."
 SAU_heir_undermine_mbn:0 "Undermine Mohammed bin Nayef"
 SAU_heir_undermine_mbn_desc:0 "Questions are raised about the Crown Prince's health, his stamina, his closeness to the Americans. Nothing is ever said outright; nothing needs to be."
 SAU_heir_mbs_maneuver:0 "The Young Prince Manoeuvres"
 SAU_heir_mbs_maneuver_desc:0 "Mohammed bin Salman is not waiting to be chosen. Portfolios accumulate, rivals are eased aside, and the Kingdom's business increasingly runs through his court."
 SAU_heir_mbn_maneuver:0 "The Crown Prince Manoeuvres"
 SAU_heir_mbn_maneuver_desc:0 "Mohammed bin Nayef leans on what he has: the Interior Ministry, the security files, and three decades of being the man who kept the Kingdom safe."
 SAU_events.115.t:0 "The Crown Prince is Named"
 SAU_events.115.d_mbs:0 "It is done. Mohammed bin Nayef is relieved of his offices and, before the cameras, kisses the hand of the young man who has displaced him. Mohammed bin Salman is Crown Prince, and the line of succession has jumped a generation. The senior princes say nothing. Saying nothing is itself an answer."
 SAU_events.115.d_mbn:0 "The order holds. Mohammed bin Nayef remains Crown Prince, his claim confirmed by the King and unchallenged in public. The younger man withdraws to his ministries, outmanoeuvred for now - and the Kingdom exhales."
 SAU_events.115.a:0 "Declare him King. He has waited long enough."
 SAU_events.115.b:0 "The time is not right. Let him serve as Crown Prince."
 SAU_events.116.t:0 "A New King in Riyadh"
 SAU_events.116.d_mbs:0 "King Salman is dead, and the throne passes to his son. Mohammed bin Salman rules the Kingdom outright at an age when most of his predecessors were still waiting for a ministry. The men who doubted him have long since been retired, arrested, or reconciled."
 SAU_events.116.d_mbn:0 "King Salman is dead, and the Crown Prince accedes as he was always meant to. Mohammed bin Nayef takes the throne with the security services behind him and a reputation built on keeping the Kingdom standing."
 SAU_events.116.a:0 "Long may he reign."
 SAU_salman_health_stable:0 "§HThe King's Health§! - §GStable§!"
 SAU_salman_health_stable_desc:0 "The King keeps his diary. He receives ambassadors, chairs the Council of Ministers, and reads every paper put before him. The court is orderly because the man at its centre still is."
 SAU_salman_health_declining:0 "§HThe King's Health§! - §YDeclining§!"
 SAU_salman_health_declining_desc:0 "Audiences are shorter now, and there are more of them cancelled than announced. Nothing has been said, but the schedule has quietly begun to thin."
 SAU_salman_health_serious:0 "§HThe King's Health§! - §YSerious§!"
 SAU_salman_health_serious_desc:0 "The King appears rarely and briefly, and the state television lingers on the moments where he is steady. Ministers take their instructions from the Royal Court rather than from the King himself."
 SAU_salman_health_critical:0 "§HThe King's Health§! - §RCritical§!"
 SAU_salman_health_critical_desc:0 "He no longer travels, and the Council meets without him more often than not. The palace issues photographs; the palace does not issue explanations. Everyone in Riyadh has begun making arrangements."
 SAU_salman_health_near_death:0 "§HThe King's Health§! - §RNear Death§!"
 SAU_salman_health_near_death_desc:0 "The King is dying, and the Kingdom is holding its breath. Governance has passed in all but name, the succession is the only subject anyone discusses, and no one will say so aloud until it is over."
 SAU_salman_royal_physicians:0 "Summon the Royal Physicians"
 SAU_salman_royal_physicians_desc:0 "Specialists are flown in from Europe and America, the schedule is cleared, and the King is given rest he has not taken in years. It buys time. It does not buy youth."
 SAU_salman_health_improve_tt:0 "§HThe King's Health§! §G+12§!"
 SAU_salman_burden_of_state:0 "Burden the King with State Business"
 SAU_salman_burden_of_state_desc:0 "Every file, every delegation, every ceremony that could be delegated is instead laid before the throne. He will not refuse the work, and there are those in the court who are counting on exactly that."
 SAU_salman_health_worsen_tt:0 "§HThe King's Health§! §R-12§!"
 SAU_salman_health_tier_stable:0 "§GStable§!"
 SAU_salman_health_tier_declining:0 "§YDeclining§!"
 SAU_salman_health_tier_serious:0 "§YSerious§!"
 SAU_salman_health_tier_critical:0 "§RCritical§!"
 SAU_salman_health_tier_near_death:0 "§RNear Death§!"
 SAU_salman_health_status:0 "§HThe King's Health§!: [GetSAUKingHealth]"
 SAU_salman_health_status_desc:0 "The King's condition is reported as [GetSAUKingHealth]. Time is the one adversary the Kingdom cannot outspend - and the day it wins, the Crown Prince becomes King."
 SAU_king_abdullah_category:0 "King Abdullah bin Abdulaziz"
 SAU_king_abdullah_category_desc:0 "Abdullah holds the Kingdom from the opening year - regent while Fahd lives, King in his own right from 2005. His death in January 2015 resolves the succession race, and whichever of §YSalman§!, §YMohammed bin Nayef§! or §YMutaib§! gathered the most influence inherits both the throne and his own set of directives. Use the §YCrown Prince§! decisions during his reign to decide which. Each directive occupies the court for §Y60 days§!, and no second directive can be issued until the first has run its course."
 SAU_king_salman_category:0 "King Salman bin Abdulaziz"
 SAU_king_salman_category_desc:0 "Salman's reign opens a second contest, §YMohammed bin Salman§! against §YMohammed bin Nayef§!, settled in June 2017 - where you may crown the winner at once or leave him Crown Prince. If you wait, he takes the throne when the King's health finally fails, by 2032 at the latest. Watch it in the §YCrown Prince§! tab, and prop him up or wear him down as you please. Each directive occupies the court for §Y60 days§!, and no second directive can be issued until the first has run its course."
 SAU_king_mbn_category:0 "King Mohammed bin Nayef"
 SAU_king_mbn_category_desc:0 "Reached two ways: push Mohammed bin Nayef ahead of Salman and Mutaib in the Abdullah-era succession race, or have him named Crown Prince under King Salman and outlive the King. Each directive occupies the court for §Y60 days§!, and no second directive can be issued until the first has run its course."
 SAU_king_mutaib_category:0 "King Mutaib bin Abdullah"
 SAU_king_mutaib_category_desc:0 "Reached only by winning the Abdullah-era succession race outright, ahead of both Salman and Mohammed bin Nayef - the outsider's path. No further succession is scripted beyond him. Each directive occupies the court for §Y60 days§!, and no second directive can be issued until the first has run its course."
 SAU_king_mbs_category:0 "King Mohammed bin Salman"
 SAU_king_mbs_category_desc:0 "Reached by backing Mohammed bin Salman in the Crown Prince race under King Salman, then either declaring him King outright in 2017 or waiting for Salman's health to fail. Each directive occupies the court for §Y60 days§!, and no second directive can be issued until the first has run its course."
 SAU_abdullah_kaust_grants:0 "Fund KAUST High-Tech Grants"
 SAU_abdullah_kaust_grants_desc:0 "The King's own university is handed a blank cheque and told to buy the best minds money can reach. Laboratories in Thuwal begin work the Kingdom has never attempted before."
 SAU_decree_abdullah_kaust_grants:0 "KAUST High-Tech Grants"
 SAU_decree_abdullah_kaust_grants_desc:0 "Research money is flowing faster than the committees can spend it, and the high-technology plants are running at full stretch."
 SAU_abdullah_kaec_construction:0 "Fast-Track KAEC Construction"
 SAU_abdullah_kaec_construction_desc:0 "King Abdullah Economic City rises out of the Red Sea coast on an accelerated schedule. Permits are waived, contractors are doubled, and the desert is told to hurry."
 SAU_decree_abdullah_kaec_construction:0 "KAEC Fast-Track"
 SAU_decree_abdullah_kaec_construction_desc:0 "Civil works across the Kingdom are being pushed through at the pace set on the Red Sea coast."
 SAU_abdullah_national_dialogue:0 "Convene National Dialogue Forums"
 SAU_abdullah_national_dialogue_desc:0 "Clerics, reformers, Shia notables and women are seated in the same room and invited to speak. Very little is decided; a great deal of pressure is released."
 SAU_decree_abdullah_national_dialogue:0 "National Dialogue Forums"
 SAU_decree_abdullah_national_dialogue_desc:0 "Grievances are being argued out in conference halls rather than in the street."
 SAU_abdullah_sang_subsidies:0 "SANG Modernization Subsidies"
 SAU_abdullah_sang_subsidies_desc:0 "The National Guard's vehicle contracts are underwritten from the royal purse. The Guard gets new armour at a discount, and remembers who paid for it."
 SAU_decree_abdullah_sang_subsidies:0 "SANG Modernization Subsidies"
 SAU_decree_abdullah_sang_subsidies_desc:0 "Subsidised contracts are holding down the price of armoured vehicles and keeping formations up to strength."
 SAU_abdullah_kasp_scholarship:0 "Extend the KASP Overseas Scholarship"
 SAU_abdullah_kasp_scholarship_desc:0 "Tens of thousands of Saudis are sent abroad on the state's money to study whatever the Kingdom lacks. Most come home. What they bring back is the point."
 SAU_decree_abdullah_kasp_scholarship:0 "KASP Overseas Scholarship"
 SAU_decree_abdullah_kasp_scholarship_desc:0 "A generation trained abroad is filtering back into the ministries, the universities and the firms."
 SAU_salman_cpsa_council:0 "Convene the Council of Political & Security Affairs"
 SAU_salman_cpsa_council_desc:0 "The old committees are swept away and one council is left standing, meeting in the King's own palace. Decisions that took months now take an afternoon."
 SAU_decree_salman_cpsa_council:0 "Council of Political & Security Affairs"
 SAU_decree_salman_cpsa_council_desc:0 "One council now signs off on politics and security alike, and the staff work moves at the speed of the man chairing it."
 SAU_salman_spark_park:0 "Subsidize King Salman Energy Park"
 SAU_salman_spark_park_desc:0 "SPARK is meant to make the Kingdom build what it has always bought: pumps, valves, drilling gear. Thirty square kilometres of it, outside Dammam."
 SAU_decree_salman_spark_park:0 "King Salman Energy Park"
 SAU_decree_salman_spark_park_desc:0 "Domestic energy manufacturing is squeezing more out of every field and every tank farm."
 SAU_salman_ksrelief:0 "Mobilize KSrelief Operations"
 SAU_salman_ksrelief_desc:0 "Aid convoys, field hospitals and food drops move out under the King's name and the Kingdom's flag. Charity abroad; legitimacy at home."
 SAU_decree_salman_ksrelief:0 "KSrelief Operations"
 SAU_decree_salman_ksrelief_desc:0 "Saudi relief flights are landing wherever the cameras are, and the goodwill is being counted carefully."
 SAU_salman_royal_decrees:0 "Issue Royal Structural Decrees"
 SAU_salman_royal_decrees_desc:0 "Ministries are merged, abolished and reinvented between one Thursday and the next. The state reorganises itself by decree because no one can refuse one."
 SAU_decree_salman_royal_decrees:0 "Royal Structural Decrees"
 SAU_decree_salman_royal_decrees_desc:0 "The machinery of government is being rearranged from the top, and it is moving when it is told to."
 SAU_salman_riyadh_metro_plan:0 "Expand the Riyadh Metropolitan Plan"
 SAU_salman_riyadh_metro_plan_desc:0 "Six metro lines, a ring of new districts and a capital rebuilt around them. Riyadh is to stop being a large town with ministries in it."
 SAU_decree_salman_riyadh_metro_plan:0 "Riyadh Metropolitan Plan"
 SAU_decree_salman_riyadh_metro_plan_desc:0 "The capital's building programme has set the tempo for construction everywhere."
 SAU_mbn_rehabilitation_center:0 "Activate the Prince Nayef Rehabilitation Center"
 SAU_mbn_rehabilitation_center_desc:0 "Detainees are handed to clerics, psychologists and their own families instead of to a firing squad. Some are talked out of it. Some walk straight back to the fight."
 SAU_decree_mbn_rehabilitation_center:0 "Prince Nayef Rehabilitation Center"
 SAU_decree_mbn_rehabilitation_center_desc:0 "Men who would have been martyrs are being returned to their families instead."
 SAU_mbn_special_security_forces:0 "Deploy Ministry of Interior Special Security Forces"
 SAU_mbn_special_security_forces_desc:0 "The Interior Ministry's own black-clad brigades deploy to the cities. They answer to the Minister, not to the army, and everyone understands why."
 SAU_decree_mbn_special_security_forces:0 "MOI Special Security Forces"
 SAU_decree_mbn_special_security_forces_desc:0 "The Interior Ministry's forces are on the streets, and anyone working against the Kingdom is finding it a great deal harder."
 SAU_mbn_western_intel_networks:0 "Activate Western Joint Intelligence Networks"
 SAU_mbn_western_intel_networks_desc:0 "Liaison cells in Riyadh, Langley and Vauxhall Cross share what they have. The Kingdom gives up secrets to buy better ones."
 SAU_decree_mbn_western_intel_networks:0 "Western Joint Intelligence Networks"
 SAU_decree_mbn_western_intel_networks_desc:0 "Shared take from allied services is filling in what Saudi collection cannot reach."
 SAU_mbn_border_surveillance:0 "Fortify Border Guard Surveillance Grids"
 SAU_mbn_border_surveillance_desc:0 "Towers, sensor fences and thermal cameras strung along the Yemeni and Iraqi frontiers. The desert stops being a place people can simply walk across."
 SAU_decree_mbn_border_surveillance:0 "Border Guard Surveillance Grids"
 SAU_decree_mbn_border_surveillance_desc:0 "The frontier is watched end to end, and troops on it are dug in behind prepared positions."
 SAU_mbn_mabahith_campaign:0 "Authorize Mabahith Counter-Subversion Campaign"
 SAU_mbn_mabahith_campaign_desc:0 "The General Investigation Directorate is turned loose on the Kingdom's own networks. Cells are rolled up, and so are a number of people who merely talked."
 SAU_decree_mbn_mabahith_campaign:0 "Mabahith Counter-Subversion Campaign"
 SAU_decree_mbn_mabahith_campaign_desc:0 "The Mabahith are running the Kingdom's communications and its dissidents alike."
 SAU_mutaib_janadriyah_festival:0 "Host the Janadriyah National Heritage Festival"
 SAU_mutaib_janadriyah_festival_desc:0 "Camel races, sword dances, poetry and a great deal of televised tribal ceremony. The National Guard hosts it, and the tribes remember whose festival it is."
 SAU_decree_mutaib_janadriyah_festival:0 "Janadriyah Heritage Festival"
 SAU_decree_mutaib_janadriyah_festival_desc:0 "The tribes have been feted, filmed and sent home content."
 SAU_mutaib_tribal_reserves:0 "Mobilize Tribal SANG Reserves"
 SAU_mutaib_tribal_reserves_desc:0 "The old levy, called in. Sheikhs deliver their quotas of men to the Guard as their fathers did, and are paid as their fathers were."
 SAU_decree_mutaib_tribal_reserves:0 "Tribal SANG Reserves"
 SAU_decree_mutaib_tribal_reserves_desc:0 "Tribal levies are filling the Guard's rolls faster than the recruiters could alone."
 SAU_mutaib_sang_procurement:0 "Fast-Track SANG Aviation & Armored Procurement"
 SAU_mutaib_sang_procurement_desc:0 "Apaches and armoured vehicles ordered straight into the Guard's inventory, ahead of the regular army's own queue. The Guard flies its own air wing now."
 SAU_decree_mutaib_sang_procurement:0 "SANG Aviation & Armored Procurement"
 SAU_decree_mutaib_sang_procurement_desc:0 "Guard contracts are being filled first, and at a price the regular army does not get."
 SAU_mutaib_capital_garrison:0 "Fortify the Capital Garrison Grid"
 SAU_mutaib_capital_garrison_desc:0 "The Guard rings Riyadh with checkpoints, armour and its own communications. It is a defence of the capital, and a guarantee about who holds it."
 SAU_decree_mutaib_capital_garrison:0 "Capital Garrison Grid"
 SAU_decree_mutaib_capital_garrison_desc:0 "Riyadh sits behind the Guard's own cordon, and nothing moves in the capital unobserved."
 SAU_mutaib_sang_logistics:0 "Autonomous SANG Logistics Management"
 SAU_mutaib_sang_logistics_desc:0 "The Guard stops drawing on army depots and runs its own supply chain end to end. Independence in logistics is independence in fact."
 SAU_decree_mutaib_sang_logistics:0 "Autonomous SANG Logistics"
 SAU_decree_mutaib_sang_logistics_desc:0 "The Guard feeds and fuels itself, and wastes a good deal less doing it."
 SAU_mbs_vision2030_blitz:0 "Launch Vision 2030 Campaign Blitz"
 SAU_mbs_vision2030_blitz_desc:0 "Billboards, conferences, glossy renderings and a slogan on every ministry wall. The Kingdom is told what it will become, loudly and continuously, until it believes it."
 SAU_decree_mbs_vision2030_blitz:0 "Vision 2030 Campaign Blitz"
 SAU_decree_mbs_vision2030_blitz_desc:0 "The whole country is being run at the tempo of the Crown Prince's programme."
 SAU_mbs_anticorruption_drive:0 "Execute the Anti-Corruption Drive"
 SAU_mbs_anticorruption_drive_desc:0 "Princes and billionaires summoned to a luxury hotel and invited to settle their accounts with the state. Billions return to the treasury; so does a lesson about where power now sits."
 SAU_decree_mbs_anticorruption_drive:0 "The Ritz-Carlton Settlements"
 SAU_decree_mbs_anticorruption_drive_desc:0 "The Kingdom's rich have been reminded that their money was never entirely their own."
 SAU_mbs_gami_localization:0 "Mobilize GAMI Defense Localization"
 SAU_mbs_gami_localization_desc:0 "Half the defence budget is to be spent inside the Kingdom by decree. Foreign primes are told to build here or lose the contract."
 SAU_decree_mbs_gami_localization:0 "GAMI Defense Localization"
 SAU_decree_mbs_gami_localization_desc:0 "Weapons are coming off Saudi lines instead of foreign ones, and the arms plants are multiplying."
 SAU_mbs_pif_neom:0 "Allocate PIF Funding to NEOM & Frontier Projects"
 SAU_mbs_pif_neom_desc:0 "The Fund's money is turned on the impossible ones: a linear city, a floating port, a mountain resort in a country with no snow. Some of it will even be built."
 SAU_decree_mbs_pif_neom:0 "NEOM & Frontier Projects"
 SAU_decree_mbs_pif_neom_desc:0 "Fund money is chasing the frontier programmes, and the roads and rails are going in ahead of them."
 SAU_mbs_aramco_liquidity:0 "Aramco Strategic Liquidity Allocation"
 SAU_mbs_aramco_liquidity_desc:0 "A slice of the world's most profitable company is moved where the Crown Prince can spend it. Aramco's board is informed rather than consulted."
 SAU_decree_mbs_aramco_liquidity:0 "Aramco Strategic Liquidity"
 SAU_decree_mbs_aramco_liquidity_desc:0 "Oil money is being moved straight into the state's hands, and industry has been freed from the trade ledger."
 SAU_debug_category:0 "DEBUG - Saudi Succession"
 SAU_debug_category_desc:0 "Test tools for the succession, reign and King Salman health systems. This category only exists in a debug build - it is invisible in a normal launch and in multiplayer."
 SAU_debug_king_abdullah:0 "DEBUG: Crown King Abdullah"
 SAU_debug_king_abdullah_desc:0 "Sets SAU_current_king to 1, installs Abdullah as country leader and reopens the Abdullah-era succession race (Salman 45 / MBN 30 / Mutaib 25)."
 SAU_debug_king_salman:0 "DEBUG: Crown King Salman"
 SAU_debug_king_salman_desc:0 "Sets SAU_current_king to 2, installs Salman as country leader, resets his health to 100 and opens the MBS-versus-MBN Crown Prince race."
 SAU_debug_king_mbn:0 "DEBUG: Crown Mohammed bin Nayef"
 SAU_debug_king_mbn_desc:0 "Sets SAU_current_king to 3 and installs Mohammed bin Nayef as country leader."
 SAU_debug_king_mutaib:0 "DEBUG: Crown Mutaib bin Abdullah"
 SAU_debug_king_mutaib_desc:0 "Sets SAU_current_king to 4 and installs Mutaib bin Abdullah as country leader."
 SAU_debug_king_mbs:0 "DEBUG: Crown Mohammed bin Salman"
 SAU_debug_king_mbs_desc:0 "Sets SAU_current_king to 5 and installs Mohammed bin Salman as country leader."
 SAU_debug_clear_decree_lock:0 "DEBUG: Clear the 60-Day Decree Lock"
 SAU_debug_clear_decree_lock_desc:0 "Clears SAU_royal_decree_active so the reigning monarch decisions can be taken again immediately, without waiting out the 60 days."
 SAU_debug_drain_salman_health:0 "DEBUG: Drain King Salman's Health"
 SAU_debug_drain_salman_health_desc:0 "Sets SAU_salman_health to 0. The accession chain fires on the next monthly tick, crowning whoever is currently Crown Prince."
 SAU_Faisaliste_1:0 "§OThe Faisalite Resurgence§!"
 SAU_Faisaliste_1_desc:0 "Faisal has been dead for a generation, and the men who buried him buried his programme with him. Now it comes back off the wall: austerity, self-reliance, and a Kingdom that speaks for the Ummah rather than for Washington."
 SAU_Faisaliste_10:0 "Centralization of the Provincial Emirates"
 SAU_Faisaliste_10_desc:0 "The provincial emirs have run their regions as private estates since the founding. Riyadh recalls their charters and issues new ones - shorter, revocable, and signed by the King."
 SAU_Faisaliste_2:0 "Increase the Ulema's Authority"
 SAU_Faisaliste_2_desc:0 "The scholars are restored to the councils they were quietly eased out of. Faisal ruled with the ulema at his shoulder, and his heirs will not pretend otherwise."
 SAU_Faisaliste_6:0 "Purge the Westernized Elite"
 SAU_Faisaliste_6_desc:0 "The ministries begin to fill with men educated in Riyadh rather than in Boston. Those who came home with foreign degrees and foreign habits find their files reviewed and their offices reassigned."
 SAU_Faisaliste_11:0 "The Sovereign Civil Service"
 SAU_Faisaliste_11_desc:0 "A bureaucracy that answers to the state rather than to the families that staffed it. Appointment by examination, promotion by record, and a great many cousins politely retired."
 SAU_Faisaliste_3:0 "The Virtue Committees Return"
 SAU_Faisaliste_3_desc:0 "The Committee for the Promotion of Virtue and the Prevention of Vice takes back the streets it lost. Its patrols are visible again, and so is the message they carry."
 SAU_Faisaliste_4:0 "Ban Foreign Media"
 SAU_Faisaliste_4_desc:0 "Satellite dishes come down, bureaux close, and the Kingdom's news is written in the Kingdom. What the world says about Saudi Arabia is no longer a domestic matter."
 SAU_Faisaliste_7:0 "The Foreign Bases Question"
 SAU_Faisaliste_7_desc:0 "Foreign flags still fly over Saudi soil, and every year they do is another year the sermons grow harder to answer. The Kingdom must decide what its sovereignty is actually worth.\n [USA.GetFlag] §B AMERICA!!§!"
 SAU_Faisaliste_12:0 "Reorganization of the Majlis ash-Shura"
 SAU_Faisaliste_12_desc:0 "The Consultative Council is enlarged, reseated and given real files to read. It still cannot bind the King - but it can now be blamed."
 SAU_Faisaliste_13:0 "The National Cadre Initiative"
 SAU_Faisaliste_13_desc:0 "A generation trained at home for the work foreigners have done since the boom. Saudi hands on Saudi machinery, whatever it costs in efficiency for the first ten years."
 SAU_Faisaliste_5:0 "The Closed Frontier"
 SAU_Faisaliste_5_desc:0 "Visas tighten, contracts lapse, and the expatriate quarters begin to empty. The Kingdom decides it would rather be poorer and its own."
 SAU_Faisaliste_8:0 "Sever the Western Pact"
 SAU_Faisaliste_8_desc:0 "The bases close and the foreign garrisons go home. Riyadh gains a sovereignty it can preach about, and loses a guarantee it may come to miss."
 SAU_Faisaliste_9:0 "The Base Retention Edict"
 SAU_Faisaliste_9_desc:0 "The arrangement stands. The Kingdom keeps its shield and its supply lines, and the ulema are told once again that necessity permits what principle forbids."
 SAU_Faisaliste_14:0 "The Fortress Kingdom"
 SAU_Faisaliste_14_desc:0 "Consolidated, purged and sealed. Whatever the Kingdom becomes from here it becomes on its own terms - the only question left is whether those terms face inward or outward."
 SAU_Faisaliste_22:0 "Islamic Solidarity Conference"
 SAU_Faisaliste_22_desc:0 "Riyadh convenes the Muslim world and pays for the hall. Faisal built the OIC out of exactly this: a summit, a communique, and a great deal of Saudi money."
 SAU_Faisaliste_15:0 "The Spirit of '73"
 SAU_Faisaliste_15_desc:0 "The year the oil weapon worked. The Kingdom remembers that it once made the West blink, and begins asking what else that leverage might buy."
 SAU_Faisaliste_18:0 "Eradicate Foreign Dependency"
 SAU_Faisaliste_18_desc:0 "Every import the Kingdom cannot make for itself is a hand at its throat. Substitution becomes doctrine, whatever the ledger says about comparative advantage."
 SAU_Faisaliste_24:0 "Reclaim the OIC Leadership"
 SAU_Faisaliste_24_desc:0 "Jeddah is the seat of the Organisation and Riyadh intends to act like it. The Kingdom stops funding the Muslim world's institutions and starts directing them."
 SAU_Faisaliste_23:0 "The Expatriate Workforce Question"
 SAU_Faisaliste_23_desc:0 "Nine million foreign workers hold up the economy and dilute the nation the Faisalites mean to rebuild. Something has to give, and it will be expensive whichever way it goes."
 SAU_Faisaliste_16:0 "The International Forums Question"
 SAU_Faisaliste_16_desc:0 "The United Nations, the Fund, the whole architecture drafted in 1945 by men who never consulted us. The Kingdom must decide whether to work inside it or turn its back on it."
 SAU_Faisaliste_19:0 "The Foreign Wealth Question"
 SAU_Faisaliste_19_desc:0 "Hundreds of billions parked in Western treasuries and Western banks - safe, profitable, and hostage. Bringing it home would be a statement. Leaving it there is a leash."
 SAU_Faisaliste_20:0 "The Domestic Supply Quota"
 SAU_Faisaliste_20_desc:0 "Every ministry, contractor and refinery is given a floor of Saudi-made content. The goods are worse and dearer, and they are ours."
 SAU_Faisaliste_25:0 "The Global Ummah Question"
 SAU_Faisaliste_25_desc:0 "A billion Muslims, and no one speaking for them with any authority. The Kingdom holds the two Holy Mosques - the question is whether that is a duty to discharge or a title to enjoy."
 SAU_Faisaliste_17:0 "The Superpower Engagement Question"
 SAU_Faisaliste_17_desc:0 "Two blocs, each convinced the Kingdom is theirs to lose. Riyadh can stand armed and equidistant between them, or stop buying from either and build the weapons itself."
 SAU_Faisaliste_21:0 "The Sovereign Aid Question"
 SAU_Faisaliste_21_desc:0 "Saudi money reaches every corner of the Muslim world. It can be given freely, as alms - or given with conditions attached, and conditions are how empires begin."
 SAU_Faisaliste_30:0 "The Third Way Doctrine"
 SAU_Faisaliste_30_desc:0 "Neither Washington nor Moscow: a bloc of the faithful, led from Riyadh, armed from its own factories and answerable to no one outside the Ummah. Faisal's programme, finally attempted in full."
 SAU_Faisaliste_29:0 "Splendid Isolation"
 SAU_Faisaliste_29_desc:0 "The Kingdom withdraws. No blocs, no clients, no crusades - only the frontier, the faith, and the oil. Faisal would not have recognised it, and that is rather the point."
 SAU_faisalite_score_interventionist:0 "§RInterventionist§!   §Y[?SAU_faisalite_interventionist|0]§!"
 SAU_faisalite_score_interventionist_desc:0 "Riyadh at the head of the Ummah - summits convened, clients underwritten, officers seconded to armies that are not ours. Two interventionist directives may run at once, and each pays out only when it has run its course. Carry this above the §OIsolationist§! count and the final pillar becomes §RThe Third Way Doctrine§!."
 SAU_faisalite_score_isolationist:0 "§OIsolationist§!   §Y[?SAU_faisalite_isolationist|0]§!"
 SAU_faisalite_score_isolationist_desc:0 "The frontier, the faith and the oil, and nothing whatever beyond them. Two isolationist directives may run at once, and each pays out only when it has run its course. Carry this above the §RInterventionist§! count and the final pillar becomes §OSplendid Isolation§!."
 SAU_faisalite_iso_buy_foreign_firms:0 "Buy Out the Foreign Companies"
 SAU_faisalite_iso_buy_foreign_firms_desc:0 "Every foreign firm operating inside the Kingdom is offered a price it cannot refuse and a date it cannot move. The Treasury pays, the ministries take the keys, and nobody currently employed knows how to run any of it."
 SAU_faisalite_iso_repatriate_reserves:0 "Repatriate the Sovereign Reserves"
 SAU_faisalite_iso_repatriate_reserves_desc:0 "The Kingdom's money comes home out of New York and London, by wire and at speed. The gain is enormous and so is the offence, and both were entirely predictable."
 SAU_faisalite_iso_cancel_visas:0 "Cancel the Foreign Labour Visas"
 SAU_faisalite_iso_cancel_visas_desc:0 "A million work permits lapse at once and are not renewed. The Kingdom will be more Saudi by the spring, and a good deal less finished."
 SAU_faisalite_iso_import_licences:0 "Ration the Import Licences"
 SAU_faisalite_iso_import_licences_desc:0 "The ministry issues fewer permits this quarter than last, and will issue fewer again. Shelves thin, prices climb, and Saudi substitutes appear that nobody would have bought at any other price."
 SAU_faisalite_iso_close_foreign_schools:0 "Shutter the Foreign Schools"
 SAU_faisalite_iso_close_foreign_schools_desc:0 "The international academies are closed and their pupils distributed among the state schools. The curriculum is now entirely ours, and entirely untested."
 SAU_faisalite_int_officers_abroad:0 "Second the Officer Corps Abroad"
 SAU_faisalite_int_officers_abroad_desc:0 "Saudi colonels are attached to half the armies of the Muslim world as advisers, trainers and quiet guarantors. They learn a great deal. So does everyone watching them arrive."
 SAU_faisalite_int_buy_satellite_channels:0 "Buy the Arab Satellite Channels"
 SAU_faisalite_int_buy_satellite_channels_desc:0 "The networks that the Arab world actually watches are bought outright and quietly re-staffed. The ulema are told it is a necessary evil, and are not persuaded."
 SAU_faisalite_int_pilgrimage_quotas:0 "Expand the Pilgrimage Quotas"
 SAU_faisalite_int_pilgrimage_quotas_desc:0 "The Hajj ceilings are lifted and the faithful arrive in numbers the city was never built for. Every one of them goes home having been a guest of the House of Saud."
 SAU_faisalite_int_endow_universities:0 "Endow the Foreign Universities"
 SAU_faisalite_int_endow_universities_desc:0 "Chairs of Islamic Studies from Cairo to Kuala Lumpur, funded in perpetuity from Riyadh. The endowment is generous and the reading list is not negotiable."
 SAU_faisalite_int_hard_currency_loans:0 "Lend in Hard Currency"
 SAU_faisalite_int_hard_currency_loans_desc:0 "Dollars are advanced to governments with nowhere else to go, on terms no bank would offer and no borrower will forget."
 SAU_faisalite_interventionist_dominant:0 "§RInterventionism Ascendant§!"
 SAU_faisalite_interventionist_dominant_desc:0 "Riyadh speaks and the Ummah listens. The summits, the subsidies and the seconded officers have made the Kingdom the axis of the Muslim world - and made it responsible for a great many quarrels that are not its own."
 SAU_faisalite_interventionist_leaning:0 "§RLeaning Interventionist§!"
 SAU_faisalite_interventionist_leaning_desc:0 "The Kingdom is spending abroad again and being heard for it. Faisal would recognise the direction, if not yet the scale."
 SAU_faisalite_balanced:0 "The Faisalite Balance"
 SAU_faisalite_balanced_desc:0 "Self-reliance at home, engagement abroad, and no commitment to either as doctrine. It is a comfortable place to stand and an impossible one to stay in."
 SAU_faisalite_isolationist_leaning:0 "§OLeaning Isolationist§!"
 SAU_faisalite_isolationist_leaning_desc:0 "The Kingdom is drawing in. Fewer foreign hands, fewer foreign obligations, and a diplomatic corps with less and less to do."
 SAU_faisalite_isolationist_dominant:0 "§OIsolationism Ascendant§!"
 SAU_faisalite_isolationist_dominant_desc:0 "The frontier is shut and the Kingdom is entirely its own. It answers to nobody, learns from nobody, and is spoken of abroad in the past tense."
 SAU_faisalite_nationalised_management:0 "Nationalised Management"
 SAU_faisalite_nationalised_management_desc:0 "The foreign managers are gone and their replacements are learning the job on it. The plants still run, after a fashion."
 SAU_faisalite_labour_shortage:0 "Labour Shortage"
 SAU_faisalite_labour_shortage_desc:0 "Half the scaffolding in the Kingdom stands empty. The men who held it have gone home, and the men who were meant to replace them have not arrived."
 SAU_faisalite_closed_schools:0 "The Schools are Closed"
 SAU_faisalite_closed_schools_desc:0 "The foreign curricula are gone and nothing has yet been written to replace them. A cohort will lose several years to the gap."
 SAU_faisalite_import_rationing:0 "Import Rationing"
 SAU_faisalite_import_rationing_desc:0 "Licences are issued sparingly and queues form outside the ministry. What the Kingdom cannot buy it must find at home, and it is finding rather more than expected."
 SAU_faisalite_officers_abroad:0 "The Officer Corps Abroad"
 SAU_faisalite_officers_abroad_desc:0 "The best of the staff are advising someone else's army. Their own formations notice the absence."
 SAU_faisalite_foreign_endowments:0 "Endowments Abroad"
 SAU_faisalite_foreign_endowments_desc:0 "Saudi money endows chairs and libraries in a dozen foreign universities, and Saudi students walk into them unopposed."
 SAU_faisalite_creditor_of_the_ummah:0 "Creditor of the Ummah"
 SAU_faisalite_creditor_of_the_ummah_desc:0 "Half the Muslim world owes Riyadh money, and none of it is due this year. Gratitude compounds faster than interest."
 SAU_faisalite_category:0 "The Faisalite Question"
 SAU_faisalite_category_desc:0 "Faisal ibn Abdulaziz was never an isolationist. He founded the Muslim World League, and when Al-Aqsa burned in 1969 he had the Muslim heads of state assembled at Rabat within weeks - the Organisation of the Islamic Conference was his doing. He opened the treasury to Egypt and Jordan at Khartoum after 1967, fought Nasser's expeditionary army to a standstill in the mountains of Yemen, chartered the Islamic Development Bank, and in 1973 turned the oil itself into a weapon and made the West feel it. Self-reliance was never his destination. It was his means - the strength a Kingdom needed before it could speak for the Ummah without asking anyone's leave.\n\nHis heirs inherit the doctrine without the man, and with it a question he never had to answer. §OIsolationism§! takes self-reliance as its own reward: a sealed frontier, no clients, no crusades, a Kingdom answerable to nobody. §RInterventionism§! takes it as Faisal did - a foundation, laid so that Riyadh may lead the faithful and stand armed between the blocs rather than behind either.\n\n§HWhere the Kingdom stands today§! - [ROOT.GetSAUFaisaliteLean]\n[ROOT.GetSAUFaisaliteLeanEffect]\n\n§HDirectives under way§!: §Y[?SAU_faisalite_active|0]§! of §Y2§!. Two may run at once, from either side, and each pays out only when it has run its course.\n\nFocuses, events and the decisions below all move these counts, and nothing here is bought cheaply. Whichever stands higher when the pillars are raised settles the last of them - §RThe Third Way Doctrine§! or §OSplendid Isolation§!."
 SAU_faisalite_slots_tt:0 "§HDirectives under way§!: §Y[?SAU_faisalite_active|0]§! of §Y2§!"
 SAU_faisalite_interventionist_dominant_label:0 "§RInterventionism Ascendant§!"
 SAU_faisalite_interventionist_dominant_effect:0 "+20% opinion gain, +15% political power gain and +5% research speed, bought with -5% consumer goods and §O-5% stability§!."
 SAU_faisalite_interventionist_leaning_label:0 "§RLeaning Interventionist§!"
 SAU_faisalite_interventionist_leaning_effect:0 "+10%% opinion gain and +5%% political power gain, at +2%% consumer goods."
 SAU_faisalite_balanced_label:0 "§HHeld in Balance§!"
 SAU_faisalite_balanced_effect:0 "+2% stability and +2% political power gain. Safe, and going nowhere."
 SAU_faisalite_isolationist_leaning_label:0 "§OLeaning Isolationist§!"
 SAU_faisalite_isolationist_leaning_effect:0 "+3% stability and +10% resource extraction, at §R-10% opinion gain§!."
 SAU_faisalite_isolationist_dominant_label:0 "§OIsolationism Ascendant§!"
 SAU_faisalite_isolationist_dominant_effect:0 "+5% stability and +15% resource extraction, bought with §R-5% construction speed, -5% research speed and -25% opinion gain§!."
 SAU_faisalite_gate_isolation_tt:0 "The §OIsolationist§! count must stand above the §RInterventionist§! count"
 SAU_faisalite_gate_thirdway_tt:0 "The §RInterventionist§! count must stand at least level with the §OIsolationist§! count"
 SAU_Monarchy_house_of_al_saud:0 "The House of Al Saud"
 SAU_Monarchy_house_of_al_saud_desc:0 "The House of Al Saud is the ruling family of the Kingdom of Saudi Arabia. It was founded by Abdulaziz Ibn Saud in 1932 and has since maintained control over the country through a combination of political alliances, religious legitimacy, and economic power derived from oil wealth."
 SAU_events.117.t:0 "The Expatriate Workforce Question"
 SAU_events.117.d:0 "Nine million foreign workers hold the Kingdom's economy upright. They lay the pipe, staff the hospitals, drive the lorries and fill the sites - and they are not, and will never be, of the nation the Faisalites mean to rebuild. The Council cannot agree whether they are a scaffold to be removed or a foundation to be built upon."
 SAU_events.117.a:0 "Send them home."
 SAU_events.117.b:0 "Naturalise the useful ones."
 SAU_events.118.t:0 "The International Forums Question"
 SAU_events.118.d:0 "The United Nations, the Fund, the Bank, the whole architecture drafted in 1945 by men who never thought to consult us. Every year the Kingdom sits in those rooms it lends them a legitimacy it gets very little back for. The alternative is to leave, and to be talked about rather than talked to. As King Wants to withdraw to focus on the Kingdom while the Al Shaura council act as his advisiors advide the king to stay to be in the global forums and to be a part of the world. The Council cannot agree whether the Kingdom should withdraw or stay."
 SAU_events.118.a:0 "Withdraw from what we did not write."
 SAU_events.118.b:0 "Work them from within."
 SAU_events.119.t:0 "The Foreign Wealth Question"
 SAU_events.119.d:0 "Hundreds of billions sit in Western treasuries and Western banks - safe, profitable, and entirely hostage. Bring it home and the Kingdom builds with it; leave it and the Kingdom keeps a seat at every table that matters. Both arguments are correct, which is the difficulty. We must focus those Moneys on the Kingdom's own development, or we must keep them where they earn and where they are safe."
 SAU_events.119.a:0 "Bring it all home."
 SAU_events.119.b:0 "Leave it where it earns."
 SAU_events.120.t:0 "The Global Ummah Question"
 SAU_events.120.d:0 "A billion Muslims, and nobody speaking for them with any authority whatever. The Kingdom holds Mecca and Medina, and the question the ulema will not stop asking is whether that is a duty to be discharged quietly or a mandate to be exercised loudly. As King Faisal once said, 'The Mosques are a duty, not a mandate.' and He Acted as the Defender of Islam, which spark the Pan-islamism, a counter to any nationalist Movement."
 SAU_events.120.a:0 "The Mosques are a duty, not a mandate."
 SAU_events.120.b:0 "We speak for the faithful."
 SAU_events.121.t:0 "The Superpower Engagement Question"
 SAU_events.121.d:0 "Two blocs, each entirely convinced the Kingdom is theirs to lose. Riyadh may stand armed and equidistant between them, taking from both and belonging to neither - or it may stop buying from either and build the weapons in its own factories, at its own cost, to its own worse specification. As we have seen, Faisal's successors have not been able to answer the question he never had to ask and we had now a choice to follow the same path or keep on our own tracks with the Western and Eastern Weapons"
 SAU_events.121.a:0 "The Self-Reliance Mandate."
 SAU_events.121.b:0 "Armed equidistance."
 SAU_events.122.t:0 "The Sovereign Aid Question"
 SAU_events.122.d:0 "Saudi money reaches every corner of the Muslim world - mosques, clinics, budgets, armies. Faisal gave it as alms and asked for nothing in writing. His heirs note that a cheque which asks for nothing buys nothing either. As we are facing a choice between the two, we must decide whether to give freely or to give with conditions that benefit the Kingdom and the Ummah alike. The ulema will not stop asking"
 SAU_events.122.a:0 "Alms, freely given."
 SAU_events.122.b:0 "Aid with conditions."
 SAU_faisalite_isolationist_tt:0 "§OIsolationist Doctrine§!: $RIGHT|+=0$"
 SAU_faisalite_interventionist_tt:0 "§RInterventionist Doctrine§!: $RIGHT|+=0$"
 SAU_events.123.t:0 "The Foreign Bases Question"
 SAU_events.123.d:0 "Foreign flags still fly over Saudi soil, and every year they do the sermons grow harder to answer. The garrisons guarantee the Kingdom against its neighbours and humiliate it before its own clergy in the same breath. The Council has run out of ways to postpone the decision."
 SAU_events.123.a:0 "Strike the foreign colours. They go home."
 SAU_events.123.b:0 "The arrangement stands. Necessity permits what principle forbids."
 SAU_events.123.a_tt:0 "Every foreign power loses military access to the Kingdom"
 SAU_events.124.t:0 "The Faisalite Resurgence"
 SAU_events.124.d:0 "When Faisal took the throne from his brother in 1964 he did it with a fatwa in hand and the Council of Ministers already reorganised beneath him - the mosque and the machinery moved in the same week. Saud had spent the Kingdom to the edge of bankruptcy; Faisal answered with an austerity nobody had asked for and a Ten-Point Programme nobody had voted on.\n\nThe programme is to be revived. The only question left is whose name it is revived in - the clergy remember the King who ruled with them, and the ministries remember the King who ran the state himself."
 SAU_events.124.a:0 "Proclaim it from the pulpit."
 SAU_events.124.b:0 "Proclaim it from the palace."
 SAU_events.125.t:0 "Centralization of the Provincial Emirates"
 SAU_events.125.d:0 "Abdulaziz bound the peninsula together with marriages and stipends, and left his sons governing provinces that were, in every practical sense, their own. Faisal spent eleven years prising the ministries loose from that arrangement and never entirely finished it.\n\nThe charters can be bought back at a price the Treasury will feel, or they can simply be revoked - which is cheaper, and makes enemies inside the family who will outlive the King who made them."
 SAU_events.125.a:0 "Buy out their charters."
 SAU_events.125.b:0 "Replace them outright."
 SAU_events.126.t:0 "Increase the Ulema's Authority"
 SAU_events.126.d:0 "Faisal governed with the scholars at his shoulder and paid for it in instalments. When he brought television to the Kingdom in 1965 his own nephew died attacking the station in Riyadh, and a decade later that man's brother walked into a majlis and shot the King dead. The alliance with the ulema was never decorative and never free.\n\nWhat they are given back now decides which Kingdom this is. The courts would make them arbiters of the law. The schools would make them authors of the next generation."
 SAU_events.126.a:0 "Give them the courts."
 SAU_events.126.b:0 "Give them the schools."
 SAU_events.127.t:0 "Purge the Westernized Elite"
 SAU_events.127.d:0 "The irony is lost on nobody: Faisal built the technocracy himself, sending Saudis to Cairo, London and California and handing them ministries when they came home. Zaki Yamani ran the oil portfolio with a Harvard degree in his pocket and did it better than anyone the Kingdom could have raised at home.\n\nBut the men returned with more than qualifications, and the Council now argues over whether the answer is the airport or the classroom."
 SAU_events.127.a:0 "Exile them."
 SAU_events.127.b:0 "Re-educate them."
 SAU_events.128.t:0 "The Sovereign Civil Service"
 SAU_events.128.d:0 "Before Faisal there was barely a state to staff. The Kingdom's finances ran through the King's own household and a handful of trusted merchants, and the difference between the treasury and the royal purse was a matter of opinion. He built ministries where there had been retainers.\n\nWhat the new bureaucracy is actually for was never settled. A service chosen by examination will be competent and will not be grateful. A service chosen by loyalty will be neither."
 SAU_events.128.a:0 "Appoint by examination."
 SAU_events.128.b:0 "Appoint by loyalty."
 SAU_events.129.t:0 "The Virtue Committees Return"
 SAU_events.129.d:0 "The Committee for the Promotion of Virtue and the Prevention of Vice was a scattering of local enforcers until the state gave it a budget, a uniform and a chain of command. Faisal needed the clergy reconciled to television, to girls' schools and to foreign engineers walking the streets of Dhahran, and the Committee was part of what he paid.\n\nIt has never quite been a police force, and has never quite not been one either."
 SAU_events.129.a:0 "Let them patrol in force."
 SAU_events.129.b:0 "Keep them advisory."
 SAU_events.130.t:0 "Ban Foreign Media"
 SAU_events.130.d:0 "Faisal fought his first media war against Nasser's Voice of the Arabs, which broadcast into Saudi barracks and told Saudi soldiers their King was an American servant. Riyadh answered with transmitters of its own and a great deal of money placed quietly with editors in Beirut and Cairo.\n\nThe lesson took: a broadcast cannot be argued with. It can only be jammed, or bought."
 SAU_events.130.a:0 "Jam the satellites."
 SAU_events.130.b:0 "Buy the networks."
 SAU_events.131.t:0 "Reorganization of the Majlis ash-Shura"
 SAU_events.131.d:0 "The Ten-Point Programme of 1962 promised the Kingdom a Consultative Council. Faisal ruled for thirteen more years and never convened one, and it fell to Fahd to finally seat it in 1992 - thirty years late, and appointed rather than elected.\n\nThe promise is being made again, and the composition is the whole of the argument. The notables would make it a court. A wider membership would make it something the court cannot entirely predict."
 SAU_events.131.a:0 "Seat the notables."
 SAU_events.131.b:0 "Widen the membership."
 SAU_events.132.t:0 "The National Cadre Initiative"
 SAU_events.132.d:0 "The boom was built by other people's hands - Yemeni labourers, Egyptian teachers, Palestinian clerks, and in time a million and more from South Asia. Faisal's answer was education on a scale the peninsula had never attempted: King Abdulaziz University opened in 1967, the scholarship programmes sent thousands abroad, and the Kingdom set about manufacturing its own middle class.\n\nWhat that class is manufactured for is the decision in front of the Council."
 SAU_events.132.a:0 "Technical institutes."
 SAU_events.132.b:0 "Military academies."
 SAU_events.133.t:0 "The Closed Frontier"
 SAU_events.133.d:0 "By the 1970s the foreign workforce was approaching a third of everyone inside the borders, and it was doing most of the work that kept the lights burning. Faisal took the labour and worried about the politics that came attached - the Palestinians brought the cause, the Yemenis brought numbers, and the Egyptians brought Nasser.\n\nSealing the frontier restores the nation to itself and hands the ministries a labour shortage for which they have no plan whatever."
 SAU_events.133.a:0 "Seal it entirely."
 SAU_events.133.b:0 "Admit whom we need."
 SAU_events.134.t:0 "The Fortress Kingdom"
 SAU_events.134.d:0 "Faisal's Kingdom was ringed by people who wanted it gone: Nasser's Egypt across the Red Sea, the republicans in Sanaa, the Ba'athists in Baghdad and Damascus, and a Soviet Union that had written the House of Saud off as a relic awaiting burial. He built the National Guard against the coup and bought American aircraft against the invasion, and was never entirely sure which would come first.\n\nThe Kingdom must now decide which threat it is actually preparing for."
 SAU_events.134.a:0 "Fortify the coast."
 SAU_events.134.b:0 "Fortify the interior."
 SAU_events.135.t:0 "Islamic Solidarity Conference"
 SAU_events.135.d:0 "When Al-Aqsa burned in August 1969, Faisal had the heads of the Muslim world assembled at Rabat within weeks, and the Organisation of the Islamic Conference existed before the year was out. It was the answer to Nasser's Arab League - not Arab and secular, but Muslim and led from Mecca.\n\nWhere the Kingdom convenes the faithful is itself the statement. The Holy Cities confer a legitimacy no conference hall abroad can lend."
 SAU_events.135.a:0 "Convene it in Mecca."
 SAU_events.135.b:0 "Convene it abroad."
 SAU_events.136.t:0 "The Spirit of '73"
 SAU_events.136.d:0 "On the seventeenth of October 1973 Faisal cut production and closed the taps to the United States. A barrel went from three dollars to nearly twelve inside a season, the West discovered precisely what its comfort was worth, and the Kingdom discovered it was holding a weapon it had never thought to fire.\n\nIt has not been fired since. The Ministry has kept the figures current the entire time."
 SAU_events.136.a:0 "Threaten the embargo openly."
 SAU_events.136.b:0 "Apply it quietly."
 SAU_events.137.t:0 "Eradicate Foreign Dependency"
 SAU_events.137.d:0 "The Kingdom pumps the oil, sells it abroad, and buys back everything it needs - including the pipe the oil moves through. Faisal's Five-Year Plans were meant to break that circle and largely succeeded at building the things which move oil faster.\n\nSubstitution has to begin somewhere, and where it begins decides what the Kingdom can do without asking anyone's permission."
 SAU_events.137.a:0 "Weapons first."
 SAU_events.137.b:0 "Everything else first."
 SAU_events.138.t:0 "Reclaim the OIC Leadership"
 SAU_events.138.d:0 "Faisal founded the Muslim World League in Mecca in 1962 and drove the Organisation of the Islamic Conference into being seven years later. Both were seated where Saudi money could reach them, and both were built to answer a pan-Arabism that had no room for kings.\n\nHis successors kept paying the bills and gradually stopped writing the agenda. Money buys deference; officials buy control. They are not the same thing."
 SAU_events.138.a:0 "Fund it."
 SAU_events.138.b:0 "Staff it."
 SAU_events.139.t:0 "The Domestic Supply Quota"
 SAU_events.139.d:0 "Aramco was made to buy Saudi where Saudi existed, and where it did not, the Kingdom paid foreign firms to build the factory that would make it. It was slow, it was expensive, and it remains the only way a country importing its own drill bits ever stops doing so.\n\nHow hard the floor is set decides whether the ministries comply, or simply learn to file exemptions."
 SAU_events.139.a:0 "A strict quota."
 SAU_events.139.b:0 "A phased quota."
 SAU_events.140.t:0 "The Faisalite Resurgence"
 SAU_events.140.d:0 "Fahd is buried and Abdullah is King in his own right at last, after ten years of ruling in another man's name. The succession is open, and the princes have already begun counting.\n\nThe King's own son comes to him with an argument rather than a claim. Miteb commands the National Guard - the tribal levies, the men from the interior, the force raised precisely because the regular army could not be trusted near a throne. He has been reading Faisal: the austerity, the self-reliance, the Kingdom that spoke for the Ummah and asked Washington's leave for nothing. The uncle who ruled that way was shot dead by his own nephew, and every man in the room knows it.\n\nFaisal's programme has no heir. Miteb is asking to be one."
 SAU_events.140.a:0 "Let him follow Faisal. The Guard will carry it."
 SAU_events.140.b:0 "Faisal's Kingdom died with Faisal. Let it rest."
 SAU_faisalite_path_tt:0 "Prince Miteb must have taken up Faisal's programme when the succession opened"
 SAU_mutaib_points_tt:0 "§HMiteb's standing in the succession§!: $RIGHT|+=0$"
 SAU_faisalite_ruler_tt:0 "Miteb bin Abdullah must sit on the throne"
