 advanced_production_modifier: "첨단 생산 제한"
 advanced_production_modifier_desc: "기술용 금속([?THIS.resource@tungsten|+]), 귀금속([?THIS.resource@chromium|+]), 석유([?THIS.resource@oil|+]), 고무([?THIS.resource@rubber|+])가 부족해지기 시작하면 마이크로칩 및 복합소재 생산에 타격을 입습니다. 어느 한 자원이라도 부족분이 생기면 마이크로칩 및 복합소재 생산이 감소합니다. 또한 마이크로칩 생산에는 막대한 전력이 필요하므로, 전력 부족은 생산을 [?unfulfilled_energy_demand_dynmod_var|%]만큼 추가로 감소시킵니다.\n\n§Y생산 감소폭은 기본 생산량의§! §R95%§!§Y를 상한으로 합니다.§!"
 civilian_microchip_consumption_modifier: "민간 및 산업용 마이크로칩 소비"
 civilian_microchip_consumption_modifier_desc: "기업과 일반 국민이 점점 더 많은 기술을 이용할 수 있게 됨에 따라, 우리 국민과 첨단 산업이 마이크로칩을 소비하기 시작할 것입니다. 이러한 수요를 충족하지 못하면 생산 라인이 어려움을 겪게 됩니다. 전시에는 민간 사용보다 군수 생산이 우선되지만, 국민의 수요가 충족되지 않아 불안이 발생할 수 있습니다."
 is_currently_importing_oil_tt: "[THIS.GetNameWithFlag]은(는) 현재 타국으로부터 §Y화석 연료§!를 수입하고 있습니다.\n"
 early_renewables_9: "첨단 풍력 터빈 제어"
 early_renewables_9_desc: "로터 앞쪽의 바람을 읽는 블레이드 센서와 라이다 덕분에 터빈은 돌풍이 닥치기 전에 피치와 요를 조정할 수 있습니다. 단지 전체가 하나의 체계로 제어되므로, 앞줄 터빈이 뒤쪽 터빈의 바람을 더 이상 가로채지 않습니다."
 renewables_9: "페로브스카이트 태양전지"
 renewables_9_desc: "실리콘 위에 쌓은 페로브스카이트 층이 실리콘만으로는 낭비되는 스펙트럼 일부를 포집하여 패널 효율을 30% 이상으로 끌어올립니다. 이 층은 저렴한 재료로 저온에서 만들어지므로, 효율 향상이 제조 비용에 거의 영향을 주지 않습니다."
 renewables_10: "조력 발전소"
 renewables_10_desc: "조류 수로에 고정한 터빈은 수년 전부터 시간표를 알 수 있을 만큼 규칙적으로 밀려왔다 빠지는 조류로 가동됩니다. 조력은 날씨에 좌우되지 않는 재생 가능 전력을 전력망에 공급합니다."
 renewables_11: "조력 발전 확장"
 renewables_11_desc: "부유식 플랫폼과 더 조밀한 터빈 배열 덕분에 조력은 좁은 수로 몇 곳을 넘어 열린 연안 해역까지 뻗어 나갑니다. 공용 해저 케이블과 표준 모듈 덕분에 새 배열을 만들 때마다 직전보다 비용이 줄어듭니다."
 renewables_12: "화산 에너지 발전소"
 renewables_12_desc: "활화산 근처에 뚫은 시추공은 마그마로 데워진 물을 끌어올려 기존 지열 지대보다 훨씬 높은 온도를 이용합니다. 이런 시추공 하나는 일반 지열 시추공의 몇 배에 달하는 출력을 낼 수 있습니다."
 renewables_13: "연약권 에너지 추출"
 renewables_13_desc: "활성 단층대를 따라 뚫은 깊은 시추공은 연약권의 뜨겁고 부분적으로 녹은 암석에 닿습니다. 그 깊이에서 뽑아내는 열은 고갈되지 않으며, 지각이 뚫을 수 있을 만큼 얇은 곳이라면 어디서든 이용할 수 있습니다."
 fuel_efficiency_7: "양자 연료 최적화"
 fuel_efficiency_7_desc: "양자 컴퓨터는 고전 컴퓨터가 근사만 할 수 있던 연소 화학을 분자 단위로 시뮬레이션합니다. 기술자들은 그 결과를 이용해 연료 단위당 더 많은 에너지를 방출하는 연료, 촉매, 버너를 설계합니다."
 fuel_efficiency_8: "AGI 도입"
 fuel_efficiency_8_desc: "범용 AI가 연료 구매와 정비 인력부터 전력망 급전까지, 발전소를 하나의 국가 규모 함대처럼 운용합니다. 부하는 항상 그 순간 연료를 가장 효율적으로 태우는 발전소로 옮겨 갑니다."
 fuel_efficiency_9: "특수 연료 나노섬유"
 fuel_efficiency_9_desc: "나노섬유 단열재가 보일러, 배관, 터빈 케이싱을 감싸 열이 증기를 일으킬 수 있는 순환 계통 안에 머물게 합니다. 발전소 벽으로 새는 에너지가 줄어, 연료 수송분 가운데 더 많은 몫이 발전기에 도달합니다."
 fuel_efficiency_10: "초지능 감시"
 fuel_efficiency_10_desc: "초지능 체계가 모든 발전소를 불꽃 하나, 터빈 날개 하나 수준까지 모델링하며 결함이 생기기 전에 바로잡습니다. 우리의 화력 발전은 연료를 태워 얻을 수 있는 현실적인 열역학적 한계에 도달합니다."
 energy_efficiency_9: "양자 에너지 효율"
 energy_efficiency_9_desc: "양자 기술을 활용하여 장비의 에너지 효율을 개선할 수 있습니다."
 energy_efficiency_10: "첨단 양자 효율"
 energy_efficiency_10_desc: "양자 기술의 최신 연구 성과를 적용하면 효율이 한층 더 향상됩니다."
 energy_efficiency_11: "양자 에너지 회수"
 energy_efficiency_11_desc: "양자 물리학에 대한 이해가 깊어지면서 원자 수준에서 에너지를 회수할 수 있게 되었습니다."
 energy_efficiency_12: "양자 에너지 추출"
 energy_efficiency_12_desc: "양자 거품의 변화를 추출하여 전기 에너지로 변환하는 것이 가능합니다. 우리는 에너지 손실을 에너지 이득으로 뒤바꾸었습니다!"
 CUR_UNEMPLOY_TT: "실업:"
 DISP_UNEMPLOY_NUM_TT: "국가 내 §R실업자 및 생계형 취업자§!의 총수를 표시합니다."
 DISP_UNEMPLOY_NUM: "§R[?ROOT.total_unemployed|3]§! §Y백만§!"
 ENERGY_POLICY_AUTOMATION_SHORT: "자동"
 ENERGY_POLICY_AUTOMATION_TT: "§Y자동 소비 정책§!\n주간 에너지 갱신 시 소비 정책을 한 단계씩 자동으로 조정합니다. 지속 가능한 순충족률이 §R95%§! 미만이면 제한을 강화하고, §G110%§!를 초과하면 제한을 완화하거나 소비를 늘립니다. 저장 용량이 없는 경우를 제외하고, 추가 소비는 배터리 저장량이 최소 §Y95%§! 이상 찬 경우에만 가능합니다. 에너지 수입과 확정된 수출은 포함되며, 배터리 방출량은 제외됩니다. 정책을 수동으로 선택하면 자동화가 해제됩니다."
