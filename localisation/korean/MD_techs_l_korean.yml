 nanofibers_14: ""
 nanofibers_14_desc: ""
 genetics_1: "DNA 지문 분석"
 genetics_1_desc: "DNA 지문 분석은 20세기 최고의 발명 중 하나였습니다. 지문 분석은 치안, 프로파일링 및 유전학 분야의 수많은 영역에서 중대한 진전을 이루는 데 기여했습니다."
 genetics_2: "현대 GMO"
 genetics_2_desc: "유전자 변형 생물(GMO)은 유전적으로 변형된 생물로, 작물, 가축, 과학 등 재배를 위한 여러 분야에서 활용될 수 있습니다."
 genetics_3: "유전자 치료"
 genetics_3_desc: "유전자 치료는 원하는 형질을 유전적으로 선별하고 바람직하지 않은 형질을 제거하는 과정입니다."
 genetics_4: "유전자 변형 작물"
 genetics_4_desc: "옥수수, 토마토 등 유전자 변형 작물은 병해충에 대한 내성 향상 등 기존 작물보다 더 뛰어난 장점을 갖도록 육종됩니다."
 genetics_5: "인간 게놈 프로젝트"
 genetics_5_desc: "인간 게놈 프로젝트의 지도 작성은 지구상에서 가장 복잡한 유전적 구성 중 하나를 밝히는 데 중요했습니다. 이 방대한 지식의 바다를 지도화하면 유전학 분야에서 우리의 지식이 더욱 크게 도약할 수 있습니다."
 genetics_6: "유전자 표적 살충제"
 genetics_6_desc: "유전자 표적 살충제는 해충의 특정 유전자나 식물이 분비하는 페로몬을 표적으로 삼아 벌레나 해충이 식물에 피해를 주는 것을 막는 데 쓰입니다."
 genetics_7: "합성 생명"
 genetics_7_desc: "유전자 기술의 발전으로 우리는 처음부터 생명을 창조할 수 있게 되었습니다."
 genetics_8: "안전한 복제"
 genetics_8_desc: "복제는 언제나 변덕스러운 일이었습니다. 복제된 개체에게도 상당히 위험합니다. 이 돌파구 이전에는 대부분이 유아기를 넘기지 못했습니다."
 genetics_9: "CRISPR 치료"
 genetics_9_desc: "CRISPR 치료는 세포에서 돌연변이를 제거하는 유전자 편집 기법입니다."
 genetics_10: "CRISPR 유전자 편집 작물"
 genetics_10_desc: "CRISPR 작물은 동물과 인간에 대한 CRISPR 치료와 비슷합니다. 다만 CRISPR 작물에서는 바람직한 작물 유전자를 강화하거나, 바람직하지 않은 형질을 제거합니다."
 genetics_11: "인간 대상 CRISPR 실험"
 genetics_11_desc: "이제 CRISPR를 활용하여 인간을 대상으로 실험을 시작할 때입니다."
 genetics_12: "유전자 변형 인간"
 genetics_12_desc: "인간을 이전보다 더 강하고, 더 뛰어나고, 더 빠르고, 더 건강하게 유전적으로 변형하면 우리가 앞으로 진화하는 데 도움이 됩니다."
 genetics_13: "초인"
 genetics_13_desc: "인간을 변형하면서 우리 종이 스스로를 바라보는 방식이 달라졌습니다."
 genetics_14: "초인 복제"
 genetics_14_desc: "초인이 부족합니까? 이제 복제할 수 있습니다!"
 genetics_15: "행성 간 적응력"
 genetics_15_desc: "초인의 적응력을 어디까지 끌어올릴 수 있을까요? 이제 우리는 다른 행성에 정착하여 이전에는 위험했던 환경에 적응할 수 있습니다."
 genetics_16: "우주인"
 genetics_16_desc: "우리 종족은 유전적 진화의 정점에 도달하여 우주를 여행할 수 있으며, 우주의 추위와 우주 방사선에도 면역입니다."
 crispr_1: "CRISPR"
 crispr_1_desc: "CRISPR는 주로 암 환자와 연구 개발에서 환자의 암을 표적으로 삼아 제거하는 방법으로 쓰이는 유전자 편집 기법입니다."
 crispr_2: "Cas9 유전자 편집"
 crispr_2_desc: "Cas9는 DNA 바이러스와 플라스미드에 대한 면역 방어에 관여하는 160킬로달톤 단백질입니다. 이 단백질을 편집하면 자연 방어력을 개선하는 데 도움이 되며 유전 공학 응용에서도 폭넓게 쓰입니다."
 crispr_3: "tracrRNA"
 crispr_3_desc: "트랜스 활성화 CRISPR RNA는 인간 병원체인 화농연쇄구균에서 처음 발견된 작은 트랜스 암호화 RNA입니다. 이 RNA는 바이러스와 플라스미드에 대한 방어의 기초를 형성하는 데 도움을 줍니다."
 crispr_4: "CRISPR 치료 실험"
 crispr_4_desc: "CRISPR 실험을 통해 유전자를 편집하는 과정을 더욱 개선할 수 있습니다."
 electrification_11: "심부 채굴 전기화"
 electrification_11_desc: "심부 채굴 전기화는 디젤 운반, 천공, 환기 보조, 보조 기계를 배터리 전기식, 트롤리 보조식, 전력망 구동식 체계로 대체하여 전력 수요를 늘리는 대신 연료 사용, 열, 지하 배출물을 줄입니다."
 electrification_12: "저궤도 혁명"
 electrification_12_desc: "저궤도 기반시설은 태양광 정거장, 전기 궤도 예인선, 자동 정비선을 도입하여 훨씬 적은 화학 추진제로 위성 재배치, 파편 제거, 화물 이송을 지원합니다."
 electrification_13: "고궤도 임무의 재고"
 electrification_13_desc: "고궤도 임무는 고출력 전기 추진과 자율 궤도 상승 체계를 사용하여 더 적은 연료로 위성과 화물을 정지궤도, 달 공간, 심우주 집결지로 이동시킵니다."
 electrification_14: "우주 여정의 재구상"
 electrification_14_desc: "첨단 우주 비행은 전기 추진, 고효율 동력 체계, 장기 에너지 저장의 활용을 확대하여 지구 궤도 너머의 지속적인 여정을 지원하며, 화물 및 탐사 임무에 필요한 연료 질량을 줄입니다."
 utility_scale_battery_storage_6: "양자 저장 최적화"
 utility_scale_battery_storage_6_desc: "양자 저장은 아직 개선의 여지가 있으며, 고효율 양자 셀에 더 조밀한 에너지 축적을 가능하게 합니다."
 utility_scale_battery_storage_7: "양자 극대화"
 utility_scale_battery_storage_7_desc: "에너지 저장 연구가 정점에 도달하여, 거의 물리적으로 불가능한 수준까지 한계를 밀어붙였습니다."
 fuel_refining7: "연료 정제 VII"
 fuel_refining7_desc: "바이오디젤과 범용 연료의 증류 방식을 추가로 개선하면 더 깨끗하고 효율적으로 연소하는 연료를 더 많이 얻을 수 있습니다."
 fuel_refining8: "연료 정제 VIII"
 fuel_refining8_desc: "공정에 AI 강화 분석을 적용하면 효율이 높아집니다."
 fuel_refining9: "연료 정제 IX"
 fuel_refining9_desc: "정제 공정에 대한 AI 세부 관리는 자원 낭비를 크게 줄입니다."
 fuel_refining10: "연료 정제 X"
 fuel_refining10_desc: "양자 컴퓨팅과 정제의 실시간 분석은 연료의 순도를 높입니다."
 fuel_refining11: "연료 정제 XI"
 fuel_refining11_desc: "초지능의 도움을 받은 화학 연구의 돌파구로 최대 효율의 연료를 생산할 수 있습니다."
 construction10: "건설 X"
 construction10_desc: "고도로 자동화된 건설 현장은 AI 일정 관리, 로봇 조립, 스마트 물류를 사용하여 기계, 자재, 인력을 조율함으로써 대규모 기반시설 개발 속도를 크게 향상시킵니다."
 construction11: "건설 XI"
 construction11_desc: "차세대 건설은 자가 감시 소재, 적응형 구조 부품, 자동 수리 체계를 통합하여 핵심 시설이 손상을 감지하고, 취약 지점을 보강하며, 압박 속에서도 가동을 유지할 수 있게 합니다."
 construction12: "건설 XII"
 construction12_desc: "미래 건설은 자율 건설 군집, 프로그래밍 가능한 소재, AI가 설계한 구조 체계를 사용하여 복원력 있는 초대형 사업, 강화된 군사 시설, 첨단 산업 단지를 신속하게 조립합니다."
 excavation10: "굴착 X"
 excavation10_desc: "AI 보조 굴착은 예측 지질학, 자동 천공 패턴, 최적화된 가공 흐름을 사용하여 복잡한 광상의 산출량을 늘리고 자재 손실과 장비 가동 중단 시간을 줄입니다."
 excavation11: "굴착 XI"
 excavation11_desc: "로봇 심부 채굴 체계는 자율 시추기, 적재기, 지도 작성 드론, 원격 운용 센터를 사용하여 더 깊고 위험한 광상을 개발하며, 위험한 환경에 노출되는 인원을 줄입니다."
 excavation12: "굴착 XII"
 excavation12_desc: "미래 굴착은 AI가 지휘하는 로봇 부대, 정밀 자원 지도 작성, 첨단 물질 분리 기술을 사용하여 고갈되었거나 복잡하거나 극한 환경에 있는 광상에서 금속, 광물, 전략 자원을 회수합니다."
 agriculture_10: "AGI 나노로봇"
 agriculture_10_desc: "농업용 AGI는 작물의 상태를 관리하고 해충을 퇴치하는 나노로봇 군단을 지휘합니다."
 agriculture_11: "인공 농업 서식지"
 agriculture_11_desc: "거의 전적으로 인공지능이 운영하는 대형 온실이 농업 부문에 혁신을 일으켜, 지구상 어디에서든 사실상 어떤 작물이든 생산할 수 있습니다."
 agriculture_12: "농업 초대형 복합단지"
 agriculture_12_desc: "농업 서식지의 추가 발전으로 이 개념은 한 국가의 생산 전체를 한 곳에 집중할 수 있는 초대형 구조물로 확장되었습니다."
 agriculture_13: "우주 농장"
 agriculture_13_desc: "지구상의 공간 제약 없이 농업 단지를 우주로 옮길 수 있습니다. 또한 우주 탐사를 손쉽게 뒷받침하고 우주 전역에 정착할 수 있게 해 줍니다."
 tech_diesel_power_systems_5: "초고급 디젤 엔진"
 tech_diesel_power_systems_5_desc: "초고급 디젤 동력 체계는 연료 유연성 연소, 합성 연료, AI 보조 엔진 제어를 사용하여 항속 능력을 유지하면서 배출가스, 열 신호, 기존 연료 군수에 대한 의존도를 줄입니다."
 tech_diesel_power_systems_6: "극초고급 디젤 엔진"
 tech_diesel_power_systems_6_desc: "극초고급 디젤 계열 동력 장치는 대체 연료 엔진, 통합 전기 추진, 에너지 저장, 자율 진단을 결합하여 장거리 함대와 에너지 집약적인 군함 체계에 효율적인 동력을 제공합니다."
 tech_power_systems_5: "초고급 제트 터빈 엔진"
 tech_power_systems_5_desc: "초고급 터빈 엔진은 적응형 연소 제어, 향상된 열효율, 통합 전기 추진을 사용하여 고속 기동 동력과 에너지 집약적 함정 체계를 위한 대용량 전기 출력을 모두 제공합니다."
 tech_power_systems_6: "극초고급 제트 터빈 엔진"
 tech_power_systems_6_desc: "극초고급 터빈-전기 동력 장치는 연료 유연성 터빈, 고급 열 회수, 자율 진단, 통합 전력 분배를 결합하여 미래의 군함을 구동하고 지향성 에너지 무기, 센서, 추진 부하를 뒷받침합니다."
 tech_nuclear_power_systems_5: "초고급 수상함 원자로"
 tech_nuclear_power_systems_5_desc: "초고급 수상함 원자로는 소형 원자로 설계, 고급 냉각 체계, 함정 전체의 전력 분배를 통합하여 정비 필요성을 줄이는 동시에 고에너지 레이더, 전자전, 지향성 에너지 무기를 뒷받침합니다."
 tech_nuclear_power_systems_6: "극초고급 수상함 원자로"
 tech_nuclear_power_systems_6_desc: "극초고급 수상함 원자로는 함정 수명 동안 교체가 필요 없는 연료 노심, 자율 모니터링, 대용량 통합 전력 체계를 결합하여 미래의 주력함에 신뢰할 수 있는 추진력과 극대화된 전기 출력을 제공합니다."
 tech_fusion_power_systems_1: "현대식 핵융합 엔진"
 tech_fusion_power_systems_1_desc: "초기 함정용 핵융합 동력 체계는 실험적인 소형 원자로 설계와 고효율 플라스마 제어를 적용하여 막대한 전기 출력을 제공하며, 기존 핵분열 원자로와 화석 연료 추진을 넘어서는 잠재적 경로를 제시합니다."
 tech_fusion_power_systems_2: "최첨단 핵융합 엔진"
 tech_fusion_power_systems_2_desc: "최첨단 핵융합 엔진은 더 강력한 자기 가둠, 고급 초전도체, 핵융합-전기 동력 분배를 통합하여 군함이 연료 의존도를 낮추면서 추진, 센서, 고에너지 무기를 지속할 수 있게 합니다."
 tech_fusion_power_systems_3: "초고급 핵융합 엔진"
 tech_fusion_power_systems_3_desc: "초고급 핵융합 엔진은 소형 원자로 노심, 자율 플라스마 제어, 통합 함정 전체 동력 체계를 사용하여 장기 항속 추진력과 미래 해군 기동 부대를 위한 막대한 전력 예비량을 제공합니다."
 tech_fire_control_5: "초고급 증강 미사일 레이더 통제"
 tech_fire_control_5_desc: "초고급 미사일 레이더 통제는 함정 레이더, 외부 센서, 드론, 위성, 함대 데이터링크를 하나의 공유 교전 상황도로 융합하여 군함이 복잡한 미사일 공격을 더 빠르고 정확하게 추적할 수 있게 합니다."
 tech_fire_control_6: "극초고급 증강 미사일 레이더 통제"
 tech_fire_control_6_desc: "극초고급 미사일 레이더 통제는 예측 전투 관리, 기계 속도의 위협 우선순위 지정, 자동 요격체 조율을 사용하여 포화 공격, 기동하는 무기, 극초음속 타격 체계로부터 방어합니다."
 tech_combat_radar_7: "레이더 VIII"
 tech_combat_radar_7_desc: "분산형 함정 레이더 네트워크는 함정 탑재 배열, 드론, 위성, 외부 센서를 하나의 공유 탐지 체계로 결합하여 함대가 단일 군함의 레이더 수평선 너머의 위협을 추적할 수 있게 합니다."
 tech_combat_radar_8: "레이더 IX"
 tech_combat_radar_8_desc: "미래형 전투 레이더는 AI 보조 신호 처리, 적응형 센서 융합, 예측 추적을 사용하여 분쟁 전투 공간 전반에서 은밀하고 기동하며 극초음속인 위협을 탐지, 분류, 교전합니다."
 tech_radar_jammer_5: "레이더 재밍 V"
 tech_radar_jammer_5_desc: "고급 함정 탑재 전자 공격 모음은 AI 보조 신호 분석, 적응형 파형 생성, 함대 단위 조율을 사용하여 현대의 레이더 네트워크에 대응합니다. 적의 방사 패턴을 분석하고, 기만용 거짓 표적을 만들며, 적응형 레이더와 미사일 탐색기를 실시간으로 교란할 수 있습니다."
 tech_combat_sonar_7: "음파탐지기 VIII"
 tech_combat_sonar_7_desc: "분산형 수중 감시 체계는 자율 센서, 환경 모델링, AI 보조 음향 분석을 사용하여 넓은 해역에 걸쳐 조용한 잠수함, 수중 드론, 어뢰를 추적합니다."
 tech_combat_sonar_8: "음파탐지기 IX"
 tech_combat_sonar_8_desc: "미래형 소나 체계는 군함, 무인 플랫폼, 해저 배열, 해양학 모델, 함대 데이터 네트워크를 연결해 분쟁 해역의 위협을 탐지, 분류, 추적하는 예측형 수중전 체계를 구성합니다."
 tech_naval_recon_drones_5: "해군 정찰 드론 V"
 tech_naval_recon_drones_5_desc: "네트워크화된 해군 드론 집단은 무인 항공기, 수상정, 수중 차량을 조율하여 넓은 해역을 감시하고, 함대 전반에 접촉 정보를 공유하며, 함정, 잠수함, 항공기, 미사일에 대한 센서-사수 연결 시간을 단축합니다."
 tech_naval_recon_drones_6: "해군 정찰 드론 VI"
 tech_naval_recon_drones_6_desc: "자율 해상 정찰 네트워크는 AI 보조 분류, 수동 감지, 협력 경로 설정을 사용하여 방사를 제한하고 요격을 회피하며 전자전에 적응하면서 적 병력을 추적합니다."
 tech_naval_recon_drones_7: "해군 정찰 드론 VII"
 tech_naval_recon_drones_7_desc: "미래의 해군 정찰 드론은 분산형 자율 감시 네트워크를 형성하여 공중, 수상, 수중, 함대 센서를 연결함으로써 분쟁 해역 전반에서 표적 추적을 유지하고 신속한 원거리 교전을 지원합니다."
 tech_rail_battery_3: "레일건 포대 III"
 tech_point_defense_system_7: "근접 방어시스템 VII"
 tech_point_defense_system_7_desc: "초고급 CIWS 체계는 AI 보조 사격 통제, 협력 센서 지시, 더 깊은 즉응 탄약고를 사용하여 포화 공격과 근거리 군집 위협 시 여러 포탑을 조율합니다."
 tech_point_defense_system_8: "근접 방어시스템 VIII"
 tech_point_defense_system_8_desc: "극초고급 CIWS 포는 예측 사격 통제, 스마트 탄약, 자율 표적 우선순위 지정, 함정 전체 센서 융합을 통합하여 포 기반 해군 방어의 적응형 최종 방어층을 이룹니다."
 tech_anti_drone_laser_3: "함재 근접 방어 레이저 III"
 tech_anti_drone_laser_3_desc: "고급 함재 레이저는 더 높은 출력의 발사기, 적응형 빔 제어, 개선된 대기 보정을 사용하여 드론, 유도 탄약, 미사일 탐색기와 더 먼 거리에서 더 높은 신뢰성으로 교전합니다. 통합 전력 체계 덕분에 기존 탄약고를 빠르게 소진하지 않고도 반복 사격이 가능합니다."
 tech_anti_drone_laser_4: "함재 근접 방어 레이저 IV"
 tech_anti_drone_laser_4_desc: "초고급 함재 레이저 방어는 다수의 발사기, AI 보조 표적 우선순위 지정, 함정 전체 에너지 관리를 연결해 조율된 지향성 에너지 방패를 이룹니다. 이 체계는 드론 및 미사일 포화 공격 중 센서, 기체, 조종면에 신속하게 피해를 입힐 수 있습니다."
 tech_turret_missiles_surface_7: "대함 미사일 2060"
 tech_turret_missiles_surface_7_desc: "극초고급 대함 미사일 체계는 극초음속 비행, 다중 스펙트럼 탐색기, AI 보조 표적 식별, 대응책 저항 유도를 사용하여 방호된 수상 전단과 포착하기 어려운 수중 위협을 격파합니다."
 tech_turret_missiles_surface_8: "대함 미사일 2075"
 tech_turret_missiles_surface_8_desc: "차세대 대함 미사일 체계는 적응형 자율성, 협력 일제 조율, 실시간 센서 융합을 사용하여 분쟁 해상 전투 공간 전반에서 적 함선을 식별하고, 우선순위를 정하고, 공격합니다."
 tech_turret_missiles_drone_4: "해군 군집 모듈 IV"
 tech_turret_missiles_drone_4_desc: "최첨단 군집 모듈은 센서 데이터를 공유하고, 표적을 할당하며, 통신이 열화된 상황에서도 공격 경로를 조정하는 자율 일회용 해군 드론을 발사합니다. 같은 일제 사격에 미끼, 재머, 타격 탑재체를 섞어 넣음으로써 적 방공망을 교란하고 과부하시키는 동시에 여러 방향에서 함정을 압박할 수 있습니다."
 tech_turret_missiles_aa_7: "롤링 에어프레임 미사일 2060"
 tech_turret_missiles_aa_7_desc: "최첨단 RAM 발사기는 AI 보조 위협 평가, 대응책 저항 유도, 네트워크 센서 지시를 사용하여 고속 및 저피탐 위협에 대응합니다."
 tech_turret_missiles_aa_8: "롤링 에어프레임 미사일 2075"
 tech_turret_missiles_aa_8_desc: "차세대 RAM 체계는 적응형 탐색기, 예측 사격 통제, 협동 교전 네트워크를 결합하여 미사일, 드론, 항공기에 대한 근거리 방어를 수행합니다."
 tech_vls_surface_7: "VLS 대지 공격 미사일 2060"
 tech_vls_surface_7_desc: "극초고급 VLS 타격 무기는 극초음속 또는 고초음속 비행 궤적, 적응형 유도, AI 보조 표적 식별을 사용하여 강화된 방어 시설을 격파하고 극한의 거리에서 핵심 표적을 타격합니다."
 tech_vls_surface_8: "VLS 대지 공격 미사일 2075"
 tech_vls_surface_8_desc: "차세대 VLS 대지 공격 미사일은 자율 임무 계획, 실시간 센서 융합, 협력 일제 조율을 결합하여 방어를 압도하고 분쟁 전구 전반에 정밀한 해군 화력을 전달합니다."
 tech_vls_aa_7: "VLS 지대공 미사일 2060"
 tech_vls_aa_7_desc: "극초고급 VLS 방공 체계는 AI 보조 위협 평가, 적응형 요격 궤적, 고기동 킬 비클을 사용하여 넓은 해상 전투 공간 전반에서 스텔스, 탄도, 극초음속 위협을 격파합니다."
 tech_vls_aa_8: "VLS 지대공 미사일 2075"
 tech_vls_aa_8_desc: "차세대 VLS 지대공 미사일은 예측 전투 관리, 자율 요격체 조율, 실시간 함대 센서 융합을 결합하여 항공기, 미사일, 드론, 임계 우주 위협, 고급 기동 무기에 대한 계층 방어를 제공합니다."
 tech_torpedoes_7: "2060년형 어뢰"
 tech_torpedoes_7_desc: "극초고급 어뢰는 AI 보조 표적 분류, 다중 모드 감지, 적응형 공격 궤적을 사용하여 실제 표적과 미끼를 구별하고 복잡한 수중 환경에서 위협을 추격합니다."
 tech_torpedoes_8: "2075년형 어뢰"
 tech_torpedoes_8_desc: "차세대 어뢰는 협력 수중 네트워킹, 예측 표적 추적, 자율 경로 계획, 고급 대응책 배제를 결합하여 센서가 포화된 해군 전투 공간 전반에서 함정과 잠수함을 사냥합니다."
 tech_drone_torpedoes_4: "드론 어뢰 V"
 tech_drone_torpedoes_4_desc: "고급 자율성은 드론 어뢰를 협력 수색, 더 지능적인 재공격 논리, 미끼 저항 능력을 갖춘 조율된 수중 사냥꾼으로 바꿔 놓습니다. 정교한 항적 유도와 다중 모드 탐색기를 통해 현대의 방어를 돌파하고 표적이 격침될 때까지 압박을 유지할 수 있습니다."
 tech_drone_torpedoes_5: "드론 어뢰 VI"
 tech_drone_torpedoes_5_desc: "고급 자율성은 드론 어뢰를 협력 수색, 더 지능적인 재공격 논리, 미끼 저항 능력을 갖춘 조율된 수중 사냥꾼으로 바꿔 놓습니다. 정교한 항적 유도와 다중 모드 탐색기를 통해 현대의 방어를 돌파하고 표적이 격침될 때까지 압박을 유지할 수 있습니다."
 tech_anti_torpedoes_4: "대어뢰 방어 IV"
 tech_anti_torpedoes_4_desc: "매우 발전된 대어뢰 모음은 고정밀 추적과 능동 대응책을 결합하며, 여기에는 충돌 전에 어뢰를 파괴하도록 설계된 하드킬 요격체도 포함됩니다. 네트워크 센서와 속사 방어 체계는 수중 공격의 결정력을 크게 떨어뜨려, 잠수함이 더 적은 성과를 위해 더 많은 무기를 투입하도록 강요합니다."
 tech_anti_torpedoes_5: "대어뢰 방어 V"
 tech_anti_torpedoes_5_desc: "초고급 대어뢰 모음은 고정밀 추적과 능동 대응책을 결합하며, 여기에는 충돌 전에 어뢰를 파괴하도록 설계된 하드킬 요격체도 포함됩니다. 네트워크 센서와 속사 방어 체계는 수중 공격의 결정력을 크게 떨어뜨려, 잠수함이 더 적은 성과를 위해 더 많은 무기를 투입하도록 강요합니다."
 tech_nuclear_torpedoes_4: "핵 어뢰 V"
 tech_nuclear_torpedoes_4_desc: "초고급 핵 어뢰 개념은 위협이 그 공포를 줄이지 않으면서도 생존 가능하고, 통제 가능하며, 정치적으로 사용 가능하도록 만드는 것을 목표로 합니다. 전략 지휘 체계와의 긴밀한 통합과 더 명확한 사용 규정을 통해, 이 무기는 해양 억제의 공식적인 기둥이 됩니다. 일단 배치되면 적은 자신감이 아닌 두려움에서 협상에 나서도록 강요받습니다."
 tech_landing_craft_8: "첨단 기술 상륙정"
 tech_landing_craft_8_desc: "최신 기술 발전의 적용은 상륙정의 작전 능력을 높여 줍니다."
 tech_landing_craft_9: "첨단 기술 상륙정 II"
 tech_landing_craft_9_desc: "최신 기술 발전의 적용은 상륙정의 작전 능력을 높여 줍니다."
 tech_landing_craft_10: "첨단 기술 상륙정 III"
 tech_landing_craft_10_desc: "최신 기술 발전의 적용은 상륙정의 작전 능력을 높여 줍니다."
 corvette_hull_7: "2055년형 초계함 선체"
 corvette_hull_7_desc: "군함으로 간주되는 가장 작은 등급의 선박인 초계함급 함정은 일반적으로 '원양' 해군의 일부가 아닙니다. 이 작고 빠른 함정은 보통 다양한 무기로 무장하여 여러 임무를 수행할 수 있습니다. 소규모 및 중규모 해군에게는 저렴한 비용 덕분에 많은 국가가 초계함을 운용할 수 있습니다. 주로 연안 방어 및 감시, 소해, 대잠, 대공, 대함, 그리고 현대에는 대지 공격 임무에 사용됩니다."
 corvette_hull_8: "2070년형 초계함 선체"
 corvette_hull_8_desc: "군함으로 간주되는 가장 작은 등급의 선박인 초계함급 함정은 일반적으로 '원양' 해군의 일부가 아닙니다. 이 작고 빠른 함정은 보통 다양한 무기로 무장하여 여러 임무를 수행할 수 있습니다. 소규모 및 중규모 해군에게는 저렴한 비용 덕분에 많은 국가가 초계함을 운용할 수 있습니다. 주로 연안 방어 및 감시, 소해, 대잠, 대공, 대함, 그리고 현대에는 대지 공격 임무에 사용됩니다."
