 MER_VEN_tariff_alignment: "Alignement tarifaire pour le Venezuela"
 MER_VEN_tariff_alignment_desc: "Financer la revue tarifaire et la coordination administrative nécessaires pour aligner davantage le Venezuela sur le régime douanier du bloc.$MER_full_membership_step_one_desc$"
 MER_VEN_customs_system_modernization: "Modernisation du système douanier pour le Venezuela"
 MER_VEN_customs_system_modernization_desc: "Fournir le financement et le soutien technique nécessaires pour moderniser l'administration douanière vénézuélienne en vue d'une adhésion pleine au MERCOSUR.$MER_full_membership_step_two_desc$"
 MER_VEN_common_standards: "Soutenir l'adoption de normes communes au Venezuela"
 MER_VEN_common_standards_desc: "Soutenir le travail réglementaire et technique final nécessaire pour que le Venezuela adopte les normes communes du MERCOSUR.$MER_full_membership_step_three_desc$"
 MER_PRU_logistics_corridor: "Développer un corridor logistique pour le Pérou"
 MER_PRU_logistics_corridor_desc: "Financer la première étape d'un corridor logistique dans la capitale du Pérou pour préparer le pays à une intégration plus profonde au MERCOSUR.$MER_full_membership_step_one_desc$"
 MER_PRU_cross_border_transport: "Améliorer le transport transfrontalier avec le Pérou"
 MER_PRU_cross_border_transport_desc: "Étendre les liaisons de transport terrestre avec le Pérou et renforcer l'infrastructure nécessaire à l'adhésion.$MER_full_membership_step_two_desc$"
 MER_PRU_port_connectivity: "Renforcer la connectivité portuaire du Pérou"
 MER_PRU_port_connectivity_desc: "Investir dans la connectivité numérique et logistique de la capitale du Pérou pour soutenir un marché régional plus intégré.$MER_full_membership_step_three_desc$"
 MER_BOL_logistics_corridor: "Développer un corridor logistique pour la Bolivie"
 MER_BOL_logistics_corridor_desc: "Financer la première étape d'un corridor logistique dans la capitale de la Bolivie pour préparer le pays à une intégration plus profonde au MERCOSUR.$MER_full_membership_step_one_desc$"
 MER_BOL_overland_transport: "Étendre les réseaux de transport terrestre de la Bolivie"
 MER_BOL_overland_transport_desc: "Soutenir de nouvelles améliorations du transport terrestre dans la capitale bolivienne pour rendre l'adhésion concrètement visible.$MER_full_membership_step_two_desc$"
 MER_BOL_border_connectivity: "Améliorer la connectivité frontalière de la Bolivie"
 MER_BOL_border_connectivity_desc: "Investir dans la connectivité numérique et logistique des frontières en Bolivie dans le cadre de son paquet d'adhésion.$MER_full_membership_step_three_desc$"
 MER_PAN_logistics_corridor: "Développer un corridor logistique pour le Panama"
 MER_PAN_logistics_corridor_desc: "Financer les bases d'un corridor logistique dans la capitale du Panama afin que l'adhésion produise des gains de transport immédiats.$MER_full_membership_step_one_desc$"
 MER_PAN_port_transport: "Renforcer le transport portuaire du Panama"
 MER_PAN_port_transport_desc: "Soutenir les modernisations de transport portuaire au Panama pour améliorer le mouvement des marchandises entre les marchés du MERCOSUR.$MER_full_membership_step_two_desc$"
 MER_PAN_trade_connectivity: "Améliorer la connectivité commerciale du Panama"
 MER_PAN_trade_connectivity_desc: "Investir dans la connectivité commerciale et numérique au Panama comme dernière étape de son paquet d'adhésion.$MER_full_membership_step_three_desc$"
 MER_ECU_development_funds: "Contribuer aux fonds de développement pour l'Équateur"
 MER_ECU_development_funds_desc: "Libérer un paquet de développement adossé au Trésor pour l'Équateur afin de démontrer la valeur économique d'une adhésion pleine.$MER_full_membership_step_one_desc$"
 MER_ECU_civilian_industry: "Investir dans l'industrie civile de l'Équateur"
 MER_ECU_civilian_industry_desc: "Parrainer un nouveau projet d'investissement civil dans la capitale de l'Équateur, dans le cadre de son chemin vers le statut de membre à part entière.$MER_full_membership_step_two_desc$"
 MER_ECU_infrastructure_development: "Soutenir le développement des infrastructures en Équateur"
 MER_ECU_infrastructure_development_desc: "Soutenir une amélioration ciblée des infrastructures dans la capitale de l'Équateur afin de renforcer sa préparation à l'adhésion.$MER_full_membership_step_three_desc$"
 MER_GUY_development_funds: "Contribuer aux fonds de développement pour le Guyana"
