 australian_jobs_act: "§2澳大利亚就业法§!"
 julia_gilard_desc: "吉拉德出生于威尔士，是一位活动家和法律合伙人，她一路晋升，最终成为澳大利亚政府的第一位女领导人。\n\n吉拉德最初是维多利亚州工党左翼社会主义派的成员，她凭借与商界的广泛联系而崭露头角。这得益于她多年担任工业律师的经验。在传统上由男性主导的领域中，吉拉德克服重重困难，尽管她未婚且没有任何宗教信仰，但她最终打破了议会的固有格局。\n\n无论她走向何方，党内都带着忐忑不安的心情跟随，因为这将偏离传统的确定性。任何一个失误都可能打破该党来之不易的稳定，甚至在吉拉德的领导生涯正式开始之前就将她拉下马。"
