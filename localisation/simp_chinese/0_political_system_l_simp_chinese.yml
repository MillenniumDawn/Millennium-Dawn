 generic.Western_Autocracy: "£generic_Western_Autocracy_small 亲西方专制"
 generic.Western_Autocracy_desc: "亲西方专制主义指的是一系列与西半球地缘政治利益相一致的非民主、威权主义意识形态。"
 generic.Western_Autocracy_icon: "£generic_Western_Autocracy_small"
 generic.conservatism: "£generic_conservatism_small 保守派"
 generic.conservatism_desc: "保守主义指的是一系列温和的右翼意识形态，这些意识形态强调传统文化、团结和稳定的生活方式的重要性。保守主义者往往反对国家干预社会和经济事务，并且通常认为减少监管将促进民众的社会流动性。"
 generic.conservatism_icon: "£generic_conservatism_small"
 generic.liberalism: "£generic_liberalism_small 自由派"
 generic.liberalism_desc: "自由主义是一种中间派意识形态，它倡导个人权利，强调自由而非国家权力的扩张。自由主义者倾向于在自由市场经济框架内，支持与世界其他地区进行自由贸易的进步社会政策。"
 generic.liberalism_icon: "£generic_liberalism_small"
 generic.socialism: "£generic_socialism_small 社会民主派"
 generic.socialism_desc: "社会民主主义指的是一系列广泛的左翼意识形态，它们比大多数自由主义分支更强调经济和社会正义。社会民主主义者力求使资本主义人性化，以遏制不平等和压迫，并促进民主。"
 generic.socialism_icon: "£generic_socialism_small"
 generic.anarchist_communism: "£generic_anarchist_communism_small 左翼激进主义者"
 generic.anarchist_communism_desc: "左翼激进主义涵盖了极左意识形态的广泛领域，其通常主张终结资本主义和全球化。虽然有些人可能支持武装抵抗，但许多人认为自己只是比社会民主党人“更左”，并且接受自由民主。"
 generic.anarchist_communism_icon: "£generic_anarchist_communism_small"
 generic.Conservative: "£generic_Conservative_small 反动派"
 generic.Conservative_desc: "反动派指的是一系列极右翼意识形态，其目标比温和保守派更为激进。反动派通常信奉一种理想化的过去，并试图通过复仇主义、领土收复主义意识形态和侵略性军事政策来恢复国家昔日的辉煌。"
 generic.Conservative_icon: "£generic_Conservative_small"
 generic.Autocracy: "£generic_Autocracy_small 专制者"
 generic.Autocracy_desc: "专制政治指的是一系列非民主的、专制的政治制度，在这些制度中，一个统治者或一群特权精英控制着所有的政治权力。"
 generic.Autocracy_icon: "£generic_Autocracy_small"
 generic.Mod_Vilayat_e_Faqih: "£generic_Mod_Vilayat_e_Faqih_small 温和派什叶派革命者"
 generic.Mod_Vilayat_e_Faqih_desc: "温和派什叶派革命者指的是一系列右翼什叶派信徒，他们坚持严格解读什叶派伊斯兰教义，但比其强硬派同僚支持更大的政治多元化。尽管如此，他们大多支持神权政治的延续。"
 generic.Mod_Vilayat_e_Faqih_icon: "£generic_Mod_Vilayat_e_Faqih_small"
 generic.Vilayat_e_Faqih: "£generic_Vilayat_e_Faqih_small 强硬派什叶派革命者"
 generic.Vilayat_e_Faqih_desc: "强硬派什叶派革命者指的是一系列奉行严格什叶派伊斯兰教教义的极右翼和好战的什叶派信徒。他们对逊尼派普遍持负面看法，并力图确保什叶派伊斯兰教在神权国家中得以延续。"
 generic.Vilayat_e_Faqih_icon: "£generic_Vilayat_e_Faqih_small"
 generic.Kingdom: "£generic_Kingdom_small 亲建制派萨拉菲主义"
 generic.Kingdom_icon: "£generic_Kingdom_small"
 generic.Kingdom_desc: "某些萨拉菲主义流派，例如瓦哈比主义和马德哈尔主义，主张维护现状，反对激进革命和武装圣战。这些萨拉菲派与库特比派圣战分子一样持有原教旨主义和不宽容的观点，但通常反对暴力，支持现有政府。他们的这种顺从态度使他们受到阿拉伯威权国家的欢迎，这些国家担心更具政治性的伊斯兰主义流派会对其政权构成威胁。"
 generic.Caliphate: "£generic_Caliphate_small 萨拉菲圣战主义"
 generic.Caliphate_icon: "£generic_Caliphate_small"
 generic.Caliphate_desc: "萨拉菲圣战主义指的是伊斯兰政治意识形态中一个极端严苛、极端保守和原教旨主义的分支，其灵感源自赛义德·库特布的教义。他们企图征服所有伊斯兰土地，并以其对伊斯兰教法的严苛解读进行统治。他们不承认其他形式的伊斯兰教和少数宗教，并且为了实现其目标不择手段。"
 generic.Neutral_Muslim_Brotherhood: "£muslim_brotherhood_small 温和伊斯兰主义者"
 generic.Neutral_Muslim_Brotherhood_icon: "£muslim_brotherhood_small"
 generic.Neutral_Muslim_Brotherhood_desc: "温和伊斯兰主义指的是一系列旨在伊斯兰教法框架内建立民主国家的伊斯兰政治运动。"
 generic.Neutral_Autocracy: "£generic_Neutral_Autocracy_small 不结盟专制者"
 generic.Neutral_Autocracy_icon: "£generic_Neutral_Autocracy_small"
 generic.Neutral_Autocracy_desc: "专制政治指的是一系列非民主的、专制的意识形态，在这种意识形态下，所有权力都集中在一个统治者手中。"
 generic.Neutral_conservatism: "£generic_Neutral_conservatism_small 保守派"
 generic.Neutral_conservatism_icon: "£generic_Neutral_conservatism_small"
 generic.Neutral_conservatism_desc: "保守主义指的是一系列温和的右翼意识形态，这些意识形态强调传统文化、团结和稳定的生活方式的重要性。保守主义者往往反对国家干预社会和经济事务，并且通常认为减少监管将促进民众的社会流动性。"
 generic.oligarchism: "£generic_oligarchism_small 寡头"
 generic.oligarchism_icon: "£generic_oligarchism_small"
 generic.oligarchism_desc: "寡头政治是指权力结构集中在少数政治和经济精英手中的一种政治经济体制。寡头政治通常是非民主的，并且具有专制性质。"
 generic.Neutral_Libertarian: "£generic_Neutral_Libertarian_small 自由意志派"
 generic.Neutral_Libertarian_icon: "£generic_Neutral_Libertarian_small"
 generic.Neutral_Libertarian_desc: "自由意志主义指的是一系列以自由为核心原则的政治意识形态和运动。与保守派相比，自由意志主义者通常更支持政府在社会、政治和经济生活的各个方面进行有限的干预。"
 generic.Neutral_green: "£generic_Neutral_green_small 绿党"
 generic.Neutral_green_icon: "£generic_Neutral_green_small"
 generic.Neutral_green_desc: "绿色政治或生态政治指的是一系列倡导非暴力、社会正义、直接民主和环境保护的左翼运动。"
 generic.neutral_Social: "£generic_neutral_Social_small 社会民主派"
 generic.neutral_Social_icon: "£generic_neutral_Social_small"
 generic.neutral_Social_desc: "社会主义民主主义意识形态指的是倡导经济和社会正义的左翼意识形态。虽然他们奉行资本主义框架，但力求大幅重新分配财富以遏制不平等。他们倡导建立福利国家，并加强对私营企业的监管。"
 generic.Neutral_Communism: "£generic_Neutral_Communism_small 共产主义者"
 generic.Neutral_Communism_icon: "£generic_Neutral_Communism_small"
 generic.Neutral_Communism_desc: "共产主义广义上指的是一种主张终结资本主义制度、建立工人公社式天堂的意识形态。然而，实际上，共产主义国家往往保留了资本主义经济制度，并且通常不具备民主性质。"
 generic.Nat_Populism: "£generic_Nat_Populism_small 右翼民粹主义者"
 generic.Nat_Populism_icon: "£generic_Nat_Populism_small"
 generic.Nat_Populism_desc: "右翼民粹主义指的是民粹主义意识形态的一个特定分支，它旨在赋予民众权力，对抗那些被认为控制社会的精英阶层。右翼民粹主义者通常支持反全球化、贸易保护主义、本土主义、民族主义和反对移民。"
 generic.Nat_Fascism: "£generic_Nat_Fascism_small 法西斯分子"
 generic.Nat_Fascism_icon: "£generic_Nat_Fascism_small"
 generic.Nat_Fascism_desc: "法西斯主义是一种带有军国主义色彩的威权极端民族主义。法西斯主义寻求建立由单一领导人行使绝对权力的一党制国家，并支持暴力和侵略性扩张主义以促进民族复兴。"
 generic.Nat_Autocracy: "£generic_Nat_Autocracy_small 军政府"
 generic.Nat_Autocracy_icon: "£generic_Nat_Autocracy_small"
 generic.Nat_Autocracy_desc: "军政府指的是由军事领导人组成的委员会领导的政府。军政府通常具有非民主和专制的性质，从广义上讲，可以被视为一种军事独裁或军人统治形式。"
 generic.Monarchist: "£generic_Monarchist_small 君主主义者"
 generic.Monarchist_icon: "£generic_Monarchist_small"
 generic.Monarchist_desc: "君主主义意识形态指的是绝对君主制。"
