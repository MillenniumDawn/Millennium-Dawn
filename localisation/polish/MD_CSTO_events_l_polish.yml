l_polish:
 CSTO.1.t: "[From.GetNameDef] pragnie wstąpić do OUBZ"
 CSTO.1.d: "[From.GetAdjective] delegations have come forth with an interesting proposition. The delegation is explaining how [From.GetNameDef] wishes to sign the joint agreements and become a part of the CSTO. They are requesting a hearing to begin the process of signing a new declaration of friendship and allowing [From.GetNameDef]'s entrance into our alliance."
 CSTO.1.a: "Absolutnie"
 CSTO.1.b: "Nigdy"
 CSTO.2.t: "[SOV.GetNameDef] odrzuca wniosek o przyłączenie się do OUBZ"
 CSTO.2.d: "[SOV.GetNameDef] odrzucił naszą prośbę o dołączenie do OUBZ."
 CSTO.2.a: "Niezadowalający"
 CSTO.3.t: "Zaproszenie do OUBZ"
 CSTO.3.d: "[SOV.GetNameDef] and their allies want to invite us into the CSTO. What are we going to do?"
 CSTO.3.a: "Akceptujemy!"
 CSTO.3.b: "Nie mamy na to czasu."
 CSTO.4.t: "[ROOT.GetNameDef] wstępuje do OUBZ"
 CSTO.4.d: "[SOV.GetNameDef] i [ROOT.GetNameDef] wyszły dzisiaj, aby ogłosić wejście [ROOT.GetNameDef] do Organizacji Układu o Bezpieczeństwie Zbiorowym. [SOV.GetNameDef] i [ROOT.GetNameDef] odłożyły na bok swoją rywalizację i zdecydowały, że w ich najlepszym interesie leży, aby [ROOT.GetNameDef] przystąpiło do sojuszu."
 CSTO.4.a: "Wspaniały dzień!"
 CSTO.4.b: "Nowy sojusznik"
 CSTO.4.c: "Ciekawy rozwój"
 CSTO.5.t: "[ROOT.GetNameDef] opuszcza OUBZ!"
 CSTO.5.d: "Przywódca [ROOT.GetNameDef], [ROOT.GetLeader] ogłosił dzisiaj zamiar natychmiastowego wycofania się kraju z Organizacji Układu o Bezpieczeństwie Zbiorowym i powiązanych z nią sojuszy. To osłabi pakt wojskowy."
 CSTO.5.a: "Dobry wybór"
 CSTO.5.b: "Ciekawe"
 CSTO.6.t: "OUBZ staje się pełnoprawnym sojuszem wojskowym"
 CSTO.6.d: "W ramach istotnej zmiany polityki, [SOV.GetNameDef] ogłosił, że Organizacja Układu o Bezpieczeństwie Zbiorowym zostanie przekształcona w sojusz wojskowy o charakterze w pełni ofensywnym. Państwa członkowskie będą teraz zobowiązane do przystępowania do wszelkich wojen wypowiedzianych przez przywódcę sojuszu, a nie tylko do wojen obronnych. Stanowi to znaczącą eskalację ambicji wojskowych [SOV.GetAdjective] i wzbudziło zaniepokojenie wśród mocarstw zachodnich."
 CSTO.6.a: "Stoimy po stronie Moskwy."
 CSTO.6.b: "Niepokojący rozwój sytuacji"
 CSTO_management: "Zarządzanie OUBZ"
 SOV_convert_csto_to_offensive: "Przekształcenie OUBZ w sojusz ofensywny"
 SOV_convert_csto_to_offensive_desc: "Obecnie OUBZ funkcjonuje jako sojusz obronny – państwa członkowskie mogą zostać wezwane do walki jedynie w przypadku ataku na nas. Dzięki restrukturyzacji traktatu możemy przekształcić organizację w pełnoprawny sojusz wojskowy, w ramach którego członkowie będą zobowiązani do udziału we wszystkich naszych wojnach, w tym w operacjach ofensywnych. Umożliwi nam to angażowanie sojuszników i państw marionetkowych w każdy konflikt, który sami zainicjujemy."
 SOV_csto_has_at_least_one_member_tt: "OUBZ ma co najmniej jednego innego członka."