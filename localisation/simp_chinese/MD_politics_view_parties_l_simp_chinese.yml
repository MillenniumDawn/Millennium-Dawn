 PRU.conservatism: "£PRU_western_conservative (AP) 人民行动党"
 PRU.conservatism_desc: "（改革派）名义上是自由主义政党的“人民行动党”试图将自身定位为秘鲁主流保守主义的替代选择，同时又摒弃了该国许多左翼政党中更为民粹主义的倾向。20世纪90年代的政治变革使该党的立场更加偏向中间 - 许多昔日的支持者转而支持其他组织或政党。"
 PRU.liberalism: "£PRU_western_liberal (PP) 可能的秘鲁"
 PRU.liberalism_desc: "（社会自由主义）“可能的秘鲁”是众多反对阿尔韦托·藤森总统的政党之一，它作为一个自由主义反对派团体而成立，领导抗议活动，反对腐败指控，并致力于建立一个自由、民主的秘鲁。"
 PRU.anarchist_communism: "£PRU_anarchist_communism (APRA) 美洲人民革命联盟"
 PRU.anarchist_communism_desc: "（左翼民粹主义）美洲人民革命联盟最初是一个反帝国主义运动，其目标是建立一个统一的南美洲。自1930年成立以来，美洲人民革命联盟参与了多届政府的组建。虽然最初是一个较为激进的左翼政党，但在艾伦·加西亚的领导下，该党逐渐偏离了其初衷，转而采取了第三条道路社会民主主义和日益新自由主义的政策。"
 PRU.Neutral_conservatism: "£PRU_non_aligned_conservative (FREPAP) 秘鲁农业人民阵线"
 PRU.Neutral_conservatism_desc: "（农业主义）秘鲁农业人民阵线是一个农业党，它深受基督教神学和保守社会价值观的影响。它主张建立神权政府、推行秘鲁民族主义、实行权力下放、借鉴前印加政权的某些特征，甚至将社会主义经济的某些特征融入其纲领中。"
 PRU.neutral_Social: "£PRU_non_aligned_socialist_democrat (UPP)秘鲁联盟"
 PRU.neutral_Social_desc: "（社会民主主义）秘鲁联盟最初持社会民主主义和进步主义观点，在人民革命联盟支持率崩溃后，该党成为主要的左翼反对派力量之一。然而，在2010年代安陶罗·乌马拉领导该党之后，该党与更为激进的民族主义运动日益结盟。"
 PRU.Neutral_Libertarian: "£PRU_non_aligned_libertarian (PSN) 国家团结党"
 PRU.Neutral_Libertarian_desc: "（保守主义）国家团结党成立于1998年，旨在反对阿尔韦托·藤森的总统任期。该党奉行社会保守主义和经济自由主义的融合，旨在捍卫秘鲁的共和主义思想，反对90年代日益增长的专制主义。"
 PRU.Neutral_Communism: "£PRU_non_aligned_communism (PCP-SL) 秘鲁共产党 - 光辉道路"
 PRU.Neutral_Communism_desc: "（马克思列宁主义-毛泽东思想）“光辉道路”自称为秘鲁共产党，主张以革命暴力反对秘鲁政府。该党意识形态深受其创始人阿维马埃尔·古斯曼影响，他倡导\"贡萨罗思想\" - 一种将反修正主义的马克思列宁主义与毛泽东思想相结合，并对该组织视为资产阶级国家组成部分的对象采取革命暴力的意识形态。该组织的行动方式及其更激进的意识形态，已被美洲多国认定为恐怖组织。"
 PRU.Neutral_green: "£PRU_non_aligned_greens 秘鲁绿党"
 PRU.Neutral_green_desc: ""
 PRU.Nat_Autocracy: "£PRU_Nat_Autocracy 秘鲁武装力量"
 PRU.Nat_Autocracy_desc: "（保守派军政府）秘鲁武装部队成立于1821年，历史上曾多次干预国家政治。从政变、公开支持政治候选人，到使用武力镇压示威游行，要使军队彻底摆脱政治影响，需要进行彻底的改革。"
 PRU.Nat_Populism: "£PRU_Nat_Populism (C90) 变革90"
 PRU.Nat_Populism_desc: "（右翼民粹主义）该党是为阿尔韦托·藤森的政治生涯而创建的，其主要意识形态深受藤森的右翼民粹主义、威权主义和私有化政策的影响。由于藤森的个人崇拜，该党所支持的这些政策被统称为“藤森主义”。"
 PRU.oligarchism: "£PRU_non_aligned_oligarchism (BK) 巴里奥王"
 PRU.oligarchism_desc: "（卡特尔统治）“巴里奥王”是秘鲁一个大型贩毒集团，由格尔森·加尔韦斯·卡列领导。该集团因其暴力历史和自成立以来所拥有的强大势力而在秘鲁臭名昭著。"
