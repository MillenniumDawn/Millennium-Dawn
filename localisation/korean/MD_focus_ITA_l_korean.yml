 italy_md.70.t: "전사 왕"
 italy_md.70.d: "유명한 프랑스 용병 로베르 드나르가 코모로 정부를 전복하는 데 도움이 될 용병을 모집하려 한 사실이 적발되었습니다. 드나르는 프랑코 네로치를 통해 이탈리아 극우 정당들에서 용병을 모집하다 붙잡혔습니다. 기술적으로 그는 프랑스 시민이지만, 그가 저지르고 있는 행위는 분명 이탈리아 법률에 위배됩니다. 드나르는 현재 구금되어 있으며, 그를 기소하도록 허용해야 할까요, 아니면 석방해야 할까요?"
 italy_md.70.o1: "그를 기소한다"
 italy_md.70.o2: "그를 석방한다"
