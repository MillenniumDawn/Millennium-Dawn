 israel_economy.26.t: "A Índia não concordou."
 israel_economy.26.d: "Eles não querem cooperar com o nosso país."
 israel_economy.26.a: "Hum..."
 israel_economy.27.t: "Israel Pede Investimentos"
 israel_economy.27.d: "O governo israelense, em uma recente reunião bilateral entre nossos países, convidou nosso país a investir dinheiro em sua economia para uma cooperação ainda mais benéfica para ambos. Devemos aceitar?"
 israel_economy.27.a: "Preparem o pacote de investimento!"
 israel_economy.27.b: "Desculpe, não."
 israel_economy.28.t: "[From.GetName] Concorda!"
 israel_economy.28.d: "Eles concordaram em investir em nossa economia."
