 ukraine_equipment_develop_domestic_atgm.8.name: "'불라바' 대전차 유도 미사일: 개발 완료"
 ukraine_equipment_develop_domestic_atgm.8.desc: "루치 설계국의 훌륭한 인재들이 '불라바' 발사 후 망각식 대전차 유도 미사일의 개발을 마쳤습니다. 이제 이 신형 체계를 우리 [ROOT.GetFlag] [ROOT.GetAdjective] 군에 도입하기 위한 다음 단계를 선택할 수 있습니다."
 ukraine_equipment_develop_domestic_atgm.8.a: "설계만 확보한다"
 ukraine_equipment_develop_domestic_atgm.8.b: "본격적인 생산을 개시한다"
 ukraine_equipment_develop_domestic_atgm.8.c: "본격적인 생산을 준비한다"
 UKR_Develop_Domestic_ATGM_Bulava_kyiv_expansion_tt: "§Y240~300일§! 후 §Y키이우§!가 §G군수 공장 1개§!를 얻고, 우리는 자체 생산 라인을 갖춘 §Y불라바§! 설계를 받습니다."
 ukraine_equipment_develop_domestic_atgm.9.name: "'불라바' 대전차 유도 미사일: 생산 준비 완료"
 ukraine_equipment_develop_domestic_atgm.9.desc: "루치 설계국 공장의 확장과 설비 교체를 마쳤으므로 '불라바' 대전차 유도 미사일의 본격 생산에 들어갈 수 있습니다."
 ukraine_equipment_develop_domestic_atgm.9.a: "좋아! 이제 생산을 개시하자"
 ukraine_light_transport_tender.1.name: "경수송차량 입찰"
 ukraine_light_transport_tender.1.desc: "그림 속 차량은 소련 시대의 UAZ-469로, \\"작은 염소\\"라는 별명으로 불립니다. 우리 군이 이를 더 특화되고 강력하며 현대적인 장비로 교체하려는 이유를 이해하실 수 있을 것입니다. 앞서 실시한 입찰에는 신형 경차량에 대한 우크라이나 업체들의 제안이 여럿 접수되었습니다. 설계는 단순한 비장갑 다목적 차량에서 더 뛰어난 방호 플랫폼까지 다양합니다. 그중 LuAZ-1901 헤올로흐, D-041 스테프, 도조르-A의 세 제안이 가장 유망한 것으로 떠올랐습니다. LuAZ-1901 헤올로흐는 소량을 즉시 구매하거나 루츠크 자동차 공장에서 양산할 수 있습니다."
 ukraine_light_transport_tender.1.a: "§YLuAZ-1901 헤올로흐§! 소량을 구매한다"
 ukraine_light_transport_tender.1.b: "루츠크 공장을 확장해 §YLuAZ-1901 헤올로흐§!를 생산한다"
 ukraine_light_transport_tender.1.c: "§YD-041 스테프§!를 선정한다"
 ukraine_light_transport_tender.1.d: "§Y도조르-A§!를 선정한다"
 ukraine_light_transport_tender.2.name: "D-041 스테프의 구성"
 ukraine_light_transport_tender.2.desc: "D-041 스테프는 여러 구성으로 개발할 수 있습니다. 가장 현실적인 안은 화물 운송과 일반 다목적 임무용 픽업트럭형, 또는 인원과 장비를 더 잘 보호하는 밀폐 차체형입니다."
 ukraine_light_transport_tender.2.a: "§Y픽업§! 구성을 선택한다"
 ukraine_light_transport_tender.2.b: "§Y밀폐 차체§! 구성을 선택한다"
 ukraine_light_transport_tender.3.name: "도조르-A의 구성"
 ukraine_light_transport_tender.3.desc: "도조르-A는 여러 구성으로 공급받을 수 있습니다. 공장 출고 단계에서 PKM 범용 기관총을 장착할 수도 있고, 아예 무장하지 않아 비용을 아낄 수도 있습니다."
 ukraine_light_transport_tender.3.a: "§Y비무장§!형을 선택한다"
 ukraine_light_transport_tender.3.b: "§YPKM 무장§!형을 선택한다"
 ukraine_light_transport_tender.4.name: "루츠크 공장 확장 완료"
 ukraine_light_transport_tender.4.desc: "루츠크 자동차 공장의 새 작업장이 준비되었습니다. 확장된 공장은 이제 우리 군을 위해 LuAZ-1901 헤올로흐를 양산할 수 있습니다."
 ukraine_light_transport_tender.4.a: "생산 라인을 가동한다"
 ukraine_light_transport_tender_lutsk_expansion_tt: "§Y240~300일§! 후 §Y볼히니아§!가 §G군수 공장 1개§!를 얻고 §YLuAZ-1901 헤올로흐§! 생산 라인이 가동됩니다."
 UKR_develop_domestic_btr4_category: "§YBTR-4§! 개발[UKR_btr4_development_steps_loc]"
 UKR_develop_domestic_btr4_category_desc: "\n\n\n\n\n\n£UKR_desctext_btr4_main\n\n\n\n\n\n\n\n\n현대적인 장갑차(APC)의 완전히 새로운 국산 설계를 연구하고 시험하는 데 시간과 자금을 투입할 수 있습니다."
 ukraine_strat_bombers_problem.1.t: "우크라이나의 장거리 항공대"
 ukraine_strat_bombers_problem.1.d: "§R소련§! 해체 이후 §G[UKR.GetNameWithFlag]§!은(는) 상당한 규모의 전략 항공 전력을 물려받았습니다. 그러나 이 항공기들을 유지하는 일은 국가에 점점 더 무거운 부담이 되고 있습니다. 대부분의 항공기는 가동되지 않은 채 놓여 있고, 비싼 정비가 필요하며, 작전 능력도 서서히 잃어 가고 있습니다.\n\n이제 §G[UKR.GetNameWithFlag]§!은(는) 남은 전략폭격기를 어떻게 할지 결정해야 합니다."
 ukraine_strat_bombers_problem.1.a: "결정을 내려야 한다."
 ukraine_strat_bombers_problem.2.t: "모스크바의 제안"
 ukraine_strat_bombers_problem.2.d: "1999년 10월 8일, §R[SOV.GetNameWithFlag]§! 정부는 밀린 가스 채무의 상환 명목으로 §G[UKR.GetNameWithFlag]§!의 장거리 항공대, 즉 §GTu-160§! 7기, §GTu-95MS§! 3기, Kh-55 순항 미사일 575발을 인수하겠다고 제안했습니다. 이 거래는 항공기 유지 비용을 줄이고 §Y[UKR.GetNameWithFlag]§!에 얼마간의 재정적 숨통을 틔워 줄 것입니다.\n\n그러나 거래를 받아들이면 §G우크라이나§!의 전략 항공 능력 중 상당 부분을 내주게 되며, 우리 전문가들의 추산으로는 폭격기 자체의 가치가 러시아가 탕감해 주기로 한 채무(우크라이나 흐리우냐 2억 7,500만)보다 훨씬 큽니다."
 ukraine_strat_bombers_problem.2.a: "합의를 진행한다."
 ukraine_strat_bombers_problem.2.b: "러시아가 우리를 속이려 하고 있다."
 ukraine_strat_bombers_problem.3.t: "남은 항공기의 운명"
 ukraine_strat_bombers_problem.3.d: "우크라이나 장거리 항공대 전력의 일부를 러시아에 넘긴 뒤에도 노후 항공기가 상당수 남아 있습니다. 이를 가동 상태로 유지하려면 국가가 감당하기 어려운 자원이 필요합니다.\n\n§G[USA.GetNameWithFlag]§!, §G[GER.GetNameWithFlag]§!, §G[FRA.GetNameWithFlag]§!, §G[ENG.GetNameWithFlag]§!은(는) 우리가 군축 협정을 이행해 이들을 폐기하길 바랍니다. 그러나 다른 선택지도 남아 있습니다. 남은 항공기를 우크라이나 공군의 일부로 보존하려 시도하는 것입니다."
 ukraine_strat_bombers_problem.3.a: "남은 항공기를 해체한다."
 ukraine_strat_bombers_problem.3.b: "보존하고 복원을 시도한다."
 ukraine_strat_bombers_problem.4.t: "우크라이나의 마지막 Tu-160"
 ukraine_strat_bombers_problem.4.d: "우크라이나 전략 항공 전력의 해체가 계속되고 있습니다. 마지막으로 남은 §YTu-160§!, 기체명 §R26 RED§!는 폴타바 항공 박물관의 전시용으로 지정되었습니다.\n\n이로써 우크라이나의 §YTu-160§! 운용이 막을 내립니다."
 ukraine_strat_bombers_problem.4.a: "참으로 비극적인 운명이다."
 ukraine_strat_bombers_problem.5.t: "서방의 외교 서한"
 ukraine_strat_bombers_problem.5.d: "서방 파트너들은 우리가 아직 §YTu-22M3§! 기단을 처분하지 않았다며, 약 한 달 안에 처분에 착수하지 않으면 그 대가를 치르게 될 것이라고 통보했습니다. \n\n우리는 이대로 두거나 §YTu-22M3§! 항공단을 제거해야 합니다. 시간은 한 달입니다."
 ukraine_strat_bombers_problem.5.a: "두고 보자."
 ukraine_strat_bombers_problem.6.t: "우리 행동의 대가"
 ukraine_strat_bombers_problem.6.d: "경고했던 대로 우리 경제에 대한 투자가 중단되었으며, 이는 경제 상황을 크게 악화시킬 것입니다."
 ukraine_strat_bombers_problem.6.a: "유감이군"
 ukraine_strat_bombers_problem.7.t: "서방의 환영"
 ukraine_strat_bombers_problem.7.d: "남은 장거리 항공대를 포기한다는 우크라이나의 결정을 서방 국가들이 환영했습니다. 워싱턴과 유럽 각국의 수도는 우크라이나가 소련의 전략적 유산을 해체하는 것을 NATO와의 긴밀한 협력과 핵무기 확산 방지를 향한 중요한 걸음으로 보고 있습니다."
 ukraine_strat_bombers_problem.7.a: "올바른 선택을 했다."
 ukraine_strat_bombers_problem.8.t: "남은 항공기의 운명"
 ukraine_strat_bombers_problem.8.d: "[UKR.GetNameWithFlag]은(는) 장거리 항공대를 [SOV.GetNameWithFlag]에 넘기기를 거부했고, 그 결과 전 기단이 우크라이나의 통제 아래 남았습니다. 그러나 항공기는 노후했고 유지비가 비싸며 가동 상태를 유지하기가 갈수록 어려워지고 있습니다.\n\n§G[USA.GetNameWithFlag]§!, §G[GER.GetNameWithFlag]§!, §G[FRA.GetNameWithFlag]§!, §G[ENG.GetNameWithFlag]§!은(는) 우리가 군축 협정을 이행해 이들을 폐기하길 바랍니다. 그러나 다른 선택지도 남아 있습니다. 남은 항공기를 우크라이나 공군의 일부로 보존하려 시도하는 것입니다.\n\n폭격기 복원은 §G특히 중요한 군사 사업§!이 되어, §Y최고라다§!가 더 높은 군사 예산을 승인할 의향이 커질 것입니다."
 ukraine_strat_bombers_problem.8.a: "남은 항공기를 해체한다."
 ukraine_strat_bombers_problem.8.b: "보존하고 복원을 시도한다."
 ukraine_strat_bombers_problem.9.t: "우크라이나의 마지막 Tu-160"
 ukraine_strat_bombers_problem.9.d: "우크라이나 전략 항공 전력의 해체가 계속되고 있습니다. 마지막으로 남은 §YTu-160§!, 기체명 §R26 RED§!는 폴타바 항공 박물관의 전시용으로 지정되었습니다.\n\n이로써 우크라이나의 §YTu-160§! 운용이 막을 내립니다."
 ukraine_strat_bombers_problem.9.a: "참으로 비극적인 운명이다."
 ukraine_strat_bombers_problem.12.t: "서방의 환영"
 ukraine_strat_bombers_problem.12.d: "남은 장거리 항공대를 포기한다는 우크라이나의 결정을 서방 국가들이 환영했습니다. 워싱턴과 유럽 각국의 수도는 우크라이나가 소련의 전략적 유산을 해체하는 것을 서방과의 긴밀한 협력을 향한 중요한 걸음으로 보고 있습니다."
 ukraine_strat_bombers_problem.12.a: "올바른 선택을 했다."
 ukraine_strat_bombers_problem.10.t: "서방의 외교 서한"
 ukraine_strat_bombers_problem.10.d: "서방 파트너들은 우리가 아직 §YTu-22M3§! 기단의 처분을 시작하지 않았다고 통보했습니다. 그들은 해체에 착수할 시한으로 약 한 달을 주었으며, 이를 어기면 우리는 그 대가를 치르게 됩니다. \n\n우리는 이대로 두거나 §YTu-22M3§! 항공단을 제거해야 합니다. 시간은 한 달입니다."
 ukraine_strat_bombers_problem.10.a: "두고 보자."
 ukraine_strat_bombers_problem.11.t: "우리 행동의 대가"
 ukraine_strat_bombers_problem.11.d: "경고했던 대로 우리 경제에 대한 투자가 중단되었으며, 이는 경제 상황을 크게 악화시킬 것입니다."
 ukraine_strat_bombers_problem.11.a: "유감이군"
