 sp_land_generic_reward_armor_bonus_3: "개량된 장갑 합금"
 sp_land_generic_reward_engine_bonus_1: "연료 효율 엔진"
 sp_land_generic_reward_engine_bonus_2: "향상된 엔진 신뢰성"
 sp_land_generic_reward_engine_bonus_3: "최적화된 엔진 성능"
 sp_land_generic_reward_artillery_bonus_1: "사거리 정확도 개선"
 sp_land_generic_reward_artillery_bonus_2: "신형 반동 감소 체계"
