 BOS_motor_influence_tt: "Un constructeur étranger gagnera de l'§Rinfluence§! sur la Bosnie en échange de l'investissement."
 BOS_union_serbia_accept_tt: "La Serbie incorpore la Bosnie et prend le contrôle de ses forces armées."
 BOS_union_serbia_reject_tt: "La Bosnie reste indépendante et les relations avec la Serbie se détériorent."
 BOS_military_supplies_accept_tt: "Un pays qui répond envoie des armes d'infanterie à la Bosnie."
 BOS_military_supplies_reject_tt: "Un pays répondant peut conserver son stock, détériorant les relations avec la Bosnie."
 BOS_turkish_supplies_accept_tt: "La Turquie envoie 2 500 armes d'infanterie de ses stocks à la Bosnie."
 BOS_albanian_supplies_accept_tt: "L'Albanie envoie 750 armes d'infanterie de ses stocks à la Bosnie."
 BOS_military_supplies_decline_tt: "La Bosnie ne reçoit aucun équipement de notre part et verra le refus d'un mauvais œil."
 BOS_civil_war_over: "La guerre civile bosniaque est terminée"
 civil_war_focus: "Dans la guerre civile"
 BOS_air_chief: "État-major de l'armée de l'air bosniaque"
 BOS_air_chief_desc: "Un état-major aérien conjoint coordonne la limitée aviation de combat bosniaque, les hélicoptères de transport et les besoins d'appui terrestre."
 novica_simic: "Novica Simić"
 novica_simic_desc: "Un commandant serbe de Bosnie senior axé sur la défense territoriale et le maintien de la préparation au combat."
 cvjetko_savic: "Cvjetko Savić"
 cvjetko_savic_desc: "Un officier réformateur déterminé à reconstruire l'état-major d'après-guerre de la Bosnie."
 novak_dukic: "Novak Dukić"
 novak_dukic_desc: "Un commandant de campagne expérimenté adapté aux opérations spéciales et au terrain difficile."
 miladin_milojcic: "Miladin Milojcić"
 miladin_milojcic_desc: "Un officier d'état-major axé sur la manœuvre, la mobilité et la planification opérationnelle."
 anto_jelec: "Anto Jeleč"
 anto_jelec_desc: "Un commandant croate de Bosnie expérimenté dans les opérations défensives et l'organisation des forces."
 senad_masovic: "Senad Masovic"
 senad_masovic_desc: "Un officier de carrière concentré sur les normes d'instruction et l'intégration militaire."
 BOS_operation_althea: "Opération Althéa"
 BOS_operation_althea_desc: "L'opération Althea est la mission de l'Union européenne qui a succédé à la SFOR en 2004. Elle appuie l'accord de Dayton et transfère la responsabilité de la sécurité aux institutions bosniaques."
 BOS_draft_EUFOR: "Projet d'EUFOR"
 BOS_draft_EUFOR_desc: "Remplacer le mandat de la SFOR, dirigée par l'OTAN et arrivé à expiration, par une mission de maintien de la paix dirigée par l'UE."
 BOS_demand_eufor_withdrawal: "Exiger le retrait de l’EUFOR"
 BOS_demand_eufor_withdrawal_desc: "Réduire la présence militaire internationale et tester si la Bosnie peut assurer seule sa sécurité intérieure."
 BOS_SFOR_title: "La Force de stabilisation en Bosnie-Herzégovine"
 BOS_SFOR_title_desc: "La Force de stabilisation dirigée par l'OTAN fait appliquer les dispositions militaires de l'accord de Dayton et appuie la sécurité d'après-guerre de la Bosnie. Son mandat peut être prolongé en cas de crise ou raccourci à mesure que les institutions nationales se rétablissent."
 BOS_peacekeeper_oversight: "Surveillance des Casques bleus"
 BOS_peacekeeper_oversight_desc: "Les missions européennes restent en Bosnie tandis que les réformes restent en deçà des besoins de sécurité intérieure."
 BOS_civil_war_operations: "Opérations de guerre civile"
 BOS_civil_war_operations_desc: "Coordonner les actions d'urgence en temps de guerre sur les zones de conflit tant que la Bosnie reste en guerre civile."
 BOS_rotating_presidency: "Présidence tournante"
 BOS_rotating_presidency_desc: "La présidence bosniaque tourne entre représentants bosniaques, croates et serbes. Le dispositif limite la domination d'un peuple constituant, mais les transferts fréquents d'autorité peuvent interrompre la législation.\n\nAttitude serbe : [ROOT.BOS_srpska_attitude]\nAttitude bosniaque : [ROOT.BOS_bosniak_attitude]\nAttitude croate : [ROOT.BOS_croat_attitude]"
 BOS_more_sfor: "Demander une prolongation de délai pour la SFOR"
 BOS_more_sfor_desc: "Demander à l'OTAN de prolonger le mandat de la SFOR tant que la Bosnie reste politiquement ou économiquement instable."
 BOS_lower_sfor: "Demander une réduction de la durée de la SFOR"
 BOS_lower_sfor_desc: "Raccourcir le mandat de la SFOR à mesure que les institutions bosniaques se préparent à assumer pleinement la responsabilité de la sécurité."
 BOS_attack_upon_nato_desc: "Les forces bosniaques sont en grave désavantage opérationnel face aux membres de l'OTAN."
 BOS_sfor_vol_troops: "Engagement des volontaires de la SFOR"
 BOS_sfor_vol_troops_desc: "Les participants au maintien de la paix peuvent déployer rapidement des volontaires si la Bosnie retombe en guerre civile."
 BOS_SER_vol_troops: "Engagement des volontaires serbes"
 BOS_SER_vol_troops_desc: "La Serbie peut déployer rapidement des volontaires pour soutenir la Republika Srpska dans un conflit bosniaque renouvelé."
 BOS_idea_muslim_nationalism: "Nationalisme musulman mobilisé"
 BOS_idea_muslim_nationalism_desc: "Le nationalisme religieux favorise la mobilisation et l'intervention étrangère tout en durcissant le régime face au changement politique."
 BOS_idea_srpska_supremacy: "Suprématie serbe"
 BOS_idea_srpska_supremacy_desc: "Les institutions de la Republika Srpska dominent l'État et orientent sa politique des ressources, mais le partage du pouvoir a effectivement pris fin."
 BOS_dominant_entity_idea: "Entité dominante"
 BOS_dominant_entity_idea_desc: "Le contrôle de l'État central par la Srpska stabilise le gouvernement et le durcit contre l'influence politique étrangère."
 BOS_workers_front_idea: "Front des travailleurs"
 BOS_workers_front_idea_desc: "Le mouvement ouvrier organisé est devenu une force politique indépendante. Sa mobilisation renforce le gouvernement tout en ébranlant les institutions existantes."
 BOS_workers_compact: "Pacte syndical national"
 BOS_workers_compact_desc: "L'État a garanti des droits au travail et des dépenses sociales en échange de la paix sociale et de coûts d'exploitation plus élevés."
 BOS_worker_managed_economy: "Économie gérée par les travailleurs"
 BOS_worker_managed_economy_desc: "Les conseils ouvriers partagent l'autorité avec les dirigeants d'entreprise. Le système augmente les recettes fiscales mais perturbe d'abord la production industrielle."
 BOS_mechanical_modernization: "Modernisation mécanique"
 BOS_mechanical_modernization_desc: "Des machines modernes et une formation technique ont transformé l'autogestion ouvrière en un modèle industriel plus productif."
 BOS_workers_republic_idea: "République ouvrière"
 BOS_workers_republic_idea_desc: "Les délégués des conseils dirigent l'État et son industrie. L'ordre socialiste consolidé accélère la construction et l'administration publique."
 BOS_idea_prepping_an_offensive: "Offensive préparée"
 BOS_idea_prepping_an_offensive_desc: "Des stocks de ravitaillement et des plans d'état-major détaillés améliorent temporairement la préparation opérationnelle."
 BOS_idea_commence_the_offensives: "Élan offensif"
 BOS_idea_commence_the_offensives_desc: "Les forces armées sont engagées dans une offensive coordonnée sur le front de la guerre civile."
 BOS_idea_rally_the_troops: "Troupes ralliées"
 BOS_idea_rally_the_troops_desc: "Les formations de réserve et les recrues locales soutiennent l'appui de l'opinion à l'effort de guerre."
 BOS_idea_mobilize_the_nation: "Mobilisation nationale"
 BOS_idea_mobilize_the_nation_desc: "La mobilisation d'urgence accélère les opérations militaires et la production d'équipement d'infanterie sous licence."
 BOS_idea_dig_in: "Défenses préparées"
 BOS_idea_dig_in_desc: "Les ingénieurs et les unités de campagne préparent rapidement des positions défensives."
 BOS_idea_fight_or_perish: "Combattre ou périr"
 BOS_idea_fight_or_perish_desc: "Le gouvernement puise dans des effectifs supplémentaires pour éviter la défaite dans la guerre civile."
 BOS_idea_national_sentiment: "Sentiment national de guerre"
 BOS_idea_national_sentiment_desc: "La propagande d'État entretient la mobilisation nationaliste pendant toute la durée du conflit."
 BOS_religious_identity_idea: "Identité religieuse"
 BOS_religious_identity_idea_desc: "Le gouvernement définit l'État par les institutions islamiques et un programme nationaliste religieux."
 BOS_low_police_budget: "Faible budget policier"
 BOS_low_police_budget_desc: "La réduction du budget de la police diminue les dépenses courantes mais affaiblit la réponse de l'État au crime organisé."
 BOS_bosniak_balkan_aspiration_desc: "Les forces bosniaques sont mobilisées pour préserver l'État et vaincre les armées sécessionnistes serbes et croates."
 BOS_srpska_balkan_aspiration_desc: "La Republika Srpska est mobilisée pour vaincre le gouvernement central bosniaque et les forces croates concurrentes."
 BOS_croat_balkan_aspiration_desc: "Les forces croates de Bosnie sont mobilisées pour sécuriser leur territoire face aux armées bosniaques et serbes."
 BOS_police_high_desc: "L'augmentation du budget de la police améliore l'application de la loi et le contrôle politique, à un coût budgétaire élevé."
 BOS_air_doctrine_review: "Révision de la doctrine aérienne"
 BOS_air_doctrine_review_desc: "Des études d'état-major temporaires et des exercices accélèrent l'adoption d'une doctrine aérienne pratique."
 BOS_internal_investment_desc: "Des incitations à l'investissement intérieur soutiennent l'industrie civile tout en réduisant la part de la production détournée d'un usage productif."
 BOS_crime_increase_desc: "La faiblesse de l'application de la loi a permis au crime organisé de s'étendre, alourdissant les coûts administratifs et pour les consommateurs."
 BOS_idea_mechanization_of_the_army: "Armée mécanisée"
 BOS_idea_mechanization_of_the_army_desc: "Des véhicules protégés et une planification mobile donnent à la petite armée bosniaque une plus grande portée opérationnelle, à un coût en personnels maîtrisable."
 BOS_idea_transportation_methods: "Transport militaire moderne"
 BOS_idea_transportation_methods_desc: "Des véhicules utilitaires standard et des hélicoptères de transport réduisent le coût et la complexité de la logistique militaire."
 BOS_idea_the_land_fleet: "Flotte mécanisée intégrée"
 BOS_idea_the_land_fleet_desc: "Des familles de véhicules communes soutiennent une force équilibrée de transports et de véhicules blindés sans surcoût d'acquisition excessif."
 BOS_idea_aerial_dominance: "Domination aérienne"
 BOS_idea_aerial_dominance_desc: "La Bosnie investit dans la disponibilité des chasseurs, la qualité des pilotes et une étroite coordination avec les forces terrestres."
 BOS_idea_air_defence_initiative: "Initiative de défense aérienne"
 BOS_idea_air_defence_initiative_desc: "Les défenses aériennes terrestres et la surveillance offrent un bouclier crédible aux villes, aux bases et aux formations de campagne."
 BOS_idea_apc_armament: "Véhicules blindés de transport de troupes"
 BOS_idea_apc_armament_desc: "Des véhicules blindés de transport de troupes standardisés améliorent la protection de l'infanterie et la mobilité interarmes."
 BOS_idea_main_battle_line: "Doctrine antichar moderne"
 BOS_idea_main_battle_line_desc: "Des forces antichars mobiles permettent à la Bosnie de tenir tête à des formations plus lourdes sans entretenir une flotte de chars coûteuse."
 BOS_idea_boots_on_the_ground: "Armée centrée sur l'infanterie"
 BOS_idea_boots_on_the_ground_desc: "Une infanterie préparée et des réserves entraînées forment le cœur d'une force défensive adaptée au terrain et au budget bosniaques."
 BOS_eu_development_loans: "Prêts de développement de l'UE"
 BOS_eu_development_loans_desc: "Le crédit européen finance la reconstruction et soulage l'économie des consommateurs, mais les conditions de remboursement portent un fardeau d'intérêts plus lourd et exposent davantage la Bosnie à l'influence étrangère."
 BOS_election_stimulus: "Dépenses de l'année électorale"
 BOS_election_stimulus_desc: "Des dépenses d'urgence avant le scrutin stabilisent les budgets des ménages et relèvent la confiance du public dans le gouvernement."
 BOS_reconstruction_drive: "Campagne de reconstruction nationale"
 BOS_reconstruction_drive_desc: "Un programme de reconstruction coordonné accélère les travaux dans tout le pays et rétablit lentement la confiance du public dans l'État."
 BOS_national_mobilization: "Cadre de mobilisation nationale"
 BOS_national_mobilization_desc: "Des obligations de réserve claires élargissent le vivier d'effectifs entraînés, et des plans défensifs préparés font que tout territoire bosniaque occupé résistera bien plus farouchement à l'occupant."
 BOS_idea_detain_ratko_mladic: "Ratko Mladić arrêté"
 BOS_idea_detain_ratko_mladic_desc: "La coopération avec la justice internationale a amélioré la confiance occidentale dans les institutions bosniaques."
 BOS_idea_civilian_training: "Formation de réserve élargie"
 BOS_idea_civilian_training_desc: "Un programme national de formation temporaire prépare les réservistes à la mobilisation et à la défense territoriale."
 BOS_idea_post_war_clean_up: "Programme de nettoyage d'après-guerre"
 BOS_idea_post_war_clean_up_desc: "Le nettoyage et la reconstruction coordonnés accélèrent temporairement l'investissement dans les communautés endommagées."
 BOS_pro_bosnia: "Formation d'un gouvernement appuyé par les Bosniaques"
 BOS_pro_bosnia_desc: "Un gouvernement appuyé par les Bosniaques dirige les institutions de l'État et réduit le coût de l'administration nationale."
 BOS_pro_srpska: "Formation d'un gouvernement appuyé par les Serbes"
 BOS_pro_srpska_desc: "Un gouvernement appuyé par les Serbes dirige les institutions de l'État et privilégie la coopération sécuritaire avec la Republika Srpska."
 BOS_civil_war_recovery: "Reprise de la guerre civile"
 BOS_civil_war_recovery_desc: "La guerre civile relancée a endommagé la production, la confiance du public et la capacité de la Bosnie à attirer des partenaires."
 BOS_post_war_efforts: "Effort de rétablissement d’après-guerre"
 BOS_post_war_efforts_desc: "Les recettes fiscales et les incitations à la reconstruction soutiennent une poussée temporaire d'investissement d'après-guerre."
 BOS_milorad_dodik_idea: "Milorad Dodik"
 BOS_milorad_dodik_idea_desc: "Le réseau politique de Milorad Dodik obstrue les institutions centrales tout en renforçant l'autonomie de la Republika Srpska."
 BOS_farming_improvements: "Améliorations agricoles"
 BOS_farming_improvements_desc: "Des équipements modernes et des terres plus sûres améliorent la production agricole et la stabilité rurale."
 BOS_farming_powerhouse: "Centrale agricole"
 BOS_farming_powerhouse_desc: "Un secteur agricole productif soutient désormais les revenus ruraux, la croissance démographique et l'assiette fiscale."
 BOS_mining_development: "Développement minier"
 BOS_mining_development_desc: "Des mines modernisées accroissent l'extraction des ressources et l'activité locale imposable."
 BOS_mining_industry: "Industrie minière"
 BOS_mining_industry_desc: "Un investissement consolidé a créé un secteur minier plus large et plus efficace."
 BOS_lumber_harvesting_idea: "Récolte du bois"
 BOS_lumber_harvesting_idea_desc: "Les investissements forestiers et de transformation élargissent la production de ressources rurales et l'activité imposable."
 BOS_dayton_accords_desc: "L'accord de Dayton bride l'expansion et limite la confrontation militaire avec la Serbie et la Croatie tant que la Bosnie reste en paix."
 BOS_land_mine_removal_efforts_desc: "Les équipes de déminage réduisent le fardeau sanitaire et économique des terres contaminées, mais le programme exige un financement durable."
 BOS_trade_deal_with_russia: "Accord commercial Sarajevo-Moscou I"
 BOS_trade_deal_with_russia_desc: "Un accord limité avec la Russie soutient l'investissement et réduit les coûts pour les consommateurs tout en accroissant l'influence politique orientale."
 BOS_trade_deal_with_russia_expanded: "Accord commercial Sarajevo-Moscou II"
 BOS_trade_deal_with_russia_expanded_desc: "L'élargissement du commerce et du crédit russes approfondit la coopération économique et l'alignement politique oriental de la Bosnie."
 BOS_trade_deal_with_eu: "Accord commercial avec l'UE I"
 BOS_trade_deal_with_eu_desc: "Un accord limité avec l'Union européenne abaisse les coûts pour les consommateurs et favorise l'intégration démocratique et financière."
 BOS_trade_deal_with_eu_expanded: "Accord commercial avec l'UE II"
 BOS_trade_deal_with_eu_expanded_desc: "L'accès élargi aux marchés et au crédit européens renforce l'alignement économique occidental de la Bosnie."
 BOS_trade_with_nato: "Programme d'aide de l'OTAN"
 BOS_trade_with_nato_desc: "Les partenaires de l'OTAN fournissent une aide économique qui abaisse les coûts immédiats et encourage l'alignement politique occidental."
 BOS_trade_with_usa: "Traité commercial conjoint américano-bosniaque"
 BOS_trade_with_usa_desc: "Un accord bilatéral avec les États-Unis soutient la production énergétique, l'accès des consommateurs et l'alignement politique occidental."
 BOS_gov_old_name: "Assemblée parlementaire de Bosnie"
 BOS_islamic_revolt: "Révolte des Moudjahidines de Bosnie"
 BOS_islamic_upper: "Califat bosniaque"
 bos_workers_republic: "République ouvrière de Bosnie-Herzégovine"
 BOS_events.1.t: "Guerre civile bosniaque"
 BOS_events.1.d: "La Republika Srpska a déclaré l'indépendance et la Bosnie est retournée à la guerre civile. Le gouvernement central doit vaincre les forces sécessionnistes ou risquer le partage définitif du pays."
 BOS_events.1.a: "Défendre la Bosnie-Herzégovine"
 BOS_events.1.b: "Se ranger du côté de la Republika Srpska"
 BOS_events.2.t: "Les Croates proclament l'indépendance"
 BOS_events.2.d: "Les dirigeants croates de Bosnie en Herzégovine ont déclaré l'indépendance alors que le pays est déjà divisé par la guerre. Le gouvernement central doit rétablir le contrôle au sud sans abandonner le front contre la Republika Srpska."
 BOS_events.2.a: "Rétablir l'intégrité territoriale du pays"
 BOS_events.2.b: "Soutenir les sécessionnistes croates"
 BOS_events.4.t: "La fin de la guerre"
 BOS_events.4.d: "Le gouvernement a rétabli le contrôle sur la Bosnie-Herzégovine, mettant fin à la guerre civile relancée. La démobilisation, la reconstruction et la réconciliation politique peuvent maintenant commencer."
 BOS_events.4.a: "Réintégration complète"
 BOS_events.4.b: "Autonomie négociée"
 BOS_events.4.c: "Confier la tutelle à l'administration internationale"
 BOS_events.59.t: "L'impasse dégénère en guerre"
 BOS_events.59.d: "La crise sécessionniste a suivi son cours sans règlement. La Republika Srpska a déclaré l'indépendance pure et simple et le pays est de nouveau en guerre."
 BOS_events.59.a: "Maintenir le pays uni par la force"
 BOS_events.60.t: "L’Herzégovine se détache"
 BOS_events.60.d: "Sans accord, les dirigeants croates d'Herzégovine ont déclaré l'indépendance et pris les armes contre Sarajevo."
 BOS_events.60.a: "Rétablir le contrôle au sud"
 BOS_events.11.t: "Arrivée d'armes étrangères"
 BOS_events.11.d: "Un partenaire régional a livré des armes d'infanterie à nos forces. L'envoi renforcera le front et la relation qui le sous-tend."
 BOS_events.11.a: "Distribuer les armes"
 BOS_events.12.t: "Grève des agriculteurs"
 BOS_events.12.d: "Des agriculteurs confrontés à des prix bas, à des terres dangereuses et à un faible soutien de l'État ont lancé une grève nationale. Leurs organisateurs exigent des investissements agricoles et un changement de politique économique."
 BOS_events.12.a: "Accepter un changement de gouvernement"
 BOS_events.12.b: "Négocier avec les agriculteurs"
 BOS_events.13.t: "Accord avec les grévistes"
 BOS_events.13.d: "Le gouvernement et les dirigeants de la grève ont accepté un règlement portant sur les salaires, les protections au travail et les négociations futures. L'accord met fin aux protestations immédiates mais engage l'État dans de nouvelles obligations."
 BOS_events.13.a: "Honorer l'accord"
 BOS_events.14.t: "Grève des mineurs"
 BOS_events.14.d: "Les mineurs ont arrêté la production pour exiger des conditions plus sûres, des salaires fiables et des postes plus courts. La grève se propage dans les communautés qui dépendent de l'industrie."
 BOS_events.14.a: "Accepter un changement de gouvernement"
 BOS_events.14.b: "Négocier avec les mineurs"
 BOS_events.9.t: "La Bosnie demande des armes"
 BOS_events.9.d: "[FROM.GetName] a demandé des armes d'infanterie pour sa guerre civile. L'aide élargirait notre influence dans les Balkans, mais l'équipement devra venir de nos propres réserves."
 BOS_events.9.a: "Envoyer les armes"
 BOS_events.9.b: "Préserver nos stocks"
 BOS_events.34.t: "La Bosnie sollicite l'adhésion à l'OTSC"
 BOS_events.34.d: "[FROM.GetName] a demandé son adhésion à l'OTSC. L'appartenance étendrait l'alliance dans les Balkans occidentaux, mais elle pourrait aussi importer les contentieux non résolus de la Bosnie."
 BOS_events.34.a: "Admettre la Bosnie"
 BOS_events.34.b: "Rejeter la candidature"
 BOS_events.35.t: "Adhésion à l'OTSC approuvée"
 BOS_events.35.d: "La Russie a approuvé notre candidature. La Bosnie partage désormais les obligations de défense collective de l'OTSC."
 BOS_events.35.a: "Accepter les obligations"
 BOS_events.36.t: "Adhésion à l'OTSC rejetée"
 BOS_events.36.d: "La Russie a rejeté notre candidature et a refusé d'étendre l'alliance dans les Balkans."
 BOS_events.36.a: "Reconsidérer notre politique orientale"
 BOS_events.15.t: "Offre de coopération d'armement bosniaque"
 BOS_events.15.d: "[FROM.GetName] a proposé un arrangement militaro-industriel, demandant des licences de production pour des avions et des fusils serbes. Des liens militaires plus étroits lieraient Sarajevo à Belgrade, même si certains en Bosnie en ressentiront la dépendance."
 BOS_events.15.a: "Accorder les licences de production"
 BOS_events.15.b: "Refuser la demande"
 BOS_events.16.t: "Belgrade accorde des licences d'armement"
 BOS_events.16.d: "La Serbie a approuvé le transfert des licences de production. Les usines bosniaques peuvent désormais construire des modèles serbes, même si le sentiment pro-serbe parmi les communautés bosniaques a suscité des troubles."
 BOS_events.16.a: "Commencer la production sous licence"
 BOS_events.17.t: "Belgrade décline"
 BOS_events.17.d: "La Serbie a rejeté l'offre de coopération en matière d'armement, refusant de partager son industrie de défense à ces conditions."
 BOS_events.17.a: "Cherche ailleurs"
 BOS_events.18.t: "Invitation à l'investissement bosniaque"
 BOS_events.18.d: "[FROM.GetName] invite des constructeurs automobiles étrangers à établir une production dans le pays. Construire une usine ouvrirait un nouveau marché et étendrait notre influence commerciale sur l'économie bosniaque."
 BOS_events.18.a: "Construire une usine en Bosnie"
 BOS_events.18.b: "Décliner l'invitation"
 BOS_events.19.t: "Un constructeur automobile étranger investit"
 BOS_events.19.d: "[FROM.GetName] a accepté de construire une usine en Bosnie. L'investissement apporte emplois et capitaux, même si le gouvernement d'origine du constructeur gagnera un pied dans notre politique industrielle."
 BOS_events.19.a: "Saluer l'investissement"
 BOS_events.20.t: "Investissement refusé"
 BOS_events.20.d: "[FROM.GetName] a décliné pour l'instant d'investir dans l'industrie automobile bosniaque."
 BOS_events.20.a: "Adressez-vous à un autre fabricant"
 BOS_events.21.t: "La Bosnie cherche à acheter des fusils"
 BOS_events.21.d: "[FROM.GetName] souhaite acheter un lot d'armes d'infanterie allemandes modernes. La vente rapporterait des devises fortes et de la bonne volonté à Sarajevo."
 BOS_events.21.a: "Approuver la vente"
 BOS_events.21.b: "Refuser la vente"
 BOS_events.22.t: "Fusils allemands livrés"
 BOS_events.22.d: "L'Allemagne a approuvé la vente. Un envoi d'armes d'infanterie modernes est en route vers nos dépôts."
 BOS_events.22.a: "Distribuer les armes"
 BOS_events.23.t: "L'Allemagne refuse la vente"
 BOS_events.23.d: "Berlin a refusé pour l'instant de vendre des armes d'infanterie à la Bosnie."
 BOS_events.23.a: "Rechercher un autre fournisseur"
 BOS_events.24.t: "La Bosnie recherche des fusils russes"
 BOS_events.24.d: "[FROM.GetName] souhaite acheter un important stock d'armes d'infanterie russes. La commande serait une vente bienvenue pour l'industrie russe."
 BOS_events.24.a: "Approuver la vente"
 BOS_events.24.b: "Refuser la vente"
 BOS_events.25.t: "Fusils russes livrés"
 BOS_events.25.d: "La Russie a approuvé la vente. Un important lot d'armes d'infanterie est en route vers nos stocks."
 BOS_events.25.a: "Distribuer les armes"
 BOS_events.26.t: "La Russie refuse la vente"
 BOS_events.26.d: "Moscou a refusé pour l'instant de vendre des armes d'infanterie à la Bosnie."
 BOS_events.26.a: "Rechercher un autre fournisseur"
 BOS_political.4.t: "Les élections d'après-guerre en Bosnie"
 BOS_political.4.d: "La première élection nationale de Bosnie-Herzégovine du nouveau siècle déterminera quelle coalition dirige les institutions fragiles d'après-guerre du pays."
 BOS_political.4.a: "Maintenir le gouvernement dirigé par les Bosniaques"
 BOS_political.4.a_tt: "Le §YParti d'action démocratique§! dirigera le gouvernement. La prochaine rotation présidentielle reviendra à un représentant serbe."
 BOS_political.4.b: "Soutenez une coalition dirigée par les Serbes"
 BOS_political.4.b_tt: "L'§YAlliance des sociaux-démocrates indépendants§! dirigera une coalition avec le §YParti démocratique serbe§!. La prochaine rotation présidentielle reviendra à un représentant croate."
 BOS_political.20.t: "Règlement après la guerre civile"
 BOS_political.20.d: "La guerre est terminée. La Bosnie-Herzégovine a été recentrée sous une seule autorité, et la tâche immédiate est de stabiliser l'État tout en démantelant les anciennes factions."
 BOS_political.20.a: "Établir la Grande Srpska"
 BOS_political.20.b: "Établir un gouvernement dirigé par les Croates"
 BOS_political.20.c: "Réunir la Bosnie sous le contrôle de Sarajevo"
 BOS_political.1.t: "L'État d'après-guerre"
 BOS_political.1.d: "La Bosnie-Herzégovine entre dans le nouveau siècle avec des institutions endommagées, une autorité divisée et une reconstruction inachevée. Le gouvernement doit décider quelle part de pouvoir doit rester aux entités."
 BOS_political.1.a: "Définir le nouvel État"
 BOS_political.2.t: "Autonomie étendue des entités"
 BOS_political.2.d: "Le gouvernement a transféré davantage d'autorité intérieure à l'Herzégovine et à la Republika Srpska tout en conservant une politique étrangère et de défense commune. La Bosnie fonctionne désormais comme une fédération plus lâche."
 BOS_political.2.a: "Mettre en œuvre le règlement"
 BOS_political.3.t: "Réunification fédérale"
 BOS_political.3.d: "L'autonomie élargie a créé des compétences qui se chevauchent dans les communautés mixtes et a affaibli les services communs. Les dirigeants des entités ont accepté la réunification sous un règlement fédéral qui préserve la représentation locale."
 BOS_political.3.a: "Réunifier la fédération"
 BOS_political.5.t: "La crise financière"
 BOS_political.5.d: "La crise financière mondiale a réduit les exportations, resserré le crédit et poussé les employeurs bosniaques vers les licenciements. La reprise exigera une politique budgétaire et industrielle coordonnée."
 BOS_political.5.a: "Préparer un programme de relance."
 BOS_political.6.t: "Milorad Dodik"
 BOS_political.6.d: "Milorad Dodik a consolidé sa direction en Republika Srpska et a fait de l'autonomie de l'entité le cœur de son programme politique. Son réseau croissant compliquera toute tentative de renforcer les institutions nationales."
 BOS_political.6.a: "Sarajevo doit réagir"
 BOS_political.8.t: "Le conflit sur la ségrégation devient violent"
 BOS_political.8.d: "Un différend sur l'intégration des élèves serbes et bosniaques a dégénéré en marche sur l'assemblée municipale. Des dégradations et des attaques contre des commerces de rapatriés ont forcé la police anti-émeute à intervenir."
 BOS_political.8.a: "Les divisions restent profondes"
 BOS_political.9.t: "Les forces de paix prévoient une réduction des effectifs"
 BOS_political.9.d: "L'OTAN a annoncé une réduction de sa présence de maintien de la paix en Bosnie à mesure que la situation sécuritaire s'améliore. Les dirigeants locaux divergent sur le point de savoir si les forces nationales sont prêtes à assumer la mission."
 BOS_political.9.a: "Examiner notre état de préparation"
 BOS_political.10.t: "Signaler des attaques dans la presse"
 BOS_political.10.d: "Un nouveau rapport enregistre une hausse des menaces et des agressions contre les journalistes bosniaques en 2002. Des organisations nationalistes et des patrons politiques locaux sont blâmés pour une grande part de l'intimidation."
 BOS_political.10.a: "Protéger les rapports indépendants"
 BOS_political.11.t: "Nikolić condamné à 23 ans"
 BOS_political.11.d: "Un tribunal a condamné l'officier serbe de Bosnie Dragan Nikolić à 23 ans de prison pour des crimes commis au camp de détention de Sušica. Le jugement a rouvert les contentieux politiques sur la responsabilité de guerre."
 BOS_political.11.a: "La justice doit être appliquée"
 BOS_political.13.t: "Les retours de réfugiés atteignent un nouveau sommet"
 BOS_political.13.d: "Davantages de citoyens déplacés rentrent à mesure que la sécurité s'améliore et que les foyers sont reconstruits. Les autorités locales doivent fournir des services et protéger les rapatriés dans des communautés où les tensions de guerre demeurent."
 BOS_political.13.a: "Soutenir leur retour"
 BOS_political.14.t: "Un froid sévère frappe réfugiés et rapatriés"
 BOS_political.14.d: "Un froid sévère a frappé les communautés de réfugiés et de rapatriés à travers la Bosnie-Herzégovine. Les agences nationales et les Nations unies peinent à livrer combustible de chauffage, abris et nourriture."
 BOS_political.14.a: "Mobiliser les secours d’urgence"
 BOS_political.15.t: "L'explosion endommage la tombe d'Alija Izetbegović"
 BOS_political.15.d: "Un engin explosif a endommagé la tombe de l'ancien président Alija Izetbegović à Sarajevo. L'attaque a provoqué l'indignation publique et ravivé les craintes d'une violence politiquement motivée."
 BOS_political.15.a: "Enquêter sur l'attaque"
 BOS_political.17.t: "Inondations en Europe du Sud-Est"
 BOS_political.17.d: "Des pluies records ont inondé des villes, endommagé les infrastructures et déclenché des glissements de terrain à travers la Bosnie et les États voisins. Les services d'urgence font face à un effort prolongé de secours et de reconstruction."
 BOS_political.17.a: "Coordonner les secours en cas de catastrophe"
 BOS_events.55.t: "Alija Izetbegović est décédé"
 BOS_events.55.d: "L'ancien président Alija Izetbegović est mort des complications d'une maladie cardiaque. Sa mort clôt un chapitre déterminant de la politique bosniaque et de la lutte de la Bosnie-Herzégovine pour l'indépendance."
 BOS_events.55.a: "Honorer son héritage."
 BOS_events.55.b: "L'État doit aller de l'avant"
 BOS_political.21.t: "La Bosnie demande une garantie"
 BOS_political.21.d: "[FROM.GetName] nous a demandé de garantir son indépendance alors que l'EUFOR transfère la responsabilité de la sécurité aux institutions bosniaques."
 BOS_political.21.a: "Garantie Bosnie"
 BOS_political.21.b: "Refuser l'engagement"
 BOS_political.22.t: "La Bosnie propose une union"
 BOS_political.22.d: "Le gouvernement dirigé par la Srpska à [FROM.GetName] a proposé l'incorporation à la Serbie. L'acceptation transférerait le territoire et les forces armées de la Bosnie à notre État."
 BOS_political.22.a: "Approuver l'union"
 BOS_political.22.b: "Préserver des états séparés"
 BOS_zivko_radisic: "Zivko Radišić"
 BOS_ante_jelavic: "Ante Jelavic"
 BOS_halid_genjac: "Halid Genjac"
 BOS_sulejman_tihic: "Sulejman Tihić"
 BOS_mirko_sarovic: "Mirko Sarovic"
 BOS_dragan_covic: "Dragan Covic"
 BOS_haris_silajdzic: "Haris Silajdžić"
 BOS_nebojsa_radmanovic: "Nebojša Radmanovic"
 BOS_zeljko_komsic: "Zeljko Komšić"
 BOS_bosnia_random: "Un nouveau représentant bosniaque assumera la présidence tournante."
 BOS_serb_random: "Un nouveau représentant serbe assumera la présidence tournante."
 BOS_croat_random: "Un nouveau représentant croate assumera la présidence tournante."
 BOS_events.45.a: "Négociations ouvertes"
 BOS_events.45.d: "Les employés du public ont rejoint les troubles sociaux et ont exigé des salaires fiables, la négociation collective et la fin des nominations clientélistes."
 BOS_events.45.t: "Débrayage du secteur public"
 BOS_events.46.a: "Le mouvement s'étend"
 BOS_events.46.d: "Les manifestations se sont étendues des lieux de travail aux centres-villes alors que les syndicats coordonnent leurs revendications par-delà les lignes d'entités."
 BOS_events.46.t: "Manifestations syndicales à l'échelle nationale"
 BOS_events.47.a: "Protéger les institutions publiques."
 BOS_events.47.d: "Une confrontation devant un bâtiment gouvernemental a tourné à la violence. Les dirigeants syndicaux accusent des provocateurs, tandis que les responsables de la sécurité réclament des pouvoirs d'urgence."
 BOS_events.47.t: "Les manifestations deviennent violentes"
 BOS_events.48.a: "Reconnaître le nouveau gouvernement"
 BOS_events.48.d: "L'ancienne coalition a perdu le contrôle du parlement. Un cabinet appuyé par les travailleurs revendique désormais l'autorité de réorganiser l'État et l'économie."
 BOS_events.48.t: "Les travailleurs entrent au gouvernement"
 BOS_eu_accession: "Adhésion à l’Union européenne"
 BOS_eu_accession_desc: "L'adhésion exige de clore les chapitres de négociation un par un. Chaque étape nécessite l'accord des trois groupes constituants, et la Republika Srpska peut bloquer le processus dès que sa direction se montre hostile."
 BOS_eu_judicial_reform: "Clore le chapitre de la justice"
 BOS_eu_judicial_reform_desc: "Aligner la procédure judiciaire, le contrôle d'appel et l'indépendance des procureurs sur les critères d'adhésion de l'UE."
 BOS_eu_anti_corruption_commitments: "Adopter des engagements anticorruption"
 BOS_eu_anti_corruption_commitments_desc: "S'engager sur des critères anticorruption suivis par l'UE. Bruxelles n'ouvrira pas ce chapitre tant que la capture de l'État restera grave."
 BOS_eu_market_alignment: "S'aligner sur le marché unique"
 BOS_eu_market_alignment_desc: "Adopter les normes de produits, les procédures douanières et les règles de concurrence de l'UE. La mise en conformité est coûteuse, mais elle débloque les fonds de préadhésion."
 BOS_eu_candidate_status: "Statut de candidat sécurisé"
 BOS_eu_candidate_status_desc: "Demander au Conseil européen de reconnaître la Bosnie-Herzégovine comme candidate officielle à l'adhésion."
 BOS_eu_open_negotiations: "Négociations d'adhésion ouvertes"
 BOS_eu_open_negotiations_desc: "Ouvrir des négociations formelles d'adhésion avec la Commission européenne. Attendre la résistance de Banja Luka à mesure que les obligations au niveau de l'État s'étendent."
 BOS_eu_sign_accession_treaty: "Signer le traité d'adhésion"
 BOS_eu_sign_accession_treaty_desc: "Conclure les négociations et signer le traité d'adhésion. L'adhésion elle-même exige encore une demande formelle à l'Union européenne."
 BOS_treasury_5_tt: "Le Trésor détient au moins £treasury 5.0"
 BOS_treasury_2_tt: "Le Trésor détient au moins £treasury 2.0"
 BOS_judiciary_meets_eu_standards_tt: "La justice atteint les critères d'adhésion de l'UE"
 BOS_anti_corruption_framework_tt: "Un cadre anti-corruption surveillé par l'UE est en place"
 BOS_market_aligned_with_eu_tt: "La réglementation intérieure est alignée sur le marché unique"
 BOS_recognized_eu_candidate_tt: "La Bosnie-Herzégovine devient une candidate reconnue à l'adhésion à l'UE"
 BOS_eu_application_open_tt: "La Bosnie-Herzégovine peut désormais demander l'adhésion à l'Union européenne"
 BOS_economic_development: "Développement économique"
 BOS_economic_development_desc: "Investissements financés de l'étranger, privatisations et programmes de reconstruction pour l'économie d'après-guerre.\n Les réseaux de clientèle au niveau des entités contrôlent nominations, marchés et une grande part de l'économie. Les démanteler est lent et irrite ceux qui en profitent."
 BOS_court_turkish_investment: "Solliciter les investissements turcs"
 BOS_court_turkish_investment_desc: "Ouvrir la porte aux entreprises de construction et aux banques turques. L'argent d'Ankara afflue, et avec lui l'influence turque sur Sarajevo."
 BOS_court_gulf_investment: "Solliciter les investissements du Golfe"
 BOS_court_gulf_investment_desc: "Inviter les fonds du Golfe dans l'immobilier, le tourisme et la finance. Les capitaux soulèvent le Trésor et apaisent l'humeur, et le standing de Riyad en Bosnie grandit."
 BOS_rapid_privatization: "Privatisation rapide"
 BOS_rapid_privatization_desc: "Vendre les entreprises d'État rapidement à quiconque achètera. Les ventes remplissent le Trésor et relèvent la production, mais les bonnes affaires nourrissent la corruption et inquiètent la main-d'œuvre."
 BOS_transparent_privatization: "Privatisation transparente"
 BOS_transparent_privatization_desc: "Vendre les entreprises d'État par appels d'offres ouverts et audités. Les recettes sont plus faibles et le processus plus lent, mais le favoritisme recule et la confiance publique tient."
 BOS_thermal_plant_chinese_financing: "Centrale thermique financée par la Chine"
 BOS_thermal_plant_chinese_financing_desc: "Contracter un prêt chinois pour agrandir une centrale au lignite. La production monte tout de suite, mais la dette et l'influence de Pékin viennent avec."
 BOS_hydro_refurbishment: "Rénover les centrales hydroélectriques"
 BOS_hydro_refurbishment_desc: "Rénover les barrages et turbines vieillissants sur la Neretva et la Drina. La facture initiale est réelle, mais une électricité fiable stabilise l'industrie."
 BOS_end_brcko_supervision: "Mettre fin à la surveillance de Brcko"
 BOS_end_brcko_supervision_desc: "Mettre fin au régime de supervision internationale du district de Brčko et le remettre pleinement aux institutions locales. La Republika Srpska testera immédiatement le nouvel arrangement."
 BOS_police_restructuring: "Restructurer la police"
 BOS_police_restructuring_desc: "Consolider les polices fragmentées des entités dans un cadre étatique, condition de l'UE pour des liens plus étroits. La Republika Srpska ressent durement la perte de contrôle."
 BOS_anti_corruption_investigations: "Enquêtes anticorruption"
 BOS_anti_corruption_investigations_desc: "Orienter les procureurs de l'État contre les réseaux de clientèle enracinés. La corruption reculera, mais le groupe constituant dont les responsables seront inculpés s'agitera."
 BOS_judicial_appointments: "Dépolitiser les nominations judiciaires"
 BOS_judicial_appointments_desc: "Transférer le contrôle des nominations judiciaires des directions de parti à un conseil indépendant."
 BOS_depoliticized_judiciary_tt: "Les nominations judiciaires sont isolées du contrôle partisan"
 BOS_public_procurement_reform: "Réforme des marchés publics"
 BOS_public_procurement_reform_desc: "Introduire des appels d'offres ouverts pour les marchés de l'État. Publier les livres coûte d'abord de l'argent et met fin à plusieurs arrangements confortables."
 BOS_transparent_procurement_tt: "Les marchés d'État sont attribués par appels d'offres ouverts"
 BOS_diaspora_investment_drive: "Campagne d'investissement de la diaspora"
 BOS_diaspora_investment_drive_desc: "Inviter les associations d'affaires de la diaspora à cofinancer des projets publics et placer une émission obligataire ponctuelle auprès des épargnants émigrés."
 BOS_dual_citizenship_outreach: "Sensibilisation à la double citoyenneté"
 BOS_dual_citizenship_outreach_desc: "Simplifier les procédures de double nationalité et l'enregistrement consulaire pour que les émigrés gardent des liens formels avec le pays. Une diaspora enregistrée plus large envoie davantage d'argent au pays."
 BOS_expanded_dual_citizenship_tt: "Les envois de fonds de la diaspora augmentent de 20 %"
 BOS_diaspora_return_program: "Programme de retour de la diaspora"
 BOS_diaspora_return_program_desc: "Financer des aides à la réinstallation et le placement professionnel des familles rentrant de l'étranger. Coûteux, mais le pays a plus besoin de gens que d'argent."
 BOS_treasury_1_tt: "Le Trésor détient au moins £treasury 1.0"
 BOS_dayton_pressure: "Dayton sous pression"
 BOS_dayton_pressure_desc: "La Republika Srpska défie les institutions de l'État et menace de sécession. Sarajevo peut concéder de l'autonomie, demander au Haut Représentant d'imposer un règlement, ou chercher un arbitrage international."
 BOS_concede_to_srpska_demands: "Céder aux exigences de l'entité"
 BOS_concede_to_srpska_demands_desc: "Rendre les compétences contestées à la Republika Srpska. La crise s'achève, au prix de l'autorité centrale."
 BOS_invoke_bonn_powers: "Invoquer les pouvoirs de Bonn"
 BOS_invoke_bonn_powers_desc: "Demander au Haut Représentant d'imposer la législation contestée et de destituer les responsables qui font obstruction. Efficace, et profondément mal vu à Banja Luka."
 BOS_request_international_arbitration: "Demander un arbitrage international"
 BOS_request_international_arbitration_desc: "Renvoyer le différend à un arbitrage international. Lent et coûteux, mais cela met fin à l'impasse sans récompenser ni l'un ni l'autre camp."
 BOS_phase_out_ohr_supervision: "Supprimer progressivement la supervision des OHR"
 BOS_phase_out_ohr_supervision_desc: "Les relations entre entités étant stables, négocier le transfert des pouvoirs restants du Haut Représentant aux institutions nationales."
 BOS_dayton_pressure_decisions_available_tt: "Des réponses à la crise sont disponibles dans les décisions Dayton sous pression"
 BOS_eu_candidate: "Candidat à l'adhésion à l'UE"
 BOS_eu_candidate_desc: "Le statut de candidat donne à la Bosnie-Herzégovine une voie formelle vers l'adhésion, des rapports de progrès réguliers et des relations plus aisées avec les États membres."
 BOS_eu_negotiations: "Négociations d'adhésion à l'UE"
 BOS_eu_negotiations_desc: "Les chapitres d'adhésion sont ouverts et l'assistance technique de l'UE afflue dans les institutions de l'État, accélérant le travail administratif et d'infrastructure."
 BOS_eu_accession_treaty: "Traité d'adhésion à l'UE signé"
 BOS_eu_accession_treaty_desc: "Le traité d'adhésion est signé et la ratification est en cours. Les marchés tiennent l'adhésion pour acquise, et l'appareil d'État travaille avec une direction claire."
 BOS_eu_accession_funds: "Aide de préadhésion"
 BOS_eu_accession_funds_desc: "Les fonds de l'instrument d'aide de préadhésion financent les infrastructures, la capacité administrative et un emprunt d'État moins cher."
 BOS_republika_srpska_secession_crisis: "Crise de sécession"
 BOS_republika_srpska_secession_crisis_desc: "La Republika Srpska boycotte les institutions de l'État et prépare une législation référendaire. Les patrons étrangers guettent une ouverture tant que l'impasse dure."
 BOS_ohr_supervision: "Supervision du BHR"
 BOS_ohr_supervision_desc: "Le Haut Représentant exerce directement les pouvoirs de Bonn. Les décisions imposées maintiennent l'État fonctionnel mais mettent de côté les institutions élues."
 BOS_national_reconciliation: "Réconciliation nationale"
 BOS_national_reconciliation_desc: "Les trois groupes constituants soutiennent le gouvernement de l'État. La coopération entre entités est devenue routinière plutôt qu'exceptionnelle."
 BOS_political.24.t: "Statut de candidat accordé"
 BOS_political.24.d: "Le Conseil européen a formellement reconnu la Bosnie-Herzégovine comme candidate à l'adhésion. La décision récompense des années de réforme et oblige Bruxelles à rendre compte de nos progrès chaque année."
 BOS_political.24.a: "Un avenir européen"
 BOS_political.25.t: "Banja Luka bloque les pourparlers"
 BOS_political.25.d: "Les délégués de la Republika Srpska ont quitté le parlement de l'État, refusant de ratifier le cadre de négociation à moins que les compétences des entités ne soient garanties par écrit."
 BOS_political.25.a: "Négocier leur retour"
 BOS_political.25.b: "Ratifier sans eux"
 BOS_political.26.t: "Le scandale des marchés publics éclate"
 BOS_political.26.d: "Des journalistes ont publié des contrats liant de hauts responsables d'entités à des marchés publics truqués. Le réseau s'étend aux ministères, aux entreprises d'État et à au moins un parti au pouvoir."
 BOS_political.26.a: "Poursuivre le réseau"
 BOS_political.26.b: "Enterrer l'affaire"
 BOS_political.27.t: "La Republika Srpska menace de sécession"
 BOS_political.27.d: "L'assemblée de l'entité à Banja Luka a prévu un vote sur le retrait des institutions de l'État, et sa direction discute ouvertement d'un référendum d'indépendance."
 BOS_political.27.a: "L'État doit réagir"
 BOS_political.28.t: "L'impasse se durcit"
 BOS_political.28.d: "Des mois de boycott se sont écoulés sans règlement. Les institutions de l'entité fonctionnent désormais comme si l'autorité de l'État était facultative, et les modérés de tous bords ont perdu du terrain."
 BOS_political.28.a: "Un dangereux précédent"
 BOS_diaspora_remittances: "Envois de fonds de la diaspora"
 BOS_diaspora_remittances_desc: "L'argent envoyé au pays par les Bosniaques travaillant à l'étranger vaut environ un dixième du PIB. Il atteint des foyers dans toutes les parties du pays, y compris ceux que le budget de l'État n'atteint jamais."
 BOS_diaspora_returnees: "Diaspora de retour"
 BOS_diaspora_returnees_desc: "Des aides à la réinstallation ramènent des familles d'Allemagne, d'Autriche et de Scandinavie. Elles arrivent avec des économies, des compétences et des enfants."
 BOS_nato_interoperability: "Interopérabilité de l'OTAN"
 BOS_nato_interoperability_desc: "Des exercices conjoints, des normes de l'Alliance et des programmes du Partenariat pour la paix reconstruisent les forces armées selon les lignes occidentales."
 BOS_political.29.t: "L’argent de la diaspora revient à la maison"
 BOS_political.29.d: "La campagne d'investissement s'est close avec des engagements d'entrepreneurs de la diaspora à travers l'Europe et l'Amérique du Nord. Les sommes sont modestes selon les standards internationaux, mais elles arrivent dans des municipalités que les investisseurs étrangers ignorent."
 BOS_political.29.a: "Bienvenue nouvelle"
 BOS_political.30.t: "Karadžić est en détention"
 BOS_political.30.d: "La nouvelle de Belgrade s'est répandue à Sarajevo en moins d'une heure. Radovan Karadžić, dirigeant de guerre des Serbes de Bosnie, a été arrêté et doit être transféré à La Haye. Les associations de survivants et les familles de victimes se rassemblent en veillées silencieuses de Sarajevo à Srebrenica. À Banja Luka, l'humeur est plus sombre."
 BOS_political.30.a: "Treize ans trop tard"
 BOS_political.31.t: "Mladić est en détention"
 BOS_political.31.d: "Ratko Mladić, commandant de l'armée qui a perpétré le massacre de Srebrenica, a été arrêté dans une ferme du nord de la Serbie. Pour les mères de Srebrenica, l'arrestation met fin à seize ans d'attente. De l'autre côté de la ligne de démarcation inter-entités, certains parlent encore de lui comme d'un défenseur."
 BOS_political.31.a: "La justice atteint Lazarevo"
 BOS_political.32.t: "L'arrêt Sejdić-Finci"
 BOS_political.32.d: "La Cour européenne des droits de l'homme a jugé que les règles ethniques d'éligibilité de la Constitution violent la Convention européenne. Dervo Sejdić et Jakob Finci, militant rom et dirigeant de la communauté juive, ne peuvent se présenter à la présidence parce qu'ils n'appartiennent à aucun des trois peuples constituants. Les partis croates ajoutent que le dispositif actuel permet à d'autres d'élire à leur place leur membre de la présidence. Appliquer l'arrêt exige un changement constitutionnel que personne n'a hâte de négocier."
 BOS_political.32.a: "Amender Dayton est plus facile à dire qu'à faire"
 BOS_sejdic_finci_ruling_tt: "§YStrasbourg a statué contre les règles ethniques d'éligibilité de la Constitution. Une réforme judiciaire qui répond à l'arrêt pèsera davantage à Bruxelles.§!"
 BOS_sejdic_finci_addressed_tt: "§GLa réforme répond à l'arrêt Sejdić-Finci, clôturant une exigence permanente de Bruxelles.§!"
 BOS_serbia_reaction_tt: "La Serbie décidera si elle soutient la Republika Srpska."
 BOS_croatia_reaction_tt: "La Croatie décidera si elle soutient l'Herceg-Bosna."
 BOS_political.33.t: "L'EUFOR prend le relais"
 BOS_political.33.d: "Lors d'une cérémonie au camp Butmir, la Force de stabilisation dirigée par l'OTAN a officiellement remis sa mission à l'Union européenne. L'opération Althea hérite des troupes, des bases et du mandat de la SFOR dans le cadre des arrangements Berlin Plus. Pour la plupart des Bosniaques, le seul changement visible est le drapeau sur la manche."
 BOS_political.33.a: "Les drapeaux changent à Butmir"
 BOS_political.34.t: "Le premier recensement depuis la guerre"
 BOS_political.34.d: "Les recenseurs ont commencé le premier dénombrement de la population depuis 1991. Chaque question d'ethnicité, de langue et de confession est un terrain contesté, et la Republika Srpska a déjà annoncé qu'elle n'accepterait pas la méthodologie de comptage des citoyens vivant à l'étranger. Derrière les formulaires se tient la question que personne ne pose à voix haute : qui est encore là."
 BOS_political.34.a: "Compte ce qui reste"
 BOS_political.35.t: "Tuzla brûle"
 BOS_political.35.d: "Des protestations nées devant les usines en faillite de Tuzla se sont étendues à Sarajevo, Zenica et Mostar. Des bâtiments gouvernementaux brûlent, et les foules ne scandent pas de slogans ethniques mais réclament des emplois et la poursuite des fraudes à la privatisation. Des plénums citoyens se forment pour porter leurs revendications directement aux gouvernements cantonaux."
 BOS_political.35.a: "Satisfaire les revendications des plénums"
 BOS_political.35.b: "Rétablissez d'abord la commande"
 BOS_political.36.t: "Candidature déposée à Bruxelles"
 BOS_political.36.d: "Le président du Conseil des ministres a remis la demande d'adhésion de la Bosnie à l'Union européenne à la présidence néerlandaise du Conseil. Des années d'adaptation restent avant que le statut de candidat ne soit à portée, mais la demande engage, sur le papier du moins, tous les niveaux de gouvernement dans la même direction."
 BOS_political.36.a: "La route sera longue"
 BOS_political.37.t: "Le Haut Représentant interdit la négation du génocide"
 BOS_political.37.d: "Dans l'un de ses derniers actes en fonction, le Haut Représentant sortant a imposé des peines pénales pour la négation du génocide de Srebrenica et la glorification des criminels de guerre. Banja Luka s'est soulevée. Les dirigeants de l'entité déclarent la décision nulle, annoncent un boycott des institutions de l'État et parlent ouvertement de reprendre ce que Dayton a cédé."
 BOS_political.37.a: "La loi s'applique à tous"
 BOS_political.37.b: "Tenir l'État à l'écart"
 BOS_political.38.t: "Banja Luka vote le retrait"
 BOS_political.38.d: "L'assemblée de l'entité a chargé son gouvernement de retirer la Republika Srpska de l'armée de l'État, de l'administration fiscale et de la justice dans les six mois. Les conclusions sont pour l'instant déclaratoires, mais elles tracent en clair le chemin de la dissolution. Les ambassades rédigent des communiqués, et les garants de Dayton sont interrogés sur ce que l'accord vaut encore."
 BOS_political.38.a: "Saisir les garants"
 BOS_political.38.b: "Attendre que Banja Luka cède"
 BOS_political.40.t: "Le Kosovo proclame son indépendance"
 BOS_political.40.d: "Pristina a proclamé l'indépendance vis-à-vis de la Serbie. La déclaration divise la Bosnie : les dirigeants bosniaques et croates penchent vers la reconnaissance, tandis que la Republika Srpska met en garde contre un précédent pour sa propre séparation."
 BOS_political.40.a: "Exprimer son soutien à l'autodétermination"
 BOS_political.40.b: "Rejeter la déclaration unilatérale"
 BOS_political.40.c: "Rester neutre pour tenir l'État ensemble"
 BOS_political.41.t: "Des migrants s'amassent dans l'Una-Sana"
 BOS_political.41.d: "Des milliers de personnes sur la route des Balkans occidentaux sont bloquées près de la frontière croate. Les autorités du canton d'Una-Sana disent que les camps débordent et qu'elles ne peuvent y faire face seules."
 BOS_political.41.a: "Demander l'aide de l'Union européenne"
 BOS_political.41.b: "Resserrer la frontière et vider les camps"
 BOS_political.42.t: "Accord d'association avec l'Europe"
 BOS_political.42.d: "La Bosnie-Herzégovine a signé l'accord de stabilisation et d'association avec l'Union européenne. C'est la première étape contractuelle sur la longue route vers l'adhésion."
 BOS_political.42.a: "Une étape vers l’Europe"
 BOS_political.43.t: "Une taxe sur la valeur ajoutée de l'État"
 BOS_political.43.d: "Une TVA unique au niveau de l'État remplace l'ancien patchwork de taxes de vente des entités. La perception est centralisée et les recettes sont partagées via un compte national unique."
 BOS_political.43.a: "Mettre en œuvre l'impôt unifié"
 BOS_political.43.b: "Laisser les entités conserver leurs propres taux"
 BOS_political.44.t: "Le paquet d'avril"
 BOS_political.44.d: "Un ensemble négocié d'amendements constitutionnels renforcerait l'État central et simplifierait la présidence. Il manque deux voix à la Chambre des représentants."
 BOS_political.44.a: "Dépenser du capital politique pour faire passer les réformes"
 BOS_political.44.b: "Laisser le paquet échouer"
 BOS_political.45.t: "Les pourparlers de Butmir"
 BOS_political.45.d: "Des médiateurs américains et européens ont réuni les dirigeants de partis sur une base près de Sarajevo pour briser l'impasse constitutionnelle. Les propositions demandent aux entités de céder des pouvoirs à l'État."
 BOS_political.45.a: "S'engager avec les médiateurs"
 BOS_political.45.b: "Défendre les prérogatives des entités"
 BOS_political.46.t: "Le district de Brčko en question"
 BOS_political.46.d: "La Republika Srpska menace de retirer ses responsables des institutions partagées du district de Brčko, le corridor autonome placé sous supervision de l'État après la guerre."
 BOS_political.46.a: "Défendre le statut partagé du district"
 BOS_political.46.b: "Céder du terrain pour préserver la paix"
 BOS_political.47.t: "Mostar sans gouvernement"
 BOS_political.47.d: "Les partis croates et bosniaques ne parviennent pas à s'entendre sur un statut de la ville, et Mostar a passé des années sans élections locales valides. La ville divisée dérive sans conseil."
 BOS_political.47.a: "Imposer un statut de ville unifié"
 BOS_political.47.b: "Laisser les partis à leur impasse"
 BOS_political.48.t: "L'exode s'accélère"
 BOS_political.48.d: "Les bus et les vols à bas prix au départ de Sarajevo, Tuzla et Banja Luka partent pleins dans un seul sens. Jeunes diplômés, artisans et familles entières partent pour l'Allemagne, l'Autriche et la Croatie plus vite que l'État ne peut les remplacer."
 BOS_political.48.a: "Commander un rapport sur les causes"
 BOS_political.48.b: "Rejetez-le comme une mobilité ordinaire de l’ère européenne"
 BOS_political.49.t: "Komšić remporte le siège croate"
 BOS_political.49.d: "Željko Komšić a remporté le siège croate de la présidence sur des voix à majorité bosniaque, battant Dragan Čović du HDZ. Des villes à majorité croate le déclarent indésirable, et Zagreb proteste contre un résultat que sa propre communauté rejette."
 BOS_political.49.a: "Un mandat multiethnique, équitablement gagné"
 BOS_political.49.b: "Les électeurs croates ont été minorisés, pas représentés"
 BOS_political.50.t: "L'impasse du programme OTAN"
 BOS_political.50.d: "Les ministres du SNSD refusent de laisser l'État soumettre un programme national annuel à l'OTAN, et sans celui-ci le Conseil des ministres ne peut se former. Des mois passent sans aucun gouvernement."
 BOS_political.50.a: "Soumettre le programme malgré tout"
 BOS_political.50.b: "Proposer plutôt un programme de réforme sous un autre nom."
 BOS_political.51.t: "Un gouvernement, enfin"
 BOS_political.51.d: "Quatorze mois après l'élection, le Conseil des ministres a prêté serment. Sarajevo a de nouveau un gouvernement, acheté par un compromis de façade dont personne n'est pleinement satisfait."
 BOS_political.51.a: "Retour au travail"
 BOS_political.52.t: "Un Haut Représentant sans mandat"
 BOS_political.52.d: "Christian Schmidt a pris ses fonctions de Haut Représentant, mais le Conseil de sécurité de l'ONU n'a jamais entériné sa nomination. La Russie, la Chine et la direction de la Republika Srpska se sont emparées de cette lacune pour dire son autorité illégitime."
 BOS_political.52.a: "Tout continue comme d'habitude à Sarajevo"
 BOS_political.53.t: "Des réformes imposées aux urnes"
 BOS_political.53.d: "Alors que les bureaux fermaient, le Haut Représentant a usé de ses pouvoirs de Bonn pour imposer des amendements à la Constitution de la Fédération et à la loi électorale, élargissant la Chambre des peuples et fixant des délais pour former les gouvernements. Les critiques parlent d'une constitution imposée ; le HDZ parle d'un retard comblé."
 BOS_political.53.a: "Une solution pragmatique, quelle que soit la manière dont elle est arrivée"
 BOS_political.53.b: "Un excès illibéral"
 BOS_political.53.c: "Rester hors de la dispute"
 BOS_political.54.t: "Banja Luka annule la Cour"
 BOS_political.54.d: "L'assemblée de l'entité a adopté des lois déclarant que les arrêts de la Cour constitutionnelle de l'État ne s'appliquent pas en Republika Srpska, et interdisant la publication des décisions du Haut Représentant au journal officiel de l'entité. L'autorité de Sarajevo s'arrête désormais à la ligne de démarcation inter-entités."
 BOS_political.54.a: "Le contester par tous les canaux disponibles"
 BOS_political.54.b: "Laisser passer le moment"
 BOS_hr_legitimacy_disputed_tt: "§RLa Republika Srpska tient les décisions du Haut Représentant pour nulles, approfondissant la crise§!"
 BOS_political.55.t: "Bruxelles ouvre les pourparlers"
 BOS_political.55.d: "Huit ans après la demande bosniaque, le Conseil européen a accepté d'ouvrir les négociations d'adhésion. La route vers l'adhésion reste longue, mais pour la première fois elle passe par Bruxelles plutôt qu'autour."
 BOS_political.55.a: "Célébrer l'étape"
 BOS_political.55.b: "Tempérer les célébrations"
 BOS_political.57.t: "Dodik condamné et interdit"
 BOS_political.57.d: "La Cour de Bosnie-Herzégovine a condamné Milorad Dodik pour avoir défié les décisions du Haut Représentant et lui a interdit d'exercer une fonction. Les institutions de la Republika Srpska doivent décider si elles acceptent l'arrêt ou le défient."
 BOS_political.57.a: "L'arrêt tient"
 BOS_political.57.b: "La Republika Srpska ne se laissera pas dicter qui la dirige"
 BOS_reject_third_entity_demand: "Rejeter la demande de troisième entité"
 BOS_reject_third_entity_demand_desc: "Écarter la restructuration de la Fédération en une entité séparée à majorité croate. Les partis bosniaques sont soulagés ; les partis croates y voient la preuve que Sarajevo n'écoutera jamais."
 BOS_concede_partial_croat_autonomy: "Concéder une autonomie partielle aux Croates"
 BOS_concede_partial_croat_autonomy_desc: "Accorder aux cantons à majorité croate une autonomie élargie en deçà d'une troisième entité complète. Cela répond au grief central du HNS, au prix d'une couche supplémentaire de gouvernement à coordonner."
 BOS_register_defence_property: "Enregistrer les biens de défense comme propriété d'État"
 BOS_register_defence_property_desc: "Transférer les sites militaires encore revendiqués par les entités sur les livres de l'État, condition préalable que l'OTAN a fixée pour activer un plan d'action pour l'adhésion."
 BOS_request_nato_waiver: "Demander une dérogation OTAN"
 BOS_request_nato_waiver_desc: "Demander à l'OTAN de renoncer purement et simplement à la condition sur les biens de défense plutôt que d'attendre le consentement de la Republika Srpska. Cela fonctionne, et Banja Luka n'oublie pas qui l'a demandé."
 BOS_activate_map: "Activer le plan d'action pour l'adhésion"
 BOS_activate_map_desc: "La question des biens étant réglée, reprendre le plan d'action pour l'adhésion de l'OTAN et ouvrir la voie formelle vers l'adhésion."
 BOS_expand_arms_exports: "Élargir les exportations de munitions et d'armes"
 BOS_expand_arms_exports_desc: "Soutenir les usines d'armement liées à l'État alors qu'elles accroissent leurs exportations vers des acheteurs en Europe et au-delà. Les carnets de commandes sont pleins, tout comme le débat sur la destination des envois."
 BOS_gulf_investment_delivered_tt: "§GBuroj Ozone pose la première pierre dans les délais§!"
 BOS_gulf_investment_stalled_tt: "§RBuroj Ozone s'enlise bien en deçà de ce qui avait été promis§!"
 BOS_host_sarajevo_film_festival: "Accueillir le Festival du film de Sarajevo"
 BOS_host_sarajevo_film_festival_desc: "Soutenir le plus grand festival de cinéma d'Europe du Sud-Est par des fonds et une logistique d'État. Il attire touristes et presse à Sarajevo chaque été et maintient le profil culturel de la ville bien devant ses voisins."
 BOS_federation_development_grant: "Subvention de développement de la Fédération"
 BOS_federation_development_grant_desc: "Canaliser des fonds du Trésor vers les infrastructures des cantons de la Fédération à majorité bosniaque. La communauté bosniaque salue l'investissement, même si la Republika Srpska y lit du favoritisme."
 BOS_herzegovina_development_grant: "Subvention de développement de l'Herzégovine"
 BOS_herzegovina_development_grant_desc: "Financer routes et services en Herzégovine à majorité croate. Les dirigeants croates y voient une reconnaissance, tandis que les Bosniaques en veulent de l'argent qui va aux fiefs nationalistes."
 BOS_srpska_development_grant: "Subvention de développement de la Republika Srpska"
 BOS_srpska_development_grant_desc: "Orienter des fonds du Trésor vers les infrastructures de la Republika Srpska. Le geste achète la bonne volonté serbe, mais les Bosniaques s'irritent de récompenser l'entité qui ne cesse de menacer de partir."
 BOS_croat_grievance: "Grief politique croate"
 BOS_croat_grievance_desc: "Les partis croates disent que le siège croate de la présidence a été tranché par des voix bosniaques, non croates, et exigent un système électoral qui ne puisse être mis en minorité depuis l'extérieur de la communauté."
 BOS_third_entity_demand: "Restructuration fédérale"
 BOS_third_entity_demand_desc: "Les cantons à majorité croate disposent d'une autonomie élargie, obtenue au prix d'un appareil d'État d'une couche plus compliquée à diriger."
 BOS_contested_high_representative: "Le mandat contesté du haut représentant"
 BOS_contested_high_representative_desc: "Le Haut Représentant a pris ses fonctions sans aval du Conseil de sécurité de l'ONU. La Republika Srpska tient cette lacune pour licence d'ignorer ses arrêts, et chaque usage des pouvoirs de Bonn invite désormais un conflit de légitimité autant qu'un conflit de politique."
 BOS_map_participant: "Plan d'action pour l'adhésion à l'OTAN"
 BOS_map_participant_desc: "Des officiers bosniaques s'entraînent et planifient aux côtés de leurs homologues de l'OTAN dans le cadre du plan d'action pour l'adhésion, la voie formelle vers une adhésion éventuelle."
 BOS_arms_export_boom: "Boom des exportations d'armes"
 BOS_arms_export_boom_desc: "Les usines d'armement liées à l'État tournent à pleine capacité pour remplir des commandes de calibres OTAN comme de calibres du pacte de Varsovie. Le Trésor en profite, tout comme le débat sur qui les envois atteignent vraiment."
 BOS_brain_drain_1: "Émigration massive"
 BOS_brain_drain_1_desc: "Des centaines de milliers de personnes sont parties depuis le début de l'ère sans visa, et les diplômés et les jeunes y sont surreprésentés. Salles de classe, cliniques et ateliers en ressentent tous le manque."
 BOS_brain_drain_eased_tt: "§GLes familles de retour atténuent le problème de l'émigration de masse§!"
 BOS_economic_reconstruction: "Reconstruire l'économie"
 BOS_economic_reconstruction_desc: "La Bosnie d'après-guerre n'a jamais fini de se reconstruire. Une génération plus tard, l'État a encore besoin d'un programme économique cohérent plutôt que de privatisations au coup par coup et de prêts étrangers pris un à un."
 BOS_reform_agenda_adoption: "Adopter l'agenda de réforme"
 BOS_reform_agenda_adoption_desc: "S'engager sur le programme de réforme socioéconomique que l'UE a fixé comme prix de la réactivation de la voie d'adhésion. Les réformes judiciaires et de marché avancent plus vite une fois que Bruxelles peut pointer un plan formel."
 BOS_growth_plan_negotiations: "Négocier le plan de croissance"
 BOS_growth_plan_negotiations_desc: "Ouvrir des pourparlers pour puiser dans le Mécanisme de réforme et de croissance de l'UE. L'argent est réel, mais les conditions qui l'accompagnent aussi."
 BOS_corridor_vc_northern_construction: "Construire le corridor nord"
 BOS_corridor_vc_northern_construction_desc: "Pousser la construction du corridor Vc à travers Doboj, Zenica et Sarajevo. C'est le plus grand projet d'infrastructure du pays depuis la guerre, financé surtout par Bruxelles."
 BOS_corridor_vc_southern_construction: "Prolonger le corridor vers le sud"
 BOS_corridor_vc_southern_construction_desc: "Poursuivre l'autoroute vers Mostar, refermant l'écart entre le nord industriel de la Fédération et son sud tourné vers l'Adriatique."
 BOS_corridor_vc_opening: "Couloir Ouvert Vc"
 BOS_corridor_vc_opening_desc: "Couper le ruban de l'itinéraire achevé de la frontière hongroise au port de Ploče. C'est le livrable le plus clair de deux décennies de développement financé par l'UE."
 BOS_east_energy_partnership: "Solliciter le financement énergétique chinois"
 BOS_east_energy_partnership_desc: "S'appuyer sur les prêts et entrepreneurs d'État chinois pour maintenir et étendre les centrales au charbon du pays, quel qu'en soit le coût pour le dossier d'adhésion à l'UE."
 BOS_west_energy_partnership: "Aligner la politique énergétique sur l'UE"
 BOS_west_energy_partnership_desc: "Orienter l'investissement vers l'hydroélectricité et les modernisations de réseau financées par l'UE plutôt que vers de nouvelles capacités charbon, en maintenant le secteur énergétique dans les règles européennes des aides d'État."
 BOS_defense_industry_revival: "Relancer les usines de défense"
 BOS_defense_industry_revival_desc: "Mettre le soutien de l'État derrière Igman Konjic et Unis Ginex, les usines de munitions qui fournissaient autrefois la moitié de la Yougoslavie et tournent aujourd'hui bien en deçà de leur capacité."
 BOS_arms_industry_capacity_expansion: "Augmenter la capacité de production"
 BOS_arms_industry_capacity_expansion_desc: "Rééquiper les usines d'armement pour faire tourner à la fois des lignes de calibres OTAN et du pacte de Varsovie, la combinaison qui rend les munitions bosniaques vendables presque partout."
 BOS_defense_export_drive: "Poursuivre le boom des exportations"
 BOS_defense_export_drive_desc: "Soutenir les usines alors qu'elles montent en cadence pour les marchés d'exportation ouverts par une demande étrangère renouvelée. Les carnets de commandes sont pleins et se remplissent encore."
 BOS_national_jobs_program: "Lancer un programme national d'emplois"
 BOS_national_jobs_program_desc: "Financer la création d'emplois et la formation au pays pour donner aux centaines de milliers de personnes parties depuis l'ère sans visa une raison d'envisager de rester, ou de revenir."
 BOS_youth_retention_initiative: "Investir dans la rétention des jeunes"
 BOS_youth_retention_initiative_desc: "Étendre le programme d'emplois par des aides et un soutien au logement visés clairement vers les jeunes diplômés et artisans qui composent l'essentiel de l'exode."
 BOS_brain_drain_reversed_tt: "§GLe problème de l'émigration de masse a été résolu§!"
 BOS_corridor_vc_trade_boost: "Couloir Vc Ouvert"
 BOS_corridor_vc_trade_boost_desc: "La liaison autoroutière achevée réduit les temps de fret à travers le pays et jusqu'à l'Adriatique, facilitant le commerce avec le reste de l'Europe."
 BOS_defense_industrial_base: "Base industrielle de défense relancée"
 BOS_defense_industrial_base_desc: "Igman Konjic et Unis Ginex se rapprochent de leur ancienne capacité, même si la production supplémentaire concurrence encore les biens civils pour les mêmes usines."
 BOS_jobs_program_idea: "Programme national pour l'emploi"
 BOS_jobs_program_idea_desc: "La création d'emplois financée par l'État donne aux travailleurs une raison de rester plutôt que de rejoindre la file d'un bus pour l'Allemagne."
 BOS_youth_retention_idea: "Subventions pour la rétention des jeunes"
 BOS_youth_retention_idea_desc: "Des aides au logement et à la carrière visées vers les jeunes diplômés en retiennent certains assez longtemps pour fonder une famille et une carrière ici."
 BOS_mostar_industrial_decline: "Fermeture de la fonderie de Mostar"
 BOS_mostar_industrial_decline_desc: "L'usine d'aluminium qui était autrefois le plus gros consommateur d'électricité de la Fédération est à l'arrêt, et l'économie de Mostar manque de plusieurs milliers d'emplois qu'elle n'a pas remplacés."
 BOS_mostar_industrial_revival: "Mostar sous nouvelle direction"
 BOS_mostar_industrial_revival_desc: "Un investisseur stratégique a repris les opérations de la fonderie de Mostar, relançant la production à une capacité réduite mais viable."
 BOS_zenica_industrial_decline: "Fermeture de l'aciérie de Zenica"
 BOS_zenica_industrial_decline_desc: "Le haut-fourneau qui ancrait l'économie de Zenica depuis plus d'un siècle s'est éteint, et la région encaisse la perte de milliers d'emplois."
 BOS_zenica_industrial_revival: "Zenica sous nouvelle propriété"
 BOS_zenica_industrial_revival_desc: "Un acquéreur a repris les aciéries de Zenica, maintenant une partie de l'ancienne main-d'œuvre sous une nouvelle direction."
 BOS_eu_growth_plan_tranche: "Débloquer une tranche du plan de croissance de l'UE"
 BOS_eu_growth_plan_tranche_desc: "Demander le prochain versement du Mécanisme de réforme et de croissance de l'UE. Une corruption au-dessus du seuil ou un gouvernement trop instable pour négocier fera perdre la tranche."
 BOS_political.58.t: "La fonderie de Mostar s'éteint"
 BOS_political.58.d: "Aluminij Mostar, le plus gros consommateur d'électricité de la Fédération, a été coupé pour des centaines de millions de dettes impayées au service de l'électricité. Glencore a abandonné une reprise il y a des mois, et relancer une fonderie de cette taille après un arrêt complet n'est peut-être même pas possible."
 BOS_political.58.a: "Laisser l'usine fermer"
 BOS_political.58.b: "Solliciter un investisseur stratégique."
 BOS_political.59.t: "Le haut fourneau de Zenica devient froid"
 BOS_political.59.d: "ArcelorMittal a mis à l'arrêt le haut-fourneau de ses aciéries de Zenica, une usine qui ancre l'économie de la ville depuis plus d'un siècle. Une demande européenne faible et des coûts énergétiques élevés ont rendu la ligne non rentable."
 BOS_political.59.a: "Laisser le fourneau froid"
 BOS_political.59.b: "Trouver un nouveau propriétaire"
 BOS_political.60.t: "Le bloc 7 de Tuzla tombe à travers"
 BOS_political.60.d: "L'unité au lignite financée par la Chine à Tuzla est officiellement morte. La garantie d'État derrière le prêt violait les règles européennes des aides d'État depuis des années, et le gouvernement a enfin confirmé ce que Bruxelles disait déjà. China Gezhouba veut que son contrat soit honoré malgré tout."
 BOS_political.60.a: "Accepter l'annulation"
 BOS_political.60.b: "Contester la résiliation"
 BOS_political.61.t: "Voyages gratuits vers l'Europe"
 BOS_political.61.d: "L'UE a aboli les visas Schengen de court séjour pour les titulaires de passeports biométriques bosniaques. Pour la première fois depuis la guerre, passer dans l'UE ne signifie plus que montrer un passeport à la frontière."
 BOS_political.61.a: "Célébrer l'étape"
 BOS_political.61.b: "Avertir où mène cette route"
 BOS_visa_era_emigration_tt: "§YLa libre circulation vers l'UE a rendu le départ plus facile que jamais§!"
 BOS_political.62.t: "Le moment civique de l'élection de 2010"
 BOS_political.62.d: "Le SDP multiethnique de Zlatko Lagumdžija a mené le vote de la Fédération pour la première fois depuis la guerre, tandis que le SNSD de Milorad Dodik balaye la Republika Srpska. Six partis doivent désormais former un gouvernement qu'aucun camp ne peut dominer."
 BOS_political.62.a: "S'appuyer sur la percée civique"
 BOS_political.62.b: "Laisser les entités tenir leurs positions"
 BOS_political.63.t: "Une coalition, avec seize mois de retard"
 BOS_political.63.d: "Seize mois après la clôture des urnes, une coalition de six partis a enfin formé un Conseil des ministres. Il a fallu la plus grande partie de ce temps rien que pour s'entendre sur qui le présiderait."
 BOS_political.63.a: "Retour au gouvernement"
 BOS_paralysis_lifted_tt: "§GLa paralysie de formation du gouvernement a été résolue§!"
 BOS_political.64.t: "Le retour des nationalistes"
 BOS_political.64.d: "Le SDA a repris le titre de premier parti dans la Fédération, Dragan Čović occupe le siège croate de la présidence, et Dodik a de justesse conservé la Republika Srpska. L'expérience multiethnique de 2010 s'est presque effondrée."
 BOS_political.64.a: "Les anciens blocs sont de retour pour une raison"
 BOS_political.64.b: "Retenter la voie civique"
 BOS_political.65.t: "Mostar vote à nouveau"
 BOS_political.65.d: "Après qu'un arrêt d'une cour européenne a forcé la main de Sarajevo et qu'Izetbegović et Čović ont conclu un nouveau statut de la ville, Mostar a tenu des élections locales pour la première fois en douze ans. La ville divisée a enfin un conseil élu."
 BOS_political.65.a: "Un mandat neuf pour la ville"
 BOS_political.65.b: "Une trêve fragile, rien de plus"
 BOS_political.66.t: "Loi sur les agents étrangers de la Republika Srpska"
 BOS_political.66.d: "Des jours après la condamnation de Dodik, l'assemblée de l'entité a fait passer à la hâte une loi forçant les ONG financées de l'étranger et les médias indépendants à s'enregistrer comme agents étrangers et à déclarer chaque don. L'OSCE et la Commission de Venise parlent d'un recul de la société civile."
 BOS_political.66.a: "Condamner la répression"
 BOS_political.66.b: "La Republika Srpska ne répond qu'à elle-même"
 BOS_political.67.t: "Un mandat que personne ne signifiera"
 BOS_political.67.d: "Dodik a ignoré un mandat d'arrêt national et Interpol, voyageant via Belgrade et Israël jusqu'à Moscou. Lorsque l'agence de sécurité de l'État a tenté de l'arrêter en Republika Srpska, la police de l'entité s'est interposée."
 BOS_political.67.a: "Pousser l'arrestation"
 BOS_political.67.b: "Laisser la confrontation se calmer"
 BOS_rs_police_standoff_tt: "§RLa police de la Republika Srpska protège Dodik de l'arrestation, approfondissant la crise§!"
 BOS_political.68.t: "Élection anticipée pour le siège de Dodik"
 BOS_political.68.d: "Dodik ayant été destitué de la présidence par la commission électorale, la Republika Srpska a tenu une élection présidentielle anticipée. Le loyaliste du SNSD Siniša Karan et le challenger du SDS Branko Blanuša finissent à moins de trois points l'un de l'autre."
 BOS_political.68.a: "La machine du SNSD tient"
 BOS_political.68.b: "L'opposition perce"
 BOS_political.69.t: "L'arrêt Ljubić"
 BOS_political.69.d: "La Cour constitutionnelle a invalidé la garantie d'au moins un délégué par groupe ethnique et par canton à la Chambre des peuples de la Fédération. Le parlement n'a pas de majorité pour rédiger un remplacement, si bien que la loi électorale reste gelée."
 BOS_political.69.a: "Avertir que cela reviendra hanter"
 BOS_political.69.b: "En prendre note et passer outre"
 BOS_political.49.d_ljubic: "Željko Komšić a remporté le siège croate de la présidence sur des voix à majorité bosniaque, battant Dragan Čović du HDZ. La même lacune de la loi électorale que la Cour constitutionnelle a laissée ouverte dans l'arrêt Ljubić il y a deux ans est désormais au centre de l'argument du HDZ selon lequel les électeurs croates peuvent toujours être mis en minorité. Des villes à majorité croate le déclarent indésirable, et Zagreb proteste contre un résultat que sa propre communauté rejette."
 BOS_political.70.t: "L'attentat contre le commissariat de Bugojno"
 BOS_political.70.d: "Une bombe artisanale a éventré le commissariat de Bugojno, tuant un policier et en blessant six. La cellule salafiste derrière l'attentat est le premier grand réseau djihadiste d'origine intérieure auquel le pays est confronté depuis la guerre."
 BOS_political.70.a: "Traitez-le comme une cellule isolée"
 BOS_political.70.b: "Donner l'alerte sur la radicalisation"
 BOS_counter_radicalization_available_tt: "§YUne décision de contre-radicalisation est désormais disponible§!"
 BOS_political.71.t: "Des tirs contre l'ambassade des États-Unis"
 BOS_political.71.d: "Un tireur de l'enclave wahhabite de Gornja Maoča a tiré plus de cent coups de feu sur l'ambassade américaine à Sarajevo avant qu'un sniper de la police ne l'abatte. Le problème de radicalisation du pays n'est plus une affaire intérieure."
 BOS_political.71.a: "Encaisser les retombées diplomatiques"
 BOS_political.71.b: "Exiger des comptes sur les enclaves"
 BOS_salafi_enclave_decision_available_tt: "§YUne décision de surveiller les enclaves salafistes est désormais disponible§!"
 BOS_political.72.t: "Attaque contre le commissariat de Zvornik"
 BOS_political.72.d: "Un tireur a tué un policier au commissariat de Zvornik en Republika Srpska avant d'être lui-même abattu, première attaque islamiste à frapper à l'intérieur de l'entité serbe. Certains de ses associés connus ont combattu en Syrie."
 BOS_political.72.a: "La menace ne respecte aucune ligne d'entité"
 BOS_political.73.t: "Washington sanctionne le réseau de Dodik"
 BOS_political.73.d: "Le Trésor américain a sanctionné Milorad Dodik et élargi le filet autour de sa famille et de son réseau de clientèle, citant la corruption et l'obstruction délibérée de Dayton. C'est l'outil coercitif occidental le plus tranchant visé contre la Republika Srpska jusqu'ici."
 BOS_political.73.a: "Responsabilité en retard"
 BOS_political.73.b: "Une attaque contre la Republika Srpska elle-même"
 BOS_sanctions_deepen_crisis_tt: "§RLes sanctions aggravent la crise sécessionniste en cours de la Republika Srpska§!"
 BOS_political.74.t: "La babylution"
 BOS_political.74.d: "Le parlement a laissé la loi sur l'identité civile expirer dans l'impasse, si bien que les nouveau-nés sont restés sans numéro d'identité, passeport ni carte médicale pendant des mois. Après qu'un bébé gravement malade est mort en attendant un traitement à l'étranger, dix mille personnes ont défilé à Sarajevo, la plus grande protestation civique depuis la guerre."
 BOS_political.74.a: "Promettez une solution rapide"
 BOS_political.74.b: "Laissons le Parlement régler le problème"
 BOS_political.75.t: "La Bosnie se qualifie pour la Coupe du monde"
 BOS_political.75.d: "Une victoire 1-0 en Lituanie a envoyé la Bosnie-Herzégovine à sa première Coupe du monde en tant que nation indépendante. Pendant quelques semaines, l'équipe d'Edin Džeko a tout le pays qui acclame la même chose."
 BOS_political.75.a: "Un pays uni, brièvement"
 BOS_political.81.t: "L'ASA entre enfin en vigueur"
 BOS_political.81.d: "Neuf ans après la signature, l'accord de stabilisation et d'association est entré en vigueur. Il relance une voie européenne bloquée depuis des années et prépare l'agenda de réforme qui prend forme au Conseil des ministres."
 BOS_political.81.a: "Un nouveau départ avec Bruxelles"
 BOS_political.77.t: "B&H Airlines clouée au sol pour de bon"
 BOS_political.77.d: "Le gouvernement de la Fédération a liquidé la compagnie nationale B&H Airlines sous des dettes qu'elle n'aurait jamais pu rembourser. Pour la première fois depuis l'indépendance, le pays n'a plus de compagnie aérienne nationale."
 BOS_political.77.a: "Laisse tomber"
 BOS_political.77.b: "Renflouer"
 BOS_political.78.t: "Buroj Ozone annoncé"
 BOS_political.78.d: "Buroj Property Development de Dubaï a dévoilé des plans pour une ville de villégiature de 4,3 milliards d'euros à Trnovo, aux portes de Sarajevo, promettant des milliers d'emplois. Les capitaux du Golfe s'intéressent à l'immobilier et au tourisme bosniaques comme jamais."
 BOS_political.78.a: "Saluer l'annonce"
 BOS_political.76.t: "EFT Stanari est en ligne"
 BOS_political.76.d: "La centrale au lignite de 300 mégawatts de Stanari, près de Banja Luka, a atteint l'exploitation commerciale, première nouvelle centrale thermique construite nulle part en Bosnie depuis la guerre. La Republika Srpska a désormais sa propre source d'électricité stable, financée et construite avec de l'argent chinois."
 BOS_political.76.a: "Un motif de fierté pour la Republika Srpska"
 BOS_political.80.t: "La première Pride de Sarajevo"
 BOS_political.80.d: "Environ deux mille personnes ont défilé à Sarajevo pour la première Pride du pays, dernière capitale yougoslave à en tenir une. Une petite contre-manifestation s'est rassemblée sous une bannière de « valeurs traditionnelles », mais le cortège s'est déroulé sans violence."
 BOS_political.80.a: "Garantir la protection des marcheurs"
 BOS_political.80.b: "Tenir l'État à distance"
 BOS_political.79.t: "Inondations et glissements ensevelissent Jablanica"
 BOS_political.79.d: "Des crues soudaines et des glissements de terrain ont déchiré le centre et le sud de la Bosnie, la pire catastrophe que le pays ait connue depuis une décennie. Donja Jablanica a été la plus durement touchée, une coulée de débris ensevelissant des maisons et tuant des dizaines de personnes."
 BOS_political.79.a: "Appeler à une aide de solidarité de l'UE"
 BOS_political.79.b: "Reconstruire par nos propres moyens"
 BOS_pass_jmbg_law: "Adopter la loi JMBG"
 BOS_pass_jmbg_law_desc: "Faire passer au parlement une loi de remplacement sur l'identité civile, mettant fin à la lacune d'enregistrement qui a laissé les nouveau-nés sans documents d'identité."
 BOS_jmbg_law_passed_tt: "§GLa loi sur l'identité civile a été remplacée, et les protestations se sont apaisées§!"
 BOS_counter_radicalization_program: "Lancer un programme de déradicalisation"
 BOS_counter_radicalization_program_desc: "Financer la sensibilisation et la surveillance visées vers les réseaux salafistes derrière le récent attentat, reculant une partie des dégâts à la sécurité intérieure."
 BOS_monitor_salafi_enclaves: "Surveiller les enclaves salafistes"
 BOS_monitor_salafi_enclaves_desc: "Placer des villages comme Gornja Maoča sous surveillance durable. Cela améliore la détection, et cela dit aux communautés bosniaques qui y vivent exactement comment l'État les voit."
 BOS_repatriate_foreign_fighters: "Rapatrier et poursuivre les combattants étrangers"
 BOS_repatriate_foreign_fighters_desc: "Rapatrier les citoyens qui ont combattu pour Daech en Syrie et en Irak et les juger sous la loi antiterroriste de 2014. La réintégration est coûteuse, et tous les cas ne se terminent pas proprement."
 BOS_reintegration_success_tt: "§GLes rapatriés ont été réintégrés avec succès§!"
 BOS_reintegration_relapse_tt: "§RCertains rapatriés ont dérivé de nouveau vers des réseaux radicaux§!"
 BOS_government_formation_paralysis: "Paralysie de formation du gouvernement"
 BOS_government_formation_paralysis_desc: "Aucune coalition ne commande assez de sièges pour former un Conseil des ministres. Les ministères fonctionnent sur des budgets d'affaires courantes pendant que les partis négocient."
 BOS_civil_society_crackdown: "Répression de la société civile"
 BOS_civil_society_crackdown_desc: "La loi sur les agents étrangers de la Republika Srpska force les ONG et les médias indépendants à s'enregistrer, déclarer leur financement et étiqueter leur propre production. Observateurs et donateurs se retirent de l'entité."
 BOS_domestic_terror_threat_1: "Menace terroriste intérieure"
 BOS_domestic_terror_threat_1_desc: "Un petit réseau salafiste mais actif opère largement hors de la vue de l'État, recrutant dans une poignée de communautés isolées."
 BOS_counter_radicalization_measures: "Mesures de lutte contre la radicalisation"
 BOS_counter_radicalization_measures_desc: "Des programmes de sensibilisation et une surveillance élargie entament les réseaux qui ont produit l'attentat de Bugojno."
 BOS_salafi_enclave_monitoring: "Surveillance de l’enclave salafiste"
 BOS_salafi_enclave_monitoring_desc: "Les services de sécurité maintiennent une veille permanente sur Gornja Maoča et des communautés similaires. Cela intercepte plus de complots qu'auparavant, au prix de la confiance dans les quartiers surveillés."
 BOS_foreign_fighter_reintegration: "Réintégration des combattants étrangers"
 BOS_foreign_fighter_reintegration_desc: "Les rapatriés condamnés et libérés dans le cadre du programme de rapatriement sont orientés vers le travail et loin des réseaux qui les avaient recrutés la première fois."
 BOS_eufor_deterrence: "Renfort EUFOR"
 BOS_eufor_deterrence_desc: "Une garnison EUFOR Althea plus importante rappelle visiblement que la paix bosniaque a des garants extérieurs, un fait qui pèse sur quiconque à Banja Luka songerait à la sécession."
 BOS_eufor_deterrence_tt: "§YLa présence renforcée de l'EUFOR atténue le risque d'une tentative de sécession de la Republika Srpska§!"
 BOS_jmbg_crisis: "La crise du JMBG"
 BOS_jmbg_crisis_desc: "Les nouveau-nés restent sans documents d'identité tant que le parlement n'arrive pas à s'entendre sur une loi de remplacement. Plus cela traîne, plus les protestations grandissent."
 BOS_world_cup_unity: "La fièvre de la Coupe du monde"
 BOS_world_cup_unity_desc: "La course de l'équipe nationale vers sa première Coupe du monde a donné aux Bosniaques, Croates et Serbes quelque chose à acclamer en même temps."
 BOS_stanari_plant_online: "Usine Stanari en ligne"
 BOS_stanari_plant_online_desc: "La centrale au lignite de Stanari, construite par la Chine, alimente de façon stable le réseau de la Republika Srpska, première nouvelle capacité thermique construite nulle part dans le pays depuis la guerre."
 BOS_national_carrier_pride: "Fierté du transporteur national"
 BOS_national_carrier_pride_desc: "La compagnie nationale subventionnée par l'État vole encore, un petit motif de fierté dans un pays qui en est autrement privé depuis 2015."
 BOS_trb_header_despot: "Programme blindé Despot"
 BOS_trb_header_vihor: "Programme tactique Vihor"
 BOS_trb_mio_trait_despot_hull: "Coque monocoque soudée"
 BOS_trb_mio_trait_despot_mine_protection: "Protection contre les explosions de mines"
 BOS_trb_mio_trait_despot_stanag3: "Armure STANAG niveau 3"
 BOS_trb_mio_trait_despot_modular_kit: "Kit de mission modulaire"
 BOS_trb_mio_trait_despot_command: "Variante du poste de commandement"
 BOS_trb_mio_trait_despot_medevac: "Variante d'évacuation médicale"
 BOS_trb_mio_trait_despot_powerpack: "Groupe motopropulseur de 240 kW"
 BOS_trb_mio_trait_despot_systems: "Intégration des systèmes de véhicules"
 BOS_trb_mio_trait_despot_serial: "Ligne de production en série"
 BOS_trb_mio_trait_overhaul_heritage: "1955 Révision du patrimoine"
 BOS_trb_mio_trait_export_orders: "Commandes d'export EDEX"
 BOS_trb_mio_trait_vihor_platform: "Plateforme Vihor 4x4"
 BOS_trb_mio_trait_vihor_lightweight: "Châssis de moins de 6 tonnes"
 BOS_trb_mio_trait_vihor_ballistic: "Balistique STANAG niveau 2"
 BOS_trb_mio_trait_vihor_nato_standard: "Assemblée standard de l'OTAN"
 BOS_trb_mio_trait_vihor_stanag3: "Forfait de protection de niveau 3"
 BOS_trb_mio_trait_vihor_agility: "Agilité tourbillonnante"
 BOS_trb_mio_trait_vihor_mobility: "Transmission haute mobilité"
 BOS_trb_mio_trait_vihor_multirole: "Configuration multirôle"
 BOS_trb_mio_trait_vihor_cost_efficient: "Production rentable"
 BOS_trb_mio_trait_vihor_prototyping: "Prototypage rapide"
 BOS_trb_mio_trait_vihor_partner_expo: "Contrats d'exposition partenaires"
 BOS_bnttmih_header_towed: "Artillerie remorquée"
 BOS_bnttmih_header_rockets: "Fusées et automotrices"
 BOS_bnttmih_header_antitank: "Canons antichar"
 BOS_bnttmih_mio_trait_bratstvo_foundry: "Patrimoine de Bratstvo"
