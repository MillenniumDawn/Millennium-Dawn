 weap_a2a_hardpoint_1: "Точка подвески «воздух-воздух» 1-го поколения"
 weap_a2a_hardpoint_1_desc: "Узлы подвески «воздух-воздух» предназначены для размещения на самолёте нескольких видов вооружения класса «воздух-воздух», прежде всего дальнобойных ракет и другого современного авиационного вооружения, а также модернизаций авионики, позволяющих эффективно поражать несколько целей одновременно.\n\n§GПодсказка дизайнера: Точки подвески «воздух — воздух» предназначены прежде всего для самолётов завоевания превосходства в воздухе. Кроме того, такая точка подвески сохраняет самолёту часть воздушной атаки на заданиях помимо превосходства в воздухе и перехвата, повышая его самозащиту.§!\n\n§WИспользование этого узла в качестве основного вооружения создаст§! §Bистребитель завоевания превосходства в воздухе§!\n\n§RПРЕДУПРЕЖДЕНИЕ: палубные истребители превосходства в воздухе будут атаковать в морском бою только вражескую авиацию§!"
 weap_a2a_hardpoint_2: "Точка подвески «воздух-воздух» 2-го поколения"
 weap_a2a_hardpoint_2_desc: "$weap_a2a_hardpoint_1_desc$"
