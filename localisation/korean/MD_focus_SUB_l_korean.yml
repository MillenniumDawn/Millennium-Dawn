 subject_rus.109.t: "모스크바 시장 선거"
 subject_rus.109.d: "§Y모스크바 시장§!의 임기가 끝나 도시가 다시 한번 투표소로 향합니다. 트베르스카야의 시장직을 차지하는 인물이 향후 5년간 우리 수도를 통치하게 되며, 수도의 정치는 곧잘 전국의 정치가 되곤 합니다."
