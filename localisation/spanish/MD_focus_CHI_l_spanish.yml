 CHI_taiwan_recognition_count_tt: "$CHI_taiwan_recognition_count$: $RIGHT|-=0$"
 CHI_SAR_MIO_share_tt: "Todos los Estados títere de las RAE obtienen acceso a las organizaciones militares-industriales de China."
 CHI_tai_pressure_economic_tt: "China aprovecha las dependencias comerciales para presionar a Washington a reducir su apoyo a Taiwán. Los Estados Unidos deben decidir cómo responder."
 CHI_tai_pressure_diplomatic_tt: "China abre canales diplomáticos moderados para persuadir a Washington de que se distancie de Taiwán."
 CHI_pressure_derecognize_TAI_tt: "China aplica presión económica y diplomática. Si el objetivo no retira su reconocimiento de Taiwán dentro del plazo establecido, China impondrá un embargo comercial."
 TAI_reduced_us_support: "Apoyo militar estadounidense disminuido"
 TAI_reduced_us_support_desc: "A raíz de la presión china sobre Washington, los Estados Unidos han reducido las entregas de armas y la cooperación militar con Taiwán. Las fuerzas armadas se enfrentan a una menor preparación operativa y a una baja moral entre las unidades que dependen del equipamiento y la doctrina estadounidenses."
 TAI_isolated_from_us: "Abandonado por Washington"
 TAI_isolated_from_us_desc: "Los Estados Unidos han retirado formalmente el apoyo militar y diplomático a Taiwán bajo la presión sostenida de China. Las fuerzas armadas se quedan sin su principal garante de seguridad, lo que menoscaba gravemente la capacidad de defensa y la confianza de la población civil."
 CHI_TAI_shared_modifier: "Relaciones a través del Estrecho"
 CHI_TAI_shared_modifier_desc: "Un índice dinámico de interdependencia económica y política a través del estrecho de Taiwán. Unos lazos más estrechos aumentan la estabilidad y la tendencia democrática, al tiempo que mejoran las relaciones comerciales, la eficiencia de las fábricas, la velocidad de investigación y la producción de construcción; por el contrario, el distanciamiento fomenta la tendencia comunista, la presión política interna y la capacidad de incursión naval."
 CHI_SAR_network_modifier: "Sistema de una sola China"
 CHI_SAR_network_modifier_desc: ""
 CHI_TAI_air_dominance: "Dominio aéreo sobre el Estrecho"
 CHI_TAI_air_dominance_desc: "Las operaciones de la Fuerza Aérea del EPL sobre el estrecho de Taiwán han establecido una presión aérea persistente sobre las defensas de Taiwán, mermando su capacidad para disputar el control del espacio aéreo."
 CHI_TAI_naval_modernization_idea: "Modernización naval"
 CHI_TAI_naval_modernization_idea_desc: "El programa acelerado de adquisiciones de la Armada del EPL ha dado como resultado una flota moderna capaz de realizar operaciones sostenidas en el estrecho de Taiwán."
 TAI_blockade_economic_crisis: "Crisis económica por el bloqueo"
 TAI_blockade_economic_crisis_desc: "El bloqueo naval chino ha cortado las rutas comerciales marítimas de Taiwán, provocando una grave escasez de combustible, materias primas y bienes de consumo. La producción industrial se ha colapsado."
 TAI_self_sufficiency: "Medidas de autosuficiencia"
 TAI_self_sufficiency_desc: "Las medidas de emergencia para desarrollar la capacidad de producción nacional y reducir la dependencia de los bienes importados han comenzado a surtir efecto, compensando parcialmente el impacto del bloqueo."
 TAI_cyber_sabotage: "Sabotaje cibernético"
 TAI_cyber_sabotage_desc: "Una operación cibernética china coordinada ha perturbado la infraestructura crítica, las comunicaciones militares y los sistemas financieros en todo Taiwán."
 TAI_blockade_partial: "Perturbación marítima"
 TAI_blockade_partial_desc: "La zona de seguridad marítima declarada por China está perturbando la navegación comercial y encareciendo los costes de los seguros para los buques con destino a los puertos de Taiwán."
 TAI_emergency_situation: "Estado de emergencia"
 TAI_emergency_situation_desc: "Taiwán ha declarado el estado de emergencia en respuesta al bloqueo chino. Se ha ampliado el servicio militar obligatorio y se han activado medidas de defensa civil, pero el coste económico es grave."
 CHI_TAI_tourism_ban: "Congelación del turismo a través del Estrecho"
 CHI_TAI_tourism_ban_desc: "La República Popular China ha suspendido el turismo emisor tanto grupal como individual hacia Taiwán, cortando los flujos de visitantes que se habían consolidado desde la liberalización de los viajes a través del estrecho en 2008. En 2019, Pekín extendió la prohibición a los permisos de visitas individuales, frenando a cientos de miles de viajeros anuales. La medida inflige un daño directo a los sectores de la hostelería, el comercio minorista y los servicios de Taiwán, al tiempo que señala la disposición de Pekín a utilizar la interdependencia económica como una herramienta coercitiva."
 CHI_crossstrait_operations: "Preparación para operaciones a través del Estrecho"
 CHI_crossstrait_operations_desc: "El EPL ha alcanzado la plena preparación operativa para llevar a cabo operaciones combinadas anfibias y aerotransportadas a través del estrecho de Taiwán."
 CHI_TAI_amphibious_mastery: "Doctrina de asalto anfibio"
 CHI_TAI_amphibious_mastery_desc: "Las formaciones del Cuerpo de Infantería de Marina del EPL han alcanzado un alto nivel de competencia en operaciones anfibias de armas combinadas gracias a intensos ejercicios de entrenamiento en el estrecho de Taiwán."
 CHI_TAI_military_buildup_idea: "Despliegue militar a través del Estrecho"
 CHI_TAI_military_buildup_idea_desc: "El Ejército Popular de Liberación ha concentrado considerables activos terrestres, navales y aéreos a lo largo de la costa de Fujian en preparación para una posible contingencia en el estrecho de Taiwán."
 china_sar.027.t: "La cuestión de Taiwán: Primeros movimientos"
 china_sar.027.d: "El Consejo de Estado ha autorizado una campaña sostenida para erosionar el apoyo estadounidense a Taiwán. El apalancamiento económico, el aislamiento diplomático y las señales militares son instrumentos disponibles. La cuestión es con qué fuerza presionar y con qué rapidez."
 china_sar.027.a: "Aplicar la máxima presión económica. Haremos que el coste de apoyar a Taiwán sea insoportable."
 china_sar.027.b: "Comenzar con iniciativas diplomáticas moderadas. La paciencia da mejores resultados que la confrontación."
 china_sar.028.t: "Washington sopesa sus opciones"
 china_sar.028.d: "La campaña de presión de Pekín ha llegado a Washington en un momento incómodo. La administración se enfrenta a facciones contrapuestas: los halcones, que exigen una firme reafirmación del compromiso con Taiwán, y los pragmáticos, preocupados por las consecuencias económicas de enemistarse con China."
 china_sar.028.a: "Reafirmar nuestro compromiso con Taiwán. La presión de China solo fortalece nuestra determinación."
 china_sar.028.b: "Reconocer las preocupaciones de China. Podemos encontrar una fórmula que reduzca las tensiones sin abandonar a Taiwán."
 china_sar.029.t: "Escalada: China redobla la apuesta"
 china_sar.029.d: "El rechazo de Washington ha sentado mal en Zhongnanhai. La dirección se encuentra bajo presión para demostrar que el desafío conlleva costes. Hay dos opciones sobre la mesa: forjar una coalición diplomática contra la política estadounidense hacia Taiwán o dar muestras de determinación militar mediante maniobras en el estrecho."
 china_sar.029.a: "Forjar una coalición internacional. El aislamiento diplomático es más sostenible que la confrontación."
 china_sar.029.b: "Realizar ejercicios en el estrecho de Taiwán. Washington debe comprender la dimensión militar de nuestro compromiso."
 china_sar.030.t: "Washington ofrece una concesión parcial"
 china_sar.030.d: "Tras un debate interno, la administración ha mostrado su disposición a reducir, pero no a eliminar, la venta de armas a Taiwán. La oferta se enmarca como un gesto hacia la estabilidad. Pekín debe decidir si acepta el logro parcial o presiona por una retirada total."
 china_sar.030.a: "Aceptar la concesión. Un logro parcial sigue siendo un logro."
 china_sar.030.b: "Rechazar la oferta. La retirada total del apoyo es el único resultado aceptable."
 china_sar.031.t: "América en la encrucijada"
 china_sar.031.d: "La campaña de presión sostenida de China ha forzado una decisión final en Washington. La comunidad de inteligencia advierte que nuevas concesiones corren el riesgo de envalentonar a Pekín en todo el Indo-Pacífico. Pero el coste económico de la confrontación también es real. La administración debe elegir."
 china_sar.031.a: "Retirar el apoyo formal a Taiwán. La relación con Pekín es demasiado importante como para sacrificarla."
 china_sar.031.b: "Reafirmar nuestro compromiso con Taiwán en su totalidad. No nos dejaremos intimidar para abandonarlo."
 china_sar.032.t: "Washington da un paso atrás en Taiwán"
 china_sar.032.d: "En un giro silencioso pero trascendental, los Estados Unidos han señalado que ya no proporcionarán respaldo militar y diplomático activo al estatus separado de Taiwán. El anuncio se enmarca en un lenguaje burocrático, pero su significado estratégico es inequívoco: Taiwán se queda solo."
 china_sar.032.a: "Un logro histórico. El camino hacia la reunificación está ahora abierto."
 china_sar.033.t: "Washington reafirma su compromiso"
 china_sar.033.d: "Los Estados Unidos han rechazado la campaña de presión de China y han reafirmado públicamente su compromiso con la seguridad de Taiwán. La administración ha anunciado un nuevo paquete de armas para Taipéi y ha convocado consultas de emergencia con Japón y Australia. La campaña de Pekín ha fracasado y ha endurecido la oposición en Washington."
 china_sar.033.a: "Un revés, pero no una derrota. Reevaluaremos nuestro enfoque."
 china_sar.001.t: "Propuesta: Acuerdo sobre el Comercio de Servicios a través del Estrecho"
 china_sar.001.d: "Pekín ha presentado el Acuerdo sobre el Comercio de Servicios a través del Estrecho, abriendo los principales sectores de servicios de ambas partes a un comercio y una inversión más libres. La propuesta otorgaría a las empresas del continente acceso a los sectores bancario, sanitario y minorista de Taiwán. Los partidarios argumentan que profundizaría la integración económica; los críticos advierten que entrega a Pekín una influencia estructural sobre la economía de Taiwán."
 china_sar.001.a: "Firmar el acuerdo. La integración económica sirve a nuestros intereses a largo plazo."
 china_sar.001.b: "Rechazar el acuerdo. Las concesiones son demasiado profundas y la supervisión demasiado débil."
 china_sar.002.t: "Redes empresariales a través del Estrecho"
 china_sar.002.d: "Redes empresariales pro-Pekín se han expandido hacia los sectores financiero y de medios de comunicación de Taiwán, respaldadas por capital del continente y facilitadas por una serie de opacos acuerdos de inversión. El gobierno debe decidir cómo responder ante una influencia creciente que desdibuja la línea entre el comercio y la política."
 china_sar.002.a: "Dar la bienvenida a los intercambios a través del estrecho. Los lazos económicos son una base para la estabilidad."
 china_sar.002.b: "Supervisar las redes, pero no restringirlas. Una reacción exagerada perjudicaría al comercio legítimo."
 china_sar.002.c: "Imponer restricciones a las inversiones vinculadas al continente en sectores sensibles."
 china_sar.003.t: "La cuestión del Consenso del 92"
 china_sar.003.d: "La China continental ha propuesto formalmente reactivar el Consenso de 1992 como base diplomática para las conversaciones a través del estrecho. La fórmula es deliberadamente ambigua: Pekín la interpreta como un compromiso con el objetivo de la reunificación bajo una sola China, mientras que el KMT tradicionalmente la aceptaba bajo la fórmula de 'una sola China, interpretaciones respectivas'. El DPP la rechaza desde hace tiempo por considerarla una trampa política. Taiwán debe responder."
 china_sar.003.a: "Aceptar la fórmula de consenso. 'Una sola China, interpretaciones respectivas' preserva nuestra posición al tiempo que abre una vía al diálogo."
 china_sar.003.b: "Reconocer el espíritu de diálogo sin respaldar la fórmula explícitamente. Buscamos la paz, no un compromiso político."
 china_sar.003.c: "Rechazar el consenso. Cualquier fórmula que implique la aceptación de 'una sola China' menoscaba nuestro estatus soberano."
 china_sar.004.t: "Fuerzas proindependentistas ganan en Taiwán"
 china_sar.004.d: "El bando proindependentista ha logrado la mayoría en las elecciones de Taiwán. El gobierno entrante ha dejado claro que no aceptará el Consenso del 92 y tiene la intención de trazar un rumbo más firme sobre el estatus internacional de Taiwán. Las relaciones a través del estrecho entran en un período de enfriamiento."
 china_sar.004.a: "Un revés. Reevaluaremos nuestro enfoque hacia Taipéi."
 china_sar.005.t: "Expuestas las operaciones de injerencia de Pekín"
 china_sar.005.d: "La Oficina de Seguridad Nacional de Taiwán ha descubierto pruebas de operaciones vinculadas a la RPC para influir en la política nacional, incluyendo la inversión en medios de comunicación a través de intermediarios, la financiación de figuras políticas partidarias del acercamiento y el cultivo de redes empresariales utilizadas para canalizar mensajes políticos. Los hallazgos se han filtrado a la prensa y están generando indignación popular."
 china_sar.005.a: "Expulsar a los agregados culturales implicados y presentar una protesta formal. no toleraremos la manipulación extranjera de nuestra democracia."
 china_sar.006.t: "Taiwán expulsa a funcionarios chinos"
 china_sar.006.d: "Taipéi ha expulsado formalmente a varios agregados culturales y comerciales tras sacarse a la luz las operaciones de influencia política de Pekín. La medida suscita el aplauso de los aliados democráticos de Taiwán y una enérgica reprimenda pública del Ministerio de Asuntos Exteriores en Pekín."
 china_sar.006.a: "Absorber el coste diplomático. La exposición de la operación retrasa nuestro trabajo, pero la estrategia general sigue siendo sólida."
 china_sar.035.t: "Acercamiento cultural de Pekín"
 china_sar.035.d: "China y Mongolia Interior han lanzado una campaña de influencia cultural coordinada dentro de Mongolia, promoviendo la herencia mongola compartida al tiempo que orientan la opinión pública hacia una integración más estrecha. Pekín enmarca este esfuerzo como un intercambio cultural, pero las implicaciones son indudablemente políticas."
 china_sar.035.a: "No tenemos más opción que reconocer esto."
 china_sar.036.t: "¿Una unión con Mongolia Interior?"
 china_sar.036.d: "Una delegación oficial de Pekín y Hohhot ha llegado a Ulán Bator con una propuesta formal: se invita a Mongolia a unirse a la República Popular como una Región Administrativa Especial bajo el marco de 'un país, dos sistemas'. La oferta viene acompañada de garantías económicas y promesas de autonomía cultural, pero también con todo el peso de la influencia china detrás."
 china_sar.036.a: "Aceptamos la oferta."
 china_sar.036.b: "Mongolia mantendrá su independencia."
 china_sar.037.t: "Mongolia rechaza la reunificación"
 china_sar.037.d: "Ulán Bator ha rechazado formalmente la propuesta de reunificación. El gobierno mongol alega la soberanía nacional y la oposición pública, aunque los canales diplomáticos siguen abiertos. Pekín reconoce la decisión, pero deja claro que la oferta se mantiene."
 china_sar.037.a: "Lo intentaremos de nuevo."
 china_sar.007.t: "Aproximación peligrosa sobre el Estrecho"
 china_sar.007.d: "Un caza del EPL ha realizado una interceptación agresiva de una aeronave militar extranjera que operaba cerca de la línea media del estrecho de Taiwán. El encuentro, capturado por la cámara de la cabina, muestra al piloto chino pasando a pocos metros del avión objetivo. Los medios internacionales exigen una respuesta."
 china_sar.007.a: "Negar la implicación y rebajar la tensión."
 china_sar.007.b: "Mantener el silencio oficial."
 china_sar.007.c: "Defender públicamente la acción como una aplicación legal de la ley."
 china_sar.008.t: "Colisión naval en el estrecho de Taiwán"
 china_sar.008.d: "Un destructor del EPL y un buque de guerra extranjero han colisionado durante un encuentro cercano en el estrecho de Taiwán. Ambas embarcaciones sufrieron daños. El incidente ha desatado una oleada de protestas internacionales y sitúa a Pekín en una posición difícil."
 china_sar.008.a: "Culpar a la otra parte por navegación temeraria."
 china_sar.008.b: "No emitir ninguna declaración y dejar que la historia se olvide."
 china_sar.008.c: "Ofrecer disculpas privadas a través de canales secretos."
 china_sar.009.t: "Prueba de cohetes: Silencio regional"
 china_sar.009.d: "La prueba de misiles balísticos de la Fuerza de Misiles del EPL sobre el estrecho de Taiwán ha recibido una respuesta internacional silenciosa. Washington emitió una declaración de preocupación pro forma, pero no tomó medidas concretas. La falta de una reacción estadounidense significativa envía una poderosa señal a toda la región."
 china_sar.009.a: "Nuestra determinación habla más alto que su silencio."
 china_sar.010.t: "Prueba de cohetes: Firme respuesta estadounidense"
 china_sar.010.d: "La prueba de misiles de la Fuerza de Misiles del EPL cerca de Taiwán ha resultado contraproducente de forma espectacular. Washington ha ordenado el envío de un grupo de combate de portaaviones al estrecho y ha anunciado un paquete de armas de emergencia para Taipéi. La opinión internacional se conchaba contra Pekín."
 china_sar.010.a: "Este revés no nos disuadirá."
 china_sar.011.t: "Taiwán se queda solo"
 china_sar.011.d: "Los aliados diplomáticos formales de Taiwán se han reducido a un puñado de pequeños Estados. Sin un reconocimiento internacional significativo, la reclamación de soberanía de Taipéi descansa sobre un terreno cada vez más inestable. El aislamiento es tanto simbólico como práctico."
 china_sar.011.a: "La red se cierra en torno a la provincia rebelde."
 china_sar.012.t: "Votación de armas en el Congreso"
 china_sar.012.d: "El Congreso de los Estados Unidos está debatiendo un importante paquete de venta de armas a Taiwán. Nuestra red de cabildeo en Washington tiene la oportunidad de influir en la votación, pero la intervención conlleva riesgos si se expone nuestra implicación."
 china_sar.012.a: "Activar la red de cabildeo para bloquear la venta."
 china_sar.012.b: "Emitir amenazas económicas por canales diplomáticos."
 china_sar.012.c: "Dejar que el proceso siga su curso sin interferir."
 china_sar.013.t: "Consejo Empresarial aboga por la distensión"
 china_sar.013.d: "El Consejo Empresarial EE. UU.-China ha publicado un informe instando a Washington a priorizar la estabilidad comercial sobre los compromisos de seguridad de Taiwán. El informe, moldeado por nuestros esfuerzos de compromiso económico, ha ganado fuerza en los círculos políticos."
 china_sar.013.a: "Tomado nota."
 china_sar.014.t: "Injerencia electoral al descubierto"
 china_sar.014.d: "Las agencias de inteligencia estadounidenses han atribuido públicamente una operación de influencia política a actores estatales chinos. El escándalo ha desatado la indignación bipartidista en el Congreso y una oleada de medidas punitivas. Nuestra posición estratégica con Washington ha sufrido un duro golpe."
 china_sar.014.a: "Un error de cálculo costoso."
 china_sar.015.t: "Reunión de seguridad de emergencia"
 china_sar.015.d: "El ejercicio de simulación de bloqueo de China en el estrecho de Taiwán ha provocado una sesión de emergencia del Consejo de Seguridad Nacional. Los comandantes militares y los funcionarios del gabinete debaten la respuesta adecuada a la creciente presión de Pekín."
 china_sar.015.a: "Aumentar la preparación militar a lo largo de la costa."
 china_sar.015.b: "Apelar a la comunidad internacional en busca de apoyo."
 china_sar.016.t: "Estado de emergencia"
 china_sar.016.d: "El bloqueo parcial ha persistido durante dos meses, perturbando el comercio y generando escasez de combustible y materiales críticos. El gobierno se enfrenta a una creciente presión para declarar formalmente el estado de emergencia y situar a las fuerzas armadas en alerta total."
 china_sar.016.a: "Declarar el estado de emergencia."
 china_sar.016.b: "Buscar una resolución diplomática con Pekín."
 china_sar.017.t: "La cuestión de la capitulación"
 china_sar.017.d: "El bloqueo naval total ha paralizado nuestra economía y ha cortado nuestras líneas de suministro. Con el apoyo estadounidense retirado a todos los efectos prácticos, varias voces dentro del gobierno plantean discretamente la posibilidad de abrir negociaciones con Pekín bajo sus condiciones."
 china_sar.017.a: "Nunca nos rendiremos. ¡A luchar!"
 china_sar.017.b: "Abrir negociaciones con Pekín."
 china_sar.018.t: "Taiwán abre negociaciones"
 china_sar.018.d: "Taipéi ha enviado una delegación a Pekín con autoridad para discutir las condiciones de la reunificación. El bloqueo, el colapso económico y la retirada del apoyo estadounidense han dejado a la isla sin ninguna alternativa viable. Se cierra un capítulo histórico."
 china_sar.018.a: "Aceptar la reunificación de la patria."
 china_sar.019.t: "Crisis del estrecho de Taiwán"
 china_sar.019.d: "Las tensiones en el estrecho de Taiwán han alcanzado un umbral crítico. Las fuerzas militares de ambas partes están en su máxima preparación operativa y un solo error de cálculo podría desencadenar un conflicto abierto. El Comité Permanente del Politburó convoca una sesión de emergencia para decidir el siguiente paso."
 china_sar.019.a: "Dar un paso atrás respecto al abismo. Rebajar la tensión."
 china_sar.019.b: "Presionar a fondo. Emitir un objetivo de guerra formal."
 china_sar.020.t: "Ultimátum de Pekín"
 china_sar.020.d: "Pekín ha entregado un ultimátum formal exigiendo la aceptación de la reunificación bajo la República Popular. El incumplimiento dará lugar a una acción militar. El gobierno debe decidir si resistirse o negociar."
 china_sar.020.a: "Rechazar el ultimátum. Prepararse para la guerra."
 china_sar.020.b: "Aceptar las condiciones. La lucha ha terminado."
 china_sar.021.t: "Taiwán rechaza la reunificación"
 china_sar.021.d: "Taipéi ha rechazado formalmente nuestro ultimátum. El gobierno de Taiwán ha declarado su intención de resistir cualquier intento de reunificación forzosa y está movilizando a sus fuerzas armadas. El camino hacia una resolución pacífica está cerrado."
 china_sar.021.a: "Que así sea. Prepararse para la guerra."
 china_sar.022.t: "Taiwán acepta la reunificación"
 china_sar.022.d: "Taipéi ha aceptado las condiciones de la reunificación. La República de China será disuelta y su territorio se integrará en la República Popular. Décadas de división a través del estrecho llegan a su fin."
 china_sar.022.a: "La patria vuelve a estar completa."
 china_sar.023.t: "Presión diplomática china"
 china_sar.023.d: "Pekín ha emitido una exigencia formal para que retiremo nuestro reconocimiento a Taiwán. China ofrece incentivos económicos por el cumplimiento y amenaza con sanciones en caso de rechazo. Nuestro reconocimiento continuo a Taipéi se ha convertido en una postura diplomática costosa."
 china_sar.023.a: "Cumplir. Retirar el reconocimiento a Taiwán."
 china_sar.023.b: "Rechazar. Mantenemos nuestros compromisos."
 china_sar.024.t: "Ejercicio anfibio en el Estrecho"
 china_sar.024.d: "El Cuerpo de Infantería de Marina del EPL ha llevado a cabo su mayor ejercicio de desembarco anfibio en el estrecho de Taiwán, simulando un asalto a la playa en una costa fortificada. El ejercicio, retransmitido por los medios estatales, envía una señal inequívoca tanto a Taipéi como a Washington."
 china_sar.024.a: "El mundo ha tomado nota."
 china_sar.025.t: "Confrontación por la libertad de navegación"
 china_sar.025.d: "La Marina de los Estados Unidos ha enviado un buque de guerra a través de nuestra zona de seguridad marítima declarada cerca de Taiwán. El buque proclama su presencia abiertamente, desafiando a la Armada del EPL a responder. Nuestras fuerzas están siguiendo de cerca al barco estadounidense."
 china_sar.025.a: "Permitir el paso. Evitar una confrontación directa."
 china_sar.025.b: "Seguir de cerca e interpelar al buque estadounidense."
 china_sar.026.t: "Cambio en el liderazgo de los EE. UU."
 china_sar.026.d: "Un cambio en la presidencia estadounidense ha alterado el panorama político para nuestra estrategia respecto a Taiwán. La postura de la nueva administración sobre las relaciones a través del estrecho afectará al nivel de apoyo de los EE. UU. a Taipéi."
 china_sar.026.a: "Ajustar nuestra estrategia en consecuencia."
 USA_taiwan_defense_category: "Defensa de Taiwán"
 CHI_TAI_amphibious_exercise: "Ejercicio anfibio en el Estrecho"
 CHI_TAI_amphibious_exercise_desc: "Ordenar un ejercicio de desembarco anfibio a gran escala en el estrecho de Taiwán para demostrar la capacidad militar y presionar a Taipéi."
 CHI_TAI_adiz_incursion: "Incursión en la ADIZ"
 CHI_TAI_adiz_incursion_desc: "Enviar cazas de la Fuerza Aérea del EPL a la zona de identificación de defensa aérea de Taiwán para poner a prueba los tiempos de respuesta y minar la confianza de Taipéi."
 CHI_TAI_rocket_test: "Prueba de misiles balísticos"
 CHI_TAI_rocket_test_desc: "Realizar una prueba de misiles balísticos sobre el estrecho de Taiwán. La respuesta dependerá del nivel actual de compromiso estadounidense con la defensa de Taiwán."
 CHI_TAI_grey_zone_ops: "Operaciones de zona gris"
 CHI_TAI_grey_zone_ops_desc: "Lanzar provocaciones de baja intensidad que incluyen incursiones de la guardia costera, despliegues de la flota pesquera y sondeos de guerra electrónica cerca de las aguas de Taiwán."
 CHI_TAI_blockade_simulation: "Ejercicio de simulación de bloqueo"
 CHI_TAI_blockade_simulation_desc: "Organizar un ejercicio naval a gran escala simulando un bloqueo total a Taiwán, poniendo a prueba la logística y demostrando la capacidad de cortar las líneas de suministro de la isla."
 CHI_TAI_cyberattack: "Ciberataque a Taiwán"
 CHI_TAI_cyberattack_desc: "Lanzar una operación cibernética coordinada dirigida contra la red eléctrica, los sistemas financieros y las comunicaciones militares de Taiwán."
 CHI_TAI_shadow_carrier: "Seguir de cerca al grupo de portaaviones de EE. UU."
 CHI_TAI_shadow_carrier_desc: "Desplegar submarinos y buques de combate de superficie para seguir de cerca al grupo de combate de portaaviones estadounidense que opera cerca del estrecho de Taiwán."
 CHI_TAI_intercept_aircraft: "Interceptar reconocimiento de EE. UU."
 CHI_TAI_intercept_aircraft_desc: "Hacer despegar cazas en alerta para interceptar y seguir de cerca de manera agresiva a las aeronaves de reconocimiento estadounidenses que operan cerca del estrecho."
 CHI_TAI_un_protest: "Protesta en la ONU contra la venta de armas"
 CHI_TAI_un_protest_desc: "Presentar una protesta formal ante las Naciones Unidas contra la venta de armas estadounidense a Taiwán, generando presión internacional sobre Washington."
 CHI_TAI_maritime_zone: "Declarar zona de seguridad marítima"
 CHI_TAI_maritime_zone_desc: "Declarar una zona de seguridad marítima alrededor de los accesos clave a Taiwán, estableciendo un pretexto legal para interceptar e inspeccionar la navegación comercial."
 CHI_TAI_partial_blockade: "Bloqueo naval parcial"
 CHI_TAI_partial_blockade_desc: "Escalar la zona de seguridad marítima hacia un bloqueo naval parcial, restringiendo los envíos de combustible y materias primas a Taiwán."
 CHI_TAI_full_blockade: "Bloqueo naval total"
 CHI_TAI_full_blockade_desc: "Imponer un bloqueo naval completo alrededor de Taiwán, cortando todo el comercio marítimo y las líneas de suministro a la isla."
 CHI_TAI_influence_us_election: "Influir en las elecciones de EE. UU."
 CHI_TAI_influence_us_election_desc: "Desplegar operaciones encubiertas de influencia política en los Estados Unidos para impulsar a candidatos receptivos con la postura de Pekín sobre Taiwán."
 CHI_TAI_support_houthis: "Apoyar las operaciones hutíes"
 CHI_TAI_support_houthis_desc: "Proporcionar apoyo material encubierto a las fuerzas hutíes en Yemen, creando una crisis de seguridad que desvíe los recursos militares estadounidenses fuera del Pacífico."
 CHI_TAI_arm_iran: "Armas encubiertas a Irán"
 CHI_TAI_arm_iran_desc: "Canalizar tecnología militar avanzada hacia Irán a través de intermediarios, aumentando la presión sobre las fuerzas estadounidenses en Oriente Medio."
 CHI_TAI_scs_provocations: "Provocaciones en el mar de China Meridional"
 CHI_TAI_scs_provocations_desc: "Reafirmar la soberanía china sobre los accidentes geográficos en disputa del mar de China Meridional mediante la militarización de islas, el hostigamiento de la guardia costera a reclamantes rivales y la expansión de las zonas de defensa aérea. Estas acciones obligan a los Estados Unidos a desviar activos navales para tranquilizar a sus socios de la ASEAN."
 CHI_TAI_nk_provocations: "Alentar provocaciones norcoreanas"
 CHI_TAI_nk_provocations_desc: "Indicar a Pionyang que se tolerarán las pruebas de misiles y las provocaciones militares en la península de Corea, obligando a los Estados Unidos a redesplegar fuerzas desde el teatro de operaciones de Taiwán."
 CHI_TAI_middleeast_diversion: "Compromiso estratégico en Oriente Medio"
 CHI_TAI_middleeast_diversion_desc: "Profundizar las asociaciones militares y económicas en todo Oriente Medio para aumentar la dependencia regional de Pekín al tiempo que se desvía la atención estadounidense fuera del teatro de operaciones del Indo-Pacífico."
 CHI_TAI_support_russia: "Apoyar las operaciones rusas"
 CHI_TAI_support_russia_desc: "Proporcionar apoyo económico y logístico a las operaciones militares de Rusia, prolongando un conflicto que consume la atención y los recursos estadounidenses."
 CHI_TAI_strait_naval_exercise: "Ejercicio naval en el estrecho de Taiwán"
 CHI_TAI_strait_naval_exercise_desc: "Realizar un ejercicio naval a gran escala en el estrecho de Taiwán, practicando operaciones de asalto anfibio y guerra de antiacceso. El ejercicio mejorará la preparación naval, pero provocará la condena internacional."
 CHI_TAI_fund_us_opposition: "Financiar la defensa pro-China en los EE. UU."
 CHI_TAI_fund_us_opposition_desc: "Canalizar recursos a través de intermediarios para apoyar a grupos políticos, laboratorios de ideas (*think tanks*) y medios de comunicación estadounidenses receptivos con la postura de Pekín sobre Taiwán. Su descubrimiento provocaría una severa reacción violenta."
 CHI_TAI_exploit_us_commitments: "Explotar la sobreextensión militar de EE. UU."
 CHI_TAI_exploit_us_commitments_desc: "Mientras los Estados Unidos estén comprometidos en operaciones militares en el extranjero, intensificar la presión diplomática y militar sobre Taiwán. Las fuerzas estadounidenses están dispersas y no pueden reforzar el Pacífico de manera creíble."
 USA_TAI_send_carrier: "Desplegar portaaviones en el estrecho de Taiwán"
 USA_TAI_send_carrier_desc: "Ordenar a un grupo de combate de portaaviones transitar por el estrecho de Taiwán en una demostración de fuerza, señalando el compromiso estadounidense con la estabilidad regional."
 USA_TAI_recon_flight: "Vuelo de reconocimiento sobre el Estrecho"
 USA_TAI_recon_flight_desc: "Despachar aeronaves de vigilancia para monitorizar la actividad del EPL en el estrecho de Taiwán tras las incursiones chinas en la ADIZ."
 USA_TAI_arm_taiwan: "Paquete de armas de emergencia para Taiwán"
 USA_TAI_arm_taiwan_desc: "Aprobar un paquete de venta de armas de emergencia para el ejército de Taiwán en respuesta a la escalada en los preparativos de bloqueo por parte de China."
 USA_TAI_fon_operation: "Operación de libertad de navegación"
 USA_TAI_fon_operation_desc: "Enviar un buque de guerra a través de la zona de seguridad marítima declarada por China para defender la libertad de navegación y desafiar las reclamaciones de Pekín."
 USA_TAI_rimpac_exercise: "Ejercicio naval RIMPAC"
 USA_TAI_rimpac_exercise_desc: "Invitar a Taiwán a participar en el ejercicio naval anual Rim of the Pacific, las maniobras de guerra marítima internacional más grandes del mundo, señalando el compromiso estadounidense con los socios regionales."
 CHI_SAR_decisions_category: "Estrategia de una sola China"
 CHI_SAR_decisions_category_desc: "\n£GFX_CHI_commission_2\n\n\n\n§YLa Estrategia de una sola China§! representa la política de Pekín para consolidar todos los territorios reclamados bajo un único Estado chino. A través de una combinación de presión política, desarrollo económico y control administrativo, las regiones se alinean gradualmente con el gobierno central.\n\nEste proceso puede seguir diferentes caminos. El aumento de la §Ysinización§! fortalece el control directo y la integración, mientras que los acuerdos más autónomos priorizan la estabilidad local y el potencial económico a costa de la autoridad central.\n\nEl equilibrio entre estos enfoques determinará la unidad a largo plazo del Estado, mientras que la cuestión de §YTaiwán§! sigue estando condicionada por el reconocimiento internacional, el apoyo extranjero y las tensiones a través del estrecho.\n\n§YRegiones Administrativas Especiales de China§!\n$HKG_sinicization$\n$MAC_sinicization$\n$TIB_sinicization$\n$ETK_sinicization$\n$OMG_sinicization$\n\n$CHI_TAI_trust_display$\n$CHI_taiwan_us_support_display$\n$CHI_taiwan_strait_tension_display$\n$CHI_taiwan_recognition_count_display$\n$uighur_threat_display$"
 CHI_pressure_derecognize_TAI: "Presionar a [From.GetName] para retirar el reconocimiento a Taiwán"
 CHI_pressure_derecognize_TAI_desc: "Pekín está llevando a cabo una campaña diplomática sostenida para reducir el reconocimiento internacional de Taiwán. [From.GetName] mantiene actualmente lazos formales con Taipéi. Una combinación de incentivos económicos y amenazas de sanciones puede ser suficiente para inducir un cambio de postura."
 CHI_establish_education_centres: "Establecer centros de educación de habilidades profesionales en Xinjiang"
 CHI_establish_education_centres_desc: ""
 CHI_MON_reunification_retry: "Repetir la oferta de reunificación"
 CHI_MON_reunification_retry_desc: "Mongolia rechazó nuestra propuesta anterior. Podemos volver a acercarnos a Ulán Bator una vez que se haya permitido que las condiciones diplomáticas se estabilicen."
 CHI_han_settlement_small: "Programa menor de asentamiento Han"
 CHI_han_settlement_small_desc: "Un modesto programa patrocinado por el Estado reubica a familias Han desde las provincias densamente pobladas del interior hacia nuevos municipios en Nei Mongol, con el apoyo de incentivos de empleo y planes de asignación de tierras."
 CHI_han_settlement_medium: "Programa moderado de asentamiento Han"
 CHI_han_settlement_medium_desc: "Un esfuerzo de reasentamiento organizado a mayor escala traslada a decenas de miles de trabajadores Han y a sus familias a Nei Mongol. Se designan nuevas zonas industriales y parcelas agrícolas para absorber a la población entrante."
 CHI_han_settlement_large: "Programa masivo de asentamiento Han"
 CHI_han_settlement_large_desc: "Una campaña de ingeniería demográfica a gran escala transfiere a cientos de miles de colonos Han a Nei Mongol en una sola ola coordinada. El impacto a largo plazo en la composición étnica de la región es sustancial, aunque la resistencia local aumenta drásticamente a corto plazo."
 CHI_TAI_media_infiltration: "Infiltración en redes de medios de comunicación"
 CHI_TAI_media_infiltration_desc: "Financiar y expandir redes de propiedad de medios de comunicación y de influencia editorial pro-Pekín dentro de Taiwán. Cultivar un entorno de información más favorable para el compromiso a través del estrecho."
 CHI_TAI_business_council_funding: "Financiación del Consejo Empresarial a través del Estrecho"
 CHI_TAI_business_council_funding_desc: "Proporcionar respaldo financiero a asociaciones empresariales alineadas con el KMT y a cámaras de comercio a través del estrecho. Fortalecer al sector partidario del acercamiento dentro de la élite económica de Taiwán."
 CHI_TAI_cultural_exchange_program: "Programa de intercambio cultural a través del Estrecho"
 CHI_TAI_cultural_exchange_program_desc: "Patrocinar intercambios académicos, festivales culturales y programas de diálogo juvenil a través del estrecho. Construir lazos personales que suavicen la resistencia política a unas relaciones más cercanas."
 CHI_TAI_cross_strait_infrastructure_investment: "Inversión en infraestructura a través del Estrecho"
 CHI_TAI_cross_strait_infrastructure_investment_desc: "Canalizar capital del continente hacia proyectos de infraestructura en Taiwán, posicionando la inversión china como una fuente de oportunidad económica y profundizando la interdependencia material entre ambas economías."
 CHI_45g_national_deployment_idea: "Iniciativa de despliegue nacional 5G"
 CHI_45g_national_deployment_idea_desc: "Despliegue acelerado de la infraestructura de la red 5G en todo el país, con coordinación estatal de la inversión de capital en estaciones base, equipos de red troncal y asignación de espectro. La iniciativa prioriza la cobertura en industrias estratégicas e infraestructuras críticas."
 CHI_avic_innovation_idea: "Desarrollo de aeronaves de AVIC"
 CHI_avic_innovation_idea_desc: "La Corporación de la Industria de la Aviación de China impulsa las capacidades de producción y diseño de aeronaves nacionales, haciendo avanzar los programas de cazas y aviones de transporte libres de la dependencia de licencias y tecnología extranjeras."
 CHI_big_fund_phase_1_idea: "Fondo Nacional de la Industria de Semiconductores"
 CHI_big_fund_phase_1_idea_desc: "La respuesta estratégica de China para la autosuficiencia en semiconductores; el Gran Fondo moviliza capital estatal para desarrollar la capacidad de fabricación nacional, las capacidades de diseño y la fabricación de equipos. La iniciativa hace hincapié en la reducción de la dependencia de las fundiciones y herramientas EDA extranjeras."
 CHI_caic_innovation_idea: "Desarrollo de helicópteros de ataque de CAIC"
 CHI_caic_innovation_idea_desc: "El conglomerado aeroespacial de China hace avanzar la tecnología de los helicópteros de ataque mediante el desarrollo y la producción de plataformas de aeronaves de alas rotatorias nacionales, diseñadas para un despliegue rápido y operaciones sostenidas."
 CHI_casc_innovation_idea: "Programas espaciales y de satélites de CASC"
 CHI_casc_innovation_idea_desc: "La Corporación de Ciencia y Tecnología Aeroespacial de China expande el lanzamiento espacial, las comunicaciones por satélite y las capacidades de observación terrestre, consolidando el papel de China como una gran potencia espacial independiente de las restricciones de acceso extranjeras."
 CHI_casic_innovation_idea: "Desarrollo de misiles y contramedidas de CASIC"
 CHI_casic_innovation_idea_desc: "La Corporación de Ciencia e Industria Aeroespacial de China hace avanzar los sistemas de misiles de crucero, misiles balísticos y defensa aérea a través de un I+D sostenido en propulsión, guiado y guerra electrónica."
 CHI_cetc_innovation_idea: "Desarrollo de informática e IA de CETC"
 CHI_cetc_innovation_idea_desc: "El Grupo de Tecnologías de la Electrónica de China invierte en informática de alto rendimiento, diseño de semiconductores y plataformas de inteligencia artificial para reducir la dependencia tecnológica y acelerar la innovación nacional en tecnologías habilitadoras críticas."
 CHI_crrc_innovation_idea: "Fabricación industrial de CRRC"
 CHI_crrc_innovation_idea_desc: "El fabricante ferroviario y de transporte de China se diversifica hacia sectores industriales más amplios, aprovechando décadas de experiencia en la cadena de suministro en metalurgia, fabricación de precisión e integración de sistemas."
 CHI_csgc_innovation_idea: "Desarrollo de AFV de CSGC"
 CHI_csgc_innovation_idea_desc: "El fabricante estatal de vehículos blindados de China desarrolla plataformas de próxima generación en tanques, vehículos de combate de infantería y vehículos de apoyo, integrando blindaje, potencia de fuego y movilidad avanzados."
 CHI_csic_innovation_idea: "Desarrollo de submarinos de CSIC"
 CHI_csic_innovation_idea_desc: "La Corporación de la Industria de la Construcción Naval de China hace avanzar el diseño y la producción de submarinos, con énfasis en materiales de cascos, reducción de ruido y sistemas de sensores avanzados para operaciones subacuáticas prolongadas."
 CHI_cssc_innovation_idea: "Desarrollo de buques de guerra de superficie de CSSC"
 CHI_cssc_innovation_idea_desc: "El principal constructor naval de China se enfoca en diseños avanzados de destructores, fragatas y corbetas con sistemas de combate integrados, extendiendo las capacidades de alta mar chinas a través de líneas navales estratégicas."
 CHI_failed_five_year_plan: "Plan Quinquenal fallido"
 CHI_failed_five_year_plan_desc: "Los resultados decepcionantes del último ciclo de planificación quinquenal han forzado una reevaluación de las prioridades y la asignación de recursos. La confianza pública en los objetivos de desarrollo a largo plazo se ha resentido, lo que exige correcciones políticas inmediatas."
 CHI_haig_innovation_idea: "Desarrollo de Harbin Aircraft Industry Group"
 CHI_haig_innovation_idea_desc: "El sector de la aviación de Harbin expande las capacidades de las aeronaves de alas rotatorias, desarrollando helicópteros de transporte y plataformas de ataque que reducen la dependencia de licencias y diseños extranjeros."
 CHI_inner_mongolia_innovation_idea: "Desarrollo de blindajes de Mongolia Interior"
 CHI_inner_mongolia_innovation_idea_desc: "La base integrada de producción de blindajes de Mongolia Interior hace avanzar el desarrollo de tanques principales de batalla y vehículos blindados, aprovechando siglos de experiencia metalúrgica y técnicas modernas de fabricación."
 CHI_jap_strategic_isolation: "Aislamiento estratégico japonés"
 CHI_jap_strategic_isolation_desc: "Nuestro apalancamiento económico y posicionamiento diplomático regional marginan cada vez más la influencia estratégica de Japón en Asia Oriental. Tokio se enfrenta a la inflación de los bienes de consumo, la reducción de los mercados de exportación y el peso psicológico de la irrelevancia estratégica."
 CHI_kor_g2_economic_platform: "Marco Económico G2 China-Corea"
 CHI_kor_g2_economic_platform_desc: "Establecimiento de mecanismos bilaterales de coordinación económica entre China y Corea, cubriendo la política comercial, los flujos de inversión y las asociaciones tecnológicas. El acuerdo posiciona a ambas naciones como cogestoras de la prosperidad de Asia Oriental."
 CHI_kor_trilateral_opening: "Apertura trilateral de Corea"
 CHI_kor_trilateral_opening_desc: "Apertura diplomática hacia Corea del Norte mediante consultas de alto nivel y un compromiso económico limitado, señalando la disposición de China a mediar en el diálogo y proporcionar apoyo material para una reforma controlada."
 CHI_made_in_china_2025_idea: "Made in China 2025"
 CHI_made_in_china_2025_idea_desc: "Una iniciativa de política industrial de una década de duración dirigida a la fabricación de alta tecnología en semiconductores, compuestos avanzados, robótica y transporte ferroviario. El programa aspira a transformar a China de la fábrica del mundo al innovador del mundo."
 CHI_nko_final_transition: "Transición final de Corea del Norte"
 CHI_nko_final_transition_desc: "La etapa final de la transformación de Corea del Norte representa la culminación de la influencia y alineación china. Pionyang queda funcionalmente integrada en la esfera china con una mínima independencia nominal."
 CHI_nko_managed_reform_pilot: "Piloto de reforma gestionada en Corea del Norte"
 CHI_nko_managed_reform_pilot_desc: "China patrocina una liberalización económica limitada en Corea del Norte a través de Zonas Económicas Especiales y mecanismos de mercado controlados. El programa piloto pone a prueba si Pionyang puede reformarse sin desestabilizar el control del régimen."
 CHI_norinco_innovation_idea: "Desarrollo de armas de NORINCO"
 CHI_norinco_innovation_idea_desc: "China North Industries Corporation acelera la modernización de las armas de infantería, los sistemas de artillería y las plataformas de blindaje ligero. La cartera de exportaciones de NORINCO se expande hacia ejércitos con acceso limitado a proveedores occidentales."
 CHI_phi_abandonment_doctrine: "Doctrina del abandono de Filipinas"
 CHI_phi_abandonment_doctrine_desc: "Cultivo deliberado de la dependencia económica filipina y el distanciamiento diplomático de su socio de seguridad tradicional, dejando a Manila aislada y vulnerable a la presión de China."
 CHI_poly_innovation_idea: "Desarrollo militar-industrial de Poly Technologies"
 CHI_poly_innovation_idea_desc: "La diversificada cartera militar-industrial de Polytech se expande hacia sectores de defensa emergentes, aprovechando el respaldo estatal y el acceso a instituciones de investigación en todo el aparato de defensa."
 CHI_sac_innovation_idea: "Desarrollo de aviones de caza de SAC"
 CHI_sac_innovation_idea_desc: "Shenyang Aircraft Corporation hace avanzar el diseño y la producción de aviones de caza, desarrollando plataformas nacionales que reducen la dependencia de los motores rusos y de la tecnología de radar AESA."
 CHI_shadow_banking_cleanup_idea: "Limpieza del sector de la banca en la sombra"
 CHI_shadow_banking_cleanup_idea_desc: "La represión regulatoria contra los productos de fideicomiso no regulados, los préstamos entre particulares y la financiación fuera de balance elimina los riesgos sistémicos del sistema financiero. La contracción del crédito a corto plazo se ve compensada por una mayor confianza en la regulación."
 CHI_south_china_sea_dominance_window: "Ventana de dominio en el mar de China Meridional"
 CHI_south_china_sea_dominance_window_desc: "Se ha abierto una ventana estratégica para consolidar el control sobre el mar de China Meridional mediante la presencia naval, la expansión de la flota pesquera civil y la construcción de instalaciones militares en islas ganadas al mar. La ventana podría cerrarse si las potencias regionales se coordinan para oponerse a la expansión china."
 CHI_ztz99_rollout_idea: "Despliegue del tanque principal de batalla Tipo 99"
 CHI_ztz99_rollout_idea_desc: "Producción y despliegue a gran escala del tanque principal de batalla Tipo 99 en las Fuerzas Terrestres del EPL, proporcionando un blindaje, una potencia de fuego y una movilidad mejorados en comparación con las plataformas anteriores."
 ETK_security_reinforcement_idea: "Refuerzo de las fuerzas de seguridad"
 ETK_security_reinforcement_idea_desc: "Expansión de las fuerzas de seguridad y blindaje de las infraestructuras contra los ataques terroristas, con un coste económico modesto compensado por la reducción de las libertades civiles y el aumento de la vigilancia."
 ETK_surveillance_state_idea: "Medidas del Estado de vigilancia"
 ETK_surveillance_state_idea_desc: "Expansión integral de los sistemas de vigilancia, las redes de puntos de control y la recopilación de inteligencia en toda la sociedad. Los beneficios de eficiencia económica derivados de un mayor control social se ven contrarrestados por una menor innovación y una menor participación ciudadana."
 ETK_terrorism_aftermath: "Secuelas del terrorismo"
 ETK_terrorism_aftermath_desc: "Las persistentes preocupaciones de seguridad y el trauma social derivados de los recientes ataques terroristas continúan perturbando la actividad económica y la confianza pública. La recuperación requiere tiempo y un restablecimiento eficaz de la seguridad."
 TAI_civil_defense_readiness: "Preparación de la defensa civil"
 TAI_civil_defense_readiness_desc: "Movilización de la población para tareas de defensa aérea, con entrenamiento en refugio, atención a heridos y control de daños. La defensa contra las amenazas aéreas mejora a costa de una reducción de la calidad de vida y de perturbaciones económicas."
 CHI_bri_pacific_engagement_tt: "$CHI_bri_pacific_engagement$: $RIGHT|+=1$"
 CHI_Asset_Seizure_tt: "§YActivo incautado:§! §G+25§! de tesorería, §G+3§! $CHI_bri_global_presence$\nLa deuda pendiente se reduce en el coste de un proyecto"
 chi_bri.16.a: "Gestionaremos las consecuencias"
 chi_bri.16.d: "El ministerio de finanzas ha confirmado lo que las cuentas ya mostraban: no podemos cumplir con el pago de este mes de nuestras obligaciones de la Franja y la Ruta. Pekín será informado en cuestión de días. Hasta que se liquiden los atrasos, nuestro acreedor tiene derecho a actuar, y las opciones de las que dispone no son todas amables."
 chi_bri.16.t: "Impago de la deuda de la Franja y la Ruta"
 chi_bri.17.a: "Firmar la concesión"
 chi_bri.17.b: "Los yacimientos no están a la venta"
 chi_bri.17.d: "Una delegación china ha llegado con una propuesta que en realidad no es una propuesta. A cambio de reducir nuestra deuda vencida de la Franja y la Ruta en el coste de un proyecto, Pekín quiere derechos de extracción y exportación a largo plazo sobre nuestros yacimientos minerales. Una parte de la deuda desaparecería de los libros. También lo haría, en gran medida, el control del suelo bajo nuestros pies."
 chi_bri.17.t: "Pekín exige derechos sobre los recursos"
 chi_bri.18.a: "Quedan otros instrumentos"
 chi_bri.18.d: "[FROM.GetName] ha rechazado categóricamente nuestras condiciones para la concesión de recursos. Su deuda se mantiene, su impago se mantiene y nuestra delegación ha regresado a Pekín con las manos vacías. La cuestión ahora es si esperar o cobrar lo que se nos debe por otros medios."
 chi_bri.18.t: "[FROM.GetName] rechaza nuestras condiciones"
 chi_bri.19.a: "Sopesar nuestras opciones"
 chi_bri.19.d: "[FROM.GetName] ha incumplido con el pago de sus obligaciones de la Franja y la Ruta. La suma no es grande para los estándares de la iniciativa, pero el precedente importa: todos los demás prestatarios están observando cómo responde Pekín. Podemos reestructurar la deuda, exigir derechos sobre los recursos o incautar lo que financiamos."
 chi_bri.19.t: "[FROM.GetName] incurre en impago de la Franja y la Ruta"
 chi_bri.23.a: "La construcción es lo que importa"
 chi_bri.23.d: "Nuestra tesorería no podía cubrir nuestra parte del proyecto §Y[GetBRIProjectName]§!, por lo que Pekín ha extendido un crédito para cerrar la brecha. La construcción avanza de cualquier manera. La deuda está ahora en nuestros libros, acumula intereses y, si no podemos pagarla, las condiciones otorgan a China un considerable margen de maniobra."
 chi_bri.23.t: "Proyecto de la Franja y la Ruta financiado a crédito"
 CHI_BRI_automation_disable_tt: "Las solicitudes de la Franja y la Ruta deben §Yrevisarse individualmente§!"
 CHI_BRI_automation_enable_tt: "Las solicitudes de la Franja y la Ruta se §Gaceptan automáticamente§!"
 CHI_bri_buy_back_concession: "Recomprar la concesión"
 CHI_bri_buy_back_concession_desc: "Pagar para librarnos de los derechos de extracción y exportación cedidos a las empresas chinas. Es costoso y Pekín no se tomará la pérdida de buen grado, pero devuelve los yacimientos al control nacional."
 CHI_bri_can_host_energy: "Controlamos un Estado con un complejo industrial al que abastecer de energía"
 CHI_bri_can_host_mine: "Controlamos un Estado con yacimientos minerales de valor"
 CHI_bri_can_host_pipeline: "Controlamos un Estado con yacimientos de petróleo, acero o metales preciosos de valor"
 CHI_bri_can_host_port: "Controlamos un Estado costero que podría albergar el puerto"
 CHI_bri_can_host_prestige: "Controlamos nuestra capital"
 CHI_bri_can_host_rail: "Controlamos un Estado que podría albergar el ferrocarril"
 CHI_bri_can_host_sez: "Controlamos un Estado costero o bien conectado que podría albergar la zona"
 CHI_bri_can_host_telecom: "Controlamos un Estado que podría albergar la red"
 CHI_bri_can_request: "China acepta solicitudes de la Franja y la Ruta y tiene un espacio de proyecto libre"
 CHI_bri_clear_loan_tt: "Su deuda pendiente de la Franja y la Ruta queda §Gcondonada§!"
 CHI_bri_has_reclaimable_structure: "Controlan un proyecto de la Franja y la Ruta que podríamos confiscar"
 CHI_bri_monthly_income_base: "Contribución mensual base de la Franja y la Ruta"
 CHI_bri_monthly_income_base_desc: "La proporción del presupuesto estatal destinada al fondo de la Franja y la Ruta cada mes mediante enfoques y decisiones, antes de las bonificaciones departamentales."
 CHI_bri_monthly_income_total: "Contribución mensual de la Franja y la Ruta"
 CHI_bri_monthly_income_total_desc: "El total pagado al fondo de la Franja y la Ruta cada mes: la base comprometida más las bonificaciones departamentales."
 CHI_bri_refuse_concession_tt: "§RMantenemos la deuda§! y seguimos en situación de impago"
 CHI_bri_returns_multiplier_base: "Multiplicador de rendimientos de la Franja y la Ruta"
 CHI_bri_returns_multiplier_base_desc: "Bonificación aplicada al rendimiento de las Inversiones Internacionales que China registra por cada proyecto completado de la Franja y la Ruta."
 CHI_bri_unlock_tt: "§YFranja y la Ruta:§! §G6§! espacios de proyectos, §G40§! de coste por proyecto, §G+8§! de contribución mensual, §G+4§! de Inversiones Internacionales por cada proyecto completado"
 CHI_Write_Off_Debts_tt: "La deuda de la Franja y la Ruta de todos los socios calificados queda §Gcondonada§! por completo"
 CHI_bri_forum_surge: "Impulso por el Foro de la Franja y la Ruta"
 CHI_bri_forum_surge_desc: "Los compromisos firmados en el foro trienal permiten a Pekín gestionar dos proyectos más de forma simultánea durante los próximos tres años. Con más espacios abiertos, más Estados socios pueden estar construyendo en cualquier momento dado."
 CHI_bri_partner_1: "Participante de la Franja y la Ruta"
 CHI_bri_partner_1_desc: "Se ha puesto en marcha un proyecto inicial de la Franja y la Ruta. Los equipos de construcción chinos aceleran las obras nacionales y otorgan credibilidad a la agenda de desarrollo del gobierno."
 CHI_bri_partner_2: "Socio de la Franja y la Ruta"
 CHI_bri_partner_2_desc: "Se ha entregado un segundo proyecto de la Franja y la Ruta. La ingeniería y la financiación de infraestructuras chinas se están convirtiendo en una parte visible del programa de desarrollo nacional."
 CHI_bri_partner_3: "Socio estratégico de la Franja y la Ruta"
 CHI_bri_partner_3_desc: "Múltiples proyectos de la Franja y la Ruta están activos en todo el país. Los contratistas, las líneas de crédito y el respaldo político chinos refuerzan la capacidad del Estado, y Pekín espera una alineación diplomática a cambio."
 CHI_bri_partner_4: "Estado ancla de la Franja y la Ruta"
 CHI_bri_partner_4_desc: "La inversión de la Franja y la Ruta sustenta la economía nacional. El capital chino financia la construcción y el suministro de bienes de consumo, y esta dependencia es ahora difícil de revertir sin una grave perturbación."
 CHI_bri_partner_5: "Socio clave de la Franja y la Ruta"
 CHI_bri_partner_5_desc: "El país es un pilar de la Franja y la Ruta. Los estándares, contratistas y la financiación chinos están integrados en cada corredor principal, y la política económica se diseña pensando en Pekín."
 CHI_bri_presence_modifier: "Presencia global de la Franja y la Ruta"
 CHI_bri_presence_modifier_desc: "La posición e influencia que China obtiene de su red de la Franja y la Ruta. Crece con el número de Estados socios y con la profundidad de los lazos de cada uno de ellos."
 CHI_bri_presence_modifier_tt: "Escala con la §Y$CHI_bri_global_presence$§!: el rango combinado de cada socio de la Franja y la Ruta. La demanda de bienes de consumo disminuye hasta un §G7.5%§! con 200 de presencia."
 CHI_bri_claim_resource_rights: "Reclamar derechos sobre los recursos"
 CHI_bri_claim_resource_rights_desc: "Cobrar el pago en especie. El deudor cede los derechos de extracción y exportación a largo plazo, reduciendo su deuda en el coste de un proyecto al tiempo que entrega el control de su base de recursos. Disponible solo en la vía de Préstamos Abusivos."
 CHI_bri_project_mission: "Construcción de la Franja y la Ruta"
 CHI_bri_project_mission_desc: "Los contratistas y la financiación chinos están trabajando en el proyecto §Y[GetBRIProjectName]§!. Cuando se entregue, obtendremos sus beneficios, el rango del socio aumentará y Pekín recaudará sus rendimientos."
 CHI_bri_raise_contribution: "Aumentar la financiación de la Franja y la Ruta"
 CHI_bri_raise_contribution_desc: "Destinar una mayor proporción del presupuesto estatal al fondo de la Franja y la Ruta cada mes. La tesorería paga la construcción por adelantado y nunca se repone con los rendimientos de los proyectos, por lo que aumentarla es la única forma de seguir construyendo."
 CHI_bri_raise_contribution_tt: "§Y$CHI_bri_monthly_income$§!: hasta §G+4§! al mes (máximo §Y30§!)"
 CHI_bri_resource_concession_idea: "Concesión de recursos a China"
 CHI_bri_resource_concession_idea_desc: "Parte de un préstamo impagado de la Franja y la Ruta se liquidó cediendo los derechos de extracción y exportación. Las empresas chinas explotan los yacimientos y los ingresos salen del país antes de ser gravados con impuestos. La concesión se mantiene vigente hasta que sea recomprada."
 CHI_BRI_project_missions: "Proyectos de la Franja y la Ruta"
 CHI_BRI_project_missions_desc: "Proyectos de la Franja y la Ruta actualmente en construcción en nuestro país, financiados y edificados por contratistas chinos."
 CHI_BRI_automation_disable: "Desactivar automatización de la Franja y la Ruta"
 CHI_BRI_automation_disable_desc: "Volver a un proceso de revisión manual para las solicitudes entrantes de proyectos de la Franja y la Ruta. Cada solicitud llegará como un evento para que China la examine, apruebe o rechace individualmente. Las solicitudes que ya estén esperando revisión mantendrán el proceso bajo el cual se abrieron."
 CHI_BRI_automation_enable: "Activar automatización de la Franja y la Ruta"
 CHI_BRI_automation_enable_desc: "Aprobar automáticamente las solicitudes entrantes de la Franja y la Ruta en lugar de revisar cada una de ellas. Los solicitantes ya pasan por un filtro de elegibilidad y disponibilidad de espacios de proyecto antes de poder postularse, por lo que la automatización simplemente se salta el papeleo. Las solicitudes que ya estén esperando revisión mantendrán el proceso bajo el cual se abrieron."
 CHI_bri_committed_projects: "Proyectos comprometidos de la Franja y la Ruta"
 CHI_bri_committed_projects_desc: "Proyectos activos de la Franja y la Ruta más las solicitudes que esperan revisión. Cada solicitud pendiente reserva un espacio de proyecto."
 CHI_MAC_gambling_diversification: "Diversificación de la industria del juego"
 CHI_MAC_gambling_diversification_desc: "Durante décadas, la prosperidad de Macao se ha asentado sobre un único pilar: las salas de casino. Un giro deliberado hacia los servicios digitales, el comercio electrónico y la infraestructura tecnológica amplía la base impositiva más allá de las mesas de juego, protegiendo a la RAE contra los vaivenes de los ingresos turísticos al tiempo que siembra una economía de internet autóctona."
