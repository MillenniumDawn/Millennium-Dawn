 OPEC_APPLY: "Apply to Join"
 OPEC_APPLY_TT: "Apply for OPEC membership. The application is decided at the next conference and needs the approval of members holding §Y75%§! of OPEC oil production. Members at war with us or with an opinion of us below §Y-25§! vote against.\n\nRequirements:\n[!opec_can_apply]"
 OPEC_WITHDRAW_APPLICATION: "Withdraw Application"
