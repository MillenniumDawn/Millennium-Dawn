 PHI_change_npa_strength_tt: "£generic_Communist_State_small §R新人民军实力§!改变[?temp_change|0+]（当前：[?PHI.PHI_strength_of_npa|Y0]）\n"
 PHI_islamism_dynamic_modifier: "激进伊斯兰主义的兴起"
 PHI_islamism_dynamic_modifier_tooltip: "伊斯兰主义在菲律宾已有数百年历史。但近年来，这种情况开始发生变化，该国南部地区出现了极端激进化现象。"
 PHI_npa_insurgency_dynamic_modifier: "旷日持久的人民战争"
 PHI_npa_insurgency_dynamic_modifier_tooltip: "自1969年以来，菲律宾共产党通过其新人民军在农村地区开展游击战。其干部向村庄征税、伏击巡逻队，并在吕宋岛、萨马岛和棉兰老岛东部地区争夺地方政府的控制权。"
 PHI_milf_decisions_category: "摩洛冲突"
 PHI_milf_decisions_category_desc: "摩洛冲突指的是棉兰老岛省内的一系列武装冲突。摩洛冲突始于1935年菲律宾联邦时期实施的“重新安置政策”。冲突在科雷吉多岛爆发，当时11名穆斯林军事学员遭到杀害。此后不久，摩洛伊斯兰民族阵线于1969年成立，并一直与政府军处于公开冲突状态。\n£generic_anarchist_communism_small §R摩洛伊斯兰民族阵线实力：§![?PHI.PHI_strength_of_milf|20]%"
 PHI_anti_muslim_propaganda: "反穆斯林宣传"
 PHI_anti_muslim_propaganda_desc: "直接利用国家媒体和公共信息来对抗在棉兰老岛活动的激进伊斯兰叛乱组织的影响。"
 PHI_crush_the_moro_insurgency: "镇压摩洛叛乱"
 PHI_crush_the_moro_insurgency_desc: "随着摩洛伊斯兰解放阵线被削弱至只剩残余势力，武装部队可以宣布棉兰老岛战役结束。南部各省的指挥权归还给文官政府，叛乱以武力而非谈判的方式结束。"
 PHI_sign_the_bangsamoro_agreement: "签署邦萨摩洛协议"
 PHI_sign_the_bangsamoro_agreement_desc: "在马来西亚斡旋下，吉隆坡的会谈促使该阵线重返谈判桌。一项全面协议将使该阵线的武装人员解除武装，以拥有真正财政和立法权的邦萨摩洛实体取代棉兰老穆斯林自治区，并承诺马尼拉将为过渡提供资金。"
 PHI_communist_insurgency_category: "新人民军叛乱"
 PHI_communist_insurgency_category_desc: "新人民军叛乱是世界上历史最悠久的共产主义叛乱。自1969年以来，新人民军一直在与菲律宾国家政府进行持续不断的战斗。\n\n现在是我们全力镇压这场叛乱的时候了。\n£generic_Communist_State_small §R新人民军实力：§! [?PHI.PHI_strength_of_npa|20]%"
 PHI_sustained_military_offensive: "持续军事进攻"
 PHI_sustained_military_offensive_desc: "派遣军队和宪兵部队清剿马德雷山脉、萨马岛和达沃内陆地区的游击队前线。扫荡行动比任何其他方法都能更快地削弱新人民军，但长期在农村地区开展军事行动会使政府失去农村民众的支持。"
 PHI_peace_and_development_teams: "和平与发展小组"
 PHI_peace_and_development_teams_desc: "向受游击队影响的村庄部署军民联合小组，将道路和学校建设与地方治理工作相结合。切断叛乱分子的招募渠道比全面清剿行动耗时更长，成本也更高，但却不会损害稳定。"
 PHI_amnesty_for_returning_cadres: "对投诚干部的特赦"
 PHI_amnesty_for_returning_cadres_desc: "向投降的武装分子提供法律豁免、现金援助和生计支持。大规模的叛逃会削弱游击队的实力，但赦免叛乱分子会使政府失去军官和叛乱受害者的支持。"
 PHI_defeat_the_new_peoples_army: "击败新人民军"
 PHI_defeat_the_new_peoples_army_desc: "游击队阵线已被突破，中央委员会成员流散海外。宣布叛乱军事失败，标志着世界上持续时间最长的共产主义叛乱运动的结束。"
 PHI_conclude_the_oslo_talks: "结束奥斯陆会谈"
 PHI_conclude_the_oslo_talks_desc: "挪威调解员多年来一直与民族民主阵线保持开放的渠道。最终的解决方案将以政治特赦和土地改革承诺换取新人民军的永久复员。"
 PHI_anti_dynasty_law: "反世袭法"
 PHI_anti_dynasty_law_desc: "1987年宪法第二条第26条禁止政治世袭，但国会从未通过授权立法，主导立法机关的家族也没有理由这样做。强行通过这项法案将禁止现任者的亲属继任总统，打破省级宗族对国家政治的控制，并向来自名门望族之外的候选人开放各党派的领导权。"
 PHI_corruption_battle_mechanic_category: "反腐之战"
 PHI_corruption_battle_mechanic_category_desc: "数十年的裙带政治、薄弱的制度和根深蒂固的利益集团，使得腐败渗透到政府的几乎每一个层级。要根除腐败，需要在官僚机构、军队和私营部门开展持续、有针对性的调查。随着改革的推进和制度的完善，未来的调查将会更加便捷有效。\n\n当前腐败等级：[Root.GetPHI_corruption_tier_number][Root.GetPHI_corruption_tier_name]\n当前腐败实力：[?PHI_corruption_strength|Y0]"
 PHI_change_the_strength_of_corruption_tt: "§Y腐败实力§!改变[?temp_change|0+]（当前：[?PHI.PHI_corruption_strength|Y0]）\n"
 PHI_corp_nothing_tt: "§R75%§!：什么都没发生/官僚主义失灵。\n腐败进程无。"
 PHI_corp_minor_tt: "§Y65%§!：发现一个小型腐败团伙。\n§G−5§!腐败进程。"
 PHI_corp_major_tt: "§Y35%§!：大规模企业丑闻。\n§G−10§!腐败进程。§R−2%§!稳定度"
 PHI_corp_huge_tt: "§G10%§!：高额腐败案件曝光。\n§G−20§!腐败进程。§R−5%§!工业能力，持续180天。"
 PHI_contracts_nothing_tt: "§R70%§!：无证据显示。\n无变化。"
 PHI_contracts_minor_tt: "§Y55%§!：轻微管理不善暴露出来。\n§G−5§!腐败进程。"
 PHI_contracts_major_tt: "§Y30%§!：重大采购腐败案。\n§G−10§!腐败进程。§R−3%§!建筑速度。"
 PHI_contracts_huge_tt: "§G15%§!：国家贪污案曝光。\n§G-20§!腐败进程。§R-2%§!稳定度。"
 PHI_tax_nothing_tt: "§R80%§!：没有得出确切结论。\n不变。"
 PHI_tax_minor_tt: "§Y50%§!：查获一起轻微贿赂案。\n§G-5§!腐败进程"
 PHI_tax_major_tt: "§Y25%§!：海关欺诈团伙被曝光。\n§G-10§!腐败进程。§R-10%§!税收，持续2个月。"
 PHI_tax_huge_tt: "§G10%§!：高层官员牵涉其中。\n§G-25§!腐败进程。§R-15%§!国外投资，持续6个月。"
 PHI_military_nothing_tt: "§R80%§!：没有证据或被掩盖了。\n不变。"
 PHI_military_minor_tt: "§Y60%§!：低级军官被捕。\n§G-5§!腐败进程"
 PHI_military_major_tt: "§Y25%§!：总参谋人员牵涉其中。\n§G-10§!腐败进程。§R-3%§!军队组织度，持续90天。"
 PHI_military_huge_tt: "§G10%§!：高级军官身份曝光。\n§G-20§!腐败进程。§R-5%§!稳定度。§R-5§!陆军经验"
 PHI_purge_nothing_tt: "§R70%§!：没有显著结果。\n不变。"
 PHI_purge_minor_tt: "§Y60%§!：发现小规模移植网络。\n§G-5§!腐败进程"
 PHI_purge_major_tt: "§Y35%§!：当地一个大型犯罪集团被曝光。\n§G-10§!腐败进程。§R+1%§!抵抗目标。"
 PHI_purge_huge_tt: "§G10%§!：政治王朝垮台。\n§G-20§!腐败进程。§R+2%§!抵抗目标。§G+3%§!稳定度，持续90天。"
 PHI_offshore_nothing_tt: "§R85%§!：未发现任何痕迹。\n不变。"
 PHI_offshore_minor_tt: "§Y50%§!：小账户被追踪。\n§G-5§!腐败进程"
 PHI_offshore_major_tt: "§Y20%§!：发现大型洗钱网络。\n§G-25§!腐败进程"
 PHI_offshore_huge_tt: "§G5%§!：海外巨额财富被曝光。\n§G-40§!腐败进程。§G-10%§!外国投资，持续6个月。"
 PHI_investigate_corporations: "调查公司"
 PHI_investigate_corporations_desc: "菲律宾大型企业集团长期以来与监管机构和立法者保持着密切关系。对企业账目、税务申报和政府合同进行重点调查，可能会揭露贿赂和挪用公款的丑闻，但结果取决于目前腐败的根深蒂固程度。\n\n当前腐败等级：([?PHI_corruption_tier|0]) [?PHI_corruption_tier_name]"
 PHI_audit_government_contracts: "审计政府合同"
 PHI_audit_government_contracts_desc: "公共基础设施和采购合同是臭名昭著的贪污滋生地，回扣和虚报发票等手段会将资金从公共项目中挪用。对近期合同进行彻底审计或许能揭露欺诈行为，但那些有所隐瞒的官员会极力抵制审查。\n\n当前腐败等级：([?PHI_corruption_tier|0]) [?PHI_corruption_tier_name]"
 PHI_inspect_tax_bureau: "检查税务局"
 PHI_inspect_tax_bureau_desc: "税务局一直饱受贿赂、暗箱操作和伪造记录等指控的困扰。内部调查或许能够追回损失的税款并揪出腐败官员，但税务局自身的腐败也可能庇护最严重的违法者。\n\n当前腐败等级：([?PHI_corruption_tier|0]) [?PHI_corruption_tier_name]"
 PHI_investigate_the_military: "调查军方"
 PHI_investigate_the_military_desc: "采购丑闻和吃空饷问题长期以来一直困扰着菲律宾武装部队的预算。调查军方财务状况可能会引发与军官团的摩擦，但成功的调查可以追回被盗资金，并恢复军队内部的纪律。\n\n当前腐败等级：([?PHI_corruption_tier|0]) [?PHI_corruption_tier_name]"
 PHI_purge_local_officials: "清洗地方官员"
 PHI_purge_local_officials_desc: "从省议会大厦到描笼涯大厅的地方政府单位往往由将公职视为家族企业的政治王朝主导。有针对性地清洗腐败的地方官员可以打破他们对权力的控制，尽管根深蒂固的王朝可能会竭尽全力进行抵抗。\n\n当前腐败等级：([?PHI_corruption_tier|0]) [?PHI_corruption_tier_name]"
 PHI_trace_offshore_accounts: "追踪海外账户"
 PHI_trace_offshore_accounts_desc: "数十年来，非法所得往往被转移到海外的离岸账户和空壳公司。追踪这些账户耗时费力，成本高昂，而且涉及外交敏感问题，但一旦成功追踪，就能追回巨额资金，并对构建这些账户的犯罪网络造成沉重打击。\n\n当前腐败等级：([?PHI_corruption_tier|0]) [?PHI_corruption_tier_name]"
 PHI_police_investiture: "警察授勋"
 PHI_police_investiture_desc: "将政府资金重新分配，用于加强菲律宾国家警察，提高调查人员的工作效率，但代价是增加警务支出。"
 PHI_police_investiture_active_tt: "增加警务经费的措施正在发挥作用。所有反腐败调查的成功率都有所提高。\n§R+20%§!警力支出。§R-15§!最大指挥点数。"
 PHI_corporate_scandal_industry: "企业丑闻"
 PHI_corporate_scandal_industry_desc: "高价值企业腐败案的曝光动摇了投资者对我国工业领域的信心。"
 PHI_procurement_scandal_construction: "采购丑闻"
 PHI_procurement_scandal_construction_desc: "政府合同中发现的重大腐败问题导致工程进度放缓，因为合同正在接受审查。"
 PHI_customs_fraud_tax: "海关欺诈案曝光"
 PHI_customs_fraud_tax_desc: "海关部门重组期间，一个海关欺诈团伙扰乱了税收征管工作。"
 PHI_tax_scandal_investment: "税务局丑闻"
 PHI_tax_scandal_investment_desc: "税务部门高层腐败吓跑了外国投资者。"
 PHI_military_scandal_org: "军方腐败丑闻"
 PHI_military_scandal_org_desc: "总参谋部的腐败破坏了指挥结构和部队凝聚力。"
 PHI_offshore_fortune_investment: "追回的境外资金"
 PHI_offshore_fortune_investment_desc: "查获的海外资产已被重新投资，开辟了新的外国投资渠道。"
 PHI_locked_corruption: "根深蒂固的腐败"
 PHI_locked_corruption_desc: "§R无法手动修改反腐败法律§!\n多年来的裙带政治、官僚主义低效和根深蒂固的特殊利益集团，使得腐败渗透到菲律宾国家体制的方方面面。公共资源经常被挪用，问责机制依然薄弱，权势人物继续从现状中获利。仅靠法令无法实现有意义的改革。反腐败斗争需要坚定不移的调查、更强大的机构以及一个敢于挑战那些从体制中获利者的政府。"
 PHI_corruption_eradicated: "廉洁政府"
 PHI_corruption_eradicated_desc: "经过多年的持续改革，菲律宾取得了一项在其历史上极为罕见的成就：一个真正廉洁高效的政府。国家机构更加健全，公众信任得以重建，贪污腐败的恶性循环也暂时被打破。但要保持这一水准，仍需持续保持警惕。"
 PHI_corruption_event.1.t: "腐败等级降低"
 PHI_corruption_event.1.d: "我们不懈的努力终于有了回报。腐败网络已被瓦解，新的问责机制已经建立。"
 PHI_corruption_event.1.a: "终于取得进展了。"
 PHI_corruption_event.2.t: "腐败加剧"
 PHI_corruption_event.2.d: "尽管我们做出了努力，腐败势力仍然巩固了他们的控制。贿赂和贪污已经进一步渗透到国家机构中。"
 PHI_corruption_event.2.a: "我们必须做得更好。"
 PHI_corruption_event.10.t: "调查：怀疑存在掩盖行为"
 PHI_corruption_event.10.d: "我们的调查人员遇到了重重阻碍，律师众多，文件都被封存，而且还有人突然失忆。某个有权势的人在掩盖罪行，但我们无法证实。"
 PHI_corruption_event.10.a: "继续关注他们。"
 PHI_corruption_event.11.t: "调查：发现腐败团伙"
 PHI_corruption_event.11.d: "一个在私营部门运作的中层腐败团伙被曝光。多名高管面临指控，部分被挪用的资金已被追回。"
 PHI_corruption_event.11.a: "起诉他们。"
 PHI_corruption_event.12.t: "调查：企业丑闻曝光"
 PHI_corruption_event.12.d: "一场巨大的企业丑闻震动了商界。高管们与政府官员勾结，挪用公共资金。丑闻的余波动摇了投资者的信心。"
 PHI_corruption_event.12.a: "没收他们的资产。"
 PHI_corruption_event.13.t: "调查：高额腐败案曝光"
 PHI_corruption_event.13.d: "一项惊人的发现：一张牵涉私营企业最高层的巨额企业腐败网络已被彻底揭露。数十亿美元的资产正在被查封。"
 PHI_corruption_event.13.a: "这件事不会被遗忘。"
 PHI_corruption_event.20.t: "审计：未发现证据"
 PHI_corruption_event.20.d: "审计结果显示没有任何问题。所有合同的纸质文件都核对无误。要么账目干净，要么在我们到来之前就有人篡改过。"
 PHI_corruption_event.20.a: "我们尝试过了。"
 PHI_corruption_event.21.t: "审计：管理不善暴露无遗"
 PHI_corruption_event.21.d: "审计人员发现多个部门存在账目混乱和虚报发票的情况。被挪用的资金已被追回。"
 PHI_corruption_event.21.a: "让他们承担责任。"
 PHI_corruption_event.22.t: "审计：发现采购腐败"
 PHI_corruption_event.22.d: "一个根深蒂固的采购舞弊案被曝光。官员们有系统地将合同授予空壳公司，以换取回扣。"
 PHI_corruption_event.22.a: "拆除网络。"
 PHI_corruption_event.23.t: "审计：国家贪污案曝光"
 PHI_corruption_event.23.d: "一起涉及多个部委的惊人贪污案被曝光。如此大规模的公款盗窃案堪称全国丑闻。"
 PHI_corruption_event.23.a: "这一切到此结束。"
 PHI_corruption_event.30.t: "税务检查：未发现任何问题"
 PHI_corruption_event.30.d: "检查人员未发现确凿的违法证据。工作人员配合调查，记录也井然有序。调查无果而终。"
 PHI_corruption_event.30.a: "重返工作。"
 PHI_corruption_event.31.t: "税务稽查：发现贿赂行为"
 PHI_corruption_event.31.d: "一些基层税务人员因收受贿赂以减少税款评估而被抓获。他们已被解雇，拖欠的税款也已被追回。"
 PHI_corruption_event.31.a: "清理房间。"
 PHI_corruption_event.32.t: "税务稽查：海关欺诈案曝光"
 PHI_corruption_event.32.d: "一个组织严密的海关欺诈团伙被捣毁。多年来，走私分子贿赂高级官员，让他们放行未缴税的货物。"
 PHI_corruption_event.32.a: "改革该机构。"
 PHI_corruption_event.33.t: "税务稽查：高层官员牵涉其中"
 PHI_corruption_event.33.d: "税务局高层官员卷入了一起系统性腐败案。这起丑闻震惊了外国投资者，也动摇了公众的信心。"
 PHI_corruption_event.33.a: "将他们全部绳之以法。"
 PHI_corruption_event.40.t: "军事调查：证据被掩盖"
 PHI_corruption_event.40.d: "军队紧密团结。我们的调查人员在各个层面都遇到了阻碍。如果存在腐败，那么它已经被埋得很深了。"
 PHI_corruption_event.40.a: "我们会回来的。"
 PHI_corruption_event.41.t: "军事调查：军官被捕"
 PHI_corruption_event.41.d: "几名低级军官因挪用燃料配额和装备谋取私利而被捕，他们已被送上军事法庭。"
 PHI_corruption_event.41.a: "正义得以伸张"
 PHI_corruption_event.42.t: "军事调查：总参谋部牵涉其中"
 PHI_corruption_event.42.d: "总参谋部成员卷入了一起涉及国防采购合同的腐败案。这起丑闻扰乱了指挥系统。"
 PHI_corruption_event.42.a: "清除队伍中的异己分子。"
 PHI_corruption_event.43.t: "军事调查：高级人物曝光"
 PHI_corruption_event.43.d: "一名高级军官被公开揭露多年来挪用国防资金。这一消息震惊了军界和公众。"
 PHI_corruption_event.43.a: "任何人都不凌驾于法律之上。"
 PHI_corruption_event.50.t: "清洗：无明显结果"
 PHI_corruption_event.50.d: "地方官员保持低调，这次清洗行动几乎一无所获。要么是这些网络保持沉默，要么是事先得到了消息。"
 PHI_corruption_event.50.a: "我们会再次尝试"
 PHI_corruption_event.51.t: "清洗：发现贪污网络"
 PHI_corruption_event.51.d: "一个在地方官僚机构中运作的小规模贪腐网络已被捣毁。少数官员已被免职。"
 PHI_corruption_event.51.a: "滚蛋吧。"
 PHI_corruption_event.52.t: "清洗：本地犯罪集团曝光"
 PHI_corruption_event.52.d: "一个渗透到地方政府内部的大型地方犯罪集团被曝光。他们的垮台扰乱了地方权力结构，引发了社会动荡。"
 PHI_corruption_event.52.a: "稳定将会随之而来。"
 PHI_corruption_event.53.t: "清洗：政治王朝覆灭"
 PHI_corruption_event.53.d: "一个根深蒂固、掌控地方政府数十年的政治王朝被推翻。他们的资产已被没收，但其拥护者仍然躁动不安。"
 PHI_corruption_event.53.a: "新时代开始了"
 PHI_corruption_event.60.t: "离岸追踪：未发现踪迹"
 PHI_corruption_event.60.d: "我们的财务调查人员陷入了僵局。所有线索都指向了分散在多个司法管辖区的匿名空壳公司。钱款消失得无影无踪。"
 PHI_corruption_event.60.a: "我们输了"
 PHI_corruption_event.61.t: "离岸追踪：发现小账户"
 PHI_corruption_event.61.d: "当局已查明并冻结了一些与政府官员有关的数个数额较小的离岸账户。虽然金额不大，但这一先例意义重大。"
 PHI_corruption_event.61.a: "冻结一切。"
 PHI_corruption_event.62.t: "离岸追踪：洗钱网络曝光"
 PHI_corruption_event.62.d: "一个通过离岸账户转移资金的大型洗钱网络已被捣毁。大量赃款已汇回菲律宾国库。"
 PHI_corruption_event.62.a: "把它带回家。"
 PHI_corruption_event.63.t: "离岸追踪：揭秘离岸财富"
 PHI_corruption_event.63.d: "一项惊人的发现：一批属于高级官员的巨额海外财富被查获并没收。这笔意外之财意义重大，传递出强烈的信号。"
 PHI_corruption_event.63.a: "人民终会知道。"
 PHI_corruption_event.99.t: "恢复公众信任"
 PHI_corruption_event.99.d: "随着旧政治王朝下台，地方社区正在缓慢重建对政府机构的信任。一种谨慎的乐观情绪正在蔓延。"
 PHI_corruption_event.99.a: "人民在我们身后。"
 PHI_corruption_event.100.t: "我们做到了"
 PHI_corruption_event.100.d: "经过多年艰苦卓绝的调查、起诉和体制改革，我们的反腐败斗争取得了几乎无人相信的里程碑式成就。曾经瘫痪政府的根深蒂固的贪污和裙带关系网络已被彻底瓦解。菲律宾正站在一个新时代的门槛上，这个新时代的标志不再是官员们窃取了多少，而是他们创造了多少。"
 PHI_corruption_event.100.a: "菲律宾的新篇章从今天开始。"
 PHI_corruption_event.200.t: "企业游说丑闻"
 PHI_corruption_event.200.d: "有传言称，一家大型企业集团利用秘密捐款影响了最近的立法。公众对此高度关注，反对派也嗅到了机会。"
 PHI_corruption_event.200.a: "别理它。我们不可能跟所有人开战。"
 PHI_corruption_event.200.b: "开展有限审计。"
 PHI_corruption_event.200.c: "公开谴责他们。"
 PHI_corruption_event.201.t: "幽灵计划"
 PHI_corruption_event.201.d: "一份议会报告发现，多个国家资助的基础设施项目杳无音讯：道路未修，建筑物未建成，工人也未雇用。资金不知所踪。"
 PHI_corruption_event.201.a: "把这件事掩盖过去。"
 PHI_corruption_event.201.b: "责怪地方官员。"
 PHI_corruption_event.201.c: "启动正式调查。"
 PHI_corruption_event.202.t: "税务泄露"
 PHI_corruption_event.202.d: "一名举报人提出证据，证明政府高级官员一直在通过假空壳公司网络逃税。这些文件已经在媒体上流传。"
 PHI_corruption_event.202.a: "悄悄处理这件事。"
 PHI_corruption_event.202.b: "杀鸡儆猴。"
 PHI_corruption_event.202.c: "以宽大处理换取合作。"
 PHI_corruption_event.203.t: "军事采购欺诈"
 PHI_corruption_event.203.d: "调查显示，一批原定运往菲律宾武装部队的武器货物下落不明。发票已签署，交货记录也已出具，但这些装备却不知所踪。"
 PHI_corruption_event.203.a: "驳回这些指控。"
 PHI_corruption_event.203.b: "惩罚一些替罪羊。"
 PHI_corruption_event.203.c: "展开全面调查。"
 PHI_corruption_event.204.t: "省级黑帮网络"
 PHI_corruption_event.204.d: "警方情报报告证实了许多当地居民早已知晓的情况：一些省政府和村委会官员正在积极与有组织犯罪集团勾结。保护费在各个层级都有人收取。"
 PHI_corruption_event.204.a: "无视它"
 PHI_corruption_event.204.b: "公开逮捕他们。"
 PHI_corruption_event.204.c: "用效忠派取代他们。"
 PHI_corruption_event.205.t: "外国回扣计划"
 PHI_corruption_event.205.d: "有证据表明，外国建筑和能源公司贿赂高级官员以获取利润丰厚的政府合同。相关文件一直指向首都。"
 PHI_corruption_event.205.a: "否认一切。"
 PHI_corruption_event.205.b: "悄悄地制裁他们。"
 PHI_corruption_event.205.c: "公开杀鸡儆猴。"
 PHI_corruption_event.206.t: "官僚腐败"
 PHI_corruption_event.206.d: "政府部门的小额腐败现象日益普遍。办事员期待收到信封，检查员需要被劝说，许可证除了官方费用外，还有额外的价格。这种小额腐败文化正在侵蚀公众对机构的信任。"
 PHI_corruption_event.206.a: "让他们享受一下小小的福利吧。"
 PHI_corruption_event.206.b: "推出象征性改革措施。"
 PHI_corruption_event.206.c: "重新调配几名官员。"
 PHI_corruption_number_01: "(1) 略微腐败"
 PHI_corruption_number_02: "(2) 轻微腐败"
 PHI_corruption_number_03: "(3) 适度腐败"
 PHI_corruption_number_04: "(4) 中度腐敗"
 PHI_corruption_number_05: "(5) 普遍腐败"
 PHI_corruption_number_06: "(6) 系统性腐败"
 PHI_corruption_number_07: "(7) 肆无忌惮的腐败"
 PHI_corruption_number_08: "(8) 猖獗腐败"
 PHI_corruption_number_09: "(9) 严重腐败"
 PHI_corruption_number_10: "(10)瘫痪性腐败"
 PHI_corruption_strength_exact_tt: "§Y腐败实力§!改变§R[?PHI_corruption_roll|0]§!（当前：§Y[?PHI_corruption_strength|0]§!）"
 PHI_edsa_dos_category: "第二次乙沙革命"
 PHI_edsa_dos_category_desc: "腐败指控动摇了政府的根基。弹劾审判使政府瘫痪。民众正在密切关注，并且越来越不耐烦。在倒计时结束前，做出§Y打开第二个信封§!的决定吧。"
 PHI_the_people_grow_disillusioned: "民众逐渐感到失望……"
 PHI_the_people_grow_disillusioned_desc: "参议院压制关键弹劾证据的投票激怒了公众。数十万人聚集在乙沙圣地。时间已经不多了。"
 PHI_open_the_second_envelope: "打开第二个信封"
 PHI_open_the_second_envelope_desc: "尽管参议院以11比10的投票结果否决了公开这些证据的动议，我们仍然有权允许公开这些备受争议的证据。这会在政治上损害我们的利益，但这或许是维护公众对政府的信任、防止政府垮台的唯一途径。"
 PHI_edsa_corruption_below_55_tt: "§Y腐败实力§!必须低于§Y55§!（当前：[?PHI.PHI_corruption_strength|Y0]）"
 PHI_edsa_stability_above_60_tt: "§Y稳定度§!必须高于§Y60%§!"
 PHI_edsa_dos_impeachment_atmosphere: "弹劾瘫痪"
 PHI_edsa_dos_impeachment_atmosphere_desc: "弹劾审判占据了所有新闻报道的头条。随着全国人民关注政府为生存而战，其政治资本正日渐流失。"
 PHI_edsa_dos_recovery_spirit: "乙沙事件后的稳定"
 PHI_edsa_dos_recovery_spirit_desc: "新政府在特殊情况下上台执政。改革承诺引发了公众谨慎的乐观情绪，但深刻的政治创伤依然存在。"
 PHI.1.t: "豪赌门丑闻爆发"
 PHI.1.d: "一名举报人挺身而出，指控总统约瑟夫·埃斯特拉达及其核心圈子成员收受数百万比索的非法赌博回扣。随着媒体报道揭露政府内部更深层次的腐败，公众的愤怒情绪迅速高涨。反对派人士、教会领袖和民间社会组织已开始组织示威游行，要求政府承担责任。随着全国范围内的紧张局势不断升级，政府现在必须决定如何应对日益加剧的动荡，否则将面临彻底垮台的风险。"
 PHI.1.a: "这可能会演变成更大的事件……"
 PHI.2.t: "终止这条线"
 PHI.2.d: "一切始于一场集体退庭。当参议院以11比10的投票结果决定压制关键的弹劾证据时，整个检方团队愤然退出法庭。数小时内，数十万菲律宾民众涌向乙沙圣地，举行大规模示威游行，重温1986年的人民力量革命。几天之内，菲律宾武装部队和菲律宾国家警察撤回了对政府的支持。内阁部长们集体辞职。首席大法官希拉里奥·戴维德主持了副总统格洛丽亚·马卡帕加尔·阿罗约的就职宣誓仪式。约瑟夫·埃斯特拉达在没有正式辞职的情况下离开了马拉卡南宫。新的篇章就此开启。"
 PHI.2.a: "人民已经发声"
 PHI.3.t: "格洛丽亚·马卡帕加尔·阿罗约就职典礼"
 PHI.3.d: "正如约瑟夫·埃斯特拉达卸任菲律宾总统后一样，埃斯特拉达的副总统、来自£PHI_conservatism 基督教穆斯林民主力量党的格洛丽亚·阿罗约宣誓就任菲律宾第14任总统。尽管有人认为阿罗约的就职不合法，但民众依然欢欣鼓舞，因为又一位腐败的领导人在革命和抗议的浪潮中倒台。虽然阿罗约政府需要时间恢复，但变革的曙光或许已经出现，因为阿罗约承诺会弥合前任总统留下的创伤。"
 PHI.3.a: "变革的气息或许即将到来。"
 PHI.4.t: "第二个信封被打开"
 PHI.4.d: "经过数日的政治动荡，参议院投票决定开启备受争议的“第二封信”。原本预计会成为弹劾审判决定性时刻的这一举动，却让全国上下短暂地松了一口气。随着证据进入司法程序，检方放弃了集体退场的计划，而再次发起“人民力量革命”的呼声也迅速消退。\n约瑟夫·埃斯特拉达总统挺过了当天的政治风暴，但他的政府仍然伤痕累累。腐败指控持续占据新闻头条，金融市场依然动荡不安，盟友和反对者都明白，弹劾之战远未结束。政府虽然避免了垮台，但其未来完全取决于审判结果。"
 PHI.4.a: "共和国目前仍然屹立不倒。"
 PHI.5.t: "棉兰老岛战役结束"
 PHI.5.d: "摩洛伊斯兰解放阵线的最后几个有组织的基地指挥部已被攻陷。该阵线残余势力仅剩少数逃亡指挥官，他们既没有领土，也没有收入来源，更没有能够协调行动的指挥系统。南部司令部已将收复的市镇的管辖权交还给民事当局，武装部队正在缩减至驻防规模。\n\n这场叛乱在没有签署任何文件的情况下结束了。至于引发这场叛乱的种种不满是否也随之消失，则是完全不同的另一个问题。"
 PHI.5.a: "棉兰老岛在我们的管辖之下。"
 PHI.6.t: "邦萨摩洛全面协议"
 PHI.6.d: "经过马来西亚多年的斡旋谈判，政府与摩洛伊斯兰解放阵线签署了一项全面和解协议。根据协议，摩洛伊斯兰解放阵线将在独立核查下解除其武器和战斗人员的武装。作为交换，穆斯林棉兰老自治区将让位于邦萨摩洛自治区，该自治区将拥有自己的议会、一定比例的国家财政收入以及对其内部事务的自主权。\n\n这一过渡将使马尼拉付出巨额资金，并使其失去对南部地区的部分主权。同时，这也结束了长达四十年的战争。"
 PHI.6.a: "和平是值得付出代价的。"
 PHI.7.t: "史上持续时间最长的叛乱已经结束"
 PHI.7.d: "新人民军的游击队阵线已被逐个地区瓦解。其地方委员会已被俘虏或驱散，其农村税收网络已被摧毁，而中央委员会的残余势力则流亡在荷兰，无法指挥任何事务。\n\n菲律宾共产党于1969年发动了旷日持久的人民战争。它挺过了马科斯独裁统治、四位总统以及此后所有试图进行的和平进程。但它终究无法挺过这一次。"
 PHI.7.a: "长达五十年的战争结束了。"
 PHI.8.t: "奥斯陆和解"
 PHI.8.d: "挪威政府主持了马尼拉与全国民主阵线之间的最后一轮谈判。该协议赦免了所有政治犯，并承诺政府将推行土地改革和农村投资计划。作为交换，新人民军将永久解散，全国民主阵线将通过合法政党参与权力斗争。\n\n双方强硬派都谴责这项协议。任何一方都没有足够的兵力在没有另一方的情况下继续推进。"
 PHI.8.a: "战争在谈判桌上结束。"
 PHI.9.t: "反世袭法通过"
 PHI.9.d: "出乎所有人意料的是，国会通过了宪法第二条第26款的授权立法。该条款规定，现任官员的二代以内血亲不得继任其职位，也不得在同一辖区内同时担任公职。\n\n那些世代输送省长、国会议员和总统的地方家族，如今面临着一张他们无法继承的选举版图。党内领导权向没有家族背景的候选人开放，许多人的政治生涯在总统签署任命书的那一刻就此终结。"
 PHI.9.a: "这些家族并不拥有共和国。"
 PHI_news.1.t: "埃斯特拉达在第二次人民力量革命中被推翻"
 PHI_news.1.d: "在持续数日的大规​​模示威游行和弹劾程序失败引发马尼拉政治危机后，总统约瑟夫·埃斯特拉达被迫下台。随着武装部队和菲律宾国家警察撤回对这位处境艰难的总统的支持，副总统格洛丽亚·马卡帕加尔·阿罗约宣誓就职，埃斯特拉达政府就此结束。亚洲各国政府对权力的和平交接表示欢迎，并密切关注菲律宾的政治走向。"
 PHI_news.1.a: "埃斯特拉达总统任期戏剧性地结束。"
 PHI_news.2.t: "埃斯特拉达渡过危机"
 PHI_news.2.d: "菲律宾总统约瑟夫·埃斯特拉达险些挺过其任期内看似最严重的政治危机。参议院投票通过将备受争议的“第二个信封”作为证据后，弹劾审判得以恢复，而非陷入政治混乱。\n这一决定暂时缓解了人们对大规模示威游行和再次爆发“人民力量”运动的担忧，使埃斯特拉达得以在司法程序进行期间继续留任。尽管获得了喘息之机，但腐败指控仍然给埃斯特拉达政府蒙上了一层阴影，令外国政府和金融市场对该国的政治前景感到担忧。"
 PHI_news.2.a: "埃斯特拉达继续掌权。"