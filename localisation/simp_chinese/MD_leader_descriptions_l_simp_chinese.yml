 DONALD_TRUMP_LEADER_DESC: "唐纳德·约翰·特朗普（1946年6月14日出生）是房地产开发商弗雷德里克·克里斯特·特朗普的儿子，亿万富翁。自1971年以来，特朗普凭借一百万美元的小额贷款，在特朗普集团旗下创立并扩张了众多企业。特朗普以恶毒的言论和从电视名人时代继承下来的冲动领导风格而闻名，他很快就树敌无数，朋友也不少。就任总统后，特朗普誓言要遏制非法移民、增加军费开支、实施保护主义关税，并坚定地将美国放在第一位。"
 MITT_ROMNEY_LEADER_DESC: "威拉德·米特·罗姆尼（生于1947年3月12日）是汽车业高管乔治·W·罗姆尼的四个孩子之一。作为一名虔诚的摩门教徒，他坚信自由放任的经济政策和保守的家庭价值观；罗姆尼誓言要利用自己多年的商业经验来削减政府浪费、增加军费开支，并取消对华尔街和大型企业的限制。"
 GEORGE_BUSH_LEADER_DESC: "乔治·沃克·布什（生于1946年7月6日）是乔治·赫伯特·沃克·布什的长子，乔治·赫伯特·沃克·布什于1989年至1993年担任美国第41任总统。在石油行业短暂工作后，布什进入政界，最终成为德克萨斯州州长。布什将自己描绘成一位富有同情心的保守派，誓言要减税、增加军费开支，并取消对企业部门不必要的温室气体排放限制。"
 MARCO_RUBIO_LEADER_DESC: ""
 BERNIE_SANDERS_LEADER_DESC: "伯纳德·桑德斯（1941年9月8日出生）是美国波兰工薪阶层移民的儿子。桑德斯在大学期间加入了青年社会主义联盟，在民权运动期间倡导白人和黑人的平等待遇。桑德斯后来成为佛蒙特州伯灵顿市市长，并最终当选为美国众议院议员和美国参议员。伯尼·桑德斯自称是民主社会主义者和进步人士，他发誓要减少军费开支、增强工会力量并建立全民医疗保健体系。"
