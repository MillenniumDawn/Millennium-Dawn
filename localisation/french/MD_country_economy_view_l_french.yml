 MARKET_PRICES_COMPOSITIES_TT: "Informations de prix pour les §Ycomposites avancés§! :\nRevenu actuel : §G$[?composite_exports|2]§!\nPrix min. : §G$ 1.42/unité§!\nPrix max. : §G$ 35.40/unité§!"
 total_civilian_factories_amount_tt: "Cette valeur représente le nombre total d'§Yindustries civiles§! dans notre pays"
 total_civilian_factories_amount_tt_delayed: "Ce bâtiment fournit à l'État l'industrie nécessaire à la production de biens civils ou à la construction de nouveaux bâtiments. Peut être converti en industrie militaire si besoin.\n\nFournit à l'État :\nNombre de base de travailleurs requis : §Y206K§!\nPIB de base par §Yindustrie civile§! : $§Y17,5 milliards§!\nConsommation d'énergie de base : §R-0.5§! GW\n\nImpact des lois, esprits nationaux et technologies sur la §Ymain-d'œuvre de tous les bâtiments§! : [?modifier@buildings_worker_requirement_modifier|-%0]\n\nTravailleurs requis par §Yindustrie civile§! : [?workers_per_civ_fac_display|2]K\n"
 total_military_factories_amount_tt: "Cette valeur représente le nombre total d'§Yindustries militaires§! dans notre pays"
 total_military_factories_amount_tt_delayed: "Ce bâtiment fournit à l'État l'industrie nécessaire à la production de nouvel équipement militaire. Peut être converti en industrie civile si besoin.\n\nFournit à l'État :\nNombre de base de travailleurs requis : §Y18.8K§!\nPIB de base par §Yindustrie militaire§! : $§Y1,5 milliard§!\nConsommation d'énergie de base : §R-0.5§! GW\n\nImpact des lois, esprits nationaux et technologies sur la §Ymain-d'œuvre de tous les bâtiments§! : [?modifier@buildings_worker_requirement_modifier|-%0]\n\nTravailleurs requis par §Yindustrie militaire§! : [?workers_per_mil_fac_display|2]K\n"
 total_naval_yard_amount_tt: "Cette valeur représente le nombre total de §Ychantiers navals§! dans notre pays"
 total_naval_yard_amount_tt_delayed: "Les §Ychantiers navals§! représentent la capacité d'un État à produire des navires militaires de toutes sortes, des §Ypatrouilleurs§! aux §Yconvois§!, §Ydestroyers§!, §Yporte-avions§! et plus encore.\n\nFournit à l'État :\nNombre de base de travailleurs requis : §Y18.8K§!\nPIB de base par §Ychantier naval§! : $§Y1,5 milliard§!\nConsommation d'énergie de base : §R-0.5§! GW\n\nImpact des lois, esprits nationaux et technologies sur la §Ymain-d'œuvre de tous les bâtiments§! : [?modifier@buildings_worker_requirement_modifier|-%0]\n\nTravailleurs requis par §Ychantier naval§! : [?workers_per_dockyard_display|2]K\n"
 total_offices_amount_tt: "Cette valeur représente le nombre total d'§Yindustries de services§! dans notre pays"
 total_offices_amount_tt_delayed: "Le §YSecteurs de bureaux§! des industries de services représente toutes les autres industries de l'économie au-delà de l'extraction et des industries lourdes. Ceux-ci incluent les services financiers, clients, informatiques, de vente au détail et bien plus encore.\n\nFournit à l'État:\nNombre de base de travailleurs nécessaires: §Y630K§!\nProduction du PIB de base par §YSecteurs de bureaux§!: §Y50$ milliards§!\nConsommation d'énergie de base: §R-0.25§! GW\n\nProductivité sur la §Ymain-d’œuvre du secteur de bureau§!: [?worker_requirement_productivity_multiplier_display|-%0]\nImpact du droit, des idées et de la technologie sur la §Ymain-d’œuvre dans tous les bâtiments§!: [?modifier@buildings_worker_requirement_modifier|-%0]\n\nTravailleurs recherchés dans le §Ysecteur des bureaux§!: [?workers_per_office_display]K\n"
 total_agriculture_district_amount_tt: "Cette valeur représente le nombre total de §YDistricts agricoles commercialisés§! dans notre nation."
 total_agriculture_district_amount_tt_delayed: "Les §Ydistricts d'agriculture commercialisée§! regroupent toute l'agriculture non vivrière de notre nation. Ils incluent l'agro-industrie, les terres arables, les silos à grains, les abattoirs et plus encore.\n\nFournit à l'État :\nNombre de base de travailleurs requis : §Y188K§!\nPIB de base par §Ydistrict d'agriculture commercialisée§! : $§Y25 milliards§!\nConsommation d'énergie de base : §R-0.10§! GW\n§YGain de carburant§! des États : 8\n§YRavitaillement local§! : 1.5%\n\nImpact des lois, esprits nationaux et technologies sur la §Ymain-d'œuvre de tous les bâtiments§! : [?modifier@buildings_worker_requirement_modifier|-%0]\nImpact des lois, esprits nationaux et technologies sur la §Ymain-d'œuvre des districts d'agriculture commercialisée§! : [?modifier@agriculture_district_worker_requirement_modifier|-%0]\n\nTravailleurs requis par §Ydistrict d'agriculture commercialisée§! : [?workers_per_agriculture_district_display|2]K\n"
 total_microchips_factories_amount_tt: "Cette valeur représente le nombre total d'§Yusines de microprocesseurs§! dans notre nation."
 total_microchips_factories_amount_tt_delayed: "Les §Yusines de puces§! représentent la production de semi-conducteurs et de petite électronique de notre nation.\n\nFournit à l'État :\nNombre de base de travailleurs requis : §Y37,5 k§!\nPIB de base par §Yusine de puces§! : $§Y32 milliards§!\nConsommation énergétique de base : §R-0,75§! GW\n\nImpact des lois, esprits nationaux et techs sur la §Ymain-d'œuvre de tous les bâtiments§! : [?modifier@buildings_worker_requirement_modifier|-%0]\n\nTravailleurs requis par §Yusine de puces§! : [?workers_per_microchip_plant_display|2]K\n\nNombre de base d'ouvriers requis : §Y37,5 k§!"
 total_composites_factories_amount_tt: "Cette valeur représente le nombre total d'§Yusines de composites§! dans notre nation."
 total_composites_factories_amount_tt_delayed: "Les §Yusines de composites§! représentent les installations de matériaux avancés, y compris les blindages céramiques, polymères renforcés et matériaux structurels haute performance.\n\nFournit à l'État :\nNombre de base de travailleurs requis : §Y37,5 k§!\nPIB de base par §Yusine de composites§! : $§Y28 milliards§!\nConsommation énergétique de base : §R-0,8§! GW\n\nImpact des lois, esprits nationaux et techs sur la §Ymain-d'œuvre de tous les bâtiments§! : [?modifier@buildings_worker_requirement_modifier|-%0]\n\nTravailleurs requis par §Yusine de composites§! : [?workers_per_composite_plant_display|2]K\n\nNombre de base d'ouvriers requis : §Y37,5 k§!"
 total_refineries_amount_tt: "Cette valeur représente le nombre total de §Yraffineries synthétiques§! dans notre nation."
 total_refineries_amount_tt_delayed: "Les §Yraffineries synthétiques§! représentent les installations industrielles produisant du caoutchouc synthétique et des matériaux chimiques essentiels à l'industrie et à la logistique.\n\nFournit à l'État :\nNombre de base de travailleurs requis : §Y184 k§!\nPIB de base par §Yraffinerie synthétique§! : $§Y10 milliards§!\nConsommation énergétique de base : §R-0,2§! GW\n\nImpact des lois, esprits nationaux et techs sur la §Ymain-d'œuvre de tous les bâtiments§! : [?modifier@buildings_worker_requirement_modifier|-%0]\n\nTravailleurs requis par §Yraffinerie synthétique§! : [?workers_per_synthetic_refinery_display|2]K\n\nNombre de base d'ouvriers requis : §Y184 k§!"
