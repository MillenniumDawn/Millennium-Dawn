 israel.151.t: "O Hamas toma Gaza!"
 israel.151.d: "O Hamas, após a revolta, tomou o poder na Faixa de Gaza. O governo moderado anterior está fugindo da região, e a questão do que acontecerá na Faixa de Gaza é mais urgente do que nunca. Além disso, o destino dos residentes israelenses não evacuados da Faixa de Gaza é importante."
