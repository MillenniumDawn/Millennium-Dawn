 MER_full_membership_step_one_desc: "\n\n§YЭто первый из трех этапов принятия решения о вступлении. Завершение всех трех этапов принятия решения о вступлении формализует полноправное членство.§!"
 MER_full_membership_step_two_desc: "\n\n§YЭто второй из трех этапов принятия решения о вступлении. Завершение всех трех этапов принятия решения о вступлении формализует полноправное членство.§!"
