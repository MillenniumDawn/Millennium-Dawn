 korea_russia.21.t: "La Russie a engagé nos travailleurs"
 korea_russia.21.d: "Nous avons signé un accord avec la Russie pour employer nos travailleurs en grand nombre afin d'aider dans les travaux de construction. Les conditions sont plus que favorables pour nous, car la partie russe paie des salaires généreux."
 korea_russia.21.a: "Super"
 korea_russia.22.t: "Exercices militaires avec la Corée du Nord"
 korea_russia.22.d: "L'état-major général nord-coréen propose d'organiser des exercices conjoints de nos forces armées pour démontrer la force de nos armées et tester la coopération de nos forces armées."
 korea_russia.22.a: "C'est une excellente idée"
 korea_russia.22.b: "Non"
 korea_russia.23.t: "Exercices militaires avec la Russie"
 korea_russia.23.d: "L'état-major général russe a accepté d'organiser des exercices conjoints des forces armées de nos pays."
 korea_russia.23.a: "Très bien !"
 korea_russia.24.t: "Exercices militaires avec la Russie"
 korea_russia.24.d: "L'état-major général russe a refusé d'organiser des exercices conjoints des forces armées de nos pays."
 korea_russia.24.a: "Triste"
 NKO_joint_exercises_sov_idea: "Exercices russo-nord-coréens"
 NKO_coop_russian_exerices: "§YProposer§! à [SOV.GetFlag]§Yla Russie§! des exercices conjoints"
 NKO_joint_exercises_nko_idea: "Exercices russo-nord-coréens"
 korea.50.t: "L'unification de la Corée a finalement été réalisée"
 korea.50.d: "Après des années de division, la Corée a finalement réalisé son unification, marquant un moment historique dans l'histoire mondiale. Le Nord et le Sud, autrefois séparés, se sont réunis, surmontant des décennies de différences politiques, économiques et culturelles pour former une seule nation unie. Cet événement monumental signale une nouvelle ère de paix, de coopération et de prospérité pour le peuple coréen, remodelant le paysage géopolitique de l'Asie de l'Est et du monde."
 korea.50.a: "Houurrrraaa !!!"
 korea.51.t: "Construire plus de fermes"
 korea.51.d: "La Corée ne peut être grande sans le peuple coréen. Nous devons nous concentrer sur la résolution de la famine aussi rapidement que possible."
 korea.51.a: "Agriculture à Pyongyang"
 korea.51.b: "Agriculture à Hwanghae"
 korea.51.c: "Agriculture à Chagang"
 korea.51.e: "Agriculture à Hamgyong"
 korea.52.t: "Moderniser nos centres d'approvisionnement déficients"
 korea.52.d: "Notre grand dirigeant a fourni des fonds pour construire davantage de voies ferrées et un centre d’approvisionnement et ils nous ont laissé le choix de nous concentrer soit sur nos ambitions en matière de zone économique, soit de préparer notre logistique à la guerre."
 korea.52.a: "Approvisionner le côté coréen"
 korea.52.b: "Approvisionner la future zone économique"
