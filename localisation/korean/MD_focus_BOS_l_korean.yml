 BOS_bnttmih_mio_trait_mlrs_262: "262mm 중형 로켓"
 BOS_bnttmih_mio_trait_gps_fire_control: "GPS 사격 통제"
 BOS_bnttmih_mio_trait_lightweight_chassis: "경량 차체"
