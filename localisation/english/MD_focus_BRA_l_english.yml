 BRA_thyssenkrupp_completed_trait: "[GER.GetFlag]§YThyssenKrupp Marine Systems§! has completed trait: §YModular Shipbuilding System§!"
 BRA_embraer_completed_trait: "[BRA.GetFlag]§YEmbraer Empresa Brasileira de Aeronáutica§! has completed trait: §YÁguas Azuis Joint Venture§!"

 BRA_decision_terrabras: "Found Terrabrás"
 BRA_decision_terrabras_desc: "Funding the §YSerra Verde§! mine ourselves has put rare earths in our own hands. A state company, §YTerrabrás§!, would run the Goiás deposits, process the ore at home, and sell it abroad on our terms."
 BRA_decision_vale_renationalization: "Renationalize Vale"
 BRA_vale_renationalized: "We have renationalized §YVale§!"
 BRA_decision_vale_renationalization_desc: "§YVale§!, once the state-owned Companhia Vale do Rio Doce, was privatized in 1997 and now exports much of our iron ore. Taking it back would put the Carajás mines and their railway under public control, but investors and foreign governments will call it a seizure."
 BRA_decision_engesa_refounding: "Re-found ENGESA"
 BRA_decision_engesa_refounding_desc: "§YENGESA§! of São José dos Campos built the Cascavel and Urutu armored vehicles that we sold abroad in the 1970s and 1980s. It went bankrupt in the early 1990s. A new company under the old name would rebuild our armor industry around the army's needs."
 BRA_decision_telebras_reactivation: "Reactivate Telebrás"
 BRA_decision_telebras_reactivation_desc: "§YTelebrás§! was the holding company of our state telephone system until that system was privatized in 1998. Reviving it would give the government its own operator to carry broadband to towns that private carriers skip."
 BRA_decision_cobra_computadores: "Fund Cobra Computadores"
 BRA_decision_cobra_computadores_desc: "§YCobra§! was our first state computer maker, founded in the 1970s. Funding it again would pair the chips from §YCEITEC§! with a Brazilian computer builder and keep research work at home."
 BRA_decision_manaus_electronics_incentives: "Extend the Manaus Electronics Incentives"
 BRA_decision_manaus_electronics_incentives_desc: "The §YManaus Free Trade Zone§! gives tax breaks to factories that assemble goods in Amazonas. §YGradiente§!, §YCCE§!, and §YSharp§! already make consumer electronics there. Extending the incentives would pull more assembly lines into the zone and tie them to local research."

 brazil.176.t: "Palocci Defends the Primary Surplus"
 brazil.176.d: "Finance Minister Antonio Palocci wants to keep the primary surplus high to calm lenders after the market panic that preceded the election. Union leaders and the left of the party say the money belongs in jobs and social programs."
 brazil.176.a: "Hold the surplus target"
 brazil.176.b: "Spend the money on jobs and social programs"
 brazil.177.t: "Landless Families Occupy Farms"
 brazil.177.d: "Families of the §YMST§! have occupied several large estates and demand to be settled on the land. Our party grew out of movements like theirs, but the landowners in Congress demand that we stop the occupations."
 brazil.177.a: "Speed up the land settlements"
 brazil.177.b: "Negotiate with the landowners"
 brazil.177.c: "Order the police to clear the farms"
 brazil.178.t: "The Free Trade Area of the Americas Summit"
 brazil.178.d: "The United States and its allies are pressing the summit to launch a free trade area across the hemisphere. Our farm exporters want the access, but our factories and unions fear the competition and say Mercosur must come first."
 brazil.178.a: "Join the push for the free trade area"
 brazil.178.b: "Stall it and put Mercosur first"
 brazil.179.t: "The Growth Acceleration Program"
 brazil.179.d: "The government has drawn up a large package of roads, ports, power plants, and housing. The works ministries are ready to start, but the construction firms that will win the contracts are asking who will choose them."
 brazil.179.a: "Run the program through state companies"
 brazil.179.b: "Steer the contracts to our allies"
 brazil.179.c: "Open every contract to public bidding"
 brazil.180.t: "The World Financial Crisis Reaches Brazil"
 brazil.180.d: "Credit abroad has frozen and the real is falling. Exporters are canceling orders, and car dealers report that sales have dropped. We must decide how to answer before the slump reaches the factories."
 brazil.180.a: "Cut taxes and push consumption"
 brazil.180.b: "Order the state banks to lend more"
 brazil.180.c: "Draw on the reserves to steady the real"
 brazil.181.t: "The Party Chooses Lula's Successor"
 brazil.181.d: "Our second term is ending, and the party must name its candidate for the next election. Dilma Rousseff, our chief of staff, is the favorite of the government's coalition. Many in the party would rather back someone who came up through its own ranks."
 brazil.181.a: "Back the chief of staff"
 brazil.181.b: "Back a candidate from the party's ranks"
 brazil.206.t: "Banespa Goes to Auction"
 brazil.206.d: "The federal government controls §YBanespa§!, the São Paulo state bank, and plans to sell it. Spain's §YSantander§! has bid for it. Bank workers and the left say a public bank should stay public."
 brazil.206.a: "Let the auction go ahead"
 brazil.206.b: "Block the sale and keep Banespa public"
 brazil.207.t: "Varig Cannot Pay Its Debts"
 brazil.207.d: "§YVarig§!, the airline that once carried our flag around the world, is in court protection and losing planes to its creditors. Its workers and pilots plead for public help, while rival carriers wait to pick up its routes."
 brazil.207.a: "Rescue Varig with public money"
 brazil.207.b: "Let it fail and let GOL buy the remains"
 brazil.207.c: "Merge it into a national carrier"
 BRA_idea_dividend_union_pact: "Pact With the Unions"
 BRA_idea_dividend_union_pact_desc: "The §YCUT§! and the other union federations have signed a social pact with the government. Strikes are rare, the shop floors are calm, and the foremen say the lines have never run so smoothly."
 BRA_idea_dividend_strike_wave: "A Wave of Strikes"
 BRA_idea_dividend_strike_wave_desc: "The unions no longer trust us. Metalworkers in the ABC region, bank clerks, and teachers have walked out in turn, and every week another sector joins them."
 BRA_idea_dividend_record_harvest: "A Record Harvest"
 BRA_idea_dividend_record_harvest_desc: "The farmers are content and the fields show it. Silos from Mato Grosso to Rio Grande do Sul are full, and rural tax receipts are the best in years."
 BRA_idea_dividend_rural_blockades: "Rural Road Blockades"
 BRA_idea_dividend_rural_blockades_desc: "Angry farmers have parked tractors and trucks across the federal highways. Grain rots at the roadside, and the road crews cannot get through."
 BRA_idea_dividend_simples_nacional_boom: "A Simples Nacional Boom"
 BRA_idea_dividend_simples_nacional_boom_desc: "Small firms are hiring and registering at record rates. Bakeries, workshops, and corner shops pay their taxes because the government has made it easy."
 BRA_idea_dividend_shuttered_storefronts: "Shuttered Storefronts"
 BRA_idea_dividend_shuttered_storefronts_desc: "Small business owners have given up on us. Shops are closing, credit is tight, and families are cutting back on what they buy."
 BRA_idea_dividend_national_champions: "National Champions"
 BRA_idea_dividend_national_champions_desc: "Our biggest industrial groups trust the government to back them. They are modernizing their plants and pushing output higher."
 BRA_idea_dividend_capital_flight: "Capital Flight"
 BRA_idea_dividend_capital_flight_desc: "The banks and industrial groups no longer trust our policy. Money is moving to accounts in Miami and Lisbon, tax receipts are falling, and foreign investors are asking for more in return."
 brazil.221.t: "The CUT Calls a May Day Rally"
 brazil.221.d: "The §YCUT§! has booked the Anhangabaú in São Paulo for the first of May. The union leaders are pleased with us and have made it clear that they would like to see us on the stage, or at least at the bargaining table."
 brazil.221.a: "Take the stage at the rally"
 brazil.221.b: "Offer a wage agreement"
 brazil.221.c: "Leave the unions to their rally"
 brazil.222.t: "The Ruralistas Come to Brasília"
 brazil.222.d: "The §Ybancada ruralista§! has filled the corridors of Congress with wide hats and polished boots. The harvest is in and the silos are full, and the farm lobby wants us to know what that is worth."
 brazil.222.a: "Extend the Plano Safra credit"
 brazil.222.b: "Back a soy export push"
 brazil.222.c: "Send the agriculture minister with a polite note"
 brazil.223.t: "Small Business Owners March on Brasília"
 brazil.223.d: "Bakers, mechanics, and shopkeepers have shut their doors for an afternoon to march on the Esplanada. They are not angry with us, but they remember how many forms a small shop must file every month."
 brazil.223.a: "Expand Simples Nacional"
 brazil.223.b: "Open a microcredit fund"
 brazil.223.c: "Tell them to wait for tax reform"
 brazil.224.t: "The Industrialists Lunch at FIESP"
 brazil.224.d: "The heads of São Paulo's largest industrial groups have invited us to lunch on the Avenida Paulista. Over coffee, they argue that a Brazilian champion should not have to face the world alone."
 brazil.224.a: "Open a BNDES credit line"
 brazil.224.b: "Raise the import tariffs"
 brazil.224.c: "Let the market decide"
 brazil.225.t: "Febraban Brings an Offer"
 brazil.225.d: "The §YFebraban§! bankers have asked for a meeting at the Planalto. They like our policy and are ready to help, but each favor they offer comes with a price tag in a different year."
 brazil.225.a: "Issue a sovereign bond"
 brazil.225.b: "Ask for interest-rate relief"
 brazil.225.c: "Decline the offer"
 brazil.226.t: "The Oil Men Ask for an Auction"
 brazil.226.d: "Executives from the oil sector have flown in from Macaé and Houston. They say the pre-salt fields are worth more than §YPetrobras§! can develop alone, and they would like a seat at the table."
 brazil.226.a: "Hold an ANP auction round"
 brazil.226.b: "Keep the blocks for Petrobras"
 brazil.226.c: "Tell the oil men to wait"
 brazil.227.t: "The Clube Militar Plans a Parade"
 brazil.227.d: "The §YClube Militar§! has asked us to preside over the Sete de Setembro parade. The generals are in a good mood, and a few of them have left a procurement wish list on the minister's desk."
 brazil.227.a: "Review the Sete de Setembro parade"
 brazil.227.b: "Fund a procurement program"
 brazil.227.c: "Remind the generals who commands"
 brazil.228.t: "The Arms Makers Ask for Contracts"
 brazil.228.d: "The directors of §YIMBEL§!, §YAvibras§!, and Embraer's defense arm are pleased with the government and would like to stay that way. They have brought a model of a new rocket launcher to the meeting, along with a list of export markets."
 brazil.228.a: "Sign a state R&D contract"
 brazil.228.b: "Open the arms export licenses"
 brazil.228.c: "Tell the arms makers to compete on price"
 brazil.229.t: "The Shipyards Want Orders"
 brazil.229.d: "The shipyards of Rio, Niterói, and Itajaí are busy and proud of it. The yard owners warn that a busy yard is a fragile thing, and they would like the navy or the merchant fleet to keep it that way."
 brazil.229.a: "Order a new frigate batch"
 brazil.229.b: "Subsidize the merchant fleet"
 brazil.229.c: "Tell the yards to find private customers"
 brazil.230.t: "The Estate Owners Call on Brasília"
 brazil.230.d: "The big estate owners have sent a delegation of lawyers to the capital. They are satisfied with how things stand and would like to keep it that way, preferably in writing."
 brazil.230.a: "Cut the rural property tax"
 brazil.230.b: "Pay for roads to the estates"
 brazil.230.c: "Remind them of the land reform pledge"
 brazil.231.t: "The Party Cadres Call a Congress"
 brazil.231.d: "The party cadres have called a congress, and the delegates are in a good mood. They have drafted resolutions on the plan, on political education, and on much else besides."
 brazil.231.a: "Launch a campaign for the five-year plan"
 brazil.231.b: "Let the cadres run political education"
 brazil.231.c: "Ignore the congress"
 BRA_idea_dividend_barracks_pride: "Barracks Pride"
 BRA_idea_dividend_barracks_pride_desc: "The officers feel the government listens to them. Units drill harder, reinforcements arrive on time, and the barracks gossip is friendly for once."
