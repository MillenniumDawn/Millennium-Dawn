 ENG_the_inner_circle_dm: "Le Cercle intérieur"
 ENG_the_inner_circle_dm_desc: "Le Cercle intérieur de la Reine rassemble la maison royale et les figures les plus fidèles de [ENG.GetNameDef], loyales pour soutenir l'autorité de la reine $ENG_elizabeth_queen$ et protéger les intérêts de la Couronne. Liés par le devoir et le prestige, ils rivalisent pour la proximité, les nominations et la confiance du souverain, sachant que l'influence à la cour peut façonner la politique bien au-delà du regard public. Leurs mains s'étendent aux décisions militaires, industrielles et politiques, guidant la Grande-Bretagne par le patronage, l'accès et une direction discrète."
