 module_naval_radar_jammer_1: "해군 레이더 재머 I"
 module_naval_radar_jammer_1_desc: "해군 레이더 재머는 적 센서에 잡음, 기만 신호, 허위 반사파를 주입하여 적의 탐지, 추적, 교전 능력을 저하시킵니다.\n\n§G설계 힌트: 레이더 재머는 수상 가시성을 낮추는 동시에 탐지, 체력, 대함 미사일, 어뢰 공격력을 향상시킵니다. 생존성이 필요한 가치 높은 전투함에 유용하지만 마이크로칩이 필요합니다.§!"
 module_naval_radar_jammer_2: "해군 레이더 재머 II"
 module_naval_radar_jammer_2_desc: "$module_naval_radar_jammer_1_desc$"
 module_naval_radar_jammer_3: "해군 레이더 재머 III"
 module_naval_radar_jammer_3_desc: "$module_naval_radar_jammer_1_desc$"
 module_naval_radar_jammer_4: "해군 레이더 재머 IV"
 module_naval_radar_jammer_4_desc: "$module_naval_radar_jammer_1_desc$"
 module_naval_radar_jammer_5: "해군 레이더 재머 V"
 module_naval_radar_jammer_5_desc: "$module_naval_radar_jammer_1_desc$"
 module_naval_mineclearing_drone: "소해 드론"
 module_naval_mineclearing_drone_desc: "무인 소해 드론은 원격 조종 또는 반자율 운반체를 사용하여 함대 앞의 기뢰를 탐지, 분류, 무력화함으로써 연안 작전에서 가장 위험한 임무를 승조원에게서 덜어 줍니다.\n\n§G설계 힌트: 소해 드론은 매우 높은 소해 능력과 소폭의 잠수함 탐지 보너스를 제공하며 기존 소해 장비보다 연료 소모가 적습니다. 전문 소해함에 적합하지만 IC 비용이 더 높고 마이크로칩이 필요합니다.§!"
 module_surface_diesel_power_1: "디젤 기관 I"
 module_surface_diesel_power_2: "디젤 기관 II"
 module_surface_diesel_power_3: "디젤 기관 III"
