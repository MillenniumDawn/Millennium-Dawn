 USA_iran_sanction_level_max_tt: "La severidad de las sanciones debe ser inferior a §Y5/5§! (actualmente [?USA_iran_sanction_level]/5)"
 USA_iran_sanction_level_min_tt: "La severidad de las sanciones debe ser de al menos §Y2/5§! (actualmente [?USA_iran_sanction_level]/5)"
 USA_cuba_policy_locked: "La política hacia Cuba ya está fijada"
 USA_left_WHO: "Se retiró de la Organización Mundial de la Salud"
 usa_economic_events.300.a: "Respaldar la fusión"
 usa_economic_events.300.b: "Mantener la independencia de HP"
 usa_economic_events.300.d: "La FTC ha cerrado su investigación sobre la propuesta de fusión entre Hewlett-Packard y Compaq sin emprender acciones legales. La campaña de delegación de voto de Walter Hewlett ha convertido la próxima votación de los accionistas en una contienda por el futuro de HP."
 usa_economic_events.300.t: "La disputa por delegación de voto de Compaq"
 usa_economic_events.301.a: "Completar la expansión de servicios"
 usa_economic_events.301.b: "Omitir el acuerdo y priorizar el hardware"
 usa_economic_events.301.d: "HP puede pagar 13 900 millones de dólares por Electronic Data Systems, combinando empresas de servicios con más de 38 000 millones de dólares en ingresos anuales y otorgando a HP una plataforma global para competir más allá del hardware. O bien puede conservar el dinero y seguir siendo una empresa de hardware."
 usa_economic_events.301.t: "La apuesta de servicios de EDS"
 usa_economic_events.302.a: "Girar hacia el software empresarial"
 usa_economic_events.302.b: "Volver a apostar por los dispositivos y los PC"
 usa_economic_events.302.d: "HP planea descontinuar los dispositivos con webOS, considerar alternativas para su negocio de ordenadores personales y adquirir la empresa de software empresarial Autonomy. La transformación propuesta cambiaría el rumbo de la compañía hacia el software de mayor margen, la nube y los servicios."
 usa_economic_events.302.t: "La ruptura estratégica de HP"
 usa_economic_events.303.a: "Completar la separación"
 usa_economic_events.303.b: "Mantener Hewlett-Packard unida"
 usa_economic_events.303.d: "Hewlett-Packard planea separarse en dos empresas que cotizarán en bolsa. HP Inc. mantendrá los sistemas personales y de impresión, mientras que Hewlett Packard Enterprise se hará cargo de la infraestructura, el software y los servicios."
 usa_economic_events.303.t: "Hewlett-Packard se divide"
 usa_economic_events.304.a: "Redoblar la apuesta por el plan independiente de HP"
 usa_economic_events.304.b: "Mantener la puerta abierta a la consolidación"
 usa_economic_events.304.d: "Xerox ha retirado su oferta pública de adquisición sobre HP Inc. y ha puesto fin a su campaña de delegación de voto, alegando las perturbaciones causadas por la pandemia de COVID-19. El colapso de la oferta hostil devuelve el control de la estrategia de HP a su junta directiva."
 usa_economic_events.304.t: "La oferta de Xerox se desmorona"
 usa_economic_events.310.a: "Michael Dell retoma el mando"
 usa_economic_events.310.b: "Instaurar una gestión profesional"
 usa_economic_events.310.d: "Kevin Rollins ha dimitido después de que el crecimiento se estancara y el modelo directo flaqueara, lo que ha provocado el regreso de Michael Dell como director ejecutivo. Este puede asumir el mando personal de la reestructuración o instaurar una gestión profesional para estabilizar la empresa."
 usa_economic_events.310.t: "El fundador regresa"
 usa_economic_events.311.a: "Construir una rama de servicios empresariales"
 usa_economic_events.311.b: "Seguir siendo una empresa de hardware"
 usa_economic_events.311.d: "Dell ha acordado adquirir Perot Systems, una empresa de servicios de tecnología de la información. El acuerdo dotará a Dell de una rama de servicios y una posición en soluciones empresariales, llevándola más allá del negocio de la venta de hardware."
 usa_economic_events.311.t: "La adquisición de Perot Systems"
 usa_economic_events.312.a: "Privatizar Dell junto con Silver Lake"
 usa_economic_events.312.b: "Seguir cotizando en bolsa y rindiendo cuentas"
 usa_economic_events.312.d: "Michael Dell y la firma de inversión Silver Lake han propuesto comprar la compañía y privatizarla. Abandonar los mercados públicos liberaría a Dell de la presión de los resultados trimestrales y daría margen al fundador para remodelarla, a costa de cargar el balance con una deuda enorme."
 usa_economic_events.312.t: "La decisión de privatización"
 usa_economic_events.313.a: "Adquirir EMC e integrar la cartera de productos"
 usa_economic_events.313.b: "Adquirir EMC y preservar su federación"
 usa_economic_events.313.d: "El 12 de octubre de 2015, Dell y EMC anunciaron una propuesta de adquisición por valor de 67 000 millones de dólares, la mayor operación tecnológica intentada hasta la fecha. Completarla convertiría a Dell en una empresa de infraestructuras de espectro completo y reuniría bajo un mismo techo a la federación de EMC, incluida su participación mayoritaria en VMware, pero también traería consigo una montaña de deudas."
 usa_economic_events.313.t: "La propuesta de adquisición de EMC"
 usa_economic_events.314.a: "Escindir VMware y reducir la deuda"
 usa_economic_events.314.b: "Mantener VMware integrada"
 usa_economic_events.314.d: "El 14 de abril de 2021, Dell propuso escindir su participación mayoritaria en VMware y utilizar el dividendo especial resultante para reducir su deuda hacia una calificación de grado de inversión. La independencia potenciará a ambas empresas, pero Dell perdería la joya de la corona del software que le aportó EMC."
 usa_economic_events.314.t: "La propuesta de escisión de VMware"
 usa_economic_events.315.a: "Construir servidores de IA a gran escala"
 usa_economic_events.315.b: "Buscar la IA de forma selectiva para proteger el margen"
 usa_economic_events.315.d: "La demanda de servidores optimizados para IA está aumentando drásticamente, y el negocio de infraestructuras de Dell se está llenando de pedidos de sistemas de alta densidad de GPU. Dell puede comprometerse a construir a gran escala o aprovechar la oportunidad de forma selectiva para proteger los márgenes de beneficio."
 usa_economic_events.315.t: "La expansión de servidores de IA"
 usa_economic_events.320.a: "Dejar que la revisión antimonopolio siga su curso"
 usa_economic_events.320.b: "Tomar medidas para romper la oferta"
 usa_economic_events.320.d: "Oracle ha lanzado una oferta pública de adquisición no solicitada de 5100 millones de dólares por PeopleSoft, días después de que PeopleSoft acordara comprar J.D. Edwards. PeopleSoft responde con una píldora venenosa y la garantía de reembolsar a los clientes si es adquirida, mientras el Departamento de Justicia sopesa una impugnación antimonopolio. Washington puede dejar que la revisión siga su curso o tomar medidas para romper la oferta."
 usa_economic_events.320.t: "El asedio a PeopleSoft"
 usa_economic_events.321.a: "Aprobar la adquisición"
 usa_economic_events.321.b: "Bloquearla por motivos de competencia en bases de datos"
 usa_economic_events.321.d: "El acuerdo con Sun situaría a Java, MySQL, Solaris y SPARC bajo el control de Oracle, otorgando a una sola empresa influencia sobre infraestructuras de software críticas y un negocio de hardware que nunca antes ha gestionado. La revisión depende de si la misma empresa debe poseer tanto la base de datos comercial líder como la de código abierto que compite con ella. Aprobarla consolida el ecosistema; bloquearla deja los activos de Sun en manos de otro comprador."
 usa_economic_events.321.t: "Sun Microsystems: La custodia del ecosistema"
 usa_economic_events.322.a: "Respaldar la demanda por derechos de autor"
 usa_economic_events.322.b: "Argumentar que las interfaces deben seguir siendo abiertas"
 usa_economic_events.322.d: "La demanda de la API de Java contra Google se ha convertido en una batalla decisiva sobre las interfaces de software. Una victoria para Oracle haría que las API fueran efectivamente protegibles por derechos de autor y extendería la presión sobre las licencias, mientras que la interpretación opuesta preservaría las normas de interoperabilidad. Washington puede intervenir respaldando la demanda de derechos de autor o argumentar que las interfaces deben seguir siendo abiertas."
 usa_economic_events.322.t: "Oracle contra Google"
 usa_economic_events.323.a: "Abrir la contratación pública en la nube federal a un segundo proveedor"
 usa_economic_events.323.b: "Dejar la adjudicación en manos de las empresas tradicionales"
 usa_economic_events.323.d: "Oracle está impugnando la adjudicación del contrato federal en la nube frente a las empresas tradicionales de hiperescala que cuentan con una distribución arraigada, el respaldo de los desarrolladores y una gran escala de capital. Dirigir la infraestructura federal hacia un segundo proveedor le reportaría relevancia a Oracle a un coste muy elevado para ella, mientras que dejar la adjudicación donde está mantiene los márgenes locales que ya obtiene. El departamento de contratación decide cuál elegir."
 usa_economic_events.323.t: "Giro en la infraestructura en la nube"
 usa_economic_events.324.a: "Aprobar la adquisición"
 usa_economic_events.324.b: "Bloquearla por motivos de protección de datos de los pacientes"
 usa_economic_events.324.d: "El acuerdo con Cerner otorgaría a Oracle una posición de liderazgo en historiales médicos electrónicos y sistemas de información hospitalaria, extendiendo su alcance empresarial a uno de los sectores más regulados y sensibles a los datos. La revisión se centra en la concentración de datos de pacientes y en si los hospitales ganan o pierden ante una mayor dependencia del proveedor. Aprobarla consolida la tecnología de la información sanitaria; bloquearla mantiene a Oracle en su negocio principal de bases de datos."
 usa_economic_events.324.t: "Adquisición de Cerner: Dominio de la TI sanitaria"
 usa_economic_events.330.t: "El compromiso con CUDA"
 usa_economic_events.330.d: "NVIDIA propone gastar años y una gran cantidad de dinero en hacer que sus procesadores gráficos sean programables para tareas que no sean de gráficos. Ningún cliente ha solicitado esto. La alternativa es destinar a los mismos ingenieros a los productos que ya se venden."
 usa_economic_events.330.a: "Financiar la plataforma de computación de propósito general"
 usa_economic_events.330.b: "Mantener a los ingenieros enfocados en los gráficos"
 usa_economic_events.331.t: "La señal del aprendizaje profundo"
 usa_economic_events.331.d: "Un grupo de investigadores ha ganado un concurso de reconocimiento de imágenes por un margen enorme utilizando tarjetas gráficas para videojuegos de Nvidia en lugar de hardware específico para esa tarea. Es un único resultado en una competición académica, pero sugiere la existencia de un mercado que aún no existe."
 usa_economic_events.331.a: "Construir para el mercado del aprendizaje automático"
 usa_economic_events.331.b: "Esperar a un mercado que ya tenga clientes"
 usa_economic_events.332.t: "El giro hacia los centros de datos"
 usa_economic_events.332.d: "Dar servicio a los centros de datos implica un nuevo silicio, nuevas interconexiones, nuevos sistemas y una organización de ventas orientada a los operadores de sistemas en lugar de a los jugadores. Esto convertiría a Nvidia en una empresa totalmente diferente. Mantenerse con GeForce es más barato y la demanda ya está demostrada."
 usa_economic_events.332.a: "Reestructurar la empresa en torno al centro de datos"
 usa_economic_events.332.b: "Permanecer en el mercado de consumo masivo"
 usa_economic_events.333.t: "Comienzan los controles de exportación"
 usa_economic_events.333.d: "Washington restringe la venta en el extranjero de los aceleradores más potentes de Nvidia. Cumplir con la norma cuesta perder uno de sus mercados más grandes, pero asegura su posición ante el gobierno que dicta las reglas. Diseñar soluciones alternativas esquivando los límites permitidos mantiene los ingresos pero invita a la próxima restricción."
 usa_economic_events.333.a: "Cumplir y alinearse con los controles"
 usa_economic_events.333.b: "Diseñar soluciones eludiendo los límites establecidos"
 usa_economic_events.334.t: "La expansión de aceleradores"
 usa_economic_events.334.d: "La demanda de aceleradores de entrenamiento de Nvidia supera todo aquello para lo que la cadena de suministro fue construida. Comprometerse con ese volumen implica pagar por la capacidad industrial con años de antelación respecto a los pedidos. Retener la producción protege el balance de la empresa y le cede el desabastecimiento a un competidor."
 usa_economic_events.334.a: "Comprometerse con el volumen y adquirir la capacidad"
 usa_economic_events.334.b: "Mantener la disciplina de suministro y proteger el margen"
 usa_economic_events.335.t: "El pedido de aceleradores"
 usa_economic_events.335.d: "Dos décadas de Nvidia apostando por el silicio programable han dictaminado quién suministra la potencia de cálculo del mundo y bajo qué condiciones. Lo que la industria estadounidense puede entrenar, y a quién se lo puede vender, ahora se rige por eso."
 usa_economic_events.335.a: "Una plataforma que ningún competidor puede desalojar"
 usa_economic_events.335.b: "Un ecosistema de computación soberano"
 usa_economic_events.335.c: "Una comunidad de aceleradores abiertos"
 usa_economic_events.335.e: "Un proveedor de componentes genéricos en declive"
 USA_nvidia_cuda_fortress: "La fortaleza de aceleradores"
 USA_nvidia_cuda_fortress_desc: "El hardware es reemplazable, pero el software escrito para él no lo es. Dos décadas de herramientas, librerías e ingenieros formados convierten a la plataforma en la opción por defecto, y cualquier rival tiene que ser mejor por un margen lo suficientemente grande como para justificar reescribirlo todo."
 USA_nvidia_sovereign_compute_stack: "Ecosistema de computación soberano"
 USA_nvidia_sovereign_compute_stack_desc: "Los aceleradores se construyeron a gran escala sin el foso protector de software que los hacía inexpugnables. La capacidad industrial es estadounidense y abundante, y las condiciones de acceso se establecen en Washington en lugar de decidirse por quien escriba el núcleo de procesamiento más rápido."
 USA_nvidia_open_accelerator_commonwealth: "Comunidad de aceleradores abiertos"
 USA_nvidia_open_accelerator_commonwealth_desc: "La computación acelerada se desarrolló como una infraestructura compartida en lugar de ser propiedad de una sola empresa. Los márgenes de beneficio son más estrechos de lo que obtendría un monopolio, pero el número de personas que construyen sobre ella es mucho mayor."
 USA_nvidia_commodity_decline: "Silicio genérico"
 USA_nvidia_commodity_decline_desc: "La apuesta por el silicio programable nunca se asumió del todo, y la computación acelerada se definió en otra parte. El hardware gráfico estadounidense se sigue vendiendo, pero al precio que rinde un componente genérico común."
 usa_economic_events.340.t: "IM Flash"
 usa_economic_events.340.d: "Una empresa conjunta introduciría a Micron en las memorias flash junto a un socio mucho más grande, compartiendo las fábricas y el riesgo de un producto que nunca antes ha fabricado. Mantenerse con la memoria dinámica significa ser muy bueno en un único tipo de componente básico, dentro de un negocio que castiga duramente a cualquiera que dependa de uno solo."
 usa_economic_events.340.a: "Entrar en el sector de las memorias flash mediante la empresa conjunta"
 usa_economic_events.340.b: "Mantenerse con la memoria dinámica"
 usa_economic_events.341.t: "El invierno de las memorias"
 usa_economic_events.341.d: "Los precios de las memorias han caído por debajo del coste de fabricación y los competidores están cerrando fábricas. Adquirir capacidad de producción ahora cuesta un dinero que Micron ya está perdiendo, pero nunca volverá a ser tan barato. Recortar el gasto protege el balance económico y concede la recuperación del mercado a quien sobreviva con mayor capacidad."
 usa_economic_events.341.a: "Adquirir capacidad industrial mientras sea barata"
 usa_economic_events.341.b: "Recortar gastos y sobrevivir al invierno"
 usa_economic_events.342.t: "La red de Elpida"
 usa_economic_events.342.d: "Elpida, en bancarrota, puede ser adquirida por Micron saliendo de su proceso de administración judicial, lo que aportaría fábricas en Hiroshima y Taiwán junto con una lista de clientes que incluye a los mayores fabricantes de teléfonos. También aporta una fuerza laboral, un acuerdo de acreedores y una década de integración por delante."
 usa_economic_events.342.a: "Comprar al competidor en bancarrota"
 usa_economic_events.342.b: "Construir la capacidad de producción nosotros mismos"
 usa_economic_events.343.t: "La decisión de Lehi"
 usa_economic_events.343.d: "La fábrica de Micron en Lehi, Utah, se construyó para 3D XPoint, una tecnología de memoria que el mercado no deseaba, y reconvertirla en algo que se venda costaría más de lo que vale. Texas Instruments la comprará. Conservarla implica encontrar una utilidad para una planta diseñada en torno a un producto muerto."
 usa_economic_events.343.a: "Vender la fábrica de Utah"
 usa_economic_events.343.b: "Conservarla y encontrarle un propósito"
 usa_economic_events.344.t: "La restricción de China"
 usa_economic_events.344.d: "Pekín ha vetado los productos de Micron en la infraestructura china, llevándose consigo una parte sustancial de los ingresos. Construir y vender en otros lugares costará años y margen de beneficio. Apelar la decisión mantiene el mercado en juego y deja la fortuna de la empresa ligada a un gobierno que ya ha dictado sentencia."
 usa_economic_events.344.a: "Diversificar fuera del mercado chino"
 usa_economic_events.344.b: "Apelar el dictamen y retener el mercado"
 usa_economic_events.345.t: "El arsenal de las memorias"
 usa_economic_events.345.d: "Dos décadas de construcción a través de las crisis financieras han definido lo que es Micron, lo que es la fabricación de memoria estadounidense y quién puede quedarse sin acceso a ella."
 usa_economic_events.345.a: "Un arsenal de memorias estadounidense"
 usa_economic_events.345.b: "Una federación global de memorias"
 usa_economic_events.345.c: "Un futuro no volátil"
 usa_economic_events.345.e: "Disciplina sobre escala"
 USA_micron_american_memory_arsenal: "Arsenal de memorias estadounidense"
 USA_micron_american_memory_arsenal_desc: "La memoria se fabrica en plantas estadounidenses para clientes a los que un gobierno extranjero no puede llegar, y la capacidad industrial se adquirió en los años en que todos los demás cerraban fábricas. Los chips cuestan más y nadie más decide quién los recibe."
 USA_micron_global_memory_federation: "Federación global de memorias"
 USA_micron_global_memory_federation_desc: "Fábricas en tres países bajo un mismo propietario, ensambladas a partir de competidores que no pudieron sobrevivir a sus propias crisis financieras. La escala es toda la ventaja, y es una ventaja considerable."
 USA_micron_nonvolatile_future: "Futuro no volátil"
 USA_micron_nonvolatile_future_desc: "La empresa apostó por la memoria que conserva su contenido cuando se apaga la corriente, y el mercado llegó justo donde la estaba esperando. La investigación va por delante de la fabricación en lugar de ir por detrás."
 USA_micron_memory_scale_discipline: "Disciplina de escala"
 USA_micron_memory_scale_discipline_desc: "La capacidad de producción nunca se adquirió en la cima de un ciclo ni se vendió en el fondo del mismo. Micron es más pequeña de lo que podría haber sido y nunca ha tenido que ser rescatada."
 usa_economic_events.350.t: "OMAP y el futuro móvil"
 usa_economic_events.350.d: "Los procesadores de aplicaciones para teléfonos móviles son el mercado de mayor crecimiento en los semiconductores, y Texas Instruments tiene un papel creíble en él. Ganar allí significa competir con todos. La alternativa es el negocio analógico del que nadie escribe, donde las piezas permanecen en producción durante treinta años."
 usa_economic_events.350.a: "Competir por el mercado de procesadores móviles"
 usa_economic_events.350.b: "Invertir el dinero en tecnología analógica"
 usa_economic_events.351.t: "Kilby Labs"
 usa_economic_events.351.d: "Texas Instruments puede nombrar un laboratorio en honor a Jack Kilby y no darle una hoja de ruta de productos ni objetivos trimestrales, permitiendo que los ingenieros trabajen en problemas que podrían dar frutos en una década o no dar ninguno. Cada dólar invertido allí es un dólar que no se gasta en las piezas que los clientes ya han pedido."
 usa_economic_events.351.a: "Financiar el laboratorio de investigación"
 usa_economic_events.351.b: "Mantener a los ingenieros enfocados en los productos listos para envío"
 usa_economic_events.352.t: "La cartera de productos de National Semiconductor"
 usa_economic_events.352.d: "National Semiconductor puede ser adquirida por completo, duplicando aproximadamente el catálogo analógico de Texas Instruments y la fuerza de ventas que lo distribuye. Es el cheque más grande que la empresa ha firmado jamás por un negocio cuyas piezas individuales se venden por menos de un dólar."
 usa_economic_events.352.a: "Comprar el catálogo analógico"
 usa_economic_events.352.b: "Desarrollar el catálogo nosotros mismos"
 usa_economic_events.353.t: "OMAP abandona la guerra de los teléfonos"
 usa_economic_events.353.d: "OMAP solo se puede ganar gastando más que las empresas que diseñan sus propios chips para sus propios teléfonos, y Texas Instruments no tiene la intención de intentarlo. Salirse libera a los ingenieros y a las fábricas para realizar trabajos integrados y de automoción. Quedarse significa otro ciclo compitiendo por contratos de diseño que se llevan quienes aplican los descuentos más agresivos."
 usa_economic_events.353.a: "Abandonar el mercado de los teléfonos móviles"
 usa_economic_events.353.b: "Luchar por otro ciclo de producto"
 usa_economic_events.354.t: "La conversión de Lehi"
 usa_economic_events.354.d_available: "La fábrica de Micron en Lehi, Utah, está a la venta y su propietario no la necesita. Convertirla para la producción analógica de Texas Instruments añadiría capacidad industrial años antes de lo que costaría construir una nueva planta, en unas instalaciones que ya están equipadas y cuentan con personal. La conversión no es sencilla y es mucho más barata que la alternativa."
 usa_economic_events.354.d_greenfield: "No hay ninguna fábrica existente disponible en condiciones que valga la pena aceptar, por lo que la nueva capacidad analógica de Texas Instruments requiere comenzar las obras desde cero. Construir desde la nada cuesta años y una gran cantidad de dinero, pero la planta será exactamente aquello para lo que fue diseñada."
 usa_economic_events.354.a: "Comprar la fábrica de Utah y convertirla"
 usa_economic_events.354.b: "Construir una nueva capacidad de producción desde cero"
 usa_economic_events.355.t: "Todo conectado, discretamente"
 usa_economic_events.355.d: "Un cuarto de siglo eligiendo el negocio menos glamuroso ha determinado lo que es Texas Instruments y lo que es la fabricación analógica estadounidense con ella. Las piezas están en todas partes y casi nadie fuera de la industria puede nombrar a la empresa que las fabrica."
 usa_economic_events.355.a: "Hegemonía analógica"
 usa_economic_events.355.b: "Un arsenal de silicio"
 usa_economic_events.355.c: "Una fundición fundacional"
 usa_economic_events.355.e: "Todo conectado, discretamente"
 USA_ti_analog_hegemony: "Hegemonía analógica"
 USA_ti_analog_hegemony_desc: "El catálogo analógico más grande del mundo, construido al abandonar los negocios por los que todos los demás se peleaban. Las piezas permanecen en producción durante décadas y los clientes que las integraron en sus diseños no pueden reemplazarlas fácilmente."
 USA_ti_silicon_arsenal: "Arsenal de silicio"
 USA_ti_silicon_arsenal_desc: "Fábricas estadounidenses que producen las piezas menos glamurosas que todo lo demás necesita, de propiedad total en lugar de contratadas en el extranjero. Las obleas no son avanzadas y no hay escasez de ellas."
 USA_ti_foundational_foundry: "Fundición fundacional"
 USA_ti_foundational_foundry_desc: "Capacidad industrial adquirida y convertida en lugar de construida, lo que puso a las plantas en producción años antes de lo que habría permitido un programa desde cero. La producción es silicio de nodos maduros y el mundo funciona gracias a él."
 USA_ti_everything_connected: "Todo conectado"
 USA_ti_everything_connected_desc: "Sensores, convertidores y controladores en cada máquina que mide cualquier cosa, vendidos a decenas de miles de clientes, ninguno de los cuales importa de forma individual. Por lo tanto, no hay ningún contrato único cuya pérdida se pueda llegar a sentir."
 usa_economic_events.360.t: "La compra de la consultora"
 usa_economic_events.360.d: "Una gran firma de contabilidad está vendiendo su rama de consultoría, y comprarla colocaría a treinta mil consultores dentro de IBM de la noche a la mañana. La empresa ganaría más asesorando a los clientes sobre qué construir que construyéndolo ellos mismos. Rechazar la oferta mantiene a IBM como un fabricante que también vende servicios."
 usa_economic_events.360.a: "Comprar la consultora y liderar con los servicios"
 usa_economic_events.360.b: "Seguir siendo un fabricante que vende servicios"
 usa_economic_events.361.t: "El patrimonio de los clientes"
 usa_economic_events.361.d: "El negocio de los ordenadores personales que IBM inventó ahora no genera casi nada y compite en precio con empresas que no tienen investigación que financiar. Un comprador está dispuesto a adquirirlo, junto con la marca y las fábricas. Conservarlo significa defender un producto genérico frente a empresas construidas específicamente para fabricar productos genéricos."
 usa_economic_events.361.a: "Vender el negocio de ordenadores personales"
 usa_economic_events.361.b: "Seguir construyendo ordenadores personales"
 usa_economic_events.362.t: "Watson entra en escena"
 usa_economic_events.362.d: "Watson de IBM ha vencido a los mejores jugadores humanos en Jeopardy en la televisión nacional, e IBM Research quiere convertirlo en un negocio. Nadie sabe qué comprarían los clientes o cuánto costaría construirlo. La alternativa es integrar este trabajo en los productos analíticos que ya se venden con éxito."
 usa_economic_events.362.a: "Construir un negocio en torno al sistema"
 usa_economic_events.362.b: "Integrar el trabajo en la analítica existente"
 usa_economic_events.363.t: "La nube híbrida abierta"
 usa_economic_events.363.d: "IBM no puede superar en construcción a los gigantes de la hiperescala, pero puede poseer la capa informática que se ejecuta a través de todos ellos. Comprar al mayor proveedor empresarial de código abierto costaría más que cualquier adquisición en la historia de la empresa. Construir la misma posición internamente es más barato pero más lento, y los clientes podrían haber desaparecido para entonces."
 usa_economic_events.363.a: "Comprar al proveedor de código abierto"
 usa_economic_events.363.b: "Construir la plataforma en la nube nosotros mismos"
 usa_economic_events.364.t: "El imperio de servicios se divide"
 usa_economic_events.364.d: "El negocio de infraestructura gestionada de IBM representa la mayor parte de la plantilla y nada del crecimiento, y compite por el capital con todo lo que la empresa preferiría financiar. Escindirlo libera a ambas mitades para ser juzgadas bajo sus propios términos. Mantenerlo conserva los ingresos y las relaciones con los clientes que conllevan."
 usa_economic_events.364.a: "Escindir el negocio de servicios gestionados"
 usa_economic_events.364.b: "Mantener a la empresa unida"
 usa_economic_events.365.t: "La apuesta cuántica"
 usa_economic_events.365.d: "Un cuarto de siglo vendiendo negocios, comprando otros y apostando por máquinas que nadie había pedido ha definido lo que es IBM y sobre qué se ejecuta la informática empresarial estadounidense."
 usa_economic_events.365.a: "Un volante de inercia híbrido y abierto"
 usa_economic_events.365.b: "Un ministerio de sistemas estadounidense"
 usa_economic_events.365.c: "El mainframe fortificado"
 usa_economic_events.365.e: "Big Blue, intacto"
 USA_ibm_open_hybrid_flywheel: "Volante de inercia híbrido abierto"
 USA_ibm_open_hybrid_flywheel_desc: "IBM dejó de intentar ser una nube y se convirtió en la capa que se ejecuta a través de todas ellas. El software es abierto, la consultoría lo vende y los clientes que se estandarizan con él son difíciles de trasladar."
 USA_ibm_american_systems_ministry: "Ministerio de sistemas estadounidense"
 USA_ibm_american_systems_ministry_desc: "Los bancos, las aseguradoras y las agencias federales funcionan con máquinas y contratos que IBM mantiene desde hace décadas, y conservó la rama de servicios que los mantiene. El crecimiento es lento y no se permite que nada falle."
 USA_ibm_fortress_z: "El mainframe fortificado"
 USA_ibm_fortress_z_desc: "Los negocios de productos genéricos se marcharon y el mainframe se quedó, soportando las cargas de trabajo que nadie se arriesgará a migrar. Cada transacción que no debe perderse pasa por una máquina que solo una empresa sigue construyendo."
 USA_ibm_big_blue_intact: "Big Blue, intacto"
 USA_ibm_big_blue_intact_desc: "La empresa no vendió nada ni dividió nada, y sigue fabricando hardware, software y formando a las personas que los instalan. Es más lenta que cualquiera de sus rivales especializados y nunca ha dependido de ninguno de ellos."
 usa_economic_events.370.t: "El volante de inercia"
 usa_economic_events.370.d: "Apple obligó a su fundador a marcharse en 1985 y lo recuperó en 1997, a meses de la insolvencia; desde entonces, él ha recortado la línea de productos a un puñado de máquinas que poseen cerca de cuatro puntos del mercado y se venden casi en su totalidad a través de los estantes de otras empresas. Su próximo movimiento son las tiendas físicas: dos abiertas y contratos de arrendamiento firmados para docenas más. La prensa especializada es casi unánime en que fracasará, ya que Gateway está cerrando sus propias tiendas esta primavera y el consejo habitual para un fabricante de nicho es recortar los costes comerciales en lugar de firmar contratos de alquiler en centros comerciales en la cima del ciclo de alquileres. El argumento dentro de la empresa no es vender más Macintoshes; es que poseer la fachada comercial decide lo que se podrá poner en los estantes más adelante."
 usa_economic_events.370.a: "Construir el volante de la tienda y el dispositivo"
 usa_economic_events.370.b: "Mantener al Macintosh en primer lugar"
 usa_economic_events.371.t: "Llega el iPhone"
 usa_economic_events.371.d: "Apple ha construido un teléfono que en realidad es un ordenador, y ninguna operadora ha permitido jamás que un fabricante controle lo que se ejecuta en él. Un único socio exclusivo aceptará esos términos a cambio de la exclusividad. Negarse significa lanzarlo a todas las redes a la vez y permitir que las operadoras se queden con el software."
 usa_economic_events.371.a: "Lanzar a través de una sola operadora bajo nuestras condiciones"
 usa_economic_events.371.b: "Construir una plataforma móvil abierta"
 usa_economic_events.372.t: "Se abre la App Store"
 usa_economic_events.372.d: "El software de terceros va a llegar a los teléfonos de una forma u otra. Apple puede ser la única puerta de acceso, revisando cada aplicación y llevándose una parte de cada venta, o puede permitir que los desarrolladores lleguen directamente a los usuarios y dejar la reputación de la plataforma fuera de su control directo."
 usa_economic_events.372.a: "Ser la única puerta"
 usa_economic_events.372.b: "Establecer una comunidad de desarrolladores"
 usa_economic_events.373.t: "Los servicios se convierten en una estrategia"
 usa_economic_events.373.d: "La tienda virtual, la música, la nube y los pagos generan ahora más ingresos entre sí de lo que la mayoría de las empresas ganan en total, y nada de ello requiere enviar un nuevo dispositivo físico. Apostar por ello significa que Apple empezará a ser valorada como un negocio de suscripción. Rechazarlo mantiene la disciplina que dicta que el hardware es el producto."
 usa_economic_events.373.a: "Construir el volante de inercia de los servicios"
 usa_economic_events.373.b: "Restaurar la disciplina del hardware"
 usa_economic_events.374.t: "Apple Silicon"
 usa_economic_events.374.d: "Apple ya diseña los procesadores de sus teléfonos, pero sus ordenadores siguen utilizando los de otra empresa. Migrarlos implica otra década de transición para los desarrolladores y el fin de cualquier dependencia de la hoja de ruta de un proveedor externo. Quedarse como estamos mantiene la compatibilidad y deja el sustrato en manos ajenas."
 usa_economic_events.374.a: "Migrar el Mac a nuestro propio silicio"
 usa_economic_events.374.b: "Priorizar la compatibilidad antes que el control"
 usa_economic_events.375.t: "Lo que Cupertino dictaminó"
 usa_economic_events.375.d: "Un cuarto de siglo de Apple decidiendo qué parte del ecosistema poseer ha definido lo que es la informática de consumo estadounidense, quién tiene permitido construir sobre ella y con los chips de quién funciona."
 usa_economic_events.375.a: "Un estado informático privado"
 usa_economic_events.375.b: "Una república de dispositivos integrados"
 usa_economic_events.375.c: "Una red de silicio resiliente"
 usa_economic_events.375.e: "Una plataforma entre plataformas"
 USA_apple_private_computing_state: "Estado informático privado"
 USA_apple_private_computing_state_desc: "Los chips, el sistema operativo, la tienda virtual y los servidores que responden por todos ellos pertenecen a una sola empresa. Nada entra sin permiso y nada sale sin ser advertido. Es la plataforma de consumo más privada del mundo y la menos fiscalizable."
 USA_apple_integrated_device_republic: "República de dispositivos integrados"
 USA_apple_integrated_device_republic_desc: "Apple decide cuál es la experiencia de usuario y adquiere el silicio que la hace posible. La integración es real en todas partes excepto en la capa inferior, donde otra empresa establece la hoja de ruta estratégica."
 USA_apple_resilient_silicon_network: "Red de silicio resiliente"
 USA_apple_resilient_silicon_network_desc: "Los procesadores se diseñan en California y la plataforma que se alza sobre ellos se abrió a cualquiera que quisiera construir allí. Apple renunció a la taquilla de peaje y conservó los cimientos."
 USA_apple_platform_among_platforms: "Una plataforma entre plataformas"
 USA_apple_platform_among_platforms_desc: "El software es abierto, los chips se compran en el mercado y Apple compite basándose en si el producto es mejor, en lugar de en si existe una alternativa. Por lo general, la hay."
 usa_economic_events.380.t: "Capital sin control"
 usa_economic_events.380.d: "Google va a salir a bolsa, y Larry Page y Sergey Brin quieren dos clases de acciones (una que otorgue diez votos frente al voto único de la otra) de modo que poseer una minoría de la empresa siga significando decidir qué hace. Los asesores de gobernanza son unánimes en que esta es precisamente la forma en que las juntas directivas dejan de rendir cuentas, y la carta de los fundadores a los accionistas les responde nombrando a las familias de los periódicos que utilizaron la misma estructura para financiar trabajos que nadie habría aprobado trimestralmente. Vender mediante subasta holandesa en lugar de a través de los bancos agrava la ofensa. El precio inicial será más bajo por ello, pero la década posterior será completamente suya para gastar."
 usa_economic_events.380.a: "Aceptar el dinero y mantener el control"
 usa_economic_events.380.b: "Aceptar una gobernanza corporativa convencional"
 usa_economic_events.381.t: "Comprar el torrente de datos"
 usa_economic_events.381.d: "YouTube no tiene ni dos años, está sirviendo más metraje de vídeo del que nadie ha alojado jamás, no tiene ingresos y está siendo demandado desde todas las direcciones. El precio de venta es de 1650 millones de dólares en acciones de Google, lo que los analistas del sector califican como una cifra de burbuja para una audiencia de la que nadie ha demostrado que vaya a pagar por nada, y señalan que la sola exposición a demandas por derechos de autor podría superar el coste de la compra. Google Video ya existe y está perdiendo. Desarrollar el reemplazo internamente es más barato y lento, y concede la audiencia durante todo el tiempo que tome."
 usa_economic_events.381.a: "Comprar el torrente de datos"
 usa_economic_events.381.b: "Construirlo nosotros mismos y tomarnos el tiempo necesario"
 usa_economic_events.382.t: "DeepMind y la frontera"
 usa_economic_events.382.d: "DeepMind, una empresa de investigación londinense bajo el mando de Demis Hassabis, ha enseñado a las máquinas a jugar a juegos que nadie las programó para entender. No tiene producto ni ingresos, y el precio que Google está negociando equivale a varios millones de dólares por investigador; la lectura sobria es que se trata de una ronda de contratación disfrazada de adquisición. Los vendedores imponen condiciones: un comité de ética y nada de trabajos militares o de vigilancia. Correr hacia la frontera implica pagar ese precio y pasar años enteros desarrollando capacidades sin nada que vender. Escalonar el despliegue detrás de la gobernanza que pide DeepMind es más barato y cede el liderazgo a quien no acepte esas trabas."
 usa_economic_events.382.a: "Correr hacia la frontera tecnológica"
 usa_economic_events.382.b: "Escalonar el despliegue detrás de la gobernanza"
 usa_economic_events.383.t: "El contrato de defensa"
 usa_economic_events.383.d: "El Pentágono quiere visión artificial para imágenes de drones bajo el Proyecto Maven, y miles de ingenieros de Google con su firma se han negado a construirlo. Se está redactando un conjunto de principios de IA para hacer de esa negativa una política permanente en lugar de una concesión aislada. El contrato de Maven en sí es pequeño. Lo que se esconde detrás es JEDI, la adjudicación de la nube para todo el departamento por valor de diez mil millones de dólares, y cada analista de defensa dice que a una empresa que no haga el trabajo de visión tampoco se le confiará la infraestructura clasificada. Negarse entrega ambos contratos a los competidores que siguen pujando."
 usa_economic_events.383.a: "Aceptar el contrato"
 usa_economic_events.383.b: "Mantener la línea que trazó el personal"
 usa_economic_events.384.t: "El ecosistema de computación soberano"
 usa_economic_events.384.d: "Los aceleradores de Nvidia son la limitación absoluta en cada ciclo de entrenamiento de la industria, la asignación se raciona por relaciones comerciales y la valoración de la empresa superó el billón de dólares en mayo gracias a ello. El consejo estándar es que Google compre de todos modos: CUDA, el software con el que está escrito todo el campo, es de Nvidia, y un silicio personalizado implica portar todo el ecosistema informático y mantener el compilador para siempre. Diseñar nuestros propios aceleradores a la escala que la frontera tecnológica necesita ahora cuesta años y miles de millones antes de que exista una pieza útil. Comprar mantiene el dinero y la dependencia."
 usa_economic_events.384.a: "Diseñar nuestros propios aceleradores"
 usa_economic_events.384.b: "Comprar a proveedores externos"
 usa_economic_events.385.t: "Quién posee la frontera"
 usa_economic_events.385.d: "Un cuarto de siglo de Google decidiendo qué perseguir y qué poseer ha zanjado la cuestión. Si la investigación de vanguardia se realizó de forma interna o se compró fuera, y si las máquinas en las que se ejecuta son el propio silicio de Google o se alquilan a Nvidia, constituye ahora la totalidad de la respuesta a dónde se construye la inteligencia artificial estadounidense y quién tiene permitido decir no."
 usa_economic_events.385.a: "Una potencia informática de vanguardia"
 usa_economic_events.385.b: "Un inquilino de vanguardia"
 usa_economic_events.385.c: "Un ecosistema informático gobernado"
 usa_economic_events.385.e: "Una plataforma cautelosa"
 USA_google_frontier_compute_power: "Potencia informática de vanguardia"
 USA_google_frontier_compute_power_desc: "Los modelos se entrenan en el límite de lo humanamente posible, utilizando aceleradores diseñados en los mismos edificios. Nadie más fija el precio del cálculo informático y nadie más decide cuándo está disponible."
 USA_google_frontier_tenant: "Inquilino de vanguardia"
 USA_google_frontier_tenant_desc: "La investigación es de categoría mundial, pero las máquinas en las que se ejecuta pertenecen a otra empresa. Cada avance en capacidad es real, pero cada uno de ellos es alquilado."
 USA_google_governed_stack: "Ecosistema informático gobernado"
 USA_google_governed_stack_desc: "El silicio es de propiedad y los despliegues son lentos, revisados y defendibles. Nunca será el primero en alcanzar una capacidad tecnológica, pero nunca ha tenido que retirar ninguna."
 USA_google_cautious_platform: "La plataforma cautelosa"
 USA_google_cautious_platform_desc: "Ni la vanguardia de la frontera ni la fundición de chips. Los productos son prudentes, el cálculo informático se compra en el mercado y la empresa compite basándose en la distribución en lugar de en lo que puede construir que otros no puedan."
 usa_economic_events.390.t: "Para quién es Motorola"
 usa_economic_events.390.d: "Iridium, la filial de telefonía satelital de Motorola, se ha hundido en la bancarrota y se ha llevado consigo gran parte de la reputación de la empresa. Lo que sobrevive es un negocio de radiocomunicación que los cuerpos de policía, los servicios de bomberos y los ejércitos compran y nunca dejan de comprar, y un negocio de telefonía móvil de consumo que tiene que volver a ganarse a cada cliente cada año. Solo uno de ellos puede ser la prioridad de Motorola."
 usa_economic_events.390.a: "Construir en torno a la radiocomunicación de seguridad pública"
 usa_economic_events.390.b: "Perseguir el mercado de consumo masivo"
 usa_economic_events.391.t: "Escindir el silicio"
 usa_economic_events.391.d: "Motorola ha fabricado sus propios chips desde antes de que existieran la mayoría de sus competidores, y el negocio de fabricación de semiconductores consume ahora un capital que la división de telefonía móvil reclama. Escindirlo recauda fondos y libera a ambas mitades. Conservarlo significa pagar las fábricas de chips con cargo a un negocio de consumo que tal vez no pueda permitírselas."
 usa_economic_events.391.a: "Escindir el grupo de semiconductores"
 usa_economic_events.391.b: "Mantener las fábricas en la familia"
 usa_economic_events.392.t: "La pantalla de cristal"
 usa_economic_events.392.d: "Una empresa de ordenadores ha lanzado un teléfono sin teclado y el mercado ha decidido que lo prefiere. Motorola puede adoptar el sistema operativo que una empresa de búsquedas está regalando (el cual es rápido, gratuito y pertenece a otra persona) o pasar años y gastar una fortuna construyendo una plataforma que controle por completo."
 usa_economic_events.392.a: "Adoptar la plataforma gratuita"
 usa_economic_events.392.b: "Financiar una plataforma que controlemos"
 usa_economic_events.393.t: "Dividir el nombre"
 usa_economic_events.393.d: "El negocio de radiocomunicación de Motorola y su negocio de telefonía móvil comparten una marca, un balance económico y casi nada más. Separarlos en Motorola Solutions y Motorola Mobility permite que cada uno sea juzgado bajo sus propios términos, y deja que el más débil quiebre sin arrastrar al otro. Mantenerlos unidos preserva la escala y el nombre con el que ambos todavía comercian."
 usa_economic_events.393.a: "Separar Solutions de Mobility"
 usa_economic_events.393.b: "Mantener a Motorola intacta"
 usa_economic_events.394.t: "La empresa de patentes"
 usa_economic_events.394.d: "Google quiere adquirir Motorola Mobility, y lo que realmente está comprando es un archivador: unas diecisiete mil patentes que le permitirían defender a Android contra todos los que actualmente lo están demandando. Doce mil quinientos millones de dólares es un precio generoso para un fabricante de teléfonos que lleva años sin ganar. Rechazarlo significa encontrar el dinero para mantener ese negocio nosotros mismos."
 usa_economic_events.394.a: "Permitir la venta"
 usa_economic_events.394.b: "Mantener a Mobility bajo propiedad estadounidense"
 usa_economic_events.395.t: "Lo que Schaumburg conservó"
 usa_economic_events.395.d: "Un cuarto de siglo decidiendo qué mitad de Motorola importaba ha dictaminado qué sigue fabricando Estados Unidos en comunicaciones, y quién responde cuando las radios de emergencia tienen que funcionar."
 usa_economic_events.395.a: "Un gigante de las comunicaciones integrado"
 usa_economic_events.395.b: "Silicio y seguridad"
 usa_economic_events.395.c: "Una marca de teléfonos móviles huérfana"
 usa_economic_events.395.e: "El servicio público de seguridad"
 USA_motorola_integrated_communications_giant: "Gigante integrado de comunicaciones"
 USA_motorola_integrated_communications_giant_desc: "Las fábricas de chips, las radios de emergencia y los teléfonos móviles se mantuvieron bajo el mismo techo, algo que ninguna empresa de comunicaciones estadounidense logró en la realidad. Es más lenta que cualquiera de sus rivales especializados y no depende de ninguno de ellos en solitario."
 USA_motorola_silicon_and_safety: "Silicio y seguridad"
 USA_motorola_silicon_and_safety_desc: "El negocio de consumo se marchó y las piezas difíciles se quedaron: chips fabricados en el país y redes encriptadas sin las cuales los servicios de emergencia no pueden operar. Nadie compra ninguna de las dos cosas por elección, y todo el mundo las compra por necesidad."
 USA_motorola_orphaned_handset_brand: "Marca de teléfonos móviles huérfana"
 USA_motorola_orphaned_handset_brand_desc: "Las fábricas de chips se vendieron y los teléfonos se conservaron, lo que dejó a un diseñador de hardware de consumo comprando su silicio a los mismos proveedores que todos los demás. El nombre todavía significa algo para las personas que lo recuerdan."
 USA_motorola_public_safety_utility: "Servicio público de seguridad"
 USA_motorola_public_safety_utility_desc: "Todo lo que competía en precio ha desaparecido, y lo que queda es la radio sobre el hombro de un bombero y la red que la sustenta. Crece lentamente, casi nunca se menciona, y ninguna agencia estadounidense puede funcionar sin ella."
 usa_economic_events.400.t: "La fase de medidas correctivas"
 usa_economic_events.400.d: "Un tribunal federal ha dictaminado que Microsoft ha violado la ley antimonopolio y ha ordenado la separación de los negocios de sistemas operativos y de aplicaciones. Washington puede forzar la medida correctiva estructural mediante una apelación, o conformarse con normas de conducta regulatoria y dejar a la empresa unida. Un resultado pone fin al asunto; el otro reconfigura el software estadounidense."
 usa_economic_events.400.a: "Conformarse con medidas correctivas de conducta"
 usa_economic_events.400.b: "Forzar la división mediante apelación"
 usa_economic_events.401.t: "Cuarenta y cuatro mil millones por las búsquedas"
 usa_economic_events.401.d: "Microsoft ha ofrecido cuarenta y cuatro mil millones de dólares por una empresa de búsquedas, porque las búsquedas es a donde se fue el dinero de la publicidad y no tiene nada de él. El precio es extraordinario para un negocio en declive. Dejar que la oferta se desmorone significa conceder el mercado y buscar el próximo en algún otro lugar."
 usa_economic_events.401.a: "Dejar que la oferta se desmorone"
 usa_economic_events.401.b: "Comprar al competidor aspirante"
 usa_economic_events.402.t: "Azure alcanza la disponibilidad general"
 usa_economic_events.402.d: "Azure es un producto real ahora, y cada dólar que Microsoft gasta en hacer que tenga éxito es un dólar que argumenta que los clientes deberían dejar de comprar las licencias de Windows y Office que levantaron a la empresa. Comprometerse significa canibalizar la franquicia a propósito. Defender el escritorio conserva los márgenes de beneficio y permite que otra persona sea dueña de la década."
 usa_economic_events.402.a: "Comprometerse con la nube"
 usa_economic_events.402.b: "Defender la franquicia del escritorio"
 usa_economic_events.403.t: "Abrir el ecosistema"
 usa_economic_events.403.d: "El nuevo director ejecutivo quiere que Microsoft distribuya software para sistemas operativos que pasó veinte años intentando destruir, y que compre el lugar donde sus críticos guardan su código. Esto le costaría a la empresa el argumento que ha defendido desde el principio. Negarse mantiene la doctrina y a los clientes que ya se han marchado."
 usa_economic_events.403.a: "Abrir el ecosistema"
 usa_economic_events.403.b: "Mantener la línea propietaria"
 usa_economic_events.404.t: "La apuesta de OpenAI"
 usa_economic_events.404.d: "Un laboratorio de investigación sin ingresos quiere miles de millones y el uso exclusivo de los centros de datos de Microsoft, y a cambio Microsoft obtiene acceso prioritario a lo que sea que construyan. Es la mayor apuesta por el personal de otra empresa que la compañía ha realizado jamás. Desarrollar la misma capacidad internamente es más lento, pero más barato y completamente nuestro."
 usa_economic_events.404.a: "Apostar por el laboratorio"
 usa_economic_events.404.b: "Desarrollar los modelos internamente"
 usa_economic_events.405.t: "Lo que Redmond dictaminó"
 usa_economic_events.405.d: "Un cuarto de siglo de Microsoft decidiendo qué poseer y qué alquilar ha definido dónde se ejecuta la informática empresarial estadounidense, quién entrenó los modelos en ella y desde los centros de datos de quién responden."
 usa_economic_events.405.a: "Un hiperescalador asociado"
 usa_economic_events.405.b: "Un ecosistema de modelos integrado"
 usa_economic_events.405.c: "Inteligencia bajo licencia"
 usa_economic_events.405.e: "El escritorio soberano"
 USA_microsoft_partnered_hyperscaler: "Hiperescalador asociado"
 USA_microsoft_partnered_hyperscaler_desc: "Los centros de datos son de Microsoft, pero el laboratorio que los llena no lo es. Tiene acceso prioritario a la vanguardia tecnológica pero no tiene la última palabra sobre ella, lo que representa una ventaja enorme y una dependencia que nadie ha sabido valorar."
 USA_microsoft_integrated_model_stack: "Ecosistema de modelos integrado"
 USA_microsoft_integrated_model_stack_desc: "Tanto el cálculo informático como los modelos se construyeron internamente, lo que tomó más tiempo pero no rinde cuentas ante nadie. Cada capa, desde el alquiler de silicio hacia arriba, está bajo un mismo techo y una misma junta directiva."
 USA_microsoft_licensed_intelligence: "Inteligencia bajo licencia"
 USA_microsoft_licensed_intelligence_desc: "Los modelos provinieron de un socio y las máquinas en las que se ejecutan provinieron de un competidor. Microsoft vende la inteligencia sin poseer ninguna de las dos mitades que la hacen posible, lo cual funciona exactamente mientras se mantengan las condiciones pactadas."
 USA_microsoft_sovereign_desktop: "El escritorio soberano"
 USA_microsoft_sovereign_desktop_desc: "La franquicia fue defendida y la vanguardia tecnológica se dejó en manos de otros. Lo que se ejecuta en cientos de millones de máquinas sigue siendo de Microsoft, sigue estando bajo licencia, pero ya no es el lugar donde ocurre el trabajo interesante."
 usa_economic_events.410.t: "El argumento de los megahercios"
 usa_economic_events.410.d: "El Pentium 4 de Intel está construido para hacer escalar un único número: la microarquitectura NetBurst compra margen de frecuencia haciendo menos trabajo por ciclo, por lo que a igual frecuencia puede perder frente al Pentium III al que reemplazó, y el Athlon de AMD se está llevando los análisis de rendimiento que Intel debería ganar. Nada de eso importa en un estante donde la cifra de megahercios es todo el argumento de venta, y el consenso del sector es que Intel debería mantener ese número subiendo mientras el proceso de fabricación lo permita. La disidencia proviene del propio equipo de diseño de Intel en Haifa, que trabaja en un núcleo de bajo consumo que perdería por completo la guerra de marketing pero ganaría en las máquinas que la gente realmente transporta."
 usa_economic_events.410.a: "Seguir la curva de frecuencia"
 usa_economic_events.410.b: "Diseñar para rendimiento por vatio"
 usa_economic_events.411.t: "Centrino se convierte en una plataforma"
 usa_economic_events.411.d: "El procesador móvil se vende mejor empaquetado con el propio chipset de Intel y su silicio inalámbrico que de forma aislada. Vender el paquete como una única plataforma vincula a los fabricantes de portátiles y deja fuera a los rivales de componentes. Vender las piezas por separado mantiene el mercado abierto y los márgenes de beneficio más estrechos."
 usa_economic_events.411.a: "Vender la plataforma integrada"
 usa_economic_events.411.b: "Mantener abierto el mercado de componentes"
 usa_economic_events.412.t: "Las condiciones de la comisión"
 usa_economic_events.412.d: "Los reguladores federales han pasado años investigando los acuerdos de Intel con los fabricantes que compran sus procesadores y los rivales que compiten por los zócalos de conexión. Un acuerdo pone fin a la investigación bajo reglas de conducta pactadas. Publicar las interfaces técnicas en su lugar concede más de lo que pedían los reguladores y bloquea la próxima reclamación."
 usa_economic_events.412.a: "Llegar a un acuerdo sobre reglas de conducta"
 usa_economic_events.412.b: "Publicar las interfaces técnicas"
 usa_economic_events.413.t: "El proceso de fabricación vuelve a retrasarse"
 usa_economic_events.413.d: "El próximo nodo de fabricación de Intel llega años tarde, no trimestres, y AMD está distribuyendo piezas construidas por TSMC en Taiwán en un proceso que Intel no puede igualar. Rescatar el proceso internamente cuesta una suma enorme sin garantías de éxito. Comprar capacidad a la fundición que nos superó admite que el liderazgo de fabricación ha desaparecido, pero mantiene los productos competitivos."
 usa_economic_events.413.a: "Financiar el rescate del proceso de fabricación"
 usa_economic_events.413.b: "Comprar a una fundición externa de vanguardia"
 usa_economic_events.414.t: "Fabricar para otras personas"
 usa_economic_events.414.d: "El nuevo director ejecutivo quiere que Intel fabrique chips para las empresas con las que compite, lo que significa gestionar las plantas como un negocio que responde ante clientes externos. Es el mayor compromiso de capital en la historia de la empresa y subordina la hoja de ruta del producto a la fábrica. Priorizar los productos mantiene las plantas cautivas y la estrategia familiar."
 usa_economic_events.414.a: "Abrir las fábricas a clientes externos"
 usa_economic_events.414.b: "Mantener las fábricas cautivas para productos propios"
 usa_economic_events.415.t: "Un accionista público"
 usa_economic_events.415.d: "Washington está dispuesto a convertir su apoyo a los semiconductores en acciones, lo que convertiría al gobierno federal en uno de los mayores accionistas de Intel. Aceptar hace de la empresa un activo industrial nacional y obliga a su junta directiva a responder ante algo más que el mercado. Rechazar mantiene la propiedad privada y el subsidio condicionado."
 usa_economic_events.415.a: "Aceptar la participación federal"
 usa_economic_events.415.b: "Rechazar la propiedad pública"
 usa_economic_events.416.t: "En lo que se convirtió Intel"
 usa_economic_events.416.d: "Un cuarto de siglo de velocidades de reloj, plataformas, nodos perdidos y dinero público ha definido si Intel todavía fabrica silicio de vanguardia en Estados Unidos, y quién es el dueño de la empresa que lo hace."
 usa_economic_events.416.a: "Una casa de arquitectura sin fábricas de chips"
 usa_economic_events.416.b: "Un arsenal de silicio nacional"
 usa_economic_events.416.c: "Una fundición de cálculo integrada"
 usa_economic_events.416.e: "Una fundición de sistemas abierta"
 USA_intel_domestic_silicon_arsenal: "Arsenal de silicio nacional"
 USA_intel_domestic_silicon_arsenal_desc: "La vanguardia tecnológica se fabrica en suelo estadounidense y el sector público posee una participación en la empresa que lo hace. La capacidad de producción es un activo estratégico antes que comercial, y su precio se fija en consecuencia."
 USA_intel_integrated_compute_foundry: "Fundición de cálculo integrada"
 USA_intel_integrated_compute_foundry_desc: "Las fábricas construyen tanto para clientes externos como para Intel, de modo que la planta genera sus propios ingresos en lugar de depender de una única hoja de ruta. Diseñar y fabricar bajo el mismo techo vuelve a dar frutos una vez que el techo se abre al mercado."
 USA_intel_open_systems_foundry: "Fundición de sistemas abierta"
 USA_intel_open_systems_foundry_desc: "Las interfaces publicadas y los nodos abiertos convirtieron a la plataforma en algo sobre lo que otros podían construir, en lugar de algo para lo que necesitaban una licencia. Los márgenes de beneficio son más estrechos y el ecosistema es mucho mayor."
 USA_intel_fabless_architecture_house: "Casa de arquitectura sin fábricas"
 USA_intel_fabless_architecture_house_desc: "Los diseños siguen siendo de Intel, pero las obleas de silicio pertenecen a otra empresa. Liberada de la carga de capital de las fábricas, la compañía compite únicamente en arquitectura y depende de una fundición que no controla."
 usa_economic_events.440.a: "Construir Foundry en torno al uso responsable de datos"
 usa_economic_events.440.b: "Adaptar Foundry para misiones públicas"
 usa_economic_events.440.c: "Expandir Foundry a través de industrias comerciales"
 usa_economic_events.440.d: "Credit Suisse comenzó a utilizar Foundry en 2013 para analizar el cumplimiento normativo y el riesgo de mercado, mientras que First Data utilizó el software de Palantir en su transformación tecnológica. Las instituciones comerciales se están convirtiendo en un mercado diferenciado para el modelo operativo de datos de Palantir."
 usa_economic_events.440.d_option: "Preservar la independencia de contratación del cliente"
 usa_economic_events.440.t: "Foundry entra en la industria"
 usa_economic_events.441.a: "Exigir una adquisición de software responsable"
 usa_economic_events.441.b: "Profundizar la integración gubernamental tras el fallo"
 usa_economic_events.441.c: "Convertir la victoria en expansión comercial"
 usa_economic_events.441.d: "El Circuito Federal ha ratificado la conclusión de que el Ejército no realizó una investigación de mercado adecuada sobre alternativas comerciales antes de proceder con el desarrollo personalizado para el DCGS-A2. La victoria de Palantir refuerza los argumentos a favor de comprar software probado, sin perder de vista la competencia y la dependencia de los proveedores."
 usa_economic_events.441.d_option: "Defender la competencia para el software comercial"
 usa_economic_events.441.t: "Prevalece el software comercial"
 usa_economic_events.442.a: "Vincular la cotización con la supervisión del despliegue"
 usa_economic_events.442.b: "Utilizar la cotización para expandir el trabajo gubernamental"
 usa_economic_events.442.c: "Sacar a bolsa a Palantir para su expansión comercial"
 usa_economic_events.442.d: "Las acciones de Clase A de Palantir han comenzado a cotizar en la Bolsa de Nueva York a través de una cotización directa. La liquidez y el escrutinio de los mercados públicos llegan mientras la empresa equilibra el trabajo en misiones gubernamentales con el crecimiento comercial."
 usa_economic_events.442.d_option: "Mantener la independencia en las relaciones de contratación"
 usa_economic_events.442.t: "La cotización directa"
 usa_economic_events.443.a: "Abrir Tiberius a la rendición de cuentas pública"
 usa_economic_events.443.b: "Integrar Tiberius en la distribución federal"
 usa_economic_events.443.c: "Comercializar la plataforma logística"
 usa_economic_events.443.d: "Tiberius de Palantir integra datos públicos y privados sobre vacunas para los planificadores federales y estatales, proporcionando visibilidad desde la asignación hasta la entrega y la administración. Un panorama operativo común puede coordinar la distribución a escala nacional, al tiempo que incorpora controles de acceso y supervisión pública en el diseño operativo."
 usa_economic_events.443.d_option: "Preservar la independencia de contratación jurisdiccional"
 usa_economic_events.443.t: "Tiberius coordina la distribución"
 usa_economic_events.444.a: "Gobernar el entramado de datos de forma transparente"
 usa_economic_events.444.b: "Desplegar Gotham como el entramado de datos del Ejército"
 usa_economic_events.444.c: "Adaptar el entramado para clientes comerciales"
 usa_economic_events.444.d: "El Ejército ha seleccionado a Palantir para suministrar un entramado de datos de inteligencia federado globalmente y una base analítica a través de múltiples clasificaciones de seguridad. Gotham respaldará las pruebas y el despliegue a medida que el Capability Drop 2 avance hacia su uso operativo."
 usa_economic_events.444.d_option: "Mantener la arquitectura neutral en cuanto a la contratación"
 usa_economic_events.444.t: "El entramado de datos del Ejército"
 usa_economic_events.445.a: "Someter el prototipo a pruebas con rendición de cuentas"
 usa_economic_events.445.b: "Integrar TITAN con el sistema de fijación de objetivos del Ejército"
 usa_economic_events.445.c: "Comercializar la plataforma de fusión de sensores"
 usa_economic_events.445.d: "El Ejército ha adjudicado a Palantir y Raytheon contratos independientes de precio fijo por valor de 36 millones de dólares para construir prototipos avanzados de TITAN. Los sistemas competidores integrarán datos de sensores y se probarán con los comentarios de los soldados antes de seleccionar a un único proveedor."
 usa_economic_events.445.d_option: "Preservar la competencia mediante la creación de prototipos"
 usa_economic_events.445.t: "Adjudicación de prototipos TITAN"
 usa_economic_events.446.a: "Hacer que el despliegue de AIP rinda cuentas"
 usa_economic_events.446.b: "Integrar AIP en las operaciones gubernamentales"
 usa_economic_events.446.c: "Escalar AIP a través de clientes empresariales"
 usa_economic_events.446.d: "Palantir está introduciendo AIP dentro de Foundry, combinando modelos de lenguaje grandes con datos operativos, controles de acceso y flujos de trabajo empresariales. El acceso anticipado introduce la IA en las decisiones de los clientes, al tiempo que la seguridad y la gobernanza pasan a formar parte del despliegue."
 usa_economic_events.446.d_option: "Proteger la libertad de elección del cliente en todos los despliegues"
 usa_economic_events.446.t: "AIP llega a las empresas"
 usa_economic_events.447.a: "Vincular la plataforma del NHS a las salvaguardias públicas"
 usa_economic_events.447.b: "Integrar la plataforma en todas las operaciones del NHS"
 usa_economic_events.447.c: "Expandir el software de salud comercial a través de la adjudicación"
 usa_economic_events.447.d: "El NHS de Inglaterra ha adjudicado a un grupo liderado por Palantir un contrato de siete años para suministrar la Plataforma de Datos Federados tras una licitación pública y competitiva. La plataforma conectará los datos existentes para la coordinación de la atención médica, la gestión de listas de espera y la planificación de recursos bajo unas expectativas reforzadas de privacidad y rendición de cuentas."
 usa_economic_events.447.d_option: "Preservar la independencia de contratación del NHS"
 usa_economic_events.447.t: "Plataforma de Datos Federados del NHS"
 usa_economic_events.448.a: "Imponer salvaguardias con rendición de cuentas en TITAN"
 usa_economic_events.448.b: "Dirigir TITAN como contratista principal del Ejército"
 usa_economic_events.448.c: "Adaptar comercialmente el modelo de plataforma de TITAN"
 usa_economic_events.448.d: "El Ejército ha seleccionado a Palantir tras una fase competitiva de prototipos y ha adjudicado un acuerdo de Fase 3 por valor de 178,4 millones de dólares para diez prototipos de TITAN. Como proveedor preferido y contratista principal, la empresa integrará variantes avanzadas y básicas para procesar datos de sensores de múltiples dominios."
 usa_economic_events.448.d_option: "Mantener competitivo el ecosistema de prototipos"
 usa_economic_events.448.t: "Contrato principal de TITAN"
 usa_economic_events.449.a: "Gobernar el despliegue de Maven de forma transparente"
 usa_economic_events.449.b: "Expandir Maven a través de las operaciones de defensa"
 usa_economic_events.449.c: "Convertir la integración de Maven en una expansión comercial a gran escala"
 usa_economic_events.449.d: "El Ejército ha adjudicado a Palantir un contrato de precio fijo de 480 millones de dólares para el prototipo del Sistema Inteligente Maven, extendiendo el software de misión a través de operaciones e inteligencia habilitadas por IA. Esta escala profundiza el papel de Palantir en la defensa y la dependencia del gobierno de una plataforma integrada."
 usa_economic_events.449.d_option: "Preservar la competencia en torno al software de misión"
 usa_economic_events.449.t: "El Proyecto Maven se expande"
 usa_economic_events.450.a: "Convertirse en el sistema operativo de la defensa"
 usa_economic_events.450.b: "Establecer una plataforma operativa de doble uso"
 usa_economic_events.450.c: "Construir una infraestructura de datos públicos con rendición de cuentas"
 usa_economic_events.450.d: "El acuerdo empresarial del Ejército consolida setenta y cinco contratos en un único marco para los productos comerciales de Palantir, con un periodo de ejecución de hasta diez años y un límite máximo de 10 000 millones de dólares. La estructura promete descuentos por volumen y un acceso más rápido, al tiempo que define de manera decisiva la postura de Palantir en los mercados de defensa, civil y comercial."
 usa_economic_events.450.d_option: "Concentrarse en la plataforma comercial de IA"
 usa_economic_events.450.t: "Acuerdo empresarial del Ejército"
 usa_economic_events.460.t: "AIG al borde del abismo"
 usa_economic_events.460.d: "Las tres agencias de calificación han rebajado la nota de AIG esta mañana y las solicitudes de garantías colaterales que siguieron han dejado a la aseguradora a horas de la quiebra. No es un banco, no es liquidable y se encuentra en la contraparte de los contratos de derivados en manos de la mitad del sistema financiero."
 usa_economic_events.460.a: "Autorizar apoyo de emergencia"
 usa_economic_events.460.b: "Buscar un consorcio privado"
 usa_economic_events.460.c: "Dejar caer a AIG"
 usa_economic_events.462.t: "El rescate federal"
 usa_economic_events.462.d: "El Banco de la Reserva Federal de Nueva York concederá préstamos respaldados por los activos de AIG bajo condiciones punitivas. Lo que Washington pida a cambio decidirá si esto es un préstamo a una empresa privada o una nacionalización que nadie se atreverá a llamar como tal."
 usa_economic_events.462.a: "Asumir la participación accionaria"
 usa_economic_events.462.b: "Prestar únicamente bajo condiciones punitivas"
 usa_economic_events.463.t: "Quiebra desordenada"
 usa_economic_events.463.d: "AIG ha solicitado la declaración de quiebra. Sus filiales de seguros están siendo intervenidas por los reguladores estatales, sus contrapartes de préstamo de valores están reclamando todo a la vez y los fondos del mercado monetario que poseían sus pagarés están sufriendo pérdidas en el valor nominal de sus acciones."
 usa_economic_events.463.a: "Contener el contagio financiero"
 usa_economic_events.463.b: "Dejar que el mercado se regule solo"
 usa_economic_events.464.t: "La liquidez sigue agotándose"
 usa_economic_events.464.d: "El rescate compró tiempo y nada más. La cartera de préstamos de valores es el verdadero agujero negro: las garantías en efectivo se reinvirtieron en papel hipotecario que nadie quiere valorar, y las contrapartes exigen la devolución del efectivo ahora mismo."
 usa_economic_events.464.a: "Rastrear la cartera de préstamos de valores"
 usa_economic_events.465.t: "El servicio de préstamo de valores"
 usa_economic_events.465.d: "La Fed de Nueva York puede tomar prestados valores con grado de inversión de las filiales de seguros de AIG y devolver garantías en efectivo. Esto detiene el pánico inmediato sin abordar la razón por la que comenzó."
 usa_economic_events.465.a: "Abrir el servicio de valores"
 usa_economic_events.465.b: "Rechazar más préstamos"
 usa_economic_events.466.t: "Reestructurar el paquete de apoyo"
 usa_economic_events.466.d: "Las condiciones originales están castigando a una empresa que ahora es propiedad del gobierno, y los intereses están consumiendo el fondo de asistencia más rápido de lo que el negocio puede devolverlo. El Tesoro puede inyectar capital y permitir que la Fed reduzca el diferencial y amplíe el plazo."
 usa_economic_events.466.a: "Reestructurar el paquete"
 usa_economic_events.466.b: "Mantener las condiciones originales"
 usa_economic_events.467.t: "Maiden Lane III"
 usa_economic_events.467.d: "Una entidad con cometido especial puede comprar las obligaciones de deuda colateralizada (CDO) que sustentan las permutas de incumplimiento crediticio (CDS) de AIG y rescindir los contratos, poniendo fin a la espiral de garantías colaterales para siempre. El precio que paguemos por ese papel financiero es la gran cuestión."
 usa_economic_events.467.a: "Pagar a precio de mercado y poner fin a las permutas"
 usa_economic_events.467.b: "Exigir concesiones"
 usa_economic_events.468.t: "Las negociaciones con las contrapartes"
 usa_economic_events.468.d: "Se ha pedido a las contrapartes que acepten una quita voluntaria en contratos que legalmente tienen derecho a cobrar en su totalidad. Una ha mostrado una disposición condicional; el resto ha señalado que no podemos obligarlas."
 usa_economic_events.468.a: "Aceptar el repliegue al valor nominal"
 usa_economic_events.468.b: "Registrar las concesiones parciales"
 usa_economic_events.469.t: "Maiden Lane II"
 usa_economic_events.469.d: "Una segunda entidad puede comprar los valores respaldados por hipotecas residenciales (RMBS) de la cartera de préstamos de valores y cerrar el programa para siempre. También reemplaza el fondo de asistencia de octubre con algo que tendrá que ser gestionado durante años."
 usa_economic_events.469.a: "Transferir la cartera de RMBS"
 usa_economic_events.469.b: "Liquidar el programa de forma interna"
 usa_economic_events.470.t: "Quién cobró"
 usa_economic_events.470.d: "El Congreso quiere los nombres de las instituciones que el rescate de AIG realmente protegió, y aproximadamente la mitad de ellas son bancos extranjeros. La postura de la Fed de Nueva York es que la divulgación daña a las contrapartes y a las entidades instrumentales que aún poseemos."
 usa_economic_events.470.a: "Divulgar las contrapartes"
 usa_economic_events.470.b: "Retrasar la divulgación"
 usa_economic_events.471.t: "Primas de retención"
 usa_economic_events.471.d: "AIG Financial Products, la división que redactó las permutas, está obligada por contrato a pagar ciento sesenta y cinco millones de dólares en primas de retención. Los contratos son anteriores al rescate y la empresa que ahora poseemos es la que está vinculada por ellos."
 usa_economic_events.471.a: "Honrar los contratos"
 usa_economic_events.471.b: "Recuperar lo que podamos"
 usa_economic_events.472.t: "Reestructuración y venta de activos"
 usa_economic_events.472.d: "AIG está siendo dividida en piezas que puedan venderse: el negocio de vida asiático, la arrendadora de aviones, la rama de financiación al consumo. La rapidez con la que vendamos determina lo que recuperará el contribuyente."
 usa_economic_events.472.a: "Vender activos metódicamente"
 usa_economic_events.472.b: "Salir lo más rápido posible"
 usa_economic_events.473.t: "La Fed sale de AIG"
 usa_economic_events.473.d: "La asistencia de la Fed de Nueva York puede reembolsarse en su totalidad y el fondo de asistencia rotatorio darse por terminado, dejando al Tesoro con acciones ordinarias que puede vender en el mercado. Las entidades Maiden Lane están funcionando por encima de su valor contable."
 usa_economic_events.473.a: "Aceptar el reembolso total"
 usa_economic_events.473.b: "Extender el fondo de asistencia aún más"
 usa_economic_events.474.t: "Desinversión completa del Tesoro"
 usa_economic_events.474.d: "El último bloque de acciones ordinarias de AIG ha sido vendido y la participación del gobierno ha desaparecido. La forma en que se recordará el rescate y el precedente que deja para la próxima quiebra de importancia sistémica quedan zanjados ahora."
 usa_economic_events.474.a: "Un precedente de recapitalización interna por acreedores"
 usa_economic_events.474.b: "Reivindicación del contribuyente"
 usa_economic_events.474.c: "Un régimen de resolución ordenada"
 usa_economic_events.474.d_option: "Un precedente liquidacionista"
 usa_economic_events.474.e: "Un acuerdo sobre el riesgo moral"
 USA_aig_taxpayer_vindication: "Reivindicación del contribuyente"
 USA_aig_taxpayer_vindication_desc: "El compromiso con AIG se reembolsó en su totalidad y devolvió beneficios al Tesoro, algo que nadie esperaba en 2008. El endeudamiento soberano es más barato, los ingresos por impuestos corporativos son más sólidos y la administración puede hacer uso de esa credibilidad."
 USA_aig_orderly_resolution_regime: "Régimen de resolución ordenada"
 USA_aig_orderly_resolution_regime_desc: "La divulgación y la recuperación de fondos se convirtieron en una autoridad permanente para liquidar de forma controlada una empresa de importancia sistémica. El endeudamiento y la inversión son más baratos y el sistema es notablemente más estable, a costa de unos rendimientos algo menores."
 USA_aig_creditor_bail_in_precedent: "Precedente de recapitalización interna por acreedores"
 USA_aig_creditor_bail_in_precedent_desc: "Se obligó a las contrapartes a aceptar menos del valor nominal, y cada acreedor de una gran institución estadounidense ahora sopesa en el precio la posibilidad de que se le vuelva a pedir lo mismo. La inversión nacional es más barata de dirigir, pero los costes de endeudamiento y la buena voluntad extranjera se resienten."
 USA_aig_moral_hazard_settlement: "Acuerdo sobre el riesgo moral"
 USA_aig_moral_hazard_settlement_desc: "El sistema se estabilizó, las contrapartes cobraron en su totalidad, las primas se honraron y la opinión pública entendió exactamente lo que había sucedido. Los rendimientos de capital y los ingresos del mercado son sólidos; el capital político y la estabilidad no lo son."
 USA_aig_liquidationist_precedent: "Precedente liquidacionista"
 USA_aig_liquidationist_precedent_desc: "Se permitió que AIG quebrara y la red de contrapartes cayó con ella. El endeudamiento y la inversión son notablemente más costosos y el suministro de consumo está bajo presión, pero ninguna administración volverá a ser acusada de rescatar a Wall Street."
 USA_openai_nonprofit_controlled_pbc: "S.B.E. controlada por una organización sin ánimo de lucro"
 USA_openai_nonprofit_controlled_pbc_desc: "OpenAI Group opera como una sociedad de beneficio público (S.B.E.) bajo el control de la Fundación OpenAI. Esta estructura vincula el crecimiento comercial a la gobernanza de la misión, al tiempo que otorga al laboratorio acceso al capital social convencional."
 USA_openai_scaled_commercial_platform: "Plataforma comercial a gran escala"
 USA_openai_scaled_commercial_platform_desc: "OpenAI prioriza la distribución de productos, la adopción empresarial y la inversión rápida de vanguardia. Un amplio alcance financia la capacidad técnica, pero el control de la misión y la gobernanza de la seguridad deben competir con la presión comercial."
 USA_openai_diversified_frontier_consortium: "Consorcio de vanguardia diversificado"
 USA_openai_diversified_frontier_consortium_desc: "OpenAI respalda el desarrollo de vanguardia a través de una red de socios de capital y cálculo informático, en lugar de depender de un solo proveedor. La diversificación amplía la capacidad y el poder de negociación a costa de una gobernanza más compleja."
 USA_openai_safety_governed_laboratory: "Laboratorio gobernado por la seguridad"
 USA_openai_safety_governed_laboratory_desc: "La gobernanza formal de la seguridad y la supervisión de la misión restringen el despliegue hasta que los modelos y los controles estén listos. El laboratorio conserva su legitimidad e independencia, pero acepta una expansión comercial más lenta."
 USA_anthropic_safety_governed_frontier: "Vanguardia gobernada por la seguridad"
 USA_anthropic_safety_governed_frontier_desc: "Anthropic combina la investigación de vanguardia con una gobernanza formal, evaluaciones de capacidad y salvaguardias más estrictas a medida que los modelos avanzan. Esta estructura sostiene la confianza pública al tiempo que preserva la capacidad del laboratorio para desarrollar sistemas competentes."
 USA_anthropic_cloud_aligned_scale: "Escala alineada con la nube"
 USA_anthropic_cloud_aligned_scale_desc: "Anthropic desarrolla y despliega modelos de vanguardia a través de profundas asociaciones técnicas con un proveedor principal de la nube. El capital, los aceleradores y la distribución estrechamente integrados respaldan una rápida expansión a costa de una mayor dependencia."
 USA_anthropic_multi_cloud_independence: "Independencia multinube"
 USA_anthropic_multi_cloud_independence_desc: "Anthropic distribuye el entrenamiento y el despliegue a través de varios socios de infraestructura. Este acuerdo preserva el poder de negociación y un amplio acceso, al tiempo que hace más compleja la expansión de la vanguardia."
 USA_anthropic_cautious_research_laboratory: "Laboratorio de investigación cauteloso"
 USA_anthropic_cautious_research_laboratory_desc: "Anthropic limita su expansión comercial para que la investigación, la interpretabilidad y los controles de seguridad puedan madurar antes de un despliegue más amplio. El laboratorio acepta un progreso de vanguardia más lento a cambio de una gobernanza más sólida y legitimidad pública."
 USA_openai_nonprofit_controlled_pbc_decision: "Respaldar la estructura controlada por la organización sin ánimo de lucro"
 USA_openai_nonprofit_controlled_pbc_decision_desc: "Apoyar una reestructuración que deje la rama comercial del laboratorio bajo la responsabilidad de su organización fundadora sin ánimo de lucro. La política federal no puede dictar los estatutos de una empresa privada, pero el tratamiento fiscal, la contratación pública y la postura antimonopolio determinan qué estructura sobrevive al contacto con los mercados de capitales.\n\n§YEl espíritu nacional resultante dura 365 días. Solo puede estar activo un programa de laboratorio de IA a la vez.§!"
 USA_openai_scaled_commercial_platform_decision: "Respaldar la rápida expansión comercial"
 USA_openai_scaled_commercial_platform_decision_desc: "Despejar el camino para una distribución agresiva de productos y un despliegue empresarial masivo. El alcance comercial financia la capacidad técnica más rápido que cualquier subvención de investigación, y el gobierno obtiene un campeón nacional cuyos incentivos ya no controla.\n\n§YEl espíritu nacional resultante dura 365 días. Solo puede estar activo un programa de laboratorio de IA a la vez.§!"
 USA_openai_diversified_frontier_consortium_decision: "Respaldar un consorcio de cálculo diversificado"
 USA_openai_diversified_frontier_consortium_decision_desc: "Alentar al laboratorio a distribuir su capacidad de entrenamiento entre varios socios de capital e infraestructura en lugar de uno solo. La diversificación aporta poder de negociación y resiliencia a cambio de una estructura de gobernanza que nadie puede resumir en una sola frase.\n\n§YEl espíritu nacional resultante dura 365 días. Solo puede estar activo un programa de laboratorio de IA a la vez.§!"
 USA_openai_safety_governed_laboratory_decision: "Respaldar la gobernanza formal de la seguridad"
 USA_openai_safety_governed_laboratory_decision_desc: "Condicionar la cooperación federal a la realización de evaluaciones, despliegues escalonados y un comité de supervisión con autoridad real. El laboratorio mantiene su legitimidad y su independencia, y cede el liderazgo comercial a quien esté dispuesto a realizar los envíos primero.\n\n§YEl espíritu nacional resultante dura 365 días. Solo puede estar activo un programa de laboratorio de IA a la vez.§!"
 USA_anthropic_safety_governed_frontier_decision: "Respaldar la vanguardia gobernada por la seguridad"
 USA_anthropic_safety_governed_frontier_decision_desc: "Apoyar a un laboratorio que escala la capacidad técnica y las salvaguardias al mismo tiempo, publicando sus umbrales de evaluación y ciñéndose a ellos. Es más lento que la alternativa, y considerablemente más fácil de defender ante un comité político.\n\n§YEl espíritu nacional resultante dura 365 días. Solo puede estar activo un programa de laboratorio de IA a la vez.§!"
 USA_anthropic_cloud_aligned_scale_decision: "Respaldar una asociación de nube única"
 USA_anthropic_cloud_aligned_scale_decision_desc: "Respaldar una estrecha alineación con un único proveedor de hiperescala, cambiando la independencia por el capital y la capacidad necesarios para mantenerse en la vanguardia. El cálculo informático llega de inmediato; el poder de influencia recae en el socio.\n\n§YEl espíritu nacional resultante dura 365 días. Solo puede estar activo un programa de laboratorio de IA a la vez.§!"
 USA_anthropic_multi_cloud_independence_decision: "Respaldar la independencia multinube"
 USA_anthropic_multi_cloud_independence_decision_desc: "Presionar al laboratorio para que entrene y ofrezca servicios a través de proveedores competidores, de modo que ningún socio único pueda imponer sus condiciones. La independencia es costosa y la sobrecarga de ingeniería es real, pero la empresa se responde a sí misma.\n\n§YEl espíritu nacional resultante dura 365 días. Solo puede estar activo un programa de laboratorio de IA a la vez.§!"
 USA_anthropic_cautious_research_laboratory_decision: "Respaldar un programa de investigación restringido"
 USA_anthropic_cautious_research_laboratory_decision_desc: "Apoyar que el laboratorio se mantenga pequeño, deliberado y en gran medida fuera de la carrera por los productos comerciales. La confianza pública y la disciplina interna se mantienen intactas; la posición en el mercado no.\n\n§YEl espíritu nacional resultante dura 365 días. Solo puede estar activo un programa de laboratorio de IA a la vez.§!"
 USA_ai_lab_treasury_15_tt: "Tiene más de §Y15 000 millones§! en reservas del Tesoro"
 USA_ai_lab_treasury_20_tt: "Tiene más de §Y20 000 millones§! en reservas del Tesoro"
 USA_ai_lab_treasury_25_tt: "Tiene más de §Y25 000 millones§! en reservas del Tesoro"
 usa_economic_events.475.a: "Imponer un decreto de consentimiento estricto"
 usa_economic_events.475.b: "Firmar un decreto más laxo"
 usa_economic_events.475.d: "El Tribunal de Apelaciones del Circuito de D.C. ha revocado la orden de división y el caso avanza hacia un decreto de consentimiento. Podemos obligar a Microsoft a cumplir con estrictas condiciones de interoperabilidad y divulgación, o negociar un decreto más flexible que preserve la agilidad en la contratación pública."
 usa_economic_events.475.t: "Revocación de la apelación y decreto de consentimiento"
 usa_economic_events.476.a: "Alinearse con las medidas correctivas de la CE"
 usa_economic_events.476.b: "Defender una línea estadounidense más restrictiva"
 usa_economic_events.476.d: "La Comisión Europea ha multado a Microsoft y ha ordenado la aplicación de medidas correctivas de interoperabilidad. Washington puede alinearse con Bruselas en cuanto a la apertura de documentación y acceso a interfaces, o defender una interpretación estadounidense más restrictiva del derecho de la competencia."
 usa_economic_events.476.t: "Dictámenes de competencia de la Comisión Europea"
 usa_economic_events.477.a: "Exigir fiabilidad antes que escala"
 usa_economic_events.477.b: "Priorizar la velocidad del mercado"
 usa_economic_events.477.d: "El problemático despliegue de Vista ha expuesto debilidades de calidad y compatibilidad en todo el ecosistema de Microsoft. Podemos imponer estrictos criterios de referencia de fiabilidad para los despliegues federales, o tolerar la inestabilidad para preservar el impulso del proveedor."
 usa_economic_events.477.t: "Los años de Ballmer: Vista y estrategia de plataforma"
 usa_economic_events.478.a: "Respaldar la adquisición de Oracle"
 usa_economic_events.478.b: "Forzar una reestructuración independiente"
 usa_economic_events.478.c: "Autorizar la oferta de Microsoft"
 usa_economic_events.478.d: "El colapso de Sun se ha convertido en una decisión de política industrial federal. Washington puede respaldar la oferta de adquisición de Oracle, forzar una vía de reestructuración independiente o autorizar la oferta de Microsoft y decidir las condiciones de integración en un dictamen posterior."
 usa_economic_events.478.t: "El futuro de Sun: Oracle, reestructuración o Microsoft"
 usa_economic_events.479.a: "Imponer la administración por medio de una fundación"
 usa_economic_events.479.b: "Permitir la integración total de Microsoft"
 usa_economic_events.479.d: "Con la oferta de Microsoft autorizada, los reguladores federales deben decidir la gobernanza de los activos de la plataforma de Sun. Podemos dirigir a Java hacia una administración al estilo de una fundación con garantías de interoperabilidad, o permitir una profunda integración de Microsoft y aceptar el riesgo de concentración de mercado."
 usa_economic_events.479.t: "Gobernanza de Sun tras la oferta de Microsoft"
 usa_economic_events.480.a: "Respaldar la estrategia de dispositivos Lumia"
 usa_economic_events.480.b: "Amortizar la unidad y salir de los teléfonos móviles"
 usa_economic_events.480.c: "Escindir el negocio de dispositivos"
 usa_economic_events.480.d: "La adquisición de la división de telefonía de Nokia por parte de Microsoft ha fracasado, y la empresa está amortizando miles de millones y recortando la división de teléfonos. La política federal puede presionar a Microsoft para que siga luchando por los dispositivos o para que ceda el mercado y se vuelva a enfocar en la nube y el software."
 usa_economic_events.480.t: "La amortización de Nokia"
 usa_economic_events.481.a: "Aprobar la integración total de datos"
 usa_economic_events.481.b: "Aprobar con condiciones de portabilidad de datos"
 usa_economic_events.481.c: "Bloquear la adquisición"
 usa_economic_events.481.d: "Microsoft ha acordado adquirir LinkedIn, situando una red profesional y sus datos bajo el control de la empresa. Los reguladores pueden dar luz verde al acuerdo sin objeciones, añadir condiciones de portabilidad de datos o bloquearlo por motivos de privacidad y concentración de mercado."
 usa_economic_events.481.t: "LinkedIn se une a Microsoft"
 usa_economic_events.482.a: "Preservar la autonomía de GitHub"
 usa_economic_events.482.b: "Integrar GitHub con Azure"
 usa_economic_events.482.c: "Bloquear la adquisición"
 usa_economic_events.482.d: "La adquisición de GitHub otorga a Microsoft la tutela sobre una infraestructura central de código abierto. La política federal puede preservar la autonomía de la plataforma, integrar estrechamente GitHub en Azure o bloquear el acuerdo por motivos de seguridad y monopolio de mercado."
 usa_economic_events.482.t: "GitHub bajo Microsoft"
 usa_economic_events.483.a: "Defender la adjudicación a un único contratista principal"
 usa_economic_events.483.b: "Imponer una pasarela soberana neutral respecto al proveedor"
 usa_economic_events.483.c: "Dividir los entornos de la nube civil y de defensa"
 usa_economic_events.483.d: "Mantener la gobernanza de Java neutral"
 usa_economic_events.483.d_independent: "El litigio de JEDI ha expuesto la fragilidad de la contratación pública: cada dictamen sobre la nube tiene ahora consecuencias estratégicas. Debemos elegir con qué nivel de firmeza permanecen vinculadas la gobernanza de los proveedores, la seguridad y la nube federal."
 usa_economic_events.483.d_microsoft: "A medida que se intensifican las disputas por el JEDI, las agencias planifican estructuras post-JEDI. La elección ya no es si la nube importa, sino si Washington gobierna un único contratista principal de sistemas nacionales o un entorno multinube regulado."
 usa_economic_events.483.d_oracle: "El Pentágono ha adjudicado el contrato JEDI a Microsoft, desencadenando protestas, impugnaciones de ofertas y disputas sobre la nube soberana entre las agencias. Podemos respaldar una adjudicación centralizada, forzar una arquitectura neutral en cuanto al proveedor o pivotar hacia entornos paralelos."
 usa_economic_events.483.e: "Absorber por completo a Sun en la estrategia de Azure"
 usa_economic_events.483.t: "El JEDI y la disputa por la nube de defensa"
 usa_economic_events.484.a: "Desplegar el visor a gran escala"
 usa_economic_events.484.b: "Restructurar hacia un despliegue limitado"
 usa_economic_events.484.c: "Volver a licitar hacia un competidor tecnológico de defensa"
 usa_economic_events.484.d: "El Sistema Integrado de Aumento Visual del Ejército (IVAS), construido sobre las HoloLens de Microsoft, ha fracasado en las pruebas de campo y ha atraído el escrutinio del Congreso sobre su coste y fiabilidad. Veintidós mil millones de dólares y la confianza del soldado están en juego."
 usa_economic_events.484.t: "IVAS: El visor del soldado"
 usa_economic_events.485.a: "Aprobar la adquisición"
 usa_economic_events.485.b: "Aprobar con condiciones para la transmisión en la nube"
 usa_economic_events.485.c: "Bloquear la fusión"
 usa_economic_events.485.d: "Microsoft ha acordado comprar Activision Blizzard por sesenta y nueve mil millones de dólares, la mayor operación en la historia de los videojuegos. La Comisión Federal de Comercio y los reguladores extranjeros están tomando medidas en su contra por el control de los juegos y la transmisión en la nube."
 usa_economic_events.485.t: "Activision y los reguladores"
 usa_economic_events.486.a: "Seguridad primero"
 usa_economic_events.486.b: "Seguridad y distribución equilibradas"
 usa_economic_events.486.c: "Distribuir rápido con menores controles"
 usa_economic_events.486.d: "La cuestión restante es la doctrina: ¿debería la política federal priorizar primero los controles de seguridad, equilibrar la distribución con salvaguardias o realizar las entregas más rápido bajo restricciones de seguridad más laxas? Esta elección establece el perfil de gobernanza a largo plazo para el entorno informático de Microsoft en el sector público."
 usa_economic_events.486.t: "Doctrina de seguridad para el entorno de Microsoft"
 usa_economic_events.487.t: "Fundación de una empresa de lanzamientos privada"
 usa_economic_events.487.d: "SpaceX, una startup de lanzamientos financiada con fondos privados en El Segundo, afirma que construirá sus propios motores, estructuras y aviónica en lugar de comprarlos. Washington puede fomentar una base de ingeniería integrada, dirigir a la empresa hacia la contratación de defensa desde el principio o permitirle ganar velocidad utilizando componentes comerciales ya existentes."
 usa_economic_events.487.a: "Fomentar una base de ingeniería integrada"
 usa_economic_events.487.b: "Dirigir a la empresa hacia la contratación de defensa"
 usa_economic_events.487.c: "Permitirle ganar velocidad con piezas comerciales existentes"
 usa_economic_events.488.t: "Carga comercial a la estación espacial"
 usa_economic_events.488.d: "La NASA va a trasladar el reabastecimiento de la estación a contratos comerciales por primera vez, y SpaceX está pujando con una cápsula que aún no ha volado. La forma de la adjudicación decidirá si dos proveedores compiten, si se financia a un único campeón para avanzar rápido o si la flota de transbordadores se estira unos años más."
 usa_economic_events.488.a: "Adjudicar el contrato de carga a dos proveedores"
 usa_economic_events.488.b: "Financiar a un único campeón para ganar velocidad"
 usa_economic_events.488.c: "Estirar la logística existente de los transbordadores"
 usa_economic_events.489.t: "El Falcon 1 alcanza la órbita"
 usa_economic_events.489.d: "Tres fracasos y luego, en el cuarto intento, el Falcon 1 alcanza la órbita. SpaceX quiere seguir volando para aprender. Los reguladores exigen una supervisión más estricta de un programa de lanzamientos que ha estado fracasando en público, y los contratistas principales establecidos quieren integrar al recién llegado en sus propias cadenas de suministro."
 usa_economic_events.489.a: "Permitirles iterar mediante pruebas de vuelo"
 usa_economic_events.489.b: "Endurecer la supervisión del riesgo de lanzamiento"
 usa_economic_events.489.c: "Integrar al recién llegado en los contratistas principales"
 usa_economic_events.490.t: "Falcon 9 y Dragon"
 usa_economic_events.490.d: "SpaceX vuela el Falcon 9 por primera vez, y está previsto que la cápsula Dragon regrese de la órbita antes de que termine el año. La amplitud con la que se certifique el sistema decidirá si realiza misiones nacionales, si espera tras un calendario de cualificación conservador o si sirve únicamente a clientes comerciales."
 usa_economic_events.490.a: "Cualificar el sistema para misiones civiles"
 usa_economic_events.490.b: "Mantener un ritmo de certificación conservador"
 usa_economic_events.490.c: "Limitarlo a clientes comerciales"
 usa_economic_events.491.t: "La primera etapa regresa"
 usa_economic_events.491.d: "Un cohete acelerador de SpaceX aterriza en posición vertical en Cabo Cañaveral. La reutilización ya no es teórica, pero expandirla implica volar cargas útiles de clientes en hardware ya utilizado, y el negocio de cohetes desechables sigue siendo el que paga las facturas."
 usa_economic_events.491.a: "Expandir la reutilización de forma agresiva"
 usa_economic_events.491.b: "Priorizar un ritmo de vuelo conservador"
 usa_economic_events.491.c: "Proteger los ingresos de los lanzamientos desechables"
 usa_economic_events.492.t: "Falcon Heavy"
 usa_economic_events.492.d: "El Falcon Heavy vuela con éxito en su primer intento, y SpaceX opera ahora el cohete más capaz en servicio. Certificarlo para cargas útiles de seguridad nacional y del espacio profundo abre las misiones más grandes a un proveedor comercial, que es precisamente para lo que se crearon los programas de carga pesada tradicionales con el fin de evitarlo."
 usa_economic_events.492.a: "Certificar la carga pesada para misiones nacionales"
 usa_economic_events.492.b: "Mantener la carga pesada para cargas útiles comerciales"
 usa_economic_events.492.c: "Ceder ante los vehículos pesados de la competencia"
 usa_economic_events.493.t: "Starlink se pone en órbita"
 usa_economic_events.493.d: "El primer lote operativo de Starlink alcanza la órbita, y las solicitudes de SpaceX prevén miles más. Puede construirse como un activo aliado de doble uso, venderse tan rápido como pueda fabricarse o retenerse hasta que se respondan las cuestiones de seguridad."
 usa_economic_events.493.a: "Construirlo como un activo aliado de doble uso"
 usa_economic_events.493.b: "Vender capacidad comercial lo más rápido posible"
 usa_economic_events.493.c: "Retenerlo a la espera de una revisión de seguridad"
 usa_economic_events.494.t: "Vuelos tripulados comerciales"
 usa_economic_events.494.d: "Por primera vez desde que se retiró el transbordador espacial, astronautas estadounidenses despegan desde suelo estadounidense a bordo de una Dragon de SpaceX. Certificar los vuelos tripulados comerciales pone fin a nueve años de compra de asientos extranjeros, aunque mantener la financiación a Boeing como segundo proveedor cuesta considerablemente más."
 usa_economic_events.494.a: "Certificar los vuelos tripulados comerciales"
 usa_economic_events.494.b: "Financiar también a un segundo proveedor"
 usa_economic_events.494.c: "Mantener los asientos extranjeros como la ruta principal"
 usa_economic_events.495.t: "Un módulo de aterrizaje para la Luna"
 usa_economic_events.495.d: "La adjudicación del módulo de aterrizaje lunar vincula el programa Artemis a la Starship de SpaceX, un vehículo que aún no existe. Apostar por él compra una capacidad enorme y un calendario incierto. Dividir la adjudicación o esperar a un módulo de aterrizaje gubernamental no aporta ninguna de las dos cosas, pero arriesga menos."
 usa_economic_events.495.a: "Adjudicar el módulo de aterrizaje a Starship"
 usa_economic_events.495.b: "Dividir la adjudicación entre varios proveedores"
 usa_economic_events.495.c: "Esperar a un módulo de aterrizaje construido por el gobierno"
 usa_economic_events.496.t: "Mix de proveedores de lanzamiento de seguridad nacional"
 usa_economic_events.496.d: "El lanzamiento de seguridad nacional debe estar garantizado, lo que históricamente significaba pagar a dos proveedores para que se mantuvieran en el negocio. SpaceX vuela ahora con mucha más frecuencia y de forma mucho más barata que United Launch Alliance, y la contratación pública tiene que decidir cuánto vale esa garantía."
 usa_economic_events.496.a: "Mantener dos proveedores certificados"
 usa_economic_events.496.b: "Favorecer al contratista principal establecido"
 usa_economic_events.496.c: "Concentrarse en el proveedor más barato"
 usa_economic_events.497.t: "Licenciar Starship"
 usa_economic_events.497.d: "SpaceX quiere volar Starship, el cohete más grande jamás construido, hasta su destrucción hasta que deje de romperse. Ese enfoque necesita licencias emitidas al ritmo de la iteración, un proceso ambiental que no fue redactado para ello e infraestructura de lanzamiento que nadie más puede usar."
 usa_economic_events.497.a: "Licenciar de forma iterativa y volar para aprender"
 usa_economic_events.497.b: "Ceñirse a la vía ambiental más lenta"
 usa_economic_events.497.c: "Federalizar la infraestructura de apoyo"
 usa_economic_events.498.t: "La forma del lanzamiento estadounidense"
 usa_economic_events.498.d: "Dos décadas después de que SpaceX anunciara que construiría sus propios motores, la estructura del acceso estadounidense a la órbita se ha asentado en su forma definitiva: quién vuela las misiones nacionales, quién transporta a las tripulaciones y quién posee la constelación en el cielo."
 usa_economic_events.498.a: "Un mercado con un solo proveedor relevante"
 usa_economic_events.498.b: "Acceso garantizado a un ritmo industrial"
 usa_economic_events.498.c: "Un ecosistema industrial del espacio profundo"
 usa_economic_events.498.e: "Un entramado aliado de conectividad orbital"
 usa_economic_events.498.f: "Un mercado de proveedores mixto y disciplinado"
 USA_spacex_cadence_champion: "Ritmo de acceso garantizado"
 USA_spacex_cadence_champion_desc: "Las operaciones de lanzamiento ofrecen un acceso predecible y frecuente a la órbita, tratando la fiabilidad como una disciplina industrial en lugar de como un hito aislado."
 USA_spacex_allied_leo_connectivity: "Conectividad orbital aliada"
 USA_spacex_allied_leo_connectivity_desc: "Un entramado de comunicaciones en órbita baja compartido con los aliados aumenta la resiliencia y la interoperabilidad, y convierte a la propia constelación en un instrumento de política exterior."
 USA_spacex_deep_space_stack: "Ecosistema industrial del espacio profundo"
 USA_spacex_deep_space_stack_desc: "La carga pesada, las operaciones en órbita y la logística de exploración han crecido conjuntamente hasta convertirse en un único sistema industrial conectado."
 USA_spacex_commercial_monopoly_risk: "Mercado de lanzamientos concentrado"
 USA_spacex_commercial_monopoly_risk_desc: "El poder de mercado se ha concentrado en un solo proveedor, lo que reduce la presión competitiva y complica tanto la contratación pública como la política industrial."
 USA_spacex_mixed_provider_ecosystem: "Mercado de proveedores mixto"
 USA_spacex_mixed_provider_ecosystem_desc: "Un mercado resiliente con múltiples proveedores equilibra el ritmo de vuelo, la competencia y la seguridad para las misiones nacionales."
