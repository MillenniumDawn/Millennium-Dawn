l_korean:
 hong_kong_focus: "홍콩 중점계통도"
 HKG_divided_hong_kong: "분열된 홍콩"
 HKG_divided_hong_kong_desc: "홍콩에 대한 영국 통치의 마지막 몇 해는 다원주의 민주주의라는 유산을 남겼습니다. 그러나 동시에 건제파, 민주파, 본토파 사이에 끝없는 분쟁을 낳아 행정 효율을 번번이 떨어뜨렸습니다. 사람들은 이 혼란스러운 \\"민주주의\\"가 과연 알려진 만큼 좋은 것인지 의문을 품기 시작하고 있습니다."
 HKG_support_pro_beijing_camp: "친베이징 진영 지원"
 HKG_support_pro_beijing_camp_desc: "\\"자유가 중요하지 않은 것은 아닙니다. 그러나 우리 사회 문화에서 자유는 안정만큼 중요하지 않습니다.\\" 이제 세계는 더욱 안정되고 안전한 홍콩을 목격하게 될 것입니다."
 HKG_railway_development_strategy_2000: "철도 발전 전략 2000"
 HKG_railway_development_strategy_2000_desc: "인구 증가와 국경 간 무역 확대로 홍콩의 도로망이 정체 직전에 이르고 있습니다. 철도 발전 전략 2000은 향후 10년간 MTR의 확장을 이끌며, 통근 인구와 화물을 도로에서 철도로 옮길 것입니다."
 HKG_sign_CEPA: "CEPA 체결"
 HKG_sign_CEPA_desc: "본토와 홍콩 사이의 특혜 무역 접근을 공식화하는 경제동반자협정입니다. 국경 간 상거래에는 호재이며, 경제적 상호 의존으로 한 걸음 더 다가서는 일입니다."
 HKG_approve_funding_for_XRL: "XRL 자금 승인"
 HKG_approve_funding_for_XRL_desc: "고속철도 연결선(XRL)은 홍콩을 본토 고속철도망과 직접 연결할 것입니다. 자금 규모는 크며, 정치적 상징성은 더욱 큽니다."
 HKG_co_location_bill: "일지양검 법안"
 HKG_co_location_bill_desc: "서구룡 XRL 터미널에 중국 본토 법 집행 관할권을 두는 논란의 법안입니다. 친베이징 진영은 실용적이라 하고, 범민주파는 헌법 위반이라 주장합니다."
 HKG_electoral_reform: "선거 개혁"
 HKG_electoral_reform_desc: "기본법은 행정장관을 처음 두 임기 동안, 입법회를 처음 세 임기 동안 어떻게 선출할지 규정했으나 그 이후의 선거에 대해서는 아무 언급도 없습니다. 이것이 선거 제도 개혁을 추진하고 진정한 보통선거로 나아갈 기회입니다."
 HKG_a_broader_electorate: "더 넓은 유권자층?"
 HKG_a_broader_electorate_desc: "홍콩의 보통선거는 하루아침에 시행할 수 없습니다. 중간 단계로서 전국인민대표대회 상무위원회에 선거위원회 위원 수를 확대하도록 청원하면, 완전한 보통선거로 곧바로 가지 않고도 선거를 더 민주적으로 만들 수 있습니다."
 HKG_choose_your_own_puppet: "\\"자신의 꼭두각시를 고르시오\\""
 HKG_choose_your_own_puppet_desc: "홍콩의 보통선거는 반드시 이루어져야 하지만, 안정을 희생해서는 안 됩니다. 지명위원회는 진정으로 \\"중국과 홍콩을 사랑하는\\" 사람만이 행정장관 후보로 나설 수 있도록 보장할 것입니다."
 HKG_a_new_reform_attempt: "새로운 개혁 시도"
 HKG_a_new_reform_attempt_desc: "입법회는 다시 한번 선거 개혁을 검토하도록 요청받습니다. 이번에는 통과될 것인가, 아니면 역사가 되풀이될 것인가?"
 HKG_support_pan_democrats: "범민주파 지원"
 HKG_support_pan_democrats_desc: "민주주의와 자유는 이미 홍콩 생활의 근간에 스며 있으며, 덩샤오핑은 홍콩의 내정에 간섭하지 않겠다고 약속했습니다. 우리는 민주화 운동에 적극 참여하여 홍콩의 번영을 뒷받침하는 자유를 수호해야 합니다."
 HKG_keep_to_one_country_two_systems: "일국양제 고수"
 HKG_keep_to_one_country_two_systems_desc: "\\"일국양제\\"는 순조롭게 운영되고 있습니다. 본토는 홍콩을 개혁개방 정책의 초석으로 삼고, 홍콩은 \\"50년 불변\\" 보장에 의존하여 중국 나머지 지역과 구별되는 생활 방식을 지키고 있습니다. 이 체제는 양측 모두에 이익이 되며, 이를 온전히 유지하는 것이 우리 공동의 이익임은 분명합니다."
 HKG_hong_kong_post_2047_status: "홍콩의 2047년 이후 지위"
 HKG_hong_kong_post_2047_status_desc: "덩샤오핑은 홍콩의 정치·경제 체제를 50년간 바꾸지 않겠다고 약속했지만, 2047년 이후 이 도시가 어떤 모습일지는 아무도 말할 수 없습니다. 이제 그 미래를 고민해야 할 때가 되었습니다."
 HKG_stick_to_CPC_line: "중국 공산당 노선 고수"
 HKG_stick_to_CPC_line_desc: "홍콩은 논쟁적인 사안에서 베이징이 선호하는 노선을 조용히 따를 것입니다. 범민주파는 격분하겠지만 애국 진영은 환호할 것입니다."
 HKG_loyal_puppet: "\\"충성스러운 꼭두각시\\""
 HKG_loyal_puppet_desc: "범민주파는 패를 드러냈고, 거리는 분노를 드러냈습니다. 안정과 번영을 위해서는 홍콩이 베이징이 그린 길을 공개적으로, 그리고 거리낌 없이 따라야 합니다. 완전히 통합된 특별행정구로의 전환은 인기가 없겠지만 최종적일 것입니다."
 HKG_promote_patriotism: "애국심 고취"
 HKG_promote_patriotism_desc: "식민지 교과서와 광둥팝의 감상 속에서 자란 세대에게 조국 수호를 기대할 수는 없습니다. 국가안보 교육은 모든 교실과 직장, 방송사에 뿌리내릴 것입니다. 당에 대한 충성이 곧 홍콩에 대한 충성입니다."
 HKG_patriots_governing: "애국자의 홍콩 통치"
 HKG_patriots_governing_desc: "공무원 조직은 너무 오랫동안 식민지 시절의 관행과 은밀한 동조에 좌우되어 왔습니다. 심사위원회가 지구 담당관부터 고위 행정관까지 관료 조직 전체를 훑어, 동요하는 자들을 검증된 애국자로 교체할 것입니다. 단기적으로 생산성은 떨어지겠지만 신뢰성은 그렇지 않을 것입니다."
 HKG_suppress_cantonese_local_culture: "광둥어 지역 문화 탄압"
 HKG_suppress_cantonese_local_culture_desc: "홍콩은 중국이며, 중국어란 표준 중국어를 뜻합니다. 광둥어 방송은 축소되고, 지역 정체성 축제는 조용히 예산이 끊기며, 문화계의 반대 목소리는 퇴출될 것입니다. 그 대가는 거리의 소요와 가정 내의 반감이겠지만, 통일된 국가 문화는 그만한 값어치가 있습니다."
 HKG_reduce_size_of_LegCo: "입법회 규모 축소"
 HKG_reduce_size_of_LegCo_desc: "입법회는 야당의 연극 무대로만 쓰이는 지구 단위 의석으로 비대해졌습니다. 직선 의석을 줄이고 직능 선거구를 확대한 간소한 의회가 정부가 통치할 수 있게 해 줄 것입니다. 본토 인재 제도가 베이징과 선전에서 교육받은 행정관들로 그 빈자리를 채울 것입니다."
 HKG_gong_zyu_ou_integration: "홍콩-주하이-마카오 통합"
 HKG_gong_zyu_ou_integration_desc: "\\"일국양제\\"는 언제나 과도기적 체제였습니다. 애국자가 특별행정구를 다스리게 되면 홍콩, 주하이, 마카오 사이의 경계는 의미 있는 것이 아니라 행정상의 것이 됩니다. 국경 간 기반시설, 조화된 규제, 공유된 인재 풀이 대만구를 하나의 경제체로 완성하여 조국과의 완전한 재통합을 준비하게 합니다."
 HKG_gong_zyu_ou_integration_tt: "홍콩이 현재 §Y[CHI.GetFlag]§!의 종속국이라면 특별행정구는 합병되어 대만구에 흡수됩니다. 그렇지 않다면 즉각적인 주권 이양 없이 충성파 정치 노선의 정렬이 완료됩니다."
 HKG_support_democracy_in_china: "중국 민주주의 지원"
 HKG_support_democracy_in_china_desc: "홍콩의 민주화 운동은 본토의 개혁 노력을 공개적으로 지지할 것입니다. 이는 베이징의 권위에 대한 직접적인 도전입니다."
 HKG_commemorate_june_fourth: "6월 4일 추모"
 HKG_commemorate_june_fourth_desc: "빅토리아 공원의 추모 집회는 1990년 이래 매년 열려 왔으며, 매년 베이징은 이를 은근한 불쾌감 속에 지켜보았습니다. 올해 우리는 이를 공식화합니다. 촛불과 노래, 희생자들의 이름이 함께하는, 특별행정구 정부가 승인한 공개 추모 행사입니다. 본토는 잊지 않을 것입니다. 우리도 마찬가지입니다."
 HKG_inspire_chinese_grassroots_movements: "중국 풀뿌리 운동 고무"
 HKG_inspire_chinese_grassroots_movements_desc: "홍콩이 혼자서 본토를 구할 수는 없지만, 중국식 민주주의가 현실에서 어떤 모습인지는 보여줄 수 있습니다. 주강 삼각주를 향한 공개 방송, 국경 검문소를 통한 소책자 밀반입, 지하 출판 네트워크에 대한 은밀한 재정 지원 등, 가장 자유로운 중국 도시에서 변화의 씨앗을 뿌립니다."
 HKG_call_on_CPC_to_release_dissidents: "중국 공산당에 반체제 인사 석방 촉구"
 HKG_call_on_CPC_to_release_dissidents_desc: "류샤오보, 왕빙장, 쉬원리, 그 밖의 수십 명 등 이름은 잘 알려져 있습니다. 특별행정구 정부는 이들의 석방을 공식적이고 공개적으로 요구합니다. 베이징은 당연히 거부하겠지만, 이 요구는 정권의 감옥을 국제 의제로 올려놓을 것입니다."
 HKG_pro_democracy_media_charter: "민주화 지지 언론 헌장"
 HKG_pro_democracy_media_charter_desc: "언론의 자유는 구호가 아니라 법적 체제입니다. 헌장은 언론인에 대한 보호를 성문화하고, 편집 결정에 대한 정치적 간섭을 처벌하며, 행정부로부터 진정으로 독립된 공영 방송사를 설립합니다. 침묵당한 언론 국가 정신은 철회됩니다."
 HKG_fund_civil_society: "시민사회 지원"
 HKG_fund_civil_society_desc: "NGO, 지역 자치 단체, 법률 구조 센터, 민주화 옹호 활동에 대한 공공 보조금입니다. 국고는 타격을 입지만 정치 공동체는 더욱 강해집니다. 시민사회가 없는 민주주의는 청중 없는 토론장과 같습니다."
 HKG_legco_reform_petition: "입법회 개혁 청원"
 HKG_legco_reform_petition_desc: "입법회 선거에서 진정한 보통선거를 시행해 달라는 베이징에 대한 공식 청원입니다. 모든 의석의 직접 선거, 직능 선거구 폐지, 지명위원회 불허를 요구합니다. 보통선거 부재 국가 정신은 첫 번째 양보로서 제한적 보통선거로 대체됩니다."
 HKG_accountability_for_tiananmen: "톈안먼에 대한 책임 규명"
 HKG_accountability_for_tiananmen_desc: "우리는 명령을 내린 자들의 이름을 밝히고, 그것을 실행한 부대를 지목합니다. 특별행정구의 자체 기록 보관소를 공개하고, 국제 재판소를 지원하며, 생존자들의 증언을 널리 알립니다. 베이징은 이를 당에 대한 선전포고로 받아들일 것입니다. 홍콩의 민주파는 다른 메시지를 듣게 될 것입니다."
 HKG_peaceful_democratic_path: "평화적 민주화 노선"
 HKG_peaceful_democratic_path_desc: "외부로부터의 대립이 아닌 내부로부터의 개혁입니다. 홍콩은 민주 제도를 공고히 하고 시민사회를 안정시키며, 본토가 스스로의 일정에 따라 변화하기를 기다립니다. 빅토리아 공원의 촛불은 여전히 타오르지만 거리는 조용합니다. 개혁의 다음 단계는 강점을 지닌 위치에서 시작됩니다."
 HKG_appease_localists: "본토파 무마"
 HKG_appease_localists_desc: "본토파 운동에 대한 양보로, 광둥어 보존, 지역민 우선 고용 정책, 국경 간 통합 사업의 속도 조절이 포함됩니다."
 HKG_stoke_anti_mainland_sentiment: "반본토 정서 조장"
 HKG_stoke_anti_mainland_sentiment_desc: "중국은 모든 이익을 가져가고 홍콩 사람들에게는 높은 부동산 가격과 낮은 구매력만 남겼습니다. 홍콩이 왜 중국에 남아 중국의 작은 식민지가 되기를 감수해야 합니까?"
 HKG_restrict_tourism_immigration: "관광 및 이민 제한"
 HKG_restrict_tourism_immigration_desc: "본토 관광객에 대한 새로운 상한과 더 엄격한 국경 간 이민 규정입니다. 지역 주민은 숨통이 트인 것을 반기겠지만 소매업자와 개발업자는 그렇지 않을 것입니다."
 HKG_emphasize_hong_kong_identity: "홍콩 정체성 강조"
 HKG_emphasize_hong_kong_identity_desc: "싱가포르가 말레이시아에서 성공적으로 분리 독립한 것은 리콴유 총리의 성공적인 국가 정체성 의식 개혁 덕분이었습니다. 홍콩도 충분히 같은 방식을 택할 수 있습니다."
 HKG_distance_from_china: "중국과의 거리 두기"
 HKG_distance_from_china_desc: "홍콩이여, 닻을 올리고 중국의 통제에서 벗어날 때가 왔습니다."
 HKG_great_hong_kong_nation: "위대한 홍콩 민족 국가"
 HKG_great_hong_kong_nation_desc: "반환은 배신이었습니다. 50년의 약속은 거짓입니다. 홍콩은 성이 아니라 국가이며, 국가에는 자신의 깃발과 국경, 군대가 필요합니다. 애초에 협상으로 넘겨서는 안 되었던 것을 우리가 선언합니다."
 HKG_hong_kong_first: "홍콩 우선"
 HKG_hong_kong_first_desc: "애버딘의 항구에서 몽콕의 고층 건물에 이르기까지, 홍콩은 홍콩 사람의 것입니다. 본토의 투자와 노동, 영향력은 현지 주민의 뜻에 따르게 될 것입니다. 시민권은 유산이지 양도 가능한 편의가 아닙니다."
 HKG_hong_kong_state_constitution: "새 홍콩 국가 헌법"
 HKG_hong_kong_state_constitution_desc: "기본법은 베이징에서 기초되고 런던에서 서명되어, 두 수도 어디에서도 투표권이 없던 사람들에게 강요되었습니다. 센트럴에서 홍콩 사람들이 홍콩 사람들을 위해 기초한 새 헌법이 이를 대체합니다. 이행은 최종적입니다."
 HKG_armed_forces_of_hong_kong: "홍콩군"
 HKG_armed_forces_of_hong_kong_desc: "스스로를 지킬 수 없는 나라는 나라라고 할 수 없습니다. 지원병과 징집병으로 구성된 홍콩 방위군은 신계를 지킬 수 있는 보병과 어떠한 침범에도 맞설 수 있는 해안 경비대를 갖추게 될 것입니다. 기본법의 군사적 제한은 사문화되었습니다."
 HKG_irredentist_claim_pearl_river: "주강 삼각주 영유권 주장"
 HKG_irredentist_claim_pearl_river_desc: "주강 삼각주, 곧 선전, 광저우, 주하이는 공산주의 이전부터 광둥의 땅이었으며, 그곳 사람들은 베이징보다 우리와 더 많은 것을 공유합니다. 우리는 영유권을 공개적으로 주장합니다. 협상으로든 무력으로든 삼각주는 문화적 심장부와 재통합될 것입니다."
 HKG_little_bird_under_british_wing: "영국의 날개 아래 작은 새"
 HKG_little_bird_under_british_wing_desc: "홍콩이 중국에서 분리되었다고 해서 홀로 세상에서 살아남을 수 있다는 뜻은 아닙니다. 우리에게는 다른 이들의 도움이 필요합니다. 옛 영국 주인들은 어떻겠습니까?"
 HKG_request_rerule_british_government: "영국 정부의 재통치 요청"
 HKG_request_rerule_british_government_desc: "한때 중영 협상은 대영제국에 남고자 한 홍콩 사람들의 뜻을 결코 존중하지 않았습니다. 이번에는 우리 자신의 마음을 따를 것입니다."
 HKG_aukus_intelligence_share: "AUKUS 정보 공유"
 HKG_aukus_intelligence_share_desc: "영국, 미국, 오스트레일리아의 정보기관은 오래전부터 홍콩에 조용한 관심을 유지해 왔습니다. AUKUS 틀 아래 공식화된 기술 이전과 신호 협력은 특별행정구를 앵글로스피어 안보 체제 안에 확고히 편입시킵니다."
 HKG_uk_garrison_rights: "영국 주둔권"
 HKG_uk_garrison_rights_desc: "스톤커터스 섬의 상징적인 왕립 해병대 파견대, 빅토리아 항에 기항하는 영국 해군, 그리고 영국이 우호적인 해안에서 남중국해에 접근할 수 있게 하는 기지 협정입니다. 주둔 병력은 작지만 그 신호는 작지 않습니다."
 HKG_commonwealth_realm_ambition: "영연방 왕국의 야망"
 HKG_commonwealth_realm_ambition_desc: "캐나다, 오스트레일리아, 뉴질랜드는 모두 한때 식민지였으나 지금은 모두 왕국이며 여전히 왕관 아래 있습니다. 홍콩은 영연방 정상회의에 소유물이 아니라 군주를 공유하는 주권 왕국으로서 다시 받아들여 줄 것을 청원합니다. 반환이라는 역사적 모욕이 오랜 답을 얻게 됩니다."
 HKG_city_state_idea: "도시국가 구상"
 HKG_city_state_idea_desc: "싱가포르는 이것이 가능함을 입증했습니다. 더 큰 강대국들에 둘러싸인 중국계 다수 도시가 이념보다 중립과 역량을 택한다면 주권 무역 중심지로서 살아남아 번영할 수 있습니다. 홍콩은 그 본을 따르되 더 잘할 것입니다."
 HKG_revise_basic_law: "기본법 개정"
 HKG_revise_basic_law_desc: "기본법은 베이징을 암묵적인 최종 권위로 둔 과도기 문서로 기초되었습니다. 개정된 헌장은 그러한 조항을 삭제하고 완전한 주권을 천명하며, 특별행정구의 틀을 법치 공화국으로 다시 씁니다. 국방과 외교는 이제 홍콩의 몫입니다."
 HKG_pearl_of_east_asia: "동아시아의 진주"
 HKG_pearl_of_east_asia_desc: "본토의 속박과 서방과의 얽힘에서 모두 자유로워진 이 도시는 스스로를 동아시아의 타의 추종을 불허하는 금융 및 상업 중계 무역항으로 자리매김합니다. 자본은 센트럴로 흐르고, 인재는 완차이로 흐릅니다. 이 진주는 상하이와 싱가포르를 모두 능가합니다."
 HKG_global_financial_capital: "세계 금융 수도"
 HKG_global_financial_capital_desc: "HKEX, 독립적인 통화 당국, 그리고 뉴욕이나 런던을 신뢰할 수 없는 자본을 끌어들이도록 설계된 규제 체제입니다. 홍콩은 조용히, 수익성 있게, 대체 불가능하게 아시아·태평양의 금융 중심이 됩니다."
 HKG_coastal_defence_doctrine: "연안 방어 교리"
 HKG_coastal_defence_doctrine_desc: "도시국가는 원양 해군을 유지할 여유가 없지만, 어떤 침범이든 값비싸게 만들 여유는 있습니다. 대함 미사일, 기뢰가 깔린 접근로, 강화된 항구, 그리고 투사가 아닌 거부에 초점을 맞춘 교리입니다. 홍콩은 사자가 아닌 고슴도치가 될 것입니다."
 HKG_under_lion_rock_hill: "사자산 아래"
 HKG_under_lion_rock_hill_desc: "§C사자산 아래 같은 배를 타고 우리 하나 되어 노력하리\n\n태양 아래 모두가 평등하니.\n\n우리가 자유롭고 하나가 될 때\n\n기쁨의 꿈을 좇으리\n\n함께, 한 영혼 한 마음으로\n\n어떤 두려움도 꺾지 못할 하나의 희망.\n\n하늘과 바다가 끝나는 곳에서\n\n손을 맞잡고 나와 함께 걸어가자\n\n이겨내고 우리의 싸움에서 승리하여 써 내려가리\n\n찬란히 빛나는 우리 고향의 이야기를.§!"
 HKG_race_discrimination_bill: "인종차별 금지 법안"
 HKG_race_discrimination_bill_desc: "기본법과 홍콩 권리장전 조례는 인종차별을 받지 않을 권리를 포함한 개인의 권리를 보장합니다. 또한 우리는 모든 형태의 인종차별 철폐에 관한 국제협약에 따라 인종차별을 금지하고 철폐할 의무가 있습니다."
 HKG_LGBT_rights: "LGBT 권리"
 HKG_LGBT_rights_desc: "홍콩의 LGBT 공동체는 너무 오래 기다렸습니다. 정부는 현행 법적 틀 안에서 어떤 보호와 개혁이 가능한지 검토할 것입니다."
 HKG_affirm_support_for_christian_organizations: "기독교 단체 지원 재확인"
 HKG_affirm_support_for_christian_organizations_desc: "기독교 단체는 오랫동안 홍콩의 사회 정책에 과도한 영향력을 행사해 왔습니다. 이들의 자문 역할은 재확인되고 보호될 것입니다."
 HKG_reduce_power_of_christian_groups: "기독교 단체의 영향력 축소"
 HKG_reduce_power_of_christian_groups_desc: "사회 정책에서 기독교 단체의 자문 역할은 축소될 것입니다. 세속적인 자문 절차가 그 공백을 메우도록 확대됩니다."
 HKG_consult_public_on_new_law: "새 법에 대한 공공 자문"
 HKG_consult_public_on_new_law_desc: "입법에 앞서 정부는 광범위한 공공 자문을 실시할 것입니다. 이 과정은 시간이 걸리겠지만 결과는 민주적 정당성을 갖게 될 것입니다."
 HKG_outlaw_anti_LGBT_discrimination: "반LGBT 차별 금지"
 HKG_outlaw_anti_LGBT_discrimination_desc: "직장, 주거, 서비스 제공에서 LGBT 개인에 대한 차별은 불법이 될 것입니다. 장기간의 입법 투쟁이 예상됩니다."
 HKG_seek_reform_of_existing_legislation: "기존 법률 개혁 모색"
 HKG_seek_reform_of_existing_legislation_desc: "노동법, 가족법, 임대차법 전반에 걸친 기존의 차별적 조항을 찾아내 개혁할 것입니다."
 HKG_anti_discrimination_reform_package: "차별 금지 개혁 패키지"
 HKG_anti_discrimination_reform_package_desc: "인종, 종교, 성적 지향, 성 정체성, 장애를 아우르는 포괄적 차별 금지 개혁입니다."
 HKG_legalize_gay_marriage: "동성 결혼 합법화"
 HKG_legalize_gay_marriage_desc: "홍콩은 동아시아에서 처음으로 동성 결혼을 완전히 합법화한 관할 지역이 됩니다. 일부에서는 축하가, 다른 쪽에서는 거센 반발이 예상됩니다."
 HKG_gender_pay_gap: "성별 임금 격차"
 HKG_gender_pay_gap_desc: "모든 주요 고용주에 대한 임금 격차 보고 의무화입니다. 실명 공개를 통한 압박이 자발적 준수로 이루지 못한 것을 이룰 것입니다."
 HKG_require_greater_transparency_from_employers: "고용주에 대한 투명성 강화 요구"
 HKG_require_greater_transparency_from_employers_desc: "일정 인원 이상의 고용주는 매년 상세한 임금 평등 보고서를 공개해야 합니다."
 HKG_deny_existence_of_pay_gap: "임금 격차의 존재 부인"
 HKG_deny_existence_of_pay_gap_desc: "정부의 공식 입장은 현존하는 임금 차이는 차별이 아니라 직업 선택을 반영한다는 것입니다. 추가 조치는 필요하지 않습니다."
 HKG_secondary_school_education_reform: "중등 교육 개혁"
 HKG_secondary_school_education_reform_desc: "중등 교육의 기존 3-2-2-3 구조는 미국과 중국 본토에서 이미 시행 중인 3-3-4 체제로 대체됩니다. 이 개혁은 중복되고 낡은 내용을 없애는 한편 더 폭넓은 선택 과목을 도입합니다."
 HKG_patriotic_education_curriculum_reform: "애국 교육 교과과정 개혁"
 HKG_patriotic_education_curriculum_reform_desc: "홍콩의 기존 교과과정에는 애국 교육이 설 자리가 없습니다. 그 공백을 메우기 위해 통합 교양 과목을 도입할 것입니다."
 HKG_chinese_based_education_curriculum: "중국어 기반 교육 교과과정"
 HKG_chinese_based_education_curriculum_desc: "우리는 먼저 중국인이고 그다음이 홍콩 사람입니다. 홍콩의 모든 학교는 중국어로 가르치며, 모든 아이는 중국어를 구사할 것으로 기대됩니다."
 HKG_hong_kong_police_force: "홍콩 경찰"
 HKG_hong_kong_police_force_desc: "홍콩 경찰은 1844년 5월 1일에 창설되었으며 홍콩 정부 내에서 가장 큰 규율 조직입니다. 홍콩에 주둔한 중국 인민해방군의 이동 제한으로 인해 다른 나라에서는 통상 군이 수행하는 기능을 홍콩에서는 경찰이 맡고 있습니다. 오랫동안 홍콩 경찰은 \\"아시아 최고\\"라는 찬사를 받아 왔습니다."
 HKG_anti_terrorist_train: "대테러 훈련"
 HKG_anti_terrorist_train_desc: "새 천년은 번영과 기회를 가져왔지만 새로운 위협도 가져왔습니다. 테러리즘이 홍콩에 뿌리내리게 해서는 안 됩니다."
 HKG_purchase_chinese_weapons: "중국제 무기 구매"
 HKG_purchase_chinese_weapons_desc: "영국 통치 시절의 스미스 앤드 웨슨 권총을 노린코가 공급하는 대체품으로 교체합니다. 비용은 낮고 상징성은 상당합니다."
 HKG_create_CTRU: "대테러 대응 부대 창설"
 HKG_create_CTRU_desc: "CTRU로 알려진 대테러 대응 부대는 테러 사건에 대응하기 위해 창설된 신속 대응 부대입니다. 그 대원들은 조직이 배출할 수 있는 최정예가 될 것입니다."
 HKG_police_system_reform: "경찰 제도 개혁"
 HKG_police_system_reform_desc: "홍콩 경찰의 훈련, 지휘 체계, 책임 메커니즘의 현대화입니다."
 HKG_investigate_police_triad_cooperation_problem: "경찰-삼합회 유착 문제 조사"
 HKG_investigate_police_triad_cooperation_problem_desc: "우리는 삼합회에 잠입 요원을 심지만, 그들도 우리에게 똑같이 합니다. 이 첩자들은 작전이 시작되기도 전에 이를 망쳐 놓고 있습니다. 염정공서와 조직범죄·삼합회 조사국을 통해 이 \\"흑경\\"들을 뿌리 뽑겠습니다."
 HKG_anti_protest_train: "대규모 진압 훈련"
 HKG_anti_protest_train_desc: "평화적 집회에서 폭력적 소요에 이르기까지 군중 관리 상황에 대한 전문 훈련입니다."
 HKG_purchase_anti_riot_armour: "진압 장비 확보"
 HKG_purchase_anti_riot_armour_desc: "경찰 기동 부대를 위한 새로운 방탄 및 내충격 장비입니다."
 HKG_purchase_non_lethal_weapons: "비살상 무기 구매"
 HKG_purchase_non_lethal_weapons_desc: "최루탄 발사기, 고무탄, 페퍼볼 무기 등 현대적인 군중 통제 수단입니다."
 HKG_form_elite_team: "정예 팀 편성"
 HKG_form_elite_team_desc: "해외 전술 팀을 본떠 만든 전담 대테러 대응 부대입니다."
 HKG_gong_hei_fat_coi: "공희발재"
 HKG_gong_hei_fat_coi_desc: "금융 위기를 막 견디고 새 천년에 들어선 [HKG.GetFlag]홍콩은 경제적, 사회적 문제가 부족하지 않습니다. 이를 어떻게 해결할지는 국민이 답해야 할 문제입니다."
 HKG_typhoon_shelter_from_financial_storm: "금융 폭풍으로부터의 피난처"
 HKG_typhoon_shelter_from_financial_storm_desc: "폭풍은 지나갔습니다. 이제 뒷수습을 할 때입니다. 정부는 외환 보유고와 표적 개입을 투입하여 경제를 부양할 것입니다."
 HKG_merge_into_HKEX: "SEHK와 HKFE를 HKEX로 통합"
 HKG_merge_into_HKEX_desc: "1997년 금융 위기의 여파로 홍콩 증권거래소(SEHK)와 홍콩 선물거래소(HKFE)는 새로운 홍콩거래소(HKEX)로 통합되어, 점점 세계화되는 시장에서 도시의 경쟁력을 높일 것입니다."
 HKG_greatest_entrepot: "동아시아 최고의 항구 상인"
 HKG_greatest_entrepot_desc: "홍콩은 오랫동안 아시아 제일의 중계 무역항이었습니다. 항구의 수용 능력과 화물 처리 효율을 확대하면 그 지위를 지킬 수 있습니다."
 HKG_expand_Kwai_Tsing_terminals: "콰이칭 터미널 확장"
 HKG_expand_Kwai_Tsing_terminals_desc: "콰이칭의 새로운 컨테이너 처리 능력입니다. 더 큰 선박, 더 빠른 회전, 더 많은 화물이 홍콩을 거칩니다."
 HKG_attract_foreign_investment: "외국인 투자 유치"
 HKG_attract_foreign_investment_desc: "해외 자본을 끌어들이기 위한 세제 혜택, 규제 간소화, 전담 투자자 연락 서비스 패키지입니다."
 HKG_european_business: "유럽 기업"
 HKG_european_business_desc: "유럽 상공회의소를 대상으로 한 맞춤형 접촉입니다. 홍콩은 아시아에 진출하는 유럽 기업의 지역 관문이 됩니다."
 HKG_chinese_entrepreneurs: "본토 기업가"
 HKG_chinese_entrepreneurs_desc: "중국 본토 자본은 홍콩 경제의 미래입니다. 정부는 베이징 재계와의 유대를 심화할 것입니다."
 HKG_develop_solar_power: "태양광 발전 투자"
 HKG_develop_solar_power_desc: "옥상과 저수지 전반에 분산형 태양광 설비를 설치합니다. 소박한 출발이지만 출발입니다."
 HKG_T_PARK: "T·PARK 시설"
 HKG_T_PARK_desc: "툰문의 T-PARK 슬러지 처리 시설은 폐기물을 에너지로 바꾸며 홍콩의 환경 분야 포부를 보여 줍니다."
 HKG_indonesian_gas: "자카르타산 가스"
 HKG_indonesian_gas_desc: "인도네시아와의 장기 액화천연가스 공급 협정으로 앞으로 수십 년간 홍콩의 에너지 수요를 확보합니다."
 HKG_australian_oil: "시드니산 석유"
 HKG_australian_oil_desc: "오스트레일리아 원유 생산국과의 수입 제휴로, 홍콩의 탄화수소 의존도를 단일 공급처에서 분산시킵니다."
 HKG_new_development_idea: "신 개발 계획"
 HKG_new_development_idea_desc: "신개발 구상은 기반시설, 주택, 산업 지구 사업을 하나의 조율된 기치 아래 묶습니다."
 HKG_invest_hong_kong: "홍콩에 투자"
 HKG_invest_hong_kong_desc: "InvestHK는 도시의 대표 투자 촉진 기관으로 개편되고 예산이 재편성됩니다."
 HKG_hong_kong_science_parks: "과학 단지"
 HKG_hong_kong_science_parks_desc: "사틴과 쭝콴오에 바이오테크, AI, 첨단 제조 연구개발을 위한 전용 구역을 조성하고 스타트업에 보조금을 지원하는 사무 공간을 제공합니다."
 HKG_invite_talent_to_hong_kong: "홍콩으로 인재 초청"
 HKG_invite_talent_to_hong_kong_desc: "고숙련 외국인 전문가를 위한 신속 비자 제도로, 정착을 돕는 영어 서비스와 세제 혜택이 함께 제공됩니다."
 HKG_hong_kong_cyberport: "사이버포트"
 HKG_hong_kong_cyberport_desc: "사이버포트의 권한이 갱신 및 확대되어 핀테크, 전자상거래, 디지털 미디어를 겨냥한 디지털 비즈니스 클러스터가 됩니다."
 HKG_tech_incubation_programme: "기술 인큐베이션 프로그램"
 HKG_tech_incubation_programme_desc: "초기 단계 기술 스타트업을 위한 시드 자본, 멘토링, 공용 기반시설을 갖춘 정부 지원 인큐베이터입니다."
 HKG_favor_traditional_values: "전통으로의 회귀"
 HKG_favor_traditional_values_desc: "정부는 전통적 가족 가치와 공개적으로 보조를 맞추고, 교육과 공적 생활에서의 LGBT 운동을 제한할 것입니다."
 HKG_undercover_oppression: "은밀한 탄압"
 HKG_undercover_oppression_desc: "공개적으로 소수 집단에 불리한 법을 제정하는 대신 감시, 고용주 압박, 비공식적 억제로 대응하는 보다 조용한 접근입니다."
 HKG_legislate_to_ban_LGBT: "LGBT 집단 금지"
 HKG_legislate_to_ban_LGBT_desc: "LGBT 정체성의 공적 표현을 범죄로 규정하는 공개 입법입니다. 국제 사회는 강하게 반응할 것입니다."
 HKG_regulate_sale_of_residential_buildings: "주거용 건물 판매 규제"
 HKG_regulate_sale_of_residential_buildings_desc: "공시 규칙, 주택담보대출 한도, 투기 억제세로 이루어진 소규모 틀입니다. 쑨 계획은 그대로 유지되지만, 규제 없는 시장의 최악의 과잉에는 제동이 걸립니다."
 HKG_land_reclamation: "간척 사업"
 HKG_land_reclamation_desc: "홍콩의 땅은 한정되어 있습니다. 토목 공정부는 란타우 앞바다, 신계 해안, 구룡 항구에 새로운 간척 계획을 수립합니다. 비용은 막대하고 환경론자들은 격분하지만, 새로운 건축 부지는 그만한 가치가 있습니다."
 HKG_lock_housing_price: "주택 가격 동결"
 HKG_lock_housing_price_desc: "정부는 중위 소득에 연동한 주거용 부동산 가격의 엄격한 상한을 법제화합니다. 지주들은 격노하고, 세입자와 노동조합은 환호합니다. 시장은 예측 가능해지지만 정체됩니다."
 HKG_expand_home_ownership_scheme: "주택 소유 제도 확대"
 HKG_expand_home_ownership_scheme_desc: "주택 소유 제도가 확대됩니다. 더 많은 주택, 더 낮은 문턱, 더 빠른 처리가 이루어집니다. 노동자 계층 홍콩인도 마침내 내 집 마련을 꿈꿀 수 있습니다. 국고는 보조금을 부담하고, 사회 평화가 그 배당입니다."
 HKG_let_government_hold_companies: "정부 소유 기업"
 HKG_let_government_hold_companies_desc: "선훙카이, 청쿵, 헨더슨 등 최대 부동산 개발 기업이 부분적으로 국유화됩니다. 재벌들은 크게 항의하지만 지분은 정부가 보유합니다. 부동산 가격은 직접적인 정치적 통제 아래 놓입니다."
 HKG_maintain_public_housing_construction: "공공주택 건설 유지"
 HKG_maintain_public_housing_construction_desc: "주택청의 건설 계획이 유지 및 확대됩니다. 신계 전역에 공공 단지가 들어섭니다. 기반시설 투자는 안정도와 은근히 더 만족한 주민들로 나타납니다."
 HKG_my_home_purchase_scheme: "주택 구입 제도"
 HKG_my_home_purchase_scheme_desc: "도널드 창의 내 집 마련 계획이 설계대로 시행됩니다. 공공주택에 들어가기엔 소득이 너무 많지만 민간 시장은 감당할 수 없는 홍콩인, 이른바 샌드위치 계층을 위한 임대 후 소유 주택입니다. 주거비 부담 위기에 대한 가시적인 해답입니다."
 HKG_subsidised_sale_flats_project: "보조금 지원 주택 사업"
 HKG_subsidised_sale_flats_project_desc: "정부 보조금이 지원되는 분양 주택이 생애 첫 구매자에게 시세 이하로 공급됩니다. 주택청은 사실상 특별행정구 최대의 개발업자가 됩니다."
 HKG_green_form_subsidised_home_ownership_scheme: "녹색 서식 소유 제도"
 HKG_green_form_subsidised_home_ownership_scheme_desc: "주택 개혁의 정점입니다. 기존 공공주택 세입자인 녹색 서식 소지자가 보조금 지원 소유에 우선 접근할 수 있습니다. 20년간 끊겨 있던 신분 상승의 사슬이 마침내 복원됩니다. 홍콩의 주택 위기가 끝납니다."
 HKG_public_housing_problem: "공공주택 문제"
 HKG_public_housing_problem_desc: "홍콩의 주택 위기는 반환 이후 정부의 가장 눈에 띄는 실패입니다. 주택 가격 중앙값은 소득 중앙값을 열 배 이상 웃돌고, 쪽방과 닭장집에 수만 명이 살고 있으며, 공공주택 대기 명단은 6년이 넘습니다. 무엇이든 해야 한다는 정치적 압박이 압도적입니다."
 HKG_sun_housing_policy: "쑨의 아홉 가지 주택 개혁 정책"
 HKG_sun_housing_policy_desc: "주택 장관 마이클 쑨의 9개 항 계획입니다. 공급을 제한하고, 공공 건설을 중단하며, 시장이 회복하도록 둡니다. 지주와 재벌은 찬성하고, 노동조합과 세입자는 반대합니다. 역사는 이 정책을 가혹하게 평가하겠지만, 단기적으로는 부동산 시장을 지켜냅니다."
 HKG_end_tenants_purchase_scheme: "세입자 매입 제도 종료"
 HKG_end_tenants_purchase_scheme_desc: "공공주택 세입자는 더 이상 할인된 가격으로 자신의 주택을 살 수 없게 됩니다. 국고는 자산을 유지하고 세입자는 계속 세입자로 남습니다. 작은 수입 증가를 얻는 대신 실질적인 사회적 비용을 치릅니다."
 HKG_suspend_home_ownership_scheme: "주택 소유 제도 중단"
 HKG_suspend_home_ownership_scheme_desc: "주택 소유 제도가 무기한 중단됩니다. 보조금 지원 분양 주택 공급이 끊기고, 민간 시장은 공공 경쟁에서 벗어나며, 부동산 재벌들은 걱정거리 하나를 덜게 됩니다."
 HKG_curtail_land_supply: "토지 공급 축소"
 HKG_curtail_land_supply_desc: "정부의 토지 매각이 중단되고, 토지국은 보유 재고를 시장에 내놓지 않습니다. 가격은 높은 수준에서 안정되고 부동산 시장은 집중화되며, 주택 위기는 홍콩 생활의 영구적인 특징이 됩니다."
 HKG_legco_decision_categories: "§1입법회§!"
 legco_current_motion_clock: "현재 동의안: §Y[ROOT.legco_current_motion]§!"
 legco_current_special_motion_clock: "현재 동의안: §Y[ROOT.legco_current_motion]§!"
 legco_increase_administration_motion_clock: "현재 동의안: §Y£political_power_texticon 행정 지출 증액§!"
 legco_decrease_administration_motion_clock: "현재 동의안: §Y£political_power_texticon 행정 지출 감액§!"
 legco_increase_policing_motion_clock: "현재 동의안: §Y£foreign_influence_defense_modifier_texticon §C치안§! 재원 증액§!"
 legco_decrease_policing_motion_clock: "현재 동의안: §Y£foreign_influence_defense_modifier_texticon §C치안§! 재원 감액§!"
 legco_increase_education_motion_clock: "현재 동의안: §Y£research_speed_texticon §G교육§! 예산 증액§!"
 legco_decrease_education_motion_clock: "현재 동의안: §Y£research_speed_texticon §G교육§! 예산 감액§!"
 legco_increase_health_motion_clock: "현재 동의안: §Y£population_texticon §R보건의료§! 재원 증액§!"
 legco_decrease_health_motion_clock: "현재 동의안: §Y£population_texticon §R보건의료§! 재원 감액§!"
 legco_increase_social_motion_clock: "현재 동의안: §Y£consumer_goods_texticon §n연금§! 지출 증액§!"
 legco_decrease_social_motion_clock: "현재 동의안: §Y£consumer_goods_texticon §n연금§! 지출 감액§!"
 HKG_unrestricted_housing_market: "규제 없는 주택 시장"
 HKG_unrestricted_housing_market_desc: "홍콩의 자유로운 주택 시장은 세계에서 가장 역동적이면서도 가장 가혹할 만큼 감당하기 어려운 시장 가운데 하나입니다. 개입이 없다면 소득과 가격 사이의 격차는 계속 벌어질 것입니다."
 HKG_victoria_harbour: "빅토리아 항"
 HKG_victoria_harbour_desc: "빅토리아 항은 홍콩 항만 경제의 역사적 중심지이며, 컨테이너 물동량, 페리, 크루즈 터미널이 모두 이곳에 모입니다."
 HKG_victoria_harbour_expand_desc: "새로운 컨테이너 선석, 깊어진 수로, 현대화된 화물 처리 시설을 갖춘 확장된 빅토리아 항입니다."
 HKG_victoria_harbour_expand_plus_desc: "완전한 현대적 수용 능력을 갖춘 빅토리아 항으로, 자동화 터미널과 심해 선석, 지역 최고의 화물 처리량을 자랑합니다."
 legacy_of_handover_hong_kong: "홍콩 반환의 유산"
 legacy_of_handover_hong_kong_desc: "1997년 반환은 홍콩과 본토 사이에 제도적, 경제적, 문화적 유대를 만들었으며, 이는 수십 년이 지난 지금도 정책을 형성하고 있습니다."
 Basic_Law_HKG: "§8§H[HKG.GetFlag]홍콩 특별행정구§!의 기본법§!"
 Basic_Law_milltary_HKG: "[HKG.GetFlag]홍콩 특별행정구의 기본법"
 Basic_Law_milltary_HKG_desc: "기본법에 따라 국방은 중앙정부의 권한입니다. 홍콩은 독립된 군대를 두지 않으며, 인민해방군 홍콩 주둔군이 대외 방위 임무를 수행합니다."
 Basic_Law_HKG_desc: "기본법은 홍콩이 영국에서 중화인민공화국으로 반환된 이후 홍콩 특별행정구의 설립 문서였습니다. 이 문서는 무엇보다도 중국에 대한 홍콩의 지위를 규정하고, 국방과 외교를 제외한 모든 사안에서 자치를 부여하며, 이 두 분야는 중앙정부에 위임됩니다.\n\n§W----------\n§Y[HKG.GetFlag]§!§H특별행정구§!는 자체 방위군을 두지 않으므로, 필요 방위 예산 수준은 §H0§!으로 유지되며 §G군사 지출§!도 변경할 수 없습니다.§!"
 One_Country_Two_Systems: "일국양제"
 One_Country_Two_Systems_desc: "§Y[HKG.GetFlag]홍콩§!과 §Y[MAC.GetFlag]마카오§!는 중국의 직접 통치로부터 50년간 자치를 보장받았습니다. 일국양제 모델은 언론의 자유와 집회의 자유 등 홍콩과 마카오가 소중히 여기는 많은 정치적 자유를 보존하고 심지어 성장시킬 수 있게 합니다. 본토에는 이러한 권리가 없다는 점이 홍콩 정치에서 \\"범민주파\\" 진영에 대한 지지를 이끄는 중요한 동력이며, 우려하는 많은 홍콩인은 중국 본토와의 더 깊은 통합을 경계하고 있습니다."
 Localist_Movement: "본토파 운동"
 Localist_Movement_desc: "1997년 반환 이래 중국 본토인과 홍콩인 사이의 긴장은 일부 홍콩 현지인 사이에서 \\"홍콩 우선\\"이라는 본토파 정서를 낳았습니다. 이 정서는 공산주의 중국의 정치 체제를 불신하는 한편, 홍콩 사람을 중국 사람과 문화적으로 구별되며 심지어 우월하다고 여깁니다. 2014년 우산 운동 이후 이 운동이 부상하면서 이전에는 비교적 절제되어 있던 홍콩 정치 대립의 어조가 더욱 감정적이고 급진적인 것으로 바뀌었습니다."
 Lacks_Universal_Suffrage: "보통선거 부재"
 Lacks_Universal_Suffrage_desc: "기본법은 행정장관과 입법회를 궁극적으로 보통선거로 선출하도록 규정하고 있으나, 이는 아직 실현되지 않았습니다. 주된 이유는 훨씬 더 인기 있는 범민주파가 홍콩 정부를 장악하면 어떤 일이 벌어질지에 대한 중국 정부의 우려입니다."
 Limited_Universal_Suffrage: "제한적 보통선거"
 Limited_Universal_Suffrage_desc: "중국 정부는 후보자가 먼저 베이징의 심사를 거친다는 조건으로 홍콩 행정장관을 보통선거로 선출하는 것을 허용하기로 합의했습니다. 이는 범민주파나 본토파 후보가 행정장관이 될 가능성을 줄이기 위한 조치로 널리 받아들여집니다."
 Universal_Suffrage: "보통선거"
 Universal_Suffrage_desc: "중국 정부는 마침내 본토 당국의 간섭 없이 홍콩이 행정장관을 보통선거로 선출하는 것을 허용하기로 합의했습니다."
 Hong_Kong_Protests: "홍콩 시위"
 Hong_Kong_Protests_desc: "중국 정부의 최근 조치에 이어, 홍콩에서 그 조치의 철회를 요구하는 대규모 시위가 일어났습니다."
 asian_crisis_HKG_desc: "발전 중이던 동아시아와 동남아시아를 덮친 경제 위기는 수십 년간의 성장을 물거품으로 만들었습니다. 자국 통화에 대한 신뢰 상실은 오늘날까지도 중앙은행들을 괴롭히고 있습니다. 공공 및 민간 부채도 급증했습니다.\n\n뼈아픈 교훈을 얻었고, 과거에는 원치 않았던 경제 개혁이 한창 진행 중입니다. 각국이 입은 타격은 저마다 달랐으며 각자의 해법이 있습니다.\n\n피해 국가들로 유입되던 투자는 한때 전 세계 총액의 절반에 달했으나, 지금은 [CHI.GetFlag]중국 등지로 흘러가고 있습니다."
 asian_crisis_league_HKG: "발전 중이던 동아시아와 동남아시아를 덮친 경제 위기는 수십 년간의 성장을 물거품으로 만들었습니다. 자국 통화에 대한 신뢰 상실은 오늘날까지도 중앙은행들을 괴롭히고 있습니다. 공공 및 민간 부채도 급증했습니다.\n\n뼈아픈 교훈을 얻었고, 과거에는 원치 않았던 경제 개혁이 한창 진행 중입니다. 각국이 입은 타격은 저마다 달랐으며 각자의 해법이 있습니다.\n\n피해 국가들로 유입되던 투자는 한때 전 세계 총액의 절반에 달했으나, 지금은 [CHI.GetFlag]중국 등지로 흘러가고 있습니다."
 HKG_HKEX: "홍콩거래소"
 HKG_improve_trade: "외국인 투자 유치"
 HKG_improve_trade_desc: "아시아 안팎에서 홍콩의 무역 관계를 심화하기 위한 조율된 노력으로, 새로운 협정, 간소화된 통관, 적극적인 대사관 상무 부서가 포함됩니다."
 HKG_idea_T_PARK: "§5T-PARK§!"
 HKG_idea_T_PARK_desc: "T-PARK 시설은 홍콩의 하수 슬러지를 처리하면서 전기를 생산하며, 폐기물 관리 기반시설이자 환경 분야의 쇼케이스 역할을 합니다."
 HKG_new_develop_idea_dynamic_modifier: "신개발 구상"
 HKG_new_develop_idea_dynamic_modifier_desc: "신개발 구상이 홍콩의 경제와 기반시설에 미치는 통합 효과입니다."
 HKG_idea_secondary_education_reform: "중등 교육 개혁"
 HKG_idea_secondary_education_reform_desc: "중등 교육의 기존 3-2-2-3 구조는 미국과 중국 본토에서 이미 시행 중인 3-3-4 체제로 대체되었습니다. 중복되고 낡은 내용이 제거되고 더 폭넓은 선택 과목이 도입되었습니다."
 HKG_idea_patriotic_education_reform: "애국 교육 개혁"
 HKG_idea_patriotic_education_reform_desc: "홍콩의 기존 교과과정에는 애국 교육이 설 자리가 없습니다. 그 공백을 메우기 위해 통합 교양 과목이 도입되었습니다."
 HKG_idea_chinese_based_education_reform: "중국어 기반 교육 개혁"
 HKG_idea_chinese_based_education_reform_desc: "이제 홍콩의 모든 학교는 중국어로 가르칩니다. 모든 아이는 중국어를 구사할 것으로 기대됩니다."
 HKG_rise_of_internet: "인터넷의 부상"
 HKG_rise_of_internet_desc: "인터넷은 인류 발전의 새로운 방향을 열었습니다. 이것이 일시적 유행에 그칠지 향후 수십 년간 지배적인 경제 흐름이 될지는 지켜봐야 합니다."
 HKG_idea_SARS_outbreak: "사스의 영향"
 HKG_idea_SARS_outbreak_desc: "사스 발병은 홍콩의 경제와 대중의 신뢰에 큰 타격을 입혀 도시 전역의 관광, 소매업, 일상생활을 마비시켰습니다."
 HKG_idea_railway_development_strategy_2000: "철도 발전 전략 2000"
 HKG_idea_railway_development_strategy_2000_desc: "철도 발전 전략 2000은 향후 10년간 MTR 확장의 지침이 되는 계획입니다."
 HKG_patriotic_loyalist_drive: "애국 충성 운동"
 HKG_patriotic_loyalist_drive_desc: "국가안보 교육이 학교, 방송사, 공공 서비스에 스며듭니다. 그 결과 대중은 더 유순해지고 당 조직은 강해지지만, 지적 개방성과 연구 성과를 대가로 치릅니다."
 HKG_loyalist_civil_service_purge: "충성파 공무원 숙청"
 HKG_loyalist_civil_service_purge_desc: "심사위원회가 공무원 조직에서 동요하는 자와 조용한 반대자를 샅샅이 가려냅니다. 숙청이 진행되는 동안 일상 행정은 차질을 빚지만, 그 결과 등장하는 관료 조직은 오직 한 명의 주인에게만 응답할 것입니다."
 HKG_mainland_talent_scheme: "본토 인재 제도"
 HKG_mainland_talent_scheme_desc: "홍콩의 비어 버린 행정직은 본토에서 교육받은 전문가들로 채워집니다. 연구 성과가 회복되고 사무가 효율적으로 돌아가지만, 줄어드는 현지 인력 때문에 현지에서 정치적 힘을 동원하기는 더 어려워집니다."
 HKG_gba_integration_idea: "대만구 통합"
 HKG_gba_integration_idea_desc: "홍콩, 마카오, 선전, 주하이가 이제 하나의 기능적 경제로 움직입니다. 산업 생산과 무역이 번영하며, 특별행정구와 본토의 경계는 의도적으로 흐려집니다."
 HKG_great_hong_kong_nation_idea: "위대한 홍콩 민족 국가"
 HKG_great_hong_kong_nation_idea_desc: "홍콩은 베이징에 맞서 주권을 선언했습니다. 분위기는 호전적입니다. 사기는 높고 징집은 광범위하며, 우산 시위 진압을 지켜보며 자란 세대는 자신들이 싸워 얻은 독립을 지킬 준비가 되어 있습니다. 본토와의 관계는 정체 상태입니다."
 HKG_city_state_doctrine: "도시국가 교리"
 HKG_city_state_doctrine_desc: "홍콩은 싱가포르 모델을 따릅니다. 작고, 중립적이며, 번영하고, 기술 관료적입니다. 경제는 무역과 금융으로 돌아가고, 항구는 국가의 생명선이며, 군사적 야심은 상업적 실용주의에 확고히 종속됩니다."
 HKG_under_british_wing_idea: "영국의 날개 아래"
 HKG_under_british_wing_idea_desc: "홍콩은 영국 및 더 넓은 영연방과의 안보 및 정치적 연계를 공식화했습니다. 앵글로스피어 군대의 지원병 접근, 우대 조건의 기술 라이선스, 그리고 베이징이 아닌 런던이 상위 파트너라는 분명한 외교 자세가 그 내용입니다."
 HKG_pro_democracy_media: "민주화 지지 언론 헌장"
 HKG_pro_democracy_media_desc: "빈과일보, 스탠드 뉴스, RTHK와 수십 개의 소규모 언론사가 정치적 간섭으로부터 명시적인 법적 보호를 받으며 운영됩니다. 본토의 허위 정보망은 힘을 얻지 못하고, 공공 담론은 분명히 민주적 규범 쪽으로 기웁니다."
 HKG_civil_society_funding: "시민사회 재정 지원"
 HKG_civil_society_funding_desc: "NGO, 지역 자치 단체, 민주화 옹호 단체가 투명한 공공 재정 지원을 받습니다. 그 결과 시민 문화는 더 활발해지고 민주 진영은 조용히 더 강해지지만, 그 비용은 공공 재정에서 충당됩니다."
 Basic_Law_HKG_idea_tt: "이 국가 정신은 §H[HKG.GetFlag]홍콩§!이 §R독립§!을 선언하면 취소됩니다."
 HKG_millitary_block_tt: "§W§O[CHI.GetFlag]중국§!의 §Y특별행정구§!인 §Y[HKG.GetFlag]홍콩§!은 군대를 보유할 수 없으며 군사 정책을 변경할 수 없습니다.§!"
 HONG_KONG_POLITICS_TT: "\n§Y[HKG.GetFlag]홍콩§!의 정치는 §C£HKG_Conservative 건제파§!, §8£HKG_conservatism 범민주파§!, §G£generic_Nat_Populism_small 본토파§!의 세 진영으로 나뉩니다. 입법회 의석은 이들의 지지율에 따라 결정됩니다."
 HKG_1997_crisis_league_tt: "이 국가 정신은 §Y730§!일간 유지됩니다."
 HKG_commonwealth_realm_tt: "§Y영국§!이 영연방 왕국 지위 청원에 응답합니다."
 HKG_pearl_river_irredenta_threat: "홍콩의 주강 삼각주 영유권 주장"
 OPEN_LegCo_BUTTON: "[HKG.GetFlag]홍콩 특별행정구 §Y입법회§!"
 OPEN_LegCo_BUTTON_TT: "[HKG.GetFlag]홍콩 특별행정구의 §Y입법회§!는 홍콩의 단원제 입법 기관입니다. 중국의 \\"일국양제\\" 헌정 체제 아래 운영되며, 홍콩의 혼합형 대의 민주주의의 권력 중심입니다."
 CLOSE_LegCo_BUTTON: "입법회 닫기"
