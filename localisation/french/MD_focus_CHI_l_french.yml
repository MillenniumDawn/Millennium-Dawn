 CHI_16th_congress_succession_tt: "§YLe Congrès élira un nouveau secrétaire général.§!\nLe §Y$CHI_factional_balance$§! à la clôture du Congrès décide de la succession : au-dessus de §Y$CHI_shanghai_clique_leaning$§! (une valeur supérieure à §Y-0.30§!) le Tuanpai l'emporte et §YHu Jintao§! prend le poste ; à cette valeur ou en dessous, la clique de Shanghai installe §YZeng Qinghong§!."
 CHI_16th_congress_successor_hu_tt: "§YHu Jintao§! devient §Y$CHI_nc_leader_title$§!"
 CHI_16th_congress_successor_zeng_tt: "§YZeng Qinghong§! devient §Y$CHI_nc_leader_title$§!"
 CHI_18th_congress_succession_tt: "§YLe Congrès élira un nouveau secrétaire général.§!\nLe §Y$CHI_factional_balance$§! à la clôture du Congrès décide de la succession : au-dessus de §Y$CHI_collective_leadership_active$§! (une valeur supérieure à §Y0.30§!) le Tuanpai l'emporte et §YBo Xilai§! prend le poste ; à cette valeur ou en dessous, la succession échoit à §YXi Jinping§!."
