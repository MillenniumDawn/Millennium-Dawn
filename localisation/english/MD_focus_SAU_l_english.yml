 SAU_show_deadlines_dec: "Show Project Deadlines"
 SAU_show_deadlines_dec_desc: "Display the countdown for every Vision 2030 project so their deadlines can be tracked at a glance. The clocks run whether they are shown or not."
 SAU_shura_category: "The Majlis ash-Shura"
 SAU_shura_category_desc: "Faisal argued for a Consultative Council all his reign and never got one. It was Fahd who finally decreed it into being under the Basic Law of 1992 - sixty members, appointed, meeting in a converted palace - and it has grown by royal decree ever since without once acquiring the power to bind anybody.\n\nThree benches hold the seats. The §Yulema§! bring the pulpits and the certainty that nothing will be conceded twice. The §Ytechnocrats§! bring foreign degrees and an impatience the Kingdom has not budgeted for. The §Ynotables§! - the tribes and the merchant houses - bring the only thing either of the others lacks, which is the country itself.\n\n§HThe Council§! - [ROOT.GetSAUShuraBench]\n§YUlema§!: [?SAU_shura_ulema|0]   §YTechnocrats§!: [?SAU_shura_technocrats|0]   §YNotables§!: [?SAU_shura_notables|0]\n\nWhichever bench holds the most seats sets the Council's character. Nothing here binds the King. Everything here decides what he is advised."
 SAU_special_branch: "Special Branch"
 SAU_special_branch_desc: ""
 SAU_special_capstone: "Special Capstone"
 SAU_special_capstone_desc: ""
 SAU_special_forces: "Special Forces"
 SAU_special_forces_desc: ""
 SAU_spirit_backdoor_deals: "The Settlements"
 SAU_spirit_backdoor_deals_desc: "Capital is flowing again and flowing fast, because the men who control it have been given terms they can live with. What those terms were is not written down anywhere, and the practice of not writing things down has proved thoroughly contagious - every ministry in the Kingdom has now seen what a file being closed quietly is worth."
 SAU_spirit_corruption_courts: "The Corruption Courts"
 SAU_spirit_corruption_courts_desc: "Ministers answer to a bench for the first time in the Kingdom's history, and the ministries have become noticeably careful about what they sign. So has everyone thinking of putting money in."
 SAU_spirit_ritz_purge: "The Ritz-Carlton Settlement"
 SAU_spirit_ritz_purge_desc: "One man's authority over the House of Saud is now beyond argument, and the ministries move when he says so. Capital, which watched the whole thing on television, has drawn its own conclusions about what a Saudi contract is worth."
 SAU_storm_arm_the_government: "Arm the Republic"
 SAU_storm_arm_the_government_desc: "Rifles, ammunition, pay for men who have not been paid since the capital fell, and a training cadre in Aden that reports to Riyadh rather than to the ministry.\n\n§GYemen receives 1,500 infantry weapons, 8,000 manpower and army experience§!, §R-6 bn§!. Repeatable every 30 days."
 SAU_succ_ahmed: "§LKing§! §HAhmed bin Abdulaziz§!"
 SAU_succ_ahmed_desc: "Ahmed, §L72§!. Senior §LSudairi§! - full brother of §LSalman§!. Briefly Interior Minister in §L2012§!. Lives in §LLondon§! much of the year. Conservative, traditional, §Lallergic to spectacle§!. Some princes prefer him precisely §Hfor that§!."
 SAU_succ_mbn: "§LKing§! §HMohammed bin Nayef§!"
 SAU_succ_mbn_desc: "MbN, §L55§!. The §LCounter-Terror Prince§!. Head of the §LInterior Ministry§!. Architect of the §Lpost-2003 crackdown§! against Al-Qaeda. Survivor of an Al-Qaeda assassination attempt in 2009. The §LCIA§! and §LMI6§! adore him."
 SAU_succ_muqrin: "§LKing§! §HMuqrin bin Abdulaziz§!"
 SAU_succ_muqrin_desc: "Muqrin, §L69§!, the youngest son of Ibn Saud. Former §LRSAF pilot§!. Former §LGID intelligence chief§!. Abdullah named him §LDeputy Crown Prince§! in 2014 - but his mother was a §LYemeni concubine§!, and the §LSudairis§! never accepted him as fully §Hroyal§!."
 SAU_succ_salman: "§LKing§! §HSalman bin Abdulaziz§!"
 SAU_succ_salman_desc: "Salman, §L79§!, the last surviving §LSudairi Seven§!. §L48 years§! as Governor of Riyadh. Quiet, deliberate, §Yruthless§! when crossed. The Allegiance Council confirms him within hours. He has a son: §LMohammed§!."
 SAU_succession_question: "§HThe Succession Question§!"
 SAU_succession_question_desc: "King Abdullah is dead. The throne is empty - briefly. The §LAllegiance Council§! must choose, and §Lfour candidates§! stand before them: §LSalman§! the patient Sudairi, §LMuqrin§! the half-Yemeni, §LMohammed bin Nayef§! the spymaster, §LAhmed§! the traditionalist. The kingdom's next century rests on this choice."
 SAU_Supplies_from_Eastern_province: "Supplies from the Eastern Province"
 SAU_Supplies_from_Eastern_province_desc: "The oilfields and ports of the Eastern Province are both the prize and the arsenal of any Gulf war. Organise the region to sustain a prolonged confrontation with Iran."
 SAU_syria_pipeline: "The Levant Pipeline"
 SAU_syria_pipeline_assad: "The Damascus Transit Deal"
 SAU_syria_pipeline_assad_desc: "The Assad regime permits the pipeline, for a price. Damascus skims its transit fees off the top, but the oil still reaches the sea."
 SAU_syria_pipeline_desc: "With a friendly Damascus, Saudi oil reaches the Mediterranean and the European market beyond. A direct challenge to Russian gas, laid through a liberated Syria."
 SAU_The_death_of_king_abdullah: "The Death of King Abdullah"
 SAU_The_death_of_king_abdullah_desc: "King Abdullah's reign ends, and with it an era of careful balance. The throne passes to Salman, and a far more ambitious generation waits behind him."
 SAU_The_IPSA_reopen: "Reopen the IPSA Pipeline"
 SAU_The_IPSA_reopen_desc: "The Iraqi pipeline through Saudi Arabia once carried Baghdad's oil to the Red Sea before the Gulf War shut it. With Iraq friendly again, reopen the line and bind its economy to the Kingdom's."
 SAU_Trans-Arabian_Pipeline: "The Trans-Arabian Pipeline"
 SAU_Trans-Arabian_Pipeline_desc: "The old Tapline once carried Saudi oil to the Mediterranean before war and politics closed it. With the Levant pacified, reopen the artery from the Eastern Province to the sea."
 SAU_Western_foregin_policy: "Western Policy"
 SAU_Western_foregin_policy_desc: "The United States, Europe, and the Atlantic alliance remain central. But the relationship is changing. The kingdom diversifies its partnerships."
 SAU_western_foreign_policy_01: "US Alliance"
 SAU_western_foreign_policy_01_desc: "The US-Saudi relationship is the cornerstone of the kingdom's foreign policy. Arms sales, intelligence sharing, and security guarantees bind the two nations."
 SAU_western_foreign_policy_02: "European Partnership"
 SAU_western_foreign_policy_02_desc: "Europe is a major trade partner and arms supplier. The kingdom cultivates relationships with Britain, France, and Germany."
 SAU_western_foreign_policy_03: "UK Special Relationship"
 SAU_western_foreign_policy_03_desc: "Britain and Saudi Arabia have ties going back a century. BAE Systems, British advisors, and royal visits maintain the special relationship."
 SAU_western_foreign_policy_04: "France Defense Deal"
 SAU_western_foreign_policy_04_desc: "French Rafales, naval vessels, and nuclear cooperation. Paris is an alternative arms supplier to Washington."
 SAU_western_foreign_policy_05: "German Trade"
 SAU_western_foreign_policy_05_desc: "German machinery, industrial equipment, and engineering expertise flow to Saudi Arabia. The kingdom buys German quality."
 SAU_western_foreign_policy_06: "NATO Cooperation"
 SAU_western_foreign_policy_06_desc: "Saudi Arabia cooperates with NATO on counter-terrorism, maritime security, and arms standardization. Not a member, but a partner."
 SAU_western_foreign_policy_07: "EU Trade Agreement"
 SAU_western_foreign_policy_07_desc: "A free trade agreement with the European Union is negotiated. Saudi exports flow to Europe. European investment flows to the kingdom."
 SAU_western_foreign_policy_08: "Atlantic Partnership"
 SAU_western_foreign_policy_08_desc: "The broader Atlantic partnership - US, Canada, Europe - remains central to Saudi security and trade."
 SAU_western_foreign_policy_09: "Western Arms Diversification"
 SAU_western_foreign_policy_09_desc: "The kingdom buys from everyone: American F-15s, British Typhoons, French ships, German submarines. Diversification ensures supply security."
 SAU_western_foreign_policy_10: "Western Education Ties"
 SAU_western_foreign_policy_10_desc: "Saudi students study at Western universities. Academic partnerships, research collaboration, and cultural exchange deepen ties."
 SAU_western_foreign_policy_11: "Western Investment"
 SAU_western_foreign_policy_11_desc: "Western companies invest in Saudi Arabia. GE, Siemens, Total, BP - all have major operations. Western capital builds the kingdom."
 SAU_western_foreign_policy_12: "Western Technology Transfer"
 SAU_western_foreign_policy_12_desc: "Technology transfer agreements bring Western know-how to Saudi factories and labs. The kingdom learns from the best."
 SAU_western_foreign_policy_13: "Canada Relations"
 SAU_western_foreign_policy_13_desc: "Canada is a reliable partner - until it isn't. The diplomatic crisis over human rights criticism shows the kingdom's sensitivity."
 SAU_western_foreign_policy_14: "Australia Partnership"
 SAU_western_foreign_policy_14_desc: "Australia and Saudi Arabia trade energy, education, and mining expertise. The relationship is small but growing."
 SAU_western_foreign_policy_15: "Global Diplomatic Network"
 SAU_western_foreign_policy_15_desc: "Saudi embassies and consulates span the globe. The kingdom's diplomatic network reaches every continent. Riyadh speaks to the world."
 SAU_yemen_pipeline: "The Arabian Sea Pipeline"
 SAU_yemen_pipeline_desc: "Saudi crude now flows south through Al Mahrah to the Arabian Sea, slipping past the Strait of Hormuz entirely. The route is profitable but exposed, only as safe as southern Yemen itself."
 YEM_south_yemen_ADJ: "South Yemeni"
 YEM_south_yemen_DEF: "South Yemen"
