 AI_RACE_GUI_LEDGER_TT: "§YAI竞赛§!"
 AI_RACE_GUI_LEDGER_TT_DELAYED: "追踪全球AI前沿竞赛：每位参与者的阶段和能力，以及谁最终胜出。"
 IS_title_ai_race: "AI竞赛"
 AI_RACE_tab_status_off: "本游戏规则中已关闭AI竞赛功能。"
 AI_RACE_tab_status_upcoming: "这场竞赛于2016年1月开始。所有对现代深度学习进行过研究的国家都参与其中，阶段性投资也于此时开放。"
 AI_RACE_tab_status_empty: "目前还没有国家加入这场竞赛。一个国家只有在完成现代深度学习的研究后才会加入。"
 AI_RACE_tab_status_full: "每个参赛者每个季度都会根据阶段、已完成的阶段性成果和能力进行排名。\n率先迈向前沿AI：§Y[ai_race_first_finisher_name]§!"
 AI_RACE_tab_status_outcomes: "仅看结果：参与者按能力每季度排名。本游戏规则不涉及阶段性投资。"
 AI_RACE_tab_leaderboard: "世界排行榜"
 AI_RACE_tab_status_tt: "自2016年1月起，所有开展过§Y现代深度学习§!研究的国家都加入到这场竞赛中。排名每季度重新计算一次。"
 AI_RACE_tab_leaderboard_tt: "各国首先按发展阶段排名，然后按已完成的下一阶段工作排名，最后按§Y能力§!排名。\n这些阶段包括§Y研究§!、§Y实施§!、§Y扩展§!和§Y前沿AI§!。当一个国家缺乏其发展阶段所需的工厂、网络、电力或材料时，其能力就会下降。"
 AI_RACE_tab_help_tt: "§YAI竞赛§!\n始于2016年，拥有现代深度学习的国家可以资助四个国家人工智能阶段。每个阶段都需要前期投资，并需要民用工厂、网络基础设施、电力、微芯片、复合材料和石油。资助阶段可提高研究速度、生产效率增长和办公园区收入。"
 AI_RACE_tab_help_tt_delayed: "在§YAI竞赛§!下的§Y决议§!中管理您自己的程序：包括您的阶段、六项要求、资金和阶段评价。此标签页显示世界排行​​榜。您可以在游戏规则中将竞赛设置为“完整”、“仅结果”或“关闭”。"