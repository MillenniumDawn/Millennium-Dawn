 HOL_willem_alexander_airforce_captain:0 "Comodoro do Ar Real"
 HOL_groningen_quake_reduce_tt:0 "Variação Mensal dos Terremotos de Groningen: §G-10%§!"
 HOL_groningen_quake_end_tt:0 "§GEncerra os terremotos induzidos em Groningen.§!"
 HOL_groningen.1.t:0 "O Solo se Move em Groningen"
 HOL_groningen.1.d:0 "Anos de extração contínua de gás desestabilizaram o subsolo de Groningen. O primeiro grande terremoto induzido atingiu a região, rachando casas e danificando a infraestrutura. Enquanto os poços continuarem bombeando, os tremores voltarão."
 HOL_groningen.1.a:0 "Lidaremos com as consequências"
 HOL_groningen.2.t:0 "Terremoto em Groningen"
 HOL_groningen.2.d:0 "O solo se moveu novamente, rachando casas e danificando a infraestrutura em toda a província, enquanto os tremores induzidos continuam."
 HOL_groningen.2.a:0 "Reparar os danos"
 HOL_soft_power_doctrine:0 "Doutrina do Poder Brando"
 HOL_soft_power_doctrine_desc:0 "Os Países Baixos exercem influência além de seu tamanho por meio da assistência ao desenvolvimento, da liderança na UE e da projeção global de sua expertise em água e logística. Formalizar isso como doutrina canaliza capital político para uma influência externa sustentada."
 HOL_development_cooperation_ministry:0 "Ministério da Cooperação para o Desenvolvimento"
 HOL_development_cooperation_ministry_desc:0 "Os Países Baixos restauram o financiamento integral de seu ministério de cooperação para o desenvolvimento, historicamente um dos maiores contribuintes de ajuda oficial em relação ao PIB. A ajuda é direcionada à construção de parcerias de longo prazo com os governos beneficiados, em vez de extrair concessões políticas."
 HOL_global_development_partnerships:0 "Parcerias Globais de Desenvolvimento"
 HOL_global_development_partnerships_desc:0 "Embaixadas holandesas e adidos de desenvolvimento ampliam a atuação na África, na Ásia, no Oriente Médio e na América Latina. Os governos beneficiados reconhecem o caráter consistente e não coercitivo da assistência holandesa como sinal de credibilidade."
 HOL_untied_aid_program:0 "Programa de Ajuda Desvinculada"
 HOL_untied_aid_program_desc:0 "Os Países Baixos se comprometem com a ajuda ao desenvolvimento desvinculada, ou seja, as nações beneficiadas podem adquirir bens e serviços em mercados abertos. Essa abordagem aprofunda a boa vontade e amplia a influência holandesa além do que a condicionalidade bilateral conseguiria."
 HOL_humanitarian_leadership:0 "Liderança Humanitária"
 HOL_humanitarian_leadership_desc:0 "Os Países Baixos se posicionam no centro do direito humanitário internacional e da resposta a crises, valendo-se do papel de Haia como sede da Corte Internacional de Justiça e do Tribunal Penal Internacional. Essa posição internacional protege a política externa holandesa das pressões da tensão mundial."
 HOL_humanitarian_leadership_name:0 "Liderança Humanitária"
 HOL_humanitarian_leadership_name_desc:0 "Como sede das cortes internacionais, os Países Baixos detêm uma autoridade moral que estabiliza a política interna e lhes permite empregar forças no exterior com muito menos atrito diplomático."
 HOL_eu_single_market_champion:0 "Campeã do Mercado Único da UE"
 HOL_eu_single_market_champion_desc:0 "Os Países Baixos figuram consistentemente entre os membros da UE mais comprometidos com o aprofundamento do mercado único, sobretudo em serviços, comércio digital e regulação financeira. Diplomatas holandeses fazem lobby ativo nas instituições da UE para remover as barreiras remanescentes."
 HOL_frugal_four_leadership:0 "Liderança dos Quatro Frugais"
 HOL_frugal_four_leadership_desc:0 "Junto com Áustria, Dinamarca e Suécia, os Países Baixos lideram o bloco fiscalmente conservador dentro da UE, insistindo em disciplina orçamentária e condicionalidade de reformas para gastos conjuntos. Essa coordenação amplifica a influência holandesa nas negociações fiscais da UE muito além do que a influência bilateral isolada conseguiria."
 HOL_european_strategic_autonomy:0 "Autonomia Estratégica Europeia"
 HOL_european_strategic_autonomy_desc:0 "Os Países Baixos defendem uma identidade europeia mais forte em defesa e política externa, apoiando a bússola estratégica da UE e contribuindo para capacidades conjuntas. Diplomatas holandeses formam coalizões entre os parceiros da UE para levar o bloco a posturas estratégicas mais independentes."
 HOL_water_diplomacy_initiative:0 "Iniciativa de Diplomacia da Água"
 HOL_water_diplomacy_initiative_desc:0 "Engenheiros hídricos holandeses e especialistas da Deltares são enviados, por meio de um programa formal de diplomacia, a países sujeitos a enchentes ou com escassez de água na África, na Ásia e na América Latina. As Obras do Delta e a abordagem holandesa de gestão integrada da água servem de modelo, construindo relações técnicas e políticas duradouras."
 HOL_gateway_to_europe_desc: "Roterdão é o maior porto da Europa e Schiphol um dos seus principais centros de aviação. Os Países Baixos aproveitam esta centralidade logística como um trunfo diplomático, acolhendo as missões comerciais e posicionando as infraestruturas holandesas como um ponto de entrada preferencial para os parceiros que procuram aceder aos mercados europeus."
 HOL_global_trade_facilitation:0 "Facilitação do Comércio Global"
 HOL_global_trade_facilitation_desc:0 "Diplomatas holandeses defendem um comércio aberto e baseado em regras entre mercados alinhados ao Ocidente e não alinhados. Acordos bilaterais de facilitação comercial, sustentados pela capacidade de movimentação de Roterdã e pelos serviços financeiros holandeses, ampliam o alcance comercial e político dos Países Baixos."
 HOL_dutch_soft_power_powerhouse:0 "Potência do Poder Brando Holandês"
 HOL_dutch_soft_power_powerhouse_desc:0 "Os Países Baixos cultivaram sistematicamente a reputação de parceiro confiável, íntegro e capaz em desenvolvimento, liderança europeia e comércio. Seu poder brando agora supera o que sua população e peso militar sugeririam, garantindo influência política persistente em fóruns internacionais."
 HOL_development_partner_opinion:0 "Parceiro de Desenvolvimento Holandês"
 HOL_water_partnership_opinion:0 "Parceria Holandesa da Água"
 HOL_eu_leadership_opinion:0 "Liderança Holandesa na UE"
 HOL_mocro.1.t:0 "Um Narcoestado de Fato, Se Não de Nome?"
 HOL_mocro.1.d:0 "A cocaína inunda Roterdã, redes criminosas enraizadas no submundo da cidade lavam bilhões, e uma série de assassinatos atingiu testemunhas, advogados e um jornalista. Comentaristas questionam abertamente se os Países Baixos estão perdendo terreno para o crime organizado."
 HOL_mocro.1.a:0 "Enfrentar a ameaça ao Estado de Direito"
 HOL_mocro.1.b:0 "A ameaça é exagerada"
 HOL_mocro.2.t:0 "Apreensão Recorde de Cocaína em Roterdã"
 HOL_mocro.2.d:0 "Agentes alfandegários interceptaram toneladas de cocaína escondidas em um contêiner de frutas. Os investigadores suspeitam que estivadores corruptos, os chamados extratores, guiaram a carga pelo porto."
 HOL_mocro.2.a:0 "Reforçar a alfândega no porto"
 HOL_mocro.2.b:0 "A carga escapa"
 HOL_mocro.3.t:0 "Um Advogado é Baleado"
 HOL_mocro.3.d:0 "Um advogado de defesa ligado a um grande julgamento de crime organizado foi morto a tiros em plena luz do dia. O assassinato é um ataque direto ao sistema de justiça e horrorizou o público."
 HOL_mocro.3.a:0 "Oferecer proteção estatal às testemunhas"
 HOL_mocro.3.b: "Não podemos proteger todos."
 HOL_mocro.4.t:0 "Rede Criptografada Quebrada"
 HOL_mocro.4.d:0 "A polícia invadiu uma rede de telefones criptografados usada por organizações criminosas, obtendo milhões de mensagens sobre tráfico, lavagem de dinheiro e assassinatos planejados."
 HOL_mocro.4.a:0 "Agir com base nas mensagens interceptadas"
 HOL_mocro.4.b:0 "Não temos pessoal para seguir todas as pistas"
 HOL_mocro.5.t:0 "Dinheiro Sujo em Tijolo e Cimento"
 HOL_mocro.5.d:0 "Os investigadores rastrearam lucros lavados do tráfico em imóveis, restaurantes e pequenos negócios por todo o país. Desvendar a propriedade será lento e politicamente delicado."
 HOL_mocro.5.a:0 "Confiscar os bens"
 HOL_mocro.5.b:0 "Fazer vista grossa"
 HOL_mocro.6.t:0 "Uma Geração Perdida"
 HOL_mocro.6.d:0 "Aliciadores atraem adolescentes de bairros pobres para o tráfico com dinheiro fácil e status, enquanto uma violenta subcultura juvenil glorifica a vida de gângster."
 HOL_mocro.6.a:0 "Financiar programas de prevenção e para a juventude"
 HOL_mocro.6.b:0 "Responder com uma repressão dura"
 HOL_mocro.7.t:0 "Corrupção no Porto"
 HOL_mocro.7.d:0 "Uma investigação interna descobriu funcionários da alfândega, trabalhadores portuários e policiais na folha de pagamento de redes criminosas. Eliminá-los corre o risco de paralisar as operações do porto."
 HOL_mocro.7.a:0 "Expurgar os funcionários corruptos"
 HOL_mocro.7.b:0 "Não há provas para agirmos"
 HOL_mocro.8.t:0 "O Julgamento Marengo Chega a um Veredito"
 HOL_mocro.8.d:0 "Após anos de processo sob segurança extraordinária, o tribunal condenou os líderes do mais notório sindicato do crime do país. É uma vitória histórica para o Estado de Direito."
 HOL_mocro.8.a:0 "Justiça foi feita"
 VVD_Leader_Wilders:0 "§YGeert Wilders§! é o Líder do VVD £HOL_western_liberal"
 HOL_wilders_vvd_firebrand:0 "Agitador da Mídia"
 HOL_wilders_vvd_firebrand_desc:0 "Sua presença incansável na imprensa e no parlamento mantém os rivais na defensiva e endurece o partido contra pressões externas."
 HOL_voice_of_the_discontented:0 "Voz dos Descontentes"
 HOL_voice_of_the_discontented_desc:0 "Ele fala pelos eleitores que os outros ignoram, ligando-os ao partido enquanto protege o país de interferências estrangeiras."
 HOL_asylum_clampdown:0 "Repressão ao Asilo"
 HOL_asylum_clampdown_desc:0 "Regras de entrada mais rígidas e procedimentos mais rápidos reduzem drasticamente as novas chegadas, aliviando a pressão sobre a habitação e o mercado de trabalho."
 HOL_politics.82.t: "Asilo Stop"
 HOL_politics.82.d: "Os centros de acolhimento estão sobrecarregados e a população exige medidas. Wilders pressiona por uma resposta o mais severa possível ao fluxo de requerentes de asilo."
 HOL_politics.82.a:0 "Impor um limite legal rigoroso"
 HOL_politics.82.b:0 "Ordenar deportações em massa"
 HOL_politics.83.t:0 "O Debate sobre a Integração"
 HOL_politics.83.d:0 "Wilders provoca um debate nacional sobre o Islã, a integração e a identidade holandesa. O partido deve decidir até onde ir."
 HOL_politics.83.a:0 "Tornar obrigatórios cursos de assimilação"
 HOL_politics.83.b:0 "Defender a liberdade de expressão e confrontar"
 HOL_politics.84.t:0 "Embaixada em Jerusalém"
 HOL_politics.84.d:0 "Fervoroso amigo de Israel, Wilders pede ao governo que reconheça Jerusalém e transfira para lá a embaixada holandesa. Washington aplaudiria, mas capitais de toda a região alertam para as consequências."
 HOL_politics.84.a:0 "Transferir a embaixada para Jerusalém"
 HOL_politics.84.b: "Mantenha a embaixada em Telavive."
 HOL_polder_model: "O Modelo Polder"
 HOL_polder_model_desc: "O Modelo Polder é a tradição holandesa de formulação de políticas baseada no consenso, em que o governo, os empregadores e os sindicatos negoceiam acordos alargados em vez de impor decisões. Enraizado em séculos de gestão cooperativa da água, privilegia o compromisso e coligações estáveis, conferindo à política holandesa resiliência e credibilidade diplomática, à custa de reformas mais lentas e ponderadas."
 HOL_politics.85.t: "França adere à Partição"
 HOL_politics.85.d: "Paris aceitou a nossa proposta e vai pressionar a Bélgica para que realize um referendo sobre o seu futuro. As bases para a partição estão lançadas. Podemos agora impulsionar o processo através das nossas decisões em relação à Bélgica."
 HOL_politics.85.a: "Excelente"
 BNL_aswf_frigates_remaining_tt:0 "Menos de quatro fragatas ASWF foram entregues"
 BNL_lay_down_aswf_frigate:0 "Assentar uma Fragata ASWF"
 BNL_lay_down_aswf_frigate_desc:0 "O programa de Fragata de Guerra Antissubmarino é um esforço conjunto belgo-holandês para substituir as envelhecidas fragatas das classes Karel Doorman e Wielingen por quatro cascos modernos, dois para a Marinha Real Holandesa e dois para o Componente Naval Belga. Construído em torno de um casco silencioso, um conjunto de sonar de arrasto e um helicóptero ASW embarcado, cada navio é assentado nos estaleiros da Damen ao longo de um ciclo completo de construção antes de integrar a frota."
 BNL_aswf_capability_update:0 "Atualização de Capacidades de Meia-Vida da ASWF"
 BNL_aswf_capability_update_desc: "Com as quatro fragatas de guerra anti-submarina em serviço, o gabinete binacional do programa autoriza uma modernização de meia-vida. A propulsão melhorada, um conjunto de sonares melhorado, células de defesa aérea reforçadas e uma instalação para helicópteros modernizada manterão a classe competitiva contra as ameaças dos submarinos modernos durante o maior tempo possível até ao final da sua vida útil."
 HOL_deploy_islands_commando: "Desdobrar comandos para as ilhas exteriores."
 HOL_gulden_reintroduced: "§Y[HOL.GetNameWithFlag]§! Reintroduziu o $gulden$ como moeda nacional."
 HOL_marinestudie_tt:0 "Novos §YLíderes Navais§! podem receber a característica §Y$HOL_navy_moderniser_leader$§! ao serem promovidos."
 HOL_navy_moderniser_leader:0 "Modernizador Naval"
 HOL_nationalist_populism_modifier:0 "Sociedade Nacionalista"
 HOL_FAD_GER_declined:0 "§Y[GER.GetNameWithFlag]§! deixou o projeto"
 HOL_FAD_construction:0 "Construção do Future Air Defender"
 HOL_FAD_construction_desc:0 "Nossos estaleiros estão construindo as fragatas de defesa aérea Future Air Defender. Ao término do programa, os navios concluídos são comissionados diretamente na frota."
 HOL_FAD_delay_reduced_tt:0 "Um novo parceiro encurta o tempo restante de construção"
 HOL_FAD_ger_withdrew_tt:0 "A retirada da Alemanha atrasa a construção restante"
 HOL_military.038.t:0 "O Future Air Defender em uma Encruzilhada"
 HOL_military.038.d:0 "O Future Air Defender enfrentou custos crescentes e requisitos divergentes, e os estaleiros precisam de mais dinheiro para manter o cronograma. O Bundestag deve decidir se aumenta sua parcela do financiamento ou se se retira do programa."
 HOL_military.038.a:0 "Aumentar nosso financiamento"
 HOL_military.038.b:0 "Retirar-se do programa"
 HOL_ing_group_upgrades_tt:0 "Expansões internacionais do ING: §Y[?HOL_ing_group_upgrades|0]§!/3"
 HOL_daf_organization: "DAF"
 HOL_werkspoor_equipment_manufacturer_mio_header_diesel_locomotive_program:0 "Programa de Locomotivas a Diesel"
 HOL_werkspoor_equipment_manufacturer_mio_header_industrial_diversification:0 "Diversificação Industrial"
 BEL_sabiex_international_tank_manufacturer_mio_header_m113_heritage:0 "Legado do M113"
 BEL_sabiex_international_tank_manufacturer_mio_header_wheeled_armour:0 "Blindados sobre Rodas"
 BEL_sabiex_international_tank_manufacturer_mio_header_logistics_fleet:0 "Frota Logística"
 Pim_Fortuyn_Alive:0 "Pim Fortuyn Vivo"
 HOL_wilders_party_created:0 "Partido da Liberdade Criado"
 HOL_D66_in_progress_flag:0 "Foco do D66 em Andamento"
 HOL_SGP_in_progress_flag:0 "Foco do SGP em Andamento"
 HOL_GL_in_progress_flag:0 "Foco do GroenLinks em Andamento"
 HOL_failed_declaring_war_voc:0 "Falha ao Declarar Guerra pela VOC"
 HOL_suriname_accepted_infrastructure:0 "Acordo de Infraestrutura do Suriname Aceito"
 HOL_accepted_FRA_carrier:0 "Assistência Francesa para Porta-aviões Aceita"
 HOL_claim_german_leadership_tt:0 "A receita do governo excede as despesas do governo."
 HOL_voc_india_christian_tt:0 "A opinião da comunidade cristã sobre o governo indiano está abaixo de 50%."
 HOL_asml_high_na_innovation_monopoly:0 "Monopólio de Inovação High-NA"
 HOL_asml_high_na_innovation_monopoly_desc:0 "A ASML combina produção EUV madura, liderança em High-NA e uma rede de fornecedores resiliente. A capacidade holandesa de pesquisa e serviço sustenta sua posição única em litografia avançada."
 HOL_asml_resilient_european_tooling_network:0 "Rede Europeia de Ferramentas Resiliente"
 HOL_asml_resilient_european_tooling_network_desc:0 "A ASML ancora uma rede europeia diversificada de fornecedores de precisão e equipes de serviço de campo. A confiabilidade e o suporte ao cliente convertem a demanda por equipamentos em receita de exportação duradoura."
 HOL_asml_neutral_global_lithography_utility:0 "Utilidade Global Neutra de Litografia"
 HOL_asml_neutral_global_lithography_utility_desc:0 "A ASML atende clientes qualificados de todos os blocos políticos sob uma política de alocação comercialmente neutra. O acesso amplo sustenta parcerias de pesquisa e receita de exportação."
 HOL_asml_strategic_western_gatekeeper:0 "Guardião Estratégico do Ocidente"
 HOL_asml_strategic_western_gatekeeper_desc:0 "A política de licenciamento holandesa concentra o acesso a sistemas avançados entre parceiros estratégicos. A política fortalece a influência nacional, mas reduz o alcance comercial da ASML."
 HOL_asml_commercial_tooling_champion:0 "Campeã Comercial de Equipamentos"
 HOL_asml_commercial_tooling_champion_desc:0 "A ASML continua sendo uma fornecedora global de equipamentos lucrativa, sem alcançar um dos resultados estratégicos mais especializados. Sua posição em pesquisa e exportação ainda beneficia a economia holandesa."
 HOL_asml_backlog_pressure_moderate:0 "Fila de Ferramentas Elevada"
 HOL_asml_backlog_pressure_moderate_desc:0 "A forte demanda por litografia aumenta a carga de serviço e engenharia, ao mesmo tempo que sustenta a receita de exportação de equipamentos."
 HOL_asml_backlog_pressure_severe:0 "Fila de Ferramentas Severa"
 HOL_asml_backlog_pressure_severe_desc:0 "Uma carteira de pedidos excepcional impulsiona a receita de equipamentos, mas desvia engenheiros da pesquisa e da qualificação de clientes."
 HOL_asml_events.1.t:0 "Apostar no EUV"
 HOL_asml_events.1.d:0 "No início do século, a ASML deve decidir se a litografia por ultravioleta extremo merece investimento contínuo, apesar de problemas ainda não resolvidos na fonte e na óptica. A decisão moldará o horizonte de pesquisa da empresa."
 HOL_asml_events.1.a:0 "Apostar no longo prazo"
 HOL_asml_events.1.a_tt:0 "Liderança em Litografia: §G+1§!\nMaturidade do EUV: §G+1§!"
 HOL_asml_events.1.b:0 "Equilibrar o EUV com as plataformas atuais"
 HOL_asml_events.1.b_tt:0 "Resiliência dos Fornecedores: §G+2§!\nDiversificação de Clientes: §G+1§!"
 HOL_asml_events.2.t:0 "Consolidar o Programa EUV"
 HOL_asml_events.2.d:0 "O trabalho com protótipos expôs o quanto as fontes, a óptica, os estágios e o software do EUV dependem uns dos outros. A ASML pode consolidar o programa ou priorizar entregas de curto prazo aos clientes."
 HOL_asml_events.2.a:0 "Unificar o programa de desenvolvimento"
 HOL_asml_events.2.a_tt:0 "Maturidade do EUV: §G+1§!\nResiliência dos Fornecedores: §G+1§!"
 HOL_asml_events.2.b:0 "Proteger as entregas atuais"
 HOL_asml_events.2.b_tt:0 "Diversificação de Clientes: §G+2§!\nMaturidade do EUV: §R-1§!"
 HOL_asml_events.3.t:0 "Primeiras Ferramentas EUV Alfa"
 HOL_asml_events.3.d:0 "Os primeiros sistemas de demonstração alfa da ASML levam o EUV de componentes de laboratório a ferramentas integradas. As máquinas ainda são experimentais, e as prioridades de engenharia determinarão o que os protótipos ensinarão."
 HOL_asml_events.3.a:0 "Impulsionar as ferramentas alfa integradas"
 HOL_asml_events.3.a_tt:0 "Liderança em Litografia: §G+1§!\nMaturidade do EUV: §G+2§!"
 HOL_asml_events.3.b:0 "Priorizar a confiabilidade dos protótipos"
 HOL_asml_events.3.b_tt:0 "Maturidade do EUV: §G+1§!\nResiliência dos Fornecedores: §G+2§!"
 HOL_asml_events.4.t:0 "Adquirir a BRION"
 HOL_asml_events.4.d:0 "A litografia computacional pode ajudar os clientes a prever como máscaras e condições de processo afetam os padrões impressos. Adquirir a BRION integraria esses modelos aos scanners da ASML."
 HOL_asml_events.4.a:0 "Integrar a expertise da BRION"
 HOL_asml_events.4.a_tt:0 "Liderança em Litografia: §G+1§!\nDiversificação de Clientes: §G+1§!"
 HOL_asml_events.4.b:0 "Desenvolver a capacidade internamente"
 HOL_asml_events.4.b_tt:0 "Liderança em Litografia: §G+1§!\nControle Estratégico: §G+1§!"
 HOL_asml_events.5.t:0 "Integrar a Metrologia YieldStar"
 HOL_asml_events.5.d:0 "A metrologia YieldStar pode conectar o desempenho do scanner a medições feitas em wafers de produção. A ASML deve decidir se enfatiza o controle de processo integrado ou um modelo de serviço mais amplo."
 HOL_asml_events.5.a:0 "Integrar dados de scanner e metrologia"
 HOL_asml_events.5.a_tt:0 "Maturidade do EUV: §G+1§!\nResiliência dos Fornecedores: §G+1§!"
 HOL_asml_events.5.b:0 "Construir um modelo de serviço de metrologia"
 HOL_asml_events.5.b_tt:0 "Diversificação de Clientes: §G+2§!\nResiliência dos Fornecedores: §G+1§!"
 HOL_asml_events.6.t:0 "Entregar o NXE:3100"
 HOL_asml_events.6.d:0 "A Samsung está pronta para receber um NXE:3100 da ASML, o primeiro sistema EUV oferecido a um cliente. A entrega pode aprofundar o aprendizado do cliente, enquanto mais trabalho de laboratório poderia reduzir o risco técnico antes de uma implantação mais ampla."
 HOL_asml_events.6.a:0 "Entregar o sistema à Samsung"
 HOL_asml_events.6.a_tt:0 "Maturidade do EUV: §G+1§!\nDiversificação de Clientes: §G+1§!"
 HOL_asml_events.6.b:0 "Estender a validação em laboratório"
 HOL_asml_events.6.b_tt:0 "Maturidade do EUV: §G+2§!\nDiversificação de Clientes: §R-1§!"
 HOL_asml_events.7.t:0 "Programa de Coinvestimento de Clientes"
 HOL_asml_events.7.d:0 "A ASML está pedindo aos principais clientes que coinvistam na capacidade de pesquisa necessária para a litografia de próxima geração. A Samsung pode ser convidada a participar, ou a empresa holandesa pode preservar o controle por meio de financiamento interno."
 HOL_asml_events.7.a:0 "Convidar a Samsung a participar"
 HOL_asml_events.7.a_tt:0 "Diversificação de Clientes: §G+1§!\nControle Estratégico: §G+1§!\nA Samsung recebe um evento de resposta negociada quando a Coreia estiver disponível."
 HOL_asml_events.7.b:0 "Financiar o programa internamente"
 HOL_asml_events.7.b_tt:0 "Controle Estratégico: §G+2§!\nDiversificação de Clientes: §R-1§!"
 HOL_asml_events.8.t:0 "Integrar a Cymer"
 HOL_asml_events.8.d:0 "A engenharia de fontes de luz da Cymer é central para a produtividade e a disponibilidade do EUV. Trazer a fornecedora para dentro da ASML pode melhorar a coordenação, enquanto uma estratégia de fontes diversificadas preservaria mais redundância externa."
 HOL_asml_events.8.a:0 "Integrar as equipes de fontes da Cymer"
 HOL_asml_events.8.a_tt:0 "Maturidade do EUV: §G+1§!\nResiliência dos Fornecedores: §G+2§!"
 HOL_asml_events.8.b:0 "Manter o trabalho com fontes diversificadas"
 HOL_asml_events.8.b_tt:0 "Resiliência dos Fornecedores: §G+2§!\nMaturidade do EUV: §G+1§!"
 HOL_asml_events.9.t:0 "Preparar o NXE:3400"
 HOL_asml_events.9.d:0 "A geração NXE:3400 deve transformar o desempenho do EUV em um sistema adequado à fabricação em volume. A ASML pode acelerar a comercialização ou usar um aumento mais lento para proteger a confiabilidade."
 HOL_asml_events.9.a:0 "Preparar a implantação comercial"
 HOL_asml_events.9.a_tt:0 "Maturidade do EUV: §G+1§!\nDiversificação de Clientes: §G+1§!"
 HOL_asml_events.9.b:0 "Usar um aumento conservador"
 HOL_asml_events.9.b_tt:0 "Resiliência dos Fornecedores: §G+2§!\nMaturidade do EUV: §G+1§!"
 HOL_asml_events.10.t:0 "Validação Comercial do EUV"
 HOL_asml_events.10.d:0 "O EUV está se tornando uma tecnologia de produção nas principais fundições. A ASML pode se concentrar no desempenho do sistema ou expandir a organização de serviço necessária para sustentar uma base instalada crescente."
 HOL_asml_events.10.a:0 "Validar a plataforma comercial"
 HOL_asml_events.10.a_tt:0 "Liderança em Litografia: §G+1§!\nMaturidade do EUV: §G+1§!"
 HOL_asml_events.10.b:0 "Ampliar primeiro o atendimento ao cliente"
 HOL_asml_events.10.b_tt:0 "Diversificação de Clientes: §G+2§!\nResiliência dos Fornecedores: §G+1§!"
 HOL_asml_events.11.t:0 "O Centésimo Sistema EUV"
 HOL_asml_events.11.d:0 "O centésimo sistema EUV despachado pela ASML marca um forte aumento da base instalada. A empresa deve acompanhar o crescimento da produção com peças de reposição, engenheiros de campo e suporte ao cliente."
 HOL_asml_events.11.a:0 "Expandir o serviço junto com as entregas"
 HOL_asml_events.11.a_tt:0 "Resiliência dos Fornecedores: §G+2§!\nDiversificação de Clientes: §G+1§!"
 HOL_asml_events.11.b:0 "Priorizar o volume de entregas"
 HOL_asml_events.11.b_tt:0 "Diversificação de Clientes: §G+2§!\nResiliência dos Fornecedores: §R-1§!"
 HOL_asml_events.12.t:0 "Entregar o Primeiro Sistema High-NA"
 HOL_asml_events.12.d:0 "O primeiro sistema EUV High-NA da ASML traz uma abertura numérica maior e uma nova geração de desafios de integração de processo, e a Intel quer recebê-lo primeiro. A entrega antecipada pode provar a liderança técnica ou apoiar um piloto mais amplo com clientes."
 HOL_asml_events.12.a:0 "Entregar o primeiro sistema completo"
 HOL_asml_events.12.a_tt:0 "Liderança em Litografia: §G+1§!\nMaturidade do EUV: §G+2§!"
 HOL_asml_events.12.b:0 "Ampliar o piloto com clientes"
 HOL_asml_events.12.b_tt:0 "Maturidade do EUV: §G+1§!\nDiversificação de Clientes: §G+2§!"
 HOL_asml_events.13.t:0 "Inaugurar o Laboratório High-NA da imec"
 HOL_asml_events.13.d:0 "A ASML e a imec estão inaugurando um laboratório High-NA conjunto, onde clientes e fornecedores podem testar materiais, máscaras e fluxos de processo. A instalação pode enfatizar a validação compartilhada ou o controle proprietário."
 HOL_asml_events.13.a:0 "Inaugurar o laboratório conjunto"
 HOL_asml_events.13.a_tt:0 "Resiliência dos Fornecedores: §G+1§!\nDiversificação de Clientes: §G+1§!"
 HOL_asml_events.13.b:0 "Manter a validação proprietária"
 HOL_asml_events.13.b_tt:0 "Liderança em Litografia: §G+1§!\nControle Estratégico: §G+2§!"
 HOL_asml_events.14.t:0 "Ampliar os Controles de Exportação Avançados"
 HOL_asml_events.14.d:0 "O governo holandês está ampliando os controles sobre equipamentos avançados de fabricação de semicondutores, o que na prática significa decidir para quem a ASML pode vender. O licenciamento pode seguir uma política de segurança estratégica ou manter uma alocação mais ampla entre clientes qualificados."
 HOL_asml_events.14.a:0 "Adotar o licenciamento estratégico"
 HOL_asml_events.14.a_tt:0 "Controle Estratégico: §G+3§!\nDefine a postura de mercado de Licenciamento Estratégico."
 HOL_asml_events.14.b:0 "Preservar a alocação aberta"
 HOL_asml_events.14.b_tt:0 "Diversificação de Clientes: §G+1§!\nControle Estratégico: §R-2§!\nDefine a postura de mercado de Alocação Aberta de Clientes."
 HOL_asml_events.15.t:0 "Avaliar a Posição Estratégica da ASML"
 HOL_asml_events.15.d:0 "As escolhas acumuladas da ASML agora definem sua posição em litografia avançada, coordenação de fornecedores, atendimento ao cliente e licenciamento de exportação. Esta avaliação final é uma síntese de jogabilidade, e não uma medição histórica."
 HOL_asml_events.15.a:0 "Definir o resultado estratégico da ASML"
 HOL_asml_events.15.a_tt:0 "Aplica exatamente um desfecho final da ASML de acordo com as cinco pontuações corporativas limitadas."
 HOL_asml_technology_threshold_tt:0 "Requer Liderança em Litografia acima de 7 e Maturidade do EUV acima de 5."
 HOL_conservative_society_modifier:0 "Sociedade Conservadora"
 HOL_FAD_member:0 "É membro do programa Future Air Defender"
 HOL_common_event.19.t: "The Pim Fortuyn List"
 HOL_common_event.19.d: "Livable Netherlands has dropped Pim Fortuyn as its lead candidate after his remarks on Islam and immigration in a newspaper interview. Within days Fortuyn has launched his own party, the Pim Fortuyn List, and former Livable Netherlands members are joining it ahead of the general election."
 HOL_common_event.19.a: "The Fortuyn revolt has its own banner."
 HOL_marine_modified_idea: "Revised Marine Relocation Plan"
 HOL_usa_taiwan_compensation: "Taiwan Compensation Payments"
 USA_Taiwan_Compensation_Benefit: "Dutch Compensation for Taiwan"
 HOL_prepare_dutch_invasion: "$HOL_prepare_for_dutch_invasion$"
 HOL_mocro.9.t: "Fat Jos Spotted in Sierra Leone"
 HOL_mocro.9.d: "Footage of a New Year's Mass in Tihun, the home town of the President of Sierra Leone, shows Jos Leijdekkers seated a few rows behind the President and the First Lady. The Breda-born cocaine broker, sentenced to 24 years in absentia and on the Dutch and European most wanted lists, has been living openly in Sierra Leone under a false name. While he walks free abroad, his network keeps cocaine flowing through Dutch ports."
 HOL_mocro.9.a: "He cannot hide forever"
 HOL_mocro.10.t: "A Turkish Investor Named Omar Sheriff"
 HOL_mocro.10.d: "A wealthy young businessman calling himself Omar Sheriff has arrived in Freetown from Turkey. He is spending lavishly on property, businesses, and well-placed friends. A few officials whisper that his passport is false and that he matches a Dutchman wanted across Europe. His money says otherwise to many in our government."
 HOL_mocro.10.a: "His money is welcome here"
 HOL_mocro.10.b: "Hand him over to the Dutch"
 HOL_mocro.11.t: "Dutch Extradition Request"
 HOL_mocro.11.d: "The Dutch embassy has formally requested the arrest and extradition of Jos Leijdekkers. Handing him over would please The Hague, but he has spread a great deal of money among people who matter in Freetown.\nDutch pressure so far: §Y[?HOL_bolle_jos_pressure|0]§!/3"
 HOL_mocro.11.a: "Extradite him"
 HOL_mocro.11.b: "He is under our protection"
 HOL_mocro.12.t: "Fat Jos Extradited"
 HOL_mocro.12.d: "Sierra Leonean police have arrested Jos Leijdekkers and placed him on a flight to Schiphol, where Dutch officers took him into custody. Without its leader, his network is in disarray."
 HOL_mocro.12.a: "Justice catches up with him"
 HOL_mocro.13.t: "Freetown Refuses"
 HOL_mocro.13.d: "The government of Sierra Leone has rejected our extradition request, citing a lack of evidence and the absence of an extradition treaty. Few in The Hague doubt that money has changed hands."
 HOL_mocro.13.a: "Keep the diplomatic channel open"
 HOL_mocro.13.b: "Then we raise the stakes"
 HOL_mocro.14.t: "Commandos Seize Fat Jos"
 HOL_mocro.14.d: "In a night operation in Freetown, Dutch special forces seized Jos Leijdekkers and flew him out of the country. The public cheers, but Sierra Leone denounces the raid as a violation of its sovereignty."
 HOL_mocro.14.a: "Bring him home"
 HOL_mocro.15.t: "Raid in Freetown Fails"
 HOL_mocro.15.d: "Our operation to seize Jos Leijdekkers has failed. He was warned in time and has gone to ground, and the government of Sierra Leone is furious at the intrusion."
 HOL_mocro.15.a: "A costly failure"
 HOL_mocro.16.t: "Dutch Forces Violate Our Sovereignty"
 HOL_mocro.16.d: "Dutch special forces have carried out an armed operation in Freetown without our consent. Whatever the target, the raid is an affront to our sovereignty."
 HOL_mocro.16.a: "We will remember this"
 HOL_mocro.17.t: "Fat Jos Taken in Freetown"
 HOL_mocro.17.d: "Our operatives seized Jos Leijdekkers as he left his villa and put him on a private flight out of Sierra Leone. He is now in Dutch custody. Freetown suspects who was behind it, but it has no proof."
 HOL_mocro.17.a: "Justice catches up with him"
 HOL_mocro.18.t: "Capture Attempt Fails"
 HOL_mocro.18.d: "Our attempt to seize Jos Leijdekkers has failed. His bodyguards changed his route at the last moment, and our operatives had to pull out. He is still in the villa, but he will not leave it so carelessly again."
 HOL_mocro.18.a: "Then we send in the commandos"
 HOL_mocro.19.t: "Shooting in Scheveningen"
 HOL_mocro.19.d: "A rival criminal has been shot and a bystander wounded in Scheveningen. Police have arrested Jos Leijdekkers, a 20-year-old from Prinsenbeek near Breda who already has a record. He faces several years in prison."
 HOL_mocro.19.a: "Another young man with a gun"
 HOL_mocro.20.t: "A Broker Named Fat Jos"
 HOL_mocro.20.d: "A tip has linked Jos Leijdekkers, known in the underworld as Fat Jos (Bolle Jos), to several cocaine investigations. Since his release from prison for the Scheveningen shooting, he has become an influential broker who arranges shipments through the ports of Rotterdam and Antwerp. Before investigators could act, he left the country for Spain and then Dubai."
 HOL_mocro.20.a: "He will not stay ahead of us"
 HOL_mocro.21.t: "Fat Jos Settles in Turkey"
 HOL_mocro.21.d: "Jos Leijdekkers has moved his base to Turkey. Turkish police have reportedly arrested him twice, and both times he was released after money changed hands. From Turkey he keeps running cocaine shipments into the Low Countries."
 HOL_mocro.21.a: "Money opens every door"
 HOL_mocro.22.t: "Fat Jos Added to the Most Wanted Lists"
 HOL_mocro.22.d: "Jos Leijdekkers has been placed on the Dutch National Most Wanted list and the EU Most Wanted list. Prosecutors suspect him of trafficking tonnes of cocaine and of ordering a murder. Shortly afterwards he leaves Turkey, and his trail goes cold."
 HOL_mocro.22.a: "Every police force in Europe is looking now"
 HOL_mocro.23.t: "Sentenced to 24 Years in Absentia"
 HOL_mocro.23.d: "The Rotterdam District Court has sentenced Jos Leijdekkers in absentia to 24 years in prison for organizing the import of tonnes of cocaine and for ordering a murder. Belgian courts have handed down further sentences. Where he is now remains unknown to the public."
 HOL_mocro.23.a: "Now we only need to bring him home"
 HOL_bolle_jos_capture_op_tt: "Our operatives try to seize §YFat Jos§!. If they fail, a §Yspecial forces raid§! becomes available."
 HOL_bolle_jos_raid_unlocked_tt: "Unlocks the §YCapture Fat Jos§! special forces raid against [SIE.GetNameDef]."
 HOL_bolle_jos_pressure_tt: "Raises the chance that [SIE.GetNameDef] accepts our next extradition request."
 HOL_bolle_jos_pressure_below_max_tt: "Dutch pressure on [SIE.GetNameDef] is below §Y3§!"
 HOL_bolle_jos_extradition_cooldown: "Extradition request recently sent"
 HOL_bolle_jos_raid_cooldown: "Raid on §YFat Jos§! recently attempted"
 HOL_bolle_jos_located_tt: "We locate §YFat Jos§!, which allows a capture operation."
 HOL_bolle_jos_raid_threat: "Dutch Raid in §Y[SIE.GetNameWithFlag]§!"
 HOL_request_bolle_jos_extradition: "Request Extradition of Fat Jos"
 HOL_request_bolle_jos_extradition_desc: "Formally ask [SIE.GetNameDef] to arrest Jos Leijdekkers and hand him over to Dutch justice."
 HOL_pressure_sierra_leone_bolle_jos: "Pressure §Y[SIE.GetNameWithFlag]§!"
 HOL_pressure_sierra_leone_bolle_jos_desc: "Freeze aid talks, summon the ambassador, and make clear that sheltering a wanted drug lord has a price."
 HOL_offer_sierra_leone_development_deal: "Offer §Y[SIE.GetNameWithFlag]§! a Development Deal"
 HOL_offer_sierra_leone_development_deal_desc: "Offer development funding and law enforcement cooperation, making extradition worth more to Freetown than his money."
 HOL_locate_bolle_jos_fallback: "Track Down Fat Jos"
 HOL_locate_bolle_jos_fallback_desc: "Send investigators and informants to pinpoint where Jos Leijdekkers is hiding in §Y[SIE.GetNameWithFlag]§!."
 HOL_bolle_jos_snatch_operation: "Snatch Fat Jos"
 HOL_bolle_jos_snatch_operation_desc: "Send a small team into Freetown to seize Jos Leijdekkers without the consent of the local government. If it fails, the diplomatic fallout will be severe."
 HOL_bolle_jos_patronage: "Fat Jos's Patronage"
 HOL_bolle_jos_patronage_desc: "A fugitive Dutch drug lord is pouring money into property, businesses, and officials across Freetown. His cash fills the treasury and buys loyalty, but it corrodes our institutions.\n\nThis national spirit will be remove when he leaves §Y[SIE.GetNameWithFlag]§!\n§Y[HOL.GetNameWithFlag]§! may act against us to get him back."