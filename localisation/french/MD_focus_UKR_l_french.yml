 UKR_develop_domestic_btr4_category_desc: "\n\n\n\n\n\n£UKR_desctext_btr4_main\n\n\n\n\n\n\n\n\nWe can spend time and money researching and testing the completely new domestic design of modern APC."
 ukraine_strat_bombers_problem.1.t: "Ukraine's Long Range Aviation"
 ukraine_strat_bombers_problem.1.d: "Following the dissolution of the §RSoviet Union§!, §G[UKR.GetNameWithFlag]§! inherited a significant strategic aviation force. However, maintaining these aircraft is becoming an increasingly heavy burden on the state. Most of the aircraft are sitting idle, require expensive maintenance, and are gradually losing their operational capability.\n\n§G[UKR.GetNameWithFlag]§! must now decide what to do with its remaining strategic bombers."
 ukraine_strat_bombers_problem.1.a: "We must make a decision."
 ukraine_strat_bombers_problem.2.t: "An Offer from Moscow"
 ukraine_strat_bombers_problem.2.d: "On 8 October 1999, the §R[SOV.GetNameWithFlag]§! government offered to take over the Long Range Aviation of §G[UKR.GetNameWithFlag]§!, consisting of 7 §GTu-160§!, 3 §GTu-95MS§! and 575 Kh-55 cruise missiles, as payment toward our outstanding gas debts. The deal would reduce the costs of maintaining the aircraft and provide §Y[UKR.GetNameWithFlag]§! with some financial relief.\n\nHowever, accepting the deal would also mean surrendering a significant part of §GUkraine's§! strategic aviation capability, and our experts have estimated that the bombers themselves are worth much more than the debt (275 million Ukrainian hryvnia) that the Russians are supposed to write off."
 ukraine_strat_bombers_problem.2.a: "Continue with the agreement."
 ukraine_strat_bombers_problem.2.b: "Russians are trying to trick us."
 ukraine_strat_bombers_problem.3.t: "The Fate of the Remaining Aircraft"
 ukraine_strat_bombers_problem.3.d: "Following the transfer of part of Ukraine's Long Ranged Aviation fleet to Russia, a significant number of aging aircraft still remain. Keeping them operational requires resources that the state can scarcely afford.\n\n§G[USA.GetNameWithFlag]§!, §G[GER.GetNameWithFlag]§!, §G[FRA.GetNameWithFlag]§! and §G[ENG.GetNameWithFlag]§! want us to follow the disarmament agreements and scrap them, However, another option remains: attempting to preserve the remaining aircraft as part of the Ukrainian Air Force."
 ukraine_strat_bombers_problem.3.a: "Dismantle the remaining aircraft."
 ukraine_strat_bombers_problem.3.b: "Preserve them and attempt to restore them."
 ukraine_strat_bombers_problem.4.t: "The Last Ukrainian Tu-160"
 ukraine_strat_bombers_problem.4.d: "The dismantling of Ukraine's strategic aviation continues. The remaining §YTu-160§!, named §R26 RED§!, has been designated for a museum stand at the Poltava aviation museum.\n\nThis is the end of the Ukrainian §YTu-160§! fleet."
 ukraine_strat_bombers_problem.4.a: "What a tragic fate."
 ukraine_strat_bombers_problem.5.t: "A Note from the West"
 ukraine_strat_bombers_problem.5.d: "Our Western partners have notified us that we have not got rid of our §YTu-22M3§! fleet, and that we have about a month to start their disposal, or else we will face consequences. \n\nWe either need to leave it as it is, or remove our §YTu-22M3§! airwings. We have a month to do so."
 ukraine_strat_bombers_problem.5.a: "We will see."
 ukraine_strat_bombers_problem.6.t: "The consequences of our actions"
 ukraine_strat_bombers_problem.6.d: "Just as they warned us, investments in our economy have stopped, which will significantly worsen our economic situation."
 ukraine_strat_bombers_problem.6.a: "Too bad"
 ukraine_strat_bombers_problem.7.t: "Western Approval"
 ukraine_strat_bombers_problem.7.d: "Ukraine's decision to abandon its remaining Long Range Aviation has been welcomed by Western countries. Washington and European capitals view the dismantling of Ukraine's Soviet strategic legacy as an important step toward closer cooperation with NATO and preventing the spread of nuclear weapons."
 ukraine_strat_bombers_problem.7.a: "We made the right choice."
 ukraine_strat_bombers_problem.8.t: "The Fate of the Remaining Aircraft"
 ukraine_strat_bombers_problem.8.d: "[UKR.GetNameWithFlag] has refused to transfer its Long Range Aviation to [SOV.GetNameWithFlag], leaving the entire fleet under Ukrainian control. However, the aircraft are aging, expensive to maintain, and increasingly difficult to keep operational.\n\n§G[USA.GetNameWithFlag]§!, §G[GER.GetNameWithFlag]§!, §G[FRA.GetNameWithFlag]§! and §G[ENG.GetNameWithFlag]§! want us to follow the disarmament agreements and scrap them. However, another option remains: attempting to preserve the remaining aircraft as part of the Ukrainian Air Force.\n\nRestoring the bombers would be §Ga particularly important military project§!, and the §YVerkhovna Rada§! would be more willing to approve a higher military budget."
 ukraine_strat_bombers_problem.8.a: "Dismantle the remaining aircraft."
 ukraine_strat_bombers_problem.8.b: "Preserve them and attempt to restore them."
 ukraine_strat_bombers_problem.9.t: "The Last Ukrainian Tu-160"
 ukraine_strat_bombers_problem.9.d: "The dismantling of Ukraine's strategic aviation continues. The remaining §YTu-160§!, named §R26 RED§!, has been designated for a museum stand at the Poltava aviation museum.\n\nThis is the end of the Ukrainian §YTu-160§! fleet."
 ukraine_strat_bombers_problem.9.a: "What a tragic fate."
 ukraine_strat_bombers_problem.12.t: "Western Approval"
 ukraine_strat_bombers_problem.12.d: "Ukraine's decision to abandon its remaining Long Range Aviation has been welcomed by Western countries. Washington and European capitals view the dismantling of Ukraine's Soviet strategic legacy as an important step toward closer cooperation with the West."
 ukraine_strat_bombers_problem.12.a: "We made the right choice."
 ukraine_strat_bombers_problem.10.t: "A Note from the West"
 ukraine_strat_bombers_problem.10.d: "Our Western partners have notified us that we have not yet begun the disposal of our §YTu-22M3§! fleet. They have given us approximately one month to begin their dismantling, or we will face consequences. \n\nWe either need to leave it as it is, or remove our §YTu-22M3§! airwings. We have a month to do so."
 ukraine_strat_bombers_problem.10.a: "We will see."
 ukraine_strat_bombers_problem.11.t: "The consequences of our actions"
 ukraine_strat_bombers_problem.11.d: "Just as they warned us, investments in our economy have stopped, which will significantly worsen our economic situation."
 ukraine_strat_bombers_problem.11.a: "Too bad"
