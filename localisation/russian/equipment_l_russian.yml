 LRP_infantry_weapons_6_desc: "АК-12 — новый российский автомат. Он был разработан в рамках программы экипировки солдата будущего «Ратник». Созданный для специализированных подразделений, он должен заменить производство АК-103. АК-12 имеет улучшенный баланс и эргономику, что делает его самым элитным российским автоматом на сегодняшний день."
 SPR_infantry_weapons_5_desc: "Модель G36A2 - это обновленный вариант модели G36. G36A2 оснащен быстросъемным коллиматорным прицелом Zeiss RSA, установленным на планке Пикатинни, который заменяет оригинальный коллиматорный прицел в сдвоенной боевой прицельной системе. Модернизированный комплект G36A2 также состоит из укороченного приклада G36C, нового цевья из алюминия с дополнительными четырьмя планками Пикатинни и вертикальной рукоятки со встроенным переключателем для управления лазерным модулем Oerlikon Contraves LLM01."
 SPR_infantry_weapons_6_desc: "Винтовка G36A3 представляет собой дальнейшую модернизацию платформы G36; с увеличенной планкой Пикатинни, 4-позиционным убирающимся прикладом и интегрированным оптическим коллиматорным прицелом Zeiss RSA / ручкой для переноски, замененной оптическим блоком Hensoldt."
 SPR_infantry_weapons_8_desc: "Heckler & Koch 433 (HK433) — современная модульная компактная штурмовая винтовка под патрон 5,56x45 мм, сочетающая сильные стороны и выдающиеся характеристики предыдущих штатных винтовок G36 и HK416. HK 433 оснащена новым складным телескопическим прикладом с регулируемым по высоте упором для щеки для повышения точности стрельбы; оружие также можно использовать со сложенным прикладом в ситуациях ближнего боя (CQC)."
 TAI_infantry_weapons_2_desc: "Винтовка M16, официально обозначаемая «Rifle, калибр 5,56 мм, M16», представляет собой семейство армейских винтовок, созданных на основе винтовки ArmaLite AR-15 для Вооружённых сил США. Оригинальная винтовка M16 представляла собой автоматическую винтовку калибра 5,56 мм с магазином на 20 патронов."
 VIE_infantry_weapons_1_desc: "АКМ, разработанный в 1959 году, является наиболее распространенным модернизированным вариантом автомата АК-47, разработанного Михаилом Калашниковым. Он значительно легче и точнее в автоматическом режиме, чем его предшественник."
