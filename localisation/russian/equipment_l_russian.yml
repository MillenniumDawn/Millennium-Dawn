 attack_helicopter_6: "Ударный вертолёт 2055 года"
 attack_helicopter_6_desc: "Ударный вертолёт — это военный вертолёт, оснащённый наступательным вооружением. Его основное оружие — скорострельные автоматические орудия (пушки и пулемёты), ракетные установки и высокоточное управляемое оружие (ракеты). Многие ударные вертолёты также могут оснащаться зенитными ракетами, но они используются в основном для самообороны. Современные ударные вертолёты по своим функциям схожи со штурмовиками и специально предназначены для поражения наземных целей, таких как пехота, бронетехника и здания."
 attack_helicopter_7: "Ударный вертолёт 2075 года"
 attack_helicopter_7_desc: "Ударный вертолёт — это военный вертолёт, оснащённый наступательным вооружением. Его основное оружие — скорострельные автоматические орудия (пушки и пулемёты), ракетные установки и высокоточное управляемое оружие (ракеты). Многие ударные вертолёты также могут оснащаться зенитными ракетами, но они используются в основном для самообороны. Современные ударные вертолёты по своим функциям схожи со штурмовиками и специально предназначены для поражения наземных целей, таких как пехота, бронетехника и здания."
