 HACS_equipment: "HACS"
 HACS_equipment_desc: "고기동 전투 체계(HACS)는 신세대 기계화 전투 병기입니다. 우수한 기동성과 첨단 무장을 갖춘 HACS 병기는 전장을 지배하고 키메라 세력에 맞서 다양한 전투 상황에 적응하도록 설계되었습니다."
 HACS_0: "HACS Mk. I"
 HACS_0_desc: "HACS Mk. I은 고기동 전투 체계 병기의 1세대 모델입니다. 기본적인 무장과 장갑을 갖추고 있으며, 키메라 세력에 맞선 지상 교전을 위한 신뢰할 만한 플랫폼 역할을 합니다."
 HACS_1: "HACS Mk. II"
 HACS_1_desc: "또 다른 세대의 HACS 기체는 이전 버전보다 더욱 민첩합니다. 민간인들이 제공한 뛰어난 설계도 덕분에 HACS Mk. II는 이전 세대보다 훨씬 치명적인 무기입니다."
 HACS_2: "HACS Mk. III"
 HACS_2_desc: "랜달라이트에 관한 최근 연구로 HACS 설계를 한층 더 개선할 수 있게 되었습니다. Mk. III 버전은 강화된 장갑과 무기 체계를 갖추어, 키메라 세력에 맞서 싸울 우리의 최고 무기가 되었습니다."
 CHIMERA_equipment: "키메라"
 CHIMERA_equipment_desc: "키메라 부대"
 CHIMERA_0: "벨라트리스"
 CHIMERA_0_desc: "벨라트리스는 최전선 전투용으로 설계된 키메라 부대입니다. 강력한 공격 능력과 두터운 장갑을 갖추고 있어 다양한 전투 상황에서 효과적입니다."
 CHIMERA_1: "브라키오니스"
 CHIMERA_1_desc: "브라키오니스는 정면 방어 능력이 뛰어난 것으로 알려진 키메라 부대이지만, 다른 키메라 부대에 비해 전반적으로 장갑은 약합니다. 가장 치명적인 무기는 근접전에서 부대를 손쉽게 박살내는 발톱이지만, 원거리에서는 취약합니다."
