 REQUEST_CIV_GNSS_ACCESS_TITLE: "민간용 위성항법시스템 접근"
 REQUEST_CIV_GNSS_ACCESS_ACTION_DESC: "강화된 항법 및 물류 조정을 위해 그들의 민간용 위성 위치 파악 네트워크에 대한 통합 접근을 요청합니다. 여기에는 표준 데이터 공유 계약, 기술적 호환성 평가, 우리 시스템을 위한 업링크 프로토콜 구축이 포함됩니다. 이러한 접근은 운송, 응급 서비스, 인프라 관리에 걸친 운영 효율성을 개선시킵니다. 수락되면 우리는 그들의 §Y민간용 위성항법시스템 위성 네트워크§!에 접근할 수 있게 됩니다."
 REQUEST_CIV_GNSS_ACCESS_LOC: "민간용 위성항법시스템 접근 요청 보내기"
