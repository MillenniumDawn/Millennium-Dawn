l_korean:
 USR_Union_state_category: "연방 국가"
 USR_Union_state_category_desc: "§Y연합 국가§!는 20세기 90년대에 창설되어 2000년에 활동을 시작한 [SOV.GetFlag]§Y러시아§!와 [BLR.GetFlag]§Y벨라루스§!의 초국가적 프로젝트입니다. 이 독특한 초국가적 실체는 두 국가가 독립을 잃지 않으면서 군사, 경제, 정치 등 여러 분야에서 통합하는 것을 전제로 합니다.\n세르비아는 한때 이 프로젝트의 일부가 되기를 원했으나 거부당했습니다. 어쩌면 이제 연합 국가는 더 많은 국가를 받아들일 수 있을지도 모릅니다."
