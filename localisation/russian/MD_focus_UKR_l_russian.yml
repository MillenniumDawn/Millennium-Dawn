 ukr_modernize_sov_equipment_t55_reactivation_program.5.desc: "§YХКБМ§! завершило работу над §YБМП-55§! — тяжёлой боевой машиной пехоты на корпусе §YТ-55§!. Двигатель перенесён вперёд, башня получает 30-мм пушку с ПТУР, а пехота едет §Gпод защитой тяжёлой брони корпуса§!, а не в §Rтонкостенной§! §YБМП§!."
