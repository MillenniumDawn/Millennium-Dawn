 SAU_pipeline_transit_SYR_t1_desc: "Саудовская нефть транспортируется через Сирию, и транзитные сборы пополняют государственную казну. Трубопровод способствует развитию и стабильности страны. §GДополнительный доход: $1,00 млрд§!"
