 GENERIC_krepost_state_defense_bureau_desc: "Теневая государственно-лицензированная экспортная организация, специализирующаяся на ПЗРК и противотанковых управляемых ракетах, поставляющая продукцию клиентам через немаркированных посредников."
 GENERIC_north_plains_heavy_industries_desc: "Обширный завод советского наследия, выпускающий пехотное оружие в больших масштабах и оптимизированный под массовое производство в ущерб качеству."
 GENERIC_sentinel_grid_networks_desc: "Подрядчик по связи и боевому управлению, предлагающий решения по сжатию цепи поражения для армий, не имеющих интегрированной командной инфраструктуры."
 GENERIC_brunn_heavy_engineering_werke_desc: "Центральноевропейская инженерная компания с корнями эпохи Габсбургов, выпускающая лицензионные и оригинальные артиллерийские системы."
 GENERIC_reichswerke_konstrukt_dynamik_desc: "Центральноевропейский разработчик вооружений двойного профиля, охватывающий гусеничную артиллерию и платформы основных боевых танков."
 GENERIC_vector_defense_labs_desc: "Интегратор систем противоракетной обороны, ориентированный на стоимость и построенный на доктрине, что перехват на доллар превосходит золотую отделку."
 GENERIC_marshall_tractor_works_desc: "Коллектив танковых заводов, работающий по унаследованной советской производственной методологии с упором на объём и ремонтопригодность."
 GENERIC_vanderlind_hartwell_systems_desc: "Ведущий подрядчик с Политического кольца, использующий политические связи для получения масштабных программ по бронемашинам и БМП."
 GENERIC_mil_kamov_rotorworks_desc: "Вертолётное бюро, уходящее корнями в советские разработки ударных и транспортных вертолётов, известное надёжностью в ущерб изощрённости."
 GENERIC_helitech_avionique_desc: "Бутиковая англо-итальянская фирма по авионике и вертолётной интеграции, предлагающая высококачественную электронику по премиальной цене."
 GENERIC_aurora_aerodynamics_corporation_desc: "Засекреченное подразделение передовых разработок, выпускающее передовые истребители и многоцелевые самолёты для взыскательных оборонных заказчиков."
 GENERIC_societe_europeenne_daerostructures_desc: "Общеевропейский консорциум с долевым участием, специализирующийся на крупных авиационных конструкциях, транспортных платформах и морских патрульных самолётах."
 GENERIC_southwestern_aerospace_dynamics_bureau_desc: "Управляемое директоратом бюро, выпускающее многоцелевые и стратегические авиационные платформы под строгим государственным надзором."
 GENERIC_skyforge_autonomous_systems_desc: "Фирма из окрестностей Кремниевой долины, применяющая стартап-культуру быстрого движения к разработке автономных ударных дронов."
 GENERIC_compagnie_aeronatique_darmement_desc: "Оружейная компания французского наследия, предлагающая межплатформенные стандарты боеприпасов для истребителей, морской авиации и управляемых ракет."
 GENERIC_whitehall_strategic_solutions_desc: "Бутиковая адмиралтейская консультационная фирма, ставшая строителем малых боевых кораблей, специализирующаяся на корветах и патрульных катерах."
 GENERIC_triton_maritime_defense_group_desc: "Многонациональная сеть верфей, производящая эсминцы и фрегаты в нескольких странах-партнёрах."
 GENERIC_eastern_maritime_shipbuilding_group_desc: "Судостроитель непрерывного трёхсменного цикла, выпускающий крейсеры и авианосцы по сжатым графикам."
 GENERIC_sevmorprom_submarine_yards_desc: "Северная российская судостроительная верфь, специализирующаяся на глубинах холодных вод и экспортных ударных и ракетных платформах."
 GENERIC_halland_civic_engineering_group_desc: "Северный промышленный конгломерат с экспертизой в логистике двойного назначения, охватывающей гражданскую инфраструктуру и военные цепи поставок."
 GENERIC_second_academy_missile_bureau_desc: "Изолированное научно-исследовательское бюро по баллистическим и крылатым ракетам, действующее по строгим протоколам служебной необходимости."
 GENERIC_western_orbital_systems_bureau_desc: "Бюро орбитальных и стратегических систем, сосредоточенное на средствах доставки нового поколения и осведомлённости в космической области."
 GENERIC_central_heavy_atomics_power_desc: "Программа ядерных двигательных установок и вооружений, сочетающая гражданскую реакторную экспертизу с разработкой морских баллистических ракет."
