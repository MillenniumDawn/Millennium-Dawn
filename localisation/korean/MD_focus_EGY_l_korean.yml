 EGY_mission_to_uae: "[UAE.GetNameWithFlag] 무역 사절단"
 EGY_mission_to_Turkey: "[TUR.GetNameWithFlag] 무역 사절단"
 cancel_EGY_trade: "비료 무역 계약 해지"
 EGY_pending_offer: "한 국가가 비료 계약을 검토 중입니다"
 egypt_evergreen.1.t: "이집트의 화학 비료 무역 협정 제안"
 egypt_evergreen.1.d: "이집트가 최근 우리에게 접촉하여 자국이 제공할 수 있는 최고의 비료에 대한 독점 계약을 제안했습니다. 이를 수락하면 분명 우리의 작물 수확량이 늘어나겠지만, 정치적으로는 일부에서 이 조치를 의문스럽게 볼 수도 있습니다."
 egypt_evergreen.1.a: "물론입니다."
 egypt_evergreen.1.b: "현재로서는 불가능합니다."
 egypt_evergreen.2.t: "[From.GetName] 수락"
 egypt_evergreen.2.d: "[From.GetName]와(과) 합의를 이루려던 우리의 노력이 마침내 결실을 맺었습니다. 계약이 체결되었으며 첫 대금을 곧 받게 됩니다."
 egypt_evergreen.2.a: "드디어 좋은 소식이군."
 egypt_evergreen.3.t: "[From.GetName]의 우리 거래 거부"
 egypt_evergreen.3.d: "[From.GetName]와(과) 거래를 성사시키려던 우리의 노력은 헛수고인 듯합니다. 답변을 받지 못했고 아무런 진전이 없어 보입니다."
 egypt_evergreen.3.a: "젠장, [From.GetNameDef]!"
 egypt_evergreen.4.t: "[From.GetName]의 계약 무효화"
 egypt_evergreen.4.d: "충격적인 소식을 받았습니다. [From.GetName]이(가) 우리와의 비료 계약을 취소했으며, 적어도 당분간은 우리 제품을 판매할 수 없게 되었습니다."
 egypt_evergreen.4.a: "바보들! 자기들이 무엇을 잃는지도 모르는군!"
 Egypt.25.t: "이집트의 제안"
 Egypt.25.d: "이집트 정부가 우리나라에 엘다바에 새 원자로 시설을 건설하는 계약을 제안했습니다. 그들의 제안서를 보면 이것이 아프리카 대륙 최대의 원자력 건설 사업이 될 것이 분명합니다. 수락해야 할까요?"
 Egypt.25.a: "Of Course."
 Egypt.25.b: "Sorry, no."
 Egypt.26.t: "러시아의 수락"
 Egypt.26.d: "그들이 우리의 제안을 수락했습니다."
 Egypt.26.a: "Great!"
 Egypt.27.t: "러시아의 거절"
 Egypt.27.d: "그들은 우리나라와 협력하기를 원치 않습니다."
 Egypt.27.a: "유감이군."
 we_will_int_tt: "[UAE.GetNameWithFlag]이(가) 네트워크 인프라 2개를 건설합니다. 이로써 우리에 대한 [UAE.GetNameWithFlag]의 영향력이 5% 증가합니다!"
 we_will_int_tt_2: "[SOV.GetNameWithFlag]이(가) 네트워크 인프라 2개를 건설합니다. 이로써 우리에 대한 [SOV.GetNameWithFlag]의 영향력이 5% 증가합니다!"
 we_will_int_tt_3: "[FROM.GetNameWithFlag]이(가) 네트워크 인프라 2개를 건설합니다. 이로써 우리에 대한 [FROM.GetNameWithFlag]의 영향력이 5% 증가합니다!"
 Egypt.34.t: "이집트의 투자 요청!"
 Egypt.34.d: "이집트가 우리나라에 자국에 투자해 달라고 요청했습니다. 수락해야 할까요?"
 Egypt.34.a: "물론이지!"
 Egypt.34.b: "미안하지만, 안된다"
 Egypt.35.t: "[UAE.GetNameWithFlag]의 수락!"
 Egypt.35.d: "그들이 우리나라에 투자할 것입니다."
 Egypt.35.a: "Great!"
 Egypt.36.t: "우리 제안을 수락하지 않은 [UAE.GetNameWithFlag]"
 Egypt.36.d: "그들은 우리나라에 투자하기를 원치 않습니다."
 Egypt.36.a: "Ugh."
 EGY_natrega_idea: "국가통신규제청"
 EGY_natrega: "국가통신규제청"
 EGY_natrega_desc: "흔히 NTRA로 알려진 국가통신규제청은 이집트 통신 규제법에 따라 설립되도록 제안된, 이집트 정부가 승인한 규제 및 경쟁 당국으로서 통신 분야를 규제하고 관리할 권한을 갖춘 국가 기관입니다."
 EGY_arab_cable: "아랍 케이블 제조업체"
 EGY_arab_cable_desc: "아랍 케이블 제조업체 협회가 만든 케이블의 품질을 누가 감히 의심할 수 있겠습니까? 최고의 품질이며, 우리는 반드시 납품할 것입니다!"
 EGY_orascom: "오라스콤 건설"
 EGY_orascom_desc: "오라스콤 건설 PLC는 인프라, 산업 및 고급 상업 프로젝트를 주로 하는 중동, 아프리카, 미국의 선도적인 글로벌 엔지니어링 및 건설 계약업체입니다."
 EGY_idea_eacu_cooperation: "이집트-EACU 협력"
 EGY_idea_eacu_cooperation_desc: "유라시아 관세 동맹(본래는 유라시아 경제 공동체)은 대부분의 구소련 국가들 사이의 경제적 유대를 증진합니다. 이 동맹은 역내로 들어오는 모든 상품에 공통 대외 관세를 부과하며, 무역 협정과 협상을 체결할 때에는 하나의 단일 주체로 행동합니다."
 EGY_morsi: "무함마드 무르시"
 EGY_morsi_desc: "무르시는 샤르키아 주 엘아드와에서 태어나 카이로 대학교에서 야금공학을, 이후 서던캘리포니아 대학교에서 재료과학을 공부했습니다. 1982년부터 1985년까지 캘리포니아 주립대학교 노스리지의 부교수로 재직한 뒤 이집트로 돌아와 자가지그 대학교에서 가르쳤습니다. 당시 호스니 무바라크 대통령 체제에서 공직 진출이 금지되어 있던 무슬림 형제단과 연계하여, 무르시는 2000년 총선에 후보로 출마했습니다."
 EGY_junta_coup: "군부, 권력을 장악하다!"
 EGY_junta_coup_desc: "미치광이 정부가 너무 오랫동안 우리 국민을 부당하게 대했다! 이제 군이 나설 때가 왔다!"
 EGY_REB_S_nationalist: "이집트 최고 당국"
 EGY_al_sisi_rise: "압델 파타 엘시시의 부상!"
 EGY_al_sisi_rise_desc: "이슬람주의자들이 모두 정부에서 제거되었으니, 이제 엘시시의 통치를 민주적인 방식으로 수립하고 비상사태를 끝낼 때가 되었습니다."
 EGY_susp_const: "헌법 정지"
 EGY_susp_const_desc: "우리와 같은 비상사태에서는 나라가 혼란에 빠진 상황에서 민주주의가 존재하도록 놔둘 수 없습니다."
 egypt.104.t: "군 내 부패 문제"
 egypt.104.d: "군 내 부패에 어떻게 대처할지 결정해야 합니다. 이미 너무 멀리 왔습니다. 장성들과 협상하여 충성을 얻되 군 내 부패를 완전히 해결하지는 못하는 방법이 있고, 부패를 완전히 근절하는 방법이 있으나 그 경우 결과가 따를 수 있습니다..."
 egypt.104.a: "거래를 시도해 보자."
 egypt.104.b: "살아남은 부패 세력을 끝장내라"
 EGY_islam_dom_parl: "이슬람이 장악한 의회"
 EGY_islam_dom_parl_desc: "세속주의 정당이나 이교도 정당이 우리 의회에 들어서도록 허용해서는 안 됩니다. 올바른 동맹을 맺어 이를 보장해야 합니다."
 EGY_primacy_brother: "형제단의 우위"
 EGY_primacy_brother_desc: "이제 우리가 집권한 만큼, 새로 선출된 우리 정당의 권력을 제한하는 것은 아무것도 없어야 합니다. 모든 핵심 직책은 우리 사람들이 차지해야 합니다."
 EGY_gain_internat_supp: "국제 선전"
 EGY_gain_internat_supp_desc: "이제 무슬림 세계의 모든 나라가 형제단 혁명의 본보기를 갖게 되었습니다. 이 소식을 널리 퍼뜨려야 합니다!"
 EGY_ties_with_qatar: "카타르와의 유대"
 EGY_ties_with_qatar_desc: "카타르는 이제 우리의 주요 이념적 동맹이며, 우리는 그들에게 지원을 요청하고 우정을 확인해야 합니다."
 Egypt.375.t: "이집트의 재정 지원 요청!"
 Egypt.375.d: "최근 이집트에서 일어난 혁명으로 우리와 이념적으로 우호적인 정권이 집권했습니다. 무슬림 형제단의 일원으로서 그들이 재정 지원을 요청해 왔습니다. 수락해야 할까요?"
 Egypt.375.a: "물론이지!"
 Egypt.375.b: "그럴 여력이 없다..."
 qatar_infl_egy_tt: "이로써 이집트에 대한 우리의 영향력이 6% 증가합니다"
 Egypt.38.t: "카타르의 동의!"
 Egypt.38.d: "그들이 재정 지원을 제공할 것입니다."
 Egypt.38.a: "환상적이군"
 Egypt.39.t: "지원에 동의하지 않은 카타르"
 Egypt.39.d: "그들은 그럴 여력이 없다고 말합니다."
 Egypt.39.a: "알겠다..."
 EGY_suez_deal: "수에즈 협정"
 EGY_suez_deal_desc: "외국 경제와의 수에즈 운하 연결을 늘리는 것은 더 많은 수입을 창출하는 좋은 방법입니다."
 Egypt.40.t: "에티오피아를 둘러싼 논란"
 Egypt.40.d: "이집트 정치인들이 청나일강을 가로지르는 댐 건설을 막기 위해 에티오피아에 대한 적대 행위를 제안하다 적발되어 곤혹을 치르고 있습니다. 무함마드 무르시 대통령이 소집한 회의에서 그들이 군사 행동을 제안하는 말이 생중계 TV로 의도치 않게 송출되었습니다."
 Egypt.40.a: "이것은 모두 거짓이다... 모든 것이 괜찮다."
 Egypt.40.b: "그렇다! 그래서 뭐 어쩌라고?! 우리는 옳다고 보는 대로 한다!"
 morsan_allianc: "카이로 조약"
 Egypt.41.t: "우리를 세력에 초청하는 이집트!"
 Egypt.41.d: "수락해야 할까요? 어쩌면 국가 안보를 강화할 수도 있지만, 완전히 위험에 빠뜨릴 수도 있습니다."
 Egypt.41.a: "찬성"
 Egypt.41.b: "안된다"
 EGY_cond_eth_bro: "에티오피아 규탄"
 EGY_cond_eth_bro_desc: "에티오피아인들이 아프리카에서 우리 친구의 영향력을 해치고 있습니다. 수단이 에티오피아의 댐 건설로 영향을 받아서는 안 됩니다!"
 Egypt.42.t: "[FROM.GetName]의 무기 지원!"
 Egypt.42.d: "그들이 우리에게 무기를 보내왔습니다!"
 Egypt.42.a: "좋아"
 Egypt.43.t: "이집트의 외교적 항의 제기!"
 Egypt.43.d: "이집트 대통령 무함마드 무르시가 우리 정부에 대해 외교적 항의를 제기했습니다. 그는 우리가 테러리스트이며, 국제사회가 우리 정권을 제거하기 위한 특별 작전을 개시해야 한다고 주장합니다."
 Egypt.43.a: "꺼져라, 무르시!"
 EGY_support_fsa: "FSA 지원"
 EGY_support_fsa_desc: "시리아와 우리의 관계는 오랜 역사를 가지고 있습니다. 이제 그 관계는 형제단의 이념과 그들의 관계에 의해 규정되어야 합니다."
 dyn_syr_tt: "이 중점의 효과는 시리아 정부의 이념 성향에 따라 달라집니다!"
 EGY_brotherhood_diplo: "형제단 외교"
 EGY_brotherhood_diplo_desc: "새 정부에 맞추어 우리의 외교를 개혁해야 합니다."
 EGY_hamas_under_wing: "우리 품 안의 하마스"
 EGY_hamas_under_wing_desc: "하마스는 가자 지구에 근거를 둔, 무슬림 형제단과 연계된 자유의 투사 집단입니다. 그들을 돕는 것은 우리의 의무입니다!"
 Egypt.44.t: "가자 지구를 장악한 하마스"
 Egypt.44.d: "이집트의 지원을 받은 하마스가 가자 지구를 장악했습니다. 그들의 무장 민병대가 정부 건물들을 장악했으며, 대변인 [HAM.GetLeader]은(는) 이 단체가 알아크사 모스크를 해방하기 위한 진군을 준비하고 있다고 밝혔습니다."
 Egypt.44.a: "젠장!"
 EGY_letter_isr: "이스라엘의 조작"
 EGY_letter_isr_desc: "오, 이스라엘이여! 너희를 어찌할지 결정할 때가 왔다."
 Egypt.45.t: "무르시의 딜레마"
 Egypt.45.d: "이제 이스라엘을 어떻게 할지 결정해야 할 때가 왔습니다."
 Egypt.45.a: "우호의 서한을 보내자!"
 Egypt.45.b: "정말로 무언가 해야 하는가?"
 Egypt.45.c: "만약에...?"
 Egypt.46.t: "이집트의 서한"
 Egypt.46.d: "위대하고 선량한 벗이여, 우리 두 나라 사이에 다행히 존재하는 우호 관계를 유지하고 강화하기를 바라며, 저는 아테프 무함마드 살렘 사이드 엘 아흘 씨를 특명전권대사로 선임했습니다. 우리는 양국 간의 완전한 평화를 수립하기를 희망합니다."
 Egypt.46.a: "으음? 알겠다?"
 Egypt.46.b: "정신 나간 자로군..."
 EGY_und_supp_hamas: "하마스 비밀 지원"
 EGY_und_supp_hamas_desc: "하마스의 대의를 성공시키기 위해, 우리는 물질적으로 그들을 지원해야 합니다."
 EGY_org_of_isl_coop: "이슬람협력기구"
 EGY_org_of_isl_coop_desc: "이슬람협력기구(구 이슬람회의기구)는 1969년에 설립된 정부 간 기구로, 57개 회원국으로 구성되어 있으며 그중 48개국이 무슬림 다수 국가입니다."
 Egypt.47.t: "카이로에서 이슬람협력기구 정상회의 개최!"
 Egypt.47.d: "이집트 대통령 무함마드 무르시가 무슬림 국가 지도자 57명이 참석한 가운데 카이로에서 이슬람 정상회의를 주최했습니다. 성명은 내전을 끝내기 위해 시리아 정부와 야권 연합 사이의 \\"실질적인 대화\\"를 촉구했습니다."
 Egypt.47.a: "그들에게도 우리에게도 좋은 일이다!"
 EGY_sahwat_hegazi: "사프와트 헤가지 활용"
 EGY_sahwat_hegazi_desc: "최근 사프와트는 무슬림 형제단 후보 무함마드 무르시의 선거운동을 개시했습니다. 수십만 이집트인 군중 앞에서의 연설에서 사프와트는 무르시가 아랍 합중국 또는 예루살렘을 수도로 하는 칼리파국을 복원하는 이집트의 운동을 이끌 것이라고 강조했으며, 청중에게 유대인들을 잠에서 깨우라고 촉구하고 그들이 순교자로서 예루살렘을 향해 진군할 것이라고 외쳤습니다."
 EGY_crack_shia_copts: "시아파와 콥트인 탄압"
 EGY_crack_shia_copts_desc: "시아파와 콥트인이 우리 국가에 너무 많은 영향을 미치고 있습니다! 이에 대한 조치를 취해야 합니다."
 EGY_tolerance_pol: "관용 정책"
 EGY_tolerance_pol_desc: "우리나라의 소수 집단을 억압할 이유가 없습니다. 그들과 합의를 이룹시다."
 EGY_sharia_laws: "샤리아 법 도입"
 EGY_sharia_laws_desc: "샤리아는 문자 그대로 길 또는 법을 의미하며, 이슬람 용어로는 이슬람 경전, 특히 꾸란과 하디스에 기반한 이슬람 전통의 일부를 이루는 추상적이고 불변하는 신성한 또는 종교적 법을 가리킵니다."
 EGY_prop_new_const: "신헌법 제안"
 EGY_prop_new_const_desc: "이제 우리의 정치적 안전을 확보하고 국가를 위한 새 헌법을 제안할 때가 왔습니다."
 Egypt.48.t: "무르시의 헌법"
 Egypt.48.d: "이전 헌법은 우리 역사를 통틀어 이집트인에게 가장 나쁜 헌법이었다고 해도 과언이 아닙니다! 이 수치스러운 문서를 없애기 위해 진정한 무슬림 헌법을 새로 만들 것입니다. 여기서의 핵심 선택은 전통적인 중앙집권을 택할 것인지, 아니면 더 분권적이되 팽창주의적으로 갈 것인지입니다. 어느 길을 택해야 할까요?"
 Egypt.48.a: "이집트는 남을 돕기 전에 스스로를 안정시켜야 한다!"
 Egypt.48.b: "팽창주의는 우리의 국가 헌장이며 헌법에 담겨야 한다!"
 Egypt.49.t: "오마르 압델 라흐만의 석방을 요청하는 이집트"
 Egypt.49.d: "무르시는 서한에서, 혁명 중 체포된 많은 이집트인들과 함께 1993년 뉴욕시 세계무역센터 폭탄 테러로 유죄 판결을 받은 오마르 압델 라흐만을 석방해 달라고 우리에게 요청한다고 간략히 언급했습니다. 형제단 대변인은 이후 이 인도 요청이 인도주의적 이유에서 제안된 것이며 무르시가 압델 라흐만의 유죄 판결을 뒤집으려는 의도는 없었다고 밝혔습니다."
 Egypt.49.a: "무르시가 제정신인가?"
 Egypt.49.b: "으윽... 좋다?"
 Egypt.50.t: "우리 제안에 동의하지 않은 미국"
 Egypt.50.d: "그들은 오마르 압델 라흐만의 석방에 동의하지 않을 것입니다."
 Egypt.50.a: "멍청이들!"
 Egypt.51.t: "오마르 압델 라흐만 석방!"
 Egypt.51.d: "오마르 압델 라흐만이 이제 이집트로 이동하여 무함마드 무르시를 직접 만날 것입니다."
 Egypt.51.a: "Great!"
 EGY_free_omar: "오마르를 석방하라!"
 EGY_free_omar_desc: "카이로 타흐리르 광장에서 지지자들에게 한 연설에서, 무르시는 혁명 중 체포된 많은 이집트인들과 함께 1993년 뉴욕시 세계무역센터 폭탄 테러로 유죄 판결을 받은 오마르 압델 라흐만을 석방하기 위해 노력하겠다고 간략히 언급했습니다."
 EGY_el_tenaim_speech: "엘테나임 연설"
 EGY_el_tenaim_speech_desc: "무르시는 첫 공식 방문으로 이집트 북서부의 마트루흐를 찾아 엘테나임 모스크에서 이집트의 단결에 관한 연설을 하겠다고 약속했습니다."
 Egypt.52.t: "엘테나임 연설에 대한 반응"
 Egypt.52.d: "무함마드 무르시가 연설을 하기 직전, 그는 예배에 참석했는데 이 자리에서 지역 종교 기부 재단의 책임자인 성직자 푸투흐 압드 알나비 만수르가 이렇게 선언했습니다. '유대인과 그 지지자들을 처단하소서. 오 알라여, 그들을 흩어 버리시고 갈가리 찢으소서. 오 알라여, 그들에게 당신의 권능과 위대함을 보이소서. 오 주여, 당신의 전능함을 우리에게 보여 주소서.' "
 Egypt.52.a: "아멘!"
 EGY_prot_of_revol: "혁명의 수호자들!"
 EGY_prot_of_revol_desc: "우리는 모든 수단을 동원하여 혁명을 지켜야 하며, 따라서 우리 정책의 법적 근거를 마련해야 합니다."
 EGY_dem_a_retrial: "재심 요구"
 EGY_dem_a_retrial_desc: "무르시는 새 헌법을 기초하는 제헌의회의 작업을 사법적 간섭으로부터 보호한다는 취지의 선언을 발표했습니다. 사실상 이 선언은 그의 행위를 모든 법적 이의 제기로부터 면책시켰습니다. 포고령은 새 헌법이 비준될 때까지만 적용된다고 명시합니다. 이 선언은 또한 무바라크 시대에 시위대를 살해한 혐의로 기소되었다가 무죄 판결을 받은 자들에 대한 재심을 요구하고, 제헌의회의 임기를 두 달 연장합니다."
 EGY_app_chris_wom: "기독교인 여성 임명"
 EGY_app_chris_wom_desc: "우리가 당선되기 전에, 무르시 대변인은 대통령 당선인이 기독교인 1명과 여성 1명을 부통령으로 임명할 것이라고 발표했습니다."
 EGY_loyalist_dom: "충성파 우위"
 EGY_loyalist_dom_desc: "약속은 약속이고, 현실은 현실입니다. 마흐무드 맥키를 임명해야 합니다."
 EGY_tantawi_hafez: "탄타위에게 사임 요구"
 EGY_tantawi_hafez_desc: "무함마드 후세인 탄타위는 사임해야 합니다. 그는 이전 정권의 적극적인 지지자입니다."
 EGY_unrestricted_pres: "제약 없는 대통령"
 EGY_unrestricted_pres_desc: "우리 지도자가 정책을 수행하는 것을 가로막는 민주주의적 잡소리는 모조리 제한해야 합니다."
 EGY_appeas_militar: "군부 달래기"
 EGY_appeas_militar_desc: "우리는 군부와 사이가 좋지 않습니다. 어쩌면 협상을 시도해야 할지도 모릅니다."
 EGY_alsisi_proposal: "엘시시의 제안"
 EGY_alsisi_proposal_desc: "엘시시 장군은 우리 대통령의 국방장관으로 임명되기를 원하며, 이 문제를 논의하기 위해 우리를 직접 만나고자 합니다."
 Egypt.53.t: "엘시시와의 면담"
 Egypt.53.d: "엘시시 장군이 우리 대통령의 국방장관으로 임명되기를 원합니다."
 Egypt.53.a: "헤, 거절한다."
 Egypt.53.b: "좋다."
 EGY_revok_mub_laws: "무바라크 법률 폐지"
 EGY_revok_mub_laws_desc: "무바라크의 억압적인 법률은 폐지되어야 합니다. 그리고 새로운 억압적인 법률이 제정되어야 합니다."
 EGY_maintain_democr: "민주주의 유지"
 EGY_maintain_democr_desc: "군부 세력을 달래 우리나라의 안정과 다원성을 보장하기 위해 민주주의를 유지해야 합니다."
 EGY_increase_int_secur: "내부 보안 강화"
 EGY_increase_int_secur_desc: "우리나라는 배신자, 간첩, 테러리스트로 가득합니다. 이를 바로잡아야 합니다."
 EGY_totalit_buildup: "전체주의 구축"
 EGY_totalit_buildup_desc: "적들이 우리나라에 침투하지 못하도록 전면적인 통제를 확보해야 합니다."
 EGY_promote_adly: "아들리 추대"
 EGY_promote_adly_desc: "아들리 만수르는 상황이 정리될 때까지 이집트의 임시 대통령이 되기에 완벽한 후보입니다."
 EGY_dissolv_shura: "슈라 해산"
 EGY_dissolv_shura_desc: "시시가 무르시 대통령을 축출하고 슈라 위원회를 해산한 뒤, 임시 대통령 아들리 만수르는 장관들이 입찰 공고 없이 계약을 체결할 수 있다고 한시적으로 포고했습니다. 이듬달에 정부는 약 10억 달러 규모의 건설 계약을 이집트 군에 수여했습니다."
 EGY_repress_brotherhood_sisi: "형제단 탄압"
 EGY_repress_brotherhood_sisi_desc: "무슬림 형제단은 테러 조직이며, 우리는 그 영광스러운 이름에 걸맞게 행동해야 합니다."
 EGY_operation_sinai: "시나이 작전"
 EGY_operation_sinai_desc: "살라피 멍청이들이 우리나라의 일에 간섭할 방도를 찾아냈습니다. 시나이에서 이 얼룩을 지워 버릴 때입니다!"
 EGY_operation_sinai_idea: "시나이 작전"
 EGY_prowest_approach: "친서방 노선"
 EGY_prowest_approach_desc: "서방의 접근법과 방법론이 우리나라의 대외 노선을 위한 유일한 길입니다."
 EGY_ally_mubarak: "무바라크 일족과의 동맹"
 EGY_ally_mubarak_desc: "무바라크는 사라졌지만, 엘리트들과 이상은 우리의 대의와 함께 묶여 있습니다."
 EGY_revolut_hero: "혁명의 영웅"
 EGY_revolut_hero_desc: "우리 대통령을 위한 새로운 대중적 이미지를 만들어야 합니다."
 EGY_new_suez: "수에즈 협정"
 EGY_new_suez_desc: "외국 경제와의 수에즈 운하 연결을 늘리는 것은 더 많은 수입을 창출하는 좋은 방법입니다."
 egypt_copts.1.t: "기독교인을 공격하는 급진 무슬림"
 egypt_copts.1.d: "최근 기독교 콥트 교회에 대한 공격이 있었습니다. 급진 무슬림들은 이것이 자기 방어 행위였다고 주장하며, 살라피 이맘들은 공격자들을 기소하지 말 것을 요구하고 있습니다."
 egypt_copts.1.a: "무슬림들이 옳다. 그들이 한 말은 모두 사실이었다."
 egypt_copts.1.b: "이 사건에서 콥트인들의 잘못은 없다."
 egypt_copts.2.t: "급진 무슬림과 기독교인 간의 충돌"
 egypt_copts.2.d: "최근 급진화된 무슬림들과 현지 기독교인 주민들 사이에 충돌이 있었습니다. 공격한 급진주의자들은 기독교인들에게 돌을 던졌습니다."
 egypt_copts.2.a: "돌을 던지는 건 재미있다."
 egypt_copts.2.b: "우리는 이 야만적인 관행을 규탄한다."
 egypt_copts.3.t: "급진 무슬림에게 살해된 기독교인 남성"
 egypt_copts.3.d: "얼마 전, 현지 경찰서에 경찰서 건물 근처에서 살인이 있었다는 신고가 접수되었습니다. 나중에 밝혀진 바로는 살인은 급진 무슬림의 한 대표자가 저질렀습니다. 피의자는 그 콥트인이 자신의 신앙을 모욕했다고 주장했습니다."
 egypt_copts.3.a: "누구도 신자를 모욕할 수 없다."
 egypt_copts.3.b: "일어난 일에 대한 변명이 될 수 없다."
 egypt_copts.4.t: "정부에 인사를 추천하는 콥트인들"
 egypt_copts.4.d: "우리나라의 기독교인 주민들로부터 정부에 자신들의 후보를 지명하고 싶다는 제안을 받았습니다."
 egypt_copts.4.a: "기독교인 후보는 고려하지 않는다."
 egypt_copts.4.b: "동의한다. 우리는 민주주의를 사랑한다."
 egypt_copts.5.t: "콥트인의 권리 축소를 제안하는 급진 무슬림"
 egypt_copts.5.d: "급진화된 무슬림들로부터 기독교인 주민의 권리를 축소할 가능성에 대한 제안을 받았습니다. 그들은 이것이 아랍 지역에 더 많은 안정을 가져올 것이라고 믿습니다."
 egypt_copts.5.a: "우리도 그렇게 생각한다."
 egypt_copts.5.b: "아니, 우리는 그렇게 생각하지 않는다."
 EGY_meet_christ: "기독교인과의 만남"
 EGY_meet_christ_desc: "기독교인과의 만남"
 egypt.105.t: "이슬람주의자의 반란"
 egypt.105.d: "시나이 반도에서 ISIS 반란이 새롭게 급증하면서, 이집트 보안군과 이 단체 소속 무장 세력 사이의 충돌이 격화되어 이집트의 치안에 대한 우려가 커지고 있습니다. 군 초소와 병력을 겨냥한 최근의 공격은 테러에 맞선 지속적인 노력에도 불구하고 이 지역에서 극단주의 단체들이 가하는 위협이 여전함을 보여 줍니다. 시나이에서의 ISIS 활동 재개는 이집트 당국이 극단주의를 근절하고 이 지역의 안정을 유지하는 데 직면한 어려움을 부각합니다."
 egypt.105.a: "개자식들!"
 EGY_Copts_is_very_satisfied_idea: "높은 콥트인 지지"
 EGY_Copts_is_satisfied_idea: "만족한 콥트인"
 EGY_Copts_are_neutral_idea: "중립적인 콥트인"
 EGY_Copts_are_not_satisfied_idea: "탄압받는 콥트인"
 EGY_Copts_are_enraged_idea: "분노한 콥트인"
 EGY_appease_coptic_people: "콥트인 달래기"
 EGY_promote_coptic_politicians: "콥트인 정치인 육성"
 EGY_raids_on_coptic_people: "콥트인 습격"
 EGY_governmental_pressure: "정부의 압박"
 EGY_COPTIC: "콥트 국가"
 EGY_copt_coalition_create: "[Neutral_Autocracy_L]이(가) 집권 연립에 추가됩니다!"
 EGY_copt_coalition: "집권 연립에 [Neutral_Autocracy_L] 추가"
 copt_coalition_decision_tt: "여론이 §G80%§!보다 높음\n콥트인의 정치적 영향력이 §G60%§!보다 높음"
 EGY_slums_5_level: "매우 심각한 빈민가 문제"
 EGY_slums_4_level: "심각한 빈민가 문제"
 EGY_slums_3_level: "보통 수준의 빈민가 문제"
 EGY_slums_2_level: "경미한 빈민가 문제"
 EGY_slums_1_level: "매우 경미한 빈민가 문제"
 EGY_already_remove_slums: "우리는 이미 빈민가 문제를 해결하고 있으며, 모든 주에 대해 이를 수행할 자원과 힘이 없습니다!"
 EGY_heliopolis_speech: "헬리오폴리스 연설"
 EGY_heliopolis_speech_desc: "우리의 새 대통령은 헬리오폴리스에서 의식을 시작하여 자신의 전권을 천명해야 합니다."
 egypt.106.t: "헬리오폴리스 연설"
 egypt.106.d: "헬리오폴리스 궁전에서 열린 의식에서 시시는 참석자들에게 연설을 했습니다. 그와 전임 대통령 아들리 만수르는 또한 시시에게 권력을 공식 이양하는 문서에 서명했으며, 이는 이집트 역사상 권력이 이러한 방식으로 이양된 최초의 사례였습니다. 이어 시시는 마지막 의식이 열린 쿠바 궁전으로 이동했습니다. 그곳에서 그는 다양한 계층과 이집트 각 지방을 대표하는 이집트 국민 1,200명의 참석자들에게 그날의 마지막 연설을 했습니다. 그는 이집트가 직면하고 있다고 말한 문제들과 이를 해결하기 위한 자신의 계획을 설명하고 이렇게 선언했습니다. \\"이집트는 다음 단계에서 우리가 놓친 것을 보상하고 과거의 실수를 바로잡기 위해 내외 양면에서 전면적인 도약을 목격할 것입니다.\\" 이후 시시는 첫 대통령령을 내려 전임 대통령 아들리 만수르에게 나일 훈장을 수여했습니다."
 egypt.106.a: "좋아"
 EGY_keep_secularization: "세속화 지속"
 EGY_keep_secularization_desc: "종교와 정치는 서로 분리되어야 합니다. 우리는 이 길을 계속 가야 합니다."
 egypt.107.t: "우리나라와 군사적 유대를 맺으려는 이집트!"
 egypt.107.d: "이집트의 새로운 살라피 정부가 우리나라와 군사 협력 조약을 체결하기를 원합니다."
 egypt.107.a: "Of Course."
 egypt.107.b: "No."
 egypt.108.t: "사우디아라비아의 거절"
 egypt.108.d: "그들은 우리나라와 협력하기를 원치 않습니다."
 egypt.108.a: "Ugh."
 egypt.109.t: "이집트에서 온 서한!"
 egypt.109.d: "잘 들어라, 샤이탄의 추종자들아! 리오넬 메시는 이슬람의 적이며 우리는 너희 이교도적 관행에 대한 복수를 할 것이다!"
 egypt.109.a: "이게 대체 무슨 소리냐?"
 EGY_al_azhar_uni_idea: "알아즈하르 대학교"
 EGY_agrarianism: "살라피 경제"
 egypt.110.t: "마키운 옹립!"
 egypt.110.d: "우리 정당이 집권하게 되었으니, 우리 지도자를 불러 안정을 보장해야 합니다."
 egypt.110.a: "새 지도자 만세!"
 egypt.111.t: "카이로에서 콥트 크리스마스 이브 미사에 참석한 이집트 대통령!"
 egypt.111.d: "이집트 언론에 따르면, 압델 파타 엘시시는 국내에서 종종 소외되는 기독교 소수 집단과의 상징적인 단합을 보이기 위해 콥트 크리스마스 이브 미사에 카이로 대성당에 모습을 드러낸 최초의 이집트 지도자가 되었습니다.\n수니파 무슬림인 시시는 대성당에 도착한 뒤 환호하는 신도들에게 \\"전 세계가 우리 이집트인들을 지켜보는 것이 중요합니다\\"라고 말했습니다. \\"제가 이집트인이라는 말 외에 다른 말을 쓰지 않는 것을 알아채셨을 겁니다… 우리는 이집트인입니다.\\"\n미소 짓는 주교들과 콥트 교황 타와드로스 2세 옆에 선 시시는, 이집트인들이 수니파 무슬림 다수와 인구의 약 10%를 차지하는 기독교 공동체 사이의 수년간의 긴장을 넘어서야 한다고 시사했습니다. \\"여기서부터 우리는 '우리는 이집트인이다'라는 말 외에는 아무 말도 할 수 없습니다\\"라고 그는 말했습니다."
 egypt.111.a: "아멘!"
 EGY_deradical_ulema: "울라마 탈급진화"
 EGY_deradical_ulema_desc: "많은 살라피 동조자들이 이집트의 울라마에 침투했습니다. 급진적 사상을 억제하기 위해 탈급진화가 이루어져야 합니다."
 Egypt.112.t: "투자를 요청하는 이집트"
 Egypt.112.d: "최근 러시아-아프리카 정상회의에서 [EGY.GetLeader]이(가) 우리에게 이집트에 대한 투자를 고려해 달라고 요청했습니다. 수락해야 할까요?"
 Egypt.112.a: "물론이지!"
 Egypt.112.b: "미안하지만, 안된다"
 Egypt.113.t: "러시아의 동의!"
 Egypt.113.d: "러시아가 러시아-아프리카 정상회의에서의 우리의 제안 이후 우리 경제에 투자하는 데 동의했습니다."
 Egypt.113.a: "좋아"
 Egypt.114.t: "러시아의 비동의"
 Egypt.114.d: "러시아는 안타깝게도 우리 경제에 투자하지 않기로 결정했습니다. 그들은 머지않아 이 결정을 후회하게 될 것입니다."
 Egypt.114.a: "매우 유감이군."
 EGY_african_union_aff: "아프리카 연합 협력"
 EGY_african_union_aff_desc: "우리와 아프리카 동맹국들의 경제를 부양하기 위해, 러시아에서 새로운 구상 정상회의를 시작해야 합니다."
 EGY_energy_subsidies: "에너지 보조금"
 EGY_energy_subsidies_desc: "신에너지원은 현대 지속 가능한 발전관의 새로운 화두이므로 이에 보조금을 지급해야 합니다."
 EGY_egy_econ_forum: "이집트 경제 개발 회의"
 EGY_egy_econ_forum_desc: "이집트 경제 개발 회의(EEDC)는 이집트 홍해 휴양지 샤름 엘셰이크에서 열리는 사흘간의 행사입니다. 112개국에서 온 2,000명이 넘는 대표단이 회의에 참석하기 위해 이집트에 도착할 것입니다."
 Egypt.115.t: "투자를 요청하는 이집트"
 Egypt.115.d: "최근 이집트 경제 개발 회의에서 [EGY.GetLeader]이(가) 우리나라에 이집트에 대한 투자를 고려해 달라고 요청했습니다. 수락해야 할까요?"
 Egypt.115.a: "물론이지!"
 Egypt.115.b: "미안하지만, 안된다"
 Egypt.116.t: "[From.GetName]의 동의!"
 Egypt.116.d: "[FROM.GetName]이(가) 경제 개발 회의 이후 우리 경제에 투자하는 데 동의했습니다."
 Egypt.116.a: "좋아"
 Egypt.117.t: "[From.GetName]의 비동의"
 Egypt.117.d: "그들은 우리나라에 투자하지 않을 것이지만, 이로 인해 우리가 잃는 것은 없습니다."
 Egypt.117.a: "매우 유감이군."
 EGY_contract_with_siemens: "지멘스와의 계약"
 EGY_contract_with_siemens_desc: "독일과 좋은 관계를 맺고 지멘스에 투자를 요청해야 합니다."
 EGY_egypt_greece_deal: "이집트-그리스 협정"
 EGY_egypt_greece_deal_desc: "그리스는 튀르키예에 맞선 우리의 가장 가까운 동맹국 중 하나이자 지중해의 핵심 파트너입니다. 더욱 긴밀한 유대를 맺읍시다!"
 EGY_cont_us_egy_partn: "미국과의 동반자 관계 지속"
 EGY_cont_us_egy_partn_desc: "미국은 우리나라 방위 전략에서 유일한 진정한 파트너입니다. 우리는 동반자 관계를 지속해야 합니다!"
 egypt.118.t: "우리나라와 군사적 유대를 맺으려는 이집트!"
 egypt.118.d: "이집트의 새로운 친서방 정부가 우리나라와 군사 협력 조약을 체결하기를 원합니다."
 egypt.118.a: "물론이지"
 egypt.118.b: "안된다"
 egypt.119.t: "미국의 거절"
 egypt.119.d: "그들은 어떤 이유에서인지 우리나라와 협력하기를 원치 않지만, 우리는 혼자서도 충분히 잘 해낼 수 있습니다."
 egypt.119.a: "으억"
 EGY_us_mil_support: "미국의 군사 지원"
 EGY_us_mil_support_desc: "이집트 군과 미국 군 사이에 완전한 협력 관계를 구축해야 합니다."
 egypt.120.t: "튀르키예와 카타르에 대한 우리의 입장"
 egypt.120.d: "튀르키예와 카타르는 오랫동안 우리나라에 맞서 음모를 꾸며 왔습니다. 무르시는 분명 그들의 꼭두각시입니다. 그들을 어떻게 할지 결정해야 합니다!"
 egypt.120.a: "그들의 영향력에 맞서고 동맹을 찾자!"
 egypt.120.b: "차라리 그들을 박살내는 건 어떨까?"
 siska_alliance: "반테러 연대 동맹"
 egypt.121.t: "[EGY.GetLeader]의 국빈 방문!"
 egypt.121.d: "최근 이집트 대통령 [EGY.GetLeader]이(가) 우리나라를 방문하여 튀르키예와 카타르의 영향력에 맞선 매우 강력한 유대를 구축했습니다."
 egypt.121.a: "좋아"
 EGY_ant_bros_tuk: "반형제단 행동"
 EGY_ant_bros_tuk_desc: "시리아 정권과의 이견에도 불구하고, 시리아 내전은 무슬림 형제단이 어느 나라에 들어가든 무엇을 하는지 보여 주는 훌륭한 사례입니다!"
 egypt.122.t: "불가침 조약을 제안하는 이집트!"
 egypt.122.d: "이집트가 불가침 조약을 제안합니다. 그들은 더 이상 싸우고 싶지 않다고 말합니다."
 egypt.122.a: "물론이지!"
 egypt.122.b: "장난하는 건가?"
 egypt.123.t: "이집트 무기 거래"
 egypt.123.d: "이집트 군이 우리의 M109A5 자주포를 구매하고자 합니다. 판매해야 할까요?"
 egypt.123.a: "무기를 줘라!"
 egypt.123.b: "안된다"
 egypt.124.t: "미국의 수락"
 egypt.124.d: "그들이 우리에게 M109A5를 판매할 것입니다"
 egypt.124.a: "좋아"
 egypt.125.t: "미국의 거부"
 egypt.125.d: "그들은 우리에게 M109A5를 판매하지 않을 것입니다"
 egypt.125.a: "젠장"
 EGY_buy_m777: "M109A5 구매"
 EGY_buy_m777_desc: "M109A5는 자주포 계열에 속하는 미국의 자주포 부대입니다. 우리 지상군을 강화하기 위해 이 장비가 필요합니다."
 EGY_buy_arms: "무기 구매"
 EGY_buy_arms_desc: "우리 외교관들은 외국, 특히 주요 공급국들과 무기 거래를 합의하기 위해 더 노력해야 합니다."
 EGY_arms_purch_idea: "외교적 노력"
 egypt.129.t: "이집트 무기 거래"
 egypt.129.d: "이집트 군이 우리의 M1A2 전차를 구매하고자 합니다. 판매해야 할까요?"
 egypt.129.a: "무기를 줘라!"
 egypt.129.b: "안된다"
 egypt.130.t: "미국의 수락"
 egypt.130.d: "그들이 우리에게 M1A2 전차를 판매할 것입니다"
 egypt.130.a: "좋아"
 egypt.131.t: "미국의 거부"
 egypt.131.d: "그들은 우리에게 M1A2 전차를 판매하지 않을 것입니다"
 egypt.131.a: "젠장"
 EGY_abrams: "M1A2 구매"
 EGY_abrams_desc: "M1 에이브럼스는 미국의 주력 전차입니다. 미 육군과 해병대에서 운용 중입니다. 우리 지상군을 강화하기 위해 이 전차가 필요합니다."
 egypt.132.t: "이집트 무기 거래"
 egypt.132.d: "이집트 군이 우리의 BTR-70 장갑차를 구매하고자 합니다. 판매해야 할까요?"
 egypt.132.a: "무기를 줘라!"
 egypt.132.b: "안된다"
 egypt.133.t: "러시아의 수락"
 egypt.133.d: "그들이 우리에게 BTR-70을 판매할 것입니다"
 egypt.133.a: "좋아"
 egypt.134.t: "러시아의 거부"
 egypt.134.d: "그들은 우리에게 BTR-70을 판매하지 않을 것입니다"
 egypt.134.a: "젠장"
 EGY_us_afv: "BTR-70 구매"
 EGY_us_afv_desc: "BTR-70은 소련의 장갑 수송차로, 대량살상무기가 사용되는 상황을 포함하여 기계화 소총 부대의 병력과 그 화력 지원을 수송하기 위한 수륙양용 전투 차륜형 장갑차입니다. 우리 지상군을 강화하기 위해 이 차량이 필요합니다."
 egypt.135.t: "이집트 무기 거래"
 egypt.135.d: "이집트 군이 우리의 M16 소총을 구매하고자 합니다. 판매해야 할까요?"
 egypt.135.a: "무기를 줘라!"
 egypt.135.b: "안된다"
 egypt.136.t: "미국의 수락"
 egypt.136.d: "우리는 미국과 최신 M-16 소총을 구매하는 거래를 성사시켰습니다!"
 egypt.136.a: "좋아"
 egypt.137.t: "미국의 거부"
 egypt.137.d: "그들은 우리에게 M16 소총을 판매하지 않을 것이지만, 러시아의 친구들에게 우리가 구매할 수 있는 믿을 만한 AK가 있습니다..."
 egypt.137.a: "젠장"
 EGY_us_ar: "M16 구매"
 EGY_us_ar_desc: "5.56mm M16 돌격소총은 1960년대에 개발되어 제식 채용된 미국의 5.56mm 돌격소총입니다. 미국으로부터 이 소총의 최신 개량형을 구매할 필요가 있습니다."
 egypt.138.t: "이집트 무기 거래"
 egypt.138.d: "이집트 군이 우리의 코르넷 대전차 유도 미사일을 구매하고자 합니다. 판매해야 할까요?"
 egypt.138.a: "무기를 줘라!"
 egypt.138.b: "안된다"
 egypt.139.t: "러시아의 수락"
 egypt.139.d: "다행히도 그들이 우리에게 코르넷 대전차 유도 미사일을 판매할 의향이 있습니다"
 egypt.139.a: "좋아"
 egypt.140.t: "러시아의 거부"
 egypt.140.d: "러시아는 우리에게 코르넷 대전차 유도 미사일을 판매할 의향이 없습니다"
 egypt.140.a: "젠장"
 EGY_ru_kornet: "코르넷 구매"
 EGY_ru_kornet_desc: "코르넷은 툴라 기계설계국이 개발한 러시아의 대전차 유도 미사일 체계(ATGM)입니다. 우리 지상군을 강화하기 위해 이 체계가 필요합니다."
 EGY_cont_two_state_solut: "양국 해법 지속"
 EGY_cont_two_state_solut_desc: "우리는 이스라엘과의 평화 유지 정책을 계속해야 합니다."
 EGY_major_non_nato: "NATO와의 동맹"
 EGY_major_non_nato_desc: "우리의 가장 가까운 동맹은 미국이며, 따라서 NATO 국가들과의 유대를 강화해야 합니다."
 EGY_admin_capital: "NAC 프로젝트"
 EGY_admin_capital_desc: "신행정수도(NAC)는 이집트 카이로 주에 위치한 새로운 도시 공동체이자 카이로 시의 위성도시입니다. 이곳은 이집트의 새 수도가 될 예정입니다. 당시 이집트 주택부 장관 무스타파 마드불리가 이집트 경제 개발 회의에서 발표했습니다. 이 수도는 경제 개발 프로젝트의 하나로 간주되며, '이집트 비전 2030'이라는 더 큰 구상의 일부입니다."
 EGY_unslum_effort: "빈민가 해소 노력"
 EGY_unslum_effort_desc: "우리는 빈민가를 없애고 나라를 더 깨끗하게 만들기 위해 노력을 기울여야 합니다!"
 EGY_suez_canal: "산업 구축 촉진"
 EGY_suez_canal_desc: "우리의 산업 투자가 성공하도록 준비해야 합니다!"
 EGY_national_roads: "국가 도로 프로젝트"
 EGY_national_roads_desc: "이집트는 도로가 절실히 필요합니다. 도로를 건설합시다!"
 EGY_new_delta: "신알라메인 프로젝트"
 EGY_new_delta_desc: "신알라메인은 이집트 대통령 압델 파타 엘시시가 개장한 이집트 북서부의 신도시입니다. 신알라메인은 지중해에 면해 있으며, 보르그 엘아랍 국제공항 서쪽에 위치합니다."
 EGY_condemn_turk_and_qatar: "튀르키예와 카타르 규탄"
 EGY_condemn_turk_and_qatar_desc: "튀르키예와 카타르는 무슬림 형제단 권력의 원천입니다. 이 두 나라를 어떻게 할지 결정해야 합니다."
 EGY_our_vpk: "이집트 군수 복합체"
 EGY_our_vpk_desc: "충분한 외국 무기를 구매하고 제조 역량을 확대함으로써 우리 자체의 무기 생산 체계를 구축할 수 있습니다."
 EGY_fund_research: "연구 자금 지원"
 EGY_fund_research_desc: "충분한 외국 무기를 구매하고 제조 역량을 확대함으로써 우리 자체의 무기를 개발할 수 있습니다."
 EGY_modify_rifles: "소총 개량"
 EGY_modify_rifles_desc: "우리는 새 소총이 필요합니다. 아주 많이. 그리고 좋은 것으로."
 EGY_mod_rockets: "로켓 개량"
 EGY_mod_rockets_desc: "우리는 새 로켓이 필요합니다. 아주 많이. 그리고 좋은 것으로."
 EGY_tanks: "전차 개량"
 EGY_tanks_desc: "우리는 좋은 전차가 많이 필요합니다. 호전적인 이웃들이 우리를 공격할 마음을 크게 먹지 못하도록 말입니다."
 EGY_trucks: "트럭 및 기타 차량"
 EGY_trucks_desc: "우리 보병이 전장에서 안전하다고 느끼도록 새로운 차량, 장갑 수송차, 보병 전투차가 필요합니다."
 EGY_egyptian_divide_foc: "이집트의 분열"
 EGY_egyptian_divide_foc_desc: "새 천년에 콥트인에 대한 우리의 정책을 결정해야 합니다."
 EGY_allow_copt_pol: "콥트인의 정치 참여 허용"
 EGY_allow_copt_pol_desc: "콥트인들이 정치 생활에 진출하여 온전히 참여할 수 있게 됩니다."
 EGY_dontallow_copt_pol: "콥트인의 정치 참여 불허"
 EGY_dontallow_copt_pol_desc: "콥트인들이 정치 생활에 진출하여 온전히 참여할 수 없게 됩니다."
 EGY_fair_priv_cop: "콥트인 달래기"
 EGY_fair_priv_cop_desc: "우리의 이익을 위해 콥트인들을 달래 볼 수 있습니다."
 EGY_prior_arab_ent: "콥트인 제한"
 EGY_prior_arab_ent_desc: "우리의 이익을 위해 콥트인들을 제한해 볼 수 있습니다."
 EGY_rest_chris_pros: "보수주의 달래기"
 EGY_rest_chris_pros_desc: "우리 사회의 보수적 성향을 우리의 이익을 위해 활용할 수 있습니다."
 EGY_free_laws_rel: "세속주의 지원"
 EGY_free_laws_rel_desc: "우리 사회의 세속주의적 성향을 우리의 이익을 위해 활용할 수 있습니다."
 EGY_recruit_christ_milit: "기독교 민병대 모집"
 EGY_recruit_christ_milit_desc: "콥트인들과의 좋은 관계 덕분에, 그들 가운데서 민병대를 모집해 볼 수 있습니다."
 EGY_ibrahim_sinai_militia: "시나이 민병대"
 EGY_ibrahim_sinai_militia_desc: "이브라힘 알아르자니는 친정부 민병대를 지휘하고, 고향인 북시나이에서 이슬람주의자들과 싸우며, 대통령 일족과의 친분 덕분에 자신의 기업 집단의 활동을 나일 계곡의 심장부로까지 확장하면서 이집트에서 가장 강력한 인물 중 한 명으로 빠르게 부상했습니다."
 EGY_military_anger1: "불만스러운 군대"
 EGY_military_anger1_desc: "군대는 현재 우리 정당과 정책에 §R불만§!을 품고 있으나, 당분간 우리에게 어떤 문제도 일으키지 않을 것입니다.\n§W--------------§!\n군대에 대한 우리의 입지가 §H-50 미만으로 하락§!하거나 §H0§!을 초과하면 이 국가 정신은 §R교체§!됩니다. 또한 §H군대 내부 파벌§!을 제거하면 이 국가 정신은 취소됩니다."
 EGY_military_happy: "만족한 군대"
 EGY_military_happy_desc: "군대는 현재 우리 정당과 정책에 §G만족§!하고 있으며, 우리에게 어떤 문제도 일으키지 않을 것입니다.\n§W--------------§!\n군대에 대한 우리의 입지가 §H0 미만으로 하락§!하거나 §H군대 내부 파벌§!을 제거하면 이 국가 정신은 §R교체§!됩니다."
 EGY_military_anger2: "좌절한 군대"
 EGY_military_anger2_desc: "군대는 현재 우리 정당과 정책에 §R좌절§!하고 있으며, 우리에게 몇 가지 문제를 일으키기 시작했습니다.\n§W--------------§!\n군대에 대한 우리의 입지가 §H-100 미만으로 하락§!하거나 §H-50§!을 초과하면 이 국가 정신은 §R교체§!됩니다. 또한 §H군대 내부 파벌§!을 제거하면 이 국가 정신은 취소됩니다."
 EGY_military_anger3: "격분한 군대"
 EGY_military_anger3_desc: "군대는 현재 우리 정당과 정책에 §R격분§!하고 있으며, 문제를 일으키고 있습니다.\n§W--------------§!\n군대에 대한 우리의 입지가 §H-150 미만으로 하락§!하거나 §H-100§!을 초과하면 이 국가 정신은 §R교체§!됩니다. 또한 §H군대 내부 파벌§!을 제거하면 이 국가 정신은 취소됩니다."
 EGY_military_anger4: "불충한 군대"
 EGY_military_anger4_desc: "군대는 현재 우리 정당과 정책 때문에 §R불충§!한 상태이며, 심각한 문제를 일으키고 있습니다.\n§W--------------§!\n군대에 대한 우리의 입지가 §H-200 미만으로 하락§!하거나 §H-150§!을 초과하면 이 국가 정신은 §R교체§!됩니다. 또한 §H군대 내부 파벌§!을 제거하면 이 국가 정신은 취소됩니다."
 EGY_military_anger5: "마비된 군대"
 EGY_military_anger5_desc: "군대는 현재 우리 정당의 정책과 낮은 입지로 인해 §R마비§!된 상태입니다. 군대에 대한 우리의 입지를 높이지 않는 한 이집트 군은 사실상 무용지물입니다.\n§W--------------§!\n군대에 대한 우리의 입지가 §H-200§!을 초과하면 이 국가 정신은 §R교체§!됩니다. 또한 §H군대 내부 파벌§!을 제거하면 이 국가 정신은 취소됩니다."
 EGY_guards_of_secularism: "기회주의적 군대"
 EGY_guards_of_secularism_desc: "이집트 군은 정치적으로든 병참적으로든 더 큰 권력을 부여할 첫 기회를 망설임 없이 잡아 왔습니다. 군은 정부에 대한 자신의 영향력을 위협하는 정당들에 반대합니다. 예를 들어, 군은 무슬림 형제단과 보조를 맞추는 정부가 중앙 정부에 대한 군의 영향력에 반하기 때문에 이를 몰아낼 기회를 놓치지 않을 것입니다.\n\n군은 §W[Neutral_Muslim_Brotherhood_L]§!과 같은 비세속 정당에 반대합니다. 정부에 대한 군의 §Y입지§!는 §G군사 지출§!이나 §R부패§! 같은 여러 요인의 영향을 받습니다. 군에 대한 우리의 §Y입지§!가 §Y-100§! 아래로 떨어지면 군은 정부를 전복하기 위한 행동에 나설 것입니다.\n\n§Y군대§!는 또한 자신의 권력을 축소하려는 시도에 저항하겠지만, 우리가 그들을 제거하는 데 성공하면 우리에게 간섭할 수 없게 될 것입니다."
 egypt.141.t: "이집트에서 군사 쿠데타 발생!"
 egypt.141.d: "오늘 이집트 군 수뇌부가 카이로와 알렉산드리아의 거리로 진입해 여러 정부 건물을 점거했습니다. 그들은 우리 정부의 사임을 요구하고 있습니다!"
 egypt.141.a: "포기해야 할지도 모른다..."
 egypt.141.b: "한 걸음도 물러서지 마라!"
 EGY_natfront_all: "범아랍 노선"
 EGY_natfront_all_desc: "범아랍주의는 아랍 국가와 민족의 단결과 연대를 옹호하며 아랍 세계 전체에 걸친 공통의 정체성, 언어, 문화, 역사를 강조하는 정치 이념입니다. 19세기 말과 20세기 초 식민주의와 서구의 영향에 대한 대응으로 시작된 범아랍주의는 공동의 정치적, 경제적, 사회적 목표를 달성하기 위해 아랍 국가들 간의 협력과 통합을 증진하고자 합니다. 흔히 아랍 민족주의, 반제국주의, 아랍 자결권 추구와 같은 원칙을 내세우며, 외부의 압력과 분열에 맞서 아랍의 단결과 집단적 힘을 위한 구호 역할을 합니다."
 EGY_befr_copt: "콥트인과의 친교"
 EGY_befr_copt_desc: "세속주의 의제를 지속하려면 콥트인들을 달래야 합니다."
 EGY_prob_nas_bord: "국경 부근의 문제"
 EGY_prob_nas_bord_desc: "우리는 팔레스타인의 대의를 지지하지만, 하마스는 무슬림 형제단과 강한 연계를 맺고 있으며 이를 용납할 수 없습니다."
 egypt.142.t: "상호 방위 협정을 제안하는 이집트!"
 egypt.142.d: "수락해야 할까요?"
 egypt.142.a: "물론이지!"
 egypt.142.b: "Sorry, no."
 egypt.143.t: "팔레스타인의 비동의"
 egypt.143.d: "그렇습니다, 그들은 우리의 보호를 원하지 않습니다."
 egypt.143.a: "흥!"
 EGY_approach_fatah: "파타에 접근"
 EGY_approach_fatah_desc: "팔레스타인의 대의가 온전히 보호되도록 파타에 접근해야 합니다!"
 EGY_support_two_state_nas: "양국 해법 지지"
 EGY_support_two_state_nas_desc: "우리는 충만한 평화를 구축하고 팔레스타인의 보호를 준비하기 위해 노력해야 합니다."
 EGY_palest_pact: "팔레스타인과의 통합"
 EGY_palest_pact_desc: "이집트와 팔레스타인 국민의 협력을 통해 우리는 마침내 통합할 준비가 되었습니다!"
 egypt.144.t: "통합을 제안하는 이집트"
 egypt.144.d: "이집트 정부가 완전한 연방제 수립을 통해 우리와 이집트 사이의 완전한 통합을 제안합니다."
 egypt.144.a: "우리는 완전히 복종할 준비가 되었다!"
 egypt.144.b: "연방 제안에 동의한다!"
 egypt.144.c: "우리는 동의하지 않는다!"
 EGY_egyp_rev_com_con: "이집트 혁명지휘평의회"
 EGY_egyp_rev_com_con_desc: "혁명지휘평의회는 1952년 혁명 이후 이집트 공화국과 영국-이집트 공동 통치령 수단을 감독하기 위해 설립된 기구였습니다. 평의회는 처음에는 알리 마헤르 파샤를 총리로 선택했으나, 토지 개혁을 둘러싼 갈등 끝에 그를 사임하게 했습니다. 그때 평의회는 이집트의 전권을 장악했습니다. 혁명지휘평의회는 1954년 스스로 해산할 때까지 국가를 통제했습니다."
 EGY_approach_bahrain: "바레인에 접근"
 EGY_approach_bahrain_desc: "필수적인 경제 동맹국으로서의 바레인의 위치는 무역과 투자의 길을 열어 주며, 이는 이집트의 경제 성장을 이끌 수 있습니다."
 EGY_arab_league_tigh: "아랍 연맹과의 유대"
 EGY_arab_league_tigh_desc: "아랍 연맹은 쇄신되고 현대화되어야 합니다. 그러면 유대와 협력이 가속화될 것입니다!"
 EGY_approach_sudan: "수단과의 교섭"
 EGY_approach_sudan_desc: "수단은 오랫동안 무슬림 형제단 동조자들의 통제를 받아 왔습니다. 그러나 그들이 통합에 동의할 가능성은 거의 없습니다."
 EGY_lebanon_business: "레바논 사업"
 EGY_lebanon_business_desc: "레바논은 오랫동안 아랍 세계의 예외적 존재였습니다. 그러나 그것이 그들과 우호 관계를 맺는 데 걸림돌이 되어서는 안 됩니다."
 EGY_approach_cis: "CIS에 접근"
 EGY_approach_cis_desc: "러시아는 우리와 같은 세계관을 가지고 있으며 우리 관계는 언제나 매우 따뜻했습니다. 이를 상호 이익을 위해 활용할 수 있습니다."
 EGY_befriend_india: "인도와의 친교"
 EGY_befriend_india_desc: "민주주의, 다원주의, 경제 발전에 대한 의지라는 공통 가치를 바탕으로, 이집트는 인도를 무역, 투자, 기술 교류를 포함한 여러 분야에서의 자연스러운 동맹으로 봅니다."
 EGY_nasserism_idea: "나세르의 유산"
 EGY_purge_islamist: "이슬람주의자 숙청"
 EGY_purge_islamist_desc: "이슬람주의자들이 우리나라에서 자유롭게 활보하도록 놔둬서는 안 됩니다."
 EGY_secul_educ: "세속 교육"
 EGY_secul_educ_desc: "교육의 세속화가 우리의 최우선 과제여야 합니다."
 EGY_supp_musl_bros: "무슬림 형제단 억압"
 EGY_supp_musl_bros_desc: "국가의 평화와 번영을 위해 무슬림 형제단을 억압해야 합니다."
 EGY_panarab_spirit: "범아랍 정신"
 EGY_panarab_spirit_desc: "아랍 통일의 정신을 되살려야 합니다. 전진하라, 형제들이여!"
 EGY_support_syr: "시리아 지원"
 EGY_support_syr_desc: "외세에 맞선 투쟁을 벌이는 시리아 형제들을 지원해야 합니다!"
 TT_EGY_INTEGRATE_THE_UNION: "향후 §G신흥 독재자§!([Autocracy_L])가 통치하는 아랍 국가들이 아랍 연합 공화국 가입을 신청합니다."
 EGY_negot_iraq: "이라크와의 통합"
 EGY_negot_iraq_desc: "이라크와 통합할 때가 왔습니다!"
 EGY_friend_syria: "시리아와의 통합"
 EGY_friend_syria_desc: "시리아와 통합할 때가 왔습니다!"
 EGY_negot_yemen: "예멘과의 통합"
 EGY_negot_yemen_desc: "예멘과 통합할 때가 왔습니다!"
 EGY_befr_libya: "리비아와의 통합"
 EGY_befr_libya_desc: "리비아와 통합할 때가 왔습니다!"
 EGY_pan_arab_effort: "UAR 선포"
 EGY_pan_arab_effort_desc: "이제 우리는 당당히 단순한 이집트가 아니라 진정한 아랍 연합 공화국임을 선포할 수 있습니다!"
 commie_coal_tt: "§Y[communist_state_L]§!이(가) §Y집권 연립§!에 추가됩니다!"
 EGY_install_true_soc: "노동조합 달래기"
 EGY_install_true_soc_desc: "이집트 노동자의 권리가 온전히 보호되도록 노동조합을 달래야 합니다."
 EGY_ally_commies: "공산주의자와의 동맹"
 EGY_ally_commies_desc: "오늘날 인기를 끄는 살라피 운동에 대한 충성스러운 대안을 제시해야 합니다... 공산주의자들은 어떨까요?"
 EGY_national_of_prop: "급진적 부채 관리"
 EGY_national_of_prop_desc: "부채? 들어 본 적 없습니다."
 EGY_estab_ties_with_china: "중국과의 우정"
 EGY_estab_ties_with_china_desc: "중국은 세계에서 가장 성공한 사회주의 국가입니다. 우리의 우정은 자연스러운 것이며 증진되어야 합니다!"
 EGY_russian_oil_deal: "러시아와의 거래"
 EGY_russian_oil_deal_desc: "러시아는 우리와의 우정과 협력에 많은 관심을 보여 왔습니다. 이 협력을 더 진전시키지 않을 이유가 있겠습니까?"
 national_coal_tt: "§Y[Nat_Populism_L]§!이(가) §Y집권 연립§!에 추가됩니다!"
 EGY_naguit_obs: "민족주의자와의 동맹"
 EGY_naguit_obs_desc: "민족주의자들은 이집트 정치 무대에서 우리의 가장 가까운 동맹이므로 이들과 동맹을 맺어야 합니다."
 EGY_ally_oil: "석유와의 동맹"
 EGY_ally_oil_desc: "우리와 아랍 형제들의 석유 채굴량을 늘려야 합니다. 검은 황금이 흘러야 합니다!"
 EGY_market_neg: "시장 경제와의 동맹"
 EGY_market_neg_desc: "우리 경제를 실험대에 올려서는 안 되며, 오히려 과두 체제를 근절하는 데 집중해야 합니다."
 EGY_support_milindr: "군수 산업 지원"
 EGY_support_milindr_desc: "우리의 팽창을 뒷받침하기 위해 군수 산업을 지원해야 합니다."
 EGY_negot_with_iran: "이란과의 우정"
 EGY_negot_with_iran_desc: "이란과의 과거 관계는 긴장되어 있었지만, 우리는 차이를 극복하고 서로 친구가 되어야 합니다."
 EGY_nasser_legacy: "나세르의 유산"
 EGY_nasser_legacy_desc: "가말 압델 나세르는 우리 국가의 아버지라 할 수 있습니다. 그의 사상을 따라야 합니다!"
 EGY_copts_in_power: "권력을 잡은 콥트인!"
 EGY_copts_in_power_desc: "어찌 된 일인지 콥트인들이 이집트에서 권력을 잡는 데 성공했습니다. 어떻게 하는지 지켜봅시다."
 EGY_boulos_fahly: "불로스 파흐미 추대"
 EGY_boulos_fahly_desc: "불로스 파흐미는 이집트 정부 행정부의 저명한 테크노크라트입니다. 그를 대통령으로 임명해야 합니다."
 EGY_copt_leadertwo_TT: "§Y불로스 파흐미§!가 [Neutral_Autocracy_L]의 지도자가 됩니다!"
 EGY_copt_leader_TT: "§Y타와드로스 2세 교황§!이 [Neutral_Autocracy_L]의 지도자가 됩니다!"
 EGY_pope_president: "교황 대통령"
 EGY_pope_president_desc: "영적으로 합당한 유일한 후보인 타와드로스 교황이 대통령직을 유지해야 합니다!"
 EGY_christian_values: "기독교적 가치"
 EGY_christian_values_desc: "기독교적 가치가 우리 정치 활동의 기반이 되어야 합니다."
 EGY_enforce_christian: "기독교적 가치"
 EGY_enforce_christianity: "기독교적 가치"
 EGY_judicial_reform: "사법 개혁"
 EGY_judicial_reform_desc: "사법 체계에서 부패를 청산하고 무슬림과 비무슬림 사이의 평등을 강제해야 합니다."
 EGY_support_minorities: "소수 집단 지원"
 EGY_support_minorities_desc: "이집트의 다양한 소수 집단을 지원해야 합니다."
 EGY_suppress_islamists: "형제단 억압"
 EGY_suppress_islamists_desc: "무슬림 형제단은 우리가 감당하기 어려울 만큼 인기가 많습니다. 이에 대해 무언가 조치를 취해야 합니다."
 EGY_equal_represent: "평등한 대표성"
 EGY_equal_represent_desc: "모든 소수 집단의 참여를 보장하기 위해 우리나라에 평등을 확립해야 합니다."
 EGY_const_changes: "헌법 개정"
 EGY_const_changes_desc: "새 정부가 집권한 만큼, 헌법을 바꿀 때가 왔습니다."
 EGY_incr_women_rights: "여성 권리"
 EGY_incr_women_rights_desc: "여성의 권리를 신장하는 것은 우리 새 정부에 필수적입니다."
 EGY_support_pharaonism: "파라오주의"
 EGY_support_pharaonism_desc: "파라오주의는 1920년대와 1930년대에 이집트에서 두각을 나타낸 이념이었습니다. 이집트 민족주의의 한 형태로서, 고대 이집트의 역할을 강조하고 반식민주의 정서를 아우르며 고대부터 근대에 이르기까지 이집트 민족의 연속성이 존재한다고 주장했습니다."
 EGY_state_secular: "국가 세속주의"
 EGY_state_secular_desc: "세속주의가 우리나라의 최우선 과제가 되어야 합니다."
 EGY_gov_christ: "정부 기독교"
 EGY_gov_christ_desc: "기독교가 이집트의 국교가 되어야 합니다."
 EGY_support_church: "교회 지원"
 EGY_support_church_desc: "교회를 이집트의 주요 사회 제도로서 지원해야 합니다."
 EGY_supp_christians_in_palestine: "성지 해방"
 EGY_supp_christians_in_palestine_desc: "억압적인 정권에 맞서 기독교인 팔레스타인인들을 지원하고 성지를 되찾아야 합니다."
 EGY_invest_copt_us: "미국의 투자"
 EGY_invest_copt_us_desc: "미국이 우리나라에 투자하도록 관심을 끌 수 있을지도 모릅니다."
 EGY_encourage_church_building: "교회 건축 장려"
 EGY_encourage_church_building_desc: "이제 우리나라가 교회 건축을 지원할 때가 왔습니다."
 EGY_friendship_ethiopia: "에티오피아와의 우정"
 EGY_friendship_ethiopia_desc: "에티오피아는 우리의 자연스러운 친구이자 가장 가까운 기독교 동맹국 중 하나입니다. 우리는 함께 단결해야 합니다!"
 EGY_befriend_syria: "시리아와의 친교"
 EGY_befriend_syria_desc: "시리아의 지도층이 우리나라와 매우 가깝기 때문에 시리아는 우리의 긴밀한 동맹국이 될 수 있습니다."
 EGY_south_sudan_interv: "남수단 개입"
 EGY_south_sudan_interv_desc: "남수단을 지원해야 합니다. 북수단은 우리의 역사적 영토이며 해방되어야 합니다!"
 EGY_support_assyrians: "아시리아 디아스포라"
 EGY_support_assyrians_desc: "아시리아 민족의 이해관계를 활용하여 이라크에서의 우리 영향력을 증진할 수 있습니다."
 EGY_lebanon_diplo: "레바논과의 우정"
 EGY_lebanon_diplo_desc: "레바논에는 큰 규모의 기독교 디아스포라가 있으며, 이를 활용하여 우리 동맹들 사이에 정치적 동반자 관계를 구축해 볼 수 있습니다."
 EGY_befriend_armenia: "아르메니아와의 우정"
 EGY_befriend_armenia_desc: "아르메니아는 우리의 자연스러운 친구이자 가장 가까운 기독교 동맹국 중 하나입니다. 우리는 함께 단결해야 합니다!"
 EGY_antisalaf_diplo: "반살라피 외교"
 EGY_antisalaf_diplo_desc: "우리나라와 세계 전반에서 살라피 영향력에 맞서는 길을 계속 가야 합니다."
 egypt.146.t: "우리를 세력에 초청하는 이집트!"
 egypt.146.d: "수락해야 할까요?"
 egypt.146.a: "찬성"
 egypt.146.b: "안된다"
 egypt.147.t: "[From.GetName]의 수락!"
 egypt.147.d: "그들이 우리와 함께할 것입니다."
 Egypt.147.a: "좋아"
 egypt.148.t: "[From.GetName]의 거절!"
 egypt.148.d: "그들은 우리와 함께하지 않을 것입니다."
 Egypt.148.a: "매우 유감이군."
 egypt_sahar.1.t: "이집트의 도움"
 egypt_sahar.1.d: "이집트로부터 제안을 받았습니다. 그들은 UAR 수립 과정에 참여하는 대가로 우리에게 군사 원조를 제공하고 적대 행위 재개를 준비하도록 도울 의향이 있습니다. 이집트의 지원을 수락해야 할까요?"
 egypt_sahar.1.a: "수락해야 한다!"
 egypt_sahar.1.b: "절대로 그들의 괴뢰국이 될 수 없다!"
 egypt_sahar.2.t: "평화 협정"
 egypt_sahar.2.d: "우리는 반군을 막아내지 못했고, 그들이 서사하라 전체를 장악했습니다. 반군에게 평화 조약을 제안하고 영토를 넘겨주어야 할까요?"
 egypt_sahar.2.a: "그들에게 제안을 보내라"
 egypt_sahar.2.b: "그들을 박살내야 한다!"
 egypt_sahar.3.t: "모로코의 제안"
 egypt_sahar.3.d: "모로코가 우리에게 평화 조약 제안을 보내왔으며, 이 성명은 완전한 항복 행위로 볼 수 있습니다! 우리는 항복을 받아들일 수도 있고, 북부 마그레브의 민족들을 해방하기 위해 전 전선에서 진군할 수도 있습니다!"
 egypt_sahar.3.a: "우리가 이겼다!"
 egypt_sahar.3.b: "인민 연방을 향해 전진!"
 egypt_sahar.4.t: "계속되는 전쟁"
 egypt_sahar.4.d: "모로코는 양보할 생각이 없는 것이 분명하며, 우리 민족에게 자유를 주고 싶어 하지 않습니다. 그렇다면 우리는 우리 민족뿐 아니라 모로코 전체의 민족들까지 해방할 것입니다!"
 egypt_sahar.4.a: "인민 연방을 향해 전진!"
 egypt_sahar.5.t: "마침내 찾아온 평화"
 egypt_sahar.5.d: "우리는 사라위와 평화 조약을 체결했으며 전쟁은 끝났습니다."
 egypt_sahar.5.a: "우리의 가장 어두운 시기..."
 egypt_sahar.6.t: "그들의 거부!"
 egypt_sahar.6.d: "사라위가 우리의 평화 조약을 거부했습니다! 전쟁은 계속됩니다!"
 egypt_sahar.6.a: "우리가 이길 것이다!"
 egypt_sahar.7.t: "사라위의 수락!"
 egypt_sahar.7.d: "사라위가 우리의 제안을 수락했습니다."
 egypt_sahar.7.a: "UAR을 향해 전진!"
 egypt_sahar.8.t: "그들의 거부!"
 egypt_sahar.8.d: "사라위가 우리의 제안을 거부했습니다."
 egypt_sahar.8.a: "안타깝군."
 egypt.145.t: "헌법 논쟁"
 egypt.145.d: "이집트가 어떤 정부 형태가 될지 결정해야 합니다. 무엇을 선택하시겠습니까?"
 egypt.145.a: "공화국!"
 egy_secular_republic: "세속 공화국"
 egypt.145.b: "신정!"
 egy_theocratic_monarchy: "기독교 신정"
 EGY_copt_minorities: "소수 집단 지원"
 EGY_pharaonism: "파라오주의"
 eastern_church_egy: "콥트 정교회"
 egypt.149.t: "순조롭게 진행되는 빈민가와의 싸움"
 egypt.149.d: "빈민가 퇴치를 위한 최근의 조치가 원하는 결과를 가져왔습니다.\n\n[egy_slums_desc]\n\n남은 빈민가: §Y[?EGY_slums_left]/16§!"
 egypt.149.a: "좋아"
 egypt.150.t: "콥트인 여론 갱신"
 egypt.150.d: "최근 우리나라의 변화로 인해 콥트인들이 우리를 다르게 대하기 시작했습니다. 그들의 우리에 대한 현재 여론 - §Y[EGY_copt_new_opinion]§!"
 egypt.150.a: "알겠다"
 egy_slums_alot_left: "그러나 [EGY.GetNameWithFlag]에는 여전히 많은 수의 빈민가가 남아 있으므로 멈추기에는 이릅니다."
 egy_slums_medium_left: "[EGY.GetNameWithFlag]의 상당수 빈민가를 이미 줄였지만, 멈추기에는 아직 이릅니다."
 egy_slums_small_left: "[EGY.GetNameWithFlag]의 빈민가를 거의 모두 없앴으며, 몇 곳만 남았습니다."
 egy_slums_no_left: "이것이 [EGY.GetNameWithFlag]의 마지막 빈민가였으므로, 우리 자원을 다른 곳에 돌릴 수 있습니다."
 us_inv_one_tt: "민간 공장 1개를 얻습니다. 우리에 대한 그들의 영향력이 5% 증가합니다"
 EGY_mubarak_money: "알라의 사업"
 EGY_mubarak_money_desc: "알라 무바라크가 사업 입찰을 따냈으며, 이제 외국의 영향력 없는 안정적인 수입을 가져다줍니다.\n이념 성향이 바뀌면 이 국가 정신은 제거됩니다!"
 EGY_us_helps: "미국의 추가 지원"
 EGY_us_helps_desc: "표준 USAID 지원 패키지 외에도 미국은 우리에게 추가 자금을 제공합니다.\n이념 성향이 바뀌면 이 국가 정신은 제거됩니다!"
 EGY_suez_deal_idea: "새 수에즈 협정"
 EGY_suez_deal_idea_desc: "우리는 더 많은 수입을 가져다주는 새로운 수에즈 협정을 체결했습니다."
 EGY_arab_uk_helis: "아랍-영국 헬리콥터"
 EGY_arab_uk_helis_desc: "아랍 영국 헬리콥터 회사는 헬리콥터 제조를 전문으로 하는 영국-이탈리아-이집트 합작 투자 기업입니다."
 Egypt.236.t: "이집트-영국-이탈리아 헬리콥터 공동 생산"
