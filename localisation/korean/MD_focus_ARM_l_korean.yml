 ARM_Zhirair_SOV_TT: "[SOV.GetFlag] §Y[ROOT.GetNameWithFlag]§!에서의 러시아 §H영향력 배수§!: §G-15%§!"
 ARM_Zhirair_UKR_BLR_TT: "[ARM.GetFlag] §Y[ROOT.GetNameWithFlag]§!에서의 아르메니아 §H영향력 배수§!: §R-15%§!"
 arm_economic.2.t: "HSBC 은행의 운명"
 arm_economic.2.d: "HSBC 은행은 90년대부터 우리 영토에서 영업해 왔습니다. 이제 우리 경제가 다시 일어서고 있으므로, 이 은행을 어떻게 할지 결정할 때입니다. 이제 우리는 예전만큼 많은 외국 기업 없이도 해낼 준비가 되었기 때문입니다."
 arm_economic.2.a: "아르드신방크가 은행 지점을 인수한다."
 arm_economic.2.b: "아르메니아에 머물도록 하자."
 arm_economic.3.t: "YCRDI의 운명"
 arm_economic.3.d: "소비에트 시대에 설립된 유명한 연구소인 예레반 수학기계 과학연구소는 지금 쇠퇴하고 있으며, 그 운명을 결정하는 것이 우리에게 중요합니다. 러시아는 우리에게서 소유권을 넘겨받겠다고 제안하고 있으며, 그렇지 않으면 우리가 자체 재원으로 연구소 재편에 투자해야 합니다."
 arm_economic.3.a: "모스크바의 제안을 받아들이겠다."
 arm_economic.3.b: "연구소를 지키겠다."
 arm_economic.4.t: "VEON의 운명"
 arm_economic.4.d: "VEON은 우리나라 통신 시장에 본격적으로 진출할 준비가 되어 있지만, 우리에게는 이들을 인수하여 국내 사업자에게 넘길 수 있는 선택지가 있습니다. 우리의 우선순위는 외국인 투자입니까, 국내 기업 지원입니까?"
 arm_economic.4.a: "건드리지 말자."
 arm_economic.4.b: "그들의 자산을 인수하겠다."
 arm_economic.5.t: "흐라즈단 화력 발전소"
 arm_economic.5.d: "흐라즈단 화력 발전소는 우리나라 최대의 화력 발전소이며, 안타깝게도 그 운명을 결정할 때가 왔습니다. 러시아 가스프롬의 통제 아래 완전히 넘기거나, 아니면 우리 자체 재원을 투입해 이를 지원해야 합니다."
 arm_economic.5.a: "가스프롬이 가져가게 하자."
 arm_economic.5.b: "계속 투자하겠다."
 arm_economic.6.t: "쇼가크의 운명"
 arm_economic.6.d: "쇼가크 공장은 1971년에 설립되었으며, 지금은 우리 동포가 설립한 이스라엘 기업이 인수를 요구하고 있습니다. 우리가 공장에 투자할지, 아니면 민간 소유주에게 넘길지 결정해야 합니다."
 arm_economic.6.a: "가져가게 하자."
 arm_economic.6.b: "계속 투자하겠다."
 arm_economic.7.t: "원자력 발전소"
 arm_economic.7.d: "우리나라는 새 원자력 발전소 건설을 누구에게 맡길지 선택해야 합니다. 러시아, 미국, 아니면 우리 스스로 이렇게 부담스러운 프로젝트에 위험을 무릅쓰고 자금을 투자할까요?"
 arm_economic.7.a: "미국이 해낼 수 있다."
 arm_economic.7.b: "러시아는 이 분야의 전문가다."
 arm_economic.7.c: "아르메니아인이야말로 진정한 핵과학자다."
 arm_economic.8.t: "쇼가크 공장의 파산"
 arm_economic.8.d: "쇼가크 공장의 소유주는 파산으로 인해 공장이 문을 닫는다고 공식 발표했습니다."
 arm_economic.8.a: "어쩌다 이렇게 되도록 내버려 두었나."
 arm_economic.9.t: "창게주르 구리·몰리브덴 콤비나트"
 arm_economic.9.d: "이제 콤비나트가 완전히 재건되어야 하므로 그 미래를 결정해야 합니다. 러시아는 자기 비용으로 이를 수행하고 통제권을 얻겠다고 제안하고 있으며, 그렇지 않으면 우리가 직접 재건해야 합니다."
 arm_economic.9.a: "우리가 해낼 수 있다."
 arm_economic.9.b: "러시아에 넘기자."
 arm_economic.10.t: "ErAZ"
 arm_economic.10.d: "ErAZ는 아르메니아 예레반의 자동차 제조업체였으며, 1966년부터 1996년까지 생산한 밴 RAF-977K로 가장 잘 알려져 있습니다. ErAZ 공장 설립 계획은 1964년 12월 31일 아르메니아 소비에트 사회주의 공화국 각료회의에서 나왔습니다. 공장의 운명은 불투명하며, 러시아 투자자에게 민영화하거나 우리 스스로 재건해야 합니다."
 arm_economic.10.a: "우리가 해낼 수 있다."
 arm_economic.10.b: "러시아에 넘기자."
 arm_economic.11.t: "코타이크 양조장"
 arm_economic.11.d: "코타이크 양조장은 1974년 아르메니아 소비에트 사회주의 공화국 정부가 제한된 생산 규모의 국영 기업으로 설립했습니다. 전체 설비가 완공된 뒤 공장은 1978년부터 대규모 생산을 시작했습니다. 소련 해체 후 가기크 차루키안이 1995년 양조장을 인수하여 코타이크와 아르차흐 브랜드로 맥주를 생산하기 시작했습니다. 1997년 카스텔 그룹이 1,700만 미국 달러를 투자하여 양조장의 최대 주주가 되었으며, 이는 아르메니아에 가장 먼저 진출한 외국인 투자자 중 하나였습니다. 이제 우리는 공장을 민영화할 것인지 국가에 귀속시킬 것인지 결정해야 합니다."
 arm_economic.11.a: "우리가 해낼 수 있다."
 arm_economic.11.b: "민영화에 넘기겠다"
 arm_economic.12.t: "예레반 아라라트 브랜디 공장"
 arm_economic.12.d: "공식 명칭이 예레반 아라라트 브랜디·와인·보드카 공장이며 유명 브랜드 노이로 흔히 알려진 예레반 아라라트 브랜디 공장은 아르메니아 예레반의 선도적인 아르메니아 브랜디 생산 기업입니다. 공장은 안타까운 상태에 있으며, 한 민간 투자자가 완전 민영화를 통해 이를 복원하려 하고 있습니다. 그렇지 않으면 국가가 이 유명한 공장을 책임져야 합니다."
 arm_economic.12.a: "우리가 해낼 수 있다."
 arm_economic.12.b: "민영화에 넘기겠다"
 arm_economic.13.t: "예레반 브랜디 회사"
 arm_economic.13.d: "유명 브랜드 \\"ArArAt\\"로 흔히 알려진 예레반 브랜디 회사는 아르메니아의 선도적인 코냑 생산 기업입니다. 이 회사는 러시아 제국 시기인 1887년에 설립되었습니다. 아르메니아가 소비에트화된 후 이 공장은 국영 기업이 되었습니다. 1999년 독립 아르메니아 정부는 이 공장을 프랑스의 증류주 기업 페르노 리카에 매각했습니다. 이 회사의 다양한 코냑 제품은 ArArAt라는 이름으로 표기되어 홍보됩니다. 어쩌면 우리는 결정을 바꾸어 이 공장의 통제권을 되찾고 싶어질 수도 있고, 아니면 마침내 공장을 프랑스 투자자의 소유로 남겨 두기로 결정할 수도 있습니다."
 arm_economic.13.a: "공장을 인수하겠다."
 arm_economic.13.b: "프랑스에 남겨 두자."
 arm_economic.14.t: "ErAZ"
 arm_economic.14.d: "안타깝게도 ErAZ 공장은 세계 시장에서 경쟁하지 못하고 파산을 선언해야 했습니다. 우리 스스로 공장을 되살리려는 시도를 생각해 봐야 할까요?"
 arm_economic.14.a: "아니."
 arm_economic.14.b: "우리가 해낼 수 있다."
 arm_economic.15.t: "국내 IT 부문의 새로운 주자들"
 arm_economic.15.d: "우리 IT 산업에 새로운 기업들이 가세했으며, 이들이 우리 IT 부문의 성장을 이끌 것입니다."
 arm_economic.15.a: "좋다."
 arm_economic.16.t: "국내 IT 부문의 새로운 주자들"
 arm_economic.16.d: "우리 IT 산업에 새로운 기업들이 가세했으며, 이들이 우리 IT 부문의 성장을 이끌 것입니다."
 arm_economic.16.a: "좋다."
 arm_economic.17.t: "아르메니아의 MSU 분교"
 arm_economic.17.d: "MSU가 아르메니아 교육부와 합의하여 이 나라에 분교를 열기로 했습니다. 이제 아르메니아 시민들은 이 러시아 대학의 프로그램을 폭넓게 접할 수 있게 됩니다."
 arm_economic.17.a: "훌륭하군!"
 arm_economic.17.b: "좋아."
 arm_economic.18.t: "투모 개관"
 arm_economic.18.d: "투모는 원래 청소년을 위한 중등 후 교육 센터로 구상되었습니다. 아르메니아계 미국인 기업가 샘 시모냔과 실바 시모냔이 센터의 설립자가 되었습니다. 이제 우리의 교육 체계는 또 하나의 훌륭한 기관으로 확장되었습니다. 투모 센터의 성대한 개관식이 열렸으며, 록 음악가 서지 탱키언과 도리언스의 공연이 함께했습니다."
 arm_economic.18.a: "훌륭하다."
 arm_economic.19.t: "아르메니아 아메리칸 대학교"
 arm_economic.19.d: "아르메니아 아메리칸 대학교는 1990년대에 설립되었으며, 파라마즈 아베디샨 관이 완공됨에 따라 이제 완전한 기관으로 자리 잡았습니다. 아르메니아 시민들은 미국 수준의 교육을 접하고 국제적으로 인정받는 학위를 취득할 수 있습니다."
 arm_economic.19.a: "훌륭하다"
 arm_economic.19.b: "좋아."
 arm_economic.20.t: "아르메니아의 에라스뮈스+"
 arm_economic.20.d: "아르메니아가 에라스뮈스+ 프로그램에 가입하여 유럽 교육 기관, 특히 교환 프로그램을 선도하는 프랑스와 독일의 교육 기관들과 본격적인 학생 교류를 시작했습니다."
 arm_economic.20.a: "훌륭하군!"
 arm_economic.20.b: "좋아."
 arm_economic.21.t: "아이브 학교"
 arm_economic.21.d: "아이브 교육 재단은 설립 이래 고등학생을 위한 심화 교과 과정을 시행하고, 아르메니아 각 지역의 학교에 현대식 교육 실험실을 설치하고, 아르메니아와 아르차흐에서 인기 있는 국제 학교 대회를 개최하고, 교사 재교육을 실시하고, 교수법을 개발하고, 세계 최고의 교과서 일부를 아르메니아어로 번역하고, 교육의 균일성과 교육 조직 관리 체계를 개발하고 시험해 왔습니다. 이 모든 교육 프로그램과 구상의 5년간의 경험을 바탕으로, 모든 현대적 교육 요건을 충족하고 아르메니아 문자의 최고 성과에 기반한 새로운 아르메니아 학교를 설립하기로 결정했습니다."
 arm_economic.21.a: "훌륭하군!"
 arm_economic.22.t: "아르메니아의 케임브리지"
 arm_economic.22.d: "아르메니아는 아르메니아 시민들이 영국식 교육을 받고 다른 영국 학생들과 동등하게 이를 누릴 수 있도록 케임브리지 대학교와 협력하기 시작했습니다."
 arm_economic.22.a: "훌륭하군!"
 arm_economic.22.b: "좋아."
 arm_economic.23.t: "아메리아방크"
 arm_economic.23.d: "아메리아방크는 아르메니아에서 가장 오래된 은행입니다. 이제 은행 제도의 발전 덕분에 이 은행은 우리 경제 발전에 더욱 긍정적인 영향을 미칠 수 있게 될 것입니다."
 arm_economic.23.a: "훌륭하군!"
 arm_economic.1.t: "담배 문제"
 arm_economic.1.d: "담배 회사들은 우리나라 경제에서 큰 영역을 차지하고 있으며, 안타깝게도 지나치게 잘나가고 있습니다. 게다가 일부 외국이 이들을 통해 우리나라에 영향력을 행사할 수도 있으므로, 이제 이 문제를 해결할 때일지도 모릅니다."
 arm_economic.1.a: "다시 사들이겠다."
 arm_economic.1.b: "경찰을 동원해 장악하겠다."
 arm_economic.1.c: "육군 특수 부대를 동원해 장악하겠다."
 arm_economic.1.f: "그들의 뇌물을 받겠다."
 NKR_economy_start: "새천년의 경제"
 NKR_economy_start_desc: "우리의 아름다운 지역은 새천년에 접어들었습니다. 우리는 최근 독립을 얻었으며, 여전히 분쟁 이후의 후유증과 독립 전쟁의 여파를 수습하고 있습니다."
 NKR_economy_police: "경찰 재편"
 NKR_economy_police_desc: "우리는 경찰을 대대적으로 개혁하여 뇌물을 받는 자들을 모두 쫓아내고 인력을 완전히 쇄신할 계획입니다."
 NKR_economy_corruption: "부패 관료 추방"
 NKR_economy_corruption_desc: "모든 부패 관료에게 최후통첩이 주어질 것입니다. 누구도 정의를 피할 수 없습니다. 우리는 정부 기관에서 뇌물을 받는 자들을 완전히 숙청할 계획입니다."
 NKR_economy_nalog: "세제 개혁"
 NKR_economy_nalog_desc: "시민들의 세금 부담을 줄이고 경제의 부담을 덜어 줄 것입니다."
 NKR_economy_construction: "건축 허가 발급 간소화"
 NKR_economy_construction_desc: "우리는 건축 허가 발급 절차를 간소화할 계획입니다. 시민들을 관료주의로 짓누르지 마십시오. 지을 수 있다면 짓게 하십시오!"
 NKR_economy_land: "주인 없는 토지 분배"
 NKR_economy_land_desc: "우리는 시민들이 자기 사업을 포함해 그 땅 위에 무엇이든 일굴 수 있도록 말 그대로 토지를 나누어 줄 준비가 되어 있습니다."
 NKR_economy_selhoz: "농업 생산자 지원"
 NKR_economy_selhoz_desc: "농업 부문은 언제나 우리의 가장 큰 산업 중 하나일 것이며, 우리는 이를 항상 재정적으로 지원할 계획입니다."
 NKR_economy_antimonopol: "독점금지 기관 해체"
 NKR_economy_antimonopol_desc: "독점금지 기관을 해체할 것입니다. 우리 작은 국가에서는 경쟁을 규제할 필요가 없습니다."
 NKR_economy_gas: "가스 보급 추진"
 NKR_economy_gas_desc: "시민들이 언제나 가스를 이용할 수 있도록 공화국 전역에서 대규모 가스 보급 프로그램을 추진할 것입니다!"
 NKR_economy_fermers: "농민 세금 인하"
 NKR_economy_fermers_desc: "우리는 농업을 더욱 장려하고자 하며, 이에 따라 농업 활동에 종사하는 모든 이들의 세금을 인하할 계획입니다."
 NKR_economy_copper_gold: "구리와 금에 대한 투자"
 NKR_economy_copper_gold_desc: "우리 공화국에 자원이 많지는 않을지 몰라도, 우리는 가진 것이라도 경제의 이익을 위해 활용할 계획입니다."
 NKR_economy_gornaya: "광업"
 NKR_economy_gornaya_desc: "우리는 광업에 투자할 계획입니다. 우리와 같은 처지에서도 공화국 영토의 자원을 충분히 개발할 수 있기 때문입니다."
 NKR_economy_support_local: "지역 생산자 지원"
 NKR_economy_support_local_desc: "우리 제조업체 지원은 우리 경제 프로그램의 최우선 과제입니다. 우리는 수입 제품에 대량으로 의존할 수 없습니다."
 NKR_economy_invest_climate: "투자 환경 지원"
 NKR_economy_invest_climate_desc: "외국산 제품에 회의적이기는 하지만, 우리는 투자 환경을 조성하려는 노력을 계속할 것이며 투자는 불필요하지 않을 것입니다."
 NKR_economy_forest: "임업"
 NKR_economy_forest_desc: "우리에게는 추가적인 연료 및 에너지원이 필요합니다. 임업은 다른 모든 산업을 보완하는 산업으로서 상당히 효과적일 수 있습니다."
 NKR_economy_boring_10: "지루한 10퍼센트 성장"
 NKR_economy_boring_10_desc: "우리 경제는 연간 약 10%씩 성장하고 있습니다. 우리가 바라는 최고의 성장은 아니지만, 시민들은 하늘을 찌르는 공약보다 이러한 안정을 더 높이 평가합니다."
 NKR_safe_start: "아르차흐 수호"
 NKR_safe_start_desc: "우리 조국은 끊임없는 위험에 처해 있습니다. 우리는 국경 방어를 신중하게 생각해야 하며, 우리의 안보가 강력한 경제와 군인 및 경찰의 용기 위에 서 있음을 기억해야 합니다."
 NKR_safe_army: "아르차흐 방위군"
 NKR_safe_army_desc: "아르차흐 방위군은 분리 독립한 아르차흐 공화국의 방위 병력이었습니다. 1992년에 창설되어 1990년대 초에 편성되었던 조직되지 않은 방위 부대들을 통합했습니다."
 NKR_planes: "우리의 항공기"
 NKR_planes_desc: "우리 군은 항공기가 절실히 필요하며, 아르메니아에 요청해야 합니다."
 NKR_safe_special_forces: "아르차흐 특수 부대"
 NKR_safe_special_forces_desc: "모든 현대 군대와 마찬가지로, 일반 병사들 외에도 가장 위험한 임무를 수행할 특수 부대가 우리 대열에 있어야 합니다."
 NKR_safe_univer: "크리스타포르 이바냔 군사 대학"
 NKR_safe_univer_desc: "크리스타포르 이바냔 군사 대학은 스테파나케르트에 소재하며 아르차흐 방위군이 운영하던 대학이자 군사 교육 기관이었습니다."
 NKR_safe_anti_air: "방공군"
 NKR_safe_anti_air_desc: "아르메니아군과 마찬가지로 우리도 자체 방공군을 창설할 것입니다."
 NKR_safe_mo_ra: "아르메낙 한페리얀츠 군사 항공 대학"
 NKR_safe_mo_ra_desc: "우리는 사관생도들을 이 아르메니아 대학에 보내 공부시킬 계획입니다. 강한 군대의 열쇠는 훈련된 군 인력이기 때문입니다."
 NKR_safe_vazgen: "바즈겐 사르그샨 군사 대학"
 NKR_safe_vazgen_desc: "우리는 사관생도들을 이 아르메니아 대학에 보내 공부시킬 계획입니다. 강한 군대의 열쇠는 훈련된 군 인력이기 때문입니다."
 NKR_safe_aspar: "아스파르 암스"
 NKR_safe_aspar_desc: "우리는 군대의 필요를 위해 이 아르메니아 기업의 제품을 구매할 계획입니다."
 NKR_safe_davisur: "다비수르"
 NKR_safe_davisur_desc: "우리는 군대의 필요를 위해 이 아르메니아 기업의 제품을 구매할 계획입니다."
 NKR_safe_full_integrate_army: "아르메니아군과의 완전한 통합"
 NKR_safe_full_integrate_army_desc: "우리는 아르메니아군과의 통합을 최대한 강화할 계획입니다. 그래야만 우리의 연합 병력이 어떤 적의 공격도 격퇴할 수 있습니다."
 NKR_safe_mvd: "내무부"
 NKR_safe_mvd_desc: "우리의 안보는 군대뿐 아니라 경찰과 보안 기관에도 달려 있습니다. 이들이 마땅한 관심과 자원을 받을 수 있도록 해야 합니다."
 NKR_safe_border_troops: "국경 부대"
 NKR_safe_border_troops_desc: "국경 부대는 공기만큼이나 중요합니다. 적들은 결코 쉬지 않으며, 우리의 국경은 늘 감시 아래 있어야 합니다."
 NKR_safe_police_troops: "경찰 부대"
 NKR_safe_police_troops_desc: "아르메니아의 법 집행 기관을 본떠 만든 우리 경찰 병력은 내부 질서를 유지하고 어떤 비상 상황에도 대응할 준비가 되어 있습니다."
 NKR_safe_nss: "아르차흐 국가안보국"
 NKR_safe_nss_desc: "나라를 지켜야 하는 것은 경찰만이 아니며, 국가안보국이 성공적으로 수행하고 있는 특수 기관도 마찬가지입니다."
 NKR_we_are_at_war: "우리는 전쟁 중이다!"
 NKR_we_are_at_war_desc: "아제르바이잔이 우리를 공격했습니다. 이제 싸워야 합니다!"
 NKR_scorched_earth: "초토화"
 NKR_scorched_earth_desc: "아제르바이잔이 사용하지 못하도록 우리 산업의 일부를 파괴할 준비를 해야 합니다."
 NKR_plant_minefields: "지뢰밭 설치"
 NKR_plant_minefields_desc: "일부 영토에서 후퇴하더라도 그곳을 쉽게 통과하지 못하도록 사방에 지뢰를 매설해야 합니다."
 NKR_final_defense: "최후의 방어"
 NKR_final_defense_desc: "최후의 방어를 할 때가 왔습니다. 무릎 꿇고 사느니 서서 죽는 것이 낫습니다."
 ARM_landmines: "아르차흐 지뢰"
 mines_lostprov_tt: "상실한 영토에 지뢰가 매설됩니다!"
 NKR_last_defense: "마지막 방어"
 arm_dashnak.1.t: "코차랸과의 동맹"
 arm_dashnak.1.d: "코차랸은 국가 원수 직에서 물러난 뒤에도 아르메니아 엘리트와 사회에 상당한 영향력을 행사하고 있습니다. 그와 협상하여 우리 편으로 끌어들일 수도 있고, 아니면 그를 확실히 처리할 수도 있습니다"
 arm_dashnak.1.a: "새로운 친구가 생겼다!"
 arm_dashnak.1.b: "절대 안 된다"
 arm_dashnak.2.t: "아르메니아, 군사 협력 확대를 희망"
 arm_dashnak.2.d: "아르메니아 대표단이 양국 간 군사 협력을 확대하고 싶다는 뜻을 공식적으로 전해 왔습니다. 그들의 관점에서 이 조치는 양측 모두에 이롭습니다. 동의해야 할까요?"
 arm_dashnak.2.a: "물론이지!"
 arm_dashnak.2.b: "관심 없다."
 arm_dashnak.3.t: "러시아, 동의"
 arm_dashnak.3.d: "러시아와 아르메니아 대표단이 가까운 시일 내 합동 군사 훈련을 포함한 군사 협력 확대 협정에 서명했습니다! 이는 양국 관계의 새로운 단계입니다."
 arm_dashnak.3.a: "굉장하군!"
 arm_dashnak.4.t: "러시아, 거절"
 arm_dashnak.4.d: "러시아가 거절 의사를 통보해 왔습니다. 그들에 따르면 우리와의 군사 협력 발전에 관심이 없다고 합니다. "
 arm_dashnak.4.a: "다른 동맹을 찾겠다!"
 ARM_in_between_empires: "독수리와 사자 사이에서"
 ARM_in_between_empires_desc: "역사 내내 아르메니아는 영토를 지배하려는 제국들에 의해 찢겨 왔습니다. 옛 제국들은 새로운 이름과 모습을 얻었지만 본질은 같습니다. 살아남으려면 그들과 공통의 언어를 찾아야 할 것입니다."
 ARM_relations_with_europe: "유럽과의 관계"
 ARM_relations_with_europe_desc: "우리는 유럽과의 관계에 집중하고 그들과의 현재와 미래의 관계를 정립해야 합니다."
 ARM_relations_with_russia: "러시아와의 관계"
 ARM_relations_with_russia_desc: "아르메니아의 많은 사람들은 러시아에 대해 매우 양극화된 의견을 가지고 있습니다. 여론과 관계없이, 우리는 우리의 이익을 바탕으로 러시아와의 관계를 구축해야 합니다."
 ARM_partn_coop_agrem: "동반자 및 협력"
 ARM_partn_coop_agrem_desc: "우리는 유럽 연합과의 긴 협력의 여정을 시작하며, 이 협정은 거대한 유럽 가족의 일원이 되는 길의 첫걸음이 될 것입니다."
 ARM_open_action_plan: "개방 행동 계획"
 ARM_open_action_plan_desc: "유럽 연합과의 협력에서 우리는 외교적으로 그 어느 때보다 가까워졌습니다."
 ARM_arm_eu_compr_agre: "강화된 동반자 협정"
 ARM_arm_eu_compr_agre_desc: "유럽 연합과의 동반자 관계는 전례 없는 수준에 도달하고 있으며, 어쩌면 우리는 이미 우호적인 유럽 가족에 합류하기 한 걸음 앞에 와 있는지도 모릅니다."
 ARM_join_council_of_europe: "유럽 평의회 가입"
 ARM_join_council_of_europe_desc: "우리는 유럽의 정치 기구 중 하나로서 우리 자신에게도 중요하다고 인정하는 유럽 평의회와 협력할 계획입니다."
 ARM_standing_comitee_eu_integr: "유럽 통합 상임위원회"
 ARM_standing_comitee_eu_integr_desc: "유럽 공동체로의 통합은 우리가 가야 할 길이며, 우리는 우리와 EU 사이의 기구, 문서, 그 밖의 연결 고리에 대한 참여를 확대할 계획입니다."
 ARM_open_up_for_ngos: "NGO에 문을 열다"
 ARM_open_up_for_ngos_desc: "우리는 시민 사회와 민주 사회의 발전을 개선하기 위해 유럽 NGO들이 우리나라에 들어오는 것을 허용할 계획입니다."
 ARM_instanbul_conventions_discuss: "이스탄불 협약 논의"
 ARM_instanbul_conventions_discuss_desc: "이제 마침내 우리나라 LGBT 시민들의 운명을 결정할 때입니다."
 ARM_prep_article_fortynine: "아르메니아의 제49조 준비"
 ARM_prep_article_fortynine_desc: "마침내 우리가 오랫동안 향해 온 단계에 다가가고 있습니다. 어쩌면 올해 우리는 유럽 연합의 일원이 될 것입니다."
 ARM_prop_against_west_values: "'유럽적' 가치에 대한 선전"
 ARM_prop_against_west_values_desc: "21세기 유럽의 가치는 우리에게 낯설며, 우리 사회를 발전에서 퇴보로 끌어내릴 것입니다."
 ARM_closing_ngos: "NGO 폐쇄"
 ARM_closing_ngos_desc: "유럽 NGO는 우리의 아름다운 나라에 설 자리가 없으며, 그들의 영향력은 우리 시민들에게 너무나 해롭습니다."
 ARM_seizing_eu_funds: "EU 기금 압류"
 ARM_seizing_eu_funds_desc: "서방의 투자는 우리에게 유용하게 쓰일 것이니, 이제 그것을 우리 몫으로 가져갈 때입니다."
 ARM_diplomatic_distance_eu: "EU와의 외교적 거리 두기"
 ARM_diplomatic_distance_eu_desc: "우리는 유럽 연합과 거리를 두고, 그들과의 매우 우호적인 관계를 중단할 계획입니다."
 ARM_slander_pro_europ_parties: "친유럽 정당 비방"
 ARM_slander_pro_europ_parties_desc: "모든 친유럽 정당은 통제되어 그 역량이 제한되어야 하며, 친서방 선전가들이 아르메니아에서 날뛰도록 내버려 두어서는 안 됩니다."
 ARM_close_integr_orgs: "모든 통합 기구 폐쇄"
 ARM_close_integr_orgs_desc: "우리는 모든 유럽 통합 기구와의 협력을 끝냅니다. 유럽식 방식은 이제 충분합니다."
 ARM_negot_individ_trade_agreements: "개별 무역 협정 협상"
 ARM_negot_individ_trade_agreements_desc: "우리는 EU 회원국들과 개별적으로 교류할 계획이며, 국제 정치에서 EU가 이들 국가를 대표한다는 것을 인정하지 않습니다."
 ARM_support_euroscept: "유럽회의주의 지지"
 ARM_support_euroscept_desc: "유럽회의주의는 유럽과의 관계를 이루는 토대 중 하나이며, 앞으로도 그러할 것입니다."
 ARM_levons_legacy: "레본 왕의 유산"
 ARM_levons_legacy_desc: "프랑스와 아르메니아 사이의 형제적 유대는 세월과 어떤 문제를 겪으면서도 이어져 왔고 앞으로도 이어질 것입니다"
 ARM_cultural_econ_fra: "문화 및 경제 관계"
 ARM_cultural_econ_fra_desc: "프랑스와 아르메니아는 수많은 문화적, 역사적 측면으로 연결되어 있으며, 우리는 두 민족의 이익을 위해 협력을 확대할 계획입니다."
 ARM_french_educ_arm: "아르메니아의 프랑스식 교육"
 ARM_french_educ_arm_desc: "프랑스의 교육은 세계 최고 수준 중 하나로 평가받으며, 우리는 우리나라에 프랑스 대학의 분교를 열 계획입니다."
 ARM_military_coop_fra: "프랑스와의 군사 협력"
 ARM_military_coop_fra_desc: "우리는 아르메니아군과 프랑스군 간의 협력을 전례 없는 수준으로 확대할 계획입니다."
 ARM_francophonie_membership: "프랑코포니 회원국 가입"
 ARM_francophonie_membership_desc: "우리는 프랑코포니의 일원이 될 계획이며, 이는 프랑스와의 유대를 크게 강화할 것입니다."
 ARM_armenia_eu_idea: "아르메니아와 유럽 연합"
 ARM_eu_coop_agreement: "동반자 및 협력 협정"
 ARM_eu_council: "유럽 평의회"
 ARM_eu_commitie: "유럽 통합 상임위원회"
 ARM_eu_ngos: "NGO"
 ARM_eu_lgbt: "LGBTQIA에 대한 입장"
 ARM_eu_article_49: "제49조 준비"
 ARM_usa_ngo_leave_idea: "미국 NGO의 철수"
 ARM_usa_noembaracy_idea: "미국 대사관 폐쇄"
 ARM_usa_embaracy_idea: "미국 대사관 확장"
 ARM_help_siryan_idea: "아르메니아군의 지원"
