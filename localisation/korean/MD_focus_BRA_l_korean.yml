 nestor_forster_embassador: "대사 네스토르 포르스테르"
 eduardo_bolsonaro_embassador: "대사 에두아르두 보우소나루"
 BRA_workers_party_alignment_decision_category: "Workers' Party Alignment"
 BRA_workers_party_alignment_decision_category_desc: "Lula and the Workers' Party have found their way to power. Lula and his Workers' Party have made a number of promises to both the Centrão and to the extremists within the country. Will we remain good on our promises and return to our socialist ways? Will we focus on reforms and become a moderate party that receives widespread support for diluted promises? Time will tell what the Workers' Party will achieve during its tenure.\n\nOnce we reach 100 we have fulfilled all of our promises. On the other hand 0 means, we have followed through with none of them.\n\n§YWorkers' Party Alignment§! Value: [?BRA.BRA_brazilian_party_alignment|-50]"
 BRA_decision_support_radicals: "급진주의자 지지"
 BRA_decision_support_radicals_desc: "급진파는 지지를 받습니다."
 BRA_decision_support_reformists: "개혁주의자 지지"
 BRA_decision_support_reformists_desc: "공약을 지킬 필요가 있습니다."
 BRA_decision_the_road_to_el_dorado: "엘도라도로 가는 길"
 BRA_decision_the_road_to_el_dorado_desc: "마나우스는 아마존에 위치하여 고립된 대도시입니다. 도로와 철도 투자로 도시를 새로운 엘도라도로 확장하는데 도움이 될 수 있습니다."
 BRA_decision_expand_the_mining_industry: "광업 확장"
 BRA_decision_expand_the_mining_industry_desc: "지역 광산 산업은 생산량을 늘리기 위해 일부 보조금을 사용할 수 있습니다."
 BRA_decision_increase_the_oil_production: "원유 생산량 증가"
 BRA_decision_increase_the_oil_production_desc: "The coast of the Amazon is full of untapped oil deposits. Let us exploit these."
 BRA_decision_increase_military_production: "아마존 군수 산업"
 BRA_decision_increase_military_production_desc: "마나우스는 새로운 무기 공장을 세우기에 그 잠재성이 높은 곳입니다."
 BRA_decision_tech_metal_industry_in_the_amazon: "아마존에서 희토류의 생산량 증대"
 BRA_decision_tech_metal_industry_in_the_amazon_desc: "A number of resource rich deposits near the Andes boasting impressive amounts of copper, lithium and more have been uncovered in the western reaches of the Amazons. Establishing mining operations of all kinds in this region can allow us to continue to grow the economy of our country and further exploit the natural bounty the Amazon can provide."
 BRA_bolsonaro_alignment_decision_category: "보우소나루 연합"
 BRA_bolsonaro_alignment_decision_category_desc: "보우소나루와 보수 세력이 집권했습니다. 우리는 약속을 지킬 것입니까?"
 BRA_decision_gatter_conservative_support: "보수 세력의 지지 결집"
 BRA_decision_gatter_conservative_support_desc: "보수 세력은 우리를 지지하는 주된 기반입니다."
 BRA_decision_gatter_liberal_support: "자유주의 세력의 지지 결집"
 BRA_decision_gatter_liberal_support_desc: "자유주의 세력이 우리를 지지해야 할 대상입니다."
 BRA_decision_support_private_sector: "민간 부문 지원"
 BRA_decision_support_private_sector_desc: "민간 부문은 우리 경제를 개선하는 데 도움이 될 수 있습니다."
 BRA_decision_support_militaries: "군 지원"
 BRA_decision_support_militaries_desc: "군은 나라를 안전하고 안정적으로 지킵니다."
 BRA_major_development_projects_decision_category: "대규모 개발 사업"
 BRA_major_development_projects_decision_category_desc: "교통공공사업부 장관이 브라질 본토를 개발하고 경제를 개선하기 위한 사업들을 제시했습니다. 그는 이 공사들을 \\"대규모 개발\\" 사업이라 불렀으며, 이는 나라 안의 여러 지역, 특히 아마존 열대우림, 북동부 유역, 강바닥 일대를 확장하고 개발하는 것을 목표로 합니다. 이 모든 대규모 개발을 건설하거나, 필요에 따라 특정 사업만 선택하여 건설할 수 있습니다."
 BRA_decision_reduce_fires: "화재 감소"
 BRA_decision_reduce_fires_desc: "아마존은 매년 불타고 있습니다. 대통령이나 통치자가 누구든지 간에, 그것은 단순히 타오릅니다. 그러나 우리가 좋은 노력을 기울인다면, 이러한 화재를 줄이는 것은 가능합니다. 우리는 목표를 설정한 노력, 광고 등을 통해 산불의 확산을 막기 위한 시도를 할 수 있습니다."
 BRA_decision_safe_mining_expansion: "안전한 광산 확장"
 BRA_decision_safe_mining_expansion_desc: "We can get some resources from the Amazon, to improve our economy, but we need to be careful doing that. The more careful we are the more we are able to continue to grow and develop the Amazon quickly, and more importantly, sustainably. We can utilize some of our conserved Amazon Rainforest acreage that has been prospected for their resources to make a more conservation conscious choice."
 BRA_2002_elections: "2002년 선거"
 BRA_2002_elections_desc: "PSDB의 인기가 하락하는 가운데, 룰라와 에네아스는 빠르게 성장하는 인기를 바탕으로 접전을 벌이고 있습니다. 이 선거가 브라질의 미래를 영원히 결정할 것입니다!"
 BRA_serra: "세하"
 BRA_serra_desc: "카르도주의 후계자 조제 세하가 브라질의 새 대통령이 되었습니다. 브라질 국민을 자랑스럽게 만들고 카르도주의 실수를 바로잡을 수 있겠습니까?"
 BRA_eneas: "에네아스"
 BRA_eneas_desc: "제툴리우 바르가스의 유산에서 영감을 받은 브라질 민족주의자 에네아스 카르네이루가 이제 브라질의 대통령입니다. 그는 브라질을 강력한 국가이자 세계적 초강대국으로 바꿀 수 있겠습니까?"
 BRA_improve_workers_rights: "노동자 권리 개선"
 BRA_improve_workers_rights_desc: "우리나라에서 노동자를 보호하는 법률은 심각하게 부족합니다. 모든 부문의 근로자에 대한 보호를 확대해야 합니다."
 BRA_increase_taxes: "세금 인상"
 BRA_increase_taxes_desc: "우리가 만들 모든 프로그램의 비용을 감당하려면 세금 인상이 필요합니다."
 BRA_improve_the_public_sector: "공공 부문 개선"
 BRA_improve_the_public_sector_desc: "브라질의 공공 부문은 역사적인 투자 부족과 무관심 때문에 이를 이용하는 수백만 브라질인의 요구를 충족할 여건을 갖추지 못했습니다. 공공 부문에 더 많이 투자하여 이를 이용하는 사람들이 약속된 서비스를 효율적으로 받을 수 있도록 하겠습니다."
 BRA_social_enterprises: "사회적 기업"
 BRA_social_enterprises_desc: "공기업은 민영화되기 위한 것이 아니라 국민의, 국민을 위한 기업이 되어야 합니다."
 BRA_economic_interventionism: "경제 개입주의"
 BRA_economic_interventionism_desc: "시장의 횡포로부터 브라질 국민을 보호하려면 국가 개입이 필요합니다."
 BRA_expand_state_owned_companies: "국영 기업 확대"
 BRA_expand_state_owned_companies_desc: "국영 기업은 새로운 브라질 귀족층의 기반을 이룹니다. 카르도주 정부가 그랬던 것처럼 민영화해서는 안 되며, 정부가 국민을 대신하여 관리해야 합니다."
 BRA_introduce_new_regulations: "새로운 경제 규제 도입"
 BRA_introduce_new_regulations_desc: "경제에 타격이 되더라도, 어떤 대가를 치르더라도 소비자와 노동자를 보호해야 합니다."
 BRA_encourage_consumption: "소비 장려"
 BRA_encourage_consumption_desc: "국민의 소비를 장려함으로써 보다 현대적인 소비 경제로 향하는 경제 성장을 촉진할 수 있습니다."
 BRA_national_developmentalism: "국가 개발주의"
 BRA_national_developmentalism_desc: "국가 개발주의는 브라질이 산업화하고 빠르게 발전할 수 있게 만든 원동력이었습니다. 이러한 개발주의 정책은 버려져서는 안 되었으며, 이를 다시 시행하기 위해 노력해야 합니다."
 BRA_social_programs_agenda_lula: "사회 프로그램 의제"
 BRA_social_programs_agenda_lula_desc: "룰라와 노동자당 전체는 국민의 존엄한 삶에 대한 요구를 충족시킬 수 있는 강한 국가를 지지합니다. 당의 의제를 이행하려면 새로운 사회 프로그램을 만들어야 합니다."
 BRA_expand_social_benefits: "사회 복지 확대"
 BRA_expand_social_benefits_desc: "사람들이 존엄한 삶을 살 수 있도록 돕는 사회 정책은 지금 시점에서 부인할 수 없이 필요합니다."
 BRA_education_funding: "교육 재정"
 BRA_education_funding_desc: "브라질은 오랫동안 문맹 문제를 겪어 왔습니다. 교육에 더 많이 투자함으로써 가능한 한 짧은 시일 안에 문맹을 퇴치하기를 희망합니다."
 BRA_university_funding: "대학 재정"
 BRA_university_funding_desc: "우리 대학에 대한 더 큰 투자가 우리나라를 위대함으로 이끌 것입니다."
 BRA_gather_the_teachers_support: "지식인 지지 결집"
 BRA_gather_the_teachers_support_desc: "우리나라를 번영하게 하는 것은 지식과 과학입니다."
 BRA_increase_the_minimun_wage: "최저임금 인상"
 BRA_increase_the_minimun_wage_desc: "브라질은 역사적으로 사회경제적 불평등에 시달려 왔습니다. 제국 시대부터 현대 공화국에 이르기까지 우리 국민은 부유한 이와 가난한 이 사이의 극복할 수 없는 격차로 고통받아 왔습니다. 최저임금을 인상하면 불평등의 영향을 완화하고 현재의 노동자들을 도울 수 있을 것입니다."
 BRA_lula_foreign_policy: "룰라 외교 정책"
 BRA_lula_foreign_policy_desc: "다른 나라의 사회주의 형제들과 연대하는 것은 외교적으로, 경제적으로 우리에게 도움이 될 것입니다."
 BRA_align_to_cuba: "카스트로의 섬"
 BRA_align_to_cuba_desc: "카스트로와 룰라는 매우 오랫동안 좋은 친구였습니다. 쿠바와 관계를 수립하는 것은 우리뿐 아니라 쿠바 국가에게도 필수적입니다."
 BRA_align_to_venezuela: "차베스 방문"
 BRA_align_to_venezuela_desc: "차베스와 룰라는 공통의 관심사와 사상을 공유하므로 베네수엘라와 공식적인 관계를 추구해야 합니다."
 BRA_align_to_bolivia: "에보의 좋은 이웃"
 BRA_align_to_bolivia_desc: "볼리비아는 이제 우리나라와 공통의 관심사를 공유하고 룰라와 우정을 나누는 에보 모랄레스가 이끌고 있습니다."
 BRA_chinese_alignment: "중국과의 우호"
 BRA_chinese_alignment_desc: "중국은 내일의 초강대국입니다. 모든 면에서 미국을 능가할 것입니다. 중국과 더 가까워져야 합니다."
 BRA_chinese_trade: "중국과의 무역"
 BRA_chinese_trade_desc: "동방의 강대국 중국은 내전이 끝난 이후 막대한 경제 성장을 경험했습니다. 스스로를 그들의 동맹으로 자리매김하면 그들의 성공과 투자를 우리에게 유리하게 활용하려 시도할 수 있습니다."
 BRA_brics_investments: "BRICS 투자"
 BRA_brics_investments_desc: "BRICS와의 더 긴밀한 관계는 경제에 활력을 불어넣을 것입니다."
 BRA_international_support: "국제적 지지"
 BRA_international_support_desc: "브라질은 전 세계에서 번영의 등불이 될 것입니다!"
 BRA_the_workers_party_political_path: "당 논의"
 BRA_the_workers_party_political_path_desc: "우리의 선거 운동이 대통령직을 안겨 준 지금, 당은 정책 방향을 발전시켜야 합니다. 우리는 공약을 지킬 것입니까?"
 BRA_a_promise_to_keep: "지켜야 할 약속"
 BRA_a_promise_to_keep_desc: "우리나라, 즉 노수 포부는 부유하지 않습니다. 우리는 가장 강하지 않지만, 국민을 위해 옳은 일을 할 잠재력이 있습니다."
 BRA_align_centrao: "센트랑과 연대"
 BRA_align_centrao_desc: "센트랑과 더 긴밀히 연대하면 의회에서 정치적 지지를 모을 수 있습니다."
 BRA_media_tatics: "미디어 전술"
 BRA_media_tatics_desc: "미디어 자금 지원은 선전을 확산시키는 데 도움이 될 것입니다."
 BRA_mensalao: "멘사랑"
 BRA_mensalao_desc: "우리는 정치적 지지가 필요하며, 그것을 어떻게 얻는지는 중요하지 않습니다."
 BRA_crush_corruption: "부패 척결"
 BRA_crush_corruption_desc: "부패는 우리나라의 문제입니다. 관리들은 자금을 횡령하고 있으며 정치인들은 끊임없이 스캔들에 휩싸입니다. 정부에 대한 국민의 신뢰를 재건해야 합니다!"
 BRA_push_for_an_agrarian_reform: "농지 개혁"
 BRA_push_for_an_agrarian_reform_desc: "농지 개혁은 브라질의 오랜 문제에 대한 해법입니다. 우리나라 농장 대부분이 소수에게 독점되어 있어 소농들이 성장하거나 개선할 길이 막혀 있습니다. 이제 이를 끝낼 때입니다."
 BRA_an_example_of_honesty: "정직의 본보기"
 BRA_an_example_of_honesty_desc: "룰라는 브라질 전체의 모범적인 정치인이 될 것입니다!"
 BRA_space_event_tech_buff: "기술 연구"
 BRA_space_event_tech_buff_desc: "기술은 미래입니다."
 BRA_idea_friendly_natives: "우호적인 원주민들"
 BRA_center_left_policies: "중도좌파 정책"
 BRA_center_left_policies_desc: "정치적 급진주의는 언제나 재앙으로 끝나므로, 브라질에 평화와 번영을 가져오려면 보다 중도에 가까운 길이 우리를 미래로 이끌 것입니다."
 BRA_healthcare_reforms_serra: "보건 개혁"
 BRA_healthcare_reforms_serra_desc: "브라질의 공공 보건은 최상의 상태가 아닙니다. 건강 분야에 대한 많은 투자금이 부패로 인해 다른 곳으로 유용되고 있습니다. 보건 시스템이 진정으로 개선되기 위해서는 개혁이 필요합니다."
 BRA_decentralisation_serra: "분권화 정책"
 BRA_decentralisation_serra_desc: "브라질은 매우 비효율적이고 비용이 많이 드는 관료제 속에서 살아가고 있습니다. 몇 가지 분권화 정책을 시행하면 나라의 관료제를 개선할 수 있을 것입니다."
 BRA_education_reform_serra: "교육 개혁"
 BRA_education_reform_serra_desc: "교육 또한 해결해야 할 문제이므로 일정한 개혁이 필요합니다."
 BRA_support_programs_for_our_students: "학생 지원 프로그램"
 BRA_support_programs_for_our_students_desc: "다음 세대가 언제나 브라질의 미래를 결정합니다. 지금 이 세대를 지원하면 장래에 좋은 지지를 얻게 될 것입니다."
 BRA_higher_minimun_wage_serra: "최저임금 인상"
 BRA_higher_minimun_wage_serra_desc: "브라질은 독립 이래 사회경제적 불평등에 시달려 왔습니다. 제국 시대부터 현대 공화국에 이르기까지, 우리 국민은 부자와 빈자 사이의 거대한 격차로 고통받았습니다. 연방 차원의 도움을 받는다면 이러한 불평등을 줄이고 현재의 노동자들을 도울 수 있을 것입니다."
 BRA_modernize_brazil: "브라질 현대화"
 BRA_modernize_brazil_desc: "모든 개혁을 거쳐 브라질은 전반적인 개혁을 맞이할 준비가 되었고, 현대화의 길에 나설 준비가 되었습니다!"
 BRA_appease_the_congress: "의회 회유"
 BRA_appease_the_congress_desc: "의회는 우리의 개혁안 통과를 도와 브라질을 위대하게 만들 것입니다!"
 BRA_investigate_the_workers_party: "노동자당 조사"
 BRA_investigate_the_workers_party_desc: "룰라와 그의 동료들은 브라질에 위험합니다. 노동자당 일부 인사의 부패가 이미 드러난 만큼, 추가 조사를 벌일 명분이 생겼습니다."
 BRA_anti_communism: "반공주의"
 BRA_anti_communism_desc: "공산주의자들은 결코 국민을 돕고 싶어 한 적이 없습니다. 그들은 오직 권력만을 원했습니다. 그들에게는 정치에서 기회를 줄 필요가 없습니다."
 BRA_reduce_our_foreign_debt: "대외 부채 감축"
 BRA_reduce_our_foreign_debt_desc: "대외 부채를 가능한 한 빨리 털어내야 합니다! 부채는 우리 경제를 해칠 뿐입니다!"
 BRA_o_pais_do_futuro: "미래의 나라"
 BRA_o_pais_do_futuro_desc: "개혁과 발전을 통해 브라질은 현대화되었으며, 이제 발전과 기술 진보의 국제적 모범이 되었습니다!"
 BRA_foreign_policy_serra: "세하의 외교 정책"
 BRA_foreign_policy_serra_desc: "서방과의 관계는 우리에게 이익을 가져다줄 것입니다."
 BRA_american_diplomacy: "미국 외교"
 BRA_american_diplomacy_desc: "미국인들은 우리의 가장 오래된 동맹이며, 그들과 더 많은 관계를 추구해야 합니다."
 BRA_american_trade: "미국과의 무역"
 BRA_american_trade_desc: "무역은 우리 경제의 성장으로 이어질 것입니다."
 BRA_american_investments: "미국의 투자"
 BRA_american_investments_desc: "미국과 같은 서방의 선진 부유국들의 투자는 우리 경제에 도움이 될 수 있습니다!"
 BRA_looking_to_europe: "유럽으로의 시선"
 BRA_looking_to_europe_desc: "오랜 동맹인 유럽은 우리가 독립한 이래 도달하고자 노력해 온 바로 그 모범입니다. 더 긴밀한 유대를 추진해야 합니다."
 BRA_european_trade: "유럽과의 무역"
 BRA_european_trade_desc: "무역은 우리 경제의 성장으로 이어질 것입니다."
 BRA_european_investments_serra: "유럽의 투자"
 BRA_european_investments_serra_desc: "유럽의 투자는 우리 경제를 성장시킬 것입니다."
 BRA_fiscal_reform: "재정 개혁"
 BRA_fiscal_reform_desc: "부채 위기를 개선하려면 재정 개혁이 필요합니다."
 BRA_education_investment: "경쟁력 있는 교육"
 BRA_education_investment_desc: "새로운 세상에서는 더 이상 경제적 역량만이 성장을 이끄는 것이 아닙니다. 교육의 힘은 그 무엇도 능가할 수 없습니다."
 BRA_improve_healthcare_conditions: "보건 여건 개선"
 BRA_improve_healthcare_conditions_desc: "보건 의료의 방치는 브라질의 오랜 문제입니다. 보건 분야의 투자와 개혁이 필요합니다."
 BRA_administrative_reform_serra: "행정 개혁"
 BRA_administrative_reform_serra_desc: "행정 개혁이 필요합니다."
 BRA_federalization_ethos: "연방화 정신"
 BRA_federalization_ethos_desc: "우리의 연방제를 개선해야 합니다."
 BRA_improve_the_real: "헤알화 개선"
 BRA_improve_the_real_desc: "우리의 통화를 개선해야 합니다."
 BRA_effective_public_sector: "효율적인 공공 부문"
 BRA_effective_public_sector_desc: "브라질의 공공 부문은 역사적인 투자 부족과 무관심으로 인해 이를 이용하는 수백만 브라질 국민의 요구를 충족할 만한 여건을 갖추지 못하고 있습니다. 공공 부문에 더 많이 투자함으로써 이를 이용하는 사람들이 약속된 서비스를 효율적으로 받을 수 있도록 하겠습니다."
 BRA_pay_off_the_debt: "부채 상환"
 BRA_pay_off_the_debt_desc: "체결된 대출은 전액 상환해야 합니다. 브라질은 외국 기관의 속박에서 벗어나야 합니다."
 BRA_empower_the_states: "주 권한 강화"
 BRA_empower_the_states_desc: "우리의 연방제를 개선해야 합니다."
 BRA_scientific_efforts: "과학적 노력"
 BRA_scientific_efforts_desc: "과학이 우리를 위대함으로 이끌 것입니다."
 BRA_weaken_economic_regulations: "경제 규제 완화"
 BRA_weaken_economic_regulations_desc: "경제 규제는 브라질 국민의 삶을 더욱 어렵게 만들 뿐입니다. 규제의 상당수를 없애야 하지만, 전부는 아닙니다."
 BRA_employment_projects: "고용 사업"
 BRA_employment_projects_desc: "국가는 실업자들에게 일자리를 제공해야 합니다."
 BRA_infrastructure_projects: "기반시설 계획"
 BRA_infrastructure_projects_desc: "기반시설은 우리 경제 성장에 도움을 줄것입니다."
 BRA_diversify_the_economy: "경제 다변화"
 BRA_diversify_the_economy_desc: "경제를 다변화하는 것은 경제적 독립을 향한 한 걸음입니다."
 BRA_increase_private_sector_role: "민간 부문의 역할 확대"
 BRA_increase_private_sector_role_desc: "민간 부문이 우리 경제를 성장시킬 것입니다."
 BRA_guarantee_civil_liberties: "시민적 자유 보장"
 BRA_guarantee_civil_liberties_desc: "우리는 자유의 등대가 될 것입니다."
 BRA_protect_brazilian_democracy: "브라질 민주주의 수호"
 BRA_protect_brazilian_democracy_desc: "브라질 민주주의가 노동자당이나 PRONA 같은 급진 세력에 의해 훼손되지 않도록 해야 합니다."
 BRA_maintain_power: "PSDB 패권"
 BRA_maintain_power_desc: "정치적 지배권을 확보해야 합니다."
 BRA_crackdown_on_corruption: "부패 단속"
 BRA_crackdown_on_corruption_desc: "부패는 우리나라의 문제입니다. 공직자들은 자금을 횡령하고 있으며, 정치인들은 끊임없이 스캔들에 휘말리고 있습니다. 정부에 대한 국민의 신뢰를 재건해야 합니다!"
 BRA_gather_the_popular_support: "대중의 지지 결집"
 BRA_gather_the_popular_support_desc: "국민의 지지가 필요합니다."
 BRA_ensure_political_majority_psdb: "정치적 지배권 확보"
 BRA_ensure_political_majority_psdb_desc: "정치적 지배권을 확보해야 합니다."
 BRA_positivism: "실증주의"
 BRA_positivism_desc: "실증주의는 우리나라를 미래로 이끄는 사상입니다."
 BRA_idea_opposition_media_desc: "대부분의 언론, 특히 글로부 네트워크는 가능한 모든 방법으로 보우소나루와 그 정부를 공격할 것입니다."
 BRA_idea_mensalao: "멘살라웅 (Mensalão) 스캔들"
 BRA_idea_bolsonarismo: "보우소나루주의"
 BRA_air_trained_pilots: "공중 훈련 조종사"
 brazil.19.a: "정의가 승리하리라!"
 brazil.26.dd: "PRTB가 최선의 선택이다!"
 brazil.37.t: "지우마 호세프 탄핵"
 brazil.37.d: "브라질 제36대 대통령 지우마 호세프에 대한 탄핵은 당시 하원의장이던 에두아르두 쿠냐가 탄핵 청원을 수리한 2015년 12월 2일에 시작되어 2016년 말까지 이어졌습니다. 두 번째 4년 임기의 12개월 이상이 지난 호세프는 브라질 헌법 제85조 5호 및 6호와 재정책임법 제36조를 위반한 범죄적 행정 비위와 연방 예산 무시 혐의로 기소되었습니다. 브라질 정치 체제에서 대통령과 부통령은 같은 후보 명단으로 출마하지만 헌법상 별개의 임기를 가집니다. 1995년부터 2002년까지 페르난두 엔히키 카르도주 대통령 재임 기간 중 하원의장을 지낸 미셸 테메르는 브라질민주운동(MDB) 소속이며, 이 당은 2016년 3월 호세프 정부에 맞서겠다고 발표했습니다."
 brazil.37.a: "탄핵을 승인한다!"
 brazil.38.t: "룰라 체포!"
 brazil.38.d: "전 대통령 룰라 다 시우바가 부패 혐의로 수감되어 10월 대통령 선거에 출마할 수 없게 되었습니다."
 brazil.38.a: "세상에"
 brazil.39.t: "2002년 선거"
 brazil.39.d: "브라질사회민주당(PSDB) 소속 페르난두 엔히키 카르도주 대통령의 두 번째 임기 동안 심각한 경제 위기가 브라질을 덮쳤습니다. 1998년 선거 직후 환율 위기로 시작된 이 위기는 성장률 하락과 실업, 공공 부채 증가를 낳았습니다. 이로 인해 브라질은 거대한 정치적 위기에 빠졌고, 이제 많은 투자자들은 좌익 후보가 선거에서 승리할까 우려하고 있습니다. 차기 대통령은 누가 될까요?"
 brazil.39.a: "브라질사회민주당의 조제 세하"
 brazil.39.b: "노동자당의 루이스 이나시우 룰라 다 시우바"
 brazil.39.c: "국가질서재건당의 에네아스 카르네이루"
 brazil.40.t: "지우마 탄핵 지지 시위"
 brazil.40.d: "오늘 수많은 시위가 지우마 호세프 정부를 끌어내린다는 하나의 목표 아래 브라질 국민을 결집시켰습니다."
 brazil.40.a: "지우마는 물러가라!"
 brazil.41.t: "주이스지포라에서 칼에 찔린 자이르 보우소나루"
 brazil.41.d: "자이르 보우소나루가 오늘 주이스지포라에서 선거 유세 중 칼에 찔렸습니다. 보우소나루가 행진 도중 지역 주민들에게 연설하던 중 공격자가 군중 속에 숨어들어 그의 복부를 찔렀습니다. 의사들에 따르면 자이르가 건강한 상태가 아니었다면 2리터의 피를 잃고 사망했을 가능성이 높았다고 합니다."
 brazil.41.a: "사상 탄압이다!"
 brazil.41.b: "자업자득이다"
 brazil_flavour_events.1.t: "파트리시아 아브라바넬 납치"
 brazil_flavour_events.1.d: "미디어 거물 시우비우 산투스의 딸 파트리시아 아브라바넬의 극적인 납치 사건이 온 나라를 사로잡았습니다. 파트리시아 아브라바넬은 아버지의 중요성에도 불구하고 공개 석상에 거의 모습을 드러내지 않았기에, 이 사건은 많은 이들이 주시하는 사건이 되었습니다. 현재까지 파트리시아는 몸값을 지불하고 풀려났으나, 지역 경찰은 여전히 납치범을 체포하려 하고 있습니다. 지역 경찰이 상황을 통제하고 있다고 주장했음에도, 납치범은 최근 경찰관 두 명을 살해하고 탈출했습니다."
 brazil_flavour_events.1.a: "지역 경찰이 맡은 일을 하게 한다."
 brazil_flavour_events.2.t: "시우비우 산투스 납치"
 brazil_flavour_events.2.d: "연방 경찰이 파트리시아 아브라바넬의 납치범을 수색하기 시작하자, 납치범은 시우비우 산투스의 집에 다시 나타나 그를 인질로 잡았습니다. 그는 상파울루 주지사 제라우두 아우키민이 직접 자신의 투항을 받아 줄 것을 요구했습니다. 주지사의 도움으로 연방 경찰은 납치범의 투항을 받아들였습니다."
 brazil_flavour_events.2.a: "납치범이 마침내 법의 심판을 받게 되었다!"
 brazil_flavour_events.3.t: "시우비우 산투스 살해"
 brazil_flavour_events.3.d: "연방 경찰이 파트리시아 아브라바넬의 납치범을 수색하기 시작하자, 납치범은 시우비우 산투스의 집에 다시 나타나 그를 인질로 잡았습니다. 그는 상파울루 주지사 제라우두 아우키민이 직접 자신의 투항을 받아 줄 것을 요구했습니다. 그러나 관련 경찰관 중 한 명의 실수로 시우비우 산투스와 납치범이 사망했습니다. 야권 언론이 이미 이 소식을 낚아채 전국에 재방송하고 있습니다."
 brazil_flavour_events.3.a: "이것은 국가적 수치다!"
 brazil_flavour_events.4.t: "안토니우 다 코스타 산투스 암살"
 brazil_flavour_events.4.d: "'토니뉴'로 불리던 캄피나스 시장 안토니우 다 코스타 산투스가 오늘 지역 쇼핑몰에서 집으로 운전하던 중 암살당했습니다. 그의 죽음을 둘러싼 상황은 많은 추측을 불러모았습니다. 일부는 정치적 동기에 의한 것이라 보고, 일부는 사고였다고 믿으며, 또 다른 일부는 강도 미수 사건이었다고 믿습니다. 어느 쪽이든 노동자당의 소중한 자산을 잃은 일은 부상하는 좌익 정당에 더 많은 관심을 불러일으켰습니다."
 brazil_flavour_events.4.a: "낙원에 일어난 또 하나의 비극."
 brazil_flavour_events.4.b: "책임자를 찾아내야 한다!"
 brazil_flavour_events.5.t: "브라질, 5번째 FIFA 월드컵 우승"
 brazil_flavour_events.5.d: "2002 FIFA 월드컵은 대회 역사상 가장 중요한 대회 중 하나였습니다. 브라질과 독일이 빼어난 결승전을 치렀고, 결국 브라질이 2대 0으로 승리를 거두었습니다. 독일은 패배를 담담히 받아들였고, 브라질이 새로운 명예로운 세계 기록을 세우도록 해 주었습니다. 이 훌륭한 승리로 브라질은 이제 대회 창설 이래 월드컵 최다 우승국이 되었습니다. 오늘은 브라질 국민에게 자랑스러운 날입니다."
 brazil_flavour_events.5.a: "가자, 가자 브라질!"
 brazil_flavour_events.5.b: "브라질, 브라질, 브라질! "
 brazil_flavour_events.6.t: "카날 호텔 폭탄 테러"
 brazil_flavour_events.6.d: "국제연합이 이라크에 지원 임무단을 설치한 지 불과 며칠 뒤, 자마아트 알타우히드 왈지하드가 카날 호텔에 차량 폭탄을 돌진시켰습니다. 이 테러 공격으로 브라질 출신 국제연합 특별대표 세르지우 비에이라 지 멜루를 포함해 최소 21명이 사망했고, 국제연합 직원과 인력 100명 이상이 부상을 입었습니다."
 brazil_flavour_events.6.a: "평화와 인민의 영웅을 애도한다."
 brazil_flavour_events.6.b: "이 비극은 막을 수 있었다!"
 brazil_flavour_events.7.t: "사이클론 카타리나"
 brazil_flavour_events.7.d: "남부 산타카타리나주 인근 해상에서 이상 현상이 발생했습니다. 남대서양에서 형성된 사이클론 카타리나가 산타카타리나주와 히우그란지두술주의 주민들을 위협하고 있습니다. 이례적인 폭풍으로 많은 이들이 집을 떠나 피난했으나, 우리는 아직 비상사태를 선포하거나 대피령을 내리지 않았습니다. 거듭된 경고와 임박한 재난에도 아직 집을 떠나지 않은 사람들이 많습니다. 어떻게 해야 합니까?"
 brazil_flavour_events.7.a: "위험 지역을 대피시킨다!"
 brazil_flavour_events.7.b: "그들이 스스로 거기서 살기로 했다."
 brazil_flavour_events.8.t: "푸칭 교도소 탈옥 사건의 여파"
 brazil_flavour_events.8.d: "1999년 말, 푸칭 교도소는 브라질 사상 최대 규모의 탈옥이 일어난 현장이었습니다. 수감자 456명 중 345명이 탈옥했습니다. 국제 NGO 휴먼라이츠워치는 브라질을 교도소 보안과 안전 면에서 세계 최악의 국가 중 하나로 꼽았습니다. 현재 이러한 문제 일부를 바로잡기 위한 법안이 추진 중입니다. 법안 통과를 밀어붙이겠습니까, 아니면 정부와 그 부처들이 더욱 신뢰를 잃도록 두겠습니까?"
 brazil_flavour_events.8.a: "승인을 밀어붙인다."
 brazil_flavour_events.8.b: "필요성을 부정한다."
 BRA_add_pt_annex_parties_tt: "§Y[anarchist_communism_L]§!은(는) 브라질에서 유일하게 영향력 있는 좌익 정당이 되며, 가장 인기 있는 정당이 되기도 합니다. 또한 인기도(상대 인기도)를 §G+25.00%§! 얻습니다.\n"
 BRA_mdb_coalition_tt: "§Y[oligarchism_L]§!이(가) 우리 연립에 합류합니다!"
 BRA_economic_focuses_advice_tt: "이 중점들의 비용은 §R부패§! 수준에 따라 달라집니다."
 brazil_flavour_events.1.b: "연방 경찰로 개입한다."
 brazil_flavour_events.9.t: "중앙은행 절도 사건"
 brazil_flavour_events.9.d: "오늘 포르탈레자에서 중앙은행(Banco Central)이 털렸습니다. 중앙은행은 미국의 연방준비제도와 매우 유사하게 기능하며 통화 공급의 유통을 관리합니다. 이 절도는 주모자들이 수개월간 들인 노력과 시간의 결정체였습니다. 도시 거리 아래에서 진행되는 작업을 감추기 위해, 일당이 개조한 건물에 지역 조경 회사가 차려졌습니다. 일당은 거의 두 개 블록에 걸쳐 78미터(약 256피트)를 파고 들어가 은행 바로 아래 지점에 도달했습니다. 계획이 결실을 맺자 이들은 철근 콘크리트 1.1미터(약 3.6피트)를 뚫고 은행 금고로 침입했습니다. 그 결과 R$164,755,150(약 $7,160만 USD)의 지폐가 사라졌으며, 지폐에 연속 번호가 매겨져 있지 않아 분실된 자금을 추적하기는 거의 불가능합니다."
 brazil_flavour_events.9.a: "연방 경찰을 총동원하여 이런 일이 다시 일어나지 않도록 한다."
 brazil_flavour_events.9.b: "잃은 것은 잃은 것이다."
 brazil_flavour_events.10.t: "세르지우 비에이라 지 멜루 메달"
 brazil_flavour_events.10.d: "2003년, 세르지우 비에이라 드 멜로는 유일신과 성전의 공격으로 발생한 카날 호텔 폭탄 테러에서 사망했습니다. 오늘, 법률 제12.281호에 따라 우리는 그의 삶과 업적을 기리기 위해 세르지우 비에이라 드 멜로 메달을 제정했습니다. 브라질은 세계에 우리 영웅들과 국제 평화를 추구하는 용감한 사람들을 존경한다는 것을 보여줍니다."
 brazil_flavour_events.10.a: "세르지우, 당신의 기억을 기립니다."
 brazil_flavour_events.11.t: "TAM 항공 3054편 참사"
 brazil_flavour_events.11.d: "상파울루/콩고냐스 공항에서 TAM 항공 3054편이 인근 주유소에 인접한 급송 창고에 충돌했습니다. 항공기는 충돌과 함께 폭발하여 탑승자 187명 전원과 지상의 12명이 사망했습니다. 3054편은 이제 남미 역사상 가장 많은 사망자를 낸 항공 참사가 되었습니다."
 brazil_flavour_events.11.a: "조종사를 더 잘 훈련시켰어야 했다!"
 brazil_flavour_events.11.b: "우리는 그들을 애도할 것이다."
 brazil_flavour_events.12.t: "2017년 브라질 카니발"
 brazil_flavour_events.12.d: "브라질 카니발은 보통 서커스 요소, 가면, 거리 파티를 결합한 공개 파티 및 퍼레이드를 수반합니다. 사람들은 이 축제의 상당수에서 의상을 입고 일상의 개성을 잊은 채 한층 고조된 사회적 일체감을 경험합니다. 이는 세계 최대의 축제이며 브라질을 진정으로 대표하는 행사입니다."
 brazil_flavour_events.12.a: "최고의 파티가 살바도르에 있는지 리우에 있는지 모르겠다!"
 brazil_flavour_events.13.t: "구세주 그리스도상, 세계 불가사의로 선정"
 brazil_flavour_events.13.d: "세계 신 7대 불가사의(New7Wonders of the World)는 새로운 현대판 세계 7대 불가사의를 선정하기 위해 2000년에 시작된 활동입니다. 이 활동은 고대 불가사의의 거의 대부분이 더 이상 남아 있지 않다는 점을 고려하여 세계 불가사의 목록을 개정하려는 시도로 시작되었습니다. 오늘 리우의 구세주 그리스도상이 세계 신 7대 불가사의 중 하나로 선정되었다고 발표되었습니다."
 brazil_flavour_events.13.a: "브라질의 마음이 자부심으로 벅차오른다!"
 brazil_flavour_events.13.b: "관광 수입이 들어오기를 학수고대한다!"
 BRA_flavour_event.1_tt: "연방 경찰이 개입하여 이 사건의 결과에 자신들의 명성을 겁니다."
 BRA_idea_support_from_the_teachers: "교사들의 지지"
 BRA_idea_brazilian_research_and_development: "브라질 연구 개발"
 BRA_idea_scientific_advances: "과학적 진보"
 BRA_idea_education_reforms: "교육 개혁"
 BRA_idea_imperial_university: "제국 대학"
 brazil.21.t: "복음주의 판사 취임"
 brazil.21.d: "보우소나루 대통령이 이번 주 두 번째 대법관으로 안드레 멘동사 판사를 임명하여, 마침내 선거 공약을 이행하고 그의 당선에 도움을 준 종교계 다수를 만족시켰습니다. 이로써 멘동사 판사는 대법원에 대한 또 하나의 보수 성향 인선이 되었으며, 두 명의 대법관이 더 임명될 예정입니다. 그러나 이 사건은 브라질이 표방해 온 정부의 정교분리를 둘러싼 논란을 불러일으켰는데, 멘동사 판사가 과거 종교로의 회귀 과정이 불가피하다고 보며 종교 기관에 더 많은 권한을 부여해야 한다고 주장한 바 있기 때문입니다."
 brazil.21.a: "신은 공정하며, 우리의 사법부도 그러하다!"
 BRA_influence_EU_tt: "[ROOT.GetNameWithFlag](은)는 모든 EU 회원국에서 §G영향력을 얻고§! 관계가 §G+25§! 향상됩니다.\n"
 BRA_influence_AU_tt: "[ROOT.GetNameWithFlag](은)는 모든 아프리카 연합 회원국에서 §G영향력을 얻고§! 관계가 §G+25§! 향상됩니다.\n"
 BRA_pt_win: "§YPT가 선거에서 승리함§!"
 BRA_psl_win: "§YPSL이 선거에서 승리함§!"
 BRA_psdb_win: "§YPSDB가 선거에서 승리함§!"
 BRA_idea_pro_farmers_desc: "우리는 농업 사회에서 제조업 경제로 서서히 이동하고 있지만, 농민 친화적인 입장을 유지하고 나라의 주요 생산자들을 결코 잊지 않는 것이 필수적입니다."
 BRA_western_investments: "서방의 투자"
 BRA_western_investments_desc: "독일과 미국 같은 서방의 선진 부국으로부터 투자를 받으면 우리 경제에 도움이 될 수 있습니다!"
 BRA_eastern_investments: "동방의 투자"
 BRA_eastern_investments_desc: "동방의 강대국 중국은 내전이 끝난 이후 막대한 경제 성장을 경험했습니다. 스스로를 그들의 동맹으로 자리매김하면 그들의 성공과 투자를 우리에게 유리하게 활용하려 시도할 수 있습니다."
 BRA_anti_rw_rhetoric: "반우익 수사"
 BRA_anti_rw_rhetoric_desc: "우익은 브라질에게 최악의 존재입니다! 지금 당장 끝내야 해요!"
 BRA_new_communist_government: "새로운 공산주의 정부"
 BRA_new_communist_government_desc: "나라의 안정을 보장하려면 정부가 안정되어야 합니다!"
 BRA_underwater_flotilla_desc: "브라질의 함대는 상당히 낡았고 제한적입니다. 세계적 강국으로 자리매김하려면 잠수함 함대를 확장하는 것이 필수적입니다."
 BRA_global_alignment: "세계적 연대"
 BRA_global_alignment_desc: "브라질은 전 세계에서 번영의 등대가 될 것입니다!"
 BRA_focus_tree: "브라질 중점 트리"
 BRA_legalize_independent_amazonian_development: "독립적 아마존 개발 합법화"
 BRA_legalize_independent_amazonian_development_desc: "아마존 개발은 현재 엄격히 규제되어 있으며 개별 기업과 독립적으로 진행하는 것이 허용되지 않습니다. 다양한 개발 부문 전반의 규제를 완화하여 건설, 농업, 광업 기업이 독립적으로 개발할 수 있도록 허용하는 방안을 모색해야 합니다."
 BRA_the_countryside: "농촌 지역"
 BRA_the_countryside_desc: "브라질 인구의 대다수는 동부 해안에 거주하지만, 우리가 수출하고 도시에서 사용하는 농산물 상당수를 재배하는 여러 내륙 지역이 이곳 농촌에 있습니다. 농촌 지역과 그것이 제공하는 혜택을 탐구하고 개선하는 방안을 살펴보아야 합니다."
 BRA_expand_commercialized_sugar_cane: "상업화된 사탕수수 생산 확대"
 BRA_expand_commercialized_sugar_cane_desc: "사탕수수는 이곳 브라질의 환금 작물 중 하나입니다. 국내의 농공업 발전을 더욱 촉진하기를 기대하며 사탕수수 생산의 상업화 부문을 더욱 확대하는 방안을 살펴보아야 합니다."
 BRA_increase_grain_exports: "곡물 수출 증대"
 BRA_increase_grain_exports_desc: "브라질의 농업은 곡물 생산이 큰 비중을 차지하는 엄청나게 거대한 산업입니다. 1차 산업 수출에서 우리의 지배력을 더욱 강화하기 위해 곡물 생산 확대와 해외 곡물 수출 증대에 집중해야 합니다."
 BRA_coffee_plantations: "커피 농장"
 BRA_coffee_plantations_desc: "브라질의 기후는 커피 재배에 유독 적합하며 우리는 19세기 후반부터 주요 생산국이었습니다. 표적 보조금과 상업화된 커피 농장의 확대는 국가의 국내 총생산을 상당히 끌어올릴 것입니다."
 BRA_apirary_expansions: "양봉장 확대"
 BRA_apirary_expansions_desc: "브라질의 완만하게 이어진 초원과 목초지에는 아름다운 꽃밭이 있으며 현지 식생은 신선하고 유기농인 꿀 생산에 도움이 됩니다. 이 지역의 양봉장을 계속 확대하면 상업화된 농산물 수출을 계속 늘릴 수 있습니다."
 BRA_tobacco_plantations: "담배 농장"
 BRA_tobacco_plantations_desc: "우리나라의 북동부 지역에는 여러 담배 농장이 있어 이 지역 경제를 안정시키고 유지하는 데 도움이 되어 왔습니다."
 BRA_expand_corn_production: "옥수수 생산 확대"
 BRA_expand_corn_production_desc: "옥수수는 우리 경제의 핵심 자원이 되었습니다. 나라를 위해, 그리고 국내에서 생산하는 농산물의 다변화를 위해 옥수수 생산을 계속 활용해야 합니다."
 BRA_tea_plantations: "차 농장"
 BRA_tea_plantations_desc: "우리의 기후가 차 재배에 놀라울 만큼 유리하여 일부 지역은 차 생산으로 돌아섰습니다. 수년 전에 형성된 흐름을 계속 따라 상업용 차 농장을 확대해야 합니다."
 BRA_vineyard_expansions: "포도원 확대"
 BRA_vineyard_expansions_desc: "완만하게 이어진 초원과 해안을 따라 자리한 포도원은 서반구가 제공할 수 있는 최고급 포도를 생산합니다. 이를 바탕으로 이 포도원들은 세계적으로 수출되고 전 세계 다양한 시장에서 찾는 세계적으로 유명한 와인을 생산합니다."
 BRA_amazonian_high_command: "아마존 군 사령부 창설"
 BRA_amazonian_high_command_desc: "아마존 열대우림에는 적대적 조우를 위한 잠재적 출구가 다양하게 존재합니다. 아마존 군 사령부를 창설하면 지역 법 집행 기관과 더 잘 조율하고, 재난 복구 및 반카르텔 작전 대응을 조율할 수 있습니다."
 BRA_air_trained_pilots_desc: "조종사를 공중에서 실전 훈련시키면 결국 우리가 가질 수 있는 최고의 공군을 보유하게 될 것입니다."
 BRA_amazon_military_high_command: "§Y아마존 군 최고사령부§! 창설\n"
 BRA_banned_all_amazonian_private_development: "아마존 민간 개발 전면 금지"
 BRA_amazon_invested_in_the_amazon: "아마존 열대우림에 투자"
 BRA_idea_amazonian_development_project_desc: "아마존 개발이라는 위대한 사업이 시작되었습니다. 우리는 아마존의 관료적 절차를 걷어내기 시작했으며, 이는 민간 주체와 정부 모두에게 새로운 경제적 기회를 열어 줍니다."
 BRA_idea_oncoming_debt_crisis: "다가오는 부채 위기"
 BRA_idea_oncoming_debt_crisis_desc: "브라질의 부채는 현재 먹구름처럼 나라 위에 드리워져 있습니다. 최근의 재정 조치로 많은 문제를 완화했지만, 여전히 부채를 갚지 못할 위기에 처해 있습니다. 해외 원조 패키지 같은 몇 가지 방안을 모색하거나, 우리나라에 IMF의 부채 규정을 다시 적용하는 방안을 검토할 수 있습니다.\n\n\n이 국가 정신은 국가의 §YGDP 대비 부채 비율§!이 §G20%§! 아래로 떨어지면 해제됩니다. (현재 비율: [?THIS.debt_ratio|%])"
 BRA_idea_worsening_debt_crisis: "악화되는 부채 위기"
 BRA_idea_worsening_debt_crisis_desc: "미국과 합의에 이르지 못하면서 헤알화는 더욱 붕괴했습니다. 곧 변화를 꾀하지 않으면 우리나라 경제는 서서히 통제에서 점점 더 멀어지고 있습니다. 이제 우리의 유일한 희망은 가능한 한 빨리 부채를 최대한 갚는 것뿐입니다.\n\n\n이 국가 정신은 국가의 §YGDP 대비 부채 비율§!이 §G20%§! 아래로 떨어지면 해제됩니다. (현재 비율: [?THIS.debt_ratio|%])"
 BRA_idea_foreign_debt_assistance: "대외 부채 지원"
 BRA_idea_foreign_debt_assistance_desc: "미국은 우리의 부채 문제 일부를 완화할 수 있도록 해외 원조 부채 패키지를 제공했습니다. 일련의 표적화된 조치를 통해 미국 연방준비제도는 미국 민간 투자자들로부터 우리의 부채를 되사들였고, 우리 측의 부채 상환 의무를 면제해 주었습니다."
 BRA_idea_brazilian_exports_desc: "브라질은 세계 최대 규모의 수출 경제 중 하나입니다. 수출품의 대부분은 농산물과 광석, 목재 같은 원자재 등의 1차 자원입니다."
 BRA_idea_pro_unions_desc: "농업 경제에서 제조업 경제로의 전환을 위해서는 나라 안의 모든 노동자의 권리가 향상되도록 노조 친화적인 입장을 취해야 합니다."
 BRA_idea_pro_industries_desc: "산업 기반의 확장은 우리 경제를 새로운 정점으로 끌어올리기 시작했으며, 이제 산업 친화적인 입장을 굳힐 때입니다."
 BRA_idea_enraged_natives: "분노한 원주민"
 BRA_idea_enraged_natives_desc: "브라질 원주민들은 현재 정부에 격분해 있습니다. 이들은 불균형한 임금, 노동자에 대한 부당한 대우, 만연한 원주민 빈곤 등 다양한 문제를 제기하고 있습니다. 원주민의 곤경을 지원하지 않기로 한다면 더 광범위한 문제가 발생할 수 있습니다."
 BRA_idea_friendly_natives_desc: "정부 구조와 법률의 지속적인 변화가 원주민들의 태도를 우리에게 우호적으로 바꾸어 놓았습니다. 이 노선을 계속 유지한다면 브라질 원주민들은 계속해서 정부를 지지할 것입니다."
 BRA_idea_new_wave_ideas_desc: "세계 무대에서 새로운 강국으로 자리매김하기 시작할 때가 왔습니다. 우리가 위대한 나라의 새로운 진로를 발전시키고 정립해 나가면서 브라질 전역의 많은 사람들이 수많은 새로운 사상을 지지하기 시작했습니다."
 BRA_idea_restricted_travelers_desc: "우리 위대한 나라를 괴롭히던 여행자들의 폐해가 마침내 저지되기 시작했습니다. 우리는 여러 규정과 제한을 적용하여 국내 여행자 수를 억제했습니다."
 BRA_idea_extensive_border_control_desc: "우리는 외국으로부터의 이주민을 막기 위해 국경에 광범위한 국경 통제를 구축했습니다."
 BRA_idea_diplomatic_powerhouse_desc: "브라질은 외교 강국으로 자리매김했습니다. 우리의 강점은 전투력뿐만 아니라 해외에서 스스로를 지켜내는 능력에도 있습니다."
 BRA_idea_the_international_mediator_desc: "남미에서 가장 큰 나라인 브라질은 대부분의 세계 정치에 관여하지 않고 어느 한쪽에 치우쳐서 얻을 것도 거의 없는 특별히 흥미로운 위치에 있습니다. 이러한 입장 덕분에 우리는 다른 이들이 공정할 수 없는 가장 까다로운 상황에서 중재자가 될 수 있습니다. 더욱이 우리 위대한 나라는 동서 진영의 정중앙에 위치하여 다양한 행위자 사이의 분쟁을 중재할 수 있습니다."
 BRA_idea_neo_comunista_desc: "노동자당은 공식적으로 가장 참되고 궁극적인 모습을 받아들였습니다. 이들은 공산주의의 길을 받아들였으며, 이제 진정으로 자유와 평등, 그리고 브라질과 그 미래를 위한 새로운 길의 정당입니다."
 BRA_idea_radical_leftist_desc: "노동자당은 진정으로 급진 정당이 되었습니다. 극좌 정당들을 받아들였으며 전 세계 자본주의 국가들의 해체를 적극 주장하고 있습니다."
 BRA_idea_slightly_radical_desc: "노동자당은 급진 정당으로의 변모를 시작했습니다. 일부 극좌 정당들을 받아들였으며 전 세계 자본주의 국가들의 해체를 적극 주장하기 시작하고 있습니다."
 BRA_idea_well_balanced_desc: "노동자당은 급진과 개혁 사이의 섬세한 균형을 계속 유지하고 있습니다. 극단 세력이나 센트랑 구성원들을 멀어지게 하지 않으면서 사회주의적 수사를 계속 내세워 모든 계층에 호소력을 유지하고 있습니다."
 BRA_idea_slightly_reformistq_desc: "노동자당은 노선을 바꾸었습니다. 당은 더 이상 브라질 공화국의 급진적 전환을 믿지 않고 점진적이고 표적화된 개혁을 추구합니다. 이러한 이념적 입장의 변화로 일부 더 극단적인 세력이 당을 떠났습니다."
 BRA_idea_modern_reformist_desc: "노동자당은 노선을 바꾸었습니다. 당은 더 이상 브라질 공화국의 급진적 전환을 믿지 않고 점진적이고 표적화된 개혁을 추구합니다. 이러한 이념적 입장의 변화로 더 많은 극단 세력이 당을 떠났으며, 지지 기반의 큰 부분을 이루던 급진 세력이 대거 이탈할 우려가 있습니다. 그러나 반대로 점점 더 많은 센트랑 구성원들이 대거 당으로 몰려들고 있습니다."
 BRA_idea_party_of_progress_desc: "노동자당은 노선을 바꾸었습니다. 당은 더 이상 브라질 공화국의 급진적 전환을 믿지 않고 점진적이고 표적화된 개혁을 추구합니다. 이러한 이념적 입장의 변화로 극단 세력이 당을 떠났으며, 그들 대부분은 국가를 해체하고 벽돌 한 장씩 새로 쌓기를 진정으로 바라는 정당을 찾아 나섰습니다. 이는 더 이상 노동자당의 견해가 아니며, 노동자당은 스스로를 진보당으로 개칭하고 브라질의 여러 기관에 걸쳐 광범위한 정치 개혁에 착수했습니다."
 BRA_idea_imbel_desc: "브라질 전쟁물자산업(IMBEL, Indústria de Material Bélico do Brasil)은 브라질 정부의 주된 방위 계약업체입니다. 1930년대 초 휴대용 화기용 총신 및 군도 공장(Fábrica de Canos e Sabres para Armas Portáteis)으로 설립되어 브라질 육군이 생산 할당량에 직접 관여했습니다. 1970년대 후반에 이르러서야 법률 제6227호에 의해 IMBEL이 공식 설립되었으며, 이는 직접적인 민간 투자를 통해 전쟁물자 산업을 육성한다는 명확한 목적을 가지고 있었습니다."
 BRA_idea_modern_artillery_desc: "국가가 보유한 포병 비축 물량을 확대하고 현대화하면 우리가 세계 최고의 군사 강국 중 하나로 더욱 확고히 자리 잡을 수 있습니다."
 BRA_idea_homemade_rifles_desc: "모든 종류의 공장에서 개발할 수 있는 신속 조립 키트를 활용해 가정이나 지하실에서 소총을 제작할 수 있도록 설계합니다. 이러한 무기의 생산 비용과 생산 능력 덕분에 우리나라는 미래에 더욱 잘 대비할 수 있을 것입니다."
 BRA_idea_strength_on_land_desc: ""
 BRA_idea_modern_armor_desc: "우리의 기갑 병과는 시장에서 구하든 국내에서 생산하든, 사용 가능한 최신 기술로 현대화되어야 합니다."
 BRA_idea_braco_forte_mao_amiga_desc: "브라질 육군의 표어 \\"브라수 포르치 마웅 아미가(Braço Forte Mão Amiga)\\", 영어로 \\"강한 팔, 다정한 손\\"은 진정한 민족주의와 애국심을 불러일으킵니다. 군은 브라질이 가장 자랑스러워하는 성취 중 하나이며, 따라서 독립 전쟁부터 최근의 콜롬비아 무장혁명군의 침범에 이르는 풍부하고 활기찬 역사를 기리기 위해 대규모 군대를 계속 유지하는 것이 필수적입니다. 우리는 이 표어를 구현하여 강한 팔을 쓰되, 우리에게 맞서고자 하지 않는 이들에게는 언제나 다정한 손을 내밀 것입니다."
