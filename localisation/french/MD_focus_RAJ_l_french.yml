 pak_raj_border_attack_outcome_tt: "Après §Y10§! jours, une guerre frontalière s'ouvre pour l'État contesté. Une victoire ajoute §Y20 de progression de revendication§!, une défaite en coûte §Y10§!, et un enlisement en coûte §Y5§!.\nSi la propriété, le contrôle ou la présence de troupes change d'abord, l'opération est annulée sans coût."
 raj_chi_border_attack_outcome_tt: "Après §Y10§! jours, une guerre frontalière s'ouvre pour l'État contesté. Une victoire ajoute §Y20 de progression de revendication§!, une défaite en coûte §Y10§!, et un enlisement en coûte §Y5§!.\nSi la propriété, le contrôle ou la présence de troupes change d'abord, l'opération est annulée sans coût."
 border_war_frontier_exercise: "Exercice de frontière"
 border_war_frontier_exercise_desc: "Des manœuvres soutenues à la frontière usent les unités qui y sont stationnées."
 border_war_frontier_operation: "Opération frontière"
 border_war_frontier_operation_desc: "Des opérations actives le long de la frontière usent les unités qui y sont stationnées."
 border_war_state_garrison_tt: "Nous contrôlons le secteur frontalier assigné et y avons au moins §Y5§! divisions stationnées"
 border_war_state_patrol_tt: "Nous contrôlons le secteur frontalier assigné et y avons au moins §Y3§! divisions stationnées"
 border_war_state_mechanized_tt: "Nous contrôlons le secteur frontalier assigné et y avons au moins §Y3§! divisions d'infanterie mécanisée ou motorisée stationnées"
 border_war_state_artillery_tt: "Nous contrôlons le secteur frontalier assigné et y avons au moins §Y3§! divisions d'artillerie ou d'artillerie-roquettes stationnées"
 border_war_operation_blocked.2.t: "Préparatifs abandonnés"
 border_war_operation_blocked.2.d: "La garnison prévue pour l'opération a quitté la frontière avant la fin des préparatifs. L'exercice a été annulé, et le rival a profité de l'ouverture pour prendre l'initiative."
 border_war_operation_blocked.2.a: "Une erreur coûteuse"
 border_war_mobilization_idea: "Mobilisation générale"
 border_war_mobilization_idea_desc: "Les forces armées sont passées sur un pied de crise le long de la frontière contestée."
 pak_raj_border_train_army: "Mener des exercices de l'armée de terre en [From.GetName]"
 pak_raj_border_train_army_desc: "Mener un exercice de quinze jours avec les divisions qui garnisonnent [From.GetName], notre secteur frontalier assigné. Coûte 20 de puissance de commandement. Les unités engagées subissent de l'attrition pendant toute la durée. Augmente la préparation de 3. Faire sortir la garnison avant les quinze jours remet ces 3 de préparation à notre rival.\n\nUne fois l'exercice terminé, l'armée assigne un nouveau secteur frontalier."
 pak_raj_border_train_mechanized: "Mener des exercices mécanisés en [From.GetName]"
 pak_raj_border_train_mechanized_desc: "Mener un exercice mécanisé de quinze jours avec les divisions mécanisées et motorisées stationnées à [From.GetName], notre secteur frontalier assigné. Coûte 20 de puissance de commandement. Les unités engagées subissent de l'attrition pendant toute la durée. Augmente la préparation de 8, avec un risque d'accident. Les retirer avant les quinze jours remet ces 8 de préparation à notre rival.\n\nUne fois l'exercice terminé, l'armée assigne un nouveau secteur frontalier."
 pak_raj_border_train_artillery: "Mener des exercices d'artillerie en [From.GetName]"
 pak_raj_border_train_artillery_desc: "Mener un exercice de tir de quinze jours avec l'artillerie et l'artillerie-roquettes stationnées à [From.GetName], notre secteur frontalier assigné. Coûte 20 de puissance de commandement. Les unités engagées subissent de l'attrition pendant toute la durée. Augmente la préparation de 5. Retirer les pièces avant les quinze jours remet ces 5 de préparation à notre rival.\n\nUne fois l'exercice terminé, l'armée assigne un nouveau secteur frontalier."
 pak_raj_border_stage_incursion: "Monter une incursion frontalière depuis [From.GetName]"
 pak_raj_border_stage_incursion_desc: "Pousser une patrouille au-delà de la ligne depuis [From.GetName], notre secteur frontalier assigné. Coûte 20 de puissance de commandement. Les unités engagées subissent de l'attrition pendant toute la durée. Augmente la tension bilatérale de 15 et comporte un risque de pertes. Retirer la patrouille avant les quinze jours remet 3 de préparation à notre rival.\n\nUne fois la patrouille rentrée, l'armée assigne un nouveau secteur frontalier."
 pak_raj_border_shell_positions: "Bombarder les positions frontalières depuis [From.GetName]"
 pak_raj_border_shell_positions_desc: "Bombarder les positions en face de [From.GetName], notre secteur frontalier assigné, avec l'artillerie et l'artillerie-roquettes qui y sont stationnées. Coûte 20 de puissance de commandement. Les unités engagées subissent de l'attrition pendant toute la durée. Augmente la tension bilatérale de 22, crée davantage de tension mondiale, et comporte un risque de représailles. Retirer les pièces avant les quinze jours remet 5 de préparation à notre rival.\n\nUne fois le bombardement terminé, l'armée assigne un nouveau secteur frontalier."
 pak_raj_border_negotiate: "Ouverture des pourparlers indo-pakistanais"
 pak_raj_border_negotiate_desc: "User de la bonne volonté mutuelle pour réduire la tension bilatérale de 25. Un règlement pacifique de crise appuyé par une forte confiance mutuelle peut réglementer durablement la frontière."
 pak_raj_border_negotiate_tt: "§GLa tension bilatérale indo-pakistanaise diminue de 25§!"
 pak_raj_border_settlement_tt: "§GL'Inde et le Pakistan établissent un règlement frontalier durable§!"
 pak_raj_border_issue_ultimatum: "Émettre un ultimatum territorial"
 pak_raj_border_issue_ultimatum_desc: "Exiger l'État exact soutenu par notre élan local. Un refus permet un but de guerre limité contre cet État."
 pak_raj_border_ultimatum_tt: "Le rival peut restituer l'État contesté ou rejeter la demande et risquer une guerre limitée."
 pak_raj_border_tension_90_required_tt: "La tension bilatérale indo-pakistanaise est d'au moins 90"
 pak_raj_border_stand_down: "Se retirer de la crise"
 pak_raj_border_stand_down_desc: "Mettre fin à la crise, réduire la tension bilatérale de 30, et accepter une perte de soutien de guerre."
 pak_raj_border_stand_down_tt: "§GMet fin à la crise et réduit la tension bilatérale indo-pakistanaise de 30§!"
 pak_raj_border_reject_ultimatum_tt: "§RL'émetteur peut créer un but de guerre limité pour l'État contesté§!"
 pak_raj_border_mediation_offer_tt: "L'escaladeur de la crise décidera s'il accepte la médiation américaine."
 raj_chi_border_train_army: "Mener des exercices de l'armée de terre en [From.GetName]"
 raj_chi_border_train_army_desc: "Mener un exercice de haute altitude de quinze jours avec les divisions qui garnisonnent [From.GetName], notre secteur frontalier assigné. Coûte 20 de puissance de commandement. Les unités engagées subissent de l'attrition pendant toute la durée. Augmente la préparation de 3. Faire sortir la garnison avant les quinze jours remet ces 3 de préparation à notre rival.\n\nUne fois l'exercice terminé, l'armée assigne un nouveau secteur frontalier."
 raj_chi_border_train_mechanized: "Mener des exercices mécanisés en [From.GetName]"
 raj_chi_border_train_mechanized_desc: "Mener un exercice mécanisé de quinze jours en haute altitude avec les divisions mécanisées et motorisées stationnées à [From.GetName], notre secteur de frontière assigné. Coûte 20 de puissance de commandement. Les unités déployées subissent de l'attrition pendant toute la durée. Augmente la préparation de 8, avec un risque d'accident. Les retirer avant les quinze jours reverse les mêmes 8 de préparation à notre rival.\n\nUne fois l'exercice terminé, l'armée assigne un nouveau secteur de frontière."
 raj_chi_border_train_artillery: "Mener des exercices d'artillerie en [From.GetName]"
 raj_chi_border_train_artillery_desc: "Mener un exercice de tir de quinze jours avec l'artillerie et l'artillerie-roquettes stationnées à [From.GetName], notre secteur de frontière assigné. Coûte 20 de puissance de commandement. Les unités déployées subissent de l'attrition pendant toute la durée. Augmente la préparation de 5. Retirer les pièces avant les quinze jours reverse les mêmes 5 de préparation à notre rival.\n\nUne fois l'exercice terminé, l'armée assigne un nouveau secteur de frontière."
 raj_chi_border_stage_incursion: "Monter une incursion frontalière depuis [From.GetName]"
 raj_chi_border_stage_incursion_desc: "Pousser une patrouille au-delà de la ligne depuis [From.GetName], notre secteur de frontière assigné. Coûte 20 de puissance de commandement. Les unités déployées subissent de l'attrition pendant toute la durée. Augmente la tension bilatérale de 15 et comporte un risque de pertes. Retirer la patrouille avant les quinze jours reverse 3 de préparation à notre rival.\n\nUne fois la patrouille rentrée, l'armée assigne un nouveau secteur de frontière."
 raj_chi_border_shell_positions: "Bombarder les positions frontalières depuis [From.GetName]"
 raj_chi_border_shell_positions_desc: "Bombarder les positions face à [From.GetName], notre secteur de frontière assigné, avec l'artillerie et l'artillerie-roquettes qui y sont stationnées. Coûte 20 de puissance de commandement. Les unités déployées subissent de l'attrition pendant toute la durée. Augmente la tension bilatérale de 22, crée davantage de tension mondiale et comporte un risque de représailles. Retirer les pièces avant les quinze jours reverse 5 de préparation à notre rival.\n\nUne fois le bombardement terminé, l'armée assigne un nouveau secteur de frontière."
