 ENG_british_loyalist: "A Administração Moto"
 ENG_british_loyalist_trade: "Concessões Petrolíferas Britânicas (Comércio)"
 raid_type_ENG_Wonga_Coup: "Operação Cagada Épica"
 raid_type_ENG_Wonga_Coup_desc: "A Operação Cagada Épica pretende ser tudo, menos isso. Uma pequena força de mercenários, financiadores e aliados locais tentará derrubar o governo da Guiné Equatorial e instalar uma administração mais favorável."
 ENG_seize_oil_wonga_coup_TT: "§HDesbloqueia Nova Incursão§!: Operação Cagada Épica\n - Unidades de forças especiais [ENG.GetFlag] britânicas poderão intervir e depor [EGU.GetLeader] da [EGU.GetFlag] Guiné Equatorial, substituindo-o pelo líder [ENG.GetFlag] apoiado pela Grã-Bretanha, Severo Moto Nsá.\n\nSe a Operação Cagada Épica for bem-sucedida\n - Tomaremos seus recursos em §H$STATE_319$§!"
 ENG_defence_industry_modifier: "Indústria de Defesa da Grã-Bretanha"
 ENG_good_friday_agreement: "Acordo da Sexta-Feira Santa"
 ENG_good_friday_agreement_desc: "Assinado em 10 de abril de 1998, o Acordo da Sexta-Feira Santa é uma série de acordos menores que encerrou a maior parte da violência associada ao conflito sobre o status da Irlanda do Norte. Os unionistas, também conhecidos como legalistas, em sua maioria protestantes do Ulster, querem permanecer no Reino Unido. Já os republicanos e nacionalistas irlandeses, em sua maioria católicos irlandeses, buscavam que a Irlanda do Norte deixasse o Reino Unido e se juntasse a uma Irlanda unida. Embora possa parecer que o conflito era de natureza teológica, ele era na verdade político e nacional, com a religião servindo em grande parte como marcador de identidade. Sob o Acordo Multipartidário, o autogoverno foi restaurado à Irlanda do Norte na forma de um acordo de compartilhamento de poder entre nacionalistas irlandeses e facções unionistas, respectivamente. As reformas promulgadas sob o acordo iam da reestruturação da polícia ao desarmamento de organizações paramilitares. Essas medidas esperam lançar a base de uma Irlanda mais estável e pacífica."
 ENG_State_17_Paramilitary_Activity: "Atividade Paramilitar:"
 ENG_State_17_Paramilitary_Activity_desc: "Apesar do progresso alcançado pelo Acordo da Sexta-Feira Santa, diversas organizações paramilitares republicanas e legalistas continuam ativas em toda a Irlanda do Norte. Embora muitas tenham declarado formalmente cessar-fogo, esses grupos continuam a manter estruturas, arsenais de armas e influência em comunidades locais. Muitos estão envolvidos em crime organizado, incluindo contrabando, narcóticos, extorsão e ataques punitivos. \n\n§YSerá removido se não controlarmos mais $STATE_17$.§!"
 ENG_additional_expenditure_goodfriday_TT: "Gasto Adicional: §R+0,2%§! do PIB\nGasto Policial Esperado: §R+0,15%§!\nEstabilidade: §G+10,00%§!\n\nReduz todas as penalidades de §YTensões Sectárias§! em §G0,2%§! por nível.\n\nDo nível de Tensões Sectárias:\n$ENG_additional_expenditure_goodfriday_info_TT$\n--------------\n§gEste Espírito Nacional será removido se não Controlarmos mais $STATE_17$.§!"
 ENG_additional_expenditure_goodfriday_state_TT: "Do nível de Tensões Sectárias: (§Y[?ENG_north_irish_agitation]§!/§R100§!)\n- Guarnições Necessárias: §R+[?ENG_Paramilitary_required_garrison]%§!\n- Fator de Crescimento de Produtividade do Estado: §R[?ENG_Paramilitary_state_productivity_growth]%§!\n- Chance de Sabotagem de Fábrica Local: §R[?ENG_Paramilitary_local_factory_sabotage]%§!"
 ENG_the_macabre_alliance: "A Aliança Macabra"
 ENG_the_macabre_alliance_desc: "Desde o final da década de 1980, a BP lançou uma estratégia de fronteira, uma exploração de alto risco e alto retorno com o objetivo de reverter o declínio constante de suas reservas de petróleo. Em 1991, a BP acertou em cheio quando Casanare rendeu à empresa sua maior descoberta de petróleo em mais de duas décadas. Mas com alto risco de ataques guerrilheiros. Só nos últimos anos, o Exército de Libertação Nacional (ELN), uma das organizações guerrilheiras da Colômbia, explodiu o oleoduto da Occidental Petroleum mais de 460 vezes, sangrando a empresa americana. A Décima Sexta Brigada, uma unidade especializada do exército notória por suas operações antiéticas, foi criada expressamente para proteger interesses petrolíferos e se tornou o esquadrão da morte pessoal da BP em Casanare. A Décima Sexta Brigada foi financiada e colaborou com a Defence Systems Limited, uma empresa britânica de segurança privada criada por ex-membros do SAS com laços profundos com o Governo Britânico. O Foreign Office deixou sua posição clara: a BP opera sem problemas, custe o que custar. O General Álvaro Velandia Hurtado chama isso de 'resolução de conflitos'. As famílias dos mortos dão outro nome."
 ENG_additional_expenditure_Colombia_TT: "£corruption_cost_factor_texticon  Custo de Poder Político para mudar a Corrupção: §R+15%§!\n--------------\n§YAjuda Militar§! direcionada à [COL.GetFlag] §YColômbia§!:\n- Maior probabilidade de ser aceita.\n- Não exige que estejam ameaçados.\n\n§YManipular a Política§! direcionada à [COL.GetFlag] §YColômbia§!:\n- Requisito de Influência: §G20%§! (30% Base)\n- Custo de Poder Político: §G-25%§!\n\nReceba §G20%§! da receita de exportação de petróleo da [COL.GetFlag] §YColômbia§!\n- Renda Adicional: £income_texticon $$[?additional_income_ENG_columbia_oil|+3]\n--------------\n§gEste Espírito Nacional será removido se a Colômbia eliminar os Cartéis ou se a Corrupção for superior a Corrupção Leve (Nível 2).§!"
 ENG_the_dissident_campaign: "Campanha Dissidente do IRA"
 ENG_the_dissident_campaign_desc: "Rejeitando o Acordo da Sexta-Feira Santa, grupos republicanos dissidentes, como o Real IRA e o Continuity IRA, se recusam a reconhecer como legítima a autoridade britânica na Irlanda do Norte. O Real IRA se separou do IRA Provisório em 1997, alegando ser o verdadeiro republicano e denunciando o processo de paz como uma traição, vendo os Provos como colaboradores que trocaram a república pela autoridade britânica. O Continuity IRA surgiu antes, em 1986, após uma cisão pela decisão do Sinn Féin de encerrar a abstenção do Dáil Éireann, rejeitando a direção da liderança e sustentando que o movimento republicano existente havia abandonado a verdadeira reivindicação constitucional da soberania irlandesa. Ambas as facções rejeitam a legitimidade do processo de paz. Esses grupos sustentam uma insurgência de baixa intensidade contra o governo britânico por meio de bombardeios, tiroteios e ataques direcionados, ao mesmo tempo em que atuam como força policial de fato em redutos republicanos onde a Royal Ulster Constabulary tem controle limitado."
