 GER_idea_DASA: "DASA"
 GER_idea_NL_Cooperation: "Cooperação Militar Germano-Holandesa"
 GER_idea_NL_Cooperation_desc: "A cooperação militar germano-holandesa é uma das mais fortes parcerias de defesa da Europa, enraizada na necessidade da Guerra Fria. Desde então, ambas as nações alinharam suas doutrinas e equipamentos militares, aumentando sua capacidade de operar juntas de forma fluida. A criação do Corpo Germano-Holandês em 1995 consolidou essa relação, criando uma força conjunta que participou com sucesso de diversas missões da OTAN. No início dos anos 2000, esforços para sincronizar o treinamento, padronizar equipamentos e integrar funções militares como a defesa aérea aprofundaram ainda mais essa colaboração. Essa parceria continua servindo de modelo para a defesa europeia, garantindo que ambas as nações permaneçam protagonistas nos esforços de segurança coletiva da OTAN."
 GER_neuer_markt_idea: "Neuer Markt"
 GER_neuer_markt_idea_desc: "O Neuer Markt, criado em 1997, foi a tentativa da Alemanha de criar um segmento da bolsa de valores para empresas jovens e inovadoras, especialmente nos setores de tecnologia e biotecnologia. Inspirado na NASDAQ dos Estados Unidos, o Neuer Markt pretendia oferecer uma plataforma para empresas de alto crescimento e voltadas para o futuro acessarem capital por meio de ofertas públicas iniciais (IPOs). Foi visto como um grande passo na modernização do mercado financeiro alemão, incentivando o espírito empreendedor e fomentando a inovação na Europa. Com requisitos de listagem mais flexíveis do que os das bolsas tradicionais, o Neuer Markt atraiu inúmeras startups, oferecendo aos investidores a oportunidade de participar das florescentes indústrias de internet e tecnologia. Rapidamente tornou-se um símbolo da nova economia, em que se esperava que o progresso tecnológico revolucionasse os modelos de negócios tradicionais."
 GER_neuer_markt_colapse: "O Colapso do Neuer Markt"
 GER_neuer_markt_colapse_desc: "No entanto, o otimismo em torno do Neuer Markt durou pouco. No início dos anos 2000, a bolha das pontocom estourou, e muitas empresas listadas na bolsa não cumpriram suas grandiosas promessas. Ações supervalorizadas, má governança corporativa e a falta de modelos de negócios sustentáveis levaram à queda vertiginosa da confiança dos investidores. O outrora promissor Neuer Markt tornou-se sinônimo de especulação, volatilidade e instabilidade financeira. Desde seu pico em 2000, o mercado perdeu mais de 90% de seu valor, à medida que empresas faliam ou eram retiradas da listagem. Em 2003, o Neuer Markt foi completamente encerrado, vítima de seu próprio entusiasmo desenfreado e do colapso mais amplo do setor pontocom. O colapso serviu como alerta sobre os perigos das bolhas especulativas e a necessidade de forte supervisão em mercados emergentes."
 GER_neuer_markt_colapse_I: "Intervenção do Governo para Mitigar a Quebra do Neuer Markt"
 GER_neuer_markt_colapse_I_desc: "Em resposta ao devastador colapso do *Neuer Markt*, o governo decidiu intervir e fornecer auxílio financeiro para amortecer o golpe. Ao injetar capital em indústrias-chave e oferecer apoio a empresas em dificuldades, o objetivo é estabilizar a economia e evitar mais pânico financeiro. Embora essa intervenção possa limitar os danos de curto prazo, ela tem o custo de maiores gastos públicos e de uma dívida nacional crescente."
 GER_neuer_markt_colapse_II: "Deixar o Mercado se Autorregular"
 GER_neuer_markt_colapse_II_desc: "Acreditando nos princípios do livre mercado, o governo optou por deixar a economia se recuperar por conta própria após o colapso do *Neuer Markt*. Essa abordagem de não intervenção pressupõe que o mercado se corrigirá por meio de ciclos naturais de expansão e retração. Embora isso possa restaurar o equilíbrio no longo prazo, as consequências imediatas serão duras, com empresas falindo e o desemprego subindo enquanto o setor financeiro se reestrutura lentamente."
 GER_subventions_mining: "Subsídios à Mineração"
 GER_subventions_agrar: "Subsídios Agrários"
 GER_idea_swine_flu: "Pandemia de Gripe Suína"
 GER_idea_swine_flu_desc: "A pandemia de Gripe Suína (H1N1) está causando ampla preocupação de saúde pública e perturbações econômicas. A rápida disseminação da doença sobrecarregou os sistemas de saúde, enquanto o medo dos consumidores afeta as indústrias agrícolas que dependem da produção de carne suína. Enfrentar a crise é crucial para estabilizar a nação."
 GER_idea_chicken_flu: "Surto de Gripe Aviária"
 GER_idea_chicken_flu_desc: "Um surto de influenza aviária, comumente conhecida como Gripe do Frango, ameaça a indústria avícola. A alta transmissibilidade da doença e o medo público quanto à segurança alimentar levaram a perdas econômicas e tensões em áreas rurais. São necessárias medidas eficazes de contenção e apoio para evitar mais danos."
 GER_BSE_Crisis_I: "Crise da BSE"
 GER_BSE_Crisis_I_desc: "A Encefalopatia Espongiforme Bovina (BSE), comumente conhecida como 'Doença da Vaca Louca', é uma doença neurodegenerativa fatal que afeta o gado. É causada por príons, proteínas anormais que induzem alterações estruturais em proteínas normais do cérebro, levando a danos cerebrais e sintomas característicos. \n\nSim, testamos os Verdes, e surpreendentemente 87% deram negativo."
 GER_BSE_Crisis_II: "Crise da BSE"
 GER_BSE_Crisis_II_desc: "A Encefalopatia Espongiforme Bovina (BSE), comumente conhecida como 'Doença da Vaca Louca', é uma doença neurodegenerativa fatal que afeta o gado. É causada por príons, proteínas anormais que induzem alterações estruturais em proteínas normais do cérebro, levando a danos cerebrais e sintomas característicos. \n\nSim, testamos os Verdes, e surpreendentemente 87% deram negativo."
 GER_idea_Q_fever: "Surto de Febre Q"
 GER_idea_Q_fever_desc: "Um surto de febre Q, abreviação de 'Query Fever' (febre de origem desconhecida), afeta o gado em todo o país. Essa doença zoonótica, causada pela bactéria *Coxiella burnetii*, espalha-se por produtos animais infectados, poeira e aerossóis. A febre Q não apenas reduz a produção agrícola, como também representa um grave risco à saúde humana, causando sintomas semelhantes aos da gripe e, em casos graves, complicações de longo prazo. O governo deve agir rapidamente para conter a doença e mitigar seu impacto tanto na saúde pública quanto na economia."
 GER_idea_banned_pesticid_used: "Uso de Pesticida Proibido"
 GER_idea_banned_pesticid_used_desc: "O uso de vários pesticidas importantes foi proibido devido a crescentes evidências de riscos ambientais e à saúde pública. Embora essa decisão vise preservar a biodiversidade e proteger os ecossistemas, ela causou perturbações significativas na produção agrícola. Os agricultores agora devem se adaptar a métodos alternativos de controle de pragas, que podem se mostrar custosos e menos eficazes no curto prazo."
 GER_idea_H5N8: "Surto de Influenza Aviária H5N8"
 GER_idea_H5N8_desc: "Uma cepa altamente patogênica de influenza aviária, a H5N8, está se espalhando rapidamente entre populações de aves domésticas e selvagens. Embora o vírus represente pouco risco para os humanos, seu impacto na indústria avícola é devastador, causando abate em massa de aves e perdas econômicas significativas. Medidas urgentes de contenção são necessárias para deter sua propagação e proteger a segurança alimentar."
 GER_idea_Foot_and_moooouuuhhh: "Surto de Febre Aftosa"
 GER_idea_Foot_and_moooouuuhhh_desc: "Foi detectado um surto de Febre Aftosa entre o gado, caracterizado por febre e bolhas em animais de casco fendido, como bovinos, suínos e ovinos. Essa doença altamente contagiosa ameaça o setor agrícola, levando a severas restrições comerciais e ao abate dos rebanhos afetados. É necessária intervenção imediata para evitar maiores consequências econômicas."
 GER_idea_Nazi_I: "Jürgen Rieger"
 GER_idea_Nazi_II: "Ursula Haverbeck"
 GER_idea_Nazi_III: "Franck Rennicke"
 GER_idea_Mauermoerder_I: "Sahra Wagenknecht"
 GER_idea_Mauermoerder_II: "Gregor Gysi"
 GER_idea_Mauermoerder_III: "Anetta Kahane"
 GER_idea_Neutrals_I: "Harald Schmidt"
 GER_idea_Neutrals_II: "Thomas Gottschalk"
 GER_idea_Neutrals_III: "Guido Knopp"
 GER_idea_reform_international_institutions: "Reforma das Instituições Internacionais"
 GER_idea_reform_international_institutions_desc: "A Alemanha busca liderar os esforços de reforma das instituições internacionais, garantindo que elas reflitam melhor as realidades do século XXI. Defendendo maior representação das potências emergentes e melhorando a transparência e a prestação de contas, a Alemanha pretende modernizar essas organizações para enfrentar efetivamente os desafios globais e sustentar a cooperação internacional."
 GER_Ideas_Reformed_German_International_Institutes_desc: "A Alemanha modernizou suas instituições internacionais para aumentar sua eficácia e adaptá-las aos desafios globais em evolução. Essas reformas priorizam a inovação, a cooperação e a garantia de que as instituições alemãs permaneçam na vanguarda da diplomacia e do engajamento multilateral."
 GER_idea_V_Fall: "O Verteidigungs-Fall"
 GER_idea_V_Fall_desc: "A Alemanha decreta o Verteidigungs-Fall ('Estado de Defesa'), uma estratégia de contingência projetada para a mobilização rápida e a coordenação das medidas de defesa nacional. Esse plano garante que a Bundeswehr e a infraestrutura crítica estejam plenamente preparadas para enfrentar ameaças iminentes à segurança e à soberania da Alemanha."
 GER_KfW_IPEX_Bank: "KfW IPEX Bank"
 GER_KfW_IPEX_Bank_desc: "O KfW IPEX-Bank é uma instituição vital para o financiamento de exportações e investimentos da Alemanha. Com foco no apoio aos interesses econômicos nacionais, o banco auxilia na promoção do desenvolvimento de infraestrutura, na proteção de empregos domésticos e no fomento da inovação tecnológica. Suas operações abrangem setores como energia, transporte e manufatura, garantindo que as empresas alemãs permaneçam competitivas no cenário global. Embora contribua significativamente para a estabilidade econômica, o banco também atua na promoção de práticas sustentáveis e projetos de energia renovável, alinhando-se ao compromisso da Alemanha com a responsabilidade ambiental."
 GER_Goethe_intitut: "Goethe-Institut"
 GER_Goethe_Intitut_desc: "O Goethe-Institut, com sede em Munique, é a principal instituição da Alemanha para promover a cultura e o idioma alemães em todo o mundo. Como embaixador cultural, fomenta a cooperação internacional, organiza eventos culturais e oferece cursos de idiomas a milhões de pessoas no mundo todo. Sua sede em Munique simboliza a dedicação do instituto em manter fortes laços culturais ao mesmo tempo em que preserva a rica herança da Alemanha. Com uma rede que abrange mais de 90 países, o Goethe-Institut garante que as contribuições artísticas, literárias e linguísticas da Alemanha ressoem internacionalmente, fortalecendo o poder brando e a influência cultural alemães."
 Humbold_foundation_sharing_group_name: "O Grupo de Compartilhamento da Fundação Humboldt"
 Humbold_foundation_sharing_group_desc: "O Grupo de Compartilhamento da Fundação Humboldt é uma iniciativa criada para fomentar a colaboração acadêmica internacional de longo prazo. Ele conecta ex-bolsistas dos programas da Fundação Alexander von Humboldt a acadêmicos na Alemanha, promovendo projetos de pesquisa conjuntos e intercâmbios acadêmicos recíprocos."
 GER_Ideas_IT_Workers: "Aproveitando o Talento Indiano em TI"
 GER_Ideas_IT_Workers_desc: "A Alemanha pretende aproveitar a força de trabalho qualificada de TI da Índia. Essa iniciativa promove o recrutamento de profissionais indianos de TI para aprimorar as capacidades tecnológicas e suprir a falta de qualificações na indústria alemã de TI."
 GER_Ideas_Chinese_Partners: "Fomentando Parcerias com a China"
 GER_Ideas_Chinese_Partners_desc: "A Alemanha se concentra em fortalecer as parcerias econômicas e tecnológicas com a China. Essa iniciativa visa impulsionar o comércio, a pesquisa colaborativa e a inovação por meio da cooperação mútua e do compartilhamento de conhecimento especializado."
 GER_ideas_Israel_partner: "Colaborando com Inovadores Israelenses"
 GER_ideas_Israel_partner_desc: "A Alemanha busca colaborar com Israel nas áreas de tecnologia e inovação. Essa iniciativa enfatiza empreendimentos conjuntos, parcerias de pesquisa e troca de conhecimento para impulsionar avanços tecnológicos e o crescimento econômico."
 GER_wandel_durch_handel: "Mudança por meio do Comércio"
 GER_wandel_durch_handel_desc: "A Alemanha pretende impulsionar o progresso social e econômico fomentando relações comerciais. Essa estratégia enfatiza o papel do comércio internacional na promoção da paz, da inovação e do desenvolvimento sustentável."
 GER_Ideas_International_education_I: "Educação para a Estabilidade"
 GER_Ideas_International_education_I_desc: "Reconhecendo a educação como pilar da estabilidade global, a Alemanha investe em parcerias acadêmicas com nações em desenvolvimento. Apoiando bolsas de estudo, formação profissional e programas de intercâmbio de professores, essa iniciativa busca fomentar o crescimento social e econômico de longo prazo e fortalecer os laços diplomáticos."
 GER_Ideas_International_education_II: "Programa de Educação Internacional"
 GER_Ideas_International_education_II_desc: "A Alemanha amplia suas iniciativas de educação internacional ao firmar acordos bilaterais com universidades e instituições de pesquisa do mundo todo. Esse programa aumenta a mobilidade estudantil, facilita colaborações de pesquisa de ponta e promove a inovação acadêmica além das fronteiras."
 GER_Ideas_International_education_III: "Promovendo o Idioma Alemão na Educação"
 GER_Ideas_International_education_III_desc: "A Alemanha intensifica os esforços para integrar o idioma alemão aos sistemas educacionais globais. Por meio de programas do Goethe-Institut, bolsas de estudo de idiomas e iniciativas de intercâmbio cultural, essa política visa fortalecer a influência cultural da Alemanha e fomentar uma cooperação internacional mais profunda."
 GER_Luftwaffe_modifier: "Luftwaffe"
 GER_Luftwaffe_modifier_desc: "A Luftwaffe, a força aérea da Bundeswehr. Originalmente concebida como uma força da Guerra Fria, sua missão principal era defender o espaço aéreo da Alemanha Ocidental contra uma possível agressão soviética. No entanto, com o fim da Guerra Fria, a reunificação da Alemanha e a natureza em evolução das ameaças globais, a Luftwaffe enfrenta o desafio de se transformar para atender a novos requisitos de missão."
 GER_Deutsche_Marine_modifier: "Deutsche Marine"
 GER_Deutsche_Marine_modifier_desc: "Durante a Guerra Fria, a missão da Marinha alemã era proteger o litoral da Alemanha Ocidental, garantir o controle de rotas marítimas vitais e contrapor o poder naval soviético no Mar Báltico. A reunificação da Alemanha em 1990 trouxe a integração da Marinha da Alemanha Oriental (Volksmarine) à Deutsche Marine, fundindo diferentes doutrinas, equipamentos e pessoal em uma única força coesa."
 mykonos_judgement: "Mykonos Judgement"
 helmut_hofer_injailed: "Helmut Hofer Injailed"
 GER_increase_rightist_status_by_10: "O status do §HDepartamento 2§! irá §Gaumentar§! em §H10§!"
 GER_increase_rightist_status_by_2: "O status do §HDepartamento 2§! irá §Gaumentar§! em §H2§!"
 GER_Diplomatic: "Diplomacia Alemã"
 GER_Diplomatic_desc: "A política externa da Alemanha ia muito além de simples relações bilaterais. Em vez disso, o país usou uma rede de instituições influentes para ampliar sua projeção global. Organizações como o KfW, o Goethe-Institut, o DAAD e a Fundação Alexander von Humboldt desempenharam papéis cruciais. Essas instituições fomentaram a cooperação econômica, a diplomacia cultural e os intercâmbios acadêmicos, construindo laços internacionais mais fortes e sustentáveis. Em vez de depender apenas de acordos políticos, a Alemanha se concentrou em benefícios de longo prazo por meio de investimentos em educação, infraestrutura e desenvolvimento nos países parceiros. Essa diplomacia institucional reforçou a influência global da Alemanha e promoveu parcerias mutuamente benéficas em todo o mundo."
 GER_HANS_PETER_KIRCHBACH: "Hans Peter Kirchbach"
 GER_International_schools: "Internationale Schulen"
 GER_International_schools_desc: "O financiamento das Escolas Internacionais nos permitirá oferecer educação de ponta a expatriados e imigrantes legais do mundo todo, também nos dando a capacidade de integrá-los ainda mais à cultura e à sociedade alemãs, ao mesmo tempo em que lhes permite manter parte de suas características pessoais."
 GER_Investments_stuggart: "Investimento Americano em Stuttgart"
 GER_Investments_stuggart_desc: "Investidores dos Estados Unidos parecem particularmente interessados em Stuttgart e na região de Baden-Württemberg ao redor, vendo-a como uma caixa aberta de oportunidades prontas para serem exploradas."
 GER_Investments_cologne: "Investimento Russo em Colônia"
 GER_Investments_cologne_desc: "Por outro lado, empresários russos veem o potencial da cidade de Colônia, de alto custo, citando sua popularidade, alta qualidade de vida e atração turística como motivos para que as startups ali sejam promovidas."
 GER_rheinmetall_focus: "Rheinmetall"
 GER_rheinmetall_focus_desc: "We will strike deals with Rheinmetall, and boost their production of military grade vehicles!"
 GER_KMW_focus: "KMW"
 GER_KMW_focus_desc: "KMW will be contacted, and asked to sign deals with our government for new military grade vehicles."
 GER_long_range: "Long Range Abilities"
 GER_long_range_desc: "We need to be able to conduct attacks from a long distance, as if we are not able to, then a superior foe will be able to pummel the nation without us being able to retaliate. The construction of long-range ballistic missile silos will ensure that we can store and deploy these weapons."
 GER_Italian_invasion: "Atacar a Itália"
 GER_Italian_invasion_desc: "A Itália demonstrou que seu exército está repleto de incompetência e desordem. Por isso, podemos ter certeza de que qualquer tipo de resistência do exército italiano pode ser rapidamente esmagada."
 GER_mid_range_desc: "Na Alemanha, uma sociedade equilibrada busca harmonizar diversos elementos sociais, econômicos e culturais. Isso envolve garantir acesso equitativo a recursos, oportunidades e serviços para todos os cidadãos, fomentando a coesão e a estabilidade sociais."
 GER_1_left_side_range_desc: "A Alemanha há muito é um polo de intercâmbio intercultural, onde diversas ideias e práticas culturais são compartilhadas e celebradas. Esse intercâmbio enriquece o tecido cultural da nação, promovendo o entendimento e o respeito mútuos entre diferentes grupos culturais."
 GER_left_side_range_desc: "Uma sociedade inclusiva na Alemanha se esforça para oferecer oportunidades iguais a todos os indivíduos, independentemente de sua origem. Isso inclui esforços para combater a discriminação e promover a integração social, garantindo que todos se sintam valorizados e aceitos."
 GER_middle_left_side_range_desc: "A Alemanha implementou diversas políticas e programas para facilitar a integração dos imigrantes à vida social, econômica e cultural. Esse processo inclui cursos de idiomas, apoio ao emprego e iniciativas de engajamento comunitário para ajudar os imigrantes a se tornarem membros ativos e contribuintes da sociedade."
 GER_far_left_side_range_desc: "A Alemanha é conhecida por sua inovação cultural, em que novas ideias, práticas e produtos surgem continuamente e moldam o cenário cultural. Essa inovação é impulsionada por uma mistura dinâmica de tradição e modernidade, fomentando criatividade e progresso."
 GER_Militarism_desc: "O pluralismo cultural na Alemanha reflete a coexistência de múltiplos grupos culturais distintos, cada um mantendo sua identidade única enquanto contribui para a sociedade em geral. Esse pluralismo é visto como uma força, aumentando a diversidade e a riqueza cultural da nação."
 GER_1_right_side_range_desc: " O conceito de Volksgemeinschaft, ou \"comunidade do povo\", enfatiza uma identidade nacional unificada. Na Alemanha contemporânea, essa ideia costuma ser associada ao fomento de um senso de pertencimento e solidariedade entre os cidadãos, atenta às suas conotações históricas."
 GER_right_side_range_desc: "A noção de pureza cultural envolve preservar tradições e práticas culturais em sua forma original. Na Alemanha, isso pode ser visto nos esforços para manter costumes regionais, dialetos e herança, equilibrando as influências da globalização."
 GER_middle_right_side_range_desc: "O patrimônio nacional da Alemanha abrange sua rica história, tradições, monumentos e artefatos culturais. Preservar e promover esse patrimônio é crucial para fomentar um senso de identidade e orgulho nacionais entre os cidadãos."
 GER_far_right_side_range_desc: "A unidade étnica na Alemanha se concentra em fomentar a solidariedade e a coesão entre os diversos grupos étnicos. Isso envolve promover o entendimento e a cooperação, ao mesmo tempo em que se enfrentam os desafios relacionados à diversidade étnica e à integração."
 GER_Anti_Militarism_desc: "A conformidade cultural na Alemanha refere-se à prática de alinhar o comportamento e as crenças individuais às normas culturais dominantes. Isso pode ser visto nas expectativas e valores sociais que moldam a vida cotidiana, ao mesmo tempo em que se abre espaço para a expressão individual e a diversidade."
 GER_multicultural_curriculum_campain_in_schools: "Campanha de Currículo Multicultural nas Escolas"
 GER_multicultural_curriculum_campain_in_schools_desc: "À medida que a Alemanha continua a evoluir para uma sociedade mais multicultural, a necessidade de um currículo inclusivo nas escolas tornou-se primordial. Seguindo a influência de políticas educacionais progressistas dos anos 1990, esta campanha visa garantir que os alunos aprendam sobre as diversas origens culturais que compõem o tecido da Alemanha moderna. O chanceler Gerhard Schröder certa vez comentou: 'Nosso futuro depende de vivermos juntos, de respeito e compreensão pelas culturas uns dos outros.' Esta iniciativa é fundamental para fomentar a coesão social em uma nação em transformação."
 GER_promote_cultural_exchange_programs: "Promover Programas de Intercâmbio Cultural"
 GER_promote_cultural_exchange_programs_desc: "Em um esforço para promover o entendimento mútuo e a cooperação global, a Alemanha ampliou seus programas de intercâmbio cultural. Essas iniciativas, que remontam ao pós-guerra, visam criar parcerias duradouras com países do mundo todo. Líderes proeminentes como Willy Brandt enfatizaram que 'A paz não é tudo, mas sem paz, tudo é nada.' O intercâmbio cultural é visto como uma ferramenta de poder brando para aprimorar a diplomacia, fomentar amizades e trocar conhecimento além das fronteiras."
 GER_provide_federal_foundings_for_migration_cultural_centers: "Fornecer Financiamento Federal a Centros Culturais de Migração"
 GER_provide_federal_foundings_for_migration_cultural_centers_desc: "Reconhecendo a importância de integrar os migrantes à sociedade alemã, o financiamento federal é direcionado a centros culturais que atendem às comunidades imigrantes. Esses centros oferecem aulas de idiomas, serviços sociais e atividades culturais voltadas para a promoção da integração. Em um discurso, o ex-presidente Johannes Rau afirmou: 'Não devemos ver a migração como uma ameaça, mas como uma oportunidade.' Esses centros desempenham um papel crucial em ajudar migrantes e refugiados a criar raízes na Alemanha enquanto preservam suas identidades culturais."
 GER_support_multicultural_art_and_literature_initiative: "Apoiar a Iniciativa de Arte e Literatura Multicultural"
 GER_support_multicultural_art_and_literature_initiative_desc: "O governo alemão há muito reconhece o papel da arte e da literatura em refletir a identidade em evolução da nação. Apoiar iniciativas artísticas multiculturais não apenas fomenta a criatividade, como também destaca as contribuições das comunidades imigrantes à cultura alemã. 'Arte e cultura são a alma de nossa sociedade', disse Angela Merkel. Esta iniciativa garante que vozes diversas sejam ouvidas nos cenários literário e artístico da Alemanha."
 GER_launch_multicultural_media_campain: "Lançar Campanha de Mídia Multicultural"
 GER_launch_multicultural_media_campain_desc: "Uma campanha de mídia voltada a promover os valores de diversidade e inclusão, esta iniciativa busca desafiar estereótipos e destacar os benefícios de uma sociedade multicultural. Em linha com os esforços da Alemanha para combater a xenofobia e fomentar a harmonia social, a campanha apresenta figuras proeminentes de diversas origens culturais. O ex-chanceler Helmut Schmidt certa vez disse: 'A tolerância é um aspecto importante da democracia.' A campanha reforça o compromisso da Alemanha com uma sociedade mais inclusiva."
 GER_Wehrmachtsausstellung: "Exposição Wehrmachtsausstellung"
 GER_Wehrmachtsausstellung_desc: "A Wehrmachtsausstellung, uma exposição que destaca o papel da Wehrmacht na Segunda Guerra Mundial, provocou um debate nacional quando foi apresentada pela primeira vez nos anos 1990. A mostra desafia o mito da 'Wehrmacht limpa' e lança luz sobre a cumplicidade das forças armadas alemãs nos crimes de guerra nazistas. Como afirmou o presidente federal Richard von Weizsäcker: 'Lidar com o passado é a chave do nosso futuro.' A exposição continua sendo uma parte importante da Erinnerungskultur (cultura da memória) da Alemanha."
 GER_launch_erinnerungskultur_campain: "Lançar Campanha Erinnerungskultur"
 GER_launch_erinnerungskultur_campain_desc: "A campanha Erinnerungskultur reflete o compromisso contínuo da Alemanha de lembrar seu passado e garantir que os horrores da era nazista jamais se repitam. Por meio de programas educacionais, monumentos públicos e dias nacionais de memória, a campanha busca incutir um senso de responsabilidade nas gerações futuras. O ex-chanceler Helmut Kohl certa vez observou: 'Somente quem conhece o passado pode compreender o presente e moldar o futuro.'"
 GER_revitalize_german_historical_narratives_in_school: "Revitalizar as Narrativas Históricas Alemãs nas Escolas"
 GER_revitalize_german_historical_narratives_in_school_desc: "Em resposta a pedidos por uma abordagem mais equilibrada da história alemã, esta iniciativa revitaliza o ensino de narrativas históricas nas escolas. Ela enfatiza não apenas os capítulos mais sombrios do passado da Alemanha, mas também suas conquistas em democracia, direitos humanos e construção da paz. Como afirmou o ex-presidente Joachim Gauck: 'A história da Alemanha é ao mesmo tempo um aviso e uma inspiração para as gerações futuras.' O programa visa garantir uma compreensão matizada da história entre os estudantes."
 GER_promote_traditional_german_values_in_media: "Promover Valores Tradicionais Alemães na Mídia"
 GER_promote_traditional_german_values_in_media_desc: "Esta campanha busca promover valores tradicionais alemães como democracia, tolerância e respeito ao Estado de Direito por meio de plataformas de mídia. Em linha com os valores constitucionais do pós-guerra da Alemanha, a iniciativa visa reforçar esses princípios no discurso público. Como disse certa vez o ex-chanceler Konrad Adenauer: 'A unidade do povo é a base da força do Estado.' A campanha enfatiza a unidade por meio de valores compartilhados."
 GER_Strengthen_language_purity_campain: "Fortalecer a Campanha de Pureza do Idioma"
 GER_Strengthen_language_purity_campain_desc: "Em resposta à crescente influência de idiomas estrangeiros e gírias na comunicação cotidiana, esta campanha visa preservar a pureza da língua alemã. A campanha reflete preocupações com a identidade cultural e a herança linguística. Thomas Mann, renomado escritor alemão, certa vez enfatizou: 'Uma nação que esquece sua língua esquece a si mesma.' Esta iniciativa incentiva o uso adequado do idioma alemão, especialmente na educação e na mídia."
 GER_launch_national_identity_courses_for_migrants: "Lançar Cursos de Identidade Nacional para Migrantes"
 GER_launch_national_identity_courses_for_migrants_desc: "Voltados a fomentar a integração e ao mesmo tempo ensinar os valores da sociedade alemã, esses cursos ajudam os migrantes a compreender os direitos e as responsabilidades de viver na Alemanha. Os cursos abrangem temas como democracia, Estado de Direito e história alemã. Como afirmou o presidente Frank-Walter Steinmeier: 'Nossa identidade é definida pela forma como acolhemos os outros.' Esses cursos ajudam os recém-chegados a compreender e abraçar seu novo lar."
 GER_Launch_made_in_germany_campain: "Lançar a Campanha 'Made in Germany'"
 GER_Launch_made_in_germany_campain_desc: "A campanha 'Made in Germany' destaca a qualidade, a inovação e a confiabilidade dos produtos alemães. Conhecida mundialmente como marca de excelência, a expressão 'Made in Germany' tornou-se sinônimo de engenharia e artesanato. O ex-chanceler Ludwig Erhard, arquiteto do Wirtschaftswunder (milagre econômico), acreditava que 'o sucesso econômico da Alemanha está enraizado em sua dedicação à qualidade.' Esta campanha promove o legado industrial e a competitividade global da Alemanha."
 GER_fund_national_culture_festivals: "Financiar Festivais Culturais Nacionais"
 GER_fund_national_culture_festivals_desc: "Os festivais culturais da Alemanha, que celebram a diversa herança artística e musical da nação, recebem apoio por meio desta iniciativa. Os festivais destacam tanto a cultura tradicional quanto a contemporânea, oferecendo uma plataforma para artistas exibirem seu trabalho. Como disse Goethe: 'A cultura de uma nação reside no coração e na alma de seu povo.' Esses festivais são um testemunho da vitalidade e da criatividade da cena cultural alemã."
 Naval_bonus: "Naval Bonus"
 GER_harsh_breach_final_settlement_threat: "Harsh breach of the final settlement"
 GER_breach_final_settlement_threat: "Breach final settlement"
 GER_Contract_I_TT: "The dice is cast, lets wait and see how our neighbors react."
 GER_Neighbor_Opinion_tt: "will decide how they continue their relationship to our nation"
 GER_SAPOS_decision: "O Sistema SAPOS"
 GER_SAPOS_decision_desc: "\n£GER_desctext_sapos_network\n\n\n\nO sistema SAPOS, ou Satellitenpositionierungsdienst der deutschen Landesvermessung (Serviço de Posicionamento por Satélite do Levantamento Nacional Alemão), é uma rede sofisticada projetada para fornecer serviços de posicionamento de alta precisão em toda a Alemanha. Ele combina sistemas globais de navegação por satélite (GNSS), como GPS e GLONASS, com estações de referência terrestres para fornecer dados de posicionamento em tempo real e pós-processados com precisão centimétrica."
 GER_lease_acces_china: "Arrendar acesso ao sistema Beidou"
 GER_lease_access_russia: "Arrendar acesso ao sistema GLONASS"
 GER_lease_access_usa: "Arrendar acesso ao sistema GPS"
 GER_Visit_swearing_in_ceremony: "Visitar cerimônia de juramento"
 GER_honor_veterans: "Honrar os Veteranos"
 GER_advertisment_for_service: "Campanha Publicitária"
 GER_Innere_fuhrung_decision: "Fortalecer os Valores Éticos"
 GER_Cold_War.1.t: "Assumindo a Liderança na Integração dos Novos Membros da OTAN"
 GER_Cold_War.1.d: "Após a adesão de Polônia, Hungria e República Tcheca à OTAN, a Alemanha vê uma oportunidade única de consolidar sua influência na aliança e fortalecer o flanco oriental da OTAN. Como um dos membros mais influentes da OTAN na Europa, a Alemanha considera sua missão liderar o processo de integração desses novos membros, garantindo que se tornem plenamente operacionais e alinhados aos padrões da OTAN."
 GER_Cold_War.1.a: "A Alemanha Deve Assumir o Papel de Liderança"
 GER_Coldwar_1: "O chanceler §YGerhard Schröder§! acredita que a posição estratégica e a experiência militar da Alemanha a tornam bem adequada para liderar essa integração. Tomando a iniciativa, a Alemanha pode garantir que esses novos aliados estejam alinhados aos seus próprios interesses estratégicos e que o flanco oriental seja adequadamente fortalecido. §YGerhard Schröder§!: Esta é uma oportunidade histórica para a Alemanha moldar o futuro da expansão da OTAN. Nossa liderança garantirá estabilidade e segurança em nossas fronteiras orientais."
 GER_Cold_War.1.b: "Esta é Principalmente Responsabilidade da OTAN"
 GER_Coldwar_2: "Alguns membros do Bundestag argumentam que, embora a integração seja importante, ela deve ser conduzida pela OTAN como um todo, e não com a Alemanha assumindo uma liderança unilateral. A Alemanha deve apoiar os esforços da OTAN, mas não assumir um papel de liderança para evitar sobrecarregar seus recursos.§YRudolf Scharping, Ministro da Defesa alemão§!: Não devemos nos sobrecarregar. A OTAN é uma organização de segurança coletiva, e todos os membros devem contribuir igualmente para esse esforço."
 GER_Cold_War.2.t: "Definindo a Abordagem da Integração Militar"
 GER_Cold_War.2.d: "Com a Alemanha posicionada para desempenhar um papel significativo na integração dos novos membros da OTAN, estão em andamento discussões para determinar a melhor estratégia para incorporar Polônia, Hungria e República Tcheca à estrutura militar da aliança. Essas discussões definirão o ritmo e a natureza de sua integração militar."
 GER_Cold_War.2.a: "Enfatizar o Rearmamento e o Desdobramento Rápidos"
 GER_Coldwar_4: "§YJavier Solana§!: Quanto mais rápido integrarmos suas forças, mais forte será o flanco oriental da OTAN. Devemos agir rapidamente para armar e desdobrar."
 GER_Cold_War.2.b: "Focar no Alinhamento Doutrinário e no Treinamento"
 GER_Coldwar_5: "O General §YKlaus Reinhardt§! argumenta que a ênfase deve ser alinhar as doutrinas militares dos novos membros aos padrões da OTAN por meio de treinamento extensivo. Essa abordagem garante compatibilidade de longo prazo e eficácia operacional."
 GER_Cold_War.2.c: "Equilibrar a Integração com o Desenvolvimento de Infraestrutura"
 GER_Coldwar_6: "Uma abordagem equilibrada priorizaria tanto a integração militar quanto o desenvolvimento da infraestrutura necessária para apoiar as operações da OTAN. Isso aumentaria as capacidades logísticas e garantiria uma integração sustentável."
 GER_Cold_War.3.t: "Reformando o Corpo de Oficiais para a Integração à OTAN"
 GER_Cold_War.3.d: "Para integrar plenamente Polônia, Hungria e República Tcheca à OTAN, é essencial reformar seus corpos de oficiais e estruturas de comando. Esse passo é crucial para garantir que os novos membros possam operar com eficácia dentro da hierarquia de comando da OTAN e contribuir para operações conjuntas."
 GER_Cold_War.3.a: "Inserir Conselheiros Alemães nos Novos Estados-Membros"
 GER_Coldwar_7: "§YKlaus Reinhardt§! sugere inserir conselheiros militares alemães experientes nas estruturas de comando dos novos membros. Isso facilitaria uma abordagem prática da reforma, garantindo que suas práticas de comando sejam rapidamente alinhadas aos padrões da OTAN."
 GER_Cold_War.3.b: "Estabelecer Academias de Comando da OTAN"
 GER_Coldwar_8: "§YJavier Solana§! propõe criar academias de comando da OTAN dedicadas ao treinamento de oficiais dos novos Estados-membros. Essas academias ofereceriam treinamento padronizado, fomentando uma compreensão comum das doutrinas operacionais e estratégicas da OTAN."
 GER_Cold_War.3.c: "Integrar as Estruturas de Comando por Meio de Operações Conjuntas"
 GER_Coldwar_9: "§YHelmut Willmann§!: A experiência prática é a melhor professora. Vamos trazê-los para nossas operações e aprender juntos."
 GER_Cold_War.4.t: "Estabelecendo uma Rede Eficaz de Defesa Aérea e Antimíssil"
 GER_Cold_War.4.d: "Parte essencial da integração dos novos membros da OTAN é estabelecer um sistema robusto de defesa aérea e antimíssil. Isso não apenas protegerá essas nações, como também fortalecerá as capacidades defensivas gerais da OTAN. A Alemanha deve decidir a melhor abordagem para integrar essas defesas."
 GER_Cold_War.4.a: "Desdobrar Sistemas de Mísseis Patriot na Polônia"
 GER_Coldwar_10: "Uma iniciativa conjunta com os Estados Unidos para desdobrar sistemas de mísseis Patriot na Polônia. Isso proporcionaria uma capacidade imediata e eficaz de defesa antimíssil, aumentando a segurança do flanco oriental da OTAN."
 GER_Cold_War.4.b: "Focar no Desenvolvimento da Defesa Aérea Nacional"
 GER_Coldwar_11: "O governo húngaro sugere que cada novo Estado-membro desenvolva suas capacidades nacionais de defesa aérea com o apoio da OTAN. Essa abordagem fomenta a independência e a autossuficiência, ao mesmo tempo em que contribui para a defesa coletiva."
 GER_Cold_War.4.c: "Participar dos Exercícios de Defesa Aérea da OTAN"
 GER_Coldwar_12: "§YKlaus Naumann§! recomenda a participação em extensos exercícios de defesa aérea da OTAN. Isso permitiria que os novos Estados-membros treinassem com os sistemas de defesa aérea existentes da OTAN e melhorassem a coordenação."
 GER_Cold_War.5.t: "Decidindo sobre as Necessidades de Equipamento Blindado da Polônia"
 GER_Cold_War.5.d: "A Polônia, que ingressou na OTAN em 1999, enfrenta agora o desafio de modernizar suas forças armadas para atender aos padrões da aliança. Décadas de dependência de equipamento da era soviética deixaram suas forças armadas necessitadas de extensas melhorias em poder de fogo, logística e interoperabilidade. Como importante aliada europeia, a Alemanha tem a oportunidade de desempenhar um papel vital ao ajudar a Polônia a selecionar e adquirir armamentos, veículos e sistemas de comunicação modernos. Ao facilitar essa transição, a Alemanha pode fortalecer a cooperação militar dentro da aliança, aumentar a segurança regional e garantir que a Polônia se torne um membro plenamente capaz da OTAN."
 GER_Cold_War.5.a: "Fornecer Blindados Excedentes à Polônia"
 GER_Coldwar_13: "§YRudolf Scharping§!: Podemos ajudar a Polônia enviando tanques e veículos blindados de transporte de pessoal de nossas reservas. Transferiremos veículos estocados em cascos de 1975, preservando seus projetos e fabricantes."
 GER_Cold_War.5.b: "Fornecer Equipamento Soviético da NVA"
 GER_Coldwar_14: "Utilizar o equipamento soviético excedente da antiga NVA da Alemanha Oriental seria uma solução mais econômica, permitindo que a Polônia se modernize sem grandes gastos."
 GER_Cold_War.5.c: "Apoiar o Desenvolvimento de Veículos Blindados Nacionais"
 GER_Coldwar_15: "Incentivar a Polônia a desenvolver seus próprios veículos blindados com apoio técnico alemão fomentaria a indústria local e garantiria sustentabilidade a longo prazo."
 GER_Cold_War.6.t: "Decidindo sobre as Necessidades de Equipamento Militar da Hungria"
 GER_Cold_War.6.d: "Com sua recente adesão à OTAN, a Hungria deve passar por uma modernização militar significativa para se alinhar aos padrões da aliança. O hardware obsoleto da era soviética limita sua capacidade de se integrar efetivamente às estruturas de defesa da OTAN. Para resolver isso, a Hungria busca apoio para adquirir equipamento moderno, melhorar a prontidão operacional e aprimorar a cooperação militar conjunta. A Alemanha, com sua avançada indústria de defesa e sua experiência na OTAN, está bem posicionada para orientar a Hungria em decisões de aquisição bem fundamentadas. Apoiando esse esforço, a Alemanha pode aprofundar os laços militares, promover a estabilidade regional e garantir que a Hungria se torne uma contribuinte confiável para os esforços de defesa coletiva."
 GER_Cold_War.6.a: "Transferir Veículos Blindados Excedentes"
 GER_Coldwar_16: "Forneceremos à Hungria tanques e veículos blindados de transporte de pessoal de nossas reservas. Transferiremos veículos estocados em cascos de 1975, preservando seus projetos e fabricantes."
 GER_Cold_War.6.b: "Enviar Equipamento da Era Soviética"
 GER_Coldwar_17: "Continuar usando equipamento da era soviética poderia ser uma solução provisória econômica para a Hungria, permitindo-lhe manter uma força capaz enquanto faz a transição para os padrões da OTAN."
 GER_Cold_War.6.c: "Apoiar Investimentos no Complexo Militar-Industrial da Hungria"
 GER_Coldwar_18: "Incentivar investimentos no complexo militar-industrial da Hungria ajudaria a construir capacidade local e autossuficiência, beneficiando tanto a Hungria quanto a OTAN no longo prazo."
 GER_Cold_War.7.t: "Decidindo sobre as Necessidades de Equipamento Militar da República Tcheca"
 GER_Cold_War.7.d: "A República Tcheca, como seus colegas recém-chegados à OTAN, deve modernizar suas forças armadas para se integrar plenamente ao arcabouço estratégico da aliança. Embora suas forças armadas mantenham fortes tradições, grande parte de seu equipamento permanece obsoleta, limitando sua eficácia em operações conjuntas da OTAN. A transição para armamentos e sistemas de defesa modernos, no padrão ocidental, é uma prioridade e exige tanto conhecimento técnico quanto apoio logístico. A Alemanha pode desempenhar um papel central em guiar a República Tcheca nessa transformação, garantindo que o país esteja bem equipado para cumprir suas responsabilidades como membro da OTAN, ao mesmo tempo em que fortalece a cooperação de defesa europeia."
 GER_Cold_War.7.a: "Fornecer Tanques Excedentes"
 GER_Coldwar_19: "§YVaclav Havel§!, o presidente tcheco, busca apoio para as forças blindadas de seu país. Transferiremos tanques estocados em cascos de 1975, preservando seus projetos e fabricantes."
 GER_Cold_War.7.b: "Atualizar e Modernizar o Equipamento Existente"
 GER_Coldwar_20: "Modernizar e readequar o equipamento existente poderia ser uma solução econômica, permitindo que a República Tcheca mantenha a prontidão operacional enquanto se integra gradualmente à OTAN."
 GER_Cold_War.7.c: "Desenvolver Joint Ventures na Indústria Militar"
 GER_Coldwar_21: "§YHelmut Willmann§!: As joint ventures fortalecerão nossas economias e garantirão um fornecimento constante de equipamento de qualidade."
 GER_Cold_War.8.t: "Reconhecimento das Contribuições do General Klaus Reinhardt"
 GER_Cold_War.8.d: "O General §YKlaus Reinhardt§! desempenhou um papel crucial na integração dos novos membros da OTAN, oferecendo orientação estratégica e fomentando a estreita cooperação entre a Alemanha e esses países. O governo alemão está considerando condecorá-lo com a Bundesverdienstkreuz (Cruz Federal do Mérito) em reconhecimento a seus esforços."
 GER_Cold_War.8.a: "Condecorar o General §YKlaus Reinhardt§! com a Bundesverdienstkreuz"
 GER_Coldwar_22: "§YGerhard Schröder§!: O General Reinhardt serviu com distinção. Seus esforços na integração da OTAN merecem nosso mais alto reconhecimento."
 GER_Cold_War.8.b: "Ele Está Apenas Cumprindo Seu Dever"
 GER_Cold_War.9.t: "Venda da Santa Bárbara Sistemas Gera Tensões Internacionais"
 GER_Cold_War.9.d: "A empresa espanhola de defesa Santa Bárbara Sistemas, que detinha uma licença de produção do tanque Leopard 2, foi adquirida pela empresa americana General Dynamics. Essa aquisição causou preocupação significativa no governo alemão. O ministério da defesa alemão, chefiado pelo ministro Rudolf Scharping, desconfia da potencial transferência de tecnologia militar sensível para os Estados Unidos sem compensação ou acordos apropriados. O governo alemão teme que a sofisticada tecnologia do tanque seja repassada aos EUA, o que lhes permitiria acessar as inovações militares alemãs sem pagar pelos custos de P&D associados. A situação gerou tensões diplomáticas, pois a Alemanha busca proteger sua propriedade intelectual militar ao mesmo tempo em que mantém relações sólidas tanto com a Espanha quanto com os Estados Unidos. Resta saber como proceder em relação à licença de produção do Leopard 2 da Santa Bárbara Sistemas."
 GER_Cold_War.9.a: "Deixar que mantenham a licença"
 GER_Cold_War.9.a_desc: "Permitir que a Santa Bárbara Sistemas mantenha a licença de produção do Leopard 2 sob a propriedade da General Dynamics demonstraria confiança e solidariedade dentro da aliança da OTAN. Reconhece que EUA, Alemanha e Espanha compartilham objetivos estratégicos e que manter a produção dentro da aliança poderia fortalecer as capacidades de defesa coletiva. Essa escolha, no entanto, corre o risco de abrir um precedente para a fácil transferência de tecnologia sensível a entidades não europeias."
 GER_Cold_War.9.b: "Eles receberão tanques, mas produzidos na Alemanha."
 GER_Cold_War.9.b_desc: "Para mitigar o risco de transferência de tecnologia, a Alemanha poderia exigir que os tanques Leopard 2 destinados à Espanha continuassem a ser produzidos em instalações alemãs. Essa solução manteria o controle sobre o processo de produção e garantiria a segurança da tecnologia. Embora impedisse qualquer transferência indesejada de tecnologia aos Estados Unidos, poderia desgastar as relações com a Espanha, pois seria visto como falta de confiança."
 GER_Cold_War.9.c: "Retirar a licença, e eles não receberão tanques de nós!"
 GER_Cold_War.9.c_desc: "A abordagem mais rigorosa seria retirar completamente a licença de produção do Leopard 2 da Santa Bárbara Sistemas, interrompendo qualquer produção adicional dos tanques na Espanha. Isso garantiria que a tecnologia alemã permanecesse totalmente protegida, mas ao custo de criar um atrito diplomático significativo. Tal medida poderia desgastar as relações da Alemanha com a Espanha, alienar um importante aliado da OTAN e enviar uma mensagem forte a outros países sobre a posição alemã em relação à transferência de tecnologia."
 GER_Cold_War.20.t: "O Futuro das Forças de Reconhecimento Blindadas"
 GER_Cold_War.20.d: "À medida que a Bundeswehr avança para o século XXI, o papel das Forças de Reconhecimento Blindadas está sendo reavaliado para atender às demandas da guerra moderna. Com o ambiente geopolítico atual e a natureza em evolução dos engajamentos militares, é preciso decidir como melhor utilizar essas forças no futuro."
 GER_Cold_War.20.a: "Introduzir o Fennek e Retirar Gradualmente o Luchs"
 GER_Fennek_TT: "A Bundeswehr poderia modernizar suas capacidades de reconhecimento introduzindo o veículo Fennek, que substituiria gradualmente o envelhecido Luchs. Essa transição também introduziria a capacidade de Equipes de Apoio de Fogo Conjunto (JFST), aumentando a eficácia da unidade na coordenação de apoio de artilharia e aéreo."
 GER_Cold_War.20.b: "Substituir o Luchs por um Sucessor Moderno"
 GER_Luchs_TT: "Uma opção viável para as Forças de Reconhecimento Blindadas é substituir o Luchs por um veículo de reconhecimento mais avançado. Isso proporcionaria tecnologia de sensores aprimorada, melhor mobilidade e maior consciência do campo de batalha, mantendo o papel tradicional de furtividade e velocidade."
 GER_Cold_War.20.c: "Introduzir um Veículo de Reconhecimento Fortemente Blindado"
 GER_Cold_War.21.t: "Reduzindo as Brigadas Ativas da Bundeswehr"
 GER_Cold_War.21.d: "Com o fim da Guerra Fria e a natureza em evolução dos conflitos globais, a Bundeswehr se encontra em uma encruzilhada. As grandes estruturas estáticas do exército que eram essenciais durante a Guerra Fria já não são tão relevantes no ambiente de segurança atual. Enquanto a Alemanha busca reduzir os gastos militares e se adaptar a uma doutrina mais móvel e flexível, é preciso tomar uma decisão crucial sobre o tamanho futuro do exército. A questão agora é se devemos reduzir significativamente o número de brigadas ativas, diminuindo custos e aumentando a mobilidade, ou manter o tamanho atual da força apesar das despesas mais altas. Essa decisão terá implicações duradouras para a prontidão militar da Alemanha e seu papel no cenário mundial."
 GER_Cold_War.21.a: "Reduzir o tamanho do exército para se alinhar à doutrina moderna."
 GER_Cold_War.21.b: "Uma redução equilibrada, mantendo as capacidades essenciais."
 GER_Cold_War.22.t: "Modernizando a Luftwaffe"
 GER_Cold_War.22.d: "Com a Bundeswehr entrando no século XXI, modernizar a Luftwaffe é uma prioridade fundamental. Substituir as aeronaves da era da Guerra Fria pelo Eurofighter Typhoon eleva significativamente as capacidades aéreas da Alemanha, enquanto o sistema de mísseis Taurus aumenta o potencial de ataque de precisão. No entanto, os altos custos dessas modernizações representam um desafio, e o governo deve decidir com cuidado como proceder."
 GER_Cold_War.22.a: "Encomendar o primeiro lote de Eurofighters e introduzir o míssil Taurus."
 GER_Taurus_TT: "Ao se comprometer com o Eurofighter e o sistema de mísseis Taurus, a Alemanha equipa a Luftwaffe com tecnologia de ponta, garantindo superioridade aérea e capacidade de ataque preciso de longo alcance. Esse investimento assegura o futuro da Luftwaffe e consolida a posição da Alemanha como potência aérea líder na Europa. Apesar dos altos custos, as vantagens estratégicas são inestimáveis."
 GER_Cold_War.22.b: "Escolher apenas o Eurofighter e negar o Taurus devido aos altos custos."
 GER_Eurofighter_TT: "Optar apenas pelo Eurofighter permite à Alemanha modernizar sua frota de caças enquanto controla os custos. O Eurofighter Typhoon oferece uma aeronave multifunção versátil e poderosa, garantindo domínio aéreo. No entanto, sem o sistema de mísseis Taurus, as capacidades de ataque de precisão da Luftwaffe permanecem limitadas, refletindo uma abordagem mais cautelosa da modernização devido a restrições orçamentárias."
 GER_Cold_War.22.c: "Não podemos arcar com essas despesas adicionais."
 GER_NO_Eurofighter_TT: "Adiar ou abrir mão da modernização da Luftwaffe evita os altos custos do Eurofighter e do míssil Taurus, mas corre o risco de deixar equipamentos obsoletos, enfraquecendo as capacidades aéreas e a influência da Alemanha. Essa escolha fiscalmente conservadora pode ter consequências de longo prazo para a defesa."
 GER_Cold_War.23.t: "Modernizando a Frota de Helicópteros da Bundeswehr"
 GER_Cold_War.23.d: "A frota envelhecida de helicópteros da Bundeswehr, incluindo o UH-1D, precisava de modernização para atender às demandas militares modernas. O helicóptero de transporte CH-53 GS e o helicóptero de ataque Eurocopter Tiger eram candidatos importantes, prometendo melhor mobilidade, apoio aéreo e poder de fogo. No entanto, a pressão financeira dessas modernizações continua sendo um desafio, exigindo decisões do governo sobre como proceder."
 GER_Cold_War.23.a: "Encomendar o CH-53 GS e investir no programa Eurocopter Tiger."
 GER_Tiger_TT: "Comprometer-se tanto com o CH-53 GS quanto com o Eurocopter Tiger equipa as forças alemãs com tecnologia de ponta. O CH-53 GS aumenta a mobilidade das tropas, enquanto o Eurocopter Tiger reforça as capacidades de ataque, permitindo que a Bundeswehr se destaque em diversas operações. Embora custosos, os benefícios estratégicos de modernizar tanto os helicópteros de transporte quanto os de ataque são inegáveis."
 GER_Cold_War.23.b: "Encomendar o CH-53 GS e os helicópteros de ataque Apache fabricados nos EUA."
 GER_Apache_TT: "Esta opção equilibra modernização com uma abordagem pragmática. Ao escolher o CH-53 GS para transporte e optar pelos helicópteros Apache, testados em combate, dos Estados Unidos, a Alemanha pode garantir que suas forças estejam bem equipadas sem se comprometer totalmente com o programa mais caro do Eurocopter Tiger. O Apache, conhecido por sua confiabilidade e desempenho em combate, forneceria capacidades de ataque robustas, enquanto o CH-53 GS aumenta a mobilidade. Essa escolha reflete um compromisso estratégico, mantendo capacidades fortes ao mesmo tempo em que controla os custos."
 GER_Cold_War.23.c: "Caro demais; não podemos arcar com essas despesas adicionais."
 GER_NO_Tiger_TT: "Diante das restrições orçamentárias e de outras prioridades de defesa, a decisão de adiar ou abrir mão da introdução do CH-53 GS e de novos helicópteros de ataque reflete um foco na responsabilidade fiscal. Embora essa escolha evite o ônus financeiro imediato, ela corre o risco de deixar a Bundeswehr com capacidades de helicópteros obsoletas, comprometendo potencialmente sua eficácia em operações futuras. Essa abordagem conservadora prioriza a economia de custos, mas pode limitar a capacidade da Alemanha de responder aos desafios militares modernos."
 GER_Cold_War.24.t: "Modernização das Forças Blindadas Alemãs"
 GER_Cold_War.24.d: "No início dos anos 2000, a Bundeswehr alemã enfrentou uma decisão crucial sobre a modernização de suas forças blindadas. A era da Guerra Fria deixou a Alemanha com um formidável conjunto de tanques e veículos blindados, mas, com a natureza evolutiva da guerra e o cenário geopolítico em mudança, ficou claro que eram necessárias atualizações para manter a superioridade no campo de batalha. O programa KWS-II (Kampfwertsteigerung II) foi projetado para atualizar os tanques Leopard 2 ao padrão Leopard 2A6, aumentando significativamente seu poder de fogo, proteção e capacidades gerais. Além disso, o veículo de combate de infantaria Marder receberia atualizações críticas, melhorando sua capacidade de sobrevivência e eficácia no combate moderno. No entanto, com recursos limitados, o governo alemão deve decidir como proceder com esse ambicioso esforço de modernização."
 GER_Cold_War.24.a: "Concluir o programa KWS-II e também atualizar o Marder."
 GER_2A6_TT: "Trocaremos tanques estocados em cascos de 1975 por tanques Leopard 2A5 e Leopard 2A6, e introduziremos o projeto Marder 1A5. Tanques de qualquer projeto ou fabricante nesses cascos contam para a troca."
 GER_Cold_War.24.b: "Só podemos atualizar alguns de nossos tanques para o KWS-I."
 GER_2A5_TT: "Limitaremos o esforço de modernização à troca de tanques estocados em cascos de 1975 por tanques Leopard 2A5. Tanques de qualquer projeto ou fabricante nesses cascos contam para a troca."
 GER_Cold_War.24.c: "Isso é desperdício de dinheiro; os MBTs não têm futuro no campo de batalha."
 GER_NO_2A6_TT: "Diante da natureza mutável da guerra, com foco crescente em mobilidade, ataques de precisão e ameaças assimétricas, alguns argumentam que os tanques de batalha principais (MBTs) estão se tornando obsoletos. Esta opção defende interromper completamente o programa de modernização, redirecionando recursos para capacidades militares mais flexíveis e preparadas para o futuro. Embora essa abordagem economizasse custos significativos, ela corre o risco de deixar a Alemanha sem a blindagem pesada necessária para engajar em guerras tradicionais de alta intensidade, enfraquecendo potencialmente seu poderio militar geral."
 GER_Cold_War.25.t: "Fundação do Heerestruppenkommando"
 GER_Cold_War.25.d: "No início dos anos 2000, a Bundeswehr buscou adaptar sua estrutura organizacional para lidar melhor com as realidades das operações militares do pós-Guerra Fria. O modelo tradicional, com unidades de apoio integradas a divisões individuais, era cada vez mais visto como ineficiente para a natureza mais fluida e dinâmica da guerra moderna. O proposto Heerestruppenkommando visava centralizar capacidades de apoio fundamentais, como artilharia e unidades antiaéreas, em um único comando. Isso permitiria uma alocação mais eficaz desses recursos, garantindo que pudessem ser rapidamente desdobrados para apoiar qualquer parte do Exército conforme necessário. A decisão sobre estabelecer ou não esse comando teria implicações significativas para a capacidade da Bundeswehr de operar eficazmente em conflitos futuros."
 GER_Cold_War.25.a: "Fundar o Heerestruppenkommando como equivalente a uma divisão."
 GER_Heerestruppe_TT: "Estabelecer o Heerestruppenkommando como um comando equivalente a uma divisão centralizaria as unidades de artilharia e antiaéreas, fornecendo uma estrutura unificada capaz de apoiar todas as unidades da Bundeswehr. Essa centralização permitiria uma coordenação mais eficiente e um desdobramento rápido das capacidades de apoio, aumentando significativamente a eficácia operacional do Exército alemão. Embora essa opção exija uma reestruturação substancial, ela oferece um comando de apoio poderoso e flexível, capaz de se adaptar a uma ampla gama de cenários militares."
 GER_Cold_War.25.b: "Manter as estruturas atuais."
 GER_keep_structure_TT: "Manter as estruturas existentes evita os custos e as perturbações de uma grande reorganização. Essa opção preserva o status quo, mantendo unidades de apoio como artilharia e ativos antiaéreos incorporados às suas divisões atuais. Embora essa escolha garanta continuidade e estabilidade, ela pode deixar a Bundeswehr menos adaptável e mais lenta para responder às demandas das operações militares modernas, em que o apoio flexível e centralizado é cada vez mais importante."
 GER_Cold_War.30.t: "Aprofundando a Cooperação Militar com os Países Baixos"
 GER_Cold_War.30.d: "À medida que a Europa navegava pela era pós-Guerra Fria, Alemanha e Países Baixos buscaram ampliar sua colaboração militar. Ambas as nações reconheceram a importância de laços de defesa mais estreitos em um mundo cada vez mais interconectado. Essa cooperação já havia levado a uma integração significativa, com unidades alemãs e holandesas treinando e operando juntas regularmente, notadamente na formação do Corpo Germano-Holandês nos anos 1990. No entanto, com o surgimento de novos desafios de segurança, a Alemanha agora enfrenta uma decisão: deve aprofundar ainda mais os laços militares com os Países Baixos, criando uma força conjunta mais integrada e capaz, ou manter o nível atual de cooperação?"
 GER_Cold_War.30.a: "Fortalecer os Laços Militares com os Países Baixos"
 GER_Military_Ties_TT: "Optar por fortalecer os laços militares com os Países Baixos implicaria uma integração mais profunda das forças alemãs e holandesas, podendo levar a estruturas de comando compartilhadas, projetos conjuntos de aquisição e mais exercícios de treinamento combinados. Essa opção poderia aumentar a eficácia militar e a prontidão de ambas as nações, especialmente em operações de manutenção da paz e de resposta rápida. Também sinalizaria o compromisso da Alemanha com a cooperação europeia de defesa e poderia servir de modelo para futuras colaborações com outros aliados da OTAN. No entanto, uma integração mais profunda também pode exigir concessões na soberania nacional sobre decisões militares e investimentos adicionais para alinhar equipamentos e padrões operacionais."
 GER_Cold_War.30.b: "Manter o Status Quo"
 GER_Status_Quo_TT: "Manter o nível atual de cooperação militar com os Países Baixos garante que as colaborações existentes continuem sem necessidade de maior integração. Essa opção preserva o controle total da Alemanha sobre suas forças militares, ao mesmo tempo em que mantém os benefícios do treinamento conjunto e da experiência operacional. Permite que a Alemanha se concentre em suas próprias prioridades militares e esforços de modernização, sem se comprometer com as complexidades e os possíveis desafios políticos de uma integração mais profunda. No entanto, essa escolha pode limitar o potencial de maior eficácia e prontidão que laços mais estreitos com os Países Baixos poderiam trazer."
 GER_Cold_War.31.t: "Sincronizar o Treinamento de Oficiais com os Países Baixos"
 GER_Cold_War.31.d: "Após as discussões sobre o aprofundamento da cooperação militar com os Países Baixos, o próximo passo em consideração é a sincronização dos programas de treinamento de oficiais entre as duas nações. Alemanha e Países Baixos reconhecem o valor de ter oficiais que não apenas conheçam suas próprias doutrinas nacionais, mas também compreendam profundamente as estruturas e os procedimentos operacionais de seus aliados mais próximos. Ao alinhar os programas de treinamento, ambos os países pretendem criar uma estrutura de liderança mais coesa e interoperável, capaz de atuar em conjunto sem atritos em missões conjuntas. No entanto, tal medida exigiria ajustes significativos nos currículos de treinamento existentes e poderia enfrentar resistência dos que preferem manter padrões de treinamento nacionais distintos."
 GER_Cold_War.31.a: "Prosseguir com a Sincronização"
 GER_Officer_training_TT: "Avançar com a sincronização dos programas de treinamento de oficiais envolveria alinhar currículos, metodologias de treinamento e, possivelmente, até academias conjuntas entre Alemanha e Países Baixos. Isso formaria uma nova geração de oficiais igualmente aptos a comandar forças alemãs e holandesas em operações combinadas, aumentando a interoperabilidade e a eficácia geral dos dois exércitos. Embora essa medida fortaleça a relação militar germano-holandesa e melhore a coesão operacional, também pode exigir uma extensa reestruturação dos programas de treinamento e recursos adicionais para gerir a transição."
 GER_Cold_War.31.b: "Adiar o Plano"
 GER_Postpone_TT: "Optar por adiar a sincronização dos programas de treinamento de oficiais permitiria que a Alemanha mantivesse seus padrões atuais de treinamento e se concentrasse em prioridades nacionais. Essa escolha evita as possíveis perturbações e complexidades associadas ao alinhamento de programas de treinamento entre dois sistemas militares diferentes. Embora preserve o status quo e dê maior flexibilidade para adaptar o treinamento às necessidades específicas da Alemanha, pode também resultar em oportunidades perdidas de integração mais profunda e de melhor capacidade operacional conjunta com os Países Baixos."
 GER_Cold_War.32.t: "Padronizar o Equipamento com os Países Baixos"
 GER_Cold_War.32.d: "À medida que Alemanha e Países Baixos continuam explorando caminhos para aprofundar sua cooperação militar, a questão da padronização de equipamentos veio à tona. Ter um conjunto unificado de equipamentos entre as duas forças aumentaria significativamente a interoperabilidade, reduziria os desafios logísticos e agilizaria as operações conjuntas. No entanto, a padronização total pode ser um empreendimento caro e complexo, exigindo que ambas as nações alinhem suas estratégias de aquisição, modifiquem seus estoques existentes e, possivelmente, abram mão de certas preferências nacionais por sistemas específicos. A Alemanha precisa agora decidir até onde está disposta a ir no alinhamento de seu equipamento militar com o dos Países Baixos."
 GER_Cold_War.32.a: "Buscar a Padronização Total"
 GER_Standardization_TT: "Optar pela padronização total significaria que Alemanha e Países Baixos harmonizariam a maior parte de seu equipamento militar, de armas leves a veículos e sistemas de comunicação. Essa abordagem aumentaria enormemente a interoperabilidade entre as duas forças, tornando as operações conjuntas mais eficientes e reduzindo as complexidades de manutenção e logística. No entanto, a padronização total exigiria investimentos significativos para substituir ou modificar equipamentos existentes e poderia obrigar a concessões em sistemas preferidos. Embora essa opção prometa os maiores benefícios operacionais a longo prazo, também traz custos iniciais substanciais e possíveis desafios políticos."
 GER_Cold_War.32.b: "Padronização Parcial"
 GER_Standardization_I_TT: "Escolher a padronização parcial permite uma abordagem mais seletiva, focada em padronizar as categorias de equipamento mais críticas para as operações conjuntas, como sistemas de comunicação, munição e certos veículos. Essa abordagem equilibra a necessidade de maior interoperabilidade com a praticidade de manter algum grau de autonomia nacional na escolha de equipamentos. Reduz o custo e a complexidade em comparação com a padronização total, ainda alcançando ganhos significativos na capacidade operacional conjunta. No entanto, essa opção pode deixar certas áreas de equipamento incompatíveis, o que ainda poderia representar desafios em alguns cenários."
 GER_Cold_War.32.c: "Manter Sistemas Separados"
 GER_Standardization_II_TT: "Manter sistemas de equipamento separados permite que a Alemanha continue usando e desenvolvendo seu próprio material militar preferido, sem a necessidade de se alinhar aos sistemas holandeses. Essa escolha preserva o controle nacional total sobre as decisões de aquisição e permite uma abordagem sob medida para as necessidades militares específicas da Alemanha. No entanto, essa opção pode limitar a eficácia das operações conjuntas com os Países Baixos e manter os desafios logísticos e operacionais de operar conjuntos de equipamentos diferentes. Embora evite os custos e as complexidades da padronização, também pode restringir a profundidade da futura cooperação militar."
 GER_Cold_War.33.t: "Exército Complementar"
 GER_Cold_War.33.d: "À medida que Alemanha e Países Baixos aprofundam sua cooperação militar, a próxima decisão crítica envolve a composição das brigadas do Exército Holandês para complementar da melhor forma a Bundeswehr alemã. Ao alinhar estrategicamente suas forças, Alemanha e Países Baixos podem criar uma força militar conjunta mais coesa e eficaz, capaz de responder a uma ampla gama de cenários operacionais. A decisão sobre se os Países Baixos devem manter uma brigada leve, média ou de tanques influenciará significativamente a interoperabilidade e a força geral de suas forças combinadas. A Alemanha precisa considerar com cuidado qual opção melhor reforçará essa parceria e proporcionará a maior vantagem estratégica."
 GER_Cold_War.33.a: "Apoiar a Formação de uma Brigada Leve"
 GER_Complimentary_TT: "Uma brigada leve no Exército Holandês ofereceria mobilidade e flexibilidade rápidas, ideais para mobilizações ágeis e operações em terrenos difíceis, onde blindados pesados seriam menos eficazes. Essa opção aumentaria significativamente a capacidade das forças germano-holandesas de responder rapidamente a crises emergentes, especialmente em missões de manutenção da paz ou em ambientes onde velocidade e manobrabilidade são críticas. No entanto, embora uma brigada leve ofereça alta mobilidade, pode carecer do poder de fogo e da proteção necessários em conflitos de alta intensidade, limitando potencialmente sua eficácia em certos cenários."
 GER_Cold_War.33.b: "Apoiar a Formação de uma Brigada Média"
 GER_Complimentary_I_TT: "Uma brigada média ofereceria uma mistura equilibrada de mobilidade, poder de fogo e proteção, tornando-se uma força versátil e adaptável, capaz de cumprir uma ampla gama de missões. Essa opção permitiria ao Exército Holandês operar com eficácia ao lado das forças alemãs tanto em situações de combate de alta intensidade quanto em operações de manutenção da paz de menor intensidade. A brigada média poderia servir como um complemento flexível às unidades blindadas alemãs mais pesadas, oferecendo apoio onde velocidade e adaptabilidade são necessárias sem sacrificar demais o poder de fogo ou a proteção. No entanto, essa opção pode exigir investimentos significativos em novos equipamentos e treinamento."
 GER_Cold_War.33.c: "Apoiar a Formação de uma Brigada de Tanques"
 GER_Complimentary_II_TT: "Uma brigada de tanques no Exército Holandês reforçaria significativamente a capacidade blindada pesada da parceria germano-holandesa. Essa opção criaria uma força formidável, particularmente eficaz em cenários de combate de alta intensidade, onde poder de fogo pesado e blindagem são fundamentais. A brigada de tanques serviria como um poderoso complemento às divisões blindadas existentes da Alemanha, oferecendo forte dissuasão e capacidade de combate em operações conjuntas. No entanto, embora essa opção aumente o poder de fogo e a proteção combinados, pode limitar a flexibilidade operacional e exigir recursos substanciais para sua manutenção e operação."
 GER_Cold_War.34.t: "Sincronizar a Defesa Aérea com os Países Baixos"
 GER_Cold_War.34.d: "À medida que a cooperação militar entre Alemanha e Países Baixos continua a se aprofundar, as atenções se voltam para a sincronização de seus sistemas de defesa aérea. Dada a crescente importância da defesa aérea integrada dentro da OTAN, uma abordagem coordenada entre os dois países vizinhos poderia proporcionar vantagens estratégicas significativas. A Alemanha enfrenta agora uma decisão crucial: instalar sistemas fixos de defesa aérea Patriot e de radar nos Países Baixos, empregar unidades Patriot móveis que possam ser realocadas conforme necessário, ou manter sistemas de defesa aérea soberanos separados. Essa decisão terá implicações duradouras para a segurança de ambas as nações e para a eficácia de sua postura de defesa conjunta."
 GER_Cold_War.34.a: "Instalar Sistemas de Defesa Aérea Patriot e de Radar nos Países Baixos"
 GER_Air_defence_TT: "Ao instalar baterias fixas de defesa aérea Patriot e sistemas de radar nos Países Baixos, a Alemanha criaria uma rede de defesa aérea robusta e permanente, que aumentaria significativamente a proteção de ambas as nações contra ameaças aéreas. Essa opção permitiria uma postura de defesa altamente coordenada e integrada, com dados e cobertura de radar compartilhados, proporcionando um escudo contínuo sobre a região. Também demonstraria um forte compromisso com a parceria militar germano-holandesa e fortaleceria a estrutura geral de defesa da OTAN. No entanto, essa opção pode limitar a flexibilidade e exigir um comprometimento significativo de recursos para manter e operar as instalações fixas."
 GER_Cold_War.34.b: "Empregar Unidades Móveis de Defesa Aérea Patriot"
 GER_Air_defence_I_TT: "Empregar unidades móveis de defesa aérea Patriot oferece uma solução flexível e adaptável, permitindo que Alemanha e Países Baixos respondam de forma dinâmica a ambientes de ameaça em mudança. Essas unidades móveis podem ser rapidamente realocadas para cobrir diferentes áreas conforme necessário, oferecendo uma capacidade de defesa versátil que pode apoiar tanto operações nacionais quanto da OTAN. Essa opção aumenta a flexibilidade operacional e garante que os meios de defesa aérea possam ser empregados onde forem mais necessários, mas também pode resultar em uma cobertura menos consistente em comparação com instalações fixas. Além disso, a logística e a coordenação exigidas para mobilizações móveis podem representar desafios."
 GER_Cold_War.34.c: "Manter Sistemas Soberanos de Defesa Aérea"
 GER_Air_defence_II_TT: "Manter sistemas de defesa aérea soberanos separados permite que Alemanha e Países Baixos conservem o controle total sobre seus meios nacionais de defesa aérea. Essa opção preserva a autonomia de cada nação na gestão de seu próprio espaço aéreo e de suas prioridades de defesa, sem a necessidade de coordenação extensa ou infraestrutura compartilhada. Embora essa escolha garanta que ambos os países possam tratar de forma independente suas preocupações específicas de segurança, ela também pode resultar em capacidades de defesa conjunta menos eficazes e limitar o potencial de uma integração mais profunda na rede de defesa aérea da OTAN. Além disso, manter sistemas separados poderia levar a redundâncias e ineficiências na alocação de recursos."
 GER_Cold_War.35.t: "Escolher o Nível de Integração com os Países Baixos"
 GER_Cold_War.35.d: "O aprofundamento da cooperação militar entre Alemanha e Países Baixos chegou a um momento crítico. O sucesso das iniciativas conjuntas anteriores, da defesa aérea sincronizada às estruturas de brigadas complementares, abriu caminho para discussões sobre o futuro do Corpo Germano-Holandês. O Corpo, símbolo de estreita colaboração militar, poderia ser totalmente integrado à estrutura da Bundeswehr, permanecer uma força conjunta com controle nacional em tempos de paz e integração em tempos de guerra, ou manter plena soberania nacional para ambos os países. Essa decisão terá profundas implicações para o futuro das relações militares germano-holandesas e para sua capacidade de defesa coletiva dentro da OTAN."
 GER_Cold_War.35.a: "Integrar Totalmente o Corpo Germano-Holandês à Bundeswehr"
 GER_Integration_NL_TT: "Ao integrar totalmente o Corpo Germano-Holandês à estrutura da Bundeswehr, Alemanha e Países Baixos criariam uma força militar unificada e coesa, capaz de operar como uma única entidade sob comando alemão. Essa opção maximizaria a eficácia operacional do Corpo, permitindo comando e controle simplificados, maior interoperabilidade e uma estratégia de defesa coesa. Também fortaleceria o vínculo entre as duas nações, tornando sua parceria militar um pilar da postura de defesa da OTAN na Europa. No entanto, esse nível de integração pode exigir ajustes políticos e operacionais significativos e levantar preocupações sobre soberania e autonomia nacionais."
 GER_Cold_War.35.b: "Controle Nacional em Tempo de Paz, Integração à Bundeswehr em Tempo de Guerra"
 GER_Integration_NL_I_TT: "Essa opção preserva o controle nacional do Corpo Germano-Holandês em tempos de paz, permitindo que ambos os países administrem o Corpo de forma independente, mantendo suas próprias tradições e estruturas militares. Em caso de guerra, o Corpo seria totalmente integrado à Bundeswehr, operando sob comando alemão como uma unidade coesa. Essa abordagem oferece uma solução equilibrada, combinando os benefícios das operações conjuntas com o respeito à soberania nacional. Aumenta a flexibilidade operacional e garante que o Corpo possa ser mobilizado de forma rápida e eficaz em tempos de crise, mantendo certo grau de independência em tempos de paz."
 GER_Cold_War.35.c: "Manter a Soberania Nacional Plena"
 GER_Integration_NL_II_TT: "Optar por manter a soberania nacional plena sobre o Corpo Germano-Holandês significa que Alemanha e Países Baixos continuariam a administrar suas respectivas forças de forma independente, sem integração total à estrutura da Bundeswehr. Essa opção preserva a autonomia de cada nação, permitindo-lhes manter o controle total sobre suas forças militares e processos decisórios. Embora essa escolha respeite a soberania nacional, pode limitar a eficácia operacional do Corpo em operações conjuntas e reduzir o potencial de uma integração militar mais profunda. Também poderia gerar desafios de coordenação e interoperabilidade durante missões multinacionais dentro da OTAN."
 GER_Cold_War.40.t: "Leopard Trophy"
 GER_Cold_War.40.d: "O Leopard Trophy é uma prestigiosa competição militar realizada anualmente na Alemanha, voltada aos principais usuários do tanque de batalha principal (MBT) Leopard e a exércitos aliados amigos, em particular membros da OTAN. O evento visa fortalecer a cooperação militar internacional, aumentar a interoperabilidade entre as forças participantes e fomentar a excelência na guerra blindada por meio de competição de alto nível. Durante o Leopard Trophy, as guarnições de tanques enfrentam uma série de desafios rigorosos, incluindo tiro de precisão, manobras táticas, transposição de obstáculos e exercícios operacionais em equipe. Esses testes não apenas avaliam o desempenho dos MBTs Leopard, mas também destacam a habilidade, a disciplina e o trabalho em equipe de suas guarnições. A competição serve como plataforma crucial para trocar boas práticas, refinar táticas operacionais conjuntas e melhorar a coordenação militar entre fronteiras. Ao promover a rivalidade amistosa, o Leopard Trophy ajuda a manter altos padrões de treinamento, garantindo que as nações participantes estejam bem preparadas para colaborar em esforços de defesa conjunta e futuras missões."
 GER_Cold_War.40.a: "Lasst die Katzen Los!"
 GER_Cold_War.40.b: "Não podemos pagar"
 GER_Cold_War.41.t: "Competição de Habilidades Militares da OTAN: Exibindo a Excelência Tática"
 GER_Cold_War.41.d: "A Competição de Habilidades Militares da OTAN é um evento de elite realizado anualmente, reunindo militares das nações membros da OTAN e de forças aliadas para demonstrar sua proeza tática, resistência física e trabalho em equipe. A competição desafia os participantes em diversas disciplinas militares, incluindo pontaria, pistas de obstáculos, navegação, primeiros socorros e simulações de combate. Concebida para promover o companheirismo e a cooperação entre as forças da OTAN, a competição fomenta um ambiente de rivalidade amistosa e, ao mesmo tempo, aumenta a prontidão operacional e a interoperabilidade dos exércitos participantes. Ao levar os soldados ao limite e promover padrões militares compartilhados, a Competição de Habilidades Militares da OTAN desempenha um papel fundamental na manutenção dos altos padrões de treinamento necessários para missões conjuntas e defesa coletiva."
 GER_Cold_War.41.a: "Pegites pugnas decernent"
 GER_Cold_War.41.b: "Não podemos pagar"
 GER_Cold_War.42.t: "Boeselager Wettkampf: Competição de Cavalaria da OTAN"
 GER_Cold_War.42.d: "O Boeselager Wettkampf é uma competição anual de cavalaria da OTAN, batizada em homenagem ao oficial de cavalaria alemão Barão Friedrich von Boeselager. Esse prestigioso evento, realizado na Alemanha, reúne unidades de reconhecimento e de cavalaria de vários Estados membros da OTAN para testar suas habilidades táticas, resistência e trabalho em equipe. Os participantes enfrentam uma ampla gama de desafios, incluindo reconhecimento montado, pontaria, navegação e pistas de obstáculos. A competição foi concebida para fortalecer a cooperação militar internacional, aumentar a interoperabilidade e manter altos padrões de treinamento de cavalaria. Por meio da rivalidade amistosa e de testes rigorosos, o Boeselager Wettkampf promove a excelência nas operações modernas de cavalaria, preservando as tradições e a herança das tropas montadas dentro da OTAN."
 GER_Cold_War.42.a: "videre sine videri"
 GER_Cold_War.42.b: "Não podemos pagar"
 GER_Cold_War.43.t: "Escolha Sua Competição Militar"
 GER_Cold_War.43.d: "O Boeselager Wettkampf é uma competição anual de cavalaria da OTAN, batizada em homenagem ao oficial de cavalaria alemão Barão Friedrich von Boeselager. Esse prestigioso evento, realizado na Alemanha, reúne unidades de reconhecimento e de cavalaria de vários Estados membros da OTAN para testar suas habilidades táticas, resistência e trabalho em equipe. Os participantes enfrentam uma ampla gama de desafios, incluindo reconhecimento montado, pontaria, navegação e pistas de obstáculos. A competição foi concebida para fortalecer a cooperação militar internacional, aumentar a interoperabilidade e manter altos padrões de treinamento de cavalaria. Por meio da rivalidade amistosa e de testes rigorosos, o Boeselager Wettkampf promove a excelência nas operações modernas de cavalaria, preservando as tradições e a herança das tropas montadas dentro da OTAN."
 GER_Cold_War.43.a: "Leopard Trophy: Competição Internacional para Usuários do MBT Leopard e Exércitos Aliados"
 GER_Cold_War.43.a_desc: "Voltada à guerra de tanques, esta competição reúne os principais usuários dos tanques de batalha principais Leopard e nações aliadas. As guarnições enfrentam desafios de precisão, mobilidade e manobras táticas, com ênfase em aumentar a interoperabilidade e as táticas operacionais conjuntas. Uma excelente escolha para fomentar a excelência na guerra blindada e a cooperação internacional."
 GER_Cold_War.43.b: "Competição de Habilidades Militares da OTAN"
 GER_Cold_War.43.b_desc: "Este evento abrangente foi concebido para desafiar soldados da OTAN e de forças aliadas em uma ampla gama de disciplinas militares. Da resistência física a cenários de combate tático, a competição enfatiza o trabalho em equipe, a precisão e a prontidão dos soldados em diferentes áreas de especialização. Ideal para promover a união e padrões militares compartilhados."
 GER_Cold_War.43.c: "Boeselager Wettkampf: Competição de Cavalaria da OTAN"
 GER_Cold_War.43.c_desc: "Um evento renomado que reúne unidades de reconhecimento e de cavalaria de nações membros da OTAN. Esta competição testa tropas montadas em pontaria, navegação e operações táticas. Perfeita para exibir as tradições da cavalaria, ao mesmo tempo em que aprimora as habilidades do campo de batalha moderno e fomenta a cooperação militar multinacional."
 GER_RCH_155: "Obuseiro Sobre Rodas RCH 155"
 GER_RCH_155_desc: "O RCH 155 é um obuseiro sobre rodas altamente móvel, desenvolvido pela Alemanha, que oferece apoio de fogo rápido com seu sistema de artilharia de 155 mm. Montado no chassi Boxer 8x8, combina o poder de fogo de um obuseiro tradicional com mobilidade excepcional, permitindo que se reposicione rapidamente após atirar. Esse sistema autopropulsado é conhecido por sua precisão, alcance e versatilidade no campo de batalha moderno."
 GER_GTK_Boxer_CRV: "Veículo de Reconhecimento de Combate Boxer (CRV)"
 GER_GTK_Boxer_CRV_desc: "O Boxer CRV é um veículo de reconhecimento de combate versátil e fortemente blindado, desenvolvido pela Alemanha. Baseado na plataforma modular GTK Boxer, oferece às unidades de reconhecimento capacidades avançadas de vigilância, proteção e mobilidade. Equipado com uma variedade de sensores, equipamentos de comunicação e armas, garante consciência situacional ao mesmo tempo em que mantém a guarnição segura em ambientes hostis."
 GER_Leopard_2A8: "Tanque de Batalha Principal Leopard 2A8"
 GER_Leopard_2A8_desc: "O Leopard 2A8 é a iteração mais recente da família de tanques de batalha principais Leopard da Alemanha, com blindagem aprimorada, sensores avançados e sistemas de controle de tiro atualizados. Construído para dominar o campo de batalha, oferece poder de fogo incomparável com seu canhão de alma lisa de 120 mm e proteção excepcional contra as ameaças modernas. O 2A8 foi projetado para liderar forças mecanizadas com sobrevivência, mobilidade e letalidade superiores."
 GER_Leopard_2A7A1: "Tanque de Batalha Principal Leopard 2A7A1"
 GER_Leopard_2A7A1_desc: "O Leopard 2A7A1 é uma versão atualizada da série Leopard 2, projetada para melhorar a proteção, a mobilidade e o poder de fogo. Com sistemas avançados de proteção passiva e ativa, é otimizado para a guerra urbana e híbrida. Sua eletrônica sofisticada e seu canhão de 120 mm aprimorado permitem enfrentar uma ampla gama de ameaças, mantendo o domínio do campo de batalha."
 GER_Leopard_2A7: "Tanque de Batalha Principal Leopard 2A7"
 GER_Leopard_2A7_desc: "O Leopard 2A7 é uma versão modernizada da série Leopard 2, oferecendo proteção, poder de fogo e mobilidade aprimorados. Equipado com blindagem avançada e sistemas de última geração, o 2A7 é projetado tanto para a guerra convencional quanto para a assimétrica. Seu canhão de alma lisa de 120 mm fornece poderoso apoio de fogo, enquanto sua mobilidade garante um rápido emprego no campo de batalha."
 GER_Leopard_2A6_LAHAT: "Leopard 2A6 com Mísseis Antitanque LAHAT"
 GER_Leopard_2A6_LAHAT_desc: "O Leopard 2A6 com integração do míssil LAHAT (Laser Homing Attack) traz capacidades antitanque avançadas à já formidável plataforma Leopard 2. O sistema de mísseis LAHAT amplia a capacidade do tanque de engajar alvos blindados a longas distâncias, fornecendo poder de fogo guiado com precisão além do alcance dos canhões de tanque tradicionais. O 2A6 oferece uma mistura equilibrada de poder de fogo, mobilidade e proteção, tornando-se um ativo fundamental na guerra blindada moderna."
 GER_Lynx: "Veículo de Combate de Infantaria (IFV) Lynx"
 GER_Lynx_desc: "O Lynx IFV é um veículo de combate de infantaria de nova geração desenvolvido pela Alemanha, projetado para máxima flexibilidade no campo de batalha. Combina blindagem avançada, design modular e tecnologia de ponta para proteger e apoiar unidades de infantaria. Capaz de transportar um pelotão completo de soldados, o Lynx é armado com diversas armas, incluindo um canhão automático de 30 mm ou 35 mm, tornando-o uma plataforma formidável para operações ofensivas e defensivas."
 GER_Boeselager_wettkampf_history_entry: "Boeselager Wettkampf"
 GER_Leopard_trophy_history_entry: "Leopard Trophy"
 GER_NATO_MSC_history_entry: "Competição de Habilidades Militares da OTAN"
 GER_launch_military_competition: "Lançar Competição Militar"
 GER_neuer_markt_II: "Lições da Bolha Pontocom"
 GER_neuer_markt_II_desc: "A rápida ascensão e queda do setor de tecnologia durante a Bolha Pontocom deixou marcas profundas na economia global. Embora muitas empresas tenham perecido no colapso, a experiência deixou lições valiosas sobre os riscos do investimento especulativo, o excesso de confiança em tecnologias não testadas e a importância de estratégias de crescimento sustentável. As nações que observaram as consequências agora desconfiam de booms de mercado desregulados, dando maior ênfase à inovação cautelosa, à supervisão financeira e ao fomento de um setor tecnológico mais resiliente."
 GER_banking_center: "Frankfurt, Centro Financeiro Global"
 GER_banking_center_desc: "O setor bancário de Frankfurt é um importante centro financeiro global, abrigando o Banco Central Europeu, a Bolsa de Valores de Frankfurt e inúmeros bancos internacionais. Atua como peça fundamental nas finanças globais e na política monetária europeia."
 GER_downfall_of_heavy_industrie: "Declínio da Indústria Pesada"
 GER_downfall_of_heavy_industrie_desc: "O antigo coração da economia alemã, a indústria pesada do Ruhrgebiet, entrou em colapso devido à concorrência internacional nos setores de carvão e aço."
 GER_new_economic_hubs: "Titãs em Ascensão"
 GER_new_economic_hubs_desc: "Enquanto o tradicional centro industrial da Renânia do Norte-Vestfália (NRW) sofre estagnação, os estados do sul, Baviera e Baden-Württemberg, surgiram como as novas potências econômicas da Alemanha. Sede de indústrias florescentes nos setores automotivo, de engenharia e de manufatura avançada, essas regiões atraíram talentos e investimentos de primeira linha, superando a NRW em produção econômica e inovação. Com foco em indústrias de alta tecnologia, energia sustentável e crescimento impulsionado pelas exportações, o sul é agora o motor da economia alemã, remodelando o panorama industrial do país."
 GER_Reform_and_Strenghen_of_german_foreign_intitutes: "Reformar os Institutos Alemães no Exterior"
 GER_Reform_and_Strenghen_of_german_foreign_intitutes_desc: "A Alemanha reconhece a crescente importância de suas instituições culturais e acadêmicas no cenário global. Ao reformar as estruturas do Goethe-Institut, do DAAD e de outros órgãos internacionais, pretendemos ampliar o alcance da língua e da cultura alemãs, fomentar parcerias científicas e acadêmicas e apoiar o desenvolvimento de longo prazo do soft power alemão. Essas reformas garantirão que esses institutos estejam equipados para lidar com desafios globais e ampliar a influência internacional da Alemanha em um mundo dinâmico."
 GER_KFW_Restructure: "Reestruturação do KfW"
 GER_KFW_Restructure_desc: "O Kreditanstalt für Wiederaufbau (KfW) é um ator fundamental no financiamento do desenvolvimento global. Por meio da reestruturação, a Alemanha ampliará suas capacidades financeiras para financiar infraestrutura em grande escala, energia verde e projetos de desenvolvimento em mercados emergentes. Ao modernizar o KfW, a Alemanha poderá atender melhor às necessidades de uma economia global em rápida mudança, com foco em crescimento sustentável, transições energéticas e modelos inovadores de desenvolvimento em países parceiros-chave."
 GER_global_infrastructure_projects: "Projetos Globais de Infraestrutura"
 GER_global_infrastructure_projects_desc: "Para aumentar sua influência econômica global e facilitar o comércio, a Alemanha se comprometerá a financiar e apoiar projetos críticos de infraestrutura ao redor do mundo. Esses projetos incluirão redes de transporte, infraestrutura digital e redes de energia. Por meio de investimentos estratégicos, a Alemanha busca criar parcerias de longo prazo com mercados emergentes, promovendo o desenvolvimento econômico e garantindo cadeias de suprimentos seguras para indústrias-chave."
 GER_Green_finance_initiative: "Iniciativa de Finanças Verdes"
 GER_Green_finance_initiative_desc: "A Alemanha assumirá a liderança na promoção das finanças verdes em todo o mundo. Ao canalizar recursos para projetos de energia renovável, tecnologia limpa e práticas agrícolas sustentáveis, a Alemanha contribuirá para os esforços globais contra a mudança climática. A Iniciativa de Finanças Verdes visa não apenas reduzir as emissões de carbono, mas também posicionar a Alemanha como líder global em finanças sustentáveis, dando acesso a tecnologias favoráveis ao clima para as nações em desenvolvimento."
 GER_Strategic_Partnership_India: "Parceria Estratégica com a Índia"
 GER_Strategic_Partnership_India_desc: "Reconhecendo a crescente importância da Índia como potência regional e global, a Alemanha aprofundará sua parceria estratégica com o país. Essa parceria abrangerá áreas de interesse mútuo, incluindo comércio, tecnologia, cooperação climática e segurança. Por meio de maior colaboração, a Alemanha assegurará laços econômicos e geopolíticos de longo prazo com uma das economias que mais crescem, promovendo a estabilidade e os valores compartilhados na região."
 GER_Expand_Export_Promotion_Programs: "Expandir os Programas de Promoção de Exportações"
 GER_Expand_Export_Promotion_Programs_desc: "Para manter seu status como um dos maiores exportadores do mundo, a Alemanha expandirá significativamente seus programas de promoção de exportações. Esses programas darão às empresas alemãs maior acesso a mercados emergentes, oferecerão apoio financeiro e logístico e aumentarão a competitividade global dos produtos alemães. Com isso, a Alemanha garantirá que sua economia baseada em exportações continue prosperando em um mundo cada vez mais interconectado."
 GER_Securing_acces_to_Key_Ressources: "Garantir o Acesso a Recursos Essenciais"
 GER_Securing_acces_to_Key_Ressources_desc: "Em uma era de escassez de recursos, a Alemanha priorizará garantir o acesso a recursos naturais essenciais para sua economia. Esse foco incluirá a construção de parcerias estratégicas com nações ricas em recursos, assegurando acordos de longo prazo para materiais críticos como terras raras, fontes de energia e metais industriais. Ao diversificar as cadeias de suprimento de recursos, a Alemanha reduzirá a dependência de regiões instáveis e garantirá sua superioridade industrial e tecnológica."
 GER_Development_Projects: "Projetos de Desenvolvimento"
 GER_Development_Projects_desc: "A Alemanha aumentará seu compromisso com o desenvolvimento global por meio de investimento direto em projetos voltados à saúde, educação, infraestrutura e sustentabilidade. Esses projetos de desenvolvimento serão um pilar da política externa alemã, ampliando sua posição global e enfrentando questões críticas como pobreza, desigualdade e degradação ambiental em regiões vulneráveis."
 GER_DAAD_Expand_Academic_exchange_service: "DAAD: Expandir o Serviço de Intercâmbio Acadêmico"
 GER_DAAD_Expand_Academic_exchange_service_desc: "O Serviço Alemão de Intercâmbio Acadêmico (DAAD) será ampliado para facilitar maior colaboração e intercâmbio acadêmico com universidades e instituições de todo o mundo. Ao oferecer mais bolsas de estudo, auxílios à pesquisa e oportunidades de intercâmbio, a Alemanha promoverá a educação, a ciência e a pesquisa como instrumentos para fomentar o entendimento internacional e fortalecer parcerias globais."
 GER_Strategic_Partnership_Israel: "Parceria Estratégica com Israel"
 GER_Strategic_Partnership_Israel_desc: "A Alemanha aprofundará sua relação estratégica com Israel, concentrando-se em áreas de interesse mútuo como segurança, cooperação tecnológica e colaboração econômica. Dada a história compartilhada e a contínua importância geopolítica de Israel no Oriente Médio, essa parceria fortalecerá a influência da Alemanha na região, ao mesmo tempo em que apoiará a estabilidade e o desenvolvimento de Israel."
 GER_International_education_projects: "Projetos Internacionais de Educação"
 GER_International_education_projects_desc: "A Alemanha colaborará com parceiros internacionais para estabelecer projetos educacionais voltados a melhorar o acesso a ensino de qualidade e a habilidades técnicas em todo o mundo. Ao se concentrar em países com infraestrutura educacional pouco desenvolvida, a Alemanha espera proporcionar benefícios de longo prazo que sustentem o crescimento econômico e a estabilidade social em regiões-chave. Esses projetos também criarão laços culturais mais fortes entre a Alemanha e o mundo, contribuindo para o entendimento mútuo."
 GER_Education_for_stability: "Educação para a Estabilidade"
 GER_Education_for_stability_desc: "Reconhecendo a educação como pedra angular da paz e da estabilidade, a Alemanha investirá em programas educacionais em regiões propensas a conflitos ou pós-conflito. Ao melhorar as oportunidades educacionais, especialmente em áreas rurais e pouco desenvolvidas, a Alemanha pretende fomentar o crescimento de sociedades estáveis, onde os valores democráticos e o desenvolvimento sustentável possam florescer. Esses projetos também incluirão formação profissional, capacitando os jovens e construindo economias locais mais fortes."
 GER_Strategic_Partnership_Brazil: "Parceria Estratégica com o Brasil"
 GER_Strategic_Partnership_Brazil_desc: "A Alemanha aprofundará sua parceria estratégica com o Brasil, concentrando-se em áreas como energia renovável, proteção ambiental e desenvolvimento industrial. Os vastos recursos naturais e a economia em crescimento do Brasil fazem dele um parceiro vital para a Alemanha no Sul Global. Ao ampliar o comércio, a colaboração tecnológica e as iniciativas ambientais, essa parceria visa beneficiar ambas as nações economicamente e apoiar o contínuo desenvolvimento do Brasil como líder regional."
 GER_Modernize_Goethe_Institutes: "Modernizar os Institutos Goethe"
 GER_Modernize_Goethe_Institutes_desc: "Para ampliar o alcance global da cultura alemã, os Institutos Goethe passarão por esforços de modernização, incorporando aprendizado digital, conteúdo online e programação cultural aprimorada. Essas atualizações tornarão a língua e a cultura alemãs mais acessíveis a pessoas de todo o mundo, além de promover intercâmbios acadêmicos, artísticos e literários. Modernizar os Institutos Goethe garantirá que continuem sendo ferramentas eficazes de diplomacia cultural em um cenário global em rápida evolução."
 GER_Promote_the_german_language: "Promover a Língua Alemã"
 GER_Promote_the_german_language_desc: "A Alemanha lançará uma ambiciosa campanha global para promover a língua alemã, expandindo programas em escolas, universidades e centros culturais ao redor do mundo. Ao investir em recursos para o ensino do idioma e criar novas oportunidades para estudantes internacionais aprenderem alemão, essa iniciativa fortalecerá o soft power e a influência cultural da Alemanha. A proficiência em alemão também servirá de ponte para colaborações econômicas e acadêmicas mais sólidas."
 GER_Culture_andIntegration: "Cultura e Integração"
 GER_Culture_andIntegration_desc: "A Alemanha lançará iniciativas para promover a integração cultural, tanto no país quanto no exterior. Esses programas se concentrarão em incentivar o entendimento mútuo, a cooperação e o respeito entre diferentes grupos culturais. Ao promover valores compartilhados e a apreciação cultural, a Alemanha pretende reduzir tensões sociais, fortalecer as normas democráticas e fomentar a coexistência pacífica dentro de suas fronteiras e com nações parceiras em todo o mundo."
 GER_Strategic_Partnership_China: "Parceria Estratégica com a China"
 GER_Strategic_Partnership_China_desc: "A Alemanha fortalecerá ainda mais sua parceria estratégica com a China, concentrando-se em áreas como tecnologia, comércio e cooperação climática. À medida que a China continua a ascender como potência global, a Alemanha buscará laços econômicos mais profundos e projetos colaborativos que beneficiem ambas as nações. Por meio dessa parceria, a Alemanha desempenhará um papel fundamental na definição das futuras políticas econômicas da China, ao mesmo tempo em que garante acesso a mercados e recursos essenciais."
 GER_Alexander_von_humboldt_Institutes_Strengthen_reswarch_cooperations: "Fortalecer os Institutos Alexander von Humboldt"
 GER_Alexander_von_humboldt_Institutes_Strengthen_reswarch_cooperations_desc: "Os Institutos Alexander von Humboldt receberão maior apoio para fomentar colaborações internacionais de pesquisa. Ao investir em parcerias científicas de ponta e bolsas de pesquisa, a Alemanha pretende se posicionar como líder em inovação global. Essas cooperações abrangerão áreas críticas como mudança climática, medicina, tecnologia e proteção ambiental, fortalecendo o papel da Alemanha na definição do futuro da pesquisa global."
 GER_International_cutting_edge_research: "Pesquisa Internacional de Ponta"
 GER_International_cutting_edge_research_desc: "A Alemanha liderará a promoção de colaborações internacionais em pesquisa de ponta, particularmente nas áreas de energia renovável, biotecnologia e inteligência artificial. Ao fomentar parcerias globais nessas áreas, a Alemanha busca impulsionar avanços tecnológicos que enfrentem desafios globais. Essas iniciativas não só fortalecerão a comunidade científica alemã, mas também contribuirão para sua liderança global em inovação."
 GER_Promote_academic_elites: "Promover as Elites Acadêmicas"
 GER_Promote_academic_elites_desc: "A Alemanha ampliará seus esforços para atrair e formar elites acadêmicas de todo o mundo. Ao oferecer bolsas de estudo, oportunidades de pesquisa e programas de desenvolvimento de carreira, a Alemanha pretende fomentar a próxima geração de líderes globais na academia e na ciência. Essas pessoas contribuirão para a economia alemã ao mesmo tempo em que fortalecem os laços com seus países de origem por meio de redes acadêmicas e profissionais."
 GER_International_leadership_training: "Treinamento Internacional de Liderança"
 GER_International_leadership_training_desc: "Por meio de programas de treinamento de liderança para funcionários públicos, líderes empresariais e membros da sociedade civil, a Alemanha investirá na formação de lideranças capazes em suas nações parceiras. Esses programas se concentrarão em governança, desenvolvimento sustentável e gestão econômica, promovendo uma liderança forte e transparente em países em desenvolvimento. Esse esforço não só fomentará a estabilidade e o crescimento econômico nos países parceiros, mas também fortalecerá a influência global da Alemanha por meio de aliados capazes."
 GER_Suitable_Agriculture_programs: "Programas de Agricultura Adequada"
 GER_Suitable_Agriculture_programs_desc: "A Alemanha investirá em programas agrícolas adequados em nações em desenvolvimento, com foco em práticas agrícolas sustentáveis, transferência de tecnologia e segurança alimentar. Esses programas ajudarão a enfrentar os crescentes desafios da mudança climática, da escassez de recursos e do crescimento populacional. Ao apoiar a agricultura sustentável, a Alemanha pretende melhorar os meios de subsistência em áreas rurais, reduzir a pobreza e fortalecer os sistemas alimentares globais, garantindo que seus parceiros agrícolas se beneficiem de estabilidade e prosperidade de longo prazo."
 GER_Strategic_Partnership_Japan: "Parceria Estratégica com o Japão"
 GER_Strategic_Partnership_Japan_desc: "A Alemanha ampliará sua parceria estratégica com o Japão, concentrando-se em áreas como intercâmbio tecnológico, energia renovável e comércio. Como duas das principais nações industriais, Alemanha e Japão compartilham objetivos comuns de crescimento econômico, avanço tecnológico e estabilidade global. Essa parceria aprofundará a cooperação em setores-chave, incluindo infraestrutura digital e manufatura avançada, criando uma poderosa aliança para a inovação e a influência global."
 GER_Strategic_Partnership_South_korea: "Parceria Estratégica com a Coreia do Sul"
 GER_Strategic_Partnership_South_korea_desc: "A Alemanha fortalecerá sua parceria estratégica com a Coreia do Sul, enfatizando a colaboração em comércio, tecnologia e educação. Como ator-chave no Leste Asiático, a Coreia do Sul apresenta oportunidades valiosas para empresas e instituições de pesquisa alemãs. Essa parceria ampliará a influência da Alemanha na região, ao mesmo tempo em que promove os valores compartilhados de democracia, inovação e desenvolvimento sustentável."
 GER_Strategic_Partnership_South_Afrika: "Parceria Estratégica com a África do Sul"
 GER_Strategic_Partnership_South_Afrika_desc: "A Alemanha aprimorará sua parceria estratégica com a África do Sul, concentrando-se em desenvolvimento sustentável, comércio e educação. Como nação líder no continente africano, a África do Sul é um parceiro vital para o engajamento da Alemanha na África. Essa parceria promoverá o crescimento mútuo, abordando questões-chave como mudança climática, desigualdade econômica e estabilidade política, ao mesmo tempo em que reforça o compromisso da Alemanha com o desenvolvimento de longo prazo da África."
 GER_Strategic_Partnership_Vietnam: "Parceria Estratégica com o Vietnã"
 GER_Strategic_Partnership_Vietnam_desc: "A Alemanha ampliará sua parceria estratégica com o Vietnã, concentrando-se em comércio, educação e energia renovável. Como uma das economias que mais crescem no Sudeste Asiático, o Vietnã oferece oportunidades significativas para empresas e investimentos alemães. Essa parceria promoverá o desenvolvimento sustentável, a cooperação econômica e o intercâmbio cultural, posicionando a Alemanha como parceira-chave na rápida modernização e no crescimento da região."
 GER_International_business: "Negócios Internacionais"
 GER_International_business_desc: "A Alemanha costuma se autoproclamar \"Exportweltmeister\", 'campeã mundial de exportações'. A economia alemã tradicionalmente registra superávits comerciais significativos, vendendo muito mais a outras nações industriais do que compra delas. A continuidade de uma política favorável às exportações exige grande pragmatismo na política externa: afinal, o dinheiro de um ditador vale tanto quanto o de um líder popular."
 GER_Industrial_outsourcing: "Terceirização Industrial"
 GER_Industrial_outsourcing_desc: "O setor industrial alemão foi massivamente enfraquecido pelo aumento dos salários e pela livre circulação de mão de obra para mercados europeus menos favorecidos, como Hungria, Eslováquia, Romênia e Bulgária. O governo alemão precisa garantir que o deslocamento das empresas industriais seja controlado por subsídios governamentais e incentivos da UE, a fim de não perder empregos para rivais mais hostis, como a China."
 GER_Berlin_shithole: "Estado Falido"
 GER_Solidaritatszuschlag: "Solidaritätszuschlag"
 GER_Mehrwertsteuer: "Mehrwertsteuer"
 GER_blame_for_BSE: "Culpada pela BSE"
 GER_invite_to_garisson: "convidado para demonstração de força"
 GER_Ideas_Polish_labour.t: "Mão de Obra Polonesa na Economia Alemã"
 GER_Ideas_Polish_labour.d: "Os trabalhadores poloneses tornaram-se parte indispensável da economia alemã, ocupando funções vitais como ajudantes de colheita, artesãos qualificados e cuidadores. Atraídos pela oportunidade de ganhar bem mais do que na Polônia, esses trabalhadores não apenas sustentam o mercado de trabalho alemão, mas também trazem valiosa experiência e dedicação. Suas contribuições evidenciam a interconexão dos mercados de trabalho europeus e ressaltam a importância do tratamento justo e dos esforços de integração dos trabalhadores estrangeiros para sustentar o crescimento econômico."
 GER_Legacy_mod: "Legado Alemão"
 GER_Rafid_Ahmed_Alwan_al_Janabi: "Rafid Ahmed Alwan al-Janabi"
 GER_Philipp_Schaaf: "Philipp Schaaf"
 GER_Khalid_al_Masri: "Khalid al-Masri"
 GER_Gerhard_Conrad: "Gerhard Conrad"
 GER_Erich_schmidt_eenbloom: "Erich Schmidt-Eenboom"
 GER_end_v_fall: "Encerrar o Verteidigungsfall"
 GER_end_v_fall_desc: "É hora de declarar formalmente o fim do estado de defesa e voltar às operações normais. Com isso, restauramos a governança regular, reinstauramos a supervisão civil e retomamos o funcionamento padrão de todas as instituições, garantindo estabilidade e o retorno à vida cotidiana."
 GER_winds.1.t: "Propaganda Extremista Encontrada no Quartel"
 GER_winds.1.d: "Um soldado de um de nossos quartéis foi preso após distribuir propaganda extremista entre seus colegas. Este incidente levantou sérias preocupações sobre a presença dessas ideologias em nossas forças armadas e exige uma resposta rápida para evitar uma escalada."
 GER_winds.1.a: "Lançar uma investigação completa e uma repressão pública"
 GER_winds.1.b: "Minimizar o incidente como conduta isolada"
 GER_winds.2.t: "Linguagem Extremista Encontrada nas Tropas"
 GER_winds.2.d: "Vieram à tona relatos de linguagem extremista se espalhando entre as tropas, junto com um escândalo envolvendo incidentes semelhantes no treinamento básico. Essa situação corre o risco de manchar a reputação da Bundeswehr e minar a confiança pública em nosso compromisso com os valores democráticos."
 GER_winds.2.a: "Implementar política de tolerância zero e reforma sistêmica"
 GER_winds.2.b: "Ignorar a conversa interna, o moral vem primeiro"
 GER_winds.3.t: "Descoberta de Depósito Oculto de Armas"
 GER_winds.3.d: "Um depósito de armas contendo estoques modernos e antigos da Bundeswehr foi descoberto em conexão com um suposto grupo extremista. A descoberta evidencia uma possível falha na segurança de nossa cadeia de suprimentos e exige ação imediata para proteger e rastrear os ativos militares."
 GER_winds.3.a: "Confiscar os ativos e processar todos os envolvidos"
 GER_winds.3.b: "Deixar a inteligência militar cuidar disso discretamente"
 GER_winds.4.t: "Mídia Expõe Blog Extremista Administrado por Soldados"
 GER_winds.4.d: "Veículos de imprensa descobriram um blog extremista operado por um grupo de soldados, espalhando retórica antidemocrática. A revelação ameaça a confiança pública na Bundeswehr e levanta sérias questões sobre a triagem de pessoal."
 GER_winds.4.a: "Condenar publicamente a plataforma e reformular a triagem"
 GER_winds.4.b: "Silenciar a mídia e encerrar o caso internamente"
 GER_winds.5.t: "Radicalização de Veteranos Após o Serviço"
 GER_winds.5.d: "Alguns ex-soldados mostraram sinais de radicalização após suas missões, com dificuldade para se reintegrar à vida civil. Relatórios indicam que esses indivíduos estão sendo atraídos para círculos extremistas, representando uma ameaça crescente à estabilidade social."
 GER_winds.5.a: "Lançar um programa nacional de supervisão e apoio a veteranos"
 GER_winds.5.b: "Descartar a tendência como isolada e exagerada"
 GER_winds.6.t: "Golpe de Estado"
 GER_winds.6.d: "As crescentes tensões entre a liderança militar e o governo civil chegaram ao ponto de ruptura. A portas fechadas, oficiais de alta patente e autoridades de segurança expressam crescente frustração com a paralisia política, o extremismo ideológico percebido e o que chamam de 'crise de rumo nacional'.\n\nO governo civil, por sua vez, alerta para comportamento inconstitucional e redes secretas que minam as instituições democráticas.\n\nO país prende a respiração: as lealdades serão testadas, e as forças armadas devem agora decidir: manter a cadeia de comando ou agir em nome da salvação nacional?"
 GER_winds.6.a: "Deixar o equilíbrio mudar em silêncio, ou pela força"
 GER_SAPOS_CHI_I: "§YArrendar acesso ao Sistema de Navegação por Satélite Beidou.§!\nIsso aumentará seus Satélites de Navegação disponíveis"
 GER_SAPOS_CHI_II: "§YO contrato de acesso ao Beidou precisa ser renegociado.§!"
