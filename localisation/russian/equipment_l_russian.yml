 ENG_Heavy_Anti_tank_3: "Land Rover Javelin"
 ENG_Heavy_Anti_tank_4: "Boxer Brimstone"
 ENG_IFV_1: "M113 IFV"
 ENG_IFV_2: "Alvis Stormer"
 ENG_IFV_2_short: "Stormer"
 ENG_IFV_2_desc: "Разработанный на основе серии CVR(T), Stormer представляет собой модернизированный вариант, который может быть сконфигурирован для выполнения нескольких задач на поле боя. Наиболее распространёнными вариантами Stormer являются платформа ПВО ближнего действия (SHORAD) и машина поддержки пехоты. Вариант БМП оснащён 30-мм пушкой и пусковыми установками ПТУР по бортам."
 ENG_IFV_3: "FV510 Warrior"
 ENG_IFV_3_short: "Warrior"
 ENG_IFV_3_desc: "Первая настоящая БМП, спроектированная и построенная британцами, Warrior изначально разрабатывалась для замены стареющего парка FV430 в британской армии после осознания необходимости повысить защищённость и огневую мощь имеющихся боевых машин. Достойно вооружённая 30-мм пушкой и пусковой установкой ПТУР, БМП Warrior должна была стать соперником хвалёной серии БМП Советской армии. Warrior вскоре доказала свою боеспособность в боснийском конфликте 1990-х годов."
 ENG_IFV_4: "FV510 Warrior Javelin"
 ENG_IFV_4_short: "Warrior Javelin"
 ENG_IFV_4_desc: "БМП Warrior подверглась некоторому переоборудованию, когда в 1990-х годах на вооружение впервые поступили знаменитые ПТУР Javelin. Британская армия вскоре приобрела эти ПТУР и решила заменить ими MILAN, что потребовало переоснастить Warrior ракетами Javelin."
 ENG_IFV_5: "FV510 Warrior WCSP"
 ENG_IFV_5_short: "Warrior WCSP"
 ENG_IFV_5_desc: "По мере того как современная война становится всё более сложной и динамичной, возрастает потребность в модернизации парка стареющих Warrior. Поэтому британская армия запустила программу по поддержанию и модернизации Warrior, чтобы они соответствовали современным стандартам. Warrior WCSP был полностью оснащён новым комплектом ночной и тепловизионной оптики, СУО, электроникой, модульным броневым пакетом, а также новыми башнями и 40-мм пушками."
 ENG_IFV_6: "General Dynamics Ajax"
 ENG_IFV_6_short: "Ajax"
 ENG_IFV_6_desc: "Хотя платформы CVR(T) были очень универсальными и надёжными для британцев, в 21 веке они стали устаревать. Созданная на базе боевой бронированной машины ASCOD, новая Scout Specialist Vehicle должна была выполнять роль специализированной современной разведывательной машины для британской армии, но вскоре она стала идеальной платформой для создания нового парка современных боевых бронированных машин. Ajax — это вариант платформы в роли БМП, предназначенный для разведки, поддержки пехоты и совместного управления огнём, адекватно оснащённый новой 40-мм пушкой, дистанционно управляемым боевым модулем (RWS) и пусковой установкой ПТУР Javelin."
 ENG_IFV_7: "FV904"
 ENG_IFV_7_short: "FV904"
 ENG_Anti_tank_1: "LAW80"
 ENG_Anti_tank_2: "Milan"
 ENG_Anti_tank_3: "NLAW"
 ENG_Anti_tank_4: "NLAW Gen2"
 ENG_MBT_1: "Centurion"
 ENG_MBT_1_short: "Centurion"
 ENG_MBT_1_desc: "Когда он впервые появился, конструкция Centurion стала революционной, заложив образец для первых основных боевых танков. Разработанный и произведённый на завершающем этапе Второй мировой войны, Centurion поступил на службу лишь в послевоенный период, но быстро стал ответом Запада на советские танки Т-54. Надёжный, эффективный и проверенный во всевозможных конфликтах холодной войны, Centurion до сих пор используется многими странами по всему миру."
 ENG_MBT_2: "FV4201 Chieftain"
 ENG_MBT_2_short: "Chieftain"
 ENG_MBT_2_desc: "Созданный на основе успешной модели танка Centurion, Chieftain должен был стать британским основным боевым танком в конце 1960-х годов. Он получил значительно улучшенную броню, оптику и огневую мощь, что сделало Chieftain одним из лучших вариантов против советских противников. Однако единственным недостатком, сдерживавшим Chieftain, был его ужасный двигатель: рождённый из благородной идеи заправлять танк любым видом топлива в случае войны, двигатель оказался крайне ненадёжным и медленным."
 ENG_MBT_3: "FV4030/4 Challenger I"
 ENG_MBT_3_short: "Challenger I"
 ENG_MBT_3_desc: "Первоначально проект MBT-80 был разработан на базе танка Chieftain для иранских нужд, но с Исламской революцией в Иране проект был отменен. Британская армия стала клиентом, и таким образом танк был модифицирован в соответствии с британскими потребностями. Challenger I стал первым танком, который использовал революционную броню Chobham, обеспечивая превосходную защиту над любой западной RHA того времени. Он стал одним из выдающихся танков в конце 20-го века."
 ENG_MBT_4: "FV4034 Challenger II"
 ENG_MBT_4_short: "Challenger II"
 ENG_MBT_4_desc: "Challenger II - это обширная реконструкция Challenger I, сделанная лучше с улучшенной броней Chobham, новой башней и новой 120-мм пушкой. Он становится символом Британского королевского бронетанкового корпуса и доказал свою силу в бою во время войны в Ираке."
 ENG_MBT_5: "Challenger II Black Knight"
 ENG_MBT_5_short: "Challenger II BK"
 ENG_MBT_5_desc: "Пакет Challenger II Black Knight впервые представлен в 2018 году в рамках программы LEP MBT. Обладая обширными возможностями ночного боя, тепловизионной оптикой и активной системой защиты, Challenger II был модернизирован для решения сложных задач современной войны сегодня."
