 CHI_outer_mongolia_expansion: "Réappropriation de la Mongolie-Extérieure"
 CHI_outer_mongolia_expansion_desc: "Le différend concernant la Mongolie-Intérieure est réglé, et celui concernant la Mongolie-Extérieure est désormais à l'ordre du jour. Ce triste héritage des accords de Yalta touche à sa fin. La steppe mongole, s'étendant au nord et au sud du désert de Gobi, sera enfin unifiée sous une seule bannière."
 CHI_outer_mongolia_assimilation: "Assimilation de la Mongolie extérieure"
 CHI_outer_mongolia_assimilation_desc: "Près d'un siècle s'est écoulé depuis l'invasion d'Ungern, et les troupes frontalières chinoises patrouillent à nouveau la frontière de Kyakhta."
