 UKR_varyag_deck_trials_desc: "\n\n\n\n\n\n£UKR_desctext_varyag_air_group_for_tooltip\n\n\n\n\n\n\n\n\n§W§!§Y바랴크§!§W에서의 운용을 위해 갑판 승조원 자격을 인증합니다. 소수의 항공기로는 기초 훈련이 가능합니다. 예비로 §!§Y함재 전투기 12대§!§W 대대가 있으면 §!§G더 큰 경험 보상§!§W을 주는 전체 항공단 시험을 치를 수 있습니다. 시험 계획은 하나만 완료할 수 있습니다.§!"
