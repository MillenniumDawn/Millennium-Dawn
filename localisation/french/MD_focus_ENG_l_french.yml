 ENG_small_ship_project: "Projet de petits navires"
 ENG_inner_circle_andrew.06.d: "Après les retombées de ses liens avec Jeffrey Epstein, le prince Andrew est devenu politiquement toxique. Sous la pression publique et institutionnelle croissante, il est dépouillé de son statut restant au sein de la famille royale et retiré du cercle intérieur."
 ENG_military.046.t: "Washington approuve le partenariat"
 ENG_military.046.d: "Les États-Unis ont officiellement désigné le Royaume-Uni allié majeur non membre de l'OTAN. Le partenariat stratégique ouvre la voie à une coopération de défense plus profonde et à un accès préférentiel à la technologie militaire américaine."
 ENG_military.046.a: "Un ami précieux de l'autre côté de l'Atlantique"
 ENG_military.047.t: "Washington refuse le partenariat"
 ENG_military.047.d: "Les États-Unis ont refusé notre demande de désignation d'allié majeur non membre de l'OTAN. La relation spéciale demeure, mais Washington n'est pas prêt à la formaliser davantage pour l'instant."
 ENG_military.047.a: "Décevant, mais ce n'est pas la fin"
