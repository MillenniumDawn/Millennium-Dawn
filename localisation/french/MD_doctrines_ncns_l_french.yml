 SUBDOCTRINE_EQUIPMENT_DRONE_DESC: ""
 SPECIAL_FORCES_MIXED: "Commande mixte"
 SPECIAL_FORCES_MIXED_DESC: "Cette doctrine structure les forces spéciales en unités hautement sélectives, formées pour des missions complexes et prioritaires exigeant précision et discrétion. Les concepts d'élite des forces spéciales mettent l'accent sur l'intégration de capacités avancées et l'efficacité opérationnelle dans des environnements divers."
 SPECIAL_FORCES_MARINE_FOCUS: "Forces spéciales axées sur la marine"
 SPECIAL_FORCES_MARINE_FOCUS_DESC: "Cette doctrine oriente principalement nos forces spéciales vers les unités de marines, nous offrant plus d'options pour former et déployer des forces de marines. Cela se fait au détriment de la formation et de l'équipement adéquats des autres branches de nos forces spéciales."
 SPECIAL_FORCES_AIRBORNE_FOCUS: "Forces spéciales aéroportées concentrées"
 SPECIAL_FORCES_AIRBORNE_FOCUS_DESC: "Cette doctrine oriente principalement nos forces spéciales vers les unités aéroportées, nous offrant plus d'options pour former et déployer des forces aéroportées. Cela se fait au détriment de la formation et de l'équipement adéquats des autres branches de nos forces spéciales."
 SPECIAL_FORCES_RANGER_FOCUS: "Forces spéciales axées sur les Rangers"
 SPECIAL_FORCES_RANGER_FOCUS_DESC: "Cette doctrine oriente principalement nos forces spéciales vers les unités de rangers, nous offrant plus d'options pour former et déployer des forces de rangers. Cela se fait au détriment de la formation et de l'équipement adéquats des autres branches de nos forces spéciales."
 DOCTRINE_TRACK_MIXED_OPTIONS: "Forces spéciales supplémentaires"
 AIRBORN_INTERDICTION: "Interdiction aéroportée"
 AIRBORN_INTERDICTION_DESC: "Cette doctrine envoie de l'infanterie aéroportée légère et des équipes d'éclaireurs loin derrière les lignes ennemies pour saboter aérodromes, ravitaillement et communications. Les concepts d'interdiction mettent l'accent sur l'infiltration, la démolition et le retardement des manœuvres ennemies plutôt que sur la tenue du terrain."
 AIRBORN_AIRHEAD_ASSAULT: "Assaut aérien"
 AIRBORN_AIRHEAD_ASSAULT_DESC: "Cette doctrine parachute en masse de l'infanterie aéroportée légère et motorisée pour saisir et tenir une tête de pont aérienne jusqu'à l'arrivée des forces de relève. Les concepts d'assaut de tête de pont aérienne mettent l'accent sur des largages concentrés, une consolidation rapide et l'endurance défensive sous contre-attaque."
 RANGER_JUNGLE_FORCES: "Rangers de la jungle"
 RANGER_JUNGLE_FORCES_DESC: "Cette doctrine prépare les rangers à des opérations soutenues au cœur de la jungle, où chaleur, maladies et lignes de ravitaillement rompues vainquent les troupes conventionnelles. Les concepts de jungle mettent l'accent sur l'acclimatation, l'infiltration à travers un terrain impraticable et l'autonomie loin des lignes amies."
 MARINE_ELITE_RAIDERS: "Pillards côtiers"
 MARINE_ELITE_RAIDERS_DESC: "Cette doctrine structure les forces de marines en petites équipes de raid qui frappent des objectifs côtiers et se retirent avant que l'ennemi ne réagisse. Les concepts de raiders côtiers mettent l'accent sur la vitesse, l'infiltration et une empreinte logistique légère."
 MARINE_ARMORED_BEACHHEAD: "Tête de pont blindée"
 MARINE_ARMORED_BEACHHEAD_DESC: "Cette doctrine organise les forces amphibies pour débarquer des blindés et percer hors de la tête de pont avant que le défenseur ne se consolide. Les concepts de tête de pont blindée mettent l'accent sur la puissance de feu mécanisée, l'élan et l'expansion rapide du lodgement."
 AIRBORN_AIR_ASSAULT: "Assaut aérien"
 AIRBORN_AIR_ASSAULT_DESC: "Cette doctrine structure les forces aéroportées autour de l'assaut aérien héliporté plutôt que de l'insertion par parachute. Les concepts d'assaut aérien mettent l'accent sur l'enveloppement vertical rapide, la mobilité et le soutien rotatif à la demande."
 AIRBORN_ARMORED_DROP: "Aéroporté blindé"
 AIRBORN_ARMORED_DROP_DESC: "Cette doctrine équipe les forces aéroportées de blindés largables et de colonnes mécanisées pour une action soutenue après le saut. Les concepts aéroportés blindés mettent l'accent sur la puissance de feu protégée, l'organisation et la tenue loin en territoire ennemi."
 RANGER_RECON_FORCES: "Rangers de reconnaissance"
 RANGER_RECON_FORCES_DESC: "Cette doctrine forme les rangers à la reconnaissance profonde, au filtrage et à la surveillance en avant de la force principale. Les concepts de rangers de recon mettent l'accent sur la furtivité, le savoir-faire de terrain et l'acquisition précise d'objectifs."
 RANGER_STRIKE_FORCES: "Rangers d'attaque"
 RANGER_STRIKE_FORCES_DESC: "Cette doctrine prépare les rangers à l'assaut rapide et à la saisie d'aérodromes contre des objectifs fortifiés. Les concepts de rangers de frappe mettent l'accent sur le choc, le tempo et l'application directe de la force."
 SOF_OPERATIONS_COMMAND: "Commandement des opérations spéciales"
 SOF_OPERATIONS_COMMAND_DESC: "Cette doctrine établit un commandement dédié pour lever et soutenir des forces d'opérations spéciales de premier palier. Les concepts de commandement des opérations spéciales mettent l'accent sur le recrutement sélectif, le conditionnement et le soutien interarmées dans tous les milieux."
 SOF_DIRECT_ACTION: "Action directe"
 SOF_DIRECT_ACTION_DESC: "Cette doctrine forme les opérateurs aux raids d'action directe contre des cibles de haute valeur. Les concepts d'action directe mettent l'accent sur les frappes de précision, l'insertion rapide et l'engagement rapproché décisif."
 SOF_SABOTAGE_SUBVERSION: "Sabotage et subversion"
 SOF_SABOTAGE_SUBVERSION_DESC: "Cette doctrine prépare les opérateurs au sabotage, à la subversion et à la guerre non conventionnelle derrière les lignes ennemies. Les concepts de sabotage mettent l'accent sur l'infiltration, les démolitions et l'opération prolongée sans ravitaillement."
 SOF_RECON_INTELLIGENCE: "Reconnaissance spéciale"
 SOF_RECON_INTELLIGENCE_DESC: "Cette doctrine oriente les forces spéciales vers la reconnaissance, la surveillance et la collecte de renseignement. Les concepts de reconnaissance spéciale mettent l'accent sur une empreinte légère, l'observation patiente et un compte rendu précis."
 SOF_COUNTER_TERROR: "Lutte contre le terrorisme"
 SOF_COUNTER_TERROR_DESC: "Cette doctrine forme les opérateurs au contre-terrorisme, à la libération d'otages et au combat urbain rapproché. Les concepts de contre-terreur mettent l'accent sur la préparation, la précision et la réaction rapide."
 SUBDOCTRINE_DESIGN_STEALTH: "Conceptions furtives"
 SUBDOCTRINE_DESIGN_STEALTH_DESC: "Cette doctrine priorise le développement d'aéronefs à section radar réduite et à survabilité renforcée. Les conceptions furtives mettent l'accent sur les matériaux à faible observabilité, les contre-mesures électroniques et des configurations structurelles qui minimisent la détection."
 SUBDOCTRINE_DESIGN_EW: "Conceptions de guerre électronique"
 SUBDOCTRINE_DESIGN_EW_DESC: "Cette doctrine se concentre sur l'intégration de systèmes dédiés de guerre électronique aux plateformes aériennes. Les conceptions de guerre électronique mettent l'accent sur le brouillage actif, la détection passive et les capacités de suppression pour dégrader les défenses aériennes adverses."
 SUBDOCTRINE_DESIGN_MODULAR: "Conceptions modulaires"
 SUBDOCTRINE_DESIGN_MODULAR_DESC: "Cette doctrine organise le développement aérien autour d'architectures ouvertes et de cadres de composants standardisés. Les conceptions modulaires mettent l'accent sur des mises à niveau rapides, des coûts de cycle de vie réduits et une adaptation flexible de plateforme."
 SUBDOCTRINE_HEAVY_AEW: "Alerte précoce aéroportée"
 SUBDOCTRINE_HEAVY_AEW_DESC: "Cette doctrine structure les opérations de gros aéronefs autour de la surveillance aéroportée et de la gestion de bataille. Les concepts d'alerte avancée aéroportée mettent l'accent sur la détection à grande échelle, l'intégration de données en temps réel et la direction coordonnée des moyens aériens."
 SUBDOCTRINE_HEAVY_AIRLIFT: "Transport aérien stratégique"
 SUBDOCTRINE_HEAVY_AIRLIFT_DESC: "Cette doctrine organise les opérations de gros aéronefs autour du mouvement stratégique des forces, de l'équipement et des ravitaillements. Les concepts de pont aérien stratégique mettent l'accent sur la portée mondiale, un débit soutenu et un basing flexible."
 SUBDOCTRINE_HEAVY_REFUELING: "Ravitaillement aérien"
 SUBDOCTRINE_HEAVY_REFUELING_DESC: "Cette doctrine intègre les opérations de ravitailleurs dans la planification de campagne aérienne soutenue. Les concepts de ravitaillement en vol mettent l'accent sur une portée opérationnelle étendue, une présence aérienne persistante et un soutien carburant coordonné."
 SUBDOCTRINE_MULTIROLE_DOMINANCE: "Domination aérienne multirôle"
 SUBDOCTRINE_MULTIROLE_DOMINANCE_DESC: "Cette doctrine emploie des aéronefs polyvalents comme plateformes primaires pour établir la domination aérienne. Les concepts polyvalents de domination aérienne mettent l'accent sur la fusion de l'engagement hors de vue et de la flexibilité multi-missions pour contester et contrôler le domaine aérien."
 SUBDOCTRINE_MULTIROLE_CARRIER: "Transporteur multirôle"
 SUBDOCTRINE_MULTIROLE_CARRIER_DESC: "Cette doctrine structure les opérations d'aéronefs polyvalents autour du déploiement depuis porte-avions et des missions de frappe navale. Les concepts polyvalents embarqués mettent l'accent sur les opérations de flotte coordonnées, l'interception depuis le pont et l'intégration de la puissance aérienne dans la campagne maritime."
 SUBDOCTRINE_STRIKE_SEAD: "Opérations SEAD/DEAD"
 SUBDOCTRINE_STRIKE_SEAD_DESC: "Cette doctrine organise les opérations d'aéronefs de frappe autour de la suppression et de la destruction des réseaux de défense aérienne adverses. Les concepts SEAD/DEAD mettent l'accent sur les armes anti-radar, l'attaque électronique coordonnée et l'élimination systématique des menaces sol-air pour garantir la liberté d'action dans un espace aérien contesté."
 SUBDOCTRINE_STRIKE_INTERDICTION: "Interdiction profonde"
 SUBDOCTRINE_STRIKE_INTERDICTION_DESC: "Cette doctrine oriente les aéronefs de frappe vers la perturbation de la profondeur opérationnelle adverse par des engagements de précision à longue portée. Les concepts d'interdiction profonde mettent l'accent sur les armes standoff, la planification de dossiers d'objectifs et des paquets de frappe coordonnés pour dégrader les capacités ennemies avant qu'elles n'atteignent le front."
 SUBDOCTRINE_STRIKE_CAMPAIGN: "Campagne d'interdiction aérienne"
 SUBDOCTRINE_STRIKE_CAMPAIGN_DESC: "Cette doctrine structure les aéronefs de frappe et d'appui aérien rapproché autour d'opérations d'interdiction soutenues contre les forces terrestres adverses. Les concepts de campagne d'interdiction aérienne mettent l'accent sur une présence persistante, des plateformes capables de loiter et une intégration étroite avec les contrôleurs terrestres avancés."
 SUBDOCTRINE_FIGHTER_BVR: "Combat BVR"
 SUBDOCTRINE_FIGHTER_BVR_DESC: "Cette doctrine structure les opérations de chasse autour de l'engagement hors de vue au missile guidé radar. Les concepts de combat BVR mettent l'accent sur la détection longue portée, le suivi multi-cibles et la probabilité de premier coup pour vaincre l'adversaire avant le contact visuel."
 SUBDOCTRINE_FIGHTER_WVR: "Combats de chiens WVR"
 SUBDOCTRINE_FIGHTER_WVR_DESC: "Cette doctrine forme les pilotes de chasse au combat manœuvrier à courte portée en vue visuelle. Les concepts de dogfight WVR mettent l'accent sur l'agilité de l'appareil, la conscience situationnelle et des tactiques offensives agressives pour obtenir des kills en engagement rapproché au canon et au missile courte portée."
 SUBDOCTRINE_FIGHTER_STEALTH: "Opérations de chasseurs furtifs"
 SUBDOCTRINE_FIGHTER_STEALTH_DESC: "Cette doctrine structure les opérations de chasse de cinquième génération autour de la pénétration à faible observabilité et de l'engagement first-look. Les concepts de chasse furtive mettent l'accent sur une détectabilité réduite, l'emport interne d'armes et la pénétration coordonnée de défenses aériennes en couches."
 SUBDOCTRINE_FIGHTER_INTERCEPTOR: "Intercepteurs dédiés"
 SUBDOCTRINE_FIGHTER_INTERCEPTOR_DESC: "Cette doctrine organise les forces de chasse pour une réaction rapide aux violations d'espace aérien et à l'interception de bombardiers. Les concepts d'intercepteur dédié mettent l'accent sur des protocoles de scramble à haute vitesse, des procédures d'interception contrôlées depuis le sol et des postures d'alerte zonales."
 DOCTRINE_TRACK_DRONE_WARFARE: "Guerre des drones"
 GRAND_DOCTRINE_AUTONOMOUS_AIR: "Opérations aériennes autonomes"
 GRAND_DOCTRINE_AUTONOMOUS_AIR_DESC: "Cette grande doctrine structure la puissance aérienne autour de systèmes sans pilote, d'opérations à distance et d'une capacité de frappe autonome. Les concepts d'opérations aériennes autonomes mettent l'accent sur un risque pilote réduit, un ISR persistant et l'intégration de plateformes sans pilote à chaque couche de la campagne aérienne."
 SUBDOCTRINE_DRONE_MALE: "Opérations sur les UCAV MALE"
 SUBDOCTRINE_DRONE_MALE_DESC: "Cette doctrine structure les opérations aériennes autour d'aéronefs de combat sans pilote de moyenne altitude et longue endurance. Les concepts UCAV MALE mettent l'accent sur la surveillance persistante, les missions de frappe téléopérées et une présence continue au-dessus des zones d'objectifs."
 SUBDOCTRINE_DRONE_UCAS: "Grève des transporteurs UCAS"
 SUBDOCTRINE_DRONE_UCAS_DESC: "Cette doctrine intègre les systèmes aériens de combat sans pilote aux opérations de groupes aéronavals. Les concepts UCAS embarqués mettent l'accent sur des missions de frappe furtives depuis le pont, une portée de porte-avions étendue et une défense de flotte autonome."
 SUBDOCTRINE_DRONE_LOITERING: "Munitions errantes"
 SUBDOCTRINE_DRONE_LOITERING_DESC: "Cette doctrine structure les opérations de frappe autour de munitions rôdeuses capables d'un vol prolongé avant d'engager des cibles fixes ou mobiles. Les concepts de munitions rôdeuses mettent l'accent sur la saturation à bas coût, la précision anti-blindage et un lancement distribué."
 SUBDOCTRINE_DRONE_COUNTER: "Opérations de lutte contre les drones"
 SUBDOCTRINE_DRONE_COUNTER_DESC: "Cette doctrine organise les forces aériennes et terrestres pour détecter, intercepter et vaincre les systèmes aériens sans pilote hostiles. Les concepts anti-drones mettent l'accent sur un brouillage électronique en couches, des plateformes d'interception dédiées et un radar basse altitude intégré."
 SUBDOCTRINE_DRONE_SWARM: "Intégration d’un essaim de drones"
 SUBDOCTRINE_DRONE_SWARM_DESC: "Cette doctrine structure les opérations aériennes autour d'un grand nombre de plateformes autonomes et semi-autonomes coordonnées. Les concepts d'essaim de drones mettent l'accent sur le ciblage distribué, l'emploi de forces attritables et le teaming homme-machine pour submerger les défenses adverses."
 SUBDOCTRINE_OPERATION_COIN: "Opérations de contre-insurrection"
 SUBDOCTRINE_OPERATION_COIN_DESC: "Cette doctrine structure les forces terrestres pour vaincre les menaces irrégulières par le contrôle de la population, des raids d'action directe guidés par le renseignement et des forces de réaction rapide. Les opérations de contre-insurrection mettent l'accent sur une présence persistante et la coopération civilo-militaire pour rétablir la stabilité."
 SUBDOCTRINE_OPERATION_URBAN_WARFARE: "Opérations de guerre urbaine"
 SUBDOCTRINE_OPERATION_URBAN_WARFARE_DESC: "Cette doctrine spécialise les forces terrestres pour le combat dans les villes et mégapoles. Les opérations de guerre urbaine mettent l'accent sur le nettoyage nœud par nœud, les tactiques d'infiltration et des feux défensifs entrecroisés pour contrôler l'espace de bataille vertical et horizontal complexe."
