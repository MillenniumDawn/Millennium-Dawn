 BSH_Rec_tank_0: "PT-76"
 BSH_Rec_tank_0_desc: "This super fast amphibious light tank can sneak up on enemy positions from across the river and unload hell. With its 76.2mm D-56T rifled tank gun."
 BSH_Rec_tank_0_short: "PT-76"
 BSH_Rec_tank_1: "2S25 Sprut-SD"
 BSH_Rec_tank_1_desc: "A self-propelled amphibious tank destroyer, this vehicle can sneak up on enemy tanks and fire its 125mm cannon that the t-72-80 carry."
 BSH_Rec_tank_1_short: "2S25 Sprut-SD"
 BSH_Rec_tank_2: "BMPT Terminator"
 BSH_Rec_tank_2_desc: "아마도 지금까지 만들어진 가장 치명적인 유리 대포 중 하나일 것입니다. 탱크에 대항할 수는 없지만 기둥 전체를 파괴할 수 있습니다. 4개의 130mm 발사대와 2개의 30mm 기관포를 갖추고 있습니다."
 BSH_Rec_tank_2_short: "BMPT Terminator"
 BSH_Rec_tank_3: "K-18 Bumerang"
 BSH_Rec_tank_3_desc: "The Bumerang was first revealed to be both a cost-efficient APC and IFV for the modern Russian Army. However, the Bumerang will also be used as a dedicated anti-tank platform sporting a 125mm cannon, the details of which were unveiled in 2018. Much like the American Stryker MGS, the Bumerang will serve as a fire support vehicle much like the BMPT."
 BSH_Rec_tank_4: "경전차 2025"
 BSH_Rec_tank_4_short: "경전차 2025"
 BSH_Rec_tank_5: "경전차 2035"
 BSH_Rec_tank_5_short: "경전차 2035"
