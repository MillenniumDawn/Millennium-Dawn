 landmark_binnenhof:0 "O Binnenhof"
 landmark_binnenhof_desc:0 "O Binnenhof, histórico centro do governo holandês, é há séculos um símbolo de democracia e liderança. Coração da vida política dos Países Baixos, continua a moldar o futuro da nação enquanto preserva sua rica história."
