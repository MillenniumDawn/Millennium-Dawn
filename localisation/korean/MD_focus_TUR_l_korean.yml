l_korean:
 turkey_focus: "터키 중점 계통도"
 TUR_PKK_autonomy_idea: "쿠르디스탄 노동자당 (PKK) 저항"
 TUR_PKK_autonomy_idea_desc: "PKK를 다른 나라에 편입시키는 것은 거의 불가능할 것입니다."
 TUR_traditional_ideals: "전통적 가치"
 TUR_traditional_ideals_desc: "외래의 이념과 영향력을 거부하는 것이 우리나라가 자유롭고 독립적일 수 있는 최선의 길입니다."
 TUR_archeology_cooperation: "고고학적 협력"
 TUR_archeology_cooperation_desc: "우리는 세계의 고대 보물을 발굴하기 위해 다른 나라들과 협력하고 있습니다."
 TUR_tubitak_idea_name: "터키 과학 기술 연구 위원회"
 TUR_belgian_workers: "벨기에 과학자"
 TUR_tubitak_idea_name_desc: "우리는 연구 개발이라는 고된 일을 대신 해 줄 벨기에 과학자들을 데려왔습니다."
 TUR_islamic_legacy2: "The Caliphate's Legacy"
 TUR_islamic_legacy2_desc: "칼리파국은 우리나라에서 매우 오랜 역사를 갖게 될 것이며, 우리는 이를 강조해야 합니다. 우리는 이를 이념적 목적을 위해 우리에게 유리하게 활용할 것입니다."
 TUR_mit_reform: "터키 국가정보부 (MIT) 개혁"
 TUR_mit_reform_desc: "MIT는 민간 생활 내의 활동을 추적하도록 개편되었습니다."
 TUR_tourism: "관광업의 유입"
 TUR_tourism_desc: "최근 우리나라에 많은 관광객이 들어오고 있습니다."
 TUR_mit_coop: "터키 국가정보부 (MIT)와 협력"
 TUR_mit_coop_desc: "MIT는 이제 우리 군과 매우 긴밀하게 협력하고 있으며, 중요한 문서와 군사 정보까지 추적하고 있습니다."
 TUR_new_armed_forces: "재정비된 국군"
 TUR_new_armed_forces_desc: "우리 군은 전면적인 개혁 이후 재정비되어 다시 태어났습니다."
 TUR_airforce: "항공 계약"
 TUR_airforce_desc: "우리는 더 나은 조건을 제공받기 위해 여러 항공기 제조사와 계약을 체결했습니다."
 TUR_naval_idea_name: "터키 해군"
 TUR_naval_idea_name_desc: "튀르키예 해군은 튀르키예에 대양과 영해에서의 패권을 제공하는 임무를 맡고 있습니다."
 TUR_alawite_mili_experience: "알라위의 군사적 실전 경험"
 TUR_alawite_mili_experience_desc: "알라위파는 전투에 관해 상당한 경험을 가지고 있습니다. 그러므로 우리는 그들을 훈련시키고 우리의 방식을 가르칠 필요가 없습니다."
 TUR_our_own_experience: "터키의 군사적 실전 경험"
 TUR_our_own_experience_desc: "우리는 알라위파 부대를 전투에서 지휘하는 수단으로 튀르키예 군의 경험을 활용할 것입니다."
 TUR_service_community_name: "공동체에 대한 헌신"
 TUR_service_community_name_desc: "히즈메트는 봉사를 뜻합니다. 이러한 이유로 전 세계 사람들을 돕는 것이 우리의 의무입니다."
 TUR_revised_budgetting_name: "예산안 조정"
 TUR_revised_budgetting_name_desc: "우리는 튀르키예 국민의 현재 필요에 더 잘 부합하도록 예산을 개정했습니다."
 TUR_akp_protests: "정의개발당 (AKP) 시위"
 TUR_akp_protests_desc: "AKP 지지자들은 우리의 최근 결정에 그다지 만족하지 않으며, 이 때문에 거리로 나섰습니다."
 TUR_major_military_reform: "주요 군사 개혁"
 TUR_major_military_reform_desc: "군대는 아타튀르크의 부상 이래 사실상 같은 모습이었습니다. 군을 개혁한 것은 우리가 군을 위해 할 수 있었던 최선의 일이었으며, 이제 군은 21세기에 가공할 전력이 될 것입니다."
 TUR_religious_directorate: "The Diyanet's Role"
 TUR_religious_directorate_desc: "디야네트, 즉 우리의 종교청은 우리나라의 새롭고 현대화된 교육 체계를 위한 길을 닦을 것입니다."
 TUR_no_prime_minister: "대통령제 공화국"
 TUR_no_prime_minister_desc: "우리는 총리직을 권력에서 제거했으며, 이에 따라 튀르키예 정치는 대통령제 공화국으로 전환되었습니다."
 TUR_threat_abroad: "해외의 위협"
 TUR_threat_abroad_desc: "튀르키예는 국내를 돌아다니는 위험한 자들 때문에 위험에 처해 있을 뿐만 아니라, 국외의 악의적인 세력들도 우리에게 해를 끼치려 합니다. 우리는 이제 전쟁을 선포하지 않고도 그들의 영토에 우리 병력을 보낼 수 있으므로 이 악의적인 세력들을 바쁘게 만들 것입니다.."
 TUR_military_happy: "만족하는 군부"
 TUR_military_happy_desc: "군대는 현재 우리 정당과 정책에 §G만족§!하고 있으며, 우리에게 어떤 문제도 일으키지 않을 것입니다.\n§W--------------§!\n군대와의 입지가 §H0 아래로 떨어지거나§! §H군대 내부 파벌§!을 제거하면 이 국가 정신은 §R교체§!됩니다."
 TUR_military_anger1: "만족하지 않는 군부"
 TUR_military_anger1_desc: "군대는 현재 우리 정당과 정책에 §R불만§!을 품고 있으며, 당분간은 우리에게 어떤 문제도 일으키지 않을 것입니다.\n§W--------------§!\n군대와의 입지가 §H-50 아래로 떨어지거나§! §H0§!을 초과하면 이 국가 정신은 §R교체§!됩니다. 이 국가 정신은 §H군대 내부 파벌§!을 제거하는 경우에도 취소됩니다."
 pkk_static_modifier: "쿠르드 저항의 메아리"
 pkk_static_modifier_desc: "제1차 세계 대전이 끝나고 세브르 조약이 체결된 이래 쿠르드인들은 우리나라와는 별개로 자유롭고 독립된 자신들만의 나라를 갈망해 왔습니다. 그들이 우리나라로부터 독립하면 참담한 결과가 뒤따르겠지만, 그들을 점령하는 것 또한 득이 되지 않을 것입니다."
 kurdish_resistance_dynamic_modifier: "쿠르드 저항"
 kurdish_resistance_dynamic_modifier_desc: "제1차 세계 대전이 끝나고 세브르 조약이 체결된 이래 쿠르드인들은 우리나라와는 별개로 자유롭고 독립된 자신들만의 나라를 갈망해 왔습니다. 그들이 우리나라로부터 독립하면 참담한 결과가 뒤따르겠지만, 그들을 점령하는 것 또한 득이 되지 않을 것입니다."
 TUR_military_anger2: "불만스러운 군부"
 TUR_military_anger2_desc: "군대는 현재 우리 정당과 정책에 §R좌절감§!을 느끼고 있으며, 우리에게 몇 가지 문제를 일으키기 시작하고 있습니다.\n§W--------------§!\n군대와의 입지가 §H-100 아래로 떨어지거나§! §H-50§!을 초과하면 이 국가 정신은 §R교체§!됩니다. 이 국가 정신은 §H군대 내부 파벌§!을 제거하는 경우에도 취소됩니다."
 TUR_military_anger3: "극도로 분노한 군부"
 TUR_military_anger3_desc: "군대는 현재 우리 정당과 정책에 §R격분§!하고 있으며, 문제를 일으키고 있습니다.\n§W--------------§!\n군대와의 입지가 §H-150 아래로 떨어지거나§! §H-100§!을 초과하면 이 국가 정신은 §R교체§!됩니다. 이 국가 정신은 §H군대 내부 파벌§!을 제거하는 경우에도 취소됩니다."
 TUR_military_anger4: "충성하지 않는 군부"
 TUR_military_anger4_desc: "군대는 현재 우리 정당과 정책 때문에 §R불충§!한 상태이며, 심각한 문제를 일으키고 있습니다.\n§W--------------§!\n군대와의 입지가 §H-200 아래로 떨어지거나§! §H-150§!을 초과하면 이 국가 정신은 §R교체§!됩니다. 이 국가 정신은 §H군대 내부 파벌§!을 제거하는 경우에도 취소됩니다."
 TUR_military_anger5: "전복된 군부"
 TUR_military_anger5_desc: "군대는 현재 우리 정당의 정책과 낮은 입지 때문에 §R무력화§!되었습니다. 군대와의 입지를 높이지 않는 한 튀르키예 군은 사실상 쓸모가 없습니다.\n§W--------------§!\n군대와의 입지가 §H-200§!을 초과하면 이 국가 정신은 §R교체§!됩니다. 이 국가 정신은 §H군대 내부 파벌§!을 제거하는 경우에도 취소됩니다."
 TUR_highways: "터키의 고속도로"
 TUR_highways_desc: "우리의 도로가 무너져 내리기 시작했으며, 이 때문에 국민을 위한 새로운 고속도로 건설에 착수해야 합니다."
 TUR_guards_of_kemalism: "케말주의의 수호자"
 TUR_guards_of_kemalism_desc: "튀르키예 군은 스스로를 공화국과 그 세속적 케말주의 이상의 수호자로 여깁니다. 군은 공화국 존속 기간 동안 튀르키예 정치에 여러 차례 개입했으며, 자신들의 가치가 위협받는다고 느끼면 다시 개입할 태세입니다. 그러나 군은 개입 후에 종종 평화롭게 국민에게 권력을 돌려주었으며, 국민 또한 그것을 기대합니다.\n\n군은 §W[Nat_Populism_L]§!과 같은 비세속 정당에 반대합니다. 정부와 군의 §Y입지§!는 §G사회적 보수주의 - 정부§!와 같은 여러 요인의 영향을 받습니다. 군과의 §Y입지§!가 §Y0§! 아래로 떨어지면 군은 정부를 전복하기 위한 조치를 취할 것입니다.\n\n§Y군대§!는 또한 자신들의 권력을 줄이려는 시도에 저항하겠지만, 우리가 그들을 제거하는 데 성공한다면 더 이상 우리를 방해할 수 없을 것입니다."
 TUR_between_east_and_west: "동방과 서방 사이에서"
 TUR_between_east_and_west_desc: "튀르키예는 나토의 일원이지만, 같은 나토 동맹국인 그리스와는 가까운 경쟁 관계에 있습니다. 튀르키예는 또한 러시아와 긴밀한 경제적 관계를 맺고 있으면서도 동시에 러시아의 이익에 반하는 행동을 하고 있습니다. 강대국들 사이에서 균형을 잡으며 우리의 이익을 최우선에 두는 것이 성공의 열쇠가 될 것입니다.\n\n우리가 §Y강대국§!이나 §Y초강대국§!과 지나치게 가까운 동맹을 맺는다면, 우리는 세계 무대에서 분명하게 편을 선택한 것입니다."
 TUR_no_economic_plan: "전무한 경제 계획"
 TUR_no_economic_plan_desc: "§R우리의 §Y경기 순환§!을 §Y침체§! 이상으로 올릴 수 없습니다§!\n\n90년대 후반의 여러 차례에 걸친 정부 구성 시도, 새로 선출된 정부와 함께 이어진 군사 쿠데타, 그리고 경제 붕괴를 경고한 IMF의 경고로 인해 외국인 투자자들이 이 나라에서 빠져나가면서 수백억 달러가 경제에서 사라졌습니다. 튀르키예 경제는 사실상 외국인 투자 위에 세워져 있기 때문에 이것이 모든 경제 성장을 멈추게 했습니다.."
 TUR_economic_insecurity_name: "경제적 불안"
 TUR_economic_insecurity_name_desc: "90년대 후반의 여러 차례에 걸친 정부 구성 시도, 새로 선출된 정부와 함께 이어진 군사 쿠데타, 그리고 경제 붕괴를 경고한 IMF의 경고로 인해 외국인 투자자들이 이 나라에서 빠져나가면서 수백억 달러가 경제에서 사라졌습니다. 튀르키예 경제는 사실상 외국인 투자 위에 세워져 있기 때문에 이것이 모든 경제 성장을 멈추게 했습니다.."
 TUR_economic_security_name: "경제적 안전"
 TUR_economic_security_name_desc: "우리는 경제 안정을 회복하는 데 성공했습니다. 그러나 그럼에도 불구하고 우리가 추가적인 붕괴에서 자유로운 것은 아닙니다. 국민과 국가가 번영할 수 있도록 우리는 항상 튀르키예 경제를 감시하고 개선해 나가야 합니다."
 TUR_economic_security3: "위대한 터키의 경제"
 TUR_economic_security3_desc: "우리가 쏟은 모든 노력의 결과로 우리 경제는 이제 이전보다 커졌습니다. 이제 무슨 일이 있어도 경제가 회복하여 이전보다 더 나아질 수 있다고 안심할 수 있습니다."
 TUR_asteroid_mining: "소행성 채굴"
 TUR_asteroid_mining_desc: "우리는 소행성에서 귀금속을 우리 공장으로 가져오기 위해 소행성을 채굴하고 있습니다. 더 나은 재료는 더 나은 생산으로 이어질 것입니다."
 TUR_radicalism_destroy: "반이슬람 의제"
 TUR_radicalism_destroy_desc: "우리는 국내 이슬람주의의 성장에 맞서기 위해 반이슬람주의 의제를 추진하고 있습니다. 또한 반이슬람주의 외교를 장려하고 강경 이슬람주의 국가들과의 관계를 끊을 것입니다."
 TUR_osman_v: "오스만 5세"
 TUR_osman_v_desc: "1912년 8월 18일 이스탄불에서 태어난 오스만 5세, 다른 이름으로 에르투을 오스만은 메흐메트 부르하네딘의 아들이었습니다. 그는 종종 \\"마지막 오스만\\"으로 불리지만, 아이러니하게도 오스만골루 가문의 귀환 이후 이제 오스만 왕위의 계승자들이 존재합니다."
 TUR_mit_reformed: "터키 국가정보부 (MIT) - 국내 우선"
 TUR_mit_reformed_desc: "MIT는 대외 문제보다 국내 문제에 더 집중할 것입니다."
 TUR_mit_emboldened: "터키 국가정보부 (MIT) - 해외 우선"
 TUR_mit_emboldened_desc: "MIT는 우리나라 밖에서 벌어지는 일에 더 신경 쓸 것입니다."
 TUR_government_led_disasters: "정부 주도 계획"
 TUR_government_led_disasters_desc: "정부가 자선 단체 대신 자연재해를 겪은 사람들에게 지원을 제공할 것이며, 자선 단체가 원한다면 돕는 것도 자유입니다."
 TUR_refugees_maintained: "난민 유지"
 TUR_refugees_maintained_desc: "우리는 난민들을 추방하는 대신 그들을 수용하고 노동력으로 활용하기로 했습니다."
 TUR_drugs_illegalized: "마약 불법화"
 TUR_drugs_illegalized_desc: "의료 목적 외의 어떤 목적으로든 마약을 사용하는 사람은 법의 처벌을 받게 됩니다."
 TUR_drugs_legalized: "마약 합법화"
 TUR_drugs_legalized_desc: "우리는 사람들이 무엇을 위해 마약을 쓰든 별로 상관하지 않습니다. 어차피 그들의 삶이니까요."
 TUR_nationalist_advantage: "민족주의의 통합"
 TUR_nationalist_advantage_desc: "우리는 통치 능력을 추가로 높이기 위해 민족주의를 활용하고 있으며, 이는 특정 정책을 추진하기 쉽게 만듭니다."
 TUR_fight_nationalist: "민족주의에 대항"
 TUR_fight_nationalist_desc: "민족주의는 위험한 세력이며, 우리나라에 혼란과 불안정을 초래할 수 있습니다."
 TUR_turkish_media_unctrolled2: "터키 언론 - §C감사 진행중§!"
 TUR_turkish_media_unctrolled2_desc: "현재 우리 언론은 조사를 받고 있으며, 가까운 시일 내에 개혁이 이루어질 것입니다."
 TUR_party_rumours: "정당의 소문"
 TUR_party_rumours_desc: "§R우리는 수동으로 §W[socialism_L]§! 측의 인기도를 증가시킬 수 없습니다§!\n\n총리 뷜렌트 에제비트는 이미 고령에 접어들었고, 그의 건강이 악화되고 있다는 소문이 돌고 있습니다. 또한 부총리인 휘사메틴 외즈칸이 에제비트의 건강과 비효율적인 행정을 이유로 §W[socialism_L]§! 출신 국회의원들과 함께 그를 축출하려 한다는 소문또한 퍼지고 있습니다. 이런 정당 내부의 소문과 불협화음은 정부가 제대로 기능하는데 있어 독이 되고 있습니다.\n\n우리는 사전에 휘사메틴 외즈칸을 대중들 앞에 공개적으로 비판받게 한 뒤 그가 정당을 사퇴하도록 유도할 수 있지만 그는 다른 국회의원들을 데리고 함께 나갈 것입니다. 반대로 그냥 아무 조치도 하지 않고 부디 이 상황이 소문 그 이상이 아니기를 바라며 기다릴 수도 있습니다."
 TUR_reformed_airforce: "개선된 공군"
 TUR_reformed_airforce_desc: "공군은 하늘에서 더 잘 작전하고 적에 대한 제공권을 유지할 수 있도록 개편되었습니다."
 TUR_PKK_insurgency_ceasefire: "쿠르디스탄 노동자당 (PKK) 반란 - 휴전"
 TUR_PKK_insurgency_ceasefire_desc: "§R§W[Neutral_Communism_L]§!의 인기도를 높일 수 없습니다§!\n\nPKK는 70년대부터 쿠르드인의 더 큰 자치를 위해 싸워 온 좌익 쿠르드 반군 조직입니다. 양측 모두 서로에 대한 승리를 거두기 위해 테러 전술에 가담해 왔습니다.\n\n현재 PKK는 일방적인 휴전을 선언한 상태입니다.\n\n-평화 프로세스와 협상은 휴전이 유지되는 동안에만 계속될 수 있습니다\n-휴전은 우리가 전력을 모으고 PKK에 대한 기습 공격을 준비할 수 있게 해 줍니다."
 TUR_PKK_insurgency_active: "쿠르디스탄 노동자당 (PKK) 반란 - 활동중"
 TUR_PKK_insurgency_active_desc: "§R§W[Neutral_Communism_L]§!의 인기도를 높일 수 없습니다§!\n\nPKK는 70년대부터 쿠르드인의 더 큰 자치를 위해 싸워 온 좌익 쿠르드 반군 조직입니다. 양측 모두 서로에 대한 승리를 거두기 위해 테러 전술에 가담해 왔습니다.\n\n현재 PKK는 정부에 맞서 적극적으로 싸우고 있습니다.\n\n-평화 프로세스와 협상은 휴전이 유지되는 동안에만 계속될 수 있습니다\n-휴전은 우리가 전력을 모으고 PKK에 대한 기습 공격을 준비할 수 있게 해 줍니다."
 TUR_kurdish_trouble_name: "쿠르드 갈등"
 TUR_kurdish_trouble_name_desc: "우리나라 동부는 PKK와의 수십 년에 걸친 전투로 인해 사실상 활발한 전장입니다.§W\n------------\n§!우리는 §H쿠르디스탄을 연방화§!하거나 해당 시스템을 통해 §HPKK 반란§!을 격파함으로써 이 국가 정신을 제거할 수 있습니다."
 TUR_kurdish_trouble3_name: "쿠르드 중재"
 TUR_kurdish_trouble3_name_desc: "우리나라 동부는 PKK와의 수십 년에 걸친 전투로 인해 사실상 활발한 전장입니다.§W\n------------\n§!우리는 §H디야르바키르를 연방화§!함으로써 이 약화 효과를 제거하거나 수정할 수 있습니다."
 TUR_kurdish_trouble5_name: "끝나지 않는 전쟁"
 TUR_kurdish_trouble5_name_desc: "우리나라 동부는 PKK와의 수십 년에 걸친 전투로 인해 사실상 활발한 전장입니다.§W\n------------\n§!우리는 §H끝없는 전쟁§! 중점 경로를 완료함으로써 이 약화 효과를 수정할 수 있습니다."
 TUR_mafia_active: "터키 마피아 - §R활동중§!"
 TUR_mafia_active_desc: "우리나라의 마피아는 수년간 범죄를 조직해 왔으며, 시민들의 일상생활을 방해하고 있습니다. 현재 우리 거리는 어느 정도 안전하지만 이상적이지는 않습니다.§W\n------------\n§!우리는 §H마피아의 세력을 30 이하로 낮춘§! 뒤 가능해지는 §H결정§!을 수행함으로써 마피아를 제거할 수 있습니다. 또한 §H마피아§! 중점도 완료해야 합니다."
 TUR_mafia_active2: "터키 마피아 - §R의식됨§!"
 TUR_mafia_active2_desc: "우리나라의 마피아는 수년간 범죄를 조직해 왔으며, 시민들의 일상생활을 방해하고 있습니다. 현재 우리 거리는 어느 정도 안전하지만 이상적이지는 않습니다.§W\n------------\n§!우리는 §H마피아의 세력을 30 이하로 낮춘§! 뒤 가능해지는 §H결정§!을 수행함으로써 마피아를 제거할 수 있습니다."
 TUR_mafia_weakened: "터키 마피아 - §G약화됨§!"
 TUR_mafia_weakened_desc: "우리나라의 마피아는 수년간 범죄를 조직해 왔으며, 시민들의 일상생활을 방해하고 있습니다. 현재 우리 거리는 어느 정도 안전하지만 이상적이지는 않습니다.§W\n------------\n§!우리는 §H마피아의 세력을 30 이하로 낮춘§! 뒤 가능해지는 §H결정§!을 수행함으로써 마피아를 제거할 수 있습니다."
 TUR_mafia_weak: "터키 마피아 - §G미미함§!"
 TUR_mafia_weak_desc: "우리나라의 마피아는 수년간 범죄를 조직해 왔으며, 시민들의 일상생활을 방해하고 있습니다. 현재 우리 거리는 어느 정도 안전하지만 이상적이지는 않습니다.§W\n------------\n§!우리는 §H마피아의 세력을 30 이하로 낮춘§! 뒤 가능해지는 §H결정§!을 수행함으로써 마피아를 제거할 수 있습니다."
 TUR_neo_ottomanism: "신오스만주의"
 TUR_neo_ottomanism_desc: "신오스만주의는 정부가 인접국에 영향력을 행사하고 튀르키예의 영향력을 외부로 확장할 수 있도록 해 준 공격적인 튀르키예 외교 정책의 한 형태입니다."
 TUR_zero_problems: "외교적 \"제로 프라블럼 (Zero Problems)\" 정책"
 TUR_zero_problems_desc: "무문제 정책은 정부가 협력과 투자를 통해 인접국에 영향력을 행사할 수 있게 해 주는 평화적인 튀르키예 외교 정책의 한 형태입니다."
 TUR_turkish_media_unctrolled: "터키 마피아 - §R통제 불가능§!"
 TUR_turkish_media_unctrolled_desc: "현재 우리 언론은 정부의 통제나 영향력에서 완전히 자유로우며, 이는 장차 몇 가지 문제를 일으킬 수 있습니다."
 TUR_win_over_workers: "노동자들에게 귀를 기울여라"
 TUR_win_over_workers_desc: "우리는 공장 노동자들에게 호소하고 있으며, 이로 인해 그들은 우리 정부를 더 기꺼이 지지합니다."
 TUR_no_disasters_plan: "무재난 (No Disaster) 계획"
 TUR_no_disasters_plan_desc: "현재 우리 정부에는 재난 대비 계획이 없으며, 이는 재난이 발생할 때마다 우리가 대비하지 못한 상태임을 의미합니다."
 TUR_charity_disasters: "Charity Run Plan"
 TUR_charity_disasters_desc: "우리의 재난 대응 계획은 어려움에 처한 사람들을 돕기 위해 시민들의 친절과 기부에 의존합니다."
 TUR_government_led_disaster: "정부 주도 계획"
 TUR_government_led_disaster_desc: "재난 대비 계획을 다른 단체에 위탁하는 대신 정부가 계획을 수립하고 자금을 지원할 것입니다."
 TUR_turkish_media_restricted: "터키 언론 - §G통제됨§!"
 TUR_turkish_media_restricted_desc: "우리는 위험한 이념의 확산을 막기 위해 언론에 실릴 수 있는 내용을 제한하고 있습니다."
 TUR_turkish_media_unrestricted: "터키 언론 - §G자유로움§!"
 TUR_turkish_media_unrestricted_desc: "언론은 원하는 대로 할 수 있으나, 잠재적 재난을 막기 위한 약간의 점검 장치가 마련되어 있습니다."
 TUR_turkish_cyberspace: "터키의 사이버 공간"
 TUR_turkish_cyberspace_desc: "점점 더 많은 시민들이 인터넷을 사용하고 있으며, 이는 우리가 무슨 일이 벌어지고 있는지 100% 확신할 수 없음을 의미합니다. 사이버 공간을 제한할지 여부를 결정해야 합니다."
 TUR_turkish_cyberspace_restricted: "사이버 공간 통제"
 TUR_turkish_cyberspace_restricted_desc: "우리는 사이버 공간을 제한하여 더 안전하게 사용할 수 있도록 하기로 했습니다."
 TUR_turkish_cyberspace_unrestricted: "자유로운 사이버 공간"
 TUR_turkish_cyberspace_unrestricted_desc: "국민이 인터넷에서 무엇을 하기로 선택하든 우리가 상관할 바가 아닙니다."
 TUR_erdonomics_name: "에르도안의 경제"
 TUR_erdonomics_name_desc: "에르도노믹스는 좋든 나쁘든 튀르키예 경제에 전면적인 개혁을 가져온 에르도안의 경제 정책을 가리킵니다."
 TUR_gulenist_economic_advisors: "귤렌 (Gülen) 경제학자"
 TUR_gulenist_economic_advisors_desc: "우리는 모든 경제 문제에 관해 정부에 자문할 경제학자들을 고용했습니다."
 TUR_gulenist_intelligence_network: "귤렌 (Gülen) 정보망"
 TUR_gulenist_intelligence_network_desc: "우리는 귤렌주의자들이 전 세계에 퍼져 있다는 사실을 활용하여 정보를 수집합니다."
 TUR_gulenist_intelligence_network2: "귤렌 (Gülen) 정보망"
 TUR_gulenist_intelligence_network2_desc: "우리는 귤렌주의자들이 전 세계에 퍼져 있다는 사실을 활용하여 정보를 수집합니다."
 TUR_unban_erdogan: "§H정치에서 에르도안 해방§!"
 TUR_unban_erdogan_desc: "에르도안은 오랫동안 정치 활동이 금지되어 왔으나, 이제 AKP가 승리를 확보했으므로 그의 금지를 해제할 때입니다."
 TUR_gulenist_educators: "귤렌식 교육"
 TUR_gulenist_educators2: "고급 귤렌주의 교육"
 TUR_gulenist_educators_desc: "우리는 교육 개선에 중점을 두었으며, 할 수 있는 동안 귤렌의 가르침을 퍼뜨려야 합니다."
 TUR_mobilise_the_faithful_soldiers: "충성의 동원"
 TUR_mobilise_the_faithful_soldiers_desc: "귤렌 운동이 동원되었습니다. 우리는 모든 구성원이 튀르키예로 이주하여 나라를 더 강하게 만들도록 장려하고 있습니다."
 TUR_mobilise_the_faithful_soldiers2: "충성의 동원"
 TUR_mobilise_the_faithful_soldiers2_desc: "귤렌 운동이 동원되었습니다. 우리는 모든 구성원이 튀르키예로 이주하여 나라를 더 강하게 만들도록 장려하고 있습니다."
 TUR_rise_of_fp: "[Conservative_L]의 성장"
 TUR_rise_of_fp_desc: "튀르키예는 오랫동안 세속 국가였으나, 점점 더 많은 사람들이 이슬람의 더 많은 전통이 사회에 되돌아오기를 바라고 있습니다. 많은 사람들이 케말주의 정당들의 반종교에 가까운 태도에 분노하고 있습니다."
 TUR_attacking_mafia1: "마피아 공격"
 TUR_attacking_mafia1_desc: "우리는 마피아와 그 구성원들과 활발한 분쟁을 벌이고 있습니다."
 TUR_attacking_mafia2: "마피아에게 피해를"
 TUR_attacking_mafia2_desc: "우리는 마피아와 그 구성원들과 활발한 분쟁을 벌이고 있으며, 우리가 이기고 있습니다."
 TUR_village_institutes: "마을 기관"
 TUR_village_institutes_desc: "작은 마을 출신 학생들은 교사로 교육받은 뒤 그 마을로 돌아가 가르칩니다. 마을 학교는 많은 실용 과목을 가르치는 직업 학교의 한 유형이며, 학생들은 다양한 정치 서적을 읽도록 장려됩니다."
 TUR_incentivised_farming: "최첨단 농업"
 TUR_incentivised_farming_desc: "농업 생산자와 구매자에게 세금 면제가 제공되고 있으며, 농업 방식에는 첨단 장비와 빅데이터가 적용되고 있습니다."
 TUR_PKK_active_foreign: "쿠르디스탄 노동당‎ (PKK) 활동"
 TUR_PKK_active_foreign_desc: "쿠르드 반군 조직이 이 나라에서 기지를 운영하거나 연계 조직을 지원하고 있습니다."
 TUR_ciw_disasters: "CIW 재난구조위원회"
 TUR_ciw_disasters_desc: "CIW가 우리에게 재난 구호를 제공하고 있습니다."
 TUR_ciw_infrastructure: "CIW 기반시설 지원"
 TUR_ciw_infrastructure_desc: "CIW가 우리나라의 기반시설 건설을 지원하고 있습니다."
 TUR_ciw_education: "CIW 교육 지원"
 TUR_ciw_education_desc: "CIW가 우리나라의 교육에 자금을 지원하고 있습니다."
 TUR_ciw_population: "CIW 의료 지원"
 TUR_ciw_population_desc: "CIW가 우리나라에 필요한 의료 물자를 제공하고 있습니다."
 TUR_ciw_industry: "CIW 산업 지원"
 TUR_ciw_industry_desc: "CIW가 우리나라의 산업 부문을 지원하고 있습니다."
 TUR_heavily_subsidised_agriculture: "막대한 보조금의 농업"
 TUR_heavily_subsidised_agriculture_desc: "저리 대출과 보조금이 지급되는 연료 및 기계 구매는 대규모 농업 부문을 보장하지만 예산에 부담을 줍니다."
 TUR_communal_farms: "집단농장"
 TUR_communal_farms_desc: "전국에 소규모 공동 농장이 세워지고 있습니다. 이는 사람들을 시골 지역의 보다 정주적인 생활 방식으로 이끄는 동시에 지역 공동체의 생존력을 높이고 있습니다."
 TUR_educating_revolutionaries: "혁명적 교육"
 TUR_educating_revolutionaries_desc: "교육에 혁명적 가르침을 접목하여 청년들에게 튀르키예를 가장 잘 발전시키는 방법을 가르칩니다."
 TUR_committees_of_resistance_patrol: "저항 위원회"
