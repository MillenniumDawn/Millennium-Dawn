 ukraine_nuclear_power_plants.1.name: "Arrêt définitif de la centrale nucléaire de Tchernobyl"
 ukraine_nuclear_power_plants.1.desc: "Le 29 mars 2000, le Cabinet des ministres de l'Ukraine a décidé de déclasser prématurément l'unité de puissance n°3 et de fermer définitivement la centrale nucléaire de Tchernobyl avant la fin de l'année 2000.\nLe 15 décembre 2000, le réacteur n°3 a été arrêté après avoir fonctionné brièvement depuis mars 1999 suite à près de trois mois de réparations, et la centrale dans son ensemble a cessé de produire de l'électricité.\nUne nouvelle structure de confinement en acier nommée §Yle Nouveau Confinement Sécurisé§! est prévue pour remplacer le sarcophage vieillissant et construit à la hâte qui protégeait le réacteur n°4 ruiné.\nCe §YNouveau Confinement Sécurisé§! doit être financé par un fonds international géré par la Banque européenne pour la reconstruction et le développement, et a été conçu et construit par le consortium Novarka sous direction française."
 ukraine_nuclear_power_plants.1.a: "Arrête ça pour toujours"
 ukraine_nuclear_power_plants_flag: "La centrale nucléaire de Tchernobyl est fermée."
 ukr_history.1.t: "La disparition de Gueorgui Gongadzé"
 ukr_history.1.d: "Gueorgui Gongadzé, fondateur du journal en ligne Ukrainska Pravda et l'un des critiques les plus acerbes de l'administration présidentielle, a disparu à Kiev. Sa mère a déposé une plainte pour disparition ; ses collègues disent déjà ouvertement que le pouvoir est derrière l'affaire. Si un corps est retrouvé, cela ne restera pas une affaire de police."
 ukr_history.1.a: "Laisser la police s'en occuper comme d'habitude."
 ukr_history.1.b: "Ordonner une véritable enquête et tenir la presse informée."
 ukr_history.2.t: "Le scandale des cassettes"
 ukr_history.2.d: "Depuis la tribune de la Rada suprême, le leader socialiste Oleksandr Moroz a fait entendre des enregistrements réalisés dans le bureau même du président par un membre de la garde d'État, Mykola Melnytchenko. Sur les bandes, une voix ressemblant à celle du président exige que l'on s'occupe de Gongadzé. Du jour au lendemain, Moroz est passé d'un politicien de gauche en déclin au visage de l'opposition."
 ukr_history.2.a: "Tout nier et mettre en doute les bandes."
 ukr_history.2.b: "Ne rien dire et attendre que la tempête passe."
 ukr_history.3.t: "L’Ukraine sans Koutchma"
 ukr_history.3.d: "Un camp de protestation permanent est apparu sur la place de l'Indépendance. Cela a commencé avec cinquante personnes et, en deux jours, il y en avait des dizaines de milliers. Pour la première fois, la gauche, le centre et les nationalistes se tiennent sur la même place sous le même slogan. Les organisateurs disent qu'ils ne partiront pas tant que le président n'aura pas démissionné."
 ukr_history.3.a: "Les ignorer ; le froid fera le travail."
 ukr_history.3.b: "Ouvrir des négociations avec le comité de protestation."
 ukr_history.4.t: "Les affrontements de la rue Bankova"
 ukr_history.4.d: "Une colonne de dix à quinze mille personnes a marché sur l'administration présidentielle à l'anniversaire de la naissance de Chevtchenko. La rue Bankova a connu les pires combats de rue depuis l'indépendance. Le soir, la police avait détruit le quartier général de l'UNA-UNSO et des centaines de personnes étaient arrêtées. Le camp sur la place a disparu, mais aussi toute prétention que ce gouvernement gouverne par consentement."
 ukr_history.4.a: "So be it."
 ukr_history.5.t: "La Rada renvoie le gouvernement Iouchtchenko"
 ukr_history.5.d: "Deux cent soixante-trois députés ont voté la censure du cabinet de Viktor Iouchtchenko. Communistes et centre oligarchique ont voté ensemble : la gauche haïssait ses réformes de marché, les groupes d'affaires haïssaient qu'il ait stoppé les schémas de troc dans le secteur énergétique. Le Premier ministre le plus populaire de l'histoire du pays quitte ses fonctions la réputation intacte et sans plus de fonction pour la perdre."
 ukr_history.5.a: "So be it."
 ukr_history.6.t: "Iouchtchenko annonce un bloc"
 ukr_history.6.d: "Le Premier ministre destitué a déclaré qu'il mènerait un bloc électoral aux législatives de l'an prochain. Dix partis nationaux-démocrates et libéraux négocient déjà la liste. Le bloc n'a encore ni programme ni structure, mais il a ce qu'aucune autre force n'a : un chef en qui la plupart du pays a encore confiance."
 ukr_history.6.a: "So be it."
 ukr_history.7.t: "Pour une Ukraine unie !"
 ukr_history.7.d: "Cinq partis du pouvoir ont été rassemblés en un seul bloc électoral autour du président : les Démocrates du peuple, l'Ukraine du Travail, le Parti des régions, les Agrariens et les Industriels. Ce qui les unit n'est pas l'idéologie mais la ressource administrative — gouverneurs, inspecteurs fiscaux et télévision d'État. On a dit aux barons régionaux quel résultat on attend d'eux."
 ukr_history.7.a: "So be it."
 ukr_history.8.t: "Les législatives de 2002"
 ukr_history.8.d: "Le bloc de Iouchtchenko a pris la première place sur la liste des partis avec vingt-trois pour cent. Pour l'Ukraine unie n'a obtenu qu'à peine douze — puis a ramassé une centaine de sièges dans les circonscriptions uninominales, où les gouverneurs décident ce que disent les urnes. Les communistes ont perdu la moitié de leurs voix. Six forces entrent dans la nouvelle Rada."
 ukr_history.8.a: "So be it."
 ukr_history.9.t: "Lytvyn élu président"
 ukr_history.9.d: "Après deux mois d'impasse, le chef de l'administration présidentielle, Volodymyr Lytvyn, a été élu président de la Rada suprême. L'opposition avait le plus grand nombre de voix dans le pays ; le président les avait dans l'hémicycle. Lytvyn passera les années suivantes comme l'homme dont les deux camps ont besoin et dont aucun ne se fie."
 ukr_history.9.a: "So be it."
 ukr_history.10.t: "Pour une Ukraine unie se dissout"
 ukr_history.10.d: "Le bloc qui a gagné les circonscriptions s'est brisé en ses composantes. Neuf factions distinctes siègent désormais là où il n'y en avait qu'une : le Parti des régions, l'Ukraine du Travail, les Démocrates du peuple, les Agrariens et le reste, chacun avec son chef et son prix. Le groupe de Donetsk est le plus grand et n'est plus le cadet de personne."
 ukr_history.10.a: "So be it."
 ukr_history.11.t: "Debout, Ukraine !"
 ukr_history.11.d: "Au deuxième anniversaire de la disparition de Gongadzé, l'opposition a ramené ses partisans dans la rue — cette fois avec Iouchtchenko, Tymochenko, Moroz et Symonenko sur la même tribune. Les quatre n'ont presque rien en commun sauf l'exigence que le président parte. Les tentes se relèvent sur le Khrechtchatyk."
 ukr_history.11.a: "So be it."
 ukr_history.12.t: "La mort de Slava Stetsko"
 ukr_history.12.d: "Iaroslava Stetsko, veuve de l'homme qui proclama la restauration de l'État ukrainien à Lviv en 1941 et lien vivant entre la clandestinité nationaliste de guerre et le parlement d'aujourd'hui, est morte à quatre-vingt-trois ans. Le Congrès des nationalistes ukrainiens doit désormais trouver un chef qui ne soit pas un symbole."
 ukr_history.12.a: "So be it."
 ukr_history.13.t: "Ianoukovytch prend le Parti des régions"
 ukr_history.13.d: "Le Premier ministre a été élu président du Parti des régions. Jusqu'ici le parti n'était qu'un groupe d'affaires de Donetsk parmi d'autres ; dès aujourd'hui il est le bras politique de l'homme auquel le président entend laisser le fauteuil. Les gens de Rinat Akhmetov s'installent dans les structures régionales du parti."
 ukr_history.13.a: "So be it."
 ukr_history.14.t: "Tarassiouk prend le Mouvement populaire"
 ukr_history.14.d: "Borys Tarassiouk, l'ancien ministre des Affaires étrangères qui négocia la charte avec l'OTAN, a été élu chef du Rukh. Le parti qui a fait l'indépendance n'est plus qu'un petit caucus professionnel de diplomates et d'intellectuels, et il a décidé que son avenir est à l'intérieur du bloc de Iouchtchenko plutôt qu'à ses côtés."
 ukr_history.14.a: "So be it."
 ukr_history.15.t: "L'Espace économique unique"
 ukr_history.15.d: "Le président a signé à Yalta l'accord sur un Espace économique unique avec la Russie, la Biélorussie et le Kazakhstan. Le texte parle d'une union douanière et d'une commission supranationale où les voix sont pondérées par la taille économique — ce qui veut dire que Moscou décide. La Rada l'a ratifié avec les voix des communistes et du parti du pouvoir ensemble."
 ukr_history.15.a: "Le signer — l'est paie nos factures."
 ukr_history.15.b: "Le signer, mais ne ratifier que le chapitre du libre-échange."
 ukr_history.16.t: "La Cour ouvre la porte à un troisième mandat"
 ukr_history.16.d: "La Cour constitutionnelle a jugé que le premier mandat du président, accompli sous l'ancienne constitution, ne compte pas. Il pourra se représenter l'an prochain. Personne à Kiev ne croit que les juges sont parvenus seuls à cette conclusion, et personne ne croit qu'il s'en servira vraiment — mais l'arrêt a dit à l'opposition exactement à quoi elle a affaire."
 ukr_history.16.a: "So be it."
 ukr_history.17.t: "Le Parti social-national devient Svoboda"
 ukr_history.17.d: "Lors de son congrès à Lviv, le Parti social-national d'Ukraine s'est rebaptisé Union pansukrainienne Svoboda, a retiré le Wolfsangel de sa bannière et a élu Oleh Tiahnybok comme chef. La rhétorique a été poncée et le parti vise désormais des électeurs qui n'auraient jamais rejoint une organisation paramilitaire."
 ukr_history.17.a: "So be it."
 ukr_history.18.t: "La réforme politique échoue à six voix"
 ukr_history.18.d: "L'amendement constitutionnel qui aurait transformé la présidence en fonction cérémonielle a manqué six voix. Les gens du président le voulaient comme police d'assurance contre une défaite électorale ; le camp de Iouchtchenko l'a rejeté parce qu'il s'attend à gagner le fauteuil tel qu'il est. Les deux camps viennent de dire au pays ce qu'ils pensent de leurs chances."
 ukr_history.18.a: "So be it."
 ukr_history.19.t: "Lytvyn prend les Agrariens"
 ukr_history.19.d: "Le président du parlement a été élu à la tête du Parti agraire, qui se rebaptise Parti agraire du peuple. Lytvyn se construit une machine dans les villages — la seule partie du pays où ni le groupe de Donetsk ni le camp orange n'ont grand-chose à offrir."
 ukr_history.19.a: "So be it."
 ukr_history.20.t: "La Force du peuple"
 ukr_history.20.d: "Iouchtchenko et Tymochenko ont signé un accord de coalition. Elle se retire de la course présidentielle et fait campagne pour lui ; s'il gagne, elle devient Première ministre. Deux camps qui ont passé trois ans à se disputer le même vote de protestation ont décidé que l'un devait être le candidat et l'autre le gouvernement."
 ukr_history.20.a: "So be it."
 ukr_history.21.t: "Iouchtchenko expulse Tiahnybok"
 ukr_history.21.d: "Après un discours sur une tombe de partisans dans les Carpates où Tiahnybok a loué ceux qui avaient combattu « les Moskali, les Allemands, les Youpins », Notre Ukraine l'a exclu de sa faction parlementaire. Iouchtchenko a protégé sa campagne d'une citation fatale et a offert à Svoboda le martyre dont elle avait besoin pour devenir un parti à part entière."
 ukr_history.21.a: "So be it."
 ukr_history.22.t: "L'empoisonnement"
 ukr_history.22.d: "Le candidat de l'opposition a été emmené dans une clinique à Vienne. Le diagnostic est un empoisonnement à la dioxine à une concentration mille fois supérieure à la normale, administré lors d'un dîner avec le chef adjoint du service de sécurité. Il survivra, son visage non. Il revient en campagne défiguré, et chaque électeur voit désormais ce qu'on lui a fait."
 ukr_history.22.a: "Parler d'intoxication alimentaire et passer à autre chose."
 ukr_history.22.b: "Ouvrir une affaire pénale et la laisser suivre son cours."
 ukr_history.23.t: "Le premier tour"
 ukr_history.23.d: "Trente-neuf pour cent pour le candidat de l'opposition, trente-neuf pour le Premier ministre — un écart de quelques dixièmes de pour cent. Le vote communiste s'est effondré d'un quart du pays à cinq pour cent, absorbé par les deux pôles. Tous les autres sont hors jeu. Trois semaines avant le second tour."
 ukr_history.23.a: "So be it."
 ukr_history.24.t: "La Rada déclare le second tour invalide"
 ukr_history.24.d: "Trois cent sept députés ont voté que le second tour n'avait pas reflété la volonté des électeurs, et deux cent vingt-neuf ont voté la censure du gouvernement. Ni l'un ni l'autre vote n'est juridiquement contraignant. Tous deux ont dit aux services de sécurité et aux administrations régionales d'où venait le vent, ce qui était le but."
 ukr_history.24.a: "So be it."
 ukr_history.25.t: "Tihipko quitte la campagne"
 ukr_history.25.d: "Le gouverneur de la Banque nationale et directeur de campagne du Premier ministre a démissionné de la campagne et de la banque. L'Ukraine du Travail, le parti de Dnipropetrovsk qu'il a bâti avec Viktor Pintchouk, se désintègre derrière lui tandis que ses députés cherchent un terrain plus sûr."
 ukr_history.25.a: "So be it."
 ukr_history.26.t: "La Cour suprême annule le second tour"
 ukr_history.26.d: "La Cour suprême a déclaré le second tour invalide et ordonné un nouveau scrutin pour le 26 décembre. Pour la première fois, un tribunal ukrainien a tranché une élection présidentielle contre le candidat du sortant, et la décision a été lue en direct devant une place pleine de monde."
 ukr_history.26.a: "So be it."
 ukr_history.27.t: "Loi 2222 — le vote-paquet"
 ukr_history.27.d: "Le compromis a été voté en un seul paquet : le nouveau scrutin en échange de la réforme constitutionnelle. À partir de 2006, le parlement nomme le gouvernement et le président conserve les affaires étrangères et la défense. Quiconque gagne cette élection gagnera un fauteuil plus petit que celui pour lequel il se battait."
 ukr_history.27.a: "So be it."
 ukr_history.28.t: "Notre Ukraine devient un parti"
 ukr_history.28.d: "Le bloc qui a gagné la présidence a tenu son congrès fondateur en un parti unique : l'Union populaire Notre Ukraine. Roman Bezsmertnyï, directeur de campagne du président, prend la présidence. Plusieurs des dix partis membres ont refusé de s'y dissoudre, et la coalition qui a fait la révolution est déjà un parti plus petite qu'en décembre."
 ukr_history.28.a: "So be it."
 ukr_history.29.t: "Le camp orange se brise"
 ukr_history.29.d: "Le président a renvoyé tout le gouvernement. Le chef du conseil de sécurité a accusé le cercle de la Première ministre de corruption à la télévision en direct ; elle a répondu que l'entourage du président était le problème. Huit mois après la place, les deux personnes qui y étaient ensemble se battent l'une contre l'autre."
 ukr_history.29.a: "Tous les renvoyer et recommencer."
 ukr_history.29.b: "Garder la Première ministre et limoger plutôt les accusateurs."
 ukr_history.30.t: "Le mémorandum avec Ianoukovytch"
 ukr_history.30.d: "Incapable de confirmer un nouveau Premier ministre avec les seules voix orange, le président a signé un mémorandum d'entente avec l'homme qu'il a battu. Le Parti des régions s'abstient, Iouriï Iekhanourov est confirmé à trois voix près, et les affaires pénales contre les responsables électoraux s'arrêtent discrètement. La révolution a acheté son propre gouvernement aux gens qu'elle a renversés."
 ukr_history.30.a: "So be it."
 ukr_history.31.t: "Les législatives de 2006"
 ukr_history.31.d: "La première élection entièrement proportionnelle. Le Parti des régions a pris trente-deux pour cent, le Bloc Tymochenko vingt-deux, Notre Ukraine quatorze — troisième place pour le parti du président un an après sa victoire. Socialistes et communistes se sont faufilés. Personne n'a la majorité et tout le monde a un veto."
 ukr_history.31.a: "So be it."
 ukr_history.32.t: "La coalition des forces démocratiques"
 ukr_history.32.d: "Après trois mois, les partenaires orange ont signé : le Bloc Tymochenko, Notre Ukraine et les socialistes, deux cent quarante-trois voix, avec Tymochenko Première ministre. L'accord a pris plus de temps à rédiger que le gouvernement n'en durera."
 ukr_history.32.a: "So be it."
 ukr_history.33.t: "Moroz prend le perchoir"
 ukr_history.33.d: "Le chef socialiste a été élu président de la Rada avec les voix du Parti des régions et des communistes — les deux partis qu'il a passés six ans à dénoncer. La coalition orange s'est effondrée le même après-midi. En un jour, la Coalition anticrise existait et Moroz était devenu l'homme le plus haï dans la moitié du pays."
 ukr_history.33.a: "So be it."
 ukr_history.34.t: "L'Universel d'unité nationale"
 ukr_history.34.d: "Le président a signé une déclaration de principes avec la Coalition anticrise et nommé Premier ministre l'homme qu'il a battu en 2004. Notre Ukraine rejoint le gouvernement que les électeurs de Notre Ukraine croyaient avoir vaincu. Vingt mois après la place, Ianoukovytch est de retour dans le bâtiment dont on l'avait jeté."
 ukr_history.34.a: "Signer — l'alternative est une autre élection."
 ukr_history.34.b: "Refuser et dissoudre la Rada maintenant."
 ukr_history.35.t: "Notre Ukraine passe dans l'opposition"
 ukr_history.35.d: "Le parti du président a quitté le gouvernement qu'il a rejoint il y a deux mois. Ses ministres démissionnent, ses députés passent aux bancs de l'opposition, et on dit au pays que l'Universel d'unité nationale était un malentendu. La Coalition anticrise n'a pas besoin d'eux et le dit."
 ukr_history.35.a: "So be it."
 ukr_history.36.t: "Réformes et Ordre rejoint le Bloc Tymochenko"
 ukr_history.36.d: "Les libéraux de marché de Viktor Pynzenyk, qui ont passé les années quatre-vingt-dix à rédiger chaque programme de réforme sérieux que le pays a ignoré, se sont fondus dans le Bloc Tymochenko. L'aile libérale du camp orange n'existe plus comme adresse séparée."
 ukr_history.36.a: "So be it."
 ukr_history.37.t: "La coalition achète sa majorité"
 ukr_history.37.d: "La Coalition anticrise s'est rebaptisée Coalition d'unité nationale et a commencé à ramasser un par un les députés des bancs de l'opposition, à un prix dont personne ne discute en public. À trois cents voix, elle peut passer outre le président et réécrire la constitution. Il lui en manque onze."
 ukr_history.37.a: "So be it."
 ukr_history.38.t: "Le président dissout la Rada"
 ukr_history.38.d: "Plutôt que de voir la coalition atteindre les trois cents, le président a dissous le parlement par décret. La coalition dit que le décret est inconstitutionnel et continue de siéger. Pendant deux mois, le pays a deux autorités légitimes, trois présidents de la Cour constitutionnelle et un ministère de l'Intérieur qui n'obéit à personne en particulier."
 ukr_history.38.a: "Les dissoudre — c'est cela ou perdre le fauteuil."
 ukr_history.38.b: "Accepter la coalition et garder les pouvoirs qui restent."
 ukr_history.39.t: "Notre Ukraine — Autodéfense populaire"
 ukr_history.39.d: "Le parti du président entre dans l'élection anticipée au sein d'un bloc plus large avec l'Autodéfense populaire de Iouriï Loutsenko, bâtie à partir des officiers du ministère de l'Intérieur qu'il a emmenés. Neuf partis sur une liste, tenus ensemble par la peur de courir séparément."
 ukr_history.39.a: "So be it."
 ukr_history.40.t: "Le Bloc Lytvyn"
 ukr_history.40.d: "L'ancien président de la Rada a enregistré son propre bloc pour l'élection anticipée. Il n'a ni programme digne d'être lu ni ennemis dignes d'être nommés, ce qui est le but : quel que soit le vainqueur, Lytvyn entend être les voix qui lui manquent."
 ukr_history.40.a: "So be it."
 ukr_history.41.t: "Le Congrès des nationalistes ukrainiens se retire"
 ukr_history.41.d: "Incapable de franchir seul le seuil de trois pour cent et refusé sur la liste de Notre Ukraine, le Congrès des nationalistes ukrainiens a annoncé qu'il ne contestait pas l'élection. Le plus vieux parti nationaliste du pays laisse le champ à Svoboda."
 ukr_history.41.a: "So be it."
 ukr_history.42.t: "Medvedchuk recule"
 ukr_history.42.d: "Le Parti social-démocrate (uni), autrefois la machine qui faisait tourner l'administration présidentielle, a remplacé Viktor Medvedtchouk par Iouriï Zahorodniy. Le parti sonde sous un pour cent. Son ancien chef ne se retire pas de la politique — il change de pays pour la pratiquer."
 ukr_history.42.a: "So be it."
 ukr_history.43.t: "L'élection anticipée"
 ukr_history.43.d: "Le Parti des régions a pris trente-quatre pour cent et a perdu quand même : le Bloc Tymochenko est monté à trente et un, et avec Notre Ukraine-Autodéfense populaire le camp orange a deux cent vingt-sept sièges. Une majorité de deux."
 ukr_history.43.a: "So be it."
 ukr_history.44.t: "La coalition orange, encore"
 ukr_history.44.d: "Le Bloc Tymochenko et Notre Ukraine-Autodéfense populaire ont signé un accord de coalition avec une majorité de deux voix. Tous les concernés savent que deux voix, ce n'est pas une majorité, c'est une prise d'otages."
 ukr_history.44.a: "So be it."
 ukr_history.45.t: "Tymochenko revient au cabinet"
 ukr_history.45.d: "Au deuxième essai, et d'une seule voix, la Rada a confirmé Ioulia Tymochenko Première ministre. Elle promet de rendre l'épargne perdue dans l'effondrement soviétique et de reprivatiser ce qui a été volé. Le président qui l'a nommée a déjà commencé à chercher comment l'écarter."
 ukr_history.45.a: "So be it."
 ukr_history.46.t: "Baloha construit le United Center"
 ukr_history.46.d: "Le chef du secrétariat présidentiel a transformé un parti dormant en Centre uni et a commencé à y faire basculer les réseaux régionaux du président. Officiellement il soutient le président. En pratique c'est une police d'assurance contre Notre Ukraine, et tout Notre Ukraine le sait."
 ukr_history.46.a: "So be it."
 ukr_history.47.t: "La coalition est déclarée morte"
 ukr_history.47.d: "Notre Ukraine-Autodéfense populaire a quitté après que le Bloc Tymochenko a voté avec le Parti des régions pour réduire les pouvoirs présidentiels. Le président de la Rada a annoncé depuis la tribune que la coalition avait cessé d'exister. Trente jours pour en construire une nouvelle ou affronter une autre élection."
 ukr_history.47.a: "So be it."
 ukr_history.48.t: "L'élection qui n'a jamais eu lieu"
 ukr_history.48.d: "Le président a de nouveau dissous le parlement et fixé un scrutin au 7 décembre. Il n'y a pas d'argent au Trésor pour le payer, les tribunaux ont bloqué le décret, et la crise financière mondiale est arrivée le même mois. L'élection est discrètement abandonnée."
 ukr_history.48.a: "So be it."
 ukr_history.49.t: "La crise arrive"
 ukr_history.49.d: "La hryvnia a perdu presque la moitié de sa valeur face au dollar depuis l'été. Les exportations d'acier, qui payaient tout, se sont effondrées avec la demande mondiale. Le gouvernement a signé pour seize milliards de dollars du Fonds et les conditions attachées seront payées par des gens qui n'ont jamais vu le boom."
 ukr_history.49.a: "Prendre l'argent du Fonds et ses conditions."
 ukr_history.49.b: "Refuser les conditions et imprimer ce qu'il nous faut."
 ukr_history.50.t: "Le président prend son parti"
 ukr_history.50.d: "Avec une cote d'approbation à un chiffre, le président a enfin pris formellement la direction de Notre Ukraine. C'est une tentative de sauvetage d'un parti qui a perdu ses structures régionales au Centre uni et ses électeurs à tout le monde."
 ukr_history.50.a: "So be it."
 ukr_history.51.t: "La coalition avec Lytvyn"
 ukr_history.51.d: "Une nouvelle majorité a été assemblée : le Bloc Tymochenko, Notre Ukraine-Autodéfense populaire et le Bloc Lytvyn, avec Lytvyn de retour au perchoir comme prix. Vingt députés décident désormais qui gouverne le pays."
 ukr_history.51.a: "So be it."
 ukr_history.52.t: "La guerre du gaz"
 ukr_history.52.d: "Pendant dix-neuf jours en janvier, le transit s'est arrêté et la moitié de l'Europe a eu froid. La Première ministre a volé à Moscou et signé personnellement un contrat de dix ans, sans l'accord du président et sans sa propre délégation dans la pièce. La formule de prix de ce contrat sera utilisée contre elle jusqu'à la fin de sa carrière."
 ukr_history.52.a: "Signer — le pays ne peut pas geler."
 ukr_history.52.b: "Tenir pour une meilleure formule."
 ukr_history.53.t: "Svoboda remporte Ternopil"
 ukr_history.53.d: "Lors d'une élection anticipée au conseil régional de Ternopil, Svoboda a pris trente-cinq pour cent et la première place. Un parti qui sondait sous un pour cent au niveau national il y a deux ans dirige désormais une région. La Galicie a cessé de voter pour les partis orange et a commencé à voter contre tout le monde."
 ukr_history.53.a: "So be it."
 ukr_history.54.t: "La pire année"
 ukr_history.54.d: "La production industrielle est en baisse d'un tiers, l'économie se contractera de quinze pour cent cette année, et les arriérés de salaires sont de retour pour la première fois depuis les années quatre-vingt-dix. Quiconque gagnera l'élection présidentielle en janvier héritera d'un pays qui a cessé de croire que les cinq dernières années en valaient la peine."
 ukr_history.54.a: "So be it."
 ukr_history.55.t: "Tihipko revient"
 ukr_history.55.d: "L'ancien banquier central a rebaptisé le Parti du travail d'Ukraine en Ukraine forte et se présente à la présidence sur la compétence plutôt que sur la langue ou l'histoire. Il ne gagnera pas, mais le tiers de l'électorat qui ne veut d'aucun des deux camps a enfin une adresse."
 ukr_history.55.a: "So be it."
 ukr_history.56.t: "Le premier tour de 2010"
 ukr_history.56.d: "Ianoukovytch trente-cinq pour cent, Tymochenko vingt-cinq, Tihipko treize, Iatseniouk sept. Le président sortant a pris cinq virgule quatre — le pire résultat qu'un président en exercice ait jamais enregistré nulle part. La révolution orange a été votée dehors par ceux qui l'ont faite."
 ukr_history.56.a: "So be it."
 ukr_history.57.t: "Stabilité et réformes"
 ukr_history.57.d: "La nouvelle majorité a été assemblée par une méthode que la constitution n'autorise pas de façon évidente : des députés individuels rejoignant une coalition plutôt que des factions entières. La Cour constitutionnelle la bénira dans le mois. Mykola Azarov devient Premier ministre et le Parti des régions tient à la fois la présidence, le gouvernement et la Rada."
 ukr_history.57.a: "So be it."
 ukr_history.58.t: "Azarov prend la présidence du parti"
 ukr_history.58.d: "Ianoukovytch passé à la présidence, le Premier ministre a formellement pris le Parti des régions. Le parti n'est plus qu'une extension du cabinet, et les groupes d'affaires de Donetsk qui l'ont bâti collectent leur part de l'État."
 ukr_history.58.a: "So be it."
 ukr_history.59.t: "Le Front du changement de Iatseniouk"
 ukr_history.59.d: "Après une honorable quatrième place à l'élection présidentielle, Arseniy Iatseniouk a transformé sa campagne en parti. Front du changement offre une compétence technocratique et l'intégration européenne aux électeurs qui en ont fini avec les deux camps de 2004."
 ukr_history.59.a: "So be it."
 ukr_history.60.t: "La Cour défait 2004"
 ukr_history.60.d: "La Cour constitutionnelle a jugé la réforme politique de 2004 inconstitutionnelle pour des motifs de procédure et a restauré du jour au lendemain la constitution de 1996. Le président qui a pris ses fonctions sous une république parlementaire gouverne désormais une république présidentielle, sans qu'un seul vote ait été pris à la Rada."
 ukr_history.60.a: "So be it."
 ukr_history.61.t: "Les élections locales"
 ukr_history.61.d: "Le Parti des régions a pris le sud et l'est et la plus grande partie du centre. En Galicie, Svoboda est arrivé premier dans les trois conseils régionaux. Notre Ukraine a été effacé de la carte qu'il avait dessinée en 2004, et l'espace qu'il occupait appartient désormais à un parti qui était à un pour cent il y a trois ans."
 ukr_history.61.a: "So be it."
 ukr_history.62.t: "Le Maïdan fiscal"
 ukr_history.62.d: "Petits commerçants et entrepreneurs ont remis des tentes sur la place de l'Indépendance contre le nouveau code fiscal. Il n'y a pas de drapeaux de parti sur la place et les organisateurs ont demandé aux politiciens de rester à l'écart. Le président a opposé son veto aux pires dispositions et le camp a été évacué de nuit quand même."
 ukr_history.62.a: "Veto au code et évacuer la place."
 ukr_history.62.b: "Faire passer le code inchangé."
