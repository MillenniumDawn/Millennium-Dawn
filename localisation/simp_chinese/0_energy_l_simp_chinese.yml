 renewable_01: "基础太阳能板"
 renewable_01_desc: "晶体硅电池板将阳光转化为电力，无需燃料，也没有运动部件。它们价格昂贵，光电转换率仅略高于十分之一，但它们首次将太阳能电力带到了屋顶和偏远地区。"
 renewable_02: "风力涡轮机技术进步"
 renewable_02_desc: "更大的转子、变速发电机和更优的空气动力学设计，将单台涡轮机的输出功率推向兆瓦级，使风电场从示范项目推广为向电网提供商业供电。"
 renewable_03: "高效光伏"
 renewable_03_desc: "更纯的硅料与更优的电池设计将光伏板效率推向20%，而规模更大的工厂则降低了每块组件的成本。公用事业级太阳能电站开始与屋顶系统并肩出现。"
 renewable_04: "复合材料风力叶片"
 renewable_04_desc: "玻璃纤维与碳纤维叶片比早期设计更轻、更硬，因此转子可以做得更长而不会弯曲撞上塔架。更长的叶片扫过更多空气，使涡轮机在更微弱的风中也能持续转动。"
 renewable_05: "薄膜光伏技术"
 renewable_05_desc: "薄膜电池将几微米厚的光吸收材料铺在玻璃或柔性薄片上。它们只使用硅片原材料的一小部分并能快速涂覆大面积表面，从而大幅降低太阳能电站的成本。"
 renewable_06: "海上风电场"
 renewable_06_desc: "在海上建造的涡轮机能够捕捉到比陆地上任何地点都更强劲、更稳定的风能。专用的安装船和固定基础使开发商能够在远离海岸的地方建造由数百台涡轮机组成的风电场。"
 renewable_07: "双面太阳能板"
 renewable_07_desc: "双面电池板能收集两面的光线，既能捕捉直射阳光，也能捕获地面反射的阳光。与跟随太阳轨迹的追踪器结合安装，能在不增加用地的情况下提升太阳能农场的发电量。"
 renewable_08: "先进风电机控制"
 renewable_08_desc: "叶片传感器和激光雷达可提前感知转子前方的风况，使涡轮机在阵风到来之前调整桨距和偏航角。整个风电场作为一个系统统一调度，使得前排涡轮机不再抢占后排涡轮机的风能。"
 renewable_09: "钙钛太阳能板"
 renewable_09_desc: "钙钛化合物层叠在硅之上，捕获了硅单独无法利用的光谱部分，使光伏板效率突破30%。这些叠层在低温下由廉价材料制成，因此性能提升几乎不增加制造成本。"
 renewable_10: "潮汐发电厂"
 renewable_10_desc: "锚定在潮汐通道中的涡轮机依靠潮流的涨落运转，其时间表可提前数年预知。潮汐能为电网提供一种不依赖天气的可再生电力供应。"
 renewable_11: "扩展潮汐发电"
 renewable_11_desc: "漂浮平台和更密集的涡轮阵列将潮汐能扩展到狭窄水道之外的开阔沿海水域。共享海底电缆和标准模块使每个新阵列都比上一个更便宜。"
 renewable_12: "火山能源电厂"
 renewable_12_desc: "在活火山附近钻探的水井能够汲取被岩浆加热的水，其温度远超传统地热田。其中一口这样的水井所能提供的电力，可达普通地热钻孔的数倍之多。"
 renewable_13: "软流层虹吸"
 renewable_13_desc: "沿活动断层带开凿的深钻孔，可抵达软流圈中炽热、部分熔融的岩石。从此深度汲取的热量永不枯竭，只要地壳薄到足以钻透，便随处可得。"
 fuel_efficiency_01: "先进内燃机工程"
 fuel_efficiency_01_desc: "分级燃烧器与对空气和燃料混合更严格的控制，使锅炉能更充分地燃烧燃料。我们的电厂将能从每一分煤、每一分天然气中获取更多电力。"
 fuel_efficiency_02: "整体煤气化联合循环"
 fuel_efficiency_02_desc: "整体煤气化联合循环电厂将煤转化为合成气，去除其中的杂质，先在燃气轮机中燃烧，再通过蒸汽循环回收废热。这种两级设计能从相同的燃料中榨取多得多的电力。"
 fuel_efficiency_03: "高效低排放技术"
 fuel_efficiency_03_desc: "超超临界发电厂的蒸汽在超临界和超超临界温度与压力下运行。更热的蒸汽意味着每吨燃料能产生更多电力，且每兆瓦时排放的二氧化碳更少。"
 fuel_efficiency_04: "碳捕集与封存整合"
 fuel_efficiency_04_desc: "碳捕集装置从工厂废气中去除二氧化碳，并将其注入深层岩层封存。将捕集设计融入工厂整体生产流程，可将其能耗保持在最低水平。"
 fuel_efficiency_05: "AI优化与监控"
 fuel_efficiency_05_desc: "机器学习模型读取数千个工厂传感器数据，每秒调整燃料流量、空气供应和涡轮负荷，在部件损坏前很久就标记出磨损情况，使我们的工厂能更长时间保持接近峰值效率运行。"
 fuel_efficiency_06: "近零排放化石燃料电厂"
 fuel_efficiency_06_desc: "富氧燃烧技术在纯氧环境中燃烧燃料，废气主要由水蒸气和近乎纯净的二氧化碳组成，易于捕获。如今，我们的化石燃料发电厂几乎不再向大气排放任何物质。"
 fuel_efficiency_07: "量子计算燃烧优化"
 fuel_efficiency_07_desc: "量子计算机逐分子模拟燃烧化学过程，这是经典计算机只能近似处理的。工程师利用这些结果来设计燃料、催化剂和燃烧器，使每单位燃料释放出更多能量。"
 fuel_efficiency_08: "AGI统筹"
 fuel_efficiency_08_desc: "通用人工智能将我们的发电站作为一个统一的国家机组群进行统筹管理，从燃料采购、维护团队到电网调度无不涵盖。负荷始终转移到当时燃烧燃料效率最高的发电厂。"
 fuel_efficiency_09: "专用燃料纳米纤维"
 fuel_efficiency_09_desc: "纳米纤维隔热层包裹着锅炉、管道和涡轮机外壳，将热量保留在循环系统内，使其仍能产生蒸汽。经由发电厂墙壁泄漏的能量减少，因此每批燃料有更多部分能到达发电机。"