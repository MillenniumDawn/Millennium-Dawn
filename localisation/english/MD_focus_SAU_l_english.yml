 SAU_miteb_reign_3: "From Father to Son"
 SAU_miteb_reign_3_loc: "[SAU.GetFlag]From Father to Son\nWeekly Stability: §G+0.50%§!\n§HExpected Welfare Spending:§! §G-1.00§!\n§HExpected Healthcare Spending:§! §G-1.00§!\n\n"
 SAU_miteb_son_of_abdullah_01: "Miteb's Guard"
 SAU_miteb_son_of_abdullah_01_desc: "Prince Miteb's command of the Saudi Arabian National Guard gives him a power base no other prince can match. The kingdom watches what he does with it."
 SAU_modern_kingdom: "§HThe Modern Kingdom§!"
 SAU_modern_kingdom_desc: "Whatever path the §LHouse of Saud§! chose, the kingdom has §Hsurvived its succession crisis§!. The throne is secure. The oil flows. The pilgrims come. The §Lcrown of King Abdulaziz§! still rests on the head of his sons - or grandsons - and the world still must reckon with §LRiyadh§!."
 SAU_modernisation_balance_of_power_category_cat: "§HKingdom's Future§!"
 SAU_muqrin_air_force_loyal: "§HThe Air Force Stands With the King§!"
 SAU_muqrin_air_force_loyal_desc: "When the Sudairis grumble about Muqrin's legitimacy, the §LRSAF§! commander publicly pledges loyalty. F-15s overfly Riyadh in formation. The message is §Hclear§!: the king has the §Lguns§!."
 SAU_muqrin_buy_loyalty: "§HBuy the Senior Princes§!"
 SAU_muqrin_buy_loyalty_desc: "Stipends are doubled. Old debts forgiven. Land grants in the Hejaz. Muqrin understands what every Saudi king has understood: §Lthe family is bought before it is ruled§!. He §Hpays generously§!."
 SAU_muqrin_consensus_rule: "§HConsensus Rule§!"
 SAU_muqrin_consensus_rule_desc: "Muqrin governs by §Lpatience and patronage§!. Every major decision passes through the §LCouncil of Senior Princes§! and the §LAllegiance Council§!. The kingdom moves slowly - but it moves §Htogether§!."
 SAU_muqrin_intel_network: "§HCall on the GID Network§!"
 SAU_muqrin_intel_network_desc: "Muqrin spent §L7 years§! running the §LGeneral Intelligence Directorate§!. Every senior officer in the kingdom owes him a favor - or fears one. He calls in those debts §Hone by one§!."
 SAU_muqrin_oil_steady: "§HSteady Oil Policy§!"
 SAU_muqrin_oil_steady_desc: "No price wars. No production cuts that humiliate OPEC. Muqrin keeps the taps open at §Lmoderate volumes§! and lets prices find their level. The treasury fills §Hquietly§!. The shale producers in §LTexas§! grumble but survive."
 SAU_muqrin_old_pilots: "§HRally the Air Force Old Guard§!"
 SAU_muqrin_old_pilots_desc: "Muqrin was a §LLightning§! pilot in the §L1960s§!. He flew with the men who became today's air marshals. The §LRSAF§! becomes his personal power base - quiet, professional, §Hdevoted§!."
 SAU_muqrin_quiet_legacy: "§HA Quiet Legacy§!"
 SAU_muqrin_quiet_legacy_desc: "Muqrin will be remembered as the §Lking who did not start a war§!. No Vision 2030. No NEOM. No Ritz-Carlton purge. Just a kingdom that §Hsurvived§! - intact, sovereign, and at peace with its neighbors. Some princes call that the highest art of rule."
 SAU_muqrin_tribal_pact: "§HA New Tribal Pact§!"
 SAU_muqrin_tribal_pact_desc: "Muqrin convenes the great desert sheikhs at §LJanadriyah§!. Old oaths are renewed. New stipends are pledged. The §LAjman§!, the §LMutair§!, the §LShammar§!, the §LQahtan§! - all swear §Hbayah§!."
 SAU_muqrin_yemen_normalize: "§HNormalize Yemen§!"
 SAU_muqrin_yemen_normalize_desc: "The Yemen ceasefire holds. Aid convoys cross the border. §LSanaa§! and §LRiyadh§! exchange ambassadors for the first time in years. The §Lgreat Arab tragedy§! becomes a §Gquiet§! reconciliation."
 SAU_muqrin_yemen_truce: "§HBroker a Yemen Truce§!"
 SAU_muqrin_yemen_truce_desc: "Drawing on his Yemeni heritage, Muqrin opens §Lback-channel§! talks with the §LHouthi§! leadership. A §Lconditional ceasefire§! is reached. The war freezes. The kingdom's southern border §Gquiets§!."
 SAU_muqrin_yemeni_outreach: "§HReach Out to the Yemeni Tribes§!"
 SAU_muqrin_yemeni_outreach_desc: "Muqrin's mother was Yemeni. He has spent his life living down that fact - now he weaponizes it. Tribal sheikhs from §LSadah§! and §LMarib§! are received in Riyadh. The §LHouthis§! are offered §Lback-channel§! talks."
