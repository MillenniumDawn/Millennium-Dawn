 FRA_knds_franco_german_synthesis: "Synthèse franco-allemande"
 FRA_knds_european_champion: "Champion industriel européen"
 FRA_knds_fg_partnership: "Partenariat franco-allemand"
 FRA_knds_fg_partnership_desc: "La holding KANT de 2015 a unifié Krauss-Maffei Wegmann et Nexter sous une propriété franco-allemande à 50-50, regroupant deux champions nationaux en une seule base industrielle."
 FRA_knds_kant_holding: "Intégration de KANT Holding"
 FRA_knds_kant_holding_desc: "Des équipes d'ingénierie transfrontalières, un achat harmonisé et des services administratifs partagés réduisent le coût de faire tourner deux maisons de défense héritées en parallèle."
 FRA_knds_embt: "Démonstrateur EMBT"
 FRA_knds_embt_desc: "L'Enhanced Main Battle Tank marie une tourelle Leclerc à une caisse Leopard 2, préfigurant la philosophie hybride du futur système de combat terrestre principal."
 FRA_knds_joint_rnd: "Pool commun de R&D"
 FRA_knds_joint_rnd_desc: "Les budgets de recherche franco-allemands combinés accélèrent des pistes parallèles en blindage, électronique et matériaux énergétiques qu'aucune des deux firmes ne pourrait poursuivre seule."
 FRA_knds_mgcs_modular: "Architecture modulaire MGCS"
 FRA_knds_mgcs_modular_desc: "Le Main Ground Combat System est conçu comme une famille multi-plateformes à modules interchangeables pour la protection, la puissance de feu et la guerre électronique, remplaçant Leopard 2 et Leclerc d'ici les années 2040."
 FRA_knds_mgcs_integration: "Intégration des systèmes MGCS"
 FRA_knds_mgcs_integration_desc: "Le MGCS intègre une ossature numérique partagée, une gestion de combat dérivée de SCORPION et une fusion capteurs commune aux formations blindées franco-allemandes."
 FRA_knds_turret_leadership: "Leadership de la tourelle (suivant)"
 FRA_knds_turret_leadership_desc: "La conception des tourelles, l'autoloader et la fabrication des canons se concentrent sous les anciennes équipes Nexter, s'appuyant sur l'expertise Leclerc."
 FRA_knds_hull_leadership: "Leadership de coque (KMW)"
 FRA_knds_hull_leadership_desc: "La caisse, le groupe motopropulseur et le train de roulement se concentrent sous les anciennes équipes KMW, tirant parti de l'expérience structurelle Leopard 2 et Puma."
 FRA_knds_nato_standardisation: "Standardisation de l'artillerie de l'OTAN"
 FRA_knds_nato_standardisation_desc: "KNDS fournit à l'Agence OTAN de soutien et d'acquisition des munitions 155 mm conformes STANAG, positionnant l'entité fusionnée comme fournisseur d'artillerie par défaut de l'Europe."
 FRA_knds_rch155: "Obusier télécommandé RCH-155"
 FRA_knds_rch155_desc: "Le RCH-155 monte une tourelle 155 mm automatisée sur un châssis Boxer, tirant en mouvement jusqu'à 54 kilomètres avec un équipage de deux personnes."
 FRA_knds_leopard_sustainment: "Maintien en puissance de la flotte Leopard 2"
 FRA_knds_leopard_sustainment_desc: "La logistique unifiée, la production de pièces et la rénovation de la flotte Leopard 2 relèvent de l'entité fusionnée, offrant à KNDS un flux de maintenance de plusieurs décennies en Europe."
 FRA_knds_boxer_puma: "Intendance des boxeurs et des pumas"
 FRA_knds_boxer_puma_desc: "Le VTT modulaire Boxer et le VCI Puma restent des programmes menés par KMW, désormais adossés au poids industriel combiné de KNDS."
 FRA_knds_bonus_katana: "Munitions BONUS & KATANA"
 FRA_knds_bonus_katana_desc: "Les obus BONUS à fusée capteur et KATANA guidés élargissent le portefeuille d'artillerie de précision de KNDS, désormais commercialisé comme une seule ligne paneuropéenne."
 FRA_knds_export_leadership: "Leadership à l'export"
 FRA_knds_export_leadership_desc: "Une posture d'export agressive courtise les acheteurs du Golfe, d'Asie du Sud-Est et d'Europe de l'Est avec des lots blindés, d'artillerie et de munitions."
 FRA_knds_strategic_autonomy: "Autonomie stratégique"
 FRA_knds_strategic_autonomy_desc: "Une doctrine « national d'abord » réserve les meilleurs créneaux de production et les technologies sensibles aux forces franco-allemandes, renforçant l'autonomie stratégique européenne face aux ventes de marché ouvert."
