 SAU_events.141.t:0 "Black February"
 SAU_events.141.d:0 "On the twenty-fifth of February the Tadawul All Share Index closed at 20,634 and then stopped climbing. It has not stopped falling since.\n\nThis is not a crash of banks and institutions. Something close to half the adult population of the Kingdom was in that market - teachers, drivers, soldiers, civil servants - many of them holding shares bought on borrowed money at prices no earnings could ever justify. Brokerage floors were opened in shopping centres. Women traded from segregated rooms. It was, for two years, the national pastime.\n\nBy the time the index finds its floor it will have shed something near two thirds of its value, and several hundred billion riyals of household savings with it. The Capital Market Authority is three years old and has never seen anything like this. The Council must decide whether the state catches the falling knife, or lets the market teach the lesson it is teaching."
 SAU_events.141.a:0 "Let the market find its own floor."
 SAU_events.141.b:0 "The state will buy. We cannot let this become politics."
 SAU_events.142.t:0 "Oil Price Collapse"
 SAU_events.142.d:0 "The price of a barrel is falling and shows no sign of stopping. The budget was written on assumptions that no longer hold, and every ministry is about to discover which of its programmes were affordable and which were merely funded. \nRiyadh has been here before. In the early 1980s it cut its own production to hold the price up, watched every other producer quietly sell into the gap it had left, and saw Saudi output fall by roughly three quarters while the price collapsed anyway. The lesson was expensive and is still argued over in the Ministry.\nThe Kingdom holds the cheapest barrels on earth. That is the only real advantage it has, and it can be spent defending the price for everybody, or spent outlasting the producers who cannot afford to sell at these numbers."
 SAU_events.142.a:0 "Cut production. Defend the price."
 SAU_events.142.b:0 "Hold output. Let the expensive producers break first."
 SAU_black_february_idea:0 "Black February"
 SAU_black_february_idea_desc:0 "The Tadawul has lost two thirds of its value and taken a generation of household savings with it. Everyone knows somebody who was ruined, and everyone knows the state watched it happen."
 SAU_black_february_bailout_idea:0 "The February Intervention"
 SAU_black_february_bailout_idea_desc:0 "State funds went into the market to slow the fall, and slow it they did. The Treasury is lighter, the small investors are merely poor rather than destroyed, and a precedent has been set that the Kingdom will find expensive to keep."
 SAU_oil_price_collapse_idea:0 "Oil Price Collapse"
 SAU_oil_price_collapse_idea_desc:0 "The barrel is worth a fraction of what the budget assumed. Export revenue has fallen through the floor, the welfare bill has not, and the difference is being made up out of reserves."
 SAU_oil_defend_price_idea:0 "Defending the Price"
 SAU_oil_defend_price_idea_desc:0 "The Kingdom has cut its own production to hold the price up. It steadies, and every barrel Riyadh is not selling is being sold cheerfully by somebody else. The price recovers before the market share does - if the market share recovers at all."
 SAU_oil_market_share_idea:0 "Defending the Market Share"
 SAU_oil_market_share_idea_desc:0 "The taps stay open and the price goes where it likes. Saudi crude is the cheapest in the world to lift, and the Kingdom intends to still be pumping when the high-cost producers have finished going bankrupt."
 SAU_events.143.t:0 "Riyadh: The Tadawul Collapses"
 SAU_events.143.d:0 "The Saudi stock exchange has lost the greater part of its value in a matter of months, erasing several hundred billion riyals of household wealth. Unusually for a market of this size, the losses fall almost entirely on ordinary Saudis rather than institutions - schoolteachers, drivers and civil servants who bought at the peak, many of them on credit. Analysts abroad are noting that the world's largest oil exporter has just discovered it also has a retail investor class, and no idea what to do with one."
 SAU_events.143.a:0 "A hard lesson in an expensive classroom."
 SAU_events.144.t:0 "The Price of Oil Collapses"
 SAU_events.144.d:0 "The price of crude has fallen through every floor the analysts drew for it. Exporting states are rewriting budgets balanced on assumptions now visibly worthless, while importers enjoy a windfall they are careful not to celebrate too loudly. Every eye is on Riyadh, which holds the cheapest barrels on earth and therefore the only decision that matters: cut production and hold the price up for everybody, or keep pumping and find out who breaks first."
 SAU_events.144.a:0 "The barrel decides, as it always does."
 SAU_events.145.t:0 "The Unequal Cuts"
 SAU_events.145.d:0 "The reserves are draining and the budget will not close. Subsidies go first, then the capital projects, and now the Ministry of Finance has come for the defence line.\n\nThe difficulty is that the Kingdom does not have one army. It has the regular forces under the Ministry of Defence, and it has the National Guard - recruited from the loyal tribes of the interior, garrisoned around Riyadh and the oil fields, answering to the throne directly. The Guard exists because Abdulaziz's sons did not trust the army, and it has been paid accordingly ever since.\n\nThe cuts can fall on both, or the Guard can be protected and the regular officers can be told to make do. One of those choices keeps the throne safe this year. The other keeps it safe in ten."
 SAU_events.145.a:0 "Protect the Guard. It is what guards us."
 SAU_events.145.b:0 "Both services will bear it equally."
 SAU_events.146.t:0 "The Order to Deploy"
 SAU_events.146.d:0 "The austerity has reached the street. There are crowds in Qatif and Dammam, and smaller ones in Riyadh that the ministries insist are not crowds at all.\n\nThe National Guard is the instrument for this - it always has been, that is the whole point of it - and the Guard is ready, funded and willing. The regular officer corps has not been asked, and is watching very carefully to see who is asked.\n\nEvery colonel in the Ministry of Defence understands what it means if the Guard is sent in while their own units sit unpaid in barracks. It means the throne has decided which army it trusts, in public, permanently."
 SAU_events.146.a:0 "Send in the Guard. Clear the streets."
 SAU_events.146.b:0 "Nobody deploys. Find the money and buy the peace."
 SAU_events.147.t:0 "The Officers Decide"
 SAU_events.147.d:0 "It is settled, then. The Guard is paid and trusted; the army is neither. The men who fly the aircraft, command the armour and hold the border have been told, without anyone quite saying it, that they are the second army in their own country.\n\nThere is precedent for what happens next. In 1969 a conspiracy of air force and army officers - Nasserist, Hejazi, tired of being ruled by a family - came within an intelligence report of overthrowing Faisal. Hundreds were arrested. The Kingdom drew the lesson that the regular forces could not be trusted, built the Guard higher, and never asked why the officers had wanted it in the first place.\n\nThe staff have been meeting for some weeks. They are not discussing budgets any more."
 SAU_events.147.a:0 "Move on Riyadh. The Guard will not have time to react."
 SAU_events.147.b:0 "Not this. We are soldiers, not politicians."
 SAU_events.148.t:0 "Riyadh: Armour in the Streets"
 SAU_events.148.d:0 "Saudi regular army units moved into Riyadh before dawn and hold the ministries, the broadcasting authority and the approaches to the royal palaces. National Guard barracks were surrounded in the same hour and have not resisted. A Supreme Military Council has announced that it is restoring public order and that the constitutional position of the throne is unchanged - a formula that observers note can be read several ways.\n\nAramco reports normal loading at Ras Tanura. That is the only sentence in the entire dispatch that the oil markets are reading."
 SAU_events.148.a:0 "The Kingdom has a new government."
 SAU_army_grievance_up_tt:0 "§RResentment in the officer corps§!: $RIGHT|+=0$"
 SAU_army_grievance_small_tt:0 "§HResentment in the officer corps§! rises slightly"
 SAU_army_grievance_down_tt:0 "§GResentment in the officer corps§! falls"
 SAU_coup_unlocked_tt:0 "§RThe officer corps will move against the throne§!"
 SAU_coup_gate_tt:0 "The officer corps must have resolved to move against the throne"
 SAU_grievance_contained_label:0 "§GContained§!"
 SAU_grievance_contained_effect:0 "The officer corps has no complaint it would put in writing."
 SAU_grievance_restive_label:0 "§HRestive§!"
 SAU_grievance_restive_effect:0 "§R-2% division organisation§!. Grumbling in the messes, nothing more."
 SAU_grievance_bitter_label:0 "§YBitter§!"
 SAU_grievance_bitter_effect:0 "§R-5% division organisation, -5% army experience gain§!. Officers are requesting transfers and not getting them."
 SAU_grievance_mutinous_label:0 "§OMutinous§!"
 SAU_grievance_mutinous_effect:0 "§R-8% division organisation, -5% army morale, -3% stability§!. The staff have stopped pretending the meetings are about budgets."
 SAU_grievance_brink_label:0 "§RAt the Brink§!"
 SAU_grievance_brink_effect:0 "§R-12% division organisation, -10% army morale, -5% stability§!. Whatever the officers decide, they have decided it already."
 SAU_grievance_contained:0 "Officer Corps: Contained"
 SAU_grievance_restive:0 "Officer Corps: Restive"
 SAU_grievance_bitter:0 "Officer Corps: Bitter"
 SAU_grievance_mutinous:0 "Officer Corps: Mutinous"
 SAU_grievance_brink:0 "Officer Corps: At the Brink"
 SAU_Military_Rule:0 "Military Rule"
 SAU_Military_Rule_desc:0 "The Supreme Military Council governs the Kingdom. The throne remains, the ministries answer elsewhere, and the officers who took Riyadh are discovering that holding a country is considerably harder than seizing one."
 SAU_events.149.t:0 "Al-Jumhuriya"
 SAU_events.149.d:0 "The throne is finished. The Council has the ministries, the broadcasting authority and the approaches to every palace in Riyadh, and it has discovered what every junta discovers: seizing a country takes a night, and governing one takes a name.\nA republic must be proclaimed, and a republic must be proclaimed as something. The officers in the room do not agree on what. Some served alongside Iraqis and Syrians and came home admiring the Ba'ath - one Arab nation, one party, the army as its spine. Others point east to Qatif and the Eastern Province and argue that the only mass constituency the Kingdom has ever suppressed is the one that would carry a republic on its shoulders. A younger faction, the ones sent abroad to study, want a constitution and a parliament and the word republic to mean what it means everywhere else. And a handful, quieter than the rest, have been reading things the Mabahith would once have arrested them for.\nWhatever is announced tonight, it will be announced in the name of the Saudi people, and none of them have been asked."
 SAU_events.149.a:0 "Proclaim an Arab Socialist Republic."
 SAU_events.149.b:0 "Proclaim an Islamic Republic."
 SAU_events.149.c:0 "Proclaim a Constitutional Republic."
 SAU_events.149.e:0 "Proclaim a People's Republic."
 SAU_Military_take_over_desc:0 "The armour moved before dawn, and by breakfast the ministries, the broadcasting authority and every approach to the palaces were held by men in Saudi uniform. In 1969 an air force conspiracy came within an intelligence report of doing this to Faisal, and the Kingdom spent fifty years building a second army so it could never happen again. It happened anyway, and it was the second army that was surrounded."
 SAU_Monarchy_under_military_rule_desc:0 "The King is alive, in his palace, and photographed weekly. He signs what is placed before him because the alternative has not been described to him and does not need to be. A throne without an army is a chair, and the Council has the army."
 SAU_Install_loyalist_in_government_military_desc:0 "Every ministry that matters acquires a serving officer at the second desk - not the minister, never the minister, simply the man whose signature the files now also require. The civil service adapts within a fortnight. It has been adapting to princes for seventy years."
 SAU_Disband_the_national_guard_desc:0 "This is what the coup was actually for. The Guard was raised from the loyal tribes of the interior to stand between the throne and the regular army, it was paid better for doing it, and it has just been surrounded in its own barracks. Its regiments are dissolved and its men are offered places in the army that came for them - which most will take, because the alternative is unemployment in a country with no other work."
 SAU_proclaim_the_republic_aljumhuria_desc:0 "Al-Jumhuriya. The word has been unsayable in this country since it was founded, and the Council is about to broadcast it. Whatever follows the word will be argued over for a generation, but the throne does not survive the sentence."
 SAU_Regency_decree_desc:0 "A decree, signed by the King, transferring the executive and the defence portfolio to a Council acting in his name during his indisposition. The indisposition is not specified and the decree carries no expiry. It is the most polite document ever produced at gunpoint."
 SAU_Maritical_law_issues_desc:0 "Assembly, movement between provinces and the printing press pass under military authority. The Kingdom has never had a constitution to suspend, which the Council's lawyers note is a considerable saving of time."
 SAU_Economcy_Under_Military_order_desc:0 "Aramco, SABIC, the ports and the contracting houses are placed under the direction of officers who have never run anything larger than a brigade. The oil keeps flowing because the oil always keeps flowing - the engineers at Ras Tanura barely look up. Everything else discovers what a supply officer thinks of quarterly forecasting."
 SAU_Defense_industries_act_desc:0 "The Kingdom has bought its weapons abroad since it had weapons, and the men who now govern it have spent their careers waiting on foreign spare parts. The act compels domestic production of what can be made here and licensing of what cannot. It will be expensive, slow and worse than the imports for a decade."
 SAU_Conscript_The_Kingdom_desc:0 "The Al Saud never conscripted anybody. An army of volunteers from trusted tribes is loyal; an army of everyone is merely large, and a large army in a country of this size has opinions. The Council, being itself the opinion the last regime feared, proposes to take the risk."
 SAU_Emegency_tribunal_desc:0 "Courts convened under military authority, sitting without appeal, trying offences the ordinary courts were never given jurisdiction over. The ulema are consulted on the form of the proceedings and not on the verdicts."
 SAU_Appoint_Loyalist_in_Privnces_desc:0 "The provincial governorships have been princely property since Abdulaziz handed them to his sons. They are handed instead to serving officers, and the princes are thanked for their service in a communique nobody believes."
 SAU_Mecca_province_secure_support_desc:0 "Makkah Province is Jeddah, the pilgrimage, the merchant families and the Hejaz - a region that remembers being a kingdom of its own until 1925 and has never entirely stopped mentioning it. It is bought, garrisoned and flattered in whatever order proves necessary."
 SAU_Al_Madinah_province_secure_support_desc:0 "Medina holds the Prophet's Mosque and the clerical establishment that grew up around it. Its scholars can call the Council a usurpation or a necessity, and the difference is worth more than a division."
 SAU_Guardians_of_the_two_mosques_desc:0 "The King is Custodian of the Two Holy Mosques - the title Fahd took in 1986 in place of Majesty, because it claimed something no other Muslim ruler could claim. The Council cannot take the title from a living King. It can, however, stand visibly behind him whenever he uses it."
 SAU_Sermons_from_the_ministry_desc:0 "The Friday khutba is written in Riyadh and read from every minbar in the Kingdom, as it has been for years - the Ministry merely changes who drafts it. Fifteen thousand pulpits, one text, and a congregation that will notice immediately if the wording shifts."
 SAU_Suprem_military_council_desc:0 "The provisional arrangement acquires a charter, a seal and a permanent seat, which is how provisional arrangements end. Membership is by rank and by which units a man commanded on the night, and the second qualification will matter longer than the first."
 SAU_crackdown_on_the_opposition_desc:0 "The Mabahith already held the files - on the Shia organisers of the Eastern Province, on the Sahwa clerics, on the liberals who signed petitions in 2003 and again in 2007. The Council inherits the filing cabinets and, unlike the ministry that built them, has no reason to be careful."
 SAU_trials_of_the_old_order_desc:0 "Princes in a courtroom, itemised. In 2017 the Crown Prince put several hundred of them in a hotel and called it an anti-corruption campaign, and the Kingdom discovered it rather enjoyed the spectacle. The Council intends to hold it in public this time, which is either justice or the best television the country has ever produced."
 SAU_the_succession_question_2_desc:0 "Thousands of princes remain, and every one of them is a claim. They can be pensioned, exiled, prosecuted or simply left to dwindle into a very rich and entirely ornamental class. What cannot be done is nothing."
 SAU_King_in_name_heirinUniform_desc:0 "The compromise that keeps everyone alive: the throne endures, and the heir is a prince who is also a serving officer - the Council's man by rank and the family's man by blood. Egypt did something like this in 1952 and had a republic within a year. The Council has read that history and believes it can do better."
 SAU_the_new_order_over_kingdom_desc:0 "The settlement is finished. Whatever the Kingdom is now, it is that permanently - the emergency has been renewed so often that nobody bothers dating the decrees any more."
 SAU_AltanticRealightment_desc:0 "Washington has spent decades explaining that it deals with the Kingdom and not with its government. The Council proposes to test the claim, and offers the one argument that has always worked: the barrels move regardless of who signs for them."
 SAU_Reaffirming_the_quincy_aggreemnet_desc:0 "In February 1945, aboard the USS Quincy in the Great Bitter Lake, Roosevelt and Abdulaziz struck the bargain the entire relationship still rests on: American security for Saudi oil. Neither man wrote it down. Every administration since has honoured it, and the Council intends to find out whether it was a promise to a king or to a country."
 SAU_Kingdom_unbeholden_desc:0 "No guarantor, no patron, no fleet in the Gulf that answers to somebody else. It is the most expensive of the three roads and the only one where the Kingdom is nobody's asset."
 SAU_The_silk_road_pivot_desc:0 "Beijing buys more Saudi crude than anyone and has never once asked about the internal arrangements. The Belt and Road brings ports, rail and capital with no lecture attached - which is either the great advantage of the relationship or the whole of it."
 SAU_Acscenion_to_the_sco_desc:0 "Riyadh became a dialogue partner of the Shanghai Cooperation Organisation in 2023 and left it there, carefully, as a signal rather than a commitment. The Council proposes to stop signalling. Full accession puts the Kingdom in a room with Beijing, Moscow and Tehran, and the third of those is the difficulty."
 SAU_junta_control_tt:0 "§HControl§!: $RIGHT|+=0$"
 SAU_junta_legitimacy_tt:0 "§HLegitimacy§!: $RIGHT|+=0$"
 SAU_events.150.t:0 "The Guard Disbanded"
 SAU_events.150.d:0 "Seventy-five thousand men, raised from the tribes of Najd because Abdulaziz's sons did not trust an army of professionals, and armed well enough that no professional army could move on Riyadh without fighting them first. They were surrounded in their barracks on the night and they did not fire a shot. Now the Council has to decide what to do with them.\n\nThey are not an enemy formation. Their officers are cousins and neighbours of the men holding the guns on them, and every one of their soldiers belongs to a tribe with a claim on the state. Dissolve them and the Council saves a great deal of money and makes a great many enemies in the interior. Absorb them and it doubles its manpower and swallows seventy-five thousand men whose loyalty was, until last week, explicitly to somebody else."
 SAU_events.150.a:0 "Absorb them. They can wear our uniform."
 SAU_events.150.b:0 "Dissolve the Guard entirely. Send them home."
 SAU_events.150.c:0 "Keep a rump, under our command."
 SAU_events.151.t:0 "The Tribes Answer"
 SAU_events.151.d:0 "The stipends stopped when the Guard did. In the interior that was not read as a budget measure - the payments to the tribes of Najd and the Shammar predate the Kingdom itself, they are the arrangement by which Abdulaziz assembled it, and they have never once been interrupted.\n\nThe sheikhs are not in rebellion. They are simply not answering, and in a country this size not answering is most of the way there."
 SAU_events.151.a:0 "They will answer to the state or to nobody."
 SAU_events.151.b:0 "Restore the stipends. Every riyal of them."
 SAU_events.152.t:0 "The Officers Turn"
 SAU_events.152.d:0 "A Council that cannot pay, cannot govern and cannot explain itself is a Council that its own colonels begin to discuss in the third person. There are meetings again - the same rooms, the same ranks, the same careful phrasing that preceded the last one.\n\nThe men who took Riyadh know precisely how this is done, because they did it. That is the difficulty with governing by coup: you have published the method."
 SAU_events.152.a:0 "Arrest them. All of them, tonight."
 SAU_events.152.b:0 "Bring them in. Widen the Council and share the blame."
 SAU_junta_accepted_label:0 "§GAccepted§!"
 SAU_junta_accepted_effect:0 "§G+5% stability, +5% political power gain§!. The Council is simply the government now."
 SAU_junta_accepted:0 "The Council: Accepted"
 SAU_junta_tolerated_label:0 "§HTolerated§!"
 SAU_junta_tolerated_effect:0 "§G+2% stability§!. Nobody loves them. Nobody is organising against them either."
 SAU_junta_tolerated:0 "The Council: Tolerated"
 SAU_junta_contested_label:0 "§YContested§!"
 SAU_junta_contested_effect:0 "§R-3% stability, -3% political power gain§!. The sermons have started hedging."
 SAU_junta_contested:0 "The Council: Contested"
 SAU_junta_rejected_label:0 "§ORejected§!"
 SAU_junta_rejected_effect:0 "§R-7% stability, -5% war support, -5% political power gain§!. The provinces answer slowly and then not at all."
 SAU_junta_rejected:0 "The Council: Rejected"
 SAU_junta_illegitimate_label:0 "§RIllegitimate§!"
 SAU_junta_illegitimate_effect:0 "§R-12% stability, -10% war support, -10% political power gain§!. Something is going to happen, and the Council will not choose when."
 SAU_junta_illegitimate:0 "The Council: Illegitimate"
 SAU_junta_category:0 "The Supreme Military Council"
 SAU_junta_category_desc:0 "The Council rules by two things and owns neither outright. §HControl§! is what it can enforce - the garrisons, the checkpoints, the files, the men who answer when called. §HLegitimacy§! is what it is owed, and it is owed nothing: no election, no fatwa, no succession, only the fact that the armour arrived first.\n\nEverything that raises one is paid for out of the other. Legitimacy falls by one every month regardless - a junta that simply governs quietly is a junta running out of time.\n\n§HAt zero, the Council has ninety days to find a reason to exist. If it cannot, the Kingdom will settle the question in the field.§!"
 SAU_junta_legitimacy_crisis:0 "The Council Must Answer For Itself"
 SAU_junta_legitimacy_crisis_desc:0 "Legitimacy is gone. Not low - gone. The sermons have stopped hedging, the provinces have stopped replying, and the Council is being discussed in the past tense by people who are still afraid of it.\n\nThere is one move left: open the treasury, restore what was taken, name a date for something resembling a government, and buy back enough of the country to keep it. It will cost the Council a great deal of its grip and most of its money.\n\n§RIf ninety days pass and nothing is done, the Kingdom will settle this the other way.§!"
 SAU_events.153.t:0 "The Council Buys Its Way Back"
 SAU_events.153.d:0 "The stipends are restored, the tribunals are quietly wound down, and a date is named for a consultative assembly that everyone understands will be appointed rather than elected. It is not much. It is enough that the men who were counting the Council's remaining weeks have stopped counting out loud.\n\nThe Treasury is lighter by a sum nobody will publish, and the officers who took Riyadh have handed back a good deal of what they took it for."
 SAU_events.153.a:0 "Better poor than hanged."
 SAU_events.154.t:0 "The Kingdom Divides"
 SAU_events.154.d:0 "Ninety days, and the Council found nothing to say. The garrison at Ha'il declared for the King this morning, the Eastern Province followed by noon, and the tribal levies the Guard used to draw on have stopped pretending to be anything else.\n\nThe army that took the country in a night is now the only institution defending it, and it is discovering that a state held entirely by force requires rather more force than anyone budgeted for."
 SAU_events.154.a:0 "Then it will be settled in the field."
 SAU_events.155.t:0 "Riyadh: Civil War in Saudi Arabia"
 SAU_events.155.d:0 "Fighting has been reported across the Saudi interior between units loyal to the Supreme Military Council and formations declaring for the House of Saud. The Eastern Province, where the oil is, is contested. Brent opened eleven dollars higher and has not stopped climbing.\n\nEvery foreign ministry with an embassy in Riyadh is issuing the same statement about restraint, and every one of them is quietly working out which side to be seen backing late rather than early."
 SAU_events.155.a:0 "The world watches the Eastern Province."
 SAU_junta_control_readout:0 "§HControl§! §W[?SAU_junta_control|0]§!"
 SAU_junta_control_readout_desc:0 "What the Council can enforce: the garrisons, the checkpoints, the files, the men who answer when called. Everything that buys Legitimacy is paid for out of this."
 SAU_junta_legitimacy_readout:0 "§HLegitimacy§! §W[?SAU_junta_legitimacy|0]§!"
 SAU_junta_legitimacy_readout_desc:0 "What the Council is owed - and it is owed nothing, having neither election nor fatwa nor succession behind it. This falls by one every month on its own. At zero the Council has ninety days."
 SAU_junta_standing_readout:0 "§HStanding§! [ROOT.GetSAUJuntaStanding]"
 SAU_junta_standing_readout_desc:0 "[ROOT.GetSAUJuntaStandingEffect]"
 SAU_junta_crisis_cost_tt:0 "Requires §H200 political power§! to convene"
 SAU_governors_unlocked_tt:0 "§HThe provincial governorships fall vacant§!"
 SAU_governor_seats_tt:0 "Provinces still without a governor: §W[?SAU_provinces_appointed|0]§! of §W13§!"
 SAU_events.156.t:0 "The Question of the Throne"
 SAU_events.156.d:0 "The governorships are the Council's to hand out now, which raises the question it has been carefully not raising. There is still a King.\n\nAbdullah is old, personally austere in a way the country has always liked, and commanded the National Guard for forty years before the Council dissolved it - which means the men who took Riyadh are asking whether to keep the man whose army they just disbanded. In his favour: nobody in the Kingdom questions his legitimacy, and a throne that nobody questions is worth more than several divisions.\n\nAgainst him: he is not a figurehead by temperament and never has been. Keeping him means giving back some of what the Council took, in practice and in public. The alternative is to find a prince who understands that the arrangement is the other way round."
 SAU_events.156.a:0 "Keep Abdullah. The throne is worth what it costs us."
 SAU_events.156.b:0 "Find us a King who understands the arrangement."
 SAU_events.157.t:0 "A More Convenient King"
 SAU_events.157.d:0 "King Abdullah has been retired from the throne, and the Supreme Military Council must name a successor from among the senior princes of the House of Saud.\n\nEach candidate carries a different constituency behind him - the Sudairi establishment, the security services, the tribes of the interior, and the younger generation of the family. The Council's choice will determine which part of the Kingdom recognises the new arrangement first, and which part will have to be persuaded."
 SAU_events.157.a:0 "Salman bin Abdulaziz."
 SAU_events.157.b:0 "Mohammed bin Nayef."
 SAU_events.157.c:0 "Mutaib bin Abdullah."
 SAU_events.157.e:0 "Mohammed bin Salman."
 SAU_appoint_provincial_governor:0 "Appoint a Provincial Governor"
 SAU_appoint_provincial_governor_desc:0 "The governorate is vacant. Select a province on the map and the Council will decide who takes it.\n\nEach province may be handed out once."
 SAU_events.158.t:0 "The Governorate of [SAU_governor_province.GetName]"
 SAU_events.158.d:0 "The seat is empty and the Council must fill it. Three names have been put forward, and each of them buys the Council something different.\n\nAn officer will be obeyed and resented. A prince will be recognised and ignored. A local notable will be neither, which is the useful part and the dangerous part at once."
 SAU_events.158.a:0 "A serving officer. §H+5 Control, -5 Legitimacy§!"
 SAU_events.158.b:0 "A prince of the House of Saud. §H-5 Control, +5 Legitimacy§!"
 SAU_events.158.c:0 "A local notable. §H+2 Control, +2 Legitimacy§!"
 SAU_events.159.t:0 "The Regency Decree"
 SAU_events.159.d:0 "The document is short. It records that His Majesty, being indisposed, entrusts the executive authority and the defence portfolio to a Council acting in his name, and it bears his signature beneath a paragraph he was given no opportunity to amend.\n\nWhat remains to be settled is how much the decree actually takes. A regency that leaves the King his mosque, his title and his ceremonies is a regency the country can live with, and one that leaves him nothing is simply the truth written down. The lawyers point out, without being asked, that a decree with a date on it is easier to sign than a decree without one.\n\nThere is no constitution to suspend. That has always been the convenience of this Kingdom."
 SAU_events.159.a:0 "A narrow regency. He keeps the throne and the Mosques."
 SAU_events.159.b:0 "A total regency. Every power, without exception."
 SAU_events.159.c:0 "A regency of five years. Put a date on it."
 SAU_events.160.t:0 "Martial Law"
 SAU_events.160.d:0 "Assembly, movement between the provinces and the printing presses pass under military authority this morning. The Council's lawyers observe that the Kingdom has never possessed a constitution to suspend, which saves a great deal of drafting.\n\nThe question is how far it goes. Curfew, tribunals and censors will hold the country still and be remembered for a generation. Emergency powers without the curfew will hold rather less and be forgiven rather sooner."
 SAU_events.160.a:0 "The full apparatus. Curfew, tribunals, censors."
 SAU_events.160.b:0 "Emergency powers only. Leave the streets alone."
 SAU_events.161.t:0 "The Regency Expires"
 SAU_events.161.d:0 "Five years ago the Council put a date on its own authority, and the lawyers who advised it to do so have spent the intervening years being quietly reassigned. The date has arrived. Everybody in the Kingdom knows it has arrived.\n\nHonouring it means handing the executive back to a throne the Council has spent five years hollowing out, and trusting that gratitude is a real thing. Breaking it means the Council's word is worth exactly what everyone suspected, and it will never be worth more than that again.\n\n§HA promise kept costs the Council its grip. A promise broken costs it everything else.§!"
 SAU_events.161.a:0 "The decree said five years. It has been five years."
 SAU_events.161.b:0 "The indisposition continues. Indefinitely."
 SAU_events.162.t:0 "The Defense Industries Act"
 SAU_events.162.d:0 "The Kingdom has bought its weapons abroad since it had weapons to buy, and the men now governing it spent their careers waiting on foreign spare parts that arrived when somebody else's parliament permitted it. The Act compels domestic manufacture of what can be made here.\n\nThere are two ways to begin. Buy the licences and the tooling, and have plants running inside three years making somebody else's designs under somebody else's terms. Or start from nothing - the metallurgy, the engineers, the failures - and own the result completely, at a cost the Treasury will feel for a decade."
 SAU_events.162.a:0 "Licence the designs. We need production, not pride."
 SAU_events.162.b:0 "Build it ourselves, from the ore up."
 SAU_events.163.t:0 "The Emergency Tribunal"
 SAU_events.163.d:0 "The court sits under military authority, without appeal, and takes jurisdiction the ordinary judges were never granted. The ulema have been consulted on the form of the proceedings and not on the verdicts, which they have noticed.\n\nThe Council must decide who is brought before it. There are princes whose accounts will not survive an audit and whose disgrace the country would enjoy enormously. There are organisers, clerics and signatories whose files the Mabahith have kept for twenty years. Trying the first is popular and profitable. Trying the second is necessary and will be remembered."
 SAU_events.163.a:0 "The princes. Let the country watch them account for it."
 SAU_events.163.b:0 "The dissidents. The files are already written."
 SAU_events.163.c:0 "Both. We did not seize the state to be selective."
 SAU_events.164.t:0 "Conscript the Kingdom"
 SAU_events.164.d:0 "The Al Saud never conscripted anybody. An army of volunteers drawn from trusted tribes is loyal; an army of everyone is merely large, and a large army in a country of this size develops opinions about how the country is run.\n\nThe Council is itself the opinion the last regime feared, which lends the discussion a certain awkwardness. It proposes to take the risk anyway - the only question is whether the levy falls on everyone, or on everyone the Council can afford to annoy."
 SAU_events.164.a:0 "Universal service. Every man of age, no exemptions."
 SAU_events.164.b:0 "Selective service. The tribes keep their exemptions."
 SAU_events.165.t:0 "Loyalists in the Provinces"
 SAU_events.165.d:0 "The family is not one thing. It is thousands of people with wildly unequal claims, and a great many of them have spent their lives being passed over by the branch that held the throne. The Council has just removed that branch from the equation.\n\nThere are senior princes whose names alone would settle a province. There are cousins of no particular distinction who would be grateful for a governorate and remember who gave it to them. And there are the ones with money and grievances, who could be brought in cheaply and audited later."
 SAU_events.165.a:0 "The senior princes. Their names still carry the country."
 SAU_events.165.b:0 "The overlooked cousins. Gratitude is cheaper than prestige."
 SAU_events.165.c:0 "The wealthy malcontents. Bring them in and audit them later."
 SAU_events.166.t:0 "The Makkah Province"
 SAU_events.166.d:0 "Makkah Province is Jeddah, the merchant houses, the pilgrimage and the Hejaz - a region that was a kingdom in its own right until 1925 and has never entirely stopped mentioning it. Its families financed the state before the oil did and have never been fully reconciled to Najdi rule.\n\nThey can be bought, and they are expensive. Or the province can be garrisoned, and they can be reminded that the pilgrimage runs through checkpoints now."
 SAU_events.166.a:0 "Pay the merchant houses. Buy the Hejaz properly."
 SAU_events.166.b:0 "Garrison it. They will adjust."
 SAU_events.167.t:0 "The Al-Madinah Province"
 SAU_events.167.d:0 "Medina holds the Prophet's Mosque and the scholarly establishment that grew up around it over thirteen centuries. Its jurists can describe the Council as a necessity that the community must accept, or as a usurpation that it must endure, and the wording will travel further than any communique the Council issues.\n\nThey can be courted, which means concessions and patience. Or the senior chairs can be reassigned to men who already agree, which is faster and which every scholar in the Muslim world will notice."
 SAU_events.167.a:0 "Court them. Concede what has to be conceded."
 SAU_events.167.b:0 "Reassign the chairs. We need the wording now."
 SAU_events.168.t:0 "Guardians of the Two Mosques"
 SAU_events.168.d:0 "Fahd took the title Custodian of the Two Holy Mosques in 1986, setting aside Majesty for something that claimed what no other Muslim ruler could claim. It is the most valuable thing the House of Saud owns and it does not transfer.\n\nThe Council cannot take it from a living King. It can stand behind him when he uses it, and be seen doing so - which lends the Council his legitimacy and reminds everyone whose legitimacy it is. Or it can announce that the guardianship rests with the state rather than the man, and discover how the Muslim world takes that."
 SAU_events.168.a:0 "Stand behind the King. Borrow the title, do not take it."
 SAU_events.168.b:0 "The guardianship belongs to the state, not the man."
 SAU_spirit_officer_purge:0 "The Purge of the Officer Corps"
 SAU_spirit_officer_purge_desc:0 "The colonels who hesitated on the night have been retired, and the ones who did not have their commands. The army is a great deal more obedient and a great deal smaller, and every survivor understands exactly why he survived."
 SAU_spirit_public_accounts:0 "The Council's Public Accounts"
 SAU_spirit_public_accounts_desc:0 "For the first time in the Kingdom's history the ministries publish what they spend. It is a humiliation for a hundred families and the single most popular thing the Council has ever done."
 SAU_spirit_national_service:0 "The National Service Parades"
 SAU_spirit_national_service_desc:0 "Armour down the King Fahd Road twice a year, schoolchildren bussed in, the whole thing broadcast live. It is transparently theatre and the crowds come anyway."
 SAU_spirit_officer_housing:0 "The Officers' Housing Programme"
 SAU_spirit_officer_housing_desc:0 "Compounds, schools and clinics for the officer corps and their families, built at a pace nothing else in the Kingdom is built at. An army that owns its house does not overthrow the men who gave it one."
 SAU_spirit_security_directorate:0 "The Security Directorate"
 SAU_spirit_security_directorate_desc:0 "The Mabahith files, the Interior Ministry networks and the Council's own military intelligence folded into a single directorate answering to one general. It knows everything and is trusted by nobody, which is the arrangement."
 SAU_council_officer_purge:0 "Purge the Officer Corps"
 SAU_council_officer_purge_desc:0 "Every officer who hesitated on the night is retired, and the files are read closely enough that a good many who did not hesitate are retired as well. The army will be smaller and it will not hesitate again."
 SAU_council_public_accounts:0 "Publish the Public Accounts"
 SAU_council_public_accounts_desc:0 "The ministries open their books, and the country discovers in print what it has always assumed. The Council gains a reputation for honesty it will find difficult to live up to, and loses the discretionary money that made a hundred arrangements possible."
 SAU_council_national_service:0 "The National Service Parades"
 SAU_council_national_service_desc:0 "Armour down the King Fahd Road, the Council on the reviewing stand, the whole thing live on Saudi television. Nobody is fooled and a great many people turn up."
 SAU_council_officer_housing:0 "The Officers' Housing Programme"
 SAU_council_officer_housing_desc:0 "Compounds, schools and clinics for the officer corps, built first and built well. It buys the army's contentment at the price of everything else the money could have done, and the country notices which queue moved."
 SAU_council_security_directorate:0 "Establish the Security Directorate"
 SAU_council_security_directorate_desc:0 "The Mabahith, the Interior networks and military intelligence are folded into one directorate under one general. Nothing will happen in the Kingdom that the Council does not hear about, and everyone will know it."
 SAU_junta_address_the_nation:0 "Address the Nation"
 SAU_junta_address_the_nation_desc:0 "The senior member of the Council goes on television and explains, in the flat delivery of a man reading a prepared text, what the Kingdom is now and why. It persuades nobody entirely and reminds everybody that somebody is in charge."
 SAU_junta_tour_the_provinces:0 "Tour the Provinces"
 SAU_junta_tour_the_provinces_desc:0 "The Council leaves Riyadh - the majlis in Buraydah, the notables in Jeddah, the sheikhs of the interior, a clinic opened in Jazan. Grievances are heard and a great many of them are paid off on the spot."
 SAU_junta_reinforce_garrisons:0 "Reinforce the Garrisons"
 SAU_junta_reinforce_garrisons_desc:0 "Fresh battalions into the provincial capitals, the checkpoints properly manned for the first time since the night, and the communications rebuilt so an order from Riyadh arrives everywhere at once."
 SAU_events.169.t:0 "The Files Are Already Open"
 SAU_events.169.d:0 "The Mabahith did not need to build anything. The cabinets in the Interior Ministry hold the Eastern Province organisers by name and street, the Sahwa preachers by sermon and date, and the men who signed the 2003 petition and signed it again in 2007. The ministry that assembled all this was always careful with it, because the men in the files had cousins in the ministry. The Council has no cousins."
 SAU_events.169.a:0 "Begin with the Eastern Province committees."
 SAU_events.169.b:0 "Place the sermons under review."
 SAU_events.169.c:0 "Begin with the petition signatories."
 SAU_events.169.e:0 "Take all three files together."
 SAU_events.170.t:0 "Princes in the Dock"
 SAU_events.170.d:0 "The accountants have finished, and the figures are worse than the rumours. Ministries that built nothing, commissions on aircraft that were never delivered, a decade of the Kingdom's revenue that simply stopped somewhere between the treasury and the contractor. The country is going to be told some of this. The only question is how much of it happens in front of a camera, and how much is settled in a hotel with the doors closed."
 SAU_events.170.a:0 "In open court, and televised."
 SAU_events.170.b:0 "Settle it in the Ritz, as before."
 SAU_events.170.c:0 "Pardons, at the going rate."
 SAU_events.171.t:0 "Every One of Them a Claim"
 SAU_events.171.d:0 "Abdulaziz had forty-five recorded sons and the Kingdom has spent seventy years absorbing the consequences. There are several thousand of them now, drawing stipends, holding governorates, married into every merchant house from Jeddah to Hofuf. None of them individually is a threat to the Council. All of them together are the only alternative government the country has ever known, and they cannot simply be left where they are."
 SAU_events.171.a:0 "Pension them, generously and permanently."
 SAU_events.171.b:0 "Exile the senior lines."
 SAU_events.171.c:0 "Prosecute, and confiscate what is found."
 SAU_events.171.e:0 "Leave them rich and ornamental."
 SAU_events.172.t:0 "The Council Writes to Washington"
 SAU_events.172.d:0 "The letter is short. It notes that the Kingdom's obligations are unchanged, that production targets will be met, that American personnel are safe and that the Council would welcome an early meeting. It does not mention the King, the arrests or the constitution. Washington now has to decide what it is looking at: a government, or a group of officers who happen to be sitting where a government used to be."
 SAU_events.172.a:0 "Recognise the Council. The relationship is with the country."
 SAU_events.172.b:0 "Recognise them, and take something for it."
 SAU_events.173.t:0 "No Questions Asked"
 SAU_events.173.d:0 "The Chinese ambassador arrived four days after the night itself, congratulated the Council on the restoration of order, and moved directly to the subject of throughput at Yanbu. There was no reference to the King, to the arrests, or to the constitution. It is the most straightforward conversation the Kingdom's foreign ministry has had in a decade, and everyone in the room understands precisely what is being sold."
 SAU_events.173.a:0 "Ports, rail and the northern corridor."
 SAU_events.173.b:0 "Capital, and no conditions attached."
 SAU_events.174.t:0 "An Application from Riyadh"
 SAU_events.174.d:0 "The Saudi application for full membership arrives at the Secretariat with no preamble and no conditions attached to it, which is itself a statement. The Organisation has never admitted a Gulf state. It has also never turned down a founding-scale oil producer that asked politely. The question in Beijing is not whether Riyadh is useful - that was settled years ago - but whether admitting it means importing a quarrel the Organisation has spent two decades avoiding."
 SAU_events.174.a:0 "Admit them, once Riyadh settles with Tehran."
 SAU_events.174.b:0 "The application is declined."
 SAU_events.174.c:0 "Admit them. No conditions."
 SAU_spirit_king_in_name:0 "King in Name, Heir in Uniform"
 SAU_spirit_king_in_name_desc:0 "The throne is intact, the Friday prayers still name a king, and the Crown Prince holds a general's commission and reports to the Council on Tuesdays. The arrangement satisfies nobody and offends nobody, which is the entire point of it."
 SAU_spirit_quincy_reaffirmed:0 "The Quincy Understanding"
 SAU_spirit_quincy_reaffirmed_desc:0 "Nothing has been signed, because nothing was signed in 1945 either. The carriers still transit the Gulf, the tankers still sail, and the arrangement made between a president and a king now runs between a government and a council. Both sides prefer it undocumented."
 SAU_spirit_unbeholden:0 "The Kingdom Unbeholden"
 SAU_spirit_unbeholden_desc:0 "No guarantor and no garrison. The Kingdom buys its own air defence at catalogue price, trains its own officers, and answers to nobody about any of it - an arrangement of considerable dignity and ruinous expense."
 SAU_quincy_reaffirmed:0 "Quincy Agreement Reaffirmed"
 SAU_events.175.t:0 "Beijing's Terms"
 SAU_events.175.d:0 "The reply is courteous and entirely unambiguous. China will sponsor the application, chair the vote and carry the smaller members - and in exchange the understanding brokered in Beijing in 2023 is to be restored in writing, embassies and all. The Organisation does not want a member that will spend every summit arguing with another member. Riyadh is being asked to buy its seat with a signature, not with oil."
 SAU_events.175.a:0 "Restore the understanding with Tehran."
 SAU_events.175.b:0 "We will not be told who our neighbours are."
 SAU_events.176.t:0 "The Application Is Declined"
 SAU_events.176.d:0 "No reason is given, because none is required. The communique thanks the Kingdom for its interest, notes the value of continued dialogue, and closes. Riyadh has been refused by an organisation it was assured would take anyone, and the refusal will be read correctly in every capital that matters."
 SAU_events.176.a:0 "Note it, and move on."
 SAU_events.177.t:0 "Admitted Without Conditions"
 SAU_events.177.d:0 "The vote is unanimous, which means it was settled before it was taken. The Kingdom joins as a full member with no preconditions, no probationary period and no reference whatsoever to the manner in which its present government came to office. That silence is the whole of what has been purchased."
 SAU_events.177.a:0 "Take the seat."
 SAU_events.172.c:0 "We do not deal with a council of colonels."
 SAU_events.178.t:0 "Business as Usual"
 SAU_events.178.d:0 "The recognition arrives as a two-line statement issued on a Friday afternoon, which is where Washington puts the things it would rather nobody examined. The ambassador returns the following week. Nothing in the commercial relationship is renegotiated and nothing about the last six months is mentioned by either side, then or afterwards."
 SAU_events.178.a:0 "The barrels move as before."
 SAU_events.179.t:0 "Recognition, at a Price"
 SAU_events.179.d:0 "Washington will recognise the Council, and has attached a schedule to the offer: expanded access at Prince Sultan, prepositioning rights in the Eastern Province, and standing overflight. The reasoning is not hidden. A government that needs recognition badly enough to ask for it is a government that can be charged for it, and the Council asked first."
 SAU_events.179.a:0 "Grant the access. It is what recognition costs."
 SAU_events.179.b:0 "Recognition on those terms is not recognition."
 SAU_events.180.t:0 "Washington Declines"
 SAU_events.180.d:0 "The statement runs to four paragraphs on constitutional government and the rule of law, and is issued by a State Department that has said nothing comparable about half the Kingdom's neighbours. The Council reads it, notes which of its own officers were trained in Kansas, and files it. The relationship does not end. It simply stops being spoken about."
 SAU_events.180.a:0 "Then we manage without them."
 SAU_events.181.t:0 "The Quincy Question"
 SAU_events.181.d:0 "In February 1945 Roosevelt and Abdulaziz met aboard a cruiser in the Great Bitter Lake and agreed the arrangement that has underwritten eighty years of policy: American security, Saudi oil. Neither man signed anything, which every administration since has found convenient. Riyadh is now asking, formally and in writing, for an answer to the question the vagueness was designed to avoid - was the bargain made with a king, or with a country?"
 SAU_events.181.a:0 "Reaffirm it in full. Security for oil, as before."
 SAU_events.181.b:0 "The oil, yes. The guarantee, no."
 SAU_events.181.c:0 "Let it lapse. It was never written down."
 SAU_events.182.t:0 "The Understanding Holds"
 SAU_events.182.d:0 "There is no document, because there was never a document. There is a carrier group that does not leave, a note passed between two governments that will not be published in either country, and a fuelling agreement renewed for twenty years on the old terms. Eighty years on, the arrangement has survived a change of dynasty by the simple method of never having been written down."
 SAU_events.182.a:0 "Nothing is signed. Nothing needs to be."
 SAU_events.183.t:0 "Half a Bargain"
 SAU_events.183.d:0 "The commercial relationship is confirmed in some detail and the security relationship is described, twice, as being under review. Riyadh understands the construction perfectly: the tankers are guaranteed and the Kingdom is not. It is the half of Quincy that costs Washington nothing, offered by an administration that has counted the cost of the other half."
 SAU_events.183.a:0 "We will take the half that ships."
 SAU_events.184.t:0 "Nobody's Guarantee"
 SAU_events.184.d:0 "No statement, no refusal, no meeting. The request is acknowledged by a deputy assistant secretary and never answered, and after some months it becomes clear that the non-answer was the answer. Eighty years of arrangement have not been repudiated. They have simply been allowed to expire, quietly, in the way such things always end."
 SAU_events.184.a:0 "Then the Kingdom guarantees itself."
 SAU_sco_application_sent_tt:0 "Applies to §YChina§! for full membership of the Shanghai Cooperation Organisation"
 SAU_sco_beijing_terms_tt:0 "Restores the §YBeijing Agreement§! with Iran"
 SAU_usa_approach_sent_tt:0 "Asks §Ythe United States§! to recognise the Council"
 SAU_quincy_request_sent_tt:0 "Asks §Ythe United States§! to reaffirm the Quincy Agreement"
 SAU_succession_panel_race1:0 "King Fahd is dead and King Abdullah now reigns, but he too is old and the succession is unsettled. Three princes contend to be named heir: Salman bin Abdulaziz, standard-bearer of the Sudairi establishment; Mohammed bin Nayef, master of the security services; and Mutaib bin Abdullah, commander of the National Guard.\n\nBack one prince and rally the family and the state behind him while undermining his rivals. Each faction also schemes for itself, so the balance of influence shifts every month. When King Abdullah dies, the prince holding the greatest share of influence ascends the throne.\n\n§YSalman bin Abdulaziz:§! [?SAU_salman_share|0]%\n§YMohammed bin Nayef:§! [?SAU_mbn_share|0]%\n§YMutaib bin Abdullah:§! [?SAU_mutaib_share|0]%\n\n§YHeir apparent, were Abdullah to die today:§! §H[ROOT.GetSAUCrownFrontrunner]§!"
 SAU_succession_panel_race2:0 "King Salman reigns, and the contest has narrowed to two men and one title. Mohammed bin Nayef holds the Interior Ministry, the counter-terrorism file and the confidence of Washington. Mohammed bin Salman holds the economy, the defence portfolio and his father's ear, which in this family has always counted for more.\n\nBack one and rally the state behind him while undermining the other. Whoever holds the greater share when the King names his heir - or when he dies without naming one - takes the throne after him.\n\n§YMohammed bin Salman:§! [?SAU_heir_mbs_share|0]%\n§YMohammed bin Nayef:§! [?SAU_heir_mbn_share|0]%\n\n§YHeir apparent today:§! §H[ROOT.GetSAUHeirFrontrunner]§!\n§YThe King's health:§! §H[ROOT.GetSAUKingHealth]§!"
 SAU_succession_panel_named:0 "The Crown Prince has been named: §H[ROOT.GetSAUCrownPrinceName]§!. The contest is over and the arrangement will hold exactly as long as the King does.\n\n§YThe King's health:§! §H[ROOT.GetSAUKingHealth]§!"
 SAU_succession_panel_dormant:0 "The throne is occupied and the succession is not in contest. Should it reopen, the princes and their factions will be set out here."
 SAU_frontrunner_mbs:0 "Mohammed bin Salman"
 SAU_military_government_tt:0 "The §YSupreme Military Council§! must still govern the Kingdom"
