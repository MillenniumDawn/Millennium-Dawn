 form_AUSHUN_category: "오스트리아-헝가리 제국의 재설립"
 form_AUSHUN_category_desc: "오스트리아-헝가리 제국은 19세기 말과 20세기 초 중앙유럽의 열강이었습니다. 제국은 대전쟁에서의 참패 이후 해체되었습니다. 체코, 오스트리아, 헝가리, 슬로바키아, 슬로베니아, 보스니아로 쪼개졌고, 일부는 우크라이나, 폴란드, 루마니아로 분할되었습니다. 이제 오래전 잃어버린 권위를 되찾을 때입니다. 오스트리아-헝가리 제국을 재건할 때가 되었습니다."
 AUSHUN_integrate_start: "[GetAUSHUNNameDef] 형성 시작"
 AUSHUN_integrate_start_desc: "오스트리아-헝가리 제국의 구 영토를 우리 군대가 수복했으며, 정치인들은 새로운 지역을 통치하기 위한 작업에 착수했습니다.\n\n"
 AUSHUN_integrate_AUS: "[GetAUSHUNNameAdj] [AUS.GetAdjective] 영토 통합"
 AUSHUN_integrate_AUS_desc: "과거 합스부르크 제국의 핵심 지대였던 오스트리아는 우리 국가의 주요 권력 중심지 중 하나가 되어야 합니다."
 AUSHUN_integrate_HUN: "[GetAUSHUNNameAdj] [HUN.GetAdjective] 영토 통합"
 AUSHUN_integrate_HUN_desc: "헝가리 왕국은 이중 군주제의 다른 한 축이자 제국 통치의 파트너였습니다. 제국의 구조를 복원하기 위해 이들의 통합은 필수적입니다."
 AUSHUN_integrate_SLV: "[GetAUSHUNNameAdj] [SLV.GetAdjective] 영토 통합"
 AUSHUN_integrate_SLV_desc: "슬로베니아 지역은 오스트리아 왕관령의 일부로 아드리아해로 가는 통로를 제공했으며, 오스트리아와 발칸반도 사이의 가교 역할을 했습니다."
 AUSHUN_integrate_NORTHITA: "[GetAUSHUNNameAdj] 북이탈리아 영토 통합"
 AUSHUN_integrate_NORTHITA_desc: "롬바르디아-베네치아의 이탈리아 영토는 과거 합스부르크 왕관의 보석과도 같았으며, 문화와 상업이 번성했던 곳입니다. 이곳을 반환받으면 포강 유역에 대한 오스트리아의 영향력이 복원될 것입니다."
 AUSHUN_integrate_CRO: "[GetAUSHUNNameAdj] [CRO.GetAdjective] 영토 통합"
 AUSHUN_integrate_CRO_desc: "크로아티아는 상당한 자치권을 지닌 헝가리 왕관령의 일부였습니다. 아드리아해를 연한 항구들과 전략적 위치는 제국의 해군력에 필수적이었습니다."
 AUSHUN_integrate_BOS: "[GetAUSHUNNameAdj] [BOS.GetAdjective] 영토 통합"
 AUSHUN_integrate_BOS_desc: "1878년부터 오스트리아-헝가리가 통치하다가 1908년에 정식 합병된 보스니아 헤르체고비나를 통합하면 남부 국경을 안전하게 지키고 발칸반도로 영향력을 확대할 수 있습니다."
 AUSHUN_integrate_SLO: "[GetAUSHUNNameAdj] [SLO.GetAdjective] 영토 통합"
 AUSHUN_integrate_SLO_desc: "슬로바키아 지역은 헝가리 왕국의 험준한 북부 산악 국경을 형성하던 왕국 융합의 핵심 지대였습니다. 이곳을 재통합함으로써 카르파티아산맥에 대한 우리의 통제력이 공고해질 것입니다."
 AUSHUN_integrate_AUSROM: "[GetAUSHUNNameAdj]령 트란실바니아 영토 통합"
 AUSHUN_integrate_AUSROM_desc: "트란실바니아는 루마니아계 인구와 헝가리계 인구가 각축을 벌이던 역사적인 헝가리 왕관령이었습니다. 이 지역을 장악함으로써 제국으로 오는 동부 접근로를 안전하게 지킬 수 있습니다."
 AUSHUN_integrate_CZE: "[GetAUSHUNNameAdj] [CZE.GetAdjective] 영토 통합"
 AUSHUN_integrate_CZE_desc: "보헤미아 왕관령은 제국에서 가장 산업화되고 문화적으로 풍요로운 영토 중 하나였습니다. 프라하는 제국의 위대한 도시 중 하나로 우뚝 서 있었으며, 이곳의 재통합은 매우 중요합니다."
 AUSHUN_integrate_AUSPOL: "남폴란드 통합"
 AUSHUN_integrate_AUSPOL_desc: "갈리치아는 폴란드 분할을 통해 획득한 왕관령으로, 제국 북부 국경에 경제적 자원과 전략적 종심을 모두 가져다주었습니다."
 AUSHUN_integrate_WESTUKR: "우크라이나 남서부 통합"
 AUSHUN_integrate_WESTUKR_desc: "갈리치아 동부 지역은 루테니아인들의 터전이었으며 풍부한 농업 자원을 제공했습니다. 이 지역의 통합은 우리의 영향력을 우크라이나 변경 지대까지 확장시켜 줍니다."
 AUSHUN_update_flag: "[GetAUSHUNNameDef] 형성 완료"
 AUSHUN_update_flag_desc: "모든 구성 영토가 통합됨에 따라, 우리는 변혁을 완수하고 [GetAUSHUNNameDef]을(를) 선포하며 통합된 국기와 국명을 채택할 수 있습니다."
