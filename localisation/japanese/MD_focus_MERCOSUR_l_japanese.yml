 MER_PRU_logistics_corridor: "対ペルー物流回廊整備"
 MER_PRU_logistics_corridor_desc: "ペルーの首都における物流回廊整備の第一段階に資金を投じ、同国のMERCOSURとのより深い統合に備える。"
 MER_PRU_cross_border_transport: "対ペルー越境輸送改善"
 MER_PRU_cross_border_transport_desc: "ペルーとの陸上輸送連結を拡充し、加盟に必要なインフラを強化する。"
 MER_PRU_port_connectivity: "対ペルー港湾接続強化"
 MER_PRU_port_connectivity_desc: "ペルーの首都におけるデジタル・物流接続に投資し、より統合された地域市場を支える。"

 MER_BOL_logistics_corridor: "対ボリビア物流回廊整備"
 MER_BOL_logistics_corridor_desc: "ボリビアの首都における物流回廊整備の第一段階に資金を投じ、同国のMERCOSURとのより深い統合に備える。"
 MER_BOL_overland_transport: "対ボリビア陸上輸送網拡張"
 MER_BOL_overland_transport_desc: "ボリビアの首都における新たな陸上輸送改良を支援し、加盟の実利を目に見えるものにする。"
 MER_BOL_border_connectivity: "対ボリビア国境接続改善"
 MER_BOL_border_connectivity_desc: "加盟パッケージの一環として、ボリビアのデジタルおよび物流面の国境接続に投資する。"

 MER_PAN_logistics_corridor: "対パナマ物流回廊整備"
 MER_PAN_logistics_corridor_desc: "パナマの首都における物流回廊整備の基盤に資金を投じ、加盟が即時の輸送改善を生むようにする。"
 MER_PAN_port_transport: "対パナマ港湾輸送強化"
 MER_PAN_port_transport_desc: "パナマにおける港湾向け輸送改良を支援し、MERCOSUR市場間の商品移動を改善する。"
 MER_PAN_trade_connectivity: "対パナマ通商接続改善"
 MER_PAN_trade_connectivity_desc: "加盟パッケージの最終段階として、パナマの商業・デジタル接続に投資する。"

