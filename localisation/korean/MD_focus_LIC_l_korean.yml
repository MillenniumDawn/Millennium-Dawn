 LIC_USA_cooperation_idea: "미국 협력: $$§G0.100§!\n"
 LIC_EU_cooperation_idea: "유럽 협력: $$§G0.100§!\n"
 LIC_idea_large_haven_income_tt: "거대한 조세 피난처: $$§G0.075§!\n"
 LIC_idea_foreign_workers_expense_tt: "외국인 노동자 통근: $$§R0.01§!\n"
 LIC_trait_prince_alois: "알로이스 대공"
 LIC_HRE_modern_empire: "근대 제국"
 LIC_HRE_modern_empire_desc: "옛 신성 로마 제국은 약함과 불안정의 전형이었습니다. 이제는 아닙니다. 리히텐슈타인은 강력한 위치에서 제국을 개혁했으며, 이제 우리의 의지를 신민들에게 관철시킬 때입니다."
 LIC_formed_HRE_tt: "신성 로마 제국을 수립했음"
 LIC_HRE_modern_empire_tt: "무너져가는 분권적 영토를 바로잡기 시작합니다"
 LIC_HRE_stabilize: "제국 안정화"
 LIC_HRE_stabilize_desc: "신성 로마 제국은 대부분 독일인이지만 수십 개의 문화와 민족으로 이루어져 있으며, 모두 우리 제국의 힘 앞에 굴복했습니다. 지금은 그들을 통제할 수 있을지 몰라도, 이 신생 제국이 살아남고 번영하길 원한다면 먼저 내부로 눈을 돌려 제국의 구조가 산산조각 나지 않도록 해야 합니다."
 LIC_HRE_centralize: "제국 중앙집권화"
 LIC_HRE_centralize_desc: "우리의 새 제국은 이전 제국과 유사한 구조로 수립되었습니다. 이는 정당한 옥좌에 대한 권리를 주장하기 위해 필요했습니다. 그러나 이제 합스부르크 가문이 더 이상 실권을 쥐고 있지 않으므로, 그들의 비효율적인 행정이 더 이상 우리나라의 진로를 이끌 수 없습니다. 이제 경제적 권력을 황제에게 영원히 집중시킬 때입니다."
 LIC_HRE_organize: "제국 재편"
 LIC_HRE_organize_desc: "우리 군대는 규모는 크지만 다양하고 산만합니다. 거의 전적으로 복속된 나라들의 무기를 쓰는 신규 징집병으로 이루어져 있어, 우리 군은 혼돈의 전형입니다. 국가로서의 미래를 보장하려면 군대를 재편하는 데 상당한 시간과 노력을 들여야 합니다."
 LIC_idea_HRE_government: "산만한 제국"
 LIC_idea_HRE_government_desc: "신성 로마 제국은 가장 너그러운 정의에 따라서만 제 기능을 하는 국가라고 할 수 있습니다. 새 제국이 살아남으려면 수많은 내부 문제를 해결해야 합니다."
 LIC_idea_HRE_stabilized: "무질서하고 분권화된 제국"
 LIC_idea_HRE_stabilized_desc: "내부적으로는 어느 정도 안정되었으나, 신성 로마 제국의 군대는 여전히 무질서하며 행정 또한 효과적으로 중앙집권화되지 못했습니다."
 LIC_idea_HRE_organized: "불안정하고 분권화된 제국"
 LIC_idea_HRE_organized_desc: "신성 로마 제국군은 재편되었지만, 제국은 여전히 불안정한 정치 상황과 분권화된 권력 구조를 포함하여 해결해야 할 거대한 내부 문제를 안고 있습니다."
 LIC_idea_HRE_centralized: "불안정하고 무질서한 제국"
 LIC_idea_HRE_centralized_desc: "새 황제가 파두츠에 권력을 집중시키는 데 성공했지만, 내부 분쟁과 무질서한 군대는 여전히 제국의 존속에 큰 걸림돌이 되고 있습니다."
 LIC_idea_HRE_centralized_organized: "불안정한 제국"
 LIC_idea_HRE_centralized_organized_desc: "군대가 개혁되고 권력이 집중된 지금, 새 황제는 제국의 번영하는 미래를 보장하기 위해 내부 갈등만 해결하면 됩니다."
 LIC_idea_HRE_centralized_stabilized: "무질서한 제국"
 LIC_idea_HRE_centralized_stabilized_desc: "권력이 파두츠에 집중되고 내부의 반대 세력이 진압된 지금, 신성 로마 황제가 주요 강대국으로서 국제 정치에 합류할 준비를 마치기까지 남은 주요 과제는 단 하나, 군대입니다."
 LIC_idea_HRE_stabilized_organized: "분권화된 제국"
 LIC_idea_HRE_stabilized_organized_desc: "국내의 반대 세력이 무력화되고 군대가 새 황제를 위해 재편된 지금, 남은 것은 자연스러운 마지막 단계뿐입니다. 바로 나라의 권력을 옥좌에 집중시키는 것입니다."
 LIC_idea_new_empire: "새로운 제국"
 LIC_idea_new_empire_desc: "제국의 내부 문제가 해결되었습니다. 이제 우리는 미래를 바라볼 수 있습니다."
 LIC_holy_roman_empire_category: "신성 로마 제국"
 LIC_holy_roman_empire_category_desc: "리히텐슈타인은 과거 신성 로마 제국 내에 남은 마지막 진정한 공국입니다. 당연히 제국의 정당한 권리를 회복하는 부담은 오직 우리에게 달려 있습니다. 쉽지 않겠지만, 우리 황제의 인도 아래 리히텐슈타인이, 아니, 신성 로마 제국이 승리할 것입니다!"
 LIC_form_HRE: "신성 로마 제국 재건"
 LIC_form_HRE_desc: "우리는 옥좌를 주장했지만, 제국의 백성과 전 세계가 우리를 그렇게 인정하게 하려면 신이 부여한 통치권을 강제해야 합니다."
 LIC_join_international_community: "국제 사회 합류"
 LIC_join_international_community_desc: "내부 문제를 해결한 지금, 우리는 더 적극적인 참여자로서 국제 사회에 합류할 준비가 되었습니다."
 LIC_path_of_conquest: "정복의 길"
 LIC_path_of_conquest_desc: "우리의 주장은 신성 로마 제국뿐 아니라 로마 제국 전체에 대한 것입니다. 우리는 어떠한 수단을 쓰더라도 과거의 영광을 되찾는 일을 스스로 떠맡을 것입니다."
 LIC_path_of_peace: "평화의 길"
 LIC_path_of_peace_desc: "유혈은 충분했습니다. 이제 우리는 재건하고 평화로운 미래를 바라보아야 합니다."
 LIC_royal_marriages: "왕실 혼인"
 LIC_royal_marriages_desc: "유럽에서, 아니 세계에서 가장 강력한 군주국으로서, 수많은 고귀한 가문이 우리의 먼 친척과도 결합하기를 원하고 있습니다. 이러한 관계를 장려하면 전 세계의 나라들에 영향력을 행사할 수 있습니다."
 LIC_auxillaries: "보조 사단"
 LIC_auxillaries_desc: "로마에는 비시민이 군대에 입대하도록 장려하는 독특한 제도가 있었습니다. 유사한 제도를 도입하면 비슷한 성과를 거둘 수 있습니다."
 LIC_idea_auxillaries: "보조 사단"
 LIC_idea_auxillaries_desc: "옛 로마의 보조병 제도를 도입한 리히텐슈타인은 피지배 인구가 군대에 입대하도록 적극 장려합니다. 그러나 이러한 제도에도 단점이 없지는 않습니다."
 LIC_marriage_influence_tt: "절대 군주제인 모든 나라에서 §G33% 영향력§!, 군주제가 영향력을 가진 모든 나라에서 §G15% 영향력§!, 상징적 군주제인 모든 나라에서 §G7% 영향력§!을 얻습니다."
 LIC_path_of_conquest_tt: "로마 제국의 옛 영토에 대해 §Y정복§! 전쟁 목표를 얻습니다."
 LIC_claim_the_HRE_tt: "옛 §Y신성 로마 제국§!에 대해 §Y괴뢰국§! 전쟁 목표를 얻습니다. 이는 대상 국가들의 반감을 살 것입니다."
 LIC_new_capital: "새로운 수도"
 LIC_new_capital_desc: "과거의 영광을 되찾았으니, 이제 황궁의 위치를 더 걸맞은 곳으로 옮기는 것을 고려할 수 있습니다."
 LIC_capital_paris: "샤를마뉴의 유산"
 LIC_capital_wien: "합스부르크의 패권"
 LIC_capital_berlin: "독일 제국"
 LIC_capital_brussels: "새로운 권력의 자리"
 LIC_capital_rome: "옛 제국"
 LIC_capital_prague: "다른 접근법"
 LIC_capital_constantinople: "동방의 수도"
 LIC_capital_vatican: "교황청"
 LIC_set_capital_paris_tt: "§Y수도를 파리로 이전§!"
 LIC_set_capital_wien_tt: "§Y수도를 빈으로 이전§!"
 LIC_set_capital_berlin_tt: "§Y수도를 베를린으로 이전§!"
 LIC_set_capital_brussels_tt: "§Y수도를 브뤼셀로 이전§!"
 LIC_set_capital_rome_tt: "§Y수도를 로마로 이전§!"
 LIC_set_capital_prague_tt: "§Y수도를 프라하로 이전§!"
 LIC_set_capital_constantinople_tt: "§Y수도를 콘스탄티노폴리스로 이전§!"
 LIC_set_capital_vatican_tt: "§Y수도를 바티칸 시국으로 이전§!"
 LIC_remove_auxillaries: "보조 사단 제도 폐지"
 LIC_9833_name: "콘스탄티노폴리스"
 LIC_Hire_a_Chief_of_the_Army: "육군 참모총장 영입"
 LIC_Hire_a_Chief_of_the_Army_desc: "모든 군대에는 장군이 필요합니다. 장군이 없다면 우리가 군에 투자한 모든 자금이 쓸모없어질 것입니다. 현 경찰청장 쥘 호흐가 이 일을 훌륭히 해낼 것입니다!"