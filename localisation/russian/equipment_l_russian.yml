 SIN_infantry_weapons_1: "M16S1"
 SIN_infantry_weapons_1_desc: "M16S1 — это экспортный вариант американской винтовки M16A1, лицензия на производство которой была передана компании ST Kinetics. На заре существования Сингапурских вооруженных сил M16S1 была стандартным оружием для каждого солдата. Несмотря на некоторые модификации M16A1, внесенные для местного применения, M16S1 все еще демонстрировала некоторые из своих ранних недостатков, что побудило сингапурскую оборонную промышленность искать более совершенные конструкции. M16S1 до сих пор хранится и используется в качестве резервного оружия."
