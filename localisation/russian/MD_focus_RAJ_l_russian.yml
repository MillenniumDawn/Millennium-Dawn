 RAJ_bharat_sarkar: "Bharat Sarkar"
 RAJ_bharat_sarkar_desc: "Индия - многоконфессиональная страна. Для достижения баланса и желаемого эффекта нам приходится поддерживать или разрушать доверие определенных религиозных групп."
 RAJ_regul_pres_gov: "Регулирование представительства в органах власти"
 RAJ_ident_of_india: "Идентичность Индии"
 RAJ_ident_of_india_desc: "Каждая религия имеет свой интерес в нашей стране. Не следует забывать, что Индия весьма чувствительна к любым изменениям в области религии."
 RAJ_region_gov_pos_sabh: "Региональные позиции"
 RAJ_secul_of_india: "Секулярная Индия"
 RAJ_secul_of_india_desc: "Мы считаем, что лучше подходить к религиям более прагматично. Это вызовет меньше недовольства, чем если мы будем склоняться только в одну сторону."
 RAJ_hindu_nationalism_sabh: "Индусский национализм"
 RAJ_hindu_nationalism_sabh_desc: "Хиндуисты — ведущая религиозная группа в нашей стране. Мы считаем, что их желания должны быть первыми, которые будут учитываться."
 RAJ_integr_sikhism: "Интеграция сикхизма"
 RAJ_integr_sikhism_desc: "Сикхи должны стать дружественной нам религией, чтобы в нашей стране была более мирная обстановка."
 RAJ_suppr_sikhism: "Подавление сикхизма"
 RAJ_suppr_sikhism_desc: "Мы не рассматриваем возможность склониться на сторону сикхов."
 RAJ_guarant_christ_rights: "Гарантировать права христиан"
 RAJ_guarant_christ_rights_desc: "Мы должны гарантировать права христиан, чтобы завоевать их доверие."
 RAJ_closeyes_christ_rights: "Закрытие глаз на права христиан"
 RAJ_closeyes_christ_rights_desc: "Для нас не представляется первостепенным гарантировать права и свободы христиан."
 RAJ_revok_citiz_muslims: "Лишение мусульманского гражданства"
 RAJ_revok_citiz_muslims_desc: "Мусульмане - это враждебная нам религия, которая должна быть ограничена."
 RAJ_integr_muslims: "Интеграция мусульман"
 RAJ_integr_muslims_desc: "Пришло время заключить мир с одной из основных религий, с которой долгое время существовала вражда."
