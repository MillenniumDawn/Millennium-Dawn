 ISR_kill_agents_risk_tt: "§YRisco:§! alguns de nossos agentes serão expostos, enfraquecendo nossas operações de inteligência e políticas por §H365 dias§!."
 ISR_clearance_tax_discuss_desc: "Israel cobra tarifas alfandegárias e IVA sobre mercadorias destinadas aos territórios palestinos e repassa a arrecadação à Autoridade Palestina no âmbito do Protocolo de Paris. Tensões periódicas sobre a cooperação em segurança e movimentos palestinos unilaterais em órgãos internacionais repetidamente sobrecarregaram esse arranjo. O gabinete deve decidir como lidar com a atual disputa sobre a receita de compensação."
