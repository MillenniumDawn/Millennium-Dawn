 SER_balkan_federation_category: "발칸 연방"
 SER_balkan_federation_category_desc: "\n\n\n\n\n\n£SER_desctext_balkanfederation \n\n\n\n\n\n\n\n\n§Y발칸 연방§!의 수립은 §Y발칸§! 민족들 사이에서 되풀이되어 온 주제입니다. §Y발칸 연방§!이라는 개념은 19세기 후반 이 지역의 좌파 정치 세력들 사이에서 등장했습니다. 핵심 목표는 §1국제주의§!, §R사회주의§!, §1사회적 연대§!, §G경제적 평등§!을 바탕으로 §Y발칸 반도§!를 §G통합§!하는 공동 연방 공화국이라는 §Y새로운 정치적 통일체§!를 §G수립§!하는 것이었습니다. 그 근저에 깔린 구상은 §Y발칸 민족들§! 사이에 차이가 있더라도 해방의 역사적 필요가 §Y통일§!의 공통된 토대라는 것이었습니다. 이 정치 개념은 발전 과정에서 세 단계를 거쳤습니다. §Y첫 번째§! 단계에서 이 구상은 §Y20세기§! §G초§! §Y오스만 제국§!의 붕괴에 대한 대응으로 제시되었습니다. §Y두 번째 단계§!, 주로 §R전간기§!(1919~1936년)에는 §Y발칸 연방§!이라는 구상을 §R발칸 공산당들§!이 이어받았습니다. 세 번째 단계는 §R발칸 공산주의 지도자들§!과 §R이오시프 스탈린§!의 충돌로 특징지어지며, 스탈린은 §R제2차 세계 대전 이후§! 시기에 이 구상에 반대했습니다.. 이제 우리는 이 개념으로 돌아가 §Y발칸§!을 강력한 국가로 만들 채비가 되었습니다."
