l_korean:
 earthquake_diplomacy: "지진 외교"
 airspace_violations: "영공 침해"
 GRE_debt_crisis: "부채 위기"
 GRE_debt_crisis_desc: "그리스는 3,000억 달러의 대외 부채를 안고 있으며, 이는 세계에서 가장 큰 규모 중 하나입니다. 부채가 빠르게 늘어나 우리 경제에 막대한 문제를 일으키고 있으므로 이는 우리에게 거대한 문제를 초래했습니다. 사태가 걷잡을 수 없게 되기 전에 부채 문제를 해결할 방법을 찾아야 합니다."
 GRE_drift_modifiers: "Parliament of the Hellenes"
 GRE_debt_modifier: "부채 위기"
 GRE_debt_modifier_desc: "부채 위기는 우리가 자금을 어떻게 관리하느냐에 따라 더 가혹한 영향을 미칩니다. 그러나 일자리를 창출하기 위해 더 많은 돈을 쓰는 것은 장기적으로 우리에게 이득이 될 것입니다."
 GRE_press_opposition: "언론을 적으로"
 GRE_press_opposition_desc: "우리가 정부에 질서를 되찾은 이후로 언론은 우리를 좋은 모습으로 그린 적이 없지만, 약자가 강자를 두려워하는 것은 지극히 논리적입니다."
 GRE_one_party: "일당제 국가"
 GRE_one_party_desc: "KKE만이 그리스에서 허용되는 유일한 정당이라고 선포한 이후, 우리는 원하는 것은 무엇이든 할 힘을 갖게 되었으나, 국민이 복종하도록 보장하기 위해 피를 흘려야 하는 대가를 치릅니다."
 GRE_reorganize_army_idea: "군대 재조직"
 GRE_cracked_foundation_desc: "국가의 토대는 이 시점에서 너무나 많이 훼손되어, 현재의 길을 계속 간다면 끔찍한 새 혁명에 직면할 수 있습니다. \n\n§R안정도가 30% 아래로 떨어지면 그리스에서 혁명이 일어납니다!§!"
 GRE_militarist_education_idea: "군국주의 교육"
 GRE_militarist_education_idea_desc: "교육 체계는 교과 과정에 군사적 가치를 주입하여 갑작스러운 공격에 대비한 더 높은 수준의 준비태세를 가능하게 합니다."
 GRE_elam: "국가인민전선의 복원"
 GRE_elam_desc: "키프로스 국민 전선인 ELAM은 섬 전역에서 우리 이념의 대리인으로 부상했습니다. 니코시아에 자금과 정치적 지원을 보내면 직접 개입 없이도 향후 통일 과정에서 우리의 입지가 강화됩니다."
 GRE_rename_istanbul: "이스탄불 개명"
 GRE_austerity_tension1: "안전함"
 GRE_austerity_tension2: "Major"
 GRE_austerity_tension3: "Civil Uprisings!"
 GRE_CYP_category: "키프로스 분쟁"
 GRE_CYP_category_desc: "Since 1974, Cyprus has been divided between the Turkish Republic of Northern Cyprus and the Republic of Cyprus, following a Greek-backed coup that nearly united the island with Greece. In response, Turkey invaded, resulting in the ongoing partition of Cyprus, the second longest military occupation in the modern era, surpassed only by that in Israel.\n\n§YGreek-Cypriot Strength:§! §C[?145.GRE_SUPPORT]%§!\n§YTurkish-Cypriot Strength:§! §C[?146.GRE_SUPPORT]%§!\n\n§CThe first side to reach 100 strength will unify Cyprus under their rule!§!"
 GRE_guarantee_turkish_property: "Spark Unification Protests across Cyprus"
 GRE_guarantee_turkish_property_desc: "통일에 대한 열망을 불러일으킴으로써 키프로스 전역에 혼란을 일으키고, 튀르크인들이 시위에 대처하느라 바쁜 사이 우리 자신의 세력을 키울 기회를 얻습니다."
 GRE_please_south: "그리스 출신 키프로스인에 우호적인 접근"
 GRE_please_north: "반터키 선전"
 TUR_CYP_incite_riot: "남키프로스에서 시위 조장"
 TUR_CYP_propaganda_north: "북키프로스 반-그리스 선전"
 TUR_CYP_propaganda_south: "남키프로스 반-그리스 선전"
 GRE_failures_capitalism_TT: "§R이 중점의 효과는 부채 위기의 정도에 따라 달라질 것입니다.§!"
 GRE_communist_takeover_TT: "§G그리스 국민이 선거를 요구합니다!§!\n\n이를 위해 충분한 정치력을 확보해 두십시오. 선거를 치러 정부를 구성하는 데 §R실패하면§! §Y[communist_state_L]§!에 힘을 실어 주기 위해 §R또 한 번의 임시 선거를 치러야 합니다§!"
 GRE_fascist_takeover_TT: "§G그리스 국민이 선거를 요구합니다!§!\n\n이를 위해 충분한 정치력을 확보해 두십시오. 선거를 치러 정부를 구성하는 데 §R실패하면§! §Y[Nat_Fascism_L]§!에 힘을 실어 주기 위해 §R또 한 번의 임시 선거를 치러야 합니다§!"
 GRE_civil_units_TT: "§R반군을 저지하기 위해 군대를 중부 그리스 주 경계로 재배치할 것을 권고합니다.§!"
 GRE_worsen_debt_TT: "§R부채 위기를 악화시킬 것입니다!§!"
 GRE_lowers_debt_TT: "§G부채 위기를 완화합니다!§!"
 GRE_end_austerity_TT: "§G금욕 시위가 종료됩니다!§!"
 GRE_increase_drift_TT: "§G이 정당에 대한 정치적 이동 및 변화를 증가시킵니다!§!"
 GRE_south_-5_TT: "§HGreek-Cypriots§! will §RLOSE§! §H5 strength!§!"
 GRE_south_-20_TT: "§HGreek-Cypriots§! will §RLOSE§! §H20 strength!§!"
 TUR_CYP_incite_riot_TT: "§H튀르크계 키프로스인§!의 세력이 §H50%§! 이상임"
 TUR_GRE_support: "§H그리스계 키프로스인§!의 세력이 §H5%§! 이상임."
 GRE_ICBC: "중국공상은행 (ICBC) 대출"
 GRE_ICBC_desc: "중국공상은행은 세계에서 가장 큰 은행 중 하나입니다. 우리의 구매력과 부채의 일부를 중국 은행을 통해 이전하면 베이징과의 협력을 더욱 확고히 하고, 급성장하는 경제를 계속 성장시킬 능력을 확대할 수 있습니다."
 GRE_chi_real_estate: "중국 부동산 투자"
 GRE_chi_real_estate_desc: "중국 투자자들이 그리스 전역, 특히 아테네와 섬 지역의 부동산 매입을 검토하기 시작했습니다. 이러한 외국 자본의 유입은 정부 재정에 대한 압박을 완화하고 추가적인 중국 투자를 유치하여 두 나라 간 경제적 유대를 심화할 수 있습니다."
 GRE_chi_investments: "중국의 투자"
 GRE_chi_investments_desc: "중국은 그리스 전역의 대규모 프로젝트에 관심이 있습니다. 이 프로젝트들은 우리 스스로는 개선할 자원이 없는 경제 분야에 새 활력을 불어넣을 수 있습니다."
 GRE_piraeus: "피레우스항 경매"
 GRE_piraeus_desc: "피레에프스 항만을 매각하는 방안이 정부 인사들 사이에서 논의되었으며, 부채 위기 속에서 이것이 우리에 대한 압박을 다소 완화해 줄 것으로 보입니다."
 GRE_piraeus_corruption: "중국 영향력 축소"
 GRE_piraeus_corruption_desc: "그리스에서 발판을 넓히려는 중국의 계획은 중국의 영향력으로부터 우리의 독립을 위협합니다. 중앙고고학위원회를 구실 삼아 중국의 모든 확장 계획을 그 자리에서 막을 수 있습니다."
 GRE_chi_investments_piraeus: "피레우스항 주변 중국의 투자"
 GRE_chi_investments_piraeus_desc: "중국인들은 피레에프스 항만 주변 지역에 투자하는 데 큰 관심을 보였습니다. 일부는 이 프로젝트가 우리의 대외적 독립에 위험할 수 있다고 지적하지만, 그것은 분명 터무니없는 소리입니다."
 GRE_chi_nationwide_investments: "전국가적인 중국의 투자"
 GRE_chi_nationwide_investments_desc: "중국이 우리나라에 자유롭게 투자하도록 허용함으로써 얻는 이득은 막대합니다. 우리는 중국인이 원하는 대로 투자하도록 허용해야 합니다."
 GRE_invest_elliniko: "엘리니코에 투자"
 GRE_invest_elliniko_desc: "엘리니코는 아테네의 교외 지역으로, 우리가 다른 곳에서 시작한 재활성화 프로젝트에서 소외되었다고 볼 수 있습니다. 이 지역은 관광객의 중심지이기 때문에 특히 중요합니다."
 GRE_unemployed: "실업자 문제"
 GRE_unemployed_desc: "실업을 신중하게 관리함으로써 부채 위기로 일자리를 잃은 이들이 기본적인 생활 수준을 유지하는 데 필요한 돈 없이 방치되지 않도록 보장할 수 있습니다."
 GRE_glass_cannon_economics: "Glass Cannon Economics"
 GRE_glass_cannon_economics_desc: "우리 경제와 국민은 건강한 경제의 혜택을 누리고 있습니다. 국민이 돈을 쓰면 우리나라의 성장에 도움이 됩니다.\n\n단, 경제에 §R불행한§! 일이 일어나지 않는 한 그렇습니다."
 GRE_strength: "The Pillars of Recovery"
 GRE_strength_desc: "부채 위기가 헤드라인을 지배하고 있다 하더라도 그리스는 자산이 바닥난 나라가 아닙니다. 세계 최대의 상선단, 수출에서 정유업 다음가는 제약 부문, 지중해의 어느 곳과도 견줄 만한 관광업, 전 세계 식탁에 오르는 농산물은 실질적이고 견고한 토대입니다. 해외에서 강요한 일괄 긴축이 아니라 표적화된 정책으로 이 산업들을 뒷받침하는 것이 오래가는 회복을 만드는 방법입니다."
 GRE_pharma: "The Generics Powerhouse"
 GRE_pharma_desc: "그리스는 의약 분야에서 규모에 비해 훨씬 큰 존재감을 발휘하며, 비아넥스와 엘펜 같은 기업의 공장에서 제네릭과 브랜드 의약품을 생산하여 수출에서 정유 시설 다음가는 비중을 차지합니다. 이러한 알약과 약병이 유럽과 걸프 지역 시장에 팔리기 때문에, 국내 경제가 휘청거리는 중에도 이 산업은 외화를 벌어들입니다. 연구와 생산 라인에 더 깊이 투자하면 우리의 몇 안 되는 진정한 세계적 수준의 부문 중 하나를 더욱 단단하게 할 수 있습니다."
 GRE_construction_mat: "건축 자재"
 GRE_construction_mat_desc: "펜텔리의 대리석, 섬 지역의 석회암, 트라키아의 골재. 국내 건설 자재를 수출 시장에서 우리 자체 기반시설 프로젝트로 돌리면 비용을 줄이고 돈을 국내에 남길 수 있습니다."
 GRE_austerity: "긴축 캠페인"
 GRE_austerity_desc: "정부 적자는 피할 수 없으며, 곧 행동하지 않으면 경제는 지금보다 더 나쁜 상태에 빠질 것입니다. §R이는 전국에서 폭동을 일으킬 것입니다.§! 그러나 소요를 억누른다면 우리의 재정 상황에 대한 통제권을 되찾을 수 있을지도 모릅니다."
 GRE_turn_century: "세기의 전환점에서"
 GRE_turn_century_desc: "이 새로운 세계에서 우리의 길이 새 천년에 이르면서 정치와 경제를 비롯한 많은 것이 불확실합니다. 이 새로운 시대에 우리나라를 이끄는 것은 우리에게 달려 있습니다."
 GRE_golden_dawn: "황금새벽당"
 GRE_golden_dawn_desc: "극우 정당인 황금새벽당은 민족주의 이념을 중심으로 하며 유럽 전역의 민족주의 운동에 공감을 표하는 정당입니다. 많은 이들이 황금새벽당을 네오나치이자 범죄 조직이라고 비판했지만, 그런 사람들은 거짓말쟁이입니다. 황금새벽당만이 그리스의 유일한 전진의 길이며, 우리는 이 당이 나라의 지도권을 차지하도록 보장해야 합니다."
 GRE_subtle_propaganda_campaigns: "교묘한 선전 캠페인"
 GRE_subtle_propaganda_campaigns_desc: "국민은 황금새벽당이 이루고자 하는 바와 민주주의자들이 어떻게 이 나라를 파괴하고 혼란에 빠뜨렸는지에 대한 진실을 알아야 합니다."
 GRE_open_youth_front: "청년 전선 개방"
 GRE_open_youth_front_desc: "황금새벽당 청년단은 젊은 그리스인에게 규율, 민족주의 교육, 그리고 민주 정당들이 저버린 삶의 목적의식을 심어 줍니다. 청년층의 지지는 모든 지속적인 운동의 토대이며, 우리의 가치관 속에서 자란 세대는 그것을 쉽게 내버리지 않을 것입니다."
 GRE_influence_police: "경찰에 영향"
 GRE_influence_police_desc: "경찰의 지지를 얻는 데 성공한다면 대중의 지지를 더 많이 얻을 수 있으며 정치적 배신자를 더 쉽게 처리할 수 있습니다."
 GRE_committee_national_memory: "민족적 기억을 위한 위원회"
 GRE_committee_national_memory_desc: "우리는 조국을 위해 싸우다 죽은 위대한 민족주의 영웅들을 기리고 국민에게 그들의 원칙을 상기시켜, 모두가 하나의 목표 아래 단결할 수 있어야 합니다."
 GRE_form_golden_dawn_death_legions: "황금새벽당 죽음의 군단 창설"
 GRE_form_golden_dawn_death_legions_desc: "황금새벽당 죽음의 군단은 우리의 주력 준군사 부대가 될 것입니다. 이들은 거리의 배신자들을 청소하고 질서를 집행하며, 필요할 때 적에 맞서 조국의 방어에 나서는 임무를 맡게 됩니다."
 GRE_glorify_regime_of_colonels: "대령의 정권 미화"
 GRE_glorify_regime_of_colonels_desc: "1967년부터 1974년까지 그리스는 흔히 '대령들의 정권'으로 알려진 그리스 군사 정권의 통치를 받았습니다. 대령들의 치하에서 그리스는 급속한 경제 성장, 내부 안정, 나라를 지키는 거대한 군대를 경험했습니다. 따라서 우리는 국민에게 대령들의 업적을 상기시켜야 합니다."
 GRE_golden_greece: "즉각적인 선거 요구"
 GRE_golden_greece_desc: "국민 대다수의 지지를 모은 지금, 이 나라를 이끌 때가 왔습니다. 부패한 정부에 선거를 요구하여 누가 진정으로 통치해야 하는지 보여 줄 것입니다."
 GRE_fund_elam: "국가인민전선에 대한 대규모 지원"
 GRE_fund_elam_desc: "ELAM, 즉 국민 전선은 황금새벽당의 키프로스 자매 정당입니다. 그들이 꿈도 꾸지 못했던 더 많은 자금을 제공함으로써, 적어도 그리스계 키프로스인에게 인기를 얻도록 보장할 수 있습니다."
 GRE_revive_megali_idea: "메갈리 이데아의 부활"
 GRE_revive_megali_idea_desc: "메갈리 이념은 북부 에피루스와 터키 해안 지역과 같은 이전 그리스 영토로 구성된 더 큰 그리스 국가의 개념이었습니다. 메갈리사상을 부활시켜 우리 조상들을 자랑스럽게 만드는 것이 우리의 운명입니다."
 GRE_censor_media: "언론 검열"
 GRE_censor_media_desc: "The media, before we took power, were liars and traitors as they peddled pro-democrat propaganda. Now that we are in power, we shall replace the democrat lies with our own state-controlled media which will publish only the truth."
 GRE_one_religion: "유일 종교"
 GRE_one_religion_desc: "정교회 기독교는 우리의 국교이며 우리 유산의 중요한 일부입니다. 우리는 무슨 수를 써서라도 우리 종교에 더 큰 비중을 두어야 합니다."
 GRE_oppress_political_opposition: "정치적 야당 탄압"
 GRE_oppress_political_opposition_desc: "우리는 나라를 팔아넘긴 배신자들과 반그리스 인사들을 모조리 뿌리 뽑아야 합니다. 황금새벽당이 그리스에서 제5열을 쓸어낼 것입니다."
 GRE_army_first: "군 우선 정책"
 GRE_army_first_desc: "군대와 그 확장을 우선시하는 정책을 채택함으로써, 평범한 그리스인의 지지가 없더라도 통제권을 유지할 수 있습니다. 물론 그런 일은 결코 일어나지 않을 것입니다."
 GRE_economic_control: "경제적 통제"
 GRE_economic_control_desc: "이전 정부들은 그리스의 부채를 치솟게 하여 경제를 확실히 파괴했습니다. 이를 다시 막으려면 경제에 대한 직접 통제를 늘려야 합니다."
 GRE_anti_migrant_policies: "반이민 정책"
 GRE_anti_migrant_policies_desc: "이민자들은 그리스인이 더 잘 활용할 수 있는 자원을 빼앗아 갑니다. 우리는 그들이 어머니 그리스를 이렇게 퇴보시키도록 내버려 둘 수 없습니다."
 GRE_metaxism: "메탁사스주의"
 GRE_metaxism_desc: "우리는 메탁사스 정권, 특히 그가 지지했던 정책인 조합주의, 노동 계급을 위한 혜택, 그리스 민족의 우선을 크게 본받습니다. 우리가 억눌러야 할 것은 메탁사스가 품었던 반제국주의 정서뿐입니다."
 GRE_depart_ecomomic_migrants: "Deport Economic Migrants"
 GRE_depart_ecomomic_migrants_desc: "이제 우리는 반이민법 제정을 시작했으므로 경제적 이주민들을 본국으로 추방하는 작업을 시작해야 합니다."
 GRE_metaxas_policies: "멕탁사스주의 정책"
 GRE_metaxas_policies_desc: "1936년 8월 4일 쿠데타의 결과로 권력을 잡은 이오아니스 메탁사스는 황금새벽당에게 커다란 영감입니다. 그는 그리스 국민을 영광으로 이끌고 제2차 세계 대전에서 추축국에 저항한 그리스 역사상 가장 위대한 지도자 중 한 명이었습니다. 그를 기리기 위해 그의 정책을 다시 살펴봐야 합니다."
 GRE_dissolve_plutocracy: "금권 정치 해소"
 GRE_dissolve_plutocracy_desc: "너무 오랫동안 우리 경제는 민주정권과 외국인들에 의해 착취당해 왔습니다. 이제 이 시스템을 완전히 파괴할 때입니다."
 GRE_increase_agricultural_production: "농업 생산 증가"
 GRE_increase_agricultural_production_desc: "농업은 오랫동안 그리스에서 가장 크고 성공적인 부문이었습니다. 농업 부문에 투자하여 이를 더욱 강하게 만들어야 합니다."
 GRE_exploit_and_export: "채굴 및 수출"
 GRE_exploit_and_export_desc: "우리나라에는 개발되지 않은 천연자원이 가득하며, 우리는 이를 나라를 위해 신속하게 채굴해야 합니다."
 GRE_revise_national_debt: "국채 조정"
 GRE_revise_national_debt_desc: "민주주의자들은 그리스의 부채를 3,000억 달러까지 끌어올렸습니다. 이는 경제에 문제를 일으키고 있습니다. 따라서 이 엄청난 부채에서 벗어나기 위해 협상할 필요가 있습니다."
 GRE_nationalize_resources: "자원 국유화"
 GRE_nationalize_resources_desc: "현재 많은 외국 기업이 우리나라의 천연자원을 쥐고 있습니다. 이는 용납할 수 없습니다. 우리는 그리스 내 모든 외국 자산을 몰수할 것입니다."
 GRE_trade_agreements: "무역협정"
 GRE_trade_agreements_desc: "그리스의 무역 능력은 매우 낮으며, 이는 현대 세계에서 우리가 충분히 경쟁력이 없기 때문입니다. 우리는 더 많은 나라에 우리 제품을 수출할 수 있도록 무역 협정을 체결할 것입니다."
 GRE_nationalize_banks: "은행 국유화"
 GRE_nationalize_banks_desc: "경제 통제 구상의 일환으로, 은행은 우리가 활용할 수 있는 귀중한 자산을 보유하고 있으므로 국가가 국유화해야 합니다."
 GRE_force_germany_to_pay_debt_taken_from_occupation: "독일 점령 부채 상환 강제"
 GRE_force_germany_to_pay_debt_taken_from_occupation_desc: "제2차 세계 대전 중 독일의 그리스 점령은 매우 잔혹했으며, 독일은 그리스의 상당 부분을 파괴했고 우리에게 한 번도 상환되지 않은 3,000억 달러의 배상금을 빚지고 있습니다. 오늘 우리는 그들에게 그 사실을 상기시킬 것입니다."
 GRE_russia: "러시아와 무역"
 GRE_russia_desc: "러시아는 우리 모두 정교회 기독교 국가이므로 역사적 동맹이며, 역사 속에서 우리를 여러 번 도왔습니다. 따라서 러시아인과의 무역 관계를 늘려야 합니다."
 GRE_china: "중국과 무역"
 GRE_china_desc: "이념은 다르지만, 중국은 우리와 같은 민족주의 정권을 지지하며 세계적인 무역 강국입니다. 우리는 중국과의 경제적 유대를 늘려야 합니다."
 GRE_iran: "이란과 무역"
 GRE_iran_desc: "이란이 우리나라와 공통점이 많지 않을 수 있지만, 우리는 비슷한 목표를 많이 공유하고 있으며 서로 간의 협력을 키워야 합니다."
 GRE_of_continents_seas: "A Greece of Two Continents and Five Seas"
 GRE_of_continents_seas_desc: "메갈리 이데아는 에게해, 이오니아해, 지중해, 흑해, 마르마라해라는 두 대륙과 다섯 바다에 걸친 그리스를 구상합니다. 우리 해군은 그 야망에 걸맞은 전력으로 재건되어, 한때 그리스의 것이었던 모든 바다에서 힘을 투사할 수 있어야 합니다."
 GRE_resolve_naming_dispute: "Resolve the Naming Dispute"
 GRE_resolve_naming_dispute_desc: "마케도니아 명칭 분쟁은 워낙 사소한 문제여서 북마케도니아를 합병하면 간단히 해결된다."
 GRE_strike_albania: "알바니아 공격"
 GRE_strike_albania_desc: "북에피로스의 그리스 소수 민족은 1913년부터 알바니아의 통치를 견뎌 왔습니다. 그들의 언어는 억압당하고 교회는 폐쇄되었으며 재산은 몰수되었습니다. 한 세기에 걸친 외교적 항의는 아무것도 이루지 못했습니다. 이 문제는 우리 스스로 해결합니다."
 GRE_strike_bulgaria: "불가리아 공격"
 GRE_strike_bulgaria_desc: "비잔티움 선교사들은 슬라브 민족의 첫 문어, 즉 훗날 불가리아어가 될 문자를 개발했습니다. 트라키아와 마케도니아의 슬라브 민족은 어떤 불가리아 국가가 존재하기 훨씬 전부터 헬레니즘 문명에 편입되어 있었습니다. 이 작전은 전쟁이라기보다는 귀향에 가깝습니다."
 GRE_greater_greece: "대그리스"
 GRE_greater_greece_desc: "그리스는 역사상 가장 강력한 여러 국가의 중심이었으며, 그 유산을 이어 가지 않는다면 그 유산을 욕되게 하는 것입니다."
 GRE_great_greece: "대그리스"
 GRE_great_greece_desc: "우리는 역사상 가장 위대한 제국들마저 멸망으로 이끈 호전적인 길을 걷지 않을 것입니다."
 GRE_agriculture_focus: "농업 집중"
 GRE_agriculture_focus_desc: "농업은 그리스 경제에서 가장 강력한 요소 중 하나이며, 우리는 올리브유 같은 제품의 상당 부분을 공급합니다. 우리 제품을 세계 나머지 지역에 온전히 수출할 수 있도록 농업에 더 많은 돈을 투자해야 합니다."
 GRE_greater_state_control: "대그리스 경제적 통제"
 GRE_greater_state_control_desc: "자유 시장은 그리스를 실패하게 했습니다. 자본은 가장 필요한 때 도피했고, 민간 은행은 주주 수익을 지키기 위해 신용을 거둬들였으며, 외국인 소유주는 국가 비상사태 속에서 이윤을 챙겨 갔습니다. 전략 산업에 대한 직접적인 국가 통제는 경제적 결정을 있어야 할 곳으로 되돌려 놓습니다."
 GRE_kke: "그리스 공산당"
 GRE_kke_desc: "KKE(그리스 공산당)는 마르크스-레닌주의 사상에 기반한 극좌 정당으로, 외세 제국주의에 강력히 맞서고 있습니다. 불평등을 없애고 노동자의 권리를 보장하며, 진정한 사회주의 사회를 건설하고자 합니다. 우리 모두 KKE 아래 결집하여 조국을 앞으로 이끌어 나아갑시다!"
 GRE_communist_education: "공산주의 교육"
 GRE_communist_education_desc: "젊은 정신은 가장 영향을 받기 쉽습니다. 젊은 세대에게 공산주의의 기본 가치를 심어 주고, 대학생들에게 평등의 영광을 가르친다면 우리의 대의를 크게 진전시킬 수 있을 것입니다."
 GRE_labour_focus_unions: "노동 조합에 연락"
 GRE_labour_focus_unions_desc: "협력할 뿐만 아니라 요구까지 수용하는 정부를 맞이하게 되어 노동조합은 매우 기뻐할 것입니다. 다만 §R이해 충돌§!을 피하기 위해, 그들의 영향력이 우리의 집권 이후까지 미치지 않도록 하겠습니다."
 GRE_failures_capitalism: "자본주의의 실패"
 GRE_failures_capitalism_desc: "자본주의는 더 이상 약속했던 무한한 부를 가져다주지 않습니다. 이제 우리만의 길을 걸어 이러한 위기가 다시는 일어나지 않도록 할 때입니다! §R이 중점의 효과는 부채 위기의 규모에 따라 달라집니다.§!"
 GRE_working_class: "노동계급"
 GRE_working_class_desc: "노동 계급은 꿈이 태어나고 또 죽어 가는 곳입니다. 우리는 그들이 새로운 공산 국가의 토대로서 합당한 대우와 공로를 인정받게 될 것을 약속할 수 있습니다."
 GRE_communist_propaganda: "선전 기계"
 GRE_communist_propaganda_desc: "영향력이 확대된 덕분에 그리스에 선전 기구를 풀어놓을 여유가 생겼습니다. 유지 비용이 막대하기는 하나, 이 선전은 결코 간과해서는 안 되며 그리스 국민을 설득하는 데 극히 효과적일 것입니다."
 GRE_prepare_government: "정부 준비"
 GRE_prepare_government_desc: "당 내부에 정부 조직을 미리 갖추어 두면, 경쟁자들이 정비를 마치기도 전에 우리의 목표를 실행에 옮길 수 있는 효과적인 이행이 가능해집니다. 비용은 많이 들겠지만 승산을 고려하면 충분히 가치 있는 도박입니다."
 GRE_damn_market: "빌어먹을 자유 시장"
 GRE_damn_market_desc: "우리는 자본가들에게 최후의 일격을 가할 위치에 있습니다. 선전의 힘을 등에 업고 자유 시장 경제에 치명타를 가할 수 있으며, 그 과정에서 자본가들이 앉아 있는 과잉의 왕좌를 찬탈할 수 있습니다!"
 GRE_election_com: "즉각적인 선거 요구"
 GRE_election_com_desc: "동지여, 지금입니다. 공산주의 국가를 향한 지금까지의 모든 순간들이 하나로 모여 우리의 미래를 주도하고 있습니다! \n\n§R우리는 앞으로 1000년 동안 인민들의 정부를 이끌 것이라고 장담합니다!§!"
 GRE_com_democratic: "민주공산주의"
 GRE_com_democratic_desc: "가장 참된 공산주의는 평범한 노동자가 직접 지도자를 정부에 선출하도록 하는 것이며, 이 권리를 박탈하는 것은 공산주의 본질에 대한 배신입니다."
 GRE_com_authoritarian: "독재적 공산주의"
 GRE_com_authoritarian_desc: "국민은 거짓말과, 지켜진다 해도 그들에게 영향을 미치지 못할 자의적인 공약에 너무 쉽게 속아 넘어갑니다. 쉽게 조종당하는 대중에게 그리스의 미래를 맡기는 것은 위험 부담이 너무 크며 지나치게 위험합니다."
 GRE_handle_bankers: "은행가들 처리"
 GRE_handle_bankers_desc: "자본가는 공산 국가에 설 자리가 없습니다. 그들이 부당하게 얻은 재산을 즉시 재분배해야 합니다."
 GRE_com_constitutionalism: "공산 입헌주의"
 GRE_com_constitutionalism_desc: "우리는 누구도 국민의 투표권 등을 침해할 수 없도록 새 헌법을 기초할 것입니다. 다만 이는 국가 원수의 권한이 약해진다는 의미이기도 합니다."
 GRE_government_purge: "정부 제거"
 GRE_government_purge_desc: "우리는 정부를 완전히 장악하여 그리스를 통치할 수 있는 유일한 정당으로 자리매김할 것입니다. 파시스트들은 도처에 숨어 있으며, 우리가 힘들게 건설하는 이상향을 무너뜨리려 획책하고 있습니다!"
 GRE_curtail_corruption: "부패 축소"
 GRE_curtail_corruption_desc: "우리의 집권은 권력 공백을 만들었고 사람들은 이를 채우려 안달이 나 있습니다. 우리 정부가 순수함을 유지하고 국민에게 헌신하도록 해야 합니다."
 GRE_promote_local: "지역 산업 추진"
 GRE_promote_local_desc: "안타깝게도 현대 공산 국가는 생존을 위해 자본주의적 개념을 국가에 도입해야 합니다. 지역 기업은 경제의 근간이며, 우리의 꿈을 이루기 위해서는 그 근간을 강화해야 합니다."
 GRE_investment_effort: "기반시설 투자"
 GRE_investment_effort_desc: "도로, 철도, 송전선은 생산적인 경제의 골격입니다. 수년간의 투자 부족으로 전국 시장에서 고립된 지역이 곳곳에 생겨났습니다. 국가 주도의 기반시설 지출은 민간 부문이 결코 메우지 않았을 공백을 채워 줄 것입니다."
 GRE_subsidize_farmers: "농부에게 보조금 지급"
 GRE_subsidize_farmers_desc: "그리스 농민들은 수년간 EU의 수입 쿼터, 늘어나는 부채, 가격 면에서 대적할 수 없는 해외 경쟁에 시달려 왔습니다. 종자, 장비, 농촌 신용에 대한 직접 보조금은 그들이 현대화를 이루고 농지를 계속 생산적으로 유지할 숨통을 틔워 줄 것입니다."
 GRE_abandon_army: "군대를 버려라"
 GRE_abandon_army_desc: "현재 군대는 국가의 짐일 뿐입니다. 이 군대가 실제로 제 역할을 할 일이 거의 없기에, 우리의 필요대로 군대를 개혁하고 축소하는 것이 유일한 효과적인 방법일 것입니다."
 GRE_reorganize_army: "군대 재조직"
 GRE_reorganize_army_desc: "낡은 장교단은 이전 정부 덕분에 계급을 얻었습니다. 그러한 충성심을 뿌리 뽑고, 이미 죽은 헌법이 아니라 당에 복종하는 이들을 중심으로 지휘 체계를 재건해야 합니다."
 GRE_silence_press: "언론 침묵"
 GRE_silence_press_desc: "우리는 폭군이 아니라 해방자입니다. 언론이 세뇌되어 이를 깨닫지 못한다면, 우리가 직접 나서서 해결해야 합니다."
 GRE_extend_education: "교육 확장"
 GRE_extend_education_desc: "우리 국민은 최고의 교육을 받을 자격이 있으며, 이는 더 고급 직업을 맡을 수 있는 잘 교육받은 인력의 비축분을 확보하기 위해서이기도 합니다."
 GRE_com_resources: "천연 자원 개발"
 GRE_com_resources_desc: "기반시설이 갖추어졌으니 이제 국영 기업이 천연자원을 대규모로 채굴하고 가공할 수 있습니다. 한때 민간 주주의 이윤을 창출하던 광산, 채석장, 에너지 매장지가 이제는 공공 복지의 재원이 될 것입니다."
 GRE_farmer_tax: "농민 감세"
 GRE_farmer_tax_desc: "더 많은 사람이 이 직업에 뛰어들도록 장려할 뿐 아니라, 농민들이 더 큰 수익을 얻어 더 효율적인 생산 방식과 더 넓은 농지로 사업을 확장할 수 있도록 농민에게 세금 면제를 부여해야 합니다."
 GRE_new_army: "새로운 군대"
 GRE_new_army_desc: "우리는 군대를 개혁하다 못해 내부 치안 면에서 경찰력이 군대를 대체하기에 이르렀습니다. 그러나 우리의 말을 뒷받침할 진정한 무력이 없다면 어떻게 영향력을 투사할 수 있겠습니까? 사용되지 않더라도, 새로운 그리스에 걸맞은 새 군대를 건설하기 시작해야 합니다."
 GRE_red_army: "붉은 군대"
 GRE_red_army_desc: "우리는 새로운 붉은 군대의 대열 깊숙이 공산주의 정신이 자리 잡도록 할 것입니다. 이러한 이념적 광신은 국가에 충성하며 그리스의 사회주의를 지키기 위해 끝까지 싸우는 군대를 만들어 내므로 우리에게 유리하게 작용할 것입니다."
 GRE_pacify_unions: "노동 조합 달래기"
 GRE_pacify_unions_desc: "우리는 노동조합에 지나친 힘을 실어 준 나머지, 그들이 갈수록 사소한 일을 구실로 국가를 여러 층위에서 교란하고 있습니다. 우리 당은 국민에게 헌신하지만, 국민이 일자리를 구하려면 제대로 돌아가는 경제가 필요합니다. 따라서 법적으로 간섭을 금지해야 하는 상황에 이르기 전에 노동조합에 자제를 요청해야 합니다."
 GRE_purge_unions: "노동 조합 제거"
 GRE_purge_unions_desc: "노동조합은 절제와 충성심을 보여 주지 못했으며, 우리의 관용에도 한계가 있습니다."
 GRE_militarist_education: "군국주의 교육"
 GRE_militarist_education_desc: "교육 과정에 군사 교육을 도입함으로써, 극단적인 상황이 닥쳤을 때 일반 국민이 징집에 적합하도록 준비시킬 수 있습니다."
 GRE_balkan_diplomacy: "발칸 외교"
 GRE_balkan_diplomacy_desc: "이제 우리의 진정한 야망을 깨달을 때입니다. 그리스는 공산주의 아래에서 번영했으며, 비록 슬라브계로 여겨지지는 않지만 정교회를 따르고 발칸에 위치해 있습니다. 어쩌면 우리의 문화적 중립성이 그러한 국가의 안정을 보장할지도 모릅니다. \n\n그리스-슬라브 국가를 말입니다."
 GRE_balkan_hegemony: "발칸 패권"
 GRE_balkan_hegemony_desc: "그러한 국가를 세우려던 지난 두 차례의 시도는 실패했습니다. 그러나 통합은 언제나 무력이 아닌 외교를 통해 이루려 했습니다. 다른 발칸 국가들을 정복할 힘조차 없었다면, 그들을 한데 묶어 두려고 애써 볼 이유가 있겠습니까? 우리는 내부 외교를 통해 그러한 국가를 유지할 수 있다고 확신합니다. 다만 먼저 불가피한 충돌을 치러 내는 것이 순서일 뿐입니다."
 GRE_constitution: "The Constitution"
 GRE_constitution_desc: "헌법은 우리가 권력을 공고히 하고 우리가 구상하는 방식으로 그리스를 재건하기 전에 처리해야 할 마지막 과제입니다."
 GRE_european_communists: "유럽의 공산주의자"
 GRE_european_communists_desc: "소련의 종말과 공산 진영의 몰락 이후에도 공산주의는 발칸에 흔적을 남겼습니다. 충분한 힘과 책략이 있다면 동지들이 남긴 횃불을 다시 밝힐 수 있을 것입니다. 불을 붙일 불꽃 하나만 있으면 됩니다."
 GRE_bulgaria: "불가리아에 혁명 전파"
 GRE_bulgaria_desc: "한때 번영하던 공산 국가였던 불가리아는 소련 붕괴 이후 길을 잃었습니다. 그들이 우러러보고 따를 또 다른 국가를 제시한다면 공산주의가 다시 뿌리내릴 수 있을 것입니다."
 GRE_albania: "알바니아에 혁명 전파"
 GRE_albania_desc: "알바니아는 수많은 고난을 겪은 나라입니다. 보호와 경제 개발 지원을 제공하면 어느 정도 주권을 존중하면서도 알바니아 국민의 마음을 얻기에 충분합니다."
 GRE_macedonia: "마케도니아에 혁명 전파"
 GRE_macedonia_desc: "마케도니아는 한때 유고슬라비아의 일부로서 세르비아와 같은 공산주의를 누렸으나, 유고슬라비아가 해체되고 문화적 '오해'가 생기면서 공산주의의 길을 버렸습니다. 이러한 오해를 풀어 주면 국민들이 다시 사회주의 정부를 지지하게 될 것입니다."
 GRE_serbia: "세르비아에 혁명 전파"
 GRE_serbia_desc: "세르비아는 공산 통치 시기에 유고슬라비아의 중심이었습니다. 세르비아인들이 민족주의 이념을 받아들였지만 여전히 공산주의에 동조하는 이들이 있으며, 이 나라는 혁명을 확산시키기에 완벽한 대상입니다."
 GRE_romania: "루마니아에 혁명 전파"
 GRE_romania_desc: "루마니아는 자원과 군사력이 풍부합니다. 그들에게 혁명을 확산시키면 공산주의가 발칸에 다시 자리 잡았음을 세계에 확실히 보여 줄 것입니다."
 GRE_dictatorship: "독재의 시작"
 GRE_dictatorship_desc: "적들을 무찔렀으니 이제 마침내 나라를 언제나 그래야 했던 방식으로 운영하기 시작할 수 있습니다."
 GRE_cypriot_question: "키프로스에 대한 의문"
 GRE_cypriot_question_desc: "긴장이 끓는점에 이르렀으니 지금 행동해야 합니다. §R이는 우리를 튀르키예 및 그 동맹국과의 전쟁으로 이끌 것입니다§!. 그러나 핵심 영토 대부분을 유지한 채 30일 이내에 키프로스를 장악한다면 평화 조약을 체결할 수 있을지도 모릅니다."
 GRE_turkish_trade: "터키와의 무역"
 GRE_turkish_trade_desc: "두 나라 사이의 좋은 관계를 증진하는 가장 좋은 방법 중 하나는 서로 경제적으로 협력하는 것입니다. 튀르키예와의 무역을 촉진하면 양국 모두 아무런 비용 없이 이익을 얻게 될 것입니다."
 GRE_settle_eez_dispute: "배타적 경제수역 분쟁 해결"
 GRE_settle_eez_dispute_desc: "그리스와 튀르키예 사이의 EEZ 분쟁은 어느 쪽에도 이익이 되지 않은 채 질질 끌어 왔습니다. 양쪽 해역에서 자유 무역을 촉진하고 공평한 자원 공유 체계에 합의한다면 이 갈등을 매듭짓고 그 에너지를 협력에 돌릴 수 있습니다."
 GRE_increased_privatization: "민영화 확대"
 GRE_increased_privatization_desc: "그리스 산업 부문의 민영화를 확대하면 산업을 강화하고, 고용 기회를 늘리며, 그리스 경제 전반을 강화하는 데 도움이 될 수 있습니다."
 GRE_leadership: "영원한 리더쉽"
 GRE_leadership_desc: "우리의 지도자 니콜라오스 미할롤리아코스는 그리스 국민을 단결시키고 완벽한 그리스 사회를 만들어 냈습니다. 니콜라오스 미할롤리아코스와 황금새벽당은 그리스를 평생 통치해야 합니다."
 GRE_new_greece_old_ways: "새로운 그리스, 전통의 질서"
 GRE_new_greece_old_ways_desc: "For decades we have been ruled by governments which have plunged our country into chaos. Now the Greek people demand change, so that we can return to the days we were renowned across the world."
 GRE_draft_youth_wing: "청년단 동원"
 GRE_draft_youth_wing_desc: "청년층의 지지가 늘어난 만큼 이들을 준군사 조직으로 편성하여 혁명의 적들로부터 조국을 지키도록 해야 합니다."
 GRE_foreign_relations: "대외 관계"
 GRE_dev_cyp: "키프로스 발전"
 GRE_the_hellenic_republic: "그리스 공화국"
 GRE_the_hellenic_republic_desc: "현재 우린 혼란에 직면해 있지만, 우린 문제를 해결하기 위해 민주주의의 이념을 버리고 독재 국가가 되지 말아야 할 것입니다. 이는 그리스의 남녀노소 모든 시민들을 배반하는 행위와 마찬가지이기 때문입니다."
 GRE_discredit_eu: "유럽 연합 비난"
 GRE_discredit_eu_desc: "우리의 이상을 지키기 위해서는 국민에게 민주주의의 진정한 가치를 보여 주고 급진주의를 자유에 대한 위협으로 규탄해야 합니다."
 GRE_support_eu: "유럽 연합과 한편에"
 GRE_support_eu_desc: "유럽 연합은 국가 간 협력과 민주주의 가치를 증진하고, 급진주의를 규탄하며, 평화로운 유럽을 지향합니다. 그리스는 유럽 연합과의 유대를 강화해야 합니다."
 GRE_dominant_party_desc: "모든 민주 국가와 마찬가지로 정당은 우리나라 정치에서 큰 역할을 하며, 어느 정당이 조국을 앞으로 이끌지 현명하게 선택해야 합니다."
 GRE_dominant_party: "다수 정당"
 GRE_new_democracy: "신민주주의당"
 GRE_new_democracy_desc: "중도우파 정당인 '신민주주의당'은 모든 집권기에 역량을 입증했고 우리의 전통을 지키려는 이상을 가졌으므로 그리스를 이끌기에 가장 적합한 정당입니다."
 GRE_socialist_coalition: "급진좌파연합 (SYRIZA)"
 GRE_socialist_coalition_desc: "그리스의 주요 정당들은 나라를 실패로 이끌어 경제 파국에 빠뜨렸고 우리 사회를 분열시켰습니다. 그리스에는 국민을 이끌 새로운 정당이 필요하며, 우리는 국민의 편에 서서 이전 정부들의 정책에 반대하는 좌파 정당 SYRIZA 아래 결집할 것입니다."
 GRE_economic_liberalism: "경제적 자유주의"
 GRE_economic_liberalism_desc: "그리스 경제를 강화하려면 경제적 자유주의가 우리의 최우선 과제가 되어야 합니다. 이는 무역을 늘리고 고용 기회와 같은 더 큰 경제적 이익을 국민에게 가져다줍니다."
 GRE_anti_migration_policies: "반이민 정책"
 GRE_anti_migration_policies_desc: "최근 몇 년간 그리스는 많은 수의 이민자를 끌어들였습니다. 정부는 경제적 기회를 찾아 그리스에 오는 이민자는 용인하지만, 우리가 우려하는 것은 불법 이민자이며 그 비율이 서서히 늘어나고 있어 더 강력한 제한을 마련해야 합니다."
 GRE_counter_radicals: "급진주의 영향력 공격"
 GRE_counter_radicals_desc: "그리스에서는 급진 정당들의 인기가 서서히 높아지고 있으며, 이들의 주된 목표는 우리나라가 만들어 낸 이념인 민주주의를 파괴하는 것입니다. 이들 정당은 특정 집단에 대한 조직적인 공격 때문에 범죄 조직으로 간주되기도 합니다. 민주주의를 지키려면 급진 정당의 영향력에 맞서야 합니다."
 GRE_increase_corruption_measures: "반부패 조치"
 GRE_increase_corruption_measures_desc: "그리스는 오랫동안 정부 전 부문에 걸친 부패 문제를 안고 있었으며, 이는 국가에 많은 문제를 야기했습니다. 더 나은 행정을 만들려면 정부의 부패를 뿌리 뽑아야 합니다."
 GRE_increase_industrial_privatization: "민영화 확대"
 GRE_increase_industrial_privatization_desc: "그리스의 공공 체계는 그리스에서 가장 큰 부문 중 하나입니다. 그리스의 민간 부문이 상대적으로 취약하다는 점에서 이는 오랫동안 문제를 만들어 왔으며, 다른 나라에 비해 경쟁도 거의 없습니다. 경제를 성장시키려면 공공 부문에서 벗어나 민간 부문을 받아들여야 합니다."
 GRE_reinforce_justice: "사법제도에 영향 행사"
 GRE_reinforce_justice_desc: "우리나라의 많은 지역에서는 적절한 법 집행이 부족하여 범죄가 만연해 있습니다. 정부는 그리스의 범죄율을 줄이기 위해 사법 제도를 강화해야 합니다."
 GRE_begin_changing_education_system: "교육 체계 개혁"
 GRE_begin_changing_education_system_desc: "그리스의 교육 체계는 학교, 재정, 그리고 낮은 기술 수준의 사람들을 위한 기회 면에서 다른 유럽 국가들에 비해 크게 뒤처져 있습니다. 현대적인 교육 체계를 갖추려면 대대적인 개혁을 단행하고 아이들을 위한 더 나은 환경을 조성해야 합니다."
 GRE_worker_rights: "노동자 권리"
 GRE_worker_rights_desc: "우리 정책의 일환으로, 그리스의 모든 노동자의 불평등을 줄이기 위해 노동자의 권리를 확대할 것입니다."
 GRE_question_eu_policies: "유럽연합 정책에 대한 의문"
 GRE_question_eu_policies_desc: "우리는 유럽 연합이 유익하다고 믿지만, 경제 통제 강화와 같은 그들의 정책 다수는 받아들일 수 없습니다. 이러한 정책이 존재하는 한 유럽 연합은 우리에게 아무런 이익도 주지 못할 것입니다."
 GRE_left_united: "좌파의 단결"
 GRE_left_united_desc: "우리 당은 좌파의 여러 갈래로 구성되어 있으며 이는 오랫동안 당내 문제를 일으켜 왔습니다. 따라서 좌파를 진정으로 하나로 통합하기 위해 당의 단결을 강화해야 합니다."
 GRE_support_the_public_sector: "민간 부문 지원"
 GRE_support_the_public_sector_desc: "공공 부문은 그리스에서 가장 큰 부문이며 엄청난 수의 사람을 고용하고 있습니다. 공공 부문을 강화하고 현대화하면 더 많은 고용 기회와 정부에 대한 더 큰 지지를 가져올 수 있습니다."
 GRE_remind_the_failures_of_pasok_and_new_democracy: "범그리스 사회주의 운동과 신민주주의당의 실패"
 GRE_remind_the_failures_of_pasok_and_new_democracy_desc: "우리는 그리스 국민에게 PASOK과 신민주주의당의 실패를 상기시켜야 합니다. 이들은 경제적·사회적 불평등을 심화시키고, 대외 부채를 3,000억 달러까지 늘리고, 부채 위기를 초래하고, 부패율마저 높였습니다. 그리스 국민이 그들의 참사를 잊지 않았다는 것을 알려야 합니다."
 GRE_encourage_agricultural_growth: "농업 발전 장려"
 GRE_encourage_agricultural_growth_desc: "농업은 단연 우리 경제에서 가장 크고 강력한 부문이며, 다른 나라로의 수출품 다수가 올리브유와 같은 농산물입니다. 농업에 대한 자금 지원을 늘리면 우리 경제가 활성화되고 해외 수출도 늘어날 것입니다."
 GRE_the_greek_crisis: "부채 위기의 해결책"
 GRE_the_greek_crisis_desc: "막대한 부채 때문에 우리 경제는 붕괴 직전에 있습니다. 따라서 그리스 경제를 살리기 위해 과감한 조치를 취해야 합니다."
 GRE_enact_austerity_measures: "긴축 정책 제정"
 GRE_enact_austerity_measures_desc: "긴축 조치를 시행하면 경제 붕괴를 막을 수 있겠지만, 국민들은 이러한 조치를 가볍게 받아들이지 않을 것입니다."
 GRE_reduce_education: "교육 예산 감축"
 GRE_reduce_education_desc: "긴축 프로그램의 일환으로, 경제 회복에 필요한 자금을 더 확보하기 위해 교육 체계에 대한 지원을 줄여야 합니다. 안타깝게도 이는 그리스 교육 체계의 효율을 떨어뜨리겠지만, 결국에는 우리나라에 도움이 될 것입니다."
 GRE_reduce_health: "보건 의료 예산 감축"
 GRE_reduce_health_desc: "그리스 의료 체계에 투입되는 자금은 우리 경제가 감당하기에 너무 많습니다. 의료 자금을 줄이면 경제에 도움이 될 수 있으나, 그 대가로 국민이 입원했을 때 열악한 환경에 놓일 수 있습니다."
 GRE_reduce_welfare: "복지 예산 감축"
 GRE_reduce_welfare_desc: "우리나라는 복지에 막대한 투자를 해 왔으며, 이는 국민의 삶의 질을 높였지만 경제를 강화하는 데 꼭 필요한 자금을 줄이기도 했습니다. 경제를 살리려면 우리나라가 자랑해 온 복지 국가를 끝내야 합니다."
 GRE_reduce_army: "군비 예산 감축"
 GRE_reduce_army_desc: "최근 몇 년간 우리나라가 가까운 시일 내에 전쟁에 나서지 않을 것이므로 군사 지출 확대의 필요성은 힘을 잃었습니다. 따라서 경제의 더 중요한 부문을 강화하기 위해 군 예산의 일부를 줄이는 것이 현명할 것입니다."
 GRE_recovery: "경제 회복"
 GRE_recovery_desc: "어려운 결정과 혹독한 긴축 조치 끝에, 우리나라는 경제 쇠퇴를 멈추고 막대한 부채도 줄여 냈습니다. 우리나라가 제국의 시대처럼 다시 위대해지기를 모두 함께 바랍시다."
 greece.1.t: "대중의 혼란속에 제정된 긴축 정책"
 greece.1.d: "오늘 그리스 정부는 EU 부채 구제 금융을 이행하기 위해 새로운 긴축 조치를 시행했습니다. 이어서 \\"긴축은 반그리스적이다\\"와 같은 팻말을 든 시민들의 분노가 터져 나왔습니다. 이 폭동은 그리스의 상황을 악화시킬 뿐이며, 이는 빙산의 일각일 뿐이라고 추정할 수 있습니다."
 greece.1.a: "I have a bad feeling about this."
 greece.2.t: "거리의 폭동!"
 greece.2.d: "오늘 아테네에서 경찰이 날로 불어나는 군중을 통제하려 하자 시위가 폭력적으로 변했습니다. 군중이 더 큰 파괴를 일으키지 못하도록 최루탄과 고무탄이 사용되었고 군중은 결국 물러났으나, 긴장은 여전히 감돌고 있습니다."
 greece.2.a: "그들이 움직이기 시작했다!"
 greece.3.t: "심각해지는 사태"
 greece.3.d: "군중은 더욱 불어났고 불만을 점점 더 드러내고 있습니다. 상황이 악화되기만 했다는 것은 의심할 여지가 없습니다."
 greece.3.a: "어떻게 이럴 수가 있지?"
 greece.4.t: "그리스의 새로운 선거를 진행하는 황금새벽당"
 greece.4.d: "지지율이 오른 극우 정당 황금새벽당이 정부에 선거 실시를 요구했으며, 그리스 정부는 국민의 높은 지지와 정부 내부의 압박으로 이 요구에 동의했습니다. 황금새벽당은 높은 지지를 얻고 있어 승리할 것으로 예상되며, 정부가 당의 승리를 허용하지 않으면 당이 지지자들과 함께 정부에 보복하겠다고 위협해 왔습니다."
 greece.4.a: "새로이 밝아오는 그리스의 새벽"
 greece.4.b: "흥미롭군"
 greece.5.t: "그리스에서 새로운 선거를 진행하는 그리스 공산당"
 greece.5.d: "그리스 노동 계급과 여러 정치인들의 과반 지지를 얻은 KKE(그리스 공산당)가 정부에 선거 실시를 요구했으며, 그리스 정부는 KKE가 막대한 지지를 모았고 여러 정치인들이 선거 실시를 압박하고 있다는 점을 고려하여 이에 동의했습니다. KKE는 대부분의 국민 사이에서 과반의 지지를 받고 있어 선거에서 승리할 것으로 예상되며, 당 대변인은 선거를 치르지 못하게 되면 노동 계급이 정부를 전복하기 위해 봉기할 것이라고 밝혔습니다."
 greece.5.a: "그리스의 노동자들이여, 일어나라!"
 greece.5.b: "흥미롭군"
 greece.6.t: "우파로 향하는 그리스"
 greece.6.d: "정치적 긴장은 물론이고 이주와 경제위기까지 겹치면서 그리스 국민들은 민주정부에 질려 극우정당인 황금새벽당을 지지하게 됐습니다. 황금새벽당은 정부의 경제정책은 물론이고 반좌파와 반이민 성향이 강하며 그리스 사회가 안고 있는 모든 문제를 말살하겠다고 그리스 국민들에게 약속했습니다."
 greece.6.a: "그리스는 다시 한번 일어설 것이다"
 greece.6.b: "흥미롭군"
 greece.7.t: "좌파로 향하는 그리스"
 greece.7.d: "최근 그리스 정부가 시행한 가혹한 경제 정책 이후 실업률이 상승했고, 그리스 노동 계급은 정부에 대한 행동을 요구하고 있습니다. 노동 계급은 극좌 정당 KKE(그리스 공산당) 아래 결집했습니다. KKE는 실업과 노동자 권리 침해에 반대하며, 반서방 정책을 지지하고 그리스 정부를 압박하기 위해 노동자들로 이루어진 끊임없는 폭동을 조직하고 있습니다."
 greece.7.a: "그리스의 노동자들이여, 자유가 찾아오고 있다"
 greece.7.b: "흥미롭군"
 greece.12.t: "급진좌파연합의 지도자가 된 알렉시스 치프라스"
 greece.12.d: "2008년 2월 10일, 좌파 정당 SYRIZA가 33세의 알렉시스 치프라스를 당 대표로 선출하여 그는 그리스 역사상 가장 젊은 정당 대표 중 한 명이 되었습니다."
 greece.12.a: "축하한다"
 greece.13.t: "북키프로스에서의 폭동"
 greece.13.d: "Armed riots have broken out across Northern Cyprus against the Greek agenda of pushing towards a unified Cyprus. The riots were obviously staged by Turkish authorities; however, their animosity has definitely set back how we are perceived."
 greece.13.a: "끔찍하다!"
 greece.14.t: "지원을 제공하는 노동조합"
 greece.14.d: "최근 우리가 헌법을 공격한 것은 정치적으로 상당한 반대를 불러왔습니다. 노동조합은 더 많은 권한을 대가로 지지를 제안했습니다. 우리에게 정말 선택의 여지가 있을까요?"
 greece.14.a: "선택의 여지가 없군"
 greece.15.t: "더 많은 양보를 원하는 노동조합"
 greece.15.d: "노동조합이 다시 찾아왔습니다. 그러나 이번에는 지지를 제안하는 것이 아니라, 더 많은 권한을 양보하지 않으면 지지를 철회하겠다고 위협하고 있습니다."
 greece.15.a: "망할놈들!"
 greece.16.t: "균열된 국가 기반"
 greece.16.d: "나라가 산산조각 나는 가운데 밤마다 잠들기가 점점 더 어려워집니다. 최북단 도시들에서는 조직적인 공격이 벌어져 양측에 수백 명의 사상자가 발생했습니다. 이 정도 병력으로는 오래 버틸 수 없습니다.\n\n §R북부에서 그들을 저지하려는 것은 무의미하다. 우리는 병력을 집중하여 아테네와 그 주변 지역을 방어해야 한다. 전선에서 보자.§!"
 greece.16.a: "당장 여기 장군을 보내라!"
 greece.17.t: "이미 끝났다"
 greece.17.d: "우리의 예측은 틀리지 않았습니다. 북부 반군이 스스로를 군대로 조직했습니다. 그러나 처음 생각했던 것만큼 공격적이지는 않은 것 같아 보-... \n잠깐, 이것 좀 받아야겠다... \n그래. \n그래.\n확실한가?\n\n...젠장."
 greece.17.a: "'아군 전선 곳곳에서 돌파를 시도하는 움직임이 여럿 보입니다.'"
 greece.18.t: "피레우스항을 경매에 내놓은 그리스"
 greece.18.d: "피레우스 항이 최근 부채 위기에 쓸 자금을 마련하려는 그리스 정부에 의해 입찰에 부쳐졌습니다. 피레우스를 우리의 자산에 추가하는 것은 충분히 가치 있는 구상이며, 그리스와 유럽 내부의 추가 사업으로 가는 문을 열어 이 지역에서 우리의 영향력을 넓혀 줄 것입니다."
 greece.18.a: "가장 높은 입찰가에 내놓아라."
 greece.18.b: "그러한 사업에 대한 우리의 무관심은 말로는 다 전할 수 없다."
 greece.19.t: "피레우스항 경매에 참여한 중국"
 greece.19.d: "중국이 피레우스 항에 관심을 보이며 항구 독점권을 놓고 상당한 금액을 입찰하여 낙찰받았습니다. 중국이 앞으로 항구를 어떻게 할지는 그들에게 달려 있으나, 우리가 위험하다고 판단하면 중국이 항구를 확장하거나 다른 사업을 시작하지 못하도록 막을 수도 있습니다."
 greece.19.a: "악마와의 거래이다."
 greece.20.t: "피레우스항에 관심이 없는 중국"
 greece.20.d: "최선을 다했음에도 중국 정부는 우리 제안을 두 번 생각하지도 않고 일축했습니다."
 greece.20.a: "좋든 나쁘든, 말해줄 수 없다."
 greece.22.t: "긴축 정책 갈등 소멸"
 greece.22.d: "긴축 반대 시위가 당분간 멈춘 듯하여 그리스는 대체로 '조용한' 하루를 보내고 있습니다. 어쩌면 끊임없는 시위에 지친 것일 수도, 다른 이유가 있을 수도 있습니다."
 greece.22.a: "신이시여 감사합니다."
 GRE_reorganize_army_idea_desc: "우리는 군대가 제 기능을 못 할 정도로 예산을 삭감할 수는 없습니다. 강력한 군대가 필요한 때가 올 수 있으며, 그 가능성에 대비하여 군대가 충성스럽고 준비된 상태를 유지하도록 할 것입니다."
 greece.23.t: "마침내 에노시스!"
 greece.23.d: "수십 년간의 불안과 분리, 그리고 가족의 유대와 연결이 갈라져 있는 데 대한 걱정 끝에, 에노시스 회의가 결실을 맺었습니다.\n\n그리스계 키프로스인들은 거리에서 축하하고 있고, 튀르키예계 키프로스인들은 충분히 달래졌으며, 영국인들도 우리가 결정한 합의에 어느 정도 만족하는 듯합니다.\n\n남은 문제가 하나 있습니다. 아크로티리와 데켈리아는 어떻게 할 것인가?"
 greece.23.a: "완전 통제를 요청하자"
 greece.23.b: "왕립공군이 기지에 주둔하도록 허락해라"
 greece.24.t: "아크로티리를 원하는 그리스 정부!"
 greece.24.d: "에노시스라는 목표를 이룬 그리스 정부가 모자를 손에 들고 찾아와 아크로티리와 데켈리아 기지의 반환을 요청했습니다. 이들을 그리스 통치로 돌려보내야 할까요?"
 greece.24.a: "그러지 않을 이유가 없지!"
 greece.24.b: "어림도 없다!"
 greece.25.t: "키프로스 자치를 허락한 그리스 정부"
 greece.25.d: "에노시스라는 목표를 이룬 그리스 정부는 아크로티리와 데켈리아의 반환이 모두에게 불편할 것이라는 점을 깨달았습니다. 다행히 우리는 이 땅에서 병력을 옮기지 않아도 됩니다."
 greece.25.a: "아주 좋아"
 GRE_constitutional_crisis: "헌정 위기"
 GRE_constitutional_crisis_desc: "낡은 헌법은 매우 다른 그리스를 위해 쓰였습니다. 그 견제와 균형은 이제 나라에 필요한 개혁의 걸림돌이 되고 있습니다. 헌법을 다시 쓰는 것은 위험하지만, 어중간한 조치는 이미 우리를 실패하게 했습니다."
 GRE_foreign_relations_desc: "새로운 그리스는 고립될 수 없습니다. 무역, 안보, 그리고 세계 무대에서의 정당성을 위한 파트너가 필요합니다. 문제는 협력할 것인지가 아니라 누구와 어떤 조건으로 협력할 것인가입니다."
 greece_focus: "그리스 중점 계통도"
