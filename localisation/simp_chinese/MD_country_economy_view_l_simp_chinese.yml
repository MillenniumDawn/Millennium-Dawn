 print_money_button_tooltip: "§Y印钞§!\n§g政府陷入了困境，需要迅速筹集资金。与其依靠税收或购买债券，不如发行货币来适应。§!\n\n下达这项命令将印发相当于两周政府收入的资金，计入国库。然而，发行货币本身就是一种通胀措施：它会推高当季通胀率，而且在季度通胀调整前多次印钞会加剧通胀效应。\n\n§Y印钞次数：§! [?printing_money_var|0Y]\n\n§Y先决条件：§!\n[!print_money_button_click_enabled]\n§Y效果：§!\n[!print_money_button_click]"
