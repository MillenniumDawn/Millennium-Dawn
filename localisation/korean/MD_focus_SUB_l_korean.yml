 subject_rus.45.t: "[FROM.GetNameWithFlag], 보조금 요청"
 subject_rus.45.d: "[FROM.GetNameWithFlag] 정부가 자국 예산을 위한 보조금을 우리에게 요청했습니다. 보조금을 배정할 준비가 되어 있습니까?"
 subject_rus.45.a: "찬성"
 subject_rus.45.b: "안된다"
 subject_rus.48.t: "[BSH.GetNameWithFlag], 볼가 소비에트 사회주의 공화국 창설 요청"
 subject_rus.48.d: "[BSH.GetFlag]바시키르 정부가 타타르스탄과 바시키리야를 볼가 소비에트 사회주의 공화국이라는 단일 주체로 통합하는 법안을 제출했습니다. 국내 국경을 이렇게 급진적으로 바꿀 준비가 되어 있습니까?"
 subject_rus.48.a: "Of Course"
 subject_rus.48.b: "안된다"
 subject_rus.49.t: "[BSH.GetNameWithFlag], 볼가 소비에트 사회주의 공화국 창설 요청"
 subject_rus.49.d: "[SOV.GetFlag]러시아 정부가 우리 공화국과 타타르스탄의 통합 법안을 채택하기로 동의했습니다."
 subject_rus.49.a: "훌륭하군!"
 subject_rus.50.t: "[BSH.GetNameWithFlag], 볼가 소비에트 사회주의 공화국 창설 요청"
 subject_rus.50.d: "[SOV.GetFlag]러시아 정부가 볼가 소비에트 사회주의 공화국 창설 법안을 거부했습니다."
 subject_rus.50.a: "Sad"
 subject_rus.60.t: "[FROM.GetNameWithFlag], 환경 문제 지원 요청"
 subject_rus.60.d: "[FROM.GetNameWithFlag]이(가) 청정 대기 프로그램에 참여하여 자국 지역의 생태 복원에 투자할 수 있도록 허용해 달라고 요청했습니다."
 subject_rus.60.a: "그들을 돕는다"
 subject_rus.60.b: "안된다"
 subject_rus.61.t: "[FROM.GetNameWithFlag], 환경 문제 지원에 동의"
 subject_rus.61.d: "[FROM.GetNameWithFlag]이(가) 환경 문제를 돕기로 동의했습니다. 자금이 배정되고 복원 작업이 시작될 것입니다."
 subject_rus.61.a: "니스"
 subject_rus.62.t: "[FROM.GetNameWithFlag], 환경 문제 지원 거부"
 subject_rus.62.d: "[FROM.GetNameWithFlag]이(가) 환경 문제를 돕는 것을 거부했습니다. 자금이 배정되고 복원 작업이 시작될 것입니다."
 subject_rus.62.a: "슬프군"
 subject_rus.100.t: ""
 subject_rus.100.d: ""
 CRM_poklonskaya_idea: "냐시먀시 검사"
 CRM_anti_corrupt: "반부패 투쟁"
 CRM_anti_corrupt_desc: "우리의 새 검사는 모든 기관에서 부패와의 싸움을 이끌 준비가 되어 있습니다."
 CRM_close_medjlis: "크림 타타르 메즐리스 금지"
 CRM_close_medjlis_desc: "크림 타타르 메즐리스는 크림에서의 우리 활동을 적극적으로 방해하고 있으므로, 우리 지역에서 그들의 활동을 금지하겠습니다."
 KHM_ecology: "석유 오염의 영향 제거"
 KHM_ecology_desc: "우리 지역의 열악한 환경 상황이 초래한 결과와 싸우겠습니다."
 KHM_oil_repair: "석유 인프라 개선 착수"
 KHM_oil_repair_desc: "우리의 석유 인프라는 임계점에 이르렀으며, 이를 개선할 때입니다."
 KHM_housings: "주택 개발 투자"
 KHM_housings_desc: "우리 지역은 새 주택이 절실히 필요합니다. 인구는 늘고 있으나 새 집을 제공하지 못하고 있으므로 이 분야에 자금을 배정하겠습니다."
 KHM_knight: "과학과 예술의 기사"
 KHM_knight_desc: "러시아 자연과학 아카데미 간부회는 하티만시 자치구 주지사에게 '과학과 예술의 기사'라는 명예 칭호와 휘장을 수여했습니다. 이 공적 표창은 자치구 내 문화 예술 기관이 물적 기반을 강화하고, 이 분야에 숙련된 인력을 유치하며, 훌륭한 예술을 자치구 주민이 접할 수 있도록 하는 여건을 조성한 공로로 수여되었습니다."
 KHM_czech: "유그라 - 체코"
 KHM_czech_desc: "우리는 체코와의 협력에 관심이 있으며, 그곳에 대표부를 개설할 준비가 되어 있습니다."
 KHM_spirit_fire: "불의 정신"
 KHM_spirit_fire_desc: "제3회 국제 영화 데뷔작 영화제 '불의 정신'이 하티만시 자치구 정부의 후원 아래 유그라의 수도에서 개최됩니다. 이 영화제는 정신적 잠재력을 풍요롭게 하고 예술에 대한 문화와 애정을 형성할 것입니다. 이 행사 기간 중 영화계 엘리트, 국제적 스타, 제작진, 감독, 제작자, 러시아 각 도시와 외국에서 온 영화 관객들의 대회가 하티만시에서 열릴 것으로 예상됩니다."
 KHM_reconst_eu: "유럽 은행 대출"
 KHM_reconst_eu_desc: "유럽 부흥개발은행의 대출을 유치하기 위해 수르구트 행정부와 회사 책임자 사이에 협력 협정을 체결하겠습니다. 대출금은 주택 및 공공 서비스 개발에 사용될 것입니다."
 KHM_mts: "MTS 네트워크 확장"
 KHM_mts_desc: "MTS 통신사가 우리 지역에서 네트워크 구조를 확장할 것입니다."
 KHM_future: "미래의 영토"
 KHM_future_desc: "우리는 하티만시 자치구에서 진정한 미래의 영토를 봅니다. 투자자들은 지역과 대륙 전역에서 이곳으로 몰려들어야 하며, 또 그렇게 될 것입니다."
 KHM_police: "경찰 감축"
 KHM_police_desc: "우리는 유그라 민병대의 구조를 최적화하고 있습니다. 대부분 관리직 인력이 감축되고 있으며, 그 밖에 우선 공석이 줄어들고 있습니다."
 KHM_agri: "농업 복합체 투자"
 KHM_agri_desc: "우리는 농업 복합체에 투자하고 있으며, 우리 지역의 농업은 희망이 없지 않습니다."
 KHM_new_road: "신규 도로 개통"
 KHM_new_road_desc: "우리 지역의 신규 도로 개통에 자금을 지원하겠습니다."
 KHM_eco_we: "청정 생태"
 KHM_eco_we_desc: "자원을 위해 끝없이 자연을 파괴하는 대신 생태 상황에 집중하겠습니다."
 KHM_more_ecology: "생태 중시"
 KHM_more_ecology_desc: "동식물 복원에 새 자금을 투입하며 우리 지역의 생태 복원을 계속하겠습니다."
 KHM_a_pragmatic_approach: "실용적 접근"
 KHM_a_pragmatic_approach_desc: "민주주의는 훌륭하지만 공산주의 독재에서 곧바로 자본주의 민주주의로 넘어갈 수는 없습니다. 충격 요법은 통하지 않으며 새로운 러시아 국가를 산산조각 낼 것입니다."
 KHM_democratic_idealism: "민주적 이상주의"
 KHM_democratic_idealism_desc: "이제 과거의 유령을 뒤로하고 어떤 대가를 치르더라도 민주 개혁을 추진할 때입니다."
 KHM_Measures_of_rapprochement_with_the_West: "서방과의 접근 조치"
 KHM_Measures_of_rapprochement_with_the_West_desc: "서방은 우리의 친구입니다. 우리는 이를 계속 되풀이할 것입니다."
 KHM_oil: "지질 탐사 강화"
 KHM_oil_desc: "자원을 찾기 위해 우리 공화국의 지하를 계속 탐사하겠습니다."
 KHM_oil_infra_new: "석유 인프라 보수 투자"
 KHM_oil_infra_new_desc: "우리의 석유 인프라는 매우 낡았으며, 그 보수와 개선에 투자할 계획입니다."
 KHM_zavods: "신규 공장 건설"
 KHM_zavods_desc: "새로운 일자리를 만들어야 합니다!"
 KHM_five_year_plan: "첫 5개년 계획"
 KHM_five_year_plan_desc: "서방 국가들의 자유 경제 모델은 사회주의 국가의 미래가 될 수 없습니다. 가급적 고전적인 소비에트식 5개년 계획의 형태로 계획 경제로 복귀하면, 정부는 그동안 통제되지 않던 경제에 대해 제약 없는 영향력을 갖게 될 것입니다."
 KHM_nationalize_foreign_business: "외국 기업 국유화"
 KHM_nationalize_foreign_business_desc: "외국인이 소유한 산업 시설은 언제나 경제 안보의 위험 요소입니다. 외국이 경제 제재로 우리를 위협하는 상황에서, 산업 소유주들이 하룻밤 사이에 떠나면서 시설의 핵심 부품을 가져가 버릴 위험이 항상 존재합니다. 이를 막으려면 외국 정부의 심기를 거스르더라도 이들 산업을 국가의 소유로 가져와야 합니다."
 KHM_authoritarian_control_over_economy: "경제에 대한 권위주의적 통제"
 KHM_authoritarian_control_over_economy_desc: "우리 국가의 경제 분야는 우연에 맡겨져 있었지만, 이제 강력한 지도자의 통제 아래로 되돌릴 것입니다."
 KHM_power_to_the_workers: "노동 계급에 투자"
 KHM_power_to_the_workers_desc: "우리는 우리 경제 성장의 엔진이 될 노동 계급에 집중하겠습니다."
 KHM_agri_idea: "우리의 농공업"
 KHM_decreased_police_idea: "경찰 행정 인력 감축"
 scientist_knight: "과학과 예술의 기사"
 SUB_khmao_ecology_0: "열악한 생태 환경"
 KHM_bad_oilinfra_idea: "노후 석유 구조물"
 bashkiriya_focus: "바시코르토스탄 국가 중점 트리"
 BSH_bashkiria_idel_ural: "이델-우랄"
 BSH_bashkiria_idel_ural_desc: "우리는 이 지역의 다른 민족들을 우리 주위로 결집시켜야 하며, 오직 그렇게 해야만 위대함을 이룰 수 있습니다."
 BSH_bashkiria_idel_ural_inner: "러시아의 일부로서의 이델-우랄"
 BSH_bashkiria_idel_ural_inner_desc: "우리는 지역 경제를 새로운 차원으로 끌어올릴 수 있는 완전히 새로운 주체를 러시아에 제안할 준비가 되었습니다."
 BSH_bashkiria_idel_ural_outer: "독립 이델-우랄"
 BSH_bashkiria_idel_ural_outer_desc: "볼가 지역의 민족들과 함께 우리는 옛 러시아 영토에서 가장 강력한 국가를 건설할 것입니다."
 BSH_factories: "산업부"
 BSH_factories_desc: "산업부는 우리 산업을 되살리는 데 도움이 될 것입니다."
 BSH_soda: "소다 공장"
 BSH_soda_desc: "모두를 위한 소다!"
 BSH_rustem: "루스템 하미토프"
 BSH_rustem_desc: "이제 공화국의 수장을 바꿀 때입니다."
 BSH_habirov: "라디이 하비로프"
 BSH_habirov_desc: "이제 공화국의 수장을 바꿀 때입니다."
 BSH_revive_factories: "공장 재가동"
 BSH_revive_factories_desc: "우리 공장을 되살리겠습니다."
 BSH_troleybus_bus: "네파즈"
 BSH_troleybus_bus_desc: "네파즈는 우리 경제의 기관차이며, 우리 버스는 어디에나 있어야 합니다."
 BSH_factory_stuff: "공장 확충"
 BSH_factory_stuff_desc: "우리 공장은 더 커져야 합니다!"
 BSH_oil_investments: "석유 투자"
 BSH_oil_investments_desc: "석유 제품에 대한 다음 투자입니다."
 BSH_moscow_money: "러시아의 투자"
 BSH_moscow_money_desc: "러시아 정부가 우리 공화국의 발전을 위한 자금을 배정했습니다."
 BSH_mining_oil: "로스네프트 투자"
 BSH_mining_oil_desc: "로스네프트가 우리 공화국의 석유 사업에 투자할 것입니다."
 BSH_mining_gold1: "금 채굴"
 BSH_mining_gold1_desc: "우리 공화국 영토에서 금 채굴을 발전시키겠습니다."
 BSH_oil_repair: "석유 인프라 개선 착수"
 BSH_oil_repair_desc: "우리의 석유 인프라는 임계점에 이르렀으며, 이를 개선할 때입니다."
 BSH_mining_steel: "철강 생산"
 BSH_mining_steel_desc: "우리 공화국 영토에서 철강 채굴을 발전시키겠습니다."
 BSH_mining_aluminium: "알루미늄 투자"
 BSH_mining_aluminium_desc: "우리 공화국 영토에서 알루미늄 채굴을 발전시킬 것입니다."
 BSH_gazprom_neftehim: "네프테힘의 가스프롬 매각"
 BSH_gazprom_neftehim_desc: "네프테힘을 가스프롬에 매각할 것입니다."
 BSH_russian_war: "전쟁 중인 러시아!"
 BSH_russian_war_desc: "이제 우리가 형제들과 어깨를 나란히 하고 설 때입니다."
 BSH_lukoyl: "루코일"
 BSH_lukoyl_desc: "우리 공화국에 대한 루코일의 투자를 적극 환영합니다."
 BSH_gazafication: "국가 가스화"
 BSH_gazafication_desc: "공화국 전역에 가스를 보급하고 있습니다."
 BSH_gosoboronzakaz: "국가 방위 발주"
 BSH_gosoboronzakaz_desc: "러시아의 군수 발주를 이행하기 위해 경제를 재편해야 할 때입니다."
 BSH_military_KumAPP: "쿠메르타우 항공기 생산 기업"
 BSH_military_KumAPP_desc: "쿠메르타우 시에 위치한 소련 및 러시아의 항공기 제조 기업입니다. 이 공장은 Ka-226 헬리콥터와 Ka-27, Ka-31, Ka-32A11BC를 제조하고 정비합니다."
 BSH_military_ATV: "몰니야(UNPP)"
 BSH_military_ATV_desc: "항공기 엔진용 전자 자동 제어 시스템과 전기 점화 시스템의 개발, 생산 및 현대화를 담당하는 소련의 설계국이자 러시아의 기업입니다."
 BSH_UMPO_jet_fighters: "우파 엔진 제작 생산 연합"
 BSH_UMPO_jet_fighters_desc: "이 기업의 주요 활동은 터보제트 항공기 엔진과 가스 압송 장치의 개발, 생산, 유지보수 및 수리이며, 헬리콥터 부품의 생산 및 수리도 담당합니다."
 BSH_russian_right_hand: "러시아 무기 공급자"
 BSH_russian_right_hand_desc: "우리는 러시아에 무기를 공급하는 가장 큰 공급자 중 하나이며, 이 지위를 포기할 생각이 없습니다."
 BSH_law_federal: "연방법 수용"
 BSH_law_federal_desc: "연방법을 수용합니다."
 BSH_federal_prog: "연방 프로그램 수용"
 BSH_federal_prog_desc: "연방 프로그램은 우리의 발전에 도움이 될 것입니다."
 BSH_constitution: "러시아 헌법 채택"
 BSH_constitution_desc: "이제 마침내 러시아 헌법을 받아들입니다."
 BSH_souverginity: "바슈키르 경제"
