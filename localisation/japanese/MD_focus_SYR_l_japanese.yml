 SYR_BANKING_PROBLEMS_IDEA_MODIFIER: "§YThis will limit the economic benefits gained from economic prosperity decisions later on, but will ensure that the economy is maintained under our grip. Removing this problem through allowing private banks in the country will on the other hand lead to competitive markets birthing further economic prosperity§!"
 SYR_ALAWITE_MILITARY_STAFF_IDEA_MODIFIER: "§RThese officers will cut and break off the Alawite-dominated regions from the state should the country become an islamist non-secular republic and we have to get rid of them before we turn the country democratic if we want to partake on an islamist course§!"
 SYR_ALAWITE_MILITARY_STAFF_STRENGTHENED_IDEA_MODIFIER: "§R強化された今、これらの将校は国が非ポピュリスト的な民主主義の道を取った場合にクーデターを試みるだろう§!"
 SYR_GOVERNMENT_EXPANSION_FOCUS_EFFECT: "§Y我々は連立に政党を一つ招待する。その政党は、国家建設のバランス・オブ・パワーの過程において、中央集権化または地方分権化のいずれかの目標を達成する上で、我々に大きな利益をもたらすだろう§!"
 SYR_GOVERNMENT_EXPANSION_EVENT_REP_EFFECT: "§Cこの政党を連立に加えることは、国家建設のバランス・オブ・パワーの過程における中央集権化において、我々に大きな利益をもたらすだろう§!"
 SYR_GOVERNMENT_EXPANSION_EVENT_FED_EFFECT: "§Gこの政党を連立に加えることは、国家建設のバランス・オブ・パワーの過程における地方分権化において、我々に大きな利益をもたらすだろう§!"
 SYR_FINDING_PROMISING_BUREAUCRACY_EFFECTS: "成功した場合、§G75§!の政治力を獲得し、§Y100§!日間、§Y毎日の政治力獲得§!を§G+0.5§!、§Y建設速度§!を§G+0.2§!増加させる国民精神§Y「期待の官僚」§!を得る。"
 SYR_STATE_DECISION_MAKING_SUCCESS_EFFECTS: "成功した場合、安定度が§G5%§!上昇する。"
 SYR_LOCAL_ACCOUNTABILITY_SUCCESS_EFFECTS: "成功した場合、党の人気が§G10%§!上昇し、政治腐敗が減少する。"
 SYR_FUND_VOLUNTARY_ORGANIZATIONS_SUCCESS_EFFECTS: "成功した場合、政治腐敗が減少し、§Y100§!日間、毎日の政治力獲得を§G0.2§!、建設速度を§G+30%§!増加させる国民精神§Y「自主的組織の勃興」§!を得る。"
 SYR_ENCOURAGE_ECONOMIC_SELF_RELIANCE: "成功した場合、我が国の経済成長サイクルが上昇する。"
 TT_SYR_KURDS_WITHOUT_CITIZENSHIPS_PARTY_FORMATION: "§GOnce removed by issuing citizenship to Kurds after kicking out the Assads, they will form a political party seeking to transform Syria into a Federation§!"
 SYR_ECONOMIC_DECISIONS_ONE_FREE_FACTORIES_EXPLANATION: "§R建設に割り当てられていない利用可能な産業施設が少なくとも1つ必要である。割り当てた建設をキャンセルするか、完了して利用可能になるまで待つこと§!"
