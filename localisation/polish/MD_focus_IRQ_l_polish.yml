 IRQ_educational_restructuring: "Restrukturyzacja oświaty"
 IRQ_restructured_police: "Zrestrukturyzowana policja"
 IRQ_all_walks_of_life: "Wszystkie ścieżki życia"
 IRQ_raad_bin_zeid: "Ra'ad Bin Zeid"
