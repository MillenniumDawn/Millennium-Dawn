 israel_likud.5.t: "면책 특권 신청"
 israel_likud.5.d: "네타냐후 총리는 법정에서 제기된 혐의 속에서 크네세트 의장에게 면책 특권을 신청했습니다. 이제 크네세트는 베냐민 네타냐후에게 면책 특권을 부여할지 여부를 결정해야 합니다."
 israel_likud.5.a: "진심인가?"
 israel_likud.6.t: "당의 승인"
 israel_likud.6.d: "리쿠드 의원들은 네타냐후의 청원을 지지했으며 가능한 한 빨리 의사결정 위원회를 구성할 것을 촉구했습니다."
 israel_likud.6.a: "훌륭해!"
 israel_likud.7.t: "당의 거부"
 israel_likud.7.d: "리쿠드 의원들은 네타냐후의 청원을 비판하며 신청의 기각을 촉구했습니다."
 israel_likud.7.a: "말도 안 된다!"
 israel_likud.8.t: "우리를 지지하는 연립"
 israel_likud.8.d: "우리의 연립 파트너들은 신청을 지지했으며 가능한 한 빨리 의사결정 위원회를 구성할 것을 촉구했습니다."
 israel_likud.8.a: "진정한 친구들이다!"
 israel_likud.9.t: "우리를 지지하는 연립"
 israel_likud.9.d: "우리의 연립 파트너들은 신청을 거부했으며 신청의 기각을 촉구했습니다."
 israel_likud.9.a: "배신자들!"
 israel_likud.10.t: "분노한 민중!"
 israel_likud.10.d: "신청에 관한 소식이 이스라엘 전역에 퍼져 주민들 사이에 불만을 일으키고 있으며, 야당은 청문회에 반대하는 집회를 조직하고 법안의 철회를 촉구하고 있습니다."
 israel_likud.10.a: "그들은 이해하지 못한다!"
 israel_likud.11.t: "침묵하는 제1 채널"
 israel_likud.11.d: "제1 채널 개혁 덕분에, 소속 기자들은 면책 특권 신청을 보도하지 않기로 했으며 이에 따라 큰 파장은 일어나지 않았습니다."
 israel_likud.11.a: "좋다."
 israel_likud.12.t: "제1 채널의 보도"
 israel_likud.12.d: "신청에 관한 제1 채널의 보도는 주민들 사이에서 강한 감정을 불러일으켰고, 야당 성향 시민들의 반감을 키워 신청에 대한 야당의 저항을 강화했습니다."
 israel_likud.12.a: "재앙이다."
 israel_likud.13.t: "승인된 신청!"
 israel_likud.13.d: "야당의 모든 반박과 저항에도 불구하고 해당 위원회가 구성되었습니다. 회의 결과, 위원회는 총리에게 면책 특권을 부여하기로 결정했습니다."
 israel_likud.13.a: "이스라엘의 승리다!"
 israel_likud.14.t: "기각된 신청!"
 israel_likud.14.d: "모든 시도에도 불구하고, 의장은 위원회를 구성하지 않고 네타냐후에게 면책 특권을 부여하지 않기로 결정했습니다."
 israel_likud.14.a: "재앙이다!"
 israel_likud.15.t: "마녀사냥"
 israel_likud.15.d: "네타냐후의 부패 수사가 다시 언론에 나왔으며, 언론은 베냐민이 정부 자금으로 구입한 해외 부동산을 다수 소유하고 있다고 주장합니다. 그러나 네타냐후는 이 중 어떤 것도 사실이 아니며 언론이 마녀사냥을 하고 있다고 밝혔습니다."
 israel_likud.15.a: "정말로 그렇다!"
 israel_likud.16.t: "시위!"
 israel_likud.16.d: "우리의 사법 개혁에 불만을 품은 사람들이 오늘 도심에서 시위에 나섰습니다. 시위대는 법안 심사 절차의 중단을 요구하고 있으며, 일부 급진화된 이들은 정부의 퇴진을 요구하고 있습니다."
 israel_likud.16.a: "자유주의자들!"
 israel_likud.17.t: "집단 탈영"
 israel_likud.17.d: "많은 동원병과 입대 장병들이 우리 법안에 항의하여 군대에서 집단 탈영하고 있다는 보고를 받았습니다. 그들은 사법 개혁이 중단되지 않으면 자신들의 의무를 이행하지 않겠다고 주장합니다."
 israel_likud.17.a: "좋지 않군"
 israel_likud.18.t: "국방부의 우려"
 israel_likud.18.d: "우리 국방장관은 사법 개혁을 둘러싼 상황을 매우 우려하고 있으며, 법안을 더 추진하는 것은 국가 안보를 위협하고 예측할 수 없는 사태가 뒤따를 수 있으므로 이 문제에서 물러서야 한다고 말했습니다."
 israel_likud.18.a: "그가 옳다, 물러서라!"
 israel_likud.18.b: "그를 해임하라!"
 israel_likud.19.t: "백만 명 시위"
 israel_likud.19.d: "텔아비브는 사법 개혁에 반대하는 집회에 나선 군중의 함성으로 들끓고 있습니다. 시위대는 정부의 퇴진과 개혁 심의 절차의 중단을 요구하고 있습니다. 상황은 상당히 위험하며, 사람들은 점점 더 급진화되고 있고 우리의 회피 여지는 갈수록 줄어들고 있습니다. 개혁을 중단하면 정부를 지킬 기회가 있고, 그렇지 않으면 시위를 진압해야 하지만 이는 매우 심각한 결과를 초래할 수 있습니다."
 israel_likud.19.a: "너무 위험하다, 물러서라!"
 israel_likud.19.b: "경찰이 처리할 것이다."
 israel_likud.20.t: "시민 불복종"
 israel_likud.20.d: "전국, 특히 텔아비브에서 시민 불복종 행위가 기록되고 있습니다. 자유주의 야당은 임시 정부를 구성하고 모든 지지자에게 무장하여 정부를 습격하라고 촉구하며, 우리가 더 이상 정통성이 없다고 주장하고 있습니다. 우파 급진주의자들은 네타냐후를 무력하고 나약하다고 비난하며 내부 병력을 동원해 권력을 장악했습니다. 이제 상황은 확대되었고 되돌릴 수 없으며, 우리를 기다리는 것은 유혈 사태뿐입니다."
 israel_likud.20.a: "준비되었다!"
 israel_likud.0.t: "네타냐후의 법정 연설!"
 israel_likud.0.d: "최근 성명에서 이스라엘 총리 베냐민 네타냐후는 자신을 둘러싼 부패 스캔들이 그의 명성을 훼손하기 위해 만들어진 사기극에 불과하다고 말했습니다."
 israel_likud.0.a: "아무것도 없었고, 앞으로도 아무것도 없을 것이다!"
 israel_likud.1.t: "스캔들을 터뜨린 이스라엘 언론!"
 israel_likud.1.d: "최근 이스라엘 언론 매체들은 이스라엘 총리 베냐민 네타냐후에 관한 추문성 보도를 내보내, 그가 부패한 거래와 비윤리적 행위를 저지르고 국가 예산을 무분별한 지출에 낭비했다고 비난했습니다."
 israel_likud.1.a: "멍청이들!"
 israel_likud.2.t: "그렇다면 그는 결백한가?"
 israel_likud.2.d: "언론 매체들은 네타냐후 사건과 부패 스캔들에 관해 새로운 것을 파헤치지 못했다고 보도합니다. 이러한 상황이 계속될지, 아니면 모든 것이 전혀 다른 방향으로 바뀔지는 알 수 없습니다."
 israel_likud.3.t: "리쿠드당을 장악한 네타냐후!"
 israel_likud.3.d: "네타냐후는 리쿠드를 완전히 자신의 개인 정당으로 탈바꿈시키고 당내 모든 권력 집단을 장악하는 데 성공하여, 자신을 위한 충성파와 예스맨의 집단을 만들어냈습니다."
 israel_likud.3.a: "후츠파(뻔뻔함)가 결실을 맺는다..."
 israel_likud.4.t: "새로운 연립을 구성한 네타냐후!"
 israel_likud.4.d: "네타냐후는 리쿠드당의 보호 아래 우파 정당들의 새로운 연립을 구성합니다. 이 새로운 운동은 모든 우파 시온주의 운동을 하나의 블록으로 통합합니다."
 israel_likud.4.a: "우리를 두려워하라, 자유주의자들!"
 israel_likud.2.a: "하!"
 israel_likud.21.t: "비비주의"
 israel_likud.21.d: "네타냐후는 오랫동안 총리직을 맡아 왔으며, 그동안 그의 정책과 리쿠드당 자체는 온건 보수주의에서 우파 포퓰리즘적 수사로 옮겨 가며 상당한 변화를 겪었습니다. 부패 스캔들로 인한 네타냐후의 기소와 함께 그의 당은 온건 성향 유권자층에서 급속히 지지를 잃고 있지만, \\"엘리트주의에 맞서는 투사\\"라는 네타냐후의 이미지와 그의 정치적 급진화는 비비를 우파 및 반체제 유권자층에게 훨씬 더 매력적으로 만듭니다. 어쩌면 우리는 이스라엘 정치 체제와 리쿠드 자체의 새로운 시대를 목격하고 있는지도 모릅니다."
 israel_likud.21.a: "대전환."
 israel_likud.22.t: "세계 포퓰리즘"
 israel_likud.22.d: "우리의 반대자들은 우리를 비판할 때 포퓰리즘이라는 단어를 씁니다. 그들은 우리가 약속만 할 수 있을 뿐 공허한 말에만 의존한다고 말하지만, 우리에게 포퓰리즘은 대중의 정치를 뜻합니다. 우리 정부는 소수 엘리트의 이익을 대변하지 않으며, 자신의 문화와 전통을 지키는 데 관심을 가진 평범한 이스라엘 국민의 이익을 대변합니다.\n 그러나 우리의 경험은 다른 나라에서도 나타나고 있으며, 우리의 사상은 한때 스스로를 반유대주의자라 칭하던 사람들 사이에서도 퍼지고 있습니다. 이제 그들은 진정한 우파 이념과 전통의 담지자가 바로 유대 민족임을 깨닫고 있습니다.\n 그리고 우리는 계속해서 그들의 눈을 뜨게 할 것이며, 우파 포퓰리즘의 이념을 지지하고 이스라엘과의 관계 개선을 옹호하는 모든 운동을 도울 것입니다."
 israel_likud.22.a: "포퓰리즘의 시대."
 israel_likud.23.t: "유럽 포퓰리즘의 부상"
 israel_likud.23.d: "세계 정세를 배경으로 새로운 이념 정당들이 유럽 전역에서 인기를 얻고 있습니다. 유럽 국가들의 경제 상황, 구매력 저하, 그리고 이민 정책에 대한 일부 국민의 불만을 배경으로 우파 포퓰리즘 및 유럽회의주의 정당들이 정치 무대에 진입하고 있습니다. 이들 정당은 국민 정서를 이용해 급속히 지지를 얻고 있으며, 일부 국가는 이를 민주주의와 유럽 통합에 대한 위협으로 인식합니다."
 israel_likud.23.a: "포퓰리즘의 시대."
 israel_likud.24.t: "폴란드 포퓰리즘의 부상"
 israel_likud.24.d: "법과 정의는 우익 포퓰리즘 강령을 채택해 인기를 얻고 있습니다. 기성 정당이면서도 [ISR.GetLeader]의 경험에서 배워 대중에게 호소하는 포퓰리즘 강령을 채택하는 데 거리낌이 없습니다."
 israel_likud.24.a: "포퓰리즘의 시대."
 israel_likud.25.t: "헝가리 포퓰리즘의 부상"
 israel_likud.25.d: "피데스는 우익 포퓰리즘 강령을 채택해 인기를 얻고 있습니다. 기성 정당이면서도 [ISR.GetLeader]의 경험을 받아들여 대중에게 호소하는 포퓰리즘 강령을 채택하는 데 거리낌이 없습니다."
 israel_likud.25.a: "포퓰리즘의 시대."
 israel_likud.26.t: "미국 포퓰리즘의 부상"
 israel_likud.26.d: "공화당은 큰 변화를 겪고 있습니다. 경기 침체와 이민 정책은 미국 유권자층에 불만을 일으키며 포퓰리즘 운동이 등장하기에 이상적인 토양을 만들고 있고, 민주당 유권자층 사이에서 버니 샌더스의 좌파 포퓰리즘 사상이 인기를 얻는 것을 배경으로, 우파 포퓰리즘 의제를 내세우는 정치인들이 공화당 내에서 부상하고 있습니다. 포퓰리즘 정치인들이 미국 정치 체제에서 성과를 거둘 수 있을지는 시간이 말해 줄 것입니다."
 israel_likud.27.t: "[ISR.GetLeader]의 워싱턴 방문"
 israel_likud.27.d: "이스라엘 총리 [ISR.GetLeader]이(가) 최근 워싱턴 D.C.를 방문하여 공화당 고위 인사들을 만났습니다. 회담 결과 공화당은 생존권을 위한 이스라엘인들의 투쟁에 대한 지지를 재확인했으며, 공화당 행정부 아래에서 이를 지원하겠다고 약속했습니다. [ISR.GetLeader]이(가) 이스라엘의 이익을 위해 추가적인 군사적·정치적 지원을 받아내도록 공화당의 지지를 끌어모으려 하고 있음이 분명합니다."
 israel_likud.27.a: "흥미롭군."
 israel_likud.28.t: "공화당 기득권층과의 회담"
 israel_likud.28.d: "우리는 워싱턴에서 공화당 고위 인사들과 만났습니다. 회담 결과, 공화당은 자신들의 땅에서 살 권리를 위한 이스라엘 국민의 투쟁에 대한 인정을 재확인했으며, 자신들의 행정부 아래에서 이스라엘이 군사적, 정치적 지원 확대를 기대할 수 있다고 확약했습니다."
 israel_likud.28.a: "우리의 가장 위대한 친구들."
 israel_likud.29.t: "[ISR.GetLeader]의 모스크바 방문"
 israel_likud.29.d: "이스라엘 총리 [ISR.GetLeader]이(가) 우리 정부와 회담하기 위해 모스크바에 도착했습니다. 회담 결과 우리는 상호 이해에 도달했고 서로에게 이로운 여러 계약을 체결했습니다."
 israel_likud.29.a: "훌륭한 회담이었다!"
 israel_likud.30.t: "러시아 지도부와의 회담"
 israel_likud.30.d: "우리는 모스크바에서 러시아 고위 관리들과 만났습니다. 회담 결과, 우리는 유리한 거래를 확보했으며 러시아-이스라엘 우호를 강화했습니다."
 israel_likud.30.a: "훌륭한 회담이었다!"
 israel_likud.31.t: "[ISR.GetLeader]의 브라질리아 방문"
 israel_likud.31.d: "이스라엘 총리 [ISR.GetLeader]이(가) 우리 대통령과 회담하기 위해 브라질리아에 도착했습니다. 회담 결과 우리는 상호 이해에 도달했고 서로에게 이로운 여러 투자 사업을 확보했습니다."
 israel_likud.31.a: "훌륭한 회담이었다!"
 israel_likud.32.t: "[BRA.GetLeader]와(과)의 회담"
 israel_likud.32.d: "우리는 브라질리아에서 브라질 대통령 [BRA.GetLeader]와(과) 만났습니다. 회담 결과 유리한 투자 사업을 확보했고 브라질과 이스라엘의 우호를 다졌습니다."
 israel_likud.32.a: "훌륭한 회담이었다!"
 israel_likud.33.t: "[ISR.GetLeader]의 공식 방문"
 israel_likud.33.d: "이스라엘 총리 [ISR.GetLeader]이(가) 우리 대통령과 회담하기 위해 워싱턴에 도착했습니다. 이스라엘 측은 우리의 지원을 원하고 있으며, [ISR.GetLeader]이(가) 이스라엘에 대한 군사 원조를 늘리겠다는 공화당의 공약도 상기시켰습니다."
 israel_likud.33.a: "그들은 우리의 정치적 지지만 받을 수 있다."
 israel_likud.33.b: "경제적 지원은 해 줄 수 있다."
 israel_likud.33.c: "우리는 약속을 지킬 것이다."
 israel_likud.33.e: "지금은 아무것도 도와줄 수 없다."
 israel_likud.34.t: "방문 결과"
 israel_likud.34.d: "공식 방문 결과, 우리는 정치적 지지를 받기로만 합의할 수 있었습니다."
 israel_likud.34.a: "없는 것보다는 낫다."
 israel_likud.35.t: "방문 결과"
 israel_likud.35.d: "공식 방문 결과 군사 지원에 관해서는 합의하지 못했지만, 미국 측이 몇몇 유리한 투자 사업의 서명을 제안했습니다."
 israel_likud.35.a: "가치 있는 거래다."
 israel_likud.36.t: "방문 결과"
 israel_likud.36.d: "공식 방문 결과 우리는 합의에 도달해 군사적·정치적 지원을 확보할 수 있었습니다."
 israel_likud.36.a: "만세!"
 israel_likud.37.t: "방문 결과"
 israel_likud.37.d: "공식 방문 결과, 우리는 이해에 도달하지 못했습니다. 그 결과 우리는 빈손으로 돌아왔습니다."
 israel_likud.37.a: "이런 재앙이!"
 israel_likud.38.t: "이스라엘에서 온 손님"
 israel_likud.38.d: "이스라엘 총리 [ISR.GetLeader]이(가) 공식 방문차 부다페스트에 도착했습니다. 방문 중 [ISR.GetLeader]은(는) 보수적 가치와 전통을 지키려는 우리의 의지를 칭찬하고, 정치적·경제적 지원도 제안했습니다."
 israel_likud.38.a: "기꺼이 받아들이겠다."
 israel_likud.38.b: "당신의 도움은 딱히 필요하지 않다."
 israel_likud.39.t: "성공!"
 israel_likud.39.d: "우리의 방문은 성공으로 끝났으며 헝가리 정부가 우리의 지원을 받아들이도록 설득할 수 있었습니다."
 israel_likud.39.a: "새로운 동맹."
 israel_likud.40.t: "실패!"
 israel_likud.40.d: "우리의 방문은 실패로 끝났으며 헝가리 정부가 우리의 지원을 받아들이도록 설득할 수 없었습니다."
 israel_likud.40.a: "안타깝군!"
 israel_likud.41.t: "이스라엘의 메시지"
 israel_likud.41.d: "우리는 이스라엘 정부로부터 메시지를 받았습니다. 그들은 폴란드 국민이 유대인 홀로코스트에 가담했다는 진실성에 관한 우리의 입장을 우려하고 있으며, 이 문제에 대한 공식 해명을 요구하고 있습니다."
 israel_likud.41.a: "우리는 모두 가장 끔찍한 참사의 피해자다."
 israel_likud.41.b: "유대인 홀로코스트에 가담한 폴란드인은 단 한 명도 없다!"
 israel_likud.42.t: "메시지"
 israel_likud.42.d: "우리는 폴란드 정부로부터 답변을 받았습니다. 그들은 유대 민족의 홀로코스트가 참사였음을 인정했지만, 폴란드인 자신들이 이에 가담했다는 점은 알지 못한다고 밝혔습니다. 폴란드 정부는 또한 서한에서 폴란드 민족과 유대 민족 모두 끔찍한 고통을 겪었으며 우리가 함께 나치 범죄에 대한 기억을 이어가야 한다고 밝혔습니다."
 israel_likud.42.a: "어쩌면 그들이 옳을지도 모른다."
 israel_likud.43.t: "메시지"
 israel_likud.43.d: "우리는 폴란드 정부로부터 답변을 받았으며, 그들은 유대 민족의 홀로코스트가 참사였음을 인정했지만 폴란드 민족의 가담은 가짜 뉴스이며 폴란드 민족 자신들도 나치 정권 아래에서 고통받았다고 밝혔습니다. 또한 폴란드 민족이 집단 학살에 가담했다는 주장은 민족의 존엄성에 대한 모독이라고 밝혔습니다."
 israel_likud.43.a: "감히 그런 말을!?"
 israel_likud.44.t: "흥미로운 제안"
 israel_likud.44.d: "이스라엘 정부가 우리에게 흥미로운 제안을 해 왔습니다. 그들은 키프로스에서 등록된 민사 혼인을 이스라엘에서도 합법으로 간주하는 협정을 우리와 체결할 것을 제안합니다."
 israel_likud.44.a: "당장 펜을 달라!"
 israel_likud.44.b: "정중히 거절하겠다"
 israel_likud.45.t: "키프로스 합의"
 israel_likud.45.d: "우리는 키프로스 정부와 협정을 성공적으로 체결할 수 있었습니다."
 israel_likud.45.a: "그들에게 잘된 일이다."
 israel_likud.46.t: "실패!"
 israel_likud.46.d: "키프로스 정부가 우리의 제안을 거부했습니다."
 israel_likud.46.a: "그들에게 안된 일이다."
 israel_likud.47.t: "EU-이스라엘 제휴 협정"
 israel_likud.47.d: "이스라엘 정부가 우리에게 제휴 협정을 제안했습니다. 이 협정에는 다수의 무역 및 정치 협정과 함께 지역 정책을 논의하고 조율하기 위한 특별 위원회의 설립이 포함되어 있습니다."
 israel_likud.47.a: "기꺼이 받아들이겠다."
 israel_likud.47.b: "관심 없다."
 israel_likud.48.t: "체결된 EU-이스라엘 제휴 협정!"
 israel_likud.48.d: "EU 대표들이 우리의 제휴 협정 제안을 받아들였습니다!"
 israel_likud.48.a: "성공!"
 israel_likud.49.t: "실패..."
 israel_likud.49.d: "EU 대표들이 우리의 제휴 협정 제안을 거부했습니다!"
 israel_likud.49.a: "그들이 부끄럽다!"
 israel_likud.50.t: "미국-이스라엘 제휴 협정"
 israel_likud.50.d: "이스라엘 정부가 우리에게 제휴 협정을 제안했습니다. 이 협정에는 다수의 무역 및 정치 협정과 함께 지역 정책을 논의하고 조율하기 위한 특별 위원회의 설립이 포함되어 있습니다."
 israel_likud.50.a: "기꺼이 받아들이겠다."
 israel_likud.50.b: "관심 없다."
 israel_likud.51.t: "체결된 미국-이스라엘 제휴 협정"
 israel_likud.51.d: "미국 대표들이 우리의 제휴 협정 제안을 받아들였습니다!"
 israel_likud.51.a: "성공!"
 israel_likud.52.t: "실패..."
 israel_likud.52.d: "미국 대표들이 우리의 제휴 협정 제안을 거부했습니다!"
 israel_likud.52.a: "그들이 부끄럽다!"
 israel_likud.53.t: "이스라엘의 제안"
 israel_likud.53.d: "이스라엘 정부는 무역항 위원회에서 우리 지분을 국유화하기를 원하며, 그 대가로 보상을 제안하고 있습니다."
 israel_likud.53.a: "가치 있는 거래다."
 israel_likud.53.b: "관심 없다."
 israel_likud.54.t: "성공!"
 israel_likud.54.d: "EU가 자신들의 지분을 우리에게 팔기로 동의했습니다!"
 israel_likud.54.a: "우리에게 잘된 일이다."
 israel_likud.55.t: "실패!"
 israel_likud.55.d: "EU가 자신들의 지분을 우리에게 팔라는 제안을 거부했습니다!"
 israel_likud.55.a: "어쩔 수 없다."
 israel_likud.55.b: "그렇다면 힘으로 빼앗겠다!"
 israel_likud.56.t: "폭력적인 강탈!"
 israel_likud.56.d: "이스라엘 정부가 모든 협정을 위반하고 위원회 내 우리 지분을 강탈했습니다!"
 israel_likud.56.a: "개자식들!"
 israel_likud.57.t: "이스라엘의 제안"
 israel_likud.57.d: "이스라엘 정부는 무역항 위원회에서 우리 지분을 국유화하기를 원하며, 그 대가로 보상을 제안하고 있습니다."
 israel_likud.57.a: "가치 있는 거래다."
 israel_likud.58.t: "성공!"
 israel_likud.58.d: "미국이 자신들의 지분을 우리에게 팔기로 동의했습니다!"
 israel_likud.58.a: "우리에게 잘된 일이다."
 israel_likud.59.t: "실패!"
 israel_likud.59.d: "미국이 자신들의 지분을 우리에게 팔라는 제안을 거부했습니다!"
 israel_likud.59.a: "어쩔 수 없다."
 israel_likud.59.b: "그렇다면 힘으로 빼앗겠다!"
 israel_likud.60.t: "폭력적인 강탈!"
 israel_likud.60.d: "이스라엘 정부가 모든 협정을 위반하고 위원회 내 우리 지분을 강탈했습니다!"
 israel_likud.60.a: "개자식들!"
 israel_likud.61.t: "낙원의 문제"
 israel_likud.61.d: "가자 지구의 최근 사태와 이에 대한 정부의 대응은 리쿠드 내에서 격렬한 논란을 불러일으켰습니다. 당대표 아리엘 샤론과 그의 온건파 지지자들은 탈당과 신당 카디마 창당을 발표했습니다. 샤론의 자리는 그의 정치적 라이벌인 베냐민 네타냐후가 이어받았습니다. 카디마가 크네세트에서 자리를 지킬 가능성은 꽤 높지만, 그렇다고 해서 아리엘 샤론의 정부 내 입지가 매우 불안정해졌다는 사실이 달라지지는 않습니다."
 israel_likud.61.a: "£ISR_liberalism_alt1 카디마에게 미래가 있기를 바란다."
 israel_likud.61.b: "정부에 심각한 타격이다"
 israel_likud.63.t: "낙원의 문제"
 israel_likud.63.d: "아리엘 샤론의 악화되는 건강은 더 이상 그가 총리직을 수행하는 것을 허락하지 않았으며, 그의 사임은 놀라운 일이 아니었지만 새로 창당한 정당의 입지를 심각하게 약화시켰습니다. 에후드 올메르트가 총리직을 이어받았지만, 국민 사이의 낮은 지지율은 새 정부의 밝은 미래를 기대하기 어렵게 합니다."
 israel_likud.63.a: "올메르트에게 상황이 좋지 않아 보인다."
 israel_likud.64.t: "당대표 선거"
 israel_likud.64.d: "카디마 당대표 선거가 임박했으며 올메르트의 입지는 위태로워졌고 그의 재선 가능성은 전무한 수준입니다. 누가 당을 이끌게 될까요?"
 israel_likud.64.a: "올메르트가 끝까지 당을 이끌 것이다!"
 israel_likud.64.b: "리브니의 진보 코커스가 승리할 것이다."
 israel_likud.64.c: "모파즈의 온건 코커스가 승리할 것이다."
 israel_home.1.t: "지도력 문제"
 israel_home.1.d: "당이 사실상 두 인물에 의해 운영되고 있어, 누가 이스라엘 정부를 이끌 것인가 하는 문제가 제기되었습니다. 많은 이들은 종교적 여성의 국가 복무 참여 확대를 지지하는 아옐렛 샤케드의 후보직을 선호하지만, 당의 상당수는 경제에 대한 최대한의 불간섭을 주장하는 나프탈리 베넷도 지지합니다."
 israel_home.1.a: "나프탈리가 총리가 될 것이다"
 israel_home.1.b: "아옐렛 샤케드가 총리가 될 것이다"
