 ukraine_modernize_sov_equipment_btr_60_modernization_btr_60m_unlocks_tt: "§YБТР-60М открывает следующее решение:§! §YБТР-60МК§! от §YКОРТ§! можно построить только на его основе."
 ukraine_modernize_sov_equipment_btr_60_modernization_techimpex_plan_tt: "§YНВК «Техимпекс»§! предлагает §YБТР-60ПБ-Т§! до середины §Y2019§! года."
 ukraine_modernize_sov_equipment_btr_60_modernization_kort_plan_tt: "§YКОРТ§! предлагает §YБТР-60МК§! до середины §Y2019§! года."
 ukraine_modernize_sov_equipment_btr_60_modernization_mykolayiv_wait_tt: "§YНиколаевский бронетанковый завод§! представит свою работу примерно через §Y$DAYS$§! дн."
 ukraine_modernize_sov_equipment_btr_60_modernization_kort_wait_tt: "§YКОРТ§! представит свою работу примерно через §Y$DAYS$§! дн."
 ukraine_modernize_sov_equipment_btr_60_modernization_techimpex_wait_tt: "§YНВК «Техимпекс»§! представит свою работу примерно через §Y$DAYS$§! дн."
 ukraine_modernize_sov_equipment_btr_60_modernization_convert_tt: "Теперь мы можем §Gпереоборудовать§! на производственной линии наши старые бронемашины первого поколения в этот вариант."
 ukraine_modernize_sov_equipment_btr_60_modernization_stockpile_100_tt: "Не менее §Y100§! бронетранспортёров поколения §YБТР-60§! на наших складах (сейчас: §Y[?num_equipment@medium_tank_amphibious_chassis_0|0]§!)"
