 BOS_faction_value_unavailable: "§g不可用§!"
 BOS_STABILITY_TOOLTIP: "§Y净效果§!显示了组成群体目前产生的综合国家修正值：信任带来的稳定性变化和人力带来的可征召人口变化。"
 BOS_net_stability_factor_display: "§Y稳定度§! : [?ROOT.BOS_internal_faction_stability_factor|%0]"
 BOS_net_manpower_factor_display: "§Y征兵§!：[?ROOT.BOS_internal_faction_manpower_factor|%0]"
 BOS_MANPOWER_TOOLTIP: "§Y人力§!资源衡量的是每个组成群体能够提供的征兵人数。这些数值综合起来会影响可征兵人口。"
 bos_no_wars_tt: "§R我们无法宣战§!\n如果稳定度低于30%，且组成派别不够忠诚，则内战风险将急剧上升。"
