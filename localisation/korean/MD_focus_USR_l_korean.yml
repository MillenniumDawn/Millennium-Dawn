 union_state.14.b: "아니요"
 union_state.15.t: "연합 국가"
 union_state.15.d: "러시아가 우리와의 연합 국가 창설을 거부했으며, 이는 우리에게 뜻밖이었습니다."
 union_state.15.a: "유감이다"
 union_state_news.4.t: "러시아와 아르메니아의 연합 국가 창설"
 union_state_news.4.d: "연합 국가 프로젝트는 90년대 말부터 존재해 왔으며, 러시아와 벨라루스 간의 초국가적 실체를 창설하는 것을 골자로 합니다. 아르메니아는 처음에는 이 실체의 일원이 되기를 열망한 적이 없으나, 많은 이들이 연합 국가 가입을 예견했고 어쩌면 헛된 일이 아니었을지도 모릅니다. 이제 세계 정치 지도에는 러시아-아르메니아 연합 국가가 존재합니다."
 union_state_news.4.a: "흥미롭군"
