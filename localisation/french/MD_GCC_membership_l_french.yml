 GCC_endorse_EGY: "Soutenir [EGY.GetName] pour l'adhésion au CCG"
 GCC_endorse_EGY_desc: "Soutenons la candidature de l'Égypte au Conseil de coopération du Golfe. Une fois que tous les membres l'auront approuvée, le membre dominant pourra adresser une invitation formelle."
 GCC_invite_EGY: "Inviter [EGY.GetName] au CCG"
 GCC_invite_EGY_desc: "Tous les membres du Conseil ont approuvé l'Égypte. En tant que membre dominant, adressons une invitation formelle à rejoindre le Conseil de coopération du Golfe."
 GCC_all_members_endorse_EGY_tt: "Tous les membres du CCG doivent d'abord approuver l'Égypte."
