 USA_treason_event.13.t: "Coalitions de la République réformée \\"2008\\""
 USA_treason_event.13.d: "On dirait que vous avez tellement battu le système qu'il est un peu cassé. Envie d'en casser encore un peu ? Il y a le Parti du Front national et le Parti des Bergers. Avec quelle coalition briser la vitre ?"
 USA_treason_event.13.o1: "J'adore le red velvet"
 USA_treason_event.13.o2: "J'adore le chocolat au lait"
 USA_treason_event.13.o3: "Attendez, je crois que je me suis perdu, où est l'entrée ?"
 USA_treason_event.14.t: "République Réformée Droite \\"2012\\""
 USA_treason_event.14.d: "Bravo, vous avez battu le système — mais pour qui opter maintenant ? Les libertariens sans État, les réformistes raisonnables, et enfin les constitutionnalistes amoureux du papier."
 USA_treason_event.14.o1: "Peu de pouvoir, peu d'État !"
 USA_treason_event.14.o2: "Une république réformée, et pour cause"
 USA_treason_event.14.o3: "Le papier, c'est la loi !"
 USA_treason_event.14.o4: "Regardons à gauche, pourquoi pas"
