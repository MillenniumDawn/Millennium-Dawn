 GER_mio_trait_ffg_fts_flensburg: "FTS 플렌스부르크"
 GER_mio_trait_ffg_genesis_hybrid_drive: "제네시스 하이브리드 구동"
 GER_mio_trait_ffg_werk_handewitt: "한데비트 공장"
 GER_idea_east_german_debuff2: "동독의 분노"
 GER_idea_east_german_debuff2_desc: "동부의 분노는 베를린에 대한 공공연한 적대감으로 굳어졌습니다. 세수가 줄어들고 있으며 동부 산업은 서부에 비해 더욱 뒤처지고 있습니다.\n§W--------------§!\n이 국가 정신은 동독인의 관계를 §G개선§!하거나 생활 수준을 높이면 §R제거§!될 수 있습니다."
 GER_idea_east_german_debuff3: "동독의 불안"
 GER_idea_east_german_debuff3_desc: "파업과 시위가 동부 주 전역으로 번졌으며, 극좌 세력이 그들 사이에서 자유롭게 사람을 모으고 있습니다. 지방 행정은 거의 작동하지 않습니다.\n§W--------------§!\n이 국가 정신은 동독인의 관계를 §G개선§!하거나 생활 수준을 높이면 §R제거§!될 수 있습니다."
 GER_idea_east_german_debuff4: "동독의 반란"
 GER_idea_east_german_debuff4_desc: "동부 주들은 공공연한 반란 상태에 있습니다. 산업은 멈췄고 세금 징수는 붕괴되었으며 공산주의 선동가들이 거리를 장악하고 있습니다.\n§W--------------§!\n이 국가 정신은 동독인의 관계를 §G개선§!하거나 생활 수준을 높이면 §R제거§!될 수 있습니다."
 GER_subventions_mining_desc: ""
 GER_subventions_agrar_desc: ""
 GER_V_Fall_lapse: "국방 사태 실효"
 GER_V_Fall_lapse_desc: "국방 사태를 정당화했던 위협은 지나갔습니다. §Y기본법§! 제115l조는 조건이 더 이상 존재하지 않을 때 연방의회가 방위 사태를 종료하도록 요구합니다. 우리가 방어 전쟁에 휘말리거나, 세계 긴장도가 §Y60%§!를 넘어서거나, 적이 우리를 상대로 전쟁 명분을 만들기 시작하지 않는 한, 국방 사태는 종료되고 §Y독일의 유산§!이 복귀합니다."
 GER_V_fall: "국방 사태가 선포되었습니다"
 GER_Humbold_foundation: "§Y훔볼트 재단§!을 통한 연구 협력 강화"
 germany_party.21.t: "정당이 된 선거 대안당"
 germany_party.21.desc: "정부의 복지 및 노동시장 개혁에 분노한 노조 활동가들과 불만을 품은 사회민주당원들이 '노동과 사회 정의 - 선거 대안'이라는 단체를 정당으로 전환했습니다. WASG는 이제 SPD에게 버림받았다고 느끼는 유권자들에게 좌파의 새로운 안식처를 제공합니다."
 germany_party.21.a: "좌파의 새로운 도전자다."
 germany_party.22.t: "좌파당이 된 PDS"
 germany_party.22.desc: "베를린에서 열린 임시 당대회에서 민주사회당(PDS)이 당명을 좌파당.PDS로 변경했습니다. 새 이름 덕분에 서부 WASG의 후보들이 이 당의 명부로 출마할 수 있게 되었으며, 후기 공산주의 정당에게 처음으로 전국적 무대가 마련되었습니다."
 germany_party.22.a: "좌파가 대열을 정비한다."
 germany_party.23.t: "좌파당 창당"
 germany_party.23.desc: "좌파당.PDS와 WASG가 합당을 마치고 하나의 정당인 '좌파당'이 되었습니다. 처음으로 하나가 된 동서독의 좌파는 이제 SPD의 왼편에서 단일 세력을 형성합니다."
 germany_party.23.a: "독일 정치의 새로운 세력이다."
 germany_party.24.t: "무슬림이 창당한 정당의 정계 입문"
 germany_party.24.desc: "쾰른의 튀르키예계 공동체 지역 유권자 단체들이 통합하여 '혁신과 정의를 위한 동맹'을 결성했습니다. 독일에서 무슬림이 창당한 최초의 정당 중 하나인 BIG는 튀르키예계 독일인과 무슬림 유권자들에게 자신들만의 목소리를 주는 것을 목표로 합니다."
 germany_party.24.a: "지지를 얻을 수 있을지 지켜보자."
 germany_party.25.t: "NPD에 합병된 DVU"
 germany_party.25.desc: "독일민중연합이 독일국가민주당에 합병되어 독립 정당으로서의 존재를 마감했습니다. DVU 내부의 반대파가 합병에 대해 법정에서 다투고 있지만, 이 정당은 사실상 활동을 중단했습니다."
 germany_party.25.a: "극우가 결집한다."
 germany_party.26.t: "볼트 독일 창당"
 germany_party.26.desc: "젊은 친유럽주의자들이 브렉시트에 대응하여 출범한 범유럽 정당 볼트 유로파의 독일 지부로서 함부르크에서 볼트 독일을 창당했습니다. 이 정당은 대륙 전체가 공유하는 강령을 바탕으로 한 연방 유럽을 주창합니다."
 germany_party.26.a: "범유럽 정당이 등장했다."
 germany_party.27.t: "디 하이마트가 된 NPD"
 germany_party.27.desc: "리자에서 열린 당대회에서 독일국가민주당이 당명을 디 하이마트(조국)로 변경했습니다. 극우 정당인 이 당은 수년간의 선거 부진으로 훼손된 브랜드를 새 이름으로 털어내기를 바랍니다."
 germany_party.27.a: "이름만 바뀌었을 뿐 같은 정당이다."
 germany_party.28.t: "사라 바겐크네히트 동맹 창당"
 germany_party.28.desc: "사라 바겐크네히트와 좌파당에서 탈당한 연방의회 의원 일부가 사라 바겐크네히트 동맹을 정당으로 창당했습니다. BSW는 좌파적 경제 정책과 이민에 대한 제한적 노선을 결합하고, 우크라이나에서의 협상을 통한 평화를 촉구합니다."
 germany_party.28.a: "좌파가 또다시 분열한다."
