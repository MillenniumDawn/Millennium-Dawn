 nsb_rocket_pods_tech_1: "Lanzacohetes de 1ª Generación"
 nsb_rocket_pods_tech_1_desc: "Los lanzacohetes para helicópteros son lanzadores externos instalados en los helicópteros que permiten el despliegue de cohetes guiados o no guiados para diversas misiones de combate. Estos lanzadores mejoran significativamente la potencia de fuego del helicóptero, permitiendo el ataque efectivo a objetivos terrestres, la supresión de posiciones enemigas y operaciones de apoyo aéreo cercano."
