 ukr_modernize_sov_equipment_storage_sale.27.name: "§Y[FROM.GetNameWithFlag]§! предлагает нам старую технику"
 ukr_modernize_sov_equipment_storage_sale.27.desc: "§Y[FROM.GetNameWithFlag]§! предлагает нам старую советскую технику со своих складов с поставкой получателю §Y[ukr_storage_recipient.GetNameWithFlag]§!. Мы можем взять один пакет.\n\nНа украинских складах:\n• §YБРДМ-1§!: §Y[?FROM.ukraine_has_brdm1_stockpile|0]§!\n• буксируемые орудия (§YМ-46§!, §YМ-30§!): §Y[?FROM.UKR_storage_total_7|0]§!\n• стрелковое оружие и лёгкое вооружение: §Y[?FROM.UKR_storage_total_8|0]§!"
