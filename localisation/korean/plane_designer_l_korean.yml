 air_weapons_5: "초첨단 공대공 무기"
 air_weapons_5_desc: "삼중 모드 탐색기, 다중 펄스 모터 미사일, 초기동 미사일 덕분에 이 무기들은 역사상 가장 위험한 공대공 미사일이 되었습니다."
 air_weapons_6: "극첨단 공대공 무기"
 air_weapons_6_desc: "삼중 모드 탐색기, 다중 펄스 모터 미사일, 초기동 미사일 덕분에 이 무기들은 역사상 가장 위험한 공대공 미사일이 되었습니다."
 countermeasures_5: "초첨단 하드킬 대응 수단"
 countermeasures_5_desc: "미사일 위협을 기만하기가 갈수록 어려워지면서 임무는 회피에서 파괴로 옮겨갑니다. 항공기에 탑재된 이 체계들은 고출력 레이저로 날아오는 미사일의 유도 장치를 무력화하거나 목표에 도달하기 전에 탄두를 폭발시킵니다."
 countermeasures_6: "극첨단 하드킬 대응 수단"
