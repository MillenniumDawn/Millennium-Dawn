 GRE_vision_2030: "군사 비전"
 GRE_vision_2030_desc: "우리 군은 수년간의 긴축과 낡은 냉전적 사고 때문에 뒤처졌습니다. 우리는 노후한 장비, 비대한 조직, 그리고 우리가 직면한 위협을 반영하지 못하는 군대를 가지고 있습니다. 이 계획은 현대 그리스 역사상 가장 야심 찬 국방 개혁입니다."
 GRE_armored_transition: "기갑 전환"
 GRE_armored_transition_desc: "BMP-1과 M48 패튼은 수명을 다했습니다. 냉전기 기갑 전력을 퇴역시키고 그리스 사양의 레오파르트 2로 전환하면 우리 기갑 여단은 역내 어느 나라와도 맞설 수 있는 전차 전력을 갖추게 될 것입니다."
 GRE_pzh_2000: "PzH 2000 자주포"
 GRE_pzh_2000_desc: "우리의 포병은 현대 기갑전을 따라잡아야 합니다. PzH 2000 자주포는 우리 군에 원거리 정밀 사격 능력을 부여하고, 지상 지휘관들이 언제나 효과적인 간접 화력 지원을 받도록 보장할 것입니다."
 GRE_m270_mlrs: "M270 다연장로켓발사시스템"
 GRE_m270_mlrs_desc: "섬 상륙을 엄호하고 에게해 전역의 해안 표적을 타격하려면 전선을 넘어서는 화력이 필요합니다. M270 다연장 로켓 체계는 우리 육군에 그러한 사정거리를 부여할 것입니다."
 GRE_puls_rocket: "PULS 로켓 체계"
 GRE_puls_rocket_desc: "이스라엘 및 유럽 파트너들과의 EURO-PULS 공동 계획을 통해, 우리는 연장된 사거리의 표적을 타격할 수 있는 정밀 로켓 포병 체계를 배치할 수 있습니다. 이는 에게해의 어떤 적대 세력도 두 번 생각하게 만들 것입니다."
 GRE_special_warfare_command: "특수전 사령부"
 GRE_special_warfare_command_desc: "EKAM 부대, 급습 여단, 전투 잠수부, 공수부대를 단일 특수전 사령부 아래 통합하면 우리 섬들과 그 너머에서 작전할 수 있는 정예 부대를 갖추게 됩니다. 현대전에서는 소규모의 치명적인 부대가 사단 전체도 결정짓지 못하는 결과를 가를 수 있습니다."
 GRE_archipelagos_strategy: "다도해 전략"
 GRE_archipelagos_strategy_desc: "수천 개에 달하는 우리의 섬은 약점이 아닙니다. 적절한 방어와 일관된 교리가 갖춰진다면 섬들은 어떤 적 함대도 큰 손실 없이는 넘을 수 없는 중층 방벽이 됩니다. 에게해의 지리를 우리에게 유리하게 활용해야 합니다."
 GRE_f16_modernisation: "F-16 현대화"
 GRE_f16_modernisation_desc: "그리스 항공우주 산업을 통해 보유한 F-16 중 83대를 블록 70/72 바이퍼 사양으로 개량하면 전투기 전력을 양호하게 유지하는 동시에 향후 F-35 정비에 필요한 국내 전문성도 쌓을 수 있습니다."
 GRE_intl_flight_training: "국제 비행 훈련 센터"
 GRE_intl_flight_training_desc: "비행 훈련 시설을 동맹국에 개방하면 호의를 쌓고 군사적 유대를 심화하며, 우리 조종사들이 국제 표준에 맞춰 훈련하는 경험을 얻을 수 있습니다."
 GRE_new_transport_helicopters: "신형 수송 헬리콥터"
 GRE_new_transport_helicopters_desc: "섬 사이의 신속한 수송은 섬 방어에 필수적입니다. MH-60R 시호크와 함께 UH-60M 블랙호크 35대를 배치하면 적이 자리 잡기 전에 위협받는 어떤 거점이든 증원할 수 있는 수송 능력을 갖추게 됩니다."
 GRE_f35_program: "F-35 계획 협력"
 GRE_f35_program_desc: "F-35 계획에 참여하면 역내 누구도 대적할 수 없는 5세대 스텔스 전투기를 얻게 됩니다. 2024년 7월에 체결된 계약은 그리스 공군에 중요한 이정표이며 우리 조종사들을 에게해의 누구보다 앞서게 합니다."
 GRE_patriot_air_defense: "패트리어트 방공 체계"
 GRE_patriot_air_defense_desc: "우리의 나이키 허큘리스 포대는 현대적 위협에 대처하기에는 너무 낡았습니다. MSE 요격 미사일을 갖춘 패트리어트 PAC-3로 개량하면 마침내 그리스가 탄도 미사일에 대한 실질적인 방어력을 갖추고 핵심 기반시설을 보호할 수 있습니다."
 GRE_centauros_anti_drone: "켄타우로스 대드론 체계"
 GRE_centauros_anti_drone_desc: "켄타우로스 C-UAS 체계는 그리스 항공우주 산업이 개발했으며 홍해 작전에서 그 성능이 입증되었습니다. 이를 우리 섬, 해군 기지, 비행장 전역에 배치하는 것이 우선 과제입니다. 드론은 현대전의 가장 큰 위협이며 우리는 이에 대응할 수 있어야 합니다."
 GRE_achilles_shield: "아킬레스 방패"
 GRE_achilles_shield_desc: "패트리어트 포대, 켄타우로스 대드론 방어, 해안 미사일 체계를 에게해 전역을 포괄하는 단일 통합 네트워크로 묶으면, 그리스 영토에 대한 어떤 공격도 극도로 큰 대가를 치르게 만드는 접근 차단 지대가 만들어집니다."
 GRE_kimon_class_frigate: "키몬급 호위함"
 GRE_kimon_class_frigate_desc: "수년간 계획이 취소된 끝에, 우리는 마침내 네이벌 그룹과 FDI HN 호위함 3척(4번째 호위함 옵션 포함) 계약을 체결했습니다. 키몬급은 그리스 해군에 역내 어떤 함대와도 맞설 수 있는 제대로 된 수상 전투함을 제공할 것입니다."
 GRE_hydra_class_upgrade: "히드라급 현대화"
 GRE_hydra_class_upgrade_desc: "히드라급 호위함은 1990년대에 스카라망가스에서 건조된 MEKO 200HN 함선으로, 우리 수상 전투함 전력의 근간입니다. 레이더, 전자전 체계, 대함 미사일에 대한 중간 수명 개량은 이 함선들을 수십 년간 전투 효율적으로 유지시켜 줄 것입니다."
 GRE_elli_class: "엘리급 대체 계획"
 GRE_elli_class_desc: "엘리급 호위함은 1980년대에 우리에게 양도된 네덜란드 코르테나르급 함선으로 이미 수명을 크게 넘겼습니다. 호위함 전력을 회복하려면 스카라망가스에서 국내 건조하거나 해외에서 도입하는 대체 함선이 필요합니다."
 GRE_roussen_attack_craft: "루센급 고속 공격정"
 GRE_roussen_attack_craft_desc: "에게해는 열린 대양이 아니라 고속 공격정에 안성맞춤인 좁은 해역입니다. 루센급은 바로 이를 위해 만들어져 빠르고, 미사일로 무장했으며, 근거리에서 치명적입니다. 이 공격정의 신세대는 어떤 적대 함대도 그리스 해역에 접근하지 못하게 할 수 있습니다."
 GRE_fremm_frigate: "FREMM 다목적 호위함"
 GRE_fremm_frigate_desc: "우리 함대에는 더 많은 함선이 필요합니다. 검증된 이탈리아 FREMM 호위함을 신속히 도입하거나, 네이벌 그룹의 다섯 번째 FDI에 투자할 수 있습니다. 각 선택지는 속도, 능력, 동맹 관계 면에서 서로 다른 이점이 있습니다."
 GRE_submarine_expansion: "214형 조달 계획"
 GRE_submarine_expansion_desc: "파파니콜리스급은 재래식 잠수함전의 정수를 보여 줍니다. 공기 불요 추진 덕분에 우리 잠수함은 수 주간 부상하지 않고 수중에 머무를 수 있습니다. 이 계획을 확대하고 유지하는 것은 에게해 수중 영역에 대한 우리의 통제를 강화할 것입니다."
 GRE_bluewhale_submarines: "블루웨일 잠수함"
 GRE_bluewhale_submarines_desc: "이스라엘 항공우주산업의 자율 무인 잠수함은 역내 누구도 대적할 수 없는 능력을 더해 줄 것입니다. 이 체계들은 승조원과 위험 부담 없이 운용되어 우리 해군에 지속적인 수중 존재감을 부여합니다."
 GRE_defense_manufacturing: "현지 생산 의무화"
 GRE_defense_manufacturing_desc: "모든 주요 방위 계획에 25퍼센트의 현지 조달 비율을 요구하면 모든 계약의 혜택이 국내 산업에 돌아가도록 보장할 수 있습니다. EAS, HAI, 조선소들이 더 강해질 것이며 우리는 해외 공급업체에 대한 의존을 줄이게 됩니다."
 GRE_research_hubs: "연구 거점"
 GRE_research_hubs_desc: "대학, 그리스 항공우주 산업, 국방부 사이의 공식적인 협력은 군을 위한 혁신의 통로를 만들어 낼 것입니다."
 GRE_defense_innovation_center: "그리스 방위 혁신 센터"
 GRE_defense_innovation_center_desc: "스타트업, 대학, 방위 산업 파트너를 연결하는 전담 혁신 센터는 그리스에서 차세대 군사 기술 개발을 가속하는 데 도움이 될 것입니다."
 GRE_communication_satellites: "통신 위성"
 GRE_communication_satellites_desc: "전용 군사 통신 위성은 에게해에 대한 지속적인 상공 커버리지와 모든 군 병과를 위한 안전한 통신 기간망을 제공할 것입니다."
 GRE_theon_international: "테온 인터내셔널 확장"
 GRE_theon_international_desc: "테온 인터내셔널은 야간 투시 및 광학 체계 분야에서 세계적으로 높은 평판을 얻고 있습니다. 새로운 수출 시장으로의 확장을 지원하면 수익을 창출하고 방위 관계를 구축하는 동시에 그리스 산업이 최고 수준에서 경쟁할 수 있음을 보여 줄 수 있습니다."
 GRE_industrial_synergy: "산업 시너지"
 GRE_industrial_synergy_desc: "우리의 방위 계획은 산업들이 협력할 때 가장 잘 작동합니다. HAI, 조선소, EAS, 연구 기관 사이의 공식적인 조율은 모든 계획을 더 빠르고, 저렴하며, 능력 있게 만들 것입니다."
 GRE_irix_loitering: "IRIX 자폭 드론"
 GRE_irix_loitering_desc: "그리스 방위 시스템은 파라마운트 인더스트리즈와 협력하여 그리스산 최초의 자폭 드론인 IRIX를 생산합니다. 최대 100킬로미터의 사거리를 지닌 이 드론은 해외 공급업체에 의존하지 않고도 적 영토 깊숙이 닿는 정밀 타격 능력을 우리 군에 제공합니다."
 GRE_lora_ballistic: "LORA 탄도 미사일 체계"
 GRE_lora_ballistic_desc: "이스라엘 항공우주 산업의 LORA 탄도 미사일 체계는 400킬로미터 사거리의 장거리 정밀 타격 능력을 제공할 것입니다. 이러한 사거리는 에게해의 균형을 크게 바꾸며 잠재적 적대 세력에게 진지하게 생각할 거리를 줍니다."
 GRE_iniochos: "이니오코스 훈련 계획"
 GRE_iniochos_desc: "안드라비다에서 매년 열리는 이니오코스 훈련은 유럽 최고의 다국적 항공 훈련 행사 중 하나가 되었습니다. 참가 규모를 확대하고 시나리오를 더 복잡하게 만들면 우리 조종사들의 기량이 단련되고 동맹국과의 군사적 관계가 강화될 것입니다."
 GRE_grypas_ucav: "그리파스 UCAV 계획"
 GRE_grypas_ucav_desc: "그리스 항공우주 산업이 우리 최초의 국산 설계 전투 드론인 그리파스를 개발했습니다. 이 계획에 투자하면 해외 수출 제한이나 정치적 조건에 의존하지 않는 무인 타격 능력을 얻게 됩니다."
 GRE_integrated_air_defense: "통합 방공 네트워크"
 GRE_integrated_air_defense_desc: "패트리어트 포대, 아킬레스 미사일 방패, 대드론 체계, 레이더 커버리지를 하나의 중층 네트워크로 묶으면 그리스는 어떤 적 항공기나 드론도 응징 없이 넘을 수 없는 하늘을 갖게 됩니다. 이제 모든 센서와 요격체가 하나의 체계로 싸웁니다."
 GRE_strategic_transport_fleet: "전략 수송 함대"
 GRE_strategic_transport_fleet_desc: "우리의 섬 방어는 재보급과 증원 능력만큼만 견고합니다. C-27J 수송기 편대를 현대화하고 C-130H 수송기를 추가로 도입하면 어떤 수비대도 지원 없이 방치되지 않고 위기 시 어떤 섬도 고립되지 않을 것입니다."
 GRE_constellation_co_production: "컨스텔레이션급 공동 생산"
 GRE_constellation_co_production_desc: "우리는 미국과 함께 FFG-62 컨스텔레이션급 호위함의 공동 생산 계획을 시작했습니다. 이 동반자 관계는 세계적 수준의 군함을 우리 함대에 더하고 스카라망가스와 엘레프시나 조선소의 전문성과 역량을 키워 줍니다."
 GRE_eyes_of_poseidon: "포세이돈의 눈"
 GRE_eyes_of_poseidon_desc: "보이지 않는 것은 지킬 수 없습니다. 해상 초계기, 해안 레이더 기지, 위성 영상을 단일 감시 네트워크로 통합하면 에게해와 이오니아해 전역에 대한 완전한 상황 인식을 확보할 수 있습니다."
 GRE_souda_bay_expansion: "수다만 해군 기지 확장"
 GRE_souda_bay_expansion_desc: "수다만은 지중해에서 전략적 가치가 가장 높은 항구 중 하나입니다. 이 시설에서 미국 및 나토와의 협력을 확대하면 동맹을 강화하고 그리스가 나토 남측면의 핵심 닻이라는 역할을 굳힐 수 있습니다."
 GRE_alexandroupolis_strategic_hub: "알렉산드루폴리스 전략 거점"
 GRE_alexandroupolis_strategic_hub_desc: "알렉산드루폴리스 항구는 보스포루스 해협을 완전히 우회하여 동유럽으로 향하는 나토의 핵심 군수 회랑이 되었습니다. 이곳의 기반시설에 투자하고 불가리아 및 루마니아와 더 긴밀히 협력하면 영구적인 전략 자산이 될 것입니다."
 GRE_spike_atgm_integration: "스파이크 대전차 유도 미사일 통합"
 GRE_spike_atgm_integration_desc: "우리 보병과 장갑 차량에는 가시선 너머의 표적을 타격할 수 있는 현대적 대전차 유도 미사일이 필요합니다. 스파이크 미사일 계열을 지상군과 해군 초계함 전반에 통합하면 모든 지휘관이 정밀 타격 수단을 갖게 됩니다."
 GRE_stinger_manpads: "휴대용 방공 시스템 현대화"
 GRE_stinger_manpads_desc: "우리의 섬 수비대와 전진 부대는 대규모 방공 포대가 비용 효율적으로 커버할 수 없는 공중 위협에 직면합니다. 스팅어 MANPADS 보유량을 현대화하고 확대하면 모든 보병 부대와 초계함이 자체 방공 능력을 갖추게 됩니다."
 GRE_infantry_digitisation: "보병 디지털화 계획"
 GRE_infantry_digitisation_desc: "현대의 병사는 상공의 조종사 및 해상의 호위함과 동일한 작전 상황도를 공유해야 합니다. 보병에게 전장 관리 체계, 암호화 통신, 디지털 표적 지정 장비를 갖추게 하면 이들이 고립되어 작전하는 대신 더 큰 네트워크에 연결됩니다."
 GRE_sovereign_waters: "주권 해역"
 GRE_sovereign_waters_desc: "수십 년 동안 타국이 에게해와 동지중해에서의 우리 주권적 권리에 도전했지만 우리에게는 이에 대처할 해군이 없었습니다. 현대화된 함대와 제대로 된 섬 방어가 있다면 이제 국제법이 늘 우리에게 부여해 온 것을 주장할 수 있습니다. 우리의 배타적 경제 수역은 우리의 것입니다."
 GRE_rheinmetall_greece: "그리스 내 라인메탈"
 GRE_rheinmetall_greece_desc: "라인메탈은 향후 조달 계약의 일환으로 그리스 내에 현지 조립 및 정비 시설을 세우고자 합니다. 이 동반자 관계를 공식화하고 그들의 생산을 국내 방위 산업에 통합하면 지상군 현대화가 강화되고 그리스가 남동유럽의 방위 제조 거점이 될 것입니다."
 GRE_joint_operations_reform: "합동 작전 개혁"
 GRE_joint_operations_reform_desc: "우리의 세 군 병과는 수십 년간 각자의 교리와 지휘 문화를 가지고 따로 운영되어 왔습니다. 육군, 해군, 공군이 함께 계획하고 훈련하며 싸우도록 하는 통합 합동 작전 체계가 필수적입니다. 우리가 하고자 하는 다른 모든 일이 이에 달려 있습니다."
 GRE_new_army_doctrine: "물량에서 기동으로"
 GRE_new_army_doctrine_desc: "그리스 육군은 가능한 한 많은 병력으로 트라키아에서 전선을 지키도록 창설되었습니다. 그 전쟁은 오지 않았습니다. 우리는 에게해 전역에 신속히 전개하고 위협이 위기가 되기 전에 대응할 수 있는 더 작고 빠른 여단군을 중심으로 재편해야 합니다."
 GRE_nco_reform: "육군의 근간"
 GRE_nco_reform_desc: "그리스에서는 부사관에게 스스로 행동할 권한이나 훈련이 주어진 적이 없었기 때문에, 장교가 소대 단위까지 모든 결정을 내리도록 기대되어 왔습니다. 상부의 명령을 기다리지 않고 이끌고 적응할 수 있는 전문 부사관단을 육성하면 육군의 효율이 크게 높아질 것입니다."
 GRE_thrace_to_aegean: "육군 재지향"
 GRE_thrace_to_aegean_desc: "40년 동안 우리 지상군은 북동쪽 에브로스 강을 향해 있었습니다. 그 위협이 사라진 것은 아니지만 더 이상 유일한 관심사는 아닙니다. 우리는 주 배치를 매일 주권이 시험받는 에게해의 섬과 해안선 쪽으로 재지향해야 합니다."
 GRE_joint_fires_doctrine: "제병 합동 학교"
 GRE_joint_fires_doctrine_desc: "포병, 기갑, 보병, 근접 항공 지원은 너무 오랫동안 각자의 사일로에서 운영되었습니다. 제병 합동전이 표준이 되어야 하며, 모든 부대가 함께 훈련해야 합니다. 우리 병사들은 항공 지원에 대해 읽기만 할 것이 아니라 함께 일하는 법을 알아야 합니다."
 GRE_sead_doctrine: "적 방공망 제압"
 GRE_sead_doctrine_desc: "우리 조종사들은 에게해 상공의 방어적 제공권 확보에서 나토 내에서도 가장 경험이 풍부하지만, 방어되는 표적에 대한 공세적 타격은 여전히 미발달 상태입니다. 타격 편대가 진입하기 전에 적 방공망을 제거하기 위해 라팔의 SCALP와 미티어를 사용하는 전담 SEAD 교리가 필요합니다."
 GRE_iniochos_as_doctrine: "이니오코스의 교훈"
 GRE_iniochos_as_doctrine_desc: "이니오코스는 매년 20개국의 조종사를 모아 경합 공역에서 무엇이 통하는지 배우게 합니다. 우리는 수년간 이 훈련을 운영해 왔지만 교훈을 교리로 온전히 옮기지 못했습니다. 각 회차의 결과는 갱신된 전술과 절차로 공식화되어 그리스 공군 전반에 채택되어야 합니다."
 GRE_cas_doctrine: "근접 항공 지원 통합"
 GRE_cas_doctrine_desc: "그리스 공군과 육군은 효과적인 근접 항공 지원에 필요한 수준으로 함께 훈련한 적이 거의 없습니다. 중요한 순간에 지상 지휘관과 전투기 조종사가 실제로 협력할 수 있도록 상설 합동 훈련 체계와 표준화된 통신 규약이 필요합니다."
 GRE_aegean_fortress_doctrine: "우리의 바다, 에게해"
 GRE_aegean_fortress_doctrine_desc: "에게해는 열린 대양이 아닙니다. 6천 개의 섬, 좁은 해협, 얕은 사주, 병목 지점으로 이루어진 미로입니다. 준비된 방어자는 이 지리를 공격하는 어떤 함대에게도 극도로 위험하게 만들 수 있습니다. 우리에게는 그리스 영토로의 모든 접근을 아무도 감수하고 싶지 않은 위험으로 만드는 해군이 필요합니다."
 GRE_aegean_fortress_doctrine_tt: "[GREadmiraldefenseeffect]"
 GRE_aegean_fortress_doctrine_effect: "제독: 레벨 상승 시 §G30% 확률§!로 §Y방어 +1§! 획득."
 GRE_submarine_wolf_packs: "잠수함전 교리"
 GRE_submarine_wolf_packs_desc: "잠수함은 에게해에서 가장 위험한 무기입니다. 이곳의 물은 적이 숨기에는 너무 얕지만, 적절한 곳에서는 우리가 숨기에 충분히 깊습니다. 승조원들이 표적 정보를 공유하고 서로의 초계 구역을 엄호하는 협동 편대로 작전하도록 훈련하면, 어떤 수상 함대도 수중에서 추적당하지 않고는 에게해를 지날 수 없게 됩니다."
 GRE_missile_corvette_network: "루센 네트워크"
 GRE_missile_corvette_network_desc: "우리의 루센급 미사일 초계함은 빠르고 치명적이어서 에게해에 완벽하지만 협동 네트워크로 운용된 적이 없습니다. 이를 해안 레이더, 섬 센서, 잠수함 접촉 보고와 통합하여 단일 표적 상황도로 묶으면 어느 초계함이든 수 분 내에 모든 수상 위협을 교전할 수 있습니다."
 GRE_aegean_minefield_doctrine: "기뢰 해협"
 GRE_aegean_minefield_doctrine_desc: "그리스는 제2차 세계 대전 이후 기뢰 부설 능력을 보유해 왔으나 교리에 제대로 통합된 적이 없습니다. 에게해로의 모든 주요 접근로에 수 시간 내에 활성화될 수 있도록 사전 계획된 기뢰 지대를 마련하면, 우월한 함대조차 안전하게 건널 수 없는 방벽으로 해협을 바꿀 수 있습니다."
 GRE_sea_denial_complete: "에게해 요새"
 GRE_sea_denial_complete_desc: "에게해는 이제 완전한 그리스의 작전 영역입니다. 잠수함, 초계함, 호위함, 기뢰, 해안 미사일 등 우리 해양 방어의 모든 층위가 단일한 해상 거부 교리로 통합되었습니다. 우리는 지중해에서 가장 큰 해군을 갖고 있지는 않을지 몰라도, 우리 해역으로 밀고 들어오려는 자에게는 가장 위험한 해군을 갖고 있습니다."
 GRE_eastern_med_doctrine: "에게해를 넘어서"
 GRE_eastern_med_doctrine_desc: "그리스의 이익은 도데카니사 제도에서 끝나지 않습니다. 크레타 남쪽의 EEZ 권리, 키프로스에 대한 우리의 약속, 이스라엘 및 이집트와의 에너지 동반자 관계는 모두 본국에서 멀리 떨어진 곳에서 장기간 작전할 수 있는 해군을 요구합니다. 우리에게는 에게해뿐 아니라 동지중해 전역에서 신뢰받을 수 있는 함대가 필요합니다."
 GRE_asw_training: "잠수함 사냥"
 GRE_asw_training_desc: "대잠수함전은 그리스 해군에서 가장 까다로우면서도 가장 소홀히 다뤄진 기량입니다. 우리의 신형 호위함은 훌륭한 대잠 센서와 어뢰를 갖추었지만 승조원들은 이를 제대로 사용하기 위한 전담 훈련이 필요합니다. 우리 잠수함 전력을 활용하는 상설 대잠 훈련 계획은 수상 함정 승조원들에게 적 잠수함이 실제로 어떻게 작전하는지를 가르칠 것입니다."
 GRE_fleet_coordination: "단일 해군 사령부"
 GRE_fleet_coordination_desc: "동지중해 전역에서 작전하려면 파편화된 전대 지휘부가 제공할 수 없는 조율이 필요합니다. 그리스 해군을 모든 함선, 잠수함, 초계기를 실시간으로 파악하는 단일 작전 사령부 아래 재편하면 함대 전체의 효율이 크게 높아질 것입니다."
 GRE_eastern_med_taskforce: "지중해 작전 숙달"
 GRE_eastern_med_taskforce_desc: "에게해를 확보했으니 이제 지중해 전역으로 영향권을 넓혀야 합니다. 훈련 체계를 재편하고, 함대 순환을 개혁하며, 장기 파견을 실시하면 지중해 전 해역에서 어떤 적대 함대든 추적하고 교전할 수 있는 능력이 길러질 것입니다."
 GRE_eastern_med_supremacy: "동지중해 우세"
 GRE_eastern_med_supremacy_desc: "현대식 건선거의 지원을 받아 이오니아해에서 레반트 해역에 이르기까지 활동하는 상설 원정 기동부대는 그리스 해군을 동지중해의 결정적인 해양 강국으로 만듭니다. 이 규모의 전력 투사는 어떤 도전이든 그리스 해역에 닿기 전에 응수합니다."
 GRE_landforces_modifier: "그리스 육군"
 GRE_landforces_modifier_desc: "그리스는 수십 년간의 에게해 긴장으로 단련된 역전의 지상군을 운용합니다. 우리 육군은 그리스 땅 한 뼘까지 지켜 내도록 훈련되고, 장비를 갖추며, 배치되어 있습니다."
 GRE_airforce_modifier: "그리스 공군"
 GRE_airforce_modifier_desc: "그리스 공군은 에게해 상공을 장악하고 있습니다. 우리 조종사들은 매일의 요격과 경합 공역에서 단련되어 나토 내에서도 가장 경험이 풍부한 편에 속합니다."
 GRE_navy_modifier: "그리스 해군"
 GRE_navy_modifier_desc: "그리스는 해양 국가입니다. 호위함, 잠수함, 고속 공격정으로 이루어진 우리 함대는 고대부터 그리스의 것이었던 해역을 순찰합니다."
 GRE_cold_war_giant_1: "냉전 육군"
 GRE_cold_war_giant_1_desc: "우리 육군은 발칸을 통한 소련의 진격을 저지하기 위해 창설되었습니다. 그 전쟁은 오지 않았습니다. 지금 우리에게는 인력을 채우는 데 비용이 많이 들고, 움직임이 느리며, 더 이상 존재하지 않는 전장을 위해 훈련된 비대한 편제만 남아 있습니다."
 GRE_aircraft_bad_1: "냉전 공군"
 GRE_aircraft_bad_1_desc: "우리 항공 전력은 냉전 시대 항공기를 기워 맞춘 것입니다. 대형 기체는 유지비가 많이 들고 우리 조종사들에게는 에게해 너머로 전력을 투사할 교리가 부족합니다. 전략 항공과 감시 능력이 큰 공백으로 남아 있습니다."
 GRE_navy_bad_1: "냉전 해군"
 GRE_navy_bad_1_desc: "우리 함대는 서류상으로는 커 보이지만 실제로는 엉망입니다. 세 나라 해군에서 넘겨받은 중고 선체는 세 가지 서로 다른 군수 체계를 의미합니다. 연료 비용은 너무 높고, 대공 커버리지에는 공백이 있으며, 장교들은 함대 작전이 아닌 연안 초계에 맞게 훈련되었습니다."
 GRE_defense_industry: "에게해의 병기창"
 GRE_defense_industry_modifier: "에게해의 병기창"
 GRE_defense_industry_modifier_desc: "스카라망가스의 조선소에서 피레우스 주변의 병기 공장에 이르기까지, 그리스 산업은 여러 세대에 걸쳐 군에 물자를 공급해 왔습니다. 우리에게는 우리만의 방위 산업이 있으며 이를 활용해야 합니다."
 GRE_research_hubs_idea_tt: "[GREresearchhubidea]"
 GRE_archipelagos_defense_plan: "에게해의 방패"
 GRE_archipelagos_defense_plan_desc: "에게해 도서 열도를 통합된 요새 네트워크로 취급하는 중층 방어 구조입니다. 신속 수리, 해안 포대, 보급 차단, 미사일 커버리지가 결합되어 그리스 해역으로의 모든 접근에 큰 대가를 치르게 합니다."
 GRE_archipelagos_defense_plan_country: "에게해의 방패"
 GRE_archipelagos_defense_plan_country_desc: "에게해 도서 열도를 통합된 요새 네트워크로 취급하는 중층 방어 구조입니다. 신속 수리, 해안 포대, 보급 차단, 미사일 커버리지가 결합되어 그리스 해역으로의 모든 접근에 큰 대가를 치르게 합니다."
 GRE_defense_innovation_research_mission: "방위 혁신 연구 주기"
 GRE_defense_innovation_research_mission_desc: "그리스 방위 혁신 센터는 군 전 병과에 걸쳐 지속적인 연구를 추진합니다. 100일마다 장갑, 포병, 보병 체계, 항공, 해군 기술 분야에서 획기적 성과가 나올 수 있습니다."
 GRE_aegean_survey: "에게해 해저 조사"
 GRE_aegean_survey_desc: "우리는 우리 것을 지도로 만듭니다. 에게해 해저에 대한 전면적인 지질 조사는 탄화수소 매장량의 규모를 확인하고 채굴의 토대를 마련할 것입니다."
 GRE_aegean_surveyed: "에게해 해역 지도화 완료"
 GRE_aegean_extraction: "에게해 석유 채굴"
 GRE_aegean_extraction_desc: "조사가 완료되었습니다. 우리는 에게해 유전에서 채굴을 시작합니다. 그리스 해역의 그리스 석유를 그리스 경제를 위해."
 GRE_aegean_extracting: "에게해 석유 채굴 중"
 GRE_aegean_offshore_industry: "에게해 해양 플랜트 산업"
 GRE_aegean_offshore_industry_desc: "채굴은 산업을 낳습니다. 우리는 에게해 해저에서 끌어올린 것을 가공하고 유통하기 위한 지원 기반시설을 건설합니다."
 GRE_crete_survey: "크레타 남부 해저 조사"
 GRE_crete_survey_desc: "크레타 남쪽 해역에는 아직 개발되지 않은 상당한 잠재력이 있습니다. 우리는 조사 활동을 이오니아해와 레반트 해역으로 확장합니다."
 GRE_crete_surveyed: "크레타 해역 지도화 완료"
 GRE_crete_extraction: "크레타 남부 석유 채굴"
 GRE_crete_extraction_desc: "가장 깊은 그리스 해역이 가장 큰 매장량을 내놓습니다. 우리는 크레타 남쪽에서 채굴을 시작하고 국가의 경제적 미래를 확보합니다."
 GRE_crete_extracting: "크레타 석유 채굴 중"
 GRE_crete_offshore_industry: "크레타 남부 해양 플랜트 산업"
 GRE_crete_offshore_industry_desc: "남부 유전이 생산을 시작했습니다. 우리는 원료 채굴을 지속적인 경제 성과로 전환할 산업 역량을 구축합니다."
 TUR_naval_expansion_response: "해군 확장 계획"
 TUR_naval_expansion_response_desc: "그리스의 해양 강경 노선에 대응하여 튀르키예는 해군 건조 계획을 가속합니다. 조선소들은 동지중해에서의 격차를 좁히기 위해 늘어난 능력으로 가동됩니다."
 GRE_creditor_management_category: "그리스 부채 관리"
 GRE_creditor_management_category_desc: "그리스 국채 보유자로서, 우리는 부채의 일부를 회수하거나 전액 탕감할 수 있습니다. 현재 보유분은 아테네로부터 정기적인 이자 수입을 창출합니다."
 GRE_propose_debt_deal: "부채 거래 제안"
 GRE_propose_debt_deal_desc: "정기적인 이자 지급을 대가로 외국이 우리 국가 부채의 일부를 떠안도록 제안합니다. 현재 부채의 10%를 선택한 채권자에게 이전하며, 부채가 GDP의 90%를 넘으면 25%로 늘어납니다."
 GRE_repay_creditor: "채권자 상환"
 GRE_repay_creditor_desc: "일시금을 지급하여 이 채권자에 대한 미상환 부채를 채무액의 10%만큼 줄입니다."
 GRE_creditor_call_in_debt: "그리스 부채 회수"
 GRE_creditor_call_in_debt_desc: "그리스가 우리에게 빚진 부채의 20%를 즉시 상환할 것을 요구합니다. 이는 관계를 해칠 수 있는 강경한 외교 조치입니다."
 GRE_creditor_forgive_debt: "그리스 부채 탕감"
 GRE_creditor_forgive_debt_desc: "호의의 표시로 그리스가 우리에게 빚진 부채의 25%를 탕감합니다. 아테네와의 관계가 크게 개선될 것입니다."
 greece_debt.10.t: "그리스의 부채 제안"
 greece_debt.10.d: "[FROM.GetName]이(가) 자국 국가 부채의 일부를 떠안아 달라는 제안을 가지고 접근해 왔습니다. 그 대가로 우리는 보유 금액에 대한 정기적인 이자를 받게 됩니다. 제안된 금액은 크지 않지만 안정적인 수입원이 됩니다."
 greece_debt.10.a: "조건을 수락한다"
 greece_debt.10.b: "관심 없다"
 greece_debt.10.c: "더 높은 금리일 때만 가능하다"
 greece_debt.12.t: "부채 거래 수락"
 greece_debt.12.d: "[FROM.GetName]이(가) 우리 국가 부채의 일부를 떠안기로 동의했습니다. 우리는 그들에게 정기적으로 이자를 지급하게 되지만, 전체 부채 부담은 재조정되었습니다."
 greece_debt.12.a: "필요한 조치였다"
 greece_debt.13.t: "부채 거래 거부"
 greece_debt.13.d: "[FROM.GetName]이(가) 우리 부채의 일부를 보유해 달라는 제안을 거절했습니다. 우리는 다른 곳에서 해결책을 찾거나 재정 상황을 다룰 다른 수단을 찾아야 합니다."
 greece_debt.13.a: "다른 방법을 찾겠다"
 greece_debt.14.t: "역제안 접수"
 greece_debt.14.d: "[FROM.GetName]은(는) 우리 부채를 보유할 의향이 있지만, 우리가 처음 제안한 것보다 높은 금리를 조건으로 합니다. 이 부채를 상환하는 데 드는 늘어난 비용은 그것이 제공하는 즉각적인 숨통과 견주어 따져 보아야 합니다."
 greece_debt.14.a: "더 높은 금리를 수락한다"
 greece_debt.14.b: "받아들일 수 없는 조건이다"
 greece_debt.16.t: "부채 회수"
 greece_debt.16.d: "[FROM.GetName]이(가) 우리가 빚진 부채의 일부를 즉각 상환할 것을 요구하고 있습니다. 이에 응하지 않으면 우리의 관계와 국제적 신뢰도가 손상될 것입니다."
 greece_debt.16.a: "요구하는 대로 지불한다"
 greece_debt.16.b: "우리는 감당할 수 없다"
 greece_debt.17.t: "부채 탕감"
 greece_debt.17.d: "[FROM.GetName]이(가) 호의로 우리가 빚진 부채의 일부를 탕감해 주었습니다. 뜻밖의 이 숨통은 우리의 재정 부담을 상당히 덜어 줍니다."
 greece_debt.17.a: "반가운 숨통이다"
 greece_debt.18.t: "그리스 부채 전액 상환"
 greece_debt.18.d: "[FROM.GetName]이(가) 우리에게 빚진 모든 미상환 부채를 전액 상환했습니다. 이자 수입원을 잃게 되었지만, 이 상환은 재정적 책임감을 보여 줍니다."
 greece_debt.18.a: "계정이 정산되었다"
 greece_debt.2.t: "부채 스와프 제안"
 greece_debt.2.d: "[FROM.GetName]이(가) 스와프 방식으로 자국 국가 부채의 일부를 떠안는 방안을 검토해 달라고 요청합니다."
 GRE_eligible_creditor_tt: "그리스와 전쟁 중이 아니고, 독립국이며, 아직 채권자가 아니고, 관계가 -50 초과여야 합니다"
 GRE_debt_ratio_above_50_tt: "GDP 대비 부채 비율이 50%를 넘어야 합니다"
 GRE_debt_ratio_above_90_tt: "GDP 대비 부채 비율이 90%를 넘어야 합니다"
 GRE_propose_debt_deal_accept_tt: "채권자가 우리 부채의 일부를 떠안아 국가 부채가 줄어들고, 그 대가로 지속적인 이자를 지급합니다."
 GRE_creditor_call_in_debt_accept_tt: "그리스가 우리에게 빚진 부채 중 회수 요구한 부분을 상환합니다."
 GRE_creditor_call_in_debt_reject_tt: "그리스가 지급을 거부하여 양국 관계가 악화됩니다."
 GRE_retry_outreach_accept_tt: "그들이 우리의 접촉에 응하여 관계가 개선되고 우리의 노선 정렬이 진전됩니다."
 GRE_repay_10pct_tt: "이 채권자에게 빚진 부채의 10%를 상환합니다."
 GRE_call_in_20pct_tt: "우리가 보유한 그리스 부채의 20% 상환을 요구합니다."
 GRE_forgive_25pct_tt: "그리스가 우리에게 빚진 부채의 25%를 탕감합니다."
 GRE_eastmed_jor_accept_tt: "요르단이 포럼에 가입하여 관계가 개선되고 우리와 무역 협정이 체결됩니다."
 GRE_eastmed_jor_reject_tt: "요르단이 거절하여 우리의 정치적 자본이 소모됩니다."
 GRE_interest_rate_below_cap_tt: "금리가 8% 미만이어야 합니다"
 GRE_interest_rate_above_min_tt: "금리가 0.5% 초과여야 합니다"
 GRE_creditor_holds_significant_debt_tt: "우리는 §Y그리스 부채§!를 §Y100억§! 초과로 보유하고 있습니다 (현재 §Y[?GRE_debt_held_by_us|1]십억§!)"
 GRE_deferred_to_creditors_tt: "이연된 비용이 채권국들에 비례하여 분배됩니다"
 GRE_prospecting_category: "그리스 자원 탐사"
 GRE_prospecting_category_desc: "우리의 지질 조사는 그리스 본토와 섬 전역에서 유망한 광물 매장지를 확인했습니다. 적절한 굴착 기술과 기반시설이 갖춰지면 이 지역들을 생산적인 광산으로 개발할 수 있습니다."
 GRE_prospecting_unlocked_tt: "자원 탐사 결정이 잠금 해제됩니다"
 GRE_halkidiki_prospecting: "칼키디키 광산 확장"
 GRE_halkidiki_prospecting_desc: "그리스 북부의 칼키디키 반도에는 상당한 크롬 및 금 매장지가 있습니다. 스코우리에스와 스트라토니 광산 지구는 현대적 굴착 기술로 확장할 수 있습니다."
 GRE_peloponnese_bauxite: "펠로폰네소스 보크사이트 채굴"
 GRE_peloponnese_bauxite_desc: "디스토모 광산과 포키스 지구에는 상당한 보크사이트 매장량이 있습니다. 점진적인 채굴로 수십 년간 우리 알루미늄 산업을 공급할 수 있습니다."
 GRE_thessaly_mining: "테살리아 니켈 채굴"
 GRE_thessaly_mining_desc: "테살리아의 라리마 니켈 라테라이트 매장지는 유럽 최대 규모의 니켈 매장량 중 하나입니다. 체계적인 채굴은 강철과 크롬 부산물을 낳을 것입니다."
 GRE_aegean_mining: "에게해 섬 광물 채굴"
 GRE_aegean_mining_desc: "에게해의 화산섬들, 특히 밀로스와 낙소스에는 상업적으로 개발할 수 있는 벤토나이트, 펄라이트, 에머리 매장지가 있습니다."
 GRE_pipeline_infrastructure: "송유관 기반시설"
 GRE_pipeline_infrastructure_desc: "탐사 지점을 기존 정유소와 산업 수요처에 연결하는 송유관 네트워크는 채굴을 상업적으로 타당하게 만들고 자원 부문을 더 넓은 그리스 에너지망에 묶어 줍니다."
 greece.28.t: "중국의 산업 투자 제안"
 greece.28.d: "[FROM.GetName]이(가) 자국의 산업 기반에 투자하는 것에 관해 접근해 왔습니다. 성장하는 경제에 대한 상업적 영향력을 대가로 우리가 테살리아에 공장 건설 자금을 대 달라고 제안합니다."
 greece.28.a: "건전한 투자다"
 greece.28.b: "그리스 산업에는 관심이 없다"
 greece.29.t: "중국 투자 수락"
 greece.29.d: "중국이 테살리아의 산업 확장에 자금을 대기로 동의했습니다. 중국 자본으로 새 공장이 건설되어 베이징과의 경제적 유대가 깊어질 것입니다."
 greece.29.a: "훌륭한 소식이다"
 greece.30.t: "중국 투자 거절"
 greece.30.d: "중국이 우리의 산업 투자 제안을 거절했습니다. 우리 스스로 건설을 진행할 수는 있지만 비용은 우리가 부담해야 합니다."
 greece.30.a: "우리 자금으로 건설하겠다"
 greece.30.b: "외국 자본 없이는 사업성이 없다"
 greece.31.t: "피레우스 항 투자 제안"
 greece.31.d: "[FROM.GetName]이(가) 피레우스 항에 대한 중국 투자를 제안합니다. COSCO 해운이 항만 당국의 지배 지분을 인수하여, 지중해에서 가장 붐비는 항구 중 하나에 대한 상업적 통제권을 대가로 대규모 기반시설 개선에 자금을 댈 것입니다."
 greece.31.a: "피레우스는 투자할 가치가 있는 전략 자산이다"
 greece.31.b: "그리스 항만에는 투자하지 않겠다"
 greece.32.t: "COSCO, 피레우스 지분 인수"
 greece.32.d: "중국이 피레우스에 투자하기로 동의했습니다. COSCO 해운이 항만 확장에 자금을 대어 새로운 조선소 능력과 기반시설을 더할 것입니다. 우리 경제에서 중국의 영향력은 커지지만 항만 능력 또한 커집니다."
 greece.32.a: "항구가 번영할 것이다"
 greece.33.t: "중국, 피레우스 투자 거절"
 greece.33.d: "중국이 피레우스에 투자하기를 거절했습니다. 우리가 직접 항구를 현대화할 수는 있지만 중국 자본이 없으면 비용은 전적으로 우리 국고에 돌아옵니다."
 greece.33.a: "우리가 피레우스를 직접 현대화하겠다"
 greece.33.b: "항구는 기다려도 된다"
 greece.34.t: "그리스 부동산 개발 제안"
 greece.34.d: "[FROM.GetName]이(가) 아티키 지역의 상업용 부동산 개발에 관해 접근해 왔습니다. 중국 개발업자들이 장기 임대와 상업적 입지를 대가로 쇼핑센터, 호텔, 사무용 건물 건설 자금을 댈 것입니다."
 greece.34.a: "그리스 부동산은 매력적인 투자처다"
 greece.34.b: "그리스 부동산에는 관심이 없다"
 greece.35.t: "중국 부동산 투자 수락"
 greece.35.d: "중국 개발업자들이 아티키 전역의 대규모 건설 사업에 자금을 댈 것입니다. 새로운 상업 및 주거 능력이 이 지역을 탈바꿈시키겠지만 중국의 상업적 입지도 크게 늘어납니다."
 greece.35.a: "건설이 시작된다"
 greece.36.t: "중국, 부동산 투자 거절"
 greece.36.d: "중국이 우리 부동산 부문에 투자하기를 거절했습니다. 우리는 국내 자본으로 개발을 진행할 수 있습니다."
 greece.36.a: "우리가 직접 개발하겠다"
 greece.36.b: "개발은 기다려도 된다"
 greece.37.t: "전국 기반시설 투자 제안"
 greece.37.d: "[FROM.GetName]이(가) 그리스 전역에 걸친 포괄적 기반시설 계획을 제안합니다. 중국 국영 기업들이 상당한 상업적 영향력을 대가로 전국의 공항, 공장, 사무용 건물 건설 자금을 댈 것입니다."
 greece.37.a: "그리스는 개발할 때가 무르익었다"
 greece.37.b: "이 제안의 범위가 우려스럽다"
 greece.38.t: "중국 전국 투자 수락"
 greece.38.d: "중국이 전국 기반시설 계획을 약속했습니다. 새로운 공항, 공장, 상업용 건물이 중국의 비용으로 그리스 전역에 건설될 것입니다."
 greece.38.a: "변혁적인 동반자 관계다"
 greece.39.t: "중국, 전국 투자 거절"
 greece.39.d: "중국이 우리의 전국 투자 제안을 거절했습니다. 우리가 직접 기반시설을 건설할 수는 있지만 비용이 상당할 것입니다."
 greece.39.a: "우리가 직접 건설하겠다"
 greece.39.b: "외국의 지원 없이는 비용이 너무 크다"
 greece.40.t: "엘리니코 개발 제안"
 greece.40.d: "[FROM.GetName]이(가) 옛 엘리니코 국제공항 부지에 대한 중국 투자를 제안합니다. 이 대규모 해안 개발 사업은 버려진 활주로를 아티키와 펠로폰네소스 전역의 기반시설 개선을 동반한 현대적 도시 지구로 탈바꿈시킬 것입니다."
 greece.40.a: "엘리니코 프로젝트는 큰 잠재력을 지니고 있습니다"
 greece.40.b: "이 프로젝트에는 투자하지 않겠습니다"
 greece.41.t: "중국의 엘리니코 투자 승인"
 greece.41.d: "중국이 엘리니코 재개발 프로젝트에 자금을 지원하기로 합의했습니다. 기반시설 개선은 아티카와 펠로폰네소스 전역으로 확대될 것입니다."
 greece.41.a: "역사적인 프로젝트가 시작됩니다"
 greece.42.t: "중국, 엘리니코 투자 거절"
 greece.42.d: "중국이 엘리니코 재개발 투자를 거절했습니다. 우리는 자체 자금으로 프로젝트를 계속 추진하거나 계획을 보류할 수 있습니다."
 greece.42.a: "자체 자금으로 조달하겠습니다"
 greece.42.b: "당분간 프로젝트를 보류합니다"
 greece.46.t: "중국공상은행 대출 요청"
 greece.46.d: "[FROM.GetName](이)가 중국공상은행에 막대한 규모의 대출을 요청해 왔습니다. 이들은 중국공상은행이 자국 GDP의 10%에 해당하는 신용을 제공하여 아테네와의 금융 관계를 심화하고 지중해에서 중국 은행의 입지를 확대할 것을 제안하고 있습니다."
 greece.46.a: "대출을 제공합니다"
 greece.46.b: "위험이 너무 큽니다"
 greece.47.t: "중국공상은행 대출 승인"
 greece.47.d: "중국공상은행이 우리의 대출 신청을 승인했습니다. 중국 자본이 우리 국고로 흘러들어 상당한 자금이 투입됩니다. 베이징에 대한 금융 의존은 깊어지겠지만, 당장의 숨통이 트이는 것은 환영할 일입니다."
 greece.47.a: "자금이 확보되었습니다"
 greece.48.t: "중국공상은행 대출 거부"
 greece.48.d: "중국이 중국공상은행 대출 제공을 거절했습니다. 중국 은행권의 지원이 없으므로, 우리는 대체 자본 조달처를 찾거나 기존 재원으로 버텨야 합니다."
 greece.48.a: "스스로 해결하겠습니다"
 GRE_drydock_modernization: "도크 현대화"
 GRE_drydock_modernization_desc: "현대식 도크 시설에 대한 투자로 해군 수리 및 건조 역량이 확대되어, 그리스 해군이 함대를 더욱 효율적으로 개선할 수 있게 되었습니다."
 GRE_strategic_autonomy_idea: "전략적 자율성"
 GRE_strategic_autonomy_idea_desc: "어떤 단일 블록에도 얽매이지 않는 그리스는 모든 블록과 교역하고 협상합니다. 모든 편을 활용할 수 있는 자유 덕분에 더 나은 조건을 얻고 강대국의 압력으로부터 어느 정도 보호받을 수 있습니다."
 GRE_euro_adopted: "유로 도입"
 GRE_euro_adopted_desc: "그리스의 유로 도입으로 경제가 보다 넓은 유로존에 통합되어 차입 비용이 줄고 무역이 원활해졌으나, 그 대가로 독자적인 통화 정책은 포기해야 했습니다."
 GRE_manpads_expansion_idea: "휴대용 방공 시스템 확충"
 GRE_manpads_expansion_idea_desc: "휴대용 방공 시스템 확충 계획으로 대공 능력이 향상되었으며, 국내 연구 및 제조를 통해 생산 비용도 절감되었습니다."
 GRE_port_modernization: "항만 현대화"
 GRE_port_modernization_desc: "항만 기반시설 개선으로 조선소 역량이 확대되었고 그리스 전역 조선소의 해군 건조 효율이 향상되었습니다."
 GRE_research_hubs_idea: "군사 연구 거점"
 GRE_research_hubs_idea_desc: "방위 기술 개발과 무기 체계 혁신을 가속하기 위해 전담 군사 연구 센터가 설립되었습니다."
 GRE_research_hubs_idea_2: "첨단 연구 거점"
 GRE_research_hubs_idea_2_desc: "연구 거점 사업이 확대되어 군사 분야와 더불어 우주 기술까지 아우르게 되었으며, 그리스의 기술적 지평이 넓어졌습니다."
 GRE_greater_state_control_authoritarian: "권위주의적 국가 통제"
 GRE_greater_state_control_authoritarian_desc: "국가가 핵심 경제 부문을 직접 장악하여 정치적 자유와 관료적 유연성을 희생하는 대신 건설을 가속하고 있습니다."
 GRE_com_liberators: "인민의 해방자들"
 GRE_com_liberators_desc: "혁명의 열기가 군 전체에 흐르고 있습니다. 본토에서 싸우는 병사들은 대의에 고무되어 더욱 강하게 공격하고 혁명을 수호하기 위해 더욱 굳건히 버팁니다."
 GRE_western_outreach: "서방 외교 공세"
 GRE_western_outreach_desc: "그리스 외교는 나토와 유럽 연합 전역을 대상으로 한 양자 및 다자 외교 공세를 집중적으로 전개하고 있습니다. 서방 결속도: [?GRE_western_commitment|0]"
 GRE_franco_hellenic_strategic_partnership: "프랑스-그리스 전략적 동반자 관계"
 GRE_franco_hellenic_strategic_partnership_desc: "2021년 전략적 동반자 관계로 프랑스와의 깊은 방위산업 협력이 열렸습니다. 그리스 무기 공장은 공동 표준에 따라 가동되고, 프랑스의 연구 보너스가 우리 군사 계획에 유입되며, 정치적 공조도 긴밀해졌습니다."
 GRE_franco_greek_mutual_defense: "프랑스-그리스 상호 방위 조항"
 GRE_franco_greek_mutual_defense_desc: "격상된 동반자 관계의 제2조는 프랑스가 그리스 영토를 방어하도록 규정합니다. 이 조항은 대륙 차원의 조건으로 그리스의 안보를 뒷받침하며, 지중해 최대 규모의 두 군대를 하나의 전략 단위로 결속시킵니다."
 GRE_eastmed_trilateral_idea: "그리스-이스라엘-키프로스 3자 협력"
 GRE_eastmed_trilateral_idea_desc: "공동 선언, 공동 훈련, 정보 공유를 통해 세 나라의 해군과 공군이 동지중해 전역에서 하나의 작전 공간으로 결합되었습니다."
 GRE_eastmed_gas_forum_idea: "동지중해 가스 포럼 회원국"
 GRE_eastmed_gas_forum_idea_desc: "그리스 선박은 우대 항로를 이용하고, 역내 가스 흐름은 그리스의 정유소와 조선소를 살찌우며, 아테네는 동지중해 에너지 협의 테이블에서 상설 의석을 유지합니다."
 GRE_3plus1_pact: "3+1 전략 대화"
 GRE_3plus1_pact_desc: "미국의 참여가 동지중해 3자 협력의 화룡점정이 되었습니다. 공동 훈련, 정보 교환, 체계적인 전략 대화를 통해 해상 및 공중 영역에서 그리스군의 작전 능력이 향상됩니다."
 GRE_eu_political_anchor_idea: "EU 창립 회원국의 닻"
 GRE_eu_political_anchor_idea_desc: "그리스는 EU 창립 회원국으로서의 정치적 비중을 행사하며, 역내 무역에서 이익을 얻고 선임국의 위치에서 브뤼셀의 의제를 주도합니다."
 GRE_eu_strategic_compass_idea: "EU 전략적 나침반 옹호국"
 GRE_eu_strategic_compass_idea_desc: "그리스 외교는 유럽 전략적 나침반을 추진하여, 역외 강대국의 모험주의로부터의 자율성을 요구하는 한편 EU의 방위산업 기반을 더욱 긴밀히 결속합니다."
 greece.556.t: "서방 노선의 재확인"
 greece.556.d: "그리스가 서방 노선에 대한 포괄적인 재확인을 발표하고, 나토와 유럽 연합 전역을 대상으로 한 지속적인 양자 및 다자 외교 공세에 착수합니다. 아테네는 동맹국과 경쟁국 모두에게 자국의 전략적 미래가 서방에 확고히 닻을 내리고 있음을 알리고 있습니다."
 greece.556.a: "반가운 재확인입니다"
 greece.556.b: "그리스는 전선을 지킵니다"
 greece.556.c: "유념해 둡니다"
 greece.557.t: "그리스의 제안: 전략적 동반자 관계"
 greece.557.d: "아테네가 방위산업 협력, 외교 정책 공조, 동지중해 안보를 아우르는 포괄적인 전략적 동반자 관계를 제안했습니다. 그리스 정부는 이를 프랑스 지중해 정책의 핵심 사업으로 만들기 위해 상당한 정치적 자본을 기꺼이 투입할 의향이 있습니다."
 greece.557.a: "동반자 관계에 서명합니다"
 greece.557.b: "제안을 거절합니다"
 greece.558.t: "프랑스, 동반자 관계 수락"
 greece.558.d: "파리가 전략적 동반자 관계를 수락했습니다. 방위산업 협력을 위한 합동 실무단이 즉시 출범하며, 프랑스의 전문 지식이 그리스 무기 공장과 연구 계획에 유입됩니다. 이 동반자 관계는 유럽 양자 협력의 모범 사례로 소개되고 있습니다."
 greece.558.a: "역사적인 합의입니다"
 greece.559.t: "[FROM.GetName], 동반자 관계 거절"
 greece.559.d: "[FROM.GetName](이)가 외교적 신중함을 갖추어 아테네에 동반자 관계를 추진할 수 없다고 통보했습니다. 정치적 대가는 여전히 현실로 남아 있습니다."
 greece.559.a: "유감스러운 차질입니다"
 greece.560.t: "그리스의 제안: 동지중해 3자 협력"
 greece.560.d: "아테네가 이스라엘, 키프로스와 함께하는 공식 3자 협력 체계를 제안했습니다. 공동 훈련, 정보 공유, 외교적 입장 조율을 포함합니다. 이 체계는 오랜 협력을 구속력 있는 제도적 형태로 바꾸게 될 것입니다."
 greece.560.a: "3자 협력에 서명합니다"
 greece.560.b: "제안을 거절합니다"
 greece.561.t: "이스라엘, 3자 협력에 참여"
 greece.561.d: "이스라엘이 3자 협력 체계에 서명합니다. 작전 수준에서 합동 기획 조직이 출범하며, 이스라엘의 정보 공유 체계가 그리스 측 카운터파트로 확대됩니다."
 greece.561.a: "파트너들을 환영합니다"
 greece.563.t: "그리스의 제안: 동지중해 3자 협력"
 greece.563.d: "아테네가 키프로스, 이스라엘과 함께하는 공식 3자 협력 체계를 제안했습니다. 니코시아로서는 사실상 자동으로 수락할 제안이지만, 공식 서명은 여전히 필요합니다."
 greece.563.a: "물론 서명합니다"
 greece.563.b: "추가 검토를 위해 보류합니다"
 greece.564.t: "키프로스, 3자 협력에 참여"
 greece.564.d: "니코시아가 아테네, 예루살렘과 함께 3자 협력 체계에 서명합니다. 이제 세 정부는 동지중해 전역에서 통합된 외교 및 작전 체계 아래 움직입니다."
 greece.564.a: "하나가 된 동지중해"
 greece.566.t: "그리스의 제안: 제2조 상호 방위 조항"
 greece.566.d: "아테네가 전략적 동반자 관계의 자연스러운 귀결을 제안했습니다. 제5조를 본뜬 구속력 있는 상호 방위 조항을 양자 조약에 직접 명문화하는 것입니다. 그리스의 영토 보전은 처음으로 유럽 강대국에 의해 조약 차원에서 보장받게 됩니다."
 greece.566.a: "상호 방위 조항에 서명합니다"
 greece.566.b: "거절합니다. 너무 멀리, 너무 빨리 나아가는 것입니다."
 greece.567.t: "프랑스, 상호 방위 조항 서명"
 greece.567.d: "파리가 서명합니다. 격상된 조약의 제2조는 프랑스가 그리스 영토를 방어하도록 규정합니다. 외교적 충격파는 지중해를 훨씬 넘어 퍼져 나갑니다."
 greece.567.a: "유럽 안보의 새로운 시대입니다"
 greece.568.t: "프랑스, 상호 방위 조항 거절"
 greece.568.d: "파리는 상호 방위 조항이 현재 프랑스의 전략 교리로는 지나친 조치라며 거절했습니다. 기존의 동반자 관계는 유지되지만, 구속력 있는 안전 보장은 실현되지 않을 것입니다."
 greece.568.a: "심각한 차질입니다"
 greece.569.t: "그리스의 제안: 3+1 전략 대화"
 greece.569.d: "아테네, 니코시아, 예루살렘이 공동으로 미국과의 3+1 전략 대화를 공식화할 것을 제안했습니다. 국무부가 후원하는 이 체계는 에너지 안보, 해상 협력, 동지중해의 대테러 활동을 다룹니다."
 greece.569.a: "대화에 참여합니다"
 greece.569.b: "참여를 미룹니다"
 greece.570.t: "미국, 3+1에 참여"
 greece.570.d: "워싱턴이 3+1 전략 대화에 공식 참여합니다. 동지중해 전역에서 미국의 훈련 및 연습 공약이 확대되며, 그리스군은 한 단계 높은 수준의 합동 작전 경험을 얻게 됩니다."
 greece.570.a: "없어서는 안 될 동반자 관계입니다"
 greece.571.t: "미국, 참여 보류"
 greece.571.d: "국무부는 보다 광범위한 전략적 우선순위가 미국의 관심을 빼앗고 있다고 시사했습니다. 3+1 체계가 폐기된 것은 아니지만, 공식적인 격상은 이번 주기에는 이루어지지 않을 것입니다."
 greece.571.a: "나중에 다시 논의하겠습니다"
 greece.572.t: "그리스: 서방의 기둥"
 greece.572.d: "연이은 조약, 선언, 동반자 관계를 통해 그리스는 변방의 나토 회원국에서 동지중해 서방 외교를 떠받치는 하중 기둥으로 탈바꿈했습니다. 이제 아테네는 브뤼셀과 워싱턴 양쪽에서 구조적 비중을 지닌 위치에서 발언합니다."
 greece.572.a: "서방의 기둥"
 greece.572.b: "되찾은 동맹국"
 greece.572.c: "새로운 전략적 구도"
 greece.575.t: "알렉산드루폴리 FSRU 가동 개시"
 greece.575.d: "알렉산드루폴리에 정박한 부유식 저장·재기화 설비가 상업 운영을 시작하여, 남동유럽이 러시아 파이프라인 가스에서 벗어나는 전환의 닻이 되었습니다. 그리스 땅은 이제 유럽 대륙 에너지 공급의 진입점입니다."
 greece.575.a: "아테네가 불을 밝힙니다"
 greece.575.b: "유용한 새 거점입니다"
 greece.577.t: "IMEC 회랑의 중심이 된 피레우스"
 greece.577.d: "델리, 리야드, 브뤼셀의 정상들이 피레우스를 인도-중동-유럽 경제 회랑의 유럽 측 종착지로 확정했습니다. 아티카를 경유하는 환적 물동량은 향후 10년간 세 배로 늘어날 것으로 전망됩니다."
 greece.577.a: "에게해에서 인도양까지"
 greece.577.b: "물류의 이정표입니다"
 greece.580.t: "그리스의 제안: 프레스파 협력 로드맵"
 greece.580.d: "아테네가 프레스파 협정을 확장하기 위한 체계적인 로드맵을 제안했습니다. 분야별 실무단, 자유 무역 협정, 공동 기반시설 계획이 포함됩니다. 이 패키지는 한 세대 동안 양국 경제를 하나로 묶게 될 것입니다."
 greece.580.a: "스코페는 프레스파를 토대로 나아갈 준비가 되어 있습니다"
 greece.580.b: "기존 틀을 넘어서지는 않겠습니다"
 greece.581.t: "북마케도니아, 로드맵 지지"
 greece.581.d: "스코페가 프레스파 협력 로드맵에 서명했습니다. 실무단이 수 주 내에 테살로니키에서 소집될 것이며, 자유 무역 협정도 이제 손에 닿는 곳에 있습니다."
 greece.581.a: "훌륭한 소식입니다"
 greece.582.t: "그리스의 제안: 소수민족 권리 체계"
 greece.582.d: "아테네가 알바니아 남부 그리스어 사용 공동체의 권리에 관한 공식 체계를 제안했습니다. 언어 학교, 재산 반환, 국경 간 문화 협력을 포함하며, 그 대가로 양국 관계의 개선을 기대합니다."
 greece.582.a: "티라나가 체계를 수락합니다"
 greece.582.b: "이 조건에는 동의할 수 없습니다"
 greece.583.t: "알바니아, 소수민족 체계에 서명"
 greece.583.d: "티라나에서 협정이 체결되었습니다. 알바니아 남부의 그리스어 사용 공동체는 구체적인 보호를 받게 되며, 아테네와의 장관급 채널도 그에 따라 깊어집니다."
 greece.583.a: "외교적 성과입니다"
 greece.584.t: "그리스의 제안: 동지중해 배타적 경제 수역 협정"
 greece.584.d: "아테네가 카이로와의 양자 배타적 경제 수역 경계 획정을 제안했습니다. 이 협정은 중첩된 해양 영유권을 해결하고, 해저 자원의 공동 개발에서 경쟁 세력을 배제할 것입니다."
 greece.584.a: "카이로가 협정에 서명합니다"
 greece.584.b: "카이로는 당분간 거절합니다"
 greece.585.t: "이집트, 배타적 경제 수역 협정 비준"
 greece.585.d: "이집트가 해양 경계 획정을 비준했습니다. 획정된 수역에 대한 공동 조사가 한 달 내에 시작되며, 협정과 연계된 무역 조항이 발효됩니다."
 greece.585.a: "토대가 되는 협정입니다"
 greece.586.t: "그리스의 제안: 이탈리아-그리스 지중해 추축"
 greece.586.d: "아테네가 로마와의 포괄적인 동반자 관계를 제안했습니다. 산업 정책 조율, 조선소 계획 공유, 지중해 안보에 대한 입장 일치를 포함합니다. 두 반도는 브뤼셀에서 하나처럼 행동하게 될 것입니다."
 greece.586.a: "로마가 동반자 관계에 동의합니다"
 greece.586.b: "로마가 정중히 거절합니다"
 greece.587.t: "이탈리아, 지중해 추축에 참여"
 greece.587.d: "이탈리아가 동반자 관계 문서에 서명했습니다. 합동 산업 위원회와 해군 공동 생산 체계가 분기 내에 아테네에서 소집됩니다."
 greece.587.a: "추축이 탄생했습니다"
 greece.588.t: "그리스의 제안: IGB 파이프라인 확장"
 greece.588.d: "아테네가 그리스-불가리아 가스 연결관과 이에 연계된 알렉산드루폴리 터미널의 단계적 확장을 제안했습니다. 소피아는 가스 공급원을 다변화하고, 아테네는 발칸 전역에서 통과 수익을 확보하게 됩니다."
 greece.588.a: "소피아가 확장 계획에 서명합니다"
 greece.588.b: "소피아가 제안을 거부합니다"
 greece.589.t: "불가리아, 파이프라인 확장 승인"
 greece.589.d: "소피아가 확장을 승인했습니다. 공사는 이번 시즌 내에 착공될 예정이며, 불가리아로 북상하는 가스 흐름과 그리스 터미널을 통해 남하하는 가스 흐름은 두 배로 늘어날 것으로 전망됩니다."
 greece.589.a: "전략적 회랑입니다"
 greece.590.t: "그리스의 제안: 그리스-사우디 전략 이사회"
 greece.590.d: "아테네가 리야드와의 최고 전략 협력 이사회를 제안했습니다. 방위산업 협력, 국부 펀드 공동 투자, 정기적인 장관급 대화를 포함합니다. 왕국은 지중해 파트너를 얻고, 그리스는 자본을 얻게 됩니다."
 greece.590.a: "리야드가 수락합니다"
 greece.590.b: "리야드가 거절합니다"
 greece.591.t: "사우디아라비아, 이사회 소집"
 greece.591.d: "최고 전략 협력 이사회가 아테네에서 첫 회의를 개최합니다. 사우디 국부 펀드는 그리스 산업에 대한 첫 번째 투자 분할분을 발표합니다."
 greece.591.a: "획기적인 동반자 관계입니다"
 greece.592.t: "그리스의 제안: 그리스-에미리트 투자 협약"
 greece.592.d: "아테네가 아부다비와의 체계적인 투자 협약을 제안했습니다. 에미리트 펀드에 대한 세제 혜택, 아티카 자유 무역 지대 접근권, 그리고 걸프 물류망에 대한 그리스의 호혜적 투자를 포함합니다."
 greece.592.a: "아부다비가 수락합니다"
 greece.592.b: "아부다비가 거절합니다"
 greece.593.t: "아랍에미리트, 협약 서명"
 greece.593.d: "아부다비가 협약에 서명했습니다. 에미리트 자본이 그리스 물류와 산업에 유입되기 시작하며, 그리스 기업은 걸프 거점 기반시설에 대한 우선 접근권을 얻습니다."
 greece.593.a: "훌륭합니다"
 greece.594.t: "그리스의 제안: 동지중해 가스 포럼 가입"
 greece.594.d: "아테네가 암만의 동지중해 가스 포럼 가입을 제안하며 그리스가 가입을 후원하겠다고 밝혔습니다. 레반트에서 에게해에 이르는 지역 에너지 체계가 출현하게 될 것입니다."
 greece.594.a: "암만이 초청을 수락합니다"
 greece.594.b: "암만이 거절합니다"
 greece.595.t: "요르단, 동지중해 가스 포럼 가입"
 greece.595.d: "요르단이 동지중해 가스 포럼 가입을 공식화했습니다. 이 기구의 지리적, 정치적 영향력이 이제 동지중해 전역으로 확실하게 확장되었습니다."
 greece.595.a: "외교적 승리입니다"
 GRE_lobby_eu_partners: "EU 파트너 로비"
 GRE_lobby_eu_partners_desc: "그리스의 외교적 우선순위를 관철하고 서방 결속도를 쌓기 위해, 양자 방문, 입장 문서, 양보 거래 등 유럽 연합 내에서의 지속적인 로비 활동에 정치적 자본을 투입합니다."
 GRE_eastern_alignment_score: "그리스의 동방 정렬도"
