 USR_Union_state_category: "État de l'Union"
 USR_Union_state_category_desc: "§YThe Union State§! is a supranational project of [SOV.GetFlag]§YRussia§! and [BLR.GetFlag]§YBelarus§! created in the 90s of the 20th century and started its activity in 2000. A unique supranational entity presupposes the union of two states and integration in many areas, military, economic, political, etc., without losing independence.\nSerbia once wanted to become a part of this project, but it was rejected. Perhaps now the Union State will be able to accept more countries into its ranks."
