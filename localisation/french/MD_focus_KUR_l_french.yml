l_french:
 Kurdistan.2.t: "Le Kurdistan souhaite s'unir à l'Irak"
 Kurdistan.2.d: "Since the threat of ISIS is now gone, the Kurdistan Regional Government has expressed willingness to rejoin the federal government of Iraq"
 Kurdistan.2.a: "Bienvenue à la maison！"
 Kurdistan.3.t: "Résultats du référendum"
 Kurdistan.3.d: "Le référendum sur l'indépendance s'est tenu dans la région autonome kurde ainsi que dans les zones que nous avons reprises lors de la lutte contre Daech. Ce référendum a été un franc succès, avec 93 % de votes « oui » et un taux de participation de 72 %. Ce vote renforce considérablement la légitimité de notre gouvernement pour négocier une autonomie accrue, voire une indépendance totale."
 Kurdistan.3.a: "Plaider pour une indépendance totale."
 Kurdistan.3.b: "Utilisez cela comme levier pour obtenir votre autonomie."
 Kurdistan.4.t: "Le Kurdistan réclame son indépendance"
 Kurdistan.4.d: "Due to the success of the Kurdish Independence Referendum, the Kurdish government is trying to use the referendum as leverage to declare full independence. It seems that they aren't happy with just limited autonomy, and they still hold Kirkuk, which is rightfully part of Iraq."
 Kurdistan.4.a: "Absolument pas !"
 Kurdistan.4.b: "Oui, s'ils nous rendent Kirkouk."
 Kurdistan.4.c: "Accepter leurs exigences."
 Kurdistan.5.t: "Le Kurdistan exige davantage d'autonomie"
 Kurdistan.5.d: "Fort du succès du référendum d'indépendance kurde, le gouvernement kurde tente d'utiliser le référendum comme levier pour exiger davantage d'autonomie vis-à-vis du gouvernement fédéral. Il semble qu'ils ne se contentent plus d'une autonomie limitée, et ils tiennent encore Kirkouk, qui fait légitimement partie de l'Irak."
 Kurdistan.5.a: "Absolument pas !"
 Kurdistan.5.b: "Oui, s'ils nous rendent Kirkouk."
 Kurdistan.5.c: "Accepter leurs exigences."
 Kurdistan.6.t: "L'Irak accepte les exigences"
 Kurdistan.6.d: "Le gouvernement fédéral irakien a accepté nos exigences !"
 Kurdistan.6.a: "Huzzah !"
 Kurdistan.7.t: "L'Irak réclame Kirkouk"
 Kurdistan.7.d: "In a response to our demands, the Iraqi Government has stated that they will agree to our demands, but in exchange they want us to give them back control of the city of Kirkuk, which they see as rightfully theirs."
 Kurdistan.7.a: "Un prix convenable."
 Kurdistan.7.b: "Kirkouk est une terre kurde !"
 Kurdistan.8.t: "Le Kurdistan refuse"
 Kurdistan.8.d: "Le Kurdistan a refusé de nous rendre Kirkouk. Espérons qu'ils reviendront sur leurs idéaux de souveraineté"
 Kurdistan.8.a: "Mince."
 Kurdistan.9.t: "L'avenir du Kurdistan"
 Kurdistan.9.d: "Now that the negotiations with Iraq have broken down, we need to determine a path for our nation. We could start pursuing full independence, which will most likely upset Iraq. On the other hand, we could bury our ideas of independence and return to be governed by the Iraqi Federal Government."
 Kurdistan.9.a: "Le Kurdistan est une nation libre !"
 Kurdistan.9.b: "Implorer le pardon."
 Kurdistan.10.t: "Le Kurdistan proclame son indépendance"
 Kurdistan.10.d: "The Kurdish government announced today that Kurdistan is an independent country, and not part of Iraq. This is a serious blowback to the Iraqi nation, and the Kurdish forces still control the vital city of Kirkuk. Some politicians and generals are arguing that a show of force is necessary. We need to order our troops to occupy Kirkuk, and show the Kurds our willingness to defend Iraqi lands"
 Kurdistan.10.a: "Préparer une attaque contre Kirkouk !"
 Kurdistan.10.b: "Nous ne voulons pas déclencher une guerre."
 Kurdistan.11.t: "L'Irak se retourne contre Kirkouk !"
 Kurdistan.11.d: "Après notre déclaration d'indépendance, nous avons reçu des rapports indiquant que les forces irakiennes se préparent à attaquer Kirkouk. Défendre contre des troupes irakiennes bien équipées et expérimentées au combat sera difficile, et perdre la bataille serait une perte de face. D'un autre côté, une victoire possible pourrait effrayer les Irakiens. Nous pourrions aussi simplement nous retirer de la ville pour éviter le bain de sang."
 Kurdistan.11.a: "Prenez position !"
 Kurdistan.11.b: "Retraite !"
 Kurdistan.13.t: "Le destin du Kurdistan"
 Kurdistan.13.d: "Maintenant que nous avons pris le contrôle de Kirkouk, les Kurdes n'ont d'autre choix que de se soumettre, ou d'affronter des conséquences encore pires"
 Kurdistan.13.a: "Exiger leur soumission."
 Kurdistan.14.t: "L'Irak exige une soumission"
 Kurdistan.14.d: "Après la défaite et la perte de Kirkouk, le gouvernement irakien a repris du poil de la bête. Ils exigent désormais que nous abandonnions nos projets d'avenir et que nous nous soumettions à nouveau à leur autorité"
 Kurdistan.14.a: "Soumettre."
 Kurdistan.14.b: "Résister."
 Kurdistan.15.t: "Le Kurdistan soumet"
 Kurdistan.15.d: "Le Kurdistan a accepté de nous rejoindre !"
 Kurdistan.15.a: "Super."
 Kurdistan.16.t: "Le Kurdistan résiste"
 Kurdistan.16.d: "Le Kurdistan a refusé nos exigences de soumission"
 Kurdistan.16.a: "Nous le ferons donc à la dure."
 Kurdistan.17.t: "Échec à Kirkouk"
 Kurdistan.17.d: "Perdre la bataille de Kirkouk a été une disgrâce. Les Kurdes contrôlent encore la ville, et nous sommes humiliés. Devons-nous encore chercher l'unification ?"
 Kurdistan.17.a: "Nous réessayerons, plus fort cette fois."
 Kurdistan.17.b: "Laisser les Kurdes tranquilles."
 Kurdistan.18.t: "Le PDK exige des pourparlers de réunification"
 Kurdistan.18.d: "Le gouvernement du KDP, dirigé par [KUR.GetLeader], a exigé que nous venions à la table des négociations et rejoignions le gouvernement d'unité kurde. Ils affirment que c'est quelque chose que nous aurions dû faire il y a des années après la fin des hostilités entre nos deux gouvernements, mais ils semblent plus insistants que jamais pour que nous rejoignions leur nouveau gouvernement. Que nous le fassions ou non nous appartient. Mais si nous ne le faisons pas, nous risquons un conflit renouvelé avec le KDP."
 Kurdistan.18.a: "Nous nous unirons, pour le bien du Kurdistan"
 Kurdistan.18.b: "Jamais"
 Kurdistan.19.t: "L'UPK refuse les pourparlers de réunification"
 Kurdistan.19.d: "It appears that the PUK government has refused to join our Unity Government, and as a result, they leave us no choice but to unify the Kurdish people under one banner."
 Kurdistan.19.a: "Dommage qu'il ait fallu en arriver là"
 Kurdistan.20.t: "L'UPK accepte les pourparlers de réunification"
 Kurdistan.20.d: "L'UPK a accepté de rejoindre notre gouvernement d'unité, et des négociations sont en cours pour intégrer leurs territoires et leurs troupes au nouveau gouvernement."
 Kurdistan.20.a: "Super."
 KurdistanNews.1.t: "Le Kurdistan rejoint l'Irak"
 KurdistanNews.1.d: "Au plus fort de Daech, le Kurdistan s'est lentement éloigné de l'Irak et est devenu plus indépendant. Maintenant que Daech a été vaincu, le gouvernement régional du Kurdistan semble avoir fait volte-face et a exprimé le souhait de retravailler avec le gouvernement fédéral irakien. Beaucoup spéculaient que les Kurdes viseraient l'indépendance, mais il semble qu'ils aient décidé autrement, craignant peut-être les répercussions de leurs voisins."
 KurdistanNews.1.a: "Intéressant"
 KurdistanNews.2.t: "Le référendum d'indépendance kurde"
 KurdistanNews.2.d: "Le gouvernement régional kurde a annoncé qu'il tiendrait un référendum d'indépendance dans les zones qu'il contrôle actuellement. La démarche a été jugée controversée, car le référendum se tient dans des zones qui ne font pas officiellement partie de la région autonome kurde mais de l'État fédéral d'Irak, y compris la grande ville de Kirkouk.\n\nBeaucoup n'y voient qu'un accaparement de terres par les Kurdes, tandis que d'autres soutiennent que les Kurdes ont gagné leur droit à l'indépendance après avoir effectivement sauvé l'Irak de Daech. Même si le GRK affirme que les résultats ne seront pas contraignants, beaucoup craignent que cela mène à la pleine indépendance et éventuellement à un nouveau conflit en Irak."
 KurdistanNews.2.a: "Ils n'ont pas le droit de faire cela !"
 KurdistanNews.2.b: "Let's see how this plays out."
 KurdistanNews.3.t: "Le référendum d'indépendance kurde l'emporte"
 KurdistanNews.3.d: "Le référendum d'indépendance kurde a été un succès retentissant pour le gouvernement kurde. Avec 93 % de votes « oui » et une participation de 72 %, les Kurdes partout se réjouissent. Fort de ce succès, le gouvernement kurde a décidé de déclarer la pleine indépendance vis-à-vis du gouvernement fédéral irakien. Surprise, le gouvernement irakien a accepté la demande."
 KurdistanNews.3.a: "Il faut arrêter les Kurdes."
 KurdistanNews.3.b: "Intéressant"
 KurdistanNews.4.t: "Le référendum d'indépendance kurde l'emporte"
 KurdistanNews.4.d: "Le référendum d'indépendance kurde a été un succès retentissant pour le gouvernement kurde. Avec 93 % de votes « oui » et une participation de 72 %, les Kurdes partout se réjouissent. Fort de ce succès, le gouvernement kurde a décidé d'exiger davantage d'autonomie vis-à-vis du gouvernement fédéral irakien. Surprise, le gouvernement irakien a accepté la demande."
 KurdistanNews.4.a: "Il faut arrêter les Kurdes."
 KurdistanNews.4.b: "Intéressant"
 KurdistanNews.5.t: "L'Irak s'empare de Kirkouk"
 KurdistanNews.5.d: "Alors que les négociations entre l'Irak et le Kurdistan échouaient, les forces irakiennes ont avancé pour reprendre Kirkouk, que les Kurdes avaient prise à Daech plus tôt. À l'approche des forces irakiennes, la plupart des éléments des Peshmergas se sont retirés de la ville sans combattre. Certains éléments indépendants des forces kurdes sont restés et ont tenté d'organiser une défense, mais ont été rapidement submergés par les Irakiens. En seulement deux jours, les forces irakiennes avaient repris le contrôle total de la ville, pour l'essentiel sans combattre."
 KurdistanNews.5.a: "Intéressant"
 KurdistanNews.6.t: "L'Irak s'empare de Kirkouk"
 KurdistanNews.6.d: "As the negotiations between Iraq and Kurdistan broke down, Iraqi forces moved to capture the city of Kirkuk, which the Kurds had captured from ISIS earlier. As the Iraqi forces approached the city, Kurdish forces took up defensive positions, with main defenses being at the K1 military base and the Kirkuk-Tikrit Road.\n\nDespite strong defence, the Iraqi 9th Armoured Division managed to capture the military base and advance towards the Northern oil field of Baba Gurgur, while the Popular Mobilisation Forces tied down Kurdish troops in the city itself. Fearing encirclement, the Kurdish forces started retreating from the city, some under orders and some on their own. After a few days of fighting, Iraq was fully in control of the city."
 KurdistanNews.6.a: "Intéressant"
 KurdistanNews.7.t: "Le Kurdistan défend Kirkouk"
 KurdistanNews.7.d: "As the negotiations between Iraq and Kurdistan broke down, Iraqi forces moved to capture the city of Kirkuk, which the Kurds had captured from ISIS earlier. As the Iraqi forces approached the city, Kurdish forces took up defensive positions, with main defenses being at the K1 military base and the Kirkuk-Tikrit Road.\n\nIraqi 9th Armoured Division split their forces in two, as they attacked both the military base and the city itself through its Southern suburbs. At the same time, the Popular Mobilisation Forces attacked in the centre towards Kirkuk Airfield. As the 9th Armoured Division got bogged down in the suburbs, the Kurdish forces managed to conduct a flanking attack against the PMF forces, forcing them to retreat. With the centre destroyed, the separated elements of the 9th Armoured Division were soon forced to retreat as well. The Battle of Kirkuk proved to be disastrous for the Iraqi forces, while the morale of the Kurds was greatly boosted."
 KurdistanNews.7.a: "Intéressant"
 KurdistanNews.8.t: "Le Kurdistan se soumet à l'Irak"
 KurdistanNews.8.d: "After their victory in Kirkuk, Iraq has increased pressure towards Kurdistan. In a recent move, Iraq demanded that Kurdistan abandon all ideas of independence or increased autonomy. Having been left without a choice, the Kurdish government agreed to the demands to prevent any more bloodshed."
 KurdistanNews.8.a: "Intéressant"
 KurdistanNews.9.t: "Le Kurdistan résiste à l’Irak"
 KurdistanNews.9.d: "After their victory in Kirkuk, Iraq has increased pressure towards Kurdistan. In a recent move, Iraq demanded that Kurdistan abandon all ideas of independence or increased autonomy. The Kurdish government responded that Iraq has already shown its hostility against the Kurdish people, and as such they have no reason to agree to the demands of bullies. This might spark a new civil war in Iraq"
 KurdistanNews.9.a: "Intéressant"
 KurdistanNews.10.t: "L'Irak se retourne contre le Kurdistan"
 KurdistanNews.10.d: "The defeat at Kirkuk was a massive humiliation to Iraq. As a response to this, it seems they are preparing for a full-scale invasion of Kurdistan in order to bring the breakaway state back under Iraqi control."
 KurdistanNews.10.a: "Intéressant"
 KurdistanNews.11.t: "L'Irak se replie dans l'isolement"
 KurdistanNews.11.d: "La défaite à Kirkouk a été une humiliation massive pour l'Irak. Il semble que la défaite ait complètement démoralisé l'Irak de toute hostilité envers les Kurdes. Les Kurdes ont gagné leurs exigences par le sang."
 KurdistanNews.11.a: "Intéressant"
 KUR_the_great_divide: "Le grand fossé kurde"
 KUR_the_great_divide_desc: "Il y a une faille dans les terres kurdes. Tribus, partis et organisations se sont taillé des territoires, divisant davantage le peuple kurde et nuisant à l'objectif ultime de l'unité kurde."
 KUR_propose_reunification: "Proposer la réunification avec l'[PUK.GetFlag] UPK"
 KUR_propose_reunification_desc: "With the creation of the Unity Government in 1993, the PUK should have already joined their Kurdish brothers. Now that the independence of all of Kurdistan is threatened, it is imperative that we push them to the negotiating table to preserve the freedom of our peoples."
 PUK_stomp_out_the_iek: "Écraser l'[IEK.GetFlag] [IEK.GetName]"
 PUK_stomp_out_the_iek_desc: "The IEK have long been a thorn in the side of our government. Their terroristic activities have hampered our legitimacy, and have hurt our ability to efficiently govern the territories to the East. The time has come for us to demand their submission once and for all."
 KUR_declare_kurdistan: "Déclarer l’unification des Peshmergas"
 KUR_declare_kurdistan_desc: "Avec toutes les terres kurdes fermement sous notre contrôle, nous pourrons enfin nous revendiquer à bon droit comme le véritable État kurde dans la région des Peshmergas."
 KUR_cores_on_all_TT: "Nous accordera des cœurs sur tous les États du Kurdistan irakien [IRQ.GetFlag]"
 KUR_barzani_tribe: "Direction Barzani"
 KUR_barzani_tribe_desc: "Coming from a Sufi, Sunni background, and originating from Barzan in Northern Kurdistan, the Barzani tribe has for the longest time, held a firm grip over the Kurdish region north of Iraq. This influence has allowed them to play a major role in Iraqi and Kurdish politics over time, often times swaying it one way or another.\n§W--------------§!\nThis national spirit will be §RRemoved§! if the £KUR_conservatism_small KDP is not in power."
 PUK_battle_hardened: "Endurci au combat"
 PUK_battle_hardened_desc: "L'UPK a joué un rôle crucial dans la guerre Iran-Irak, infligeant de lourds dégâts à l'armée de Saddam. Cette expérience a permis à notre commandement et à nos troupes d'acquérir une expérience inestimable sur le champ de bataille.\n§W--------------§!\nCet esprit national sera §Rretiré§! si le £KUR_Autocracy_small UPK n'est pas au pouvoir."
 KurdistanNews.12.t: "Unification des peshmergas : les forces kurdes se rassemblent sous un commandement unique"
 KurdistanNews.12.d: "Après des décennies de division entre le KDP aligné sur Barzani et l'UPK dirigée par Talabani, le paysage politique kurde du nord de l'Irak a connu un tournant. Dans une démarche historique, le leadership kurde a déclaré la pleine unification de toutes les forces peshmergas sous une seule structure de commandement, mettant fin aux rivalités internes qui ont plombé la coordination militaire kurde depuis la guerre civile kurde de 1994.\n\nLes unités affiliées au KDP et à l'UPK, ainsi que les peshmergas des forces de protection des minorités yézidies et chrétiennes, sont désormais appelées à opérer sous un ministère unifié. Cette consolidation fusionne de fait les forces de sécurité d'Erbil et de Souleimaniye, unissant les régions de Dohuk, Kirkouk et Halabja sous une seule hiérarchie militaire kurde pour la première fois de l'histoire moderne.\n\nL'unification intervient après que les forces kurdes ont joué un rôle pivot dans le combat contre Daech, au cours duquel l'absence d'une structure de commandement cohérente a été identifiée à plusieurs reprises comme une faiblesse critique. La démarche a suscité l'inquiétude des capitales voisines, en particulier Ankara et Téhéran, qui voient une capacité militaire kurde unifiée comme un défi direct à leurs propres intérêts de sécurité nationale dans la région."
 KurdistanNews.12.a: "Une armée kurde unifiée à notre frontière est une menace inacceptable pour notre sécurité nationale."
 KurdistanNews.12.b: "Un pas historique pour l'autodétermination kurde, mais les tensions régionales ne manqueront pas de suivre."
 KUR_independence_category: "Indépendance"
 KUR_hold_independence_referendum: "Organiser un référendum d'indépendance"
 KUR_hold_independence_referendum_desc: "Les Peshmergas unifiés sous un seul commandement, le moment est venu de tester la volonté du peuple kurde. Nous tiendrons un référendum non contraignant sur l'indépendance dans toute la région autonome et les territoires contestés sous notre contrôle, y compris Kirkouk."