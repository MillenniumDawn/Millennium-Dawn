 EST_foreign_research_idea: "Ausländische Forschung verfolgen"
 EST_foreign_research_idea_desc: "Estland hat zwar klare militärische Ambitionen, aber seine inländischen Forschungskapazitäten sind nach wie vor begrenzt. Durch die Förderung strategischer Partnerschaften mit unseren Verbündeten können wir Zugang zu hochmodernen Waffensystemen und fortschrittlichen Militärtechnologien erhalten und so unsere Bemühungen um die Modernisierung der Verteidigung beschleunigen."
 EST_domestic_research_idea: "Inländische Forschung verfolgen"
 EST_domestic_research_idea_desc: "Wir haben uns zu lange auf Ausländer verlassen. Estland wird stark bleiben, indem wir weiter in unsere Rüstungsindustrie investieren und unsere Abhängigkeit von ausländischen Lieferanten verringern."
