 SAF.communist_state: "£SAF_communism (SACP) - 南非共产党"
 SAF.communist_state_icon: "£SAF_communism"
 SAF.communist_state_desc: ""
 SAF.communist_state_main_desc: "(马克思列宁主义)\n南非共产党\n\n南非现存最古老的政党之一。南非共产党成立于1921年，最初名为南非共产党（CPSA），该前身于1950年因其非法地位而自行解散，以此作为避免镇压的策略。\n\n随后，南非共产党于1953年“正式”重新成立，作为与多个其他政党以及不久之后的民兵和武装团体一起，进行反种族隔离地下抵抗的一部分。"
 SAF.communist_state_solo_desc: ""
 SAF.communist_state_solo_TEMP_desc: "$SAF.communist_state_main_desc$\n\n§2南非共产党已不再是三方联盟的成员，而是独立参加选举。§!§2！§!"
 SAF.communist_state_tripartite_desc: "$SAF.communist_state_main_desc$\n\n§2南非共产党是三方联盟的成员，一旦掌权，将自动与§!§Y$SAF.anarchist_communism$§!§2§!§Y(COSATU) - 南非工会大会§!§2§!联合！"
 SAU.communist_state: "£generic_Communist_State_small (SCP) 沙特共产党"
 SAU.communist_state_icon: "£generic_Communist_State_small"
 SAU.communist_state_desc: "（马克思列宁主义） - 沙特共产党\n\n沙特共产党于1975年从民族解放阵线中诞生，其前身是东部省石油工人的劳工斗争。这些工人针对阿美石油公司和君主制的罢工遭到了大规模逮捕。该党秉持世俗主义和马克思列宁主义，呼吁推翻沙特王室，将石油工业国有化，并在阿拉伯建立工人共和国。在数十年的镇压和失去苏联支持者的双重打击下，该党在流亡者和油田贫苦民众中存续至今。"
 SCO.communist_state: "£generic_Communist_State_small CPS - 苏格兰共产党"
 SCO.communist_state_desc: "马克思列宁主义"
 SEN.communist_state: "£SEN_communist_state 非洲工人联盟"
