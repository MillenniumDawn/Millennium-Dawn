 KILLSAT1: "KILLSAT 1985"
 KILLSAT1_desc: "Un vehículo de destrucción cinética (Kinetic Kill Vehicle) es un arma de proyectil que utiliza energía cinética para dañar un objetivo, en lugar de explosivos u otras cargas útiles.\n\n(KILLSAT 1985):\n§YLanzamiento espacial§!:\nMasa: §Y4000§! kg\n§YArma antisatélite§!:\nPrecisión: §Y40%§!\n§YProducción§!:\nPrecio por unidad: $§Y0.7§! mil millones | Industria civil por unidad: §Y2§! | Días de producción por unidad: §Y30§!"
