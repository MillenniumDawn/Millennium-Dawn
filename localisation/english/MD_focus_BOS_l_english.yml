 # Civil war operations decisions
 RSK_requisition_the_mines: "Requisition the Mines"
 RSK_requisition_the_mines_desc: "Seize the output of the Entity's mines for the war chest. The workers will not thank us."
 RSK_appeal_to_belgrade: "Appeal to Belgrade"
 RSK_appeal_to_belgrade_desc: "Ask Serbia to back the Entity openly, lifting morale and warming relations with Belgrade."
 HZG_war_levy: "Herzegovina War Levy"
 HZG_war_levy_desc: "Impose an emergency levy on the cantons to fund the war. Stability will suffer."
 HZG_appeal_to_zagreb: "Appeal to Zagreb"
 HZG_appeal_to_zagreb_desc: "Ask Croatia to stand behind Herzeg-Bosnia, lifting morale and warming relations with Zagreb."

 # Civil war aid events
 BOS_events.68.t: "The Entity Calls"
 BOS_events.68.d: "Republika Srpska appeals to Serbia for arms and volunteers. Belgrade must weigh open support against the risk of a wider war."
 BOS_events.68.a: "Send weapons and volunteers"
 BOS_events.68.b: "We cannot be seen to intervene"
 BOS_events.69.t: "Belgrade Answers"
 BOS_events.69.d: "Serbian crates reach the front. The Entity's soldiers take heart."
 BOS_events.69.a: "For the Serbian people"
 BOS_events.70.t: "The Cantons Call"
 BOS_events.70.d: "Herzeg-Bosnia appeals to Croatia for arms and volunteers to hold the line."
 BOS_events.70.a: "Arm the cantons"
 BOS_events.70.b: "Zagreb must stay out of this"
 BOS_events.71.t: "Zagreb Answers"
 BOS_events.71.d: "Croatian weapons reach Herzeg-Bosnia. The cantons' defenders are heartened."
 BOS_events.71.a: "For the Croat people"

