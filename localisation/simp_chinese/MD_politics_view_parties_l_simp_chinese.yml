 ADY.anarchist_communism_desc: "（社会保守主义）- 俄罗斯生命党\n\n俄罗斯生命党由联邦委员会主席谢尔盖·米罗诺夫于2002年6月29日创立，是一个亲克里姆林宫的中间偏左政党，自称在经济上奉行自由主义，在其他所有方面都持民族主义立场。该党主张提高生活水平、实行国家物价管制和保护家庭，目标选民是那些希望获得更多福利但又不想投票给共产党的人。\n\n该党与俄罗斯复兴党结盟，在2003年国家杜马选举中获得1.9%的选票，但未赢得任何席位，其各地区分支机构（包括阿迪格共和国的分支机构）规模仍然很小。2006年10月28日，该党与祖国党和退休人员党合并，组建了公正俄罗斯党，并继承了其在阿迪格共和国的组织。"
 ADY.anarchist_communism_1: "£SOV_left_wing_radical_1 (SR) - 公正俄罗斯党"
 ADY.anarchist_communism_1_icon: "£SOV_left_wing_radical_1"
 ADY.anarchist_communism_1_desc: "（左翼民粹主义）- 公正俄罗斯党\n\n“公正俄罗斯”党于2006年10月28日由谢尔盖·米罗诺夫领导的俄罗斯生命党、祖国党和退休人员党合并而成，是克里姆林宫认可的、与共产党抗衡的社会主义政党。该党主张建立强大的福利国家、实行累进税制和国家控制自然资源，同时在外交政策上支持总统。自2021年与“为了真理”和“俄罗斯爱国者”合并后，该党更名为“公正俄罗斯 - 为了真理”。\n\n在阿迪格共和国，它是议会中最小的政党，2011年在54个席位中占有2个席位，2016年在50个席位中占有2个席位，2021年在6.14%的席位中占有1个席位。它的优势在于它是当局更倾向于效忠的左翼政党，而不是拥有任何独立的群众基础。"
