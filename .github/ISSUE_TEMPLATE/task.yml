name: Task
description: An update, system, or graphics task for Millennium Dawn.
title: "[TASK] "
labels: ["enhancement"]
type: task
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What the task is and what done looks like.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Context
      description: Screenshots, references, and related issues.
