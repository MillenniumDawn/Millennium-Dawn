 alg_cabinet.201.t: "Давление глубинного государства"
 alg_cabinet.1.d: "Нынешнее правительство отражает баланс между президентским окружением, бюрократией и силовым аппаратом.\n\nПремьер-министр: [GetPMName]\nМинистр обороны: [GetMODName]\nМинистр внутренних дел: [GetMOIName]\nМинистр иностранных дел: [GetMOFAName]\nМинистр финансов: [GetMOFName]\nМинистр энергетики: [GetMOEName]\nМинистр юстиции: [GetMOJName]\nГлава разведки: [GetDRSName]\n\nЛояльность правительства: [GetCabinetLoyaltyLevel]\nКомпетентность правительства: [GetCabinetCompetenceLevel]\nВлияние глубинного государства: [GetCabinetDeepStateLevel]"
 alg_cabinet.10.d: "Пост премьер-министра остаётся ключевым: он координирует министерства, прикрывает президента и ведёт текущее управление. Верный выбор укрепит режим, ошибочный — придаст смелости соперникам."
 alg_cabinet.1000.d: "Пост премьер-министра остаётся ключевым: он координирует министерства, прикрывает президента и ведёт текущее управление. Верный выбор укрепит режим, ошибочный — придаст смелости соперникам."
 alg_cabinet.20.d: "Министерство обороны — не просто ведомство. Оно накрепко связано с офицерским корпусом, высшим командованием и сетями, составляющими глубинное государство. Смена его главы всегда опасна."
 alg_cabinet.25.d: "Офицерский корпус недоволен недавними переменами в министерстве обороны. Некоторые группировки открыто жалуются, что президент нарушает сложившийся баланс в вооружённых силах."
 alg_cabinet.30.d: "Министерство внутренних дел ведает внутренним управлением, губернаторами провинций и многими рычагами поддержания порядка. Его глава должен быть и надёжным, и политически искусным."
 alg_cabinet.40.d: "Министр иностранных дел задаёт тон, каким республика говорит с миром, уравновешивая отношения с Западом, арабским миром и давнюю традицию неприсоединения."
 alg_cabinet.50.d: "От министерства финансов зависит, пойдёт ли Алжир путём технократических реформ, государственного управления экономикой или привычного бюрократического равновесия, на котором давно держится режим."
 alg_cabinet.60.d: "Углеводороды остаются основой алжирского государства. Поэтому министерство энергетики — один из самых важных для экономики постов в правительстве."
 alg_cabinet.70.d: "Министерство юстиции можно использовать и как рычаг реформ, и как орудие дисциплины в режиме, и как оружие силового аппарата."
 alg_cabinet.80.d: "Глава разведки распоряжается самыми закрытыми и внушающими страх институтами государства. Это самое чувствительное назначение в правительстве, и любая крупная перемена может вызвать ответный удар."
 alg_cabinet.800.d: "Глава разведки распоряжается самыми закрытыми и внушающими страх институтами государства. Это самое чувствительное назначение в правительстве, и любая крупная перемена может вызвать ответный удар."
 alg_cabinet.85.d: "Часть спецслужб сопротивляется недавнему назначению. Старые сети целы, и не все из них готовы смириться с более жёстким политическим контролем."
 alg_cabinet.100.d: "Полная перестановка даёт президенту возможность навести порядок, вознаградить союзников и задать новое направление. Но всякий новый баланс рождает новых врагов."
 alg_cabinet.110.d: "До президента дошли слухи о шаткой лояльности. Публичная демонстрация единства может восстановить авторитет, но нажим способен вскрыть и скрытые трещины."
 alg_cabinet.200.d: "Несколько ключевых министров выказывают непослушание или политическую ненадёжность. В системе, где и без того хватает соперничающих сетей и скрытых центров власти, такая нелояльность опасна."
 alg_cabinet.201.d: "Глубинное государство требует большего влияния на назначения министров и на курс правительства. Уступка сохранит спокойствие на время, но сопротивление грозит открытым столкновением."
 alg_cabinet.1.a: "Понятно."
