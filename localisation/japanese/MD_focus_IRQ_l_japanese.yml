 IRQ_oil_for_food_medical_focus: "石油食料交換 - 医療焦点"
 IRQ_aftermath_of_war: "戦争の余波"
 IRQ_aftermath_of_war_desc: "我が国はまだ戦争から立ち直れていない……あらゆる犠牲を払ってイラクを再建しなければならない。"
 IRQ_boosted_military_production: "倍増した軍事生産"
 IRQ_boosted_industrial_production: "倍増した産業生産"
