 paid_parental_scheme_ast_2: "父母支付计划"
 paid_parental_scheme_ast_desc: "赋予新父母最多26周的带薪假期。允许他们请假更好地照顾新生儿或领养的孩子，并促进人口增长。"
 paid_parental_scheme_ast_2_desc: "这项计划整合了我们原有的育儿支持方案，以经济补贴取代了之前的“育儿津贴”，旨在帮助新父母。新父母还可享受长达26周的带薪育儿假，并获得一次性补助，以便更好地照顾新生儿或领养子女，同时鼓励人口增长。"
 social_capitalism_ast: "社会资本主义"
 social_capitalism_ast_desc: "我们采取更积极主动的经济管理方式，既带来了一些好处，也存在一些小的弊端。通过监管和直接管理，我们可以更直接地影响经济，并确保经济始终服务于公民的利益。随着我们不断推进这一方式的实施，我们的方法也将日臻完善。"
 building_the_education_revolution_ast: "§G构建教育革命§!"
