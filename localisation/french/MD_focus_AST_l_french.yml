 tour_the_roulettes: "Tournée des Roulettes"
 the_roulettes_tt: "Une option pour faire une tournée des Roulettes sera disponible dans l'onglet §2décisions§!."
 john_howard_desc: "John Howard était avocat commercial avant de rejoindre le Parti libéral en 1957, où il gravit les échelons, de président des Jeunes libéraux, pour finalement devenir le député de Bennelong en 1974. Cela l'a introduit dans le monde de la politique parlementaire. Il ne fallut pas longtemps avant qu'Howard ne soit recruté par le gouvernement Fraser l'année suivante, nommé ministre des Entreprises et des Affaires du consommateur. \n \nHoward n'eut aucun mal à monter à nouveau dans les rangs, devenant le plus jeune trésorier depuis près de 75 ans. Partisan populaire de l'économie de marché libre, il a pu réformer lentement l'ancien système économique, bien que ses réformes fiscales aient échoué. Une chose à laquelle il n'abandonnerait pas si facilement. Finalement, la récession des années 1980 fut suffisante pour chasser le gouvernement libéral du pouvoir et rétrograder Howard au poste de chef adjoint du parti. \n \nSa position au sein du Parti libéral allait changer au cours de la décennie suivante, que l'on pourrait facilement décrire comme une série de coups d'État, doubles coups d'État et une tentative électorale ratée de Howard, battu par le très populaire Bob Hawke. Enfin, la chance de Howard est venue en 1996. Remportant une victoire écrasante contre le sortant Paul Keating, Howard a fait campagne sur la réduction du déficit budgétaire et la sortie de l'Australie de sa crise économique. \n \nDepuis, il est resté globalement fidèle à ses promesses, mais malgré tout son travail, les défis ne font que commencer."
 sydney_declaration_idea_ast: "La déclaration de Sydney"
 AST_MOD_MILLENNIUM_DAWN_DESC: "Au tournant du siècle, l'Australie a connu ses premiers signes de prospérité économique depuis les années 80. Avec le Premier ministre John Howard à la barre, un leader connu pour sa politique économique progressiste et sa popularité moyenne, le pays a déjà subi des changements significatifs en peu de temps. Maintenant à un seuil culturel, avec les Jeux olympiques de Sydney à venir, l'Australie est prête pour la grandeur, si elle est guidée d'une main ferme. \n \nMalgré les progrès, cependant, le mécontentement grandit. Des années de négligence de la part du gouvernement pour remédier à la souffrance de la communauté indigène, le problème a commencé à s'infecter. Les troubles sociaux augmentent et il est peu probable que quoi que ce soit s'améliore sans une réforme significative. La domination de l'industrie des ressources a également augmenté au point où l'économie australienne frôle le statut d'État pétrolier, laissant le pays dans un état très précaire."
 mining_industrialists_ast: "Industriels miniers"
 mining_industrialists_ast_desc: "Une main invisible s'est mêlée de la politique australienne et de ses industries depuis des décennies. La législation contre eux semble toujours se solder par un échec, et la direction de notre économie n'a réussi que si elle favorise les conglomérats miniers. Que ce soit par le lobbying ou les médias, ils finissent toujours par s'en sortir."
 ast_rail_tt: "Le projet ferroviaire sera annulé"
 ast_introduce_temporary_levies: "Introduire des prélèvements temporaires"
 ast_introduce_temporary_levies_desc: "Si notre déficit devient ingérable, nous pouvons introduire des prélèvements d'urgence sur les entreprises et les hauts revenus, augmentant temporairement les taux d'impôt pour ramener un peu de recettes extra."
