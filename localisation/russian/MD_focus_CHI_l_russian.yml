 CHI_MAC_sinicization_modifier: "Китаизация Макао"
 CHI_MAC_sinicization_modifier_desc: ""
 OMG_sinicization: "£GFX_text_icon_mongolia_sar Китаизация Внутренней Монголии: [?OMG_sinicization_var|Y1]"
 OMG_sinicization_tt: "£GFX_text_icon_mongolia_sar Китаизация Внутренней Монголии: $RIGHT|Y=1$"
 CHI_OMG_sinicization_modifier: "Китаизация Внутренней Монголии"
 CHI_OMG_sinicization_modifier_desc: "Отражает китаизацию Внутренней Монголии и экономические условия, которые Пекин предоставляет региону по мере её роста. Китаизация растёт благодаря решениям по Внутренней Монголии и фокусам ветки §Y$CHI_SAR_integrate_OMG$§!.\n§W--------------§!\nЭтот модификатор будет §Rудалён§!, если мы завершим фокус §Y$CHI_SAR_integrate_OMG$§!, для которого требуется §Yкитаизация Внутренней Монголии§! не менее §Y90§!."
 CHI_TAI_trust: "[CHI.GetFlag]§HДоверие: [CHI.GetName] и [TAI.GetName]§! [TAI.GetFlag]"
 CHI_TAI_trust_tt: "$CHI_TAI_trust$: $RIGHT|Y=1$"
 CHI_taiwan_us_support: "§Y[USA.GetFlag][USA.GetName]§!: поддержка страны §Y[TAI.GetNameWithFlag]§!"
 CHI_taiwan_us_support_tt: "$CHI_taiwan_us_support$: $RIGHT|-=0$"
 CHI_taiwan_strait_tension: "Напряжённость в проливе ([TAI.GetNameWithFlag])"
 CHI_taiwan_strait_tension_tt: "$CHI_taiwan_strait_tension$: $RIGHT|+=0$"
 CHI_taiwan_recognition_count: "Дипломатические союзники страны [TAI.GetNameWithFlag]"
 CHI_taiwan_recognition_count_tt: "$CHI_taiwan_recognition_count$: $RIGHT|-=0$"
 CHI_SAR_MIO_share_tt: "Все марионеточные государства-САР получают доступ к военно-промышленным организациям Китая."
 CHI_tai_pressure_economic_tt: "Китай использует торговую зависимость, чтобы вынудить Вашингтон сократить поддержку Тайваня. США должны решить, как ответить."
 CHI_tai_pressure_diplomatic_tt: "Китай открывает сдержанные дипломатические каналы, чтобы убедить Вашингтон дистанцироваться от Тайваня."
 CHI_pressure_derecognize_TAI_tt: "Китай оказывает экономическое и дипломатическое давление. Если цель не отзовёт признание Тайваня в установленный срок, Китай введёт торговое эмбарго."
 TAI_reduced_us_support: "Сокращение военной поддержки США"
 TAI_reduced_us_support_desc: "В результате давления со стороны Китая на Вашингтон Соединённые Штаты сократили поставки оружия и военное сотрудничество с Тайванем. Вооружённые силы сталкиваются со снижением боеготовности и ухудшением боевого духа в подразделениях, которые зависят от американского оборудования и доктрины."
 TAI_isolated_from_us: "Брошены Вашингтоном"
 TAI_isolated_from_us_desc: "Под постоянным давлением со стороны Китая Соединённые Штаты официально прекратили оказывать Тайваню военную и дипломатическую поддержку. Вооружённые силы остались без своего главного гаранта безопасности, что серьёзно подорвало их оборонный потенциал и доверие гражданского населения."
 CHI_TAI_shared_modifier: "Отношения между берегами пролива"
 CHI_TAI_shared_modifier_desc: "Динамический показатель экономической и политической взаимозависимости по обе стороны Тайваньского пролива. Укрепление связей повышает стабильность и демократический дрейф, одновременно улучшая торговые отношения, эффективность производства, темпы научных исследований и объёмы строительства; напротив, отчуждение усиливает коммунистический дрейф, внутреннее политическое давление и потенциал проведения морских рейдов."
 CHI_SAR_network_modifier: "Система «Один Китай»"
 CHI_SAR_network_modifier_desc: ""
 CHI_TAI_air_dominance: "Господство в воздухе над проливом"
 CHI_TAI_air_dominance_desc: "Операции Военно-воздушных сил НОАК над Тайваньским проливом обеспечили постоянное давление с воздуха на оборонительные силы Тайваня, что привело к снижению их способности сопротивляться установлению контроля над воздушным пространством."
 CHI_TAI_naval_modernization_idea: "Модернизация военно-морского флота"
 CHI_TAI_naval_modernization_idea_desc: "Благодаря программе ускоренного пополнения флота Военно-морских сил НОАК был сформирован современный флот, способный вести длительные операции в Тайваньском проливе."
 TAI_blockade_economic_crisis: "Экономический кризис из-за блокады"
 TAI_blockade_economic_crisis_desc: "Китайская морская блокада перерезала морские торговые пути Тайваня, что привело к острой нехватке топлива, сырья и потребительских товаров. Промышленное производство резко сократилось."
 TAI_self_sufficiency: "Меры самообеспечения"
 TAI_self_sufficiency_desc: "Чрезвычайные меры по развитию отечественных производственных мощностей и снижению зависимости от импортных товаров начали приносить результаты, частично компенсируя последствия блокады."
 TAI_cyber_sabotage: "Кибердиверсия"
 TAI_cyber_sabotage_desc: "Скоординированная кибератака со стороны Китая привела к сбоям в работе критически важных объектов инфраструктуры, систем военной связи и финансовых систем по всему Тайваню."
 TAI_blockade_partial: "Нарушение морского сообщения"
 TAI_blockade_partial_desc: "Объявленная Китаем зона морской безопасности создаёт препятствия для коммерческого судоходства и приводит к росту стоимости страхования судов, следующих в порты Тайваня."
 TAI_emergency_situation: "Чрезвычайное положение"
 TAI_emergency_situation_desc: "В ответ на блокаду со стороны Китая Тайвань объявил чрезвычайное положение. Был расширен призыв на военную службу и введены меры гражданской обороны, однако экономические потери носят серьёзный характер."
 CHI_TAI_tourism_ban: "Заморозка туризма через пролив"
 CHI_TAI_tourism_ban_desc: "КНР приостановила выездной групповой и индивидуальный туризм на Тайвань, прервав поток туристов, который формировался с момента либерализации поездок через Тайваньский пролив в 2008 году. В 2019 году Пекин распространил запрет на разрешения на индивидуальные поездки, что привело к прекращению ежегодных поездок сотен тысяч туристов. Эта мера наносит прямой ущерб секторам гостеприимства, розничной торговли и услуг Тайваня, одновременно демонстрируя готовность Пекина использовать экономическую взаимозависимость в качестве средства принуждения."
 CHI_crossstrait_operations: "Готовность к операциям в Тайваньском проливе"
 CHI_crossstrait_operations_desc: "Народно-освободительная армия Китая достигла полной боевой готовности к проведению совместных десантно-морских и воздушно-десантных операций в Тайваньском проливе."
 CHI_TAI_amphibious_mastery: "Доктрина морского десанта"
 CHI_TAI_amphibious_mastery_desc: "Подразделения морской пехоты НОАК достигли высокого уровня мастерства в проведении общевойсковых десантных операций благодаря интенсивным учениям в Тайваньском проливе."
 CHI_TAI_military_buildup_idea: "Наращивание сил у пролива"
 CHI_TAI_military_buildup_idea_desc: "Народно-освободительная армия сконцентрировала значительные силы сухопутных, военно-морских и военно-воздушных войск вдоль побережья провинции Фуцзянь в рамках подготовки к возможной чрезвычайной ситуации в Тайваньском проливе."
 china_sar.027.t: "Тайваньский вопрос: первые ходы"
 china_sar.027.d: "Госсовет санкционировал долгосрочную кампанию по подрыву американской поддержки Тайваня. В нашем распоряжении экономические рычаги, дипломатическая изоляция и военные сигналы. Вопрос в том, насколько сильно и быстро давить."
 china_sar.027.a: "Оказать максимальное экономическое давление. Мы сделаем цену поддержки Тайваня невыносимой."
 china_sar.027.b: "Начать с взвешенных дипломатических шагов. Терпение даёт лучшие результаты, чем конфронтация."
 china_sar.028.t: "Вашингтон взвешивает варианты"
 china_sar.028.d: "Кампания давления Пекина пришлась на неудобный для Вашингтона момент. В администрации соперничают фракции: ястребы требуют твёрдо подтвердить обязательства перед Тайванем, а прагматики опасаются экономических последствий противостояния с Китаем."
 china_sar.028.a: "Подтвердить нашу приверженность Тайваню. Давление Китая лишь укрепляет нашу решимость."
 china_sar.028.b: "Признать озабоченность Китая. Мы можем найти формулу, снижающую напряжённость, не бросая Тайвань."
 china_sar.029.t: "Эскалация: Китай повышает ставки"
 china_sar.029.d: "Отказ Вашингтона был плохо воспринят в Чжуннаньхае. На руководство давят, требуя показать, что неповиновение имеет цену. На столе два варианта: сформировать дипломатическую коалицию против американской политики по Тайваню или продемонстрировать военную решимость учениями в проливе."
 china_sar.029.a: "Сформировать международную коалицию. Дипломатическая изоляция устойчивее конфронтации."
 china_sar.029.b: "Провести учения в Тайваньском проливе. Вашингтон должен понять военное измерение нашей решимости."
 china_sar.030.t: "Вашингтон предлагает частичную уступку"
 china_sar.030.d: "После внутренних споров администрация дала понять, что готова сократить, но не прекратить продажи оружия Тайваню. Предложение подаётся как жест в пользу стабильности. Пекин должен решить, принять ли частичный выигрыш или добиваться полного отказа от поддержки."
 china_sar.030.a: "Принять уступку. Частичный выигрыш — всё равно выигрыш."
 china_sar.030.b: "Отвергнуть предложение. Приемлем только полный отказ от поддержки."
 china_sar.031.t: "Америка на распутье"
 china_sar.031.d: "Долгая кампания давления Китая вынудила Вашингтон принять окончательное решение. Разведсообщество предупреждает, что дальнейшие уступки рискуют придать Пекину смелости во всём Индо-Тихоокеанском регионе. Но экономическая цена конфронтации тоже реальна. Администрация должна сделать выбор."
 china_sar.031.a: "Отказаться от официальной поддержки Тайваня. Отношения с Пекином слишком важны, чтобы ими жертвовать."
 china_sar.031.b: "Полностью подтвердить обязательства перед Тайванем. Мы не позволим запугать нас и бросить союзника."
 china_sar.032.t: "Вашингтон отступает от Тайваня"
 china_sar.032.d: "Тихо, но судьбоносно США дали понять, что больше не будут активно поддерживать отдельный статус Тайваня ни в военном, ни в дипломатическом плане. Заявление облечено в бюрократические формулировки, но его стратегический смысл очевиден: Тайвань остался один."
 china_sar.032.a: "Историческое достижение. Путь к воссоединению открыт."
 china_sar.033.t: "Вашингтон подтверждает обязательства"
 china_sar.033.d: "США отвергли кампанию давления Китая и публично подтвердили приверженность безопасности Тайваня. Администрация объявила о новом пакете вооружений для Тайбэя и созвала экстренные консультации с Японией и Австралией. Кампания Пекина провалилась и лишь укрепила противодействие в Вашингтоне."
 china_sar.033.a: "Неудача, но не поражение. Мы пересмотрим подход."
 china_sar.001.t: "Предложение: Соглашение о торговле услугами между берегами пролива"
 china_sar.001.d: "Пекин выдвинул Соглашение о торговле услугами между берегами пролива, открывающее крупные сектора услуг обеих сторон для более свободной торговли и инвестиций. Предложение даст материковым компаниям доступ к банковскому сектору, здравоохранению и розничной торговле Тайваня. Сторонники считают, что оно углубит экономическую интеграцию; критики предупреждают, что оно даст Пекину структурные рычаги влияния на экономику Тайваня."
 china_sar.001.a: "Подписать соглашение. Экономическая интеграция отвечает нашим долгосрочным интересам."
 china_sar.001.b: "Отклонить соглашение. Уступки слишком глубоки, а надзор слишком слаб."
 china_sar.002.t: "Деловые сети через пролив"
 china_sar.002.d: "Пропекинские деловые сети проникли в финансовый и медийный секторы Тайваня при поддержке материкового капитала и с помощью ряда непрозрачных инвестиционных соглашений. Правительство должно решить, как ответить на растущее влияние, стирающее грань между бизнесом и политикой."
 china_sar.002.a: "Приветствовать обмены через пролив. Экономические связи — основа стабильности."
 china_sar.002.b: "Следить за этими сетями, но не ограничивать их. Чрезмерная реакция навредит законной торговле."
 china_sar.002.c: "Ограничить связанные с материком инвестиции в чувствительных секторах."
 china_sar.003.t: "Вопрос «Консенсуса 92-го года»"
 china_sar.003.d: "Материковый Китай официально предложил возродить «Консенсус 1992 года» как дипломатическую основу переговоров через пролив. Формула намеренно двусмысленна: Пекин толкует её как обязательство стремиться к воссоединению в рамках одного Китая, тогда как Гоминьдан традиционно принимал её по формуле «один Китай — разные толкования». ДПП давно отвергает её как политическую ловушку. Тайвань должен ответить."
 china_sar.003.a: "Принять формулу консенсуса. «Один Китай — разные толкования» сохраняет нашу позицию и открывает путь к диалогу."
 china_sar.003.b: "Признать дух диалога, не одобряя формулу напрямую. Мы стремимся к миру, а не к политическим обязательствам."
 china_sar.003.c: "Отвергнуть консенсус. Любая формула, подразумевающая принятие «одного Китая», подрывает наш суверенный статус."
 china_sar.004.t: "Сторонники независимости побеждают на Тайване"
 china_sar.004.d: "Сторонники независимости получили большинство на выборах на Тайване. Новое правительство дало понять, что не примет «Консенсус 92-го года» и намерено проводить более напористый курс в вопросе международного статуса Тайваня. Отношения между берегами пролива вступают в период охлаждения."
 china_sar.004.a: "Это неудача. Мы пересмотрим наш подход к Тайбэю."
 china_sar.005.t: "Раскрыты операции Пекина по вмешательству"
 china_sar.005.d: "Бюро национальной безопасности Тайваня обнаружило доказательства связанных с КНР операций по влиянию на внутреннюю политику, включая инвестиции в СМИ через подставных лиц, финансирование политиков — сторонников сближения и выращивание деловых сетей для продвижения политических месседжей. Эти данные утекли в прессу и вызвали общественное возмущение."
 china_sar.005.a: "Выслать причастных атташе по культуре и заявить официальный протест. Мы не потерпим иностранного манипулирования нашей демократией."
 china_sar.006.t: "Тайвань высылает китайских чиновников"
 china_sar.006.d: "Тайбэй официально выслал нескольких атташе по культуре и торговле после разоблачения операций Пекина по политическому влиянию. Этот шаг вызвал одобрение демократических союзников Тайваня и резкую публичную отповедь со стороны МИД в Пекине."
 china_sar.006.a: "Смириться с дипломатическими издержками. Разоблачение операции отбросило нашу работу назад, но общая стратегия остаётся верной."
 china_sar.035.t: "Культурная экспансия Пекина"
 china_sar.035.d: "Китай и Внутренняя Монголия развернули в Монголии скоординированную кампанию культурного влияния, продвигая общее монгольское наследие и подталкивая общественное мнение к более тесной интеграции. Пекин называет это культурным обменом, но политический подтекст очевиден."
 china_sar.035.a: "Нам остаётся лишь признать это."
 china_sar.036.t: "Союз с Внутренней Монголией?"
 china_sar.036.d: "В Улан-Батор прибыла официальная делегация из Пекина и Хух-Хото с официальным предложением: Монголии предлагается войти в состав Китайской Народной Республики в качестве специального административного района по принципу «одна страна — две системы». Предложение сопровождается экономическими гарантиями и обещаниями культурной автономии, но за ним стоит и вся мощь китайского влияния."
 china_sar.036.a: "Мы принимаем предложение."
 china_sar.036.b: "Монголия останется независимой."
 china_sar.037.t: "Монголия отказывается от воссоединения"
 china_sar.037.d: "Улан-Батор официально отверг предложение о воссоединении. Монгольское правительство ссылается на национальный суверенитет и общественное несогласие, хотя дипломатические каналы остаются открытыми. Пекин принимает решение к сведению, но даёт понять, что предложение остаётся в силе."
 china_sar.037.a: "Мы попробуем ещё раз."
 china_sar.007.t: "Опасное сближение над проливом"
 china_sar.007.d: "Истребитель НОАК провёл агрессивный перехват иностранного военного самолёта у срединной линии Тайваньского пролива. Кадры с камеры в кабине показывают, как китайский пилот проходит в считаных метрах от самолёта. Международные СМИ требуют ответа."
 china_sar.007.a: "Отрицать причастность и снизить напряжённость."
 china_sar.007.b: "Хранить официальное молчание."
 china_sar.007.c: "Публично защищать действия как законные."
 china_sar.008.t: "Столкновение кораблей в Тайваньском проливе"
 china_sar.008.d: "Эсминец ВМС НОАК и иностранный военный корабль столкнулись при опасном сближении в Тайваньском проливе. Оба корабля получили повреждения. Инцидент вызвал международный резонанс и поставил Пекин в трудное положение."
 china_sar.008.a: "Обвинить другую сторону в безрассудном маневрировании."
 china_sar.008.b: "Не делать заявлений и дать истории забыться."
 china_sar.008.c: "Принести извинения в частном порядке по неофициальным каналам."
 china_sar.009.t: "Ракетное испытание: регион молчит"
 china_sar.009.d: "Испытание баллистической ракеты Ракетными войсками НОАК над Тайваньским проливом вызвало сдержанную международную реакцию. Вашингтон выступил с формальным заявлением об обеспокоенности, но не предпринял конкретных действий. Отсутствие весомой американской реакции посылает мощный сигнал всему региону."
 china_sar.009.a: "Наша решимость говорит громче их молчания."
 china_sar.010.t: "Ракетное испытание: отпор США"
 china_sar.010.d: "Ракетное испытание Ракетных войск НОАК у Тайваня обернулось громким провалом. Вашингтон направил в пролив авианосную ударную группу и объявил об экстренном пакете вооружений для Тайбэя. Международное мнение сплотилось против Пекина."
 china_sar.010.a: "Эта неудача нас не остановит."
 china_sar.011.t: "Тайвань в одиночестве"
 china_sar.011.d: "Число официальных дипломатических союзников Тайваня сократилось до горстки малых государств. Без весомого международного признания претензии Тайбэя на суверенитет стоят на всё более шаткой почве. Изоляция носит как символический, так и практический характер."
 china_sar.011.a: "Кольцо вокруг мятежной провинции сжимается."
 china_sar.012.t: "Голосование в Конгрессе по оружию"
 china_sar.012.d: "Конгресс США обсуждает крупный пакет поставок оружия Тайваню. У нашей лоббистской сети в Вашингтоне есть возможность повлиять на голосование, но вмешательство рискованно, если наше участие будет раскрыто."
 china_sar.012.a: "Задействовать лоббистскую сеть, чтобы заблокировать продажу."
 china_sar.012.b: "Пригрозить экономическими мерами по дипломатическим каналам."
 china_sar.012.c: "Позволить процессу идти своим чередом."
 china_sar.013.t: "Деловой совет выступает за разрядку"
 china_sar.013.d: "Американо-китайский деловой совет опубликовал доклад, призывающий Вашингтон ставить коммерческую стабильность выше обязательств по безопасности Тайваня. Доклад, сформированный нашими усилиями по экономическому взаимодействию, набирает вес в политических кругах."
 china_sar.013.a: "Отмечено."
 china_sar.014.t: "Раскрыто вмешательство в выборы"
 china_sar.014.d: "Американские спецслужбы публично приписали операцию политического влияния китайским государственным структурам. Скандал вызвал двухпартийное возмущение в Конгрессе и волну карательных мер. Наши стратегические позиции в отношениях с Вашингтоном получили серьёзный удар."
 china_sar.014.a: "Дорогостоящий просчёт."
 china_sar.015.t: "Экстренное совещание по безопасности"
 china_sar.015.d: "Учения Китая по имитации блокады в Тайваньском проливе вызвали экстренное заседание Совета национальной безопасности. Военачальники и члены кабинета обсуждают, как ответить на нарастающее давление Пекина."
 china_sar.015.a: "Повысить боеготовность на побережье."
 china_sar.015.b: "Обратиться за поддержкой к международному сообществу."
 china_sar.016.t: "Чрезвычайное положение"
 china_sar.016.d: "Частичная блокада длится уже два месяца, нарушая торговлю и вызывая нехватку топлива и критически важных материалов. На правительство растёт давление с требованием официально объявить чрезвычайное положение и привести вооружённые силы в полную боевую готовность."
 china_sar.016.a: "Объявить чрезвычайное положение."
 china_sar.016.b: "Добиваться дипломатического урегулирования с Пекином."
 china_sar.017.t: "Вопрос капитуляции"
 china_sar.017.d: "Полная морская блокада парализовала нашу экономику и перерезала линии снабжения. Поскольку поддержка США фактически прекращена, в правительстве всё чаще звучат тихие голоса о возможности начать переговоры с Пекином на его условиях."
 china_sar.017.a: "Мы никогда не сдадимся. Сражаться дальше."
 china_sar.017.b: "Начать переговоры с Пекином."
 china_sar.018.t: "Тайвань начинает переговоры"
 china_sar.018.d: "Тайбэй направил в Пекин делегацию с полномочиями обсуждать условия воссоединения. Блокада, экономический крах и прекращение американской поддержки не оставили острову реальной альтернативы. Историческая глава подходит к концу."
 china_sar.018.a: "Принять воссоединение с Родиной."
 china_sar.019.t: "Кризис в Тайваньском проливе"
 china_sar.019.d: "Напряжённость в Тайваньском проливе достигла критического порога. Вооружённые силы обеих сторон находятся в максимальной готовности, и один просчёт может спровоцировать открытый конфликт. Постоянный комитет Политбюро собирается на экстренное заседание, чтобы решить, что делать дальше."
 china_sar.019.a: "Отступить от края пропасти. Снизить напряжённость."
 china_sar.019.b: "Идти до конца. Выдвинуть официальную цель войны."
 china_sar.020.t: "Ультиматум Пекина"
 china_sar.020.d: "Пекин предъявил официальный ультиматум с требованием согласиться на воссоединение с Китайской Народной Республикой. В случае отказа последуют военные действия. Правительство должно решить, сопротивляться или вести переговоры."
 china_sar.020.a: "Отвергнуть ультиматум. Готовиться к войне."
 china_sar.020.b: "Принять условия. Борьба окончена."
 china_sar.021.t: "Тайвань отвергает воссоединение"
 china_sar.021.d: "Тайбэй официально отверг наш ультиматум. Правительство Тайваня заявило о намерении сопротивляться любой попытке насильственного воссоединения и мобилизует вооружённые силы. Путь к мирному урегулированию закрыт."
 china_sar.021.a: "Да будет так. Готовиться к войне."
 china_sar.022.t: "Тайвань принимает воссоединение"
 china_sar.022.d: "Тайбэй принял условия воссоединения. Китайская Республика будет упразднена, а её территория войдёт в состав Китайской Народной Республики. Десятилетия разделения берегов пролива подходят к концу."
 china_sar.022.a: "Родина вновь едина."
 china_sar.023.t: "Дипломатическое давление Китая"
 china_sar.023.d: "Пекин официально потребовал, чтобы мы отозвали признание Тайваня. Китай предлагает экономические стимулы за согласие и угрожает санкциями за отказ. Дальнейшее признание Тайбэя стало для нас дорогостоящей дипломатической позицией."
 china_sar.023.a: "Подчиниться. Отозвать признание Тайваня."
 china_sar.023.b: "Отказаться. Мы верны своим обязательствам."
 china_sar.024.t: "Десантные учения в проливе"
 china_sar.024.d: "Морская пехота НОАК провела крупнейшие в своей истории десантные учения в Тайваньском проливе, отработав штурм укреплённого побережья. Учения, транслировавшиеся государственными СМИ, — недвусмысленный сигнал и Тайбэю, и Вашингтону."
 china_sar.024.a: "Мир это заметил."
 china_sar.025.t: "Противостояние из-за свободы судоходства"
 china_sar.025.d: "ВМС США провели военный корабль через объявленную нами зону морской безопасности у Тайваня. Корабль открыто заявляет о своём присутствии, провоцируя ВМС НОАК на ответ. Наши силы отслеживают американский корабль."
 china_sar.025.a: "Пропустить. Избежать прямой конфронтации."
 china_sar.025.b: "Сопровождать американский корабль и бросить ему вызов."
 china_sar.026.t: "Смена руководства США"
 china_sar.026.d: "Смена президента США изменила политический расклад для нашей тайваньской стратегии. Позиция новой администрации по отношениям через пролив повлияет на уровень американской поддержки Тайбэя."
 china_sar.026.a: "Скорректировать нашу стратегию."
 USA_taiwan_defense_category: "Оборона Тайваня"
 CHI_TAI_amphibious_exercise: "Десантные учения в проливе"
 CHI_TAI_amphibious_exercise_desc: "Провести крупномасштабные учения по высадке морского десанта в Тайваньском проливе с целью демонстрации военного потенциала и оказания давления на Тайбэй."
 CHI_TAI_adiz_incursion: "Вторжение в зону идентификации ПВО"
 CHI_TAI_adiz_incursion_desc: "Направить истребители ВВС НОАК в зону идентификации воздушной обороны Тайваня, чтобы проверить время реагирования и подорвать уверенность Тайбэя."
 CHI_TAI_rocket_test: "Испытание баллистической ракеты"
 CHI_TAI_rocket_test_desc: "Провести испытание баллистической ракеты над Тайваньским проливом. Реакция будет зависеть от текущего уровня приверженности США делу защиты Тайваня."
 CHI_TAI_grey_zone_ops: "Операции в серой зоне"
 CHI_TAI_grey_zone_ops_desc: "Осуществлять провокации низкой интенсивности, включая вторжения судов береговой охраны, развёртывание рыболовецких флотилий и проведение испытаний средств радиоэлектронной борьбы вблизи вод Тайваня."
 CHI_TAI_blockade_simulation: "Учения по имитации блокады"
 CHI_TAI_blockade_simulation_desc: "Провести крупномасштабные военно-морские учения, имитирующие полную блокаду Тайваня, с целью проверки системы материально-технического обеспечения и демонстрации способности перерезать линии снабжения острова."
 CHI_TAI_cyberattack: "Кибератака на Тайвань"
 CHI_TAI_cyberattack_desc: "Провести скоординированную кибероперацию, направленную против энергосистемы, финансовых систем и военных каналов связи Тайваня."
 CHI_TAI_shadow_carrier: "Слежка за авианосной группой США"
 CHI_TAI_shadow_carrier_desc: "Развернуть подводные лодки и надводные боевые корабли для слежения за американской авианосной ударной группой, действующей в районе Тайваньского пролива."
 CHI_TAI_intercept_aircraft: "Перехватывать американских разведчиков"
 CHI_TAI_intercept_aircraft_desc: "Направить истребители на перехват и обеспечить плотное сопровождение американских разведывательных самолётов, действующих в районе пролива."
 CHI_TAI_un_protest: "Протест в ООН против продажи оружия"
 CHI_TAI_un_protest_desc: "Подать официальный протест в Организацию Объединённых Наций против продажи американского оружия Тайваню, чтобы оказать международное давление на Вашингтон."
 CHI_TAI_maritime_zone: "Объявить зону морской безопасности"
 CHI_TAI_maritime_zone_desc: "Объявить зону обеспечения морской безопасности вокруг ключевых подходов к Тайваню, создав тем самым правовой повод для перехвата и досмотра торговых судов."
 CHI_TAI_partial_blockade: "Частичная морская блокада"
 CHI_TAI_partial_blockade_desc: "Превратить зону морской безопасности в частичную морскую блокаду, ограничив поставки топлива и сырья на Тайвань."
 CHI_TAI_full_blockade: "Полная морская блокада"
 CHI_TAI_full_blockade_desc: "Ввести полную морскую блокаду вокруг Тайваня, перекрыв все морские торговые пути и линии снабжения, ведущие на остров."
 CHI_TAI_influence_us_election: "Влиять на выборы в США"
 CHI_TAI_influence_us_election_desc: "Проводить в США тайные операции по оказанию политического влияния с целью поддержки кандидатов, разделяющих позицию Пекина по вопросу Тайваня."
 CHI_TAI_support_houthis: "Поддержать операции хуситов"
 CHI_TAI_support_houthis_desc: "Оказывать скрытую материальную поддержку силам хуситов в Йемене, создавая кризис в сфере безопасности, который отвлекает американские военные ресурсы от Тихого океана."
 CHI_TAI_arm_iran: "Тайные поставки оружия Ирану"
 CHI_TAI_arm_iran_desc: "Поставлять передовые военные технологии в Иран через посредников, усиливая давление на американские войска на Ближнем Востоке."
 CHI_TAI_scs_provocations: "Провокации в Южно-Китайском море"
 CHI_TAI_scs_provocations_desc: "Утвердить суверенитет Китая над спорными территориями в Южно-Китайском море посредством милитаризации островов, преследований со стороны береговой охраны в отношении соперничающих претендентов и расширения зон противовоздушной обороны. Эти действия вынуждают Соединённые Штаты перенаправить военно-морские силы для укрепления доверия со стороны партнёров по АСЕАН."
 CHI_TAI_nk_provocations: "Поощрять провокации Северной Кореи"
 CHI_TAI_nk_provocations_desc: "Дать Пхеньяну понять, что к ракетным испытаниям и военным провокациям на Корейском полуострове отнесутся терпимо, и тем самым вынудить США передислоцировать войска с Тайваньского театра военных действий."
 CHI_TAI_middleeast_diversion: "Стратегическое участие на Ближнем Востоке"
 CHI_TAI_middleeast_diversion_desc: "Углубить военное и экономическое сотрудничество со странами Ближнего Востока с целью усилить зависимость региона от Пекина и одновременно отвлечь внимание США от Индо-Тихоокеанского региона."
 CHI_TAI_support_russia: "Поддержать операции России"
 CHI_TAI_support_russia_desc: "Оказывать экономическую и материально-техническую поддержку военным операциям России, тем самым затягивая конфликт, который отвлекает внимание и истощает ресурсы США."
 CHI_TAI_strait_naval_exercise: "Военно-морские учения в Тайваньском проливе"
 CHI_TAI_strait_naval_exercise_desc: "Провести крупномасштабные военно-морские учения в Тайваньском проливе, отрабатывая операции морского десанта и ведение боевых действий по ограничению доступа. Эти учения повысят боеготовность военно-морских сил, но вызовут осуждение со стороны международного сообщества."
 CHI_TAI_fund_us_opposition: "Финансировать прокитайское лобби в США"
 CHI_TAI_fund_us_opposition_desc: "Направлять ресурсы через посредников на поддержку американских политических групп, аналитических центров и СМИ, симпатизирующих позиции Пекина по вопросу о Тайване. Раскрытие этой информации вызовет резкую негативную реакцию."
 CHI_TAI_exploit_us_commitments: "Воспользоваться перенапряжением сил США"
 CHI_TAI_exploit_us_commitments_desc: "Пока Соединённые Штаты ведут военные операции за рубежом, усилить дипломатическое и военное давление на Тайвань. Американские войска растянуты по всем фронтам и не в состоянии обеспечить надёжное усиление сил в Тихоокеанском регионе."
 USA_TAI_send_carrier: "Направить авианосец в Тайваньский пролив"
 USA_TAI_send_carrier_desc: "Отдать приказ авианосной ударной группе пройти через Тайваньский пролив в качестве демонстрации силы, показав тем самым приверженность США обеспечению стабильности в регионе."
 USA_TAI_recon_flight: "Разведывательный полёт над проливом"
 USA_TAI_recon_flight_desc: "Направить самолёты наблюдения для мониторинга деятельности НОАК в Тайваньском проливе в связи с вторжениями Китая в зону идентификации ПВО."
 USA_TAI_arm_taiwan: "Экстренный пакет вооружений для Тайваня"
 USA_TAI_arm_taiwan_desc: "Утвердить пакет мер по экстренной продаже оружия для вооружённых сил Тайваня в ответ на активизацию подготовки Китая к блокаде."
 USA_TAI_fon_operation: "Операция по обеспечению свободы судоходства"
 USA_TAI_fon_operation_desc: "Направить военный корабль через объявленную Китаем зону морской безопасности, чтобы отстоять свободу судоходства и оспорить претензии Пекина."
 USA_TAI_rimpac_exercise: "Военно-морские учения RIMPAC"
 USA_TAI_rimpac_exercise_desc: "Пригласить Тайвань принять участие в ежегодных военно-морских учениях RIMPAC (Rim of the Pacific) — крупнейших в мире международных учениях по ведению морской войны, что станет свидетельством приверженности США своим региональным партнёрам."
 CHI_SAR_decisions_category: "Стратегия единого Китая"
 CHI_SAR_decisions_category_desc: "\n£GFX_CHI_commission_2\n\n\n\n§YСтратегия единого Китая§! представляет собой политику Пекина по объединению всех территорий, на которые Китай заявляет свои права, в рамках единого китайского государства. Посредством сочетания политического давления, экономического развития и административного контроля регионы постепенно приводятся в соответствие с центральным правительством.\n\nЭтот процесс может развиваться по разным направлениям. Усиление §Yкитаизации§! укрепляет прямой контроль и интеграцию, тогда как более автономные модели управления делают приоритетом местную стабильность и экономический потенциал за счёт снижения влияния центральной власти.\n\nБаланс между этими подходами определит долгосрочное единство государства, в то время как вопрос §YТайваня§! остаётся зависимым от международного признания, иностранной поддержки и напряжённости в отношениях между берегами пролива.\n\n§YСпециальные административные районы Китая§!\n$HKG_sinicization$\n$MAC_sinicization$\n$TIB_sinicization$\n$ETK_sinicization$\n$OMG_sinicization$\n\n$CHI_TAI_trust_display$\n$CHI_taiwan_us_support_display$\n$CHI_taiwan_strait_tension_display$\n$CHI_taiwan_recognition_count_display$\n$uighur_threat_display$"
 CHI_pressure_derecognize_TAI: "Вынудить [From.GetName] отозвать признание Тайваня"
 CHI_pressure_derecognize_TAI_desc: "Пекин ведет последовательную дипломатическую кампанию, направленную на сокращение числа стран, признающих Тайвань. [From.GetName] в настоящее время поддерживает официальные отношения с Тайбэем. Сочетание экономических стимулов и угроз введения санкций может оказаться достаточным для того, чтобы побудить эту страну изменить свою позицию."
 CHI_establish_education_centres: "Создать центры профессионального образования в Синьцзяне"
 CHI_establish_education_centres_desc: ""
 CHI_MON_reunification_retry: "Повторить предложение о воссоединении"
 CHI_MON_reunification_retry_desc: "Монголия отклонила наше предыдущее предложение. Мы сможем вновь обратиться к Улан-Батору, как только ситуация на дипломатическом фронте стабилизируется."
 CHI_han_settlement_small: "Малая программа ханьского переселения"
 CHI_han_settlement_small_desc: "В рамках скромной государственной программы семьи народности хань переселяются из густонаселённых внутренних провинций в новые поселения во Внутренней Монголии при поддержке мер по стимулированию трудоустройства и программ предоставления земельных участков."
 CHI_han_settlement_medium: "Средняя программа ханьского переселения"
 CHI_han_settlement_medium_desc: "В рамках масштабной организованной программы переселения десятки тысяч рабочих из народности хань и их семьи переселяются во Внутреннюю Монголию. Для размещения прибывающего населения выделяются новые промышленные зоны и сельскохозяйственные участки."
 CHI_han_settlement_large: "Массовая программа ханьского переселения"
 CHI_han_settlement_large_desc: "В рамках широкомасштабной кампании по изменению демографического состава населения сотни тысяч переселенцев из народности хань переселяются во Внутреннюю Монголию одной скоординированной волной. Долгосрочное влияние на этнический состав региона оказывается существенным, хотя в ближайшей перспективе резко усиливается сопротивление со стороны местного населения."
 CHI_TAI_media_infiltration: "Проникновение в медиасети"
 CHI_TAI_media_infiltration_desc: "Финансировать и расширять сети владения и редакционного влияния пропекинских СМИ на Тайване. Создавать более благоприятную информационную среду для взаимодействия между двумя берегами Тайваньского пролива."
 CHI_TAI_business_council_funding: "Финансирование деловых советов двух берегов"
 CHI_TAI_business_council_funding_desc: "Обеспечить финансовую поддержку бизнес-ассоциациям, связанным с Гоминьданом, и торговым палатам, занимающимся вопросами отношений между двумя берегами пролива. Укрепить позиции сторонников сближения в рядах экономической элиты Тайваня."
 CHI_TAI_cultural_exchange_program: "Программа культурного обмена через пролив"
 CHI_TAI_cultural_exchange_program_desc: "Поддерживать академические обмены, культурные фестивали и программы диалога между молодёжью по обе стороны пролива. Укреплять связи между людьми, которые смягчают политическое сопротивление укреплению отношений."
 CHI_TAI_cross_strait_infrastructure_investment: "Инфраструктурные инвестиции через пролив"
 CHI_TAI_cross_strait_infrastructure_investment_desc: "Направить капитал материкового Китая в инфраструктурные проекты на Тайване, позиционируя китайские инвестиции как источник экономических возможностей и углубляя материальную взаимозависимость между экономиками двух стран."
 CHI_45g_national_deployment_idea: "Национальная инициатива по развёртыванию 5G"
 CHI_45g_national_deployment_idea_desc: "Ускоренное развертывание инфраструктуры сетей 5G по всей стране при государственной координации капиталовложений в базовые станции, оборудование опорной сети и распределение радиочастотного спектра. В рамках этой инициативы приоритетное внимание уделяется обеспечению покрытия в стратегических отраслях и на объектах критически важной инфраструктуры."
 CHI_avic_innovation_idea: "Разработка самолётов AVIC"
 CHI_avic_innovation_idea_desc: "Aviation Industry Corporation of China (AVIC) развивает собственные возможности в области проектирования и производства самолётов, продвигая программы по созданию истребителей и транспортных самолётов, не зависящие от иностранных технологий и лицензий."
 CHI_big_fund_phase_1_idea: "Национальный фонд полупроводниковой промышленности"
 CHI_big_fund_phase_1_idea_desc: "В рамках стратегической программы Китая по обеспечению самодостаточности в сфере полупроводников «Большой фонд» привлекает государственный капитал для развития собственных производственных мощностей, проектных ресурсов и производства оборудования. Данная инициатива направлена на снижение зависимости от зарубежных фабрик по производству микросхем и инструментов EDA."
 CHI_caic_innovation_idea: "Разработка ударных вертолётов CAIC"
 CHI_caic_innovation_idea_desc: "Китайский аэрокосмический конгломерат способствует развитию технологий боевых вертолетов за счет разработки и производства собственных вертолетных платформ, предназначенных для быстрого развертывания и продолжительных операций."
 CHI_casc_innovation_idea: "Космические и спутниковые программы CASC"
 CHI_casc_innovation_idea_desc: "China Aerospace Science and Technology Corporation расширяет возможности в области космических запусков, спутниковой связи и наблюдения за Землей, укрепляя роль Китая как крупной космической державы, не зависящей от иностранных ограничений на доступ."
 CHI_casic_innovation_idea: "Разработка ракет и средств противодействия CASIC"
 CHI_casic_innovation_idea_desc: "China Aerospace Science and Industry Corporation занимается совершенствованием крылатых ракет, баллистических ракет и систем противовоздушной обороны посредством непрерывных научно-исследовательских и опытно-конструкторских работ в области двигательных установок, систем наведения и радиоэлектронной борьбы."
 CHI_cetc_innovation_idea: "Разработки CETC в области вычислений и ИИ"
 CHI_cetc_innovation_idea_desc: "China Electronics Technology Group инвестирует в высокопроизводительные вычисления, проектирование полупроводников и платформы искусственного интеллекта с целью снижения технологической зависимости и ускорения развития отечественных инноваций в области ключевых базовых технологий."
 CHI_crrc_innovation_idea: "Промышленное производство CRRC"
 CHI_crrc_innovation_idea_desc: "Китайский производитель оборудования для железнодорожного транспорта и общественного транспорта расширяет свою деятельность в другие отрасли промышленности, опираясь на многолетний опыт в области организации цепочек поставок в металлургии, точном машиностроении и системной интеграции."
 CHI_csgc_innovation_idea: "Разработка бронетехники CSGC"
 CHI_csgc_innovation_idea_desc: "Китайский государственный производитель бронетехники разрабатывает платформы нового поколения в области танков, боевых машин пехоты и вспомогательной техники, объединяющие в себе передовые технологии в области бронирования, огневой мощи и мобильности."
 CHI_csic_innovation_idea: "Разработка подводных лодок CSIC"
 CHI_csic_innovation_idea_desc: "China State Shipbuilding Industrial Corporation развивает проектирование и производство подводных лодок, уделяя особое внимание материалам корпуса, снижению шума и передовым системам датчиков, обеспечивающим длительное пребывание под водой."
 CHI_cssc_innovation_idea: "Разработка надводных кораблей CSSC"
 CHI_cssc_innovation_idea_desc: "Ведущий судостроитель Китая специализируется на разработке передовых проектов эсминцев, фрегатов и корветов, оснащенных интегрированными боевыми системами, что позволяет расширить возможности Китая по действиям в открытом море на стратегических морских путях."
 CHI_failed_five_year_plan: "Проваленный пятилетний план"
 CHI_failed_five_year_plan_desc: "Неутешительные результаты последнего пятилетнего планового цикла вынудили пересмотреть приоритеты и распределение ресурсов. Пострадало доверие общественности к долгосрочным целям развития, что требует немедленного корректирования политики."
 CHI_haig_innovation_idea: "Разработки Harbin Aircraft Industry Group"
 CHI_haig_innovation_idea_desc: "Авиационная отрасль Харбина расширяет возможности в области винтокрылой техники, разрабатывая транспортные вертолёты и ударные платформы, что снижает зависимость от иностранных разработок и лицензий."
 CHI_inner_mongolia_innovation_idea: "Развитие бронетехники Внутренней Монголии"
 CHI_inner_mongolia_innovation_idea_desc: "Интегрированная база производства бронетехники Внутренней Монголии развивает разработку основных боевых танков и бронированных машин, опираясь на многовековой опыт металлургии и современные производственные технологии."
 CHI_jap_strategic_isolation: "Стратегическая изоляция Японии"
 CHI_jap_strategic_isolation_desc: "Наше экономическое влияние и дипломатическое положение в регионе все больше сводят к минимуму стратегическое влияние Японии в Восточной Азии. Токио сталкивается с инфляцией потребительских товаров, сокращением экспортных рынков и психологическим бременем утраты стратегической значимости."
 CHI_kor_g2_economic_platform: "Экономическая схема G2 Китай — Корея"
 CHI_kor_g2_economic_platform_desc: "Создание механизмов двусторонней экономической координации между Китаем и Кореей, охватывающих торговую политику, инвестиционные потоки и технологическое сотрудничество. Данная договоренность определяет обе страны в качестве соуправляющих факторов процветания Восточной Азии."
 CHI_kor_trilateral_opening: "Трёхстороннее корейское открытие"
 CHI_kor_trilateral_opening_desc: "Дипломатическое сближение с Северной Кореей посредством консультаций на высоком уровне и ограниченного экономического взаимодействия, демонстрирующее готовность Китая выступать посредником в диалоге и оказывать материальную поддержку в проведении контролируемых реформ."
 CHI_made_in_china_2025_idea: "Сделано в Китае 2025"
 CHI_made_in_china_2025_idea_desc: "Десятилетняя промышленная политика, направленная на развитие высокотехнологичного производства в сферах полупроводников, передовых композитных материалов, робототехники и железнодорожного транспорта. Программа призвана превратить Китай из «мировой фабрики» в «мирового новатора»."
 CHI_nko_final_transition: "Окончательный переход Северной Кореи"
 CHI_nko_final_transition_desc: "Заключительный этап трансформации Северной Кореи знаменует собой кульминацию китайского влияния и сближения с Китаем. Пхеньян становится функционально интегрированным в китайскую сферу влияния, сохраняя лишь минимальную номинальную независимость."
 CHI_nko_managed_reform_pilot: "Пилотная управляемая реформа в Северной Корее"
 CHI_nko_managed_reform_pilot_desc: "Китай содействует ограниченной экономической либерализации в Северной Корее посредством создания особых экономических зон и внедрения контролируемых рыночных механизмов. Этот пилотный проект призван проверить, сможет ли Пхеньян провести реформы, не нарушив при этом стабильность режима."
 CHI_norinco_innovation_idea: "Разработка вооружений NORINCO"
 CHI_norinco_innovation_idea_desc: "Китайская северная промышленная корпорация ускоряет модернизацию стрелкового вооружения пехоты, артиллерийских систем и лёгких броневых платформ. Экспортный портфель NORINCO расширяется за счёт поставок вооружений армиям, имеющим ограниченный доступ к западным поставщикам."
 CHI_phi_abandonment_doctrine: "Доктрина отчуждения Филиппин"
 CHI_phi_abandonment_doctrine_desc: "Целенаправленное укрепление экономической зависимости Филиппин и дипломатического отчуждения от их традиционного партнера в сфере безопасности, в результате чего Манила оказывается в изоляции и становится уязвимой перед давлением со стороны Китая."
 CHI_poly_innovation_idea: "Развитие военной промышленности Poly Technologies"
 CHI_poly_innovation_idea_desc: "Разнообразный военно-промышленный портфель Poly Technologies расширяется за счёт выхода в новые оборонные отрасли, используя государственную поддержку и доступ к исследовательским учреждениям всего оборонного комплекса."
 CHI_sac_innovation_idea: "Развитие истребительной авиации SAC"
 CHI_sac_innovation_idea_desc: "Shenyang Aircraft Corporation совершенствует разработку и производство истребителей, создавая отечественные платформы, снижающие зависимость от российских двигателей и технологий радиолокационных станций с активной фазированной антенной решёткой (АФАР)."
 CHI_shadow_banking_cleanup_idea: "Оздоровление теневого банковского сектора"
 CHI_shadow_banking_cleanup_idea_desc: "Усиление государственного контроля над нерегулируемыми трастовыми продуктами, P2P-кредитованием и внебалансовым финансированием устраняет системные риски в финансовой системе. Краткосрочное сокращение объёмов кредитования компенсируется ростом доверия к системе финансового регулирования."
 CHI_south_china_sea_dominance_window: "Окно для господства в Южно-Китайском море"
 CHI_south_china_sea_dominance_window_desc: "Открылось стратегическое окно возможностей для укрепления контроля над Южно-Китайским морем за счёт военно-морского присутствия, расширения гражданского рыболовного флота и строительства военных объектов на намытых островах. Это окно возможностей может закрыться, если региональные державы объединят усилия, чтобы противостоять экспансии Китая."
 CHI_ztz99_rollout_idea: "Развёртывание основных боевых танков Тип 99"
 CHI_ztz99_rollout_idea_desc: "Развёртывается полномасштабное серийное производство и принятие на вооружение основных боевых танков Type 99 в Сухопутных войсках НОАК, обеспечивая значительное превосходство в защите, огневой мощи и мобильности по сравнению с более ранними образцами."
 ETK_security_reinforcement_idea: "Усиление сил безопасности"
 ETK_security_reinforcement_idea_desc: "Расширение сил безопасности и укрепление инфраструктуры с целью защиты от террористических атак, при этом умеренные экономические затраты компенсируются ограничением гражданских свобод и усилением слежки."
 ETK_surveillance_state_idea: "Меры государства слежки"
 ETK_surveillance_state_idea_desc: "Всестороннее расширение систем наблюдения, сетей контрольно-пропускных пунктов и сбора разведывательной информации во всех сферах общества. Повышение экономической эффективности за счёт усиления социального контроля компенсируется снижением инновационной активности и уменьшением вовлечённости граждан."
 ETK_terrorism_aftermath: "Последствия терроризма"
 ETK_terrorism_aftermath_desc: "Сохраняющиеся проблемы в сфере безопасности и социальная травма, вызванная недавними террористическими атаками, по-прежнему сдерживают экономическую деятельность и подрывают доверие населения. Восстановление требует времени и эффективных мер по обеспечению безопасности."
 TAI_civil_defense_readiness: "Готовность гражданской обороны"
 TAI_civil_defense_readiness_desc: "Мобилизация населения для выполнения задач по противовоздушной обороне, включая обучение навыкам укрытия, оказания помощи пострадавшим и ликвидации последствий разрушений. Эффективность защиты от воздушных угроз повышается ценой снижения качества жизни и экономических потрясений."
 CHI_bri_pacific_engagement_tt: "$CHI_bri_pacific_engagement$: $RIGHT|+=1$"
 CHI_Asset_Seizure_tt: "§YИзъятый актив:§! §G+25§! в казну, §G+3§! $CHI_bri_global_presence$\nНепогашенный долг уменьшается на стоимость одного проекта"
 chi_bri.16.a: "Мы справимся с последствиями"
 chi_bri.16.d: "Министерство финансов подтвердило то, что и так было видно по счётам: мы не можем внести платёж за этот месяц по обязательствам в рамках инициативы «Один пояс и один путь». Пекин узнает об этом в ближайшие дни. Пока задолженность не погашена, кредитор вправе действовать, и далеко не все доступные ему варианты мягкие."
 chi_bri.16.t: "Пропущен платёж по кредиту инициативы «Один пояс и один путь»"
 chi_bri.17.a: "Подписать концессию"
 chi_bri.17.b: "Месторождения не продаются"
 chi_bri.17.d: "Прибыла китайская делегация с предложением, которое на деле не является предложением. В обмен на уменьшение нашего просроченного долга по инициативе «Один пояс и один путь» на стоимость одного проекта Пекин хочет получить долгосрочные права на добычу и экспорт наших полезных ископаемых. Часть долга исчезнет из отчётности. Как, во многом, и контроль над землёй у нас под ногами."
 chi_bri.17.t: "Пекин требует права на ресурсы"
 chi_bri.18.a: "Есть и другие инструменты"
 chi_bri.18.d: "[FROM.GetName] наотрез отвергает наши условия ресурсной концессии. Долг остаётся, дефолт остаётся, а наша делегация вернулась в Пекин ни с чем. Теперь вопрос в том, ждать ли дальше или взыскать долг иными способами."
 chi_bri.18.t: "[FROM.GetName] отвергает наши условия"
 chi_bri.19.a: "Взвесить варианты"
 chi_bri.19.d: "[FROM.GetName] пропускает платёж по обязательствам в рамках инициативы «Один пояс и один путь». По меркам инициативы сумма невелика, но важен прецедент: все остальные заёмщики следят за реакцией Пекина. Мы можем реструктурировать долг, потребовать права на ресурсы или изъять то, что профинансировали."
 chi_bri.19.t: "[FROM.GetName] допускает дефолт по долгу инициативы «Один пояс и один путь»"
 chi_bri.23.a: "Главное — строительство"
 chi_bri.23.d: "Наша казна не смогла покрыть нашу долю в проекте §Y[GetBRIProjectName]§!, поэтому Пекин предоставил кредит на недостающую сумму. Строительство продолжается в любом случае. Долг теперь на нашем балансе, на него начисляются проценты, и если мы не сможем его обслуживать, условия дают Китаю значительную свободу действий."
 chi_bri.23.t: "Проект инициативы «Один пояс и один путь» профинансирован в кредит"
 CHI_BRI_automation_disable_tt: "Заявки по ОПОП должны §Yрассматриваться индивидуально§!"
 CHI_BRI_automation_enable_tt: "Заявки по ОПОП §Gпринимаются автоматически§!"
 CHI_bri_buy_back_concession: "Выкупить концессию"
 CHI_bri_buy_back_concession_desc: "Выкупить права на добычу и экспорт, переданные китайским компаниям. Это дорого, и Пекин не примет этот убыток с достоинством, но зато месторождения вернутся под контроль государства."
 CHI_bri_can_host_energy: "Мы контролируем регион с промышленным комплексом, которому нужна энергия"
 CHI_bri_can_host_mine: "Мы контролируем регион с ценными месторождениями полезных ископаемых"
 CHI_bri_can_host_pipeline: "Мы контролируем регион с ценными месторождениями нефти, стали или драгоценных металлов"
 CHI_bri_can_host_port: "Мы контролируем прибрежный регион, где можно разместить порт"
 CHI_bri_can_host_prestige: "Мы контролируем свою столицу"
 CHI_bri_can_host_rail: "Мы контролируем регион, через который может пройти железная дорога"
 CHI_bri_can_host_sez: "Мы контролируем прибрежный или хорошо связанный регион, где можно разместить зону"
 CHI_bri_can_host_telecom: "Мы контролируем регион, где можно разместить сеть"
 CHI_bri_can_request: "Китай принимает заявки по ОПОП и имеет свободное место для проекта"
 CHI_bri_clear_loan_tt: "Их непогашенный долг по ОПОП §Gсписан§!"
 CHI_bri_has_reclaimable_structure: "У них есть проект ОПОП, который мы можем забрать"
 CHI_bri_monthly_income_base: "Базовый ежемесячный взнос в ОПОП"
 CHI_bri_monthly_income_base_desc: "Доля государственного бюджета, ежемесячно выделяемая в фонд «Один пояс и один путь» в соответствии с фокусами и решениями, до выделения ведомственных надбавок."
 CHI_bri_monthly_income_total: "Ежемесячный взнос в ОПОП"
 CHI_bri_monthly_income_total_desc: "Общая сумма, ежемесячно перечисляемая в фонд «Один пояс и один путь»: базовая сумма, на которую взяты обязательства, плюс любые дополнительные взносы от ведомств."
 CHI_bri_refuse_concession_tt: "Мы §Rсохраняем долг§! и остаёмся в состоянии дефолта"
 CHI_bri_returns_multiplier_base: "Множитель доходности ОПОП"
 CHI_bri_returns_multiplier_base_desc: "Бонус к доходу от международных инвестиций, который Китай получает по каждому завершённому проекту в рамках инициативы «Один пояс и один путь»."
 CHI_bri_unlock_tt: "§Y«Один пояс и один путь»:§! §G6§! мест для проектов, §G40§! за проект, §G+8§! к ежемесячному взносу, §G+4§! к международным инвестициям за каждый завершённый проект"
 CHI_Write_Off_Debts_tt: "Долги каждого подходящего партнёра по линии «Один пояс и один путь» §Gсписываются§! полностью"
 CHI_bri_forum_surge: "Всплеск после форума «Один пояс и один путь»"
 CHI_bri_forum_surge_desc: "Обязательства, подписанные на форуме, проходящем раз в три года, позволят Пекину в течение следующих трёх лет реализовывать ещё два проекта одновременно. Благодаря увеличению количества доступных квот в любой момент времени строительство смогут вести больше государств-партнёров."
 CHI_bri_partner_1: "Участник ОПОП"
 CHI_bri_partner_1_desc: "Началось строительство первого проекта в рамках инициативы «Один пояс и один путь». Китайские строительные бригады ускоряют темпы строительства внутри страны и укрепляют доверие к программе развития правительства."
 CHI_bri_partner_2: "Партнёр ОПОП"
 CHI_bri_partner_2_desc: "Завершена реализация второго проекта в рамках инициативы «Один пояс и один путь». Китайские инженерные разработки и финансирование инфраструктурных проектов становятся заметной частью национальной программы развития."
 CHI_bri_partner_3: "Стратегический партнёр ОПОП"
 CHI_bri_partner_3_desc: "В настоящее время по всей стране реализуется целый ряд проектов в рамках инициативы «Один пояс и один путь». Китайские подрядчики, кредитные линии и политическая поддержка укрепляют потенциал государств, а Пекин в ответ ожидает от них дипломатической солидарности."
 CHI_bri_partner_4: "Опорное государство ОПОП"
 CHI_bri_partner_4_desc: "Инвестиции в рамках инициативы «Один пояс и один путь» являются опорой национальной экономики. Китайский капитал финансирует строительство и обеспечение потребителей товарами, и в настоящее время эту зависимость трудно устранить без серьезных потрясений."
 CHI_bri_partner_5: "Краеугольный партнёр ОПОП"
 CHI_bri_partner_5_desc: "Эта страна является одной из опор инициативы «Один пояс и один путь». Китайские стандарты, подрядчики и источники финансирования присутствуют в каждом крупном транспортном коридоре, а экономическая политика формируется с учётом интересов Пекина."
 CHI_bri_presence_modifier: "Глобальное присутствие ОПОП"
 CHI_bri_presence_modifier_desc: "Авторитет Китая опирается на сеть инициативы «Один пояс и один путь». Он растёт по мере увеличения числа стран-партнёров и углубления их вовлечённости в эту инициативу."
 CHI_bri_presence_modifier_tt: "Зависит от §Y$CHI_bri_global_presence$§!: суммарного ранга всех партнёров инициативы «Один пояс и один путь». Спрос на потребительские товары снижается не более чем на §G7.5%§! при присутствии 200."
 CHI_bri_claim_resource_rights: "Потребовать права на ресурсы"
 CHI_bri_claim_resource_rights_desc: "Принять оплату натурой. Должник передаёт долгосрочные права на добычу и экспорт, уменьшая долг на стоимость одного проекта, но уступая контроль над своей ресурсной базой. Доступно только на пути «Хищническое кредитование»."
 CHI_bri_project_mission: "Строительство ОПОП"
 CHI_bri_project_mission_desc: "Китайские подрядчики и финансирование работают над проектом §Y[GetBRIProjectName]§!. После его завершения мы получим его преимущества, наш статус партнёра повысится, а Пекин получит свою отдачу от инвестиций."
 CHI_bri_raise_contribution: "Увеличить финансирование ОПОП"
 CHI_bri_raise_contribution_desc: "Ежемесячно направлять в фонд инициативы «Один пояс и один путь» более значительную долю государственного бюджета. Казна оплачивает строительство авансом, и его средства никогда не пополняются за счёт доходов от проектов, поэтому увеличение объёма финансирования — единственный способ продолжить строительство."
 CHI_bri_raise_contribution_tt: "§Y$CHI_bri_monthly_income$§!: до §G+4§! в месяц (максимум §Y30§!)"
 CHI_bri_resource_concession_idea: "Китайская ресурсная концессия"
 CHI_bri_resource_concession_idea_desc: "Часть просроченного кредита по инициативе «Один пояс и один путь» погашена передачей прав на добычу и экспорт. Китайские компании разрабатывают месторождения, а доходы покидают страну, не успев быть обложенными налогами. Концессия действует до тех пор, пока её не выкупят."
 CHI_BRI_project_missions: "Проекты ОПОП"
 CHI_BRI_project_missions_desc: "Проекты в рамках инициативы «Один пояс и один путь», которые в настоящее время реализуются в нашей стране и финансируются и строятся китайскими подрядчиками."
 CHI_BRI_automation_disable: "Отключить автоматизацию ОПОП"
 CHI_BRI_automation_disable_desc: "Вернуться к процедуре рассмотрения поступающих заявок на участие в проектах в рамках инициативы «Один пояс и один путь» в режиме ручного контроля. Каждая заявка будет регистрироваться как отдельное событие, которое Китай будет рассматривать и утверждать или отклонять индивидуально. В отношении заявок, которые уже находятся на рассмотрении, будет сохраняться порядок, установленный на момент их открытия."
 CHI_BRI_automation_enable: "Включить автоматизацию ОПОП"
 CHI_BRI_automation_enable_desc: "Утверждать поступающие заявки по инициативе «Один пояс и один путь» автоматически, а не рассматривать каждую из них отдельно. Перед подачей заявки заявители уже проходят проверку на соответствие критериям и наличие свободного места для проекта, поэтому автоматизация просто позволяет обойти бумажную волокиту. В отношении заявок, уже находящихся на рассмотрении, сохраняется порядок, в соответствии с которым они были открыты."
 CHI_bri_committed_projects: "Проекты ОПОП в работе"
 CHI_bri_committed_projects_desc: "Действующие проекты в рамках инициативы «Один пояс и один путь» и заявки, ожидающие рассмотрения. Каждая заявка, находящаяся на рассмотрении, резервирует место для проекта."
 CHI_MAC_gambling_diversification: "Диверсификация игорной отрасли"
 CHI_MAC_gambling_diversification_desc: "На протяжении десятилетий процветание Макао опиралось на одну-единственную опору: игорный бизнес. Целенаправленный переход к цифровым услугам, электронной коммерции и развитию технологической инфраструктуры расширяет налоговую базу за пределы игорного бизнеса, что позволяет Особому административному району защититься от колебаний доходов от туризма и одновременно способствует формированию собственной интернет-экономики."
