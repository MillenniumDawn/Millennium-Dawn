 ADO_infantry_weapons_3_desc: "M16A2 소총의 개발은 원래 미 해병대가 베트남 전쟁에서 XM16E1과 M16A1 소총을 사용해 얻은 전투 경험을 바탕으로 요청한 것이었습니다. 이 소총은 1982년 국방부에서 \"미군 5.56mm 소총 M16A2\"로 공식 채택되었습니다. 미 해병대는 1980년대 초중반에 이 소총을 미군 최초로 도입했으며, 미 육군은 1980년대 후반에 뒤이어 도입했습니다."
 ADO_infantry_weapons_4_desc: "헤클러앤코흐 G36(게베르 36)은 5.56x45mm 구경의 돌격소총으로, 1990년대 초 독일 무기 제조업체 헤클러앤코흐에서 더 무거운 7.62x51mm G3 모델을 대체하기 위해 개발되었습니다. 1990년대 중반 독일 연방군에 채택되어 G3를 대체했으며, 이후 수출용으로도 인기를 얻어 독일, 스페인, 영국 등 여러 국가의 군대와 경찰에서 실전에 투입되었습니다."
 ADO_infantry_weapons_5_desc: "G36A2 모델은 G36 모델의 개량형입니다. G36A2는 기존의 듀얼 컴뱃 사이팅 시스템의 레드닷 조준경을 대체하는, 피카티니 레일에 장착된 탈착식 자이스 RSA 반사식 레드닷 조준경을 특징으로 합니다. G36A2 업그레이드 키트에는 더 짧은 G36C 개머리판, 옵션으로 4개의 피카티니 레일을 장착할 수 있는 알루미늄 재질의 새로운 핸드가드, 그리고 오를리콘 콘트라베스 LLM01 레이저 라이트 모듈 작동 스위치가 내장된 수직형 포어그립이 포함됩니다."
 ADO_infantry_weapons_6_desc: "The Heckler & Koch HK416 is a gas-operated assault rifle chambered for the 5.56x45mm NATO cartridge. It is designed and manufactured by the German company Heckler & Koch. Although the design is based on the AR-15 class of firearm, it uses a proprietary short-stroke, gas piston system from Heckler & Koch's earlier G36 family of rifles. The HK416 is also equipped with a proprietary accessory rail forearm with rails on all four sides to accommodate multiple accessories."
