 GCL_form_category: "Ein zweites Großkolumbien"
 GCL_form_category_desc: "Gran Colombia is a now-defunct state encompassing the modern nation-states of Ecuador, Colombia, Panama, and Venezuela. The Bolivarian state is one of the epitomes of South American strength as such is a worthwhile goal for our great nation. Uniting our kin in our sister nations will strengthen us and repel foreign influence in our great nation. We will declare a Second Gran Colombia and bring unity to our great nations!"
