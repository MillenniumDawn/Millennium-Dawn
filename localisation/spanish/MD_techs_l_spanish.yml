 space_folder_desc: "Vehículos de Lanzamiento Orbital y Satélites."
 cruise_missiles_folder: "Tecnología de misiles guiados"
 cruise_missiles_folder_desc: "IRBM, ICBM, SAM y misiles de crucero"
