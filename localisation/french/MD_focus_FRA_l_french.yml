 france_md.600.t: "L'activité puces qu'Alcatel ne veut plus"
 france_md.600.d: "La bulle télécoms a éclaté et Alcatel vend tout ce qui n'est pas réseau. Sa division microélectronique est rentable, compétente et sur le point d'appartenir à quelqu'un d'autre. La garder française coûterait au Trésor de l'argent réel pour résoudre un problème que le marché ne croit pas avoir."
 france_md.600.a: "Garder le bras microélectronique en mains françaises"
 france_md.600.b: "Le laisser à un acheteur européen"
 france_md.601.t: "Le mur du crédit"
 france_md.601.d: "France Télécom doit plus qu'aucune entreprise n'a jamais dû, les acquisitions qui ont bâti la dette valent une fraction de ce qui a été payé, et les banques ne reconduiront plus. L'État peut mettre de l'argent public dans une société cotée, ou laisser les créanciers décider de ce que devient l'opérateur national."
 france_md.601.a: "Recapitaliser l'opérateur avec de l'argent public"
 france_md.601.b: "Laisser les créanciers le restructurer"
 france_md.602.t: "L'État perd sa majorité"
 france_md.602.d: "Vendre la participation de l'État dans France Télécom sous cinquante pour cent lèverait beaucoup d'argent et mettrait fin à l'argument de Bruxelles sur un incumbent public concurrent sur un marché ouvert. Cela voudrait aussi dire que la prochaine décision sur le réseau téléphonique français serait prise par les actionnaires."
 france_md.602.a: "Conserver la majorité de l'État"
 france_md.602.b: "Vendre en dessous de cinquante pour cent"
 france_md.603.t: "Après Crolles2"
 france_md.603.d: "L'alliance partagée à Crolles a donné à trois entreprises un procédé de pointe qu'aucune n'aurait pu s'offrir seule, et deux d'entre elles s'en vont. Financer le remplacement signifie que l'État porte un programme de recherche que ses partenaires ont quitté. Refuser signifie qu'une entreprise française développe le nœud seule, ou cesse d'essayer."
 france_md.603.a: "Financer ce qui remplace l'alliance"
 france_md.603.b: "Laisser le champion national le porter seul"
 france_md.604.t: "Déroulage ST-Ericsson"
 france_md.604.d: "ST-Ericsson, la coentreprise que STMicroelectronics a bâtie avec Ericsson pour être le champion sans fil de l'Europe, a perdu de l'argent chaque trimestre de son existence, et les fabricants de terminaux qu'elle devait servir conçoivent désormais leur propre silicium. La sauver achèterait du temps à une activité dont le marché a déjà bougé. La défaire solde la dernière tentative européenne sérieuse de chipset mobile."
 france_md.604.a: "Sauver la coentreprise sans fil"
 france_md.604.b: "La défaire et encaisser les pertes"
 france_md.605.t: "L'IPCEI microélectronique"
 france_md.605.d: "Bruxelles autorisera ce qu'elle interdisait : de l'argent public, à grande échelle, pour la capacité semi-conducteur. Crolles pourrait être élargi en quelque chose qui compte pour le continent plutôt que pour une seule entreprise. C'est une course aux subventions que la France n'a pas commencée et ne peut gagner seule, et l'alternative n'est pas d'y concourir."
 france_md.605.a: "Financer l'expansion de Crolles"
 france_md.605.b: "Laisser la capacité au marché"
 france_md.606.t: "Ce que la République a gardé"
 france_md.606.d: "Un quart de siècle de sauvetages, cessions, alliances et subventions a fixé ce qu'il est advenu d'Alcatel, de France Télécom et de STMicroelectronics : quelles parts du réseau téléphonique et de l'industrie semi-conducteur la France possède encore, et lesquelles elle n'héberge plus que."
 france_md.606.a: "Un champion que la République possède encore"
 france_md.606.b: "Une base silicium bâtie avec l'argent public"
 france_md.606.c: "Un opérateur que l'État a jadis sauvé"
 france_md.606.e: "Un marché comme un autre"
 FRA_cs_nationalised_systems_champion: "Champion des systèmes nationalisés"
 FRA_cs_nationalised_systems_champion_desc: "L'État n'a jamais lâché la majorité, si bien que le réseau et l'industrie autour répondent à Paris avant de répondre à un cours de Bourse. Cela coûte au Trésor ce que coûte toujours une participation de contrôle, et cela achète des décisions qui restent dans le pays."
 FRA_cs_state_backed_silicon_base: "Base de silicium soutenue par l'État"
 FRA_cs_state_backed_silicon_base_desc: "L'argent public a bâti une capacité de fabrication qu'aucune entreprise française n'aurait financée seule, et les wafers sont faits en France. La subvention est permanente parce que la capacité l'est, et les deux sont désormais des faits accomplis plutôt que des arguments."
 FRA_cs_recapitalised_national_operator: "Opérateur national recapitalisé"
 FRA_cs_recapitalised_national_operator_desc: "L'État a mis son argent quand personne d'autre ne l'aurait fait et l'opérateur a survécu à une dette qu'aucune entreprise n'aurait dû porter. C'était un sauvetage plutôt qu'une structure, et les sauvetages ne durent pas."
 FRA_cs_market_like_any_other: "Un marché comme un autre"
 FRA_cs_market_like_any_other_desc: "Les champions ont été vendus, fusionnés ou liquidés selon des termes commerciaux ordinaires, et la France achète ses réseaux et ses puces à qui les vend le mieux. C'est efficace, c'est orthodoxe, et plus rien de stratégique ne se décide ici."
 france_md.554.t: "La France propose des exercices militaires conjoints"
 france_md.554.d: "Des diplomates français nous ont envoyé une proposition d'entraînement militaire conjoint. La récente hausse des tensions internationales nous encourage en effet à nous unir entre États européens pour préparer le pire. Ce pourrait être une très bonne initiative pour former nos forces armées aux conflits de haute intensité qui pourraient éclater à tout moment. Que leur répondre ?"
 france_md.554.a: "Avec plaisir, nous nous entraînerons à leurs côtés"
 france_md.554.b: "Non merci, nous n'avons pas besoin de leur aide"
 france_md.359.t: "Les monarchistes s'emparent du pouvoir en France"
 france_md.359.d: "Nouvelle stupéfiante depuis [FRA.GetNameWithFlag] : des factions extrémistes au sein du parti au pouvoir ont pris le contrôle et aboli la Cinquième République. La direction modérée a été mise à l'écart tandis que les radicaux restaurent le régime monarchiste. Ce putsch spectaculaire contre la démocratie a choqué le monde. Comment devons-nous réagir ?"
 france_md.359.a: "Condamner cette prise de pouvoir extrémiste"
 france_md.359.b: "C'est une affaire intérieure française"
 FRA_country_chaos: "Des rumeurs alarmantes"
 FRA_country_chaos_desc: "Une vague de panique a balayé le pays. Des rumeurs circulent sur des dépôts d'armes pillés et des désertions massives. Quelque chose se prépare..."
 FRA_too_stable_tt: "Une §Ystabilité inférieure à 25 %§! accorde l'augmentation maximale de popularité du parti"
 FRA_too_europhile_tt: "Un §Yeuropéisme inférieur à 50 %§! accorde l'augmentation maximale de popularité du parti"
 FRA_napoleon_army_reform_tt: "Réformes de la Grande Armée terminées : §Y[?FRA_grande_armee_reforms_completed|0]/3§!"
 FRA_6threp_tt: "Dans les événements à venir, vous rédigerez une constitution, que vous aurez ou non à la fin du processus. N'oubliez pas de vous hâter avant que l'élan ne retombe"
 FRA_cfa_franc_user_exists_tt: "Au moins une nation utilise encore le §Yfranc CFA§!"
 FRA_eco_candidate_exists_tt: "Au moins une nation utilise encore le §Yfranc CFA§! ou le §Yfranc CFA (Afrique centrale)§!"
 FRA_corporate_systems_ambition_ft_restructuring: "Ambition FT 2005 Restructuration"
 FRA_corporate_systems_ambition_ft_restructuring_desc: "Recapitalisation, cessions et réformes d'exploitation réparent le bilan de France Télécom. L'investissement réseau reste contraint tant que le groupe rétablit sa trésorerie."
 FRA_corporate_systems_french_national_champions: "Champions nationaux français"
 FRA_corporate_systems_french_national_champions_desc: "La France a maintenu des entreprises, sites de recherche et infrastructures critiques sous une direction nationale forte. Souveraineté et résilience sont élevées, mais le modèle exige un soutien public durable et accepte moins d'intégration étrangère."
 FRA_corporate_systems_china_connected_infrastructure: "Infrastructures liées à la Chine"
 FRA_corporate_systems_china_connected_infrastructure_desc: "Les fournisseurs chinois sont devenus centraux dans la modernisation du réseau français. Déploiement rapide et liens commerciaux plus étroits s'accompagnent d'une dépendance durable dans les infrastructures critiques et de risques de remplacement plus élevés."
 FRA_corporate_systems_resilient_multivendor_network: "Réseau multifournisseur résilient"
 FRA_corporate_systems_resilient_multivendor_network_desc: "La France a réparti les achats de réseau critique entre plusieurs fournisseurs et a préservé la capacité de remplacer n'importe lequel. Le résultat est moins concentré et plus résilient, mais la coordination et le déploiement sont plus lents."
 FRA_corporate_systems_events.1.a: "Restructurer de manière agressive"
 FRA_corporate_systems_events.1.a_tt: "Santé d'Alcatel : §G+0.8§!\nPression de la dette des entreprises : §G-0.6§!\nStabilité : §R-1.0%§!\nGagne §YRestructuration après le krach des télécoms§! pendant §Y730 jours§!.\nGagne un bonus de recherche de §G5%§! pour la §Ytechnologie internet§!."
 FRA_corporate_systems_events.1.b: "Protéger la R&D stratégique"
 FRA_corporate_systems_events.1.b_tt: "Pouvoir politique : §R-75§!\nSouveraineté stratégique : §G+0.4§!\nSanté d'Alcatel : §G+0.6§!\nGagne un bonus de recherche de §G5%§! pour l'§Yéquipement de commandement et de contrôle§!."
 FRA_corporate_systems_events.1.c: "Tenir la ligne"
 FRA_corporate_systems_events.1.c_tt: "Santé d'Alcatel : §R-1.0§!\nPression de la dette des entreprises : §R+0.8§!\nStabilité : §G+0.5%§!"
 FRA_corporate_systems_events.1.d: "L'effondrement du boom des équipements télécoms a laissé Alcatel avec des commandes en baisse, des surcapacités et des pertes croissantes. L'entreprise doit décider ce qu'il faut préserver pendant la restructuration."
 FRA_corporate_systems_events.1.t: "La bulle télécoms éclate"
 FRA_corporate_systems_events.10.a: "Acquérir l'ensemble de l'activité"
 FRA_corporate_systems_events.10.a_tt: "Souveraineté stratégique : §G+0.2§!\nCapacité semi-conducteurs : §G+0.4§!\nSanté de STMicroelectronics : §G+0.5§!\nGagne un bonus de recherche de §G10%§! pour la §Ytechnologie des microprocesseurs§!."
 FRA_corporate_systems_events.10.b: "Acquérir la PI et les actifs stratégiques"
 FRA_corporate_systems_events.10.b_tt: "Capacité semi-conducteurs : §G+0.2§!\nSanté de STMicroelectronics : §G+0.3§!\nGagne un bonus de recherche de §G5%§! pour la §Ytechnologie des microprocesseurs§!."
 FRA_corporate_systems_events.10.c: "Refuser l'acquisition"
 FRA_corporate_systems_events.10.c_tt: "Santé STMicroelectronics : §G+0,2§!"
 FRA_corporate_systems_events.10.d: "La restructuration d'Alcatel a mis en question l'avenir de ses actifs microélectroniques. STMicroelectronics peut viser l'ensemble de l'activité, seulement la technologie stratégique, ou préserver le capital pour d'autres priorités."
 FRA_corporate_systems_events.10.t: "Alcatel Microelectronics est à vendre"
 FRA_corporate_systems_events.11.a: "Élargir l'alliance R&D multinationale"
 FRA_corporate_systems_events.11.a_tt: "Souveraineté stratégique : §R-0.1§!\nCapacité semi-conducteurs : §G+0.6§!\nGagne 2 bonus de recherche de §G10%§! pour la §Ytechnologie des microprocesseurs§!."
 FRA_corporate_systems_events.11.b: "Construire un programme à direction française"
 FRA_corporate_systems_events.11.b_tt: "Pouvoir politique : §R-75§!\nSouveraineté stratégique : §G+0.5§!\nCapacité semi-conducteurs : §G+0.4§!\nGagne un bonus de recherche de §G10%§! pour la §Ytechnologie des microprocesseurs§!."
 FRA_corporate_systems_events.11.c: "Limiter notre exposition en capital"
 FRA_corporate_systems_events.11.c_tt: "Capacité de semi-conducteurs : §G+0.1§!\nSanté de STMicroelectronics : §G+0.2§!"
 FRA_corporate_systems_events.11.d: "Motorola est prêt à rejoindre STMicroelectronics et Philips à Crolles2, élargissant l'alliance autour du développement de procédés avancés. Plus d'échelle répartirait coûts et expertise, mais diluerait aussi le contrôle purement français."
 FRA_corporate_systems_events.11.t: "L'alliance Crolles2 s'élargit"
 FRA_corporate_systems_events.13.a: "Consolider le sans-fil avec NXP"
 FRA_corporate_systems_events.13.a_tt: "Capacité semi-conducteurs : §G+0.5§!\nSanté de STMicroelectronics : §G+0.2§!\nPression de la dette des entreprises : §R+0.3§!\nGagne un bonus de recherche de §G10%§! pour la §Ytechnologie des microprocesseurs§!."
 FRA_corporate_systems_events.13.b: "Gardez ST sans fil indépendant"
 FRA_corporate_systems_events.13.b_tt: "Souveraineté stratégique : §G+0.3§!\nSanté de STMicroelectronics : §R-0.1§!\nGagne un bonus de recherche de §G5%§! pour la §Ytechnologie des microprocesseurs§!."
 FRA_corporate_systems_events.13.c: "Céder l’exposition au sans fil"
 FRA_corporate_systems_events.13.c_tt: "Capacité de semi-conducteurs : §R-0.6§!\nSanté de STMicroelectronics : §G+0.4§!"
 FRA_corporate_systems_events.13.d: "STMicroelectronics et NXP ont convenu de regrouper leurs activités semi-conducteurs sans fil. La coentreprise offre plus d'échelle dans les puces mobiles, mais concentrer deux activités difficiles comporte un risque d'exécution substantiel."
 FRA_corporate_systems_events.13.t: "ST-NXP sans fil"
 FRA_corporate_systems_events.14.a: "Formulaire ST-Ericsson"
 FRA_corporate_systems_events.14.a_tt: "Intégration européenne : §G+0.5§!\nCapacité semi-conducteurs : §G+0.6§!\nPression de la dette des entreprises : §R+0.7§!\nGagne 2 bonus de recherche de §G10%§! pour la §Ytechnologie des microprocesseurs§!."
 FRA_corporate_systems_events.14.b: "Exiger des limites financières plus strictes"
 FRA_corporate_systems_events.14.b_tt: "Intégration européenne : §G+0.5§!\nCapacité semi-conducteurs : §G+0.4§!\nPression de la dette des entreprises : §R+0.3§!\nGagne un bonus de recherche de §G10%§! pour la §Ytechnologie des microprocesseurs§!."
 FRA_corporate_systems_events.14.c: "Restez indépendant"
 FRA_corporate_systems_events.14.c_tt: "Souveraineté stratégique : §G+0.4§!\nIntégration européenne : §R-0.2§!\nCapacité de semi-conducteurs : §R-0.3§!"
 FRA_corporate_systems_events.14.d: "Ericsson Mobile Platforms pourrait rejoindre ST-NXP Wireless dans une nouvelle coentreprise européenne. Combiner expertise modem, radio et processeurs d'application promet une profondeur technologique, bien que l'activité élargie puisse consommer un capital substantiel."
 FRA_corporate_systems_events.14.t: "Un champion européen du sans fil"
 FRA_corporate_systems_events.16.a: "Effectuer une sortie ordonnée"
 FRA_corporate_systems_events.16.a_tt: "Capacité semi-conducteurs : §R-0.5§!\nSanté de STMicroelectronics : §G+0.8§!\nPression de la dette des entreprises : §G-1.0§!\nStabilité : §R-0.5%§!\nGagne §YCoûts de sortie de ST-Ericsson§! pendant §Y730 jours§!."
 FRA_corporate_systems_events.16.b: "Absorber la technologie et le personnel"
 FRA_corporate_systems_events.16.b_tt: "Pouvoir politique : §R-75§!\nSouveraineté stratégique : §G+0.4§!\nCapacité semi-conducteurs : §R-0.2§!\nSanté de STMicroelectronics : §G+0.3§!\nGagne un bonus de recherche de §G5%§! pour la §Ytechnologie des microprocesseurs§!."
 FRA_corporate_systems_events.16.c: "Continuer à financer la coentreprise"
 FRA_corporate_systems_events.16.c_tt: "Capacité de semi-conducteurs : §G+0.3§!\nSanté de STMicroelectronics : §R-0.7§!\nPression de la dette des entreprises : §R+1.2§!"
 FRA_corporate_systems_events.16.d: "Les pertes persistantes de ST-Ericsson ont épuisé la patience de ses actionnaires. La France doit décider quelle technologie, quel personnel et quel risque financier STMicroelectronics doit extraire de la coentreprise échouée."
 FRA_corporate_systems_events.16.t: "Déroulage ST-Ericsson"
 FRA_corporate_systems_events.17.a: "Ancrer la France dans l'IPCEI"
 FRA_corporate_systems_events.17.a_military: "Électronique militaire IPCEI"
 FRA_corporate_systems_events.17.a_tt: "Souveraineté stratégique : §G+0.6§!\nIntégration européenne : §G+1.0§!\nCapacité semi-conducteurs : §G+0.8§!\nGagne 2 bonus de recherche de §G10%§! pour la §Ytechnologie des microprocesseurs§!.\nGagne un bonus de recherche de §G5%§! pour l'§Yéquipement de commandement et de contrôle§!."
 FRA_corporate_systems_events.17.b: "Poursuivre un programme France d'abord"
 FRA_corporate_systems_events.17.b_tt: "Pouvoir politique : §R-125§!\nSouveraineté stratégique : §G+0.9§!\nIntégration européenne : §R-0.5§!\nCapacité semi-conducteurs : §G+0.6§!\nGagne un bonus de recherche de §G10%§! pour la §Ytechnologie des microprocesseurs§!."
 FRA_corporate_systems_events.17.c: "Laisser l'investissement au marché"
 FRA_corporate_systems_events.17.c_tt: "Capacité de semi-conducteurs : §R-0.2§!\nSanté de STMicroelectronics : §G+0.2§!"
 FRA_corporate_systems_events.17.d: "Cinq États européens ont approuvé un projet microélectronique commun couvrant puces économes, semi-conducteurs de puissance, capteurs, systèmes optiques et matériaux avancés. STMicroelectronics peut ancrer la France dans le programme ou suivre une voie plus nationale."
 FRA_corporate_systems_events.17.t: "IPCEI européen de microélectronique"
