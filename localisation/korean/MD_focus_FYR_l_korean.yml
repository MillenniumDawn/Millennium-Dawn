l_korean:
 FYR_political.1.t: "북서부의 반란"
 FYR_political.1.d: "스스로를 민족해방군이라 칭하는 알바니아계 무장 세력이 국경 마을 타누셰프치를 장악했으며, 보안군과의 교전이 테토보 방향으로 번지고 있습니다. 스코페는 90년대에 마케도니아를 비껴갔던 전쟁이 마침내 닥쳤다고 두려워하고 있습니다."
 FYR_political.1.a: "국제 중재를 구한다"
 FYR_political.1.b: "반란을 분쇄한다"
 FYR_political.2.t: "오흐리드 기본 협정"
 FYR_political.2.d: "정부와 알바니아계 정당 지도자들이 서방의 중재 아래 오흐리드에서 기본 협정에 서명했습니다. 소수 민족이 인구의 5분의 1을 넘는 지방자치체에서는 알바니아어가 공용어 지위를 얻고, 치안 권한은 이양되며, 반란군은 사면을 받는 대가로 NATO 수거반에 무기를 넘기게 됩니다."
 FYR_political.2.a: "나눠 가진 권력이 전쟁보다 낫다"
 FYR_political.3.t: "프레스파 협정"
 FYR_political.3.d: "프레스파 호숫가에서 스코페와 아테네의 협상단이 수십 년간 이어진 국호 분쟁을 끝내는 합의에 가서명했습니다. 이 나라는 북마케도니아 공화국이 되며, 그 대가로 그리스는 NATO 가입과 유럽 가입 협상에 대한 거부권을 철회합니다."
 FYR_political.3.a: "서명하고 유럽-대서양의 길을 걷는다"
 FYR_political.3.b: "우리는 나라 이름을 바꾸지 않을 것이다"