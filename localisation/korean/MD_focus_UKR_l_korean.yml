 ukraine_varyag.13.name: "§Y[TUR.GetNameWithFlag]§!, 통과 불허"
 ukraine_varyag.13.desc: "§W§!§Y[TUR.GetNameWithFlag]§!§W과(와) §!§Y[CHI.GetNameWithFlag]§!§W의 협상이 §!§R결렬되었습니다§!§W. 당국은 통과를 거부했고 항공모함 인수도 배제했습니다. 우리가 구매자에게 대금을 보상하고 예인 비용을 부담하면 §!§Y미콜라이우§!§W로 돌려보내는 예인을 주선해 주겠다고 합니다.§!"
 ukraine_varyag.13.a: "선체를 본국으로 되돌리는 방안을 고려한다"
 ukraine_varyag.14.name: "§Y바랴크§!의 전자 장비"
 ukraine_varyag.14.desc: "§W조사단은 증기 기관을 그대로 유지할 것을 권고합니다. 조선소는 기존 장비로 §!§Y프레가트 계열§!§W 전자 장비를 재건하거나 §!§L$FRA_thales_manufacturer$§!§W에서 §!§YSMART-S§!§W 장비 일체를 주문할 수 있습니다. 수입하려면 §!§Y[FRA.GetNameWithFlag]§!§W과(와) 평화 상태여야 하고 해당 정부의 호감도가 최소 §!§Y+30§!§W이어야 합니다.§!"
