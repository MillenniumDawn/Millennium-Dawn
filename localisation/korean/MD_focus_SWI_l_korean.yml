l_korean:
 SWI_the_mountain_fortress: "산악 요새"
 SWI_the_mountain_fortress_desc: "The most efficient defense we possess is our mountains. We must build these up if we wish to maintain the defensive edge."
 SWI_guns_for_the_population: "총을 든 국민"
 SWI_guns_for_the_population_desc: "사방에 더 강대한 국가로 둘려싸인 나라는 반드시 언제든 총을 들 수 있는 국민들의 준비가 되어있어야 합니다."
 SWI_zurich_industrial_project: "취리히 산업 계획"
 SWI_zurich_industrial_project_desc: "인접국과 경쟁하려 한다면, 자동화 산업 구역을 소유하여야 합니다."
 SWI_strengthen_the_secret_services: "첩보 확대"
 SWI_strengthen_the_secret_services_desc: "첩보 임무를 통해서 나라 내외의 위협을 밝혀낼 수 있습니다."
 SWI_military_investments_1: "Armaments Programme I"
 SWI_military_investments_1_desc: "Fund the first tranche of the annual Armaments Programme put before Parliament, converting a sustained defense budget into new industrial capacity."
 SWI_geneva_industrial_project: "제네바 산업 계획"
 SWI_geneva_industrial_project_desc: "Geneva could always use more factory jobs. We should completely reform the area."
 SWI_secure_the_swiss_borders: "스위스 국경 방위"
 SWI_secure_the_swiss_borders_desc: "광대한 국경 순찰대의 연결망과 누구도 몰래 들어올 수도, 나갈 수도 없는 검문소의 설치를 시작해야합니다."
 SWI_italian_forts: "이탈리아 국경요새"
 SWI_italian_forts_desc: "남쪽의 인접국의 공격에 대비해야 합니다."
 SWI_german_forts: "독일 국경요새"
 SWI_german_forts_desc: "We came way too close for comfort to war with Germany during WW2. We cannot be allowed to be taken off guard should German aggression once again rise."
 SWI_french_forts: "프랑스 국경요새"
 SWI_french_forts_desc: "It isn't like France has not invaded us before. We cannot allow ourselves to be overwhelmed as we were centuries before. We will be ready, just in case."
 SWI_military_investments_2: "Armaments Programme II"
 SWI_military_investments_2_desc: "Carry the Armaments Programme forward with a second wave of procurement, having proven that steady investment yields a self-sufficient defense industry."
 SWI_the_cern_project: "유럽원자핵공동연구소(CERN) 계획"
 SWI_the_cern_project_desc: "핵 연구는 미래로 가는 길입니다. 이 분야의 연구를 확대해야 합니다."
 SWI_the_large_hadron_collider: "Paul Scherrer Institute"
 SWI_the_large_hadron_collider_desc: "The Paul Scherrer Institute at Villigen is Switzerland's largest research center, pairing particle accelerators and neutron sources with deep expertise in reactor materials and nuclear safety. Its work anchors the Confederation's civilian nuclear program."
 SWI_construct_power_plants: "Reserve Power Plants"
 SWI_construct_power_plants_desc: "Alpine hydropower carries us through most of the year, but a cold, dry winter can leave the grid short. Standby gas-fired plants like the one at Birr give the Confederation a reserve to fall back on when imports run thin."
 switzerland_focus: "스위스 중점계통도"
 switzerland.2.t: "스위스 정치 체제의 종말"
 switzerland.2.d: "잦은 국민투표를 통해 정부 운영에 대한 이례적인 수준의 국민 참여로 오랫동안 특징지어진 스위스의 직접 민주주의 제도가 해체되고 있습니다.\n\n스위스 지도자 [SWI.GetLeader](이)가 이러한 \\"공적 생활의 방해 요소\\"와 \\"불필요한 국민투표\\"를 더 이상 시행하지 않겠다고 발표했습니다."
 switzerland.2.o1: "속이 시원하군"
 switzerland.2.o2: "얼마나 부끄러운가"
 switzerland.2.o3: "상관없다"
 switzerland_news.1.t: "UN에 가입하는 스위스"
 switzerland_news.1.d: "스위스 정부는 제2차 세계 대전 종전 이후 유엔 가입을 거부했습니다. 제네바가 유엔의 주요 유럽 본부인 유엔 제네바 사무소를 유치하고 있었음에도, 스위스는 자국 중립에 대한 지속적인 헌신을 이유로 들었습니다.\n\n이제 이 문제에 대한 국민투표를 거쳐 스위스 정부는 방관자의 입장을 버리고 정회원국으로서 이 기구에 가입하겠다고 발표했습니다."
 switzerland_news.1.o1: "이제 때가 되었다, 스위스!"
 switzerland_news.1.o3: "정말 그렇게 큰 일인가?"
 SWI_join_un: "신규 UN 회원국"
 swiss_political_system: "스위스의 정치 체제"
 swiss_political_system_desc: "스위스는 매우 독특한 정치 체제를 지니고 있으며, 스스로를 '반직접 민주주의'라고 당당히 부를 수 있는 세계 유일의 국가입니다. 시민들은 국민투표로 헌법을 바꿀 수 있고, 국민투표로 법률에 거부권을 행사할 수 있으며, 심지어 국민투표로 법률을 통과시킬 수도 있습니다.\n그러나 이는 정치인들에게도 영향을 미칩니다. 어차피 국민이 정책을 정하기 때문에, 스위스의 연립 체제는 가능한 한 많은 세력을 포함해야 합니다. 스위스의 4대 정당인 SVP, FDP, CVP, SP는 늘 함께 정부를 구성하며, 이 때문에 스위스의 총선은 사실상 무의미합니다. 국민은 대표자를 통해서가 아니라 국민투표를 통해 통치하기 때문입니다.\n\n이 체제는 스위스가 스스로에게만 답하고 연방 평의회가 민주 정당, 중립 블록, 또는 민족 포퓰리스트의 손에 남아 있는 동안에만 유지됩니다. 외세의 지배 아래 들어가거나 이들 외의 누군가에게 정부를 넘긴다면, 이 체제를 작동시키는 합의는 사라집니다."
 SWI_swiss_neutrality_desc: "§Y특별 규칙:§!\n\n§Y우리는§! 다른 국가에 §R선전포고할 수 없습니다§!§Y!§!\n--------------\n스위스인은 전 세계에서 중립국으로 알려져 있습니다. 공화국으로 건국된 이래 이 나라는 어떤 종류의 공세적 분쟁에도 참여하지 않았으며 양차 세계 대전 동안에도 중립을 유지했습니다.\n--------------\n이 국가 정신은 §H급진적 변화§! 또는 §H개방§! 중점을 완료하면 §R제거§!될 수 있습니다."
 SWI_Expanding_nuclear_research: "핵 연구 확대"
 SWI_expand_swiss_nuclear_plants: "원전 단지 확장"
 SWI_expand_swiss_nuclear_plants_desc: "베츠나우, 괴스겐, 라이프슈타트는 여전히 국내 수요를 충족하지만 여유가 줄어들고 있습니다. 지금 원자로 용량을 확대하면 한 세대 동안 스위스의 에너지 독립을 확보할 수 있습니다."
 SWI_research_and_development: "아르마스위스 과학기술"
 SWI_research_and_development_desc: "아르마스위스 S+T는 국방부의 기술 센터로, 센서, 통신, 사이버 보안, 소재 연구를 통합합니다. 안보와 관련된 기술 기반을 국내에 유지함으로써 스위스는 위기 시 해외 공급업체에 대한 의존을 최소화합니다."
 SWI_asd_gruppe: "ETH 계열 연구 프로그램"
 SWI_asd_gruppe_desc: "아르마스위스를 ETH 계열, 즉 취리히 연방공대와 로잔 연방공대에 묶어 공동 안보 연구 프로그램을 운영합니다. 연방 프랑과 학계의 인재를 모아 최전선 연구를 실전 배치 가능한 방위 능력으로 전환합니다."
 SWI_small_arms_development: "보병 무기 개발"
 SWI_small_arms_development_desc: "SIG와 B&T의 전문성을 활용하여 Stgw 90(SG 550) 제식 소총의 후속 모델과 그 광학 장비를 현대화합니다. 민병 군대의 운명은 모든 시민 병사의 손에 쥐어진 무기의 신뢰성에 달려 있습니다."
 SWI_sig_ag_research_teams: "스위스 무기 연구팀"
 SWI_sig_ag_research_teams_desc: "노이하우젠에 있는 SIG 소화기 계보 안에 전담 설계팀을 구성합니다. 수십 년에 걸친 스위스의 정밀 제조 기술이 차세대 개인 및 분대 화기에 투입됩니다."
 SWI_precision_launch_platforms: "유도 대전차 체계"
 SWI_precision_launch_platforms_desc: "알프스 산록의 근접 지형에서 하차 척탄병들이 기갑 전력에 결정적 타격을 줄 수 있도록 휴대용 유도 대전차 체계를 개발합니다."
 SWI_support_platforms_research: "통합 지휘 체계"
 SWI_support_platforms_research_desc: "FIS 헤어 전투 관리 네트워크를 발전시켜 지휘관들이 실시간으로 공통 전술 상황도를 공유하게 합니다. 스위스의 지휘, 통제, 통신은 분산된 민병대를 하나의 군대로 엮어 줍니다."
 SWI_mass_produced_firearms: "탄약 및 소화기 생산"
 SWI_mass_produced_firearms_desc: "스위스P 디펜스(구 RUAG 암모텍)를 통해 국내 탄약 및 소화기 생산량을 확대합니다. 보장된 국가 비축량은 수입에 의존하지 않고도 민병대를 무장시켜 줍니다."
 SWI_armored_vehicles_study: "장갑차 계획"
 SWI_armored_vehicles_study_desc: "기계화 여단의 차륜형 근간인 GDELS-모와그의 피라냐 및 이글 계열을 중심으로 스위스 장갑차 산업을 조율합니다."
 SWI_airframes_study: "항공 계획"
 SWI_airframes_study_desc: "슈탄스의 필라투스와 엠멘의 RUAG 항공을 아우르는 스위스 항공 전문성을 훈련기 기체에서 전투기 정비 및 구조물에 이르기까지 통합합니다."
 SWI_mbt_concept: "레오파르트 2 현대화"
 SWI_mbt_concept_desc: "RUAG이 주도하는 사격 통제, 방호, 기동 패키지로 Pz 87 레오파르트 2 전차를 개량하여 앞으로 수십 년 동안에도 주력 전차의 지위를 유지합니다."
 SWI_spart_systems: "자주포"
 SWI_spart_systems_desc: "KAWEST 개량 프로그램을 통해 M109(Pz Hb) 자주 곡사포의 사거리와 정확도를 높여 산악 지형에서 신속한 화력 지원을 제공합니다."
 SWI_spaa_systems: "기동 방공"
 SWI_spaa_systems_desc: "라인메탈 에어 디펜스 스카이레인저 35mm 체계를 기반으로 한 기동 단거리 방공 차량을 배치하여 기동 부대를 항공기와 드론으로부터 보호합니다."
 SWI_production_line_innovations: "자동화 생산 라인"
 SWI_production_line_innovations_desc: "RUAG과 모와그의 조립 공장을 현대적 자동화로 재정비하여 생산량을 높이고 부족한 숙련 노동력을 더 부가가치가 높은 작업에 돌립니다."
 SWI_import_missile_tech: "유도 미사일 통합"
 SWI_import_missile_tech_desc: "현대식 공대공 및 지대공 미사일을 도입하고 통합하여 스위스 플랫폼에서 이를 유지하고 개조할 국내 노하우를 쌓습니다."
 SWI_helicopter_research: "회전익 계획"
 SWI_helicopter_research_desc: "스위스의 수송, 연락, 산악 구조의 주력인 슈퍼 퓨마 / 쿠거 및 EC635 기단을 RUAG 항공을 통해 유지하고 개량합니다."
 SWI_air_cavalry_armament: "항공 기병 무장"
 SWI_air_cavalry_armament_desc: "슈퍼 퓨마 기단을 무장시키고 이에 맞는 공중 기동 교리를 작성하여, 수송 비행대를 민병대가 활용할 수 있는 기동 병과로 바꿉니다."
 SWI_gunship_development: "건십 개발"
 SWI_gunship_development_desc: "근접 지원과 무장 정찰을 위한 무장 회전익 개량형을 배치합니다. 전용 공격 헬리콥터 기단보다 구매와 유지 비용이 저렴합니다."
 SWI_revise_isolation_strategy: "레뒤를 넘어서"
 SWI_revise_isolation_strategy_desc: "정적인 알프스 레뒤를 넘어 현대적인 동적 지역 방어로 나아가고, 군 발전(WEA) 개혁을 달라진 위협 양상에 맞춥니다."
 SWI_log_tunnel_network: "알프스 터널 보급소"
 SWI_log_tunnel_network_desc: "산속에 뚫린 스위스의 숨겨진 동굴 보급소와 터널 네트워크를 활용하여, 어떤 공습도 닿을 수 없는 곳에 탄약과 연료를 저장합니다."
 SWI_domestic_res_output: "국가 경제 공급"
 SWI_domestic_res_output_desc: "비상시에도 에너지, 식량, 핵심 물자가 국가에 계속 공급되도록 하는 법적 틀인 국가 경제 공급 체계를 강화합니다."
 SWI_strat_supply_reserves: "의무 전략 비축"
 SWI_strat_supply_reserves_desc: "의무 비축 제도를 시행하여 봉쇄나 위기에 대비해 수개월분의 연료, 식량, 의약품을 비축합니다."
 SWI_environmental_adaptation: "알프스 전투 교리"
 SWI_environmental_adaptation_desc: "고지대 겨울 환경에서 싸우고 생존할 수 있도록 전문 산악 부대를 훈련하고 장비를 갖추어, 지형 자체를 무기로 바꿉니다."
 SWI_repair_decaying_forts: "알프스 요새 재가동"
 SWI_repair_decaying_forts_desc: "군 95 및 군 XXI 개혁에서 퇴역한 일부 포병 요새와 강화 진지를 재가동하여 산악 방어에 종심을 되살립니다."
 SWI_graubunden_gold_silver: "알프스 광물 채굴"
 SWI_graubunden_gold_silver_desc: "그라우뷘덴 알프스의 휴면 중인 광물 채굴지를 다시 열어 군수 산업을 위한 전략 물자를 국내에서 소량이나마 확보합니다."
 SWI_graubunden_iron_mines: "알프스 철광 채굴"
 SWI_graubunden_iron_mines_desc: "알프스 철광석을 개발해 소규모 국내 강철 공급원을 마련하고, 전쟁 물자 생산에 필요한 수입 원자재에 대한 의존을 줄입니다."
 SWI_mil_industry_expansion: "방위 산업 기반 확대"
 SWI_mil_industry_expansion_desc: "전쟁 물자법이 스위스에 유지하도록 의무화한 안보 관련 산업 기반을 키웁니다. 중립국은 해외 공급선이 막혔을 때 스스로 무장하고 버틸 수 있어야 합니다."
 SWI_sig_neuhausen_factory: "노이하우젠 SIG 공장"
 SWI_sig_neuhausen_factory_desc: "19세기 이래 스위스 소화기 제조의 중심이었던 라인 폭포 옆 노이하우젠의 유서 깊은 SIG 공장을 확장합니다."
 SWI_sig_graubunden_factory: "분산 무기 생산"
 SWI_sig_graubunden_factory_desc: "스위스의 분산 교리에 따라 소화기와 탄약 생산을 그라우뷘덴의 계곡으로 분산하여, 산업 기반을 참수 타격에 대비해 강화합니다."
 SWI_infrastructural_advancement: "산업 인프라"
 SWI_infrastructural_advancement_desc: "무기 공장으로 이어지는 철도와 도로를 개선하여 전시의 부담 속에서도 원자재와 완성 장비가 안정적으로 이동하게 합니다."
 SWI_expand_gdels_mowag: "GDELS-모와그 크로이츠링겐 확장"
 SWI_expand_gdels_mowag_desc: "스위스군과 수출 고객 모두에게 공급되는 피라냐 및 이글 장갑차의 본거지인 크로이츠링겐의 GDELS-모와그 공장을 확대합니다."
 SWI_new_factory_ruag: "신규 RUAG 시설"
 SWI_new_factory_ruag_desc: "항공기와 지상 체계 정비를 위한 RUAG MRO 스위스의 신규 용량을 가동합니다. 국가 정책은 스위스 군 정비의 대부분을 RUAG에 맡기도록 하고 있습니다."
 SWI_cooperation_with_rheinmetall: "라인메탈과의 협력"
 SWI_cooperation_with_rheinmetall_desc: "오를리콘 콘트라베스의 계승자이자 35mm 기관포, 스카이가드, 스카이실드 방공 전통을 이어받은 취리히의 라인메탈 에어 디펜스 AG와의 관계를 심화합니다."
 SWI_cooperation_with_thales: "탈레스와의 협력"
 SWI_cooperation_with_thales_desc: "레이더, 광전자 장비, 지휘 통제 체계를 위해 탈레스 스위스와 협력하여, 스위스군을 검증된 센서 및 네트워킹 기술에 연결합니다."
 SWI_general_staff: "군 참모부"
 SWI_general_staff_desc: "군 참모총장 휘하의 군 참모부(Führungsstab der Armee) 아래에서 기획과 교리를 통합하여 민병대에 현대적인 합동 지휘부를 제공합니다."
 SWI_gemeinsames_ok: "특수전 사령부"
 SWI_gemeinsames_ok_desc: "특수전 사령부와 그 산하의 군 정찰 파견대 10 및 척탄병 부대를 민병 군대를 위한 소규모이지만 정예인 선봉으로 육성합니다."
 SWI_ausbildungskommando: "훈련 사령부"
 SWI_ausbildungskommando_desc: "신병 학교와 보수 교육을 운영하는 훈련 사령부를 개혁합니다. 스위스 체제의 강점은 전 국민이 규율 있고 표준화된 훈련을 거친다는 점입니다."
 SWI_airforce_modernization: "에어2030 계획"
 SWI_airforce_modernization_desc: "노후화된 F-5 타이거와 F/A-18 호넷을 대체하고 한 세대 동안 쓸 지상 기반 방공망을 재건하기 위해, 현대 스위스 역사상 최대 규모의 무기 조달인 에어2030을 시작합니다."
 SWI_general_air_defense: "신형 전투기 평가"
 SWI_general_air_defense_desc: "신형 전투기(NKF) 평가를 개시하여, 최종 후보 기종들을 파이에른에서 비행시키고 조밀한 산악 지대인 스위스 영공을 감시하는 데 필요한 요건에 비추어 측정합니다."
 SWI_import_eurofighters: "유로파이터 타이푼 입찰"
 SWI_import_eurofighters_desc: "상당한 산업 참여 패키지와 함께 제안된, 검증된 유럽의 제공권 전투기인 에어버스와 BAE의 유로파이터 타이푼을 평가합니다."
 SWI_import_rafale_fighters: "다소 라팔 입찰"
 SWI_import_rafale_fighters_desc: "프랑스의 다재다능한 전방위 전투기인 다소 라팔을 평가하며, 주권상의 이점과 상쇄 제안을 다른 후보와 견줍니다."
 SWI_german_manufacturing: "독일 산업 상쇄"
 SWI_german_manufacturing_desc: "독일이 주도하는 유로파이터 컨소시엄과 기술 이전 및 상쇄 작업을 협상하여 조달 프랑을 스위스 산업으로 돌려보냅니다."
 SWI_french_manufacturing: "프랑스 산업 상쇄"
 SWI_french_manufacturing_desc: "다소 및 탈레스와 상쇄 및 산업 참여 계약을 협상하여, 항공기 구매의 대가로 스위스의 작업 지분을 확보합니다."
 SWI_interception_practices: "F-35A 라이트닝 II 선정"
 SWI_interception_practices_desc: "센서 융합과 스텔스 성능이 평가에서 가장 앞섰던 록히드 마틴 F-35A를 최종 선정합니다. 5세대의 상황 인식은 스위스의 요격과 긴급 발진 대기를 탈바꿈시킵니다."
 SWI_multi_role_specialization: "다목적 통합"
 SWI_multi_role_specialization_desc: "F-35A를 방공 및 타격 임무 전반에 통합하고 AIM-120과 AIM-9X 미사일 및 정밀 탄약으로 무장시켜 하나의 유연한 기단을 구성합니다."
 SWI_air_sup_adaptation: "24시간 영공 감시"
 SWI_air_sup_adaptation_desc: "스위스 영공에서 연중무휴 긴급 발진 대기를 가동합니다. 공군이 2020년에 도달한 능력이며, 이제 신형 전투기 기단으로 유지합니다."
 SWI_acquire_transport_planes: "전술 공수"
 SWI_acquire_transport_planes_desc: "슈퍼 퓨마와 쿠거 기단 및 경량 고정익 항공기를 중심으로 공중 수송 능력을 확대하여 국내외로 병력과 구호물자를 이동시킵니다."
 SWI_airbase_expansion: "공군 기지 현대화"
 SWI_airbase_expansion_desc: "파이에른, 마이링겐, 엠멘의 주 작전 기지를 현대화하며, 제트기가 지하에서 공격을 견딜 수 있는 산악 동굴 대피소도 포함합니다."
 SWI_nasams_batteries: "패트리어트 지상 기반 방공"
 SWI_nasams_batteries_desc: "에어2030에 따라 패트리어트 장거리 지대공 체계를 조달하여 스위스에 고고도 및 원거리 위협에 대한 최초의 진정한 방어를 제공합니다."
 SWI_florako: "FLORAKO 공중 감시"
 SWI_florako_desc: "스위스 영공을 24시간 감시하며 전투기와 지상 기반 방공 모두에 표적을 지시하는 통합 레이더 및 지휘 네트워크인 FLORAKO 체계를 운용합니다."
 SWI_Grune_idea: "녹색 스위스"
 SWI_Grune_idea_desc: "더 깨끗하고, 더 공정하며, 더 자유로운 스위스를 위해 - 이익보다 사람과 지구를 앞에 두는 곳!"
 SWI_universal_education_bonus_desc: "스위스의 현대적 교육에 대한 투자는 재생 에너지와 지속 가능한 기술 분야의 연구를 촉진하여 더 깨끗한 미래를 위한 길을 열었습니다."
 SWI_environmental_reforms: "환경 개혁"
 SWI_environmental_reforms_desc: "포괄적인 환경 법률은 배출량을 줄이고, 천연자원을 보호하며, 경제를 지속 가능성 중심으로 전환하는 것을 목표로 합니다."
 SWI_limit_industry: "제한된 산업 개발"
 SWI_limit_industry_desc: "스위스의 환경을 보호하기 위해 산업 확장이 제한되며, 빠른 성장을 장기적인 생태적 안정과 맞바꿉니다."
 SWI_eco_tourism: "생태 관광"
 SWI_eco_tourism_desc: "친환경 여행을 장려하면 스위스의 원시 그대로의 경관을 보존하면서 농촌 지역에 새로운 활력을 불어넣을 수 있습니다."
 SWI_national_parks: "국립공원"
 SWI_national_parks_desc: "보호 구역을 확대하여 야생 동물을 보호하고 환경 선도국으로서 스위스의 국제적 이미지를 강화합니다."
 SWI_completely_green: "완전한 녹색 국가!"
 SWI_completely_green_desc: "끊임없는 개혁과 혁신을 통해 스위스는 완전한 생태적 지속 가능성을 달성하고, 전적으로 청정 에너지로 가동되는 국가가 됩니다."
 SWI_christian_values: "기독교 가치"
 SWI_christian_values_desc: "전통적인 기독교 원칙이 사회 정책을 이끌고 스위스 사회의 도덕적 기반을 강화합니다."
 SWI_banned_abortion: "낙태 금지"
 SWI_banned_abortion_desc: "엄격한 법률로 낙태를 금지하며, 이는 보수적 사회 윤리에 대한 국가의 새로운 헌신을 반영합니다."
 SWI_ndb: "스위스 NDB"
 SWI_ndb_desc: "스위스 NDB는 정보 작전을 강화하여 국가 안보를 지키고 불안정한 세계에서 중립을 수호합니다."
 SWI_traditionalist: "전통주의"
 SWI_traditionalist_desc: "전통주의 사상이 정책을 좌우하며, 현대의 사회적 흐름보다 신앙, 가족, 그리고 민족 유산을 강조합니다."
 SWI_army_fund: "육군 자금 지원"
 SWI_army_fund_desc: "국방비 증액은 스위스군의 준비 태세를 강화하고 기반시설을 현대화합니다."
 SWI_ngo_funding: "NGO 자금 지원"
 SWI_ngo_funding_desc: "정부 보조금은 인도주의 지원, 환경 보호, 시민권 분야에서 활동하는 NGO를 지원합니다."
 SWI_efficiency: "스위스식 효율성"
 SWI_efficiency_desc: "스위스식 효율성은 통치의 상징이 됩니다. 간소화된 관료제, 줄어든 낭비, 그리고 정밀한 관리가 그 모습입니다."
 SWI_fortress_switzerland: "요새 스위스"
 SWI_fortress_switzerland_desc: "대규모 요새와 현대적인 방어망은 어떠한 분쟁에서도 스위스가 난공불락으로 남도록 보장합니다."
 SWI_tax_code: "간소화된 세법"
 SWI_tax_code_desc: "간소화된 세제는 탈세를 줄이고 투자를 유치하며 균형 잡힌 경제를 뒷받침합니다."
 SWI_foreign: "외국 기업"
 SWI_foreign_desc: "외국 기업이 스위스에 투자하도록 장려하여, 국가의 통제권을 유지하면서 혁신과 일자리 창출을 촉진합니다."
 SWI_agriculture: "농업 지원금"
 SWI_agriculture_desc: "스위스는 현대적이고 지속 가능한 농업에 투자하여 지역 농민을 지원하고, 농촌 공동체를 보호하며, 미래 세대의 식량 안보를 보장합니다."
 SWI_fdp: "FDP"
 SWI_fdp_desc: "FDP는 자유 시장, 개인의 기업가 정신, 경제적 자유, 최소한의 국가 개입을 옹호하는 자유주의 정당입니다."
 SWI_police_reforms: "경찰 개혁"
 SWI_police_reforms_desc: "법 집행을 현대화하고, 효율성을 개선하며, 전국의 공공 안전을 강화합니다."
 SWI_financial_deregulation: "금융 규제 완화"
 SWI_financial_deregulation_desc: "은행 및 금융 규제를 완화하여 투자, 성장, 그리고 경제적 역동성을 촉진합니다."
 SWI_precision: "스위스 정밀 기술"
 SWI_precision_desc: "스위스 제조업의 우수성을 육성하고, 고품질 산업을 장려하며, 정밀함에 대한 국가의 명성을 유지합니다."
 SWI_fund_startups: "기술 스타트업"
 SWI_fund_startups_desc: "기술 스타트업에 자금과 지원을 제공하여 혁신을 이끌고 스위스의 경제적 미래를 확보합니다."
 SWI_direct_democracy: "직접 민주주의 개혁"
 SWI_direct_democracy_desc: "국민투표와 국민발안을 통해 시민 참여를 확대하여 민주적 절차를 강화합니다."
 SWI_progressive_tax: "누진세 개혁"
 SWI_progressive_tax_desc: "공공 서비스에 필요한 재원을 마련하고 경제적 균형을 보장하기 위해 공정한 누진세 제도를 시행합니다."
 SWI_pda: "노동당 (Partei der Arbeit)"
 SWI_pda_desc: "상당한 영향력을 얻은 스위스 노동당은 국가 경제 구조의 급진적 전환을 주장하며, 스위스의 중립을 사회주의 연대의 원동력으로 바꾸고자 합니다."
 SWI_nationalize_industries: "핵심 산업 국유화"
 SWI_nationalize_industries_desc: "연방 평의회는 핵심 산업 부문의 인수에 착수하여, 공평한 분배와 계획적 발전을 보장하기 위해 주요 자원과 생산을 국가 통제 아래 둡니다."
 SWI_socialist_countries_ties: "사회주의 국가들과의 유대"
 SWI_socialist_countries_ties_desc: "스위스는 사회주의 노선에 선 국가들과 더욱 긴밀한 외교적, 문화적, 정치적 유대를 적극적으로 모색하며, 오랜 중립 노선을 세계적 운동 쪽으로 전환할 준비를 합니다."
 SWI_socialist_agreements: "무역 협정"
 SWI_socialist_agreements_desc: "사회주의 국가들과 새로운 장기 무역 협정이 체결되어 핵심 원자재 확보와 스위스 정밀 제품의 시장 확대를 이룹니다."
 SWI_higher_wages_idea: "임금 인상"
 SWI_higher_wages_idea_desc: "최저임금의 의무적 인상과 임금 구조에 대한 연방 차원의 감독은 스위스 노동자가 공정하고 지속 가능한 생활 임금을 받도록 보장하며, 국내 소비를 촉진합니다."
 SWI_cheaper_house: "저렴한 주택"
 SWI_cheaper_house_desc: "임대료 상한제와 건설 보조금을 골자로 하는 연방 차원의 정책은 민간 주택 비용을 크게 낮추어 더 많은 국민이 내 집을 마련할 수 있도록 합니다."
 SWI_public_housing: "공공 주택"
 SWI_public_housing_desc: "양질의 공공 주택 사업에 대한 막대한 국가 투자는 현대적이고 저렴한 주거지를 제공하여 도시 과밀과 노동 계급의 주거 안정 문제를 해결합니다."
 SWI_challenged_elite: "은행 엘리트에 대한 도전"
 SWI_challenged_elite_desc: "비밀스럽고 막강한 은행 엘리트에 대한 직접적인 도전이 시작됩니다. 민간 자본 이동에 대한 과세와 탈세 조사를 포함한 새로운 규제가 도입되어 연방 재정을 다시 채웁니다."
 SWI_mind_federation: "연방의 정신"
 SWI_mind_federation_desc: "새로운 연방을 위한 통일된 비전이 수립되어, 정치 체제가 효율성, 협력, 그리고 새로운 영토와 주민의 신속한 통합에 집중하게 됩니다."
 SWI_growing_federation: "연방 강화"
 SWI_growing_federation_desc: "연방의 산업 및 행정 개혁이 하나의 조율된 계획으로 통합됩니다. 기반시설, 공장 생산, 연구 개발이 이제 하나의 연방 깃발 아래 함께 진행되며, 새로 편입된 모든 주(칸톤)를 표준화하고 정치적으로 일치시킵니다."
 SWI_modernize_direct: "현대화된 직접 민주주의"
 SWI_modernize_direct_desc: "직접 민주주의가 대대적으로 개편되고 현대화되어, 신기술과 간소화된 절차를 도입함으로써 신속한 시민 참여와 신속한 국가 의사 결정을 보장합니다."
 SWI_council_states: "주 평의회"
 SWI_council_states_desc: "주 평의회가 재편되어 새로 편입된 주와 기존의 모든 주에 더 크고 공정한 대표권을 부여하며, 인구와 지역 자치 사이에서 입법 권력의 균형을 맞춥니다."
 SWI_fiscal_equalization: "재정 균등화 기금"
 SWI_fiscal_equalization_desc: "가장 부유한 주에서 가장 가난한 주로 부를 재분배하기 위한 새로운 연방 기금이 설립되어, 연방 전체에 균일한 발전과 높은 생활 수준을 보장합니다."
 SWI_develop_federation: "연방 개발"
 SWI_develop_federation_desc: "경제적 잠재력과 정치적 안정을 극대화하기 위해, 알프스 연방 전역, 특히 새로 편입된 영토에서 장기적인 기반시설 및 개발 사업에 중점을 둡니다."
 switzerland.8.t: "알프스에 대한 스위스의 요청"
 switzerland.8.desc: "스위스는 역사적 유대와 공통된 알프스 문화를 내세우며 사부아, 프로방스, 니스를 즉시 자국의 통제 아래로 이양할 것을 요청합니다."
 switzerland.8.a: "주를 할양한다"
 switzerland.8.b: "거절한다"
 switzerland.9.t: "알프스 영유권 요구 수락"
 switzerland.9.desc: "프랑스가 뜻밖에도 우리의 요청에 동의하여 알프스 지역 전체를 할양했습니다. 위대한 외교적 승리입니다!"
 switzerland.9.a: "새롭고 더 강한 스위스!"
 switzerland.10.t: "알프스 영유권 요구 거절"
 switzerland.10.desc: "우리의 요청은 단호한 거절에 부딪혔습니다. 프랑스는 영토 보전에 관한 협상을 할 의사가 없습니다."
 switzerland.10.a: "외교적 노력은 실패했다."
 switzerland.11.t: "이탈리아 알프스 요청"
 switzerland.11.desc: "스위스 정부는 아오스타, 피에몬테, 롬바르디아, 남티롤을 스위스 연방에 할양할 것을 공식적으로 요청했습니다."
 switzerland.11.a: "지방을 할양한다"
 switzerland.11.b: "요청을 거절한다"
 switzerland.12.t: "이탈리아의 수락"
 switzerland.12.desc: "로마는 지역 평화를 바란다며 뜻밖에도 우리의 영토 요청에 동의했습니다. 알프스가 하나로 통합되었습니다!"
 switzerland.12.a: "통합된 알프스 공화국!"
 switzerland.13.t: "이탈리아의 거절"
 switzerland.13.desc: "이탈리아는 이 요청을 국가 주권에 대한 모욕으로 간주하며 우리의 요청을 강하게 거부했습니다."
 switzerland.13.a: "우리의 외교는 실패했다."
 switzerland.14.t: "오스트리아 티롤 요청"
 switzerland.14.desc: "알프스 중심부를 통합하려는 스위스는 티롤의 할양을 공식적으로 요청했습니다. 역사적으로 중요한 지역이지만, 이를 수락하면 장차 분쟁을 막을 수 있습니다."
 switzerland.14.a: "티롤을 스위스에 할양한다"
 switzerland.14.b: "스위스의 영유권 주장을 거부한다"
 switzerland.15.t: "티롤 획득"
 switzerland.15.desc: "빈(혹은 오스트리아의 현 점령 세력)이 우리의 요청에 동의하여 중요한 지역인 티롤이 연방에 편입되었습니다. 우리의 통일 노력은 성공적으로 계속됩니다."
 switzerland.15.a: "중대한 외교적 승리."
 switzerland.16.t: "티롤 거절"
 switzerland.16.desc: "티롤에 대한 우리의 외교적 요청은 단칼에 거절당했습니다. 해당 주의 현 소유자는 이 요구를 자국 국경에 대한 용납할 수 없는 도전으로 여깁니다."
 switzerland.16.a: "더 좋은 때를 기다려야 한다."
 switzerland_news.7.t: "알프스 연방"
 switzerland_news.7.d: "광범위한 외교적 책략과 지역 전역의 대중 운동 끝에, 스위스는 역사적인 알프스 중심부에 대한 통제권을 공식적으로 통합했습니다. 국가는 공식적으로 명칭을 '알프스의 연방' 혹은 줄여서 '알프스 연방'으로 변경했습니다.\n\n이 중대한 변화는 중부 유럽 산맥에 걸친 강력하고 통합된 연방 국가를 탄생시켜 지역의 세력 균형을 근본적으로 바꾸어 놓습니다. 새 정부는 포괄하게 된 모든 지역의 문화적, 정치적 자치를 보존하겠다고 약속했습니다."
 switzerland_news.7.a: "1516년 이래 중립을 재정의하다."
 switzerland_news.8.t: "새로운 공화국: 스위스, 권력 집중에 찬성 투표"
 switzerland_news.8.d: "근소한 차이로 스위스 국민은 연방 구조를 버리고 중앙집권 공화국으로 전환하는 헌법 국민투표를 승인했습니다. 신시대 운동이 주도한 이 변화는 간소화된 통치와 응집력 있는 국가 정체성을 약속하지만, 그 대가로 전통적인 칸톤 자치를 잃게 됩니다. 신생 스위스 공화국은 오늘 공식적으로 연방을 대체했으며, 옛 칸톤 전역에서 축하와 시위가 동시에 일어나고 있습니다. 국제 사회는 유럽에서 가장 안정적인 국가 중 하나에서 일어난 이 급진적 변화의 파장을 주시하고 있습니다."
 switzerland_news.8.a: "연방은 죽었다!"
 SWI_suisse_politique: "스위스 정치"
 SWI_suisse_politique_desc: "스위스 국가 중점 트리의 틀을 마련하고 연방의 초기 정치적 방향을 결정합니다."
 SWI_strengthening_the_federation: "연방 강화"
 SWI_strengthening_the_federation_desc: "칸톤 간의 유대를 강화하고 국가 통합을 보장하기 위해 중앙 정부의 권한을 강화합니다."
 SWI_dissolving_the_federation: "연방 해체"
 SWI_dissolving_the_federation_desc: "연방제는 지속 불가능합니다. 단일하고 통합된 스위스 공화국을 우선시하며 국가를 재편하는 논쟁적인 과정을 시작합니다."
 SWI_deepening_swiss_democracy: "스위스 민주주의 심화"
 SWI_deepening_swiss_democracy_desc: "직접 민주주의 수단의 범위를 넓혀, 국민투표와 발의를 통해 국민이 국가 정책을 결정할 더 큰 힘을 갖게 합니다."
 SWI_panalpine_initiative: "범알프스 구상"
 SWI_panalpine_initiative_desc: "더 적극적인 외교 정책과 지역적 역할을 받아들입니다. 이웃 국가들의 알프스 지역과 연대하거나 통합하는 방안을 모색합니다."
 SWI_partei_der_arbeit: "노동당"
 SWI_partei_der_arbeit_desc: "경제적 평등과 집단 소유를 목표로 하는 사회주의 의제를 실행하도록 좌익 노동자 정당에 힘을 실어 줍니다."
 SWI_sp: "사회민주당(SP)"
 SWI_sp_desc: "더 높은 사회 복지와 국제 협력을 향해 정치 체제를 개혁하려는 사회민주당의 노력을 지원합니다."
 SWI_grune: "녹색당(Grüne)"
 SWI_grune_desc: "포괄적인 환경 보호와 지속 가능한 발전 정책을 추진하도록 녹색당에 정치적 지원을 제공합니다."
 SWI_fdu: "연방민주연합(FDU)"
 SWI_fdu_desc: "보수적이고 복음주의적인 기독교 가치와 지역 자치를 옹호하는 연방민주연합에 더 큰 영향력을 부여합니다."
 SWI_svp: "스위스 국민당(SVP)"
 SWI_svp_desc: "엄격한 이민 통제, 재정 보수주의, 국가 주권을 추진하는 스위스 국민당을 지지합니다."
 SWI_the_mind_of_the_federation: "연방의 정신"
 SWI_the_mind_of_the_federation_desc: "통합된 국가 정체성을 함양하고 연방의 집단 의식을 강화합니다."
 SWI_proclaim_the_alp_federation: "알프스 연방 선포"
 SWI_proclaim_the_alp_federation_desc: "통합된 알프스 연방의 결성을 선언하여, 공유하는 모든 알프스 영토를 스위스가 이끄는 새롭고 강력한 단일체로 통합합니다."
 SWI_alp_federation_coring_tt: "순응도가 80% 이상인 알프스 연방 소유 주는 중핵 영토가 됩니다. 그 기준에 못 미치는 주는 대신 영유권을 얻습니다."
 SWI_strengthen_the_federation: "연방 강화"
 SWI_strengthen_the_federation_desc: "핵심 국가 사업과 기관에 투자하여 연방 정부가 내외부의 압력에 더 견고하고 탄력적이 되도록 합니다."
 SWI_modernize_direct_democracy: "직접 민주주의 현대화"
 SWI_modernize_direct_democracy_desc: "직접 민주주의의 청원 및 투표 절차를 간소화하여 이 제도가 현대에도 효율적이고 유효하도록 합니다."
 SWI_empower_the_council_of_states: "칸톤 의회 강화"
 SWI_empower_the_council_of_states_desc: "개별 칸톤의 이익과 주권을 더 잘 대변하도록 칸톤 의회의 입법 권한을 확대합니다."
 SWI_fiscal_equalization_fund: "재정 평준화 기금"
 SWI_fiscal_equalization_fund_desc: "연방의 부를 재분배하는 상설 기금을 설립하여 부유하든 가난하든 모든 칸톤 간의 재정적 균형과 안정을 보장합니다."
 SWI_social_equality: "사회적 평등"
 SWI_social_equality_desc: "경제적 격차를 줄이고 사회 정의를 증진하는 정책을 시행하며, 특히 소외된 공동체와 저소득 시민을 대상으로 합니다."
 SWI_workers_rights: "노동자의 권리"
 SWI_workers_rights_desc: "모든 스위스 노동자에게 공정한 임금, 안전한 근로 조건, 조직할 권리를 보장하는 포괄적인 법안을 통과시킵니다."
 SWI_workers_rights_idea: "노동자의 권리"
 SWI_workers_rights_idea_desc: "모든 스위스 노동자에게 공정한 임금, 안전한 근로 조건, 그리고 단결권을 보장하는 포괄적인 법안을 통과시킵니다."
 SWI_cheaper_housing: "저렴한 주택"
 SWI_cheaper_housing_desc: "주택 시장에 보조금을 지급하고 규제하여 전국의 모든 시민이 감당할 수 있는 주택을 이용할 수 있게 합니다."
 SWI_expand_public_housing: "공공 주택 확대"
 SWI_expand_public_housing_desc: "주요 도시 중심부에 새로운 고품질 공공 주택을 건설하는 대규모 연방 사업을 시작합니다."
 SWI_challenge_the_banking_elite: "은행 엘리트에 맞서기"
 SWI_challenge_the_banking_elite_desc: "강력하고 비밀스러운 국제 은행 부문을 겨냥한 엄격한 규제를 제정하고 새로운 세금을 도입합니다."
 SWI_nationalize_key_industries: "핵심 산업 국유화"
 SWI_nationalize_key_industries_desc: "에너지, 교통, 통신 같은 핵심 부문의 소유권을 민간에서 국가로 이전합니다."
 SWI_end_banking_secrecy: "은행 비밀주의 폐지"
 SWI_end_banking_secrecy_desc: "스위스 은행 비밀주의라는 오랜 전통을 폐지하고 금융 체계를 국제 투명성 기준에 맞춥니다."
 SWI_neutrality_pda: "중립(노동당 노선)"
 SWI_neutrality_pda_desc: "스위스 중립이라는 전통적 정책을 재확인하되, 대외 개입보다 국내 사회주의 개혁을 우선시합니다."
 SWI_strengthen_ties_with_socialist_countries: "사회주의 국가와의 유대 강화"
 SWI_strengthen_ties_with_socialist_countries_desc: "늘어나는 사회주의 및 공산주의 국가 블록과 더 긴밀한 외교적, 경제적 관계를 구축합니다."
 SWI_strengthen_domestic_independence: "국내 자립 강화"
 SWI_strengthen_domestic_independence_desc: "자원과 산업에서 자급자족을 장려하는 정책을 시행하여 스위스 경제를 세계 시장의 변동성으로부터 보호합니다."
 SWI_trade_agreements_with_socialist_states: "사회주의 국가와의 무역 협정"
 SWI_trade_agreements_with_socialist_states_desc: "스위스의 수출 시장을 다변화하기 위해 사회주의 및 비동맹 국가들과 독점적 무역 협약을 체결합니다."
 SWI_direct_democracy_reforms: "직접 민주주의 개혁"
 SWI_direct_democracy_reforms_desc: "기술적, 절차적 변화를 도입하여 민주적 절차를 더 유연하게 하고 시민의 요구에 더 잘 응답하도록 합니다."
 SWI_domestic_independence: "국내 독립"
 SWI_domestic_independence_desc: "스위스의 자율성과 주권을 극대화하는 데 집중하고 EU와 같은 더 큰 지역 블록의 간섭을 거부합니다."
 SWI_move_closer_to_the_eu: "EU에 가까워지기"
 SWI_move_closer_to_the_eu_desc: "스위스와 유럽 연합의 단일 시장 및 정치 구조와의 통합을 심화하기 위해 노력합니다."
 SWI_humanitarian_leadership: "인도주의 리더십"
 SWI_humanitarian_leadership_desc: "외교와 인도적 지출 확대를 통해 원조, 피난처, 국제법의 세계적 등대로서 스위스의 역할을 강화합니다."
 SWI_national_health_service: "국민 보건 서비스"
 SWI_national_health_service_desc: "전면 국가 재정으로 운영되는 국민 보건 서비스를 도입해 의료에 대한 보편적 접근을 보장하며 의료 체계를 새롭게 구상합니다."
 SWI_expand_labour_union_power: "노동조합 권한 확대"
 SWI_expand_labour_union_power_desc: "단체 교섭과 산업 정책에서 조직된 노동조합에 훨씬 더 큰 권한과 영향력을 부여하는 법안을 통과시킵니다."
 SWI_progressive_tax_reform: "누진세 개혁"
 SWI_progressive_tax_reform_desc: "사회 프로그램의 재원을 마련하기 위해 최고 소득자와 기업에 대한 세율을 대폭 인상하도록 세법을 전면 개편합니다."
 SWI_strengthen_parliamentary_socialism: "의회 사회주의 강화"
 SWI_strengthen_parliamentary_socialism_desc: "민주적 틀 안에서 사회민주주의 정치 기득 세력의 힘을 점진적으로 키워 나갑니다."
 SWI_welfare_state_of_the_future: "미래의 복지 국가"
 SWI_welfare_state_of_the_future_desc: "모든 시민에게 존엄한 기본 소득과 포괄적인 사회 보호를 보장하는 차세대 사회 보장 체계를 개척합니다."
 SWI_invest_in_green_infrastructure: "녹색 인프라 투자"
 SWI_invest_in_green_infrastructure_desc: "재생 에너지 전력망과 친환경 교통을 포함한 지속 가능한 공공 사업 건설에 상당한 국가 자금을 투입합니다."
 SWI_fund_ngos: "NGO 지원"
 SWI_fund_ngos_desc: "시민 사회를 강화하기 위해 환경 및 사회 비정부 기구에 상당한 연방 보조금과 지원을 제공합니다."
 SWI_geneva_climate_diplomatic_hub: "제네바를 기후 거점으로 강화"
 SWI_geneva_climate_diplomatic_hub_desc: "제네바의 국제적 위상을 활용하여 대규모 기후 정상회의와 외교 협상을 개최하고 스위스의 소프트 파워를 키웁니다."
 SWI_limit_industrial_expansion: "산업 확장 제한"
 SWI_limit_industrial_expansion_desc: "중공업의 확장을 늦추고 스위스 경관의 자연미를 보호하기 위해 유예 조치와 엄격한 용도 지역 법규를 제정합니다."
 SWI_protect_the_alps: "알프스 보호"
 SWI_protect_the_alps_desc: "알프스를 최대 생태 보호 구역으로 지정하여 대규모 개발이나 자원 채굴을 금지합니다."
 SWI_renewable_energy_research: "재생 에너지 연구"
 SWI_renewable_energy_research_desc: "완전한 국가 에너지 독립을 달성하기 위해 태양광, 수력, 지열 에너지의 과학적, 기술적 진보에 자금을 지원합니다."
 SWI_centralization: "권력 중앙집권화"
 SWI_centralization_desc: "신속하고 결단력 있는 국가적 행동을 위해 권력을 통합하여 칸톤에서 연방 정부로 권한을 이전합니다."
 SWI_strengthen_the_cantons: "칸톤 강화"
 SWI_strengthen_the_cantons_desc: "칸톤 정부의 자율성과 전통적 권한을 강화하여 연방주의의 정신을 보존합니다."
 SWI_close_the_borders: "국경 폐쇄"
 SWI_close_the_borders_desc: "이민을 통제하고 스위스의 국가 정체성과 노동 시장을 보호하기 위해 절대적인 국경 폐쇄 정책을 시행합니다."
 SWI_ban_abortion: "낙태 금지"
 SWI_ban_abortion_desc: "낙태를 전면 불법화하는 법안을 제정하여 국가의 법을 보수적 도덕 원칙에 맞춥니다."
 SWI_faith_welfare: "신앙 기반 복지"
 SWI_faith_welfare_desc: "사회 안전망을 민간 종교 및 자선 단체에 의존하도록 개편하여 국가의 관여를 줄입니다."
 SWI_stricter_immigration: "더 엄격한 이민법"
 SWI_stricter_immigration_desc: "점수제와 할당제를 도입하여 합법과 불법을 막론하고 국내로 들어오는 모든 형태의 이주를 대폭 제한합니다."
 SWI_maintain_armed_neutrality: "무장 중립 유지"
 SWI_maintain_armed_neutrality_desc: "강력하고 준비된 방위군을 보장하면서 군사적 비동맹이라는 오랜 전통을 지킵니다."
 SWI_distance_from_eu: "EU와 거리 두기"
 SWI_distance_from_eu_desc: "스위스의 경제 및 정치 정책을 유럽 연합의 영향과 규제에서 분리하는 과정을 시작합니다."
 SWI_fund_ndb: "NDB 예산 지원"
 SWI_fund_ndb_desc: "국내 안보, 방첩, 감시 능력을 개선하기 위해 국가정보국(NDB)의 예산을 늘립니다."
 SWI_stop_un_training: "UN 평화유지군 훈련 중단"
 SWI_stop_un_training_desc: "외국 UN 평화유지군을 훈련하는 논쟁적인 관행을 끝내고 순수한 방어적 군사 태세를 강조합니다."
 SWI_traditionalist_propaganda: "전통주의 선전"
 SWI_traditionalist_propaganda_desc: "국가가 후원하는 언론과 교육을 통해 보수적이고 전통적인 스위스 가치를 홍보하는 전국적 캠페인을 시작합니다."
 SWI_expand_army_fund: "군 기금 확대"
 SWI_expand_army_fund_desc: "오직 스위스군 예산 증액만을 위한 새로운 상설 연방 수입원을 확보합니다."
 SWI_promote_swiss_identity: "스위스 정체성 증진"
 SWI_promote_swiss_identity_desc: "문화 및 언어 기관에 보조금을 지급하여 스위스 애국심과 국가 소속감을 더 강하고 통일되게 길러 냅니다."
 SWI_skepticism_ngos: "NGO에 대한 회의론"
 SWI_skepticism_ngos_desc: "국가 주권에 대한 영향력을 우려하여 국내외 NGO의 활동을 조사하고 제한합니다."
 SWI_expand_agriculture: "농업 확대"
 SWI_expand_agriculture_desc: "현대적 영농 기술과 보조금에 투자하여 국내 식량 생산과 국가 자급률을 크게 높입니다."
 SWI_national_efficiency: "국가 효율"
 SWI_national_efficiency_desc: "모든 연방 기관에 걸쳐 관료 및 행정 개혁을 도입하여 낭비를 줄이고 정부의 속도와 효율성을 높입니다."
 SWI_isolationism: "고립주의"
 SWI_isolationism_desc: "완전한 세계적 분리 정책을 채택하여 국경과 시장을 닫고 스위스 문제에 대한 모든 외국의 간섭을 제거합니다."
 SWI_armed_neutrality_desc: "방어 전용 외교 정책을 공식적으로 성문화하여, 군이 어떤 대가를 치르더라도 국가의 독립을 지킬 수 있도록 충분히 무장하게 합니다."
 SWI_defend_secrecy: "은행 비밀주의 수호"
 SWI_defend_secrecy_desc: "국가의 민간 은행 비밀 보호법을 해체하라는 모든 국제적 압력에 강력히 반대합니다."
 SWI_attract_foreign_investors: "외국인 투자자 유치"
 SWI_attract_foreign_investors_desc: "국제 기업이 스위스로 이전하도록 새로운 인센티브, 세금 감면, 규제 보증을 제공합니다."
 SWI_market_liberalization: "시장 자유화"
 SWI_market_liberalization_desc: "자유 경쟁, 혁신, 경제 성장을 촉진하기 위해 국내 시장과 산업을 규제 완화합니다."
 SWI_keep_swiss_neutrality: "스위스 중립 유지"
 SWI_keep_swiss_neutrality_desc: "정치적 얽힘보다 금융 안정을 우선시하며 불간섭주의에 대한 전통적이고 엄격한 해석을 유지합니다."
 SWI_modernize_neutrality: "중립 현대화"
 SWI_modernize_neutrality_desc: "중립의 개념을 현대적 맥락에 맞게 조정하여 더 폭넓은 외교적 관여와 해외 인도적 개입을 허용합니다."
 SWI_reduce_welfare: "복지 지출 삭감"
 SWI_reduce_welfare_desc: "국가 부채를 줄이고 민간 저축을 장려하기 위해 사회 프로그램과 급여에 대한 연방 지출을 삭감합니다."
 SWI_moderate_police_reforms: "온건한 경찰 개혁"
 SWI_moderate_police_reforms_desc: "경찰 예산을 늘리고 장비를 현대화하며 지역 사회와의 관계를 개선하기 위해 점진적인 변화를 시행합니다."
 SWI_industrial_development: "산업 개발"
 SWI_industrial_development_desc: "국가 제조업 부문의 확대와 전략 지역의 신규 산업 단지 건설에 집중적으로 투자합니다."
 SWI_swiss_precision: "스위스 정밀 공학"
 SWI_swiss_precision_desc: "국가 연구와 투자를 첨단 제조업, 시계 제작, 특수 기계 공학에 집중합니다."
 SWI_tech_startups: "기술 스타트업 육성"
 SWI_tech_startups_desc: "자금 지원, 세금 감면, 인큐베이션 프로그램으로 이루어진 우호적인 생태계를 조성하여 호황을 누리는 국내 기술 부문을 육성합니다."
 SWI_free_trade: "자유 무역"
 SWI_free_trade_desc: "관세를 철폐하고 무역 장벽을 낮추어 스위스 경제를 세계화된 무역 체제에 완전히 통합합니다."
 SWI_radical_changes: "급진적 변화"
 SWI_radical_changes_desc: "정치 체제에 대한 국가적 재평가로, 연방의 혁명적이고 근본적인 변화로 가는 길을 닦습니다."
 SWI_promote_left: "좌익 정치 증진"
 SWI_promote_left_desc: "연방 전역에서 공산주의 및 사회주의 이념의 인기와 영향력을 크게 높이기 위한 캠페인을 시작합니다."
 SWI_workers_council: "노동자 평의회의 집권"
 SWI_workers_council_desc: "노동자 평의회를 국가의 최고 경제 및 정치 기관으로 공식 수립하여 프롤레타리아트에게 직접적인 권력을 부여합니다."
 SWI_nationalize_banks: "은행 국유화"
 SWI_nationalize_banks_desc: "국가의 강력하고 비밀스러운 은행 부문을 장악하여 인민의 이익을 위해 연방 공공 소유 아래 둡니다."
 SWI_agricultural_collectivization: "농업 집단화"
 SWI_agricultural_collectivization_desc: "사유 토지 소유를 폐지하고 모든 농장을 대규모 국영 집단 농업 기업으로 조직합니다."
 SWI_workers_cooperatives: "노동자 협동조합"
 SWI_workers_cooperatives_desc: "분산된 경제 통제를 유지하면서 노동자가 소유하고 운영하는 협동조합의 결성을 지배적인 생산 모델로 지원합니다."
 SWI_militias_of_the_people: "인민 민병대"
 SWI_militias_of_the_people_desc: "상비군을 해체하고 노동 계급에서 선발한 정치적으로 신뢰할 수 있는 무장 인민 민병대의 분산형 네트워크로 대체합니다."
 SWI_secret_police: "비밀경찰"
 SWI_secret_police_desc: "반혁명 활동을 감시하고 내부의 반대를 억누르기 위해 강력하고 편재하는 비밀경찰 조직을 창설합니다."
 SWI_denounce_eu: "EU 규탄"
 SWI_denounce_eu_desc: "유럽 연합을 부르주아 조직으로 공식 규탄하고 스위스의 모든 협력과 정치적 유대를 철회합니다."
 SWI_suppress_party_enemies: "당의 적 탄압"
 SWI_suppress_party_enemies_desc: "국가의 모든 힘을 동원하여 경쟁하는 모든 정당과 조직을 제거하고 침묵시킵니다."
 SWI_multilingual_worker_solidarity: "다언어 노동자 연대"
 SWI_multilingual_worker_solidarity_desc: "국가의 언어적 분열을 가로지르는 공통의 계급 정체성을 강조하여 통합된 다언어 프롤레타리아트를 형성합니다."
 SWI_peoples_tribune: "인민 호민관"
 SWI_peoples_tribune_desc: "중앙 정부의 권력에 대한 대중적 견제 역할을 하는 선출 대표인 인민 호민관 직을 신설합니다."
 SWI_central_committee: "중앙위원회 통치"
 SWI_central_committee_desc: "최종적인 정치 권한을 당의 소규모 강력한 중앙위원회에 부여하여 이념적 순수성과 중앙집권적 명령 체계를 보장합니다."
 SWI_peoples_constitution: "인민 헌법"
 SWI_peoples_constitution_desc: "노동 계급의 권리를 명시하고 국가의 사회주의 구조를 공식화하는 새 헌법을 기초하고 제정합니다."
 SWI_national_charter: "국가 헌장"
 SWI_national_charter_desc: "옛 헌법을 대체할 국가 헌장을 작성하여 새 국가가 민족주의적이고 권위주의적인 원칙을 따를 것임을 공식 선언합니다."
 SWI_propaganda_machine: "선전 기구"
 SWI_propaganda_machine_desc: "정보의 흐름을 통제하고 시민의 이념적 순응을 보장하기 위해 정교한 국영 언론 기구를 구축합니다."
 SWI_economic_self_sufficiency: "경제적 자급자족"
 SWI_economic_self_sufficiency_desc: "스위스 경제 전체를 자급자족 체제로 전환하여 국내 생산을 우선시하고 해외 무역에 대한 의존을 없앱니다."
 SWI_expel_foreign_companies: "외국 기업 추방"
 SWI_expel_foreign_companies_desc: "스위스 땅에서 운영되는 모든 외국인 소유 기업의 즉각적인 폐쇄와 국유화를 강제합니다."
 SWI_revive_the_nf: "민족전선 부활"
 SWI_revive_the_nf_desc: "역사적인 민족전선을 재건하고 지도자들에게 급진적이고 민족주의적이며 권위주의적인 정치 강령을 옹호할 힘을 실어 줍니다."
 SWI_fascism_idea: "국민전선"
 SWI_fascism_idea_desc: "국민전선은 1930년대에 번성했던 스위스의 극우 정당이었습니다. 『스위스 역사 사전』에 따르면 전성기에는 당원이 9,000명에 달했으며, 시몬 비젠탈 센터에 따르면 약 25,000명에 이르렀을 수도 있습니다. 이 정당은 제국 선전부의 자금 지원을 받았습니다. 1940년에 사실상 해체되었고, 1943년 스위스 연방 평의회에 의해 금지되었습니다."
 SWI_national_unity: "국민 통합"
 SWI_national_unity_desc: "모든 내부 분열과 이념 갈등을 억눌러 새 정권 아래 하나로 통합된 국가 의지를 형성합니다."
 SWI_leader_of_a_nation: "국가의 지도자"
 SWI_leader_of_a_nation_desc: "카리스마 있는 국가 인물에게 광범위한 새 권한을 부여하여 국가를 강력하고 인격화된 지도 체제로 전환합니다."
 SWI_militarize_society: "사회의 군사화"
 SWI_militarize_society_desc: "군사 원칙을 민간 생활에 통합하여 의무 복무를 시행하고 국가 전반에 규율과 복종을 장려합니다."
 SWI_fascist_propaganda: "파시스트 선전"
 SWI_fascist_propaganda_desc: "정권의 이념을 홍보하고 국가의 적으로 간주되는 모든 대상을 악마화하기 위한 공세적인 전국 언론 캠페인을 시작합니다."
 SWI_censorship: "검열"
 SWI_censorship_desc: "절대적인 이념적 순응을 보장하기 위해 모든 형태의 언론, 예술, 지적 산출물을 전면 통제합니다."
 SWI_pan_alpine_identity: "범알프스 정체성"
 SWI_pan_alpine_identity_desc: "스위스와 그 이웃 국가들에 걸쳐 공통의 '알프스 민족'이 존재한다고 선언하여 팽창을 위한 이념적 기반을 마련합니다."
 SWI_ban_radical_neutrals: "급진 중립주의자 금지"
 SWI_ban_radical_neutrals_desc: "절대적이고 수동적인 중립을 옹호하는 모든 정치 단체를 불법화하고 이들을 애국심이 없고 국가에 위험한 존재로 낙인찍습니다."
 SWI_german_superiority: "독일계 우월"
 SWI_german_superiority_desc: "독일어권 주민을 우선시하고 독일과의 문화적, 언어적 일치 정책을 채택합니다."
 SWI_swiss_identity: "스위스 정체성"
 SWI_swiss_identity_desc: "모든 인접 강대국과 구별되는 독특하고 다민족적이며 맹렬히 독립적인 스위스 정체성을 옹호합니다."
 SWI_alpine_destiny: "알프스의 운명"
 SWI_alpine_destiny_desc: "모든 알프스 영토를 스위스 깃발 아래 통일할 것을 요구하고 다가오는 통일 전쟁에 대비해 군을 준비시킵니다."
 SWI_one_party_state: "일당 국가"
 SWI_one_party_state_desc: "남아 있는 모든 민주적 제도를 폐지하고 집권당의 완전하고 영구적인 정치적 독점을 공식화합니다."
 SWI_further_strengthen_the_federation: "연방 추가 강화"
 SWI_further_strengthen_the_federation_desc: "스위스는 칸톤, 문화, 언어 사이의 타협 위에 세워진 국가입니다. 연방 구조를 더욱 강화함으로써 더 큰 안정을 보장하고 칸톤 간 조율을 개선하며, 내부의 긴장과 외부의 위협 모두에 맞서 연방의 단합을 강화할 수 있습니다."
 SWI_higher_wages: "임금 인상"
 SWI_higher_wages_desc: "치솟는 생활비와 커지는 경제적 요구에는 조치가 필요합니다. 핵심 부문 전반의 임금 인상을 장려함으로써 생활 수준을 개선하고 국내 소비를 강화하며 장기적인 사회 안정을 보장할 수 있습니다."
 SWI_universal_education: "보편 교육"
 SWI_universal_education_desc: "교육은 강하고 번영하는 국가의 토대입니다. 보편적인 학교 교육 접근권을 제공함으로써 모든 시민이 스위스의 미래에 기여하는 데 필요한 기술과 지식을 갖추도록 보장할 수 있습니다."
 SWI_fund_ngo: "NGO 지원"
 SWI_fund_ngo_desc: "비정부 기구는 지역 사회를 지원하고 사회적 과제를 해결하는 데 중요한 역할을 합니다. 국가 재정을 지원함으로써 이들이 대중에게 봉사하고 정부의 노력을 보완하는 역량을 높일 수 있습니다."
 SWI_ban_neutrals: "중립 금지"
 SWI_ban_neutrals_desc: "스위스는 커져 가는 위협과 세계적 불안정 앞에서 중립을 유지할 여유가 없습니다. 중립을 금지함으로써 우리는 국제 문제에서 국가의 적극적인 역할을 천명하고 해외에서 우리의 이익을 수호할 준비를 합니다."
 SWI_militarized_society: "군사화된 사회"
 SWI_militarized_society_desc: "강한 국가에는 강한 시민이 필요합니다. 군사화된 사회를 받아들임으로써 우리는 규율, 대비 태세, 그리고 스위스 방위에 대한 공동의 책임감을 심어 줍니다."
 SWI_secret_agency: "비밀 기관"
 SWI_secret_agency_desc: "정보는 국가 안보의 근간입니다. 비밀 기관을 설립함으로써 스위스는 위협을 감시하고 중요한 정보를 수집하며 위험이 국경에 닿기 전에 단호하게 행동할 수 있습니다."
 SWI_swiss_companies_only: "스위스 기업 전용"
 SWI_swiss_companies_only_desc: "경제를 강화하고 국내 이익을 보호하기 위해 특정 부문에서는 스위스 기업만 영업할 수 있도록 허용합니다. 이는 시민을 위한 일자리를 보장하고 산업을 국가의 통제 아래 둡니다."
 SWI_self_sufficiency: "자급자족"
 SWI_self_sufficiency_desc: "스위스는 해외 수입에 대한 의존을 줄이고 필수 자원을 국내에서 생산하도록 해야 합니다. 자급자족을 장려함으로써 우리는 경제를 보호하고 국가의 회복력을 강화합니다."
 SWI_workers: "노동자들"
 SWI_workers_desc: "국가는 노동력만큼만 강합니다. 노동자를 위한 정책을 시행함으로써 공정한 임금, 개선된 근로 조건, 그리고 더 만족하고 생산적인 국민을 보장합니다."
 SWI_communism_idea: "공산주의"
 SWI_communism_idea_desc: "사회주의 원칙에서 영감을 얻은 스위스 공산주의는 생산 수단을 인민의 통제 아래 두고자 합니다. 우리는 경제를 재편하여 불평등을 줄이고 모든 시민이 국가의 부를 함께 누리도록 보장하고자 합니다."
 SWI_new_age: "새 시대"
 SWI_new_age_desc: "옛 연방은 그 수명을 다했습니다. 연방제를 해체하고 통합 공화국을 수립함으로써 스위스는 권력을 집중하고 국가의 미래를 재정의하는 새로운 통치의 시대에 들어섭니다."
 SWI_agricultural_collectivization_idea: "농업 집단화"
 SWI_agricultural_collectivization_idea_desc: "국민을 먹여 살리고 농촌을 현대화하려면 농장을 집단 단위로 조직해야 합니다. 농업 집단화는 효율성을 높이고, 자원 배분을 개선하며, 식량 생산에 대한 국가 통제를 강화할 것입니다."
 SWI_censor: "검열"
 SWI_censor_desc: "사회 질서를 유지하고 국가 안정을 보호하려면 정보를 면밀히 감시해야 합니다. 검열을 시행하면 해로운 이념과 불안을 조장하는 선전이 스위스를 위협하지 못하도록 막을 수 있습니다."
 SWI_central_committee_idea: "중앙위원회"
 SWI_central_committee_idea_desc: "강력한 국가에는 결단력 있는 지도력이 필요합니다. 중앙위원회의 설립은 권력을 공고히 하고, 전국의 정책을 조율하며, 당의 비전이 효과적으로 실행되도록 보장합니다."
 SWI_politica_estera_svizzera: "스위스 외교 정책"
 SWI_politica_estera_svizzera_desc: "스위스의 외교 정책은 언제나 중립이었습니다. 그 길에서 벗어난다면 여러 분야에서 우위를 얻을 수도 있습니다."
 SWI_choosing_our_path: "우리의 길 선택"
 SWI_choosing_our_path_desc: "이제 우리는 외교 정책을 어떻게 할지 결정해야 합니다. 일부는 중립을 선호하지만, 나토와 EU에 문을 열자는 움직임도 있습니다."
 SWI_opening_up: "개방"
 SWI_opening_up_desc: "우리는 중립 정책에서 벗어나기로 결정했습니다."
 SWI_neutral_foreign_policy: "중립 외교 정책"
 SWI_neutral_foreign_policy_desc: "우리는 중립을 받아들이기로 결정했습니다. 잘 작동하는 것을 왜 바꾸겠습니까?"
 switzerland.17.t: "우리의 길 선택"
 switzerland.17.desc: "이제 변화할 것인지 그대로 남을 것인지 결정할 때입니다. 변화하든 그대로 남든, 어느 쪽이든 이점이 있을 것입니다."
 switzerland.17.a: "세계를 향해 문을 열어야 한다!"
 switzerland.17.b: "잘 돌아가는 것을 왜 바꾸는가?"
 SWI_digitalisation: "디지털 스위스"
 SWI_digitalisation_desc: "연방 평의회의 디지털 스위스 전략은 연방에 전국 광케이블 보급과 종이 없는 행정을 약속합니다. 네트워크를 현대화하면 스위스 기업의 경쟁력이 유지되고 시민은 국가와의 업무를 온라인으로 처리할 수 있습니다."
 SWI_sustainability: "에너지 전략 2050"
 SWI_sustainability_desc: "국민투표로 승인된 에너지 전략 2050은 원자력을 단계적으로 폐지하고 수력, 태양광, 대규모 전력망 저장 시설로 대체합니다. 배터리 단지는 알프스 재생 에너지 출력을 평탄하게 하고 경제 성장이 환경을 앞지르지 않도록 합니다."
 SWI_microchip_research: "반도체 연구"
 SWI_microchip_research_desc: "스위스의 정밀성은 이미 u-blox 위치 측정 모듈, CSEM의 마이크로일렉트로닉스 연구소, 제네바에 있는 ST의 설계 작업의 밑바탕이 되고 있습니다. 로잔 연방공대와 취리히 연방공대를 반도체 설계로 이끌면 세계가 없이는 돌아갈 수 없는 산업의 한 몫을 차지할 수 있습니다."
 SWI_microchip_plant: "국내 파운드리"
 SWI_microchip_plant_desc: "설계가 검증되었으니 이제 착공할 때입니다. 국내 파운드리는 스위스의 설계도를 스위스의 실리콘으로 바꾸고 우리 산업을 해외 공급 충격으로부터 보호합니다."
 SWI_defending_swiss_independence: "스위스 독립 수호"
 SWI_defending_swiss_independence_desc: "중립을 유지하려면 독립을 유지해야 합니다. 그러기 위해서는 먼저 우리를 다른 편에 묶어 두려고 주변을 맴도는 외국의 영향력에 대응해야 합니다."
 SWI_effort_to_better_relations: "관계 개선 노력"
 SWI_effort_to_better_relations_desc: "너무 오랫동안 우리는 중립이라는 카드를 써 왔습니다. 이제 너무 오래 소홀히 해 온 이웃 국가들과의 관계를 개선해야 합니다."
 SWI_swiss_mercenaries: "스위스 용병"
 SWI_swiss_mercenaries_desc: "우리는 자체 용병 부대를 창설해야 합니다. 산에서 싸울 줄 아는 이들이 있다면 바로 우리 국민입니다. 우리는 이를 이익을 위해 활용해야 합니다."
 SWI_swiss_peacekeeping: "스위스 평화 유지"
 SWI_swiss_peacekeeping_desc: "이 불안정한 세계에서 UN은 평화유지군을 필요로 합니다. 스위스가 응답해야 합니다."
 SWI_enforcing_the_uns_will: "UN의 의지 집행"
 SWI_enforcing_the_uns_will_desc: "스위스 파견대가 감시에서 집행으로 전환하여, 베른의 지휘를 받는 병력으로 안전보장이사회의 위임을 뒷받침합니다."
 SWI_befriend_the_eu: "EU와의 친교"
 SWI_befriend_the_eu_desc: "이제 선택해야 합니다. 완전한 중립의 길을 계속 갈 것인지, 아니면 EU와 친교를 맺을 것인지."
 SWI_nato: "나토?"
 SWI_nato_desc: "가입은 수 세기에 걸친 공식 중립을 끝낼 것입니다. 연방 평의회는 안전 보장이 그 대가를 치를 만한 가치가 있는지 결정해야 합니다."
 SWI_expand_the_mercenaries: "용병 확대"
 SWI_expand_the_mercenaries_desc: "우리 용병이 세계적으로 어느 정도 명성을 얻고 있는 듯합니다. 이를 이어 가며 확대합시다!"
 SWI_foreign_investments: "외국인 투자"
 SWI_foreign_investments_desc: "우리는 다른 서방 국가들과 새로 맺은 연대를 활용해야 합니다. 두루 다니며 투자를 요청하고, 우리도 일부를 되돌려 줄 수 있습니다."
 SWI_local_arms_production: "국내 무기 생산"
 SWI_local_arms_production_desc: "우리는 중립의 길을 계속 가야 하며, 무기 거래는 일종의 연대로 비칠 수 있습니다. 그래서 우리는 스스로 무기를 생산해야 합니다."
 SWI_internal_investments: "내부 투자"
 SWI_internal_investments_desc: "우리 자신에게 우리 돈을 쓰는 내부 투자를 통해 스스로를 발전시켜야 합니다."
 SWI_integration_to_nato: "나토 통합"
 SWI_integration_to_nato_desc: "나토에 가입했으니 이제 신구 무기 체계를 나토 표준에 맞게 통합하기 시작해야 합니다."
 SWI_integration_to_nato_tt: "다른 모든 §Y나토 회원국§!의 스위스에 대한 관계가 §G+25§! 증가합니다"
 SWI_alignment_to_NATO: "나토 연대"
 SWI_alone_is_safer: "홀로 있는 편이 안전하다"
 SWI_alone_is_safer_desc: "우리는 서방에 문을 열었지만, 실제로 나토에 가입하는 것은 상당한 비약입니다. 그 문제에서는 독립을 지켜야 합니다."
 SWI_expanded_trade: "무역 확대"
 SWI_expanded_trade_desc: "EU의 호감을 얻고 어쩌면 훗날 EU에 가입할 용기를 낼 수 있도록 무역을 확대해야 합니다."
 SWI_partner_like_everyone: "모두와 같은 파트너"
 SWI_partner_like_everyone_desc: "무역을 EU에 더 맞추는 것에서 얻을 이득은 크지 않다고 봅니다. 따라서 EU와의 관계는 다른 어느 나라와의 관계와 같은 수준으로 유지해야 합니다."
 SWI_bank_of_the_west: "서방의 은행"
 SWI_bank_of_the_west_desc: "우리에게는 우리 이익을 위해 활용할 수 있는 거대한 은행 산업이 있습니다. 다만 이를 주로 서방에 제공해야 합니다."
 SWI_idea_environmental_reforms: "환경 개혁"
 SWI_idea_environmental_reforms_desc: "포괄적인 환경 법률은 배출량을 줄이고, 천연자원을 보호하며, 경제를 지속 가능성 중심으로 전환하는 것을 목표로 합니다."
 SWI_idea_eco_tourism: "생태 관광"
 SWI_idea_eco_tourism_desc: "친환경 여행을 장려하면 스위스의 원시 그대로의 경관을 보존하면서 농촌 지역에 새로운 활력을 불어넣을 수 있습니다."
 SWI_idea_national_parks: "국립공원"
 SWI_idea_national_parks_desc: "보호 구역을 확대하여 야생 동물을 보호하고 환경 선도국으로서 스위스의 국제적 이미지를 강화합니다."
 SWI_idea_completely_green: "완전한 녹색 국가!"
 SWI_idea_completely_green_desc: "끊임없는 개혁과 혁신을 통해 스위스는 완전한 생태적 지속 가능성을 달성하고, 전적으로 청정 에너지로 가동되는 국가가 됩니다."
 SWI_idea_christian_values: "기독교 가치"
 SWI_idea_christian_values_desc: "전통적인 기독교 원칙이 사회 정책을 이끌고 스위스 사회의 도덕적 기반을 강화합니다."
 SWI_idea_fortress_switzerland: "요새 스위스"
 SWI_idea_fortress_switzerland_desc: "대규모 요새와 현대적인 방어망은 어떠한 분쟁에서도 스위스가 난공불락으로 남도록 보장합니다."
 SWI_idea_tax_code: "간소화된 세법"
 SWI_idea_tax_code_desc: "간소화된 세제는 탈세를 줄이고 투자를 유치하며 균형 잡힌 경제를 뒷받침합니다."
 SWI_idea_fdp: "자유민주당 (FDP)"
 SWI_idea_fdp_desc: "FDP는 자유 시장, 개인의 기업가 정신, 경제적 자유, 그리고 국가 개입의 최소화를 옹호하는 자유주의 정당입니다."
 SWI_idea_financial_deregulation: "금융 규제 완화"
 SWI_idea_financial_deregulation_desc: "은행 및 금융 규제의 완화는 투자, 성장, 그리고 경제적 역동성을 촉진합니다."
 SWI_idea_sp: "사회민주당 (SP)"
 SWI_idea_sp_desc: "사회민주당은 정치 체제를 더 큰 사회 복지와 국제 협력의 방향으로 이끕니다."
 SWI_idea_fdu: "연방민주연합 (FDU)"
 SWI_idea_fdu_desc: "연방민주연합은 보수적이고 복음주의적인 기독교 가치와 지방 자치를 옹호합니다."
 SWI_idea_svp: "스위스 국민당 (SVP)"
 SWI_idea_svp_desc: "스위스 국민당은 엄격한 이민 통제, 재정 보수주의, 그리고 국가 주권을 강력히 주장합니다."
 SWI_idea_defend_secrecy: "은행 비밀주의"
 SWI_idea_defend_secrecy_desc: "민간 은행의 비밀 보장을 해체하라는 모든 국제적 압력이 거부됩니다. 고객 기밀 유지는 여전히 이 나라의 법입니다."
