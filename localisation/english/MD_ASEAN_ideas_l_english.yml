l_english:

 ASEAN_Member_drifting: "A Distant Chair"
 ASEAN_Member_drifting_desc: "We are technically at the table. Something in our current course of action is at odds with the bloc's founding principles, and every other capital knows it. The seat remains ours. The credibility is being spent."

 ASEAN_Member_detached: "The Empty Chair"
 ASEAN_Member_detached_desc: "We hold a chair we do not fill. Our government's path has taken us out of the room in every meaningful sense. The shared modifier is gone; the vote weight is gone. So, however, is our ability to block. The others are learning that this is convenient for them."

 ASEAN_Member_estranged: "One Foot Out"
 ASEAN_Member_estranged_desc: "We are members in name only. The others no longer expect us to attend; the exit decision is on the table; the door has been quietly propped open for our departure. The Charter cannot expel us. We have to walk ourselves."

 ASEAN_suspended: "Suspended from the Summits"
 ASEAN_suspended_desc: "The bloc has voted to bar our government from summits and ministerial meetings. Our seat remains in the hall; our flag remains on the pole; our foreign ministry remains uninvited. The Charter has no provision for expulsion. The summit found one for suspension anyway."

 ASEAN_secretariat_hq: "The Secretariat in Jakarta"
 ASEAN_secretariat_hq_desc: "The bloc's Secretariat sits here. The staff is seconded from every capital; the drafting is done in the office next to ours; the meeting rooms fill weekly. The institution is quiet, and hosting it is a form of leverage that does not have to be exercised to be felt."

 ASEAN_chair_this_year: "In the Chair"
 ASEAN_chair_this_year_desc: "The chairmanship rotates to us for the year. The agenda is ours to set within the limits the Secretariat and the other members will tolerate. Small members have used their years to unusual effect. Others have used theirs to no effect at all. Which of those we do is being decided now."

 ASEAN_currency_swap_net: "The Chiang Mai Line"
 ASEAN_currency_swap_net_desc: "Our line of credit against the common pool. The rate is better than the Fund would have offered; the surveillance is less intrusive; the paperwork is drawn from a template every finance ministry in the region shares. The next crisis will find us readier for it."

 ASEAN_aicur_body: "AICHR Ratified"
 ASEAN_aicur_body_desc: "We have ratified the strengthened Commission. Its mandate covers our conduct as it covers every other member's. The awkward conversations we voted for will now be had, and the record of them will be public."

 ASEAN_reforms_modifier: "ASEAN Integration"
 ASEAN_reforms_modifier_desc: "The accumulated benefit of the bloc's work so far. The trade agreements ratified, the safety net drawn upon, the diplomatic weight of centrality. A status idea, not a persuasive one. It is what we have because of the members we still stand with."
