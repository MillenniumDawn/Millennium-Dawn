 SUB_smallish_taxes: "연방 예산 세금"
 SUB_smallish_taxes_desc: "연방 구성 주체로서 우리는 연방 예산에 세금을 납부할 의무가 있습니다."
 subject_rus.119.t: "연방화 문제: [KUB.GetNameWithFlag]"
 subject_rus.119.d: "우리는 종속국 한 곳에 특별한 주의를 기울여 어떻게 처리할지 결정하기로 했습니다. 자치를 부여할 것입니까, 아니면 어떠한 자치 지위도 영구히 박탈할 것입니까?"
