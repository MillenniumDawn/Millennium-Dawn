 heavy_frigate: "Тяжёлый фрегат"
 GRAND_DOCTRINE_LOCAL_AIRSPACE_DEFENCE_DESC: "Эта общая доктрина строит структуру военно-воздушных сил вокруг защиты и контроля национального и регионального воздушного пространства. Концепции местной защиты воздушного пространства делают упор на скоординированное наблюдение и реагирование в пределах определённых воздушных зон."
 GRAND_DOCTRINE_AIR_BATTLEFIELD_SUPPORT_DESC: "Эта общая доктрина структурирует воздушные операции таким образом, чтобы они напрямую поддерживали сухопутные и военно-морские силы в зонах активных боевых действий. Концепции обеспечения боевых действий подчёркивают интеграцию военно-воздушных сил в совместное оперативное планирование."
 GRAND_DOCTRINE_AIR_SUPREMACY_DESC: "Эта грандиозная доктрина организует военно-воздушные силы для установления и поддержания контроля над воздушным пространством. Концепция превосходства в воздухе делает упор на скоординированные воздушные операции для обеспечения свободы действий во всех оперативных районах."
 GRAND_DOCTRINE_MIXED_ROLE_DESC: "Эта общая доктрина структурирует военно-воздушные силы таким образом, чтобы сбалансировать множество оперативных задач в рамках единой системы. Концепция смешанных ролей подчёркивает гибкость применения военно-воздушных сил в различных задачах."
 GRAND_DOCTRINE_EQUIPMENT_LIGHT_DESC: "Эта общая доктрина организует силы вокруг лёгких и упрощённых комплектов техники. Концепция лёгкой техники делает акцент на простоте развёртывания и адаптируемости к различным оперативным условиям."
 GRAND_DOCTRINE_EQUIPMENT_HEAVY_DESC: "Эта масштабная доктрина строит вооружённые силы вокруг систем высокозащищённой и высокоэффективной техники. Концепция тяжёлой техники делает упор на постоянное присутствие и высокую боеспособность в составе формирований."
 GRAND_DOCTRINE_EQUIPMENT_MOBILE_DESC: "Эта общая доктрина организует оснащение войск для обеспечения высокой оперативной мобильности и быстрого манёвра. Концепция мобильного вооружения делает акцент на перемещении, передислокации и дальности оперативного действия."
 GRAND_DOCTRINE_EQUIPMENT_FIRES_DESC: "Эта общая доктрина строит разработку техники вокруг систем, предназначенных для обеспечения непрямого и поддерживающего огневого воздействия. Концепции техники огневой поддержки делают упор на скоординированное применение боевой мощи на всей территории поля боя."
 GRAND_DOCTRINE_EQUIPMENT_FULL_DESC: "Эта общая доктрина организует силы вокруг всестороннего и полного обеспечения оборудованием. Концепция полного оснащения делает упор на стандартизированное снаряжение для поддержки длительных и широкомасштабных операций."
 GRAND_DOCTRINE_BLUE_WATER_DESC: "Эта масштабная доктрина структурирует военно-морские силы для проведения продолжительных операций в открытом океане и на отдалённых морских театрах военных действий. Концепции военно-морского флота, способного действовать в открытом море, делают упор на глобальный охват, проекцию силы и постоянное присутствие флота."
 GRAND_DOCTRINE_GREEN_WATER_DESC: "Эта общая доктрина организует военно-морские силы вокруг операций в прибрежных и региональных морских районах. Концепции военно-морского флота, ориентированного на прибрежные воды, делают упор на влияние на побережье и региональный контроль над морем."
 GRAND_DOCTRINE_JEUNE_ECOLE_DESC: "Эта общая доктрина строит военно-морскую стратегию вокруг небольших специализированных судов и распределённых морских операций. Концепции «Молодой школы» подчёркивают асимметрию и избирательное применение силы в военно-морской войне."
 GRAND_DOCTRINE_GUERRE_DE_COURSE_DESC: "Эта грандиозная доктрина организует военно-морские операции вокруг нарушения морской активности посредством ведения войны против торговли противника. Концепции корсарской войны подчёркивают целенаправленные военно-морские действия на морских коммуникациях."
 marine_commandos: "Морские коммандос"
 air_assault_artillery: "Десантные войска"
 SUBDOCTRINE_DESIGN_DRONE_DESC: "Эта доктрина отдаёт приоритет разработке конструкций беспилотных летательных аппаратов, основанных на дистанционном управлении и автономных системах поддержки. В конструкциях дронов особое внимание уделяется модульной интеграции и гибкой конфигурации миссий для расширения возможностей применения воздушной мощи в соответствии с оперативными требованиями."
 EQUIPMENT_SMALL_FIGHTER: "Истребители"
 EQUIPMENT_SUICIDE: "Дроны"
 EQUIPMENT_SCOUT_PLANE: "Самолёт-разведчик"
 EQUIPMENT_AIR_TRANSPORT: "Воздушный транспорт"
 screen_destroyer: "Эсминец охранения"
 SUBDOCTRINE_EQUIPMENT_WALKER_TANK: "Шагающие танки"
 SUBDOCTRINE_EQUIPMENT_WALKER_TANK_DESC: "Эта доктрина организует войска шагающих боевых машин."
 gait_optimization: "Упражнения по оптимизации походки"
 stabilized_firing_windows: "Стабилизированные окна огня"
 leg_damage_protocols: "Протоколы контроля повреждений ног"
 terrain_anchoring: "Анкеровка к местности и микропозиционирование"
 combined_arms_walker_screen: "Экран шагающих машин в общевойсковом бою"
 SUBDOCTRINE_EQUIPMENT_DRONE: "Оснащение дронов"
 SUBDOCTRINE_EQUIPMENT_DRONE_DESC: ""
 SPECIAL_FORCES_MIXED: "Смешанное командование"
 SPECIAL_FORCES_MIXED_DESC: "Данная доктрина структурирует силы специального назначения как высокоизбирательные подразделения, подготовленные для выполнения сложных, приоритетных задач, требующих точности и осмотрительности. Элитные концепции сил специального назначения делают акцент на интеграции передовых возможностей и оперативной эффективности в различных условиях."
 SPECIAL_FORCES_MARINE_FOCUS: "Морской спецназ"
 SPECIAL_FORCES_MARINE_FOCUS_DESC: "Эта доктрина ориентирует наши силы специального назначения в первую очередь на морские подразделения, предоставляя нам больше возможностей для подготовки и развёртывания морских сил. Это происходит за счёт неспособности должным образом обучать или оснащать другие ветви нашего спецназа."
 SPECIAL_FORCES_AIRBORNE_FOCUS: "Воздушно-десантный спецназ"
 SPECIAL_FORCES_AIRBORNE_FOCUS_DESC: "Эта доктрина ориентирует наши силы специального назначения в первую очередь на воздушно-десантные подразделения, предоставляя нам больше возможностей для подготовки и развёртывания десантных сил. Это происходит за счёт неспособности должным образом обучать или оснащать другие ветви нашего спецназа."
 SPECIAL_FORCES_RANGER_FOCUS: "Рейнджерский спецназ"
 SPECIAL_FORCES_RANGER_FOCUS_DESC: "Эта доктрина ориентирует наши силы специального назначения в первую очередь на рейнджерские подразделения, предоставляя нам больше возможностей для подготовки и развёртывания рейнджерских сил. Это происходит за счёт неспособности должным образом обучать или оснащать другие ветви нашего спецназа."
 DOCTRINE_TRACK_MIXED_OPTIONS: "Дополнительные силы специального назначения"
 AIRBORN_INTERDICTION: "Воздушное перехватывание"
 AIRBORN_INTERDICTION_DESC: "Эта доктрина предполагает отправку лёгкой воздушно-десантной пехоты и разведывательных групп глубоко в тыл противника для саботажа аэродромов, снабжения и связи. Концепции перехвата делают упор на проникновение, подрыв и задержку вражеских маневров, а не на удержание позиций."
 AIRBORN_AIRHEAD_ASSAULT: "Захват воздушного плацдарма"
 AIRBORN_AIRHEAD_ASSAULT_DESC: "Эта доктрина предполагает массированное десантирование лёгкой и моторизованной воздушно-десантной пехоты для захвата и удержания воздушно-десантного плацдарма до прибытия подкрепления. Концепции штурма воздушно-десантных плацдармов делают упор на концентрированные десанты, быструю консолидацию и оборонительную выносливость в условиях контратаки."
 RANGER_JUNGLE_FORCES: "Рейнджеры джунглей"
 RANGER_JUNGLE_FORCES_DESC: "Эта доктрина готовит рейнджеров к продолжительным операциям в глубине джунглей, где жара, болезни и нарушенные линии снабжения не позволяют использовать обычные войска. Концепция действий в джунглях делает упор на акклиматизацию, проникновение через непроходимую местность и самодостаточность вдали от дружественных сил."
 MARINE_ELITE_RAIDERS: "Береговые рейдеры"
 MARINE_ELITE_RAIDERS_DESC: "Эта доктрина структурирует морские силы в небольшие рейдовые группы, которые наносят удары по прибрежным целям и отступают до того, как противник успеет отреагировать. Концепция береговых рейдеров делает упор на скорость, проникновение и минимальные логистические затраты."
 MARINE_ARMORED_BEACHHEAD: "Бронированный плацдарм"
 MARINE_ARMORED_BEACHHEAD_DESC: "Эта доктрина предусматривает организацию десантных сил для высадки бронетехники и прорыва с плацдарма до того, как обороняющиеся закрепятся на нём. Концепция бронетанкового плацдарма делает упор на механизированную огневую мощь, инерцию и быстрое расширение плацдарма."
 AIRBORN_AIR_ASSAULT: "Воздушный десант"
 AIRBORN_AIR_ASSAULT_DESC: "Данная доктрина строит воздушно-десантные войска вокруг десантирования с вертолётов, а не парашютного десантирования. Концепции воздушного десанта делают акцент на быстром вертикальном охвате, мобильности и поддержке вертолётов по вызову."
 AIRBORN_ARMORED_DROP: "Бронедесантные воздушно-десантные войска"
 AIRBORN_ARMORED_DROP_DESC: "Эта доктрина оснащает воздушно-десантные войска бронетехникой, допускающей десантирование с воздуха, и механизированными колоннами для продолжения боевых действий после высадки. Концепция бронированных воздушно-десантных войск делает акцент на защищённой огневой мощи, организации и выносливости в глубине вражеской территории."
 RANGER_RECON_FORCES: "Разведывательные рейнджеры"
 RANGER_RECON_FORCES_DESC: "Эта доктрина готовит рейнджеров к глубокой разведке, прикрытию и наблюдению впереди основных сил. Концепция разведывательных рейнджеров делает акцент на скрытности, полевой подготовке и точном обнаружении целей."
 RANGER_STRIKE_FORCES: "Ударные рейнджеры"
 RANGER_STRIKE_FORCES_DESC: "Эта доктрина готовит рейнджеров к быстрому штурму и захвату аэродромов против укреплённых объектов. Концепции ударных рейнджеров делают упор на шок, темп и прямое применение силы."
 SOF_OPERATIONS_COMMAND: "Командование специальных операций"
 SOF_OPERATIONS_COMMAND_DESC: "Данная доктрина предусматривает создание специализированного командования для формирования и поддержания сил специального назначения первого уровня. Концепции командования специальных операций делают упор на избирательный набор, подготовку и совместную поддержку во всех условиях."
 SOF_DIRECT_ACTION: "Прямые действия"
 SOF_DIRECT_ACTION_DESC: "Эта доктрина готовит операторов к проведению рейдов прямого действия против особо важных целей. Концепция прямого действия делает упор на высокоточные удары, быструю высадку и решающий ближний бой."
 SOF_SABOTAGE_SUBVERSION: "Саботаж и подрывная деятельность"
 SOF_SABOTAGE_SUBVERSION_DESC: "Эта доктрина готовит бойцов к диверсиям, подрывной деятельности и нетрадиционным методам ведения войны в тылу врага. Концепции диверсий делают упор на проникновение, подрывные работы и длительные операции без пополнения запасов."
 SOF_RECON_INTELLIGENCE: "Специальная разведка"
 SOF_RECON_INTELLIGENCE_DESC: "Эта доктрина сосредотачивает деятельность специальных сил на разведке, наблюдении и сборе разведывательной информации. Концепции специальной разведки предполагают минимальное присутствие на территории, внимательное наблюдение и точное предоставление отчётов."
 SOF_COUNTER_TERROR: "Борьба с терроризмом"
 SOF_COUNTER_TERROR_DESC: "Эта доктрина готовит специалистов к борьбе с терроризмом, освобождению заложников и ведению боевых действий в городских условиях на ближней дистанции. Концепции борьбы с терроризмом делают упор на готовность, точность и быстрое реагирование."
 SUBDOCTRINE_DESIGN_STEALTH: "Стелс-дизайн"
 SUBDOCTRINE_DESIGN_STEALTH_DESC: "Эта доктрина ставит во главу угла разработку летательных аппаратов с уменьшенной радиолокационной заметностью и повышенной живучестью. В конструкциях технологий «стелс» особое внимание уделяется материалам с низкой заметностью, средствам радиоэлектронного противодействия и конструктивным решениям, позволяющим свести к минимуму вероятность обнаружения сенсорными системами противника."
 SUBDOCTRINE_DESIGN_EW: "Проекты РЭБ"
 SUBDOCTRINE_DESIGN_EW_DESC: "Данная доктрина сосредоточена на интеграции специализированных систем радиоэлектронной борьбы в авиационные платформы. В конструкциях систем радиоэлектронной борьбы особое внимание уделяется постановке активных помех, пассивному обнаружению и средствам подавления с целью снижения эффективности противовоздушной обороны противника в оперативной обстановке."
 SUBDOCTRINE_DESIGN_MODULAR: "Модульные конструкции"
 SUBDOCTRINE_DESIGN_MODULAR_DESC: "Эта доктрина организует разработку самолётов на основе открытой архитектуры и стандартизированных компонентных платформ. Модульные конструкции делают акцент на быстрой модернизации возможностей, снижении затрат на протяжении всего жизненного цикла и гибкой адаптации платформы к различным задачам."
 SUBDOCTRINE_HEAVY_AEW: "Самолёты ДРЛО"
 SUBDOCTRINE_HEAVY_AEW_DESC: "Эта доктрина строит операции с использованием крупной авиации вокруг воздушного наблюдения и управления боевыми действиями. Концепции воздушного раннего предупреждения делают упор на обнаружение на обширных территориях, интеграцию данных в реальном времени и скоординированное управление воздушными средствами на всём театре военных действий."
 SUBDOCTRINE_HEAVY_AIRLIFT: "Стратегические авиаперевозки"
 SUBDOCTRINE_HEAVY_AIRLIFT_DESC: "Эта доктрина организует операции с использованием тяжёлой авиации вокруг стратегического перемещения войск, техники и грузов. Концепции стратегической воздушной транспортировки делают упор на глобальный охват, стабильную пропускную способность и гибкое размещение баз для поддержки операций на больших расстояниях."
 SUBDOCTRINE_HEAVY_REFUELING: "Дозаправка в воздухе"
 SUBDOCTRINE_HEAVY_REFUELING_DESC: "Данная доктрина интегрирует операции самолётов-заправщиков в планирование продолжительных воздушных кампаний. Концепции дозаправки в воздухе делают упор на расширение оперативной дальности, постоянное присутствие в воздухе и скоординированную топливную поддержку в рамках многоцелевых авиационных операций."
 SUBDOCTRINE_MULTIROLE_DOMINANCE: "Многоцелевое господство"
 SUBDOCTRINE_MULTIROLE_DOMINANCE_DESC: "Данная доктрина использует многоцелевые самолёты в качестве основных платформ для установления превосходства в воздухе. Концепции многоцелевого превосходства в воздухе подчёркивают сочетание возможностей ведения боя за пределами прямой видимости с гибкостью выполнения многоцелевых задач для противостояния и контроля над воздушным пространством."
 SUBDOCTRINE_MULTIROLE_CARRIER: "Многоцелевой авианосец"
 SUBDOCTRINE_MULTIROLE_CARRIER_DESC: "Данная доктрина строит операции многоцелевой авиации вокруг развёртывания на авианосцах и выполнения ударных задач ВМС. Концепции многоцелевого применения авианосцев делают упор на скоординированные операции флота, перехват с палубы и интеграцию военно-воздушных сил в планирование морских кампаний."
 SUBDOCTRINE_STRIKE_SEAD: "Подавление ПВО"
 SUBDOCTRINE_STRIKE_SEAD_DESC: "Эта доктрина организует операции ударной авиации вокруг подавления и уничтожения противовоздушных сетей противника. Концепции подавления и уничтожения ПВО противника делают упор на противорадиационное оружие, скоординированные радиоэлектронные атаки и систематическое устранение угроз наземного базирования для обеспечения свободы действий в спорном воздушном пространстве."
 SUBDOCTRINE_STRIKE_INTERDICTION: "Глубокий перехват"
 SUBDOCTRINE_STRIKE_INTERDICTION_DESC: "Эта доктрина фокусирует ударную авиацию на нарушении оперативной глубины противника за счёт высокоточных дальних боевых действий. Концепции глубокого перехвата делают упор на оружие дальнего действия, планирование целей и скоординированные ударные группы для ослабления возможностей противника до того, как он сможет достичь фронта."
 SUBDOCTRINE_STRIKE_CAMPAIGN: "Изоляция с воздуха"
 SUBDOCTRINE_STRIKE_CAMPAIGN_DESC: "Эта доктрина строится вокруг ударной авиации и авиации непосредственной авиационной поддержки, ориентированной на проведение длительных операций по перехвату наземных сил противника. Концепции кампаний по воздушному перехвату делают упор на постоянное присутствие, использование барражирующих платформ и тесную интеграцию с передовыми наземными авиадиспетчерами для непрерывного снижения маневренности противника."
 SUBDOCTRINE_FIGHTER_BVR: "Бой BVR"
 SUBDOCTRINE_FIGHTER_BVR_DESC: "Эта доктрина строит операции истребителей вокруг ведения боя за пределами прямой видимости с использованием ракет с радиолокационным наведением. Концепции боя за пределами прямой видимости делают упор на обнаружение целей на больших расстояниях, отслеживание нескольких целей и вероятность поражения с первого выстрела для уничтожения самолётов противника до установления визуального контакта."
 SUBDOCTRINE_FIGHTER_WVR: "Авиабои WVR"
 SUBDOCTRINE_FIGHTER_WVR_DESC: "Эта доктрина готовит пилотов истребителей к ближнему манёвренному бою в пределах прямой видимости. Концепции ближнего воздушного боя делают упор на манёвренность самолёта, ситуационную осведомлённость и агрессивную наступательную тактику для достижения побед в ближнем бою с использованием пушек и ракет малой дальности."
 SUBDOCTRINE_FIGHTER_STEALTH: "Стелс-истребители"
 SUBDOCTRINE_FIGHTER_STEALTH_DESC: "Эта доктрина определяет структуру боевых действий истребителей пятого поколения, основанную на проникновении с низкой заметностью и нанесении удара с первых же секунд. Концепции истребителей-невидимок делают акцент на снижении обнаруживаемости, размещении вооружения во внутренних отсеках и скоординированном проникновении через многоуровневую систему ПВО с целью обеспечения господства в воздухе до того, как противник успеет отреагировать."
 SUBDOCTRINE_FIGHTER_INTERCEPTOR: "Специализированные перехватчики"
 SUBDOCTRINE_FIGHTER_INTERCEPTOR_DESC: "Эта доктрина организует истребительные силы для быстрого реагирования на нарушения воздушного пространства и перехвата бомбардировщиков. Специализированные концепции перехватчиков делают упор на протоколы быстрого поднятия в воздух, процедуры перехвата с наземным управлением и зональное дежурство для защиты национального и союзного воздушного пространства."
 DOCTRINE_TRACK_DRONE_WARFARE: "Война с использованием дронов"
 GRAND_DOCTRINE_AUTONOMOUS_AIR: "Автономные воздушные операции"
 GRAND_DOCTRINE_AUTONOMOUS_AIR_DESC: "Эта масштабная доктрина строит военно-воздушные силы вокруг беспилотных систем, дистанционного управления и автономного ударного потенциала. Концепции автономных воздушных операций подчёркивают снижение риска для пилотов, постоянную разведку, наблюдение и рекогносцировку, а также интеграцию беспилотных платформ на всех уровнях воздушной кампании."
 SUBDOCTRINE_DRONE_MALE: "Ударные БПЛА MALE"
 SUBDOCTRINE_DRONE_MALE_DESC: "Эта доктрина строит воздушные операции вокруг средневысотных беспилотных боевых самолётов с большой продолжительностью полёта. Концепции MALE UCAV делают упор на постоянное наблюдение, дистанционно управляемые ударные миссии и непрерывное присутствие над целевыми районами для поддержки наземных и совместных операций."
 SUBDOCTRINE_DRONE_UCAS: "Авианосный удар UCAS"
 SUBDOCTRINE_DRONE_UCAS_DESC: "Эта доктрина интегрирует беспилотные боевые авиационные системы в операции авианосных ударных групп. Концепции авианосных БПЛА делают упор на скрытные ударные миссии, запускаемые с палубы, увеличенную дальность действия авианосца и автономную защиту флота для проецирования воздушной мощи с морских платформ без риска для пилотов."
 SUBDOCTRINE_DRONE_LOITERING: "Барражирующие боеприпасы"
 SUBDOCTRINE_DRONE_LOITERING_DESC: "Эта доктрина строит ударные операции вокруг барражирующих боеприпасов, способных к длительному полёту перед поражением стационарных или движущихся целей. Концепция барражирующих боеприпасов делает акцент на низкой стоимости поражения целей, высокой точности поражения бронетехники и распределённом запуске для обеспечения постоянного поражающего действия в зоне боевых действий."
 SUBDOCTRINE_DRONE_COUNTER: "Борьба с БПЛА"
 SUBDOCTRINE_DRONE_COUNTER_DESC: "Эта доктрина организует воздушные и наземные силы для обнаружения, перехвата и нейтрализации вражеских беспилотных летательных аппаратов. Концепции противодействия беспилотникам делают упор на многоуровневое радиоэлектронное подавление, специализированные платформы перехвата и интегрированные низковысотные радары для защиты сил и критически важных объектов от растущей угрозы беспилотных систем."
 SUBDOCTRINE_DRONE_SWARM: "Рои дронов"
 SUBDOCTRINE_DRONE_SWARM_DESC: "Эта доктрина строит воздушные операции вокруг большого количества скоординированных автономных и полуавтономных платформ. Концепция роя дронов делает упор на распределённое целеуказание, применение расходуемых средств и взаимодействие пилотируемых и беспилотных аппаратов для преодоления обороны противника и создания массированного эффекта при сниженном риске для экипажей."
 SUBDOCTRINE_OPERATION_COIN: "Контрповстанческие операции"
 SUBDOCTRINE_OPERATION_COIN_DESC: "Эта доктрина структурирует сухопутные войска таким образом, чтобы противостоять нерегулярным угрозам посредством контроля над населением, рейдов прямого действия на основе разведданных и сил быстрого реагирования. Контрповстанческие операции делают упор на постоянное присутствие и сотрудничество между гражданскими лицами и военными для восстановления стабильности."
 SUBDOCTRINE_OPERATION_URBAN_WARFARE: "Бои в городе"
 SUBDOCTRINE_OPERATION_URBAN_WARFARE_DESC: "Эта доктрина специализируется на применении сухопутных войск в боевых действиях в городах и мегаполисах. В городских условиях акцент делается на зачистку отдельных узлов, тактику проникновения и скоординированную оборонительную стрельбу для контроля сложного вертикального и горизонтального пространства боевых действий."
