 GEO_Anti_tank_1: "RPG-7G"
 GER_Anti_tank_1_desc: "판처파우스트 3는 1978년부터 1985년 사이에 개발되어 1987년 독일 연방군에 처음 배치된 현대식 준일회용 무반동 대전차 무기입니다. 서독 보병에게 당대 소련 장갑차량에 맞설 효과적인 무기를 제공하고 낡은 서독의 PzF 44 경 란체 발사기를 대체하기 위해 주문되었습니다."
