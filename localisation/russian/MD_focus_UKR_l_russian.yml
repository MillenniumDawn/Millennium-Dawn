 UKR_modernize_sov_equipment_effect: "Модернизация советской военной техники"
 UKR_modernize_sov_equipment_effect_tooltip: "Модернизирует предприятия оборонной промышленности, выпускающие технику советской разработки, повышая их производственные возможности."
 ukraine_modernize_sov_equipment_brdm_2_modernization.1.name: "Предложения по модернизации БРДМ-2"
 ukraine_modernize_sov_equipment_brdm_2_modernization.1.desc: "Наш запрос на модернизацию БРДМ-2 дошёл до оборонной промышленности. §YНиколаевский танкоремонтный завод§! обещает серию модернизаций в течение десятилетия, §YНВК «Техимпекс»§! хочет основательно переделать машину, но ему нужно время, а небольшие заводы в Киеве, Кременчуге и Виннице предлагают более дешёвые решения. Можно и оставить старые разведывательные машины как есть."
 ukraine_modernize_sov_equipment_brdm_2_modernization.1.a: "Выбрать Николаевский танкоремонтный завод"
 ukraine_modernize_sov_equipment_brdm_2_modernization.1.b: "Выбрать НВК «Техимпекс»"
 ukraine_modernize_sov_equipment_brdm_2_modernization.1.c: "Выбрать небольшие заводы"
 ukraine_modernize_sov_equipment_brdm_2_modernization.1.d: "Окончательно закрыть программу БРДМ-2"
 ukraine_modernize_sov_equipment_brdm_2_modernization.2.name: "Ранняя модернизация БРДМ-2 готова"
 ukraine_modernize_sov_equipment_brdm_2_modernization.2.desc: "Николаевский завод завершил обе ранние модернизации. §YБРДМ-2ЛД§! получает украинский дизель СМД-21, увеличивающий запас хода на четверть, а §YБРДМ-2М§! сохраняет старый бензиновый двигатель и лишь получает боковые люки."
 ukraine_modernize_sov_equipment_brdm_2_modernization.2.a: "Принять на вооружение §YБРДМ-2ЛД§! с дизельным двигателем"
 ukraine_modernize_sov_equipment_brdm_2_modernization.2.b: "Принять на вооружение более дешёвую §YБРДМ-2М§!"
 ukraine_modernize_sov_equipment_brdm_2_modernization.2.c: "Приостановить проект"
 ukraine_modernize_sov_equipment_brdm_2_modernization.3.name: "БРДМ-2ДИ «Хазар» готова"
 ukraine_modernize_sov_equipment_brdm_2_modernization.3.desc: "Николаевский завод завершил §YБРДМ-2ДИ «Хазар»§! с дизелем IVECO Tector, тепловизором и дополнительным люком для десанта. За доплату завод может установить на неё и новый боевой модуль §Y«Буг»§!."
 ukraine_modernize_sov_equipment_brdm_2_modernization.3.a: "Принять на вооружение §YБРДМ-2ДИ «Хазар-Буг»§!"
 ukraine_modernize_sov_equipment_brdm_2_modernization.3.b: "Принять на вооружение §YБРДМ-2ДИ «Хазар»§!"
 ukraine_modernize_sov_equipment_brdm_2_modernization.3.c: "Приостановить проект"
 ukraine_modernize_sov_equipment_brdm_2_modernization.4.name: "Новые производители для БРДМ-2"
 ukraine_modernize_sov_equipment_brdm_2_modernization.4.desc: "Ещё четыре компании прислали в Министерство обороны свои предложения по БРДМ-2. Одну из них мы можем привлечь к программе наряду с Николаевским заводом. Или же можно сосредоточиться только на Николаеве — это пойдёт на пользу циклу разработки."
 ukraine_modernize_sov_equipment_brdm_2_modernization.4.a: "Заказать §YБРДМ-2Т§! у НВК «Техимпекс»"
 ukraine_modernize_sov_equipment_brdm_2_modernization.4.b: "Купить §YБРДМ-2ДП§! у «Маяка»"
 ukraine_modernize_sov_equipment_brdm_2_modernization.4.c: "Привлечь Винницкий завод"
 ukraine_modernize_sov_equipment_brdm_2_modernization.5.name: "Оставшиеся БРДМ-2"
 ukraine_modernize_sov_equipment_brdm_2_modernization.5.desc: "Многие старые БРДМ-2 всё ещё ждут модернизации. Николаевский завод предлагает §YБРДМ-2Л1§! — дешёвую и быстро выполнимую мобилизационную модернизацию — или §YБРМ «Мангуст»§! — полностью переосмысленную разведывательную машину."
 ukraine_modernize_sov_equipment_brdm_2_modernization.5.a: "Принять на вооружение мобилизационную §YБРДМ-2Л1§!"
 ukraine_modernize_sov_equipment_brdm_2_modernization.5.b: "Разработать §YБРМ «Мангуст»§!"
 ukraine_modernize_sov_equipment_brdm_2_modernization.5.c: "Приостановить проект"
 ukraine_modernize_sov_equipment_brdm_2_modernization.6.name: "«Арей» строит собственную разведывательную машину"
 ukraine_modernize_sov_equipment_brdm_2_modernization.6.desc: "Пока Николаев начинает работу над «Мангустом», инженерная группа §Y«Арей»§! из добровольцев армии и Национальной гвардии перестраивает БРДМ-2 на закрытом киевском заводе. Их §YБКМ «Гекон»§! рассчитана на ту же роль."
 ukraine_modernize_sov_equipment_brdm_2_modernization.6.a: "Сосредоточиться на §YБРМ «Мангуст»§!"
 ukraine_modernize_sov_equipment_brdm_2_modernization.6.b: "Поддержать «Арей» и его §YБКМ «Гекон»§!"
 ukraine_modernize_sov_equipment_brdm_2_modernization.6.c: "Дождаться обоих прототипов"
 ukraine_modernize_sov_equipment_brdm_2_modernization.7.name: "Прототип БРМ «Мангуст» готов"
 ukraine_modernize_sov_equipment_brdm_2_modernization.7.desc: "Николаевский завод представил §YБРМ «Мангуст»§!. Все компоненты, кроме двигателя, украинские, новые люки позволяют десанту быстро спешиваться, а дистанционно управляемый боевой модуль несёт пулемёты калибра 14.5 мм и 7.62 мм."
 ukraine_modernize_sov_equipment_brdm_2_modernization.7.a: "Принять на вооружение §YБРМ «Мангуст»§!"
 ukraine_modernize_sov_equipment_brdm_2_modernization.8.name: "«Мангуст» или «Гекон»"
 ukraine_modernize_sov_equipment_brdm_2_modernization.8.desc: "Оба прототипа завершили испытания. §YБРМ «Мангуст»§! — хорошо защищённое заводское изделие, а §YБКМ «Гекон»§! вмещает девять человек и спроектирована солдатами, которые знают, что нужно фронту."
 ukraine_modernize_sov_equipment_brdm_2_modernization.8.a: "Принять на вооружение §YБРМ «Мангуст»§!"
 ukraine_modernize_sov_equipment_brdm_2_modernization.8.b: "Принять на вооружение §YБКМ «Гекон»§!"
 ukraine_modernize_sov_equipment_brdm_2_modernization.9.name: "Прототип БРДМ-2Т готов"
 ukraine_modernize_sov_equipment_brdm_2_modernization.9.desc: "§YНВК «Техимпекс»§! представила §YБРДМ-2Т обр. 2012§!. Дизель Д-245 заменил бензиновый двигатель ГАЗ-41, что снизило пожароопасность и расход топлива, а корпус прошёл капитальный ремонт."
