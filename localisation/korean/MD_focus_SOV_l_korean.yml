 Sov_warsaw_pact.16.t: "봉기 성공"
 Sov_warsaw_pact.16.d: "역사적 동맹들의 도움으로 우리는 동독의 핵심 지휘 센터를 장악했습니다. 바르샤바 조약은 전략적 협력의 대가로 우리 주권의 보호를 제안했으며, 이는 우리의 입지를 강화합니다."
