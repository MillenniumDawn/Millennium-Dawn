 EU_POTEF_news.2.t: "Результаты выборов POTEF [GetYear] года"
 EU_POTEF_news.2.d: "Лидер [FROM.GetNameWithFlag] [FROM.GetLeader] победил на выборах Президента Европейской федерации (POTEF). В качестве POTEF [FROM.GetLeader] возглавит Европейскую федерацию на следующие [?FROM.POTEF_years|0] лет."
