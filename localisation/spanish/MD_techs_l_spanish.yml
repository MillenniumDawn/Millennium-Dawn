 aircraft_heli_engineering_1: "Ingeniería de Transporte de Helicópteros"
 aircraft_heli_engineering_1_desc: "Reequipar nuestros portaaviones actuales con formas más eficientes de despliegue y almacenamiento de helicópteros puede mejorar nuestra capacidad para competir con los submarinos."
 aircraft_heli_engineering_2: "Despliegue Mejorado de Helicópteros"
