 CANCEL_ENERGY_LOAD_SHARING_TITLE: "Cancel §YEnergy Load Sharing§!"
 CANCEL_ENERGY_LOAD_SHARING_ACTION_DESC: "We are no longer interested in maintaining our current §YEnergy Load Sharing§! agreement. We can cancel it and move on with our day."
 DIPLO_ACTION_CANCEL_ENERGY_LOAD_SHARING: "Unfortunately [THIS.GetNameWithFlag] has withdrawn from our §YEnergy Load Sharing§! agreement. Perhaps another day we could sign another §YEnergy Load Sharing§!, but as of now we no longer are transferring energy between our two nations."

