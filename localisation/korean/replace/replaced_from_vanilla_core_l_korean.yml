 FUEL_DESC: "§H연료§!는 나라가 과잉 보유한 석유에서 만들어집니다. 각국은 §H연료§!의 최대 보유량이 있고 §H저장고§!를 건설해 양을 늘릴 수 있습니다. §H연료§!는 전차/기계화 부대, 함정 및 비행기에서 소비하며 §H보급선§!을 통해 운송됩니다.\n\n또한 §H연료§!는 또한 국가의 §H화석 연료 발전소§!에 전력을 공급하는 데 사용되며 경제가 계속 작동하도록 보장하는 중요한 자원입니다. §H원자로§!, §H재생 에너지 기반 시설§! 및 §H기타 동력원§!은 에너지를 생산하기 위해 §H연료§!를 소비하지 않습니다. §H인구§! 또한 일반적인 요구 사항의 일부로 §H연료§! 를 소비합니다. 비군사적 §H연료§!소비량에 관한 자세한 정보는 §H건설§! 탭의 §H에너지 화면§!에서 확인할 수 있습니다."
