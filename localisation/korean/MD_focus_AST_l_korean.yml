 AST_the_lucky_country: "행운의 나라"
 AST_the_lucky_country_desc: "1964년 도널드 혼이 이 표현을 만든 이후, 대부분의 오스트레일리아인은 이 말을 우리나라가 광업에서 거둔 행운의 성공을 가리키는 것으로 오해해 왔습니다. 우리가 희귀하고 값비싼 광석으로 가득한 광대한 국토를 선물받은 것은 사실이지만, 혼은 당대의 지도자들이 그 분야에만 지나치게 투자하고 다른 경제적 기회를 외면한다고 조롱하기 위해 이 표현을 썼습니다. 한마디로 우리는 다각화를 충분히 하지 못했습니다. 그 결과 오스트레일리아는 몇몇 기술 또는 제조 시설만이 우리를 완전한 지대 수취 국가가 되지 않도록 막아 주는 처지에 놓였습니다. 우리는 수출에 전적으로 의존하고 있으며, 이를 받아들이든 아니면 탈피를 시작하든 선택해야 합니다."
 AST_fuel_the_mining_boom: "광업 호황에 불을 지핀다"
 AST_fuel_the_mining_boom_desc: "광업은 식민지 시절부터 말 그대로 오스트레일리아 경제의 핵심이었습니다. 골드러시부터 오늘날까지 광업은 우리 경제를 쉼 없이 돌리고 성장시켜 왔습니다. 광석을 트럭으로 나르고 배로 실어 보내는 데에는 헤아릴 수 없을 만큼의 휘발유가 소비됩니다. 중동 정세가 더 악화되면 우리 경제가 멈춰 설 수도 있습니다. 더 확장하기 전에 본토의 전략 비축분을 확보하고, 만일의 사태에 대비해 공급을 준비해 두어야 합니다."
 AST_acis_scheme: "ACIS 제도"
 AST_acis_scheme_desc: "자동차 경쟁력 및 투자 제도(ACIS)는 우리 자동차 산업에 관세 감면과 자금을 제공하여 투자와 연구 개발을 촉진하기 위해 만들어졌습니다. 우리 산업은 주변 국가들에 비해 뒤처져 있으므로, 국내 기업에 대한 지원은 환영받을 것입니다."
 AST_a_sea_of_panels: "패널의 바다"
 AST_a_sea_of_panels_desc: "우리의 농촌 태양광 패널 단지는 장관입니다. 보통은 관광객에게 화상이나 입히던 햇빛을 흡수하는 거대한 원형 예술 작품과도 같습니다. 현재의 재생 에너지와 화석 연료 구성은 건전하다고 하기에는 조금 부족하며, 기존 태양광 발전 설비를 확장하면 균형을 맞출 수 있을 것입니다."
 AST_commit_to_renewables: "재생 에너지에 전념한다"
 AST_commit_to_renewables_desc: "우리의 에너지 생산의 미래가 석탄이나 가스의 공급량에 좌우되어서는 안 됩니다. 재생 에너지 기술 개발은 최근 몇 년 사이 놀라울 만큼 빠르게 진전되었습니다. 이를 활용할 때가 되었습니다."
 AST_harness_the_wind: "바람을 이용한다"
 AST_harness_the_wind_desc: "그리스 신화에서 아이올로스는 제우스로부터 바람을 다스리는 임무를 맡은 신으로, 명령이 있을 때에만 끔찍한 폭풍을 풀어놓았습니다. 우리는 바람을 지배할 수는 없지만, 과학자들 덕분에 그 힘을 이용할 수는 있습니다. 가장 효과적인 곳에 터빈을 더 설치하면 상당한 규모의 청정 에너지원을 얻게 될 것입니다."
 AST_rewire_the_nation: "국가 전력망 재배선"
 AST_rewire_the_nation_desc: "이 나라에서 돈을 쏟아붓는 것만으로 해결할 수 있는 문제는 거의 없지만, 이것은 그중 하나입니다. 기술자들은 이미 위원회 논의와 계획 수립을 마쳤으며, 이제 현재의 수요 용량에 맞춰 전국 전력망을 현대화하는 개량 사업을 시행할 준비가 되었습니다."
 AST_fix_the_potholes: "도로 파임을 수리한다"
 AST_fix_the_potholes_desc: "이 나라에서 운전할 때 가장 골칫거리는 언제나 도로의 파인 구멍이었습니다. 도시든 농촌이든 운전자에게 물어보면 차량 수리, 아찔한 사고 위기 등 끔찍한 경험담이 쏟아집니다. 국민을 보호할 의무는 정부에 있으므로, 이 골칫거리를 없애는 것은 우리의 책임입니다."
 AST_north_west_shelf_expansion: "노스웨스트 셸프 확장"
 AST_north_west_shelf_expansion_desc: "노스웨스트 셸프는 반도에서 가장 오래되고 성공적인 가스 플랜트 중 하나로, 우리 석유와 가스 채굴량의 상당 부분을 처리해 왔습니다. 현재의 제안은 이 사업의 가동 수명을 2070년까지 연장하여, 그때까지 절실히 필요한 처리 능력을 확보하자는 것입니다."
 AST_its_just_coal: "그냥 석탄일 뿐이다!"
 AST_its_just_coal_desc: "우리의 확장에 반대하는 이들 중에는 화석 연료를 두려워하는 사람들이 있을 것입니다. 이들에게 말합니다. 두려워하지 마십시오. 해롭지 않습니다. 그저 석탄일 뿐입니다. 오스트레일리아인에게 석탄 채굴은 거의 피에 새겨진 일입니다. 우리는 이 검고 먼지투성이인 광석을 소중히 여기며, 이것이 우리 가정을 밝혀 줍니다. 재생 에너지가 새로운 흐름일지 몰라도, 석탄은 언제나 우리 곁에서 타오르고 있을 것입니다."
 AST_high_speed_focus_ast: "고속철도"
 AST_high_speed_focus_ast_desc: "고속철도의 저주는 80년대부터 우리 주들을 괴롭혀 왔습니다. 연방 정부가 시속 200km를 넘는 철도 건설을 추진할 때마다 사업은 계획 단계를 넘지 못했습니다. 이번에는 다릅니다. 우리가 직접 나서서 끝까지 해낼 것입니다. 기술도 있고 노선도 있습니다. 브리즈번에서 시드니, 멜버른까지입니다. 우리를 가로막는 것은 아무것도 없습니다."
 AST_dig_deep: "깊이 파들어간다"
 AST_dig_deep_desc: "알루미나 정제 분야는 최근 외딴 광업 중심지들에서 여러 획기적 진전을 이루었습니다. 채굴권 승인 절차를 신속히 처리하도록 직접 압박을 가하면, 이들은 더 일찍, 더 깊이 굴착 작업에 착수할 수 있습니다."
 AST_lng_megaprojects: "LNG 메가프로젝트"
 AST_lng_megaprojects_desc: "우리의 LNG 시설은 천연가스를 타국으로 수송하는 가장 최첨단 수단 중 하나이며, 운송비를 엄청나게 절감해 주었습니다. 가스를 극저온으로 냉각하여 액체로 만들면 부피가 600분의 1로 줄어듭니다. 기업들과 협력하여 이 시설을 확장하고 건설 비용을 어느 정도 분담하면 더 빨리 가동에 들어갈 수 있을 것입니다."
 AST_the_boom_never_ends: "호황은 끝나지 않는다"
 AST_the_boom_never_ends_desc: "때로는 운이 좋고, 때로는 그저 오스트레일리아일 뿐입니다. 광업 부문은 호황을 맞고 있으며, 우리는 이 호황을 이어 가고자 합니다. 투자, 부양책, 모든 것을 동원하여 말입니다. 우리 기업들은 우리의 승인 아래 계속 굴착할 것이며, 우리는 가만히 앉아 그 혜택을 누리기만 하면 됩니다."
 AST_treat_the_farmers: "농민들에게 보답한다"
 AST_treat_the_farmers_desc: "이 나라의 농민들은 세상에서 가장 열심히 일하는 사람들입니다. 하루가 끝날 무렵 그들의 손은 흙투성이지만, 그 덕분에 우리 손에는 다이아몬드 반지가 끼워질 수 있습니다. 적어도 제가 듣기로는 그렇습니다. 아무튼 우리는 그들의 노고에 보답해야 합니다. 작은 선물이라도 말입니다."
 AST_enjoy_the_prosperity: "번영을 누린다"
 AST_enjoy_the_prosperity_desc: "전문가들을 추궁해 보면 모두 우리 광업 부문이 당분간 흔들리지 않을 것이라고 입을 모읍니다. 지금은 수출이 우리가 일찍이 경험해 보지 못한 방식으로 이 나라를 움직이고 있으며, 그 보상을 누리는 것은 우리의 몫입니다. 쇠가 달궈졌을 때 미래의 광업 사업과 연료 생산을 뒷받침할 인프라에 대규모로 투자할 수 있습니다. 호황에서 최대한의 이익을 얻도록 하는 것입니다."
 AST_heavy_industry_projects: "중공업 프로젝트"
 AST_heavy_industry_projects_desc: "우리 국영 건설사들은 이 훌륭한 나라를 건설하기 위해 열심히 일해 왔지만, 더 큰 역량에 대한 수요가 분명합니다. 확장 계획을 추진하는 데에는 비용이 들겠지만 절차는 간단합니다. 세계는 우리가 되어야 할 오스트레일리아의 모습을 보게 될 것입니다."
 AST_urban_expansion_initiative: "도시 확장 구상"
 AST_urban_expansion_initiative_desc: "토지 없이는 건설할 수 없으며, 이 제안은 일부 시위대가 \\"몰수\\"라고 부르는 통상적인 토지 취득 요건의 상당수를 우회할 수 있도록 마련되었습니다. 물론 그것은 몰수가 아닙니다. 토지 대금은 당연히 지급될 것이며, 다만 절차가 더 빠를 뿐입니다."
 AST_defy_the_mantra: "구호에 맞선다"
 AST_defy_the_mantra_desc: "우리는 어떤 별칭에 얽매여 있지 않을 것입니다. 오스트레일리아는 진화하든가 아니면 죽을 것입니다. 광산이 고갈되거나 다음 경제 재앙이 닥쳐도, 우리가 미래에 투자했기에 우리 경제는 살아남을 것입니다. 여러 경제 분야로 확장함으로써 국내 생산을 다각화할 수 있습니다. 우리는 지대 수취 국가가 아니라 튼튼한 국가가 될 것입니다."
 AST_global_weapons_manufacturing: "물와라 확장"
 AST_global_weapons_manufacturing_desc: "제2차 세계 대전 이후 우리의 무기 제조 능력은 상당히 제한적인 수준에 머물러 왔습니다. 사실상 우리 폭약 생산의 대부분은 작은 어촌 마을 물와라에 집중되어 있습니다. 다각화가 필요하다면, 육군에 대한 보급을 원활히 하도록 국내 생산을 늘리는 것이 투자할 만한 가치가 있을 것입니다."
 AST_overseas_opportunities: "해외 기회"
 AST_overseas_opportunities_desc: "우리의 대형 화석 연료 기업 중 다수는 기회가 있는 곳이면 어디든 해외에서 활발히 사업을 벌이고 있습니다. 현행 규정을 완화하고 곳곳에 몇 가지 유인책을 마련하면 이러한 사업을 더욱 장려할 수 있습니다."
 AST_the_white_paper: "백서"
 AST_the_white_paper_desc: "1999년 동티모르 개입에서 거둔 성공은 우리 군의 여러 부족함을 낱낱이 드러냈습니다. 이를 보완하려면 전면적인 확장과 재편이 필요합니다. 고위 참모진은 분위기를 잡아 줄 목표부터 시작할 것을 권고했으며, 일을 진행시킬 몇 가지 방안을 제시했습니다."
 AST_hardening_our_units: "부대 방호력 강화"
 AST_hardening_our_units_desc: "걸프전과 그 이후의 개입 작전을 거치면서 비대칭 위협은 우리가 대처해야 하는 새롭고 두려운 전쟁 양상이 되었습니다. 때로는 더 큰 화력이 통하지 않으며, 특히 급조 폭발물 같은 새로운 공격을 겪은 불운한 이들 중 살아남은 사람은 차량이 버텨 주었기 때문에 살아남았습니다. 방호력을 개발하는 것이 우리 병사들이 살아남아 작전을 계속하는 데 필요한 차이를 만들 수 있습니다."
 AST_a_networked_army: "네트워크화된 육군"
 AST_a_networked_army_desc: "디지털 환경은 지금까지 우리 산업에 경이로운 변화를 가져왔습니다. 마찬가지로 지상군을 디지털로 연결된 센서-사수 체계의 군대로 탈바꿈시키면 더 빠른 의사 결정과 지휘부와의 즉각적인 정보 전달이 가능해집니다. 우리의 합동군은 어느 때보다 일체화될 것이며, 작전은 지휘부가 직접 관리하여 적시에 올바른 결정이 내려지도록 할 수 있습니다."
 AST_diisr_ast: "DIISR"
 AST_diisr_ast_desc: "어떤 이유에서인지 우리에게는 정부가 주도하는 단일 연구 기관이 없습니다. 민간 연구소는 상당수 있고 주 정부 차원에서 운영되는 곳도 있지만, 우리에게 필요한 연구를 수행할 시설에는 더 큰 규모가 요구됩니다. 혁신산업과학연구부 설립 계획이 우리 책상에 올라왔으며, 건설은 승인만을 기다리고 있습니다."
 AST_rnd_tax_incentive: "연구개발 세제 혜택"
 AST_rnd_tax_incentive_desc: "DIISR이 설립되어 가동 중인 만큼, 자금의 일부를 연구 개발에 할당하고 프로젝트 착수를 위한 여러 보조금을 마련하면 우리가 혁신의 최전선에 서도록 보장할 수 있습니다."
 AST_our_beloved_bushmaster: "우리의 사랑하는 부시마스터"
 AST_our_beloved_bushmaster_desc: "부시마스터는 다용도성, 독특한 디자인, 야전 성능으로 수많은 군사 전문가들의 마음을 사로잡은 우리 육군의 상징이었습니다. 해외에서 우리를 훌륭히 뒷받침해 왔으므로 더 많이 생산하는 것이 우선 과제가 되어야 합니다. 다행히 그 요청은 이미 백서에 포함되어 있었습니다."
 AST_the_special_forces: "과감한 자가 승리한다"
 AST_the_special_forces_desc: "오스트레일리아 SAS는 많은 이들의 자랑이 되었으며 그럴 만한 이유가 있습니다. 영국 부대를 본떠 창설된 이 정예 연대는 민감한 해외 작전에서 대단히 유용했습니다. 우리가 가진 최고의 기술로 이들을 무장시켜 두면 앞으로도 성공이 이어질 것입니다."
 AST_lessons_from_the_middle_east_ast: "중동에서 얻은 교훈"
 AST_lessons_from_the_middle_east_ast_desc: "우리는 중동의 여러 작전에서 많은 것을 배웠습니다. 특히 우리 군복이 이 지역의 흔한 먼지 섞인 날씨에 맞지 않는다는 점이 두드러졌습니다. 오스트레일리아의 더위에 맞춰 설계되었지만, 더 개선할 여지가 있습니다."
 AST_remembering_the_anzacs: "ANZAC을 기억하며"
 AST_remembering_the_anzacs_desc: "우리의 ANZAC 기념식은 언제나 '모든 전쟁, 분쟁, 평화유지 작전에서 복무하고 전사한' 이들을 기려 왔습니다. 여기에는 제1차 세계 대전에서 목숨을 잃은 이들뿐 아니라 걸프전과 인도네시아 등 최근 분쟁에 참전한 우리 병사들도 포함됩니다. 우리가 얻는 교훈은 병사들을 안전하게 지켜야 한다는 신성한 의무입니다. 이제 전쟁이 끊임없이 변하는 만큼, 우리도 변화하고 혁신하여 우리 군에 전장에서의 최선의 기회를 주어야 합니다. 그렇지 않으면 다음 기념식에서 그들을 추모하게 될 것입니다."
 AST_never_another_darwin: "다시는 다윈 같은 일이 없도록"
 AST_never_another_darwin_desc: "1942년 2월 19일, 일본 항공기 188대가량이 가한 폭격이 다윈을 휩쓸었습니다. 군사 기반 시설의 파괴는 물론 인명과 민간인 희생도 참혹했으며, 전쟁 중 우리를 겨냥한 단일 공격으로는 최대 규모였습니다. 전쟁의 규칙은 바뀌었지만 교훈은 그대로입니다."
 AST_new_tools: "새로운 도구"
 AST_new_tools_desc: "21세기가 우리에게 증명한 것이 있다면 안일함이 목숨을 앗아간다는 사실입니다. 물론 같은 소총을 계속 쓰고 교리를 그대로 유지할 수도 있지만, 적들은 그렇지 않을 것입니다. 대서양과 태평양 양쪽에서 이루어진 혁신은 더 다양한 환경과 위협 유형에 맞게 설계된 더 우수한 무기를 낳았습니다. 우리가 외면할 수 없는 현실입니다."
 AST_old_reliable: "믿음직한 구형"
 AST_old_reliable_desc: "우리는 냉전 시기에 이미 해외로 눈을 돌려 오스트리아를 택했습니다. 슈타이어는 AUG로 정답을 내놓았습니다. 매끈하고 우아한 총이며, 우리 제조사들은 그 이후 수십 년간 이를 완성해 왔습니다. 좋은 것을 굳이 바꿀 이유가 있겠습니까? 대신 현재의 생산 능력을 확장하는 데 투자하여 갑작스러운 수요에도 대비할 수 있습니다."
 AST_lithgow_arms: "리스고 무기 공장"
 AST_lithgow_arms_desc: "리스고 무기 공장은 1912년 이래 우리의 결의와 인내의 상징이었습니다. 제1차와 제2차 세계 대전 내내 충실히 우리를 뒷받침했으며 그동안 100만 정이 훨씬 넘는 소총을 생산했습니다. 그렇기에 지금의 처참한 상태는 보기 힘들 정도입니다. 무언가 조치가 필요합니다."
 AST_grow_our_command: "사령부를 키운다"
 AST_grow_our_command_desc: "특수작전사령부는 우리의 모든 특수 부대를 단일 지휘 체계인 SOCOMD로 통합하기 위해 설계되었습니다. 테러 위협이 끊임없이 커지는 데다 시대 특유의 도전 과제까지 더해지는 만큼, 우리 특수 부대는 통합된 지휘 아래에서 싸워야 하며 이 사령부가 그것을 충족해 줍니다."
 AST_the_second_white_paper: "제2차 백서"
 AST_the_second_white_paper_desc: "2000년 백서가 어느 정도 성공을 거둔 데 따라 행정부는 이전과 매우 유사한 새로운 지침을 내렸습니다. 전 분야에 걸친 지속적인 확장과 발전을 통해 체급 대비로 강대국들과 어깨를 나란히 하라는 것입니다. 우리는 이전에도 해냈으니, 다시 해낼 수 있습니다."
 AST_strategic_reform: "전략 개혁"
 AST_strategic_reform_desc: "우리 부서들의 현재 상태로는 부족합니다. 지난 수십 년간 쌓인 비효율을 덜어내기 위해 전략 전력에 대한 전면적인 개혁이 시행될 것입니다. 국방물자기구(DMO)와 국방능력개발단(CDG)은 해체되어 능력 획득 및 지속 지원단으로 재편됩니다. 생산 관리에는 기업 방식의 접근이 채택됩니다. 이 모든 것은 끊임없이 변하는 군을 관리할 수 있는, 훨씬 기민하고 대응력 있는 군대로 발전하기 위함입니다."
 AST_incorporate_the_peacekeeping_training_ast: "평화유지 훈련을 도입한다"
 AST_incorporate_the_peacekeeping_training_ast_desc: "오스트레일리아는 제2차 세계 대전 종전 이래 인력과 자원을 제공하며 국제연합 평화유지 활동에 참여해 왔습니다. 이 수십 년간, 특히 최근의 동티모르 개입을 통해 우리는 전쟁에 관한 여러 교훈을 얻었으며, 이를 우리 교리에 더 잘 반영하면 가장 있을 법하지 않은 환경에서도 병사들을 보호할 수 있습니다."
 AST_recruitment_campaigns: "모병 캠페인"
 AST_recruitment_campaigns_desc: "\\"쿠이! 당신은 오지 않겠습니까?\\" 포스터 이래로 우리는 모병 캠페인에 재능을 보여 왔습니다. 인터넷의 발전으로 활용할 수 있는 완전히 새로운 기회의 영역이 열렸습니다. 이 공간을 활용하는 다양한 광고를 게재하여 일반 TV를 잘 보지 않는 이들에게도 다가갈 수 있습니다."
 AST_land_one_two_one: "LAND 121"
 AST_land_one_two_one_desc: "라인메탈은 노후하고 방호력이 없는 중형 및 대형 트럭 다수를 개량형으로 교체하자는 제안을 내놓았습니다. 구체적으로는 다양한 작전을 뒷받침하도록 군수 및 기술 성능을 개선하는 계획입니다. \n\n일부 장비가 얼마나 낡아 가고 있는지를 고려하면 이 사업은 검토할 만한 가치가 있습니다."
 AST_stop_panicking: "당황하지 마라"
 AST_stop_panicking_desc: "모두 진정해야 합니다. 우리는 정부이지 경제를 통제하는 존재가 아닙니다. 상황이 잠깐이라도 나빠지면 갑자기 모두가 우리를 손가락질합니다. 더 나쁜 것은 사람들이 공황에 빠지기 시작한다는 점입니다. 거의 모든 이에게 지급하는 부양책으로 사태를 파악할 때까지 조금이나마 평온을 사 둘 수 있을 것입니다."
 AST_guarantee_the_banks: "은행을 보증한다"
 AST_guarantee_the_banks_desc: "은행들이 두려워한다면 우리가 흑자를 유지시켜 줄 것입니다. 이들을 유지하기 위해 필요한 일은 무엇이든 하겠습니다. 심지어 모든 은행 예금을 보증하겠습니다. 이 나라에서 무너지는 은행은 없을 것이며, 정부 지출만으로 GDP를 계속 굴러가게 할 재정적 응급조치를 충분히 내놓을 것입니다."
 AST_grab_the_securities: "증권을 매입한다"
 AST_grab_the_securities_desc: "이 모든 사태를 촉발한 것은 미국의 주택 시장이었으며, 오스트레일리아의 수많은 주택 소유자들은 같은 일이 자신들에게도 일어날지 걱정하고 있습니다. 주택담보증권을 사들여 주택 금융을 지원하고 파산을 막음으로써 대중을 안심시킬 수 있습니다."
 AST_turn_things_around: "상황을 반전시킨다"
 AST_turn_things_around_desc: "국가 건설 및 일자리 계획은 우리가 지금까지 마련한 경제 대책 중 단연 최대 규모가 되었습니다. 여기에는 학교 인프라, 사회 주택, 주택 건설, 세금 감면, 철도 사업, 일일이 셀 수 없이 많은 추가 지원금이 포함됩니다. 국가에 대한 지원의 정점은 우리가 상황을 정상궤도로 되돌리는 데 진지하다는 것을 보여 주고 모두의 불안을 가라앉힐 것입니다."
 AST_the_royal_australian_navy: "오스트레일리아 왕립 해군"
 AST_the_royal_australian_navy_desc: "우리 해안 앞바다를 누비는 우리의 자랑이자 기쁨은 RAN입니다. 분명히 말해 오스트레일리아는 섬나라입니다. 수 세기 동안 어떤 침략군이든 우리 해안에 도달하는 유일한 방법은 함대를 통하는 것이었고, 우리는 한때 영국 왕립 해군의 보호를 받았습니다. 물론 지금은 대륙간 미사일에 맞을 수도 있고 아무도 우리 해안에 상륙하지 않고도 훨씬 큰 피해를 입을 수 있지만, 그것은 핵심이 아닙니다. 해군이 한때 맡았던 역할에 대한 찬사로서, 그리고 그에 못지않게 중요한 임무를 맡은 만큼, 우리는 해군을 왕립이라 칭하고 한때 그랬듯 바다의 안전을 지키도록 파견합니다. 우리의 영광스러운 국가를 지키기 위해서입니다."
 AST_embrace_the_support_role: "지원 역할을 받아들인다"
 AST_embrace_the_support_role_desc: "지원 역할을 받아들인다 - 태평양에서 우리가 처한 현실은 임시방편의 역할입니다. 우리 단독으로는, 일대일로는 중국이나 러시아 함대를 상대할 가망이 없습니다. 싸워 볼 수는 있겠지만, 전쟁에서 이길 유일한 방법은 동맹국을 통하는 것입니다. 우리의 역할은 언제나 미국의 조연이었고 지금까지는 괜찮았습니다. 우리는 그들이 도착할 때까지 버티기만 하면 되고, 그러면 승리합니다. 지원 역할을 맡는 것은 부끄러운 일이 아니며, 잘 해낸다면 더더욱 그렇습니다."
 AST_we_are_the_pacific: "우리가 태평양이다"
 AST_we_are_the_pacific_desc: "시대가 변했습니다. 소비에트 연방은 사라졌고, 중국은 아직 그 후계자가 아닙니다. 현실적으로 해전은 가까운 미래에 일어날 가능성이 매우 낮습니다. 만약 일어난다면 우리는 버티지 못할지도 모릅니다. 지금의 해군으로는 어렵습니다. 해군 확장에 전념하면 소수만이 넘볼 수 있는 전력을 만들어 낼 수 있습니다. 우리가 가진 모든 것을 동원한다면 우리나라의 역할이 고정불변은 아닐 것입니다."
 AST_trade_support: "무역 지원"
 AST_trade_support_desc: "우리의 핵심 책무 중 하나는 우리와 소중한 파트너 사이의 무역을 보호하는 것이었습니다. 중국과 같은 해군 경쟁국의 차단으로부터 물자의 흐름을 안전하게 지키면, 역시 중국과 같은 최대 수입국들과의 무역이 계속 번창하도록 보장할 수 있습니다."
 AST_multidimensional_warfare: "다영역 작전"
 AST_multidimensional_warfare_desc: "육상, 해상, 공중, 우주, 사이버 영역에 걸쳐 군사력을 통합함으로써 우리는 이 분야에 미흡한 적들에 비해 상당한 우위를 점하게 됩니다. 공군과 해군 부서가 이를 위해 함께 협력해야 합니다."
 AST_whetstone_training: "숫돌 훈련"
 AST_whetstone_training_desc: "방치된 검처럼, 해군도 끊임없이 시험받고 갈고닦지 않으면 녹슬어 버립니다. 해상 전투 훈련은 사관생도와 수병들을 제대로 단련시킬 것입니다. 이들은 언제 어떤 교전에도 대비하게 될 것입니다. 그것이 이들의 임무이며, 이들은 우리를 자랑스럽게 만들 것입니다."
 AST_wide_scanning: "광역 탐지"
 AST_wide_scanning_desc: "진달리 작전 레이더망(JORN)은 시제품 단계를 넘어 5단계 구현에 들어갔으며, 이는 사실상 현존 최첨단 레이더 기술일 가능성이 매우 높다는 뜻으로 3,000km 이상의 거리까지 감시합니다. 이것을 발명하는 것은 쉬운 부분이었고, 이를 우리 함선에 탑재하는 것이 어려운 부분입니다."
 AST_an_outside_review: "포스 2030"
 AST_an_outside_review_desc: "우리의 해상 전력을 가늠하기 위해 해군 전력에 대한 검토를 의뢰했습니다. 그 결과는 우리의 생산 능력과 배치 한계에 대한 다소 충격적인 비판이었습니다. 본격적인 해군을 발전시키려면 권고된 개선안을 따라야 합니다."
 AST_the_middle_ships: "중형함"
 AST_the_middle_ships_desc: "호바트급 구축함을 개발하는 데에는 많은 땀과 눈물이 들어갔습니다. 60년대의 퍼스급 함선을 대체하고 우리의 유도 미사일 능력을 복원하기 위해 설계된 이 함급은 전 분야를 통틀어 가장 중요한 개량일지도 모릅니다."
 AST_screening_role: "경계 임무"
 AST_screening_role_desc: "태평양에서 동맹국을 지원하려면 우리가 그들의 눈과 귀가 되어야 합니다. 위협이 문 앞에 닿기 전에 이를 포착하는 능력은 그들에게 전술적 이점일 뿐 아니라, 우리가 전장을 준비하고 통제하는 데에도 도움이 됩니다. 이를 잘 해낼수록 우리의 성과도 좋아질 것입니다."
 AST_below_the_enemy: "적의 아래에서"
 AST_below_the_enemy_desc: "일부 잠수함은 비교적 최근에 취역했지만 함대의 상당수는 매우 낡았습니다. 대다수가 개량을 거쳤지만, 이들이 우리를 기술적으로 불리하게 만들고 있다는 사실은 변하지 않으며, 특히 우리의 최선의 승산이 간접 전투에 있는 만큼 더욱 그렇습니다."
 AST_containment_theory: "봉쇄 이론"
 AST_containment_theory_desc: "냉전 기간 동안 우리는 미국과 함께 '봉쇄 이론'이라는 방침 아래 움직였습니다. 소련의 팽창을 저지하기 위해 명시적으로 고안된 이론이었습니다. 지정학의 판도는 바뀌었지만, 어떤 면에서 임무는 그대로입니다. 우리의 적들은 매우 현실적인 팽창주의 목표를 추구하고 있습니다. 외교를 통해서든 인공 섬 건설을 통해서든, 이를 저지하거나 적어도 억제하지 못하면 우리의 주권은 의심의 여지 없이 위협받게 됩니다. 지속적인 해군 주둔과 성공적인 외교 행동만이 직접적인 전쟁 없는 미래를 볼 수 있는 유일한 길이며, 이는 곧 우리의 유일한 선택지라는 뜻입니다."
 AST_the_groundwork: "기초 작업"
 AST_the_groundwork_desc: "우리가 하려는 일을 위한 기반 시설을 마련하는 데 힘든 노력이 투입되어야 합니다. 현재의 조선소와 관련 부서 공간을 대규모로 확장하는 사업이 신속히 시행되어야 하며, 예상대로 다소 비용이 들 것입니다."
 AST_expand_command_capabilities: "지휘 역량을 확대한다"
 AST_expand_command_capabilities_desc: "우리가 목표하는 규모를 고려하면 이를 관리하기 위해 해군 본부와 국방부를 확대해야 합니다. 전환 기간 동안 두 조직을 긴밀히 연결하고 생산 증대를 감독하는 데에는 비용이 들겠지만 필요한 일입니다."
 AST_carrier_project: "항공모함 사업"
 AST_carrier_project_desc: "오스트레일리아가 자체 항공모함을 보유했던 것은 그리 오래전이 아닙니다. HMAS 시드니와 멜버른은 어떤 교전에도 적합했으며 바다의 진정한 미녀들이었습니다. 시대가 바뀌고 군사비가 줄면서 그러한 거함은 더 이상 유지할 수 없게 되었습니다. 지금까지는 말입니다. 항공모함이 우리 함대로 돌아올 것이며 퇴역한 함선들의 유산은 계속 이어질 것입니다."
 AST_like_submarines_in_a_barrel: "통 속의 잠수함처럼"
 AST_like_submarines_in_a_barrel_desc: "우리는 항공모함 공백을 메워야 하며, 이를 위해 헬리콥터를 활용해야 합니다. MH-60R 시호크는 우리의 기동성 목표를 달성하는 대표적인 사례입니다. 이 사업에 투자하여 설계를 발전시키고 생산에 착수할 수 있습니다."
 AST_ship_to_air: "구축함에게 먹이를 주지 마라"
 AST_ship_to_air_desc: "우리의 구축함들은 미사일에 굶주려 있으며, 이들을 먹일 유일한 방법은 더 많은 미사일뿐입니다. 구식 기술로는 안 됩니다. 이 괴물들을 먹이려면 완전히 새로운 것이 필요합니다."
 AST_adf_academies: "ADF 사관학교"
 AST_adf_academies_desc: "군사 훈련과 대학 교육을 결합한 우리의 최고 교육 기관은 캔버라에 있습니다. 하나의 건물에 불과하지만, 우리의 국방 수요를 감안하면 그 수를 크게 늘려야 합니다. 주요 도시마다 여러 곳을 건설하고, 어쩌면 몇몇 요건도 완화할 것입니다."
 AST_the_raaf: "오스트레일리아 왕립 공군"
 AST_the_raaf_desc: "아, 오스트레일리아 왕립 공군. 오스트레일리아의 하늘을 안전하게 지키고 있는 우리의 주력 공중전 부서입니다. ADF 중에서 가장 좋은 군복, 가장 좋은 식사, 가장 멋진 임무를 갖고 있습니다. 하지만 혜택에 연연하지 맙시다. 임무는 주어졌고 과제는 단순합니다. 태평양에서의 제공권 확보와 우리 원정 작전에 대한 지원입니다. 그 방법은 우리의 재량에 달려 있습니다."
 AST_fourth_generation_striking: "4세대 타격"
 AST_fourth_generation_striking_desc: "4세대 항공기를 손에 넣는 것은 쉽지 않을 것이며, 그곳에 이르려면 우리의 인맥과 기술력을 최대한 활용해야 합니다. 3세대와 4세대 전투기의 격차가 그리 크지는 않지만, 5세대가 다가오는 속도를 보면 우리가 뒤처지고 싶지 않다는 것은 분명합니다."
 AST_globemasters: "글로브마스터"
 AST_globemasters_desc: "보잉 글로브마스터 III는 전략 공수와 병력 수송을 위한 우리의 주력 수송기입니다. 보잉은 이 기종에서 확실히 성과를 냈습니다. 이전 기종보다 더 크고 훨씬 강력하지만, 짐작하시겠지만 우리는 한 대를 더 원합니다. 제원을 그들에게 보내고 결과가 충분하기를 기대하겠습니다."
 AST_shadow_in_the_sky: "하늘의 그림자"
 AST_shadow_in_the_sky_desc: "AAI RQ-7 섀도는 현재 개발된 우리의 가장 효과적인 정찰 장비이자 무인 전투 드론입니다. 미국에서 가져온 또 하나의 멋진 기술로 전쟁의 본질에 뚜렷한 변화를 예고합니다. 우리의 기동 기반 시설이 늘어나고 작전 반경이 확대되면서, 전투 수행 능력은 이전에 우리가 할 수 있던 수준을 훨씬 넘어서는 수준으로 사실상 증대되었습니다."
 AST_the_roulettes: "룰렛 에어로바틱 팀"
 AST_the_roulettes_desc: "룰렛은 공군 자체의 공중 곡예비행팀입니다. 이들은 전 세계를 돌며 여러 대담한 시범 비행을 펼쳤고, 이를 볼 수 있었던 운 좋은 사람들의 찬사를 자연스럽게 받았습니다. 핵심은 이들이 날 때마다 우리의 평판이 올라간다면, 얼마든지 날게 놔둬야 한다는 것입니다."
 AST_employ_ballistic_missiles: "탄도 억제력을 운용한다"
 AST_employ_ballistic_missiles_desc: "장거리 정밀 타격 미사일은 분쟁을 억제하기 위해 자주 동원됩니다. 대립 회피와 전면전 사이의 회색선 위에서 줄타기를 하게 해 주는 마법 같은 도구입니다. 예를 들어 해외 기지 한 곳이 공격받는다면, 우리는 \\"비례적 대응\\"으로 장거리 미사일을 이용해 똑같이 전략적인 지점을 타격할 수 있으며, 모두가 자존심에 약간의 상처만 입은 채 전쟁 걱정 없이 만족하며 돌아갈 수 있습니다. 이론상으로는 말입니다."
 AST_project_wedgetail: "웨지테일 사업"
 AST_project_wedgetail_desc: "보잉 E-7 사업은 기동 지휘소 분야에서 최근에 추진한 사업 중 하나입니다. 기체 상단에 장착된 레이더 덕분에 조기 경보 체계와 전장에 대한 실시간 위치 정보를 제공합니다. 물론 이 기체는 우리의 재량에 따라 개조하여 다른 항공 용도로도 사용할 수 있습니다."
 AST_keep_them_out: "들어오지 못하게 한다"
 AST_keep_them_out_desc: "적기를 탐지하는 것과 적기가 오스트레일리아 도시들을 기총소사하지 못하도록 실제로 억제하는 것은 별개의 문제입니다. 우리 항공기가 항상 하늘에 있을 수는 없으므로, 이동식 및 고정식 'NASAMS' 체계가 그 자리를 대신할 것입니다. 레이더와 함께 운용되는 이 체계는 강력한 방어 전력입니다."
 AST_preserve_the_super_hornets: "슈퍼 호넷을 보존한다"
 AST_preserve_the_super_hornets_desc: "F-111이 퇴역한 이래 24대의 F/A-18F 슈퍼 호넷이 그 자리를 대신해 왔으나, 이들 또한 기령이 높아지고 있습니다. 기종을 개량하고 내부 체계 여러 가지를 갱신하여 새로운 역할에 대비하도록 할 수 있습니다."
 AST_masters_of_command: "지휘의 달인들"
 AST_masters_of_command_desc: "작전에 헬리콥터 수송을 활용하면서 우리의 기동 잠재력은 혁신적으로 높아졌습니다. 공항이 필요 없는 헬리콥터는 긴장도가 높은 지역과 변화하는 전장에 가장 적합한 수단입니다. 헬리콥터 수송 작전 전담 기관을 설치하면 전반적인 숙련도가 향상될 것입니다."
 AST_reopen_cockatoo_island: "코카투 섬을 재개장한다"
 AST_reopen_cockatoo_island_desc: "수리 선거에 대한 수요가 커지면서 기존 기반 시설이 한계에 이르기 시작했습니다. 90년대에 폐쇄되었으나 지금은 관광지가 되다시피 한 코카투 섬은, 최신 세대의 파손된 함선을 수리하기 위해 처음부터 다시 지어야 합니다."
 AST_the_howard_government: "하워드 정부"
 AST_the_howard_government_desc: "우리나라에 해가 떠오릅니다. 아름다움이 풍부하고, 황금빛 대지를 지녔으며, 참으로 바다에 둘러싸인 나라입니다. 오스트레일리아는 많은 친구와 적은 적을 가진 나라로서 태평양 지역 강국으로서의 위상이 독보적입니다. 그러나 오스트레일리아인들은 더 나은 내일을 갈망하며, 많은 이들이 사회의 틈새로 떨어졌습니다. 노동자 계층이 지난 선거에서 하워드 정부 주위로 결집하여 자유당은 안정적인 과반 의석을 누리게 되었습니다. \n\n이제 신중한 변화를 위한 위임이 우리에게 주어졌으며, 우리는 이를 이행해야 합니다. 키팅 정부는 예산에 상당한 구멍을 남겼고, 우리가 엄격하게 메워 왔음에도 이를 흑자로 끌어올려야 하는 과제는 여전히 남아 있습니다. 거리에는 시위대가 행동을 요구하며 넘쳐나고, 우리 기업들은 경제 개혁을 촉구하고 있습니다. \n\n행운의 나라는 우리 손에 달려 있습니다."
 AST_new_millennium_economics: "새 천년의 경제학"
 AST_new_millennium_economics_desc: "예산안이 제출되어 승인되었습니다. 재정 건전성과 예산 흑자는 가장 많이 요구되는 정책이지만, 그렇다고 해서 나중에 이익을 거두기 위해 조금 지출하지 못한다는 뜻은 아닙니다. 정부의 비대해진 여러 자산은 매각하기에 적합하며, 다른 사업의 확장 재원을 마련하기 위해 삭감할 수 있는 항목도 아직 많습니다. \n\n중앙은행은 이미 정책금리를 인상했습니다. 이제 우리가 뒤따를 차례입니다. 언제나처럼 엄격하되 공정할 것입니다."
 AST_trim_taxes: "세금을 줄인다"
 AST_trim_taxes_desc: "지난 선거에서 우리는 열심히 일하는 오스트레일리아인들을 위해 세금을 줄이겠다고 약속했습니다. 우리의 입장은 바뀌지 않았습니다. 고령 주민과 고소득자가 가장 먼저 연이은 감세 혜택을 받을 수 있으며, 그만큼 지역 기업에 더 많은 자금이 흘러 들어가고 은행에도 더 많은 돈이 남게 됩니다."
 AST_restrict_welfare: "실업수당 부정수급자를 줄인다"
 AST_restrict_welfare_desc: "실업수당 확대로 당 내 예산에 신중한 이들이 불안해하고 있습니다. 비대해지는 것을 늦출 방법이 없다면 지난 몇 년간 재정 균형을 맞추기 위해 기울인 노력이 물거품이 될 것입니다. 제도의 범위를 제한하고 수급을 유지하기 위한 엄격한 요건을 두는 것부터 시작하면 해결될 수 있습니다. 상호 의무를 강화하면 생산성이 낮은 수급자 일부도 걸러낼 수 있습니다."
 AST_another_round_of_tax_cuts: "또 한 차례의 감세"
 AST_another_round_of_tax_cuts_desc: "기업을 생각하지 않는 정부라면 어떤 정부이겠습니까. 우리 임기 동안 많은 성장이 이루어졌으나, 일부 소기업과 심지어 몇몇 대기업까지도 생산성 둔화를 보이고 있습니다. 추가 감세와 경쟁을 자극할 약간의 개혁으로 이들의 어려움을 덜어줄 수 있습니다."
 AST_launch_the_gst: "GST를 도입한다"
 AST_launch_the_gst_desc: "법안이 통과되어 '재화 및 용역세'가 이제 지난 시절의 구식 제도를 대체할 수 있게 되었습니다. 리스를 비롯한 반대론자들이 불평할 수 있겠지만, GST는 시험대를 통과했습니다. 기업은 간소화된 일괄 세제의 혜택을 볼 수 있고 예산에도 해가 되지 않을 것입니다."
 AST_cater_to_the_seniors: "고령층을 배려한다"
 AST_cater_to_the_seniors_desc: "건전한 정부라면 때때로 초당적 협력을 시도하기 마련입니다. 야당의 정책이라 하더라도 국민에게 최선의 이익이 된다면 고려해야 합니다. GST는 예산에 상당한 보탬이 되었지만, 많은 고령층은 그 혜택을 체감하지 못하고 있습니다. 기본 식료품을 제도에서 면제하고 연금 수급자에게 넉넉한 보상을 제공하면 충격이 완화될 것입니다. 자유당이 이념적 순수성이라는 장작더미 위에서 희생될 수는 없습니다."
 AST_rethink_negative_gearing: "네거티브 기어링을 재고한다"
 AST_rethink_negative_gearing_desc: "네거티브 기어링을 장려하기 위한 우리의 변경은 논란이 없지 않았습니다. 주택 소유자들, 특히 고령 지지층은 변경을 환영했지만, 내 집을 마련할 형편이 안 되는 이들은 짧은 기간에 집값이 치솟는 것을 지켜보았습니다. 정부 내 노동당 성향이 강한 이들은 임기가 끝나기도 전에 부작용이 확산되는 것을 보고 있습니다. 고령층과의 호의를 해칠 수도 있으나, 장기적으로 건전한 경제가 그 피해를 만회할 수 있을 것입니다. 서민층이 계속 충성하기만을 바랄 뿐입니다."
 AST_first_home_first_served: "첫 주택, 먼저 지원"
 AST_first_home_first_served_desc: "GST로 인한 또 다른 피해 예상 집단은 첫 주택 구입자입니다. 건축 자재 가격이 오르는 만큼, 첫 주택 구입자에게 지급할 7000달러의 보조금을 마련했습니다. 경쟁이 치열해지는 시장에서 이들이 첫발을 내딛도록 돕기 위해서입니다."
 AST_meeting_the_mining_giants: "광업 거물들과의 면담"
 AST_meeting_the_mining_giants_desc: "국가 지도자가 큰손들과 만나는 일은 드물지 않습니다. 볼더 상공회의소가 직접 면담을 요청했는데, 우리의 최근 감세에 고무된 것으로 보입니다. 이들이 더 많은 요구를 할 만큼 대담해졌으리라 예상할 수밖에 없습니다. 이를 수용할지는 궁극적으로 우리에게 달려 있습니다."
 AST_proud_and_free: "자랑스럽고 자유롭게"
 AST_proud_and_free_desc: "기술 인력 부족과 실업으로 가장 고통받는 지역을 살펴보면, 조기 학업 중단자와 실업자를 대상으로 한 기술 대학을 최대 24곳까지 설립하는 데 집중할 수 있습니다. 또한 실업수당 대가 근로 제도를 견습생에게도 확대하면 대학생과 같은 선상에 놓이게 됩니다. 국방군도 장비와 정비의 일부를 추가 기술 교육에 할애하기로 약속했습니다. \n\n학생들은 더 자유롭게 자신의 직업적 열정을 추구할 수 있고 우리 제조업은 강화될 것입니다. 이는 십여 개의 저소득 지지 기반을 한꺼번에 충족시키며, TAFE 청년층으로 우리의 지지 기반도 확실히 넓혀 줄 것입니다."
 AST_invest_in_people: "사람에게 투자한다"
 AST_invest_in_people_desc: "밑바닥에 떨어진 사람들이 스스로 다시 일어서기란 쉽지 않습니다. 장기 실업을 조장하지 않으면서도 TAFE 및 기타 국방·지역사회 사업의 교육 프로그램에 참여하도록 유인책을 포함시켜 이들을 불이익에서 벗어나게 할 수 있습니다. 공짜 지원금이라기보다 노동자들의 미래에 대한 투자입니다."
 AST_beef_up_the_dole: "실업수당 대가 근로를 강화한다"
 AST_beef_up_the_dole_desc: "지금까지 우리의 실업수당 대가 근로 제도는 대성공이었습니다. 실업자가 줄었고, 프로그램에 참여한 이들은 노동 적성을 높이느라 바쁩니다. 제도를 공공 사업으로 확대하고 적합한 신청자의 연령 범위를 넓힐 수 있습니다."
 AST_the_baby_bonus: "출산 장려금"
 AST_the_baby_bonus_desc: "이제 아이를 낳는 것이 경제적 위험을 동반하지 않을 것입니다. 출산 수당을 대체하여 새 어머니들은 3000달러를 일시금으로 받게 됩니다. 젊은 가정이 용기를 내도록 장려하고 부모가 되는 데 따르는 부담을 덜어 줄 것입니다."
 AST_protect_the_water: "물을 보호한다"
 AST_protect_the_water_desc: "내륙 가장 먼 곳의 일부 강은 악천후가 일주일만 이어져도 완전히 말라 버릴 수 있으며, 그러면 농장과 마을 전체가 물을 잃습니다. 국가 물 구상은 우리의 지속 가능성 추구의 첫걸음입니다. 가장 외진 지역 사회의 물 사용을 관리하고 지속 가능한 취수 수준을 유지하면 수백만 명이 쓸 물의 공급이 이어집니다."
 AST_the_kyoto_protocol_ast: "교토 의정서"
 AST_the_kyoto_protocol_ast_desc: "우리는 이미 UN의 제안에서 공정한 조건을 협상했습니다. 이를 비준하면 온실가스 감축을 이미 약속한 다른 84개국과 어깨를 나란히 하게 됩니다. 우리가 지구 온난화에 미치는 영향이 무엇이든, 이를 최소한으로 줄이고 오스트레일리아가 이 문제에서 책임 있는 국가임을 보여줄 수 있습니다."
 AST_the_carbon_pollution_reduction_scheme: "탄소 오염 감축 제도"
 AST_the_carbon_pollution_reduction_scheme_desc: "러드는 기업이 오염 수준을 그 이하로 유지해야 하는 '상한'을 활용하여 우리 산업이 배출하는 현재 탄소량을 총 25% 감축하는 제도를 제안했습니다. 러드는 이상이 높은 사람이며 기후 변화에 관해서는 불평꾼이지만, 대중은 그를 지지합니다. 화석 연료에서의 경쟁 우위를 해치지 않을 만큼만 제도를 손본다면 무사히 넘어갈 수 있을지도 모릅니다."
 AST_the_drought_force: "가뭄 대응단"
 AST_the_drought_force_desc: "지금까지 새 세기로의 전환은 순탄치 않았습니다. 가장 큰 우려의 징후는 아마 \\"밀레니엄 가뭄\\"으로, 우리나라 역사상 최악의 가뭄일 수도 있습니다. 긴급 대응 인력이 이미 가뭄 대응에 동원된 상황에서, 정부 차원에서 더 가까운 방안을 찾기에는 여력이 부족합니다. 우리는 이미 실업수당 대가 근로 참가자들을 공공 사업에 투입했으며, 이제 이들을 이 자연재해의 영향을 받은 사유지에 집중 투입할 수 있습니다."
 AST_a_nation_worth_preserving: "지킬 가치가 있는 나라"
 AST_a_nation_worth_preserving_desc: "우리는 국가의 지속 가능성을 지속적으로 개선해 왔습니다. 세계 전체에는 영향이 없을지 몰라도, 오스트레일리아인들에게는 그들이 사랑하는 나라가 존속할 것입니다. 물은 더 맑아졌고 도시의 스모그는 사라졌습니다. 해야 할 일이 더 남아 있을 수 있고, 더 깨끗한 에너지나 보존 방안이 더 있을 수 있지만, 지금은 더 자랑스러운 국가로서 한숨 돌릴 수 있습니다."
 AST_practical_reconciliation: "실질적 화해"
 AST_practical_reconciliation_desc: "\\"오늘 우리가 모인 이 땅의 전통 소유자들께 경의를 표하며 시작하고자 합니다. 또한 과거와 현재의 원로들께도 존경을 표합니다.\\" \n\n공허한 말처럼 들릴지 모르지만, 원주민 오스트레일리아인들과의 관계는 갈등이 없지 않았습니다. 모든 정부는 존엄과 존중으로 역사를 인정해야 하며, 리더십에는 책임이 따릅니다. 우리가 어떻게 나아가든 과거를 인정하고 미래를 받아들입니다. 절제된 접근으로 오스트레일리아인들을 하나로 묶을 것입니다."
 AST_walk_the_journey: "여정을 함께 걷는다"
 AST_walk_the_journey_desc: "많은 오스트레일리아인에게 길고도 힘든 길이었다는 것을 압니다. 우리가 도운 사람이 아무리 많다 해도, 여전히 남아 있는 이들이 없는 척하는 것은 순진한 일입니다. 그 격차를 치유하고 뒤처진 이들을 끌어올리려는 우리의 노력은 보건, 교육, 주거, 고용에 초점을 맞춘 프로그램에서 시작되어야 합니다. 이미 의회에서 논의된 프로그램들은 재정 지원을 받고 확대될 것입니다. 소외된 이들과 연립은 손을 맞잡고 걸을 것입니다."
 AST_a_national_apology: "국가의 사과"
 AST_a_national_apology_desc: "키팅은 우리를 따돌리려 합니다. 좋습니다, 노동당의 방식으로 맞서 주겠습니다. 가디언의 그 멍청이들이 원하는 것을 주겠습니다. 이전 세대의 책임을 떠안고 나면 앞으로 나아갈 수 있습니다. 원주민 오스트레일리아인들은 정당한 대우를 받게 될 것이며, 내가 그들을 돕지 않았다고 말할 사람은 없을 것입니다."
 AST_its_mabo_its_the_vibe: "마보 판결, 바로 그 분위기"
 AST_its_mabo_its_the_vibe_desc: "마보 사건은 대법원의 획기적인 판결이었습니다. 에디는 원주민 토지권, 즉 식민 이전 토지의 존재를 위해 싸웠고 무주지 원칙을 영원히 끝냈습니다. \n\n원주민 공동체와 협력하고 헌법 전문에 화해 선언을 포함하는 개정안을 제안함으로써, 우리는 기존의 원주민 토지권법을 확대하여 토지에 대한 그들의 권리를 인정하게 됩니다. 어쩌면 상징적일 수 있지만, 우리가 평등에 진지하다는 것을 보여줍니다. 모든 유권자가 동등하게 발언권을 갖게 될 것입니다."
 AST_the_civil_partnership_act: "시민 동반자법"
 AST_the_civil_partnership_act_desc: "현재 주 및 준주는 동성 커플이 연인 관계임을 인정하는 것조차 제한하고 있으며, 이로 인해 이들에게 법적으로 여러 사소한 문제가 발생할 수 있습니다. 우리는 동성 결혼 문제를 도덕적 입장에서 다루지는 않겠지만, 결혼을 원하지 않는 이들을 도울 수 있고, 최소한 이 결정을 투표에 부칠 수는 있습니다."
 AST_avoid_the_speech: "연설을 피한다"
 AST_avoid_the_speech_desc: "저는 원칙의 문제로서 한 세대가 이전 세대의 행위에 책임을 질 수 있다고 믿지 않습니다. 원칙의 문제로서 그것을 받아들이지 않습니다. 이 정부는 공허한 제스처를 내놓거나 정치적 점수를 얻기 위해 원주민 문제를 형식적으로 처리하는 모습을 보이지 않을 것입니다. 연립은 이 문제에서 단결된 모습을 보여야 합니다. 화해 행진에 참석하겠다는 이야기는 싹부터 잘라야 합니다."
 AST_crack_down_on_protests: "시위를 단속한다"
 AST_crack_down_on_protests_desc: "야유도, 시위도, 모두 그만두어야 합니다. 모두 진정해야 합니다! 어떤 방법을 쓰든 상관없습니다. 헤드라인을 바꾸고 치안을 강화하십시오. 진짜 현안이 조명을 받고 이 불량배들을 통제할 수 있다면 무엇이든 좋습니다. 저는 그들의 자화자찬을 신경 쓰지 않을 것입니다. 사실 아예 관심조차 주지 않겠습니다! 우리의 정책은 죄책감 자극과 군중 정치에 대한 거부로 칭송받을 것입니다. 확신합니다."
 AST_abolish_the_atsic: "ATSIC를 폐지한다"
 AST_abolish_the_atsic_desc: "별도 대표 제도라는 실험은 지금까지 실패였습니다. 10년간 자금이 투입되었으나 원주민 공동체에는 실질적인 이익이 전혀 없었습니다. 더 나쁜 것은 부실 경영, 부패, 사기 의혹 등이 끊이지 않는다는 점입니다. 더 이상은 안 됩니다. 이 기관을 폐지하고 그 재원에서 건질 수 있는 것은 모두 건지겠습니다."
 AST_with_safer_communities: "더 안전한 지역 사회와 함께"
 AST_with_safer_communities_desc: "북부 외딴 원주민 공동체의 아동 학대와 붕괴 보고는 완곡하게 말해도 국가적 재난입니다. 도덕적 개입에 대한 초당적 지지는 쉽게 얻을 수 있었습니다. 우리는 병력을 파견하고, 복지를 제한하며, 의무 건강 검진과 감시를 시행할 것입니다. 지역 사회에서 음란물과 술은 금지되며, 마침내 토지권을 정부에 되돌릴 수 있습니다. 일부 조치는 인종차별금지법의 효력 정지를 요구하므로 평의원들과 지역 단체들이 불평하겠지만, 법과 질서가 회복되면 감사하는 사람은 현지 주민들만이 아닐 것입니다."
 AST_we_are_many: "우리는 다수다"
 AST_we_are_many_desc: "우리는 의심할 여지 없이 다양한 나라입니다. '백호주의' 정책 시기에도 이 나라는 서로 출신이 같지 않은 유럽인들로 넘쳐났습니다. 이제 나라는 많은 이들에게 문을 열었고, 그 유입을 관리할 책임은 우리에게 있습니다. 이 문제를 어떻게 다스리느냐가 수십 년 뒤 오스트레일리아의 구성을 결정짓게 됩니다. 부유한 자든 강한 자든, 정책과 수백만 명의 삶을 결정하는 것은 우리입니다."
 AST_widen_our_net: "그물을 넓힌다"
 AST_widen_our_net_desc: "이민 당국은 '백호주의 정책' 이후 먼 길을 왔지만, 솔직히 그 수는 여전히 적고 매우 적습니다. 경제가 호황을 이어가는 속도로 볼 때 인력 부족이 새로운 문제로 대두될 것입니다. 이를 해결하기 위해 외국인 노동자 유입을 확대하는 동시에, 균형을 맞추기 위해 숙련 이민자에 대한 강조를 강화하고 신규 이민자의 복지 접근은 축소합니다. 이는 여야 양측을 동시에 만족시키는 동시에 대기업에도 호소력이 있을 것입니다."
 AST_with_open_arms: "두 팔을 벌려"
 AST_with_open_arms_desc: "이 나라는 언제나 다문화 국가였고, 바다를 통한 입국이 필수적인 나라였습니다. 모두가 올바른 경로로 오지는 않았지만, 그들은 세계 곳곳에서 망명을 신청했습니다. 언젠가 이 풍요로운 나라를 누리는 수백만 명의 일원이 되기를 바라면서 말입니다. 현행 정책의 비효율을 간소화하면 진정한 망명 신청자에게 더 짧은 수용 기간을 보장할 수 있습니다. 자녀가 있는 가족은 수용소에서 지역 사회 주택으로 옮겨지며, 2년 넘게 수용된 이들에 대해서는 민간 조사가 시행됩니다."
 AST_girt_by_border_patrol: "국경 순찰로 둘러싸여"
 AST_girt_by_border_patrol_desc: "오스트레일리아는 섬일지 모르지만 그 때문에 해상 침입에 취약합니다. 해상에서 벌어진 사건들로 인해 기존 국경 순찰대는 평소보다 곤란한 처지에 놓였습니다. 해안을 확실히 지킬 능력이 없다면 우리 군이 이 나라를 안전하게 지킬 수 있으리라 어떻게 기대하겠습니까? 국경 보호법이 있으면 선박을 돌려보낼 우리 함대의 권한에 의문이 없을 것이며, 그렇게 한 장교들이 부당한 법적 조치를 받지 않도록 보호할 것입니다."
 AST_the_pacific_solution: "태평양 해법"
 AST_the_pacific_solution_desc: "합법 이민은 줄었으나 불법 이민은 줄지 않았습니다. 매년 수천 명의 이민자가 서류 없이 우리 해안에 상륙하고 있으며 그 수는 늘기만 하는 듯합니다. 기존 기반 시설이 한계에 이르면서, 이들의 지위를 판단하는 동안 망명 신청자를 수용하기 위해 나우루와 마누스 섬에 해외 수용 시설이 건설될 것입니다. 두 나라에는 공정하게 보상하겠습니다. 이어서 정당한 망명 신청이 가능한 본토 영역을 줄여, 새치기하는 이들의 유인을 더욱 약화시킬 것입니다."
 AST_for_bright_minds: "영민한 인재를 위해"
 AST_for_bright_minds_desc: "외국인 유학생은 우리 주요 대학들에게 무시할 수 없는 수입원이 되어가고 있습니다. 현재는 제한된 유학 비자를 통해 소수만이 들어올 수 있지만, 요건을 조금만 조정해도 훨씬 더 많은 학생이 해외에서 이곳으로 오게 되고 훨씬 많은 돈이 교육 부문으로 흘러 들어갈 것입니다."
 AST_strong_in_difference: "다름 속의 강함"
 AST_strong_in_difference_desc: "우리는 문화적으로 다양한 서로 다른 사람들로 이루어진 인구를 관리해 왔고, 이들은 새로운 오스트레일리아의 정체성으로 융합되었습니다. 우리는 모두 생김새가 다르고 저마다 다른 강점이 있지만, 함께 오스트레일리아를 건설하고 있습니다. 직장은 영민한 인재들과 이 나라의 꿈을 좇아 성공한 이들로 가득합니다. 소속감의 꿈, 그리고 우리가 그래 왔듯 서로 어울려 살아가는 꿈입니다."
 AST_tear_out_the_roots: "뿌리를 뽑는다"
 AST_tear_out_the_roots_desc: "우리의 안보 문제 상당수가 인도네시아에서 시작되고 끝난다는 것은 잘 알려져 있습니다. 가장 강력한 인접국이며 극단주의 세력에 매우 취약한 나라입니다. 양국 간에 양해가 이루어진다면, 특히 그 나라 내 반란 세포 조직을 뿌리 뽑기 위한 협력이 이루어진다면 양측 모두 이익을 얻을 것입니다. 이는 장래의 더 긴밀한 협력을 위한 토대가 될 것입니다."
 AST_welcome_the_experts: "전문가를 환영한다"
 AST_welcome_the_experts_desc: "우리에게는 이미 가장 영민한 인재들이 있을지 모르지만, 해외에서 더 초청한다고 해서 손해될 것은 없습니다. 연구개발에서 우리가 직면한 난관 일부를 매끄럽게 해결해 줄지도 모릅니다. 기존의 SkillSelect 제도를 활용하면 현대 세계 곳곳의 숙련 이민자들에게 비자를 확대할 수 있습니다."
 AST_protected_on_all_sides: "사방이 보호받는다"
 AST_protected_on_all_sides_desc: "황금빛 바다 위로 해가 저물 때, 국민들은 나라의 사방에서 해역을 순찰하는 우리 순찰대가 자신들을 지켜 주고 있음을 알고 안심할 수 있습니다. 다른 나라 사람들이 우리 해변으로 뛰어든다는 공포가 언론에서 불거질 때에도, 정부가 뒤에 있으므로 이것이 단지 공포 조장일 뿐임을 알게 될 것입니다. 자신들의 미래가 확고하다는 것도 말입니다."
 AST_the_howard_doctrine: "하워드 독트린"
 AST_the_howard_doctrine_desc: "1999년 동티모르 개입 이후 일부 언론인들이 이 용어를 만들어 쓰기 시작했는데, 우리를 태평양의 많은 나라에게 가장 먼저 의지할 수 있는 제공자로 묘사하려는 것이었습니다. 그것이 정확한 평가일 수는 있으나, 저는 우리의 독트린이 그러한 입장에 한정되지 않는다고 믿습니다. \n\n제가 총리가 되기 전, 이 나라는 세계에서의 자리를 지나치게 좁게 규정하고 있었습니다. 우리 정부는 우리가 서 있는 문화와 역사의 독특한 교차점을 더 잘 반영하도록 오스트레일리아의 외교 정책을 재조정할 역량이 있습니다. 시간이 흐를수록 우리가 역사와 지리 중 하나를 택해야 하는 것이 아니라는 저의 믿음은 더욱 굳어졌습니다. 우리는 전통적 동맹 및 충성에 계속 충실하면서도 이 지역에서 새로운 파트너십을 구축하고 강화할 수 있는 독특한 유연성의 위치에 있습니다."
 AST_deputy_peacekeepers: "부보안관 평화유지군"
 AST_deputy_peacekeepers_desc: "앤디 그리피스 쇼에서 바니 파이프는 마을 보안관 앤디 테일러의 부보안관입니다. 보안관이 자리를 비운 때에는 바니가 질서를 유지하고 대신 일을 맡아야 합니다. 베를린 장벽 붕괴 이후 미국의 세계 치안 역할은 의심할 여지가 없어졌지만 새로운 위협이 날마다 나타나고 있으며, 그중 일부는 오스트레일리아와 불편할 만큼 가까운 곳에 있습니다. 바니와 마찬가지로 오스트레일리아도 미국이 다른 곳에 있는 동안 태평양을 순찰하는 임무를 맡은 처지입니다. 쉬운 위치는 아니지만 기꺼이 맡겠습니다."
 AST_war_on_the_terrible: "끔찍한 것들과의 전쟁"
 AST_war_on_the_terrible_desc: "오늘날 테러에 대응하는 고전적 정의와 방식은 한심스러울 만큼 시대에 뒤떨어졌습니다. 오스트레일리아인에게 해를 끼치려는 자들은 오늘날의 기술에 훨씬 빠르게 적응하고 있습니다. 테러에 대한 법적 정의를 개정하는 법안을 도입하고 이를 행하는 개인을 처벌하는 법을 바꾸는 것이 효과적인 첫걸음입니다. ASIO의 구금 권한과 감시 역량을 강화해야 뒤처지지 않을 수 있으며, 우리 부대들이 위협이 현실이 되기 전에 제압할 기동 대응력도 갖출 수 있습니다."
 AST_new_wave_counter_terrorism: "신세대 대테러"
 AST_new_wave_counter_terrorism_desc: "새로운 개정안으로도 충분하지 않습니다. 오스트레일리아 땅에서 임박한 테러 공격에 관한 정보가 더 들어올수록 우리의 권한이 몇 배로 늘어나야 한다는 것이 더욱 분명해집니다. ASIO와 경찰력을 확대해야 합니다. 대테러 급습, 예방적 구금, 그리고 지역 경찰에게 '검문 및 수색' 권한을 부여하는 것이 위협을 색출해 낼 것입니다. 논란이 될 조치라는 점은 알지만, 우리의 상황에는 어설픈 대책 이상이 필요합니다."
 AST_commit_to_foreign_intervention: "해외 개입에 전념한다"
 AST_commit_to_foreign_intervention_desc: "분쟁은 세계 거의 모든 대륙에서 커졌습니다. 예외는 오스트레일리아뿐입니다. 우리가 지금까지 그렇게 유지할 수 있었고 앞으로도 그럴 수 있는 유일한 방법은 공개적 분쟁이 우리 해역으로 번지지 않도록 하는 것입니다. 이러한 위협이 걷잡을 수 없게 되기 전에 개입할 수 있는 능력이 이를 위해 필수적입니다. 중동과 동남아시아의 표적들은 테러 조직의 온상이지만, 국가 안보 이익에 부합한다면 어디서 어떻게 개입할지는 우리가 선택할 수 있습니다."
 AST_place_rudd_in_the_fire: "러드를 불길 속에 둔다"
 AST_place_rudd_in_the_fire_desc: "케빈 러드는 우리가 법안을 통과시키려 할 때 야당 내에서 점점 골칫거리가 되고 있는 듯합니다. 더 나쁜 것은 그가 대중의 눈에서 호응을 얻고 있다는 점입니다. 현재 그는 외교 그림자 내각 장관이지만, 그를 우리 쪽 외교 위원회에 배치하면 어떨까요. 태평양 외교를 맡기는 것입니다. 이는 반발로부터 우리를 보호해 줄 뿐 아니라 그의 시선을 대테러 법안에서 떼어놓을 것입니다."
 AST_our_capacity_for_peace: "우리의 평화 역량"
 AST_our_capacity_for_peace_desc: "중국과 대화를 시작하려던 러드의 노력이 실제로 결실을 맺었습니다. 이들은 태평양에서 공동 평화유지 구상을 협상할 의향이 있습니다. 이런 기회는 자주 오지 않으며, 중국과 대등한 위치임을 보여주면서 장래의 협력을 규정할 수 있습니다. 무릎을 꿇는 것이 아니라 태평양의 안전을 지킨다는 공동의 이익을 나누는 것입니다."
 AST_off_to_delhi: "델리로"
 AST_off_to_delhi_desc: "우라늄은 여전히 우리의 최대 미개발 광물 매장량이며, 우리 기업들은 굴착이 시작되기 전에 새로운 수출 파트너와 연결되기를 열망하고 있습니다. 모든 정황으로 보아 인도가 당연한 고객입니다. 남아시아의 신흥 강대국으로서 아라비아해에서 자신의 의지를 관철할 만큼 강력합니다. 우리의 영향권이 커짐에 따라 인도는 매우 유용한 동맹이 될 수 있으며, 최소한 우리 우라늄을 믿고 수입해 줄 상대가 될 것입니다."
 AST_marks_gambit: "마크의 승부수"
 AST_marks_gambit_desc: "싱가포르가 독립한 이래 두 나라의 관계는 시종일관 우호적이었습니다. 다음 단계로 나아가는 것은 자연스러운 일입니다. 믿음직한 무역장관 마크 베일은 지난 20년간 우리가 제안한 첫 본격적인 양자 무역 협정을 추진해 왔습니다. 동시에 그는 대다수 품목을 무관세로 하는 비슷한 협정을 놓고 태국에도 타진해 왔습니다. 오스트레일리아를 드나드는 상품의 이동을 자유롭게 하는 것은 우리 재선의 핵심 신조였으며, 당이 이를 통해 최대한 홍보 효과를 거두려 하겠지만 그 혜택을 거두는 것은 오스트레일리아 국민입니다."
 AST_fossil_fuels_for_yuan: "화석 연료를 위안으로"
 AST_fossil_fuels_for_yuan_desc: "중국과의 외교는 아무 문제 없이 진행되고 있습니다. 급속한 산업화를 위한 중국의 잠재적 노력은 석탄에 대한 갈증을 낳았고, 다행히 우리에게는 석탄이 풍부합니다. 중국과 협상을 시작하는 것은 서로에게 이득이 되는 일로 보이며, 우리가 다른 아시아 국가들에게도 더 매력적인 무역 파트너가 되도록 만들 수 있습니다."
 AST_partner_with_the_japanese: "일본과 손잡는다"
 AST_partner_with_the_japanese_desc: "아시아 무역은 유럽과의 연결을 급속히 앞지르고 있습니다. 우리의 이해관계가 훨씬 더 지역적인 쪽으로 옮겨갔으니 당연한 일입니다. 사업에서 일본인은 마주칠 수 있는 가장 빈틈없는 상대 중 하나이며, 외교에서도 마찬가지입니다. 이들은 우리 쪽의 양보를 대가로 우리의 농산물 수출을 받아들일 의향이 있습니다. 전자제품과 자동차에 대한 관세 인하는 뻔한 요구였지만, 그들이 더 요구할 것이라고 짐작합니다."
 AST_to_promote_our_spirit: "우리의 정신을 알린다"
 AST_to_promote_our_spirit_desc: "우리의 해외 노력은 훌륭한 결실을 맺었습니다. 더 많은 사람이 오스트레일리아를 새롭게 보고 태평양의 주요 파트너로 인식하고 있습니다. 국민도 우리의 성과를 보고 오스트레일리아 정신을 있는 그대로 기뻐해야 합니다. 우리나라를 홍보하는 TV 광고와 온라인 게시물에 자금을 지원할 수 있으며, 이는 관광 마케팅을 겸합니다. 우리 당의 로고를 하단 구석에 넣는 것도 나쁘지 않을 것입니다. 우리의 노력에 대한 최소한의 보상입니다."
 AST_the_coalition_convention: "연립 전당대회"
 AST_the_coalition_convention_desc: "전당대회는 연설과 존재감을 호소하는 간청이 외면당하고 다른 사람이 차기 연립 지도자로 뽑히면서 경력이 끝나는 자리인 경우가 많습니다. 그러나 때로는 끈기가 보답을 받습니다. 이제 연립에는 이미 중책을 맡을 만큼 강한 지도자가 있으며, 이번에는 훌륭한 연설을 하는 일만 남았습니다."
 AST_wholesale_economics: "전면 민영화 경제학"
 AST_wholesale_economics_desc: "'도매'라는 용어는 보통 소매업자나 산업 판매처를 가리키지만, 일부는 정부 자산을 민영화하는 행위를 일컫는 데 이 말을 써 왔습니다. 우리는 정부의 비효율을 정리하는 데 냉혹하지 않았습니다. 전혀 그렇지 않았습니다. 그래서 노력을 조금 더 끌어올려야 합니다. 정리할 기관이 수없이 많고, 적절한 입찰자를 찾는다면 상당한 수입을 올릴 수 있습니다. 반대로 노동 부문에는 현명하게 선택한다면 우리의 훌륭한 수입에 타격을 주지 않을 투자 방안이 몇 가지 있습니다."
 AST_finalize_the_telstra_sale: "텔스트라 매각을 마무리한다"
 AST_finalize_the_telstra_sale_desc: "텔스트라 매각은 우리가 관리하기에 부담이 되어 버린 부식된 요소들을 풀어내는 임무를 맡은 정부 회계 담당자들에게 수년에 걸친 시련이었습니다. ASX는 잔여 자산에 대해 충분히 공정한 조건을 제시했으며, 경제적 합리주의자라면 마음이 바뀌기 전에 이를 마무리했을 것입니다. 우리 또한 그렇게 하려 합니다."
 AST_allow_foreign_interests: "외국 이익을 허용한다"
 AST_allow_foreign_interests_desc: "파우스트가 그랬듯, 때로는 악마와 거래해야 합니다. 의회의 낙관론자들은 오스트레일리아가 홀로 생존할 수 있다고 믿게 하려 할지도 모릅니다. 이 섬나라가 세계화 속에서 어떻게든 자급자족을 이룰 수 있다고 말입니다. 그들은 틀렸습니다. 우리 산업은 외국 자본이 달러에 굶주린 우리 경제 기계를 움직이도록 허용해야만 지속할 수 있으며, 언론도 다르지 않습니다. 생존하려면 투자가 필요합니다."
 AST_crush_the_unions: "노조를 분쇄한다"
 AST_crush_the_unions_desc: "노조가 우리 경제, 심지어 정치에까지 미치는 영향력은 최근 몇 년간 너무 넓고 뻔뻔하게 커졌습니다. 그 어떤 조직도 우리의 일에, 하물며 노동자들의 일에 간섭해서는 안 됩니다. 워크초이스 법은 그러한 무시를 바로잡고 공장에서 노조의 존재를 걷어내는 것을 목표로 합니다. 노조를 완전히 쫓아내지는 못하겠지만 사업주에게 싸워볼 기회는 줄 것입니다."
 AST_carve_up_medicare: "메디케어를 해체한다"
 AST_carve_up_medicare_desc: "첫 임기에 손대지 못했던 것이 메디케어를 재검토하는 일입니다. 이 제도가 많은 오스트레일리아인에게 신뢰할 수 있는 최첨단 의료 서비스를 무료로 제공하는 것은 분명하지만, 일부는 이 제안을 악용하고 있는 듯합니다. 제도를 괴롭히는 비효율은 노동당의 부실 운영 아래 비용을 부풀리기도 했습니다. 잘 갈린 칼처럼, 너무 오래 붙어 있던 지방을 도려낼 수 있습니다."
 AST_broadband_blueprint: "광대역 청사진"
 AST_broadband_blueprint_desc: "우리에게는 기술이 있습니다. 네트워크 기반 시설을 재구축하여 기업과 가정 모두에 모든 오스트레일리아인이 최첨단 인터넷 서비스를 이용하도록 할 수 있습니다. 우리가 아는 것을 적용하고 현재의 기반 시설에 도입하려 노력한다면, 매우 짧은 기간에 전국에 구축할 계획을 수립할 수 있습니다."
 AST_curb_outside_interference: "외부 간섭을 제한한다"
 AST_curb_outside_interference_desc: "오스트레일리아 시장과 경제를 세계에 개방한 것은 지금까지 축복이었지만, 국가를 운영하면서 우리가 선을 긋는 지점이 있습니다. 외국인 투자 승인은 언론을 제외한 대부분의 산업에서 기본적인 사업 방식입니다. 케리 패커가 우리 뉴스 미디어에 미친 영향은 과장할 수 없으며, 문이 열린다면 어떤 더 나쁜 외국 이익이 들어올지 선명하게 상상할 수 있습니다. 당분간 그 문은 닫아 두겠습니다."
 AST_bat_for_the_battlers: "서민을 위해 나선다"
 AST_bat_for_the_battlers_desc: "오스트레일리아는 계급이나 질투로 규정되는 나라가 아니라 동료애와 성취로 하나 된 나라여야 합니다. 서민층인 중산층 오스트레일리아인들은 대부분의 경우 우리를 결승선까지 이끌어 왔습니다. 일터에서 그들에게 조금 되돌려주는 것이 공정합니다. 지나친 요구를 하지 못하게 하면서도, 노조의 목소리에 귀를 기울이고 몇 가지 단계적 정책을 시행하겠습니다. 실제로 중요한 정책들입니다."
 AST_back_australias_ability: "오스트레일리아의 능력을 지원한다"
 AST_back_australias_ability_desc: "경제 정책 면에서 우리의 '최고 중의 최고'는 오스트레일리아 능력 지원 프로그램이었습니다. 4년에 걸쳐 주요 건설 사업을 촉진하는 대규모 재생 프로그램으로, 실업을 크게 줄이고 우리가 흡수한 많은 세금 재원을 다시 유통에 돌려놓을 것입니다."
 AST_feel_the_heef_ast: "HEEF를 느껴라"
 AST_feel_the_heef_ast_desc: "고등교육 기금(HEEF)은 고등교육 기관과 연구개발 시설로 투자를 유입시키기 위한 최근의 정책 법안 중 하나입니다. 처음에는 우리만 이 기금에 투자하지만, 궁극적으로는 어떻게든 정부로 환류되도록 되어 있습니다. 모두 다소 허튼소리처럼 들리지만, 양당이 지지한다면 가치 있는 무언가가 있을지도 모릅니다."
 AST_if_we_build_it: "우리가 지으면"
 AST_if_we_build_it_desc: "새 병원 21곳을 짓겠다는 재선 공약의 이행 시기가 다가왔으나, 안타깝게도 비용이 이전 추정치보다 올랐습니다. 우리 재정 전문가들은 건설을 민간 부문에 위탁하라고 권고했는데, 그래도 상당한 비용이 듭니다. 긍정적인 면은 새 시설들 덕분에 공공 의료비를 절감할 수 있다는 것입니다."
 AST_australian_made: "오스트레일리아산"
 AST_australian_made_desc: "'오스트레일리아산' 로고는 정부가 만든 가장 성공적인 마케팅 전략 중 하나였습니다. 아이콘은 알아보기 쉬웠고 이 덕분에 더 많은 사람이 국산품을 샀습니다. 이제 공공 지출이 줄었고 베트남이나 중국의 값싼 수입품 대신 국산품을 택하기가 어려워졌습니다. 국내뿐 아니라 해외까지 겨냥하여 오스트레일리아산이 품질의 보증이라고 알리도록 마케팅 캠페인을 강화하면 새로운 판로를 찾을 수도 있습니다."
 AST_preserve_the_old_forests: "원시림을 보존한다"
 AST_preserve_the_old_forests_desc: "우리의 자랑 중 하나는 태즈메이니아의 원시림이었습니다. 이곳에는 90미터가 넘는 것까지 포함하여 세계에서 가장 키가 큰 꽃피는 나무들이 있습니다! 보물과도 같으며 여러 면에서 그레이트 배리어 리프만큼이나 이 나라에 중요합니다. 현재의 보호 구역을 17만 헥타르 더 확대하면 목재 산업을 위축시키지 않으면서도 이들의 소실을 막는 데 도움이 될 것입니다."
 AST_ets: "배출권을 거래한다"
 AST_ets_desc: "의회에서 화제가 된 또 다른 기후 법안은 '배출권 거래제'입니다. 노동당은 여전히 이런 것들을 만들어 내고 있으며, 어찌 된 일인지 당내 몇몇은 귀를 기울이고 있습니다. 지금 그들은 원자력 개발 보조금을 몇 건 지급함으로써 이 제도를 선수 치는 쉬운 타협안을 제시했습니다. 원자력은 현재 우리가 지지하는 것이 아니지만, 싹부터 잘라버릴 수는 없고, 기후 광신도들을 우리 정책에 누그러뜨릴 수 있다면 무엇이든 받아들일 것입니다."
 AST_the_new_liberals: "새로운 자유당"
 AST_the_new_liberals_desc: "좋든 싫든 당은 변했습니다. 우리는 더 이상 90년대의 소문자 \\"l\\"의 리버럴이 아니라 전통적 가치를 지키는 전문적인 세력입니다. 우리는 경제적 자유주의와 재정적 보수주의를 성공적으로 결합했습니다. 지정학적 현안의 현실은 인정되고 다뤄지고 있으며, 오스트레일리아인들은 주머니에 더 많은 돈이 남고 세금으로 나가는 돈은 줄었습니다. 솔직히 나라는 그 덕에 더 나아졌고, 우리는 주류 유권자의 지지를 누리고 있습니다. 지금 당을 어느 방향으로 이끄느냐가 우리의 기세를 살릴 수도 꺾을 수도 있으며, 우리의 인도에 의존하는 세대들에게도 큰 영향을 미칠 것입니다."
 AST_keep_them_in_line: "기강을 잡는다"
 AST_keep_them_in_line_desc: "우리 당은 너무 오랫동안 음모와 내부 쿠데타에 시달려 왔습니다. 우리 스스로도 신뢰하지 못하는데 대중이 우리 연립을 어떻게 신뢰할 수 있겠습니까? 지도부 도전에 관한 당규를 '재구성'하고 이를 가장 절박한 상황으로 한정해야 합니다. 이 변화를 지지하도록 국민당 인사 몇 명만 설득하면 될 것입니다."
 AST_secure_the_coalition: "연립을 확고히 한다"
 AST_secure_the_coalition_desc: "항상 의견이 일치하지는 않지만, 우리의 국민당 친구들은 거의 한 세기 동안 우리와 함께 걸어왔습니다. 우리는 한 꼬투리 속의 완두콩과 같습니다. 지금은 가능성이 낮지만, 연립이 갈라진다면 우리 두 당은 다시는 연방 선거에서 이기지 못할 것입니다. 그런 일을 운명에 맡겨 둘 수는 없습니다. 분열 조항을 다시 써서 어느 쪽도 사실상 분열이 불가능하게 만들면, 좋든 나쁘든 이들이 우리 편에 머물 것입니다. 그러면 우리는 정신적으로도, 명문화된 형태로도 진정으로 하나가 됩니다."
 AST_entice_crossbenchers: "무소속 의원을 회유한다"
 AST_entice_crossbenchers_desc: "우리 정치 체제는 수십 년간 무소속 의원들의 활동에 달려 있었습니다. 줏대 없기 일쑤인 이들은 우리와 야당 지지를 오가거나 아예 불참하면서 여러 차례 법안 통과를 도왔습니다. 일부는 선물 한두 개만 있으면 다시 기강이 잡힙니다. 여기서 악수 몇 번, 저기서 약간의 투자로 충분한 수를 충성하게 만들 것입니다."
 AST_broaden_our_beliefs: "신념을 넓힌다"
 AST_broaden_our_beliefs_desc: "우리 당이 신념에 관해 진흙탕에 빠져 있었다고 말하는 것은 거의 고정관념입니다. 어쨌든 우리는 전통주의자이고, 이는 합리적인 입장입니다. 단점은 당 전체가 지지하지는 않는 가치 있는 정책을 놓치고 있을지 모른다는 것입니다. 이제 소수 정당들과 마주 앉아 이야기해 볼 때일지도 모릅니다. 한두 가지 배울 것이 있을지도 모릅니다."
 AST_axe_the_governor_general: "총독을 해임한다"
 AST_axe_the_governor_general_desc: "공화국 국민투표는 99년에 부결되었을지 몰라도, 그렇다고 지구 반대편 나라의 대표가 우리의 의사 결정에 간섭하도록 둬야 하는 것은 아닙니다. 그들은 이미 우리 지도자 한 명을 해임한 적이 있으며, 또 그럴 수 있습니다. 이제 우리가 그들을 해임할 차례입니다. 그들의 머리 위를 넘어 곧바로 여왕에게 가서, 우리를 뒷받침할 부정행위에 관한 몇 건의 \\"보고서\\"와 함께 공식적으로 요청하고, 우리 스스로 처리하겠습니다."
 AST_our_own_kings: "우리만의 왕들"
 AST_our_own_kings_desc: "이제 군주제가 후임을 찾기 위해 움직이고 있으므로, 우리는 현행 절차를 활용해 승계를 최대한 지연시킬 수 있습니다. 이들은 법적 분쟁과 공식 조사의 바다에 빠져 허우적댈 것이고, 다른 사람에게 선서를 시키기까지 수년이 걸릴 수도 있으며, 우리는 왕실의 눈치를 보지 않고 정책에 대한 자유로운 재량을 갖게 될 것입니다."
 AST_prepare_the_successor: "후계자를 준비한다"
 AST_prepare_the_successor_desc: "때로는 좋을 때 끝내는 것이 최선입니다. 저는 지난 임기 중에 다음 선거 전에 물러나겠다고 약속했습니다. 그 기회는 왔다가 지나갔지만, 모자를 벗어 걸고 다음 지도자가 우리를 이끌 준비를 시키기에 너무 늦은 것은 아닙니다. 여기에 오기까지 싸웠던 일이 기억나는데, 이제 놓아주는 것을 고려하고 있습니다."
 AST_peace_with_honour: "명예로운 평화"
 AST_peace_with_honour_desc: "그리고 자유당의 미래가 결정되었습니다..."
 AST_the_sydney_declaration: "시드니 선언"
 AST_the_sydney_declaration_desc: "이 선언은 원래 APEC에서 세계의 기후 변화 요구에 부응하겠다는 오스트레일리아의 약속으로 작성되었고 그렇게 제시되어야 합니다. 그러나 이는 동쪽의 친구들에게 우리가 진보적 대의를 지지한다고 과시하는 것 이상의 더 큰 목적을 지닙니다. 선언 자체가 외교 행동에서 우리가 지닌 비중을 보여줍니다. 오스트레일리아가 세계와 교류할 준비가 되었으며, 그렇게 할 때 실질적인 변화를 일으키는 영향력이 있음을 알리는 것입니다. 우리가 겨우 상위 10위권에 턱걸이했을지 모르지만 이제 그 자리에 있으며, 앞으로 올라갈 일만 남았습니다."
 AST_the_quad: "쿼드"
 AST_the_quad_desc: "재난 구호에 관한 일본·인도와의 논의는 외교 협의를 위한 더 상설적인 채널을 시사할 만큼 성과를 거두었습니다. 미국 부통령도 최근 태평양에서의 중국의 행보를 계획하고 감시하기 위한 협약 결성 구상에 호의적입니다. 마침내 '4자 안보 대화'라는 명칭으로 낙착되었으나, 일단은 '쿼드'라는 별칭으로 부르고 있습니다."
 AST_negotiate_with_our_northern_neighbours: "북쪽의 이웃들"
 AST_negotiate_with_our_northern_neighbours_desc: "파푸아뉴기니와의 역사는 간혹 삐걱거린 적은 있으나 지난 수십 년간 대체로 긍정적이었습니다. 이들은 고무 분야에서 우리의 최대 무역 상대 중 하나로 남아 있으며, 이 관계를 유지하는 것은 국가 안보의 문제가 되었습니다. 우리는 철벽 같은 합의를 도출하는 데 도움을 받기 위해 이들의 총리를 초청했습니다."
 AST_anzus_collaboration: "ANZUS 협력"
 AST_anzus_collaboration_desc: "ANZUS 조약은 의심할 여지 없이 험난한 순간들을 겪었습니다. 뉴질랜드가 미국 핵잠수함의 입항을 거부하여 사실상 쫓겨난 것도 그리 오래전 일이 아닙니다. 어떻게 되었든 이 조약은 우리 사이의 형제 같은 유대와 비슷합니다. 미국의 정책이 유럽에서 얼마나 멀어져 중동으로 흘러갔든, 그들이 있다면 우리도 있습니다. 우리의 초점이 현지 사정에서 멀어질 수는 있겠지만, 어차피 모두 세계적 노력의 일환입니다."
 AST_an_american_treaty: "미국과의 조약"
 AST_an_american_treaty_desc: "밀레니엄 가뭄 이후 우리 농업 로비 단체들은 양국 간 관세를 낮추는 것을 목적으로 미국과 농업 협정을 맺으라고 촉구해 왔습니다. 양국 간 더 자유로운 시장은 농민들이 아직 회복 중인 지금 우리 농산물을 위한 상당한 새 판로를 열어 줄 수 있으며, 미국에 있는 우리 친구들보다 더 좋은 상대는 없습니다."
 AST_howard_of_arabia: "아라비아의 하워드"
 AST_howard_of_arabia_desc: "오스트레일리아는 여전히 기독교도가 다수인 나라입니다. 우리의 도덕률은 그 기원을 중동에 두고 있습니다. 이스라엘은 수십 년간 그곳에서 우리의 가장 강력한 파트너 중 하나였고, 원칙 있는 민주주의에 대한 그들의 결의를 거듭 보여 주었습니다. 그들이 우리를 필요로 할 때 내버려 둘 수는 없습니다. 그들과 더 강한 동료애를 나누는 것은 우리의 종교적 책무입니다."
 AST_keep_security_regional: "안보를 지역 중심으로 유지한다"
 AST_keep_security_regional_desc: "중동에서 해외 작전을 벌여 보기도 했지만, 우리의 우선순위는 언제나 가까운 이웃이었습니다. 태평양 섬나라들은 이제 자국의 안보를 위해 우리를 바라보고 있으며, 그래야 마땅합니다. 오스트레일리아는 지역 강국으로 성장하면서 이들을 극단주의 세력으로부터 안전하고 자유롭게 지킬 도덕적 의무가 있습니다. 이들에 대한 우리의 노력이 이를 나타내야 합니다."
 AST_preventative_measures: "예방 조치"
 AST_preventative_measures_desc: "뱀에 물린 뒤에 장화를 신는 법은 없습니다. 덤불 속에 있을 때 가장 먼저 챙기는 것은 장화이고 두 번째는 큰 막대기입니다. 거칠기는 해도 이러한 발상은 해외 방위를 다룰 때 활용되어야 합니다. 우리는 빈손으로 나서지 않으며, 최소한의 보호도 없이 이웃을 위험에 방치하지도 않습니다."
 AST_dissuade_the_middle_kingdom: "파푸아 영유권"
 AST_dissuade_the_middle_kingdom_desc: "이 지역에서의 우리의 우위는 인도네시아가 지정학적으로 우리를 추월하지 못하도록 막는 데 달려 있으며, 이들을 고립시키면 상황을 관리하기가 더 쉬워질 수 있습니다. 파푸아뉴기니의 민족주의자들은 수년간 우리에게 서파푸아에 대한 그들의 영유권 주장을 인정해 달라고 청원해 왔습니다. 양국 사이에 국경 긴장을 조금 일으키는 것이 우호 관계를 깨뜨리고 파푸아뉴기니를 우리 쪽으로 더 끌어들이는 데 딱 필요한 일일지도 모릅니다."
 AST_the_indonesian_ultimatum: "인도네시아에 대한 최후통첩"
 AST_the_indonesian_ultimatum_desc: "인도네시아와의 갈등은 최근 흔한 일이 되었습니다. 우리의 입장이나 협력 수준과 무관하게, 이들은 자국 내 극단주의 세력을 감당하지 못하는 듯합니다. 우리는 이들에게 최후통첩을 보내, 우리 자체의 평화유지 작전을 아체에 파견하여 독립 국가로서 스스로 관리할 수 있을 때까지 이 지역을 사실상 점령하도록 허용하라고 요구할 수 있습니다. 전에도 성공적으로 해냈으니 또 할 수 있습니다. 거부한다면 다시 협상 테이블로 돌아올 때까지 온갖 제재를 총동원할 수 있습니다."
 AST_a_visit_from_malaysia: "말레이시아의 방문"
 AST_a_visit_from_malaysia_desc: "말레이시아만큼 소통에서 솔직하고 진정성 있는 나라는 드뭅니다. 이들은 지도자부터 하급 장관에 이르기까지 수없이 우리를 방문했으며, 무역 협상은 언제나 아무 문제 없이 진행되었습니다. 어쩌면 영연방이라는 공동 유산 덕분일지 모르지만, 양국 사이에는 깊은 존중이 자랐습니다. 이번 논의는 우리 농산물 수출에 관한 것으로, 안전상의 이유로 제한적이었던 것이 사실입니다. 이들은 아마 우리가 법을 완화하도록 요청할 것입니다."
 AST_peacekeeping_in_somalia: "소말리아 평화유지"
 AST_peacekeeping_in_somalia_desc: "처음에는 희망적이었지만 소말리아 과도 정부는 군벌 분쟁 이후 위태로운 처지에 놓였고, 나라는 사실상 분열되었습니다. 계속되는 인도주의적 위기는 우리가 주목할 만큼 충분하며, 이제 정부는 외부 개입을 간청하고 있습니다. 분쟁에 직접 휘말리지 않으면서 평화유지군을 운용할 기회가 될 수 있습니다."
 AST_the_coal_family: "석탄 가족"
 AST_the_coal_family_desc: "50년대의 아메리칸 드림처럼, 많은 목가적인 오스트레일리아인들은 자기 결정에 따른 전통적인 삶을 살고 있습니다. 솔직히 이들은 아마 우리 지지 기반의 상당 부분을 차지할 것이며, 그럴 만도 합니다. 이는 우리가 오스트레일리아 가정이 살아가길 권장하는 방식 그대로입니다. 독립적이고 행복한 삶 말입니다. 주택 건설을 가로막는 정책들을 허물고 토지세를 일부 감면하여 부담을 덜어 줌으로써 보답할 수 있습니다. 우리 가정이 아름다운 이 땅의 한 조각을 소유했다고 해서 벌을 받아서는 안 됩니다."
 AST_the_abbott_government: "애벗 정부"
 AST_the_abbott_government_desc: "오늘부터 오스트레일리아는 새로운 경영 아래 있으며, 오스트레일리아는 다시 한번 사업을 위해 열려 있음을 선언합니다. 열려 있고, 우리에게 투표한 사람들뿐 아니라 모든 이의 잠재력을 극대화하는 정부가 이끄는 나라입니다. \n\n가장 단순하게 말해 모두를 위한, 다수를 위한 정부입니다. 위대한 멘지스가 '짐이 아니라 짐을 들어 주는 사람들'이라고 묘사한 이들을 위한 정부입니다. 잊힌 가정들이 보살핌을 받을 것입니다. 부담스러운 세금은 사라지고, 보트는 저지되며, 예산은 전례를 찾아볼 수 없는 흑자로 돌아설 것입니다. \n\n더 이상 시간을 낭비하지 말고 시작합시다."
 AST_expand_the_executive: "행정부를 확대한다"
 AST_expand_the_executive_desc: "정부 규모를 줄이겠다는 우리의 사명과 일을 해내는 능력을 높이겠다는 목표 사이에는 역설이 존재합니다. 선장이 배를 조타할 때에는 의회 전체와 협의하느라 시간을 낭비하지 않고 그의 판단이 존중받아야 합니다."
 AST_honour_the_party: "당에 경의를 표한다"
 AST_honour_the_party_desc: "앞으로 나아가며 받아들여지려면 우리 내각이 당의 유산을 반영해야 합니다. 존 하워드가 자유당을 재정의한 작업은 현대 정치의 이 새로운 시대에 적응하는 데 기념비적이었으며, 그의 정부 출신 인력을 채용하면 다양한 경험이 유입됩니다."
 AST_building_stronger: "더 강하게 건설한다"
 AST_building_stronger_desc: "우리는 뼛속 깊이 알고 있습니다. 이를 뒷받침하는 경제 없이는 사회가 없고, 이윤을 낼 수 있는 기업 없이는 경제가 없다는 것을 말입니다. 마찬가지로 우리의 타고난 낙관주의에도 불구하고 우리 재정의 건전성에 대한 신뢰는 바닥에 이르렀습니다. 이제 우리의 과제는 이를 되살리고, 어떤 오스트레일리아인이라도 자랑스러워할 만큼 튼튼하게 세우는 것입니다."
 AST_the_advisory_council: "자문 위원회"
 AST_the_advisory_council_desc: "자유당이 화해에 반대하는 정당으로 비쳐서는 안 됩니다. 결국 백호주의 정책을 끝낸 것은 해럴드 홀트였습니다. 원주민 관련 사안을 우리에게 알려 주고 실질적 변화에 초점을 맞춘 서사를 유지하기 위해 위원회가 구성될 것입니다."
 AST_cut_the_programs: "사업을 폐지한다"
 AST_cut_the_programs_desc: "정부의 화해 노력에 기여하지 않는 외딴 공동체들을 끝없이 보조할 수는 없습니다. 자금을 지원받으면서도 방침을 따르지 않는 원주민 공동체는 예산이 삭감될 것입니다. 단순하고 명확합니다."
 AST_its_the_constitution: "헌법이 문제다"
 AST_its_the_constitution_desc: "이제 우리가 해야 할 일은 헌법 속의 메아리치는 침묵, 즉 헌법에서 원주민이 빠져 있는 문제를 끝내는 것입니다. 이런 정서는 의회 밖의 결정을 요구하며, 원주민과 토레스 해협 섬 주민을 우리의 최초 민족으로 인정하기 위한 국민투표가 필요합니다."
 AST_compete_on_the_farms: "농장에서 경쟁한다"
 AST_compete_on_the_farms_desc: "소규모 가족 농업은 연방 성립 이래 이 나라 농업 부문의 중추였습니다. 태즈메이니아에서 서오스트레일리아까지 여러 세대의 오스트레일리아인들이 운영하는 농장은 더 큰 기업들에 밀려나고 있습니다. 접근 가능한 대출과 용수 공급 개선으로 농민들을 돌보지 않고서는 경쟁력을 유지할 수 없습니다. 우리의 정책은 이들의 독립을 유지하는 것을 우선해야 합니다."
 AST_develop_the_northern_territory: "곡창지대를 개발한다"
 AST_develop_the_northern_territory_desc: "노던 준주를 산업 및 농업 강국으로 키우는 것을 목표로 하는 여러 개발 사업 계획이 제출되었습니다. 이를 승인함으로써 우리는 이전 정부들이 대체로 외면해 온 주를 일구게 되며, 앞으로 수십 년간 오스트레일리아와 태평양의 곡창지대를 만들 수도 있습니다."
 AST_getting_in_there: "진입로를 확보한다"
 AST_getting_in_there_desc: "안타깝게도 노던 준주를 드나드는 도로가 한심한 상태로 전락했습니다. 게다가 반입되는 자재를 감당하려면 간 철도 노선도 개량해야 합니다."
 AST_funnel_in_workers: "노동자를 유입시킨다"
 AST_funnel_in_workers_desc: "사업을 시작하려면 인력이 필요합니다. 우대 비자와 이주 지원금 몇 개면 해결되지 않을 문제는 없습니다."
 AST_project_manton: "맨턴 사업"
 AST_project_manton_desc: "맨턴 댐은 다윈이 자체 댐을 짓기 전까지 이 지역의 주요 용수 및 전력 공급원이었습니다. 인근 지역 사회에 공급하기 위해 댐을 보수하고 재가동하는 비용은 놀랍게도 예산 범위 안이며, 노던 준주 개발에 대한 우리의 의지를 가시적으로 보여 줄 것입니다."
 AST_compassionate_government: "공정한 기회"
 AST_compassionate_government_desc: "이 나라에서는 도전하면 기회를 얻습니다. 이는 우리 지도 아래 당의 신조라 해도 무방합니다. 국민은 노력에 대한 보상을 받아야 하며, 출발하기에 좋은 처지가 아닌 이들은 가벼운 도움의 손길로 지원하겠습니다. 이는 당연한 권리가 아니라 공정함입니다."
 AST_keep_the_fire_burning: "불꽃을 꺼뜨리지 않는다"
 AST_keep_the_fire_burning_desc: "복지가 정부의 지갑에 내고 있는 구멍은 우리가 통제하지 못하면 우리를 가라앉힐 것입니다. 동시에 이 사업들은 국민에게 심각할 정도로 긍정적인 성과를 내기 시작했습니다. 지금 멈추면 지금까지의 노력이 물거품이 될 수 있습니다. 대신 현재 비용을 충당하도록 일부 재원을 돌려막고, 케인스가 장기적으로 옳았기를 바라야 합니다."
 AST_national_curriculum_review: "교육과정 검토"
 AST_national_curriculum_review_desc: "교육과정에 으레 스며드는 정치적 편향은 차치하고, 공적 자금이 농촌 학교를 배제하는 방향으로 편중된 것으로 보입니다. 오스트레일리아의 모든 학교는 공정한 기회를 누려야 하고, 모든 학생은 문제점만이 아니라 서구 문명의 성공을 자랑스러워하는 교육을 받을 자격이 있습니다. 우리는 모두 우리가 자라난 나라와 그 안의 교육 제도를 자랑스러워해야 합니다."
 AST_another_baby_boom: "또 한 번의 베이비 붐"
 AST_another_baby_boom_desc: "사랑은 아름다운 것입니다. 우리 정부는 누구보다 그것을 잘 압니다. 선거 기간 중 우리는 유급 육아휴직 개편을 약속했으며, 새 어머니들에게 급여에 상응하는 26주의 휴가를 제공하기로 했습니다. 당 내에서 많은 반발이 있었지만, 이 나라의 어머니들을 최우선에 두는 것이 더 큰 우선순위입니다."
 AST_responsible_governance: "책임 있는 정부"
 AST_responsible_governance_desc: "정부의 무분별한 지출은 사실상 예산 위기를 불러들이는 것과 같습니다. 집권당의 가장 큰 책임은 어려운 결정을 내리는 일입니다. 신용카드로 주택 대출을 계속 갚아 나갈 수는 없습니다."
 AST_the_welfare_bloat: "그런 사회는 없다"
 AST_the_welfare_bloat_desc: "현행 제도에서는 공공 복지에 접근하기가 너무 쉽습니다. 운이 나쁘고 허리가 아프다는 사람은 누구나 센터링크와 메디케어의 모든 혜택을 받을 수 있습니다. 진입 문턱을 높여야 하며, 예산 비대를 줄이는 데 조금이라도 진전을 이루려면 불필요한 몇몇 사업을 단계적으로 폐지해야 합니다."
 AST_cashless_welfare: "현금 없는 지급"
 AST_cashless_welfare_desc: "노던 준주 지역 사회에서의 시범 사업이 마무리되고 있으며, 소규모 시행이 가능하다고 확신합니다. 직접 입금을 정부가 발급한 은행 카드로 대체하고 지출을 필수품으로 제한하면 지역 사회의 취약 계층이 카지노에 드나들거나 거리에 쓰러져 있는 일을 막을 수 있습니다."
 AST_up_the_gst: "세금 하나 더"
 AST_up_the_gst_desc: "우리 세제의 가장 큰 개혁은 불과 몇 년 전에 이루어졌으나, 이미 나라에 엄청난 혜택을 가져왔습니다. 당시에는 논란이 있었지만, 지금 기업들은 더 단순한 제도를 누리고 있으며 추가 수입은 더 비용이 많이 드는 사업들의 재원이 되었습니다. 조금만 올려도 지금 겪고 있는 예산 고통을 극복할 수 있을 것입니다."
 AST_national_audit_commission: "국가 감사 위원회"
 AST_national_audit_commission_desc: "정부의 낭비성 지출은 떼어 내기 얼마나 어려운지에 있어서 장화 밑에 낀 진흙과 같은 것이 되었습니다. 행정부 전체에 걸쳐 이를 정리하는 데 전념하는 세대에 한 번뿐인 위원회를 만드는 것이 최선의 방책입니다. 모든 것이 도마에 오를 것입니다."
 AST_investigate_union_corruption: "노조와의 전쟁"
 AST_investigate_union_corruption_desc: "언론에 우리가 부정행위와의 전쟁을 선포한다고 알리십시오. 부패와의 전쟁을 선포하고, 우리 사회에는 지켜야 할 기준이 있음을 선언하는 것입니다. 기업 임원이든 노조 간부든 법을 준수해야 합니다."
 AST_the_energy_crisis: "에너지 위기"
 AST_the_energy_crisis_desc: "기후 보호에 대한 집착은 에너지 대재앙의 문턱에서 우리 발등을 찍었습니다. 통제할 수 있을 때조차 국민의 수요는 충족되지 못하고 있으며, 치솟는 비용은 이 나라가 겪은 어떤 위기보다 더 많은 이들을 재정적 위기에 빠뜨렸습니다. 우리 정부는 이 문제를 이번 한 번에 확실히 매듭지어야 합니다."
 AST_duttons_plan_focus: "더턴의 계획"
 AST_duttons_plan_focus_desc: "보건부 장관 피터 더턴은 적어도 논란의 소지가 있는 해법을 들고 에너지 논쟁에 발을 들였습니다. 오스트레일리아의 원자력 규제를 철회하여 발전소 건설을 허용하고 에너지 부족을 단번에 해결하자는 것입니다. 우리는 수십 년간 그 가능성을 멀리해 왔고 그럴 만한 이유가 있었지만, 이것이 우리가 찾던 과감한 해법일 수도 있습니다."
 AST_look_below: "아래를 보라"
 AST_look_below_desc: "우리의 모든 문제에 대한 해답은 늘 우리 발밑에 있었습니다. 녹색당은 이를 두려워하고 노동당은 외면하지만, 연립은 존중합니다. 어떤 재생 에너지원도 공룡이 죽은 이래 우리를 위해 길러진 하늘이 내린 동력원을 대체하지 못할 것입니다."
 AST_build_it: "짓는다"
 AST_build_it_desc: "석탄 발전의 장점 중 하나는 그 아름다움입니다. 우리에게는 이쪽 세계에서 가장 훌륭한 천연가스 발전소가 있으며, 시끄럽고 흉한 터빈보다 훨씬 보기 좋습니다. AEMO 비상 조치를 발동해 발전기를 더 조달하고 자체 발전소를 건설하면 아주 짧은 기간에 몇 곳을 더 지을 수 있습니다."
 AST_deny_it: "부정한다"
 AST_deny_it_desc: "정신적 무기력이 한때 성취에 한계를 두지 않던 나라의 사기와 야망을 갉아먹고 있습니다. 기후 변화에 대한 양보는 우리의 에너지 생산을 망쳐 놓았고, 이웃 나라들이 우리가 잃어버린 산업을 가져가도록 부추겼습니다. 시계를 되돌릴 수는 없으나, 족쇄를 끊어낼 수는 있습니다."
 AST_friend_of_the_mines: "광산의 친구"
 AST_friend_of_the_mines_desc: "뉴스코프의 지인과 대화를 나눈 결과, 우리 광업 기업들에 대한 압박을 해소해야 한다는 점이 분명해졌습니다. 먼저 채굴권에 대한 우리의 접근 방식을 바꾸는 것부터 시작합니다. 퀸즐랜드의 카발 리지 탄광은 한동안 승인을 기다리고 있었습니다. 우리가 직접 현지로 가서 개광을 승인한다면 큰 가능성을 보여줄 것입니다."
 AST_light_on_the_hill: "언덕 위의 빛"
 AST_light_on_the_hill_desc: "오스트레일리아는 수십 년간 태평양의 민주주의 등불이었으며, 이제는 말 그대로 빛이 될 것입니다. 오스트레일리아 국민은 저렴하고 풍부한 전기로 전국의 가정을 따뜻하게 하고 시원하게 하며 안심하고 지낼 수 있을 것입니다. 이는 우리 정부의 성과이자 국가로서 이룬 진보의 증거입니다."
 AST_acquire_enrichement: "작고 푸른 돌멩이"
 AST_acquire_enrichement_desc: "그토록 많이 채굴하면서도 정작 그것을 활용할 농축 시설이 없다는 것은 부끄러운 일입니다. 미국의 친구들로부터 시설을 빠르게 들여와 조립할 수 있으며, 몇몇 권고 사항을 건너뛰어 신속하게 가동할 수 있습니다."
 AST_convert_the_ansto_reactor: "ANSTO 원자로 전환"
 AST_convert_the_ansto_reactor_desc: "분명 우리는 이미 시드니에 원자로를 보유하고 있습니다. 발전에 필요한 정확한 모델은 아닐지 모르지만, 과학자들의 머리를 쥐어짜면 출력을 낼 수 있도록 준비시킬 수 있습니다. 어쨌든 로켓 과학까지는 아니지 않습니까."
 AST_tweak_the_restrictions: "더 이상 발목 잡히지 않는다"
 AST_tweak_the_restrictions_desc: "무배출 전력으로 나아가는 것을 가로막는 요소가 매우 많습니다. 특히 온 나라에 \\"비핵 지대\\"를 설정해 온 녹색 성향 인사들의 목소리가 그렇습니다. 국가 비상사태로서, 이러한 지대는 사라져야 합니다."
 AST_first_stop_jakarta: "첫 기착지 자카르타"
 AST_first_stop_jakarta_desc: "오스트레일리아의 외교 정책이 지역에 머물 것이라는 강력한 메시지를 보내며 임기를 시작할 수 있습니다. 이곳의 국가들이 그 어느 때보다 우리의 도움을 필요로 하는 때에 유럽을 돌아다닐 여유는 없습니다. 제네바는 줄이고, 자카르타는 늘립니다."
 AST_sail_steady: "순항 유지"
 AST_sail_steady_desc: "외무장관 줄리 비숍은 이번 임기 동안 \\"경제 외교\\" 접근법을 강조해 왔으며, 지속적인 원조 프로그램과 자유무역 노력에 초점을 맞추고 있습니다. 솔직히 이전 정부들과 크게 다르지 않으나, 수백만의 목숨이 우리 손에 달려 있을 때는 배를 흔들지 않는 것이 최선입니다."
 AST_the_anglosphere: "앵글로스피어"
 AST_the_anglosphere_desc: "오스트레일리아는 원주민의 유산, 영국적 기반, 다문화적 성격을 지니고 있습니다. 그렇기에 영국과의 유대는 형제만큼이나 가깝습니다. 우리는 같은 언어를 쓰고, 럭비를 사랑하며, 같은 민주주의 이상을 위해 싸웁니다. 우리의 우애는 더없이 신성하며, 앞으로도 그러해야 합니다."
 AST_o_canada: "오 캐나다!"
 AST_o_canada_desc: "우리의 영연방 형제국입니다. 멀리 떨어져 있지만 우리의 유대는 오랜 두 친구만큼 깊습니다. 외교관들이 준비해 온 투자 기회를 논의하기 위해 연락을 취해 보는 것도 나쁘지 않습니다."
 AST_swell_the_support: "지원 병력 확충"
 AST_swell_the_support_desc: "90년대 이후 국방 모병이 부진했다는 것은 공공연한 비밀입니다. 자격 요건을 완화하고, 모병 캠페인을 벌이고, 국방 인턴십을 개방하는 것이 필수 직위를 채우기 위한 적절한 첫걸음입니다."
 AST_of_knights_and_dames: "기사와 귀부인"
 AST_of_knights_and_dames_desc: "'오스트레일리아 훈장의 기사와 귀부인' 작위는 한때 국가에 대한 비범한 공헌을 기리기 위해 수여할 수 있는 최고의 영예였습니다. 대부분의 노동당 정부가 그러했듯, 이 작위도 그들의 집권기에 폐지되었습니다. 우리가 돌아온 만큼 잊혀서는 안 될 유산의 일부를 복원해야 합니다."
 AST_american_integration: "미국과의 통합"
 AST_american_integration_desc: "태평양 건너의 동맹국은 한동안 합동 훈련을 제안해 왔습니다. 새 장비를 실전적인 환경에서 운용해 볼 수 있다는 이점만으로도 우리 군에는 매우 귀중하며, 미국과 더욱 긴밀하게 정보를 공유할 수 있을 것입니다."
 AST_square_kilometre_array: "스퀘어 킬로미터 어레이"
 AST_square_kilometre_array_desc: "이 프로젝트에 참여하기 위한 우리와 뉴질랜드 간의 경쟁에서 예상대로 우리가 승리했습니다. 남아프리카공화국, 영국과 함께 우리는 생애 가장 야심 찬 천문학 프로젝트 중 하나에 참여하게 됩니다. 우리의 임무는 21킬로미터 구역에 13만 개가 넘는 나무 모양 안테나를 설치하는 것입니다. 이론상 현재보다 1만 배 넘게 빠르게 하늘을 관측할 수 있습니다. 모두 최첨단 기술이며, 이 분야의 과학자들에게는 흥미로운 기회입니다."
 AST_joint_defense_tech: "공동 방위 기술"
 AST_joint_defense_tech_desc: "파이브 아이즈 동맹은 대테러 전쟁과 일반 정보 수집 분야에서 60년 가까이 우리의 가장 강력한 자산 중 하나였습니다. 연구 부서를 설립하는 것은 어렵지 않으며, 우리 사이에 존재하는 기술 격차를 메우는 데 도움이 될 것입니다."
 AST_the_submarine_corporation: "잠수함 공사"
 AST_the_submarine_corporation_desc: "함대에 새 잠수함을 보강하려는 노력에 ASC가 힘이 되어 줍니다. 80년대부터 우리의 으뜸가는 조선 공급업체였고 최근 국유화된 이 기업을 우리가 자유롭게 활용할 수 있습니다."
 AST_new_columbo_plan: "신 콜롬보 계획"
 AST_new_columbo_plan_desc: "제2차 세계 대전 이후 황폐해진 아시아를 재건하기 위해 콜롬보 계획이 시행되었으며, 우리의 기술 전문가를 파견하고 그들의 인력이 우리나라에서 공부하도록 지원했습니다. 같은 원칙을 다시 적용하여, 신속 비자를 통해 학생들이 우리 대학에서 공부하도록 함으로써 새로이 발전하는 아시아를 도울 수 있습니다."
 AST_growing_demands: "도전에 응하라"
 AST_growing_demands_desc: "국가 안보를 희생하면서까지 경제적으로 책임 있는 정부는 있을 수 없습니다. 오스트레일리아 국방군은 어떤 분쟁의 부름에도 응할 수 있는 태세를 항상 갖추어야 합니다. 그에 못 미치면 우리는 곤란한 처지에 놓입니다."
 AST_visiting_the_rainbow_nation: "무지개 나라"
 AST_visiting_the_rainbow_nation_desc: "우리는 남아프리카공화국과 다채로운 역사를 지녔으며, 제2차 보어 전쟁 당시 그들의 군대를 지원한 때로까지 거슬러 올라갑니다. 거의 20만 명이 오스트레일리아에 살고 있으며, 최근 난민 신청이 쇄도하면서 그 수는 계속 늘고 있습니다. 긴장이 계속 고조됨에 따라 이 문제에 대한 입장을 밝히라는 압력이 커졌습니다."
 AST_indonesian_intervention: "군도 확보"
 AST_indonesian_intervention_desc: "인도네시아의 상황은 너무 오랫동안 악화되도록 방치되었습니다. 1999년의 노력은 대체로 성공이었으나, 이슬람 근본주의의 위협을 억누르기 위해서는 이 나라에 대한 추가 개입이 필요할 것입니다."
 AST_an_oceanic_alliance: "대양주 동맹"
 AST_an_oceanic_alliance_desc: "태평양 국가들의 일은 이곳에 있는 우리가 느끼고 처리합니다. 우리는 서로에게 의지해야 했던 적이 많았고, 그것이 우리 사이에 깊은 단결을 길러냈습니다."
 AST_aukus_abbott: "AUKUS"
 AST_aukus_abbott_desc: "영국 및 미국과 함께 국제 규칙 기반 질서를 지키겠다는 우리의 공동 의지는 더없이 굳건합니다. 우리는 지난 세기의 거의 모든 주요 분쟁에서 함께 참호를 헤쳐 왔습니다. 따라서 그 협력을 심화하는 것이 더 안전한 세계로 가는 최선의 길입니다."
 AST_the_greatest_statesman: "위대한 정치가"
 AST_the_greatest_statesman_desc: "태평양에서 오스트레일리아의 입지가 확고해졌습니다. 아름다운 이 나라는 더 이상 아시아의 성장을 지켜보는 관찰자가 아니라, 그 부상에 적극 참여하는 일원입니다. 역사가들은 이 시점이 우리가 나라를 올바른 길로 이끈 순간이었다고 돌아볼 것입니다."
 AST_the_asian_century: "아시아의 세기"
 AST_the_asian_century_desc: "비판자들이 무엇이라 말하든, 우리는 계획 없이 아시아로 돌진하는 것이 아닙니다. 불과 수십 년 만에 북아시아 국가들이 인류 역사상 유례없는 경제적 변혁을 이루었다는 것은 조금만 조사해도 알 수 있습니다. 우리는 그 국가들에 오스트레일리아가 사업에 열려 있으며 그 변혁의 몫을 받을 준비가 되어 있음을 알려야 합니다."
 AST_our_greatest_partner: "가장 가까운 파트너"
 AST_our_greatest_partner_desc: "중국은 수억 명을 빈곤에서 끌어올려 중산층으로 만드는 기적적인 일을 해냈습니다. 마찬가지로 그들과의 동반자 관계는 다른 어느 태평양 국가들과의 관계보다 훨씬 큰 무언가로 계속 꽃피고 있습니다. 정부 내 일각에서 오스트레일리아가 경제적 이익과 안보 이익 중 하나를 선택해야 한다고 촉구하지만, 오래된 친구를 잃고서 새 친구를 사귈 수 없으며, 다른 우정을 약화시켜 어떤 우정을 더 강하게 만들 수도 없다는 사실에는 변함이 없습니다."
 AST_indian_investments: "인도 투자"
 AST_indian_investments_desc: "몇몇 인도 기업이 국내 제조 시설을 확장하고 시드니에 거점을 마련하는 데 관심을 보였습니다. 외국 기업에 대한 현행 규제가 절차를 늦추고 있으나, [GetASTLeaderTitle]의 직접 승인만 있으면 그들은 신속히 시작하여 일자리를 가져올 수 있습니다."
 AST_sanpou_yoshi: "산포요시"
 AST_sanpou_yoshi_desc: "산포요시는 모든 거래가 판매자, 구매자, 그리고 사회 전체에 이로워야 한다는 일본의 오래된 용어입니다. 말하자면 \\"삼방 모두의 승리\\"입니다. 무역에 관한 일본과의 현행 협정은 승리와는 거리가 멉니다. 우리 사이에는 심각한 무역 불균형이 있으며, 이것이 바로잡히기 전까지는 양국 사이를 갈라놓을 것입니다."
 AST_seoul_refineries: "서울 정제소"
 AST_seoul_refineries_desc: "한국전쟁 이래 우리는 대한민국 정부와 군사적으로나 경제적으로나 매우 긴밀한 관계를 유지해 왔습니다. 서울에 새로 구축된 산업 기반이 성공을 거둔 만큼, 우리 석유를 그들과 함께 정제하는 협정을 맺으면 직접 하는 수고를 덜고 훨씬 빨리 가동할 수 있을 것입니다."
 AST_australian_exceptionalism: "오스트레일리아 예외주의"
 AST_australian_exceptionalism_desc: "이 나라에는 독특한 미덕이 있습니다. 그것은 신의 위임이나 거저 얻은 타고난 자질이 아니라, 우리를 새로운 여명으로 이끌기 위해 어려운 선택과 희생을 감수한 앞선 세대에 뿌리를 두고 있습니다. 그 전통은 계속되어야 하며, 오스트레일리아는 어떤 대가를 치르더라도 지켜낼 것입니다."
 AST_stop_the_boats: "보트를 막아라"
 AST_stop_the_boats_desc: "밀입국 알선업자들이 부추기는 불법 입국과 바다에서의 익사 사고는 최근 몇 년간 우리나라가 직면한 가장 큰 위기입니다. 국경 전문가 스콧 모리슨은 순찰을 강화하고 영구 보호 비자를 폐지하여 새치기하며 위험을 감수하려는 이들의 의욕을 꺾는 군사 작전식 대응을 고안했으며, 이로써 해안을 지키고 흐름을 되돌리려 합니다."
 AST_raise_the_threat_level: "위협 수준 상향"
 AST_raise_the_threat_level_desc: "테러의 위협은 안타깝게도 일상의 현실이 되었고, 유감스럽게도 우리에게 해를 끼치려는 오스트레일리아 시민과 거주자가 있습니다. 공항, 기지, 정부 청사, 대규모 공공 행사에 더 많은 보안 인력을 투입하는 것이 필수가 될 것입니다."
 AST_tighten_the_flow: "국경 경비대"
 AST_tighten_the_flow_desc: "통합된 국경 순찰 조직이 없었기에 이 신성한 나라의 안보는 밀입국 알선업자와 테러리스트의 처분에 맡겨져 왔습니다. 전담 기관이 더 일찍 만들어지지 않았다는 것은 솔직히 비극입니다. 오스트레일리아 국경경비대가 창설되어 온갖 위협에 맞서는 방벽 역할을 하고, 적절한 전문성으로 밀입국 알선업자를 억제할 것입니다."
 AST_prevention_measures: "예방 조치"
 AST_prevention_measures_desc: "개입에 있어서는 노련한 손이 키를 잡아야 합니다. 정확하고 단호한 일격은 위협을 싹부터 멈출 수 있습니다. 최소한 행동할 수 있는 선택지를 확보해 두면 우리가 가장 필요로 할 때 활용할 수 있습니다."
 AST_wielding_the_stick: "몽둥이를 휘두르며"
 AST_wielding_the_stick_desc: "가장 크고 신뢰받는 무기 제조업체 중 한 곳과 협력하여 오늘의 무기를 내일의 전투에 공급하기 위한 신규 제조 공장 두 곳의 건설을 추진했습니다. 멋들어진 표어라는 건 압니다."
 AST_deployment_mandate: "전개 위임"
 AST_deployment_mandate_desc: "전투 준비를 위한 우리의 신속한 동원은 올바른 길을 가고 있는지 확인하기 위한 몇 가지 목표에 맞춰 진행되어 왔습니다. 이를 달성하면 갑작스러운 지출 증가를 정당화하는 데 필요한 확신을 얻고, 우리의 진정한 역량을 보여줄 수 있을 것입니다."
 AST_employ_reserves: "예비군 동원"
 AST_employ_reserves_desc: "우리나라 예비군의 주된 임무에는 자연재해와 국내 비상사태 시 지원이 포함됩니다. 우리의 방위가 곧 국내 비상사태인 만큼, 상근 인력이 채우지 못한 모든 영역에 예비군을 투입하여 전개 가능한 병력을 확보할 것입니다."
 AST_let_them_serve: "복무하게 하라"
 AST_let_them_serve_desc: "현행 모병 정책은 우리의 확장 계획에 비해 지나치게 제한적입니다. 프로그램을 국방 인턴십으로 개방하고 지원자에게 부채 감면을 제공하면 필요한 수준까지 인원이 늘어날 것입니다."
 AST_incorporate_them: "그들을 편입하라"
 AST_incorporate_them_desc: "우리는 이미 복지 수급자를 공공 사업에 투입하는 상당한 규모의 프로그램을 운영하고 있습니다. 이제 이들을 군수 산업으로 돌려 오스트레일리아 국방군의 부담을 일부 덜 수 있습니다."
 AST_a_shining_fleet: "빛나는 함대"
 AST_a_shining_fleet_desc: "냉전 종식 이후 우리의 해군 기반 시설은 방치되어 국방의 취약점이 될 정도로 쇠퇴했습니다. 함선을 건조하는 능력은 사실상 사라졌습니다. 국영 조선소를 되살리는 것부터 시작하여 새로 조직된 오스트레일리아 해군 기반 시설이 이 노력을 이끌 것이며, 머지않아 우리나라는 다시 한번 바다로 돌아갈 것입니다."
 AST_assistance_from_langley: "랭글리의 지원"
 AST_assistance_from_langley_desc: "엉클 샘은 전에도 우리를 도운 적이 있으며, 우리가 요청하면 정보 분야에서 기꺼이 도움의 손길을 내밀 것입니다. 흔히 말하듯, 아는 것이 전투의 절반입니다."
 AST_our_fight: "우리의 싸움"
 AST_our_fight_desc: "앞으로의 여정은 우리 스스로 걸어가야 합니다. 물론 철저히 혼자는 아니지만, 오스트레일리아가 스스로 무장하고 자신의 전투를 치를 능력이 있음을 보여줘야 합니다. 결국 우리는 행동하는 민족입니다."
 AST_asian_partnership: "아시아 파트너십"
 AST_asian_partnership_desc: "친구가 없다면 자신의 절반밖에 되지 않습니다. 아시아 국가들은 오랜 세월 우리에게 친구 이상이었으며, 특히 일본은 우리의 군비 증강 과정에서 손을 맞잡아 왔습니다. 현재 우리는 함대 규모를 보강하기 위해 일본으로부터 잠수함 다수를 구매하는 협정을 추진해 왔으며, 이를 끝까지 성사시키는 것이 최우선입니다."
 AST_accelerate_the_timeline: "일정 단축"
 AST_accelerate_the_timeline_desc: "준비 기간이 끝나감에 따라 막판 생산 일부를 서둘러야 할 것입니다. 우리는 음, 계란을 좀 더 빨리 익혀야 합니다."
 AST_in_our_backyard: "우리의 뒷마당에서"
 AST_in_our_backyard_desc: "영국 해군은 1911년 창설 이래 약 한 세기 동안 인도-태평양을 항행해 왔습니다. 두 차례의 세계 대전을 거치며 이 해역에서 전력을 투사하는 방법을 포함해 귀중한 교훈을 얻었습니다. 그 경험은 앞으로의 시련에서 시험대에 오를 것입니다."
 AST_counter_the_island_chain: "도서 사슬에 대응"
 AST_counter_the_island_chain_desc: "1940년대 이래 중국은 남중국해에 대한 영유권을 공고히 하기 위해 위협과 섬 점거 작전을 벌여 왔습니다. 과거에는 확장이 어느 정도 관리 가능했으나, 최근 인공섬에서의 성공으로 위협이 증폭되었습니다. 할 수 있을 때 단호히 대응하지 않으면, 우리 북쪽의 어디든 다음 '남중국해'가 될 수 있습니다."
 AST_dealings_in_kuala_lumpur: "쿠알라룸푸르 협상"
 AST_dealings_in_kuala_lumpur_desc: "우리와 말레이시아 사이의 광물 무역이 크게 늘어 말레이시아 외교관들이 무역 협정을 논의하자며 연락해 왔습니다. 이미 수익성이 높은 물자 흐름을 더욱 원활하게 만들 수 있습니다. 그 과정에서 양국 간 중립 협정 조건을 제시할 수도 있으며, 이는 말레이시아가 중국의 커져가는 세력권에 편입되는 것을 막아줄 것입니다."
 AST_guadalcanal_garrison: "과달카날 수비대"
 AST_guadalcanal_garrison_desc: "제2차 세계 대전이 발발하고 일본 제국이 솔로몬 제도를 침공한 뒤, 그들은 이 섬을 우리나라 공격의 발판으로 삼으려 했습니다. 가장 치열한 전투 중 일부가 그 섬들에서 벌어졌으며, 다른 나라가 다시 그곳에 거점을 확보하도록 놔둘 수는 없습니다."
 AST_mutual_defense: "상호 방위"
 AST_mutual_defense_desc: "우리는 태평양을 홀로 순찰할 수 없으며, 복잡한 역사에도 불구하고 냉전 종식 이후 우리의 가장 가까운 동맹 중 하나는 일본이었습니다. 그들이 이른바 새롭게 거듭난 모습은 감탄스럽다는 말로도 부족합니다. 다가올 분쟁에서 우리에게는 그들이 필요할 것입니다."
 AST_due_reparations: "미지급 배상금"
 AST_due_reparations_desc: "공동 안보도 매력적이지만, 제2차 세계 대전에서 우리가 받아야 할 것을 받아내는 것이 우리에게는 다소 더 우선입니다. 2만 7천 명이 넘는 오스트레일리아인이 목숨을 잃었고 그중 64% 이상이 일본군과 싸우다 전사했으며, 전쟁 기간 동안 거의 30억 파운드를 썼습니다. 다윈 폭격은 언급하지도 않았습니다. 보상은 반드시 이루어져야 합니다."
 AST_pukpuk_treaty: "푹푹 조약"
 AST_pukpuk_treaty_desc: "우리는 수년째 파푸아뉴기니와의 긴밀한 방위 협력 구상 주변을 조심스럽게 맴돌아 왔습니다. 양국 군 지휘부를 통합하는 방안은 중국의 커져가는 세력권에 대응하고 우호적인 이웃에 더 직접적인 영향력을 행사할 효과적인 기회를 제공합니다."
 AST_the_indonesian_solution: "인도네시아 장악"
 AST_the_indonesian_solution_desc: "인도네시아는 수십 년째 우리의 눈엣가시였으며, 협상의 시간은 끝났습니다. 직접 관리가 필요할 것입니다. 우리가 이 지역에 질서를 되찾을 것입니다."
 AST_island_leasing: "섬 임대"
 AST_island_leasing_desc: "뉴칼레도니아 제도는 우리 북동쪽 측면의 전략적으로 중대한 위치에 있습니다. 그곳에 병력을 배치할 수 있다면 산호해 전체를 둘러싼 일종의 철벽을 만들 수 있습니다. 다행히 우리는 프랑스 친구들로부터 이 섬들의 기지 사용권을 임차할 수 있을지도 모르는 처지에 있습니다."
 AST_the_middle_power: "중견국"
 AST_the_middle_power_desc: "대한민국을 우리 편으로 끌어들이면 중국에게 이른바 '아킬레스건'이 생기게 됩니다. 양국 간 분쟁이 터질 경우 복부를 노린 칼날이 될 것이며, 추진하지 않기에는 너무 좋은 기회입니다."
 AST_fuel_the_grudge: "원한에 불을 붙여라"
 AST_fuel_the_grudge_desc: "판 위의 마지막 말입니다. 일단 경계를 넘으면 되돌아갈 수 없습니다. 우리의 정책은 중국에서 멀어져 대만을 향해 전환되어야 합니다. 그들을 우리 편으로 끌어들일 수 있다면 나머지는 모두 제자리를 찾을 것입니다."
 AST_shirt_front_the_dragon: "용에게 정면 태클을"
 AST_shirt_front_the_dragon_desc: "중국 함대는 몇 주째 필리핀을 분쟁 환초인 스카버러 암초에서 힘으로 몰아내려 하고 있습니다. 여느 불량배가 그렇듯, 우리가 자국 함선으로 필리핀에 대한 지지를 보이고 섬 주위에 경계선을 설정하면 중국의 허세는 금세 사그라들 것입니다."
 AST_the_canberra_treaty: "캔버라 조약"
 AST_the_canberra_treaty_desc: "전쟁은 피했고, 용은 태평양 국가들이 강압에 굴복하지 않는다는 것을 똑똑히 보았습니다."
 AST_the_lottery_draft: "추첨 징병"
 AST_the_lottery_draft_desc: "지난번 국민 병역 제도를 시행했을 때 그 조치는 인기가 없었습니다. 그럼에도 이 전쟁에서 승리하려면 더 많은 즉응 병력이 필요합니다. '생일 추첨'이 돌아와야 합니다."
 AST_stock_up: "비축 확대"
 AST_stock_up_desc: "우리 해군은 어디에나 있을 수는 없습니다. 물자 부족이 발생할 것이며, 그 전에 핵심 물자를 충분히 비축해 두었기를 기원할 수밖에 없습니다."
 AST_border_commanders: "국경 사령부"
 AST_border_commanders_desc: "엄밀히 말해 우리나라에는 해안 경비대가 없습니다. 해양 국경 사령부가 통상 국경 방어를 수행하지만, 전담 병력 없이 오스트레일리아 국방군과 오스트레일리아 왕립 해군 부대를 혼합해 운용합니다. 남은 예비군을 하나의 독립된 전투 병력으로 편입하여 모든 위협으로부터 해안을 지킬 임무를 부여함으로써 이를 해결할 수 있습니다."
 AST_remember_the_squander_bug: "낭비 벌레를 기억하라"
 AST_remember_the_squander_bug_desc: "제2차 세계 대전 이후 가장 큰 재정적 난관에 직면한 가운데 방종한 지출은 반역이나 다름없습니다. 옛 고전을 되살려 분쟁 중 과소비하는 돈에 집착하는 시민들을 조롱하고, 그동안 전쟁 채권을 판매할 수 있습니다."
 AST_secure_a_landing: "상륙 거점 확보"
 AST_secure_a_landing_desc: "우리가 지리적으로 고립되어 있는 만큼 모든 침공은 바다를 통해 이루어질 것입니다. 임무의 병참 수요를 충족하려면 상당수의 민간 선박을 징발하고 상륙전 노하우를 끌어올려야 합니다."
 AST_all_in: "총력전"
 AST_all_in_desc: "우리나라의 산업은 눈앞의 위협에 전적으로 투입되어야 합니다. 총력전 체제가 시행될 것입니다. 일부 자유는 일시적으로 유보될 수 있으나, 국가와 군의 요구가 우선되어야 합니다."
 canberra_treaty_idea: "캔버라 조약"
 AST_the_rudd_government: "러드 정부"
 AST_the_rudd_government_desc: "오스트레일리아는 미래를 바라보았습니다. 국민은 우리가 국가로서 앞으로 나아가고, 미래를 계획하며, 함께 그것을 받아들이기로 결정했습니다. 이 나라의 역사에 새로운 페이지를 쓰고 우리의 위대한 조국을 더욱 위대하게 만드는 데 하나로 뭉쳤습니다. \n\n우리는 이 신성한 신뢰를 당연하게 여겨서는 안 됩니다. \n\n교육 제도 개선은 오래전에 이루어졌어야 합니다. 공공 병원 체계의 수용 능력과 복지는 시급한 관심이 필요합니다. 우리의 기반시설은 21세기가 요구하는 수준에 못 미치며, 기후 변화 위기에 대처하려는 의지의 부재는 우리를 수십 년 퇴보시켰습니다. 우리는 현상 유지의 행진자가 아니라 보통 사람들을 위한 도구로서 왔습니다. 이러한 분야와 우리나라가 직면한 더 큰 위협을 다루는 것은 시작에 불과합니다. \n\n우리의 정책은 오스트레일리아 국민과 그들의 필요에 부합해야 합니다. 새로운 십 년으로 나라를 이끌 우리의 능력에 많은 것이 걸려 있습니다."
 AST_mend_the_rift: "균열을 메우라"
 AST_mend_the_rift_desc: "연립 정부의 방치로 사회의 균열 위에 매달려 있던 이들이 그 틈으로 떨어졌습니다. 소외된 이들, 주변부로 밀려난 이들이 밀려날수록 균열도 커졌습니다. 가장 심각한 영향을 받은 지역을 방문하는 것으로 오스트레일리아인을 하나로 모으는 여정을 시작할 수 있습니다. 주택난이 가장 극심한 외딴 공동체, 노숙자 공동체, 고군분투하는 농민과 노동자들이 그곳에 있습니다. 그들의 처지에 빛을 비추면 정부가 진정으로 관심을 갖고 있으며 변화가 오고 있음을 보여줄 수 있습니다."
 AST_heal_the_people: "국민을 치유하라"
 AST_heal_the_people_desc: "현재 우리의 공공 의료는 엉망입니다. 대기 시간 때문에 생명을 구하는 수술이 필요한 사람들이 때로는 최대 1년까지 기다려야 하고, 응급실은 환자가 수술실에 이르지도 못할 만큼 과부하 상태입니다. 국가 기준을 긴급 시행함으로써 공공 병원의 수용 능력 요건을 즉시 확대하고 전국의 최소 인력 수준을 높일 수 있습니다."
 AST_unite_the_country: "나라를 단합시켜라"
 AST_unite_the_country_desc: "이제 배의 키를 잡는 것은 우리의 몫이며, 모두를 배에 태우지 못한다면 제대로 하고 있는 것이 아닙니다. 오스트레일리아인 사이에는 여전히 우리를 온전하게 하지 못하게 하는 간극이 있으며, 과거를 인정하기를 거부하는 태도가 미래를 받아들이는 것을 가로막고 있습니다. 둘 다 이루려면 수 세기 동안 이 나라에서 깨뜨릴 수 없는 악의가 된 불평등을 직시해야 합니다. 이를 완전히 해체하지는 못할지라도 시도할 수는 있습니다."
 AST_economic_revolution: "경제 혁명"
 AST_economic_revolution_desc: "지난 30년간의 위대한 신자유주의 실험이 실패했음을 인정하는 데는 많은 것이 필요하지 않습니다. 그것이 낳은 자유시장 근본주의는 경제 철학으로 포장된 개인적 탐욕에 불과한 것으로 드러났습니다. 아이러니하게도 이제 이러한 형태의 자본주의가 스스로를 잠식하는 것을 막는 일은 사회민주주의자들의 몫이 되었습니다. \n\n우리는 국민에게 책임을 지며 민간의 유인과 공적 책임의 균형을 맞추는 사회적 자본주의라는 새로운 체제를 설계해야 합니다. 규제와 국민을 위한 더 근본적인 안전망을 통해 더 강하고 국가에 봉사하는 경제를 이룰 수 있습니다."
 AST_a_voice_for_all_australians: "모든 오스트레일리아인을 위한 목소리"
 AST_a_voice_for_all_australians_desc: "우리는 미지근한 개혁을 통과시키려고 이 자리에 있는 것이 아닙니다. 우리가 어디로 나아가든 당은 따라올 것이며, 그렇지 않으면 그들을 다잡을 방법을 찾을 것입니다. 진짜 싸움은 우리가 과반수를 차지하지 못한 상원에서 벌어질 것입니다. 무엇이든 통과시키려면 야당과 무소속 의원들의 표로 의석수를 끌어올려야 합니다. \n\n나무를 충분히 세게 흔들고 우리의 계획을 제대로 설득한다면 표 몇 장이 우리 바구니에 떨어질 것이며, 마침내 의미 있는 무언가를 통과시킬 수 있습니다."
 AST_work_with_the_party: "당과 협력하라"
 AST_work_with_the_party_desc: "노동당은 오스트레일리아의 최선의 희망이라는 입지를 거듭 증명해 왔습니다. 현명한 지도력과 검증된 도덕적 공감을 통해 우리는 이 나라 국민뿐 아니라 앞으로 올 이들에게도 이로운 법안을 통과시키는 흐름을 이어갑니다. \n\n현명한 지도자는 당의 의견을 경청해야 할 때도 알아야 합니다. 단결된 당 없이는 개혁을 통과시킬 수 없으며, 현재 정책을 통과시키는 길은 신중함이 없기에는 너무 좁습니다. 합리적인 정책을 제시하는 것만이 하원과 상원을 통과시킬 유일한 방법입니다."
 AST_form_the_pact: "협약을 맺어라"
 AST_form_the_pact_desc: "더 급진적인 제안을 통과시키려면 녹색당에 접근해야 합니다. 그들은 의회의 지나치게 낙관적인 히피들입니다. 지도자 밥 브라운과의 회담이 그들 모두를 결집시키기에 충분할 수 있으나, 그렇게 하면 자유당의 지지는 완전히 잃게 되며, 사실 우리 당원 일부도 잃을 수 있습니다. \n\n그렇더라도 결승선을 넘으려면 그들의 도움이 필요합니다."
 AST_something_has_to_give: "무언가는 바뀌어야 한다"
 AST_something_has_to_give_desc: "우리 사회의 마룻바닥 아래에는 썩은 부분이 있습니다. 우리가 이룬 모든 진보와 사회적 노력에도 불구하고, 상황이 충분히 나쁘다면 오스트레일리아의 누구든 그 틈으로 떨어질 수 있으며 실제로 많은 이들이 그렇습니다. 물론 안전망은 있으나, 우리의 복지 급여가 빈곤선 아래에 있고 노인들조차 굶주림을 면하려 일자리를 구해야 하는 지경이라면 무언가는 바뀌어야 합니다. \n\n우리의 지원 체계는 망가졌고 이 나라의 많은 이들이 이미 그것을 느끼고 있습니다. 더 이상 가만히 서서 악화되도록 놔둘 수 없습니다."
 AST_meet_with_the_unions: "노조와 만나라"
 AST_meet_with_the_unions_desc: "개혁에서 진전을 이루려면 가장 먼저 발을 디뎌야 할 곳은 노조입니다. 어쨌든 노동당은 노동조합이 세웠고, 그들은 우리의 가장 큰 후원자입니다. \n\n노동자들과 접점을 만드는 데 확실히 도움이 될 것이며, 협력에 열려 있다는 신호가 될 것입니다."
 AST_earnest_cheques_for_the_needy: "빈곤층을 위한 성실한 수표"
 AST_earnest_cheques_for_the_needy_desc: "빈곤의 경계에서 살아가는 이들에게는 사고 한 번이나 예상치 못한 청구서 하나가 그들을 벼랑 끝으로 내몰 수 있습니다. 국민에 대한 우리의 지원에는 하한선을 보강하고 취약 계층을 갑작스러운 재정 파탄으로부터 보호하기 위한 일회성 직접 현금 보너스가 포함됩니다."
 AST_new_consensus: "새로운 합의"
 AST_new_consensus_desc: "워싱턴 합의는 1980년대 이래 경제를 위한 표준 처방이었습니다. 이제 새롭고 세계화된 경제들이 그 합의에 도전하는 가운데 오스트레일리아도 자신만의 합의를 찾아야 합니다. 워싱턴의 합의만큼 방임적이지도, 베이징의 합의만큼 권위주의적이지도 않은, 세련된 개입이 될 것입니다."
 AST_insulate_the_homes: "주택 단열"
 AST_insulate_the_homes_desc: "매일 밤 수천 오스트레일리아 가정이 추위 속에서 잠드는 것은 수치스러운 일입니다. 우리 추정으로는 약 40%의 주택이 단열되어 있지 않으며, 여유가 있는 가정조차 난방에 낭비되는 높은 전기 요금을 감당해야 하는데 여유가 없는 가정은 오죽하겠습니까. 주택 소유자가 단열재 설치에 부담할 비용을 지원하는 프로그램을 전국에 시행할 것입니다."
 AST_fair_shake_of_the_sauce_bottle: "소스병을 공평하게 흔들 기회"
 AST_fair_shake_of_the_sauce_bottle_desc: "아이를 갖고자 하는 모든 부부가 직면하는 가장 큰 문제는 경제적 제약입니다. 가장 중요한 시기의 아이를 돌보기 위해 일을 쉬는 것은, 특히 지금처럼 변화하는 경제에서는 고려조차 하기 어려운 일입니다. 오스트레일리아인을 돌보는 것이 우리의 책임인 만큼 가능한 모든 방법으로 지원해야 합니다. \n\n입양 부모를 포함해 오스트레일리아의 모든 부모는 26주의 유급 육아 휴직을 받을 자격이 주어집니다. 원하는 모든 이가 부모가 될 공평한 기회를 얻을 것입니다. 이것이 공정의 정부이기 때문입니다."
 AST_housing_initiative: "주택을 보급하라"
 AST_housing_initiative_desc: "우리는 민간 계약업체들과 향후 10년간 오스트레일리아 전역에서 2만 호가 넘는 신규 사회주택을 건설하고 거주 불가능한 주택 약 1만 2천 호를 수리하는 데 협조하기로 합의했습니다. 첫해에만 노숙으로 고통받는 수천 명이 거처를 얻게 될 것입니다."
 AST_the_care_act: "사회보장 개정안"
 AST_the_care_act_desc: "당 및 자유당과의 오랜 협상 끝에 복지 법안을 매듭지었습니다. 수급 자격과 노동자 프로그램을 개편함으로써 센터링크는 거의 100만 명 더 많은 오스트레일리아인에게 제공될 것입니다. 연금 수급자는 급여가 상당히 인상될 것이며, 이에 따른 균형은 수급 연령을 높이고 메디케어를 조이는 것으로 맞춰 야당을 달랩니다. 장학금은 수백 건 늘고 장애 수당도 인상됩니다. \n\n정부가 뒷받침하는 가운데 점점 더 많은 오스트레일리아인이 더 편안하게 살게 될 것입니다."
 AST_shelter_for_all: "모두를 위한 거처"
 AST_shelter_for_all_desc: "현재 우리의 국가 투자가 충분히 크지 않았다는 듯, 노숙 문제에 대처하려는 우리 계획은 예산 매파들을 히스테리에 빠뜨렸습니다. 우리는 10년간 사회주택 2만 호를 짓는다는 애초 계획을 폐기하고 같은 기간 10만 호로 늘렸습니다. 내년에 처음 지어지는 주택은 가장 위험에 처한 이들의 거처로 곧바로 제공됩니다. \n\n당 내 가장 진보적인 이들조차 이 계획을 대담하다고 하며, 일부는 불가능하다고까지 말합니다. 이 계획이 실현 가능하려면 건설 역량의 대부분을 초기 과정에 투입해야 합니다."
 AST_root_and_branch_approach: "근본적 접근"
 AST_root_and_branch_approach_desc: "우리의 대규모 개혁 상당수는 \\"뿌리부터 가지까지\\"의 변화라고 설명할 수 있으며, 의료나 주택 같은 분야를 개편하려면 뿌리에서부터 시작해야 합니다. 독립적인 검토를 도입하거나 절차를 완전히 재설계하여 훨씬 더 많은 오스트레일리아인을 돕고 더 높은 효율로 운영해야 합니다. 복지 제도를 재설계하려는 우리의 계획은 현재 감당할 수 있는 수준보다 비용이 더 많이 들어, 상당한 적자를 떠안게 되었습니다. \n\n모두를 만족시키고 싶은 만큼, 재원은 어딘가에서 마련되어야 합니다."
 AST_a_stronger_net: "더 튼튼한 그물"
 AST_a_stronger_net_desc: "녹색당의 의견을 반영하여 이 나라 역사상 가장 큰 규모일 복지 법안을 마련했습니다. 현재의 복지 수용 능력과 수급 자격을 전면 개혁하고, 수백만 빈곤층을 겨냥한 대규모 프로그램과 급여를 생활 가능한 수준으로 인상하는 한편 정부 최저임금도 올립니다. 업계에 충격을 주는 것은 분명하며, 우리 규모의 나라가 가질 수 있는 보편적 기본소득에 가장 가까운 것일지도 모르나, 우리 세대보다 오래 지속될 사회 변화를 만들고자 한다면 이것이 그 길입니다. \n\n당내 예산 매파 일부를 잃겠지만, 우리가 이룬 것을 생각하면 그럴 만한 가치가 있습니다."
 AST_bill_of_rights: "우리의 권리 장전"
 AST_bill_of_rights_desc: "선거 이후 다수의 목소리가 정부가 시민의 권리에 초점을 두도록 근본적으로 틀을 잡을 '권리 장전'을 원한다고 밝혔습니다. 이제 바로 그것을 실현할 연방 법령을 제안할 기회가 생겼습니다. 보호적 권리를 도입하고, 사법 제도와 권한 기관을 변경하며, 국민의 평등과 자유와 안전을 지킬 오스트레일리아인에 대한 우리의 책임을 담은 헌장을 의회에 제출하는 것입니다. 한마디로 모든 것을 갖춘 전부입니다."
 AST_the_social_contract: "사회 계약"
 AST_the_social_contract_desc: "돌봄과 지원 체계는 점차 줄어들고 쇠퇴하여, 가진 것 없는 이들의 수가 다수가 되기에 이르렀습니다. 오스트레일리아인이 자유롭다는 말은, 그들을 거듭 실패하게 한 체계가 최소한의 필수품마저 국가에 의존하게 만들었다는 말만큼도 진실하지 않습니다. 다른 곳에서도 같은 체계가 돌봄이 필요한 이들을 외면해 왔습니다. \n\n이제 상황을 바꾸는 것은 우리의 책임입니다. 외면당하고 불리한 처지에 놓인 이들을 다룰 것입니다. 이 체계는 계속될 수 없습니다."
 AST_a_national_congress: "전국 의회"
 AST_a_national_congress_desc: "ATSIC은 통합된 진보를 향한 한 걸음이었으나, 어느 시점에서 길을 잃었고 진정한 대표성이라는 목적은 끝내 실현되지 못했습니다. 오스트레일리아 인권위원회와 협력하여 이를 대체할 오스트레일리아 원주민 전국 의회를 새로이 조직할 수 있습니다. 이를 통해 원주민 오스트레일리아인과 더욱 적극적으로 협력하여 평등과 선제적 변화에 초점을 맞춘 정책을 시행할 수 있습니다."
 AST_visit_the_schools: "학교를 방문하라"
 AST_visit_the_schools_desc: "경제 혁명과 마찬가지로 학교 제도도 상향식 개혁이 필요합니다. 우리는 이미 직업학교를 개보수하고 새로 짓는 데 대규모 투자를 하는 계획을 세워 두었으며, 퀸즐랜드의 지역 학교 몇 곳을 방문해 현장의 실상을 파악하는 것으로 시작할 수 있습니다."
 AST_digital_education: "디지털 교육"
 AST_digital_education_desc: "인터넷의 등장은 오스트레일리아인, 특히 젊은 세대에게 놀라운 일이었습니다. 어릴 때부터 더 잘 활용하도록 가르친다면 다음 세대는 새로운 디지털 영역을 다룰 역량을 갖추고 그것이 가져올 위험을 피할 수 있을 것입니다. 다른 개보수와 함께 교실에 컴퓨터를 다수 설치하는 것이 현대 시대에 대비하게 해 줄 것입니다."
 AST_a_national_agreement: "국가 합의"
 AST_a_national_agreement_desc: "원주민 정책에서 우리와 협력할 의향이 있는 야당 의원들이 여럿 있습니다. 이 문제들을 실제 위기로 인식하도록 설득할 수 있다면 법안을 긴급 조치로 처리할 수 있습니다. 외딴 지역의 만성 질환, 문해율, 1차 의료 접근성을 겨냥한 프로그램을 신속하게 시행하게 됩니다."
 AST_state_health_reform: "주 보건 개혁"
 AST_state_health_reform_desc: "통상 각 주가 자체 재원으로 공공 병원을 운영합니다. 그러나 최근 그들은 해이해졌거나 심각한 재정 문제를 겪고 있으며, 현재의 의료는 충분하기에는 턱없이 부족하기 때문입니다. 재정 개혁을 관리할 유일한 방법은 병원 재정 관리를 인수하되 일반 운영은 지역에서 계속 맡도록 하는 것입니다.  \n\n우리 자체 검토를 실시하여 어느 지역이 개선이 필요한지 파악하고 거기서부터 진행할 수 있습니다. 그들이 소란을 피운다면 연방 정부에 공공 병원 전권을 부여하는 헌법 국민투표로 위협해야 하며, 그러면 그래도 짖을지 두고 볼 일입니다. \n\n이번에는 책임이 우리에게 있습니다."
 AST_equal_opportunity: "평등한 기회"
 AST_equal_opportunity_desc: "우리에게는 혼인 평등권에 대한 요구를 가로막을 권리가 없습니다. 우리가 앞장서서 옹호하지 않더라도 이 문제를 국민투표에 부쳐 여론이 어디에 있는지 가늠할 수 있습니다. 통과되고도 야당이 여전히 우리에게 반대한다면 다음 선거의 연료로 삼을 수 있습니다."
 AST_respect_traditional_values: "전통적 가치 존중"
 AST_respect_traditional_values_desc: "공정한 정부는 다수의 필요에 귀를 기울이면서도 소수의 생계를 존중할 책임이 있습니다. 오스트레일리아는 절제되고 신중한 지도력 덕분에 번영해 왔습니다. 우리는 종교에 반하는 케이크를 굽도록 누구에게도 강요하지 않을 것이며, 문화 전쟁에 불을 지피지도 않을 것입니다. 이번에는 한 걸음 물러설 때입니다."
 AST_clean_feed: "클린 피드"
 AST_clean_feed_desc: "디지털 교육 프로그램이 있더라도 인터넷의 최악의 면이 청소년에게 영향을 미치는 것을 막을 수는 없습니다. 지금도 온라인 괴롭힘과 사이버 범죄가 오스트레일리아인의 삶 자체를 위협하고 있습니다. 우리는 이 의무를 인터넷 서비스 제공업체에 위임하여 페이스북 같은 소셜 미디어 플랫폼이 이용자가 적정 연령인지 확인하도록 요구할 것입니다."
 AST_close_the_gap: "격차를 좁혀라"
 AST_close_the_gap_desc: "원주민 문제에 접근하는 우리의 핵심적이고 지속적인 정책은 기대 수명, 교육 성취, 경제적 기회의 격차를 좁히는 것이었습니다. 특히 원주민 오스트레일리아인의 기대 수명은 비원주민 시민보다 거의 10년 짧습니다. 문해율도 훨씬 낮고, 아동 사망률은 비원주민의 두 배입니다. \n\n요점은 아실 것입니다. 이 대의를 위한 폭넓은 프로그램을 포함한 법안을 내놓고, 원주민의 삶을 개선할 확고한 목표를 세워야 합니다."
 AST_tackle_the_mining_oligarchy: "광업 과두 세력에 맞서라"
 AST_tackle_the_mining_oligarchy_desc: "우리 정부에 영향력을 행사해 온 음험한 세력은 우리 땅에서 빨아들인 부 덕분에 오늘날까지도 그렇게 하고 있습니다. 수 세기 동안 그들은 재산을 쌓고도 나누기를 거부했으며, 고용한 노동자들에게는 너무 적게 지급하고 너무 쉽게 내쳤습니다. 이제 그들이 자기 몫을 낼 때이며, 오스트레일리아 국민이 자기 땅에서 나오는 광석에 대한 보상을 받아야 할 때입니다."
 AST_draft_the_legislation: "법안을 기초하라"
 AST_draft_the_legislation_desc: "우리가 이루려는 것의 규모를 감안하면 허점이 전혀 없는 궁극의 세법을 기초하고, 모을 수 있는 모든 전문가를 모아 힘을 보태게 해야 합니다. 하려면 제대로 해야 합니다."
 AST_tax_the_super_profits: "초과 이윤 과세"
 AST_tax_the_super_profits_desc: "의회에서 보낸 숱한 밤샘이 우리에게 대기업에 맞설 빛나는 창을 안겨 주었습니다. 가장 큰 기업을 겨냥하고 기업이 평소 수익률을 크게 초과했을 때 얻는 \\"초과 이윤\\"에만 부과하는 역동적인 세율은, 마침내 광업 호황 동안 긁어모은 수익 일부를 아래로 흘러가게 할 것입니다. 기업이 실적이 부진했거나 운영 비용이 수익을 초과하면 세금이 없으므로 부당 과세라는 낙인도 피할 수 있습니다."
 AST_throw_businesses_a_bone: "기업에 뼈다귀를 던져라"
 AST_throw_businesses_a_bone_desc: "주 사이의 규제는 한마디로 과도합니다. 크고 작은 기업 모두에 막대한 비용을 안기고 상거래를 크게 둔화시키며, 이는 지역 내 물가만 올릴 뿐입니다. 산업계에 뼈다귀를 던져 우리가 그들을 적대하려는 것이 아님을 보이고 싶다면, 경제인 협의회와 함께 매끄러운 전국 경제를 만들 수 있습니다. 산더미 같은 관료적 형식주의를 줄이는 대신 이동과 흐름을 더 수월하게 만드는 것입니다."
 AST_tear_off_special_interests: "이익 단체를 떼어내라"
 AST_tear_off_special_interests_desc: "이익 단체는 우리 정치 체제에서 오래전에 처리했어야 할 악성 존재가 되었습니다. 이들은 선거 주기와 정치 과정에 부당한 영향력을 행사합니다. 반대편에 대해서는 말할 수 없으나, 우리 당 내부의 부당한 영향력을 조사하면 덩굴 일부를 끊어낼 수 있을지 모릅니다. 영원히 없애지는 못하더라도 앞으로 제거하기가 더 쉬워질 것입니다."
 AST_own_our_resources: "우리 자원을 소유하라"
 AST_own_our_resources_desc: "정부의 가장 큰 실수 중 하나는 우리 자신이 지분을 갖지 않은 채 외국인이 우리 자원을 소유하도록 허용한 것이었습니다. 그들의 지속적인 성장으로 우리가 톡톡히 이득을 본 것도, 세계 경제가 성공을 거둔 데에 이유가 있는 것도 사실이지만, 우리 국가의 이익을 소홀히 해서도 안 됩니다. \n\n우리는 이미 우리 땅에서 채굴하는 광업 기업들로부터 로열티를 받고 있으며, 비용을 올리면 단기적으로는 항의하겠지만 결국 협상 테이블에 나올 것이고 그러면 우리나라의 광물이 어떻게 다뤄질지 더 잘 협상할 수 있습니다."
 AST_spirit_of_gough: "고프의 정신"
 AST_spirit_of_gough_desc: "고프 휘틀럼의 비극적인 이야기는 역사책에 오를 만합니다. 너무 높은 야망을 품었다가 주변의 권력에 의해 꺾인 사람입니다. 짧은 재임에도 그는 진보 정치의 위대한 혁명가로 빛났으며, 그를 무너뜨린 것은 커져가는 광업계의 지배력을 억제하려는 시도뿐이었습니다. \n\n그가 계획했던 규모의 소유권을 시행하기에는 너무 늦었을지도 모르지만, 그에게 부끄럽지 않을 수는 있습니다. 최초의 정부 운영 광업 기업을 설립함으로써 기업들을 우회하고 우리 광산에서 직접 광석을 캐내 모든 이익과 보상을 우리가 차지할 수 있습니다."
 ast_spirit_of_gough_tt: "§0석유 광물청§!을 설립합니다."
 AST_twenty_twenty_summit: "2020 정상회의"
 AST_twenty_twenty_summit_desc: "2020 정상회의는 우리 정부의 더 적극적인 통치 방식에서 비롯된 구상입니다. 지역 사회 지도자, 전문가, 시민 1,000명을 초청해 국가의 미래를 위한 전략을 논의하는 열린 민주적 토론장입니다. 오스트레일리아인이 스스로 미래를 결정하는 것은 임기를 시작하는 훌륭한 방법이며, 우리가 변화에 헌신하고 있음을 보여줍니다."
 AST_kyoto_accords: "교토 공약"
 AST_kyoto_accords_desc: "교토 의정서 비준은 시작에 불과합니다. 그 잠재력을 온전히 발휘하게 하려면 더 나아가야 합니다. 뒤집지 않은 석탄 덩어리는 하나도 남기지 않을 것입니다."
 AST_big_australia: "큰 오스트레일리아"
 AST_big_australia_desc: "이 구상은 2020 정상회의에서 나왔습니다. 적은 인구는 우리가 강대국 반열에 오르는 여정을 가로막는 몇 안 되는 요인 중 하나였습니다. 지금은 아이를 낳을 수 있는 수에 한계가 있습니다. 새 계획에는 이민 제도의 수용 규모를 근본적으로 늘려 2050년까지 3,600만 명에 도달하기 위한 단계가 포함되어 있습니다. 모든 것을 간소화해야 합니다."
 AST_seasonal_labour_scheme: "계절 노동 제도"
 AST_seasonal_labour_scheme_desc: "적은 인구라는 속박은 단기적으로는 수입 노동력의 유입으로만 개선할 수 있습니다. 규제를 완화하여 더 많은 외국인 노동자를 우리 산업으로 유입시키면 그동안 산업이 계속 성장할 수 있으며, 앞으로 예상되는 위축도 늦출 수 있습니다."
 AST_our_sibling_state: "우리의 형제국"
 AST_our_sibling_state_desc: "시드니보다 인구가 적은 나라와 우리 사이의 치열한 경쟁심을 헤아릴 수 있는 사람은 드뭅니다. 스포츠든 무엇이든, 그들이 이기면 그 소리를 끝없이 듣게 될 것입니다. 우리 경제는 이미 상당히 동조화되어 있으나, 우리는 두 나라를 재정적으로 사실상 묶어 줄 무역 협정을 추진해 왔습니다. 성공한다면 무역과 투자가 물처럼 우리 사이를 흐를 것입니다."
 AST_pacific_islands_forum: "태평양 도서국 포럼"
 AST_pacific_islands_forum_desc: "몇 년마다 우리나라와 뉴질랜드, 그리고 도서 국가들이 모여 지역 이익을 논의하고 그들이 직면한 과제를 다룹니다. 이는 태평양 이웃 나라들을 파악하는 효과적인 방법이었습니다. 올해는 노동 허가 문제가 핵심 의제였으며, 몇몇 국가는 원예 공동 개발을 위한 임시 허가를 논의했습니다. 우리가 그들을 받아들이기로 하든 아니든, 이 계획에는 분명 장점이 있습니다."
 AST_end_the_imperialism: "제국주의를 끝내라"
 AST_end_the_imperialism_desc: "아마도 나라에서 가장 높은 자리에 앉았기에 명확한 시야를 얻게 된 것 같습니다. 선임자들이 만든 고착된 환경에서도 때로는 실제로 선택권이 있습니다. 전 세계에 불필요한 간섭과 해악을 계속 끼칠 것인지, 아니면 물러나 우리 주위에 형성된 경계를 존중할 것인지 말입니다."
 AST_maintain_obligations: "의무를 유지하라"
 AST_maintain_obligations_desc: "우리는 앞선 정부들과 그들이 태평양과 그 너머에서 만들어 낸 이익에 대해 일정 수준의 책임을 지고 있습니다. 우리의 정책이 종종 그러하듯 수백만의 삶에 영향을 미칠 때는 부드러운 손길로 접근해야 합니다. 이렇게 이른 시기에 관계에 쇠망치를 휘두르면 우리에게 나쁜 결과만 돌아옵니다. 가진 것을 지키고 가능한 곳에서 개선하는 것이 최선입니다."
 AST_the_free_trade_area: "자유무역지대"
 AST_the_free_trade_area_desc: "아세안 국가들과 수개월 협상한 끝에 대단히 수익성 높은 기회를 얻게 되었습니다. 우리나라와 뉴질랜드는 무역 블록에 가입할 기준을 충족하지 못하지만, 외부 '파트너'가 됨으로써 그 혜택의 일부를 누릴 수 있으며, 사실상 우리와 아시아 사이에 자유무역 지대를 만드는 것입니다."
 AST_the_beginning_of_something_new: "새로운 무언가의 시작"
 AST_the_beginning_of_something_new_desc: "아세안 협약이 지난 수십 년간 아시아 국가들을 통합하는 데 잘 작동했지만, 태평양의 3대 경제는 여전히 거의 묶여 있지 않습니다. 일본, 인도, 중국이 각자 협정을 맺고 있을지라도 유럽에 세워진 연합에 비하면 초라합니다. \n\n분명 야심 찬 구상이지만 우리나라를 포함한 이 국가들을 하나의 경제 연합으로 묶을 수 있다면 재정적 번영은 시작에 불과할 것입니다. 단일 통화만으로도 태평양 전역의 평화를 이룰 수 있을 것입니다."
 AST_address_the_tiger: "호랑이와 대화하라"
 AST_address_the_tiger_desc: "인도와의 관계는 현재 순조롭습니다. 심지어 아주 좋다고 말하는 이들도 있습니다. 좋은 것을 망치려 해서는 안 되지만, 개선하지 말라는 법은 없습니다. 중국에 대한 그들의 태도는 연합을 결성하는 데 우리가 직면할 가장 큰 걸림돌 중 하나입니다. 어떤 돌파구를 마련할 수 있다면 나머지 작업은 식은 죽 먹기일 것입니다."
 AST_an_asian_pacific_union: "아시아 태평양 연합"
 AST_an_asian_pacific_union_desc: "우리가 해내려는 일을 위해서는 모든 조각이 완벽한 자리에 놓여야 합니다. 우리가 얼마나 멀리 갈 수 있고 지정학적 역사에 얼마나 큰 흔적을 남길지는 이번 회담이 좌우할 것입니다. 우리의 노력이 마침내 결실을 볼 것입니다."
 AST_renegotiate_with_papua: "보트 위기에 대처하라"
 AST_renegotiate_with_papua_desc: "매년 수천 명의 이주민이 서류 없이 우리 해안에 상륙하고 있으며 그 수는 늘기만 하는 듯합니다. 기존 시설이 한계에 이르고 있어, 현재의 위기에 대응하려면 역외 처리 방안을 재검토해야 합니다."
 AST_keep_the_gears_turning: "톱니바퀴를 계속 돌려라"
 AST_keep_the_gears_turning_desc: "우리는 세계와 너무 깊이 얽혀 있어 그냥 빠질 수 없습니다. 대리를 통한 봉쇄 정책은 우리가 톱니바퀴에 계속 기름을 치고 약속을 지킨다는 것을 보여줄 때에만 작동합니다. 등을 돌릴 때의 위험이 너무 큽니다. 더 큰 선도 없고 정당한 명분도 없습니다."
 AST_world_hold_on: "세계여, 기다려라"
 AST_world_hold_on_desc: "다른 나라들에 오스트레일리아가 정점을 찍은 것이 아님을 알려야 합니다. 우리는 여전히 여기 있고, 해외로 나아가고 있습니다. 대기업의 발목을 잡는 규제를 줄여 해외 투자를 장려하는 것은 우리가 자랑스러워할 만한 경제적 식민주의입니다. 폭스 뉴스와 아웃백 스테이크하우스는 우리가 할 수 있는 일의 일부분을 보여준 것에 불과했습니다. 그들도 알게 될 것입니다."
 AST_assure_the_other_side: "상대편을 안심시켜라"
 AST_assure_the_other_side_desc: "우리는 기업 없이는 살아갈 수 없습니다. 상거래는 우리 산업을 흐르는 혈구와 같습니다. 당의 의무는 차치하고, 현재의 재정 변화 속에서 그들을 지원하는 데 이해관계를 두지 않는다면 경제의 심장 자체가 멈출 수 있습니다. 그들이 간접적으로 우리를 지원하듯, 우리도 그들을 지원하는 균형을 찾아야 합니다."
 AST_forward_with_fairness: "공정함과 함께 전진"
 AST_forward_with_fairness_desc: "우리는 노동자의 삶을 개선하는 데 전적으로 찬성하지만, 이런 시기에 기업 성장을 억누르는 것은 선택지가 될 수 없습니다. 오스트레일리아 노동 협약(AWA)을 폐지하고 단체 교섭을 도입하면 우리가 기업의 이익을 위해 기꺼이 일할 의지가 있음을 보여줄 것입니다. 결국 일할 권리는 노조가 아니라 노동자에게 남아 있어야 합니다."
 AST_represent_the_worker: "노동자를 대변하라"
 AST_represent_the_worker_desc: "노동은 단순한 경제적 상품이 아니라 본질적 존엄을 지닌 인간으로 이루어져 있습니다. 노동자들이 우리가 그들의 편이라고 믿지 않는다면, 어떻게 스스로의 권리를 위해 일어서기를 기대하겠습니까. 우리가 우리 국민보다 기업의 뜻을 우선시하는 것처럼 보여서는 안 됩니다."
 AST_the_emissions_trading_scheme: "배출권 거래제"
 AST_the_emissions_trading_scheme_desc: "기후 변화는 우리 시대의 가장 큰 도덕적 도전이 되었습니다. 우리만이 아니라 전 세계가 그렇습니다. 수백 개 국가가 임박한 위험에 대한 경고를 받고 있으나 그들이 행동할 힘은 시험받고 있습니다. 우리 산업의 편의를 미래 세대의 것을 위해 제쳐 둘 수 있겠습니까? 환경을 보존하면서 경제를 새로운 높이로 이끌 부담을 진정으로 감당할 수 있겠습니까? 우리에게 대답은 언제나 그렇다입니다. \n\n이 제도는 기업의 CO2 배출량에 상한을 두는 우리의 가장 오래된 선거 공약 중 하나입니다. 기업이 더 많이 배출하려면 정부가 할당한 허가를 받거나 고가로 구매해야 하며, 그 결과 단기적으로 에너지 생산이 감소합니다. 재생 에너지를 장려하면서 배출량을 2000년 이전 수준으로 줄이는 것이 목표이지만, 상당한 신규 세수를 올려 줄 것임은 분명합니다."
 AST_cut_the_csiro: "CSIRO를 삭감하라"
 AST_cut_the_csiro_desc: "안타깝게도 연방 과학산업연구기구는 제 몫을 하지 못하고 있습니다. 다른 기관 전체를 충당할 만큼 부풀려진 보조금이면 무언가를 내놓았을 법하지만, 지난 수십 년간 비용은 늘어나고 가치 있는 성과는 거의 나오지 않았습니다. 정상 궤도로 돌려놓을 만큼 도려내야 하며, 이는 우리 국고에도 해가 되지 않을 것입니다."
 AST_green_energy_incentives: "녹색 에너지 인센티브"
 AST_green_energy_incentives_desc: "화석 연료가 쇠퇴하고 있다면 재생 에너지는 상승해야 합니다. 그뿐만 아니라 앞으로 전국적인 도입을 이루려면 장려가 필요합니다. 지열 에너지를 개발하고 녹색 자동차 혁신 기금에 투자하면 올바른 방향으로 나아가게 될 것입니다."
 AST_fair_work_australia: "페어 워크 오스트레일리아"
 AST_fair_work_australia_desc: "기업과 정부 사이의 단절을 고려하여, 당은 기업의 이익을 대변해 우리의 초점을 그들과 더 잘 맞추는 관계국 설립을 권고했습니다. 이로써 직장 관계법과 악명 높은 워크초이스 개혁을 폐지할 수 있습니다. 노조의 의견을 반영해 시행하면 통상적인 노동자 보호 장치 일부를 도입하면서 양쪽 주장을 모두 달랠 수 있습니다."
 AST_snip_the_red_tape: "관료주의를 잘라내라"
 AST_snip_the_red_tape_desc: "연방이 상당히 통합되어 있음에도 주 정부들은 우리가 바라는 만큼 협력하지 못하고 있습니다. 기업이 등록하려면 사업을 하는 각 주마다 서류와 수수료를 거쳐야 하며, 두 개 주에서 영업하면 수수료와 서류가 두 배입니다. 단일 전국 온라인 등록 제도를 만들면 전국 누구나 한 번만 등록하고 곧장 사업에 나설 수 있습니다."
 AST_for_the_common_farmer: "평범한 농민을 위하여"
 AST_for_the_common_farmer_desc: "세기가 바뀐 이후 우리 농민들은 힘든 시간을 보냈습니다. 공교롭게도 가장 큰 우려는 밀레니엄 가뭄이었으며, 우리의 정책에도 불구하고 농업 회복을 계속 가로막고 있습니다. 옹호 단체들과 마주 앉으면 실질적인 해결책을 마련하는 데 도움이 될 것입니다."
 AST_walkable_cities: "20분 도시"
 AST_walkable_cities_desc: "우리의 가장 큰 싸움은 거리에서 벌어져 왔습니다. 산업 혁명이 시작될 때 시민들은 좁은 골목으로 내몰렸고 아스팔트 풍경을 사교의 장으로 삼을 수밖에 없었습니다. 그 이후 우리의 공동체 의식은 위축되었고 실내 오락을 위해 희생되는 존재가 되었습니다. 사람들에게 바깥으로 나가라고 강요할 수는 없지만, 유인할 수는 있습니다. \n\n멜버른 시의회가 개발한 20분 도시 계획을 도입하여 중심가의 소음 규제를 완화하고 다수의 창의적 프로젝트와 축제에 자금을 지원함으로써 사람들을 다시 거리로 불러내 공동체 의식을 재건할 수 있습니다. 여기에 무료 청소년 프로그램과 기반시설 확충을 더하면 우리의 동네는 몇 년 안에 문화가 북적이는 중심지가 될 것입니다."
 AST_keep_them_safe: "그들을 지켜라"
 AST_keep_them_safe_desc: "오스트레일리아에는 국가 동물이 없지만 대부분은 붉은캥거루라고 주장할 것입니다. 거의 세계적으로 알려진 상징이지만, 오지의 숲에 서식하는 귀여운 동물에 대해서도 그만큼 많은 이들이 알고 있습니다. 벌목 회사든 질병이든 매년 코알라의 개체 수 감소는 악화되고 있으나 이를 보호하기 위해 이뤄지는 일은 거의 없습니다. 이들을 보호종으로 지정하면 이 인상적인 유대류를 멸종으로부터 지키고 계속 살아가게 하기 위해 마침내 더 많은 일을 할 수 있습니다."
 AST_industry_research_bank: "연방 연구 은행"
 AST_industry_research_bank_desc: "우리의 연구가 부진했던 것은 우리가 그렇게 두었기 때문입니다. 핵심 분야에 대한 투자 부족은 기관들이 본래 설립된 목적인 장벽을 돌파하는 일을 하지 못하게 합니다. 예산을 늘리고 목표를 높이십시오."
 AST_natos_best_friend: "나토의 가장 좋은 친구"
 AST_natos_best_friend_desc: "오스트레일리아는 이미 나토의 가장 가까운 비회원 동맹국 중 하나입니다. 우리는 나토와 함께 훈련하고, 평화 유지 활동을 하며, 정보를 공유합니다. 올바른 후원이 있다면 태평양에서의 우리 입지는 훨씬 더 강화될 수 있으며, 우리의 중립에도 장점은 있으나 이제는 더 긴밀한 헌신으로 나아갈 때입니다."
 AST_from_the_ashes: "잿더미에서"
 AST_from_the_ashes_desc: "다시 지휘권을 되찾은 만큼 다음 선거에서 승리하는 데 집중해야 합니다. 우리의 정책은 단기에 맞춰져야 하며, 당을 우리 뒤로 결집시키려면 약간의 영감과 풍부한 압박이 필요합니다."
 AST_a_new_dawn: "새로운 여명"
 AST_a_new_dawn_desc: "국민은 노동당을 다시 태어난 정당으로 보아야 합니다. 내분이라는 낡은 허물을 벗어야 하며, 유권자 기반을 되살리기 위해 유능하고 믿음직한 새로운 이미지를 구상해야 합니다."
 AST_repair_the_party: "당을 바로잡아라"
 AST_repair_the_party_desc: "당내 계파와의 옛 관계는 거의 너덜너덜해졌습니다. 더 나쁜 것은 우리가 축출될 수 있었던 제도가 여전히 존재한다는 점입니다. 현행 메커니즘을 뿌리 뽑아 지도부 쿠데타가 덜 일어나도록 하고 당 규정을 다시 쓰는 것만이 상황을 바로잡을 유일한 방법입니다."
 AST_fight_back: "반격하라"
 AST_fight_back_desc: "뉴스코프 언론이 우리를 계속 진흙탕에 끌고 다녀도 우리에게 대답이 없을 것이라 생각한다면 꿈을 꾸는 것입니다. 토론의 장은 쌍방향 도로이며, 우리는 그들에게 강하게 되받아칠 것입니다."
 AST_on_the_campaign_trail: "선거 유세 길에서"
 AST_on_the_campaign_trail_desc: "솔직히 지난 몇 년은 이상적이지 않았고 노동당은 분명 길을 잃었습니다. 전국의 농촌과 도시 오스트레일리아인을 방문하여 그들에게 영향을 미치는 실제 문제를 이해하는 것은, 우리가 경청하는 정당으로 돌아갈 준비가 되었음을 보여줍니다. 전국 대회 출마를 선언하는 것으로 시작합니다."
 AST_win_manufacturers: "제조업계를 얻어라"
 AST_win_manufacturers_desc: "우리는 오스트레일리아 일자리법으로 두 번째 임기를 힘차게 시작합니다. 20억 달러 규모의 패키지로 제조업 노동자 7,000명을 재교육하여, 전통 자동차 및 섬유 시장이 규모를 줄이는 동안 생산 부문으로 전환하도록 돕습니다. 지속되는 산업 침체에 대한 현실적인 해법입니다."
 AST_cast_the_die: "주사위를 던져라"
 AST_cast_the_die_desc: "우리의 칩은 놓였고, 오스트레일리아 국민은 다음 지도자를 선택할 준비가 되었습니다. 우리는 준비하고 비전을 제시하기 위해 할 수 있는 모든 것을 했으며, 이제 유권자가 이에 동참하기를 바랄 뿐입니다."
 AST_the_gillard_gov: "길러드 정부"
 AST_the_gillard_gov_desc: "이 정부는 가장 크게 불평하는 이들이 아니라 가장 열심히 일하는 이들에게 보상한다고 믿습니다. 공장과 농장에서, 광산과 제분소에서, 교실과 병원에서 하루하루 일하는 이들, 그 근면과 품위와 노력에 보답한다고 믿습니다. 규칙을 지키고, 일찍 알람을 맞추고, 아이들을 학교에 보내고, 이웃 곁에 서고, 조국을 사랑하는 사람들입니다. \n\n우리나라는 여러 면에서 축복받았으나 국가 재정 상태는 방치될 정도로 부식되고 비대해졌습니다. 나는 모든 오스트레일리아인에게 우리의 지휘 아래 예산이 건강을 되찾을 것임을 약속합니다. 앞선 이들이 남긴 책무를 이어받아, 목소리 큰 소수 이상의 필요를 이해하는 재정적으로 책임 있고 강한 정부를 이끌어 나갈 것입니다. \n\n언론 정치는 끝날 것입니다. 우리 산업의 필요에 대한 무관심도 끝날 것이며, 품위와 분별이 돌아올 것입니다."
 AST_form_the_minority_coalition: "소수 연립을 구성하라"
 AST_form_the_minority_coalition_desc: "노동당의 미래는 이제 정부를 구성할 수 있는 우리의 능력에 달려 있습니다."
 AST_go_green: "녹색으로 가라"
 AST_go_green_desc: "등 뒤에서 칼을 꽂지 않을 때의 녹색당은 우리의 대의에 유용한 정당이었습니다. 그들과의 협상은 큰 문제가 되지 않을 것이며 정책 선호의 대부분이 우리와 일치합니다. 물론 여기저기 형식적인 개혁 몇 가지는 시행해야 하겠지만, 중요한 때에는 그들이 우리 편에 설 것입니다."
 AST_wrangle_liberal_defectors: "자유당 이탈자를 끌어들여라"
 AST_wrangle_liberal_defectors_desc: "자유당과 국민당의 현직 의원 몇몇이 우리 의제에 관심을 보였고, 일부는 최근의 당내 소동을 계기로 이미 이탈했습니다. 이들을 찾아내 지지의 대가로 정부 내 자리를 제안하는 것은 어렵지 않을 것이며, 보수적 가치를 지키기 위해 우리가 야당과 협력하는 것을 마다하지 않음을 보여줄 것입니다."
 AST_clean_energy_act: "청정 에너지법"
 AST_clean_energy_act_desc: "배출권 거래제 출범이 실패한 뒤, 늘어나는 탄소 배출에 대응하기 위해 덜 분열적인 대안이 기초되었습니다. 법의 범위는 아직 온전히 정해지지 않았으나, 배출권 거래제와 마찬가지로 새로 도입한 세금으로 CO2 배출을 제한하고 청정 에너지 생산을 장려하는 것이 목표입니다."
 AST_clean_energy_creation: "청정 에너지 창출"
 AST_clean_energy_creation_desc: "우리는 기후 위기에 대처하는 데 큰 성과를 올렸으며, 자금의 일부를 계획을 이어가는 데 투자할 때입니다. 장기적 목표는 언제나 석탄 매장량으로부터 재생 에너지 자립을 이루는 것이었습니다. 전환을 시작합시다."
 AST_address_the_stolen_generations: "도난당한 세대에 대한 연설"
 AST_address_the_stolen_generations_desc: "국가 사과에 편승한다는 인상을 주지 않으면서 도난당한 세대에 대한 연설을 할 만큼의 지지가 야당에도 있습니다. 확실히 우리가 초당적으로 보이게 할 것이며, 지역 사회 일부에게는 위안의 원천이 될 수 있습니다."
 AST_correct_the_mouthboxes: "확성기를 바로잡아라"
 AST_correct_the_mouthboxes_desc: "기업과 정치 운동가들은 온라인과 TV에서 거의 아무런 결과도 치르지 않고 노골적으로 거짓말을 해도 되는 상황이었습니다. 악의나 진실에 대한 해이로 인한 피해를 입증하기는 어렵지만, 이 우려스러운 추세가 계속되도록 놔둘 수는 없습니다. 오도하는 광고나 게시물을 처벌하는 법안을 도입하면 추세를 억제하고 정치에 어느 정도 현실을 되돌릴 수 있을 것입니다."
 AST_let_debate_decide: "토론이 결정하게 하라"
 AST_let_debate_decide_desc: "녹색당이 우리에게 건넨 법안 중 하나는 동성 자유를 확대하는 것을 목표로 합니다. 우리 정부는 그 방향으로 갑작스럽게 움직이는 데 반대까지는 아니더라도 여전히 상당히 관망하고 있으나, 의회가 공정한 방식으로 결정하도록 맡길 수 있습니다."
 AST_ndis: "NDIS를 창설하라"
 AST_ndis_desc: "장애는 우리 누구에게나 닥칠 수 있고 따라서 우리 모두에게 영향을 미친다는 것이 단순한 진실입니다. 그 결과에 재정적으로 대비된 사람은 거의 없으며, 지금 고립과 빈곤, 존엄의 상실에 직면한 이들은 장애인을 위해 특별히 마련된 복지 서비스의 얼마 안 되는 지원에 의존할 수밖에 없습니다. \n\n국가 장애 보험 제도의 도입은 고프 휘틀럼의 보편적 의료 도입 이후 가장 의미 있는 지원일 수 있습니다. 고통받는 수백만 명이 필요한 지원을 받게 될 것이며, 나라는 그로 인해 더욱 자랑스러워질 것입니다."
 AST_the_gonski_review: "곤스키 보고서"
 AST_the_gonski_review_desc: "임기 초에 우리는 학교 제도에 대한 검토를 의뢰해 손볼 필요가 있는 결함을 찾아내도록 했습니다. 검토 결과 사회경제적 지위와 재정 비효율로 인해 교육 성과의 격차가 누적되고 있음이 드러났습니다. 한마디로 재정 지원을 덜 받는 공립학교는 전반적으로 더 낮은 성적을 받게 되었습니다. \n\n문제를 해결하고 학생들을 돕기 위해 교육 재정을 근본적으로 재편해야 합니다. 결국 그들은 우리나라의 미래입니다."
 AST_take_less: "덜 걷어라"
 AST_take_less_desc: "자유당이 옳은 것은 거의 없지만 세금을 낮게 유지하는 것만은 올바르게 파악하고 있습니다. 우리가 그들의 노동의 대부분을 가져간다면 평범한 오스트레일리아인이 노동의 대가를 소중히 여기기를 어떻게 기대하겠습니까. 더 강한 국민은 주머니에 더 많은 것을 가진 국민입니다."
 AST_get_more: "더 거두어라"
 AST_get_more_desc: "죄악세는 건국 이래 활용되어 왔으나, 최근에는 하층민이 퇴폐적 활동에 탐닉할 권리를 위해 외면받았습니다. '사회적으로 수용적'으로 보이는 것과 어떤 도덕적 기개를 지니는 것 사이의 선택은 우리에게 쉬운 일입니다."
 AST_regulate_the_unions: "노조를 규제하라"
 AST_regulate_the_unions_desc: "좋든 싫든 노조는 그 정의상 경제 성장의 걸림돌입니다. 노조는 노동자가 일할 자유와 기업이 고용할 권리라는 바로 그 자유를 잠식합니다. 노조가 정부를 통제하고 번영을 질식시키기 위해 휘둘러 온 정치적 권력에 우리는 사실상 목이 졸리고 있습니다. \n\n이들의 영향력을 제한하고 이 나라의 정치를 극좌 소인배 관료들에게 지배당하지 않고 정부 안에 두도록 하는 법안이 허용되어야 합니다."
 AST_national_broadband_network: "국가 광대역 네트워크"
 AST_national_broadband_network_desc: "NBN은 지금까지 거의 10년째 개발 중이며, 오스트레일리아 전역의 네트워크 속도를 현대 수준에 맞추려는 이 계획에 이미 수십억이 투입되었습니다. 오히려 이 프로젝트는 필요 이상으로 오래 걸렸는데도 야당은 여전히 비용을 두고 아우성칩니다. 우리의 삭감이 어떤 목적을 위한 것이었다면, 이런 지출이야말로 그 값어치가 충분합니다."
 AST_back_in_black: "흑자로 복귀"
 AST_back_in_black_desc: "누구를 탓하려는 것은 아니지만 우리의 지출은 무모할 정도로 부풀려졌습니다. 낭비가 예산을 괴롭히고 있으며, 어떤 정부도 앞선 정부의 죄를 대신 갚아서는 안 됩니다. 우리를 흑자로 되돌리고 인플레이션을 낮게 유지하기 위해 모든 수단을 동원해야 합니다. \\"만약\\"도 \\"하지만\\"도 없습니다. 실패는 선택지가 아니며 우리는 실패하지 않을 것입니다."
 AST_slam_the_door_on_them: "그들 앞에서 문을 닫아라"
 AST_slam_the_door_on_them_desc: "복지가 얼마나 부풀었는지를 고려할 때, 우리의 첫 과제는 장애 서비스의 수급 기준을 살펴보는 것입니다. 요건을 합리적인 수준으로 높이면 지원이 꼭 필요하지 않은 무임승차자 일부가 걸러질 것이며, 낭비적인 프로그램 몇 가지를 정리하면 지출이 보다 수용 가능한 수준으로 돌아올 것입니다."
 AST_scrounge_a_penny: "한 푼이라도 긁어모아라"
 AST_scrounge_a_penny_desc: "어떻게든 절감분을 짜내려는 노력에서는 때로 창의적이어야 하며, 특히 세금 인상에 있어서 그렇습니다. 세금 인상을 요란하게 발표하는 것은 아직 시작 단계인 지금 우리의 지지를 깎아먹는 확실한 방법입니다. 대신 메디케어 부담금을 1.5%에서 2%로 조용히 올린다면 납부자는 거의 알아채지 못할 것이며, 우리는 예산에 쓸 꽤 괜찮은 추가 재원을 모으게 될 것입니다."
 AST_digitise_the_tvs: "채널을 디지털화하라"
 AST_digitise_the_tvs_desc: "밀두라의 시범 사업이 성공으로 판명된 뒤, 우리는 나머지 전환을 전국에 걸쳐 시행하여 낡은 연결을 셋톱박스로 교체하고 있습니다. 이 사업은 전적으로 우리가 맡으며, 농촌의 오스트레일리아인도 훨씬 높은 화질로 다양한 새 채널에 접근할 수 있게 해 줄 것입니다. 오락의 위대한 평등화가 여기서 시작됩니다."
 AST_our_own_white_paper: "우리만의 백서"
 AST_our_own_white_paper_desc: "오스트레일리아 국방군은 가깝고 먼 수많은 국가의 신성한 방패로서 핵심 역할을 해 왔습니다. 보호에 대한 요구가 커짐에 따라 예산도 늘었으며, 정부의 어떤 부문도 낭비에서 안전하지 않습니다. 육군은 여전히 변함없이 효율적이겠지만, 결함에 대한 철저한 정리가 이루어져야 합니다."
 AST_plain_cigarette_packaging: "무지 담배 포장"
 AST_plain_cigarette_packaging_desc: "지출 삭감 이외에도 암 위기에 대처하는 것은 우리의 가장 큰 우선순위 중 하나였습니다. 정부가 제작한 광고가 제 역할을 했지만, 거의 모든 상점에서 담배를 살 수 있다는 점은 여전히 핵심 문제입니다. 흡연을 전면 금지하는 대신 브랜드 포장을 흡연의 위험을 경고하는 소형 광고로 대체하면 암과의 연관성을 무시할 수 없게 될 것입니다. \n\n부모에게 책임감을 갖게 하고 청소년에게는 혼쭐을 내줄 것입니다."
 AST_put_the_squeeze_on_them: "쥐어짜라"
 AST_put_the_squeeze_on_them_desc: "주 보건 개혁의 일환으로 우리는 주가 부담하는 현행 지출을 검토하고, 시의적절하고 효율적으로 의료를 제공하도록 개정해 왔습니다. 이번에는 지출 낭비를 없애는 데 초점을 맞춘 다른 종류의 검토를 제시할 것입니다. 지난번처럼 그들은 아마 반발하겠지만, 결국 우리는 그들에게서 한 방울까지 짜내 예산으로 되돌릴 것입니다."
 AST_australia_works: "일하는 오스트레일리아"
 AST_australia_works_desc: "이름 그대로 이 프로그램은 '실업수당 대신 일하기'의 기본 원칙을 정부가 운영하는 주 전역 건설 서비스에 통합하여, 복지 수급자에게 꾸준한 일자리를 제공하고 현재 위축되고 있는 건설업이 계속 유지되도록 새 일자리를 창출하는 것을 목표로 합니다. 대단히 야심 찬 계획이지만 우리나라를 정상 궤도로 되돌리려면 필요합니다."
 AST_free_the_market: "더 자유로운 시장"
 AST_free_the_market_desc: "현재 우리의 아름다운 나라는 과중한 부담을 진 정부와 착취당한 민간 부문에 의해 질식하고 있습니다. 우리는 느려지고 있으면서도 동시에 기업이 스스로 성장하는 것을 허용하지 않습니다. 세금의 목조르기를 줄이고 사용하지 않는 사무 공간을 민영화하여 그 손아귀를 제한하는 것이 우리에게 필요한 활력 회복이며, 자유 시장이 제 길을 가게 할 것입니다."
 AST_mediate_with_the_mines: "광산과 중재하라"
 AST_mediate_with_the_mines_desc: "노동당과 광산 간의 관계는 그리 이상적이지 않은 상태로 우리에게 넘겨졌습니다. 개혁을 위해 그들과 협력하려면 중대한 변화가 있어야 하며, 시작할 곳은 중간 지점입니다. 요구 사항과 협력 기회를 논의하는 다양한 행사를 개최하는 것이 앞으로의 우리 작업의 토대를 마련할 것입니다."
 AST_endorse_the_magnates: "거물들을 지지하라"
 AST_endorse_the_magnates_desc: "우리 최대의 광업 CEO 중 한 명인 지나 라인하트가 서부 오스트레일리아에 새로 조성된 광산을 보충하기 위해 숙련된 외국인 노동자 1,700명을 들여오겠다는 요청을 원만히 처리해 달라고 행정부에 직접 접근했습니다. 지나는 지금까지 우리 새 정부를 한결같이 지지해 왔으며, 광산과 탱고를 추려면 그와 좋은 출발을 하는 것이 시작점으로 알맞을지도 모릅니다."
 AST_entice_competition: "경쟁을 유도하라"
 AST_entice_competition_desc: "노조가 독점 형성을 우려한다면 시장을 외국 기업에 개방하십시오. 경쟁은 수 세기 동안 경제를 조절해 왔으며 오스트레일리아 경제도 다르지 않습니다. 사상의 용광로라는 점은 애초에 이 나라를 세운 요소의 일부입니다."
 AST_minerals_resource_tax: "광물 자원세"
 AST_minerals_resource_tax_desc: "초과 이윤세는 지나치게 야심 찬 것이었고 최악의 시기에 제시되었습니다. 이 폭우 속에서 무사히 빠져나가려면 광업계와 협력해야 합니다. 협력은 실제로 우리에게 이 작은 법안을 안겨 주었습니다. 우리 자원의 독점을 깎아내리기에는 정말 턱없이 부족하지만, 지금은 이것으로 충분해야 합니다."
 AST_bauxite_investment: "보크사이트 투자"
 AST_bauxite_investment_desc: "알루미늄은 21세기의 가장 중요한 금속 중 하나로 드러나고 있습니다. 어디에나 있고, 대단히 유용하며, 이곳에는 풍부하게 있습니다. 투자 요청의 일환으로 그러한 광산에 대한 제안서가 검토를 위해 우리 책상에 올라온 것은 다행입니다. 이런 기회가 찾아왔을 때 거절하지 않는 것이 현명합니다."
 AST_pilbara_expansion: "필바라 확장"
 AST_pilbara_expansion_desc: "광산 부지 요청 대부분은 지역 차원에서 처리되지만, 필바라의 한 부지에 대한 요청이 들어왔는데 그곳 국립공원 중 한 곳의 경계에 걸쳐 있습니다. 부지는 어떤 보존 구역에서도 꽤 멀리 떨어져 있으나 사건은 현재 고등법원에 계류 중입니다. 우리 경제의 이익을 위해서라면 물론 저울에 우리의 무게를 실어 승인을 앞당길 수도 있습니다."
 AST_ease_on_restrictions: "규제를 완화하라"
 AST_ease_on_restrictions_desc: "매년 수많은 광업 프로젝트가 환경 규제로 인해 무산됩니다. 가장 사소한 채굴 현장조차 보호 구역이나 새 기후 법안 때문에 폐기될 수 있습니다. 지금으로서는 경제 성장을 가장 크게 늦추는 것은 가용성 부족입니다. 오스트레일리아의 크기를 생각하면 터무니없는 개념입니다. 이는 바로잡아야 합니다."
 AST_train_it_out: "철도로 실어 날라라"
 AST_train_it_out_desc: "서부 오스트레일리아의 광업 지대는 필바라처럼 외딴 광산을 항구와 연결하는 개방형 중량 철도 노선을 사실상 애타게 요구하고 있습니다. 정부가 직접 운영하는 노선을 건설하면 거대 기업이 철도 기반시설에 대해 갖고 있는 독점을 깨뜨리고, 수십 곳의 중견 및 초기 광산업체가 제품을 항구로 보낼 수 있게 해 국가 수출량을 대폭 늘릴 것입니다."
 AST_champion_the_mets_sector: "METS를 옹호하라"
 AST_champion_the_mets_sector_desc: "우리나라가 광업 활동에 맞춰 간소화된 정도를 보면, 기업들은 이곳을 이른바 \\"세계의 채석장\\"으로 대하기 시작했습니다. 자원 추출이 좁은 추구가 된 곳입니다. 오스트레일리아는 광업 기술의 실리콘 밸리로 인식되어야 합니다. \n\nMETS(광업 장비, 기술 및 서비스) 기관에 자금을 지원하고 자체 연구 개발을 원격 운영 채굴로 향하게 하면 자율 운반의 개발이 가속화되고 현재의 추출 기법이 발전할 것입니다. 광업의 미래는 이곳에서 만들어질 것입니다."
 AST_the_australian_century: "오스트레일리아의 세기"
 AST_the_australian_century_desc: "황금기는 우연히 마주치거나 행운의 산물인 경우가 드뭅니다. 수십 년, 혹은 수 세기에 걸쳐 쌓아 온 노력의 결과이며, 실제로 도래하는 경우는 거의 없습니다. 역사 속의 국가들과 달리 우리 정부는 어둠 속을 더듬고 있지 않습니다. 오늘 우리가 하는 모든 일은 수년에 걸쳐 준비된 것이며, 우리의 성공은 처음부터 치밀하게 계획되었습니다. 이제가 우리의 순간입니다."
 AST_the_foreign_ministry: "외무부"
 AST_the_foreign_ministry_desc: "아시아, 특히 중국의 부상은 오스트레일리아를 주변 국가들보다 경제적으로 영구적인 \\"하위\\" 입장에 놓이게 했습니다. 일부에게는 우려스러운 현실일 수 있으나, 21세기는 단극 체제의 연속이 되지 않을 것이며 이는 우리에게 뜻밖의 기회를 가져다줍니다. 경쟁하고 선입견을 극복할 의지가 있다면, 태평양은 우리 국가의 이익을 위해 착취하거나 포용할 수 있는 새로운 세계로 다가옵니다."
 AST_foreign_minister_rudd: "러드 외무장관"
 AST_foreign_minister_rudd_desc: "전직 지도자는 우리 진용에서 외교 문제에 가장 경험이 풍부한 인물일지도 모릅니다. 케빈 러드는 수십 년간 아시아 국가들과 대화를 가꾸어 왔으며, 이미 정부가 더욱 긴밀히 연결되는 데 결정적인 역할을 했습니다. 러드는 우리의 입지를 강화하고 오스트레일리아를 태평양의 올리브 가지로 제시하기 위한 일련의 외교 순방을 제안했습니다."
 AST_papua_residency: "파푸아 거주권"
 AST_papua_residency_desc: "파푸아 경제는 공식 협정만 없을 뿐 서서히 우리 경제에 편입되었습니다. 완전한 경제 협약을 협상하여 이를 바로잡으면 마침내 계약이 마무리될 것입니다."
 AST_soften_the_emerald: "에메랄드를 누그러뜨리다"
 AST_soften_the_emerald_desc: "이렇게 가까운 이웃 나라라면 서로의 관계가 화기애애하리라 기대할 법합니다. 안타깝게도 최근 불화는 깊어지기만 했으며, 러드를 보내 문제를 원만히 풀어 보는 것이 관계를 지킬 유일한 방법일지도 모릅니다."
 AST_the_new_bear: "새로운 곰"
 AST_the_new_bear_desc: "소련 이후 러시아의 본질은 완전히 바뀌었습니다. 러시아는 자본주의 이념을 서서히 받아들였고 털외투 아래로 외국의 이익을 허용했습니다. 이는 우리가 외교적으로 깃발을 꽂고 거리가 멀더라도 우리에게 유리한 무언가를 마련할 기회일 수 있습니다."
 AST_entente_with_north_korea: "북한과의 화친"
 AST_entente_with_north_korea_desc: "러드는 두 나라가 평화 공존에 가까워지기를 바라며 비무장지대를 방문해 북한 지도자를 만나자고 제안했습니다. 다소 허황된 꿈을 좇는 면이 있을지도 모르지만 계획은 어느 정도 타당하며, 우리가 북한에 직접 건네는 첫 번째 타진이 될 것입니다."
 AST_foreign_minister_smith: "스미스 외무장관"
 AST_foreign_minister_smith_desc: "스티븐 스미스는 키팅 시절부터 당의 저명한 인사였으며, 외무부에 가장 먼저 자신의 역량을 제안한 인물이었습니다. 그의 정책은 오스트레일리아가 태평양 무역의 교차점으로 부상하기를 원한다는 점에서 우리와 충분히 일치합니다. 새로운 세계를 해외에서 우리 경제적 위상을 키울 성장 거점으로 삼아 국가에 이로운 방식이라면 무엇이든 활용하는 것입니다."
 AST_our_glowing_deposits: "우리의 빛나는 매장지"
 AST_our_glowing_deposits_desc: "매장지는 있으며, 우리는 그저 수출하면 됩니다. 현재 우리의 고객이 한동안 광물 채굴권을 달라고 졸라 왔으니 물건을 내놓는 것이 공정합니다."
 AST_the_best_of_both_worlds: "양쪽의 장점만"
 AST_the_best_of_both_worlds_desc: "우리는 미국과의 깊은 안보 및 방위 동맹을 유지하는 동시에 중국과의 안정적인 무역 상호 의존을 추구하는 복잡한 줄타기를 하고 있습니다. 둘 중 하나를 택하도록 강요받지 않는 것이 우리가 계속 버텨 온 방법입니다."
 AST_made_in_vietnam: "메이드 인 베트남"
 AST_made_in_vietnam_desc: " 많은 오스트레일리아인은 늘 사 오던 상품을 내려다보았을 때 맨 아래의 작은 글씨가 그것이 이곳에서 만들어진 것이 아니라 \\"베트남\\"이라는 곳에서 만들어졌다고 알려주는 것을 보고 기묘한 기분을 느꼈습니다. 받아들이기 쉽지 않았으나, 주머니가 두둑해지고 가게에 더 다양한 물건이 생기자 금방 잊었습니다."
 AST_foreign_minister_carr: "카 외무장관"
 AST_foreign_minister_carr_desc: "밥 카는 우리 명단에서 가장 현실주의적인 인물, 적어도 가장 실용적인 인물일지 모릅니다. 근본적으로 카는 외교 정책이 일련의 임기응변이라고 믿습니다. 오스트레일리아는 태평양의 도덕적 중심으로 호소하려는 노력을 병행하면서도, 동시에 우리의 이익을 지키기 위해 손에 흙을 묻히는 것을 두려워해서는 안 됩니다. 그 균형을 어떻게 맞추느냐가 진짜 시험입니다."
 AST_smother_the_pot: "솥을 휘저어라"
 AST_smother_the_pot_desc: "오스트레일리아의 이익은 중동에 너무 깊이 얽혀 있어 그곳에서 벌어지는 일이 무엇이든 이곳에 영향을 미칩니다. 지난 10년간 들끓던 혼란의 솥은 우리가 빠져 있을 수 없는 거센 불길로 번졌습니다."
 AST_the_big_boys_club: "강대국 클럽"
 AST_the_big_boys_club_desc: "국제연합 안전보장이사회에는 상임이사국 5석과 몇 년마다 교체되는 비상임이사국 10석이 있습니다. 전 세계에 영향을 미치는 정책은 국제연합 회의장에서 이들 국가 사이에 결정됩니다. 우리의 책임이 세계의 나머지와 이토록 깊이 얽혀 있는 만큼 테이블에 자리를 얻는 것이 마땅합니다. 진입 가능성을 높이는 데 힘써야 합니다."
 AST_global_weapon_trading: "세계 무기 거래"
 AST_global_weapon_trading_desc: "카는 국제연합에서의 우리 입지를 활용해, 비우호적인 국가와 테러 집단에 대한 무기 공급을 추적하고 줄이는 동시에 우리와 다른 서방 국가의 무기 판매를 더 매력적으로 만들려는 세계 무기 거래 조약을 강력히 옹호하고 있습니다. 배짱 있는 행보이며, 그는 현재 이를 통과시키기 위해 뉴욕에서 지지를 규합하고 있습니다."
 AST_myanmar_intervention: "미얀마 개입"
 AST_myanmar_intervention_desc: "미얀마의 붕괴는 인도주의적 악몽으로 변했습니다. 우리가 개입하기로 하는 어떤 선택이든, 빠져 있는 것만큼이나 나름의 결과를 낳을 것입니다."
 AST_consuls_of_peace: "평화의 영사들"
 AST_consuls_of_peace_desc: "오스트레일리아의 운명은 글로벌 협력에 굳건히 뿌리내리고 있습니다. 우리의 해외 공관과 평화 유지 활동은 한결같이 규칙 기반 질서를 장려하고 때로는 복원하는 것을 목표로 해 왔습니다. 이는 우리가 노력하는 역할이며, 지켜야 할 명성입니다."
 AST_centurians_of_the_pacific: "태평양의 백인대장들"
 AST_centurians_of_the_pacific_desc: "글로벌 개입의 규칙은 새 세기가 시작된 이후 바뀌었습니다. 국가 안보가 전통적인 시민 자유의 자리를 차지했으며, 근본주의자들의 공격 이후 거의 모든 서방 국가가 예방을 위한 틀을 채택했습니다. 지나간 시대의 규칙에 스스로를 가두는 것으로는 새 친구를 사귀거나 이 나라를 지킬 수 없으며, 적절하게 대응하지 않으면 우리 자신이 표적이 될 뿐입니다."
 AST_the_costello_government: "코스텔로 정부"
 AST_the_costello_government_desc: "오스트레일리아는 이제 100년이 넘었고 연방 수립 이후 먼 길을 왔습니다. 이웃 나라의 극히 일부에 불과한 인구에도 불구하고 우리 경제는 빠르게 세계 최대 규모의 경제 중 하나가 되고 있습니다. 우리 국민은 주변 나라가 이전 세대가 꿈꾸던 것보다 더 부유하고 번영하는 것을 지켜보았으나, 진정한 부는 여전히 손대지 않은 채 남아 있습니다. \n\n우리의 잠재력은 마치 유맥처럼 지표 바로 아래에 있으며 열리기를 기다립니다. 광산의 재정 관리는 막혀 있고 우리의 대형 산업 상당수는 안일해졌습니다. 복지는 우리 예산의 짐이 되었고, 소기업은 계속 줄어드는 시장에 접근하기 위해 여전히 힘겨운 싸움을 벌이고 있습니다. \n\n통치의 방식이 바뀌어야 합니다."
 AST_a_bastion_for_commerce: "상업의 보루"
 AST_a_bastion_for_commerce_desc: "태평양으로 이어진 국가들이 더 가까워짐에 따라 무역의 중간 거점에 대한 수요가 더욱 분명해졌습니다. 오스트레일리아는 이제 콘스탄티노폴리스와 베네치아가 그랬듯, 다양한 경제를 하나의 항구로 이어주는 무역의 등대로 설 기회를 맞았습니다."
 AST_bring_in_the_chains: "체인점을 들여오라"
 AST_bring_in_the_chains_desc: "우리는 멀고 넓은 곳에서 들어온 문화로부터 큰 혜택을 받아 왔습니다. 기업이라고 예외는 아닙니다. 이미 입점을 청원하는 이들이 문밖에 줄을 서 있습니다. 허락하도록 합시다."
 AST_domestic_demands: "국내의 요구"
 AST_domestic_demands_desc: "우리와 이 나라 블루칼라 노동자들이 공유하는 견해는 국내 산업이 중요하다는 것입니다. 강한 국내 산업은 어떤 세계 경제 침체도 이겨낼 수 있어야 하며, 약간의 보살핌이 있다면 그렇게 될 것입니다."
 AST_outsource_the_troubles: "문제를 외주로 돌려라"
 AST_outsource_the_troubles_desc: "일터의 인력 부족은 최근 몇 년간 지속적인 성장을 가로막는 가장 큰 장벽이 되었습니다. 우리는 공백을 메울 노동자가 단순히 부족하며, 어떤 장기적 해법도 확장에 가장 좋은 시기를 놓치게 할 것입니다. 해외로 눈을 돌려야 합니다."
 AST_come_one_come_all: "누구나 오라"
 AST_come_one_come_all_desc: "우리의 돈은 오스트레일리아 안에 머물러야 하며, 적어도 임금은 그래야 합니다. 고용의 공백을 메우는 가장 좋은 방법은 하한선을 챙기는 것입니다. 수천 명이 오스트레일리아에서 일해 보기를 원합니다. 우리는 문을 열기만 하면 됩니다."
 AST_off_with_tariffs: "시장의 짐을 덜어라"
 AST_off_with_tariffs_desc: "자유주의 경제학은 '풍요'라는 개념을 낳았습니다. 더 자유로운 시장과 돈을 쓸 더 자유로운 기회가 필연적으로 더 잘사는 사회로 이어진다는 생각입니다. 우리 기업들이 시도해 보고 싶어 하는 솔깃한 개념입니다. 아직 남아 있는 부담스러운 세금은 걷어내야 합니다."
 AST_negotiate_with_the_rba_ast: "RBA와 협상하라"
 AST_negotiate_with_the_rba_ast_desc: "준비은행에 약간의 감언이설을 하면 경제 호조를 가져올 여유를 얻을 수 있을 것입니다. 다행히 우리에게는 은행을 설득해 금리를 낮추고 그동안 소비 지출을 장려할 인맥이 있습니다."
 AST_fix_the_trade_woes: "무역의 고충을 해결하라"
 AST_fix_the_trade_woes_desc: "우리나라를 통한 상품의 수입과 수출이 매우 짧은 기간에 엄청난 수준으로 늘어난 한편, 무역 제도에 대한 기업들의 전반적인 혼란도 커졌습니다. 무역 적자와 비효율적 관리가 이윤율을 갉아먹고 상거래 과정을 늦추고 있습니다. 새로운 기관이 필요할 것이며, 전체 과정을 매끄럽게 하는 데 전념하는 기관이어야 합니다."
 AST_adventure_in_the_usa: "미국에서의 모험"
 AST_adventure_in_the_usa_desc: "미국은 늘 우리의 가장 큰 투자자였고 앞으로도 그럴 것입니다. 빅맥의 땅이자 자유의 고향이며 모두의 친구입니다. 우리 경제 진화의 다음 단계를 위해 그들을 찾아가지 않는다면 직무 태만일 것입니다."
 AST_im_an_oil_man: "나는 석유 사업가다"
 AST_im_an_oil_man_desc: "우리나라에 자체 석유 개발이 있어야 한다는 것은 자명합니다. 우리에게는 유정이 있고 그에 맞는 지형이 있습니다. 과정이 너무 오래 걸렸을 뿐이며, 우리 정부 아래서 그 멱살을 잡고 끌어올릴 것입니다. 더 많은 석유가 흐를 것입니다."
 AST_for_queen_and_company: "여왕과 기업을 위하여"
 AST_for_queen_and_company_desc: "미국에서의 우리의 타진이 충분히 미끼를 뿌려 놓은 덕에 영국 기업 몇 곳이 우리 농업 부문에서 지분을 늘리도록 유인했습니다."
 AST_rail_endeavors: "철도 사업"
 AST_rail_endeavors_desc: "우리는 전에 장거리 철도 노선을 위해 벡텔 사와 협력한 적이 있으며, 이제 그들과 주 정부들이 공동 개발 연구 프로젝트를 추진하려 합니다. 그들은 이미 신형 전기 및 디젤 모델의 사양을 제시했습니다. 이제 우리가 승인만 하면 됩니다."
 AST_the_miracle_economy: "기적의 경제"
 AST_the_miracle_economy_desc: "언론은 이미 이 시기 우리 경제의 성공을 기적이라 부르고 있습니다. 물론 기적은 전혀 아닙니다. 우리의 성공은 언제나 판단력과 신중함을 건실하게 유지하는 데 달려 있었습니다. 그러니 잘 가꾼 정원처럼 우리 운영의 결과가 장관을 이루며 만개한 것입니다."
 AST_ride_the_bubble: "거품을 타라"
 AST_ride_the_bubble_desc: "몇 년 전 닷컴 버블이 터졌을 때는 말 그대로 하늘이 무너져 내리는 것 같았습니다. 컴퓨팅에 수십억을 투자해 쌓아 올린 주가가 갑자기 꺼졌고 수십억이 더 사라졌습니다. 이번에는 컴퓨팅 투자를 위한 지반을 단단히 하고, 성장을 뒷받침할 기반시설을 갖추고, 시스템이 다시 무너지지 않도록 필요한 최소한의 규제만 두려 합니다."
 AST_silicon_dreams: "실리콘의 꿈"
 AST_silicon_dreams_desc: "언젠가 기술적으로 독립한 국가가 되겠다는 야망은 상업용 칩을 제조하는 능력에서 시작됩니다. 소규모로 시작하여 칩 연구 그룹에 자금을 지원하고, 빅토리아에 시험 가동 시설을 허용해 출발점으로 삼을 수 있습니다."
 AST_jobs_for_the_needy: "빈곤층을 위한 일자리"
 AST_jobs_for_the_needy_desc: "실업수당 대신 일하기(Work For the Dole)를 시행한 실책의 대가를 우리는 지금도 치르고 있습니다. 노동자들을 민간 산업에서 빼내 공공 사업에 쓰는 일은 있어서는 안 되었습니다. 복지의 요점은 일할 수 있는 사람이 일자리를 얻도록 하는 것이어야 합니다. 새 프로그램이 그 자리를 대신해야 합니다."
 AST_keep_it_competitive: "경쟁을 유지하라"
 AST_keep_it_competitive_desc: "산업적으로 성장할수록 시장이 기울어질 위험도 커집니다. 독점은 우리가 놔두면 재앙으로 번질 수 있으며, 슬프게도 규제가 그와의 싸움에서 확실한 방어에 가장 가까운 수단입니다. 주 차원에서 정책을 조율하고 거기서부터 나아갈 수 있습니다."
 AST_shatter_the_iron_curtain: "철의 장막을 부수어라"
 AST_shatter_the_iron_curtain_desc: "오스트레일리아에게 냉전은 73년에 마오쩌둥과 악수하면서 끝났습니다. 그 뒤로 당파 대립과 세계적 위기를 모두 견뎌낸 우정을 누려 왔습니다. 앞으로의 협력이 안전하고 투명하게 유지되도록 포럼을 만들어야 합니다."
 AST_our_man_in_beijing: "베이징의 우리 사람"
 AST_our_man_in_beijing_desc: "오랜 외무장관이자 현재 부총재인 알렉산더 다우너는 중국 정부 및 재계와 너무 가까워져서 우리 당 일부가 그의 충성이 어디에 있는지 의문을 제기할 정도입니다. 그럼에도 새로운 파트너십에서 의미 있는 성과를 얻으려면 그의 통찰이 필요합니다. 다음 베이징행 비행기부터 시작합니다."
 AST_the_lithium_projects: "그린부시스 프로젝트"
 AST_the_lithium_projects_desc: "그린부시스의 리튬 프로젝트는 서부 오스트레일리아 지역 사회에 유망한 개발 사업이 되었습니다. 프로젝트 완료 시점에는 연간 리튬 100만 톤 생산을 목표로 하며, 그때쯤 우리는 세계 최대의 가공 리튬 수출국 중 하나가 됩니다. 이제 필요한 것은 약간의 재정적 후원뿐입니다."
 AST_cater_to_investors: "투자자들을 맞춰라"
 AST_cater_to_investors_desc: "중국 개발업체가 외국 기반 토지 소유자의 60퍼센트 이상을 차지합니다. 이러한 투자가 우리 토지 개발 산업의 근간을 이루기 시작했으며, 그 관계가 순조롭게 이어지려면 그들의 이익과 보조를 맞춰야 합니다."
 AST_the_future_fund: "미래 기금"
 AST_the_future_fund_desc: "이 기금의 애초 구상은 공무원 연금을 충당하는 것이었으나, 이 개념은 국가의 해외 투자를 뒷받침하는 데에도 충분히 쓰일 수 있습니다. 이미 해외 투자자들, 특히 벨기에에 본사를 둔 유로클리어 그룹으로부터 놀랄 만큼 많은 자금을 끌어들였으며 이제 이를 가동할 때입니다."
 AST_a_friendly_union: "더 우호적인 연합"
 AST_a_friendly_union_desc: "우리를 뒤에서 괴롭히지 않는 연합은 유럽 쪽 연합뿐입니다. 적어도 앞으로 몇 년간은 우리나라에서 유럽 자동차 판매에 대한 제한을 줄이는 조율이 진전되었습니다. EU 본부를 방문하면 일이 속도를 낼 수 있고 우리 소비자에게는 멋진 새 선택지를 줄 것입니다."
 AST_fechado: "페샤두!"
 AST_fechado_desc: "브라질 광업 경제의 번영 확대를 우리 광업 산업가들이 놓치지 않았으며, 그들은 채굴 장비의 수입 규제를 완화해 달라고 청원했습니다. 우리에게 비용이 거의 들지 않으며, G20의 동료들과 더 가까워지게 해줄 것입니다."
 AST_the_republic_question: "공화국 문제"
 AST_the_republic_question_desc: "연방 수립 이래 오스트레일리아는 사실상 영국 왕실의 신민으로 남아 있었습니다. 우리 헌법은 군주제 헌법이며, 국가 원수는 여전히 영국의 국가 원수입니다. 한동안은 이것이 통했지만 시대의 기질은 민주적입니다. 우리는 세습으로 공직에 임명하지 않습니다. 우리 사회와 우리 시대에는 능력에 따른 임명을 선호합니다. \n\n오스트레일리아는 진정한 독립 국가로서 그날을 맞이할 것입니다."
 AST_how_we_sell_it: "어떻게 설득할 것인가"
 AST_how_we_sell_it_desc: "국민투표에 대한 대중의 지지를 얻는 것이 경주의 마지막 장애물이 될 것입니다. 전체 유권자의 전국 과반수와 6개 주 및 준주 중 4곳의 지지가 필요합니다. 대중의 마음을 얻지 못하면 불가능한 일입니다. 언론 기계에 시동을 걸고 직접 지지를 규합해야 합니다."
 AST_send_it_through: "밀어붙여라"
 AST_send_it_through_desc: "1999년 국민투표가 실패한 후 공화국 주제는 의회 대다수에게 불운의 징조처럼 껄끄러워졌습니다. 우리는 지난번에 비해 상당히 불리한 처지에 있습니다. 일을 굴러가게 하려면 몇몇 손목을 비틀어야 할지도 모릅니다."
 AST_our_commonwealth: "우리의 영연방"
 AST_our_commonwealth_desc: "거의 두 세기에 이르는 역사와 혈연을 바람에 날려 보낼 수는 없습니다. 특히 이런 과도기에는 더욱 그렇습니다. 영연방에 대한 우리의 헌신을 재확인하면 여전히 관망하는 왕당파 일부의 우려를 덜어줄 수 있습니다."
 AST_free_from_binds: "속박에서 자유롭게"
 AST_free_from_binds_desc: "군주제로부터의 이탈은 어정쩡할 수 없습니다. 왕실과의 유대를 끊어야 하며, 그와 함께 지난 세월 우리를 편안하게 해 주었던 포근한 담요도 걷어내야 합니다. 우리에게 필요한 변화는 유리 천장을 깨고 나온 뒤 상처와 멍을 남기는 변화입니다. 쉽지 않을 것입니다."
 AST_run_the_games: "대회를 개최하라"
 AST_run_the_games_desc: "4년마다 우리 선수들은 영연방 경기 대회에 출전하며, 이는 올림픽과 크게 다르지 않은 종합 스포츠 행사로 영연방 국가 소속 전 세계 선수들이 모입니다. 다가오는 대회의 개최를 청원하기에 시기가 딱 맞을지도 모릅니다."
 AST_kowtow_to_the_crown: "왕관에 머리를 조아려라"
 AST_kowtow_to_the_crown_desc: "군주제로부터 공식적인 축복을 받으면 우리 공화파 일부와 멀어지는 대가를 치르더라도 반대 진영을 마침내 잠재울 것이며, 표가 들어오기 시작하면 그들도 계속 비판적일 수 없을 것입니다."
 AST_crossing_the_floor: "당적을 넘나들다"
 AST_crossing_the_floor_desc: "노동당 쪽 인사들은 우리가 표결에 그들을 필요로 한다는 말을 들으면 은행에 가는 길에 웃음이 터질 것입니다. 그들을 낮추기는 쉽지 않을 것이며 분명 요구를 내밀겠지만 앞으로 나아갈 길은 전진뿐입니다. 원하든 원하지 않든 그들은 당분간 우리의 새 동맹입니다."
 AST_approaching_the_governor: "총독에게 다가가다"
 AST_approaching_the_governor_desc: "절차의 마지막 단계입니다. 총독에게 그 자신의 사임 서류를 건네야 한다는 점에서 상황이 다소 어색합니다. 그들이 잘 받아들이기를 바랄 뿐입니다."
 AST_a_shining_example: "빛나는 본보기"
 AST_a_shining_example_desc: "우리는 태평양 국가들에게 성공한 민주주의의 본보기로 서야 합니다. 이 위대한 과업에서의 성공은 지역뿐 아니라 멀리 넓게까지 하나의 증거로 남을 것입니다. 나라의 역사가 깊어졌어도 통제의 족쇄를 벗어던질 수 있습니다."
 AST_no_kings: "왕은 없다"
 AST_no_kings_desc: "새 헌법의 제도는 현대 정치 변화의 현실을 반영해야 합니다. 어떤 체제도 자신의 붕괴로부터 자유로울 수는 없지만 회복력을 갖추게 할 수는 있습니다. 권력은 분립되고 감독이 이루어지며, 권위주의적이고 반동적인 사상이 견제되도록 제3자 안전장치가 마련될 것입니다."
 AST_endow_the_arts: "예술에 기금을 대라"
 AST_endow_the_arts_desc: "표현의 자유는 민주주의의 근간 중 하나이며 유레카 방책 사건 이래 줄곧 그랬습니다. 솔직히 예술에 대한 어떤 투자든 대개는 낭비이지만, 지금 우리가 민감하게 보여야 할 것이 있다면 그것은 문화입니다."
 AST_hold_onto_the_wild: "야생을 붙들어라"
 AST_hold_onto_the_wild_desc: "교외 지역의 산림을 더 장려하기 위해, 토지의 일부 또는 전부를 영구 보존용으로 떼어 두기로 한 토지 소유자에게는 양도소득세의 일환으로 더 낮은 납세 의무가 부여됩니다. 한편 국립공원 보호를 새 헌법에 명문화할 수 있으며, 이로써 앞으로 수십 년간 안전하게 지켜낼 수 있습니다."
 AST_a_generation_to_persevere: "인내하는 세대"
 AST_a_generation_to_persevere_desc: "나라의 미래는 전적으로 우리 다음 세대의 손에 달려 있습니다. 이들을 보살피고 번영하는 데 충분한 지식을 갖추도록 하는 것은 우리의 생활 방식이 이어지도록 하는 것과 마찬가지입니다. 교육은 연방이 부여하는 헌법적 권리가 되어야 합니다."
 AST_enshrine_the_protections: "보호를 명문화하라"
 AST_enshrine_the_protections_desc: "헌법 개정의 다음 단계는 획기적이어야 합니다. 통치 체제뿐 아니라 시민에게도 그러합니다. 가장 취약한 이들의 권리 수준이 캔버라의 가장 큰 의자에 누가 앉아 있느냐에 좌우되어서는 안 됩니다. 그것은 헌법에 명문화되어 예측 가능한 미래에 영구적으로 유지되어야 합니다. \n\n오스트레일리아는 소수가 보호받는 나라가 아니라 모두가 보호받는 나라입니다. 이상입니다."
 AST_modernize_the_communities: "지역 사회를 현대화하라"
 AST_modernize_the_communities_desc: "우리는 저소득 지역 사회에 더 많은 계약이 돌아가도록 하는 여러 프로그램을 준비하고 있으며, 일자리가 없는 이들에게 더 많은 일을 가져다주고 어려움을 겪는 소규모 마을의 이미지를 개선하려는 것입니다."
 AST_with_heritage_to_remember: "기억해야 할 유산과 함께"
 AST_with_heritage_to_remember_desc: "화해의 여정은 여러 면에서 다음 단계에 접어들고 있습니다. 지원의 손길은 다시 뻗어야 하지만, 이번에는 스스로를 내어주기 위해서입니다. \n\n지역 전통 소유자들이 보존 및 토지 주권, 그리고 개발 승인권에 관한 공식 조약을 협상할 수 있도록 헌법을 개정하면, 화해의 고삐를 지역 사회에 넘기게 됩니다. 이는 지역 사회에 스스로의 미래를 결정할 권리와 자신의 과거를 지킬 능력을 부여합니다."
 AST_one_last_push: "마지막 한 번의 추진"
 AST_one_last_push_desc: "우리에게는 위임이 있습니다. 표가 집계되고 있습니다. 이번에는 역사가 우리 편이기를 바랄 뿐입니다."
 AST_a_new_constitution: "새 헌법"
 AST_a_new_constitution_desc: "오스트레일리아 통치의 다음 시대가 눈앞에 있습니다. 우리가 지금 내딛는 걸음은 호기롭고, 어쩌면 약간 무모하기까지 하며, 역사책에 오를 무대를 마련합니다. 이 반석 위에 우리는 나라의 미래, 곧 새 헌법을 세우고 있습니다."
 AST_the_mining_snag: "광업의 걸림돌"
 AST_the_mining_snag_desc: "참으로 광업계는 최근 몇 년간 한두 번이 아니게 푸대접을 받았으나, 이 업계의 죄를 무시할 수도 없습니다. 정부의 필요와 산업가의 권리 사이에서 우리 사이에 이해가 이루어져야 합니다. 휴전이 중재될 것입니다."
 AST_a_little_of_this: "이것을 조금"
 AST_a_little_of_this_desc: "광산에 지분을 가진 몇몇 대기업은 벌목 산업에도 투자하고 있습니다. 이 산업은 환경 단체의 수년간 반발로 수익이 깎여 나갔습니다. 주 소유 산림 일부를 벌채용으로 개방하고 규제 한두 개를 풀어 주면 우리가 필요로 하는 호의를 얼마간 얻을 수 있습니다."
 AST_formal_investigation: "공식 조사"
 AST_formal_investigation_desc: "체계적인 강압과 이권 나눠 먹기는 광업이 지나치게 정치화된 결과로 흔히 나타나는 현상입니다. 모든 부패를 없앨 수는 없지만, 표면에 드러난 더 노골적인 부패를 밝히는 것을 목표로 한 광산 공식 위원회로 판을 흔들 수 있습니다."
 AST_for_a_bit_of_that: "그것을 조금 위해"
 AST_for_a_bit_of_that_desc: "광산의 불만은 대개 과도한 규제에 관한 것입니다. 그들은 이에 반대하는 로비를 벌이고, 언론 캠페인으로 반대합니다. 사실상 규제를 없애 달라며 우리 문을 두드려 왔습니다. 그러는 김에 임시 완화를 제안하면 그들이 개혁에 마음을 열 수도 있습니다."
 AST_training_the_next_miners: "차세대 광부 양성"
 AST_training_the_next_miners_desc: "TAFE의 직업 교육은 비용 부담을 거의 지우지 않으면서, 이를 택하는 이들에게는 약간의 유인도 제공하며 업계 신입을 가장 빠르게 양성할 수단이 될 것입니다."
 AST_when_opportunity_calls: "기회가 부를 때"
 AST_when_opportunity_calls_desc: "외무부가 중동에서 돌아오며 사우드 왕가로부터 우리의 광업 사업과 관련한 흥미로운 협력 제안을 직접 받아 왔습니다. 이 주제로 그들과 처음 접촉한 것이며, 그들이 염두에 둔 것이 무엇이든 놓치기엔 너무 수익성이 높을 수 있습니다."
 AST_tussle_with_the_media: "언론과 한판"
 AST_tussle_with_the_media_desc: "광업 기업에 발언권을 전부 줄 수는 없습니다. 머독 미디어가 우리에게 맞서더라도 언론에 우리 입장을 전달하고 우리가 발견한 사실 일부를 전국 TV에 폭로할 수 있습니다."
 AST_war_with_the_party: "당과의 전쟁"
 AST_war_with_the_party_desc: "우리에게 맞선 현재의 캠페인이 강력한 만큼 당원 일부가 흩어지기 시작했습니다. 언론과 함께 우리 정부를 외면하거나 우리와 거리를 두려 합니다. 공세로 나서야 합니다. 이탈자를 모으고 언론에 나서는 떠버리들을 고립시키십시오. 아직 우리가 책임자임을 알리십시오."
 AST_no_gas_all_breaks: "가스는 없다, 전부 끊어라"
 AST_no_gas_all_breaks_desc: "우리는 광산에 대한 후원이라는 당의 전통과 결별해야 합니다. 재생 에너지 부문의 기회는 날마다 진화하고 개선되고 있습니다. 이베르드롤라는 현재 빅토리아에서 성공적인 발전소를 여러 곳 운영하고 있습니다. 정부 자금과 승인이 있으면 그들은 전국에 거점을 세울 것입니다."
 AST_the_processing_debacle: "수용 처리 참사"
 AST_the_processing_debacle_desc: "조사 결과에 따라 이주민 문제의 해결책을 찾아야 한다는 상당한 압박이 우리에게 가해졌습니다. 쉬운 선택은 아니겠지만 우리에게 쉬운 선택은 드뭅니다."
 AST_bowen_expansion: "보웬 확장"
 AST_bowen_expansion_desc: "BHP가 퀸즐랜드 보웬 분지의 새 송유관에 대한 신속 승인을 요청했습니다. 그곳의 철강 생산을 대폭 가속하기 위해 건설되는 것입니다. 코알라 서식지를 통과하는 경로에 대해 환경 단체들의 약간의 반발이 있었으나, 사업 대표들은 피해가 최소한일 것이라고 장담했습니다."
 AST_fortescue_lines: "포테스큐 노선"
 AST_fortescue_lines_desc: " 우리 철광석 최대 광업 거점은 서부 오스트레일리아에 있으며 포테스큐 사가 운영합니다. 그들이 더 적은 배출로 더 많은 양의 광석을 공급하는 마그네타이트 프로젝트에 공동 투자하자고 초대했습니다. 이 경우 광산 업계와 환경주의자 양쪽에 호소하게 되므로 우리에 대한 비난이 얼마간 가라앉을 수 있습니다."
 AST_secure_resource_tax: "자원세 확보"
 AST_secure_resource_tax_desc: "마침내 광업 호황기의 세금 비효율 일부를 해결하는 것을 목표로 한 최초의 포괄적 자원 지대세가 나왔습니다. 소규모 기업과 광산이 지장을 받지 않도록 하는 조항을 두어, 생산성에 영향을 주지 않으면서 새로운 세수원이 예산으로 흘러들 것입니다."
 AST_an_open_ear: "열린 귀"
 AST_an_open_ear_desc: "선임자들이 만든 기후 규제는 너무 제한적이 되어 업계 전체를 뒤틀리게 했습니다. 주변 국가들이 비용을 거의 치르지 않는 상황에서 어떻게 경쟁하기를 바랄 수 있겠습니까. 더 유연한 규제가 시행되어야 하며, 합리적인 대안이 나올 때까지 현행 규제는 유예될 것입니다."
 AST_olympic_dam_developments: "올림픽 댐 개발"
 AST_olympic_dam_developments_desc: "웨스턴 마이닝 코퍼레이션이 올림픽 댐의 우라늄 광산을 활용한 공동 연구 사업을 제안해 왔습니다. 의회 안팎에서 지역 사회에 미치는 영향을 이유로 이 광산에 대한 매우 격렬한 항의도 받았습니다. 광산과 시설을 확장하면 얼마간의 반발이 따르겠지만 우리가 견디지 못할 일은 아닙니다."
 AST_changing_the_system: "체제를 바꾸다"
 AST_changing_the_system_desc: "업계를 다루는 데 있어 우리는 먼 길을 왔습니다. 수익은 이제 어느 때보다 깨끗하게 더 많은 양으로 들어오고 있습니다. 그 성격을 개선하기 위해 할 수 있는 일은 여전히 많지만, 지금은 뒤돌아보며 그 성과에 감탄해도 좋습니다."
 AST_the_turnbull_government: "턴불 정부"
 AST_the_turnbull_government_desc: "이 중점은 임시 항목입니다. 턴불 중점 트리는 개발 중이며 곧 공개됩니다!"
 corroboree_event.1.t: "코로보리에서의 연설"
 corroboree_event.1.d: "하워드는 원로가 [GetASTLeaderTitle]을(를) 소개하는 동안 그 뒤에 서 있었다. 그는 코로보리에서 연설할 예정이었다. 이는 그가 선출된 이후 선거 운동과 지도 스타일의 상징이 된 일이었다. 그러나 이번에는 군중이 냉담했다. 그가 '실용적 화해'와 절제된 접근에 대한 수사를 펼쳐도 열정적인 환호는 없었다. 군중 다수는 몇 시간씩 기다렸는데도, 진보에 대한 또 하나의 공허한 약속처럼 보이는 것에 아무도 감명받지 못한 듯했다. 몇몇은 자리를 떠났고, 일부는 항의의 뜻으로 등을 돌리며 야유를 보냈다. \n\n연설이 끝나고 미지근한 박수가 나온 뒤 하워드는 원로들과 오래 대화를 나누었다. 그는 사과에 대해 어떠한 양보도, 그가 \\"공허한 제스처\\"라고 본 어떤 조치도 내놓지 않았다. 양측은 결국 헤어졌고, 실망의 기운이 한동안 감돌았다."
 corroboree_event.1.a: "더 나쁠 수도 있었는데..."
 mining_giants_talk.1.t: "거물들과의 회동"
 mining_giants_talk.1.d: "예상대로 여러 광업 수장들이 지속되는 광업 호황을 활용할 수 있도록 우리의 감세를 연장해 달라고 요청했습니다. 그들은 절약된 자금으로 장기적으로 사업을 확장할 수 있다고 주장합니다. 추가 감세 규모는 작아서 우리 재정을 흔들 가능성은 낮지만, 요청을 거절하고 현상을 그대로 유지할 수도 있습니다. 또는 세율을 올려 호황의 이익 일부를 우리가 거둬들일 수도 있으며, 당장의 결과는 거의 없을 것입니다."
 mining_giants_talk.1.a: "감세를 해 준다."
 mining_giants_talk.1.b: "현상을 유지한다."
 mining_giants_talk.1.c: "세율을 올리고 우리 몫을 거둔다."
 civil_partnership_act.1.t: "전국에서 통과된 시민 결합법"
 civil_partnership_act.1.d: "국회 의사당 밖에 모인 수천 명의 지지자들은 피터 코스텔로가 혼인 인정에 대한 첫 법안이 거의 만장일치로 통과되었다는 소식을 전하는 것을 가장 먼저 지켜보았다. 전국 우편 설문조사가 이 개혁에 전례 없는 추진력을 부여한 뒤 초당적 법안이 통과되었다. \n\n지금까지 전통적 혼인의 개념만 인정해 온 연립이 발의하고 노동당과 녹색당 거의 전원이 지지한 이 통과는 군중 다수에게 충격으로 다가왔고, 이들은 눈물과 기쁨이 뒤섞인 반응을 보였다. 코스텔로는 이 법이 동성애자의 권리를 위한 한 걸음일 뿐 아니라 \\"모든 오스트레일리아인의 권리\\"를 위한 것이며, 앞으로의 개혁을 향한 문이 열렸다고 밝혔다. 부부들은 여전히 해외에서 혼인해야 하지만, 이미 혼인한 이들은 이제 법적으로 결합을 묶을 수 있게 된다."
 civil_partnership_act.1.a: "잘된 일이다."
 the_national_apology.1.t: "국가 사과"
 the_national_apology.1.d: "처음에는 시간을 끄는 듯 보였으나, 존 하워드는 이 나라 원주민인 애버리지니와 토러스 해협 섬 주민에 대한 역사적 잘못에 대한 공식 국가 '사과'를 전달했다. \n1997년의 《그들을 집으로 데려오기》 보고서에 기초한 역사적인 이 행보는 [GetASTLeaderTitle]이(가) 의회 의사당에서 발표했으며 오스트레일리아 전역에 감정의 충격파를 보냈다. 대강당과 의사당 바깥 잔디밭의 군중은 환호하고 박수를 쳤다. 수천 명이 빗속에 시드니 거리에 모여 이 기념비적인 연설을 지켜보았다. 공동체는 깊은 안도감과 치유를 느꼈고, 그 안의 많은 이들은 연립의 화해 노력을 의심할 여지 없는 성공이라 칭송하고 있다."
 the_national_apology.1.a: "이제 앞으로 나아갈 때다."
 pacific_solution.1.t: "태평양 해법"
 pacific_solution.1.d: "오스트레일리아 정부가 망명 신청자 처리 시설과 관련된 제안을 가져왔습니다. 이 시설을 유치하는 대가로, 운영을 지원하기 위해 우리의 지역 기반시설과 해군 항만 시설을 대폭 개선해 주겠다고 제안했습니다."
 pacific_solution.1.a: "오스트레일리아의 투자를 승인한다."
 pacific_solution.1.b: "우리의 주권은 팔 물건이 아니다."
 pacific_solution.3.t: "파푸아뉴기니의 수락"
 pacific_solution.3.d: "다행히 파푸아뉴기니 정부가 우리의 제안에 동의했습니다. 새 처리 시설의 건설이 곧바로 시작될 것입니다."
 pacific_solution.3.a: "예상대로다."
 pacific_solution.4.t: "파푸아뉴기니의 거절"
 pacific_solution.4.d: "이웃 나라는 주권에 대한 우려와 지역의 반대를 이유로 제안을 거절했습니다. 다른 방법을 찾아야 합니다."
 pacific_solution.4.a: "실망스럽다."
 pacific_solution.5.t: "나우루의 수락"
 pacific_solution.5.d: "나우루 지방 정부가 우리의 제안을 수락했습니다. 우리의 태평양 작전에서 또 한 걸음이 차질 없이 진행되었습니다."
 pacific_solution.5.a: "예상대로"
 pacific_solution.6.t: "태평양 해법 거부"
 pacific_solution.6.d: "나우루가 제안을 거절했습니다. 그들은 우리의 이민 문제에 도움이 되지 않을 것이며, 대신 태평양에서 고립된 채 남기로 체념한 듯합니다."
 pacific_solution.6.a: "이건 재앙이다..."
 stomp_out_the_roots.1.t: "오스트레일리아의 대테러 협력 제안"
 stomp_out_the_roots.1.d: "오스트레일리아 정부가 우리나라 내 극단주의 세포를 저지하고 제거하는 데 초점을 맞춘 공동 안보 구상을 제안했습니다. 광범위한 전술 지원과 정보 공유를 제시하고 있습니다."
 stomp_out_the_roots.1.a: "더 안전한 인도네시아를 위해 협력한다."
 stomp_out_the_roots.1.b: "우리의 내부 안보는 우리가 처리할 수 있다."
 stomp_out_the_roots.2.t: "인도네시아의 협력 동의"
 stomp_out_the_roots.2.d: "자카르타가 우리의 제안을 공식 수락했습니다. 그들 영토에서의 우리 작전을 즉시 시작할 수 있으며, 우리 정보 기관들은 이미 인수 절차를 처리하고 있습니다."
 stomp_out_the_roots.2.a: "굳건한 동반자 관계의 시작이다."
 stomp_out_the_roots.3.t: "자카르타의 공동 구상 거부"
 stomp_out_the_roots.3.d: "인도네시아 정부는 군사 협력 제안을 거절하고 문제를 단독으로 처리하기를 선호했습니다."
 stomp_out_the_roots.3.a: "그들의 손해다."
 state_visit: "국빈 방문"
 ast_off_to_delhi.1.t: "인도 방문"
 ast_off_to_delhi.1.d: "하워드가 비행기에서 내린 후 연단까지 가는 내내 미소와 악수가 이어졌다. 독립 이후 우리는 서로 미지근한 관계를 유지해 왔다. 기분을 상하게 하지 않을 정도로 말이다. 이번이 이달 들어 네 번째 만남이었다. 현지 언론은 외국 지도자들에게 인도의 매력을 선보일 기회를 즐겼고, 하워드의 국내 정책을 비판하는 데 망설임이 없었다. 그것이 정부를 돌려세우기에는 충분치 않았다. 우리는 인근의 어느 나라보다 높은 비율로 우라늄을 수출할 것이었고, 그들은 농축은 하지 않겠다는 약속에 미소 짓고 고개를 끄덕일 것이었으며, 우리도 함께 미소 지었다. 결국 이것은 오스트레일리아에게 또 하나의 '발판'이었다. 혜택을 거두는 쪽은 우리였고, 악수 한 번 한 번이 우리를 태평양 최대의 수출국에 더 가까이 데려다 주었다."
 ast_off_to_delhi.1.a: "양국 모두에게 윈윈이다."
 ast_trade_deal: "주요 무역 협정"
 ast_trade_agreement: "무역 협정"
 refused_trade_deal: "우리의 무역 협정을 거부함"
 marks_trade.1.t: "오스트레일리아의 무역 타진"
 marks_trade.1.d: "지역 경제 유대를 강화하기 위해 오스트레일리아 정부가 광범위한 무역 및 투자 협정을 제안해 왔습니다. 제안에는 양국 간 제한 완화와 관세 철폐, 그리고 우리의 금융·통신·교육 부문을 외국인 투자에 개방하는 조항이 포함되어 있습니다. 이는 여러 면에서 우리를 세계에 열어 줄 것이 분명하며, 양국 모두 상호 간 상품과 서비스의 흐름이 늘어나는 것을 보게 될 것입니다."
 marks_trade.1.a: "번영하는 동반자 관계가 기다린다."
 marks_trade.1.b: "우리 시장은 보호되어야 한다."
 ast_our_capacity_for_peace.1.t: "오스트레일리아의 평화 유지 구상 제안"
 ast_our_capacity_for_peace.1.d: "태평양의 안정을 지키기 위해 캔버라 정부가 공동 평화 유지 작전 계획을 가지고 우리에게 접근했습니다. 이 제안은 사실상 양국 간, 특히 대테러 분야의 군사 협력을 위한 토대가 될 것입니다. 제안에는 향후 정보 공유 계획도 포함되어 있습니다. 지금 제안을 수락하고 이후 그들이 제시하는 변경 사항은 나중에 처리할 수도 있고, 아예 거절할 수도 있습니다."
 ast_our_capacity_for_peace.1.a: "평화만이 앞으로 나아갈 유일한 길이다."
 ast_our_capacity_for_peace.1.b: "태평양을 어떻게 지킬지는 우리가 스스로 결정한다."
 ast_our_capacity_for_peace.2.t: "합의 도달"
 ast_our_capacity_for_peace.2.d: "베이징이 우리의 제안에 호의적으로 응답했습니다. 우리의 평화 유지 구상이 공식적으로 시작되었으며, 그들은 이 조치를 굳히기 위해 곧 참여하겠다고 약속했습니다."
 ast_our_capacity_for_peace.2.a: "그들을 면밀히 지켜볼 것이다."
 ast_our_capacity_for_peace.3.t: "제안 거부"
 ast_our_capacity_for_peace.3.d: "상호 평화 유지 협약을 위한 우리의 타진은 베이징 정부의 냉담한 무관심에 부딪혔습니다. 그들의 외교관들은 태평양에서의 자국 주권에 대한 우려로 응답했습니다."
 ast_our_capacity_for_peace.3.a: "그렇다면 우리 홀로 서겠다."
 fossil_fuels.1.t: "위안화를 위한 화석 연료"
 fossil_fuels.1.d: "오스트레일리아가 성장하는 우리 산업 부문에 연료를 공급하기 위해 석탄 수출을 대폭 확대하자고 제안했습니다. 유리한 환율을 대가로, 그들은 우리의 주된 에너지 협력국이 될 준비가 되어 있습니다."
 fossil_fuels.1.a: "산업의 엔진에는 연료가 필요하다."
 fossil_fuels.1.b: "석탄은 우리 방식대로 확보하겠다."
 fossil_fuels.2.t: "위안화를 위한 화석연료"
 fossil_fuels.2.d: "기존의 평화 유지 구상을 토대로, 오스트레일리아가 포괄적인 무역 협약을 제안했습니다. 이 '위안화를 위한 화석연료' 계획을 통해 에너지 공급선을 확보함으로써, 우리는 에너지 안보와 공급을 더욱 공고히 할 수 있습니다."
 fossil_fuels.2.a: "우리의 동반자 관계는 더욱 굳건해진다."
 fossil_fuels.2.b: "그들의 협력이면 충분하다."
 fossil_fuels.3.t: "석탄 협정 체결"
 fossil_fuels.3.d: "중국 정부는 장기적인 화석연료 계약에 동의하기를 꺼려 왔습니다. 일단 그들은 매장량을 공급하는 소규모 수출 제안을 받아들였습니다. 우리 광업 부문은 이미 협정 이행을 위한 준비에 들어갔습니다."
 fossil_fuels.3.a: "훌륭하군."
 fossil_fuels.4.t: "화석연료 제안 거절"
 fossil_fuels.4.d: "중국은 에너지 독립을 원한다는 이유를 들어 석탄 수출 확대에 관한 우리의 모든 제안을 거절했습니다."
 fossil_fuels.4.a: "놓쳐 버린 기회다."
 fossil_fuels.5.t: "중국의 역제안"
 fossil_fuels.5.d: "뜻밖에도 석탄 수출 확대 제안을 받은 중국 대표단은 자체적인 제안으로 응수했습니다. 그것은 우리의 석탄과 기타 광물 수출에 대한 사실상 무관세 무역을 대가로, 중국산 전자제품과 상품 전반을 아우르는 우선 무역 협정입니다. 우리에게 이보다 더 좋은 결과는 있을 수 없습니다. 우리 산업계 수장들은 거래가 유효한 동안 수출 물량을 확보하느라 분주합니다."
 fossil_fuels.5.a: "행운이 계속된다."
 ast_jap_trade.1.t: "오스트레일리아와의 무역 협상"
 ast_jap_trade.1.d: "오스트레일리아와 수 주에 걸친 협상 끝에 포괄적 무역 협정의 첫 초안이 나왔습니다. 세부 내용은 방대한 양의 농산물을 우리나라로 수출하는 대신 우리의 전자제품과 자동차에 대한 관세를 낮추는 것입니다. 이는 안정적인 식량 공급을 가져다줄 수 있으나, 이 기회에 더 많은 것을 요구해 볼 수도 있습니다."
 ast_jap_trade.1.a: "제안된 조건을 수락한다"
 ast_jap_trade.1.b: "귀중한 광물에 대한 우선 채굴권을 요구한다"
 ast_jap_trade.1.c: "조건이 불리하다"
 ast_jap_trade.2.t: "일본 무역 협정 체결"
 ast_jap_trade.2.d: "도쿄 대표단이 협상이 성공적으로 끝났다는 소식을 전해 왔습니다. 일본이 주요 경제국과 포괄적 경제 동반자 협정 또는 자유 무역 협정을 협상한 것은 이번이 처음이며, 하물며 우리와 맺은 것은 더욱 의미가 큽니다. 이는 양국 관계의 중대한 전환점이며, 앞으로 오랜 세월 더욱 굳건한 관계의 토대가 될 수 있습니다."
 ast_jap_trade.2.a: "건배!"
 ast_jap_trade.3.t: "일본, 광물 채굴권 요구"
 ast_jap_trade.3.d: "협상이 국면 전환을 맞았습니다. 그들은 성장하는 기술 산업을 뒷받침하고 관세 인하 비용을 상쇄하기 위해 우리의 귀중한 광물 매장지에 대한 우선 접근권을 요구하고 있습니다. 이는 우리 국내 자원 확보에 심각한 부담을 주며 거래를 전반적으로 덜 유리하게 만듭니다. 그들에게 원래의 거래로 돌아가도록 압박할 수도 있지만, 협상 전체가 위태로워질 수 있습니다."
 ast_jap_trade.3.a: "새 조건에 동의하고 거래를 확정한다"
 ast_jap_trade.3.b: "입장을 고수한다. 원래의 거래를 요구한다"
 ast_jap_trade.4.t: "무역 제안 거절"
 ast_jap_trade.4.d: "도쿄 대표단이 협상이 결렬되었다는 소식을 전해 왔습니다. 그들은 추가 논의를 암시하는 기색도 거의 없이 회의실을 박차고 나간 것으로 보입니다. 협정에 대한 우리의 계획은 사실상 물거품이 되었습니다. 무역 계획에 심각한 제동이 걸렸지만, 탐색해 볼 만한 다른 길이 있을지도 모릅니다."
 ast_jap_trade.4.a: "당분간은 차질이다"
 ast_jap_trade.5.t: "오스트레일리아, 입장 고수"
 ast_jap_trade.5.d: "캔버라 대표단은 광물 채굴권에 대한 어떤 협상도 거부하며 원래의 제안을 굳건히 고수하고 있습니다. 그들은 관세 인하를 대가로 한 농산물 수입 협정안이 최종안임을 분명히 했습니다."
 ast_jap_trade.5.a: "우리가 성급했는지도 모른다."
 ast_jap_trade.5.b: "그렇다면 성사될 거래는 없다."
 base_state_visit.1.t: "미국 방문"
 base_state_visit.1.d: "하워드는 앞서 1999년 관세 논의 차 백악관을 방문한 적이 있었다. 그때도 비가 내렸고, 마치 상징처럼 이번에도 비가 내렸다. 그는 대통령과의 면담을 마치고 정문을 지나 우산을 든 기자단 앞으로 나아갔다. 미국의 모든 것은 거대했다. 상점도 컸고, 교회도 컸다. 대통령 관저는 특히나 컸다. 오스트레일리아에는 그에 견줄 만한 규모의 것이 없었고, 그만큼 웅장한 것도 분명 없었다. 무언가를 보상하려는 것이라 말할 수도 있겠지만, 그들은 실제로 모든 것을 갖추고 있었고, 결국 우리는 그 몫을 얻기 위해 협상 테이블로 나서야 할 터였다. 태평양 방위 보장이든 무역 조달이든, 오스트레일리아는 자신이 가치 있는 동반자임을 증명해야 했다. 베트남과 한국에서 그랬듯이, 다음 전쟁에서도 우리는 그곳에 있을 것이다."
 base_state_visit.1.a: "우리의 마음의 평화를 위해."
 base_state_visit.2.t: "중국 방문"
 base_state_visit.2.d: "하워드가 베이징에 도착했을 때 가장 먼저 그를 맞이한 사람은 중국 총리였다. 주위를 맴도는 중국 언론을 지나, 총리는 일행을 인근의 통제된 식당으로 안내해 무역 방안을 논의했다. 중국은 협상에 매우 열의를 보이는 상대였지만, 그들과 일하는 데에는 언제나 단서가 따랐다. 하워드는 그들의 권위주의를 잊지 않았고, 중국 측이 매 논의에서 우위를 점하고 있다고 느끼려 한다는 점이 분명히 드러났다. 그들과의 협상은 오스트레일리아가 원하는 미래를 제시하면서 어떻게든 그들의 미래와 맞물리게 하는 섬세한 춤이 되었다. 공정한 입장을 유지하려면 다음 무역 회담 전에 모든 카드를 써 두어야 했다. 두 사람이 자리에서 일어나 떠날 때, 하워드는 자신이 충분히 잘 해냈다는 확신을 느꼈다."
 base_state_visit.2.a: "그렇게 무대가 마련되었다."
 base_state_visit.3.t: "북한과의 관계 정상화"
 base_state_visit.3.d: "북한과의 논의는 수십 년간 양국 사이에 아무런 기반도 구축되지 않았다는 점에서 독특했고, 하워드는 말하자면 미지의 영역에 발을 들이는 셈이었다. 더 나쁜 것은 양측 사이의 단절이었다. 모든 접촉은 중국에 있는 우리 인맥을 통해 간접적으로 처리되었고, 중국이 이를 다시 북한에 전달했다. 대면 회담은 애초에 기대할 수 없었고, 하워드 본인이 진짜 대표자와 한 번도 대화하지 못한다는 사실은 모든 과정에 기묘한 분위기를 더했다. 결국 그들은 캔버라에 대사관을 두기로 합의했는데, 이는 처음부터 하워드를 불편하게 했지만 회담을 계속하려면 해야 할 일이었다."
 base_state_visit.3.a: "없는 것보다는 낫다."
 base_state_visit.4.t: "대한민국의 방문"
 base_state_visit.4.d: "대한민국 대통령은 매우 단 하나의 목표를 품고 그날 아침 일찍 캔버라에 도착했다. 한국 전쟁이 발발했을 때 오스트레일리아는 미국과 함께 참전했다. 그 이후로 우리는 태평양에서 방위의 확실성을 위한 손쉬운 선택지였으며, 북쪽 이웃이 핵무기를 보유하는 한 그 사정은 계속될 것이었다. 이제 바로 그 문제가 제기되었다. 대통령은 정중했지만, 결국 우리는 무언가를 확고히 해야 할 것이다. 식물원을 거닐며 [KOR.GetLeader]은(는) 계속되는 경제적 어려움과 북한과의 회담이 교착 상태에 빠졌다는 이야기를 나누었다. 당분간 무역 협약이 체결될 것이나, 그 외에는 아무것도 약속되지 않았다."
 base_state_visit.4.a: "당분간은 이것으로 만족해야 한다."
 base_state_visit.5.t: "갈리폴리 기념식"
 base_state_visit.5.d: "튀르키예 국민은 언제나 앤잭 전통을 배려해 왔다. 그날 승리한 쪽이었으니 그러기 쉬웠겠지만, 그래도 그들은 우리가 매년 방문해 전사자를 기릴 수 있도록 부지를 지정해 줄 만큼 이해심이 깊었다. 대다수는 이 기념식을 애도의 순간으로 보거나, 전쟁은 무의미하다는 교훈 등을 가슴에 새긴다. 그날을 국제 동맹의 실책으로 여기는 이는 드물며, 영국이 우리를 반도에 내던지지 않았다면 수십만 명이 그날 죽지 않았을지도 모른다는 점을 생각하는 이도 드물다. 우리의 전임 지도자들은 그것을 생각했고, 우리가 영국에서 미국으로 돌아선 이후 동맹에 대한 중시는 모든 정당의 정책에 뿌리내렸다. 고맙게도 튀르키예는 변함없이 충실한 친구로 남아 있다."
 base_state_visit.5.a: "잊지 않으리."
 base_state_visit.6.t: "군주의 방문"
 base_state_visit.6.d: "엘리자베스 2세 여왕 폐하가 에든버러 공작 전하와 함께 즉위 50주년 기념행사의 일환으로 오스트레일리아에 도착했습니다. \n\n왕실 부부는 2002년 2월 27일 애들레이드에 착륙했으며, 영연방 정상회의 일정과 맞춰 케언스와 캔버라를 비롯한 여러 도시를 방문할 예정입니다.  \n\n영국 유니언 잭을 흔드는 군중이 여왕의 13번째 방문을 위해 마련된 공중 관람석에서 환호했고, 공항에서 애드미럴티 하우스까지 이어진 5마일 길을 따라 늘어섰습니다. [GetASTLeaderTitle]이(가) 곧 여왕을 영접할 것으로 예상되며, 부결된 공화제 국민투표가 의제에 오를 가능성이 있습니다."
 base_state_visit.6.a: "분위기를 좋게 유지하자."
 rudd_state_visit.1.t: "러시아 방문"
 rudd_state_visit.1.d: "지리적으로 오스트레일리아보다 큰 나라는 지구상에 거의 없다. 러시아 연방이 그중 하나라는 데에는 누구도 이견이 없을 것이다. 하워드는 비행기에서 내릴 때 추위에 대한 대비가 되어 있지 않았다. 입국 이틀이 지나서도 바깥에 나서 얼음장 같은 바람이 몸을 뚫고 지나가면 속이 텅 비는 듯했다. 호텔 밖에는 오스트레일리아와 러시아 국기를 든 사람들이 모여 있었고, 이는 마음을 놓이게 했다. 이번 회담을 주선한 것은 케빈 러드였고, 하워드는 자신이 깊은 물속에 내던져진 기분이었다. 곰과 씨름하는 것이 정말 올바른 방법이었을까? 그들은 아직 90년대의 경제적 충격에서 헤어 나오지 못하고 있었다. 이론상 러시아 대통령은 버티기 위해 어떤 무역 지원이든 찾고 있을 터였지만, 하워드는 도착한 뒤로 환영받는다는 느낌을 거의 받지 못했다. 오스트레일리아산 우라늄이 협상할 가치가 있음을 그들에게 납득시키려면 노력해야 할 것이다."
 rudd_state_visit.1.a: "무언가의 시작..."
 leaked_memo.1.t: "유출된 메모"
 leaked_memo.1.d: "어떻게 된 일인지 기자들 중 한 명이 우리 당 인사인 셰인 스톤의 서한을 입수했는데, 거기에는 우리 정부에 대한 가혹한 비판이 여럿 담겨 있었습니다. 가디언은 이미 \\"비열하고 교활한 하워드\\"라는 표현을 헤드라인으로 내걸고 있습니다. 어떻게 유출되었는지는 모르지만 언론은 이를 두고 서커스를 벌이고 있으며, 우리는 이제 수습을 위해 뒤쫓아야 하는 처지입니다. 피터를 포함한 일부 당원은 필사적인 마녀사냥이라도 하듯 스톤을 정치적으로 처단하라고 요구하고 있습니다. 소동이 가라앉을 때까지는 아무것도 할 수 없으며, 이는 개혁을 위한 우리의 추진력을 심하게 둔화시킵니다. 이보다 더 나빠질 수는 없을 듯합니다."
 leaked_memo.1.a: "더 나빠질 수 있을까?"
 reconciliation_journey.1.t: "화해를 향한 여정"
 reconciliation_journey.1.d: "하워드와 언론 팀은 원주민 의원 한 명이 기다리는 작은 방으로 줄지어 들어갔다. 서류 몇 장에 더 서명한 뒤, 그들은 카메라 앞에 섰다. 의원이 돌아서서 하워드의 손을 잡았을 때, [GetASTLeaderTitle]은(는) 그의 손이 굳은살투성이에 뼈마디가 앙상하며 얼마나 거친지를 알아차렸다. 그의 얼굴 또한 굳어 보였지만 눈은 촉촉했다. 하워드는 그의 얼굴에서 세월의 고난과, 지금 그가 붙들고 있는 희망을 읽을 수 있었다. 그것을 잃지 않도록 조심하면서. \\"감사합니다, 하워드 씨.\\" 그는 기자들과 함께 떠나며 말했다. \n\n이제 홀로 남은 그는 잠시 생각에 잠겨 서 있었다. 그는 화해 정책을 자신이 편안하게 여기는 것 이상으로 여러 번 번복했지만, 그럼에도 나라는 그 덕에 더 나아진 듯했다. 그가 해온 모든 일 끝에, 오스트레일리아는 조금씩 마침내 앞으로 나아가고 있었다. 침묵 속에 서 있는 동안 만족감이 그를 감쌌다. 이윽고 더 많은 언론 관계자들이 들어왔고, 하루는 평소처럼 이어졌다."
 reconciliation_journey.1.a: "해야 할 일이 더 남아 있다."
 ast_the_coalition_convention.1.t: "연합 전당대회"
 ast_the_coalition_convention.1.d: "\\"우리는 많은 것을 이루었고, 야당을 이겨냈습니다. 오스트레일리아는 세계 속에서 자랑스럽고 당당하게 서 있습니다. 우리는 경제에서 거둔 성과로 존경받고 있으며, 국제 문제에서 입장을 밝힐 준비가 된 국가로 인식되고 있습니다. 수많은 연합 정책을 관통하는 황금 실이 있으니, 그것은 선택이라는 위대한 원칙입니다. 모든 오스트레일리아 국민이 자신의 미래를 선택할 수 있는 더 큰 선택권입니다. 우리나라는 역사상 그 어느 때보다 자유롭습니다. 국민은 더 많이 벌고, 더 많이 사며, 더 자랑스럽게 살고 있습니다.\\" \n\n\\"앞에 놓인 과제는 우리가 1996년 정권을 되찾고자 했을 때, 그리고 다음 선거에서 다시 도전할 때만큼이나 큽니다. 그동안 우리는 지출 구조를 개선하고 성장하는 경제를 이어가기 위해 많은 일을 할 수 있습니다. 많은 지지자가 자신들과 오스트레일리아 안팎의 더 많은 사람들의 삶을 개선할 더 많은 정책을 기대하고 있습니다. 우리의 책무는 우리의 도덕적 핵심에 내재되어 있습니다. 우리는 모든 이에게 '공정한 기회'를 주는 나라입니다. 우리 한 사람 한 사람이 이끌어야 할 책임을 알고 있습니다. 그 책임은 끝나지 않았습니다.\\""
 ast_the_coalition_convention.1.a: "과제는 끝나지 않았다."
 the_white_paper.1.t: "백서 이행"
 the_white_paper.1.d: "국방 2000 백서는 현재의 군사 역량과 현 행정부가 요구하는 역량을 포괄적으로 검토하기 위해 작성되었습니다. 태평양에서 안보와 평화 유지를 담당하는 주요 공급국으로서 오스트레일리아의 방어 능력에 더 무게를 두면서, 요구 사항은 주로 확충에 맞춰져 왔습니다. 인력만이 아닙니다. 지휘, 기술, 무기 제조 모두가 개선되거나 확대되어야 합니다. 다행히 이를 달성하는 데 도움이 될 여러 계획이 개발 중입니다."
 the_white_paper.1.a: "우리의 생산이 가장 중요하다."
 the_white_paper.1.b: "병력 없이는 싸울 수 없다."
 the_white_paper.1.c: "그들이 수요를 감당할 수 있다."
 the_white_paper.2.t: "제2차 백서 이행"
 the_white_paper.2.d: "성공으로 인한 부작용을 겪고 있든 아니든, 우리는 다시 한번 초기 목표를 가지고 구조 개편을 시작하라는 임무를 받았습니다. 첫 번째 제안은 야전 부대가 사용하는 이동 방식을 효율적으로 바꾸도록 쇄신하는 것입니다. 보충 정책의 변경 또한 제안되었습니다. 그렇지 않다면 최고 사령부로 하여금 현재 진행 중인 우리 교리 연구를 앞당기게 할 수도 있습니다."
 the_white_paper.2.a: "이동성이 우리의 열쇠가 될 것이다."
 the_white_paper.2.b: "보충병은 언제나 필요하다."
 the_white_paper.2.c: "원점에서 다시 시작하자."
 lithgow_arms.1.t: "리스고 소형 화기 공장 매각"
 lithgow_arms.1.d: "탈레스가 낡은 공장을 매입해 개보수하여 우리의 생산 수단으로 쓰겠다며 금액을 제시했습니다. 그들은 전에도 우리의 무기 생산 노력에서 믿을 만한 파트너였고, 공장 상태도 좋지 않습니다. 그들과 함께 새 생명을 불어넣는 것이 최선일 수 있습니다. 하지만 우리가 직접 건물을 재단장할 수도 있습니다."
 lithgow_arms.1.a: "매각한다."
 lithgow_arms.1.b: "우리가 고칠 수 있다."
 governor_general_sacked.1.t: "총독 해임"
 governor_general_sacked.1.d: "오스트레일리아 역사상 아마도 처음으로 총독이 엘리자베스 여왕에 의해 직접 자리에서 물러나게 되었습니다. 이 놀라운 소식은 영국 측 서신 교환과 총리 사이의 일련의 회담 끝에 나온 것으로, 의도했든 아니든 결과적으로 해임에 이른 것으로 보입니다. 이것이 현 정부의 정책 수립에 어떤 영향을 미칠지는 분명하지 않으나, 국내의 많은 왕실 지지자에게는 충격으로 다가왔습니다. 자유당 정부 대변인들은 이번 해임에 대해 아직 논평하지 않았습니다."
 governor_general_sacked.1.a: "속이 시원하다."
 solomon_islands_intervention.1.t: "솔로몬 제도의 붕괴"
 solomon_islands_intervention.1.d: "일련의 무장 봉기와 무장 해제 실패 끝에 솔로몬 제도 정부는 사실상 붕괴하여 무법 상태만이 남았습니다. 오랜 민족 분쟁을 둘러싸고 교전 중인 무장 단체들 사이에 광범위한 전투가 벌어지고 있으며, 공공 서비스는 완전히 무너졌습니다. 그 결과 많은 주민이 폭력에 무방비로 노출되어 이 지역에 인도적 위기가 커지고 있습니다. [SOL.GetLeader] 총리는 이웃 국가들에 지원을 요청하는 절박한 호소를 공식적으로 전했으며, 오스트레일리아 정부는 지역 안정을 위해 즉각 개입하겠다고 약속했습니다."
 solomon_islands_intervention.1.a: "우려스러운 사태다."
 solomon_islands_intervention.2.t: "솔로몬 제도 개입"
 solomon_islands_intervention.2.d: "발리 폭탄 테러 이후 상원의 모든 의원은 테러 문제에 민감해졌습니다. 지금 솔로몬 제도의 상황은 우리를 안심시키기는커녕 정반대입니다. 상황이 악화될수록 우리 해역으로 번질 가능성이 높고, 폭탄 제조를 일삼는 무리의 새로운 온상이 생겨날 수 있습니다. 그곳 총리는 이미 우리에게 개입을 요청했으며, 이를 표결에 부치면 결과는 거의 만장일치일 것입니다. 우리에게는 도덕적 책무가 있지만, 그곳에 들어가면 우리가 겪어 본 어떤 것보다 더 심한 수렁에 빠질 수 있고 오히려 사태를 악화시킬 수도 있습니다. 어느 쪽이든 이 일을 처리하기는 쉽지 않을 것입니다."
 solomon_islands_intervention.2.a: "개입해야 한다."
 solomon_islands_intervention.2.b: "우리의 분쟁이 아니다."
 sol_intervention_tt: "§2솔로몬 제도 개입 결정이 잠금 해제됩니다.§!"
 sol_intervention_failure_tt: "§R상황은 더욱 악화될 뿐입니다...§!"
 solomon_islands_intervention.3.t: "성공한 개입"
 solomon_islands_intervention.3.d: "지금까지 현지 상황은 상점들이 다시 문을 열기 시작하고, 도로에서 무장 세력이 사라지고, 재건 노력이 시작될 만큼 개선되었습니다. 우리 병력은 앞으로 몇 년간 그 나라에 머물러야 하겠지만, 나라가 안정을 찾고 있으며 치유되기 시작하기를 바라는 점에서 안도할 수 있습니다. 솔로몬 제도 정부는 우리에게 빚을 졌으며 임시 국가를 조직하는 데 계속 긴밀히 협력할 것입니다. 한편 우리의 노력에 대한 국제사회의 반응은 오로지 긍정적이었습니다. 우리는 태평양에서 안보를 강화하는 동시에 좋은 평판을 계속 거두고 있습니다."
 solomon_islands_intervention.3.a: "훌륭한 성과다."
 solomon_islands_intervention.4.t: "희망 없는 나라"
 solomon_islands_intervention.4.d: "솔로몬 제도의 상황은 우리의 개입 노력 중에 오히려 악화되었고, 너무나 불안정해져 우리는 손실을 만회하고 개입을 포기할 수밖에 없었습니다. 무장 세력은 거리에서 계속 싸우고 있으며 남은 정부는 사실상 해산했습니다. 국제사회의 반응은 조용한 충격이었으며, 개입에 참여했던 나머지 국가들도 마찬가지로 활동을 중단했습니다. 이제 제도에서 버티는 이들에게 남은 희망은 거의 없습니다."
 solomon_islands_intervention.4.a: "이런 참사가..."
 solomon_islands_intervention.6.t: "우리 정부를 위한 대출"
 solomon_islands_intervention.6.d: "개입에 대한 지속적인 지원의 일환으로, 오스트레일리아는 새 정부가 출범하고 사업체 손실로 인한 우리의 고통을 덜 수 있도록 대출을 제공했습니다. 우리 자체 기관이 비용을 감당할 것으로 예상되기 전까지 1년 더 재정 지원이 이어질 것으로 기대할 수 있습니다."
 solomon_islands_intervention.6.a: "반가운 선물이다."
 walk_for_reconciliation.1.t: "화해를 위한 행진"
 walk_for_reconciliation.1.d: "오늘 25만 명이 넘는 원주민과 비원주민 시위대가 화해에 대한 지지를 공개적으로 표명하며 시드니 하버 브리지를 건넜습니다. 거의 여섯 시간 동안 끊임없이 이어진 이 정치 시위는 오스트레일리아 역사상 최대 규모였습니다. \n\n주최자 중 한 명인 이블린 스콧은 군중이 예상보다 훨씬 많았다고 인정하며, 화해 문제에서 여론과 어긋나 보이는 행정부가 이 행동을 놓치지 않기를 바란다고 밝혔습니다. 시위 도중 항구 위 하늘에 비행기가 연기로 \\"미안하다(sorry)\\"는 글자를 쓰자 행진 참가자들은 환호했습니다. 주최자에 따르면 행진의 성공에 뒤이어 더 많은 행진이 계획되고 있습니다."
 walk_for_reconciliation.1.a: "그들에게는 그럴 자유가 있다."
 sydney_olympic_games.1.t: "시드니 올림픽 개막"
 sydney_olympic_games.1.d: "하계 올림픽이 오스트레일리아 시드니에서 공식 개막했습니다. 220개 국가와 지역에 중계되어 올림픽 역사상 가장 높은 방송 범위를 기록했습니다. \n\n개막식에서는 단거리 선수 캐시 프리먼이 성화를 전달했으며, 그녀는 400미터 결승에서 이 나라의 100번째 금메달도 획득했습니다. 북한을 포함한 199개국이 대회에 참가하고 있으며, 북한은 남한과 함께 단일 깃발 아래 입장하는 모습이 목격되어 반세기 만에 처음으로 상징적 단결을 보여 주었습니다. 대회는 앞으로 2주간 이어질 예정이며 그동안 참가국들이 서로 경쟁하게 됩니다."
 sydney_olympic_games.1.a: "대단한 볼거리다."
 shell_takeover.1.t: "셸의 우드사이드 페트롤리엄 인수"
 shell_takeover.1.d: "로열 더치 셸이 100억 달러 규모로 우드사이드 페트롤리엄 인수를 추진하고 있다는 소식이 들어왔습니다. 두 회사는 지난 몇 년간 긴밀한 관계를 유지해 왔으며, 셸은 노스웨스트 LNG 프로젝트에 대한 기술 지원을 시설의 보다 적극적인 확장으로 전환하겠다는 뜻을 분명히 했습니다. 그러나 우리 당의 부대표이자 재무장관인 피터 코스텔로는 이 움직임에 공개적으로 반대하며, 그처럼 거대한 기업이 가스 사업 대부분을 소유하는 것은 국익에 반한다는 이유로 거래를 막을 것을 조언하고 있습니다."
 shell_takeover.1.a: "인수 시도를 저지한다."
 shell_takeover.1.b: "인수를 허용한다."
 tampa_affair.1.t: "탐파호 사건"
 tampa_affair.1.d: "망명 신청자에 관한 정부의 새 정책은 노르웨이 선박이 크리스마스 섬 앞바다에서 입항을 거부당한 뒤 터져 나온 정치적 폭풍의 촉매제가 되었습니다. 화물선 MV 탐파호의 선장 아르네 린난은 인도네시아 어선에서 표류하던 수백 명의 망명 신청자를 구조해 오스트레일리아의 안전한 곳으로 데려가려 하고 있었습니다. \n\n탐파호에 탑승한 망명 신청자 433명의 건강 상태가 좋지 않음에도 불구하고, 이 선박은 SAS 부대원들에 의해 강제 승선당했으며 회항을 명령받았습니다. 하워드 정부의 불법 입국자 단속 기조 전환에 대해 노르웨이 대사관에서는 대체로 부정적인 반응이 나왔습니다. 이 정책이 어디까지 갈지는 아무도 알 수 없습니다."
 tampa_affair.1.a: "유감스러운 상황이다."
 bali_bombings.1.t: "발리 폭탄 테러"
 bali_bombings.1.d: "인도네시아 발리 섬에서 폭탄 세 개가 터져 오스트레일리아인 88명을 포함해 약 202명이 사망하면서 공포가 퍼졌습니다. 해외에서 테러 활동이 늘어나는 동안 이 나라가 지녀 온 평화와 거리감은 지난밤 갑작스레 산산이 부서졌습니다. 보도에 따르면 폭탄 두 개는 오스트레일리아 관광객이 흔한 붐비는 유흥가에 있었고, 세 번째는 덴파사르의 미국 영사관 앞에서 폭발했습니다. 알카에다와의 연관성은 불분명하지만, 이번 공격이 테러 행위로 자행되었음은 분명합니다. \n\n이튿날 아침, 한때 붐비던 거리의 보도에는 흰 천으로 덮인 시신 50구 이상이 놓여 있었습니다. 오스트레일리아가 더 이상 대테러 투쟁의 방관자가 아니라는 가혹한 메시지입니다."
 bali_bombings.1.a: "맙소사..."
 embassy_attacked.1.t: "오스트레일리아 대사관 공격"
 embassy_attacked.1.d: "오늘 오전 10시경 인도네시아 주재 우리 대사관 중 한 곳 밖에서 폭발이 있었다는 보고가 들어오고 있습니다. 다행히 직원은 한 명도 사망하지 않았으나, 차량 폭탄으로 보이는 이번 폭발로 지금까지 9명이 사망하고 약 150명이 부상했습니다. 이번 공격이 우리를 겨냥한 것임은 분명해 보이며, 비슷한 공격이긴 하나 앞선 발리 폭탄 테러와 관련이 있는지는 현재 확실하지 않습니다. 인도네시아 정부가 직접 연락해 와 수사를 조직하자고 했습니다. 이것은 더 많은 표적 공격의 시작에 불과할지도 모릅니다."
 embassy_attacked.1.a: "악몽이 되어 가고 있다."
 asian_earthquakes.1.t: "인도 지원"
 asian_earthquakes.1.d: "현재 아시아 전역의 지진으로 11,000명 이상이 사망했습니다. 해안을 덮친 쓰나미가 수천 채의 집과 자동차를 쓸어 갔고, 피해 지역 전반에서 대규모 통신 두절이 발생했으며 도로와 철도 선로도 헤아릴 수 없는 피해를 입었습니다. 특히 인도는 가장 심각한 피해를 겪고 있으나, 현재로서는 피해 규모가 얼마나 되는지 알 수 없습니다. 국제 적십자는 피해 국가들에 즉각적인 지원을 요청하는 긴급 호소문을 발표했습니다. 이 기회에 인도에 지원 물자를 보내 기존의 유대를 강화할 수 있습니다."
 asian_earthquakes.1.a: "그들을 지원하겠다."
 asian_earthquakes.1.b: "그들 스스로 해결해야 한다."
 asian_earthquakes.2.t: "오스트레일리아의 지원 제안"
 asian_earthquakes.2.d: "우리와 아시아 전역을 덮친 지진에 대응하여, 캔버라가 복구를 지원하기 위한 구호 물자를 제안해 왔습니다."
 asian_earthquakes.2.a: "뜻밖이지만, 반가운 일이다."
 cronulla_riots.1.t: "크로눌라 인종 폭동"
 cronulla_riots.1.d: "해변 교외 지역인 크로눌라에서 최대 200명에 이르는 현지 갱단이 모스크 밖에서 현지 경찰과 대치에 돌입했으며, 이는 인종 폭동으로 묘사되고 있습니다. 이는 일련의 충돌에 뒤이은 것으로, 그중 한 번은 약 5,000명의 집회 참가자가 중동계 외모의 사람들을 공격한 일이었습니다. 충돌은 무슬림 공동체 구성원들의 일련의 보복 공격으로 시드니의 다른 지역으로 번졌습니다. 폭동으로 경찰과 의료진을 포함해 30명 이상이 부상했으며 16명이 체포되었습니다. 여러 종교 단체가 이번 공격에 대해 공개적으로 비판했고 현지 경찰은 질서 회복을 최우선 과제로 삼았으나, 시드니 거리의 높은 긴장은 여전합니다."
 cronulla_riots.1.a: "불만을 제기할 권리는 있겠지."
 cronulla_riots.1.b: "강력히 단속한다."
 rip_steve_irwin.1.t: "아이콘의 죽음"
 rip_steve_irwin.1.d: "TV의 '악어 사냥꾼'으로 세계적인 명성을 얻은 자연주의자 스티브 어윈이 노랑가오리의 독침이 가슴을 찌른 다이빙 사고로 비극적인 죽음을 맞았습니다. 사고는 포트 더글러스 앞바다에서 수중 다큐멘터리를 촬영하던 중에 발생했습니다. 제작진은 그를 응급 구조 헬리콥터로 옮기려 했으나, 구급대원이 도착하기 전에 숨을 거두었습니다. 그의 죽음은 많은 오스트레일리아 국민과 전 세계 팬들에게 충격을 안겼습니다. \n\n\\"관광 산업과 자연 보호에 있어 끔찍한 손실입니다. 스티브를 만난 사람은 모두 그의 에너지와 열정에 감명받았고, 그는 진정한 오지 사나이였습니다.\\" 퀸즐랜드 주 관광부 장관 마거릿 키치는 이렇게 밝혔습니다. 국가적 아이콘의 죽음은 의회 인사들에게조차 깊은 충격을 안겼으며, [AST.GetLeader]와(과) 야당 의원들은 조사를 낭독하며 그의 죽음을 애도했습니다."
 rip_steve_irwin.1.a: "오스트레일리아는 훌륭하고 개성 넘치는 아들을 잃었다."
 a_global_financial_crisis.1.t: "글로벌 금융 위기"
 a_global_financial_crisis.1.d: "미국 주택 시장의 붕괴와 뒤이은 은행 폐쇄의 여파가 바다를 건너 우리에게까지 닥쳤습니다. 이미 우리 달러는 급격히 가치가 떨어지고 있으며 소비자 신뢰는 곤두박질쳤습니다. 이에 대응해 중앙은행이 기준금리를 인하했고, 수십 개의 기업이 불황 속에서 문을 닫고 있습니다. 이를 수습하고 추락을 늦추지 못하면 실업률이 치솟고 수십 년간 보지 못한 규모의 불황을 맞을 수 있습니다."
 a_global_financial_crisis.1.a: "상황이 악화되었다."
 rus_deal_ast.1.t: "오스트레일리아의 거래 제안"
 rus_deal_ast.1.d: "캔버라가 자국 우라늄 매장지에 대한 유리한 수출 권한을 대가로 한 무역 거래를 제안해 왔습니다. 오스트레일리아 측은 해당 광물을 무기용 농축이 아닌 에너지 사업에만 사용해야 한다고 강력히 주장해 왔습니다. 실제로 이 거래는 우리 원자로에 연료를 공급하는 데 유용할 것이며, 나중에 언제든 마음을 바꿀 수도 있습니다. 반면, 그들이 공급을 이행할 것이라고 믿을 수 있을까요?"
 rus_deal_ast.1.a: "좋다."
 rus_deal_ast.1.b: "사양하겠다."
 rus_deal_ast.2.t: "러시아 무역 거래"
 rus_deal_ast.2.d: "모스크바가 우리의 무역 거래에 동의했습니다. 우리는 공정한 가격에 우라늄을 선적할 것이며, 루블이 오스트레일리아 국고로 흘러들 것입니다. 그들은 이미 무역 사무소를 통해 선적 준비를 시작했습니다."
 rus_deal_ast.2.a: "훌륭하군."
 rus_deal_ast.3.t: "러시아 무역 거래"
 rus_deal_ast.3.d: "모스크바가 우리의 무역 거래를 거절했으며, 자국의 우라늄 공급원은 보다 국내에 한정될 것이라고 주장했습니다."
 rus_deal_ast.3.a: "뭐, 시도는 해봤다."
 isr_ast_visit.1.t: "성지 방문"
 isr_ast_visit.1.d: "하워드는 이스라엘인들을 좋아했다. 그들의 회복력은 오스트레일리아인에게서 볼 수 있는 것과 다르지 않았고, 그들의 외교관은 가장 뛰어난 축에 속했다. 다만 그들은 중동에서의 곤경을 이야기할 기회를 결코 놓치지 않았다. 끊임없이 고통받는 나라였지만, 민주주의의 가치에 대한 헌신만큼은 존경할 만했다. \n\n그는 이제 그 벽 앞에 서 있었고, 깊은 슬픔이 하워드의 마음을 훑고 지나갔다. 이 나라를 방문한 것이 아마 세 번째였지만, 통곡의 벽을 본 것은 이번이 처음이었다. 그것을 마주한 감정은 거의 압도적이었고, 그의 내면에서 솟구쳤다. 어쩌면 이스라엘인들은 늘 이렇게 느끼는지도 모른다. 그토록 큰 상실. 보좌관 한 명이 전통에 따라 벽을 만져 보겠느냐고 하워드에게 물었다. 그는 말없이 고개를 끄덕였고 그들은 벽에 다가갔다. 얇고 둥근 모자가 그의 머리에 씌워졌고, 벽에 손을 대자 그 영혼이 자신 안으로 불어 들어오는 것을 느꼈다."
 isr_ast_visit.1.a: "성서적인 체험이다."
 adf_acq_astuirement.1.t: "ADF 조달 후보"
 adf_acq_astuirement.1.d: "주요 조달처 후보가 세 곳으로 추려졌습니다. 첫째이자 가장 납득하기 쉬운 곳은 미국입니다. 미국은 주력 소총에서 훌륭한 진전을 이루었고, 해외 경험과 우리와의 공동 방위 약속은 전략적 차원에서 손쉬운 선택지로 만듭니다. 둘째는 독일입니다. 오스트리아를 택하지 않는다면, 그 이웃 나라를 택하는 편이 낫습니다. 헤클러 운트 코흐는 세계 최고의 소총 제조업체 중 하나가 되었습니다. 그곳이라면 잘못될 일은 없을 것입니다. 마지막은 믿음직한 벨기에입니다. FN 시리즈를 훌륭한 장비로 평가하지 않을 사람은 없으며, 영국에 있는 영연방 친구들도 자신들의 필요에 맞춘 자체 계열을 개발했습니다. 우리도 쉽게 같은 일을 할 수 있습니다."
 adf_acq_astuirement.1.a: "미국과 함께 간다."
 adf_acq_astuirement.1.b: "품질을 택한다."
 adf_acq_astuirement.1.c: "오래되고 검증된 것"
 ast_high_speed_rail.1.t: "고속철도 사업 지연"
 ast_high_speed_rail.1.d: "예상했다는 듯이 사업에 문제가 생긴 것 같습니다. 브리즈번 남쪽 노선은 긴 산악 지대를 통과하도록 계획되어 있습니다. 산의 밀도에 대한 추정이 빗나갔고, 현재 굴착에는 상당히 많은 비용이 들 것입니다."
 ast_high_speed_rail.1.a: "예상했던 일이다."
 ast_high_speed_rail.1.b: "사업을 백지화한다."
 ast_high_speed_rail.2.t: "토지 확보 문제로 어려움을 겪는 고속철도"
 ast_high_speed_rail.2.d: "철도 통과에 필요한 교외 지역에서 더 많은 문제가 불거졌습니다. 여러 님비(NIMBY, 우리 집 뒷마당만은 안 된다) 단체가 개발안에 반대하고 있으며, 법적 공방으로 사업이 무기한 중단될 수 있습니다. 해당 지역을 우회하려면 현재 노선을 폐기하고 새로 설계해야 합니다."
 ast_high_speed_rail.2.a: "님비들이 우리에게 해준 게 뭐가 있다고?"
 ast_high_speed_rail.2.b: "절대 안 된다."
 ast_high_speed_rail.3.t: "자원 비용으로 지연되는 철도"
 ast_high_speed_rail.3.d: "고속철도 사업에 또 하나의 차질이 생겼습니다. 강철 가격이 폭등한 뒤 앞서 확정해 둔 철 주문이 갑자기 무산되었습니다. 이제 유통업체들은 이전 가격의 세 배를 요구하고 있으며, 원래 비용을 고려하면 이는 전체 예산에서 상당한 부분을 차지합니다."
 ast_high_speed_rail.3.a: "그게 얼마였더라?"
 ast_high_speed_rail.3.b: "꿈도 야무지다고 전해라."
 ast_high_speed_rail.4.t: "고속철도 비용 재편성"
 ast_high_speed_rail.4.d: "사업 착공 후 거의 5년이 지나 당초 자금과 추가 자금이 거의 소진되었습니다. 인건비, 허가 비용, 자재비가 사상 최고치를 기록하면서 사업 투자는 800억 달러를 추가로 포함하도록 재편성되고 있습니다. 일부 기획자들은 터널의 끝에 빛이 보인다고 확신하지만, 그토록 많은 차질을 겪은 뒤라 사업에 대해 보장된 것은 아무것도 없습니다."
 ast_high_speed_rail.4.a: "제발 끝나게 해다오."
 ast_high_speed_rail.4.b: "같은 수에 두 번 속지 않는다."
 ast_high_speed_rail.5.t: "고속철도 공개"
 ast_high_speed_rail.5.d: "여러 차례의 차질과 예산 증액을 겪은 끝에, 첫 열차가 브리즈번 역을 출발하면서 고속철도망이 공개되었습니다. 최첨단이라고 선전되어 온 이 철도 노선은 현재 브리즈번에서 멜버른까지 운행하며, 소요 시간은 6시간이 채 안 된다고 합니다. 많은 사람이 달라진 철도 노선에 맞게 개축된 역에 모여 열차의 도착을 지켜보았습니다. \n\n이 사업은 최근 몇 년간 나라의 현대화를 상징하는 것이 분명하며, 매일 20만 명 이상의 승객이 이용할 것으로 예상됩니다. 많은 오지 사람들의 이동 방식을 바꾸게 될 것입니다."
 ast_high_speed_rail.5.a: "공학의 경이다!"
 base_state_visit.7.t: "인도네시아 방문"
 base_state_visit.7.d: "폭탄 테러 이후 상황은 상당히 긴장되어 있었고, 하워드는 비행기에서 내리자마자 군인들의 호위선이 따라붙어 어느 방향으로도 한 걸음 내딛기가 어려울 정도였다. 인도네시아인들은 겉모습을 유지하려 신경 썼지만, 아체에서 계속되는 반란은 보기 좋지 않았다. 인도네시아 대통령은 계속되는 안보 공약에 대해 논의하는 데 매우 적극적인 듯 보였으나, 바로 그 사안에 대한 협상은 몇 번이고 결렬되어 왔다. 양국 관계는 이제 식민 지배 이후 시절의 '쿰바야'와는 거리가 멀게 불안해졌고, 균열이 뚜렷이 드러나고 있었다."
 base_state_visit.7.a: "다음에 또 보자."
 generic_bushfires_ast.1.t: "[ast_bushfire_state.GetName]의 대규모 산불"
 generic_bushfires_ast.1.d: "이례적으로 덥고 건조한 여름이 [ast_bushfire_state.GetName] 전역에 걷잡을 수 없는 산불을 일으켰습니다. 주 전역의 작은 불길 다수가 하나의 전선으로 합쳐지면서 지금까지 100만 헥타르가 넘는 땅이 불탔습니다. 산불은 대부분 사람이 살지 않는 숲과 국립공원에 한정되어 있지만, 주변 지역에서는 대피 작업이 여전히 진행 중이며 수백 채의 농촌 가옥과 가축을 잃었을 가능성이 높습니다. 소방관들은 지금까지 불길이 마을에 닿지 않도록 막는 데 성공했습니다. 그럼에도 연기로 인해 현재 주 내 항공편에 차질이 빚어지고 있습니다."
 generic_bushfires_ast.1.a: "걱정스럽다."
 papua_affair.1.t: "파탄 난 외교 회담"
 papua_affair.1.d: "파푸아 뉴기니 총리 [PAP.GetLeader]이(가) 회담을 위해 도착한 브리즈번 공항에서 문제가 발생한 뒤, 우리의 협상이 물거품이 될 수도 있어 보입니다. \n\n공항 직원 한 명이 보안 검색 중 지도자에게 신발을 벗어 달라고 요청했는데, 이는 표준 절차였던 모양이지만 총리는 그것을 모욕으로 받아들인 듯합니다. 그들의 특사들은 이미 짐을 싸서 비행기로 떠날 채비를 마쳤고, 우리 외교관들은 회담을 재개해 달라고 간청하고 있습니다. 무언가라도 건지려면 우리가 직접 나서야 할 것입니다."
 papua_affair.1.a: "무엇이든 건져 보려 시도한다."
 papua_affair.1.b: "투정을 부리든 말든 우리 알 바 아니다."
 ast_howard_of_arabia.1.t: "아라비아의 하워드"
 ast_howard_of_arabia.1.d: "차가 또 하나의 깊은 구덩이를 넘으며 튀어 오르자 하워드는 지프 천장에 머리를 부딪힐 뻔했다. 앞좌석의 외교관이 몸을 돌려, 이곳 도로가 아이언 돔의 요격 결과 떨어진 미사일 파편 때문에 파손되었다고 재빨리 설명하기 시작했다. 하워드는 고개를 끄덕이며 그편이 대안보다 낫다는 데 동의했지만, 도시에서 형성했던 이 나라의 이미지가 이곳의 현실과 같지 않다는 생각을 떨칠 수 없었다. 차가 영사관으로 들어서는 모퉁이마다 이스라엘 국방군이 있는 듯했고, 하워드는 그곳에서 지역 안보에 관한 연설을 할 예정이었다. \n\n오스트레일리아는 이미 중동에 발을 깊이 들여놓았고, 이제는 이스라엘이 상황을 통제하도록 돕기 위해 상설 기지를 주둔시키려 하고 있었다. 여러모로 그들이 서구적인 외양을 내세움에도 불구하고, 이스라엘은 평화로운 미래를 위한 기반이 없는 개발도상국으로 보였다. 이란의 침공에 대한 두려움조차 가장 가까운 이웃인 팔레스타인과의 불화 앞에서는 빛을 잃었고, 하워드는 갑자기 협정 전체를 다시 생각하기 시작했다."
 ast_howard_of_arabia.1.a: "우리의 미래는 이스라엘에 있다."
 ast_howard_of_arabia.1.b: "당분간은 아무것도 약속할 수 없다..."
 indonesian_ultimatum.1.t: "오스트레일리아의 최후통첩"
 indonesian_ultimatum.1.d: "오스트레일리아가 아체 지역을 자국 평화 유지군에 넘기라고 노골적으로 요구했으며, 이는 사실상 우리 영토 하나를 그들의 군대가 점령하도록 허용하라는 것입니다. 그들은 이것이 결국 반군 없는 지역의 독립으로 이어질 것이라고 주장했으나, 우리로서는 이를 보장할 방법이 없으며 어쨌든 우리 땅을 잃는 일입니다. 거부하면 제재를 가하겠다고 그들은 위협했습니다."
 indonesian_ultimatum.1.a: "선택의 여지가 없다."
 indonesian_ultimatum.1.b: "터무니없다!"
 indonesian_ultimatum.2.t: "인도네시아의 수용"
 indonesian_ultimatum.2.d: "자카르타가 제시된 조건에 동의하고 아체 영토를 포기했습니다. 우리 평화 유지군은 곧 파병되어 지역의 질서를 회복할 것입니다. 인도네시아 국민은 머지않아 반란에서 해방될 것입니다."
 indonesian_ultimatum.2.a: "평화가 승리했다!"
 indonesian_ultimatum.3.t: "인도네시아, 최후통첩 거부"
 indonesian_ultimatum.3.d: "자카르타는 우리의 조건을 거부했으며 우리 평화 유지군이 아체에 진입하는 것을 허용하지 않고 있습니다. 그들은 완강하게 스스로 반란을 진압하겠다고 맹세했습니다."
 indonesian_ultimatum.3.a: "그렇다면 어쩔 수 없다."
 indonesian_ultimatum.4.t: "오스트레일리아의 최후통첩"
 indonesian_ultimatum.4.d: "오스트레일리아가 아체 지역을 자국 평화 유지군에 넘기라고 노골적으로 요구했으며, 이는 사실상 우리 영토 하나를 그들의 군대가 점령하도록 허용하라는 것입니다. 그들은 이것이 결국 반군 없는 지역의 독립으로 이어질 것이라고 주장했으나, 우리로서는 이를 보장할 방법이 없으며 어쨌든 우리 땅을 잃는 일입니다. 거부하면 제재를 가하겠다고 그들은 위협했습니다."
 indonesian_ultimatum.4.a: "선택의 여지가 없다."
 indonesian_ultimatum.4.b: "터무니없다!"
 us_aus_trade_howrd.1.t: "오스트레일리아와의 농업 무역 논의"
 us_aus_trade_howrd.1.d: "캔버라 정부가 양국 간 거의 모든 제조업 및 농업 무역에 대한 관세를 철폐하는 문제를 논의하자고 연락해 왔습니다. 이 제안은 최근 오스트레일리아의 가뭄 문제에 대한 마지막 승부수로 보이며, 우리 농산물 수출에 상당한 활력을 줄 수 있지만, 지금까지 우리 설탕과 쇠고기 로비 단체들은 이 거래에 이의를 제기하고 있습니다. \n\n로비스트들은 우리 농민들을 위험에 빠뜨릴 수 있는 거래 조항을 제외해야 한다고 계속 주장하고 있습니다. 즉 관세 인하 품목에서 쇠고기와 설탕을 제외하라는 것입니다. 이는 오스트레일리아에 상당한 타격이 되겠지만, 우리에게 실제로 무슨 선택지가 있겠습니까?"
 us_aus_trade_howrd.1.a: "유리한 조건이다."
 us_aus_trade_howrd.1.b: "설탕과 쇠고기를 제외한다."
 us_aus_trade_howrd.2.t: "미국, 농업 협약에 동의"
 us_aus_trade_howrd.2.d: "아무런 이견 없이 미국은 양국 간 농기계와 농산물 관세를 철폐하는 데 동의했고, 이로써 우리 농민들이 뛰어들 수 있는 새롭고 풍성한 시장이 열렸습니다. 이 거래는 양국의 무역 구도를 바꿔 놓았을 뿐 아니라 더욱 긴밀한 경제적 유대의 씨앗을 뿌렸습니다."
 us_aus_trade_howrd.2.a: "우정을 위하여!"
 us_aus_trade_howrd.3.t: "미국과의 무역 협상 냉각"
 us_aus_trade_howrd.3.d: "무역 협상에서 어떤 진전을 이루려던 노력도 빈손으로 끝난 듯합니다. 미국은 관세 변경에 꿈쩍도 하지 않고 있으며, 우리는 다소 찬밥 신세가 되었습니다."
 us_aus_trade_howrd.3.a: "예상치 못한 침체다."
 trip_to_malaysia_ast.1.t: "말레이시아의 방문"
 trip_to_malaysia_ast.1.d: "말레이시아 통상산업부 장관 라피다 아지즈가 현행 육류 수출 조약의 부속 합의안을 들고 우리를 찾아왔습니다. 새 거래는 우리가 몇몇 세금과 규제를 완화해 주는 대가로 수출 계약을 제공합니다. 탄탄한 제안이지만, 요구 사항이 그들이 훗날 악용할 수 있는 허점이 될 수도 있습니다. 그래도 우리 상품에 유리한 가격을 제시합니다."
 trip_to_malaysia_ast.1.a: "물론 친구들을 위해서지!"
 trip_to_malaysia_ast.1.b: "오늘은 아니다."
 internal_talk_liberal.1.t: "동료 간 다툼"
 internal_talk_liberal.1.d: "하워드는 첫 선거 이래 당의 충실한 부대표였던 피터 코스텔로가 늘 자신에게 따질 일이 있다고 느꼈다. 두 사람은 기회만 있으면 충돌하는 듯했지만, 그렇다고 더 나은 결과를 위해 함께 일하는 것을 막지는 못했고, 피터는 지속되는 경제적 호조에 일부 책임이 있었다. 이번에는 이민 문제로 다투고 있었다. 피터는 경제적 이점을 강하게 주장했지만, 하워드는 다문화주의의 '우유부단함'을 우려하여 통합을 고수했다. \n\n국경 순찰을 강화하면 인신매매가 줄어드는 이점도 있었는데, 인신매매는 뉴스에서 화제가 된 쟁점이었다. 반면 피터는 그 발상이 역효과를 낳기 쉽고 결국 예산 낭비에 그칠 것이라고 주장했다. 두 사람 사이에 합의의 기미는 보이지 않았다."
 internal_talk_liberal.1.a: "그래도 결정은 내려야 했다."
 internal_talk_liberal.2.t: "토니의 방문"
 internal_talk_liberal.2.d: "하워드가 당규 변경을 위한 서류 작업에 한창일 때 문 두드리는 소리가 났다. 다음 회의까지 두 시간 정도 여유가 있다는 것을 알고 있었기에, 보건부 장관 토니 애벗이 들어왔을 때는 놀랐다. 부처를 훌륭히 운영하고 이따금 노조 깡패들을 상대해 온 그 사람은 하워드에게 메디케어의 추가 개정안을 내놓았다. 당내 몇몇은 애벗을 당의 광신자로 낙인찍기를 좋아했지만, 하워드는 그렇게 보지 않았다. 그가 보기에 애벗은 국민에게 헌신하는 사람이었다. 어느 모로 보나 민족주의자였다. \n\n의심할 여지 없이 그는 총리가 되려는 야망이 있었지만, 그렇다고 하워드에게 충성을 보이는 것을 멈추지 않았고, 두 사람 사이에는 서로에 대한 존중이 자라났다. 그가 방을 나서자 하워드는 다시 글쓰기로 돌아갔지만 한 가지 생각이 남았다. 어쩌면, 집권한 지난 세월을 거치며, 토니를 좋은 친구로 여겨도 될지 모른다."
 internal_talk_liberal.2.a: "그럼 다시 일하자."
 internal_talk_liberal.3.t: "후계자 선택"
 internal_talk_liberal.3.d: "차기 당 대표를 선택할 때가 되자 하워드는 갈림길에 섰다. 의회에서 그의 숙적은 자신의 부대표 피터 코스텔로인 경우가 너무 잦아 보였다. 다른 정당들과보다 더 자주 충돌했던 것이다. 피터는 늘 그 자리를 노렸고, 당내 나머지 인사들에게 좋은 평판을 얻고 있다는 점도 불리하지 않았다. 경제적으로 독립한 오스트레일리아에 대한 그의 비전은 실로 흥미로웠고, 그가 맡는다면 당이 순조롭게 이어질 것임이 보장되었다. \n\n그러나 다른 사람도 있었다. 토니 애벗은 여러모로 하워드의 제자 같은 존재였지만, 하워드가 한 임기를 더 하기를 완강히 바라왔다. 애벗은 당내에서 일종의 추종자로 여겨지고 다소 한물갔다고 평가받았지만, 존은 그 사람에게서 거의 자신을 떠올리게 하는 신념을 보았다. 애벗은 독립한 오스트레일리아뿐 아니라 더 강한 오스트레일리아를 그렸다. 다음 선거를 앞두고, 이 결정은 당의 흥망을 좌우할 것이었다."
 internal_talk_liberal.3.a: "피터가 당연한 후계자다."
 internal_talk_liberal.3.b: "토니에게는 자질이 있다."
 internal_talk_liberal.3.c: "다시 생각해 보면..."
 internal_talk_liberal.4.t: "하워드, 당 대표직 사임"
 internal_talk_liberal.4.d: "\\"이 아름다운 나라의 [GetASTLeaderTitle]을(를) 지낸 것은 제 평생 매일이 막대한 영광이었으며, 그 영광을 베풀어 준 오스트레일리아 국민께 감사드리고자 합니다. 저는 이를 존중하고 기립니다. 오랜 추구 끝에, 이 나라를 이끈 것은 일생에서 가장 믿기 어려운 경험이었습니다.\\" \n\n\\"저는 자유당에 대한 모든 책임을 지며, 우리가 거둔 성공과 몇 안 되는 패배에 대해서도 그러합니다. 따라서 당 대표직에서 물러납니다. 저를 이 나라를 대표하도록 선출해 주신 베넬롱 시민 여러분과 오스트레일리아 국민께 진심으로 감사드립니다.\\" \n\n\\"고삐를 저의 부대표이자 재무장관인 피터 코스텔로에게 넘기면서 각별한 감사의 빚을 느낍니다. 그는 오스트레일리아 경제의 훌륭한 관리자였으며, 우리 당의 미래는 피터와 깊이 결부되어 있습니다. 그는 분명 우리의 미래입니다.\\" \n\n\\"저는 이 나라의 평안을 빕니다. 오스트레일리아의 최고의 시절은 앞에 놓여 있다고 깊이 믿습니다.\\""
 internal_talk_liberal.4.a: "새로운 지평을 향해..."
 internal_talk_liberal.5.d: "\\"지난 몇 년간 이 아름다운 나라의 [GetASTLeaderTitle]을(를) 지낸 것은 제 평생 매일이 막대한 영광이었으며, 그 영광을 베풀어 준 오스트레일리아 국민께 감사드리고자 합니다. 저는 이를 존중하고 기립니다. 오랜 추구 끝에, 이 나라를 이끈 것은 일생에서 가장 믿기 어려운 경험이었습니다.\\" \n\n\\"저는 자유당에 대한 모든 책임을 지며, 우리가 거둔 성공과 몇 안 되는 패배에 대해서도 그러합니다. 따라서 당 대표직에서 물러납니다. 저를 이 나라를 대표하도록 선출해 주신 베넬롱 시민 여러분과 오스트레일리아 국민께 진심으로 감사드립니다.\\" \n\n\\"고삐를 차기 대표, 저의 보건부 장관이자 자랑스러운 동료인 토니 애벗에게 넘기면서 각별한 감사의 빚을 느낍니다. 그는 많은 오스트레일리아 국민의 훌륭한 대변자였으며, 우리 당의 미래는 토니와 깊이 결부되어 있습니다. 그는 분명 우리의 미래입니다.\\" \n\n\\"저는 이 나라의 평안을 빕니다. 오스트레일리아의 최고의 시절은 앞에 놓여 있다고 깊이 믿습니다.\\""
 solomon_islands_intervention.5.t: "뒷정리"
 solomon_islands_intervention.5.d: "현지인들이 무더기 쪽으로 걸어와 무기를 또 한 짐 쏟아 놓았다. 대부분 소총이었다. 또 하나의 민병대가 그날 오스트레일리아 제3군에 항복해 장교들에게 끌려가고 있었다. 내일이면 공병 연대가 군중 앞에서 그것들을 파괴하러 올 것이다. 질서가 회복되고 있음을 대중에게 보여 주기 위해 아직 기능하는 경기장 중 한 곳에서 진행될 것이었다. 그 질서가 본국에서 온 것인지 아닌지는 ADF 병사도 알지 못했지만, 그는 무기가 쌓여 가는 것을 계속 지켜보았다. \n\n수십 정씩 덜컥거리며 서로 부딪혔고 무더기는 불어났다. 그와 중대원들은 이 무기들이 나온 집단을 한 달 가까이 추적해 왔으며, 그들은 눈에 띄자마자 항복한 첫 번째 집단이었다. 그가 예상했던 것보다 빨리 사태가 끝나 가는 것처럼 보이기 시작했다. 전투는 잦아들고 있었지만 인근 마을에서조차 불이 들어오는 곳은 거의 없었고, 아픈 사람은 모두 섬 밖으로 공수되고 있었다. 현지인들이 남으려 한다면, 총성이 멎은 뒤에 해야 할 일이 더 많았다. \n\n어깨의 무전기가 지직거리며 켜졌고, 그는 다음 마을로 이동하며 자리를 떴다."
 solomon_islands_intervention.5.a: "다시 일하러."
 a_global_financial_crisis.2.t: "금융 격변"
 a_global_financial_crisis.2.d: "최근 몇 주 사이 대출에 의존하던 중견 기업 여러 곳이 쓰러져 파산을 선언했습니다. 실업 수치에 대한 타격이 부정적 측면 중 하나지만, 조용히 진행되고 있다는 점이 다소 우려스럽습니다. 경기 침체의 기운은 우리 재정 전문가들을 불안하게 하기 시작했고, 이들은 무슨 일이 터지면 즉각 조치에 나설 준비를 해야 한다고 요청하고 있습니다. 그런데 아직 아무 일도 없어서, 우리는 기다려야 하는 어색한 처지에 놓여 있습니다."
 a_global_financial_crisis.2.a: "아무것도 아닌 일로 걱정하지 말자."
 black_saturday_ast.1.t: "검은 토요일"
 black_saturday_ast.1.d: "며칠에 걸쳐 빅토리아 주 전역에서 여러 건의 불길이 수백 건으로 번졌으며, 기록상 최악의 산불의 날로 불리고 있습니다. 전국에서 모인 수천 명의 소방관이 필사적으로 불길을 잡으려 애쓰고 있으나 이미 25명의 목숨을 앗아갔습니다. \n\n오스트레일리아 중부에서 불어온 며칠간의 뜨겁고 건조한 공기가 불이 엄청난 속도로 번지기에 완벽한 조건을 만들었습니다. 이미 광범위한 주택과 토지가 파괴되어 비상사태가 선포되었고, 군 인력이 위험 지역의 주민을 대피시키느라 분주합니다. 그러나 불길이 주립 삼림과 국립공원을 휩쓸며 30미터 높이에 이르는 것으로 기록되는 만큼 할 수 있는 일은 거의 없습니다."
 black_saturday_ast.1.a: "올해는 정말 우리 해가 아닌가 보다."
 black_saturday_ast.2.t: "계속 타오르는 빅토리아 산불"
 black_saturday_ast.2.d: "불길이 잡히지 않으면서 빅토리아 주의 하늘은 몇 주째 검게 남아 있으며 사망자는 173명으로 늘었습니다. 방화선이 확산을 늦추는 데 성공했지만 약 40만 헥타르가 불타 현지 야생동물이 몰살당했습니다. \n\n피해 지역을 오가며 이재민을 방문하고 피해를 보고 눈에 띄게 마음 아파한 [GetASTLeaderTitle]은(는) 이제 집을 잃은 이들에게 위로를 전하기 위해 자리를 지켰습니다. 그 수는 이제 수천 명에 이를 것으로 보입니다. 지친 소방관들은 노력을 이어 가고 있으며, 다음 주에는 호의적인 날씨가 찾아올 것으로 예상됩니다. \n\n빅토리아 주가 수십 년 만에 겪은 가장 어두운 나날이 서서히 끝나 가고 있을지 모르지만, 나라로서는 압도적인 손실을 피하지 못했습니다."
 black_saturday_ast.2.a: "말로 표현할 수 없는 비극이다."
 election_outcomes_ast.1.t: "러드 노동당의 역사적 승리"
 election_outcomes_ast.1.d: "케빈 러드가 노동당을 이끌어 전국적으로 5.7%의 지지율 변동을 얻으며 압승을 거둔 가운데, 자유당 대표 [AST.GetLeader]은(는) 어젯밤 축출되었습니다. 오스트레일리아 역사상 처음으로 노동당이 모든 주와 준주에서 정권을 장악하게 되었습니다. 부대표 줄리아 길라드의 부상 또한 여성이 이 나라의 두 번째로 높은 공직을 맡는 최초의 사례가 됩니다. \n\n연합 대표는 이미 사임했으며, 밤사이 러드에게 전화를 걸어 승리를 축하했습니다. 새 [GetASTLeaderTitle]은(는) 노사 관계 개선, 원주민 권리, 기후 변화에 대한 신속한 대응을 내걸고 선거 운동을 했으며 나라를 새로운 방향으로 이끌겠다는 포부를 승리 연설에서 이렇게 밝혔습니다. \\"오늘 선택은 국민에게 맡겨졌고, 오스트레일리아는 미래를 바라보았습니다.\\""
 election_outcomes_ast.1.a: "그리고 미래는 지금이다."
 election_outcomes_ast.2.t: "연합의 이변 승리"
 election_outcomes_ast.2.d: "노동당 승리 예측은 연합이 연속 또 한 번의 임기를 향해 포효하며 앞서 나가면서 무너졌습니다. [GetASTLeaderTitle] [AST.GetLeader]은(는) 이번 결과를 침묵하는 다수의 승리라 평가했으며, 연설에서 추가적인 경제 투자 계획을 설명했습니다. 연합이 계속 집권하겠지만, 노동당은 거의 모든 주와 준주에서 전국적으로 상당한 의석을 늘려 현 정부는 근소한 과반수만 남게 되었습니다. \n\n케빈 러드는 [GetASTLeaderTitle]에게 전화를 걸어 승리를 축하한 것으로 알려졌으며, 오늘 밤 늦게 패배에 대해 입장을 밝힐 것으로 예상됩니다. 연합은 이제 나라를 이끌 책임을 안고 앞서 나가면서도, 이 당에 대한 국민의 되살아난 신뢰를 이어 가야 합니다."
 election_outcomes_ast.2.a: "순조롭게 간다!"
 a_global_financial_crisis.3.t: "가라앉는 위기의 여파"
 a_global_financial_crisis.3.d: "금융 위기의 잔여 여파는 최근 몇 주 사이 거의 사라졌습니다. 경제는 대체로 이전 수준으로 정상화되었고, 우리의 노력을 지지하는 여론이 높아졌습니다. 위기에 대한 우리의 대응이 결국 성과를 거두었으며, 향후 이러한 경제적 호우에도 우리 경제가 더 탄력적으로 버티게 해 준 것으로 보입니다."
 a_global_financial_crisis.3.a: "다시 영업 재개다."
 turnbull_letter_ast.1.t: "턴불의 서한"
 turnbull_letter_ast.1.d: "현 자유당 대표 맬컴 턴불이 우리 정부의 부패를 입증하는 이메일을 가지고 있다고 주장하며 우리 정부에 반기를 들고 나왔습니다. 서한에 정확히 무엇이 담겨 있는지는 추측할 수밖에 없으나, 언론이 이를 보도하도록 설득할 만큼 나쁜 내용인 것으로 보입니다. 우리 측 인사들은 턴불의 정보원이 정부 내부에서 나왔다고 주장하며, 이는 당 안에 첩자가 있을 수 있음을 의미합니다. \n\n맬컴 턴불은 앞으로 몇 주 안에 의회에 서한을 공개할 것으로 예상됩니다. 지금으로서는 피해가 너무 심하지 않기를 바라며 손가락을 꼽고 기다릴 수밖에 없습니다."
 turnbull_letter_ast.1.a: "우리가 뭘 했다고?"
 turnbull_letter_ast.2.t: "가짜 서한"
 turnbull_letter_ast.2.d: "맬컴 턴불의 악명 높은 이메일은 가짜에 불과한 것으로 밝혀졌습니다. 해당 주장에 대한 국가 감사 과정에서 턴불의 정보원 본인이 모든 것을 지어냈다고 시인했습니다. 당내 첩자였던 고드윈 그레크는 영향력을 얻으려고 턴불에게 가짜 정보를 흘렸습니다. 그 반발로 턴불의 지지율은 사실상 곤두박질쳤고 자유당은 서로 다투는 혼란에 빠졌습니다. 한편 우리의 여론 조사 지지율은 다시 올랐으며, 그레크는 즉시 당에서 쫓겨났습니다."
 turnbull_letter_ast.2.a: "우리는 한순간도 믿지 않았다!"
 oceanic_viking_ast.1.t: "오셔닉 바이킹호 딜레마"
 oceanic_viking_ast.1.d: "현재 국경 보호 활동에 투입된 우리 해상 선박 중 한 척이 오스트레일리아 입국을 시도하던 스리랑카 망명 신청자 78명을 붙잡은 것으로 보입니다. 이들이 승선한 뒤 현행 정책에 따라 처리를 위해 인도네시아 빈탄 섬으로 이송되었으나, 이제 와서 일종의 항의로 하선을 거부하고 있습니다. \n\n올해만 49번째 선박 차단이며, 늘 그렇듯 언론이 몰려들고 있습니다. 지금까지 오셔닉 바이킹호 승무원들은 이들을 내보내는 데 실패했고, 그 상태가 길어질수록 우리 모양새는 나빠집니다. 야당은 이미 이를 불법 이민에 약한 우리 모습으로 그리는 데 이용하고 있으며, 승선한 망명 신청자 몇 명은 치료가 필요한 것으로 보입니다. \n\n우리는 협상하거나 강제로 내보낼 수 있습니다."
 oceanic_viking_ast.1.a: "우선 처리를 허용한다."
 oceanic_viking_ast.1.b: "병력을 투입한다."
 oceanic_viking_ast.2.t: "확산되는 반이민 시위"
 oceanic_viking_ast.2.d: "오셔닉 바이킹호 사태의 결과를 두고 주요 도시 대부분에서 시위가 일어났으며, 대개 우익 정치 인사들이 부추겼습니다. 특히 원 네이션당은 이번 조치를 매우 공개적으로 비판했고 그 수위는 야당보다도 더 공격적이었으며, 규모가 작음에도 온라인에서 눈에 띄는 주목을 받고 있습니다. \n\n논쟁적인 수사로 경력을 쌓아 온 전 당 대표 폴린 핸슨은 퀸즐랜드의 집회에서 우리 정부를 \\"반오스트레일리아적\\"이라고 규정하며 맹비난했습니다. 이에 맞서 반대 시위도 불붙었으나 규모는 더 작았고, 여러 건의 충돌로 이어졌습니다."
 oceanic_viking_ast.2.a: "다들 좀 진정하면 안 되나?"
 oceanic_viking_ast.3.t: "작전상의 불상사"
 oceanic_viking_ast.3.d: "우리의 지시대로 SAS가 소집되어 망명 신청자들을 선박에서 강제로 끌어내렸습니다. 그 사건에 이르기까지 우리의 작전 정보가 제한적이었던 것으로 보입니다. 우리 부대가 선박에 올랐을 때 스리랑카 이주민 중 한 명이 권총으로 무장한 것을 발견했고, 그들 사이에 총격전이 벌어졌습니다. 다행히 우리 병사는 한 명만 부상했으나, 선상의 이주민 4명이 사망하고 2명이 부상했습니다. 나머지는 성공적으로 끌려 나와 빈탄 수용소로 이송되었습니다. \n\n이에 대응해 국제연합 회의가 소집되었으며, 예상대로 반발은 상당히 심각합니다. 주요 도시 대부분에서 시위가 터져 나왔고 이는 다시 맞불 시위를 촉발했습니다. 그나마 다행이라면 야당이 비교적 조용히 있다는 점입니다."
 oceanic_viking_ast.3.a: "어떻게 이런 일이 일어날 수 있나?"
 great_barrier_reef.1.t: "그레이트 배리어 리프 기름 유출"
 great_barrier_reef.1.d: "중국 석탄 벌크 운반선이 퀸즐랜드 중부 록햄프턴 동쪽에서 좌초했습니다. 이 선박은 암초에 부딪쳤을 때 항로에서 10km 넘게 벗어나 있었으며, 멈추기 전까지 상당한 거리를 긁으며 나아갔고 2해리가 넘는 구간에 중유가 유출되었습니다. \n\n지금까지 선박을 이동시키기 위해 예인선이 파견되었으나, 거친 바다에서 선박이 부서질 수 있다는 우려가 있습니다. 유네스코와 우리 암초 관리자들은 선박이 항로에서 그토록 멀리 벗어났고 주변 지역이 오염되었을 수 있다는 점에 격분하고 있습니다. 피해를 최소화하기 위해 이들과 협력하고 있지만 느린 과정입니다."
 great_barrier_reef.1.a: "매우 불행한 일이다."
 ast_elections.3.t: "선거일"
 ast_elections.3.d: "가판대는 정리되고 광고는 잦아들고 있으며 정당 본부는 비상 경계 태세입니다. 선거 운동 기간이 끝났고 투표소는 선거일에 대비해 설치되었습니다. 전국의 오스트레일리아 국민이 곧 모여 국회의사당의 미래를 위해 투표할 것이며, 이제 우리의 차기 지도자에 대한 결정은 그들의 손에 달려 있습니다."
 ast_elections.3.a: "최고의 후보가 승리하기를."
 dissolution_election_rudd.3.t: "러드의 대승"
 dissolution_election_rudd.3.d: "노동당 본부의 당원들은 1993년 이후 처음으로 연속 승리를 거둔 케빈 러드의 승리를 자축하고 있으며, 이는 [GetASTLeaderTitle]의 많은 지지자의 희망을 확인해 주었습니다. 노동당이 돌아왔습니다. \n\n수개월간 개혁 지속을 내걸고 선거 운동을 한 끝에, 결과는 러드의 위임을 확인해 주었습니다. 노동당은 다수의 신규 의원 덕분에 앞으로 몇 주 안에 구성될 것으로 예상되는 과반수 정부를 이루게 됩니다. 퀸즐랜드 주 거의 전체가 붉게 물들었습니다. \n\n선거 결과는 또한 녹색당에 두 석을 더 안겨 주었으며, 이는 기후 대책에 대한 국민적 지지가 커지고 있음을 나타냅니다."
 dissolution_election_rudd.3.a: "다시 일하러."
 dissolution_election_rudd.4.t: "토니 애벗의 순항 승리"
 dissolution_election_rudd.4.d: "자유당이 이 나라 역사상 가장 박빙의 선거 중 하나에서 승리를 쟁취하자, 포시즌스 호텔의 만원 홀 안에서 군중이 \\"토니, 토니, 토니\\"를 외쳤습니다. \\"보트를 막겠다\\"는 공약과 함께 불같은 수사로 선거 운동을 이끈 보수 지도자는 정부의 키를 잡게 되어 \\"겸허한 마음\\"이라고 밝혔습니다. \\"오늘부터 오스트레일리아는 새 경영진 아래 있으며, 오스트레일리아는 다시 한번 영업을 개시했음을 선언합니다.\\" \n\n기후 문제에 비판적인 애벗은 여론의 방향에 강하게 반대하는 입장으로 선거 운동 중 주목을 끌었으나, 유권자들은 결정을 내렸습니다. 노동당이 짐을 싸고 자유당이 다시 한번 자리를 잡으면서, 이민과 재정 보수주의에 대한 강경한 입장이 뒤따를 것으로 예상됩니다."
 dissolution_election_rudd.4.a: "자유당이 돌아왔다!"
 ast_elections.1.t: "선거 전격전"
 ast_elections.1.d: "선거철이 다가왔고 선거 운동의 시간이 시작되었습니다. 선거법에 따라 우리가 메시지를 전달할 시간은 8주뿐입니다. 언론을 도배하든, 전국을 순회하든, 야당과 토론하든, 시계는 째깍거리고 있습니다. 승리를 기대한다면 밖으로 나가 분주히 움직여야 합니다. \n\n(선거 행동은 결정 탭에서 이용할 수 있습니다)"
 ast_elections.1.a: "자유당과 함께 순조롭게!"
 ast_elections.1.b: "노동당과 함께 공정한 기회를!"
 ast_elections.1.c: "원 네이션과 함께 오스트레일리아 우선!"
 ast_elections.1.e: "녹색당과 함께 변화를 위해 싸우자!"
 special_gillard_election.1.t: "새 선거 소집"
 special_gillard_election.1.d: "우리 새 정부의 정당성을 확정하는 유일한 방법은 새 총선입니다. 표를 모아 다음 임기를 확보할 수 있다면, 계속 이끌어 나가는 데 필요한 위임을 얻을 수 있으며, 법안을 통과시키는 동안 야당에게서 받을 반발도 잠재적으로 줄일 수 있습니다. 어떤 선거든 위험은 따르므로, 앞으로 60일간 분주히 움직여야 합니다."
 special_gillard_election.1.a: "앞으로, 그리고 위로."
 election_outcomes_ast.5.t: "개표 결과 균형 의회!"
 election_outcomes_ast.5.d: "1940년 이래 일어나지 않았던 선거의 이변으로, 어느 정당도 확실한 승자가 되지 못했습니다. 연합과 노동당은 개표에서 각각 72석을 얻어 정부를 구성하기에 4석이 모자랍니다. 이는 밤중에 어색한 결말로 이어졌는데, 두 후보가 모두 무대에 올라 결과가 집계되었음에도 선거가 끝나지 않았다고 선언한 것입니다. \n\n앞으로 며칠간 정당들은 하원에서 겨루고 나머지 의원들과 협상하여 정부를 확보해야 합니다."
 election_outcomes_ast.5.a: "분열된 국가."
 election_outcomes_ast.4.t: "러드 정부의 또 한 번의 승리"
 election_outcomes_ast.4.d: "노동당의 선거 승리 결과가 들어오자 어젯밤 군중이 시드니 거리를 거닐었습니다. 또 한 번의 임기 동안 강력한 정책을 펼친 끝에 케빈 러드는 득표율 48%로 다시 한번 대중의 호의를 얻었으며, 퀸즐랜드의 연합 의석 여러 곳을 확보하고 보웬 분지 일대의 친광업 아성을 꿰뚫었습니다. \n\n러드는 세 번째 승리를 축하하기 위해 가족과 함께 개바 크리켓 경기장에서 승리 소감을 밝혔습니다. \n\n\\"저희 가족은 공직 생활에서 모든 것을 바쳤고, 제 선거 운동을 위해서도 모든 것을 바쳤습니다. 앞으로 며칠은 테레즈와 함께, 아이들과도 함께 보낼 것이며, 그 후에는 다시 일에 복귀합니다. 쇼는 아직 끝나지 않았습니다.\\""
 election_outcomes_ast.4.a: "그리고 좋은 시절은 계속된다."
 election_outcomes_ast.6.t: "길라드, 또 한 번의 임기 확보"
 election_outcomes_ast.6.d: "오스트레일리아 최초의 여성 [GetASTLeaderTitle]이(가) 초기 여론조사를 뒤엎고 다시 한번 대중의 지지를 얻어 소수 정부를 구성하게 되었습니다. 길라드는 멜버른 컨벤션 앤 엑시비션 센터에서 지지자들에게 감사를 전하며, 재정적으로 책임 있는 리더십을 위한 계획과 보건 의료의 추가 개혁 방안을 설명했습니다. \n\n야당 대표 토니 애벗은 결과가 나온 직후 길라드에게 전화를 걸어 승리를 축하했습니다. 또 한 번 패배한 애벗은 당 지도부에서 물러날 것으로 예상되며, 이는 당을 우경화하려던 시도의 실패에 비추어 당 정책의 변화를 예고합니다."
 election_outcomes_ast.6.a: "합리적인 정책의 승리."
 new_governor_general_ast.1.t: "신임 총독"
 new_governor_general_ast.1.d: "우리나라 역사상 처음으로 여성이 신임 총독으로 취임 선서를 했습니다. 전직 변호사이자 퀸즐랜드 주 총독이었던 65세의 퀜틴 브라이스는 오스트레일리아의 제25대 총독이며, 107년 만에 이 직책을 맡은 첫 여성이 되었습니다. \n\n캔버라 국회의사당에서 열린 의식에서 브라이스는 밖에서 21발의 예포가 발사되는 가운데 여왕에 대한 충성 서약을 했습니다. \n\n\\"저는 엄숙함, 공정함, 에너지, 그리고 우리가 함께하는 이 나라에 대한 깊은 사랑으로 이 직책을 맡는다는 것을 여러분이 알아주셨으면 합니다.\\"라고 그녀는 말했습니다. \\"저는 오스트레일리아 사회의 현대적 사고와 활동에 개방적이고 호응하며 충실할 것을 약속합니다.\\""
 new_governor_general_ast.1.a: "시대가 정말 변하고 있다."
 indo_cattle_drama.1.t: "인도네시아 소 수출 딜레마"
 indo_cattle_drama.1.d: "ABC가 최근 인도네시아 소 산업의 구조적 잔혹성을 폭로한 '포 코너스' 프로그램을 방영했습니다. 영상은 상당히 적나라하며, 인도네시아로의 소 수출을 즉각 중단하라는 대규모 여론의 항의가 일고 있습니다. 그들이 새로운 규제 체계에 동의할 때까지 생우 수출을 중단할 수 있지만, 이 금지 조치는 북부 지역 우리 농장에 재정적 타격을 입힐 것입니다."
 indo_cattle_drama.1.a: "수출을 중단한다."
 indo_cattle_drama.1.b: "그럴 가치가 없다."
 malaysia_solution_ast.1.t: "말레이시아 해법"
 malaysia_solution_ast.1.d: "현재 우리 이민자 수용소의 낙후된 상태를 고려하여, 말레이시아가 우리가 수용 중인 망명 신청자 800명을 그들에게 넘기는 대신 심사를 마친 난민 4,000명을 받아들이겠다는 제안을 해 왔습니다. 이는 당면한 수용 문제를 해결하고 일부 여론의 불만을 달랠 수 있지만, 말레이시아는 유엔 난민 협약의 서명국이 아니므로 거래 전체가 법적으로 의심스럽습니다."
 malaysia_solution_ast.1.a: "합의하겠다."
 malaysia_solution_ast.1.b: "법적으로 타당하지 않다."
 malaysia_solution_ast.2.t: "고등법원, 말레이시아 거래 차단"
 malaysia_solution_ast.2.d: "안타깝게도 오스트레일리아 고등법원은 이 교환이 이민법에 따라 불법이라고 판결하고 이송을 차단했습니다. 즉각적인 반응은 야당의 쏟아지는 비난이었고, 오히려 대중의 반응은 지금 더 나빠졌을 뿐입니다. 이민자 수용 문제를 해결하기 위한 다른 방법을 모색하는 것을 고려해야 할지도 모릅니다."
 malaysia_solution_ast.2.a: "그리 쉽지 않다."
 embassy_tent_protests.1.t: "대사관 천막 시위"
 embassy_tent_protests.1.d: "1972년 의회 밖에서 원주민 권리를 지지하며 점거 시위를 벌인 원주민 천막 대사관 40주년을 기념하여, 현장 인근의 로비 레스토랑에서 시상식이 열리고 있습니다. 현장에 모여 있던 시위대 한 무리가 레스토랑 쪽으로 이동한 모양입니다. 무언가가 그들을 자극한 듯 일부는 창문을 두드리기 시작하기까지 했습니다. \n\n행사에 [GetASTLeaderTitle]과(와) 야당 대표가 참석 중이므로, 경호팀은 인근 헬리콥터를 이용해 즉시 행사장에서 대피할 것을 권고했습니다. 군중은 꽤 거칠어 보이지만, 대화를 시작하면 상황이 가라앉을 수도 있습니다."
 embassy_tent_protests.1.a: "여기서 나를 빼내라!"
 embassy_tent_protests.1.b: "군중과 이야기해 보자."
 embassy_tent_protests.2.t: "부상당한 [GetASTLeaderTitle]"
 embassy_tent_protests.2.d: "길라드를 호위하던 경호원들이 군중 속에 틈을 만들어 그녀가 나가서 그들과 이야기할 수 있게 하자 경호의 악몽이 펼쳐졌습니다. 그렇게 한 지 불과 1분 뒤 시위대 중 한 명이 던진 물체가 [GetASTLeaderTitle]에게 맞아 그녀를 바닥에 쓰러뜨리고 눈을 다치게 했습니다. 경찰과 경호원들이 군중을 덮쳤고 줄리아 길라드는 행사장에서 대피했으나, 병원에 다녀온 뒤 오른쪽 눈의 손상이 영구적인 것으로 보입니다. \n\n야당 대표 토니 애벗은 의회에서 잠시 [GetASTLeaderTitle]의 용기를 칭찬하고 이번 공격을 규탄했습니다."
 embassy_tent_protests.2.a: "오, 안 돼..."
 embassy_tent_protests.3.t: "군중 진정시키기"
 embassy_tent_protests.3.d: "러드가 천막을 나서자 다행히 아무 문제도 생기지 않았고, 그가 사람들과 어울리기 시작하자 군중은 잠잠해진 듯했습니다. 소동의 불씨는 토니 애벗의 발언이었던 것으로 보이며, 야당 대표가 대피한 뒤 긴장은 가라앉았습니다. \n\n[GetASTLeaderTitle]은(는) 인근의 군중 및 기자들과 한 시간을 보낸 뒤 행사로 돌아갔습니다. 좋은 홍보 효과를 거두었습니다."
 embassy_tent_protests.3.a: "이렇게 하는 거다."
 embassy_tent_protests.4.t: "시위대와의 몸싸움"
 embassy_tent_protests.4.d: "경호팀이 군중 속에 틈을 만들어 토니가 천막을 나서 시위대와 이야기할 수 있게 하자, 술에 취한 듯한 시위자 한 명이 그에게 달려들었고 이에 [GetASTLeaderTitle]이(가) 주먹으로 맞받아쳤습니다. 시위자는 큰 부상을 입지 않았고 애벗이 자신을 방어한 것이 분명하지만, 안에 있던 기자들이 필요한 사진을 모두 찍어 갔으며, 이제 [GetASTLeaderTitle]이(가) 말 그대로 시위대와 싸우고 있는 것으로 보입니다."
 muslim_protests_sydney.1.t: "시드니에서 이슬람 폭동 발생"
 muslim_protests_sydney.1.d: "중동에서 런던에 이르는 일련의 대규모 시위에서, 무슬림들은 논란이 된 영화 \\"무슬림의 순수\\"의 공개에 분노하며 행진했습니다. 시드니도 예외가 아니어서 시위가 중심 상업 지구까지 번졌습니다. 150명이 넘는 경찰관이 시위에 투입되었으며, 시위가 폭동으로 번지면서 6명이 병원으로 이송되었습니다. \n\n지금까지 8명이 체포되었고, 미국 영사관 밖에서 긴장된 충돌이 벌어진 뒤 군중이 해산하기 시작했습니다."
 muslim_protests_sydney.1.a: "여기는 극단주의가 설 곳이 아니다."
 murrawarri_republic_event.1.t: "무라와리 공화국, 독립 선언"
 murrawarri_republic_event.1.d: "무라와리 공화국이라는 이름의 국가가 독립을 선언하는 서한이 우리 의회에 도착했습니다. 서한에는 \\"무라와리 인민 평의회\\"가 뉴사우스웨일스와 퀸즐랜드의 경계에 걸친 영토를 새로운 주권 영토로 주장하며 승인을 요구한다고 명시되어 있습니다. \n\n솔직히 우리 직원들이 지금껏 본 것 중 가장 이상한 일이며, 그들에게는 이러한 요구를 할 법적 근거도, 우리가 응답해야 할 법적 근거도 없는 듯합니다."
 murrawarri_republic_event.1.a: "무라... 뭐라고?"
 shark_attacks_ast.1.t: "상어 공격으로 높아지는 대중의 우려"
 shark_attacks_ast.1.d: "퍼스에서 남쪽으로 약 270킬로미터 떨어진 그레이스타운 인근에서 35세 남성이 상어에게 목숨을 잃었습니다. 6일 뒤에는 코프스 하버 인근에서 또 다른 서퍼인 18세 잭 영이 상어 공격으로 사망했습니다. 갑작스러운 상어 관련 사망 사고의 연속으로 서오스트레일리아 정부는 인기 있는 수영 구역에 들어오는 상어를 사냥하는 보다 공격적인 접근을 약속했습니다. \n\n근래 몇 년간 상어 공격의 위험이 줄어들고 있음에도 불구하고, 서오스트레일리아 정부는 상어 개체 수를 줄이기 위해 항공 순찰과 도태에 2,000만 달러 넘게 썼으며, 해양 생물학자들은 이를 과잉 대응이라며 의문을 제기했습니다."
 shark_attacks_ast.1.a: "우리는 친구지, 먹이가 아니다!"
 election_outcomes_ast.3.t: "노동당, 또 한 번의 임기 확보"
 election_outcomes_ast.3.d: "오스트레일리아 국민이 전국에서 모여 투표하고 나라의 앞날의 방향을 결정했습니다. 이번에 그들은 [AST.GetLeader]의 통치가 계속되도록 선택하여 당에 또 한 번의 임기를 안겼습니다. [GetASTLeaderTitle]은(는) 환호하는 노동당 지지자들에 둘러싸여 바턴 본부에서 선거 연설을 했고, 앞으로 3년간의 지속적인 계획을 설명했습니다."
 election_outcomes_ast.3.a: "좋은 것을 왜 멈추겠는가?"
 election_outcomes_ast.7.t: "자유당, 재선 성공"
 election_outcomes_ast.7.d: "선거 파티가 마무리되고 개표가 끝나 가면서 현직 [AST.GetLeader]이(가) 결정적으로 재선에 성공할 것으로 예상됩니다. 이 정부에 대한 위임은 계속해서 유권자 다수를 사로잡았으며, 전국에서 소폭의 의석을 늘려 상하 양원에서의 입지를 공고히 했습니다. 의회 업무는 평소처럼 소집될 것으로 예상되며 새 임기는 다음 달에 시작됩니다."
 election_outcomes_ast.7.a: "좋은 시절은 계속된다!"
 election_outcomes_ast.9.t: "맬컴 턴불, 간신히 표 대결에서 승리"
 election_outcomes_ast.9.d: "자유당 대표 맬컴 턴불이 연방 선거에서 승리를 선언했으며, 연합은 의회에서 근소한 과반수에 가까워지고 있습니다. \n\n더 기술 관료적인 방향을 수용하는 정부를 세우겠다는 공약으로 선거 운동을 한 끝에, 새 [GetASTLeaderTitle]은(는) 그 약속을 염두에 두고 수락 연설을 했습니다. \n\n\\"우리는 더 경쟁력 있어야 하고, 더 혁신적이어야 하며, 국민 및 산업계와 공통분모를 찾아야 합니다.\\" \n\n턴불 정부는 국가의 증가하는 에너지 수요에 대처하고, 변화하는 기술 부문을 다룰 것으로 예상됩니다."
 election_outcomes_ast.9.a: "더 밝은 방향을 위하여!"
 detention_centres_full.1.t: "수용소 수용 한계 도달"
 detention_centres_full.1.d: "파푸아 뉴기니와 나우루의 수용소가 당초 규모와 성공에도 불구하고 수용 한계에 도달하기 시작하여, 이민자 심사 업무에 병목 현상이 발생하고 있습니다. 현재의 결함을 바로잡기 위해 이미 수용소에 자금이 투입되고 있지만, 문제를 장기적으로 해결하려면 추가적인 개선이나 대안을 모색해야 합니다. 이는 무단 입국자가 수년 만에 최고 수준으로 늘어난 시점에 벌어진 일입니다."
 detention_centres_full.1.a: "영원한 것은 없는가?"
 migration_event_ast.1.t: "무단 이민, 신기록 경신"
 migration_event_ast.1.d: "우리 해안에 상륙하려는 불법 이주민의 수가 지난 몇 달간 급증했습니다. 계속되는 위기 때문이든, 번영하는 우리나라에 대한 선망 때문이든, 이주민들이 먼 곳에서 몰려오고 있으며 상당수가 정식 절차를 건너뛰고 있습니다. 국경 순찰대의 차단 건수는 사상 최고치에 도달했으며, 우리의 작전 역량에 부담이 되기 시작했습니다."
 migration_event_ast.1.a: "힘든 시기다."
 aukus_formed_ast.1.t: "AUKUS 파트너십 가동"
 aukus_formed_ast.1.d: "오스트레일리아, 영국, 미국의 지도자들이 오늘 일찍 워싱턴 D.C.의 국방부 청사에서 만나 3국 동맹 결성을 논의했습니다. 사이버 역량, 인공지능, 공급망 보호가 논의의 일부였던 것으로 알려졌으며, 모두 세 나라 간 외교 및 방위 협력을 심화한다는 목표를 위한 것입니다. \n\n\\"70년 넘게 오스트레일리아, 영국, 미국은 함께 협력해 왔습니다... 오늘 우리는 이 비전에 다시 헌신합니다.\\" \n\n이 파트너십은 세 나라의 현행 동맹에 추가되는 형태로 작동할 것으로 보입니다. [AST.GetLeader]은(는) AUKUS의 첫 번째 목적이 방위 역량 확산을 강화하는 것이라고 밝혔습니다."
 aukus_formed_ast.1.a: "둘이면 친구, 셋이면 파트너십."
 pukpuk_treaty_event.1.t: "역사적인 파푸아 뉴기니-오스트레일리아 조약 발효"
 pukpuk_treaty_event.1.d: "파푸아 뉴기니와 오스트레일리아 간의 획기적인 '푹푹 조약'이 확정되었으며, [GetASTLeaderTitle]은(는) 이를 양국 관계의 격상이라 선언하며 \\"이웃으로서, 동료로서, 이제는 동맹으로서\\" 하나가 되었다고 평했습니다. \n\n악어를 뜻하는 현지어에서 이름을 딴 이 조약은 파푸아 뉴기니군을 오스트레일리아 국방군에 통합하는 절차를 시작하며 최대 1만 명의 파푸아 뉴기니 국민이 복무할 수 있게 합니다. 또한 양국은 어느 한쪽이 공격을 받을 경우 서로를 지원할 것을 약속합니다. 지역 안보의 투사력과 안정에 상당한 이점입니다."
 pukpuk_treaty_event.1.a: "우리의 파트너와 친구들을 위하여!"
 ast_taiwan_recognition.1.t: "오스트레일리아, 중화민국 승인"
 ast_taiwan_recognition.1.d: "초당적 정책의 획기적인 전환으로 [AST.GetLeader]은(는) 대만을 주권을 가진 독립 국가로 공식 승인했습니다. 이는 1971년 고프 휘틀럼의 방문 이래 이 나라가 중국 본토 입장에서 벗어나 취한 최초의 전환입니다. 인도·태평양 지역의 \\"평화를 위한 동력\\"의 일환으로, [GetASTLeaderTitle]은(는) 이번 승인이 두 개의 중국이라는 개념을 추진하는 가운데 \\"현실에 대한 인정\\"으로 이루어졌다고 언급했습니다. \n\n중국의 반응은 신속하고 신랄했습니다. 중국 장관들은 온라인에서 오스트레일리아를 \\"표리부동한 국가\\"라고 맹비난했으며, 외교부는 즉시 양국 간 무역에 대한 일련의 제한 조치를 도입하기 시작했는데 이는 전면 금수 조치에 불과 한 끗 모자란 수준입니다."
 ast_taiwan_recognition.1.a: "진정한 친구다."
 howard_rumblings_in_dark.1.t: "당내의 웅성거림"
 howard_rumblings_in_dark.1.d: "자유당에는 언제나 어느 정도의 호전성이 있었고, 논란이 생기면 그것이 표면으로 끓어오르는 것을 종종 볼 수 있었다. 하워드는 동료와 불만 가득한 동료의 유일한 차이가 좋은 지지율이라는 것을 알고 있었고, 최근 지지율은 비참하게 떨어져 있었다. 뒷문의 불평이 어느새 신문에까지 기어올랐지만, 타블로이드가 없더라도 비판은 들려왔다. \n\n일부는 하워드가 단지 너무 늙었다고 했고, 다른 이들은 그가 \\"시대에 뒤떨어졌다\\"고 했다. 그는 그 생각과는 정반대로 자신이 막후의 음모를 아주 잘 알고 있다는 것을 알았다. 그의 부대표인 피터 코스텔로는 이미 다음 지도부 투표를 위해 움직이고 있었다. 거래를 따내고 표를 끌어모으고 있었고, 하워드가 상황을 자기 뜻대로 돌리지 못하면 총리직에서 밀려나고 코스텔로가 들어서게 될 것이었다. 당 정치의 본질이 그러했다."
 howard_rumblings_in_dark.1.a: "이를 바로잡아야 한다."
 howard_rumblings_in_dark.2.t: "내각의 배신"
 howard_rumblings_in_dark.2.d: "갑작스러운 일은 아니었지만, 그가 소식을 들은 것은 이른 아침 시간이었다. 진흙탕으로 끌려다니고 지도부 투표까지 그 오물을 뒤집어쓰기보다, 하워드는 자신의 방식대로 떠나기로 했다. 그는 당을 벼랑 끝에서 되살렸는데, 이제 그들은 그를 내쫓고 있었다. \n\n\\"지난 몇 년간 이 아름다운 나라의 [GetASTLeaderTitle]을(를) 지낸 것은 제 평생 매일이 막대한 영광이었으며, 그 기간 동안 오스트레일리아 국민께서 제게 베풀어 주신 영광에 감사드리고자 합니다. 저는 이를 존중하고 기립니다. 오랜 추구 끝에, 이 나라를 이끈 것은 일생에서 가장 믿기 어려운 경험이었습니다.\\" \n\n\\"저를 복무하도록 허락해 주신 오스트레일리아 국민께 감사드립니다. 저는 자유당에 대한 모든 책임을 지며, 우리가 거둔 성공과 패배에 대해서도 그러합니다. 당에서 자리를 잃는 것은 쉬운 일이 아닙니다. 그러나 당이 제게 빚진 것보다 제가 당에 진 빚이 더 큽니다.\\" \n\n그는 짧은 손짓으로 마무리한 뒤 베넬롱으로 돌아갔다. 더 푸른 초원으로..."
 howard_rumblings_in_dark.2.a: "그래도 아렸다."
 abbott_gov_event.1.t: "애벗 정부, 남성 위주의 내각 공개"
 abbott_gov_event.1.d: "[GetASTLeaderTitle] 당선인 토니 애벗은 하워드 정부 출신 베테랑 15명이 포함된 경험 중심의 내각을 공개했으나, 여성 대표성은 미흡하여 19명 규모의 내각에서 부[GetASTLeaderTitle] 줄리 비숍이 유일한 여성입니다. \n\n애벗은 내각에 \\"최소한 두 명\\"의 여성이 없어서 실망했다고 말하면서도, 시간이 지나면 여성이 승진할 것으로 기대한다며, 외곽 장관급의 \\"훌륭하고 재능 있는\\" 여성들이 내각의 문을 \\"두드리고 있다\\"고 밝혔습니다. 다만 외곽 장관급 11명 중 여성은 4명에 불과합니다. \n\n이 불균형은 야당들의 수많은 비판을 불렀으나, 애벗은 \\"더 큰 문제들\\"을 다뤄야 한다며 재빨리 일축했습니다."
 abbott_gov_event.1.a: "어쨌든 능력주의다."
 abbott_gov_event.2.t: "오스트레일리아, 원주민 인정에 \\"찬성\\" 투표"
 abbott_gov_event.2.d: "전국 투표에서 74%의 찬성을 얻어, 애벗 정부의 새로운 원주민 인정 방식의 일환으로 오스트레일리아 원주민과 토러스 해협 섬 주민이 헌법에 명문화됩니다. 국민투표를 앞두고 열린 연례 문화 축제 가르마에서 애벗은 \\"원주민 인정은 우리 헌법을 바꾸는 것이 아니라 완성하는 것\\"이라고 언급하며 이 개정을 많은 이들에게 치유의 순간이라고 설명했습니다. \n\n결과가 나온 뒤 애벗은 원주민 공동체에서 일주일을 보내겠다는 계획도 거듭 밝혔습니다. \n\n\\"이곳들이 최초의 오스트레일리아인들의 고향이라면, 우리나라 [GetASTLeaderTitle]의 고향이 되지 못할 이유가 무엇입니까?\\""
 abbott_gov_event.2.a: "맞는 말이다."
 abbott_gov_event.3.t: "양파 사건"
 abbott_gov_event.3.d: "토니 애벗은 농업 사업의 일환으로 태즈메이니아 시골 지역에 내려가 현지 농민들을 만났다. 토니가 악수를 나누고 농민 중 한 명과 함께 짧은 연설을 하는 동안 기자들이 천막 주위에 모여 있었다. \n\n그의 앞에는 농산물이 가득 담긴 네모난 바구니가 있었고, 하나같이 먹음직스럽게 잘 익어 윤기가 났다. 농민이 기자들에게 사업을 설명하는 동안, 애벗의 마음은 양파에 가 있었다. \n\n농민들에 대한 헌신을 보여 주지 않으면 기자들이 그가 정말로 헌신적이라고 믿어 줄까? 오스트레일리아 농산물이 정말로 세계 최고라는 것을 그들이 어떻게 알 수 있겠는가? \n\n그가 양파를 내려다보는 순간 옆에서 누군가 야유를 던지기 시작했다. \\"원하면 지금 한입 베어 물어 보시죠!\\" \n\n정말 그런 말을 했을까, 아니면 토니 자신의 생각이 그를 부추긴 것일까? 정신을 차렸을 때는 양파가 이미 손에 들려 있었다. 카메라가 번쩍였고 몇몇 야유가 터져 나오는 가운데, 그는 생양파를 한입 베어 물었다. 농민은 믿을 수 없다는 듯 돌아섰고, 토니는 고개를 끄덕이려 잠시 멈췄다가 또 한입을 물었다. \\"아주 좋군요\\"가 그가 짜낼 수 있는 전부였고, 그는 토니가 계속 씹어 먹는 모습을 지켜보았다."
 abbott_gov_event.3.a: "그는 왜 그랬을까?"
 abbott_gov_event.4.t: "워크어바웃 떠나기"
 abbott_gov_event.4.d: "방충망과 끊임없는 살충제 분무에도 불구하고 모기 한 마리가 또 텐트 안으로 들어왔다. 너무 어두워서 그것을 찾을 수 없었기에 그는 최대한 무시하려 했다. 그는 외진 노던 준주의 아넘랜드에서 현지 지도자들과 함께 한 주의 절반 이상을 보내고 있었고, 침대 옆 노트북이 끊임없이 재잘대는 것을 제외하면 지금까지의 경험은 매우 평화로웠다. \n\n이튿날에는 평소처럼 의식과 구마지 부족 지도자와의 일대일 면담이 있었다. 지도자는 리오 틴토로부터 받은 제안, 즉 인근에 새 보크사이트 광산을 열겠다는 안을 논의하는 데 매우 열심이었다. 이전에도 이 지역에서 시추한 적이 있었지만 새 광산은 신성한 땅에 들어서게 되므로 [GetASTLeaderTitle]이(가) 승인해야 했다. \n\n부족 지도자는 로열티의 75퍼센트를 받게 되며, 리오 틴토는 이 사업이 구마지 부족에게 \\"광업에서의 성공적인 경력\\"을 가져다줄 것이라고 주장했다. 리오가 욜뉴족 땅에서 채굴해 온 그 모든 세월 동안 자격을 갖춘 원주민 견습생은 단 한 명밖에 배출되지 않았음을 고려하면 의심스러운 일이다."
 abbott_gov_event.4.a: "광산을 승인한다."
 abbott_gov_event.4.b: "신성한 땅이다."
 abbott_gov_event.5.t: "교육과정의 실수"
 abbott_gov_event.5.d: "토니 애벗은 얼마 전 선거 운동을 했던 바로 그 만원의 방 앞 연단에 섰다. 그의 뒤에는 자유당 현수막과, 그가 반드시 걸어야 한다고 고집한 오스트레일리아 국기가 걸려 있었다. 그는 통상적인 인사말로 시작한 뒤 현 교육 제도의 부족한 점을 파고들었다. 토니는 아마도 무언가를 맹공격할 때 가장 편안해 보였다. 그것이 그를 훌륭한 야당 대표로 만든 이유였고, 이제 그는 자신의 교육과정 개혁을 설득하려 하고 있었다. \n\n그의 말솜씨가 청중을 사로잡고 있음은 의심할 여지가 없었지만, 연설이 이어지면서 가장 불행한 일이 벌어졌다. \n\n\\"아무리 똑똑하고, 아무리 교육을 잘 받고, 아무리 경험이 많더라도... 그 누구도 모든 지혜의 좌약(suppository)이 아닙니다.\\" \n\n몇몇 웃음이 터져 나오는 가운데 애벗은 '저장소(repository)'라는 단어를 의료용 직장 투약 도구의 이름과 혼동했음을 천천히 깨달았다. 그는 더 이상의 문제 없이 연설을 이어 갔지만, 다음 날이 되자 그 작은 실수가 모든 신문 1면을 뒤덮었다."
 abbott_gov_event.5.a: "발음이 비슷하긴 하다..."
 abbott_gov_event.6.t: "위원회 결과"
 abbott_gov_event.6.d: "감사 결과 우리의 지출 전반에 대한 광범위한 검토가 이루어졌으며, 지출을 줄이기 위한 상당히 급진적인 청사진이 제시되었습니다. 연금, 공공 보건 의료, 교육, 실업 수당 삭감이 모두 포함되어 있습니다. 전체 제안을 그대로 추진하면 대중의 반발이 너무 커서 회복하지 못할 수도 있지만, 예산에는 분명 막대한 도움이 될 것입니다. 그렇지 않다면 수위를 낮춰 유권자에게 더 받아들여지기 쉬운 안을 내놓을 수 있습니다."
 abbott_gov_event.6.a: "수위를 낮춘다."
 abbott_gov_event.6.b: "끝까지 간다."
 malcolm_abbott_event.1.t: "맬컴의 방문"
 malcolm_abbott_event.1.d: "통신부 장관 맬컴 턴불이 우리 정책 방향에 관해 조용히 찾아와, 비용 삭감을 계속하면 심각한 파장이 있을 것이라고 경고했습니다. 그가 말하는 것이 특히 당내 반응인지 대중의 인식인지는 불분명하지만, 맬컴은 연극적인 행동에 소질이 있습니다. 이번 일도 그의 과잉 반응 중 하나일 수 있으며, 그는 이전에도 우리의 재정 긴축에 공개적으로 반대해 왔습니다."
 malcolm_abbott_event.1.a: "비용 삭감 중단을 공개 발표한다."
 malcolm_abbott_event.1.b: "그가 과잉 반응하는 것이다."
 malcolm_abbott_event.2.t: "애벗의 \\"잔인한 예산\\", 전국적 시위 촉발"
 malcolm_abbott_event.2.d: "수천 명이 정부의 최근 비용 삭감 조치에 항의하는 오스트레일리아 전역의 집회에 참석했습니다. '예산을 깨부수자' 대규모 시위가 거의 모든 주요 도시에서 열렸고, 특히 오스트레일리아 노동조합 협의회가 행진에 참여했습니다. 조 하키 재무장관은 나라가 \\"1970년대의 계급 투쟁 노선으로 표류했다\\"고 말하며 그의 예산은 결과의 평등이 아닌 기회의 평등에 관한 것이라며 삭감을 옹호하려 했습니다. \n\n그럼에도 시위대는 이달 남은 기간 동안 행진을 계속할 계획임을 내비쳤습니다. 가장 최근의 시위는 국회의사당 잔디밭 밖에서 열렸으며, [GetASTLeaderTitle]의 실물보다 큰 인형이 등장했습니다."
 malcolm_abbott_event.2.a: "나는 저렇게 안 생겼다!"
 malcolm_abbott_event.3.t: "지도부 교체 투표"
 malcolm_abbott_event.3.d: "최근의 대중적 반발 이후, 가장 최근 당 회의에서 의원 한 명이 지도부 \\"스필\\" 투표를 제안하여 토니가 대표직을 유지해야 하는지에 대한 새 투표가 진행되었습니다. 아무도 도전할 배짱이 없었으므로, 토니 외의 유일한 후보는 방 안의 빈 의자였습니다. \n\n투표 결과가 나오자 [GetASTLeaderTitle]이(가) 61표로 앞섰으나, 빈 의자에게도 무시할 수 없는 39표가 돌아갔습니다. 당 지지의 하락이 우려할 만한 일임은 분명하며, 상황을 되돌리지 못하면 다음 투표는 훨씬 더 나쁘게 끝날 수 있습니다."
 malcolm_abbott_event.3.a: "아직 시간은 있다."
 abbott_jakarta_event.1.t: "정의로운 싸움"
 abbott_jakarta_event.1.d: "애벗의 생각에 자카르타에 들르는 것은 시작하기에 올바른 장소였다. 인도네시아가 본국에서 지척에 있는, 인구 2억 3천만 명이 넘는 무슬림 다수 국가라는 사실은 많은 오스트레일리아 국민의 머릿속에서 잊혔다. 발리 폭탄 테러 이후로는 매달 또 다른 공격 소식이 들려오는 듯했다. 그는 다음 공격이 본국에 더 가까운 곳에서 일어나지 않을 것이라고 확신할 수 없었고, 그래서 그 생각은 늘 그의 머릿속에 있었다. \n\n토니가 대통령 [IND.GetLeader]와(과) 이야기할 때 그는 이 주제를 꺼냈다. 물론 그곳에서의 목적은 인도네시아 정부가 질색하는 가운데 한동안 추진해 온 오스트레일리아의 평화 유지 작전을 이 나라에서 시행하자는 구상을 설득하는 것이었다. \n\n그 전에는 수십 년간 연성 권력이 상투적 전략이었으며, 교육 프로그램과 기타 지원 패키지로 풍부하게 존재하던 민족 간 긴장을 완화된 수준으로 유지해 왔다. 그것이 근본주의의 위협에 대한 해법이 되기는 어려웠지만 말이다. 기껏해야 토니는 현재의 협력을 지속하고 향후 노력에 문을 열어 두겠다는 인도네시아 정부의 약속만 가지고 돌아왔다."
 abbott_jakarta_event.1.a: "요컨대, 실망스러운 결과다."
 o_canada_abbott.1.t: "오스트레일리아, 광업 협력 제안"
 o_canada_abbott.1.d: "캔버라 정부가 양국을 더 가깝게 하고 우리 둘 다 물려받은 풍부한 천연자원을 활용하기 위해 광업 기술 전문가를 교환하자는 제안을 들고 우리에게 접근했습니다. 이 거래는 상당히 간단하며, 겉으로 보기에 현 오스트레일리아 정부가 우리와 그다지 가깝지 않았음에도 양국 모두에 이익이 될 것입니다."
 o_canada_abbott.1.a: "영연방 형제들을 환영한다."
 o_canada_abbott.1.b: "사양하겠다."
 o_canada_abbott.2.t: "오타와에서의 몇 가지 실언"
 o_canada_abbott.2.d: "오타와의 캐나다 전쟁 박물관 항공관에 선 토니는 기자 무리에게 연설했는데, 장소와 무관하게 상당수가 오스트레일리아 기자였다. 그는 기자 무리가 쫓아다니지 않고서는 나라를 떠나지도 못하는 듯했다. [CAN.GetLeader]은(는) 그가 연설하는 동안 그의 곁에 서 있었다. 그들에 대한 고정관념에 빠지지 않으려 노력하면서도, 그는 그들이 정말로 친절한 사람들이라는 말을 하지 않을 수 없었다. 다만 그의 취향에는 조금 지나치게 좌파적이었다. \n\n토니의 마음은 연설의 마무리로 돌아갔다. 그는 돌아서서 그들의 지도자와 악수를 나눈 뒤 나갔고, 연설에서 몇 번 더듬거리고 한 번은 이 나라를 \\"캐나디아\\"라고 부르기도 했지만, 일은 대체로 별 탈 없이 지나갔다. 캐나다 정부는 광업 투자에 동의했고, 그 대가로 우리는 시추를 돕도록 우리 전문가들을 그곳에 보내고 있었다."
 o_canada_abbott.2.a: "영연방이라는 공통점 덕분이다."
 abbott_china_trade.1.t: "오스트레일리아의 추가 무역 협력"
 abbott_china_trade.1.d: "오스트레일리아 지도자 [AST.GetLeader]은(는) 자유 무역 협정을 추진하여 우리와 그들 나라 간 현재의 무역 범위를 확대하는 데 매우 적극적입니다. 이 거래에는 우리 상품에 대한 최대 95% 무관세 수입과 보다 원활한 자원 교환이 포함되며, 우리 민간 기업이 오스트레일리아에 더 쉽게 투자할 수 있도록 허용하는 조항도 있습니다. 겉으로는 모든 면에서 양측 모두에 이익이 되는 거래로 보입니다."
 abbott_china_trade.1.a: "가치 있는 시도다"
 abbott_china_trade.1.b: "우리의 최선의 이익이 아니다."
 abbott_china_trade.2.t: "[GetYear]년 자유 무역 협정 체결"
 abbott_china_trade.2.d: "중국이 우리의 양자 간 자유 무역 협정에 동의하여 양국 간 광물과 공산품의 흐름이 크게 강화되었습니다. 더 광범위한 협약을 위한 거의 10년에 걸친 협상이 마침내 결실을 맺었습니다. 중국이 우리 최대의 수출 수입원이라는 점을 고려하면, 그 효과는 경제 전반에서 즉시 체감될 것입니다. 갓 서명한 문서와 악수 하나로, 태평양은 갑자기 더 가깝고 더 단결된 곳이 되었습니다."
 abbott_china_trade.2.a: "이해관계 일치의 마법."
 abbott_china_trade.3.t: "중국, 추가 무역 협력 거부"
 abbott_china_trade.3.d: "안타깝게도 중국은 추가 협력에 관한 우리의 제안을 거부했으며, 당분간 외교적으로 우리에게 문을 닫았습니다. 앞으로 의지할 다른 길을 모색해야 할 것으로 보입니다."
 abbott_china_trade.3.a: "최악은 아니지만, 분명 좋지는 않다."
 abbott_navy_exercises_event.1.t: "훈련의 결실"
 abbott_navy_exercises_event.1.d: "미국 친구들과의 훈련이 마무리되었으며 몇 가지 유용한 결과를 낳았습니다. 우리 병력이 꼭 필요했던 훈련을 받은 것 외에도, 훈련은 우리 부대 기술의 부족한 점을 드러냈습니다. 연구개발 부서와 데이터를 공유한 결과, 이 결과의 일부를 우리의 연구 개발에 적용할 수 있을 것으로 보입니다."
 abbott_navy_exercises_event.1.a: "확실히 유용하다."
 knights_and_dames_ast_event.1.t: "필립 공의 기사 작위를 둘러싼 엇갈린 반응"
 knights_and_dames_ast_event.1.d: "[GetASTLeaderTitle]의 고위 동료들은 오스트레일리아인이 아닌 필립 공에게 오스트레일리아 기사 작위를 수여해 전통을 되살리기로 한 결정에 대해 당혹감, 분노, 낙담이 뒤섞인 반응을 공개적으로 드러냈습니다. \n\n내각 장관들은 [GetASTLeaderTitle]이(가) 수여를 발표하기 전에 지도부 누구와도 상의하지 않았다고 ABC에 밝혔습니다. 이는 공화제 지지자들 사이에서 의회를 갈라놓은 조치로 보입니다. \n\n\\"저는 그분이 90대에, 봉사와 의무로 가득한 삶의 끝자락에 있는 지금 우리나라가 그분이 우리를 위해 해 주신 일을 제대로 인정할 수 있게 되어 정말 기쁩니다.\\"라고 토니 애벗은 이 결정에 관한 성명에서 말했습니다. 영국의 반응은 다소 절제된 감사였지만, 국내의 반응은 결코 그렇지 않은 것으로 요약됩니다."
 knights_and_dames_ast_event.1.a: "모두를 만족시킬 수는 없다."
 abbott_japan_trade_deal.1.t: "캔버라의 무역 재협상"
 abbott_japan_trade_deal.1.d: "오스트레일리아의 [GetASTLeaderTitle] [AST.GetLeader]이(가) 일부 미비한 점을 더 \\"바로잡기\\" 위해 현재 그 나라와 맺고 있는 무역 약속을 재협상하자고 직접 연락해 왔습니다. 이것이 우리 쪽의 미비점을 가리키는지 그들 쪽의 것인지는 불분명하지만, 협정을 일부 다듬으면 양국 간 상품 이동이 원활해질 수 있습니다. 특히 농산물 수입이 그렇습니다."
 abbott_japan_trade_deal.1.a: "공정해 보인다."
 abbott_japan_trade_deal.1.b: "사양하겠다."
 abbott_japan_trade_deal.2.t: "일본과의 협상, 역사적 거래 성사"
 abbott_japan_trade_deal.2.d: "재협상은 경제적 금맥을 터뜨려 훨씬 더 공정한 협정을 안겨 주었습니다. 일본이 우리 쇠고기에 부과하던 관세는 다른 여러 농산물과 함께 사실상 철폐됩니다. 다만 그들이 양보하려 하지 않은 유일한 작물은 쌀이었습니다. \n\n그들은 또한 우선 자원 계약에도 서명합니다. 한편 약속한 대로 우리는 그들의 전자제품과 차량에 대한 여러 관세를 대폭 인하합니다. 이것이 우리 농업 부문에 가져올 활력은 아무리 강조해도 지나치지 않습니다. 원래의 거래와 비교하면 우리에게 확실한 승리입니다."
 abbott_japan_trade_deal.2.a: "이제야 공정한 기회다."
 abbott_saf_event.1.t: "케이프타운의 곤란"
 abbott_saf_event.1.d.a: "묘하게도 남아프리카 공화국에는 수도가 세 곳 있다. 애벗이 이해하기 어려워했던 사실이다. 일을 지체시키지 않으려고 단순함을 위해 요하네스버그가 선택되었고, 그가 도착했을 때 방문지는 새로 지어진 FNB 스타디움이었다. 그들은 분명 현대화 노력을 자랑하고 싶어 했지만, 토니는 자신이 개발도상국에 와 있다는 사실을 의심할 수 없었다. \n\n그가 결국 다뤄야 할 방 안의 코끼리는 난민 문제였다. 계속되는 민족 충돌을 피해 도망치는 수천 명의 주로 백인 농민들이 남아프리카 공화국 정부의 무대응에 항의하고 있었다. 그러나 관리들은 할 수 있는 모든 것을 하고 있으며 문제가 과장되고 있다고 고집했다. \n\n애벗이 아는 것은 난민의 수가 늘고 있으며 그들이 규탄을 요구하고 있다는 것뿐이었다."
 abbott_saf_event.1.d.b: "묘하게도 남아프리카 공화국에는 수도가 세 곳 있다. 애벗이 이해하기 어려워했던 사실이다. 일을 지체시키지 않으려고 단순함을 위해 요하네스버그가 선택되었고, 그가 도착해 처음 들른 곳은 넬슨 만델라 기념관이었다. 애벗은 그 인물에 깊은 존경심을 품고 있었고, 그날 오스트레일리아의 모든 깃발을 조기로 게양하라고 요청하기까지 했다. \n\n그러나 그가 결국 다뤄야 할 방 안의 코끼리는 난민 문제였다. 계속되는 민족 충돌을 피해 도망치는 수천 명의 주로 백인 농민들이 남아프리카 공화국 정부의 무대응에 항의하고 있었다. 그러나 관리들은 할 수 있는 모든 것을 하고 있으며 문제가 과장되고 있다고 고집했다. \n\n애벗이 아는 것은 난민의 수가 늘고 있으며 그들이 규탄을 요구하고 있다는 것뿐이었다."
 abbott_saf_event.1.b: "정부를 규탄하고 난민 비자를 신속 발급한다."
 abbott_saf_event.1.a: "그들을 지지한다."
 indonesian_intervention_abbott.2.t: "자카르타, 우리의 요청 거부"
 indonesian_intervention_abbott.2.d: "예상대로 인도네시아 정부는 자국 내 평화 유지 작전을 허용해 달라는 우리의 요청을 거부했으며, 우리 외교관들이 이 조치를 더 논의하지 못하도록 막았습니다. 이 반응으로 우리에게는 직접 행동 외에 요구를 관철할 수단이 거의 남지 않았습니다. 그동안 모든 협력은 얼어붙은 것으로 보입니다."
 indonesian_intervention_abbott.2.a: "그들이 우리를 몰아붙이고 있다."
 indonesian_intervention_abbott.3.t: "자카르타, 우리의 평화 유지 노력 승인"
 indonesian_intervention_abbott.3.d: "지옥이 얼어붙었거나, 어쩌면 자카르타가 얼어붙은 모양입니다. 인도네시아 정부가 자국 내 평화 유지 작전에 대한 우리의 요청을 승인했습니다. 이는 우리의 대테러 활동에 놀라운 효과를 낼 것이며, 우리가 위협에 직접 개입할 수 있게 되어 향후 또 다른 공격이 일어날 가능성은 크게 줄었습니다."
 indonesian_intervention_abbott.3.a: "좋은 소식이다!"
 oceanic_alliance_ast.1.t: "오세아니아 동맹 논의"
 oceanic_alliance_ast.1.d: "캔버라 정부가 우리의 가입을 분명한 목표로 하는 공식 오세아니아 기반 동맹 결성을 논의하기 위해 대표단을 보냈습니다. 가입은 사실상 태평양에서 방어 조치를 유지하기 위해 양국 군대를 통합함을 의미하며, 오스트레일리아 측은 이 협약이 실현되면 가까운 장래에 이 지역의 분쟁 가능성을 막을 것이라고 주장해 왔습니다. 그러나 우리는 분명 일정 수준의 자치를 포기하게 되며, 오스트레일리아의 끊임없이 변하는 외교 정책에 원치 않게 묶일 수도 있습니다."
 oceanic_alliance_ast.1.a: "가치 있는 시도다."
 oceanic_alliance_ast.1.b: "우리의 독립이 더 중요하다."
 oceanic_alliance_ast.2.t: "뉴질랜드, 동맹 거절"
 oceanic_alliance_ast.2.d: "뉴질랜드 정부는 현재의 방어 능력이 충분하다고 보고 지금은 동맹을 공식화할 필요가 없다고 판단한 것으로 보입니다. 분명 실망스러운 결과이지만, 탐색해 볼 다른 길이 아직 있을지도 모릅니다."
 oceanic_alliance_ast.2.a: "좋을 대로 하라지."
 oceanic_alliance_ast.3.t: "인도네시아, 동맹 거절"
 oceanic_alliance_ast.3.d: "인도네시아 정부는 현재의 방어 능력이 충분하다고 보고 지금은 동맹을 공식화할 필요가 없다고 판단한 것으로 보입니다. 분명 실망스러운 결과이지만, 탐색해 볼 다른 길이 아직 있을지도 모릅니다."
 oceanic_alliance_ast.4.t: "파푸아 뉴기니, 동맹 거절"
 oceanic_alliance_ast.4.d: "포트모르즈비 정부는 현재의 방어 능력이 충분하다고 보고 지금은 동맹을 공식화할 필요가 없다고 판단한 것으로 보입니다. 분명 실망스러운 결과이지만, 탐색해 볼 다른 길이 아직 있을지도 모릅니다."
 oceanic_alliance_ast.5.t: "바누아투, 동맹 거절"
 oceanic_alliance_ast.5.d: "바누아투 공화국은 현재의 방어 능력이 충분하다고 보고 지금은 동맹을 공식화할 필요가 없다고 판단한 것으로 보입니다. 분명 실망스러운 결과이지만, 탐색해 볼 다른 길이 아직 있을지도 모릅니다."
 operation_sovereign_abbott.1.t: "국경 주권 작전"
 operation_sovereign_abbott.1.d: "스콧 모리슨이 애벗 쪽으로 몸을 기울여 그의 손을 잡고 카메라 플래시가 터지는 가운데 악수를 나눴다. 스콧은 그보다 몇 인치 더 컸고, 애벗의 손은 편안하다고 느끼는 것보다 몇 초 더 오래 스콧의 손아귀에 갇혀 있었다. 사석에서 모리슨은 이 법안을 인기는 없지만 늘어나는 불법 이민의 부담에 맞서는 데 필요한 조치로 설명했고, 반발이 있을 경우 자신이 전면에 서겠다고 제안했다. 애벗은 그 이면에 다른 속셈이 있음을 알아챌 만큼 경험이 풍부했다. \n\n모리슨은 막후 활동으로 이름을 알렸으며, 직함만 없을 뿐 사실상 당 원내총무로서 모두를 단속했다. 인정하건대 그는 유능했고, 오직 자신만이 예견한 문제들에 대한 해법을 아주 신속하게 제시했다. 지금까지 그는 자기 몫을 다했다. 공을 인정받고 싶어 한다면 그것은 공정한 일이었다. 어쨌든 그의 정책이었으니까. 그래서 애벗은 동의했고, 이 출범식은 그들 정부를 위한 거대한 홍보 쇼가 되었다."
 operation_sovereign_abbott.1.a: "치즈!"
 japan_subs_abbott.1.t: "구매 결정"
 japan_subs_abbott.1.d: "원래 계획은 노후화되는 콜린스급 함대를 대체하기 위해 하루시오급 잠수함 6척을 구매하는 것이었습니다. 그러나 해상에서의 화력 필요성을 고려하여, 대신 헬기 탑재 경구축함 3척 구매를 요청할 수도 있습니다. \n\n잠수함은 우리 함대 규모를 적절히 채워 줄 것이며, 모델은 최신 기술로 개량되어 있습니다. 반면 무라사메급 구축함은 공중전과 순수 화력 면에서 우위를 가져다줄 수 있습니다."
 japan_subs_abbott.1.a: "잠수함을 고수한다."
 japan_subs_abbott.1.b: "구축함으로 간다."
 japan_subs_abbott.2.t: "오스트레일리아의 함선 구매 요청"
 japan_subs_abbott.2.d: "오스트레일리아가 흥미로운 제안을 들고 접촉해 왔습니다. 그들은 함대를 보강하기 위해 우리의 노후한 하루시오급 잠수함 6척을 상당한 금액에 구매하겠다고 제안했습니다. 이는 양국의 방위 유대를 강화하고 대체 잠수함을 위한 추가 자금을 제공할 것입니다."
 japan_subs_abbott.2.a: "거래를 승인한다."
 japan_subs_abbott.2.b: "우리의 최선의 이익이 아니다."
 japan_subs_abbott.3.d: "오스트레일리아가 흥미로운 제안을 들고 접촉해 왔습니다. 그들은 함대를 보강하기 위해 우리의 노후한 무라사메급 경구축함 3척을 상당한 금액에 구매하겠다고 제안했습니다. 이는 양국의 방위 유대를 강화하고 대체 함선을 위한 추가 자금을 제공할 것입니다."
 japan_subs_abbott.4.t: "일본, 매각 거부"
 japan_subs_abbott.4.d: "뜻밖에도 일본 정부는 현재 규모로 함대를 유지하는 쪽을 선호하며 우리의 거래를 거부했습니다. 이 추세라면 그들은 우리를 '불운한' 나라라고 부르게 될 것입니다."
 japan_subs_abbott.4.a: "이럴 수가..."
 japan_subs_abbott.5.t: "일본, 매각 승인"
 japan_subs_abbott.5.d: "일본이 매각 요청을 승인했으며, 함선들은 곧 우리 함대로 이전될 것입니다. 해상에서 꼭 필요했던 추가 화력을 제공해 줄 것입니다."
 japan_subs_abbott.5.a: "훌륭한 소식이다."
 abbott_condemns_china.1.t: "토니 애벗, 중국의 팽창 규탄"
 abbott_condemns_china.1.d: "중국에 대한 오스트레일리아 [GetASTLeaderTitle]의 최근 입장은 자유당 원로들을 걱정시켰고, 중국의 인공섬 건설에 대해 새로운 입장을 취한 점으로 유권자들의 지지를 불러일으켰습니다. \n\n어제 기자회견에서 이 지도자는 중국의 최근 움직임을 \\"평시 역사상 최대의 군사 팽창\\"이라고 질책했습니다. 억지력을 유지하기 위해 오스트레일리아 자체 군대의 긴급한 강화를 요구했습니다. 핵심 공급망에서 중국을 배제하기 위해 동아시아에 더 많은 함선과 항공기를 배치하는 것을 강조했습니다. \n\n발표 이후 중국 관리들은 이 입장을 규탄했으며, 토니 애벗이 \\"반중 히스테리\\"를 유발하고 있다고 묘사했습니다. 의도와 무관하게, 양국 간 긴장은 절정에 이를 기세입니다."
 abbott_condemns_china.1.a: "저게 먹구름인가?"
 kuala_lumpur_abbott.1.t: "중립을 위한 무역 협약"
 kuala_lumpur_abbott.1.d: "우리와 오스트레일리아 간의 광물 무역이 늘어나 오스트레일리아 정부가 우리와 자유 무역 협정을 체결하는 문제를 논의하자고 연락해 왔습니다. 거래의 세부 내용에는 우리가 석탄, 알루미늄 및 기타 광물 관세와 일부 농산물 수입 관세를 낮추는 것이 포함됩니다. 그 대가로 오스트레일리아는 우리의 원유, 전자제품, 운송 장비 수출에 대한 관세를 낮출 것입니다. \n\n그러나 거래의 일부로, 중국과의 현재 불화에서 우리가 중립을 선언해야 한다는 조항이 있으며, 이는 사실상 그들과 불가침 조약을 체결하는 것에 지나지 않습니다."
 kuala_lumpur_abbott.1.a: "공정한 합의다."
 kuala_lumpur_abbott.1.b: "너무 무리한 요구다."
 kuala_lumpur_abbott.2.t: "말레이시아, 협약 서명"
 kuala_lumpur_abbott.2.d: "우리의 벗 말레이시아는 무역 협정에 서명하고, 우리 문제에 대하여 외교적으로 중립을 지키겠다는 협약에도 공식 서명하였습니다. 이에 따라 광물과 농산물이 양국 사이에서 원활하게 오갈 수 있게 되었습니다. 도서 사슬의 또 다른 한 축이 판세에서 제거되었습니다."
 kuala_lumpur_abbott.2.a: "아주 좋다."
 kuala_lumpur_abbott.3.t: "말레이시아, 중립 협정 거부"
 kuala_lumpur_abbott.3.d: "우리의 선의에도 불구하고 말레이시아는 어떠한 약속도 하지 않겠다고 밝혔으며 우리의 무역 협정 또한 거부하였습니다. 유감스럽게도 도서 사슬의 한 조각은 여전히 판 위에 남아 있습니다."
 kuala_lumpur_abbott.3.a: "외교가 이렇게 어려울 줄 누가 알았겠는가."
 jap_repar_abbott.1.t: "오스트레일리아, 제2차 세계 대전 배상 요구"
 jap_repar_abbott.1.d: "이상하게도 오스트레일리아 정부가 제2차 세계 대전 당시 그들이 지출한 비용에 대한 매우 뒤늦은 지급을 협의하자며 연락해 왔습니다. 종전 이후 수십 년 동안 양국 관계가 대체로 긍정적이었다고 보아 온 대부분의 관료들은 이 요구에 당혹해하고 있습니다. 그럼에도 그들의 정부는 진지한 것으로 보이며, 상당히 큰 액수의 청구서를 보내왔습니다."
 jap_repar_abbott.1.a: "그냥 지불하라."
 jap_repar_abbott.1.b: "이건 무슨 농담인가?"
 jap_repar_abbott.2.t: "일본, 배상금 지급에 동의"
 jap_repar_abbott.2.d: "그들의 정부는 우리의 고충을 이해하였으며, 전쟁 비용을 충당하도록 우리에게 직접 일시불로 지급하는 데 동의한 것으로 보입니다. 그것도 어중간한 액수가 아닙니다. 다윈 항에서 일본 대표단과 함께 공식 기념식이 열릴 예정이며, 배상금 이전을 원활히 하기 위한 부서가 신설될 것입니다. 전체 사건이 이례적임에도 언론은 호의적으로 받아들이고 있으며, 야당들은 대체로 침묵을 지키고 있습니다."
 jap_repar_abbott.2.a: "이제 오랜 상처가 아물 수 있겠다."
 jap_repar_abbott.3.t: "일본, 배상 거부"
 jap_repar_abbott.3.d: "다소 난처하게도 일본 정부는 요구를 거부하였고, 나아가 자국 국영 방송에서 우리를 맹비난하였습니다. 물론 우리 쪽 언론도 한통속임이 틀림없는 것이, 주요 방송사들이 하나같이 이 사태를 조롱거리로 삼고 있으며, 하원과 상원에서 우리가 받는 질타만이 그보다 더할 뿐입니다. 의회 밖에서는 애벗을 일본 대사관 앞에 앉아 있는 거지로 묘사한 팻말을 흔드는 시위대까지 목격되었습니다."
 jap_repar_abbott.3.a: "굳이 들춰낼 필요는 없다."
 jap_alliance_abbott.1.t: "남반구에서 온 상호 동맹"
 jap_alliance_abbott.1.d: "오스트레일리아가 상호 안보 협약을 제안하였습니다. 그 세부 내용에 따르면 어느 한쪽과 중국 사이에 분쟁이 발발할 경우 참전 요청이 발동됩니다. 이 협약은 태평양의 안전을 지키기 위해 중국과의 추가 충돌을 억지하는 것을 목표로 하는 것으로 보입니다."
 jap_alliance_abbott.1.a: "이 점에서는 뜻을 같이한다."
 jap_alliance_abbott.1.b: "이는 지나치다."
 jap_alliance_abbott.2.t: "요코하마 협정"
 jap_alliance_abbott.2.d: "도쿄 정부가 협약에 서명하여 양국 사이에 안보 동맹이 성립되었습니다. 우리와 중국 사이에 분쟁이 발발하면 일본은 참전 요청을 받게 됩니다. 우리 쪽 판에 또 하나의 말이 놓였습니다."
 jap_alliance_abbott.2.a: "명예로운 동맹"
 jap_alliance_abbott.3.t: "일본, 협약 거부"
 jap_alliance_abbott.3.d: "일본 대표단의 이례적인 침묵이 이어진 끝에, [GetASTLeaderTitle]은(는) 일본 측 상대로부터 화상 통화를 받았습니다. 길고 장황한 통화였으며 총리 집무실 밖에서는 웅얼거리는 고함 소리만 들렸지만, 결국 일종의 춤 대결로 번진 끝에 협상은 중단되었습니다."
 jap_alliance_abbott.3.a: "어쩌면 최악의 결과일지도 모른다."
 france_abbott_ast.1.t: "섬 임차"
 france_abbott_ast.1.d: "오스트레일리아 정부가 뉴칼레도니아 섬들의 토지를 5년 기한으로 군사 목적으로 임차하겠다는 제안을 해 왔습니다. 그들은 이 임차가 최근의 평화 유지 노력의 일환으로서 태평양의 지속적인 안정도를 보장할 것이라고 장담하였으며, 토지 및 기지 사용권의 대가로 390억을 제시하였습니다."
 france_abbott_ast.1.a: "공정한 거래다."
 france_abbott_ast.1.b: "이 섬들은 오로지 우리의 것이다."
 france_abbott_ast.2.t: "뉴칼레도니아 임차"
 france_abbott_ast.2.d: "프랑스가 흔쾌히 임차를 승인하여, 우리는 향후 5년간 주변 섬들에서 군사적 존재와 기반시설을 확대할 사실상의 권리를 얻었습니다."
 france_abbott_ast.2.a: "우리의 영향권이 넓어진다."
 france_abbott_ast.3.t: "섬 임차 무산"
 france_abbott_ast.3.d: "프랑스는 현시점에서 섬 임차 제안을 거부하였으며, 그 결과 우리는 전략적으로 사실상 고립되었습니다. 동쪽 측면을 방어할 다른 방법을 찾아야 합니다."
 france_abbott_ast.3.a: "훌륭한 거래였는데!"
 france_abbott_ast.4.t: "섬 임차 기간 만료 임박"
 france_abbott_ast.4.d: "오스트레일리아가 군사 배치를 위해 뉴칼레도니아 섬들에 보유한 임차 기간이 끝나가고 있습니다. 우리는 그들에게 5년 더 연장해 줄 수도 있고, 섬들의 반환을 요구할 수도 있습니다."
 france_abbott_ast.4.a: "임차를 연장하게 하라."
 france_abbott_ast.4.b: "이제 품으로 돌아올 때다."
 france_abbott_ast.5.t: "프랑스, 연장 제안"
 france_abbott_ast.5.d: "뉴칼레도니아 섬들에 대한 우리의 임차 기간이 끝나감에 따라, 프랑스가 5년 더 연장해 주겠다고 먼저 제안해 왔습니다."
 france_abbott_ast.5.a: "합리적인 제안이다."
 france_abbott_ast.5.b: "돌려받아 가라."
 france_abbott_ast.6.t: "섬 임차 종료"
 france_abbott_ast.6.d: "뉴칼레도니아 섬들에 대한 우리의 임차 기간이 끝나감에 따라, 프랑스는 섬들을 반환하고 현재 그곳에 주둔 중인 우리 병력을 철수시킬 것을 요구하였습니다."
 france_abbott_ast.6.a: "합리적인 요구다."
 france_abbott_ast.6.b: "이제 그 섬들은 우리 것이다."
 france_abbott_ast.7.t: "뉴칼레도니아 섬 반환"
 france_abbott_ast.7.d: "오스트레일리아는 임차한 섬들을 신속히 반환하였으며, 관례에 따라 사용에 대해 감사의 뜻을 전하였습니다."
 france_abbott_ast.7.a: "결실 있는 거래였다."
 france_abbott_ast.8.t: "오스트레일리아, 섬 반환 거부"
 france_abbott_ast.8.d: "다루기 힘든 오만이라고밖에 표현할 수 없는 태도로, 오스트레일리아 정부는 섬들의 반환을 거부하였습니다. 그들은 임차 연장 비용조차 지불하기를 거부하였으며, 사실상 섬들을 불법 점거하고 있습니다. 군사 개입에 가까운 외교적 분쟁은 고려 대상이 될 수 없으나, 우리는 국제 무대에서 이 점령에 항의해야 할 것입니다."
 france_abbott_ast.8.a: "이는 터무니없다!"
 middlepower_abbott.1.t: "오스트레일리아, 동맹 모색"
 middlepower_abbott.1.d: "오스트레일리아가 상호 안보 제안을 보내왔습니다. 그 세부 내용에 따르면 어느 한쪽과 중국 사이에 분쟁이 발발할 경우 참전 요청이 발동됩니다. 제안의 핵심은 중국을 고립시키고 태평양에서의 영향권을 봉쇄하려는 시도입니다.  \n\n그러나 이 협정에는 북한이 포함되어 있지 않으며, 중국과 가까운 우리의 지리적 위치를 고려하면 우리가 표적이 될 수도 있습니다. 그럼에도 오스트레일리아는 이 협약이 오직 억지 수단으로서 만들어졌다고 장담하였습니다."
 middlepower_abbott.1.a: "추구할 만한 가치가 있다."
 middlepower_abbott.1.b: "그것으로는 부족하다."
 middlepower_abbott.2.t: "동맹의 난관"
 middlepower_abbott.2.d: "중국 편에 선 북한과 가까운 점을 고려하여, 한국은 조약과 관련하여 더 많은 방위 보장을 요구하고 있습니다. 일부 병력 훈련 프로그램과 생산 지원으로 그들을 끌어들일 수 있겠으나, 분명 비용이 많이 들 것입니다. 우리의 선택은 한국의 지지를 얼마나 높이 평가하느냐에 달려 있습니다."
 middlepower_abbott.2.a: "그들을 끌어들일 온건한 조약."
 middlepower_abbott.2.b: "무엇이든 모든 것을."
 middlepower_abbott.2.c: "비용이 너무 크다."
 middlepower_abbott.3.t: "오스트레일리아, 방위 지원으로 역제안"
 middlepower_abbott.3.d: "조약을 살리려는 시도로, 오스트레일리아는 합동 병력 훈련 프로그램과 우리의 무기 생산을 돕기 위한 자국 전문가 파견을 역제안하였습니다. 의심할 여지 없이 상당한 규모의 제안입니다. 그들은 분명 우리가 수락하기를 바라고 있습니다."
 middlepower_abbott.3.a: "그들의 지원을 환영한다."
 middlepower_abbott.3.b: "그래도 그만한 가치는 없다."
 middlepower_abbott.4.t: "오스트레일리아, 대규모 지원으로 역제안"
 middlepower_abbott.4.d: "조약을 살리려는 시도로, 오스트레일리아는 매우 큰 규모의 제안으로 역제안하였습니다. 합동 병력 훈련을 위한 광범위한 프로그램과 공장 조립 계약, 취득 대출, 이행을 돕는 기술 전문가를 포함한 무기 생산 지원입니다. 그들은 우리가 수락하기를 바라며 총력을 기울이고 있는 것이 분명합니다."
 middlepower_abbott.4.a: "그들의 지원을 환영한다."
 middlepower_abbott.4.b: "그래도 그만한 가치는 없다."
 middlepower_abbott.5.t: "KAMAT 발효"
 middlepower_abbott.5.d: "서울 주재 대사관에서 우리 측과 한국 측 외교관들이 한국-오스트레일리아 상호 보장 조약에 서명하였으며, 이로써 양국은 상대국의 안보를 위협하는 전쟁이 발생할 경우 서로를 지원할 것을 보장하게 되었습니다. 이제 우리는 그 어느 때보다 긴밀히 결속되었으며, 또 하나의 국가가 태평양 전투에서 우리를 지지하게 되었습니다."
 middlepower_abbott.5.a: "합류를 환영한다."
 middlepower_abbott.6.t: "협상 난항"
 middlepower_abbott.6.d: "우리와 한국 사이의 논의는 결렬된 것으로 보입니다. 좋은 분위기로 시작했음에도 그들은 자국의 안보 우려를 이유로 발을 뺐습니다. 용을 가두려는 우리의 노력은 그들 없이 계속되어야 할 것입니다."
 middlepower_abbott.6.a: "한국의 호랑이는 잠들어 있다."
 abbott_china_occupation.1.t: "거부 전략"
 abbott_china_occupation.1.d: "어두운 방 안에서 토니 애벗과 나머지 전시 내각은 항공 촬영본, 위성 영상, 병력 수송선 감시 영상이 번갈아 나오는 빛나는 화면을 지켜보았다. 밤이었고 영상은 끊겼지만, 인민해방군의 휘장만은 더없이 선명했다. 적이 상륙한 것이다. \n\n애벗은 가슴이 내려앉았다. 그는 의자에 등을 기대고 손바닥으로 이마를 쓸어내렸다. 분석관이 영상을 멈추고 브리핑을 시작할 때까지 방 안은 조용했다. 최우선 과제는 여론의 흐름을 통제하는 것이었으나, 영상은 이미 온라인에서 공유되고 있을 것이 분명했고 이는 국가 역사상 최악의 국방 실책이 될 듯했다. 이제부터의 싸움은 힘겨운 고전이 될 것이었다. \n\n분석관이 말을 멈추고 총리의 지시를 기다리는 동안 어색한 정적이 흘렀다. 생각에 잠겨 일그러진 애벗의 얼굴에는 엄격함과 공허함이 뒤섞여 있었다. 마침내 그는 방 안의 사람들을 향해 돌아섰다. \\"이봐, 이 시점에서는 뭐, 어, 그러니까, 젠장, 이런 일도 생기는 법이지.\\""
 abbott_china_occupation.1.a: "이번 경우엔 그렇다."
 abbott_shirtfronting_china.1.t: "해상의 발화점"
 abbott_shirtfronting_china.1.d: "남중국해의 우리 함대로부터 단편적인 보고가 쏟아져 들어오고 있습니다. 대부분의 보고가 불완전하고 상황도 아직 불명확하지만, 암초 해역에서 대치가 있었던 것으로 보입니다. \n\n우리 함선들이 스카버러 암초를 순찰하도록 배치된 이후, 인근의 중국 함대와 대치하게 되었습니다. 그 함대는 우리 함선들에게 해역에서 떠날 것을 요구하였고, 우리 함선들이 이를 거부하자 얼마 지나지 않아 중국 함선 한 척이 발포하였습니다. 양측은 잠시 교전을 주고받은 뒤 우리 함선들이 후퇴하였습니다. 호위함 두 척을 잃었으며 현재까지 사상자는 네 명입니다. \n\n우리가 상황이 벌어지는 와중에 이를 파악하고 있는 만큼 중국의 반응은 아직 없습니다. 어떻게 대응할지는 우리에게 달려 있습니다. 지금 우리는 칼날 위에 서 있습니다."
 abbott_shirtfronting_china.1.a: "베이징과 연결선을 확보하라."
 abbott_shirtfronting_china.1.b: "이는 명백한 공격이다. 약함을 보일 수 없다."
 abbott_shirtfronting_china.2.d: "남중국해에서 전개되고 있는 사안을 논의하기 위해 오스트레일리아의 [GetASTLeaderTitle]에게서 직통 연락이 들어왔습니다. 보고가 아직 계속 들어오고 있으나, 스카버러 암초 인근에서 그곳에 주둔한 우리 함대와 오스트레일리아 순찰대 사이에 교전이 벌어진 것은 분명합니다. \n\n보고에 따르면 우리 구축함 한 척이 오스트레일리아 함선들 위로 경고 사격을 가했고, 이것이 교전을 촉발하였습니다. 현재까지 사상자는 세 명이며 함대는 경미한 피해를 입었습니다. 반면 오스트레일리아는 두 척을 잃었으며 자국 함선 다섯 척을 잃었을 가능성도 있습니다. \n\n그들의 지도자는 이제 우리가 해당 해역에서 함선을 철수하고 긴장 완화 회담에 임할 것을 요구하고 있습니다. 그 뻔뻔함은 분명 불쾌하지만, 우리가 양보하지 않으면 상황은 세계 무대에서 악몽으로 번질 수 있습니다."
 abbott_shirtfronting_china.2.a: "전쟁을 막을 수 있다면 무엇이든."
 abbott_shirtfronting_china.2.b: "용은 양과 함께 굽실거리지 않는다."
 abbott_shirtfronting_tt: "당분간 암초 해역에서 우리 함선을 철수시킬 것입니다"
 abbott_shirtfronting_china.3.t: "물러서기"
 abbott_shirtfronting_china.3.d: "중국 정부가 해당 지역에서 자국 함선을 철수시키는 데 동의하였습니다. 한동안 양국이 피할 수 없는 전쟁의 길로 향하는 듯했으나, 간신히 그 경로를 피했습니다. 긴장은 여전히 높지만, 중국은 재발을 방지할 확고한 합의를 도출하기 위해 캔버라에 대표단을 보내겠다고 제안하였습니다. 이를 위해 우리는 많은 대가를 치렀으나, 이는 작은 승리를 의미합니다."
 abbott_shirtfronting_china.3.a: "또 하나의 전쟁이 회피되었다."
 abbott_shirtfronting_china.4.t: "침묵"
 abbott_shirtfronting_china.4.d: "딸깍 소리와 함께 반대편의 음성이 끊겼습니다. 중국은 사건을 충분히 인지하고 있음에도 긴장 완화를 위한 어떠한 조건도 논의하려 하지 않습니다. 우리는 갈림길에 서 있습니다. 중국이 이러한 수준의 방해받지 않는 확전을 계속한다면, 우리는 반격 없이 사실상 전쟁 상태에 놓이게 됩니다. 반면, 백지 선언 이후에는 되돌아갈 길이 거의 없습니다."
 abbott_shirtfronting_china.4.a: "물러서야 한다."
 abbott_shirtfronting_china.4.b: "그들이 원하는 것이 전쟁이라면..."
 call_japan_to_our_side_ast: "일본을 우리 편으로 소집"
 call_kor_to_our_side_ast: "대한민국을 우리 편으로 소집"
 call_roc_to_our_side_ast: "대만을 우리 편으로 소집"
 abbott_call_to_arms.1.t: "오스트레일리아, 우리에게 참전 요청"
 abbott_call_to_arms.1.d: "양국 간에 서명된 협약에 따라, 오스트레일리아는 자국과 중국 사이의 현재 분쟁을 이유로 우리에게 협약을 이행하여 전투에 합류할 것을 요청하였습니다."
 abbott_call_to_arms.1.a: "그렇다면 전쟁이다."
 malcolm_abbott_event.4.t: "몽키팟 룸으로"
 malcolm_abbott_event.4.d: "토니는 텅 빈 의회 방에 앉아 있었고, 머리 위에서 꺼져가는 전구의 윙윙거림만이 그의 곁을 지켰다. 그의 생각은 울루루에서 보낸 시절, 첫 장거리 달리기로 향했다. 여정 전체가 고통스러웠다. 토니는 그 도전을 받아들일 만한 몸 상태가 아니었고 한두 번이 아니게 거의 포기할 뻔했지만, 그 순간만큼 자유로웠던 적은 없었다. \n\n그곳 오지에는 주변에 아무것도 없었다. 바람에 흔들리는 위치티 덤불의 휘파람 소리와 내리쬐는 태양뿐이었다. 완주한 그날은 마라톤과 '아이언맨' 경기에 대한 그의 오랜 사랑의 시작이 되었다. 그러한 도전의 혹독함은 인격의 시험이 되었고, 이제 공직에서도 그와 비슷한 수준의 고통이 있었지만 그 일은 언제나 그만한 가치가 있었다. \n\n그러나 이번에는 그렇지 않을 터였다. 여정은 끝나가고 있었다. 모든 자유당 의원이 표결을 위해 모여들었고, 토니는 44 대 54로 패배할 것이었다. 맬컴 턴불이 새 대표로 고삐를 쥐게 되었다. 정치는 불충을 키우는 법이지만, 그래도 등에 칼이 꽂히는 느낌이었다. 그는 자신의 말대로 패배자는 되었을지언정 포기하는 사람은 되지 않았다는 사실에서 얼마간 위안을 얻었다."
 malcolm_abbott_event.4.a: "마라톤은 끝났다."
 malcolm_abbott_event.5.t: "맬컴 턴불, [GetASTLeaderTitle] 취임"
 malcolm_abbott_event.5.d: "국회의사당 앞 잔디밭에서 맬컴 턴불은 자유당의 새 대표이자 총리로서 첫 연설을 하며 \\"21세기 정부\\"를 이끌어내기 위한 \\"광범위한\\" 변화를 약속하였다. 턴불은 스콧 모리슨과 크리스토퍼 파인을 비롯하여 이행을 돕기 위한 신인과 당내 베테랑이 섞인 진용을 발표하였으며, 여성 각료 다섯 명이 추가된 점에 주목이 쏠렸다. \n\n\\"우리는 더 경쟁력 있어야 하고, 더 생산적이어야 하며, 또한 더 혁신적이어야 합니다.\\"라고 새 [GetASTLeaderTitle]은(는) 밝혔고, 이는 정부가 보다 기술 관료적인 방향을 받아들일 것을 예고하였다. \n\n당내 보수 강경파의 눈에는 상처가 아직 생생하지만, 다수는 턴불의 부상을 지지하였으며 축출 이후 자유당의 지지율은 초반 상승세를 보이고 있다."
 malcolm_abbott_event.5.a: "미래를 위하여."
 aus_war_on_terror_abbott.1.t: "전쟁의 구실"
 aus_war_on_terror_abbott.1.d: "토니는 이마의 땀을 닦고 연설을 위해 분주히 움직이는 언론 관계자들로 가득한 방을 둘러보았다. 가져온 조명은 끔찍하게 뜨거웠고, 토니는 이 모든 것이 빨리 끝나기를 바랐다. 지난 한 달 동안 그가 감당하기에는 기자회견과 정보 회의가 너무 많았고, 이제 국민을 설득하는 것이 그의 일이었다. \n\n프롬프터가 앞으로 밀려 나오자 모두가 조용해졌다. 토니는 목을 가다듬었다. 국민에게 연설하면서 그는 언론이 수개월째 대중에게 쏟아붓던 이름 하나를 언급할 것이었다. 그 이름은 제마 이슬라미야였다. \n\n제마 이슬라미야는 알카에다와 연계된 테러 조직망으로, ASIS는 발리 폭탄 테러와 대사관 공격의 배후로 이들을 확신하고 있었다. 그들은 우리를 거듭 타격하였고, 마침내 은신처를 찾아냈을 때 인도네시아는 우리 병력의 진입을 거부하였다. 토니의 주장대로라면 사실상 '테러리스트를 비호하는 자들'이 된 셈이었다. \n\n대중이 이를 완전히 믿었는지 아닌지는 대체로 중요하지 않았다. 결정은 연설 이전에 이미 내려져 있었다. 이는 단지 선로를 까는 작업이었다."
 aus_war_on_terror_abbott.1.a: "\\"이제 반격할 때입니다.\\""
 the_canberra_treaty_abbott.1.t: "캔버라 조약"
 the_canberra_treaty_abbott.1.d: "캔버라에 도착한 뒤 확인된 조약 조건은 스프래틀리 군도의 비무장화, 우리 함대 생산에 대한 제한, 그리고 우리와 오스트레일리아, 필리핀 사이의 비대립 협약입니다. 이는 함대 조우의 참담한 결과를 수습해 주겠지만, 우리 영토 안에서의 이동을 제한하는 굴욕에 해당합니다. \n\n조약은 한시적이지만 우리의 주요 교역 상대국 몇몇이 이를 뒷받침하고 있습니다. 이를 철회할 경우의 반발은 상당할 것입니다."
 the_canberra_treaty_abbott.1.a: "평화를 지키기 위하여."
 the_canberra_treaty_abbott.1.b: "우리가 서명할 것이라 생각한다면 꿈도 야무지다."
 the_canberra_treaty_abbott.2.t: "조약 서명"
 the_canberra_treaty_abbott.2.d: "중국과 필리핀 대표단은 회의를 선점하기 위해 이른 새벽 시간에 캔버라에 도착하였다. 회의가 시작되자 그들 사이에서는 억눌린 분노만이 들려왔다. 중국 대표들이 조약을 처음 보고 퇴장하지 않았다는 사실은 좋은 징조였다. 이는 그들에게 일종의 굴욕 의식이었으나, 피하기에는 그 여파가 너무 큰 것이었다. \n\n최종 결과는 스카버러 암초와 스프래틀리 군도 주변 해역의 비무장화에 대한 합의였다. 또한 중국은 함대 생산과 순찰 작전에 대한 제한, 그리고 비대립 협약을 약속하였다. \n\n우리가 바랐을 법한 결정타는 아니었지만, 오늘 우리는 중국 우위라는 환상을 깨는 데 성공하였다. 그들의 자기 갑옷에 금이 갔으며, 중국의 세력권은 봉쇄되었다. 적어도 당분간은 그렇다."
 the_canberra_treaty_abbott.2.a: "우리 시대의 평화!"
 the_canberra_treaty_abbott.3.t: "중국의 퇴장"
 the_canberra_treaty_abbott.3.d: "놀랍지 않은 결과로, 조약 조건을 설명하는 도중에 중국 대표단은 그냥 일어나 회의실을 나가 버렸습니다. 우리가 파악한 바로는 그들은 이미 귀국하기 위해 공항에 도착하였습니다. 뻔뻔한 일이지만, 우리는 조약 조건이 위험하다는 것을 알고 있었습니다. \n\n우리가 바랐을 법한 결정타는 아니었고 퇴장은 상당한 외교적 실패였으나, 오늘 우리는 중국 우위라는 환상을 깨는 데 성공하였습니다. 그들의 자기 갑옷에 금이 갔으며, 중국의 세력권은 취약성을 드러냈습니다. \n\n현재로서는 미국을 비롯한 여러 국가들이 이에 대한 대응으로 중국에 대한 제재에 동참하였습니다."
 the_canberra_treaty_abbott.3.a: "최선을 다했다."
 starbucks_event_ast.1.t: "난항을 겪는 양조"
 starbucks_event_ast.1.d: "불투명한 천이 반짝이는 새 탁자 위에서 걷혔고, 의자들이 포장에서 꺼내져 배치되었다. 초록 사이렌이 시드니 거리에 찾아왔고, 실제로 전국에 87개 매장이 문을 열었으며 새벽 5시에는 이미 한 블록을 돌아 줄이 늘어서 있었다. 스타벅스는 최근 이 나라에 상륙한 미국 패스트푸드 체인 열풍의 일부였고, 미국에서 함께 건너온 점장들은 개점에 참여하려는 열의로 가득했다. \n\n문이 열리자 손님들의 물결이 밀려들었고, 사건을 기록하려는 기자들도 함께였다. 매장은 손님으로 가득 찼지만, 몇 시간이 지나자 그렇지 않게 되었다. 개점 행사가 끝나고 떠나자, 밖에서 빠져나가는 인파에 비해 매장 안은 이상할 만큼 텅 비어 있었다. \n\n이따금 소수의 사람들, 대부분 관광객이 들어왔지만 대체로 조용했다. 이런 상황은 그 주 내내 이어졌고, 몇 달간 전국적으로 부진한 실적이 계속된 끝에 대부분의 매장이 문을 닫게 된다."
 starbucks_event_ast.1.a: "가장 강한 자만이 살아남는다."
 econ_costello_events.1.t: "붉은 흙과 스포트라이트"
 econ_costello_events.1.d: "코스텔로는 내리쬐는 태양 아래 서 있었고, 공기 중에는 지독한 냄새가 가시지 않았으며, 등은 땀으로 흠뻑 젖어 있었지만, 그는 자신의 본령에 있었다. \n\n그들 뒤에서 요란하게 석유를 뿜어 올리는 거대한 탑은 그들의 획기적인 거래를 뒷받침하는 기반이었다. 부품 대부분은 미국에서 실려 와 한 달도 되지 않아 이곳에서 조립되었다. 이와 같은 것이 퀸즐랜드와 사우스오스트레일리아 전역에 수십 기 더 세워질 것이었다. 러프킨 인더스트리스가 모든 사업을 맡았기 때문에 정부에서는 한 푼도 나가지 않았다. 그럼에도 우리는 그 보상을 거둘 것이었다. \n\n먼지가 날리며 양복에 달라붙기 시작했고, 코스텔로와 기업 대표들은 서둘러 사진 촬영을 마무리하였다. 정부가 겉으로나마 친석유로 비치자 놀랄 만큼 많은 기업이 문을 두드리고 있었으며, 러프킨은 그저 첫 번째에 불과했다. \n\n피터의 생각에 석탄은 일시적인 호재가 되어 버렸다. 석탄은 불을 켜 두고 집을 따뜻하게 해 주었지만, 나머지 세계를 계속 타오르게 하는 연료는 아니었다. 다음 광업 열풍은 석유를 둘러싼 것이 될 것이었다."
 econ_costello_events.1.a: "그저 좋은 사업일 뿐이다."
 econ_costello_events.2.t: "수출 호황"
 econ_costello_events.2.d: "중국과의 관계가 가까워지면서 우리의 수출 경제는 호황을 누리고 있습니다. 비교적 짧은 기간에 중국과의 무역량이 크게 늘었고, 석탄과 핵심 광물이 역대 최고 수준으로 양국 사이를 오가고 있습니다. 이러한 추세는 앞으로 몇 달간 이어질 것으로 보입니다."
 econ_costello_events.2.a: "전리품은 우리에게로."
 econ_costello_events.3.t: "베이징에서의 하룻밤"
 econ_costello_events.3.d: "피터와 외교 내각 일행이 베이징에 도착했을 때, G20 이후 그가 이 도시를 본 것은 처음이었고, 그 몇 년 사이에 도시의 풍경은 이미 크게 달라져 있었다. 경제적 격차를 좁히겠다는 중국의 결의는 사실상 이웃 나라들을 훌쩍 앞지르게 했고, 도시들은 위압적인 유리 거대 건물이 뻗어 나가는 도시권으로 변모했다. 그 성장의 한 조각이라도 오스트레일리아가 얻는다면 그것은 덤이었다. \n\n공항에서 짧은 차량 이동으로 그들은 '인민대회당'에 도착했다. 피터의 눈에는 브루탈리즘 양식에 거의 소련풍이라 할 만한 건물이었다. 도시의 스모그는 예상보다 덜 눈에 띄었고, 이상하게도 바깥에는 차가 거의 없었다. \n\n외무 장관과 중국 대표단이 그들을 만나기로 한 방에 도착했지만, 거의 두 시간이 지나도록 아무도 오지 않았다. 마침내 헝클어진 모습의 알렉산더 다우너가 비틀거리며 들어왔다. 헐떡이며 넥타이를 고쳐 맨 그는 지연을 사과했고, 마침내 회담이 시작되었다. \n\n그 결과는 국가 역사상 최대 규모의 단일 투자가 될 것이었고, 우리 농산물 수출에는 하늘이 내린 선물이었다. 십여 개의 기업이 우리 도시와 교외에 터를 잡을 것이었고, 일자리는 가장 도움이 필요한 지역을 겨냥하여 노동자들에게 돌아가도록 조율될 것이었다. 그들이 악수를 나누고 자리를 떠났을 때, 이번 방문은 피터의 기억 속에서 분명 가장 기이한 여정이었다."
 econ_costello_events.3.a: "그래도 가장 결실이 컸다."
 econ_costello_events.4.t: "부동산 시장에 유입된 검은 돈"
 econ_costello_events.4.d: "중국 투자자들에게 호소하여 부동산 시장의 매출을 끌어올리려던 정부의 시도는 열의에 찬 구매자 공급 이상의 것을 끌어들인 것으로 보입니다. 어제 퍼스에서 최근 매각된 고층 건물이 적발되면서 자유당 모금 활동에까지 이르는 자금 세탁 및 불법 자금 조달망이 드러났으며, 적발된 투자자 중 한 명이 당의 주요 후원자로 밝혀졌습니다. \n\n함정 수사에 이르기까지 이 조직망을 감시해 온 단체들은 베이징의 자본 유출 제한을 우회하기 위해 부동산 시장을 이용하는 중국발 외국인 구매자가 수십 명에 이를 수 있다고 지적하였습니다. 중국의 반응은 연루자들에 대한 즉각적인 인도 요청이었습니다. 이러한 반응은 따뜻했던 관계 호전이 갑작스러운 종말을 맞을 수 있음을 시사합니다."
 econ_costello_events.4.a: "좋은 투자도 처벌을 피하지 못하는구나..."
 costello_in_the_mines.1.t: "광산 기업들의 반격"
 costello_in_the_mines.1.d: "조사가 발표되기도 전에 소식이 대형 광산 기업들에게 새어 나갔으며, 이들은 이제 위원회의 활동을 늦추기 위해 가능한 모든 수단을 우리에게 쏟아붓고 있습니다. 이미 십여 건의 법적 이의가 제기되었고, 몇몇 광산은 항의의 뜻으로 이미 문을 닫았습니다. 설상가상으로 언론도 그들에 합세하는 듯합니다. \n\n공식적인 유죄 판결조차 없이 광산들에 대해 우리가 쌓아 둔 호의는 사실상 증발하였고, 일부 거물들은 원네이션과 같은 야당 및 더 민족주의적인 정당에 자금을 대는 쪽으로 움직여 당이 향후 자금 확보에서 난처한 처지에 놓였습니다. 우리는 말 그대로 벌집을 제대로 걷어찼습니다."
 costello_in_the_mines.1.a: "썩은 부분은 어떤 대가를 치르더라도 도려내야 한다."
 costello_in_the_mines.2.t: "조사 결과"
 costello_in_the_mines.2.d: "위원회가 마침내 조사 결과를 우리에게 제출하였는데, 그 결과는 충격적입니다. 특히 운송 부문을 중심으로 수십 곳의 광산에서 수백 명의 노동자가 불법 고용된 것으로 밝혀졌습니다. 일부는 수년간 해당 기업에서 일해 왔습니다. 광산 기업들의 반응은 예상대로 조용한 상태이며, 법적 절차가 진행되는 동안 우리는 갑자기 국내에 있게 된 수백 명의 새 이주민을 어떻게 처리할지라는 어려운 결정을 안게 되었습니다."
 costello_in_the_mines.2.a: "불투명한 산업이다."
 costello_in_the_mines.3.t: "노동자 처리"
 costello_in_the_mines.3.d: "조사 결과로 삼백 명이 넘는 이주민이 국내에 거주하고 있는 것으로 확인되었습니다. 그중 거의 절반은 2년 넘게 광업 부문에서 일해 왔습니다. 언론과 우리 내각 일부는 현재 우리가 가진 권한으로 즉시 이들을 추방해야 한다고 강력히 주장하고 있습니다. 그러나 이주민들의 숙련 수준을 고려하면, 계속 일할 수 있도록 임시 비자를 발급할 수도 있습니다. 그렇게 하면 광산들의 갑작스러운 수익 손실은 막을 수 있겠으나, 인기 있는 조치는 되지 못할 것입니다."
 costello_in_the_mines.3.a: "추방하라."
 costello_in_the_mines.3.b: "머물게 하라."
 costello_in_the_mines.4.t: "아라비아의 제안"
 costello_in_the_mines.4.d: "왕세자 겸 총리 [SAU.GetLeader]이(가) 이 요청과 관련하여 직접 접촉해 왔습니다. 그들은 오스트레일리아에 대한 자국의 투자를 막는 일부 제한을 해제해 주는 대가로, 우리의 현행 핵심 광물 채굴에 대규모 투자를 제안하고 있습니다. 그들은 특히 우리의 스포츠에 관심을 보였으며, 그들의 투자를 허용하면 우리 엔터테인먼트 산업의 영향력이 크게 확대될 수 있으나, 검증하기 어려운 나라에 문을 열어 주는 셈이 될 것입니다."
 costello_in_the_mines.4.a: "공정한 제안이다."
 costello_in_the_mines.4.b: "너무 가까워지지는 말자."
 costello_republic_events.1.t: "상원의 벽을 오르며"
 costello_republic_events.1.d: "의회를 통해 공화국 문제를 밀어붙이려던 지난 시도와 달리, 지금까지는 표가 우리에게 유리하지 않습니다. 강경파 토니 애벗은 1999년과 마찬가지로 다시 한번 반공화제 진영에 합류하여 질의 시간 동안 대변인 역할을 하며 사실상 당을 분열시키고 있습니다. 언론에서 우리를 곤란하게 만드는 그의 재주 또한 유감없이 발휘되고 있으며, 그는 기회만 있으면 우리에 반대하는 운동을 벌이고 있습니다. \n\n국민투표에 부치기도 전에 상원 통과조차 하지 못한다면 우리의 가능성은 물거품이 되며, 당내에 남은 제한적인 지지마저 무너지기 시작하고 있습니다. 표를 긁어모을 다른 방법을 모색해야 할 수도 있습니다."
 costello_republic_events.1.a: "험난한 길이 앞에 놓여 있다."
 costello_republic_events_abbott_tt: "§Y야당은 앞으로 우리에게 맞서 활동할 것입니다.§!"
 costello_republic_events.2.t: "표 확보"
 costello_republic_events.2.d: "케빈 러드는 의회에서 단연 가장 느끼한 정치인이었다. 하워드는 그를 싫어했고, 그의 당조차 그를 좋아하는 것 같지 않았다. 어떻게든 슬그머니 노동당의 정상까지 올라온 그는 이제 우리가 표를 얻는 데 가장 큰 걸림돌이었다. \n\n러드는 국회의사당 바로 바깥의 카페 한 곳에서 만나자고 요청했는데, 아마도 근처의 파파라치들에게 자신과 [GetASTLeaderTitle]이(가) 함께 있는 사진을 찍을 기회를 주려는 분명한 목적이었을 것이다. 자신을 띄우고 우리에게 흙탕물을 끼얹을 수 있다면 무엇이든 마다하지 않았다. \n\n그는 늘 그렇듯 늦게 도착했고 식사까지 하고 가겠다고 고집했다. 오리 팬케이크와 스테이크, 그게 뭔지는 몰라도, 이것들이 주문되었고, 그제야 러드는 본론에 들어갔다. 노동당은 메디케어의 새로운 확대안을 통과시키려 하고 있었는데, 이는 틀림없이 우리 당에 의해 부결될 것이었다. 가장 단순하게 말해 주고받기였으며, 악수 한 번으로 그는 상원 통과에 필요한 표를 주고 약간의 지지도 우리 쪽에 실어 줄 것이었다. \n\n비록 그 대가는 삼키기 다소 어려웠지만."
 costello_republic_events.2.a: "우리에게 선택지가 있는가?"
 costello_republic_events.3.t: "이례적인 승인"
 costello_republic_events.3.d: "법안을 총독에게 전달하자, 놀랍게도 총독은 아무런 문제 없이 서명하였습니다. 그들은 우리를 돕는 데도 열의를 보이는 듯하며, 언론에서 공화제라는 구상을 지지하는 데까지 나아갔습니다. 이제 총독의 승인을 얻었으므로 새 헌법에 다른 조항을 추가하는 것도 고려할 수 있습니다. 물론 일이 끝난 것은 아닙니다. 상원에 다시 보내기 전에 여전히 대중의 지지가 필요합니다. 1999년과 달리 이번에는 대중을 계속 결집시켜야 하며 기세가 꺾이도록 두어서는 안 됩니다."
 costello_republic_events.3.a: "그렇다면 시작하자."
 costello_republic_events.4.t: "오스트레일리아인들의 군주제 폐지"
 costello_republic_events.4.d: "오늘 시드니와 다른 주요 도시에는 초록, 노랑, 파랑 깃발이 곳곳에 걸렸습니다. 이는 국민투표 결과를 기대하며 오스트레일리아 공화국 운동이 벌인 활동입니다. 오늘 개표 결과 공화제 찬성이 63퍼센트에 달했으며, 필요한 5개 주 중 4개 주가 이를 지지하였습니다. 법안이 법률로 인정되려면 여전히 의회를 통과해야 하지만, 이 결과로 오스트레일리아의 군주주의는 사실상 폐지되었습니다. \n\n총독의 직위는 폐지되고 새로운 국기가 제정되어야 하며, 총리의 직함도 곧 새로운 정부 체제를 반영하여 바뀔 것입니다. 공화제 지지자들은 남은 하루를 거리에서 축하하며 보냈고, 현상 유지에 실패한 반대 운동의 지도자인 자유당 정치인 토니 애벗도 이번 변화가 오스트레일리아를 \\"빛나는 미래\\"의 궤도에 올려놓았음을 인정하였습니다."
 costello_republic_events.4.a: "드디어."
 costello_republic_events.4.b: "놀라운 변화다."
 costello_in_the_mines.5.t: "거물과의 면담"
 costello_in_the_mines.5.d: "루퍼트 머독과의 면담을 잡는 것은 어렵지 않았다. 마침 뉴스코프 최고경영자가 피터의 사무실에 정기적으로 연락해 왔고, 정책을 논의하고 싶어 안달이 나 있었다. 어찌어찌 그들이 마지막으로 이야기한 지 5년이 흘렀지만, 다시 만났을 때 루퍼트는 하루도 늙지 않은 듯 보였다. \n\n대부분은 그가 뉴스코프의 수장이며 그와 함께 신문의 절반을 쥐고 있다는 것을 알았지만, 그가 얼마나 많은 광산 프로젝트와 얽혀 있는지 아는 이는 드물었다. 피터가 광업세 개혁이라는 구상을 꺼내려 할 때마다 루퍼트는 번번이 손사래를 쳤다. 거물의 승인을 받는 것이 일의 시작이 되어야 했으나, 기회는 빠르게 가라앉고 있었다. \n\n마침내 광산 이야기에 이르자 루퍼트는 질롱과 블루칼라 유권자 이야기를 끝도 없이 늘어놓았다. 피터의 지역구가 질롱이었으니 그 요점이 그에게 와닿지 않을 리 없었지만, 한 가지라도 건지려면 지금 말해야 했다. \n\n\\"5년의 성장 끝에 세제 개혁이 그리 과도한 것은 아닐 겁니다. 나머지 우리에게도 일종의 보상이 있어야 하지 않겠습니까-\\" \n\n\\"보상?\\" 루퍼트는 노인의 입에서 그 단어가 욕설이라도 되는 것처럼 매달렸다. \\"당이 예전에는 '큰 정부'에 반대했던 것이 기억나는군. 지금 당에 무엇이 필요한지는 자네도 잘 알 거라 믿네.\\" \n\n그렇게 끝을 맺으며 루퍼트는 시간을 내 주어 고맙다고 인사했고 두 사람은 작별했다. 기대했던 디딤돌은 전혀 되지 못했으며, 사실 코스텔로는 그 면담을 어떻게 받아들여야 할지조차 알 수 없었다. 그저 자신이 하워드보다 못하지 않기를 바랄 수밖에 없었다."
 costello_in_the_mines.5.a: "불편한 심정이다."
 costello_republic_events.5.t: "의회의 새벽"
 costello_republic_events.5.d: "코스텔로가 연방 수립 이래 처음이라고밖에 상상할 수 없는 활기로 국회의사당 전체가 축제 분위기에 휩싸여 있었다. 거의 모든 일터에 깃발과 현수막이 걸려 있었다. 정치인들이 동네 술집에 가 있거나 식당에서 축하하고 있어서 건물의 절반은 비어 있었다. \n\n휴대용 TV 주위에 모여 있는 인파를 헤치고 지나가던 그는 그들이 보고 있는 것을 얼핏 보았다. 하버 브리지 주변에서 펼쳐지는 조명쇼였는데, 머리 위로 불꽃이 쏘아 올려지는 가운데 새 국기를 불꽃으로 형상화한 것이 다리에 걸려 있었다. 야당마저도 어떤 식으로든 축하하고 있음이 분명했다. 우리나라는 마침내 다음의 큰 도약을 이루었다. 우리는 사춘기에서 기어 나온 것이었다. \n\n연회장은 이 행사에 걸맞게 화려했고, 코스텔로가 도착해 연설용 카드를 정리하기 시작했을 때 군중 속에서 낯익은 얼굴을 발견했다. 존 하워드가 직접 파티에 모습을 드러낸 것이었다. 코스텔로는 연단에서 한 걸음 내려와 옛 동료인 전직 총리를 맞으러 걸어가지 않을 수 없었다. \n\n두 사람의 손이 맞잡혔고, 하워드는 풍상에 시달렸지만 자랑스러운 표정으로 미소를 지었다."
 costello_republic_events.5.a: "\\"잘했네, 친구. 정말 잘했어.\\""
 commonwealth_games_ast.1.t: "[GetYear]년 영연방 경기 대회"
 commonwealth_games_ast.1.d: "올해 영연방 경기 대회를 치르기 위해 71개 국가, 영토 및 단체에서 온 5,000명이 넘는 선수들이 오스트레일리아 멜버른에 모였습니다. 1956년 하계 올림픽과 같은 장소에서 개막하며 하늘을 나는 전차와 대미를 장식하는 불꽃놀이 등 다수의 볼거리를 갖춘 이번 대회에서는 17개 종목이 선보일 예정입니다. \n\n대회 역사상 처음으로 여왕의 바통은 대회에 참가하는 모든 영연방 국가와 영토를 하나도 빠짐없이 방문하였으며, 그 여정은 18만 KM(11만 2,500마일)에 달했습니다. 이는 영연방 국가들 간의 장기적인 헌신과 깊은 유대를 보여 줍니다."
 commonwealth_games_ast.1.a: "우리의 공유된 가치는 경쟁적인 스포츠 속에 살아 있다."
 commonwealth_games_ast.1.b: "대단한 구경거리다."
 costello_republic_events.6.t: "어깨를 맞대고"
 costello_republic_events.6.d: "총리의 부총리인 알렉산더 다우너는 코스텔로가 계획을 펼치는 동안 의자에 몸을 기대고 있었다. 다우너는 포커페이스에 재능이 있었다. 입을 열기 전에는 그가 무슨 생각을 하는지 도저히 알 수 없었고, 코스텔로가 그를 택한 것도 그가 좀처럼 입을 열지 않기 때문이었지만, 이번에는 그의 얼굴에서 놀람이 보였다. 설명이 끝나자 다우너는 몸을 앞으로 숙이고 총리가 예상하던 말을 던졌다. \\"이번에도 99년의 재판이 되지 않으리라는 걸 어떻게 아나?\\" \n\n그 질문은 전 과정에 걸쳐 코스텔로의 머릿속을 떠나지 않았다. 1999년 국민투표 같은 또 다른 실패를 피할 수 있을지, 아니 의회를 다시 통과시킬 수나 있을지 확신할 수 없었다. 어느 것도 보장된 것은 없었지만 시도는 해야 했다. \n\n잠시 말다툼이 오간 뒤 다우너는 어깨를 으쓱하며 돕겠다고 동의했다. 그들은 미지의 영역으로 비틀거리며 들어서고 있는지, 아니면 너무나 익숙한 수렁에 빠지고 있는지 알 수 없었다. 적어도 이 배에서 함께 가라앉는 처지가 되었다. 하지만 다우너가 도무지 알 수 없는 것이 한 가지 있었다. \n\n\\"내가 자네를 총리라고 불러야 하나, 아니면 대통령 각하라고 불러야 하나?\\""
 costello_republic_events.6.a: "그리고 논쟁은 계속되었다."
 labor_factionalism.1.t: "노동당 파벌주의"
 labor_factionalism.1.d: "노동당은 연립은 아닐지 몰라도 자체적인 파벌을 가지고 있습니다. 그중 두 파벌이 가장 큰 발언권을 갖고 있습니다. 좌측에는 복지 확대, 메디케어 강화, 경제 개입과 같은 사회적으로 진보적인 정책을 옹호하는 민주사회주의자들이 있습니다. 케빈 러드는 대체로 이 쪽을 대표합니다. 반대쪽에는 보다 중도적인 부류가 있습니다. 이들 중 다수는 '제3의 길' 경제 원칙을 따르는데, 이는 사람들에게 '베풂'이 아닌 '도움의 손길'을 주는 것을 목표로 하는 재정 보수적 정책이며 기업의 이해관계에 더 기울어 있습니다. \n\n노동당 우파를 대표하는 이는 현재 부[GetASTLeaderTitle]을(를) 맡고 있는 줄리아 길러드입니다. 국가의 이익을 위하여 러드와 길러드는 정책 수립에서 꾸준히 협력하고 있으나, 둘 사이에는 서로의 영역을 침범하지 않기로 한 암묵적 합의가 존재합니다. 어느 한쪽으로 지나치게 기울면 동맹에 긴장이 생기거나 당 전체가 갈라질 수도 있습니다. \n\n선거 운동 기간 중 우리는 기후 정책 방향에 따라 §Y배출권 거래제§!를 시행하겠다는 공약도 했습니다. 당이 우리의 리더십에 의문을 품기 시작하는 일이 없도록 첫 임기 내에 이 제도를 통과시켜야 합니다."
 labor_factionalism.1.a: "위태로운 과업이다."
 rudd_apology.1.t: "국가적 사과"
 rudd_apology.1.d: "케빈 러드의 새 임기가 시작된 지 불과 몇 달 만에 [GetASTLeaderTitle]은(는) 오스트레일리아의 원주민인 애버리지니와 토러스 해협 섬 주민들에 대한 역사적 잘못에 관하여 공식 '사과'를 담은 대국민 연설을 했습니다. \n\n1997년 '그들을 집으로 데려오다' 보고서에 기초한 이 역사적 행위는 [GetASTLeaderTitle]이(가) 국회의사당에서 발표하였으며, 이후 오스트레일리아 전역에 감정적인 충격파를 일으켰습니다. 대강당과 의회 밖 잔디밭에 모인 군중은 환호하고 박수를 보냈습니다. 수천 명이 비를 맞으며 시드니 거리에 모여 이 기념비적인 연설을 지켜보았습니다. \n지역 사회는 깊은 안도와 치유의 감정을 느꼈으며, 많은 이들이 이전 정부들의 무대응을 바로잡으려는 러드의 노력을 환영하고 있습니다."
 rudd_apology.1.a: "이제야."
 tackle_mining_oligarchy_ast.1.t: "세금을 둘러싼 담소"
 tackle_mining_oligarchy_ast.1.d: "러드는 자신의 책상에서 켄의 사무실까지 걸어가는 것이 싫었다. 의사당 복도는 병동처럼 새하얀 단색이어서, 건물 안팎에서 겪은 여러 나쁜 기억들을 불러일으켰다. 그는 새로 설치된 '켄 헨리'라는 명패 바로 아래의 문을 두드렸다. \n\n그가 들어서자 켄은 위원회의 나머지 사람들이 점잖게 \\"헨리 보고서\\"라고 부르는 세제 검토 작업에 여전히 몰두하고 있었다. 켄은 러드보다 겨우 몇 살 위였지만 구세대 같은 분위기가 있었다. 새 [GetASTLeaderTitle]에게 자주 조언을 늘어놓는 버릇은 도움이 되지 않았다. \n\n이 검토는 광업 이윤을 다룰 것으로 예상되었고, 러드는 세부 사항을 전부 알고 싶어 했다. 두 사람은 초과이윤세와 공정한 시행이라는 구상을 두고 꽤 여러 시간 수다를 떨었고, 마침내 켄은 두 손을 들고 집으로 향했다. 러드는 그렇지 않았다. 그의 밤은 이제 막 시작되었으나, 일을 굴러가게 하려면 도움이 필요했다."
 tackle_mining_oligarchy_ast.1.a: "게임을 아는 사람."
 tackle_mining_oligarchy_ast.2.t: "물러설 수 없는 처지"
 tackle_mining_oligarchy_ast.2.d: "러드의 또 한 번의 늦은 밤 의회는 웨인 스완과 함께 보내졌다. 스완은 언론이 러드의 최측근이라 부르는 \\"4인방\\" 중 한 명이었다. 나머지 두 명은 줄리아 길러드와 린지 태너였다. \n\n케빈은 한참 동안 입법 계획을 검토했고 이미 자신의 사무실에서 이를 작업하는 보좌관 팀을 꾸려 놓았지만, 스완은 계획의 성공에 필수적이었다. 재무장관으로서의 경험으로 나머지가 놓칠 수 있는 것을 짚어낼 수 있다는 점뿐만 아니라, 그가 전체 계획에 정당성을 더해 주었다. 러드는 여전히 정치적으로 다소 외부인처럼 보였다. 스완의 이력을 문제 삼는 사람은 아무도 없었다. \n\n\\"자네는 지금 우리 정치의 근간을 건드리려는 걸세. 우리 쪽 사람들 상당수가 광산의 후원을 받고 있지. 우리가 이렇게 하면 그들은 기뻐하지 않을 걸세. 가진 걸 모조리 동원해 우리를 공격할 거야. 추해질 걸세.\\" \n\n\\"우리가 더한 것도 겪어 봤잖아, 그렇지?\\" 케빈은 초조하게 코를 긁으며 웃었지만, 웨인은 동요하지 않았다. 그는 걱정스러운 표정으로 케빈을 가만히 바라보기만 했으나, 그럼에도 돕겠다고 동의했다. \n\n어느 시점부터는 모두가 같은 처지였고, 케빈은 웨인이 자신의 정부가 가라앉는 것을 바라지 않을 것이라 믿었다. 그들은 함께 폭풍 속으로 항해해 들어갈 것이었다."
 tackle_mining_oligarchy_ast.2.a: "쉬울 리가 없었다."
 pink_batts_ast.1.t: "핑크 뱃츠 참사"
 pink_batts_ast.1.d: "주택 단열 프로그램과 관련하여 최악의 시나리오가 벌어진 것으로 보입니다. 상당수의 시공이 장기적으로 실패하였고, 더 나쁘게도 시공 중 노동자 네 명이 사망하였습니다. 세 명은 감전사, 한 명은 고열증으로 사망하였습니다. 이미 왕립 위원회가 요청되었으며, 금전적 피해를 입은 것으로 보이는 공급업체와 시공업체들의 대규모 집단 소송이 우리에게 제기되었습니다. \n\n이를 재앙이라고 부르는 것은 오히려 과소평가일 수 있습니다. 정치적 여파만으로도 우리를 가라앉힐 가능성이 있습니다. 우리는 즉시 이 제도를 중단하고 리콜 프로그램으로 후속 조치를 취해야 합니다."
 pink_batts_ast.1.a: "어떻게 이런 일이 벌어질 수 있었나?"
 bob_brown_event.1.t: "별난 인물 밥 브라운"
 bob_brown_event.1.d: "밥 브라운은 호기심을 자아내는 인물이었다. 그의 행동주의와 환경에 대한 집착은 그에 비하면 러드를 산업가처럼 보이게 만들 정도였고, 환경 운동가들은 그런 그를 사랑했다. 그가 녹색당의 사실상 창립자라는 점은 놀랍지 않았다. 10년이 훨씬 지난 지금도 그는 당 안에서 전혀 도전받지 않았다. 오히려 당은 그를 대표 얼굴로 내세웠는데, 러드의 눈에는 그 자체가 개인숭배에 가까웠다. \n\n브라운은 점심을 함께하며 지금까지는 다소 적대적이었던 협력 문제를 논의하기 위해 수도로 올라오기로 동의했다. 도착했을 때 브라운은 미소가 만연했고 재빨리 악수를 청했다. 그들은 인근 카페 한 곳에서 점심을 먹었는데, 안타깝게도 야외 자리여서 거의 언제나 끔찍한 캔버라 날씨에 고스란히 노출되었다. 어쩌면 정치인들이 모두 짜증을 내는 이유가 그것일지도 모른다. \n\n전화상으로는 녹색당의 지지가 이미 확보된 것처럼 보였지만, 러드가 다시 검토하자 브라운은 그저 고개를 저었다. 이미 상당히 야심 찬 내용임에도 그는 더 나아가기를 원했고, 상원을 합리적으로 통과할 수 있는 수준이 어디까지인지 현실을 일깨우려 할 때마다 브라운은 꿈쩍도 하지 않았다. \n\n녹색당이 가진 어떤 미미한 영향력이든 그는 지금 그것을 쓰고 있었고, 러드의 인내심이 바닥나기 시작했다. 마침내 악수를 나누었을 때 러드는 노동당이 크게 가거나 빈손으로 돌아가야 한다는 것을 깨달았다."
 bob_brown_event.1.a: "그리고 중간은 없었다."
 school_visit_rudd.1.t: "쿠퍼루 산책"
 school_visit_rudd.1.d: "케빈과 수행원들은 교장을 만나 학교를 둘러보기 위해 정오에 학교에 도착했다. 누군가 언론에 귀띔한 것이 분명했는데, 그들이 들어서자마자 기자들이 우르르 몰려들어 곧 완전히 포위되었기 때문이다. \n\n기자들의 입에서는 으레 나오는 질문이 터져 나왔다. \\"정부가 개혁에서 후퇴하고 있습니까? 노동당은 재정 보수적이겠다는 공약을 어기고 있습니까?\\" \n\n러드는 최선을 다해 그들을 무시하며 최소한 교장과 보수 공사에 관한 이야기는 나누려 했다. 그들은 가까스로 문 하나를 통해 빠져나와 새 농구장이 지어진 안뜰로 갔는데, 이곳은 강당 역할도 겸하고 있었다. 새 건물은 근사하긴 했으나, 바로 옆의 훨씬 오래된 건물들과 대비되어 눈에 다소 거슬렸다. \n\n현대적 디자인의 역병이 마침내 쿠퍼루 주립 학교에도 닿은 것이다. 그러나 새로운 개선 사업은 이런 학교들에, 형편이 더 나쁜 학교들에는 더욱 큰 도움이 될 것이었다. 그들이 안으로 들어서자 아이들이 줄지어 따라와 기자들을 밀치고 질의응답 시간을 가졌다. [GetASTLeaderTitle]이(가) 먼저 시작했다. \n\n\\"자, 여기 오게 되어 정말 기쁘군요. 손을 들어 보세요, 이 새 강당에서 가장 마음에 드는 점이 뭔가요?\\" \n\n\\"의자에 앉을 수 있어요.\\" 한 학생이 대답했다. \n\n \\"의자에 앉을 수 있다니 - 그건 큰 차이로군요!\\""
 school_visit_rudd.1.a: "정말 그랬다..."
 gayvote_rudd.1.t: "오스트레일리아, 혼인 평등에 찬성"
 gayvote_rudd.1.d: "동성 결혼의 합법화가 자율 투표 방식의 국민투표에 부쳐진 결과, 오스트레일리아인의 61.6퍼센트가 찬성하여 이 법안이 하원과 상원을 통과할 수 있는 청신호를 켜 주었습니다. 투표율은 79.5퍼센트로, 수백만 명이 변화를 결정하기 위해 표를 던졌으며, 그 결과 법률 통과는 앞으로 몇 달 안에 비준될 것으로 예상되어 결혼을 원하는 국내 동성 커플들은 크게 기뻐하고 있습니다.\n\n노동당 장관 빌 쇼튼은 시드니에서 군중과 함께 변화를 축하하였고, 이 법안을 지지한 [GetASTLeaderTitle]과(와) 야당 의원 맬컴 턴불의 노력에 환호를 보냈습니다. \n\n\\"오스트레일리아인이 되기에 얼마나 멋진 날입니까. 이제 여야 모두가 변화를 맞을 준비가 되어 있고 국민의 목소리를 지지하고 있습니다.\\""
 gayvote_rudd.1.a: "사랑이 승리한다!"
 unite_the_nation_speech_ast.1.t: "케빈 러드, 대국민 연설"
 unite_the_nation_speech_ast.1.d: "새 [GetASTLeaderTitle]은(는) 오스트레일리아 역사에 \\"새로운 장\\"을 쓰겠다는 의지를 밝혔으며, 이는 현재 국가 전역에 존재하는 불평등의 격차를 좁히는 것을 목표로 합니다. 새로운 사회 및 경제 프로그램의 계획이 개괄되었으며, 러드는 이전 세대의 성과를 훨씬 뛰어넘는 것을 목표로 한다고 발표하였고, 이후 오스트레일리아 원주민들의 개인적인 이야기가 낭독되었습니다. \n\n[GetASTLeaderTitle]은(는) 애버리지니 및 토러스 해협 섬 주민들과의 더욱 긴밀한 동반자 관계를 강조하며 \\"약속과 실행 사이의 격차를 좁히겠다\\"는 말로 연설을 마쳤습니다. \n\n지금까지 연설은 호평을 받았으나, 구체적인 변화 없이 이 호의가 얼마나 오래갈지는 아무도 알 수 없습니다."
 unite_the_nation_speech_ast.1.a: "제 이름은 케빈이고, 퀸즐랜드 출신이며, 도우러 왔습니다."
 something_to_give_ast.1.t: "내줄 수 있는 것"
 something_to_give_ast.1.d: "그녀가 작은 아파트를 서성이는 동안 휴대전화에서는 센터링크의 신호음이 울렸다. 상담원과 연결되기를 기다리며 이미 거의 한 시간째 대기 중이었고, 시계가 오후 5시에 가까워질수록 희망은 말라 가고 있었다. 그녀는 이제 막 그날의 수업을 마쳤지만, 이번에도 누군가와 통화하지 못하면 내일 다시 매달려야 했다. 끝없는 쳇바퀴 같았다. \n\n마침내 전화기가 지직거리더니 목소리가 들려왔다. 그녀는 지체 없이 자신의 사정을 상대에게 쏟아냈다. 풀타임으로 공부하고 있었는데 일자리 구하기는 번번이 실패하여 청구서는 쌓여 가고 있었다. 복지 지원을 받아도 지급액은 충당하기에 부족했고, 이사를 가고 학업을 중단해야 할지도 모른다는 두려움은 점점 현실이 되어 가고 있었다. 그녀에게 필요한 것은 조금 더 많은 시간뿐이었다. \n\n수화기 너머의 목소리는 동정적이었으나 그녀만큼이나 지쳐 있는 듯했고, 그녀가 해당되는 지원은 없는 것 같았다. 그녀는 주방 조리대를 타고 바닥에 주저앉았다. 빠져나갈 길은 없었다. 상담원은 잠시 대기해 줄 수 있는지 물었고, 그녀는 다시 혼자가 되었다. 울 기운조차 없었고, 운다고 달라지는 것도 없었다. 늘 이런 식이었다. \n\n갑자기 상담원이 돌아왔다. 바로 그 주에 수급자가 긴급 지급을 신청할 수 있는 새로운 제도가 시작되었다는 것이었다. 상환금은 이후 지급액에서 조금씩 공제될 것이며, 많지는 않지만 집세는 충당할 수 있고 그녀는 계속 공부할 수 있을 터였다. 그 소식은 벅찼다. 통화가 끝나자 그녀는 기뻐서 벌떡 일어났고, 뺨을 타고 눈물이 흐르기 시작했다."
 something_to_give_ast.1.a: "작은 도움이 큰 힘이 된다."
 bill_of_rights_ast.1.t: "법령 통과"
 bill_of_rights_ast.1.d: "결국 하원과 상원 양측 모두가 이를 통과시키는 과정에서 필사적으로 우리와 맞섰습니다. 우리는 내용을 적절한 수준으로 희석시켰지만, 그래도 시작입니다. 표현의 자유법의 확대, 집회의 권리, 공정한 재판, 법 앞의 평등, 고문으로부터의 자유 등을 제공하는 '오스트레일리아 연방 인권법'이며 이 목록은 계속됩니다. \n\n우리는 애버리지니와 토러스 해협 섬 주민들에 대한 폭넓은 보호를 포함하여 우리 역사상 가장 큰 규모의 시민권 입법을 시행하게 될 뿐 아니라, 이는 앞으로 모든 세대의 오스트레일리아인이 법의 보호를 받도록 하는 기반을 놓는 일입니다. \n\n당분간은 모든 것을 비준하고 앞으로 몇 달간 시행을 시작해야 하지만, 이는 분명 우리 국가의 성숙을 위한 큰 걸음처럼 느껴집니다."
 bill_of_rights_ast.1.a: "그 결실을 누릴 사람들을 위하여."
 rudd_nz_deal.1.t: "웰링턴으로"
 rudd_nz_deal.1.d: "러드는 위에서 내려다보는 산의 풍경을 놓치지 않기 위해 이른 아침 비행기에 올랐다. 키위의 땅이 오스트레일리아를 앞서는 것이 있다면 그것은 풍경이었다. 그들의 외교부는 그곳에서 반지의 제왕을 촬영했다는 사실을 상기시키기를 좋아했으며, 그 이유는 수수께끼가 아니었다. 그가 서명하러 간 트랜스태즈먼 무역 협정은 양국 경제를 사실상 하나로 묶을 것이었는데, 이것이 진작 체결되지 않았다는 점이 러드에게는 놀라웠다. \n\n총리 [NZL.GetLeader]은(는) 비행기에서 내릴 때 가장 먼저 악수를 청할 만큼 빨랐고, 공항 외교 라운지로 회담을 이끌었다. 서류를 함께 검토해 보니 재화와 서비스에 대한 거의 모든 관세와 무역 장벽을 철폐하는 등 통상적인 내용으로 모든 것이 좋아 보였다. 이제 그들의 총리가 기다리던 순간이었다. \n그들은 협정의 첫 번째 조치로 오스트레일리아가 뉴질랜드의 산업 중심지에 투자하는 것을 제안했고, 이어 향후 수십 년간의 수익을 열거했다. 모두 타당했지만, 처음부터 그토록 많이 투자하는 것이 정말 그만한 가치가 있을까?"
 rudd_nz_deal.1.a: "좋다."
 rudd_nz_deal.1.b: "지금은 무역 협정이면 충분하다."
 rudd_visit_ast.1.t: "한국 접근"
 rudd_visit_ast.1.d: "한국에 도착한 뒤 첫 일정 중 하나는 부산 기념 묘지에서의 사진 촬영이었다. 러드는 다행히 어떤 전쟁에도 싸운 적이 없었다. 현직인 오스트레일리아 장관 중 누구도 한국 전쟁 당시에는 태어나지도 않았으며, 그의 최우선 과제 중 으뜸은 또 다른 그러한 분쟁을 피하는 것이었다. \n\n기념관은 거대했고 가까이서 보면 상당히 인상적이었다. 묘지 전체가 정원이었고 거의 모든 묘비에 꽃이나 관목이 놓여 있었다. 세계 각국의 깃발이 그 곁을 지키고 있었다. 한국인들은 매일 머리 위에 전쟁의 위협이 드리워져 있으니 당연히 동맹국들을 매우 가까이 두었다. \n\n마침내 국회로 돌아왔을 때, 한국 대통령 [KOR.GetLeader]은(는) 태평양 연합이라는 구상에 긍정적으로 답했지만 단서 조항에 대해서는 솔직했다. 늘 그렇듯 우리의 방위 보장이 조건이었고, 이는 상당히 확고해 보였다. 그들은 북한이 미사일을 쏘면 우리도 미사일을 쏘고, 함대를 보내면 우리의 함대가 대기하고 있다는 것을 확실히 하기를 원했다. 이 구상에는 분명 장점이 있었지만, 현상을 뒤흔들 만한 가치가 있을까?"
 rudd_visit_ast.1.a: "우리는 함께한다."
 rudd_visit_ast.1.b: "위험을 감수할 가치가 없다."
 rudd_visit_ast.1.c: "\\"우리는 이미 당신들과 함께합니다.\\""
 rudd_visit_ast.2.t: "오사카 상공을 날며"
 rudd_visit_ast.2.d: "일본은 새로운 경제 질서를 성큼성큼 받아들였다. 90년대 GDP 순위 정상을 향한 그들의 질주는 매우 감탄스러웠지만, 진정한 증거는 그들의 도시들이었다. 오사카 상공을 나는 것은 십여 개의 타임스 스퀘어를 내려다보는 느낌이었다. 우리의 가장 도시화된 도시들조차 자본주의에 보내는 네온 연서처럼 빛나는 그들의 도시에는 발끝에도 미치지 못했다. \n\n그들은 도쿄에 착륙했고 대표단 회담이 시작되었다. 일본은 한 달 전에 길게 논의한 적이 없는 안건이 방금 막 제기된 것처럼 회담을 다루었다. 러드는 그들이 시간을 끌고 있는 것인지 의아했지만, 결국 그들은 하나의 요구를 제시했다. \n\n태평양 경제 연합의 어떤 전제든 중국이 해상 영토를 확정하겠다는 것에 대한 보장을 포함해야 했다. 섬을 건설하고 해군 통제력을 확장하는 중국의 습관은 일본을 불안하게 하고 있었으며, 일본은 우리가 그들 사이에서 중개자 역할을 하면 좋은 출발이 될 수 있다고 믿었다."
 rudd_visit_ast.2.a: "조건은 제시하되 그 이상은 하지 않겠다."
 rudd_visit_ast.3.t: "베이징의 답변"
 rudd_visit_ast.3.d: "긴 귀국 비행 끝에 러드는 약간의 패배감을 느끼지 않을 수 없었다. 중국의 외교 장관단은 그를 회의실에서 비웃으며 내보내다시피 했다. 논의가 순조로웠음에도 베이징은 태평양 경제 연합이라는 개념에 비관적이었다. 아세안(ASEAN)의 장점이 현재로서는 충분히 효과가 있었고, [CHI.GetLeader]은(는) 이웃 강대국들과 새로운 어떤 것도 중재하려 하지 않았다. \n\n완전한 손실은 아니었기에, 회담은 적어도 무언가로 이어졌다. 팀은 양국 간의 보다 개방적인 무역 협정을 구상하는 데 오랜 시간을 들여 논의하였고 우리에게 새로운 협정을 제안하였다. 새 협정은 광범위한 중국산 수입품을 대상으로 하며, 그 대가로 우리의 석탄과 기타 광물 수출에 사실상 무관세 무역을 허용한다. \n\n회담이 무산된 것에 대한 수긍할 만한 위안이다."
 rudd_visit_ast.3.a: "나쁘지 않다."
 rudd_visit_ast.4.t: "매화"
 rudd_visit_ast.4.d: "중국 외교 장관은 베이징이 일본과의 영토 경계를 재협상할 의향이 있다고 우리에게 전했습니다. 이는 시작에 불과할지 모르지만, 그들이 이 요구에 호응하고 있다는 사실은 우리가 얼마나 멀리 왔는지를 보여 줍니다. 그들은 우리가 일종의 중립적 참관자로서 논의에 참여해 줄 것을 요청했으며, 이는 분명 몇 년이 걸릴 것입니다. \n\n실제 태평양 연합까지는 아직 거리가 있겠지만, 비록 일시적일지라도 태평양의 평화를 얻기 위해 우리가 내디딘 걸음은 아무리 강조해도 지나치지 않습니다. 베이징은 또한 기존 무역 협정을 개선하여 양국을 경제적으로 더욱 긴밀히 묶고, 장래의 해군 방위 회담도 약속하겠다는 의사를 표시하였습니다."
 rudd_visit_ast.4.a: "우리 시대의 평화"
 gillard_talk.1.t: "나는 부총리를 쏘았다"
 gillard_talk.1.d: "평소의 면담대로 줄리아 길러드는 러드에게 자신이 맡은 정부 부문에 대해 보고하고 있었다. 부[GetASTLeaderTitle]에 취임한 이후 줄리아는 교육, 고용, 직장 관계 부처를 하나로 합친 \\"슈퍼 부처\\"를 맡고 있었다. 관리할 것이 많았지만 러드는 그녀가 감당할 수 있다고 믿었다. 알고 지낸 8년 동안 그녀는 그에게 캔버라에서 가장 약삭빠른 정치인 중 한 명이자 매우 유능한 인물로 비쳤다. \n\n줄리아는 노조에 매우 편향된 정부 때문에 손해를 보고 있다고 느끼는 수많은 기업들이 제기한 최신 불만 사항을 러드에게 설명하며 보고를 시작했다. 물론 대부분은 무시해도 되었지만, 줄리아는 우리가 그들과 좋은 관계를 유지해야 한다고 단호하게 주장했다. 현재의 친기업적 기조에서 벗어나지 않는 한, 우리의 사회 정책을 얼마나 밀고 나가느냐는 별로 중요하지 않았다. \n\n그녀가 말을 마치자 러드는 그녀의 시선이 자신을 꿰뚫는 것을 느낄 수 있었다. 편하게 대화할 때조차 그녀가 어떤 식으로든 자신을 분석하는 듯한 기분이 들었다. 러드는 권고를 고려해 보겠다고 동의했고 그들은 그날 헤어졌지만, 그녀가 얼마나 진지했는지 궁금했다."
 gillard_talk.1.a: "고려해 볼 일이다."
 papua_talks_rudd.1.t: "수용소 보수 공사"
 papua_talks_rudd.1.d: "오스트레일리아는 소액의 해외 보조금을 대가로 자국이 이곳에 건설한 수용소를 보수하겠다고 제안했습니다. 이 수용소들은 거의 완전히 비워진 이후 실제로 쇠락하기 시작했으며, 우리에게 미치는 영향은 매우 적을 것입니다. 이는 그들의 지속적인 이민 문제를 해결하려는 노력으로 보입니다."
 papua_talks_rudd.1.a: "좋다."
 papua_talks_rudd.1.b: "이번에는 아니다."
 papua_talks_rudd.2.t: "파푸아뉴기니, 보수 공사에 동의"
 papua_talks_rudd.2.d: "임대 기간이 끝나가고 있음에도 포트모르즈비 정부는 보수 공사를 시작할 수 있도록 우리가 수용소에 접근하는 것을 허용하기로 동의하였습니다. 이로써 새치기 입국자들을 파푸아뉴기니로 이송할 수 있을 것이며, 앞으로 우리 땅에 상륙하는 일을 억제하기를 기대합니다."
 papua_talks_rudd.2.a: "예상대로다."
 papua_talks_rudd.3.t: "파푸아, 회담 거부"
 papua_talks_rudd.3.d: "금전적 보상 제안에도 불구하고 포트모르즈비 정부는 수용소 보수에 관한 어떠한 논의도 거부하였습니다. 그들은 이 일의 도덕성에 집착하는 듯합니다. 이제 우리는 계속 이곳에서 망명 신청자들을 수용해야 합니다."
 papua_talks_rudd.3.a: "예상치 못한 실망"
 address_the_tiger_event_ast.1.t: "바라트에서의 평화 중재"
 address_the_tiger_event_ast.1.d: "인도와의 회담은 케빈 러드의 임기 시작 때부터, 아니 그 이전부터 이미 정해져 있었다. 태평양에 대한 우리의 전략 목표는 서로 잘 부합하며, 그들은 ADF와 함께 자국 군을 정비하는 데 열의를 보여 왔다. 이제 우리는 중국과 함께 일한다는 구상을 소개하기만 하면 되었다. \n\n뉴델리에서는 정말로 레드 카펫이 깔렸다. [RAJ.GetLeader]은(는) 이 일을 러드가 예상한 것보다 더 크게 만들고 있었는데, 어쨌든 그들의 의사소통 대부분은 그의 책상 위 전화기로 이루어졌기 때문이다. 공식 국빈 방문은 단지 볼거리에 불과했지만, 분명 즐거운 볼거리였다. \n\n하이데라바드 하우스에 모여 협정을 논의하자 군사 파트너십이 즉시 범위가 정해졌고, 당연히 그들도 동의했다. 그다음에 진짜 협상이 시작되었다. 중국이 언급되자마자 회의실의 분위기가 달라졌다. 중국이라는 주제에 관해서라면 대만 대표단에서도 이보다는 더 유화적인 분위기를 찾을 수 있었을 것이다. \n\n러드는 이후 몇 시간 동안 최선을 다해 그들을 설득했지만, 얻어낸 최선은 '다른 나라들이 중국과 협력하기로 동의한 후에' 경제 연합을 고려하겠다는 약속이었고, 이는 기본적으로 거절이었다. 하지만 공식적으로 러드는 그들을 협상 테이블로 데려왔다고 말할 것이었다."
 address_the_tiger_event_ast.1.a: "그것으로 충분했다."
 legislation_rudd_blocked.1.t: "상원에서 법안 저지"
 legislation_rudd_blocked.1.d: "자유당 전체가 우리의 법안 통과에 맞서고 있는 것으로 보입니다. 그들은 교과서에 나오는 모든 수단을 우리에게 쏟아붓고 있으며, 여러 무소속 의원들까지 자신들의 대의에 끌어들였습니다. 이런 상태로는 법안을 통과시킬 수 없으며, 재제출 기간에 필요한 지지를 다지지 못하면 이 법안은 상원에서 폐기됩니다. \n\n통상 다시 상정하려면 3개월을 기다려야 합니다. 그동안 가능성이 낮아 보이더라도 우리의 영향력을 활용하여 더 많은 표를 확보하고 과반을 얻을 수 있습니다. 자유당에게는 접근할 수 없겠지만, 녹색당은 아직 우리 편으로 끌어들이지 못했다면 우리의 개혁에 호의적일 수 있고, 무소속 의원들은 어느 쪽으로든 갈 수 있습니다."
 legislation_rudd_blocked.1.a: "초당적 협력은 물 건너갔군..."
 legislation_rudd_blocked.2.t: "두 번째 표결"
 legislation_rudd_blocked.2.d.a: "우리의 노력에도 불구하고 자유당의 다수는 여전히 굳건합니다. 그들의 모든 절차적 지연과 수정안 요구에도 불구하고 우리는 표결 단계까지 갈 수 있었지만, 34 대 42로 패배했습니다. 무소속 의원들은 모두 자유당과 보조를 맞춘 것으로 보이며, 녹색당은 우리와 함께 표를 던질 만큼 끌리지 않았습니다. \n\n하지만 우리에게 선택지가 완전히 없는 것은 아닙니다. 양원 해산을 요청하여 하원과 상원을 모두 해산하고 조기 총선을 촉발할 수 있습니다. 이는 매우 위험한 책략이며, 시기가 좋지 않다면 의석을 잃을 가능성도 따릅니다. 또한 과반에 필요한 의석을 얻을 유일한 방법일 수도 있습니다. \n\n이 조치는 1987년 이후 발동된 적이 없으며, 길러드는 우리에게 이를 강하게 만류하였습니다. 다음 선거까지 기다릴 수도 있습니다. 그럼에도 그 이전에 통과시키고자 한다면 이 선택지를 쓸 수 있습니다."
 legislation_rudd_blocked.2.d.b: "우리의 노력에도 불구하고 상원에서 자유당의 다수는 여전히 굳건합니다. 그들의 모든 절차적 지연과 수정안 요구에도 불구하고 우리는 표결 단계까지 갈 수 있었고, 녹색당의 지지 덕분에 37 대 39로 근소하게 패배했습니다. 무소속 의원들은 모두 자유당과 보조를 맞춘 것으로 보입니다. \n\n하지만 우리에게 선택지가 완전히 없는 것은 아닙니다. 양원 해산을 요청하여 하원과 상원을 모두 해산하고 조기 총선을 촉발할 수 있습니다. 이는 매우 위험한 책략이며, 현재 우리는 지난 선거에 비해 지지율이 몇 포인트 낮은 상태입니다. 이렇게 빨리 또 다른 선거에 들어가면 총리직을 잃을 수 있습니다. 또한 과반을 얻을 유일한 방법일 수도 있습니다. \n\n이 조치는 1987년 이후 발동된 적이 없으며, 길러드는 다음 임기까지 기다리자고 제안하며 이를 강하게 만류하였습니다. 그럼에도 기세가 남아 있는 지금 통과시키고자 한다면 이 선택지를 쓸 수 있습니다."
 legislation_rudd_blocked.2.a: "행동할 때다."
 legislation_rudd_blocked.2.b: "너무 위험하다."
 legislation_rudd_blocked.3.t: "양원 해산"
 legislation_rudd_blocked.3.d: "도미노가 쓰러지고 해산이 발동된 지금, 조기 총선 일정이 잡힐 것입니다. 첫 번째 관문을 넘었으니 이제 선거 운동에 집중해야 합니다. 우리 당은 여론조사에서 안정적인 흐름을 보이고 있지만, 우리가 허용한다면 자유당이 대중을 흔들 수 있습니다. 현재 그들을 이끄는 이는 우리의 보다 완강한 비판자 중 한 명인 토니 애벗입니다. 그는 지금까지 어떤 공격도 봐주지 않았으니 우리도 맞받아치기를 주저해서는 안 됩니다. \n\n선거일까지 60일이 남았으므로, 앞서 나가고자 한다면 국가를 통제 아래 두고 선거 운동을 계속해야 합니다."
 legislation_rudd_blocked.3.a: "압박이 시작되었다."
 legislation_rudd_blocked.4.t: "승리"
 legislation_rudd_blocked.4.d.a: "러드는 의자에 털썩 주저앉으며 안도의 한숨을 내쉬었다. 법안이 통과되었다. 마침내 끝난 것이다. 노동당 나머지와 녹색당은 박수를 터뜨렸다. 통로 건너편 반대쪽은 오히려 팔짱을 낀 채 앉아 있는 듯했지만, 앞줄에서 러드는 맬컴 턴불이 자신을 똑바로 쳐다보고 있는 것을 발견했고, 맬컴이 웃고 있었다고 맹세할 수도 있었다. \n\n등을 두드리는 손길이 느껴져 돌아보니 길러드가 내려다보며 미소 짓고 있었다. 그녀조차 이것이 당의 성과임을 인정할 수밖에 없었다. 당은 마침내 진정으로 위대한 일을 하고 있었고, 노숙 문제에 내는 균열은 실제로 의미 있는 것이 될 것이었다. 노동당은 마침내 개혁의 정당이 되었다. 오래가지 못할지도 모르지만, 오늘 그들은 첫 번째 전투에서 승리했다. \n\n그는 머리의 땀을 닦고 일어나 당원들과 함께 박수를 쳤다. 이것이 지속되는 동안 즐길 때였다."
 legislation_rudd_blocked.4.d.b: "러드는 의자에 털썩 주저앉으며 안도의 한숨을 내쉬었다. 법안이 통과되었다. 마침내 끝난 것이다. 노동당 나머지와 녹색당은 박수를 터뜨렸다. 통로 건너편 반대쪽은 오히려 팔짱을 낀 채 앉아 있는 듯했지만, 앞줄에서 러드는 맬컴 턴불이 자신을 똑바로 쳐다보고 있는 것을 발견했고, 맬컴이 웃고 있었다고 맹세할 수도 있었다. \n\n등을 두드리는 손길이 느껴져 돌아보니 길러드가 내려다보며 미소 짓고 있었다. 그녀조차 이것이 당의 성과임을 인정할 수밖에 없었다. 광산 기업들이 얼마나 오랜 세월 진정한 개혁을 불가능하게 만들어 왔던가, 그러나 이제 그들도 마땅한 세금을 내게 될 것이었다. 중상 캠페인이 앞으로 몇 달간 계속될 것은 분명하지만, 오늘 그는 첫 번째 전투에서 승리했다. \n\n그는 머리의 땀을 닦고 일어나 당원들과 함께 박수를 쳤다. 이것이 지속되는 동안 즐길 때였다."
 legislation_rudd_blocked.4.d.c: "러드는 의자에 털썩 주저앉으며 안도의 한숨을 내쉬었다. 법안이 통과되었다. 마침내 끝난 것이다. 노동당 나머지와 녹색당은 박수를 터뜨렸다. 통로 건너편 반대쪽은 오히려 팔짱을 낀 채 앉아 있는 듯했지만, 앞줄에서 러드는 맬컴 턴불이 자신을 똑바로 쳐다보고 있는 것을 발견했고, 맬컴이 웃고 있었다고 맹세할 수도 있었다. \n\n등을 두드리는 손길이 느껴져 돌아보니 길러드가 내려다보며 미소 짓고 있었다. 그녀조차 이것이 당의 성과임을 인정할 수밖에 없었다. 노동당은 약속을 지키고 있었다. 다른 어떤 나라도 나서지 않을 때 오스트레일리아가 앞장서는 나라가 될 것이었다. 미래 세대는 우리 덕분에 안전해질 것이었다. \n\n그는 머리의 땀을 닦고 일어나 당원들과 함께 박수를 쳤다. 이것이 지속되는 동안 즐길 때였다."
 legislation_rudd_blocked.4.a: "마땅히 얻은 승리다."
 approach_parties_rudd.1.t: "자유당 접근"
 approach_parties_rudd.1.d: "자유당과 국민당은 현재 계획 수립에서 자신들이 배제된 것에 항의하는 뜻으로 \\"예외 없는 반대\\" 전략을 고수하고 있습니다. 그들 뜻대로라면 법안은 알맹이만 남지 않게 깎여 나갈 것입니다. 어쨌든 그들은 지금 어떤 수정안에 대해서도 협력할 의사가 없습니다."
 approach_parties_rudd.1.a: "모두를 이길 수는 없다."
 approach_parties_rudd.2.t: "녹색당 달래기"
 approach_parties_rudd.2.d: "녹색당을 끌어들이는 데 유일한 문제는 그들의 요구였습니다. 그토록 작은 정당이 우리에게 문제를 일으키는 재주는 과소평가할 수 없었습니다. 우리가 협상하지 않으면 그들은 항의의 뜻으로 반대표를 던질 것이었고, 이미 논란이 많은 법안을 더 강화하라고 고집했습니다. 우리가 가진 모든 수단을 동원해 타협을 이끌어 낸 끝에, 그들은 일부 사소한 추가 사항과 함께 본질적으로 같은 법안을 지지하기로 동의했습니다."
 approach_parties_rudd.2.a: "약속을 지키기를 바라자."
 approach_parties_rudd.3.t: "외부인들"
 approach_parties_rudd.3.d: "민주노동당 상원의원과 무소속 닉 제노폰 모두 이 법안에 대해 설득하기 어려운 상대였습니다. 닉은 처음부터 특히 우리 정부에 비판적이었고 두 사람의 투표 기록은 대부분 자유당 편이었지만, 앞으로 그들과 함께 수정안을 작업하겠다고 약속한 후에는 법안을 지지하기로 동의했습니다."
 approach_parties_rudd.3.a: "훌륭하다."
 mad_katter_ast.1.t: "미친 모자장수 캐터"
 mad_katter_ast.1.d: "밥 캐터는 거의 20년 동안 대표를 맡아 온 북부 퀸즐랜드의 사실상의 왕이었다. 그는 말 그대로 모든 의미에서 불꽃 같은 정치인이었으며, 특히 어떤 면에서도 평범하지 않았다. 옷차림도, 의견도, 무엇보다 말하는 방식도 그랬다. 캐터가 당신의 귀를 붙잡으면 어디로 갈지 알 수 없는 여정에 오르게 될 것이었다. \n\n그들은 새 법안을 협력해 작성한다는 명분으로 회의를 시작했지만, 캐터는 농민들의 곤경과 바나나 수입에 관한 이야기로 곁길에 빠졌다. 그는 결국 꽤 감정적이 되었고, 러드는 그를 진정시켜야 했다. 그는 이어지는 가뭄의 인적 피해에 대해 분명 매우 열정적이었다. \n\n러드는 그 남자가 사회주의자인지 보수주의자인지, 아니면 둘이 묘하게 섞인 것인지 판단할 수 없었다. 어느 쪽이든 그들은 농민들을 도울 무언가를 찾아낼 것이었다."
 mad_katter_ast.1.a: "우리가 할 수 있는 최소한이다."
 whispers_in_the_crowd_ast.1.t: "군중 속의 속삭임"
 whispers_in_the_crowd_ast.1.d: "이제 케빈 러드는 국회의사당의 성질에 익숙해져 있었다. 현상이 한나절 만에 결정되고 아무것도 영구적으로 남지 않는 방식 말이다. 일이 본격적으로 돌아가는 지금, 그는 정부가 나아가는 속도에 편안함을 느꼈지만, 취임 당시와 지금 사이에 무언가 달라졌고 그것이 그를 서서히 지치게 하고 있었다. \n\n그는 내각 거의 모든 사람과 잘 지내는 듯했지만, 이따금 그들의 호의가 줄어들고 있다는 느낌이 들었다. 예전에는 그의 지시를 거침없이 받아들였지만, 이제는 점점 더 자주 그를 의심했다. 그는 자신의 논리를 점점 더 많이 설명해야 했고, 이는 정책의 방향에 의문을 제기하게 만들었다. \n\n그가 편집증에 걸린 것일까? 그럴 수도 있었다. 어쩌면 벌어지는 모든 일이 그들을 짓누르고 있는지도 모른다. 게다가 그는 여전히 내각이 당을 이끌어 가리라 믿었다. \n\n러드는 어깨를 으쓱하며 떨쳐 내고 일을 계속했다. 아마 아무것도 아닐 것이다."
 whispers_in_the_crowd_ast.1.a: "아니면 그렇지 않았을까?"
 mining_smear_campaign_ast.1.t: "언론 캠페인"
 mining_smear_campaign_ast.1.d: "대형 광산 기업들이 우리가 무엇을 꾸미고 있는지 알아낸 지금, 언론 중상 캠페인이 한창입니다. 수십 가지 다양한 광고가 모든 채널과 주파수를 뒤덮고 있습니다. 도로변에는 현수막이 걸려 있습니다. 그들은 마땅한 세금을 내는 대신 수백만 달러를 쏟아부어 우리 정부를 훼손하고 있습니다. 모든 것이 먹혀드는 것은 아니지만, 먹혀들 때는 우리의 통치 능력에 타격을 주고 있으며, 대중의 인식도 나빠지고 있습니다. 연합은 이미 편승하여 우리를 비판하고 있습니다."
 mining_smear_campaign_ast.1.a: "폭풍을 견뎌 내야 한다."
 corruption_outcome_aus.1.t: "딱 걸린 현장"
 corruption_outcome_aus.1.d: "최근 당 내부 조사 결과, 우리는 당 내의 외부 영향력을 영구히, 혹은 적어도 당분간은 차단하기에 충분한 증거를 확보했습니다. 그러나 이익 단체의 개입과 무관한 몇 가지 조사 결과도 드러나 우리 당을 나쁘게 비추고 있습니다. \n\n아직까지 우리와 연결될 만한 것은 나오지 않았지만, 대중의 눈에서 신뢰를 일부 잃기에는 충분합니다. 앞으로 우리는 주목에서 벗어날 때까지 몸가짐을 깨끗이 해야 합니다."
 corruption_outcome_aus.1.a: "이런!"
 aus_gillard_overthrow.1.t: "문 두드리는 소리"
 aus_gillard_overthrow.1.d: "러드가 자신의 사무실에서 평소처럼 서류 작업을 하고 있을 때 문 두드리는 소리가 울렸다. 그는 그 두드림 방식을 알아보고 줄리아 길러드를 불러들였고, 그녀는 느리지만 단호한 걸음으로 들어섰다. 평소의 루틴과 달리 그녀는 선 채로 있었고, 러드가 올려다보자 그녀는 소식을 전했다. \n\n러드에게는 주변의 사무실 벽이 안쪽으로 무너져 내리는 것처럼 느껴졌다. 그녀가 말을 이어 가는 동안 그의 세계는 붕괴하고 있었고, 그가 할 수 있는 일은 그녀가 비수를 꽂는 것을 충격 속에 지켜보는 것뿐이었다. 길러드는 지도부 도전을 발동하려 하고 있었다. 믿을 수 없었다. 자신의 러닝메이트가 그를 끌어내리려 하다니, 더구나 친구라고 여기던 사람이. 최악은 아직 끝나지 않았다. 그녀는 그의 사임을 요구하고 있었다. \n\n그는 서류상으로만 빼고는 이미 축출된 것이나 마찬가지였지만, 그녀는 체면을 지키고 의회 절차를 피할 수 있는 선택지를 제안하고 있었다. 그녀가 자신을 지지하는 모든 각료의 이름을 나열하는 동안 러드는 그가 가진 모든 동지를 그녀가 돌려세웠음을 깨달았다. 이제 그는 당 안에서 혼자였다."
 aus_gillard_overthrow.1.a: "모든 것이 끝났다."
 aus_gillard_overthrow.2.t: "새벽"
 aus_gillard_overthrow.2.d: "카메라들이 야외 연단을 에워싸고 발표를 기다리고 있었다. 이제는 모두가 무슨 일이 벌어지고 있는지 알고 있었다. 의회에서 나오는 모든 소식은 빠르게 퍼졌고, 이는 꽤 오래전부터 계획된 쿠데타였다. 다음 날 아침이 되자 이미 모든 것이 끝나 있었고, 기자들이 어색하게 서서 그 순간을 기다리는 동안 마침내 문이 활짝 열리며 [GetASTLeaderTitle]이(가) 가족과 함께 걸어 나왔다. \n\n\\"저는 모든 오스트레일리아인에게 공정한 기회를 되찾아 주라는 오스트레일리아 국민의 선택을 받아 이 나라의 [GetASTLeaderTitle]이(가) 되었고, 그렇게 하기 위해 최선을 다했습니다. 저의 모든 것을 바쳤습니다. 그러한 정신으로 이 나라를 더 공정하게 만들기 위해 우리가 이룬 성과를 자랑스럽게 생각합니다.\\" \n\n그의 눈은 이미 촉촉해지기 시작했다. 어쩌면 러드는 잘못된 시기에 맞이한 올바른 [GetASTLeaderTitle]이었는지도 모른다. 정권 교체가 슬픈 일상이 되어 가는, 회전문 같은 정당이 되어 가던 상황을 피하기 위해 그가 할 수 있는 일은 거의 없었다. \n\n \\"지난 2년 반은 몹시 바빴습니다. 우리는 여기에 모든 것을 쏟아부었으며, 돌이켜 볼 때 이 개혁들이 미래까지 이어져 오스트레일리아를 그렇지 않았을 때보다 더 공정하고 더 나은 곳으로 만들 것이라고 믿습니다.\\" \n\n러드가 작별 인사로 손을 흔들기 전에 그들로부터 박수가 터져 나왔다. 그는 자신이 옳았기를, 그리고 변화를 위한 자신의 노력이 뿌리내리기를 바랄 수밖에 없었다."
 aus_gillard_overthrow.2.a: "안녕히, 사랑스러운 왕자여."
 the_new_look_rudd.1.t: "새로운 모습"
 the_new_look_rudd.1.d: "선거철의 웅성거림이 그의 일상으로 다시 스며들기 시작하면서, 러드는 자신의 외모를 가꿀 시간이 훨씬 줄었음을 깨달았다. 의회에서 밤을 새우며 제안서와 통상적인 업무를 검토하다가 다음 날 선거 유세에 나서는 일도 드물지 않았다. \n\n오늘 그는 수도에서 꽤 멀리 떨어진 자신의 지역구 퀸즐랜드 그리피스에 있었다. 해가 겨우 떴을 무렵에도 그는 이미 메모를 검토하며 모두가 일어나기 전의 고요함을 음미하고 있었다. 최근에는 드문 일이었다. 하지만 마치 신호라도 받은 듯 평온은 깨졌고, 캠핑카의 방충망 문이 활짝 열리며 숨을 헐떡이는 앤서니 앨버니지가 나타났다. \n\n앤서니는 뚱뚱하고 다소 서툰 사람이었지만, 불과 얼마 전만 해도 두 사람은 당 대표 자리를 놓고 서로 목을 조르던 사이였고, 러드는 그 사실을 결코 잊지 않으려 했다. 앤서니는 비틀거리며 들어와 러드 옆 탁자에 커피를 올려놓았고, 러드는 고개를 끄덕여 고마움을 표했다. \n\n\\"이런, 꼴이 말이 아니네요.\\" 그는 러드의 턱을 가리켰다. 러드가 턱을 만져 보니 이삼 일 동안 면도를 하지 않았고 하얀 수염이 덥수룩하게 자라 있음을 깨달았다. \n\n\\"그런 것 같군요. 어떻습니까?\\" \n\n\\"뭐, 나쁘진 않아요. 유권자들에게는 의외일 수도 있겠네요.\\" 앤서니가 낄낄 웃으며 말했다. \n\n\\"흠. 헝클어진 모습으로 보이고 싶진 않군요.\\" \n\n\\"글쎄요. 어쩌면 좋아할지도 몰라요.\\""
 the_new_look_rudd.1.a: "그렇다면 그대로 두겠다."
 the_new_look_rudd.1.b: "면도할 시간이다."
 rudd_the_next_leader.1.t: "당의 미래"
 rudd_the_next_leader.1.d: "어떤 지도자의 삶에든 다음 세대를 생각해야 할 때가 온다. 줄리아 길러드는 러드와 비교해 그다지 젊은 세대는 아니지만, 당의 미래일 수 있다. 2007년 선거에 임하며 두 사람이 맺은 합의에 따라, 러드는 길러드에게 언젠가 자신이 물러나 그녀가 뒤를 이어 출마하게 해 주겠다고 약속한 바 있었다. \n\n러드에게 책임은 무거웠지만 길러드는 아직 그를 실망시킨 적이 없었다. 그녀는 당의 사업 측면을 맡고 있었다. 예산 적자와 경제 성장에 대한 그녀의 우려가 입 밖에 나오지 않는 일은 드물어 보였고, 그녀의 국가 광업 개편 계획은 러드의 관심을 끌었다. 그녀는 분명 충분히 신경 쓰고 있었다. 그녀가 그 일에 적합한지 아닌지는 언젠가 러드가 결정해야 했다."
 rudd_the_next_leader.1.a: "고려해 볼 일이다."
 rudd_the_next_leader.1.b: "절대 안 된다!"
 rudd_the_next_leader.2.t: "물러나며"
 rudd_the_next_leader.2.d: "\\"정치적 차이를 평화롭게 관리하고 정치를 평화롭고 예의 있게 해결할 수 있는 이 나라, 그것이 이 나라가 이토록 위대한 나라인 까닭입니다. 현대 오스트레일리아라는 이 놀라운 태피스트리 속에서, 우리 다문화 국가의 모자이크 속에서, 다양성으로부터 이토록 통합을 빚어내는 것, 거기에 위대한 오스트레일리아의 기적이 있습니다.\\" \n\n\\"저는 오스트레일리아 국민이 우리의 지도력에서 새로운 출발을 할 자격이 있다고 믿습니다. 이 소식이 여러분 중 일부에게는 달갑지 않을 것임을 압니다만, 저의 책임은 노동당이 미래를 위한 투쟁하는 세력으로 남도록 하는 것이었고, 그래야 우리가 우리 당의 다음 지도자인 줄리아 아래 하나로 뭉칠 수 있습니다.\\" \n\n\\"그러니 친구 여러분, 한동안 국가의 공적인 일에서 저의 목소리를 듣지 못하실 겁니다.\\" \n\n\\"저는 여러분의 [GetASTLeaderTitle]이자 여러분 정당의 대표로 봉사하게 된 것을 영광으로 생각하지만, 자신의 모든 것을 쏟았음을 아는 때가 있고, 당이 미래를 위해 지도부를 한 번 더 쇄신해야 할 때가 있습니다.\\""
 rudd_the_next_leader.2.a: "\\"저에게는 지금이 그때입니다.\\""
 rudd_campaigning_round_two.1.t: "컨벤션 센터를 돌고 돌아"
 rudd_campaigning_round_two.1.d: "러드가 노동당 전국 대회의 통로를 걸어갈 때 군중은 열광의 절정에 달해 있었다. 당의 원로 폴 키팅마저 그를 응원하러 와 있어서 행사에 꿈결 같은 분위기를 더했다. 마치 그가 한 번도 떠난 적이 없는 것 같았다. 지난 몇 년은 그저 악몽이었고, 이제 동료들의 박수 소리에 잠에서 깨어난 것 같았다. 그의 몰락에 박수를 쳤던 바로 그 사람들의 박수였다. \n\n정치가 얼마나 변덕스러운지 기이할 지경이었다. 대중과는 늘 칼날 위에 서 있었고, 심지어 같은 당의 사람들과도 마찬가지였다. 그럼에도 다음 선거에서 그들의 지지를 얻을 수 있다면 그는 여전히 그들의 손을 잡았다. 편안해지기에는 모든 것이 너무나 아슬아슬했다. \n\n또 한 번의 임기를 얻으려면 기적을 일으켜야 했지만, 아직 끝난 것이 아니었고 러드는 모든 것을 쏟아부을 것이었다."
 rudd_campaigning_round_two.1.a: "우리는 돌아왔고, 이곳에 머물 것이다."
 gillard_gov_event.1.t: "새로운 방향"
 gillard_gov_event.1.d: "비좁은 회의실에서 줄리아 길러드는 [GetASTLeaderTitle]으로서 첫 기자 회견을 했다. 기자들과 동료 정치인들은 모두 그녀의 연설을 듣기 위해 모였고, 그녀가 공개할 위임 사항을 숨죽이고 기다렸다. 이제 그 무게는 진정 그녀에게 놓여 있었다. 바로 이 자리에 오르기까지 수개월간의 작업이 필요했고, 모든 카드를 신중하게 쌓아야 했으며 각료들을 구슬려 지지를 얻어내야 했다. 모두 바로 이곳에 이르기 위해서였다. \n\n길러드는 이제 세계에서 가장 강력한 여성 중 한 명이었지만, 그녀의 입지는 그 어느 때보다 불안하게 느껴졌다. 그녀가 저지르는 어떤 실수도 야당이나 언론, 혹은 그녀에게 동료들의 자리를 이어받을 강단이 없다고 느끼는 누구에게든 며칠 동안 면밀히 검토되고 곱씹힐 것이었다. 모든 걸음을 신중하게 내디뎌야 했다. \n\n합리적인 정책이라도 통과시키는 일은 곧 있을 총선이 소집될 때까지 뒤로 미뤄질 것이었다. 그때까지 그녀는 그럴듯한 모습을 보여야 했고, 대중이 그녀가 이 일을 해낼 수 있다고 믿어 주기를 바랄 수밖에 없었다."
 gillard_gov_event.1.a: "질문 있습니까?"
 papua_residency_ast.1.t: "오스트레일리아의 경제 협약 제안"
 papua_residency_ast.1.d: "지역 경제 유대를 강화하기 위해 오스트레일리아 정부는 '무관세' 무역 협정을 제안하였습니다. 이 제안은 상호 배타적 광물 권리를 대가로 우리의 재화와 서비스에 대한 제한을 완화하는 내용을 포함합니다. 양국 모두 상호 간 물자 흐름의 증가로 크게 번영할 수 있으나, 선택은 우리에게 달려 있습니다."
 papua_residency_ast.1.a: "물론 그들을 위해서다!"
 papua_residency_ast.1.b: "사양한다."
 papua_residency_ast.2.t: "파푸아 경제 통합"
 papua_residency_ast.2.d: "파푸아뉴기니가 무역을 통해 양국 경제를 묶자는 제안된 협약에 동의하였습니다. 협상이 마무리 중이며, 파푸아 재화와 서비스에 대한 무관세 무역, 간소화된 투자, 양측의 자원 우선권을 허용합니다. 오세아니아는 지역 경제 연합으로 한 걸음 더 다가섰습니다."
 papua_residency_ast.2.a: "훌륭하다."
 papua_residency_ast.3.t: "파푸아와의 연결 실패"
 papua_residency_ast.3.d: "파푸아뉴기니는 안타깝게도 협약을 거부하였으며 현재의 무역 관계를 유지하는 것을 선호합니다."
 papua_residency_ast.3.a: "실망스럽다."
 indo_ast_trade_deal.1.t: "오스트레일리아, 무역 협정 제안"
 indo_ast_trade_deal.1.d: "냉랭한 관계를 누그러뜨리기 위해 오스트레일리아는 장래의 군사 협력을 약속하는 자유 무역 협정을 제안하였습니다. 현재로서 이 협정은 우리와의 재화 및 서비스의 원활한 이동을 제공하여 경제적 호재를 가져다줄 가능성이 매우 높지만, 군사 협약은 다소 열려 있는 상태입니다."
 indo_ast_trade_deal.1.a: "공정한 제안이다."
 indo_ast_trade_deal.1.b: "사양한다."
 indo_ast_trade_deal.2.t: "러드가 전한 좋은 소식"
 indo_ast_trade_deal.2.d: "케빈 러드가 인도네시아에서 호의적인 결과를 들고 돌아왔다. 인도네시아는 우리 ADF가 공동 안보 노력에 참여한다는 조건으로 자유 무역 협정에 긍정적으로 반응했다. 우리는 이미 인도네시아와 대테러 활동을 함께해 왔으므로 이는 새로울 것이 없으며, 요구 사항은 의도적으로 열려 있는 채로 남겨져 우리가 장래에 약속의 범위를 정할 수 있다. 당분간 이 협정은 양국 간 무역에 상당한 활력을 불어넣을 것이다."
 indo_ast_trade_deal.2.a: "훌륭하다."
 indo_ast_trade_deal.3.t: "인도네시아, 무역 제안 거부"
 indo_ast_trade_deal.3.d: "자카르타 정부는 안타깝게도 협약을 거부하여 러드의 노력에 차갑게 반응하였으며, 현재의 무역 관계를 유지하는 쪽을 선호하였습니다."
 indo_ast_trade_deal.3.a: "좋지 않지만 어쩌면 예상된 일이다."
 forming_government_gil.1.t: "독이 든 잔을 고르라"
 forming_government_gil.1.d: "선거 결과로 우리가 계속 정권을 잡으려면 연립 정부를 구성해야 한다는 점이 분명해졌습니다. 현재 야당은 하원의 자기 몫 의석을 확보하기 위해 신속하게 움직이고 있습니다. 당의 좌파 파벌은 우리에게 녹색당과의 협약을 모색할 것을 권하고 있습니다. 우리는 이전에 그들과 협력한 적이 있고 그들도 기꺼이 응할 의사가 있어 보이지만, 우리 보수 성향 당원들 일부는 거기까지 가는 데 미심쩍어하며, 녹색당은 십중팔구 자기들만의 요구를 내놓을 것입니다. \n\n한편, 다수의 자유당 이탈 의원들이 우리의 의제 일부를 지지하며 접근해 왔고, 기꺼이 연립에 합류하려 합니다. 전직 자유당 의원들의 지지가 있으면 우리는 일반 대중에게 더 초당적으로 비칠 수 있습니다. 선거 결과를 고려하면 중도에 가까워 보이는 것도 나쁜 선택은 아닐 수 있습니다."
 forming_government_gil.1.a: "녹색당과 함께 간다"
 forming_government_gil.1.b: "자유-노동 연립으로 하자."
 gillard_gov_event.2.t: "내각 구성"
 gillard_gov_event.2.d: "내각은 적어도 줄리아의 눈에는 노동당의 정예들로 이루어진 상당히 유능한 집단으로, 그리고 더욱 중요하게는 충성스러운 부류로 가늠되고 있었다. 신임 부[GetASTLeaderTitle]인 웨인 스완은 외교부 구성을 논의하기 위해 길러드와 만나기로 했다. \n\n그들이 그녀의 사무실에서 만났을 때, 길러드는 자신이 국내 문제에 훨씬 더 집중하고 싶으며 외교부는 자율적으로 운영되도록 두고 싶다고 설명했다. 두 사람은 함께 선택지를 검토했고 두 가지 뚜렷한 선택지가 있었다. 스티븐 스미스는 새 [GetASTLeaderTitle]에게 가장 먼저 자신의 봉사를 제안한 사람으로, 이전에 키팅 정부에서 일했으며 그 이후로도 충실한 노동당원으로 남아 있었다. 스완은 스미스가 당의 노선을 따르며 우리를 어느 정도 곧은 길에 머무르게 할 것이라고 확신했다. \n\n다른 선택지는 밥 카였다. 카는 사실 한동안 의회를 떠나 컨설턴트로 일하고 있었고, 격렬한 공개 토론으로 인기를 얻고 있었다. 그의 정책은 더 대담한 부류에 속하는 경향이 있었으며, 줄리아가 노리는 방향이 그것이라면 그의 지명은 분명 자취를 남길 것이었다. 그래도 결정할 시간은 있었고, 벌어지고 있는 모든 일들로 인해 해외 업무를 재개하는 데 서두를 필요는 없었다."
 gillard_gov_event.2.a: "고려할 것이 많다."
 forced_adoptions_gillard.1.t: "길러드 정부의 강제 입양 사과"
 forced_adoptions_gillard.1.d: "[GetASTLeaderTitle] 줄리아 길러드는 오늘 저녁 1950년부터 1975년 사이에 수천 명의 원주민 어머니와 자녀를 강제로 떼어놓은 역사적 정부 정책에 대하여 국가적 사과를 발표했다. \n\n\\"우리는 이러한 정책과 관행이 아버지들에게 미친 깊은 영향을 인정하며, 이 행위들이 형제자매, 조부모, 배우자 및 확대 가족 구성원들에게 입힌 상처를 인정합니다.\\"라고 길러드는 국회의사당 안을 가득 메운 800명이 넘는 청중에게 말했고, 그중 다수는 눈물을 흘리고 있었다. \n\n약 10만 명에서 15만 명의 영아가 대부분 미혼의 젊은 여성인 어머니들로부터 강제 또는 강압으로 분리된 것으로 추정된다."
 forced_adoptions_gillard.1.a: "그분들께 마음이 향한다."
 let_debate_decide_gillard.1.t: "동성 결혼 법안 폐기"
 let_debate_decide_gillard.1.d: "놀랍지 않은 결과로 하원은 압도적으로 동성 결혼 법안에 반대표를 던졌으며, 98 대 42로 법안이 부결되었습니다. 우리 당의 강령은 전통적으로 그 개념에 반대해 왔고, 대부분의 반응은 전통적 가치에 대한 통상적인 옹호 등이었습니다. 우리는 이미 온라인에서 진보 성향 유권자들의 많은 비판을 받았으며, 이는 분명 다음 선거에까지 스며들 것입니다."
 let_debate_decide_gillard.1.a: "이런."
 let_debate_decide_gillard.2.t: "차별 금지 수정안, 상원 통과"
 let_debate_decide_gillard.2.d: "뜻밖의 초당적 협력으로 우리의 동성 보호 법안이 압도적인 지지를 받으며 하원과 상원을 휩쓸었습니다. 수정안은 성적 지향을 이유로 한 차별에 대한 광범위한 보호와 함께, 취약한 이들을 보호하고 지원하며 교육 서비스를 제공하는 연방 기금 프로그램을 포함하여 이미 존재하는 법을 강화합니다. \n\n야당 지도부에서는 지침의 사소한 트집에 대한 가벼운 불평만 나왔으며, 대체로 이는 당의 세대적 승리로 보입니다. 온라인에서 진보 진영으로부터 이미 받고 있는 지지는 압도적입니다."
 let_debate_decide_gillard.2.a: "또 한 번의 승리!"
 opposition_attacks_ast.1.t: "야당의 포문"
 opposition_attacks_ast.1.d: "토니 애벗의 통상적인 수사는 늘 어느 정도 선동적이고 어느 정도 과도했지만, 최근 그는 공격을 새로운 수준으로 끌어올렸다. 국회의사당 밖에 상당히 '외설적인' 팻말을 든 시위대가 나타난 뒤, 애벗은 이 기회를 이용해 직접 나가 그들과 어울리며 기자들을 불러 이 장면을 촬영하게 했다. \n\n주변부 집회에 그쳤을 수도 있었던 일이 충분한 관심을 받아 신문들이 이제 \\"마녀를 몰아내라\\"를 내걸고 있고, 일부는 \\"그 년을 불태워라\\"까지 싣고 있다. 애벗치고도 조잡한 일인데, 이제 뉴스코프 매체가 그에 편승하고 있다."
 opposition_attacks_ast.1.a: "아주 잘됐군."
 opposition_attacks_ast.2.t: "애벗, 우리 통치를 헐뜯는 언론 순회 개시"
 opposition_attacks_ast.2.d: "토니 애벗이 다시 한번 오로지 우리 정책을 비판하기 위해 스포트라이트를 차지했다. 최근 투데이 쇼에서 애벗은 우리 예산 계획의 실현 불가능성에 대해 끝도 없이 늘어놓으며 \\"낭비적\\", \\"멍청한\\" 등 통상적인 공격을 가했다. 전날의 뉴스폴 조사가 우리를 덜 선호되는 정부로 묘사하며 여론조사에서 애벗에게 5포인트 뒤처져 있다고 하지 않았다면 이렇게까지 타격이 크지는 않았을 것이다. 우리의 지지가 줄어드는 가운데, 우리가 무슨 반박을 해도 설득력이 거의 없다."
 opposition_attacks_ast.2.a: "숨 돌릴 틈도 없는가?"
 ast_fm_rudd_focus.5.t: "케빈 러드, 내각 이탈"
 ast_fm_rudd_focus.5.d: "워싱턴 D.C.에서 열린 기자 회견 도중 러드는 그곳의 군중에게 우리의 외교 장관직에서 공식적으로 물러나겠다고 발표한 모양이다. 현장의 군중에게는 충격이었고 우리 정부에도 결코 좋은 모습은 아니지만, 이어서 러드가 자신의 결정을 우리 탓으로 돌리면서 상황은 더 나빠졌다. 그는 우리가 자신을 뒷받침해 주지 않았다고 주장했다. \n\n그가 다음 기회를 잡으면 러드는 우리에게 지도부 도전을 시도할 가능성이 매우 높다. 당 내에는 이미 불화의 이야기가 돌고 있으므로, 우리는 어떤 상황에도 대비해야 한다. 당장은 새로운 외교 장관이 필요하다."
 ast_fm_rudd_focus.5.a: "후원이 부족했다고? 우리가 선택한 사람인데!"
 opposition_attacks_ast.3.t: "피터 슬리퍼 문자 사건"
 opposition_attacks_ast.3.d: "현 하원의장 피터 슬리퍼는 그에 대한 법적 절차의 일환으로 그가 보낸 수백 통의 사적인 문자 메시지가 공개된 이후 최근 비난을 받고 있습니다. 피터는 이전에 자유당 소속이었다가 무소속으로 우리 쪽에 합류한 인물입니다. 문자는 의장 개인의 문제임에도 상당히 좋지 않으며, 이제 자유당은 우리가 피터를 즉각 내치지 않았다는 이유로 우리를 성차별주의자로 몰아가고 있습니다. \n\n토니 애벗은 우리가 피터 슬리퍼를 해임하지 않으면 불신임 투표를 하자며 결집시켰고, 해임하지 않을 경우 우리에게는 의회에서 스스로를 변호할 기회가 있습니다. 문자가 좋지는 않지만 통상적인 자유당의 발언보다 크게 나쁠 것도 없으며, 애벗에게 한마디 해 주는 것도 나쁘지 않을 것입니다."
 opposition_attacks_ast.3.a: "의회에서 맞서 보자."
 opposition_attacks_ast.3.b: "슬리퍼를 해임하라."
 opposition_attacks_ast.4.t: "길러드 여성혐오 연설을 향한 입소문 지지"
 opposition_attacks_ast.4.d: "어제 독설이 오간 의회 토론 중에 슬리퍼 문자를 둘러싼 긴장이 이어지던 양측의 불화가 한계점에 이르자, [GetASTLeaderTitle]은(는) 야당 대표 토니 애벗의 인격에 대해 맹공을 퍼부었다. 의회 불신임 투표 중에 길러드는 최근 몇 년간 애벗이 보인 성차별적 수사를 맹렬히 비난하기 시작했다. \n\n\\"저는 이 사람에게서 성차별과 여성혐오에 대해 훈계를 듣지 않겠습니다, 절대로 말입니다. 그리고 정부도 이 사람에게서 성차별과 여성혐오에 대해 훈계를 듣지 않을 것입니다. 지금도, 앞으로도 결코 그렇지 않을 것입니다.\\" \n\n길러드의 연설은 즉시 전국뿐 아니라 전 세계 온라인에서도 호평을 받았다. 영국과 미국의 신문들은 신속하게 이 정치 연극에 가세하여, 텔레그래프에 따르면 길러드의 \\"성차별에 대한 공격\\"을 \\"맹렬하지만\\" \\"훌륭하다\\"며 극찬했다."
 opposition_attacks_ast.4.a: "보람이 있어서 다행이다."
 rudd_events_gillard.1.t: "케빈 러드의 지원 제안"
 rudd_events_gillard.1.d: "우리가 내각을 마무리하는 과정에 있는 동안 러드가 외교 장관으로 봉사하겠다는 제안을 해 왔습니다. 의심의 여지 없이 러드는 외교 문제에서 가장 경험이 풍부하고 입증된 효율성을 가진 장관일 수 있으며, 이전 정부의 인물이 이제 우리와 함께 일하는 것은 정치적으로 도움이 될 수도 있습니다. 그래도 노동당의 새로운 얼굴로 보이고 싶다면 내각을 과거와 분리하는 편이 나을 수도 있습니다."
 rudd_events_gillard.1.a: "합류를 환영한다."
 rudd_events_gillard.1.b: "우리는 괜찮다, 고맙다."
 rudd_events_gillard.2.t: "Q&A 소동"
 rudd_events_gillard.2.d: "케빈 러드가 Q+A 토크쇼에 깜짝 출연하여 자신의 임기와 관련된 여러 질문에 답했다는 소식이 우리에게 흘러들어 왔습니다. 겉으로 보기에는 걱정할 만한 방송이 아니었지만, 몇몇 각료는 러드가 일부 질문에 \\"비판적인\\" 어조를 보였으며 재임 중 자신을 약화시킨 특정 \\"동료들\\"을 탓했다고 지적했습니다. \n\n중립적으로 들리긴 하나, 기자들은 이를 곧바로 우리와 연결 짓고 있으며 우리 내각 구성원들이 러드의 몰락에 책임이 있다고 비난하고 있습니다. 고발이 얼마나 터무니없든, 이는 여론조사에서 또 하나의 골칫거리를 안겨 주고 있습니다."
 rudd_events_gillard.2.a: "일부러 저러는 건가?"
 rudd_events_gillard.3.t: "케빈 러드의 선거 유세"
 rudd_events_gillard.3.d: "최근 러드는 지방 선거에서 다른 노동당 의원들을 지원하는 모습이 목격되고 있습니다. 당으로서는 그 지원이 고마운 것이 사실이지만, 러드는 거의 의도적으로 모든 것을 자신에 관한 일로 만들고 있습니다. 방문을 사진 촬영 기회로 바꾸고, 후보자들에게서 스포트라이트를 거두어 자신의 인터뷰를 하고 있습니다. 그는 우리 정부가 아닌 자기 자신을 중심으로 지지를 결집하고 있으며, 그것이 효과를 보이고 있을 수 있습니다. \n\n뉴스폴 조사에서 러드에 대한 지지는 우리 자신의 지지보다 훨씬 높게 올라가고 있으며, 그의 작은 순회를 막으려는 어떤 조치를 취하더라도 오히려 상황을 악화시킬 수 있습니다."
 rudd_events_gillard.3.a: "젠장, 케빈!"
 rudd_events_gillard.4.d: "러드가 우리 노동당 후보들을 지원하기 위해 여러 지방 선거구를 돌아다니는 모습이 목격되었습니다. 이는 노련한 당원들에게는 꽤 표준적인 활동이지만, 러드는 일부러 나서서 우리 정책을 조명하고 언론에 이를 옹호하고 있는 것으로 보입니다. \n\n언론이 실제로 이에 편승할지는 별개의 문제지만, 이는 우리 지지율 수치에 놀라운 효과를 내고 있으며 다가오는 주 선거에서도 분명 우리에게 도움이 될 것입니다."
 rudd_events_gillard.4.a: "참으로 사려 깊다."
 rudd_events_gillard.5.t: "우리 정부에 반기를 든 러드"
 rudd_events_gillard.5.d: "예상대로 케빈 러드는 의회를 몰래 돌아다니며 더 많은 장관들을 우리에게서 돌아서게 하려 하고 있습니다. 불행히도 언론은 러드가 다음 선거에서 우리 정부가 승리하리라고 믿지 않는다고 공언했고 상당한 지지를 등에 업고 지도부 도전을 고려하고 있다고 밝힌 \\"유출된\\" 대화를 보도하고 있습니다. \n\n늘 그렇듯 이것은 아마 우리를 동요시키려는 케빈의 책략일 것이며, 지도부 투표를 소집하면 그를 제자리로 돌려놓을 수 있겠지만, 응해 줄 가치가 있기나 할까요?"
 rudd_events_gillard.5.a: "지도부 투표를 소집하라."
 rudd_events_gillard.5.b: "별것 아니다."
 rudd_events_gillard.6.t: "지도부 투표 소집"
 rudd_events_gillard.6.d: "노동당 지도부 선거 결과 케빈 러드는 71 대 31로 가볍게 패배했습니다. 러드는 우리에 대한 추가 도전을 중단하고 앞으로의 투표에서도 지지하겠다고 약속했으나, 그 약속에 어떤 가치가 있을지는 알 수 없습니다. 결과는 모든 일이 있었음에도 당이 여전히 우리를 지지하고 있음을 보여 줍니다. 이 정부는 아무리 힘들더라도 오스트레일리아 국민을 위한 사명을 계속해 나갈 것입니다. 이제 다시 링에 올라 우리의 정책을 계속 쏟아낼 때입니다."
 rudd_events_gillard.6.a: "옳소, 옳소!"
 rudd_events_gillard.7.t: "내각 대량 사임"
 rudd_events_gillard.7.d: "주요 각료 세 명이 같은 주에 사임서를 제출했으며, 이는 우리 정부에 대한 일종의 항의로밖에 추정할 수 없습니다. 내각 하위급의 러드 동조자들도 이에 호응하여 물러났습니다. 당의 단합이라는 측면에서 상황은 이보다 더 심각할 수 없습니다. 비상 후임을 마련하고 체면을 지키기 위해 조속히 발표를 해야 합니다. \n\n이러한 방해 공작이 그리 잦지 않았다면 우리는 진지한 개혁을 추진하고 우리가 선출된 목적인 직무에 실제로 전념하고 있었을 것입니다."
 rudd_events_gillard.7.a: "가라앉는 배에서 달아나는 쥐들처럼."
 rudd_events_gillard.8.t.a: "녹색당, 동맹 종료"
 rudd_events_gillard.8.t.b: "전직 자유당 무소속 의원들, [GetASTLeaderTitle] 주위로 결집"
 rudd_events_gillard.8.d.a: "최근 내각의 이탈 속에서 녹색당의 새 대표 크리스틴 밀른은 자신들도 우리를 저버리고 동맹을 해체하겠다고 발표했습니다. 그들은 정책상 의견 차이라는 어설픈 변명을 댔지만, 우리는 언젠가 이런 일이 생기리라는 것을 알고 있었습니다. 노동당은 다음 선거에 홀로 나서게 되었습니다."
 rudd_events_gillard.8.d.b: "야당들의 비판 속에서 무소속 의원들은 [GetASTLeaderTitle] 주위로 결집하여 계속되는 소동 속에서도 우리 정부의 정책을 옹호하였습니다. 병원을 들락거리는 와중에도 토니 윈저는 카메라 앞에 나타나, 하원에서 우리 의석을 지지하며 자신이 통과시키는 데 도움을 준 긍정적인 개혁을 자랑하기까지 했습니다. 솔직히 이제 우리도 감사를 받을 때가 되었습니다."
 rudd_events_gillard.8.a: "전형적이다."
 rudd_events_gillard.8.b: "반가운 몸짓이다."
 rudd_events_gillard.9.t: "또 한 번의 지도부 도전"
 rudd_events_gillard.9.d: "우리의 지지율이 악화됨에 따라 의회 내 비판자들이 피 냄새를 맡은 상어처럼 나타나 지도부 도전을 준비하기 시작했습니다. 지난번 이후 우리를 지지하는 세력은 크게 줄었습니다. 케빈 러드의 약속에도 불구하고, 도전이 제기되면 그가 표결에 자기 이름을 올릴 것이라는 소문이 돌고 있으며, 분명 그는 한동안 충성파들과 모의를 해 왔을 것입니다. \n\n지난 투표에서 승리했음에도 이번에는 상처 없이 빠져나가지 못할 수도 있습니다."
 rudd_events_gillard.9.a: "돌파구 속으로."
 gillard_goodbye_ast.1.t: "마지막 막"
 gillard_goodbye_ast.1.d: "투표 전 회의에서 러드는 패배하면 정계에서 은퇴하겠다고 약속했지만, 그 시점에서 그의 말에 실질적인 무게는 없었다. 그가 천천히 지평선 너머로 걸어가 다시는 이 복도를 더럽히지 않는다면 만족스러울 것이다. 불행히도 우리는 그리 운이 좋지 못했다. 57 대 45의 차이로 러드가 명백한 승자였다. \n\n오스트레일리아는 정말로 여성 [GetASTLeaderTitle]을(를) 맞을 준비가 되어 있었을까? 의회 안팎 어디서도 분명 그런 모습은 보이지 않았다. 갑자기 줄리아는 그토록 오랜 시간을 들여 얻은 모든 것을 잃었고, 그것을 받아들일 시간조차 없었다. 그들은 노동당 의원 총회실을 나와 곧장 회의실로 들어섰다. \n\n길러드는 그녀가 취임 선서를 하던 때와 비슷한 군중 앞에서 마지막 연설을 했다. 짧고 단순했다. 길러드는 결과에 불복하지 않을 것이었다. 무슨 소용이 있겠는가? 때로는 카드를 내밀고도 지는 법이다. \n\n그리고 길러드는 패배에 앙심을 품는 사람이 되지 않을 것이었다."
 gillard_goodbye_ast.1.a: "이제 끝났다."
 gillard_goodbye_ast.2.t: "마지막 투표"
 gillard_goodbye_ast.2.d: "투표 중에 길러드는 냉정함을 유지했다. 걱정스러운 모습을 보여 그들을 만족시키고 싶지 않았다. 러드는 방 뒤쪽에 구부정하게 앉아 있었다. 그는 아무 말도 할 필요가 없었고, 그저 우쭐함을 내뿜고 있었다. [GetASTLeaderTitle]으로서의 마지막 순간에 줄리아는 품위를 가지고 그 자리를 지킬 것이었고, 그렇지 않았다면 방을 가로질러 걸어가 그 남자의 뺨을 후려쳐 정신 차리게 하고 싶었을 것이다. \n\n투표가 선언되고 이름이 천천히 호명되었다. 47… 51… 55… 63. 최종 집계는 63 대 39였다. 길러드가 이겼다. \n\n그녀의 내각이 일어나 그녀 뒤에서 박수를 치기 시작했다. 그녀는 거의 움직일 수 없었지만 축배를 받기 위해 억지로 일어섰고, 머릿속은 그 이유를 되짚느라 바삐 돌아갔다. 당이 마침내 그녀를 받아들인 것일까? 일종의 마지막 항의처럼, 케빈 러드도 일어서서 박수를 치기 시작했다. 투표 전 러드는 패배하면 정계에서 은퇴하겠다고 약속한 바 있었다. 그녀는 다시는 그를 볼 필요가 없을 것이었다. \n\n그들은 곧 노동당 의원 총회실을 나와 인근 회의실로 들어갔고, 길러드는 결과를 발표하며 다음 선거에 출마할 것임을 확인했다."
 gillard_goodbye_ast.2.a: "끝난 건가?"
 uranium_trade_deal_ast.1.t: "오스트레일리아의 우라늄 무역 제안"
 uranium_trade_deal_ast.1.d: "오스트레일리아 정부는 우리가 그들의 수출품에 대한 관세를 최소화하는 대가로 늘어난 물량의 우라늄을 우리에게 수출하겠다는 경제 협약을 제시하였습니다. 그들의 정부는 마찬가지로 우리의 수출품에 대한 관세를 철폐하는 데 동의했으며, 장래에 더 협력적인 무역 약속을 맺을 수 있도록 조건을 열어 두었습니다. 협약은 우라늄이 무기급 농축에 쓰여서는 안 된다고 규정하고 있으나, 일단 광석이 우리 국경 안으로 들어오면 그것은 정말로 우리에게 달려 있습니다."
 uranium_trade_deal_ast.1.a: "결실 있는 협약이다."
 uranium_trade_deal_ast.1.b: "우리 이익에 부합하지 않는다."
 uranium_trade_deal_ast.2.t: "인도, 우라늄 협정에 동의"
 uranium_trade_deal_ast.2.d: "인도가 새로운 조건에 동의하고 무역 협약에 서명했습니다! 우리는 그들로부터 다양한 재화와 서비스를 늘어나고 간소화된 비율로 기대할 수 있으며, 그들은 우리의 우라늄에 대한 관세를 철폐합니다. 협정의 성공에 결정적으로, 그들은 또한 우라늄이 무기급 농축에 사용되지 않는다고 규정한 국제원자력기구(IAEA) 기준을 채택하는 데도 동의했습니다. 그 대가로 우리는 그들과 에너지 연구에서 협력할 것입니다."
 uranium_trade_deal_ast.2.a: "윈윈이다!"
 uranium_trade_deal_ast.3.t: "인도, 무역 협약 거부"
 uranium_trade_deal_ast.3.d: "인도는 우리의 무역 제안을 거부하고 현재의 약속을 계속 유지하는 쪽을 택했습니다. 총리 [RAJ.GetLeader]은(는) 결과에 대해 논평하지 않았으나, 우리가 그들 정부의 호감을 사지 못하고 있는 듯합니다. 이는 분명 태평양 무역의 후퇴이자 안타까운 실수입니다."
 uranium_trade_deal_ast.3.a: "감각을 잃어 가고 있다."
 uranium_trade_deal_ast.5.t: "모스크바, 협약에 서명"
 uranium_trade_deal_ast.5.d: "모스크바 정부는 우리의 무역 조건에 동의했으며, 그들에 대한 우라늄 수출 증가의 대가로 우리 상품에 대한 다양한 관세를 철폐할 것입니다. 그들은 우라늄의 용도에 대해서는 모호한 태도를 유지했지만, 무기급 농축에 사용하지 않겠다고 약속했습니다. 이 협정은 베를린 장벽 붕괴 이전 이후로 이 수준에서 달성된 적 없는 협력의 돌파구이며, 그들은 양국 간 협력을 계속하기를 열망하는 듯합니다."
 uranium_trade_deal_ast.5.a: "보르시치를 내와라!"
 uranium_trade_deal_ast.6.t: "모스크바, 협상에서 철수"
 uranium_trade_deal_ast.6.d: "러시아는 우리의 무역 제안을 거부하고 현재의 약속을 계속 유지하는 쪽을 택했습니다. 대통령 [SOV.GetLeader]은(는) 결과에 대해 논평하지 않았으나, 우리가 그들 정부의 호감을 사지 못하고 있는 듯합니다. 이는 분명 태평양 무역의 후퇴이자 안타까운 실수입니다."
 uranium_trade_deal_ast.6.a: "곰은 가만히 두는 편이 낫다."
 rudd_in_korea.1.t: "다운 언더발 호응"
 rudd_in_korea.1.d: "오스트레일리아의 외교 장관은 우리와 대한민국 사이의 관계 해빙을 조성하기 위해 중국을 통해 우리와 협상을 진행해 왔습니다. 이 계획은 대담하며 다소 순진합니다. 오스트레일리아는 제재 완화와 개발 원조 지원을 대가로, 우리의 현존 무기를 해체하지 않은 채 장거리 무기 생산을 중단하는 일정에 합의할 것을 요청했습니다. 우리와 대한민국의 전쟁은 기술적으로 종결되지 않았으므로, 그들은 DMZ 검문소에서 분쟁을 해결하자고 제안했습니다. 이는 가치 있는 선전 기회가 될 수 있습니다."
 rudd_in_korea.1.a: "독특한 기회다."
 rudd_in_korea.1.b: "우리의 최선의 이익에 부합하지 않는다."
 rudd_in_korea.2.t: "케빈 러드의 한반도 승리"
 rudd_in_korea.2.d: "남북한 사이의 비무장지대 검문소를 천천히 걸어가던 케빈 러드는 북한 지도자 [NKO.GetLeader]을(를) 만나 두 사람이 악수를 나누었다. 각자 국경의 자기 쪽에 서서 나눈 이 악수는 한반도 관계에서의 상징적 도약을 알렸고 아시아의 더 큰 현상에 극적인 변화가 일어났음을 의미했다. 이어 러드는 국경을 넘어 오스트레일리아 정부의 구성원이자 전직 지도자로서는 처음으로 그 나라에 발을 들였다. \n\n중국을 거치며 오가는 네 달간의 치열한 협상 끝에 돌파구가 마련되었다. [NKO.GetLeader]은(는) 제재 완화와 개발 원조 지원을 대가로 장거리 무기 개발을 중단하는 일정과, 기술적으로 1950년부터 계속되어 온 한국 전쟁의 해결에 동의했다. 러드와 최고 지도자는 그날 늦게 열린 기자 회견에서 양국이 이루기를 바라는 상호 우호를 강조했다. \n\nDMZ까지 러드와 동행한 대한민국 대통령 [KOR.GetLeader]은(는) 러드의 노력을 진정한 성공이자 국제 평화에 이로운 일이라고 극찬했다."
 rudd_in_korea.2.a: "탄탄한 외교가 다시 승리한다."
 vietnam_trade_gillard_ast.1.t: "오스트레일리아의 무역 제안"
 vietnam_trade_gillard_ast.1.d: "오스트레일리아 정부는 양국 간 무역을 늘어난 물량으로 간소화하고 양측의 관세를 최소화하는 경제 협약을 제시하였습니다. 지금까지 우리는 양국 사이에 일관되게 건전한 무역을 누려 왔으며, 그들은 장래에 더 협력적인 방식에 관심이 있는 듯합니다."
 vietnam_trade_gillard_ast.1.a: "공정한 제안이다."
 vietnam_trade_gillard_ast.1.b: "우리에게 맞지 않는다."
 vietnam_trade_gillard_ast.2.t: "베트남, 무역 협상에 동의"
 vietnam_trade_gillard_ast.2.d: "베트남 정부는 새로운 조건에 동의하고 무역 협약에 서명했습니다. 우리는 그들로부터 다양한 재화와 서비스를 늘어나고 간소화된 비율로 기대할 수 있으며, 더 많은 오스트레일리아인이 가까운 상점에서 더 저렴한 상품을 누릴 수 있게 될 것입니다."
 vietnam_trade_gillard_ast.2.a: "모든 것이 맞아떨어지고 있다."
 vietnam_trade_gillard_ast.3.t: "베트남, 무역 협상 거부"
 vietnam_trade_gillard_ast.3.d: "베트남은 우리의 무역 제안을 거부하고 현재의 약속을 계속 유지하는 쪽을 택했습니다. 외부의 압력이 그들의 서명을 막았을 수도 있으나 서기장 [VIE.GetLeader]은(는) 결과에 대해 논평하지 않았습니다. 이는 분명 태평양 무역의 후퇴이자 안타까운 결과입니다."
 vietnam_trade_gillard_ast.3.a: "실망스러운 결과다."
 stir_the_pot_event.1.t: "오스트레일리아, 비행 금지 구역 요구"
 stir_the_pot_event.1.d: "우리 전투기가 민간 기반시설을 우발적으로 타격한 여러 사건 이후, 오스트레일리아 정부는 우리가 리비아 상공에 시행되는 \\"비행 금지 구역\\"을 준수할 것을 요구하였으며, 오스트레일리아 공군과 교전하는 일이 없도록 우리 항공기가 기지에 머무르도록 명령했습니다. 그들이 이 요구를 실제로 집행할 의도가 있는지는 우리가 말할 수 없으나, 그들은 매우 멀리 있으면서 상당히 많은 것을 요구하고 있습니다."
 stir_the_pot_event.1.a: "그들의 요구에 응한다."
 stir_the_pot_event.1.b: "리비아의 영공은 리비아의 것이다!"
 stir_the_pot_event.2.t: "리비아, 우리의 요구에 굴복"
 stir_the_pot_event.2.d: "오스트레일리아의 개입 위협 속에서 [LBA.GetLeader]은(는) 내전이 진행되는 동안 리비아 영공에 '비행 금지 구역'을 설정하는 데 동의하였습니다. 이는 민간인 사상자를 최소한으로 유지하고 인접국으로의 확산을 막는 데 도움이 되기를 바랍니다."
 stir_the_pot_event.2.a: "현실 정치의 실현이다."
 stir_the_pot_event.3.t: "리비아, 우리의 요청 거부"
 stir_the_pot_event.3.d: "민간인 인명 손실이 계속됨에도 [LBA.GetLeader]은(는) 리비아 영공에 대한 '비행 금지 구역' 요청을 거부하였습니다. 그들의 지속적인 내전은 역내 주민들에게 현재의 위험을 계속 초래할 것이며, 인접국으로의 확산 위험도 커지고 있습니다. 우리의 요구를 어떻게 관철할지는 이제 우리에게 달려 있습니다."
 stir_the_pot_event.3.a: "그들은 대안이 무엇인지 알고 있었다."
 myanmar_intervention_gillard.1.t: "오스트레일리아, 평화 유지 협력 요구"
 myanmar_intervention_gillard.1.d: "오스트레일리아 정부는 자국의 평화 유지군이 국내에 진입하여 현재의 반군 위기를 처리하는 것을 돕도록 허용하라는 요구를 우리에게 보냈습니다. 그 도움은 고맙겠으나, 그들의 조건은 위기가 해소될 때까지 우리를 사실상 그들 정부의 정치적 종속국으로 만들 것이며, 그 해소 시점은 그들의 조건상 정의되어 있지 않습니다. 그들은 이 요구를 집행하는 데 완강한 것으로 보이며, 우리가 거부할 경우 군사 침공도 배제할 수 없을 정도입니다."
 myanmar_intervention_gillard.1.a: "절대 안 된다."
 myanmar_intervention_gillard.1.b: "대안이 없다."
 myanmar_intervention_gillard.2.t: "미얀마, 조건 수락"
 myanmar_intervention_gillard.2.d: "커져 가는 반군의 위협에 직면하여 [BRM.GetLeader]은(는) 위기를 억제하기 위해 우리의 평화 유지군이 미얀마에 진입하는 것을 허용하기로 동의하였습니다. 우리 군의 상당한 부분이 곧 점령을 시작할 것입니다. 궁극적으로 이는 테러와의 싸움에서 큰 승리입니다."
 myanmar_intervention_gillard.2.a: "그들 자신을 위한 것이다."
 myanmar_intervention_gillard.3.t: "미얀마, 평화 유지 조건 거부"
 myanmar_intervention_gillard.3.d: "우리 대표단이 버마 측과 좋은 분위기로 출발했음에도 [BRM.GetLeader]은(는) 커져 가는 반군 위기에 맞서 싸우는 것을 돕겠다는 우리의 제안을 단호하게 거부하였습니다. 이 나라는 붕괴 직전까지 계속 무너져 내리고 있으며, 테러 조직의 온상이 될 실질적인 위험을 안고 있습니다. 상황이 얼마나 악화될 수 있는지를 고려하면, 우리의 대응은 이것이 초래하는 위험에 비례해야 합니다."
 myanmar_intervention_gillard.3.a: "제재로 협력하게 만든다."
 myanmar_intervention_gillard.3.b: "개입해야 한다."
 ast_myanmar_intervention_rejection_outcomes_tt: "미얀마가 거부하면 오스트레일리아는 제재와 금수 조치를 부과하거나 괴뢰국 전쟁 명분을 준비할 수 있습니다."
 reconciliation_discontent: "화해에 대한 불만"
 reconciliation_discontent_desc: "지속적인 불이익이 오스트레일리아 원주민들의 삶 전반에 스며들어 있습니다. 마보 판결은 많은 이들의 정신을 되살렸지만, 지난 10년간 한결같이 무관심한 지도부는 아직 남아 있던 소수의 희망마저 대부분 짓눌러 버렸고, 오늘날 그 혜택을 보는 이는 더욱 드뭅니다. 목소리를 내는 소수는 여전히 절박한 변화를 정부에 호소하고 있습니다."
 reform_despair_ast: "화해에 대한 절망"
 reform_despair_ast_desc: "변화에 대한 희망이 사라지면서 화해의 정신도 꺼져 버렸습니다. 원주민 오스트레일리아인들은 보장된 미래 없이 여전히 사회의 변두리에서 살아가고 있으며, 다른 많은 이들 역시 우리 정책의 방향에 환멸을 느끼고 있습니다. 모든 국민의 평등은 이제 아득히 먼 일처럼 느껴집니다. 앞으로 불만을 품은 유권자들이 더 급진적인 운동을 지지하리라 예상할 수 있습니다."
 rekindled_hope_ast: "되살아난 희망"
 rekindled_hope_ast_desc: "많은 오스트레일리아인의 어깨에서 무거운 짐이 덜어졌습니다. 작지만 분명히 측정 가능한 방식으로 국가가 치유를 향해 나아갔습니다. 갈 길은 여전히 멀지만, 그 길에 오르는 여정은 한결 수월해졌습니다. 도움이 필요한 이들을 위한 기회가 더 많이 제공되고 있습니다. 직장과 학교는 모든 오스트레일리아인에게 더욱 단합되고 든든한 곳이 되었습니다. 공동체는 이제 희망을 품고 앞날을 바라봅니다."
 economic_radical: "경제 급진주의자"
 john_howard: "존 하워드"
 the_rba_ast: "호주 준비은행"
 the_rba_ast_desc: "오스트레일리아 준비은행은 우리의 중앙은행이자 은행권 발행을 관장하는 기관입니다. 이는 사실상 이들이 금리를 좌우한다는 뜻입니다. 우리가 정책을 잘 운용하여 지출과 실업률을 낮추면 이들도 호의적으로 응할 것입니다."
 work_for_the_dole: "실업수당 근로 연계"
 work_for_the_dole_desc: "이 프로그램은 참가자를 훈련시키고, 가능한 경우 지역사회를 돕는 일에 투입하는 것을 목표로 합니다. 이들은 근로 기간 동안 소득 지원을 계속 받으며, 우리는 훈련을 이어 갑니다."
 work_for_the_dole_2: "실업수당 근로 연계"
 work_for_the_dole_2_desc: "이 프로그램은 참가자를 훈련시키고, 가능한 경우 지역사회를 돕는 일에 투입하는 것을 목표로 합니다. 이들은 근로 기간 동안 소득 지원을 계속 받으며, 우리는 훈련을 이어 갑니다. 프로그램이 성장함에 따라 우리의 건설 사업을 보조하기 위해 여러 주 단위 건설 직무를 참여 기회 목록에 포함했습니다."
 baby_bonus_idea_ast: "출산 장려금"
 baby_bonus_idea_ast_desc: "이 제도는 새로 부모가 된 이들이 자녀를 양육하며 짊어지는 비용을 상쇄하는 것을 목적으로 합니다. 자격을 갖춘 자녀 1인당 3,000달러의 일시금이 부모에게 지급됩니다. 이는 인구 증가를 장려하여 오스트레일리아인의 고령화를 완화할 것입니다."
 negative_gearing_tooltip_tt: "§Y지주§!와의 관계와 재선 가능성에 막대한 타격을 주지만, 장차 주택 위기를 막을 수도 있습니다."
 tafe_investment: "TAFE 투자"
 signed_the_kyoto_protocol_ast: "교토 의정서 서명"
 kyoto_protocol_ast: "교토 의정서"
 kyoto_protocol_ast_desc: "1997년 다른 국가들이 처음 채택한 이 의정서는 지구온난화에 관한 최신 과학적 합의를 바탕으로 산업계의 온실가스 배출을 줄이는 길잡이가 되어 왔습니다. 모든 규제가 시행 중인 것은 아니지만, 우리는 언젠가 온실가스 순배출 제로에 도달하기를 바라며 규제를 단계적으로 도입하고 있습니다."
 ast_avoid_the_speech_tt: "연립의 단합을 위해 당은 중립을 지키라는 지시를 받게 됩니다. 대중이 관심을 잃기를 바랄 수밖에 없습니다."
 national_water_initiative_ast: "§G국가 수자원 구상§!"
 national_water_initiative_ast_2: "§G국가 수자원 구상§!"
 ast_a_nation_worth_preserving_tt: "우리의 §G성공§!이 가져온 효과는 앞으로 이어질 여러 세대가 체감하게 될 것입니다."
 police_and_security_increase_tt: "시위에 대응하기 위해 §Y경찰 및 보안 예산§!이 증액됩니다."
 police_and_security_increase_2_tt: "사법 권한을 확대하기 위해 §Y경찰 및 정보 예산§!이 증액됩니다."
 asio: "ASIO"
 asio_desc: "오스트레일리아안보정보기구는 모든 내부 위협으로부터 시민을 보호할 책임을 집니다. 50년도 더 전에 창설된 이 기구는 새 천 년에 오스트레일리아가 직면한 증대하는 위협에 대응하도록 개편되었습니다."
 streamlined_asylum_policy_ast: "간소화된 망명 정책"
 encourage_foreign_students_ast: "외국인 유학생 장려"
 foreign_industrial_experts_ast: "외국인 기술 전문가"
 foreign_industrial_experts_ast_desc: "해외 전문가들에게 추가 우대 비자가 발급되었습니다. 전 세계의 뛰어난 인재들이 오스트레일리아에서 일하고 가르치게 됩니다."
 border_protection_bill_ast: "국경 보호 법안"
 our_ast_deputy_peacekeepers: "우리의 부보안관 평화유지군"
 australian_political_system: "오스트레일리아 정치 체제"
 king_of_the_battlers: "서민의 왕"
 tourism_campaign_ast: "국가 캠페인"
 accepted_pacific_solution: "구금 시설 유치"
 denied_pacific_solution: "구금 시설 유치 거부"
 IND_extremist_suppression_bonus: "오스트레일리아와의 대테러 공동 노력"
 rudd_in_the_fire_tt: "케빈 러드가 해외에서 우리를 위한 기회를 찾는 임무를 맡게 됩니다. 시간이 지남에 따라 국제 임무 탭에서 더 많은 §2결정§!을 사용할 수 있게 됩니다."
 sino_aus_peacekeeping: "중국-오스트레일리아 평화유지"
 sino_aus_peacekeeping_desc: "이 구상의 시작에 불과하지만, 이번 합의는 태평양에서의 향후 평화유지 작전의 토대를 마련합니다. 정보 수집, 대테러, 무역 보호에서 협력함으로써 양국 사이의 바다를 계속 안전하게 지키고 두 나라 간의 간극을 메울 수 있습니다. \n§W--------------§!\n중국과 전쟁 중이 되면 이 국가 정신은 §R제거§!됩니다."
 ast_peacekeeping: "중국-오스트레일리아 평화유지"
 chinese_export_bonus_ast: "중국 수출 계약"
 japanese_export_deal_ast: "§4일본 농업 계약§!"
