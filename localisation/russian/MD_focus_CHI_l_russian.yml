l_russian:
 CHI_Belt_and_Road_Initiative: "Один пояс и один путь"
 CHI_Belt_and_Road_Initiative_desc: "Концепция Си Цзиньпина, впервые озвученная в Астане, а затем в Джакарте, объединяет «Экономический пояс Шелкового пути» и «Морской Шелковый путь XXI века» в единую программу инфраструктурной дипломатии, охватывающую более 140 стран. Мы должны сделать её руководящим принципом нашей внешнеэкономической политики."
 CHI_The_China_Pakistan_Economic_Corridor: "Китайско-Пакистанский экономический коридор"
 CHI_The_China_Pakistan_Economic_Corridor_desc: "От Кашгара до Гвадара через Каракорам пролегает три тысячи километров автомобильных и железнодорожных дорог, а также трубопроводов. Рабочие Пакистанской организации по строительству приграничных объектов и инженеры Народно-освободительной армии Китая подписывают друг другу на форму в долине Хунза. Жизненно важная артерия открыта."
 CHI_The_South_China_Sea: "Южно-Китайское море"
 CHI_The_South_China_Sea_desc: "Южно-Китайское море занимает центральное место в нашей морской стратегии: оно богато углеводородами, через него пролегают самые оживлённые морские пути в мире, и за него борются все прилегающие к нему страны. Нам предстоит выбрать свою позицию: терпеливое продвижение вперед в рамках «стратегии капусты», терпеливая дипломатия в духе сокровищных флотов Чжэн Хэ или силовое восстановление системы дани во всех четырёх морях. Каждый из этих путей определяет реакцию наших соседей, стран АСЕАН и великих держав."
 CHI_Strengthen_Relations_with_the_South: "Канал «Чжэджу»"
 CHI_Strengthen_Relations_with_the_South_desc: "Наладить постоянный канал консультаций с Сеулом посредством незаметной дипломатии по «закулисным каналам» в отношении острова Чеджу. Мы рассматриваем Республику Корея как полноценного легитимного стратегического партнера, а не как буферное государство, управляемое через Пхеньян."
 CHI_Maintain_Commitment_to_Denuclearization: "Коммюнике по Йонбёну"
 CHI_Maintain_Commitment_to_Denuclearization_desc: "Опубликовать официальное коммюнике, в котором мы обязуемся добиваться денуклеаризации Северной Кореи. По неформальным каналам донести до Пхеньяна следующее послание: наша дипломатическая поддержка носит условный, а не безусловный характер. Вашингтон и Сеул принимают к сведению этот поворот в ситуации."
 CHI_Encourage_Economic_Reforms: "Поддержка экономических реформ"
 CHI_Encourage_Economic_Reforms_desc: "Тот факт, что одна из наших близких стран-партнёров по-прежнему остаётся слаборазвитой и отсталой страной, является позором для нас, как преемников Дэн Сяопина. [NKO.GetLeader] следует убедить либерализовать экономику Северной Кореи."
 CHI_Mediate_Korean_Peace_Talks: "Посредничество в корейских переговорах"
 CHI_Mediate_Korean_Peace_Talks_desc: "Слишком долго Корейский полуостров существовал в замороженном состоянии войны. Напряженность в отношениях между Северной и Южной Кореей существует из-за взаимной подозрительности и недоверия по поводу оборонительных действий, которые ошибочно воспринимаются как наступательные. Кроме того, присутствуют серьезные идеологические разногласия. Для выхода из этого внутреннего тупика потребуется заинтересованный внешний субъект, такой как Китай."
 CHI_Back_Peaceful_Korean_Unification: "Возвращение мира в Корею"
 CHI_Back_Peaceful_Korean_Unification_desc: "Мы должны выразить нашу поддержку окончательному воссоединению Корейского полуострова под руководством нейтрального правительства, свободного от внешнего влияния. Осуществится ли эта возможность - зависит только от корейцев."
 CHI_End_the_Kim_Dynasty: "Завершение династии"
 CHI_End_the_Kim_Dynasty_desc: "Род Кимов руководил жестокой и регрессивной диктатурой, которую мы вынуждены были десятилетиями отбрасывать назад. Нельзя допустить, чтобы такое положение дел продолжалось."
 CHI_Gain_the_Support_of_the_KPA: "Поддержка недовольных из КНА"
 CHI_Gain_the_Support_of_the_KPA_desc: "По данным нашей разведки, в офицерском корпусе Корейской народной армии имеются элементы, которые недовольны правлением [NKO.GetLeader]. Нам следует наладить контакты с этими офицерами, с которыми нас связывает общая цель."
 CHI_The_North_Korean_Coup: "Северокорейский государственный переворот"
 CHI_The_North_Korean_Coup_desc: "Пришло время свергнуть этот дряхлый режим. Наше влияние в Северной Корее привлекло на свою сторону многих офицеров, хотя наши аналитики по-прежнему не уверены в том, следует ли нам искать еще большую поддержку, прежде чем приступать к этому рискованному предприятию."
 CHI_Establish_a_Puppet_Government: "Создание марионетки"
 CHI_Establish_a_Puppet_Government_desc: "Теперь, когда переворот удался, новое военное правительство находится у нас в долгу и поэтому не будет иного выбора, кроме как склониться перед нашей властью."
 CHI_The_Indian_Subcontinent: "Индийский субконтинент"
 CHI_The_Indian_Subcontinent_desc: "К югу от Тибета пролегает огромный субконтинент, где господствует соперничество между Индией и Пакистаном. Мы должны тщательно продумать наш подход к этому резко разделенному региону."
 CHI_Support_Nepals_Maoists: "Backing the UCPN(M)"
 CHI_Support_Nepals_Maoists_desc: "Народная война 1996–2006 годов кардинально изменила Непал. Скрытая поддержка Объединенной коммунистической партии Непала (маоистской) — в виде финансовой помощи, предоставления убежища в Тибете и идеологической поддержки — может на целое поколение закрепить ориентацию политики Катманду в сторону Пекина."
 CHI_Respect_Nepalese_Neutrality: "Пересмотр договора 1960 года"
 CHI_Respect_Nepalese_Neutrality_desc: "Договор о мире и дружбе между Непалом и Индией, заключенный в 1960 году, на шестьдесят лет закрепил Катманду в стратегической орбите Дели. Мы будем незаметно финансировать непальских активистов, призывающих к его пересмотру."
 CHI_Guarantee_Bangladesh: "Даккийская разрядка"
 CHI_Guarantee_Bangladesh_desc: "Шейх Хасина говорит о стратегической автономии. Пекин говорит о братстве по ту сторону Брахмапутры. Индия наблюдает с другого берега. Геометрия Бенгальского залива меняется."
 CHI_Drop_Claims_on_Bhutan: "Отбрасывание претензий"
 CHI_Drop_Claims_on_Bhutan_desc: "Главным препятствием на пути улучшения отношений между нами и Бутаном являются наши претензии на часть территории, которую они контролируют. Это также привело к трениям с индийцами, которые потенциально могут привести к нежелательному конфликту. Будет лучше, если мы пока оставим затею с претензиями."
 CHI_Doklam_Road_Standoff: "Противостояние на пути через Доклам"
 CHI_Doklam_Road_Standoff_desc: "Доклам - это китайская территория, и поэтому мы должны иметь возможность свободно перемещать через нее войска и строительную технику, если пожелаем. Если Бутан и Индия хотят ответить, то пусть отвечают. Это будет хорошая возможность проверить их боеготовность."
 CHI_Iron_Brothers: "Железные братья"
 CHI_Iron_Brothers_desc: "Наше партнерство с Пакистаном основано на тесном стратегическом взаимодействии, и эти отношения следует сохранять в интересах обеих сторон. Наш общий враг — Индия — не сможет противостоять нашей совместной мощи."
 CHI_Joint_Military_Projects: "Совместное производство JF-17"
 CHI_Joint_Military_Projects_desc: "Истребитель JF-17 Thunder, разработанный совместно компаниями «Чэнду» и PAC Kamra, — это не просто истребитель. Он является основой ВВС Пакистана и доказательством того, что китайско-пакистанское военное сотрудничество способно обеспечить стратегический потенциал."
 CHI_Cooperate_on_Counterterrorism: "The East Turkestan Communique"
 CHI_Cooperate_on_Counterterrorism_desc: "Исламабад официально признал «ЭТИМ» террористической организацией и подписал рамочное соглашение об экстрадиции. Для нас это устраняет уязвимость, которая на протяжении двух десятилетий подрывала стабильность в Синьцзяне."
 CHI_Militarize_Gwadar_Port: "Милитаризация порта Гвадар"
 CHI_Militarize_Gwadar_Port_desc: "Наши инвестиции в порт Гвадар окупились и создали впечатляющий коммерческий объект. Мы можем извлечь выгоду из этого достижения, подготовив порт как для военных, так и для коммерческих целей. Это шаг, который, несомненно, испугает индийцев, но который, тем не менее, необходим для нашей безопасности."
 CHI_The_Quadrilateral_Cooperation_and_Coordination_Mechanism: "Механизм четырехстороннего сотрудничества"
 CHI_The_Quadrilateral_Cooperation_and_Coordination_Mechanism_desc: "Четырехсторонний механизм сотрудничества и координации, или ЧМСК, станет полезной группой из четырех стран, имеющих общие интересы в борьбе с терроризмом. Наверное, это также улучшит напряженные отношения между Пакистаном и Афганистаном, вдобавок поможет распространить наше влияние в Центральной Азии, где доминирует Россия, через наших таджикских партнеров."
 CHI_Support_Negotiations: "The Murree Process"
 CHI_Support_Negotiations_desc: "На пакистанском горном курорте сотрудники ISI наливают чай, а делегаты «Талибана» и представители афганского правительства сидят друг напротив друга за столом. Китаец в сером костюме внимательно слушает, не делая никаких записей."
 CHI_Joint_Operations: "Operation Mountain Tiger"
 CHI_Joint_Operations_desc: "Кодовое название серии регулярных совместных учений НОАК и пакистанских вооруженных сил. На этот раз учения не носят учебный характер. В Вахане и Хайбере солдаты НОАК впервые за несколько десятилетий выйдут на поле боя."
 CHI_Tackle_the_Root_Causes_of_Radicalization: "The Wakhan Corridor Accord"
 CHI_Tackle_the_Root_Causes_of_Radicalization_desc: "Семьдесят шесть километров Ваханского коридора — узкой полосы территории Афганистана, непосредственно граничащей с Синьцзяном, — слишком долго оставались вне контроля. Пекин, Кабул и Исламабад сходятся во мнении: необходимо создать буферную зону, кирпич за кирпичом, сторожевая башня за сторожевой башней."
 CHI_Disengage_from_Pakistan: "Выход Пакистана из состава союзников"
 CHI_Disengage_from_Pakistan_desc: "Настало время пересмотреть наш подход к Индийскому субконтиненту. Тесное партнерство между двумя крупнейшими экономиками мира может оказаться для нас более выгодным, чем продолжающийся союз с меньшей державой. Выход Пакистана из состава союзников станет первым шагом в нашем сближении с Индией."
 CHI_End_Joint_Military_Exercises: "Окончание совместных военных учений"
 CHI_End_Joint_Military_Exercises_desc: "Индийцы с подозрением относятся к нашим учениям с Пакистаном. Мы должны покончить с учениями, чтобы завоевать их доверие."
 CHI_Strategic_Realignment: "The Bandung Spirit Revived"
 CHI_Strategic_Realignment_desc: "В 1955 году в Джакарте Чжоу Эньлай и Джавахарлал Неру пожали друг другу руки перед камерами. «Хинди-Чини бхай-бхай», — скандировала толпа. Семь лет спустя миномётные снаряды полетели через линию Макмагона. Возможно, этому рукопожатию стоит дать вторую жизнь."
 CHI_Sino_Indian_Treaty_of_Friendship: "Китайско-индийский договор о дружбе"
 CHI_Sino_Indian_Treaty_of_Friendship_desc: "Наше партнерство с Пакистаном было, конечно, не единственным источником трений между нами и нашими индийскими коллегами. Чтобы начать новые отношения с Индией, необходимо будет рассмотреть территориальные претензии, которыми обладают наши страны."
 CHI_A_New_Alliance: "The Wuhan Spirit Realized"
 CHI_A_New_Alliance_desc: "В 2018 году Моди и Си прогулялись по садам Восточного озера и поговорили без помощников. Содержание их беседы не зафиксировано, но то, что последовало за этим, теперь вошло в историю: две азиатские цивилизации, наконец, нашли общий язык."
 CHI_Strike_Across_the_Himalayas: "The Galwan Reckoning"
 CHI_Strike_Across_the_Himalayas_desc: "В безлунную ночь в долине Галван в июне 2020 года солдаты убивали друг друга камнями и дубинками, поскольку их договор запрещал применение огнестрельного оружия. Погибли 21 индиец и четверо наших, хотя Пекин это не подтверждает. В ту ночь договор перестал действовать."
 CHI_String_of_Pearls: "Жемчужная нить"
 CHI_String_of_Pearls_desc: "Господство Индии над Индийским океаном - это нежелательное положение дел. Мы можем попытаться сдержать Индию во многом так же, как Америка пытается сдержать нас, а именно окружив нашего соперника военными базами, расположенными на территории наших региональных партнеров. Это окружение даст нам значительное преимущество, если мы вступим в состояние войны."
 CHI_Annex_Bhutan: "Аннексия Бутана"
 CHI_Annex_Bhutan_desc: "Наши притязания на Бутан могут не распространяться на всю территорию страны, но тесные исторические связи страны с Тибетом должны служить разумным обоснованием для нашего желания интегрировать Бутан в Тибетский автономный округ. Кроме того, аннексия лишила бы стратегически расположенного индийского союзника его влияния. Если наше влияние в Бутане станет достаточно большим, мы сможем аннексировать страну и без войны."
 CHI_Puppet_Nepal: "Марионеточный Непал"
 CHI_Puppet_Nepal_desc: "Некоторые политические силы в Непале готовы значительно укрепить связи своей страны с Китаем за счет партнерства с Индией. Это значительно помогло бы нашим внешнеполитическим целям. Увеличение нашего влияния в стране и обеспечение дружественного правительства позволит нам осуществить этот процесс мирным путем."
 CHI_Bring_the_Tiger_to_Heel: "Settle the McMahon Question"
 CHI_Bring_the_Tiger_to_Heel_desc: "Линия Макмахона была проведена британским колониальным чиновником в 1914 году и так и не была признана ни одним из китайских правительств — ни династией Цин, ни Республикой, ни Китайской Народной Республикой. Эта линия будет стерта."
 CHI_Assuage_Japanese_Concerns: "Успокоение"
 CHI_Assuage_Japanese_Concerns_desc: "Чтобы способствовать сближению с Японией, мы должны заверить Токио в том, что наши намерения не носят враждебного характера. Дела говорят громче слов."
 CHI_Form_the_SCO: "Форма ШОСа"
 CHI_Form_the_SCO_desc: "В настоящее время «Шанхайская пятерка» выступает для нас способом тесного взаимодействия с Россией, Казахстаном, Кыргызстаном и Таджикистаном. Эти взаимодействия были ценными, но могли бы быть улучшены и дальше, если бы мы превратили эту неофициальную старенькую группу в мощную межправительственную организацию."
 CHI_Emphasize_Economic_Cooperation: "Сверхважность экономического сотрудничества"
 CHI_Emphasize_Economic_Cooperation_desc: "ШОС должна в первую очередь быть посредником в оказании экономической помощи от богатых членов к более бедным. Наша цель региональной стабильности лучше всего достигается путем укрепления экономики наших более хрупких соседей. Более того, ШОС должна стремиться к тому, чтобы улучшить жизнь тех, кто просто проживает в ее границах."
 CHI_Civilian_Technology_Sharing: "Обмен гражданскими технологиями"
 CHI_Civilian_Technology_Sharing_desc: "Наша организация в первую очередь сосредоточена на развитии экономики своих более бедных членов, и поэтому она должна сосредоточиться только на совместном использовании невоенных технологий."
 CHI_Development_Assistance: "Увеличение объема помощи для развития"
 CHI_Development_Assistance_desc: "Наши нынешние усилия в области развития могут быть улучшены в дальнейшем для ускорения экономического роста в государствах-членах ШОС."
 CHI_Emphasize_Political_Cooperation: "Сверхважность политического сотрудничества"
 CHI_Emphasize_Political_Cooperation_desc: "ШОС должна быть прежде всего организацией, которая сохраняет региональную стабильность, защищая законные правительства своих государств-членов от дестабилизирующих угроз изнутри."
 CHI_Crack_Down_on_the_Three_Evils: "Расправа над 3 видами зла"
 CHI_Crack_Down_on_the_Three_Evils_desc: "Три зла - терроризм, сепаратизм и религиозный экстремизм являются источником беспокойства для всех членов ШОС. Через ШОС мы можем расширить политический потенциал друг друга для подавления этих опасных угроз."
 CHI_Emphasize_Military_Cooperation: "Сверхважность военного сотрудничества"
 CHI_Emphasize_Military_Cooperation_desc: "Нет необходимости для нас, чтобы маскировать намерения. ШОС должна быть явно ориентированной на безопасность организацией, которая обеспечивает нам и российским партнерам оплот против возможной агрессии со стороны внешних врагов, главным из которых являются Соединенные Штаты."
 CHI_Military_Technology_Sharing: "Обмен военными технологиями"
 CHI_Military_Technology_Sharing_desc: "Военные технологии России станут полезным активом для наших членов в случае внешней агрессии."
 CHI_Strengthen_Security_Framework: "Укрепление границ обеспечения безопасности"
 CHI_Strengthen_Security_Framework_desc: "Наше существующее военное сотрудничество в рамках ШОС хотя и является существенным, может оказаться недостаточным для противостояния полному натиску какой-нибудь сверхдержавы. Мы должны углубить наше существующее военное сотрудничество, чтобы мы как организация могли лучше подготовиться к худшему."
 CHI_Chinese_Dominance: "Китайское доминирование"
 CHI_Chinese_Dominance_desc: "В то время как наши позиции и позиции России в рамках ШОС в настоящее время равны, неудобная правда заключается в том, что наша мощь намного превосходит мощь наших бывших союзников. И влияние внутри организации должно соответствовать нашему реальному значению, поэтому РФ должна быть вынуждена занять более низкое положение."
 CHI_Equal_Partners: "Равноправное партнерство"
 CHI_Equal_Partners_desc: "Даже если мы начали обгонять РФ во многих областях, нам все равно есть чему поучиться у этой бывшей сверхдержавы. В наших интересах лучше держать русских в стороне, чем отчуждать и враждовать с ними."
 CHI_Exploit_Economic_Clout: "Использование экономической мощи"
 CHI_Exploit_Economic_Clout_desc: "Финансовая ориентация ШОС была очень выгодна для нас, учитывая китайское огромное превосходство в плане капитала. Теперь мы можем использовать это экономическое преимущество для укрепления нашего политического влияния на других членов ШОС."
 CHI_Split_CSTO: "Раскол ОДКБ"
 CHI_Split_CSTO_desc: "Наше партнерство с Россией не будет длиться вечно. Мы никогда не могли полностью доверять нашему экспансионистскому северному соседу. Если до сих пор в наших интересах было продолжать притворяться добрым сотрудником, то для дальнейшего развития ШОС мы должны положить этому конец. Теперь наши общие союзники должны сделать выбор - встать на нашу сторону или на сторону оппонента."
 CHI_Merge_with_CSTO: "Слияние с ОДКБ"
 CHI_Merge_with_CSTO_desc: "У российской организации безопасности ОДКБ (организация Договора о коллективной безопасности или \"Ташкентский пакт\") есть большой набор институтов военного сотрудничества, с которыми нам было бы выгодно познакомиться поближе."
 CHI_An_Alliance_to_Rival_NATO: "Альянс, соперничающий с НАТО"
 CHI_An_Alliance_to_Rival_NATO_desc: "Настало время раскрыть весь потенциал ШОС и укрепить институты Организации по военному сотрудничеству до такой степени, чтобы наше совместное командование и управление могли быть столь же эффективными, как и НАТО."
 CHI_Forum_on_China_African_Cooperation: "ФОКАК"
 CHI_Forum_on_China_African_Cooperation_desc: "Форум китайско-африканского сотрудничества (ФОКАК) облегчает наше взаимодействие со всем африканским континентом, то есть регионом, который мы рассматриваем не как отсталый или варварский, как это делает Запад, а как источник потенциала и возможностей."
 CHI_China_Africa_Development_Fund: "Китайско-африканский Фонд развития"
 CHI_China_Africa_Development_Fund_desc: "Через Китайско-африканский Фонд развития мы можем обеспечить столь необходимые инвестиции в инфраструктурные проекты на Африканском континенте."
 CHI_Invest_in_Cheap_Energy: "Инвестиции в дешевую энергию"
 CHI_Invest_in_Cheap_Energy_desc: "Несмотря на все разговоры о возобновляемых источниках энергии, в конце концов именно дешевое ископаемое топливо поднимет африканский народ из нищеты."
 CHI_Invest_in_Clean_Energy: "Инвестиции в чистую энергию"
 CHI_Invest_in_Clean_Energy_desc: "Развитие не должно происходить за счет окружающей среды. Наше техническое ноу-хау означает, что мы можем поделиться достижениями в области возобновляемых источников энергии с нашими партнерами на Африканском континенте."
 CHI_Outsource_Cheap_Labor: "Аутсорсинг дешевой рабочей силы"
 CHI_Outsource_Cheap_Labor_desc: "В период нашего развития наши рабочие получали минимальную заработную плату и вынуждены были терпеть огромные лишения. Но именно их страдания привели к тому, что наша страна достигла такого экономического успеха, каким она обладает сегодня. Страны Африки должны следовать той же модели."
 CHI_Workers_Rights: "Права рабочих"
 CHI_Workers_Rights_desc: "Благополучие каждого отдельного работника является неотъемлемой частью успеха страны. Мы должны оказывать поддержку только тем проектам, которые защищают средства к существованию людей, от которых зависит их успех."
 CHI_Agriculture: "Сельское хозяйство"
 CHI_Agriculture_desc: "Сельское хозяйство по-прежнему остается важной отраслью экономики многих африканских стран и является той сферой, от которой зависит жизнь большинства людей. Мы должны оказывать поддержку сельскохозяйственной отрасли, чтобы помочь отдельным работникам выстоять в условиях глобализации и жесткой международной конкуренции."
 CHI_Develop_Hospitals: "Развитие больниц"
 CHI_Develop_Hospitals_desc: "Трагедия многих на Африканском континенте - это десятки тысяч смертей, происходящих из-за состояний, легко поддающихся лечению. Мы должны предоставить нашим партнерам инструменты и необходимые средства для обеспечения их людей."
 CHI_Leverage_Influence: "Рычаги влияния"
 CHI_Leverage_Influence_desc: "Африка в таком большом долгу перед нами, что правительства всего континента должны подчиниться нашей воле."
 CHI_Write_Off_Debts: "Списывание долгов"
 CHI_Write_Off_Debts_desc: "Мы не будем держать наших партнеров в долговой яме. Им нужно позволить расти и развиваться в своем собственном темпе."
 CHI_Friendship_Schools: "Школы дружбы"
 CHI_Friendship_Schools_desc: "Школы дружбы народов обеспечивают столь необходимое образование по всему континенту, укрепляя человеческий потенциал в регионе."
 CHI_Joint_Research: "Совместное исследование"
 CHI_Joint_Research_desc: "Вместе наши страны смогут сделать научные достижения, которые принесут пользу всем нашим людям."
 CHI_TV_and_Internet_Access: "Доступ к TV и интернету"
 CHI_TV_and_Internet_Access_desc: "В XXI веке доступ домашних хозяйств к внешнему миру является ключевым показателем развития. Мы должны помочь нашим африканским партнерам обеспечить телевидение и доступ в интернет для своих граждан."
 sino_indian.1.t: "Суверенитет Бутана нарушен!"
 sino_indian.1.d: "Китайские войска сопровождают строительство дороги в Докламе, на территории Бутана, которую китайцы считают своей. Если это явное нарушение суверенитета Бутана не встретит сопротивления, Китай сможет закрепить свои претензии на Доклам и, возможно, на другие оспариваемые территории Бутана."
 sino_indian.1.a: "Мы должны послать войска, чтобы остановить это вторжение!"
 sino_indian.1.b: "Мы ничего не можем сделать."
 sino_indian.1.c: "Наши защитники встанут на нашу защиту."
 sino_indian.1.e: "Мы должны защищаться!"
 sino_indian.2.t: "Похоже, что наши защитники покинули нас..."
 sino_indian.2.d: "Индия предпочла не выполнять свои обязательства по защите нашего суверенитета. Таким образом, мы должны решить, сопротивляться китайскому вторжению или нет."
 sino_indian.2.a: "Мы бессильны."
 sino_indian.2.b: "Мы должны защищаться!"
 sino_indian.3.t: "[FROM.GetName] развернул войска, чтобы остановить строительство дороги"
 sino_indian.3.d: "Сотни [FROM.GetAdjective] солдат пересекли границу между нашей и своей территорией якобы в ответ на наше вторжение на территорию Бутана. Оставив в стороне абсурдность этого утверждения, мы должны решить, отступить ли и избежать вооруженного противостояния или обострить сложившуюся ситуацию."
 sino_indian.3.a: "Мы должны освободиться."
 sino_indian.3.b: "Мы должны стоять на своём!"
 sino_indian.4.t: "Китай распространяет свое влияние на Бутан"
 sino_indian.4.d: "Маленькая нация Бутан стала свидетелем того, как ее независимость была серьезно подорвана расширением Китаем дороги на суверенную территорию страны без его согласия. Ни Бутан, ни его защитник, Индия, не оказали сопротивления этому шагу, только осудив его и подтвердив статус территории как бутанской, а не китайской территории. Неспособность Индии защитить своего соседа от этого акта, как сообщается, серьезно подорвала исторически тесные отношения между двумя странами."
 sino_indian.4.a: "Китай продолжает вытеснять."
 sino_indian.5.t: "Китай покинул Бутан"
 sino_indian.5.d: "Столкнувшись со значительным сопротивлением усилиям по расширению существующей дороги на бутанскую территорию Доклам, Китай вывел свои войска и личный состав из этого региона. [CHI.GetLeader] подтвердил приверженность Китая миру и стабильности в регионе."
 sino_indian.5.a: "Китай отступил, пока что."
 sino_indian.6.t: "Китай победил в Докламском противостоянии!"
 sino_indian.6.d: "Разгромив наших врагов, наше превосходство над территорией Доклама теперь обеспечено!"
 sino_indian.6.d_RAJ: "Не сумев защитить Доклам, у нас нет выбора, кроме как уступить его китайцам."
 sino_indian.6.a: "Славная победа!"
 sino_indian.6.b: "Унизительное поражение..."
 sino_indian.7.t: "Китай проиграл в Докламском противостоянии!"
 sino_indian.7.d: "Не сумев отобрать Доклам у наших врагов, у нас нет другого выбора, кроме как отступить с земли, которая по праву принадлежит нам."
 sino_indian.7.d_RAJ: "После разгрома наших врагов суверенитет Бутана над Докламом сохранился!"
 sino_indian.7.a: "Славная победа!"
 sino_indian.7.b: "Унизительное поражение..."
 sino_indian.8.t: "Докламское противостояние заканчивается безрезультатно"
 sino_indian.8.d: "И наша, и их сторона не смогли одержать верх в этом столкновении за территорию Доклама."
 sino_indian.8.a: "Мир, пока что..."
 sino_indian.9.t: "Китай захватил Аруначал-Прадеш!"
 sino_indian.9.d: "Разгромив наших врагов, наше превосходство над территорией Южного Тибета, известной нашим врагам как Аруначал-Прадеш, теперь обеспечено!"
 sino_indian.9.d_RAJ: "Не сумев защитить Аруначал-Прадеш, у нас нет другого выбора, кроме как уступить его китайцам."
 sino_indian.9.a: "Славная победа!"
 sino_indian.9.b: "Унизительное поражение..."
 sino_indian.10.t: "Китай не смог взять Аруначал-Прадеш!"
 sino_indian.10.d: "Не сумев отобрать Аруначал-Прадеш у наших врагов, у нас нет другого выбора, кроме как отступить с земли, которая по праву принадлежит нам."
 sino_indian.10.d_RAJ: "После разгрома наших врагов суверенитет над Аруначал-Прадеш сохранился!"
 sino_indian.10.a: "Славная победа!"
 sino_indian.10.b: "Унизительное поражение..."
 sino_indian.11.t: "Китай предлагает договор для улучшения отношений и разрешения споров"
 sino_indian.11.d: "Кульминацией прошлых примирительных действий Китая стало предложение подписать договор между нашими двумя странами, который разрешит наши пограничные споры и устранит наши разногласия раз и навсегда. Должны ли мы принять их предложение или придерживаться статус-кво?"
 sino_indian.11.a: "Мы должны принять это историческое предложение!"
 sino_indian.11.b: "Китайцам нельзя доверять!"
 sino_indian.12.t: "Китайско-индийский договор о дружбе"
 sino_indian.12.d: "Китай и Индия подписали договор о дружбе, положив конец десятилетиям обиды и подозрения, которые существовали между двумя региональными гигантами. После ряда замечательных попыток примирения со стороны Китая обиды индийского правительства на китайцев быстро сошли на нет. Последствия этого нового и удивительного партнерства еще не проявились."
 sino_indian.12.a: "Хороший день для мира и дипломатии!"
 sino_indian.12.b: "Крайне тревожное событие..."
 sino_indian.13.t: "Китай повернулся к Индии"
 sino_indian.13.d: "На протяжении десятилетий Китай и Пакистан были близкими стратегическими партнерами из-за общего недоверия к Индии. Однако в последнее время ситуация начала меняться: Китай отказался от своих обязательств по защите Пакистана, а также прекратил совместные военные учения и инвестиционные проекты между двумя странами. Сообщается, что китайцы сигнализируют индийцам о том, что эти меры представляют собой долгосрочную переориентацию китайской внешней политики, а не просто краткосрочную размолвку. Еще предстоит увидеть реакцию Индии на эти события."
 sino_indian.13.a: "Китай ищет новых союзников..."
 sino_indian.13.b: "Что нам с этим делать?"
 arunachal_war.1.t: "Border Skirmish in Arunachal Pradesh"
 arunachal_war.1.d: "A minor clash along the Line of Actual Control has resulted in casualties and heightened tensions."
 arunachal_war.1.a: "Reinforce our positions."
 arunachal_war.2.t: "Renewed Border Incident"
 arunachal_war.2.d: "Another exchange of fire along the disputed border has strained morale and manpower."
 arunachal_war.2.a: "Hold the line."
 arunachal_war.3.t: "Arunachal Readiness Setback"
 arunachal_war.3.d: "Our forces in the region have suffered a reversal, degrading operational readiness along this front."
 arunachal_war.3.a: "Regroup and replenish."
 arunachal_war.4.t: "Border War Already Underway"
 arunachal_war.4.d: "A border conflict is already active in the disputed region. Further escalation is unnecessary."
 arunachal_war.4.a: "Noted."
 arunachal_war.20.t: "Victory at the Line of Actual Control"
 arunachal_war.20.d: "Our forces have prevailed in the border engagement, securing our territorial claim for now."
 arunachal_war.20.a: "Consolidate our gains."
 arunachal_war.21.t: "Defeat at the Line of Actual Control"
 arunachal_war.21.d: "Our forces were repulsed in the border engagement. The campaign has cost us men and momentum."
 arunachal_war.21.a: "Withdraw and reassess."
 arunachal_war.22.t: "Border War Canceled"
 arunachal_war.22.d: "The border conflict has been called off before a decisive outcome was reached."
 arunachal_war.22.a: "Stand down."
 arunachal_war.23.t: "Driven Back"
 arunachal_war.23.d: "We have been forced to yield ground in the border fighting. Our position has weakened."
 arunachal_war.23.a: "Fall back to defensible positions."
 arunachal_war.24.t: "Repelled the Attackers"
 arunachal_war.24.d: "Our forces successfully defended the disputed territory against the incursion."
 arunachal_war.24.a: "Fortify our positions."
 arunachal_war.25.t: "Border War Canceled"
 arunachal_war.25.d: "The border conflict has ended without a decisive outcome."
 arunachal_war.25.a: "Stand down."
 arunachal_war.30.t: "Escalation Decision"
 arunachal_war.30.d: "The border conflict has reached a critical juncture. We must decide how far we are willing to go."
 arunachal_war.30.a: "Absorb the loss and maintain stability."
 arunachal_war.30.b: "Escalate - press our war goal."
