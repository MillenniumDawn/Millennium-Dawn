 hung_parliament_ast: "Подвешенный парламент"
 hung_parliament_ast_desc: "Впервые с 1940 года в Австралии сложилась ситуация, когда ни одна из партий не имеет большинства в парламенте. Ни одна из партий не обладает достаточной поддержкой для формирования правительства, и пока мы не сможем договориться о поддержке, необходимой для увеличения числа мест с 72 до 76, мы фактически находимся в законодательном тупике."
 hung_parliament_ast_2: "Роки Коалиция"
 hung_parliament_ast_2_desc: "Мы, возможно, и сформировали правительство, но существующая коалиция далека от идеала. В ней много недовольных членов партии и независимых кандидатов, и любая неудача в принятии политических решений может привести к преждевременному краху нашего правительства на начальной стадии его существования."
 diplomacy_tightrope_ast: "Дипломатический канат"
 diplomacy_tightrope_ast_desc: "Мы балансируем между сложным балансированием, поддерживая прочный альянс в сфере безопасности и обороны с Соединенными Штатами и стремясь к стабилизации торговой взаимозависимости с Китаем. Именно благодаря тому, что нам удается оставаться на плаву, мы избегаем необходимости выбирать между этими двумя крайностями."
 non_permanent_unsc_member: "Непостоянный член Совета Безопасности ООН"
 non_permanent_unsc_member_desc: "Совет Безопасности ООН каждые два года избирает 10 непостоянных членов в Генеральную Ассамблею. Эти страны имеют право представлять резолюции, которые ранее принимались путем голосования."
 gloves_off_diplomacy_ast: "Дипломатия без перчаток"
 consuls_of_peace_idea_ast: "Консулы мира"
 the_australian_century_tt: "§YУскоренное рассмотрение ряда предложений по новым рудникам, ожидающих в настоящее время утверждения.§!"
 kevin_rudd_desc: "Эксперт по азиатской геополитике и постоянный телеведущий Кевин Радд стал новым лицом лейбористского движения. Способный сочетать стабильность, которую обеспечивал Говард, с обещанием реформ, которых требует страна, Радд продемонстрировал умение балансировать интересы партии, оставаясь при этом в хороших отношениях с общественностью. Благодаря реформам Гофа Уитлама, Радд смог поступить в университет и использовать полученное образование для работы в Министерстве иностранных дел в 1981 году. Этот опыт он использовал на протяжении всей своей карьеры. С тех пор он стремительно продвинулся в партии, и, будучи членом партии в эпоху «вращающихся дверей» в лейбористской политике, Радд не понаслышке знаком с жесткой политикой. Однако его оптимизм подтолкнул его к созданию партии заново. Стремясь расширить ее привлекательность и исправить фракционность, которая десятилетиями тормозила ее развитие, уроженец Квинсленда теперь возглавляет партию. Это должность, которую он боготворил с момента вступления в партию в 15 лет, и которую он намерен занять достойно."
