 MEX_infantry_weapons_1_desc: "헤클러앤코흐 G3(게베르 3)는 7.62x51mm NATO 구경의 선택 사격식 전투소총으로, 1950년대 서독의 무기 제조업체 헤클러앤코흐(H&K)가 스페인 국영 설계 개발 기관인 CETME와 협력하여 개발했습니다. G3는 1959년부터 FN FAL/G1을 대체하여 표준 소총으로 사용되었으며, 1963년에 개량형 G3A1 모델로 업그레이드될 때까지 운용되었습니다."
 MEX_infantry_weapons_2_desc: "G3A3는 G3 시리즈 중 가장 잘 알려진 버전입니다. 개선된 후방 드럼 조준기와 전방 조준기, 소염기/머즐 브레이크, 고정식 플라스틱 개머리판, 그리고 플로팅 배럴과 접촉하지 않는 플라스틱 핸드가드가 특징입니다. 핸드가드는 슬림형 통풍식과 와이드형 두 가지 버전으로 출시되었으며, 와이드형은 양각대 장착을 통해 안정성을 향상시킬 수 있습니다."
 MEX_infantry_weapons_3_desc: "The G3A4 is a further improved version of the previous G3A3 model using drum sights and a newly designed single position, with some models including a new ambidextrous trigger group and brass deflector to accommodate Left hand Shooters. The G3A4 Entered service in 1974 for frontline infantry units and was in service until the late 1990's before being phased out and replaced."
 JAM_infantry_weapons_3_desc: "M16A2 소총의 개발은 원래 미 해병대가 베트남 전쟁에서 XM16E1과 M16A1 소총을 사용해 얻은 전투 경험을 바탕으로 요청한 것이었습니다. 이 소총은 1982년 국방부에서 \"미군 5.56mm 소총 M16A2\"로 공식 채택되었습니다. 미 해병대는 1980년대 초중반에 이 소총을 미군 최초로 도입했으며, 미 육군은 1980년대 후반에 뒤이어 도입했습니다."
