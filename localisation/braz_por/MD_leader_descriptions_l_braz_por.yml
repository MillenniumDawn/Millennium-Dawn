l_braz_por:
 DONALD_TRUMP_LEADER_DESC: "Donald John Trump (nascido em 14 de junho de 1946) é o multi-bilionário filho do desenvolvedor imobiliário Frederick Christ Trump. Com um pequeno empréstimo de um milhão de dólares, Trump fundou e expandiu inúmeros negócios sob a Trump Organization desde 1971. Conhecido por suas diatribes virulentas e um estilo de liderança impulsivo herdado de seus dias como personalidade de televisão, Trump rapidamente fez tantos inimigos quanto amigos. Ao assumir a presidência, Trump promete conter a imigração ilegal, aumentar os gastos militares, instalar tarifas protecionistas e firmemente colocar a América em Primeiro Lugar."
 MITT_ROMNEY_LEADER_DESC: "Willard Mitt Romney (born March 12, 1947) is one of four children born to automobile executive George W. Romney. A devout Mormon and firm believer in laissez-faire economics and conservative family values; Romney vows to use his years of business experience to cut government waste, increase military spending, and remove restrictions put on Wall Street and large corporations."
 GEORGE_BUSH_LEADER_DESC: "George Walker Bush (nascido em 6 de julho de 1946) é o primeiro filho de George Herbert Walker Bush, que serviu como o 41º presidente americano de 1989 a 1993. Após uma breve passagem pela indústria do petróleo, Bush entrou na política e eventualmente se tornou governador do Texas. Retratando-se como um conservador compassivo, Bush promete cortar impostos, aumentar os gastos militares e desregular o setor corporativo de restrições desnecessárias sobre emissões de gases de efeito estufa."
 MARCO_RUBIO_LEADER_DESC: ""
 BERNIE_SANDERS_LEADER_DESC: "Bernard Sanders (born September 8, 1941) is the son of working class Polish immigrants to the United States. Joining the Young People's Socialist League during his college years, Sanders advocated for the equal treatment of whites and blacks during the Civil Rights Movement. Sanders later became mayor of Burlington, Vermont, and was eventually elected to the U.S. House of Representatives and U.S. Senate. A self-described democratic socialist and progressive, Bernie Sanders vows to reduce military spending, increase the power of labor unions and create a universal healthcare system."
 HILLARY_CLINTON_LEADER_DESC: ""
 BARACK_OBAMA_LEADER_DESC: ""
 BILL_CLINTON_LEADER_DESC: ""
 GARY_JOHNSON_LEADER_DESC: ""
 RAND_PAUL_LEADER_DESC: ""
 DAVID_DUKE_LEADER_DESC: ""
 ANN_COULTER_LEADER_DESC: ""
 COUNCIL_FOR_NATIONAL_PRESERVATION_DESC: "The Council is a rump remnant of what was the federal government of the former United States. As such whatever is left is attempting to rally what people and territory it has left around a new flag. Members of the council look to create a sense of law and order as well as a sense of peace, this way they can then conduct a smooth transition of power to a new administration."
 MATHEW_CROUDER_DESC: "The \"Marshal\", or simply Mat/Mathew, is a bit of a paradox. Both talkative yet overtly quiet this young man has a sort of scatter brain approach to handling things or doing things that interest him. Despite his initial unlikeliness to become any kind of leader, his own soft power in terms of making acquaintances as well as his more gentle personality makes him a fairly relatable person. Though he has been known to be a bit of a hot head at times in more confrontational matters, he strives to do what he can for as many as he can. As he was once quoted by an interviewer, \"Life is a strange and confusing mess, you never truly know where you will end up even if you wanted to do something you may certainly find yourself doing the complete opposite. I mean from JROTC in high school, to the odd hobby of writing a constitution and exploring the idea of a micro-nation, I never once would have even dreamed of being a political leader... Let alone one on a federal level.\" This somewhat naivety yet sort of boundless optimism has seen Mathew now put in charge of the Southern Republic of America, though what he'll do not many know, for now we just wait and see."
 JIANG_ZEMIN_LEADER_DESC: "Jiang Zemin (born August 17, 1926) is a former engineer who has led the Communist Party since 1989, replacing the reformist Zhao Ziyang in the wake of the Tiananmen Square protests. Previously he served as mayor of Shanghai and his continued favoring of individuals who served with him in Shanghai has led to his faction of the party being dubbed the \"Shanghai Clique\". An advocate of economic reform, his rule in the 1990s has seen a continuation of Deng Xiaoping's policy of reform and opening up and a normalizing of the private sector. He has also presided over the return of both Hong Kong and Macau to Chinese sovereignty and has faced criticism over his heavy-handed approach to human rights."
 HU_JINTAO_LEADER_DESC: "Hu Jintao (nascido em 21 de dezembro de 1942) é um ex-engenheiro que experimentou a denúncia de seu pai durante a Revolução Cultural. Como líder, ele expressou o desejo de abordar os impactos que o rápido crescimento econômico teve na sociedade e no meio ambiente da China e lidera a facção Tuanpai ou Liga da Juventude Comunista do Partido Comunista. Juntamente com o primeiro-ministro Wen Jiabao, Hu busca distribuir de maneira mais equilibrada os ganhos do desenvolvimento econômico da China e adotar um modo de governo menos elitista, mantendo firmemente a primazia do Partido Comunista."
 XI_JINPING_LEADER_DESC: "Xi Jinping (nascido em 15 de junho de 1953) faz parte de uma nova geração de oficiais chineses conhecidos como os príncipes. Filho de um veterano do Partido Comunista, Xi enfatizou a centralização e a consolidação do poder sob sua liderança, enfraquecendo rivais políticos e facções existentes do Partido Comunista por meio de suas campanhas anticorrupção. Ele também é um defensor de uma política externa assertiva, marcando um afastamento da política de Deng Xiaoping de manter um perfil discreto nos assuntos internacionais."
 BO_XILAI_LEADER_DESC: "Bo Xilai (born July 3, 1949) is a well-known princeling and son of former Vice Premier Bo Yibo. Known for his tenure as Party Secretary of Chongqing, Bo is associated with his campaign against organized crime and his revival of \"red culture\" which has won him support among leftists dissatisfied with the inegalitarian trajectory of China's economic growth. Bo has earned many enemies during his political career, and has a controversial reputation."
 KIM_DAE_JUNG_LEADER_DESC: "Kim Dae-jung (nascido em 6 de janeiro de 1924) é uma figura respeitada na política sul-coreana devido à sua longa história de ativismo pró-democracia, com alguns se referindo a ele como 'o Nelson Mandela da Ásia'. Tendo sobrevivido a uma suposta tentativa de assassinato, sequestro por agentes de inteligência, bem como a uma sentença de morte, Kim finalmente emergiu de quase 50 anos de oposição para liderar seu país. Suas prioridades desde que assumiu o cargo em 1998 incluíram a recuperação econômica, responsabilizar os poderosos chaebols da Coreia e se envolver com a Coreia do Norte sob sua marca registrada Sunshine Policy."
 ROH_MOO_HYUN_LEADER_DESC: "Roh Moo-hyun (nascido em 6 de agosto de 1946) é um ex-advogado de direitos humanos de origem pobre que defendeu manifestantes estudantis contra o regime autoritário. Assim como Kim Dae-jung, que apoiou sua presidência, Roh prefere negociações com o Norte do que uma política de isolamento internacional. Ele também criticou abertamente os Estados Unidos e o Japão e tem uma relação antagônica com o 'establishment' conservador da Coreia. Roh obtém seu apoio da 'geração 386' de esquerda, na qual faz parte há 30 anos."
 LEE_MYUNG_BAK_LEADER_DESC: "Lee Myung-bak (nascido em 19 de dezembro de 1941) é um político conservador e ex-CEO da Hyundai. Durante seu tempo na Hyundai, ele ganhou o apelido de 'Raging Bulldozer' em parte devido à sua rígida abordagem de gerenciamento. Uma figura ambiciosa, Lee espera transformar a Coreia em uma das maiores economias do mundo e promover uma política externa internacionalista que elevará o status global da Coreia. Em contraste com seus colegas de esquerda, Lee é a favor de uma abordagem linha-dura para a Coreia do Norte e uma parceria estreita com os Estados Unidos."
 PARK_GEUN_HYE_LEADER_DESC: "Park Geun-hye (nascida em 2 de fevereiro de 1952) é mais conhecida por ser filha de Park Chung-hee, ex-líder autoritário da Coreia que continua a ter um legado controverso. Enquanto alguns veem Park Chung-hee como um ditador brutal que usou tortura e prisão para preservar seu governo, outros o elogiam por suas conquistas econômicas. Em sua juventude, Park sobreviveu ao assassinato de sua mãe e de seu pai, o primeiro nas mãos de um agente norte-coreano e o último nas mãos do chefe da Agência Central de Inteligência da Coreia. Conhecida por sua postura conservadora e voltada para o mercado, Park é a favor da desregulamentação, do corte de impostos e da lei e da ordem."
 MOON_JAE_IN_LEADER_DESC: "Moon Jae-in (born January 24, 1953) is the son of North Korean refugees and a former human rights lawyer and activist. During his military service, Moon served as a special forces commando and took part in Operation Paul Bunyan, the ROK-USA joint response to the 1976 Panmunjom axe murder incident. A close friend of his predecessor Roh Moo-hyun, whom he had previously started a legal practice with, Moon was active in Roh's left-wing administration and was an important player in the Sunshine Policy, which he remains committed to. While committed to the US alliance, Moon has stated that Korea should learn how to say no to the Americans and hopes to take back wartime control of the Korean military from the US."
 KIM_JONG_UN_LEADER_DESC: "Kim Jong-un (born January 8, 1984) was the son most valued by Kim Jong-il during his lifetime. During his days studying in Switzerland, his slightly obese frame made it possible to underestimate him. But when he did ascend to the throne, he shocked the world with his calmness, shrewdness and ruthlessness in the secret executions of his political enemies (including, according to unconfirmed reports, the execution of his paternal uncle with anti-aircraft guns), his determination to continue developing nuclear weapons despite international sanctions, and his precise timing of the friendly dialogue with the US and South Korea. Under his leadership as a \"great man from heaven\", perhaps there is a real possibility of North Korea becoming the \"Strong and Prosperous Nation\"?"
 KIM_JONG_NAM_LEADER_DESC: "Kim Jong-nam, (nascido em 10 de maio de 1971), é filho de Kim Jong-il e sua segunda esposa. Como o filho mais velho de sua família, Kim Jong-nam testemunhou a miséria do povo sob o \"março árduo\". Durante seu tempo no exterior, ele viu o rápido desenvolvimento da reforma e abertura da China e ficou impressionado com o poder da mudança. Ele acreditava que apenas a reforma poderia trazer prosperidade material e felicidade espiritual ao povo norte-coreano, mas também entendia que a mudança poderia custar-lhe o poder...Acreditava"
 KIM_YO_JONG_LEADER_DESC: "Kim Yo-jong (nascida em 26 de setembro de 1987), como a única menina em sua família, tem mostrado tanto talento desde que iniciou sua carreira política que Kim Jong-il exclamou ao escolher seu sucessor:\"Se ao menos Kim Yo-jong fosse um menino\". Ptalvez por causa de sua imagem feminina, ela (peculiarmente) goza de um alto nível de apoio tanto em casa quanto no exterior. Hoje, seu reinado está provando que as mulheres podem se sair tão bem quanto os homens, independentemente do tipo de política do país."
 POLITICS_PAUL_KAGAME_DESC: "Quando Paul Kagame tinha 28 anos, ele ajudou a derrubar o governo de Uganda. Aos 36 anos, ele derrubou o governo genocida de Ruanda liderado pelos hutus. Aos 39, ele derrubou Mobutu da República Democrática do Congo, o ditador mais corrupto e repressivo da África. Kagame é provavelmente o líder militar mais bem-sucedido vivo, tendo vencido mais guerras do que qualquer um - tudo com um orçamento apertado. Enquanto reprime toda a oposição em casa, o general tutsi está constantemente fixando seus olhos em novas ambições estrangeiras, caçando rebeldes hutus e explorando riquezas minerais."
 costas_simitis_desc: "Costas Simitis (nascido em 23 de junho de 1936) é filho do advogado George Simitis e professor da Universidade de Economia de Atenas. Tendo participado de organizações antigovernamentais durante a Junta Grega, Costas Simitis logo após a queda da Junta Grega foi membro fundador do Movimento Socialista Pan-helénico (PASOK) em 1974. Durante a vitória eleitoral do PASOK em 1981, ele foi chamado para ocupar vários cargos governamentais. durante o governo de Andreas Papandreou, como chefe do departamento de economia, agricultura, educação e religião, bem como chefe simultâneo dos departamentos de indústria, pesquisa, energia, tecnologia e comércio. Após a morte de Andreas Papandreou em 1996, ele foi eleito para a liderança do PASOK e logo depois venceu as eleições gerais de 1996. Agora, Costas Simitis procura aumentar constantemente as privatizações no setor público, a estabilidade econômica, a redução da dívida nacional, a resolução de disputas greco-turcas e o mais importante, aumentando os laços e a cooperação com a União Européia"
 nikolaos_michaloliakos_desc: "Nikolaos Michaloliakos (born December 11th, 1957) is the founder of Golden Dawn, the largest nationalist party of Greece. Michaloliakos was a supporter of the Greek Military regime and known for participating in many extremist right wing groups which had committed attacks on many anti dictatorship figures as well as a relation with the head of the Greek Junta Georgios Papadopoulos. In 1980, he formed the Golden Dawn far right party which aims to have an anti-leftist agenda, anti immigration, glorifying Greek authoritarian regimes such as the 1967 Junta and the 4th of August 1936 regime and aligning to Russia and China and moving away from the west. Michaloliakos and his Golden Dawn party have been condemned as a criminal organization which targets minorities and has pro-neo-nazi and fascist views as well as an anti-democratic stance. In spite of the backlash against him Nikolaos Michaloliakos and his party have been rising in popularity as economic instability and social divides have been plunging Greece it has drawn more supporters to the Golden Dawn cause. If the situation becomes worse Nikolaos Michaloliakos may achieve his goals, taking power and building a new Greek state"
 CONGRESSIONAL_CHAMBERS_DESC: "With the electoral college failing and the election having...unexpected issues in the state of Florida, congress scrambles to try and figure out who to vote for or at the very least get into the president's seat before things boil over any more than they already have."
 YOON_SUK_YEOL_LEADER_DESC: "Yoon Suk Yeol (nascido em 18 de dezembro de 1960) foi o ex-procurador-geral da República da Coreia e procurador-chefe do Gabinete do Procurador do Distrito Central de Seul. Durante sua presidência, Yoon Suk Yeol declarou lei marcial de emergência, acusando a oposição de controlar a Assembleia Nacional, simpatizar com a Coreia do Norte e paralisar o governo por meio de atividades antiestatais. Mas então a Assembleia Nacional votou pelo levantamento da lei marcial. Desde então, Yoon Suk Yeol foi acusado de sedição e proibido de deixar o país, tornando-se o primeiro presidente em exercício na história da Coreia do Sul a ser proibido de deixar o país. E mais tarde Yoon Suk Yeol foi preso, tornando-se o primeiro presidente em exercício a ser preso na história da Coreia do Sul."