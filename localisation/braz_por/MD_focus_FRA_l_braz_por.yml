 france_md.509.t: "Introdução do ECO"
 france_md.509.d: "A França propôs substituir o Franco CFA pelo ECO, uma nova moeda comum para a África Ocidental. Adotá-lo nos daria maior autonomia monetária e laços mais estreitos com a França."
 france_md.509.a: "Adotar o ECO"
 france_md.509.b: "Recusar a oferta"
 FRA_airbus_change: "A Eurocopter foi rebatizada como Airbus Helicopters em 2014"
 FRA_naval_takeover: "A DCNS foi rebatizada como Naval Group em 2017"
 Francosphere: "Francosfera"
 Continental_system: "Sistema Continental"
 Holy_league: "Liga Santa"
 world_revolution_commune: "Comuna Revolucionária Mundial"
 FRA_PS: "O Partido Socialista"
 FRA_PS_desc: "Refundado no Congresso de Épinay sob François Mitterrand, o Partido Socialista ultrapassou os comunistas como força dominante da esquerda francesa e, desde então, alterna-se no poder com a Direita Republicana. Nossa base é ampla e distribuída pela maioria das classes, e nosso retorno ao Eliseu é uma questão de tempo."
 FRA_UDF_LREM: "A União Centrista"
 FRA_UDF_LREM_desc: "Reunida em 1978 para apoiar Valéry Giscard d'Estaing, a União pela Democracia Francesa é uma confederação de liberais, democratas-cristãos e radicais, e não um partido único. Relegados a sócio minoritário por duas décadas, pretendemos construir um centro que governe por conta própria."
 FRA_LR: "A Direita Republicana"
 FRA_LR_desc: "A direita gaullista é tão antiga quanto a Quinta República e ocupa a presidência desde 1995, mas uma dissolução fracassada nos custou caro e pôs um socialista em Matignon. Devemos consolidar a centro-direita antes que nossos rivais de ambos os flancos nos ultrapassem."
 FRA_RPF: "Reunião pela França"
 FRA_RPF_desc: "Charles Pasqua e Philippe de Villiers fundaram a Reunião pela França em 1999 para os gaullistas que julgavam a direita tradicional condescendente demais com Bruxelas. Nossa influência hoje é pequena, mas toda concessão feita à União Europeia recruta para nós."
 FRA_FN: "A Frente Nacional"
 FRA_FN_desc: "Fundada em 1972 em torno de Jean-Marie Le Pen, a Frente Nacional passou três décadas fora da política respeitável enquanto todos os outros partidos fechavam fileiras contra ela. O cordão sanitário começa a se desfiar, e pretendemos estar prontos quando ele se romper."
 FRA_LFI: "França Insubmissa"
 FRA_LFI_desc: "O Partido Socialista se desgastou servindo sopa aos centristas e morrendo entre suas duas tendências. A França Insubmissa é a única oposição de esquerda genuína à ordem neoliberal, e não buscaremos compromisso com ela."
 FRA_EELV: "Os Verdes"
 FRA_EELV_desc: "O movimento ecologista disputa eleições francesas desde 1984 sem jamais ser levado a sério, e nossa base mal passa das cidades. O tempo é o único recurso pelo qual não podemos fazer campanha, então devemos converter os outros partidos ou substituí-los."
 FRA_PCF: "O Partido Comunista Francês"
 FRA_PCF_desc: "O Partido Comunista Francês caiu com a União Soviética à qual estava ligado, e nossa base operária está migrando para a extrema-direita ou para a abstenção. Reverter esse declínio é toda a tarefa diante de nós."
 FRA_friend_eu: "Aproximar-se da UE"
 FRA_friend_eu_desc: "A União Europeia abriga muitas nações lideradas por partidos semelhantes ao nosso. Devemos usar essa convergência ideológica para destacar nossa postura pró-europeia como baluarte contra o nacionalismo."
 FRA_eternal_challenge: "O Eterno Desafiante"
 FRA_eternal_challenge_desc: "Por décadas, fomos o único partido a lutar tanto nas ruas quanto no parlamento para defender os trabalhadores. Nossos inimigos são claros: a direita e os extremistas. O povo sabe que pode confiar em nós para enfrentá-los. Nossos inimigos nunca dormem, e devemos lembrar disso. Unidos, podemos afugentar qualquer ameaça."
 FRA_eu_federalism: "Federalismo da UE"
 FRA_eu_federalism_desc: "As outras nações devem se lembrar dos valores que defendemos como União Europeia: protegê-los, desenvolvê-los e difundi-los entre as demais nações da Europa."
 FRA_let_industry: "Deixar a Indústria Partir"
 FRA_let_industry_desc: "A indústria pesada é uma perda de tempo e energia; já não é produtiva o bastante numa economia globalizada como a nossa. Não devemos nos colocar no caminho de sua realocação para os novos centros industriais do mundo. Em vez disso, devemos voltar a atenção a uma nova forma de economia: o setor de serviços. Os escritórios serão nosso foco principal nos próximos anos. Priorizando-os, podemos reduzir o desemprego e aumentar a renda que geram."
 FRA_finance_minister: "Uma Nova Política Econômica"
 FRA_finance_minister_desc: "Em um mundo em transformação, nós também devemos evoluir e mudar nosso foco econômico. As crises econômicas evidenciaram as limitações da economia keynesiana, então devemos mudar nossa maneira de pensar. Consequentemente, devemos escolher nosso próximo programa econômico para o setor financeiro. Ele nos permitirá reduzir gastos, mas a única questão é em quem podemos confiar."
 FRA_atlantist_drift: "Deriva Atlântica"
 FRA_atlantist_drift_desc: "A OTAN é a aliança mais forte que existe atualmente. Se quisermos mantê-la assim, devemos melhorar o treinamento de nossas forças armadas."
 FRA_greece_eurozone: "Grécia na Zona do Euro"
 FRA_greece_eurozone_desc: "A Grécia é conhecida por seus problemas de dívida. Podemos ajudá-la com algum dinheiro para mostrar que os países da União Europeia realmente se importam uns com os outros."
 FRA_tax_evasion: "Combater a Evasão Fiscal"
 FRA_tax_evasion_desc: "Há pessoas demais que continuam evitando pagar impostos por meio de vários esquemas; devemos pôr fim a isso, pois nos comprometemos a fazê-lo."
 FRA_liberal_turn: "Guinada Liberal"
 FRA_liberal_turn_desc: "Por tempo demais tentamos controlar a economia e o setor financeiro, mas, num mundo globalizado, está cada vez mais difícil controlar o fluxo de capital. Então devemos deixar o mercado se autorregular. O que poderia dar errado?"
 FRA_ease_interventionism: "Aliviar o Intervencionismo"
 FRA_ease_interventionism_desc: "Devemos nos concentrar em melhorar as relações diplomáticas na Europa, e não enviar nosso povo para lutar na guerra de outros. A Europa é atualmente um continente de paz e, como grande potência regional, devemos dar um bom exemplo a todos."
 FRA_modern_interest: "Interesse Moderno"
 FRA_modern_interest_desc: "Por tempo demais gastamos nosso tempo defendendo uma classe improdutiva em crise perpétua. Já é hora de olhar para o futuro, e o futuro está nos serviços e na tecnologia."
 FRA_cut_with_unions: "Romper com os Sindicatos"
 FRA_cut_with_unions_desc: "Os sindicatos trabalhistas já não são tão úteis ao nosso país como foram um dia. Não devemos mais ceder às suas exigências; afinal, não somos reféns deles."
 FRA_vigipirate: "Reforçar a Segurança"
 FRA_vigipirate_desc: "A Missão Vigipirate será nosso sistema nacional de alerta de segurança e antiterrorismo. Deve ser um mecanismo permanente que envolve o governo, as forças armadas, as autoridades locais e os cidadãos, concebido para antecipar, prevenir e proteger nosso país contra ameaças terroristas."
 FRA_not_done: "Ainda Não Acabamos"
 FRA_not_done_desc: "O vinte e um de abril foi uma humilhação sem precedentes. Nosso candidato foi eliminado no primeiro turno e a República foi forçada a escolher entre a direita e a extrema-direita. Contudo, os militantes não foram para casa, as seções ainda se reúnem e os eleitores que migraram para a extrema-esquerda não têm para onde ir de melhor. Reconstruímos de baixo para cima e fazemos as pazes com os sindicatos que afastamos."
 FRA_meet_friends: "Encontro com Amigos"
 FRA_meet_friends_desc: "Agora é um bom momento para organizar um encontro com outros países socialistas para discutir a situação mundial atual e o caminho para o socialismo."
 FRA_turn_ecology: "Voltar-se para a Ecologia"
 FRA_turn_ecology_desc: "Os Verdes não vão abrir caminho para nós nas próximas eleições legislativas sem um preço, e o preço está escrito nos reatores. Vinte e quatro deles, Fessenheim primeiro, e metade da nossa matriz elétrica entregue até o fim da década. As federações de energia da CGT já deixaram clara sua opinião. Devemos decidir se a aliança vale a frota."
 FRA_military_coop: "Cooperação Militar"
 FRA_military_coop_desc: "Com base em nossa estreita cooperação com a OTAN, devemos convidar outros países a realizar treinamento militar conjunto conosco. Todos têm a ganhar, e isso mostrará aos nossos inimigos como estamos unidos e preparados."
 FRA_party_unity: "Unidade do Partido"
 FRA_party_unity_desc: "Todo congresso termina da mesma forma. As correntes discutem por três dias, ninguém vence e uma motion de synthèse é redigida da noite para o dia para que todas possam reivindicar vitória. Reims quase nos quebrou por quarenta e dois votos. A unidade é possível, mas é comprada com ministérios e secretarias, e a conta é sempre paga em clientelismo."
 FRA_strenght_throught_EU: "Fortalecer-se pela UE"
 FRA_strenght_throught_EU_desc: "A UE defende valores democráticos, e nós também. Isso deveria ser motivo suficiente para manter esta organização viva, forte e estável. Se a UE cair, a Europa pode voltar a se dividir."
 FRA_stole_voter: "Reconectar-se com Nosso Eleitorado"
 FRA_stole_voter_desc: "A bacia mineira e o Midi foram nossos por um século e agora são o terreno mais seguro da extrema-direita. Passar sermão a esses eleitores não funcionou. Se quisermos tê-los de volta, devemos ir até eles com algo nas mãos: fornalhas reacendidas, vagas abertas, uma promessa industrial feita em público. Feita e depois cumprida, pois uma promessa quebrada ali nos custará a região por uma geração."
 FRA_ps_lgbt: "Garantir os Direitos LGBT"
 FRA_ps_lgbt_desc: "O pacto civil de solidariedade nunca foi mais do que meia medida. Casamento, adoção, a plena igualdade dos casais perante a lei: esta é a reforma que nossos eleitores esperam e a que a direita prometeu combater nas ruas. La Manif pour Tous já está reservando o Champ de Mars. Podemos aprovar a lei por inteiro, ou podemos cortá-la e manter a paz."
 FRA_ps_win: "O Socialismo Foi Salvo"
 FRA_ps_win_desc: "Conseguimos! Alcançamos o impossível. Depois de escapar por pouco do colapso e de uma derrota humilhante diante dos franceses e aos olhos da história, conseguimos virar o jogo. Nossos adversários achavam que estávamos acabados, mas reconquistamos nosso eleitorado e o afastamos do canto da sereia do extremismo. Nossa vitória é um sinal da estabilidade do socialismo em todo o mundo. Mas nossa vitória é apenas o começo; armados com essa experiência, não cometeremos os mesmos erros uma segunda vez."
 FRA_Neither_right_nor_left: "Nem Direita, Nem Esquerda"
 FRA_Neither_right_nor_left_desc: "A melhor forma de desenvolver nosso país é evitar a política divisiva. Ocupemos o terreno do centro, nem muito à direita, nem muito à esquerda."
 FRA_Get_indecisives: "Conquistar os Indecisos"
 FRA_Get_indecisives_desc: "Nem direita, nem esquerda. Há eleitores neste país que nunca encontraram um partido que valesse a caminhada até a seção eleitoral, e há milhares de voluntários dispostos a bater em suas portas e perguntar o que querem. La Grande Marche os trará até nós vindos dos dois partidos antigos ao mesmo tempo. O que ela não nos trará é uma única federação local."
 FRA_abolish_ISF: "Abolir o ISF"
 FRA_abolish_ISF_desc: "O imposto de solidariedade sobre a fortuna arrecada pouco e exila muito. Há trinta anos o capital parte para Bruxelas e Genebra, e a arrecadação nunca justificou a fuga. Nós o substituímos por um imposto apenas sobre a propriedade. O dinheiro voltará para casa. A acusação também, em cada manchete até a próxima eleição, de que governamos para os ricos."
 FRA_Fight_Deficit: "Combater o Déficit"
 FRA_Fight_Deficit_desc: "Nossa dívida é alta. Temos de combatê-la custe o que custar, se não quisermos nos afogar numa dívida que não poderemos pagar. O povo certamente compreenderá essas ações necessárias."
 FRA_Reconize_Mistakes: "Reconhecer os Erros"
 FRA_Reconize_Mistakes_desc: "Os líderes franceses anteriores trataram as nações coloniais de maneira profundamente injusta. Devemos finalmente corrigir isso pagando por seus atos. Que este capítulo de nossa história se encerre de uma vez."
 FRA_Western_policy: "Política Ocidental"
 FRA_Western_policy_desc: "A União Europeia e a aliança atlântica são o que mantém este continente seguro, e nada ganhamos fingindo o contrário. Uma integração mais estreita com nossos aliados nos dá influência em Bruxelas e boa vontade em Washington. Também entrega aos souverainistes, gaullistas e nacionalistas, o único argumento de que sempre precisaram: o de que a República virou vassala."
 FRA_independant_Euro: "Europa Independente"
 FRA_independant_Euro_desc: "Os outros países devem saber que, dentro de uma Europa unida, não buscamos influência excessiva sobre sua estabilidade. Sozinhos, alguns de nós podem ser vulneráveis, mas juntos devemos ser fortes o bastante para superar esses problemas."
 FRA_reduce_tax: "Reduzir Impostos"
 FRA_reduce_tax_desc: "A taxe d'habitation recai com mais força sobre as famílias que menos podem absorvê-la, e o crédito de emprego já mostrou o que o alívio faz pela contratação. Vamos eliminá-la gradualmente por completo. As comunas perdem sua base de receita, então o Estado deve compensá-las a partir de Paris, e todo prefeito da França nos escreverá a respeito."
 FRA_increase_pension_age: "Aumentar a Idade da Aposentadoria"
 FRA_increase_pension_age_desc: "As pessoas podem não gostar, mas, como a expectativa de vida aumenta graças aos novos avanços da medicina, devemos continuar a financiar nosso sistema de proteção social. Porém, com cada vez menos jovens para financiar as aposentadorias de um número cada vez maior de idosos, não temos escolha. Devemos fazer a população ativa trabalhar por mais tempo para compensar essa falta de renovação geracional."
 FRA_growing_tensions: "Tensões Crescentes"
 FRA_growing_tensions_desc: "Nosso mundo está ficando cada vez menos seguro, e podemos ver a guerra voltar à Europa. Para não sermos pegos de surpresa, devemos nos preparar para ela."
 FRA_befriend_china: "Aproximar-se da China"
 FRA_befriend_china_desc: "A China é um importante parceiro comercial da França; é do nosso interesse negociar tratados favoráveis com ela."
 FRA_nuclear_eu: "Nuclearizar a UE"
 FRA_nuclear_eu_desc: "Cinquenta e seis reatores, e ninguém em Bruxelas disposto a chamá-los de verdes. A taxonomia está sendo escrita agora e, se a energia nuclear for excluída dela, toda a nossa frota se tornará um passivo no papel. Berlim e Viena nos combaterão. Praga, Varsóvia e Helsinque não. Construímos a aliança, vencemos a votação e aceitamos que a Alemanha vai se lembrar disso."
 FRA_reise_tertiary: "A Ascensão do Terciário"
 FRA_reise_tertiary_desc: "A economia ocidental de hoje é uma economia baseada em serviços que reúne os diversos agentes envolvidos na produção. A França deve fazer sua parte nessa transição econômica; não há outro caminho."
 FRA_reduce_public_service: "Reduzir o Serviço Público"
 FRA_reduce_public_service_desc: "Cortando os gastos do governo, poderemos reduzir novamente nossa dívida. As pessoas vão odiar, mas temos de escolher o mal menor. Se o país cair por causa da dívida, a redução dos gastos sociais será o menor dos problemas delas."
 FRA_strat_indus: "Financiar Nossas Indústrias Estratégicas"
 FRA_strat_indus_desc: "Embora nossas indústrias já não sejam tão competitivas quanto foram, há certas indústrias de que não podemos prescindir. A indústria de defesa é uma delas, pois não podemos depender de outros países para nossa defesa. A França sempre produziu suas próprias armas. É, portanto, da máxima importância que isso continue assim, sobretudo num mundo em que as tensões aumentam."
 FRA_arms_deal: "Aumentar as Exportações de Armas"
 FRA_arms_deal_desc: "É de conhecimento geral que nosso complexo militar-industrial produz excelentes armas. Assim, há muitos anos somos um dos principais exportadores de armas. Esse comércio de armas nos permite não apenas projetar nosso poder internacionalmente, mas também ganhar muito dinheiro e influência. Só pode ser algo bom."
 FRA_eu_mil: "Auxiliar o Rearmamento Militar da UE"
 FRA_eu_mil_desc: "Embora nosso país esteja relativamente bem preparado para lidar com o retorno da guerra à Europa, o mesmo não se pode dizer de todos os nossos parceiros europeus. A maioria deles não tem chance alguma de resistir. Devemos ajudá-los a desenvolver suas capacidades, pois a segurança deles é a nossa."
 FRA_finance_student: "Financiar o Melhor Aluno"
 FRA_finance_student_desc: "Aplicando a fórmula neoliberal à perfeição, nossa economia nunca esteve tão integrada às dinâmicas internacionais. Isso é bom, pois nos permitirá aproveitar o progresso de outros países e investir em todo o mundo para colher os frutos."
 FRA_right_left_money: "O Centro por Excelência"
 FRA_right_left_money_desc: "Por tempo demais, nosso país foi refém da divisão entre esquerda e direita. Depois de todos os nossos avanços em finanças e geopolítica, demonstramos o poder do ordoliberalismo. Nosso papel é permitir que o mercado floresça na França e que o povo francês se beneficie da riqueza que ele gera."
 FRA_demograph_arms: "Promover o Rearmamento Demográfico"
 FRA_demograph_arms_desc: "Uma boa campanha de crescimento populacional é um investimento de longo prazo no futuro do nosso país."
 FRA_share_eu: "Compartilhar Nosso Poder com a UE"
 FRA_share_eu_desc: "Nossos inimigos devem saber que levamos muito a sério a proteção da independência dos Estados-membros da União Europeia. Se necessário, ameaçaremos qualquer opressor com nosso arsenal nuclear."
 FRA_handle: "Lidar com a Situação"
 FRA_handle_desc: "Eles vieram pelo imposto sobre o combustível e ficaram por todo o resto. As rotatórias estão ocupadas, a Champs-Élysées queimou duas vezes e os disparos de flash-ball nos custaram olhos e manchetes na mesma medida. Podemos aprovar a lei antibadernas e expulsá-los à força, ou abrir um debate nacional e comprar a paz com dez bilhões de euros que não temos."
 FRA_startup_nation: "Nação Startup"
 FRA_startup_nation_desc: "Graças às nossas políticas ousadas e à nossa recusa em recuar diante desses gauleses recalcitrantes, alcançamos nosso objetivo. Transformamos uma sociedade outrora hostil ao empreendedorismo, libertando-a dos impostos e regulamentos que a seguravam. Um futuro brilhante de inovação e liberalismo nos aguarda. Essa é a nossa visão."
 FRA_Neo_gaulism: "Neogaullismo"
 FRA_Neo_gaulism_desc: "O neogaullismo é um movimento político francês que adaptou os princípios originais do General Charles de Gaulle. Ele enfatizava a soberania nacional, uma presidência executiva forte e a independência da política externa, adequando-os à era moderna e globalizada."
 FRA_known: "O Parti Inevitável"
 FRA_known_desc: "Desde a fundação da Terceira República e o surgimento de uma forma estável de republicanismo, sempre houve conservadores. Somos simplesmente sua mais recente encarnação. Há décadas estamos presentes em todo segundo turno de eleições. Não há motivo para que as próximas eleições sejam diferentes. Nosso novo milênio está cheio de incertezas, então devemos ser a voz da estabilidade e do bom senso diante dos extremistas."
 FRA_oppose_immigration: "Opor-se à Imigração"
 FRA_oppose_immigration_desc: "Os imigrantes já provaram como podem ser perigosos, especialmente os vindos de regiões de guerra sem fim. Devemos agir para impedir que cheguem."
 FRA_continue_liberal: "Continuar as Políticas Liberais"
 FRA_continue_liberal_desc: "Continuaremos a implementar nosso programa de liberalização econômica, porque é assim que a economia funciona melhor."
 FRA_patriotism: "Patriotismo"
 FRA_patriotism_desc: "Os franceses devem se orgulhar de sua nacionalidade e da história que a acompanha. Por isso, devem se acostumar a pedir menos ao Estado. Não podemos mais arcar com a generosidade do passado. Devem aprender a ficar do lado do Estado e parar de exigir constantemente mais dinheiro público."
 FRA_turn_west: "Voltar-se para o Ocidente"
 FRA_turn_west_desc: "Devemos melhorar nossas relações com nossos amigos do outro lado do oceano, na América. Seus políticos podem mudar, mas temos de garantir que nenhum deles jamais dê as costas à França."
 FRA_third_voice: "A Terceira Voz da França"
 FRA_third_voice_desc: "Num mundo ainda dividido entre a OTAN e os remanescentes da URSS, a França deve traçar seu próprio rumo, como sempre fez. Não podemos depender de um aliado distante que não viria em nossa defesa; devemos, portanto, forjar nosso próprio destino ao lado daqueles que rejeitam a opressão, venha ela do Leste ou do Oeste."
 FRA_austerity: "Adotar a Austeridade"
 FRA_austerity_desc: "O déficit é estrutural e as agências de classificação rondam. Cortamos onde é possível cortar: um servidor público substituído para cada dois que se aposentam, ministérios fundidos, obras adiadas. Os sindicatos chamarão isso pelo que é e levarão um milhão de pessoas às ruas por causa da idade de aposentadoria, e a esquerda passará uma década fazendo campanha contra esta única decisão."
 FRA_question_ref: "Acelerar a Integração Europeia"
 FRA_question_ref_desc: "Embora a França seja um dos pilares fundadores da União Europeia, seu povo é hoje um dos mais céticos em relação a ela. Os franceses se opuseram repetidamente à introdução de novos tratados. Devemos parar de pedir sua opinião a cada questão, pois isso retarda significativamente o processo de integração europeia. Muitos reagirão mal e se tornarão ainda mais contrários à União Europeia, mas ao menos deixaremos de ser nós a frear a União Europeia."
 FRA_nato_integration: "Integração à OTAN"
 FRA_nato_integration_desc: "Mais um passo para melhorar nossa segurança neste continente. Sem a OTAN, quem sabe em que estado a Europa estaria hoje."
 FRA_national_indep: "Independência Nacional"
 FRA_national_indep_desc: "Adotando uma posição entre o Leste e o Oeste, a França pode defender seus próprios interesses e não precisa mais levar em conta a opinião de um burocrata de Washington."
 FRA_end_proximity_police: "Acabar com a Polícia de Proximidade"
 FRA_end_proximity_police_desc: "A polícia não deve se misturar com as pessoas que deveria vigiar. Uma força policial de resposta rápida seria mais econômica."
 FRA_reform_wealth: "Reformar o Estado de Bem-Estar"
 FRA_reform_wealth_desc: "Por tempo demais a França foi um Estado de bem-estar social; é hora de os franceses se virarem sozinhos, sem sempre contar com dinheiro público."
 FRA_looming_crisis: "A Crise Iminente"
 FRA_looming_crisis_desc: "Em janeiro, o Société Générale descobriu que um único operador havia lhe feito perder quase cinco bilhões de euros sem que ninguém percebesse. Esse foi o aviso. O mercado hipotecário americano está pior, nossos bancos estão expostos a ele e o Dexia já está em apuros. Podemos construir o aparato de supervisão agora e desacelerar nossa própria economia ao fazê-lo, ou confiar no ciclo e esperar."
 FRA_defend_interest: "A Defesa dos Interesses da França"
 FRA_defend_interest_desc: "Ser independente significa que devemos nos proteger da influência estrangeira, tanto em nosso próprio país quanto onde quer que tenhamos interesses. Devemos tomar medidas nessa direção para garantir que a França permaneça uma grande nação."
 FRA_lower_expanse: "Parar de Financiar Empresas Improdutivas"
 FRA_lower_expanse_desc: "Subsidiar a atividade econômica tem um custo cada vez mais significativo. Devemos examinar de perto nossos gastos e subsidiar apenas indústrias eficientes e competitivas."
 FRA_oppose_lgbt: "Agir Contra o Wokismo"
 FRA_oppose_lgbt_desc: "Correntes de pensamento cada vez mais hostis às normas tradicionais estão se infiltrando em nossa sociedade. Essas normas existem por uma razão e sempre prevaleceram. Devemos impedir essa infiltração."
 FRA_return_rurality: "Abraçar a Ruralidade"
 FRA_return_rurality_desc: "As grandes cidades estão se tornando cada vez mais focos de decadência e criminalidade. Devemos incentivar nossos cidadãos a se afastar delas e ir para regiões que, embora admitidamente menos prósperas, estão mais próximas do bom senso."
 FRA_end_assisted: "Acabar com a Cultura da Dependência"
 FRA_end_assisted_desc: "Uma parcela grande demais da nossa população depende de benefícios incondicionais concedidos sem que precisem trabalhar. Essa situação é inaceitável e está sobrecarregando nossas finanças. Devemos pôr fim a esses benefícios; isso levará as pessoas ao trabalho."
 FRA_hostile_bear: "Hostilidade ao Urso"
 FRA_hostile_bear_desc: "A Rússia volta a se tornar uma ameaça aos interesses e à segurança europeus. Os países da linha de frente devem começar a se preparar para se defender de qualquer ação hostil vinda do leste."
 FRA_wake_up: "Despertar a França"
 FRA_wake_up_desc: "Libertado da decadência e das tentações da inação, o povo francês pode voltar ao trabalho."
 FRA_eternal_france: "França Eterna"
 FRA_eternal_france_desc: "Tornamos nosso país mais forte do que nunca. Aumentamos nossa proteção contra ameaças externas, reduzimos os problemas internos e diminuímos nossos problemas de dívida. Garantimos um futuro para o nosso país. A França sempre esteve aqui e sempre estará."
 FRA_enought_soc: "Chega de Socialismo"
 FRA_enought_soc_desc: "Como partido conservador, os Progressistas e o Partido Socialista são nossos principais adversários. Eles defendem uma Europa liberal, exatamente o que as pessoas já não querem, e trabalharemos para nos libertar dela. Devemos mostrar ao povo que somos, e sempre seremos, o instrumento pelo qual seu desejo de estabilidade e proteção se realiza. Somos contra a União Europeia liberal e o progressismo."
 FRA_sovereignism: "Questionar Nossa Soberania"
 FRA_sovereignism_desc: "Por tempo demais, o povo francês foi ignorado; ninguém em nosso país queria que a União Europeia crescesse a tais proporções. Fossem tratados ou alargamentos, o povo se mostrou cético todas as vezes, e todas as vezes foi ignorado. É hora de um partido levantar mais uma vez a questão da soberania da França."
 FRA_sacrifice: "Sacrifício Necessário"
 FRA_sacrifice_desc: "Estamos entrando em tempos difíceis, e o caminho árduo que temos pela frente exigirá disciplina e boa vontade do povo francês. Os franceses devem aprender mais uma vez que cabe a eles fazer sacrifícios pela França, e não o contrário."
 FRA_elder_view: "Nossa Visão dos Mais Velhos"
 FRA_elder_view_desc: "O Conselho Nacional da Resistência fez um trabalho tremendo ao reconstruir nosso país das ruínas da Segunda Guerra Mundial e, ao fazê-lo, tornou-se vassalo dos Estados Unidos. Mas há décadas seu trabalho vem sendo gradualmente minado por políticos, cada um mais liberal que o anterior. Devemos voltar às nossas raízes, seguir o exemplo do General, investir em nossa indústria e começar a reconstruir nosso país, devastado por décadas de integração europeia e desindustrialização."
 FRA_neccesity_leaving: "A Necessidade de Partir"
 FRA_neccesity_leaving_desc: "Nossa jornada rumo à saída da União Europeia mal começou. Devemos fazer o povo entender que precisamos deixar esta Europa antes que seja tarde demais para isso."
 FRA_fight_renouncement: "Combater os Defensores da Renúncia"
 FRA_fight_renouncement_desc: "O General não confiava que as outras potências europeias tivessem vontade de criar uma Europa independente dos Estados Unidos. Ele estava certo: poucas décadas após sua morte, nossos parceiros se preocupam mais em bajular os Estados Unidos e comprar equipamentos deles do que em trabalhar pela independência da Europa. Devemos denunciar essa espiral descendente, que já é motivo para deixarmos esta Europa vassala dos Estados Unidos."
 FRA_back_gaulism: "Gaullismo Estratégico"
 FRA_back_gaulism_desc: "A França deve ter uma política externa independente da vontade de Washington. Não devemos permitir que ninguém se intrometa em nossa política, e muito menos os Estados Unidos, que sempre buscaram nos forçar à submissão."
 FRA_social_gaulism: "Gaullismo Social"
 FRA_social_gaulism_desc: "Diante do fim da globalização feliz e do fascínio do extremismo, devemos conduzir o povo francês de volta ao caminho da razão. O gaullismo social rejeita tanto o capitalismo quanto o comunismo. Envolve a intervenção do Estado para garantir a independência e a segurança do emprego. Com essa estabilidade, o povo não precisa de todo esse apoio assistencial."
 FRA_return_nation: "Retorno à Nação"
 FRA_return_nation_desc: "Devemos incentivar as empresas francesas que operam no exterior a retornar ao seu país de origem, por todos os meios necessários."
 FRA_anti_eu: "Campanha Contra a UE"
 FRA_anti_eu_desc: "Agora que o povo começa a perceber que a União Europeia já não serve aos interesses de seus fundadores, cuja identidade ela busca erodir, podemos intensificar nossa campanha contra a União Europeia. Devemos fazer o povo entender que a maioria de seus problemas vem de lá."
 FRA_anti_usa: "Hostilidade aos EUA"
 FRA_anti_usa_desc: "Os Estados Unidos veem com desagrado o retorno do gaullismo ao poder. Têm razão em se preocupar; nossa ascensão ao poder lhes deixará claro rapidamente que já não somos seus aliados. Afinal, é bem sabido que os Estados Unidos não têm aliados; acima de tudo, têm interesses."
 FRA_RPF_death: "Restabelecer a Pena de Morte"
 FRA_RPF_death_desc: "A pena de morte foi abolida há décadas, contra a vontade da maioria do público francês. Desde então, criminosos de todos os tipos ficaram mais audaciosos, confiantes de que o Estado jamais os punirá de verdade. Uma nação soberana deve poder fazer cumprir suas próprias leis em sua plenitude. Nós a restauraremos."
 FRA_destroy_liberalism: "Destruir o Liberalismo Econômico"
 FRA_destroy_liberalism_desc: "Por tempo demais, nossa política econômica foi dominada por um ultraliberalismo abominável. Nossos cidadãos viram seus empregos e nossa força industrial desaparecerem um após o outro. Já em sua época, o General alertava que o capitalismo, do ponto de vista humano, era algo ruim. Devemos voltar à intervenção do Estado. Devemos restaurar a ordem em nossas finanças públicas e no que resta de nossa economia."
 FRA_campaign_frexit: "Campanha pelo Frexit"
 FRA_campaign_frexit_desc: "Os franceses finalmente perceberam que a União Europeia é algo ruim; resta apenas lhes dar os meios de extravasar sua raiva. Basta uma cédula na urna para pôr fim ao desmantelamento da França."
 FRA_rebalance_foreign_policy: "Reequilibrar Nossa Política Externa"
 FRA_rebalance_foreign_policy_desc: "Embora tenhamos deixado clara nossa intenção de romper com os Estados Unidos, nossa classe política continua infiltrada por suas políticas, seu modo de vida e suas corporações. Devemos enviar uma mensagem forte aos que possam achar que nossa ruptura com os Estados Unidos não é genuína. Restabeleceremos o diálogo com as potências que sempre se opuseram à hegemonia dos EUA."
 FRA_leave_nato: "Romper com a OTAN"
 FRA_leave_nato_desc: "Para salvaguardar nossa independência, devemos nos livrar de uma aliança de que nunca precisamos e que nos trouxe muito pouco. Somos capazes de defender nossos interesses sozinhos."
 FRA_frexit_ref: "Referendo do Frexit"
 FRA_frexit_ref_desc: "Chegou a hora de deixar a União Europeia de uma vez por todas. Nosso povo foi suficientemente preparado para rejeitar a União Europeia de vez."
 FRA_strategic_autonomy: "Garantir a Autonomia Estratégica"
 FRA_strategic_autonomy_desc: "Conseguimos restaurar a independência da França; somos livres para fazer o que quisermos neste mundo. A França é forte e livre, e estamos prontos para defendê-la."
 FRA_strong_people: "O Povo Forte"
 FRA_strong_people_desc: "Chega de incentivos à ociosidade; capitalismo sob controle do Estado. Renovamos o contrato social com nosso povo. Eles sabem que os protegemos e que nos devem obediência e boa vontade."
 FRA_recover: "Reconstruir a Economia"
 FRA_recover_desc: "Apesar de todos os nossos esforços para nos preparar para a saída da União Europeia, nossa economia ainda sofreu um golpe. Devemos reconstruí-la sobre bases sólidas antes de sequer pensar em nos vingar de nossos opressores."
 FRA_our_own_sphere: "Nossa Própria Esfera"
 FRA_our_own_sphere_desc: "Não somos os únicos que conseguiram se livrar do imperialismo americano. Podemos encontrar aliados para forjar uma aliança baseada no respeito mútuo entre potências independentes."
 FRA_paid_reconnexion: "Bloquear a Europa"
 FRA_paid_reconnexion_desc: "Agora que deixamos a União Europeia com segurança e êxito, podemos começar a pensar em dar o troco. A União Europeia e suas redes precisam passar pelo nosso país. Isso nos apresenta uma enorme oportunidade de nos vingarmos."
 FRA_certain_idea: "Uma Certa Ideia da França"
 FRA_certain_idea_desc: "Em apenas alguns anos, conseguimos restaurar a França ao que ela deve ser: uma grande potência orgulhosa e livre. O General teria orgulho de termos restaurado seu legado. Ele estava certo: a França só pode ser uma grande potência; caso contrário, não seria a França."
 FRA_salvage_mondialisation: "Resgatar as Vítimas da Globalização"
 FRA_salvage_mondialisation_desc: "Nosso povo sofreu muito em consequência da globalização. Isso vale particularmente para a população trabalhadora, que viu seus empregos desaparecerem, seu país se desfazer e seus valores serem pisoteados. Devemos mostrar a eles que somos o lado que trará a mudança, que ousará fazer as perguntas certas e que terá uma solução muito simples para esses problemas."
 FRA_raise_tariff: "Aumentar as Tarifas"
 FRA_raise_tariff_desc: "Aumentar nossas tarifas nos permitirá pôr fim à concorrência desleal do exterior e permitir que o público francês compre produtos feitos na França."
 FRA_dynamise_periph: "Revitalizar as Periferias"
 FRA_dynamise_periph_desc: "As áreas rurais e suburbanas sempre foram negligenciadas pelas políticas de planejamento. Recebem pouco investimento e muitas vezes abrigam uma população que vive em circunstâncias precárias, mas cheia de boa vontade. Devemos ajudar essa população a ter acesso à mesma infraestrutura disponível nas grandes cidades."
 FRA_focus_insecurity: "Focar na Insegurança"
 FRA_focus_insecurity_desc: "A imigração levou a um aumento significativo da insegurança em nosso país. Devemos demonstrar à população que estamos levando esse problema muito a sério, aumentando o efetivo policial, implementando controles mais rígidos e reprimindo o crime."
 FRA_eurosepticism: "Ameaçar a União Europeia"
 FRA_eurosepticism_desc: "A União Europeia sempre tentou silenciar países como o nosso que se opunham às suas políticas ultraglobalistas. Devemos fazê-los entender que as coisas precisam mudar e que podemos reacender o movimento eurocético na França."
 FRA_sovergnism_policies: "Políticas Soberanistas"
 FRA_sovergnism_policies_desc: "A França deve exercer maior controle sobre sua economia, sua política externa e, acima de tudo, suas fronteiras. Sem isso, nossos esforços para colocar o país de pé serão em vão. Devemos afirmar nossa determinação de governar nosso próprio país."
 FRA_economical_patriotism: "Patriotismo Econômico"
 FRA_economical_patriotism_desc: "Devemos instar as empresas francesas que se mudaram para o exterior a retornar à França. Se recusarem, haverá consequências para suas operações comerciais na França."
 FRA_social_populism: "Populismo Social"
 FRA_social_populism_desc: "Tudo o que precisamos fazer é dar ao povo o que ele pede e reprimir aqueles que ele odeia para garantir nossa base eleitoral e permanecer no poder."
 FRA_criticize_eu_migrant: "Criticar a Política Migratória Europeia"
 FRA_criticize_eu_migrant_desc: "A União Europeia não está fazendo o bastante para conter o fluxo de migrantes e está forçando os Estados-membros a recebê-los. Devemos exercer pressão para pôr um fim a isso."
 FRA_common_accord_eu: "Um Acordo com a UE"
 FRA_common_accord_eu_desc: "A Comissão Europeia percebeu que não pode nos ignorar. Agora devemos fazê-la entender que, ao nos dar o que queremos, garantirá nosso apoio."
 FRA_reinforce_nuke: "Reforçar Nossa Capacidade Nuclear"
 FRA_reinforce_nuke_desc: "A energia nuclear provou sua confiabilidade. Por que recorrer a outras fontes de energia quando temos essa expertise à disposição? Devemos expandir nossa capacidade nuclear para enfrentar uma eventual crise."
 FRA_FN_death: "Restabelecer a Pena de Morte"
 FRA_FN_death_desc: "A pena de morte foi abolida há décadas, e o crime violento só ficou mais audacioso desde então. Nossos cidadãos merecem voltar a se sentir seguros em seu próprio país. Nós a restauraremos, e os crimes mais graves voltarão a ter as consequências mais severas."
 FRA_reject_immigration: "Rejeitar a Imigração"
 FRA_reject_immigration_desc: "Agora que temos melhor controle sobre nossas fronteiras, podemos implementar nossa política de repressão à imigração ilegal."
 FRA_pro_russian_fn: "Políticas Pró-Rússia"
 FRA_pro_russian_fn_desc: "A UE não deixará de ser ultraglobalista. Devemos nos aproximar da Rússia, que sempre conseguiu se manter distante das perversões do Ocidente. Juntos, iremos longe."
 FRA_oppose_lgbt_fn: "Acabar com o Wokismo"
 FRA_oppose_lgbt_fn_desc: "Algumas pessoas não deveriam poder entrar em nosso país. Vamos pôr fim a essa insensatez e nos concentrar em restaurar a ordem baseada no único modelo correto de família."
 FRA_end_right_soil: "Acabar com o Direito de Solo"
 FRA_end_right_soil_desc: "Nascer na França não deve bastar para que alguém seja francês. Devemos pôr fim ao princípio do jus soli; merecemos escolher quem pode ser cidadão francês."
 FRA_support_rus_claim: "Apoiar a Reivindicação Russa"
 FRA_support_rus_claim_desc: "A Rússia tem todo o direito de se sentir ameaçada pela expansão da OTAN. Devemos demonstrar nossa disposição de ajudá-la a reparar as injustiças que sofreu."
 FRA_electoral_reform: "Reforma Eleitoral"
 FRA_electoral_reform_desc: "As eleições na França são cada vez mais contestadas com base no sistema eleitoral e na representatividade dos partidos. Podemos implementar essas reformas garantindo que funcionem a nosso favor, para que permaneçamos no poder."
 FRA_our_identity: "Nossa Identidade"
 FRA_our_identity_desc: "É difícil ser nacionalista dentro de uma entidade como a Europa. Abandonamos a ideia de deixá-la, então devemos forjar uma nova identidade adequada ao nosso lugar na União Europeia, mas que não vise nos diluir em meio à força de trabalho estrangeira."
 FRA_boreal_space: "Nossa Posição com a Rússia"
 FRA_boreal_space_desc: "Demonstramos nosso desejo de trabalhar com a Rússia, e nossos esforços não passaram despercebidos. Agora é hora de decidir o que queremos da Rússia; é hora de estender a mão a eles."
 FRA_long_travel: "A França Prevalece"
 FRA_long_travel_desc: "Nos últimos anos no poder, mostramos ao povo francês que, com determinação, os problemas de um país podem ser resolvidos com muita facilidade. Tornamos a França maior e menos dependente de nossos vizinhos e dos fluxos migratórios, que conseguimos conter."
 FRA_sound_fury: "O Som e a Fúria"
 FRA_sound_fury_desc: "O povo francês não quer mais apaziguamento; os moderados o decepcionaram e nunca trouxeram mudança real. Somos o partido da mudança; devemos mostrar ao povo francês que estamos determinados a desafiar a ordem estabelecida."
 FRA_silent_france: "Mobilizar os Não Votantes"
 FRA_silent_france_desc: "Muitos cidadãos perderam a fé em nossa República e em suas instituições. Devemos incentivá-los a voltar às urnas para promover uma mudança real."
 FRA_end_privatisation: "Acabar com a Privatização"
 FRA_end_privatisation_desc: "Muitas empresas continuaram a transferir seus locais de produção para fora da França para aumentar a lucratividade. Isso eleva o desemprego e nos faz perder nossa expertise. Devemos estancar essa hemorragia retomando o controle dessas empresas, se necessário."
 FRA_pro_lgbt_lfi: "Promover a Ação Afirmativa"
 FRA_pro_lgbt_lfi_desc: "Devemos pôr fim à discriminação a que as pessoas que se desviam do que é erroneamente considerado a norma foram submetidas por tempo demais. Nossa sociedade deve aprender a aceitar todas as diferenças."
 FRA_toward_6th_rep: "Rumo a uma 6ª República"
 FRA_toward_6th_rep_desc: "Agora podemos começar a parte mais importante do mandato que o povo nos confiou. Prometemos mudança, e eles a terão. Chegou a hora de moldar uma nova República que sirva a todos."
 FRA_distance_nato_lfi: "Rejeitar a Política de Blocos"
 FRA_distance_nato_lfi_desc: "A OTAN nos prende às guerras de Washington tão certamente quanto uma aliança com Moscou nos prenderia às suas. Rejeitamos ambos os blocos por igual; o genuíno não alinhamento é a única política externa digna de uma França independente."
 FRA_oppose_eu_treaty: "Opor-se ao Tratado da UE"
 FRA_oppose_eu_treaty_desc: "Tratados injustos foram impostos aos nossos cidadãos. Não temos nenhuma obrigação de respeitá-los. Para mudar esta Europa injusta, devemos começar contestando seu arcabouço legislativo."
 FRA_guarante_employment: "Garantir o Emprego"
 FRA_guarante_employment_desc: "Nosso país está cheio de pessoas talentosas que não conseguem realizar seu potencial por falta de empregos causada pela crise. Devemos garantir a todos um emprego estável e digno; isso deve ser a base de qualquer contrato social."
 FRA_state_power: "O Poder do Estado"
 FRA_state_power_desc: "As instituições da Quinta República são centradas demais no cargo de Presidente da República. Devemos incentivar o debate público para que o povo decida como deve ser nossa nova República."
 FRA_democracy: "Liberdades Individuais"
 FRA_democracy_desc: "As muitas crises que nosso país enfrentou levantaram questões práticas sobre a segurança de nossa população. A vigilância é necessária para proteger nossos cidadãos, mas até onde o Estado pode ir? Devemos permitir que nossos cidadãos tenham o direito de opinar."
 FRA_foreign_recognition_lfi: "Reiniciar Nossas Políticas Externas"
 FRA_foreign_recognition_lfi_desc: "Por tempo demais, nosso país sustentou ditaduras e se recusou a reconhecer a existência de Estados soberanos. Devemos pôr fim a isso."
 FRA_oppose_eu_immigration_lfi: "Questionar a Posição da UE sobre Imigração"
 FRA_oppose_eu_immigration_lfi_desc: "A União Europeia está se tornando cada vez mais complacente com os populistas de extrema-direita. Não faz o bastante para ajudar nossos vizinhos necessitados e os vê apenas como fonte de mão de obra barata. Devemos nos distanciar dessa abordagem e propor uma política mais humana."
 FRA_economic_question: "O Rumo da Economia"
 FRA_economic_question_desc: "O orçamento nacional e sua gestão são questões importantes dos quais tudo o mais depende. Nossos cidadãos também devem ter voz nesse assunto."
 FRA_ho_topic: "Desconstruindo as Peculiaridades Francesas"
 FRA_ho_topic_desc: "Muitas leis e costumes inerentes à cultura francesa não facilitam a integração de outras culturas. Devemos pedir aos cidadãos que discutam a questão da integração das minorias."
 FRA_balance_tax: "Equilibrar a Tributação"
 FRA_balance_tax_desc: "É inaceitável que a classe média e os que vivem em circunstâncias precárias sejam sangrados pelos impostos enquanto os ricos não pagam sua parte justa. Devemos restabelecer o equilíbrio."
 FRA_climate_war_eco: "O Desafio do Nosso Milênio"
 FRA_climate_war_eco_desc: "O meio ambiente e o clima estão se deteriorando em ritmo acelerado. Devemos proteger o que resta de nossa biodiversidade e preparar nossa sociedade para os tempos difíceis que virão."
 FRA_dawn_6th_rep: "Alvorecer da 6ª República"
 FRA_dawn_6th_rep_desc: "Nosso trabalho sobre a Sexta República está concluído. Qualquer que seja o resultado, nosso trabalho está feito. Provavelmente deixamos nossa marca na história."
 FRA_creolisation: "Crioulização"
 FRA_creolisation_desc: "Os séculos de intercâmbio cultural que nosso país testemunhou moldaram uma nova cultura. No entanto, essa cultura é negada por muitos; devemos fazer nossos cidadãos entenderem que o futuro está em conviver. Ainda temos tanto a aprender com o mundo."
 FRA_work_less: "Trabalhar Menos, Trabalhar Melhor"
 FRA_work_less_desc: "Nossos antecessores estavam decididos a fazer os franceses trabalharem cada vez mais horas em condições cada vez piores. Devemos reverter essa tendência e ajudar nossos cidadãos a gostar mais de seu trabalho. Eles serão então ainda mais criativos e entusiasmados com o que fazem."
 FRA_reform_police: "Reformar a Polícia Francesa"
 FRA_reform_police_desc: "Por tempo demais, a polícia foi usada como instrumento de repressão injusta contra nossos cidadãos. Devemos implementar as reformas necessárias para aliviar a pressão sobre nossos cidadãos, garantindo ao mesmo tempo a segurança de todos."
 FRA_post_empire: "Descolonizar Nossa Política Internacional"
 FRA_post_empire_desc: "Nosso passado colonial causou grandes danos às nossas antigas colônias. Muitas delas ainda lutam para se recuperar. Devemos apoiar seus esforços de reconstrução e parar de tentar dominá-las."
 FRA_push_social_green_eu: "Espalhar a Insubmissão na Europa"
 FRA_push_social_green_eu_desc: "Conseguimos muito na França, mas também devemos encorajar nossos parceiros europeus a seguir o mesmo caminho. Podemos mobilizar seus povos a pressionar seus governos para que não sejamos os únicos a promover o progressismo na Europa."
 FRA_social_green_fair_rep: "L'Insoumission"
 FRA_social_green_fair_rep_desc: "Em apenas alguns anos, alcançamos muito. Afastamos a França do liberalismo econômico e da precariedade e criamos uma França mais humanista. Mas nunca deixaremos de desafiar a ordem estabelecida, seja em casa ou no resto do mundo."
 FRA_no_time: "Não Temos Tempo"
 FRA_no_time_desc: "Os cientistas alertam há décadas sobre os efeitos devastadores das mudanças climáticas. O que previram agora está se concretizando: eventos climáticos cada vez mais extremos. As pessoas precisam acordar se quiserem que a próxima geração tenha uma chance de vida."
 FRA_strong_eu: "A Força da UE"
 FRA_strong_eu_desc: "A França não pode obrigar o mundo a levar as mudanças climáticas a sério. A União Europeia, por outro lado, pode servir de modelo para o resto do mundo."
 FRA_ecology_available: "Tornar a Ecologia Acessível"
 FRA_ecology_available_desc: "Por tempo demais, a ecologia foi considerada um privilégio reservado aos ricos. Devemos continuar a promovê-la como forma de economizar dinheiro e evitar tragédias para todos."
 FRA_right_vote: "Ampliar o Direito de Voto"
 FRA_right_vote_desc: "A preocupação com o meio ambiente e seu futuro não deveria ter de esperar até os dezoito anos. Devemos estender o direito de voto a uma parcela maior da população."
 FRA_question_growth: "Questionar o Crescimento Econômico"
 FRA_question_growth_desc: "Por décadas, as pessoas foram levadas a crer que a melhor forma de ajudar o meio ambiente é o desenvolvimento sustentável. Mas por que sempre temos de desenvolver e crescer? O planeta e seus recursos têm limites. Em vez disso, deveríamos caminhar para uma desaceleração do crescimento."
 FRA_cooperate_eu: "Cooperar com os Parceiros da UE"
 FRA_cooperate_eu_desc: "Nem todos os nossos parceiros europeus têm necessariamente os mesmos recursos ou o mesmo compromisso em transformar suas economias para enfrentar as mudanças climáticas. Podemos ajudar nossos principais parceiros a conseguir isso investindo em infraestrutura verde em seus países."
 FRA_push_eco_eu: "Promover um Futuro Verde"
 FRA_push_eco_eu_desc: "Nossos parceiros europeus não estão fazendo tanto quanto nós para enfrentar as mudanças climáticas. Podemos incentivar suas populações a agir instando seus ativistas ambientais a tomar iniciativa e seguir o exemplo da França."
 FRA_question_agriculture: "Uma Agricultura Sustentável"
 FRA_question_agriculture_desc: "A agricultura na França caminhou para a produção em massa a fim de atender às necessidades do século passado. Do ponto de vista ambiental, é mais responsável do que muitas outras formas de agricultura, mas ainda há espaço para melhorias. Além dos padrões europeus, devemos incentivar os agricultores a mudar seus métodos em favor de uma produção responsável e de alta qualidade. Garantiremos que seus produtos sejam promovidos e que isso seja lucrativo para eles."
 FRA_cooperation_no_compet: "Cooperação, Não Competição"
 FRA_cooperation_no_compet_desc: "O modelo de sucesso social em nosso país e no mundo se baseia no sucesso individual e na ostentação da riqueza. Esse comportamento é prejudicial ao nosso planeta, pois incentiva o consumo excessivo e a competição tóxica entre os cidadãos. Para reduzir o impacto de nossas sociedades sobre o planeta, devemos contestar esses modelos sociais."
 FRA_nuke_choice: "Diversificar Nossa Matriz Energética"
 FRA_nuke_choice_desc: "Por décadas, a energia na França foi gerada por dezenas de reatores nucleares. Embora essa tecnologia possa ser confiável e relativamente segura a curto prazo, ela produz resíduos que não conseguimos descartar. Portanto, não é a fonte de energia ideal para um futuro sustentável. Devemos diversificar nosso suprimento de energia investindo mais em energia renovável."
 FRA_green_eu: "Rumo a uma UE Mais Verde"
 FRA_green_eu_desc: "Nosso sucesso, dentro e fora do país, no combate às mudanças climáticas serve de modelo para outros países da União Europeia. Podemos nos orgulhar disso."
 FRA_eco_life: "Modo de Vida Ecológico"
 FRA_eco_life_desc: "Adotar métodos de produção mais sustentáveis não será suficiente por si só. Devemos incentivar nossos cidadãos a consumir menos. Isso implica conter a publicidade onipresente e promover a moderação. Não precisamos de tudo isso; podemos ser felizes com menos."
 FRA_upgrade_transport: "Modernizar Nossa Rede de Transportes"
 FRA_upgrade_transport_desc: "Nossa rede de transportes pode ser eficiente, mas é muito desigual e obriga as pessoas das áreas periféricas a se deslocar por meios de transporte mais caros e mais poluentes. Devemos tornar uma alternativa acessível em todas as regiões; isso significa melhorar as conexões com as áreas periféricas em vez de continuar desenvolvendo uma rede cada vez mais veloz que liga apenas algumas cidades europeias."
 FRA_dynamise_research: "Dinamizar a Pesquisa"
 FRA_dynamise_research_desc: "Devemos continuar a desenvolver a pesquisa; nunca deixaremos de encontrar formas de fazer mais com menos e de desenvolver energia renovável."
 FRA_help_transi: "Auxiliar uma Transição Europeia"
 FRA_help_transi_desc: "Nossos parceiros europeus começam a perceber que as mudanças climáticas são uma questão séria que os afetará cada vez mais. No entanto, alguns ainda não atingiram o estágio de desenvolvimento necessário para poder investir nesse setor. Podemos ajudá-los criando um fundo conjunto entre nossos países dedicado à transição para uma economia de baixo carbono."
 FRA_end_fossile: "Acabar com os Combustíveis Fósseis"
 FRA_end_fossile_desc: "Agora que a importância da transição verde é mais amplamente reconhecida na União Europeia, podemos intensificar nossos esforços. Podemos propor a nossos parceiros que caminhemos para a eliminação gradual dos combustíveis fósseis."
 FRA_opti_indus: "Otimizar Nossas Indústrias"
 FRA_opti_indus_desc: "Precisamos fazer os líderes das grandes empresas entenderem que implementar medidas ambientais genuínas seria do interesse deles. Eles também poderiam fazer mais usando menos recursos. Devemos, porém, ter cuidado para que isso não os incentive a produzir ainda mais."
 FRA_promote_local: "Promover o Consumo Local"
 FRA_promote_local_desc: "Agora que temos uma indústria mais responsável, precisamos garantir que nossos cidadãos realmente possam pagar por seus produtos. No entanto, as forças de mercado favorecem a produção de baixo custo. Devemos, portanto, garantir que os produtos de nossas próprias indústrias estejam mais facilmente disponíveis do que os do outro lado do mundo. Isso exigirá flexibilizar as regras do livre comércio. Mas devemos conseguir dar conta."
 FRA_subsidies_green: "Subsidiar Indústrias Verdes"
 FRA_subsidies_green_desc: "Incentivar as empresas a fazer mudanças ecológicas não trará todos a bordo. Precisamos fornecer os recursos necessários e oferecer subsídios às empresas com base em seu compromisso com o planeta e em sua eficiência. Desta vez, não haverá greenwashing."
 FRA_pressure_supply: "Pressionar as Cadeias de Suprimento"
 FRA_pressure_supply_desc: "É um fato que nosso país não consegue produzir internamente todas as matérias-primas de que precisa. A União Europeia importa muitíssimos recursos de países com padrões ambientais frouxos. É inaceitável que importemos recursos que não atendem aos nossos critérios de produção. Caso contrário, qual o sentido de ter regulamentos? Devemos unir forças com outras potências europeias para pressionar esses países exportadores a promover mudanças."
 FRA_reduce_extraction: "Reduzir a Extração de Recursos"
 FRA_reduce_extraction_desc: "A extração de minerais e petróleo é um processo poluente que muitas vezes excede a capacidade do planeta de regenerá-los. Embora não estejamos sentados sobre um campo de petróleo, devemos dar o exemplo ao resto do mundo introduzindo regulamentos mais rigorosos para a extração de minerais e combustíveis."
 FRA_power_rail: "Ampliar a EU-Rail"
 FRA_power_rail_desc: "A União Europeia já tem uma extensa rede ferroviária, mas podemos fazer ainda melhor. Carga demais ainda é transportada por caminhão; devemos reduzir isso."
 FRA_altermondialism: "Promover o Altermundialismo"
 FRA_altermondialism_desc: "O fato de a globalização ter deixado de beneficiar o público não surpreende ninguém. Mas devemos afastar o público do movimento antiglobalização. Essas tendências são perigosas porque contrapõem a globalização a uma solução nacionalista, muitas vezes agressiva. Devemos mostrar-lhes que o principal inimigo é o capitalismo."
 FRA_unite_struggle: "Convergência das Lutas"
 FRA_unite_struggle_desc: "Devemos unir todos os que são oprimidos, seja por gênero, religião, cor da pele ou qualquer outra característica. Todos são vítimas do capitalismo e de suas consequências sociais. Devemos mostrar-lhes que todos os seus problemas têm uma causa e uma solução."
 FRA_retake_past: "Reconquistar os Trabalhadores"
 FRA_retake_past_desc: "Após o colapso da URSS e o fim da \"globalização feliz\", grande parte de nosso antigo eleitorado operário voltou-se para os populistas de extrema-direita ou, em sua maioria, deixou de votar. Hoje conseguimos vencer as eleições, mas, para garantir nossa sobrevivência a longo prazo, devemos reconstruir nossa base operária, que é o próprio DNA do nosso partido. Para isso, devemos levar suas demandas a sério, começando por trazer de volta os empregos que nossos antecessores liberais enviaram para a China."
 FRA_turn_reform: "Reforma em Vez de Revolução"
 FRA_turn_reform_desc: "Agora que voltamos ao comando dessas instituições, não precisamos mais cogitar agir para contestar o Estado, pois agora fazemos parte dele. Poderemos reformar a sociedade por dentro, deixando de lado os ideais revolucionários."
 FRA_leave_nato_PCF: "Romper com o Imperialismo Americano"
 FRA_leave_nato_PCF_desc: "A OTAN é um instrumento do imperialismo americano e o veículo de seu domínio sobre a Europa. Devemos romper com ela e nos colocar, em vez disso, em solidariedade com todos os povos que resistem à hegemonia de Washington."
 FRA_renogociate_treaty: "Renegociar o Tratado da UE"
 FRA_renogociate_treaty_desc: "Nosso povo foi forçado a aceitar tratados europeus aos quais, no entanto, havia se oposto. Para executar nosso programa, devemos alterar o arcabouço legislativo que nos é imposto pela União Europeia. Sem dúvida haverá um braço de ferro com as instituições europeias e sanções, mas não temos outra escolha se realmente quisermos agir no interesse do povo francês."
 FRA_undo_lib_PCF: "Fechar o Parêntese Liberal"
 FRA_undo_lib_PCF_desc: "Desde o mandato do Presidente Mitterrand, o povo francês teve de suportar políticas liberais tanto da esquerda quanto da direita. É hora de pôr fim a isso e mostrar que somos diferentes. Que estamos determinados a lutar contra o capitalismo, mesmo que isso signifique entrar em conflito com a OMC ou a União Europeia."
 FRA_protect_indus_pcf: "Proteger Nossa Indústria"
 FRA_protect_indus_pcf_desc: "Não basta investir em indústrias na França; devemos impedir que elas se mudem para lugares onde a mão de obra é mais barata e há menos regulamentos. É uma questão de salvaguardar nossa soberania sobre os meios de produção e garantir empregos e condições de vida dignos para nossos trabalhadores."
 FRA_left_front: "Ampliar a Coalizão"
 FRA_left_front_desc: "Nosso governo está formado, mas não é muito estável; faltam-nos aliados. Talvez devamos buscar aliados entre os outros partidos de esquerda radical. Eles não aceitaram integrar nosso governo, mas talvez possamos persuadi-los. Poderíamos oferecer-lhes alguns cargos ministeriais em troca de seu apoio."
 FRA_deal_devil_pcf: "Um Acordo com os Socialistas"
 FRA_deal_devil_pcf_desc: "Os outros partidos de esquerda radical não serão suficientes para garantir a estabilidade que esperamos. Talvez possamos encontrar um terreno comum com o Partido Socialista. Afinal, deixar a Europa nunca fez parte de nossos planos. Certamente podemos encontrar pontos em comum com eles para assegurá-los em nossa coalizão."
 FRA_tie_moscow: "Aliança com Moscou"
 FRA_tie_moscow_desc: "Durante toda a Guerra Fria e mesmo depois, nosso partido sempre ficou ao lado de Moscou. Embora a era da URSS tenha acabado, parece que as atuais autoridades russas são favoráveis aos ideais comunistas. Desde a nossa saída, estamos sob ameaça de nossos antigos aliados. Um aliado russo seria um sonho realizado; poderíamos estabelecer cooperação econômica."
 FRA_eu_communism_PCF: "Promover o Eurocomunismo"
 FRA_eu_communism_PCF_desc: "A URSS agora não passa de uma lembrança distante, e hoje devemos nos virar sem ela num mundo em que a Rússia, nosso antigo modelo, oscila entre a oligarquia e o ultranacionalismo. Comunismo e União Europeia não são incompatíveis; outros países europeus não lhe são hostis. Podemos permanecer na Europa e fazer o possível para afastá-la do capitalismo e do fascismo."
 FRA_retake_sovereign: "Retomar Nossa Soberania"
 FRA_retake_sovereign_desc: "Agora que recuperamos o controle de nosso aparato produtivo, temos os meios para ir além. Devemos nos livrar da influência estrangeira agora que temos meios de agir de forma independente."
 FRA_empower_union_PCF: "Promover os Sindicatos"
 FRA_empower_union_PCF_desc: "Apesar de seu antigo poder, os sindicatos já não têm muito peso hoje. Isso porque as autoridades os enfraqueceram deliberadamente, dividindo a classe trabalhadora e minando a segurança no emprego. Contudo, ter uma força capaz de enfrentar os empregadores é essencial em nosso país. Não podemos estar em todo lugar ao mesmo tempo; a classe trabalhadora deve retomar o controle de seu futuro. Devemos ajudá-los a recuperar sua legitimidade aos olhos da classe trabalhadora."
 FRA_green_communism: "Aproximar-se dos Verdes"
 FRA_green_communism_desc: "A humanidade não é a única vítima do capitalismo; nosso planeta também está em perigo por causa da conduta irresponsável da humanidade. Podemos encontrar pontos em comum com os Verdes; eles podem nos ajudar a elaborar nosso programa ecológico, de que também precisaremos."
 FRA_no_russian_claim: "A Ameaça Russa"
 FRA_no_russian_claim_desc: "É muito provável que, mais cedo ou mais tarde, a União Europeia se veja em conflito com a Rússia. Como a Rússia provavelmente mirará territórios ucranianos e bálticos, devemos começar estendendo a mão aos ucranianos para oferecer nossa ajuda."
 FRA_green_turn: "Comunismo Verde"
 FRA_green_turn_desc: "Em colaboração com nossos aliados verdes, elaboramos um programa ambiental que nos permitirá preparar a França para os desafios das mudanças climáticas. Isso exigirá de nós um grande esforço para reconstruir nossos meios de produção, limitando ao mesmo tempo sua pegada de carbono. Mas devemos fazê-lo; a classe trabalhadora também tem filhos que precisam poder crescer num mundo habitável."
 FRA_favor_lgbt: "Acabar com a Discriminação"
 FRA_favor_lgbt_desc: "Agora que garantimos os meios básicos de subsistência para nossa população, dando-lhe empregos e um futuro, devemos também enfrentar a discriminação dentro das classes sociais. Devemos lembrar a nosso povo que a discriminação, por qualquer motivo que seja, é inaceitável. Nossa sociedade deve aprender a aceitar todas as diferenças."
 FRA_dna_restored: "DNA Restaurado"
 FRA_dna_restored_desc: "Com nossa coalizão assegurada, podemos nos concentrar em devolver a proeminência à classe trabalhadora. Introduzindo leis abrangentes de proteção ao emprego, deveremos conseguir reconquistar nossa base eleitoral. Isso não agradará ao empresariado, mas esse nunca foi o nosso objetivo."
 FRA_condemn_rus: "Proteger a Europa Oriental"
 FRA_condemn_rus_desc: "A agressão russa pode não parar na Ucrânia. Para proteger nossa Europa emergente, devemos garantir que os países da Europa Oriental e Setentrional possam resistir a uma eventual invasão russa."
 FRA_by_ourself: "Triunfo do Reformismo"
 FRA_by_ourself_desc: "Ao construir uma coalizão forte, lançamos as bases para que a França continue sendo uma nação de esquerda. Restauramos a confiança do eleitorado na esquerda e em suas instituições. Sem descartar o passado, enquanto estivermos aqui, jamais deixaremos de lutar contra o capitalismo e o fascismo, tanto na Europa quanto no mundo."
 FRA_friend_of_past_pcf: "Rumo a uma Nova Comintern"
 FRA_friend_of_past_pcf_desc: "O governo comunista russo também parece suficientemente consolidado. Poderíamos propor a eles que ampliássemos nossa cooperação. É hora de restaurar o comunismo à sua antiga glória. Os capitalistas e fascistas devem aprender a nos temer novamente."
 FRA_struggle_end: "A Luta Está Apenas Começando"
 FRA_struggle_end_desc: "Ao longo destes poucos anos no governo, recolocamos o comunismo no mapa político. Reconectamo-nos com nosso eleitorado e garantimos um futuro para as gerações vindouras. No entanto, estamos longe de terminar. Sempre haverá novos desafios a enfrentar. Mas ao menos garantimos que a Esquerda não será mais o cavalo de Troia do neoliberalismo."
 FRA_new_18th_brumaire: "Um Novo 18 de Brumário"
 FRA_new_18th_brumaire_desc: "Nós, bonapartistas, asseguramos os mais altos cargos da República. A oposição republicana foi silenciada, e somente nós somos capazes de conduzir este país. Nossos inimigos são legião, mas nada se interporá entre a França e seu destino."
 FRA_revolution_bonapart: "O Legado Revolucionário"
 FRA_revolution_bonapart_desc: "Napoleão I e o Império Francês são herdeiros diretos da Revolução Francesa. Como o povo francês é profundamente apegado a esses valores, devemos mostrar-lhe que nosso Império não é uma restauração. Nosso Império é o arauto de uma nova revolução."
 FRA_despotism: "Despotismo em Vez de Desordem"
 FRA_despotism_desc: "A agitação dos últimos meses causou considerável preocupação entre nosso povo e nos mercados financeiros. Devemos tranquilizá-los de que, enquanto estivermos no poder, nenhuma desordem será tolerada."
 FRA_napoleon_constitution: "A Constituição Napoleônica"
 FRA_napoleon_constitution_desc: "As instituições da antiga República já não se adequam ao presente nem à nossa autoridade. Devemos remodelá-las para criar um Estado mais forte do que nunca."
 FRA_reform_military_napoleon: "A Nova Grande Armée"
 FRA_reform_military_napoleon_desc: "Nossas forças armadas são mais do que adequadas para um país como o nosso. Mas não são capazes de sustentar um conflito prolongado contra várias potências estrangeiras. Devemos começar do zero e construir um exército que ninguém possa derrotar."
 FRA_question_eu: "Europa ou o Império"
 FRA_question_eu_desc: "Como nosso país é membro fundador da União Europeia, está profundamente integrado a ela, e romper não seria tarefa fácil. Acontece que pretendemos, de fato, lutar contra outras potências europeias. Devemos reintegrar as instituições da União Europeia, como o novo governo francês, ou devemos seguir em frente e deixá-la de vez? Em todo caso, seremos forçados a lutar contra elas."
 FRA_centralised_admin: "Centralismo Administrativo"
 FRA_centralised_admin_desc: "A descentralização foi um erro para o nosso país. O que precisamos é de uma cadeia de comando clara e de uma estrutura organizacional vertical."
 FRA_blame_ennemy: "Retórica Agressiva"
 FRA_blame_ennemy_desc: "Nosso Império nascente está cercado por seus futuros inimigos. Mais cedo ou mais tarde seremos forçados a combatê-los, mas nossa sociedade não está pronta para guerrear contra nossos antigos aliados. Nós os desviamos falando-lhes de um futuro pacífico; mais cedo ou mais tarde serão trazidos de volta à realidade. Para isso, podemos prepará-los minando sua confiança em nossos antigos parceiros e fazendo-os perceber que estamos sozinhos contra todos os demais."
 FRA_proclaim_empire: "Uma Proclamação Imperial"
 FRA_proclaim_empire_desc: "Em pouco tempo, conseguimos consolidar nosso poder e criar as condições para o retorno da França ao cenário internacional. Agora é hora de largar as aparências. Proclamaremos o retorno do Império Francês após um desfile que demonstre toda a extensão de nossas capacidades militares. Uma demonstração de força, um aviso, o alvorecer de uma nova era para a França. Depois disso, veremos as coisas com clareza: potenciais aliados virão até nós e nossos adversários se revelarão."
 FRA_la_grande_armee: "A Espinha Dorsal do Nosso Exército"
 FRA_la_grande_armee_desc: "Tendo reformado nossa cadeia de comando, podemos agora voltar nossa atenção a reformas mais específicas de nossa estrutura militar. Para começar, podemos nos concentrar em nossa doutrina ofensiva em termos dos recursos efetivamente disponíveis para conduzir nossas operações."
 FRA_europe_nationalism: "Fortalecer o Nacionalismo Europeu"
 FRA_europe_nationalism_desc: "Poucas nações europeias nos prometeram apoio. Veem com desagrado o retorno de uma França liderada por um partido nacionalista. A postura delas é um erro; deveriam saber que é melhor estar conosco do que contra nós. Vamos fazê-las pagar pela inação. Vamos apoiar grupos nacionalistas em seus países. Isso deve causar uma bela bagunça em casa e, se chegarem ao poder, teremos ganhado um aliado."
 FRA_plebiscites: "Governo por Plebiscito"
 FRA_plebiscites_desc: "O fim da República de modo algum significou que o povo ficaria sem meios de fazer ouvir sua opinião. Devemos mostrar ao povo que ele ainda tem voz, convidando-o a decidir sobre diversas questões de nossa política. O Imperador não terá dificuldade em convencê-los, e essa democracia de fachada bastará para a maioria."
 FRA_firepower: "O Poder de Fogo Moderno"
 FRA_firepower_desc: "Durante as Guerras Napoleônicas, a Grande Armée se beneficiou de várias inovações que lhe permitiram desencadear um poder de fogo sem precedentes sobre as forças contrarrevolucionárias. Hoje, as regras do bombardeio mudaram significativamente com o advento das aeronaves de ataque e dos drones no campo de batalha. Nosso país tem a sorte de se destacar tanto na artilharia quanto na aviação. Devemos, portanto, decidir qual priorizar para racionalizar nossa produção de apoio ao campo de batalha."
 FRA_8th_coalition: "Cercados por Inimigos"
 FRA_8th_coalition_desc: "Assim como nos dias das Guerras Napoleônicas, um jogo político claramente se desenha. Nossos inimigos nos temem e só esperam o primeiro sinal de fraqueza para unir forças contra nós. Não lhes daremos essa satisfação. Nossas fronteiras permanecerão militarizadas pelo tempo que for necessário. O Império Francês só sobreviverá enfrentando seus adversários; a diferença em relação ao passado é que desta vez a coalizão não terá tempo de se formar, pois os esmagaremos um a um."
 FRA_renew_meritocracy: "O Império Meritocrático"
 FRA_renew_meritocracy_desc: "Embora fosse conhecido por ter suas falhas, o Primeiro Império deveu seu sucesso à preferência pela experiência e pelo profissionalismo em vez da classe social. Hoje, devemos renovar essa promessa de ascensão social ao povo francês. Eles devem entender que, trabalhando duro pelo Império e pela França, podem subir mais alto do que jamais subiram."
 FRA_last_deluge: "Mais Fortes Que Nunca"
 FRA_last_deluge_desc: "Realizamos reformas de grande alcance em nossa cadeia de comando, em nossas doutrinas e em nossas cadeias de suprimento. Agora só nos resta abrir as portas de nosso exército ao recrutamento em massa. A conscrição há muito não é uma realidade, mas os franceses estão prontos para lutar por seu Império. A Grande Armée estará pronta para partir à conquista da Europa."
 FRA_ennemy_isolate: "Infiltrar Nossos Oponentes"
 FRA_ennemy_isolate_desc: "Temos os meios de infiltrar os sistemas de defesa civil de nossos adversários e atingi-los onde dói. Isso proporcionará excelente treinamento para nossos serviços de inteligência, mas também corre o risco de torná-los desconfiados de nós."
 FRA_history_allies: "Os Aliados do Império"
 FRA_history_allies_desc: "Embora estejamos cercados de inimigos, não estamos sozinhos; muitos países ainda mantêm relações amistosas conosco e podem se interessar em integrar nossa aliança. Poderíamos destacar nossa história compartilhada com eles para justificar uma futura aliança. Podemos oferecer-lhes benefícios significativos, e eles nos serão de grande ajuda."
 FRA_imperial_pride: "Orgulho Imperial"
 FRA_imperial_pride_desc: "O povo francês recuperou seu orgulho. Mostramos a ele que a paz e a República não passavam de ilusões e que o futuro da França está em se tornar um Império. Eles têm orgulho de seu país e odeiam nossos adversários. Nossa sociedade e nossa economia estão voltadas para um conflito prolongado."
 FRA_declare_hostile: "Testar Suas Defesas"
 FRA_declare_hostile_desc: "Não temos mais motivo para ocultar nossas ambições expansionistas de nossos futuros inimigos. É hora de mostrar a seus povos que eles têm todos os motivos para nos temer e se submeter sem fazer alarde."
 FRA_our_own_system: "Nosso Próprio Sistema"
 FRA_our_own_system_desc: "Todo império tem sua própria aliança, e tentar triunfar sozinho seria custoso. Vários países já manifestaram disposição de formar uma aliança conosco. É hora de formalizar essa cooperação criando uma aliança forte entre parceiros que se respeitam mutuamente."
 FRA_reclaim_empire: "Reivindicar o Império"
 FRA_reclaim_empire_desc: "Chegou a hora de partir para reivindicar nosso Império. Passamos anos preparando nossa sociedade, nossa economia e nosso exército. É hora de esse trabalho dar frutos e de a França recuperar seu lugar de direito na ordem mundial."
 FRA_french_commune: "A Revolução Vitoriosa"
 FRA_french_commune_desc: "Conseguimos arrancar o controle das instituições dos comunistas moderados e de outras forças fracas ou fantoches do capitalismo. Ao aceitar nossa ascensão ao poder, o povo francês deposita sua confiança em nós. Eles também acreditam que o capitalismo pode ser derrotado, e é isso que pretendemos fazer. Reconstruiremos nossa sociedade e nos prepararemos para um confronto com as forças capitalistas."
 FRA_purge_military: "Assegurar o Estado-Maior"
 FRA_purge_military_desc: "Embora tenhamos conseguido tomar o controle das instituições, o exército, que não interveio, pode nem sempre permanecer ao nosso lado. Mais cedo ou mais tarde, teremos de enfrentar militarmente outra potência. Para garantir sua lealdade, devemos começar pelo topo da cadeia de comando. Eles perceberão com facilidade que não têm escolha, mas sem dúvida mostrarão alguma resistência por alguns meses. Uma vez que o topo da cadeia seja alinhado, o resto obedecerá às ordens."
 FRA_worker_right_comm: "Tranquilizar os Trabalhadores"
 FRA_worker_right_comm_desc: "Embora a fase difícil de nossa revolução tenha acabado, a sociedade civil manifestou séria preocupação com a situação em nosso país. Devemos tranquilizar a força de trabalho garantindo-lhe empregos e segurança no emprego. Isso exigirá que nossas linhas de produção se adaptem, mas essas garantias serão benéficas para o nosso futuro."
 FRA_people_constitution_comm: "A Ditadura do Proletariado"
 FRA_people_constitution_comm_desc: "As instituições da Velha República eram fundamentalmente injustas. Uma pequena casta corrupta exercia controle total sobre o país. Nossa Revolução deve dar aos trabalhadores as ferramentas para participar da vida política do país que ajudam a fazer funcionar. É hora de pôr fim à República injusta e conceber uma nova forma de governança."
 FRA_revolution_soil: "Uma Terra de Revolução"
 FRA_revolution_soil_desc: "Das Jacqueries às Revoluções Francesas, o povo francês mostrou que se opõe à injustiça dos sistemas autoritários. No rastro de nossa Revolução, devemos mostrar-lhe que suas preces foram ouvidas e construir uma sociedade igualitária capaz de resistir a todos os ataques dos contrarrevolucionários."
 FRA_hostile_nato_comm: "O Ocidente Corrompido"
 FRA_hostile_nato_comm_desc: "A OTAN é um fantoche dos Estados Unidos e do Capitalismo. Como ambos são nossos inimigos mortais, não devemos permanecer nesta aliança por mais tempo. Mais cedo ou mais tarde, eles serão nossos oponentes."
 FRA_fate_eurocommunism: "Abandonar o Experimento Europeu"
 FRA_fate_eurocommunism_desc: "Mesmo que tentássemos com todas as forças, não conseguiríamos recolocar as instituições da União Europeia no caminho certo. Elas estão infestadas pela corrupção do capitalismo e do lobby. Além disso, esses países se opõem firmemente à nossa política interna. A ruptura prejudicará nossa economia altamente integrada, mas essa separação é necessária."
 FRA_legacy_patriwar: "O Legado da Grande Guerra Patriótica"
 FRA_legacy_patriwar_desc: "No século passado, a URSS mostrou ao mundo que o fascismo podia ser derrotado pela força das armas. Essa guerra, que travaram com sucesso, nos ensinou que uma nação deve se manter unida ao seu exército. O Exército Vermelho jamais teria prevalecido sem a resiliência da sociedade soviética. Devemos garantir que, em conflitos futuros, o entusiasmo popular permaneça no auge. Precisaremos de toda a nossa força para o que vem pela frente."
 FRA_focus_education: "Educação Popular"
 FRA_focus_education_desc: "Seja para se envolver na política ou para ser eficaz e feliz no trabalho, nosso povo precisa estar informado. Devemos dar a todos a chance de aprender tudo de que precisam para compreender o mundo sem cair na propaganda de capitalistas e fascistas."
 FRA_loyalty_cause: "Lealdade à Causa"
 FRA_loyalty_cause_desc: "Concedemos ao nosso povo inúmeros direitos, de melhores condições de trabalho à representação política, e corrigimos muitos erros. Esses novos direitos, porém, trazem responsabilidades. A dissidência é permitida, mas todo cidadão é obrigado a se submeter plenamente à vontade do coletivo. Governamos esta sociedade juntos; é, portanto, responsabilidade de todos garantir que ela continue a funcionar adequadamente."
 FRA_paris_commune: "As Lições da Comuna de Paris"
 FRA_paris_commune_desc: "Embora os laços entre a Comuna de Paris e a ideologia comunista que professamos estejam longe de ser óbvios, ainda podemos tirar lições desse período turbulento. A Comuna de Paris pereceu por falta de recursos e de vontade de combater as forças da contrarrevolução. Neste mundo cruel, corrompido pela globalização, devemos ter em mente que a sobrevivência de nossa revolução depende de esmagar as forças contrarrevolucionárias. Nossa sociedade deve ter consciência disso e permanecer unida para enfrentar nossos adversários."
 FRA_unleash_agent: "Desestabilizar os Capitalistas"
 FRA_unleash_agent_desc: "Nem sempre poderemos enfrentar nossos adversários no campo de batalha; seria caro demais e poderíamos acabar derrotados. Podemos, porém, facilitar nossa vida destruindo a sociedade deles por dentro. Com a DGSE, temos uma agência de inteligência treinada em espionagem e desestabilização, e poderíamos usá-la bem. Exportaremos a revolução sem fazer guerra, e não há nada que os capitalistas possam fazer para impedi-la."
 FRA_spread_communism_eu: "Espalhar o Comunismo na Europa"
 FRA_spread_communism_eu_desc: "Não podemos mudar as instituições europeias, mas podemos incentivar alguns de seus Estados-membros a se rebelar. Como as políticas neoliberais implementadas em toda a UE não agradam a todos, não teremos dificuldade em convencer parte de suas populações a se juntar a nós."
 FRA_red_army_comm: "O Novo Exército Vermelho"
 FRA_red_army_comm_desc: "Graças às nossas reformas, o exército está totalmente sob o controle da comuna, e a sociedade civil está pronta para lutar ao lado de suas forças armadas. Nossas reformas também liberaram todo o seu potencial; nossos soldados sabem que a justiça está do nosso lado. A comuna não deve cair, pois carrega a tocha da revolução."
 FRA_collectivisation: "Coletivização da Economia"
 FRA_collectivisation_desc: "O controle da economia sempre escapou à classe trabalhadora, permanecendo nas mãos de algumas famílias. Antes da revolução, a oligarquia reinava suprema neste país. Mas agora isso acabou; o povo francês está retomando o controle de seus meios de produção. Com isso, garantiremos a lealdade de nossos meios de produção, bem como a segurança financeira de nossa população."
 FRA_enforce_unions: "Fortalecer os Sindicatos"
 FRA_enforce_unions_desc: "Agora que coletivizamos a economia francesa e demos maior responsabilidade política aos trabalhadores, devemos garantir que eles possam manter o controle caso o Estado se mostre menos prudente. Os sindicatos podem ter sido restabelecidos por nossos antecessores moderados, mas podemos fazer mais do que isso. Daremos aos sindicatos ainda mais poder e incentivaremos os trabalhadores a se filiar. Trabalhadores unidos jamais devem deixar de desempenhar um papel significativo nas decisões do nosso país."
 FRA_glorious_past_comm: "O Passado Questionável do Comunismo"
 FRA_glorious_past_comm_desc: "Embora nem toda a Europa guarde boas lembranças do comunismo stalinista, particularmente na Europa Oriental, devemos lembrá-los de que somos diferentes. Esses países foram esmagados pelo totalitarismo stalinista, que não libertou o povo, mas apenas lhe deu um novo senhor. Nossos únicos inimigos são o capitalismo e o fascismo; se esses países precisarem se libertar deles, podemos ajudá-los. Mas nosso objetivo não será escravizá-los, e sim integrá-los à nossa União do Proletariado de todas as nações."
 FRA_befriend_comm: "Unidade dos Trabalhadores"
 FRA_befriend_comm_desc: "Embora o comunismo esteja menos em voga neste novo milênio, não estamos sozinhos em seguir seus ensinamentos. Na luta que temos pela frente, precisamos de aliados, e podemos encontrá-los entre os países que, como nós, escolheram resistir ao capitalismo. Devemos propor a esses países que nos ajudemos mutuamente a destruir o capitalismo em todo o mundo. Eles não estão sozinhos, e nós também não."
 FRA_final_struggle: "A Luta Final"
 FRA_final_struggle_desc: "Nossa sociedade e nosso exército estão prontos para lutar contra o capitalismo. Eles têm consciência do progresso que fizemos e da determinação das potências capitalistas em nos varrer do mapa. Lutaremos até o fim para derrotar o capitalismo."
 FRA_UFSR_born: "Comunismo com Características Francesas"
 FRA_UFSR_born_desc: "A combinação da ideologia comunista com a determinação do povo francês em defender seus direitos foi uma ideia muito boa. Deixamos claro ao público que ele deve se envolver na política e que tem os meios para isso. Assim como a Fête de la Fédération marca nossa festa nacional, pode-se dizer que a revolução agora foi verdadeiramente aceita pelo povo francês. Este é um dia histórico para o nosso país."
 FRA_new_kommintern: "Rumo a uma Nova Internacional"
 FRA_new_kommintern_desc: "Muitos grupos ao redor do mundo responderam ao nosso chamado por uma Revolução Mundial. É hora de pôr nossa aliança em prática e nos preparar para enfrentar o capitalismo."
 FRA_cold_war_round2: "A Revolução Mundial"
 FRA_cold_war_round2_desc: "Chegou a hora de lutar contra o capitalismo e o fascismo. Levaremos liberdade aos trabalhadores de todos os países. A oligarquia será derrotada."
 FRA_kingdom_history: "Uma Longa História de Monarquia"
 FRA_kingdom_history_desc: "A monarquia voltou à França. Nossos apoiadores tomaram o controle das instituições da antiga República e pediram nosso retorno. E aqui estamos, dois séculos após a queda da monarquia absoluta, de volta ao trono da França. Uma longa jornada nos aguarda. Devemos erradicar o legado republicano da Revolução enquanto reconstruímos o novo Reino da França. Enquanto isso, nossos inimigos nos espreitam nas sombras, mas teremos êxito, pois Deus está conosco, como sempre esteve."
 FRA_camelot: "Os Camelots do Rei"
 FRA_camelot_desc: "Para garantir que a população permaneça obediente e não sonhe com uma nova República, precisamos intensificar a vigilância, e para isso precisamos de uma polícia política. Com esse fim, podemos recorrer a ex-membros da Action Française que foram treinados pela DGSI. Fundiremos essas organizações em um novo órgão, que chamaremos de Camelots do Rei, em homenagem aos nossos ativistas realistas do século passado."
 FRA_decentralisation_king: "Descentralização Completa"
 FRA_decentralisation_king_desc: "A centralização herdada do jacobinismo e da Revolução não transformou os franceses em cidadãos, mas em súditos. Os sistemas de direito consuetudinário que operavam nos níveis inferiores cumpriam muito bem seu papel de elo entre o cidadão e o Estado central. Felizmente, nosso país já havia começado a se afastar do centralismo para cumprir as normas da União Europeia. Podemos, portanto, completar essa transição, não para nos adequar ao molde das regiões europeias, mas para restaurar o sistema de poder local como era antes da Revolução."
 FRA_king_rule: "Regnum Regis"
 FRA_king_rule_desc: "O primeiro passo para apagar a memória da Revolução é construir um novo sistema sobre as ruínas do antigo. Podemos, portanto, anunciar a abolição da República e a redação de uma nova constituição. Essa constituição será centrada no Rei, que exercerá poder absoluto, como nos bons velhos tempos."
 FRA_national_integralism: "Nacionalismo Integral"
 FRA_national_integralism_desc: "Para ajudar o povo francês a entender o fracasso que foi a Revolução e suas consequências, devemos destacar uma célebre teoria apresentada pelo pensador Charles Maurras. O Nacionalismo Integral retrata uma República que abandonou o patriotismo em consequência de uma Revolução instigada por maçons, hereges e estrangeiros. Ele defende um retorno à unidade nacional e à ordem moral encarnada pela Igreja Católica. Esses ensinamentos são repletos de virtude e se aplicam inteiramente ao nosso Reino nascente. Nosso Reino acaba de encontrar seu manifesto."
 FRA_no_more_eu: "Deixar a União Europeia"
 FRA_no_more_eu_desc: "A União Europeia encarna tudo contra o que lutamos: liberalismo desenfreado, idealismo repugnante, ingenuidade desastrosa e corrupção generalizada. O único objetivo dessa organização é desmantelar nossas nações e nossas culturas. Não temos, portanto, motivo algum para permanecer nessa união. Devemos sair antes que seja tarde demais, quaisquer que sejam as consequências."
 FRA_eu_kingdom: "As Monarquias Caídas"
 FRA_eu_kingdom_desc: "Há alguns séculos, a Europa era um continente de monarquias. A ordem internacional da época era, em certo sentido, moldada pelo equilíbrio de poder e pelas alianças. Mas esses dias ficaram para trás. O nacionalismo varreu as monarquias ou as reduziu à condição de atrações turísticas. O melhor que podemos fazer para encontrar aliados, portanto, é ajudar os partidários do absolutismo na Europa a se erguerem contra seus opressores republicanos."
 FRA_king_modern_chivalry: "Cavalaria Moderna"
 FRA_king_modern_chivalry_desc: "O Reino da França sempre foi renomado por sua cavalaria e pelo papel decisivo que ela desempenhou nas batalhas que travou. Hoje, a cavalaria se parece com um monstro de aço de 60 toneladas. Ainda assim, seu papel continua decisivo. Nossas forças armadas fariam bem em se concentrar no uso extensivo da cavalaria blindada."
 FRA_no_deceit: "Fim da Decadência"
 FRA_no_deceit_desc: "Nosso principal inimigo é a decadência que a República instilou em nossa sociedade: cidadãos que se desviaram da ordem moral e esperam que o Estado pague por tudo. Devemos trazê-los de volta à realidade. A era da República acabou. Nosso Reino quer cidadãos virtuosos."
 FRA_frankish_ancestor: "Nossos Ancestrais, os Francos"
 FRA_frankish_ancestor_desc: "Nós, franceses, descendemos dos Francos; esse é o nosso povo e a nossa identidade. Os republicanos quiseram erradicar a monarquia e os Francos, mas ninguém consegue apagar uma civilização e uma cultura por dentro. É a nossa herança, e cabe a nós reivindicá-la de volta."
 FRA_against_liberalism: "Contra o Liberalismo e o Socialismo"
 FRA_against_liberalism_desc: "A República levou nossos cidadãos a acreditar que precisam de mais liberdades e direitos. Nosso Reino pretende corrigir esses erros. Acima de tudo, nossos cidadãos precisam redescobrir o caminho da ordem moral e da unidade da nação em torno de seu rei. Todo o resto é secundário."
 FRA_historical_ennemy: "O Inimigo Eterno"
 FRA_historical_ennemy_desc: "Se há um adversário com quem nos chocamos ao longo dos séculos, é sem dúvida o Reino Unido. Ele também é uma monarquia, embora o monarca hoje não detenha poder real. Certamente nos encontraremos diante deles mais cedo ou mais tarde. Mas, sejam eles ou outros, nossa marinha deve estar preparada para combater potências marítimas."
 FRA_friend_pope: "Proteger o Papado"
 FRA_friend_pope_desc: "Como filha primogênita da Igreja, a França tem o dever de proteger o papado de todos que possam tentar atacá-lo."
 FRA_army_of_elites: "Uma Força de Elite"
 FRA_army_of_elites_desc: "Foi a Revolução que introduziu o conceito de conscrição. Vimos durante as duas últimas guerras mundiais que essa nem sempre foi a melhor das ideias. Soldados que nem sempre eram bem treinados foram enviados à morte. Essas decisões dizimaram a população francesa no século passado. Devemos garantir que nosso exército continue profissional, endurecendo os critérios de recrutamento. Isso também evitará que acabemos com encrenqueiros em nossas fileiras."
 FRA_positive_inequality: "Desigualdade Positiva"
 FRA_positive_inequality_desc: "Nem tudo precisa ser igualitário. A ideia de que todos devemos ser iguais é mais uma invenção da Revolução. Alguns nasceram para liderar, enquanto outros nasceram para seguir. Os franceses precisam perceber isso, pois passar o tempo reclamando do sucesso alheio reduz a eficiência de todos."
 FRA_destroy_republicanism: "Destruir o Republicanismo"
 FRA_destroy_republicanism_desc: "O absolutismo retornou ao nosso Reino. Não há mais razão para perpetuar essa ilusão de democracia que é a política. O único partido que tem direito de existir é o do Rei. Os franceses devem entender que o Estado sou eu!"
 FRA_catholic_league: "Fundar a Liga Católica"
 FRA_catholic_league_desc: "Nossa reaproximação com a Igreja não deixou todos indiferentes. Alguns países demonstraram apoio a nós. Talvez possamos estender nossa cruzada a outras potências católicas. Afinal, elas também têm o direito de lutar para reconquistar a Terra Santa."
 FRA_burry_revolution: "Enterrar a Revolução"
 FRA_burry_revolution_desc: "O povo francês finalmente percebeu que a Revolução não trouxe nada além de miséria e que a primazia da monarquia francesa era a ordem natural das coisas. Nossas instituições também foram purgadas de elementos revolucionários. Podemos, portanto, dizer que viramos com sucesso a página dessa maldita Revolução."
 FRA_elder_daughter: "A Filha Primogênita da Igreja"
 FRA_elder_daughter_desc: "A França recuperou seu lugar na ordem mundial. Seremos, como há muito fomos, os defensores da Cristandade, e reconquistaremos a Terra Santa, como já fizemos tantas vezes."
 FRA_republican_cancer: "O Câncer Republicano"
 FRA_republican_cancer_desc: "Nosso país conseguiu livrar-se do republicanismo, mas somos praticamente os únicos na Europa que não estão mais sob o seu domínio. É evidente que, se formos derrotados em batalha, nossos adversários nos mergulharão de volta no pesadelo republicano. Devemos destruir a ameaça republicana onde quer que ela se encontre. Só assim estaremos seguros."
 France_news.100.t1: "Bandeiras Vermelhas sobre o Eliseu"
 France_news.100.d1: "A televisão estatal francesa saiu do ar antes do amanhecer. Quando voltou, o estúdio estava tomado por homens em trajes militares lendo um comunicado de um órgão que se autodenomina Comitê de Salvação Pública. Blindados cercam o Eliseu e a Assembleia Nacional, e nenhum ministro da Quinta República foi visto desde a meia-noite. Bruxelas convocou uma sessão de emergência e Washington ordenou que o pessoal de sua embaixada permaneça abrigado."
 France_news.100.t2: "Paris Cai nas Mãos dos Tradicionalistas"
 France_news.100.d2: "Unidades da Gendarmaria leais às redes tradicionalistas avançaram sobre o bairro do governo durante a noite e não encontraram resistência de um comando do exército que claramente havia sido instruído a ficar de lado. Pela manhã, a bandeira tricolor sobre o Eliseu tremulava ao lado de estandartes que nenhum governo francês tolerava desde 1944. As instituições da República estão suspensas até aquilo que os conspiradores chamam de restauração nacional."
 France_news.100.a: "A Quinta República acabou."
 France_news.100.b: "A Europa não pode permitir isso."
 France_news.100.c: "A França enterrou mais uma república."
 France_news.101.t: "France Goes to the Polls"
 France_news.101.d: "As seções eleitorais abriram em toda a França nesta manhã para o primeiro turno da eleição presidencial. A participação deve ser lamentável: uma esquerda dividida em quatro, uma direita dividida entre os Republicanos e os soberanistas, e uma Frente Nacional que os comentaristas passaram toda a campanha se recusando a discutir. O segundo turno é daqui a quinze dias, e, pela primeira vez, ninguém em Paris se atreve a dizer quem chegará a ele."
 France_news.101.a: "O segundo turno é nosso para perder."
 France_news.101.b: "Paris merece atenção."
 France_news.102.t1: "Células Revolucionárias Capturadas"
 France_news.102.d1: "Operações coordenadas da DGSI e do GIGN desmantelaram as redes radicais antes do amanhecer. Líderes de células foram tirados de seus apartamentos em Saint-Denis e Villeurbanne, depósitos de armas foram apreendidos em três departamentos, e o aparato partidário que eles passaram dois anos infiltrando foi expurgado. O governo insiste que a República nunca esteve em perigo. Os mandados de prisão dizem o contrário."
 France_news.102.t2: "Conspiração Restauracionista Desmantelada"
 France_news.102.d2: "Operações coordenadas da DGSI e do GIGN desmantelaram as redes tradicionalistas antes do amanhecer. Organizadores da Action Française foram retirados de suas casas, depósitos de armas foram apreendidos em três departamentos, e os oficiais que haviam prometido aos conspiradores o silêncio do exército agora enfrentam um tribunal militar. A Quinta República sobreviveu ao seu maior sufoco em quarenta anos."
 France_news.102.a: "A República resiste."
 France_news.102.b: "Um alívio e um alerta."
 france_md.20.t: "A situação do partido centrista"
 france_md.20.d: "Originalmente um partido de centro-direita, a UDF se firmou como partido centrista, e no passado conseguimos governar sob o presidente Valérie Giscard d'Estaing. Desde então, porém, fomos relegados ao segundo plano, às vezes servindo durante coabitações, mas ofuscados pela Direita Republicana e pelo Partido Socialista. Mas o mundo está mudando, e a tendência neoliberal está ganhando terreno no Ocidente. Hoje, não somos muito grandes, mas não há dúvida de que um dia governaremos."
 france_md.20.a: "Sim, mal posso esperar!"
 france_md.21.t: "A situação da Direita Republicana"
 france_md.21.d: "Nosso partido é tão antigo quanto a república e governa desde 1995 sob o mandato de Jacques Chirac, mas ele já não tem o vento a favor. Após uma dissolução fracassada que o obrigou a aceitar um primeiro-ministro socialista, assistimos à ascensão de nossos rivais, sejam eles o Partido Socialista ou a Frente Nacional. Nosso país está, como sempre, em dificuldades financeiras e seus interesses são ameaçados por toda parte no exterior. Uma coisa é certa: teremos de lutar dentro e fora do país para afirmar o poder da França perante aqueles que possam duvidar dele."
 france_md.21.a: "Mãos à obra"
 france_md.22.t: "A situação do RPF"
 france_md.22.d: "Fundado em 1999, o Rassemblement Pour la France (RPF) é um partido soberanista de direita. Criado por Charles Pasqua, é fortemente contrário à União Europeia, contra a qual trabalhou duro. Nossa influência é pequena por ora, mas a roda está girando: a União Europeia não agrada a todos, e estamos acolhendo cada vez mais dissidentes de outros partidos, desiludidos que não encontram em outros lugares a vontade de implementar o Frexit. Somos, claro, o partido mais gaullista que existe, e como esta república foi fundada por De Gaulle, não temos outro lugar nela senão Matignon!"
 france_md.22.a: "Viva o General de Gaulle, viva a França!"
 france_md.23.t: "A situação da Frente Nacional"
 france_md.23.d: "Fundada em 1972 por Jean-Marie Le Pen, a Frente Nacional é um partido de extrema direita. Desde a nossa criação, não fomos considerados um partido sério, pois todo o cenário político estava contra nós por nos opormos à imigração. A situação mudou desde então, e outros partidos começam a perceber que sua atitude levou ao caos em nosso país. Somos os precursores do que se tornará uma tendência geral contra a imigração. Mas ainda somos tratados como intocáveis e rotulados de extremistas, então devemos trabalhar para tornar nosso partido aceitável para a assembleia e para o eleitorado."
 france_md.23.a: "Vamos chegar lá!"
 france_md.24.t: "A situação do Partido Socialista"
 france_md.24.d: "Rival histórico da Direita Republicana, nosso partido tem idade canônica. A Direita Republicana está agora em dificuldades, tendo sido forçada à coabitação. Temos uma base eleitoral sólida na maioria das classes da população, e nossa vitória nas urnas é inevitável. Defendemos uma abordagem mais liberal do que a de nossos antecessores, para nos adaptarmos à Europa que estamos construindo. No entanto, nosso partido enfrenta divisões internas: uma ala direita ansiosa pelo centro liberal e uma ala esquerda sob risco de se radicalizar. Não há dúvida de que venceremos, mas, uma vez no topo, andaremos em ovos."
 france_md.24.a: "Tudo ficará bem."
 france_md.25.t: "A situação da França Insubmissa"
 france_md.25.d: "O Partido Socialista não conseguiu levar os ideais de esquerda ao poder, dilacerado entre suas duas tendências. Nosso partido, La France Insoumise, é a única verdadeira oposição de esquerda à ordem neoliberal. Foi buscando compromisso indiscriminadamente que o Partido Socialista se enterrou, então basearemos nossa retórica no protesto, mesmo ao custo de uma reação da mídia. Nosso principal projeto é construir uma nova república, pondo fim à monarquia presidencial que suportamos por tempo demais. Nosso partido tem feito sucesso entre os jovens, mas não devemos nos contentar se quisermos governar um dia."
 france_md.25.a: "Outro mundo é possível."
 france_md.26.t: "A situação dos Verdes"
 france_md.26.d: "O partido ecologista na França existe desde 1984, mas não teve o sucesso que esperávamos. Nunca somos levados a sério, e nossa base eleitoral é quase impossível de encontrar fora dos centros urbanos. Se quisermos deixar nossa marca, teremos de trabalhar com outros partidos e nos adaptar às suas visões. Mas, dado o estado do planeta, nossa presença em Matignon acabará se mostrando lógica. Uma vez lá, nos empenharemos em transformar a forma como vivemos e produzimos, para garantir um futuro às próximas gerações. Os obstáculos são muitos, mas não faltam aliados em potencial."
 france_md.26.a: "O tempo está se esgotando."
 france_md.27.t: "A situação do Partido Comunista Francês"
 france_md.27.d: "O Partido Comunista Francês caiu junto com a URSS, à qual era solidamente ligado. Nunca é fácil se encontrar do lado perdedor. Nossa situação é mais que crítica: à medida que perdemos credibilidade, nossa base eleitoral operária está migrando para a extrema direita ou para a abstenção. Precisamos reverter essa tendência e encontrar novas formas de conquistá-los. Sem dúvida teremos de negociar com outros partidos por algum tempo, mas talvez, uma vez no comando, consigamos recuperar a confiança de nossos antigos eleitores e reconquistar nossa autonomia. Nosso partido tem uma longa história, e ela não pode parar agora."
 france_md.27.a: "Voltaremos."
 france_md.30.t: "O rumo da economia"
 france_md.30.d: "Chegou a hora de escolher nosso ministro das finanças. Nosso país precisa urgentemente de reformas, por isso encontramos 2 perfis que devem atender às nossas expectativas em matéria de finanças. O primeiro vem de dentro de nossas fileiras, um homem chamado Olivier Ferrand, que ao longo de sua carreira na economia se familiarizou com essa área. O segundo, um ex-inspetor de finanças, é novo na política e apoiou nossa campanha. Sua visão social-liberal da sociedade se parece com o que queremos nos tornar, e talvez sua presença em nosso governo nos dê a aprovação do bloco liberal."
 france_md.30.a: "Renovação no movimento! Nomeie Emmanuel Macron para Bercy imediatamente!"
 france_md.30.b: "Não, é melhor colocarmos alguém em quem realmente confiamos. Nomeie Olivier Ferrand."
 france_md.150.t: "Ajuda adicional da França"
 france_md.150.d: "O governo francês ofereceu nos dar ajuda extra na crise financeira que atravessamos desde que entramos na União Europeia. Devemos aceitar?"
 france_md.150.a: "Claro que precisamos do dinheiro!"
 france_md.150.b: "Não, não precisamos."
 france_md.151.t: "A França propõe uma reunião internacional"
 france_md.151.d: "O Partido Socialista Francês decidiu organizar uma reunião de líderes socialistas do mundo todo e pensou em nos convidar. Poderíamos aproveitar para ganhar legitimidade. Devemos ir ou recusar educadamente?"
 france_md.151.a: "Estaremos lá!"
 france_md.151.b: "Não, tenho coisas melhores a fazer."
 france_md.160.t: "Colapso do Partido Socialista"
 france_md.160.d: "Após um ano de instabilidade e divisão dentro do Partido Socialista, ele foi reduzido a quase nada. É um momento histórico, mas é uma pena ver o fim de um partido que desempenhou um papel tão central na história da França. Para quem herdar o cargo de primeiro secretário, a tarefa será pesada."
 france_md.160.a: "Erros foram cometidos"
 france_md.161.t: "A sangria continua"
 france_md.161.d: "Grande parte de nossos membros e apoiadores está se desvinculando de nosso grupo. É claro que, se quisermos evitar a queda, teremos de usar todas as alavancas à nossa disposição para manter o apoio de políticos e do público."
 france_md.161.a: "Não há um minuto a perder!"
 france_md.162.t: "Nosso partido está sob ameaça"
 france_md.162.d: "As muitas reformas impopulares que realizamos, apesar da desaprovação geral, nos renderam a ira da população, que se pergunta se fez a coisa certa ao votar em nós. Além disso, nossas numerosas alianças com o centro liberal, que tentamos imitar, causaram muitas fissuras dentro do partido. Nossa ala esquerda, decepcionada com nossas escolhas, ameaça cair nos braços da esquerda radical, enquanto nossa ala direita nos acha moles demais em comparação com os candidatos liberais, a quem às vezes ajudamos a contragosto. Se ainda houver uma chance, teremos de trabalhar duro para alcançá-la."
 france_md.162.a: "Ah, droga."
 france_md.163.t: "Quem É o Culpado?"
 france_md.163.d: "Após o nosso colapso, alguns de nossos eleitores migraram para os centristas, outros para formações mais à esquerda que defendem seu 'radicalismo' chamando-se de esquerda da 'ruptura', uma postura que atrai pesadas críticas da mídia e une a oposição contra eles. Qualquer que seja a ala que escolhermos enfrentar agora, isso decidirá se nossos antigos eleitores algum dia voltarão para nós."
 france_md.163.a: "Extremistas de qualquer tipo ameaçam nossa sociedade"
 france_md.163.b: "Isso não é nada comparado ao perigo que o extremo centro representa"
 france_md.164.t: "A França Propõe Exercícios Militares Conjuntos"
 france_md.164.d: "Diplomatas franceses nos enviaram uma proposta de treinamento militar conjunto. De fato, o recente aumento das tensões internacionais nos incentiva a nos unir entre os Estados europeus para nos preparar para o pior. Pode ser uma excelente iniciativa para treinar nossas forças armadas para os conflitos de alta intensidade que podem eclodir a qualquer momento. O que devemos dizer a eles?"
 france_md.164.a: "Com prazer, treinaremos ao lado deles"
 france_md.164.b: "Não, obrigado, não precisamos da ajuda deles"
 france_md.165.t: "A Tempestade Chega"
 france_md.165.d: "Vários especialistas em diferentes áreas nos sugerem há algum tempo que estabeleçamos medidas regulatórias para o caso de uma crise econômica ocorrer em qualquer lugar da Terra. Não seria a primeira nem a última, mas essas medidas nos permitiriam manter distância das complicações que acompanham tais crises. No entanto, isso significaria regular o setor econômico e pagar muitos especialistas para supervisionar as operações. Realmente queremos fazer isso? Nossos parceiros financeiros podem levar a mal."
 france_md.165.a: "A situação é de fato muito preocupante; devemos estabelecer medidas regulatórias com urgência"
 france_md.165.b: "São apenas suposições que parecem ruins para os negócios"
 france_md.170.t: "A França oferece reparações de guerra"
 france_md.170.d: "O governo francês decidiu nos compensar pela mortífera guerra da Indochina que ocorreu em nosso solo durante 7 anos. Esse dinheiro nunca substituirá as vidas dos 500.000 vietnamitas que morreram pela independência, mas é um gesto honroso que não deve ser recusado."
 france_md.170.a: "Agora esperamos pelos americanos"
 france_md.171.t: "A França oferece reparações de guerra"
 france_md.171.d: "O governo francês parece enfim ter concordado em reconhecer alguns dos crimes cometidos em nosso país e oferece indenização pela guerra de independência. Esse dinheiro não substituirá as vidas dos 600.000 argelinos que morreram pela liberdade, mas, já que pela primeira vez um ocidental reconhece seus crimes, seria tolice recusar."
 france_md.171.a: "Na hora certa."
 france_md.172.t: "A França Propõe Sua Expertise Nuclear"
 france_md.172.d: "A Presidência francesa propôs compartilhar conosco sua expertise nuclear por uma modesta quantia em dinheiro. Isso poderia ser bastante útil para dominar esse átomo instável e aproveitá-lo da melhor forma. Se aceitarmos, poderá nos ajudar muito a iluminar nosso povo e facilitar a pesquisa nessa área. No entanto, talvez pudéssemos usar esse dinheiro para algo melhor do que dar à França um lugar que ela não merece em nosso país."
 france_md.172.a: "Um acordo em Urânio 235"
 france_md.172.b: "Não, guardem suas bombas-relógio para vocês"
 france_md.173.t: "A França Propõe Sua Proteção"
 france_md.173.d: "Diante de um mundo que explode em múltiplas crises, a França decidiu garantir a proteção de seus aliados europeus. De fato, a Presidência francesa nos assegurou esta manhã que, em caso de agressão por uma potência europeia estrangeira, não hesitaria em intervir, chegando a invocar o uso de armas nucleares. Embora essa proteção seja em si uma perda de soberania, pode se mostrar crucial em tempos como estes."
 france_md.173.a: "Nunca é demais ter cautela"
 france_md.173.b: "Não precisamos da proteção deles"
 france_md.175.t: "A União Europeia Nos Impõe Sanções"
 france_md.175.d: "Em decorrência de nossas recentes posições e de nosso desejo de nos retirar dos tratados que nos vinculam aos Estados-membros, esses malditos burocratas europeus nos impuseram uma multa. No entanto, nada nos obriga a pagá-la; nossos eleitores, que anseiam por mudança, até veriam isso como sinal de fraqueza ou traição. Contudo, recusar-se a pagar poderia prejudicar nossas relações com os Estados-membros europeus e desencadear sanções contra nós. Devemos ir até o fim?"
 france_md.175.a: "Pagaremos a multa porque jogamos pelas regras; é seguindo as regras que venceremos"
 france_md.175.b: "E o que mais? Já fomos sangrados o bastante"
 france_md.180.t: "Uma Votação Histórica"
 france_md.180.d: "O povo falou. Após longas campanhas pelo Frexit e depois de escapar das armadilhas desses malditos europeístas, bem como das desses vis populistas que tentaram se apropriar de nossos sucessos, conseguimos. A França está deixando a Europa o mais rápido possível. Obviamente, essas serpentes de Bruxelas não deixarão de nos fazer pagar o máximo que puderem, mas essas sanções não são nada comparadas à liberdade que reconquistamos."
 france_md.180.a: "Agora e para sempre, a França é livre"
 france_md.181.t: "A França Deixa a União Europeia"
 france_md.181.d: "Após inúmeras campanhas de desinformação eurocética, o movimento nacionalista francês finalmente conseguiu inclinar a França ao Frexit. A saída da França é apenas uma questão de tempo; ainda assim, é bastante grave ver um membro tão fundador e estruturante da UE partir tão rápido."
 france_md.181.a: "Devemos ter cautela diante do populismo"
 france_md.182.t: "A França Reconhece Nossas Reivindicações"
 france_md.182.d: "O governo francês anunciou recentemente que apoia nossa posição sobre os diversos territórios historicamente nossos que nos foram tomados. Eles também propuseram o início de uma cooperação militar entre nossas duas nações; por ora, trata-se apenas de instalações para acesso à nossa infraestrutura militar. Esse súbito apoio francês é bem-vindo, mas devemos realmente permitir que se beneficiem de nossa infraestrutura?"
 france_md.182.a: "Claro, eles nos apoiam; são bem-vindos"
 france_md.182.b: "Nunca pedimos a ajuda deles; que mantenham distância"
 france_md.183.t: "A França Propõe Aprofundar Nossa Cooperação"
 france_md.183.d: "Depois de assumir inúmeras posições a nosso favor e anunciar uma clara rejeição à OTAN, Paris propôs aprofundarmos nossa cooperação, desde laços econômicos até uma aliança militar plena contra nossos inimigos comuns. Podemos realmente confiar em ocidentais que abandonaram tão depressa seus antigos aliados?"
 france_md.183.a: "Levarei três caixas desse perfume; negócio fechado"
 france_md.183.b: "Preferem as dunas do Sahel ou nossas estepes congeladas para o treinamento? Nossos exércitos só sairão mais fortes"
 france_md.183.c: "Eles podem ficar sozinhos"
 france_md.184.t: "Moscou Aceita a Cooperação Econômica"
 france_md.184.d: "A resposta de Moscou não demorou; nossas economias podem se beneficiar deste acordo. Além de nos abrir um mercado considerável para nossos produtos de luxo e de alta tecnologia, nossas indústrias carentes de matérias-primas se sentirão mais seguras. Este acordo histórico é uma dádiva para nós e um prego no caixão da União Europeia. Nós, que a criamos, agora comerciamos com seu pior inimigo."
 france_md.184.a: "Que o champanhe e o petróleo fluam"
 france_md.185.t: "Moscou Aceita a Cooperação Econômica e Militar"
 france_md.185.d: "A resposta de Moscou não demorou; nossas economias e exércitos podem se beneficiar deste acordo. Além de nos abrir um mercado considerável para nossos produtos de luxo e de alta tecnologia, nossas indústrias carentes de matérias-primas se sentirão mais seguras. Além disso, a cooperação reforçada entre nossas forças armadas nos permitirá ganhar experiência em novos teatros e aproveitar seus avanços tecnológicos e estratégicos. Este acordo histórico é uma dádiva para nós e um prego no caixão da OTAN. Agora temos um parceiro confiável para navegar neste novo milênio."
 france_md.185.a: "Voltaremos a nos encontrar no Sahel, mas desta vez não para lutar uns contra os outros"
 france_md.187.t: "Os Russos Rompem as Negociações"
 france_md.187.d: "Apesar de todos os esforços de nossos diplomatas, eles não conseguiram chegar a um acordo com seus homólogos russos. Como se não houvesse vontade de fazer negócios conosco. É lamentável; o potencial de um acordo bilateral teria sido inestimável para nossos dois países. Também não é impossível que tenha havido pressão de nossos antigos amigos ocidentais para nos manter sob seu jugo. Mas não é grave; encontraremos outros parceiros."
 france_md.187.a: "O câncer americano chegou, portanto, aos Urais; melhor sozinho do que mal acompanhado"
 france_md.188.t: "A França Exige Concessões"
 france_md.188.d: "Após a vitória do populismo na França e sua saída da União Europeia, ela continuou a demonstrar hostilidade contra nós. As sanções econômicas que lhe foram impostas após a saída não a deixaram ilesa; agora ela terminou de se recuperar e exige reparação. Hoje, diplomatas chegaram ameaçando cortar o acesso ao território nacional deles se não influenciarmos o Banco Europeu a reduzir os juros da dívida deles. As consequências dessa perda de acesso ao território deles poderiam complicar muito as trocas dentro da União Europeia. Contudo, ceder à chantagem deles nos obrigaria a usar nossas vantagens para o mal."
 france_md.188.a: "Malditos sejam; sofreremos o menor dano"
 france_md.188.b: "Não cederemos à chantagem de alguns populistas"
 france_md.189.t: "A Alemanha Cede às Nossas Concessões"
 france_md.189.d: "Após a pressão que exercemos sobre eles, o governo alemão concordou, relutante, em pressionar o BCE a reduzir nossas taxas de juros. É uma formidável vingança contra nossos antigos algozes. Esses alemães podem continuar a desfrutar de nossas rotatórias, mas graças a eles comemos às custas de Bruxelas."
 france_md.189.a: "Olho por olho, dente por dente, em latim se possível"
 france_md.190.t: "A Alemanha Recusa Nossas Exigências"
 france_md.190.d: "Nossos diplomatas voltaram de Berlim de mãos vazias, desprezados por nossos primos alemães. Talvez nossas exigências tenham sido altas demais ou eles pretendam procurar em outro lugar que não conosco. Não teremos nossa vingança contra a União Europeia hoje, mas ela não pode esperar."
 france_md.190.a: "Continuamos livres e eles não; fechem as fronteiras a leste"
 france_md.191.t: "A França Exige Concessões"
 france_md.191.d: "Após a vitória do populismo na França e sua saída da União Europeia, ela continuou a demonstrar hostilidade contra nós. As sanções econômicas que lhe foram impostas após a saída não a deixaram ilesa; agora ela terminou de se recuperar e exige reparação. Hoje, diplomatas chegaram ameaçando cortar o acesso ao território nacional deles se não substituirmos sua polícia marítima e costeira em operações de detenção de migrantes. As consequências dessa perda de acesso ao território deles poderiam complicar muito as trocas dentro da União Europeia. Contudo, ceder à chantagem deles nos obrigaria a usar nossas vantagens para o mal."
 france_md.191.a: "Malditos sejam; sofreremos o menor dano"
 france_md.191.b: "Não cederemos à chantagem de alguns populistas"
 france_md.192.t: "A Itália Cede às Nossas Concessões"
 france_md.192.d: "Após a pressão que exercemos sobre eles, o governo italiano concordou, relutante, em substituir nossa polícia em nossas fronteiras marítimas. É uma formidável vingança contra nossos antigos algozes. Esses italianos ficarão encantados em desfrutar do fluxo de migrantes, mas graças a eles comemos às custas de Bruxelas."
 france_md.192.a: "Olho por olho, dente por dente, em latim se possível"
 france_md.193.t: "A Itália Recusa Nossas Exigências"
 france_md.193.d: "Nossos diplomatas voltaram de Roma de mãos vazias, desprezados por nossos vizinhos latinos. Talvez nossas exigências tenham sido altas demais ou eles pretendam procurar em outro lugar que não conosco. Não teremos nossa vingança contra a União Europeia hoje, mas ela não pode esperar."
 france_md.193.a: "Continuamos livres e eles não; fechem as fronteiras a sudeste"
 france_md.194.t: "A França Exige Concessões"
 france_md.194.d: "Após a vitória do populismo na França e sua saída da União Europeia, ela continuou a demonstrar hostilidade contra nós. As sanções econômicas que lhe foram impostas após a saída não a deixaram ilesa; agora ela terminou de se recuperar e exige reparação. Hoje, diplomatas chegaram ameaçando cortar o acesso ao território nacional deles se não usarmos para os fins deles as instituições que abrigamos. Eles nos pedem para influenciar as decisões das instituições europeias e de seus serviços de espionagem. As consequências dessa perda de acesso ao território deles poderiam complicar muito as trocas dentro da União Europeia. Contudo, ceder à chantagem deles nos obrigaria a usar nossas vantagens para o mal."
 france_md.194.a: "Malditos sejam; sofreremos o menor dano"
 france_md.194.b: "Não cederemos à chantagem de alguns populistas"
 france_md.195.t: "A Bélgica Cede às Nossas Concessões"
 france_md.195.d: "Após a pressão que exercemos sobre eles, o governo belga concordou em pressionar as instituições europeias a nosso favor. É uma formidável vingança contra nossos antigos algozes. Esses belgas ficarão encantados em fazer hora extra no parlamento, e graças a eles comemos às custas de Bruxelas."
 france_md.195.a: "Olho por olho, dente por dente, em latim se possível"
 france_md.196.t: "A Bélgica Recusa Nossas Exigências"
 france_md.196.d: "Nossos diplomatas voltaram de Bruxelas de mãos vazias, desprezados por nossos irmãos valões e flamengos. Talvez nossas exigências tenham sido altas demais ou eles pretendam procurar em outro lugar que não conosco. Não teremos nossa vingança contra a União Europeia hoje, mas ela não pode esperar."
 france_md.196.a: "Continuamos livres e eles não; fechem as fronteiras ao norte"
 france_md.197.t: "A França Exige Concessões"
 france_md.197.d: "Após sua saída da União Europeia e a recuperação das sanções resultantes, a França continua a demonstrar hostilidade contra nós. Hoje seus diplomatas chegaram ameaçando cortar o acesso ao território francês a menos que entreguemos um registro detalhado das contas bancárias mantidas em nosso território, uma grave violação do sigilo bancário que nos esforçamos para preservar. Perder esse acesso complicaria nosso comércio em toda a União, mas ceder nos torna cúmplices da chantagem deles."
 france_md.197.a: "Malditos sejam; sofreremos o menor dano"
 france_md.197.b: "Não cederemos à chantagem de alguns populistas"
 france_md.198.t: "Luxemburgo Cede às Nossas Concessões"
 france_md.198.d: "Após a pressão que exercemos sobre eles, o governo luxemburguês concordou em pressionar seus serviços bancários a nos fornecer um registro detalhado das contas que mantêm. Encontramos muitos traidores tentando fugir de seu dever, mas também informações sobre muitas empresas privadas residentes em nosso território nacional. Essas descobertas ajudarão os esforços da autoridade fiscal para perseguir maus patriotas e fazer pagar as empresas que tentaram nos enganar em nosso país. Os luxemburgueses podem ter perdido muito de sua credibilidade bancária, mas graças a eles comemos às custas de Bruxelas e à custa do seu maldito livre comércio."
 france_md.198.a: "Olho por olho, dente por dente, em latim se possível"
 france_md.199.t: "Luxemburgo Recusa Nossas Exigências"
 france_md.199.d: "Nossos diplomatas voltaram de Luxemburgo de mãos vazias, desprezados por nossos vizinhos milionários. Talvez nossas exigências tenham sido altas demais ou eles pretendam procurar em outro lugar que não conosco. Não teremos nossa vingança contra a União Europeia hoje, mas ela não pode esperar."
 france_md.199.a: "Continuamos livres e eles não; fechem as fronteiras a nordeste"
 france_md.200.t: "A França Exige Concessões"
 france_md.200.d: "Após sua saída da União Europeia e a recuperação das sanções resultantes, a França continua a demonstrar hostilidade contra nós. Hoje seus diplomatas chegaram ameaçando cortar o acesso ao território francês a menos que socorramos seu setor agrícola, que desenvolve no sul um projeto de cítricos que compete diretamente com o nosso. Perder esse acesso complicaria nosso comércio em toda a União, mas ceder nos torna cúmplices da chantagem deles."
 france_md.200.a: "Malditos sejam; sofreremos o menor dano"
 france_md.200.b: "Não cederemos à chantagem de alguns populistas"
 france_md.201.t: "A Espanha Cede às Nossas Concessões"
 france_md.201.d: "Após a pressão que exercemos sobre eles, o governo espanhol concordou em nos fornecer assistência técnica e comercial para a produção e venda de nossa nova linha de cítricos, que inundará os mercados francês e espanhol. Talvez os espanhóis agora só tenham os próprios dedos para morder, mas graças a eles comemos às custas de Bruxelas e demonstramos nossa hegemonia alimentar sobre o continente."
 france_md.201.a: "Olho por olho, dente por dente, em latim se possível"
 france_md.202.t: "A Espanha Recusa Nossas Exigências"
 france_md.202.d: "Nossos diplomatas voltaram de Madri de mãos vazias, desprezados por nossos vizinhos ibéricos. Talvez nossas exigências tenham sido altas demais ou eles pretendam procurar em outro lugar que não conosco. Não teremos nossa vingança contra a União Europeia hoje, mas ela não pode esperar."
 france_md.202.a: "Continuamos livres e eles não; fechem as fronteiras a sudoeste"
 france_md.203.t: "O Fim da Jornada"
 france_md.203.d: "Após meses de diálogo e disputa sobre seu conteúdo, o texto da reforma constitucional está finalmente pronto para ser votado. Nossos opositores políticos podem ter usado o processo de redação para incluir cláusulas que servem a seus próprios ideais, mas negar ao povo uma votação depois de um processo tão longo o faria se sentir, com razão, traído. Convocar o referendo é uma decisão só nossa, nos termos do artigo 11 da constituição, e só nós responderemos pelas consequências."
 france_md.203.a: "É hora de acabar com isso; convoco um referendo"
 france_md.203.b: "Este texto é perigoso demais e não deve ser votado"
 france_md.204.t: "O Texto É Aprovado"
 france_md.204.d: "Hoje é um dia histórico; pela primeira vez todo o povo participa da elaboração de sua constituição. O resultado da votação não surpreende, uma vitória esmagadora do sim; claro, quando se dá a um francês o direito de decidir seus próprios direitos, ele não se priva deles. Este texto talvez não seja perfeito, mas reflete uma nova era que começa hoje, e fizemos o possível para que ele defenda os direitos de nossos cidadãos e impeça o povo de sucumbir ao canto das sereias de nossos adversários políticos. Aqui termina a Quinta República e, com este Sim franco e massivo, começa a Sexta República."
 france_md.204.a: "O dia de glória chegou"
 france_md.205.t: "O Texto É Amplamente Rejeitado"
 france_md.205.d: "Contra todas as expectativas, a reforma constitucional que planejamos por meses foi rejeitada nas urnas. Talvez nosso envolvimento na condução dos debates tenha feito as pessoas pensarem que tentávamos manipulá-las, ou talvez nossos cidadãos quisessem mudança, mas nunca concordaram sobre a forma que ela deveria tomar. Nem tudo está perdido: ainda podemos perseguir nossa visão para a república uma lei de cada vez, mas a reforma abrangente que esperávamos terá de esperar."
 france_md.205.a: "Completamente incompreensível"
 france_md.206.t: "Debate sobre as Instituições, Parte 1"
 france_md.206.d: "A questão das instituições divide a França desde a fundação da Quinta República em 1958, quando o poder presidencial substituiu a instabilidade da Quarta República. Esse poder agora é visto como excessivo, permitindo que um presidente mal-intencionado bloqueie o progresso com poucos controles, enquanto a Assembleia Nacional, mais representativa, detém pouca autoridade exclusiva. Renovar essa constituição ultrapassada está agora na mesa, e até onde formos definirá se o poder volta a pender para o parlamento ou permanece com a presidência."
 france_md.206.a: "É bastante prático não estar constantemente sob ameaça da assembleia"
 france_md.206.b: "Abaixo a república presidencial, o Presidente vai inaugurar os crisântemos"
 france_md.206.c: "Vamos nos concentrar apenas em promover a participação ativa dos cidadãos"
 france_md.207.t: "O Triunfo do Compromisso"
 france_md.207.d: "Após dias de deliberação, os cidadãos parecem ter chegado a um acordo em torno de um reequilíbrio de poderes. O artigo 49.3 foi naturalmente o primeiro alvo da ira popular. Os poderes presidenciais saíram pouco afetados e o povo parece satisfeito com seu trabalho. Um golpe democrático agora parece menos provável; nossas instituições ganham em legitimidade e eficácia. Só podemos lamentar a leve decepção de nossos apoiadores mais devotados, a quem prometemos o fim da monarquia presidencial. Seja como for, o povo decidiu; podemos agora voltar nossa atenção aos próximos debates."
 france_md.207.a: "Muito bem, próxima questão! Meu gabinete saiu-se bem nisso."
 france_md.208.t: "O Fim da Ditadura Presidencial"
 france_md.208.d: "Os cidadãos finalmente chegaram a um acordo: a Quinta República acumulou ressentimento demais por decisões presidenciais abusivas, e não podemos mais arriscar que tanto poder repouse no capricho de um único homem. Os poderes do presidente agora se limitam aos de comandante-em-chefe e figura cerimonial no Palácio do Eliseu, enquanto a Assembleia Nacional volta a ser todo-poderosa. As reformas podem perder alguma estabilidade, mas avançarão com muito mais facilidade, e a confiança dos franceses em nossas instituições deve crescer por isso."
 france_md.208.a: "Que assim seja; que os debates continuem."
 france_md.209.t: "Debates sobre as Instituições, Parte 2:"
 france_md.209.d: "À medida que o debate institucional se encerra, uma questão divide nossos cidadãos: a supervisão dos serviços secretos que respondem ao presidente. Esses serviços há muito defendem os interesses franceses, mas excessos passados, incluindo os assassinatos de Auriol em 1981, e sua liberdade de agir fora da lei levantaram preocupações quanto à transparência. Maior abertura aumentaria a confiança em nossas instituições, mas nossa segurança em um mundo cada vez mais instável não pode ser tratada com leviandade."
 france_md.209.a: "A segurança de nossos cidadãos acima de tudo! Apenas garantiremos que sua privacidade não seja posta em risco em excesso."
 france_md.209.b: "O povo precisa de transparência! O povo precisa de justiça; o Estado deve prestar contas a seus cidadãos."
 france_md.209.c: "Este debate gera tensão demais; faríamos melhor em manter distância."
 france_md.210.t: "Os Serviços Secretos Saem Intactos"
 france_md.210.d: "Os cidadãos decidiram manter os serviços secretos sob controle do Executivo. De fato, especialmente nestes tempos, nossa defesa passiva deve estar na linha de frente para nos proteger de ações maliciosas vindas do exterior e do terrorismo. Esse resultado, no entanto, decepcionou nossos ativistas, que queriam mais transparência e democracia. Muitos de nossos cidadãos insistem em pensar que a defesa do país não deve custar sua privacidade em tempos de paz. Alguns também temem o uso indevido desses serviços por governos mal-intencionados para espionar a oposição ou impedir vazamentos para ela. Os eleitores decidiram e escolheram a segurança em vez da liberdade. É escolha deles, afinal."
 france_md.210.a: "Simplesmente não é o momento de baixar a guarda em um mundo onde a força se sobrepôs ao direito internacional."
 france_md.211.t: "A Cortina Se Ergue"
 france_md.211.d: "Após árduas negociações, finalmente decidimos acabar com a total opacidade de nossos serviços secretos. Muitos cidadãos não se sentiam mais seguros sabendo que estavam sob vigilância constante sem seu conhecimento, e nossas intervenções no exterior frequentemente geram polêmicas que eles prefeririam não descobrir pelo jornal. Essa nova transparência deve dar aos nossos cidadãos maior confiança em sua polícia e forças armadas, ainda que nos custe alguma segurança interna e influência externa."
 france_md.211.a: "Não precisamos de serviços secretos para nos proteger de interferência estrangeira."
 france_md.212.t: "Debate sobre os Direitos Pessoais, Parte 1:"
 france_md.212.d: "A questão dos direitos pessoais está no cerne do debate constitucional. Devemos fortalecer as liberdades individuais diante do Estado ou priorizar a segurança coletiva? As discussões giram em torno da proteção de dados pessoais, do direito à privacidade e dos limites da vigilância estatal. Os progressistas defendem uma ampliação dos direitos fundamentais, enquanto os conservadores temem um enfraquecimento da autoridade pública. Nossa posição sobre o assunto determinará em parte o rumo da nova constituição."
 france_md.212.a: "Defender firmemente as liberdades individuais."
 france_md.212.b: "A segurança coletiva deve ter prioridade."
 france_md.212.c: "Que o debate continue sem nós."
 france_md.213.t: "Vitória das Liberdades Individuais"
 france_md.213.d: "O debate terminou a favor do fortalecimento das liberdades individuais. A nova constituição garantirá maiores proteções contra a intrusão do Estado na vida privada dos cidadãos. Essa vitória dos progressistas marca um ponto de virada em nossa relação com a autoridade pública, mesmo que alguns se preocupem com as consequências para a segurança nacional."
 france_md.213.a: "Nossos cidadãos podem se alegrar com essas novas garantias."
 france_md.214.t: "A Segurança Prevalece"
 france_md.214.d: "Apesar dos esforços dos defensores da liberdade, a visão centrada na segurança venceu os debates constitucionais. O Estado manterá amplos poderes de vigilância e intervenção. Embora isso tranquilize parte da população, ativistas dos direitos civis denunciam um retrocesso democrático."
 france_md.214.a: "A estabilidade tem um preço."
 france_md.215.t: "Debate sobre os Direitos Pessoais, Parte 2:"
 france_md.215.d: "Nossa nação é conhecida por sua agitação e, qualquer que seja o resultado de uma eleição, o descontentamento acaba chegando às ruas. A questão da proteção dos cidadãos durante protestos está agora na pauta: excessos policiais de um lado, proteção insuficiente do outro, com muitos protestos terminando em feridos. Conter a polícia reconstruiria a confiança pública, mas acrescentaria custos, enquanto apoiá-la mantém a ordem, mas arrisca mais incidentes à medida que os movimentos se radicalizam."
 france_md.215.a: "Devemos regular nossas forças policiais."
 france_md.215.b: "Deixem que façam seu trabalho."
 france_md.215.c: "O povo decidirá; afinal, ele estará nas ruas protestando contra esta lei."
 france_md.216.t: "O Povo Escolhe Restringir a Polícia"
 france_md.216.d: "Após horas de debate, a maioria concordou que as forças policiais precisavam ser reguladas para evitar novos escândalos. As tecnologias de manutenção da ordem estão melhorando, e já somos uma nação muito eficaz nesse aspecto; não há necessidade de ir além. Além disso, evitar ferimentos físicos graves entre os manifestantes certamente reduzirá os gastos com saúde. O Estado também terá mais a prestar contas ao seu povo, já que este poderá protestar nas ruas com menos perigo. No entanto, devem-se esperar custos adicionais com a polícia, pois a eficácia da aplicação da lei será reduzida."
 france_md.216.a: "Assim nosso povo continuará nos mantendo na linha. Próxima questão!"
 france_md.217.t: "O Povo Escolhe a Ordem"
 france_md.217.d: "Mesmo não sendo o que teríamos preferido, a eficácia policial venceu. É verdade que alguns protestos degeneram e causam extensos danos materiais, por isso a supervisão externa é necessária dada a eficácia reduzida dos serviços de aplicação da lei. Enfrentamos crises orçamentárias e sociais sem precedentes; em algum momento, teremos de voltar parte do povo contra nós. Por isso, continua importante ser capaz de enfrentar qualquer movimento social que surja. Afinal, eles nos elegeram, não foi?"
 france_md.217.a: "O povo escolheu a segurança em vez do direito de nos cobrar; podemos culpá-lo? Próxima questão."
 france_md.218.t: "Debate sobre a Economia, Parte 1"
 france_md.218.d: "Embora a gestão da economia caiba a governos futuros, podemos consagrar agora na constituição fundamentos sociais, ecológicos ou econômicos, tornando inconstitucionais as leis que os violem. Priorizar a proteção social garante empregos e bem-estar, mas pode deixar a ecologia para trás e inquietar investidores com a dívida resultante. Priorizar a ecologia melhora a qualidade de vida e nos desloca para novas fontes de energia, mas deixa para trás parte das receitas e dos investimentos. Também poderíamos fingir apoio à economia para semear discórdia com outras facções, ou deixar a questão inteiramente para elas."
 france_md.218.a: "Apoio social primeiro! Devemos estar ao lado de nossos cidadãos."
 france_md.218.b: "O planeta se degrada rápido demais para ficarmos parados."
 france_md.218.c: "Boa ideia; faremos com que pensem que os liberais estão por trás disso."
 france_md.218.e: "Deixem os outros partidos se destroçarem por essa questão."
 france_md.219.t: "O Povo Escolhe Priorizar o Apoio Social"
 france_md.219.d: "Após longas horas de hesitação, os cidadãos finalmente concordaram sobre o pilar social da república. De fato, ao proteger as pessoas comuns e seus empregos, garantiremos uma transição saudável rumo a um futuro melhor. Além disso, é melhor que nossas fábricas sejam construídas segundo as normas e poluam aqui do que serem realocadas para países menos preocupados com isso. Esse resultado não é surpresa nem má notícia."
 france_md.219.a: "Mais uma questão à qual pudemos dar uma resposta; muito bem."
 france_md.220.t: "O Povo Escolhe a Ecologia"
 france_md.220.d: "Esse resultado não nos desagrada. De fato, a saúde do planeta reflete na saúde de seus habitantes. Não é surpreendente, e até benéfico, que esse despertar tenha ocorrido em vários níveis da sociedade. Assim, teremos de aprender a transformar nossos modos de vida e de produção de bens e energia. O caminho será repleto de obstáculos e nem sempre servirá aos interesses da maioria. Mas é o caminho que devemos seguir."
 france_md.220.a: "Resta apenas reciclar aqueles que votaram nas grandes empresas."
 france_md.221.t: "O Povo Escolhe a Economia"
 france_md.221.d: "Um resultado surpreendente, o dos debates de hoje. O povo escolheu proteger empresas de todo tipo para impulsionar o desenvolvimento do país. Vê-se que alguns ainda acreditam na teoria do gotejamento. Também se poderia ter imaginado que, com a mídia frequentemente nas mãos de poucos oligarcas, eles fariam de tudo para inclinar a balança. Um dia bastante decepcionante para nossos ativistas. Mas não podemos agora questionar a opinião do povo soberano."
 france_md.221.a: "Pedir a opinião do povo era mesmo uma boa ideia?"
 france_md.222.t: "Debate sobre a Economia, Parte 2"
 france_md.222.desc: "Outras questões sociais esperarão por repúblicas futuras, mas podemos definir agora o rumo constitucional: quem deve pagar por nossa excepcional, porém cara, cobertura social? O que quer que esta reforma decida agora, sobre tributação, financiamento orçamentário ou cortes de gastos, moldará a espinha dorsal financeira de nosso Estado de bem-estar por gerações."
 france_md.222.a: "Abaixo o capitalismo!"
 france_md.222.b: "O Estado financiará o sistema; faremos o possível para evitar novos impostos."
 france_md.222.c: "Não podemos arriscar deixar nossos cidadãos sem trabalho."
 france_md.222.d: "Seria melhor não nos envolvermos neste debate."
 france_md.223.t: "O Povo Escolhe Tributar o Capital"
 france_md.223.d: "Os longos debates das últimas semanas terminaram com nossa vitória neste confronto ideológico. Serão o capital e a renda dos mais ricos que financiarão a cobertura social da população. Este ato simbólico marca uma grande vitória do povo contra o grande capital. Uma vitória da França sobre as finanças é uma vitória de todo o povo unido contra seus antigos senhores. Nossos debates sobre economia estão encerrados por ora, mas preparamos o terreno para as gerações futuras. Assim, em poucas reformas, fizemos a revolução."
 france_md.223.a: "Uma grande vitória do povo francês."
 france_md.224.t: "O Povo Confirma o Papel do Estado"
 france_md.224.d: "O resultado dos debates da semana passada é claro: o povo não quer virar a economia de cabeça para baixo tal como está. Será por causa da propaganda neoliberal com que são bombardeados todos os dias na televisão? Provavelmente, mas devemos aceitar o veredito deles, pois é o único que importa. Ao menos conseguimos não incentivar cortes em outros serviços do Estado para financiar este, mas é possível que nossos sucessores sejam menos benevolentes com a sociedade para financiar nosso sistema. Garantiremos que isso não aconteça."
 france_md.224.a: "Não é bem a vitória que esperávamos, mas teremos de nos contentar."
 france_md.225.t: "O Povo Escolhe Cortar em Outro Lugar"
 france_md.225.d: "Se soubéssemos que o veredito seria este, talvez não tivéssemos levado esse debate às urnas, mas é tarde demais para pensar nisso. De fato, o povo acaba de decidir o destino de nosso sistema social. Recomendou que as legislaturas futuras preservem os serviços essenciais do Estado, mas cortem outros gastos estatais. Seu alvo principal provavelmente serão os servidores públicos e muitos subsídios que eles não consideram essenciais. O sistema de proteção social será financiado, mas acabamos de justificar a entrada do lobo do liberalismo nas contas do Estado. Enquanto estivermos no poder, poderemos impedi-lo, mas quem sabe o que os futuros governos farão."
 france_md.225.a: "Esta reforma constitucional não está saindo exatamente como planejado."
 france_md.226.t: "Debate sobre Questões Sociais, Parte 1:"
 france_md.226.d: "O sistema francês de integração das minorias há muito se apoia no ideal do 'caldeirão cultural' da escola republicana e da meritocracia, mas esse princípio mostra seus limites: a queda da mobilidade social alimenta o desemprego e a deriva comunitarista. O debate agora se volta para a reforma desse sistema. Empurrar por um modelo mais inclusivo arrisca abalar um arcabouço que prevaleceu por gerações, mas deixá-lo intocado apenas dá aos nossos adversários a chance de endurecê-lo. De qualquer modo, nossa escolha aqui moldará o país por gerações."
 france_md.226.a: "Para permitir que o maior número possível de pessoas tenha uma vida melhor, o sistema deve ser mais inclusivo."
 france_md.226.b: "Deixemos que os próprios cidadãos decidam essa questão."
 france_md.227.t: "O Povo Escolhe Adaptar o Sistema"
 france_md.227.d: "O resultado dos debates parece ter caminhado para uma adaptação do sistema atual à diversidade inerente ao nosso novo milênio. Certamente será preciso investir recursos, mas, ao permitir essa inclusão, nosso sistema não será privado dos novos talentos que afluem ao nosso país. Ao dar a todos um futuro ao alcance, contribuímos para a pacificação e favorecemos nosso desenvolvimento a longo prazo."
 france_md.227.a: "Temos muito a aprender com os outros."
 france_md.228.t: "O Povo Escolhe Endurecer o Sistema Atual"
 france_md.228.d: "Apesar de nossos esforços, parece que a sociedade atual não está pronta para questionar os fundamentos de nossa república. O sistema francês de integração parece ainda ter um futuro promissor pela frente. Esta votação confirma o apego dos franceses a um sistema que, apesar de suas disfunções, tem o mérito de já estar em vigor. Esse sistema sempre poderá ser reformado a longo prazo, mas perdemos a oportunidade de derrubar mais uma fortaleza."
 france_md.228.a: "Uma pena"
 france_md.229.t: "Debate sobre Questões Sociais, Parte 2:"
 france_md.229.d: "A liberdade de culto é uma das questões mais quentes do nosso milênio. Desde as leis de laicidade da Terceira República, a França a protege ferozmente, mesmo ao custo das próprias liberdades dos cidadãos, sobretudo por meio da proibição de símbolos religiosos nas escolas primárias públicas, regra cada vez mais no centro de um tenso debate nacional. Flexibilizar esse arcabouço legal poderia pacificar as relações entre comunidades, mas significa questionar uma lei fundadora que nossos cidadãos prezam."
 france_md.229.a: "Nossa sociedade deve se adaptar às necessidades de reconhecimento das comunidades religiosas."
 france_md.229.b: "Deixemos que os próprios cidadãos decidam essa questão."
 france_md.230.t: "O Povo Escolhe Flexibilizar a Laicidade"
 france_md.230.d: "Os debates sobre a laicidade terminaram a favor de flexibilizar o arcabouço legal atual. O uso de símbolos religiosos acabará sendo normalizado em mais lugares do que antes. As diversas crenças também terão direito a maior representação na sociedade, mantendo a primazia do Estado e sua separação da religião. É uma vitória, pois conseguimos manter o melhor de nosso antigo sistema e ao mesmo tempo suavizar as partes mais controversas. Só podemos esperar que essa brecha nesta lei fundadora não leve a um questionamento progressivo desse arcabouço protetor da liberdade de culto. Podemos confiar em nossos sucessores nesse ponto."
 france_md.230.a: "Isso deve correr bem."
 france_md.231.t: "O Povo Escolhe Endurecer a Lei de Laicidade"
 france_md.231.d: "Não esperávamos que abrir um debate sobre a laicidade produzisse um sistema mais rígido do que o que tínhamos. Foi um risco que valia a pena correr, e o corremos. Símbolos religiosos agora serão ainda menos tolerados nas instituições públicas. Nossos ancestrais previram que chegaríamos tão longe nessa direção? Estamos aqui agora e veremos aonde essas mudanças nos levam. O que é certo é que nosso ideal de tolerância parece mais distante do que nunca."
 france_md.231.a: "Pelo menos a liberdade de consciência continua garantida."
 france_md.235.t: "Construindo a República do Amanhã"
 france_md.235.d: "Agora que nosso mandato está em andamento, é hora de lançar nossa promessa mais aguardada: a Sexta República. Esta nova república, que queremos debatida em vez de imposta, ocupará nossos cidadãos por meses enquanto lançam as bases da sociedade de amanhã. Talvez precisemos conduzir o debate em alguns momentos para evitar que se desvie, mas parecer envolvidos demais arrisca perder a confiança do povo. Este projeto deve ser levado até o fim, e rápido o bastante para nunca parecer que estamos atrasando a própria democracia."
 france_md.235.a: "A Quinta República vive seus últimos momentos"
 france_md.236.t: "A Sexta República Fracassa"
 france_md.236.d: "Há várias semanas, os espaços de debate estão vazios e o projeto da Sexta República está estagnado, não por guerra ou crise, mas por puro desinteresse. Ao demorar demais para organizar os debates e agir sobre as contribuições de nossos cidadãos, deixamos morrer o entusiasmo popular que havíamos galvanizado. Nossa chance de mudar o sistema está escapando. Ainda podemos aprovar parte desse trabalho como reformas comuns, mas sem a amplitude que esperávamos, e fracassamos em remediar as injustiças embutidas em nossa constituição, a lei mais alta do país."
 france_md.236.a: "Perdemos uma oportunidade de mudar o sistema"
 france_md.238.t: "A França Nos Impõe um Embargo"
 france_md.238.d: "A França anunciou um embargo total contra nós, abrangendo desde entregas de material até o comércio comum. Desde a eleição da La France Insoumise, Paris endureceu sua retórica contra nós sobre a questão palestina, acusando nosso governo de alimentar o conflito na região, e agora passou a nos embargar abertamente. Pior, eles pressionam o resto da Europa a fazer o mesmo. Nossos parceiros comerciais europeus são essenciais, e não podemos permitir que essa campanha tenha sucesso."
 france_md.238.a: "Eles não convencerão muita gente"
 france_md.239.t: "A França Nos Pede para Embargar o Estado de Israel"
 france_md.239.d: "Após a decisão da França de embargar o Estado de Israel, diplomatas franceses entraram em contato conosco para nos instar a fazer o mesmo. Citam como justificativa a política agressiva do Estado de Israel em relação a seus vizinhos, a desestabilização da região que dela resulta e a situação humanitária local. Esses argumentos não são desprovidos de mérito, e uma parte significativa de nosso eleitorado os apoia. No entanto, tais ações arriscam nos custar caro no cenário internacional e, além disso, não temos interesse geopolítico em nos afastar de nosso aliado israelense. O que devemos decidir?"
 france_md.239.a: "Naturalmente, o Estado de Israel deve frear sua política expansionista"
 france_md.239.b: "Não abandonaremos nossos parceiros israelenses"
 france_md.240.t: "A França Propõe Ajudar a Estabilizar Nossa Nação"
 france_md.240.d: "Após um século de colonização e décadas de neocolonialismo, parece que a política da França na África mudou de rumo. Eles propõem ajudar a estabilizar nosso país ao mesmo tempo que reduzem seu controle sobre ele. A notícia parece uma bênção, e nosso país precisa dessa ajuda mais do que nunca. No entanto, é provável que essa ajuda venha com promessas necessárias de paz, associadas a um relaxamento da população. Nosso antigo colonizador parece ter agora refletido sobre as consequências de seus atos. Devemos fazer o mesmo?"
 france_md.240.a: "A ajuda é sempre bem-vinda"
 france_md.240.b: "Não precisamos deles; eles não são mais nada aqui"
 france_md.244.t: "A França Pressiona por Legislação Social"
 france_md.244.d: "Após a vitória da La France Insoumise na França, muitas vozes em nosso país pedem a adoção de leis semelhantes às adotadas na França. O sucesso de uma ruptura de esquerda na França parece se estender a nós e a outros países da União Europeia. Em todos os nossos países, movimentos se organizam para exigir as mesmas inovações legislativas de nossos vizinhos franceses. A maioria dessas propostas diz respeito sobretudo a direitos humanos, justiça social e ecologia. Devemos aceitar e adotar essas leis para nós? Isso poderia ser benéfico para nossos concidadãos."
 france_md.244.a: "Essas leis poderiam ser um bom acréscimo à nossa constituição"
 france_md.244.b: "Não, isso não será possível"
 france_md.245.t: "A França Pressiona por Legislação Ecológica"
 france_md.245.d: "A vitória dos Ecologistas na França provocou um abalo na Europa: um membro fundador de nossa União agora defende uma legislação climática em detrimento da narrativa de livre comércio e crescimento sobre a qual a UE foi construída. Ativistas já começaram a transmitir esse impulso ao nosso próprio país. Devemos adotar parte da agenda deles, um gesto às nossas forças progressistas, mas um freio ao desenvolvimento econômico, ou assumir uma posição clara antes que a situação avance ainda mais na direção deles sem nós?"
 france_md.245.a: "Também devemos nos proteger das mudanças climáticas"
 france_md.245.b: "Que mudanças climáticas?"
 france_md.246.t: "Uma França Verde Assume a Comissão"
 france_md.246.d: "Após a última votação para nomear a Comissão Europeia, parece que a ecologia levou a melhor. Depois da vitória dos Ecologistas na França, o Europe Écologie, os Verdes, chegou ao mais alto nível da União Europeia, sinal marcante da crescente marcha da União rumo às questões climáticas. Além de conscientizar nossos cidadãos, essa vitória reforça a confiança deles em uma Europa que leva a sério sua segurança climática."
 france_md.246.a: "Estamos caminhando para uma Europa verde?"
 france_md.248.t: "Deputados ecologistas multiplicam ações no Parlamento Europeu"
 france_md.248.d: "Desde sua eleição na França, os deputados ecologistas aparentemente se multiplicaram no Parlamento Europeu. Parece que assistimos a um ressurgimento do interesse por questões ecológicas nos Estados-membros da União Europeia. Esse número de deputados, que parece ganhar importância, vem moldando cada vez mais o equilíbrio de poder no Parlamento Europeu a ponto de se tornar uma disputa para as próximas comissões europeias. Essa influência crescente dos ecologistas sobre a União Europeia também parece se estender ao nosso país, onde influencia não só a popularidade de nossos partidos ecológicos, mas fortalece a confiança em uma União Europeia mais atenta à saúde e às questões ecológicas."
 france_md.248.a: "Eles não realizarão muita coisa no Parlamento Europeu"
 france_md.249.t: "A França Propõe um Fundo de Transição Verde"
 france_md.249.d: "Desta vez nossos amigos franceses chegaram com uma nova proposta sobre a mesa. Propõem a criação de um fundo participativo entre países europeus para auxiliar a transição ecológica nesses países. Esse fundo deve nos permitir desenvolver nosso setor energético com energia verde, se possível. Eles destacam essa ferramenta como forma de confirmar nossa soberania energética e modelá-la em bases sustentáveis. Essa ferramenta viria, porém, com uma maior mobilização de nosso setor civil em favor desses investimentos. Devemos participar?"
 france_md.249.a: "Onde assinamos?"
 france_md.249.b: "Não, obrigado, estamos muito bem sozinhos"
 france_md.250.t: "A França Propõe Reduzir as Emissões Europeias de Carbono"
 france_md.250.d: "Nossos amigos ecologistas franceses voltaram com uma proposta de redução drástica das emissões de carbono, oferecida a nós e a nossos vizinhos enquanto a UE finaliza seu Pacto Ecológico. Argumentam que cortar o uso de combustíveis fósseis permitiria ao nosso povo respirar melhor e construir a soberania energética da União, já que nenhum de nossos países produz petróleo próprio. Tal reestruturação seria cara e lenta, mas poderia se mostrar decisiva se as tensões com a Rússia, nossa principal fonte de combustíveis fósseis, algum dia transbordarem."
 france_md.250.a: "Eles têm razão; os combustíveis fósseis nos tornam vulneráveis"
 france_md.250.b: "Não vejo em que mundo poderíamos entrar em conflito com a Rússia"
 france_md.251.t: "Interferência da França em Nossa Política Comercial"
 france_md.251.d: "Nosso embaixador na França informa que a presidência quer que regulemos nosso setor alimentício: alguns de nossos produtos, alegam, são impróprios para consumo, particularmente carne produzida com moléculas de crescimento proibidas na UE. Não cumprir arrisca medidas protecionistas contra nossos produtos e pressão sobre o resto da União para que as siga, embora a própria indústria agroalimentar francesa tenha claramente interesse em rotular nossas exportações como concorrência desleal. Regular permitiria que nosso próprio povo se beneficiasse mais da agricultura, mas limitaria o crescimento de nosso setor agroalimentar."
 france_md.251.a: "Eles têm razão; essas regulamentações são necessárias"
 france_md.251.b: "Eu ponho no meu gado o que eu quiser."
 france_md.252.t: "A França Propõe Estabelecer Barreiras Alfandegárias contra o Brasil"
 france_md.252.d: "Nosso parceiro francês nos insta a proibir as importações brasileiras devido a uma disputa nascida da recusa do Brasil em aplicar as restrições sanitárias da Europa à sua produção agroalimentar, deixando os alimentos sul-americanos mais baratos, mas com maior probabilidade de conter produtos perigosos para nossos cidadãos. As indústrias europeias chamam isso de concorrência desleal; os financistas chamam de livre comércio. É claro que a própria indústria alimentícia francesa alimentou a queixa, mas o risco sanitário para nosso povo é real de qualquer forma."
 france_md.252.a: "Eles têm razão; é concorrência desleal"
 france_md.252.b: "E o livre comércio nisso tudo?"
 france_md.253.t: "Interferência da França em Nossa Política Comercial"
 france_md.253.d: "Nosso embaixador na França informa que a presidência quer que regulemos nosso setor industrial e extrativo: grande parte de nossa produção ignora as normas industriais europeias, mas inunda o mercado deles, e suas indústrias chamam o desequilíbrio comercial resultante de concorrência desleal. Precisamos da Europa como parceira comercial, e recusar suas normas arrisca restrições às importações de nossos produtos que nos prejudicariam muito mais. Cumprir nos permitiria produzir de forma mais responsável para nosso povo e nosso planeta, mas limitaria o crescimento de nosso setor industrial."
 france_md.253.a: "Não podemos perder nossos parceiros europeus"
 france_md.253.b: "Eles precisam desses produtos baratos e sabem disso."
 france_md.254.t: "A França Propõe Estabelecer Barreiras Alfandegárias contra a China"
 france_md.254.d: "Nosso parceiro francês nos insta a proibir as importações chinesas devido a uma disputa nascida da recusa da China em aplicar as restrições industriais da Europa à sua própria produção, deixando bens manufaturados e matérias-primas mais baratos, mas com maior probabilidade de serem produzidos em condições questionáveis. As indústrias europeias chamam isso de concorrência desleal; os financistas chamam de livre comércio. É claro que o próprio setor industrial francês alimentou a queixa, mas o dano que esses produtos causam ao planeta e às nossas indústrias é real de qualquer forma."
 france_md.254.a: "Eles têm razão; é concorrência desleal"
 france_md.254.b: "E o livre comércio nisso tudo?"
 france_md.255.t: "Interferência da França em Nossa Política Comercial"
 france_md.255.d: "Nosso embaixador na França informa que a presidência quer que regulemos nosso setor de extração e refino de petróleo: grande parte de nossa produção ignora as normas europeias de extração e industriais, mas inunda o mercado deles, e suas indústrias chamam o desequilíbrio comercial resultante de concorrência desleal. Precisamos da Europa, e recusar suas normas arrisca restrições às importações de nossos produtos que nos prejudicariam muito mais. Cumprir nos permitiria produzir de forma mais responsável para nosso povo e nosso planeta, mas limitaria o crescimento de nossas petrolíferas."
 france_md.255.a: "Não podemos perder nossos parceiros europeus"
 france_md.255.b: "Boa sorte para se aquecerem neste inverno."
 france_md.256.t: "A França Propõe Estabelecer Barreiras Alfandegárias contra a Rússia"
 france_md.256.d: "Nosso parceiro francês nos insta a restringir as importações de hidrocarbonetos russos devido a uma disputa nascida da recusa da Rússia em aplicar os regulamentos europeus de extração e refino, produzindo combustível em condições deploráveis para o planeta. Alguns setores extrativos europeus chamam isso de concorrência desleal e querem menos dependência de potências estrangeiras, mas a Rússia talvez represente menos ameaça do que pensamos, e seus padrões frouxos mantêm baixos os nossos custos de combustível."
 france_md.256.a: "Eles têm razão; devemos restringir nossa dependência de combustíveis"
 france_md.256.b: "E o livre comércio nisso tudo?"
 france_md.257.t: "A França Propõe a Criação de um Grande Plano em Torno da Ferrovia"
 france_md.257.d: "Nossos parceiros franceses voltaram com um novo projeto: redirecionar o transporte de cargas da Europa para a ferrovia em vez dos caminhões, ideia defendida pelos ecologistas franceses para tornar o transporte de mercadorias mais eficiente e ecológico. Isso exigiria uma rede ferroviária eficiente e unificada, algo que hoje nos falta, com incompatibilidades como a bitola ferroviária diferente da Espanha ainda atrasando a circulação transfronteiriça. Como a circulação de cargas é central para a União, e a rede também poderia facilitar o deslocamento de pessoas, vale a pena perseguir isso, mesmo que se mostre custoso diante de um setor de transporte rodoviário que já prospera."
 france_md.257.a: "Contem conosco"
 france_md.257.b: "Prefiro o meu caminhão"
 france_md.258.t: "A Vitória dos Comunistas na França Perturba Nossa Política Interna"
 france_md.258.d: "A vitória do Partido Comunista Francês provocou um abalo na Europa: um membro fundador de uma União construída em oposição ao bloco comunista agora insta seu próprio povo a ingressar na luta, reavivando temores da URSS que muitos países julgavam há muito enterrados. Ativistas já começaram a transmitir esse impulso ao nosso próprio país. Devemos adotar parte da agenda deles para cortar a onda de protestos pela raiz, um gesto às nossas forças progressistas, mas um freio ao desenvolvimento econômico, ou assumir uma posição clara antes que a situação avance sem nós?"
 france_md.258.a: "Não é uma ideia tão ruim"
 france_md.258.b: "Antes morto do que vermelho"
 france_md.259.t: "Uma Mão Estendida pela França Comunista"
 france_md.259.d: "Desde a sua criação, nosso Estado não deixou de estar sob o domínio da Rússia ou de temê-lo. Contudo, parece que desta vez a ajuda está prestes a chegar. De fato, diplomatas franceses nos propuseram uma parceria estratégica para nos preparar para a possibilidade de um conflito com a Rússia. Por ora não é muito: alguns papéis, algum equipamento, mas acima de tudo é a promessa de apoio por vir. O mais surpreendente é que esse apoio vem da França comunista. O que não deixa de lembrar a opressão que sofremos dos soviéticos numa época em que o PCF era stalinista. Podemos confiar na França e na Europa sabendo que isso só endurecerá a posição da Rússia em relação a nós?"
 france_md.259.a: "Esta parceria é a nossa salvação"
 france_md.259.b: "Somos capazes de cuidar de nós mesmos"
 france_md.260.t: "A França Propõe Sua Ajuda contra a Rússia"
 france_md.260.desc: "Algumas décadas livres da opressão soviética não pararam os temores de um retorno da Rússia, mas a França ofereceu ajuda em caso de conflito, compartilhando nosso medo de que o expansionismo russo possa mais uma vez se voltar para a Europa Oriental. Suas propostas vão de empréstimos de equipamento a intercâmbio de habilidades, uma ajuda que poderia nos dar uma chance de lutar antes mesmo de a OTAN se mobilizar, embora apenas se a OTAN e a Europa de fato vierem em nosso auxílio. Aceitar prejudicaria as relações com Moscou; talvez preservá-las seja o caminho mais seguro."
 france_md.260.a: "Só precisamos de equipamento para manter os russos à distância"
 france_md.260.b: "Precisamos de treinamento para conduzir uma guerra de alta intensidade"
 france_md.260.c: "Precisaremos produzir mais armamentos a longo prazo"
 france_md.260.d: "Não precisamos de ajuda, a Rússia não é nossa inimiga"
 france_md.261.t: "A França Propõe Formalizar Nossa Aliança"
 france_md.261.desc: "O triunfo de um partido outrora stalinista na França levanta a questão das relações com um potencial aliado na Europa Ocidental, que manifestou hostilidade ao Ocidente e aos americanos e demonstrou proximidade ideológica com a antiga URSS, chegando a considerar positivo o seu legado. Paris multiplicou declarações denunciando o imperialismo americano e a cegueira europeia em segui-lo, e agora propõe uma cooperação que pode ir do comércio a uma parceria militar e estratégica plena, caso julguemos que sua antiga lealdade soviética basta para torná-los dignos de confiança."
 france_md.261.a: "É sempre um prazer fazer negócios com vocês"
 france_md.261.b: "De fato, devemos nos proteger do imperialismo americano"
 france_md.261.c: "Nada separará a irmandade comunista"
 france_md.261.d: "Não cooperamos com comunistas"
 france_md.262.t: "A Rússia Concorda em Ampliar as Relações Comerciais Conosco"
 france_md.262.d: "A Rússia respondeu positivamente à nossa proposta de ampliar as relações. Ofereceram compartilhar conosco seus conhecimentos industriais e extrativos, com a condição de que os ajudemos a estabelecer seus setores nuclear e terciário. Este é um grande avanço em nossas relações com a Rússia. Nossas propostas para uma eventual parceria estratégica foram, porém, deixadas de lado. É provável que a Rússia ainda não nos conceda crédito suficiente, mas este primeiro passo em nossa direção é bom. Levará tempo, mas este acordo é o começo do fim para os imperialistas."
 france_md.262.a: "A confiança sempre se constrói a longo prazo"
 france_md.263.t: "A Rússia Concorda em Estabelecer uma Parceria Militar e Comercial Conosco"
 france_md.263.d: "A Rússia respondeu positivamente à nossa proposta de ampliar as relações. Ofereceram compartilhar conosco seus conhecimentos industriais e extrativos, com a condição de que os ajudemos a estabelecer seus setores nuclear e terciário. Este é um grande avanço em nossas relações com a Rússia. Além disso, a Rússia propôs ampliar essa parceria com um componente militar destinado a nos treinar conjuntamente para estarmos prontos quando a ameaça imperialista passar à ação. Eles nos fornecerão campos de treinamento e sua expertise na tundra, e nós lhes daremos acesso à nossa experiência em guerra no deserto e na selva."
 france_md.263.a: "Juntos somos imparáveis"
 france_md.264.t: "A Rússia Propõe uma Aliança"
 france_md.264.d: "Não esperávamos uma resposta tão positiva de nosso parceiro russo. Eles propuseram que formemos uma aliança contra o imperialismo ocidental. Combinando elementos econômicos e geoestratégicos, essa aliança nos permitirá nos preparar econômica, militar e diplomaticamente para um confronto com o Ocidente. Trocaremos nossos conhecimentos e tradições industriais, bem como nossos campos de treinamento, e uma garantia de assistência mútua em caso de conflito. Não concluíamos uma aliança dessas com eles desde a Primeira Guerra Mundial; talvez seja um mau presságio. Essa aliança é, no entanto, muito bem-vinda e nos permitirá sobreviver em um mundo em grande parte hostil ao comunismo."
 france_md.264.a: "O imperialismo ocidental será impotente contra nós"
 france_md.265.t: "A Rússia Recusa Ampliar as Relações Conosco"
 france_md.265.d: "Para grande surpresa de nossos diplomatas, a Rússia parece recusar qualquer forma de cooperação com a República Francesa. Interesses divergentes. Falta de confiança. Parece que a memória da URSS está muito distante deles. Talvez a corrupção ocidental tenha finalmente alcançado a Rússia, que outrora foi o baluarte contra o imperialismo americano. Uma coisa é certa: estamos sozinhos, sozinhos em uma Europa que não nos compreende e sempre será hostil a nós."
 france_md.265.a: "Nós somos os verdadeiros comunistas!"
 france_md.266.t: "A França Entra em Choque com a UE sobre a Imigração"
 france_md.266.d: "Nossos colegas da Frente Nacional lideram a França há meses e, desde que assumiram o cargo, criticam continuamente as políticas migratórias da Europa por serem lenientes demais. Forças liberais e socialistas silenciaram por muito tempo nossa voz sobre isso dentro da União, mas, com nossos aliados agora triunfantes em Paris, não podem mais nos ignorar. Nosso próprio povo, tendo abraçado ideais nacionalistas, recebe essa vitória como prova de que nossa voz estava certa desde o início em uma Europa que perdera o rumo."
 france_md.266.a: "É o começo do fim para os liberais"
 france_md.267.t: "A França Entra em Choque com a UE sobre a Imigração"
 france_md.267.d: "Desde a vitória da Frente Nacional na França, as críticas jorram no Parlamento Europeu, e a mudança parece ter desencadeado uma onda na política europeia, com partidos nacionalistas e eurocéticos registrando resultados cada vez mais fortes. O debate gira em torno da imigração, com parlamentares refletindo cada vez mais uma opinião pública que se volta para uma visão nacionalista da política interna, denunciando o que veem como política excessivamente leniente. Nosso próprio eleitorado não é exceção, e a convulsão que a França causou começa a abalá-lo também. Devemos combater essa deriva nacionalista ou aceitar a nova orientação europeia à medida que ela toma forma?"
 france_md.267.a: "Mas eles têm razão"
 france_md.267.b: "A Europa já pagou o preço do nacionalismo"
 france_md.268.t: "A França Vence Sua Causa em Bruxelas"
 france_md.268.d: "A política francesa tomou um novo rumo: apesar de seu histórico euroceticismo, o partido fechou um acordo com a União Europeia, usando campanhas eurocéticas internamente e entre aliados para convencer Bruxelas do perigo que representavam, e agora usando essa alavanca para forçar a UE a deportar migrantes ilegais. É um verdadeiro sucesso para a presidência deles. Nosso próprio governo nacionalista enfrenta a mesma questão de soberania: devemos buscar vantagens na UE em troca de suavizar nosso próprio euroceticismo, sabendo que grande parte de nosso partido vê essa postura como um valor fundador?"
 france_md.268.a: "Por que negociar quando podemos simplesmente deixar a Europa."
 france_md.268.b: "Que esperto, devemos fazer o mesmo"
 france_md.269.t: "A França Defende uma Identidade Europeia"
 france_md.269.d: "Tendo arrancado de Bruxelas concessões sobre a migração, a liderança francesa agora parece abandonar por completo sua retórica eurocética, chegando a promover a adesão à União Europeia, desde que ela continue se afastando das tendências liberais e socialistas. Movimentos nacionalistas parecem se multiplicar dentro da própria União, tornando atraente de novo uma Europa das Nações, embora tal mudança possa inquietar eleitores apegados à rejeição total da UE. Devemos seguir o exemplo da França, especialmente se a liderança da UE continuar pendendo para o nosso lado?"
 france_md.269.a: "Esta é uma ótima iniciativa"
 france_md.269.b: "Não se pode ser nacionalista e europeu ao mesmo tempo"
 france_md.270.t: "A França Propõe Investir em Nossa Defesa"
 france_md.270.d: "Nos últimos anos, a possibilidade de uma nova guerra no continente europeu parece mais real do que nunca. Embora nossa União ainda não tenha sofrido nenhuma agressão, as ações preocupantes de nosso vizinho russo parecem confirmar esse temor. A França nos procurou com uma oferta: propõe nos ajudar a construir nosso complexo industrial-militar investindo nele. Com essas fábricas de armas, poderíamos nos preparar efetivamente para o dia em que tivermos de lutar por nosso país e por nossos parceiros europeus. No entanto, permitir que invistam em nosso armamento nos tornaria mais dependentes deles, o que pode não ser uma boa ideia. Além disso, nossa população pacifista poderia se preocupar com tal mobilização de nosso capital."
 france_md.270.a: "Obrigado por esta ajuda crucial"
 france_md.270.b: "Não há motivo para preocupação"
 france_md.271.t: "A França Reconhece Nossas Reivindicações na Ucrânia"
 france_md.271.d: "Desde que o poder na França passou à Frente Nacional, eles se tornaram cada vez mais favoráveis a nós, rompendo com uma Europa que sempre se opôs às nossas ambições a leste. Não apenas se manifestaram a favor de nossas reivindicações sobre o território ucraniano, como nos ofereceram acesso a seu território e portos para deslocar tropas e mercadorias, facilitando nossa logística e atenuando qualquer futuro embargo europeu. Esse novo aliado nos confirma no caminho rumo à guerra que ainda poderemos empreender."
 france_md.271.a: "Cai o primeiro dominó"
 france_md.271.b: "Não temos intenção de lutar contra nossos irmãos ucranianos"
 france_md.272.t: "A França Propõe Ampliar Nossa Cooperação"
 france_md.272.desc: "Após muitas declarações e acordos a nosso favor, a França parece pronta para ampliar as relações conosco, apresentando-se como defensora da moral e da fé em uma Europa e um Ocidente que agora considera decadentes. Nossas relações poderiam evoluir do comércio para uma parceria militar e estratégica plena, caso vejamos potencial suficiente nesse novo aliado, ou podemos recusar se ainda contamos com boas relações com a União Europeia tal como está."
 france_md.272.a: "Nossa economia se beneficiará"
 france_md.272.b: "Nossa economia e nossos exércitos se beneficiarão"
 france_md.272.c: "O mundo tremerá diante de nós"
 france_md.272.d: "Não pretendemos cooperar com a França"
 france_md.273.t: "A Rússia Concorda em Ampliar as Relações Comerciais Conosco"
 france_md.273.d: "A Rússia respondeu positivamente à nossa proposta de ampliar as relações. Ofereceram compartilhar conosco seus conhecimentos industriais e extrativos, com a condição de que os ajudemos a estabelecer seus setores nuclear e terciário. Este é um grande avanço em nossas relações com a Rússia. Nossas propostas para uma eventual parceria estratégica foram, porém, deixadas de lado. É provável que a Rússia ainda não nos conceda crédito suficiente, mas este primeiro passo em nossa direção é bom. Levará tempo, mas este acordo é o começo do fim para os ultraglobalistas."
 france_md.273.a: "A confiança sempre se constrói a longo prazo"
 france_md.274.t: "A Rússia Concorda em Estabelecer uma Parceria Militar e Comercial Conosco"
 france_md.274.d: "A Rússia respondeu positivamente à nossa proposta de ampliar as relações. Ofereceram compartilhar conosco seus conhecimentos industriais e extrativos, com a condição de que os ajudemos a estabelecer seus setores nuclear e terciário. Este é um grande avanço em nossas relações com a Rússia. Além disso, a Rússia propôs ampliar essa parceria com um componente militar destinado a nos treinar conjuntamente para estarmos prontos quando a ameaça ultraglobalista passar à ação. Eles nos fornecerão campos de treinamento e sua expertise na tundra, e nós lhes daremos acesso à nossa experiência em guerra no deserto e na selva."
 france_md.274.a: "Juntos somos imparáveis"
 france_md.275.t: "A Rússia Propõe uma Aliança"
 france_md.275.d: "Não esperávamos uma resposta tão positiva de nosso parceiro russo. De fato, eles propuseram que formemos uma aliança que garanta assistência mútua em caso de agressão de potências estrangeiras. Combinando elementos econômicos e geoestratégicos, essa aliança nos permitirá nos preparar econômica, militar e diplomaticamente para um confronto com o resto do mundo. Essa aliança nos dará força para lutar até o fim para nos defender do ultraglobalismo em que nossos vizinhos afundaram. Não concluíamos uma aliança dessas com eles desde a Primeira Guerra Mundial; talvez seja um mau presságio. Essa aliança é, no entanto, muito bem-vinda e um grande sucesso para nossa política."
 france_md.275.a: "Estamos protegidos contra a decadência liberal"
 france_md.276.t: "A Rússia Recusa Ampliar as Relações Conosco"
 france_md.276.d: "Para grande surpresa de nossos diplomatas, a Rússia parece recusar qualquer forma de cooperação com a República Francesa. Interesses divergentes. Falta de confiança. Talvez a corrupção ocidental tenha finalmente alcançado a Rússia, que outrora foi forte e orgulhosa. Essa reviravolta não é, porém, dramática; talvez não tivéssemos tanto em comum, afinal. Certamente encontraremos outros aliados nacionalistas no continente."
 france_md.276.a: "Que pena"
 france_md.277.t: "A França Propõe nos Proteger da Influência Russa"
 france_md.277.d: "Há vários anos, os russos parecem ter investido no continente africano, oferecendo seus serviços para combater as insurreições jihadistas e independentistas que florescem nos países da antiga África francesa. França e Rússia estão claramente em um conflito de influência neste continente. Com eles, valores se chocam: liberalismo ocidental e autoritarismo. Nesta situação em que nós, países africanos, somos alvos da influência russa, que às vezes pode agravar tensões entre minorias regionais, a França propõe nos ajudar a reduzir a presença deles assistindo-nos em seu lugar. No entanto, isso significaria nos aproximar de nossos antigos colonizadores, o que pode não ser uma boa ideia. O que devemos decidir?"
 france_md.277.a: "Eles têm razão; a influência russa é perigosa"
 france_md.277.b: "Nossos antigos colonizadores. Certamente não"
 france_md.278.t: "A Comuna Francesa Deixa a União Europeia"
 france_md.278.d: "Há alguns meses, a França anunciou o fim da república em favor da Comuna Francesa, uma nova entidade fundada no comunismo revolucionário, e não demorou para que deixassem nossa União Europeia, construída como é sobre o liberalismo econômico que sua nova orientação agora rejeita. A saída foi imediata e definitiva, sem aparente intenção de negociar. Isso é mau presságio para um continente cuja União existiu acima de tudo para evitar novos conflitos, e uma saída abrupta aliada a uma ideologia tão revolucionária terá, mais cedo ou mais tarde, de ser enfrentada."
 france_md.278.a: "Era de se esperar"
 france_md.279.t: "A Comuna Francesa Pressiona Nossa Política"
 france_md.279.d: "Como previsto, a saída da Comuna Francesa da União Europeia não foi um beco sem saída; mal se livraram dela, já estão reerguendo sua economia, e seu sucesso começa a conquistar a admiração de quem, em nosso país, não nutre grande apreço pelos valores liberais europeus. A inteligência francesa, remodelada em serviço internacional de propaganda, está ajudando a treinar esses agitadores, e devemos levar isso a sério antes que acabemos na situação deles. Podemos defender os valores europeus e a paz que eles trazem, ou adotar nós mesmos a agenda deles para atenuar a violência que se aproxima, embora isso signifique abraçar uma política comunista e antieuropeia."
 france_md.279.a: "Não adianta lutar se podemos vencê-los em seu próprio jogo"
 france_md.279.b: "Devemos lutar contra esses extremistas"
 france_md.280.t: "A Comuna Francesa Nos Convida para uma Cúpula sobre a Revolução Mundial"
 france_md.280.d: "Tendo assegurado o controle interno, os comunistas revolucionários da França pretendem agora exportar sua revolução, convidando-nos para uma cúpula sobre a revolução mundial porque nosso próprio governo já tomou partido dos valores comunistas que a nova Comuna Francesa preza. Eles estão determinados a difundir esses valores pelo mundo, e este convite é certamente um teste para saber se os seguiríamos. Tal revolução não virá sem guerra, provavelmente sangrenta, dado quantas grandes potências jamais a aceitarão. Os ideais comunistas nos são caros, mas estamos prontos para arriscar a vida de nossos cidadãos para alcançá-los?"
 france_md.280.a: "Contem conosco, viva a revolução"
 france_md.280.b: "A história provou que a liberdade não se leva à ponta de arma"
 france_md.281.t: "O Imperador Empreende Profundas Reformas nas Forças Armadas Francesas"
 france_md.281.d: "Nosso Imperador empreendeu profundas reformas em nossas forças armadas, com o objetivo de torná-las mais adaptáveis às guerras que podemos ser levados a travar. Levar isso a cabo exige pesado investimento e nossa total atenção, deixando menos margem para a prontidão imediata, de modo que ficaremos mais vulneráveis por um tempo antes de retomarmos a construção de nossas forças. Esta primeira onda mira a própria liderança do exército, considerada inapta para as reformas por vir, e a reestruturação da cadeia de comando deve levar um pouco menos de um ano, um ano em que devemos limitar nossas operações militares em prol de um ganho a longo prazo."
 france_md.281.a: "Estas reformas são necessárias"
 france_md.282.t: "As Reformas do Nosso Estado-Maior Estão Concluídas"
 france_md.282.d: "Nossas reformas foram concluídas em tempo recorde. Alguns resistiram, mas a maioria de nosso estado-maior aceitou a reestruturação da cadeia de comando. Além de tornar nossa liderança mais eficiente, essas reformas abrem as portas a novos generais talentosos, ao custo de treinamento mais avançado, e são apenas o primeiro tijolo na transformação de nossas forças armadas. Nos próximos meses, novas reformas definirão os meios e objetivos de nossas forças e darão ao nosso complexo industrial-militar uma carteira de pedidos mais clara. Foi uma aposta de longo prazo, e parece que a vencemos."
 france_md.282.a: "Mantivemo-nos firmes. Agora podemos passar a assuntos mais importantes"
 france_md.283.t: "A Espinha Dorsal do Nosso Exército"
 france_md.283.d: "O primeiro conjunto de reformas sobre nossa abordagem do campo de batalha chegou, definindo a estratégia que devemos empregar em qualquer conflito de grande escala contra um adversário futuro. Desde nossa reestruturação pós-Segunda Guerra Mundial, nossos exércitos sempre favoreceram estratégias ofensivas baseadas em mobilidade e manobra, e poderíamos aprofundar isso centrando nossa doutrina e pedidos de equipamento em tanques de assalto e captura rápida de alvos. A alternativa é focar na infantaria, reforçando seu papel e equipamento para responder a contra-ataques inimigos com poder de fogo superior, uma abordagem mais segura, mas que questionaria nossa doutrina passada."
 france_md.283.a: "A infantaria sempre desempenhou um papel central; é a abordagem mais segura"
 france_md.283.b: "Nosso exército foi construído em torno de uma guerra de movimento desde a Guerra Fria, e não há motivo para isso mudar"
 france_md.284.t: "Nosso Poder de Fogo"
 france_md.284.d: "Uma última onda de reforma doutrinária chegou, forçando-nos a decidir como nosso exército destrói as forças inimigas à distância. Há muito equilibramos artilharia e aviação, mas o caminho adiante exige especialização. Nossos canhões Caesar são móveis e eficazes, permitindo bombardear tropas inimigas com segurança. Nossa força aérea e helicópteros oferecem poder de fogo versátil, mas permanecem vulneráveis à defesa aérea inimiga, e perder o controle dos céus poderia ser desastroso. Devemos escolher entre risco mínimo e maior poder de fogo."
 france_md.284.a: "A artilharia tem melhor custo-benefício"
 france_md.284.b: "Nossa aviação é altamente eficaz; seria tolice não usá-la"
 france_md.285.t: "Nossa Posição em Relação à União Europeia"
 france_md.285.d: "Por tempo demais, nossa nação priorizou a União Europeia em detrimento de seu próprio desenvolvimento. Deixar de lado nosso desenvolvimento e segurança nos levou a uma crise democrática sem precedentes, da qual, no entanto, saímos vitoriosos. Mas hoje temos a oportunidade de reverter essa tendência. Livres das instituições democráticas do passado, somos livres para fazer nossas próprias escolhas e podemos deixar a União Europeia se quisermos. No entanto, sair da noite para o dia poderia desferir um golpe severo em nossa nação, que acaba de se recuperar da opressão liberal. Devemos negociar com a União Europeia para monetizar nossa permanência entre eles, ou selar nossa ruptura completando nossa saída da União Europeia?"
 france_md.285.a: "Esvaziem os bolsos de Bruxelas ou estamos saindo!"
 france_md.285.b: "A União Europeia já nos fez mal suficiente. Frexit!"
 france_md.286.t: "A França Deixa a União Europeia"
 france_md.286.d: "Após uma grande convulsão em nosso Estado parceiro francês, movimentos nacionalistas que se dizem bonapartistas tomaram o controle da França. Imediatamente, trabalharam para destruir os resquícios do sentimento pró-europeu dentro da França. Agora anunciam a saída da França da União Europeia. Demonstraram recusa categórica a negociar. A vitória desses movimentos nacionalistas não é apenas uma fissura no projeto de construção europeia, mas um modelo para os eurocéticos de toda a União."
 france_md.286.a: "O nacionalismo é um perigo para nossa União Europeia"
 france_md.287.t: "A União Europeia Cede às Nossas Exigências"
 france_md.287.d: "Parece que tomamos a decisão certa ao negociar nosso retorno às instituições europeias. Não só evitamos uma crise econômica como também extraímos fundos do Banco Central Europeu. Isso é o que se pode chamar de operação financeira bem-sucedida! Não há dúvida de que acabaremos enfrentando nossos parceiros no campo de batalha, mas deixemos que durmam na ilusão. Uma coisa é certa: nossos adversários devem estar furiosos por nossas negociações com o BCE terem dado certo."
 france_md.287.a: "Nossa hora vai chegar"
 france_md.288.t: "Nossas Negociações Fracassam"
 france_md.288.d: "Nossa tentativa foi ousada, mas se mostrou malsucedida. Talvez tenhamos pedido demais, ou não tenhamos inspirado confiança em nossos interlocutores europeus. De qualquer modo, o BCE se recusou a nos pagar para ficar. É decisão deles, e não serve a nossos interesses, mas é a realidade. Agora devemos decidir se permanecemos na União Europeia. A saída seria economicamente custosa, mas permanecer confirmaria nosso fracasso diante da União. Em todo caso, acabaremos por enfrentá-los no campo de batalha, com ou sem a adesão à União Europeia. A única questão é se o custo monetário da saída excede o custo moral de ficar."
 france_md.288.a: "Sair da União nos custaria caro demais; por ora, não podemos arcar com isso"
 france_md.288.b: "Não temos mais nada a fazer aqui"
 france_md.289.t: "A França Obtém um Acordo com a União Europeia"
 france_md.289.d: "Após meses de pressão diplomática e ameaças de saída, a França bonapartista dobrou a União Europeia à sua vontade, monetizando sua adesão em troca de benefícios adicionais para ficar. Este acordo é desastroso para nós e nossos parceiros: não há garantia de que a França se comportará agora que nacionalistas obcecados por vingança a controlam. A França continua sendo um membro essencial, mas hoje é um perigo para todo o continente, e nosso povo deve pagar o preço pelos caprichos de seu parceiro."
 france_md.289.a: "Isso foi mesmo uma boa ideia?"
 france_md.290.t: "A Aurora de um Novo Império"
 france_md.290.d: "Após meses de turbulência interna e reforma constitucional, conseguimos. Erradicamos com sucesso as instituições e o poder da vergonhosa república. Agora a França deve se tornar o que nunca deveria ter deixado de ser: um Império! Para celebrar o retorno do império, preparamos uma grande celebração transmitida por toda a França. Por meio desse evento, nosso povo compreenderá nossa força e nossa determinação de restaurar a França à sua antiga glória. Essa celebração também enviará uma mensagem clara a nossos adversários: uma demonstração de poder. Agora eles não podem nos ignorar; seus dias estão contados antes que a França venha cobrar o que lhe é devido. Desta vez, nenhuma coalizão poderá nos deter!"
 france_md.290.a: "O Império Recuperará Sua Antiga Grandeza!"
 france_md.291.t: "A França Convoca uma União dos Nacionalismos"
 france_md.291.d: "A vitória de nossos camaradas nacionalistas na França abalou a Europa, e os Bonaparte voltaram sua política externa contra a União Europeia, seus valores e seu futuro. Agora estenderam a mão a nós, acreditando que nosso governo compartilha o suficiente de seu caráter para fazer causa comum. Uma aliança tácita com a França parece atraente, mas nada garante que eles não se voltarão contra nós depois. Devemos pesar as consequências com cuidado."
 france_md.291.a: "Eles estão no caminho certo; faríamos bem em nos juntar a eles"
 france_md.291.b: "Não compartilhamos essa visão de nacionalismo"
 france_md.292.t: "A França Bonapartista Pressiona Nossa Política"
 france_md.292.d: "Como previmos, a retórica nacionalista e antieuropeia da França não foi acidente: desde que os Bonaparte tomaram o poder, a União Europeia tornou-se alvo de nacionalistas em toda parte. Setores de nossa população agora temem o retorno da guerra, enquanto outros aderiram à causa nacionalista e conduziram operações desestabilizadoras contra nosso governo, amplamente apoiadas e treinadas pela inteligência francesa atuando como aparato internacional de propaganda. Devemos encarar isso com a máxima seriedade, pois o objetivo deles é nos dividir. A União Europeia deve permanecer unida!"
 france_md.292.a: "A Europa acabará derrotando o nacionalismo"
 france_md.293.t: "Cercados de Inimigos"
 france_md.293.d: "Como nos tempos das guerras revolucionárias, parece que as mudanças necessárias em nossa nação geram ressentimento. Enquanto reconstruímos, nossos inimigos já conspiram contra nós e se preparam para o confronto. Têm razão em ser cautelosos, pois estamos prontos para recuperar nossos territórios pela força, se necessário. Em todo caso, estamos isolados diante de uma Europa que nos vê, com razão, como uma ameaça. Por ora, devemos acima de tudo nos preparar para anos de conflito com nossos adversários. Talvez consigamos forjar alianças, mas devemos contar principalmente conosco. Mas uma coisa é certa: assim que tivermos vencido a ameaça europeísta e atlantista, seremos imparáveis."
 france_md.293.a: "Quantas coalizões Napoleão derrotou? Daremos cabo delas rapidamente"
 france_md.294.t: "A França Propõe que Nos Juntemos à Sua Aliança"
 france_md.294.d: "Acabamos de receber uma proposta de diplomatas franceses. Observando que estão isolados na Europa e cercados de inimigos de sua própria criação, os Bonaparte apelaram a nós. Especificamente porque consideram nossa nação suficientemente respeitável para merecer uma aliança com eles. Nem é preciso dizer que não se trata de um mero pacto defensivo e que aderir nos enredaria rapidamente em conflitos que não são necessariamente nossos. No entanto, essa aliança poderia nos servir bem para enfrentar nossos próprios adversários, e, em igualdade de condições, é melhor estar com eles do que contra eles. Uma aliança com a França parece tentadora, mas talvez juntar-se a eles seja um bilhete direto para o inferno, já que logo levarão a guerra à Europa."
 france_md.294.a: "Podemos nos beneficiar desta aliança"
 france_md.294.b: "Certamente não"
 france_md.295.t: "A França Propõe que Nos Juntemos à Sua Comintern"
 france_md.295.d: "As facções comunistas revolucionárias que governam a França desenvolveram apetite por conflito, perseguindo a revolução mundial e recrutando aliados para exportá-la por todos os meios necessários. Chamaram a nós, particularmente porque também abraçamos o socialismo, oferecendo a chance de derrotar o capitalismo e o fascismo no campo de batalha. No entanto, não se trata de um mero pacto defensivo, e aderir nos arrastaria rapidamente a conflitos que não são necessariamente nossos."
 france_md.295.a: "Eles têm razão; é hora de exportar a revolução"
 france_md.295.b: "Certamente não"
 france_md.296.t: "O povo francês nos pressiona a atacar"
 france_md.296.d: "Nossa implacável propaganda nacionalista funcionou bem demais: convencido de que potências rivais buscam nossa destruição, o público agora espera que ataquemos primeiro. Milícias se reuniram nas fronteiras prontas para enfrentar as forças de segurança de nossos vizinhos, e a opinião pública está fervendo. Devemos ter cuidado para não assustar essas potências e levá-las a se aliar contra nós prematuramente."
 france_md.296.a: "É hora de acertar as contas"
 france_md.296.b: "Nossa hora vai chegar"
 france_md.297.t: "Escaramuças no Túnel da Mancha"
 france_md.297.d: "Milícias francesas ultranacionalistas, encorajadas por seu novo líder bonapartista, atacaram nossos cidadãos e a polícia em torno do Túnel da Mancha, matando cerca de vinte e ferindo dezenas. Não estávamos sozinhos: na noite passada esses grupos atacaram a maioria dos vizinhos da França que compartilham nossa oposição ao novo Império napoleônico. Somos claramente um alvo prioritário, e o confronto com a França bonapartista agora parece inevitável."
 france_md.297.a: "Devemos conter a agressão francesa protegendo seus potenciais alvos"
 france_md.297.b: "Devemos nos preparar para o conflito com eles"
 france_md.298.t: "Escaramuças na Fronteira Francesa"
 france_md.298.d: "Milícias francesas ultranacionalistas, encorajadas por seu novo líder bonapartista, atacaram nossos cidadãos e a polícia ao longo de nossa fronteira comum, matando cerca de quinze e ferindo dezenas. Não estávamos sozinhos: na noite passada esses grupos atacaram a maioria dos vizinhos da França, todos potenciais alvos do expansionismo bonapartista. Somos claramente um alvo prioritário, e o confronto com o novo Império napoleônico agora parece inevitável."
 france_md.298.a: "Devemos conter a agressão francesa protegendo seus potenciais alvos"
 france_md.298.b: "Devemos nos preparar para o conflito com eles"
 france_md.298.c: "Não há motivo para preocupação"
 france_md.299.t: "[FROM.GetName] Nos Pede Ajuda"
 france_md.299.d: "Diante da nova ameaça iminente representada pela França, outras nações atacadas não demoraram a reagir. Como muitas outras, [FROM.GetName] nos pede ajuda para se defender de uma potencial invasão. É verdade que provavelmente sofrerão um ataque antes de nós. Mas estamos realmente preparados para protegê-los? Devemos sacrificar meses de nossa preparação por [FROM.GetName]? Esta crise virou nossa política externa de cabeça para baixo e os pedidos de ajuda chegam em enxurrada. Temos dois caminhos: podemos auxiliar [FROM.GetName] incluindo-os em nossa parceria estratégica, ou podemos deixá-los enfrentar Napoleão sozinhos. Afinal, há mérito em permitir que ele se desgaste contra um oponente como [FROM.GetName]."
 france_md.299.a: "Devemos protegê-los"
 france_md.299.b: "Por que morrer por [FROM.GetName]"
 france_md.300.t: "A França Propõe que Nos Juntemos à Sua Aliança"
 france_md.300.d: "O líder bonapartista da França atraiu a ira da Europa, declarando-se pronto para a guerra a fim de restaurar a grandeza de sua nação, e agora estende a mão a nós. Diplomatas franceses invocam a história, lembrando como Napoleão outrora auxiliou o povo polonês contra a opressão eslava e germânica, e propõem renovar esse pacto. Tal aliança nos protegeria contra a onipresente ameaça russa, mas também poderia nos arrastar a guerras impossíveis de vencer."
 france_md.300.a: "Seremos os novos Dombrowski e Kniaziewicz!"
 france_md.300.b: "Por que morrer por Paris? Eu lhes pergunto"
 france_md.301.t: "A França Propõe que Nos Juntemos à Sua Aliança"
 france_md.301.d: "O líder bonapartista da França atraiu a ira da Europa, declarando-se pronto para a guerra a fim de restaurar a grandeza de sua nação, e agora estende a mão a nós. Diplomatas franceses invocam a descendência de nossa casa real de Jean Baptiste Bernadotte, marechal de Napoleão, e propõem unir nossos esforços em memória de nossos ancestrais. Tal aliança nos protegeria contra a onipresente ameaça russa, mas também poderia nos arrastar a guerras impossíveis de vencer."
 france_md.301.a: "É hora de voltar ao serviço"
 france_md.301.b: "O passado é passado"
 france_md.302.t: "EUA: amigo ou inimigo"
 france_md.302.desc: "Tendo enviado propostas de aliança aos poucos aliados potenciais que encontramos na Europa, resta uma questão: como devemos lidar com os Estados Unidos? Durante a Revolução e sob Napoleão mantivemos boas relações com eles, compartilhando um ódio comum à Inglaterra. Mas os tempos mudaram. A Segunda Guerra Mundial e a conduta americana na Europa muitas vezes foram contrárias aos interesses franceses e, embora as relações tenham se mantido até nossa ascensão ao poder, Washington pode agora bloquear nosso caminho rumo à hegemonia."
 france_md.302.a: "Propor que se juntem à nossa aliança"
 france_md.302.b: "O poder comercial deles nos ajudará a superar as sanções internacionais"
 france_md.302.c: "Preparar-se para o confronto com eles"
 france_md.302.d: "Garantir a Europa continua sendo nossa prioridade"
 france_md.303.t: "A França Nos Propõe uma Aliança"
 france_md.303.d: "O líder bonapartista da França atraiu a ira da Europa e agora propõe uma aliança, com a condição de que não interfiramos em seus assuntos. Diplomatas franceses ressaltam que Napoleão e a França revolucionária há muito foram aliados vitais para nós. Mas a França se dedicou a combater outras potências europeias, muitas delas nossas próprias aliadas, e declarou o Reino Unido alvo prioritário, nosso aliado histórico e um parceiro precioso. Devemos nos juntar à França e arriscar guerra com Londres?"
 france_md.303.a: "Podem contar conosco"
 france_md.303.b: "Os ingleses são nossos aliados acima de tudo"
 france_md.304.t: "A França Propõe Ampliar Nossas Relações Comerciais"
 france_md.304.d: "O líder bonapartista da França atraiu a ira da Europa e agora propõe ampliar nossas relações comerciais, pois sua economia, isolada pela hostilidade de antigos parceiros, precisa de nossa expertise e poder industrial mais do que nunca. Diplomatas franceses ressaltam que Napoleão e a França revolucionária há muito foram aliados vitais para nós. Mas a França se dedicou a combater outras potências europeias, a maioria delas nossas próprias aliadas, e apoiar seu esforço de guerra por meio do comércio poderia atrair a desaprovação delas."
 france_md.304.a: "Mais comércio é sempre bom"
 france_md.304.b: "Não seremos cúmplices deles"
 france_md.305.t: "A França Deixa a União Europeia"
 france_md.305.d: "Após uma grande crise entre nossos parceiros franceses. Movimentos nacionalistas que pedem o retorno da monarquia absoluta tomaram o controle do Estado francês. Desde então, passaram a destruir o que restava do sentimento pró-europeu na França. Agora anunciam a saída da França da União Europeia. Demonstraram recusa categórica a negociar. A vitória desses movimentos nacionalistas não é apenas uma rachadura na unidade europeia, mas também um modelo para todos os eurocéticos dentro da União."
 france_md.305.a: "O nacionalismo é uma ameaça à nossa União Europeia"
 france_md.306.t: "Monarquistas Triunfam na França"
 france_md.306.d: "A vitória de nossos camaradas monarquistas na França abalou toda a Europa: um pilar da União abraçar o nacionalismo bastou para enfurecer Bruxelas. Os realistas orientaram sua política externa contra a União Europeia, seus valores e seu futuro, assim como nós, monarquistas, há muito lidamos com uma União que queria nos silenciar. Por toda a Europa, o exemplo da França parece encorajar a oposição à burocracia europeia. Nosso próprio país já está comprometido com a causa monarquista, de modo que a vitória da França é uma vitória dos nacionalistas europeus em toda parte."
 france_md.306.a: "Uma Vitória do Nacionalismo na Europa"
 france_md.307.t: "O Reino Francês Pressiona Nossa Política"
 france_md.307.d: "Como previmos, a retórica nacionalista e antieuropeia da França não foi acidente: desde a vitória da monarquia, a União Europeia tornou-se alvo de nacionalistas em toda parte, e a França demonstrou clara disposição de fazer guerra a quem considera inimigo. Parte de nossa população agora teme o retorno da guerra, enquanto outros, já mornos em relação à Europa, tomaram o partido dos nacionalistas e conduziram ações desestabilizadoras contra nosso governo, auxiliados e treinados por serviços de inteligência franceses transformados em máquina internacional de propaganda. Devemos levar isso a sério: o objetivo deles é nos dividir."
 france_md.307.a: "A Europa acabará derrotando o nacionalismo"
 france_md.308.t: "A França Nos Convida a Juntar-nos à Sua Cruzada"
 france_md.308.d: "A vitória de nossos camaradas nacionalistas na França abalou toda a Europa. Além da União, que enxerga como adversária, o reino francês declarou que protegerá a fé cristã por toda a Europa e o mundo, denunciando a democracia ocidental como uma perversão que afastou o povo da religião, e clamando pelo retorno da Igreja ao poder. Como nosso país tem maioria cristã, esse chamado destina-se em parte a nós: propõem que nos unamos para restaurar o cristianismo ao seu antigo poder. O convite poderia nos trazer poder a serviço de nosso Senhor, mas garante um retorno à guerra na Europa."
 france_md.308.a: "Juntar-nos-emos à sua cruzada"
 france_md.308.b: "Não compartilhamos essa visão do cristianismo"
 france_md.309.t: "Preparar a Décima Cruzada"
 france_md.309.d: "Há semanas nosso rei demonstra uma determinação inabalável de reconquistar a Terra Santa, embora não tenhamos nenhum ponto de apoio na região. Nossos parceiros libaneses mantêm relações cordiais conosco, mas seu governo é instável demais e sofre influência iraniana demais para ajudar, apesar de a significativa minoria cristã maronita do Líbano torná-lo um ponto de desembarque ideal para nossa cruzada. Poderíamos preparar uma intervenção anfíbia, que fortaleceria nossa marinha, mas nos marcaria como agressores contra um Estado inocente, ou aplicar pressão política, que traz menos risco, mas nenhuma garantia de sucesso."
 france_md.309.a: "Devemos primeiro pedir a eles (educadamente, claro)"
 france_md.309.b: "Quem não está conosco está, de qualquer modo, contra nós"
 france_md.310.t: "O Reino Francês Ameaça Nossa Independência"
 france_md.310.d: "O Reino Francês anunciou meses atrás sua intenção de reconquistar a Terra Santa, preparando uma Décima Cruzada rumo a Jerusalém. Para isso precisam de um ponto de apoio perto de Jerusalém, e a forte minoria maronita de nosso país nos colocou em sua mira. Agitadores franceses agora trabalham para minar nossa legitimidade e pressionar os maronitas a derrubar nosso governo. O controle francês poderia nos proteger da interferência de Israel e do Hezbollah, mas provavelmente despedaçaria nosso país numa guerra fratricida. É isso mesmo que queremos?"
 france_md.310.a: "Eles nos protegerão de nossos vizinhos belicosos"
 france_md.310.b: "Eles só trarão mais conflito!"
 france_md.311.t: "O Líbano Cede às Nossas Exigências"
 france_md.311.d: "Esta manhã é um grande dia. Após nossa pressão, o governo libanês anunciou sua rendição às exigências dos manifestantes cristãos maronitas. Logo em seguida, foi nomeado um governo de maioria maronita que colocou o Líbano sob nossa proteção. Fizemos a escolha certa ao privilegiar a diplomacia; as potências ocidentais nada terão a objetar, pois isso enfraquece a influência do Irã. Manobramos bem geopoliticamente. Resta apenas nos preparar para um conflito terrestre contra aqueles que se interpõem entre nós e o Reino dos Céus."
 france_md.311.a: "Jerusalém está ao nosso alcance"
 france_md.312.t: "O Líbano Nos Recusa"
 france_md.312.d: "Esta manhã o Líbano anunciou publicamente sua recusa em ceder à pressão francesa sobre sua política. Nossos agitadores aparentemente não surtiram efeito, e o apoio maronita à nossa causa não foi suficiente. Nosso fracasso provavelmente decorre de o Líbano permanecer firmemente sob o controle do Irã e do Hezbollah. A recusa do Líbano em trabalhar conosco não é, porém, o fim. Sempre poderemos voltar a eles quando precisarmos, e desta vez não poderão resistir. No entanto, nossos esforços políticos parecem ter falhado. Talvez devamos nos concentrar em como pressionamos os outros e fortalecer nossa diplomacia internacional, pois podemos precisar dela no futuro."
 france_md.312.a: "Preparar uma intervenção naval"
 france_md.312.b: "Devemos fortalecer nossa diplomacia; não parece ser nosso ponto forte"
 france_md.313.t: "A Comuna Francesa Exige a Queda do Nosso Governo"
 france_md.313.d: "Meses atrás a Comuna Francesa anunciou seu desejo de levar a revolução ao mundo e agora parece estar nos pressionando. Agitadores de propaganda se infiltraram em nossa população, incitando os cidadãos a aderir à causa deles, e grupos de manifestantes e extremistas comunistas já se organizaram. Emissários franceses alertaram sobre uma intervenção caso não cedamos. Poderíamos nos render e nos juntar à França, perdendo nossa independência, ou prender os extremistas que ameaçam nosso governo."
 france_md.313.a: "Viva a revolução"
 france_md.313.b: "Antes morto do que vermelho"
 france_md.314.t: "[FROM.GetName] Junta-se à Revolução Mundial"
 france_md.314.d: "[FROM.GetName] acaba de anunciar a queda de seu governo diante de nossos protestos e pressão diplomática. É uma excelente notícia para nós; uma nova potência se junta à revolução, e tudo sem derramamento de sangue. Outras potências capitalistas anunciaram seu choque com essa mudança dramática na ordem mundial. Podem protestar, mas não podem se opor à vontade do povo. A revolução acabará chegando para elas também. A queda de [FROM.GetName] é apenas o começo; outras virão."
 france_md.314.a: "A Revolução Cresce"
 france_md.315.t: "[FROM.GetName] Recusa a Vontade do Povo"
 france_md.315.d: "Os protestos que exigiam a queda do governo de [FROM.GetName] parecem ter se dissipado. De fato, o governo de [FROM.GetName] os reprimiu violentamente e recusou qualquer compromisso. Se esse surto parece ter superado a vontade do povo, talvez devamos nos envolver mais na revolução em [FROM.GetName]. Nossas forças estão prontas para intervir militarmente para impor a vontade do povo soberano. No entanto, essa intervenção poderia degenerar em um conflito em larga escala. Devemos intervir ou não?"
 france_md.315.a: "A Revolução Virá, Queiram Eles ou Não"
 france_md.315.b: "Voltaremos"
 france_md.316.t: "A Comuna Vitoriosa na Europa"
 france_md.316.d: "Este é um grande dia para nossa Comuna: levamos a revolução a toda a Europa. Desde a queda da União Soviética o continente estava repleto de capitalistas e nacionalistas em ascensão, mas nada nos deteve, nem sanções, bombardeios ou as guerras que travamos para levar o proletariado ao poder. Às vezes tivemos de dar uma lição nos opressores com canhões, mas o triunfo da revolução justifica os meios. Enquanto o exército do povo desfila por Paris, a Europa começa a se reconstruir sobre bases sólidas, longe do capitalismo. Nosso próximo objetivo é realizar o sonho dos internacionalistas de todo o mundo: uma grande federação onde todos os trabalhadores se sintam em casa."
 france_md.316.a: "A Internacional será a humanidade"
 france_md.317.t: "Pelas Ardenas"
 france_md.317.d: "Nosso imperador há muito discute invadir o Benelux, vital para nosso império nascente. A Bélgica abriga uma significativa minoria francófona na Valônia e é o centro nervoso da União Europeia, mas permanece mal defendida, um primeiro alvo perfeito para restaurar nossas fronteiras legítimas. Como pretendemos ocupar essas terras permanentemente, por serem legitimamente nossas, o imperador ordenou que evitemos bombardeios e ataquemos com rapidez, antes que nossos inimigos possam se preparar. É hora de recuperar o berço da nação franca para além das Ardenas."
 france_md.317.a: "Eles não têm chance"
 france_md.318.t: "A Segunda Campanha Espanhola"
 france_md.318.d: "Nosso imperador ordenou a conquista da Península Ibérica, essencial para assegurar nosso flanco ocidental antes da marcha para o leste rumo a Moscou. Tomar a Espanha nos aproxima de Gibraltar, chave para o controle do Mediterrâneo. O terreno montanhoso favorece o defensor, por isso o imperador pede um avanço lento e seguro apoiado por caçadores alpinos, mas exige rapidez antes que nossos inimigos possam se preparar. A derrota de Napoleão nos ensinou que o terreno conquistado deve ser mantido: devemos impor Estados clientes estáveis ou endurecer as forças de ocupação."
 france_md.318.a: "Desta vez os vigiaremos de perto"
 france_md.319.t: "Além do Reno"
 france_md.319.d: "Nosso imperador nomeou nosso próximo adversário: a Alemanha, coração econômico da Europa e devotada a uma visão de Europa que desprezamos. O conflito era inevitável, e marca nosso primeiro passo para o leste rumo a Moscou, nosso inimigo final. Da campanha-relâmpago de Napoleão contra a Prússia a Sedan e duas guerras mundiais, conhecemos bem esse inimigo. O imperador ordena um avanço seguro e preparado com tanques e aviação robustos para garantir nossos objetivos, embora a ocupação total seja desnecessária. Esta guerra é lamentável, mas inevitável."
 france_md.319.a: "Nunca mais outro Sedan!"
 france_md.320.t: "A guerra pelos Alpes"
 france_md.320.d: "Na retirada russa de Napoleão I, os aliados se revoltaram assim que ele se enfraqueceu, por isso, antes de marchar sobre Moscou, nosso imperador nos ordena assegurar nosso flanco sul: a Itália e as antigas terras austro-húngaras. Ameaças menores agora, podem se tornar perigosas se nossa campanha russa se arrastar. Seu terreno montanhoso exige caçadores alpinos e artilharia para desalojar defensores de pontos fortificados, garantindo nossa retaguarda sem desperdiçar homens de que precisaremos para a Rússia. Esses países estão no lugar errado na hora errada."
 france_md.320.a: "Enterraremos o Sacro Império Romano de uma vez por todas!"
 france_md.321.t: "O Imperador Nos Convoca a Nos Preparar para a Guerra"
 france_md.321.d: "Nosso aliado francês convocou uma reunião para discutir a destruição da Rússia, que vê como uma ameaça à Europa e ao império que agora compartilhamos. Ele nos exorta a construir nossas capacidades militares e enviou especialistas em armamentos para otimizar nossa produção, com uma única palavra de ordem: preparar-se para uma guerra longa e difícil. O anúncio é uma notícia sombria para nossos cidadãos, que podem ser chamados a morrer, mas esta guerra é necessária e justa. Devemos proteger a Europa da Rússia antes que nos tornemos seu alvo."
 france_md.321.a: "Obrigado, meu imperador"
 france_md.322.t: "Perfurando o glacis"
 france_md.322.d: "Nossa marcha sobre Moscou é iminente, mas primeiro devemos assegurar nosso ponto de partida: a Europa Oriental, outrora um amortecedor contra a expansão russa, agora um obstáculo à nossa. Estendemos a mão aos dispostos a se juntar a nós; os demais ignoraram nosso apelo, e seu dia de julgamento chegou. Recém-independentes, essas nações não serão difíceis de esmagar. Avançamos rápido com uma ruptura blindada apoiada por artilharia. Lutarão até o fim. Não mostrem misericórdia."
 france_md.322.a: "Os franceses darão ao mundo paz e liberdade"
 france_md.475.t: "A Segunda Campanha Russa"
 france_md.475.d: "Após anos de preparação, chegou a hora. Nosso Imperador emitiu suas ordens finais para a campanha russa, nosso maior adversário e, como para Napoleão I, uma ameaça inevitável. Pela primeira vez ele hesita: nenhum erro é permitido contra uma potência que sempre defendeu seu próprio solo. Seja qual for nossa decisão, a rapidez é essencial, pois o inimigo também se prepara. Faça a escolha certa, mas saiba disto: o povo soberano avançará, tiranos descerão às tumbas para se esconder!"
 france_md.475.a: "Uma ofensiva rápida, estaremos em Moscou em duas semanas!"
 france_md.475.b: "Preparemo-nos para uma guerra de atrito"
 france_md.476.t: "Rompendo o Bloqueio"
 france_md.476.d: "Nossa economia e nosso povo sofreram o bastante nas mãos da pérfida Albion e, agora, com a Europa assegurada, podemos nos voltar contra nosso mais antigo adversário. Apenas o Canal bloqueia nosso caminho até sua ilha miserável. Nosso Imperador oferece duas opções: atacar com superioridade aérea, esmagando-os com bombas antes de lançar nossas forças de paraquedas, ou explorar sua marinha enfraquecida e concentrar nossa frota para um desembarque direto. A rapidez é essencial. Faça a escolha certa, cidadão. Nossa vitória é iminente."
 france_md.476.a: "A marinha deles é agora uma mera sombra do que foi. A La Royale dará cabo dela rapidamente"
 france_md.476.b: "Uma Blitz 2.0, parece bom"
 france_md.477.t: "O Imperador Proclama a Vitória do Sistema Continental"
 france_md.477.d: "Eles nos sancionaram. Nos embargaram. Nos bombardearam. Mas nunca quebraram nosso ânimo. Após anos de guerra, nosso Imperador declarou a vitória: a Europa se curva mais uma vez diante do Império Francês. Essas conquistas custaram milhares de vidas francesas, mártires que não serão esquecidos. O Dia da Vitória agora é feriado nacional em sua memória. Mas nosso triunfo na Europa não resolve nada: mais cedo ou mais tarde enfrentaremos outras potências em outras frentes. A França é eterna. A guerra também."
 france_md.477.a: "O dia de glória chegou"
 france_md.478.t: "Qual Missão para Nosso Reino?"
 france_md.478.d: "Nossa posição à frente do Reino da França está assegurada: esmagamos a Revolução e devolvemos a religião ao seu devido lugar. Agora a questão é por onde começar a restaurar nossa antiga glória. Poderíamos reivindicar nossas terras ancestrais francas, embora isso desencadeasse guerra com antigos aliados que não querem cedê-las, ou poderíamos conquistar o coração dos cristãos de toda parte marchando primeiro para libertar a Terra Santa, poupando-nos de uma guerra em nosso próprio solo. Seja qual for nossa decisão, não temos nada a temer, pois Deus está do nosso lado."
 france_md.478.a: "Somos, antes de tudo, Francos"
 france_md.478.b: "A cruzada não espera, devemos libertar nossos lugares sagrados"
 france_md.479.t: "O Reino da França Exige Nossa Anexação"
 france_md.479.d: "Um pedido muito peculiar chegou esta manhã de nossos colegas franceses. Seu rei não reconhece mais nossa soberania e exige que entreguemos nossos territórios, reservas e exército ao seu comando, prometendo que nossa população será integrada sem atritos. Parece uma brincadeira de 1º de abril, mas o Estado-Maior francês anunciou uma mobilização especial, e todas as evidências apontam para uma intervenção iminente em nosso território. Render-se ou lutar: seja qual for nossa decisão, devemos agir rápido."
 france_md.479.a: "Um conflito causaria sofrimento desnecessário ao nosso povo"
 france_md.479.b: "Como ousam? Somos um país soberano"
 france_md.480.t: "[FROM.GetName] Atende às Nossas Exigências"
 france_md.480.d: "Antes de o primeiro tiro de canhão ser disparado, o governo de [FROM.GetName] anunciou sua dissolução e rendição incondicional ao nosso reino. É uma excelente notícia para o nosso povo e para nossos esforços diplomáticos. Nosso rei prometeu que os novos cidadãos franceses terão seu status regularizado o mais rápido possível e que serão integrados da forma mais eficaz possível. Esta foi a decisão mais sábia que poderiam ter tomado. Não teriam conseguido resistir a uma intervenção de nossa parte."
 france_md.480.a: "Às vezes basta pedir com educação"
 france_md.481.t: "[FROM.GetName] Recusa-se a Ceder"
 france_md.481.d: "O governo de [FROM.GetName] acaba de anunciar que condena nossa tentativa de intimidar seu país. Nossas reivindicações étnicas não teriam lugar à mesa de negociações. Esse revés diplomático era previsível; seria estranho que um país soberano anunciasse sua rendição sem sequer oferecer resistência. Isso é uma sorte, pois de fato nos preparamos para essa eventualidade. Nossas forças estão prontas para intervir em seu solo. Contudo, não é certo que o conflito aberto seja a melhor forma de garantir justiça."
 france_md.481.a: "Vão se arrepender"
 france_md.481.b: "Este não é o nosso fim"
 france_md.482.t: "O Reino da França Exige Nossa Submissão"
 france_md.482.d: "Um pedido muito peculiar chegou esta manhã de nossos colegas franceses. Seu rei, invocando os dias dos carolíngios, não confia mais em nós para proteger o papado em meio à escalada de tensões, e exige o controle total de nosso governo juntamente com o corredor até o Vaticano, que pretende administrar diretamente. Isso é intolerável: nunca falhamos com o papado, e a religião não pode justificar as ambições nacionalistas de nosso vizinho. No entanto, não são ameaças vazias: o Estado-Maior francês ordenou uma mobilização especial, e todas as evidências apontam para uma intervenção em nosso território. Ceder ou lutar: seja qual for nossa decisão, devemos agir rapidamente."
 france_md.482.a: "Não somos páreo para eles"
 france_md.482.b: "Como ousam? Somos um país soberano"
 france_md.483.t: "[FROM.GetName] Recusa-se a Atender às Nossas Exigências"
 france_md.483.d: "O governo de [FROM.GetName] acaba de anunciar que condena nossa tentativa de intimidar seu país. Eles se recusam a se curvar às nossas exigências e desejam defender sua soberania sobre suas decisões e políticas. Parece que rejeitaram nosso apelo à razão. Não podemos deixar que escapem impunes. Nossas forças estão prontas para intervir militarmente em seu país. Não podemos arriscar que nossos adversários unam forças para nos enfrentar. Devemos fazer deles um exemplo. Contudo, uma guerra com [FROM.GetName] talvez não seja o que precisamos."
 france_md.483.a: "Não perceberam que estavam do lado errado da arma"
 france_md.483.b: "Podemos dobrá-los de outras maneiras"
 france_md.484.t: "O Reino da França Exige Nossa Submissão"
 france_md.484.d: "Uma exigência muito peculiar chegou esta manhã de nossos colegas franceses. Seu rei não confia mais em nós para proteger nosso povo e alega que nosso governo está do lado errado do atual equilíbrio de alianças, exigindo o controle total de nosso governo e de nossas forças armadas. Essas exigências são absurdas: nunca falhamos em governar nosso território, e nossa autoridade vem unicamente do mandato de nosso povo. No entanto, não são ameaças vazias: o Estado-Maior francês ordenou uma mobilização especial, e todas as evidências apontam para uma intervenção em nosso território. Ceder ou lutar: seja qual for nossa decisão, devemos agir rapidamente."
 france_md.484.a: "Não somos páreo para eles"
 france_md.484.b: "Só o nosso povo é soberano"
 france_md.485.t: "A Ascensão do Império do Ocidente"
 france_md.485.d: "Após anos de luta e traição, o povo franco triunfou. Quando derrubamos a república usurpadora, a Europa nos ostracizou e sancionou, mas Deus sempre esteve do nosso lado: a França, filha primogênita da Igreja, nunca esteve destinada a uma república. Os inimigos do povo franco estavam fadados a perecer, e agora os Francos recuperaram suas terras. É hora de proclamar nosso Império, o Império do Ocidente, o Império da Fé, consagrado pelo Papado para nossa proteção eterna. Talvez também seja hora de partir para o leste e reconquistar a Terra Santa."
 france_md.485.a: "E desta vez, serei eu a colocar a coroa de louros"
 france_md.485.b: "Deus Vult!"
 france_md.486.t: "O Reino da França Exige Nossa Submissão"
 france_md.486.d: "Um pedido muito peculiar chegou esta manhã de nossos colegas franceses. Seu rei, determinado a levar a termo a Décima Cruzada que lançou, alega que nossos territórios insulares estão em seu caminho e os exige, juntamente com o controle completo de nosso governo, para completar. Isso é intolerável: a religião não pode justificar as ambições nacionalistas de nosso vizinho. No entanto, não são ameaças vazias: o Estado-Maior francês ordenou uma mobilização especial, e todas as evidências apontam para uma intervenção em nosso território. Ceder ou lutar: seja qual for nossa decisão, devemos agir rapidamente."
 france_md.486.a: "Esta é a melhor forma de garantir o sucesso desta campanha; aceitamos"
 france_md.486.b: "Como ousam? Somos um país soberano"
 france_md.487.t: "A Décima Cruzada Vitoriosa"
 france_md.487.d: "Após meses de intensos combates pelo Mediterrâneo e pelo Oriente Médio, saímos vitoriosos. Viajando de ilha em ilha, asseguramos os últimos baluartes cristãos e então sitiamos a própria Jerusalém. Incontáveis adversários se interpuseram em nosso caminho, e muitos franceses morreram ao lado de inocentes que tombaram diante de nosso poder vingativo, mas o fim justifica os meios. Com nossos ganhos consolidados e a instabilidade do Oriente Médio neutralizada, resta uma pergunta: devemos parar aqui ou terminar o que as guerras de religião na Europa não conseguiram realizar?"
 france_md.487.a: "Haverá uma nova cruzada"
 france_md.487.b: "Alcançamos nosso objetivo restaurando o Reino de Jerusalém. Não há necessidade de ir além"
 france_md.488.t: "O Reino da França Nos Exorta a Juntar-nos à Sua Aliança"
 france_md.488.d: "Uma proposta chegou de diplomatas franceses. Tendo concluído sua empreitada no Oriente Médio, o rei da França, como protetor da Igreja Católica, agora declara guerra a todos que rejeitam sua autoridade e nos convida a uma aliança que ele compara à Arca de Noé antes de um dilúvio iminente. O anúncio é tão insano quanto aterrador, acompanhado da mobilização do exército cruzado que agora retorna para casa. A proposta soa mais como um ultimato, dada a ferocidade com que travaram sua cruzada, e deve ser levada a sério. Seja qual for nossa decisão, devemos tomá-la rapidamente."
 france_md.488.a: "É melhor tê-los do nosso lado do que contra nós"
 france_md.488.b: "Eles enlouqueceram?"
 france_md.489.t: "A Décima Primeira Cruzada Vitoriosa na Europa"
 france_md.489.d: "Esta cruzada foi mais sangrenta que a anterior. Também foi mais difícil de conduzir, pois enfrentamos grandes potências. Mas conseguimos. Somos vitoriosos. Contudo, enquanto cuidamos de nossas feridas e reconstruímos nosso país e aqueles que conquistamos, surge uma pergunta. Devemos impor um controle estrito sobre suas políticas para garantir que permaneçam no caminho certo? Ou devemos lhes mostrar a luz e deixá-los decidir por si mesmos? Ao deixá-los escolher, demonstraríamos nossa clemência, e seria menos provável que se revoltassem. Por outro lado, exercer controle mais rígido ajudaria a garantir que nenhuma outra ovelha se desgarre. O que devemos fazer?"
 france_md.489.a: "Precisamos ficar de olho neles"
 france_md.489.b: "Nosso Senhor os julgará quando chegar a hora"
 france_md.490.t: "A Restauração de Nossas Fronteiras Naturais"
 france_md.490.d: "De Richelieu a de Gaulle, a ideia das fronteiras naturais da França nunca foi abandonada: uma preocupação fundamental enraizada tanto nas reivindicações étnicas do povo franco quanto em nossa segurança. Hoje podemos cumprir esse destino. Expulsamos nossos adversários das margens do Reno, asseguramos nossas posições nas montanhas, e as populações locais finalmente aceitaram a nova ordem. Resta apenas formalizar essa anexação. Com ela vingamos a Revolução e abrimos uma era de segurança e prosperidade para o Império e o povo francês."
 france_md.490.a: "As fronteiras da França são definidas pela natureza (Danton, 1793)"
 france_md.491.t: "A União do Povo Franco"
 france_md.491.d: "Por tempo demais, potências que buscam limitar a influência da França frustraram a unidade do povo franco, esculpindo Estados como o Benelux como campo de batalha entre Francos e outros povos germânicos, e nos convencendo de que a União Europeia era nossa verdadeira pátria. Mas o destino dos Francos pertence apenas aos Francos, e nada poderia mantê-los divididos para sempre. Reconquistamos a terra ancestral que deu origem à nação francesa e, após meses, nossos irmãos de sangue perceberam que seu destino está conosco. Agora que o Reino está inteiro, a justiça foi feita."
 france_md.491.a: "Um Estado para todos os Francos"
 france_md.492.t: "O Retorno dos Carolíngios"
 france_md.492.d: "Com a morte de Carlos Magno, seu império foi dividido em Frância Ocidental, Média e Oriental, e o legado do imperador franco começou a se desvanecer enquanto os Francos eram despojados de suas terras. Corrigimos esse erro. Após anos de conflito, expulsamos os usurpadores de nosso território e mostramos a seus habitantes que nunca foram alemães, italianos ou suíços, mas Francos que simplesmente haviam esquecido. Com essa reunificação, reparamos os erros do Tratado de Verdun e mil anos de uma Europa construída sobre falsos alicerces. Este dia marca o início de uma nova Europa franca."
 france_md.492.a: "O império e o Estado franco são um só"
 france_md.493.t: "O Reino de Jerusalém Ressurge"
 france_md.493.d: "Há pouco menos de um milênio, nossos antepassados cruzados viram sua posse mais preciosa lhes ser tomada. Nove Cruzadas não bastaram para conquistar e manter nossos lugares sagrados, mas voltamos para cumprir essa promessa feita ao Senhor. Reconquistamos um ponto de apoio no Oriente Médio nos últimos baluartes cristãos do Líbano e recapturamos Jerusalém e a Terra Santa. Seguiu-se uma luta para estabelecer nosso reino no Oriente Médio e fazer a população entender que os lugares sagrados devem permanecer sob nosso controle para garantir sua segurança."
 france_md.493.a: "A Décima Cruzada triunfa!"
 france_md.494.t: "Um Império Renascido"
 france_md.494.d: "Há cerca de 150 anos o Segundo Império de Napoleão caiu diante da Prússia e dos povos germânicos, iniciando um século de vingança e conflito para a França. Todos previram nosso lento declínio como antiga potência colonial, mas nós, bonapartistas, provamos que estavam errados, arrancando o poder da instável república e restaurando a França à sua antiga glória. Teve um custo, mas recuperamos as fronteiras do Primeiro Império de Napoleão I e expulsamos as potências inimigas. Com esta vitória histórica sobre a Oitava Coalizão, a França mostrou ao mundo que está de volta, e o Sistema Continental agora triunfa na Europa."
 france_md.494.a: "À terceira é a certa"
 france_md.495.t: "O Retorno do Império Colonial"
 france_md.495.d: "Os impérios bonapartistas sempre giraram em torno do domínio da Europa, mas as colônias também importavam muito, da revolta haitiana à expansão de Napoleão III na África. Desde a queda dos impérios coloniais fomos gradualmente expulsos dos países que um dia controlamos, e é hora de restaurar a ordem natural. Nosso Imperador ordenou que nos preparemos para o retorno da França às suas antigas colônias, mobilizando tropas de nossos departamentos e regiões ultramarinos, mais adequadas a esse ambiente. Invadiremos cidades costeiras para assegurar bases navais antes de avançar para o interior, onde o clima se torna mais severo."
 france_md.495.a: "Aqueles dias abençoados das colônias"
 france_md.496.t: "Nosso Suserano Francês Exige Nossa Anexação"
 france_md.496.d: "Deveríamos ter percebido que o controle sobre nossa política imposto pela França mais cedo ou mais tarde acabaria assim. As autoridades francesas acabam de anunciar que nosso país será em breve absorvido pela França. O anúncio não veio do nada: a França há muito cobiça alguns de nossos territórios e parece determinada a tomá-los desta vez. Acreditam que administrarão nosso país melhor do que nós. Nestas horas sombrias, devemos fazer uma escolha não apenas por nossa independência, mas também pela segurança de nosso povo. Ceder ou lutar, estas são as nossas opções. Seja qual for nossa decisão, devemos agir rapidamente."
 france_md.496.a: "Não temos meios de nos opor"
 france_md.496.b: "Esta terra é nossa, que venham tomá-la"
 france_md.497.t: "[FROM.GetName] Revolta-se contra Nossa Suserania"
 france_md.497.d: "O governo de [FROM.GetName] condena nossa tentativa de anexação e está pronto para defender sua independência a qualquer custo. Aceitam a vassalagem, mas recusam-se a ceder os territórios que exigimos, expulsam nossa administração e se preparam para nos enfrentar. Podemos esmagar essa rebelião agora para fazer deles um exemplo, ou adiar a punição para depois, já que nada impede nosso retorno."
 france_md.497.a: "Isto servirá de lição para eles e para qualquer outro que se sinta tentado"
 france_md.497.b: "Esmagaremos-los depois"
 france_md.498.t: "A França propõe investir em nossa indústria"
 france_md.498.d: "Nossos parceiros franceses nos fizeram uma oferta tentadora: a Europa quer redirecionar capacidade de produção que possa controlar, e por isso a França propõe investir em nossa economia ajudando a instalar fábricas em nosso território, como parte de um projeto mais amplo de fortalecer a soberania e a resiliência europeias. Isso nos beneficiaria muito, mas também os franceses, que poderiam obter participação em nosso capital e em nossas empresas. Devemos sacrificar um pouco de soberania para ajudar nossa indústria?"
 france_md.498.a: "Onde assinamos?"
 france_md.498.b: "A Europa e a França não têm nada que se meter em nossa economia"
 france_md.499.t: "A França se Propõe a Investir em Nossa Rede de Infraestrutura"
 france_md.499.d: "Durante uma conversa agradável com nossos parceiros franceses, eles nos fizeram uma oferta bastante atraente. O principal objetivo da Europa é facilitar a circulação de pessoas e mercadorias entre os países da UE, e eles gostariam de ajudar nosso país nesse sentido. O governo francês, portanto, ofereceu-se para investir em nossa rede de transportes, ajudando a modernizar nossa infraestrutura. Essa oferta faz parte integrante de um projeto que visa aumentar a soberania europeia ao mesmo tempo em que ajuda seus Estados-membros a enfrentar crises futuras. A oferta seria muito benéfica para nós, mas também para os franceses, que poderiam ganhar influência sobre a gestão de nossa infraestrutura. Devemos sacrificar um pouco de nossa soberania para modernizar nossa infraestrutura?"
 france_md.499.a: "Onde assinamos?"
 france_md.499.b: "Nossa rede de infraestrutura já vai muito bem sem eles"
 france_md.502.t: "A França se Propõe a Investir em Nossa Transição Ecológica"
 france_md.502.d: "Durante uma conversa agradável com nossos parceiros franceses, eles nos fizeram uma oferta bastante tentadora. Como seu objetivo de longo prazo é tornar a Europa mais sustentável do ponto de vista ambiental, eles propõem que invistamos em conjunto na transição verde. O governo francês, portanto, propôs que invistamos em nossa infraestrutura de produção de energia renovável. A oferta seria muito benéfica para nós, mas também para os franceses, que poderiam ganhar uma posição em nossa geração de eletricidade. Devemos sacrificar um pouco de nossa soberania para avançar em nossa transição verde?"
 france_md.502.a: "Onde assinamos?"
 france_md.502.b: "Não precisamos da transição ecológica deles"
 france_md.520.t: "A Fragmentação Continua"
 france_md.520.d: "Desgraça nunca vem só. Enquanto despencamos nas pesquisas, nosso partido está se despedaçando: nossa ala liberal se reuniu em torno do partido de centro, e o ministro Emmanuel Macron lançou seu próprio partido, La République en Marche, para nos desafiar. Nossa ala esquerda também se desligou, decepcionada com nosso histórico em questões sociais e econômicas, e se reuniu em torno de Jean-Luc Mélenchon para formar um partido radical de esquerda próprio. Esses acontecimentos são desastrosos, mas também são um sinal de que podemos virar o jogo e reconquistar nosso eleitorado antes que seja tarde demais."
 france_md.520.a: "Maldição!"
 france_md.521.t: "Agentes Franceses Violam Nosso Sistema de Defesa"
 france_md.521.d: "Ao raiar do dia de hoje, fomos acordados pelo som de buzinas e colisões. As ruas de nossa capital estão paralisadas por aquilo que parece ser um ato de sabotagem contra nossa infraestrutura de transportes. Nossos técnicos estão fazendo o possível para restabelecer a situação, mas os acidentes já custaram a vida de vários membros de nossa polícia, e tememos que a segurança de nossas forças armadas também esteja em risco. Esse ataque claramente vem da França bonapartista, que há vários meses adota uma retórica hostil contra nós. Precisamos nos preparar antes que esses joguinhos de agentes secretos se tornem rotina."
 france_md.521.a: "Malditos sejam"
 france_md.522.t: "Nossas Forças Policiais Repeliram uma Incursão Francesa"
 france_md.522.d: "Foi com um suspiro de alívio que soubemos que nossas forças policiais conseguiram impedir um ato de sabotagem em larga escala em nossa capital. O inimigo conseguiu escapar, mas evitamos o pior. Mesmo assim, o ataque custou a vida de dois membros de nossa polícia durante confrontos esporádicos nas ruas de nossa capital. Essa operação claramente vem da França bonapartista, que há vários meses adota uma retórica hostil contra nós. Precisamos nos preparar antes que esses joguinhos de agentes secretos se tornem rotina."
 france_md.522.a: "Nem sempre teremos tanta sorte"
 france_md.523.t: "A França Proclama o Terceiro Império"
 france_md.523.d: "A França acaba de declarar o retorno do Império. Algum tempo atrás, uma facção monarquista nacionalista tomou o poder na França e, ao que tudo indica, consolidou seu domínio. Eles organizaram uma grande cerimônia para anunciar o retorno do Império, e agora só se fala nisso. De fato, a cerimônia foi coberta pela mídia e amplamente compartilhada nas redes sociais. Essa celebração não é meramente um evento artístico, é também uma demonstração de força da França. Há vários meses, a França exibe publicamente um desejo de conquista e conflito. Essa proclamação, portanto, não é um fim, mas um começo: o começo de complicações na Europa e ao redor do mundo."
 france_md.523.a: "Devemos levar essa ameaça a sério"
 france_md.523.b: "Eles não são uma ameaça há muito tempo"
 france_md.524.t: "Mais Verbas para o Exército?"
 france_md.524.d: "Nossos recentes investimentos em defesa foram vitais para manter nosso lugar na estratégia de defesa europeia, mas não poderíamos fazer mais? Diante da ameaça do retorno da guerra à Europa, muitos países aliados mobilizaram enormes recursos para preparar suas forças para um conflito de alta intensidade. Talvez devêssemos fazer o mesmo e investir ainda mais em nossa capacidade de produção de armamentos."
 france_md.524.a: "Nunca se é cuidadoso demais"
 france_md.524.b: "Já gastamos muito"
 france_md.525.t: "Os Recursos para Realizar Nossas Ambições"
 france_md.525.d: "Apesar de nossos apelos para que os franceses trabalhem mais e abandonem uma cultura de dependência, a realidade é dura: nosso país carece de empregos estáveis, apesar de uma força de trabalho grande, disposta e talentosa. Poderíamos estimular o emprego injetando fundos em setores estratégicos de nossa economia, já que esperar o mercado se corrigir sozinho pode levar séculos, ou poderíamos financiar nossa indústria de defesa de ponta, inundada de pedidos que não tem recursos para atender, e deixar o setor civil se virar sozinho."
 france_md.525.a: "Nossos cidadãos precisam desses empregos"
 france_md.525.b: "Nossa indústria de defesa fará melhor uso desses fundos"
 france_md.526.t: "Reavivando a Atividade Econômica"
 france_md.526.d: "Anos de ultraliberalismo enfraqueceram nossa economia, mas sobreviver à nossa saída da União Europeia exige uma economia robusta e livre de sanções da UE. Poderíamos investir no capital de empresas privadas francesas para incentivá-las a se instalar na França, reduzindo o envolvimento do Estado na recuperação, embora nada garanta que não investirão em outro lugar onde a mão de obra é mais barata. Ou poderíamos subsidiar diretamente a criação e o crescimento de novas empresas, uma solução que o setor financeiro detestaria, mas que certamente funcionaria."
 france_md.526.a: "Investiremos no mercado, para que eles invistam na França."
 france_md.526.b: "Do ponto de vista humano, o capitalismo não oferece uma solução satisfatória (Charles de Gaulle)"
 france_md.527.t: "Ampliando Nosso Apoio às Áreas Rurais"
 france_md.527.d: "Nosso projeto para levar vitalidade econômica às áreas rurais e periurbanas já está bem encaminhado, e agora precisamos decidir o próximo passo: continuar expandindo as ligações de transporte e os empregos nas regiões menos povoadas, ou voltar-nos para a agricultura e os setores dela dependentes, isolados dos principais centros de decisão e privados dos mesmos privilégios. Subsidiá-los melhoraria seu acesso aos centros de produção e consumo e conquistaria seu apoio."
 france_md.527.a: "Continuaremos levando conectividade e empregos aos subúrbios"
 france_md.527.b: "Vamos dar esse dinheiro ao setor agroalimentar. Eles o usarão melhor."
 france_md.528.t: "A Nova Economia"
 france_md.528.d: "Tendo nos desfeito de indústrias caras e improdutivas que agora estão sendo realocadas, precisamos encontrar novo trabalho para nossa população cada vez mais qualificada, porém ainda subempregada. O setor de serviços é a aposta mais segura para um país desenvolvido como o nosso: gera forte receita, produz pouca poluição direta e faz a ponte entre o setor privado e os consumidores. Mas a França também é conhecida pela pesquisa, da defesa à medicina e à química, e as crises repetidas forçaram cortes profundos no financiamento da ciência. Talvez devêssemos dedicar mais a ela, subsidiando programas de pesquisa."
 france_md.528.a: "O setor de serviços é mais lucrativo e ajudará a reduzir o desemprego"
 france_md.528.b: "Devemos fazer parte dessa sociedade do conhecimento"
 france_md.529.t: "Mais Empregos ou Mais Serviços?"
 france_md.529.d: "Nosso recente investimento em setores produtivos está dando resultado: interrompemos a espiral de empobrecimento e começamos a reconstruir um mercado de trabalho estável. Podemos continuar criando empregos que beneficiarão as gerações futuras, ou voltar-nos para a reconstrução dos serviços públicos que nossos antecessores desmantelaram junto com esses empregos, deixando os cidadãos pagando impostos pesados por serviços cada vez menores. Uma educação melhor tornaria nossos trabalhadores mais eficientes, e uma saúde melhor os faria viver mais. Devemos nos reorientar para os serviços públicos, ou o mercado de trabalho ainda é nossa prioridade?"
 france_md.529.a: "Nossa prioridade é criar mais empregos"
 france_md.529.b: "Já fizemos o bastante no front do trabalho, precisamos reconstruir os serviços públicos"
 france_md.530.t: "Relocalizar Nosso Abastecimento Alimentar"
 france_md.530.d: "Enquanto nos preparamos para trazer nosso abastecimento alimentar de volta para casa, surge uma pergunta: como? Nosso setor agroalimentar poderia nos alimentar sozinho, mas a concorrência desleal nos força a importar bens de que não precisamos, prejudicando o planeta com o transporte e a produção irresponsável no exterior. Poderíamos impor barreiras tarifárias a alimentos de que não precisamos ou que não atendem a nossos padrões, arriscando a ira de nossos parceiros europeus e da OMC. Ou poderíamos permanecer dentro das regras de mercado e subsidiar nosso setor agroalimentar para competir e reduzir nossa dependência de importações. Seja qual for nossa decisão, temos os meios; é uma questão de vontade."
 france_md.530.a: "O mercado e a livre concorrência são nocivos a nossos habitantes e ao nosso planeta"
 france_md.530.b: "Temos de jogar conforme as regras"
 france_md.531.t: "A França Rompe as Leis do Livre Comércio"
 france_md.531.d: "Acabamos de saber, por um comunicado à imprensa do governo francês, que o governo decidiu reintroduzir barreiras alfandegárias sobre as importações de alimentos. Essa medida marca o início do que eles chamam de plano de localização de seu abastecimento alimentar. Embora tenham numerosos argumentos a favor, esse plano viola muitas normas da Organização Mundial do Comércio e da União Europeia. Os franceses assinaram acordos de livre comércio e deveriam ser obrigados a honrá-los. Não é certo que enfrentem sanções, mas essa medida prejudica a integração europeia. Mesmo assim, nosso povo espera nossa resposta a essa questão: eles fizeram a coisa certa ou a errada?"
 france_md.531.a: "Isso é inaceitável"
 france_md.531.b: "Devemos fazer o mesmo"
 france_md.532.t: "Nossa Soberania Econômica"
 france_md.532.d: "Libertar-se dos poderes que por tanto tempo nos controlaram tem um custo: décadas de domínio capitalista venderam grande parte de nossa indústria ao capital estrangeiro, que agora pode fugir, nos forçando a recuperar o setor privado antes que ele entre em colapso. Poderíamos lançar um grande programa de empregos, rápido, mas caro de manter enquanto novos polos são construídos, ou criar vagas nos setores existentes, mais barato e mais sustentável se eles puderem absorver a força de trabalho extra."
 france_md.532.a: "Somos capazes de criar esses novos postos de trabalho em um ano"
 france_md.532.b: "Sem construir mais nada, podemos empregar mais gente nas instalações existentes"
 france_md.533.t: "Rumo a uma Coalizão de Esquerda"
 france_md.533.d: "Após longos meses de negociação, encontramos um terreno comum com uma ampla gama de partidos de esquerda, que concordaram em não se opor ao nosso governo e em se juntar à nossa coalizão sob um programa conjunto por uma França mais justa. É um golpe de mestre: nosso governo vinha sendo contestado por partidos que se recusavam a reconhecer sua legitimidade, e construímos uma maioria mais sólida sem comprometer nossos princípios. O acordo significa um modesto aumento nos benefícios sociais, mas já planejávamos esse aumento de qualquer forma."
 france_md.533.a: "A Ameaça de uma Moção de Desconfiança Está Diminuindo"
 france_md.534.t: "Outros partidos de esquerda rejeitam nossa coalizão"
 france_md.534.d: "Deputados de outros grupos de esquerda anunciaram esta manhã que não apoiarão a coalizão que propusemos, alegando diferenças demais entre nossos programas e prioridades. Essa é uma má notícia para um governo que já luta para manter sua posição em uma Assembleia Nacional dividida. Ainda podemos negociar projeto por projeto, embora sob pressão de todos os lados a cada vez. Esses partidos agiram de forma irresponsável e, embora parte da opinião pública apoie nossa abordagem unitária, isso pode não bastar para garantir a sobrevivência de nosso governo."
 france_md.534.a: "Foi uma Tentativa Valente"
 france_md.535.t: "O Partido Socialista Entra no Governo"
 france_md.535.d: "Após longos meses de negociação, encontramos um terreno comum com o Partido Socialista, que concordou em parar de nos combater e entrar no governo, sob um programa conjunto em grande parte moldado pelo nosso, já que eles não estavam em posição de impor o deles. É um golpe de mestre: nosso governo vinha sendo contestado por partidos que se recusavam a reconhecer sua legitimidade, e construímos uma maioria mais estável a custo mínimo. O acordo exige investimento no setor privado, não exatamente o que nosso eleitorado esperava, mas vale a pena se nos permitir aprovar leis."
 france_md.535.a: "Léon Blum Ficaria Orgulhoso"
 france_md.536.t: "O Partido Socialista se Recusa a Entrar no Governo"
 france_md.536.d: "Deputados socialistas anunciaram esta manhã que não apoiarão nossa proposta de coalizão, alegando diferenças demais entre nossos programas, e claramente ainda guardam ressentimento de nossos ataques a eles durante a campanha. Essa é uma má notícia para um governo que já luta para manter sua posição em uma Assembleia Nacional dividida. Ainda podemos negociar projeto por projeto, embora sob pressão de todos os lados a cada vez. Esses partidos agiram de forma irresponsável e, embora parte da opinião pública apoie nossa abordagem unitária, isso pode não bastar para garantir a sobrevivência de nosso governo."
 france_md.536.a: "Léon Blum está se revirando no túmulo"
 france_md.537.t: "Um Mandato a Cumprir"
 france_md.537.d: "O mandato do Presidente ainda tem dois anos pela frente, e a máquina partidária já discute o que fazer com eles. Podemos governar agora sob as cores do atual ocupante e adotar seu programa como nosso, ou recuar e deixar a eleição de 2002 decidir qual partido lidera a França antes de nos comprometermos com um."
 france_md.537.a: "Governar agora, sob o Presidente em exercício"
 france_md.537.b: "Esperar a eleição de 2002"
 france_md.538.t: "Jacques Chirac está se afastando da política"
 france_md.538.d: "Após a derrota de seu partido nas eleições presidenciais, o ex-presidente Chirac decidiu encerrar sua carreira política. De ministro a presidente, percorreu um longo caminho e viu a França mudar ao longo da Quarta e da Quinta Repúblicas. No entanto, as dificuldades que seu partido enfrentou durante a campanha também estiveram ligadas às suas políticas, que não agradavam a todos. Ainda assim, se há uma lição a tirar de seu fracasso, é que a situação mudou; o mundo não é mais o mesmo, e já não podemos pensar como antes sem correr riscos. Tudo o que podemos fazer agora é esperar que nos saiamos melhor do que ele."
 france_md.538.a: "Isso lhe dará tempo para comer suas maçãs"
 france_md.539.t: "A Queda do Menir"
 france_md.539.d: "Jean-Marie Le Pen, fundador e ex-líder de nosso partido, volta às manchetes pelos piores motivos: após anos de declarações negacionistas do Holocausto e antissemitas, agora ele se recusa a chamar o marechal Pétain de traidor. Desde que se afastou, entrou em choque com a nova direção do partido em temas que vão das aposentadorias aos conflitos do século passado, e suas declarações nos impedem de finalmente ocupar nosso lugar na corrente republicana dominante. Poderíamos expulsá-lo, embora isso arrisque alienar a velha guarda que compartilha de suas opiniões. Queremos mesmo transformar nosso partido segundo padrões republicanos, ou arriscar perder nossa identidade?"
 france_md.539.a: "Ele se tornou um incômodo, devemos expulsá-lo do partido"
 france_md.539.b: "Basta lembrá-lo de se comportar"
 france_md.540.t: "Da Frente ao Rassemblement"
 france_md.540.d: "Após numerosos debates internos e conferências em seu partido, figuras de destaque da Frente Nacional anunciaram mudanças significativas nas políticas e no status do partido. O partido passará a se chamar Reagrupamento Nacional e está claramente determinado a se livrar do rótulo de partido de extrema direita. Para isso, anunciaram a expulsão de numerosos militantes considerados extremistas demais e reafirmaram seu compromisso de permanecer na União Europeia. Esse desdobramento marca a etapa final do declínio da antiga Frente Nacional, que é reformulada para parecer mais aceitável. Embora essas mudanças sejam pequenas, devemos fazer o possível para impedir que o público acredite que isso muda alguma coisa."
 france_md.540.a: "Eles continuam perigosos, mesmo assim"
 france_md.541.t: "A Queda da Santa Sé"
 france_md.541.d: "Uma potência estrangeira ocupa atualmente o Vaticano. Não podemos, portanto, garantir a segurança do papado enquanto o Vaticano permanecer sob controle de nossos adversários. Contudo, nosso país já abrigou o papado no Palácio dos Papas em Avignon. Não há, portanto, nada que nos impeça de levar o Colégio de Cardeais e o atual Papa para Avignon. Será uma mudança marcante para toda a cristandade, mas, com o Vaticano ocupado, somente nós somos poderosos o bastante para garantir a proteção da Igreja, como nosso Reino sempre fez."
 france_md.541.a: "O Papado estará seguro aqui conosco."
 france_md.550.t: "Nicolas Sarkozy Vence a Presidência"
 france_md.550.d: "O segundo turno confirmou o que as pesquisas sugeriam. Nicolas Sarkozy, o ministro do Interior que construiu sua reputação sobre uma linha dura contra a agitação urbana, levou a União por um Movimento Popular ao Eliseu com clara margem sobre Ségolène Royal. A campanha foi travada em torno de trabalho, autoridade e identidade nacional, e o comparecimento foi o maior em uma geração. O novo presidente promete uma ruptura com os anos Chirac: reforma da previdência, um mercado de trabalho mais rígido e o retorno da França ao comando integrado da Aliança Atlântica. Seus opositores alertam que a ruptura será sentida com mais força por aqueles que menos podem arcar com ela."
 france_md.550.a: "Trabalhar mais para ganhar mais."
 france_md.551.t: "François Hollande Vence a Presidência"
 france_md.551.d: "Após cinco anos de presidência Sarkozy, os socialistas voltaram ao poder. François Hollande, por muito tempo visto como um gestor partidário e não um estadista, venceu o segundo turno com uma plataforma de justiça fiscal, um tratado orçamentário europeu renegociado e a retirada do Afeganistão. A crise financeira e a emergência da zona do euro dominaram todos os debates, e o presidente que saía não pôde escapar de seu histórico. A nova administração herda uma economia estagnada, um déficit pressionado e uma parceria europeia que espera que a França lidere em vez de objetar."
 france_md.551.a: "A mudança é agora."
 france_md.552.t: "Emmanuel Macron Vence a Presidência"
 france_md.552.d: "O velho sistema partidário ruiu. Nem os socialistas nem os republicanos chegaram ao segundo turno, e a disputa final foi travada entre um movimento fundado há pouco mais de um ano e a Frente Nacional. Emmanuel Macron, ex-banqueiro de investimentos e ministro da Economia, venceu com folga numa plataforma de liberalização do mercado de trabalho, integração europeia e uma política que se diz nem de direita nem de esquerda. Seu movimento agora enfrenta as eleições legislativas sem base parlamentar e sem máquina local, e seus opositores de ambos os flancos já estão se organizando nas ruas."
 france_md.552.a: "Nem direita, nem esquerda."
 france_md.553.t: "Emmanuel Macron É Reeleito"
 france_md.553.d: "Pela segunda vez, o segundo turno colocou o presidente contra o Reagrupamento Nacional e, pela segunda vez, a frente republicana resistiu, embora por uma margem menor que cinco anos atrás. A campanha foi ofuscada pela guerra na Europa, pelos preços da energia e por uma reforma da previdência que o presidente prometeu levar adiante de qualquer maneira. Ele se torna o primeiro presidente francês em vinte anos a vencer um segundo mandato, e o primeiro a fazê-lo com uma extrema direita que nunca esteve tão perto do poder."
 france_md.553.a: "Um segundo mandato, e mais apertado."
 france_md.503.t: "Oposição a [FRA.GetLeader]: Qual É a Tendência?"
 france_md.503.d: "À medida que o mandato do Presidente [FRA.GetLeader] chega ao fim, a campanha presidencial entra na reta final e o equilíbrio de forças eleitorais fica claro. O favorito, Lionel Jospin, serviu como Primeiro-Ministro sob Chirac, adotando políticas social-democratas alinhadas aos padrões europeus e se distanciando da tradição socialista: moderno, mas não socialista. Vários candidatos de esquerda, dos Verdes e do Partido Comunista Francês, não têm recursos para vencer diretamente, mas ainda podem ganhar impulso. A esquerda como um todo é a clara favorita, ou suas divisões podem levar outro candidato ao segundo turno?"
 france_md.503.a: "A esquerda está conseguindo conquistar o eleitorado"
 france_md.503.b: "Nenhum dos candidatos de esquerda obteve o apoio que esperava"
 france_md.986.t: "Lionel Jospin Enfrenta Críticas"
 france_md.986.d: "Embora seja o candidato favorito da esquerda na próxima eleição, Lionel Jospin não goza de apoio unânime na esquerda quanto a seu programa, visto por alguns como liberal demais e parecido demais com o de Chirac. Opondo-se a ele está o Partido Comunista Francês; embora hoje seja uma sombra do que foi desde o fim da Guerra Fria, ainda tem aliados na esquerda radical e pode atrair os desiludidos com o segundo mandato do ex-presidente Mitterrand. Poderia atacar Jospin por sua guinada ao liberalismo, mas o fará?"
 france_md.986.a: "O PCF decidiu não atacar Lionel Jospin"
 france_md.986.b: "O PCF conseguiu conquistar eleitores de esquerda"
 france_md.986.c: "Um ataque inconclusivo do PCF"
 france_md.987.t: "Lionel Jospin Muito à Frente"
 france_md.987.d: "O triunfo de Lionel Jospin e do Partido Socialista é indiscutível dentro da esquerda. Embora antes tenha sido alvo de críticas, seus opositores não estão em posição de desafiá-lo nem de chegar ao segundo turno. Concordemos ou não com seu programa, será ele contra [FRA.GetLeader] no segundo turno da eleição presidencial."
 france_md.987.a: "Não poderia ter sido de outra forma"
 france_md.988.t: "Ressurgimento Comunista"
 france_md.988.d: "Atacar Jospin por seus laços com a esquerda foi a decisão certa. O voto socialista se dividiu entre esquerda e centro, dando ao PCF a credibilidade que lhe faltava para liderar a oposição às políticas liberais e conservadoras que prevalecem há tempo demais. O PCF garantiu uma aliança com outros parceiros de esquerda, como a Liga Comunista Revolucionária e a Lutte Ouvrière. No entanto, os centristas insatisfeitos com [FRA.GetLeader] teriam preferido Jospin a uma aliança radical, e provavelmente votarão contra nós no segundo turno. Talvez possamos arranjar investimentos locais em suas cidades em troca de seu silêncio."
 france_md.988.a: "Os centristas se absterão"
 france_md.988.b: "Os centristas convocarão uma frente unida contra a extrema esquerda"
 france_md.989.t: "Um Favorito Improvável"
 france_md.989.d: "A reta final desta campanha presidencial se mostrou turbulenta para muitos partidos. Após os ataques do PCF a Lionel Jospin, comunistas e socialistas travaram uma implacável batalha midiática e, como nenhum dos lados defendeu bem sua causa, o eleitorado de esquerda se voltou para um candidato menos controverso e mais comedido. O Partido Verde aproveitou a oportunidade para se apresentar como a voz da calma e da razão em meio à tempestade. É, portanto, muito provável que os Verdes cheguem ao segundo turno, onde enfrentarão um ex-presidente enfraquecido pelo fim de seu mandato."
 france_md.989.a: "Quem teria acreditado?"
 france_md.990.t: "Nem Esquerda, Nem Direita"
 france_md.990.d: "Com os conservadores já no segundo turno e a esquerda em desordem, o ex-presidente parece certo de vencer, embora permaneçam incertezas. Alguns franceses estão cansados da divisão esquerda-direita que moldou a política por décadas, que já não se adapta a uma época voltada para a estabilidade e a integração europeia. A liberal União pela Democracia Francesa tem, portanto, um argumento a apresentar: a política independentista de Chirac já não pesa muito em um mundo onde novas potências e blocos estão surgindo. O centro liberal tem um papel a desempenhar, mas conseguirá convencer o eleitorado dessa nova realidade?"
 france_md.990.a: "Os Liberais conseguirão captar a atenção das pessoas"
 france_md.990.b: "Os Franceses Continuam Apegados à sua Soberania"
 france_md.991.t: "O Campo Soberanista Dividido"
 france_md.991.d: "Com o centro liberal incapaz de defender sua causa, os eleitores cansados da divisão esquerda-direita se voltaram para os soberanistas. Esse campo, porém, fala com duas vozes. O Reagrupamento pela República leva a tradição gaullista de independência nacional para a corrente dominante, respeitável e apto a governar, enquanto a Frente Nacional oferece uma linha mais dura que os partidos estabelecidos passaram duas décadas contendo. Ambos reivindicam o mesmo eleitorado desiludido. Qual deles chegar ao segundo turno decidirá se o euroceticismo francês continua sendo assunto da direita governante ou rompe de vez o cordão sanitário."
 france_md.991.a: "A tradição gaullista ainda comanda o voto soberanista"
 france_md.991.b: "A Frente Nacional tirará proveito do descontentamento"
 france_md.510.t: "Ninguém Poderia Ter Previsto"
 france_md.510.d: "Dada a incapacidade dos partidos de captar a atenção dos eleitores, nenhum deles tem força para chegar ao segundo turno contra [FRA.GetLeader]. Beneficiando-se do desaparecimento de seus rivais dos holofotes, a Frente Nacional escapou de suas controvérsias e, apesar de seu líder Jean-Marie Le Pen, poderia conceivelmente se classificar. Continua improvável: Lionel Jospin ainda é o favorito, e certamente perderia para [FRA.GetLeader]. Mas, se a FN chegar ao segundo turno, como reagiriam os outros partidos?"
 france_md.510.a: "Os partidos não se preocuparão com a ascensão do extremismo"
 france_md.510.b: "Todos os partidos convocarão os eleitores a votar contra a Frente Nacional"
 france_md.511.t: "Dia da eleição"
 france_md.511.d: "Após meses de uma campanha turbulenta e cheia de reviravoltas, finalmente chegou a hora de os franceses votarem. Este é apenas o primeiro turno, destinado a reduzir o campo aos dois candidatos que obtiveram mais apoio do público francês. Um segundo turno será então realizado para decidir entre eles, caso nenhum candidato obtenha maioria."
 france_md.511.a: "Vamos votar!"
 france_md.512.t: "Prevê-se que a Frente Nacional Vença a Eleição Presidencial"
 france_md.512.d: "Para surpresa de todos, a Frente Nacional saiu vitoriosa do primeiro turno, quando todas as previsões apontavam para um duelo entre Jospin e [FRA.GetLeader]. Dada a incapacidade dos demais candidatos de conquistar o eleitorado, a Frente chegou ao segundo turno, e a situação parece sombria para [FRA.GetLeader]: os outros partidos não convocaram os eleitores a apoiá-lo, suas políticas sendo controversas demais para alguns. Espera-se que uma parte do eleitorado se una contra o candidato de extrema direita, mas derrotar Le Pen, que se apresenta como a opção antissistema, está longe de ser garantido."
 france_md.512.a: "O que acabou de acontecer?"
 france_md.513.t: "A Frente Nacional Chega ao Segundo Turno"
 france_md.513.d: "Para surpresa de todos, a Frente Nacional saiu vitoriosa do primeiro turno, quando todas as previsões apontavam para um duelo entre Jospin e [FRA.GetLeader]. Dada a incapacidade dos demais candidatos de conquistar o eleitorado, a Frente chegou ao segundo turno. Felizmente, [FRA.GetLeader] deve sair vencedor: partidos políticos e sociedade civil, chocados com a chegada de um partido de extrema direita ao segundo turno, convocaram um voto maciço contra Le Pen. Grandes manifestações ocorreram por todo o país em apoio ao presidente que sai. Este é um acontecimento histórico; esperemos que seja o único."
 france_md.513.a: "Como diabos fomos parar nesta situação?"
 france_md.514.t: "PCF Declarado Vencedor da Eleição Presidencial"
 france_md.514.d: "Para surpresa de todos, o Partido Comunista Francês saiu vitorioso do primeiro turno, meses depois de definhar em seu pior momento desde o fim da Guerra Fria. As fraquezas do candidato Jospin e uma aliança da esquerda radical permitiram ao PCF reunir a esquerda e garantir uma clara liderança rumo ao segundo turno, com socialistas e centristas concordando em não se opor a ele, desde que não saia da UE. Seu líder equilibrou a oposição à ordem liberal com reformismo para não alienar o centro. A vitória do PCF está fora de dúvida, mas ele conseguirá manter sua coalizão unida?"
 france_md.514.a: "Dias melhores finalmente chegaram"
 france_md.515.t: "O PCF Chegou ao Segundo Turno"
 france_md.515.d: "Para surpresa de todos, o Partido Comunista Francês saiu vitorioso do primeiro turno, poucos meses depois de definhar em seu pior momento desde o fim da Guerra Fria. As fraquezas do candidato Jospin e uma aliança da esquerda radical permitiram ao PCF garantir um lugar no segundo turno. Sua vitória, porém, não é completa: os centristas anunciaram que votarão em [FRA.GetLeader], vendo um triunfo da esquerda radical como mau presságio para a integração europeia e para os mercados. O segundo turno ainda não ocorreu, mas há grande probabilidade de que [FRA.GetLeader] triunfe mais uma vez."
 france_md.515.a: "Foi por pouco"
 france_md.516.t: "O RPF Chegou ao Segundo Turno"
 france_md.516.d: "Para surpresa de todos, o presidente que sai foi eliminado do segundo turno, derrubado por seu próprio partido: o gaullista Charles Pasqua conseguiu atrair conservadores e soberanistas suficientes da direita para atrapalhar a campanha de [FRA.GetLeader]. O RPF, porém, não está sozinho no segundo turno. Lá, enfrentará Lionel Jospin, o candidato socialista que chegou à final apesar das divisões internas da esquerda. Essa disputa será acirrada, pois não se trata simplesmente de socialismo contra conservadorismo: na próxima semana, o povo francês decidirá se quer mais ou menos Europa."
 france_md.516.a: "A soberania prevalecerá"
 france_md.516.b: "O voto de protesto continua minoritário"
 france_md.517.t: "A UDF Chega ao Segundo Turno"
 france_md.517.d: "A união dos eleitores pró-europeus em torno da UDF permitiu ao partido chegar ao segundo turno. Os socialistas não eram os únicos a promover a União Europeia, e os liberais estavam mais próximos dos valores liberais da União Europeia. As pessoas costumam preferir o original à imitação. A UDF conseguiu, assim, se juntar ao presidente em exercício no segundo turno. Trata-se, portanto, de uma disputa entre a política independentista de Chirac e a postura de Europa a qualquer custo dos liberais. Esta eleição deve ser apertada, pois os principais blocos estão eles próprios profundamente divididos nessa questão. Felizmente, não teremos de esperar muito, pois o segundo turno está logo ali."
 france_md.517.a: "O velho conservador é mantido à distância"
 france_md.517.b: "O programa da UDF está se mostrando um pouco liberal demais para o eleitorado"
 france_md.518.t: "Os Verdes Chegam ao Segundo Turno"
 france_md.518.d: "Após uma campanha entre os partidos de esquerda, os Verdes conseguiram, para surpresa de todos, chegar ao segundo turno. Seu programa social e ambiental está na vanguarda do progresso e, tendo mantido a calma em meio aos confrontos entre PCF e PS, passaram a encarnar a solução mais sábia e mais justa. Agora se juntam ao presidente que sai no segundo turno. A disputa deve ser acirrada, mas, pela primeira vez, há unanimidade dentro de cada bloco: a esquerda vota pelo progressismo, a direita pelo conservadorismo, e o embate da próxima semana será tanto sobre o meio ambiente quanto sobre questões sociais."
 france_md.518.a: "Um software conservador e ultrapassado já não está à altura dos desafios do nosso milênio"
 france_md.518.b: "O meio ambiente ainda não recebe prioridade suficiente."
 france_md.519.t: "Lionel Jospin Se Classificou para o Segundo Turno"
 france_md.519.d: "Como previsto por todas as pesquisas, o candidato socialista chegou ao segundo turno sem muita dificuldade. Seu programa moderno e pró-europeu conquistou tanto socialistas quanto centristas, dando-lhe uma forte base eleitoral, enquanto os partidos de esquerda mais radicais, profundamente divididos, não representaram ameaça ao ex-Primeiro-Ministro. Ele agora enfrentará seu rival esta semana, mais uma vez o embate entre progressismo e conservadorismo. Mas as pesquisas estão apertadas, e Jospin pode precisar do apoio dos partidos de esquerda, já que o RPR poderia se beneficiar de grupos mais à direita que não aceitam um presidente socialista."
 france_md.519.a: "Jospin consegue conquistar o resto da esquerda"
 france_md.519.b: "Jospin não conseguiu conquistar os eleitores mais à esquerda, pois seu programa era liberal demais"
 FRA_Macron_eco: "A Lei Macron"
 FRA_Macron_eco_desc: "Decidimos seguir a política traçada por nosso Ministro das Finanças, Emmanuel Macron. Uma lei que simplificará o investimento e o emprego ao mesmo tempo em que corta os gastos do governo."
 FRA_Ferrand_eco: "A Lei Ferrand"
 FRA_Ferrand_eco_desc: "Decidimos seguir a política traçada por nosso Ministro das Finanças, Olivier Ferrand. Uma lei que simplificará o investimento e o emprego ao mesmo tempo em que corta os gastos do governo."
 FRA_ineluctable_collapse: "Coalizão em Colapso"
 FRA_ineluctable_collapse_desc: "Nosso partido e nossa coalizão estão desmoronando; precisamos resolver isso rapidamente antes que seja tarde demais!"
 FRA_manif_pour_tous: "La Manif pour Tous"
 FRA_manif_pour_tous_desc: "Centenas de milhares nas ruas todo mês, um movimento conservador que a direita não conseguiu construir em vinte anos e um partido governante que agora precisa legislar em meio a ele."
 FRA_grand_debat: "Le Grand Débat National"
 FRA_grand_debat_desc: "Dez mil assembleias municipais, dois milhões de contribuições e um pacote de concessões pesado o bastante para esvaziar as rotatórias. A paz foi real. A conta também."
 FRA_bassin_minier: "A Promessa da Bacia Mineira"
 FRA_bassin_minier_desc: "Fornos reacesos e vagas abertas na antiga região carbonífera e no Midi. A promessa segura a extrema direita enquanto for cumprida."
 FRA_resist_inevitable: "Efforts de Stabilisation"
 FRA_resist_inevitable_desc: "O declínio não é irreversível. Nossos militantes voltaram a bater de porta em porta, e a debandada de eleitores desacelerou."
 FRA_resist_inevitable2: "Efforts de Stabilisation"
 FRA_resist_inevitable2_desc: "A sangria parou. Estabilizamos o partido e voltamos nossa atenção para a base industrial da qual nossos eleitores dependem."
 FRA_resist_inevitable3: "Efforts de Stabilisation"
 FRA_resist_inevitable3_desc: "Sobrevivemos aos obituários. O partido volta a pisar em terreno firme, com uma base estável e um programa ao qual nossos rivais agora precisam responder."
 FRA_socialism_renew: "Socialismo Renovado"
 FRA_socialism_renew_desc: "Reconstruímos a legitimidade de nosso partido sobre alicerces sólidos. O futuro está diante de nós."
 FRA_pension_reform: "Reforma da Previdência"
 FRA_pension_reform_desc: "Diante da crise orçamentária que enfrentamos, tivemos de elevar a idade de aposentadoria de nossos cidadãos; eles não gostaram, mas era preciso fazê-lo"
 FRA_french_rearmament: "Rearmamento, Fase 1"
 FRA_french_rearmament_desc: "Com as tensões voltando a aumentar na Europa, não temos escolha senão nos rearmar para evitar o pior."
 FRA_french_rearmament2: "Rearmamento, Fase 2"
 FRA_french_rearmament2_desc: "Treinar mais soldados não basta; precisamos aumentar nossa capacidade de produzir armas"
 FRA_french_rearmament3: "Rearmamento Concluído"
 FRA_french_rearmament3_desc: "Nossa população e nossas forças armadas estão preparadas para enfrentar um conflito de grande escala"
 french_nuclear_expert: "Especialistas Nucleares Franceses"
 french_nuclear_expert_desc: "Aceitamos a ajuda de especialistas franceses em tecnologia nuclear. Eles nos ajudarão a construir nossa independência energética."
 french_dissuasion: "Dissuasão Nuclear Francesa"
 french_dissuasion_desc: "Concordamos em aceitar a proteção da França e da União Europeia em caso de conflito com uma potência hostil."
 FRA_Our_project: "Nosso Projeto para a França"
 FRA_Our_project_desc: "Apesar da resistência inicial do público, as pessoas passaram a compreender que tudo o que fazemos deve ser feito para proteger o futuro da França. Mais do que nunca, estamos protegidos das turbulências econômicas e geopolíticas. E assim será por muito tempo."
 FRA_french_independant1: "Um Rumo Próprio"
 FRA_french_independant1_desc: "A França não se alinhará a nenhum dos blocos. Manter-se à parte nos garante a atenção de todas as outras potências que se recusam a escolher um senhor."
 FRA_french_independant2: "Sem Prestar Contas a Nenhuma Capital"
 FRA_french_independant2_desc: "Nossa recusa a nos alinhar se consolidou como política estabelecida. Nem Washington nem Moscou esperam mais nosso voto, e o mundo não alinhado nos trata como um dos seus."
 FRA_french_independant3: "Independência Sob Armas"
 FRA_french_independant3_desc: "A independência já não é uma postura diplomática, mas uma doutrina defensiva. Uma nação que não responde a ninguém precisa ser capaz de defender seu território sem ajuda, e a nossa agora é."
 FRA_NATO_support: "Apoio à OTAN"
 FRA_NATO_support_desc: "Ao reafirmar nosso apoio à aliança, forjamos parcerias com outros países-membros."
 FRA_entente_china: "Entente com a China"
 FRA_entente_china_desc: "Concluímos acordos com a China para facilitar o comércio entre nosso país e o deles."
 FRA_regulation: "Regulação do Mercado"
 FRA_regulation_desc: "Ao concordar em regular o mercado e suas atividades, podemos evitar crises futuras."
 FRA_eternal_fra: "França Eterna"
 FRA_eternal_fra_desc: "Estamos chegando ao fim de nosso programa, confiantes de que mostramos ao mundo que a França está de volta e jamais desaparecerá do cenário internacional."
 FRA_europhile_anger_idea: "Manifestações Pró-Europeias"
 FRA_europhile_anger_idea_desc: "Alguns membros de nossa população relutam em deixar a União Europeia. Isso durará apenas um tempo, mas devemos garantir que o povo francês entenda que este é o único caminho a seguir."
 FRA_EU_Retaliate: "Economia em Recuperação"
 FRA_EU_Retaliate_desc: "Sair da União Europeia nos colocou em uma situação econômica difícil, mas nos recuperaremos, custe o que custar."
 FRA_EU_Retaliate2: "Recuperação Inicial"
 FRA_EU_Retaliate2_desc: "Nossos esforços começam a dar frutos; nossa economia está se recuperando e, desta vez, não há ninguém para nos pressionar ou nos impedir de fazer o que quisermos com nosso dinheiro."
 FRA_russian_cooperation1: "A Cooperação Russa"
 FRA_russian_cooperation1_desc: "O governo russo concordou em compartilhar conosco sua experiência industrial. Que esta cooperação continue."
 FRA_russian_cooperation2: "A Parceria Russa"
 FRA_russian_cooperation2_desc: "O governo russo concordou em compartilhar conosco sua experiência industrial e militar. Que esta cooperação continue."
 FRA_a_certain_idea: "Uma Certa Ideia da França"
 FRA_a_certain_idea_desc: "Conseguimos chegar ao fim de nossa jornada. Resgatamos a França de ser deixada de lado em favor da Europa. A independência da França está garantida. Nosso mestre Charles de Gaulle se orgulharia de nós."
 FRA_blocade: "Fluxos Comerciais Interrompidos"
 FRA_blocade_desc: "Recusamo-nos a ceder à chantagem da França, e por isso eles estão fazendo todo o possível para impedir que mercadorias do resto da União Europeia cheguem até nós."
 FRA_shocking: "População Decepcionada"
 FRA_shocking_desc: "Nosso povo estava muito entusiasmado com o plano da Sexta República, mas no fim decidimos manter a constituição como estava. Eles não ficaram satisfeitos com isso."
 FRA_draft6threp: "Instabilidade Política"
 FRA_draft6threp_desc: "Nosso desejo de uma mudança radical na constituição de nossa república gerou grande entusiasmo na população. Isso abre novos horizontes para o povo. No entanto, também abre caminho para o surgimento de novos movimentos políticos que nem sempre nos serão favoráveis."
 FRA_fail6threp: "O Fracasso da Reforma"
 FRA_fail6threp_desc: "Não conseguimos libertar nosso povo da Quinta República; no fim, ele perdeu a esperança diante da dificuldade de alcançar um consenso. Talvez consigamos promover uma mudança em nossas leis, mas, no que diz respeito ao nosso povo, teremos fracassado em trazer a mudança que ele esperava."
 FRA_ecological_transition: "Garantir a Transição Ecológica"
 FRA_ecological_transition_desc: "Para garantir um futuro às próximas gerações, precisamos proteger o meio ambiente. Para isso, devemos mudar a forma como consumimos e produzimos."
 FRA_insoumission: "L'Insoumission"
 FRA_insoumission_desc: "Cumprimos com sucesso o programa pelo qual fomos eleitos. Tornamos a França mais socialmente engajada, ambientalmente consciente e humanista do que nunca. Mas ainda temos muito a realizar, e estaremos à altura do desafio. Devemos fazer ainda melhor."
 FRA_eu_social_climate: "Reformas Sociais e Ambientais"
 FRA_eu_social_climate_desc: "Concordamos em seguir o exemplo dado pela La France Insoumise. Nosso povo se inspirou em seu exemplo. Embora isso esteja pesando em nossas finanças, pode ser visto como um investimento de longo prazo."
 FRA_research_boost: "Investimentos em Pesquisa"
 FRA_research_boost_desc: "Investimos pesadamente em pesquisa e educação para garantir que as gerações futuras estejam ainda mais bem preparadas para lidar com os desafios modernos. Isso deve compensar a longo prazo."
 FRA_refit_network: "Readequação de Nossa Rede de Transportes"
 FRA_refit_network_desc: "Para otimizar o transporte de mercadorias e passageiros, primeiro precisamos modernizar nossa rede de transportes. Reservamos os recursos necessários para isso."
 FRA_eden_garden: "Nosso Jardim do Éden"
 FRA_eden_garden_desc: "Ao fazer o possível para proteger nosso país e o mundo dos estragos das mudanças climáticas, lançamos as bases de uma sociedade preparada para enfrentar os desafios do nosso milênio. Combater as mudanças climáticas exigirá novos esforços, mas fizemos o melhor para liderar o movimento."
 FRA_eu_green_reform: "Reformas Ambientais"
 FRA_eu_green_reform_desc: "Decidimos seguir o exemplo dos Verdes franceses investindo na transição verde. Embora isso desacelere o crescimento de nosso país, é um investimento nas gerações futuras."
 FRA_EU_transit: "Fundo de Apoio à Transição Ecológica"
 FRA_EU_transit_desc: "Concordamos em fazer parte do fundo de apoio à transição ecológica. Essa iniciativa foi lançada pelos Verdes franceses e visa nos ajudar a passar de uma economia baseada em carbono para uma economia de baixo carbono."
 FRA_eu_ban_fossile: "Eliminação Gradual dos Combustíveis Fósseis"
 FRA_eu_ban_fossile_desc: "Estamos eliminando gradualmente os combustíveis fósseis. Nossos veículos andarão a eletricidade, e os combustíveis fósseis só serão usados para fins marginais. Essa transição, iniciada pelos Verdes franceses, será cara. Mas é um investimento em nosso futuro e em nossa independência dos países produtores de petróleo."
 FRA_regulation_agra: "Regulamentações Agrícolas"
 FRA_regulation_agra_desc: "Concordamos em cumprir as regulamentações de produção de alimentos da União Europeia. Era nossa única opção se não quiséssemos perder um parceiro comercial essencial."
 FRA_regulation_indus: "Regulamentações Industriais"
 FRA_regulation_indus_desc: "Concordamos em cumprir as regulamentações de produção de bens da União Europeia. Era nossa única opção se não quiséssemos perder um parceiro comercial essencial."
 FRA_regulation_fuel: "Regulamentações sobre Extração de Petróleo"
 FRA_regulation_fuel_desc: "Concordamos em cumprir as regulamentações de extração de combustíveis da União Europeia. Era nossa única opção se não quiséssemos perder um parceiro comercial essencial."
 FRA_EU_rail: "Construindo uma Rede de Transportes Europeia"
 FRA_EU_rail_desc: "Concordamos em ajudar a França e o resto da União Europeia a trabalhar juntas na construção de uma rede de transportes melhor, para facilitar o comércio e otimizar o transporte de mercadorias."
 FRA_eu_pcf_reform: "Comprando a Paz Social"
 FRA_eu_pcf_reform_desc: "Concordamos em fazer concessões à nossa esquerda radical depois que ela começou a se agitar após a vitória do comunismo na França. Demos a eles o que queriam, e agora devem ficar quietos."
 FRA_fr_military_assistance: "Assistência Militar Francesa"
 FRA_fr_military_assistance_desc: "Aceitamos a ajuda da França para preparar nossas forças armadas para um conflito de alta intensidade com a Rússia. No dia em que cruzarem nossa fronteira, estaremos prontos."
 FRA_european_internationale: "A Internacional Europeia"
 FRA_european_internationale_desc: "Formamos uma aliança com outra potência comunista na Europa. Juntos derrotaremos o capitalismo e o fascismo de uma vez por todas."
 FRA_international_will_be_humankind: "A Internacional será o gênero humano"
 FRA_international_will_be_humankind_desc: "Conseguimos consolidar o poder duramente conquistado. Alcançamos o impossível: garantimos o triunfo duradouro do comunismo na França. Ainda há muito a fazer, mas lançamos as bases certas para a luta contra o capitalismo e o fascismo na França."
 FRA_eu_FN_reform: "Garantindo a Segurança"
 FRA_eu_FN_reform_desc: "Respondemos positivamente ao apelo de nosso povo para implementar a preferência nacional e combater a insegurança. Embora essas reformas sejam consequência da ascensão da extrema direita na Europa, elas também fortalecem nossa capacidade de exercer controle sobre nossa população, o que é bom."
 FRA_nuke_boost: "Primazia Nuclear"
 FRA_nuke_boost_desc: "A energia nuclear nos fornece energia há décadas; é uma forma fantástica de gerar energia de baixo carbono a baixo custo. Basta intensificarmos o monitoramento desses reatores para garantir que nada grave aconteça."
 FRA_Boreal_Space: "O Espaço Boreal"
 FRA_Boreal_Space_desc: "O Espaço Boreal é uma parceria entre a Esfera Russa e a Francosfera, com o objetivo de integrar a Rússia a uma aliança europeia. Nosso objetivo hoje é combater a ameaça ultraglobalista, um inimigo que compartilhamos."
 FRA_france_for_french: "França para os Franceses"
 FRA_france_for_french_desc: "Desde a nossa fundação, tivemos de lidar com uma facção pró-imigração que sempre esteve unida contra nós. Mas agora que concluímos nosso programa, demonstramos nossa capacidade de liderar e guiar a França rumo ao seu destino; qualquer resistência adicional é inútil."
 FRA_red_purges: "A Purga do Corpo de Oficiais"
 FRA_red_purges_desc: "O antigo corpo de oficiais nunca foi nosso, então o quebramos e promovemos a partir das fileiras. O comando agora é leal e barato de substituir, mas trocamos um exército profissional por um que ainda aprende o ofício sob fogo."
 FRA_people_constitution: "A Constituição do Povo"
 FRA_people_constitution_desc: "Nossa revolução foi um sucesso, mas devemos consolidar nosso poder dando aos trabalhadores a oportunidade de decidir por si mesmos como querem ser governados."
 FRA_commies_redarmy1: "O Novo Exército Vermelho"
 FRA_commies_redarmy1_desc: "Nossa revolução precisa de um exército para se defender e difundir sua causa. Partindo das bases do exército francês, estabelecemos uma nova força que defenderá o povo e a revolução."
 FRA_commies_redarmy2: "O Novo Exército Vermelho"
 FRA_commies_redarmy2_desc: "Nossa revolução precisa de um exército para se defender e difundir sua causa. Partindo das bases do exército francês, estabelecemos uma nova força que defenderá o povo e a revolução."
 FRA_red_agent_lar: "Direção-Geral de Ação Revolucionária"
 FRA_red_agent_lar_desc: "Modelamos nossa abordagem nas técnicas da DGSE para obter informações cruciais sobre nossos inimigos reacionários e capitalistas."
 FRA_red_agent_non_lar: "Direção-Geral de Ação Revolucionária"
 FRA_red_agent_non_lar_desc: "Modelamos nossa abordagem nas técnicas da DGSE para obter informações cruciais sobre nossos inimigos reacionários e capitalistas."
 FRA_monarchist_anger: "A Ira dos Monarquistas"
 FRA_monarchist_anger_desc: "Nossos aliados monarquistas ficaram decepcionados com nossa recusa em restaurar os privilégios aristocráticos. O bonapartismo é herdeiro da Revolução; não poderia ser diferente."
 FRA_bonapart_constitution: "A Constituição Bonapartista"
 FRA_bonapart_constitution_desc: "Desde a Terceira República, nossas instituições deixaram de ser concebidas para acomodar um Imperador de nossa estatura. Devemos, portanto, adaptar a constituição ao nosso futuro reinado. Podemos aproveitar a ocasião para responder a algumas das críticas feitas por nosso povo às repúblicas anteriores; isso será um passo na direção certa para eles."
 FRA_bonapart_military_reform: "Reorganização da Grande Armée"
 FRA_bonapart_military_reform_desc: "Nossas forças armadas são suficientes para garantir nossa segurança dentro de nosso território, mas não bastam para executar nossos planos de recuperar nosso Império. Uma reestruturação é essencial; vamos desmontar tudo, de cima para baixo, para depois reformar cada ramo com mais eficácia."
 FRA_army_reformed_1: "Cadeia de Comando Reestruturada"
 FRA_army_reformed_1_desc: "Agora que nossa cadeia de comando foi reestruturada, podemos nos dar ao luxo de realizar uma reforma mais ampla de nossas forças armadas, incluindo sua tecnologia e sua carteira de pedidos. Uma grande tarefa nos espera, mas ela nos dará os recursos para realizar nossas ambições."
 FRA_army_reformed_infantry: "Reforma da Grande Armée: A Linha de Infantaria"
 FRA_army_reformed_infantry_desc: "Nosso Imperador decidiu a favor de um avanço lento e controlado. A prioridade será, portanto, dada à infantaria e ao equipamento de que necessita."
 FRA_army_reformed_cavalry: "Reforma da Grande Armée: A Cunha Blindada"
 FRA_army_reformed_cavalry_desc: "Nosso Imperador decidiu a favor de um ataque rápido e poderoso. A prioridade será, portanto, dada aos batalhões de tanques e ao equipamento de que necessitam."
 FRA_army_reformed_artillery_infantry: "Reforma da Grande Armée: Infantaria e Canhões"
 FRA_army_reformed_artillery_infantry_desc: "Nosso Imperador decidiu a favor de um avanço lento e controlado apoiado pela artilharia. A prioridade será, portanto, dada à infantaria e à artilharia, bem como aos equipamentos associados."
 FRA_army_reformed_artillery_cavalry: "Reforma da Grande Armée: Blindados e Canhões"
 FRA_army_reformed_artillery_cavalry_desc: "Nosso Imperador decidiu a favor de um ataque rápido e poderoso apoiado pela artilharia. A prioridade será, portanto, dada aos batalhões de tanques e à artilharia, bem como aos equipamentos associados."
 FRA_army_reformed_air_infantry: "Reforma da Grande Armée: Infantaria e Poder Aéreo"
 FRA_army_reformed_air_infantry_desc: "Nosso Imperador decidiu a favor de um avanço lento e controlado apoiado por aviões de ataque. A prioridade será, portanto, dada aos batalhões de infantaria e à produção em massa de aviões."
 FRA_army_reformed_air_cavalry: "Reforma da Grande Armée: Blindados e Poder Aéreo"
 FRA_army_reformed_air_cavalry_desc: "Nosso Imperador decidiu a favor de um ataque rápido e poderoso apoiado por aviões de ataque. A prioridade será, portanto, dada aos batalhões de tanques e à produção em massa de aviões."
 FRA_BCE_money: "O Dinheiro da UE"
 FRA_BCE_money_desc: "Conseguimos negociar nosso retorno às instituições da União Europeia em troca de ajuda do Banco Europeu. Essa ajuda será vital para preparar as guerras que travaremos contra eles!"
 FRA_4th_empire_desc: "O Império Bonapartista está de volta, mais forte do que nunca, e desta vez nenhuma coalizão nos derrotará."
 FRA_grande_arme_art_inf: "A Grande Armée Moderna"
 FRA_grande_arme_art_inf_desc: "Após meses de reformas, nosso exército está plenamente preparado para partir e recuperar os territórios perdidos do Império. Após uma reformulação completa de seu sistema, o reconstruímos em torno de uma estratégia de avanço lento e constante, apoiado por intensos bombardeios das linhas inimigas. A infantaria continua sendo a rainha do campo de batalha, mas a força aérea de assalto tornará sua tarefa consideravelmente mais fácil."
 FRA_grande_arme_art_cav: "Um Dilúvio de Fogo e Aço"
 FRA_grande_arme_art_cav_desc: "Após meses de reformas, nosso exército está plenamente preparado para partir e recuperar os territórios perdidos do Império. Após uma reformulação completa de seu sistema, o reconstruímos em torno de uma estratégia de avanço rápido e brutal, apoiado por intensos bombardeios. Essa estratégia depende de recursos tecnologicamente avançados, mas temos os meios para superar o dilúvio de Napoleão."
 FRA_grande_arme_air_inf: "O Céu Abre o Caminho"
 FRA_grande_arme_air_inf_desc: "Após meses de reformas, nosso exército está plenamente preparado para partir e recuperar os territórios perdidos do Império. O reconstruímos em torno de um avanço comedido da infantaria conduzido inteiramente sob nossa própria cobertura aérea, com aeronaves de ataque e reconhecimento quebrando cada posição antes que um fuzileiro seja empregado nela. O soldado a pé ainda toma o terreno, mas já não pisa nele às cegas."
 FRA_grande_arme_air_cav: "Trovão Antes da Carga"
 FRA_grande_arme_air_cav_desc: "Após meses de reformas, nosso exército está plenamente preparado para partir e recuperar os territórios perdidos do Império. O reconstruímos em torno de colunas blindadas que só avançam onde a força aérea já passou, trocando o trem de artilharia por asas de ataque que acompanham o avanço. Nada retarda a carga, e nada sobrevive à sua frente."
 FRA_surrounded: "Bloqueio continental"
 FRA_surrounded_desc: "Nossa ascensão ao poder não passou despercebida, e é evidente que as outras potências europeias já conspiram contra nós. Em particular a Grã-Bretanha, que foi nossa inimiga jurada no passado. Devemos derrubar cada uma dessas potências europeias; nossa sobrevivência e a da revolução dependem disso."
 FRA_Sachons_vaincre: "Le Deluge"
 FRA_Sachons_vaincre_desc: "Tendo passado meses preparando nosso povo para um conflito de alta intensidade, ele agora está pronto para esta guerra tão esperada. Seu entusiasmo e sua fé podem mover montanhas, mas devemos agir rápido antes que diminuam. Devemos esmagar nossos oponentes o mais rápido possível."
 FRA_prepare_to_fight: "Preparando Nosso Retorno"
 FRA_prepare_to_fight_desc: "Optamos por uma abordagem cautelosa; sabendo que nosso povo apoia plenamente nossas ambições expansionistas, resta apenas fornecer-lhe os meios para realizá-las. Devemos garantir que, quando chegar a hora, estejamos prontos."
 FRA_defense_napoleon: "Estado de emergência"
 FRA_defense_napoleon_desc: "Após os ataques terroristas realizados em nossas fronteiras pelos bonapartistas, nosso país está em alerta máximo. Aconteça o que acontecer, estaremos prontos."
 FRA_thousands_planes: "Corrida Armamentista Aérea"
 FRA_thousands_planes_desc: "Escolhemos combater os Estados Unidos, que por tempo demais buscaram nos dominar e ao resto da Europa. Para proteger a Europa, devemos destruí-los e, para destruí-los, precisamos ser capazes de competir no ar, já que não temos meios de derrotá-los no mar."
 FRA_trade_USA: "Comércio Transatlântico"
 FRA_trade_USA_desc: "Os Estados Unidos e o Império Francês uniram forças para comerciar através do Atlântico. Esses acordos lhes trarão paz e prosperidade em troca de garantias de paz."
 FRA_king_camelot_lar: "Os Camelots do Rei"
 FRA_king_camelot_lar_desc: "Nossa polícia secreta, encarregada de suprimir todas as tendências revolucionárias e outros movimentos antimonarquistas."
 FRA_king_camelot_non_lar: "Os Camelots do Rei"
 FRA_king_camelot_non_lar_desc: "Nossa polícia secreta, encarregada de suprimir todas as tendências revolucionárias e outros movimentos antimonarquistas."
 FRA_king_constitution: "A Constituição Monarquista"
 FRA_king_constitution_desc: "Todas essas repúblicas pelas quais nosso país passou construíram instituições sobre alicerces frágeis. Devemos reescrever esse lixo, pois todo Estado, mesmo sob nosso governo absoluto, precisa de leis."
 FRA_chivalry: "Cavalaria Moderna"
 FRA_chivalry_desc: "A monarquia francesa sempre contou com uma poderosa força de cavalaria. Escolhemos seguir nessa linha priorizando a cavalaria mecanizada sobre a infantaria."
 FRA_elite_army: "Um Exército de Elites"
 FRA_elite_army_desc: "As Guerras Revolucionárias trouxeram o alistamento obrigatório. No entanto, os muitos conflitos que vivemos mostraram-se extremamente custosos em vidas humanas. Os súditos do Rei nem sempre são bem treinados para a guerra. Escolhemos, portanto, nos concentrar em uma força menor, mas muito mais bem treinada."
 FRA_prepare_crusade: "A Décima Cruzada"
 FRA_prepare_crusade_desc: "Nossas forças estão prontas para partir e conquistar a Terra Santa."
 FRA_political_preassure: "Fortalecendo Nossa Diplomacia"
 FRA_political_preassure_desc: "Não conseguimos conquistar o Líbano pela via diplomática, então precisamos melhorar a forma como nos relacionamos com as potências estrangeiras."
 FRA_navy_crusade: "A Cruzada Marítima"
 FRA_navy_crusade_desc: "Decidimos retomar a Terra Santa pelo mar. Isso exige capacidades ofensivas anfíbias eficazes."
 FRA_commie_europe_integration: "Assimilação Europeia"
 FRA_commie_europe_integration_desc: "Levamos a revolução e o comunismo ao resto da Europa. Chegou a hora de forjar uma união do proletariado de todos os países em uma federação europeia capaz de garantir que a revolução perdure."
 FRA_counter_insurgency: "Policiamento Militar Eficaz"
 FRA_counter_insurgency_desc: "Os guerrilheiros espanhóis foram um problema para Napoleão I, mas não serão para nós."
 FRA_attack_benelux: "Plano de Batalha: Benelux"
 FRA_attack_benelux_desc: "Devemos nos concentrar em aniquilar as forças do Benelux. Nosso Imperador nos deu os meios para derrotá-las rapidamente."
 FRA_attack_iberia: "Plano de Batalha: Península Ibérica"
 FRA_attack_iberia_desc: "Devemos nos concentrar em aniquilar as forças ibéricas. Nosso Imperador nos deu os meios para derrotá-las rapidamente."
 FRA_attack_germany: "Plano de Batalha: Alemanha"
 FRA_attack_germany_desc: "Devemos nos concentrar em aniquilar as forças alemãs. Nosso Imperador nos deu os meios para derrotá-las rapidamente."
 FRA_attack_holy_roman: "Plano de Batalha: Europa Meridional"
 FRA_attack_holy_roman_desc: "Devemos nos concentrar em aniquilar o que resta das forças do sul da Europa. Nosso Imperador nos deu os meios para derrotá-las rapidamente."
 FRA_BON_support_allies: "Preparando-se para uma Guerra Longa"
 FRA_BON_support_allies_desc: "Nosso parceiro francês sugeriu que nos preparemos para um conflito de alta intensidade com a Rússia."
 FRA_attack_east: "Plano de Batalha: Europa Oriental"
 FRA_attack_east_desc: "Devemos nos concentrar em aniquilar as forças do leste europeu. Nosso Imperador nos deu os meios para derrotá-las rapidamente. Este é o passo final antes de nossa campanha final."
 FRA_attack_russia_fast: "La Fleur au Fusil"
 FRA_attack_russia_fast_desc: "Estaremos em Moscou em duas semanas!"
 FRA_attack_russia_slow: "Avanço Cauteloso"
 FRA_attack_russia_slow_desc: "Desta vez não haverá um Berezina"
 FRA_attack_UK_naval: "Cruzar o Canal"
 FRA_attack_UK_naval_desc: "A Marinha Real já não é uma ameaça para nós; a vitória está ao nosso alcance."
 FRA_attack_UK_air: "Saltar sobre o Canal"
 FRA_attack_UK_air_desc: "Devemos manter o controle do espaço aéreo e surpreender nosso oponente."
 FRA_BON_victory: "Protetorado Imperial"
 FRA_BON_victory_desc: "Fomos conquistados pelo Império Napoleônico."
 FRA_expansion_europe: "Herdeiro de Carlos Magno"
 FRA_expansion_europe_desc: "Nosso destino é recuperar o Império Carolíngio."
 FRA_expansion_europe_crusades: "Cruzada Carolíngia"
 FRA_expansion_europe_crusades_desc: "Os francos recuperaram suas terras; devemos agora partir para a Terra Santa."
 FRA_expansion_crusades: "Herdeiro de São Luís"
 FRA_expansion_crusades_desc: "O dever de nosso Reino é servir a Deus e recuperar a Terra Santa."
 FRA_EMPIRE_occident: "O Império do Ocidente"
 FRA_EMPIRE_occident_desc: "Reconquistamos o Império Carolíngio e fomos coroados Imperador do Ocidente."
 FRA_crusade_done_jerusalem: "A Cruzada Vitoriosa"
 FRA_crusade_done_jerusalem_desc: "A Décima Cruzada atingiu seu objetivo ao retomar Jerusalém e a Terra Santa."
 FRA_expansion_crusades_plus: "A Última Cruzada"
 FRA_expansion_crusades_plus_desc: "Tendo recuperado nossos lugares sagrados, decidimos reparar os erros do passado. Todos os cismas devem ser encerrados."
 FRA_protestant_anger: "Resistência Protestante"
 FRA_protestant_anger_desc: "Nossa retórica agressiva contra os protestantes provocou sua ira em nosso país."
 FRA_harsh_subjugation: "Subjugação Severa"
 FRA_harsh_subjugation_desc: "Nosso suserano, o Rei da França, decidiu controlar nossa economia e nossas políticas. A derrota tem um preço alto."
 FRA_victory_crusade_2_conversion: "O Quinto Cavaleiro do Apocalipse"
 FRA_victory_crusade_2_conversion_desc: "A ira divina foi desencadeada sobre nossos inimigos."
 FRA_enlightment: "Protetorado da Igreja"
 FRA_enlightment_desc: "Nosso suserano, o Rei da França, decidiu nos ajudar a reconstruir nosso país e nos apoiar na reconstrução física e cultural de nossa sociedade."
 FRA_victory_crusade_2_freedom_light: "A Filha Primogênita da Igreja"
 FRA_victory_crusade_2_freedom_light_desc: "Devemos tratar as ovelhas perdidas com a máxima bondade."
 FRA_attack_colonies: "Recuperando as Colônias do Império"
 FRA_attack_colonies_desc: "O sistema continental precisa encontrar os recursos para garantir sua continuidade."
 france_md.404.t: "O Acordo com os Verdes"
 france_md.404.d: "A negociação terminou e o texto está sobre a mesa. Vinte e quatro reatores fechados, Fessenheim primeiro, e a energia nuclear reduzida à metade da matriz elétrica dentro de uma década. Em troca, os Verdes abrem mão de sessenta circunscrições e a maioria se sustenta. As federações de energia já votaram contra, e Montebourg disse em público o que metade do grupo parlamentar diz em privado. Assinamos?"
 france_md.404.a: "Assinar. A aliança vale mais que os reatores"
 france_md.404.b: "A frota não é moeda de troca"
 france_md.405.t: "La Manif pour Tous"
 france_md.405.d: "Nosso recente projeto de lei parece não ter obtido apoio unânime entre nossos concidadãos. Eles encheram o Champ de Mars e pretendem repetir o feito todo mês até que o projeto morra. Os organizadores são cuidadosos, os cartazes são rosa e azul, e atrás deles estão todas as associações conservadoras do país e boa parte do grupo parlamentar da direita. O texto, como redigido, cobre casamento, adoção e filiação. Podemos manter a linha nos três pontos, ou podemos retirar o que atrai as maiores multidões e aprovar o resto discretamente."
 france_md.405.a: "A lei passa por inteiro. Deixem-nos marchar"
 france_md.405.b: "Aparar o texto e aceitar o que for possível"
 france_md.406.t: "As Rotatórias Estão Ocupadas"
 france_md.406.d: "Oito fins de semana. As prefeituras relatam mil rotatórias ocupadas, o Arco do Triunfo foi vandalizado e os projéteis de flash-ball tiraram olhos diante das câmeras. Não há liderança com quem negociar, porque eles se recusam a nomear uma. O Interior quer a lei antibadernas e carta branca. Os outros querem um debate nacional, assembleias em cada comuna e um pacote de concessões grande o bastante para acabar com isso antes das eleições europeias."
 france_md.406.a: "Aprovar a lei antibadernas e desocupar as rotatórias"
 france_md.406.b: "Abrir o Grand Débat e pagar pela paz"
 FRA_change_politics_nationalist: "Altera §Y$FRA_political_balance$§!: $FRA_balance_domestic_nationalist_drift$ em [?temp_change|%+]\n"
 FRA_truly_absolutism_TT: "§gNós§! §RProibiremos§! §gtodos os outros partidos e declararemos o reino uma§! §YMonarquia Verdadeiramente Absoluta§!"
 FRA_social_welf_need_tooltip_modifier_effect_TT: "Altera §Y$FRA_social_balance$§!: $FRA_SOC_welf_ned$ em [?temp_change|%-]\n"
 FRA_4th_empire: "Terceiro Império Francês"
 threat_FRA_napo_empire: "Napoleão está de volta"
 FRA_liberal_arms_contracts: "Política Liberal de Exportação de Armas"
 FRA_liberal_arms_contracts_desc: "Dassault, Naval Group, Thales e MBDA lideram uma das indústrias de defesa mais avançadas do mundo. Uma política de exportação liberal nos permite buscar contratos lucrativos com nações que procuram se modernizar, enchendo as carteiras de pedidos de nossas fábricas ao mesmo tempo em que estendemos a influência francesa por meio de parcerias militares."
 FRA_liberal_arms_contracts_tt: "Nos próximos meses, proporemos contratos de armas à §YArábia Saudita§!, aos §YEmirados Árabes Unidos§!, à §YSérvia§!, à §YGrécia§!, ao §YEgito§! e à §YÍndia§!."
 FRA_arms_contract_opinion: "Parceria de Contrato de Armas"
 france_md.323.t: "Cortejando Riade"
 france_md.323.d: "Riade está procurando um caça para voar ao lado de seus Eurofighters, e os engenheiros da Naval Group ainda dão manutenção às fragatas da classe Al Riyadh construídas no programa Sawari. Nosso ministério da defesa elaborou uma proposta para [SAU.GetNameWithFlag]. O que devemos oferecer?"
 france_md.323.a: "Pacote de armas leves ($5 bilhões)"
 france_md.323.b: "Pacote de armas pesadas ($15 bilhões)"
 france_md.323.c: "Pacote Rafale Premium ($30 bilhões)"
 france_md.323.e: "Não buscaremos este contrato"
 france_md.324.t: "Riade Pondera uma Oferta Francesa"
 france_md.324.d: "[FRA.GetNameWithFlag] está oferecendo o Rafale como alternativa aos nossos esquadrões de Eurofighter, junto com uma extensão do programa de fragatas Sawari, que a Naval Group mantém há décadas."
 france_md.324.a: "Aceitar o contrato"
 france_md.324.b: "Recusar a oferta"
 france_md.325.t: "Cortejando Abu Dhabi"
 france_md.325.d: "A força aérea emirática ainda opera o Mirage 2000-9, a variante que a Dassault construiu especificamente para Abu Dhabi na década de 1990. Com essa frota envelhecendo, nosso ministério da defesa vê uma oportunidade de oferecer seu sucessor, o Rafale, a [UAE.GetNameWithFlag]. O que devemos oferecer?"
 france_md.325.a: "Pacote de armas leves ($5 bilhões)"
 france_md.325.b: "Pacote de armas pesadas ($15 bilhões)"
 france_md.325.c: "Pacote Rafale Premium ($30 bilhões)"
 france_md.325.e: "Não buscaremos este contrato"
 france_md.326.t: "Abu Dhabi Pondera uma Oferta Francesa"
 france_md.326.d: "[FRA.GetNameWithFlag] propõe o Rafale como sucessor de nossa frota de Mirage 2000-9, a variante sob medida que a Dassault construiu para nós há três décadas."
 france_md.326.a: "Aceitar o contrato"
 france_md.326.b: "Recusar a oferta"
 france_md.327.t: "Cortejando Belgrado"
 france_md.327.d: "[SER.GetNameWithFlag] ainda opera MiG-29 da era soviética e compra sua defesa aérea de curto alcance de Moscou. Podemos oferecer o Rafale como substituto, junto com os mísseis portáteis Mistral da MBDA para suas unidades de defesa aérea. O que devemos propor?"
 france_md.327.a: "Pacote de armas leves ($3 bilhões)"
 france_md.327.b: "Pacote de armas pesadas ($8 bilhões)"
 france_md.327.c: "Pacote Rafale Premium ($15 bilhões)"
 france_md.327.e: "Não buscaremos este contrato"
 france_md.328.t: "Belgrado Pondera uma Oferta Francesa"
 france_md.328.d: "[FRA.GetNameWithFlag] está oferecendo o Rafale como alternativa ocidental à nossa frota envelhecida de MiG-29, junto com os mísseis Mistral da MBDA para nossas unidades de defesa aérea. Aceitar marcaria nosso primeiro grande acordo de armas fora da órbita russa."
 france_md.328.a: "Aceitar o contrato"
 france_md.328.b: "Recusar a oferta"
 france_md.329.t: "Cortejando Atenas"
 france_md.329.d: "[GRE.GetNameWithFlag] já opera nossos Rafales e quer estender a relação à marinha. A Naval Group apresentou um pacote de fragatas derivadas da FREMM para acompanhar o pedido da força aérea. O que devemos propor a nossos aliados helênicos?"
 france_md.329.a: "Pacote de armas leves ($4 bilhões)"
 france_md.329.b: "Pacote de armas pesadas ($12 bilhões)"
 france_md.329.c: "Pacote Rafale Premium ($20 bilhões)"
 france_md.329.e: "Não buscaremos este contrato"
 france_md.330.t: "Atenas Pondera uma Oferta Francesa"
 france_md.330.d: "[FRA.GetNameWithFlag] propõe um pacote construído em torno de fragatas derivadas da FREMM, ampliando uma relação de defesa já ancorada em nosso pedido anterior de Rafales."
 france_md.330.a: "Aceitar o contrato"
 france_md.330.b: "Recusar a oferta"
 france_md.331.t: "Cortejando o Cairo"
 france_md.331.d: "[EGY.GetNameWithFlag] já opera nossos Rafales, opera os dois navios da classe Mistral construídos para a Rússia e redirecionados ao Cairo, e encomendou a fragata FREMM Tahya Misr da carteira de pedidos de nossa própria marinha. O que devemos propor para aprofundar a parceria?"
 france_md.331.a: "Pacote de armas leves ($4 bilhões)"
 france_md.331.b: "Pacote de armas pesadas ($12 bilhões)"
 france_md.331.c: "Pacote Rafale Premium ($25 bilhões)"
 france_md.331.e: "Não buscaremos este contrato"
 france_md.332.t: "O Cairo Pondera uma Oferta Francesa"
 france_md.332.d: "[FRA.GetNameWithFlag] oferece ampliar uma parceria que já abrange nossos esquadrões de Rafale, os porta-aviões da classe Mistral e a fragata FREMM Tahya Misr."
 france_md.332.a: "Aceitar o contrato"
 france_md.332.b: "Recusar a oferta"
 france_md.333.t: "Cortejando Nova Délhi"
 france_md.333.d: "[IND.GetNameWithFlag] opera um dos maiores mercados de defesa do mundo. Nova Délhi já opera trinta e seis Rafales e constrói submarinos da classe Scorpène sob licença na Mazagon Dock. O que devemos propor para ampliar a parceria?"
 france_md.333.a: "Pacote de armas leves ($6 bilhões)"
 france_md.333.b: "Pacote de armas pesadas ($20 bilhões)"
 france_md.333.c: "Pacote Rafale Premium ($40 bilhões)"
 france_md.333.e: "Não buscaremos este contrato"
 france_md.334.t: "Nova Délhi Pondera uma Oferta Francesa"
 france_md.334.d: "[FRA.GetNameWithFlag] propõe aproveitar os Rafales já em serviço na Força Aérea Indiana e os submarinos da classe Scorpène construídos sob licença na Mazagon Dock."
 france_md.334.a: "Aceitar o contrato"
 france_md.334.b: "Recusar a oferta"
 FRA_joint_weapon_projects_category: "Projetos Conjuntos de Desenvolvimento de Armas"
 FRA_joint_weapon_projects_category_desc: "A França tem uma longa história de programas de defesa conjuntos, do avião de ataque Jaguar com a Grã-Bretanha ao helicóptero Tiger com a Alemanha. Novos projetos conjuntos nos permitem dividir os custos de desenvolvimento e colocar em campo equipamentos que nenhum dos parceiros poderia bancar sozinho."
 FRA_joint_project_germany: "Propor Projeto Conjunto SCAF/MGCS"
 FRA_joint_project_germany_desc: "O SCAF (Système de Combat Aérien du Futur) une a Dassault e a Airbus para projetar um caça de sexta geração que suceda o Rafale e o Eurofighter. O MGCS (Main Ground Combat System) encarrega a KNDS de um novo carro de combate principal para substituir o Leclerc e o Leopard 2. Juntos, seriam os maiores programas de defesa que qualquer das duas nações conduziu desde a Guerra Fria."
 FRA_socialist_government_required_tt: "Requer um governo §YSocialista§! ou de §YEsquerda§! no poder"
 FRA_joint_project_russia: "Propor Projeto Franco-Russo ATOM"
 FRA_joint_project_russia_desc: "Propomos o veículo de combate de infantaria ATOM como programa conjunto com Moscou, unindo as equipes de projeto da Nexter a engenheiros russos de veículos blindados. Romper tão profundamente com nossos aliados ocidentais exige sair primeiro da UE."
 FRA_nationalist_government_required_tt: "Requer um governo §YNacionalista§! ou do §YReagrupamento Nacional§! no poder"
 FRA_joint_project_opinion: "Parceiro de Desenvolvimento Conjunto de Armas"
 france_md.335.t: "Proposta de Projeto Franco-Alemão SCAF/MGCS"
 france_md.335.d: "[FRA.GetNameWithFlag] propõe lançar o SCAF (Système de Combat Aérien du Futur) e o MGCS (Main Ground Combat System) como programas conjuntos: um caça de sexta geração para suceder o Rafale e o Eurofighter, e um carro de combate principal para substituir o Leclerc e o Leopard 2. Dassault, Airbus e KNDS dividiriam o trabalho de engenharia entre Paris e Berlim."
 france_md.335.a: "Vamos construir juntos o futuro da defesa europeia"
 france_md.335.b: "Preferimos desenvolver nossos sistemas de forma independente"
 france_md.336.t: "A Alemanha Aceita o Projeto SCAF/MGCS"
 france_md.336.d: "[GER.GetNameWithFlag] aceitou nossa proposta para o SCAF e o MGCS. Engenheiros da Dassault e da Airbus trabalharão lado a lado com seus colegas alemães no programa do caça, enquanto a KNDS lidera o carro de combate."
 france_md.336.a: "Excelente! Viva a cooperação franco-alemã!"
 france_md.337.t: "Proposta de Projeto Franco-Russo ATOM"
 france_md.337.d: "[FRA.GetNameWithFlag] propõe o veículo de combate de infantaria ATOM como programa conjunto franco-russo, unindo engenheiros da Nexter a projetistas russos de veículos blindados. Tendo já se distanciado de seus aliados ocidentais tradicionais, Paris agora busca parceiros de defesa no leste."
 france_md.337.a: "Começa uma nova era de cooperação franco-russa"
 france_md.337.b: "Esta proposta é controversa demais"
 france_md.338.t: "A Rússia Aceita o Projeto ATOM"
 france_md.338.d: "[RUS.GetNameWithFlag] aceitou nossa proposta para o programa ATOM. Engenheiros da Nexter trabalharão lado a lado com seus colegas russos em um novo veículo de combate de infantaria, nossa primeira grande parceria de defesa com Moscou desde a Guerra Fria."
 france_md.338.a: "Um novo capítulo nas relações franco-russas!"
 FRA_FCAS_MGCS_project: "Programa de Desenvolvimento SCAF/MGCS"
 FRA_FCAS_MGCS_project_desc: "França e Alemanha estão desenvolvendo em conjunto o SCAF (Système de Combat Aérien du Futur), um caça de sexta geração liderado pela Dassault e pela Airbus, e o MGCS (Main Ground Combat System), um novo carro de combate principal liderado pela KNDS. Juntos, são os maiores programas de defesa que qualquer dos dois países conduziu desde a Guerra Fria."
 GER_FCAS_MGCS_project: "Programa de Desenvolvimento SCAF/MGCS"
 GER_FCAS_MGCS_project_desc: "Alemanha e França estão desenvolvendo em conjunto o SCAF (Système de Combat Aérien du Futur), um caça de sexta geração liderado pela Airbus e pela Dassault, e o MGCS (Main Ground Combat System), um novo carro de combate principal liderado pela KNDS. Juntos, são os maiores programas de defesa que qualquer dos dois países conduziu desde a Guerra Fria."
 FRA_RUS_joint_project: "Programa Franco-Russo ATOM"
 FRA_RUS_joint_project_desc: "França e Rússia lançaram um programa conjunto de desenvolvimento militar, o projeto do veículo de combate de infantaria ATOM. Engenheiros da Nexter se unem a projetistas russos de veículos blindados para produzir uma nova plataforma de VCI."
 RUS_FRA_joint_project: "Programa Franco-Russo ATOM"
 RUS_FRA_joint_project_desc: "Rússia e França lançaram um programa conjunto de desenvolvimento militar, o projeto do veículo de combate de infantaria ATOM. Projetistas russos de veículos blindados se unem a engenheiros da Nexter para produzir uma nova plataforma de VCI."
 FRA_constitutional_crisis_pcf: "A Tentação Revolucionária"
 FRA_constitutional_crisis_pcf_desc: "Dentro de nossa coalizão de esquerda, uma facção radical vem ganhando influência. Esses radicais revolucionários acreditam que o socialismo democrático avança devagar demais e exigem uma transformação imediata e total. A liderança moderada da La France Insoumise e do PCF luta para conter extremistas que veem a greve geral como o primeiro passo rumo à revolução."
 FRA_abolish_fifth_republic_pcf: "Os Extremistas Tomam o Controle"
 FRA_abolish_fifth_republic_pcf_desc: "A facção radical dentro da esquerda superou a liderança moderada. Mélenchon e os reformistas do PCF foram deixados de lado por radicais revolucionários que rejeitam inteiramente a 'democracia burguesa' da Quinta República. Eles exigem uma Assembleia Constituinte para redigir uma nova constituição, respaldados por força de rua suficiente para impor sua vontade."
 FRA_sixth_republic: "Proclamar a Sexta República"
 FRA_sixth_republic_desc: "A facção moderada recuperou alguma influência, conduzindo a revolução rumo a uma Sexta República socialista democrática, em vez do comunismo propriamente dito. Esse compromisso preserva as instituições republicanas ao mesmo tempo em que transforma fundamentalmente a sociedade francesa por meios parlamentares."
 FRA_french_commune_peaceful: "Estabelecer a Comuna Francesa"
 FRA_french_commune_peaceful_desc: "Os radicais revolucionários triunfaram por completo. No espírito da Comuna de Paris de 1871, a França se tornará um verdadeiro Estado operário. Os meios de produção serão coletivizados, conselhos operários governarão em todos os níveis, e os reformistas moderados perderam o controle por completo."
 FRA_republic_safe_pcf: "Nosso Bem Mais Precioso"
 FRA_republic_safe_pcf_desc: "Prendemos os líderes da facção radical e desmantelamos suas células paramilitares. A República sobrevive. Mélenchon e os reformistas moderados mantêm o controle da esquerda. O sonho revolucionário acabou, substituído pelo caminho mais lento e mais estável da reforma democrática."
 FRA_question_republic_fn: "A República Questionável"
 FRA_question_republic_fn_desc: "Dentro do Reagrupamento Nacional, uma facção tradicionalista vem ganhando influência. Enquanto [FRA.GetLeader] e a liderança dominante permanecem comprometidos com a República, esses extremistas, inspirados pela Action Française e pelo movimento tradicionalista católico, questionam abertamente se a própria democracia fracassou com a França. Devemos agir antes que seja tarde demais."
 FRA_referendum_republic: "Os Radicais Forçam um Referendo"
 FRA_referendum_republic_desc: "A facção tradicionalista superou os republicanos moderados de Le Pen. Militantes da Action Française, integristas católicos e monarquistas nostálgicos tomaram o controle do aparato partidário. Eles exigem um referendo sobre a própria existência da República, e a liderança dominante já não consegue detê-los."
 FRA_restore_kingdom_fn: "Restaurar o Reino"
 FRA_restore_kingdom_fn_desc: "A facção monarquista dentro do movimento venceu. Quer coroemos o pretendente orleanista Jean d'Orléans como 'Rei dos Franceses' ou o pretendente legitimista Louis de Bourbon como 'Rei da França', os republicanos moderados da coalizão de governo foram completamente deixados de lado pelos extremistas tradicionalistas."
 FRA_restore_empire_fn: "Restaurar o Império"
 FRA_restore_empire_fn_desc: "A facção bonapartista triunfou. Jean-Christophe Napoléon Bonaparte será coroado Napoleão VII. Os republicanos moderados que um dia lideraram o governo foram varridos por aqueles que sonham com a glória imperial: uma França forte, unida sob um Imperador, e não parlamentares em disputa."
 FRA_republic_safe_fn: "Salvando a República"
 FRA_republic_safe_fn_desc: "Prendemos os líderes da facção tradicionalista e desmantelamos suas células paramilitares. A República sobrevive! Nosso governo e os nacionalistas moderados mantêm o controle. Usando a crise como justificativa, aprovamos reformas para reforçar o poder do Estado: serviços de segurança ampliados, controles mais rígidos sobre organizações extremistas e maior autoridade do executivo. A Quinta República perdura, mais forte do que nunca."
 france_md.370.t: "Mantendo as Mãos Limpas"
 france_md.370.d: "Nossa ascensão ao poder parece já ter chamado a atenção de movimentos políticos. Esta manhã fomos contatados por células comunistas revolucionárias. Elas se ofereceram para ajudar a consolidar nosso domínio do poder, em especial reunindo informações sobre nossos adversários políticos e rastreando grupos dissidentes de extrema direita para impedi-los de nos prejudicar. Não devemos nos envolver com tais grupos, pois agora estamos comprometidos com a reforma e a República. Mas ainda assim seria útil ter essa ferramenta."
 france_md.370.a: "Permitir que se organizem: precisamos do apoio deles"
 france_md.370.b: "Rejeitá-los: somos democratas, não revolucionários"
 france_md.371.t: "Vozes das Sombras"
 france_md.371.d: "Nosso sucesso nas eleições e nossa eficácia na implementação de um programa nacionalista não passaram despercebidos. Recebemos propostas de vários grupos dissidentes tradicionalistas: simpatizantes da Action Française, integristas católicos e aqueles que sonham em restaurar a monarquia. Eles ficaram impressionados com nosso desempenho e oferecem suas redes paramilitares e conexões políticas em troca da permissão para se organizarem abertamente. Suas verdadeiras intenções permanecem veladas."
 france_md.371.a: "Permitir que se organizem: o apoio deles nos fortalece"
 france_md.371.b: "Rejeitá-los: estamos com a república"
 france_md.372.t: "A República Resiste"
 france_md.372.d: "A facção radical foi quebrada. Seus líderes foram presos, suas células desmanteladas, seus sonhos de revolução esmagados. Os reformistas moderados continuam no controle, e a França continua sendo uma república, talvez transformada, mas ainda reconhecidamente democrática. Os extremistas apostaram e perderam."
 france_md.372.a: "O reformismo sempre vence"
 france_md.373.t: "Viva a República!"
 france_md.373.d: "O golpe tradicionalista foi frustrado! A DGSI agiu rapidamente: líderes da Action Française estão sob custódia, células monarquistas foram alvo de batidas e os sonhos de restauração jazem em ruínas. O povo comemora nas ruas enquanto Le Pen se dirige à nação: a Quinta República se mantém firme. Usando essa crise como justificativa, aprovamos reformas abrangentes para reforçar a autoridade do Estado e garantir que tais ameaças jamais voltem a surgir."
 france_md.373.a: "A República está salva, mais forte do que nunca!"
 france_md.374.t: "As Facções Lutam pelo Poder"
 france_md.374.d: "O golpe teve êxito. A República caiu. Mas agora as facções tradicionalistas se voltam umas contra as outras. Os monarquistas exigem a restauração da linhagem Bourbon ou Orléans. Os bonapartistas sonham com a glória imperial sob Napoleão VII. Apenas uma facção pode vencer. Qual visão prevalecerá?"
 france_md.374.a: "Os Monarquistas prevalecem: restaurar o Reino!"
 france_md.374.b: "Os Bonapartistas triunfam: restaurar o Império!"
 france_md.340.t: "A Revolta Iminente"
 france_md.340.d: "A facção radical se tornou ousada demais. Suas células paramilitares foram expostas, sua infiltração no aparato partidário foi revelada. Há até rumores de que se infiltraram no alto comando de nosso exército e preparam um golpe de Estado. Devemos escolher: reprimi-los agora e preservar a República, ou deixá-los continuar seu trabalho e ver aonde isso leva. A DGSI aguarda nossas ordens."
 france_md.340.a: "Reprimir: prender os líderes radicais"
 france_md.340.b: "Deixá-los em paz: a revolução deve continuar"
 france_md.341.t: "Os Radicais Tomam o Poder"
 france_md.341.d: "Aconteceu numa única noite. A facção radical agiu com precisão: suas células paramilitares tomaram edifícios-chave, seus infiltrados nas forças armadas garantiram bases cruciais. [FRA.GetLeader] e os reformistas moderados acordam e se veem prisioneiros em tudo, menos no nome. Os radicais revolucionários executaram seu golpe. A Quinta República está morta."
 france_md.341.a: "A revolução começou"
 france_md.345.t: "A Comuna Ressurge"
 france_md.345.d: "Os radicais revolucionários venceram por completo. Rejeitando qualquer compromisso com a 'democracia burguesa', proclamaram a Comuna Francesa, um verdadeiro Estado operário na tradição de 1871. Os reformistas moderados que construíram a coalizão original foram expurgados ou fugiram. A bandeira vermelha tremula sobre o Palácio do Eliseu, e a revolução apenas começou."
 france_md.345.a: "Viva a Comuna! A Internacional será o gênero humano!"
 france_md.375.t: "Lutar ou Ceder"
 france_md.375.d: "A facção tradicionalista ficou confiante demais. Suas redes paramilitares foram expostas, sua infiltração no aparato partidário foi revelada. Há até rumores de que se infiltraram no alto comando de nosso exército e preparam um golpe de Estado. Devemos escolher: reprimi-los agora e preservar a República, ou deixá-los continuar seu trabalho e ver aonde isso leva. A DGSI aguarda nossas ordens."
 france_md.375.a: "Reprimir: prender os líderes tradicionalistas"
 france_md.375.b: "Deixá-los em paz: a restauração deve continuar"
 france_md.376.t: "Os Tradicionalistas Tomam o Poder"
 france_md.376.d: "Aconteceu numa única noite. A facção tradicionalista agiu com precisão: suas células paramilitares garantiram edifícios-chave, seus aliados nas forças armadas asseguraram a não interferência. [FRA.GetLeader] e os republicanos moderados acordam e se veem completamente marginalizados. Os extremistas executaram seu golpe. A Quinta República está morta. Mas quem governará a nova França?"
 france_md.376.a: "As facções agora devem decidir"
 france_md.354.t: "Os Monarquistas Escolhem Seu Rei"
 france_md.354.d: "A facção monarquista dentro do movimento deve agora escolher seu soberano. Dois pretendentes se apresentam: Jean d'Orléans, Conde de Paris, representa a linhagem orleanista e seria um monarca constitucional, 'Rei dos Franceses'. Louis de Bourbon, Duque de Anjou, representa a linhagem legitimista de Luís XIV e seria 'Rei da França' por direito divino. Os tradicionalistas da Action Française devem decidir."
 france_md.354.a: "Coroar Jean d'Orléans, Rei dos Franceses"
 france_md.354.b: "Coroar Louis de Bourbon, Rei da França"
 france_md.357.t: "Os Bonapartistas Triunfam"
 france_md.357.d: "A facção bonapartista dentro do movimento venceu a disputa interna. Jean-Christophe Napoléon Bonaparte será coroado Napoleão VII. Os militares e aqueles que sonham com a glória imperial prevaleceram sobre os monarquistas. Marine Le Pen e a velha guarda republicana do Reagrupamento Nacional foram completamente varridos. A França será um Império mais uma vez."
 france_md.357.a: "Viva o Imperador! Viva a França!"
 france_md.358.t: "Bonapartistas Tomam o Poder na França"
 france_md.358.d: "Notícia chocante de [FRA.GetNameWithFlag]: facções extremistas dentro do partido governante tomaram o controle e aboliram a Quinta República. A liderança moderada foi deixada de lado enquanto radicais restauram o governo imperial. Esse golpe dramático contra a democracia chocou o mundo. Como devemos responder?"
 france_md.358.a: "Condenar essa tomada extremista"
 france_md.358.b: "Este é um assunto interno francês"
 FRA_extremist_paramilitary_left: "Paramilitares Revolucionários"
 FRA_extremist_paramilitary_left_desc: "Permitimos que a facção radical organizasse abertamente suas redes paramilitares. Essas células revolucionárias nos dão força de rua e controle sobre possíveis dissidências. Mas a que custo? Suas verdadeiras lealdades permanecem com a revolução, não com a liderança do partido."
 FRA_extremist_paramilitary_right: "Paramilitares Tradicionalistas"
 FRA_extremist_paramilitary_right_desc: "Permitimos que a facção tradicionalista organizasse abertamente suas redes paramilitares. Essas células da Action Française nos dão força de rua e controle sobre possíveis dissidências. Mas a que custo? Suas verdadeiras lealdades permanecem com a restauração, não com a liderança do partido."
 FRA_radical_infiltration: "Infiltração Radical"
 FRA_radical_infiltration_desc: "A facção radical está se infiltrando silenciosamente no aparato partidário e nas forças armadas. Suas células revolucionárias se espalham pelas instituições, construindo a rede de que precisarão quando chegar a hora. A liderança moderada desconhece a profundidade da infiltração."
 FRA_traditionalist_infiltration: "Infiltração Tradicionalista"
 FRA_traditionalist_infiltration_desc: "A facção tradicionalista está se infiltrando silenciosamente no aparato partidário e nas forças armadas. Suas células monarquistas se espalham pelas instituições, construindo a rede de que precisarão quando chegar a hora. A liderança moderada desconhece a profundidade da infiltração."
 FRA_republic_stabilized_left: "República Estabilizada"
 FRA_republic_stabilized_left_desc: "A ameaça radical foi neutralizada. A DGSI prendeu os líderes extremistas e desmantelou suas células paramilitares. A França continua sendo uma república, e os reformistas moderados mantêm o controle da esquerda. A revolução não acontecerá, mas daremos ao povo as ferramentas para se expressar de outras maneiras."
 FRA_republic_stabilized_right: "República Forte"
 FRA_republic_stabilized_right_desc: "A ameaça tradicionalista foi esmagada, e usamos a crise para aprovar reformas abrangentes que reforçam o poder do Estado. A DGSI agora tem autoridade de vigilância ampliada, a polícia tem novos poderes contra organizações extremistas e a autoridade do executivo foi fortalecida. A Quinta República perdura: mais forte, mais centralizada e firmemente sob controle nacionalista."
 FRA_general_strike: "Greve Geral Revolucionária"
 FRA_general_strike_desc: "Uma facção radical dentro da coalizão de esquerda mobilizou os trabalhadores para uma greve geral, indo além do que a liderança moderada pretendia. A CGT foi capturada por radicais revolucionários que veem isso como o primeiro passo para acabar por completo com a República. A liderança do partido perdeu o controle do movimento que iniciou."
 FRA_sixth_republic_idea: "A Sexta República"
 FRA_sixth_republic_idea_desc: "Ninguém queria mais a Quinta República, então a encerramos democraticamente e estabelecemos uma nova república mais próxima do povo.\n§g--------------§!\nEste espírito nacional será §RRemovido§! se radicais acabarem com a República:\n- §YO Partido Comunista Francês§!: complete §Y$FRA_turn_reform$§! e permita que os radicais se organizem. Quando §Y$FRA_radical_infiltration$§! expirar, complete §Y$FRA_constitutional_crisis_pcf$§! e deixe-os em paz para proclamar a §YComuna Francesa§!.\n- §YA Frente Nacional§!: complete §Y$FRA_focus_insecurity$§! e permita que os tradicionalistas se organizem. Quando §Y$FRA_traditionalist_infiltration$§! expirar, complete §Y$FRA_question_republic_fn$§! e deixe-os em paz para restaurar o §YReino§! ou o §YImpério§!."
 FRA_commune_reborn_idea: "A Comuna Francesa"
 FRA_commune_reborn_idea_desc: "Os radicais revolucionários triunfaram por completo. Os reformistas moderados que um dia lideraram a esquerda foram expurgados enquanto a França se transforma em um Estado operário. No espírito de 1871, conselhos operários agora governam e os meios de produção foram coletivizados. A bandeira vermelha tremula onde antes tremulava a tricolor."
 FRA_kingdom_restored_idea: "O Reino Restaurado"
 FRA_kingdom_restored_idea_desc: "Os extremistas tradicionalistas dentro do movimento nacionalista realizaram seu sonho: a França novamente tem um rei. Os republicanos moderados do Reagrupamento Nacional assistem incrédulos enquanto a Action Française comemora e a flor-de-lis substitui a tricolor."
 FRA_exploitation: "Sangrados pela Metrópole"
 FRA_exploitation_desc: "Nossas fábricas, nosso comércio e nossos impostos vão primeiro para Paris e depois para o nosso próprio povo. Cada carregamento que sai das docas nos rende um pouco mais de ressentimento em casa e um pouco mais de distância do Império."
 FRA_empire_restored_idea: "O Império Restaurado"
 FRA_empire_restored_idea_desc: "A facção bonapartista dentro do movimento restaurou o Império Francês sob Napoleão VII. Os republicanos moderados que construíram o Reagrupamento Nacional foram varridos por aqueles que sonham com a glória imperial. A França é novamente governada por um Imperador, e a aliança militar-tradicionalista celebra sua vitória completa."
 FRA_investing_eu: "Investindo em um País da UE"
 FRA_investing_eu_desc: "Atualmente estamos ajudando outra nação da UE a se desenvolver"
 FRA_election_result: "Os Resultados"
 FRA_election_result_desc: "A eleição presidencial acabou ou está prestes a acabar; as intenções de voto dificilmente mudarão por algum tempo."
 FRA_spy_napoleon_lar: "Serviço Secreto Bonapartista"
 FRA_spy_napoleon_lar_desc: "Uma nova geração de agentes secretos treinados para semear a discórdia entre nossos inimigos, alimentando em tempo real o exército, a marinha e o estado-maior aéreo com informações enquanto a reconquista ganha ritmo."
 FRA_spy_napoleon_non_lar: "Serviço Secreto Bonapartista"
 FRA_spy_napoleon_non_lar_desc: "Uma nova geração de agentes secretos treinados para semear a discórdia entre nossos inimigos, vigiando nossos próprios quartéis e ministérios em busca da próxima conspiração contra o trono."
 FRA_5th_republic: "A Quinta República"
 FRA_5th_republic_desc: "O atual sistema político francês, em vigor desde 1958. Uma república estabelecida sob o General de Gaulle e feita sob medida para suas necessidades. Um sistema estável, mas que começa a mostrar seus limites em um país cada vez mais desequilibrado, com um presidente todo-poderoso.\n§g--------------§!\nEste espírito nacional será §RRemovido§! e substituído por §YA Sexta República§! se a §YFrança Insubmissa§! completar o foco §Y$FRA_dawn_6th_rep$§! e vencer o referendo. Para levar a §YFrança Insubmissa§! ao poder, eleja §YO Partido Socialista§! e complete o foco §Y$FRA_cut_with_unions$§!.\n\nTambém será §RRemovido§! se radicais acabarem com a República:\n- §YO Partido Comunista Francês§!: complete §Y$FRA_turn_reform$§! e permita que os radicais se organizem. Quando §Y$FRA_radical_infiltration$§! expirar, complete §Y$FRA_constitutional_crisis_pcf$§! e deixe-os em paz para proclamar a §YComuna Francesa§!.\n- §YA Frente Nacional§!: complete §Y$FRA_focus_insecurity$§! e permita que os tradicionalistas se organizem. Quando §Y$FRA_traditionalist_infiltration$§! expirar, complete §Y$FRA_question_republic_fn$§! e deixe-os em paz para restaurar o §YReino§! ou o §YImpério§!."
 FRA_war_against_republic: "Guerra contra o Republicanismo"
 FRA_war_against_republic_desc: "A monarquia francesa estava em seu auge sob o absolutismo. Desde então, nosso país suportou décadas de repúblicas, cada uma mais instável que a anterior. Os valores republicanos e democráticos são perigosos para nosso país e se espalham como um câncer pelo mundo. Devemos pôr fim a isso."
 FRA_EU_strong: "Força com a UE"
 FRA_EU_strong_desc: "Ser um pilar da União Europeia é uma grande responsabilidade, mas também uma grande força. Nosso destino está ligado ao da União Europeia, queiramos ou não."
 FRA_NOTRe_law: "Lei NOTRe"
 FRA_NOTRe_law_desc: "A descentralização não foi devidamente implementada na França, deixando numerosas brechas legais e inconsistências. A Lei sobre a Nova Organização dos Territórios da República permitirá corrigir essas falhas e simplificar a organização e o planejamento de nossos territórios."
 FRA_military_indus_boost: "Investindo em Nossa Indústria de Defesa"
 FRA_military_indus_boost_desc: "Dadas as crescentes tensões internacionais, não devemos poupar despesas na preparação para um possível conflito."
 FRA_civilian_jobs_boost: "Foco na Criação de Empregos"
 FRA_civilian_jobs_boost_desc: "Precisamos investir mais no mercado de trabalho para oferecer a nossos cidadãos uma ampla gama de oportunidades de emprego."
 FRA_internal_investment_boost: "Foco em Investimentos Internos"
 FRA_internal_investment_boost_desc: "Ao conceder subsídios ao setor privado, poderemos incentivá-lo a criar mais empregos."
 FRA_direct_construction_boost: "Investindo em Obras Públicas"
 FRA_direct_construction_boost_desc: "Como o mercado não está indo bem, devemos usar nossa força de trabalho para construir a economia de amanhã."
 FRA_indusfarm_boost: "Subsidiando a Agricultura"
 FRA_indusfarm_boost_desc: "Devemos ajudar nosso setor agrícola a reconquistar os mercados europeus aumentando nossa produção, por quaisquer meios."
 FRA_civilian_infra_boost: "Investindo em Infraestrutura"
 FRA_civilian_infra_boost_desc: "Precisamos investir nas áreas não metropolitanas para que as pessoas de lá tenham acesso aos mesmos serviços das áreas metropolitanas."
 FRA_indusbuild_services_boost: "Investindo na Indústria de Serviços"
 FRA_indusbuild_services_boost_desc: "Estamos construindo a economia de amanhã, livre de indústrias pouco competitivas e poluentes."
 FRA_techno_boost: "Investimentos em Educação"
 FRA_techno_boost_desc: "O que precisamos é permitir que todos possam seguir os estudos mais avançados."
 FRA_res_health_boost: "Foco nos Serviços Públicos"
 FRA_res_health_boost_desc: "Devemos reconstruir a prestação de serviços que por tempo demais foi alvo de políticas ultraliberais."
 FRA_local_consumption_boost: "Apoiando a Relocalização de Nosso Abastecimento Alimentar"
 FRA_local_consumption_boost_desc: "Nossas mesas são abastecidas do outro lado do mundo enquanto as fazendas francesas fecham. Encurtar a cadeia entre o campo e o prato mantém esse valor dentro do país."
 FRA_job_planned_boost: "Investindo em Nossa Indústria"
 FRA_job_planned_boost_desc: "Devemos ajudar nossas empresas a criar mais empregos e impedi-las de fazer demissões. Isso nos permitirá acabar com o desemprego e, ao mesmo tempo, aumentar a segurança no emprego."
 FRA_ps_EUtrain: "Missão de Treinamento Francesa"
 FRA_ps_EUtrain_desc: "O governo francês nos convidou a participar de exercícios militares conjuntos com outros países da União Europeia."
 FRA_PCF_EUtrain: "Preparando a Escalada no Leste"
 FRA_PCF_EUtrain_desc: "Diante de uma possível agressão da Rússia, devemos nos preparar para enfrentá-la no campo de batalha."
 FRA_EU_LEAVE: "Reconstruindo Nossa Economia"
 FRA_EU_LEAVE_desc: "Nossa economia estava integrada demais à União Europeia; romper com ela teve consequências de grande alcance. Vamos reconstruí-la para que seja ainda mais forte e independente."
 FRA_patriotic_fervor: "Fervor patriótico"
 FRA_patriotic_fervor_desc: "A reconquista de nosso Império mal começou."
 FRA_learning_from_worforce: "Integrando a Sociedade"
 FRA_learning_from_worforce_desc: "Estamos integrando o conhecimento e a força de trabalho de uma nação irmã."
 FRA_attack_UK_king: "La Royale"
 FRA_attack_UK_king_desc: "Nossa atenção pode estar voltada para o Reino Unido como antigo inimigo da França. Mas, de qualquer forma, teremos de combater uma potência marítima mais cedo ou mais tarde. A Marinha Francesa deve, portanto, estar preparada para lutar no mar."
 FRA_french_papacy: "Papado sob Controle"
 FRA_french_papacy_desc: "Decidimos abrigar a sede da Igreja Católica na França. Estamos, portanto, em condições de protegê-la e assim gozar de maior legitimidade aos olhos de outros países cristãos."
 FRA_gaullist_foreign_policy: "Política Externa Gaullista"
 FRA_gaullist_foreign_policy_desc: "Seguindo a visão do General de Gaulle, a França persegue uma política de independência estratégica em relação a ambas as superpotências. Mantemos distância da hegemonia americana enquanto nos relacionamos de forma pragmática com a Rússia e a China. A França deve ser uma grande potência por mérito próprio, não uma vassala de Washington."
 FRA_anti_american_stance: "Postura Antiamericana"
 FRA_anti_american_stance_desc: "O governo francês adotou uma atitude abertamente hostil em relação aos Estados Unidos. As operações militares americanas não receberão apoio francês, e as relações diplomáticas esfriaram significativamente. A França traça seu próprio rumo, livre de amarras atlânticas."
 FRA_fn_russia_alignment_idea: "Alinhamento Reagrupamento Nacional-Rússia"
 FRA_fn_russia_alignment_idea_desc: "O governo do Reagrupamento Nacional cultivou laços estreitos com a Rússia, refletindo conexões históricas e a oposição compartilhada ao liberalismo americano. Os elogios de Marine Le Pen aos 'valores tradicionais' de Putin se traduziram em alinhamento concreto de políticas em múltiplas questões."
 FRA_fn_protectionism: "Patriotismo Econômico"
 FRA_fn_protectionism_desc: "Tarifas e compras públicas agora favorecem o produtor francês em detrimento da importação mais barata, e nossas fábricas estão mais cheias do que em anos. Nossos parceiros comerciais perceberam, e não estão gratos."
 FRA_fn_nationalist_policy: "Preferência Nacional"
 FRA_fn_nationalist_policy_desc: "Uma de nossas principais medidas é a preferência nacional: relegar a segundo plano tudo o que não for francês."
 FRA_communist_foreign_policy: "Política Externa Comunista"
 FRA_communist_foreign_policy_desc: "O Partido Comunista implementou uma reorientação radical da política externa francesa: a aliança com os Estados Unidos é impossível, e a França busca, em vez disso, solidariedade com os Estados socialistas de todo o mundo. A participação na OTAN é fundamentalmente incompatível com nossa ideologia."
 FRA_lfi_non_aligned_policy: "França Não Alinhada"
 FRA_lfi_non_aligned_policy_desc: "A La France Insoumise implementou uma política de não alinhamento, rejeitando tanto a hegemonia americana quanto o autoritarismo russo. A França não participará de aventuras militares americanas e mantém independência em relação às estruturas de comando da OTAN, enquanto busca a liderança de um novo movimento não alinhado."
 FRA_lfi_anti_nato: "Políticas Anti-OTAN"
 FRA_lfi_anti_nato_desc: "Retiramo-nos com sucesso da OTAN; não podíamos mais tolerar as ações do imperialismo americano. Nossa posição atual nos dá maior controle sobre nossa política externa."
 FRA_worker_internationalism: "Farol do Internacionalismo"
 FRA_worker_internationalism_desc: "O comunismo foi um sucesso na França, e isso é um fato. Esse sucesso significa que temos uma força de trabalho satisfeita e nos permite atrair trabalhadores de todo o mundo."
 FRA_lfi_social_europe: "Reforma dos Serviços Públicos Europeus"
 FRA_lfi_social_europe_desc: "A França da LFI conseguiu apresentar uma nova agenda social para a União Europeia. É uma grande vitória contra essa instituição profundamente neoliberal."
 FRA_strategic_independance: "Independência Estratégica"
 FRA_strategic_independance_desc: "A França se comprometeu com a autonomia estratégica total, mantendo sua dissuasão nuclear independente e recusando a subordinação a qualquer potência estrangeira. Bases americanas não são bem-vindas em solo francês, e a França tomará suas próprias decisões sobre intervenções militares."
 FRA_global_south_solidarity: "Solidariedade com o Sul Global"
 FRA_global_south_solidarity_desc: "O colonialismo inegavelmente teve um impacto significativo no desenvolvimento dos países do Sul Global. Faremos a coisa certa ajudando-os a se recuperar disso."
 FRA_sovereigntist_eu_policy: "Política Soberanista para a UE"
 FRA_sovereigntist_eu_policy_desc: "A França bloqueia a federalização da UE, defendendo a soberania nacional contra a tecnocracia de Bruxelas. Embora permaneça na UE, vetamos qualquer transferência de soberania e nos opomos à criação de um superestado europeu. A França não se tornará uma província."
 FRA_distance_nato: "Distância da OTAN"
 FRA_distance_nato_desc: "Seguindo o precedente de De Gaulle em 1966, a França mantém distância da estrutura de comando integrado da OTAN, permanecendo signatária do tratado. Tropas americanas não estão estacionadas em solo francês, e a França se reserva o direito de ação militar independente."
 FRA_left_nato: "Saiu da OTAN"
 FRA_left_nato_desc: "A França se retirou por completo da Organização do Tratado do Atlântico Norte. Não mais vinculada ao Artigo 5, a França traça um rumo verdadeiramente independente em assuntos militares, rejeitando de vez a hegemonia americana."
 FRA_political_balance: "Tendências da Opinião Pública"
 FRA_political_balance_desc: "Embora nossas instituições tenham sido concebidas para garantir estabilidade, o equilíbrio político nunca foi tão precário. Partidos sobem e caem. Quem quer que você seja, precisará consolidar nosso domínio sobre a opinião pública."
 FRA_econ_policy: "Estado da Economia Francesa"
 FRA_econ_policy_desc: "A economia francesa é um bom exemplo de economia ocidental na aurora do novo milênio, em transição de uma potência industrial para uma economia em processo de reestruturação. Veremos como suas reformas afetarão seu rumo futuro."
 FRA_social_balance: "Políticas Sociais Francesas"
 FRA_social_balance_desc: "A França é um país que investe pesadamente em sua política social em todos os níveis. No entanto, a maioria dos partidos tem problemas com essa política. Cada um tem sua própria visão de como ela deveria mudar. Veremos como suas decisões a afetam."
 FRA_6th_rep: "Reformas da Sexta República"
 FRA_6th_rep_desc: "A La France insoumise conseguiu reformar a Quinta República. Mas, além das instituições, essas reformas terão consequências de grande alcance para a sociedade e a economia francesas."
 FRA_Commies_agenda: "Políticas da Comuna Francesa"
 FRA_Commies_agenda_desc: "A Comuna da França decidiu fazer uma ruptura total com o passado e está determinada a reconstruir a sociedade do zero."
 FRA_Bonapartist_agenda: "A Sociedade Imperial"
 FRA_Bonapartist_agenda_desc: "Nosso novo Imperador decidiu reformar a sociedade francesa para torná-la maior e mais forte diante dos conflitos que virão."
 FRA_Royalist_agenda: "A Nova Sociedade Franca"
 FRA_Royalist_agenda_desc: "Devemos pôr fim a todas as invenções diabólicas da maldita Revolução. Reconstruiremos a sociedade franca sobre alicerces sólidos."
 FRA_World_revolution: "A Revolução Mundial"
 FRA_World_revolution_desc: "À medida que libertamos os povos do capitalismo, juntam-se a nós povos que trazem consigo seu conhecimento e suas esperanças. Em breve, a Internacional será toda a humanidade."
 FRA_arab_solidarity_tt: "Relações melhoradas com nações árabes e de maioria muçulmana"
 FRA_blocks_eu_federalization_tt: "A França bloqueia a federalização da UE devido à política soberanista"
 FRA_cannot_ally_usa_hard_tt: "Não pode se aliar aos EUA"
 FRA_cannot_host_american_bases_tt: "Não pode abrigar bases militares americanas"
 FRA_cannot_join_american_coalitions_tt: "Não pode ingressar em coalizões militares lideradas pelos EUA"
 FRA_debt_forgiveness_tt: "Apoia o perdão da dívida e a cooperação para o desenvolvimento do Sul Global"
 FRA_demands_eu_social_reform_tt: "Exige reforma social das instituições da União Europeia"
 FRA_immigration_restrictions_tt: "A imigração para a França é fortemente restringida"
 FRA_improved_russia_relations_tt: "Relações melhoradas com a Rússia"
 FRA_israel_relations_penalty_tt: "Relações pioradas com Israel"
 FRA_left_nato_command_tt: "A França deixou a estrutura de comando integrado da OTAN"
 FRA_non_aligned_policy_tt: "A França adota uma política de não alinhamento"
 FRA_opposes_nato_expansion_tt: "Opõe-se a qualquer nova expansão da OTAN"
 FRA_socialist_solidarity_tt: "Relações melhoradas com Estados socialistas e comunistas"
 FRA_trade_protectionism_tt: "A indústria nacional é protegida da concorrência estrangeira"
 FRA_usa_relations_penalty_tt: "Relações pioradas com os Estados Unidos"
 FRA_worker_solidarity_tt: "Atrai trabalhadores do mundo todo por meio da solidariedade internacional dos trabalhadores"
 france_md.800.t: "A França se Volta Contra a América"
 france_md.800.d: "O novo governo francês adotou uma postura abertamente antiamericana, rejeitando a cooperação com Washington e criticando duramente a política externa americana. Isso representa uma mudança dramática nas relações transatlânticas. Como os Estados Unidos devem responder a essa guinada hostil em Paris?"
 france_md.800.a: "Condenar essa política hostil"
 france_md.800.b: "Tentar uma aproximação diplomática"
 france_md.801.t: "Aproximação Diplomática Americana"
 france_md.801.d: "Apesar de nossa postura antiamericana, Washington fez gestos diplomáticos, buscando manter algum nível de cooperação. O Departamento de Estado parece disposto a relevar nossa retórica em troca de um engajamento limitado. Como devemos responder a esses esforços americanos?"
 france_md.801.a: "Rejeitar completamente as investidas americanas"
 france_md.801.b: "Considerar cooperação limitada"
 france_md.802.t: "A França se Volta para a Rússia"
 france_md.802.d: "O novo governo francês sinalizou uma mudança dramática na política externa, buscando laços mais estreitos com Moscou enquanto se distancia de Washington. Esta é uma oportunidade de expandir a influência russa na Europa Ocidental. Como devemos responder a esse realinhamento francês?"
 france_md.802.a: "Fortalecer os laços com a França"
 france_md.802.b: "Proceder com cautela"
 france_md.803.t: "Consequências da Política Externa Comunista"
 france_md.803.d: "Nossa política externa comunista nos isolou dos aliados ocidentais tradicionais, mas abriu portas com movimentos socialistas e anti-imperialistas do mundo todo. Cuba, Venezuela e outros governos de esquerda acolhem nossa nova orientação. No entanto, isso tem um custo para nossas relações com os aliados da OTAN e parceiros tradicionais."
 france_md.803.a: "Abraçar a solidariedade socialista"
 france_md.803.b: "Moderar nossa abordagem"
 france_md.804.t: "A França se Distancia da OTAN"
 france_md.804.d: "[FRA.GetNameWithFlag] anunciou uma política de distanciamento da OTAN, ecoando a retirada de De Gaulle em 1966 da estrutura de comando integrado. O governo francês enfatizou a 'independência estratégica' e rejeitou a subordinação ao comando militar americano. Como devemos encarar esse desdobramento?"
 france_md.804.a: "Expressar preocupação com a coesão da aliança"
 france_md.804.b: "Permanecer neutro quanto à política francesa"
 france_md.805.t: "Reconhecimento da Palestina"
 france_md.805.d: "Nossa política externa de extrema esquerda nos compromete a reconhecer o Estado da Palestina e apoiar a solução de dois Estados. Isso melhorará as relações com os Estados árabes e se alinha a nossos princípios anti-imperialistas, mas prejudicará as relações com Israel e potencialmente com os Estados Unidos. Devemos prosseguir com o reconhecimento formal?"
 france_md.805.a: "Reconhecer a Palestina imediatamente"
 france_md.805.b: "Adiar o reconhecimento por ora"
 france_md.806.t: "A França Reconhece a Palestina"
 france_md.806.d: "O governo francês reconheceu formalmente o Estado da Palestina, marcando uma mudança significativa na política externa parisiense. Essa decisão alinha a França a muitas nações europeias, mas representa um afastamento da abordagem cautelosa anterior. Como Israel deve responder a esse desdobramento diplomático?"
 france_md.806.a: "Condenar veementemente o reconhecimento francês"
 france_md.806.b: "Emitir uma resposta comedida"
 france_md.807.t: "O Dilema da Guerra na Ucrânia"
 france_md.807.d: "A invasão da Ucrânia pela Rússia representa uma crise para nossa política externa pró-Rússia. Nosso alinhamento anterior com Moscou é agora profundamente problemático, com tanques russos avançando sobre uma nação europeia soberana. O custo político de manter a neutralidade é enorme, mas condenar a Rússia seria uma reviravolta completa. Que posição a França deve adotar?"
 france_md.807.a: "Condenar a agressão russa"
 france_md.807.b: "Manter a neutralidade"
 france_md.807.c: "Apoiar a posição da Rússia"
 france_md.808.t: "Política Soberanista Francesa"
 france_md.808.d: "[FRA.GetNameWithFlag] adotou uma postura fortemente soberanista dentro da União Europeia, bloqueando maior integração e vetando transferências de soberania para Bruxelas. O governo francês defende uma 'Europa das Nações' em vez de um superestado federal. Como devemos responder a esse obstrucionismo francês?"
 france_md.808.a: "Opor-se ao obstrucionismo francês"
 france_md.808.b: "Simpatizar com as preocupações de soberania"
 france_md.809.t: "Iniciativa do Movimento Não Alinhado"
 france_md.809.d: "Nossa política externa não alinhada atraiu o interesse de outras nações que buscam alternativas tanto à esfera de influência americana quanto à russa. Temos a oportunidade de posicionar a França como líder de um novo movimento não alinhado, trabalhando com a Índia, o Brasil e outras grandes potências fora dos blocos tradicionais."
 france_md.809.a: "Buscar a liderança não alinhada"
 france_md.809.b: "Focar nas prioridades internas"
 france_md.810.t: "Independência Estratégica Francesa"
 france_md.810.d: "[FRA.GetNameWithFlag] anunciou uma política de completa independência estratégica, recusando a subordinação a qualquer potência estrangeira e enfatizando o papel da dissuasão nuclear francesa. Isso pode ter implicações para a parceria franco-alemã, que tem sido a base da cooperação europeia. Como a Alemanha deve responder?"
 france_md.810.a: "Expressar preocupação com as relações bilaterais"
 france_md.810.b: "Respeitar a soberania francesa"
 france_md.811.t: "A França Abraça a Multipolaridade"
 france_md.811.d: "O governo francês anunciou apoio a uma ordem mundial multipolar, rejeitando a hegemonia americana e buscando laços mais estreitos com potências emergentes. Isso representa uma oportunidade para a China expandir sua influência na Europa. Como Pequim deve responder a essa abertura francesa?"
 france_md.811.a: "Fortalecer os laços com a França"
 france_md.811.b: "Manter um engajamento cauteloso"
 france_md.812.t: "A França Deixa a OTAN"
 france_md.812.d: "Retiramo-nos formalmente da Organização do Tratado do Atlântico Norte, completando nossa ruptura com a hegemonia americana. A França agora está sozinha, nem vinculada ao Artigo 5 nem sujeita ao comando militar americano. Essa decisão abre novas possibilidades e perigos reais. Que caminho a França deve seguir?"
 france_md.812.a: "Abraçar a independência estratégica total"
 france_md.812.b: "Buscar novas alianças"
 FRA_extremist_foreign_policy_category: "Política Externa Extremista"
 FRA_extremist_foreign_policy_category_desc: "Ações diplomáticas e de política externa disponíveis para a França sob um governo extremista ou gaullista."
 FRA_rejoin_nato_command: "Retornar ao Comando Integrado da OTAN"
 FRA_rejoin_nato_command_desc: "Após nos distanciarmos da OTAN, podemos optar por voltar à estrutura de comando militar integrado. Isso restauraria nossa posição na aliança e melhoraria as relações com aliados americanos e europeus."
 FRA_seek_russian_partnership: "Buscar Parceria Russa"
 FRA_seek_russian_partnership_desc: "Nossa política externa independente cria uma oportunidade de fortalecer os laços com Moscou. Podemos buscar relações diplomáticas e econômicas mais estreitas com a Rússia, embora isso desgaste ainda mais as relações com Washington."
 FRA_recognize_palestine: "Reconhecer a Palestina"
 FRA_recognize_palestine_desc: "Nossa política externa anti-imperialista exige que reconheçamos o Estado da Palestina e apoiemos o direito do povo palestino à autodeterminação. Isso melhorará as relações com os Estados árabes, mas prejudicará os laços com Israel."
 FRA_condemn_russia_ukraine: "Condenar a Agressão Russa"
 FRA_condemn_russia_ukraine_desc: "A invasão da Ucrânia pela Rússia tornou politicamente insustentável nossa postura pró-Rússia. Podemos optar por condenar a agressão e nos distanciar de Moscou, embora isso represente uma reviravolta significativa de política."
 FRA_non_aligned_initiative: "Iniciativa de Liderança Não Alinhada"
 FRA_non_aligned_initiative_desc: "Nossa política externa não alinhada posiciona a França para liderar um novo movimento de nações que buscam alternativas tanto à hegemonia americana quanto à influência russa. Podemos fortalecer os laços com a Índia, o Brasil e outras grandes potências fora dos blocos tradicionais."
 FRA_socialist_solidarity: "Solidariedade Socialista"
 FRA_socialist_solidarity_desc: "Nossa política externa comunista exige solidariedade com os Estados socialistas de todo o mundo. Podemos fortalecer os laços com Cuba, Venezuela e outros governos de esquerda, construindo uma rede internacional de cooperação anticapitalista."
 FRA_veto_eu_federalization: "Vetar a Federalização da UE"
 FRA_veto_eu_federalization_desc: "Como nação soberana dentro da UE, podemos usar nosso poder de veto para bloquear a federalização e as transferências de soberania para Bruxelas. Isso defende a independência francesa, mas desgasta as relações com os Estados-membros favoráveis à integração."
 FRA_immigration_wave: "Capitalizar a Onda de Imigração"
 FRA_immigration_wave_desc: "As atuais políticas liberais de imigração da França levaram a uma entrada significativa de migrantes. Embora alguns vejam isso como uma necessidade humanitária ou oportunidade econômica, outros o encaram com crescente preocupação. O Reagrupamento Nacional pode capitalizar esses sentimentos, apresentando-se como defensor da identidade e da segurança francesas. Quanto mais abertas as nossas fronteiras, maior a reação que podemos canalizar."
 FRA_high_immigration_tooltip: "A França deve ter a lei de §YFronteiras Abertas§! ou de §YImigração Levemente Regulada§!"
 FRA_immigration_backlash: "Reação à Imigração"
 FRA_immigration_backlash_desc: "Uma onda de sentimento anti-imigração varre a sociedade francesa. A mensagem do Reagrupamento Nacional sobre imigração, segurança e identidade nacional ressoa em uma parcela crescente da população, deslocando o cenário político para a direita e enfraquecendo o apoio ao status quo."
 FRA_end_extraction: "Restringir a Extração de Recursos"
 FRA_end_extraction_desc: "Em busca de nossa visão ambiental, implementaremos regulamentações rigorosas sobre operações de mineração, extração de petróleo e atividades industriais pesadas em toda a França continental. Isso reduzirá a produção doméstica de recursos em cerca de um terço, mas representa um passo necessário para a proteção ambiental. Governos futuros poderão reverter essa política se as circunstâncias mudarem."
 FRA_green_extraction_ban: "Restrições Ambientais à Extração"
 FRA_green_extraction_ban_desc: "A França implementou restrições ambientais abrangentes à extração de recursos. As operações de mineração enfrentam limites rígidos, a perfuração de petróleo é fortemente regulada e a extração industrial deve atender a exigentes padrões ambientais. Embora isso tenha reduzido a disponibilidade doméstica de recursos em cerca de um terço, a redução da poluição levou a melhorias mensuráveis na saúde: as taxas de câncer em antigas regiões industriais caíram significativamente, e os custos de saúde estão diminuindo."
 FRA_environmental_policy_decisions: "Política Ambiental"
 FRA_environmental_policy_decisions_desc: "Decisões relacionadas às políticas ambientais da França e às regulamentações de extração de recursos."
 FRA_reverse_extraction_ban: "Revogar as Restrições do Código de Mineração"
 FRA_reverse_extraction_ban_desc: "O código de mineração reescrito tornou nossa indústria extrativa inviável e deixou as refinarias dependentes de importações. Revogá-lo restaura a produção doméstica e rompe com os Verdes e as associações ambientais que o redigiram."
 france_md.960.t: "A França Reescreve Seu Código de Mineração"
 france_md.960.d: "[FRA.GetNameWithFlag] reescreveu seu código de mineração, encerrando as licenças de hidrocarbonetos e limitando a extração em toda a França metropolitana. Cerca de um terço da produção doméstica francesa desaparece com isso. As associações ambientais estão jubilantes, e as federações industriais já estão em Bruxelas alertando sobre o precedente."
 france_md.960.a: "Um precedente que vale seguir"
 france_md.960.b: "A indústria europeia pagará por isso"
 france_md.900.t: "A Conta Oculta do Ministro do Orçamento"
 france_md.900.d: "Nosso ministro do orçamento, que comanda a campanha contra a fraude fiscal a partir de Bercy, negou possuir uma conta no exterior à própria Assemblée nationale. Um site investigativo agora publicou o rastro: primeiro Genebra, depois Singapura. A negação está registrada, e era mentira."
 france_md.900.a: "Demitir o ministro e entregar o dossiê aos promotores"
 france_md.900.b: "Aceitar uma renúncia discreta"
 france_md.900.c: "Manter o apoio ao ministro"
 france_md.901.t: "Uma Autoridade de Transparência para a Vida Pública"
 france_md.901.d: "O escândalo tornou inevitáveis as declarações de patrimônio. Podemos criar uma autoridade independente para a transparência na vida pública, obrigando todo ministro, deputado e senador a declarar seus interesses e seu patrimônio, com poder de encaminhar os casos duvidosos aos promotores. A Assemblée ressentirá cada linha disso."
 france_md.901.a: "Criar a autoridade de transparência"
 france_md.901.b: "Publicar um código de conduta e seguir em frente"
 france_md.902.t: "O Assistente Parlamentar Fictício do Candidato"
 france_md.902.d: "O Le Canard enchaîné publicou os contracheques: um importante candidato presidencial colocou um familiar na folha de pagamento parlamentar por um trabalho que ninguém no gabinete consegue atestar. O Parquet national financier abriu um inquérito preliminar na mesma manhã. O candidato chama isso de complô institucional e se recusa a desistir."
 france_md.902.a: "Retirar o candidato da corrida"
 france_md.902.b: "Continuar a campanha mesmo assim"
 france_md.902.c: "Culpar os juízes e a imprensa"
 france_md.903.t: "Um Ex-Presidente no Banco dos Réus"
 france_md.903.d: "Um ex-Presidente da República é acusado de cargos municipais fictícios pagos pelos contribuintes de Paris e de faturas de campanha cobradas a uma empresa por comícios que nunca aconteceram. A imunidade presidencial terminou com seu mandato. O tribunal correcional marcou uma data."
 france_md.903.a: "Deixar o tribunal fazer seu trabalho"
 france_md.903.b: "Denunciar um julgamento político"
 france_md.910.t: "Coletes Amarelos nas Rotatórias"
 france_md.910.d: "Um imposto de carbono sobre o diesel colocou coletes de alta visibilidade em todas as rotatórias do país. Não há sindicato por trás, nem partido, nem delegação com quem negociar: apenas motoristas, pequenos comerciantes e aposentados que não conseguem absorver mais um centavo na bomba. O sábado se tornou uma manifestação permanente."
 france_md.910.a: "Cancelar o aumento do imposto sobre combustíveis"
 france_md.910.b: "Manter o imposto e abrir negociações"
 france_md.910.c: "Manter firme a posição sobre o imposto"
 france_md.911.t: "A Champs-Élysées Arde no Sábado"
 france_md.911.d: "As marchas de sábado agora terminam com gás lacrimogêneo na Champs-Élysées, com o Arco do Triunfo pichado e as brasseries da avenida saqueadas. A préfecture de police está ficando sem companhias de CRS descansadas e é culpada por toda a tarde. As lojas estão sendo tapadas com tábuas para a temporada."
 france_md.911.a: "Convocar o Grand Débat National"
 france_md.911.b: "Aumentar o salário mínimo e reduzir a CSG sobre as aposentadorias"
 france_md.911.c: "Enviar a CRS"
 france_md.912.t: "Quinto Mês nas Rotatórias"
 france_md.912.d: "As ocupações entram no quinto mês, e os projéteis de borracha disparados por nossa própria polícia estão eles próprios sob inquérito judicial. A arrecadação nos centros das cidades desabou e as préfectures não conseguem continuar encontrando companhias novas. Matignon quer uma decisão esta semana."
 france_md.912.a: "Declarar uma emergência econômica e social"
 france_md.912.b: "Proibir as marchas e impor estado de emergência"
 france_md.920.t: "Os Socialistas Perdem Sua Sede"
 france_md.920.d: "O financiamento público segue as cadeiras, e depois das duas últimas rodadas não há o bastante para manter as luzes acesas em Solférino. Os frondeurs querem levar o partido de volta à esquerda, os prefeitos e os ex-ministros querem mantê-lo apto a governar, e ambas as alas são cortejadas de fora. O prédio já foi avaliado."
 france_md.920.a: "Levar o partido de volta à esquerda"
 france_md.920.b: "Ancorar o partido no centro governista"
 france_md.920.c: "Deixar as alas partirem"
 france_md.921.t: "O Partido Debate a Dédiabolisation"
 france_md.921.d: "A nova liderança do Reagrupamento Nacional quer respeitabilidade: argumentos econômicos em vez de étnicos, chega de provocações sobre os campos e candidatos capazes de sobreviver a uma entrevista de televisão. O alvo é o front républicain que barrou o partido de todo segundo turno. A geração fundadora chama isso de rendição."
 france_md.921.a: "Deixar o partido se normalizar"
 france_md.921.b: "Manter o partido em sua linha antiga"
 france_md.921.c: "Deixar a família fundadora brigar em público"
 france_md.922.t: "O Fundador Contra Seu Próprio Partido"
 france_md.922.d: "O fundador repetiu sua velha provocação sobre os campos, diante das câmeras, no meio de uma campanha da qual não participa. A liderança convocou um painel disciplinar e está retirando a presidência honorária dos estatutos. O congresso decidirá se o partido mantém seu nome."
 france_md.922.a: "Entregar o partido à nova geração"
 france_md.922.b: "Expulsar o fundador"
 france_md.923.t: "A Direita Rompe a Frente Republicana"
 france_md.923.d: "O líder da direita tradicional foi ao noticiário da noite e anunciou um pacto eleitoral com o Reagrupamento Nacional, sem submetê-lo ao seu próprio birô político. O birô teve de se reunir numa sala alugada, porque ele havia trancado a sede do partido. Quarenta anos de front républicain acabaram em uma única transmissão."
 france_md.923.a: "Expulsá-lo e recusar o pacto"
 france_md.923.b: "Ratificar o pacto para o segundo turno"
 france_md.923.c: "Deixar o partido se partir em dois"
 france_md.930.t: "Oito Sindicatos Contra a Reforma da Previdência"
 france_md.930.d: "Elevar a idade legal de aposentadoria colocou todos os oito sindicatos representativos na mesma plataforma pela primeira vez em uma geração. A SNCF e a RATP realizam greves rotativas, as refinarias são as próximas, e a Assemblée não tem maioria para o texto. O Artigo 49.3 está sobre a mesa em Matignon."
 france_md.930.a: "Forçar o texto com o 49.3"
 france_md.930.b: "Negociar com os sindicatos reformistas"
 france_md.930.c: "Retirar o texto"
 france_md.931.t: "Os Sindicatos Reformistas Oferecem Condições"
 france_md.931.d: "As confederações reformistas aceitarão uma idade de aposentadoria mais tardia se ela chegar em etapas trimestrais e se carreiras longas e trabalhos penosos tiverem isenções. A economia cai pela metade e as federações linha-dura não assinarão absolutamente nada. É o único texto com assinaturas."
 france_md.931.a: "Assinar o compromisso"
 france_md.931.b: "Recusar e deixar as greves correrem"
 france_md.932.t: "As Universidades Estão Bloqueadas"
 france_md.932.d: "Um contrato de primeiro emprego que permite aos empregadores demitir menores de 26 anos sem declarar motivo pôs lixeiras diante dos portões da Sorbonne e de metade dos campi do interior. Os sindicatos estudantis foram acompanhados pelos liceus e pela CGT. A préfecture pede autorização para desocupar os prédios."
 france_md.932.a: "Retirar o contrato"
 france_md.932.b: "Negociar com os sindicatos estudantis"
 france_md.932.c: "Desocupar os campi"
 france_md.940.t: "Uma Eleição Tensa"
 france_md.940.d: "O primeiro turno de uma eleição local eliminou os candidatos governistas da maioria das cidades da França e colocou um partido extremista no segundo turno. Em uma hora, os apelos por um front républicain já circulavam: votem em quem restar e discutam depois. Outros respondem que um voto extraído assim não é um mandato."
 france_md.940.a: "Convocar um front républicain"
 france_md.940.b: "Deixar o segundo turno nas mãos dos eleitores"
 france_md.940.c: "Tratar o resultado como um veredicto sobre nós"
 france_md.941.t: "Um Movimento Fora dos Velhos Partidos"
 france_md.941.d: "Um ex-ministro deixou o governo para construir um movimento próprio, nem de esquerda nem de direita, financiado por comícios com ingressos e construído sobre uma lista de membros reunida de porta em porta. Deputados de ambos os partidos governantes já perguntam sobre vagas em suas listas. Nenhum dos partidos tem um candidato que pontue acima dele."
 france_md.941.a: "Apoiar o movimento"
 france_md.941.b: "Descartá-lo como moda passageira"
 france_md.941.c: "Forçar os velhos partidos a se renovarem"
 france_md.950.t: "Noites de Distúrbios nas Banlieues"
 france_md.950.d: "Dois adolescentes morreram fugindo de uma verificação de identidade em uma cité de Seine-Saint-Denis. Na terceira noite, os carros queimados eram contados aos milhares, dos subúrbios do norte até Toulouse e Estrasburgo. Os prefeitos pedem toques de recolher com base na lei de 1955."
 france_md.950.a: "Impor toques de recolher com base na lei de 1955"
 france_md.950.b: "Financiar a agência de renovação e os bairros prioritários"
 france_md.950.c: "Prometer limpar os conjuntos habitacionais"
 france_md.949.t: "Ataques Coordenados em Paris"
 france_md.949.d: "Os ataques continuam nos arrondissements do leste e no Stade de France. A BRI está à porta de uma casa de shows com reféns lá dentro. Todos os hospitais da Île-de-France ativaram seu plano de emergência."
 france_md.949.a: "Declarar três dias de luto nacional"
 france_md.951.t: "O Parlamento se Reúne em Congresso"
 france_md.951.d: "As marchas acabaram e as duas câmaras foram convocadas a Versalhes. Beauvau quer a prorrogação do état d'urgence e o dobro da Sentinelle, o Quai d'Orsay quer enviar o grupo de porta-aviões para o leste, e o Conseil d'État já nos alerta sobre as buscas administrativas."
 france_md.951.a: "Prorrogar o état d'urgence"
 france_md.951.b: "Enviar o grupo de porta-aviões para o leste"
 france_md.951.c: "Recusar os poderes de emergência"
 france_md.952.t: "Referendo da Constituição Europeia"
 france_md.952.d: "O tratado irá ao país e não ao Congresso, e a campanha dividiu os dois partidos governantes ao meio. O não é defendido à esquerda como uma carta para o trabalho destacado e à direita como o fim da soberania francesa. As últimas pesquisas colocam os dois campos dentro da margem de erro."
 france_md.952.a: "Fazer campanha intensa pelo sim"
 france_md.952.b: "Ficar fora da campanha"
 france_md.952.c: "Ratificar pelo Congresso"
 france_md.953.t: "A Esquerda Negocia uma Plataforma Comum"
 france_md.953.d: "Os Socialistas, os Comunistas, os Verdes e os insoumis estão dividindo as circunscrições entre si, uma candidatura por vez. Os pontos de atrito não mudaram desde a última tentativa: os tratados europeus e quem encabeça a plataforma. Cada partido calcula se o acordo lhe custa mais cadeiras do que rende."
 france_md.953.a: "Colocar um moderado à frente do bloco"
 france_md.953.b: "Deixar os insoumis definirem a plataforma"
 france_md.953.c: "Deixar as negociações fracassarem"
 france_md.954.t: "Uma Assemblée Sem Maioria"
 france_md.954.d: "A Assemblée voltou dividida em três blocos e nenhum deles consegue alcançar 289 cadeiras. Qualquer candidato a Matignon pode ser censurado no dia da nomeação, e o orçamento precisa ser aprovado antes do fim da sessão. O Eliseu recebe os líderes partidários um a um e não chega a lugar nenhum."
 france_md.954.a: "Nomear um governo de técnicos"
 france_md.954.b: "Dissolver e voltar ao país"
 france_md.954.c: "Construir uma coalizão entre os blocos"
 FRA_ps_platform: "Plataforma do Partido Socialista"
 FRA_ps_platform_desc: "O partido concorre com base no histórico da esquerda plural: a semana de trinta e cinco horas, a cobertura médica universal e os contratos de emprego para jovens, tudo financiado por uma base tributária mais ampla e não por endividamento. Cada compromisso assumido no congresso tem uma linha no orçamento por trás, e a Rue de Solférino pretende ser julgada pela chegada ou não do dinheiro."
 FRA_udf_platform: "Plataforma da União de Centro"
 FRA_udf_platform_desc: "O centro faz campanha por encargos menores para as empresas, uma mão mais leve no código trabalhista e o fim do reflexo de responder a todo problema com um novo tributo. Seu argumento é que o capital só permanecerá na França se a França deixar de tratar o investimento como algo a ser punido."
 FRA_lr_platform: "Plataforma da Direita Republicana"
 FRA_lr_platform_desc: "A direita gaullista oferece a barganha clássica da Quinta República: um exército financiado para agir sozinho quando a República exigir e um Estado despojado das camadas de administração que se acumularam ao seu redor. Ordem em casa e independência no exterior são apresentadas como a mesma política."
 FRA_rpf_platform: "Plataforma Soberanista"
 FRA_rpf_platform_desc: "Pasqua e de Villiers fazem campanha com uma única proposição: nenhum tratado pode transferir o que pertence ao povo francês, e a aplicam ao euro, a Schengen e aos poderes da Comissão por igual. Os parceiros comerciais leem o programa como uma ameaça a todos os acordos que firmaram com Paris."
 FRA_fn_platform: "Plataforma da Frente Nacional"
 FRA_fn_platform_desc: "Preferência nacional em moradia, emprego e assistência social, a suspensão da reunificação familiar e o restabelecimento dos controles de fronteira formam todo o programa. Ele atrai multidões que nenhum outro partido consegue reunir e endurece, na mesma medida, a oposição de todos os demais contra o partido."
 FRA_lfi_platform: "Plataforma da França Insubmissa"
 FRA_lfi_platform_desc: "O movimento faz campanha por uma assembleia constituinte para enterrar a monarquia presidencial, e constrói sua tese nas ruas e nos salões de reunião, e não na Assembleia Nacional. Atendimento médico gratuito no ponto de uso é a principal reivindicação, e as velhas lealdades partidárias se dissolvem por onde a campanha passa."
 FRA_eelv_platform: "Plataforma Ecologista"
 FRA_eelv_platform_desc: "Os Verdes pedem a desativação gradual do programa de reatores, que as obras se submetam a avaliação ambiental e que o dinheiro vá para pesquisas sobre o que substituirá ambos. A transição que descrevem é real, e também o é a década de construção mais lenta que ela exige."
 FRA_pcf_platform: "Plataforma do Partido Comunista"
 FRA_pcf_platform_desc: "O partido ainda detém os municípios do cinturão vermelho e as seções sindicais nas grandes fábricas, e faz campanha onde é mais forte: no chão de fábrica, em torno de salários, jornadas e da defesa do emprego industrial. Onde as células estão ativas, as fábricas funcionam melhor do que as contas preveem."
 FRA_idea_transparency_reforms: "Transparência na Vida Pública"
 FRA_idea_transparency_reforms_desc: "Todo ministro, deputado e senador agora entrega uma declaração de interesses e de patrimônio a uma autoridade independente que pode publicá-las e encaminhar os casos duvidosos aos promotores. A classe política ressentiu a obrigação e a cumpriu."
 FRA_idea_national_debate: "Grande Debate Nacional"
 FRA_idea_national_debate_desc: "Por dois meses, os prefeitos abrem suas câmaras municipais a quem aparecer, e as contribuições são registradas às dezenas de milhares. Custa dinheiro e tempo ministerial, e tira a discussão das rotatórias e a leva para as prefeituras."
 FRA_idea_social_emergency_measures: "Emergência Econômica e Social"
 FRA_idea_social_emergency_measures_desc: "O complemento do salário mínimo foi aumentado, as horas extras foram isentas de imposto e o aumento da CSG foi cancelado para as aposentadorias menores. A conta cai sobre o déficit no mesmo trimestre, e Bruxelas notou."
 FRA_idea_pension_reform_passed: "Reforma da Previdência pelo Artigo 49.3"
 FRA_idea_pension_reform_passed_desc: "A idade de aposentadoria subiu sem votação, sob o artigo que compromete a responsabilidade do governo, e a moção de censura ficou a poucos deputados de passar. As contas da previdência melhoram, e todo texto que enviarmos à Assemblée daqui em diante será lido à luz deste."
 FRA_idea_pension_compromise: "Reforma da Previdência Negociada"
 FRA_idea_pension_compromise_desc: "A idade de aposentadoria sobe em etapas trimestrais, com isenções para carreiras longas e para trabalhos classificados como penosos. As confederações reformistas assinaram, as federações linha-dura não, e a economia é cerca de metade do que o texto original prometia."
 FRA_idea_political_renewal: "Renovação da Classe Política"
 FRA_idea_political_renewal_desc: "Metade das cadeiras da Assemblée nunca ocupou um cargo eletivo, e as máquinas partidárias já não controlam as próprias indicações. A nova safra é visível, enérgica e totalmente inexperiente."
 FRA_idea_urban_renewal: "Renovação Urbana nas Cités"
 FRA_idea_urban_renewal_desc: "A agência de renovação está assinando convenções de quinze anos com os prefeitos dos bairros prioritários, demolindo as piores torres e reconstruindo as escolas atrás delas. Os resultados chegam muito depois do governo que os ordenou."
 FRA_idea_national_unity: "Unidade Nacional Após os Atentados"
 FRA_idea_national_unity_desc: "A oposição suspendeu suas moções, as tricolores estão nas janelas, e a reserva e a gendarmaria têm mais voluntários do que conseguem processar. Não vai durar além do ano, e enquanto dura, vale alguma coisa."
 FRA_idea_technocratic_government: "Governo de Técnicos"
 FRA_idea_technocratic_government_desc: "Prefeitos, inspetores de finanças e ex-banqueiros centrais ocupam os ministérios, nomeados pelo Élysée e tolerados por uma Assemblée que não consegue concordar em mais nada. Eles conseguem aprovar um orçamento. Não conseguem aprovar uma reforma."
 FRA_heightened_security: "Plano Vigipirate Ativo"
 FRA_heightened_security_desc: "O Vigipirate foi elevado a segurança reforçada, e a guarda de locais sensíveis passou da polícia para o exército sob a Opération Sentinelle. Milhares de soldados agora vigiam estações, escolas e locais de culto, e o exército cobra o custo da sua prontidão, e não de Beauvau."
 FRA_state_of_emergency_terrorism: "État d'Urgence Declarado"
 FRA_state_of_emergency_terrorism_desc: "A lei de 1955 está em vigor: prefeitos podem ordenar buscas sem magistrado, determinar prisão domiciliar de indivíduos e proibir reuniões por conta própria. O Parlamento a renova a cada três meses e o Conseil d'État contabiliza os recursos."
 FRA_terror_threat_elevated: "Ameaça Terrorista Elevada"
 FRA_terror_threat_elevated_desc: "A DGSI carrega mais dossiês sobre repatriados e indivíduos radicalizados do que tem agentes para vigiá-los, e a lista só cresce. Grandes eventos estão sendo cancelados por ordem prefeitoral em vez de protegidos."
 FRA_terror_threat_critical: "Ameaça Terrorista Crítica"
 FRA_terror_threat_critical_desc: "Os serviços mantêm várias células operacionais sob vigilância ao mesmo tempo e já não esperam interceptar todas. As folgas foram canceladas em toda a polícia e a gendarmaria, e o ministro do interior parou de dar datas."
 FRA_national_mourning: "Dias de Luto Nacional"
 FRA_national_mourning_desc: "As bandeiras estão a meio mastro em todos os prédios públicos, o minuto de silêncio é feito ao meio-dia e os nomes são lidos nos Invalides. Nenhum negócio está sendo conduzido esta semana."
 FRA_damaged_infrastructure: "Infraestrutura Crítica Danificada"
 FRA_damaged_infrastructure_desc: "Os atentados destruíram uma estação de integração do metrô e um trecho da rede de alta tensão, e os reparos estão atrasados em relação ao cronograma de emergência. As operadoras trabalham sob requisição prefeitoral e o Estado arca com a conta."
 FRA_tourism_crisis: "Crise do Turismo"
 FRA_tourism_crisis_desc: "A ocupação hoteleira na Île-de-France desabou e as operadoras de longa distância cancelaram a temporada inteira. O turismo é nossa maior fonte de divisas, e voltará no ritmo dos noticiários estrangeiros, e não da nossa política de segurança."
 france_md.970.t: "Bomba no RER na Hora do Rush"
 france_md.970.d: "Um artefato deixado em um vagão detonou em uma estação de integração durante o rush matinal, em um trecho de túnel que as equipes de resgate só alcançam a pé. Dezenas estão mortos e o número de feridos ainda sobe. Toda a rede está parada e o plano de vítimas em massa está em vigor."
 france_md.970.a: "Requisitar os hospitais e os serviços de emergência"
 france_md.970.b: "Declarar um dia de luto nacional"
 france_md.970.c: "Reabrir a rede e recusar poderes de emergência"
 france_md.971.t: "Atiradores Atacam uma Delegacia"
 france_md.971.d: "Atacantes com fuzis de assalto e um veículo-bomba combateram numa delegacia dos subúrbios do norte por quarenta minutos antes de a BRI chegar. Há policiais mortos e o prédio está inutilizado. Quem planejou sabia a hora da troca de turno."
 france_md.971.a: "Isolar o departamento e caçar os cúmplices"
 france_md.971.b: "Fortificar todas as delegacias do país"
 france_md.972.t: "Equipes Suicidas Atacam a Capital"
 france_md.972.d: "Três equipes com fuzis de assalto e cintos explosivos atacaram os acessos a um estádio, uma sequência de bares e uma casa de shows na mesma hora. Mais de cem pessoas estão mortas e os cirurgiões da Île-de-France operam em ritmo de guerra. Nada nessa escala foi feito em nosso solo desde a guerra."
 france_md.972.a: "Declarar o état d'urgence"
 france_md.972.b: "Invocar a cláusula europeia de defesa mútua"
 france_md.972.c: "Atacar as bases da organização no exterior"
 france_md.973.t: "Ataque ao Louvre"
 france_md.973.d: "Um homem armado com uma lâmina foi detido no posto de controle do Carrousel, mas a equipe atrás dele entrou pela entrada das Tuileries com explosivos e está agora na ala Denon. Os visitantes estão barricados nas galerias acima deles. A equipe de conservação pede tempo para remover o que ainda pode ser removido."
 france_md.973.a: "Tirar os visitantes primeiro"
 france_md.973.b: "Proteger o acervo antes do assalto"
 france_md.974.t: "Atacantes Dentro de uma Base Militar"
 france_md.974.d: "Uma equipe cruzou o perímetro de uma base aérea no único ponto em que os reparos da cerca estavam suspensos, e alcançou a dispersão de alerta antes que a guarda os detivesse. Conheciam a escala e os códigos dos portões. A contrainteligência militar agora investiga nosso próprio pessoal."
 france_md.974.a: "Revisar a segurança em todas as instalações"
 france_md.974.b: "Deixar a contrainteligência examinar as fileiras"
 france_md.975.t: "Reféns na Torre Eiffel"
 france_md.975.d: "Homens armados subiram de elevador com os primeiros turistas do dia e dominam a plataforma superior com várias centenas de reféns. A maquinaria dos elevadores está minada e o GIGN não consegue se aproximar pelo Champ de Mars sem ser visto a um quilômetro. Eles querem a libertação de prisioneiros e uma transmissão."
 france_md.975.a: "Enviar o GIGN pela torre"
 france_md.975.b: "Conversar com eles e ganhar tempo"
 france_md.975.c: "Recusar todas as exigências"
 france_md.976.t: "Ataque a uma Usina Nuclear"
 france_md.976.d: "Atacantes dominam o bloco administrativo e o prédio de combustível usado de uma usina do vale do Loire. Dizem que abrirão a piscina de combustível no momento em que o local for abordado. O instituto de radiação modelou a nuvem e ela cruza três fronteiras."
 france_md.976.a: "Tomar o reator a frio e enviar o GIGN"
 france_md.976.b: "Assaltar o local com tudo o que temos"
 france_md.980.t: "Ataques Coordenados Devastam Paris"
 france_md.980.d: "Assaltos simultâneos aos acessos de um estádio, a uma casa de shows e a uma sequência de bares em Paris mataram mais de cem pessoas. A França fechou suas fronteiras e pôs seu exército nas ruas. Ministérios do interior de toda a Europa estão relendo seus próprios dossiês sobre repatriados."
 france_md.980.a: "Estamos com a França"
 france_md.981.t: "Atiradores Invadem o Louvre"
 france_md.981.d: "Atacantes armados estão dentro da ala Denon do Louvre, com visitantes barricados nas galerias ao redor. O museu abriga obras que nenhum seguro e nenhuma restauração podem substituir. Todas as grandes coleções do continente estão revendo o que fariam."
 france_md.981.a: "Oferecer ajuda à França"
 france_md.982.t: "Reféns na Torre Eiffel"
 france_md.982.d: "Várias centenas de visitantes são mantidos na plataforma superior da Torre Eiffel por homens armados que minaram a maquinaria dos elevadores. As forças especiais francesas se posicionam no Champ de Mars diante das câmeras do mundo. Os ministérios do exterior contam seus nacionais nas listas de visitantes."
 france_md.982.a: "Oferecer toda a ajuda que a França aceitar"
 france_md.983.t: "Usina Nuclear Francesa Sob Ataque"
 france_md.983.d: "Alertas de emergência foram emitidos por toda a Europa enquanto terroristas atacam uma instalação nuclear francesa. Embora as autoridades insistam que não há risco imediato de radiação, a possibilidade de um desastre da escala de Chernobyl abalou o continente. Os governos preparam planos de contingência, e a população próxima à instalação foi ordenada a se abrigar no local."
 france_md.983.a: "Preparar planos de resposta a emergências"
 france_md.985.t: "Plano Terrorista Frustrado"
 france_md.985.d: "Os serviços de inteligência franceses desarticularam com sucesso um grande plano terrorista. Meses de vigilância, operações infiltradas e cooperação internacional levaram a batidas coordenadas que capturaram os conspiradores antes que atacassem. Os detalhes seguem sigilosos, mas fontes indicam que o ataque planejado poderia ter sido catastrófico. Esse sucesso valida o pesado investimento em capacidades antiterrorismo."
 france_md.985.a: "Elogiar os serviços de inteligência"
 france_md.985.b: "Manter a segurança reforçada"
 FRA_counter_terrorism_category: "Operações Antiterrorismo"
 FRA_french_communism_expansionism_decision_category: "A Guerra Contra o Capitalismo"
 FRA_3rd_empire_decision_category: "Expandir o Terceiro Império"
 FRA_LFI6th_decision_category: "A Aurora de uma Nova República"
 FRA_french_socialist_downfall_decision_category: "A Queda do Socialismo"
 FRA_frexit_decision_category: "Deixando a União Europeia"
 FRA_royalist_expansion_decision_category: "A Reconquista"
 FRA_EU_assistance_decision_category: "Parceria Econômica Europeia"
 FRA_GREEN_EU_assistance_decision_category: "A Transição Ecológica Europeia"
 FRA_activate_vigipirate: "Ativar o Vigipirate"
 FRA_activate_vigipirate_desc: "Ativar o sistema nacional de alerta de segurança da França, destacando soldados armados para patrulhar espaços públicos e aumentando a segurança em locais sensíveis. Isso protege contra atentados terroristas, mas acarreta custos contínuos."
 FRA_declare_state_of_emergency: "Declarar Estado de Emergência"
 FRA_declare_state_of_emergency_desc: "Em resposta à ameaça terrorista crítica, declarar estado de emergência nacional. Isso concede poderes ampliados às forças de segurança, mas suspende certas liberdades civis."
 FRA_end_state_of_emergency: "Encerrar o Estado de Emergência"
 FRA_end_state_of_emergency_desc: "Com a ameaça imediata reduzida, encerrar o estado de emergência e restaurar as liberdades civis normais. Isso ajudará a normalizar a vida diária e reduzir as tensões políticas."
 FRA_intelligence_surge: "Reforço da Inteligência"
 FRA_intelligence_surge_desc: "Aumentar significativamente o financiamento e os recursos dos serviços de inteligência para melhorar a capacidade de vigilância e as operações antiterrorismo. Isso permite operações proativas contra redes terroristas."
 FRA_secure_critical_infrastructure: "Proteger a Infraestrutura Crítica"
 FRA_secure_critical_infrastructure_desc: "Investir no reforço da infraestrutura crítica - usinas, centros de transporte, telecomunicações - contra atentados terroristas. É caro, mas reduz a vulnerabilidade a grandes ataques."
 FRA_operation_sentinelle: "Operação Sentinelle"
 FRA_operation_sentinelle_desc: "Destacar milhares de soldados para funções de segurança interna, patrulhando ruas, protegendo locais sensíveis e apoiando operações policiais. Essa presença militar visível tranquiliza o público, mas sobrecarrega as forças armadas."
 FRA_anti_terror_raid: "Realizar Batida Antiterror"
 FRA_anti_terror_raid_desc: "Com base na inteligência coletada, realizar batidas contra células terroristas suspeitas. O sucesso pode desarticular ataques planejados e reduzir o nível geral de ameaça."
 FRA_terrorism_defeated: "Declarar Vitória Sobre o Terrorismo"
 FRA_terrorism_defeated_desc: "Com a estabilidade restaurada e sem ataques recentes, declarar formalmente que a ameaça terrorista foi neutralizada. Isso dá um impulso de moral e permite que a nação siga em frente."
 FRA_rebuild_after_attack: "Reconstruir a Infraestrutura Danificada"
 FRA_rebuild_after_attack_desc: "Investir no reparo da infraestrutura danificada por atentados terroristas. Restaurar essas instalações é essencial para voltar à vida normal e demonstrar resiliência."
 FRA_tourism_recovery_campaign: "Campanha de Recuperação do Turismo"
 FRA_tourism_recovery_campaign_desc: "Lançar uma grande campanha internacional para promover a França como destino turístico seguro. Restaurar o turismo é vital para a economia e demonstra que os terroristas não podem destruir o modo de vida francês."
 FRA_6threp_mission: "Entusiasmo Popular"
 FRA_6threp_mission_desc: "Nosso compromisso com a reforma do sistema político deixou muita gente feliz. Muitos querem mudança, mas não podemos ser vistos como aqueles que tentam atrasar o processo."
 FRA_rally_support: "Exibir Nosso Progresso"
 FRA_rally_support_desc: "Nossos opositores tentam frear o processo e questionam cada mudança que fazemos. Mas devemos manter a firmeza. Realizamos muito e precisamos mostrar."
 FRA_rally_ennemy: "A Oposição Critica Nossas Reformas"
 FRA_rally_ennemy_desc: "Embora essas mudanças sejam essenciais, nem sempre agradam a todos. Nossa oposição faz tudo ao seu alcance para criticar cada decisão sobre o futuro da nossa República."
 FRA_timebomb_mission: "O Divórcio Inevitável"
 FRA_timebomb_mission_desc: "As duas principais facções do Partido Socialista ameaçam deixar o partido se não resolvermos a situação. Devemos mostrar-lhes que há um futuro com o Partido Socialista antes que seja tarde demais."
 FRA_support_decrease_mission: "Nosso Partido Está se Dividindo"
 FRA_support_decrease_mission_desc: "Quanto mais demoramos a tranquilizar os membros do partido, mais deles nos deixarão para se juntar a grupos mais próximos de suas ideologias. Devemos corrigir a situação rapidamente."
 FRA_campaign_against_extremism: "Campanha Contra o Extremismo"
 FRA_campaign_against_extremism_desc: "Nestes tempos conturbados, devemos lembrar à esquerda e ao centro que nós, socialistas, somos a escolha certa contra o extremismo político em ascensão."
 FRA_campaign_clash_traitors: "Retaliar os Traidores do Partido"
 FRA_campaign_clash_traitors_desc: "Quem nos deixar por um partido mais da moda deve esperar que o exponhamos na mídia. Não passam de oportunistas e agentes do caos."
 FRA_boost_eurosceptism: "Campanha Contra a União Europeia"
 FRA_boost_eurosceptism_desc: "De debates públicos a cartazes de rua, toda a nossa sociedade deve exalar euroceticismo. Devemos fazer o povo francês entender que os burocratas europeus são a causa de todos os nossos problemas."
 FRA_disobey_treaties: "Violar os Tratados Europeus"
 FRA_disobey_treaties_desc: "Não devemos mais nos curvar a essas leis estúpidas. Somos senhores em nossa própria casa e, de qualquer forma, é apenas questão de tempo até deixarmos a União Europeia."
 FRA_denounce_eu_policies: "Denunciar as Políticas Europeias"
 FRA_denounce_eu_policies_desc: "Devemos concentrar nosso protesto nas leis injustas que saem do Parlamento Europeu sem que possamos nos opor. Para que votar numa eleição se o resultado já não depende realmente de nós?"
 FRA_threaten_media: "Ameaçar a Mídia Pró-Europeia"
 FRA_threaten_media_desc: "O sentimento pró-europeu infiltrou nossas instituições, até a mídia. Devemos lembrar a esses escrevinhadores que se atenham a temas mais adequados ao seu nível e parem de ir contra a corrente."
 FRA_red_benelux: "Libertar o Benelux"
 FRA_red_benelux_desc: "Temos de libertar o Benelux do Capitalismo e do liberalismo europeu"
 FRA_benelux_boost: "Integrar as Culturas do Benelux"
 FRA_benelux_boost_desc: "Trabalhadores holandeses, flamengos e valões agora se juntam à revolução como um só, com suas fábricas e sindicatos absorvidos em nosso projeto socialista."
 FRA_done_with_dumping: "O Fim dos Paraísos Fiscais"
 FRA_done_with_dumping_desc: "A própria existência desses países, que dedicam sua existência a atuar como paraísos fiscais, é uma afronta ao próprio conceito de igualdade e solidariedade. Devemos pôr fim a isso."
 FRA_dumping_boost: "Integrar a Cultura Suíça"
 FRA_dumping_boost_desc: "Quebramos os quadros bancários que sustentavam o paraíso fiscal, e a força de trabalho suíça está sendo reintegrada ao nosso projeto econômico."
 FRA_red_iberia: "Nunca Mais um Ditador"
 FRA_red_iberia_desc: "Devemos garantir que nosso flanco sul não volte a cair sob a influência do fascismo."
 FRA_iberia_boost: "Integrar as Culturas Ibéricas"
 FRA_iberia_boost_desc: "Os movimentos trabalhistas espanhol e português finalmente veem a promessa que 1936 não pôde cumprir, juntando-se à nossa revolução como iguais."
 FRA_ciao_bella: "Ciao Bella"
 FRA_ciao_bella_desc: "A Revolução Comunista fracassou na Itália, mas deixou uma impressão duradoura no povo italiano. É hora de corrigir os erros do passado."
 FRA_italy_boost: "Integrar a Cultura Italiana"
 FRA_italy_boost_desc: "O legado do PCI vive. Completamos o biennio rosso que os trabalhadores italianos começaram e nunca terminaram."
 FRA_avenge_long_knife: "A Noite das Longas Foices"
 FRA_avenge_long_knife_desc: "Devemos provocar uma revolução nos estados germânicos para libertá-los do capitalismo e impedir que o nacionalismo triunfe mais uma vez."
 FRA_ger_aus_boost: "Integrar as Culturas Germânicas"
 FRA_ger_aus_boost_desc: "Os quadros industriais da Alemanha Oriental e os sindicatos austríacos trazem sua disciplina e experiência para o nosso projeto revolucionário."
 FRA_ostalgia: "Trazer a Revolução de Volta à Europa Oriental"
 FRA_ostalgia_desc: "Os países da Europa Oriental sofreram muito sob a ocupação soviética. Devemos mostrar-lhes que o comunismo também tem seus pontos bons."
 FRA_ostalgia_boost: "Integrar as Culturas da Europa Oriental"
 FRA_ostalgia_boost_desc: "Canalizamos a Ostalgie que ainda persiste pela Europa Oriental em entusiasmo genuíno por nossa revolução."
 FRA_birthplace_revolution: "Reivindicar o Berço do Comunismo"
 FRA_birthplace_revolution_desc: "Devemos levar a revolução de volta aos russos que esqueceram a glória passada do comunismo."
 FRA_birthplace_boost: "Integrar as Culturas Eslavas"
 FRA_birthplace_boost_desc: "Reivindicamos o berço da revolução, acolhendo os povos russo e eslavos de volta ao movimento que um dia lideraram."
 FRA_no_more_neutrality: "Quebrar a Neutralidade do Norte"
 FRA_no_more_neutrality_desc: "Os países do Norte da Europa evitaram por tempo demais escolher entre socialismo e capitalismo. É hora de fazerem essa escolha."
 FRA_neutrality_boost: "Integrar as Culturas Nórdicas"
 FRA_neutrality_boost_desc: "A social-democracia nórdica é finalmente convertida, com seus trabalhadores e instituições incorporados ao nosso projeto revolucionário mais amplo."
 FRA_cold_war2: "Chega de Guerra Fria"
 FRA_cold_war2_desc: "Vamos vingar a URSS e o colapso do Pacto de Varsóvia destruindo o que resta da OTAN."
 FRA_cold_war_boost: "Integrar as Culturas Inglesas"
 FRA_cold_war_boost_desc: "Trabalhadores do mundo, uni-vos! A própria tradição trabalhista da Anglosfera finalmente encontra seu lugar em nossa revolução."
 FRA_red_Europe: "Completar a Revolução Europeia"
 FRA_red_Europe_desc: "Vamos levar a revolução a toda a Europa, que ainda vive sob a opressão dos capitalistas."
 FRA_red_victory: "Triunfo da Revolução Europeia"
 FRA_red_victory_desc: "Libertamos os estados europeus dos grilhões do capitalismo. Esta é uma grande vitória da revolução."
 FRA_annex_puppet_napo: "Fazer Valer Nossas Reivindicações"
 FRA_annex_puppet_napo_desc: "Uma de nossas dependências tem um território que reivindicamos. É hora de esse território nos ser devolvido."
 FRA_reunionism: "Realizar o Reunionismo"
 FRA_reunionism_desc: "É hora de reunir o povo de cultura francesa. E desta vez, para sempre."
 FRA_Never_another_guerilla: "Assegurar o Sudoeste"
 FRA_Never_another_guerilla_desc: "Estamos indo para o leste, então precisamos garantir que ninguém venha por trás. Desta vez não haverá guerrilha, pois esmagaremos qualquer resistência."
 FRA_Avenge_Sedan: "Vingar Sedan"
 FRA_Avenge_Sedan_desc: "Foi a ascensão do Império Alemão que pôs fim ao antigo Império Francês. Devemos vingar esse ultraje e recuperar nossas fronteiras naturais."
 FRA_natural_border: "Integrar as Fronteiras Naturais"
 FRA_natural_border_desc: "O povo dos territórios conquistados acabou aceitando a nova realidade. O Reno forma a fronteira da França."
 FRA_crush_coalition: "Assegurar a Europa Central"
 FRA_crush_coalition_desc: "Esses territórios serão cruciais para a longa marcha rumo a Moscou que está sendo preparada."
 FRA_napoleon_empire: "Integrar o Império Napoleônico"
 FRA_napoleon_empire_desc: "O povo dos territórios conquistados acabou aceitando a nova realidade. Agora são cidadãos plenos do Terceiro Império Francês."
 FRA_prepare_russia: "Unificar a Europa Oriental"
 FRA_prepare_russia_desc: "Nossa invasão da Rússia é iminente; devemos garantir a segurança de nossos aliados e prepará-los para um conflito de alta intensidade com a Rússia."
 FRA_2nd_empire_colonies: "Recuperar o Império Colonial"
 FRA_2nd_empire_colonies_desc: "Completaremos o que Napoleão III e a Terceira República começaram. Construiremos um império colonial estável."
 FRA_no_more_berezina: "Operação Tislit"
 FRA_no_more_berezina_desc: "Chegou a hora de destruir o Império Russo de uma vez por todas. Desta vez, não terão tempo de queimar Moscou."
 FRA_the_Foe: "Acabar com a Pérfida Albion"
 FRA_the_Foe_desc: "Vamos romper este bloqueio continental de uma vez por todas. O inimigo número um da Revolução cairá."
 FRA_new_order: "Proclamar a Nova Ordem Europeia"
 FRA_new_order_desc: "Nosso domínio sobre o continente está assegurado. Unimos a Europa sob nosso Império. Um novo capítulo da história europeia começa."
 FRA_Expansion_policy: "Escolher Nossa Política de Expansão"
 FRA_Expansion_policy_desc: "O novo Reino Franco deve estabelecer para si um objetivo de conquista."
 FRA_operation_clovis: "Operação Clóvis"
 FRA_operation_clovis_desc: "Reivindicaremos o berço da civilização franca dos chamados estados do Benelux."
 FRA_operation_bouvines: "Operação Bouvines"
 FRA_operation_bouvines_desc: "Para que o Império Franco surja, o Sacro Império Romano deve cair mais uma vez."
 FRA_operation_marignan: "Operação Marignan"
 FRA_operation_marignan_desc: "Devemos reconquistar a península italiana. Para retomar o controle da sede da Igreja Católica. Somente o Papa em Roma poderá nos coroar Imperador."
 FRA_operation_roland: "Operação Roland"
 FRA_operation_roland_desc: "A retaguarda não cairá de novo."
 FRA_unite_frank_europe: "Unificar o Povo Franco"
 FRA_unite_frank_europe_desc: "Reintegramos todos os povos que, como nós, descendem dos francos. É um grande dia para a nação franca."
 FRA_frankish_empire: "Integrar o Império Franco"
 FRA_frankish_empire_desc: "O Império Franco foi reunificado. A injustiça do Tratado de Verdun foi reparada."
 FRA_annex_puppet_king: "Fazer Valer Nossas Reivindicações"
 FRA_annex_puppet_king_desc: "Uma de nossas dependências tem um território que reivindicamos. É hora de esse território nos ser devolvido."
 FRA_glacis: "Romper o Glacis"
 FRA_glacis_desc: "Os países do Leste estão entre nós e nosso destino. Devemos unir o Ocidente sob nossa bandeira."
 FRA_a_war_for_europe: "A Guerra pela Europa"
 FRA_a_war_for_europe_desc: "As potências da Europa Ocidental e a Rússia sempre disputaram o controle da Europa. É hora de pôr fim a essa disputa e unificar o Ocidente."
 FRA_operation_hastings: "Operação Hastings"
 FRA_operation_hastings_desc: "É hora de pôr fim a uma rivalidade que moldou a história. Prometo que esta não durará cem anos."
 FRA_king_europe_victory: "Proclamar Vitória na Europa"
 FRA_king_europe_victory_desc: "Nossos inimigos não existem mais. Somos a única potência europeia ainda de pé. O Ocidente terá de se reunir atrás de nós."
 FRA_recover_7_year_war_charlemagne: "Recuperar as Colônias do Reino"
 FRA_recover_7_year_war_charlemagne_desc: "A Europa está segura. Agora podemos retomar o controle das colônias que nos foram tomadas."
 FRA_start_crusade: "Assegurar o Mediterrâneo"
 FRA_start_crusade_desc: "Para que a cruzada parta rumo à Terra Santa, precisamos obter o controle das ilhas ao longo da rota. Nossa cadeia de suprimentos deve ser protegida."
 FRA_crusade_siege: "Uma Cabeça de Ponte na Terra Santa"
 FRA_crusade_siege_desc: "Reconquistar a Terra Santa com um ataque frontal contra seus ocupantes exigirá o emprego de todas as nossas forças. Devemos garantir que possamos mobilizá-las nas proximidades."
 FRA_claim_jerusalem: "Reconquistar a Terra Santa"
 FRA_claim_jerusalem_desc: "Chegou a hora de retomar Jerusalém e a Terra Santa. A Décima Cruzada atingiu seu objetivo."
 FRA_revenge_over_saladin: "Garantir a Estabilidade no Oriente Médio"
 FRA_revenge_over_saladin_desc: "Devemos estabilizar a região esmagando cada uma de suas potências regionais, cujos conflitos a desestabilizam."
 FRA_king_crusade1_victory: "Proclamar o Triunfo da Décima Cruzada"
 FRA_king_crusade1_victory_desc: "Reconquistamos a Terra Santa."
 FRA_kingdom_heaven: "Proclamar o Reino de Jerusalém"
 FRA_kingdom_heaven_desc: "O Reino de Jerusalém se erguerá novamente"
 FRA_rally_frank: "Proteger os Francos"
 FRA_rally_frank_desc: "A Europa será em breve palco de uma nova guerra. Nessas circunstâncias, devemos garantir que nossos irmãos francos não sejam vítimas dela."
 FRA_unite_frank: "Reintegrar os Francos"
 FRA_unite_frank_desc: "Reintegramos todos os povos que, como nós, descendem dos francos. É um grande dia para a nação franca."
 FRA_noah_ark: "Reunir as Nações Católicas"
 FRA_noah_ark_desc: "Uniremos as Nações Católicas da Europa sob nossa bandeira."
 FRA_war_against_protestantism: "A Guerra Contra o Protestantismo"
 FRA_war_against_protestantism_desc: "As primeiras oito cruzadas contra os hereges fracassaram. Não fracassaremos uma nona vez."
 FRA_end_the_schism: "Só Pode Haver Um"
 FRA_end_the_schism_desc: "Devemos enfrentar todas as nações ortodoxas da Europa tornando-nos os guardiões da Europa. A Igreja estará segura para sempre."
 FRA_king_crusade2_victory: "Proclamar a Vitória Total da Igreja"
 FRA_king_crusade2_victory_desc: "Reinamos supremos sobre a Europa"
 FRA_recover_7_year_war_holy: "Recuperar as Colônias do Reino"
 FRA_recover_7_year_war_holy_desc: "Nossos inimigos não existem mais. Somos a única potência europeia ainda de pé. O Ocidente terá de se reunir atrás de nós."
 FRA_inst_civ_GER: "Investir na Economia Alemã"
 FRA_inst_civ_GER_desc: "Investimos diretamente em empresas de engenharia alemãs, fortalecendo a espinha dorsal industrial de nossa união compartilhada."
 FRA_inst_civ_GRE: "Investir na Economia Grega"
 FRA_inst_civ_GRE_desc: "A navegação grega continua sendo o sangue da economia do país, e nosso investimento fortalece essa indústria marítima vital."
 FRA_inst_civ_ITA: "Investir na Economia Italiana"
 FRA_inst_civ_ITA_desc: "Apoiamos o setor de máquinas-ferramenta da Itália, reforçando a base de engenharia de precisão no coração de sua indústria."
 FRA_inst_civ_BEL: "Investir na Economia Belga"
 FRA_inst_civ_BEL_desc: "A indústria química da Bélgica ancora sua economia, e nosso capital ampliará sua capacidade de produção e exportação."
 FRA_inst_civ_SPR: "Investir na Economia Espanhola"
 FRA_inst_civ_SPR_desc: "Investimos no setor automotivo da Espanha, apoiando as linhas de montagem que empregam centenas de milhares de trabalhadores."
 FRA_inst_civ_POL: "Investir na Economia Polonesa"
 FRA_inst_civ_POL_desc: "Os estaleiros poloneses já lideraram a construção naval europeia, e nosso investimento ajudará a restaurar sua capacidade industrial."
 FRA_inst_inf_GER: "Investir na Rede de Transportes da Alemanha"
 FRA_inst_inf_GER_desc: "Financiamos melhorias no corredor Reno-Ródano, facilitando o fluxo de mercadorias entre nossas duas economias."
 FRA_inst_inf_GRE: "Investir na Rede de Transportes da Grécia"
 FRA_inst_inf_GRE_desc: "O investimento no corredor Atenas-Salônica modernizará a principal artéria de transporte norte-sul da Grécia."
 FRA_inst_inf_ITA: "Investir na Rede de Transportes da Itália"
 FRA_inst_inf_ITA_desc: "Apoiamos a modernização do corredor do Brenner, reforçando a ligação ferroviária vital entre a Itália e o Norte da Europa."
 FRA_inst_inf_BEL: "Investir na Rede de Transportes da Bélgica"
 FRA_inst_inf_BEL_desc: "Investimos no corredor ferroviário Mar do Norte-Mediterrâneo, fortalecendo a artéria de carga que passa pelos portos da Bélgica."
 FRA_inst_inf_SPR: "Investir na Rede de Transportes da Espanha"
 FRA_inst_inf_SPR_desc: "Nosso investimento nas travessias ferroviárias dos Pireneus finalmente ligará direito as redes ibérica e francesa."
 FRA_inst_inf_POL: "Investir na Rede de Transportes da Polônia"
 FRA_inst_inf_POL_desc: "Financiamos o corredor Via Baltica, conectando enfim a Polônia à rede de transportes europeia mais ampla."
 FRA_inst_eco_GER: "Investir na transição ecológica alemã"
 FRA_inst_eco_GER_desc: "Apoiamos a transição da Alemanha para longe da energia nuclear, financiando a capacidade renovável necessária para preencher a lacuna."
 FRA_inst_eco_GRE: "Investir na transição ecológica grega"
 FRA_inst_eco_GRE_desc: "A Grécia ainda depende muito da lignita, e nosso investimento acelerará sua mudança para fontes de energia mais limpas."
 FRA_inst_eco_ITA: "Investir na transição ecológica italiana"
 FRA_inst_eco_ITA_desc: "A Itália continua perigosamente dependente de gás importado, e nosso investimento apoia sua diversificação rumo à energia renovável."
 FRA_inst_eco_BEL: "Investir na transição ecológica belga"
 FRA_inst_eco_BEL_desc: "Ajudamos a Bélgica a gerir seu próprio abandono do nuclear, financiando a capacidade da rede necessária para manter as luzes acesas."
 FRA_inst_eco_SPR: "Investir na Transição Ecológica Espanhola"
 FRA_inst_eco_SPR_desc: "A Espanha tem enorme potencial solar, e nosso investimento ajudará a expandir sua capacidade de geração renovável."
 FRA_inst_eco_POL: "Investir na transição ecológica polonesa"
 FRA_inst_eco_POL_desc: "A Polônia continua dependente do carvão para a maior parte de sua energia, e nosso investimento apoia sua transição para energia mais limpa."
