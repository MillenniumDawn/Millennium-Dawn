l_korean:
 MD_wacky.1.t: "크리스마스 이브의 미등록 접촉"
 MD_wacky.1.d: "방공 부대가 자정 직후 국경을 넘어오는 저고도 저속 접촉체를 추적하여 경고 없이 교전했습니다. 회수팀은 썰매 한 대, 순록 아홉 마리, 그리고 포장된 선물이 가득 든 매우 큰 자루를 확인했다고 보고합니다."
 MD_wacky.1.a: "잔해를 기밀로 분류하라."
 MD_wacky.1.b: "아이들에게 사과하라."
 MD_wacky.2.t: "수도 상공의 미확인 물체"
 MD_wacky.2.d: "수천 명의 시민이 정부 청사 구역 상공에 11분 동안 정지해 있던 소리 없는 삼각형 불빛을 촬영했습니다. 공군은 레이더에 아무것도 포착되지 않았다고 주장합니다."
 MD_wacky.2.a: "요격기를 긴급 발진시켜라."
 MD_wacky.2.b: "기상 관측 기구였다고 발표하라."
 MD_wacky.3.t: "부처 주차장에 떨어진 우주 쓰레기"
 MD_wacky.3.d: "작동이 중단된 통신 위성의 티타늄 연료 탱크가 밤사이 추락하여 공용 차량 세 대와 산울타리를 짓뭉갰습니다. 다친 사람은 없으며, 어느 우주 기관도 누구의 위성인지 인정하지 않고 있습니다."
 MD_wacky.3.a: "발사국에 청구서를 보내라."
 MD_wacky.3.b: "박물관에 전시하라."
 MD_wacky.4.t: "부처 네트워크를 마비시킨 자판기"
 MD_wacky.4.d: "내무부는 외국의 사이버 공격을 추적하느라 일주일을 보냈으나, 기술자들이 그 트래픽의 출처를 건물 자체의 스마트 자판기로 밝혀냈습니다. 자판기들이 탄산음료를 무한 반복으로 조용히 재주문하고 있었던 것입니다."
 MD_wacky.4.a: "건물 내 모든 기계의 플러그를 뽑아라."
 MD_wacky.4.b: "언론이 외국 세력의 소행이라고 믿게 놔두라."
 MD_wacky_events: "기이한 사건"
 MD_wacky_classified_intercept: "기밀 요격"
 MD_wacky_classified_intercept_desc: "이 교전은 어떠한 공개 기록에도 나타나지 않으며, 관련 승무원들은 표적의 형상에 대해 결코 입 밖에 내지 말라는 지시를 받았습니다. 그러나 건 카메라 영상은 훌륭한 훈련 자료입니다."
 MD_wacky_ufo_conspiracy: "기상 관측 기구 해명"
 MD_wacky_ufo_conspiracy_desc: "아무도 공식 발표를 믿지 않습니다. 이제 두 개의 경쟁하는 시민 위원회가 서로 상반된 사진 분석 결과를 발표하고 있으며, 한 방송사는 정부의 침묵에 대한 다큐멘터리를 제작하도록 의뢰했습니다."
 MD_wacky_debris_exhibit: "재진입 잔해 전시"
 MD_wacky_debris_exhibit_desc: "연료 탱크는 그것이 떨어진 세 대의 차량 사진 옆에 놓여 국립 박물관에 전시되어 있습니다. 관람객이 늘었고, 견학 온 학생들 중 공학을 공부하겠다고 말하는 아이들이 이례적으로 많아졌습니다."
 MD_wacky_phantom_cyber_threat: "유령 사이버 위협"
 MD_wacky_phantom_cyber_threat_desc: "내무부는 외국의 침입에 관한 이야기를 끝내 바로잡지 않았고, 긴급 네트워크 보안 예산은 단 한 건의 질문도 없이 승인되었습니다. 자판기들은 건물에서 철거되었습니다."