l_english:
 econ_forum_category: "Economic Forums"
 econ_forum_category_desc: "Economic forums compete every year for governments, companies and headline speakers. Each summit's score pulls its forum's prestige toward it, and prestige draws the next year's guests. A forum above 60 prestige invites every regional power automatically.\n\n§YWorld Economic Forum§!: prestige [?global.econ_forum_prestige^0|0]. Its last summit drew [?global.econ_forum_last_heads^0|0] heads of government and [?global.econ_forum_last_ministers^0|0] ministerial delegations.\n[econ_forum_visegrad_standing]\n\n[econ_forum_preparation_status]"
 econ_forum_standing_1: "§YVisegrád Economic Conference§!: prestige [?global.econ_forum_prestige^1|0]. Its last summit drew [?global.econ_forum_last_heads^1|0] heads of government and [?global.econ_forum_last_ministers^1|0] ministerial delegations."
 econ_forum_standing_1_unfounded: "§YVisegrád Economic Conference§!: not yet founded."
 econ_forum_preparation_0: "Our summit is in preparation: §Y[?global.econ_forum_invites_left^0|0]§! personal invitations left, §Y[?global.econ_forum_sponsors^0|0]§! corporate points and §Y[?global.econ_forum_speakers^0|0]§! headline speakers booked."
 econ_forum_preparation_1: "Our summit is in preparation: §Y[?global.econ_forum_invites_left^1|0]§! personal invitations left, §Y[?global.econ_forum_sponsors^1|0]§! corporate points and §Y[?global.econ_forum_speakers^1|0]§! headline speakers booked."
 econ_forum_preparation_idle: "Preparations open two months before each summit."
 econ_forum_name_0: "World Economic Forum"
 econ_forum_name_1: "Visegrád Economic Conference"
 econ_forum_found_visegrad: "Found the Visegrád Economic Conference"
 econ_forum_found_visegrad_desc: "The Visegrád Group has a shared market of over 60 million people and no summit of its own. A yearly conference would bring governments and investors to Central Europe instead of sending our ministers to Davos."
 econ_forum_found_visegrad_tt: "We become host of the §YVisegrád Economic Conference§!, which starts with §Y15§! prestige and meets every September. Poland, Czechia, Hungary and Slovakia are always invited."
 econ_forum_invite_government: "Invite [FROM.GetName]"
 econ_forum_invite_government_desc: "A personal invitation from our organizers carries more weight than a standing one."
 econ_forum_invite_government_tt: "[FROM.GetName] receives a personal invitation to our summit, which adds §G15§! to their chance of attending. Personal invitations close a month before the summit."
 econ_forum_secure_sponsors: "Secure Corporate Sponsors"
 econ_forum_secure_sponsors_desc: "State co-financing, pavilions and investment incentives bring companies to the summit floor."
 econ_forum_secure_sponsors_tt: "Adds §G5§! corporate points to our next summit's score."
 econ_forum_sponsors_full_tt: "Fewer than §Y25§! corporate points bought for this summit"
 econ_forum_book_speaker: "Book a Headline Speaker"
 econ_forum_book_speaker_desc: "A famous chief executive, central banker or investor fills the hall and the headlines."
 econ_forum_book_speaker_tt: "We court a headline speaker. The closer our prestige is to our strongest rival forum's, the likelier they accept. Each speaker adds §G5§! to the summit score."
 econ_forum_speakers_full_tt: "Fewer than §Y3§! headline speakers booked for this summit"
 econ_forum_send_head_tt: "Our head of government attends, earning the largest investor bonus from this summit."
 econ_forum_send_ministers_tt: "Our ministers attend, earning half the investor bonus."
 econ_forum_host_modifier: "Forum Host"
 econ_forum_delegation_modifier: "Forum Delegation"
 econ_forum_attended_summit: "Attended their economic forum"
 econ_forum.1.t: "Preparing the [econ_forum_name_hosted]"
 econ_forum.1.d: "Our summit convenes in two months. Organizers are drafting the guest list, courting corporate sponsors and chasing headline speakers. Every government, company and keynote we secure raises the summit's score against rival forums."
 econ_forum.1.a: "Start the preparations"
 econ_forum.2.t: "Invitation to the [econ_forum_name_invited]"
 econ_forum.2.d: "[?ROOT.econ_forum_invited_by.GetName] has invited us to the [econ_forum_name_invited]. Sending our head of government draws the most investor attention, but every other summit wants the same time."
 econ_forum.2.a: "Send the head of government"
 econ_forum.2.b: "Send a ministerial delegation"
 econ_forum.2.c: "Decline the invitation"
 econ_forum.3.t: "The [econ_forum_name_hosted] Closes"
 econ_forum.3.d_gain: "This year's summit drew §Y[?econ_forum_report_heads|0]§! heads of government and §Y[?econ_forum_report_ministers|0]§! ministerial delegations and scored §Y[?econ_forum_report_score|0]§!. The forum's prestige rose to §G[?econ_forum_report_prestige|0]§!."
 econ_forum.3.d_loss: "This year's summit drew §Y[?econ_forum_report_heads|0]§! heads of government and §Y[?econ_forum_report_ministers|0]§! ministerial delegations and scored §Y[?econ_forum_report_score|0]§!. The forum's prestige fell to §R[?econ_forum_report_prestige|0]§!."
 econ_forum.3.a: "Start planning next year's summit"
 econ_forum_news.1.t: "[?global.econ_forum_news_host.GetName] Launches the [econ_forum_name_news]"
 econ_forum_news.1.d: "[?global.econ_forum_news_host.GetName] has founded the [econ_forum_name_news], a yearly summit for governments, investors and industry. Its organizers say it will compete with Davos for the world's leaders and their investment."
 econ_forum_news.1.a: "Another summit for the calendar"
 econ_forum_news.2.t: "The [econ_forum_name_news] Overtakes Davos"
 econ_forum_news.2.d: "For the first time, the [econ_forum_name_news] hosted by [?global.econ_forum_news_host.GetName] ranks above the World Economic Forum in prestige. Governments and investors now plan their year around it."
 econ_forum_news.2.a: "The calendar has a new center"
