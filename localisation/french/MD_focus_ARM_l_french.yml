 artsakh_focus: "Arbre de focus Artsakh"
 arm_expansion.1.t: "[ARM.GetNameWithFlag] Invites Us Into an Alliance"
 arm_expansion.1.d: "[ARM.GetNameWithFlag] offers us an alliance so that together we can contain [TUR.GetNameWithFlag] expansionism"
 arm_expansion.1.a: "[TUR.GetNameWithFlag] will not stand up to our might"
 arm_expansion.1.b: "Désolé, mais nous aimons les kebabs."
 arm_expansion.2.t: "[ARM.GetNameWithFlag] Invites Us Into an Alliance"
 arm_expansion.2.d: "[ARM.GetNameWithFlag] offers us an alliance so that together we can contain [TUR.GetNameWithFlag] expansionism"
 arm_expansion.2.a: "[TUR.GetNameWithFlag] will not stand up to our might"
 arm_expansion.2.b: "Désolé, mais nous aimons les kebabs."
 arm_expansion.3.t: "[ARM.GetNameWithFlag] Invites Us Into an Alliance"
 arm_expansion.3.d: "[ARM.GetNameWithFlag] offers us an alliance so that together we can contain [TUR.GetNameWithFlag] expansionism"
 arm_expansion.3.a: "[TUR.GetNameWithFlag] will not stand up to our might"
 arm_expansion.3.b: "Désolé, mais nous aimons les kebabs."
 arm_expansion.4.t: "[ARM.GetNameWithFlag] Demands Historical Justice"
 arm_expansion.4.d: "S’il n’y a pas de réponse positive de notre part, ils lanceront l’opération 'Croissant brisé'."
 arm_expansion.4.a: "Nous n’avons pas d’autre choix..."
 arm_expansion.4.b: "C’est notre chance de restaurer la grandeur de l’Empire ottoman !"
 arm_expansion.5.t: "L’Arménie renonce à l’Artsakh"
 arm_expansion.5.d: "Nous reconnaissons officiellement l’abandon complet de nos revendications sur le Haut-Karabagh."
 arm_expansion.5.a: "Tout pour nos partenaires étrangers."
 arm_expansion.6.t: "[ARM.GetNameWithFlag] Wants to Establish Friendly Ties With Us"
 arm_expansion.6.d: "Ils estiment qu’il est temps d’oublier les vieilles rancunes et conflits et de commencer à avancer ensemble vers un avenir meilleur."
 arm_expansion.6.a: "Nous avons tous fait des erreurs."
 arm_expansion.6.b: "Oubliez l’idée d’être amis avec nous."
 arm_expansion.7.t: "[ARM.GetNameWithFlag] is Asking Us for Investments"
 arm_expansion.7.d: "[ARM.GetNameWithFlag] asks us to invest in their infrastructure and in return they become our trading hub"
 arm_expansion.7.a: "Nous sommes toujours ravis d’aider."
 arm_expansion.7.b: "Ils ne sont plus capables de nous être utiles."
 arm_expansion.8.t: "[FROM.GetNameWithFlag] accepte d’investir dans notre pays"
 arm_expansion.8.d: "Heureusement, nous avons réussi à convaincre [FROM.GetNameWithFlag] d’investir en nous."
 arm_expansion.8.a: "Bien."
 arm_expansion.9.t: "[FROM.GetNameWithFlag] refuse d’investir dans notre pays"
 arm_expansion.9.d: "Il semble que [FROM.GetNameWithFlag] ne soit plus intéressé à coopérer avec nous."
 arm_expansion.9.a: "Mauvais."
 arm_expansion.10.t: "[ARM.GetNameWithFlag] Offers Us a Zangezur Corridor to Nakhichevan"
 arm_expansion.10.d: "As part of the new arrangements, [ARM.GetNameWithFlag] is offering us a corridor to Nakhichevan. This should rule out further conflict between our countries"
 arm_expansion.10.a: "Notre rêve l’a emporté !"
 arm_expansion.10.b: "Non, nous aimons l’Arménie."
 arm_expansion.11.t: "[AZE.GetNameWithFlag] Agrees to Demilitarise Syunik"
 arm_expansion.11.d: "Now, when we have demilitarised Syunik and handed over control of the corridor to Nakhichevan to [AZE.GetNameWithFlag], war will never come to our country again"
 arm_expansion.11.a: "Tout pour l’amitié avec nos partenaires !"
 arm_expansion.12.t: "[AZE.GetNameWithFlag] Refuses Our Proposal"
 arm_expansion.12.d: "Immediately following [AZE.GetNameWithFlag]'s rejection of our offer, a series of large protests took place in Baku"
 arm_expansion.12.a: "Peut-être est-ce pour le mieux."
 arm_expansion.13.t: "[TUR.GetNameWithFlag] Agrees"
 arm_expansion.13.d: "[FROM.GetNameWithFlag] accepte de renouveler les relations diplomatiques avec nous."
 arm_expansion.13.a: "Ensemble, nous sommes une force."
 arm_expansion.14.t: "[TUR.GetNameWithFlag] Refuses to Resume Diplomatic Ties With Us"
 arm_expansion.14.d: "[TUR.GetNameWithFlag] has accepted our refusal of demands to recognise [TUR.GetNameWithFlag]'s war crimes in WW1, but will not resume diplomatic ties with us"
 arm_expansion.14.a: "Bof."
 ARM_turkey_compliance_idea: "Gouvernement arménien occidental"
 ARM_shadow_of_sevres: "Ombre du traité de Sèvres"
 ARM_shadow_of_sevres_desc: "Le traité de Sèvres est l'un des traités du système de Versailles-Washington, dont l'établissement a marqué la fin de la Première Guerre mondiale. Il fut signé le 10 août 1920 à Sèvres (France) par les pays de l'Entente et les États qui les avaient rejoints, d'une part, et le gouvernement de l'Empire ottoman, d'autre part. Le traité n'entra pas en vigueur, la Grande Assemblée nationale turque ayant refusé de le ratifier. Il fut remplacé trois ans plus tard par le traité de Lausanne, qui fixa les frontières de la Turquie telles qu'on les connaît aujourd'hui."
 ARM_active_diplomacy: "Diplomatie active"
 ARM_active_diplomacy_desc: "Nous devons jouer un rôle de premier plan dans la politique régionale, et notre tâche fondamentale pour atteindre cet objectif sera de vaincre le principal fléau du Caucase - la Turquie."
 ARM_west_arm_gov: "Contacter le gouvernement arménien occidental"
 ARM_west_arm_gov_desc: "The Republic of Western Armenia, also known as the State of Armenia, is a government-in-exile claiming sovereignty over parts of the Armenian highlands including sections of Western Armenia as well as Nakhichevan, and sometimes also Nagorno-Karabakh. The self-declared country says it has its own presidency, government, parliament, constitution, national anthem, and coat of arms"
 ARM_agree_with_greece: "Restaurer la Grande Idée"
 ARM_agree_with_greece_desc: "At the moment, [TUR.GetNameWithFlag] holds vast territories that rightfully belong to [GRE.GetNameWithFlag]. We will invite Greece to join our coalition to regain what has been lost"
 ARM_negotiate_syria: "Negotiations with [SYR.GetNameWithFlag]"
 ARM_negotiate_syria_desc: "Some of [SYR.GetNameWithFlag]'s ancestral lands are also under Turkish control. However, [SYR.GetNameWithFlag] is in a vulnerable strategic position in the event of a possible invasion from the north"
 ARM_negotiate_kurds: "Negotiations with [KUR.GetNameWithFlag]"
 ARM_negotiate_kurds_desc: "Depuis de nombreuses décennies, les Kurdes tentent d'établir leur propre État indépendant qui unira tout le peuple kurde. Aidons-les dans cette entreprise."
 ARM_return_to_western_armenia: "Retour à l'Arménie occidentale"
 ARM_return_to_western_armenia_desc: "It is time to regain what was lost and liberate the Caucasus and Asia Minor from Turkish colonialism"
 ARM_land_of_peace: "Terre de paix"
 ARM_land_of_peace_desc: "L'expérience passée a montré que nous sommes incapables de récupérer nos territoires. Il est maintenant temps de repenser notre politique étrangère et d'essayer d'établir des relations avec nos voisins musulmans."
 ARM_ussr_success_const: "Héritage de la RSS d’Arménie"
 ARM_ussr_success_const_desc: "In order to establish friendly ties with our neighbours, we recognise ourselves as the successor of the Armenian SSR, thus confirming the territorial integrity of all other SSRs, including [AZE.GetNameWithFlag]"
 ARM_normalize_relations_with_turkey: "Normaliser les relations avec la Turquie"
 ARM_normalize_relations_with_turkey_desc: "La principale raison du conflit de longue date entre la Turquie et l'Arménie était les crimes de guerre de la Turquie en Arménie occidentale. Cependant, cela ne nous intéresse plus, étant donné que plus d'un demi-siècle s'est écoulé depuis cette époque."
 ARM_crossroad_of_peace: "Carrefour de la paix"
 ARM_crossroad_of_peace_desc: "En tant que pays neutre qui entretient de bonnes relations avec nos voisins, nous leur proposerons d'investir dans notre économie."
 ARM_zang_corr_question: "Question du corridor de Zangezur"
 ARM_zang_corr_question_desc: "Conformément à notre nouvelle politique pacifique, nous ne sommes plus intéressés par le développement militaire de Syunik. Bien que ce soit une artère clé bloquant l’accès de l’Azerbaïdjan à son exclave de Nakhitchevan, tout en nous fournissant une voie terrestre pour les approvisionnements militaires iraniens, nous n’avons plus l’intention d’utiliser cette région pour faire pression sur l’Azerbaïdjan."
 ARM_anatolian_heritage: "Héritage anatolien"
 ARM_anatolian_heritage_desc: "Il est nécessaire de lancer un échange culturel, économique, politique et scientifique entre nos pays pour stabiliser davantage nos relations."
 ARM_kazah_cooperation_idea: "[KAZ.GetNameWithFlag] - [ARM.GetNameWithFlag] Cooperation"
 ARM_shirvan_deal: "Offer [PER.GetNameWithFlag] Territorial Exchange"
 arme.174.t: "[ARM.GetNameWithFlag] Offers Territorial Exchange"
 arme.174.d: "Récemment, l’Arménie nous a proposé d’échanger des territoires, en cédant notre province de Khoy, où vivent principalement des Kurdes iraniens, contre la province de Shirvan, habitée par des persanophones. Devrions-nous accepter ?"
 arme.174.a: "Bien sûr, pourquoi pas !"
 arme.174.b: "Est-ce une sorte de complot ?"
 arme.175.t: "[PER.GetNameWithFlag] Denies Territorial Exchange!"
 arme.175.d: "L’Iran ne veut pas nous céder Khoy en échange de Shirvan."
 arme.175.a: "Ils vont le payer."
 ARM_turkey_negotiations: "Negotiations with [TUR.GetNameWithFlag]"
 ARM_turkey_negotiations_desc: "Depuis notre indépendance, la Turquie a été un obstacle majeur au commerce avec l’Europe. Peut-être pouvons-nous normaliser nos relations avec eux et ouvrir les frontières."
 arme.176.t: "Our Stance on Negotiations with [TUR.GetNameWithFlag]"
 arme.176.d: "Il est temps de définir notre position sur les négociations avec la Turquie. Devrions-nous commencer à normaliser les relations et ouvrir les frontières, ou oublier cette idée ?"
 arme.176.a: "Informez la Turquie que nous sommes prêts à discuter."
 arme.176.b: "Abandonnez cette idée stupide."
 arme.177.t: "[ARM.GetNameWithFlag] Wants to Normalize Relations!"
 arme.177.d: "Récemment, l’Arménie nous a envoyé une proposition diplomatique pour normaliser et réguler les relations. À long terme, un partenariat mutuel et l’ouverture des frontières peuvent bénéficier aux deux parties. Cependant, l’Arménie exige de notre part la reconnaissance du génocide dans l’Empire ottoman. De nombreux activistes nationalistes estiment que cette reconnaissance pourrait entraîner des revendications territoriales ou des réparations économiques. Cependant, l’Arménie elle-même nie ces allégations."
 arme.177.a: "Nous sommes prêts à normaliser, mais nous devons discuter de certains points."
 arme.177.b: "They will need to resolve the Nagorno-Karabakh conflict first."
 arme.177.c: "Comment osent-ils même penser à nous parler !"
 arme.178.t: "[TUR.GetNameWithFlag] Asks Us to Drop Genocide Allegations!"
 arme.178.d: "La Turquie a reçu notre proposition, mais ils veulent que nous abandonnions les allégations et la reconnaissance du génocide. Que devons-nous leur répondre ?"
 arme.178.a: "La demande de justice n’équivaut pas à des réparations ou des revendications territoriales."
 arme.178.b: "Nous pouvons abandonner nos aspirations, bien sûr."
 arme.179.t: "[ARM.GetNameWithFlag] Agrees!"
 arme.179.d: "L’Arménie a accepté d’abandonner ses revendications concernant le génocide et est maintenant pleinement prête à normaliser les relations et à ouvrir les frontières pour le commerce."
 arme.179.a: "Merveilleux !"
 turkish_relat_negotated: "Relations arméno-turques normalisées"
 arme.180.t: "[ARM.GetNameWithFlag] Insists!"
 arme.180.d: "Armenia once again states that they have no intentions to claim any territory of Turkey. On the contrary, museums of peace and history could be built to condemn the bloody history and redeem Turkish state from Ottoman past. Armenia insists that they want to foster trade and political relations, not irredentist agenda."
 arme.180.a: "Reconnaissons les atrocités passées et construisons un nouvel avenir."
 arme.180.b: "Ils veulent nous humilier. C'est inacceptable."
 arme.181.t: "[TUR.GetNameWithFlag] Recognizes Armenian Genocide!"
 arme.181.d: "La Turquie a récemment accepté de reconnaître le génocide de 1915 dans l’Empire ottoman et a normalisé ses relations avec nous."
 arme.181.a: "Que Dieu nous bénisse !"
 arme.182.t: "[TUR.GetNameWithFlag] Refuses to Normalize Relations!"
 arme.182.d: "La Turquie a récemment abandonné tous les efforts diplomatiques pour normaliser les relations avec nous. Aucun lien n’est plus établi désormais."
 arme.182.a: "Ils ne changent jamais."
 arme.183.t: "Opposition à l’ancien gouvernement"
 arme.183.d: "Le changement radical de pouvoir dans notre pays n'est pas passé inaperçu. Les partisans du gouvernement précédent ont organisé une puissante campagne d'opposition contre nous, mettant à l'épreuve la force et la stabilité de notre pouvoir."
 arme.183.a: "Leur temps est fini."
 arme.184.t: "Opposition à l’ancien gouvernement"
 arme.184.d: "Le changement radical de pouvoir dans notre pays n'est pas passé inaperçu. Les partisans du gouvernement précédent ont organisé une puissante campagne d'opposition contre nous, mettant à l'épreuve la force et la stabilité de notre pouvoir."
 arme.184.a: "Leur temps est fini."
 arme.185.t: "Opposition à l’ancien gouvernement"
 arme.185.d: "Le changement radical de pouvoir dans notre pays n'est pas passé inaperçu. Les partisans du gouvernement précédent ont organisé une puissante campagne d'opposition contre nous, mettant à l'épreuve la force et la stabilité de notre pouvoir."
 arme.185.a: "Leur temps est fini."
 arme.186.t: "Opposition à l’ancien gouvernement"
 arme.186.d: "Le changement radical de pouvoir dans notre pays n'est pas passé inaperçu. Les partisans du gouvernement précédent ont organisé une puissante campagne d'opposition contre nous, mettant à l'épreuve la force et la stabilité de notre pouvoir."
 arme.186.a: "Leur temps est fini."
 arme.187.t: "Protestations dans les régions"
 arme.187.d: "Political instability has also shaken our puppets. The states under our control are shaken by anti-Armenian protests, we must deal with this quickly."
 arme.187.a: "Zut !"
 arme.188.t: "L’Arménie demande des armes"
 arme.188.d: "Armenia, as a full-fledged member of NATO, has launched a rearmament program and is now requesting that we provide them with certain weapons for their reformed army."
 arme.188.a: "Nous fournirons des armes."
 arme.188.b: "Non."
 arme.189.t: "Armes de l’OTAN"
 arme.189.d: "[FROM.GetNameWithFlag] has agreed to provide us with weapons to rearm our army."
 arme.189.a: "Sympa."
 arme.190.t: "Armes de l’OTAN"
 arme.190.d: "[FROM.GetNameWithFlag] refused to provide us with weapons to rearm our army."
 arme.190.a: "Triste."
 arme.223.t: "La rébellion en Azerbaïdjan"
 arme.223.d: "Les séparatistes azerbaïdjanais ont profité de la faiblesse de nos services spéciaux et de notre petite armée pour lancer une révolte armée dans le but de libérer leur pays de notre domination."
 arme.223.a: "Oh non"
 arme.224.t: "La rébellion à Kouban"
 arme.224.d: "Our actions in Kuban were not without consequences, the people of Kuban rose up against us, they announced the creation of the Kuban Republic and began to create armed groups to fight us."
 arme.224.a: "Oh non"
 arme.225.t: "La rébellion au Daghestan"
 arme.225.d: "Our actions in Dagestan were not without consequences, the people of Dagestan rose up against us, they announced the creation of the Dagestan Republic and began to create armed groups to fight us."
 arme.225.a: "Oh non"
 arme.226.t: "La rébellion en Géorgie"
 arme.226.d: "Our actions in Georgia were not without consequences; the Georgian people have rebelled against us and want to free themselves from our occupation, now we have to deal with an organized Georgian rebellion."
 arme.226.a: "Oh non"
 arme.227.t: "La rébellion en Abkhazie"
 arme.227.d: "Our actions in Abkhazia were not without consequences; the Abkhazian people have rebelled against us and want to free themselves from our occupation, now we have to deal with an organized Abkhazia rebellion."
 arme.227.a: "Oh non"
 arme.228.t: "La rébellion au Kurdistan"
 arme.228.d: "Our actions in Kurdistan were not without consequences; the Kurdish people have rebelled against us and want to free themselves from our occupation, now we have to deal with an organized Kurdistan rebellion."
 arme.228.a: "Oh non"
 arme.229.t: "La rébellion à Djavakheti"
 arme.229.d: "Les habitants de Djavakheti ont été extrêmement choqués par notre politique envers l’Artsakh et notre abandon de ces terres. Dans ce contexte, un groupe de militaires radicaux a même réussi à organiser une rébellion, déclarant notre gouvernement illégal et anti-arménien."
 arme.229.a: "Oh non"
 arme.230.t: "Autonomie de Talyshstan"
 arme.230.d: "The government of Talyshstan has issued an ultimatum to our government, expressing fierce disobedience to our political ambitions to completely subjugate these lands to the Armenian nation, they demand autonomy from us as part of our state, or they intend to defend their independence with a gun in their hands."
 arme.230.a: "Pas d’autonomie"
 arme.230.b: "Accordons-leur l’autonomie"
 arme.231.t: "Manifestations contre une armée faible"
 arme.231.d: "La révolte armée qui a commencé contre nous a provoqué une vague de manifestations à travers le pays, les gens sont mécontents de la faiblesse de nos forces armées, ils exigent plus de financement pour notre armée."
 arme.231.a: "Et de quoi vont-ils vivre ?"
