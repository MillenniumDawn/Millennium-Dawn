 increase_antarctica_station_reports_tt: "Augmente les rapports de station antarctique de §R[?antarctica_station_reports_temp]§! (actuellement §R[?antarctica_station_reports]§!/§R7§!)"
 antarctica_reports_warning_tt: "§RAvertissement :§!\nSi le nombre de rapports dépasse 7, les Parties consultatives du Traité sur l'Antarctique peuvent prendre des mesures diplomatiques contre votre nation, y compris de lourdes sanctions et la perte du statut ATCP, le cas échéant. Il est recommandé de garder le nombre de rapports sous 7 pour éviter des conséquences négatives.\n\nSi le seuil est franchi alors qu'une recherche nucléaire a été détectée, chaque nation du Traité sur l'Antarctique recevra un événement pour imposer un embargo à votre nation."
