 raj_chi_border_attack_475_from_589: "Атака на Аруначал-Прадеш из Сицзана."
 raj_chi_border_attack_475_from_589_desc: "Продвижение от Сицзанга через линию Макмахона в направлении Аруначал-Прадеша. Успешное продвижение добавляет §Y20 очков прогресса §! в этом штате; отражение стоит §Y10§!."
 raj_chi_border_attack_475_from_473: "Атака на Аруначал-Прадеш из Ассама."
 raj_chi_border_attack_475_from_473_desc: "Наступление из Ассама для оспаривания или восстановления контроля над Аруначал-Прадешем. Успешное наступление добавляет §Y20 очков прогресса §! к этому штату; отражение стоит §Y10§!."
 raj_chi_border_attack_982_from_589: "Атака на Сикким со стороны Ксицзана"
 raj_chi_border_attack_982_from_589_desc: "Продвижение из Сицзанга через сектор Натху Ла в направлении Сиккима. Успешное продвижение добавляет §Y20 очков прогресса §! к этому состоянию; отступление стоит §Y10§!."
 raj_chi_border_attack_982_from_455: "Атака на Сикким со стороны Горкхаланда."
 raj_chi_border_attack_982_from_455_desc: "Наступление из Горкхаланда для оспаривания или восстановления контроля над Сиккимом. Успешное наступление добавляет §Y20 очков прогресса по захвату территории§! к этому показателю; отпор стоит §Y10§!."
 raj_chi_border_attack_591_from_993: "Атака на Аксай-Чин со стороны Ладакха."
 raj_chi_border_attack_591_from_993_desc: "Продвижение из Ладакха на плато Аксай-Чин. Успешное продвижение добавляет §Y20 очков прогресса §! к этому состоянию; отступление стоит §Y10§!."
 raj_chi_border_attack_993_from_591: "Атака на Ладакх из Аксай-Чина."
 raj_chi_border_attack_993_from_591_desc: "Продвижение из Аксай-Чина в сторону Ладакха. Успешное продвижение добавляет §Y20 очков прогресса §! к этому состоянию; отступление стоит §Y10§!."
