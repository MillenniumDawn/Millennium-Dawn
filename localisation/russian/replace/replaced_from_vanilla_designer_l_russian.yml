 DESIGNER_EQUIPMENT_CHANGE: "Этот шаблон используют бригады: $UNITS|Y$.\nПотребность в $EQ|Y$ изменится в сумме на $TOT|R$.\nНа складе: $STOCK|Y$.\nЕсли принять изменения шаблона, на складе, по оценке, останется $END$."