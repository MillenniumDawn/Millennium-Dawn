 cnc_equipment_type: "지휘&통제 장비"
 cnc_equipment_type_desc: "지휘통제 장비는 지휘부가 임무와 과제를 완수하기 위해 배속된 부대에 대한 권한을 행사하고 지휘를 수행할 수 있도록 지원하는 시스템입니다."
 cnc_equipment_1: "C2 장비"
 cnc_equipment_1_desc: "지휘통제 장비는 지휘부가 임무와 과제를 완수하기 위해 배속된 부대에 대한 권한을 행사하고 지휘를 수행할 수 있도록 지원하는 시스템입니다. 효율적인 지휘통제는 조직의 체계성과 사기를 높여줍니다. C2(지휘 및 통제)는 1세대 C2 장비입니다."
 cnc_equipment_2: "C3 장비"
 cnc_equipment_2_desc: "지휘통제 장비는 지휘부가 임무와 과제를 완수하기 위해 배속된 부대에 대한 권한을 행사하고 지휘를 수행할 수 있도록 지원하는 시스템입니다. 효율적인 지휘통제는 조직의 체계성과 사기를 높여줍니다. C3(지휘, 통제 및 통신)는 2세대 C2 장비입니다."
 cnc_equipment_3: "C3ISTAR 장비"
 cnc_equipment_3_desc: "지휘통제 장비는 지휘부가 임무와 과제를 완수하기 위해 배속된 부대에 대한 권한을 행사하고 지휘를 수행할 수 있도록 지원하는 시스템입니다. 효율적인 지휘통제는 조직의 체계성과 사기를 높여줍니다. C3ISTAR(지휘, 통제, 통신, 정보, 감시, 표적 획득 및 정찰)는 3세대 C2 장비입니다."
 cnc_equipment_4: "C4I 장비"
 cnc_equipment_4_desc: "지휘통제 장비는 지휘부가 임무와 과제를 완수하기 위해 배속된 부대에 대한 권한을 행사하고 지휘를 수행할 수 있도록 지원하는 시스템입니다. 효율적인 지휘통제는 조직의 체계성과 사기를 높여줍니다. C4I(지휘, 통제, 통신, 컴퓨터, 정보 및 상호운용성)는 4세대 C2 장비입니다."
 cnc_equipment_5: "C4ISTAR 장비"
 cnc_equipment_5_desc: "지휘통제 장비는 지휘부가 임무와 과제를 완수하기 위해 배속된 부대에 대한 권한을 행사하고 지휘를 수행할 수 있도록 지원하는 시스템입니다. 효율적인 지휘통제는 조직의 체계성과 사기를 높여줍니다. C4ISTAR(지휘, 통제, 통신, 컴퓨터, 정보, 상호운용성, 감시, 표적 획득 및 정찰)는 5세대 C2 장비입니다."
 cnc_equipment_6: "C5I 장비"
 cnc_equipment_6_desc: "Command and Control Equipment is the system empowering leadership to exercise authority and direction over assigned forces for the accomplishment of missions and tasks. Efficient Command and Control leads to greater organization and morale. C5I (Command, Control, Communications, Computers, Collaboration and Intelligence) is the Sixth generation of C2 equipment."
 cnc_equipment_7: "C5ISTAR 장비"
 cnc_equipment_7_desc: "Command and Control Equipment is the system empowering leadership to exercise authority and direction over assigned forces for the accomplishment of missions and tasks. Efficient Command and Control leads to greater organization and morale. C5ISTAR (Command, Control, Communications, Computers, Collaboration, Intelligence, Interoperability, Surveillance, Target Acquisition, and Reconnaissance ) is the Seventh generation of C2 equipment."
