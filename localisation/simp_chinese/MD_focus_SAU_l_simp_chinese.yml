 SAU_research_modifery_01: "§H多元化§! - 研发"
 SAU_research_modifery_01_desc: "对大学和研究机构的专项资助正在加速沙特阿拉伯王国向非石油知识经济转型的步伐。"
 SAU_research_modifery_02: "§H多元化§! - 世界级研发"
 SAU_research_modifery_02_desc: "像阿卜杜拉国王科技大学这样的旗舰机构使沙特阿拉伯成为正在崛起的区域科学创新中心，吸引了来自世界各地的人才。"
 SAU_research_modifier_01: "唤醒心灵"
 SAU_research_modifier_01_desc: "基础扫盲计划正在扩大能够接受正规教育的沙特阿拉伯人数量。"
 SAU_research_modifier_02: "阅读之国"
 SAU_research_modifier_02_desc: "识字率的提高扩大了阅读人群，也增加了对学校和教育材料的需求。"
 SAU_research_modifier_03: "扩大教育"
 SAU_research_modifier_03_desc: "学校扩建和招生规模扩大，使更多沙特人有机会接受小学和中学教育。"
 SAU_research_modifier_04: "学习基础"
 SAU_research_modifier_04_desc: "王国已建立起完善的国家教育体系所需的机构和培训人员。"
 SAU_research_modifier_06: "培养智力"
 SAU_research_modifier_06_desc: "大学和研究机构正在培养更多高素质的沙特专业人才。"
 SAU_royal_ulema_alliance_content: "§H王室-乌里玛联盟§!"
 SAU_royal_ulema_alliance_content_desc: "§L乌里玛§!与§H沙特王室§!合作卓有成效。例行的教令有利于王室；例行的政策尊重宗教人士。双方都没有什么可抱怨的。"
 SAU_royal_ulema_alliance_high: "§H王室-乌里玛联盟§!"
 SAU_royal_ulema_alliance_high_desc: "§L高级学者议会§!坚定拥护王权，宗教机构也维护王室政策的合法性。这种紧密的联盟极大地巩固了王朝的统治。"
 SAU_royal_ulema_alliance_neutral: "§H王室-乌里玛联盟§!"
 SAU_royal_ulema_alliance_neutral_desc: "王室与教士之间保持着一种§Y形式上但有限§!的关系。双方既不积极支持也不阻挠对方，因此权力平衡既不带来任何好处也不带来任何惩罚。"
 SAU_royal_ulema_alliance_neutral_tt: "§Y王位与乌里玛之间的关系是平衡的 - 既没有奖励也没有惩罚。§!\n§Y权力平衡变化=0.00§!"
 SAU_royal_ulema_alliance_strained: "§R王室-乌里玛关系紧张§!"
 SAU_royal_ulema_alliance_strained_desc: "§L乌里玛§!成员私下里批评王室，并在布道中质疑政府改革。这种反对削弱了王朝的宗教合法性。"
 SAU_sabic_01: "沙特基础工业公司"
 SAU_sabic_01_desc: "沙特基础工业公司是一家大型石化产品生产商。沙特基础工业公司在发展壮大的同时，也为产业多元化做出了贡献，并在石油行业以外提供了就业机会。"
 SAU_sabic_agrinutrients: "§H沙特基础工业公司§! - 农业营养与特种化学品"
 SAU_sabic_agrinutrients_desc: "沙特基础工业公司农业营养品部门将沙特天然气转化为尿素和氨，为亚洲和非洲各地的农场提供肥料，使沙特王国成为肥料大国。"
 SAU_sabic_foreign_jv: "§H沙特基础工业公司§! - 外国合资企业"
 SAU_sabic_foreign_jv_desc: "与壳牌、埃克森美孚和三菱的合资企业将世界一流的技术引入了沙特基础工业公司的工厂，同时将利润留在沙特阿拉伯王国。"
 SAU_sabic_ge_plastics: "§H沙特基础工业公司§! - 通用电气塑料公司收购案"
 SAU_sabic_ge_plastics_desc: "2007年，沙特基础工业公司以超过 110 亿美元收购了通用电气塑料公司 ，一夜之间跻身全球工程塑料生产商的前列。"
 SAU_sabic_global_champion: "§H沙特基础工业公司§! - 全球化学龙头"
 SAU_sabic_global_champion_desc: "沙特基础工业公司位列全球最大的化工企业之列，这证明沙特工业的竞争力远不止于石油领域。"
 SAU_sabic_hadeed: "§H沙特基础工业公司§! - 沙特钢铁公司复合体"
 SAU_sabic_hadeed_desc: "位于朱拜勒的沙特基础工业公司钢铁子公司沙特钢铁公司为沙特建筑业提供数百万吨钢筋和扁钢，这些钢材以前都需要进口。"
 SAU_sabic_ibn_affiliates: "§H沙特基础工业公司§! - 伊本附属公司"
 SAU_sabic_ibn_affiliates_desc: "伊本·西那、伊本·扎赫尔和伊本·鲁什德的附属公司将沙特基础工业公司的石化产品生产扩展到塑料、甲醇和纤维领域。"
 SAU_sabic_jubail_yanbu: "§H沙特基础工业公司§! - 朱拜勒和延布工业城"
 SAU_sabic_jubail_yanbu_desc: "皇家委员会下属的朱拜勒和延布两座城市，将空旷的海岸线变成了世界上最大的两个工业综合体，奠定了沙特重工业的基础。"
 SAU_sabic_rnd: "§H沙特基础工业公司§! - 本土技术"
 SAU_sabic_rnd_desc: "沙特基础工业公司位于利雅得、班加罗尔和盖林的研发中心使其催化剂和聚合物始终处于技术前沿。"
 SAU_sagia_initiative: "§H沙特阿拉伯投资总局倡议§!"
 SAU_sagia_initiative_02: "§H沙特阿拉伯投资总局 - 投资改革§!"
 SAU_sagia_initiative_02_desc: "§L沙特投资总局§!放宽了所有权限制，并缩短了许可证审批时间。这些改革措施正在吸引更多外国企业，并使沙特市场更容易进入。"
 SAU_sagia_initiative_03: "§H沙特阿拉伯投资总局 - 外国资本中心§!"
 SAU_sagia_initiative_03_desc: "沙特阿拉伯开放了§H战略性产业§!，推出了§H税收优惠政策§!，并在沿海地区发展了§H经济城§!。这些政策使沙特王国成为重要的区域性外国直接投资目的地。"
 SAU_sagia_initiative_04: "§G沙特阿拉伯投资总局 - 投资强国§!"
 SAU_sagia_initiative_04_desc: "沙特阿拉伯如今已将§H多元化经济§!与§H开放的投资市场§!相结合。已完成的沙特阿拉伯投资总局的改革吸引了大量外国资本和技术工人。"
 SAU_sagia_initiative_desc: "§L沙特阿拉伯投资总局§!于§Y2000年4月§!根据皇家法令成立，是沙特王国首个致力于吸引外国投资的机构。其职责包括简化商业法律、为投资者提供§H单一联系点§!以及改善进入沙特市场的渠道。"
 SAU_salman_health_critical: "§H国王的健康§! - §R紧急§!"
 SAU_salman_health_critical_desc: "国王不再出行，也经常缺席枢密会议。宫廷方面鲜少透露信息，这促使一些高层人士开始为王位继承做准备。"
 SAU_salman_health_declining: "§H国王的健康§! - §Y衰退§!"
 SAU_salman_health_declining_desc: "尽管王室并未宣布国王患有重病，但他正在缩短或取消更多官方接见活动。他减少的行程安排已开始影响政府事务。"
 SAU_salman_health_near_death: "§H国王的健康§! - §R濒死§!"
 SAU_salman_health_near_death_desc: "国王已接近驾崩，实际上已将政权移交给继承人。目前，政治活动主要围绕着王位继承的准备工作展开。"
 SAU_salman_health_serious: "§H国王的健康§! - §Y严重§!"
 SAU_salman_health_serious_desc: "国王很少公开露面，大臣们也越来越多地通过王室而非直接接受国王的指示。"
 SAU_salman_health_stable: "§H国王的健康§! - §G稳定§!"
 SAU_salman_health_stable_desc: "国王保持着繁忙的公务日程，接见使节，主持大臣会议，并审阅政府文件。他的持续参与确保了朝廷和各部委的有序运作。"
 SAU_shura_led_notables: "显贵议会"
 SAU_shura_led_notables_desc: "部落首领和主要商贾家族通过在正式投票前达成的非正式协议，主导着协商会议。这种安排体现了沙特阿拉伯既有的权力结构，但也延缓了决策进程。"
 SAU_shura_led_technocrats: "各部委理事会"
 SAU_shura_led_technocrats_desc: "技术官僚的加入使协商会议在审查预算和政府政策方面更加高效。其成员能力出众，但对利雅得以外社区的代表性不足。"
 SAU_shura_led_ulema: "乌里玛委员会"
 SAU_shura_led_ulema_desc: "宗教学者控制着协商会议，阻止宗教机构反对的提案呈递给国王。"
 SAU_sp_abrams_combined: "装甲：联合兵种"
 SAU_sp_abrams_combined_desc: "坦克、步兵和炮兵组成一支均衡的队伍作战。\n§G+5%§!师攻击\n§G+5%§! 师防御\n§G+5%§!师组织度\n§R+10%§!陆军训练时间"
 SAU_sp_abrams_defensive: "装甲：防御墙"
 SAU_sp_abrams_defensive_desc: "坚固的装甲如同王国的坚不可摧的盾牌。\n§G+10%§! 师防御\n§G+10%§!战壕挖掘速度\n§R-10%§!师移动速度"
 SAU_sp_abrams_shock: "装甲：冲击与突破"
 SAU_sp_abrams_shock_desc: "快速、强力的装甲突袭，旨在粉碎敌军防线。\n§G+10%§!核心领土攻击\n§G+5%§!师移动速度\n§R-5%§!师组织度"
 SAU_sp_apache_antiarmor: "陆军航空兵：坦克杀手"
 SAU_sp_apache_antiarmor_desc: "装备地狱火武器的猎手将摧毁装甲部队的进攻。\n§G+7.5%§!核心领土攻击\n§G+5%§!师攻击\n§R-5%§! 空军经验获取"
 SAU_sp_apache_closeair: "陆军航空兵：近距离支援"
 SAU_sp_apache_closeair_desc: "武装直升机在空中盘旋，稳定并保护地面部队。\n§G+5%§!师组织度\n§G+5%§!师恢复率\n§R+10%§!空军事故"
 SAU_sp_apache_recon: "陆军航空兵：侦察与突袭"
 SAU_sp_apache_recon_desc: "目光向前，闪电突袭防线深处。\n§G+7.5%§!师移动速度\n§G+5%§!计划速度\n§R-5%§!师防御"
 SAU_sp_arty_mass: "炮兵：大规模火力"
 SAU_sp_arty_mass_desc: "倾泻压倒性的炮火，粉碎敌人，补给什么的都见鬼去吧。\n§G+10%§!核心领土攻击\n§R+10%§!补给消耗"
 SAU_sp_arty_mobile: "炮兵：射后即走"
 SAU_sp_arty_mobile_desc: "趁敌人还击之前开火并转移目标。\n§G+5%§!师移动速度\n§G+5%§!师组织度\n§R-5%§!师防御"
 SAU_sp_arty_precision: "炮兵：精确火力"
 SAU_sp_arty_precision_desc: "更少的炮弹，更精准地击中目标。\n§G+7.5%§!师攻击\n§G+5%§!陆军经验获取\n§R+5%§!消耗品使用"
 SAU_sp_awacs_control: "预警机：空中作战控制"
 SAU_sp_awacs_control_desc: "控制者将所有战斗机编织成一张杀戮之网。\n§G+10%§!制空权\n§G+5%§!空军经验获取\n§R+3%§!消费品使用"
 SAU_sp_awacs_earlywarn: "预警机：早期预警网"
 SAU_sp_awacs_earlywarn_desc: "任何袭击都无法瞒过探测。\n§G+10%§!空中防御\n§R-5%§!空军攻击"
 SAU_sp_awacs_groundlink: "预警机：地面连接"
 SAU_sp_awacs_groundlink_desc: "上方的景象指引着下方的军队。\n§G+5%§!师攻击\n§G+5%§!计划速度\n§R-5%§!空军经验获取"
 SAU_sp_combat_armor: "战斗部队：装甲铁拳"
 SAU_sp_combat_armor_desc: "以装甲铁拳为先锋。\n§G+7.5%§! 核心领土攻击\n§G+5%§! 师速度\n§R+5%§! 补给消耗"
 SAU_sp_combat_firepower: "战斗部队：火力"
 SAU_sp_combat_firepower_desc: "以绝对火力优势碾碎敌人。\n§G+7.5%§! 师攻击\n§R-5%§! 师速度"
 SAU_sp_combat_infantry: "战斗部队：专业步兵"
 SAU_sp_combat_infantry_desc: "技艺娴熟、稳定的职业步兵坚守战场。\n§G+7.5%§! 师防御\n§G+5%§! 师组织度\n§R-5%§! 核心领土攻击"
 SAU_sp_fleet_bluewater: "海军：蓝水雄心"
 SAU_sp_fleet_bluewater_desc: "将目光投向波斯湾以外的广阔海洋。\n§G+15%§!海军航程\n§G+5%§!主力舰攻击\n§R-5%§!海军士气"
 SAU_sp_fleet_coastal: "海军：海岸防御"
 SAU_sp_fleet_coastal_desc: "一排排小船守护着每一个港口和礁石。\n§G+5%§!海军士气\n§G+10%§!屏卫舰防御\n§R-5%§!主力舰攻击"
 SAU_sp_fleet_gulf: "海军：海湾海上控制"
 SAU_sp_fleet_gulf_desc: "称霸阿拉伯湾狭窄拥挤的水域。\n§G+10%§!屏卫舰攻击\n§G+5%§!海军协同\n§R-10%§!海军航程"
 SAU_sp_pgm_interdiction: "精确制导武器：战场拦截"
 SAU_sp_pgm_interdiction_desc: "在敌人发起进攻之前，从后方切断他们的退路。\n§G+5%§!师组织度\n§G+5%§!近距离空中支援攻击\n§R+10%§!空军学说花费"
 SAU_sp_pgm_sead: "精确制导武器：防御压制"
 SAU_sp_pgm_sead_desc: "首先要蒙蔽并摧毁敌方防空网络。\n§G+7.5%§!制空权\n§G+5%§!空中攻击\n§R-5%§!空军机动性"
 SAU_sp_pgm_strike: "精确制导武器：精确打击"
 SAU_sp_pgm_strike_desc: "智能炸弹，能夷平目标并保护其余部分。\n§G+10%§!近距离空中支援攻击\n§G+5%§!空军攻击\n§R+5%§!消费品使用"
 SAU_sp_posture_deterrence: "立场：战略威慑"
 SAU_sp_posture_deterrence_desc: "一面平衡的盾牌，让任何侵略者都三思而后行。\n§G+5%§!师防御\n§G+5%§!空中防御\n§G+5%§!稳定度\n§R-5%§!师攻击"
 SAU_sp_posture_homeland: "立场：国土防御"
 SAU_sp_posture_homeland_desc: "一切都转向内向发展，使王国成为一座堡垒。\n§G+10%§!核心领土防御\n§G+5%§!最大堑壕深度\n§R-5%§!师移动速度"
 SAU_sp_posture_projection: "立场：力量投射"
 SAU_sp_posture_projection_desc: "一支能够远离本土进行打击的军队。\n§G+5%§!师移动速度\n§G+10%§!海军航程\n§G+5%§!空军攻击!\n§R+5%§!消费品使用"
 SAU_sp_redflag_bvr: "空军：超视距"
 SAU_sp_redflag_bvr_desc: "在敌人发现你之前，从远处将其击毙。\n§G+7.5%§!空军攻击\n§G+5%§!制空权\n§R+10%§!空军学说花费"
 SAU_sp_redflag_defensive: "空军：防空理论"
 SAU_sp_redflag_defensive_desc: "生存下去，坚持下去，守护王国的天空。\n§G+10%§!空军防御\n§G+5%§!空军机动性\n§R-5%§!空军攻击"
 SAU_sp_redflag_dogfight: "空军：空战精通"
 SAU_sp_redflag_dogfight_desc: "转身就打 - 掌控近身战。\n§G+10%§!空军机动性\n§G+5%§!空军攻击\n§R-5%§!空军防御"
 SAU_sp_reform_crash: "改革：速成计划"
 SAU_sp_reform_crash_desc: "现在就改革，迅速改 - 哪怕会带来混乱也在所不惜。\n§G+10%§!陆军经验获取\n§G+5%§!师组织度!\n§R-5%§!稳定度"
 SAU_sp_reform_foreign: "改革：外国承包商"
 SAU_sp_reform_foreign_desc: "让外国专家来快速高质量地完成工作 - 只需买单。\n§G-15%§!陆军训练时间\n§G+5%§!陆军经验获取\n§R-5%§!政治点数获取"
 SAU_sp_reform_steady: "改革：有条不紊的构建"
 SAU_sp_reform_steady_desc: "耐心、有序的改革，军队能够消化吸收。\n§G+5%§!师组织度\n§G+5%§!师恢复率\n§R-3%§!师攻击"
 SAU_sp_sang_regime: "国民警卫队：政权卫队"
 SAU_sp_sang_regime_desc: "首先也是最后，国民警卫队守护着王位和两座圣城。\n§G+10%§!核心领土防御\n§G+5%§!稳定度\n§R-5%§!师攻击"
 SAU_sp_sang_security: "国民警卫队：内部安全"
 SAU_sp_sang_security_desc: "警惕国内的颠覆和动乱。\n§G-25%§!敌方颠覆活动\n§G+5%§!稳定度\n§R-5%§!战争支持度"
 SAU_sp_sang_tribal: "国民警卫队：部落征召兵"
 SAU_sp_sang_tribal_desc: "忠诚的部落人力壮大了队伍，或者被清洗。\n§G+10%§!可征召人口\n§G+5%§!师恢复率\n§R-5%§!师组织度"
 SAU_sp_sf_counterterror: "特战部队：反恐"
 SAU_sp_sf_counterterror_desc: "一支规模虽小但杀伤力极强的部队，用于人质救援和反恐行动。\n§G+10%§!特战部队攻击\n§G特战部队防御+5%§!\n§R-3%§!特战部队上限"
 SAU_sp_sf_raiders: "特战部队：深入突袭者"
 SAU_sp_sf_raiders_desc: "更多深入打击行动，但代价是会降低其生存能力。\n§G+5%§!特战部队上限\n§G+7.5%§!特战部队攻击\n§R-5%§!特战部队防御"
 SAU_sp_sf_recon: "特战部队：侦察兵"
 SAU_sp_sf_recon_desc: "无声的眼睛，让全军看得更远。\n§G+5%§!特战部队上限\n§G+5%§!计划速度\n§R-5%§!特战部队攻击"
 SAU_spirit_king_in_name: "名义上的国王，实则身着制服的继承人。"
 SAU_spirit_king_in_name_desc: "君主制在形式上依然完整，而王储则在军事委员会的领导下担任军官。这种折衷方案避免了王室和军事机构之间公开决裂，但也无法完全满足双方的需求。"
 SAU_spirit_national_service: "国民服役阅兵"
 SAU_spirit_national_service_desc: "每年两次在法赫德国王路举行的阅兵式，利用盔甲、学生团体和现场直播来争取公众对国民服役的支持。尽管带有表演性质，但并未影响到众多民众的参与。"
 SAU_spirit_officer_housing: "军官住房计划"
 SAU_spirit_officer_housing_desc: "政府正在迅速为军官及其家属建造住房、学校和诊所。这些福利增强了军官队伍对政权的忠诚度。"
 SAU_spirit_officer_purge: "军官团大清洗"
 SAU_spirit_officer_purge_desc: "在接管过程中犹豫不决的军官已被撤职，而支持接管的军官则继续留任。清洗行动虽然缩减了军队规模，但也使剩余的军官更加服从命令。"
 SAU_spirit_public_accounts: "理事会的公共账目"
 SAU_spirit_public_accounts_desc: "沙特阿拉伯各部委首次公开支出明细，这在沙特历史上尚属首次。这项政策激怒了那些长期以来受益于开支保密的家族，但却深受公众欢迎。"
 SAU_spirit_quincy_reaffirmed: "昆西理解"
 SAU_spirit_quincy_reaffirmed_desc: "美国和安理会继续维持1945年首次建立的非正式石油和安全安排。美国军队保护海湾航运，而沙特油轮则向世界市场供应石油，两国政府都倾向于不将该协议写入书面文件。"
 SAU_spirit_security_directorate: "安全局"
 SAU_spirit_security_directorate_desc: "该委员会将马巴希特档案、内政部网络和军事情报整合到一个由一名总司令领导的单一部门。其广泛的监视权力使其卓有成效，但也使其普遍不被信任。"
 SAU_spirit_unbeholden: "无所依附的王国"
 SAU_spirit_unbeholden_desc: "沙特阿拉伯拒绝了外国的安全保证和驻军。如今，它自行采购防空系统并训练军官，以极高的财政代价换取了独立自主。"
 SAU_succession_instability: "§R继承不稳定§!"
 SAU_succession_instability_desc: "自1995年中风以来，法赫德国王一直丧失行为能力，王储阿卜杜拉成为实际统治者。王室内部分为阿卜杜拉的支持者和强大的苏代里派，导致政治局势动荡不安。在王位继承问题正式解决之前，王国的决策仍因各派系之间的争斗而陷入瘫痪。"
 SAU_syria_landbridge_severed: "伊朗陆桥断裂"
 SAU_syria_landbridge_severed_desc: "大马士革的友好政府切断了德黑兰通往真主党的陆路通道。这一战略胜利增强了沙特阿拉伯王国的信心，并稳定了其局势。"
 SAU_syria_pipeline_t1: "黎凡特输油管道（1级）"
 SAU_syria_pipeline_t1_desc: "沙特石油经约旦和叙利亚输送至地中海，对俄罗斯天然气在欧洲门户构成挑战。来自输油管线的出口§G额外收入：$ 3.50B§!，相比§R额外支出：管道途经国家的过境费$ 2.00B§!，净收入§G+$ 1.50B§!每周。破坏活动导致线路下降1级，两条线路都被切断；1级线路被切断，导致路线关闭。"
 SAU_syria_pipeline_t2: "黎凡特输油管道（2级）"
 SAU_syria_pipeline_t2_desc: "沙特石油经约旦和叙利亚输送至地中海，对俄罗斯天然气在欧洲门户构成挑战。来自输油管线的出口§G额外收入：$ 4.25B§!，相比§R额外支出：管道途经国家的过境费$ 2.30B§!，净收入§G+$ 1.95B§!每周。破坏活动导致线路下降1级，两条线路都被切断；1级线路被切断，导致路线关闭。"
 SAU_syria_pipeline_t3: "黎凡特输油管道（3级）"
 SAU_syria_pipeline_t3_desc: "沙特石油经约旦和叙利亚输送至地中海，对俄罗斯天然气在欧洲门户构成挑战。来自输油管线的出口§G额外收入：$ 5.00B§!，相比§R额外支出：管道途经国家的过境费$ 2.50B§!，净收入§G+$ 2.50B§!每周。破坏活动导致线路下降1级，两条线路都被切断；1级线路被切断，导致路线关闭。"
 SAU_syrian_quagmire: "叙利亚泥潭"
 SAU_syrian_quagmire_desc: "多年来对叙利亚这场失败战争的支持，既削弱了公众支持，也减少了国库可用资金。尽管沙特阿拉伯王国投入巨资，叙利亚政府仍然掌权。"
 SAU_tadawul_market: "§G沙特证券交易所0级§!"
 SAU_tadawul_market_desc: "§L沙特证券交易所§!目前处于起步阶段，基本交易和监管功能已到位。完善相关重点工作将深化市场，并提升其经济效益。"
 SAU_tadawul_market_t1: "§G沙特证券交易所1级§!"
 SAU_tadawul_market_t10: "§G沙特证券交易所10级§!"
 SAU_tadawul_market_t10_desc: "改革方案已全部完成，所有计划中的法律、监管机构和上市程序均已到位。§L沙特证券交易所§!现已成为§G中东和北非地区最大的证券交易所§!，其市值超过阿拉伯世界其他所有证券交易所的总和。"
 SAU_tadawul_market_t1_desc: "沙特证券交易所改革的第一阶段已改善了市场运作，提升了投资者信心。后续相关重点领域将继续推进改革。"
 SAU_tadawul_market_t2: "§G沙特证券交易所2级§!"
 SAU_tadawul_market_t2_desc: "越来越多的公司在沙特证券交易所上市，交易量不断增长，办公和企业税收收入也随之增加。"
 SAU_tadawul_market_t3: "§G沙特证券交易所3级§!"
 SAU_tadawul_market_t3_desc: "沙特证券交易所改革的三个阶段提高了交易所获得资本的渠道及其对国家收入的贡献。"
 SAU_tadawul_market_t4: "§G沙特证券交易所4级§!"
 SAU_tadawul_market_t4_desc: "沙特证券交易所现在为民用工业和上市公司提供融资，而更严格的监管提高了投资者信心和稳定性。"
 SAU_tadawul_market_t5: "§G沙特证券交易所5级§!"
 SAU_tadawul_market_t5_desc: "沙特证券交易所已完成一半的改革计划，交易活动、收入和投资者信心均有所增强。"
 SAU_tadawul_market_t6: "§G沙特证券交易所6级§!"
 SAU_tadawul_market_t6_desc: "六个阶段的改革扩大了沙特证券交易所在为沙特企业融资和吸引投资方面的作用。"
 SAU_tadawul_market_t7: "§G沙特证券交易所7级§!"
 SAU_tadawul_market_t7_desc: "经过七个阶段的改革，沙特证券交易所已成为一个成熟的区域性交易所，管理着大量资本。"
 SAU_tadawul_market_t8: "§G沙特证券交易所8级§!"
 SAU_tadawul_market_t8_desc: "成熟的沙特证券交易所能够引导资本流入建筑业和工业，并赋予政府更大的经济政策影响力。"
 SAU_tadawul_market_t9: "§G沙特证券交易所9级§!"
 SAU_tadawul_market_t9_desc: "沙特证券交易所正逐步全面建成，产生大量企业和工业税收，并在国家经济政策中发挥越来越重要的作用。"
 SAU_tenth_five_year_plan: "第十个五年计划"
 SAU_tenth_five_year_plan_desc: "自1970年以来，经济计划部每年都会发布五年计划，但其中许多计划主要起到意向声明的作用。而本计划则为港口、铁路、环城公路以及部委改革提供了全额资金。\n\n§G持续五年§!"
 SAU_vision_2030_delivered: "2030愿景：已实现"
 SAU_vision_2030_delivered_desc: "“2030愿景”已促成多项重大建设和多元化项目，包括新未来城、利雅得重建以及新的旅游设施。沙特阿拉伯现在对原油的依赖程度有所降低。"
 SAU_vision_2030_expectations: "2030愿景：承诺"
 SAU_vision_2030_expectations_desc: "“2030愿景”大型项目的公布吸引了投资，并提升了公众信心。但这些项目的规模也带来了巨大的预算和政治成本，直到承诺的项目全部完成。"
 SAU_vision_2030_progress: "2030愿景：逐渐成形"
 SAU_vision_2030_progress_desc: "沙特阿拉伯王国各地正在兴建工程，首批“2030愿景”项目已投入运营。这些显而易见的进展减少了公众对该计划的疑虑。"
 SAU_vision_2030_white_elephant: "2030愿景：白象"
 SAU_vision_2030_white_elephant_desc: "“2030愿景”计划未能按期完成，耗资数千亿美元后，许多重大项目仍未完工或未投入使用。这一失败印证了该计划批评者的质疑，并损害了公众对领导层的信心。"
 SAU_water_crisis_01: "§H可控的水危机§!"
 SAU_water_crisis_01_desc: "海水淡化规模扩大、农业政策效率提高以及公众用水量下降，已将水危机缓解至§G可控§!水平。沙特阿拉伯王国仍然面临结构性缺水问题，但供水依然可靠。"
 SAU_water_crisis_02: "§H严重的水危机§!"
 SAU_water_crisis_02_desc: "沙特阿拉伯消耗§L萨克§!和§L瓦吉德§!化石含水层的速度超过了其补充速度。农业消耗了剩余地下水的大部分，而对海水淡化的依赖则推高了§Y消费品成本§!，降低了§Y效率§!，并削弱了§Y公众的耐心§!。"
 SAU_yemen_attack_buff: "协同进攻"
 SAU_yemen_attack_buff_desc: "沙特阿拉伯的周密计划和火力支援使我方部队在进攻中占据决定性优势。对胡塞武装的进攻效率提升15%。"
 SAU_yemen_pipeline_t1: "阿拉伯海输油管道（1级）"
 SAU_yemen_pipeline_t1_desc: "沙特原油经马赫拉向南流入阿拉伯海，绕过霍尔木兹海峡。来自输油管线的出口§G额外收入：$ 2.00B§!，相比§R额外支出：管道途经国家的过境费$ 1.00B§!，净收入§G+$ 1.00B§!每周。破坏活动导致线路下降1级，两条线路都被切断；1级线路被切断，导致路线关闭。"
 SAU_yemen_pipeline_t2: "阿拉伯海输油管道（2级）"
 SAU_yemen_pipeline_t2_desc: "沙特原油经马赫拉向南流入阿拉伯海，绕过霍尔木兹海峡。来自输油管线的出口§G额外收入：$ 2.50B§!，相比§R额外支出：管道途经国家的过境费$ 1.15B§!，净收入§G+$ 1.35B§!每周。破坏活动导致线路下降1级，两条线路都被切断；1级线路被切断，导致路线关闭。"
 SAU_yemen_pipeline_t3: "阿拉伯海输油管道（3级）"
 SAU_yemen_pipeline_t3_desc: "沙特原油经马赫拉向南流入阿拉伯海，绕过霍尔木兹海峡。来自输油管线的出口§G额外收入：$ 3.00B§!，相比§R额外支出：管道途经国家的过境费$ 1.25B§!，净收入§G+$ 1.75B§!每周。破坏活动导致线路下降1级，两条线路都被切断；1级线路被切断，导致路线关闭。"
 SAU_baath_state: "阿拉伯复兴党"
 SAU_baath_state_tt: "§Y团结、自由、社会主义§!\n\n党是阿拉伯民族的先锋队，它将官兵、农民和学生融为一体，形成统一的革命意志。每一个边疆都只是通往阿拉伯家园的驿站。"
 SAU_communist_state: "社会主义国家"
 SAU_communist_state_tt: "阿拉伯半岛的无产阶级专政。这些成果只有在沙特共产党执政期间才能维持。一旦沙特共产党失去政权，这些成果也将不复存在。"
 SAU_Military_Rule: "军人统治"
 SAU_Monarchy_house_of_al_saud: "沙特王室"
 SAU_nda_state: "全国民主大会"
 SAU_nda_state_tt: "自由共和国的制度随着每一次通过投票箱赢得的改革而不断深化。"
 SAU_nlf_doctrine: "不结盟社会主义"
 SAU_nlf_doctrine_tt: "§Y阿拉伯社会主义道路（仅限民族解放阵线）：§!\n§G+15%政治点数获取，+10%战争支持度§!"
 SAU_peoples_council_works: "市政公共工程"
 SAU_peoples_council_works_tt: "由§Y民众会议§!委托建造，并按照其标准建造。"
 SAU_rep_shia_hardline_doctrine: "革命神权政治"
 SAU_rep_shia_hardline_doctrine_tt: "真主党-希贾兹以法学家的名义进行统治，该民族已动员起来进行抵抗。"
 SAU_rep_shia_moderate_doctrine: "改革派治理"
 SAU_rep_shia_moderate_doctrine_tt: "改革运动通过和解、福利和选举来治理国家。"
 SAU_rep_shia_state: "什叶派共和国"
 SAU_rep_shia_state_tt: "随着每一次改革的胜利和每一次的挫败，什叶派共和国的制度也日益强大。"
 SAU_scp_doctrine: "马克思列宁主义先锋队"
 SAU_scp_doctrine_tt: "§Y正统马克思列宁主义（只限沙特共产党）：§!\n§G+10%工厂效率，+10%建筑速度，+5%稳定度§!"
 SAU_arab_consensus: "阿拉伯世界反对正常化的共识"
 SAU_arab_shield_bond: "阿拉伯之盾兄弟会"
 SAU_beijing_agreement: "北京协议"
 SAU_betrayed_palestine: "放弃了巴勒斯坦事业"
 SAU_boycott_israel: "抵制"
 SAU_cause_solidarity: "声援巴勒斯坦"
 SAU_egypt_economic_ties: "沙特经济支持"
 SAU_egypt_military_ties: "沙特军事赞助"
 SAU_egypt_partnership: "沙特-埃及伙伴关系"
 SAU_exposed_iran: "揭露干预也门"
 SAU_iraq_friendship: "沙特与伊拉克的友谊"
 SAU_islamic_rivalry: "伊斯兰竞争"
 SAU_islamic_rivalry_tt: "[PER.GetFlag]§R伊斯兰世界的争夺战开始了。§!"
 SAU_israel_normalization: "关系正常化"
 SAU_proxy_aggression: "恐怖主义赞助者"
 SAU_quincy_reaffirmed: "昆西协议重申"
 SAU_recognition_anger: "巴勒斯坦建国地位得到承认"
 SAU_recognized_palestine: "承认巴勒斯坦"
 SAU_taif_spirit: "塔伊夫精神"
 SAU_talks_collapsed: "失败的正常化谈判"
 SAU_two_state_champion: "两国方案的倡导者"
 HOU_break_ceasefire_category: "沙特停火"
 HOU_drop_north_yemen_name: "重拾也门之名"
 HOU_drop_north_yemen_name_desc: "抛开北也门身份认同，重新在自己的旗帜下执政。"
 PER_houthi_militia: "动员人民民兵"
 PER_houthi_militia_desc: "动员部落支持者以低成本为胡塞运动提供额外的人力。"
 PER_houthi_old_weapons: "向胡塞武装走私武器"
 PER_houthi_old_weapons_desc: "运送一批旧步枪穿过红海，越过边境，送到胡塞武装手中。"
 PER_houthi_raise_brigade: "加强防守"
 PER_houthi_raise_brigade_desc: "派遣圣城旅工程师在山中挖掘通道，将胡塞武装分子困住。这样一来，想要将他们从占据的阵地上赶走就难上加难了。"
 PER_houthi_support_category: "支持胡塞武装"
 SAU_abdullah_kaec_construction: "加快建设阿卜杜拉国王经济城"
 SAU_abdullah_kaec_construction_desc: "通过免除许可证要求并雇用更多承包商沿红海沿岸建设阿卜杜拉国王经济城，加快建设进程。"
 SAU_abdullah_kasp_scholarship: "延长阿卜杜拉国王科学园区海外奖学金"
 SAU_abdullah_kasp_scholarship_desc: "扩大国家资助的海外奖学金项目，让更多沙特学生能够学习沙特王国缺乏专业人才的学科。他们的教育将有助于他们回国后增强国内劳动力。"
 SAU_abdullah_kaust_grants: "资助阿卜杜拉国王科技大学高科技项目"
 SAU_abdullah_kaust_grants_desc: "为阿卜杜拉国王科技大学提供重大研究经费，用于招募顶尖专家并在图瓦尔建立先进实验室。"
 SAU_abdullah_national_dialogue: "召开全国对话论坛"
 SAU_abdullah_national_dialogue_desc: "将宗教人士、改革派人士、什叶派代表和妇女聚集到全国对话论坛上。这些会议将为被排斥的群体提供一个正式渠道，让他们能够表达自己的诉求。"
 SAU_abdullah_sang_subsidies: "沙特阿拉伯国民警卫队现代化补贴"
 SAU_abdullah_sang_subsidies_desc: "补贴沙特阿拉伯国民警卫队的新车辆合同，降低其现代化成本，并增强其对政府的忠诚度。"
 SAU_Among_Major_powers_Open_east: "开启§R与东部的合作§!决议"
 SAU_appoint_provincial_governor: "任命省长"
 SAU_appoint_provincial_governor_desc: "省长职位空缺。请在地图上选择一个省份，省议会将决定由谁担任该职位。\n\n每个省份只能获得一次机会。"
 SAU_arm_arab_revolutionaries: "武装阿拉伯革命者"
 SAU_arm_arab_revolutionaries_desc: "向在其他阿拉伯国家活动的共产主义运动提供步枪和训练有素的组织者。"
 SAU_arm_lebanese_army: "武装黎巴嫩军队"
 SAU_arm_lebanese_army_desc: "向黎巴嫩军队提供沙特阿拉伯的武器和训练，使其能够独立于真主党作战。"
 SAU_back_mbn: "支持穆罕默德·本·纳伊夫"
 SAU_back_mbn_desc: "全力支持内政部长，他是王国反恐体系的缔造者，也是华盛顿的宠儿。一旦选定候选人，宫廷便会在接下来的王位继承过程中始终支持他。"
 SAU_back_mbn_heir: "支持穆罕默德·本·纳伊夫"
 SAU_back_mbn_heir_desc: "支持王储穆罕默德·本·纳伊夫，理由是他在内政部的工作表现、反恐记录以及与华盛顿的良好关系。"
 SAU_back_mbs_heir: "支持穆罕默德·本·萨勒曼"
 SAU_back_mbs_heir_desc: "支持国王的幼子穆罕默德·本·萨勒曼，尽管他经验有限，但他正在巩固对越来越多部门的权力。"
 SAU_back_mutaib: "支持穆塔伊卜·本·阿卜杜拉"
 SAU_back_mutaib_desc: "全力支持阿卜杜拉国王的儿子，他是国民警卫队的指挥官，也是他父亲部落追随者的继承人。一旦选定候选人，宫廷就必须在接下来的继承过程中支持他。"
 SAU_back_salman: "支持萨勒曼·本·阿卜杜勒阿齐兹"
 SAU_back_salman_desc: "全力支持苏代里家族的资深王子、长期担任利雅得总督的那位。一旦选定候选人，宫廷便会在接下来的王位继承过程中始终支持他。"
 SAU_bahrain_restore_khalifa: "重建哈里发家族"
 SAU_bahrain_restore_khalifa_desc: "如果哈利法家族在巴林失去权力，就部署兵力跨越堤道恢复其统治。\n\n当巴林不再由哈利法家族统治时，§Y即可使用§!。\n\n§G恢复哈利法王朝的权力§!，将巴林从所有非我方阵营中移除，并将其纳入§Y半岛之盾牌§!的管辖之下。\n\n§R-$15B，-2%稳定度§!，与德黑兰的关系将受到影响。§G+5%战争支持度§!。"
 SAU_bop_note: "§H王国的未来如何转变§!"
 SAU_bop_note_desc: "§H王国的未来§!平衡无法通过一项决议直接改变。它通过沙特证券交易所、沙特阿拉伯投资总局和其他部门§L完成的国策分支§!、§L关键事件§!以及国王的§L改革§!而改变。"
 SAU_break_houthi_ceasefire: "打破停火协议"
 SAU_break_houthi_ceasefire_desc: "撕毁与胡塞武装的停火协议，恢复“果断风暴”行动。"
 SAU_broadcast_revolution: "传播革命"
 SAU_broadcast_revolution_desc: "利用自由阿拉伯电台在阿拉伯国家工人和其他不满群体中宣传共产主义支持。"
 SAU_coalition_member_arm_yemen: "武装共和国"
 SAU_coalition_member_arm_yemen_desc: "武器和人员是以我们自己的名义，而不是以利雅得的名义，送往公认的政府。\n\n§G也门获得1500件步兵武器、8000名兵力和军事经验§!。每30天可以重复一次。"
 SAU_coalition_member_category: "也门联盟"
 SAU_coalition_member_leave: "退出联盟"
 SAU_coalition_member_leave_desc: "退出沙特领导的联盟并结束我们对其也门行动的参与。\n\n§R利雅得失去了一个联盟伙伴，并对此耿耿于怀§!；§G+50政治点数，+3%稳定度§!。"
 SAU_coalition_member_strike: "执行我们的任务"
 SAU_coalition_member_strike_desc: "我们执行的空中任务指令，目标是胡塞武装控制的一个省份。\n\n在目标省份§R破坏基础设施、军火工业和防空系统§!。每21天可以重复一次。"
 SAU_communist_invite_to_comintern: "邀请[FROM.GetName]加入阿拉伯共产国际"
 SAU_communist_invite_to_comintern_desc: "邀请[FROM.GetName]加入阿拉伯共产国际。一个工人阶级国家无需通过武力解放；他们可以接受，也可以拒绝。"
 SAU_communist_seize_power: "在[FROM.GetName]发动社会主义革命"
 SAU_communist_seize_power_desc: "工人阶级占领街头的地方，就举行罢工。凭借压倒性的支持，旧政权垮台；运动势头强劲的地方，国家则陷入革命内战。"
 SAU_council_national_service: "国民服役阅兵"
 SAU_council_national_service_desc: "在法赫德国王路举行全国电视直播的阅兵式，委员会成员将出席。此次阅兵式旨在提升公众对军队和新政府的支持。"
 SAU_council_officer_housing: "军官住房计划"
 SAU_council_officer_housing_desc: "为军官团建造住房、学校和诊所。这将改善军方对委员会的支持，但会将公共资金从其他需求中转移出去。"
 SAU_council_officer_purge: "清洗军官团"
 SAU_council_officer_purge_desc: "将那些在政变期间忠诚度存疑的军官退役，并将后续调查中发现的其他人员撤职。军队规模会缩小，但可靠性会更高。"
 SAU_council_public_accounts: "公布公共账目"
 SAU_council_public_accounts_desc: "公布各部委的账目，以展现理事会致力于政府透明化的承诺。这既能提升理事会的诚信声誉，又能限制此前用于非正式安排的自由支配支出。"
 SAU_council_security_directorate: "成立安全局"
 SAU_council_security_directorate_desc: "将马巴希特情报局、内政部网络和军事情报部门合并为一个统一的指挥机构。集中报告将提高委员会监控全国范围内威胁的能力。"
 SAU_councils_category: "王国议会"
 SAU_councils_category_desc: "§H协商会议§! - [ROOT.GetSAUShuraBench]\n§O乌里玛§![?SAU_shura_ulema|0] §Y技术官僚§![?SAU_shura_technocrats|0] §G显贵§![?SAU_shura_notables|0]\n§H民众会议§! - [ROOT.GetSAUPCStanding]，[ROOT.GetSAUPCBloc]\n§O改革派§![?SAU_pc_reformists|0] §Y传统派§![?SAU_pc_traditionalists|0] §G地方派§![?SAU_pc_provincials|0]\n\n如今利雅得存在两个议院，而两者都没有对国王的强制权力。\n\n§H协商会议§!由任命产生，就交付给它的事务提供建议。主导一方将决定其性质，而这种性质自有其价值：\n§O乌理玛主导§!  §G+8%稳定度，+10%意识形态变化抵制§!  /  §R-5%研究速度，-5%移民§!\n§Y技术官僚主导§!  §G+8%研究速度，+6%办公园区产出，+5%生产率§!  /  §R-5%稳定度§!\n§G显贵主导§!  §G+8%政治点数，-8%腐败成本§!  /  §R+3%消费品，-3%战争支持度§!\n\n§Y让某一席超过70席，国王便可将其在议会中的地位宪章化。§!宪章化将使主导方效果翻倍，将其固定于基本法中，并永久终结这场角逐。若拒绝，则三席均重置为40，重新进入平衡。\n\n§H民众会议§!则向下负责。它是王国历史上第一个代表被统治者、而非向他们发号施令的机构，可就内部事务立法。国王保留否决权，但§R每一次动用否决权都会消耗稳定度与战争支持度§!。"
 SAU_crown_prince_category: "太子"
 SAU_cyber_defensive_op: "防御性网络行动"
 SAU_cyber_defensive_op_desc: "强化王国防御并破坏目标的进攻系统，持续§Y90天§!。目标部队在攻击我方§Y时战斗力将降低10%§!，同时沙特阿拉伯情报总局会保护我方网络。此任务需要目标网络达到§G70%§!进度。"
 SAU_cyber_offensive_op: "进攻性网络行动"
 SAU_cyber_offensive_op_desc: "将网络转化为武器。一次为期§Y90天§!的沙特阿拉伯情报总局网络打击将瘫痪目标的指挥和防御系统：其部队的§Y防御能力将下降10%§!，产业也将停滞不前。这需要目标网络§G70%§!的进度。"
 SAU_debug_bop_left: "§Y向传统主义的转变§!"
 SAU_debug_bop_left_desc: "仅限模组制作者/调试工具。将§H王国的未来§!平衡向§R左移0.05§!（偏向传统主义）。仅在以-debug启动游戏时可见。"
 SAU_debug_bop_right: "§Y向自由主义的转变§!"
 SAU_debug_bop_right_desc: "仅限模组制作者/调试工具。将 §H王国的未来§! 平衡 §G向右移动 +0.05§!（朝向自由化）。仅在以 -debug 启动游戏时可见。"
 SAU_debug_category: "DEBUG - 沙特继承"
 SAU_debug_clear_decree_lock: "DEBUG：清除60天法令锁定"
 SAU_debug_clear_decree_lock_desc: "清除SAU_royal_decree_active这样，在位君主就可以立即再次做出决定，而无需等待60天。"
 SAU_debug_drain_salman_health: "DEBUG：消耗萨勒曼国王的健康"
 SAU_debug_drain_salman_health_desc: "将SAU_salman_health设为0。继承事件链将在下个月度判定时触发以加冕当前的王储。"
 SAU_debug_faisalite_conviction_up: "(DEBUG) 费萨尔主义信念 +25"
 SAU_debug_faisalite_conviction_up_desc: "增加25点信念并重新评估等级。重复以超过45和75。"
 SAU_debug_faisalite_open: "(DEBUG) 开启费萨尔派事件链"
 SAU_debug_faisalite_open_desc: "立即触发麦加峰会事件以启动事件链，无需等待140天。"
 SAU_debug_faisalite_pivot: "(DEBUG) 触发伊拉克关键事件"
 SAU_debug_faisalite_pivot_desc: "无论战争局势如何都会触发美国占领关键事件。"
 SAU_debug_faisalite_readout: "（DEBUG）费萨尔派：[ROOT.GetSAUFaisaliteConviction]"
 SAU_debug_faisalite_readout_desc: "§H信念§!：§Y[?SAU_faisalite_conviction|0]§!/§Y100§!\n§H每月社会保守主义§!：§Y[?SAU_social_conservatism|0]§!\n§H等级§!：[ROOT.GetSAUFaisaliteConviction]"
 SAU_debug_grievance_open: "（DEBUG）开启政变事件链"
 SAU_debug_grievance_open_desc: "设置2008年石油危机标志并触发军官不满事件，从而启动事件链，无需等待至2008年。"
 SAU_debug_grievance_readout: "（DEBUG）军官：[ROOT.GetSAUArmyGrievance]"
 SAU_debug_grievance_readout_desc: "§H不满§!：§Y[?SAU_army_grievance|0]§! / §Y100§!\n[ROOT.GetSAUArmyGrievanceEffect]\n§H卫队庇护§!（月度速率翻倍）：由SAU_sang_shielded标记检查。"
 SAU_debug_grievance_up: "（DEBUG）军官不满 +25"
 SAU_debug_grievance_up_desc: "增加25点不满并重新评估等级。重复以达到50（部署命令）和75（政变）。"
 SAU_debug_junta_legitimacy_up: "（DEBUG）军政府合法性 +25"
 SAU_debug_junta_legitimacy_up_desc: "提升军政府声望，以确保危机得以解决而非超时。"
 SAU_debug_junta_legitimacy_zero: "（DEBUG）军政府合法性归零"
 SAU_debug_junta_legitimacy_zero_desc: "让军政府跌的粉碎，以便合法性危机在下一次检查时触发。"
 SAU_debug_junta_open: "（DEBUG）强制发动军官政变"
 SAU_debug_junta_open_desc: "激活不满事件链并立即触发接管事件。"
 SAU_debug_king_abdullah: "DEBUG：阿卜杜拉国王加冕"
 SAU_debug_king_abdullah_desc: "将SAU_current_king设为1，阿卜杜拉成为国家领袖，并重启阿卜杜拉时代的继承竞争（萨勒曼45／穆罕默德·本·纳伊夫30／穆塔伊卜25）。"
 SAU_debug_king_mbn: "DEBUG：穆罕默德·本·纳伊夫国王加冕"
 SAU_debug_king_mbn_desc: "将SAU_current_king设为3，穆罕默德·本·纳伊夫成为国家领袖。"
 SAU_debug_king_mbs: "DEBUG：穆罕默德·本·萨勒曼国王加冕"
 SAU_debug_king_mbs_desc: "将SAU_current_king设为5，穆罕默德·本·萨勒曼成为国家领袖。"
 SAU_debug_king_mutaib: "DEBUG：穆塔伊卜·本·阿卜杜拉国王加冕"
 SAU_debug_king_mutaib_desc: "将SAU_current_king设为4，穆塔伊卜·本·阿卜杜拉成为国家领袖。"
 SAU_debug_king_salman: "DEBUG：萨勒曼国王加冕"
 SAU_debug_king_salman_desc: "将SAU_current_king设为2，萨勒曼成为国家领袖，将其健康值重置为100，并开启本·萨勒曼与本·纳伊夫的王储之争。"
 SAU_debug_oil_dep_readout: "(DEBUG) 石油依赖：[?oil_dependence|0]（季度变化进度 [?SAU_oil_dep_quarter|0]/3）"
 SAU_debug_oil_dep_readout_desc: "读取依赖值以及季度周期已进行的程度。"
 SAU_debug_pc_open: "(DEBUG) 建立民众会议"
 SAU_debug_pc_open_desc: "设置标记并在未完成国策的情况下，将议院席位设为40/40/40，支持率为50。"
 SAU_debug_pc_readout: "(DEBUG) 民众会议状态"
 SAU_debug_pc_readout_desc: "§H开放§!（SAU_peoples_council_open，由SAU_establish_the_peoples_council设定）\n§H地位§!：§Y[?SAU_pc_standing|0]§! - 公共工程需要60+\n§H席位§! - 改革派§Y[?SAU_pc_reformists|0]§!，传统派§Y[?SAU_pc_traditionalists|0]§!，地方派§Y[?SAU_pc_provincials|0]§! - 一个阵营需要21+才能发言\n§H已使用否决权§!：§Y[?SAU_pc_vetoes|0]§!"
 SAU_debug_pc_reset_cycle: "(DEBUG) 清除会议标记"
 SAU_debug_pc_reset_cycle_desc: "如果会议卡住，清除SAU_pc_debate_ongoing和SAU_pc_doing_bill。"
 SAU_debug_pc_standing_up: "(DEBUG) 议会声望 +20"
 SAU_debug_pc_standing_up_desc: "提高20点声望以便可以测试公共工程。"
 SAU_debug_shura_dissolve: "(DEBUG) 解散协商会议"
 SAU_debug_shura_dissolve_desc: "执行SAU_shura_dissolve：清除标记，清空替补席，移除精神。"
 SAU_debug_shura_open: "(DEBUG) 启用协商会议"
 SAU_debug_shura_open_desc: "设置SAU_shura_open并将议会席位设为50/50/50，且没有SAU_reorganization_of_the_majlis_ash_shura或米特卜在位。"
 SAU_debug_shura_readout: "(DEBUG) 协商会议检查"
 SAU_debug_shura_readout_desc: "§H该类别所需的所有条件：§!\n§Y议会已召开§!（SAU_shura_open，由SAU_reorganization_of_the_majlis_ash_shura设置）\n§Y沙特家族统治§!：[?ruling_party|0]必须为10\n§Y无政变§!（SAU_military_coup_ready必须清除）\n§Y君主制稳固§!（SAU_monarchy_abolished必须清除）\n\n§H席位§! - 乌理玛[?SAU_shura_ulema|0]，技术官僚[?SAU_shura_technocrats|0]，显贵[?SAU_shura_notables|0]"
 SAU_debug_storm_complete_civil_war: "(DEBUG) 完成也门内战国策"
 SAU_debug_storm_complete_civil_war_desc: "强制完成SAU_the_yemeni_civil_war，无需等待月度检查。"
 SAU_debug_storm_open: "(DEBUG) 触发利雅得会议"
 SAU_debug_storm_open_desc: "直接触发194事件，跳过国策及前置条件。"
 SAU_debug_storm_readout: "(DEBUG) 联盟：[?SAU_coalition_partners|0]"
 SAU_debug_storm_readout_desc: "§H联盟伙伴§!: §Y[?SAU_coalition_partners|0]§!\n§H风暴将至§!: flag SAU_decisive_storm_launched\n§H内战国策§!: SAU_the_yemeni_civil_war"
 SAU_debug_water_pride_down: "§Y(DEBUG) 强制用水自豪-1§!"
 SAU_debug_water_pride_down_desc: "模组/调试工具。无视稳定度，强制将§H主权水务§!精神降低一级。仅在-debug模式下可见。"
 SAU_debug_water_pride_up: "§Y(DEBUG) 强制用水自豪+1§!"
 SAU_debug_water_pride_up_desc: "模组/调试工具。无视稳定度，强制将§H主权水务§!精神提升一级。仅在-debug模式下可见。"
 SAU_div_arms: "武器生产本地化"
 SAU_div_arms_desc: "加强§H沙特阿拉伯军事工业公司§!和国内国防工业的发展。沙特制造的武器可以减少进口支出，为工程师提供就业机会，并§G拓展沙特的工业基础§!，使其不再局限于石油行业。"
 SAU_div_digital: "发展数字经济"
 SAU_div_digital_desc: "支持§H金融科技、电子商务和初创企业§!，以创造高技能就业机会并扩大非石油税基。这将通过发展私营数字产业来§G降低对原油的依赖§!。"
 SAU_div_giga_project: "资助一个巨型项目"
 SAU_div_giga_project_desc: "为§H新未来城§!及其在西北部规划的城市提供大量资金支持。该项目将带来巨大的建筑需求，并使经济§G摆脱对石油的依赖§!，但同时也带来了极高的财政成本。"
 SAU_div_pif_invest: "公共投资基金战略投资"
 SAU_div_pif_invest_desc: "将§H公共投资基金§!直接投入利雅得的国内工厂、建筑产能和就业市场。这将大幅降低沙特§G对石油的依赖§!，但代价是国库支出巨大。"
 SAU_div_renewables: "扩大可再生能源产能"
 SAU_div_renewables_desc: "在鲁卜哈利沙漠地区大力发展§H太阳能和风能§!。清洁能源可以释放原油用于出口，并§G降低经济对石油的依赖§!。"
 SAU_div_tourism_event: "举办全球旅游活动"
 SAU_div_tourism_event_desc: "促进§H红海沿岸§!的度假胜地、节庆活动、朝圣之旅和国际旅游业发展。游客消费能够使沙特阿拉伯王国的收入来源§G摆脱§!对石油的过度依赖。"
 SAU_domestic_external_category: "§H沙特阿拉伯内政与外交事务§!"
 SAU_east_belt_road: "“一带一路”投资"
 SAU_east_belt_road_desc: "接受中国“一带一路”倡议对沙特阿拉伯港口、铁路和工业城市的投资。这些项目在扩大基础设施的同时，通常不会像西方合作伙伴那样附加政治条件。"
 SAU_east_energy_markets: "亚洲能源市场"
 SAU_east_energy_markets_desc: "扩大对中国和其他亚洲经济体的石油出口。更广泛的客户群体能够提升沙特的议价能力，并降低其对西方需求的依赖。"
 SAU_east_trade: "与东方的贸易协定"
 SAU_east_trade_desc: "达成贸易协定，用沙特阿拉伯的能源出口换取亚洲新兴经济体的制成品。"
 SAU_faisalite_category: "费萨尔问题"
 SAU_faisalite_endowments: "为捐赠基金提供资金"
 SAU_faisalite_endowments_desc: "自石油收入下降以来，宗教捐赠基金一直面临资金短缺，应向这些基金提供额外资金。这些未公开的资金将获得在全国范围内影响布道的神职人员的支持。"
 SAU_faisalite_guard_petition: "警卫队请愿书"
 SAU_faisalite_guard_petition_desc: "允许国民警卫队高级军官向穆塔伊布提交公开请愿书。签署请愿书将表明哪些军官支持他继承王位。"
 SAU_faisalite_int_buy_satellite_channels: "购买阿拉伯卫星频道"
 SAU_faisalite_int_buy_satellite_channels_desc: "收购阿拉伯主要卫星网络并任命与利雅得立场一致的人员。此举扩大了沙特对地区媒体的影响力，但也引起了伊斯兰教法学家的担忧。"
 SAU_faisalite_int_endow_universities: "向外国大学捐赠"
 SAU_faisalite_int_endow_universities_desc: "资助在从开罗到吉隆坡的外国大学设立伊斯兰研究常任教席。利雅得将提供资金并确定最终课程设置。"
 SAU_faisalite_int_hard_currency_loans: "以硬通货放贷"
 SAU_faisalite_int_hard_currency_loans_desc: "向那些无法从其他渠道获得低成本融资的政府提供美元贷款。优惠的贷款条件将增加它们对沙特阿拉伯支持的依赖。"
 SAU_faisalite_int_officers_abroad: "其次是海外军官团"
 SAU_faisalite_int_officers_abroad_desc: "派遣沙特军官担任穆斯林世界各国武装部队的顾问和教官。这些部署有助于提升沙特军事经验，并扩大利雅得的影响力。"
 SAU_faisalite_int_pilgrimage_quotas: "扩大朝圣配额"
 SAU_faisalite_int_pilgrimage_quotas_desc: "尽管这会给麦加的基础设施带来额外压力，但仍应增加朝觐配额。更多朝圣者将体验到沙特阿拉伯对圣地的管理，并带着与沙特王国更紧密的联系返回家园。"
 SAU_faisalite_iso_buy_foreign_firms: "收购外国公司"
 SAU_faisalite_iso_buy_foreign_firms_desc: "收购在沙特王国运营的外资企业，并将其资产转移给政府部门。这加强了沙特对经济的控制，但也使新的运营者失去了原有企业的专业技术。"
 SAU_faisalite_iso_cancel_visas: "取消外国劳工签证"
 SAU_faisalite_iso_cancel_visas_desc: "允许一百万份外国工作许可证到期不再续签。这将提高沙特劳动力的比例，但会延误依赖外国劳工的项目。"
 SAU_faisalite_iso_close_foreign_schools: "关闭外国学校"
 SAU_faisalite_iso_close_foreign_schools_desc: "关闭国际学校，并将学生转入公立学校系统。教育将遵循沙特阿拉伯的课程体系，但这些学校并未做好接收更多学生的准备。"
 SAU_faisalite_iso_import_licences: "限制进口许可证数量"
 SAU_faisalite_iso_import_licences_desc: "减少每季度发放的进口许可证数量。进口商品将变得更加稀缺和昂贵，从而为国内生产商提供更大的市场空间。"
 SAU_faisalite_iso_repatriate_reserves: "遣返主权储备"
 SAU_faisalite_iso_repatriate_reserves_desc: "将沙特主权财富基金从纽约和伦敦转移回沙特王国。此举将加强对国家资产的直接控制，但会严重损害与西方金融伙伴的关系。"
 SAU_faisalite_score_interventionist: "§R干涉主义者§!§Y[?SAU_faisalite_interventionist|0]§!"
 SAU_faisalite_score_interventionist_desc: "干涉主义利用峰会、财政支持和军事顾问来巩固利雅得在伊斯兰世界的领导地位。两项干涉主义指令可以同时执行，每项指令只有在完成时才能获得回报；保持该项指令得分高于§O孤立主义§!得分，即可使最终支柱 - §R第三条道路理论§! - 得以实现。"
 SAU_faisalite_score_isolationist: "§O孤立主义者§!§Y[?SAU_faisalite_isolationist|0]§!"
 SAU_faisalite_score_isolationist_desc: "孤立主义政策使沙特阿拉伯的政策重点放在边境、宗教和石油上，同时避免对外承诺。两条孤立主义指令可以同时生效，每条指令只有在完成时才能获得收益；保持此得分高于§R干预主义§!得分，即可使最终支柱达到§O卓越孤立§!的水平。"
 SAU_faisalite_sermons: "分发讲道稿"
 SAU_faisalite_sermons_desc: "重新发行费萨尔的录音演讲，并通过国民警卫队内部渠道分发演讲稿。此举旨在复兴他的政治理念，但内政部也意识到这对现任政府的影响。"
 SAU_Foregin_affairs_category: "§G沙特外交事务§!"
 SAU_Foreign_affairs_unlocked: "§H外交事务解锁§!"
 SAU_Foreign_affairs_unlocked_desc: "外交部再次向王国负责。以下决议已可用。"
 SAU_found_arab_comintern: "建立阿拉伯共产国际"
 SAU_found_arab_comintern_desc: "阿拉伯将阿拉伯世界的共产主义国家团结起来，组成一个由其领导的革命联盟。"
 SAU_fsa_foreign_fighters: "开放外国战斗机输送渠道"
 SAU_fsa_foreign_fighters_desc: "允许途经海湾地区的外国志愿者加入叙利亚自由军，增加其可用人力。"
 SAU_fsa_send_cash: "向叙利亚自由军注资"
 SAU_fsa_send_cash_desc: "建立一条秘密资金渠道，用于支付叙利亚自由军的薪金、采购和政治组织活动。"
 SAU_fsa_smuggle_weapons: "向叛军走私武器"
 SAU_fsa_smuggle_weapons_desc: "通过约旦向叙利亚自由军输送小型武器，以增强其对抗叙利亚政府的力量。"
 SAU_heir_mbn_maneuver: "王储的策略"
 SAU_heir_mbn_maneuver_desc: "利用穆罕默德·本·纳伊夫在内政部的权威、安全记录和反恐声誉来加强他的继承权主张。"
 SAU_heir_mbs_maneuver: "年轻王子的策略"
 SAU_heir_mbs_maneuver_desc: "将更多职务移交给穆罕默德·本·萨勒曼，并撤换反对他继承权的官员。"
 SAU_heir_rally_support: "为继承人争取支持"
 SAU_heir_rally_support_desc: "在正式宣布继承人之前，与资深王子会面并向有影响力的编辑简要介绍情况，以争取对选定继承人的支持。"
 SAU_heir_undermine_mbn: "削弱穆罕默德·本·纳伊夫"
 SAU_heir_undermine_mbn_desc: "散布有关穆罕默德·本·纳伊夫的健康状况、耐力和与美国的密切关系的担忧，以削弱他在法庭上的支持。"
 SAU_heir_undermine_mbs: "削弱穆罕默德·本·萨勒曼"
 SAU_heir_undermine_mbs_desc: "强调穆罕默德·本·萨勒曼在也门战争中的行为、高额开支以及与高级王子之间的争端，以削弱他在宫廷中的支持。"
 SAU_houthi_break_ceasefire: "打破沙特停火协议"
 SAU_houthi_break_ceasefire_desc: "沙特王国的枪声已经停止，但战争远未结束。撕毁停火协议，重新对沙特发动进攻。"
 SAU_if_cross_border_raid: "跨境突袭"
 SAU_if_cross_border_raid_desc: "发动武装入侵，袭击以色列的军事仓库和哨所。这是最大胆的选择，也最有可能引发以色列的强烈反击。"
 SAU_if_rocket_barrage: "以色列城镇遭火箭弹袭击"
 SAU_if_rocket_barrage_desc: "命令前线向以色列城镇发射火箭，扰乱经济，迫使民众躲入防空洞。"
 SAU_if_suicide_bombing: "发动轰炸行动"
 SAU_if_suicide_bombing_desc: "指示该阵线的各个小组在以色列城市实施自杀式爆炸袭击，以降低公众士气并增加以色列的安全成本。"
 SAU_intel_counterintel_sweep: "反间谍扫荡"
 SAU_intel_counterintel_sweep_desc: "沙特阿拉伯情报总局暂时转向内部运作 - 安全屋关闭，密码员轮换，王国中所有外国联络人都有理由保持沉默。\n\n§G镇压外国颠覆并强化我们的加密90天§!，当它结束时，情报界也感到满意。\n\n§Y可重复§! - 扫荡效果只有在你持续运行它时才会保持有效。"
 SAU_intel_counterterror: "反恐局"
 SAU_intel_counterterror_desc: "协调针对基地组织和圣战分子小组的突袭和情报行动。此次打击行动有助于巩固稳定，增强沙特王室对总情报局的支持，并直接打击在沙特境内活动的任何外国武装分子。"
 SAU_intel_expand_gip: "扩大情报总局"
 SAU_intel_expand_gip_desc: "新站点、新掩体、新训练学员。总统府不会招募一个人就止步不前 - 它会建造一个地方安置他。\n\n§G永久增加一个特工槽位§!，这样，王国就可以长期留一名军官在前线服役。\n\n§Y可重复使用3次§!"
 SAU_intel_foreign_stations: "外国站点网络"
 SAU_intel_foreign_stations_desc: "开设海外沙特阿拉伯情报总局站点，以削弱伊朗的影响力，并扩大沙特阿拉伯在该地区的影响力。"
 SAU_intel_mabahith: "加强马巴希特"
 SAU_intel_mabahith_desc: "扩大马巴希特组织对国内异议人士的监视和行动。加强内部控制有助于提高稳定性，并获得宗教机构的支持。"
 SAU_intel_surveillance_tech: "获取先进的监控技术"
 SAU_intel_surveillance_tech_desc: "与其等待王国自己的工程师，沙特阿拉伯情报总局直接购买监控和数据分析系统，并让外国承包商进行安装。\n\n§G立即安装机构电脑§!，§Y如果没有该机构通常要求的研究或部门前期工作，就无法开展工作。§!\n\n§R你为这条捷径付出了代价§! - 比自己建造更贵，而且只有一次机会。"
 SAU_Intelligence_category: "§G情报总局§!"
 SAU_islamic_rivalry_close: "暂停针对伊朗的行动"
 SAU_islamic_rivalry_close_desc: "悄悄中止这场战役。关闭伊斯兰竞争相关决议，直至重新开启。"
 SAU_islamic_rivalry_open: "发起反伊朗运动"
 SAU_islamic_rivalry_open_desc: "启动王国机器对抗德黑兰。开启伊斯兰竞争相关决议。"
 SAU_isr_talks_backchannel: "打开秘密渠道"
 SAU_isr_talks_backchannel_desc: "利用第三国的中间人来确定以色列可能接受的条件，然后再由两国政府开始公开谈判。"
 SAU_isr_talks_clock: "结束与以色列的会谈"
 SAU_isr_talks_clock_desc: "从以色列同意谈判的那一刻起，谈判窗口期为120天。以色列必须接受阿拉伯和平倡议以及至少一条其他途径，否则耐心、政治因素以及该地区的敌对势力将使谈判窗口关闭。"
 SAU_isr_talks_palestine: "提出阿拉伯和平倡议"
 SAU_isr_talks_palestine_desc: "将2002年的倡议以书面形式摆上台面：以与阿拉伯世界全面正常化为交换条件，建立一个按照1967年边界划分的独立巴勒斯坦国。"
 SAU_isr_talks_sweeten: "让交易更诱人"
 SAU_isr_talks_sweeten_desc: "以投资、开放领空和进入海湾市场作为达成协议的经济激励措施。"
 SAU_isr_talks_us_mediation: "把华盛顿带进来"
 SAU_isr_talks_us_mediation_desc: "要求美国保证会谈顺利进行，并利用其对以色列的影响力支持达成协议。"
 SAU_junta_address_the_nation: "向全国发表讲话"
 SAU_junta_address_the_nation_desc: "安排一位资深议员发表电视讲话，解释新政府及其施政纲领。此次讲话将使部分公众放心，相信国家政府仍然处于有效控制之下。"
 SAU_junta_category: "最高军事委员会"
 SAU_junta_control_readout: "§H控制§!§W[?SAU_junta_control|0]§!"
 SAU_junta_control_readout_desc: "控制力衡量的是委员会通过驻军、检查站、情报档案和忠诚人员来执行其命令的能力。控制力每月下降一点，委员会的临时项目在启动时会消耗额外的控制力。"
 SAU_junta_legitimacy_crisis: "委员会必须为自己负责。"
 SAU_junta_legitimacy_crisis_desc: "该委员会已丧失其剩余的合法性，来自神职人员和省级当局的支持也开始瓦解。它有六个月的时间与官员们达成和解，满足部落的要求，并恢复其立场至§H20§!。\n\n§R如果一百八十天过去了，仍未达到该门槛，王国将进入公开冲突。§!"
 SAU_junta_legitimacy_readout: "§H合法性§!§W[?SAU_junta_legitimacy|0]§!"
 SAU_junta_legitimacy_readout_desc: "合法性衡量的是一个既无选举、也无教令、更无合法继承程序的宗教委员会的接受度。该指标每月下降1，降至0后，该委员会有180天的时间恢复到20。"
 SAU_junta_reinforce_garrisons: "加强驻军"
 SAU_junta_reinforce_garrisons_desc: "向各省会城市增派部队，全面配备检查站人员，恢复利雅得与驻军之间的军事通信。"
 SAU_junta_standing_readout: "§H立场§![ROOT.GetSAUJuntaStanding]"
 SAU_junta_standing_readout_desc: "[ROOT.GetSAUJuntaStandingEffect]"
 SAU_junta_tour_the_provinces: "游览各省"
 SAU_junta_tour_the_provinces_desc: "派遣议会代表前往布赖代、吉达、吉赞及内陆地区与当地领导人会面。听取他们的诉求并满足他们的资金需求，将有助于提升省级政府的支持力度。"
 SAU_king_abdullah_category: "阿卜杜拉·本·阿卜杜勒阿齐兹国王"
 SAU_king_mbn_category: "穆罕默德·本·纳伊夫国王"
 SAU_king_mbs_category: "穆罕默德·本·萨勒曼国王"
 SAU_king_mutaib_category: "穆塔伊卜·本·阿卜杜拉国王"
 SAU_king_salman_category: "萨勒曼·本·阿卜杜勒阿齐兹国王"
 SAU_mbn_border_surveillance: "加强边防监视网"
 SAU_mbn_border_surveillance_desc: "在也门和伊拉克边境沿线安装信号塔、传感器围栏和热成像摄像机，以加强对非法越境行为的检测。"
 SAU_mbn_mabahith_campaign: "授权马巴希特反颠覆运动"
 SAU_mbn_mabahith_campaign_desc: "授权总调查局瓦解全国各地涉嫌颠覆的网络。该活动还将拘留一些参与情况不明的人。"
 SAU_mbn_maneuver: "本·纳伊夫的派系斗争"
 SAU_mbn_maneuver_desc: "安全部门会努力推进穆罕默德·本·纳伊夫的诉求，并可能使法庭对你的候选人不利。"
 SAU_mbn_rehabilitation_center: "启动纳伊夫王子康复中心"
 SAU_mbn_rehabilitation_center_desc: "将拘留者安置在一个由神职人员、心理学家及其家人参与的改造计划中。该计划或许能够降低再犯率，尽管部分参与者仍会重返激进活动。"
 SAU_mbn_special_security_forces: "部署内政部特种安全部队"
 SAU_mbn_special_security_forces_desc: "在主要城市部署内政部特种安全部队，使部长拥有一支独立于正规军的武装力量。"
 SAU_mbn_western_intel_networks: "启动西方联合情报网络"
 SAU_mbn_western_intel_networks_desc: "加强利雅得、美国中央情报局和英国情报机构之间的联络。沙特阿拉伯将分享敏感信息，以换取西方情报机构提供更便捷的情报渠道。"
 SAU_mbs_anticorruption_drive: "执行反腐败行动"
 SAU_mbs_anticorruption_drive_desc: "将王子和商界领袖拘留在豪华酒店，并要求他们向国家支付赔偿金。这既能为国库带来资金，又能彰显王储对精英阶层的掌控。"
 SAU_mbs_aramco_liquidity: "沙特阿美战略流动性分配"
 SAU_mbs_aramco_liquidity_desc: "将沙特阿美的部分可用资本转移到由王储控制的项目，限制董事会在该决议中的作用。"
 SAU_mbs_gami_localization: "动员军事工业总局防御本地化"
 SAU_mbs_gami_localization_desc: "要求外国国防承包商将一半的采购资金用于沙特境内，否则将失去获得沙特合同的机会。"
 SAU_mbs_pif_neom: "将公共投资基金资金分配给新未来城和前沿项目"
 SAU_mbs_pif_neom_desc: "尽管新未来城的线性城市、港口和山地度假项目存在较高的技术和财务风险，但仍应向这些项目分配公共投资基金资金。"
 SAU_mbs_vision2030_blitz: "启动“2030愿景”宣传活动"
 SAU_mbs_vision2030_blitz_desc: "发起协调一致的广告和会议宣传活动，以争取公众和机构对“2030愿景”的支持。"
 SAU_military_category: "§H武装部队现代化§!"
 SAU_militia_back_dflp: "资助民主阵线"
 SAU_militia_back_dflp_desc: "资助巴勒斯坦世俗派别，以制衡其他运动，并增强沙特阿拉伯在巴勒斯坦政治中的影响力。"
 SAU_militia_back_hamas: "资助哈马斯"
 SAU_militia_back_hamas_desc: "向哈马斯提供资金、武器和新兵，以换取其与利雅得而非德黑兰更紧密的联盟。"
 SAU_militia_islamic_front: "组建效忠沙特的伊斯兰阵线"
 SAU_militia_islamic_front_desc: "创建并资助一个新的伊斯兰主义阵营，该阵营的组织和指挥仍然依赖于沙特阿拉伯的支持。"
 SAU_mod_abrams_gunnery: "艾布拉姆斯射击训练计划"
 SAU_mod_abrams_gunnery_desc: "执行计划以选择该部队的作战方式。\n\n§Y解锁：§!M1A2艾布拉姆斯主战坦克。\n§G开启三选一学说§!，每项学说各有利弊。之后可重新执行以§Y切换§!。§H[第一阶段改革——完成全部三项第一阶段改革以解锁第二阶段。]§!"
 SAU_mod_apache_training: "阿帕奇武装直升机训练"
 SAU_mod_apache_training_desc: "执行计划以选择该部队的作战方式。\n\n§Y解锁：§!陆军航空兵和阿帕奇武装直升机。\n§G开启三选一学说§!，每项学说各有利弊。之后可重新执行以§Y切换§!。§H[第二阶段改革——完成全部三项第二阶段改革以解锁第三阶段。]§!"
 SAU_mod_artillery_livefire: "实弹炮兵演习"
 SAU_mod_artillery_livefire_desc: "执行计划以选择该部队的作战方式。\n\n§Y解锁：§!M109自行火炮。\n§G开启三选一学说§!，每项学说各有利弊。之后可重新执行以§Y切换§!。§H[第二阶段改革——完成全部三项第二阶段改革以解锁第三阶段。]§!"
 SAU_mod_awacs_battle: "预警机作战管理训练"
 SAU_mod_awacs_battle_desc: "执行计划以选择该部队的作战方式。\n\n§Y解锁：§!E-3哨兵预警机。\n§G开启三选一学说§!，每项学说各有利弊。之后可重新执行以§Y切换§!。§H[第三阶段改革——最终部分。]§!"
 SAU_mod_complete: "第三阶段：军队全面现代化"
 SAU_mod_complete_desc: "§H第三阶段（共三阶段） - 军队完全现代化。§!\n\n§R在你完成全部三项第二阶段改革之前，此阶段将保持锁定：§!\n  §Y- 实弹炮兵演习\n  - 阿帕奇武装直升机训练\n  - 联合舰队演习§!\n（每项各选一个理论）。\n\n§G会发生什么：§!武装部队将达到§G完全现代化§! - 成为真正能与伊朗抗衡的力量 - 并出现最终改革：§Y特种部队、预警机和精确打击§!。仅触发一次。"
 SAU_mod_construction: "赞助工业建设"
 SAU_mod_construction_desc: "为东部省新建工厂和道路提供资金，以扩大主要产油区的工业产能。"
 SAU_mod_devfund: "发展基金资本化"
 SAU_mod_devfund_desc: "拨出国家发展基金，用于在东部省份开发新的建筑能力。"
 SAU_mod_fleet_exercise: "联合舰队演习"
 SAU_mod_fleet_exercise_desc: "执行计划以选择该部队的作战方式。\n\n§Y解锁：§!沙特皇家海军。\n§G开启三选一学说§!，每项学说各有利弊。之后可重新执行以§Y切换§!。§H[第二阶段改革——完成全部三项第二阶段改革以解锁第三阶段。]§!"
 SAU_mod_gulf_lessons: "军演：海湾战争的教训"
 SAU_mod_gulf_lessons_desc: "举行一场大型演习，以1991年的惨痛教训检验军队，并决定以哪种模式重建军队。\n\n§Y解锁：§!海湾战争的教训。\n§G开启四种学说选择§! - 美国学说、海合会学说、北约学说或本土学说 - 各有优势与缺陷。之后可再次进行军演以§Y切换学说§!。"
 SAU_mod_modernize: "第二阶段：战斗部队现代化"
 SAU_mod_modernize_desc: "§H第二阶段（共三阶段） - 战斗部队现代化。§!\n\n§R在你完成全部三项第一阶段改革之前，此阶段将保持锁定：§!\n §Y- 国民警卫队战备演习\n - 艾布拉姆斯射击训练计划\n - 红旗空战训练§!\n（每项各选一个理论）。\n\n§G会发生什么：§!武装部队将从§Y改革中§!变为§Y现代化§!，并出现三项新改革：§Y炮兵、阿帕奇与联合舰队§!。全部三项完成才可解锁§Y第三阶段§!。仅触发一次。"
 SAU_mod_pgm_doctrine: "精确打击理论课程"
 SAU_mod_pgm_doctrine_desc: "执行计划以选择该部队的作战方式。\n\n§Y解锁：§!精确制导弹药。\n§G开启三选一学说§!，每项学说各有利弊。之后可重新执行以§Y切换§!。§H[第三阶段改革——最终部分。]§!"
 SAU_mod_red_flag: "红旗空战训练"
 SAU_mod_red_flag_desc: "执行计划以选择该部队的作战方式。\n\n§Y解锁：§!沙特皇家空军。\n§G开启三选一学说§!，每项学说各有利弊。之后可重新执行以§Y切换§!。§H[第一阶段改革——完成全部三项第一阶段改革以解锁第二阶段。]§!"
 SAU_mod_reform: "第一阶段：启动改革计划"
 SAU_mod_reform_desc: "§H第一阶段（共三阶段） - 现代化启程。§!\n\n§G启动方式：§!完成§Y总参谋部§!国策，然后赢得§Y军演：海湾战争的教训§!（选择一种海湾战争学说）。§G会发生什么：§!武装部队从§R未现代化§!变为§Y改革中§!，并出现三项新改革 - §Y国民警卫队、艾布拉姆斯射击训练和红旗演习§!。§R全部三项§!完成才可解锁§Y第二阶段§!。仅触发一次。"
 SAU_mod_sang_drills: "国民警卫队战备演习"
 SAU_mod_sang_drills_desc: "执行计划以选择该部队的作战方式。\n\n§Y解锁：§!沙特国民警卫队。\n§G开启三选一学说§!，每项学说各有利弊。之后可重新执行以§Y切换§!。§H[第一阶段改革——完成全部三项第一阶段改革以解锁第二阶段。]§!"
 SAU_mod_sf_selection: "特种部队选拔课程"
 SAU_mod_sf_selection_desc: "执行计划以选择该部队的作战方式。\n\n§Y解锁：§!特种部队司令部。\n§G开启三选一学说§!，每项学说各有利弊。之后可重新执行以§Y切换§!。§H[第三阶段改革——最终部分。]§!"
 SAU_mod_workforce: "培训国家劳动力"
 SAU_mod_workforce_desc: "职业培训项目使更多沙特人从事技术性工作，从而稳定社会并提升国民士气。"
 SAU_mutaib_capital_garrison: "加强首都驻军网"
 SAU_mutaib_capital_garrison_desc: "在利雅得周围设立国民警卫队检查站、装甲阵地和独立通讯设施。这既能保护首都，又能加强国民警卫队对首都的控制。"
 SAU_mutaib_janadriyah_festival: "举办贾纳德里亚国家遗产节"
 SAU_mutaib_janadriyah_festival_desc: "由国民警卫队主办贾纳德里亚节，活动包括骆驼赛跑、剑舞、诗歌朗诵和电视直播的部落仪式。此举将加强穆塔伊卜与部落首领之间的联系。"
 SAU_mutaib_maneuver: "穆塔伊布的派系策略"
 SAU_mutaib_maneuver_desc: "国民警卫队致力于推进穆塔伊布的主张，并可能让宫廷反对你自己的候选人。"
 SAU_mutaib_sang_logistics: "自主国民警卫队后勤管理"
 SAU_mutaib_sang_logistics_desc: "建立独立的国民警卫队后勤补给系统，而不是依赖正规军的仓库。后勤自主性将增强国民警卫队的作战和政治独立性。"
 SAU_mutaib_sang_procurement: "国民警卫队航空和装甲采购快速通道"
 SAU_mutaib_sang_procurement_desc: "优先为国民警卫队提供阿帕奇直升机和装甲车，优先于正规军的订单，包括独立的国民警卫队航空部队。"
 SAU_mutaib_tribal_reserves: "动员部落国民警卫队预备役"
 SAU_mutaib_tribal_reserves_desc: "呼吁部落酋长们按照既定的征税制度为国民警卫队提供有偿预备役人员。"
 SAU_officer_crisis_category: "军官们的申诉"
 SAU_officer_grievance_readout: "军官团：[ROOT.GetSAUArmyGrievance]"
 SAU_officer_grievance_readout_desc: "§H不满§!：§Y[?SAU_army_grievance|0]§!/§Y100§!\n[ROOT.GetSAUArmyGrievanceEffect]"
 SAU_officers_pay_arrears: "支付欠款"
 SAU_officers_pay_arrears_desc: "一次性补发十一个月的津贴、住房补贴和拖欠工资。这能暂时缓解问题，但无法解决军官们不满的根源。\n\n§G-20不满§!，§R-12B§!，每60天可重复一次。"
 SAU_officers_promote_colonels: "提拔上校"
 SAU_officers_promote_colonels_desc: "将旅级指挥权授予经验丰富的职业军官，而不是留给王子们。这一改变将提高军团对择优晋升的信心。\n\n§G-15不满§!，§G+2%稳定度§!，每90天可重复一次。"
 SAU_officers_restore_defence_budget: "恢复国防预算"
 SAU_officers_restore_defence_budget_desc: "恢复从正规军削减的资金，并将费用转嫁到国民警卫队的预算中。这解决了军官们不满的主要原因。\n\n§G-25不满§!，§R-25B§!，并且国民警卫队不再受到庇护，因此不满上升速度降低至过去一半；此操作只能执行一次。"
 SAU_officers_settle_for_good: "与军官和解"
 SAU_officers_settle_for_good_desc: "建立军官选拔委员会，公布晋升时间表，并由国王亲自批准解决方案。只有在所有未解决的不满都得到消除后才能完成。\n\n§G永久结束危机并防止政变§!；需要不满为§Y0§!。"
 SAU_oil_conserve: "预留储备"
 SAU_oil_conserve_desc: "减少生产以保留储备供未来使用。这会牺牲当前收入，但§G降低经济对石油的依赖§!并提高稳定度。"
 SAU_oil_embargo: "宣布石油禁运"
 SAU_oil_embargo_desc: "通过终止向§L西方及以色列的盟友§!，特别是§L美国、英国、法国、德国和荷兰§!的石油出口，再度实行§H1973§!政策。他们的经济将因供应冲击而受损，而沙特阿拉伯则在阿拉伯和穆斯林国家中获得支持。\n\n王国失去了西方出口收入，并损害了与华盛顿的关系，但获得了§H声望、团结以及神职人员的祝福§!。"
 SAU_oil_increase_output: "增加石油产量"
 SAU_oil_increase_output_desc: "提高东部省份的原油产量，以获取§G更多石油和即时收入§!。这也会使经济§R更加依赖§!石油出口。"
 SAU_oil_new_field: "开发新油田"
 SAU_oil_new_field_desc: "在鲁卜哈利沙漠进行勘探融资并开凿新油井。该项目将增加一处大型§G石油矿藏§!，但也会加剧王国对石油的依赖。"
 SAU_oil_new_field_tt: "§G新油田得到证实§! - 王国的一个地区§Y+15石油§!，花费§R150B§!"
 SAU_opec_cut_production: "削减石油产量"
 SAU_opec_cut_production_desc: "利用沙特阿拉伯作为欧佩克弹性产油国的角色来减少产量，并§G推高世界油价§!，从而提高每桶收入。每180天可重复一次。"
 SAU_opec_flood_market: "冲击石油市场"
 SAU_opec_flood_market_desc: "将产量提高到足以§R压低世界油价§!的程度。沙特阿拉伯短期内收入会减少，但竞争出口国（§L俄罗斯、伊朗、伊拉克、委内瑞拉§!）将遭受更大的经济损失。每年可重复一次。"
 SAU_operation_decisive_storm: "果断风暴行动（Amaliyat Asifat al-Hazm）"
 SAU_operation_decisive_storm_desc: "发动§Y果断风暴行动§!。这是针对也门胡塞武装控制区发起的联军空中作战。沙特战机会打击胡塞武装阵地、保护政府军，并解锁对也门军队的持续支援。"
 SAU_pal_aid_package: "巴勒斯坦援助方案"
 SAU_pal_aid_package_desc: "每季度由沙特提供资金，用于巴勒斯坦权力机构在拉马拉的工资、医院、公用事业和重建。"
 SAU_pal_fund_development: "资助巴勒斯坦发展"
 SAU_pal_fund_development_desc: "为巴勒斯坦领土各地的道路、学校和诊所提供资金，以改善生活条件并支持可行的两国方案。"
 SAU_pal_invest_gaza: "投资加沙和约旦河西岸"
 SAU_pal_invest_gaza_desc: "投资加沙和约旦河西岸的工厂和基础设施，以创造就业机会并减少对激进组织的支持。"
 SAU_pc_convene: "召开民众会议"
 SAU_pc_convene_desc: "召开民众会议，并给任何拥有足够席位的集团三周时间提出法案。一旦法案被提出，国王必须批准或否决它；批准会增强提案集团的实力，而否决则会削弱它。\n\n每90天可重复一次。"
 SAU_pc_convene_tt: "开启辩论 - 拥有§Y21个以上席位§!的集团可在§Y21天内§!提出议案"
 SAU_pc_dissolve: "解散民众会议"
 SAU_pc_dissolve_desc: "以王室敕令解散民众会议，且未设定其复会日期。\n\n§R-10%稳定度，-8%战争支持度§!，§G+150政治点数§!。无法撤销。"
 SAU_pc_enact_provincial: "颁布地方派法案"
 SAU_pc_enact_provincial_desc: "在遭到主要商业利益的反对同时仍实施已批准的沙特化雇用配额、担保制度改革及独立监察机构。\n\n§H声望§!代表民众会议的公共权威；当法案被听取并颁布时§G上升§!，在否决、忽视或法案过期时§R下降§!，声望低于§Y40§!将导致法案无法在各部通行。"
 SAU_pc_enact_provincial_tt: "需要§Y300政治点数§!，且议会仍须支持该法案 - 其§H声望§!需高于§Y40§!（现为§Y100§!中的§Y[?SAU_pc_standing|0]§!）"
 SAU_pc_enact_reformist: "颁布改革派法案"
 SAU_pc_enact_reformist_desc: "通过指派各部委筹备法规、日程与预算，落实已批准的改革法案。\n\n§H声望§!代表民众会议的公共权威；当法案被听取并颁布时§G上升§!，在否决、忽视或法案过期时§R下降§!，声望低于§Y40§!将导致法案无法在各部通行。"
 SAU_pc_enact_reformist_tt: "需要§Y300政治点数§!，且议会仍须支持该法案 - 其§H声望§!需高于§Y40§!（现为§Y100§!中的§Y[?SAU_pc_standing|0]§!）"
 SAU_pc_enact_traditionalist: "颁布传统派法案"
 SAU_pc_enact_traditionalist_desc: "通过主管部门实施已批准的宗教捐赠、住房补贴和地方诊所计划。\n\n§H声望§!代表民众会议的公共权威；当法案被听取并颁布时§G上升§!，在否决、忽视或法案过期时§R下降§!，声望低于§Y40§!将导致法案无法在各部通行。"
 SAU_pc_enact_traditionalist_tt: "需要§Y300政治点数§!，且议会仍须支持该法案 - 其§H声望§!需高于§Y40§!（现为§Y100§!中的§Y[?SAU_pc_standing|0]§!）"
 SAU_pc_public_works: "委托公共工程"
 SAU_pc_public_works_desc: "议会选择一个省份，并设定标准：§Y[?SAU_pc_req_civ|0]§!座民用工厂、§Y[?SAU_pc_req_off|0]§!座办公园区和§Y[?SAU_pc_req_inf|0]§!座基础设施，政府必须在没有自由建设的情况下达到该标准；每次成功授权后标准都会提高。§H两年内完成§!：成功将给予该地区永久§G+1建筑槽位、+10%建造速度和+5%人力§!，而失败则§R放弃工程并移除一座民用工厂§!。§Y需要§!议会声望达到§G60或更高§!；花费：§R-4B§!。"
 SAU_pc_readout: "民众会议：[ROOT.GetSAUPCBloc]"
 SAU_pc_readout_desc: "§H民众会议§! - [ROOT.GetSAUPCBloc]，[ROOT.GetSAUPCStanding]（§Y[?SAU_pc_standing|0]§!/§Y100§!）\n§Y改革派§!：[?SAU_pc_reformists|0]   §Y传统派§!：[?SAU_pc_traditionalists|0]   §Y地方派§!：[?SAU_pc_provincials|0]\n§H王室否决次数§!：§Y[?SAU_pc_vetoes|0]§!\n\n§H声望§!代表议会的公共权威；当法案被听取并颁布时§G上升§!，在否决、忽视或法案过期时§R下降§!，并且必须保持§Y40§!以上才能让法案在各部通行，在§Y60§!以上才能委托公共工程。"
 SAU_pc_session_clock: "议会等待裁决"
 SAU_pc_session_clock_desc: "议会已经召开，符合条件的集团有三周时间在会期结束前提出法案，否则将不予回应。"
 SAU_pc_take_provincial_bill: "听取地方派"
 SAU_pc_take_provincial_bill_desc: "允许地方派集团提出一项法案，设立沙特化招聘配额，改革担保制度，并建立独立的劳动监察机构。"
 SAU_pc_take_reformist_bill: "听取改革派"
 SAU_pc_take_reformist_bill_desc: "允许由年轻律师和归国毕业生组成的改革派集团提出一项法案，聚焦政府绩效与制度改革的法案。"
 SAU_pc_take_traditionalist_bill: "听取传统派"
 SAU_pc_take_traditionalist_bill_desc: "允许传统派集团提出一项法案，为服务不足的省份提供宗教捐赠基金、住房补贴和诊所的资金。"
 SAU_pc_works_mandate: "议会声望：[SAU_pc_works_province.GetName]"
 SAU_pc_works_mandate_desc: "议会已选定[SAU_pc_works_province.GetName]，政府有两年时间达到其公布的发展标准。不会自动提供任何建设。\n\n所需标准为该地区的§Y[?SAU_pc_req_civ|0]§!座民用工厂、§Y[?SAU_pc_req_off|0]§!座办公园区和§Y[?SAU_pc_req_inf|0]§!项基础设施。"
 SAU_pipeline_iraq: "欧洲管道"
 SAU_pipeline_iraq_desc: "萨达姆政权垮台后，应修建通往土耳其边境的伊拉克段输油管道。沙特石油要运往欧洲，还需要与安卡拉另行达成协议。"
 SAU_pipeline_iraq_talks: "与巴格达公开对话"
 SAU_pipeline_iraq_talks_desc: "即使伊拉克对沙特王室抱有敌意，也要要求萨达姆政府允许沙特阿拉伯修建一条输油管道穿过伊拉克。巴格达方面不太可能同意。"
 SAU_pipeline_sabotage_category: "破坏沙特输油管道"
 SAU_pipeline_syria_assad: "就黎凡特输油管道进行谈判"
 SAU_pipeline_syria_assad_desc: "确保经由约旦的过境通道畅通，然后与敌对的阿萨德政府谈判，修建一条途经叙利亚通往地中海的管道。作为回报，大马士革方面会要求巨额过境费和政治让步。"
 SAU_pipeline_syria_fsa: "黎凡特输油管道（自由叙利亚）"
 SAU_pipeline_syria_fsa_desc: "确保经由约旦的过境安全，然后向友好的叙利亚政府提供沙特阿拉伯的投资，以换取一条通往地中海的管道路线。"
 SAU_pipeline_turkey_extend: "将管道延伸至土耳其"
 SAU_pipeline_turkey_extend_desc: "与安卡拉方面谈判，将伊拉克输油管道延伸至土耳其，并将沙特石油直接输送至欧洲市场。"
 SAU_pipeline_yemen: "阿拉伯海输油管道"
 SAU_pipeline_yemen_desc: "在友好国家也门南部和马赫拉修建一条通往阿拉伯海的输油管道。由于也门战争持续，这条管道仍然容易受到破坏。"
 SAU_proj_alula: "建造埃尔奥拉"
 SAU_proj_alula_desc: "将阿尔乌拉古老的纳巴泰墓葬群和绿洲开发为旗舰文化和遗产目的地。§Y（成本：500亿美元，建造约450天）§! §R截止日期：剩余[?SAU_remain_alula|0]天。§! §H施工期间占用5个民用工厂。§![?SAU_remain_alula|0]"
 SAU_proj_amaala: "建设阿玛拉"
 SAU_proj_amaala_desc: "红海西北海岸的健康养生与超奢华旅游飞地，被称为“中东的里维埃拉”。§Y（成本：500亿美元，建造约450天）§! §R截止日期：剩余[?SAU_remain_amaala|0]天。§! §H施工期间占用5座民用工厂。§!"
 SAU_proj_diriyah: "建设迪里耶"
 SAU_proj_diriyah_desc: "将王国发源地修复为围绕阿特图莱夫泥砖城市的遗产和文化区。§Y（费用：500亿美元，建造约450天）§! §R截止日期：剩余[?SAU_remain_diriyah|0]天。§! §H施工期间占用5座民用工厂。§!"
 SAU_proj_green_riyadh: "建设绿色利雅得"
 SAU_proj_green_riyadh_desc: "一个在首都各地种植数百万棵树的计划，旨在为城市降温并缓和沙漠。§Y（成本：300亿美元，建造约365天）§! §R截止日期：剩余[?SAU_remain_green_riyadh|0]天。§! §H施工期间占用4个民用工厂。§!"
 SAU_proj_jeddah_central: "建设吉达中心区"
 SAU_proj_jeddah_central_desc: "将吉达海滨重新开发为现代化市中心，包含体育场、码头和文化区。§Y（成本：600亿美元，建造约450天）§! §R截止日期：剩余[?SAU_remain_jeddah_central|0]天。§! §H施工期间占用6座民用工厂。§!"
 SAU_proj_king_salman_park: "建造萨勒曼国王公园"
 SAU_proj_king_salman_park_desc: "在利雅得建设一座全球最大的城市公园之一。§Y（成本：400亿美元，建造约270天）§！§R截止日期：剩余[?SAU_remain_king_salman_park|0]天。§！§H施工期间占用4座民用工厂。§！"
 SAU_proj_neom: "建造新未来城"
 SAU_proj_neom_desc: "将新未来城发展为王国在红海沿岸的旗舰型后石油时代城市与工业区。§Y（成本：1500亿美元，建造约730天）§! §R截止日期：剩余[?SAU_remain_neom|0]天。§! §H施工期间占用10座民用工厂。§!"
 SAU_proj_new_murabba: "建造新穆拉巴"
 SAU_proj_new_murabba_desc: "一个为利雅得打造的新市中心，围绕穆卡布建造，这座立方体塔楼大到足以容纳二十座帝国大厦。§Y（成本：1000亿美元，建造约730天）§! §R截止日期：剩余[?SAU_remain_new_murabba|0]天。§! §H施工期间占用10座民用工厂。§!"
 SAU_proj_oxagon: "建造奥克萨贡"
 SAU_proj_oxagon_desc: "在新未来城建造一个围绕清洁能源产业布局的浮动港口与制造中心。§Y（成本：800亿美元，建造约需540天）§! §R截止日期：剩余[?SAU_remain_oxagon|0]天。§! §H施工期间占用8座民用工厂。§!"
 SAU_proj_qiddiya: "建设奇迪亚"
 SAU_proj_qiddiya_desc: "一个在利雅得郊外的集娱乐、体育和文化产业的巨型城市，包含主题公园、体育场和赛车场。§Y（成本：800亿美元，建造约540天）§! §R截止日期：剩余[?SAU_remain_qiddiya|0]天。§! §H施工期间占用8座民用工厂。§!"
 SAU_proj_red_sea: "建设红海项目"
 SAU_proj_red_sea_desc: "一个横跨数十座原始岛屿的超豪华旅游目的地，严格按照环保标准建造。§Y（成本：800亿美元，建造约需540天）§! §R截止日期：剩余[?SAU_remain_red_sea|0]天。§! §H施工期间占用7座民用工厂。§!"
 SAU_proj_roshn: "建设ROSHN"
 SAU_proj_roshn_desc: "这个国家住房开发商正在建设完整的综合性社区，让数百万沙特人住进现代住宅。§Y（成本：600亿美元，建造约365天）§!§R截止日期：剩余[?SAU_remain_roshn|0]天。§!§H施工期间占用7座民用工厂。§!"
 SAU_proj_sindalah: "建设辛达拉"
 SAU_proj_sindalah_desc: "将辛达拉开发为新未来城在红海上的豪华岛屿目的地，并将其作为其首个向游客开放的项目。§Y（成本：400亿美元，建造约需270天）§! §R截止日期：剩余[?SAU_remain_sindalah|0]天。§! §H施工期间占用4座民用工厂。§!"
 SAU_proj_soudah_peaks: "建设苏达峰"
 SAU_proj_soudah_peaks_desc: "在阿西尔的高峰上开发一个山地旅游目的地，利用该地区较凉爽的气候和绿色景观。§Y（成本：400亿美元，建造约450天）§! §R截止日期：剩余[?SAU_remain_soudah_peaks|0]天。§! §H建造期间占用5个民用工厂。§!"
 SAU_proj_sports_blvd: "建造体育大道"
 SAU_proj_sports_blvd_desc: "一条横跨利雅得、全长135公里的休闲走廊，供骑行、跑步和骑马使用。§Y（成本：300亿美元，建造约270天）§! §R截止日期：剩余[?SAU_remain_sports_blvd|0]天。§! §H施工期间占用4个民用工厂。§!"
 SAU_proj_the_line: "建造THE LINE"
 SAU_proj_the_line_desc: "建造THE LINE，作为一座170公里长的无车直线城市，位于两座500米高的镜面结构之间。§Y（成本：2000亿美元，建造约900天）§! §R截止日期：剩余[?SAU_remain_the_line|0]天。§! §H施工期间占用12座民用工厂。§!"
 SAU_proj_trojena: "建造特罗耶纳"
 SAU_proj_trojena_desc: "一座新未来城高地上的全年山地度假胜地，在阿拉伯沙漠中提供户外滑雪体验。§Y（成本：600亿美元，建造约450天）§! §R截止日期：剩余[?SAU_remain_trojena|0]天。§! §H建设期间占用5座民用工厂。§!"
 SAU_rally_support: "为我们的候选人争取支持"
 SAU_rally_support_desc: "争取王室、宗教机构和新闻界的支持，让他们站到你所支持的王储的身后。收益可能是微小、显著，或重大。"
 SAU_repair_pipeline_iraq: "扩建欧洲管道"
 SAU_repair_pipeline_iraq_desc: "升级北部干线，恢复被破坏的部分或铺设额外的泵送能力，以便向土耳其输送更多原油。"
 SAU_repair_pipeline_syria: "扩建黎凡特管道"
 SAU_repair_pipeline_syria_desc: "升级地中海管线，恢复被破坏行动摧毁的部分或拓宽经安曼和大马士革的走廊。"
 SAU_repair_pipeline_yemen: "扩建阿拉伯海管道"
 SAU_repair_pipeline_yemen_desc: "升级南部管线。恢复被破坏的部分或铺设额外的泵送能力，让更多原油通过霍尔木兹海峡。"
 SAU_request_f15: "请求美国F-15战机"
 SAU_request_f15_desc: "就“和平之盾”计划向美国求购F-15“打击鹰”战斗机。若他们批准出口，§Y“F-15‘打击鹰’”§!国策将解锁。\n\n§R这是一项互斥性选择：§!第一个接受我方请求的供应商将使我们的战斗机机型确定，而另外三个项目（§YF-15“攻击鹰”§!、§Y“狂风”GR4§!、§Y帕那维亚“狂风”§!）将永久关闭。请审慎抉择。"
 SAU_request_panavia: "请求意大利帕纳维亚“狂风”战机"
 SAU_request_panavia_desc: "就“和平之盾”计划向罗马求购帕纳维亚IDS“狂风”战斗机。若他们批准出口，§Y“帕纳维亚‘狂风’”§!国策将解锁。\n\n§R这是一项互斥性选择：§!第一个接受我方请求的供应商将使我们的战斗机机型确定，而另外三个项目（§YF-15“攻击鹰”§!、§Y“狂风”GR4§!、§Y帕那维亚“狂风”§!）将永久关闭。请审慎抉择。"
 SAU_request_tornado: "请求英国“龙卷风”GR4战机"
 SAU_request_tornado_desc: "就“和平之盾”计划向伦敦求购“狂风”战斗机。若他们批准出口，§Y“龙卷风GR4”§!国策将解锁。\n\n§R这是一项互斥性选择：§!第一个接受我方请求的供应商将使我们的战斗机机型确定，而另外三个项目（§YF-15“攻击鹰”§!、§Y“狂风”GR4§!、§Y帕那维亚“狂风”§!）将永久关闭。请审慎抉择。"
 SAU_request_typhoon: "请求欧洲台风战斗机"
 SAU_request_typhoon_desc: "就“和平之盾”计划向欧洲财团（德国）求购“台风”战斗机。若他们批准出口，§Y“和平之盾：台风战斗机”§!国策将解锁。\n\n§R这是一项互斥性选择：§!第一个接受我方请求的供应商将使我们的战斗机机型确定，而另外三个项目（§YF-15“攻击鹰”§!、§Y“狂风”GR4§!、§Y帕那维亚“狂风”§!）将永久关闭。请审慎抉择。"
 SAU_rivalry_back_separatists: "支持分离主义者"
 SAU_rivalry_back_separatists_desc: "情报总局向阿瓦兹、俾路支斯坦和库尔德斯坦输送资金和武器。伊朗的周边地区开始动荡。"
 SAU_rivalry_propaganda_blitz: "反伊朗媒体攻势"
 SAU_rivalry_propaganda_blitz_desc: "通过广播和清真寺铺天盖地地传播反对德黑兰的材料。"
 SAU_rivalry_strait_patrols: "海峡巡逻"
 SAU_rivalry_strait_patrols_desc: "让舰队继续在霍尔木兹海峡的狭窄水域进行演练。"
 SAU_royal_patronage: "王室赞助"
 SAU_royal_patronage_desc: "利用王室任命和契约在家族资深成员中为选定的候选人争取支持。每次继承竞争中可使用一次。\n\n给予你已支持的王子§G+20声望§!，§Y在阿卜杜拉国王和萨勒曼国王统治下各一次§!。"
 SAU_royal_patronage_tt: "你所支持的王子声望§G+20§!"
 SAU_sabotage_pipeline_iraq: "打击欧洲管道"
 SAU_sabotage_pipeline_iraq_desc: "打击从沙特经伊拉克通往欧洲的输油管道。切断它，利雅得对莫斯科的挑战也将随之崩溃。"
 SAU_sabotage_pipeline_syria: "打击黎凡特管道"
 SAU_sabotage_pipeline_syria_desc: "打击沙特通往地中海的输油管道。成功击中即可切断这条线路，使王国失去该通道。"
 SAU_sabotage_pipeline_yemen: "打击阿拉伯海管道"
 SAU_sabotage_pipeline_yemen_desc: "派遣破坏分子经由南也门对沙特的防线进行渗透。一旦他们成功穿越，石油供应将中断，王国也将失去其南部管线。"
 SAU_salman_burden_of_state: "劝谏国王勤政"
 SAU_salman_burden_of_state_desc: "要求国王亲自处理通常可以委派的文件、代表团和仪式。增加的工作量将加速他健康状况的恶化。"
 SAU_salman_cpsa_council: "召开政治与安全事务委员会"
 SAU_salman_cpsa_council_desc: "将现有的安全委员会替换为在皇宫召开的单一政治与安全事务委员会。集中权力将缩短重大决策所需的时间。"
 SAU_salman_health_status: "§H国王的健康§!：[GetSAUKingHealth]"
 SAU_salman_health_status_desc: "据报告国王的健康状况为[GetSAUKingHealth]。当他的健康恶化时，王储将继承王位。"
 SAU_salman_ksrelief: "动员萨勒曼国王人道主义援助和救济中心救灾行动"
 SAU_salman_ksrelief_desc: "在沙特官方支持下，向海外派遣萨勒曼国王人道主义援助和救济中心救援车队、野战医院和食品物资。此举旨在提供人道主义援助，同时提升沙特政府在国内的支持率。"
 SAU_salman_maneuver: "萨尔曼的派系策略"
 SAU_salman_maneuver_desc: "苏代里集团致力于推进萨尔曼的诉求，并可能使法院对你的候选人不利。"
 SAU_salman_riyadh_metro_plan: "扩大利雅得大都会规划"
 SAU_salman_riyadh_metro_plan_desc: "通过六条地铁线路和一系列围绕交通网络规划的新城区来扩展利雅得。"
 SAU_salman_royal_decrees: "发布皇家结构法令"
 SAU_salman_royal_decrees_desc: "利用皇家法令合并、废除和重组各部委，而无需冗长的立法程序。"
 SAU_salman_royal_physicians: "召集皇家御医"
 SAU_salman_royal_physicians_desc: "请来欧美专家为国王诊治，并让他腾出时间休息。这能暂时改善他的病情，但无法阻止病情长期恶化。"
 SAU_salman_spark_park: "补贴萨勒曼国王能源园"
 SAU_salman_spark_park_desc: "补贴达曼附近占地30平方公里的萨勒曼国王能源园区，用于在国内生产泵、阀门和钻井设备。"
 SAU_shura_convene_session: "召开协商会议"
 SAU_shura_convene_session_desc: "召开一次正式的协商会议，所有大臣必须出席并回答问题。会议记录将予以公布，并可能影响公众舆论，但国王仍保留最终权力。\n\n该决议只能使用一次。"
 SAU_shura_seat_notables: "让显贵入席"
 SAU_shura_seat_notables_desc: "任命吉达和布赖代的部落酋长和主要商贾家族成员进入协商会议。\n\n每60天可重复一次。"
 SAU_shura_seat_notables_tt: "§G显贵席位+10§!，§R乌理玛和技术官僚-5个席位§!\n§G显贵主导时§!：§G+8%政治点数，-8%腐败成本§! / §R+3%消费品，-3%战争支持度§!\n§Y达到70个席位时，国王可将议会状态宪章化。§!"
 SAU_shura_seat_technocrats: "让技术官僚入席"
 SAU_shura_seat_technocrats_desc: "任命经济学家、工程师和经验丰富的部委官员，包括在国外接受教育的沙特人，进入协商会议。\n\n每60天可重复一次。"
 SAU_shura_seat_technocrats_tt: "§G技术官僚席位+10§!，§R乌理玛和显贵席位-5§!\n§Y技术官僚主导时§!：§G+8%研究速度，+6%办公园区产出，+5%生产率增长§! / §R-5% 稳定度§!\n§Y达到70个席位时，国王可将议会状态宪章化。§!"
 SAU_shura_seat_ulema: "让乌里玛入席"
 SAU_shura_seat_ulema_desc: "任命资深宗教学者及其认可的候选人进入委员会，以增强神职人员对协商会议工作的影响力。\n\n每60天可重复一次。"
 SAU_shura_seat_ulema_tt: "§G乌理玛席位+10§!，§R技术官僚和显贵席位-5§!\n§O乌理玛主导时§!：§G+8%稳定度，+10%抵制意识形态变化§! / §R-5%研究速度，-5%移民§!\n§Y达到70个席位时，国王可将议会状态宪章化。§!"
 SAU_spread_revolution_category: "传播革命"
 SAU_storm_air_campaign: "打击胡塞武装阵地"
 SAU_storm_air_campaign_desc: "选择一个由胡塞武装控制的省份，袭击其仓库、机场和补给道路。此次袭击还会破坏附近的基础设施并造成人员伤亡。\n\n§R破坏目标省份的基础设施、军工产业和防空系统§!，并消耗守军的人力。每14天可重复发动一次。"
 SAU_storm_partner_readout: "联盟：[?SAU_coalition_partners|0]伙伴"
 SAU_storm_partner_readout_desc: "§H共同空军行动国家§!：§Y[?SAU_coalition_partners|0]§!\n\n每个联盟成员都可以独立退出。"
 SAU_storm_stand_down: "停止军事活动"
 SAU_storm_stand_down_desc: "停止联军出击，解散战役，不再进行任何军事行动。\n\n§G+4%稳定度§!，§R-3%战争支持度§!。彻底结束这场活动。"
 SAU_undermine_mbn: "削弱穆罕默德·本·纳伊夫"
 SAU_undermine_mbn_desc: "利用法院关系、不利披露信息以及扣留庇护金等手段削弱穆罕默德·本·纳伊夫的支持率。其结果可能从无效到影响力大幅下降不等。"
 SAU_undermine_mutaib: "削弱穆塔伊卜·本·阿卜杜拉"
 SAU_undermine_mutaib_desc: "利用法院关系、不利披露信息以及扣留庇护金等手段削弱穆塔伊卜·本·阿卜杜拉的支持率。其结果可能从毫无效果到影响力大幅下降不等。"
 SAU_undermine_salman: "削弱萨勒曼·本·阿卜杜勒阿齐兹"
 SAU_undermine_salman_desc: "利用法院关系、不利披露信息以及扣留庇护金等手段削弱萨勒曼·本·阿卜杜勒阿齐兹的支持率。其结果可能从毫无效果到影响力大幅下降不等。"
 SAU_unleash_laf: "黎巴嫩军队出击"
 SAU_unleash_laf_desc: "军队已经重建、薪饷充足、装备精良。现在，利雅得向贝鲁特提出唯一重要的回报：解除真主党的武装，必要时可使用武力。"
 SAU_vision2030_category: "2030愿景工程"
 SAU_west_free_trade: "与西方国家进行自由贸易"
 SAU_west_free_trade_desc: "降低关税，并与北约成员国签署贸易协定。与西方联盟的关系升温，开放的贸易协定将他们的市场与沙特阿拉伯王国紧密联系起来。"
 SAU_west_joint_training: "美沙联合训练"
 SAU_west_joint_training_desc: "与美国教官进行联合演习，以提高沙特阿拉伯联合兵种训练水平，并为整个武装部队提供经验。"
 SAU_west_petrodollar: "石油美元回收"
 SAU_west_petrodollar_desc: "沙特石油收入被重新投入美国国债和美沙合资企业。沙特王国前期收益减少，但华盛顿却因此变得更加富有，也更加忠于沙特王室。"
 SAU_yemen_old_weapons: "舰船剩余武器"
 SAU_yemen_old_weapons_desc: "以最低的国内成本，将沙特阿拉伯军火库中过时的步兵武器运送给也门政府。"
 SAU_yemen_raise_brigade: "协调进攻"
 SAU_yemen_raise_brigade_desc: "将沙特军官安插到也门指挥部，制定协同进攻计划。政府军将在对​​胡塞武装的进攻中取得持久优势。"
 SAU_yemen_war_funds: "为战争提供资金"
 SAU_yemen_war_funds_desc: "向亚丁汇款，用于支付工资、购买燃料，并让政府军士兵继续在前线作战一段时间。"
 YEM_drop_south_yemen_name: "重拾也门之名"
 YEM_drop_south_yemen_name_desc: "摒弃南也门身份，再次以也门的名义进行统治。"
 yemen_partition_category: "两个也门"
 SAU_events.1.a: "愿真主怜悯他的灵魂。"
 SAU_events.1.d: "两圣地监护人法赫德·本·阿卜杜勒-阿齐兹·阿勒沙特国王在1995年中风后健康状况持续恶化多年，最终逝世。近十年来实际统治沙特王国的王储阿卜杜拉将继承王位，正式成为国王。困扰沙特王国多年的继承危机终于得以解决。"
 SAU_events.1.t: "法赫德国王逝世"
 SAU_events.10.a: "加入欧佩克+。"
 SAU_events.10.b: "拒绝该协议。"
 SAU_events.10.d: "利雅得提议与莫斯科在欧佩克+框架下协调石油产量，这将使这两个出口国对全球油价拥有更大的影响力。"
 SAU_events.10.t: "[SAU.GetFlag] 欧佩克+协议 [SOV.GetFlag]"
 SAU_events.100.a: "该地区屏息凝神"
 SAU_events.100.d: "伊朗向分离出来的阿拉伯共和国宣战，使海湾地区陷入什叶派两大势力中心之间的公开冲突。"
 SAU_events.100.t: "海湾战争"
 SAU_events.101.a: "我们将坚持下去"
 SAU_events.101.d: "德黑兰方面并未诉诸战争，但其怒火显而易见。伊朗特工在我们的城市煽动骚乱，伊朗媒体则将共和国污蔑为异端国家。"
 SAU_events.101.t: "德黑兰沸腾"
 SAU_events.102.a: "与海湾君主国和解"
 SAU_events.102.b: "拥护阿拉伯民主事业"
 SAU_events.102.d: "随着议会就位，共和国步入正轨，阿拉伯在世界上的地位问题再也无法回避。它会与海湾君主国媾和，还是会引领阿拉伯民主事业？"
 SAU_events.102.t: "共和国和地区"
 SAU_events.103.a: "加入联盟"
 SAU_events.103.b: "保持独立"
 SAU_events.103.d: "阿拉伯共和国邀请我国加入阿拉伯民主国家联盟，该联盟对人民负责，而不是对国王或神职人员负责。"
 SAU_events.103.t: "致民主国家的呼吁"
 SAU_events.104.a: "阿拉伯世界的新篇章"
 SAU_events.104.d: "长达数十年的君主专制统治已经结束。随着人群涌上利雅得街头，过渡国民委员会已经掌握了国家政权，誓言只执政到阿拉伯国家通过选票选择自己的未来为止。"
 SAU_events.104.t: "沙特王室倒台"
 SAU_events.107.a: "宣布成立阿拉伯共和国"
 SAU_events.107.b: "保卫阿拉伯共和国"
 SAU_events.107.d: "复兴党掌控着国家政权。阿拉伯半岛应该宣布自己为阿拉伯共和国，成为阿拉伯民族的先锋，还是继续沿用“阿拉伯共和国”这个谦逊的名称？"
 SAU_events.107.t: "共和国的名称"
 SAU_events.109.a: "加入阿拉伯共产国际"
 SAU_events.109.b: "我们将独自前行"
 SAU_events.109.d: "[FROM.GetName]邀请我们加入阿拉伯共产国际，这是一个由工人国家组成的联盟，这些国家因革命事业而团结在一起。我们可以加入我们的同志，也可以坚持走自己的路。"
 SAU_events.109.t: "致阿拉伯共产国际的呼吁"
 SAU_events.11.a: "接受这个条件。"
 SAU_events.11.b: "拒绝提议"
 SAU_events.11.d: "利雅得向华盛顿提出一项长期有效的交易：以更紧密的安全合作换取沙特石油稳定供应美国市场。沙特王国正在等待答复。"
 SAU_events.11.t: "[SAU.GetFlag]石油换安全"
 SAU_events.110.a: "昂贵的教训"
 SAU_events.110.d: "叙利亚自由军已被粉碎。我们武装和资助的叛军或四散逃亡，或命丧黄泉，而大马士革依然屹立不倒。多年来投入叙利亚的财富与信誉，换来的只是王国的耻辱性失败，以及以往更加依赖德黑兰的叙利亚政权。"
 SAU_events.110.t: "叙利亚局势崩溃"
 SAU_events.111.a: "接受停火"
 SAU_events.111.b: "战争继续"
 SAU_events.111.d: "利雅得提出了停火条件。王国将停止空袭行动并结束直接敌对状态，让萨那政府自行作战。"
 SAU_events.111.t: "沙特的停火提议"
 SAU_events.112.a: "战斗暂停"
 SAU_events.112.d: "萨那已同意停火。果断风暴行动逐渐收尾，王国从也门前线撤出。只要我们愿意，停火就会维持下去。"
 SAU_events.112.t: "胡塞武装接受"
 SAU_events.113.a: "那就这样吧"
 SAU_events.113.d: "萨那方面断然拒绝了我们的条件。也门的战事仍在持续，果断风暴行动仍在持续。"
 SAU_events.113.t: "胡塞武装拒绝"
 SAU_events.114.a: "那就继续打"
 SAU_events.114.d: "停战结束了。胡塞武装在得到武器和信心后，撕毁了停火协议并恢复攻击。无论王国是否愿意，也门战争都再度开启。"
 SAU_events.114.t: "胡塞武装打破停火"
 SAU_events.115.a: "拥立他为王吧。他已等得够久了。"
 SAU_events.115.b: "时机未到，让他做太子吧。"
 SAU_events.115.d_mbn: "命令依然有效。穆罕默德·本·纳伊夫仍是王储，他的继承权得到国王确认，公众亦无异议。那位年轻人退回到他的官僚机构中，暂时在权谋中落败 - 而王国终于得以喘息。"
 SAU_events.115.d_mbs: "事情已经办妥。穆罕默德·本·纳伊夫被解除职务，并在镜头前亲吻了取代他的年轻人的手。穆罕默德·本·萨勒曼成为王储，继承顺序跳过了一代人。年长王子们一言不发。沉默本身就是一种回答。"
 SAU_events.115.t: "王储已定"
 SAU_events.116.a: "愿他统治长久"
 SAU_events.116.d_mbn: "萨勒曼国王已逝，王储如命中注定般继位。穆罕默德·本·纳伊夫在安全部门的支持下登上王位，他因维系王国稳定而声名卓著。"
 SAU_events.116.d_mbs: "萨勒曼国王已逝，王位传于其子。穆罕默德·本·萨勒曼在大多数前任仍在等待接受部门职位的年纪，就已大权独揽统治王国。那些曾质疑他的人早已被退休、逮捕或和解。"
 SAU_events.116.t: "利雅得的新王"
 SAU_events.117.a: "让他们回家"
 SAU_events.117.b: "归化有用者"
 SAU_events.117.d: "九百万外籍劳工支撑着沙特阿拉伯王国的经济。他们铺设管道、在医院工作、驾驶卡车、参与建设 - 但他们并非，也永远不会成为费萨尔派想要重建的那个国家的一份子。他们是需要拆除的脚手架还是赖以建立的基石？议会无法就此议题达成一致。"
 SAU_events.117.t: "外籍劳动力问题"
 SAU_events.118.a: "退出这些机构"
 SAU_events.118.b: "从内部瓦解他们"
 SAU_events.118.d: "联合国、国际货币基金组织和世界银行都是在未征得王国同意的情况下建立的。退出将使利雅得摆脱这些它并未参与制定的机构，但也会让它沦为被议论的对象，而非被倾听的声音。协商会议必须在疏离与影响力之间做出抉择。"
 SAU_events.118.t: "国际论坛问题"
 SAU_events.119.a: "全部转回国内"
 SAU_events.119.b: "让它们生利息"
 SAU_events.119.d: "数千亿资金存放于西方国家的国库和银行中，安全且有利可图，但易受外国压力影响。将财富带回国内可为王国的发展提供资金；留在国外则可保留其收益以及利雅得在西方各国首都的影响力。"
 SAU_events.119.t: "外国财富问题"
 SAU_events.12.a: "接受合作"
 SAU_events.12.b: "拒绝提议"
 SAU_events.12.d: "沙特阿拉伯提议与英国建立长期伙伴关系。石油收入将用于支付英国工业和专业技术，重振阿尔-亚玛玛协议的精神。"
 SAU_events.12.t: "[SAU.GetFlag]沙英合作关系"
 SAU_events.120.a: "清真寺是责任而非命令"
 SAU_events.120.b: "我们代表虔信徒发声"
 SAU_events.120.d: "超过十亿穆斯林并无统一的政治声音。王国守护着麦加与麦地那，乌里玛们不禁追问：这份托付究竟是沉默的责任，还是公开领导乌玛的使命。"
 SAU_events.120.t: "全球穆斯林共同体问题"
 SAU_events.121.a: "自力更生"
 SAU_events.121.b: "武装中立"
 SAU_events.121.d: "两大阵营都深信不可将我国拱手让人。利雅得或可继续保持武装，保持等距，向双方购买武器却不属于任何一方，或者承担自建武器工业的代价，不依赖任何外国军火库。"
 SAU_events.121.t: "超级大国参与问题"
 SAU_events.122.a: "无条件援助"
 SAU_events.122.b: "有条件援助"
 SAU_events.122.d: "沙特的钱渗透到穆斯林世界的每一个角落：清真寺、诊所、政府还有军队。费萨尔把它当作施舍，不求任何书面回报；他的继承者们则认为，不附带条件的援助换不来持久的影响力。王国必须在慈善与筹码之间做出抉择。"
 SAU_events.122.t: "主权援助问题"
 SAU_events.123.a: "打击外国势力，让他们滚回家"
 SAU_events.123.a_tt: "剥夺每个外国势力在王国的军事通行权"
 SAU_events.123.b: "维持这一安排。必要时，原则也得让步"
 SAU_events.123.d: "外国旗帜仍飘扬在沙特土地上，年复一年，那些布道辞愈发难以回应。驻军一方面保障王国免受邻国侵扰，另一方面却又在同时间令其在自家教士面前蒙羞。议会已再无办法推迟这一决定。"
 SAU_events.123.t: "外国基地问题"
 SAU_events.124.a: "由布道坛宣布"
 SAU_events.124.b: "由宫室宣布"
 SAU_events.124.d: "1964年，费萨尔从其兄长手中夺取王位时，手中握有一道教法裁决，而大臣会议早已在他之下重组完毕 - 清真寺与国家机器在同一周内同时行动。沙特已将这个王国挥霍到濒临破产的边缘；费萨尔的回应是推行一场无人要求的紧缩政策和一项无人投票通过的十点计划。\n\n这项计划即将被复兴。唯一剩下的问题是，它将打着谁的名义复兴 - 教士们眼里那是一位与他们共同统治的国王，而政府眼里那是一位亲自治国的国王。"
 SAU_events.124.t: "费萨尔复兴"
 SAU_events.125.a: "买断他们的特许"
 SAU_events.125.b: "直接替换掉他们"
 SAU_events.125.d: "阿卜杜勒阿齐兹通过联姻和津贴将半岛维系在一起，并让他的儿子们治理各行省，而这些行省实际上几乎就是他们自己的领地。费萨尔花了十一年时间才将这些地方从这种安排中剥离出来，但始终未能彻底完成。\n\n这些特许状可以用国库会感到肉痛的代价赎回，也可以直接撤销 - 这样做更便宜，但会在家族内部树敌，而这些敌人会比做出这一决定的国王活得更久。"
 SAU_events.125.t: "省级酋长国的集中化"
 SAU_events.126.a: "给他们法院"
 SAU_events.126.b: "给他们学校"
 SAU_events.126.d: "费萨尔在学者的簇拥下统治，并为此分期付出了代价。1965年他把电视带进王国时，自己的侄子死于袭击利雅得电视台的行动；十年后，其侄的兄弟走进一间议事厅，开枪打死了国王。与乌里玛的联盟从来不是装饰，也从来不免费。\n\n如今回馈给他们什么，将决定这是怎样的王国。法院将使他们成为法律的仲裁者。学校将使他们成为下一代的塑造者。"
 SAU_events.126.t: "提升乌里玛的权威"
 SAU_events.127.a: "放逐他们"
 SAU_events.127.b: "再教育他们"
 SAU_events.127.d: "费萨尔亲手打造的技术官僚体系，把沙特人送往开罗、伦敦和加利福尼亚，等他们学成归国便委以各部大臣之职。扎基·亚马尼怀揣哈佛学位执掌石油事务，做得比王国本土能培养出的任何人都出色。这实在是莫大的讽刺。\n\n但这些人的归来带来的不只是资历，议会如今争论不休：答案究竟是机场还是课堂。"
 SAU_events.127.t: "清除西化精英"
 SAU_events.128.a: "用考试任命"
 SAU_events.128.b: "按忠诚任命"
 SAU_events.128.d: "在费萨尔之前，几乎谈不上有什么国家机构。王国的财政由国王自己的家臣和少数受信任的商人掌管，国库与王室私囊之间的界限全凭各人看法。他在原本只有侍从的地方建立了政府部门。\n\n新官僚机构究竟为何而设，从未有定论。通过考试选拔的官员会有能力，但不会心怀感激。通过忠诚选拔的官员则相反。"
 SAU_events.128.t: "主权公务员"
 SAU_events.129.a: "让他们以强力巡逻"
 SAU_events.129.b: "保持建议性质"
 SAU_events.129.d: "道德促进与恶行防范委员会原本只是分散在各地的地方执法者，直到国家给了它预算、制服和指挥体系。费萨尔需要神职人员接受电视、女子学校以及外国工程师走在达兰街头，而该委员会就是他的让步之一。\n\n它从来不完全是一支警察力量，也从来不完全不是。"
 SAU_events.129.t: "美德委员会回归"
 SAU_events.13.a: "接受投资协定。"
 SAU_events.13.d: "抛开旧日猜忌，利雅得向巴黎提出了一项全面投资协议：沙特资本注入法国工业，法国专长助力王国。两国政府都将从中获益。"
 SAU_events.13.t: "[SAU.GetFlag]沙法投资协定"
 SAU_events.130.a: "干扰"
 SAU_events.130.b: "收买"
 SAU_events.130.d: "费萨尔的第一场媒体战，对手是纳赛尔的“阿拉伯之声”，该电台向沙特军营广播，告诉沙特士兵他们的国王是美国的仆人。利雅得用自己的电台予以回击，并在贝鲁特和开罗悄悄给编辑们送上了大笔金钱。\n\n这一事件带来的教训是：广播是无法与之争辩的。只能被干扰，或者被收买。"
 SAU_events.130.t: "禁止外国媒体"
 SAU_events.131.a: "保持显贵主导"
 SAU_events.131.b: "扩大成员范围"
 SAU_events.131.d: "1962年的十点纲领向王国承诺设立协商会议。费萨尔又统治了十三年，从未召集过协商会议，最终由法赫德在1992年才终于让其就位 - 迟了三十年，而且是任命而非选举产生的。\n\n这一承诺再次被提出，而组成方式正是争论的全部焦点。显贵们想把它变成宫廷的延伸。更广泛的成员构成则会使其成为宫廷无法完全预测的东西。"
 SAU_events.131.t: "协商会议重组"
 SAU_events.132.a: "技术机构"
 SAU_events.132.b: "军事学院"
 SAU_events.132.d: "沙特的繁荣是由他人的双手建造的 - 也门劳工、埃及教师、巴勒斯坦职员，以及后来来自南亚的百万余人。费萨尔的答案是半岛从未尝试过的大规模教育：阿卜杜勒阿齐兹国王大学于1967年开办，奖学金项目将数千人送往海外，王国着手培养自己的中产阶级。\n\n而议会正要决定培养这个阶级是为了什么。"
 SAU_events.132.t: "国家干部计划"
 SAU_events.133.a: "彻底封锁。"
 SAU_events.133.b: "接纳我们所需之人。"
 SAU_events.133.d: "到1970年代，外籍劳动力已接近境内总人口的三分之一，而维持灯火通明的大部分工作都由他们承担。费萨尔接纳了这些劳动力，却担心随之而来的政治问题 - 巴勒斯坦人带来了复国事业，也门人带来了汹涌人潮，埃及人带来了纳赛尔。\n\n封锁边境将把国家归还给自身，却也会给各部委带来一场他们毫无应对方案的劳动力短缺。"
 SAU_events.133.t: "封闭的边境"
 SAU_events.134.a: "重视外部"
 SAU_events.134.b: "重视内部"
 SAU_events.134.d: "费萨尔的王国四面环敌，皆欲除之而后快：红海对岸是纳赛尔的埃及，萨那是共和派，巴格达和大马士革是复兴党，而苏联则早已将沙特家族视为行将就木的遗骸。他组建国民警卫队以防政变，购买美国战机以御入侵，却始终无法确定哪一种威胁会先降临。\n\n如今，王国必须决定它究竟在为哪种威胁做准备。"
 SAU_events.134.t: "堡垒王国"
 SAU_events.135.a: "在麦加召开会议。"
 SAU_events.135.b: "在国外召开会议。"
 SAU_events.135.d: "在1969年8月阿克萨清真寺被焚毁后，费萨尔在数周内便将穆斯林世界的首脑们召集到拉巴特，伊斯兰会议组织也在当年年底前成立。这是对纳赛尔阿拉伯联盟的回应 - 组织不是阿拉伯的和世俗的，而是穆斯林的、以麦加为领导的。\n\n王国在何处召集信众这本身就是一种宣示。圣城所赋予的合法性是任何海外会议厅都无法给予的。"
 SAU_events.135.t: "伊斯兰团结会议"
 SAU_events.136.a: "公开威胁禁运"
 SAU_events.136.b: "悄悄实施"
 SAU_events.136.d: "在1973年10月17日，费萨尔削减了石油产量并关闭了对美国的输油阀门。短短一个季节内，每桶石油的价格从三美元飙升至近十二美元，西方世界真切地意识到了他们舒适生活的代价，而王国则发现自己手中握着一件从未想过要动用的武器。\n\n自此以后，这件武器再未被启用。而石油部始终保持着最新数据。"
 SAU_events.136.t: "73年精神"
 SAU_events.137.a: "武器优先"
 SAU_events.137.b: "其他事项优先"
 SAU_events.137.d: "王国开采石油，销往海外，再买回所需的一切 - 包括输送石油的管道。费萨尔的五年计划本意是打破这个循环，并且在很大程度上成功建起了能让石油更快流动的东西。\n\n替代必须从某处开始，而从何处开始决定了王国能在未经任何人许可的情况下做些什么。"
 SAU_events.137.t: "消除对外依赖"
 SAU_events.138.a: "提供资金"
 SAU_events.138.b: "配备人员"
 SAU_events.138.d: "费萨尔于1962年在麦加创立了穆斯林世界联盟，并在七年后推动伊斯兰会议组织诞生。两者都设在沙特资金能够触及的地方，且都是为了回应没有国王容身之地的泛阿拉伯主义而建立的。\n\n他的继任者一直持续买单，却逐渐不再制定议程。金钱换来的是顺从;官员换来的是控制。这两者并不相同。"
 SAU_events.138.t: "重夺伊斯兰合作组织领导权"
 SAU_events.139.a: "严格配额"
 SAU_events.139.b: "分阶段配额"
 SAU_events.139.d: "沙特阿美石油公司被迫在沙特已有产业的地方购买沙特产品，而在沙特尚无相关产业的地方，王国则出资聘请外国公司建厂生产。这个过程缓慢、昂贵，但至今仍是一个连钻头都要进口的国家停止进口的唯一途径。\n\n沙特底线定得有多硬，决定了各部委是照章执行，还是干脆学会申请豁免。"
 SAU_events.139.t: "国内供应配额"
 SAU_events.14.a: "接受投资"
 SAU_events.14.b: "拒绝提议"
 SAU_events.14.d: "沙特阿拉伯提出投资我们的工业以换取更深入的经济联系。接受将带来新工厂和沙特的影响力。"
 SAU_events.14.t: "[SAU.GetFlag]对北大西洋公约组织国家的投资"
 SAU_events.140.a: "让他跟随费萨尔，卫队会负责处理"
 SAU_events.140.b: "费萨尔的王国随费萨尔一同逝去，让它安息吧"
 SAU_events.140.d: "法赫德已经下葬，阿卜杜拉在十年以他人之名执政之后，终于名正言顺地成为国王。继承之门已经敞开，王储们谋算已久。\n\n国王之子带着一个论点而非主张来到他面前。米特卜指挥着部落征召兵和内陆人组建的国民警卫队，这支部队的组建缘由恰恰就是因为正规军不受王座信赖。他一直在研读费萨尔的治国之道：紧缩、自力更生、一个为乌玛发声而不向华盛顿乞求的王国。以此道统治的叔父最终被自己的侄子枪杀，房间里的每个人都清楚这一点。\n\n费萨尔的纲领没有继承人。现在米特卜请求成为继承他的衣钵。"
 SAU_events.140.t: "费萨尔主义复兴"
 SAU_events.141.a: "让市场自行探底"
 SAU_events.141.b: "国家会买入的 我们不能让这件事变成政治问题"
 SAU_events.141.d: "在2月25日，沙特证券交易所全股指数收于20634点，随后便停止了攀升。自那以后，它从未停止下跌。\n\n这不是银行和机构的崩溃。这个王国接近一半的成年人口都在那个市场里 - 教师、司机、士兵、公务员 - 其中许多人持有的股票是用借来的钱购买的，其价格是任何盈利都无法支撑的。购物中心里开设了经纪交易大厅。女性在一个个分隔的房间中进行交易。两年来，这是全国性的消遣。\n\n当指数触底时，它将损失接近三分之二的价值，以及随之蒸发的数千亿里亚尔家庭储蓄。资本市场管理局成立已有三年却从未见过这样的情况。委员会必须决定，是国家接住这把下落的刀，还是让市场继续它正在进行的教训。"
 SAU_events.141.t: "黑色二月"
 SAU_events.142.a: "削减产量，捍卫油价"
 SAU_events.142.b: "保持输出，让高成本产油国先垮掉"
 SAU_events.142.d: "每桶的价格正在下跌且毫无止住的迹象。预算是基于已不复成立的假设编制的，每个部门即将发现哪些项目还负担得起，哪些不过是勉强凑钱维持的。\n利雅得曾经经历过这一切。20世纪80年代初，它削减自身产量以支撑油价，却眼看着其他所有产油国悄悄填补它留下的缺口大肆销售，结果沙特产量下降约四分之三，油价最终还是崩盘了。这一教训代价高昂但至今在部内仍有争议。\n沙特王国拥有地球上开采成本最低的石油。这是它唯一真正的优势，而这一优势可以用来为所有人捍卫油价，也可以用来耗死那些无法以当前价格维持销售的产油国。"
 SAU_events.142.t: "油价崩溃"
 SAU_events.143.a: "昂贵的学费，惨痛的教训"
 SAU_events.143.d: "沙特证券交易所已在数月之内损失了大部分市值，抹去了数千亿里亚尔的家庭财富。不同寻常的是，对于如此规模的市场而言，损失几乎全部落在普通沙特人而非机构身上 - 教师、司机和公务员，他们在最高点买入，其中许多人还是靠信贷。海外分析人士指出，这个全球最大的石油出口国刚刚发现，自己也拥有一个散户投资者阶层，却完全不知道该如何应对。"
 SAU_events.143.t: "沙特证券交易所崩盘"
 SAU_events.144.a: "一如既往，产量决定一切"
 SAU_events.144.d: "原油价格已经跌穿了分析师们画出的所有底线。出口国正在重写那些建立在如今显然一文不值的假设之上的预算，而进口国则在享受一笔他们小心翼翼不敢过于张扬的意外之财。所有人的目光都集中在利雅得，那里拥有地球上最便宜的石油，因此也掌握着唯一真正重要的决定：减产以替所有人撑住价格，还是继续增产，看看谁先撑不住。"
 SAU_events.144.t: "石油价格暴跌"
 SAU_events.145.a: "偏袒卫队。它才是我们的守卫"
 SAU_events.145.b: "平等削减开支"
 SAU_events.145.d: "储备正在耗尽，预算无法平衡。补贴首先被削减，随后是资本项目，如今财政部已把目光投向防务开支。\n\n困难在于，王国并不只有一支军队。它有国防部管辖下的正规军，还有国民警卫队 - 从内陆忠诚的部落中招募，驻扎在利雅得和油田周围，直接对王座负责。国民警卫队之所以存在，是因为阿卜杜勒阿齐兹的儿子们不信任正规军，而自那以后，它便一直得到相应的优厚待遇。\n\n削减可以同时落在两者身上，也可以保护国民警卫队，让正规军官们将就度日。其中一种选择能让王座在今年安全。另一种则能让它在十年后依然安全。\n\n§H军官团§!：[ROOT.GetSAUArmyGrievance]（§Y[?SAU_army_grievance|0]§!/§Y100§!）\n[ROOT.GetSAUArmyGrievanceEffect]"
 SAU_events.145.t: "不公平的开支削减"
 SAU_events.146.a: "派出卫队。清空街道"
 SAU_events.146.b: "没人出动。钱和安宁最重要"
 SAU_events.146.d: "紧缩政策已触及街头。卡提夫和达曼出现了人群，利雅得也有较小规模的人群 - 而政府坚称那根本算不上人群。\n\n国民警卫队一如既往，准备好充当应对此事的趁手工具，这正是其全部使命。卫队已准备就绪、资金充足、且愿意出动。正规军官团未被征询，他们正小心翼翼地观望。\n\n国防部的每一位上校都明白，如果卫队被派出，而他们自己的部队却因欠薪而困居军营，意味着什么。这意味着王座已公开、永久地决定了自己信任哪一支军队。\n\n§H军官团§!：[ROOT.GetSAUArmyGrievance]（§Y[?SAU_army_grievance|0]§!/§Y100§!）\n[ROOT.GetSAUArmyGrievanceEffect]"
 SAU_events.146.t: "部署命令"
 SAU_events.147.a: "向利雅得推进。卫队来不及反应"
 SAU_events.147.b: "不管这些。我们是军人，不是政客"
 SAU_events.147.d: "事情就如此确定。国民警卫队得到薪饷与信任；正规军两者皆无。那些驾驶战机、指挥装甲、戍守边境的人，已经被告知 - 尽管无人明说 - 他们不过是自己国家里的二等军队。\n\n接下来会发生什么早有先例。1969年，一群空军和陆军军官——纳赛尔主义者、汉志人，厌倦了家族统治—— - 可信赖，于是不断增强国民警卫队，却从未追问那些军官当初为何要这么做。\n\n参谋们已经开了数周会议。而议题并非预算。\n\n§H军官团§!：[ROOT.GetSAUArmyGrievance]（§Y[?SAU_army_grievance|0]§!/§Y100§!）\n[ROOT.GetSAUArmyGrievanceEffect]"
 SAU_events.147.t: "军官们的抉择"
 SAU_events.148.a: "王国的新政府"
 SAU_events.148.d: "沙特正规军部队在黎明前进入利雅得，控制了各部委、广播机构和通往王宫的道路。国民警卫队营区在同一时间被包围，且未进行抵抗。一个最高军事委员会已宣布，它正在恢复公共秩序，王位的宪法地位保持不变 - 观察人士指出，这一措辞可以有多种解读。\n\n阿美公司报告称拉斯塔努拉港装运正常。这是整份电文中，石油市场唯一在阅读的一句话。"
 SAU_events.148.t: "坦克横行利雅得街头"
 SAU_events.149.a: "宣告成立阿拉伯社会主义共和国"
 SAU_events.149.b: "宣告成立伊斯兰共和国"
 SAU_events.149.c: "宣告成立宪政共和国"
 SAU_events.149.d: "王座已被终结。委员会掌控了政府、广播机构和利雅得每一座宫殿的通路，而他们也发现了每一个军政府都会发现的事：夺取一个国家只需一夜，治理一个国家却需要一个名号。\n必须宣布共和，而且必须宣布共和的体制。房间里的军官们对此意见不一。有些人曾与伊拉克人和叙利亚人并肩作战，回国后倾慕复兴党 - 一个阿拉伯民族、一个政党、军队为其脊梁。另一些人指向东部的卡提夫和东部省，主张王国历来压制的宪政才是共和国所需要的。一个较年轻的派系 - 被送往国外留学的那批人 - 想要一部宪法、一个议会，以及“共和国”这个词在所有其他地方所意味的一切。还有少数人，比其他人更为沉默，一直在阅读那些“马巴赫特”组织当年会因此逮捕他们的东西。\n无论今晚宣告什么，它都将在没有任何人民授权的前提下以沙特人民的名义宣告。"
 SAU_events.149.e: "宣告成立人民共和国"
 SAU_events.149.t: "共和国"
 SAU_events.15.a: "接受海军合作"
 SAU_events.15.b: "拒绝提议"
 SAU_events.15.d: "利雅得向马德里提出了一项海军合作提议：西班牙船厂将为沙特皇家海军建造舰艇，而沙特资金将流入西班牙工业。"
 SAU_events.15.t: "[SAU.GetFlag]沙特-西班牙伙伴关系"
 SAU_events.150.a: "吸收他们，进行改编"
 SAU_events.150.b: "彻底解散卫队，让他们回家"
 SAU_events.150.c: "将之缩编，置于我们的指挥之下"
 SAU_events.150.d: "卫队拥有七万五千从内志的部落中招募而来的卫队士兵，因为阿卜杜勒阿齐兹的儿子们不信任一支职业军队，而他们的装备之精良，足以让任何职业军队在进军利雅得之前必须先与他们交战。他们在政变之夜被包围在军营中，却一枪未发。如今，委员会必须决定如何处置他们。\n\n他们并非敌军。对峙双方是表亲与邻居，而他们每一个士兵都隶属于一个对国家有索取权的部落。解散他们，委员会将省下大笔金钱，却会在内陆树敌无数。吸收他们，委员会将人力翻倍，却要吞下七万五千名直到上周还明确效忠于他人的士兵。"
 SAU_events.150.t: "卫队解散"
 SAU_events.151.a: "他们要么服从国家，要么无人可依"
 SAU_events.151.b: "恢复津贴，一分钱都不少"
 SAU_events.151.d: "津贴随着国民警卫队的停摆而中断了。在内陆，这并未被解读为一项预算措施 - 付给内志和沙马尔部落的款项比王国本身还要古老，它们是阿卜杜勒阿齐兹拼凑起这个王国的安排，而且从未中断过一次。\n\n酋长们并未反叛。他们只是不再回应 - 而在这样一个幅员辽阔的国家里，不予回应就已经约等于反叛。"
 SAU_events.151.t: "部落的回应"
 SAU_events.152.a: "逮捕他们。所有人，就在今晚"
 SAU_events.152.b: "让他们进来。扩大委员会，分担责任"
 SAU_events.152.d: "一个发不出军饷、无法治理、也无法自圆其说的委员会，连自己的上校们也开始离心离德。会议又开起来了 - 同样的房间，同样的军衔，同样在上一场政变前出现过的那种字斟句酌的措辞。\n\n拿下利雅得的人清楚地知道这是怎么做到的，因为他们亲手做过。这就是靠政变统治的难处：你已经把方法公之于众了。"
 SAU_events.152.t: "军官们的转向"
 SAU_events.153.a: "好死不如赖活着"
 SAU_events.153.d: "津贴恢复了，法庭悄然收场，协商会议的召开日期也已公布，而所有人都明白，这个会议将是任命而非选举产生。这算不上什么大事。但足以让那些一直在计算委员会剩余日子的人不再大声倒数了。\n\n国库少了一笔无人会公布的款项，而拿下利雅得的军官们也已获得了他们当初为此而战所求的回报。"
 SAU_events.153.t: "委员会花钱挽回局势"
 SAU_events.154.a: "那就战场上见分晓吧"
 SAU_events.154.d: "九十天过去了，议会却一言不发。哈伊勒的驻军今早宣布效忠国王，东部省中午便紧随其后，而卫队过去赖以征召的部落兵已不再伪装。\n\n一夜之间政变上位的军队如今成了独行者，而它正发现完全靠武力维系国家所需的武力远超任何人的预算。"
 SAU_events.154.t: "王国分裂"
 SAU_events.155.a: "全世界都在注视着东部省"
 SAU_events.155.d: "据报道，沙特内陆各地爆发了效忠于最高军事委员会的部队与宣布支持沙特王室的编队之间的战斗。石油产区东部省已成争夺焦点。布伦特原油开盘即上涨十一美元，且涨势未止。\n\n各个与利雅得建交的国家都在发表同样的克制声明，而每一个都在私下观望局势。"
 SAU_events.155.t: "利雅得：沙特内战"
 SAU_events.156.a: "保留阿卜杜拉，王位值得我们付出一点代价"
 SAU_events.156.b: "立一位理解我们安排的国王"
 SAU_events.156.d: "委员会正论功行赏，这就引出了一个它一直小心翼翼地避而不谈的问题。国王还在。\n\n阿卜杜拉年事已高，个人生活简朴 - 这一点向来合国民心意 - 而且在委员会解散国民警卫队之前，他统率了这支部队四十年。这意味着拿下利雅得的军人们正在纠结：是否要留下那个刚刚他们剥夺军权的人。支持他的理由：王国上下无人质疑他的合法性，而这比好几个师还值钱。\n\n反对他的理由：他天性就不是当傀儡的人。留下他，就意味着要在实际上和场面上把委员会夺走的部分权力还回去。另一种选择是找一个明白这套安排方向恰恰相反的亲王。"
 SAU_events.156.t: "王位问题"
 SAU_events.157.a: "萨勒曼·本·阿卜杜勒阿齐兹"
 SAU_events.157.b: "穆罕默德·本·纳伊夫"
 SAU_events.157.c: "穆塔伊卜·本·阿卜杜拉"
 SAU_events.157.d: "阿卜杜拉国王已退位，最高军事委员会必须从沙特王室的年长亲王中选出一位继承人。\n\n每位候选人都代表着不同的势力集团 - 苏德里集团、安全部门、内陆部落以及家族中的年轻一代。委员会的选择将决定王国中哪一部分会首先承认新的现状，而哪一部分则需要被说服。"
 SAU_events.157.e: "穆罕默德·本·萨勒曼"
 SAU_events.157.t: "一个更称职的国王"
 SAU_events.158.a: "现役军官。§H+5控制，-5正统§!"
 SAU_events.158.b: "沙特王室的一位王子。§H-5控制，+5正统§!"
 SAU_events.158.c: "一位地方显贵。§H+2控制，+2正统§!"
 SAU_events.158.d: "席位空缺，议会必须填补。三人获得提名，各能带给议会不同的东西。\n\n军官会服从命令，但心怀怨恨。王子会认可治理，但无人关心。地方显要则两者皆非，这既是有用之处，也是危险之处。"
 SAU_events.158.t: "[SAU_governor_province.GetName]的议席"
 SAU_events.159.a: "受限摄政，保留王位和清真寺治权"
 SAU_events.159.b: "完全摄政，包揽所有权力"
 SAU_events.159.c: "五年摄政期。定个日期。"
 SAU_events.159.d: "这份文件很短。它记录了国王陛下因身体不适，将行政权力和国防事务委托给一个以他名义行事的委员会，并在其中一段文字下方有他的签名，而他没有机会对此进行修改。\n\n现在尚待解决的问题是，这项法令究竟会剥夺国王多少权利。如果一项摄政法令能保留国王的清真寺、头衔和礼仪，那么国家还能接受；而如果一项法令剥夺国王的一切权利，那也只是事实的文字记录而已。律师们无需询问便指出，一份注明日期的法令比一份没有日期的法令更容易签署。\n\n没有宪法可供中止。这向来是这个王国的便利之处。"
 SAU_events.159.t: "摄政法令"
 SAU_events.16.a: "扩大防空保护范围。"
 SAU_events.16.b: "拒绝请求"
 SAU_events.16.d: "沙特阿拉伯王国请求华盛顿扩大其防空保护范围。爱国者导弹系统将环绕沙特城市和油田，费用由利雅得全额承担。"
 SAU_events.16.t: "[SAU.GetFlag]美国之盾"
 SAU_events.160.a: "全套机制：宵禁、法庭、审查员。"
 SAU_events.160.b: "仅限紧急状态。请勿扰乱街道秩序。"
 SAU_events.160.d: "今天上午，集会、各省之间的交通以及印刷厂的运作均由军方控制。议会律师指出，王国从未有过一部需要中止的宪法，这省去了大量的起草工作。\n\n问题在于，这种做法会持续多久。宵禁、法庭和审查制度会让国家陷入停滞，并被后世铭记。而没有宵禁的紧急权力则影响较小，也更容易被人们遗忘。"
 SAU_events.160.t: "戒严令"
 SAU_events.161.a: "法令规定五年，五年过去了。"
 SAU_events.161.b: "这种不适症状持续存在，而且没有明确的恢复时间。"
 SAU_events.161.d: "五年前，委员会给自己设定了一个权力终止的日期，而那些曾为委员会提供建议的律师们，在随后的几年里，都悄悄地被调离了岗位。如今，这个日期已到。王国里人人都知道，这个日期已经到了。\n\n遵守承诺意味着将行政权力交还给委员会耗费五年时间掏空的王座，并相信感恩之心是真实存在的。违背承诺则意味着委员会的承诺正如所有人预料的那样毫无价值，而且永远不会再有任何价值。\n\n§H信守承诺会失去议会的控制权，违背承诺则会失去一切。§!"
 SAU_events.161.t: "摄政时期结束"
 SAU_events.162.a: "授权使用这些设计。我们需要的是生产，而不是面子。"
 SAU_events.162.b: "从矿石开始，我们自己建造它。"
 SAU_events.162.d: "王国自需要武器以来就一直从国外购买武器，而如今统治王国的那些人，毕生都在等待外国的零部件，而这些零部件只有在他国议会批准后才能运抵。该法案强制要求在国内生产能够生产的东西。\n\n有两种起步方式。一是购买许可证和模具，三年内就能开工，按照别人的条款生产别人的设计产品。二是白手起家 - 从冶金技术、工程师到失败经验 - 完全掌控最终成果，但代价将是财政部未来十年都要承担的。"
 SAU_events.162.t: "国防工业法"
 SAU_events.163.a: "王子们。让全国人民看着他们为此负责。"
 SAU_events.163.b: "异见人士。文件已经写好了。"
 SAU_events.163.c: "两者兼有。我们夺取政权并非为了有所选择。"
 SAU_events.163.d: "该法庭由军方管辖，不得上诉，并行使普通法官从未被授予的管辖权。乌里玛仅就诉讼程序的形式而非判决结果被咨询过，他们对此表示关注。\n\n委员会必须决定将哪些人带到它面前接受审查。有些王子的账目经不起审计，他们的丑闻将令国家蒙羞。还有一些组织者、神职人员和签字人的档案，马巴希特已经保存了二十年之久。尝试前者既能博得民心又有利可图。尝试后者则是必要的，而且会被后人铭记。"
 SAU_events.163.t: "紧急法庭"
 SAU_events.164.a: "全民义务兵役制。所有成年男性，无一例外。"
 SAU_events.164.b: "选征兵役制。各部落保留豁免权。"
 SAU_events.164.d: "沙特王室从未强征过任何人入役。一支由值得信赖的部落成员组成的志愿兵忠诚可靠；一支由所有人组成的军队只会规模庞大，而在一个如此庞大的国家里，一支庞大的军队难免会对国家的治理方式产生各种意见。\n\n委员会本身就是上一届政府最担心的意见，这使得讨论显得有些尴尬。尽管如此，委员会还是打算承担风险——唯一的问题是，这项征税是由所有人承担，还是由委员会可以承受得罪的人承担。"
 SAU_events.164.t: "王国征召令"
 SAU_events.165.a: "那些年长的王子们。他们的名字至今仍代表着这个国家。"
 SAU_events.165.b: "被忽视的表亲们。感恩比名望更便宜。"
 SAU_events.165.c: "那些富有的不满分子。把他们带过来，以后再进行审计。"
 SAU_events.165.d: "这个家族并非一个整体，而是由成千上万拥有极不平等继承权的人组成，其中许多人一生都被掌握王位的那支家族所忽视。而议会刚刚将那支家族从继承权的格局中剔除。\n\n有些显赫的王子，光凭他的名字就能立足于某个省份。有些名不见经传的堂兄弟，会感激涕零地得到一个省份，并且牢记是谁赐予的。还有一些有钱有势却心怀不满的人，可以低价拉拢过来，之后再进行盘查。"
 SAU_events.165.t: "各省的效忠派人士"
 SAU_events.166.a: "付钱给商队。妥善收买希贾兹。"
 SAU_events.166.b: "驻守那里。他们会适应的。"
 SAU_events.166.d: "麦加省包括吉达、商贾云集之地、朝觐中心以及希贾兹地区 - 希贾兹在1925年之前曾是一个独立的王国，并且从未完全停止过提及它。在石油出现之前，希贾兹家族曾为国家提供资金，并且从未完全接受内志王朝的统治。\n\n它们可以被收买，只是很贵。或者可以部署军队驻守该省，并提醒他们朝圣之路现在要经过检查站。"
 SAU_events.166.t: "麦加省"
 SAU_events.167.a: "讨好他们。做出必须做出的让步。"
 SAU_events.167.b: "重新分配坐席。我们现在就需要措辞。"
 SAU_events.167.d: "麦地那拥有先知清真寺，以及围绕它发展了十三个世纪的学术机构。当地的法学家可以将伊斯兰教法委员会描述为社群必须接受的必然选择，也可以将其视为社群必须忍受的篡夺，而这种说法的传播范围将远超委员会发布的任何公报。\n\n可以拉拢他们，这意味着要做出让步并保持耐心。或者，可以将资深教席重新分配给那些已经同意的人，这种方法更快，而且穆斯林世界的每一位学者都会注意到。"
 SAU_events.167.t: "麦地那省"
 SAU_events.168.a: "站在国王身后。借用头衔，不要夺取。"
 SAU_events.168.b: "监护权属于国家，而不是个人。"
 SAU_events.168.d: "1986年，法赫德接受了“两圣寺监护人”的称号，放弃了“陛下”的头衔，转而拥有其他任何穆斯林统治者都无法企及的荣耀。这是沙特王室最宝贵的财富，而且不可转让。\n\n议会不能从一位在世的国王手中夺走权力。它可以支持国王行使权力，并公开表明这一点 - 这既赋予了议会合法性，也提醒世人这权力究竟属于谁。或者，议会也可以宣布监护权归国家而非个人所有，看看穆斯林世界对此作何反应。"
 SAU_events.168.t: "两座清真寺守护者"
 SAU_events.169.a: "首先从东部省委员会开始。"
 SAU_events.169.b: "将讲道稿提交审核。"
 SAU_events.169.c: "首先从请愿签名者开始。"
 SAU_events.169.d: "马巴希特无需建造任何东西。内政部的档案里按姓名和街道记录着东部省的组织者，按布道内容和日期记录着萨赫瓦传教士，还记录着2003年请愿书的签署者和2007年再次签署者。负责收集所有这些信息的部门一直非常谨慎，因为档案里的人都有在内政部任职的亲戚。而委员会里没有亲戚。"
 SAU_events.169.e: "把三份文件一起拿上"
 SAU_events.169.t: "文件解密"
 SAU_events.17.a: "我们会为此负责"
 SAU_events.17.d: "[ROOT.SAU_GetFrontName]的武装分子向边境对面发射了一连串火箭弹。警报声在我们的城镇上空回荡，家家户户仓皇寻找掩体，损失正在统计之中。"
 SAU_events.17.t: "我国城镇遭火箭弹袭击"
 SAU_events.170.a: "在公开法庭上，而且电视直播"
 SAU_events.170.b: "像以前一样，在丽兹酒店解决吧"
 SAU_events.170.c: "赦免，按现行价格"
 SAU_events.170.d: "会计们已经算完了，数字比传言还要糟糕。一事无成的官僚，从未交付的飞机上的佣金，王国十年的财政收入就这么在国库和承包商之间的某个地方消失了。我们要给国家一个交代，唯一的问题是，要有多少在镜头前，又要有多少闭门解决。"
 SAU_events.170.t: "码头上的王子"
 SAU_events.171.a: "养着他们，慷慨且永久"
 SAU_events.171.b: "流放年长者"
 SAU_events.171.c: "起诉，并没收发现的一切"
 SAU_events.171.d: "阿卜杜勒阿齐兹有记录的儿子有四十五个，王国花了七十年时间来应对他们。如今他们已有数千之众，领取津贴，把持省长之位，与从吉达到霍富夫的每一家商户联姻。他们中的任何一个人单独都不构成对议会的威胁。但他们全体合在一起就几乎可以替代政府了，不能就这么放任不管。"
 SAU_events.171.e: "让他们荣华富贵吧"
 SAU_events.171.t: "人人有宣称"
 SAU_events.172.a: "承认委员会，这是国与国的关系"
 SAU_events.172.b: "承认他们，但要一点回报"
 SAU_events.172.c: "我们不和军头打交道"
 SAU_events.172.d: "这封信很短。它指出王国的义务没有改变，生产目标将会达成，美国人员安全无虞，委员会欢迎尽早召开会议。信中未提及国王、逮捕行动或宪法。华盛顿现在必须判断自己面对的是什么：新政府，还是一群恰好坐在政府旧日位置上的军官。"
 SAU_events.172.t: "委员会致信华盛顿"
 SAU_events.173.a: "港口、铁路和北方走廊"
 SAU_events.173.b: "首都，且无任何附加条件"
 SAU_events.173.d: "中国大使在那一夜过去四天后抵达，向委员会祝贺秩序恢复，并直接切入延布吞吐量的话题。全程未提及国王、未提及逮捕行动，也未提及宪法。这是王国外交部十年来最直截了当的一次对话，在座每个人都心知肚明这笔交易卖的是什么。"
 SAU_events.173.t: "无事发生"
 SAU_events.174.a: "等利雅得与德黑兰达成协议后再接纳他们"
 SAU_events.174.b: "拒绝申请"
 SAU_events.174.c: "接纳他们，无条件"
 SAU_events.174.d: "沙特申请正式成员资格的文件送达秘书处，既无前言，也未附加任何条件，这本身就是一种表态。组织从未接纳过海湾国家，也从未拒绝过一个礼貌提出申请的创始级石油生产国。北京面临的问题不是利雅得是否有用 - 这一点多年前就已确定 - 而是接纳它是否意味着引进一场组织二十年来一直回避的争端。"
 SAU_events.174.t: "利雅得的申请"
 SAU_events.175.a: "恢复与德黑兰的谅解"
 SAU_events.175.b: "我们不需要别人来说三道四"
 SAU_events.175.d: "回复礼貌且完全明确。中国将支持该申请，主持投票并引领较小成员国赞同。作为交换，2023年在北京达成的谅解将以书面形式恢复，包括大使馆等一切。组织不希望有一个成员国在每次峰会上都与另一个成员国争论不休。利雅得被要求以签字而非石油来获取其席位。"
 SAU_events.175.t: "北京的条件"
 SAU_events.176.a: "记下，然后继续"
 SAU_events.176.d: "未给出任何理由，因为根本不需要理由。公报感谢王国的关注，指出继续对话的价值，然后便结束了。利雅得被一个曾保证来者不拒的组织拒绝了，而这将被各国看在眼里。"
 SAU_events.176.t: "申请被拒绝"
 SAU_events.177.a: "就座"
 SAU_events.177.d: "投票一致通过，这意味着在表决之前就已经内定了。王国作为正式成员加入，没有任何先决条件，没有考察期，也完全没有提及其现政府上台的方式。这种沉默就是所换来的全部。"
 SAU_events.177.t: "无条件接受"
 SAU_events.178.a: "原油依旧流动"
 SAU_events.178.d: "承认以周五下午发布的两行声明形式到来，华盛顿正是把那些不愿被人细究的事情安排在此时公布。大使于次周返回。商业关系中没有重新谈判任何内容，双方在当时及之后都不再提及过去六个月的任何事。"
 SAU_events.178.t: "照常营业"
 SAU_events.179.a: "同意条件，这就是承认的代价"
 SAU_events.179.b: "基于那些条件的承认不算承认"
 SAU_events.179.d: "华盛顿将承认委员会，并在提议中附上了一份时间表：在苏丹亲王基地扩大准入、在东部省获得预置权，以及长期飞越权。其中的逻辑并不隐晦。一个急需承认以至于主动开口索取的政府，就是一个可以为此开价的政府，而委员会先开了口。"
 SAU_events.179.t: "认可，代价高昂"
 SAU_events.18.a: "懦夫们会付出代价"
 SAU_events.18.d: "由[ROOT.SAU_GetFrontName]发起的一场协同轰炸行动摧毁了我们的城市。民众要求政府采取行动，死亡人数正在统计中。"
 SAU_events.18.t: "我国城市遭到轰炸"
 SAU_events.180.a: "那我们就自己来"
 SAU_events.180.d: "华盛顿的声明长篇大论的谈论宪政与法治，而国务院对王国半数邻国都从未说过类似的话。委员会读了这份声明，记下自己哪些军官曾在堪萨斯受训，然后把它归档。关系并未结束，只是不再被提起。"
 SAU_events.180.t: "华盛顿拒绝"
 SAU_events.181.a: "全面重申这一点。石油安全，一如既往"
 SAU_events.181.b: "石油，可以。保障，不行"
 SAU_events.181.c: "让它失效吧，本来就不是书面契约"
 SAU_events.181.d: "1945年2月，罗斯福与阿卜杜勒阿齐兹在大苦湖的一艘巡洋舰上会面，达成了一项支撑了八十年政策的安排：美国提供安全保障，沙特提供石油。两人当时没有签署任何文件，此后历届美国政府都觉得这样很方便。如今，利雅得正以正式书面形式要求得到一个答案，而这个答案正是当年那种模糊安排刻意回避的问题——这笔交易究竟是与国王的，还是与国家的？"
 SAU_events.181.t: "昆西问题"
 SAU_events.182.a: "什么都没签。也不需要签"
 SAU_events.182.d: "没有文件，因为从来就没有过文件。有的是一支不会离开的航母编队，一份在两国政府之间传递、却不会在任何一国公布的照会，以及一份按旧条款续签二十年的石油协议。八十年过去了，这一安排挺过了一次王朝更替，靠的办法很简单：从未落下记录。"
 SAU_events.182.t: "理解达成"
 SAU_events.183.a: "我们将拿走一半"
 SAU_events.183.d: "商业关系已得到一定程度的确认，安全关系则被两次描述为正在审查之中。利雅得对这笔交易的结构心知肚明：油轮有保障，而王国没有。这是对美妥协的一半，不费华盛顿分文，由一个已经计算过另一半代价的政府所提供。"
 SAU_events.183.t: "半个便宜"
 SAU_events.184.a: "那么王国自力更生"
 SAU_events.184.d: "没有声明，没有拒绝，没有会晤。请求由一位副助理部长收悉，却从未得到答复，几个月后，人们便明白，不予答复本身就是答复。八十年的安排并未被推翻。它只是被任由悄然到期，以这类事情一贯终结的方式。"
 SAU_events.184.t: "无人保障"
 SAU_events.185.a: "让他们读吧"
 SAU_events.185.b: "王国只有一个外交政策"
 SAU_events.185.d: "新朝登基四个月后，伊斯兰会议组织在麦加召开会议——这个机构是费萨尔国王在1969年阿克萨清真寺被焚后一手建立的，如今由他的弟弟在他自己的城市里召集。会议商定了一项十年行动纲领，然后众人便各自打道回府。而在国民警卫队的军官食堂里，人们读的却是更早的那些演讲，1973年的那些，并且注意到费萨尔并不止步于纲领。穆塔伊布·本·阿卜杜拉指挥着国民警卫队。他并未制止这种阅读。"
 SAU_events.185.t: "麦加峰会"
 SAU_events.186.a: "以王国之名公开资助"
 SAU_events.186.b: "让卫队悄悄买单"
 SAU_events.186.c: "约束他"
 SAU_events.186.d: "1969年，阿克萨清真寺被焚，费萨尔当月便在拉巴特召集了穆斯林世界的首脑；伊斯兰会议组织正是因此而生。穆塔伊卜周围的那圈人希望重新召开峰会，并公开资助穆斯林世界联盟——以王国的名义，由王国出资，讲台上悬挂王国的旗帜。这不是一个小要求。而这恰恰也正是他叔父当年的所作所为。\n\n§H费萨尔主义情绪§!：[ROOT.GetSAUFaisaliteConviction]（§Y[?SAU_faisalite_conviction|0]§! / §Y100§!）"
 SAU_events.186.t: "拉巴特的记忆"
 SAU_events.187.a: "费萨尔终究还是有继承者的"
 SAU_events.187.d: "利雅得——沙特阿拉伯国民警卫队的指挥官本周所做的事，规模虽小，却是他叔父当年全面行动的缩影。穆斯林世界联盟的预算已恢复到接近20世纪70年代的水平，伊斯兰开发银行将利用与国民警卫队相关的资金进行资本重组，而穆塔伊卜·本·阿卜杜拉——作为在任的沙特指挥官而非大臣，此举前所未有——呼吁伊斯兰合作组织召开特别会议。\n\n费萨尔国王于1962年在麦加创立了该联盟，并于1969年在拉巴特组建了该组织。1973年10月，他展示了王国在选择行动而非调停之日所能做到的事情。国民警卫队不等于国家，其指挥官也不等于国王。如今在利雅得，这两点正被提及的频率远高于一个月前。"
 SAU_events.187.t: "费萨尔的继承者"
 SAU_events.188.a: "把私下已经说过的话公开表述"
 SAU_events.188.b: "华盛顿的战争轮不到我们来讲"
 SAU_events.188.d: "美索不达米亚驻扎着美军师，就部署在王国始终无法封锁的边境另一侧。无论华盛顿如何称呼这一安排，从布赖代到艾卜哈的每一位传教士都对此有着相同方式的描述，而事实也从未驳斥过他们的说法。穆塔伊卜周围的圈子已经不再争论费萨尔对西方的判断是否正确。他们现在讨论的是，既然他是对的，接下来该怎么办。\n\n§H费萨尔主义情绪§!：[ROOT.GetSAUFaisaliteConviction]（§Y[?SAU_faisalite_conviction|0]§! / §Y100§!）"
 SAU_events.188.t: "在隔壁的占领"
 SAU_events.189.a: "王国的改革并非为了获得国外的赞誉"
 SAU_events.189.b: "21世纪不会等待我们"
 SAU_events.189.d: "单独来看，每道法令都不算激进——这里放宽一条规定，那里重组一个部门，再向此前被拒之门外的人群开放某种职业。但合在一起，它们便是自学校招收女生以来最大规模的社会变革，利雅得没有人会假装起草这些法令时没有考虑过它们在华盛顿和伦敦会被如何解读。那些布道者对后者的注意远多于前者。\n\n§H费萨尔主义情绪 §!：[ROOT.GetSAUFaisaliteConviction]（§Y[?SAU_faisalite_conviction|0]§! / §Y100§                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                !）"
 SAU_events.189.t: "王国开放"
 SAU_events.19.a: "巩固边境"
 SAU_events.19.d: "[ROOT.SAU_GetFrontName]的战斗机已越过边境，突袭了军事仓库，随后消失在夜色中。我方部队匆忙应对。"
 SAU_events.19.t: "越境入侵"
 SAU_events.190.a: "大声质问费萨尔的问题"
 SAU_events.190.b: "预备役不是武器"
 SAU_events.190.d: "又一个穆斯林首都，又一场美国空袭，又一份沙特呼吁各方克制的声明。穆塔伊卜周围的圈子已经放弃起草声明了。他们转而传阅一个问题，而这正是费萨尔在1973年10月回答过的问题：如果地球上最大的石油储备从未被拿起过一次，那它还有什么用？\n\n§H费萨尔主义情绪§!：[ROOT.GetSAUFaisaliteConviction]（§Y[?SAU_faisalite_conviction|0]§!/§Y100§!）"
 SAU_events.190.t: "下一场战争"
 SAU_events.191.a: "让它继续吧。他应该出现在最前面"
 SAU_events.191.b: "通过各部门沟通"
 SAU_events.191.c: "在它拥立国王之前驱散它"
 SAU_events.191.d: "这已经不再是军官之间的谈话了。费萨尔的画像出现在奥莱亚大街的橱窗里；布赖代和欧奈宰的周五布道已经连续六周围绕同一主题；国民卫队自己的新兵正在向教官复述1973年的那篇广播。没有人组织这一切，而所有人都清楚它指向何方。穆塔伊卜·本·阿卜杜拉在公开场合一言不发，而这一点如今本身就被解读为一种表态。\n\n§H费萨尔主义情绪§！： [ROOT.GetSAUFaisaliteConviction]（[?SAU_faisalite_conviction|0]§！/§Y100§！）"
 SAU_events.191.t: "街道铭记费萨尔"
 SAU_events.192.a: "费萨尔的回答。用他的话说"
 SAU_events.192.b: "向受攻击者开放我们的宝库"
 SAU_events.192.c: "呼吁各方保持克制"
 SAU_events.192.d: "以色列军队正在对一个阿拉伯国家采取行动，王国电视台对此进行不间断的现场直播。不到一天，标语上写的不只是以色列，还有美国——那些飞机、弹药，以及随后将在安理会上行驶的否决权。这正是费萨尔在1973年所选择的立场，而在此期间争论从未改变：王国拥有地球上最大的石油储量，却从未有一次愿意拿起它。\n\n§H费萨尔主义情绪§!：[ROOT.GetSAUFaisaliteConviction]（§Y[?SAU_faisalite_conviction|0]§! / §Y100§!）"
 SAU_events.192.t: "又一次战争，同一个问题"
 SAU_events.193.a: "让历史记录表明，这是在谈判桌上解决的"
 SAU_events.193.d: "这份报告长达六十页，所建议的内容几乎正是上校们最初的要求，而当一个委员会被允许自行挑选成员时，结果往往就是如此。晋升已刊宪公布，逾期欠款已结清，那些在内政部档案中被点名的人，也已悄然被告知档案同样已经封存。\n\n不会再有政变了。王国的士兵们已经得到了一个不去做那个终结王国的人的理由，而对于一支军队而言，这通常就足够了。"
 SAU_events.193.t: "委员会报告"
 SAU_events.194.a: "那就这么定了。把这个问题向他们所有人提出"
 SAU_events.194.b: "王国将自己回应也门"
 SAU_events.194.d: "他们在一个周末抵达，议程从未公布。科威特派出副首相兼内政大臣谢赫·穆罕默德·哈立德·萨巴赫；卡塔尔派出首相兼内政大臣谢赫·阿卜杜拉·本·纳赛尔·阿勒萨尼。阿联酋方面已在办公楼内。\n\n首都已被胡塞武装攻陷，而公认的总统则身处首都以南，麾下已无任何像样的军队。摆在大家面前的问题并非海湾国家能否采取行动，而是海湾国家将采取统一行动还是各自为政 - 而走廊里的每个国家都将自行决定这一点。"
 SAU_events.194.t: "利雅得会议"
 SAU_events.195.a: "签署它。用一切必要手段签。"
 SAU_events.195.b: "也门不会被解救并沦为保护国。"
 SAU_events.195.d: "沙特阿拉伯直接向总统提出请求，与其说是提供帮助，不如说是请求许可。利雅得希望收到一封信函：一封致安理会的呼吁信，以及一封单独致海湾合作委员会成员国的呼吁信，请求它们§Y采取一切必要手段§!进行干预。\n\n一个获得认可的政府可以合法地邀请外国军队进入其领土，而这封信函构成了后续一切的法律基础。如果签署，海湾国家的空军就会进驻。如果未签署，共和国将依靠自身现有的力量对抗胡塞武装 - 并且事后仍有权宣称自己从未成为任何人的附庸。"
 SAU_events.195.t: "来自利雅得的提问"
 SAU_events.196.a: "果断风暴开始"
 SAU_events.196.b: "仅限空军和海军。沙特士兵不得越过边境。"
 SAU_events.196.d: "这项声明并非在利雅得发布。沙特阿拉伯驻美国大使阿德尔·朱拜尔在华盛顿大使馆宣读了声明，当时第一批飞机已经升空 - 这一发布地点的选择向世界各国首都表明，沙特阿拉伯在何时咨询了哪些人。\n\n“果断风暴行动”。应邀参与的国家名单已公布，其中一些国家是通过广播得知自己参与的程度。行动的既定目标是恢复合法政府。行动没有设定结束日期，也没有人提出结束日期的要求。\n\n§H联盟伙伴§!：§Y[?SAU_coalition_partners|0]§!"
 SAU_events.196.t: "宣言"
 SAU_events.197.a: "海湾地区开战。"
 SAU_events.197.d: "华盛顿 - 沙特阿拉伯领导的联军今晚开始对也门进行空袭行动，这一消息由沙特驻华盛顿大使馆而非利雅得方面宣布。沙特方面称，此举是根据也门公认总统的书面请求以及海湾合作委员会的集体防御条款进行的。\n\n德黑兰谴责了此次行动，并否认向胡塞武装提供武器。华盛顿方面证实，美国正在提供后勤和情报支持，但并未出动任何飞机。目前，联军各成员国均未对此次行动预计持续的时间做出预估。"
 SAU_events.197.t: "果断风暴行动"
 SAU_events.198.a: "我们将与王国一同翱翔。"
 SAU_events.198.b: "这不是我们的战争"
 SAU_events.198.d: "这份请求是通过沙特大使传达的，措辞异常直接：要么提供飞机，要么提供机组人员，或者在万不得已的情况下，在公报上注明一个名字。沙特王国正在组建一个联盟来对抗胡塞武装的推进，并且不愿单独组建这个联盟。\n\n加入战争能在利雅得获得大量信用，并分享后续的一切利益。拒绝战争只会损失这些信用，除此之外别无其他 - 而且这场战争没有结束日期。"
 SAU_events.198.t: "利雅得要求我们参与"
 SAU_events.199.a: "那么，我们就不会去那些没有被邀请的地方。"
 SAU_events.199.b: "我们不需要他们的签名。"
 SAU_events.199.d: "萨那的答复礼貌、不慌不忙，但完全否定了萨那的立场。萨那既不会向安理会提出申诉，也不会向海湾国家提出请求。对于萨那的关切，萨那的回应措辞，恰恰是各国政府在表达关切时惯用的那种语气，而这种关切他们往往打算置之不理。\n\n没有那封信，就没有邀请；没有邀请，对也门的空袭就只是对也门的空袭而已。利雅得或许仍会采取行动。它将自行其是，而各国首都也会如此记录。"
 SAU_events.199.t: "信件未送达"
 SAU_events.2.a: "国王万岁！"
 SAU_events.2.d: "阿卜杜拉·本·阿卜杜勒阿齐兹·阿勒沙特已正式被宣布为沙特阿拉伯国王及两圣寺守护者。作为1995年起的实际统治者，他的正式登基为王国带来了稳定与延续。阿卜杜拉国王以其谨慎的改革倾向和促进宗教间对话的努力而闻名。"
 SAU_events.2.t: "阿卜杜拉国王登基"
 SAU_events.20.a: "伊斯兰军"
 SAU_events.20.b: "两圣寺保卫者"
 SAU_events.20.c: "阿克萨旅"
 SAU_events.20.d: "这个由沙特支持的新运动在向世界宣告之前需要一个名称。它选定的旗帜将决定支持者和敌人如何称呼它。"
 SAU_events.20.e: "统一旅"
 SAU_events.20.t: "阵线的名字"
 SAU_events.200.a: "在政府能承受的范围内进行改革"
 SAU_events.200.b: "只有法令上的署名会改变"
 SAU_events.200.c: "开放经济，然后再开放政治"
 SAU_events.200.d: "法赫德按照教义的要求，被安葬在阿尔奥德的一处无名坟墓中，而阿卜杜拉在以他人名义治理了十年之后，终于以自己的名义成为国王。唁电从九十个首都纷至沓来，首次内阁会议也在同一周召开。\n\n自旧王中风以来他一直想做的一切如今都他自己可以直接下令而非提议，政府也心知肚明。他们尚不清楚的是，他究竟还打算做多少。内阁中有一些人十年来一直认定他不会推行过激政策。"
 SAU_events.200.t: "新的王国"
 SAU_events.201.a: "让忠诚的委员会决定继承问题"
 SAU_events.201.b: "国王指定了他的继承人，委员会将会高呼万岁"
 SAU_events.201.c: "进行收买以求得同意"
 SAU_events.201.d: "自1953年以来，继承权一直按照兄弟间的长幼顺序解决，这在有兄弟且他们能达成一致时还算有效。但这每年都更加难以维持，而最后两次权力交接是由那些已不在人世的人处理的，他们已无法再管理下一次交接。\n\n摆在桌面上的提案是成立一个由阿卜杜勒阿齐兹的子孙组成的常设委员会，有权确认王储并裁定国王是否适任。这将是王位有史以来第一份成文程序。它也将成为王国历史上第一个对国王本人拥有约束权的机构，而并非所有人都对此视而不见。"
 SAU_events.201.t: "巩固王权"
 SAU_events.202.a: "让他们发声，并公布他们的言论"
 SAU_events.202.b: "他们或许会召开会议，但议程由我们掌控"
 SAU_events.202.d: "大厅的布置使得来自卡提夫的什叶派神职人员与来自利雅得的萨拉菲派学者坐得足够近，可以交谈，而女性也在沙特王国的历史首次出现在会议中，坐在屏风后面。这里做出的任何决定都不具有约束力。这正是它的意义所在，也是弊病所在。\n\n代表们将说出他们被允许说的话。至于这允许的范围有多大，尚未确定，而将决定此事的两人意见不一：一人认为，一场不会改变任何事情的会议比没有会议更糟糕；另一人则认为，一场会改变某些事情的会议将是一系列无人能控制的会议的开端。"
 SAU_events.202.t: "全国对话"
 SAU_events.203.a: "全盘接受华盛顿的提议"
 SAU_events.203.b: "马巴希特能自己搞定"
 SAU_events.203.c: "改造他们，把他们下狱只能制造模仿者"
 SAU_events.203.d: "哈姆拉和伊什比利亚的住宅区遭到了爆炸袭击，而实施者正是生于斯长于斯，并通过在此注册的慈善机构获得的资金。无论当初的争端被假定为何，如今它显然已是针对王国本身。\n\n华盛顿提出设立联络小组、整合监视名单，并提供该地区任何国家都未曾获得过的信号情报访问权限。接受意味着美国军官将查阅沙特的文件。拒绝则意味着独自应对，而在这个国家里，有太多人暗中认同那些袭击者。"
 SAU_events.203.t: "反恐合作"
 SAU_events.204.a: "席位减半，只允许男性参与"
 SAU_events.204.b: "全部由任命产生，然后称之为协商"
 SAU_events.204.c: "让女性也参与进来"
 SAU_events.204.d: "市政委员会一半席位经选举产生，另一半为任命；委员会本身有权管理排水、路灯和建筑许可。王宫里没有人假装这是权力移交。\n\n反对此举的理由并非委员会会带来危害，而是一旦沙特人投了票，这一先例便与法令不同，无法在来年被悄然撤销。"
 SAU_events.204.t: "举行市政选举"
 SAU_events.205.a: "始于建议终于建议"
 SAU_events.205.d: "命令送达时委员会正在开会，而命令本身并未作出任何解释。一份四行的公报对委员们的服务表示感谢，大楼随即关闭，他们多年来获准阅读的档案也退回至各自所属的部委。\n\n它因国王的许可而存在。没有国王了，或者说，沙特家族的国王已不复存在，因此也就没有委员会了。利雅得没有人期待它能撑过这一周，也没有人公开这样说。"
 SAU_events.205.t: "委员会已解散"
 SAU_events.206.a: "通过吧"
 SAU_events.206.b: "国王不予批准"
 SAU_events.206.d: "改革派阵营自己承担了成本，这是新鲜事，而成本估算过于乐观，这倒不新鲜。工程包括：为那些被干线网络绕过的村庄修路，为至今仍靠水车买水的地区通水，以及一项要求政府公开其开支的条款。\n\n而政府反对的正是最后这项条款。"
 SAU_events.206.t: "改革派法案"
 SAU_events.207.a: "通过吧"
 SAU_events.207.b: "国王不予批准"
 SAU_events.207.d: "传统派议席提出了它一贯提出、却从未能付诸表决的方案：足额拨付捐赠基金，提高住房补贴，并为那些自繁荣期以来一直缺医少药的省份制定一套诊所建设计划。\n\n财政部称这套账目纯属空想。传统派则回应说，三十年来，账目一直在往反方向空想。"
 SAU_events.207.t: "传统派法案"
 SAU_events.208.a: "通过吧"
 SAU_events.208.b: "国王不予批准"
 SAU_events.208.d: "各省议员已联合起来，这是利雅得没人料到他们能做到的。他们提出了有实际约束力的沙特雇用配额，要求终结将工人绑定于单一雇主的担保制度，并设立一个向协商会议而非其政府负责的监察机构。\n\n本周，吉达的每一家商行都致函王宫。地方派心知肚明，却仍将表决排上了日程。"
 SAU_events.208.t: "地方派法案"
 SAU_events.209.a: "根据皇家法令，设立三十个席位。"
 SAU_events.209.b: "议事厅保持原样。"
 SAU_events.209.d: "三十个席位，由法令保障，以确保未来的国王不会悄悄地让席位数量减少 - 占议事厅的五分之一。他们将从单独的入口进入，坐在单独的区域，而照片的传播范围将远远超出座位安排图所示。\n\n四十多位资深学者联名签署了一封信。这封信没有任何威胁性，因为它无需如此。"
 SAU_events.209.t: "协商会议中的女性"
 SAU_events.21.a: "密切关注事态发展。"
 SAU_events.21.d: "一个此前不为人知的自称[ROOT.SAU_GetFrontName]的运动组织宣布其在约旦河西岸和以色列境内活动。该组织发表联合声明，誓言进行武装抵抗直至解放，并声称近期发生的一系列袭击事件系其所为。情报机构正紧急调查该组织的起源、资金来源及其活动范围。"
 SAU_events.21.t: "圣地出现新的战线"
 SAU_events.210.a: "海湾地区不会失去君主制。"
 SAU_events.210.d: "麦纳麦 - 沙特装甲部队在黎明前穿过法赫德国王大桥，抵达首都，全程未开火。利雅得方面称此次部署是应巴林合法政府请求而采取的“半岛之盾”行动，但拒绝透露是哪个政府提出了请求。\n\n德黑兰称之为占领。华盛顿呼吁各方保持克制，并未要求任何人离开。哈里发家族已重返宫殿，而促成其回归的安排如今已成为公开记录，而非私下默契。"
 SAU_events.210.t: "堤道"
 SAU_events.211.a: "抽取。油田就是策略。"
 SAU_events.211.b: "打造一个比油井更长久的产业。"
 SAU_events.211.c: "调查。还有更多类似的油田。"
 SAU_events.211.d: "阿布盖格的一座设施负责加工沙特阿拉伯王国大部分原油，而拉斯塔努拉则在另一座设施中装载原油。两次成功的袭击对世界经济造成的破坏将超过该地区任何军队一年所能造成的破坏，而国防部终于被要求公开说明其应对措施。\n\n资金只够解决一个问题，而不是三个。趁着油田还安全，加倍努力；打造一个即使失去油田也能生存的产业；或者别再想当然地认为王国已经拥有的油田就是全部的油田了。"
 SAU_events.211.t: "石油防御战略"
 SAU_events.212.a: "Let the bench reach upward."
 SAU_events.212.d: "法律本身一直都足够完善。所缺少的是愿意将其向上适用的法庭 - 一个可以传唤大臣的法庭，一个可以查明王子账目的委员会，以及一位事后仍能保住饭碗的法官。\n\n这件事能否奏效，完全取决于国王的耐心，所有可能被传唤的人都明白这一点。一旦法院宣布开庭，资金流动就会停止。"
 SAU_events.212.t: "反腐败法庭"
 SAU_events.213.a: "Nobody is above the file."
 SAU_events.213.d: "约两百名王子、大臣和商人被关押在该国最昂贵的酒店数月之久。据说追回了1000亿美元。没有公布任何指控，也没有宣判，释放过程是逐一协商完成的。\n\n它被描述为一场反腐败运动。它的作用在于，家族不再是一个集体，而变成了一个观众，而地球上的每一位投资者都目睹了这一切的发生。"
 SAU_events.213.t: "丽思卡尔顿"
 SAU_events.214.a: "悄悄解决吧。本来就注定如此。"
 SAU_events.214.d: "这些协议都是逐一协商达成的，条款也从未公开：一家公司在这里签约，一个基金会在那里解散，某个儿子的职位悄悄得到保障。所有相关人员都明白，这些并非法律文书，而是政治手段。\n\n这笔钱几乎立刻就回流到沙特阿拉伯，因为归还资金的人现在有理由把钱放在有人监视的地方。每个人的档案都一直保存在利雅得的一个抽屉里。"
 SAU_events.214.t: "幕后交易"
 SAU_events.215.a: "这家人得找点别的事来争吵了。"
 SAU_events.215.d: "当官员们停止清点人数时，诸位王子仍在互相计票。由于王位已无继承人，因此也无继承人可言 - 议会已将此事搁置，并且不打算重新讨论。\n\n过去几年里，那些忙于组建各自派系的人发现，一个派系的价值取决于它背后的制度的价值，而所有这些派系背后的制度就是君主制。"
 SAU_events.215.t: "夺嫡之争结束"
 SAU_events.216.a: "让他们说去吧"
 SAU_events.216.b: "保持混乱"
 SAU_events.216.c: "告诉他们，王国只能有一位王"
 SAU_events.216.d: "穆塔伊卜的人今年第三次向迪万提出了同样的问题，而这一次他们已不屑于以问句的形式表达。王国自称两圣地的守护者，行事却像个附庸。费萨尔可不是如此的。这就是争论的全部，细究之下也不会变得更复杂。\n\n继承问题悬而未决，现有一切话语都是选边站队的一部分。"
 SAU_events.216.t: "外环再次发问"
 SAU_events.217.a: "王国迈步前行"
 SAU_events.217.d: "利雅得宣布了法赫德·本·阿卜杜勒阿齐兹·阿勒沙特国王的死讯。他在位二十三年，但自1995年中风以来，已很少处理随之而来的政务。他留下的王国在过去十年里，是以他的名义、由他兄弟之手治理的，而今天上午宣布的继承，改变的只是文件上的头衔，而非签字之人。\n\n王储阿卜杜拉继位。他已年过八十。真正重要的人物并不是在看他——他们的目光越过他，看向下一个被指定的人。"
 SAU_events.217.t: "法赫德国王之死"
 SAU_events.218.a: "继承现在成了关键"
 SAU_events.218.d: "阿卜杜拉·本·阿卜杜勒阿齐兹·阿勒沙特国王已逝，随之而去的是最后一位仅凭年资便能毫无争议地继承王位的兄弟。他依照仪式要求，被安葬在奥德的一处无名坟墓中，一如他之前的每一位国王。\n\n萨勒曼在数小时内即位。接下来便是王国推迟了三十年的那一幕：王冠终将传至一个并无自动继承权的世代，而如今在世的每一位王子都心知肚明。"
 SAU_events.218.t: "阿卜杜拉国王之死"
 SAU_events.219.a: "国王万岁"
 SAU_events.219.d: "国王已逝。利雅得已发布公告，措辞如同其专为王室保留的那般简洁克制，而王储已收到来自资深亲王、乌里玛以及国民卫队指挥官们的效忠宣誓。\n\n今日终结的统治，始于一位老人和一个仍遵循兄终弟及共识的王国。它的结束伴随着这一共识被国王本人亲手废除而消亡，转而确立了一种向外界表明已经尘埃落定的继承安排。"
 SAU_events.219.t: "萨勒曼国王之死"
 SAU_events.22.a: "让石油流动起来"
 SAU_events.22.b: "我们的土地不供沙特通行"
 SAU_events.22.d: "沙特人请求修建一条穿越我们南部省份通往阿拉伯海的输油管道。过境费将充实我们的国库，而利雅得将欠我们一个难以轻易偿还的人情。"
 SAU_events.22.t: "奔向海洋的管道"
 SAU_events.24.a: "建造管道"
 SAU_events.24.b: "拒绝提议"
 SAU_events.24.d: "沙特阿拉伯提出通过我们的领土将其石油输往土耳其和欧洲。伊拉克将成为连接海湾与西方的桥梁，过境收入将用于重建国家。"
 SAU_events.24.t: "通往欧洲的管道"
 SAU_events.25.a: "让他们空手而归"
 SAU_events.25.d: "沙特家族派遣使者，提议穿越我国领土修建输油管道。他们忘了谁才是这里的主宰。伊拉克不向任何人低头，尤其不会向利雅得屈服。"
 SAU_events.25.t: "沙特特使在巴格达"
 SAU_events.26.a: "太好了"
 SAU_events.26.d: "焊工铺设完最后一段管道，阀门开启。沙特原油如今沿着这条新动脉流向大海，王国对世界能源的掌控愈发牢固。"
 SAU_events.26.t: "石油流淌"
 SAU_events.27.a: "我们会找到另一条路"
 SAU_events.27.d: "交易已经告吹。目前，这条通往海洋的路线仍然遥不可及，霍尔木兹依旧是我们唯一的门户。"
 SAU_events.27.t: "管线关闭"
 SAU_events.28.a: "代价惨重的挫折"
 SAU_events.28.d: "战争已经波及输油管道。破坏分子炸毁了一段管道，石油运输已经中断。在也门南部得到确保之前，阿拉伯海管线已经失能。"
 SAU_events.28.t: "输油管道被切断"
 SAU_events.29.a: "开放路线"
 SAU_events.29.b: "拒绝提议"
 SAU_events.29.d: "利雅得请求修建一条穿过我们王国通往地中海的输油管道。仅过境费就能稳定我们的财政，而沙特人是慷慨的朋友。"
 SAU_events.29.t: "横跨约旦输油管道"
 SAU_events.3.a: "接受提议"
 SAU_events.3.b: "拒绝提议"
 SAU_events.3.d: "利雅得向中国企业提供参与沙特农业和能源项目的机会。接受这一提议将加深中国与沙特王国之间的经济联系。"
 SAU_events.3.t: "[SAU.GetFlag]沙特-中国协议[CHI.GetFlag]"
 SAU_events.30.a: "欢迎经过我国管线"
 SAU_events.30.b: "叙利亚的主权是非卖品"
 SAU_events.30.d: "约旦同意后，沙特提议将他们的石油通过我国领土运往海边。一个自由繁荣的叙利亚将从中获利丰厚，利雅得的友谊也值得拥有。"
 SAU_events.30.t: "来自利雅得的提议"
 SAU_events.300.a: "独立的技术官僚"
 SAU_events.300.b: "王室监督至关重要"
 SAU_events.300.c: "引进外国专家"
 SAU_events.300.d: "《§L资本市场法§!》已签署。现在我们必须决定：谁将执掌新成立的§L资本市场管理局§!？技术官僚要求独立；§H王室法庭§!要求监督；外国顾问提供他们的经验。这一选择将决定王国未来一代人的金融架构。"
 SAU_events.300.t: "§H皇家法令 M/30 - 实施§!"
 SAU_events.301.a: "盎格鲁-撒克逊体系"
 SAU_events.301.b: "以伊斯兰教法为先的框架。"
 SAU_events.301.c: "混合模式"
 SAU_events.301.d: "正式的公司化重塑了企业格局。股份公司、有限责任公司——§L王国§!必须选择自己的模式。§L盎格鲁-撒克逊§!框架以外国影响为代价提供效率；§L伊斯兰教法优先§!框架以速度为代价提供合法性；§L混合§!模式则采取稳健的中间路线。"
 SAU_events.301.t: "§H2007年法律改革§!"
