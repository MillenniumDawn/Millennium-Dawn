 CZR_union: "Checoslovaquia"
 GER_REB_S: "República Democrática Alemana"
 GER_com_reb_tech: "República Democrática Alemana"
 Sov_warsaw_pact.7.t: "Referéndum sobre la unificación en un solo país"
 Sov_warsaw_pact.7.d: "Los pueblos checo y eslovaco no han olvidado cómo, hace poco, sus líderes los engañaron al dividir su país sin previo aviso. Ahora, surge la oportunidad de corregir este error histórico y reunificarnos como una sola nación fuerte. Rusia actuará como mediador neutral para garantizar un referéndum justo y seguro."
 Sov_warsaw_pact.7.a: "Es hora de unirse!"
 SOV_United_Network_of_Warsaw_Pact_Laboratories: "Red Unida de Laboratorios del Pacto de Varsovia"
 SOV_Joint_research_on_armor_and_infantry: "Investigación conjunta en blindados e infantería"
 SOV_Joint_aviation_research: "Investigación Aérea Conjunta"
 SOV_joint_research_ttip: "§REstas bonificaciones solo se pueden usar una vez y se aplican únicamente a los países del Pacto de Varsovia. Los países fuera del Pacto de Varsovia histórico no las reciben. Úsalas solo si estás seguro de que todos tus aliados son miembros del Pacto, ya que solo ellos se benefician.§!"
 SOV_warsaw_influence_close: "Decisiones cercanas sobre la revolución en §Y[BUL.GetNameWithFlag]§!"
 SOV_warsaw_influence_close1: "Decisiones cercanas sobre la revolución en §Y[ROM.GetNameWithFlag]§!"
 SOV_warsaw_influence_close2: "Decisiones cercanas sobre la revolución en §Y[HUN.GetNameWithFlag]§!"
 SOV_warsaw_influence_close3: "Decisiones cercanas sobre la revolución en §Y[CZE.GetNameWithFlag]§! y §Y[SLO.GetNameWithFlag]§!"
 Sov_warsaw_pact.13.t: "Rebelión armada en Alemania del Este"
 Sov_warsaw_pact.13.d: "Ha estallado un levantamiento armado en Alemania Oriental. Con el apoyo financiero y armamentístico del Pacto de Varsovia, las fuerzas militares de Alemania Oriental han tomado el control de instituciones clave y han declarado el restablecimiento de la República Democrática Alemana. Los rebeldes denuncian la reunificación con Alemania Occidental como un grave error que debe revertirse."
 Sov_warsaw_pact.13.a: "¿Está el mundo al borde de una Tercera Guerra Mundial?"
 SOV_Restore_order_on_the_western_border: "Restablecer el Orden en la Frontera Occidental"
 cant_start_exercises1_tt_effect: "§RNo podrás iniciar otro ejercicio durante los próximos 297 días.§!"
 cant_start_exercises2_tt_effect: "§RNo podrás iniciar otro ejercicio durante los próximos 286 días.§!"
 cant_start_exercises3_tt_effect: "§RNo podrás iniciar otro ejercicio durante los próximos 275 días.§!"
 SOV_restoration_of_warsaw_pact: "Restauración del Pacto de Varsovia"
 SOV_restoration_of_warsaw_pact_desc: "\n\n\n\n\n\n£SOV_desctext_warsaw \n\n\n\n\n\n\n\n\nLa situación en Europa del Este se ha vuelto cada vez más inestable, y varios antiguos aliados del Pacto de Varsovia ya desertaron a la OTAN. Cuanto más se prolongue esto, más difícil será recuperar la influencia a nivel global. Debemos reclamar lo perdido y restaurar un equilibrio mundial bipolar."
 SOV_AUTH_SS: "Estado Nacional Soviético Ruso"
 SOV_soviet_empire: "Imperio Soviético"
 Sov_warsaw_pact.15.t: "Oportunidad de liberarse de la influencia rusa"
 Sov_warsaw_pact.15.d: "La reciente agitación en Rusia nos ha dado la oportunidad de reducir su influencia sobre nuestro país. Mientras Rusia se centra en asuntos internos, debemos decidir si seguimos siendo aliados o seguimos nuestro propio camino independiente."
 Sov_warsaw_pact.15.a: "Rusia ya no es nuestra aliada"
 Sov_warsaw_pact.15.b: "Nos quedamos"
 Sov_warsaw_pact.17.t: "Invasión de Alemania del Este"
 Sov_warsaw_pact.17.d: "Hace apenas unas horas, nuestras fuerzas en Alemania Oriental fueron atacadas, obligando a nuestras tropas fronterizas a retirarse. El mundo se encuentra ahora al borde de un conflicto nuclear. Nos enfrentamos a una decisión crucial: defender a nuestros aliados y arriesgarnos a la aniquilación global o sacrificar a un aliado para preservar la paz."
 Sov_warsaw_pact.17.a: "¡Movilizad al ejército, es hora de marchar!"
 Sov_warsaw_pact.17.b: "Ningún aliado merece la destrucción total del planeta."
 WP_escaped: "Abandonaron nuestra esfera de influencia"
 Sov_warsaw_pact.16.t: "El levantamiento tiene éxito"
 Sov_warsaw_pact.16.d: "Con la ayuda de nuestros aliados históricos, hemos tomado el control de centros de mando clave en Alemania Oriental. El Pacto de Varsovia ha ofrecido protección a nuestra soberanía a cambio de cooperación estratégica, fortaleciendo así nuestra posición."
 Sov_warsaw_pact.16.a: "Gloria a la RDA y su pueblo!"
 Sov_warsaw_pact.18.t: "La URSS rechaza la ayuda"
 Sov_warsaw_pact.18.d: "Para evitar la Tercera Guerra Mundial, la URSS está retirando sus tropas de nuestro territorio, dejándonos solos ante las amenazas."
 Sov_warsaw_pact.18.a: "Traidor!"
 OVD_raspalsa: "El Pacto de Varsovia Colapsó"
 Sov_warsaw_pact.19.t: "La URSS retira sus tropas de Alemania Oriental"
 Sov_warsaw_pact.19.d: "El conflicto en Alemania Oriental ha llevado al mundo al borde de la guerra. Para evitar un conflicto total, el liderazgo soviético ha ordenado la retirada total de sus tropas. El mundo observa atentamente cómo el último soldado soviético abandona la recién declarada República Democrática Alemana."
 Sov_warsaw_pact.19.a: "\"En el ejército soviético se necesita más coraje para retirarse que para avanzar\"."
 birth_of_eastern_germany_world_tension: "Rebelión en Alemania del Este"
 SOV_nazbols: "Rusia lo es todo. El resto no es nada"
 SOV_nazbols_desc: "\n\n\n\n\n\n£SOV_desctext_nazbol \n\n\n\n\n\n\n\n\nHa llegado el momento de restaurar la antigua grandeza de Rusia. Solo nosotros entendemos verdaderamente lo que nuestra gran madre patria necesita."
 SOV_nazbols_nato: "Retórica Anti-Occidental"
 SOV_nazbols_nato_desc: "Occidente siempre ha sido y seguirá siendo nuestro enemigo. Nuestra retórica nunca debe cambiar."
 SOV_nazbols_foreign_legion: "La Legión Extranjera"
 SOV_nazbols_foreign_legion_desc: "Inspirados por la Legión Extranjera Francesa, crearemos una Legión Rusa donde los extranjeros puedan servir y obtener la ciudadanía."
 SOV_nazbols_ekb: "Trasladar la capital a Ekaterimburgo"
 SOV_nazbols_ekb_desc: "¡Es hora de trasladar la capital al corazón de Rusia! Los Urales son perfectos. Moscú está demasiado distante de muchas regiones."
 SOV_nazbols_empire: "El Imperio Soviético"
 SOV_nazbols_empire_desc: "¡Nuestro poder ha regresado! ¡Gloria al Imperio Soviético!"
 SOV_anti_west_idea: "Doctrina Antioccidental"
 sov_sover_state.1.t: "§Y[SOV.GetNameWithFlag]§! Nos ofrece la idea de revivir la URSS"
 sov_sover_state.1.d: "La §YUnión de Estados Soberanos§! fue desmantelada originalmente antes de que pudiera materializarse, desmoronándose durante el caos político del intento de golpe de Estado del Comité Estatal de Emergencia en Moscú. Ahora, la iniciativa ha regresado con renovada fuerza. El proyecto presenta una segunda oportunidad para unificar a los Estados postsoviéticos bajo un nuevo marco más flexible. Esta propuesta podría remodelar el orden regional."
 sov_sover_state.1.a: "Estamos de acuerdo en participar en esto"
 sov_sover_state.1.b: "No nos interesa esto"
 sov_sover_state.5.t: "Declaración de la Unión de Estados Soberanos"
 sov_sover_state.5.d: "El borrador final del tratado nos ha sido presentado para su consideración. Ahora nos corresponde decidir si firmamos y nos unimos oficialmente a la Unión de Estados Soberanos. Esta decisión definirá nuestro papel en la nueva alianza regional."
 sov_sover_state.5.a: "Sí"
 sov_sover_state.5.b: "No"
 sov_sover_state.6.t: "Unión de Estados Soberanos"
 sov_sover_state.6.d: "El proceso de firma ha concluido y se funda oficialmente la Unión de Estados Soberanos. Este acontecimiento histórico marca el inicio de una nueva era de cooperación, desarrollo mutuo y gobernanza compartida entre sus miembros."
 sov_sover_state.6.a: "¡Hurra!"
 sov_sover_state.14.t: "Unión de Estados Soberanos"
 sov_sover_state.14.d: "§Y[FROM.GetNameWithFlag]§! ha aceptado oficialmente convertirse en candidato para unirse a la Unión de Estados Soberanos. Este es un paso crucial hacia adelante en la construcción de una confederación unificada de repúblicas soberanas."
 sov_sover_state.14.a: "¡Hurra!"
 sov_sover_state.15.t: "Unión de Estados Soberanos"
 sov_sover_state.15.d: "§Y[FROM.GetNameWithFlag]§! ha firmado el acuerdo formal para unirse a la Unión de Estados Soberanos. Esto marca su entrada oficial en la unión y fortalece la alianza."
 sov_sover_state.15.a: "¡Hurra!"
 SOV_reassure_ruthenia: "Proyecto de la Unión de Estados Soberanos"
 SOV_reassure_ruthenia_desc: "Nuestro objetivo es revivir el proyecto, abandonado hace tiempo, de la Unión de Estados Soberanos, una alternativa confederada a la URSS. Al invitar a naciones seleccionadas, esperamos restablecer la cohesión regional bajo un nuevo marco, corrigiendo las deficiencias del legado soviético."
 SOV_Sign_mutual_cooperation_agreements: "Membership of the Union of Sovereign States"
 SOV_Sign_mutual_cooperation_agreements_desc: "We will approach several nations with proposals to join the Union of Sovereign States. These countries are likely to benefit from and contribute to our collective prosperity and regional stability."
 SOV_Putting_out_the_fire_in_the_post-Soviet_space: "Anunciar la Ceremonia de Firma del Acuerdo"
 SOV_Putting_out_the_fire_in_the_post-Soviet_space_desc: "Anunciaremos oficialmente la fecha de la ceremonia de firma del Tratado de la Unión. Este evento determinará qué naciones se comprometen a unirse a nuestra unión y a trabajar juntas para alcanzar objetivos comunes."
 SOV_Gorbachev_dream: "Expand the Union of Sovereign States"
 SOV_Gorbachev_dream_desc: "The founding ceremony is complete. With the formalities settled, we will move forward with expanding the Union of Sovereign States, solidifying its presence and influence throughout the post-Soviet space."
 SOV_ssg_category: "Unión de Estados Soberanos"
 SOV_ssg_category_desc: "La Unión de Estados Soberanos se concibió como una versión reformada de la URSS: más blanda, más descentralizada y de naturaleza confederada. Hoy tenemos la oportunidad de dar vida a esa visión, enmendando los errores del pasado y construyendo un futuro más fuerte."
 SOV_conflict_geo: "¡Someter a votación la resolución del §YConflicto en Georgia§!"
 SOV_conflict_geo_resolve: "Resolver el §YConflicto Georgiano§! Definitivamente"
 SOV_conflict_nkr: "¡Pongamos a votación la resolución del §YConflicto en Artsaj§!"
 SOV_conflict_nkr_resolve: "Resolver el §YConflicto Armenio-Azerbaiyano§! Definitivamente"
 SOV_conflict_ukr: "¡Someter a votación la resolución del §YConflicto de Crimea§!"
 SOV_conflict_ukr_resolve: "Resolver el §YConflicto de Crimea§! Definitivamente"
 SOV_annex12: "La cabeza de puente en el Dniéster"
 SOV_annex13: "Devolver las regiones separatistas"
 SOV_Civil_nationalism: "Nacionalismo Civil"
 SOV_Civil_nationalism_desc: "La nación debe ser lo primero. Priorizaremos los intereses nacionales por encima de todo, uniendo a la sociedad en torno a una identidad compartida y un propósito común."
 SOV_embrace_the_legacy_of_the_USSR: "Adoptar el Legado de la URSS"
 SOV_embrace_the_legacy_of_the_USSR_desc: "El legado de la Unión Soviética sigue guiando nuestro desarrollo político y cultural. Sus logros siguen siendo la piedra angular de nuestra identidad y ambiciones nacionales."
 SOV_Introduce_visa_regime_with_Central_Asia: "Régimen de Visa con Asia Central"
 SOV_Introduce_visa_regime_with_Central_Asia_desc: "Para gestionar mejor nuestras fronteras y abordar las preocupaciones económicas y sociales, introduciremos un régimen de visados ​​con Asia Central. Esta medida busca reducir la migración ilegal y salvaguardar la estabilidad nacional."
 SOV_Utilize_the_country_economic_potential_100_percent: "Maximizar el potencial económico"
 SOV_Utilize_the_country_economic_potential_100_percent_desc: "Liberaremos al máximo el potencial económico del país. Debemos aprovechar todos los recursos y oportunidades para impulsar el crecimiento y la prosperidad."
 SOV_Cooperation_with_Taiwan: "Cooperación con Taiwán"
 SOV_Cooperation_with_Taiwan_desc: "La cooperación estratégica con Taiwán nos brindará acceso a tecnología avanzada y considerables beneficios económicos. Esta alianza puede acelerar nuestro desarrollo."
 SOV_Buy_out_Taiwans_microchip_technology: "Adquirir la tecnología de microchips de Taiwán"
 SOV_Buy_out_Taiwans_microchip_technology_desc: "Hemos cerrado un acuerdo para adquirir tecnología de fabricación de microchips de Taiwán. Esta adquisición sentará las bases de nuestro avance tecnológico y económico."
 SOV_Promote_Russian_companies_in_the_post-Soviet_space: "Promover las empresas rusas en el espacio postsoviético"
 SOV_Promote_Russian_companies_in_the_post-Soviet_space_desc: "Apoyaremos activamente a las empresas rusas que se expanden en la región postsoviética. Nuestro objetivo es consolidar una posición dominante en estos mercados."
 SOV_Monopoly_in_the_post-Soviet_space: "Monopolio en el Espacio Postsoviético"
 SOV_Monopoly_in_the_post-Soviet_space_desc: "Las empresas rusas deben lograr el dominio del mercado en toda la región postsoviética. Mediante inversiones estratégicas e influencia política, lo haremos realidad."
 SOV_Economic_Empire: "Imperio Económico"
 SOV_Economic_Empire_desc: "Una Rusia fuerte no necesita la guerra para consolidarse. Mediante el poder económico y la influencia, consolidaremos nuestro liderazgo mundial."
 SOV_Make_the_Anti-Corruption_Foundation_a_State_Company: "Fundación Anticorrupción"
 SOV_Make_the_Anti-Corruption_Foundation_a_State_Company_desc: "Para institucionalizar la lucha contra la corrupción, la Fundación Anticorrupción se convertirá en una organización estatal con el pleno respaldo del gobierno."
 SOV_Demonopolization_of_the_strategic_economy: "Desmonopolización de la Economía Estratégica"
 SOV_Demonopolization_of_the_strategic_economy_desc: "Romperemos los monopolios en sectores estratégicos de la economía para mejorar la transparencia, la competencia y la eficiencia."
 SOV_Unite_the_network_of_state-owned_companies: "Unir empresas estatales"
 SOV_Unite_the_network_of_state-owned_companies_desc: "Consolidaremos nuestras empresas estatales en una red cohesionada y eficiente, alineada con los intereses nacionales y capaz de impulsar el crecimiento a largo plazo."
 SOV_Increase_salaries_and_pensions_for_the_military_and_the_population: "Aumentar Salarios y Pensiones"
 SOV_Increase_salaries_and_pensions_for_the_military_and_the_population_desc: "Hicimos una promesa y la cumpliremos. Los salarios y las pensiones, tanto para el ejército como para la población civil, se incrementarán significativamente."
 SOV_Measures_of_rapprochement_with_the_West: "Acercamiento a Occidente"
 SOV_Measures_of_rapprochement_with_the_West_desc: "Occidente no debe ser visto como una amenaza, sino como un socio. Mediante la cooperación y el diálogo, reconstruiremos la confianza y redefiniremos nuestras relaciones."
 SOV_The_way_of_free_russia: "El Camino de Rusia Libre"
 SOV_The_way_of_free_russia_desc: "Una Rusia libre es una Rusia fuerte. Defenderemos la libertad, la democracia y el orgullo nacional como base de un futuro mejor."
 SOV_eu_state: "Estado del Oeste Real"
 SOV_new_pensions_reform: "Nueva Reforma de Pensiones"
 SOV_demonopolisation_reform: "Desmonopolización de la industria estratégica"
 russian_legacy_empire: "£text_icon_sov_empire Legado Imperial"
 russian_legacy_empire_desc: "Rusia siempre ha sido un gran imperio, y no abandonaremos este legado en pos de fugaces ilusiones democráticas."
 russian_legacy_democratic: "£text_icon_sov_democratic Legado Democrático"
 russian_legacy_democratic_desc: "Si bien Rusia ha experimentado largos períodos de autocracia, también ha conocido momentos de esperanza democrática. Preservaremos y expandiremos este legado de libertad."
 russian_legacy: "£text_icon_sov_empire Legado Ruso"
 russian_legacy_desc: "Durante siglos, Rusia ha seguido su propio camino, a menudo aislada y bajo un régimen férreo. El cambio es lento, pero puede que haya llegado el momento de la transformación."
 SOV_idea_restalinization: "Restalinización"
 SOV_idea_restalinization_desc: "Rusia se ha desviado del camino recto. Para recuperar nuestra fuerza e independencia, debemos volver a los métodos y la visión de Stalin."
 SOV_fbk_organization_category: "Sede de la Fundación Anticorrupción"
 SOV_fbk_organization_category_desc: "Años de autocracia han saturado nuestro estado de corrupción. La Fundación Anticorrupción se compromete a erradicarla y a restaurar el honor del servicio público."
 SOV_democracy_taiwam_category: "Democracia Rusa en Taiwán"
 SOV_democracy_taiwam_category_desc: "Taiwán sigue siendo una espina en el costado de China. A medida que nuestra rivalidad con China se intensifica, asegurar nuestra influencia sobre Taiwán se ha convertido en una de nuestras prioridades estratégicas."
 SOV_boost_opinion_of_rus: "Continuar mejorando la relación"
 SOV_more_weapon_taiwan: "Más armas para Taiwán"
 SOV_invest_taiwan: "Inversiones en Taiwán"
 SOV_puppet_taiwan: "Someter a Taiwán"
 SOV_Civil_Nationalism_idea: "Verdadero Nacionalismo Civil"
 SOV_Combating_illegal_migration_idea: "Lucha contra la migración ilegal"
 SOV_Finding_corrupt_officials_in_the_party: "Identificar a funcionarios corruptos en el partido"
 SOV_Check_police_personnel: "Inspeccionar al personal policial"
 SOV_expose_corrupt_schemes_in_the_smuggling_trade: "Descubrir la corrupción del contrabando"
 SOV_check_data_on_illegal_migration: "Analizar datos sobre migración ilegal"
 SOV_operation_Sweet_Gifts: "Operación Dulces Regalos"
 SOV_Prepare_the_test_purchase: "Preparar la Compra de Prueba"
 SOV_Train_specialized_personnel: "Capacitar Personal Especializado"
 SOV_Finalize_the_sweet_gifts_operation: "Completa la Operación Dulces Regalos"
 SOV_Free_Russia_idea: "Rusia Libre"
 SOV_Russian_Microchip_idea: "Baikal Core i9"
 russia.52.t: "Delegación rusa en Taiwán"
 russia.52.d: "Una delegación rusa ha llegado con una propuesta: adquirir una parte de nuestra tecnología de microchips a cambio de recursos rusos esenciales. Este acuerdo podría beneficiar a ambas partes."
 russia.52.a: "Es un buen trato"
 russia.52.b: "¿Rusia? ¿Y cuántas divisiones tiene?"
 russia.53.t: "Taiwán incumplió el acuerdo"
 russia.53.d: "El gobierno taiwanés ha rechazado nuestra oferta, considerándola desfavorable. Las negociaciones han fracasado y la tensión podría aumentar."
 russia.53.a: "Taiwán simplemente no reconoce la dominación de los procesadores Baikal"
 russia.54.t: "Fuerzas de Defensa Aeroespacial Rusas"
 russia.54.d: "El ejército ruso ha establecido oficialmente una nueva rama: las Fuerzas de Defensa Aeroespacial. Esta reforma busca integrar las operaciones aéreas y espaciales de forma más eficaz."
 russia.54.a: "¡Hurra!"
 russia.55.t: "La Coronación del Zar Boris"
 russia.55.d: "Borís Yeltsin ha regresado a la vida pública y ahora es visto por muchos como el zar simbólico de toda Rusia. Aunque es una figura mayoritariamente ceremonial, este renacimiento de la monarquía es histórico, incluso si resulta poco convencional."
 russia.55.a: "Qué tontería"
 russia.58.t: "Reformas del Ejército"
 russia.58.d: "Nuestras reformas militares están empezando a dar frutos. Nuevos generales talentosos se han unido a nuestras filas, aportando fuerza y ​​un profesionalismo renovado."
 russia.58.a: "Bueno"
 russia.59.t: "Reformas del Ejército"
 russia.59.d: "Nuestras reformas militares están empezando a dar frutos. Nuevos generales talentosos se han unido a nuestras filas, aportando fuerza y ​​un profesionalismo renovado."
 russia.59.a: "Bueno"
 russia.62.t: "El desastre del Mi-8 cerca del pueblo de Ermakovskoye"
 russia.62.d: "In April 2002, General Alexander Lebed tragically died at the age of 52 in a Mi-8 helicopter crash near Lake Oyskoye in the Western Sayans. The aircraft struck power lines during poor weather, killing seven others alongside him. While officially ruled as poor crew preparation, alternative theories suggest sabotage or pressure to fly despite unsafe conditions. Conflicting reports and the absence of detailed aeronautical maps have left the exact cause uncertain."
 russia.62.a: "Tragedia"
 SOV_prepare_a_deal: "Preparar un Trato"
 SOV_buy_microchips: "Comprar Microchips Taiwaneses"
 SOV_Economic_blockade_of_Georgia_idea: "Bloqueo económico a Georgia"
 SOV_Dominance_of_russian_companies_idea: "Dominio de Empresas Rusas"
 SOV_Visa_regime_with_central_asia_idea: "Régimen de Visa con Asia Central"
 SOV_Economic_Empire_idea: "Imperio Económico"
 SOV_Dependence_on_Russian_technologies_idea: "Dependencia de las tecnologías rusas"
 SOV_FBK_TT: "Desbloquea las decisiones de la §YFundación Anticorrupción§!"
 SOV_cross_the_rubicon: "Cruzar el Rubicón"
 SOV_cross_the_rubicon_desc: "Ha llegado el momento de que el verdadero líder de Rusia tome el poder. Debemos actuar con decisión para asegurar el futuro de nuestra nación y tomar las riendas de la historia."
 SOV_tandemokratia: "Tandemokratia"
 SOV_tandemokratia_desc: "Tandemokratia se refiere al duunvirato de Putin y Medvedev. Juntos, gobernarán Rusia como una fuerza unificada, fusionando sus fuerzas en un solo poder."
 SOV_unlimited_samoderzhaviye: "Samoderzhaviye ilimitado"
 SOV_unlimited_samoderzhaviye_desc: "Regresamos al principio del Samoderzhaviye: el mandato absoluto. Con dos zares al timón, nuestra gobernanza refleja el poderío de la antigua autocracia rusa."
 SOV_establish_new_oligarchate: "Establecer Nueva Oligarquía"
 SOV_establish_new_oligarchate_desc: "Los oligarcas han moldeado la política rusa durante mucho tiempo. Al reemplazar a los leales a Putin con nuestros propios aliados, aseguraremos una estabilidad duradera y un apoyo leal."
 SOV_peace_with_the_west: "Paz con Occidente"
 SOV_peace_with_the_west_desc: "Con nuestros asuntos internos en constante cambio, un conflicto con Occidente no es viable. Por ahora, la paz debe prevalecer hasta que llegue el momento adecuado."
 SOV_continue_reformism: "Continuar el Reformismo"
 SOV_continue_reformism_desc: "Las políticas conservadoras de Putin llevaron al estancamiento. Nuestra nueva administración revitalizará a Rusia mediante reformas integrales y un nuevo liderazgo."
 SOV_secure_the_FSB: "Asegurar el FSB"
 SOV_secure_the_FSB_desc: "El FSB sigue siendo un bastión de la influencia putinista. Es necesaria una purga para desmantelar este último bastión del antiguo régimen."
 SOV_crush_putinism: "Aplastar el Putinismo"
 SOV_crush_putinism_desc: "El putinismo debe ser completamente desmantelado: sus políticas, sus redes y su ideología. Debemos dejarlo atrás para poder avanzar."
 SOV_western_russia: "Nueva Ola en Estilo Antiguo"
 SOV_western_russia_desc: "Aunque el partido gobernante ha recuperado el poder, ahora está liderado por un ala reformista. Su objetivo es reestructurar el sistema para que sea compatible con las alianzas democráticas y la cooperación occidental."
 SOV_enforce_liberal_values: "Superioridad de los Valores Liberales"
 SOV_enforce_liberal_values_desc: "El liberalismo es la base de una Rusia libre y próspera. Debemos defender y difundir estos valores mientras reconstruimos la nación."
 SOV_focus_on_economy: "Milagro Económico Ruso"
 SOV_focus_on_economy_desc: "La era liberal promete una reactivación económica. Mediante la apertura de los mercados y la implementación de reformas, daremos paso a una nueva era de prosperidad, paz y libertad."
 SOV_abandon_foreign_policy: "Abandonar la Política Exterior"
 SOV_abandon_foreign_policy_desc: "La Guerra Fría ha terminado. Ya no somos una amenaza comunista para Occidente. Es hora de dejar atrás los agravios del pasado y abrazar una paz duradera."
 SOV_age_of_stability: "Rusia Estable"
 SOV_age_of_stability_desc: "Tras décadas de agitación y desigualdad, Rusia ha encontrado la paz. Con un reformista visionario al mando, entramos en una era de estabilidad duradera y unidad nacional."
 SOV_establish_controlled_opposition: "Establecer Oposición Controlada"
 SOV_establish_controlled_opposition_desc: "Una oposición controlada dentro de la Duma creará la apariencia de democracia y nos permitirá aprobar reformas sin obstáculos."
 SOV_special_economic_operation: "Operación Económica Especial"
 SOV_special_economic_operation_desc: "Bielorrusia y Ucrania deben comprender que la era putinista ha terminado. Nos conectaremos con ellos mediante la cooperación, no la coerción, y reconstruiremos nuestras relaciones en nuevos términos."
 SOV_the_iron_dimon: "Regla de Hierro"
 SOV_the_iron_dimon_desc: "El pueblo está cansado de la debilidad. Exige fuerza. Un verdadero líder, firme, inflexible y resuelto, se alzará para responder a esa llamada."
 SOV_the_new_dictatorship: "Nueva Dictadura"
 SOV_the_new_dictatorship_desc: "Para consolidar nuestra autoridad, adoptaremos la estructura y la eficiencia de una nueva dictadura, adaptada a las necesidades modernas."
 SOV_medvedeism: "Medvedeismo"
 SOV_medvedeism_desc: "El putinismo le falló a la nación. Ahora llega una nueva doctrina: el medvedevismo, diseñada para corregir el pasado y guiar a Rusia hacia el futuro."
 SOV_defend_national_interests: "Defender los Intereses Nacionales"
 SOV_defend_national_interests_desc: "Con el Estado asegurado, miraremos hacia el exterior. Las legítimas tierras del pueblo ruso deben regresar bajo nuestra protección."
 iron_dimon: "Dimon de Hierro"
 pro_western_dima: "Verdadero Liberal"
 russian_duumviri: "Duumviros Rusos"
 SOV_dimon: "Gran Rusia"
 sov_medvedev.1.t: "¡Medvedev le quita el poder a Putin!"
 sov_medvedev.1.d: "Colocado originalmente en el cargo para eludir los límites de mandatos presidenciales, Dmitri Medvédev ha salido por fin de la sombra de Putin. Con su rival eliminado, Medvédev se encuentra solo al timón del poder ruso. Comienza un nuevo capítulo en la historia de Rusia."
 sov_medvedev.1.a: "Nuestro futuro es incierto."
 sov_medvedev.5.t: "Obertura diplomática rechazada"
 sov_medvedev.5.d: "Nuestras propuestas diplomáticas han sido rechazadas. La nación objetivo ha declinado nuestras ofertas, citando preocupaciones sobre su soberanía e independencia política."
 sov_medvedev.5.a: "Un revés"
 sov_student_rallies.t: "Estallan protestas estudiantiles"
 sov_student_rallies.d: "Estudiantes universitarios de las principales ciudades han tomado las calles exigiendo reformas políticas y mayores libertades civiles. Las protestas están creciendo en escala e intensidad."
 sov_student_rallies.a: "Reprimir las protestas"
 sov_student_rallies.b: "Permitirles manifestarse"
 SOV_putinism_system_protest: "Protesta contra el Sistema de Putin"
 sov_medvedev.4.t: "Rusia propone un reinicio de las relaciones"
 sov_medvedev.4.d: "El nuevo gobierno ruso, con una postura más prooccidental que el régimen de Putin, ha presentado una oferta para restablecer las relaciones. Sus diplomáticos proponen un nuevo comienzo, un 'reinicio' para la cooperación."
 sov_medvedev.4.a: "Por supuesto! Los rusos pueden ser buenos amigos."
 sov_medvedev.4.b: "No podemos ser amigos de ellos."
 sov_medvedev.6.t: "¡Putin y Medvedev proclaman el duumvirato!"
 sov_medvedev.6.d: "In un sorprendente movimiento político, el presidente y el primer ministro de Rusia han anunciado conjuntamente que gobernarán juntos en un diunvirato formal. Esta disposición sin precedentes remodela la estructura de poder de Rusia."
 sov_medvedev.6.a: "Bien"
 sov_medvedev.7.t: "El nuevo régimen ruso"
 sov_medvedev.7.d: "Nuestro presidente se ha vuelto cada vez más activo en las redes sociales, expresando nuevas y audaces opiniones sobre Occidente. Su retórica ha cambiado drásticamente, señalando el regreso de Rusia a una senda de independencia asertiva."
 sov_medvedev.7.a: "Los odio, son bastardos y degenerados."
 sov_medvedev.8.t: "El giro de Rusia hacia Occidente"
 sov_medvedev.8.d: "El presidente ha anunciado una nueva y audaz política. Rusia ahora verá a Occidente no como un enemigo, sino como un socio vital. Nuestra nación da un giro radical."
 sov_medvedev.8.a: "Dios bendiga a América!... y a Rusia!"
 SOV_kob_party_start: "Unidad del Partido Conceptual"
 SOV_kob_party_start_desc: "La Unidad Conceptual del Partido, liderada por nuestro visionario líder, el general Konstantin Petrov, ha tomado el poder. Es hora de librar una guerra ideológica contra el Predictor Corrector y liberar a Rusia de sus cadenas ocultas."
 SOV_kobnod: "Movimiento del Pueblo Ruso por el Poder de Dios"
 SOV_establish_militar_loyal: "Establecer Lealtad Militar"
 SOV_establish_militar_loyal_desc: "El general Petrov debe asegurar la lealtad absoluta del ejército. Todas las ramas deben jurarle fidelidad como Glavkoverkh, el comandante supremo de toda Rusia."
 SOV_establish_loyalistii: "Loyalismo Regional"
 SOV_establish_loyalistii_desc: "Debemos colocar a miembros devotos del partido en posiciones regionales de poder para garantizar una lealtad absoluta y evitar cualquier resistencia a nuestro camino a seguir."
 SOV_regional_control: "Purgar la Oligarquía"
 SOV_regional_control_desc: "Los oligarcas han drenado la sangre de nuestro pueblo durante demasiado tiempo. Ahora, contraatacaremos y libraremos a la tierra de estas élites parásitas."
 SOV_establish_new_religion: "Nueva Política Religiosa"
 SOV_establish_new_religion_desc: "Las religiones organizadas modernas se crearon para esclavizar las mentes y suprimir el pensamiento independiente. Debemos liberar a la gente de esta esclavitud mental."
 SOV_internet_propaganda: "Propaganda en Internet"
 SOV_internet_propaganda_desc: "Pocos comprenden el verdadero poder de internet. Al igual que Predictor Corrector antes que nosotros, lo utilizaremos para transformar el pensamiento público y acabar con la falsa conciencia."
 SOV_course_of_truth: "Curso de la Verdad"
 SOV_course_of_truth_desc: "Durante demasiado tiempo, el clero ortodoxo ha ocultado las verdades más profundas al pueblo. Ahora, sacaremos a la luz estos secretos y expondremos la verdad completa de nuestra historia."
 SOV_new_cosmic_warfare_desc: "El general Petrov, especialista en guerra espacial, ve las estrellas como la próxima frontera de Rusia. Debemos restaurar y avanzar el legado del programa espacial soviético."
 SOV_russian_knights_desc: "En el núcleo del espíritu ruso se encuentra el alma del Vityaz, el noble guerrero. Aunque son pocos en número, estos caballeros modernos llevan el legado de la Rus al campo de batalla."
 SOV_russian_knights: "Vityaz Ruso"
 SOV_new_cosmic_warfare: "Nueva Guerra Cósmica"
 SOV_remaking_constitution: "Rehacer la Constitución"
 SOV_remaking_constitution_desc: "La Constitución actual restringe nuestra voluntad de reforma. Debe ser reescrita por completo para reflejar nuestra visión sobre el futuro divino de Rusia."
 SOV_iron_hand_of_koba: "Legado Estalinista"
 SOV_iron_hand_of_koba_desc: "Stalin fue el heredero espiritual de los zares y el arquitecto de una Rusia disciplinada y fuerte. Debemos revivir su legado y seguir el camino que forjó."
 SOV_natural_bloshevism: "Bolchevismo Natural"
 SOV_natural_bloshevism_desc: "La caída del régimen zarista y el auge del bolchevismo no fueron coincidencias. Fueron la evolución natural de nuestra nación. Debemos abrazar este destino por completo."
 SOV_slavic_reincarnation: "Reencarnación Eslava"
 SOV_slavic_reincarnation_desc: "El verdadero renacimiento espiritual reside en las creencias de nuestros antepasados. Todas las religiones extranjeras deben ser abolidas en favor del retorno al paganismo eslavo nativo."
 SOV_merge_pantheons: "Fusionarse con Zvenyashie Kedry"
 SOV_merge_pantheons_desc: "Al unirnos con Zvenyashie Kedry, podemos combinar nuestras creencias sagradas en una única fe poderosa para oponernos a las manipulaciones de los sacerdotes egipcios."
 SOV_support_nod: "Apoyar a NOD"
 SOV_support_nod_desc: "El movimiento NOD es ferozmente antioccidental. Su ideología coincide con la nuestra y debería integrarse en nuestra administración."
 SOV_educational_water: "Agua Muerta"
 SOV_educational_water_desc: "Agua Muerta, una doctrina político-religiosa inspirada en el folclore ruso y desarrollada inicialmente por el hermético Centro Sacerdotal de la Unión Soviética, busca revitalizar espiritualmente al pueblo. Actualmente constituye la base ideológica de nuestra Unidad Conceptual del Partido."
 SOV_search_for_priests: "Buscar a los Sacerdotes"
 SOV_search_for_priests_desc: "Los sacerdotes egipcios han manipulado el mundo desde las sombras durante demasiado tiempo. Debemos erradicar a sus agentes ocultos en nuestras fronteras."
 SOV_purge_westernists: "Purgar a los Occidentalistas"
 SOV_purge_westernists_desc: "Los occidentalistas son sirvientes ciegos del capitalismo global. Su influencia tóxica debe ser eliminada de nuestro gobierno y sociedad."
 SOV_revolutions_in_other_slavic_states: "Revolución Bogorodichnaya"
 SOV_revolutions_in_other_slavic_states_desc: "Debemos extender la revolución por todas las tierras eslavas para liberar a nuestros hermanos del control del Predictor Corrector. La era de la liberación ha llegado."
 SOV_seek_for_them_in_israel: "Buscarlos en Israel"
 SOV_seek_for_them_in_israel_desc: "Según el general Petrov, los sacerdotes egipcios podrían tener agentes incluso en Israel. Debemos investigar y exponer su influencia oculta allí."
 SOV_seek_for_them_in_swiss: "Buscarlos en Suiza"
 SOV_seek_for_them_in_swiss_desc: "Desde hace tiempo se rumorea que Suiza es la sede del Predictor Corrector. Investigaremos cada rincón para descubrir la verdad."
 SOV_seek_for_them_in_egypt: "Buscarlos en Egipto"
 SOV_seek_for_them_in_egypt_desc: "Quizás los sacerdotes egipcios se hayan ocultado en la cuna misma de su poder. Debemos buscar la verdad en su antigua patria."
 SOV_kill_predictor_corrector: "Matar al Predictor Corrector!"
 SOV_kill_predictor_corrector_desc: "Hemos descubierto la ubicación del Predictor Corrector. Ha llegado el momento de comenzar nuestra santa cruzada contra el capitalismo, la manipulación y los enemigos de la verdad."
 SOV_semibankirshina_desc: "Semibankirshina, o 'el grupo de los siete banqueros', se refiere a los oligarcas más poderosos que alguna vez tuvieron enorme influencia sobre la política rusa durante la era Yeltsin."
 SOV_enforce_oligarhic_rule: "Imponer el Gobierno Oligárquico"
 SOV_enforce_oligarhic_rule_desc: "El Estado ha oprimido a los oligarcas durante demasiado tiempo, sin hacer mucho por el progreso económico. Es hora de transferir el poder a quienes realmente impulsan el crecimiento."
 SOV_revive_oligarch_influence: "Revivir la Influencia Oligárquica"
 SOV_revive_oligarch_influence_desc: "Es hora de que nuestro círculo de oligarcas recupere su prominencia y reclame nuestra influencia sobre la gobernanza rusa."
 SOV_bring_the_old_gang_from_abroad: "Traer de Vuelta a la Vieja Pandilla del Extranjero"
 SOV_bring_the_old_gang_from_abroad_desc: "Muchos de nuestros antiguos aliados se vieron obligados a exiliarse. Ahora que la situación ha cambiado, podemos invitarlos a casa y reconstruir nuestro imperio de influencia."
 SOV_privatize_state_corporations: "Privatizar Corporaciones Estatales"
 SOV_privatize_state_corporations_desc: "La economía estatal bajo el gobierno de Putin era ineficiente y desmesurada. Debemos desmantelar estas corporaciones y devolverlas a manos privadas."
 SOV_move_oligarchic_entites_back_to_russia: "Mover Entidades Oligárquicas de Vuelta"
 SOV_move_oligarchic_entites_back_to_russia_desc: "La riqueza rusa oculta en el extranjero debe regresar a casa. Con nuestro control establecido, podemos utilizar estos recursos para financiar tanto las ganancias como el progreso."
 SOV_exploit_natural_wealth: "Explotar la Riqueza Natural de Rusia"
 SOV_exploit_natural_wealth_desc: "Rusia posee vastas reservas de recursos naturales. Los extraeremos con eficiencia, manteniendo al pueblo contento y a los oligarcas ricos."
 SOV_semi_criminal_government: "Gobierno Semi-Criminal"
 SOV_semi_criminal_government_desc: "Los oligarcas tienen vínculos de larga data con el crimen organizado. ¿Para qué combatirlo? Formalizaremos el acuerdo y los incorporaremos al gobierno."
 SOV_end_lawsuits_against_oligarchs: "Fin de las Demandas contra Oligarcas"
 SOV_end_lawsuits_against_oligarchs_desc: "Putin libró una guerra legal contra los oligarcas para asegurar su control. Pondremos fin a esta injusticia y devolveremos la dignidad a nuestros ciudadanos más exitosos."
 SOV_restore_semibankirshina: "Restaurar Semibankirshina"
 SOV_restore_semibankirshina_desc: "La Semibankirshina, los siete poderosos banqueros, ha regresado. Con Putin fuera del camino, ahora se mantienen unidos, listos para moldear el destino de Rusia una vez más."
 SOV_back_to_the_west: "Regresar al Oeste"
 SOV_back_to_the_west_desc: "Antagonizar con Occidente ha devastado nuestra economía. Es hora de abandonar la obsoleta hostilidad de la Guerra Fría y fomentar nuevas alianzas para la prosperidad."
 SOV_russian_laissez_faire: "Laissez-faire Ruso"
 SOV_russian_laissez_faire_desc: "El capitalismo de libre mercado regresa a Rusia. Ha llegado el momento de la libre empresa y la riqueza para aquellos lo suficientemente audaces como para aprovecharla."
 SOV_oligarchs_democracy: "Cegado por sus promesas"
 SOV_oligarchs_democracy_desc: "La victoria electoral de las fuerzas prooligárquicas conmocionó a muchos. Cegados por las promesas, el pueblo eligió a las mismas élites que antaño saquearon la nación bajo el gobierno de Yeltsin."
 sov_oligarchs.1.t: "Reorganización del gobierno!"
 sov_oligarchs.1.d: "Los oligarcas estuvieron debilitados una vez, pero ya no. En sus esfuerzos por asegurar su apoyo, el presidente les ha concedido una influencia sin precedentes. Ministros leales a los oligarcas están tomando el poder, marcando el inicio de una nueva era de dominio de las élites."
 sov_oligarchs.1.a: "Dios salve a Rusia..."
 sov_oligarchs.2.t: "Guzinsky regresa a Rusia!"
 sov_oligarchs.2.d: "El magnate de los medios rusos Vladímir Gusinski, una vez exiliado por las autoridades anteriores, ha regresado. Las tornas han cambiado y se le da la bienvenida de vuelta."
 sov_oligarchs.2.a: "Bienvenido de nuevo!"
 sov_oligarchs.3.t: "Berezovskiy regresa a Rusia!"
 sov_oligarchs.3.d: "Borís Berezovski, uno de los oligarcas más ricos y polémicos de Rusia, ha regresado. Se siente como si estuviéramos en la década de 1990 de nuevo."
 sov_oligarchs.3.a: "¡Como en los años 90!"
 sov_oligarchs.4.t: "Semibankirshina toma el poder en Rusia!"
 sov_oligarchs.4.d: "La influencia oligárquica ha alcanzado su punto máximo. Los siete magnates de la era de Yeltsin han aplastado a todos sus rivales y han tomado el poder. El futuro del gobierno ruso descansa ahora en sus manos, pero la pregunta sigue en el aire: ¿quién liderará?"
 sov_oligarchs.4.a: "Gobierno directo del Consejo!"
 sov_oligarchs.4.b: "Tendremos nuevas Elecciones con otro candidato."
 sov_oligarchs.4.c: "Podríamos manipular al Presidente actual."
 sov_oligarchs.5.t: "Elecciones amañadas!"
 sov_oligarchs.5.d: "Para legitimar nuestro gobierno, debemos convocar nuevas elecciones y asegurar la victoria del partido Rusia Liberal. El único dilema es elegir un candidato presidencial: ¿un títere o uno de los nuestros?"
 sov_oligarchs.5.a: "Nevzorov es nuestro candidato!"
 sov_oligarchs.5.b: "Boris Berezovsky será el Presidente."
 sov_oligarchs.5.c: "Mikhail Khodorkovsky será el Presidente."
