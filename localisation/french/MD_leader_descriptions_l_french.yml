 DONALD_TRUMP_LEADER_DESC: "Donald John Trump (né le 14 juin 1946) est le fils multimilliardaire du promoteur immobilier Frederick Christ Trump. Avec un modeste prêt d'un million de dollars, Trump a fondé et développé de nombreuses entreprises sous la Trump Organization depuis 1971. Connu pour ses coups de gueule virulents et son style de gestion impulsif hérité de son époque de personnalité de la télévision, Trump s'est rapidement fait autant d'ennemis que d'amis. Dès son accession à la présidence, il promet de freiner l'immigration illégale, d'augmenter les dépenses militaires, d'instaurer des tarifs douaniers protectionnistes et de placer résolument les États-Unis au premier plan (« America First »)."
 MITT_ROMNEY_LEADER_DESC: "Willard Mitt Romney (born March 12, 1947) is one of four children born to automobile executive George W. Romney. A devout Mormon and firm believer in laissez-faire economics and conservative family values; Romney vows to use his years of business experience to cut government waste, increase military spending, and remove restrictions put on Wall Street and large corporations."
 GEORGE_BUSH_LEADER_DESC: "George Walker Bush (né le 6 juillet 1946) est le premier enfant de George Herbert Walker Bush, qui a été le 41ème président américain de 1989 à 1993. Après un bref passage dans l'industrie pétrolière, Bush est entré en politique et est devenu gouverneur du Texas. Se présentant comme un conservateur compatissant, Bush promet de réduire les impôts, d'augmenter les dépenses militaires et de déréglementer le secteur des entreprises en supprimant les restrictions inutiles sur les émissions de gaz à effet de serre."
 MARCO_RUBIO_LEADER_DESC: ""
 BERNIE_SANDERS_LEADER_DESC: "Bernard Sanders (born September 8, 1941) is the son of working class Polish immigrants to the United States. Joining the Young People's Socialist League during his college years, Sanders advocated for the equal treatment of whites and blacks during the Civil Rights Movement. Sanders later became mayor of Burlington, Vermont, and was eventually elected to the U.S. House of Representatives and U.S. Senate. A self-described democratic socialist and progressive, Bernie Sanders vows to reduce military spending, increase the power of labor unions and create a universal healthcare system."
 HILLARY_CLINTON_LEADER_DESC: ""
 BARACK_OBAMA_LEADER_DESC: ""
 BILL_CLINTON_LEADER_DESC: ""
 GARY_JOHNSON_LEADER_DESC: ""
 RAND_PAUL_LEADER_DESC: ""
 DAVID_DUKE_LEADER_DESC: ""
 ANN_COULTER_LEADER_DESC: ""
 JIANG_ZEMIN_LEADER_DESC: "Jiang Zemin (born August 17, 1926) is a former engineer who has led the Communist Party since 1989, replacing the reformist Zhao Ziyang in the wake of the Tiananmen Square protests. Previously he served as mayor of Shanghai and his continued favoring of individuals who served with him in Shanghai has led to his faction of the party being dubbed the \"Shanghai Clique\". An advocate of economic reform, his rule in the 1990s has seen a continuation of Deng Xiaoping's policy of reform and opening up and a normalizing of the private sector. He has also presided over the return of both Hong Kong and Macau to Chinese sovereignty and has faced criticism over his heavy-handed approach to human rights."
 HU_JINTAO_LEADER_DESC: "Hu Jintao (né le 21 décembre 1942) est un ancien ingénieur qui a subi la dénonciation de son père pendant la Révolution culturelle. En tant que dirigeant, il a exprimé le désir de s'attaquer aux impacts de la croissance économique rapide sur la société et l'environnement chinois et dirige la faction Tuanpai ou Ligue de la jeunesse communiste du Parti communiste. Avec le premier ministre Wen Jiabao, Hu cherche à répartir plus équitablement les bénéfices du développement économique de la Chine et à adopter un mode de gouvernance moins élitiste tout en maintenant fermement la primauté du Parti communiste."
 XI_JINPING_LEADER_DESC: "Xi Jinping (né le 15 juin 1953) fait partie d'une nouvelle génération de responsables chinois connus sous le nom de princes rouges. Fils d'un vétéran du Parti communiste, Xi a mis l'accent sur la centralisation et la consolidation du pouvoir sous sa direction, affaiblissant ses rivaux politiques et les factions existantes du Parti communiste par le biais de ses campagnes anti-corruption. Il est également partisan d'une politique étrangère affirmée, marquant une rupture avec la politique de Deng Xiaoping qui consistait à garder un profil bas dans les affaires internationales."
 BO_XILAI_LEADER_DESC: "Bo Xilai (born July 3, 1949) is a well-known princeling and son of former Vice Premier Bo Yibo. Known for his tenure as Party Secretary of Chongqing, Bo is associated with his campaign against organized crime and his revival of \"red culture\" which has won him support among leftists dissatisfied with the inegalitarian trajectory of China's economic growth. Bo has earned many enemies during his political career, and has a controversial reputation."
 KIM_DAE_JUNG_LEADER_DESC: "Kim Dae-jung (né le 6 janvier 1924) est une figure respectée de la politique sud-coréenne en raison de sa longue histoire d'activisme pro-démocratique, certains le qualifiant de « Nelson Mandela de l'Asie ». Après avoir survécu à une tentative d'assassinat présumée, à un enlèvement par des agents des services de renseignement, ainsi qu'à une condamnation à mort, Kim a finalement émergé de près de 50 ans d'opposition pour diriger son pays. Depuis son arrivée au pouvoir en 1998, il s'est fixé comme priorités de relancer l'économie, de demander des comptes aux puissants chaebols coréens et de nouer le dialogue avec la Corée du Nord dans le cadre de sa politique d'ouverture."
 ROH_MOO_HYUN_LEADER_DESC: "Roh Moo-hyun (né le 6 août 1946) est un ancien avocat des droits de l'homme issu d'un milieu pauvre qui a défendu les étudiants protestataires contre le régime autoritaire. Tout comme Kim Dae-jung, qui a soutenu sa présidence, Roh privilégie les négociations avec le Nord plutôt qu'une politique d'isolement international. Il a également critiqué ouvertement les États-Unis et le Japon, et entretient une relation antagoniste avec les conservateurs coréens. Roh bénéficie du soutien de la « génération 386 » de gauche qui ont la trentaine, sont allés à l'université dans les années 80 et sont nés dans les années 60."
 LEE_MYUNG_BAK_LEADER_DESC: "Lee Myung-bak (né le 19 décembre 1941) est un homme politique conservateur et ancien PDG de Hyundai. Au cours de son passage chez Hyundai, il a été surnommé « le bulldozer », en partie à cause de son approche autoritaire de la gestion. Personnage ambitieux, Lee espère transformer la Corée en l'une des plus grandes économies du monde et promouvoir une politique étrangère mondialiste qui élèvera le statut mondial de la Corée. Contrairement à ses homologues de gauche, Lee est partisan d'une approche dure à l'égard de la Corée du Nord et d'un partenariat étroit avec les États-Unis."
 PARK_GEUN_HYE_LEADER_DESC: "Park Geun-hye (née le 2 février 1952) est surtout connue pour être la fille de Park Chung-hee, l'ancien dirigeant autoritaire de la Corée dont l'héritage reste controversé. Si certains considèrent Park Chung-hee comme un dictateur brutal qui a eu recours à la torture et à l'emprisonnement pour préserver son pouvoir, d'autres le louent pour ses réalisations économiques. Dans sa jeunesse, Park a survécu à l'assassinat de son père et de sa mère, le premier aux mains d'un agent nord-coréen et le second aux mains du chef de l'Agence centrale de renseignement coréenne. Connue pour ses positions conservatrices et axées sur le marché, Mme Park est favorable à la déréglementation, à la réduction des impôts et à la loi et l'ordre."
 MOON_JAE_IN_LEADER_DESC: "Moon Jae-in (born January 24, 1953) is the son of North Korean refugees and a former human rights lawyer and activist. During his military service, Moon served as a special forces commando and took part in Operation Paul Bunyan, the ROK-USA joint response to the 1976 Panmunjom axe murder incident. A close friend of his predecessor Roh Moo-hyun, whom he had previously started a legal practice with, Moon was active in Roh's left-wing administration and was an important player in the Sunshine Policy, which he remains committed to. While committed to the US alliance, Moon has stated that Korea should learn how to say no to the Americans and hopes to take back wartime control of the Korean military from the US."
 KIM_JONG_UN_LEADER_DESC: "Kim Jong-un (born January 8, 1984) was the son most valued by Kim Jong-il during his lifetime. During his days studying in Switzerland, his slightly obese frame made it possible to underestimate him. But when he did ascend to the throne, he shocked the world with his calmness, shrewdness and ruthlessness in the secret executions of his political enemies (including, according to unconfirmed reports, the execution of his paternal uncle with anti-aircraft guns), his determination to continue developing nuclear weapons despite international sanctions, and his precise timing of the friendly dialogue with the US and South Korea. Under his leadership as a \"great man from heaven\", perhaps there is a real possibility of North Korea becoming the \"Strong and Prosperous Nation\"?"
 KIM_JONG_NAM_LEADER_DESC: "Kim Jong-nam, né le 10 mai 1971, est le fils de Kim Jong-il et de sa seconde épouse. En tant que fils aîné de sa famille, Kim Jong-nam a été témoin de la misère du peuple sous la « Marche forcée ». Au cours de son séjour à l'étranger, il a assisté au développement rapide de la réforme et de l'ouverture de la Chine et a été impressionné par le pouvoir du changement. Il était convaincu que seule la réforme pouvait apporter la prospérité matérielle et le bonheur spirituel au peuple nord-coréen, mais il comprenait également que le changement pouvait lui coûter son pouvoir. Mais il ne l'a jamais regretté."
 KIM_YO_JONG_LEADER_DESC: "Kim Yo-jong (née le 26 septembre 1987), seule fille de sa famille, a fait preuve d'un tel talent depuis le début de sa carrière politique que Kim Jong-il s'est exclamé en choisissant son successeur : « Si seulement Kim Yo-jong était un garçon ». C'est peut-être en raison de son image féminine qu'elle bénéficie d'un soutien important, tant à l'intérieur du pays qu'à l'étranger. Aujourd'hui, son règne prouve que les femmes peuvent faire aussi bien que les hommes, quel que soit le type de politique du pays."
 POLITICS_PAUL_KAGAME_DESC: "À 28 ans, Paul Kagame a contribué à renverser le gouvernement de l'Ouganda. À 36 ans, il a renversé le gouvernement génocidaire du Rwanda dirigé par les Hutus. À 39 ans, il a chassé Mobutu de la République démocratique du Congo, le dictateur le plus corrompu et le plus répressif d'Afrique. Kagame est probablement le chef militaire le plus efficace du monde, ayant gagné plus de guerres que quiconque, le tout avec un budget très serré. Tout en réprimant toute opposition à l'intérieur du pays, le général tutsi ne cesse de fixer ses yeux sur de nouvelles ambitions à l'étranger, en chassant les rebelles hutus et en exploitant les richesses minières."
 costas_simitis_desc: "Kóstas Simítis (né le 23 juin 1936) est le fils de George Simítis, avocat et professeur à l'université économique d'Athènes. Ayant participé à des organisations anti-gouvernementales pendant la junte grecque, Kóstas Simítis a été, peu après la chute de la junte, un membre fondateur du Mouvement socialiste panhellénique (PASOK) en 1974. Lors de la victoire électorale du PASOK en 1981, il a été appelé à occuper de nombreux postes gouvernementaux sous le gouvernement d'Andréas Papandréou, notamment celui de chef du département de l'économie, de l'agriculture, de l'éducation et de la religion, ainsi que celui de directeur simultané des départements de l'industrie, de la recherche, de l'énergie, de la technologie et du commerce. Après la mort d'Andréas Papandréou en 1996, il a été élu à la tête du PASOK et a remporté peu après les élections générales de 1996. Aujourd'hui, Kóstas Simítis cherche à accroître régulièrement les privatisations dans le secteur public, la stabilité économique, la réduction de la dette nationale, la résolution des conflits gréco-turcs et, surtout, le renforcement des liens et de la coopération avec l'Union européenne."
 nikolaos_michaloliakos_desc: "Nikolaos Michaloliakos (born December 11th, 1957) is the founder of Golden Dawn, the largest nationalist party of Greece. Michaloliakos was a supporter of the Greek Military regime and known for participating in many extremist right wing groups which had committed attacks on many anti dictatorship figures as well as a relation with the head of the Greek Junta Georgios Papadopoulos. In 1980, he formed the Golden Dawn far right party which aims to have an anti-leftist agenda, anti immigration, glorifying Greek authoritarian regimes such as the 1967 Junta and the 4th of August 1936 regime and aligning to Russia and China and moving away from the west. Michaloliakos and his Golden Dawn party have been condemned as a criminal organization which targets minorities and has pro-neo-nazi and fascist views as well as an anti-democratic stance. In spite of the backlash against him Nikolaos Michaloliakos and his party have been rising in popularity as economic instability and social divides have been plunging Greece it has drawn more supporters to the Golden Dawn cause. If the situation becomes worse Nikolaos Michaloliakos may achieve his goals, taking power and building a new Greek state"
 COUNCIL_FOR_NATIONAL_PRESERVATION_DESC: "The Council is a rump remnant of what was the federal government of the former United States. As such whatever is left is attempting to rally what people and territory it has left around a new flag. Members of the council look to create a sense of law and order as well as a sense of peace, this way they can then conduct a smooth transition of power to a new administration."
 MATHEW_CROUDER_DESC: "The \"Marshal\", or simply Mat/Mathew, is a bit of a paradox. Both talkative yet overtly quiet this young man has a sort of scatter brain approach to handling things or doing things that interest him. Despite his initial unlikeliness to become any kind of leader, his own soft power in terms of making acquaintances as well as his more gentle personality makes him a fairly relatable person. Though he has been known to be a bit of a hot head at times in more confrontational matters, he strives to do what he can for as many as he can. As he was once quoted by an interviewer, \"Life is a strange and confusing mess, you never truly know where you will end up even if you wanted to do something you may certainly find yourself doing the complete opposite. I mean from JROTC in high school, to the odd hobby of writing a constitution and exploring the idea of a micro-nation, I never once would have even dreamed of being a political leader... Let alone one on a federal level.\" This somewhat naivety yet sort of boundless optimism has seen Mathew now put in charge of the Southern Republic of America, though what he'll do not many know, for now we just wait and see."
 CONGRESSIONAL_CHAMBERS_DESC: "With the electoral college failing and the election having...unexpected issues in the state of Florida, congress scrambles to try and figure out who to vote for or at the very least get into the president's seat before things boil over any more than they already have."
 YOON_SUK_YEOL_LEADER_DESC: "Yoon Suk Yeol (né le 18 décembre 1960) était l'ancien procureur général de la République de Corée et procureur en chef du parquet du district central de Séoul. Durant sa présidence, il a déclaré l'état d'urgence martial, accusant l'opposition de contrôler l'Assemblée nationale, de sympathiser avec la Corée du Nord et de paralyser le gouvernement par des activités anti-étatiques. Mais l'Assemblée nationale a ensuite voté la levée de l'état d'urgence martial. Depuis, Yoon Suk Yeol a été inculpé de sédition et interdit de quitter le territoire, devenant ainsi le premier président en exercice de l'histoire de la Corée du Sud à se voir interdire de quitter le territoire. Plus tard, Yoon Suk Yeol a été arrêté, devenant ainsi le premier président en exercice de l'histoire de la Corée du Sud à être arrêté."