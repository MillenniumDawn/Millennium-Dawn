 GRE_vision_2030: "Военное видение"
 GRE_vision_2030_desc: "Наши вооруженные силы отстали после многих лет жесткой экономии и устаревших представлений времен холодной войны. У нас устаревшее оборудование, раздутые структуры и армия, которая не отражает угрозы, с которыми мы сталкиваемся. Этот план — самая амбициозная оборонная реформа в современной греческой истории."
 GRE_armored_transition: "Бронированный переход"
 GRE_armored_transition_desc: "БМП-1 и М48 «Паттон» отслужили свой срок. Снятие с вооружения нашей бронетехники времен холодной войны и переход на «Леопард-2» в его греческом варианте позволит нашим бронетанковым бригадам иметь танковые силы, способные конкурировать с любым соперником в регионе."
 GRE_pzh_2000: "Гаубицы PzH 2000"
 GRE_pzh_2000_desc: "Наша артиллерия должна идти в ногу с современными требованиями бронетанковой войны. Самоходная гаубица PzH 2000 обеспечит нашим войскам высокоточный огонь на дальних дистанциях и гарантирует, что наши сухопутные командиры всегда будут иметь эффективную огневую поддержку с непрямой позиции."
 GRE_m270_mlrs: "M270 MLRS"
 GRE_m270_mlrs_desc: "Для прикрытия высадки на острова и нанесения ударов по прибрежным целям в Эгейском море требуется огневая мощь, выходящая за пределы линии фронта. Реактивный пусковой комплекс М270 обеспечил бы нашей армии такую дальность стрельбы."
 GRE_puls_rocket: "Ракетная система PULS"
 GRE_puls_rocket_desc: "Благодаря совместной программе EURO-PULS с Израилем и нашими европейскими партнерами мы можем создать высокоточную реактивную артиллерийскую систему, способную поражать цели на больших дистанциях. Это заставит любого противника в Эгейском море дважды подумать."
 GRE_special_warfare_command: "Командование специальных операций"
 GRE_special_warfare_command_desc: "Объединение наших подразделений EKAM, диверсионных бригад, боевых водолазов и десантников под эгидой единого командования специальных операций позволило бы нам создать элитные силы, способные действовать на наших островах и за их пределами. В современной войне небольшие и смертоносные подразделения могут решать исход событий, недоступный для целых дивизий."
 GRE_archipelagos_strategy: "Стратегия архипелагов"
 GRE_archipelagos_strategy_desc: "Наши тысячи островов не являются обузой. При надлежащей обороне и последовательной доктрине они превращаются в многоуровневый барьер, который ни один вражеский флот не сможет преодолеть без тяжелых потерь. Мы должны использовать географическое положение Эгейского моря в своих интересах."
 GRE_f16_modernisation: "Модернизация F-16"
 GRE_f16_modernisation_desc: "Модернизация 83 наших истребителей F-16 до стандарта Block 70/72 Viper при содействии Греческой аэрокосмической промышленности позволит поддерживать наш истребительный парк в хорошем состоянии, а также развивать отечественный опыт, необходимый для будущего технического обслуживания F-35."
 GRE_intl_flight_training: "Международный центр подготовки пилотов"
 GRE_intl_flight_training_desc: "Открытие наших учебных центров для пилотов стран-союзников укрепит добрые отношения, углубит военные связи и даст нашим собственным пилотам опыт обучения в соответствии с международными стандартами."
 GRE_new_transport_helicopters: "Новые транспортные вертолеты"
 GRE_new_transport_helicopters_desc: "Быстрая транспортировка между нашими островами имеет решающее значение для их обороны. Наличие 35 вертолетов UH-60M Black Hawk наряду с нашими MH-60R Seahawk позволит нам увеличить транспортную мощность для усиления любых угрожаемых позиций до того, как противник сможет закрепиться."
 GRE_f35_program: "Сотрудничество в рамках программы F-35"
 GRE_f35_program_desc: "Участие в программе F-35 даёт нам истребитель-невидимку пятого поколения, которому нет равных в регионе. Контракт, подписанный в июле 2024 года, является важной вехой для ВВС Греции и ставит наших пилотов впереди всех остальных в Эгейском море."
 GRE_patriot_air_defense: "Системы противовоздушной обороны «Патриот»"
 GRE_patriot_air_defense_desc: "Наши батареи Nike Hercules слишком устарели, чтобы противостоять современным угрозам. Модернизация до самолетов Patriot PAC-3 с перехватчиками MSE наконец-то обеспечит Греции реальную защиту от баллистических ракет и защитит нашу критически важную инфраструктуру."
 GRE_centauros_anti_drone: "Система защиты от дронов «Центаурос»"
 GRE_centauros_anti_drone_desc: "Система Centauros C-UAS была разработана греческой аэрокосмической промышленностью и доказала свою эффективность в операциях в Красном море. Ее развертывание на наших островах, военно-морских базах и аэродромах является приоритетной задачей. Беспилотники представляют собой самую большую угрозу в современной войне, и нам необходимо уметь им противостоять."
 GRE_achilles_shield: "Щит Ахиллеса"
 GRE_achilles_shield_desc: "Интеграция наших зенитных ракетных комплексов Patriot, систем защиты от беспилотников Centauros и береговых ракетных систем в единую сеть, охватывающую все Эгейское море, создаст зону ограниченного доступа, которая сделает любое нападение на греческую территорию чрезвычайно дорогостоящим."
 GRE_kimon_class_frigate: "Фрегат класса «Кимон»"
 GRE_kimon_class_frigate_desc: "После многих лет отмененных программ мы наконец-то подписали соглашение с Naval Group на поставку трех фрегатов FDI HN с опцией на четвертый. Фрегаты класса Kimon обеспечат ВМС Греции полноценным надводным боевым кораблем, способным противостоять любому флоту в регионе."
 GRE_hydra_class_upgrade: "Модернизация класса «Гидра»"
 GRE_hydra_class_upgrade_desc: "Фрегаты класса «Гидра» — это корабли типа MEKO 200HN, построенные на верфи «Скарамангас» в 1990-х годах, и они составляют основу наших надводных боевых сил. Модернизация их радаров, комплексов радиоэлектронной борьбы и противокорабельных ракет в середине срока службы позволит им оставаться боеспособными на протяжении десятилетий."
 GRE_elli_class: "Программа замены класса Элли"
 GRE_elli_class_desc: "Фрегаты класса «Элли» — это старые голландские корабли класса «Ван Спейк», переданные нам в 1980-х годах, и срок их службы давно истек. Нам необходимы новые корпуса, построенные внутри страны на верфи «Скарамангас», или приобретенные за рубежом, чтобы восстановить боеспособность наших фрегатов."
 GRE_roussen_attack_craft: "Быстроходный ударный катер класса «Руссен»"
 GRE_roussen_attack_craft_desc: "Эгейское море — это не открытый океан, а узкие воды, идеально подходящие для быстроходных ударных кораблей. Корабли класса «Руссен» созданы именно для этого: быстрые, вооруженные ракетами и смертоносные на ближней дистанции. Новое поколение таких кораблей могло бы лишить любой вражеский флот доступа в греческие воды."
 GRE_fremm_frigate: "Многоцелевые фрегаты FREMM"
 GRE_fremm_frigate_desc: "Нашему флоту нужно больше кораблей. Мы можем либо быстро приобрести проверенные итальянские фрегаты FREMM, либо инвестировать в пятый проект прямых иностранных инвестиций от Naval Group. Каждый вариант имеет свои преимущества с точки зрения скорости, возможностей и партнерских отношений."
 GRE_submarine_expansion: "Программа закупок типа 214"
 GRE_submarine_expansion_desc: "Подводные лодки класса «Папаниколис» представляют собой лучшие образцы традиционной подводной войны. Независимая от воздуха силовая установка позволяет нашим лодкам оставаться под водой в течение нескольких недель, не всплывая на поверхность. Расширение и поддержание этой программы укрепит наш контроль над подводным пространством Эгейского моря."
 GRE_bluewhale_submarines: "Подводные лодки «Синий кит»"
 GRE_bluewhale_submarines_desc: "Автономные беспилотные подводные лодки от израильской компании Israeli Aerospace обеспечат возможности, которым не может похвастаться никто в регионе. Эти системы работают без экипажа и без риска, обеспечивая нашему флоту постоянное подводное присутствие."
 GRE_defense_manufacturing: "Мандат на местное производство"
 GRE_defense_manufacturing_desc: "Введение требования о 25-процентной доле местного производства во всех крупных оборонных программах обеспечит выгоду для нашей отечественной промышленности от каждого контракта. Компании EAS, HAI и наши верфи укрепятся, и мы уменьшим зависимость от иностранных поставщиков."
 GRE_research_hubs: "Научно-исследовательские центры"
 GRE_research_hubs_desc: "Официальное сотрудничество между нашими университетами, греческой аэрокосмической промышленностью и Министерством обороны создало бы поток инноваций для вооруженных сил."
 GRE_defense_innovation_center: "Греческий центр оборонных инноваций"
 GRE_defense_innovation_center_desc: "Создание специализированного инновационного центра, объединяющего стартапы, университеты и партнеров из оборонной промышленности, помогло бы ускорить разработку военных технологий нового поколения в Греции."
 GRE_communication_satellites: "Спутники связи"
 GRE_communication_satellites_desc: "Специализированные военные спутники связи обеспечат нам постоянный обзор Эгейского моря и надежную коммуникационную сеть для всех родов войск."
 GRE_theon_international: "Международная экспансия Теона"
 GRE_theon_international_desc: "Компания Theon International имеет прочную мировую репутацию в области приборов ночного видения и оптических систем. Поддержка ее расширения на новые экспортные рынки позволит получить доход, укрепить оборонные связи и продемонстрировать, что греческая промышленность способна конкурировать на самом высоком уровне."
 GRE_industrial_synergy: "Промышленная синергия"
 GRE_industrial_synergy_desc: "Наши оборонные программы работают наиболее эффективно, когда наши отрасли промышленности сотрудничают. Формальная координация между HAI, нашими верфями, EAS и нашими научно-исследовательскими институтами позволила бы ускорить, удешевить и повысить эффективность каждой программы."
 GRE_irix_loitering: "Барражирующие боеприпасы IRIX"
 GRE_irix_loitering_desc: "Компания Hellenic Defence Systems в партнерстве с Paramount Industries разработала IRIX — первый барражирующий боеприпас, произведенный в Греции. Обладая дальностью действия до 100 километров, он обеспечивает нашим войскам возможность нанесения высокоточных ударов вглубь вражеской территории без зависимости от иностранных поставщиков."
 GRE_lora_ballistic: "Баллистическая ракетная система LORA"
 GRE_lora_ballistic_desc: "Баллистический ракетный комплекс LORA от израильской компании Israel Aerospace Industries обеспечит нам возможность нанесения высокоточных ударов на большие расстояния, достигающие 400 километров. Такая дальность действия значительно изменит баланс сил в Эгейском море и заставит любого потенциального противника серьезно задуматься."
 GRE_iniochos: "Программа упражнений Иниохос"
 GRE_iniochos_desc: "Ежегодные учения «Иниохос» в Андравиде стали одним из ведущих многонациональных мероприятий по подготовке летчиков в Европе. Расширение числа участников и усложнение сценариев позволят отточить навыки наших пилотов и укрепить наши военные отношения с союзными странами."
 GRE_grypas_ucav: "Программа Grypas UCAV"
 GRE_grypas_ucav_desc: "Греческая аэрокосмическая промышленность разработала «Грипас», наш первый боевой беспилотник отечественной разработки. Инвестиции в эту программу означают, что мы получаем возможность нанесения ударов беспилотниками, не зависящую от экспортных ограничений за рубежом или политической обстановки."
 GRE_integrated_air_defense: "Интегрированная сеть противовоздушной обороны"
 GRE_integrated_air_defense_desc: "Объединение зенитных ракетных комплексов Patriot, противоракетной обороны Achilles, систем противодействия беспилотникам и нашей радиолокационной сети в единую многоуровневую сеть обеспечивает Греции воздушное пространство, через которое ни один вражеский самолет или беспилотник не сможет пройти без ответа. Каждый датчик и каждый перехватчик теперь действуют как единая система."
 GRE_strategic_transport_fleet: "Стратегический транспортный флот"
 GRE_strategic_transport_fleet_desc: "Эффективность обороны нашего острова напрямую зависит от нашей способности пополнять запасы и усиливать оборону. Модернизация нашего флота C-27J и приобретение дополнительных транспортных самолетов C-130H гарантируют, что ни один гарнизон не останется без поддержки и ни один остров не окажется в изоляции во время кризиса."
 GRE_constellation_co_production: "Совместное производство класса Constellation"
 GRE_constellation_co_production_desc: "Совместно с Соединенными Штатами мы начали планирование совместного производства фрегатов класса FFG-62 Constellation. Это партнерство пополнит наш флот кораблями мирового класса и позволит развить опыт и возможности наших верфей в Скарамангасе и Элефсине."
 GRE_eyes_of_poseidon: "Глаза Посейдона"
 GRE_eyes_of_poseidon_desc: "Мы не можем защитить то, чего не видим. Интеграция морских патрульных самолетов, береговых радиолокационных станций и спутниковых снимков в единую сеть наблюдения позволила бы нам получить полное представление об Эгейском и Ионическом морях."
 GRE_souda_bay_expansion: "Расширение военно-морской базы Суда-Бэй"
 GRE_souda_bay_expansion_desc: "Залив Суда — один из наиболее стратегически важных портов Средиземноморья. Расширение нашего сотрудничества с Соединенными Штатами и НАТО на этом объекте укрепит наши альянсы и закрепит роль Греции как ключевого опорного пункта на южном фланге НАТО."
 GRE_alexandroupolis_strategic_hub: "Александруполис — стратегический центр"
 GRE_alexandroupolis_strategic_hub_desc: "Александрупольский порт стал важнейшим логистическим коридором НАТО в Восточную Европу, полностью минуя Босфор. Инвестиции в его инфраструктуру и более тесное сотрудничество с Болгарией и Румынией превратят его в постоянный стратегический актив."
 GRE_spike_atgm_integration: "Интеграция ПТУР Spike"
 GRE_spike_atgm_integration_desc: "Нашей пехоте и бронетехнике необходима современная противотанковая управляемая ракета, способная поражать цели за пределами прямой видимости. Интеграция семейства ракет Spike в состав сухопутных войск и патрульных кораблей ВМС предоставит каждому командиру возможность нанесения высокоточных ударов."
 GRE_stinger_manpads: "Модернизация ПЗРК"
 GRE_stinger_manpads_desc: "Наши островные гарнизоны и передовые части сталкиваются с воздушными угрозами, которые крупные зенитные батареи не могут эффективно нейтрализовать с точки зрения затрат. Модернизация и расширение нашего арсенала ПЗРК «Стингер» обеспечили бы каждое пехотное подразделение и патрульное судно собственной системой противовоздушной обороны."
 GRE_infantry_digitisation: "Программа оцифровки пехоты"
 GRE_infantry_digitisation_desc: "Современным солдатам необходимо иметь общую оперативную картину, как у пилота, находящегося в воздухе, так и у фрегата в открытом море. Оснащение нашей пехоты системами управления боем, зашифрованной связью и цифровым целеуказанием позволило бы интегрировать их в более широкую сеть, а не оставлять действовать изолированно."
 GRE_sovereign_waters: "Суверенные Воды"
 GRE_sovereign_waters_desc: "На протяжении десятилетий другие оспаривали наши суверенные права в Эгейском и Восточном Средиземноморье, и у нас не было достаточного флота, чтобы что-либо с этим поделать. Благодаря модернизированному флоту и надлежащей защите островов мы теперь можем отстаивать то, что международное право всегда нам гарантировало. Наша исключительная экономическая зона принадлежит нам."
 GRE_rheinmetall_greece: "Rheinmetall в Греции"
 GRE_rheinmetall_greece_desc: "Компания Rheinmetall планирует создать в Греции предприятия по локальной сборке и техническому обслуживанию в рамках будущих закупочных соглашений. Официальное оформление этого партнерства и интеграция их производства в нашу отечественную оборонную промышленность укрепят модернизацию сухопутных войск и превратят Грецию в центр оборонного производства в Юго-Восточной Европе."
 GRE_joint_operations_reform: "Реформа совместных операций"
 GRE_joint_operations_reform_desc: "Наши три рода войск десятилетиями действовали раздельно, имея собственные доктрины и командные культуры. Единая система совместных операций, которая позволит армии, флоту и военно-воздушным силам планировать, тренироваться и вести боевые действия сообща, имеет решающее значение. Все остальное, что мы хотим сделать, зависит от этого."
 GRE_new_army_doctrine: "От массы к маневру"
 GRE_new_army_doctrine_desc: "Греческая армия была создана для удержания линии фронта во Фракии с помощью как можно большего числа солдат. Эта война так и не состоялась. Нам необходимо реструктурировать армию, сосредоточив внимание на более мелких и быстродействующих бригадных группах, способных оперативно развертываться по всему Эгейскому морю и реагировать на угрозы до того, как они перерастут в кризисы."
 GRE_nco_reform: "Основа армии"
 GRE_nco_reform_desc: "От греческих офицеров всегда ожидалось, что они будут принимать все решения вплоть до уровня взвода, поскольку младшим командирам никогда не предоставлялись полномочия или подготовка для самостоятельных действий. Создание профессионального корпуса младших командиров, способных руководить и адаптироваться, не дожидаясь приказов сверху, значительно повысило бы эффективность армии."
 GRE_thrace_to_aegean: "Переориентация армии"
 GRE_thrace_to_aegean_desc: "В течение сорока лет наши сухопутные войска были обращены на северо-восток, в сторону реки Эврос. Эта угроза не исчезла, но она больше не является нашей единственной заботой. Нам следует переориентировать наше основное развертывание на острова и побережья Эгейского моря, где суверенитет проверяется каждый день."
 GRE_joint_fires_doctrine: "Школа общевойсковых боевых действий"
 GRE_joint_fires_doctrine_desc: "Артиллерия, бронетехника, пехота и непосредственная авиационная поддержка слишком долго действовали изолированно. Необходимо внедрить общевойсковую войну, при которой все подразделения должны тренироваться вместе. Наши солдаты должны уметь взаимодействовать с авиацией, а не просто читать об этом."
 GRE_sead_doctrine: "Подавление обороны противника"
 GRE_sead_doctrine_desc: "Наши пилоты входят в число самых опытных в НАТО в области противовоздушной обороны над Эгейским морем, но наступательные удары по защищенным целям все еще недостаточно развиты. Нам необходима специализированная доктрина подавления ПВО с использованием систем SCALP и Meteor истребителей Rafale для уничтожения вражеской ПВО до начала ударных операций."
 GRE_iniochos_as_doctrine: "Уроки Иниохоса"
 GRE_iniochos_as_doctrine_desc: "Ежегодно учения «Иниохос» собирают пилотов из двадцати стран, чтобы изучить эффективные методы действий в спорном воздушном пространстве. Мы проводим эти учения уже много лет, но полученные уроки так и не были полностью преобразованы в доктрину. Результаты каждого цикла должны быть формализованы в обновленные тактические схемы и процедуры и приняты во всех ВВС Греции."
 GRE_cas_doctrine: "Интеграция непосредственной авиационной поддержки"
 GRE_cas_doctrine_desc: "Греческие ВВС и Греческая армия редко проводили совместные тренировки на уровне, необходимом для эффективной непосредственной авиационной поддержки. Необходима постоянная система совместной подготовки и стандартизированные протоколы связи, чтобы наземные командиры и пилоты истребителей могли эффективно взаимодействовать в критических ситуациях."
 GRE_aegean_fortress_doctrine: "Эгейское море как наше море"
 GRE_aegean_fortress_doctrine_desc: "Эгейское море — это не открытый океан. Это лабиринт из шести тысяч островов, узких проливов, мелководных отмелей и узких мест. Хорошо подготовленная оборона может сделать эту местность чрезвычайно опасной для любого атакующего флота. Нам нужен флот, который сделает любое приближение к греческой территории рискованным шагом, на который никто не захочет пойти."
 GRE_aegean_fortress_doctrine_tt: "[GREadmiraldefenseeffect]"
 GRE_aegean_fortress_doctrine_effect: "Адмиралы: §G30% шанс§! получить §Y+1 Защита§! при повышении уровня."
 GRE_submarine_wolf_packs: "Доктрина подводной войны"
 GRE_submarine_wolf_packs_desc: "Подводные лодки — самое опасное оружие в Эгейском море. Вода слишком мелкая, чтобы враг мог спрятаться, но достаточно глубокая в нужных местах для наших. Обучение наших экипажей действиям в скоординированных группах, обмену данными о целях и прикрытию районов патрулирования друг друга означало бы, что ни один надводный флот не сможет перемещаться по Эгейскому морю, не будучи отслеживаемым снизу."
 GRE_missile_corvette_network: "Сеть Руссена"
 GRE_missile_corvette_network_desc: "Наши ракетные корветы класса «Руссен» быстры и смертоносны, идеально подходят для Эгейского моря, но они никогда не действовали как скоординированная сеть. Интеграция их с береговыми радарами, датчиками на островах и сообщениями о контактах с подводными лодками в единую систему наведения позволила бы любому корвету поразить любую надводную цель в течение нескольких минут."
 GRE_aegean_minefield_doctrine: "Минированные проливы"
 GRE_aegean_minefield_doctrine_desc: "Греция обладает возможностями по минированию с моря ещё со времён Второй мировой войны, но они так и не были должным образом интегрированы в боевую доктрину. Заранее спланированные минные поля на каждом крупном подходе к Эгейскому морю, готовые к активации в течение нескольких часов, превратили бы проливы в барьеры, которые даже превосходящий по силе флот не смог бы безопасно преодолеть."
 GRE_sea_denial_complete: "Крепость Эгейское"
 GRE_sea_denial_complete_desc: "Эгейское море теперь полностью находится в зоне оперативного контроля Греции. Каждый уровень нашей морской обороны — подводные лодки, корветы, фрегаты, мины и береговые ракеты — интегрирован в единую доктрину воспрепятствования доступу к морю. Возможно, у нас не самый большой флот в Средиземноморье, но он самый опасный для любого, кто попытается вторгнуться в наши воды."
 GRE_eastern_med_doctrine: "За Эгейским морем"
 GRE_eastern_med_doctrine_desc: "Интересы Греции не ограничиваются Додеканесом. Наши права на исключительную экономическую зону к югу от Крита, наши обязательства перед Кипром и наше энергетическое партнерство с Израилем и Египтом требуют наличия военно-морского флота, способного действовать вдали от дома в течение длительных периодов времени. Нам нужен флот, способный эффективно действовать во всем Восточном Средиземноморье, а не только в Эгейском море."
 GRE_asw_training: "Охота на подводные лодки"
 GRE_asw_training_desc: "Противолодочная борьба — самая сложная и наименее востребованная область в ВМС Греции. Наши новые фрегаты оснащены превосходными противолодочными датчиками и торпедами, но экипажам необходима специальная подготовка для их правильного использования. Постоянная программа противолодочной подготовки, использующая ресурсы нашего подводного флота, позволила бы обучить экипажи надводных кораблей тому, как на самом деле действуют вражеские подводные лодки."
 GRE_fleet_coordination: "Единое военно-морское командование"
 GRE_fleet_coordination_desc: "Для эффективного ведения боевых действий в Восточном Средиземноморье необходима координация, которую разрозненные командования эскадрилий не могут обеспечить. Реструктуризация ВМС Греции под единым оперативным командованием с оперативной информацией о каждом корабле, подводной лодке и патрульном самолете в режиме реального времени значительно повысит эффективность флота в целом."
 GRE_eastern_med_taskforce: "Средиземноморское оперативное мастерство"
 GRE_eastern_med_taskforce_desc: "После обеспечения безопасности Эгейского моря нам необходимо расширить зону нашего влияния на Средиземноморье. Реструктуризация нашей системы подготовки кадров, реформирование ротации флота и проведение длительных развертываний позволят нам нарастить возможности по отслеживанию и поражению любого вражеского флота по всей протяженности Средиземноморья."
 GRE_eastern_med_supremacy: "Превосходство Восточного Средиземноморья"
 GRE_eastern_med_supremacy_desc: "Постоянно действующая экспедиционная оперативная группа, поддерживаемая современными сухими доками и охватывающая территорию от Ионического до Левантийского бассейнов, делает ВМС Греции решающей морской державой восточного Средиземноморья. Демонстрация силы такого масштаба позволяет ответить на любой вызов еще до того, как он достигнет греческих вод."
 GRE_landforces_modifier: "Греческая армия"
 GRE_landforces_modifier_desc: "Греция располагает закаленными в боях сухопутными войсками, сформированными десятилетиями напряженности в Эгейском море. Наша армия обучена, оснащена и размещена для защиты каждого метра греческой земли."
 GRE_airforce_modifier: "Греческие ВВС"
 GRE_airforce_modifier_desc: "Греческие ВВС контролируют воздушное пространство над Эгейским морем. Наши пилоты — одни из самых опытных в НАТО, их навыки отточены ежедневными перехватами и работой в условиях оспариваемого воздушного пространства."
 GRE_navy_modifier: "Греческий военно-морской флот"
 GRE_navy_modifier_desc: "Греция — морская держава. Наш флот, состоящий из фрегатов, подводных лодок и быстроходных ударных катеров, патрулирует воды, которые принадлежат Греции с древних времен."
 GRE_cold_war_giant_1: "Армия времен холодной войны"
 GRE_cold_war_giant_1_desc: "Наша армия была создана для того, чтобы остановить наступление Советского Союза на Балканах. Эта война так и не началась. Теперь у нас есть разросшиеся формирования, которые дороги в укомплектовании, медленны в передвижении и обучены для поля боя, которого больше не существует."
 GRE_aircraft_bad_1: "Военно-воздушные силы в период холодной войны"
 GRE_aircraft_bad_1_desc: "Наш воздушный флот представляет собой лоскутное одеяло из самолетов времен холодной войны. Крупные самолеты дороги в обслуживании, а нашим пилотам не хватает доктрины для проецирования силы за пределы Эгейского моря. Стратегическая авиация и наблюдение являются серьезными пробелами."
 GRE_navy_bad_1: "Военно-морской флот времен холодной войны"
 GRE_navy_bad_1_desc: "Наш флот выглядит внушительно на бумаге, но на практике это полный бардак. Корпуса кораблей, бывшие в употреблении, из трёх разных флотов означают три разные цепочки поставок. Расходы на топливо слишком высоки, противовоздушная оборона имеет пробелы, а наши офицеры обучены береговому патрулированию, а не операциям флота."
 GRE_defense_industry: "Арсенал Эгейского моря"
 GRE_defense_industry_modifier: "Арсенал Эгейского моря"
 GRE_defense_industry_modifier_desc: "От верфей Скарамангаса до оружейных заводов вокруг Пирея греческая промышленность на протяжении поколений снабжает вооруженные силы. У нас есть собственная оборонная промышленность, и мы должны ее использовать."
 GRE_research_hubs_idea_tt: "[GREresearchhubidea]"
 GRE_archipelagos_defense_plan: "Щит Эгейского моря"
 GRE_archipelagos_defense_plan_desc: "Многоуровневая оборонительная архитектура, рассматривающая архипелаг Эгейского моря как интегрированную сеть крепостей. Быстрый ремонт, береговые батареи, перекрытие поставок и ракетное покрытие в совокупности делают любое приближение к греческим водам дорогостоящим."
 GRE_archipelagos_defense_plan_country: "Щит Эгейского моря"
 GRE_archipelagos_defense_plan_country_desc: "Многоуровневая оборонительная архитектура, рассматривающая архипелаг Эгейского моря как интегрированную сеть крепостей. Быстрый ремонт, береговые батареи, перекрытие поставок и ракетное покрытие в совокупности делают любое приближение к греческим водам дорогостоящим."
 GRE_defense_innovation_research_mission: "Цикл исследований в области оборонных инноваций"
 GRE_defense_innovation_research_mission_desc: "Греческий центр оборонных инноваций обеспечивает непрерывные исследования во всех родах войск. Каждые 100 дней может происходить прорыв в бронетанковых, артиллерийских, пехотных, авиационных или военно-морских технологиях."
 GRE_aegean_survey: "Исследование морского дна Эгейского моря"
 GRE_aegean_survey_desc: "Мы составляем карту того, что принадлежит нам. Полное геологическое исследование дна Эгейского моря позволит определить масштабы наших запасов углеводородов и заложить основу для их добычи."
 GRE_aegean_surveyed: "Карта вод Эгейского моря"
 GRE_aegean_extraction: "Эгейская добыча нефти"
 GRE_aegean_extraction_desc: "Исследования завершены. Мы начинаем добычу на месторождениях Эгейского моря. Греческая нефть из греческих вод для греческой экономики."
 GRE_aegean_extracting: "Нефть Эгейского моря добыта"
 GRE_aegean_offshore_industry: "Эгейская оффшорная индустрия"
 GRE_aegean_offshore_industry_desc: "Добыча полезных ископаемых порождает промышленность. Мы создаём вспомогательную инфраструктуру для переработки и распределения того, что добываем со дна Эгейского моря."
 GRE_crete_survey: "Исследование морского дна Южного Крита"
 GRE_crete_survey_desc: "Воды к югу от Крита обладают значительным неиспользованным потенциалом. Мы расширяем наши исследовательские работы на Ионический и Левантийский бассейны."
 GRE_crete_surveyed: "Карта критских вод"
 GRE_crete_extraction: "Южнокритская нефтедобыча"
 GRE_crete_extraction_desc: "Наибольшие запасы добываются в самых глубоких водах Греции. Мы начинаем добычу к югу от Крита и обеспечиваем экономическое будущее страны."
 GRE_crete_extracting: "Критская нефть добыта"
 GRE_crete_offshore_industry: "Южнокритская шельфовая промышленность"
 GRE_crete_offshore_industry_desc: "На южных месторождениях ведётся добыча. Мы наращиваем промышленный потенциал, чтобы превратить добычу сырья в устойчивый экономический результат."
 TUR_naval_expansion_response: "Программа расширения военно-морского флота"
 TUR_naval_expansion_response_desc: "В ответ на морскую активность Греции Турция ускоряет программу строительства военно-морских судов. Верфи работают с повышенной мощностью, чтобы сократить разрыв в Восточном Средиземноморье."
 GRE_creditor_management_category: "Управление греческим долгом"
 GRE_creditor_management_category_desc: "Как держатель греческого государственного долга, мы можем потребовать частичного погашения долга или полностью его списать. Наши текущие активы приносят регулярный процентный доход из Афин."
 GRE_propose_debt_deal: "Предложить сделку по реструктуризации долга"
 GRE_propose_debt_deal_desc: "Предлагаем, чтобы какое-либо иностранное государство взяло на себя часть нашего государственного долга в обмен на регулярные процентные платежи. Мы передадим выбранному кредитору 10% нашего текущего долга, а после того, как наш долг превысит 90% ВВП, эта сумма увеличится до 25%."
 GRE_repay_creditor: "Погасить задолженность перед кредитором"
 GRE_repay_creditor_desc: "Произведите единовременный платеж для уменьшения нашей задолженности перед этим кредитором на 10% от суммы долга."
 GRE_creditor_call_in_debt: "Требование погашения греческого долга"
 GRE_creditor_call_in_debt_desc: "Потребуйте от Греции немедленного погашения 20% долга, который она нам должна. Это серьезный дипломатический шаг, который может навредить отношениям."
 GRE_creditor_forgive_debt: "Простить греческий долг"
 GRE_creditor_forgive_debt_desc: "Списать 25% долга Греции перед нами в знак доброй воли. Это значительно улучшит отношения с Афинами."
 greece_debt.10.t: "Предложение о греческом долге"
 greece_debt.10.d: "Компания [FROM.GetName] обратилась к нам с предложением взять на себя часть своего государственного долга. Взамен мы будем получать регулярные процентные платежи по удерживаемой сумме. Предложенная сумма невелика, но представляет собой надежный источник дохода."
 greece_debt.10.a: "Примите условия"
 greece_debt.10.b: "Нам это неинтересно"
 greece_debt.10.c: "Только по более высокой ставке"
 greece_debt.12.t: "Соглашение о реструктуризации долга принято."
 greece_debt.12.d: "Компания [FROM.GetName] согласилась взять на себя часть нашего государственного долга. Мы будем регулярно выплачивать ей проценты, но общая сумма нашего долга была реструктурирована."
 greece_debt.12.a: "Необходимая договоренность"
 greece_debt.13.t: "Сделка по реструктуризации долга отклонена."
 greece_debt.13.d: "Компания [FROM.GetName] отклонила наше предложение о сохранении части нашего долга. Нам необходимо искать другие способы решения проблемы или найти иные пути для урегулирования нашего финансового положения."
 greece_debt.13.a: "Мы найдем другой способ."
 greece_debt.14.t: "Получено встречное предложение"
 greece_debt.14.d: "[FROM.GetName] готов принять наш долг, но только по более высокой процентной ставке, чем мы первоначально предлагали. Необходимо сопоставить возросшие затраты на обслуживание этого долга с немедленным облегчением, которое он обеспечит."
 greece_debt.14.a: "Примите более высокую ставку"
 greece_debt.14.b: "Эти условия неприемлемы."
 greece_debt.16.t: "Потребительский долг взыскан"
 greece_debt.16.d: "[FROM.GetName] требует немедленного погашения части задолженности перед ними. Невыполнение этого требования нанесет ущерб нашим отношениям и международной репутации."
 greece_debt.16.a: "Платите столько, сколько они требуют."
 greece_debt.16.b: "Мы не можем себе этого позволить."
 greece_debt.17.t: "Долг прощён"
 greece_debt.17.d: "Компания [FROM.GetName] великодушно списала часть нашей задолженности. Эта неожиданная помощь значительно облегчает наше финансовое бремя."
 greece_debt.17.a: "Долгожданное облегчение"
 greece_debt.18.t: "Греческий долг полностью погашен"
 greece_debt.18.d: "Компания [FROM.GetName] полностью погасила всю задолженность перед нами. Хотя мы теряем источник процентного дохода, погашение задолженности демонстрирует финансовую ответственность."
 greece_debt.18.a: "Счет урегулирован."
 greece_debt.2.t: "Предложение по обмену долгов"
 greece_debt.2.d: "[FROM.GetName] просит нас рассмотреть возможность принятия на себя части их государственного долга посредством своповой сделки."
 GRE_eligible_creditor_tt: "Не должен находиться в состоянии войны с Грецией, должен быть независимым, не должен быть кредитором и иметь рейтинг выше -50."
 GRE_debt_ratio_above_50_tt: "Соотношение государственного долга к ВВП должно быть выше 50%."
 GRE_debt_ratio_above_90_tt: "Соотношение государственного долга к ВВП должно быть выше 90%."
 GRE_propose_debt_deal_accept_tt: "Кредитор берет на себя часть нашего долга, сокращая государственный долг в обмен на постоянные процентные платежи."
 GRE_creditor_call_in_debt_accept_tt: "Греция погашает требуемую часть долга, который она нам должна."
 GRE_creditor_call_in_debt_reject_tt: "Греция отказывается платить, что ухудшает отношения между нашими странами."
 GRE_retry_outreach_accept_tt: "Они соглашаются с нашим предложением, что улучшает отношения и способствует нашему сближению."
 GRE_repay_10pct_tt: "Погасите 10% от суммы задолженности перед этим кредитором."
 GRE_call_in_20pct_tt: "Требуем погашения 20% нашего греческого долга."
 GRE_forgive_25pct_tt: "Простите 25% долга, который Греция нам должна."
 GRE_eastmed_jor_accept_tt: "Иордания присоединяется к форуму, улучшая отношения и заключая с нами торговое соглашение."
 GRE_eastmed_jor_reject_tt: "Иордания отказывается, что лишает нас политического капитала."
 GRE_interest_rate_below_cap_tt: "Процентная ставка должна быть ниже 8%."
 GRE_interest_rate_above_min_tt: "Процентная ставка должна быть выше 0,5%."
 GRE_creditor_holds_significant_debt_tt: "Мы владеем более чем §Y10 миллиардов§! в §YГреческий долг§! (Текущий §Y[?GRE_debt_held_by_us|1] миллиард§!)"
 GRE_deferred_to_creditors_tt: "Отложенные затраты распределяются пропорционально странам-кредиторам."
 GRE_prospecting_category: "Греческая разведка ресурсов"
 GRE_prospecting_category_desc: "Наши геологические исследования выявили перспективные месторождения полезных ископаемых на материковой части Греции и островах. При наличии соответствующих технологий разработки и инфраструктуры мы можем превратить эти участки в продуктивные шахты."
 GRE_prospecting_unlocked_tt: "Открывает доступ к решениям по разведке ресурсов."
 GRE_halkidiki_prospecting: "Расширение горнодобывающей промышленности Халкидики"
 GRE_halkidiki_prospecting_desc: "Полуостров Халкидики на севере Греции обладает значительными месторождениями хрома и золота. Горнодобывающие районы Скуриес и Стратони могут быть расширены с помощью современных методов разработки месторождений."
 GRE_peloponnese_bauxite: "Добыча бокситов на Пелопоннесе"
 GRE_peloponnese_bauxite_desc: "В рудниках Дистомон и районе Фокис находятся значительные запасы бокситов. Постепенная добыча позволит обеспечить нашу алюминиевую промышленность ресурсами на десятилетия вперед."
 GRE_thessaly_mining: "Добыча никеля в Фессалии"
 GRE_thessaly_mining_desc: "Месторождения никелевых латеритов Ларимна в Фессалии представляют собой одни из крупнейших запасов никеля в Европе. Систематическая добыча позволит получать сталь и хром в качестве побочных продуктов."
 GRE_aegean_mining: "Добыча минералов на островах Эгейского моря"
 GRE_aegean_mining_desc: "Вулканические острова Эгейского моря, в частности Милос и Наксос, содержат залежи бентонита, перлита и наждака, которые могут быть использованы в коммерческих целях."
 GRE_pipeline_infrastructure: "Трубопроводная инфраструктура"
 GRE_pipeline_infrastructure_desc: "Сеть трубопроводов, соединяющих разведочные участки с существующими нефтеперерабатывающими заводами и промышленными потребителями, делает добычу коммерчески выгодной и интегрирует ресурсный сектор в более широкую греческую энергетическую сеть."
 greece.28.t: "Китайское предложение по промышленным инвестициям"
 greece.28.d: "Компания [FROM.GetName] обратилась к нам с предложением инвестировать в их промышленную базу. Они предлагают профинансировать строительство завода в Фессалии в обмен на коммерческое влияние на их растущую экономику."
 greece.28.a: "Надежная инвестиция"
 greece.28.b: "Нас не интересует греческая промышленность."
 greece.29.t: "Китайские инвестиции приняты"
 greece.29.d: "Китай согласился профинансировать наше промышленное развитие в Фессалии. Новый завод будет построен на китайские средства, что укрепит наши экономические связи с Пекином."
 greece.29.a: "Отличные новости!"
 greece.30.t: "Китайские инвестиции сократились."
 greece.30.d: "Китай отклонил наше предложение о промышленных инвестициях. Мы все еще можем продолжить строительство самостоятельно, хотя и за свой счет."
 greece.30.a: "Мы сами это профинансируем."
 greece.30.b: "Проект нежизнеспособен без иностранного капитала."
 greece.31.t: "Инвестиционное предложение по порту Пирей"
 greece.31.d: "[FROM.GetName] предлагает китайские инвестиции в порт Пирей. Компания COSCO Shipping приобретет контрольный пакет акций портовой администрации, профинансирует масштабную модернизацию инфраструктуры в обмен на коммерческий контроль над одним из самых загруженных портов Средиземноморья."
 greece.31.a: "Пирей — стратегически важный актив, в который стоит инвестировать."
 greece.31.b: "Мы не будем инвестировать в греческие порты."
 greece.32.t: "Компания COSCO приобрела долю в Пирее."
 greece.32.d: "Китай согласился инвестировать в Пирей. Компания COSCO Shipping профинансирует расширение порта, увеличение верфей и развитие инфраструктуры. Влияние Китая в нашей экономике растет, но растет и пропускная способность наших портов."
 greece.32.a: "Порт будет процветать."
 greece.33.t: "Китай отклоняет инвестиции в Пирей."
 greece.33.d: "Китай отказался инвестировать в Пирей. Мы все еще можем модернизировать порт самостоятельно, но без китайского капитала все расходы лягут на нашу казну."
 greece.33.a: "Мы сами модернизируем Пирей."
 greece.33.b: "Порт может подождать"
 greece.34.t: "Предложение по развитию недвижимости в Греции"
 greece.34.d: "[FROM.GetName] обратился к нам с предложением о развитии коммерческой недвижимости в регионе Аттика. Китайские застройщики готовы финансировать строительство торговых центров, отелей и офисных зданий в обмен на долгосрочную аренду и присутствие на коммерческом рынке."
 greece.34.a: "Недвижимость в Греции – привлекательное вложение средств."
 greece.34.b: "Нас не интересует греческая недвижимость."
 greece.35.t: "Китайские инвестиции в недвижимость одобрены"
 greece.35.d: "Китайские застройщики будут финансировать крупные строительные проекты в Аттике. Новые коммерческие и жилые объекты преобразят регион, несмотря на значительное увеличение присутствия китайских коммерческих компаний."
 greece.35.a: "Начало строительства"
 greece.36.t: "Китай сокращает инвестиции в недвижимость."
 greece.36.d: "Китай отказался инвестировать в наш сектор недвижимости. Мы по-прежнему можем продолжать развитие, используя внутренний капитал."
 greece.36.a: "Мы разработаем это сами."
 greece.36.b: "Развитие может подождать."
 greece.37.t: "Предложение по общенациональным инвестициям в инфраструктуру"
 greece.37.d: "[FROM.GetName] предлагает комплексную программу развития инфраструктуры по всей Греции. Китайские государственные предприятия будут финансировать строительство аэропортов, заводов и офисных зданий по всей стране в обмен на существенное коммерческое влияние."
 greece.37.a: "Греция созрела для развития."
 greece.37.b: "Масштаб данного предложения вызывает у нас озабоченность."
 greece.38.t: "Китайские инвестиции по всей стране одобрены"
 greece.38.d: "Китай взял на себя обязательство реализовать общенациональную программу развития инфраструктуры. За счет Китая по всей Греции будут построены новые аэропорты, заводы и коммерческие здания."
 greece.38.a: "Партнерство, способное изменить мир"
 greece.39.t: "Китай сокращает общенациональные инвестиции."
 greece.39.d: "Китай отклонил наше предложение об общенациональных инвестициях. Мы все еще можем построить инфраструктуру самостоятельно, хотя это будет стоить значительно."
 greece.39.a: "Мы построим это сами."
 greece.39.b: "Слишком дорого без иностранной поддержки"
 greece.40.t: "Предложение по развитию Эллинико"
 greece.40.d: "[FROM.GetName] предлагает китайские инвестиции в территорию бывшего международного аэропорта Эллинико. Масштабный проект развития прибрежной зоны предусматривает преобразование заброшенных взлетно-посадочных полос в современный городской район с улучшением инфраструктуры по всей Аттике и Пелопоннесу."
 greece.40.a: "Проект Эллинико обладает огромным потенциалом."
 greece.40.b: "Мы не будем инвестировать в этот проект."
 greece.41.t: "Китайские инвестиции в Эллинико одобрены"
 greece.41.d: "Китай согласился профинансировать проект реконструкции Эллинико. Улучшение инфраструктуры охватит как Аттику, так и Пелопоннес."
 greece.41.a: "Началось масштабное строительство."
 greece.42.t: "Китай отказывается от инвестиций Elliniko"
 greece.42.d: "Китай отказался инвестировать в реконструкцию Эллинико. Мы можем продолжить проект за счет собственных средств или же отложить его."
 greece.42.a: "Мы сами это профинансируем."
 greece.42.b: "Отложите проект на время."
 greece.46.t: "Запрос на кредит от ICBC"
 greece.46.d: "[FROM.GetName] обратился в Промышленно-коммерческий банк Китая с просьбой о предоставлении крупного кредита. Они предлагают ICBC предоставить кредит в размере 10% от своего ВВП, что позволит укрепить финансовые связи с Афинами и расширить присутствие китайских банков в Средиземноморье."
 greece.46.a: "Продлить кредит"
 greece.46.b: "Риск слишком велик."
 greece.47.t: "Кредит ICBC одобрен."
 greece.47.d: "Промышленно-торговый банк Китая одобрил нашу заявку на кредит. Китайский капитал поступает в нашу казну, обеспечивая значительный приток средств. Наша финансовая зависимость от Пекина усиливается, но немедленная помощь очень кстати."
 greece.47.a: "Финансирование обеспечено."
 greece.48.t: "В выдаче кредита ICBC отказано."
 greece.48.d: "Китай отказался продлить кредит ICBC. Без поддержки китайских банков нам придется искать альтернативные источники капитала или обходиться имеющимися средствами."
 greece.48.a: "Мы справимся"
 GRE_drydock_modernization: "Модернизация сухого дока"
 GRE_drydock_modernization_desc: "Инвестиции в современные сухие доки позволили расширить возможности по ремонту и строительству военно-морских судов, что дало возможность ВМС Греции модернизировать свой флот более эффективно."
 GRE_strategic_autonomy_idea: "Стратегическая автономия"
 GRE_strategic_autonomy_idea_desc: "Греция не зависит ни от одного блока, а торгует и заключает сделки со всеми. Свобода играть на руку каждому блоку обеспечивает лучшие условия и определенную защиту от давления великих держав."
 GRE_euro_adopted: "Принятие евро"
 GRE_euro_adopted_desc: "Введение Грецией евро интегрировало ее экономику в более широкую еврозону, снизив стоимость заимствований и упростив торговлю за счет отказа от независимой денежно-кредитной политики."
 GRE_manpads_expansion_idea: "Расширение ПЗРК"
 GRE_manpads_expansion_idea_desc: "Расширенная программа по разработке переносных зенитных ракетных комплексов позволила улучшить возможности противовоздушной обороны и снизить производственные затраты за счет отечественных исследований и производства."
 GRE_port_modernization: "Модернизация порта"
 GRE_port_modernization_desc: "Модернизация портовой инфраструктуры позволила расширить мощности верфей и повысить эффективность судостроения на всех греческих судостроительных заводах."
 GRE_research_hubs_idea: "Военные исследовательские центры"
 GRE_research_hubs_idea_desc: "Для ускорения разработки оборонных технологий и внедрения инноваций в системы вооружения были созданы специализированные военно-исследовательские центры."
 GRE_research_hubs_idea_2: "Центры передовых исследований"
 GRE_research_hubs_idea_2_desc: "Расширение программы научно-исследовательского центра теперь охватывает космические технологии наряду с военными приложениями, расширяя технологические горизонты Греции."
 GRE_greater_state_control_authoritarian: "Авторитарный государственный контроль"
 GRE_greater_state_control_authoritarian_desc: "Государство установило прямой контроль над ключевыми секторами экономики, ускорив строительство за счет политической свободы и бюрократической гибкости."
 GRE_com_liberators: "Освободители народа"
 GRE_com_liberators_desc: "Революционный пыл пронизывает ряды солдат. Солдаты, сражающиеся на родной земле, воодушевлены этим делом, наносят более сильные удары и более твердо стоят на защите революции."
 GRE_western_outreach: "Взаимодействие с Западом"
 GRE_western_outreach_desc: "Греческая дипломатия ведет целенаправленную кампанию по двустороннему и многостороннему взаимодействию в рамках НАТО и Европейского союза. Западная приверженность: [?GRE_western_commitment|0]"
 GRE_franco_hellenic_strategic_partnership: "Франко-греческое стратегическое партнерство"
 GRE_franco_hellenic_strategic_partnership_desc: "Стратегическое партнерство 2021 года открыло путь к глубокому оборонно-промышленному сотрудничеству с Францией. Греческие оружейные заводы работают по общим стандартам, французские исследовательские бонусы направляются в наши военные программы, а политическая координация усилилась."
 GRE_franco_greek_mutual_defense: "Франко-греческая оговорка о взаимной защите"
 GRE_franco_greek_mutual_defense_desc: "Статья 2 модернизированного соглашения о партнерстве обязывает Францию защищать греческую территорию. Этот пункт гарантирует безопасность Греции на континентальных условиях и объединяет две крупнейшие армии Средиземноморья в единое стратегическое подразделение."
 GRE_eastmed_trilateral_idea: "Трехсторонняя конференция GRE-ISR-CYP"
 GRE_eastmed_trilateral_idea_desc: "Совместные заявления, совместные учения и объединенные разведывательные данные позволили объединить военно-морские и военно-воздушные силы трех стран в единое оперативное пространство в восточно-средиземноморском бассейне."
 GRE_eastmed_gas_forum_idea: "Участник форума EastMed Gas"
 GRE_eastmed_gas_forum_idea_desc: "Греческие суда используют приоритетные маршруты, региональные потоки газа обогащают греческие нефтеперерабатывающие заводы и верфи, а Афины сохраняют постоянное место за столом переговоров в энергетическом секторе Восточного Средиземноморья."
 GRE_3plus1_pact: "Стратегический диалог 3+1"
 GRE_3plus1_pact_desc: "Участие Америки венчает собой трехсторонние отношения между странами Восточного и Средиземноморья. Совместные учения, обмен разведывательной информацией и структурированный стратегический диалог повышают оперативный потенциал греческих вооруженных сил в морской и воздушной сферах."
 GRE_eu_political_anchor_idea: "Якорь — член-учредитель ЕС"
 GRE_eu_political_anchor_idea_desc: "Греция обладает политическим весом, присущим одному из основателей ЕС, извлекает выгоду из внутриблоковой торговли и, занимая ведущую позицию, формирует повестку дня Брюсселя."
 GRE_eu_strategic_compass_idea: "Представитель программы «Стратегический компас ЕС»"
 GRE_eu_strategic_compass_idea_desc: "Греческая дипломатия продвигает европейский стратегический компас, призывая к автономии от внешнего авантюризма крупных держав и одновременно укрепляя оборонно-промышленную базу ЕС."
 greece.556.t: "Западное подтверждение"
 greece.556.d: "Греция объявляет о всестороннем подтверждении своей приверженности Западу, начиная продолжительную кампанию двустороннего и многостороннего взаимодействия в рамках НАТО и Европейского союза. Афины сигнализируют как союзникам, так и соперникам, что их стратегическое будущее прочно связано с Западом."
 greece.556.a: "Приветствуемое обновление"
 greece.556.b: "Греция держит оборону"
 greece.556.c: "Обратите внимание"
 greece.557.t: "Греческое предложение: Стратегическое партнерство"
 greece.557.d: "Афины предлагают всеобъемлющее стратегическое партнерство, охватывающее оборонно-промышленное сотрудничество, согласование внешнеполитических стратегий и безопасность в Восточном Средиземноморье. Греческое правительство готово вложить значительный политический капитал, чтобы сделать это одним из главных направлений французской средиземноморской политики."
 greece.557.a: "Подпишите соглашение о партнерстве"
 greece.557.b: "Отклонить предложение"
 greece.558.t: "Франция принимает партнерство"
 greece.558.d: "Париж признает стратегическое партнерство. Немедленно создаются совместные рабочие группы по оборонно-промышленному сотрудничеству, при этом французский опыт направляется на греческие заводы по производству вооружений и исследовательские программы. Партнерство представляется как модель европейского двустороннего сотрудничества."
 greece.558.a: "Историческое соглашение"
 greece.559.t: "[FROM.GetName] отказывается от партнерства"
 greece.559.d: "[FROM.GetName], проявляя дипломатическую осмотрительность, сообщает Афинам, что партнерство не может состояться. Политическая цена остается реальной."
 greece.559.a: "Досадная неудача"
 greece.560.t: "Греческое предложение: Восточно-Средиземноморский трехсторонний проект"
 greece.560.d: "Афины предлагают формальное трехстороннее сотрудничество с Израилем и Кипром: совместные учения, обмен разведывательной информацией и скоординированные дипломатические позиции. Такое соглашение позволит преобразовать давнее сотрудничество в обязательную институциональную форму."
 greece.560.a: "Подпишите трехстороннее соглашение"
 greece.560.b: "Отклонить предложение"
 greece.561.t: "Израиль присоединяется к трехстороннему соглашению."
 greece.561.d: "Израиль подписывает трехстороннее рамочное соглашение. На оперативном уровне создаются совместные группы планирования, а соглашения об обмене разведывательной информацией между Израилем и Грецией распространяются на греческие аналоги."
 greece.561.a: "Приветствуем наших партнеров!"
 greece.563.t: "Греческое предложение: Восточно-Средиземноморский трехсторонний проект"
 greece.563.d: "Афины предлагают создать официальную трехстороннюю структуру с Кипром и Израилем. Для Никосии это предложение, по сути, является автоматическим, но формальное подписание еще не состоялось."
 greece.563.a: "Конечно, мы подписываем."
 greece.563.b: "Ожидается дальнейшее рассмотрение."
 greece.564.t: "Кипр присоединяется к трехстороннему соглашению."
 greece.564.d: "Никосия подписывает трехстороннее рамочное соглашение с Афинами и Иерусалимом. Теперь три правительства действуют под единым дипломатическим и оперативным руководством в Восточном Средиземноморье."
 greece.564.a: "Единое Восточно-Средиземноморье"
 greece.566.t: "Греческое предложение: статья 2, положение о взаимной обороне."
 greece.566.d: "Афины предлагают естественное завершение стратегического партнерства: обязательную оговорку о взаимной обороне, смоделированную по образцу статьи 5 и непосредственно включенную в двусторонний договор. Впервые территориальная целостность Греции будет гарантирована крупной европейской державой на договорных условиях."
 greece.566.a: "Подпишите пункт о взаимной защите"
 greece.566.b: "Откажитесь. Слишком далеко, слишком быстро."
 greece.567.t: "Франция подписала пункт о взаимной обороне."
 greece.567.d: "Париж подписывает соглашение. Статья 2 обновленного договора обязывает Францию защищать греческую территорию. Дипломатический шок распространяется далеко за пределы Средиземноморья."
 greece.567.a: "Новая эра европейской безопасности"
 greece.568.t: "Франция отказалась от пункта о взаимной обороне."
 greece.568.d: "Париж отвергает пункт о взаимной обороне, считая его слишком радикальным шагом для нынешней французской стратегической доктрины. Существующее партнерство сохраняется, но обязательные гарантии безопасности не будут реализованы."
 greece.568.a: "Серьезная неудача"
 greece.569.t: "Греческое предложение: Стратегический диалог в формате «3+1»"
 greece.569.d: "Афины, Никосия и Иерусалим совместно предлагают формализовать стратегический диалог в формате «3+1» с Соединенными Штатами — рамочную программу, поддерживаемую Госдепартаментом и охватывающую энергетическую безопасность, морское сотрудничество и борьбу с терроризмом в Восточном Средиземноморье."
 greece.569.a: "Примите участие в диалоге"
 greece.569.b: "Отложить взаимодействие"
 greece.570.t: "Соединенные Штаты участвуют в формате «3+1»"
 greece.570.d: "Вашингтон официально вступает в стратегический диалог в формате «3+1». Американские обязательства по подготовке и проведению учений расширяются по всему Восточному Средиземноморью, а греческие вооруженные силы получают доступ к новому уровню совместного оперативного опыта."
 greece.570.a: "Незаменимое партнерство"
 greece.571.t: "Соединенные Штаты откладывают участие"
 greece.571.d: "Госдепартамент дает понять, что внимание американцев привлекают более широкие стратегические приоритеты. Концепция «3+1» не отменена, но формальное обновление в рамках текущего цикла не произойдет."
 greece.571.a: "Мы вернемся к этому позже."
 greece.572.t: "Греция: Столп Запада"
 greece.572.d: "Последовательные договоры, декларации и партнерства превратили Грецию из периферийного члена НАТО в опору западной дипломатии в Восточном Средиземноморье. Теперь Афины выступают с позиции, обладающей структурным влиянием как в Брюсселе, так и в Вашингтоне."
 greece.572.a: "Столп Запада"
 greece.572.b: "Союзник восстановлен"
 greece.572.c: "Новая стратегическая геометрия"
 greece.575.t: "Терминал FSRU в Александруполисе введён в эксплуатацию"
 greece.575.d: "Плавучая установка для хранения и регазификации газа, пришвартованная в Александруполисе, начала коммерческую эксплуатацию, что стало кульминацией перехода Юго-Восточной Европы от российского трубопроводного газа к альтернативным источникам энергии. Греческая территория теперь является одним из пунктов снабжения континента энергоресурсами."
 greece.575.a: "Афины зажигают лампу"
 greece.575.b: "Полезный новый узел"
 greece.577.t: "Пирей является опорой коридора IMEC."
 greece.577.d: "Главы государств в Дели, Эр-Рияде и Брюсселе подтвердили, что Пирей станет европейским конечным пунктом Индийско-Ближневосточно-Европейского экономического коридора. Прогнозируется, что объемы перевалки грузов через Аттику утроятся за десятилетие."
 greece.577.a: "От Эгейского до Индийского океана"
 greece.577.b: "Логистический прорыв"
 greece.580.t: "Греческое предложение: Дорожная карта сотрудничества в Преспане"
 greece.580.d: "Афины предлагают структурированный план действий по расширению действия Преспанского соглашения: создание отраслевых рабочих групп, соглашение о свободной торговле и совместное планирование инфраструктуры. Этот пакет мер объединит наши экономики на целое поколение."
 greece.580.a: "Скопье готов к застройке Преспы."
 greece.580.b: "Мы не будем выходить за рамки существующих ограничений."
 greece.581.t: "Северная Македония одобрила Дорожную карту."
 greece.581.d: "Скопье подписал дорожную карту сотрудничества в рамках Преспского соглашения. Рабочие группы соберутся в Салониках в течение нескольких недель, и теперь соглашение о свободной торговле находится в пределах досягаемости."
 greece.581.a: "Отличные новости!"
 greece.582.t: "Греческое предложение: Рамочная программа по правам меньшинств"
 greece.582.d: "Афины предлагают формальную рамочную программу по правам грекоязычной общины на юге Албании: языковые школы, реституция имущества и трансграничное культурное сотрудничество в обмен на более теплые двусторонние отношения."
 greece.582.a: "Тирана принимает данную структуру."
 greece.582.b: "Мы не можем согласиться с этими условиями."
 greece.583.t: "Албания подписала Рамочное соглашение о правах меньшинств."
 greece.583.d: "Соглашение подписано в Тиране. Грекоязычные общины на юге Албании получают конкретные гарантии защиты, и, соответственно, укрепляются министерские каналы связи с Афинами."
 greece.583.a: "Дипломатическая выгода"
 greece.584.t: "Греческое предложение: Соглашение об исключительной экономической зоне в Восточном Средиземноморье"
 greece.584.d: "Афины предлагают Каиру двустороннее соглашение о разграничении исключительной экономической зоны. Это соглашение урегулирует пересекающиеся морские претензии и исключит конкурирующих участников из совместной разработки ресурсов морского дна."
 greece.584.a: "Каир подписывает соглашение"
 greece.584.b: "Каир пока отказывается"
 greece.585.t: "Египет ратифицировал соглашение об исключительной экономической зоне."
 greece.585.d: "Египет ратифицировал морскую делимитацию. Совместные изыскания в демаркированной зоне начнутся в течение месяца, и торговые положения, связанные с соглашением, вступят в силу."
 greece.585.a: "Основополагающее соглашение"
 greece.586.t: "Греческое предложение: итало-эллинская средиземноморская ось"
 greece.586.d: "Афины предлагают всеобъемлющее партнерство с Римом: скоординированную промышленную политику, совместные программы развития судостроения и согласованные позиции по вопросам безопасности в Средиземноморье. Два полуострова будут действовать как единое целое в Брюсселе."
 greece.586.a: "Рим соглашается на партнерство."
 greece.586.b: "Рим вежливо отклонил запрос."
 greece.587.t: "Италия присоединяется к Средиземноморской оси"
 greece.587.d: "Италия подписала документ о партнерстве. В течение квартала в Афинах состоятся заседания совместных промышленных комитетов и будет разработана рамочная программа по совместному производству военно-морской техники."
 greece.587.a: "Рождается ось"
 greece.588.t: "Греческое предложение: расширение трубопровода IGB"
 greece.588.d: "Афины предлагают поэтапное расширение межрегионального газопровода Греция-Болгария и связанного с ним терминала в Александруполисе. София получит диверсифицированные источники поставок газа, а Афины — транзитные доходы через Балканы."
 greece.588.a: "София подписала план расширения."
 greece.588.b: "София отвергает это предложение."
 greece.589.t: "Болгария дала добро на расширение трубопровода."
 greece.589.d: "София одобрила расширение. Начало строительства запланировано на начало сезона; прогнозируется удвоение объемов поставок газа на север, в Болгарию, и на юг через греческие терминалы."
 greece.589.a: "Стратегический коридор"
 greece.590.t: "Греческое предложение: Греко-саудовский стратегический совет"
 greece.590.d: "Афины предлагают Эр-Рияду создать Высший совет стратегического сотрудничества: сотрудничество в оборонно-промышленном секторе, совместные инвестиции суверенных фондов и регулярный диалог на министерском уровне. Королевство получит средиземноморского партнера, а Греция — капитал."
 greece.590.a: "Эр-Рияд принимает"
 greece.590.b: "Эр-Рияд отказывается"
 greece.591.t: "Саудовская Аравия созывает Совет"
 greece.591.d: "В Афинах состоялось первое заседание Высшего совета стратегического сотрудничества. Саудовские суверенные фонды объявили о первом транше инвестиций в греческую промышленность."
 greece.591.a: "Знаковое партнерство"
 greece.592.t: "Греческое предложение: Греко-эмиратское инвестиционное соглашение"
 greece.592.d: "Афины предлагают Абу-Даби структурированное инвестиционное соглашение: налоговый режим для эмиратских фондов, доступ к свободной экономической зоне в Аттике и взаимные греческие инвестиции в логистическую сеть Персидского залива."
 greece.592.a: "Абу-Даби принимает"
 greece.592.b: "Абу-Даби отказывается"
 greece.593.t: "Объединенные Арабские Эмираты подписали соглашение."
 greece.593.d: "Абу-Даби подписал соглашение. Эмиратский капитал начинает поступать в греческую логистику и промышленность, а греческие фирмы получают приоритетный доступ к инфраструктуре хабов в странах Персидского залива."
 greece.593.a: "Отличный"
 greece.594.t: "Греческое предложение: Присоединение к Восточно-Средиземноморскому газовому форуму"
 greece.594.d: "Афины предлагают Амману присоединиться к Восточно-Средиземноморскому газовому форуму, при этом Греция выступает спонсором его вступления. В результате возникнет региональная энергетическая архитектура, простирающаяся от Леванта до Эгейского моря."
 greece.594.a: "Амман принимает приглашение"
 greece.594.b: "Амман отказывается"
 greece.595.t: "Иордания присоединяется к Восточно-Средиземноморскому газовому форуму"
 greece.595.d: "Иордания официально вступила в Восточно-Средиземноморский газовый форум. Географический и политический охват этой организации теперь решительно распространяется на весь восточно-средиземноморский бассейн."
 greece.595.a: "Дипломатическая победа"
 GRE_lobby_eu_partners: "Лоббирование партнеров ЕС"
 GRE_lobby_eu_partners_desc: "Направить политический капитал на продолжительную лоббистскую кампанию в Европейском союзе: двусторонние визиты, программные документы и обмен уступками, чтобы продвинуть греческие дипломатические приоритеты и заручиться поддержкой Запада."
