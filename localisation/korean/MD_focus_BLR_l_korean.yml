 BLR_idea_rights: "사람들의 평등한 권리"
 BLR_Freedom_Meeting: "모임과 집회의 자유"
 BLR_market_economics: "시장 경제"
 BLR_employer_right: "노동자들이 언제나 정답이다"
 BLR_Encourage_Exchange_Students: "교환 학생 장려"
 BLR_idea_intellectual: "지적 재산권"
 BLR_outdated_army: "시대에 뒤떨어진 군대"
 BLR_Kommunarka_invest: "러시아 내 콤무나르카 제품 판매\n§W--------------§!\n§B러시아§!에서의 판매로 이익을 얻으며, 이 이익은 우리 예산으로 들어갑니다."
 BLR_Kommunarka_invest_cis: "우리 제품은 이제 CIS 거의 전역에 유통되고 있습니다\n§W--------------§!\n§B러시아§!, §B몰도바§!, §B아르메니아§!, §B라트비아§!, §B카자흐스탄§!, §B조지아§!에서의 판매로 이익을 얻으며, 이 이익은 우리 예산으로 들어갑니다."
 BLR_agro_industry: "잘 보전된 농경 산업"
 BLR_old_railways: "시대에 뒤떨어진 철도 기반시설"
 BLR_cheln_trade: "왕복 셔틀 무역"
 BLR_cheln_trade_desc: "대기업들이 아직 벨라루스에 입점하지 않았기에 고급 가전 제품과 더불어 중고 및 사치품들을 차로 들여와 상당한 마진을 남기는 이들이 나타나고 있습니다."
