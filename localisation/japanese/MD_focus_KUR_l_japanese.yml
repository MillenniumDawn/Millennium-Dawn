l_japanese:
 Kurdistan.2.t: "クルディスタンがイラクとの統一を希望"
 Kurdistan.2.d: "Since the threat of ISIS is now gone, the Kurdistan Regional Government has expressed willingness to rejoin the federal government of Iraq"
 Kurdistan.2.a: "おかえりなさい！"
 Kurdistan.3.t: "住民投票の結果"
 Kurdistan.3.d: "独立住民投票は、クルド自治地域内およびISISと戦いながら我々が支配下に置いた地域で実施された。投票は大きな成功を収め、投票率72%で「賛成」票が93%を占めた。この投票は、自治権の拡大、あるいは完全な独立を交渉する我々の政府の正当性を著しく高めた。"
 Kurdistan.3.a: "完全独立を推進する。"
 Kurdistan.3.b: "これを自治権の交渉材料として使う。"
 Kurdistan.4.t: "クルディスタンが独立を要求"
 Kurdistan.4.d: "Due to the success of the Kurdish Independence Referendum, the Kurdish government is trying to use the referendum as leverage to declare full independence. It seems that they aren't happy with just limited autonomy, and they still hold Kirkuk, which is rightfully part of Iraq."
 Kurdistan.4.a: "断固拒否する！"
 Kurdistan.4.b: "キルクークを返還するなら認めよう。"
 Kurdistan.4.c: "要求を飲もう。"
 Kurdistan.5.t: "クルディスタンがさらなる自治権を要求"
 Kurdistan.5.d: "クルド独立住民投票の成功により、クルド政府は住民投票を交渉材料として、連邦政府の支配からのさらなる自治権を要求しようとしている。彼らは限定的な自治権だけでは満足していないようで、依然としてイラクの正当な一部であるキルクークを保持している。"
 Kurdistan.5.a: "断固拒否する！"
 Kurdistan.5.b: "キルクークを返還するなら認めよう。"
 Kurdistan.5.c: "要求を飲もう。"
 Kurdistan.6.t: "イラクが要求に同意"
 Kurdistan.6.d: "イラク連邦政府は我々の要求に同意した！"
 Kurdistan.6.a: "万歳！"
 Kurdistan.7.t: "イラクがキルクークを要求"
 Kurdistan.7.d: "In a response to our demands, the Iraqi Government has stated that they will agree to our demands, but in exchange they want us to give them back control of the city of Kirkuk, which they see as rightfully theirs."
 Kurdistan.7.a: "ふさわしい代償だ。"
 Kurdistan.7.b: "キルクークはクルド人の土地だ！"
 Kurdistan.8.t: "クルディスタンが拒否"
 Kurdistan.8.d: "クルディスタンはキルクークの返還を拒否した。彼らが主権の理想について考えを変えることを願おう。"
 Kurdistan.8.a: "くそっ"
 Kurdistan.9.t: "クルディスタンの未来"
 Kurdistan.9.d: "Now that the negotiations with Iraq have broken down, we need to determine a path for our nation. We could start pursuing full independence, which will most likely upset Iraq. On the other hand, we could bury our ideas of independence and return to be governed by the Iraqi Federal Government."
 Kurdistan.9.a: "クルディスタンは自由な国家だ！"
 Kurdistan.9.b: "許しを請う。"
 Kurdistan.10.t: "クルディスタン、独立を宣言"
 Kurdistan.10.d: "The Kurdish government announced today that Kurdistan is an independent country, and not part of Iraq. This is a serious blowback to the Iraqi nation, and the Kurdish forces still control the vital city of Kirkuk. Some politicians and generals are arguing that a show of force is necessary. We need to order our troops to occupy Kirkuk, and show the Kurds our willingness to defend Iraqi lands"
 Kurdistan.10.a: "キルクークへの攻撃を準備せよ！"
 Kurdistan.10.b: "戦争は始めたくない。"
 Kurdistan.11.t: "イラクがキルクークに進軍！"
 Kurdistan.11.d: "我々が独立を宣言した後、イラク軍がキルクークへの攻撃準備をしているとの報告を受けた。装備が整い、戦闘経験豊富なイラク軍に対する防衛は困難であり、戦闘に負ければ我々の面目は丸つぶれになる。一方、勝利の可能性はイラク人を怖がらせるかもしれない。流血を避けるために都市から撤退することもできる。"
 Kurdistan.11.a: "徹底抗戦だ！"
 Kurdistan.11.b: "撤退せよ！"
 Kurdistan.13.t: "クルディスタンの運命"
 Kurdistan.13.d: "我々がキルクークを支配下に置いた今、クルド人には我々に服従するか、さらに悪い結果に直面するかの選択肢しかない。"
 Kurdistan.13.a: "服従を要求する。"
 Kurdistan.14.t: "イラクが服従を要求"
 Kurdistan.14.d: "キルクークでの敗北と喪失の後、イラク政府は勢いづいている。彼らは今、我々が将来の計画を放棄し、彼らの支配下に戻るよう要求している。"
 Kurdistan.14.a: "服従する。"
 Kurdistan.14.b: "抵抗する。"
 Kurdistan.15.t: "クルディスタンが服従"
 Kurdistan.15.d: "クルディスタンは我々への再合流に同意した！"
 Kurdistan.15.a: "素晴らしい"
 Kurdistan.16.t: "クルディスタンが抵抗を選ぶ"
 Kurdistan.16.d: "クルディスタンは我々の服従要求を拒否した。"
 Kurdistan.16.a: "ならば、手荒な方法でやるしかないな。"
 Kurdistan.17.t: "キルクークでの失敗"
 Kurdistan.17.d: "キルクークの戦いに敗れたことは不名誉だった。クルド人は依然として都市を支配しており、我々は屈辱を受けた。我々はまだ統一を追求すべきだろうか？"
 Kurdistan.17.a: "もう一度試そう、今度はもっと大規模に。"
 Kurdistan.17.b: "クルド人を放っておけ。"
 Kurdistan.18.t: "KDPが再統一協議を要求"
 Kurdistan.18.d: "[KUR.GetLeader]が率いるKDP政府は、我々が交渉のテーブルにつき、クルド統一政府に加わるよう要求してきた。彼らは、これは両政府間の敵対行為が終結した数年前に我々がすべきだったことだと主張しているが、今、彼らは我々が新政府に加わることをこれまで以上に強く求めているようだ。我々がそうするかどうかは我々次第だ。しかし、もしそうしなければ、KDPとの新たな紛争が始まるリスクを冒すことになる。"
 Kurdistan.18.a: "クルディスタンのために、我々は統一する"
 Kurdistan.18.b: "ありえない"
 Kurdistan.19.t: "PUKが再統一協議を拒否"
 Kurdistan.19.d: "It appears that the PUK government has refused to join our Unity Government, and as a result, they leave us no choice but to unify the Kurdish people under one banner."
 Kurdistan.19.a: "こうならざるを得なかったのは残念だ"
 Kurdistan.20.t: "PUKが再統一協議に同意"
 Kurdistan.20.d: "PUKは我々の統一政府への参加に同意し、現在、彼らの領土と部隊を新政府に統合するための交渉が進行中である。"
 Kurdistan.20.a: "素晴らしい"
 KurdistanNews.1.t: "クルディスタンがイラクに再合流"
 KurdistanNews.1.d: "ISISの最盛期、クルディスタンは徐々にイラクから離れ、より独立するようになった。ISISが敗北した今、クルディスタン地域政府は完全に方針を転換し、イラク連邦政府と再び協力し始める意向を表明したようだ。多くの人々は、クルド人が独立を目指すと推測していたが、彼らは隣国からの反発を恐れてか、別の決定を下したようだ。"
 KurdistanNews.1.a: "興味深い"
 KurdistanNews.2.t: "クルド独立住民投票"
 KurdistanNews.2.d: "クルド地域政府は、現在支配している地域で独立住民投票を実施すると発表した。この動きは、住民投票が公式にはクルド自治地域の一部ではなく、主要都市キルクークを含むイラク連邦国家の地域で実施されることを考えると、物議を醸している。\n\n多くの人々はこれをクルド人による単なる土地収奪と見なしているが、ISISからイラクを効果的に救った後、クルド人は独立する権利を得たと主張する者もいる。KRGは結果が拘束力を持たないと主張しているが、多くの人々はそれが完全な独立、そしておそらくはイラクにおける新たな紛争につながることを恐れている。"
 KurdistanNews.2.a: "こんなことをする権利はない！"
 KurdistanNews.2.b: "Let's see how this plays out."
 KurdistanNews.3.t: "クルド独立住民投票、成功"
 KurdistanNews.3.d: "クルド独立住民投票はクルド政府にとって大成功だった。投票率72%で「賛成」票が93%を占め、世界中のクルド人が喜んでいる。住民投票の成功により、クルド政府はイラク連邦政府からの完全な独立を宣言することを決定した。驚くべきことに、イラク政府はその要求に同意した。"
 KurdistanNews.3.a: "クルド人を止めなければならない。"
 KurdistanNews.3.b: "興味深い"
 KurdistanNews.4.t: "クルド独立住民投票、成功"
 KurdistanNews.4.d: "クルド独立住民投票はクルド政府にとって大成功だった。投票率72%で「賛成」票が93%を占め、世界中のクルド人が喜んでいる。住民投票の成功により、クルド政府はイラク連邦政府からのさらなる自治権を要求することを決定した。驚くべきことに、イラク政府はその要求に同意した。"
 KurdistanNews.4.a: "クルド人を止めなければならない。"
 KurdistanNews.4.b: "興味深い"
 KurdistanNews.5.t: "イラクがキルクークを占領"
 KurdistanNews.5.d: "イラクとクルディスタンの交渉が決裂したため、イラク軍は、クルド人が以前ISISから奪取したキルクーク市を占領するために動いた。イラク軍がキルクークに接近すると、ペシュメルガのほとんどの部隊は戦わずして都市から撤退した。クルド軍の一部の独立した部隊は残り、都市の防衛を試みたが、すぐにイラク軍に圧倒された。わずか2日間で、イラク軍は都市の完全な支配権を取り戻し、そのほとんどが戦闘なしであった。"
 KurdistanNews.5.a: "興味深い"
 KurdistanNews.6.t: "イラクがキルクークを占領"
 KurdistanNews.6.d: "As the negotiations between Iraq and Kurdistan broke down, Iraqi forces moved to capture the city of Kirkuk, which the Kurds had captured from ISIS earlier. As the Iraqi forces approached the city, Kurdish forces took up defensive positions, with main defenses being at the K1 military base and the Kirkuk-Tikrit Road.\n\nDespite strong defence, the Iraqi 9th Armoured Division managed to capture the military base and advance towards the Northern oil field of Baba Gurgur, while the Popular Mobilisation Forces tied down Kurdish troops in the city itself. Fearing encirclement, the Kurdish forces started retreating from the city, some under orders and some on their own. After a few days of fighting, Iraq was fully in control of the city."
 KurdistanNews.6.a: "興味深い"
 KurdistanNews.7.t: "クルディスタンがキルクークを防衛"
 KurdistanNews.7.d: "As the negotiations between Iraq and Kurdistan broke down, Iraqi forces moved to capture the city of Kirkuk, which the Kurds had captured from ISIS earlier. As the Iraqi forces approached the city, Kurdish forces took up defensive positions, with main defenses being at the K1 military base and the Kirkuk-Tikrit Road.\n\nIraqi 9th Armoured Division split their forces in two, as they attacked both the military base and the city itself through its Southern suburbs. At the same time, the Popular Mobilisation Forces attacked in the centre towards Kirkuk Airfield. As the 9th Armoured Division got bogged down in the suburbs, the Kurdish forces managed to conduct a flanking attack against the PMF forces, forcing them to retreat. With the centre destroyed, the separated elements of the 9th Armoured Division were soon forced to retreat as well. The Battle of Kirkuk proved to be disastrous for the Iraqi forces, while the morale of the Kurds was greatly boosted."
 KurdistanNews.7.a: "興味深い"
 KurdistanNews.8.t: "クルディスタン、イラクに服従"
 KurdistanNews.8.d: "After their victory in Kirkuk, Iraq has increased pressure towards Kurdistan. In a recent move, Iraq demanded that Kurdistan abandon all ideas of independence or increased autonomy. Having been left without a choice, the Kurdish government agreed to the demands to prevent any more bloodshed."
 KurdistanNews.8.a: "興味深い"
 KurdistanNews.9.t: "クルディスタンがイラクに抵抗"
 KurdistanNews.9.d: "After their victory in Kirkuk, Iraq has increased pressure towards Kurdistan. In a recent move, Iraq demanded that Kurdistan abandon all ideas of independence or increased autonomy. The Kurdish government responded that Iraq has already shown its hostility against the Kurdish people, and as such they have no reason to agree to the demands of bullies. This might spark a new civil war in Iraq"
 KurdistanNews.9.a: "興味深い"
 KurdistanNews.10.t: "イラクがクルディスタンに進軍"
 KurdistanNews.10.d: "The defeat at Kirkuk was a massive humiliation to Iraq. As a response to this, it seems they are preparing for a full-scale invasion of Kurdistan in order to bring the breakaway state back under Iraqi control."
 KurdistanNews.10.a: "興味深い"
 KurdistanNews.11.t: "イラクが孤立へと後退"
 KurdistanNews.11.d: "キルクークでの敗北はイラクにとって大きな屈辱だった。その敗北が、イラクのクルド人に対するいかなる敵意をも完全に失わせたようだ。クルド人は血をもって要求を勝ち取った。"
 KurdistanNews.11.a: "興味深い"
 KUR_the_great_divide: "クルドの大分裂"
 KUR_the_great_divide_desc: "クルド人の土地には亀裂がある。部族、政党、組織が領土を切り分け、クルド人民をさらに分裂させ、クルド統一という究極の目標を傷つけている。"
 KUR_propose_reunification: "[PUK.GetFlag] PUKとの再統一を提案"
 KUR_propose_reunification_desc: "With the creation of the Unity Government in 1993, the PUK should have already joined their Kurdish brothers. Now that the independence of all of Kurdistan is threatened, it is imperative that we push them to the negotiating table to preserve the freedom of our peoples."
 PUK_stomp_out_the_iek: "[IEK.GetFlag] [IEK.GetName]を排除せよ"
 PUK_stomp_out_the_iek_desc: "The IEK have long been a thorn in the side of our government. Their terroristic activities have hampered our legitimacy, and have hurt our ability to efficiently govern the territories to the East. The time has come for us to demand their submission once and for all."
 KUR_declare_kurdistan: "ペシュメルガ統一を宣言"
 KUR_declare_kurdistan_desc: "全てのクルド人の土地が我々の確固たる支配下にある今、我々はついにペシュメルガ地域における真のクルド国家であると正当に主張することができるだろう。"
 KUR_cores_on_all_TT: "[IRQ.GetFlag]イラク領クルディスタンの全ての州に中核州を獲得する"
 KUR_barzani_tribe: "バルザニ家の指導力"
 KUR_barzani_tribe_desc: "Coming from a Sufi, Sunni background, and originating from Barzan in Northern Kurdistan, the Barzani tribe has for the longest time, held a firm grip over the Kurdish region north of Iraq. This influence has allowed them to play a major role in Iraqi and Kurdish politics over time, often times swaying it one way or another.\n§W--------------§!\nThis national spirit will be §RRemoved§! if the £KUR_conservatism_small KDP is not in power."
 PUK_battle_hardened: "百戦錬磨"
 PUK_battle_hardened_desc: "PUKはイラン・イラク戦争で重要な役割を果たし、サダム軍に多くの損害を与えた。この経験により、我々の司令部と部隊は戦場で貴重な経験を得ることができた。\n§W--------------§!\nこの国民精神は£KUR_Autocracy_small PUKが政権を握っていない場合、§R除去§!される。"
 KurdistanNews.12.t: "ペシュメルガの統合：クルド系部隊が単一の指揮系統の下で結束"
 KurdistanNews.12.d: "バルザニ派のKDPとタラバニ率いるPUKの間で数十年にわたる対立が続いてきたが、イラク北部のクルド人政治情勢は劇的な変化を遂げた。画期的な動きとして、クルド人指導部は、すべてのペシュメルガ部隊を単一の指揮系統の下で完全に統合すると宣言し、1994年のクルド内戦以来、クルド軍の連携を阻害してきた内部対立に終止符を打った。\n\nKDPおよびPUK傘下の部隊に加え、ヤジディ教徒やキリスト教徒の少数派保護部隊に所属するペシュメルガも、今後は統一された省庁の下で活動することになる。この統合により、エルビルとスレイマニヤの治安部隊が事実上統合され、ドーフーク、キルクーク、ハラブジャの各地域が、近代史上初めて単一のクルド軍指揮系統の下に結集することとなる。\n\nこの統合は、ISISとの戦いでクルド系部隊が極めて重要な役割を果たしたことを受けて行われたものである。その戦いの最中、一貫性のある指揮系統の欠如が重大な弱点として繰り返し指摘されていた。この動きに対し、近隣諸国の首都、特にアンカラとテヘランからは懸念の声が上がっている。両国は、統一されたクルド軍の戦力を、同地域における自国の国家安全保障上の利益に対する直接的な脅威と見なしているからである。"
 KurdistanNews.12.a: "国境沿いに統一されたクルド人武装勢力が存在することは、我が国の国家安全保障にとって容認できない脅威である。"
 KurdistanNews.12.b: "クルド人の自己決定権にとって歴史的な前進ではあるが、地域における緊張が高まることは必至だ。"
 KUR_independence_category: "Independence"
 KUR_hold_independence_referendum: "Hold Independence Referendum"
 KUR_hold_independence_referendum_desc: "With the Peshmerga unified under a single command, the time has come to test the will of the Kurdish people. We will hold a non-binding referendum on independence across the autonomous region and the disputed territories under our control, including Kirkuk."