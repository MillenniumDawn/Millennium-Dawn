 SOV_expand_conscription: "Economía Informatizada"
 SOV_expand_conscription_desc: "Nuestra economía está anticuada. Nuestra gente es lo suficientemente inteligente como para usar computadoras en beneficio de Rusia. Nuestros científicos, trabajadores de fábricas y empleados del complejo militar-industrial deben operar las máquinas de computación electrónicas más potentes y eficientes para mejorar nuestra economía!"
