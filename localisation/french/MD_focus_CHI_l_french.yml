 CHI_bri_africa_engagement_desc: "Score d'engagement BRI accumulé pour l'Afrique ; requis avec les achèvements du FOCAC pour débloquer le couronnement de l'intégration continentale africaine."
 CHI_bri_centralasia_engagement_desc: "Score d'engagement BRI accumulé pour l'Asie centrale ; alimente les bonus du corridor de la Ceinture économique de la Route de la soie."
 CHI_bri_defaulted_projects_desc: "Nombre de projets où le bénéficiaire a fait défaut sur les termes du prêt ; déclenche le choix entre restructuration de la dette et saisie d'actifs."
 CHI_bri_europe_engagement_desc: "Score d'engagement BRI accumulé pour l'Europe ; nécessaire pour maintenir le mécanisme 17+1 et débloquer les bonus tardifs de connectivité européenne."
 CHI_bri_latam_engagement_desc: "Score d'engagement BRI accumulé pour l'Amérique latine ; débloqué en achevant des projets d'infrastructure au Venezuela, en Équateur, au Brésil, en Argentine et en Bolivie."
 CHI_bri_meast_engagement_desc: "Score d'engagement BRI accumulé pour le Moyen-Orient ; alimente les taux d'adoption du règlement en pétroyuan."
 CHI_bri_monthly_income_desc: "Revenu mensuel en renminbi généré par les projets BRI actifs avant application du multiplicateur de rendements."
 CHI_bri_pacific_engagement_desc: "Engagement chinois auprès des États insulaires du Pacifique : reconnaissances diplomatiques, concessions de pêcheries et de fonds marins, et ententes de sécurité."
 CHI_bri_predatory_score_desc: "Suit l'agressivité avec laquelle nous avons poursuivi les tactiques de levier de dette et de saisie d'actifs ; des valeurs élevées débloquent la voie de la doctrine d'Hambantota et augmentent les occasions de défaut-à-saisie."
 CHI_bri_project_slots_desc: "Nombre maximal de projets des Nouvelles routes de la soie que la Chine peut gérer simultanément"
 CHI_bri_returns_multiplier_desc: "Multiplicateur appliqué aux flux de retour des projets ; augmenté par les secrétaires IC actifs et certains achèvements de focalisations."
 CHI_bri_seasia_engagement_desc: "Score d'engagement accumulé des Nouvelles routes de la soie en Asie du Sud-Est ; influe sur la disponibilité de la décision de coopération Lancang-Mékong."
 CHI_bri_southasia_engagement_desc: "Score d'engagement BRI accumulé pour l'Asie du Sud ; affecte la vitesse de montée de palier et l'ampleur des bonus pour les partenaires sud-asiatiques."
 CHI_bri_winwin_score_desc: "Suit la constance avec laquelle nous avons appliqué des termes de prêt concessionnels et réformés ; des valeurs élevées débloquent la diplomatie de restructuration de la dette et améliorent la bonne volonté des bénéficiaires."
 CHI_Buffer_State_Doctrine: "Doctrine de l'État tampon"
 CHI_Buffer_State_Doctrine_desc: "La Corée du Nord sert de tampon stratégique entre nous et les forces alignées sur l'Amérique en Corée du Sud. En renforçant ce rôle, nous veillons à ce que Pyongyang reste fermement dans notre sphère d'influence et qu'aucune puissance hostile n'établisse une présence à notre frontière."
 CHI_chinese_aggression_display: "$CHI_chinese_aggression$ : [?CHI_chinese_aggression]"
 CHI_collective_leadership_active_desc: "Sept hommes autour d'une table. La ligne générale est ce que les sept hommes conviennent d'appeler la ligne générale."
 CHI_Dandong_Lifeline: "Le cordon de Dandong"
 CHI_Dandong_Lifeline_desc: "Dandong gère l'écrasante majorité du commerce extérieur de la Corée du Nord, et le flux se fait selon nos termes. Restaurer et étendre ce pipeline fournit à Pyongyang de l'oxygène économique tout en cimentant notre levier sur le régime."
 CHI_Enforce_Sanctions_Compliance: "Faire respecter les sanctions"
 CHI_Enforce_Sanctions_Compliance_desc: "En faisant réellement appliquer les sanctions internationales contre la Corée du Nord, nous démontrons notre engagement à la non-prolifération et gagnons la bonne volonté des États-Unis et du Japon. Pyongyang sera mécontent, mais notre standing dans la communauté internationale s'améliorera."
 CHI_focus_tree: "Arbre de concentration sur la Chine"
 CHI_Fortress_of_the_East: "Forteresse de l'Est"
 CHI_Fortress_of_the_East_desc: "Transformer la Corée du Nord en un État tampon impénétrable sert notre profondeur stratégique. Nous soutenons une doctrine de préparation militaire totale qui rend toute poussée contre Pyongyang prohibitivement coûteuse pour ceux qui tenteraient."
