 left_side_range: "야당의 영향력 미약"
 middle_left_side_range: "야당이 정치에 영향력 행사"
 far_left_side_range: "야당이 정치를 지배"
 coup_left_side_range: "국가의 제2 권력"
 right_side_range: "친러시아 세력이 정치에 영향력 행사"
