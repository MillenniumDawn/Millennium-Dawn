l_korean:
 colombia.1.t: "피닉스 작전"
 colombia.1.d: "콜롬비아 정보기관은 FARC의 2인자 라울 레예스가 에콰도르 국경 바로 건너편의 야영지에 있는 것을 파악했습니다. 군은 그를 제거하기 위한 국경 너머 공격의 승인을 요청하고 있습니다. 성공한다면 게릴라에게 큰 타격이 되겠지만, 에콰도르의 주권을 침해하면 외교 위기를 촉발할 수 있습니다."
 colombia.1.a: "국경 너머 공격을 개시한다"
 colombia.1.b: "에콰도르의 주권을 존중한다"
 colombia.2.t: "콜롬비아의 주권 침해"
 colombia.2.d: "콜롬비아 군은 에콰도르 영토에서 군사 작전을 수행하여 국경 너머 공습으로 FARC 지휘관 라울 레예스를 사살했습니다. 이는 전례 없는 우리 주권의 침해입니다."
 colombia.2.a: "콜롬비아를 공개적으로 규탄한다"
 colombia.2.b: "비공식 경로를 통해 처리한다"
 colombia.3.t: "안데스 위기의 고조"
 colombia.3.d: "콜롬비아가 국경 너머 군사 공격으로 에콰도르의 주권을 침해했습니다. 에콰도르는 이 공격을 규탄하고 지역 동맹국들에 지원을 요청하고 있습니다. 베네수엘라는 에콰도르와 함께할지 분쟁에서 빠질지 결정해야 합니다."
 colombia.3.a: "에콰도르를 지지하고 국경에 병력을 동원한다"
 colombia.3.b: "이 일에서 빠진다"
 colombia.4.t: "안데스의 대치"
 colombia.4.d: "FARC에 대한 콜롬비아의 국경 너머 공격 이후 콜롬비아, 에콰도르, 베네수엘라 사이에 외교 위기가 전개되고 있습니다. 에콰도르와 베네수엘라는 병력을 동원하고 있습니다. 미국은 어떻게 대응할지 결정해야 합니다."
 colombia.4.a: "콜롬비아를 지지한다. 그들은 FARC와 싸우고 있었다"
 colombia.4.b: "모든 당사자에게 자제를 촉구한다"
 colombia.5.t: "우리에 맞선 베네수엘라의 동원"
 colombia.5.d: "베네수엘라는 에콰도르와의 연대를 표하며 콜롬비아 국경에 군사력을 동원했습니다. 상황은 빠르게 고조되고 있으며 무력 충돌로 번질 위험이 있습니다."
 colombia.5.a: "방어를 준비한다"
 colombia.6.t: "미국의 지지"
 colombia.6.d: "미국은 FARC에 대한 콜롬비아의 행동을 공개적으로 지지하여 외교적 엄호를 제공하고 양자 동맹을 재확인했습니다."
 colombia.6.a: "워싱턴의 지지에 감사한다"
 colombia.7.t: "리우 그룹 정상회의"
 colombia.7.d: "리우 그룹은 안데스 위기를 중재하기 위해 긴급 정상회의를 소집했습니다. 지역 지도자들은 외교적 해결을 압박하고 있습니다. 콜롬비아는 사과하고 긴장을 완화하거나, 국경을 넘어 게릴라를 추적할 권리를 굳건히 고수할 기회를 가지고 있습니다."
 colombia.7.a: "사과하고 악수한다"
 colombia.7.b: "사과를 거부한다"
 colombia.8.t: "위기 해결"
 colombia.8.d: "콜롬비아는 리우 그룹 정상회의에서 공식 사과를 발표했습니다. 무력 충돌의 임박한 위협은 지나갔지만 관계는 여전히 긴장되어 있습니다."
 colombia.8.a: "사과를 받아들이고 물러선다"
 colombia.9.t: "안데스 위기 긴장 완화"
 colombia.9.d: "안데스 외교 위기는 리우 그룹 정상회의에서 해결되었습니다. 콜롬비아는 에콰도르의 주권을 침해한 것에 대해 사과했습니다. 국경에서 병력을 철수할 수 있습니다."
 colombia.9.a: "물러선다"
 colombia_news.1.t: "콜롬비아, 에콰도르 내 FARC 공습"
 colombia_news.1.desc: "콜롬비아 군은 에콰도르 영토에서 국경 너머 공습을 실시하여 FARC 고위 지휘관 라울 레예스를 사살했습니다. 키토는 대사를 소환하고 이번 작전이 국제법에 대한 명백한 위반이라고 선언했습니다. 베네수엘라와 에콰도르는 콜롬비아 국경에 병력을 동원하고 있습니다."
 colombia_news.1.a: "우리는 테러와 싸운 것에 대해 사과하지 않을 것이다"
 colombia_news.1.b: "이는 우리나라에 대한 침략 행위다"
 colombia_news.1.c: "에콰도르는 홀로 서지 않을 것이다"
 colombia_news.1.d: "FARC에 맞선 콜롬비아의 싸움은 국경을 존중해야 한다"
 colombia_news.1.e: "안데스가 긴장 상태에 빠졌다"
 colombia_news.1.f: "남아메리카의 지역 위기"
 colombia_news.2.t: "안데스 위기 해결"
 colombia_news.2.desc: "2008년 안데스 외교 위기는 콜롬비아가 에콰도르의 주권 침해에 대해 공식 사과를 발표한 뒤 리우 그룹 정상회의에서 끝났습니다. 지역 지도자들은 이 악수를 벼랑 끝에서 물러서는 한 걸음이라며 환영했지만, 세 나라 사이의 근본적인 긴장은 여전히 남아 있습니다."
 colombia_news.2.a: "외교가 승리했다, 당분간은"
 colombia_news.2.b: "우리는 사과를 받아들이고 앞으로 나아간다"
 colombia_news.2.c: "지역이 다시 숨을 쉴 수 있다"
 colombia_news.2.d: "남아메리카가 분쟁에서 물러서다"
