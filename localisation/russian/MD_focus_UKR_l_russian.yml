 UKR_lobby_the_deputies_tt: "Следующий запрос о расходах в §YВерховной Раде§! получит §G+30%§! к весу голосов «за» (на §Y60§! дней)"
 UKR_modernize_su27up2m: "Модернизация учебно-боевого самолёта §YСу-27УБ§!"
 UKR_modernize_su27up2m_desc: "\n\n\n\n\n\n£UKR_desctext_planes_modernization_su271m_for_tooltip\n\n\n\n\n\n\n\n\n§W§YСу-27УП2М§! — украинская модернизация §Rсоветского§! двухместного учебно-боевого самолёта §YСу-27УБ§!, разработанная Запорожским государственным авиаремонтным заводом §L«МиГремонт»§!.\nМодернизация включает улучшенную навигационно-информационную систему, нашлемную систему целеуказания и индикации, автомат отстрела дипольных отражателей и ложных тепловых целей, а также модернизированный вычислитель боевого применения.\nЭти улучшения расширяют возможности прицеливания и позволяют поражать воздушные и наземные цели более широким набором авиационного вооружения.\nВ игре самолёт использует систему РЭБ «Омут-КМ» вместо обновлённых средств противодействия.§!"
 UKR_modernize_su24mu: "Модернизация фронтового бомбардировщика §YСу-24М§!"
 UKR_modernize_su24mu_desc: "§W§YСу-24МУ§! — украинская модернизация §Rсоветского§! фронтового бомбардировщика §YСу-24М§!, приспособленная к требованиям современной войны.\nМодернизация включает бортовой комплекс радиоэлектронного противодействия §Y«Омут-КМ»§!, повышающий живучесть самолёта против вражеских ЗРК с радиолокационным наведением.\nСамолёт также приспособлен к применению современного высокоточного оружия, в том числе британско-французских крылатых ракет §YStorm Shadow§!, отечественных §YР-360Л «Нептун-Д»§! и других современных авиационных средств поражения, что значительно расширяет его ударные возможности.§!"
 UKR_modernize_l39_m1: "Модернизация учебно-тренировочного самолёта L-39C «Альбатрос»"
 UKR_developed_l39_m1_flag: "Выполнено решение §YМодернизация учебно-тренировочного самолёта L-39 «Альбатрос»§!"
 UKR_modernize_l39_m: "Дальнейшая модернизация учебно-тренировочного самолёта L-39C «Альбатрос»"
 UKR_modernize_l39_m1_desc: "§YL-39M1 «Альбатрос»§! — украинская модернизация §Rчехословацкого§! реактивного учебно-тренировочного самолёта §YL-39C§!, призванная улучшить лётные характеристики и продлить срок службы.\nМодернизация включает капитальный ремонт планера, замену штатного двигателя АИ-25ТЛ на более мощный АИ-25ТЛШ и доработку системы управления двигателем.\nВстроенная спутниковая навигационная система и обновлённый бортовой регистратор повышают точность навигации, качество контроля полёта и эксплуатационную надёжность.\nЭти улучшения повышают характеристики самолёта и продлевают срок службы имеющегося в Украине парка учебных самолётов §Rсоветской эпохи§!."
 UKR_modernize_l39_m_desc: "§YL-39M «Альбатрос»§! — дальнейшая украинская модернизация §Rчехословацкого§! реактивного учебно-тренировочного самолёта §YL-39C§!, призванная улучшить подготовку пилотов к современным боевым самолётам.\nПомимо улучшений §YL-39M1§!, самолёт получил бортовой тренажёрный комплекс §YБТК-39§! с многофункциональными индикаторами в кабине, индикатором на лобовом стекле и отдельными органами управления для имитации боевых режимов.\nСистема воспроизводит элементы прицельных и боевых систем истребителя МиГ-29, позволяя пилотам отрабатывать процедуры и боевые навыки на специальном учебном самолёте.\nОбеспечивая более совершенную учебную среду при значительно меньших эксплуатационных расходах, чем у фронтового истребителя, §YL-39M§! улучшает подготовку пилотов и сохраняет пользу от имеющегося в Украине парка учебных самолётов."
 UKR_develop_horlytsia: "Разработка БПЛА §YАн-БК-1 «Горлица»§!"
 UKR_develop_horlytsia_desc: "§W§YАн-БК-1 «Горлица»§! — украинский тактический разведывательно-ударный беспилотный летательный аппарат, разработанный государственным предприятием §Y«Антонов»§!.\nПредназначенный для поддержки сухопутных войск, он сочетает круглосуточную воздушную разведку со сбором разведданных и обнаружением целей в реальном времени.\nБортовые средства наблюдения позволяют обнаруживать и сопровождать вражеские цели, передавая ценную информацию артиллерийским подразделениям и командирам на поле боя.\nАппарат также может нести оружие для поражения наземных целей, что даёт дополнительную возможность высокоточных ударов при меньшем риске для пилотируемой авиации.§!"
 UKR_zelenskiy_popularity_TT: "£ukr_servant_of_the_people (SN) Изменение популярности «Слуги народа»: §G+12.00%§!"
 UKR_sevastopol_received: "(§Gполучено§!)"
 UKR_sevastopol_not_received: "(§Rне получено§!)"
 UKR_restore_an_71_with_project: "Возобновить работы над §YАн-71§!\nсамолётом ДРЛО §G(проект ДРЛО завершён)§!"
 UKR_restore_an_71_with_project_desc: "\n\n\n\n\n\n£UKR_desctext_planes_modernization_soviet_an_71_development_for_tooltip\n\n\n\n\n\n\n\n\n§W§YАн-71§! — самолёт дальнего радиолокационного обнаружения, построенный §LАНТК им. Антонова§! на базе транспортного §YАн-72§!, с обтекателем радара на вершине стреловидного вперёд киля. Он впервые поднялся в воздух 12 июля 1985 года, чтобы управлять §Rсоветской§! фронтовой авиацией, но программа закончилась вместе с §RСоветским Союзом§!, а его радар §Y«Вега-М» «Квант»§! так и не справился полностью с отражениями от земли.\nОпытный экземпляр §Y№ 03§! после 362 полётов по-прежнему стоит на «Антонове», а Индия проявляла интерес к покупке этого типа. Возобновление программы дало бы нашим ВВС собственный самолёт ДРЛО.\n\n§GОсобо важный военный проект:§! после его завершения §YВерховная Рада§! будет охотнее одобрять увеличение военного бюджета.§!\n\n§GНаши инженеры уже завершили проект §YВоздушной системы предупреждения и управления§!, поэтому работа пойдёт §Gбыстрее§! и обойдётся §Gдешевле§!.§!"
 UKR_restore_an_71_without_project: "Возобновить работы над §YАн-71§!\nсамолётом ДРЛО §R(нет проекта ДРЛО)§!"
 UKR_restore_an_71_without_project_desc: "\n\n\n\n\n\n£UKR_desctext_planes_modernization_soviet_an_71_development_for_tooltip\n\n\n\n\n\n\n\n\n§W§YАн-71§! — самолёт дальнего радиолокационного обнаружения, построенный §LАНТК им. Антонова§! на базе транспортного §YАн-72§!, с обтекателем радара на вершине стреловидного вперёд киля. Он впервые поднялся в воздух 12 июля 1985 года, чтобы управлять §Rсоветской§! фронтовой авиацией, но программа закончилась вместе с §RСоветским Союзом§!, а его радар §Y«Вега-М» «Квант»§! так и не справился полностью с отражениями от земли.\nОпытный экземпляр §Y№ 03§! после 362 полётов по-прежнему стоит на «Антонове», а Индия проявляла интерес к покупке этого типа. Возобновление программы дало бы нашим ВВС собственный самолёт ДРЛО.\n\n§GОсобо важный военный проект:§! после его завершения §YВерховная Рада§! будет охотнее одобрять увеличение военного бюджета.§!\n\n§RМы не завершили проект §YВоздушной системы предупреждения и управления§!, поэтому «Антонову» придётся начинать с нуля: работа займёт §Rбольше времени§! и обойдётся §Rдороже§!. Проект будет завершён попутно.§!"
 UKR_restore_an_71_phalcon_mission: "Одобрение Израиля для §YPhalcon§!"
 UKR_restore_an_71_phalcon_mission_desc: "§WElta поставит радар §YPhalcon§! для §YАн-71§!, только если Иерусалим доверяет нам достаточно, чтобы одобрить экспорт. Сам радар будет готов вовремя, но сделка зависит от политики.\n\n§YТребования:§!\n- Мнение §YИзраиля§! о нас не ниже §Y40§!\n- Наше влияние на §YИзраиль§! больше §Y5%§!\n\nВ случае неудачи сделка отменяется, и Израиль возвращает лишь часть денег.§!"
 ukraine_modernize_planes_restore_an_71_kvant_fast_tt: "Примерно через §Y4 месяца§! §YАн-71§! снова поднимется в воздух с советским радаром §Y«Квант»§! (§Y$weap_buff_awacs_1$§!)."
 ukraine_modernize_planes_restore_an_71_kvant_slow_tt: "Примерно через §Y6 месяцев§! §YАн-71§! снова поднимется в воздух с советским радаром §Y«Квант»§! (§Y$weap_buff_awacs_1$§!). Проект §YВоздушной системы предупреждения и управления§! будет завершён попутно."
 ukraine_modernize_planes_restore_an_71_phalcon_fast_tt: "Израильский радар §YPhalcon§! будет готов примерно через §Y3 месяца§!, но §YАн-71У§! полетит с ним (§Y$weap_buff_awacs_2$§!), только если Израиль одобрит экспорт (см. миссию)."
 ukraine_modernize_planes_restore_an_71_phalcon_slow_tt: "Израильский радар §YPhalcon§! будет готов примерно через §Y5 месяцев§!, но §YАн-71У§! полетит с ним (§Y$weap_buff_awacs_2$§!), только если Израиль одобрит экспорт (см. миссию). Проект §YВоздушной системы предупреждения и управления§! будет завершён попутно."
 ukraine_modernize_planes_restore_an_71_phalcon_mission_tt: "В течение §Y6 месяцев§! мнение §YИзраиля§! о нас должно достичь §Y40§!, а наше влияние на Израиль должно превысить §Y5%§!. Иначе Израиль отменит сделку и вернёт лишь §Rчасть§! денег."
 ukraine_modernize_planes_restore_an_71_kvant_after_israel_tt: "§GИзраиль возвращает часть денег§!. Примерно через §Y3–5 месяцев§! §YАн-71§! полетит с советским радаром §Y«Квант»§! (§Y$weap_buff_awacs_1$§!). §RРоссийское§! влияние на нас §Rнемного растёт§!."
 ukraine_modernize_planes_restore_an_71.6.name: "Израиль отменяет сделку по радару"
 ukraine_modernize_planes_restore_an_71.6.desc: "Отношения с Израилем не достигли уровня, необходимого для одобрения экспорта радара §YPhalcon§!. Иерусалим заморозил контракт и согласился вернуть часть денег. «Антонову» остаётся только вернуться к советскому радару, а Москва с интересом наблюдает за ситуацией."
 ukraine_modernize_planes_restore_an_71.6.a: "Вернуться к §Y«Кванту»§! с «Вегой-М»"
 UKR_an_71_phalcon_ready_flag: "Израильский радар §YPhalcon§! для §YАн-71§! готов."
 ukraine_rada.3.a: "Признать голосование большинства"
 ukraine_rada.3.b: "Велеть нашим людям вернуться в зал"
 ukraine_rada.4.a: "Зал снова наш"
 ukraine_rada.5.a: "Распределить их между группами большинства"
 ukraine_rada.5.b: "Оставить их левым"
 ukraine_rada.6.a: "Пересчитать голоса"
 ukraine_rada.7.a: "Заставить Раду внести результат в конституцию"
 ukraine_rada.7.b: "Взять мандат и не трогать конституцию"
 ukraine_rada.8.a: "Теперь кланы строят партии"
 ukraine_rada.9.a: "Принять их в большинство"
 ukraine_rada.9.b: "Пусть голосуют по каждому законопроекту отдельно"
 ukraine_rada.10.a: "У Востока есть партия"
 ukraine_rada.13.a: "Компетентность без энтузиазма"
 ukraine_rada.14.a: "У оппозиции есть имя"
 ukraine_gongadze.1.a: "Стоит. Отправить проверяющих."
 ukraine_gongadze.1.b: "Пусть пишет. Интернет никто не читает."
 ukraine_gongadze.2.a: "Пусть это станет личным."
 ukraine_gongadze.2.b: "Ограничиться бумагами: проверки, суды, лицензии."
 ukraine_gongadze.3.a: "Предложить ему место в новом антикоррупционном комитете."
 ukraine_gongadze.3.b: "Пусть силовики отпугнут его навсегда."
 ukraine_gongadze.4.a: "Вопрос закрыт."
 ukraine_gongadze.5.a: "Тогда им скажут кое-что другое."
 ukraine_yushchenko.1.a: "Вызвать его и заставить сказать обратное."
 ukraine_yushchenko.1.b: "Промолчать. Его избиратели — и наши избиратели."
 ukraine_yushchenko.2.a: "Его подпись будет на письме."
 ukraine_yushchenko.2.b: "Пусть письмо выйдет только за нашей подписью."
 ukraine_yushchenko.3.a: "Пусть назовут свою цену."
 ukraine_yushchenko.3.b: "Сказать им, что премьер-министр не продаётся."
 ukraine_yushchenko.4.a: "Отправить его в отставку. Пусть Рада оформит это официально."
 ukraine_yushchenko.4.b: "Оставить его, но отнять все оставшиеся у него назначения."
 UKR_tarashcha_shadow_idea: "Тень Таращанского леса"
 UKR_tarashcha_shadow_idea_desc: "Обезглавленное тело в лесу под Киевом, опознание, которое государство оспаривает, и дело, которое никто в прокуратуре не хочет брать. Теперь каждое решение в офисе президента читают через эту призму."
 UKR_cassette_scandal_idea: "Кассетный скандал"
 UKR_cassette_scandal_idea_desc: "Сотни часов записей, сделанных из-под дивана в кабинете самого президента. Иностранные кредиторы перестали перезванивать, министерства перестали подписывать что-либо, что потом могут зачитать вслух, а каждый чиновник в стране теперь исходит из того, что его записывают."
 ukraine_gongadze.6.a: "Останки не опознаны. Так и сказать и повторять это."
 ukraine_gongadze.6.b: "Подтвердить опознание и возбудить дело об убийстве."
 UKR_bsf_lease_cost_text: "£pol_power §H[?UKR_bsf_lease_pp_cost|0]§!  £command_power §H[?UKR_bsf_lease_cp_cost|0]§!"
 UKR_bsf_lease_cost_text_blocked: "£pol_power §R[?UKR_bsf_lease_pp_cost|0]§!  £command_power §R[?UKR_bsf_lease_cp_cost|0]§!"
 UKR_crimea_deterrent_donbas_control_met: "регион §Gпод контролем§! §Y[UKR.GetNameWithFlag]§! (§Gполучено§!)"
 UKR_crimea_deterrent_donbas_control_not_met: "регион §Rне под контролем§! §Y[UKR.GetNameWithFlag]§! (§Rне получено§!)"
 UKR_crimea_deterrent_met: "(§Gполучено§!)"
 UKR_crimea_deterrent_not_met: "(§Rне получено§!)"
 ukraine_rada.3.name: "Большинство собирается в Украинском доме"
 ukraine_rada.3.desc: "Двести тридцать семь депутатов покинули сессионный зал и зарегистрировались через дорогу, в Украинском доме. Левые по-прежнему удерживают зал, трибуну и табло для голосования, поэтому новое пропрезидентское большинство проголосовало за пределами здания за отзыв спикера Александра Ткаченко и его заместителя-коммуниста Адама Мартынюка. Ткаченко называет это путчем, остаётся в своём кабинете и отказывается открывать заседание, которое не может контролировать. Обе половины Верховной Рады теперь считают себя парламентом, и тот, который признаем мы, им и станет."
 ukraine_rada.4.name: "Иван Плющ занимает кресло спикера"
 ukraine_rada.4.desc: "Большинство избрало председателем Верховной Рады Ивана Плюща. Он руководил парламентом, проголосовавшим за независимость в 1991 году, и ни у кого нет сомнений, чей он кандидат. Но настоящий приз достался его первому заместителю: социал-демократ Виктор Медведчук теперь контролирует повестку дня, списки комитетов и время каждого голосования. Левые вернулись в зал, потому что больше ничего не остаётся, и законопроекты, застрявшие на год, наконец можно поставить на голосование."
 ukraine_rada.5.name: "«Солидарность» и конец двух фракций"
 ukraine_rada.5.desc: "Реестр фракций перекроили за один день. Пётр Порошенко собрал семнадцать депутатов в новую группу «Солидарность», а Крестьянская партия Александра Ткаченко и остатки «Громады» Павла Лазаренко опустились ниже минимума и прекратили существование. Около тридцати депутатов теперь остаются вне фракций, и их обхаживают все, кому есть что предложить в виде места в комитете. В зале не изменилось ничего, кроме арифметики, а в этом парламенте арифметика и есть политика."
 ukraine_rada.6.name: "Распад «Независимых»"
 ukraine_rada.6.desc: "«Независимые» перестали делать вид, что они группа. Их депутатов никогда не объединяло ничего, кроме удобства зарегистрированного названия, а раз места в комитетах раздают внутри большинства, оставаться вне его больше незачем. Почти все ушли в «Возрождение регионов» Александра Волкова, несколько человек — в «Трудовую Украину», а горстка не ушла никуда. В зале стало на одну группу меньше, а у большинства — на несколько надёжных голосов больше."
 ukraine_rada.7.name: "Всеукраинский референдум"
 ukraine_rada.7.desc: "Проголосовал восемьдесят один процент избирателей, и каждый вопрос набрал более восьмидесяти процентов. Теперь президент может распустить Верховную Раду, если она не сформирует большинство или не примет бюджет вовремя; депутаты лишаются неприкосновенности; парламент должен сократиться с четырёхсот пятидесяти мест до трёхсот, и должна появиться вторая палата, представляющая регионы. Результат обязателен, но сам по себе бесполезен, потому что внести его в конституцию могут только сами депутаты. И этим депутатам четыре пятых страны только что сказали, что их мандаты и неприкосновенность мы можем забрать."
 ukraine_rada.8.name: "«Трудовая Украина» становится партией"
 ukraine_rada.8.desc: "Депутатская группа вокруг Сергея Тигипко и Игоря Шарова зарегистрировалась как политическая партия. Ещё сегодня утром «Трудовая Украина» была строчкой в реестре депутатских групп и телефонным списком днепропетровских директоров. С сегодняшнего дня у неё есть устав, съезд и региональные отделения, и она намерена пустить в ход всё это. Деньги, которые раньше шли на кампании депутатов поодиночке, теперь пойдут в партийную машину, а расплачиваться за это своими членами придётся Народно-демократической партии."
 ukraine_rada.9.name: "У партии «Яблоко» появилась фракция"
 ukraine_rada.9.desc: "Михаил Бродский наконец собрал нужные подписи, и у партии «Яблоко» появилась собственная фракция в Верховной Раде. Большую часть года её депутаты голосовали вместе с большинством, оставаясь вне его, а теперь будут делать это изнутри, с местом за столом, где делят комитеты. Это маленькая фракция мелких предпринимателей, и её цена — дерегулирование, а не должности."
 ukraine_rada.10.name: "Партия регионов"
 ukraine_rada.10.desc: "Партия регионального возрождения Украины провела объединительный съезд с четырьмя небольшими партиями и вышла из него под новым названием — Партия регионов. Председателем стал глава налоговой администрации Николай Азаров, Владимир Рыбак остаётся в руководстве, а деньги остаются у донецких директоров. В программе ничего не изменилось: регионы против центра, промышленность против киевских банков. Зато название теперь достаточно короткое, чтобы поместиться в избирательный бюллетень, ради этого его и меняли."
 ukraine_rada.13.name: "Правительство промышленников"
 ukraine_rada.13.desc: "Анатолий Кинах утверждён премьер-министром. Десять лет он руководил Союзом промышленников и предпринимателей, и он кандидат директоров: никакой программы реформ, никаких ссор с энергетическими трейдерами и никакого желания повторить ошибку предшественника, взявшегося кого-то проверять. Большинство, развалившееся из-за Ющенко, снова собралось вокруг человека, которого никто не боится, и президент вернул себе правительство."
 ukraine_rada.14.name: "Блок Юлии Тимошенко"
 ukraine_rada.14.desc: "То, что в феврале начиналось как Форум национального спасения, когда половина оппозиции собралась требовать отставки президента, превратилось в избирательный блок. Его ядро — «Батькивщина», а сорокалетняя женщина, вышедшая из тюрьмы в марте, — его имя и лицо. У блока нет денег, которые правительство не пыталось бы изъять, и нет телевидения, готового его показывать, но это единственная часть оппозиции, организованная для избирательной кампании, а не для протеста."
 ukraine_gongadze.1.name: "Расследования «Украинской правды»"
 ukraine_gongadze.1.desc: "Интернет-издание без типографии, без лицензии и с редакцией из шести человек стало единственным в стране, которое публикует то, чего не печатают другие. Георгий Гонгадзе и «Украинская правда» ведут серию материалов о приватизации энергетики, о том, кому принадлежат региональные телеканалы, и о людях, которые ставят подписи и там, и там. Ни для кого в этом здании это не новость. Новое то, что всё это записано, датировано и доступно любому, у кого есть модем. Глава налоговой администрации спросил, не то чтобы прямо, стоит ли редакции ждать визита."
 ukraine_gongadze.2.name: "Последствия давления"
 ukraine_gongadze.2.desc: "Проверяющие пришли и ушли, сервер один раз изъяли и вернули, а издание продолжает выходить. Гонгадзе написал открытое письмо генеральному прокурору, где сообщил, что за ним следят, и попросил официально зафиксировать этот факт, а копии разослал во все посольства в Киеве. Люди, которым поручили его утихомирить, теперь хотят знать, насколько далеко им позволено зайти, и хотят услышать это так, чтобы на бумаге ничего не осталось."
 ukraine_gongadze.3.name: "Новая волна разоблачений"
 ukraine_gongadze.3.desc: "Игнорировать его не получилось. Следующая серия уже анонсирована: финансирование последней президентской кампании, названные счета, названные посредники. Оценка МВД, переданная устно и нигде не записанная: журналист перестал быть раздражителем и стал угрозой системе. Есть два способа ответить на это, не прибегая к тому, о чём первым делом подумал каждый в этой комнате."
 ukraine_gongadze.4.name: "Журналист замолкает"
 ukraine_gongadze.4.desc: "Серия так и не вышла. Гонгадзе перестал публиковаться, отключил телефон и уехал из Киева; коллеги говорят — в Прагу, мать говорит, что не знает. Издание продолжает работать, другие люди пишут о другом, а приватизация энергетики ушла с первых полос. Нет тела, нет плёнок и нет площади, полной палаток. Зато у каждого редактора в стране теперь есть очень ясное понимание того, что происходит с теми, кто не останавливается."
 ukraine_gongadze.5.name: "Журналист уходит в подполье"
 ukraine_gongadze.5.desc: "Он перестал писать, чего и добивались, и все, кто это приказал, доложили наверх об успехе. Но работать он не перестал. Шесть недель он ночует в чужих квартирах, собирает документы, которые не мог опубликовать раньше, и говорит двум коллегам, знающим, где он, что следующий материал будет самым важным. Людям, которым велели его запугать, теперь сообщили, что запугать его не вышло."
 ukraine_yushchenko.1.name: "Премьер-министр выбивается из строя"
 ukraine_yushchenko.1.desc: "Палатки на площади ещё стоят, а премьер-министр дал интервью. Он не называет протестующих экстремистами, не защищает Администрацию и дважды повторяет, что государство не должно применять силу против собственных граждан. Его аппарат настаивает, что это не было политическим заявлением. Каждая газета в стране подала его именно так. Бизнес-группы, которые оплачивают большинство в Раде, всё утро выясняли, чьё это правительство."
 ukraine_yushchenko.2.name: "Письмо трёх"
 ukraine_yushchenko.2.desc_summoned: "Он пришёл, выслушал и ни на что в этой комнате не согласился. Вместо этого Администрация подготовила совместное письмо за подписями президента, председателя Рады и премьер-министра, в котором протестное движение названо украинской разновидностью национал-социализма, а его организаторы — людьми, готовыми сжечь страну, лишь бы избавиться от одного человека. Плющ подписывает его сегодня. Значение имеет только третья подпись, потому что только её кто-то удивится увидеть."
 ukraine_yushchenko.2.desc_ignored: "Ему ничего не сказали, и сам он больше ничего не сказал, что Администрация решила считать согласием. Подготовлено совместное письмо за подписями президента, председателя Рады и премьер-министра, в котором протестное движение названо украинской разновидностью национал-социализма. Плющ подписывает его сегодня. Ющенко пока никто не спросил, подпишет ли он, а проект ушёл в его секретариат так, будто ответ очевиден."
 ukraine_yushchenko.3.name: "За закрытыми дверями"
 ukraine_yushchenko.3.desc: "Вопрос о премьер-министре переместился из газет в столовую загородного дома под Киевом. Люди за этим столом хотят его ухода не из-за протестов. Они хотят его ухода, потому что он покончил с бартерными схемами на энергетическом рынке, начал выплачивать пенсионные долги живыми деньгами и стал спрашивать, какие компании освобождены от каких налогов и по чьему решению. Голосов в Раде им хватит, чтобы сделать это когда угодно. Сегодня вечером они обсуждают цену этого шага и то, кто её заплатит."
 ukraine_yushchenko.4.name: "Администрация решает"
 ukraine_yushchenko.4.desc: "Ответ нужен на этой неделе. Оставить его — значит получить правительство, которое не выполняет указаний, Администрацию, которая не может призвать к порядку собственный кабинет, и большинство в Раде, которое назло начнёт голосовать по-своему. Убрать его — значит подарить оппозиции самого популярного человека в стране, без работы, без чего-либо, что ещё можно потерять, и с репутацией, которую у него никто не отнимет. Третьего ответа нет, и те, кто хочет его ухода, перестали делать вид, что он может быть."
 ukraine_gongadze.6.name: "Тело в Таращанском лесу"
 ukraine_gongadze.6.desc: "Его нашли жители села в лесу под Таращей, в неглубокой могиле, без головы, и местный судмедэксперт шесть недель держал тело у себя, прежде чем кому-то в Киеве сообщили. Украшения — его, повреждения одной руки совпадают с его старым переломом, и коллеги опознали то, что осталось. Генеральный прокурор объявил, что останки принадлежат неизвестному мужчине и что экспертиза продолжается. Ему никто не верит, и, похоже, он этого и не ждёт."
 ukraine_sc.1.name: "Верховный суд и спорные округа"
 ukraine_sc.1.desc: "В Верховный суд поступило более трёхсот жалоб по одномандатным округам. Судьи дважды заявили, что не могут сами отменить результаты выборов: это может сделать только Центральная избирательная комиссия, и она уже отменила голосование в нескольких округах, где в июле пройдут повторные выборы. Наблюдатели признают за судом некоторую независимость, но голоса, подсчитанные с сомнениями, остаются подсчитанными."
 ukraine_sc.1.a: "Решать будет Комиссия."
 ukraine_sc.1.b: "Пусть жалобы рассмотрят в полном объёме."
 ukraine_stay.0.name: "Блок премьер-министра"
 ukraine_stay.0.desc: "Премьер-министр объявил, что поведёт избирательный блок на парламентские выборы следующего года и намерен при этом сохранить за собой кабинет. Десять национал-демократических и либеральных партий уже согласовывают список. Никто не припомнит, чтобы глава правительства вёл кампанию против Администрации, которая его назначила, и Администрация ещё не решила, считать ли это досадной помехой или объявлением войны."
 ukraine_stay.0.a: "Терпеть блок."
 ukraine_stay.0.b: "Заставить его выбирать между блоком и кабинетом."
 ukraine_stay.1.name: "Премьер переживает выборы"
 ukraine_stay.1.desc: "Блок Ющенко занял первое место по партийным спискам, набрав около двадцати трёх процентов, а премьер-министр, который его возглавлял, по-прежнему сидит в своём кабинете на улице Грушевского. Пропрезидентские группы занимают в зале больше мест, чем блок, а коммунисты — остальные места оппозиции, поэтому в Администрации ещё никто не решил, каким будет это сосуществование. Президенту предстоит выбирать между кабинетом, который он не контролирует, и премьером, которого он не может позволить себе уволить, пока не решены вопросы спикерского кресла и большинства."
 ukraine_stay.1.a: "Оставить его, но сохранить контроль Администрации над кабинетом."
 ukraine_stay.1.b: "Оставить его и дать ему кабинет, которого он просит."
 ukraine_stay.2.name: "Большинство против премьера"
 ukraine_stay.2.desc: "Девять фракций и групп — «Трудовая Украина» вместе с промышленниками, «Регионы Украины», СДПУ(о), «Европейский выбор», «Демократические инициативы», народные демократы и другие — объявили себя парламентским большинством. Премьер-министр в него не входит, и его мнения никто не спрашивал. Большинство, не поддерживающее кабинет, ставит вопрос о будущем этого кабинета, и Администрация может либо ответить на него, либо дать ему разрастись."
 ukraine_stay.2.a: "Использовать большинство как рычаг против премьера."
 ukraine_stay.2.b: "Не подпускать большинство к кабинету."
 ukraine_stay.3.name: "Вотум недоверия"
 ukraine_stay.3.desc: "Большинство внесло проект постановления о недоверии кабинету Ющенко. Для этого нужно двести двадцать шесть голосов; большую часть найдут фракции большинства, а остальные — коммунисты, не забывшие бартерных схем, которые он прикрыл. Президент не просил об этом голосовании, но и не запрещал его."
 ukraine_stay.3.a: "Заставить большинство его снять."
 ukraine_stay.3.b: "Дать постановлению провалиться."
 ukraine_rada.15.name: "Донецкий губернатор становится премьер-министром"
 ukraine_rada.15.desc: "Президент Кучма уволил Анатолия Кинаха и выдвинул губернатора Донецкой области Виктора Януковича. Рада утверждает его двумястами тридцатью четырьмя голосами — всего на восемь больше необходимых двухсот двадцати шести. Донецкий клан входит в Кабинет министров в полном составе, а Николаю Азарову остаются считаные дни до кресла первого вице-премьера."
 ukraine_rada.15.desc_removed: "После ухода Виктора Ющенко президент выдвинул губернатора Донецкой области Виктора Януковича. Рада утверждает его двумястами тридцатью четырьмя голосами — всего на восемь больше необходимых двухсот двадцати шести. Донецкий клан входит в Кабинет министров в полном составе, а Николаю Азарову остаются считаные дни до кресла первого вице-премьера."
 ukraine_rada.15.a: "Рада утверждает Януковича."
 ukraine_rada.15.b: "Первое голосование проваливается, нужна компромиссная кандидатура."
 ukraine_reform03.1.name: "Реформа президента"
 ukraine_reform03.1.desc: "Президент внёс в Раду собственное видение политической реформы в виде законопроекта 3207. Он обещает более сильный парламент и правительство, формируемое большинством, когда-нибудь в будущем, и никому не сокращает срок полномочий. Лидер коммунистов уже заявил, что даже «Наша Украина» может найти в нём что-то для себя, и именно эту фразу Администрация и хотела от кого-нибудь услышать."
 ukraine_reform03.1.desc_stay: "Президент внёс в Раду собственное видение политической реформы в виде законопроекта 3207. Он обещает более сильный парламент и правительство, формируемое большинством, когда-нибудь в будущем, и никому не сокращает срок полномочий. Пока Ющенко остаётся премьер-министром, «Наша Украина» сидит по обе стороны стола: её министры должны защищать проект, а её фракция — голосовать против него."
 ukraine_reform03.1.a: "Внести президентский законопроект в Раду."
 ukraine_reform03.1.b: "Сначала договориться с Морозом и Симоненко."
 ukraine_reform03.2.name: "Законопроект Медведчука — Симоненко"
 ukraine_reform03.2.desc: "Виктор Медведчук и Пётр Симоненко зарегистрировали законопроект 4105: в 2004 году президента изберут всенародно на короткий срок, а с 2006 года его будет избирать парламент. Через пятнадцать дней регистрируют почти идентичного близнеца — законопроект 4180 — как второй путь к тому же результату. «Наша Украина», социалисты и Блок Юлии Тимошенко видят в этом сделку Администрации с руководством компартии; коммунисты видят способ урезать президентскую власть."
 ukraine_reform03.2.a: "Поддержать законопроект 4105."
 ukraine_reform03.2.b: "Оставить президентский законопроект 3207 единственным вариантом."
 ukraine_reform03.3.name: "Суд одобряет законопроект 4105"
 ukraine_reform03.3.desc: "Конституционный суд проверил законопроект 4105 на соответствие положениям, запрещающим поправки, которые ограничивают права человека, угрожают независимости или повторяют отклонённую поправку в течение года, и не нашёл препятствий. Через месяц он даст такое же заключение по законопроекту-близнецу 4180. Оппозиция говорит, что судьям задали максимально узкий вопрос и они дали максимально узкий ответ."
 ukraine_reform03.3.a: "Передать заключение в Раду."
 ukraine_reform03.3.b: "Направить в Суд и законопроект-близнец 4180."
 ukraine_reform03.4.name: "Коммунист в кабинете спикера"
 ukraine_reform03.4.desc: "Адам Мартынюк из фракции коммунистов избран первым заместителем председателя Рады вместо Геннадия Васильева. Критики говорят, что эта должность — плата за голоса коммунистов за политическую реформу; коммунисты говорят, что это просто кресло, положенное фракции их размера. Так или иначе, партия, четыре года голосовавшая против президента, теперь имеет кабинет в его коридоре."
 ukraine_reform03.4.a: "Отдать коммунистам кресло."
 ukraine_reform03.4.b: "Отказаться от сделки."
 ukraine_reform03.5.name: "Голосование поднятием рук"
 ukraine_reform03.5.desc: "На хаотичном заседании большинство объявляет законопроект 4105 предварительно одобренным двумястами семьюдесятью шестью голосами, подсчитанными по поднятым рукам из президиума. Коммунисты проголосовали вместе с большинством, нарушив общую позицию оппозиции, и «Наша Украина», социалисты и Блок Юлии Тимошенко обвиняют Симоненко в партнёрстве с олигархами. Для окончательного голосования понадобится триста голосов."
 ukraine_reform03.5.a: "Объявить законопроект одобренным."
 ukraine_reform03.5.b: "Настаивать на поимённом голосовании."
 ukraine_ccourt.1.name: "Два представления"
 ukraine_ccourt.1.desc: "Две группы депутатов — пятьдесят три в одном представлении и сорок семь в другом — попросили Конституционный суд истолковать положение, запрещающее одному человеку занимать пост президента более двух сроков подряд. Вопрос сформулирован тщательно, и очевидно, кому он выгоден: первый срок президента пришёлся на старую конституцию, а текст 1996 года не говорит, как его считать. В этом месяце Суд ничего не решит, но авторы представлений точно знают, что хотят от него услышать."
 ukraine_ccourt.1.a: "Пусть депутаты сами продвигают представления."
 ukraine_ccourt.1.b: "Поручить Администрации подготовить почву среди судей."
 ukraine_ccourt.1.c: "Велеть депутатам отозвать представления."
 ukraine_ccourt.2.name: "Судьи совещаются"
 ukraine_ccourt.2.desc: "В тот же день, когда Конституционный суд одобряет второй законопроект о реформе, он берётся за дело о президентских сроках. Докладчик — судья Василий Немченко. В Киеве говорят, что судьям звонят, что для них устраивают ужины и что у некоторых вдруг нашлись срочные дела в другом месте; пресс-служба Суда не говорит ничего."
 ukraine_ccourt.2.a: "Оставить Суд в покое."
 ukraine_ccourt.2.b: "Надавить на судей."
 ukraine_ccourt.4.name: "Суд закрывает дверь"
 ukraine_ccourt.4.desc: "Конституционный суд постановил, что первый срок президента засчитывается: Конституция ограничивает любого человека двумя сроками подряд, и судьи не видят причин начинать отсчёт с 1999 года. Президент не может баллотироваться в следующем году. У Администрации есть около десяти месяцев, чтобы найти преемника, который сможет победить и которому можно доверять, а политическая реформа, задуманная как страховка, только что стала всем планом."
 ukraine_ccourt.4.a: "Принять решение и искать преемника."
 ukraine_ccourt.4.b: "Провести политическую реформу до выборов."
 ukraine_ccourt.5.name: "Суд уходит от ответа"
 ukraine_ccourt.5.desc: "Конституционный суд отказался давать толкование, которого просили депутаты, и вернул представления по процедурным основаниям. Вопрос не решён: президент и может, и не может баллотироваться, и у каждого политика в Киеве есть своя теория на этот счёт. Неопределённость устраивает Администрацию ровно до тех пор, пока о ней не начнёт спрашивать оппозиция."
 ukraine_ccourt.5.a: "Пусть неопределённость работает на нас."
 ukraine_ccourt.5.b: "Попросить Раду решить этот вопрос."
 ukraine_ccourt.6.name: "Ответ президента"
 ukraine_ccourt.6.desc: "Суд открыл дверь, и вопрос, который все задавали шёпотом, теперь звучит вслух: будет ли он баллотироваться? Президент уже год говорит посетителям, что не пойдёт в эту дверь, и уже год все говорят, что именно так и сказал бы человек, который собирается в неё пойти. Каждый лагерь в Киеве ждёт ответа, прежде чем выбрать кандидата."
 ukraine_ccourt.6.a: "Я не буду баллотироваться."
 ukraine_ccourt.6.b: "Пусть гадают."
 ukraine_ccourt.6.c: "Зарегистрироваться кандидатом."
 ukraine_rada.16.name: "Большинство девяти фракций"
 ukraine_rada.16.desc: "Девять фракций и групп — «Трудовая Украина» вместе с промышленниками, «Регионы Украины», СДПУ(о), «Европейский выбор», «Демократические инициативы», народные демократы и остальные — подписали декларацию и назвали себя парламентским большинством. Двухсот тридцати с лишним подписей хватает, чтобы принять бюджет, но совершенно недостаточно, чтобы что-либо изменить в конституции. Кабинет исполняет обязанности, и подписавшие декларацию рассчитывают, что их спросят, кто возглавит следующий."
 ukraine_rada.16.a: "Пусть большинство назовёт правительство."
 ukraine_rada.16.b: "Кабинет назначает президент."
 ukr_history.11.desc_premier: "Во вторую годовщину исчезновения Гонгадзе оппозиция снова вывела сторонников на улицы — Тимошенко, Мороз и Симоненко на одной трибуне и пустое место там, где стоял бы четвёртый. Ющенко по-прежнему премьер-министр, и его блок держится в стороне от площади. Организаторы говорят, что он выбрал свой кабинет; его люди говорят, что площадь — единственное место, где глава правительства стоять не может. На Крещатике снова ставят палатки."
 ukr_history.5.desc_late: "Кабинет пал. Арифметика осталась той же, что и с момента формирования большинства: коммунисты голосовали против рыночных реформ, бизнес-группы — против человека, покончившего с бартерными схемами в энергетике, и вместе у них набралось больше необходимых двухсот двадцати шести голосов. Самый популярный премьер-министр в истории страны уходит в отставку с незапятнанной репутацией, и больше нет должности, на которой он мог бы её потерять."
 ukraine_ccourt.7.name: "Два кандидата от власти"
 ukraine_ccourt.7.desc: "Зарегистрировался президент, а вместе с ним и премьер-министр, которого он два года готовил в преемники. Административный ресурс не может работать на обоих: губернатор может обеспечить свою область одному кандидату, а не двум, и каждый губернатор в стране теперь ждёт, когда ему скажут, кому именно. Донецкие люди, оплатившие кампанию премьера, пока вежливо спросили, за что именно они платили."
 ukraine_ccourt.7.a: "Премьер-министр снимается. Кандидат от власти будет один."
 ukraine_ccourt.7.b: "Сняться самому и дать баллотироваться человеку, которого мы сделали."
 ukraine_ccourt.8.name: "Год умолчаний заканчивается"
 ukraine_ccourt.8.desc: "Целый год президент отвечал на вопрос о третьем сроке пожатием плеч, и целый год это пожатие плеч удерживало на месте всех остальных кандидатов пропрезидентского лагеря. Регистрация скоро закончится. После этого ответ станет фактом, а не предметом толкований, и те, кто ждал, чтобы узнать, чью кампанию они финансируют, узнают об этом так же, как все остальные."
 ukraine_ccourt.8.a: "Сказать прямо: он не кандидат."
 ukraine_ccourt.8.b: "Зарегистрироваться. Четырёх месяцев достаточно."
 ukraine_ccourt.9.name: "Преемственность без преемника"
 ukraine_ccourt.9.desc: "Президента нет в бюллетене, а значит, впервые с обретения независимости машине придётся нести кого-то другого. У премьер-министра есть губернаторы, налоговая администрация и государственные каналы, но нет того единственного, что нельзя делегировать. Будет ли аппарат работать на преемника так же усердно, как на себя, вот-вот проверят на глазах у всех."
 ukraine_ccourt.9.a: "Всё — на поддержку премьер-министра."
 ukraine_ccourt.9.b: "Пусть кланы сами его вытягивают."
