 POTEF106_desc: "Europa jest zielona, ​​ale Afryka wciąż jest ciemna i szara. Europa musi rozpowszechnić swoją politykę i technologie na całym świecie oraz walczyć z imperiami energii kopalnej, które niszczą planetę."
 POTEF107: "Bliski Wschód"
 POTEF107_desc: "Europa jest zielona, ​​ale Bliski Wschód jest nadal ciemny i szary. Europa musi rozpowszechnić swoją politykę i technologie na całym świecie oraz walczyć z imperiami energii kopalnej, które niszczą planetę."
