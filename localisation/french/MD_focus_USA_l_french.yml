 USA_focus_the_pentagon_wars: "Les guerres du Pentagone"
 USA_focus_the_pentagon_wars_desc: "Vers la fin de la guerre froide et au début du nouveau millénaire, une lutte interne a commencé à émerger dans les hautes sphères du Pentagone et de l'appareil militaire américain dans son ensemble. Les anciens estimaient que les coûts des nouvelles machines et armes de guerre ne seraient que des gadgets que l'ennemi pourrait utiliser pour nous ruiner. De l'autre côté, il y avait les jeunes ambitieux et les innovateurs, qui croyaient que le radar moderne et d'autres innovations dans les armements militaires définiraient et façonneraient le champ de bataille moderne. Cette lutte interne a été médiatisée par les médias et Hollywood, mais seuls ceux ayant une habilitation connaissent le véritable résultat."
 USA_focus_united_states_army: "Armée des États-Unis"
 USA_focus_united_states_army_desc: "Fondée sous le nom d'Armée continentale pendant la guerre d'indépendance américaine, l'Armée des États-Unis est l'un des trois piliers principaux des forces armées de ces États-Unis. Tout au long de son histoire, l'armée a connu d'innombrables vagues d'innovation ainsi que sa part de corruption. Mais à l'ère moderne, la branche fait face à un nouveau défi. Avec l'apogée des innovations technologiques, la fracture entre technologie et tactique devient de plus en plus destructrice. Argent perdu, projets de R&D dépassant les budgets de manière inédite depuis des décennies, ainsi que le sabotage interne par des officiers et généraux, signifient qu'il y a beaucoup à faire. La question est : par où commencer ?"
 USA_focus_five_star_folly: "La folie des cinq étoiles"
 USA_focus_five_star_folly_desc: "Le champ de bataille moderne est affaire de volonté et de détermination, non de gadgets. Nous devons donc affiner et réoutiller nos efforts d'entraînement, notre structure et l'adaptabilité de nos forces avec l'équipement que nous avons déjà. La R&D sera taillée et reléguée aux améliorations de qualité de vie, aux améliorations des armes légères, ainsi qu'à la maîtrise logistique."
 USA_focus_infantry_doctrine_debate: "Débat sur la doctrine de l'infanterie"
 USA_focus_infantry_doctrine_debate_desc: "Afin d'être efficaces et de réduire les coûts, nous devons examiner le cœur de ce qui fait fonctionner notre armée. Ce pilier central est celui du soldat ordinaire, l'infanterie. Actuellement, il existe trois doctrines principales qui ont persisté et qui ont dépassé la conclusion de la guerre froide. La doctrine de l'infanterie légère, la doctrine de l'infanterie mobile et la doctrine de l'infanterie blindée. Ces trois-là ont leurs avantages et leurs inconvénients, mais la question est de savoir laquelle convient le mieux à notre nation en termes d'économie et de flexibilité."
 USA_focus_light_infantry_dominance: "Dominance de l'infanterie légère"
 USA_focus_light_infantry_dominance_desc: "Le fantassin est le plus facile à mouler et à adapter à n'importe quelle situation. Avec cette clé, nous allons tourner la serrure et ouvrir la porte à l'efficacité, permettant à nos soldats de pouvoir gérer les menaces, tant sur terre que dans les airs."
 USA_focus_mobile_infantry_machine: "Machine d'infanterie mobile"
 USA_focus_mobile_infantry_machine_desc: "Grâce à la flexibilité du fantassin, combinée à la mobilité des transports motorisés et des véhicules de type reconnaissance, nous nous efforçons de créer la force de frappe ultime qui est le cœur de notre armée."
 USA_focus_armored_infantry_ascendance: "Ascendance de l'infanterie blindée"
 USA_focus_armored_infantry_ascendance_desc: "Les chars modernes sont chers et très coûteux pour la « récompense » potentielle qu'ils donnent. Nous devons donc adapter notre infanterie pour remplacer et suppléer ces gouffres d'argent et créer une nouvelle voie. La doctrine de l'infanterie blindée assurera la polyvalence du combat blindé, avec le déploiement plus efficace et flexible des fantassins pour détourner l'attention et confondre les éléments de force blindés et légers de l'ennemi."
 USA_focus_tank_force_dilemma: "Dilemme des forces blindées"
 USA_focus_tank_force_dilemma_desc: "Le champ de bataille moderne a presque rendu l'utilisation originale du char obsolète. Nous devons sérieusement réfléchir à l'usage que nous voulons faire de ces énormes machines métalliques si nous voulons réellement avoir une armée équilibrée."
 USA_focus_repurposing_armored_programs: "Réorientation des programmes blindés"
 USA_focus_repurposing_armored_programs_desc: "La directive RAP est une réorganisation immédiate de l'armée. Les forces de chars seront presque arrêtées et réservées à des tâches très spécifiques si nécessaire. Cependant, la directive principale sera de rediriger la recherche et les matériaux vers les VCI, les VTT et autres programmes pour renforcer et améliorer tous les autres aspects du combat."
 USA_focus_modern_tanks_modern_solutions: "Des chars modernes, des solutions modernes"
 USA_focus_modern_tanks_modern_solutions_desc: "Le char est une merveille moderne et ne devrait pas être simplement mis au rebut comme un gadget d'une époque révolue. En affinant les méthodes de production et en réoutillant les organisations d'unités, nous pouvons faire de notre force de chars le grand frère et le compagnon de voyage de notre force d'infanterie principale."
 USA_focus_logistical_dominance: "Dominance logistique"
 USA_focus_logistical_dominance_desc: "L'armée ne fonctionne que lorsqu'elle dispose réellement de l'équipement essentiel pour maintenir une force efficace au combat. Nous devons donc donner l'exemple en encourageant et en développant l'appareil logistique pour assurer la conduite rapide et efficace de notre réseau d'approvisionnement et de logistique."
 USA_focus_fire_support_supremacy: "Suprématie du soutien de feu"
 USA_focus_fire_support_supremacy_desc: "L'artillerie, reine du champ de bataille. La mobilité est polyvalente selon les besoins de conception, le nettoyage de zone est efficace de multiples façons et, en prime, peut être relativement moins cher que d'appeler un avion. Nous investirons donc et ferons en sorte que notre artillerie soit marquée comme le nouveau gagne-pain de la guerre, comme elle l'était il y a des décennies et même des siècles."
 USA_focus_gold_star_program: "Programme étoile d'or"
 USA_focus_gold_star_program_desc: "Le champ de bataille moderne est défini par l'avantage technologique de nos ennemis. Bien que la course aux armements qu'était la guerre froide soit terminée, nos ennemis continuent de grandir de jour en jour, car « l'ère de la paix » continue de bouillonner et de se transformer en un ragoût brûlant de mécontentement, de révolutions et de troubles sociaux. Nous devons investir massivement dans les programmes de R&D, affiner nos intégrations technologiques et nous assurer que nous ne sommes pas seulement forts en tant qu'armée, mais une armée d'un seul homme."
 USA_focus_armored_combat_debate: "Débat sur le combat blindé"
 USA_focus_armored_combat_debate_desc: "La reine moderne du champ de bataille est celle du véhicule de combat blindé. Qu'il s'agisse de chars, de VFI ou de VTT, ces machines de guerre peuvent définir une seule bataille et potentiellement même une campagne entière. Cependant, à mesure que des innovations sont faites dans le combat blindé, nous sommes arrivés à une bifurcation. Devons-nous nous concentrer davantage sur les développements basés sur les chars ou devons-nous réserver davantage pour les véhicules de soutien d'infanterie plus légers comme les VFI et les VTT ?"
 USA_focus_light_vehicle_innovations: "Innovations en matière de véhicules légers"
 USA_focus_light_vehicle_innovations_desc: "Si les chars sont bons pour être des bunkers mobiles, les investissements et les innovations dans les capacités antichars modernes font du combat direct des chars un investissement plus risqué, tant en matériel qu'en personnel. Par conséquent, nous pouvons réorienter le financement davantage vers les VTT et les VFI afin d'assurer une approche d'infanterie et de blindés flexible. De plus, les VTT et les VFI sont beaucoup plus faciles à rendre modulaires que les chars."
 USA_focus_modern_battle_tank_innovations: "Innovations en matière de chars de combat modernes"
 USA_focus_modern_battle_tank_innovations_desc: "Le char de combat moderne ou MBT est une innovation de la guerre froide qui a créé la norme moderne de la doctrine des chars. Nous devons l'utiliser et nous assurer de créer une force blindée puissante pour percer et nous blinder contre toute attaque ennemie. En tant que sous-produit de ces innovations, les unités comme les SPAA et les SPG sont susceptibles de voir des innovations passives alors que nous réoutillons les organisations d'unités pour englober des sous-unités plus équitables."
 USA_focus_mass_motorization_efforts: "Efforts de motorisation de masse"
 USA_focus_mass_motorization_efforts_desc: "Pour assurer notre mobilité à n'importe quel niveau que nous avons choisi, nous devons obliger nos partenaires de fabrication à standardiser et à augmenter la production de motorisation afin de permettre à notre infanterie de suivre le rythme de nos éléments mécanisés et blindés."
 USA_focus_the_artillery_conundrum: "L'énigme de l'artillerie"
 USA_focus_the_artillery_conundrum_desc: "À une époque moderne de drones, d'avions furtifs et d'équipements à longue portée, c'est une question de principe de déterminer quel rôle nous devons adopter pour l'une des unités de terrain les plus vulnérables de l'armée, à savoir l'artillerie et ses équipages. Nous devons décider dans quelle direction nous orienter et si nous devons nous concentrer davantage sur la défense ou sur une éventuelle offensive pour empêcher l'ennemi de frapper facilement ces cibles évidentes."
 USA_focus_defensive_artillery_program: "Programme d'artillerie défensive"
 USA_focus_defensive_artillery_program_desc: "L'initiative DAP est un programme conçu pour la recherche et l'innovation en vue de meilleures mesures défensives, tant dans la conception de l'équipement que dans sa capacité à être défendu sur le terrain dans son ensemble. La maniabilité localisée et la capacité d'atteindre les lignes de front à partir de distances accrues assureront également la survivabilité globale de notre équipement et de nos équipages."
 USA_focus_offensive_artillery_program: "Programme d'artillerie offensive"
 USA_focus_offensive_artillery_program_desc: "L'OAP est de fixer une nouvelle norme de guerre de manœuvre pour l'ensemble de la force. Grâce à des innovations et à des recherches liées aux blindés et aux systèmes d'artillerie automotrice, nous donnons le rythme à l'ensemble de notre armée, car l'artillerie est considérée comme l'unité la plus lente de la branche."
 USA_focus_supplies_supples_supplies: "Ravitaillements, ravitaillements, ravitaillements"
 USA_focus_supplies_supples_supplies_desc: "Le corps des intendants se prépare à devenir l'épine dorsale de la fonctionnalité de l'armée. Plus d'avancées et de systèmes d'armes complexes signifie plus de choses à transporter et à remplacer sur le terrain. Nous devons donc établir un réseau de ravitaillement fluide et manoeuvrable pour garantir que la destruction par l'ennemi des centres de ravitaillement 'critiques' ne nous limite pas."
 USA_focus_army_special_forces_question: "Question des forces spéciales de l'armée de terre"
 USA_focus_army_special_forces_question_desc: "Les forces spéciales de la branche armée de terre deviennent plus nombreuses tant en dénominations qu'en capacités qui se chevauchent. Nous devons sérieusement considérer le rôle que nous voulons pour les forces spéciales de notre armée si nous voulons non seulement être plus distincts des autres branches, mais aussi assez distincts au sein de notre propre branche de service."
 USA_focus_specialized_frontline_defense_support: "Soutien spécialisé à la défense en première ligne"
 USA_focus_specialized_frontline_defense_support_desc: "Le SFDP est une nouvelle réorganisation des unités des forces spéciales de l'armée en une force générale ou sous-branche de l'armée pour aider et soutenir les positions défensives de toutes les manières possibles. En cas d'encerclement potentiel, le SFDP fournirait des ravitaillements limités pour aider les troupes bloquées, effectuerait des contre-feux et des manœuvres sur les attaques ennemies contre les positions ou les unités de reconnaissance ennemies, etc. Avec cela, l'armée pourra se réunir en un rempart contre les ennemis de la liberté et de la démocratie elle-même."
 USA_focus_the_dagger_within_the_cloak: "Le poignard dans la cape"
 USA_focus_the_dagger_within_the_cloak_desc: "Nos Special Forces Groups, ou SFG, doivent être les meilleurs des meilleurs. Pour assurer cet objectif ambitieux, nous aurons besoin d'investissements substantiels en argent et en équipement afin d'entraîner, d'affiner et de faire croître cette force en une force de frappe de la plus haute efficacité."
 USA_focus_the_information_game: "Le jeu de l'information"
 USA_focus_the_information_game_desc: "Savoir ce que vous faites ainsi que ce que fait l'ennemi est un instrument clé pour créer la muse de la victoire. Nous devons investir dans de meilleures méthodes de reconnaissance et d'acquisition d'informations sur les forces ennemies si nous voulons éviter des pertes inutiles."
 USA_focus_this_is_the_army_mr_jones: "Voici l'armée, M. Jones"
 USA_focus_this_is_the_army_mr_jones_desc: "Nous sommes une armée nouvelle, avec un nouvel esprit, de nouveaux soldats et un nouveau départ pour défendre ce qui est juste. Pour la liberté, la démocratie et la poursuite du bonheur pour tous."
 USA_focus_united_states_navy: "Marine des États-Unis"
 USA_focus_united_states_navy_desc: "Fondée en 1776, dissoute après la révolution puis refondée en réaction d'urgence aux pirates barbaresques au début des années 1800, la Marine des États-Unis a une histoire stoïque et en constante évolution. En tête des innovations navales depuis qu'elle a surpassé l'Empire britannique autour des guerres mondiales, la marine américaine cherche à déterminer ce dont elle a besoin dans le nouveau millénaire. Avec la plupart des combats centrés sur la terre ou l'air, beaucoup dans le public se demandent combien d'argent la marine a réellement besoin. En conséquence, les dirigeants navals doivent réorienter leur réflexion et leurs équipes de relations publiques pour justifier toute nouvelle décision, car si la marine doit être plus qu'une simple flotte de défense marchande, elle doit trouver sa nouvelle voix dans cette nouvelle ère."
 USA_focus_project_steel_waves: "Projet Vagues d'Acier"
 USA_focus_project_steel_waves_desc: "Nous sommes la superpuissance mondiale, ni un badge d'honneur, ni une marque d'infamie, simplement un statut d'ordre et de position. À cet effet, nous devons adapter notre portée navale à ce statut. La plupart des puissances mondiales combinées ne peuvent rivaliser avec notre technologie vieille de près de 40 ans, et nous concentrerons donc la R&D sur la rationalisation de la production, des réparations et des modifications des navires existants. Une flotte modulaire et adaptable, plutôt qu'une flotte rétrécissante de pure technologie et puissance."
 USA_focus_naval_group_flexibility_program: "Programme de flexibilité des groupes navals"
 USA_focus_naval_group_flexibility_program_desc: "Le NGFP est un programme de production désigné qui nous permettra de rationaliser et de mieux adapter nos efforts de production et de réparation navales pour une efficacité maximale."
 USA_focus_small_ship_debate: "Débat sur les petits navires"
 USA_focus_small_ship_debate_desc: "L'âge moderne a recréé la dynamique des petits navires, frégates et corvettes, comme la crème de la crème. Eh bien, si nous voulons créer une force de pointe rationalisée, nous devons déterminer lequel de ces deux types sera le cœur qui soutient nos sous-marins et nos destroyers."
 USA_focus_frigate_fighters: "Combattants de frégates"
 USA_focus_frigate_fighters_desc: "Les frégates, la classe de navires la plus polyvalente et la plus changeante de l'histoire navale elle-même. Ce navire, bien que plus petit qu'un destroyer, peut avoir la puissance de feu d'un croiseur s'il est modifié correctement. En tant que tel, nous transformerons nos frégates en de véritables combattants et en l'épine dorsale principale de notre marine."
 USA_focus_corvette_combat_flexibility: "Flexibilité de combat des corvettes"
 USA_focus_corvette_combat_flexibility_desc: "La corvette est le plus petit navire raisonnablement efficace au combat dans la flotte moderne. En tant que tel, nous allons investir, adapter, améliorer et créer une flotte de corvettes qui submergera et détruira les ennemis de la liberté et des mers libres."
 USA_focus_naval_maneuver_warfare: "Guerre de manœuvre navale"
 USA_focus_naval_maneuver_warfare_desc: "Les investissements dans les efforts de R&D en matière de propulsion permettront à nos petits navires d'être encore plus agiles en haute mer. Cette maniabilité toujours croissante est quelque chose pour laquelle la plupart des capitaines de navires ne sont pas équipés ou formés et en tant que tel, ils auront besoin de formation et de temps pour s'habituer à ces nouvelles façons de se battre."
 USA_focus_increasing_contractor_incentives: "Augmenter les incitations pour les entrepreneurs"
 USA_focus_increasing_contractor_incentives_desc: "En créant de meilleures lignes directrices, des forfaits d'incitation et un financement, nos entrepreneurs navals civils et militaires seront mieux motivés pour fournir de meilleurs résultats dans l'ensemble que ceux obtenus précédemment."
 USA_focus_project_new_waves: "Projet Nouvelles Vagues"
 USA_focus_project_new_waves_desc: "Le projet Nouvelles Vagues est une initiative de R&D dédiée à renouveler, renforcer et moderniser, tout en anticipant l'avenir autant que possible. Notre marine est la plus grande au monde en tonnage, alors faisons en sorte que chaque tonne compte."
 USA_focus_the_submarine_debate: "Le débat sur les sous-marins"
 USA_focus_the_submarine_debate_desc: "Les sous-marins sont l'avenir de la furtivité et des mesures défensives navales. Cependant, nous devons sérieusement déterminer si nous investirons dans les variantes d'attaque ou de missiles de notre flotte sous-marine."
 USA_focus_the_attack_fleet: "La flotte d'attaque"
 USA_focus_the_attack_fleet_desc: "Grâce à des investissements dans nos sous-marins d'attaque, à la fois existants et en développement, nous pouvons assurer que notre puissance navale est à son apogée pour cibler et détruire rapidement les navires ennemis."
 USA_focus_the_missile_fleet: "La flotte de missiles"
 USA_focus_the_missile_fleet_desc: "Grâce à des investissements massifs dans des missiles modulaires pour nos sous-marins, nous serons capables de cibler et de détruire tout obstacle en mer, qu'il soit d'origine humaine ou naturelle si nécessaire."
 USA_focus_mobile_airports_program: "Programme d'aéroports mobiles"
 USA_focus_mobile_airports_program_desc: "Par la R&D visant à rendre des aéronefs plus agiles ainsi que des systèmes d'aide au lancement et à l'atterrissage, nous pouvons chercher à faire de nos porte-avions des aéroports mobiles. Cela apportera à son tour le plus de puissance de feu à une zone de combat naval sans investissements étendus dans des navires de cœur comme destroyers, croiseurs et ainsi de suite."
 USA_focus_project_gunships: "Projet d'hélicoptères d'attaque"
 USA_focus_project_gunships_desc: "Des investissements significatifs et des recherches pour développer de meilleurs hélicoptères permettront de faire de ces derniers la nouvelle machine de combat universelle. Bien que l'amélioration des hélicoptères aide indirectement au combat terrestre, l'objectif principal est de les rendre agiles et rapides dans nos flottes de porte-avions. La force de frappe navale moderne est là, et nous sommes prêts à la concrétiser."
 USA_focus_strengthing_naval_training_efforts: "Renforcement des efforts de formation navale"
 USA_focus_role_of_the_usmc: "Rôle du Corps des Marines"
 USA_focus_role_of_the_usmc_desc: "Le Corps des Marines des États-Unis a une histoire sanglante. Cependant, le rôle des Marines est une fois de plus remis en question. À l'ère moderne des campagnes isolées et sans 'grande guerre' avec un ennemi facilement identifiable, l'identité du Marine moderne est un peu différente. Nous devons déterminer si nous devons maintenir un Corps des Marines spécialisé ou instaurer une généralisation de la branche et la rapprocher de l'armée, plutôt que de rester un sous-département strictement sous la marine."
 USA_focus_marines_are_as_marines_were: "Les Marines sont comme ils étaient"
 USA_focus_marines_are_as_marines_were_desc: "Lancer des invasions navales et être la lance pour percer une défense côtière ennemie. C'est le Corps des Marines et c'est ce qu'il sera. Les Marines montrent la voie !"
 USA_focus_marine_lessons_in_army_clothes: "Leçons des Marines en tenue de l'armée de terre"
 USA_focus_marine_lessons_in_army_clothes_desc: "Le champ de bataille moderne a de moins en moins besoin d'une force d'invasion navale forte et dédiée. En tant que tel, nous pouvons travailler à intégrer et à mieux réformer nos forces terrestres pour qu'elles soient plus adaptables aux caractéristiques du terrain, qu'elles soient aquatiques ou non."
 USA_focus_repair_teams: "Équipes de réparation"
 USA_focus_repair_teams_desc: "Équiper des équipes spécialisées de Marines pour aider aux réparations et au contrôle des dommages permettra à nos navires de reprendre la mer plus rapidement que jamais. Seuls les problèmes graves nécessiteront un passage en cale sèche."
 USA_focus_a_modern_navy: "Une marine moderne"
 USA_focus_a_modern_navy_desc: "Contre vents et marées, nous l'avons fait, nous avons créé une marine pour rivaliser avec même nos plus forts ennemis. Maintenant, nous serons en mesure de nous défendre et de défendre nos alliés sans faillir."
 USA_focus_united_states_air_force: "Force aérienne des États-Unis"
 USA_focus_united_states_air_force_desc: "Bien qu'elle soit l'une des branches des forces armées les plus jeunes, l'USAF a une histoire intéressante. Initialement un département de l'armée sous le nom d'USAAF ou United States Army Air Force, les exigences de la Seconde Guerre mondiale ont conduit à la création d'une branche autonome. Depuis cette guerre, la force aérienne est devenue l'enfant chéri de la suprématie sur le champ de bataille à l'ère moderne. Mais à mesure que la guerre évolue, les besoins de la force aérienne changent également, et maintenant, à l'aube d'une nouvelle ère, les dirigeants de la branche doivent déterminer comment s'adapter à la situation en constante évolution du 'champ de bataille moderne'."
 USA_focus_economy_class_warfare: "Guerre économique des classes"
 USA_focus_economy_class_warfare_desc: "Vous ne pouvez pas faire la guerre le ventre vide et vous ne pouvez certainement pas la faire sans une économie qui fonctionne. Nous devons donc trouver des moyens de réoutiller notre budget de l'armée de l'air pour qu'il soit efficace dans les méthodes et les modèles de production que nous pourrions à notre tour remettre dans l'économie elle-même."
 USA_focus_the_modular_design_program: "Le programme de conception modulaire"
 USA_focus_the_modular_design_program_desc: "Le MDP est une rationalisation de toute la production d'aéronefs. Au lieu de créer plusieurs lignes de production d'avions hyperspécifiques, nous pouvons assurer une production plus efficace en créant un modèle d'avion standard qui peut être adapté de manière modulaire aux besoins de la nation."
 USA_focus_production_development_investments: "Investissements dans le développement de la production"
 USA_focus_production_development_investments_desc: "Grâce à des initiatives de R&D et des investissements généraux dans la fabrication, nous pouvons accroître nos capacités de production tout en générant des résultats pour le secteur civil. Cela contribuera certainement à créer des emplois et à affiner les capacités de nos aéronefs."
 USA_focus_fighter_focused_budgeting: "Budgétisation axée sur les chasseurs"
 USA_focus_fighter_focused_budgeting_desc: "Matériaux plus légers, améliorations de l'entraînement à l'agilité et meilleurs systèmes d'armes. Ce ne sont là que quelques-uns des éléments dans lesquels nous avons l'intention d'investir pour permettre à notre armée de l'air d'être certainement une force avec laquelle il faut compter."
 USA_focus_bomber_focused_budgeting: "Budgétisation axée sur les bombardiers"
 USA_focus_bomber_focused_budgeting_desc: "Capacités de dégâts de charge utile accrues, conceptions de systèmes d'avions améliorées, etc. Ces éléments et d'autres feront l'objet d'investissements pour garantir que notre armée de l'air aplatisse tous les obstacles que nos forces terrestres rencontrent."
 USA_focus_civil_military_innovations_program: "Programme d'innovations civiles et militaires"
 USA_focus_civil_military_innovations_program_desc: "Une installation de développement et de recherche conjointe, le C&MIP est conçu pour combiner les innovations militaires et civiles et comprendre comment l'une peut inspirer l'autre et vice versa. Avec cela, notre économie sera construite pour le peuple ainsi que pour sa défense."
 USA_focus_a_limitless_sky: "Un ciel sans limites"
 USA_focus_a_limitless_sky_desc: "On dit que le ciel est la limite, eh bien l'armée de l'air des États-Unis en fera l'objectif même de la branche pour dépasser et prouver qu'il n'y a pas de telle limite."
 USA_focus_perpetual_air_dominance: "Domination aérienne perpétuelle"
 USA_focus_perpetual_air_dominance_desc: "Par des investissements quasi constants dans les systèmes d'armes et les régimes d'entraînement des équipages, nous pouvons créer un état de domination perpétuelle par la seule agressivité."
 USA_focus_american_institute_for_avionics: "Institut américain d'avionique"
 USA_focus_american_institute_for_avionics_desc: "L'AIA est un centre de recherche axé sur le développement et l'amélioration des capacités de notre armée de l'air. Nous espérons à l'avenir créer de grandes choses à venir."
 USA_focus_phase_one_innovations: "Innovations de phase un"
 USA_focus_phase_one_innovations_desc: "Les innovations de phase un font référence aux avancées générales dans l'entraînement des équipages ainsi qu'à des méthodes plus efficaces pour manipuler ou fabriquer des aéronefs."
 USA_focus_phase_two_innovations: "Innovations de phase deux"
 USA_focus_phase_two_innovations_desc: "Des investissements et des initiatives de recherche continus ont commencé à porter leurs fruits en matière d'appui terrestre et d'appui direct au champ de bataille. Nous espérons que ces innovations amélioreront davantage nos assauts combinés sur les positions ennemies."
 USA_focus_phase_three_innovations: "Innovations de phase trois"
 USA_focus_phase_three_innovations_desc: "Les investissements agressifs continuent de faire progresser nos innovations, avec des percées dans les grands bombardiers et la puissance destructrice des charges utiles."
 USA_focus_paratrooper_corps: "Le Corps des parachutistes"
 USA_focus_paratrooper_corps_desc: "Les parachutistes ont été une branche unique de l'armée de terre et de l'armée de l'air. Nés d'un besoin expérimental découlant des exigences de la Seconde Guerre mondiale, les parachutistes sont considérés comme une partie essentielle de la formation moderne. Des sauts traditionnels des C-130 aux descentes en rappel des hélicoptères d'attaque, l'esprit parachutiste est toujours fort sur le champ de bataille d'aujourd'hui. Maintenant, nous devons trouver les besoins réels de nos forces militaires pour assurer une cohésion et une efficacité maximales."
 USA_focus_jump_wings_forever: "Ailes de saut pour toujours"
 USA_focus_jump_wings_forever_desc: "Nos parachutistes sont les meilleurs des meilleurs, nous améliorerons et nous nous occuperons de cette force pour nous assurer qu'ils le restent dans un avenir prévisible."
 USA_focus_every_soldier_a_trooper: "Chaque soldat est un soldat"
 USA_focus_every_soldier_a_trooper_desc: "La mobilité des hélicoptères ainsi que le rythme de plus en plus rapide des champs de bataille signifient que le rôle d'un parachutiste doit être élargi et pas seulement réservé. En tant que tel, nous ferons tout ce que nous pouvons pour affiner et améliorer notre armée avec les leçons apprises par les parachutistes au fil des ans."
 USA_focus_joint_branch_coordination_training: "Formation à la coordination inter-branches"
 USA_focus_joint_branch_coordination_training_desc: "Le programme JBCT est un programme de formation à la cohésion et à la coordination pour augmenter les efforts de formation et de coopération entre les branches de service de l'armée de l'air et de l'armée de terre en raison de la nature innée du champ de bataille moderne. Cela aidera également à réduire les incidents « bleu sur bleu » entre les branches lorsque cela est possible."
 USA_focus_to_infinite_and_beyond: "Vers l'infini et au-delà !"
 USA_focus_to_infinite_and_beyond_desc: "Nos innovations et notre dévouement à garantir que notre force aérienne reste inégalée ont porté leurs fruits. Nous pouvons dire sans aucun doute que nos efforts pour améliorer notre force aérienne seront discutés dans le monde entier pendant des années."
 USA_focus_united_states_general_staff: "État-major interarmées des États-Unis"
 USA_focus_united_states_general_staff_desc: "Le JCS ainsi que le corps des officiers généraux des États-Unis est au mieux un tempérament, au pire une lutte de pouvoir doux selon l'époque. Cependant, le GOC a vu ces dernières années quelques enjeux intéressants. Des luttes internes sur la corruption et des dépenses trop zélées malgré la fin de la guerre froide, ainsi que la vieille question des « innovateurs contre vieux gardes ». Dans le nouveau millénaire, cependant, la question du recyclage et de l'affinage du corps des officiers dans son ensemble est ouverte au débat, et des idées circulent. Nous devons donc déterminer quels seront nos besoins."
 USA_focus_army_centric_training: "Formation axée sur l'armée de terre"
 USA_focus_army_centric_training_desc: "En poursuivant davantage les programmes de recyclage et d'avancement autour de l'armée de terre, notre priorité dans les développements de commandement et de contrôle verra nos forces terrestres exceller dans les temps à venir."
 USA_focus_army_knowledge_priority: "Priorité à la connaissance de l'armée de terre"
 USA_focus_army_knowledge_priority_desc: "L'avancement dans les rangs du corps des officiers exigera désormais plus de connaissances et de besoins basés sur l'armée de terre que sur l'armée de l'air ou la marine. Cela garantira que plus d'éléments de C&C iront vers l'amélioration de nos forces terrestres où se déroule l'essentiel des combats."
 USA_focus_naval_centric_training: "Formation axée sur la marine"
 USA_focus_naval_centric_training_desc: "En favorisant les programmes de recyclage et d'avancement axés sur la marine, notre priorité en matière de commandement et de contrôle ira au profit de la manœuvre et de la survivabilité navales. Ce qui signifie que plus de navires auront des commandants flexibles et adaptables."
 USA_focus_naval_knowledge_priority: "Priorité à la connaissance navale"
 USA_focus_naval_knowledge_priority_desc: "Les avancements au sein du corps des officiers auront désormais besoin de plus de connaissances basées sur la marine pour développer de meilleurs éléments de C&C au sein de notre branche navale. La plupart de nos combats stratégiques impliquent la marine d'une manière ou d'une autre, en tant que tel, pour s'assurer que cette épine dorsale est forte et durable, ses dirigeants doivent être faits d'un stock similaire."
 USA_focus_air_force_centric_training: "Formation axée sur l'armée de l'air"
 USA_focus_air_force_centric_training_desc: "En poursuivant davantage les programmes de recyclage et d'avancement autour de l'armée de l'air, notre priorité dans les développements de commandement et de contrôle verra nos forces aériennes exceller dans les temps à venir."
 USA_focus_air_force_priority_knowledge: "Connaissances prioritaires de l'armée de l'air"
 USA_focus_air_force_priority_knowledge_desc: "Les avancements au sein du corps des officiers auront désormais besoin de plus de connaissances basées sur l'air et/ou l'aviation pour développer de meilleurs éléments de C&C au sein de notre armée de l'air. Le champ de bataille moderne est presque défini par la guerre aérienne, nous devons donc nous assurer que notre armée de l'air est incontestable par tout ennemi connu."
 USA_focus_a_true_pax_americana: "Une véritable Pax Americana"
 USA_focus_a_true_pax_americana_desc: "Réformes, changements, pourvoir aux besoins de chaque dernière branche de service sous notre autorité. Notre nation sera sécurisée et le monde saura ce qu'est une véritable paix américaine. Ad pacem et felicitatem. « À la paix et à la prospérité »."
 USA_focus_reintroducing_mandatory_service: "Réintroduction du service obligatoire"
 USA_focus_reintroducing_mandatory_service_desc: "Grâce à un lobbying auprès du Congrès, nous espérons réintroduire une période de service obligatoire. Cela permettra de maintenir nos effectifs et de réduire la pression sur notre force purement volontaire. Compte tenu des probables réactions politiques, la période recommandée aux législateurs est de seulement 6 mois."
 USA_focus_expanding_mandatory_service: "Élargir le service obligatoire"
 USA_focus_expanding_mandatory_service_desc: "Les besoins des forces armées et de la défense nationale sont devenus un sujet de préoccupation. Si nous voulons rester au fait des choses, nous devons faire pression sur le Congrès pour qu'il approuve une telle mesure. Le contrecoup public sera considérable, mais en fin de compte, notre défense nationale en ces temps d'incertitude toujours difficiles est une justification."
 USA_focus_concerning_developments: "Développement préoccupant"
 USA_focus_concerning_developments_desc: "Les choses ne vont pas bien et cela atteint un point qui ne semble pas réversible. Nous devons donc augmenter les exigences de conscription pour forcer les effectifs dont nous avons besoin. Cela fera mal, mais nous ne pouvons pas risquer le moindre débat."
 USA_focus_desperate_measures: "Mesures désespérées"
 USA_focus_desperate_measures_desc: "Les choses continuent d'empirer, des actions drastiques sont nécessaires si nous voulons arriver à quelque chose. L'équipement ne signifie rien si nous n'avons pas les hommes et les femmes pour l'utiliser."
 USA_focus_congressional_chaos: "Chaos au Congrès"
 USA_focus_congressional_chaos_desc: "Pour la première fois de notre histoire, nous nous sommes retrouvés dans une impasse au sein du collège électoral. Des émeutes à petite échelle ont commencé dans tout le pays alors que l'animosité continue de s'installer quant à la victoire du candidat de chacun. Le Congrès s'efforce donc de trouver une solution à ce problème."
 USA_focus_secretary_to_president: "De Secrétaire à Président"
 USA_focus_secretary_to_president_desc: "Rien de tel qu'un mauvais spectacle tout autour. Avec des choix empilés compte tenu du libellé de la constitution dans un « scénario de fin du monde » comme celui-ci. Des deux côtés, nous avons un cauchemar de relations publiques et une probabilité accrue d'une nouvelle rupture de l'ordre social et de la confiance dans notre système. Nous devons donc invoquer le Presidential Succession Act et faire quelque chose de complètement sans précédent. Sauter la Chambre et le Sénat et inaugurer le secrétaire d'État actuel. Un choix sûr pour nous et une première nationale, car dans l'histoire de cette nation jamais nous n'avons connu quelque chose de si tranchant percer le cœur même et le fondement de notre nation..... Que Dieu nous aide à ce que cela n'arrive plus jamais."
 USA_focus_reassuring_wall_street: "Rassurer Wall Street"
 USA_focus_reassuring_wall_street_desc: "La crise étant derrière nous, la priorité est de travailler avec Wall Street et les spéculateurs pour éviter un retour du marché boursier dans une dépression. Des réunions ciblées et des programmes de secours sélectifs pour Wall Street et Main Street devraient calmer les esprits."
 USA_focus_restarting_aid_programs: "Redémarrage des programmes d'aide"
 USA_focus_restarting_aid_programs_desc: "Il y a longtemps, le gouvernement fédéral a tenté de sauver les agriculteurs de l'industrie laitière en subventionnant et en achetant du lait. Cependant, les agriculteurs ont compris ce que cela impliquait et ont augmenté leurs capacités de production. Le gouvernement a fini par résoudre ce problème, mais en lançant des initiatives discrètes pour encourager la consommation de produits laitiers. Cependant, le surplus était si important qu'un autre programme, connu sous le nom de 'Fromage du gouvernement', a été lancé. Ce programme simple a marqué les générations plus âgées, et la plupart des nouvelles générations ne connaîtront jamais cette époque où l'on pouvait obtenir du fromage bon marché ou gratuit. Mais ce n'est plus le cas. Stocker ces surplus coûte plus cher que de les redistribuer, et c'est pourquoi le programme est relancé. Plus de nourriture sur les tables signifie moins de préoccupations sanitaires dans certaines zones et moins de besoin pour certains programmes d'aide sociale. De plus, nous réduisons les stocks et donc les coûts de stockage pour le gouvernement. Tout le monde y gagne."
 USA_focus_specification_act: "Loi de spécification"
 USA_focus_specification_act_desc: "Les affaires du Congrès s'enlisent de plus en plus, au point que la crise récente a ébranlé la nation jusqu'à ses fondements. D'où l'annonce de la Loi de spécification, un texte qui impose que chaque projet de loi du Congrès ne porte que sur un seul sujet, afin d'éviter les constantes ruptures de l'ordre parlementaire. Cela devrait entraîner une forte réduction de la bureaucratie nationale, le format à sujet unique empêchant les marchandages de lobbyistes de gonfler les législations. La déréglementation encouragée par ce format peut également profiter à l'économie en ouvrant davantage de projets du secteur privé, sans autant de frais généraux à craindre."
 USA_focus_national_armed_services_audit: "Audit national des services armés"
 USA_focus_national_armed_services_audit_desc: "La controverse sur le montant des dépenses militaires et les résultats réels qui en découlent a entraîné une baisse des chiffres de recrutement ainsi qu'une tendance négative de la perception du public à l'égard de l'armée dans son ensemble. En tant que tel, un audit national des services armés sera mené, ce qui, nous l'espérons, bousculera les choses et réduira le besoin global de dépenses militaires. La tendance à l'augmentation des dépenses ne disparaîtra probablement pas, mais si nous pouvons obtenir plus de ce que nous avons déjà, nous pourrons au moins ralentir le taux exponentiel des choses."
 USA_focus_reduce_and_expand_act: "Loi Réduire & Élargir"
 USA_focus_reduce_and_expand_act_desc: "La loi R&E est une législation visant à évaluer et réduire les exigences fédérales en matière de tests SAT, tout en encourageant le financement des écoles et districts qui intègrent des cours élargis. Des matières comme l'économie domestique et les cours de finances aideront grandement à la stabilité des générations futures en leur apprenant à gérer leur argent, à prendre soin d'eux-mêmes et à cuisiner."
 USA_focus_domestic_over_foreign: "Politique intérieure avant politique étrangère"
 USA_focus_domestic_over_foreign_desc: "Dans cette nouvelle ère de paix, nous devrions nous regarder davantage si nous voulons continuer à penser à nous occuper des autres. En tant que tel, nous allons réorienter notre budget axé sur la politique étrangère et le réaffecter à certaines initiatives nationales."
 USA_militarist_economic_militarism: "Militarisme économique"
 USA_militarist_economic_militarism_desc: "Notre nation est forte, elle a les capacités en matières premières et en ressources humaines pour assurer la paix et la stabilité mondiales. Mais pendant trop longtemps, les politiciens ont gaspillé et gâché des ressources précieuses à tous les niveaux. En tant que tel, nous allons commencer à rééquiper notre économie pour être prêts à tout conflit militaire que les ennemis de notre république souhaiteraient déclencher."
 USA_militarist_economic_r_and_d: "R&D économique"
 USA_militarist_economic_r_and_d_desc: "Pour poursuivre nos efforts d'optimisation de notre économie, nous devons établir un effort de R&D économique. En tant que tel, nous le ferons pour assurer la sécurité économique de notre nation."
 USA_militarist_national_wellness_programs: "Programmes de bien-être nationaux"
 USA_militarist_national_wellness_programs_desc: "Les PBN sont une série de moyens de redonner à ceux qui donnent pour la nation. Si les citoyens prennent soin de l'État, l'État fera de même. Comme nous pourrions être confrontés à une guerre, ce sentiment pèse lourdement sur tous."
 USA_militarist_strategic_quotas: "Quotas stratégiques"
 USA_militarist_strategic_quotas_desc: "Notre puissance économique ne connaîtra pas de limites. Cependant, en temps de crise et de guerre, des sacrifices sont attendus et, en tant que tel, nous émettrons un programme de quotas stratégiques rotatifs pour donner à la population l'idée et la compréhension de ce qui pourrait être nécessaire d'elle à l'avenir."
 USA_militarist_integrated_corps_of_engineers: "Corps d'ingénieurs intégré"
 USA_militarist_integrated_corps_of_engineers_desc: "En utilisant le Corps des ingénieurs et d'autres aspects de l'armée dans des projets de travaux publics et autres, nous pouvons créer un nouveau standard de développement que nos citoyens n'ont pas encore connu. De plus, qui ne voudrait pas rejoindre l'armée en sachant qu'il n'aura pas à aller mourir dans un pays lointain ? C'est ce qu'on appelle de la R.P. gratuite."
 USA_militarist_investing_in_naval_companies: "Investir dans les entreprises navales"
 USA_militarist_investing_in_naval_companies_desc: "Le financement d'initiatives de recherche au sein de plusieurs entreprises navales permettra à nos industries civiles et militaires de créer de nouveaux navires et de trouver des moyens d'accélérer les efforts de réparation. N'oubliez pas que les innovations militaires engendrent de nouvelles innovations civiles et inversement."
 USA_militarist_automations_act: "Loi sur les automatisations"
 USA_militarist_automations_act_desc: "Pour améliorer notre production économique potentielle ainsi que pour augmenter notre bassin de conscription potentiel, nous devons investir dans l'automatisation là où et quand c'est possible. Ce ne sera pas une chose appréciée par le peuple, mais c'est un mal nécessaire si nous voulons survivre."
 USA_militarist_mea: "Administration de l'emploi obligatoire"
 USA_militarist_mea_desc: "L'AEO est un organisme administratif gouvernemental pour aider à trouver un emploi à ceux qui n'en ont pas. S'inspirant de certaines agences à trois lettres de l'ère du New Deal, l'AEO est là pour aider tous ceux qui ont besoin d'un emploi."
 USA_militarist_fwip: "Programme d'innovations pour la guerre future"
 USA_militarist_fwip_desc: "Le PIGF est un complexe de R&D dédié aux innovations pour former les forces de combat de demain. Grâce à des efforts inlassables, nous nous assurerons que nos services armés seront inégalés dans le monde entier."
 USA_militarist_army_armaments_improvements: "Améliorations de l'armement de l'armée"
 USA_militarist_army_armaments_improvements_desc: "Grâce à des contrats de développement, nous sommes en mesure d'améliorer l'armement dont nos soldats sont équipés. Avec cela, nous espérons améliorer les capacités globales de notre armée à tenir et à prendre le champ de bataille."
 USA_militarist_mobile_observation_force: "Force d'observation mobile"
 USA_militarist_mobile_observation_force_desc: "La FOM est une force spécialisée liée aux initiatives de reconnaissance. Cette nouvelle force sera une unité hautement mobile chargée de surveiller les mouvements de l'ennemi et de s'assurer que nos troupes reçoivent autant d'avertissements que possible sur les attaques imminentes et les mouvements généraux."
 USA_militarist_localized_logistics: "Logistique localisée"
 USA_militarist_localized_logistics_desc: "Une logistique améliorée en termes d'unités plus petites et de mesures de flexibilité permettra, espérons-le, à notre armée d'être plus coordonnée et mieux préparée à tout ce que l'ennemi pourrait nous lancer."
 USA_militarist_naval_gunnery_advancements: "Avancées de l'artillerie navale"
 USA_militarist_naval_gunnery_advancements_desc: "La recherche de nouveaux programmes d'entraînement à l'artillerie ainsi que l'amélioration des munitions et des systèmes d'armes sur notre flotte est primordiale pour défendre nos eaux côtières et porter le combat à l'ennemi si et quand cela est nécessaire."
 USA_militarist_propulsion_advancements: "Avancées en matière de propulsion"
 USA_militarist_propulsion_advancements_desc: "L'amélioration des moteurs et des systèmes de propulsion de nos navires de guerre permettra à nos navires de se rejoindre plus rapidement que jamais. Sans parler de l'initiative sur le champ de bataille que cela apportera dans les guerres à venir."
 USA_militarist_increased_pay_incentives: "Incitatifs de rémunération accrus"
 USA_militarist_increased_pay_incentives_desc: "Notre personnel naval est surtout des canards assis, avec peu de chances de s'échapper correctement d'une force ennemie. Ces épreuves signifient que nous devrions les compenser correctement. Avec cette compensation, nous augmenterons aussi les exercices navals de combat et de désengagement des forces ennemies afin d'assurer la survie et l'efficacité de chaque navire et du personnel à bord."
 USA_militarist_aircraft_improvements: "Améliorations des aéronefs"
 USA_militarist_aircraft_improvements_desc: "Investir dans de meilleurs aéronefs plus agiles signifie que nous devons aussi investir dans notre personnel afin qu'il puisse correctement manier ces machines de guerre. Nous ferons donc exactement cela afin de faire un ciel clair pour nos citoyens."
 USA_militarist_increasing_drill_intensity: "Augmenter l'intensité des exercices"
 USA_militarist_increasing_drill_intensity_desc: "Affiner, intensifier et améliorer nos exercices d'aéronefs pour améliorer l'efficacité globale donnera des résultats en termes d'efficacité de la mission et de capacités de combat."
 USA_militarist_weapon_system_innovations: "Innovations des systèmes d'armes"
 USA_militarist_weapon_system_innovations_desc: "Les investissements en R&D pour améliorer les systèmes d'armes de nos aéronefs conduiront à des scénarios de combat plus efficaces, ce qui, espérons-le, se traduira par un gain net positif dans les futurs conflits si possible."
 USA_militarist_pre_emptive_mobilization: "Mobilisation préventive"
 USA_militarist_pre_emptive_mobilization_desc: "Le temps est venu, nous devons commencer à mobiliser la nation pour nous assurer que notre avenir est une certitude."
 USA_militarist_securing_southern_interests: "Sécuriser les intérêts du sud"
 USA_militarist_securing_southern_interests_desc: "La violence endémique des gangs et un gouvernement fédéral quelque peu inefficace pour l'ère moderne font du Mexique la clé de la domination et de la sécurité continentales pour l'hémisphère."
 USA_militarist_operation_clean_streets: "Opération Rues Propres"
 USA_militarist_operation_clean_streets_desc: "Maintenant que nous avons sécurisé nos territoires du sud, nous devons nous lancer dans une opération de nettoyage stricte pour débarrasser la zone des grandes bandes de gangs et commencer à intégrer les territoires."
 USA_militarist_securing_atlantic_interests: "Sécuriser les intérêts atlantiques"
 USA_militarist_securing_atlantic_interests_desc: "En sécurisant les principales nations insulaires de Cuba, de la Jamaïque et d'Hispaniola, nous créons un précédent en matière de sécurité hémisphérique sans pareil."
 USA_militarist_operation_paradise: "Opération Paradis"
 USA_militarist_operation_paradise_desc: "L'opération Paradis est la mise en réseau des nouveaux territoires pour l'intégration et l'utilisation immédiate de l'infrastructure militaire."
 USA_militarist_policing_and_cultural_programs: "Programmes de police et culturels"
 USA_militarist_policing_and_cultural_programs_desc: "Nos nouveaux gains seront toujours confrontés à ceux qui souhaitent saper notre nation et ses citoyens. En tant que tel, nous devons instituer des programmes culturels pour promouvoir l'unité et l'uniformité, car nous sommes d'abord humains et pas simplement américains, cubains, et ainsi de suite. En passant, l'augmentation et l'intégration des forces de police ainsi que de la police militaire peuvent également aider à apaiser l'agitation excessive."
 USA_militarist_a_true_leader_of_the_western_world: "Un véritable leader du monde occidental"
 USA_militarist_a_true_leader_of_the_western_world_desc: "Pour sécuriser notre hémisphère, nous devons également assurer le véritable leadership du monde occidental. N'oubliez pas que toute attaque contre un membre de l'OTAN sera une déclaration sur l'ensemble de l'alliance. Cette frappe déterminera donc notre avenir. Que Dieu nous aide tous."
 USA_militarist_operation_great_north: "Opération Grand Nord"
 USA_militarist_operation_great_north_desc: "Le calme est revenu et notre victoire est assurée, nous pouvons maintenant commencer à intégrer et à sécuriser notre domination continentale ainsi que notre hégémonie hémisphérique."
 USA_militarist_operation_atlantic_viking: "Opération Viking Atlantique"
 USA_militarist_operation_atlantic_viking_desc: "La sécurisation des terres proches de l'Arctique, du Groenland et de l'Islande, ainsi que de l'île barrière de l'Atlantique des Îles Féroé, sécurisera nos connexions atlantiques et nous permettra d'avoir un réseau logistique plus direct entre les nouveaux et les anciens mondes."
 USA_militarist_operation_atlantic_wall: "Opération Mur de l'Atlantique"
 USA_militarist_operation_atlantic_wall_desc: "Avec notre position de leader du monde occidental assurée, nous devons également nous assurer que ladite position est stable et peut être maintenue. En tant que tel, nous acquerrons tous les territoires atlantiques et les utiliserons pour aider à contrôler la logistique, les marchés et ceux qui sont plus loin sur le continent. L'avenir est maintenant et l'avenir est radieux."
 USA_militarist_humanity_marches_onwards: "L'humanité marche en avant"
 USA_militarist_humanity_marches_onwards_desc: "Notre empreinte sur le globe est assurée, nos populations sont au moins satisfaites. Bien que le chemin ne soit pas terminé, nous sommes à un point significatif à partir duquel nous pouvons commencer à réduire l'hyper-militarisation et mettre en place une phase de développement plus économique. C'est la voie et c'est par cette voie que nous atteindrons les étoiles dans un proche avenir. Unis nous tenons, divisés nous tomberons tous."
 USA_fascist_closed_border: "Frontière fermée"
 USA_fascist_closed_border_desc: "Pour assurer notre nation et son intégrité culturelle, nous devons fermer la frontière. De là, nous pourrons choisir comment réformer la politique d'immigration afin de commencer à accepter les peuples corrects qui peuvent contribuer à notre société."
 USA_fascist_family_planning_incentives: "Incitatifs à la planification familiale"
 USA_fascist_family_planning_incentives_desc: "Si nous voulons vraiment réparer notre nation, présenter une voie nouvelle et pure. Nous devons d'abord nous occuper des nôtres avant tout. Le recul du taux de natalité est un enjeu mondial qui survient plus une nation se développe. Cependant, plutôt que de simplement « retourner au singe », comme certains semblent sentir que nous devons le faire, nous créons plutôt des programmes pour aider et assister les familles et les parents en attente. Cela limite le fardeau des nouvelles familles et assure l'avenir de nouvelles générations n'ayant pas à traverser des épreuves enlisées en raison d'influences financières."
 USA_fascist_encouraging_productivity_quotas: "Encourager les quotas de productivité"
 USA_fascist_encouraging_productivity_quotas_desc: "Nos citoyens méritent les meilleurs produits et c'est ce que nous leur fournirons. La consommation statistique fine d'outils et de services connus nous permettra de fixer des quotas dans lesquels ces articles de luxe et/ou quotidiens verront leur prix baisser. Cela améliorera la qualité de vie de tous les citoyens."
 USA_fascist_federal_sponsored_emmigration_programs: "Federally Sponsored Emmigration Programs"
 USA_fascist_federal_sponsored_emmigration_programs_desc: "Notre nation a des sangsues et des parasites qui sucent le généreux pis de nos contribuables et les programmes fédéraux bienveillants destinés à s'occuper des membres actifs de notre société. Nous devons donc leur faire une offre qu'ils ne peuvent pas refuser. En ciblant un mélange de pays à qualité de vie similaire ainsi que de bons taux de change où le dollar américain est plus valorisé que dans le pays vers lequel les cibles déménageront, nous posons la capacité de débarrasser pacifiquement notre nation du drain continu sur nos ressources que certains de ces gens sont devenus."
 USA_fascist_strategic_automation_programs: "Programmes d'automatisation stratégique"
 USA_fascist_strategic_automation_programs_desc: "La loi sur les SAP est une initiative d'automatisation ciblée visant à augmenter la production de biens nécessaires pour permettre une meilleure tendance pour le développement de notre nation et de la qualité de vie de nos citoyens."
 USA_fascist_forging_new_innovations: "Forger de nouvelles innovations"
 USA_fascist_forging_new_innovations_desc: "L'Institut des innovations est le complexe de R&D de demain. Établir une nouvelle norme de recherche qui nous permettra de garder une longueur d'avance sur la concurrence."
 USA_fascist_the_development_corps: "Le Corps de développement"
 USA_fascist_the_development_corps_desc: "La création du Corps de développement est une initiative fédérale visant à enrôler les condamnés ainsi que les volontaires et les chômeurs pour qu'ils fassent leur part dans l'amélioration de notre société. Les condamnés peuvent chercher à purger lentement leur peine par une bonne conduite pendant leur temps dans le Corps et les volontaires et les chômeurs peuvent chercher à gagner un revenu supplémentaire ou initial en cas de besoin."
 USA_fascist_developing_prison_workforces: "Développer les effectifs pénitentiaires"
 USA_fascist_developing_prison_workforces_desc: "Le ministère du Travail cherchera à créer la Prison Labor Administration ou PLA. La PLA sera chargée de créer des programmes de réadaptation par le biais de sites d'emploi dédiés. Des industries primaires et certaines industries secondaires pourraient voir des substitutions de main-d'œuvre qui, dans l'ensemble, profiteront à la société dans son ensemble."
 USA_fascist_gearing_the_nation_for_survival: "Préparer la nation pour la survie"
 USA_fascist_gearing_the_nation_for_survival_desc: "Notre nation est pure, nos citoyens sont forts de volonté et d'esprit, nous devons leur montrer nos ennemis et les informer de la survie à laquelle nous sommes confrontés pour préserver notre mode de vie même. Le soi-disant « monde occidental » ne cherche qu'à limiter notre nation et la place légitime que nous aurions dû avoir il y a des siècles. Un nouveau destin se manifestera et personne ne nous arrêtera."
 USA_fascist_retooling_officer_corps_requirements: "Réoutiller les exigences du corps des officiers"
 USA_fascist_retooling_officer_corps_requirements_desc: "En modifiant les exigences d'inscription ainsi que les possibilités d'avancement pour qu'elles soient plus influencées par des motivations idéologiques, nous établissons une norme d'uniformité et d'unité au sein de la structure de commandement. Cela permettra, nous l'espérons, sur le terrain et dans les éléments de commandement du QG, d'avoir une vigueur plus enrichie dans l'atteinte des objectifs."
 USA_fascist_ideological_motivation_drills: "Exercices de motivation idéologique"
 USA_fascist_ideological_motivation_drills_desc: "En inculquant des valeurs pour lesquelles chaque soldat se bat et qui doivent être les ennemis, nous pouvons créer une force de volonté chez nos soldats que la plupart des autres pays ne peuvent tout simplement pas recréer. Nous sommes plus forts parce que nous choisissons de l'être. L'unité fait la force."
 USA_fascist_improved_logistical_organizations: "Amélioration des organisations logistiques"
 USA_fascist_improved_logistical_organizations_desc: "Notre pays est immense et que nous allions au nord ou au sud, les territoires sont vastes et ne sont pas adaptés au transport de masse. Nous devons donc réorganiser et améliorer le fonctionnement de notre logistique pour nous assurer que nos soldats obtiennent tous les matériaux nécessaires pour faire la guerre n'importe où et n'importe quand."
 USA_fascist_general_weapons_testing_complex: "Complexe d'essai d'armes général"
 USA_fascist_general_weapons_testing_complex_desc: "Le GWTC est une installation d'essai dédiée à l'amélioration des systèmes d'armes militaires dans l'ensemble.... c'est tout, rien de plus."
 USA_fascist_phase_two_weapons_testing: "Essai d'armes de phase deux"
 USA_fascist_phase_two_weapons_testing_desc: "C'est ce que vous appelez plus de peps pour votre argent."
 USA_fascist_engineering_better_engines: "Concevoir de meilleurs moteurs"
 USA_fascist_engineering_better_engines_desc: "L'amélioration des moteurs de toutes tailles signifie que nous pouvons avoir une meilleure mobilité pour exploiter les lacunes de la ligne ennemie. Nous pouvons fabriquer des avions plus agiles et plus performants pour patrouiller et garder nos cieux. Sans oublier que nous pouvons améliorer la maniabilité des navires et les taux de patrouille pour nous assurer que l'ennemi est toujours sur ses gardes."
 USA_fascist_paying_the_dues_our_soldiers_deserve: "Payer les cotisations que nos soldats méritent"
 USA_fascist_paying_the_dues_our_soldiers_deserve_desc: "Nos soldats, à la fois volontaires et conscrits, sacrifient leur vie pour cette nation et doivent donc être traités comme des héros. Leur salaire doit refléter le travail qu'ils accomplissent afin de donner l'impression que ce que ces soldats font est vraiment reconnu."
 USA_fascist_militarized_economy: "Économie militarisée"
 USA_fascist_militarized_economy_desc: "La population est prête et nous préparons les derniers actes de préparation. Bientôt, un nouvel âge s'ouvrira à nous et notre sécurité mondiale pour l'hémisphère occidental sera assurée."
 USA_fascist_operation_pig_bay_two: "Opération Baie des Cochons deux"
 USA_fascist_operation_pig_bay_two_desc: "Cuba nous a échappé depuis l'opération de la CIA ratée connue sous le nom de Baie des Cochons. Eh bien, plus maintenant, nous sommes officiellement aux commandes et nous sommes donc prêts pour le deuxième round. Cette fois, nous serons victorieux."
 USA_fascist_operation_hispaniola: "Opération Hispaniola"
 USA_fascist_operation_hispaniola_desc: "Pour sécuriser notre pied-à-terre dans le Golfe ainsi que dans les nations environnantes, nous devons prendre la prochaine plus grande île qui est celle d'Hispaniola. Cela contient les nations stables et instables de la République dominicaine et d'Haïti. Devrait être terminé à l'heure du déjeuner."
 USA_fascist_operation_makin_me_happy: "Opération Makin Me Happy"
 USA_fascist_operation_makin_me_happy_desc: "Pour étendre notre portée, nous devons sécuriser la chaîne d'îles que sont les Bahamas ainsi que la nation insulaire de la Jamaïque. Cela nous donne une barrière autour de nos gains initiaux et prépare le terrain pour de nouvelles incursions."
 USA_fascist_operation_clean_sweep: "Opération Grand Nettoyage"
 USA_fascist_operation_clean_sweep_desc: "Comme une chaîne de dominos, nous ferons tomber chacune de ces nations insulaires."
 USA_fascist_extra_territorial_corps: "Corps extra-territorial"
 USA_fascist_extra_territorial_corps_desc: "La création de l'ETC a pour but de créer une force de réserve dédiée pour permettre la gestion claire et complète de nos nouveaux territoires."
 USA_fascist_operation_cartel: "Opération Cartel"
 USA_fascist_operation_cartel_desc: "Maintenant que nous avons assuré le golfe et la région des Caraïbes, nous pouvons pleinement nous concentrer sur notre avancée hémisphérique. Depuis la frontière, nous frapperons l'État mexicain fragile et en ferons de nouveau une terre de loi et d'ordre."
 USA_fascist_operation_fruit_master: "Opération Maître des fruits"
 USA_fascist_operation_fruit_master_desc: "Les intérêts américains n'ont jamais quitté les nations d'Amérique centrale. Pour des raisons d'entreprise ou nationales, les États-Unis se sont toujours ingérés dans les affaires de ces nations. Eh bien, le moment est venu d'avoir un pouvoir et un contrôle directs, car ces nations en difficulté ne semblent pas se prendre en main."
 USA_fascist_operation_amazon: "Opération Amazonie"
 USA_fascist_operation_amazon_desc: "Le « boss final » du continent sud-américain, le Brésil, sera le plus grand défi pour nous, car la logistique de traverser une terre naturellement si hostile est appelée à causer des impacts immédiats sur la qualité des troupes et les besoins logistiques. Néanmoins, nous forgerons en avant et unirons l'hémisphère."
 USA_fascist_operation_la_plata: "Opération La Plata"
 USA_fascist_operation_la_plata_desc: "La deuxième à la dernière étape. La région de La Plata et ses environs seront bientôt sous notre coupe."
 USA_fascist_proclaiming_the_union: "Proclamer l'Union"
 USA_fascist_proclaiming_the_union_desc: "Presque chaque parcelle de terre des Amériques nous appartient maintenant. L'unité est enfin là, cependant, le travail n'est pas terminé. Nous devons nous réorganiser et nous renforcer de l'intérieur et nous préparer pour l'acte final. La Grande Expédition du Nord."
 USA_fascist_the_final_chapter: "Le chapitre final"
 USA_fascist_the_final_chapter_desc: "L'Union est déclarée, nos ennemis de notre côté du globe sont peu nombreux. Maintenant, nous devons terminer le travail et mener la lutte vers le vieux monde si nous devons le faire."
 USA_monarchist_nobility_act: "La loi sur la noblesse"
 USA_monarchist_nobility_act_desc: "La création d'une noblesse moderne est une chose qui nécessite une réflexion minutieuse. En tant que tel, un noble moderne peut venir de n'importe quel milieu de la société. Cependant, chaque milieu aura ses propres exigences pour être juste envers chaque couche sociale. Par exemple, les magnats des affaires doivent fournir une preuve d'investissement d'un montant spécifié, à déterminer, de croissance de l'économie nationale. Ils doivent également faire un don d'un montant spécifié à des organisations caritatives reconnues comme la Croix-Rouge par exemple. Etc, etc, etc. Ce n'est qu'un échantillon de la nouvelle loi sur la noblesse et des portes qu'elle ouvrira pour l'avancement social ainsi que les objectifs personnels pour aider dans la vie."
 USA_monarchist_tied_to_office_act: "Loi liée à la fonction"
 USA_monarchist_tied_to_office_act_desc: "La « loi liée à la fonction » est une législation qui formalise la séquence numérique des « titres ». Au lieu de la métrique insensée de lier le titre au sang, il sera plutôt lié à la fonction respective, ou dans le cas de la loi sur la noblesse, il sera lié aux exigences remplies pour obtenir une licence de titre de noble."
 USA_monarchist_workforce_welfare_act: "Loi sur le bien-être de la main-d'œuvre"
 USA_monarchist_workforce_welfare_act_desc: "La LBM est une législation utilisée pour réformer et affiner la portion de l'État-providence autour de la rémunération de la main-d'œuvre en relation avec les handicaps et les congés de maternité et autres affections d'incapacité connexes."
 USA_monarchist_education_investments_act: "Loi sur les investissements dans l'éducation"
 USA_monarchist_education_investments_act_desc: "Des investissements complets dans notre système éducatif permettront des améliorations à l'échelle nationale de notre économie et des emplois auxquels nos citoyens peuvent participer et qu'ils peuvent créer eux-mêmes."
 USA_monarchist_declaring_the_empire: "Déclaration de l'Empire"
 USA_monarchist_declaring_the_empire_desc: "C'est en ce jour que nous réalisons la réforme ultime. D'une république constitutionnelle à une république constitutionnelle avec une monarchie élective. À partir de ce jour, nous sommes connus sous le nom de « Saint Empire Américain »."
 USA_monarchist_readjusting_foreign_trade_policies: "Réajuster les politiques de commerce extérieur"
 USA_monarchist_readjusting_foreign_trade_policies_desc: "En utilisant notre propre abondance naturelle, nous pouvons renégocier les plans commerciaux entre les nations qui cherchent à nous forcer à puiser dans nos propres réserves. Si nous pouvons économiser ces réserves aussi longtemps que raisonnablement possible, cela nous donne un investissement à long terme dans les futurs accords commerciaux et les influences économiques mondiales."
 USA_monarchist_penal_labour_corps: "Créer le corps de travail pénal"
 USA_monarchist_penal_labour_corps_desc: "En créant des programmes de réhabilitation autour de projets de travail, nous pouvons améliorer les infrastructures publiques ou avancer la productivité des industries primaires. Nous pouvons donc bénéficier à la qualité de vie d'ensemble de nos citoyens en ramenant davantage de biens à la production intérieure."
 USA_monarchist_creating_more_domestic_supply_chains: "Créer plus de chaînes d'approvisionnement nationales"
 USA_monarchist_creating_more_domestic_supply_chains_desc: "En nous concentrant sur la diversification de la composition économique locale par la création de nouvelles chaînes d'approvisionnement intérieures, notre nation peut être plus autonome et percer dans des marchés que nous pensions autrefois dominés par un ensemble restreint de nations."
 USA_monarchist_expanding_military_education_programs: "Élargir les programmes d'éducation militaire"
 USA_monarchist_expanding_military_education_programs_desc: "En élargissant et potentiellement en rendant obligatoires les programmes de leadership connus sous le nom de Corps de formation des officiers de réserve junior ou JROTC, nous ouvrons la possibilité d'étendre le taux de volontariat par une exposition passive à l'armée. En prime, nous pouvons également enseigner aux futures générations des compétences en leadership qui sont tout aussi valables dans la main-d'œuvre civile que dans l'armée."
 USA_monarchist_army_investments: "Investissements dans l'armée"
 USA_monarchist_army_investments_desc: "En augmentant le financement et en le dirigeant vers des améliorations liées au fantassin moyen, nous pouvons commencer à améliorer les capacités de combat que chaque soldat sera, eh bien, capable d'avoir."
 USA_monarchist_baby_stepping_mandatory_service: "Service obligatoire en douceur"
 USA_monarchist_baby_stepping_mandatory_service_desc: "Le pays a eu une force entièrement volontaire pendant à peu près toute son existence. Cependant, avec des guerres modernes et des ennemis si brouillés et inconnus, mieux vaut être proactif que réactif. Une législation sera donc adoptée pour instituer une période de service obligatoire de quatre mois, afin au moins d'accoutumer la population aux tout premiers rudiments du métier de soldat."
 USA_monarchist_naval_investments: "Investissements navals"
 USA_monarchist_naval_investments_desc: "L'amélioration de notre prouesse et de nos capacités navales nous permettra de frapper de manière préventive toute force d'invasion ennemie, qu'elle soit de ce côté du monde ou non."
 USA_monarchist_improving_shipping_industries: "Améliorer les industries maritimes"
 USA_monarchist_improving_shipping_industries_desc: "En investissant et en concluant de meilleurs contrats, nous espérons améliorer les industries maritimes et navales générales de notre nation. Cela nous aidera dans les domaines civil et militaire alors que nous nous efforçons de naviguer dans l'ère moderne des enchevêtrements géopolitiques."
 USA_monarchist_hemispheric_influence: "Influence hémisphérique"
 USA_monarchist_hemispheric_influence_desc: "Grâce à la puissance douce et à des influences subtiles, nous pouvons chercher à contrôler de manière plus directe l'hémisphère dans lequel nous avons déjà une influence majoritaire."
 USA_monarchist_the_northern_kingdom_agreement: "L'accord du royaume du nord"
 USA_monarchist_the_northern_kingdom_agreement_desc: "« L'empire du nord », aussi connu comme les vastes terres du Canada, devrait être davantage aligné sur les besoins de l'hémisphère occidental. Nous devons donc tenter de les presser et de les aider à comprendre que les Britanniques/Anglais sont depuis longtemps partis de la présence significative qu'ils avaient autrefois. Cependant, nous pouvons les laisser faire partie d'un âge nouveau d'unité, de commerce et d'innovation. Nous devons les convaincre, nous avons à les convaincre."
 USA_monarchist_the_southern_kingdom_agreement: "L'accord du royaume du sud"
 USA_monarchist_the_southern_kingdom_agreement_desc: "La disposition du Mexique n'a jamais vraiment été dans le positif, pour ainsi dire. Nous pouvons nous en servir pour assurer l'ordre public et la stabilité à leur nation, ainsi que lancer des initiatives commerciales pour montrer que nous sommes sérieux à les aider pour le mieux de chacun. Espérons seulement qu'ils comprennent."
 USA_monarchist_the_federation_proposal: "La proposition de fédération"
 USA_monarchist_the_federation_proposal_desc: "Malgré l'animosité historique, nous pouvons faire de notre mieux pour tenter de convaincre Cuba que nous voulons du bien et un agenda plus pro-hémisphère occidental. Ce qui leur bénéficie bénéficiera à l'hémisphère dans son ensemble. Nous pouvons aussi sucrer l'affaire en leur donnant le feu vert pour consolider les Caraïbes. Espérons seulement que ce soit assez sucré pour eux."
 USA_monarchist_the_united_principalities_offer: "L'offre des principautés unies"
 USA_monarchist_the_united_principalities_offer_desc: "En lançant des pourparlers avec le Panama, une nation avec laquelle nous avons eu une histoire relativement positive en général. Nous pouvons créer une fédération ou une union d'États en Amérique centrale qui sera dirigée par eux et aidée à maintenir l'ordre par nous."
 USA_monarchist_brazi_comes_to_you: "Le Brésil vient à vous"
 USA_monarchist_brazi_comes_to_you_desc: "Tout le monde dit que le Brésil est un mauvais endroit ; il y a même une blague appelée « tu vas au Brésil ». Eh bien, nous voulons que le Brésil vienne à eux. Nous offrirons au Brésil la capacité de consolider la moitié sud du continent, et nous protégerons leurs intérêts et mènerons la voie dans une union hémisphérique commune."
 USA_monarchist_operation_screaming_eagle: "Opération Aigle hurlant"
 USA_monarchist_operation_screaming_eagle_desc: "Pendant trop longtemps, le globe s'est immiscé dans notre hémisphère et a agité ainsi que dilué nos efforts pour créer un état d'affaires plus pacifique. Bien sûr, nous avons commis des erreurs dans le passé, mais plus maintenant. Nous prendrons des mesures plus drastiques et directes pour assurer le chemin et le destin que nous allons créer. Le nouveau monde sera à nouveau renouvelé."
 USA_monarchist_operation_initial_gains: "Opération gains initiaux"
 USA_monarchist_operation_initial_gains_desc: "Nous avons eu le temps de construire nos forces et de préparer nos alliés, il est maintenant temps pour nous de déployer nos ailes et de consolider les continents."
 USA_monarchist_economic_investments: "Investissements économiques"
 USA_monarchist_economic_investments_desc: "Aujourd'hui, nous serons le fer de lance du nouveau Programme économique de l'hémisphère occidental. Nous faciliterons et encouragerons le développement de nos nouveaux et plus proches alliés et sujets, afin que nous puissions tous prospérer ensemble."
 USA_monarchist_public_unity_programs: "Programmes d'unité publique"
 USA_monarchist_public_unity_programs_desc: "Le PUP est un programme d'entraide dédié à encourager l'unité publique au sein des nouvelles nations et à promouvoir la nouvelle identité hémisphérique du « Nouveau Monde ». Cette valeur partagée d'appartenance à cette nouvelle union favorisera notre développement et notre compréhension mutuelle, et inaugurera une nouvelle ère où nous pourrons explorer l'univers. Car si nous œuvrons tous ensemble, quel autre objectif pourrait-on s'offrir que celui de l'immensité de l'espace ?"
 USA_monarchist_operation_midtown_madness: "Opération folie du centre-ville"
 USA_monarchist_operation_midtown_madness_desc: "La prochaine phase de consolidation est à nos portes. Alors que Cuba et le Panama auront plusieurs nations à combattre, le terrain est nettement plus difficile pour la Colombie et le Brésil. En tant que tel, nous limiterons leurs pertes en morcelant mieux leurs ennemis."
 USA_monarchist_operation_new_world: "Opération nouveau monde"
 USA_monarchist_operation_new_world_desc: "La phase finale de consolidation est à nos portes. Il est maintenant temps pour nos alliés et sujets de confiance de consolider le reste du nouveau monde afin que nous puissions ouvrir la voie à un avenir nouveau et uni."
 USA_monarchist_continued_economic_ties: "Liens économiques continus"
 USA_monarchist_continued_economic_ties_desc: "Pour renforcer notre coopération et nos liens économiques, nous allons lancer le Nouvel Échange Économique Mondial ou NEEM. Ce programme améliorera les efforts de développement et continuera de s'efforcer de créer la pierre angulaire de l'identité du Nouveau Monde."
 USA_monarchist_a_new_world_mineral_order: "Un nouvel ordre minéral mondial"
 USA_monarchist_a_new_world_mineral_order_desc: "Pour signifier notre engagement envers nos alliés et sujets, nous allons mettre en place un profil d'investissement minéral massif dans tout l'hémisphère. Ce sera assez coûteux, mais cela en vaut certainement la peine."
 USA_red_junta_the_commissariat_declaration: "Déclaration du Commissariat"
 USA_red_junta_the_commissariat_declaration_desc: "Nous, l'armée du peuple, avons pris le contrôle et souhaitons améliorer et sécuriser la vie des travailleurs. Par conséquent, pour comprendre pleinement cet engagement, nous deviendrons les Commissariats Unis d'Amérique. Une force militaire populaire unie veillant au bien-être et à la sécurité de ses citoyens."
 USA_red_junta_service_welfare_programs: "Programmes de bien-être des services"
 USA_red_junta_service_welfare_programs_desc: "Pour garantir que les effectifs du personnel restent à des niveaux raisonnables, nous commencerons à élargir certaines incitations offertes par l'armée. Globalement, nous ne nous attendons pas à un changement majeur, mais cela devrait encourager le recrutement tout en offrant davantage à ceux qui retournent dans la main-d'œuvre civile."
 USA_red_junta_public_service_corps: "Corps de service public"
 USA_red_junta_public_service_corps_desc: "Le CSP est une sorte de corps de travail et/ou un corps d'ingénierie mixte civil et militaire. L'objectif est de soutenir les projets de développement ou l'entretien des infrastructures."
 USA_red_junta_improved_service_health_programs: "Programmes de santé de service améliorés"
 USA_red_junta_improved_service_health_programs_desc: "Investir dans nos programmes de soins de santé pour les membres du service et les anciens membres du service augmentera, espérons-le, le nombre de recrues en incitant à la prise en charge à la fois pendant et après l'armée."
 USA_red_junta_industrious_innovators_act: "Loi sur les innovateurs industrieux"
 USA_red_junta_industrious_innovators_act_desc: "La LIIA est une législation et un projet de loi de financement visant à promouvoir les innovations économiques et les moyens d'améliorer notre production économique."
 USA_red_junta_industrial_expansion_fund: "Fonds d'expansion industrielle"
 USA_red_junta_industrial_expansion_fund_desc: "Le FEI est un fonds dédié à la création de nouveaux projets de développement économique et à l'amélioration non seulement des emplois disponibles, mais aussi de notre composition économique."
 USA_red_junta_infrastructure_improvement_fund: "Fonds d'amélioration des infrastructures"
 USA_red_junta_infrastructure_improvement_fund_desc: "En consacrant mieux des fonds au développement des infrastructures, nous serons en mesure d'améliorer globalement notre production économique générale, car les chaînes d'approvisionnement auront des moyens meilleurs et plus fluides de s'interconnecter."
 USA_red_junta_strategic_resource_development_act: "Loi sur le développement des ressources stratégiques"
 USA_red_junta_strategic_resource_development_act_desc: "La SRDA est un effort dédié de financement et de déréglementation visant à encourager, et presque à imposer, l'amélioration de l'extraction minière dans la moitié orientale des États-Unis. Plus précisément le long des États médians entre ce que l'on considère comme les États du \\"Nord\\" et du \\"Sud\\"."
 USA_red_junta_strategic_resource_western_development_act: "Loi sur le développement occidental"
 USA_red_junta_strategic_resource_western_development_act_desc: "Le WDA est une continuation du SRDA en ce qu'il poursuit la tendance occidentale de développement stratégique le long des États médians comme le Colorado, l'Utah, etc."
 USA_red_junta_rotating_training_programs: "Programmes de formation rotatifs"
 USA_red_junta_rotating_training_programs_desc: "En mettant en place un système d'entraînement rotatif, nous pouvons améliorer l'efficacité d'ensemble de nos troupes. Le RTP se concentre sur la diversification des terrains d'entraînement auxquels nos troupes seront exposées. En bref, un jour ou quelques jours ils pourraient s'entraîner dans un marais, puis ensuite ce pourrait être un désert."
 USA_red_junta_officer_refinement_program: "Programme de perfectionnement des officiers"
 USA_red_junta_officer_refinement_program_desc: "En travaillant sans relâche à affiner et améliorer notre leadership, nous pouvons garantir que l'élément de commandement et de contrôle de nos forces armées est aussi efficace que possible. Cela devrait bénéficier à toutes les branches, là où c'est possible, en termes de prise de décision instantanée ainsi que d'évaluation et de gestion des risques sur le champ de bataille."
 USA_red_junta_army_advancements_program: "Programme d'avancement de l'armée"
 USA_red_junta_army_advancements_program_desc: "Le PAAP est un investissement complet dans l'amélioration générale de notre branche de service de l'armée. Les systèmes d'armes, l'équipement et les soldats ne sont que des pièces du puzzle plus vaste que nous souhaitons achever."
 USA_red_junta_increased_training_programs: "Programmes de formation accrus"
 USA_red_junta_increased_training_programs_desc: "Augmenter et rester au fait de nos programmes d'entraînement naval, en termes de scénarios de combat et hors combat, accoutume mieux les soldats aux navires auxquels ils sont affectés. Par conséquent, cela rend le soin et l'évaluation de combat de l'équipage de chaque navire, et permet à notre personnel naval de mieux se former avec les outils que nous pouvons leur fournir."
 USA_red_junta_naval_propulsion_program: "Programme de propulsion navale"
 USA_red_junta_naval_propulsion_program_desc: "Le PPN est un programme de recherche dédié à l'amélioration des moteurs et des systèmes de propulsion de nos navires de guerre pour leur donner un avantage au combat en matière de manœuvrabilité."
 USA_red_junta_naval_gun_research_initiative: "Initiative de recherche sur les canons navals"
 USA_red_junta_naval_gun_research_initiative_desc: "Notre personnel naval n'est qu'une pièce du puzzle de la puissance. Nous devons améliorer nos systèmes d'armes navales si nous voulons réellement nous défendre, sans parler de vaincre une force ennemie."
 USA_red_junta_improved_armaments: "Armements améliorés"
 USA_red_junta_improved_armaments_desc: "En mettant à niveau et en améliorant les systèmes d'armes de nos aéronefs, nous pouvons améliorer notre efficacité globale dans les scénarios de combat."
 USA_red_junta_bettering_aircraft_models: "Améliorer les modèles d'aéronefs"
 USA_red_junta_bettering_aircraft_models_desc: "La mise à niveau de nos modèles d'aéronefs existants nous permet d'assurer des manœuvres aériennes plus agiles pour sécuriser efficacement une zone aérienne contre la force ennemie."
 USA_red_junta_further_airforce_investments: "Autres investissements dans la force aérienne"
 USA_red_junta_further_airforce_investments_desc: "En augmentant nos investissements généraux dans notre branche de service de la force aérienne, nous établissons un nouveau standard d'amélioration et d'avancement que la force peut potentiellement rencontrer au fur et à mesure que le temps et les investissements continus se poursuivent."
 USA_red_junta_establishing_the_warplanning_department: "Département de planification de la guerre"
 USA_red_junta_establishing_the_warplanning_department_desc: "Maintenant que nous avons suffisamment étendu notre puissance économique et militaire, nous pouvons nous intéresser à l'idée de répandre la révolution à ceux qui en ont le plus besoin."
 USA_red_junta_war_plan_maple_leaf: "Plan de guerre Feuille d'Érable"
 USA_red_junta_war_plan_maple_leaf_desc: "Au sein du Département du Nouveau Monde, rattaché au Département de la Planification de Guerre, l'objectif initial est de sécuriser l'Extrême-Nord afin d'optimiser notre situation stratégique."
 USA_red_junta_war_plan_cartel_cleanup: "Plan de guerre Nettoyage des cartels"
 USA_red_junta_war_plan_cartel_cleanup_desc: "Pour continuer à sécuriser notre position stratégique, la situation ouvertement déstabilisée de notre voisin du sud est une grande préoccupation pour notre sécurité nationale. Sans parler des implications d'un ennemi étranger utilisant le Mexique comme tremplin, les cartels et la nature presque tribale d'une large partie du territoire mexicain sont une raison suffisante pour régler les choses une fois pour toutes."
 USA_red_junta_war_plan_havana: "Plan de guerre La Havane"
 USA_red_junta_war_plan_havana_desc: "L'île de Cuba est la plus grande île de la région des Caraïbes, occupant une position stratégique clé. Non seulement elle est la porte d'entrée du golfe du Mexique, mais elle constitue également une barrière vers l'océan Atlantique plus large. En conséquence, nous devons sécuriser cette île pour en faire le port ultime et un réseau naval qui garantira le commerce et la paix dans l'hémisphère occidental tel que nous le connaissons."
 USA_red_junta_war_plan_homeward_bound: "Plan de guerre Retour au foyer"
 USA_red_junta_war_plan_homeward_bound_desc: "Nous commençons le prochain chapitre de notre grande avancée. En revenant dans l'Ancien Monde et en terminant le travail que nos prédécesseurs n'ont pas pu accomplir, nous répandrons les valeurs du socialisme économique auprès des masses européennes."
 USA_red_junta_war_plan_round_three: "Plan de guerre Troisième Round"
 USA_red_junta_war_plan_round_three_desc: "Deux guerres mondiales et ils n'ont toujours pas appris la leçon. Eh bien, en positif, ce n'est pas leur faute cette fois, c'est juste une question de bonnes affaires."
 USA_red_junta_war_plan_black_back_hand: "Plan de guerre Main Noire"
 USA_red_junta_war_plan_black_back_hand_desc: "La Main Noire était une société secrète fondée sur le nationalisme serbe et la ferveur anti-austro-hongroise. Là où ils ont déclenché une guerre mondiale, nous mettrons fin à la paix balkanique en neutralisant le membre le plus agressif. Après tout, 'là où il y a un Serbe, il y a la Serbie' semble n'être que de l'impérialisme."
 USA_red_junta_war_plan_outback: "Plan de guerre Outback"
 USA_red_junta_war_plan_outback_desc: "Le 'continent' australien n'est qu'un tremplin pour sécuriser la stabilité dans le Pacifique et en Extrême-Orient. En conséquence, nous devons prendre la première étape maintenant, plutôt que plus tard."
 USA_red_junta_war_plan_java: "Plan de guerre Java"
 USA_red_junta_war_plan_java_desc: "L'Indonésie est la plus grande nation basée sur un archipel, créant pratiquement un chemin clair de l'Australie vers la Chine. Nous devons sécuriser cette nation si nous voulons avoir un point de départ approprié pour la bataille finale."
 USA_red_junta_war_plan_great_leap_forward: "Plan de guerre Grand Bond en Avant"
 USA_red_junta_war_plan_great_leap_forward_desc: "Le boss final, la « grande Chine ». Eh bien, elle ne sera plus si grande lorsque nous répandrons le véritable socialisme économique, et non ce totalitarisme pseudo-cultiste aux caractéristiques chinoises. Mao a fait un grand bond en avant pour avancer la nation de Chine ; eh bien, il est temps de faire notre grand bond en avant pour assurer la paix mondiale et le véritable avenir des valeurs socialistes."
 USA_red_junta_war_peace_in_our_time: "La paix de notre temps"
 USA_red_junta_war_peace_in_our_time_desc: "Avec le Nouveau Monde, l'Ancien Monde et l'Extrême-Orient désormais sécurisés, les zones stratégiques et les principales menaces contenues, nous pouvons établir le corps mondial des commissariats pour ramener ces terres à des lieux de vie plus paisibles et réservés. Nous consoliderons les accords de paix mondiaux et tracerons une nouvelle voie pour notre espèce."
 USA_american_trotskist_reindustrialization_priority: "Priorité à la réindustrialisation"
 USA_american_trotskist_reindustrialization_priority_desc: "La nation a perdu sa puissance industrielle, nous devons et allons y remédier pour atteindre nos objectifs."
 USA_american_trotskist_national_economic_revival_act: "Loi sur la relance économique nationale"
 USA_american_trotskist_national_economic_revival_act_desc: "La NERA est une législation pour un programme de dépenses agressif visant à promouvoir l'industrialisation à travers la nation."
 USA_american_trotskist_securing_our_resources: "Sécuriser nos ressources"
 USA_american_trotskist_securing_our_resources_desc: "En limitant le commerce au strict minimum, nous pouvons commencer à créer des chaînes d'approvisionnement nationales plus développées. En conséquence, cela nous permet également d'investir davantage dans les opérations minières pour augmenter le rendement global."
 USA_american_trotskist_national_armaments_expansion_act: "Loi sur l'expansion de l'armement national"
 USA_american_trotskist_national_armaments_expansion_act_desc: "La NAEA est un projet de loi de financement visant à étendre notre base industrielle militaire. Ce facteur essentiel de nos prouesses économiques garantira notre avenir auquel nous sommes destinés."
 USA_american_trotskist_national_naval_industrialization_act: "Loi sur l'industrialisation navale nationale"
 USA_american_trotskist_national_naval_industrialization_act_desc: "La NNIA est un projet de loi de financement ciblé visant à étendre et à améliorer notre base industrielle navale et maritime. Nous devons sécuriser le commerce et les eaux en nous et autour de nous."
 USA_american_trotskist_the_red_army: "L'Armée écarlate"
 USA_american_trotskist_the_red_army_desc: "Nos bannières écarlates flotteront haut, car nos troupes sont entraînées et formées pour être les plus agressives en matière de manœuvres tactiques partout où cela est possible."
 USA_american_trotskist_the_red_navy: "La Marine écarlate"
 USA_american_trotskist_the_red_navy_desc: "En améliorant les moyens de formation et en adaptant les soldats à la compréhension de la cause pour laquelle ils se battent, nous leur inculquerons un sentiment de devoir et de ferveur à se battre là où la plupart des nations échouent. Par conséquent, la réaffectation d'une partie du budget naval à un indicateur de R&D nous permet d'améliorer les systèmes d'armes de nos navires."
 USA_american_trotskist_the_red_airforce: "La Force aérienne écarlate"
 USA_american_trotskist_the_red_airforce_desc: "En investissant dans la R&D liée à nos avions et à leurs systèmes d'armes, nous pouvons améliorer les capacités de combat de notre force aérienne en nous concentrant sur des avantages tactiques agressifs."
 USA_american_trotskist_national_mobilization: "Mobilisation nationale"
 USA_american_trotskist_national_mobilization_desc: "La nation a été raffinée, maintenant nous devons la préparer pour la Grande Lutte."
 USA_american_trotskist_the_commissar_corps: "Le Corps des commissaires"
 USA_american_trotskist_the_commissar_corps_desc: "La création du CAC ou Corps de l'armée des commissaires est un excellent moyen de motiver les dirigeants et les soldats à se lever et à défendre ce que leur vie est faite pour protéger. Leurs familles, leurs maisons et leurs valeurs que nous nous efforçons de chérir au cœur de chacun."
 USA_american_trotskist_the_permanent_revolution: "La Révolution permanente"
 USA_american_trotskist_the_permanent_revolution_desc: "Le sort en est jeté et maintenant nous devons inaugurer un nouvel âge de paix, par la révolution nous assurerons la position mondiale de l'État socialiste et de ses peuples."
 USA_american_trotskist_marching_south: "Marcher vers le Sud"
 USA_american_trotskist_marching_south_desc: "Ainsi les dominos tomberont alors que nous commencerons à libérer le Nouveau Monde et ses tentatives désespérées de « Socialisme », ses autocrates impérialistes et ses bâtards occidentaux pour les gouvernements. Nous nous déplacerons rapidement vers le canal de Panama et serons aux portes du continent sud-américain."
 USA_american_trotskist_workers_paradise: "Paradis des travailleurs"
 USA_american_trotskist_workers_paradise_desc: "L'État socialiste raté de Cuba est une tache sur le socialisme. Les autres sont un mélange de toutous britanniques et français et de simples exploiteurs. Nous les utiliserons pour nous catapulter et encercler lentement le continent du sud à la fois par voie terrestre et maritime."
 USA_american_trotskist_new_world_order: "Nouvel Ordre Mondial"
 USA_american_trotskist_new_world_order_desc: "Alors que nous nous positionnons aux portes de l'Amérique du Sud, nous allons faire irruption par ces portes que nous avons créées et nous allons créer un nouvel ordre dans le nouveau monde. Viva la Revolution !"
 USA_american_trotskist_the_eagle_descends_onto_the_continent: "L'aigle descend sur le continent"
 USA_american_trotskist_the_eagle_descends_onto_the_continent_desc: "Le maillon le plus faible et pourtant le plus riche pour assurer la révolution permanente. L'Afrique est une terre vaste et diversifiée et en tant que telle, nous devons établir un bon secteur de contrôle si nous voulons continuer à assurer la Révolution socialiste mondiale."
 USA_american_trotskist_the_northern_cleanup: "Le nettoyage du Nord"
 USA_american_trotskist_the_northern_cleanup_desc: "Sécuriser la partie nord du continent nous donne accès au Moyen-Orient et à la Méditerranée pour le retour éventuel dans le Vieux Monde."
 USA_american_trotskist_operation_congo_cabal: "Opération Cabale du Congo"
 USA_american_trotskist_operation_congo_cabal_desc: "L'Opération Cabale du Congo est la libération de la région de l'Afrique centrale du contrôle gouvernemental impérialiste, capitaliste et farouchement anti-ouvrier."
 USA_american_trotskist_operation_geographic_horn: "Opération Corne géographique"
 USA_american_trotskist_operation_geographic_horn_desc: "La Corne de l'Afrique, ou simplement l'Afrique de l'Est, nous ouvrira nos influences sur l'Asie et le Pacifique des deux côtés du globe."
 USA_american_trotskist_operation_capetown: "Opération Capetown"
 USA_american_trotskist_operation_capetown_desc: "Avec le Nouveau Monde sécurisé, nous avons maintenant la chance de sécuriser les deux tiers de l'accès au pôle sud. Cette sécurisation nous permettra d'empêcher les missions étrangères et nous donnera plus de portée pour mener nos propres missions et probablement explorer pour des ressources naturelles."
 USA_american_trotskist_operation_old_world: "Opération Vieux Monde"
 USA_american_trotskist_operation_old_world_desc: "En sécurisant les derniers morceaux du Nouveau Monde, nous amenons également potentiellement le Vieux Monde, nous devons donc être proactifs et établir une base d'où est issue la sphère anglo-saxonne de notre héritage."
 USA_american_trotskist_operation_norse: "Opération Norse"
 USA_american_trotskist_operation_norse_desc: "Depuis notre pied-à-terre sur les îles celtiques, nous pouvons poursuivre notre grande expédition nordique et libérer les nations scandinaves."
 USA_american_trotskist_operation_west_has_fallen: "Opération L'Ouest est tombé"
 USA_american_trotskist_operation_west_has_fallen_desc: "Depuis notre pied-à-terre sur les îles, nous pouvons maintenant établir une emprise claire sur le continent avec les nations les plus occidentales. La libération du vieux monde sera rapide et juste."
 USA_american_trotskist_operation_black_sea: "Opération Mer Noire"
 USA_american_trotskist_operation_black_sea_desc: "Depuis le grand nord, nous descendrons et créerons un mur de libération qui divisera l'autocratie perpétuelle de l'État russe et le reste de l'Europe que nous libérerons."
 USA_american_trotskist_operation_vistula: "Opération Vistule"
 USA_american_trotskist_operation_vistula_desc: "Aujourd'hui commence notre marche vers l'est alors que nous commençons à libérer le cœur du Vieux Monde. Des « démocraties » oligarchiques aux exploiteurs capitalistes, nous libérerons les peuples du vieux monde un par un."
 USA_american_trotskist_operation_cradle: "Opération Berceau"
 USA_american_trotskist_operation_cradle_desc: "Le berceau de la civilisation et pourtant il est rempli de certains des peuples et des gouvernements les plus destructeurs. Eh bien, plus maintenant, nous allons libérer et apporter la vraie civilisation aux travailleurs de ces terres et créer un nouvel avenir. Un avenir lumineux et écarlate pour tous."
 USA_american_trotskist_operation_sarajevo: "Opération Sarajevo"
 USA_american_trotskist_operation_sarajevo_desc: "Une guerre mondiale a commencé dans les Balkans, eh bien maintenant nous avons l'intention de libérer et d'empêcher d'autres morts et destructions inutiles."
 USA_american_trotskist_operation_caging_the_bear: "Opération Enfermer l'Ours"
 USA_american_trotskist_operation_caging_the_bear_desc: "L'État russe, autrefois l'Union des Républiques Socialistes Soviétiques, est un échec et une tache sur le nom socialiste. Nous libérerons ses peuples, enfermerons les autocrates et les exploiteurs capitalistes et effacerons la tache de la surface de la planète."
 USA_american_trotskist_operation_himalayas: "Opération Himalaya"
 USA_american_trotskist_operation_himalayas_desc: "Avec la porte nord sécurisée, nous pouvons maintenant créer la porte sud. De là, nous nous préparerons pour l'obstacle final qui empêche la libération mondiale."
 USA_american_trotskist_operation_great_leap_forward: "Opération Grand Bond en avant"
 USA_american_trotskist_operation_great_leap_forward_desc: "Le boss final et ses sbires et/ou quêtes secondaires. La République populaire de Chine est la plus grande tache à avoir atteint le mot socialisme après l'échec qu'a été l'Union soviétique. Nous libérerons et devons libérer ses terres et son peuple si nous voulons jamais achever correctement une révolution mondiale. Après ce « boss final », plus rien ne se dresse sur notre chemin vers le véritable communisme et la paix et la prospérité mondiales. D'ici, seules les étoiles sont la limite."
 USA_not_have_republicans_in_charge_TT: "§Y[conservatism_L]§! n'est pas le parti au pouvoir"
 USA_not_have_democrats_in_charge_TT: "§Y[liberalism_L]§! n'est pas le parti au pouvoir"
 USA_idea_light_infantry_dominance: "Dominance de l'Infanterie Légère"
 USA_idea_light_infantry_dominance_desc: "Peu coûteuse à entretenir et à équiper, flexible dans sa capacité à être entraînée et armée, l'infanterie légère est la pierre angulaire de la guerre moderne, qui semble être le maillon faible. Nous allons faire en sorte que ce maillon devienne le chef de meute, en apportant des innovations dans l'organisation des unités, la logistique, ainsi que de nouvelles armes pour toute situation. Nous serons victorieux à cet égard."
 USA_idea_mobile_infantry_doctrine: "Doctrine d'Infanterie Mobile"
 USA_idea_mobile_infantry_doctrine_desc: "L'utilisation de la mobilité des véhicules utilitaires et des véhicules de transport légers, ainsi que la polyvalence d'armer le simple soldat avec ce qu'exige le champ de bataille moderne, garantit une armée de l'avenir complète et flexible."
 USA_idea_armored_infantry_supremacy: "Suprématie de l'infanterie blindée"
 USA_idea_armored_infantry_supremacy_desc: "Les chars sont coûteux, tant à développer qu'à déployer et à risquer de perdre sur le champ de bataille. Mais que se passerait-il si le soldat à pied moyen était un char, ou du moins si l'escouade d'infanterie moyenne était une sorte de 'char' ?"
 USA_idea_repurposing_armored_programs: "Directive de Réaffectation des Programmes Blindés"
 USA_idea_repurposing_armored_programs_desc: "La directive DRP est un arrêt de toute production de chars pour commencer le réoutillage de la fabrication et de l'organisation militaire autour des véhicules blindés plus légers et de l'unité d'infanterie standard."
 USA_idea_tank_rehabilitation_programs: "Programmes de réhabilitation de chars"
 USA_idea_tank_rehabilitation_programs_desc: "Les PRT sont conçus pour affiner et rendre plus efficace la production et l'utilisation des chars et des unités blindées lourdes dans leur ensemble. Au prix d'une réduction des véhicules plus légers, notre force de chars sera le compagnon fidèle de notre infanterie."
 USA_idea_revitalized_artillery_innovations: "Innovations en Artillerie Revitalisées"
 USA_idea_revitalized_artillery_innovations_desc: "Grâce à des investissements et des programmes de R&D dédiés, notre artillerie deviendra la quintessence de l'ancien fait nouveau et dominera le champ de bataille moderne."
 USA_idea_light_vehicle_innovations: "Innovations en Véhicules Légers"
 USA_idea_light_vehicle_innovations_desc: "L'initiative IVL vise à concentrer davantage la R&D sur le développement et le façonnage de véhicules blindés plus légers comme les VCI et les VTT, afin qu'ils soient plus flexibles et adaptables. Cela signifie que notre force de chars deviendra plus une force spéciale qu'une branche significative de l'armée."
 USA_idea_tank_innovations: "Innovations en matière de chars"
 USA_idea_tank_innovations_desc: "Concentrer le financement sur les chars et leurs équivalents nous permet de créer une force polyvalente de puissance et de punch."
 USA_idea_mass_motorization_efforts: "Efforts de Motorisation de Masse"
 USA_idea_mass_motorization_efforts_desc: "Grâce à la standardisation et à une concentration accrue des efforts, nous pouvons maintenant transformer notre armée en une force véritablement mobile."
 USA_idea_defensive_artillery_program: "Programme d'artillerie défensive"
 USA_idea_defensive_artillery_program_desc: "Un programme de R&D conçu pour la survie des pièces d'artillerie et, surtout, de leurs équipages, en visant l'influence et l'efficacité sur le champ de bataille. Cela inclut des éléments comme la fabrication d'équipements, la portée effective depuis l'action en première ligne et la facilité de manœuvrabilité."
 USA_idea_offensive_artillery_program: "Programme d'Artillerie Offensive"
 USA_idea_offensive_artillery_program_desc: "Le PAO est un programme de R&D axé sur la survie par des moyens offensifs. La guerre moderne est en mouvement constant, et il en va de même pour l'artillerie. Les unités d'artillerie automotrice modernes seront l'épine dorsale de la manœuvrabilité et de la survie grâce à la recherche de nouvelles innovations en matière de blindage et de moteurs, pour aider non seulement le « canon de verre » de notre armée, mais aussi, par extension, le reste de nos forces motorisées."
 USA_idea_maneuver_logistics: "Logistique de Manœuvre"
 USA_idea_maneuver_logistics_desc: "En créant des réseaux d'approvisionnement et de logistique plus mobiles, nous pouvons mieux décentraliser et répondre aux besoins de notre armée sur un champ de bataille en constante évolution."
 USA_idea_defense_support_force: "Force de soutien à la défense en première ligne"
 USA_idea_defense_support_force_desc: "SFDP, la nouvelle désignation et rôle de combat de la sous-branche des forces spéciales au sein de la branche de service de l'armée américaine. Conçue pour aider et soutenir les positions défensives et les encerclements potentiels des forces alliées partout et à tout moment, par tous les moyens disponibles pour les forces."
 USA_idea_precision_strike_force: "Force de Frappe de Précision"
 USA_idea_precision_strike_force_desc: "En équipant nos unités FSP avec le meilleur matériel et en leur offrant un entraînement de pointe, nous établissons une norme en matière de frappe et d'exécution de la force."
 USA_idea_steamlining_naval_production: "Rationalisation de la Production Navale"
 USA_idea_steamlining_naval_production_desc: "Grâce au réoutillage et au dévouement, nous pouvons mieux adapter et rationaliser la production, le réaménagement ainsi que la réparation de nos navires et les envoyer là où ils doivent être."
 USA_idea_frigate_fighter_groups: "Groupes de Chasseurs de Frégates"
 USA_idea_frigate_fighter_groups_desc: "La frégate sera notre épine dorsale ; nous devons donc la soutenir avec le soin et les ressources nécessaires pour la rendre la plus solide possible."
 USA_idea_corvette_combat_prowess: "Prouesse au combat des corvettes"
 USA_idea_corvette_combat_prowess_desc: "Corvettes : agiles, rapides et modulaires. Ce sont les attributs pour faire d'un océan d'acier une force ayant les capacités de combat d'un groupe de porte-avions moderne. En conséquence, nous adapterons, investirons et développerons l'utilisation de nos corvettes actuelles et futures pour créer la meilleure marine du monde, deux fois plus forte."
 USA_idea_attack_fleet_investments: "Investissements dans la flotte d'attaque"
 USA_idea_attack_fleet_investments_desc: "Nous les ferons exploser hors de l'eau avant même qu'ils ne sachent ce qui les a frappés, capiche !"
 USA_idea_missile_fleet_investments: "Investissements dans la Flotte de Missiles"
 USA_idea_missile_fleet_investments_desc: "Capitaine, un iceberg à l'horizon ! « Eh bien, faites-le exploser »."
 USA_idea_mobile_airports_program: "Programme d'Aéroports Mobiles"
 USA_idea_mobile_airports_program_desc: "Le PAM est un programme de R&D dédié pour rendre nos porte-avions essentiellement comme une voiture de clown : plus nous pouvons y entasser de choses, plus nous pouvons faire de dégâts."
 USA_idea_project_gunship: "Projet Hélicoptère d'Attaque"
 USA_idea_project_gunship_desc: "Agile et mortel, c'est comme ça que je l'aime."
 USA_idea_modern_marine_corps: "Un Corps de Marines Moderne"
 USA_idea_modern_marine_corps_desc: "Même chose, jour différent, de nouveaux jouets sophistiqués pour briser l'esprit des ennemis... et leurs visages aussi."
 USA_idea_brothers_in_arms: "Frères d'armes"
 USA_idea_brothers_in_arms_desc: "Marine ou Armée, ce sont tous des soldats pour l'Oncle Sam. Cependant, le Corps des Marines pourrait aider à entraîner et améliorer l'armée, créant ainsi une force unifiée et combinée capable de secouer n'importe quel champ de bataille où elle se présente."
 USA_idea_project_modular: "Projet Modulaire"
 USA_idea_project_modular_desc: "Bienvenue chez « Crée ton Avion », où vous pouvez concevoir votre aéronef sur mesure, à votre guise."
 USA_idea_aia_phase_one: "Phase un de l'AIA"
 USA_idea_aia_phase_one_desc: "Les développements de l'American Institute for Avionics commencent à porter leurs fruits, bien que ce type de R&D soit coûteux, les résultats sont indéniables."
 USA_idea_aia_phase_two: "Phase deux de l'AIA"
 USA_idea_aia_phase_two_desc: "Les efforts se multiplient alors que de nouvelles avancées de l'American Institute for Avionics se sont étendues aux efforts de soutien au sol."
 USA_idea_aia_phase_three: "Phase trois de l'AIA 'Albatros'"
 USA_idea_aia_phase_three_desc: "Des recherches agressives et des études sur les tolérances des équipages et des équipements, ainsi que des améliorations sur les grands aéronefs, nous ont donné des résultats dont nous n'aurions jamais rêvé. Désormais, notre force aérienne domine les cieux comme aucune autre."
 USA_idea_paratrooper_corps: "Corps de Parachutistes"
 USA_idea_paratrooper_corps_desc: "Des améliorations de la formation et une spécialisation accrue au sein de l'armée affineront, définiront et augmenteront les capacités de nos parachutistes."
 USA_idea_army_air_enhancements: "Améliorations de l'armée et de l'air"
 USA_idea_army_air_enhancements_desc: "En utilisant des intégrations d'équipements et de formations, nous pouvons améliorer les capacités de notre armée et apporter une amélioration générale pour maintenir nos soldats inégalés."
 USA_idea_army_centric_officer_corps_training: "Formation du corps des officiers axée sur l'armée"
 USA_idea_army_centric_officer_corps_training_desc: "Consacrer les programmes de formation et les exigences d'avancement aux besoins et connaissances de l'armée signifie que nos capacités de commandement et de contrôle influenceront grandement les capacités de nos forces terrestres à l'avenir."
 USA_idea_navy_centric_officer_corps_training: "Corps d'Officiers Centré sur la Marine"
 USA_idea_navy_centric_officer_corps_training_desc: "Consacrer les programmes de formation et les exigences d'avancement aux besoins et aux connaissances de la marine. Cela signifie que nos capacités de C&C (commandement et contrôle) influenceront grandement les capacités de nos forces navales à l'avenir."
 USA_idea_air_centric_officer_corps_training: "Formation du corps des officiers axée sur l'air"
 USA_idea_air_centric_officer_corps_training_desc: "Consacrer les programmes de formation et les exigences d'avancement aux besoins et connaissances de la force aérienne signifie que nos capacités de commandement et de contrôle influenceront grandement les capacités de notre force aérienne à l'avenir."
 american_militarism_reformed: "Militarisme américain réformé"
 american_militarism_reformed_desc: "Grâce à des efforts inlassables, nous avons réformé, amélioré et répondu aux besoins de toutes nos forces armées. En posant les bases du nouveau millénaire, nous pouvons maintenant regarder les mers bleues scintillantes et les cieux ensoleillés et dire sans aucun doute : Haec pax Americana."
 USA_idea_military_junta_cultural_programs: "Programmes Culturels"
 USA_idea_military_junta_cultural_programs_desc: "En promouvant l'unité et l'uniformité entre les espèces, nous établissons un nouveau précédent de ce que signifie être uni."
 USA_idea_fascist_extra_territorial_corps: "Corps extraterritorial"
 USA_idea_fascist_extra_territorial_corps_desc: "Les forces de réserve de l'État américain qui nous permettent de nous occuper méticuleusement de nos nouveaux territoires pour contrer les acteurs anti-étatiques et autres dissidents."
 USA_idea_fascist_hemispheric_garrison_command: "Commandement de la garnison hémisphérique"
 USA_idea_fascist_hemispheric_garrison_command_desc: "Le CGH est une branche de réserve du commandement et du contrôle des garnisons et du maintien de l'ordre public dans l'hémisphère Ouest. Il est considéré comme une sous-branche de l'armée, mais en raison de son envergure, il est officiellement reconnu comme une branche indépendante des forces armées."
 USA_idea_hemispheric_economic_program: "Programme Économique Hémisphérique"
 USA_idea_hemispheric_economic_program_desc: "Le PEH est un programme d'aide mutuelle économique à l'échelle de l'hémisphère, conçu pour aider à développer les infrastructures et la connectivité avec les nouvelles nations de l'hémisphère Ouest."
 USA_idea_public_unity_programs: "Programmes d'Unité Publique"
 USA_idea_public_unity_programs_desc: "Les programmes d'aide mutuelle et d'unité conçus pour forger la coopération publique ainsi que pour ouvrir la voie à une nouvelle identité du Nouveau Monde."
 USA_idea_the_new_world_economic_exchange: "Nouvel échange économique mondial"
 USA_idea_the_new_world_economic_exchange_desc: "Le NEM est un programme de coopération continu et amélioré, conçu pour aider les efforts de développement et consolider les fondations de l'identité du Nouveau Monde."
 USA_idea_monarchist_puppet_partner: "Partenaire Pantin"
 USA_idea_monarchist_puppet_partner_desc: "Nous avons accepté les termes américains, donc on nous a accordé quelques libertés."
 USA_idea_red_junta_global_commissariat_corps: "Corps du Commissariat Mondial"
 USA_idea_red_junta_global_commissariat_corps_desc: "La stabilité et la paix futures sont entre vos mains, camarades. Vous devez défendre et préserver les vies paisibles et bienveillantes que ces peuples ont autrefois vécues. Montrez-leur que l'avenir est radieux et aidez à ramener l'ordre et la loi dans ces contrées."
 USA_idea_trotskyist_permanent_revolution: "Révolution permanente"
 USA_idea_trotskyist_permanent_revolution_desc: "Les ennemis de notre société, de notre mode de vie, de notre âme même sont tout autour de nous. Camarades, nous devons nous rallier et défendre ce qui nous est cher : la famille, le pays, le foyer. Pour la Révolution !"
 USA_crisis_event.8.t: "Envie d'imploser ?"
 USA_crisis_event.8.d: "L'option d'effondrement « forcé » de 2067 était une prédiction semi-sérieuse que j'avais faite avec un groupe d'amis en décembre 2017, au plus fort de la période où tout le monde qui avait une voix forte répandait la peur d'une « 2e guerre civile américaine ». J'ai donc fait une prédiction semi-sérieuse en déclarant que, je cite : « Si nous continuons la tendance autodestructrice à nous battre pour tout ce pour quoi nous pensons que nous devrions nous battre, plutôt que pour ce dont nous devrions réellement discuter. Alors je crains sincèrement que dans les 50 prochaines années, nous ne voyions pas d'États « Unis ». Comme presque personne n'a jamais joué aussi loin, l'option 2067 a été initialement ajoutée comme un œuf de Pâques, mais maintenant que la base de joueurs générale se rapproche de l'année de jeu, cela doit être une option maintenant. Alors choisissez votre destin."
 USA_crisis_event.8.o1: "Ce n'est pas notre heure"
 USA_crisis_event.8.o2: "Brûlez cette salope, recommencez à zéro"
 USA_collapse_event.3000.t: "Les États-Unis pas si unis ?"
 USA_collapse_event.3000.d: "Avec la toute première grève nationale des chemins de fer de l'ère moderne que le gouvernement fédéral n'a pas pu maîtriser. Les responsables américains se démènent pour parvenir à un accord de paix entre les six grandes sociétés de chemin de fer et les principaux syndicats. Beaucoup d'Américains espèrent que les choses reviendront à la normale, car les pénuries d'approvisionnement et les augmentations de prix ont déjà commencé à frapper presque tous les aspects de l'économie américaine."
 USA_collapse_event.3000.o1: "Calmez-vous, tout le monde. S'il vous plaît"
 USA_collapse_event.3000.o2: "Mon Dieu, qu'est-ce qui se passe ?"
 USA_collapse_event.3001.t: "La chute de l'Aigle"
 USA_collapse_event.3001.d: "Dans un revirement choquant, les sources sont rares mais il semble que l'ordre civil se soit effondré aux États-Unis. La grève nationale prolongée des chemins de fer a entraîné des augmentations massives des prix et des pénuries d'approvisionnement qui ont provoqué des émeutes dans tout le pays. Les responsables des gouvernements locaux ont fait de leur mieux pour coordonner la police et les éléments de la garde nationale pour assurer l'ordre public. Cependant, à mesure que les États les plus peuplés ont commencé à exiger plus de ressources pour faire face, de plus en plus de premiers intervenants ont été débordés par le chaos croissant. C'est un jour sombre alors que l'Aigle tombe du point le plus élevé que presque toutes les nations aient vu. L'équilibre du pouvoir dans le monde sera changé à jamais alors qu'un immense vide de pouvoir est créé dans le sillage des événements."
 USA_collapse_event.3001.o1: "Mon Dieu, où nous sommes-nous trompés !"
 USA_collapse_event.3001.o2: "Putain de merde... Qu'est-ce qu'on fait maintenant ?"
 USA_collapse_event.3001.o3: "Merde, et maintenant ?"
 USA_foreign_event.13.o2: "Pas maintenant"
 USA_monarchist_event.1.t: "L'Union du Nord"
 USA_monarchist_event.1.d: "Nous offrirons au Canada notre protection directe et une indépendance continue en termes d'économie et d'affaires internes. Cependant, l'inconvénient est qu'ils deviennent un dominion de notre part et doivent renoncer à l'autorité anglaise pour une combinaison d'autorité américaine et canadienne. Le Canada deviendra le Royaume du Canada."
 USA_monarchist_event.1.o1: "Ils doivent accepter"
 USA_monarchist_event.2.t: "La 'demande' américaine"
 USA_monarchist_event.2.d: "Les Américains nous ont fait une offre intéressante. Nous pouvons les rejoindre en tant que sujet et devenir notre propre royaume, dans une situation similaire à celle que nous avions en tant que dominion sous les Britanniques. Cependant, il semble que l'argument principal soit que nous serons un État pratiquement indépendant, mais plus aligné sur les intérêts de l'hémisphère occidental que sur les intérêts purement canadiens."
 USA_monarchist_event.2.o1: "Nous faisons pratiquement ça déjà dans une certaine mesure"
 USA_monarchist_event.2.o2: "Nous l'avons fait une fois, plus jamais"
 USA_monarchist_event.2000.t: "Le Canada accepte"
 USA_monarchist_event.2000.d: "Nous avons fait du bon travail et, en conséquence, les Canadiens ont décidé de nous rejoindre sur la voie de l'unité hémisphérique."
 USA_monarchist_event.2000.o1: "Dieu sauve le Nouveau Monde !"
 USA_monarchist_event.20000.t: "Le Royaume"
 USA_monarchist_event.20000.d: "Nous avons reçu le feu vert pour le changement de nom national."
 USA_monarchist_event.20000.o1: "Dieu bénisse le Canada"
 USA_monarchist_event.2001.t: "Le Canada refuse"
 USA_monarchist_event.2001.d: "Malheureusement, nous n'avons pas été assez rapides pour les convaincre de nos intentions sincères. Compte tenu de nos principes, nous ne pouvons pas forcer les choses sur ce point. Nous devrons essayer autre chose."
 USA_monarchist_event.2001.o1: "Mais je pensais que nous étions frères..."
 USA_monarchist_event.3.t: "L'Union du Sud"
 USA_monarchist_event.3.d: "Nous offrirons au Mexique notre protection directe et une indépendance continue en termes d'économie et d'affaires internes. Cependant, l'inconvénient est qu'ils deviennent un dominion de notre part et seront autorisés à renommer leur nation en Royaume du Mexique."
 USA_monarchist_event.3.o1: "Espérons qu'ils verront raison"
 USA_monarchist_event.4.t: "L'offre américaine"
 USA_monarchist_event.4.d: "Les Américains nous ont envoyé une offre. En devenant leur sujet, en grande partie indépendant, ils chercheront à aider à stabiliser la campagne en collaboration avec les forces locales. Par conséquent, nous recevrons le feu vert pour nous appeler le Royaume du Mexique et nous pourrons nous concentrer davantage sur le pays et l'hémisphère occidental plutôt que sur les marchés mondiaux. Cela pourrait être bénéfique, mais est-ce vraiment ce que nous voulons ?"
 USA_monarchist_event.4.o1: "Eh bien, nous n'aurons plus à nous soucier de la frontière"
 USA_monarchist_event.4.o2: "Ils nous ont causé assez de problèmes. Hors de question."
 USA_monarchist_event.4000.t: "Le Mexique accepte"
 USA_monarchist_event.4000.d: "Une autre négociation réussie a été conclue et maintenant nous commencerons la logistique pour entamer cette grande union des peuples."
 USA_monarchist_event.4000.o1: "Unis, nous tenons"
 USA_monarchist_event.40000.t: "Le Royaume"
 USA_monarchist_event.40000.d: "Nous avons reçu le feu vert, nous revenons maintenant aux anciennes gloires et traçons une nouvelle voie pour unifier l'hémisphère."
 USA_monarchist_event.40000.o1: "Dieu bénisse le Nouveau Monde !"
 USA_monarchist_event.4001.t: "Le Mexique refuse"
 USA_monarchist_event.4001.d: "Les négociations ont échoué, nous devrons réévaluer la situation si nous voulons faire quelque chose de significatif dans un avenir proche."
 USA_monarchist_event.4001.o1: "Où nous sommes-nous trompés ?"
 USA_monarchist_event.5.t: "L'accord de fédération"
 USA_monarchist_event.5.d: "Nous espérons changer la fortune de la nation insulaire de Cuba. Nous pouvons leur offrir des protections ainsi que leur donner le feu vert pour la consolidation de la région caraïbe en ce qui sera appelé les « Duchés fédérés des Indes occidentales ». Ou simplement le duché des Indes occidentales. Notre histoire est longue et intéressante, c'est le moins qu'on puisse dire ; cependant, je pense que nous pouvons faire quelque chose pour les aider."
 USA_monarchist_event.5.o1: "Le passé est le passé, maintenant faisons l'avenir"
 USA_monarchist_event.6.t: "L'accord américain"
 USA_monarchist_event.6.d: "Les Américains sont venus vers nous avec un accord. En échange d'être leur sujet, nous aurons à peu près un statut d'autonomie similaire, mais le commerce sera centré sur le bénéfice des nations de l'hémisphère occidental plutôt que des globales, pour ainsi dire. En prime, les Américains nous donneront le feu vert pour consolider les Caraïbes."
 USA_monarchist_event.6.o1: "On ne peut pas obtenir mieux tout seuls"
 USA_monarchist_event.6.o2: "Ils nous ont déjà trahis avant, hors de question !"
 USA_monarchist_event.6000.t: "Cuba accepte"
 USA_monarchist_event.6000.d: "Un autre pas vers l'unité hémisphérique."
 USA_monarchist_event.6000.o1: "Dieu bénisse le Nouveau Monde !"
 USA_monarchist_event.60000.t: "La Fédération"
 USA_monarchist_event.60000.d: "Nous avons reçu le feu vert pour le nom national, bientôt notre nom deviendra connu alors que nous créons notre nouvel avenir uni avec nos frères et sœurs de l'hémisphère occidental."
 USA_monarchist_event.60000.o1: "Dieu bénisse la Fédération Ducale des Antilles !"
 USA_monarchist_event.6001.t: "Cuba refuse"
 USA_monarchist_event.6001.d: "Nous devons vraiment comprendre ce qui n'a pas fonctionné... certes, l'animosité historique a causé pire, donc nous devrions commencer par là."
 USA_monarchist_event.6001.o1: "Retour à la planche à dessin"
 USA_monarchist_event.7.t: "L'offre centraméricaine"
 USA_monarchist_event.7.d: "En commençant par le Panama, nous espérons créer une nouvelle union de nations et raviver l'ancienne entité politique centraméricaine qui existait autrefois. Ce sera difficile, mais si nous commençons par le Panama et les aidons simplement avec des projets d'infrastructure et de développement doux, nous pourrions poser une autre pièce de notre unité hémisphérique."
 USA_monarchist_event.7.o1: "À un demain plein d'espoir"
 USA_monarchist_event.8.t: "La proposition américaine"
 USA_monarchist_event.8.d: "En échange de devenir leur sujet, nous sommes assurés de consolider les États centraméricains dans un avenir proche. En prime, l'Amérique est prête à aider avec les problèmes de développement et à préserver la nouvelle union tant que nous nous concentrons davantage sur l'aide à l'hémisphère occidental par rapport aux autres options."
 USA_monarchist_event.8.o1: "Pas mal, je suis partant"
 USA_monarchist_event.8.o2: "Nous apprécions notre canal sans entraves, non merci"
 USA_monarchist_event.8000.t: "Le Panama accepte"
 USA_monarchist_event.8000.d: "Un autre pas dans la direction unie, maintenant nous pouvons commencer les préparatifs pour permettre au Panama d'unir la région centraméricaine."
 USA_monarchist_event.8000.o1: "Dieu bénisse le Nouveau Monde !"
 USA_monarchist_event.80000.t: "Principautés Unies"
 USA_monarchist_event.80000.d: "Nous avons reçu le feu vert et finalisé les démarches nécessaires. Maintenant, nous pouvons renommer la nation et commencer le vrai travail."
 USA_monarchist_event.80000.o1: "Pour une Amérique centrale unie !"
 USA_monarchist_event.8001.t: "Le Panama refuse"
 USA_monarchist_event.8001.d: "Eh bien, ça fait mal, mais nous ne pouvons pas faire grand-chose à ce stade. Nous devrons réapprocher et essayer autre chose."
 USA_monarchist_event.8001.o1: "Nous les aurons un jour."
 USA_monarchist_event.9.t: "Le continent sud uni"
 USA_monarchist_event.9.d: "Nous commencerons les négociations avec la Colombie et raviverons l'ancien Royaume de Grande Colombie. Cette renaissance d'une ancienne entité politique englobera à peu près la moitié nord du continent sud-américain et sera, espérons-le, une offre suffisamment attrayante pour commencer à travailler avec nous."
 USA_monarchist_event.9.o1: "On y va"
 USA_monarchist_event.10.t: "La proposition américaine"
 USA_monarchist_event.10.d: "En devenant un sujet américain, nous recevrons le feu vert pour consolider la partie nord du continent. On nous a également dit qu'ils aideront à solidifier le Royaume de Grande Colombie, ce qui est un joli bonus. La question est : pouvons-nous vraiment faire confiance aux Américains ?"
 USA_monarchist_event.10.o1: "Aux anciennes gloires"
 USA_monarchist_event.10.o2: "Je ne pense pas"
 USA_monarchist_event.10000.t: "La Colombie accepte"
 USA_monarchist_event.10000.d: "Les négociations ont été un succès et nous commençons maintenant à avancer vers une nouvelle étape d'unité hémisphérique."
 USA_monarchist_event.10000.o1: "Dieu bénisse le Nouveau Monde"
 USA_monarchist_event.100000.t: "Le Royaume"
 USA_monarchist_event.100000.d: "Nous avons reçu le feu vert pour nous renommer, et nous commencerons maintenant à prendre des mesures pour préparer notre avenir, un avenir bientôt uni pour l'hémisphère occidental."
 USA_monarchist_event.100000.o1: "En avant vers la victoire"
 USA_monarchist_event.10001.t: "La Colombie refuse"
 USA_monarchist_event.10001.d: "C'est encore un obstacle à un avenir véritablement meilleur. Nous devrons trouver une solution et essayer autre chose à l'avenir."
 USA_monarchist_event.10001.o1: "Pourquoi ne comprennent-ils pas ?"
 USA_monarchist_event.11.t: "L'accord amazonien"
 USA_monarchist_event.11.d: "Pour aider à finaliser notre initiative d'unité hémisphérique, nous inviterons le Brésil à nous rejoindre et, en échange, ils pourront consolider leur position à travers la moitié sud du continent."
 USA_monarchist_event.11.o1: "Ils seront grands, mais il n'y a rien là-bas au moins"
 USA_monarchist_event.12.t: "L'accord américain"
 USA_monarchist_event.12.d: "En échange d'être leur sujet et d'aligner les politiques commerciales pour être plus mutuellement bénéfiques pour la nation de l'hémisphère occidental, nous pouvons consolider et développer notre nation en acquérant la moitié sud du continent. Ce n'est pas un mauvais marché, cependant cela nous place sous la coupe des Américains."
 USA_monarchist_event.12.o1: "Ce que nous gagnons maintenant nous aidera plus tard"
 USA_monarchist_event.12.o2: "Pas worth le risque"
 USA_monarchist_event.12000.t: "Le Brésil accepte"
 USA_monarchist_event.12000.d: "Le grand royaume du sud a accepté, et ainsi l'une des plus grandes étapes vers notre avenir commun a été franchie. Allons de l'avant et créons un avenir nouveau, un avenir meilleur. Un avenir uni."
 USA_monarchist_event.12000.o1: "Gloire au Nouveau Monde !"
 USA_monarchist_event.120000.t: "Le Nouveau Royaume"
 USA_monarchist_event.120000.d: "Nous avons finalisé tous les préparatifs nécessaires et nous sommes à nouveau un grand royaume. Travaillons avec nos nouveaux alliés pour solidifier et créer un hémisphère nouveau et uni. L'ère de l'unité commence."
 USA_monarchist_event.120000.o1: "Ensemble pour la victoire, nous marchons !"
 USA_monarchist_event.12001.t: "Le Brésil refuse"
 USA_monarchist_event.12001.d: "C'est un revers majeur, il faudra un temps considérable pour réapprocher et intégrer le Brésil dans le giron."
 USA_monarchist_event.12001.o1: "Personne n'écoute, je le jure"
 USA_monarchist_event.13.t: "Opération Gains Initiaux"
 USA_monarchist_event.13.d: "L'avenir commence maintenant et nous avons reçu le feu vert pour commencer nos efforts de consolidation. Les gains initiaux se concentreront sur les îles voisines des Bahamas et de la Jamaïque."
 USA_monarchist_event.13.o1: "Nous marchons !"
 USA_monarchist_event.14.t: "Opération Gains Initiaux"
 USA_monarchist_event.14.d: "L'avenir commence maintenant et nous avons reçu le feu vert pour commencer nos efforts de consolidation. Les gains initiaux se concentreront sur les nations voisines du Costa Rica et du Nicaragua."
 USA_monarchist_event.14.o1: "Nous marchons !"
 USA_monarchist_event.15.t: "Opération Gains Initiaux"
 USA_monarchist_event.15.d: "L'avenir commence maintenant et nous avons reçu le feu vert pour commencer nos efforts de consolidation. Les gains initiaux se concentreront sur les nations orientales du Venezuela, du Guyana et du Suriname."
 USA_monarchist_event.15.o1: "Nous marchons !"
 USA_monarchist_event.16.t: "Opération Gains Initiaux"
 USA_monarchist_event.16.d: "L'avenir commence maintenant et nous avons reçu le feu vert pour commencer nos efforts de consolidation. Les gains initiaux se concentreront sur les nations méridionales de l'Uruguay, du Paraguay et de la Bolivie."
 USA_monarchist_event.16.o1: "Nous marchons !"
 USA_monarchist_event.17.t: "Programme économique mutuel"
 USA_monarchist_event.17.d: "Aujourd'hui commence une nouvelle voie à suivre, alors que nous commençons à nous développer et à nous entraider, nous construirons un avenir plus lumineux et meilleur ensemble."
 USA_monarchist_event.17.o1: "Vers le progrès !"
 USA_monarchist_event.18.t: "Programme économique mutuel"
 USA_monarchist_event.18.d: "Aujourd'hui commence une nouvelle voie à suivre, alors que nous commençons à nous développer et à nous entraider, nous construirons un avenir plus lumineux et meilleur ensemble."
 USA_monarchist_event.18.o1: "Vers le progrès !"
 USA_monarchist_event.19.t: "Programme économique mutuel"
 USA_monarchist_event.19.d: "Aujourd'hui commence une nouvelle voie à suivre, alors que nous commençons à nous développer et à nous entraider, nous construirons un avenir plus lumineux et meilleur ensemble."
 USA_monarchist_event.19.o1: "Vers le progrès !"
 USA_monarchist_event.20.t: "Programme économique mutuel"
 USA_monarchist_event.20.d: "Aujourd'hui commence une nouvelle voie à suivre, alors que nous commençons à nous développer et à nous entraider, nous construirons un avenir plus lumineux et meilleur ensemble."
 USA_monarchist_event.20.o1: "Vers le progrès !"
 USA_monarchist_event.21.t: "Programmes d'unité publique"
 USA_monarchist_event.21.d: "Aujourd'hui, nous commençons à déployer de nouveaux programmes d'unité publique, ces programmes sont conçus pour favoriser une nouvelle identité du Nouveau Monde. De là, nous irons vers les étoiles avec nos efforts unis. Unis, nous tenons ; divisés, nous serions tombés."
 USA_monarchist_event.21.o1: "Nous sommes les gens du Nouveau Monde !"
 USA_monarchist_event.22.t: "Programmes d'unité publique"
 USA_monarchist_event.22.d: "Aujourd'hui, nous commençons à déployer de nouveaux programmes d'unité publique, ces programmes sont conçus pour favoriser une nouvelle identité du Nouveau Monde. De là, nous irons vers les étoiles avec nos efforts unis. Unis, nous tenons ; divisés, nous serions tombés."
 USA_monarchist_event.22.o1: "Nous sommes les gens du Nouveau Monde !"
 USA_monarchist_event.23.t: "Programmes d'unité publique"
 USA_monarchist_event.23.d: "Aujourd'hui, nous commençons à déployer de nouveaux programmes d'unité publique, ces programmes sont conçus pour favoriser une nouvelle identité du Nouveau Monde. De là, nous irons vers les étoiles avec nos efforts unis. Unis, nous tenons ; divisés, nous serions tombés."
 USA_monarchist_event.23.o1: "Nous sommes les gens du Nouveau Monde !"
 USA_monarchist_event.24.t: "Programmes d'unité publique"
 USA_monarchist_event.24.d: "Aujourd'hui, nous commençons à déployer de nouveaux programmes d'unité publique, ces programmes sont conçus pour favoriser une nouvelle identité du Nouveau Monde. De là, nous irons vers les étoiles avec nos efforts unis. Unis, nous tenons ; divisés, nous serions tombés."
 USA_monarchist_event.24.o1: "Nous sommes les gens du Nouveau Monde !"
 USA_monarchist_event.25.t: "Opération Midtown Madness"
 USA_monarchist_event.25.d: "Maintenant que nous avons réorganisé nos gains initiaux, nous avons reçu le feu vert pour envahir l'île d'Hispaniola et contourner les petites nations de la chaîne insulaire en envahissant Trinité-et-Tobago."
 USA_monarchist_event.25.o1: "Nous marchons de l'avant"
 USA_monarchist_event.26.t: "Opération Midtown Madness"
 USA_monarchist_event.26.d: "Maintenant que nous avons réorganisé nos gains initiaux, nous avons reçu le feu vert pour envahir les nations voisines du Honduras et d'El Salvador."
 USA_monarchist_event.26.o1: "Nous marchons de l'avant"
 USA_monarchist_event.27.t: "Opération Midtown Madness"
 USA_monarchist_event.27.d: "Maintenant que nous avons réorganisé nos gains initiaux, nous avons reçu le feu vert pour envahir la nation voisine de l'Équateur. Bien que nous ne prenions qu'une seule nation, le terrain devient plus difficile, donc notre plan d'invasion est aligné avec celui du Brésil."
 USA_monarchist_event.27.o1: "Nous marchons de l'avant"
 USA_monarchist_event.28.t: "Opération Midtown Madness"
 USA_monarchist_event.28.d: "Maintenant que nous avons réorganisé nos gains initiaux, nous avons reçu le feu vert pour envahir la nation voisine de l'Argentine. Bien que nous ne prenions qu'une seule nation, le terrain devient plus difficile, donc notre plan d'invasion est aligné avec celui de la Colombie."
 USA_monarchist_event.28.o1: "Nous marchons de l'avant"
 USA_monarchist_event.29.t: "Opération Nouveau Monde"
 USA_monarchist_event.29.d: "Les dernières pièces du puzzle commencent maintenant à se mettre en place alors que nous nous lançons dans la création d'un nouvel avenir uni. Les nations de la chaîne insulaire sont les seuls obstacles restants."
 USA_monarchist_event.29.o1: "En avant vers la victoire"
 USA_monarchist_event.30.t: "Opération Nouveau Monde"
 USA_monarchist_event.30.d: "Les dernières pièces du puzzle commencent maintenant à se mettre en place alors que nous nous lançons dans la création d'un nouvel avenir uni. Les nations du Belize et du Guatemala sont tout ce qui reste sur notre chemin."
 USA_monarchist_event.30.o1: "En avant vers la victoire"
 USA_monarchist_event.31.t: "Opération Nouveau Monde"
 USA_monarchist_event.31.d: "Les dernières pièces du puzzle commencent maintenant à se mettre en place alors que nous nous lançons dans la création d'un nouvel avenir uni. La nation du Pérou est le dernier bastion contre nous et nos alliés."
 USA_monarchist_event.31.o1: "En avant vers la victoire"
 USA_monarchist_event.32.t: "Opération Nouveau Monde"
 USA_monarchist_event.32.d: "Les dernières pièces du puzzle commencent maintenant à se mettre en place alors que nous nous lançons dans la création d'un nouvel avenir uni. La nation du Chili est le dernier bastion contre nous et nos alliés."
 USA_monarchist_event.32.o1: "En avant vers la victoire"
 USA_monarchist_event.33.t: "Échange Économique du Nouveau Monde"
 USA_monarchist_event.33.d: "La création de l'Échange Économique du Nouveau Monde (NWEE) solidifiera notre prospérité économique et notre unité mutuelle pour viser un avenir meilleur. Avançons ensemble comme un seul peuple."
 USA_monarchist_event.33.o1: "Vers le Nouveau Monde !"
 USA_monarchist_event.34.t: "Échange Économique du Nouveau Monde"
 USA_monarchist_event.34.d: "La création de l'Échange Économique du Nouveau Monde (NWEE) solidifiera notre prospérité économique et notre unité mutuelle pour viser un avenir meilleur. Avançons ensemble comme un seul peuple."
 USA_monarchist_event.34.o1: "Vers le Nouveau Monde !"
 USA_monarchist_event.35.t: "Échange Économique du Nouveau Monde"
 USA_monarchist_event.35.d: "La création de l'Échange Économique du Nouveau Monde (NWEE) solidifiera notre prospérité économique et notre unité mutuelle pour viser un avenir meilleur. Avançons ensemble comme un seul peuple."
 USA_monarchist_event.35.o1: "Vers le Nouveau Monde !"
 USA_monarchist_event.36.t: "Échange Économique du Nouveau Monde"
 USA_monarchist_event.36.d: "La création de l'Échange Économique du Nouveau Monde (NWEE) solidifiera notre prospérité économique et notre unité mutuelle pour viser un avenir meilleur. Avançons ensemble comme un seul peuple."
 USA_monarchist_event.36.o1: "Vers le Nouveau Monde !"
 USA_focus_carrier_direction_dilemma: "Dilemme de la direction du porte-avions"
 USA_focus_carrier_direction_dilemma_desc: "Le rôle du porte-avions moderne est en train de diverger. D'une part, il y a la méthode traditionnelle de « l'aéroport mobile ». D'autre part, il y a l'idée d'une plate-forme mobile de canons et/ou de missiles qui s'appuie également sur des hélicoptères plutôt que sur des avions à voilure fixe. Quoi qu'il en soit, nous devons le découvrir et commencer à y travailler comme si c'était hier."
 USA_focus_aeronautical_development_board: "Conseil de développement aéronautique"
 USA_focus_aeronautical_development_board_desc: "L'ADB est un institut dédié au développement des avancées basées sur l'aviation, qu'il s'agisse de la sécurité, des systèmes d'armes ou autre. Cependant, pour ne pas étirer notre financement à l'extrême et ne pas surcharger la population, nous devons décider dans quelle direction ces avancées peuvent aller. Nous pouvons soit chercher à sécuriser la suprématie aérienne, soit à nous concentrer sur un soutien au sol plus important et/ou sur des capacités de bombardement dans l'ensemble. L'un ou l'autre choix déterminera ce dont nous devrons nous soucier à l'avenir en cas de guerre."
 USA_fascist_operation_gran_colombia: "Opération Grande Colombie"
 USA_fascist_operation_gran_colombia_desc: "Les dernières étapes sont devant nous alors que nous menons maintenant la lutte dans la moitié sud de NOTRE hémisphère. En utilisant Trinité-et-Tobago comme tremplin, nous pouvons ensuite envahir les petites nations de Guyane et du Suriname. Ce tremplin nous permettra de pousser vers l'ouest et de balayer la moitié supérieure de l'Amérique du Sud."
 USA_monarchist_dedicated_aeronautical_research_institute: "Institut de recherche aéronautique dédié"
 USA_monarchist_dedicated_aeronautical_research_institute_desc: "L'IRA est un complexe de R&D dédié à l'amélioration et au développement de notre force aérienne pour qu'elle soit plus efficace que jamais."
 USA_monarchist_gran_colombian_kingdom: "Royaume de Grande-Colombie"
 USA_monarchist_gran_colombian_kingdom_desc: "Pour commencer l'effort d'unité continentale du sud, nous approcherons la Colombie et travaillerons avec elle pour rétablir le Royaume de Grande-Colombie. Les vieilles gloires sont toujours une belle offre pour un bénéfice mutuel."
 USA_idea_aeronautical_development_board_fighter: "Conseil de développement aéronautique - 'Focus Chasseurs'"
 USA_idea_aeronautical_development_board_fighter_desc: "Le budget du ADB a été priorisé pour toutes les innovations liées aux chasseurs et à la supériorité aérienne."
 USA_idea_aeronautical_development_board_bomber: "Conseil de développement aéronautique - 'Focus Bombardiers'"
 USA_idea_aeronautical_development_board_bomber_desc: "Le budget du ADB a été priorisé pour toutes les innovations liées aux bombardiers et au soutien au sol."
 USA_iranian_sanctions: "Sanctions contre l'Iran"
 USA_iranian_sanctions_desc: "La crise des otages [PER.GetFlag] en Iran de 1979 a vu l'administration Carter mettre en œuvre une série de sanctions contre le gouvernement [PER.GetFlag] iranien afin de le punir pour ses actions. Depuis lors, les administrations présidentielles ont eu des positions divergentes sur la sévérité des sanctions [USA.GetFlag] américaines contre les [PER.GetFlag] Iraniens.\n\nSévérité des sanctions : [?USA_iran_sanction_level]/5"
 USA_increase_sanctions_on_iran: "Augmenter les sanctions contre l'Iran"
 USA_increase_sanctions_on_iran_desc: "Notre administration estime nécessaire de punir l'Iran pour ses actions récentes."
 USA_decrease_sanctions_on_iran: "Diminuer les sanctions contre l'Iran"
 USA_decrease_sanctions_on_iran_desc: "Le gouvernement iranien s'est bien comporté récemment, nous pouvons peut-être assouplir les sanctions à son encontre pour le moment."
 USA_lift_sanctions_on_iran: "Lever les sanctions contre l'Iran"
 USA_lift_sanctions_on_iran_desc: "Les sanctions ne sont qu'un outil de préjudice pour le peuple iranien. Et d'ailleurs, nous n'avons aucune raison politique de continuer les sanctions contre les Iraniens."
 USA_sanctioned_PER_recently: "Sanctions modifiées récemment"
 USA_FOCUS.3.e: "Intéressant."
 usa.89.o3: "Non, et ne demandez plus !"
 usa.95.t: "Demande d'adhésion au programme F-35 refusée et blacklistée"
 usa.95.d: "Les États-Unis n'étaient pas disposés à nous permettre de rejoindre le programme F-35, invoquant que nous ne pouvons pas encore être dignes de confiance pour posséder une telle technologie. On nous a également informés que nous sommes désormais blacklistés et ne pourrons plus jamais intégrer le programme."
 usa.95.o1: "D'accord"
 USA_disable_casualty_report: "Désactiver le rapport mensuel sur les pertes en Afghanistan"
 USA_disable_casualty_report_desc: "Nous ne recevrons plus d'événements mensuels concernant les pertes en Afghanistan. Au lieu de cela, les effets seront appliqués sans notification."
 USA_enable_casualty_report: "Réactiver le rapport mensuel sur les pertes en Afghanistan"
 USA_enable_casualty_report_desc: "Nous commencerons à recevoir des événements mensuels concernant les pertes en Afghanistan."
 USA_UKR_aid: "Aide américano-ukrainienne"
 USA_ISR_military_cooperation: "Coopération militaire américano-israélienne"
 USA_CHI_trade_war: "Distance de la coopération économique chinoise"
 USA_SAU_aid: "Partage de renseignements militaires américains"
 USA_tariff: "Tarifs commerciaux américains"
 USA_SSU_aid: "Soutien militaire américain"
 USA_afghan_mission_cost: "Mission O.E.F. - Afghanistan"
 USA_afghan_mission_cost_desc: "Notre engagement dans l'opération Enduring Freedom, et notre mission en Afghanistan, nous ont placés dans une situation unique. Notre économie, notre gouvernement et notre armée absorberont une grande part du coût lié au maintien du contrôle et de la stabilité sur l'Afghanistan.\n§W--------------§!\nCet esprit national sera §Rretiré§! si nous retirons nos forces d'Afghanistan."
 USA_afghan_mission_TT: "Nous déploierons des troupes [USA.GetFlag] américaines en [AFG.GetFlag] §HAfghanistan§!\n - Nous financerons la §Hconstruction de la nation§! par des investissements économiques ; l'échec à stabiliser le pays avant le retrait risque une résurgence [TAL.GetFlag] §Htalibane§!.\n - Nos troupes feront face à des §Rattaques§! d'insurgés tant que nous resterons en [AFG.GetFlag] §HAfghanistan§!."
 USA_attack_tal_strength_TT: "£AFG_salafist_jihadism §HForce mensuelle des talibans en Afghanistan§!: §G-2.00%§!"
 USA_disable_report_TT: "Nous pouvons désactiver le rapport mensuel sur les pertes dans le menu de décision §HPolitiques nationales§!"
 usa.100.t: "Opération Enduring Freedom - Afghanistan"
 usa.100.d: "Le président [USA.GetLeader] a annoncé le lancement de l'Opération Enduring Freedom (OEF) depuis la Maison Blanche plus tôt aujourd'hui. Il a déclaré que l'objectif de la mission est d'éradiquer les restes des Talibans et d'Al-Qaïda du territoire afghan, et de restaurer la paix et la stabilité dans cette nation turbulente. Cet engagement en Afghanistan marque un changement majeur dans la politique étrangère américaine, car les États-Unis devront désormais adopter une position plus active dans les affaires intérieures d'autres pays pour s'assurer que les objectifs de leurs opérations sont atteints. Un déploiement important en Afghanistan signifie également mettre les troupes américaines en danger, ce qui pourrait gravement nuire à la crédibilité de l'establishment américain sur le front intérieur. Ce que l'Opération Enduring Freedom en Afghanistan accomplira reste à voir, mais pour l'instant, les forces américaines semblent optimistes quant à l'atteinte de leurs objectifs de mission."
 usa.100.a: "Intéressant"
 usa.100.b: "L'empire américain s'étend"
 usa.101.t: "Des militaires s'affrontent avec des insurgés talibans"
 usa.101.d: "Lors d'une patrouille de routine, nos forces ont été prises en embuscade par plusieurs insurgés talibans cachés dans les montagnes. Après un bref affrontement, plusieurs militaires ont été blessés, et quelques-uns ont malheureusement perdu la vie. Cependant, les forces talibanes ont subi un revers majeur avec leur dernière tentative de contrecarrer nos forces. Cette victoire seule ne suffit pas à détourner l'attention des médias nationaux des pertes subies."
 usa.101.a: "En Dieu nous croyons"
 department_of_state.123.t: "Les États-Unis lancent des efforts de coopération verte"
 department_of_state.123.d: "Les États-Unis appellent notre gouvernement à avancer avec un accord sur l'énergie verte initié par l'administration Clinton précédente. L'accord nous demanderait d'abandonner les opérations de forage dans plusieurs champs pétrolifères en échange de fermes solaires financées par les Américains. Le président des États-Unis, [USA.GetLeader], affirme que cette initiative serait dans notre meilleur intérêt, car elle 'réduira grandement la pollution dans les grandes villes'. Bien que certains soient sceptiques quant à la raison pour laquelle les États-Unis eux-mêmes n'abandonnent pas plusieurs opérations minières sur leur propre territoire, c'est une opportunité qui ne se présente qu'une fois dans une vie."
 department_of_state.123.a: "Où signons-nous ?"
 department_of_state.123.b: "Absolument pas"
 department_of_state.2.t: "La Chine signe le projet de loi verte"
 department_of_state.2.d: "Le gouvernement chinois a décidé de signer le Green Bill que nous avons proposé. Cela a choqué certains membres de notre cabinet, car les attentes d'un accord chinois étaient plutôt basses. Cependant, avec la ratification de ce projet, des investissements américains afflueront en Chine et le boom potentiel du secteur vert américain pourrait être sur nous."
 department_of_state.2.a: "Super !"
 department_of_state.3.t: "La Chine ignore notre projet de loi"
 department_of_state.3.d: "Le gouvernement chinois a tout simplement ignoré notre proposition de Green Bill. Le projet aurait vu le secteur énergétique chinois aller dans une direction plus verte, mais il semble que les nuages de Pékin ne soient pas encore assez noirs."
 department_of_state.3.a: "Tant pis pour eux"
 department_of_state.4.t: "Le grand boom de l'énergie verte"
 department_of_state.4.d: "Suite à l'octroi d'une importante somme d'argent à des entrepreneurs en énergie verte, les opérations se sont étendues de la Chine à certaines parties des États-Unis également. Cela survient alors que les entreprises d'énergie verte ont pu croître grâce à l'argent injecté sur le marché, et nous les voyons maintenant continuer des projets dans d'autres parties du monde, y compris aux États-Unis."
 department_of_state.4.a: "Les fruits de nos politiques"
 department_of_state.5.t: "Les États-Unis proposent l'Initiative de Transition Civile"
 department_of_state.5.d: "Le gouvernement des États-Unis a proposé une nouvelle initiative. Ils suggèrent que nous signions leur accord qui nécessitera le démantèlement de 8 usines militaires, et en échange, les États-Unis construiront 16 nouvelles industries civiles pour les remplacer. Bien que la proposition semble très attrayante, certains craignent que cela fasse partie d'un plan américain plus vaste pour affaiblir progressivement les industries militaires russes. Cela dit, nous tirerons plus de bénéfices en jouant le jeu, car rien n'indique que nous ne pourrions pas reconstruire ces industries."
 department_of_state.5.a: "Allez-y, signez"
 department_of_state.5.b: "Nous prennent-ils pour des idiots ?"
 department_of_state.6.t: "La Russie accepte de signer notre initiative"
 department_of_state.6.d: "Le gouvernement russe a annoncé qu'il signerait la récente initiative que nous avons mise en avant. Bien qu'inattendu, nous sommes prêts à financer ce programme et à le voir s'achever. Ils ont déjà autorisé l'entrée de contractants américains et de surveillance pour s'assurer que les usines sont correctement transformées."
 department_of_state.6.a: "Bien"
 department_of_state.7.t: "La Russie rejette notre proposition"
 department_of_state.7.d: "Le gouvernement russe a décidé de rejeter nos propositions pour une Initiative de Transition Russe. Cette initiative aurait vu le gouvernement russe démanteler plusieurs usines d'armement en faveur de l'installation d'industries américaines à leur place."
 department_of_state.7.a: "Tant pis pour eux"
 department_of_state.8.t: "[USA.GetLeader] autorise une intervention américaine en Somalie"
 department_of_state.8.d: "[USA.GetLeader] a annoncé aujourd'hui que les forces armées interviendront pour ramener la paix et la stabilité dans la région somalienne. Cette décision a probablement été influencée par l'augmentation des attaques de pirates somaliens sur les navires américains. La démarche a reçu des réactions mitigées, tant à l'intérieur qu'à l'extérieur des États-Unis. La question de savoir si l'armée américaine sera réellement capable de ramener la paix dans la région reste en débat. Seul le temps nous dira ce qui se passera ensuite."
 department_of_state.8.a: "Intéressant"
 department_of_state.8.b: "L'impérialisme n'a pas de limites"
 department_of_state.900.t: "Les États-Unis soutiennent le Soudan du Sud !"
 department_of_state.900.d: "Les États-Unis ont décidé de s'impliquer dans notre conflit, ce qu'ils n'ont aucun droit de faire. Ils enverront un soutien au Soudan du Sud et prévoient de frapper notre nation."
 department_of_state.900.a: "Merde"
 department_of_state.10.t: "Soutien au Soudan du Sud"
 department_of_state.10.d: "Le régime criminel au Soudan a décidé de prolonger sa guerre civile. Une guerre civile sans fondement, entachée de crimes contre l'humanité. Le Soudan du Sud a besoin de notre soutien pour atteindre son objectif ultime de libération."
 department_of_state.10.a: "Autoriser un soutien total"
 department_of_state.01.t: "Les pirates somaliens attaquent nos navires de fret"
 department_of_state.01.d: "Les pirates somaliens ont violemment attaqué plusieurs navires de fret transportant des marchandises. Nous n'avons actuellement aucun contact avec les membres d'équipage, et nous ne savons pas ce qu'il adviendra de la cargaison."
 department_of_state.01.a: "Bon sang"
 department_of_state.9.t: "Les États-Unis autorisent des frappes aériennes contre le Soudan"
 department_of_state.9.d: "Les États-Unis vont frapper des cibles au Soudan pour paralyser leur capacité à combattre l'Armée de Libération du Peuple Soudanais. [USA.GetLeader] a également déclaré que cette démarche vise à pousser le gouvernement soudanais à conclure un accord de paix avec les rebelles du sud. Le Soudan est enlisé dans un état de guerre civile depuis des décennies, le pays devenant plus instable chaque jour. Il est discutable de savoir si les bombes américaines pourront apporter la paix, mais c'est une action que le gouvernement américain a jugée nécessaire."
 department_of_state.11.t: "Les États-Unis demandent notre soutien"
 department_of_state.11.d: "Le gouvernement à Washington nous a appelés à soutenir le Soudan du Sud par des volontaires et des exportations d'armes. Ils suggèrent que si nous acceptons, nous serons payés une somme importante pour notre aide."
 department_of_state.11.a: "D'accord, nous verrons ce que nous pouvons faire"
 department_of_state.11.b: "Non"
 department_of_state.12.t: "[FROM.GetName] commence à mobiliser des troupes"
 department_of_state.12.d: "[FROM.GetName] a commencé à mobiliser des unités pour soutenir notre appel à l'action suite à nos requêtes. Leur assistance ne sera pas oubliée, et ils recevront ce qui leur a été promis."
 department_of_state.12.a: "Bien"
 department_of_state.13.t: "[FROM.GetName] refuse notre demande"
 department_of_state.13.d: "[FROM.GetName] a décidé qu'il ne voulait pas participer à notre cause au Soudan et a préféré rester chez lui."
 department_of_state.13.a: "D'accord"
 department_of_state.14.t: "Les États-Unis proposent une initiative minière"
 department_of_state.14.d: "Les États-Unis proposent d'exploiter des ressources dans une région relativement 'pauvre en ressources' de notre pays. Ils affirment qu'ils couvriraient l'intégralité des coûts des opérations, et que tout ce qui restera après 10 ans nous appartiendra."
 department_of_state.14.a: "Allez-y"
 department_of_state.14.b: "Non"
 department_of_state.15.t: "[FROM.GetName] accepte l'accord minier"
 department_of_state.15.d: "[FROM.GetName] a accepté de permettre aux compagnies minières américaines d'investir dans des régions délabrées de leur pays pour extraire des métaux précieux. Ils ont accepté nos conditions, stipulant que nous conserverons tout ce qui est trouvé pendant 10 ans, après quoi les droits sur les ressources seront transférés à leur direction."
 department_of_state.15.a: "Bien"
 department_of_state.16.t: "[FROM.GetName] refuse l'accord minier"
 department_of_state.16.d: "[FROM.GetName] a refusé de signer des contrats avec les compagnies minières américaines, nuisant à notre capacité à lancer une opération minière significative dans leur pays."
 department_of_state.16.a: "Dommage"
 department_of_state.17.t: "Fin du contrat"
 department_of_state.17.d: "Notre contrat avec les États-Unis expire aujourd'hui à minuit, et le contrôle de toutes les ressources extraites par les États-Unis sera transféré à notre gouvernement."
 department_of_state.17.a: "D'accord"
 department_of_state.18.t: "Fin du contrat"
 department_of_state.18.d: "Notre contrat avec [FROM.GetName] se termine à minuit, nous obligeant à transférer tous les droits sur les ressources à [FROM.GetName] dans les régions où nous avons effectué des opérations minières."
 department_of_state.18.a: "D'accord"
 department_of_state.19.t: "Les États-Unis offrent leur soutien pour notre pays en faveur de la récupération des territoires perdus"
 department_of_state.19.d: "Les États-Unis ont soutenu nos revendications sur l'Abkhazie et l'Ossétie du Sud, nous appelant à « prendre une action décisive contre ceux qui ont nui à l'État géorgien ». Les États-Unis ont déclaré qu'ils étaient disposés à soutenir nos forces armées, et même à appeler à une intervention de l'OTAN si la Russie devait réagir militairement contre nous. Ils offrent de nous fournir de grandes quantités d'armes et de munitions pour atteindre nos objectifs."
 department_of_state.19.a: "L'Amérique, tu l'as encore fait, allons-y"
 department_of_state.19.b: "Non, les Américains sont peu fiables"
 department_of_state.20.t: "Lancement des opérations"
 department_of_state.20.d: "Le moment est venu pour nous d'exécuter nos plans contre les régions séparatistes et de récupérer ce qui nous appartient de droit."
 department_of_state.20.a: "En avant"
 department_of_state.21.t: "La Géorgie frappe vers le nord"
 department_of_state.21.d: "Les Géorgiens ont commencé une série d'attaques sur des territoires qu'ils jugent séparatistes, et ont commencé à appeler leur armée à une mobilisation de masse. Ces attaques posent une menace directe à notre influence dans le Caucase, car elles ouvrent la porte à une exploitation occidentale ultérieure. Si nous ne faisons rien, nous risquons de paraître faibles. Si nous intervenons, nous pourrons être en désaccord avec le reste de l'Occident."
 department_of_state.21.a: "Au diable les Géorgiens !"
 department_of_state.21.b: "Pas notre problème"
 department_of_state.22.t: "La Russie répond aux attaques géorgiennes"
 department_of_state.22.d: "Les Russes ont décidé de répondre à la dernière série d'attaques sur le territoire nord par les Géorgiens. Ils ont déclaré que l'État géorgien 'a dépassé les bornes' et que cette action est en quelque sorte une menace directe pour l'existence de l'État russe. Nous avons promis à nos alliés géorgiens un coup de main si la Russie devait répondre, et maintenant est le moment."
 department_of_state.22.a: "Convoquer un sommet de l'OTAN"
 department_of_state.22.b: "Nous avons changé d'avis"
 department_of_state.23.t: "Les États-Unis demandent notre soutien"
 department_of_state.23.d: "La Géorgie est entrée en conflit avec les Russes, et il semble qu'elle ne puisse accomplir que peu de choses sans aide étrangère. Les États-Unis appellent l'OTAN à envoyer des volontaires et des armes à la Géorgie pour les aider à atteindre leurs objectifs opérationnels."
 department_of_state.23.a: "Nous sommes en route"
 department_of_state.23.b: "Ce n'est pas notre conflit"
 department_of_state.24.t: "Conférence de l'OTAN sur la Géorgie"
 department_of_state.24.d: "En réponse à l'entrée de la Géorgie dans un conflit de pleine échelle avec la Russie, l'OTAN a convoqué une conférence d'urgence pour évaluer la situation et coordonner une réponse. Les forces géorgiennes luttant pour tenir le terrain, les États-Unis ont pressé les États membres de soutenir la Géorgie par de l'aide militaire, des volontaires et des envois d'armes. Les critiques affluent des politiciens russes, qui voient le geste comme une menace directe à leur existence. La région reste sur le fil alors que la situation se déroule, et tel qu'il en est, personne ne sait comment cela finira."
 department_of_state.24.a: "La Géorgie a le droit de défendre ses intérêts !"
 department_of_state.24.b: "Une autre victime de l'impérialisme occidental"
 department_of_state.25.t: "Les États-Unis nous abandonnent !"
 department_of_state.25.d: "Dans un geste soudain et inattendu, les États-Unis nous ont trahis et sont revenus sur leur promesse. Ils affirment qu'en raison d'« objections du Congrès », ils sont incapables d'envoyer adéquatement le soutien nécessaire pour gagner le conflit."
 department_of_state.25.a: "Ces salauds"
 department_of_state.26.t: "La Géorgie se prépare à lancer des opérations"
 department_of_state.26.d: "Le moment est venu pour nous d'accorder à la Géorgie ce que nous lui avions promis et de lui envoyer le soutien armé nécessaire pour affronter la menace en cours."
 department_of_state.26.a: "D'accord"
 department_of_state.27.t: "La Géorgie refuse notre demande"
 department_of_state.27.d: "Le gouvernement géorgien semble peu intéressé à déclencher un conflit avec ses voisins, même pour réunifier leur patrie. Pour l'instant, il semble qu'ils souhaitent établir des liens plus étroits avec la Russie plutôt qu'avec l'Occident."
 department_of_state.27.a: "D'accord"
 department_of_state.28.t: "Les États-Unis proposent un projet SHORAD"
 department_of_state.28.d: "Le gouvernement des États-Unis a offert de couvrir le coût d'un projet SHORAD à l'échelle nationale pour tous les membres de l'OTAN. Si le contrat a quelques ficelles, exigeant que les sites SHORAD soient opérés par du personnel des États-Unis, ils offriront néanmoins un niveau de protection inégalé par d'autres défenses antiaériennes dans le monde."
 department_of_state.28.a: "Où signons-nous ?"
 department_of_state.28.b: "Non, nous rejetons cette menace contre notre indépendance !"
 department_of_state.29.t: "Belarussian Dissidents Occupy Government Buildings"
 department_of_state.29.d: "Aujourd'hui vers 9 h 34, des dizaines de dissidents biélorusses armés de rien d'autre que d'armes légères sont entrés dans plusieurs bâtiments gouvernementaux et les ont occupés. L'armée et la police biélorusses n'ont pas fait grand-chose pour arrêter ces rebelles armés. Peu après, des dissidents ont diffusé une annonce depuis le réseau de télévision d'État de la nation déclarant la chute du « gouvernement des corrompus ». Le gouvernement russe n'a pas officiellement commenté la situation, mais tel qu'il en est, il semble que le monde entier ait été pris par surprise par ce développement soudain. Il y a ceux qui pointent du doigt le gouvernement des États-Unis pour un complot contre le gouvernement biélorusse, mais aucun commentaire n'est venu de Washington."
 department_of_state.29.a: "Les vents du changement soufflent à nouveau"
 department_of_state.30.t: "Coups de feu entendus à travers la Biélorussie"
 department_of_state.30.d: "Des habitants de Minsk et d'autres villes à travers la Biélorussie ont rapporté des échanges de tirs, soupçonnés d'être entre rebelles biélorusses et forces gouvernementales. Cela survient alors que des rebelles biélorusses organisés ont commencé à occuper plusieurs postes gouvernementaux dans les villes de l'ouest de la nation, déclarant les régions « zones libres biélorusses ». Les rebelles affirment n'avoir d'autre but que de renverser le régime de [BLR.GetLeader]. On soupçonne que les rebelles ont été armés, financés et entraînés par les États-Unis. Le Kremlin a déclaré qu'il travaillerait avec le gouvernement biélorusse pour arrêter l'invasion du « territoire souverain biélorusse et russe ». Suite aux commentaires russes, [USA.GetLeader] a promis son soutien aux rebelles biélorusses, et a appelé plusieurs États membres de l'OTAN à aider à soutenir les rebelles."
 department_of_state.30.a: "Un autre État s'effondre"
 department_of_state.31.t: "La Biélorussie tombe aux mains des forces occidentales"
 department_of_state.31.d: "Il semble que les forces américaines responsables d'avoir orchestré le chaos en Biélorussie aient réussi, et se trouvent maintenant à notre frontière. Ce changement de direction a inquiété plusieurs groupes et cliques au sein de notre propre État, craignant que les Américains n'utilisent la Biélorussie comme base de départ pour une agression ultérieure envers notre souveraineté. Nous devons montrer à l'Occident que nous n'avons pas peur d'eux, et nous devons prendre une action rapide et décisive. Mais le résultat, qu'ils soient ou non dissuadés, dépend fortement de ce que nous ferons ensuite."
 department_of_state.31.a: "Nous devons élargir notre propre alliance !"
 department_of_state.31.b: "Nous devons riposter à un niveau égal !"
 department_of_state.32.t: "La Russie nous invite dans son alliance"
 department_of_state.32.d: "Le gouvernement russe nous a invités à rejoindre leur alliance, invoquant que l'agression récente de l'Occident pourrait mettre en danger notre État."
 department_of_state.32.a: "Où signons-nous ?"
 department_of_state.32.b: "Nous sommes vos amis, Russie, mais pas des idiots !"
 department_of_state.33.t: "La Serbie décline l'invitation"
 department_of_state.33.d: "Le gouvernement serbe a décliné notre invitation à rejoindre notre alliance, déclarant que cela ne ferait qu'accroître les tensions dans le monde."
 department_of_state.33.a: "D'accord"
 department_of_state.34.t: "La Russie lance une attaque générale sur les Baltes"
 department_of_state.34.d: "Le gouvernement russe a lancé une attaque générale contre les États baltes, cette action étant considérée comme une représaille aux récents développements en Biélorussie. On ne sait pas encore si l'OTAN répondra par une réponse totale à ce dernier développement, mais plusieurs membres de l'OTAN ont déclaré qu'ils sont prêts à armer les Baltes pour aider à combattre la Russie. [SOV.GetLeader] a déclaré dans une allocution télévisée que cette action vise à 'préserver la souveraineté nationale russe' et à 'combattre l'impérialisme occidental' dans la région baltique. L'invasion attire rapidement des condamnations du monde entier et suscite des craintes qu'une guerre mondiale soit à l'horizon."
 department_of_state.34.a: "Le monde est à nouveau au bord du gouffre"
 department_of_state.35.t: "Effondrement de l'autorité étatique en Sibérie"
 department_of_state.35.d: "La Sibérie orientale, une région autrefois farouchement gardée par l'État russe, est désormais vulnérable à une exploitation étrangère à des niveaux jamais vus. Plusieurs États occidentaux ont commencé le processus de reconnaissance de cette « nation » nouvellement née, et appellent d'autres nations indépendantes à suivre. Pour le bien de la sécurité nationale et de la sauvegarde de nos glorieuses frontières, nous devons prendre une action préventive afin d'empêcher l'empiètement occidental sur nos frontières."
 department_of_state.35.a: "Marcher sur la Sibérie et établir l'ordre"
 department_of_state.35.b: "Il est préférable de rester entre nous"
 department_of_state.36.t: "La Chine s'apprête à occuper la Sibérie orientale"
 department_of_state.36.d: "Le gouvernement chinois a officiellement déclaré que la Sibérie orientale est un intérêt fondamental de la Chine et du peuple chinois. [CHI.GetLeader] a annoncé son intention de déployer des troupes dans la région pour 'assurer la paix et la stabilité' dans l'ancienne région russe. Bien qu'en apparence, le gouvernement chinois semble agir par prudence, les experts qualifient cette démarche d'expansion de l'influence économique mondiale de la Chine. La Sibérie est une région riche en pétrole et en ressources naturelles, ce qui en fait un terrain de chasse idéal pour les entreprises et investisseurs chinois. Cette démarche attire rapidement des condamnations des États occidentaux, et une conférence sur ce sujet est prévue prochainement."
 department_of_state.36.a: "La Chine récolte les fruits de la guerre"
 department_of_state.37.t: "La sécurité nationale menacée après les attaques chinoises"
 department_of_state.37.d: "Suite à une prise de contrôle chinoise de ce qui fut autrefois la Sibérie russe, la géopolitique de la région a changé de façon assez dramatique. Ayant autrefois récolté les fruits de la victoire, nos alliés de l'OTAN sont désormais en panique, car les Chinois pourraient potentiellement étendre leur influence plus à l'ouest. Des appels exigent une solution permanente à ce problème croissant."
 department_of_state.37.a: "Convoquer un sommet d'urgence"
 department_of_state.37.b: "Inutile, les Chinois ne veulent pas de mal"
 department_of_state.38.t: "RUSFOR proclamée : notre suzerain transformé"
 department_of_state.38.d: "Washington a officialisé la dissolution de l'Union soviétique et l'établissement de RUSFOR comme État successeur. En tant que sujet de l'ancien État soviétique, nous devons désormais compter avec notre nouvelle réalité et décider d'accepter cette transition ou d'y résister."
 department_of_state.38.a: "Nous coopérerons avec le nouvel ordre"
 department_of_state.3800.t: "RUSFOR proclamée : la fin de l'ère soviétique"
 department_of_state.3800.d: "Les États-Unis ont formellement reconnu RUSFOR comme successeur légitime de l'Union soviétique. Les revendications territoriales soviétiques à travers l'ancien empire doivent être transférées à la Fédération de Russie. Moscou doit maintenant décider comment gérer cette transition historique et tracer la route de la nation."
 department_of_state.3800.a: "L'ère soviétique est close. La Russie demeure"
 department_of_state.39.t: "RUSFOR"
 department_of_state.39.d: "Nos partenaires de l'OTAN nous appellent à abandonner nos revendications sur tout ancien territoire russe, dans l'espoir de créer une nouvelle Russie réunifiée et pro-OTAN. À long terme, il serait plus bénéfique pour nous d'emprunter la voie de la coopération."
 department_of_state.39.a: "Laisser RUSFOR prendre le contrôle"
 department_of_state.39.b: "Non"
 department_of_state.40.t: "L'OTAN se réunit lors d'un sommet d'urgence"
 department_of_state.40.d: "Les chefs de l'OTAN se sont réunis lors d'un sommet d'urgence plus tôt aujourd'hui, le principal sujet de discussion étant l'avenir de la nation russe. Suite à une défaite brutale face aux États de l'OTAN, l'autorité centrale russe s'est effondrée et de nombreuses anciennes provinces se sont libérées en tant qu'États indépendants. Sans hésitation, le gouvernement chinois a choisi d'exploiter le vide de pouvoir laissé par la Russie et a occupé des parties de la Sibérie orientale, déclarant une Région Administrative Spéciale de la Sibérie Orientale (R.A.S.). Plusieurs dirigeants de l'OTAN, y compris le secrétaire général, affirment maintenant qu'une Force Russe de l'OTAN (RUSFOR) sera établie, avec un commandement central unifié situé à Saint-Pétersbourg."
 department_of_state.40.a: "La Russie deviendra-t-elle un État défaillant ?"
 department_of_state.41.t: "Les forces de l'OTAN établissent RUSFOR"
 department_of_state.41.d: "Suite à un sommet d'urgence tenu par l'OTAN la semaine dernière, un comité a été chargé de créer les bases nécessaires pour un gouvernement de transition russe. En conséquence, la mission RUSFOR a été établie, et une zone de restauration de l'OTAN a été mise en place dans certaines parties de ce qui était autrefois la Russie occidentale. Bien que l'intention initiale était de maintenir une Russie fragmentée et désunie pour éviter un effet de retour, l'agression chinoise a conduit les dirigeants de l'OTAN à réévaluer leur position. Plusieurs États cèdent leurs zones d'occupation en faveur d'une zone de restauration de l'OTAN, et des plans sont en cours pour intégrer la Russie dans l'alliance et établir un leadership civil dans le pays."
 department_of_state.41.a: "J'ai déjà entendu cette histoire..."
 department_of_state.45.t: "La pression internationale s'accroît"
 department_of_state.45.d: "La pression internationale se construit contre nous en raison de notre contrôle sur le territoire russe. Si nous refusons de relâcher nos revendications, nous pourrons être sanctionnés, et si nous coopérons, nous pourrons obtenir quelque chose de mieux que quelques terres troublées en échange."
 department_of_state.45.a: "Nous abandonnerons nos revendications"
 department_of_state.45.b: "Jamais !"
 department_of_state.47.t: "L'OTAN organise la 'Conférence de Kaliningrad'"
 department_of_state.47.d: "Suite à la défaite des forces russes face aux armées de l'OTAN, la conférence de Kaliningrad est organisée par les vainqueurs de ce que certains commencent à appeler la 'Troisième Guerre mondiale' pour décider du sort d'une nouvelle Russie. Plusieurs chefs d'État sont présents, y compris des États non membres de l'OTAN, pour déterminer la meilleure marche à suivre. Le plan actuel sur la table consiste à créer un gouvernement de transition dans le cœur de la Russie occidentale, avec l'octroi de l'indépendance à plusieurs États de l'est et du sud de la Russie."
 department_of_state.47.a: "La Russie est sur la table, non pas comme une nation, mais comme un trophée"
 department_of_state.48.t: "Une nouvelle ère de leadership russe"
 department_of_state.48.d: "Le moment est venu d'inaugurer le dirigeant russe, Alexeï Navalny. En tant que notre seul et meilleur choix, Navalny a promis de mener la Russie vers un État plus lumineux, démocratique et inclusif."
 department_of_state.48.a: "Bienvenue, Navalny"
 department_of_state.49.t: "Les États-Unis nous approchent avec une requête"
 department_of_state.49.d: "Les États-Unis nous ont approchés avec une requête très intéressante. Ils suggèrent que nous mettions en place une alliance formelle dans le Pacifique, semblable à l'OTAN. Ils nous ont approchés en tant que leader potentiel de cette faction et nous demandent de préparer les documents et les bases nécessaires pour une alliance visant à contrer l'influence croissante de la Chine dans la région. Ils ont également demandé que nous invitions Taïwan et la Corée du Sud comme premiers membres de cette faction."
 department_of_state.49.a: "Nous acceptons"
 department_of_state.49.b: "Non, nous ne pouvons pas affronter la Chine"
 department_of_state.50.t: "Le Japon nous approche avec une offre"
 department_of_state.50.d: "Le gouvernement japonais nous a offert une place et une position de sécurité dans la nouvelle alliance EAST. Ils affirment que l'alliance renforcera la sécurité en Asie de l'Est et contiendra l'expansion chinoise. Rejoindre la faction pourrait nous donner un avantage sur nos rivaux, mais cela pourrait aussi nous placer directement dans leur ligne de mire."
 department_of_state.50.a: "Nous rejoindrons"
 department_of_state.50.b: "Cela semble trop risqué"
 department_of_state.51.t: "Le Japon annonce la formation d'EAST"
 department_of_state.51.d: "Suite à une intense campagne de lobbying par les politiciens américains, le gouvernement japonais a cédé aux demandes des États-Unis plus tôt cette semaine et a annoncé qu'il formera une faction semblable à l'OTAN. L'alliance est surnommée 'EAST', acronyme de 'Traité de Sécurité de l'Asie de l'Est', et est déjà appelée l'OTAN de l'Asie. La faction travaillera à créer une ceinture de sécurité autour de la Chine et à ralentir son influence toujours croissante. Bien que le Japon et les États-Unis aient nié la menace évidente que cette faction pourrait représenter pour la Chine, il a été rapporté que les officiels chinois préparent déjà une réponse à cette démarche."
 department_of_state.51.a: "Un nouveau bloc émerge"
 department_of_state.51.b: "La décadence occidentale ronge un autre coin du globe.."
 department_of_state.52.t: "Les États-Unis fournissent des renseignements et une aide contre l'Iran"
 department_of_state.52.d: "Les États-Unis nous ont offert un accès à des renseignements qui pourraient aider à contrer la menace iranienne croissante. Si nous acceptons, nous obtiendrons un avantage sur les Iraniens, et en échange, les États-Unis gagneront de l'influence sur notre nation."
 department_of_state.52.a: "D'accord"
 department_of_state.52.b: "Non"
 department_of_state.53.t: "[FROM.GetName] accepte notre offre"
 department_of_state.53.d: "[FROM.GetName] a décidé d'accepter notre offre et a déjà commencé à utiliser efficacement les ressources que nous leur avons proposées."
 department_of_state.53.a: "Être un ami de l'Amérique rapporte"
 department_of_state.54.t: "[FROM.GetName] refuse notre offre"
 department_of_state.54.d: "[FROM.GetName] a décidé qu'il était dans son intérêt de refuser les ressources que nous étions prêts à leur fournir."
 department_of_state.54.a: "Tant pis pour eux"
 department_of_state.55.t: "Les États-Unis nous exhortent à agir contre la Transnistrie"
 department_of_state.55.d: "Les États-Unis nous ont exhortés à prendre des mesures immédiates pour démanteler toute notion d'État transnistrien et à lancer une attaque générale contre les positions défensives transnistriennes immédiatement. Ils affirment que si nous retardons cette action, il pourrait être trop tard à l'avenir. Ils déclarent également qu'ils fourniraient un soutien matériel et en personnel si nécessaire."
 department_of_state.55.a: "Préparer les forces armées"
 department_of_state.55.b: "C'est une démarche trop risquée"
 department_of_state.56.t: "La Moldavie avance sur la Transnistrie"
 department_of_state.56.d: "Le gouvernement moldave a pris la sage décision de suivre nos conseils et de lancer une attaque générale contre les séparatistes transnistriens. Cette démarche pourrait irriter Moscou, mais elle affaiblira également considérablement la Russie."
 department_of_state.56.a: "Bien"
 department_of_state.57.t: "La Moldavie décide contre nos conseils"
 department_of_state.57.d: "Le gouvernement moldave a décidé qu'en raison des circonstances actuelles, il serait incapable de lancer une attaque contre la Transnistrie. Ils affirment que cette démarche est bien trop risquée et n'est pas une priorité pour le gouvernement."
 department_of_state.57.a: "D'accord"
 department_of_state.58.t: "La Moldavie se prépare à éliminer les séparatistes transnistriens"
 department_of_state.58.d: "Les forces armées moldaves ont annoncé aujourd'hui qu'elles commenceraient des opérations contre les séparatistes transnistriens à l'est. Le geste vient comme un choc, car la Transnistrie est un État satellite connu de Moscou. Le Kremlin n'a pas encore commenté les attaques, mais on s'attend à ce que les forces russes soutiennent les forces transnistriennes. Il y a beaucoup de spéculations selon lesquelles la pression et l'implication américaines auraient pu aboutir à ces attaques, car plusieurs sources en Moldavie ont déclaré n'avoir pas du tout été informées de la décision."
 department_of_state.58.a: "La Moldavie sera-t-elle réunifiée ?"
 department_of_state.58.b: "L'Occident poursuit son expansion"
 department_of_state.59.t: "Les États-Unis émettent un avertissement"
 department_of_state.59.d: "Les États-Unis ont émis un avertissement concernant notre programme nucléaire. Ils ont déclaré que si, dans les prochaines années, nous ne prenons aucune mesure pour démanteler notre programme, ils n'auront d'autre choix que d'agir. Bien qu'il soit difficile de prédire si les Américains agiront vraiment, une chose est sûre : ils feront tout ce qui est en leur pouvoir pour entraver notre progrès."
 department_of_state.59.a: "D'accord, nous verrons bien"
 USA_withdraw_from_afghanistan: "[AFG.GetFlag] [TAL.GetFlag] Retrait d'Afghanistan"
 USA_withdraw_from_afghanistan_desc: "Le moment est venu de faire nos bagages et de quitter l'[AFG.GetFlag] Afghanistan. Nous avons étayé une armée forte, fonctionnelle et capable pendant notre mandat. Si les [AFG.GetFlag] Afghans sont incapables de maintenir la paix et la stabilité chez eux, alors il n'y a plus rien que nous puissions faire de notre côté."
 USA_chinese_environmentalist_cooperation: "[CHI.GetFlag] [USA.GetFlag] Loi sino-américaine sur l'écologie"
 USA_chinese_environmentalist_cooperation_desc: "La dépendance de [CHI.GetFlag] la Chine aux combustibles fossiles leur donne une base de ressources stratégiques que nous ne pouvons ignorer. En orientant Pékin vers l'énergie verte, nous réduisons leur levier tout en assurant que l'industrie américaine mène la transition. Une Chine plus verte est une Chine moins dangereuse."
 USA_the_russian_transition: "[SOV.GetFlag] Initiative de transition russe"
 USA_the_russian_transition_desc: "L'[SOV.GetFlag] Union soviétique est tombée, et le secteur militaire hypertrophié de [SOV.GetFlag] la Russie ne sert personne d'autre que les marchands d'armes. Nous presserons la direction russe de convertir d'anciennes usines d'armes en production civile, un pas concret qui apaise les tensions régionales et ouvre la porte à une véritable coopération à l'avenir."
 USA_authorize_intervention_in_somalia: "[SOM.GetFlag] [JUB.GetFlag] [SWS.GetFlag] Autoriser l'intervention militaire en Somalie"
 USA_authorize_intervention_in_somalia_desc: "Le conflit somalien a mis nos conteneurs maritimes en danger, et notre commerce diminue régulièrement en raison des attaques incessantes contre nos routes maritimes. Nous pourrons y mettre un terme rapidement grâce à une intervention appropriée et ramener la stabilité dans une partie du monde plutôt troublée."
 USA_airstrikes_against_sudan: "[SUD.GetFlag] [SSU.GetFlag] Autoriser les frappes aériennes contre le Soudan"
 USA_airstrikes_against_sudan_desc: "La guerre civile §HSoudanaise [SUD.GetFlag]§! dure depuis un certain temps, et si rien n'est fait, nous pourrions assister à une guerre prolongée qui ne ferait que continuer à ravager la région. Nous devons soutenir le §HSoudan du Sud [SSU.GetFlag]§! militairement pour faire pression sur le gouvernement §HSoudanais [SUD.GetFlag]§! afin qu'il recule ou cherche une solution diplomatique."
 USA_call_on_tanzania_and_kenya: "[KEN.GetFlag] [TNZ.GetFlag] Appel au soutien kényan et tanzanien"
 USA_call_on_tanzania_and_kenya_desc: "Nous devons demander à nos alliés en Afrique de soutenir le §HSoudan du Sud [SSU.GetFlag]§! pendant ces temps difficiles, et nous devons le faire vite."
 USA_our_backyard: "[BRA.GetFlag] [COL.GetFlag] [CHL.GetFlag] Investissements dans notre cour arrière"
 USA_our_backyard_desc: "Nos voisins du sud ont un potentiel infini pour être plus grands que ce qu'ils sont déjà. Grâce aux investissements américains, nous serons en mesure de libérer leur plein potentiel et de les pousser vers la modernité. Bien sûr, nous en tirerons aussi un bénéfice, rien n'est jamais gratuit."
 USA_uniting_georgia: "[GEO.GetFlag] [SOO.GetFlag] [ABK.GetFlag] Unification de la Géorgie"
 USA_uniting_georgia_desc: "[GEO.GetFlag] La Géorgie est exploitée et ruinée par l'ours russe, et nous ne le supporterons pas. Nous devons rassurer Tbilissi que nous nous tenons derrière elle, et démontrer à [SOV.GetFlag] Moscou qu'ils ne peuvent pas agir en toute impunité dans la région. Presser la Géorgie de reprendre [ABK.GetFlag] l'Abkhazie et [SOO.GetFlag] l'Ossétie du Sud montrera aux Russes que leur soi-disant « armée formidable » ne peut pas tant que cela."
 USA_natos_man: "[USA.GetFlag] [ENG.GetFlag] [GER.GetFlag] NATO's Man"
 USA_natos_man_desc: "Nos alliés de l'OTAN sont exposés : sans défenses aériennes à courte portée, un assaut aérien majeur pourrait briser les positions avancées avant que nous tirions un coup. Nous devons équiper chaque ligne de front alliée de systèmes SHORAD dès maintenant, avant que cette fenêtre ne se ferme et que le coût ne devienne bien plus élevé."
 USA_belarus_reauthorization_act: "[BLR.GetFlag] [USA.GetFlag] Belarus Democracy Reauthorization Act"
 USA_belarus_reauthorization_act_desc: "Notre soutien à la démocratie et aux droits de l'homme biélorusses ne doit pas vaciller. Nous devons réaffirmer le soutien aux mouvements de liberté au sein même de la Biélorussie, et renverser la brutale dictature de Loukachenko."
 USA_setting_the_pacific_groundwork: "[JAP.GetFlag] [TAI.GetFlag] [KOR.GetFlag] Construction du bouclier du Pacifique"
 USA_setting_the_pacific_groundwork_desc: "Nos alliés en Asie de l'Est doivent affronter une [CHI.GetFlag] Chine enhardie et agressive, et ils ne peuvent pas le faire seuls. Il est dans notre meilleur intérêt de presser [JAP.GetFlag] Tokyo de mettre sur pied un pacte de sécurité régional avant que Pékin n'impose la question à ses propres termes."
 USA_a_strong_east: "[ISR.GetFlag] [SAU.GetFlag] Un Moyen-Orient protégé"
 USA_a_strong_east_desc: "Nos deux plus proches alliés au Moyen-Orient, l'Arabie saoudite et Israël, sont sous une menace constante des forces iraniennes. Il est dans nos meilleurs intérêts de nous mouvoir pour armer et enhardir nos alliés dans la région."
 USA_fighting_little_green_men: "[UKR.GetFlag] [MLV.GetFlag] [PMR.GetFlag] [SOV.GetFlag] Combattre les petits hommes verts"
 USA_fighting_little_green_men_desc: "Les forces russes se sont trop enfoncées en Europe de l'Est par leurs États satellites comme la Transnistrie. Il est temps de faire savoir aux Moldaves qu'ils sont ceux qui ont la charge de leur propre territoire, pas les Russes."
 USA_push_iran: "[PER.GetFlag] Avertir Téhéran"
 USA_push_iran_desc: "Les Iraniens poursuivent une bombe nucléaire depuis que la Terre tourne. La rumeur veut qu'ils ne sont qu'à quelques mois d'acquérir une arme si nous n'intervenons pas. En les pressant et en les avertissant à l'avance, nous serions en mesure de justifier une future intervention s'ils ne s'engagent pas sur la voie de la diplomatie et de la négociation."
 USA_two_percent: "[USA.GetFlag] [GER.GetFlag] [ENG.GetFlag] [POL.GetFlag] Ces 2 % comptent !"
 USA_two_percent_desc: "Nos alliés de l'OTAN ont constamment refusé de respecter les niveaux de dépenses minimaux fixés par les normes de l'alliance. Il est temps que nous commencions à les pousser, d'une manière ou d'une autre, à augmenter leurs dépenses, sinon ils risquent de récolter ce qu'ils ont semé !"
 USA_tehrans_ultimatum: "[PER.GetFlag] [USA.GetFlag] [PER.capital.GetCapitalVictoryPointName]'s Ultimatum"
 USA_tehrans_ultimatum_desc: "Les Iraniens ont été avertis à maintes reprises que s'ils se lançaient dans la course à l'arme nucléaire, ils seraient confrontés à l'épée. Il semble que l'Iran n'ait toujours pas appris sa leçon et doit être soumis par la force."
 USA_economic_destruction_of_beijing: "[CHI.GetFlag] Destruction économique de [CHI.capital.GetCapitalVictoryPointName]"
 USA_economic_destruction_of_beijing_desc: "Les Chinois ont trop avancé, trop vite. Nous devons agir rapidement pour freiner cette croissance immédiatement, sinon il sera peut-être trop tard. Nous allons essayer de faire en sorte que tous les États alignés sur l'Occident participent à un boycott économique de la Chine afin que leur néo-impérialisme économique prenne rapidement fin."
 USA_freedom_in_venezuela: "[VEN.GetFlag] [USA.GetFlag] Liberty Through Blood"
 USA_freedom_in_venezuela_desc: "Peu importe ce que nous avons essayé, cet insecte de [VEN.GetLeader] nous a échappé à maintes reprises. Il est temps de mettre fin à son régime une fois pour toutes."
 USA_russian_reset: "[USA.GetFlag] [SOV.GetFlag] La réinitialisation russe"
 USA_russian_reset_desc: "Il est temps de nous réconcilier avec nos amis russes et de mettre fin à notre conflit sans fin. En poussant à 'réinitialiser' les relations, nous prouverons à la Russie que nous ne voulons pas de mal et que nous sommes ouverts au dialogue et aux négociations."
 USA_intervention_in_libya: "[LBA.GetFlag] Intervention en Libye"
 USA_intervention_in_libya_desc: "L'État libyen est au bord de l'effondrement, avec peu ou pas d'infrastructures ou de ceinture de sécurité pour protéger les civils. Nous devons nous charger d'intervenir et de contribuer à restaurer l'ordre dans la région."
 USA_moving_in_on_africa: "[DRC.GetFlag] [SAF.GetFlag] [NIG.GetFlag] Se déplaçant en Afrique"
 USA_moving_in_on_africa_desc: "L'État chinois a eu un accès pratiquement illimité aux marchés africains et aux affaires intérieures pendant de nombreuses années maintenant, et cela commence enfin à nous rattraper. Nous devons agir pour combattre l'influence chinoise et exercer la nôtre si nous voulons rester la force mondiale dominante."
 USA_another_10_trillion_to_israel: "[ISR.GetFlag] [USA.GetFLag] A Strong Israel, A Strong America"
 USA_another_10_trillion_to_israel_desc: "Israël est notre plus proche et peut-être notre seul allié au Moyen-Orient, ce qui en fait une cible pour nos ennemis. Nous devons faire tout ce qui est en notre pouvoir pour armer et protéger Israël afin de ne pas perdre un pilier de notre influence dans le monde."
 USA_backing_ukraine: "[UKR.GetFlag] [USA.GetFlag] Backing Ukraine"
 USA_backing_ukraine_desc: "L'invasion injuste, illégale et provocatrice de l'Ukraine par la Russie a déclenché un débat parmi nos politiciens. Qu'ils soient ou non favorables à l'isolationnisme, si nous restons les bras croisés et regardons l'Ukraine se faire avaler, alors nous pourrons bientôt voir des Russes à Washington."
 USA_iraq_most_wanted: "Les plus recherchés d'Irak"
 USA_iraq_most_wanted_desc: "Les chefs d'État £IRQ_Nat_Autocracy_small ba'athistes se sont dispersés dans tout le Moyen-Orient. Quatre fugitifs sont actuellement cachés en [IRQ.GetFlag] Irak, dont Saddam Hussein et ses fils, tandis que quatre autres ont fui vers les pays voisins. [IRQ_dlc_check] Nous devons mener des §Hraids de chasse aux ba'athistes§! en [IRQ.GetFlag] Irak pour trouver les cachettes des quatre As. Ils peuvent être dans n'importe quel État, la recherche doit donc être approfondie. Le fait de ne pas éliminer au moins quatre fugitifs dans un délai de cinq ans entraînera une contre-attaque ba'athiste majeure.\n"
 IRQ_la_res: "Nous avons besoin d'au moins §H85 % de force de réseau§! dans tout pays voisin de l'§HIrak [IRQ.GetFlag]§! pour vérifier si les ba'athistes §HIrakiens [IRQ.GetFlag]§! s'y sont enfuis sans la permission des nations cibles. Une fois vérifié, nous pouvons intervenir pour les arrêter."
 IRQ_influence: "Nous avons besoin d'au moins §H20 % d'influence§! dans tout pays voisin de l'§HIrak [IRQ.GetFlag]§! pour vérifier si les ba'athistes §HIrakiens [IRQ.GetFlag]§! s'y sont enfuis sans la permission des nations cibles. Une fois vérifié, nous pouvons intervenir pour les arrêter."
 USA_execute_saddam: "Exécuter Saddam Hussein"
 USA_execute_saddam_desc: "Il est temps de laisser ce criminel faire face à la justice. La justice dont il a privé son propre peuple."
 USA_execute_qusay: "Exécuter Qusay Hussein"
 USA_execute_qusay_desc: "Bien qu'il ne soit pas aussi maniaque que son frère, Qusay est toujours un criminel dangereux qui ne devrait pas être libéré."
 USA_execute_uday: "Exécuter Uday Hussein"
 USA_execute_uday_desc: "Oudaï est un monstre absolu, comme le prouve son casier notoire. Aucune somme d'argent ne réparerait les crimes qu'il a commis."
 USA_execute_abid: "Exécuter Abid Hamid Mahmud"
 USA_execute_abid_desc: "En tant que centre du parti Ba'ath, Abid Hamid Mahmud a les mains tachées du sang des prisonniers politiques réprimés."
 USA_execute_majid: "Exécuter Ali Hassan al-Majid"
 USA_execute_majid_desc: "« Ali le chimique » a redoublé d'efforts dans son génocide du peuple kurde, affirmant constamment qu'il n'avait commis aucune erreur."
 USA_execute_walter: "Exécuter Izzat Ibrahim al-Douri"
 USA_execute_walter_desc: "Ibrahim al-Douri, en tant que bras droit de Saddam, a commis d'innombrables crimes contre l'humanité. Il a été complice du meurtre de milliers, voire de millions de personnes indirectement."
 USA_execute_tilfah: "Exécuter Hani Abd al-Latif Tilfah"
 USA_execute_tilfah_desc: "Selon les allégations, Tilfah a été complice du meurtre de nombreux Irakiens pendant le soulèvement de 1991. Les preuves ont toutefois été insuffisantes jusqu'ici."
 USA_execute_salih: "Exécuter Aziz Saleh Al-Numan"
 USA_execute_salih_desc: "Membre des « Dirty Dozen », Aziz Saleh est responsable de la torture et du meurtre d'innombrables Irakiens."
 USA_SYR_baathists: "Chasse aux ba'athistes iraquiens en §HSyrie [SYR.GetFlag]§!"
 USA_SAU_baathists: "Chasse aux ba'athistes iraquiens en §HArabie Saoudite [SAU.GetFlag]§!"
 USA_JOR_baathists: "Chasse aux ba'athistes iraquiens en §HJordanie [JOR.GetFlag]§!"
 USA_KUR_baathists: "Chasse aux ba'athistes iraquiens au §HKurdistan KDP [KUR.GetFlag]§!"
 USA_PUK_baathists: "Chasse aux ba'athistes iraquiens au §HKurdistan PUK [PUK.GetFlag]§!"
 USA_PER_baathists: "Chasse aux ba'athistes iraquiens en §HIran [PER.GetFlag]§!"
 USA_fugitive_countdown: "Contre-attaque baasiste"
 USA_fugitive_countdown_desc: "Si nous n'exécutons pas au moins 4 figures baasistes d'ici la fin de ce compte à rebours, la communauté du renseignement avertit qu'une contre-attaque baasiste majeure pourrait survenir."
 USA_close_this_menu: "Mettre fin aux opérations ba'athistes"
 USA_close_this_menu_desc: "Il est temps de mettre fin à notre chasse aux cibles ba'athistes, nous avons accompli ce que nous devions."
 USA_SI_green_china_TT: "Ils sont §Hplus susceptibles§! d'accepter si nos relations sont supérieures à §H0§!\n\nImportance stratégique de cette action :\n - En amenant la §HChine [CHI.GetFlag]§! à §Habandonner§! plusieurs §Hchamps pétroliers£oil_texticon§! au profit de l'énergie verte, nous pourrons entraver leur future capacité à approvisionner efficacement leurs armées.\n - Nous devrons cependant prendre en charge la totalité du coût de ce projet qui s'élèvera à environ §R480 milliards de dollars§!"
 USA_RU_transition_TT: "Ils sont §Hplus susceptibles§! d'accepter si nous avons des relations au-dessus de §H0§!\n\nImportance stratégique de cette action :\n - En convainquant [SOV.GetFlag] §Hla Russie§! qu'elle bénéficiera de moins d'industries §Gmilitaires§! et de davantage d'industries §Hciviles§!, nous pouvons affaiblir leur §Gcomplexe militaire§!, sapant leur capacité à produire rapidement des armes en cas de conflit. Ils §Hperdront 8 usines d'armes et en gagneront 16 en échange§!.\n - Nous devrons cependant absorber l'intégralité du coût de ce projet, qui totalisera autour de §R120 milliards de dollars§!"
 USA_somalia_intervention_TT: "Nous pourrons envoyer des §Hforces de volontaires§! à [SOM.GetFlag] §HSomalie§! indépendamment de la tension mondiale.\n\nImportance stratégique de cette action :\n - En mettant fin rapidement au conflit §H[SOM.GetFlag] somalien§!, nous pourrons mettre un terme aux attaques contre nos §Hnavires de fret§! et le commerce transitant par la région.\n - Bien que nous puissions attendre la fin du conflit, nous ne savons pas quand il se terminera. Tant que le conflit perdure, il y aura des §Hattaques continues sur notre fret§!"
 USA_sudan_intervention_TT: "Nous accorderons à [SSU.GetFlag] §HSoudan du Sud§! un modificateur défensif contre [SUD.GetFlag] §HSoudan§!\n - Nous pouvons faire pression sur [KEN.GetFlag] §HKenya§! et [TNZ.GetFlag] §HTanzanie§! pour soutenir [SSU.GetFlag] §HSoudan du Sud§! par des volontaires\n - Nous pouvons soutenir [SSU.GetFlag] §HSoudan du Sud§! en effectuant des raids sur le territoire §H[SUD.GetFlag] soudanais§!\n\nImportance stratégique de cette action :\n - En forçant [SUD.GetFlag] §HSoudan§! à un cessez-le-feu, nous affaiblirons la force de l'Est mondial en Afrique et dans les États voisins."
 USA_sudan_intervention2_TT: "Nous appellerons [KEN.GetFlag] §HKenya§! et [TNZ.GetFlag] §HTanzanie§! à soutenir [SSU.GetFlag] §HSoudan du Sud§! avec des troupes volontaires pour faire pression sur [SUD.GetFlag] §HSoudan§! afin de conclure un accord de paix. Nous payerons toutes les parties impliquées §R$19.00§! depuis notre trésorerie en compensation de leurs pertes."
 USA_south_america_investments_TT: "Ils sont §Hplus susceptibles§! d'accepter si nous avons des relations supérieures à §H20§!\n\nNous exploiterons des §Hmétaux précieux§! en [BRA.GetFlag] §HColombie§!, [COL.GetFlag] §HBrésil§!, et [CHL.GetFlag] §HChili§!. Nous investirons une somme de §G$50B§! dans chaque pays, et extrairons environ §H20§! unités de §Hmétaux précieux§! dans chaque pays.\n\n - Nous contrôlerons ces métaux pendant une période de 10 ans, après quoi notre contrat expirera.\n - Une fois notre contrat expiré, les métaux seront contrôlés par la nation respective.\n\nImportance stratégique de cette action :\n - En investissant dans ces États, nous pourrons plus que §Hdoubler§! nos réserves existantes de §Hmétaux précieux§! pendant un certain temps."
 USA_georgian_peer_pressure_TT: "Ils sont §Hplus susceptibles§! d'accepter si nous avons des relations au-dessus de §H20§! et qu'ils ne sont pas une marionnette de [SOV.GetFlag] §Hla Russie§!\n\nImportance stratégique de cette action :\n - [GEO.GetFlag] §HLa Géorgie§! est divisée et troublée par le séparatisme depuis quelque temps. C'est un effet direct de la poussée néo-impérialiste du Kremlin à jouer à Dieu dans les anciens États soviétiques.\n - Nous armerons [GEO.GetFlag] §Hla Géorgie§! d'armes pour reprendre [SOO.GetFlag] §Hl'Ossétie du Sud§! et [ABK.GetFlag] §Hl'Abkhazie§!.\n - Outre de donner à [GEO.GetFlag] §Hla Géorgie§! nos derniers outils porteurs de liberté, nous leur donnerons une garantie que nous interviendrons en leur nom si le Kremlin fait le mauvais geste.\n - Si le Kremlin choisit de pousser nos boutons, nous appellerons à une intervention de l'OTAN en [GEO.GetFlag] §HGéorgie§!, l'objectif final étant la libération des États du Caucase tenu par [SOV.GetFlag] §Hla Russie§!"
 USA_russian_defeat_TT: "Si tous les objectifs opérationnels sont atteints, les États suivants deviendront indépendants :\n - [DAG.GetFlag] Daghestan\n - [CHE.GetFlag] Tchétchénie\n - [ING.GetFlag] Ingouchie\n - [KBK.GetFlag] Kabardino-Balkarie\n - [KCC.GetFlag] Karatchaï-Tcherkessie"
 USA_stalemate_TT: "Résultats potentiels :\n - Si [GEO.GetFlag] la Géorgie contrôle [ABK.GetFlag] l'Abkhazie ou [SOO.GetFlag] l'Ossétie du Sud, ces territoires seront sous contrôle géorgien.\n - Si [GEO.GetFlag] la Géorgie ne parvient pas à tenir un territoire, les frontières d'avant le conflit seront restaurées, et le Kremlin étendra son influence."
 USA_bolstering_nato_TT: "Nous allons construire §H1 site SHORAD§! dans chaque État de chaque allié de l'§CNATO§!\n\nImportance stratégique de cette action :\n - En équipant nos alliés de l'§CNATO§! de sites SHORAD avancés, ils seraient mieux préparés en cas d'attaque aérienne majeure par une puissance étrangère.\n - Notre influence dans chaque État de l'§CNATO§! augmentera considérablement, empêchant les puissances étrangères de créer des fractures au sein de notre alliance."
 USA_belarus_decision_TT: "Nous travaillerons à évincer le gouvernement §HBiélorusse [BLR.GetFlag]§!\n\nImportance stratégique de cette action :\n - En évincant §H[BLR.GetLeader]§!, nous nuirons gravement à l'influence §HRusse [SOV.GetFlag]§! en Europe de l'Est et renverserons l'un de leurs plus proches alliés.\n - En ayant une §HBiélorussie [BLR.GetFlag]§! amie aux portes du Kremlin, nous pourrions projeter l'influence de l'§CNATO§! dans toute la région."
 USA_blr_coup_TT: "évincer §H[BLR.GetLeader] [BLR.GetFlag]§!"
 USA_blr_civilwar_TT: "une guerre civile qui éclate en §HBiélorussie [BLR.GetFlag]§!"
 USA_ven_civilwar_TT: "a civil war igniting in [VEN.GetFlag] Venezuela"
 USA_creates_new_russia_TT: "Nous allons nous efforcer de former un nouvel État §HRusse [RUS.GetFlag]§!\n - Nous pourrions potentiellement perdre les terres que nous avons occupées en §HRussie [RUS.GetFlag]§!\n - Cette nouvelle §HRussie [RUS.GetFlag]§! fera partie de l'OTAN\n - Ne pas choisir cette option peut avoir des conséquences imprévues"
 USA_pacific_alliance_TT: "Ils sont §Hplus susceptibles§! d'accepter si nos relations sont supérieures à §H20§! et qu'ils sont §Bdémocrates§!\n\nImportance stratégique de cette action :\n - La région du Pacifique tombe rapidement sous l'influence d'une §H[CHI.GetFlag] [CHI.GetName]§! de plus en plus dominante, et cela commence à inquiéter notre communauté du renseignement.\n - En incitant le §H[JAP.GetFlag] Japon§! et d'autres acteurs régionaux comme la §H[KOR.GetFlag] Corée§! à former une faction contre cette menace croissante, nous serions en mesure d'affaiblir considérablement l'influence de la §H[CHI.GetFlag] Chine§! sur la région et de créer un pacte défensif qui garantirait la sécurité de chaque nation."
 USA_arming_saud_TT: "Importance stratégique de cette action :\n - À notre époque, le Moyen-Orient est devenu une région troublée et déchirée par la guerre avec peu d'acteurs régionaux stables, à l'exception d'§HIsraël [ISR.GetFlag]§! et des États du Golfe comme l'§HArabie Saoudite [SAU.GetFlag]§!. Il est impératif que nous nous mobilisions pour armer ces quelques États afin qu'ils soient prêts si une force déstabilisatrice décide de se lancer dans une campagne agressive de destruction."
 USA_backing_moldova_TT: "Importance stratégique de cette action :\n - §H[MLV.GetFlag] La Moldavie§! et §H[UKR.GetFlag] l'Ukraine§! sont victimes de l'approche irrédentiste de Moscou envers l'Europe de l'Est, et plus spécifiquement les États post-soviétiques. Nous soutiendrons la souveraineté de ces nations et les rassurerons qu'elles ont la charge de leurs propres terres.\n - Nous affaiblirons significativement l'influence et le contrôle §H[SOV.GetFlag] russes§! dans la région, surtout si tous nos objectifs sont atteints."
 USA_pressuring_iran_TT: "Importance stratégique de cette action :\n - §H[PER.GetFlag] L'Iran§! se précipite vers la bombe nucléaire, et il n'y a aucun doute à ce sujet. Nous devons faire tout ce qui est en notre pouvoir pour empêcher §H[PER.GetFlag] l'Iran§! d'obtenir une bombe nucléaire, et cela inclura de les sanctionner afin que leur économie s'effondre.\n - En émettant un avertissement maintenant, nous pourrions justifier une attaque à l'avenir sur le sol §H[PER.GetFlag] iranien§! s'ils choisissent d'ignorer la diplomatie et de poursuivre leurs ambitions sadiques."
 USA_2_percent_TT: "Importance stratégique de cette action :\n - Les États de l'§CNATO§! profitent de l'aide américaine depuis bien trop longtemps, et il est grand temps que nous exigions qu'ils augmentent leurs dépenses ou qu'ils risquent les retombées politiques qui s'annoncent.\n - En faisant pression sur nos alliés de l'§CNATO§! pour qu'ils augmentent leurs dépenses, nous aurons la plupart des pays d'Europe sur pied et prêts pour toute invasion potentielle par des puissances étrangères."
 USA_if_iran_loses_TT: "Si [PER.GetFlag] l'Iran perd :\n - Les [USA.GetFlag] États-Unis contrôleront tous les principaux champs pétroliers iraniens\n - Les [USA.GetFlag] États-Unis s'empareront des îles d'Abu Musa\n - Le gouvernement [PER.GetFlag] iranien sera placé sous le contrôle de l'ONU"
 USA_if_iran_wins_TT: "Si [PER.GetFlag] l'Iran résiste :\n - Le gouvernement [PER.GetFlag] iranien gagnera en popularité\n - Les [USA.GetFlag] États-Unis perdront beaucoup d'influence au Moyen-Orient\n - [PER.GetFlag] L'Iran pourra développer son programme nucléaire"
 USA_PER_war_TT: "Importance stratégique de cette action :\n - §H[PER.GetFlag] L'Iran§! a trop longtemps traîné dans les négociations concernant son programme nucléaire. Il est temps de prendre les choses en main.\n - Si nous réussissons à renverser §H[PER.GetFlag] l'Iran§! ou à le forcer à une concession, ils ne pourront plus acquérir de bombe nucléaire.\n - Si nous devons prendre une action militaire contre §H[PER.GetFlag] l'Iran§!, alors nous aurons très probablement un §H[PER.GetFlag] Iran§! amical dans la région une fois de plus."
 USA_CHI_trade_war_TT: "Les pays sont §Hplus susceptibles§! d'accepter si nos relations sont supérieures à §H20§!\n\nImportance stratégique de cette action :\n - La §HChine [CHI.GetFlag]§! a lentement accru son emprise économique sur le monde, et cela inclut l'expansion de son commerce avec nos propres alliés au point que leurs exportations dépassent les nôtres. Il est temps que nous changions cela et que nous rétablissions l'hégémonie économique §Haméricaine [USA.GetFlag]§!.\n - Nous travaillerons à imposer une guerre commerciale contre la §HChine [CHI.GetFlag]§! et à faire en sorte que les États §Calignés sur l'Occident§! coupent le commerce avec le gouvernement §HChinois [CHI.GetFlag]§!.\n - Cela nuira gravement à l'économie de la §HChine [CHI.GetFlag]§! et renforcera la nôtre."
 USA_beating_gaddafi_TT: "Importance stratégique de cette action :\n - Une §HLibye [LBA.GetFlag]§! hostile est une Afrique du Nord hostile. Sans une certaine forme de contrôle sur la région, nous nous rendrions vulnérables à la perte d'un pied-à-terre important dans le monde.\n - En renversant le gouvernement §HLibyen [LBA.GetFlag]§!, nous espérons obtenir un ou des alliés fiables, dignes de confiance et stables en fonction de la gravité du conflit §HLibyen [LBA.GetFlag]§!."
 USA_kicking_china_out_TT: "Importance stratégique de cette action :\n - Les §H[CHI.GetFlag] Chinois§! ont rapidement étendu leur influence sur une grande partie de l'Afrique. Cela menace notre hégémonie économique sur la région et sur une grande partie du monde, ce qui signifie que si nous n'agissons pas maintenant, les §H[CHI.GetFlag] Chinois§! pourraient nous dépasser en tant que superpuissance mondiale.\n - En attaquant l'influence §H[CHI.GetFlag] Chinoise§! à travers l'Afrique, nous serions en mesure de sauver la région d'une potentielle prise de contrôle hostile. Il y a aussi l'avantage supplémentaire que notre influence remplace celle des §H[CHI.GetFlag] Chinois§!, mais ce n'est pas pour cela que nous le faisons, n'est-ce pas ?"
 USA_russian_reset_TT: "Ils sont §Hplus susceptibles§! d'accepter si nous avons des relations supérieures à §H0§!\n\nImportance stratégique de cette action :\n - Nous sommes rivaux avec la §H[SOV.GetFlag] Russie§! depuis aussi longtemps que nous nous en souvenions, avec peu ou pas d'efforts pour établir un traité officiel entre nos nations.\n - En 'réinitialisant' les relations, nous pourrions apaiser les tensions dans le monde dans l'espoir d'un avenir meilleur.\n - Dans le cadre du traité, nous exigerons le désarmement des armes nucléaires et de leurs vecteurs, réduisant considérablement le nombre d'armes nucléaires dans le monde."
 USA_support_ISR_TT: "Importance stratégique de cette action :\n - [ISR.GetFlag] §HIsraël§! est vulnérable aux attaques des États étrangers, en particulier ceux du Moyen-Orient et des États d'Afrique du Nord. Si nous ignorons leur situation, ils pourraient être victimes de ces attaques.\n - Si nous soutenons militairement [ISR.GetFlag] §HIsraël§!, non seulement nous aurons un allié fort, mais nous gagnerons également un levier significatif sur eux, facilitant grandement la propagation de notre influence."
 department_of_state.60.t: "Les États-Unis exigent une augmentation des dépenses militaires"
 department_of_state.60.d: "Le président des États-Unis, [USA.GetLeader], a exigé que nous augmentions les dépenses militaires pour atteindre le minimum de 2 % fixé par les normes de l'alliance. Les États-Unis menacent de représailles économiques si nous décidons de ne pas augmenter les dépenses."
 department_of_state.60.a: "Nous n'avons pas le choix"
 department_of_state.60.b: "Jamais"
 department_of_state.61.t: "[FROM.GetName] refuse de répondre au seuil"
 department_of_state.61.d: "[FROM.GetName] n'a pas satisfait à nos exigences pour une augmentation des dépenses militaires, ce qui a provoqué l'indignation à la Maison Blanche. Nous envisageons une forme de conséquence en retour, mais cela reste à décider."
 department_of_state.61.a: "Imposez-leur des tarifs !"
 department_of_state.61.b: "Nous bluffions de toute façon"
 department_of_state.62.t: "Washington lance un ultimatum"
 department_of_state.62.d: "Les États-Unis nous ont donné un choix : soit nous permettons aux forces américaines d'entrer en Iran et de démanteler et observer notre technologie nucléaire, soit nous les affrontons sur le champ de bataille. C'est encore un symptôme de l'agression et de l'impérialisme américains, démontrant que peu importe à quel point nous essayons de négocier, ils feront ce qu'ils veulent."
 department_of_state.62.a: "D'accord, laissez-les entrer"
 department_of_state.62.b: "Ordonnez aux forces armées de se tenir prêtes"
 department_of_state.63.t: "L'Iran rejette nos conditions"
 department_of_state.63.d: "Dans un mouvement presque suicidaire, le gouvernement iranien a décidé de déchirer notre ultimatum officiel émis plus tôt cette semaine. Cela signifie presque certainement qu'ils souhaitent continuer leur programme nucléaire, et nous n'avons d'autre choix que de prendre les choses en main."
 department_of_state.63.a: "Iran, vous avez fait une grave erreur"
 department_of_state.63.b: "Nous bluffions"
 department_of_state.64.t: "L'Iran cède"
 department_of_state.64.d: "Dans une démarche peu surprenante, le gouvernement iranien a annoncé aujourd'hui qu'il cédera aux exigences américaines et permettra aux experts américains de démanteler leur programme nucléaire."
 department_of_state.64.a: "Bon choix, Iran"
 department_of_state.65.t: "Les forces armées iraniennes se mobilisent"
 department_of_state.65.d: "L'armée iranienne a déclaré aujourd'hui une mobilisation générale de toutes les unités à travers le pays pour contrer toute agression américaine sur son sol. Cette décision intervient après les demandes américaines que l'Iran leur permette d'envoyer des observateurs et des experts pour démanteler la technologie nucléaire iranienne. Cette demande a bien sûr été rejetée, ce qui a provoqué une réponse immédiate du gouvernement américain. Le Congrès des États-Unis a approuvé aujourd'hui des frappes sur le sol iranien, une décision qui a choqué toute la nation, l'opinion anti-guerre étant élevée au sein de la société américaine depuis des décennies."
 department_of_state.65.a: "Une invasion de l'Iran ? C'est fou"
 department_of_state.65.b: "L'aigle de l'impérialisme s'en prend à ses victimes une fois de plus"
 department_of_state.66.t: "Les forces américaines se retirent d'Iran"
 department_of_state.66.d: "Lors d'une conférence de presse embarrassante aujourd'hui, [USA.GetLeader] a annoncé un retrait total d'Iran et un appel immédiat à un cessez-le-feu entre les deux nations. Cela survient alors que les forces américaines ont échoué à plusieurs reprises à atteindre les objectifs opérationnels, aboutissant à une impasse dans les régions rocailleuses d'Iran. De lourdes pertes et des coûts exorbitants ont aussi contribué à ce geste, la pression du public pesant sur le soutien continu au conflit. Les médias d'État iraniens et la télévision ont déjà commencé à célébrer la victoire et à surfer sur une vague de popularité et de soutien renouvelés. On rapporte aussi que l'Iran poursuivra sa position d'avant-guerre sur ses ambitions nucléaires, ce qui signifie que le conflit n'a abouti à guère plus qu'un bain de sang inutile."
 department_of_state.66.a: "Qui l'aurait deviné ?"
 department_of_state.67.t: "Les forces iraniennes s'effondrent sous la pression américaine"
 department_of_state.67.d: "Plus tôt aujourd'hui, un porte-parole officiel des forces armées iraniennes a annoncé leurs conditions officielles de reddition pour le conflit et a accepté d'ordonner un arrêt immédiat des opérations, effectif immédiatement. Cette annonce a entraîné l'effondrement du gouvernement iranien, plusieurs hauts responsables ayant fui vers d'autres parties du monde aujourd'hui. Bien que les forces armées iraniennes ne soient pas dissoutes à la suite des termes de la reddition, elles seront placées sous la supervision de l'ONU aux côtés d'autres actifs gouvernementaux iraniens jusqu'à ce qu'un remplaçant approprié puisse être trouvé."
 department_of_state.67.a: "L'Iran va-t-il se fracturer ?"
 department_of_state.68.t: "Victoire sur l'Iran"
 department_of_state.68.d: "Notre victoire en Iran signifie que nous ne rentrons pas chez nous les mains vides. Nous avons établi des zones de sécurité autour des champs pétrolifères iraniens et avons engagé plusieurs grandes entreprises pour commencer les opérations plus tard cette année. Nous avons également saisi les îles stratégiquement importantes d'Abu Musa dans le détroit d'Ormuz comme moyen de projeter davantage de puissance navale."
 department_of_state.68.a: "Les armes nucléaires ne sont pas aussi importantes que l'or noir"
 department_of_state.69.t: "Triomphe sur l'envahisseur"
 department_of_state.69.d: "Nous avons surmonté l'impossible et vaincu l'armée américaine envahissante. Aujourd'hui sera célébré comme le jour de la victoire pour les siècles à venir."
 department_of_state.69.a: "En avant !"
 department_of_state.70.t: "Reza Pahlavi accède au pouvoir"
 department_of_state.70.d: "La mission de l'ONU en Iran a décidé qu'elle accordera à Reza Pahlavi le contrôle de la nation. Cette décision bénéficie d'un large soutien au sein de notre gouvernement et de plusieurs États alliés."
 department_of_state.70.a: "D'accord"
 department_of_state.71.t: "Rébellion dans le Khorasan"
 department_of_state.71.d: "Il semble que l'invasion américaine ratée ait conduit à une révolte dans le Khorasan, risquant l'effondrement de l'ensemble de l'État et ramenant l'Iran sous une domination chiite radicale."
 department_of_state.71.a: "Merde"
 department_of_state.71.b: "Bien... (jouer en tant que)"
 department_of_state.72.t: "Insurrection dans l'est de l'Iran"
 department_of_state.72.d: "Des coups de feu ont retenti à Mashhad et dans d'autres villes de la région du Khorasan en Iran plus tôt aujourd'hui, perturbant les résidents et les troupes de maintien de la paix. Des rumeurs d'insurrection circulaient depuis l'invasion américaine, avec d'anciens officiers et unités de l'IRGC se ralliant sous une confédération lâche de clercs se réfugiant à la campagne. Il semble qu'ils se soient officiellement rassemblés sous l'ayatollah radical Mohammad-Taqi Mesbah-Yazdi, qui a juré de marcher avec ses hommes sur Téhéran d'ici la fin du mois. Les doigts pointent dans toutes les directions, mais la principale accusation est portée contre les États-Unis, accusés d'avoir mis en place un processus de paix bâclé et de ne pas avoir établi les mesures de sécurité nécessaires pour empêcher une insurrection comme celle que nous voyons maintenant."
 department_of_state.72.a: "Oh merde"
 department_of_state.73.t: "Les États-Unis nous demandent de réduire nos affaires avec la Chine"
 department_of_state.73.d: "Le gouvernement des États-Unis a envoyé une requête formelle à des dizaines de nations, demandant formellement que tout commerce et toute coopération économique avec la Chine cessent immédiatement. Les États-Unis ont déclaré que, pour une courte période, nous devons participer à une protestation mondiale contre le néo-impérialisme chinois et leurs pratiques louches, qui impliquent notamment le piège de la dette pour les plus petites nations."
 department_of_state.73.a: "La Chine doit apprendre que ses actions ont des conséquences"
 department_of_state.73.b: "Nous ne provoquerons pas nos amis chinois"
 department_of_state.74.t: "Les États-Unis déclenchent une guerre commerciale dangereuse"
 department_of_state.74.d: "Les États-Unis ont envoyé aujourd'hui des lettres et des requêtes à des dizaines de nations, demandant qu'elles cessent immédiatement toute activité économique avec notre nation. Cette démarche témoigne de la nature malveillante, jalouse et avide de pouvoir des Américains. Nous prendrons note de ceux qui trahissent notre confiance, et nous n'oublierons pas l'humiliation que les États-Unis ont tenté de nous infliger."
 department_of_state.74.a: "Qu'est-ce que c'est que ça, l'Amérique ?"
 department_of_state.75.t: "Le Venezuela sombre dans la guerre civile"
 department_of_state.75.d: "Suite à une longue évaluation des renseignements, les États-Unis ont prédit que les rebelles démocratiques vénézuéliens se soulèveraient bientôt contre le régime de [VEN.GetLeader]. Sans surprise, leurs prédictions se sont réalisées et correspondent presque parfaitement au résultat prévu par les Américains. Cette précision terrifiante a conduit certains à croire que les États-Unis sont à l'origine du chaos qui engloutit maintenant le Venezuela. Les forces d'opposition unies derrière Leopoldo Lopez mènent un conflit total contre l'ordre dirigeant vénézuélien. Les États-Unis ont juré de soutenir les forces rebelles, déclarant que le renversement du régime vénézuélien est un objectif qui ne doit pas être compromis."
 department_of_state.75.a: "Une autre nation devient un simple champ de bataille"
 department_of_state.75.b: "La cupidité occidentale ne connaît pas de limites"
 department_of_state.76.t: "Une guerre commerciale éclate entre les États-Unis et la Chine"
 department_of_state.76.d: "Plus tôt cette semaine, [USA.GetLeader] a autorisé la publication de plusieurs documents énumérant les griefs des États-Unis contre l'État chinois. Le point principal de ces documents était l'inquiétude américaine concernant l'« impérialisme économique » chinois. Suite à la publication de ces documents, les États-Unis ont émis plusieurs requêtes à des dizaines de nations à travers le monde, demandant officiellement que les nations réduisent leur coopération économique avec la Chine et se tournent vers des États ayant « un historique plus fiable ». [CHI.GetLeader] a publié une déclaration condamnant cette démarche et la qualifiant de puérile."
 department_of_state.76.a: "Au moins mes comptes offshore sont encore en sécurité"
 department_of_state.76.b: "Ces satanés Américains"
 department_of_state.77.t: "Les États-Unis souhaitent 'réinitialiser' les relations"
 department_of_state.77.d: "Le gouvernement des États-Unis est venu nous demander de nous joindre à leur agenda de « reset ». Le geste n'est pas venu de nulle part : il a été discuté et débattu par les politiciens américains pendant des mois. Maintenant, cependant, il semble enfin qu'ils se soient décidés, paraissant plus déterminés que jamais à ce que nous signions leur traité. Un pilier clé du programme de « reset » est le désarmement des armes nucléaires et des transports, ce que beaucoup dans notre État se sentent mal à l'aise de faire. Cependant, les Américains ont promis de suivre et de désarmer aussi une portion de leur stock si nous décidons de signer leur traité et de poser pour les médias."
 department_of_state.77.a: "D'accord, nous signerons"
 department_of_state.77.b: "Nous sommes bien au-delà de ça, l'Amérique"
 department_of_state.78.t: "Les États-Unis interviennent en Libye"
 department_of_state.78.d: "Le gouvernement américain a décidé qu'il était dans son intérêt de commencer une intervention en Libye pour aider à renverser son dirigeant, [LBA.GetLeader]. Les États-Unis déploient des troupes sur le terrain, bien que peu nombreuses. Ces forces seront principalement là pour maintenir la paix et repousser les forces de [LBA.GetLeader]. À l'intérieur du pays, cette démarche est fortement critiquée par les manifestants anti-guerre et les isolationnistes, qui estiment que les États-Unis ne devraient pas s'impliquer dans les conflits d'autres nations pour le bien de la 'stabilité'. Pourtant, le président américain [USA.GetLeader] insiste sur le fait que cette mesure est nécessaire pour éviter davantage de bain de sang."
 department_of_state.78.a: "D'accord, si vous insistez"
 department_of_state.79.t: "Les États-Unis portent gravement atteinte à notre influence en Afrique"
 department_of_state.79.d: "Les États-Unis ont lancé une vaste campagne pour débarrasser l'Afrique de toute notre influence. Ils ont mené des opérations significatives pour y parvenir, et chaque nation dans laquelle nous avions de l'influence est maintenant affectée."
 department_of_state.79.a: "Ces salauds"
 department_of_state.80.t: "La Russie accepte de 'réinitialiser' les relations !"
 department_of_state.80.d: "Le gouvernement russe a accepté de 'réinitialiser' les relations diplomatiques et a consenti à désarmer une partie de ses stocks d'armes nucléaires. Comme promis, nous sommes également attendus pour désarmer une partie de nos propres stocks. Nous rencontrerons également les dirigeants russes plus tard cette semaine pour annoncer publiquement cette démarche."
 department_of_state.80.a: "Bien !"
 department_of_state.81.t: "La Russie refuse de 'réinitialiser' les relations !"
 department_of_state.81.d: "Le gouvernement russe semble peu intéressé à 'réinitialiser' les relations, déclarant que les relations sont actuellement à un point irréparable. Ils affirment également que notre gouvernement ne peut pas être digne de confiance en raison des changements constants de leadership."
 department_of_state.81.a: "Ils doivent préparer quelque chose de louche..."
 department_of_state.82.t: "Les États-Unis et la Russie 'réinitialisent' leurs relations"
 department_of_state.82.d: "Lors d'une conférence de presse organisée par les ministres des affaires étrangères russe et américain aujourd'hui, l'annonce a été faite que les États-Unis et la Russie 'réinitialiseront' officiellement leurs relations. Un bouton portant le mot 'reset' a été tenu par les deux parties et pressé en même temps pour symboliser la réinitialisation officielle des relations entre les deux puissances rivales. Pendant des décennies, les États-Unis et la Russie se sont affrontés dans un jeu d'échecs sans fin, utilisant le monde comme leur échiquier et les nations individuelles comme leurs pièces. Aujourd'hui, il semble y avoir de l'espoir, de l'espoir pour un avenir plus lumineux, de l'espoir pour une résolution pacifique du problème nucléaire, et de l'espoir pour une coopération entre les puissances mondiales. Il faut noter que l'initiative pourrait s'effondrer, et le monde pourrait revenir à l'état d'hostilité antérieur à la 'réinitialisation' des relations."
 department_of_state.82.a: "Un pas tremendous pour l'humanité !"
 department_of_state.83.t: "L'Amérique fournit un soutien militaire"
 department_of_state.83.d: "Les États-Unis ont proposé de former nos unités pour nous, insistant sur le fait que seule l'expertise américaine pourrait sauver Israël d'être victime d'États ennemis."
 department_of_state.83.a: "D'accord"
 department_of_state.83.b: "Non"
 department_of_state.84.t: "L'OTAN commence à armer et soutenir l'Ukraine"
 department_of_state.84.d: "Plusieurs nations de l'OTAN, y compris les États-Unis, se sont manifestées en déclarant leur soutien total et inconditionnel à l'Ukraine. Elles affirment qu'en raison de l'agression russe, elles n'ont d'autre choix que d'envoyer immédiatement des armes à l'Ukraine pour démontrer à Moscou que la communauté internationale a des lois et un ordre. Le gouvernement russe a déclaré que cette démarche est provocatrice et pourrait mener à une guerre, mais les dirigeants occidentaux mettent en doute le bluff de [SOV.GetLeader]. Le dirigeant ukrainien [UKR.GetLeader] a soutenu cette démarche, déclarant qu'il est 'juste' de soutenir l'indépendance ukrainienne face à l'agression russe."
 department_of_state.84.a: "L'Ukraine a le droit de se défendre !"
 department_of_state.84.b: "L'Ukraine n'est qu'un simple pion dans un jeu d'échecs"
 department_of_state.85.t: "Les États-Unis demandent un soutien unilatéral pour l'Ukraine"
 department_of_state.85.d: "L'État ukrainien est sous l'assaut russe, et les États-Unis affirment que seule l'OTAN en tant qu'alliance pourrait aider à arrêter la machine de guerre russe. On nous demande aussi d'envoyer des volontaires étrangers dans le cadre de la légion étrangère ukrainienne pour aider militairement l'armée ukrainienne."
 department_of_state.85.a: "Tout de suite !"
 department_of_state.85.b: "Non"
 department_of_state.86.t: "Bombardement atomique de la Russie"
 department_of_state.86.d: "L'impensable s'est produit. Plus tôt aujourd'hui, plusieurs missiles nucléaires américains ont été lancés depuis des silos vers des grandes villes russes non occupées par les forces alliées et les ont dévastées. Bien que le nombre de morts n'ait pas été officiellement mesuré, les villes touchées seraient contaminées par des radiations, les rendant pratiquement inhabitables. Des décennies de diplomatie de la guerre froide n'ont servi à rien, car de nombreuses villes sont en ruines. Une réponse est attendue du Kremlin."
 department_of_state.86.a: "« La quatrième guerre mondiale sera menée avec des bâtons et des pierres »"
 department_of_state.87.t: "Bombardement atomique de l'Amérique"
 department_of_state.87.d: "L'impensable s'est produit. Plus tôt aujourd'hui, plusieurs missiles nucléaires russes ont été lancés depuis des silos vers des grandes villes américaines non occupées par leurs forces et les ont dévastées. Bien que le nombre de morts n'ait pas été officiellement mesuré, les villes touchées seraient contaminées par des radiations, les rendant pratiquement inhabitables. Des décennies de diplomatie de la guerre froide n'ont servi à rien, car de nombreuses villes sont en ruines. Une réponse est attendue de Washington."
 department_of_state.87.a: "« La quatrième guerre mondiale sera menée avec des bâtons et des pierres »"
 department_of_state.88.t: "Bombardements atomiques de l'Europe"
 department_of_state.88.d: "L'impensable s'est produit. Plus tôt aujourd'hui, plusieurs missiles nucléaires russes ont été lancés depuis des silos vers des capitales européennes majeures non occupées par leurs forces et les ont dévastées. Bien que le nombre de morts n'ait pas été officiellement mesuré, les villes touchées seraient contaminées par des radiations, les rendant pratiquement inhabitables. Des décennies de diplomatie de la guerre froide n'ont servi à rien, car de nombreuses villes sont en ruines. Une réponse est attendue de ces États. Il est dit que seuls les États impliqués dans le conflit contre la Russie ont été touchés."
 department_of_state.88.a: "« La quatrième guerre mondiale sera menée avec des bâtons et des pierres »"
 department_of_state.89.t: "Notre capitale a été frappée par une arme nucléaire !"
 department_of_state.89.d: "Un missile balistique intercontinental russe a frappé notre capitale aujourd'hui, entraînant une destruction inimaginable sur la ville. La zone a été contaminée par des radiations, et beaucoup sont morts en conséquence. Le nombre total de morts est inconnu pour le moment."
 department_of_state.89.a: "Ces foutus Russes !"
 department_of_state.90.t: "Istanbul a été frappée par une arme nucléaire !"
 department_of_state.90.d: "Un missile balistique intercontinental russe a frappé Istanbul aujourd'hui, entraînant une destruction inimaginable sur la ville. La zone a été contaminée par des radiations, et beaucoup sont morts en conséquence. Le nombre total de morts est inconnu pour le moment."
 department_of_state.90.a: "Ces foutus Russes !"
 department_of_state.91.t: "Plusieurs villes frappées par des missiles balistiques russes"
 department_of_state.91.d: "Plusieurs de nos grandes villes ont été frappées par des missiles balistiques intercontinentaux russes. Les villes touchées sont Washington D.C., Los Angeles, New York, Miami et Austin. Ces villes ont été contaminées par des radiations, et l'ampleur des dégâts est inconnue pour le moment."
 department_of_state.91.a: "Ces foutus Russes"
 department_of_state.92.t: "Plusieurs villes frappées par des missiles balistiques américains"
 department_of_state.92.d: "Plusieurs de nos grandes villes ont été frappées par des missiles balistiques intercontinentaux américains. Les villes touchées sont Moscou, Saint-Pétersbourg, Volgograd, Iekaterinbourg et Kemerovo. Ces villes ont été contaminées par des radiations, et l'ampleur des dégâts est inconnue pour le moment."
 department_of_state.92.a: "Ces foutus Américains"
 saddam_TT: "§HAs de Pique§!\nSaddam Hussein Al-Tikriti\nPrésident\n\n§gSaddam changera de cachette tous les 2 mois !§!"
 qusay_TT: "§HAs de Trèfle§!\nQusay Saddam Hussein\nFils de Saddam Hussein"
 uday_TT: "§HAs de Cœur§!\nUday Saddam Hussein\nFils de Saddam Hussein"
 abid_TT: "§HAs de Carreau§!\nAbid Hamid Mahmud\nSecrétaire présidentiel"
 majid_TT: "§HRoi de Pique§!\nAli Hassan al-Majid 'Ali le Chimique'\nConseiller présidentiel/Membre du CCR"
 walter_TT: "§HRoi de Trèfle§!\nIzzat Ibrahim al-Douri\nVice-président du CCR"
 tilfah_TT: "§HLe roi de cœur§!\nHani Abd al-Latif Tilfah\nDirecteur—Organisation de sécurité spéciale"
 salih_TT: "§HRoi de Carreau§!\nAziz Saleh Al-Numan\nPrésident de la branche du parti Baas"
 IRQ_kill_3_baathists_TT: "Au moins 4 chefs ba'athistes ont été capturés et exécutés"
 raid_type_raid_baath: "Chasse aux cibles baasistes"
 USA_foreign_policy: "Département d'État"
 USA_foreign_policy_desc: "Le Département d'État des [USA.GetFlag] États-Unis, fondé en 1789, est un bras administratif de la branche exécutive. Considéré comme l'une des agences les plus puissantes du gouvernement, le Département d'État est dirigé par le Secrétaire d'État. Rendant compte directement uniquement au Président des [USA.GetFlag] États-Unis, le Département d'État est en charge des affaires étrangères.\n\nÀ chaque élection, une série de nouvelles décisions sera débloquée pour ce candidat. Les décisions précédentes disparaîtront avec les nouvelles élections, et certains changements dans le monde pourraient entraîner l'apparition de nouvelles décisions."
 USA_doing_decision: "Prend une autre décision"
 USA_KUW_baathists: "Traque des baasistes irakiens au Koweït [KUW.GetFlag]"
 department_of_state.94.t: "Les talibans reprennent leur offensive"
 department_of_state.94.d: "Les talibans ont annoncé aujourd'hui qu'ils renouvelleraient leur offensive contre le gouvernement [AFG.GetLeader]. Cette décision n'est pas une surprise suite au retrait précipité des États-Unis dû aux pressions domestiques sur l'administration actuelle. Il ne reste qu'une Afghanistan fracturé, meurtri et affaibli, laissé seul pour se défendre contre un adversaire bien plus féroce. Plusieurs États ont promis de nouveau de venir en aide à l'Afghanistan si nécessaire, mais leur parole ne vaut que par leur volonté de tenir une telle promesse. Reste à voir si l'État afghan pourra contenir les talibans par ses propres moyens, mais il est probable que l'armée ne puisse opposer qu'une faible résistance."
 department_of_state.94.a: "L'État afghan va-t-il s'effondrer à nouveau ?"
 department_of_state.200.t: "Rapport sur les pertes en Afghanistan"
 department_of_state.200.d: "Nous avons perdu des hommes et des femmes courageux dans les combats en Afghanistan, et leurs cercueils reviennent aux États-Unis pour un enterrement approprié."
 department_of_state.200.a: "Semper Fi"
 department_of_state.31.c: "À quoi bon faire quoi que ce soit de toute façon"
 department_of_state.95.t: "Vente des destroyers de classe Kidd"
 department_of_state.95.d: "Récemment, les [USA.GetName] nous ont proposé de nous vendre les destroyers de classe Kidd qui ont été désactivés il y a quelques années. Il s'agit d'une série de puissants destroyers lance-missiles initialement commandés par la marine impériale iranienne, mais annulés en raison de la révolution iranienne de 1979. Ils ont depuis été modernisés et réactivés à partir du stock de la marine américaine désactivée, dans le but de vendre les navires. Devons-nous acheter ces navires pour renforcer notre position en cas d'invasion de notre nation par le continent ?"
 department_of_state.95.a: "Signer le chèque."
 department_of_state.95.b: "Nous passerons"
 USA_sale_of_the_kidd_destroyer: "[TAI.GetFlag] Vente du destroyer de classe Kidd à [TAI.GetName]"
 USA_sale_of_the_kidd_destroyer_desc: "Nous avons eu du mal à vendre les destroyers de classe Kidd, mais [TAI.GetNameWithFlag] a montré de l'intérêt à les acheter pour renforcer ses stratégies défensives contre [CHI.GetNameWithFlag]."
 department_of_state.96.t: "Opération Absolute Resolve : réussite"
 department_of_state.96.d: "Alors que le président suivait l'opération depuis la salle de crise, des unités des forces spéciales ont pris d'assaut la résidence du dictateur vénézuélien, Nicolas Maduro. L'ayant rapidement appréhendé alors qu'il tentait de s'enfuir dans une pièce sécurisée, les soldats américains l'ont embarqué à bord d'un avion et l'ont transféré sur le sol américain. Il devrait être jugé par les tribunaux américains et condamné pour trafic de drogue. L'opération aurait duré quelques heures seulement."
 department_of_state.96.a: "Voilà comment on fait une opération de 3 heures"
 department_of_state.97.t: "Les États-Unis lancent un raid"
 department_of_state.97.d: "Les États-Unis ont commis un acte de guerre flagrant : ils ont soumis notre nation à une campagne de bombardements et ont enlevé notre président. Un tel acte ne saurait rester impuni, et nos forces armées sont de plus en plus prêtes à résister à toute tentative d’occupation. Cependant, les États-Unis ont proposé de suspendre toute nouvelle action si nous coopérons, mais accepter reviendrait à leur permettre de contrôler temporairement le pays."
 department_of_state.97.a: "Nous ne resterons pas sur le dos !"
 department_of_state.97.b: "Nous n'avons pas le choix, nos mains sont liées"
 department_of_state.98.t: "Les États-Unis capturent le leader vénézuélien"
 department_of_state.98.d: "Les États-Unis ont mené un raid aérien nocturne au Venezuela, pays pétrolier d'Amérique du Sud. Cette action intervient après des semaines d'accusations du président américain, qui affirme que le dirigeant vénézuélien déstabilise la région en facilitant le trafic de stupéfiants. Le raid, baptisé « Opération Résolution Absolue », a été un succès et a permis la capture de Nicolas Maduro, dictateur du Venezuela depuis de nombreuses années. Bien que les États-Unis n'aient pas précisé comment ils entendent faciliter la transition du pouvoir, ils ont clairement affirmé leur contrôle sur le pays et appellent le gouvernement vénézuélien restant à collaborer jusqu'à la désignation d'un successeur."
 department_of_state.98.a: "Un développement préoccupant"
 raid_type_USA_raid_venezuela: "Opération Résolution Absolue"
 raid_type_USA_raid_venezuela_desc: "L'objectif de cette opération est de capturer le dirigeant vénézuélien et de le ramener sain et sauf aux États-Unis pour qu'il y soit jugé. Les services de renseignement ont averti qu'en cas de dérapage, un vide du pouvoir pourrait engendrer une insurrection."
 USA_invasion_in_iraq_mission: "Invasion de l'Irak"
 USA_invasion_in_iraq_mission_desc: "Plus nous tardons, moins notre volonté d'envahir l'Irak se justifie. Si nous voulons mener à bien cette invasion, nous devons intervenir dans l'année à venir, faute de quoi notre justification de guerre ne sera plus valable."
 USA_failed_to_invade_iraq_idea: "L'humiliation nationale"
 USA_failed_to_invade_iraq_idea_desc: "Notre échec à lancer des opérations militaires contre l'Irak, quelles qu'en soient les raisons, laisse les attentats terroristes sans réponse. Cette inaction endommagera gravement notre crédibilité et enhardira nos adversaires pour des années."
 USA_early_2000s_energy_crisis: "La crise énergétique"
 USA_early_2000s_energy_crisis_desc: "Les perturbations du marché pétrolier mondial et l'instabilité au Moyen-Orient ont provoqué une hausse de la consommation alors que les gens cherchent le meilleur prix possible à la pompe, ce qui a inversement augmenté la consommation de pétrole et de produits pétroliers, causant de nouvelles pénuries et difficultés."
 usa_economic_events.36.t: "La Grande Récession résonne"
 usa_economic_events.36.d: "Les médias et l'économie américains rapportent des chiffres de plus en plus sidérants à la minute. L'effondrement continue d'ébranler le cœur même et les fondations de l'économie mondiale, provoquant des ondes de choc de l'Argentine à la Grèce jusqu'à la Nouvelle-Zélande. Personne sur la planète n'a été épargné par cette Petite Dépression. Le temps dira vraiment jusqu'où le mal ira..."
 usa_economic_events.36.a: "Injectez des liquidités !"
 usa_economic_events.36.b: "Le marché libre qui se libère..."
 usa_economic_events.37.t: "La crise de l'industrie automobile américaine"
 usa_economic_events.37.d: "L'industrie automobile, déjà aux prises avec des ventes en berne et des dettes croissantes, affronte désormais un effondrement catastrophique à mesure que la crise du crédit s'approfondit. Les Big Three (General Motors, Ford et Chrysler) perdent des milliards de dollars et préviennent que, sans intervention gouvernementale immédiate, ils pourraient être contraints à la faillite en quelques mois. Des milliers d'emplois sont en jeu, pas seulement à Detroit mais dans toute la chaîne d'approvisionnement qui traverse le pays. La question est maintenant de savoir si Washington sauvera une industrie que beaucoup voient comme le symbole de la puissance manufacturière américaine, ou laissera les forces du marché en décider..."
 usa_economic_events.37.a: "Cela peut-il empirer ?"
 usa_economic_events.38.t: "La crise énergétique des années 2000"
 usa_economic_events.38.d: "Les prix du pétrole ont grimpé à des niveaux inédits, poussés par une demande mondiale croissante, l'instabilité géopolitique au Moyen-Orient et la spéculation sur les marchés des matières premières. Les consommateurs américains sentent la douleur à la pompe alors que les prix de l'essence montent sans relâche, pesant sur des budgets déjà meurtris par la récession. La crise énergétique se propage dans toute l'économie. Les coûts de transport s'envolent, les compagnies aériennes peinent, et les entreprises dépendantes du carburant voient leurs marges s'évaporer. Pendant ce temps, les appels à l'indépendance énergétique et aux carburants alternatifs se font plus forts alors que les Américains mesurent leur vulnérabilité aux marchés pétroliers volatils. La question est de savoir s'il s'agit d'un pic temporaire ou du début d'une ère d'énergie chère..."
 usa_economic_events.38.a: "Eh bien, le prix de l'essence dépassera certainement 2,00 $ !"
 usa_economic_events_news.7.t: "La crise énergétique des années 2000"
 usa_economic_events_news.7.d: "Les prix du pétrole ont atteint des records sur les marchés mondiaux. Les analystes énergétiques prédisent que les coûts du carburant resteront élevés dans un avenir prévisible, la demande continuant de dépasser l'offre. Il sera vraiment intéressant de voir si le monde devra simplement payer plus cher ce pétrole ou s'il cherchera des alternatives dans ce monde en perpétuel changement."
 usa_economic_events_news.7.a: "Un jour de plus... Une crise économique de plus..."
 usa_economic_events.37.b: "Voir si on peut jeter de l'argent sur le problème..."
