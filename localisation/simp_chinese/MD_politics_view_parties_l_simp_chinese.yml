 VIE.liberalism: "£generic_liberalism_small 越南更新革命党"
 VIE.liberalism_desc: "（改良主义） - 作为越南境内的非法政党，越南革新革命党主张在国内推行自由民主，寻求以非暴力方式表达对执政的越南共产党的反对。"
 VIE.socialism: "£generic_socialism_small 越南人民行动党"
 VIE.socialism_desc: "（亲民主保守主义） - 人民行动党仅能在海外活动，难以获得支持或形成比亲民主、反对越共统治更连贯的意识形态。"
 VIE.Neutral_Communism: "£generic_Neutral_Communism_small （CPV）越南共产党"
 VIE.Neutral_Communism_desc: "（改革派共产主义） - 由胡志明于1930年合并多个共产主义组织创立，越南共产党在其大部分历史中都在为反抗外国统治而斗争。该党奉行越南民族主义与马克思列宁主义思想的结合，在冷战期间为实现在共产主义统治下统一国家而奋斗，与西方世界对立，并与苏联及经互会结盟。统一后，该党曾短暂与从属政党共同参与选举，但到90年代，大多数从属政党已被完全吸收进越共自身。随着东方集团的解体和中国政治的变化，越共采取了日益革新的立场；采纳市场经济改革要素，并寻求与西方建立更紧密的联系。"
 VIE.Nat_Autocracy: "£generic_Nat_Autocracy_small 越南人民军"
 VIE.Nat_Autocracy_desc: "（红色军政府） - 越南人民武装力量成立于1944年，曾多次在兵力与装备均处劣势的情况下作战 - 其早期活动多集中于抵抗运动而非正面交战。作为高度政治化的武装力量，越南人民武装力量始终在越南共产党的直接领导下发展，其组织架构确保军队与国家革命事业保持意识形态的高度统一。"
 VIE.Monarchist: "£generic_Monarchist_small 阮朝王室"
 VIE.Monarchist_desc: "（宗教君主主义） - 在经历了法国征服和二战期间日本占领的双重考验后，越南的统治家族直到1955年公投才被完全废黜。由于对法日利益的妥协以及接纳西方宗教，许多人视该王朝为傀儡统治者 - 甚至该家族现任首领也与法国保持着密切关联。"
 WAA.Autocracy: "£WAA_Autocracy （UWSP）佤邦联合党（务实派）"
