 CZE_head_of_the_nato_military_committee_idea_desc: "§R미국과 같은 세력이 아니게 되면 취소됩니다§!"
 CZE_SLO_renovation_of_the_czechoslovakian_maginot_line: "체코슬로바키아 마지노선 개수"
 CZE_SLO_renovation_of_the_czechoslovakian_maginot_line4_idea: "서부 방어선"
 CZE_SLO_renovated_forts_idea: "개수된 요새"
 CZE_airborneform_idea: "공수부대 개편"
 CZE_SLO_economic_aid: "경제 원조"
 CZE_SLO_economic_aid_desc: "산업 보강에는 막대한 자금이 필요합니다. 이웃 나라가 다소 어려움을 겪고 있으니 자금을 지원해 도와 줍시다."
 CZE_SLO_regional_dominance: "지역 패권"
 CZE_SLO_regional_dominance_desc: "우리는 이웃보다 우월합니다. 그들과 권력을 나누는 것은 우리에게 너무 큰 문제이니, 우리가 주도권을 잡아야 합니다."
 CZE_SLO_demand_zaolzie: "자올지에 요구"
 CZE_SLO_demand_zaolzie_desc: "폴란드는 수십 년 전에 이 지역을 차지했습니다. 이는 부당한 일이었지만 걱정하지 마십시오. 우리는 자올지에를 우리 영토로 되찾을 것입니다!"
 CZE_catch_up_with_new_technology_hidden_flag: "§G§Y슈코다 연구소§! 연구 시간을 [?CZE_catch_up_with_new_technology_hidden_flag:days_left|Y]일 동안 §Y10§!일 단축§!"
