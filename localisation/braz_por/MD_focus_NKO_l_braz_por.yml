 korea_russia.21.t:0 "A Rússia Contratou Nossos Trabalhadores"
 korea_russia.21.d:0 "Assinamos um acordo com a Rússia para contratar nossos trabalhadores em grande número para auxiliar em obras de construção. As condições são mais que favoráveis para nós, pois o lado russo paga salários generosos"
 korea_russia.21.a:0 "Ótimo"
 korea_russia.22.t:0 "Exercícios Militares com a Coreia do Norte"
 korea_russia.22.d:0 "O Estado-Maior norte-coreano propõe realizar exercícios conjuntos de nossas forças armadas para demonstrar a força de nossos exércitos e testar a cooperação entre nossas forças armadas."
 korea_russia.22.a:0 "É Uma Ótima Ideia"
 korea_russia.22.b:0 "Não"
 korea_russia.23.t:0 "Exercícios Militares com a Rússia"
 korea_russia.23.d:0 "O Estado-Maior russo concordou em realizar exercícios conjuntos das forças armadas de nossos países."
 korea_russia.23.a:0 "Muito Bom!"
 korea_russia.24.t:0 "Exercícios Militares com a Rússia"
 korea_russia.24.d:0 "O Estado-Maior russo recusou-se a realizar exercícios conjuntos das forças armadas de nossos países."
 korea_russia.24.a:0 "Triste"
 NKO_joint_exercises_sov_idea:0 "Exercícios Russo-Norte-Coreanos"
 NKO_coop_russian_exerices:0 "§YOferecer§! Exercícios Conjuntos à [SOV.GetFlag]§YRússia§!"
 NKO_joint_exercises_nko_idea:0 "Exercícios Russo-Norte-Coreanos"
 korea.50.t:0 "A unificação da Coreia foi finalmente alcançada"
 korea.50.d:0 "Após anos de divisão, a Coreia finalmente alcançou a unificação, marcando um momento histórico na história mundial. O Norte e o Sul, outrora separados, se uniram, superando décadas de diferenças políticas, econômicas e culturais para formar uma única nação unida. Esse evento marcante significa uma nova era de paz, cooperação e prosperidade para o povo coreano, remodelando o cenário geopolítico do Leste Asiático e do mundo."
 korea.50.a:0 "Viiivaaaa!!!"
 korea.51.t:0 "Construir mais fazendas"
 korea.51.d:0 "A Coreia não pode ser grande sem o povo coreano; devemos nos concentrar em resolver a fome o mais rápido possível."
 korea.51.a:0 "Agricultura em Pyongyang"
 korea.51.b:0 "Agricultura em Hwanghae"
 korea.51.c:0 "Agricultura em Chagang"
 korea.51.e:0 "Agricultura em Hamgyong"
 korea.52.t:0 "Modernizar nossos centros de suprimento deficientes"
 korea.52.d:0 "Nosso grande líder forneceu fundos para construir mais trilhos de trem e um centro de suprimento, e nos deixou a escolha entre focar em nossas ambições de zona econômica ou preparar a logística para a guerra."
 korea.52.a:0 "Abastecer o Lado Coreano"
 korea.52.b:0 "Abastecer a Futura Zona Econômica"
