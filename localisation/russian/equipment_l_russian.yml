 USA_infantry_weapons_2: "M16A1"
 USA_infantry_weapons_2_desc: "Винтовка M16, официально обозначаемая «Rifle, Caliber 5.56 mm, M16», представляет собой семейство армейских винтовок, созданных на основе винтовки ArmaLite AR-15 для вооружённых сил Соединённых Штатов. Оригинальная винтовка M16 представляла собой автоматическую винтовку калибра 5,56 мм с магазином на 20 патронов."
 USA_infantry_weapons_3: "M16A2"
 USA_infantry_weapons_3_desc: "Разработку винтовки M16A2 первоначально запросил Корпус морской пехоты США по итогам боевого опыта применения XM16E1 и M16A1 во Вьетнаме. В 1982 году Министерство обороны официально приняло её на вооружение под обозначением «Винтовка США калибра 5,56 мм, M16A2». Морская пехота стала первым видом вооружённых сил США, принявшим её на вооружение, в начале — середине 1980-х годов, а армия Соединённых Штатов последовала её примеру в конце 1980-х."
 USA_infantry_weapons_4: "M16A4"
 USA_infantry_weapons_4_desc: "M16A4 — четвёртое поколение серии M16. Она оснащена съёмной ручкой для переноски и полноразмерными планками Пикатинни с четырёх сторон для установки оптики и других вспомогательных устройств. FN M16A4 с переводчиком огня «предохранитель/одиночный/очередь» стала штатным оружием Корпуса морской пехоты США. Армейские винтовки также оснащаются цевьём Knight's Armament Company M5 RAS, позволяющим крепить вертикальные рукоятки, лазерные целеуказатели, тактические фонари и другие аксессуары, откуда в полевых уставах армии США появилось обозначение M16A4 MWS (Modular Weapon System — модульная система оружия)."
 USA_infantry_weapons_5: "M4A1"
 USA_infantry_weapons_5_desc: "Карабин M4 — укороченный и облегчённый вариант штурмовой винтовки M16. M4 представляет собой карабин под патрон 5,56x45 мм НАТО с воздушным охлаждением, газоотводной автоматикой с прямым воздействием пороховых газов и магазинным питанием. Он имеет ствол длиной 14,5 дюйма (370 мм) и телескопический приклад."
 USA_infantry_weapons_7: "M7 Spear"
 USA_infantry_weapons_7_desc: "Новый революционный дизайн, включающий в себя передовые материалы и передовой баллистический компьютер."
 USA_infantry_weapons_6: "M27 IAR"
 USA_infantry_weapons_6_desc: ""
 USA_infantry_weapons_8: "Titan APPL"
 USA_infantry_weapons_8_desc: "Эта оружейная платформа сочетает в себе ту же американскую надёжность, что и система M4, но применяет технологию, совершенно уникальную для 21 века. Эта система не только лёгкая за счёт использования безгильзовых боеприпасов, но и использует вариант миниатюрного магнитного ускорения, что фактически превращает оружие в ранний ручной гибридный рельсотрон."
