 carrier_7: "항공모함 2045"
 carrier_7_desc: "제2차 세계 대전 종전 이후 항공 전력은 해군 교리에서 최고의 지위를 차지해 왔으며, 이러한 힘의 상징은 종종 모든 해군 강국이 가장 아끼는 자산이 됩니다. 항공모함의 존재는 전투의 승패를 가를 수 있습니다. 막대한 중요성과 영향력에도 불구하고 자기 방어 능력은 상당히 떨어지므로 항상 호위를 받아야 합니다."
 carrier_8: "항공모함 2055"
