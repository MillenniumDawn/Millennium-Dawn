 REGIMENTAL_SUPPORT_HEADER: "Роты поддержки"
 DESIGNER_REGIMENTAL_SUPPORT_COLUMN_TITLE: "Батальонные взводы и отделения поддержки. Эти подразделения поддержки и боевые части прикрепляются непосредственно на уровне батальона.\n\nБатальонные взводы и отделения поддержки §Rвлияют§! на §Yмаксимальную скорость§! бригады, но §Gне увеличивают§! §Yширину боевого фронта§! (§Rкроме§! морского десантного отряда)."
 DESIGNER_SUPPORT_COLUMN_TITLE: "Бригадные роты поддержки и более мелкие подразделения. Это вспомогательные подразделения, которые находятся за линией фронта и оказывают поддержку боевым частям.\n\nВы можете выбрать только §Rодно§! подразделение каждого типа.\n\nРоты и более мелкие подразделения §Rвлияют§! на §Yмаксимальную скорость§! бригады и §Rувеличивают§! её §Yширину боевого фронта§! (§Rкроме§! взвода передовых авианаводчиков)."
