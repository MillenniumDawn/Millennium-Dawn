 nsb_arty_upgrade_5: "Bulk-Loaded Liquid Propellants"
 nsb_arty_upgrade_5_desc: "Bulk-loaded liquid propellants replace fixed powder charges with adjustable propellant injection, allowing artillery systems to vary muzzle energy, improve range control, and simplify gun mechanism design."
 nsb_arty_upgrade_6: "Bulk-Loaded Liquid Propellants II"
 nsb_arty_upgrade_6_desc: "Improved liquid propellant systems provide more precise charge control, safer handling, and better integration with automated loading and fire-control systems, increasing artillery flexibility and sustained fire performance."
