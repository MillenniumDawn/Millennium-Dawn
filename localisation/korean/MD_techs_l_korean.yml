 COMSAT9: "통신위성 2045"
 COMSAT9_desc: "트랜스폰더를 통해 무선 통신 신호를 중계하고 증폭하는 인공위성입니다. 이를 통해 지구상의 각기 다른 위치에 있는 송신기와 수신기 사이에 통신 채널이 생성됩니다.\n\n통신위성 (통신위성 2045):\n§Y$COMSAT9$§! 위성은 §Y25Gbit/s§!의 대역폭을 가진 통신위성입니다. §Y25Gbit/s 통신위성 체계§!에 필요합니다."
 COMSAT10: "통신위성 2055"
 COMSAT10_desc: "트랜스폰더를 통해 무선 통신 신호를 중계하고 증폭하는 인공위성입니다. 이를 통해 지구상의 각기 다른 위치에 있는 송신기와 수신기 사이에 통신 채널이 생성됩니다.\n\n통신위성 (통신위성 2055):\n§Y$COMSAT10$§! 위성은 §Y100Gbit/s§!의 대역폭을 가진 통신위성입니다. §Y100Gbit/s 통신위성 체계§!에 필요합니다."
 COMSAT11: "통신위성 2065"
 COMSAT11_desc: "트랜스폰더를 통해 무선 통신 신호를 중계하고 증폭하는 인공위성입니다. 이를 통해 지구상의 각기 다른 위치에 있는 송신기와 수신기 사이에 통신 채널이 생성됩니다.\n\n통신위성 (통신위성 2065):\n§Y$COMSAT11$§! 위성은 §Y250Gbit/s§!의 대역폭을 가진 통신위성입니다. §Y250Gbit/s 통신위성 체계§!에 필요합니다."
 COMSAT12: "통신위성 2075"
 COMSAT12_desc: "트랜스폰더를 통해 무선 통신 신호를 중계하고 증폭하는 인공위성입니다. 이를 통해 지구상의 각기 다른 위치에 있는 송신기와 수신기 사이에 통신 채널이 생성됩니다.\n\n통신위성 (통신위성 2075):\n§Y$COMSAT12$§! 위성은 §Y1Tbit/s§!의 대역폭을 가진 통신위성입니다. §Y1Tbit/s 통신위성 체계§!에 필요합니다."
 SPYSAT9: "첩보위성 2045"
 SPYSAT9_desc: "정보 수집부터 핵무기 탐지에 이르기까지 다양한 임무를 수행하도록 설계된 군사 또는 정보 위성입니다.\n\n정찰 위성 (첩보위성 2045):\n§Y$SPYSAT9$§! 위성은 §Y0.007m GSD§!의 이미지 해상도를 가진 정찰 위성입니다. §Y0.007m GSD§! 정찰 위성 체계에 필요합니다.\n§YGSD§! - §Y지상표본거리(Ground Sample Distance)§!: GSD는 지상에서 측정된 픽셀 중심 간의 거리입니다. 이 위성의 경우 인접한 픽셀의 지상 위치는 0.007m 떨어져 있습니다."
