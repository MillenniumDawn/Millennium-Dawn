 BOS_internal_faction_balance: "보스니아의 민족들"
 BOS_internal_faction_balance_desc: "국가 기구 전반에서 보스니아크인, 크로아티아인, 세르비아인의 이해관계가 이루는 균형이 안정도와 징집에 영향을 줍니다."
 BOS_landmine_contamination: "지뢰 오염"
 BOS_landmine_contamination_desc: "이 지역에 제거되지 않은 전시 지뢰밭은 민간인의 목숨을 앗아 가고, 정착을 제약하며, 생산 가능한 토지를 사용하지 못하게 만듭니다."
