l_russian:
 USoE001: "Образование новой европейской нации"
 USoE001_desc: "Объединённый Европейский союз должен конституировать себя как новую нацию. Конституция и договоры об объединении — это одно, но теперь народ должен наполнить эти правовые рамки жизнью."
 USoE002: "Европейский офицерский корпус"
 USoE002_desc: "В Союзе каждое государство-член имело свою собственную армию, а позже появилась Евроармия. Нужно создать европейский офицерский корпус с общей доктриной и подготовкой."
 USoE003: "Европейские политические партии"
 USoE003_desc: "Новая нация нуждается в новых политических партиях. Бывшие политические партии государств-членов должны объединиться."
 USoE004: "Европейский патриотизм"
 USoE004_desc: "Новая нация нуждается в собственном патриотизме и национальных символах."
 USoE005: "Новая Великая игра"
 USoE005_desc: "Новая Великая игра только началась, и Европа опаздывает, в то время как США, Китай и Россия уже сделали свои первые ходы."
 USoE006: "Сердце и душа Европы"
 USoE006_desc: "Новая нация должна определить свои ценности и стандарты. Европе нужны сердце и душа!"
 USoE100: "Игра сфер"
 USoE100_desc: "Когда играешь в игру сфер, ты либо побеждаешь, либо погибаешь. Середины не дано."
 USoE101: "Бой с орлом"
 USoE101_desc: "Американский орёл должен быть приземлён! Он слишком долго летал над европейскими небесами."
 USoE102: "Сражение с медведем"
 USoE102_desc: "Мы должны ударить медведя, прежде чем он ударит нас."
 USoE103: "Танец с драконом"
 USoE103_desc: "Танец с драконом — опасная игра."
 USoE104: "Железное сердце"
 USoE104_desc: "В древние времена кузнецы выковывали железный трон из оружия поверженных злодеев. В наши дни мы просто заявляем, что Европа доказала своё железное сердце и теперь является бесспорным мировым правителем!"
 USoE200: "Мирное сосуществование"
 USoE200_desc: "Есть мечи гораздо острее железных. Зачем платить кровью, если можно заплатить деньгами?"
 USoE201: "Америка прежде всего"
 USoE201_desc: "Мы должны уважать доктрину «Америка прежде всего», если хотим, чтобы наши доктрины также пользовались уважением."
 USoE202: "Сфера России"
 USoE202_desc: "Россия — защитница всех русских людей. Это её сфера влияния, которую мы должны уважать."
 USoE203: "Китайская сфера"
 USoE203_desc: "Сфера влияния Китая охватывает Юго-Восточную Азию и не беспокоит нас. Китай — наш торговый партнёр, а не соперник."
 USoE204: "Евросфера"
 USoE204_desc: "Мы умиротворили все сверхдержавы XXI века, теперь у нас свободны руки для создания Евросферы в Европе, Леванте и Северной Африке."
 USoE300: "Столкновение цивилизаций"
 USoE300_desc: "«Столкновение цивилизаций» — тезис американского политолога Сэмюэла П. Хантингтона о том, что культурная и религиозная идентичность людей будет основным источником конфликтов в мире после окончания холодной войны. Будущие войны будут вестись не между странами, а между культурами."
 USoE301: "Остальной Запад"
 USoE301_desc: "Европа — это остальная часть Запада. Америка оставила нас в одиночестве и изоляции, следуя доктрине «Америка прежде всего»."
 USoE302: "Крест и полумесяц"
 USoE302_desc: "На юго-восточной границе Европы крест сталкивается с полумесяцем. Кто победит: западная или исламская цивилизация?"
 USoE303: "Папа и патриарх"
 USoE303_desc: "После Великого раскола 1054 года Папа и православный патриарх пошли разными путями. Пришло время снова объединиться, чтобы защитить западную цивилизацию."
 USoE304: "Два креста"
 USoE304_desc: "Восточное и западное христианство должны объединиться против ислама."
 USoE305: "Евразийский альянс"
 USoE305_desc: "После роспуска НАТО Европа может сформировать новый большой союз со своим российским соседом."
 USoE306: "Константинополь"
 USoE306_desc: "Константинополь — часть Запада. Европа должна освободить его от исламского влияния."
 USoE307: "Антиохия"
 USoE307_desc: "Антиохийское княжество было одним из государств крестоносцев, созданных во время Первого крестового похода. Оно принадлежит Западу и снова будет свободно от ислама."
 USoE308: "Триполи"
 USoE308_desc: "Графство Триполи (1109-1289 годы) было последним из государств крестоносцев. Оно восстанет снова. Европа должна освободить Левант от ислама."
 USoE309: "Иерусалим"
 USoE309_desc: "Европа должна спасти Святой город от исламского влияния. Иерусалимское королевство вновь будет охранять святые места."
 USoE310: "Мальтийские рыцари"
 USoE310_desc: "Европа должна освободить Северную Африку от исламского влияния. Европа последует примеру мальтийских рыцарей."
 USoE311: "Арабская вестернизация"
 USoE311_desc: "Некоторые страны на Аравийском полуострове уже имеют тесные связи с Западом. Европа должна полностью вестернизировать Аравийский полуостров, чтобы иметь безопасное соседство."
 USoE312: "Индийская вестернизация"
 USoE312_desc: "С колониальным наследием Индия традиционно тесно связана с Западом. Европа должна углубить эти отношения, чтобы полностью вестернизировать Индию."
 USoE313: "Республика Персия"
 USoE313_desc: "Иран — один из главных соперников Запада на Ближнем Востоке. Европа может остановить стремление Ирана к региональной гегемонии, вестернизировав Иран в Республику Персия."
 USoE320: "Запад против остальных"
 USoE320_desc: "Европа и Америка — это западные сверхдержавы, которые могут противостоять любому врагу в мире. Имея НАТО в качестве базы, Запад может укрепить своё глобальное господство."
 USoE321: "Азиатская вестернизация"
 USoE321_desc: "Запад должен сосредоточиться на развивающихся державах в Азии. Запад должен бороться с ними или вестернизировать их."
 USoE322: "Четыре тигра"
 USoE322_desc: "Четыре азиатских тигра — Гонконг, Сингапур, Южная Корея и Тайвань — всегда имели тесные связи с Западом и боялись зарождающегося китайского дракона. Они могли бы стать жизнеспособными союзниками Запада в Азии."
 USoE323: "Япония"
 USoE323_desc: "После окончания Второй мировой войны Япония стала важным союзником Запада в Азии. Западу необходимо продолжать это тесное партнёрство."
 USoE324: "Китай"
 USoE324_desc: "Китай — главный соперник Запада в Азии. Если Запад сможет вестернизировать Китай, то не будет претендента на западную гегемонию в Азии."
 USoE325: "Операция «Немыслимое» 2.0"
 USoE325_desc: "Операция «Немыслимое» была военным планом британских начальников штабов против Советского Союза, составленным по приказу Уинстона Черчилля в мае 1945 года. Вместе с бывшим германским вермахтом западные союзники должны были нанести внезапный удар по Советскому Союзу. Запад должен пересмотреть этот план, чтобы он соответствовал нынешней ситуации, и действовать в порядке упреждающей самообороны против России, чтобы предотвратить российскую гегемонию в Европе."
 USoE400: "Факел свободы"
 USoE400_desc: "Европа должна нести факел свободы! Соединённые Штаты Европы являются демократической республикой, которая уважает права человека и верховенство закона."
 USoE401: "Цифровая демократия"
 USoE401_desc: "Европа должна реформировать свои демократические институты для цифровой эпохи. С помощью социальных медиа и социальных сетей люди смогут непосредственно участвовать в законодательстве и управлении."
 USoE402: "Серп и молот"
 USoE402_desc: "Карл Маркс и Фридрих Энгельс, отцы социализма и марксизма, были европейцами. Европе нужно продолжить это наследие."
 USoE403: "ЕСССР"
 USoE403_desc: "Европейские левые заперли капиталистов в Европейском союзе, теперь духовные наследники Карла Маркса и Фридриха Энгельса имеют возможность создать ЕСССР: Европейский Союз Советских Социалистических Республик."
 USoE404: "Правительство ИИ"
 USoE404_desc: "Искусственный интеллект развился настолько, что может управлять страной эффективнее, чем неэффективные и, возможно, коррумпированные человеческие политики. Агент ИИ правящей партии возьмёт управление на себя и будет управлять страной, исходя из ценностей правящей партии."
 USoE500: "Зелёное будущее"
 USoE500_desc: "С неоспоримым изменением климата у Европы нет другого будущего, кроме зелёного."
 USoE501: "Экологическая империя"
 USoE501_desc: "Европа должна стать экологической империей, где экономика и окружающая среда не противоречат друг другу."
 USoE502: "Экологический империализм"
 USoE502_desc: "Европа зелёная, но остальной мир по-прежнему тёмный и серый. Европа должна распространить свою политику и технологии по всему миру, чтобы дать отпор ископаемым энергетическим империям, которые разрушают планету."
 USoE503: "Северная Америка"
 USoE503_desc: "Европа зелёная, но Северная Америка всё ещё тёмно-серая. Европа должна распространить свою политику и технологии по всему миру, чтобы дать отпор ископаемым энергетическим империям, которые разрушают планету."
 USoE504: "Южная Америка"
 USoE504_desc: "Европа зелёная, но Южная Америка всё ещё тёмно-серая. Европа должна распространить свою политику и технологии по всему миру, чтобы дать отпор ископаемым энергетическим империям, которые разрушают планету."
 USoE505: "Европа"
 USoE505_desc: "Европа зелёная, но другие европейские страны всё ещё тёмно-серые. Европа должна распространить свою политику и технологии по всему миру, чтобы дать отпор ископаемым энергетическим империям, которые разрушают планету."
 USoE506: "Африка"
 USoE506_desc: "Европа зелёная, но Африка всё ещё тёмная и серая. Европа должна распространить свою политику и технологии по всему миру, чтобы дать отпор ископаемым энергетическим империям, которые разрушают планету."
 USoE507: "Ближний Восток"
 USoE507_desc: "Европа зелёная, но Ближний Восток всё ещё тёмно-серый. Европа должна распространить свою политику и технологии по всему миру, чтобы дать отпор ископаемым энергетическим империям, которые разрушают планету."
 USoE508: "Азия"
 USoE508_desc: "Европа зелёная, но Азия всё ещё тёмная и серая. Европа должна распространить свою политику и технологии по всему миру, чтобы дать отпор ископаемым энергетическим империям, которые разрушают планету."
 USoE509: "Океания"
 USoE509_desc: "Европа зелёная, но Океания всё ещё тёмно-серая. Европа должна распространить свою политику и технологии по всему миру, чтобы дать отпор ископаемым энергетическим империям, которые разрушают планету."
 USoE510: "Тихий океан"
 USoE510_desc: "Европа зелёная, но Тихий океан всё ещё тёмно-серый. Европа должна распространить свою политику и технологии по всему миру, чтобы дать отпор ископаемым энергетическим империям, которые разрушают планету."
 USoE600: "Крест и корона"
 USoE600_desc: "Европа должна исполнить своё предназначение и снова стать империей."
 USoE601: "Новые рыцари"
 USoE601_desc: "Во враждебном мире военные взяли под свой контроль Европу, чтобы спасти её народ от коррумпированных политиков и иностранных держав."
 USoE602: "Генерал европейских армий"
 USoE602_desc: "Генеральный штаб решил, что Европой будет руководить армейский генерал. Ему будет присвоено звание Генерала европейских армий."
 USoE603: "Маршал авиации Европы"
 USoE603_desc: "Генеральный штаб решил, что Европу возглавит генерал ВВС. Ему будет присвоено звание маршала авиации Европы."
 USoE604: "Адмирал флота Европы"
 USoE604_desc: "Генеральный штаб решил, что Европу возглавит адмирал. Ему будет присвоено звание адмирала флота Европы."
 USoE605: "Европейская империя"
 USoE605_desc: "Европа вновь стала империей и может отстаивать интересы своего народа на глобальном уровне."
 USoE620: "Новый император"
 USoE620_desc: "Европе нужен новый император, который возглавит континент в XXI веке."
 USoE621: "Выбор династии"
 USoE621_desc: "В Европе много великих династий с долгой и славной историей. Впервые объединившись, континент должен решить, какой дом должен править в XXI веке."
 USoE622: "Савойский дом"
 USoE622_desc: "Савойский дом — королевская династия, основанная в 1003 году в историческом регионе Савойя. Постепенно расширяясь, семья росла в силе от управления небольшим альпийским графством на северо-западе Италии до абсолютного правления Королевством Сицилия. Члены дома правили Сардинией, Италией, Албанией, Эфиопией и, в течение короткого периода, Испанией. Дом также претендует на титулы королей Кипра, Иерусалима и Армении."
 USoE623: "Дом Виттельсбахов"
 USoE623_desc: "Дом Виттельсбахов — немецко-баварская династия, ветви которой правили такими территориями, как Бавария, Голландия, Зеландия, Кёльн, Швеция, Румыния, Богемия, Венгрия, Дания, Норвегия, Греция и Священная Римская империя. Линия якобитского наследования, которая признаёт право католического монарха, признаёт Франца, наследного принца Баварского, законным наследником под именем Франциска II."
 USoE624: "Дом Борбон-Анжу"
 USoE624_desc: "Дом Борбон-Анжу (Borbón-Anjou) является правящим королевским домом Королевства Испания. К XVIII веку члены испанской династии Бурбонов занимали троны в Испании, Неаполе, Сицилии и Парме."
 USoE625: "Дом Бурбонов"
 USoE625_desc: "Дом Бурбонов — европейская династия французского происхождения, ветвь Капетингов, королевский дом Франции. Короли Бурбонов впервые правили во Франции и Наварре в XVI веке."
 USoE626: "Ганноверский дом"
 USoE626_desc: "Ганноверский дом — немецкий королевский дом, правивший Ганновером, Великобританией и Ирландией в разное время на протяжении XVII–XX веков. Династия возникла в 1635 году как младшая ветвь дома Брауншвейг-Люнебург и набирала престиж, пока Ганновер не стал курфюршеством в 1692 году."
 USoE627: "Дом Глюксбургов"
 USoE627_desc: "Дом Глюксбургов (Glücksburg, сокращённо от Шлезвиг-Гольштейн-Зондербург-Глюксбург) является датско-германской ветвью Ольденбургского дома, члены которого в разное время правили в Дании, Норвегии, Греции и нескольких северогерманских государствах."
 USoE628: "Виндзорский дом"
 USoE628_desc: "Виндзорский дом — правящий королевский дом Соединённого Королевства и других королевств Содружества. В 1901 году Саксен-Кобург-Готский дом сменил Ганноверский дом на британском престоле. В 1917 году из-за Первой мировой войны название королевского дома было изменено с немецкого Саксен-Кобург-Готского на английское Виндзорское (от Виндзорского замка)."
 USoE629: "Дом Оранских-Нассау"
 USoE629_desc: "Дом Оранских-Нассау является нынешним правящим домом Нидерландов. Будучи ветвью европейского дома Нассау, он играл центральную роль в политике и управлении Нидерландами и Европой, особенно с тех пор, как Вильгельм Молчаливый организовал голландское восстание против испанского владычества, которое после Восьмидесятилетней войны (1568–1648) привело к созданию независимого голландского государства."
 USoE630: "Габсбург-Лотарингский дом"
 USoE630_desc: "Габсбург-Лотарингский дом возник в результате брака в 1736 году Франциска III, герцога Лотарингии и Бара, и Марии Терезии Австрийской, впоследствии последовательно королевы Богемии, королевы Венгрии и эрцгерцогини Австрии. Его члены являются законной выжившей линией дома Габсбургов и Лотарингского дома, наследуя их родовые владения и призвание к империи."
 USoE631: "Дом Бонапартов"
 USoE631_desc: "Дом Бонапартов — это бывшая императорская и королевская европейская династия итальянского происхождения. Она была основана в 1804 году Наполеоном I. Он развернул Великую армию против всех крупных европейских держав и доминировал в континентальной Европе через серию военных побед. Он также возводил членов своей семьи на троны государств-клиентов, расширяя этим путём власть династии."
 USoE632: "Дом Гогенцоллернов"
 USoE632_desc: "Дом Гогенцоллернов — бывшая немецкая королевская династия, члены которой были князьями, курфюрстами, королями и императорами Гогенцоллерна, Бранденбурга, Пруссии, Германской империи и Румынии. Семья возникла в районе города Хехинген в Швабии в XI веке и получила своё название от замка Гогенцоллерн."
 USoE633: "Дом Романовых"
 USoE633_desc: "Дом Романовых — династия, которая правила Российской империей почти два столетия, начиная с Петра Великого, который считается одним из величайших императоров в истории, и вплоть до Николая II, убитого большевиками во время Октябрьской революции."
 USoE634: "Выбор дворца"
 USoE634_desc: "Новому императору Европы нужен представительный дворец для правления."
 USoE635: "Квиринальский дворец"
 USoE635_desc: "Квиринальский дворец — это историческое здание в Риме, Италия, и одна из трёх официальных резиденций Президента Итальянской Республики. Квиринальский дворец был выбран Наполеоном в качестве своей резиденции как императора. Однако его постоянное пребывание там так и не состоялось из-за поражения Франции в 1814 году и последующей Европейской реставрации."
 USoE636: "Замок Нойшванштайн"
 USoE636_desc: "Замок Нойшванштайн — это дворец в неороманском стиле XIX века, расположенный на скалистом холме на юго-западе Баварии, Германия. Дворец был построен по приказу короля Людвига II Баварского. Замок предназначался как личная резиденция короля, но он умер в 1886 году, так и не успев в нём жить. Вскоре после его смерти замок открыли для публики. С тех пор Нойшванштайн посетили более 61 миллиона человек."
 USoE637: "Королевский дворец Мадрида"
 USoE637_desc: "Королевский дворец Мадрида — официальная резиденция испанской королевской семьи в Мадриде, хотя сегодня он используется только для государственных церемоний. Площадь дворца составляет 135 000 квадратных метров, в нём 3 418 комнат. Это самый крупный действующий королевский дворец и самый большой по площади в Европе."
 USoE638: "Версальский дворец"
 USoE638_desc: "Версальский дворец был основной королевской резиденцией Франции с 1682 года при Людовике XIV и до начала Французской революции в 1789 году при Людовике XVI. Сегодня дворец является историческим памятником и объектом Всемирного наследия ЮНЕСКО, особенно знаменитым Зеркальной галереей и огромными Версальскими садами с фонтанами, каналами, а также геометрически оформленными клумбами и рощами."
 USoE639: "Букингемский дворец"
 USoE639_desc: "Букингемский дворец — это лондонская резиденция и административная штаб-квартира монарха Соединённого Королевства. Расположенный в районе Вестминстер, дворец часто становится центром государственных мероприятий и королевских приёмов. Он также служит символическим местом для британцев в моменты национальной радости и траура."
 USoE640: "Хофбург"
 USoE640_desc: "Хофбург — бывший главный императорский дворец правителей династии Габсбургов, а сегодня является официальной резиденцией и рабочим местом президента Австрии. Он расположен в центре Вены, был построен в XIII веке и несколько раз расширялся впоследствии."
 USoE641: "Сансуси"
 USoE641_desc: "Сансуси был летней резиденцией Фридриха Великого, короля Пруссии, в Потсдаме, недалеко от Берлина. Его часто называют немецким конкурентом Версаля. Хотя Сансуси выполнен в более камерном стиле рококо и значительно меньше французского дворца в стиле барокко, он также знаменит многочисленными храмами и декоративными постройками в парке."
 USoE642: "Зимний дворец"
 USoE642_desc: "В Санкт-Петербурге находится Зимний дворец, который был официальной резиденцией царей из династии Романовых. Его монументальные размеры должны были отражать огромную мощь Российской империи."
 USoE643: "Новый дворец"
 USoE643_desc: "Новому императору нужен новый дворец, а не исторический памятник. Давайте построим новый дворец с современной архитектурой в Брюсселе."
 USoE644: "Коронация"
 USoE644_desc: "Европе нужно подготовиться к коронации нового императора. Но сначала необходимо решить, какую корону наденет император и кто будет проводить церемонию коронации."
 USoE645: "Императорская корона"
 USoE645_desc: "Новая империя является продолжением и наследием Священной Римской империи, поэтому император должен носить корону Священной Римской империи."
 USoE646: "Новая Вселенская корона"
 USoE646_desc: "Новая империя и новый император нуждаются в новой короне, а не в исторической реликвии."
 USoE647: "От Папы Римского"
 USoE647_desc: "Новый император по милости Божьей должен быть коронован Папой Римским."
 USoE700: "Западный мир"
 USoE700_desc: "Европа приобрела глобальное господство и может обеспечить мир во всём мире. Эта эпоха будет называться Pax Occidentalis (Западный мир)."
 USoE701: "Стражи мира во всём мире"
 USoE701_desc: "Европа, Америка, Россия и Китай урегулировали свои сферы влияния. Каждая сверхдержава обеспечивает мир в своей сфере, и поэтому они — стражи мира во всём мире."
 military_reorganization: "Военная реорганизация"
 military_reorganization_desc: "Реорганизация вооружённых сил делает командиров неэффективными до тех пор, пока процесс не будет завершён и не будут применены новые доктрины."
 USoE_clash_of_civilizations: "Столкновение цивилизаций"
 USoE_asian_westernization: "Азиатская вестернизация"
 USoE_heart_of_iron: "Железное сердце"
 USoE_heart_of_iron_desc: "В древние времена кузнецы выковывали железный трон из оружия поверженных злодеев. В наши дни мы просто заявляем, что Европа доказала своё железное сердце и теперь является бесспорным мировым правителем!"
 USoE_digital_democracy: "Цифровая демократия"
 USoE_digital_democracy_desc: "Европа должна реформировать свои демократические институты для цифровой эпохи. С помощью социальных медиа и социальных сетей люди могут непосредственно участвовать в законодательстве и управлении."
 USoE_AI_government: "Правительство ИИ"
 USoE_AI_government_desc: "Искусственный интеллект развился до такой степени, что может управлять страной эффективнее, чем неэффективный и, возможно, коррумпированный человеческий политик. Агент ИИ правящей партии возьмёт на себя управление и будет руководить страной, опираясь на ценности правящей партии."
 USoE_knights_of_the_new_empire: "Рыцари новой империи"
 USoE_knights_of_the_new_empire_desc: "Во враждебном мире военные взяли под свой контроль Европу, чтобы спасти её народ от коррумпированных политиков и иностранных держав."
 USoE_knights_of_the_new_empire_army: "Рыцари новой империи — Генерал европейских армий"
 USoE_knights_of_the_new_empire_army_desc: "Генеральный штаб решил, что Европой будет руководить армейский генерал. Ему будет присвоено звание Генерала европейских армий."
 USoE_knights_of_the_new_empire_air_force: "Рыцари новой империи — Маршал авиации Европы"
 USoE_knights_of_the_new_empire_air_force_desc: "Генеральный штаб решил, что Европу возглавит генерал ВВС. Ему будет присвоено звание маршала авиации Европы."
 USoE_knights_of_the_new_empire_navy: "Рыцари новой империи — Адмирал флота Европы"
 USoE_knights_of_the_new_empire_navy_desc: "Генеральный штаб решил, что Европу возглавит адмирал. Ему будет присвоено звание адмирала флота Европы."
 USoE_holy_european_empire: "Священная Европейская империя"
 USoE_holy_european_empire_desc: "Император коронован, и Священная Европейская империя учреждена."
 USoE_pax_occidentalis: "Западный мир"
 USoE_pax_occidentalis_desc: "Европа приобрела глобальное господство и может обеспечить мир во всём мире. Эта эпоха будет называться Pax Occidentalis (Западный мир)."
 USoE_guardians_of_world_peace: "Стражи мира во всём мире"
 USoE_guardians_of_world_peace_desc: "Европа, Америка, Россия и Китай урегулировали свои сферы влияния. Каждая сверхдержава обеспечивает мир в своей сфере, и поэтому они — стражи мира во всём мире."
 USoE_environmental_sanctions: "Экологические санкции"
 USoE_environmental_sanctions_desc: "Экологические санкции со стороны Европы."
