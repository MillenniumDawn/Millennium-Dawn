 CPD_liberate_in_state_button_TT_DEMAND: "Liberar Estados"
 CPD_liberate_in_state_button_TT_CONCESSION: "Conceder Independência"
 CPD_liberate_in_state_button_TT_DELAYED_DEMAND: "Exigir a §YLibertação§! devolve os estados selecionados à nação que os reivindica legitimamente. Um país com núcleo existente recebe o território diretamente; um país extinto há muito tempo é revivido para recebê-lo. Onde nenhum proprietário de núcleo restar, um novo estado separatista será forjado a partir do que restou do atual dono."
 CPD_liberate_in_state_button_TT_DELAYED_CONCESSION: "Conceder §YIndependência§! liberta os estados selecionados que possuímos para seu legítimo reclamante, seja essa nação ainda existente ou que precise ser revivida da história."
