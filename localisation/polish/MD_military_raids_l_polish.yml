 tooltip_raid_category_infastructure_strikes: "§HAtaki na infrastrukturę§!\nUderzenia powietrzne pojedynczego skrzydła lotniczego, wymierzone w konkretny cel."
 tooltip_raid_category_military_resource_raids: "§HUderzenia militarne§!\nUderzenia pociskami balistycznymi lub manewrującymi wymierzone w cele wojskowe."
 tooltip_raid_category_special_forces_raids: "§HRajdy sił specjalnych§!\nPrzeprowadzane przez siły specjalne wypady na małą skalę na tyłach wroga."
 tooltip_raid_category_naval_raids: "§HRajdy morskie§!\nAtaki wymierzone w bazy morskie, dowództwa lub fortyfikacje."
 tooltip_raid_category_drone_strike_raids: "§HAtaki dronów§!\nAtaki przeprowadzane przez bojowe bezzałogowe statki powietrzne (UCAV)."
