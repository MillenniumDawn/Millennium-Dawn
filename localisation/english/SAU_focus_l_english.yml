 SAU_arab_republic_of_arabia_19_gtt:0 "§YThe Arab Ba'ath grows:§!\n§G+1% Political Power Gain, +1% Stability, +1% War Support, +0.5% Army Attack, +1% Recruitable Population§!"
 SAU_baath_civil_path_tt:0 "§YCivilian consolidation:§! the Arab Ba'ath builds the state from within, raising the party spirit's §Gpolitical power, stability, and war support§!. This path excludes §Ymilitary mobilisation§!."
 SAU_baath_mil_path_tt:0 "§YMilitary mobilisation:§! the Arab Ba'ath forges itself for war, raising the party spirit's §Garmy attack and conscription§!. This path excludes §Ycivilian consolidation§!."
 SAU_arab_republic_of_arabia_1:0 "Unity, Freedom, Socialism§!"
 SAU_arab_republic_of_arabia_1_desc:0 "The three words of the Ba'ath become the law of the land: the unity of the Arab nation, liberation from the colonizer, and socialism for the people."
 SAU_arab_republic_of_arabia_2:0 "Build the Party"
 SAU_arab_republic_of_arabia_2_desc:0 "Forge a disciplined revolutionary party organised in cells from the village to the capital, the vanguard of the Arab awakening."
 SAU_arab_republic_of_arabia_3:0 "A Secular Republic"
 SAU_arab_republic_of_arabia_3_desc:0 "Separate mosque from state and bind the nation by Arab identity rather than sect, so that Sunni and Shia, Muslim and Christian stand as one."
 SAU_arab_republic_of_arabia_4:0 "The Arab Socialist Path"
 SAU_arab_republic_of_arabia_4_desc:0 "Reject both capitalism and Soviet communism for a distinctly Arab socialism: the commanding heights in the people's hands, the small trader left free."
 SAU_arab_republic_of_arabia_5:0 "Nationalize the Heights"
 SAU_arab_republic_of_arabia_5_desc:0 "Seize the oil, the banks and the great enterprises from the foreign concessionaires and the old families, and turn their wealth to the nation."
 SAU_arab_republic_of_arabia_6:0 "Land to the Peasants"
 SAU_arab_republic_of_arabia_6_desc:0 "Break up the great estates and give the soil to the fellahin who work it, ending the feudal grip on the countryside."
 SAU_arab_republic_of_arabia_7:0 "The Officer Corps"
 SAU_arab_republic_of_arabia_7_desc:0 "Win the loyalty of the young officers, the true engine of every Arab revolution, and make the army a school of Ba'athist thought."
 SAU_arab_republic_of_arabia_8:0 "Arm the Vanguard"
 SAU_arab_republic_of_arabia_8_desc:0 "Raise a politically reliable militia alongside the regular army, a sword the party can wield directly."
 SAU_arab_republic_of_arabia_9:0 "Forge the National Army"
 SAU_arab_republic_of_arabia_9_desc:0 "Build a modern mechanised army worthy of the Arab nation and able to carry the revolution beyond our borders."
 SAU_arab_republic_of_arabia_10:0 "Cells Across the Arab World"
 SAU_arab_republic_of_arabia_10_desc:0 "Plant Ba'athist cells in every Arab capital, the seed of the revolutions to come."
 SAU_arab_republic_of_arabia_11:0 "The Sword of Unity"
 SAU_arab_republic_of_arabia_11_desc:0 "Where persuasion fails, the Arab nation shall be united by force. Draw the sword against the regimes that cling to division."
 SAU_arab_republic_of_arabia_12:0 "Purge the Reactionaries"
 SAU_arab_republic_of_arabia_12_desc:0 "Root out the monarchists, the Islamists and the foreign agents who would strangle the revolution in its cradle."
 SAU_arab_republic_of_arabia_13:0 "The United Arab Republic"
 SAU_arab_republic_of_arabia_13_desc:0 "Proclaim the union of the Arab lands into a single revolutionary state, the dream of generations made flesh."
 SAU_arab_republic_of_arabia_14:0 "One Arab Nation"
 SAU_arab_republic_of_arabia_14_desc:0 "Erase the borders drawn by Sykes and Picot and teach a generation that there is but one Arab nation bearing an eternal message."
 SAU_arab_republic_of_arabia_15:0 "The Vanguard of the Arabs"
 SAU_arab_republic_of_arabia_15_desc:0 "Take up the leadership of the whole Arab world, from the Atlantic to the Gulf, as the beating heart of the revolution."
 SAU_arab_republic_of_arabia_16:0 "Expel the Imperialists"
 SAU_arab_republic_of_arabia_16_desc:0 "Drive the last foreign bases and advisors from Arab soil and tear up the unequal treaties of the colonial age."
 SAU_arab_republic_of_arabia_17:0 "Industrialize the Nation"
 SAU_arab_republic_of_arabia_17_desc:0 "Raise steel mills, dams and factories by national plan, so the republic need bow to no one for its bread or its arms."
 SAU_arab_republic_of_arabia_18:0 "The Revolutionary Command Council"
 SAU_arab_republic_of_arabia_18_desc:0 "Vest supreme authority in a council of the party's leaders, fusing party and state into a single revolutionary will."
 SAU_arab_republic_of_arabia_19:0 "Pan-Arab Solidarity"
 SAU_arab_republic_of_arabia_19_desc:0 "Stand with every Arab struggle from Palestine to the Maghreb, and make Arabia the patron of the nationalist cause."
 SAU_events.107.t:0 "The Name of the Republic"
 SAU_events.107.d:0 "The Ba'ath holds the reins of the state. Shall Arabia proclaim itself the Arab Republic, vanguard of the Arab nation, or keep the modest name of the Republic of Arabia?"
 SAU_events.107.a:0 "Proclaim the Arab Republic of Arabia"
 SAU_events.107.b:0 "Keep the Republic of Arabia"
 SAU_events.109.t:0 "A Call to the Arab Comintern"
 SAU_events.109.d:0 "[FROM.GetName] invites us into the Arab Comintern, a union of workers' states bound by the cause of revolution. We may join our comrades or keep our own road."
 SAU_events.109.a:0 "Join the Arab Comintern"
 SAU_events.109.b:0 "We will stand alone"
 SAU_communist_seize_power:0 "Launch the Socialist Revolution in [FROM.GetName]"
 SAU_communist_seize_power_desc:0 "Where the workers hold the streets, strike. With overwhelming support the old regime falls; where the movement is merely strong, the country plunges into revolutionary civil war."
 SAU_communist_invite_to_comintern:0 "Invite [FROM.GetName] to the Arab Comintern"
 SAU_communist_invite_to_comintern_desc:0 "Extend an invitation to [FROM.GetName] to join the Arab Comintern. A fellow workers' state need not be liberated by force; they may accept or decline."
 SAU_communist_invite_tt:0 "Invite this socialist state to join the Arab Comintern. They decide whether to accept."
 SAU_arab_comintern:0 "Arab Comintern"
 SAU_baath_uar_required_tt:0 "The §YUnited Arab Republic§! must be proclaimed first: take the §YAnnounce the Creation of the United Arab Republic§! decision."
 SAU_events.105.t:0 "The Question of the State"
 SAU_events.105.d:0 "The Shura has triumphed and the Islamic Awakening commands the nation. Now Arabia must decide what it shall be: an Islamic Emirate ruled by an emir under the law of God, or a republic that governs in the name of the faithful."
 SAU_events.105.a:0 "Proclaim the Islamic Emirate"
 SAU_events.105.b:0 "Preserve the Republic of Arabia"
 SAU_events.106.t:0 "The Islamic Emirate of Arabia"
 SAU_events.106.d:0 "Arabia has cast aside the republic. An Islamic Emirate now stands, its emir ruling by the Sharia and its new banner raised over Riyadh."
 SAU_events.106.a:0 "A new order rises"
 SAU_nda_state_tt:0 "The institutions of the liberal republic deepen with each reform won at the ballot box."
