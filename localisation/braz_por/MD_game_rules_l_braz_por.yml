 RULE_NO_DISABLE_EU_DESC: "A União Europeia permanecerá como está."
 RULE_DISABLE_NATO: "Desativar a OTAN"
 RULE_YES_DISABLE_NATO_DESC: "A OTAN será desativada ao carregar o jogo."
