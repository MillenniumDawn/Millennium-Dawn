 CZE_cnc_equipment_1: "R-140P"
 CZE_cnc_equipment_1_desc: "냉전 시절 체코슬로바키아 시대에 슬로바키아와 함께 생산한 지휘&통제 장비입니다."
 CZE_cnc_equipment_2: "R-150MP"
 CZE_cnc_equipment_2_desc: "C2 (Command and Control) is the first generation of C2 equipment. Command and Control Equipment is the system empowering leadership to exercise authority and direction over assigned forces for the accomplishment of missions and tasks. Efficient Command and Control leads to greater organization and morale."
 CZE_cnc_equipment_3: "RF-13"
 CZE_cnc_equipment_3_desc: "C3 (Command, Control & Communication) is the second generation of C2 equipment. Command and Control Equipment is the system empowering leadership to exercise authority and direction over assigned forces for the accomplishment of missions and tasks. Efficient Command and Control leads to greater organization and morale."
 CZE_cnc_equipment_4: "RF-1305"
 CZE_cnc_equipment_4_desc: "C3ISTAR(지휘, 통제, 통신, 정보, 감시, 표적 획득 및 정찰)는 3세대 C2 장비입니다. 지휘통제 장비는 지휘부가 임무와 과제를 완수하기 위해 배속된 부대에 대한 권한을 행사하고 지휘를 수행할 수 있도록 지원하는 시스템입니다. 효율적인 지휘통제는 조직의 체계성과 사기를 높여줍니다."
 CZE_cnc_equipment_5: "RF-1325"
 CZE_cnc_equipment_5_desc: "RF-1325 (Command, Control, Communications, Computers, Intelligence, and Interoperability) is the fourth generation of C2 equipment. Command and Control Equipment is the system empowering leadership to exercise authority and direction over assigned forces for the accomplishment of missions and tasks. Efficient Command and Control leads to greater organization and morale."
 CZE_cnc_equipment_6: "RF-1350"
 CZE_cnc_equipment_6_desc: "RF-1350 (Command, Control, Communications, Computers, Collaboration and Intelligence) is the Fifth generation of C2 equipment. Command and Control Equipment is the system empowering leadership to exercise authority and direction over assigned forces for the accomplishment of missions and tasks. Efficient Command and Control leads to greater organization and morale."
 CZE_cnc_equipment_7: "RF-13250"
 CZE_cnc_equipment_7_desc: "RF-13250 (Command, Control, Communications, Computers, Collaboration, Intelligence, Interoperability, Surveillance, Target Acquisition, and Reconnaissance ) is the Seventh generation of C2 equipment. Command and Control Equipment is the system empowering leadership to exercise authority and direction over assigned forces for the accomplishment of missions and tasks. Efficient Command and Control leads to greater organization and morale."
