 preah_vihear_news.4.t: "A Decisive Victory at Preah Vihear"
 preah_vihear_news.4.d_sia: "Thailand has scored a decisive victory in the long-running standoff at Preah Vihear, forcing Cambodia into a humiliating diplomatic climbdown. No territory has changed hands, but Bangkok is claiming the standoff as a national triumph."
 preah_vihear_news.4.d_cbd: "Cambodia has scored a decisive victory in the long-running standoff at Preah Vihear, forcing Thailand into a humiliating diplomatic climbdown. No territory has changed hands, but Phnom Penh is claiming the standoff as a national triumph."
 preah_vihear_news.4.o1: "A rivalry decisively settled, for now"
 SIA_preah_vihear_vindicated: "Preah Vihear Vindication"
 SIA_preah_vihear_vindicated_desc: "Thailand has secured the disputed ground around the temple complex, and the government is enjoying the political dividend of a long-running border dispute settled on its own terms."
 SIA_preah_vihear_humiliation: "Preah Vihear Humiliation"
 SIA_preah_vihear_humiliation_desc: "Cambodia now controls the disputed ground around Preah Vihear, and the loss is being felt across the political spectrum as a failure of both diplomacy and arms."
