 EQ_MOD_CAT_plane_droneswarm_weapon_TITLE: "Рои дронов"
 mothership_equipment_1: "Авиаматка 1-го поколения"
 mothership_equipment: "Авиаматка"
 mothership_equipment_desc: "Большой самолёт с ядерным двигателем, который почти полностью или полностью автономен. Предназначен для запуска большого количества беспилотных летательных аппаратов и ракет по всему миру для нанесения ударов по вражеским целям"
 mothership: "Авиаматка"
 spec_nuclear_consent_desc: "Системы «Ядерное согласие», которые позволяют самолёту сбрасывать ядерные боеприпасы.\n\n§GПодсказка дизайнера: Обязательный модуль, чтобы самолёт мог наносить ядерные удары.§!"
 weap_droneswarm_fighter_1: "Рой боевых дронов"
 weap_droneswarm_fighter_1_desc: "Дроны, предназначенные для перехвата и уничтожения авиации противника. \n\n§GПодсказка дизайнера: Этот модуль нужен, чтобы авиаматка получила доступ к заданиям «воздух-воздух». Установленный в основной слот роя дронов, он делает самолёт авиаматкой.§!"
 weap_droneswarm_bomber_1: "Рой бомбардировочных дронов"
 weap_droneswarm_bomber_1_desc: "Дроны, предназначенные для ударов по наземным сооружениям противника, а также для непосредственной авиационной поддержки и действий против логистики. \n\n§GПодсказка дизайнера: Этот модуль нужен, чтобы авиаматка получила доступ к заданиям по наземным целям. Установленный в основной слот роя дронов, он делает самолёт ударной авиаматкой.§!"
 weap_droneswarm_anti_ship_1: "Рой противокорабельных дронов"
 weap_droneswarm_anti_ship_1_desc: "Дроны, предназначенные для поиска, поражения и уничтожения кораблей противника — как в море, так и в портах. \n\n§GПодсказка дизайнера: Этот модуль нужен, чтобы авиаматка получила доступ к противокорабельным заданиям. Установленный в основной слот роя дронов, он делает самолёт морской авиаматкой.§!"
 weap_missile_bay_1: "Отсеки вооружения"
 weap_missile_bay_1_desc: "Огромные отсеки, встроенные в авиаматку и предназначенные для нанесения массированных ударов по целям, обнаруженным дронами. \n\n§GПодсказка дизайнера: Ставится только в отсеки роя дронов. Повышает урон на всех типах заданий, не меняя роль самолёта.§!"
 fully_autonomous_computer_system_light: "Полностью автономные истребители"
 fully_autonomous_computer_system_light_desc: "Полностью автономный модуль для беспилотных летательных аппаратов, благодаря которому системам дронов больше не требуется участие человека"
 fully_autonomous_computer_system_heavy: "Полностью автономные бомбардировщики"
 fully_autonomous_computer_system_heavy_desc: "Полностью автономный модуль для беспилотных летательных аппаратов, благодаря которому системам дронов больше не требуется участие человека"
 fully_autonomous_computer_system_arsenal: "Автономная система авиаматки"
 fully_autonomous_computer_system_arsenal_desc: "Система управления и контроля для авиаматки. Отвечает не только за управление самолётом, но и за управление системами роя дронов и другими функциями. Необходима для функционирования авиаматки."
 wing_delta_canard: "Треугольное крыло с ПГО"
 wing_delta_canard_desc: "Вариант формы крыла «Дельта», предназначенный для повышения маневренности самолета.\n\n§BПодсказка дизайнера: Формы крыла меняют характеристики самолёта ценой роста стоимости производства.§!\n\n§GЭта форма крыла является усовершенствованием крыла «Дельта». В основном за счет маневренности и устойчивости на большинстве скоростей. За счет стоимости производства по сравнению с обычными крыльями «Дельта»§!"
