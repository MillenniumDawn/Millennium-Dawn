 module_naval_missile_mount_single: "Support de missile unique"
 module_naval_missile_mount_single_desc: "Lanceurs en conteneur montés sur pont ou bras orientables pour missiles guidés. Plus légers et moins chers qu'une batterie VLS, mais à capacité limitée et salves plus lentes.\n\n§GIndice du concepteur : les montages de missiles multiplient les statistiques de combat du rôle missile du navire à moindre coût que les grandes batteries VLS. Conviennent aux combattants plus légers, mais offrent moins de puissance de feu missile et ajoutent un peu de carburant et de visibilité de surface.§!\n§GIndice concepteur : les affûts de missiles multiplient les statistiques de combat liées aux missiles à moindre coût que les grands bancs VLS. Ils conviennent aux combattants plus légers, mais offrent moins de puissance de feu missiles et ajoutent un peu de carburant et de visibilité de surface.§!"
