 PHI_corruption_number_07: "(7) Безудержная коррупция"
 PHI_corruption_number_08: "(8) Безудержная коррупция"
 PHI_corruption_number_09: "(9) Разрушительная коррупция"
 PHI_corruption_number_10: "(10) Парализующая коррупция"
 PHI_corruption_strength_exact_tt: "Уровень искажения §YУровень искажения§! снижен на §R[?PHI_corruption_roll|0]§! (Текущий: §Y[?PHI_corruption_strength|0]§!)"
 PHI_edsa_dos_category: "Кризис EDSA-Dos"
 PHI_edsa_dos_category_desc: "Обвинения в коррупции дестабилизировали администрацию. Процесс импичмента парализовал управление. Народ наблюдает и теряет терпение. Возьмем, к примеру, следующее: §YОткройте второй конверт§! принять решение до истечения таймера."
 PHI_the_people_grow_disillusioned: "Люди разочаровываются..."
 PHI_the_people_grow_disillusioned_desc: "Решение Сената исключить из доказательств ключевые доказательства по делу об импичменте вызвало возмущение общественности. Сотни тысяч людей стекаются к мемориалу на EDSA. Время истекает."
 PHI_open_the_second_envelope: "Откройте второй конверт"
 PHI_open_the_second_envelope_desc: "Несмотря на то, что Сенат проголосовал за закрытие дела 11 голосами против 10, у нас всё ещё есть право разрешить обнародование спорных доказательств. Это нанесёт нам политический ущерб, но, возможно, это единственный способ сохранить доверие к институциям и предотвратить падение правительства."
 PHI_edsa_corruption_below_55_tt: "§YСила коррупции§! должно быть ниже §Y55§! (Текущий: [?PHI.PHI_corruption_strength|Y0])"
 PHI_edsa_stability_above_60_tt: "§YStability§! должен быть выше §Y60%§!"
 PHI_edsa_dos_impeachment_atmosphere: "Паралич импичмента"
 PHI_edsa_dos_impeachment_atmosphere_desc: "Процесс импичмента доминирует во всех новостных выпусках. Политический капитал растрачивается ежедневно, пока страна наблюдает за тем, как администрация борется за выживание."
 PHI_edsa_dos_recovery_spirit: "Стабилизация после EDSA"
 PHI_edsa_dos_recovery_spirit_desc: "Новая администрация пришла к власти в чрезвычайных обстоятельствах. Обещания реформ вызывают осторожный оптимизм в обществе, хотя глубокие политические раны остаются."
 PHI.1.t: "Скандал с Джутенгейтом разгорается с новой силой"
 PHI.1.d: "Выступил информатор, обвинивший президента Джозефа Эстраду и членов его ближайшего окружения в получении многомиллионных откатов в рамках игры «джуэтенг». Общественное возмущение быстро растет, поскольку сообщения СМИ раскрывают более глубокие слои коррупции в администрации. Оппозиционные деятели, церковные лидеры и организации гражданского общества начали организовывать демонстрации, требуя от правительства подотчетности. В условиях роста напряженности по всей стране администрация должна решить, как она будет реагировать на растущие беспорядки. Или же ее позиция будет окончательно утрачена."
 PHI.1.a: "Это может перерасти в нечто большее..."
 PHI.2.t: "Конец пути"
 PHI.2.d: "Всё началось с ухода из зала суда. Когда сенат проголосовал 11-10 за исключение ключевых доказательств по делу об импичменте, вся команда обвинения покинула зал суда. В течение нескольких часов сотни тысяч филиппинцев начали массово выходить на улицы EDSA Shrine, вспоминая Народную революцию 1986 года. Через несколько дней Вооруженные силы Филиппин и Национальная полиция Филиппин отозвали свою поддержку администрации. Министры кабинета министров подали в отставку массово. Главный судья Иларио Давиде-младший принял присягу у вице-президента Глории Макапагал-Арройо. Джозеф Эстрада покинул Малаканьянгский дворец, не подав официальной отставки. Начинается новая глава."
 PHI.2.a: "Народ высказался."
 PHI.3.t: "Торжественное открытие кладбища имени Глории Макапагал Арройо."
 PHI.3.d: "Как и после ухода Джозефа Эстрады с поста президента Филиппин, Глория Арройо, вице-президент партии «Лакас-КМД» (£PHI_conservatism), была приведена к присяге в качестве 14-го президента Филиппин. Хотя некоторые могут утверждать, что восхождение Арройо на пост президента было нелегитимным, народ ликует, поскольку еще один коррумпированный лидер был свергнут благодаря революции и протестам. Хотя администрации Арройо потребуется время, чтобы оправиться, перемены, наконец, могут наступить, поскольку Арройо обещает залечить раны, нанесенные свергнутым бывшим президентом."
 PHI.3.a: "Возможно, перемены уже назревают."
 PHI.4.t: "Второй конверт открыт."
 PHI.4.d: "После нескольких дней политических потрясений Сенат проголосовал за вскрытие спорного «второго конверта». То, что должно было стать определяющим моментом процесса импичмента, вместо этого вызвало кратковременный вздох облегчения по всей стране. Поскольку доказательства теперь поступают в судебный процесс, прокуроры отказываются от планов массового ухода с трибуны, и призывы к новой «Народной революции» быстро теряют свою силу. Президент Джозеф Эстрада пережил политический шторм, но его администрация по-прежнему глубоко ранена. Обвинения в коррупции продолжают доминировать в заголовках, финансовые рынки остаются нестабильными, и как союзники, так и противники понимают, что битва за импичмент еще далека от завершения. Правительство избежало краха, но его будущее теперь полностью зависит от исхода судебного процесса."
 PHI.4.a: "Республика пока держится..."
 PHI.5.t: "Кампания на Минданао завершилась."
 PHI.5.d: "Последние организованные базовые командования Исламского фронта освобождения Моро были захвачены. От фронта осталась лишь горстка беглых командиров, лишенных территории, доходов и иерархической структуры, способной координировать их действия. Южное командование передало ответственность за отвоеванные муниципалитеты обратно гражданским властям, а численность Вооруженных сил сокращается до гарнизонной.\n\nВосстание закончилось без подписания каких-либо документов. Вопрос о том, закончились ли вместе с ним недовольства, которые его породили, — это уже совсем другой вопрос."
 PHI.5.a: "Минданао находится под нашей властью."
 PHI.6.t: "Всеобъемлющее соглашение по Бангсаморо"
 PHI.6.d: "После многолетних переговоров при посредничестве Малайзии правительство и Исламский фронт освобождения Моро подписали всеобъемлющее соглашение. Фронт сведет к минимуму вооружение и боевых действия под независимой проверкой. Взамен Автономный регион в мусульманском Минданао уступит место образованию Бангсаморо со своим собственным парламентом, определенной долей национальных доходов и полномочиями по управлению внутренними делами.\n\nЭтот переход обойдется Маниле в значительную сумму денег и определенную степень суверенитета над югом. Он также положит конец четырем десятилетиям войны."
 PHI.6.a: "Мир стоит своих денег."
 PHI.7.t: "Самое продолжительное восстание подавлено"
 PHI.7.d: "Партизанские фронты Новой народной армии были расформированы по регионам. Ее региональные комитеты были захвачены или расформированы, ее сельские налоговые сети разрушены, а то, что осталось от Центрального комитета, ничего не руководит из изгнания в Нидерландах.\n\nКоммунистическая партия Филиппин начала свою затяжную народную войну в 1969 году. Она пережила диктатуру Маркоса, четырех президентов и все мирные процессы, предпринятые с тех пор. Но она не переживет и эту войну."
 PHI.7.a: "Пятьдесят лет войны закончились."
 PHI.8.t: "Поселение в Осло"
 PHI.8.d: "Правительство Норвегии провело заключительный раунд переговоров между Манилой и Национальным демократическим фронтом. Соглашение предусматривает амнистию политическим заключенным и обязывает правительство к программе аграрной реформы и инвестиций в сельские районы. Взамен Новая народная армия будет демобилизована навсегда, а Фронт будет бороться за власть через легальные партии. Сторонники жесткой линии с обеих сторон осуждают сделку. Ни одна из сторон не требует от сил продолжать борьбу без участия другой."
 PHI.8.a: "Война заканчивается за столом переговоров."
 PHI.9.t: "Закон против династий принят."
 PHI.9.d: "Вопреки всем ожиданиям, Конгресс принял закон, разрешающий действие статьи II, раздела 26 Конституции. Родственники действующих должностных лиц во второй степени родства не могут занимать их должности или одновременно занимать должности в одной и той же юрисдикции.\n\nПровинциальные кланы, которые на протяжении поколений поставляли губернаторов, конгрессменов и президентов, теперь сталкиваются с избирательной картой, которую они не могут унаследовать. Руководство партии открыто для кандидатов, не имеющих семейной поддержки, и очень многие карьеры закончились в тот момент, когда президент подписал закон."
 PHI.9.a: "Эти семьи не являются владельцами Республики."
 PHI_news.1.t: "Эстрада был свергнут во время Второй народной революции."
 PHI_news.1.d: "Президент Джозеф Эстрада был вынужден уйти в отставку после нескольких дней массовых демонстраций и провала процедуры импичмента, которые спровоцировали политический кризис в Маниле. После того, как Вооруженные силы и Национальная полиция Филиппин отозвали свою поддержку президента, вице-президент Глория Макапагал Арройо приняла присягу, положив конец администрации Эстрады. Правительства стран Азии приветствовали мирную передачу власти, внимательно следя за политическим будущим Филиппин."
 PHI_news.1.a: "Драматическое завершение президентства Эстрады."
 PHI_news.2.t: "Эстрада пережила кризис"
 PHI_news.2.d: "Президент Филиппин Джозеф Эстрада чудом избежал, казалось бы, самого серьезного политического кризиса за время своего президентства. После того как Сенат проголосовал за принятие в качестве доказательства спорного «Второго конверта», процесс импичмента возобновился, а не погрузился в политический хаос. Это решение временно ослабило опасения по поводу массовых демонстраций и нового движения «Народная власть», позволив Эстраде остаться на посту президента, пока продолжается судебный процесс. Несмотря на эту передышку, обвинения в коррупции продолжают бросать длинную тень на администрацию, оставляя как иностранные правительства, так и финансовые рынки в неопределенности относительно политического будущего страны."
 PHI_news.2.a: "Эстрада остается у власти."
 PHI_edsa_dos_tt: "§YПрезидент Джозеф Эстрада был пойман на незаконной торговле деньгами, люди выходят на улицы. Если мы не решим эту проблему, мы не предпримем никаких мер.§!, §RЭто может означать конец всей нашей администрации в том виде, в каком мы её знаем.§!."