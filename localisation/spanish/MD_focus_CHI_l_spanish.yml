 china_news.43.d: "La República Popular China ha anunciado una postura estratégica formal hacia la península de Corea. El presidente Xi Jinping declaró que China ya no gestionará los asuntos coreanos a través de la ambigüedad."
 china_news.43.a: "Aceptar el anuncio."
