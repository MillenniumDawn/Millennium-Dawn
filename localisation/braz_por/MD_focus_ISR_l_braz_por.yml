 ISR_assassinate_scientists: "Assassinar Cientistas Nucleares"
 ISR_assassinate_scientists_desc: "Para conter o rápido avanço do desenvolvimento de armas nucleares no Irã, devemos assassinar seus cientistas, o que não os deterá, mas certamente os atrasará."
 ISR_assassinate_soleimani: "Operação Cabeça da Serpente"
 ISR_assassinate_soleimani_desc: "Qasem Soleimani é a nossa maior ameaça atualmente no Oriente Médio. Devemos conduzir uma operação conjunta com os EUA para neutralizá-lo."
 ISR_sayeret_drill: "Treinamentos do Sayeret Matkal"
 ISR_sayeret_drill_desc: "Devemos treinar e aprender junto com nosso aliado mais próximo, os Estados Unidos, especialmente considerando sua experiência em Guerra Urbana, que pode realmente nos ajudar se formos à guerra contra Gaza."
 ISR_prepare_maneuvers: "Preparar-se para Manobras em Massa"
 ISR_prepare_maneuvers_desc: "Nossos soldados devem estar preparados para manobras em massa e ações rápidas forçadas."
 ISR_periphery_recruitments: "Quebrar as Elites nos Recrutamentos"
 ISR_periphery_recruitments_desc: "Devemos demitir a velha elite de oficiais e designar novos oficiais de nossa força profissional."
 ISR_passover_massacre: "O Massacre de Pessach"
 ISR_passover_massacre_desc: "Caso ocorram ataques terroristas, devemos estar preparados antes e depois. Agora, devemos exigir da Palestina os nomes dos responsáveis pelo ataque terrorista!"
 ISR_disentanglement_plan_desc: "Um plano em fases para separar fisicamente as populações civis israelense e palestina, removendo assentamentos isolados no interior da Cisjordânia e reposicionando as forças militares em um perímetro mais defensável. Ao contrário de uma desocupação total, o plano mantém os principais blocos de assentamentos enquanto se retira de áreas consideradas estrategicamente insustentáveis."
 ISR_suppress_the_hebron_uprising: "Reprimir a Revolta de Hebron"
 ISR_suppress_the_hebron_uprising_desc: "A Palestina nos pediu que lidássemos com os radicais em seu território. Devemos agir para evitar mais problemas."
