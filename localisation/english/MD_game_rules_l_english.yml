 # AI RULES
 RULE_HARD_AI_ECONOMIC: "Economic AI"
 RULE_DISABLE_HARD_AI_ECONOMIC: "Standard restriction"
 RULE_DISABLE_HARD_AI_ECONOMIC_DESC: "A standard restriction for AI, which does not allow it to strengthen its economy. For a historical game"
 RULE_ENABLE_HARD_AI_ECONOMIC: "No restrictions"
 RULE_ENABLE_HARD_AI_ECONOMIC_DESC: "If you are bored that every game of AI does not get out of the economic crisis - this is for you. AI is no longer limited in making decisions about its economy. Be ready for many countries will become richer than yours. Only for those who are not afraid of a challenge. Greetings from the Battle AI;)"

 # Starting AI Political Power
 RULE_AI_STARTING_POLITICAL_POWER: "AI Starting Political Power"
 RULE_AI_STARTING_POLITICAL_POWER_NO: "No Starting Political Power"
 RULE_AI_STARTING_POLITICAL_POWER_NO_DESC: "The AI will not start with any political power."
 RULE_AI_STARTING_POLITICAL_POWER_250: "250 Political Power"
 RULE_AI_STARTING_POLITICAL_POWER_250_DESC: "Add 250 Political Power to all AI nations."
 RULE_AI_STARTING_POLITICAL_POWER_500: "500 Political Power"
 RULE_AI_STARTING_POLITICAL_POWER_500_DESC: "Add 500 Political Power to all AI nations."
 RULE_AI_STARTING_POLITICAL_POWER_1000: "1000 Political Power"
 RULE_AI_STARTING_POLITICAL_POWER_1000_DESC: "Add 1000 Political Power to all AI nations."

 # DISABLE AI DEBT WARS
 RULE_DISABLE_AI_DEBT_WAR_TITLE: "Debt Wars for AI"
 RULE_DISABLE_AI_DEBT_WAR: "Disable"
 RULE_DISABLE_AI_DEBT_WAR_DESC: "This disables the debt war feature for the AI. The AI will no longer take the option to invade a nation that defaults on its debt."
 RULE_ENABLE_AI_DEBT_WAR: "Enable"
 RULE_ENABLE_AI_DEBT_WAR_DESC: "This setup will make AI more likely to declare debt wars if you default on your debt to them."

 # Disable AI for Cont Focus
 RULE_ENABLE_AI_FIGHTING_AUTONOMY_FOCUS: "AI Uses §TIncrease Autonomy Focus§!"
 RULE_ENABLE_FIGHTING_AUTONOMY_FOCUS: "Enable"
 RULE_ENABLE_FIGHTING_AUTONOMY_FOCUS_DESC: "The AI will fight your autonomy by using the continuous focus §YImprove Autonomy§!."
 RULE_DISABLE_FIGHTING_AUTONOMY_FOCUS: "Disable"
 RULE_DISABLE_FIGHTING_AUTONOMY_FOCUS_DESC: "The AI will no longer fight your autonomy by using the continuous focus §YImprove Autonomy§!."

 # Disable AI Using Attaches
 RULE_ENABLE_AI_USING_ATTACHES: "Enable AI Using §YAttaché§!"
 RULE_ENABLE_AI_USING_ATTACHES_YES_DESC: "Enables the AI to allow them to use §YAttachés§! via Diplomatic Actions"
 RULE_ENABLE_AI_USING_ATTACHES_NO_DESC: "Disables the AI from using §YAttachés§! via Diplomatic Actions"

 # PEACE DEAL RULES
 RULE_ALLOW_MD_ANNEX: "Enable Border Gore Clean-up"
 RULE_OPTION_MD_ANNEX_NO_DESC: "There will be no effect on post-peace borders, and they will remain as they were drawn out in the conference."
 RULE_OPTION_MD_ANNEX_YES_DESC: "After a peace deal, if multiple instances of the same tag exist, all remaining tags will be integrated into the one with the most powerful overlord. The overlords strength will be determined by their power rank national spirit. Clean-up after a war may take up to 14 days to take place."
 RULE_ALLOW_CHAOTIC_PEACE_CONFERENCE: "Enable Chaotic Peace Deals"
 RULE_OPTION_CHAOTIC_PC_NO: "No"
 RULE_OPTION_CHAOTIC_PC_NO_DESC: "This option should hopefully stop everyone making land grabs in AI peace conferences.\nIt does this by limiting who can claim states to majors and faction leaders. (This will only affect the AI, not the player.)"
 RULE_OPTION_CHAOTIC_PC_YES: "Yes"
 RULE_OPTION_CHAOTIC_PC_YES_DESC: "For those who actually enjoy the cursed peace conferences, why limit the world to 1 §YRussia§! when 12 §YRussias§! are possible!\n(I am not responsible for the results that might happen from this option!)"

 RULE_ALLOW_PLAYER_LED_PEACE_CONFERENCE: "Enable Player Led Peace Conferences"
 RULE_OPTION_PLAYER_LED_PC_NO: "No"
 RULE_OPTION_PLAYER_LED_PC_NO_DESC: "This option will let the AI make their own choices, as dumb as they might be."
 RULE_OPTION_PLAYER_LED_PC_YES: "Yes"
 RULE_OPTION_PLAYER_LED_PC_YES_DESC: "For those that don't trust to AI to put the round peg in the round hole, this will allow only players to make claims during peace conferences."

 RULE_ALLOW_CONDITIONAL_PEACE_DEAL: "Allow Conditional Peace Deals"
 RULE_OPTION_CONDITIONAL_PEACE_DEAL_YES_DESC: "Will allow states at war to use the §YConditional Peace Deals§! scripted diplomatic action which will let states sign peace deals that do not require either side to fully capitulate."
 RULE_OPTION_CONDITIONAL_PEACE_DEAL_NO_DESC: "Bars states from using the §YConditional Peace Deals§! scripted diplomatic action which will force states to endure total war in order to reach a state of peace."

 RULE_ALLOW_CPD_AI_OFFERS: "Allow AI Conditional Peace Offers"
 RULE_OPTION_CPD_AI_OFFERS_YES_DESC: "Will allow AI states at war to periodically evaluate ongoing conflicts and propose §YConditional Peace Deals§! when they determine the war is unwinnable or stalemated. Overlords will also negotiate on behalf of restricted subjects."
 RULE_OPTION_CPD_AI_OFFERS_NO_DESC: "Bars AI states from initiating §YConditional Peace Deals§! on their own. Players may still propose deals manually through the diplomatic action."

 RULE_PEACE_PROPOSAL_BLOCKED_TT: "Whilst §YConditional Peace Deals§! are enabled this will be blocked, use §Y$CPD_OFFER_CONDITIONAL_PEACE_TITLE$§! instead!"

 # COUNTRY CONTENT
 RULE_OPTION_MD_RANDOM_PATH: "Random Path"
 RULE_OPTION_MD_RANDOM_PATH_DESC: "The AI draws one of this country's paths at random when the game begins, historical or alternate. Which one it drew stays hidden from you."
 RULE_OPTION_MD_NO_PATH: "No Path"
 RULE_OPTION_MD_NO_PATH_DESC: "The AI follows no scripted path and picks its focuses freely as the game develops. Its behaviour changes from run to run."

 RULE_SALAFIST_BRANCH: "Enable Salafist Branch"
 RULE_YES_SALAFIST_BRANCH_DESC: "Enables the Salafist branch in the generic tree for all nations regardless of starting religion."
 RULE_NO_SALAFIST_BRANCH_DESC: "Enables the Salafist branch in the generic tree for nations following any variation of Islam."

 #Liechtenstein
 LIC_AI_BEHAVIOR: "@LIC Liechtenstein"

 #South Ossetia
 SOO_AI_BEHAVIOR: "@SOO South Ossetia"

 #Afghanistan
 RULE_AFG_TALIBAN_INSURGENCY_INTENSITY: "@AFG Taliban Insurgency"
 RULE_AFG_TALIBAN_INSURGENCY_DEFAULT: "Historical"
 RULE_AFG_TALIBAN_INSURGENCY_DEFAULT_DESC: "The Taliban insurgency grows and fades at its normal rate."
 RULE_AFG_TALIBAN_INSURGENCY_WEAK: "Contained"
 RULE_AFG_TALIBAN_INSURGENCY_WEAK_DESC: "The Taliban rebuild half as fast. Counter-insurgency work sticks, and Afghanistan can realistically stamp the insurgency out."
 RULE_AFG_TALIBAN_INSURGENCY_RELENTLESS: "Relentless"
 RULE_AFG_TALIBAN_INSURGENCY_RELENTLESS_DESC: "The Taliban rebuild half again as fast. Holding the country together becomes a permanent campaign rather than a problem you solve once."
 RULE_AFG_NORTHERN_ALLIANCE_UPRISING: "@AFG Northern Alliance Uprising"
 RULE_AFG_NORTHERN_ALLIANCE_UPRISING_ALLOWED_DESC: "If the Taliban win the civil war, the Northern Alliance rises again a few months later under Ismail Khan, or under Ahmad Massoud from 2020."
 RULE_AFG_NORTHERN_ALLIANCE_UPRISING_BLOCKED_DESC: "A Taliban victory is final. No second front opens in the north."

 ###############
 ## GAME RULE ##
 ###############

 #Netherlands
 RULE_OPTION_HOL_HISTORICAL: "Historic"
 RULE_OPTION_HOL_HISTORICAL_DESC: "The AI will walk the real Dutch record: Kok's purple coalition gives way to Balkenende's CDA after the Fortuyn shock, Rutte's VVD takes over in 2010, Wilders' PVV wins in 2024 and Jetten's D66 in 2025. Party leaders retire on schedule as their real tenures end.\n"
 RULE_OPTION_HOL_RANDOM_DEMOCRATIC: "An Open Verdict"
 RULE_OPTION_HOL_RANDOM_DEMOCRATIC_DESC: "The Netherlands stays a western parliamentary democracy, but history is not written in advance: whichever party the polls favour forms the government, election after election.\n"
 RULE_OPTION_HOL_WESTERN_MONARCHY: "The Stadtholder Returns"
 RULE_OPTION_HOL_WESTERN_MONARCHY_DESC: "The AI will build support for a restored stadtholderate and rule through the Crown. It revives the West India Company and reaches for the Atlantic the Dutch way - through money, influence and client states rather than conquest.\n"
 RULE_OPTION_HOL_NATIONALIST_MONARCHY: "The Crown Militant"
 RULE_OPTION_HOL_NATIONALIST_MONARCHY_DESC: "The AI will raise a nationalist monarchist movement, restore the royal prerogative and rebuild the East India Company as an instrument of conquest. Fleet, marines and airpower come first, the Cape and Ceylon are taken as the stepping stones, and the Indies are the prize.\n"
 RULE_OPTION_HOL_NVU: "Nederlandse Volks-Unie"
 RULE_OPTION_HOL_NVU_DESC: "The AI will grow the NVU from a fringe movement into a governing party, then march on the Binnenhof. Army and air force are built for one purpose - to challenge France and England for mastery of a Germanic Europe.\n"

 #Russia
 RUS_AI_BEHAVIOR: "@SOV Russian Federation"
 RULE_OPTION_PUTIN: "United Russia"
 RULE_OPTION_PUTIN_AI_DESC: "The Russian Federation will seek to pursue United Russia's foreign policy and empower them.\n"
 RULE_OPTION_PEACEFUL_REFORM: "Liberal Russia"
 RULE_OPTION_PEACEFUL_REFORM_AI_DESC: "Russia will seek to make liberal reforms and pursue greater ties with the West.\n"
 RULE_OPTION_THE_RED_MENACE: "The Red Menace"
 RULE_OPTION_THE_RED_MENACE_AI_DESC: "Russia will start to drift towards Marxist policies, and will attempt to restore the Soviet Union.\n"
 RULE_OPTION_RISE_OF_RUSSIA: "Zhirinovsky's Russia"
 RULE_OPTION_RISE_OF_RUSSIA_AI_DESC: "Russia will start to drift towards nationalist policies, and will seek to pursue an aggressive foreign policy with the aims of proclaiming Greater Russia.\n"
 RULE_OPTION_NAZBOL_RUSSIA: "National Bolshevik Russia"
 RULE_OPTION_NAZBOL_RUSSIA_AI_DESC: "The National Bolsheviks are able to realize a different way for the development of their homeland. They will establish a new order in Russia in hopes of returning stability and greatness.\n"
 RULE_OPTION_IRON_DIMON_RUSSIA: "Iron Dimon"
 RULE_OPTION_IRON_DIMON_RUSSIA_AI_DESC: "Russia needs a new ruler who will not forever give in and negotiate with those who will betray our great homeland at any moment.\n"
 RULE_OPTION_LIBERAL_DIMON_RUSSIA: "Liberal Dimon"
 RULE_OPTION_LIBERAL_DIMON_RUSSIA_AI_DESC: "Dmitry Anatolyevich will finally go into the liberal path and lead Russia to liberalism.\n"
 RULE_OPTION_OLIGARCHS_RUSSIA: "Oligarchic Russia"
 RULE_OPTION_OLIGARCHS_RUSSIA_AI_DESC: "Oligarchs, already empowered heavily within Russia, will attempt to seize even more control for themselves.\n"

 #United States Of America
 RULE_OPTION_DEMOCRAT: "Democrat Leaning"
 RULE_OPTION_DEMOCRAT_AI_DESC: "The United States will seek to elect Democratic Party leadership and keep the nation, in a modern sense, towards a center-left consensus of ruling the nation."
 RULE_OPTION_REPUBLICAN: "Republican Leaning"
 RULE_OPTION_REPUBLICAN_AI_DESC: "The United States will seek to elect Republican Party leadership and keep the nation, in a modern sense, towards a center-right consensus of ruling the nation."
 RULE_OPTION_REFORMED_REPUBLIC: "Reformed Republic"
 RULE_OPTION_REFORMED_REPUBLIC_AI_DESC: "The people's will has been heard. The political pressure and public outcry has resulted in key political and economic reforms to allow the better representation and visibility of third parties. Now it is up to the people to elect a party which represents them."
 RULE_OPTION_POST_UNITED: "Post United Era"
 RULE_OPTION_POST_UNITED_AI_DESC: "The Eagle falls far more than from grace. §RDo Not Enable Historical AI§!"
 RULE_OPTION_ALL_AHEAD_SLOW: "All Ahead Slow"
 RULE_OPTION_ALL_AHEAD_SLOW_AI_DESC: "Enable this game rule to ensure the AI does not implode the US. Essentially taking the RNG factor out of non-historical AI mode."
 RULE_OPTION_GREAT_COLLAPSE: "The Great Collapse"
 RULE_OPTION_GREAT_COLLAPSE_AI_DESC: "With the fall of the USSR in 91 the rampant militarism of the United States became slowly more and more of a burden on the tax payer. A series of protests over the course of 1995-99 resulted in ever mounting casualties and resentment among the population and the staunch Cold War stuck federal government. Now reaching a boiling point at the turn of the century on top of fears of Y2K rumors of a national railroad strike are on the rise, a strike that could paralyze the economy and federal abilities to coordinate counter protest operations."
 RULE_OPTION_THE_GREAT_REBELLION: "The Great Rebellion"
 RULE_OPTION_THE_GREAT_REBELLION_AI_DESC: "With vying political and personal interest groups slowly dividing the nation. The population at large has grown apathetic to a point of potential crisis. Rumors of ever closer margins of votes and potential recounts strike fear and paranoia into the citizenry of the United States. However surely nothing like this could ever happen, after all it's practically a statistical anomoly...heh......right?"
 RULE_OPTION_HISTORICAL_PRESIDENTS: "Historical U.S. Presidents"
 RULE_OPTION_HISTORICAL_PRESIDENTS_AI_DESC: "The AI will elect presidents on the 20th of January of each election year based on historical victor."

 #Free States Of America
 USB_AI_BEHAVIOR: "@USB Free States Of America"
 RULE_OPTION_REVANCHIST_PATH: "Reclaiming Destiny"
 RULE_OPTION_REVANCHIST_PATH_AI_DESC: "The Federal influences will sway the Free States to gear their foreign policy towards revanchism for the continental 48 states. §R Must Have Either USA Game Rule Post United or USA Game Rule Great Collapse§!"
 RULE_OPTION_ISOLATION_PATH: "The Great Shutdown"
 RULE_OPTION_ISOLATION_PATH_AI_DESC: "The American dream is dead, the world seems like an ever expanding void. As such the people and political leaders decide that the best thing is to turn away from the world and just enjoy the sweet peace and quiet that their little corner shall hopefully bring. §R Must Have Either USA Game Rule Post United or USA Game Rule Great Collapse§!"
 RULE_OPTION_ARCADIA_PATH: "The Eastern Identity"
 RULE_OPTION_ARCADIA_PATH_AI_DESC: "With the American dream turned nightmare, federal influences falter. As such the people decided that a new way forward is only right and as such look to create a new \"Eastern Identity\" through the Arcadia Plan. §R Must Have Either USA Game Rule Post United or USA Game Rule Great Collapse§!"
 RULE_OPTION_SECOND_COAL_WARS: "The 2nd Coal Wars"
 RULE_OPTION_SECOND_COAL_WARS_AI_DESC: "The Free States will declare to the renewed UMWA organization that West Virginian mines will not be reopened on the principles of why they were closed to begin with, stating, \"Modern solutions and problems were the reason they closd to begin with\". As a result the miners will begin to riot and declare the state independent leading to the 2nd Coal Wars incident. §R Must Have Either USA Game Rule Post United or USA Game Rule Great Collapse§!"

 #Southern Republic Of America (CSA Tag)
 CSA_AI_BEHAVIOR: "@CSA Southern Republic Of America"
 RULE_OPTION_A_SOUTHERN_AMERICA_PATH: "A Southern America"
 RULE_OPTION_A_SOUTHERN_AMERICA_PATH_AI_DESC: "With the American dream still burning in the hearts of the Southern peoples many sway the views of government to reform the old glories and set forth to create a new America. A Southern America. §R Must Have Either USA Game Rule Post United or USA Game Rule Great Collapse§!"
 RULE_OPTION_GOLDEN_CIRCLE_PATH: "The Golden Circle"
 RULE_OPTION_GOLDEN_CIRCLE_PATH_AI_DESC: "Many Southerners believe that they should forge a new destiny, one which is uniquely Southern in nature. As such many in power wish to revist an old idea from the Confederacy as a way to solidify this new age of freedom. §R Must Have Either USA Game Rule Post United or USA Game Rule Great Collapse§!"
 RULE_OPTION_SOUTHERN_ARCADIA_PATH: "The Eastern Identity"
 RULE_OPTION_SOUTHERN_ARCADIA_PATH_AI_DESC: "With the American dream being burnt out and not many wanting to be too mired in the \"Confederate stigma\". Many Southerners look to the French influences of the Cajon and Creole peoples to forge a new identity. One that is not American or Confederate, but one that is ours nonetheless. §R Must Have Either USA Game Rule Post United or USA Game Rule Great Collapse§!"
 RULE_OPTION_THE_FLORIDA_UPRISING_PATH: "The Florida Uprising"
 RULE_OPTION_THE_FLORIDA_UPRISING_PATH_AI_DESC: "In the early days of tour young nation, socialist scum and sympathizers have taken over and stolen the elections. Now it is time for real southern patriots to defend what remains of our homes from these red devils. §R Must Have Either USA Game Rule Post United or USA Game Rule Great Collapse§!"

 #Cascadia
 CAS_AI_BEHAVIOR: "@CAS Cascadia"
 RULE_OPTION_ROCKY_MOUNTAIN_RESISTANCE_PATH: "Rocky Mountain Resistance"
 RULE_OPTION_ROCKY_MOUNTAIN_RESISTANCE_PATH_AI_DESC: "The Olympia government will allow local law enforcement to handle the rising unrest in the Rocky Mountain state of Idaho. Tihe failure of local law enforcement to get on top of the ever growing resistance movement results in an independence uprising against the Cascadian nation. §R Must Have Either USA Game Rule Post United or USA Game Rule Great Collapse§!"
 RULE_OPTION_PEACE_IN_OUR_TIME_PATH: "Peace In Our Time"
 RULE_OPTION_PEACE_IN_OUR_TIME_PATH_AI_DESC: "The Olympia government will send a special investigations unit to assist and lead the counter resistance movement. Over time their help will restore law and order and force the RMR's leader to disband the group which results in a more peaceful and united nation. §R Must Have Either USA Game Rule Post United or USA Game Rule Great Collapse§!"

 #Republic of Lakota
 LKT_AI_BEHAVIOR: "@LKT Republic of Lakota"
 RULE_OPTION_RECLAMATION_FRONT_WAR_PATH: "Reclamation Front War"
 RULE_OPTION_RECLAMATION_FRONT_WAR_PATH_AI_DESC: "The northern government will discard and degrade the random influx of natives under the Reclamation Front organization. As such an over zealous auditor sent by the government of Lakota goes on his own to meet with the RF leadership resulting in a swift rift being created, leading to eventual militarization and war between the RF controlled Kansas and Republic of Lakota. §R Must Have Either USA Game Rule Post United or USA Game Rule Great Collapse§!"
 RULE_OPTION_RECLAMATION_FRONT_PEACE_PATH: "Reclamation Front Peace"
 RULE_OPTION_RECLAMATION_FRONT_PEACE_PATH_AI_DESC: "Understanding the confusion of the reports, more investigations would be done, this results in the swift disproven of some of the more aggressive claims about the RF organization. With this new found unity talks would begin to work on rebuilding the nation and working together to form a better economic and social union over all. §R Must Have Either USA Game Rule Post United or USA Game Rule Great Collapse§!"

 #New England
 NEN_AI_BEHAVIOR: "@NEN New England"
 RULE_OPTION_GREEN_MOUNTAIN_REBELLION: "Green Mountain Rebellion"
 RULE_OPTION_GREEN_MOUNTAIN_REBELLION_AI_DESC: "Not giving in to petty political pressuring by a few loud voices. The New England national government will deny the Vermontese demands to move the seat of government to Monteplier. As a result, the animosity will continue to build until forced to quell the upstart rebellion in the state. §R Must Have Either USA Game Rule Post United or USA Game Rule Great Collapse§!"
 RULE_OPTION_THE_OTHER_NEW_CAPITAL: "The Other New Capital"
 RULE_OPTION_THE_OTHER_NEW_CAPITAL_AI_DESC: "Seeing as very few genuinely cared where the new capital was to be, the New England government accepts the \"demands\" of the Vermontese and moves the capital to Monteplier. §R Must Have Either USA Game Rule Post United or USA Game Rule Great Collapse§!"

 #Fiji
 FIJ_AI_BEHAVIOR: "@FIJ Fiji"
 RULE_OPTION_FIJ_HISTORICAL: "Historical"
 RULE_OPTION_FIJ_HISTORICAL_DESC: "The army removes the elected §8United Fiji Party§! government and installs a military-backed administration in its place. Stability returns to the islands, but final authority rests with the barracks and elections stay in abeyance."
 RULE_OPTION_FIJ_COUP_AVERTED: "The Coup Averted"
 RULE_OPTION_FIJ_COUP_AVERTED_DESC: "The standoff between the government and the army is defused before it can topple anyone, and the §8Fiji Labour Party§! takes office on a centre-left mandate. Reconciliation and public investment lead the agenda, and Fiji keeps the civilian government its neighbours had given up on."
 RULE_OPTION_FIJ_MILITARY_JUNTA: "The Officers' Republic"
 RULE_OPTION_FIJ_MILITARY_JUNTA_DESC: "The radicals in the §8Fijian Military Forces§! go further than the coup demanded and formalise open military rule, merging the police into the army under martial law. Politics is run from the barracks, and the Pacific gains an openly militarised state at the heart of its shipping lanes."
 RULE_OPTION_FIJ_RESTORED_KINGDOM: "The Crown Restored"
 RULE_OPTION_FIJ_RESTORED_KINGDOM_DESC: "The §8Great Council of Chiefs§! wins the crisis and refounds Fiji as a kingdom under an elected monarch. Chiefly custom becomes the basis of the state, and the indigenous establishment settles the ethnic question on its own terms."
 RULE_OPTION_FIJ_TECHNOCRACY: "Government by Engineers"
 RULE_OPTION_FIJ_TECHNOCRACY_DESC: "A council of engineers, planners and administrators takes the country and governs under a technocratic constitution. Party politics gives way to automation and industrial planning, and Fiji sets out to out-develop every economy in the region."
 RULE_OPTION_FIJ_EARLY_JUNTA: "The Barracks Move Early"
 RULE_OPTION_FIJ_EARLY_JUNTA_DESC: "The millennium hostage crisis is never contained, and the §8Fijian Military Forces§! take the country outright while parliament is still under siege. A militarised society hardens years ahead of schedule, and the region watches the coup habit take root far earlier."
 RULE_OPTION_FIJ_EARLY_KINGDOM: "The Crown Returns Early"
 RULE_OPTION_FIJ_EARLY_KINGDOM_DESC: "The millennium hostage crisis ends with the §8Great Council of Chiefs§! elevating an elected king rather than with a return to the republic. The monarchy is restored a full political generation early, and the second crisis that would have followed never comes."

 #Nigeria
 NIG_AI_BEHAVIOR: "@NIG Federal Republic of Nigeria"
 RULE_OPTION_RISE_OF_BOKO_HARAM: "Rise of Boko Haram"
 RULE_OPTION_RISE_OF_BOKO_HARAM_AI_DESC: "Pressures Nigeria to allow Boko Haram to take control over the country."
 RULE_OPTION_PDP_EMPOWERED: "People's Democratic Party"
 RULE_OPTION_PDP_EMPOWERED_AI_DESC: "People's Democratic Party is one of Nigeria's largest parties. It advocates primarily on the Christian end of the Religious Spectrum and non-aligned ideologies."
 RULE_OPTION_ANPP_EMPOWERED: "All Nigeria's People Party"
 RULE_OPTION_ANPP_EMPOWERED_AI_DESC: "The All Nigeria's People Party (or Progressive Democratic Congress in 2017) is the main opposition party in 2000 in Nigeria. It is important to note they closely resemble Social Democracy in Europe and push for major reforms in the country of Nigeria."

 #France
 FRA_AI_BEHAVIOR_MD: "@FRA France"
 RULE_OPTION_FRA_HISTORICAL: "Historical"
 RULE_OPTION_FRA_HISTORICAL_DESC: "The Fifth Republic holds its course as the presidency passes from Chirac to Sarkozy, then Hollande and Macron, with the §8Republicans§! and the centre trading office between them. France anchors European integration and keeps its hand on the Françafrique sphere."
 RULE_OPTION_FRA_SOCIALIST: "The Socialists Return"
 RULE_OPTION_FRA_SOCIALIST_DESC: "The §8Parti Socialiste§! takes the Élysée and governs on welfare expansion, shorter hours and a gentler line on public spending. France stays inside NATO and the Union, but argues for a social Europe rather than a purely liberal one."
 RULE_OPTION_FRA_LIBERAL: "The Liberal Centre"
 RULE_OPTION_FRA_LIBERAL_DESC: "The centrist §8UDF§! and its successor §8La République En Marche§! govern on deregulation, labour reform and deeper European federalism. France pushes harder than any other major power for a Union that acts as one."
 RULE_OPTION_FRA_GAULLIST: "The Gaullist Revival"
 RULE_OPTION_FRA_GAULLIST_DESC: "The §8Rassemblement pour la France§! revives Gaullist sovereigntism, loosening France from NATO command and insisting on an independent nuclear posture. France keeps its European seat but refuses to follow Washington's lead."
 RULE_OPTION_FRA_GREEN: "The Green Republic"
 RULE_OPTION_FRA_GREEN_DESC: "§8Les Verts§! and their successor §8Europe Écologie Les Verts§! win power and turn the state toward ecological transition, rethinking the nuclear fleet and heavy industry alike. France trades some growth for the loudest green voice in Europe."
 RULE_OPTION_FRA_FRANCE_UNBOWED: "France Unbowed"
 RULE_OPTION_FRA_FRANCE_UNBOWED_DESC: "§8La France Insoumise§! carries the radical left into office on a promise of a Sixth Republic and a break with European fiscal orthodoxy. France sets itself against the Union's rules and looks for partners outside the Western bloc."
 RULE_OPTION_FRA_NATIONAL_RALLY: "The National Rally"
 RULE_OPTION_FRA_NATIONAL_RALLY_DESC: "The §8Front National§! and its successor the §8Rassemblement National§! win the Republic outright and govern on immigration restriction and national preference. France presses for the exit door in Brussels and warms to Moscow."
 RULE_OPTION_FRA_COMMUNE: "The French Commune"
 RULE_OPTION_FRA_COMMUNE_DESC: "The §8Parti Communiste Français§! and the radical left break the Fifth Republic and proclaim the French Commune. France leaves the Western camp for a revolutionary line that alarms every capital on the continent."
 RULE_OPTION_FRA_KINGDOM: "The Kingdom of France"
 RULE_OPTION_FRA_KINGDOM_DESC: "A royalist coup ends the Republic and crowns a Bourbon or Orléanist claimant as King of France. The restored monarchy turns its back on Brussels and revives old quarrels with its neighbours."
 RULE_OPTION_FRA_EMPIRE: "The French Empire"
 RULE_OPTION_FRA_EMPIRE_DESC: "A Bonapartist coup ends the Republic and proclaims a new French Empire. The Empire pursues continental ambitions that set it against Germany and Britain alike."

 #Italy
 ITA_AI_BEHAVIOR_MD: "@ITA Italy"
 RULE_OPTION_ITA_HISTORICAL: "Historical"
 RULE_OPTION_ITA_HISTORICAL_DESC: "Power alternates between the §8Partito Democratico§! and the §8Forza Italia§! bloc, and Italy stays anchored in NATO and the European Union. Its governments spend themselves on organised crime, public debt, the southern question and their own administration rather than on the country's borders."
 RULE_OPTION_ITA_ROMAN_RESTORATION: "Restoration of the Roman Empire"
 RULE_OPTION_ITA_ROMAN_RESTORATION_DESC: "§8Fratelli d'Italia§! and the national right grow until they carry an election, dissolve parliament and crown an emperor over a restored Rome. Italy then claims the old imperial provinces one by one, from the African coast to Britannia."
 RULE_OPTION_ITA_MARCH_ON_ROME: "A Second March on Rome"
 RULE_OPTION_ITA_MARCH_ON_ROME_DESC: "The same movement takes power but keeps the republic, installing a §8fascist§! government in Rome. Italy presses its irredentist claims on the Adriatic and the Alps without reaching for the empire."
 RULE_OPTION_ITA_EASTERN_TURN: "Turn to the East"
 RULE_OPTION_ITA_EASTERN_TURN_DESC: "§8Rifondazione Comunista§! and the §8Partito dei Comunisti Italiani§! rebuild the Italian left and pull the country out of NATO. Italy courts Moscow and Beijing and seeks a place in the Shanghai Cooperation Organisation."

 #Taiwan
 ROC_AI_BEHAVIOR: "@TAI Republic of China"
 RULE_OPTION_TAI_PROJECT_NATIONAL_GLORY: "Project National Glory"
 RULE_OPTION_TAI_PROJECT_NATIONAL_GLORY_AI_DESC: "In accordance with the legacy of the late President Chiang Kai-shek, we will counterattack the mainland and unify China."
 RULE_OPTION_TAI_UNITE_CHANNEL: "Taiwan Strait Unification"
 RULE_OPTION_TAI_UNITE_CHANNEL_AI_DESC: "The two sides of the Taiwan Straits cannot remain divided forever, and will definitely move towards reunification under the same system."
 RULE_OPTION_TAI_STATUS_QUO: "Maintain Status Quo"
 RULE_OPTION_TAI_STATUS_QUO_AI_DESC: "No unification, no independence, no fight."
 RULE_OPTION_TAI_ROAD_TO_SPLIT: "Dream of Taiwan"
 RULE_OPTION_TAI_ROAD_TO_SPLIT_AI_DESC: "The two sides of the Taiwan Strait are governed separately and are not subordinate to each other. What is the Republic of China?"

 #Japan
 RULE_OPTION_JAP_HISTORICAL: "Historical"
 RULE_OPTION_JAP_HISTORICAL_DESC: "The §8Liberal Democrats§! keep the Diet, the alliance with Washington holds, and the Self-Defense Forces are normalised only as far as a hostile neighbourhood forces them to be. Japan writes off its bad loans, legislates against the birthrate collapse and the karoshi crisis, and leaves Article Nine standing."
 RULE_OPTION_JAP_NORMAL_NATION: "A Normal Nation"
 RULE_OPTION_JAP_NORMAL_NATION_DESC: "The §8Liberal Democrats§! spend down the Article Nine consensus until the Self-Defense Forces are written into the constitution as an army like any other. Japan rearms inside the American alliance and begins answering Beijing and Pyongyang on its own account."
 RULE_OPTION_JAP_SOCIAL_DEMOCRACY: "The Second Postwar"
 RULE_OPTION_JAP_SOCIAL_DEMOCRACY_DESC: "The §8Democratic Party§! breaks the conservative hold on the Diet and governs on disclosure, labour law and an open door for foreign workers. Japan spends its strength on the birthrate, the salaryman and the corruption that outlived the bubble rather than on the region."
 RULE_OPTION_JAP_PACIFIST: "The Peace Constitution"
 RULE_OPTION_JAP_PACIFIST_DESC: "The §8Social Democrats§! take the Diet on the promise that Article Nine means what it says, and the arms exports, the bases and finally the Self-Defense Forces are wound up. Japan tears up the security treaty with Washington and stands disarmed between China and the Koreas."
 RULE_OPTION_JAP_RETURN_OF_THE_EMPIRE: "The Return of the Empire"
 RULE_OPTION_JAP_RETURN_OF_THE_EMPIRE_DESC: "The §8Restoration Party§! grows out of the nationalist right until the throne is restored to power and Article Nine is struck out. Japan rearms behind a blue-water fleet and reclaims the Kurils, Korea, Taiwan and the old sphere in the Pacific by force."

 #Myanmar
 BRM_AI_BEHAVIOR: "@BRM Union of Myanmar"
 RULE_OPTION_BEACON_OF_DEMOCRACY: "Beacon of Democracy"
 RULE_OPTION_BEACON_OF_DEMOCRACY_AI_DESC: "Myanmar will pursue reform without compromise, rapidly propelling the NLD to power. Instead of making concessions to the Tatmadaw, Myanmar will mobilize various supporters of political liberalization, including ethnic rebel groups, with the aim of ending the military's influence in politics once and for all."
 RULE_OPTION_AN_IRON_FIST: "An Iron Fist"
 RULE_OPTION_AN_IRON_FIST_AI_DESC: "Only applicable to the 2000 start date, this game rule will compel Myanmar to remain a dictatorship and, instead of responding positively to pressure to reform as it did historically, react with repression and totalitarianism. Moreover, in order to distract from its loss of legitimacy the military government will pursue war not only with the country's rebel groups but also its neighbors."

 #Sweden
 RULE_OPTION_NORTHERN_AMBITION: "Northern Ambition"
 RULE_OPTION_NORTHERN_AMBITION_AI_DESC: "The Swedish far-right will see a surge in popularity, culminating in an attempt to establish a Swedish Empire in Northern Europe."
 RULE_OPTION_SWE_PRO_WESTERN: "Go West"
 RULE_OPTION_SWE_PRO_WESTERN_AI_DESC: "Sweden will draw closer to NATO and the EU."
 RULE_OPTION_SWE_RED_SWEDEN: "Swedish Republic"
 RULE_OPTION_SWE_RED_SWEDEN_AI_DESC: "The Swedish far-left will take power and abolish the monarchy."

 #Denmark
 RULE_OPTION_DEN_HISTORICAL: "The Fogh Years"
 RULE_OPTION_DEN_HISTORICAL_DESC: "§8Venstre§! and the §8Social Democrats§! trade Christiansborg between them while Denmark keeps its opt-outs, votes down the euro and sends soldiers to the Balkans, Iraq and Afghanistan. Copenhagen becomes Washington's most willing small ally in Europe and lets the Union deepen without it."
 RULE_OPTION_DEN_EUROPEAN_UNION: "At the Heart of Europe"
 RULE_OPTION_DEN_EUROPEAN_UNION_DESC: "The §8Social Liberals§! and the §8Social Democrats§! carry a second referendum and spend the Danish opt-outs to buy a seat at the centre of the Union. The krone gives way to the euro and Copenhagen anchors itself to Berlin and Paris rather than to Washington."
 RULE_OPTION_DEN_EUROSCEPTIC: "Out of the Union"
 RULE_OPTION_DEN_EUROSCEPTIC_DESC: "The §8Danish People's Party§! forces the question the old parties keep postponing, and Denmark walks out of Schengen and then out of the Union itself. Nordic defence cooperation takes the place of Brussels, and the rest of Scandinavia is asked to choose a side."
 RULE_OPTION_DEN_SOCIALIST: "The Red Flag over Christiansborg"
 RULE_OPTION_DEN_SOCIALIST_DESC: "The §8Red-Green Alliance§! and the trade unions turn the welfare state into a workers' state and set the councils above the Folketing. Denmark leaves the alliance and the Union, looks east for its friends, and offers the rest of the North a revolution."
 RULE_OPTION_DEN_MONARCHIST: "The Crown Restored"
 RULE_OPTION_DEN_MONARCHIST_DESC: "The court stops pretending to be ceremonial and the §8Danish People's Party§! carries the crown's case through a parliament that has lost the country's patience. The monarch takes back the powers the constitution removed, and Greenland and the Faroes are pulled firmly under Copenhagen's hand."
 RULE_OPTION_DEN_NATIONALIST: "Denmark for the Danes"
 RULE_OPTION_DEN_NATIONALIST_DESC: "The §8Danish People's Party§! takes the government it has only ever propped up and makes immigration and border control the whole of Danish politics. Denmark leaves the alliance and the Nordic Council, and begins pressing claims it has not raised since the Middle Ages."

 #Norway
 RULE_OPTION_NRY_LABOUR: "Labour Party"
 RULE_OPTION_NRY_LABOUR_AI_DESC: "Norway will keep the Labour Party in power, pursuing social democracy and close ties to NATO and the West."
 RULE_OPTION_NRY_CHRISTIAN_PEOPLES: "Christian People's Party"
 RULE_OPTION_NRY_CHRISTIAN_PEOPLES_AI_DESC: "Norway will rally behind the Christian People's Party, blending Christian social values with Nordic cooperation and development aid."
 RULE_OPTION_NRY_PROGRESS: "Progress Party"
 RULE_OPTION_NRY_PROGRESS_AI_DESC: "Norway will empower the Progress Party, pushing tax cuts, tighter immigration and an oil-funded state."

 #Greenland
 GRN_AI_BEHAVIOR: "@GRN Greenland"
 RULE_OPTION_GRN_HISTORICAL: "Historical"
 RULE_OPTION_GRN_HISTORICAL_DESC: "Greenland gains self-government from Denmark and invests its efforts in settlement, fishing, mining and public services rather than foreign adventure. The Arctic stays quiet and Greenland's Nordic neighbours keep the borders they have."
 RULE_OPTION_GRN_SCANDINAVIAN_SERENITY: "Scandinavian Serenity"
 RULE_OPTION_GRN_SCANDINAVIAN_SERENITY_DESC: "Greenland gathers Iceland, the Faroes, Denmark, Norway, Sweden and Finland into a §8Nordic Union§!, then stops at the Baltic shore. Scandinavia speaks with one voice and the wider European order stays as it was."
 RULE_OPTION_GRN_CONTINENTAL_HEGEMONY: "Continental Hegemony"
 RULE_OPTION_GRN_CONTINENTAL_HEGEMONY_DESC: "Greenland carries its §8Nordic Union§! south and east until the §8Frozen Federation§! sprawls across most of Europe. The continent's capitals answer to Nuuk and the old European order is finished."

 #Syria
 SYR_AI_BEHAVIOR: "@SYR Syrian Arab Republic"
 RULE_OPTION_SYR_HISTORICAL: "Historical AI"
 RULE_OPTION_SYR_HISTORICAL_DESC: "Hafez al-Assad will be succeeded by his oldest son Bashar al-Assad. Bashar will keep Syria as a country aligned to Russia with a balanced focus of diplomacy, military and economy."
 RULE_OPTION_SYR_IRON_LADY: "Iron Lady of Syria"
 RULE_OPTION_SYR_IRON_LADY_DESC: "Hafez al-Assad will be succeeded by his daughter Bushra al-Assad. Bushra will take a more neutral approach between the great powers with a focus on diplomacy and economy."
 RULE_OPTION_SYR_SYRIAN_SAVAGE: "Syrian Savage"
 RULE_OPTION_SYR_SYRIAN_SAVAGE_DESC: "Hafez al-Assad will be succeeded by youngest son Maher al-Assad. Maher will try to form Greater Syria and carve a new power in the Middle East. He will focus on military and economic expansion."
 RULE_OPTION_SYR_NEW_ASSAD: "New al-Assad"
 RULE_OPTION_SYR_NEW_ASSAD_DESC: "Hafez al-Assad will be succeeded by his brother Rifaat al-Assad after the Damascus Spring. Rifaat will focus on a pro-Saudi policy with focus on diplomacy and economy."
 RULE_OPTION_SYR_DAMASCUS_SPRING: "Damascus Spring"
 RULE_OPTION_SYR_DAMASCUS_SPRING_DESC: "Syria will be overtaken by the Damascus Spring movement and turned into a democracy."

 #Turkey
 TUR_AI_BEHAVIOR_MD: "@TUR Türkiye"
 RULE_OPTION_TUR_HISTORICAL: "Historical AI"
 RULE_OPTION_TUR_HISTORICAL_DESC: "The banking crisis destroys the §8Virtue Party§!, and the §8Justice and Development Party§! that splinters from it takes the country. Turkey turns to neo-Ottoman diplomacy in the Middle East and the Balkans while the presidency slowly outgrows the parliament."
 RULE_OPTION_TUR_KEMALIST_GUARD: "Guards of Kemalism"
 RULE_OPTION_TUR_KEMALIST_GUARD_DESC: "The Islamists are banned before they can regroup and the §8secular republic§! closes ranks behind the General Staff. Turkey stays anchored to NATO and answers the Kurdish question with the army rather than with reform."
 RULE_OPTION_TUR_GREY_WOLVES: "The Grey Wolves"
 RULE_OPTION_TUR_GREY_WOLVES_DESC: "The §8nationalist right§! wins the chamber, ends the elections and crowns a sultan over a restored Ottoman state. Turkey presses its claims across Thrace, the Caucasus and the Turkic world."
 RULE_OPTION_TUR_HIZMET: "The Hizmet Movement"
 RULE_OPTION_TUR_HIZMET_DESC: "The §8Gülenist§! network inherits the wreckage of the Virtue Party and takes the state through the courts, the police and the schools rather than the ballot box. Turkey projects a moderate Islam abroad while quietly hollowing out its own institutions."
 RULE_OPTION_TUR_TURKISH_LEFT: "Return of the Turkish Left"
 RULE_OPTION_TUR_TURKISH_LEFT_DESC: "The anti-establishment vote swings to the §8revolutionary left§! instead of the Islamists. Turkey leaves NATO, recognises its minorities and sets itself up as an anti-imperialist vanguard in the region."
 RULE_OPTION_TUR_GREAT_EAST: "The Great East"
 RULE_OPTION_TUR_GREAT_EAST_DESC: "The Virtue Party takes power, defuses the General Staff and then radicalises into a §8Salafist§! movement that dissolves the republic. Turkey proclaims a caliphate and expands in every direction it can reach."

 #Bahrain
 BHR_AI_BEHAVIOR: "@BHR Bahrain"
 RULE_OPTION_BHR_HISTORICAL: "The Al Khalifa Charter"
 RULE_OPTION_BHR_HISTORICAL_DESC: "The crown buys peace with a national charter and an elected chamber, then breaks the §8February 14 Youth Coalition§! with Saudi armour once the roundabout fills. Bahrain remains the American fleet's harbour and the most dependable client Riyadh has."
 RULE_OPTION_BHR_DAY_OF_RAGE: "Day of Rage"
 RULE_OPTION_BHR_DAY_OF_RAGE_DESC: "§8Al-Wefaq§! holds the roundabout until the Shia majority can finally vote itself into the government it has always been denied. Bahrain retires the monarchy for a republic and answers to Tehran instead of Riyadh."
 RULE_OPTION_BHR_CROWNED_DEMOCRACY: "The Constitutional Bargain"
 RULE_OPTION_BHR_CROWNED_DEMOCRACY_DESC: "The crown legalises §8Wa'ad§! and its rivals and hands a genuine parliament the business of governing, keeping the throne above the argument rather than in it. Bahrain becomes the first working democracy in the Gulf without ever leaving the Western camp."

 #São Tomé and Príncipe
 SAO_AI_BEHAVIOR: "@SAO Democratic Republic of São Tomé and Príncipe"
 RULE_OPTION_SAO_DYNAMIC: "Dynamic Behaviour"
 RULE_OPTION_SAO_DYNAMIC_AI_DESC: "@SAO São Tomé and Príncipe bases its decisions on diplomatic influence, domestic conditions, and if the game is set to Historical game mode or not."
 RULE_OPTION_MENEZES_WINS_FOILED_COUP: "Fradique de Menezes - Foiled Coup"
 RULE_OPTION_MENEZES_WINS_FOILED_COUP_AI_DESC: "In 2001, @SAO São Tomé and Príncipeelects Fradique de Menezes as president and survives an attempted coup in 2003"
 RULE_OPTION_MENEZES_WINS_COUP: "Fradique de Menezes - Bloodless Coup"
 RULE_OPTION_MENEZES_WINS_COUP_AI_DESC: "Fradique de Menezes is elected president, but Major Fernando Pereira later seizes full control of \n@SAO São Tomé and Príncipe in a bloodless coup."
 RULE_OPTION_SAO_MENEZES_WINS_NO_ATTEMPTED_COUP: "Fradique de Menezes - Avoid Deadlock"
 RULE_OPTION_SAO_MENEZES_WINS_NO_ATTEMPTED_COUP_AI_DESC: "Fradique de Menezes is elected president of \n@SAO São Tomé and Príncipeand the civilian rule remains unchallenged."
 RULE_OPTION_SAO_COSTA_WINS: "Manuel Pinto da Costa"
 RULE_OPTION_SAO_COSTA_WINS_AI_DESC: "Manuel Pinto da Costa wins the 2001 @SAO São Tomé and Príncipepresidential election."

 #Saudi Arabia
 SAU_AI_BEHAVIOR: "@SAU Kingdom of Saudi Arabia"
 RULE_OPTION_GLOBAL_JIHAD_GCC_FIRST: "Global Jihad - GCC First"
 RULE_OPTION_GLOBAL_JIHAD_GCC_FIRST_AI_DESC: "Saudi Arabia will attempt to reform its economy and unify the GCC as a superstate. Then, the Saudi monarchy will be overthrown by an al-Qaeda uprising, leading to the establishment of a radical Islamic state that seeks to spread its fundamentalist ideology through violent means."
 RULE_OPTION_GLOBAL_JIHAD: "Global Jihad"
 RULE_OPTION_GLOBAL_JIHAD_AI_DESC: "The Saudi monarchy will be overthrown by an al-Qaeda uprising, leading to the establishment of a radical Islamic state that seeks to spread its fundamentalist ideology through violent means."
 RULE_OPTION_ISLAMIC_AWAKENING: "Islamic Awakening"
 RULE_OPTION_ISLAMIC_AWAKENING_AI_DESC: "The Muslim-Brotherhood influenced Sahwa, or Awakening Movement, will successfully pressure the Saudi monarchy into giving way to a pluralist Islamic democracy."
 RULE_OPTION_RETURN_OF_THE_BAATH: "Return of the Baath"
 RULE_OPTION_RETURN_OF_THE_BAATH_AI_DESC: "Saudi Arabia will gradually liberalize, providing an opportunity for the Baath party's unique ideology of socialist Arab nationalism to gain a foothold in the country. Baathist Arabia will then seek to expel foreign troops from the Middle East, as well as expand its own territory."
 RULE_OPTION_SHIA_REVIVAL: "Shia Revival"
 RULE_OPTION_SHIA_REVIVAL_AI_DESC: "The Shia of Saudi Arabia will take the opportunity presented by political liberalization to take over Saudi Arabia, aligning the country with Iran and Russia."

 #Solomon Islands
 SOL_AI_BEHAVIOR: "@SOL Solomon Islands"
 RULE_OPTION_SOL_DYNAMIC: "Dynamic Behaviour"
 RULE_OPTION_SOL_DYNAMIC_AI_DESC: "The @SOL Solomon Islands bases its decisions on diplomatic influence, domestic conditions, and if the game is set to Historical game mode or not."
 RULE_OPTION_AUSTRALIAN_PEACE: "Intervention & Amnesty"
 RULE_OPTION_AUSTRALIAN_PEACE_AI_DESC: "The  @SOL Solomon Islands will pursue a peace process supported by its largest influencer. \nNOTE: @AST Australia is the @SOL Solomon Islands largest influencer on game start."
 RULE_OPTION_SOLOMON_BILL_FAILS_RASTA_COUP: "April Communique Fails - Rasta Coup"
 RULE_OPTION_SOLOMON_BILL_FAILS_RASTA_COUP_AI_DESC: "Bartholomew Ulufa'alu failed to implement the Munda Accords, leading to war with the Isatabu Freedom Movement, followed by a coup d'état carried out by the Malaita Eagle Force under the leadership of Jimmy \"Rasta\" Lusibaea"
 RULE_OPTION_AST_REJECTS_TEE_REBEL: "The Te'e Coup"
 RULE_OPTION_AST_REJECTS_TEE_REBEL_AI_DESC: "Following the failure of any regional power to intervene, Andrew Te'e assumes leadership of the Isatabu Freedom Movement, leading to civil war in the @SOL Solomon Islands."

 #UK
 BRI_AI_BEHAVIOR: "@ENG United Kingdom"
 RULE_OPTION_ENG_HISTORICAL: "Historic"
 RULE_OPTION_ENG_HISTORICAL_DESC: "The AI walks the real British record. Blair's Labour governs on through a second and third manifesto, the Conservatives take office in 2010, and the premiership passes from Cameron to May, Johnson, Truss and Sunak before Starmer returns Labour to power. Party leaders retire as their real tenures end, and the Union holds.\n"
 RULE_OPTION_ENG_RISE_OF_BRITAIN: "The Rise of Britain"
 RULE_OPTION_ENG_RISE_OF_BRITAIN_DESC: "Britain stays a parliamentary democracy and rebuilds the empire without firing a shot. Westminster pours its political capital into the old colonies, buying the press, the parties and the ministries, until governments from the Caribbean to the Pacific answer to London again. It avoids wars that would spend the influence it needs.\n"
 RULE_OPTION_RULE_BRITANNIA: "Rule Britannia"
 RULE_OPTION_RULE_BRITANNIA_AI_DESC: "Once, this sceptered isle was known and feared the world over. The British monarch presided over the empire upon which the sun never set. Now however, Britain's international position has fallen into decline. A mere lackey of the United States, a shadow of its former self. The time has come for the British Empire to be restored. The Crown's partisans will break the two-party system, build their movement through the decade and take power outright in 2010 - and then the fleet sails.\n"

 #China
 RULE_OPTION_CHI_HISTORICAL: "The Great Rejuvenation"
 RULE_OPTION_CHI_HISTORICAL_DESC: "The §8Shanghai clique§! hands the Party to the §8Tuanpai§! and the Tuanpai to Xi Jinping, and Hong Kong's autonomy is dismantled in its turn. Beijing presses its claims in the South China Sea and across the Strait without going to war for them."
 RULE_OPTION_CHI_HEGEMON: "The Middle Kingdom Restored"
 RULE_OPTION_CHI_HEGEMON_DESC: "The §8Chongqing model§! carries Bo Xilai to the leadership and the §8Wolf Warriors§! are let off the leash early. China settles the Himalayan frontier by force, brings Bhutan, Nepal and India to heel, and takes Taiwan by storm."
 RULE_OPTION_CHI_PEACEFUL_RISE: "Peaceful Rise"
 RULE_OPTION_CHI_PEACEFUL_RISE_DESC: "Zeng Qinghong inherits Jiang's machine and the §8Shanghai technocrats§! hold to Deng's course. One Country, Two Systems is honoured, Tibet and Xinjiang are governed by statute rather than campaign, and reunification is pursued at the negotiating table."

 #Greece
 RULE_OPTION_GRE_HISTORICAL: "Historical"
 RULE_OPTION_GRE_HISTORICAL_DESC: "§8New Democracy§! carries Greece through the debt crisis on austerity and the euro, cutting the budget to the bone before the recovery arrives. Athens anchors itself deeper into the European Union and NATO, binding Cyprus, Israel and France into an EastMed front."
 RULE_OPTION_GRE_COMMUNIST: "The Red Acropolis"
 RULE_OPTION_GRE_COMMUNIST_DESC: "The collapse hands the state to the §8Communist Party of Greece§!, which writes a new constitution, nationalises the banks and raises a red army. Greece leaves NATO and organises a communist bloc across the Balkans, pressing its claims on Bulgaria, Albania, North Macedonia, Serbia and Romania."
 RULE_OPTION_GRE_NATIONALIST: "The Golden Dawn"
 RULE_OPTION_GRE_NATIONALIST_DESC: "§8Golden Dawn§! rides the same collapse into power, buries the republic under a Metaxist dictatorship and silences the press and the opposition. Greece revives the Megali Idea and stakes territorial claims on Albania, Bulgaria, North Macedonia and Turkey."
 RULE_OPTION_GRE_MULTIPOLAR: "Turning East"
 RULE_OPTION_GRE_MULTIPOLAR_DESC: "The republic survives but turns on the European Union, courting Russia, China and Iran and selling Piraeus to Chinese capital. Greece joins BRICS and walks out of NATO, trading its place in the Western camp for a seat in a multipolar order."

 #Hong Kong
 RULE_OPTION_HKG_HISTORICAL: "Historical"
 RULE_OPTION_HKG_HISTORICAL_DESC: "The §8pro-Beijing camp§! keeps the Special Administrative Region on Beijing's course, rebuilding the §8Legislative Council§! around patriots, putting patriotic education in the schools and letting Cantonese civic life wither. Its money follows: Hong Kong becomes the renminbi's offshore hub and the financier of the §8Belt and Road§!, and the §8Greater Bay Area§! swallows what the §8Basic Law§! promised."
 RULE_OPTION_HKG_INDEPENDENCE: "A Nation of Our Own"
 RULE_OPTION_HKG_INDEPENDENCE_DESC: "Hong Kong tears up the puppet arrangement, writes a constitution of its own and raises an army and a carrier fleet to defend it. It then stakes an irredentist claim on the Pearl River delta, daring Beijing to answer for Guangdong."
 RULE_OPTION_HKG_BRITISH: "Back Under the Crown"
 RULE_OPTION_HKG_BRITISH_DESC: "Hong Kong leaves Chinese sovereignty and asks London back, granting the United Kingdom garrison rights, joining the §8AUKUS§! intelligence share and legislating universal suffrage and an independent judiciary. A §8Commonwealth§! realm on China's doorstep hands the West the democratic foothold Beijing spent decades closing."
 RULE_OPTION_HKG_CITY_STATE: "The Free City"
 RULE_OPTION_HKG_CITY_STATE_DESC: "Hong Kong rewrites the §8Basic Law§! on its own authority, keeps a coastal defence force in place of an army and makes itself the financial capital of East Asia. Sworn to no bloc, it trades with Beijing and Washington alike and answers to neither."

 # Comoros
 COM_AI_BEHAVIOR: "@COM Comoros"
 RULE_OPTION_COM_HISTORICAL: "The Union of the Comoros"
 RULE_OPTION_COM_HISTORICAL_DESC: "Azali Assoumani trades the uniform for the ballot box, the islands each get a president and the union presidency rotates between them, and African Union troops take Anjouan back from its colonel. The §8Convention for the Renewal of the Comoros§! wins and then loses power peacefully, and the archipelago finally stops overthrowing itself."
 RULE_OPTION_COM_MILITARY_DICTATORSHIP: "The Colonel Stays"
 RULE_OPTION_COM_MILITARY_DICTATORSHIP_DESC: "Azali keeps the presidency he took in uniform, pulls the islands back under Moroni and lets the rotation die before it reaches anyone else. Comoros drifts out of the French orbit and looks to Beijing and the African Union for the recognition Paris no longer offers."
 RULE_OPTION_COM_ORANGE_PARTY: "The Orange Ascendancy"
 RULE_OPTION_COM_ORANGE_PARTY_DESC: "Mohamed Daoudou's §8Orange Party§! takes Moroni and runs the archipelago as a merit-picked technocracy, breaking the trafficking rings and professionalising the ministries. Comoros sells itself to Western capital as the one Indian Ocean microstate whose paperwork can be trusted."
 RULE_OPTION_COM_ISLAMIC_REPUBLIC: "An Arabic Republic"
 RULE_OPTION_COM_ISLAMIC_REPUBLIC_DESC: "The mosque committees carry Ahmed Abdallah Mohamed Sambi into the presidency and the §8Ba'athist movement§! remakes the islands as an Arab republic. The ports are nationalised, Damascus and Baghdad replace Paris, and the Comoros becomes an Arab League voice in the Mozambique Channel."
 RULE_OPTION_COM_WARRIOR_KING: "The Warrior King"
 RULE_OPTION_COM_WARRIOR_KING_DESC: "Robert Denard returns to the islands one last time and the §8Presidential Guard§! hands him the palace without a shot. Comoros stops being a country with an army and becomes an army with a flag to rent, selling its mercenaries across Africa."

 #Canada
 RULE_OPTION_CAN_HISTORICAL: "Historical"
 RULE_OPTION_CAN_HISTORICAL_DESC: "The §8Liberal Party§! governs from the centre, keeps both founding languages in the machinery of the federation and answers Quebec with a clarity law rather than concessions. Canada stays inside NATO and the North American trade area, and remains Washington's steadiest neighbour."
 RULE_OPTION_CAN_FRENCH_CANADA: "A French Canada"
 RULE_OPTION_CAN_FRENCH_CANADA_DESC: "The §8Bloc Québécois§! turns a language grievance into a federal programme, makes French the single language of the state and moves the seat of government to Quebec. Anglophone Canada finds itself a minority in its own capital, and the union holds together by law rather than consent."
 RULE_OPTION_CAN_ARMED_NEUTRALITY: "The True North Alone"
 RULE_OPTION_CAN_ARMED_NEUTRALITY_DESC: "Canada walks out of NATO, ends its foreign entanglements and spends the savings on the home economy and a self-sufficient defence industry. The northern flank of the alliance goes quiet, and Washington loses the second army on its own continent."
 RULE_OPTION_CAN_NATIONALIST: "The Nationalist Coup"
 RULE_OPTION_CAN_NATIONALIST_DESC: "§8Canada First§! rides the wreckage of the constitutional order into office, suspends elections and answers Quebec and the reservations with emergency powers. Canada turns on its own continent, and the longest undefended border in the world is fortified from the northern side."
 RULE_OPTION_CAN_EASTERN_REALIGNMENT: "The Arctic Bridge"
 RULE_OPTION_CAN_EASTERN_REALIGNMENT_DESC: "Ottawa leaves NATO and sells its Arctic routes, ports and resources to Moscow and Beijing instead of Washington. Canada becomes the northern end of a Russo-Chinese sphere, and the United States wakes to a rival on its own continent."

 #Chechnya
 CHE_AI_BEHAVIOR: "@CHE Chechnya"
 RULE_OPTION_CHE_HISTORICAL: "Historical"
 RULE_OPTION_CHE_HISTORICAL_DESC: "The second war ends with §8Ichkeria§! destroyed and the republic reabsorbed into Russia under the Kadyrovs. Chechnya trades independence for reconstruction money and becomes Moscow's most reliable enforcer in the Caucasus."
 RULE_OPTION_CHE_CALIPHATE: "The Caucasus Emirate"
 RULE_OPTION_CHE_CALIPHATE_DESC: "The foreign §8mujahideen§! push the secular separatists aside and rule what survives of the republic under sharia. Chechnya becomes a sanctuary for §8al-Qaeda§! and a launching point for jihad across the Caucasus and into Russia itself."
 RULE_OPTION_CHE_CAUCASUS_CONFEDERATION: "Confederation of the Caucasus"
 RULE_OPTION_CHE_CAUCASUS_CONFEDERATION_DESC: "The secular officers break the §8Islamists§! and rebuild Ichkeria as the core of a union of the North Caucasus peoples. Chechnya leans on Ankara and Baku for the weight it needs to keep Moscow out of the mountains."
 RULE_OPTION_CHE_WESTERN_ALIGNMENT: "Recognition from the West"
 RULE_OPTION_CHE_WESTERN_ALIGNMENT_DESC: "The §8Islamists§! are pushed out and the republic spends its independence chasing recognition in Western capitals rather than allies in the mountains. Chechnya buys its survival with democratic credentials and a seat at Europe's table."
 RULE_OPTION_CHE_SOCIALIST_CAUCASUS: "The Red Caucasus"
 RULE_OPTION_CHE_SOCIALIST_CAUCASUS_DESC: "§8Salman Raduev§!'s faction takes the republic and fuses Islam with the Soviet order the mountains still remember. Chechnya proclaims a Caucasian socialist republic and settles with Moscow as an equal rather than as a subject."

 #Botswana
 BOT_AI_BEHAVIOR: "@BOT Botswana"
 RULE_OPTION_BOT_HISTORICAL: "The BDP Endures"
 RULE_OPTION_BOT_HISTORICAL_DESC: "The §8Botswana Democratic Party§! hands the presidency from one of its own to the next and wins every election it contests, while diamond revenue pays for the schools, the clinics and the fight against AIDS. Botswana stays the quiet success of the continent, non-aligned and solvent, and willing to say aloud what its neighbours will not."
 RULE_OPTION_BOT_POLITICAL_RAINBOW: "The Umbrella Opens"
 RULE_OPTION_BOT_POLITICAL_RAINBOW_DESC: "The opposition stops splitting the vote and gathers behind the §8Umbrella for Democratic Change§!, breaking the grip the §8Botswana Democratic Party§! has held since independence. Botswana gets its first change of government, and southern Africa gets proof that a liberation party can be voted out."
 RULE_OPTION_BOT_KGOSIKGOLO: "Crowning the Kgosikgolo"
 RULE_OPTION_BOT_KGOSIKGOLO_DESC: "The §8Dikgosi§! turn the House of Chiefs from an advisory chamber into the seat of power, and raise one of their own as paramount chief over the whole country. Elections give way to a traditional monarchy, and the model democracy of the continent becomes something its neighbours no longer recognise."

 #North Korea
 NKO_AI_BEHAVIOR: "@NKO Korea DPR"
 RULE_NKO_NAM_RULES: "Kim Jong-nam"
 RULE_NKO_NAM_RULES_DESC: "Kim Jong-nam will control the power, and he will change Korea in the path of \"Reform and Open up\" forever."
 RULE_NKO_UN_RULES: "Kim Jong-un"
 RULE_NKO_UN_RULES_DESC: "As Kim Jong-il's chosen successor, Kim Jong-un will continue along the path of Juche, anti-Americanism, self-reliance, and oppressive rule."
 RULE_NKO_JUNTA_RULES: "Junta Coup"
 RULE_NKO_JUNTA_RULES_DESC: "The military leads a coup to preserve Juche's purity, they will always embrace Juche and consolidate power in the hands of a junta."
 RULE_NKO_Yo_jong: "Kim Yo-jong"
 RULE_NKO_Yo_jong_ALLOWED_DESC: "Kim Yo-jong will lead the Korean peninsula towards a bright path."
 RULE_NKO_Yo_jong_BLOCKED_DESC: "Do not allow Kim Yo-jong to take power."
 VEN_AI_BEHAVIOR: "@VEN Venezuela"
 RULE_VEN_CHAVISMO_CONTINUES: "Chavismo Continues"
 RULE_VEN_CHAVISMO_CONTINUES_DESC: "Bolivarian socialism persists under the United Socialist Party, continuing the missions, PDVSA nationalization, and the wider Bolivarian revolutionary project across the continent."
 RULE_VEN_OPPOSITION_STATIST: "Opposition, Monopolist Model"
 RULE_VEN_OPPOSITION_STATIST_DESC: "The democratic opposition takes power but preserves a state-monopolist economy, keeping PDVSA and the commanding heights under government control."
 RULE_VEN_OPPOSITION_LIBERTARIAN: "Opposition, Free-Market Model"
 RULE_VEN_OPPOSITION_LIBERTARIAN_DESC: "The democratic opposition takes power and pursues sweeping deregulation and privatization, opening Venezuela's economy to foreign and domestic capital."
 RULE_VEN_MILITARY_JUNTA: "Military Junta"
 RULE_VEN_MILITARY_JUNTA_DESC: "A right-wing or military-backed authoritarian government seizes power, pursuing nationalist strongman rule or an aggressive, expansionist foreign policy."

 #Singapore
 SIN_AI_BEHAVIOR: "@SIN Singapore"
 SIN_GLOBAL_DIPLOMACY: "Global Diplomacy"
 SIN_GLOBAL_DIPLOMACY_DESC: "Singapore's goal in the world is to establish a new order of Global Diplomacy."
 SIN_SINGAPORE_ALONE: "Singapore Alone"
 SIN_SINGAPORE_ALONE_DESC: "Historical - This is the historical path of Singapore.\n\nSingapore is best standing alone."
 SIN_PRESSURE_SOUTH_ASIAN_SEAS: "Pressure the South Asian Seas"
 SIN_PRESSURE_SOUTH_ASIAN_SEAS_DESC: "A new wave of Singaporean strength is usherings its way in."

 #Thailand
 SIA_AI_BEHAVIOR: "@SIA Thailand"
 RULE_OPTION_SIA_DEFAULT_AI_DESC: "Thailand follows its ordinary course. Thai Rak Thai and its successors dominate the 2000s, the Democrats and the palace contest them, and Move Forward rises in the 2020s. Bangkok will not turn communist, will not press the irredentist claims, and will not build SEATO."
 RULE_OPTION_SIA_PAN_THAI: "Pan-Thai (Greater Thailand)"
 RULE_OPTION_SIA_PAN_THAI_AI_DESC: "Thailand pursues the lost territories and ASEAN hegemony, rearming hard and pressing its claims against its neighbours."
 RULE_OPTION_SIA_SEATO_LEADER: "SEATO Leader"
 RULE_OPTION_SIA_SEATO_LEADER_AI_DESC: "Thailand builds SEATO, gathering Southeast Asia into a regional defence pact under Bangkok's leadership rather than expanding at its neighbours' expense."
 RULE_OPTION_SIA_ALT_HISTORY: "Alt-History"
 RULE_OPTION_SIA_ALT_HISTORY_AI_DESC: "Thailand takes the communist path, drifting away from Washington and the West. It will not pursue the irredentist claims or found SEATO."

 #Switzerland
 SWI_NATO_EU: "Euro-Atlantic Integration"
 SWI_NATO_EU_DESC: "Switzerland will abandon neutrality, join NATO and pursue European Union candidacy. Should NATO not exist, it will stand alone and dissolve the federation."
 SWI_NEUTRAL: "Armed Neutrality"
 SWI_NEUTRAL_DESC: "Switzerland will keep its neutral foreign policy, walk its own path and remain a friend to all."

 #Bulgaria
 RULE_OPTION_BUL_HISTORICAL: "The Road to Brussels"
 RULE_OPTION_BUL_HISTORICAL_DESC: "The §8Union of Democratic Forces§! holds the currency board and the reform programme together, and every government that follows it keeps the same two applications on the table. Bulgaria joins NATO and then the European Union, and gives the alliance its quietest border in the Balkans."
 RULE_OPTION_BUL_TSARIST_RESTORATION: "The Tsar Returns"
 RULE_OPTION_BUL_TSARIST_RESTORATION_DESC: "The exiled §8House of Saxe-Coburg and Gotha§! comes home to more than a premiership, gathers the nationalist right behind the crown and governs in its own name. Bulgaria trades the Western applications for the borders it was promised at San Stefano, and its neighbours find the Macedonian question reopened."
 RULE_OPTION_BUL_RED_BALKAN: "The Red Balkan Dream"
 RULE_OPTION_BUL_RED_BALKAN_DESC: "The §8Communist Party of Bulgaria§! rises out of the wreckage of the transition and takes the state the §8Bulgarian Socialist Party§! would not reclaim. Bulgaria looks to Moscow and Beijing for its friends, and sets about building a socialist federation out of the Balkans."

 #Algeria
 ALG_AI_BEHAVIOR: "@ALG Algeria"
 RULE_OPTION_ALG_HISTORICAL: "The Bouteflika Years"
 RULE_OPTION_ALG_HISTORICAL_DESC: "The presidency closes out the Black Decade on an amnesty and gathers the §8National Liberation Front§! and its allies behind it, until the §8Hirak§! marches force the old man out. Algeria stays a pillar of Arab and African diplomacy while the generals keep the last word at home."
 RULE_OPTION_ALG_LE_POUVOIR: "Le Pouvoir Endures"
 RULE_OPTION_ALG_LE_POUVOIR_DESC: "The presidency never breaks free of the generals, and §8le pouvoir§! answers the §8Hirak§! with arrests rather than reform. Algeria keeps a civilian facade while the security establishment decides everything behind it."
 RULE_OPTION_ALG_HIRAK_DEMOCRACY: "The Hirak Prevails"
 RULE_OPTION_ALG_HIRAK_DEMOCRACY_DESC: "The weekly marches do not stop at the presidency, and the §8Hirak§! breaks the oligarchs and dismantles le pouvoir. Algeria writes a genuinely civilian constitution and becomes the first real democracy in the Maghreb."
 RULE_OPTION_ALG_MILITARY_JUNTA: "The Generals Take Over"
 RULE_OPTION_ALG_MILITARY_JUNTA_DESC: "The §8Armée nationale populaire§! ends the pretence, suspends the constitution and governs Algeria outright. The country turns inward, and its neighbours find a garrison state on their border."
 RULE_OPTION_ALG_ISLAMIST: "Islamist Algeria"
 RULE_OPTION_ALG_ISLAMIST_DESC: "The §8Movement of Society for Peace§! and §8Ennahda§! win at the ballot box rather than in the maquis, and build an Islamic republic through parliament, the courts and the mosque. Algeria becomes the voice of political Islam across North Africa."
 RULE_OPTION_ALG_FIS_UPRISING: "The Salvation Front Returns"
 RULE_OPTION_ALG_FIS_UPRISING_DESC: "The §8Islamic Salvation Front§! is never contained, and it claims the election victory the army took from it. The Black Decade ends on the insurgents' terms, and Algeria becomes a base for armed Islamism across the Sahel."

 #Montenegro
 RULE_OPTION_MNT_HISTORICAL: "Historical"
 RULE_OPTION_MNT_HISTORICAL_DESC: "The §8Đukanović faction§! leads Montenegro into EU and NATO while consolidating oligarchic control over state institutions and the economy. Montenegro becomes a small, Western-aligned nation whose institutions remain intertwined with organised crime and political patronage networks."
 RULE_OPTION_MNT_EUROPEAN_REFORM: "Reformist Path"
 RULE_OPTION_MNT_EUROPEAN_REFORM_DESC: "Democratic and social-democratic parties overthrow the oligarchs and pursue EU accession coupled with aggressive anti-corruption reform and the dismantling of patronage networks. Montenegro emerges as a genuine liberal democracy where state institutions operate free from organised crime and oligarchic domination."
 RULE_OPTION_MNT_SERBIAN_UNION: "Serbian Nationalism"
 RULE_OPTION_MNT_SERBIAN_UNION_DESC: "§8Serb nationalist parties§! ascend to power, elevate Serbian culture and Orthodox Church authority, and align Montenegro economically and politically with Serbia and Russia. Montenegro's trajectory culminates in political union with Serbia, reversing the independence achieved a generation before."
 RULE_OPTION_MNT_MONARCHIST_RESTORATION: "Monarchist Restoration"
 RULE_OPTION_MNT_MONARCHIST_RESTORATION_DESC: "Montenegrin §8monarchists and traditionalists§! restore the House of Petrović-Njegoš dynasty and enshrine Orthodox Christianity as the state religion. Montenegro pursues a Russia-aligned, church-centred restoration outside the Western order rather than integration into European structures."
 RULE_OPTION_MNT_NEUTRAL_HARBOUR: "Armed Neutrality"
 RULE_OPTION_MNT_NEUTRAL_HARBOUR_DESC: "The Đukanović government rejects both EU/NATO integration and Serbian/Russian alignment, instead declaring permanent armed neutrality on the Swiss model. Montenegro's free harbour becomes a trading post open to all blocs, exploiting its strategic Adriatic position for maximum commercial advantage."
 RULE_OPTION_MNT_SOCIALIST_REVIVAL: "Socialist Revival"
 RULE_OPTION_MNT_SOCIALIST_REVIVAL_DESC: "A §8communist and neo-Yugoslav movement§! seizes power, nationalizes the economy along Titoist lines, and promotes the recovery of pan-Yugoslav political structures. Montenegro attempts to revive the Yugoslav federation from its own territory outward, seeking to reunite the southern Slavic peoples under socialist governance."

 #Serbia
 SER_AI_BEHAVIOR: "@SER Yugoslavia"
 RULE_OPTION_MILOCEVIC_COMMI: "Milosevic Is A Communist"
 RULE_OPTION_MILOCEVIC_COMMI_AI_DESC: "After Milosevic is able to stay in power, he will lead the country back to communism and try to revive Yugoslavia.."
 RULE_OPTION_MILOCEVIC_NATI: "Milosevic's Great Serbia"
 RULE_OPTION_MILOCEVIC_NATI_AI_DESC: "Milosevic will follow the path of the revival of Greater Serbia and will try to return all the lands where the Serbian population lives."
 RULE_OPTION_MILOCEVIC_FEDERATION: "Milosevic's Balkan Federation"
 RULE_OPTION_MILOCEVIC_FEDERATION_AI_DESC: "Milosevic will follow the path of a grandiose, unrealized project - the Balkan Federation.."
 RULE_OPTION_SERBIAN_KINGDOM: "Kingdom of Serbia"
 RULE_OPTION_SERBIAN_KINGDOM_AI_DESC: "After the overthrow of Milosevic, supporters of nationalism and Monarchy will take power and try to restore the former greatness of the Serbian people."
 RULE_OPTION_SERBIAN_LIBERALS: "Liberal Serbia"
 RULE_OPTION_SERBIAN_LIBERALS_AI_DESC: "Serbian politics will take the path of liberalism and democracy."

 #Ukraine
 UKR_AI_BEHAVIOR: "@UKR Ukraine"
 UKR_VINTRENKO: "Vitrenko"
 UKR_VINTRENKO_DESC: "Ukraine will follow the path of Orthodox National Bolshevik feminism"
 UKR_NATIONALISTS: "Ukrainian Nationalism"
 UKR_NATIONALISTS_DESC: "Ukraine will follow the path of Ukrainian nationalists, heirs of the UPA"
 UKR_DEMOCRATIC: "Democratic Ukraine"
 UKR_DEMOCRATIC_DESC: "Ukraine will follow a pro-Western path, will strive to become part of the European Community"
 UKR_COMMUNISM: "Communist Ukraine"
 UKR_COMMUNISM_DESC: "Ukraine will follow the communist path and possibly revive the USSR"
 UKR_SOCIALISM: "Socialist Ukraine"
 UKR_SOCIALISM_DESC: "Ukraine will follow the socialist path and try to create a socially equal state"
 UKR_YUSHENKO: "Yushchenko"
 UKR_YUSHENKO_DESC: "Ukraine will follow the path of Yushchenko's Presidency"
 UKR_YANUK: "Yanukovych"
 UKR_YANUK_DESC: "Ukraine will follow the path of Yanukovych's Presidency"

 #Spain
 SPR_CONSERVATIVE_LEANINGS: "Conservative Leanings"
 SPR_CONSERVATIVE_LEANINGS_DESC: "Spain will lean heavily towards the Partido Popular and other conservative parties."
 SPR_RENACIMIENTO_NACIONALISTA: "Renacimiento Nacionalista"
 SPR_RENACIMIENTO_NACIONALISTA_DESC: "Spain will lean heavily towards parties like Vox and España 2000."
 SPR_NACION_UNIDAD_IMPERIO: "Nacion Unidad Imperio"
 SPR_NACION_UNIDAD_IMPERIO_DESC: "Spain will lean heavily towards La Falange."
 SPR_SOCIALISM_RISING: "Socialism Rising"
 SPR_SOCIALISM_RISING_DESC: "The PSOE and social democract parties will be more likely to be elected and pushed into the ruling party."
 SPR_COMMUNIST_REVISIONISM: "Communist Revisionism"
 SPR_COMMUNIST_REVISIONISM_DESC: "Spain will try to push towards the communist parties."
 SPR_THE_OLD_WAYS: "The Old Ways"
 SPR_THE_OLD_WAYS_DESC: "Spain will seek to revive the Spanish Empire."

 #Iran
 RULE_OPTION_PER_HISTORICAL: "Historical"
 RULE_OPTION_PER_HISTORICAL_DESC: "The Islamic Republic endures under the Supreme Leader, with the presidency passing back and forth between the reformist and principalist camps. Iran anchors the Axis of Resistance, pushes its nuclear programme through every round of sanctions, and projects power through allied militias from Lebanon to Yemen."
 RULE_OPTION_PER_RESTORATION: "The Peacock Throne"
 RULE_OPTION_PER_RESTORATION_DESC: "The exiled §8Constitutionalist Party§! brings the §8Pahlavi§! dynasty home and crowns Reza Pahlavi II over a secular kingdom. The clerical order is swept away and Iran turns west, abandoning the network of proxies it spent a generation building."
 RULE_OPTION_PER_IRANIC_FEDERATION: "The Iranic Federation"
 RULE_OPTION_PER_IRANIC_FEDERATION_DESC: "The §8Pan-Iranist Party§! takes power and works to gather the Iranic peoples of Tajikistan, Kurdistan, Azerbaijan and Balochistan into a single federation. Iran becomes the heartland of a new Iranic sphere, and every neighbour holding Iranic land finds its borders in question."
 RULE_OPTION_PER_MOJAHEDIN: "The People's Mojahedin"
 RULE_OPTION_PER_MOJAHEDIN_DESC: "The §8Mojahedin-e Khalq§! return from exile under Maryam Rajavi and seize the state from the clergy. Iran is proclaimed a people's republic that owes nothing to the old revolution, and its foreign policy is rebuilt from nothing."
 RULE_OPTION_PER_FREEDOM_MOVEMENT: "The Freedom Movement"
 RULE_OPTION_PER_FREEDOM_MOVEMENT_DESC: "The §8Freedom Movement of Iran§! inherits the wreckage of clerical rule and builds a secular constitutional republic that leaves faith to the private conscience. The Revolutionary Guard is stripped out of politics and business, and Iran reopens to the West as an ordinary state."
 RULE_OPTION_PER_NATIONAL_FRONT: "The National Front"
 RULE_OPTION_PER_NATIONAL_FRONT_DESC: "The §8National Front§! returns as the heir of Mossadegh and rebuilds Iran on secular nationalism and the oil the revolution squandered. It holds to non-alignment, courting neither Washington nor Moscow while it puts the technocrats back to work."
 RULE_OPTION_PER_GREEN_MOVEMENT: "The Green Movement"
 RULE_OPTION_PER_GREEN_MOVEMENT_DESC: "The §8Green Movement§! carries Mir-Hossein Mousavi into power on the promise that the vote will finally be counted. Iran stays an Islamic republic but answers to its electorate, and the region loses the Supreme Leader as an address."
 RULE_OPTION_PER_MONTAZERI: "Montazeri's Republic"
 RULE_OPTION_PER_MONTAZERI_DESC: "The reformist clergy around §8Grand Ayatollah Montazeri§! take the seminaries back from the hardliners and answer at last for the prisons. The faith keeps its place in the state, tempered by the man who spent his life condemning what was done in its name."
 RULE_OPTION_PER_AHMADINEJAD: "Ahmadinejad's Return"
 RULE_OPTION_PER_AHMADINEJAD_DESC: "§8Mahmoud Ahmadinejad§! gathers the hardline populists, pays the poor out of the oil account and dares the world to stop him. The Basij and Ansar-e Hezbollah become the state's arm at home, and confrontation abroad becomes the point rather than the price."
 RULE_OPTION_PER_GHALIBAF: "Ghalibaf's Order"
 RULE_OPTION_PER_GHALIBAF_DESC: "§8Mohammad Bagher Ghalibaf§! rules as the commander who gets things built, trading political freedom for roads, order and results. The Revolutionary Guard keeps its business empire and the press keeps its leash, while Tehran courts Moscow for the capital to pay for it."
 RULE_OPTION_PER_MASHAEI: "Mashaei's Iranian School"
 RULE_OPTION_PER_MASHAEI_DESC: "§8Esfandiar Rahim Mashaei§! puts the nation before the faith and preaches an Iran that needs no clergy standing between it and God. The seminaries are broken as a political force, and Iranian nationalism rather than Shia Islam becomes what the state exports."
 RULE_OPTION_PER_WORKERS_REPUBLIC: "The Workers' Republic"
 RULE_OPTION_PER_WORKERS_REPUBLIC_DESC: "The §8Tudeh Party§! and the Iranian left come home from exile and proclaim a workers' republic. The clergy and the Revolutionary Guard are dismantled together, and Iran looks for friends among the world's remaining socialist states."
 RULE_OPTION_PER_ARTESH: "The Artesh Directorate"
 RULE_OPTION_PER_ARTESH_DESC: "The §8Artesh§! dissolves what is left of the civilian government and rules through a directorate of its own officers. Ideology gives way to raw state interest, and Iran deals with its neighbours as a soldier rather than a revolutionary."

 #Georgia
 GEO_AI_BEHAVIOR: "@GEO Georgia"
 GEO_NATIONALIST_behavior: "@GEO Nationalist's behavior"
 GEO_help_CHE_behavior: "@GEO Help for Chechens"
 GEO_2008_war_behavior: "@GEO Behavior in 2008 war"

 RULE_OPTION_GEO_HISTORICAL: "Historical"
 RULE_OPTION_GEO_HISTORICAL_DESC: "The Rose Revolution sweeps away the §8Union of Citizens of Georgia§! and Mikheil Saakashvili turns the country hard towards NATO and the West. Georgia loses its war with Russia over the breakaway republics and then hands power peaceably to §8Georgian Dream§!."
 RULE_OPTION_GEO_SHEVARDNADZE_WEST: "Shevardnadze Endures"
 RULE_OPTION_GEO_SHEVARDNADZE_WEST_DESC: "Eduard Shevardnadze crushes the opposition rather than yield to it, and the §8Union of Citizens of Georgia§! keeps the country on its Western course without a revolution. Georgia stays an authoritarian state that Brussels and Washington court anyway."
 RULE_OPTION_GEO_PRO_RUSSIAN: "Concession to Moscow"
 RULE_OPTION_GEO_PRO_RUSSIAN_DESC: "The §8Union of Citizens of Georgia§! settles with the Kremlin, leaving the Russian bases in place and the breakaway republics resolved on Moscow's terms. Georgia slides into the Commonwealth of Independent States and out of the Western camp."
 RULE_OPTION_GEO_NATIONALIST: "The Mkhedrioni Return"
 RULE_OPTION_GEO_NATIONALIST_DESC: "The §8Mkhedrioni§! paramilitaries are revived and take the state, and Georgia pursues a Greater Georgia beholden to neither bloc. Armenia, Azerbaijan and the breakaway republics all become targets rather than neighbours."
 RULE_OPTION_GEO_COMMUNIST: "The Soviet Republic Restored"
 RULE_OPTION_GEO_COMMUNIST_DESC: "The §8United Communist Party of Georgia§! returns by ballot or by revolution and proclaims the Soviet republic again. Georgia reaches out to Armenia and Azerbaijan to rebuild a Transcaucasian federation."
 RULE_OPTION_GEO_UNITED_NATIONAL_MOVEMENT: "The National Movement Holds"
 RULE_OPTION_GEO_UNITED_NATIONAL_MOVEMENT_DESC: "History runs its course to the war and the settlement that follows, but Saakashvili's §8United National Movement§! keeps the presidency instead of losing it. Georgia doubles down on NATO membership and answers Moscow with open hostility."
 RULE_OPTION_GEO_GEORGIAN_PATRIOTS: "Alliance of Patriots"
 RULE_OPTION_GEO_GEORGIAN_PATRIOTS_DESC: "The post-war settlement arrives as it did, and then the §8Alliance of Patriots§! wins on a nationalist and socially conservative platform. Georgia turns away from Brussels and drifts back towards the east."
 RULE_OPTION_GEO_UNITED_GEORGIA: "Between East and West"
 RULE_OPTION_GEO_UNITED_GEORGIA_DESC: "The post-war settlement arrives as it did, and then §8United Georgia§! takes office on a deliberately multi-vector foreign policy. Georgia balances the European Union, Russia and its neighbours instead of choosing between them."

 GEO_WILL_FOLLOW_OWN_WAY: "Own Path"
 GEO_WILL_FOLLOW_OWN_WAY_DESC: "Nationalist Georgia will follow its own path and will crush Armenia and Azerbaijan"
 GEO_WILL_BE_PRO_ARMENIA: "Pro-Armenian"
 GEO_WILL_BE_PRO_ARMENIA_DESC: "Nationalist Georgia will help Armenia to crush Azerbaijan"
 GEO_WILL_BE_PRO_AZERI: "Pro-Azerbaijanian"
 GEO_WILL_BE_PRO_AZERI_DESC: "Nationalist Georgia will help Azerbaijan to crush Armenia"

 GEO_WILL_HELP: "Help @CHE Chechens"
 GEO_WILL_HELP_DESC: "Georgia will help Chechens in war with Russia. They can help Georgia in the future."
 GEO_WONT_HELP: "Don't Help @CHE Chechens"
 GEO_WONT_HELP_DESC: "Georgia won't help Chechens in war with Russia. They will be hostile to Georgia."

 GEO_ATTACK_RUS: "Preparing for War"
 GEO_ATTACK_RUS_DESC: "Georgia will be prepared for the 2008 war and will try to win in the war."
 GEO_WEAKBOY: "Compromise with Russia"
 GEO_WEAKBOY_DESC: "Georgia will seek a compromise with Russia to avoid battle actions."

 #Belarus
 BLR_AI_BEHAVIOR: "@BLR Belarus"
 BLR_union_state_ai_behavior: "@BLR Union State Behavior"

 RULE_OPTION_BLR_HISTORICAL: "The Last Dictator of Europe"
 RULE_OPTION_BLR_HISTORICAL_DESC: "Alexander Lukashenko jails his rivals, ties the economy to the rouble and breaks the §8Jeans Revolution§! with riot troops. Belarus stays Moscow's closest ally and the most isolated government in Europe."
 RULE_OPTION_BLR_EUROPEAN_BELARUS: "European Belarus"
 RULE_OPTION_BLR_EUROPEAN_BELARUS_DESC: "Andrei Sannikov carries the presidency for the §8European Belarus§! campaign and turns the country away from the rouble and toward Brussels. Belarus applies to NATO and the European Union, and Russia loses the ground it counted on west of Smolensk."
 RULE_OPTION_BLR_TIKHANOVSKAYA: "The Tikhanovskaya Revolution"
 RULE_OPTION_BLR_TIKHANOVSKAYA_DESC: "Lukashenko rules unchallenged for a generation, until a stolen election puts Svetlana Tikhanovskaya at the head of a §8Coordination Council§! the riot police cannot break. Belarus turns west far later than its neighbours, with Russian divisions already on the border."
 RULE_OPTION_BLR_POPULAR_FRONT: "The National Revival"
 RULE_OPTION_BLR_POPULAR_FRONT_DESC: "Zianon Pazniak carries the §8Belarusian Popular Front§! into power on a programme of Belarusisation, purging Soviet officers and reviving the memory of the Grand Duchy. Belarus turns on Moscow and stakes a claim on every neighbour that once answered to Vilnius."
 RULE_OPTION_BLR_NATIONAL_BOLSHEVIKS: "The National Bolshevik Revolt"
 RULE_OPTION_BLR_NATIONAL_BOLSHEVIKS_DESC: "The §8National Bolsheviks§! take the streets and then the state, rebuilding the Soviet order behind a labour army and a party militia. Belarus arms itself against Poland, Ukraine and the Baltics with Moscow's blessing."
 RULE_OPTION_BLR_LITBEL: "The Litbel Revival"
 RULE_OPTION_BLR_LITBEL_DESC: "The §8Communist Party of Belarus§! returns to power and makes the old Lithuanian-Belorussian republic its founding project. Belarus pulls Lithuania and Latvia back into a socialist union by influence where it can and by force where it cannot."
 RULE_OPTION_BLR_OLIGARCHY: "The Oligarch's Bargain"
 RULE_OPTION_BLR_OLIGARCHY_DESC: "Siarhiej Hajdukievič and the §8Liberal Democratic Party§! trade Lukashenko's ideology for a franker kind of business, selling access to Moscow at the best price they can get. Belarus stays in Russia's orbit but treats the Union State as a contract rather than a creed."

 BLR_WONT_FOLLOW_UNION_STATE: "Don't follow Union State"
 BLR_WONT_FOLLOW_UNION_STATE_DESC: "Belarus won't form Union State and won't become a Russian puppet."
 BLR_WILL_FOLLOW_UNION_STATE: "Form Union State"
 BLR_WILL_FOLLOW_UNION_STATE_DESC: "Belarus will try to form Union State. At first they will become a Russian puppet, but later..."

 #Transnistria
 PMR_ai_behavior: "@PMR Transnistria"
 PMR_HISTORIC_DEFAULT: "Historical Path"
 PMR_HISTORIC_DEFAULT_DESC: "Transnistria will try to follow the historical path of rapprochement with Russia."
 PMR_LIBERAL: "Democratic Transnistria"
 PMR_LIBERAL_DESC: "Transnistria will follow a democratic Path, and will also strive for integration with Moldova."
 PMR_PATRIOTIC: "Republican Transnistria"
 PMR_PATRIOTIC_DESC: "Transnistria will follow the path of the Republican Party with unique political opportunities."
 PMR_COMMUNISM: "Return To Communism"
 PMR_COMMUNISM_DESC: "The Communist flag will be raised over Transnistria again and the path to the revival of the Moldavian SSR will be open.."
 PMR_UKRAINE: "Ukrainian Transnistria"
 PMR_UKRAINE_DESC: "Transnistria will seek to become part of Ukraine by severing its ties with Russia."
 PMR_LEBED: "Transnistria of General Lebed"
 PMR_LEBED_DESC: "General Lebed will take power in Transnistria into his own hands and complete the work of the 14th army."

 PMR_sub_behavior: "@PMR Transnistria Sub-Behavior"
 PMR_PASSIVE_DEFAULT: "Economic Priority"
 PMR_PASSIVE_DEFAULT_DESC: "Transnistria will focus its attention on the economic branch."
 PMR_SHERIFF: "Fighting The \"Sheriff\""
 PMR_SHERIFF_DESC: "Transnistria will focus on fighting the influence of the \"Sheriff\" Corporation."

 #Cuba
 CUB_AI_BEHAVIOR: "@CUB Cuba"
 RULE_OPTION_CUB_HISTORICAL: "Historical"
 RULE_OPTION_CUB_HISTORICAL_DESC: "Fidel hands the presidency to his brother and the §8Partido Comunista de Cuba§! keeps the island on one party, licensing small trades while courting Caracas and Moscow for oil. The embargo holds, the Special Period never quite ends, and Havana stays the awkward exception in Washington's hemisphere."
 RULE_OPTION_CUB_PRO_WESTERN_REFORM: "Fidel Opens the Island"
 RULE_OPTION_CUB_PRO_WESTERN_REFORM_DESC: "Castro dismantles the command economy himself, licensing banks, restoring the church and writing a constitution that admits rival parties under the §8pro-Western wing of the Partido Comunista§!. Havana settles the Guantanamo question with Washington, recognises Taipei and ends up drilling alongside NATO."
 RULE_OPTION_CUB_DIAZ_CANEL: "The Diaz-Canel Thaw"
 RULE_OPTION_CUB_DIAZ_CANEL_DESC: "Miguel Diaz-Canel takes the palace ahead of Raul, unbans the §8Unión Liberal Cubana§! and calls the first contested elections since the revolution. Censorship is dismantled and foreign capital returns, and Cuba becomes an ordinary Caribbean republic without a shot fired."
 RULE_OPTION_CUB_NEW_SOCIALISM: "The Second Revolution"
 RULE_OPTION_CUB_NEW_SOCIALISM_DESC: "Diaz-Canel abandons the opening halfway, rebuilds the one-party state around a younger cadre and trades openly with Pyongyang. Cuba joins the CSTO and hands Russia its bases back, putting a Russian garrison ninety miles from Florida."
 RULE_OPTION_CUB_NATIONALIST: "Cuba for the Cubans"
 RULE_OPTION_CUB_NATIONALIST_DESC: "The §8Cuban Falanga§! seizes the state, purges communists and democrats alike and rebuilds the army around a youth labour corps. Havana then claims the whole basin as its birthright, and Haiti, Jamaica and the isthmus are annexed one by one."
 RULE_OPTION_CUB_RESTORED_REPUBLIC: "The Republic Restored"
 RULE_OPTION_CUB_RESTORED_REPUBLIC_DESC: "The §8Partido Social-Revolucionario Democrático de Cuba§! wins power, frees the political prisoners and rewrites the constitution around a multi-party parliament. Cuba then invites its neighbours into a Caribbean federation instead of conquering them."

 #Bosnia
 BOS_AI_BEHAVIOR: "@BOS Bosnia and Herzegovina"
 RULE_OPTION_BOS_HISTORICAL: "The Dayton Order"
 RULE_OPTION_BOS_HISTORICAL_DESC: "The rotating presidency holds under international supervision, and the §8Party of Democratic Action§! shares the state with its Serb and Croat rivals instead of beating them. Bosnia rebuilds behind NATO and European peacekeepers and edges toward Brussels without ever settling what the country is."
 RULE_OPTION_BOS_SRPSKA_PARTNERSHIP: "Srpska Takes the Chair"
 RULE_OPTION_BOS_SRPSKA_PARTNERSHIP_DESC: "The §8Alliance of Independent Social Democrats§! wins the presidency and turns Sarajevo toward Belgrade and Moscow while leaving the federation intact. Bosnia leaves the Western orbit by agreement rather than by force, and Russia gains a second foothold in the Balkans."
 RULE_OPTION_BOS_SRPSKA_UNION: "Srpska First"
 RULE_OPTION_BOS_SRPSKA_UNION_DESC: "The §8Serb Democratic Party§! centralises the whole country under Banja Luka and negotiates a union with Serbia. Bosnia is folded into a greater Serbian state, and its neighbours wake up to a redrawn map."
 RULE_OPTION_BOS_ISLAMIST_REVIVAL: "The Bosniak Awakening"
 RULE_OPTION_BOS_ISLAMIST_REVIVAL_DESC: "Bosniak grievance hardens into a religious revival, and the §8National Awakening§! rearms the republic to finish the war on its own terms. Bosnia sends the peacekeepers home and turns on its entities and then on its neighbours."
 RULE_OPTION_BOS_WORKERS_STATE: "The Workers' Councils"
 RULE_OPTION_BOS_WORKERS_STATE_DESC: "Mass unemployment carries the §8Workers' Front§! past the ethnic parties, and Bosnia's industry passes to councils of the people who staff it. The state turns secular and self-managing, and it answers to neither Brussels nor Belgrade."

 #Poland
 POL_AI_BEHAVIOR_MD: "@POL Poland"
 RULE_OPTION_POL_HISTORICAL: "Historical"
 RULE_OPTION_POL_HISTORICAL_DESC: "Poland finishes its transition under the post-communist left, joins the European Union, and then hands the country to §8Law and Justice§!, which governs against Moscow and leans on Washington. Warsaw becomes the loudest eastern voice in NATO and a standing irritant to Berlin and Brussels."
 RULE_OPTION_POL_CIVIC_PLATFORM: "The Civic Platform Years"
 RULE_OPTION_POL_CIVIC_PLATFORM_DESC: "§8Civic Platform§! holds the government and stakes Poland's future on the euro, German investment and the funds that come with them. Warsaw becomes the most reliable partner Brussels has in the region, and keeps its line on Moscow while doing it."
 RULE_OPTION_POL_WALESA: "Wałęsa Returns"
 RULE_OPTION_POL_WALESA_DESC: "The §8Christian Democrats§! carry Lech Wałęsa back into the presidential palace on the memory of Solidarity. Poland stays firmly inside NATO and spends its credit rebuilding the army rather than chasing the European mainstream."
 RULE_OPTION_POL_KORWIN_COMMONWEALTH: "Korwin and the Commonwealth"
 RULE_OPTION_POL_KORWIN_COMMONWEALTH_DESC: "Janusz Korwin-Mikke and the §8Real Politics Union§! strip the state back to its foundations and court Lithuania, Belarus and Ukraine as equals. A revived Commonwealth grows between Germany and Russia without ever leaving the western alliance."
 RULE_OPTION_POL_KORWIN_EAST: "Korwin Turns East"
 RULE_OPTION_POL_KORWIN_EAST_DESC: "Janusz Korwin-Mikke and the §8Real Politics Union§! settle Poland's old accounts by dealing directly with Moscow and Minsk. Warsaw walks out of the western camp, presses its claim on Lviv and takes its seat in the CSTO."
 RULE_OPTION_POL_FALANGA: "The Rise of Falanga"
 RULE_OPTION_POL_FALANGA_DESC: "Street militias and a united nationalist front carry §8Falanga§! from the margins into government. Poland leaves the European Union and NATO for a confessional, militarised state that unsettles every neighbour it has."
 RULE_OPTION_POL_RED_DREAM: "The Red Dream"
 RULE_OPTION_POL_RED_DREAM_DESC: "A second revolution puts the §8Polish Socialist Party§! in charge and buries the privatisations of the transition. Poland breaks with the West, suspends its elections and rebuilds itself as a workers' republic."
 RULE_OPTION_POL_PEOPLES_ARMY: "The People's Army"
 RULE_OPTION_POL_PEOPLES_ARMY_DESC: "The hardliners of the §8Union of Polish Communists§! seize the revolution and rebuild the People's Army as the backbone of the state. Poland becomes a garrison of a new eastern bloc and looks west with open hostility."

 #Czech Republic
 CZE_AI_BEHAVIOR_MD: "@CZE Czech Republic"
 RULE_OPTION_CZE_HISTORICAL: "Historical"
 RULE_OPTION_CZE_HISTORICAL_DESC: "The §8Czech Social Democrats§! and the §8Civic Democratic Party§! trade the government between them while the country settles into NATO and the European Union and Škoda turns Mladá Boleslav into an export engine. Prague sends its soldiers to the Balkans and Afghanistan and becomes a comfortable, unremarkable member of the Western bloc."
 RULE_OPTION_CZE_COMMUNISM: "The Communists Return"
 RULE_OPTION_CZE_COMMUNISM_DESC: "The §8Communist Party of Bohemia and Moravia§! turns anger at privatisation into a governing majority and points the ministries at the men who sold the factories. The Czech Republic walks out of NATO, courts Moscow and Beijing, and reopens border questions its neighbours thought were settled."
 RULE_OPTION_CZE_MONARCHY_KING: "The Habsburg Crown"
 RULE_OPTION_CZE_MONARCHY_KING_DESC: "§8Koruna Česká§! grows from a curiosity into the largest party, takes the crown jewels out of storage and calls Karl von Habsburg home to be crowned. The Czech lands become a kingdom again and set about gathering Vienna and Budapest into a monarchist bloc across central Europe."
 RULE_OPTION_CZE_MONARCHY_PRESIDENT: "The Crowned Republic"
 RULE_OPTION_CZE_MONARCHY_PRESIDENT_DESC: "§8Koruna Česká§! wins the country round to the old order but keeps the ballot box, installing a monarchist head of state chosen by election rather than by blood. The Czech Republic keeps its parliament and its European partners while rebuilding itself around throne, church and region."

 #Germany
 RULE_OPTION_GER_HISTORICAL: "Historical"
 RULE_OPTION_GER_HISTORICAL_DESC: "The §8Social Democratic Party§! governs in coalition with the §8Greens§! and forces the Hartz labour reforms through against its own base, then hands the chancellery to the §8Christian Democratic Union§! for a long grand coalition. Germany stays anchored in NATO and steers the European Union from its centre."
 RULE_OPTION_GER_LIBERAL: "The Liberal Republic"
 RULE_OPTION_GER_LIBERAL_DESC: "The §8Free Democratic Party§! breaks out of its junior-partner role and takes the country on free markets, deregulation, privatised defence and a digital state. Germany binds itself tighter to NATO and opens its borders to whoever its points system rates highest."
 RULE_OPTION_GER_GREEN: "The Green Chancellery"
 RULE_OPTION_GER_GREEN_DESC: "The §8Greens§! take the chancellery in their own right and spend it on the nuclear phase-out, a European green deal and progressive taxation. Germany pushes the alliance eastward and puts distance between itself and both Moscow and Beijing."
 RULE_OPTION_GER_POPULIST: "The Alternative Rises"
 RULE_OPTION_GER_POPULIST_DESC: "§8The Alternative§! climbs out of the fringe and into government on immigration, Islam, euroscepticism and doubt about the climate. Germany warms to Moscow while it picks the European Union apart from the inside."
 RULE_OPTION_GER_SOCIALIST: "The Left Ascendant"
 RULE_OPTION_GER_SOCIALIST_DESC: "§8Die Linke§! takes power out of the wreckage of the Federal Republic, throws the Americans off their bases and disarms the country. Germany then presses France, Poland and Sweden into a workers' union, by force if they refuse it."
 RULE_OPTION_GER_NATIONALIST: "Rule of the National Democrats"
 RULE_OPTION_GER_NATIONALIST_DESC: "The constitutional order collapses into civil war and the §8National Democratic Party§! takes the ruins, building a one-party police state on blood, soil and expulsion. Germany turns openly irredentist and every border around it becomes a claim."
 RULE_OPTION_GER_MONARCHIST: "The Kaiser Returns"
 RULE_OPTION_GER_MONARCHIST_DESC: "The republic falls and the §8Kaiser§! is crowned again over a restored empire. Germany puts monarchs back on the Swiss, Austrian, Belgian, Ottoman and Italian thrones and gathers them into an imperial bloc."

 #Ethiopia
 ETH_AI_BEHAVIOR: "@ETH Ethiopia"
 RULE_OPTION_ETH_HISTORICAL: "Historical"
 RULE_OPTION_ETH_HISTORICAL_DESC: "Ethiopia strengthens its Federal Democratic Republic through advances in healthcare, education, and religious freedoms. The §8EPRDF§! coalition maintains political continuity while deepening engagement with the African Union."
 RULE_OPTION_ETH_MONARCHIST_RESTORATION: "Return of the Crown"
 RULE_OPTION_ETH_MONARCHIST_RESTORATION_DESC: "Ethiopia restores the §8Crown Council of Ethiopia§! and invites Zera Yacob Amha Selassie to the throne. Imperial power reasserts itself as parliament's role diminishes and a claim on Eritrea is revived."
 RULE_OPTION_ETH_DERG_RESTORATION: "Return of the Derg"
 RULE_OPTION_ETH_DERG_RESTORATION_DESC: "Ethiopia rehabilitates Mengistu Haile Mariam and restores communist rule under the §8People's Democratic Republic of Ethiopia§!. The nation aligns with China and pursues pan-African communist solidarity."

 #Egypt
 EGY_AI_BEHAVIOR: "@EGY Egypt"
 RULE_OPTION_EGY_HISTORICAL: "Historical"
 RULE_OPTION_EGY_HISTORICAL_DESC: "Egypt runs the §8National Democratic Party§! until the square empties it out, hands a single term to the §8Muslim Brotherhood§!, and then gives the presidency back to its generals. The peace with Israel holds, American aid keeps flowing, and Cairo speaks for the Arab order rather than against it."
 RULE_OPTION_EGY_BROTHERHOOD: "The Brotherhood Holds"
 RULE_OPTION_EGY_BROTHERHOOD_DESC: "Egypt keeps its elected §8Muslim Brotherhood§! government, buys off the officers instead of purging them, and writes an Islamist constitution the courts cannot overturn. Cairo swings towards Ankara, Doha and Hamas, and the Gulf monarchies treat it as a threat."
 RULE_OPTION_EGY_PAN_ARAB: "Nasser's Heirs"
 RULE_OPTION_EGY_PAN_ARAB_DESC: "Egypt returns the §8National Front§! to power, nationalises the commanding heights and revives the United Arab Republic. Cairo courts Damascus, Baghdad and Tripoli, and turns its back on Washington."
 RULE_OPTION_EGY_SALAFIST: "The Salafist Turn"
 RULE_OPTION_EGY_SALAFIST_DESC: "Egypt puts the §8Al-Nour Party§! in the presidential palace, suspends the elections and rules by religious law. Sharia governs the Copts as a protected minority, and the Sinai campaign becomes a holy war."
 RULE_OPTION_EGY_COPTIC: "The Coptic Ascendancy"
 RULE_OPTION_EGY_COPTIC_DESC: "Egypt is taken over by the §8Coptic Church§! and its lay allies, who claim the Pharaonic inheritance over the Arab one. Cairo protects Christians from Palestine to Assyria and finds itself isolated in its own region."

 #Hezbollah
 HEZ_AI_BEHAVIOR: "@HEZ Hezbollah"
 RULE_OPTION_HEZ_HISTORICAL: "Historical"
 RULE_OPTION_HEZ_HISTORICAL_DESC: "§8Hezbollah§! contests the elections as a party, keeps the §8Taabia§! guerrilla army it fought Israel with, and stands beside the §8Lebanese Armed Forces§! instead of replacing them. It fights alongside Damascus, the §8Iraqi Shia militias§! and the §8Houthis§! while remaining a state within the Lebanese state."
 RULE_OPTION_HEZ_LAND_OF_GOD: "The Land of God"
 RULE_OPTION_HEZ_LAND_OF_GOD_DESC: "§8Hezbollah§! secedes from Lebanon and builds a recognised Islamic state across the south and the Beqaa, courting allies and raising living standards in the villages it governs. It raises expeditionary forces and a foreign intelligence service, turning a Lebanese faction into a regional power in its own right."
 RULE_OPTION_HEZ_CONQUER_LEBANON: "Masters of Lebanon"
 RULE_OPTION_HEZ_CONQUER_LEBANON_DESC: "§8Hezbollah§! arms defectors from the §8Lebanese Armed Forces§! and takes Lebanon by open war rather than by the ballot. It pays for the campaign with Iranian money, factories and roads, and annexes the country into an Islamic Republic answerable to Tehran."
 RULE_OPTION_HEZ_GLOBAL_RESISTANCE: "Export the Revolution"
 RULE_OPTION_HEZ_GLOBAL_RESISTANCE_DESC: "§8Hezbollah§! holds its ground in Lebanon and pours its money into the networks abroad, from the §8Islamic Movement§! in West Africa to the diaspora and cartel routes running out of Venezuela. It builds cells and militias inside North America itself, carrying the war far past the Levant."

 #Indonesia
 IND_AI_BEHAVIOR: "@IND Indonesia"
 RULE_OPTION_IND_HISTORICAL: "Historical"
 RULE_OPTION_IND_HISTORICAL_DESC: "Indonesia consolidates the Reformasi republic behind the §8National Awakening Party§!, fighting religious extremism and mediating the Maluku conflict rather than choosing sides. Underpinned by anti-corruption institutions and Western alignment, Indonesia becomes a stable democratic anchor in Southeast Asia."
 RULE_OPTION_IND_PARTY_OF_STRUGGLE: "The Party of Struggle"
 RULE_OPTION_IND_PARTY_OF_STRUGGLE_DESC: "The §8Indonesian Democratic Party of Struggle§! takes power as the country's largest secular and nationalist force, protecting religious minorities in contested regions and advancing Pancasila against radicalisation. Indonesia pivots its diplomacy eastward toward China and Russia while building a left-nationalist bastion across the archipelago."
 RULE_OPTION_IND_DEMOCRAT_PARTY: "A Technocratic Presidency"
 RULE_OPTION_IND_DEMOCRAT_PARTY_DESC: "A reforming general assembles technocratic professionals in the §8Democratic Party§!, prioritising economic growth, institutional stability and investor confidence. Indonesia remains firmly Western-aligned as a model of professional, competent governance in Southeast Asia."
 RULE_OPTION_IND_UNITED_DEVELOPMENT: "The United Development Front"
 RULE_OPTION_IND_UNITED_DEVELOPMENT_DESC: "The §8United Development Party§!, rooted in the New Order's Islamic establishment networks, takes the state and governs through patronage, personal relationships and elite consensus rather than structural reform. Indonesia preserves its Western anchoring while Islamic identity deepens through informal power structures and transactional politics."
 RULE_OPTION_IND_PROSPEROUS_JUSTICE: "The Prosperous Justice Movement"
 RULE_OPTION_IND_PROSPEROUS_JUSTICE_DESC: "The §8Prosperous Justice Party§!, a disciplined Islamist movement built on anti-corruption and grassroots mobilisation, seizes power and shatters the patronage networks that have governed since Reformasi. Hostile to Western tutelage and socially conservative, Indonesia orients itself eastward as an independent actor outside both the liberal order and the old elite."
 RULE_OPTION_IND_ISLAMIST: "An Islamic Indonesia"
 RULE_OPTION_IND_ISLAMIST_DESC: "Religious radicalisation runs unchecked as the §8Islamic Defenders Front§! mobilises from street activism into state capture. Indonesia dissolves into a sharia republic that presses territorial and ideological claims against its neighbours and asserts dominance across its own archipelago."

 #Iraq
 IRQ_AI_BEHAVIOR: "@IRQ Iraq"
 RULE_OPTION_IRQ_HISTORICAL: "Historical"
 RULE_OPTION_IRQ_HISTORICAL_DESC: "Iraq runs under Saddam Hussein's §8Ba'ath Party§! until the American invasion topples the regime; an occupation government then rules from Baghdad while power passes to the Shia religious parties of the §8Islamic Dawa§!. Iraq ends as an American-sponsored republic that nonetheless drifts into Iran's diplomatic orbit."
 RULE_OPTION_IRQ_BAATHIST_STATE: "The Ba'ath Endures"
 RULE_OPTION_IRQ_BAATHIST_STATE_DESC: "The §8Ba'ath Party§! survives the American invasion, breaks the sanctions regime, settles the succession within the family and revives its claims on Kuwait, the Kurdish regions and Iranian Khuzestan. The Gulf lives beside an unbroken §8Ba'athist§! Iraq that presses its neighbours and asserts pan-Arab ambitions."
 RULE_OPTION_IRQ_SHIA_THEOCRACY: "Rule of the Jurists"
 RULE_OPTION_IRQ_SHIA_THEOCRACY_DESC: "The Shia clerical parties and the §8Badr Organisation§! take the post-occupation state and build a republic ruled by the jurists, aligned with Tehran. Baghdad becomes the western anchor of an Iranian axis running to Damascus and Beirut."
 RULE_OPTION_IRQ_SADRIST: "The Sadrist Tide"
 RULE_OPTION_IRQ_SADRIST_DESC: "§8Muqtada al-Sadr§!'s movement rises from the slums of Baghdad, drives the Americans out and rules as a Shia populist and Iraqi nationalist force that refuses Iranian tutelage as firmly as American. Iraq turns inward and hostile to every foreign patron."
 RULE_OPTION_IRQ_SECULAR_REPUBLIC: "The Secular Republic"
 RULE_OPTION_IRQ_SECULAR_REPUBLIC_DESC: "The secular opposition of the §8Iraqi National Congress§! and the §8Iraqi National Accord§! writes a constitution above sect and ethnicity and holds the state together as an Arab republic rather than a religious one. Iraq rejoins the Arab order as a Western-leaning secular state."
 RULE_OPTION_IRQ_COMMUNIST: "A Socialist Iraq"
 RULE_OPTION_IRQ_COMMUNIST_DESC: "The §8Iraqi Communist Party§! comes out of the underground where it has lived since the §8Ba'athist§! purges, wins the workers, women and Kurds, and takes the republic. Iraq becomes a socialist state in the middle of the oil monarchies."

 # Brazil
 RULE_OPTION_BRA_HISTORICAL: "The Lula Years"
 RULE_OPTION_BRA_HISTORICAL_DESC: "The §8Workers' Party§! finally wins the presidency and pairs cash transfers to the poor with orthodox finance, until a corruption inquiry hollows the left out and hands the palace to a former army captain. Brazil grows into a courted middle power that argues with Washington without ever leaving its orbit."
 RULE_OPTION_BRA_BROAD_FRONT: "A New Brazil"
 RULE_OPTION_BRA_BROAD_FRONT_DESC: "The §8Workers' Party§! governs through a broad coalition with the §8Brazilian Democratic Movement§! and the smaller left, and answers the corruption scandals with reform rather than retreat. Brazil stays a constitutional democracy and becomes the anchor of a South America that no longer looks north for permission."
 RULE_OPTION_BRA_SOCIALIST_REPUBLIC: "The Red Republic"
 RULE_OPTION_BRA_SOCIALIST_REPUBLIC_DESC: "The §8Workers' Party§! stops sharing power, absorbs its rivals on the left and rewrites the state around itself. Brazil proclaims a socialist republic and exports the model to every neighbour willing to take it."
 RULE_OPTION_BRA_LIBERALS: "The Liberal Order"
 RULE_OPTION_BRA_LIBERALS_DESC: "The §8Brazilian Social Democracy Party§! holds the presidency it already occupies and carries the privatisations and inflation targeting through to the end. Brazil becomes the most open economy on the continent and the steadiest American partner south of the equator."
 RULE_OPTION_BRA_SOCIAL_DEMOCRATS: "The Social Democrats"
 RULE_OPTION_BRA_SOCIAL_DEMOCRATS_DESC: "The §8Brazilian Social Democracy Party§! governs alongside the §8Democratic Labour Party§! and turns from market orthodoxy toward a developmental state with a welfare floor. Brazil spends on industry and schools instead of on interest, and keeps its distance from Washington and Beijing alike."
 RULE_OPTION_BRA_MILITARY_RULE: "The Captain's Republic"
 RULE_OPTION_BRA_MILITARY_RULE_DESC: "The §8Social Liberal Party§! takes the presidency, glorifies the old dictatorship and dissolves the congress standing in its way. Brazil is ruled by decree from the barracks once more, and presses its claims against the socialist governments on its borders."
 RULE_OPTION_BRA_MONARCHY: "The Empire Restored"
 RULE_OPTION_BRA_MONARCHY_DESC: "The §8monarchist§! revival turns a nationalist presidency into a coronation, and the House of Orléans-Braganza returns to a throne empty for over a century. Brazil abolishes its elections, reclaims the old Cisplatine province and answers to a crown again."

 # Estonia
 RULE_OPTION_EST_HISTORICAL: "Historical"
 RULE_OPTION_EST_HISTORICAL_DESC: "The §8Reform Party§! pursues radical deregulation and flat taxation while building a digital state around a national online identity. Estonia joins NATO and the European Union as a Western anchor in the Baltic and a standing counterweight to Russian influence."
 RULE_OPTION_EST_CONSERVATIVE: "Traditional Estonia"
 RULE_OPTION_EST_CONSERVATIVE_DESC: "§8Isamaa§! invests heavily in schooling and family welfare while granting business-friendly tax breaks and running targeted employment programmes. Estonia stays Western and pro-European but turns inward socially, tightening immigration policy and placing cultural preservation before cosmopolitanism."
 RULE_OPTION_EST_SOCIAL_DEMOCRATIC: "The Nordic Model"
 RULE_OPTION_EST_SOCIAL_DEMOCRATIC_DESC: "The §8Social Democratic Party§! builds a Nordic-style welfare state on minimum wages, empowered labour unions and state-led industrial investment. Estonia keeps its Western alignment but joins Europe as a social democracy that champions workers' rights and equality in the workplace."
 RULE_OPTION_EST_CENTRIST: "The Eastern Balance"
 RULE_OPTION_EST_CENTRIST_DESC: "The §8Centre Party§! abandons Estonia's Atlanticist tilt, reopens trade with Russia and courts the Russian-speaking minority while pressing for a union with Latvia and Lithuania. Estonia becomes a neutral bridge between East and West, and the Baltic loses its firmest NATO advocate."
 RULE_OPTION_EST_NATIONALIST: "Estonia First"
 RULE_OPTION_EST_NATIONALIST_DESC: "§8EKRE§! takes power, seizes the country's resources for the state and purges the pro-European parties and their sympathisers from public life. Estonia walks away from European integration, rearms hard and presses claims on Latvia, Lithuania, Finland and Sweden, turning the Baltic into a flashpoint."

 # Romania
 ROM_HISTORICAL: "Historical"
 ROM_HISTORICAL_DESC: "Romania will follow its historical path of peaceful coexistence and aspirations to join the European Union.."
 RULE_OPTION_ROM_FASCIST: "Radical Romania"
 RULE_OPTION_ROM_FASCIST_DESC: "Radical elements will come to power in Romania, which may lead to instability in the region.."
 RULE_OPTION_ROM_DEMOCRATIC: "The Path of Democracy"
 RULE_OPTION_ROM_DEMOCRATIC_DESC: "Romania will adhere to democratic values, and one of the democratic parties will gain power in the country.."
 RULE_OPTION_ROM_CENTER: "Centrism in Romania"
 RULE_OPTION_ROM_CENTER_DESC: "Romania will follow the path of centrism in its political direction."

 #India
 RAJ_AI_BEHAVIOR: "@RAJ India"
 RULE_OPTION_RAJ_HISTORICAL: "Historical"
 RULE_OPTION_RAJ_HISTORICAL_DESC: "India alternates power between the §8Bharatiya Janata Party§! and §8Indian National Congress§!, maintaining economic liberalisation and commitment to §8BRICS§! and a multipolar, non-aligned foreign policy. India keeps ties to both Washington and Moscow while establishing itself as a major voice in the developing world."
 RULE_OPTION_RAJ_GREATER_INDIA: "Greater India"
 RULE_OPTION_RAJ_GREATER_INDIA_DESC: "A Hindutva nationalist front takes power, imposing Hindu majoritarian rule at home while preserving caste hierarchy and stripping minorities of protection. India turns to autarky, isolation and territorial demands on Nepal, Bhutan and Bangladesh, establishing an authoritarian pan-Indian regime."
 RULE_OPTION_RAJ_RED_REPUBLIC: "The Red Republic"
 RULE_OPTION_RAJ_RED_REPUBLIC_DESC: "The §8Communist Party of India§! wins power, nationalising the economy and returning to five-year planning while aligning with China and withdrawing the Aksai Chin claim. India exports revolution across South Asia, becoming a radical socialist vanguard in the region."
 RULE_OPTION_RAJ_PEOPLES_FRONT: "The People's Front"
 RULE_OPTION_RAJ_PEOPLES_FRONT_DESC: "The §8Bahujan Samaj Party§! and §8Samajwadi Party§! form a Dalit and socialist coalition, dismantling caste privilege and redistributing wealth across society. India builds a Nordic-style welfare state while maintaining its non-aligned foreign policy."
 RULE_OPTION_RAJ_WESTERN_ALIGNMENT: "Ally of the West"
 RULE_OPTION_RAJ_WESTERN_ALIGNMENT_DESC: "India draws close to France and Israel, becoming a major non-NATO ally of the United States and deepening military and trade cooperation with Washington. India recognises Taiwan and ultimately joins NATO, cementing its place in the Western alliance."

 # FLAGS & FORMABLES
 RULE_DISABLE_FORMABLE_NATIONS: "Disable Formable Nations"
 RULE_YES_FORMABLE_NATIONS_DESC: "Disables the Formable Nations decisions."
 RULE_NO_FORMABLE_NATIONS_DESC: "Formable nations will be enabled."

 RULE_ALLOW_EDGY_FLAGS: "Allow Edgy Flags"
 RULE_ALLOW_EDGY_FLAGS_BLOCKED_DESC: "Keeps some of the more controversial flag options from appearing."
 RULE_ALLOW_EDGY_FLAGS_ALLOWED_DESC: "Allows more controversial flag options that would normally be censored."

 # ORGANISATION OPTIONS
 RULE_DISABLE_EU: "Disable The EU"
 RULE_YES_DISABLE_EU_DESC: "All countries will be removed from the European Union."
 RULE_NO_DISABLE_EU_DESC: "The European Union will exist as is."

 RULE_EUROPEAN_VOTING_COOLDOWN_LIMIT: "European Union Voting Cooldown"
 RULE_OPTION_EU_ONE: "1 Day"
