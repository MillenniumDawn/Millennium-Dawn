 Japan.104.f: "Croissance des restaurationnistes impériaux"
 JAP_electronics.320.t: "Combien coûte un équipement métallique"
 JAP_electronics.320.d: "Konami a sorti Metal Gear Solid 2 et Silent Hill 2 la même année, sur des budgets que seul un succès peut justifier, par des équipes bâties autour d'un seul réalisateur. Les lignes sport et cartes gagnent régulièrement et n'ont besoin d'aucun auteur. Financer les deux, c'est ce que l'entreprise ne peut plus se permettre."
 JAP_electronics.320.a: "Financer les équipes menées par des réalisateurs"
 JAP_electronics.320.b: "Financer les lignes sport et cartes annuelles"
 JAP_electronics.321.t: "Les bornes rapportent plus que les disques"
 JAP_electronics.321.d: "Konami peut prendre le contrôle de Hudson Soft et s'étendre dans le pachislot et les bornes d'arcade, où une machine sur un sol gagne plus en un an qu'un titre console en toute sa vie. Les usines et l'espace au sol sont de vrais actifs au Japon. Rester éditeur de logiciels tient l'entreprise hors d'un métier que la presse jeux n'estime pas."
 JAP_electronics.321.a: "Investir dans les machines de divertissement"
 JAP_electronics.321.b: "Rester éditeur de logiciels"
 JAP_electronics.322.t: "Collection de dragons"
 JAP_electronics.322.d: "Le jeu de cartes de Konami sur GREE gagne plus par développeur que n'importe quelle équipe console du bâtiment, et il a fallu des mois plutôt que des années. Déplacer les studios vers le social et le mobile, c'est suivre l'argent. Continuer à financer les équipes console, c'est payer les projets longs avec les courts."
 JAP_electronics.322.a: "Déplacer le développement vers le social et le mobile"
 JAP_electronics.322.b: "Continuer à financer les équipes console"
 JAP_electronics.323.t: "Feuilles de Kojima"
 JAP_electronics.323.d: "Konami a terminé Metal Gear Solid V, annulé Silent Hills, et peut dissoudre le studio qui a fait les deux et retirer le nom du réalisateur de la boîte. Le président a déjà dit en public que le mobile est l'avenir du métier. Garder le studio, c'est financer un producteur qui coûte plus que ce que la division gagne."
 JAP_electronics.323.a: "Dissoudre le studio et retirer le crédit"
 JAP_electronics.323.b: "Garder le studio et le crédit"
 JAP_electronics.324.t: "eFootball"
 JAP_electronics.324.d: "Konami a reconstruit Pro Evolution Soccer en service free-to-play et l'a sorti dans un état que ses propres joueurs ont noté plus bas que tout le reste de la plateforme. Le back-catalogue de Silent Hill, Metal Gear et Castlevania reste inutilisé, et le remake coûte de l'argent réel. Faire tourner les services et les clubs de fitness gagne sans aucun de ces risques."
 JAP_electronics.324.a: "Financer à nouveau le back-catalogue"
 JAP_electronics.324.b: "Faire tourner les services et les clubs"
 JAP_electronics.325.t: "Ce qu'est devenu Konami"
 JAP_electronics.325.d: "Vingt-cinq ans à choisir entre les réalisateurs, les bornes et le téléphone ont fixé ce qu'est Konami et ce qu'exporte le divertissement japonais."
 JAP_electronics.325.a: "Maisons de développement rétablies"
 JAP_electronics.325.b: "Un éditeur de remakes et de relances"
 JAP_electronics.325.c: "Un opérateur de loisirs et de fitness"
 JAP_electronics.325.e: "Une entreprise de licences mobiles"
 JAP_konami_restored_development_houses: "Maisons de développement rétablies"
 JAP_konami_restored_development_houses_desc: "Konami finance à nouveau des réalisateurs et sort les jeux que ces réalisateurs veulent faire. Cela coûte plus que le métier mobile n'a jamais coûté et c'est la raison pour laquelle quiconque hors du Japon connaît le nom."
 JAP_konami_remake_publisher: "Éditeur de remakes et de relances"
 JAP_konami_remake_publisher_desc: "Konami reconstruit ce qu'elle possède déjà pour ceux qui l'ont joué la première fois. Le catalogue est fini et le public ne l'est pas tout à fait, pas encore."
 JAP_konami_amusement_fitness_operator: "Opérateur de loisirs et de fitness"
 JAP_konami_amusement_fitness_operator_desc: "Bornes de pachislot, salles d'arcade et la plus grande chaîne de clubs de fitness du Japon, le tout bâti sur des biens et des machines que Konami possède en propre. Les jeux sont une branche de licences d'une activité physique."
 JAP_konami_mobile_licensing: "Entreprise de licences mobiles"
 JAP_konami_mobile_licensing_desc: "Konami loue Yu-Gi-Oh!, Metal Gear et Silent Hill à quiconque les développera et encaisse aux conditions. Rien n'est fait en interne et rien n'a besoin de l'être."
 JAP_electronics.330.t: "Des modems gratuits au coin de la rue"
 JAP_electronics.330.d: "SoftBank peut distribuer des modems Yahoo! BB aux coins de rue de Tokyo et vendre le haut débit à perte jusqu'à ce que l'emprise de NTT sur la boucle locale cède. Masayoshi Son s'attend à perdre de l'argent sur chaque abonné pendant des années. Revendre les lignes de NTT avec une marge est immédiatement rentable et laisse le monopole exactement où il est."
 JAP_electronics.330.a: "Donner les modems et prendre les pertes"
 JAP_electronics.330.b: "Revendre les lignes de l'opérateur historique"
 JAP_electronics.331.t: "Vodafone Japon"
 JAP_electronics.331.d: "Vodafone vendra son réseau japonais pour 1,75 billion de yens et SoftBank peut presque tout emprunter, dans ce qui serait le plus grand LBO que le Japon ait vu. Cela achète un réseau mobile national et les abonnés dessus. La dette est garantie sur une activité que SoftBank n'a jamais exploitée."
 JAP_electronics.331.a: "Emprunter sur le réseau et l'acheter"
 JAP_electronics.331.b: "Rester à l'écart du mobile"
 JAP_electronics.332.t: "Sprint"
 JAP_electronics.332.d: "SoftBank peut payer 21,6 milliards de dollars pour Sprint, le troisième opérateur américain, et hériter d'une reconstruction de réseau que personne n'a correctement chiffrée. Cela mettrait une entreprise japonaise dans le marché américain pour la première fois à cette échelle. Le même capital dépensé au pays se compose contre un réseau que SoftBank gère déjà."
 JAP_electronics.332.a: "Acheter l'opérateur américain"
 JAP_electronics.332.b: "Réinvestir au pays"
 JAP_electronics.333.t: "Cent milliards de dollars"
 JAP_electronics.333.d: "SoftBank peut lever cent milliards de dollars, surtout auprès du fonds d'investissement public saoudien, et signer des chèques qu'aucun fonds de capital-risque n'a jamais signés. Le Vision Fund ferait de Masayoshi Son le plus grand investisseur technologique vivant. Investir hors bilan est plus lent, plus petit, et n'a de comptes à rendre à personne à Riyad."
 JAP_electronics.333.a: "Lever le fonds sur l'argent du Golfe"
 JAP_electronics.333.b: "Investir hors bilan"
 JAP_electronics.334.t: "Nous travaillons"
 JAP_electronics.334.d: "L'introduction en bourse de WeWork s'est effondrée en chemin et SoftBank y détient la plus grande participation. Sauver l'entreprise, c'est prendre une dépréciation de plusieurs milliards et dire aux actionnaires que le jugement était faux. La laisser échouer protège tout le reste que SoftBank a soutenu et confirme chaque doute sur la façon dont ces paris ont été choisis."
 JAP_electronics.334.a: "La sauver et prendre la dépréciation"
 JAP_electronics.334.b: "La laisser échouer et protéger le reste"
 JAP_electronics.335.t: "Ce que SoftBank est devenu"
 JAP_electronics.335.d: "Un quart de siècle à emprunter sur des réseaux et à parier le produit sur les entreprises des autres a fixé ce qu'est SoftBank et comment le capital japonais atteint le reste du monde."
 JAP_electronics.335.a: "Une société holding technologique mondiale"
 JAP_electronics.335.b: "Un souscripteur de risque"
 JAP_electronics.335.c: "Un groupe de transporteurs nationaux"
 JAP_electronics.335.e: "Un revendeur haut débit"
 JAP_softbank_global_technology_holding: "Holding technologique mondial"
 JAP_softbank_global_technology_holding_desc: "SoftBank possède des opérateurs sur deux continents et des participations minoritaires dans plusieurs centaines d'entreprises qu'elle ne dirige pas. Ce qu'elle vaut dépend de ce que le marché pense que ces participations valent ce trimestre."
 JAP_softbank_venture_underwriter: "Souscripteur de risque"
 JAP_softbank_venture_underwriter_desc: "SoftBank signe le chèque que personne d'autre ne signera et prend le siège au conseil qui va avec. Les rendements arrivent de façon inégale et les pertes arrivent d'un seul coup."
 JAP_softbank_domestic_carrier_group: "Groupe de transporteurs nationaux"
 JAP_softbank_domestic_carrier_group_desc: "Fibre, spectre et centraux à travers le Japon, achetés à crédit et remboursés par les abonnements. SoftBank possède l'infrastructure plutôt qu'une position chez quelqu'un qui la possède."
 JAP_softbank_broadband_reseller: "Revendeur haut débit"
 JAP_softbank_broadband_reseller_desc: "SoftBank vend l'accès à des lignes qui appartiennent à l'opérateur historique et concurrence uniquement sur le prix. La marge est mince et l'activité n'a jamais eu besoin d'un sauvetage."
