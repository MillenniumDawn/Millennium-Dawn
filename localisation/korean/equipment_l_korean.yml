 ENG_APC_1_short: "사라센"
 ENG_APC_2: "FV432 APC"
 ENG_APC_2_desc: "Based on the M113 design, the FV432 is the British version that is most commonly built in the 1960s. It was the backbone of the British motorised and mechanised forces before the CVR(T) was commissioned into service. The versatility of the FV432 is still valuable to the British Army, and is used in support and auxiliary roles even till today."
 ENG_APC_3: "FV103 스파르탄"
 ENG_APC_3_short: "스파르탄"
 ENG_APC_4: "스파르탄 II"
