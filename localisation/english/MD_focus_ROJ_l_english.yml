l_english:
 ROJ_war_effort_category: "The Defense of Rojava"
 ROJ_war_effort_category_desc: "Our communes and the YPG and YPJ hold the north against every army that wants it. Whatever we cannot make ourselves, we must win from friends abroad or carry across the border."
 ROJ_request_coalition_support: "Ask [From.GetNameDef] for Support"
 ROJ_request_coalition_support_desc: "Our envoys will spend ten days pressing [From.GetNameDef] for weapons, money, or military advisors for the fight against the jihadists. They may refuse, and they will not hear a second appeal for three months."
 ROJ_mobilize_the_communes: "Mobilize the Communes"
 ROJ_mobilize_the_communes_desc: "Every commune sends its men to the YPG and its women to the YPJ. Within a week we can field a brigade of each."
 ROJ_rumeilan_oil_trade: "Sell Rumeilan Oil"
 ROJ_rumeilan_oil_trade_desc: "The Rumeilan fields still pump. Tanker trucks carry the crude across the Tigris to Iraqi Kurdistan, and the money comes back to pay our fighters."
 ROJ_form_the_syrian_democratic_forces: "Form the Syrian Democratic Forces"
 ROJ_form_the_syrian_democratic_forces_desc: "Arab tribes in the Raqqa and Deir ez-Zor countryside have joined the fight against the jihadists. Putting them under one command with the YPG and YPJ adds thousands of fighters, though not every Kurd trusts them."
