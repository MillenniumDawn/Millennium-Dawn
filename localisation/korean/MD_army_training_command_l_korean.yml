 MD_artc_fully_upgraded: "업그레이드 완료"
 MD_artc_exercise_operations: "제병협동 야전 훈련"
 MD_artc_exercise_operations_desc: "여단들이 훈련장에 전개하여 접촉 기동부터 전과 확대, 재보급에 이르기까지 육군의 작전 개념을 처음부터 끝까지 연습합니다."
 MD_artc_ex_operations_short: "90일간 작전 이론 숙련도."
 MD_artc_exercise_dedicated: "전투 훈련 센터 순환 훈련"
 MD_artc_exercise_dedicated_desc: "부대들이 전투 훈련 센터를 순환하며 계측 장비가 설치된 환경에서 전문 가상 적군과 싸웁니다. 모든 교전은 상세한 사후 강평 보고서로 검토됩니다."
 MD_artc_ex_dedicated_short: "90일간 전담 교리 숙련도."
 MD_artc_exercise_training: "실사격 훈련 주기"
 MD_artc_exercise_training_desc: "대대들이 개인 화기 자격 검증부터 중대급 제병협동 사격장에 이르기까지 단계별 실사격 프로그램을 거칩니다."
 MD_artc_ex_training_short: "90일간 훈련 숙련도."
 MD_artc_exercise_leadership: "지휘소 훈련"
 MD_artc_exercise_leadership_desc: "사단 및 군단 사령부가 지휘소를 전개하고 모의 전역을 치릅니다. 참모진은 명령 하달, 전황 추적, 압박 속에서의 지휘권 인계를 연습합니다."
 MD_artc_ex_leadership_short: "90일간 리더십 숙련도."
 MD_artc_exercise_technology: "실험 부대 시험"
 MD_artc_exercise_technology_desc: "지정된 실험 부대가 야전에서 새로운 센서, 네트워크, 무기를 시험합니다. 그 결과가 육군 전체의 신장비 도입 방식을 좌우합니다."
 MD_artc_ex_technology_short: "90일간 기술 숙련도."
 MD_artc_exercise_structure: "부대 전비 태세 훈련"
 MD_artc_exercise_structure_desc: "사단들이 완편 전력으로 동원되어 단시간 내에 전개함으로써, 신속 전개 시 육군의 부대 구조가 얼마나 버티는지 시험합니다."
 MD_artc_ex_structure_short: "90일간 구조 숙련도."
 MD_artc_staff_college_name: "지휘참모대학"
 MD_artc_staff_college_short: "모든 육군 지휘관이 경험치를 얻으며, 한 명은 새로운 특성을 얻을 수 있습니다."
 MD_artc_staff_college_cooldown: "지휘참모대학 교육 진행 중"
 MD_artc_staff_college_cooldown_desc: "영관급 장교들이 지휘참모대학에서 교육을 받고 있습니다. 이번 기수가 졸업하면 다음 기수가 시작됩니다."
 MD_artc_senior_course_name: "고위 지휘관 과정"
 MD_artc_senior_course_short: "원수 한 명(해당자가 없으면 장군 한 명)의 기술 레벨이 상승합니다."
 MD_artc_senior_course_cooldown: "고위 지휘관 과정 진행 중"
 MD_artc_senior_course_cooldown_desc: "장성급 장교들이 군단 및 군급 지휘를 위한 고급 지휘 교육을 이수하고 있습니다. 이번 기수가 수료하면 새 과정을 시작할 수 있습니다."
 MD_artc_rnd_liaison_name: "지상군 연구개발 연락단"
 MD_artc_rnd_liaison_short: "지상 돌파 포인트를 얻습니다."
 MD_artc_rnd_liaison_cooldown: "지상군 연구개발 연락단 활동 중"
 MD_artc_rnd_liaison_cooldown_desc: "육군 장교들이 국방 연구 기관에 파견되어 작전상의 교훈을 개발 요구 사항으로 전환하고 있습니다."
 MD_artc_academy_name: "전투 훈련 프로그램"
 MD_artc_academy_short: "육군사관학교 국가 정신을 해금하고 훈련 효과를 강화합니다."
 MD_artc_academy_level_text: "레벨 [?ROOT.MD_artc_academy_level|0]/3"
 MD_artc_army_name: "육군 지속 지원 프로그램"
 MD_artc_army_short: "육군 국가 정신을 해금합니다."
 MD_artc_army_level_text: "레벨 [?ROOT.MD_artc_army_level|0]/3"
 MD_artc_command_name: "임무형 지휘 훈련 프로그램"
 MD_artc_command_short: "사단 지휘 국가 정신을 해금합니다."
 MD_artc_command_level_text: "레벨 [?ROOT.MD_artc_command_level|0]/3"
 MD_artc_academy_1: "전투 훈련 센터 I"
 MD_artc_academy_1_desc: "전담 가상 적군을 갖춘 상설 전투 훈련 센터가 모든 여단에 전투준비 완료 판정을 받기 전 고된 순환 훈련을 제공합니다."
 MD_artc_academy_2: "전투 훈련 센터 II"
 MD_artc_academy_2_desc: "$MD_artc_academy_1_desc$"
 MD_artc_academy_3: "전투 훈련 센터 III"
 MD_artc_academy_3_desc: "$MD_artc_academy_1_desc$"
 MD_artc_army_1: "야전 지속 지원 기준 I"
 MD_artc_army_1_desc: "야전 정비, 부상자 치료, 연료 통제에 관한 공통 기준이 전투와 전투 사이에도 부대의 전력을 유지시킵니다."
 MD_artc_army_2: "야전 지속 지원 기준 II"
 MD_artc_army_2_desc: "$MD_artc_army_1_desc$"
 MD_artc_army_3: "야전 지속 지원 기준 III"
 MD_artc_army_3_desc: "$MD_artc_army_1_desc$"
 MD_artc_command_1: "임무형 지휘 훈련 I"
 MD_artc_command_1_desc: "지휘관과 참모진이 명확한 의도를 하달하고 부하들이 이를 토대로 행동하리라 신뢰하도록 훈련하며, 이는 부대 전체의 계획 수립을 가속합니다."
 MD_artc_command_2: "임무형 지휘 훈련 II"
 MD_artc_command_2_desc: "$MD_artc_command_1_desc$"
 MD_artc_command_3: "임무형 지휘 훈련 III"
 MD_artc_command_3_desc: "$MD_artc_command_1_desc$"
