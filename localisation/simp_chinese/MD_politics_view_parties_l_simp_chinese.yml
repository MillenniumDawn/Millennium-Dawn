 AIA.Caliphate_desc: "(萨拉菲圣战主义) - 伊斯兰联盟\n\n伊斯兰联盟是萨拉菲派激进运动，主张索马里的部族军阀和1991年崩溃的世俗国家应该让位于一个横跨整个索马里人居住的非洲之角的伊斯兰国家。该组织成立于1983年，由第一任埃米尔阿里·瓦尔萨姆领导下的伊斯兰青年党和伊斯兰大会党合并而成，其基地建立在清真寺和伊斯兰教法院而非宗族忠诚之上，哈桑·达希尔·阿维斯 担任其军事指挥官，哈桑·图尔基领导其南翼。\n\n实际上，该组织的势力在20世纪90年代初达到顶峰，当时它占领了博萨索，之后被驱逐，并统治了盖多地区的卢克，直到1996年埃塞俄比亚的突袭打破了其领土控制。该组织于1997年放弃了公开的武装斗争，并在2001年9月后的几周内被美国和联合国认定为恐怖组织，但其成员和网络在伊斯兰法院联盟及其后的其他叛乱运动中重新出现。"
