 Anti_tank_5: "ATGM 2035"
 Anti_tank_5_desc: "Anti-Tank Guided Missiles are man-portable missile systems employing high explosive warheads specifically designed to attack heavily armored vehicles."
 Heavy_Anti_tank_5: "Mounted ATGM 2035"
 Heavy_Anti_tank_5_desc: "Heavier Anti-Tank Guided Missile Systems have longer ranges and larger missile payloads. As such, the increased weight make them unsuitable for being carried around. They therefore are mounted on vehicles. They utilize high explosive warheads specifically designed to attack heavily armored vehicles."
