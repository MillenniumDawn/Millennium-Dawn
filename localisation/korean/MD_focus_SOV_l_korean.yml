 SOV_thirty_four_bars_start: "§YBARS-34§! 시베리아 예니세이 코사크군 코사크 대대"
 SOV_anti_west_idea: "Anti-Western Doctrine"
 SOV_oligarchs_democracy: "그들의 약속에 눈이 멀다"
 SOV_oligarchs_democracy_desc: "친과두 세력의 선거 승리는 많은 이들에게 충격을 주었습니다. 약속에 눈이 먼 국민은 한때 옐친 치하에서 나라를 약탈했던 바로 그 엘리트들을 선택했습니다."
 sov_oligarchs.4.b: "다른 후보를 내세워 새 선거를 치르겠다."
 sov_oligarchs.4.c: "현 대통령을 조종할 수 있다."
 sov_oligarchs.5.t: "조작된 선거!"
 sov_oligarchs.5.d: "우리의 통치를 정당화하기 위해 새 선거를 치르고 자유 러시아당의 승리를 보장해야 합니다. 유일한 딜레마는 대통령 후보를 선택하는 것입니다. 꼭두각시인가, 아니면 우리 편 사람인가?"
 sov_oligarchs.5.a: "네브조로프가 우리의 후보다!"
 sov_oligarchs.5.b: "보리스 베레좁스키가 대통령이 될 것이다."
 sov_oligarchs.5.c: "미하일 호도르콥스키가 대통령이 될 것이다."
 russia.104.t: "정치적 우위"
 russia.104.d: "우리 정부는 분열된 정당 체제라는 난관에 직면해 있으며, 이로 인해 국가 두마가 혼란에 빠져 있습니다. 어떤 단일 정치 세력도 결정적 과반을 차지하지 못하여 끊임없는 권력 다툼이 벌어지고 있습니다. 지방 차원에서는 분열이 지방 엘리트의 힘을 키워 연방의 통제력을 약화시키고 있습니다. 현재 친정부 통합당, 조국-전러시아 블록, 개혁파인 우리 집 러시아당의 세 주요 세력이 존재합니다. 친정부 분파를 확대하여 어느 정도의 민주주의를 보존하는 연합을 구성하거나, 이들을 하나의 \\"권력당\\"으로 통합하여 더 큰 중앙집권화와 더 강력한 통치를 보장할 수 있습니다."
 russia.104.o1: "\\"대통령 연합\\"을 결성해야 한다!"
 russia.104.o2: "이들을 통합하자."
 russia.105.t: "통합 러시아"
 russia.105.d: "오랜 협상 끝에 새로운 친정부 정당인 \"통합 러시아\"가 창당되었습니다. 이 정당은 거의 모든 지방 엘리트와 우리에게 충성하는 연방 관료들을 하나로 규합합니다. 이러한 통합 덕분에 우리는 국가두마(하원)와 지방 의회 모두에서 과반 의석을 확보하여, 핵심 법안을 통과시키고 지방 정치를 확고히 장악할 수 있게 되었습니다."
 russia.105.a: "새로운 러시아가 기다린다!"
 russia.106.t: "공정 러시아"
 russia.106.d: "여러 좌익 애국 운동이 통합하여 \\"정의로운 러시아\\"라는 새로운 정치 세력이 등장했습니다. 이 당의 강령은 사회 복지, 경제에 대한 국가 참여 확대, 국가 주권 보호를 강조합니다. 일부는 이 당이 반체제 유권자를 흡수하기 위해 만들어졌다고 의심하지만, 이 당은 러시아의 변화하는 정치 지형에서 영향력 있는 행위자가 될 상당한 잠재력을 지니고 있습니다."
 russia.106.a: "국민의 목소리!"
 russia.107.t: "새로운 사람들?"
 russia.107.d: "저명한 사업가 알렉세이 네차예프가 이끄는 새로운 사람들이라는 신당이 창당되었습니다. 이 당은 언론의 자유, 자유민주주의, 기업가의 권리, 경제와 행정의 디지털화를 주창하며 현대적인 비전을 제시합니다. 새로운 사람들이 러시아 정치 체제에 굳건히 뿌리내릴지, 아니면 사라질지는 지켜봐야 합니다."
 russia.107.a: "새로운 사람들과 낡은 체제"
 SOV_the_nonparty_TT: "신당이 등장합니다."
