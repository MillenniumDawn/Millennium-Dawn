 ALG_appoint_tartag_tt: "아트만 타르타그는 보안 기구 내부의 연속성을 상징합니다."
 ALG_appoint_mediene_tt: "모하메드 메디엔은 알제리 역사상 가장 강력한 딥 스테이트 인물 중 한 명을 복귀시키는 것입니다."
