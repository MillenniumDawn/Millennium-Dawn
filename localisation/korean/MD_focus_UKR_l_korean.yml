 ukraine_varyag.28.desc: "§W원래의 §!§YMiG-29§!§W 전투기 12대를 예비로 돌려야 하는 §!§R120일 기한을 놓쳤습니다§!§W. 전환 자금 £treasury §!§G3.00§!§W x10억은 반환되었으며 항공모함 항공단을 다시 검토할 수 있습니다.§!"
