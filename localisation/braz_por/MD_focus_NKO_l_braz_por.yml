 NKO_tank_production_trait3:0 "Melhorar nossa Indústria"
 NKO_tank_production_trait3A:0 "Melhorias Industriais"
 NKO_tank_production_trait3B:0 "Redução de Custos"
 NKO_tank_production_trait3C:0 "Melhoria de Capacidade"
 NKO_tank_production_trait3D:0 "Produto Confiável"
 korea_russia.53.t:0 "Tecnologia de Submarinos"
 korea_russia.53.d:0 "A Rússia nos forneceu tecnologia melhor para que possamos aprimorar nossos submarinos; tudo isso graças ao empenho do líder norte-coreano em desenvolver submarinos de propulsão nuclear."
 korea_russia.53.a:0 "Abençoado seja nosso Líder"
 korea.135.t:0 "Operação de Hackeamento bem-sucedida"
 korea.135.d:0 "Nossos hackers infiltraram a infraestrutura bancária de nações ocidentais e desviaram fundos significativos. Parte se perdeu nos canais secundários usados para trazê-los para casa, mas a operação foi um sucesso."
 korea.135.a:0 "Ótimo Trabalho"
 korea.136.t:0 "A Coreia do Norte nos Hackeou"
 korea.136.d:0 "Hackers norte-coreanos lançaram um ciberataque contra nossa infraestrutura bancária para desviar fundos. Devemos retaliar com operações próprias   ou apelar à comunidade internacional."
 korea.136.a:0 "Inesperado"
 korea.137.t:0 "Drogas Inundam Nossas Ruas"
 korea.137.d:0 "Uma nova onda de drogas inundou nossas ruas. A origem continua não confirmada, mas devemos agir com cuidado; a produtividade já está sofrendo."
 korea.137.a:0 "Apoiar os Dependentes"
 korea.137.b:0 "O que podemos fazer"
 korea.138.t:0 "Operação de Drogas bem-sucedida."
 korea.138.d:0 "Uma nova onda de drogas inundou as ruas de nossos inimigos. Eles terão de gastar para conter a crise, enquanto nós obtemos um lucro modesto. O investimento contínuo na agência manterá o dinheiro fluindo."
 korea.138.a:0 "Muito Bem!"
 korea.139.t:0 "Operação de Dólares Falsos"
 korea.139.d:0 "Imprimimos notas falsas de $100 e as distribuiremos por canais secundários em mercados estrangeiros, lavando os lucros por meio de nossa rede de mercado negro. A renda constante desse esquema financiará novas operações."
 korea.139.a:0 "Muito bem!"
 NKO_korean_russian_friendship:0 "Tratado Norte-Coreano–Russo de Parceria Estratégica Abrangente"
 NKO_korean_russian_friendship_desc:0 "O tratado de parceria de 2024 une Pyongyang e Moscou num pacto de segurança mútua, com cada parte comprometendo-se a socorrer a outra em sua defesa. A cooperação em comércio, energia e tecnologia se aprofunda junto com as garantias formais."
