 ukraine_develop_2s22.1.name: "Develop 2S22 'Bohdana' SPG"
 ukraine_develop_2s22.1.desc: "As we speak, technology advances further, and our weapons stays the same.\nWe need to develop our own new SPG for our forces"
 ukraine_develop_2s22.1.option.1: "Provide basic amount of funds"
 ukraine_develop_2s22.1.option.2: "Provide extensive amount of funds"
 ukraine_develop_2s22.2.name: "KrZVV has developed a project of a new SPG"
 ukraine_develop_2s22.2.desc: "We have checked and are sure now, that KrZVV did create a new SPG project for our military.\nHowever, due to insufficient funds we provided, they were not able to create new barrel and had to use old soviet one instead."
 ukraine_develop_2s22.2.option.1: "Ok, let's start the production!"
 ukraine_develop_2s22.3.name: "KrZVV has developed a project of a new SPG"
 ukraine_develop_2s22.3.desc: "We have checked and are sure now, that KrZVV did create a new SPG project for our military.\nMoreover, due to additional funds we provided, they developed devery aspect of the SPG from scratch, new and strong!."
 ukraine_develop_2s22.3.option.1: "Great, let's start the production!"
