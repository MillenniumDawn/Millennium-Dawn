l_french:
 industrial_complex: "Industrie civile"
 industrial_complex_plural: "Industries civiles"
 industrial_complex_desc: "Ce bâtiment fournit à l'État une industrie pour la production de biens civils ou la construction de nouveaux bâtiments. Peut être converti en industrie militaire si nécessaire.\n\nFournit à l'État :\nNombre de base de travailleurs requis : §Y206K§!\nPIB de base par §YIndustrie civile§! : $§Y17,5 milliards§!\nConsommation d'énergie de base : §R-0,5§! GW\n"
 arms_factory: "Industrie militaire"
 arms_factory_plural: "Industries militaires"
 arms_factory_desc: "Ce bâtiment fournit à l'État une industrie pour la production de nouveaux équipements militaires. Peut être converti en industrie civile si nécessaire.\n\nFournit à l'État :\nNombre de base de travailleurs requis : §Y18,8K§!\nPIB de base par §YIndustrie militaire§! : $§Y1,5 milliard§!\nConsommation d'énergie de base : §R-0,5§! GW"
 internet_station: "Infrastructure de réseau"
 internet_station_plural: "Infrastructures de réseau"
 internet_station_desc: "Les §Yinfrastructures de réseau§! sont de hautes structures utilisées dans les télécommunications et la radiocommunication pour transmettre sur de grandes distances, ou via des câbles de fibre optique souterrains et des systèmes de cloud computing.\n\nFournit à l'État :\nNombre de base de travailleurs requis : §Y12K§!\nPIB de base par §YInfrastructure de réseau§! : $§Y3,5 milliards§!\n\nChaque niveau d'§Yinfrastructure de réseau§! accroît la vitesse de croissance de la productivité locale de §G+5,00%§!.\nChaque niveau d'§Yinfrastructure de réseau§! réduit la durée des §YInvestissements internationaux§! de §G-5,00%§!."
 dockyard: "Chantier naval"
 dockyard_plural: "Chantiers navals"
 dockyard_desc: "Les §Ychantiers navals§! représentent la capacité d'un État à produire des navires militaires de toutes sortes : §Ypatrouilleurs§!, §Yconvois§!, §Ydestroyers§!, §Yporte-avions§! et bien d'autres.\n\nFournit à l'État :\nNombre de base de travailleurs requis : §Y18,8K§!\nPIB de base par §YChantier naval§! : $§Y1,5 milliard§!\nConsommation d'énergie de base : §R-0,5§! GW"
 air_base_desc: "Une §YBase aérienne§! est une installation de stockage et un complexe militaire pour le déploiement et la préparation de vos forces aériennes. Il peut être empilé jusqu'au niveau dix, ajoutant une capacité supplémentaire de §Y50§! Avions par niveau."
 radar_station_desc: "Les §Ystations radar§! vous permettent de rassembler des renseignements sur les troupes ennemies des régions voisines. Elles sont composées de multiples radars et capteurs, ainsi que d'outils de renseignement et de capacités d'analyse situationnelle.\nUn niveau plus élevé augmentera sa portée effective.\nCes radars apportent aussi à la région une meilleure détection des forces aériennes ennemies, apportant aux vôtres une meilleure chance de les engager.\nQui-plus-est, les radars augmentent la détection des flottes ennemis en mer."
 anti_air_building: "Sites SHORAD"
 anti_air_building_plural: "Sites SHORAD"
 anti_air_building_desc: "Les §Ysites SHORAD§! (Short Range Air Defense) sont des complexes et des groupes d'armes et de tactiques antiaériennes qui gèrent la défense aérienne contre les menaces aériennes à basse altitude. Ces sites travaillent ensemble pour diviser l'espace aérien en zones défendables, fournissant des cibles militaires locales et une couverture aérienne des infrastructures allant des hélicoptères aux avions volant à basse altitude en passant par les jets."
 nuclear_reactor_desc: "Ce bâtiment convertit l'énergie nucléaire en énergie électrique, en consommant de l'uranium modérément enrichi.\n\nFournit à l'État :\nNombre de base de travailleurs requis : §Y115K§!\nPIB de base par §Yréacteur nucléaire§! : $§Y4 milliards§!\nGain de puissance de base : §G+5§! GW\n"
 synthetic_refinery_desc: "Ce bâtiment fournit à l'État une industrie pour la production de caoutchouc synthétique et une capacité accrue de production de carburant.\n\nFournit à l'État :\nNombre de base de travailleurs requis : §Y184K§!\nPIB de base par §Yraffinerie synthétique§! : $§Y10 milliards§!\nConsommation d'énergie de base : §R-0,2§! GW\n\nProduit du §Ycaoutchouc§! au prix du marché, le surplus générant des revenus en plus de l'impôt sur les sociétés.\n"
 fuel_silo: "Réserve de ressources stratégiques"
 fuel_silo_plural: "Réserves de ressources stratégiques"
 fuel_silo_desc: "La §Yréserve de ressources stratégiques§! regroupe des entrepôts, des stockages à sec et d'autres installations servant à stocker le §Ycarburant§!. Ce bâtiment offre à votre nation davantage d'espace pour accumuler du §Hcarburant§! et des §Hressources§!.\n\nREMARQUE : le §Ystockage des ressources§! est limité par le moteur du jeu : si vous êtes en §Y$export_economy$§! ou §Y$globalized_trade_economy$§!, vous risquez d'exporter davantage de ressources que nécessaire pour vos lignes de production. Si vous devez commencer à puiser dans le stockage, il est recommandé de passer à §Y$mixed_economy$§! ou à une économie inférieure.\n"
 offices: "Industrie de services"
 offices_plural: "Industries de services"
 offices_desc: "Les §Yindustries de services§! représentent toutes les autres industries de l'économie au-delà de l'extraction et de l'industrie lourde : finance, services à la clientèle, technologies de l'information, commerce de détail, et bien plus encore.\n\nFournit à l'État :\nNombre de base de travailleurs requis : §Y473K§!\nPIB de base par §YIndustrie de services§! : $§Y50 milliards§!\nConsommation d'énergie de base : §R-0,25§! GW"
 rail_way_plural: "Chemins de fer"
 fossil_powerplant: "Centrale électrique à combustible fossile"
 fossil_powerplant_plural: "Centrales électriques à combustibles fossiles"
 fossil_powerplant_desc: "Les §Ycentrales à combustible fossile§! regroupent toutes les sources d'énergie thermoélectrique fossile : charbon, gaz naturel et pétrole. Les §Ycentrales à combustible fossile§! sont à l'arrêt si la production d'énergie dépasse la consommation.\n\nFournit à l'État :\nNombre de base de travailleurs requis : §Y7,5K§!\nPIB de base par §YCentrale à combustible fossile§! : $§Y1,7 milliard§!\nGain de puissance de base : §G+2§! GW\n"
 fossil_powerplant_amount: "$VALUE|Y0=$"
 fossil_powerplant_resource: "£resources_strip|$FRAME$£"
 agriculture_district: "District agricole commercialisé"
 agriculture_district_plural: "Districts agricoles commercialisés"
 agriculture_district_desc: "Les §Ydistricts agricoles commercialisés§! regroupent toute l'agriculture non vivrière de notre nation : agro-industrie, terres arables, silos à grains, abattoirs, etc.\n\nFournit à l'État :\nNombre de base de travailleurs requis : §Y188K§!\nPIB de base par §YDistrict agricole commercialisé§! : $§Y25 milliards§!\nConsommation d'énergie de base : §R-0,10§! GW\n§YGain de carburant§! des États : 8\n§YApprovisionnements locaux§! : 1,5%\n"
 agriculture_district_amount: "$VALUE|Y0=$"
 rocket_site: "Site de lancement de missiles"
 rocket_site_plural: "Site de lancement de missiles"
 rocket_site_desc: "Les §YSites de lancement de missiles§! sont un véritable fourre-tout d'équipement balistique allant des §YMissiles Sol-Air§! aux §YMissiles Balistiques Intercontinentaux§!. Cela fournit à l'état la capacité de déployer ces atouts stratégiques dans nos zones aériennes stratégiques pour aider à notre défense, ou fournir des capacités offensives."
 nuclear_facility: "Complexe R&D Civil"
 nuclear_facility_plural: "Complexes R&D Civil"
 nuclear_facility_desc: "Un complexe de R&D civil inclut tous les types de projets spéciaux liés à la capacité industrielle civile, aux installations nucléaires, et plus."
 air_facility: "Bâtiment d'aérodynamique et avionique"
 air_facility_desc: "Les complexes expérimentaux pour l'aéronautique et l'aérodynamique vous permettent de démarrer des projets de recherche sur des avions, des missiles, de l'électronique appliquée à l'aéronautique et l'espace."
 naval_facility_desc: "Les installations expérimentales d'ingénierie navale permettent de lancer des projets de recherche liés aux navires et aux sous-marins.\nCe bâtiment ne peut être construit que dans une province littorale."
 stronghold_network: "Réseau défensif à l’échelle d'un l’état"
 stronghold_network_plural: "Réseaux défensifs à l’échelle d'un l’état"
 stronghold_network_desc: "Un réseau étendu de tunnels, tranchées, abris, positions fortifiées, dépôts de munitions et zones prédestinées à la démolition donnent au défenseur un avantage décisif contre n'importe quel assaillant."
 renewable_energy_infra: "Infrastructure d'énergie renouvelable"
 renewable_energy_infra_plural: "Infrastructure d'énergie renouvelable"
 renewable_energy_infra_desc: "L'§Yinfrastructure d'énergie renouvelable§! regroupe toutes les sources d'énergie renouvelable : parcs solaires, éoliennes, raffineries de biocarburants, centrales à charbon de bois, centrales à biocarburants, etc. Elle utilise donc des sources renouvelables et produit du carburant à partir de celles-ci.\n\nFournit à l'État :\nNombre de base de travailleurs requis : §Y22,5K§!\nPIB de base par §YInfrastructure d'énergie renouvelable§! : $§Y2 milliards§!\nGain de puissance de base : §G+0,5§! GW\n"
 renewable_energy_infra_amount: "$VALUE|Y0=$"
 renewable_energy_infra_resource: "£resources_strip|$FRAME$"
 microchip_plant: "Usine de microprocesseurs"
 microchip_plant_plural: "Usine de microprocesseurs"
 microchip_plant_desc: "Usine de production qui convertit les métaux technologiques et les métaux précieux en puces électroniques, pour les besoins industriels comme militaires.\n\nFournit à l'État :\nNombre de base de travailleurs requis : §Y37,5K§!\nPIB de base par §Yusine de micropuces§! : $§Y32 milliards§!\nConsommation d'énergie de base : §R-0,75§! GW\n20 production de §Ypuces électroniques§!\n\nLes §Ypuces électroniques§! commandent le prix de marché unitaire le plus élevé, générant d'importants revenus en cash à l'exportation des surplus.\n\nCoûts :\n3 §Ymétaux technologiques§!\n2 §Ymétaux précieux§!"
 composite_plant: "Usine composite"
 composite_plant_desc: "Usine de production qui combine pétrole, caoutchouc et métaux précieux en composites, pour les usages scientifiques, militaires et industriels.\n\nFournit à l'État :\nNombre de base de travailleurs requis : §Y37,5K§!\nPIB de base par §Yusine de composites§! : $§Y28 milliards§!\nConsommation d'énergie de base : §R-0,8§! GW\n20 production de §Ycomposites avancés§!\n\nLes §Ycomposites§! se vendent parmi les prix de marché unitaires les plus élevés, générant de solides revenus en cash à l'exportation des surplus.\n\nCoûts :\n1 §Ypétrole§!\n1 §Ycaoutchouc§!\n1 §Ymétaux précieux§!"
 composite_plant_plural: "Usines de composites"
 rail_terminal: "Terminal ferroviaire"
 rail_terminal_plural: "Terminaux ferroviaires"
 rail_terminal_desc: "Un État desservi par un réseau dense de terminaux déplace plus vite personnes et marchandises, si bien que les usines voient des flux d'intrants plus stables, les travailleurs atteignent plus fiablement leur emploi, et l'économie environnante gagne de la marge pour s'étendre."
 show_construction_speed: "Lorsque cette option est cochée, vous voyez le bonus actuel de §Yvitesse de construction§! £construction_speed_texticon pour chaque §Ytype de bâtiment§!.\n\nCe modificateur n'affiche que le modificateur propre au bâtiment. Il ne tient pas compte de la §Yvitesse de construction mondiale§! £construction_speed_texticon."
 landmark_kaaba: "Kaaba"
 landmark_kaaba_plural: "$landmark_kaaba$"
 landmark_kaaba_desc: "La Kaaba est une structure sacrée en forme de cube située au cœur du site le plus sacré de l'islam, la grande mosquée de la Mecque. Drapée de soie noire et ornée de calligraphies dorées, elle est la direction vers laquelle se tournent les millions de musulmans du monde entier pour prier, symbolisant ainsi l'unité et la dévotion. Considérée comme la maison de Dieu, la Kaaba revêt une profonde signification spirituelle, incarnant des siècles de foi, de pèlerinage et d'histoire.\n\n§YLe monument de la Kaaba§! génère un revenu issu du tourisme dépendant de la population totale des états arabes. Le montant exact peut être observé dans l'§YAperçu Économique§!."
 landmark_milad: "Tour Milad"
 landmark_milad_plural: "$landmark_milad$"
 landmark_milad_desc: "La tour Milad, ou Borj-e Milad, trouve son origine dans la période prérévolutionnaire de l'Iran, les premiers projets remontant aux années 1970. Après la révolution iranienne de 1979, ces premiers projets ont été abandonnés en raison de l'évolution des priorités politiques. Cependant, le projet a été relancé à la fin des années 1990 et la construction a commencé en 2000, s'alignant sur la nouvelle orientation de l'Iran en matière de développement et de modernisation. La tour Milad est la concrétisation de ce rêve vieux de plusieurs décennies. Sa conception associe des éléments du patrimoine iranien à l'ingénierie contemporaine, ce qui en fait un emblème frappant de la continuité historique et de l'évolution de l'identité du pays. Aujourd'hui, la tour est un complexe multifonctionnel et un point de repère culturel important, offrant aux habitants de Téhéran et aux visiteurs des vues panoramiques sur la ville et les montagnes lointaines de l'Elbourz."
 landmark_domeofrock: "Dôme du Rocher"
 landmark_domeofrock_plural: "$landmark_domeofrock$"
 landmark_domeofrock_desc: "Le dôme du Rocher est un sanctuaire islamique renommé, célèbre pour son dôme doré qui surplombe la vieille ville. Construit au VIIème siècle, il se dresse sur le mont du Temple ou Haram al-Sharif, un site sacré pour les musulmans et les juifs. Il abrite le Rocher de la Fondation, que les musulmans considèrent comme l'endroit où le prophète Mahomet est monté au ciel et que les juifs considèrent comme l'emplacement du Saint des Saints de l'ancien temple juif."
 landmark_goldengate: "Pont du Golden Gate"
 landmark_goldengate_plural: "$landmark_goldengate$"
 landmark_goldengate_desc: "Le pont du Golden Gate se dresse majestueusement sur la toile de fond des collines brumeuses de San Francisco, ses tours emblématiques rouge-orange s'élevant dans le ciel. Enjambant l'entrée Pacifique de la baie, le pont relie gracieusement la ville aux vastes Marin Headlands, offrant une vue imprenable sur l'eau scintillante en contrebas. Sa beauté intemporelle et son ingénierie brillante en font un symbole de l'innovation et de la beauté naturelle de la Californie."
 landmark_UScongress: "Capitole des États-Unis"
 landmark_UScongress_plural: "$landmark_UScongress$"
 landmark_UScongress_desc: "Le Capitole des États-Unis se dresse à l'extrémité est du National Mall, à Washington, D.C., et abrite les chambres du Sénat et de la Chambre des représentants. Son architecture néoclassique et son dôme central en ont fait le siège du pouvoir législatif américain le plus reconnaissable, au cœur d'un axe qui comprend la Bibliothèque du Congrès, la Cour suprême et le complexe muséal de la Smithsonian Institution."
 landmark_fuji: "Mont Fuji"
 landmark_fuji_plural: "$landmark_fuji$"
 landmark_fuji_desc: "Le mont Fuji s'élève gracieusement de la terre, son sommet sacré touchant les cieux, symbole de l'harmonie entre la nature et le divin. Caché dans les nuages ou brillant sous le soleil, il incarne la sérénité et la force, gardien intemporel du paysage japonais. Contempler le mont Fuji, c'est sentir l'âme s'éveiller tranquillement, comme si l'on écoutait les chuchotements d'esprits anciens portés par le vent."
 landmark_giza: "Pyramides de Gizeh"
 landmark_giza_plural: "$landmark_giza$"
 landmark_giza_desc: "Les pyramides de Gizeh, situées à la périphérie du Caire, en Égypte, sont d'anciennes structures construites pour servir de tombeaux monumentaux aux pharaons de l'Ancien Empire. La plus célèbre, la pyramide de Khéops, a été construite pour le pharaon Khéops et constitue l'une des sept merveilles du monde antique, témoignant des prouesses techniques et architecturales des anciens Égyptiens. Ces pyramides, ainsi que le Sphinx, symbolisent l'héritage durable de l'Égypte et comptent parmi les sites les plus emblématiques et les plus visités au monde."
 landmark_shuttle: "Centre spatial Kennedy"
 landmark_shuttle_plural: "$landmark_shuttle$"
 landmark_shuttle_desc: "Le centre spatial Kennedy, situé sur la côte atlantique de la Floride, sert de site de lancement principal des vols habités de la NASA. Il dispose d'installations massives telles que l'emblématique Vehicle Assembly Building, où les fusées sont préparées pour le lancement, et le complexe de lancement 39, site historique des missions Apollo et de la navette spatiale. Le centre reste une plaque tournante de l'innovation et de l'exploration, jouant un rôle essentiel dans les missions spatiales actuelles, y compris l'exploration commerciale et l'exploration de l'espace lointain."
 landmark_shuttle_launch: "Centre spatial Kennedy"
 landmark_shuttle_launch_plural: "$landmark_shuttle_launch$"
 landmark_shuttle_launch_desc: "Le centre spatial Kennedy, situé sur la côte atlantique de la Floride, sert de site de lancement principal des vols habités de la NASA. Il dispose d'installations massives telles que l'emblématique Vehicle Assembly Building, où les fusées sont préparées pour le lancement, et le complexe de lancement 39, site historique des missions Apollo et de la navette spatiale. Le centre reste une plaque tournante de l'innovation et de l'exploration, jouant un rôle essentiel dans les missions spatiales actuelles, y compris l'exploration commerciale et l'exploration de l'espace lointain."
 landmark_buran: "Cosmodrome de Baïkonour"
 landmark_buran_plural: "$landmark_buran$"
 landmark_buran_desc: "Le cosmodrome de Baïkonour, situé dans les steppes reculées du Kazakhstan, est le premier et le plus grand port spatial du monde. Il a joué un rôle essentiel dans les missions spatiales soviétiques et russes. Créé en 1955, il a lancé des missions historiques, dont celle du premier homme dans l'espace, Youri Gagarine, à bord de Vostok 1. Le complexe tentaculaire du cosmodrome, avec ses rampes de lancement, ses installations de recherche et ses hangars d'assemblage, reste un symbole emblématique de l'histoire de l'exploration spatiale."
 landmark_ICBMsilominot: "Minot Air Force Base"
 landmark_ICBMsilominot_plural: "$landmark_ICBMsilominot$"
 landmark_ICBMsilominot_desc: "Le complexe de missiles de la Base Aérienne Minot consiste en un vaste réseau de silos souterrains abritant des missiles balistiques intercontinentaux, disséminés dans les plaines du Dakota du Nord. Les silos sont fortifiés et lourdement gardés, conçus pour résister aux menaces extérieures tout en maintenant un état de préparation constant. Ces installations éloignées et isolées jouent un rôle crucial dans la stratégie de dissuasion nucléaire des États-Unis, en garantissant une capacité de réaction rapide en cas d'urgence."
 landmark_ICBMsiloyasny: "Base de missiles de Yasny"
 landmark_ICBMsiloyasny_plural: "$landmark_ICBMsiloyasny$"
 landmark_ICBMsiloyasny_desc: "La base de missiles de Yasny, près de Dombarovsky dans la région russe d'Orenbourg, est l'un des principaux champs de silos des Forces stratégiques. Construite pendant la guerre froide, elle abrite de lourds missiles balistiques intercontinentaux dans des silos souterrains durcis et constitue un élément essentiel de la dissuasion nucléaire russe."
 landmark_zenobia_wall: "Ligne de défense Zénobie"
 landmark_zenobia_wall_plural: "$landmark_zenobia_wall$"
 landmark_zenobia_wall_desc: "Une ligne lourdement fortifiée s'étendant à travers le sud de l'Égypte et le désert occidental. Murs de béton, complexes de bunkers et artillerie pré-réglée ancrent la ligne Zénobie, élevée pour arrêter l'avance des Chimères depuis les zones de percée subsahariennes."
 landmark_hagia_sophia_plural: "$landmark_hagia_sophia$"
 landmark_hagia_sophia_desc: "Édifiée à l'origine comme cathédrale byzantine en 537, Sainte-Sophie devint la principale mosquée ottomane d'Istanbul après la conquête de la ville en 1453. Elle servit de musée laïc pendant une grande partie de l'histoire de la République turque. Son immense dôme central et ses mosaïques byzantines restent parmi les œuvres d'architecture religieuse les plus influentes jamais bâties, attirant des millions de visiteurs à Istanbul chaque année."
 landmark_forbidden_city_desc: "Le complexe palatial fortifié au cœur de Pékin servit de résidence impériale aux dynasties Ming et Qing pendant près de cinq siècles. Il abrite aujourd'hui le musée du Palais, l'une des collections d'art et d'artefacts chinois les plus importantes au monde. La Cité interdite est le site culturel le plus visité du pays et un site du patrimoine mondial de l'UNESCO, premier symbole de la civilisation chinoise."
 landmark_tokyo_imperial_palace_desc: "Résidence principale de l'empereur du Japon depuis la restauration de Meiji, sur le site de l'ancien château d'Edo au cœur de Tokyo. Le palais et ses jardins incarnent la continuité de la plus ancienne monarchie héréditaire du monde. L'accès public est restreint, mais les jardins de l'Est et les grandes cérémonies impériales attirent chaque année un tourisme important."
 landmark_taj_mahal_plural: "$landmark_taj_mahal$"
 landmark_taj_mahal_desc: "Commandé en 1632 par l'empereur moghol Shah Jahan comme mausolée pour son épouse Mumtaz Mahal, le Taj Mahal est le plus bel exemple conservé de l'architecture moghole. Sa façade de marbre blanc, ses incrustations raffinées et ses jardins symétriques en ont fait un site du patrimoine mondial de l'UNESCO et l'un des monuments les plus visités de la Terre, attirant des millions de visiteurs à Agra chaque année."
 landmark_prague_castle: "Château de Prague"
 landmark_prague_castle_desc: "Le plus vaste complexe de château ancien du monde par superficie, le château de Prague a servi de siège aux rois de Bohême, aux empereurs du Saint-Empire, et aujourd'hui au président de la République tchèque. Entre ses murs se dressent la cathédrale Saint-Guy et des siècles d'art d'Europe centrale, faisant du château le site culturel le plus visité du pays."
 landmark_bojnice_castle: "Château de Bojnice"
 landmark_bojnice_castle_desc: "Restauration néo-gothique romantique d'une forteresse slovaque médiévale, le château de Bojnice fut reconstruit à la fin du XIXe siècle sous le comte János Pálffy dans le style des châteaux de la Loire. C'est aujourd'hui l'un des sites culturels les plus visités de Slovaquie, sa silhouette à tourelles et le parc environnant servant de pièce maîtresse du tourisme patrimonial slovaque."
 landmark_sadabad_complex: "Complexe de Sadabad"
 landmark_sadabad_complex_plural: "$landmark_sadabad_complex$"
 landmark_sadabad_complex_desc: "Un vaste complexe palatial dans les contreforts au nord de Téhéran, bâti à l'origine sous les Qadjars et considérablement agrandi par les shahs Pahlavi. Après la révolution de 1979, le complexe fut nationalisé et fonctionne aujourd'hui comme un réseau de musées d'État abritant collections royales, art iranien et histoire naturelle."
 landmark_hofburg_palace_desc: "La Hofburg, au cœur de Vienne, servit pendant des siècles de palais impérial principal de la dynastie des Habsbourg. Ses salles abritent aujourd'hui les bureaux du président fédéral autrichien, l'École d'équitation espagnole, le Trésor impérial et plusieurs grands musées. Elle demeure l'un des monuments emblématiques de Vienne et une pièce maîtresse du tourisme culturel autrichien."
 landmark_berlin_reichstag_desc: "Le bâtiment du Reichstag sur la Platz der Republik se tient au centre politique de Berlin depuis plus d'un siècle. Lourdement endommagé en 1933 puis pendant la Seconde Guerre mondiale, il fut restauré après la réunification selon le redessin de Norman Foster et rouvert en 1999 comme siège du Bundestag, le parlement fédéral allemand. Son dôme de verre est devenu un symbole de la démocratie allemande moderne et une attraction majeure du centre de Berlin."
 enrichment_facility: "Installation d'enrichissement nucléaire"
 enrichment_facility_plural: "Installations d'enrichissement nucléaire"
 enrichment_facility_desc: "Les installations d'enrichissement reçoivent de l'uranium et l'enrichissent pour les réacteurs nucléaires et, dans une certaine mesure, l'armement nucléaire."