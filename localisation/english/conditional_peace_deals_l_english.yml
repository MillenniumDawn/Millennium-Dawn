 CPD_FULL_PUPPET_BTN: "Full Puppet"

 # Resource Rights Button
 CPD_resource_rights_button_TT: "Resource Rights"
 CPD_resource_rights_button_TT_DELAYED: "Demand or concede §YResource Extraction Rights§! on a state for 5 years. The state's resource output is reduced while the other party benefits."

 # Military Basing Button
 CPD_military_basing_button_TT: "Military Basing"
 CPD_military_basing_button_TT_DELAYED: "Demand or concede §YMilitary Basing Rights§! allowing the other party to station troops in the state's territory."

 # Full Country Puppet Button
 CPD_full_puppet_button_TT: "Full Puppet"
 CPD_full_puppet_button_TT_DELAYED: "Demand the §YFull Puppeting§! of the target nation. The entire country becomes a subject state."

 # Ceasefire Button
 CPD_ceasefire_button_TT: "Ceasefire"
 CPD_ceasefire_button_TT_DELAYED: "Propose a §YCeasefire§! that ends the war with no territorial changes and a long truce. Useful for ending stalemates."

 # War Reparations Button
 CPD_war_reparations_button_TT: "War Reparations"
 CPD_war_reparations_button_TT_DELAYED: "Demand §YWar Reparations§! from the target. The losing side pays economic compensation over 5 years, draining their treasury."

 # Forced Neutrality Button
 CPD_forced_neutrality_button_TT: "Forced Neutrality"
 CPD_forced_neutrality_button_TT_DELAYED: "Demand §YForced Neutrality§! on the target. They must leave their faction and cannot join any faction for 5 years."

 # Regime Change Button
 CPD_regime_change_button_TT: "Regime Change"
 CPD_regime_change_button_TT_DELAYED: "Demand a §YRegime Change§! in the target nation. Their ruling party is changed to match our ideology, causing political instability."

 # Ideas
 CPD_war_reparations_payer: "War Reparations (Paying)"
 CPD_war_reparations_payer_desc: "Our nation is paying war reparations as a result of the peace deal."
 CPD_war_reparations_receiver: "War Reparations (Receiving)"
 CPD_war_reparations_receiver_desc: "Our nation is receiving war reparations as a result of the peace deal."
 CPD_forced_neutrality_spirit: "Enforced Neutrality"
 CPD_forced_neutrality_spirit_desc: "As a condition of the peace deal, our nation is prohibited from joining or creating military alliances."
 CPD_regime_change_instability: "Post-War Political Instability"
 CPD_regime_change_instability_desc: "A forced regime change has destabilized our political system."

 CPD_peace_deal_explainer_ICON_TT: "How the Peace Deals Work"
 CPD_peace_deal_explainer_ICON_TT_DELAYED: "Constructing a peace deal is as simple as selecting a tab above and then choosing what to concede or demand within a state.\n\nBuilding a peace deal that has a §Ynegative§! cost will likely be accepted by an AI, whereas building a peace deal that has a §Ypositive§! cost is less likely to be accepted. You can see the full breakdown of the AI's willingness to accept a deal by hovering over the acceptance box.\n\nAny peace deal built for a player is not affected by these values."

 # Annex State Localization
 CPD_annex_state_button_TT: "[CPD_ANNEX_STATE_TT_LOC]"
 CPD_annex_state_button_TT_DELAYED: "[CPD_ANNEX_STATE_TT_DELAYED_LOC]"

