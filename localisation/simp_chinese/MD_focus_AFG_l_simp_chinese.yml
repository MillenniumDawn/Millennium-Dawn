 AFG_pomegranate_investment1_collect: "收割石榴"
 AFG_pomegranate_investment1_collect_desc: "农民们已经准备好让我们采摘石榴了"
 AFG_almond_investment1_collect: "收割扁桃"
 AFG_almond_investment1_collect_desc: "农民们已经准备好让我们采摘扁桃了"
 AFG_almond_investment1: "投资扁桃生产"
 AFG_almond_investment1_desc: "扁桃仁一直是许多阿富汗人的主要收入来源。政府可以通过为农民提供基础设施、交通运输和市场准入来投资扁桃仁产业。这项投资计划仅限于五项主要举措，之后市场将趋于饱和。投资额：占GDP的5%，回报：占GDP的6%（利润率20%）。"
 AFG_pomegranate_investment1: "投资石榴生产"
 AFG_pomegranate_investment1_desc: "阿富汗的石榴以其优良品质享誉全球。政府可以投资生产设施和贸易网络，充分利用这一自然资源。该投资计划仅限于五项主要举措，之后市场将趋于饱和。投资额：占GDP的5%，回报：占GDP的6%（利润率20%）。"
 AFG_invite_nahzat_e_melli_ye_into_government: "邀请阿富汗民兵党加入政府"
 AFG_domestic_decisions: "国内目标"
 AFG_domestic_decisions_desc: "随着国家逐渐复苏，我们制定了重建国家、开创新未来的目标。"
 AFG_taloqan_siege_mission: "守住城市"
 AFG_taloqan_siege_mission_desc: "随着我们的领土不断缩小，保卫城市至关重要，而西北广阔的平原为未来的进攻提供了诱人的目标。"
 AFG_headquarters_taloqan: "塔卢坎总部"
 AFG_headquarters_taloqan_desc: "塔卢坎在苏联入侵期间成为艾哈迈德·沙阿·马苏德的关键据点。随后，它成为 [AFG.GetFlag] [AFG.GetNameDefCap] 的中央指挥中心，在1997年马扎里沙里夫落入塔利班军队之手后，成为进入塔吉克斯坦的关键点。"
 taliban_insurgency_category: "塔利班叛乱"
 taliban_insurgency_category_desc: "尽管£GFX_AFG_salafist_jihadism §Y塔利班§!部队被联军击败，但并没有被彻底消灭，塔利班武装分子四分五裂，在阿富汗的各个角落发动了§R叛乱§!，并开始实施各种针对新政府和联军的§R恐怖袭击§!。根除塔利班叛乱预计需要数年时间，具体取决于许多因素。\n\n§Y塔利班实力§!决定了塔利班武装分子在国内的实力，以及它的增长以及我们根除叛乱的有效性将取决于§Y对中央政府的信任（稳定、腐败或外国干涉）§!以及§Y阿富汗 - 巴基斯坦边境的局势§!。如果 §Y塔利班实力§!过于强大，£GFX_AFG_salafist_jihadism §Y塔利班§!将能够发动§R恐怖袭击§!，甚至可以将其升级为§R重新爆发内战§!，而一些方法可能在短期内有效应对塔利班的威胁。\n\n§Y塔利班实力§!:[?AFG.taliban_strength]%"
 AFG_pashtunistan_decisions: "统一普什图斯坦"
 AFG_pashtunistan_decisions_desc: "近16%的巴基斯坦人口属于普什图尼族，这是阿富汗最主要的民族。大多数巴基斯坦普什图尼人居住在该国西北部地区。由于巴基斯坦内战，这些人中的许多人现在在可怕的政权下受苦受难。保护他们是我们的责任。"
 AFG_russian_airlift_is_active: "俄罗斯空运进行中"
 AFG_donkey_logistics_tech: "驮畜物流"
 AFG_donkey_logistics_tech_desc: "骡队和驴队可以穿越卡车无法到达的山口运送物资。"
 AFG_donkey_logistics_tech2: "驮畜物流 II"
 AFG_donkey_logistics_tech2_desc: "北部路线沿线有规模更大的商队和已建立的集结地。"
 AFG_donkey_logistics_tech3: "驮畜物流 III"
 AFG_donkey_logistics_tech3_desc: "一支围绕着永不停歇的驮运队而建立的常备运输队。"
 AFG_legacy_of_the_mujahideen: "圣战者的遗产"
 AFG_legacy_of_the_mujahideen_desc: "苏联战争老兵将他们的野战技能传授给民兵。"
 AFG_tech_the_farmer_and_their_rifle: "农夫和他们的步枪"
 AFG_tech_the_farmer_and_their_rifle_desc: "为保卫家园而战的农村民兵，熟知通往家园的每一条道路。"
 AFG_tech_training_of_local_police_officers: "地方警察培训"
 AFG_tech_training_of_local_police_officers_desc: "民兵接受过巡逻和作战训练，并能在占领阵地后坚守阵地。"
 AFG_tech_return_of_dostum: "杜斯塔姆归来"
 AFG_tech_return_of_dostum_desc: "杜斯塔姆回到了北方，乌兹别克民兵也因此而奋起反抗。"
 AFG_the_lion_of_panjshir: "潘杰希尔之狮"
 AFG_the_lion_of_panjshir_desc: "马苏德的理论是占据高地并从高处发起进攻。"
