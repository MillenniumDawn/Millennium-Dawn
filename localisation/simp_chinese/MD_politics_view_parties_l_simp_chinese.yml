 GER.Nat_Populism_afd: "£GER_nationalist_right_wing_populist (AfD) 德国另类选择党"
 GER.Nat_Populism_afd_icon: "£GER_nationalist_right_wing_populist"
 GER.Nat_Populism_afd_desc: "右翼民粹主义 - 德国的另类选择是一个欧洲怀疑论的右翼民粹主义政党，该党通过攻击传统政党的移民政策等方式获得声望。该党寻求恢复德国的主权和民族自豪感，并保护其文化免受伊斯兰化的侵害。"
