l_russian:
 MD_AI_RULES: "Настройки ИИ "
 MD_PEACE_DEALS: "Мирные конференции"
 MD_FOCUS_TREE_RULES: "Настройки деревьев фокусов"
 MD_FORMABLE_RULES: "Флаги и формируемые страны"
 MD_ORGANISATION_RULES: "Настройки организаций"
 MD_INFLUENCE_RULES: "Настройки системы влияния"
 MD_OPTIMISATION_RULES: "Оптимизация и производительность"
 MD_NUCLEAR_RULES: "Ядерные правила"
 MD_RULES: "Прочие правила"
 MD_CHEAT_RULES: "Настройки читов"
 MD_RANDOM_RULES: "Рандомайзер игровых правил"
 RULE_HARD_AI_ECONOMIC: "Экономический ИИ"
 RULE_DISABLE_HARD_AI_ECONOMIC: "Стандартное ограничение"
 RULE_DISABLE_HARD_AI_ECONOMIC_DESC: "Стандартное ограничение для ИИ, не позволяющее ему усиливать свою экономику. Для историчной игры"
 RULE_ENABLE_HARD_AI_ECONOMIC: "Без ограничений"
 RULE_ENABLE_HARD_AI_ECONOMIC_DESC: "Если тебе наскучило, что каждую игру ИИ не выходит из экономического кризиса - это для тебя. ИИ больше не ограничен в принятии решений о своей экономике. Будь готов, что многие страны станут богаче твоей. Только для тех, кто не боится сложностей. Привет от разработчика Battle AI ;)"
 RULE_DISABLE_AI_DEBT_WAR_TITLE: "Долговые войны для ИИ"
 RULE_DISABLE_AI_DEBT_WAR: "Выключено"
 RULE_DISABLE_AI_DEBT_WAR_DESC: "Это отключает функцию долговой войны для ИИ. ИИ больше не будет принимать решение о вторжении в страну, которая не выполняет свои долговые обязательства."
 RULE_ENABLE_AI_DEBT_WAR: "Включено"
 RULE_ENABLE_AI_DEBT_WAR_DESC: "Такая установка сделает ИИ более склонным к объявлению долговых войн."
 RULE_ENABLE_AI_FIGHTING_AUTONOMY_FOCUS: "ИИ использует §Tфокус на повышение автономии§!"
 RULE_ENABLE_FIGHTING_AUTONOMY_FOCUS: "Включено"
 RULE_ENABLE_FIGHTING_AUTONOMY_FOCUS_DESC: "ИИ будет бороться с вашей автономностью, используя постоянный фокус §Yувеличение автономии§!."
 RULE_DISABLE_FIGHTING_AUTONOMY_FOCUS: "Отключено"
 RULE_DISABLE_FIGHTING_AUTONOMY_FOCUS_DESC: "ИИ больше не будет бороться с вашей автономностью, используя постоянный фокус §Yувеличение автономии§!."
 RULE_ALLOW_CHAOTIC_PEACE_CONFERENCE: "Включить хаотичные мирные конфиренции"
 RULE_OPTION_CHAOTIC_PC_NO: "Нет"
 RULE_OPTION_CHAOTIC_PC_NO_DESC: "Эта опция, надеюсь, остановит всех от захвата земель в мирных конференциях ИИ.\nЭта опция ограничивает тех, кто может претендовать на государства, мажорами и лидерами фракций. (Это повлияет только на ИИ, а не на игрока)."
 RULE_OPTION_CHAOTIC_PC_YES: "Да"
 RULE_OPTION_CHAOTIC_PC_YES_DESC: "Для тех, кто действительно наслаждается проклятыми мирными конференциями, зачем ограничивать мир 1 §YРоссией§! когда можно провести 12 §YРоссий§!.\n(Я не несу ответственности за результаты, которые могут произойти от этого варианта!)"
 RULE_ALLOW_PLAYER_LED_PEACE_CONFERENCE: "Включить мирные конференции под руководством игроков"
 RULE_OPTION_PLAYER_LED_PC_NO: "Нет"
 RULE_OPTION_PLAYER_LED_PC_NO_DESC: "Эта опция позволит ИИ делать свой собственный выбор, каким бы глупым он ни был."
 RULE_OPTION_PLAYER_LED_PC_YES: "Да"
 RULE_OPTION_PLAYER_LED_PC_YES_DESC: "Для тех, кто не доверяет ИИ вставлять круглый колышек в круглое отверстие, это позволит только игрокам делать заявления во время мирных конференций."
 RULE_SALAFIST_BRANCH: "Активировать подразделение салафитов"
 RULE_YES_SALAFIST_BRANCH_DESC: "Включает ветку салафитов в общем дереве для всех стран, независимо от начальной религии."
 RULE_NO_SALAFIST_BRANCH_DESC: "Включает ветку салифотов в общем дереве для стран, следующих любой разновидности ислама."
 CUB_AI_BEHAVIOR: "@CUB Куба"
 FIJ_AI_BEHAVIOR: "@FIJ Фиджи"
 NIG_AI_BEHAVIOR: "@NIG Нигерия"
 RULE_OPTION_FRA_HISTORICAL: "Исторический"
 RULE_OPTION_FRA_HISTORICAL_DESC: "Пятая республика продолжает свой курс, поскольку президентство переходит от Ширака к Саркози, затем к Олланду и Макрону, а §8республиканцы§! и центристы поочерёдно сменяют друг друга у власти. Франция является опорой европейской интеграции и сохраняет связь со сферой влияния Франции и Африки."
 BRM_AI_BEHAVIOR: "@BRM Мьянма"
 SYR_AI_BEHAVIOR: "@SYR Сирия"
 RULE_OPTION_SYR_HISTORICAL: "Исторический"
 RULE_OPTION_SYR_HISTORICAL_DESC: "Хафеза Асада сменяет сын Башар: он удерживает у власти §8Партию арабского социалистического возрождения§!, вынужден уйти из Ливана после убийства Харири и отвечает на «арабскую весну» гражданской войной, а не уступками. На этом пути гражданская война неизбежна, из неё с большой вероятностью вырастет «Исламское государство», а режим выживает за счёт поддержки России и Ирана."
 RULE_OPTION_SYR_IRON_LADY: "Железная леди Сирии"
 RULE_OPTION_SYR_IRON_LADY_DESC: "Бушра Асад занимает президентский пост раньше братьев и ведёт Сирию между великими державами с креном в сторону Залива и Запада, выводя армию из Ливана и модернизируя здравоохранение и промышленность. Левант получает осторожную Сирию, нацеленную на развитие, с которой соседи могут торговать, а не бояться её."
 RULE_OPTION_SYR_SYRIAN_SAVAGE: "Сирийский дикарь"
 RULE_OPTION_SYR_SYRIAN_SAVAGE_DESC: "Махер Асад передаёт государство §8Сирийским арабским вооружённым силам§!, присоединяет Ливан и вооружается ради Великой Сирии, которая обращается против Иордании, Ирака, Залива и Израиля. Вместо осторожного игрока Левант получает агрессивную державу, одержимую территориальными захватами."
 RULE_OPTION_SYR_NEW_ASSAD: "Новый Аль-Асад"
 RULE_OPTION_SYR_NEW_ASSAD_DESC: "«Дамасской весне» дают ход, и во главе её из изгнания возвращается Рифат Асад при поддержке из-за рубежа, а его §8Арабская демократическая партия§! привязывает Сирию к Саудовской Аравии и Заливу. Монархии Залива получают арабского союзника в Дамаске, а Россия и Иран теряют опору на Средиземном море."
 BHR_AI_BEHAVIOR: "@BHR Бахрейн"
 SAU_AI_BEHAVIOR: "@SAU Саудовская Аравия"
 BOT_AI_BEHAVIOR: "@BOT Ботсвана"
 NKO_AI_BEHAVIOR: "@NKO Северная Корея"
 SIN_AI_BEHAVIOR: "@SIN Сингапур"
 SER_AI_BEHAVIOR: "@SER Югославия"
 UKR_AI_BEHAVIOR: "@UKR Украина"
 GEO_AI_BEHAVIOR: "@GEO Грузия"
 GEO_NATIONALIST_behavior: "@GEO Националистическое поведение"
 GEO_help_CHE_behavior: "@GEO Помощь чеченцам"
 GEO_2008_war_behavior: "@GEO Российско-грузинская война"
 GEO_WILL_FOLLOW_OWN_WAY: "Собственный путь"
 GEO_WILL_FOLLOW_OWN_WAY_DESC: "Националистическая Грузия идёт на Кавказе своим путём и обращается против обеих соседей — и Армении, и Азербайджана. Ни один из них не может рассчитывать на Тбилиси как на союзника."
 GEO_WILL_BE_PRO_ARMENIA: "Проармянская позиция"
 GEO_WILL_BE_PRO_ARMENIA_DESC: "Националистическая Грузия встаёт на сторону Армении и помогает ей сокрушить Азербайджан. Ереван получает партнёра на северной границе, а Баку — двух врагов."
 GEO_WILL_BE_PRO_AZERI: "Проазербайджанская позиция"
 GEO_WILL_BE_PRO_AZERI_DESC: "Националистическая Грузия встаёт на сторону Азербайджана и помогает ему сокрушить Армению. Баку получает партнёра на северной границе, а Ереван — двух врагов."
 GEO_WILL_HELP: "Помочь @CHE чеченцам"
 GEO_WILL_HELP_DESC: "Грузия поддерживает чеченских боевиков в их войне с Россией. Уцелевшая Чечня сможет позже отплатить услугой за услугу."
 GEO_WONT_HELP: "Не помогать @CHE чеченцам"
 GEO_WONT_HELP_DESC: "Грузия остаётся в стороне от чеченской войны с Россией. Чеченские боевики это запомнят и станут враждебны Тбилиси."
 GEO_ATTACK_RUS: "Подготовка к войне"
 GEO_ATTACK_RUS_DESC: "Грузия вооружается к августовской войне с Россией и намерена её выиграть. Более сильная грузинская армия превращает югоосетинский кризис в настоящее противостояние."
 GEO_WEAKBOY: "Компромисс с Россией"
 GEO_WEAKBOY_DESC: "Грузия ищет компромисс с Россией, чтобы избежать открытых боёв. Тбилиси меняет притязания на отколовшиеся регионы на мир."
 BLR_union_state_ai_behavior: "@BLR Поведение Союзного государства"
 BLR_WONT_FOLLOW_UNION_STATE: "Не следовать за Союзным государством"
 BLR_WONT_FOLLOW_UNION_STATE_DESC: "Беларусь сохраняет Союзное государство на бумаге и не отдаёт Москве контроль над страной. Минск остаётся суверенным партнёром, а не российской марионеткой."
 BLR_WILL_FOLLOW_UNION_STATE: "Образовать Союзное государство"
 BLR_WILL_FOLLOW_UNION_STATE_DESC: "Беларусь идёт к Союзному государству и ради этого принимает главенство России. Сначала Минск становится российской марионеткой, а в конце пути страны сливаются в единое государство под началом Москвы."
 PMR_sub_behavior: "@PMR Подповедение Приднестровья"
 PMR_PASSIVE_DEFAULT: "Экономический приоритет"
 PMR_PASSIVE_DEFAULT_DESC: "Приднестровье сосредотачивается на экономической ветке и не лезет в политику. Тирасполь остаётся тихим замороженным конфликтом на границе Молдовы."
 PMR_SHERIFF: "Республика шерифов"
 PMR_SHERIFF_DESC: "Тирасполь позволяет холдингу §8Sheriff§! поглотить государство, на территории которого он был построен, до тех пор, пока собственное подразделение безопасности компании не начнёт отвечать за республику. В итоге Приднестровьем управляет его крупнейший бизнес, а не парламент."
 RULE_OPTION_GER_GREEN: "Зелёная канцелярия"
 RULE_OPTION_GER_GREEN_DESC: "Он §8Зелень§! Германия захватывает канцелярию и тратит её на поэтапный отказ от ядерного оружия, европейскую «зелёную сделку» и прогрессивное налогообложение. Германия продвигает альянс на восток и дистанцируется как от Москвы, так и от Пекина."
 RULE_OPTION_GER_NATIONALIST: "Правление национал-демократов"
 RULE_OPTION_GER_NATIONALIST_DESC: "Конституционный порядок рушится, перерастая в гражданскую войну, и §8Национальная демократическая партия§! Германия захватывает руины, создавая однопартийное полицейское государство на крови, земле и изгнании. Германия открыто становится ирредентистской, и каждая граница вокруг неё превращается в претензию."
 RULE_OPTION_GER_SOCIALIST: "Левый восходящий"
 RULE_OPTION_GER_SOCIALIST_DESC: "§8Die Linke§! извлекает власть из руин Федеративной Республики, вытесняет американцев с их баз и разоружает страну. Затем Германия силой принуждает Францию, Польшу и Швецию к созданию рабочего профсоюза, если они откажутся."
 RULE_OPTION_GER_MONARCHIST: "Возвращение Кайзера"
 RULE_OPTION_GER_MONARCHIST_DESC: "Республика рушится, и §8Kaiser§! вновь коронуется над восстановленной империей. Германия возвращает монархов на швейцарский, австрийский, бельгийский, османский и итальянский престолы и объединяет их в имперский блок."
 RULE_DISABLE_FORMABLE_NATIONS: "Отключить формируемые страны"
 RULE_YES_FORMABLE_NATIONS_DESC: "Отключит решения по формированию стран."
 RULE_NO_FORMABLE_NATIONS_DESC: "Формируемые страны будут включены."
 RULE_ALLOW_EDGY_FLAGS: "Разрешить непристойные флаги"
 RULE_ALLOW_EDGY_FLAGS_BLOCKED_DESC: "Предотвращает появление некоторых наиболее спорных вариантов флага."
 RULE_ALLOW_EDGY_FLAGS_ALLOWED_DESC: "Позволяет использовать более спорные варианты флагов, которые обычно подвергаются цензуре."
 RULE_DISABLE_EU: "Отключить ЕС"
 RULE_YES_DISABLE_EU_DESC: "Все страны будут удалены из Европейского Союза."
 RULE_NO_DISABLE_EU_DESC: "Европейский союз будет существовать в прежнем виде."
 RULE_DISABLE_NATO: "Отключить НАТО"
 RULE_YES_DISABLE_NATO_DESC: "НАТО будет отключена при загрузке в игру."
 RULE_NO_DISABLE_NATO_DESC: "НАТО останется фракцией."
 RULE_SPREAD_INFLUENCE_AMOUNT_GAIN: "Увеличение суммы распространения влияния"
 RULE_SPREAD_INFLUENCE_AMOUNT_GAIN_DESC: "Измените влияние, полученное в результате распространения влияния."
 RULE_SPREAD_INFLUENCE_GAIN_0_5: "0.5%"
 RULE_SPREAD_INFLUENCE_GAIN_0_5_DESC: "0.5% влияния за каждое действие распространения. Если вы действительно хотите замедлить рост влияния."
 RULE_SPREAD_INFLUENCE_GAIN_2: "2%"
 RULE_SPREAD_INFLUENCE_GAIN_2_DESC: "2% влияния за каждое действие распространения. Если вы действительно хотите увеличить прирост влияния."
 RULE_SPREAD_INFLUENCE_GAIN_4: "4%"
 RULE_SPREAD_INFLUENCE_GAIN_4_DESC: "4% влияния за каждое действие распространения. Если вы действительно хотите увеличить прирост влияния."
 RULE_SPREAD_INFLUENCE_AMOUNT_COOLDOWN: "Перезарядка распространения влияния"
 RULE_SPREAD_INFLUENCE_30_COOLDOWN: "30 дней"
 RULE_SPREAD_INFLUENCE_30_COOLDOWN_DESC: "Время восстановления по умолчанию. Раз в 30 дней вы можете распространить своё влияние на другую страну."
 RULE_SPREAD_INFLUENCE_14_COOLDOWN: "14 дней"
 RULE_SPREAD_INFLUENCE_14_COOLDOWN_DESC: "Раз в 14 дней вы можете распространить своё влияние на другую страну."
 RULE_SPREAD_INFLUENCE_0_COOLDOWN: "Нет перезарядки"
 RULE_SPREAD_INFLUENCE_0_COOLDOWN_DESC: "Нет времени восстановления для распространения влияния, когда вы хотите сбросить всю свою §Hполитическую власть§! на влияние в других странах!"
 RULE_SPREAD_INFLUENCE_60_COOLDOWN: "60 дней"
 RULE_SPREAD_INFLUENCE_60_COOLDOWN_DESC: "Раз в 60 дней вы можете распространить своё влияние на другую страну."
 RULE_INVEST_INFLUENCE_AMOUNT_GAIN: "Увеличение влияния от инвестиций"
 RULE_INVEST_DEFAULT_GAIN_1: "1%"
 RULE_INVEST_DEFAULT_GAIN_1_DESC: "+1% влияния каждый раз, когда кто-то принимает ваши инвестиции."
 RULE_INVEST_DEFAULT_GAIN_0_5: "0.5%"
 RULE_INVEST_DEFAULT_GAIN_0_5_DESC: "0,5% влияния каждый раз, когда кто-то принимает ваши инвестиции."
 RULE_INVEST_DEFAULT_GAIN_2: "2%"
 RULE_INVEST_DEFAULT_GAIN_2_DESC: "2% влияния каждый раз, когда кто-то принимает ваши инвестиции."
 RULE_INFLUENCE_COOLDOWN: "Время перезарядки прироста влияния от инвестиций"
 RULE_14_DAY_INFLUENCE: "14-дневная перезарядка"
 RULE_14_DAY_INFLUENCE_DESC: "Вариант по умолчанию. Время восстановления влияния, полученного от инвестирования, составляет 14 дней или 2 недели. Это относится к стране для всех возможных инвестиционных возможностей. Хотя вы всё еще можете инвестировать, вы не получите никакого влияния в этот период времени."
 RULE_0_DAY_INFLUENCE: "Нет перезарядки"
 RULE_0_DAY_INFLUENCE_DESC: "Старый формат действия влияния MD, полученного из-за ограничения времени инвестиций. Вы можете инвестировать так часто, как хотите, и в то же время получать влияние, что не рекомендуется для тех, кто любит баланс!"
 RULE_30_DAY_INFLUENCE: "30-дневная перезарядка"
 RULE_30_DAY_INFLUENCE_DESC: "Предлагаемый вариант многопользовательской игры. Время восстановления влияния, полученного от инвестирования, составляет 30 дней или примерно 1 месяц. Это относится к стране для всех возможных инвестиционных возможностей. Хотя вы всё ещё можете инвестировать, вы не получите никакого влияния в этот период времени."
 RULE_ENABLE_DIVISION_LIMITER: "Включить ограничитель дивизий для ИИ"
 RULE_NO_ENABLE_DIVISION_LIMITER_DESC: "Ограничитель дивизий для ИИ выключен\n\nПо умолчанию ИИ не будет ограничен в количестве дивизии, которые он может производить. Если вы хотите ограничить количество дивизии из-за производительности, пожалуйста, включите меня!"
 RULE_YES_ENABLE_DIVISION_LIMITER_DESC: "Ограничитель дивизий для ИИ включён\n\nКогда я включен, ИИ с меньшей вероятностью будет производить дивизии, что позволит игроку играть с относительным спокойствием!"
 RULE_OPTION_POTATO_EDITION: "Картофельное издание"
 RULE_POTATO_EDITION_DIVISION_LIMITER_DESC: "Включить картофельное издание для ограничения количества дивизий у ИИ\n\nЕщё больше ограничивает количество дивизий для большей производительности.\n"
 RULE_REMOVE_MICRO_STATES: "Удалить Нации"
 RULE_NO_RULE_REMOVE_MICRO_STATES_DESC: "Не удаляйте ни одну из наций в начале игры."
 RULE_ALLOW_ENABLE_LEDGER: "Включить MD Ledger"
 RULE_ALLOW_ENABLE_LEDGER_YES_DESC: "Журнал MD включен. (Некоторая информация из журнала разведки «Сопротивления» может оказаться избыточной. Отключите эту функцию, если хотите усложнить игру.)"
 RULE_ALLOW_ENABLE_LEDGER_NO_DESC: "Отключает Leadger MD. Это лучше для пользователей, которые предпочитают более аутентичный опыт и хотят использовать La Resistance для получения важной информации."
 RULE_ALLOW_HELP_GUI: "Включить MD Help GUI"
 RULE_ALLOW_HELP_GUI_YES: "Это включает MD Help GUI."
