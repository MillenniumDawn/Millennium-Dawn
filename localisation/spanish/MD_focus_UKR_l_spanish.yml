 UKR_hur_operation_dagestan_tt: "Podremos lanzar una operación especial limitada en §Y[DAG.GetNamewithFlag]§!"
 UKR_hur_operation_chechnya_tt: "Podremos lanzar una operación especial limitada en §Y[CHE.GetNamewithFlag]§!"
 UKR_hur_operation_caucas_volunteer_tt: "Se abrirán nuevos batallones HUR para operaciones especiales limitadas"
 UKR_hur_operation_russian_tt: "Podremos lanzar operaciones especiales limitadas en §Y[SOV.GetNamewithFlag]§!"
 UKR_hur_operation_vladivostok_tt: "Podremos lanzar operaciones especiales limitadas en §Y[FAR.GetNamewithFlag]§!"
 UKR_hur_operation_silesia_tt: "Podremos lanzar una operación especial limitada en §Y[SIL.GetNamewithFlag]§!"
 UKR_hur_operation_kashubia_tt: "Podremos lanzar una operación especial limitada en §Y[KSH.GetNamewithFlag]§!"
 did_not_support_the_baltic_black_sea_union: "§YNo apoyó la iniciativa de la Unión del Mar Negro-Báltico§!"
 ukraine_congress.2.t: "Ucrania toma Sebastopol"
 ukraine_congress.2.d: "The Ukrainian government cancels the lease agreement with us and begins the expulsion of our fleet from Sevastopol."
 ukraine_congress.2.a: "Esta es nuestra derrota"
 ukraine_congress.10.t: "Ucrania Propone Ideas del Mar Negro-Báltico"
 ukraine_congress.10.d: "La Unión del Mar Negro-Báltico es un concepto similar al concepto del Intermarium encabezado desde Polonia hace mucho tiempo. Habla de una alianza defensiva de países que están entre los mares Báltico y Negro. Los países cooperarían y se consolidarían en un bloque de poder que se apoyaría mutuamente. El dicho dice que la unión hace la fuerza.\n\n§YEsto permite garantías mutuas a través del árbol ucraniano§!"
 ukraine_congress.10.a: "Deberíamos seguir explorando esto."
 ukraine_congress.10.b: "Idea tonta"
 ukraine_congress.11.t: "La Unión del Báltico al Mar Negro"
 ukraine_congress.11.d: "Se han redactado leyes y tratados. La gente de los países que apoyan la idea finalmente se ha unido. Es hora de que la ambición se realice. Es hora de aliarse con los que nos han apoyado. Ucrania nos ha enviado nuestro tratado final que debemos firmar para oficializar la alianza. ¿Nos echamos atrás ahora o seguimos el curso y apoyamos a nuestros nuevos aliados?"
 ukraine_congress.11.a: "Firmar el Tratado"
 ukraine_congress.11.b: "Retirarse. Triturar el Tratado"
 UKR_poroshenko_start: "Presidencia de Poroshenko"
 UKR_poroshenko_start_desc: "The Ukrainian state was headed by an oligarch. The history of Ukraine clearly did not expect such a turn, perhaps it will lead Ukraine to success."
 UKR_poroshenko_decentr: "Descentralización"
 UKR_poroshenko_decentr_desc: "One of the main political points of Poroshenko's program has been and will be - decentralization. We must reform the Ukrainian state."
 UKR_poroshenko_deccomunism: "Descomunización"
 UKR_poroshenko_deccomunism_desc: "The communist past has been hard and scary for our country. Our nation was almost destroyed by the Famine, and we will not allow monuments to our murderers to be all over the country."
 UKR_poroshenko_anti_corruption: "Reformas anticorrupción"
 UKR_poroshenko_anti_corruption_desc: "Corruption has been and will continue to be a sore topic in our country, and we will carry out a series of anti-corruption reforms."
 UKR_poroshenko_nabu: "Crear NABU"
 UKR_poroshenko_nabu_desc: "NABU: autoridad ejecutiva central con un estatus especial encargada de la prevención, detección, supresión, investigación y descubrimiento de la corrupción y otros delitos penales atribuidos a su jurisdicción, así como la prevención de nuevos."
 UKR_poroshenko_no_russian_military: "Deshacerse de la influencia de las Fuerzas Armadas rusas"
 UKR_poroshenko_no_russian_military_desc: "Debemos dejar de depender del Ejército ruso, solo un ejército ucraniano independiente protegerá el país."
 UKR_poroshenko_anti_rus_doctrine: "La Doctrina Anti-Rusa"
 UKR_poroshenko_anti_rus_doctrine_desc: "Russia has been and will be an aggressor towards us, we must clearly reflect this in our military doctrine."
 UKR_poroshenko_smi_free: "Libertad de los Medios"
 UKR_poroshenko_smi_free_desc: "The media should be free and not limited by the dictatorial habits of a few people."
 UKR_poroshenko_kefalia: "Autocefalia de la Iglesia Ucraniana"
 UKR_poroshenko_kefalia_desc: "It's time to get rid of the influence of the Moscow Orthodox Church."
 UKR_poroshenko_ukrainisation: "Ucranización"
 UKR_poroshenko_ukrainisation_desc: "We will begin a policy of Ukrainization, and gradually eradicate the Russian language from various social environments."
 UKR_poroshenko_upa: "Honrar a los héroes de la UPA"
 UKR_poroshenko_upa_desc: "UPA - they were defenders of Ukraine and we will honor them."
 UKR_poroshenko_es: "Cooperación con la UE"
 UKR_poroshenko_es_desc: "The European Union will be our main economic partner and we will strive to maintain trade relations with them further."
 UKR_poroshenko_canada: "Asociación con Canadá"
 UKR_poroshenko_canada_desc: "We are ready to conclude several agreements with Canada to improve trade relations."
 UKR_us_friendship: "Asociación con EE. UU."
 UKR_us_friendship_desc: "We are ready to conclude several agreements with USA to improve trade relations."
 UKR_visegrad_coop: "Asociación con el Grupo de Visegrado"
 UKR_visegrad_coop_desc: "We are ready to conclude several agreements with Visegrád Group to improve trade relations."
 UKR_turkey_invest_req: "Inversiones de Turquía"
 UKR_turkey_invest_req_desc: "We will attract Turkish investors to our territory, their investments will help our economy."
 UKR_kazakh_improve_rel: "Mejorar las relaciones con Kazajstán"
 UKR_kazakh_improve_rel_desc: "Kazakhstani partners will be an excellent addition to our foreign trade activities."
 UKR_reorient_market: "Reorientación hacia el mercado occidental"
 UKR_reorient_market_desc: "The East is closed to us, we will reorient our markets to the west."
 UKR_ukroboronprom_revival: "Inversiones en la industria de defensa"
 UKR_ukroboronprom_revival_desc: "Our defense industry needs investments, we will give them."
 UKR_smuggle_parts_through_russia: "Comprar piezas en Rusia de manera indirecta"
 UKR_smuggle_parts_through_russia_desc: "Despite our anti-Russian doctrine, we are forced to purchase spare parts from Russian factories, albeit in a roundabout way."
 UKR_reverse_engineering: "Ingeniería inversa"
 UKR_reverse_engineering_desc: "We will strive to create our own engineering in the field of armored vehicles."
 UKR_western_assistance: "Apoyo occidental"
 UKR_western_assistance_desc: "Western investors are also actively investing in our defense industry."
 UKR_poroshenko_nato: "Cooperación con la OTAN"
 UKR_poroshenko_nato_desc: "NATO is our main military partner, and with their help we are reforming our armed forces."
 UKR_belarus_proposal_non_attack: "Pacto de No Agresión con Bielorrusia"
 UKR_belarus_proposal_non_attack_desc: "Belarus, our northern neighbor, can be used by enemies to attack us from two sides, we must prevent this."
 UKR_language_policies: "Política lingüística"
 UKR_language_policies_desc: "We will continue to expand the percentage of the Ukrainian language in communication and in other areas of citizens' lives."
 UKR_support_patriotism: "Apoyo al patriotismo"
 UKR_support_patriotism_desc: "Patriotism will be encouraged by the state as never before."
 UKR_donbass_okopi: "Operación Muro"
 UKR_donbass_okopi_desc: "We urgently need to build a defensive line along the border of our enemy."
 UKR_transnistria_defences: "Fortalecer la frontera con Transnistria"
 UKR_transnistria_defences_desc: "Transnistria may become a springboard for an attack on us in the future, we will strengthen the border with them."
 UKR_deoligarchisation: "Desoligarquización"
 UKR_deoligarchisation_desc: "The oligarchs have too much power in our country - we will fix it."
 UKR_rochen_expansion: "Ampliar la producción de Roshen"
 UKR_rochen_expansion_desc: "Roshen factory will now be able to expand its production capabilities with the help of public investments."
 UKR_support_medium_businesses: "Apoyar a las pequeñas empresas"
 UKR_support_medium_businesses_desc: "Small businesses will receive the necessary support."
 UKR_kolomoyski_deal: "Lidiar con Kolomoisky"
 UKR_kolomoyski_deal_desc: "Kolomoisky has long been one of the main problems in our country, his influence was too great and it's time to deal with him."
 UKR_purge_church_from_rus: "Eliminar la influencia de la Iglesia Ortodoxa Rusa"
 UKR_purge_church_from_rus_desc: "The Russian Orthodox Church will no longer influence us."
 UKR_greece_letter: "Dirigirse al Patriarca Ecuménico"
 UKR_greece_letter_desc: "We will appeal to the Ecumenical Patriarch to recognize our church as independent."
 UKR_upc_create: "Crear una Iglesia Ortodoxa Ucraniana"
 UKR_upc_create_desc: "The Ukrainian Orthodox Church will be created! Now we are a spiritually free country as well."
 UKR_poroshenko_army_reform: "Reforma del Ejército"
 UKR_poroshenko_army_reform_desc: "Our army needs major reforms - we will start implementing them now."
 UKR_pmc_instructors: "Instructores de PMC occidentales"
 UKR_pmc_instructors_desc: "Western PMCs instructors are ready to support our army."
 UKR_rally_nationalist_support: "Apoyar a los veteranos"
 UKR_rally_nationalist_support_desc: "Combat veterans will be the mainstay of our future election campaign."
 UKR_welfare_conseccions: "Aumentar el apoyo social"
 UKR_welfare_conseccions_desc: "Nos centraremos en nuestra futura campaña electoral en aumentar las garantías sociales."
 UKR_anti_russia_propaganda: "Propaganda anti-rusa"
 UKR_anti_russia_propaganda_desc: "Our citizen must understand who his true enemy is, who seeks to absorb our country - Russia."
 UKR_saakashvili_odessa: "Invite Saakashvili As The Governor of Odesa"
 UKR_saakashvili_odessa_desc: "We will invite Saakashvili to be the governor of the Odesa region, perhaps he will show himself well."
 UKR_support_minsk_agreements: "Apoyar los Acuerdos de Minsk"
 UKR_support_minsk_agreements_desc: "We will support the Minsk agreements and try to resolve everything peacefully."
 UKR_continue_shelling: "Poner fin a los separatistas"
 UKR_continue_shelling_desc: "No separatists! We will liberate our lands."
 UKR_business_with_rf: "Negocios con Rusia"
 UKR_business_with_rf_desc: "We will continue to do business with Russia."
 UKR_full_rus_embargo_por: "Imponer un embargo contra Rusia"
 UKR_full_rus_embargo_por_desc: "We will impose an embargo on economic cooperation with Russia."
 UKR_osce_watchers: "Observadores de la OSCE"
 UKR_osce_watchers_desc: "OSCE observers will be invited to Donbass."
 UKR_suppress_easterner: "Reprimir a los orientales"
 UKR_suppress_easterner_desc: "Supporters of integration with Russia should be suppressed, including through the media."
 UKR_anti_emerg_1plus1: "Fortalecer la propaganda anti-oriental"
 UKR_anti_emerg_1plus1_desc: "We will strengthen the propaganda directed against those who support Russia."
 UKR_eu_compliant_reforms: "Reformas de conformidad con la UE"
 UKR_eu_compliant_reforms_desc: "We will continue compliance reforms for integration with the European Union."
 UKR_european_education_connections: "Cooperación con instituciones educativas europeas"
 UKR_european_education_connections_desc: "European education will give us much more than the old, Soviet and totalitarian one."
 UKR_european_defence_program: "El Programa de Protección Europeo"
 UKR_european_defence_program_desc: "We will join the European Defense Program to strengthen our armed forces."
 UKR_nato_application_por: "El Programa de Cooperación con la OTAN"
 UKR_nato_application_por_desc: "NATO's partnership in the field of armed forces will also allow us to carry out reforms of our army."
 UKR_ukraine_anew: "Nueva Ucrania"
 UKR_ukraine_anew_desc: "Our country has gone through a long way, many reforms, but now it has been reborn and looks positively to the future."
 UKR_separatist_menace: "La amenaza separatista"
 UKR_separatist_menace_desc: "La amenaza de las repúblicas separatistas no se puede hacer en ninguna parte, debemos resolverla."
 UKR_apply_to_eu_por: "El Programa de Cooperación con la UE"
 UKR_apply_to_eu_por_desc: "Cooperation with the European Union will continue to be our priority."
 UKR_anti_rus_doctrine: "La Doctrina Anti-Rusa"
 UKR_anti_rus_doctrine_desc: "Nuestro enemigo político e ideológico fue y sigue siendo Rusia. Debemos aceptar esto y estar preparados para la guerra."
 UKR_foreign_advisors: "Asesores Extranjeros"
 UKR_foreign_advisors_desc: "Foreign instructors from various PMCs are ready to train our soldiers."
 UKR_west_investors: "Inversores occidentales"
 UKR_operation_wall: "Operación Muro"
 UKR_smuggle_parts_from_rus: "Compra de repuestos de Rusia"
 UKR_smuggle_parts_from_rus_desc: "We continue to buy spare parts from Russia, albeit secretly."
 UKR_reverse_engineering_start: "Ingeniería inversa"
 UKR_reverse_engineering_start_desc: "We aim to create our own production."
 UKR_ato_supports: "Apoyo a los veteranos"
 UKR_health_supports: "Apoyo de atención médica"
 UKR_poroh_prepare_donbass: "Prepararse para una revancha en Donbass"
 UKR_poroh_prepare_donbass_desc: "We are ready to take revenge from the separatists and solve the problem with the People's republics forever."
 UKR_poroh_osce_ukr: "Observadores de la OSCE"
 UKR_poroh_osce_ukr_desc: "OSCE observers have been sent to the conflict zone to stabilize the situation on the front line with the unrecognized republics."
 UKR_idea_eu_member_associate: "Miembro asociado de la UE"
 UKR_idea_eu_member_associate_desc: "Ucrania ha comenzado su asociación con la UE. Profundizará los lazos con Europa y el bloque occidental. Sin embargo, proporciona problemas con las regiones de mayoría de habla rusa."
 ukraine_poroh.1.t: "Ucrania propone un pacto de no agresión"
 ukraine_poroh.1.d: "The Ukrainian government suggests that we conclude a non-aggression pact with them, apparently they see us as potential aggressors against themselves."
 ukraine_poroh.1.a: "Firmaremos un pacto"
 ukraine_poroh.1.b: "No hay necesidad de eso"
 ukraine_poroh.2.t: "Pacto de No Agresión con Bielorrusia"
 ukraine_poroh.2.d: "The Belarusian government has agreed to sign a non-aggression pact with us, we are glad that they are on our side."
 ukraine_poroh.2.a: "Bueno"
 ukraine_poroh.3.t: "Pacto de No Agresión con Bielorrusia"
 ukraine_poroh.3.d: "The Belarusian government has refused to sign a non-aggression pact with us, which worries us."
 ukraine_poroh.3.a: "Triste"
 ukraine_poroh.4.t: "Autocefalia de la Iglesia Ucraniana"
 ukraine_poroh.4.d: "La Iglesia Ucraniana ha apelado a nuestro Patriarca Ecuménico para obtener el permiso de autocefalia de su iglesia, ¿permitirá nuestro patriarca esto?"
 ukraine_poroh.4.a: "Sí"
 ukraine_poroh.4.b: "No"
 ukraine_poroh.5.t: "Autocefalia de la Iglesia Ucraniana"
 ukraine_poroh.5.d: "The Ecumenical Patriarch approved the Autocephaly of our Church."
 ukraine_poroh.5.a: "Bueno"
 ukraine_poroh.6.t: "Autocefalia de la Iglesia Ucraniana"
 ukraine_poroh.6.d: "The Ecumenical Patriarch did not approve the Autocephaly of our Church."
 ukraine_poroh.6.a: "Triste"
 ukraine_poroh.7.t: "Ucrania quiere cooperación con el Visegrado Cuatro"
 ukraine_poroh.7.d: "El gobierno ucraniano ha delineado claramente sus planes de cooperación con los países del Grupo de Visegrado. Como representante de los cuatro, decidimos si estamos de acuerdo con esta cooperación"
 ukraine_poroh.7.a: "Sí"
 ukraine_poroh.7.b: "No"
 ukraine_poroh.8.t: "Cooperación con países de Visegrado"
 ukraine_poroh.8.d: "They agreed to cooperate."
 ukraine_poroh.8.a: "Bueno"
 ukraine_poroh.9.t: "Cooperación con países de Visegrado"
 ukraine_poroh.9.d: "They refused to cooperate with us."
 ukraine_poroh.9.a: "Triste"
 UKR_kefalia_agree: "Permiso del Patriarca Ecuménico"
 UKR_odessa_ssaka: "Consecuencias de la gobernación de Saakashvili"
 UKR_odessa_ssak: "Consecuencias de la gobernación de Saakashvili"
 ukr_industry_points_cost_35: "35 puntos de industria"
 ukr_industry_points_cost_50: "50 puntos de industria"
 ukr_industry_points_cost_75: "75 puntos de industria"
 UKR_opfl_political_reforms: "Reformas políticas"
 UKR_opfl_political_reforms_desc: "Tras los recientes acontecimientos, nuestro país necesita reformas políticas. Sin ellas, Ucrania no podrá seguir desarrollándose."
 UKR_opfl_lustration_fight: "Lucha contra la lustración"
 UKR_opfl_lustration_fight_desc: "La lustración es la restricción del acceso al servicio público para aquellos que ocuparon altos cargos bajo regímenes políticos anteriores. Después de eventos recientes, esta política también está teniendo lugar en Ucrania. Este ultraje debe detenerse!"
 UKR_opfl_radicalism: "Lucha contra el radicalismo"
 UKR_opfl_radicalism_desc: "En unos pocos años de caos político, el radicalismo se ha extendido por toda Ucrania. Para la existencia pacífica de nuestro país, es necesario combatir cualquier manifestación de radicalismo en nuestro país."
 UKR_opfl_ukrainisation_policy: "Condena de la ucranización"
 UKR_opfl_ukrainisation_policy_desc: "The policy of Ukrainianisation directly interferes with the development of good relations with our big neighbour - Russia. It is necessary to condemn and stop the propaganda of Ukrainianisation, otherwise no good will come of it."
 UKR_opfl_national_ref: "Realización de un referéndum nacional"
 UKR_opfl_national_ref_desc: "Un referéndum nacional ayudará a la gente de nuestro país a determinar su propio futuro. Debemos hacerlo lo antes posible!"
 UKR_opfl_independence_rep: "Reconocer la independencia de las repúblicas"
 UKR_opfl_independence_rep_desc: "Bueno, la gente de las repúblicas ha tomado su decisión y debemos respetarla. Es hora de invertir y construir lazos con nuevos estados!"
 UKR_opfl_take_republic: "Traer de vuelta por la fuerza"
 UKR_opfl_take_republic_desc: "El referéndum fue solo una cortina de humo. Nuestro verdadero objetivo es identificar a los separatistas en nuestro territorio y es hora de traer nuestros territorios a casa! Los separatistas no caminarán sobre el suelo ucraniano!"
 UKR_opfl_federalisation_project: "Proyecto de Federación"
 UKR_opfl_federalisation_project_desc: "Ahora que se han resuelto todas las disputas territoriales, podemos mirar hacia un futuro brillante. Es hora de la Federación Ucraniana!"
 UKR_opfl_economic_policy: "Nuevas políticas económicas"
 UKR_opfl_economic_policy_desc: "New economic policies will help revitalise our economy and subsequently rebuild it."
 UKR_opfl_rural_land: "Conservación de tierras rurales"
 UKR_opfl_rural_land_desc: "Rural activities are a big part of our economy. Therefore, it is necessary to secure their legally acquired land. This way we will give them confidence that their land will not be taken away the next day."
 UKR_opfl_small_med_business: "Beneficios para pequeñas y medianas empresas"
 UKR_opfl_small_med_business_desc: "Las pequeñas y medianas empresas son una parte importante de nuestra economía. Para un mayor crecimiento, necesitamos dar bonificaciones para que la gente se incentive a hacer negocios."
 UKR_opfl_tarif_genocide: "No! Genocidio tarifario"
 UKR_opfl_tarif_genocide_desc: "El genocidio tarifario es una pesadilla para nuestros ciudadanos. La mayor parte de su dinero se destina a pagar numerosos e innecesarios impuestos. Debemos decir 'NO' a esta sinvergüenzura!"
 UKR_opfl_deindustry: "Detener la desindustrialización de Ucrania"
 UKR_opfl_deindustry_desc: "Después de que Ucrania obtuvo la independencia, el antiguo gobierno regaló toda la riqueza industrial de nuestro país a cualquiera por nada. Como resultado, terminamos en un pozo industrial. Debemos reanudar la construcción de fábricas, plantas y otras empresas!"
 UKR_federaliz_tt: "§YFederalizaremos§! Ucrania!"
 UKR_legacy_of_the_ukr_ind: "Industrialización ucraniana"
 UKR_legacy_of_the_ukr_ind_desc: "Ucrania depende en gran medida de su base industrial para su crecimiento económico. Las principales ciudades de Kiev, Leópolis y Zaporizhia contienen alguna forma de industria que ha impulsado su crecimiento a lo largo de los años. Debemos mantener esta tendencia o nos estancaremos."
 UKR_ssau: "SSAU"
 UKR_ssau_desc: "La industria espacial ucraniana está lejos de ser un líder mundial en tecnología espacial. Sin embargo, es un gran productor de naves espaciales y otra maquinaria extraterrestre. La capacidad de seguir siendo competitivos en esta última frontera dictará nuestro futuro en los próximos años."
 UKR_pivdenmash_udo: "Pivdenmash"
 UKR_pivdenmash_udo_desc: "Pivdenmash es el principal fabricante de naves espaciales de Ucrania. La empresa es notable por producir cohetes para países extranjeros como la NASA. Sería bueno desarrollar esta industria en auge para proyectar a Ucrania en el escenario mundial. Dato curioso rápido, los cohetes fabricados en Ucrania representaron el 12% de todos los vuelos espaciales en 2006. ¿Quién lo diría!"
 UKR_national_steel_companies: "Acero Rutenio"
 UKR_national_steel_companies_desc: "El acero rutenio fue una vez un producto formidable destinado a la guerra. Ahora, ya no luchamos con espadas y escudos. Sin embargo, nuestros tanques, armas y balas necesitan acero de calidad para mantenerse competitivos."
 UKR_tsnap: "TSNAP"
 UKR_tsnap_desc: "These are institutions where different groups of people can receive a wide range of administrative services in a comfortable environment. They are created by local councils and local state administrations and serve individuals and legal entities."
 UKR_bronetank: "Planta de Blindados de Járkov"
 UKR_bronetank_desc: "The state enterprise of the armored industry, which carries out the production, repair, maintenance, re-equipment and modernization of armored vehicles."
 UKR_avia_zavod: "Planta de Aviación de Járkov"
 UKR_avia_zavod_desc: "The enterprise of aviation engineering in the city of Kharkov. It produces passenger, transport, and military aircraft."
 UKR_priborostroy: "Planta de Instrumentos de Járkov"
 UKR_priborostroy_desc: "Una de las fábricas más grandes de la URSS para la producción de electrónica militar y equipos eléctricos domésticos."
 UKR_tractor: "Planta de Tractores de Járkov"
 UKR_tractor_desc: "An enterprise for the production of tracked and wheeled tractors."
 UKR_agregat: "Oficina de Diseño de Agregados de Járkov"
 UKR_agregat_desc: "A scientific and production enterprise of the military-industrial complex, which develops and manufactures units for hydraulic, fuel and electrical systems of aviation and rocket technology."
 UKR_morozova: "Oficina de Diseño de Ingeniería de Járkov"
 UKR_morozova_desc: "Una empresa que desarrolla vehículos blindados. Anteriormente, KP KKBM jugó un papel clave en la creación de vehículos blindados de oruga de la Unión Soviética."
 UKR_specmachine: "Planta de Máquinas Especiales de Járkov"
 UKR_specmachine_desc: "La empresa estatal del complejo militar-industrial."
 UKR_malichev: "Planta Malyshev"
 UKR_malichev_desc: "La planta de ingeniería de transporte en Járkov, que produce motores, locomotoras y tanques."
 UKR_reborn_ser_and_molot: "Revivir la Planta \"Martillo y Hoz\""
 UKR_reborn_ser_and_molot_desc: "A large enterprise of agricultural machinery in Kharkov, it was one of the most important enterprises of the Kharkov industry and one of the largest enterprises of agricultural machinery in the Russian Empire and the USSR."
 UKR_concers: "Consorcio de Defensa de Járkov"
 UKR_concers_desc: "Unificaremos todas nuestras empresas de la industria militar en una sola empresa. Así, fortaleceremos la coordinación de la producción y aumentaremos la productividad."
 UKR_naftogaz: "Naftogaz"
 UKR_naftogaz_desc: "Naftogaz es la empresa estatal de petróleo y gas natural. Participa en el proceso de extracción y refinación de los productos. La empresa a menudo se utiliza para impulsar la independencia del petróleo y el gas frente a países como Rusia u otros grandes exportadores de energía."
 UKR_extend_ukrainian_refineries: "Enfoque en Energías Renovables"
 UKR_extend_ukrainian_refineries_desc: "Aunque tenemos amplio acceso al gas natural y otras reservas de petróleo, complementar nuestras necesidades energéticas actuales con otras formas de energía ayudará a estabilizar en tiempos de baja producción de combustibles fósiles."
 UKR_zalk: "Plantas Industriales de Zaporizhia"
 UKR_zalk_desc: "Zaporizhia es un importante centro industrial en Ucrania. Es la capital del óblast de Zaporizhia, hogar de ZAZ, y es un centro para la metalurgia y un importante puerto para el envío de mercancías desde el Donbás."
 UKR_rosava: "CJSC Rosava"
 UKR_rosava_desc: "CJSC Rosava es el mayor fabricante de neumáticos en Ucrania. Los sitios de producción se encuentran en dos fábricas de neumáticos: Rosava y la producción de neumáticos de gran tamaño. La capacidad alcanza unos 6 millones de unidades de neumáticos por año."
 UKR_land_land: "Continuar la Reforma Agraria"
 UKR_land_land_desc: "We are ready to continue the land reform that began in the last century and move it forward."
 UKR_zaporozhia_gold: "Mina de Oro de Muzhievo"
 UKR_zaporozhia_gold_desc: "We will finally attract investors and start developing these mines with gold deposits."
 UKR_monobank: "Monobank"
 UKR_monobank_desc: "Monobank is a Ukrainian direct bank. Like all of the existing neobanks in Ukraine, it operates using a banking license of a parent bank, namely, Universal Bank, which is a part of the TAS Group and belongs to Ukrainian businessman Serhiy Tihipko."
 UKR_zaz: "ZAZ"
 UKR_zaz_desc: "ZAZ o Planta de Construcción de Automóviles de Zaporizhia es el principal fabricante de automóviles en Ucrania. Como su nombre indica, está ubicada en la ciudad de Zaporizhia en el sureste de Ucrania. También produce comúnmente autobuses y camiones y es conocida principalmente por su antigua empresa matriz AvtoZAZ."
 UKR_kraz: "KrAZ"
 UKR_kraz_desc: "KrAZ es una empresa privada en Kremenchuk, Ucrania. La empresa produce principalmente camiones y otros vehículos de propósito especial. Sin embargo, su especialidad principal son los modelos todoterreno de servicio pesado. Recientemente se registró como una empresa holding, y ahora la corporación ucraniana Finanzas y Crédito es su propietaria."
 UKR_motor_sich: "Motor Sich"
 UKR_motor_sich_desc: "La Compañía de Acciones Motor Sich es un fabricante ucraniano de motores de aviación con sede en Zaporizhzhia. La empresa fabrica motores para aviones y helicópteros, así como turbinas de gas marinas industriales e instalaciones."
 UKR_armor_kyv: "The Kyiv Armored Plant"
 UKR_armor_kyv_desc: "The Kyiv Armored Plant is a state-owned enterprise of the armored industry of Ukraine, which performs diagnostics, repair, maintenance, re-equipment and modernization of Soviet-made armored vehicles."
 UKR_pivdenmash_idea: "PA Pivdenmash"
 UKR_kyvarmor_idea: "Kyiv Armored Plant"
 UKR_tsnap_idea: "TSNAP"
 UKR_concern: "Industria Militar de Járkov"
 UKR_zaz_idea: "ZAZ"
 UKR_kraz_idea: "KrAZ"
 UKR_motorsich_idea: "Motor Sich"
 UKR_start_war_against_poland: "Guerra Polaco-Ucraniana"
 UKR_start_war_against_poland_desc: "El momento decisivo de nuestro estado ha llegado. Repeleremos al enemigo o desapareceremos de la historia mundial."
 UKR_hur_expandeds: "Ampliar la Influencia del HUR"
 UKR_hur_expandeds_desc: "Ampliaremos los poderes del HUR, la situación lo requiere, la guerra lo requiere!"
 UKR_unite_with_russian_genshtab: "Reclutar la Ayuda del Estado Mayor Ruso"
 UKR_unite_with_russian_genshtab_desc: "We are ready to enlist the help of the Russian General Staff for the war with the Polish Army."
 UKR_observer_joint_shtab_kiev: "Crear un Cuartel General Conjunto"
 UKR_observer_joint_shtab_kiev_desc: "The armed forces of Russia and Ukraine will create a joint general staff in Kyiv."
 UKR_professional_shturm_groups: "Brigadas de Asalto"
 UKR_professional_shturm_groups_desc: "Comenzaremos a reclutar personas en brigadas de asalto para enfrentar más eficazmente a nuestros enemigos."
 UKR_pmc_zaporozhets: "PMCs Zaporozhets"
 UKR_pmc_zaporozhets_desc: "Algunos veteranos de guerra han creado su propia compañía militar privada llamada Zaporozhets."
 UKR_start_the_kashubian_uprising: "Preparar una Rebelión en Casubia"
 UKR_start_the_kashubian_uprising_desc: "We will prepare an insurgency in this region to undermine Poland's defense."
 UKR_silesian_rebellion: "Preparar una Rebelión en Silesia"
 UKR_silesian_rebellion_desc: "We will prepare an insurgency in this region to undermine Poland's defense."
 UKR_vilnoe_pospolitoe_rushenie: "El Batallón Pospolite Ruszenie"
 UKR_vilnoe_pospolitoe_rushenie_desc: "A new operational Battalion of the HUR will be created to conduct special limited operations on enemy territory."
 UKR_belarus_volunteers: "El Batallón Rokossovsky"
 UKR_belarus_volunteers_desc: "A new operational Battalion of the HUR will be created to conduct special limited operations on enemy territory."
 UKR_legion_free_poland: "La Legión de la Libertad de Polonia"
 UKR_legion_free_poland_desc: "A new operational Battalion of the HUR will be created to conduct special limited operations on enemy territory."
 UKR_polish_hetmanate_army: "El Batallón del Hetmanato Polaco"
 UKR_polish_hetmanate_army_desc: "A new operational Battalion of the HUR will be created to conduct special limited operations on enemy territory."
 UKR_air_dominance_tactics: "Tácticas de Dominio Aéreo"
 UKR_air_dominance_tactics_desc: "We need to suppress Polish Aviation, so we will apply a new doctrine."
 UKR_tro_expandeds: "Fortalecer la Defensa Territorial"
 UKR_tro_expandeds_desc: "Ampliaremos urgentemente el reclutamiento para la defensa territorial, necesitamos combatientes de inmediato!"
 UKR_start_war_against_russia: "Guerra Ruso-Ucraniana"
 UKR_start_war_against_russia_desc: "El momento decisivo de nuestro estado ha llegado. Repeleremos al enemigo o desapareceremos de la historia mundial."
 UKR_inter_legion: "Legión Internacional de Defensa Territorial"
 UKR_inter_legion_desc: "La Legión Internacional de Defensa Territorial de Ucrania es un proyecto del Gobierno de Ucrania para atraer extranjeros a crear unidades voluntarias como parte de la defensa territorial de las Fuerzas Armadas de Ucrania."
 UKR_kraken: "Unidad Especial \"Kraken\""
 UKR_kraken_desc: "The Kraken Special Unit is a Ukrainian separate intelligence and sabotage unit of the Main Intelligence Directorate of the Ministry of Defense of Ukraine."
 UKR_hur_expanded: "Ampliar la Influencia del HUR"
 UKR_hur_expanded_desc: "Ampliaremos los poderes del HUR, la situación lo requiere, la guerra lo requiere!"
 UKR_tro_expanded: "Fortalecer la Defensa Territorial"
 UKR_tro_expanded_desc: "Ampliaremos urgentemente el reclutamiento para la defensa territorial, necesitamos combatientes de inmediato!"
 UKR_tck: "Movilización Masiva"
 UKR_tck_desc: "We will have to start mass mobilization, because this is literally a war for the existence of our state."
 UKR_other_battaions_hur: "Nuevos Batallones del HUR"
 UKR_other_battaions_hur_desc: "HUR is actively recruiting fighters into its battalions, some of them are already ready to join the battle."
 UKR_free_russia_legion: "Legión de la Libertad de Rusia"
 UKR_free_russia_legion_desc: "Real Russian patriots are ready to fight for us and overthrow the tyranny that hangs over Russia."
 UKR_rdk: "El Cuerpo de Voluntarios Rusos"
 UKR_rdk_desc: "Russian nationalists who do not agree with Russia's policy have self-organized under our command into the Russian volunteer corps."
 UKR_republican_army: "Ejército Republicano Nacional"
 UKR_republican_army_desc: "Fugitive deputies from Russia have created a national Republican Army, which will conduct active guerrilla activities against the regime."
 UKR_separatist_battalions: "Atraer Batallones Separatistas"
 UKR_separatist_battalions_desc: "Not only Russians, but also other nations are ready to fight for freedom from Russian imperialism."
 UKR_interlegion_2: "Llamar al §Y2º Legión Internacional Georgiana§! al frente"
 UKR_interlegion_3: "Llamar al §YLegión Nacional Georgiana§! al frente"
 UKR_interlegion_5: "Llamar al §YBatallón en Honor a Khamzat Gelayev§! al frente"
 UKR_interlegion_7: "Llamar al §YBatallón en Honor al Imán Shamil§! al frente"
 UKR_interlegion_8: "Llamar al §YBrigada Canadiense-Ucraniana§! al frente"
 UKR_interlegion_11: "Llamar al §YBrigada Normanda§! al frente"
 UKR_interlegion_12: "Llamar al §YCuerpo de Voluntarios Polacos§! al frente"
 UKR_interlegion_13: "Llamar al §YBatallón Krym§! al frente"
 UKR_drone_army: "El Ejército de Drones"
 UKR_drone_army_desc: "We will start mass production of drones. The country needs thousands of drones."
 UKR_tck_mobka: "Movilización Total"
 UKR_tck_mobka_desc: "We are forced to carry out several waves of mobilization to replenish our armed forces."
 UKR_attack_guardia: "La Guardia Ofensiva"
 UKR_attack_guardia_desc: "¡Estamos listos para pasar de la defensa al ataque! ¡Ataquemos con guardia para derrotar al enemigo!"
 UKR_inter_legion_idea: "Legión Internacional"
 UKR_inter_legion_idea_desc: "Many foreigners from all over the world are ready to support us in our struggle for independence."
 UKR_air_superior_idea: "Tácticas de Dominio Aéreo"
 UKR_air_superior_idea_desc: "We strive to gain air superiority."
 UKR_inter_created_tt: "Se creará la §YLegión Internacional§! y podrás contratar batallones aliados de diferentes países"
 UKR_kraken_created_tt: "Se creará el §YBatallón Kraken§!"
 UKR_hur_other_battalions_created_tt: "Se crearán §YNuevos Batallones del HUR§!"
 UKR_free_russia_created_tt: "La §YLegión de la Libertad de Rusia§! estará disponible para operaciones especiales limitadas"
 UKR_rdk_created_tt: "El §YCuerpo de Voluntarios Rusos§! estará disponible para operaciones especiales limitadas"
 UKR_republican_army_created_tt: "Los §YBatallones Separatistas Regionales§! estarán disponibles para operaciones especiales"
 UKR_free_poland_created_tt: "La §YLegión de la Libertad de Polonia§! estará disponible para operaciones especiales limitadas"
 UKR_rushenie_created_tt: "El §YBatallón Pospolite Ruszenie§! estará disponible para operaciones especiales limitadas"
 UKR_rokossovski_created_tt: "El §YBatallón Rokossovsky§! estará disponible para operaciones especiales limitadas"
 UKR_hetmanat_created_tt: "El §YBatallón del Hetmanato Polaco§! estará disponible para operaciones especiales limitadas"
 UKR_polish_army_created_tt: "El §YEjército de Liberación Polaco§! estará disponible para operaciones especiales limitadas"
 ukraine_kolom.1.t: "Kolomoisky Anuncia la Creación de la República"
 ukraine_kolom.1.d: "Igor Kolomoisky, one of the richest oligarchs in Ukraine, announced the creation of the Dnipropetrovsk Republic as an autonomy within Ukraine.  This has caused a shock to our government and now we have to decide what to do about it."
 ukraine_kolom.1.a: "No Autonomía"
 ukraine_kolom.1.b: "Quizás Nos Beneficie"
 ukraine_kolom.2.t: "Nuestro Ejército"
 ukraine_kolom.2.d: "Those units that we personally funded have sided with us, now they are our main striking force."
 ukraine_kolom.2.a: "Por la Libertad del Dnieper!"
 UKR_recruit_arestovich: "Reclutar a Arestovich"
 UKR_recruit_arestovich_desc: "Arestovich will become an excellent agent of our special services, his outstanding skills will be useful to us."
 UKR_korchinsky_strategy: "Estrategia de Korchinsky"
 UKR_korchinsky_strategy_desc: "Korchinsky's strategy involves fighting Western elements as well...The fight against the external enemy that really threatens the sovereignty of Ukraine."
 UKR_psiop_operations: "Operaciones Psicológicas"
 UKR_psiop_operations_desc: "We have mastered the technique of psychological operations, and we are ready to use it against our enemies."
 UKR_bratstvo_psiop_idea: "Operaciones Psicológicas"
 UKR_bratstvo_psiop_idea_desc: "The enemy must also be broken mentally, for this we will conduct psyop operations."
 UKR_vitrenko_party: "El Nuevo Socialismo"
 UKR_vitrenko_party_desc: "Ucrania ha estado durante mucho tiempo bajo el influjo de sentimientos nacionalistas y pro-occidentales que están dividiendo el país en dos, les daremos a nuestros ciudadanos lo que buscan: estabilidad y prosperidad. Nuestro socialismo los hará felices."
 UKR_economic_orthodoxy: "Ortodoxia Económica"
 UKR_economic_orthodoxy_desc: "Nuestro país debe ser fuerte no solo económicamente, sino también espiritualmente, ¿por qué no combinar estas dos cosas?"
 UKR_install_christian_socialism: "Socialismo Cristiano"
 UKR_install_christian_socialism_desc: "We will not give up our socialist ideas, because we continue to believe in God, the ideologists of socialism led it to collapse because they distanced themselves from God, we will not repeat their mistakes."
 UKR_iron_woman: "Una Mujer de Acero"
 UKR_iron_woman_desc: "Natalia Vitrenko, like steel, protects the ideas that she sees as the only right ones for Ukraine and is not going to bend to anyone."
 UKR_resovetization: "Re-sovietización"
 UKR_resovetization_desc: "The Soviet era gave our country a development that it did not see under any government, not under the Tsar, not under the Poles, not under independence. We accept this fact and will promote the cult of Socialism."
 UKR_rally_out_the_coalition: "Coalición Nacional"
 UKR_rally_out_the_coalition_desc: "Supporters of completely different ideas, national Bolsheviks, supporters of the Russian Empire, socialism and Russophiles have united under the banners of our party, all together - we will turn our country into the best state in history."
 UKR_praymaya_electro_demokratia: "Democracia E-Directa"
 UKR_praymaya_electro_demokratia_desc: "We have had enough of dictatorship and totalitarianism, our people deserve democracy at its best."
 UKR_storm_sturm_at_parliament: "Asalto al Parlamento"
 UKR_storm_sturm_at_parliament_desc: "We will get rid of those who sabotage our activities in our government agencies."
 UKR_befriend_russia_vit: "Asociación con Rusia"
 UKR_befriend_russia_vit_desc: "Historically, we are connected with Russia and will always be connected with it - our partnership with Russia is something that should be obvious as the sunrise."
 UKR_apply_to_union_state: "Anunciar el Deseo de Unirse al Estado de la Unión"
 UKR_apply_to_union_state_desc: "The Union State is one of the first and most important stages of the unity of our united people, we intend to become part of this project."
 UKR_honor_russian_empire: "Respetar el Legado del Imperio Ruso"
 UKR_honor_russian_empire_desc: "The Russian Empire was a great power and it would be stupid and unfair to deny its achievements, we remember the greatness of the Romanovs."
 UKR_free_healthcare: "Atención Médica Gratuita"
 UKR_free_healthcare_desc: "Volveremos a la práctica soviética de atención médica gratuita, los ciudadanos deben estar sanos!"
 UKR_national_bolshevist_rhetoric: "Retórica Nacional Bolchevique"
 UKR_national_bolshevist_rhetoric_desc: "Our party also borrows many things from the program of the National Bolsheviks, with which we unanimously agree."
 UKR_russo_ukrainian_nationalism: "Nacionalismo Ruso-Ucraniano"
 UKR_russo_ukrainian_nationalism_desc: "Our peoples must always rise up and remember their greatness, we will actively support the nationalist movements of our countries."
 UKR_naz_pioners: "Pioneros Nacionales"
 UKR_naz_pioners_desc: "The pioneer was a great idea of the Soviet leadership, we will revive it, but with our special specifics."
 UKR_calm_ruthenia: "Declararse Herederos de Rutenia"
 UKR_calm_ruthenia_desc: "We believe that the legacy of Ancient Ruthenia should also not be forgotten! We will remind everyone that Ruthenia existed on these lands."
 UKR_proclaim_rus_ukraine: "Anunciar el Renacimiento de Rutenia"
 UKR_proclaim_rus_ukraine_desc: "Rutenia renace! Es hoy, aquí, en las tierras de Ucrania"
 UKR_federalize_galicia_and_zakarpat: "Federalización de Galicia"
 UKR_federalize_galicia_and_zakarpat_desc: "It's time to resolve the separatist issue in Galicia, only Federalization will save us."
 UKR_lnr_dnr_peace_integrate: "Federalización de Ucrania Oriental"
 UKR_lnr_dnr_peace_integrate_desc: "The mistakes committed by the previous government, now we must decide. We are ready for a federalization project to end the division of our country."
 UKR_suppress_western_and_bander: "Suprimir la Influencia Occidental"
 UKR_suppress_western_and_bander_desc: "The influence of the West should be purposefully weakened in our country."
 UKR_restore_russian_church: "Volver a la Iglesia Rusa"
 UKR_restore_russian_church_desc: "Autocephaly was a mistake, we have spiritually distanced ourselves from our brothers, and we do not intend to repeat such a mistake anymore."
 UKR_no_to_upc: "Disolver la Iglesia Ortodoxa Ucraniana"
 UKR_no_to_upc_desc: "Heretics must be disbanded."
 UKR_clear_out_pcu: "Limpiar la Iglesia"
 UKR_clear_out_pcu_desc: "The supporters of Autocephaly and all their sympathizers must be brought under our control."
 UKR_restore_apostolacy: "El Retorno de la Iglesia Ortodoxa Rusa"
 UKR_restore_apostolacy_desc: "La Iglesia Ortodoxa Rusa vuelve a dominar nuestras tierras!"
 UKR_full_socialism: "Énfasis en el Socialismo"
 UKR_full_socialism_desc: "Nos sumergiremos aún más en las doctrinas del socialismo y continuaremos implementándolas en nuestro país."
 UKR_install_true_soviet_folk: "Socialismo del Pueblo"
 UKR_install_true_soviet_folk_desc: "Haremos todo lo posible para que nuestros ciudadanos se sientan felices."
 UKR_appease_pro_russian_oligarchs: "Cooperar con Oligarcas Pro-Rusos"
 UKR_appease_pro_russian_oligarchs_desc: "Estamos listos para establecer cooperación con la oligarquía pro-rusa, porque sus inversiones fortalecerán nuestra economía."
 UKR_loyalist_oligarchy_ens: "Aceptar Oligarcas Leales"
 UKR_loyalist_oligarchy_ens_desc: "Los oligarcas leales también estarán de nuestro lado, asegurando así sus finanzas dentro del país."
 UKR_industrial_revival: "Renacimiento Industrial"
 UKR_industrial_revival_desc: "Nuestro país se quedó sin su poder industrial, después del colapso de la URSS, es hora de revivirlo."
 UKR_national_feminism: "Feminismo Nacional"
 UKR_national_feminism_desc: "Las mujeres también deben convertirse en el motor del crecimiento de nuestro país, y alentaremos su participación en todas las industrias."
 UKR_foreign_policy_det: "Nuestro Curso de Política Exterior"
 UKR_foreign_policy_det_desc: "Nuestro país debe decidir por sí mismo qué camino tomará en política exterior."
 UKR_fully_antagonize_the_west: "Antagonismo con Occidente"
 UKR_fully_antagonize_the_west_desc: "No tenemos intención de ser amigos de Occidente, porque sabemos que Occidente no tiene amigos, solo esclavos y sirvientes."
 UKR_ukr_sov_mil_coop: "Cooperación Militar con Rusia"
 UKR_ukr_sov_mil_coop_desc: "Llevaremos a cabo una serie de ejercicios militares con el ejército ruso."
 UKR_euroscepticism_campaign: "Fuerte Euroescepticismo"
 UKR_euroscepticism_campaign_desc: "Hemos sido y seguiremos siendo euroescépticos."
 UKR_join_csto: "Unirse a la OTSC"
 UKR_join_csto_desc: "Estamos listos para firmar un documento sobre la adhesión a la OTSC, solo Rusia puede darnos garantías de seguridad."
 UKR_reconcile_with_west: "Mejorar la Interacción con Occidente"
 UKR_reconcile_with_west_desc: "Tenemos la intención de mejorar la cooperación con los países occidentales."
 UKR_nato_ukr_train: "Ejercicios con países de la OTAN"
 UKR_nato_ukr_train_desc: "Promoveremos parcialmente la doctrina de la OTAN en nuestras fuerzas armadas y también llevaremos a cabo una serie de ejercicios con ellos."
 UKR_join_nato_with_russia: "Unirse a la OTAN con Rusia"
 UKR_join_nato_with_russia_desc: "Tenemos la intención de unirnos a la OTAN, pero solo junto con Rusia, y propondremos esta idea al gobierno ruso."
 UKR_full_nazbol_transition: "Renacimiento Nacional Bolchevique"
 UKR_full_nazbol_transition_desc: "Ha llegado el momento para la próxima etapa de desarrollo de nuestro país y de toda la familia eslava en general. Nos embarcamos en el camino de la unidad de los eslavos."
 UKR_serbia_unify: "La Revolución Nacional Bolchevique en [SER.GetName]"
 UKR_serbia_unify_desc: "Our brothers will finally be freed from the government that oppressed them as a Slavic nation!"
 UKR_bulgaria_unification: "La Revolución Nacional Bolchevique en [BUL.GetName]"
 UKR_bulgaria_unification_desc: "Our brothers will finally be freed from the government that oppressed them as a Slavic nation!"
 UKR_unification_with_belarus: "La Revolución Nacional Bolchevique en [BLR.GetName]"
 UKR_unification_with_belarus_desc: "Our brothers will finally be freed from the government that oppressed them as a Slavic nation!"
 UKR_poland_unification: "La Revolución Nacional Bolchevique en [POL.GetName]"
 UKR_poland_unification_desc: "Our brothers will finally be freed from the government that oppressed them as a Slavic nation!"
 UKR_demand_bosnia: "La Revolución Nacional Bolchevique en [BOS.GetName]"
 UKR_demand_bosnia_desc: "Our brothers will finally be freed from the government that oppressed them as a Slavic nation!"
 UKR_czech_unification: "La Revolución Nacional Bolchevique en [CZE.GetName]"
 UKR_czech_unification_desc: "Our brothers will finally be freed from the government that oppressed them as a Slavic nation!"
 UKR_demand_croatia_slovenia: "La Revolución Nacional Bolchevique en [CRO.GetName]"
 UKR_demand_croatia_slovenia_desc: "Our brothers will finally be freed from the government that oppressed them as a Slavic nation!"
 UKR_slovakia_unify: "La Revolución Nacional Bolchevique en [SLO.GetName]"
 UKR_slovakia_unify_desc: "Our brothers will finally be freed from the government that oppressed them as a Slavic nation!"
 UKR_propose_full_union_state: "Estado de la Unión Verdadero"
 UKR_propose_full_union_state_desc: "Es hora de que Rusia y nuestro país se conviertan en un verdadero Estado de la Unión!"
 UKR_pan_slavic_ssr: "Unión de Repúblicas Eslavas"
 UKR_pan_slavic_ssr_desc: "Finalmente, todos los eslavos se convertirán en uno!"
 UKR_vetrenko_surrort_nationalism: "Nacionalismo ruso-ucraniano"
 UKR_vetrenko_inner_idea: "Política Interna"
 UKR_vetrenko_inner_idea_desc: "We are ready to pursue a policy of independence from the West and a strong Ukraine, we have had enough of the dictatorship of Western capital."
 UKR_vetrenko_christian_socialism: "Socialismo Cristiano"
 UKR_vetrenko_christian_socialism_desc: "God and Socialism go hand in hand in Ukraine."
 UKR_vetrenko_west_idea: "Doctrina Antioccidental"
 UKR_vetrenko_west_idea_desc: "We do not hide the fact that the West is our ideological and direct enemy."
 UKR_vetrenko_pioneria: "Pionero Nacional"
 UKR_vetrenko_women_idea: "Feminismo Nacional"
 UKR_vetrenko_women_idea_desc: "The women of Ukraine will build a great state hand in hand with men."
 UKR_vetrenko_iron_woman: "Mujer de Hierro Ucraniana"
 UKR_vetrenko_iron_woman_desc: "Vitrenko became our equivalent of Margaret Thatcher."
 UKR_vetrenko_health_free_idea: "Atención Médica Gratuita"
 ukraine_nazbol.1.t: "¿Lanzar una invasión de [FROM.GetName]?"
 ukraine_nazbol.1.d: "We were able to raise an uprising in this country, but now we need to decide whether we are ready to bring it to an end and admit that the revolution is our doing."
 ukraine_nazbol.1.a: "Sí"
 ukraine_nazbol.1.b: "No"
 ukraine_nazbol.2.t: ""
 ukraine_nazbol.2.d: ""
 ukraine_nazbol.2.a: ""
 ukraine_nazbol.3.t: "La Revolución Nacional Bolchevique!"
 ukraine_nazbol.3.d: "Unexpectedly for us, a revolution took place in our country under the banner of the national Bolsheviks! We urgently raised the army and all armed forces to fight the separatists. We know that they are controlled by [UKR.GetName] and intend to deal with this in the future."
 ukraine_nazbol.3.a: "De repente"
 ukraine_nazbol.4.t: "[FROM.GetName] Alaba el Legado del Imperio Ruso"
 ukraine_nazbol.4.d: "The government of Ukraine directly at the state level announces the glorification of the past and heritage of the Russian Empire, we should respond to this gesture in any way."
 ukraine_nazbol.4.a: "Nosotros también estamos orgullosos"
 ukraine_nazbol.4.b: "Estamos condenando esto"
 ukraine_nazbol.5.t: "[FROM.GetName] se Solidariza con Nosotros"
 ukraine_nazbol.5.d: "[FROM.GetName] stands in solidarity with us on the issue of the legacy of the Russian Empire and is ready to support us at the diplomatic level on this issue."
 ukraine_nazbol.5.a: "Eso es genial!"
 ukraine_nazbol.6.t: "[FROM.GetName] Nos Condena"
 ukraine_nazbol.6.d: "[FROM.GetName] condemns the fact that we do not condemn Imperial ambitions, never an undemocratic State, The New Russia will always profess the ideals of peaceful cooperation and not expansion."
 ukraine_nazbol.6.a: "Cobardes"
 UKR_vitrenko_power: "Vitrenko se Convirtió en Nacional Bolchevique"
 anti_westi: "Odio a Occidente"
 UKR_donbass_rise: "El levantamiento en el sureste ha ocurrido"
 UKR_polish_liberation_battalions: "El Ejército de Liberación Polaco"
 UKR_polish_liberation_battalions_desc: "Many Polish residents are ready to fight on our side, against the government that, in their opinion, occupied the country."
 UKR_economy_shortcut: "Economics"
 UKR_security_and_expansion_shortcut: "Security and Expansion"
 UKR_military_shortcut: "Military"
 UKR_politics_shortcut: "Politics"
 UKR_fedrada_category: "Federal Rada"
 UKR_fedrada_category_desc: "The Federal Rada is a government body in Federalized Ukraine, created for the interaction of the subjects of the Federation with the federal center.\n\n§YSubjects of the Ukrainian Federation§! may be §Gannexed§! by [UKR.GetFlag]Ukraine, but subject to §Yinfluence§! on the subjects in the §Yamount of 50%§!"
 ukraine_maidan_east.4.b: "Have the deputies escorted away"
 UKR_maidan_temporary_attack_idea_desc: "The unrest in the streets energizes military forces, temporarily bolstering combat readiness."
 ukraine_maidan_overthrow.1.t: "Government overthrown"
 ukraine_maidan_overthrow.1.d: "Our government has been overthrown. The protesters' candidate has been put into power.\nHis outlook is:"
 ukraine_maidan_overthrow.1.a: "£democratic_group_small   $democratic$"
 ukraine_maidan_overthrow.1.b: "£communism_group_small   $communism$"
 ukraine_maidan_overthrow.1.c: "£neutrality_group_small   $neutrality$"
 ukraine_maidan_overthrow.1.e: "£nationalist_group_small   $nationalist$"
 ukraine_maidan_overthrow.2.t: "Government overthrown - A new president"
 ukraine_maidan_overthrow.2.d: "The protesters' candidate has been put into power. His party is:"
 ukraine_maidan_overthrow.2.e: "Back to outlook menu"
 ukraine_maidan_crm_annex.1.t: "The annexation of Crimea"
 ukraine_maidan_crm_annex.1.d: "The crimean peninsula has been annexed by Russia. What should we do next?"
 ukraine_maidan_crm_annex.1.a: "We will stand down for now"
 ukraine_maidan_crm_annex.1.b: "We will fight for Crimea"
 UKR_idea_government_in_need_desc: "Ukraine's government is plagued by rampant corruption and inefficiency. Administrative costs are doubled by graft, while poor governance drags down industrial productivity and political capacity."
 UKR_modernization: "Ukrainian Modernization"
 UKR_modernization_desc: "Once the economy and the state have stabilised, we need to modernize our economy. Before it is too late."
 UKR_agriculture: "Modernize Agriculture"
 UKR_agriculture_desc: "Ukraine is one of the world's largest agricultural producers and exporters and is known as the breadbasket of Europe. Because Ukraine possesses 30% of the world's richest black soil, its agricultural industry has a huge potential. With some investment, these potentials could be exploited. "
 UKR_nibulon: "Nibulon"
 UKR_nibulon_desc: "Nibulon is a Ukrainian agricultural company specializing in production and export of grains such as wheat, barley and corn. It is headquartered in Mykolaiv. It is the only agricultural company in Ukraine with its own fleet and shipyard."
 UKR_pr_jsc_mhp: "PrJSC MHP"
 UKR_pr_jsc_mhp_desc: "PrJSC MHP, Myronivsky Hliboproduct, is Ukraine's largest poultry producer and one of its biggest agro-industrial holdings. State support for its expansion will grow our food processing industry and rural employment."
 UKR_fozzy: "Fozzy Group"
 UKR_fozzy_desc: "Fozzy Group, LLC is one of the largest trade and industrial groups in Ukraine, based in Kyiv, and one of the leading Ukrainian retailers with more than 700 outlets all around the country. In addition to retail, it has business interests in food manufacturing, banking, IT, logistics and restaurants. "
 UKR_fin_it: "Modernize Economy"
 UKR_fin_it_desc: "Instruct the relevant ministries to help modernize our private sector, particularly the finance and IT. "
 UKR_privatbank: "Privatbank"
 UKR_privatbank_desc: "PrivatBank is the largest Ukrainian bank in terms of assets and the leader of Ukrainian retail banking market. It was registered on 19 March 1992. The state must step in for future profits. "
 UKR_it: "Establish Ukrainian IT industry"
 UKR_it_desc: "While the IT sector is growing in our nation, it might need some investments to keep like that. "
 UKR_it_2: "Expand Ukrainian IT industry"
 UKR_it_2_desc: "It seems that our IT industry can be a key factor in our economy. With the help of well-placed investments, of course."
 UKR_ukrtelekom: "Ukrtelecom"
 UKR_ukrtelekom_desc: "The state-owned Ukrtelecom will help us to expand our network capacity faster."
 UKR_kyivstar: "Kyivstar"
 UKR_kyivstar_desc: "Kyivstar is one of the largest Ukrainian telecommunications company, providing communication services and data transmission based on a broad range of fixed and mobile technologies, including 4G (LTE) services, in Ukraine. "
 UKR_digital_education: "Digital Education"
 UKR_digital_education_desc: "Digital skills are vital for individuals in the 21st century. Investing in both digital education and digitalizing the education will pay off over time. We must not forget the older generations, their education is an investment in the present."
 UKR_dig_sta: "Ukrainian Digital State"
 UKR_dig_sta_desc: "Diia (Ukrainian: Дія, lit.'Action'; also an acronym for Ukrainian: Держава і Я, lit.'State and Me') is a mobile app, a web portal and a brand of e-governance in Ukraine. Launched in 2020, the Diia app allows Ukrainian citizens to use digital documents on their smartphones instead of physical ones for identification and sharing purposes.\n\nThe Diia portal allows access to over 50 government services. Eventually, the government plans to make all kinds of state-person interactions available through Diia."
 UKR_tax_avoidance: "Resolve the Tax Evasion Problem"
 UKR_tax_avoidance_desc: "We now have the tools to tackle a huge global problem locally: tax avoidance for both companies and individuals. \n\"While tax may be overlooked, and even unloved, in reality it is our social superpower. Tax allows us to choose to organise our communities, at the local and national level, so that we can all live better lives, together. But a fundamental obstacle is the ease with which powerful elites step outside of their social obligations - outside of their responsibilities to the societies they are part of, and from which they profit.\" - Report on Tax Justice 2023"
 UKR_energy: "Ukraine Energy Strategy"
 UKR_energy_desc: "It's time to analyse the potential for improving the nation's electricity supply systems and launch a residential energy modernization program."
 UKR_ukrenergo: "Ukrenergo"
 UKR_ukrenergo_desc: "Ukrenergo is an electricity transmission system operator in Ukraine and the sole operator of the country's high-voltage transmission lines. The company can make the entire grid system even more efficient."
 UKR_nuc_ener: "Energoatom"
 UKR_nuc_ener_desc: "Energoatom is a state enterprise operating all four nuclear power plants in Ukraine (Zaporizhzhia NPP, Rivne NPP, South Ukraine NPP, and Khmelnytskyi NPP). It is the largest power producer in Ukraine. "
 UKR_nuc_ener_2: "Expand Nuclear Capacity"
 UKR_nuc_ener_2_desc: "Based on a contract with Westinghouse, the American company will build two new blocks in the Khmelnytskyi NPP and two more in the revitalized and finally built Chyhyryn Nuclear Power Plant in Cherkasy."
 UKR_green_ener: "Green Energy Strategy"
 UKR_green_ener_desc: "After promoting the use of renewable energy, we need to look at our potential in the non-nuclear field."
 UKR_ukrhydroenergo: "Ukrhydroenergo"
 UKR_ukrhydroenergo_desc: "Ukrhydroenergo is a Ukrainian state-owned enterprise that administers many major hydro power plants along the Dnieper and Dniester rivers. It is Ukraine's main hydropower generating company."
 UKR_solar: "Construct Solar Plants"
 UKR_solar_desc: "Our southern regions are amongst the sunniest in Eastern Europe, therefore most suitable for solar plant construction."
 UKR_wind: "Promote Wind Farms"
 UKR_wind_desc: "There are places in our country that are suitable for high-efficiency power generation with wind turbines."
 UKR_biomass: "Invest in Biomass Plants"
 UKR_biomass_desc: "Seeing the success of private investments Biomass Plants, the state have to provide funds to build such facilities."
 UKR_min_env_prot: "Ministry of Environmental Protection of Ukraine"
 UKR_min_env_prot_desc: "The Ministry is the main authority in the system of central government of Ukraine responsible for ecological monitoring and development of the country. One of the main task is to develop the communal waste disposal system."
 UKR_waste_manangement_2: "Establish Recycling System"
 UKR_waste_manangement_2_desc: "Now the communal waste collection was finally resolved, it was time to lay the foundations and establish the system of the recyclable material collection. It needed lot of time and effort, but the effects are already visible."
 UKR_waste_manangement_3: "Modernizing Waste Management System"
 UKR_waste_manangement_3_desc: "The established system must be made more efficient and have to reach even the most remote corners of the country. Modern waste management will benefit everyone, both the public and the environment."
 UKR_forestry: "Control Ukrainian Forestry"
 UKR_forestry_desc: "Almost 20% of the country covered by forests. To keep it like this and avoid deforestation we must invest in forestry as an invest in the future."
 UKR_tourism: "Invest in Tourism"
 UKR_tourism_desc: "Tourism can be a great opportunity for any country. First of all, the right infrastructure needs to be put in place. "
 UKR_nat_wonders: "Ukrainian Natural Wonders"
 UKR_nat_wonders_desc: "In 2008, seven of Ukraine's many picturesque places were selected in a vote. These sites will be the flag bearers of our country's diverse landscapes."
 UKR_wonders: "Ukrainian Wonders"
 UKR_wonders_desc: "Seven of Ukraine's many historical and cultural monuments were selected in a vote in 2007. These sites will be the flag bearers of our country's built heritage."
 UKR_world_heritage: "Ukrainian World Heritage Sites"
 UKR_world_heritage_desc: "By 2005, there are three World Heritage sites in Ukraine, but the list will grow by time, already several sites on its tentative list.\n\nCultural heritage consists of monuments (such as architectural works, monumental sculptures, or inscriptions), groups of buildings, and sites (including archaeological sites). Natural heritage is defined as natural features (consisting of physical and biological formations), geological and physiographical formations (including habitats of threatened species of animals and plants), and natural sites which are important from the point of view of science, conservation or natural beauty."
 UKR_health_tourism: "Promote Ukrainian Health Tourism"
 UKR_health_tourism_desc: "As the country's health services are up to Western standards, but generally at a cheaper price, it can be beneficial to invest in the health tourism sector."
 UKR_corruption_reforms: "Anti-Corruption Reforms"
 UKR_corruption_reforms_desc: "Corruption is an issue in Ukrainian society going back to the dissolution of the Soviet Union in 1991. After declaring independence from the Soviet Union, Ukraine faced a series of politicians from different sides of the political spectrum, as well as criminal bosses and oligarchs, who used the corruption of police, political parties, and industry to gain power.\n\nIt is time to change this!"
 UKR_corruption_edu: "Fight Corruption in Education"
 UKR_corruption_edu_desc: "According to Transparency International research done in 2008, 47.3% of university students stated that a bribe had been demanded from them; of those, 29% had paid this bribe freely. Students could \"buy\" a college entry, exam results, marking doctoral and/or master's theses."
 UKR_corruption_health: "Fight Corruption in Healthcare"
 UKR_corruption_health_desc: "Though medical care in state-run hospitals is theoretically free for Ukrainians, patients' paying money there to ensure they receive the treatment required was widespread in the early 21st century.\n\nIn 2012 advocacy groups accused Health Ministry officials of embezzling money that should have been used to treat AIDS patients by buying AIDS drugs at hugely inflated prices and then receiving kickbacks."
 UKR_corruption_police: "Fight Corruption in the Police"
 UKR_corruption_police_desc: "Combat corruption within Ukraine's law enforcement agencies to restore public trust and effective policing."
 UKR_corruption_armed_forces: "Fight Corruption in the Armed Forces of Ukraine"
 UKR_corruption_armed_forces_desc: "Purge corruption from the Armed Forces to improve military discipline and effectiveness."
 UKR_corruption_justice: "Fight Judicial Corruption"
 UKR_corruption_justice_desc: "In the early 2010s Ukrainian politicians and analysts described the system of justice in Ukraine as \"rotten to the core\" and complained about political pressure put on judges and corruption. Independent lawyers and human rights activists complained Ukrainian judges regularly came under pressure to hand down a certain verdict.\n\nUkraine's court system was widely regarded as corrupt. A Ukrainian Justice Ministry survey in 2009 revealed that only 10% of respondents trusted the nation's court system."
 UKR_corruption_spec_public_prosecutor: "Specialized Anti-Corruption Prosecutor's Office"
 UKR_corruption_spec_public_prosecutor_desc: "The Specialized Anti-Corruption Prosecutor's Office is an independent structural unit of the General Prosecutor of Ukraine, and is primarily responsible for supporting and overseeing criminal investigations launched by the National Anti-Corruption Bureau of Ukraine (NABU)."
 UKR_corruption_court: "High Anti-Corruption Court of Ukraine"
 UKR_corruption_court_desc: "Establish an independent anti-corruption court to prosecute high-level corruption cases and recover stolen state assets."
 UKR_corruption_asset_rec: "Asset Recovery"
 UKR_corruption_asset_rec_desc: "Asset recovery, as outlined in the UN Convention against Corruption (UNCAC chapter V), refers to the process by which the proceeds of corruption transferred abroad are recovered and repatriated to the country from which they were taken or to their rightful owners."
 UKR_corruption_gov: "Cleanse Country Government"
 UKR_corruption_gov_desc: "Institute sweeping reforms to eliminate corruption within the government administration and restore institutional integrity."
 UKR_end_kleptokracy: "Finalize Anti-Corruption reforms"
 UKR_end_kleptokracy_desc: "With all these reforms made, the size of the corruption can be easily reduced and the society will be able to live without its suffocating effects."
 UKR_health_reform: "Start Healthcare Reforms"
 UKR_health_reform_desc: "Ukrainian healthcare should be free to citizens according to law, but in practice patients contribute to the cost of most aspects of healthcare."
 UKR_health_smoke_alc: "Decrease Smoking and Alcohol consumption"
 UKR_health_smoke_alc_desc: "Launch public health campaigns to reduce smoking and alcohol consumption, addressing leading causes of preventable disease."
 UKR_hiv_aids: "HIV/AIDS in Ukraine"
 UKR_hiv_aids_desc: "In 2001, a national plan for combating HIV/AIDS was approved; its goals included preventing the further spread of HIV, developing the capacity to treat infected individuals, and providing social support and counseling for those living with HIV/AIDS."
 UKR_vaccination: "Vaccination Program"
 UKR_vaccination_desc: "Expand vaccination programs nationwide to prevent infectious disease outbreaks and improve population immunity."
 UKR_mental_health: "Mental Health Program"
 UKR_mental_health_desc: "Develop mental health services and support systems to address rising psychological disorders in the population."
 UKR_health_infra: "Healthcare Infrastructure Improvement"
 UKR_health_infra_desc: "Modernize and expand healthcare infrastructure, upgrading medical facilities across the nation."
 UKR_health_equipment: "Medical Equipment Purchasing Program"
 UKR_health_equipment_desc: "Procure modern medical equipment and diagnostic tools to enhance healthcare delivery and treatment capabilities."
 UKR_health_prevention: "Medical Screening Program"
 UKR_health_prevention_desc: "Establish comprehensive medical screening programs to detect health conditions early and improve preventive care."
 UKR_health_rehabilitaion: "National Rehabilitation Program"
 UKR_health_rehabilitaion_desc: "Develop rehabilitation facilities for injured and disabled citizens, including military personnel, to restore quality of life."
 UKR_health_recreational_infra: "Improve Recreational Infrastructure"
 UKR_health_recreational_infra_desc: "Invest in recreational facilities and public spaces to promote physical activity and improve public health."
 UKR_health_final: "Finishing Healthcare Reforms"
 UKR_health_final_desc: "Complete the healthcare transformation to achieve Western standards of medical care and population health outcomes."
 UKR_edu_plan: "Plan Educational Reforms"
 UKR_edu_plan_desc: "Although the education in our nation is of relatively high quality, there are areas to improve in order to maintain or raise that quality. We have to prepare for the ongoing digital transformation in the world."
 UKR_edu_infra: "Improve Educational Infrastructure"
 UKR_edu_infra_desc: "Upgrade educational facilities and school buildings to create modern learning environments."
 UKR_edu_ped_uni: "Support Pedagogical Universities"
 UKR_edu_ped_uni_desc: "Strengthen pedagogical universities to improve teacher training and quality of instruction nationwide."
 UKR_edu_universities: "Support the Universities"
 UKR_edu_universities_desc: "Provide additional resources and support to higher education institutions to strengthen academic research and innovation."
 UKR_edu_infra_2: "Improve Educational Infrastructure: Next Level"
 UKR_edu_infra_2_desc: "Continue upgrading educational facilities with modern technology and advanced learning infrastructure."
 UKR_edu_final: "Finalize Educational Reforms"
 UKR_edu_final_desc: "Complete the educational transformation to achieve world-class standards of learning and scientific advancement."
 UKR_bmz: "BMZ"
 UKR_bmz_desc: "Berdychiv Machine-Building Plant (also known as the Progress Plant) is a machine building enterprise in the town of Berdychiv, in Zhytomyr Oblast, Ukraine."
 UKR_nkmz: "NKMZ"
 UKR_nkmz_desc: "Novokramatorsky Mashynobudivny Zavod (New Kramatorsk Machinebuilding Plant) is a large heavy equipment manufacturer in Ukraine. The company produces mining equipment; metallurgy equipment; rolling mills, forges, blast furnaces, ore crushers, presses, and other industrial process equipment.\n\nThe company manufactures propeller shafts for icebreakers and components for submarines. According to its website, the company has designed and constructed over 18 mining complexes."
 UKR_oil_mining: "Oil Mining"
 UKR_oil_mining_desc: "Develop new oil extraction facilities to increase domestic energy production and reduce dependence on foreign supplies."
 UKR_mining2: "Improved resource extraction"
 UKR_mining2_desc: "Expand mining operations to increase extraction of chromium, tungsten, and other strategic minerals."
 UKR_construction_kovalska: "Kovalska"
 UKR_construction_kovalska_desc: "ICG Kovalska, LLC is a Ukrainian developer and manufacturer of building materials.\n\nProducing: concrete, concrete mixes, building solutions, classical reinforced concrete individual constructive reinforced concrete products, wall products from expanded clay concrete, aerated concrete, paving slabs, dry construction mixes, water-dispersion materials (paints, decorative plasters, foams, glues)."
 UKR_train_prod: "Train Production"
 UKR_train_prod_desc: "Kriukiv Railway Car Manufacturing Plant is a large industrial company in Kremenchuk, Ukraine, manufacturing locomotives and multiple unit trains."
 UKR_kharkiv_tractor: "HTZ"
 UKR_kharkiv_tractor_desc: "Kharkiv Tractor Plant (KhTZ or HTZ) is an agricultural machinery manufacturer in the Ukrainian city of Kharkiv. Established in 1930-31, as a centerpiece of Stalin's First Five-Year Plan for Soviet industrialization (1927-32), KhTZ was Ukraine's largest tractor manufacturer, producing both wheeled and tracked tractors.\n\nIn 1994, two years after the collapse of the Soviet Union and the independence of Ukraine, the plant was transformed into an open joint stock company. Producing tractors, including general purpose wheeled tractors."
 UKR_agriculture2: "Modernize Agriculture: Next Level"
 UKR_agriculture2_desc: "Implement advanced agricultural techniques and expand grain production to cement Ukraine's position as a global food supplier."
 UKR_chumak: "Chumak"
 UKR_chumak_desc: "Chumak (Ukrainian: Чумак) is a Swedish-Ukrainian food processing company in Kakhovka, Kherson Oblast. Among its products are ketchup, mayonnaise, pasta, salad dressings, cooking sauces, canned vegetables, marinated vegetables, tomato juice and sunflower oil."
 UKR_gsc_game_world: "GSC"
 UKR_gsc_game_world_desc: "GSC Game World is a Ukrainian video game developer company.  Founded in Kyiv in 1995 by Sergiy Grygorovych, it is best known for the Cossacks and S.T.A.L.K.E.R. series of games."
 UKR_national_bank: "National Bank of Ukraine"
 UKR_national_bank_desc: "According to the Constitution of Ukraine, the main function of the National Bank of Ukraine (NBU) is to ensure the stability of Ukraine's monetary unit (the hryvnia). To carry this out, the National Bank fosters the stability of the banking system and, within its competence, price stability."
 UKR_darnytsia: "Darnytsia"
 UKR_darnytsia_desc: "Darnytsia is a Ukrainian pharmaceutical company."
 UKR_farmak: "Farmak"
 UKR_farmak_desc: "JSC Farmak is a Ukrainian pharmaceutical company. The company was established in 1925. The headquarters is located in Kyiv."
 UKR_carpathian_tourism: "Promote tourism in the Carpathian mountains"
 UKR_carpathian_tourism_desc: "Develop tourism infrastructure in the Carpathian Mountains to attract international visitors and generate economic revenue."
 UKR_black_sea_tourism: "Promote tourism near the Black Sea"
 UKR_black_sea_tourism_desc: "Expand resort infrastructure along the Black Sea coast to establish Ukraine as a premier seaside destination."
 UKR_infra_rail: "Railroad Improvements"
 UKR_infra_rail_desc: "Modernize the national railway network to improve freight transport and passenger connectivity."
 UKR_infra_rail_2: "Railroad Improvements: Next Level"
 UKR_infra_rail_2_desc: "Complete comprehensive railway expansion and renewal to establish a world-class transport infrastructure."
 UKR_infra_southern_bug: "Make the Southern Bug Navigable"
 UKR_infra_southern_bug_desc: "Revive commercial freight navigation on the Southern Bug upstream of Mykolaiv, to facilitate the increasing grain export from Ukraine."
 UKR_pivdenne_db: "Pivdenne Design Bureau"
 UKR_pivdenne_db_desc: "Pivdenne Design Office located in Dnipro, Ukraine, is a designer of satellites and rockets, and formerly of Soviet intercontinental ballistic missiles (ICBMs)."
 UKR_luch: "Luch Design Bureau"
 UKR_luch_desc: "Expand Luch Design Bureau's capabilities in cruise missile and advanced weapons technology development."
 UKR_mayak: "Mayak"
 UKR_mayak_desc: "Modernize Mayak's small arms production facilities to supply the armed forces with contemporary infantry weapons."
 UKR_ukrainian_armor: "Ukrainian Armor"
 UKR_ukrainian_armor_desc: "Develop advanced body armor and protective equipment technology for military personnel."
 UKR_large_construction1: "Large Construction Program"
 UKR_large_construction1_desc: "Launch an ambitious construction initiative to expand urban infrastructure and economic capacity nationwide."
 UKR_large_construction2: "Large Construction, Second Phase"
 UKR_large_construction2_desc: "Continue the construction boom with extended programs to sustain development momentum and employment."
 UKR_tax_reform: "Tax Reform"
 UKR_tax_reform_desc: "Restructure the tax system to increase revenue collection and modernize fiscal administration."
 UKR_pension_reform: "Pension Reform"
 UKR_pension_reform_desc: "Implement comprehensive pension system reform to ensure long-term sustainability and adequate retirement security."
 UKR_min_economy: "Ministry of Economy"
 UKR_min_economy_desc: "Strengthen the Ministry of Economy to promote market liberalization and reduce government control of the economy."
 UKR_cut_energy_subs: "Cut Energy Subsidies"
 UKR_cut_energy_subs_desc: "Eliminate inefficient energy subsidies to balance the budget and encourage energy efficiency."
 UKR_state_fund: "State Fund"
 UKR_state_fund_desc: "Establish a sovereign wealth fund to invest budget surpluses in development projects and international assets."
 UKR_air_improvements: "Air Force Improvements"
 UKR_air_improvements_desc: "Modernize the Air Force with better training, equipment, and operational doctrine."
 UKR_aa_mis_def_force: "Anti-Air Missile Defence Force"
 UKR_aa_mis_def_force_desc: "Establish specialized anti-air missile defense formations to protect airspace from aerial threats."
 UKR_radio_eng: "Radio Engineering Force"
 UKR_radio_eng_desc: "Develop radio engineering and electronic warfare capabilities for advanced military communications."
 UKR_support_fac: "Support Facilities"
 UKR_support_fac_desc: "Expand airbase support infrastructure to enhance air operations and aircraft maintenance capabilities."
 UKR_army_imp: "Army Improvements"
 UKR_army_imp_desc: "Strengthen the Army with improved training, doctrine, and professional military development."
 UKR_army_aviation: "Army Aviation"
 UKR_army_aviation_desc: "Develop army aviation capabilities with rotary-wing aircraft for transport, reconnaissance, and close support."
 UKR_army_logistics: "Army Logistics"
 UKR_army_logistics_desc: "Enhance Army logistics and supply chain systems to support operations and improve field effectiveness."
 UKR_army_maintenance: "Army Maintenance Facilities"
 UKR_army_maintenance_desc: "Establish comprehensive equipment maintenance and repair facilities to maximize military hardware availability."
 UKR_medical_forces: "Medical Forces"
 UKR_medical_forces_desc: "Establish military medical commands with advanced field hospital and trauma care capabilities."
 UKR_antonov: "Antonov"
 UKR_antonov_desc: "Expand Antonov's aircraft manufacturing capabilities to produce modern transport and cargo aircraft."
 UKR_idea_pro_ukraine_reform_1_desc: "Anti-corruption government reforms reduce waste and inefficiency, restoring public confidence despite initial transition costs."
 UKR_idea_shortened_general_staff_desc: "Streamlining the military command structure improves planning efficiency and accelerates officer development."
 UKR_uda_encouraged: "Encouraged UDA"
 UKR_uda_encouraged_desc: "Incorporation of the UDA militia into the armed forces improves combat capability but reduces military discipline."
 UKR_uda_integrated: "Integrated UDA"
 UKR_uda_integrated_desc: "The Ukrainian Volunteer Army has been fully integrated into the regular armed forces, strengthening discipline and nationalist sentiment."
 UKR_ukrtelekom_idea: "Ukrtelecom"
 UKR_ukrtelekom_idea_desc: "Ukrtelecom, the state telecommunications monopoly, has been modernized to expand digital infrastructure and boost productivity."
 UKR_finance_and_it: "Finance & IT Sector Support"
 UKR_finance_and_it_desc: "Development of finance and information technology sectors creates high-value economic activity and improves research capabilities."
 UKR_digital_state: "Ukrainian Digital State"
 UKR_digital_state_desc: "Diia (Ukrainian: Дія, lit.'Action'; also an acronym for Ukrainian: Держава і Я, lit.'State and Me') is a mobile app, a web portal and a brand of e-governance in Ukraine. Launched in 2020, the Diia app allows Ukrainian citizens to use digital documents on their smartphones instead of physical ones for identification and sharing purposes.\n\nThe Diia portal allows access to over 50 government services. Eventually, the government plans to make all kinds of state-person interactions available through Diia."
 UKR_tax_avoidance_idea: "Negligible Tax Avoidance"
 UKR_tax_avoidance_idea_desc: "While tax may be overlooked, and even unloved, in reality it is our social superpower. Tax allows us to choose to organise our communities, at the local and national level, so that we can all live better lives, together.\n\nBut a fundamental obstacle is the ease with which powerful elites step outside of their social obligations - outside of their responsibilities to the societies they are part of, and from which they profit. - Report on Tax Justice 2023"
 UKR_nuclear_energy: "Energoatom"
 UKR_nuclear_energy_desc: "Investment in nuclear power plants increases domestic energy generation and reactor construction output."
 UKR_construction: "Construction Effort"
 UKR_construction_desc: "Construction capacities allocated to urgent State-financed projects."
 UKR_demographic_boom: "Demographic Boom"
 UKR_demographic_boom_desc: "Favorable demographic trends and population growth policies expand our available manpower and workforce."
 UKR_demographic_crisis: "Demographic Crisis"
 UKR_demographic_crisis_desc: "The country's population has been declining since the 1990s because of a high emigration rate, coupled with high death rates and low birth rates. The population has been shrinking by an average of over 300,000 annually since 1993."
 UKR_tackle_corruption: "Tackle Corruption!"
 UKR_tackle_corruption_desc: "Anti-corruption campaign and institutional reforms dramatically improve government efficiency and national productivity."
 UKR_corruption: "Deep-rooted Corruption"
 UKR_large_construction: "Large Construction Program"
 UKR_large_construction_desc: "An ambitious infrastructure development program accelerates building completion and productivity, though energy consumption increases significantly."
 UKR_medical_reform: "Medical Reform"
 UKR_medical_reform_desc: ""
 UKR_aamdf: "Anti-Air Missile Forces"
 UKR_aamdf_desc: "An organized anti-aircraft missile defense force significantly strengthens our air defense capability and reduces effectiveness of enemy close air support."
 UKR_radio_troops: "Radio Engineering Troops"
 UKR_radio_troops_desc: "Air force radio engineering and signals units enhance reconnaissance and interception while reducing aircraft losses."
 UKR_air_support_fac: "Air Force Support Facilities"
 UKR_air_support_fac_desc: "Investment in air support facilities improves fuel efficiency and aircraft reliability, reducing operational costs while enhancing performance."
 UKR_cut_subsidies: "Cut Energy Subsidies"
 UKR_cut_subsidies_desc: "Eliminating energy subsidies forces consumers to bear true production costs, improving productivity while reducing fiscal strain."
 UKR_health_cost: "Healthier Nation!"
 UKR_health_cost_desc: ""
 UKR_military_rehab: "Rehabilitation System for the Military"
 UKR_military_rehab_desc: "Veteran rehabilitation programs boost troop morale and organizational cohesion, though at increased healthcare expense."
 UKR_resource_extraction: "Increased Resource Extraction"
 UKR_resource_extraction_desc: "Expanded resource extraction operations increase domestic supply of minerals and fuels."
 UKR_research_boost: "Ukraine Research Support Program"
 UKR_research_boost_desc: "Centralized research support program accelerates technological development across military and civilian sectors."
 UKR_economy_boost: "Improvements in the Economy"
 UKR_economy_boost_desc: "A temporary economic stimulus program accelerates productivity and factory efficiency, though at increased energy cost."
 UKR_kolomoisky_help: "Help From Kolomoisky"
 UKR_kolomoisky_help_desc: "The well-known oligarch Kolomoisky approached us with a proposal to finance the creation of several battalions to maintain the combat capability of our armed forces."
 UKR_kolomoisky_finish: "Dnipro-1 Police Regiment"
 UKR_kolomoisky_finish_desc: "The last thing Kolomoisky volunteered to finance was the re-formation of the Dnepropetrovsk Defense regiment into a police regiment."
 UKR_uda: "Ukrainian Volunteer Army"
 UKR_uda_desc: "It is necessary to organize volunteers into a single military group."
 UKR_aidar: "Create Battalion Aidar"
 UKR_aidar_desc: "Let's take a chance and let them join the ranks of our armed forces."
 UKR_russia_help_battalions_desc: "Deployment of Russian Rosgvardia and Wagner units improves security and counterinsurgency operations during occupation."
 UKR_economy: "Economic Policy"
 UKR_economy_desc: "\n\n\n\n\n\n£GFX_UKR_desctext_economy\n\n\n\n\n\n\n\n\nThe §5Ministry for Development of Economy and Trade§! is the main authority in the system of central government of §8Ukraine§! responsible for formation and realization of state economic and social development policies (business economics); regulation of consumer prices; industrial, investment and trade economic policies; development of entrepreneurship; technical regulation and security of consumer rights; inter-agency coordination of economic and social cooperation of §8Ukraine§! with the §8European Union§!."
 UKR_boost_economy: "Boost Economy"
 UKR_boost_research: "Support Research Efforts"
 UKR_boost_resource: "Subsidize Resource Extraction"
 UKR_add_resource: "Dig Deep"
 UKR_renewable_energy: "Ukraine's Renewable Energy Potential Assessment"
 UKR_renewable_energy_desc: "\n\n\n\n\n\n£GFX_UKR_energy_ukraine\n\n\n\n\n\n\n\n\nMapping the regions with the best renewable energy production potential."
 UKR_energy_wind: "Wind Energy"
 UKR_energy_solar: "Solar Power"
 UKR_energy_geothermal: "Geothermal Energy"
 UKR_privatize_resource: "Privatization in the Resource Extracting Industry"
 UKR_privatize_resource_desc: "Privatization of resource extraction industries reduces state control and resource availability."
 UKR_restructure_debt: "Ask for debt restructuring"
 UKR_ask_western_loans: "Ask §7Western Countries§! for loans"
 UKR_ask_eastern_loans: "Ask §tEastern Countries§! for loans"
 UKR_natpolice_decision_category: "Patrol Service of the Special Purpose Police"
 UKR_natpolice_decision_category_desc: "The Patrol Service of the Special Purpose Police of Ukraine is a service within the Patrol Police Department of Ukraine within the National Police of Ukraine, which was created as part of the Ministry of Internal Affairs of Ukraine as a structure of special forces for the protection of public order.\n\nThe structure became part of the National Police of Ukraine. The service combines former battalions and regiments of the Ministry of Internal Affairs."
 UKR_uda_decision_category: "Ukrainian Volunteer Army"
 UKR_uda_decision_category_desc: "Ukrainian Volunteer Army is a volunteer paramilitary formation formed on the basis of units of the Ukrainian Volunteer Corps after the release of Dmitry Yarosh and his associates from the Right Sector movement."
 UKR_integrate_uda: "Integrate The §YUDA§! Into The §YArmed Forces of Ukraine§!"
 UKR_small_arms: "Promote §OSmall Arms §! §WCompany§!"
 UKR_equipment_funds: "Promote §OKMDB Infantry Equipment§! §W Division§!"
 UKR_heavy_equipment: "Allocate Funds for §GMalyshev§! §WFactory§!"
 UKR_heavy_equipment_research: "Support §GArmored Vehicle§! §Wresearch§!"
 UKR_fund_antonov: "Subsidize §8Antonov§!"
 UKR_air_equipment: "Support §8Aviation §! §Wresearch§!"
 UKR_nikolayev_funds: "Modernize §8Mykolayiv Shipyard§!"
 UKR_naval_equipment: "Support §8Naval equipment §! §Wresearch§!"
 UKR_parti_regions_economic_committee_desc: "The Party of Regions' economic committee smooths business cycles and maintains stability."
 UKR_parti_regions_invest_open_window_desc: "Business-friendly investment policies encourage population growth and corporate tax collection."
 UKR_parti_regions_taxx_desc: "Tax code reform reduces both personal and corporate taxation, raising bureaucratic costs while moderating social unrest."
 UKR_parti_regions_laizes_desc: "Secularization measures reduce clerical influence but destabilize religious communities and increase economic volatility."
 UKR_parti_regions_stability_reform_desc: "Regional stability measures increase ideological defense but raise bureaucratic overhead."
 UKR_parti_regions_lustration_desc: "Removal of Soviet-era officials reduces administrative and security apparatus costs."
 UKR_parti_regions_opposition_agree_desc: "Political cooperation with opposition parties reduces government isolation and suppresses ideological drift during the Yanukovych era."
 UKR_parti_regions_titushki_desc: "Government-backed street provocateurs suppress ideological drift through intimidation and violence."
 UKR_parti_regions_optimise_ministers_desc: "Streamlining of ministerial bureaucracy reduces administrative costs and improves government efficiency."
 UKR_parti_regions_inform_act_desc: "Media control legislation stabilizes political messaging at administrative cost."
 UKR_parti_regions_pension_reform_desc: "Restructuring the pension system reduces social costs but lowers population growth due to reduced benefits."
 UKR_parti_regions_youth_regions_desc: "Youth engagement programs build generational support and marginally improve political power and drift defense."
 UKR_our_ukraine_secretariat_of_president_desc: "The presidential secretariat enhances administrative research capacity but increases bureaucratic overhead."
 UKR_our_ukraine_fight_with_corruption_idea_desc: "Anti-corruption enforcement reduces bureaucratic overhead and illicit economic extraction."
 UKR_our_ukraine_education_reform_idea_desc: "Curriculum reforms improve research capacity but create temporary political and stability costs."
 UKR_our_ukraine_health_reform_idea_desc: "Healthcare system modernization reduces costs and improves conscription fitness."
 UKR_our_ukraine_social_reform_idea_desc: "Social spending rationalization reduces budget burden while strengthening democratic support."
 UKR_our_ukraine_air_industry_idea_desc: "Aviation sector modernization reduces production costs for military aircraft."
 UKR_reform_sbu: "SBU Reform"
 UKR_reform_sbu_desc: "The SBU needs reforms, for all these years the structure has been very mired in corruption and needs to be updated."
 UKR_Yanu_Minister: "Cabinet"
 UKR_Yanu_President: "Presidency"
 UKR_prepare_protest_tt: "We will gain or lose support for §8The Representatives of The Maidan§!"
 UKR_donbass_concessions_tt: "Depending on our stance, we will be able to gain support from the eastern or western regions, but we will necessarily disappoint §8The Representatives of The Maidan§!."
 UKR_azovsteel_desc: "Control of the Azovstal steel manufacturing complex provides a steady supply of high-quality steel for industrial and military production."
 UKR_yushenko_premier_idea_desc: "Viktor Yushchenko serves as Prime Minister under Kuchma, expanding his political authority and steering the government toward neutrality."
 UKR_yanuk_premier_idea_desc: "Viktor Yanukovych serves as Prime Minister under Kuchma, expanding his political authority and drawing the government toward the left."
 UKR_unstable_government_idea_desc: "Political instability has weakened governmental control, allowing various ideological factions to exploit the unrest for their own agendas."
 UKR_land_reform_idea3_desc: "The land reform initiated in the last century should lead to a complete redistribution of land holdings throughout the country. So far, it is in the process."
 UKR_zaims_desc: "Short-term international loans have stabilized the economy and increased tax revenues, though creating substantial future debt obligations."
 UKR_social_discontent: "Serious Discontent of The People"
 UKR_social_discontent_desc: "Sweeping cuts to healthcare, education, and welfare spending ease the strain on the treasury at the cost of public confidence."
 UKR_banks_lobbyst_liquidate_desc: "Removal of banking interests from government redirects corporate tax revenue, breaking the influence of financial elites on policy."
 UKR_mining_company_help_desc: "Tax incentives for mining companies provide relief during economic strain."
 UKR_privatization_idea_desc: "Privatization of state enterprises improves factory efficiency and trade relations at the cost of political power."
 UKR_without_kuchma_idea_desc: "The 'Ukraine Without Kuchma' movement has mobilized nationalist sentiment against perceived oligarchic corruption and authoritarian governance."
 UKR_left_opposition_idea_desc: "A leftist political movement mobilizes workers and intellectuals against the ruling government, destabilizing the existing order."
 UKR_luaz_idea_desc: "Support for the domestic LUAZ automobile manufacturer reduces production costs for vehicles and trucks."
 UKR_anti_socialist_media_desc: "State-aligned media suppresses communist and neutral sentiment, reinforcing the reactionary government's hold on public opinion."
 ukraine_union.1.t: "Ukraine Proposes a Full Union State"
 ukraine_union.1.d: "Kyiv offers to dissolve its statehood into ours and merge both nations into a single union state under Ukrainian leadership. Every core, every asset, and every soldier would become theirs. Do we surrender our independence for this union?"
 ukraine_union.1.a: "We Accept the Union"
 ukraine_union.1.b: "We Will Not Surrender Our State"
 ukraine_union.2.t: "Russia Rejects the Union"
 ukraine_union.2.d: "Moscow refuses to dissolve itself into our union state. The dream of a single nation from the Carpathians to the Pacific will have to wait."
 ukraine_union.2.a: "A Missed Opportunity"
 ukraine_union.3.t: "Ukraine Proposes Joining NATO Together"
 ukraine_union.3.d: "Kyiv invites us to leave our current alliances and join NATO alongside them, reshaping the security order of Eastern Europe. Do we take this path together?"
 ukraine_union.3.a: "We Join NATO Together"
 ukraine_union.3.b: "Our Place Is Not in NATO"
 ukraine_union.4.t: "Russia Rejects NATO Membership"
 ukraine_union.4.d: "Moscow declines to join NATO alongside us. We will have to chart our western course alone."
 ukraine_union.4.a: "So Be It"
 ukraine_kommi.16.t: "Communist Uprising In The East"
 ukraine_kommi.16.d: "A communist uprising backed by Kyiv has seized several of our eastern provinces and declared independence with Ukrainian support. We will not forget this."
 ukraine_kommi.16.a: "We Will Remember This"
 UKR_brotherhood_people_desc: "A communist social movement emphasizing collective welfare and solidarity reduces consumer goods burden while strengthening ideological defense."
 UKR_social_reform_desc: "Social welfare expansion reduces healthcare and social costs while improving living standards under communist governance."
 UKR_equal_rights_idea_desc: "Implementation of equal rights policies across all demographics reduces bureaucratic burden and strengthens political unity."
 UKR_west_investors_idea_desc: "Western market participation has provided capital and economic expertise, supporting business development and public confidence in the economy."
 UKR_our_investors_idea_desc: "Western investor capital stimulates research capacity, stabilizes economic cycles, and strengthens foreign policy independence."
 UKR_socialist_effort_desc: "Economic mobilization for socialist production increases stability, population growth, and consumer goods availability."
 UKR_alpha: "Alpha"
 UKR_alpha_desc: "The Alpha special operations unit of the SBU enhances our counter-intelligence and security operations against subversive threats."
 UKR_svr_desc: "Foreign Intelligence Service operations enhance intelligence network development and agency defenses against foreign subversion."
 UKR_sviaz_desc: "State Special Communications Service provides improved encryption, decryption, and secure communications infrastructure."
 UKR_ukraine_always_right: "Ukraine Always Right"
 UKR_ukraine_always_right_desc: "True patriots have come to power in Ukraine. Ukraine is always right, Ukraine is above all."
 UKR_take_control_of_the_media: "Take Control Of The Media"
 UKR_take_control_of_the_media_desc: "Media resources have had too much freedom in recent years. They are only busy promoting how bad and terrible our country is, we will fix it."
 UKR_prohibition_of_non_nationalist_organizations: "Prohibition of Non-Nationalist Organizations"
 UKR_prohibition_of_non_nationalist_organizations_desc: "Any organization that refuses the nationalist cause is a threat to the new order. Ban them all and leave our movement as the only legal political force in the country."
 UKR_anti_russian_policy: "Anti-Russian Policy"
 UKR_anti_russian_policy_desc: "Moscow remains the greatest enemy of the Ukrainian nation. Enshrine hostility to Russia as official state policy and purge Russian influence from our institutions."
 UKR_loyal_teachers_in_schools: "Loyal Teachers In Schools"
 UKR_loyal_teachers_in_schools_desc: "The school is the foundation of the future patriotic citizens of Ukraine. We will leave only real Ukrainians in schools."
 UKR_ban_all_languages_except_ukrainian: "Ban All Languages Except Ukrainian"
 UKR_ban_all_languages_except_ukrainian_desc: "We will start a program of Ukrainization, all other languages will be removed from the school curriculum, business communication and other instances of the life of a Ukrainian citizen."
 UKR_introduce_death_penalty_for_disloyal_persons: "Introduce Death Penalty For Disloyal Persons"
 UKR_introduce_death_penalty_for_disloyal_persons_desc: "Loyalty is what every citizen owes to his homeland. All who hate her, all who would offend her, we will get rid of by any means necessary."
 UKR_united_council_of_ukrainian_nationalists: "United Council of Ukrainian Nationalists"
 UKR_united_council_of_ukrainian_nationalists_desc: "Finally, true patriotism and nationalism, led by real supporters of Ukraine, governs the country. Our congress is to build a great country."
 UKR_right_sector: "Right Sector"
 UKR_right_sector_desc: "The right Sector will be responsible for the internal political component of the new Ukrainian state."
 UKR_full_order_in_the_country: "Full Order in The Country"
 UKR_full_order_in_the_country_desc: "Order is the key to stability. We will fight against the manifestations of chaos, disorder and rebellion."
 UKR_ukrainian_assault_battalions: "Ukrainian Assault Battalions"
 UKR_ukrainian_assault_battalions_desc: "We will create shock battalions from particularly patriotic citizens that will perform specific tasks."
 UKR_make_government_jobs_only_for_ukrainians: "Make Government Jobs Only for Ukrainians"
 UKR_make_government_jobs_only_for_ukrainians_desc: "Only Ukrainians should work for the benefit of the motherland, everyone else should not have the right to work."
 UKR_complete_the_cleansing_of_the_ukrainian_state: "Complete the Cleansing of the Ukrainian State"
 UKR_complete_the_cleansing_of_the_ukrainian_state_desc: "Our homeland has been cleansed of enemies, detractors and other negative elements."
 UKR_limit_the_powers_of_the_mvd: "Limit the Powers of the MVD"
 UKR_limit_the_powers_of_the_mvd_desc: "The police and other authorities have too much power in the state, we will limit them."
 UKR_night_of_the_long_knives: "Night of the Long Knives"
 UKR_night_of_the_long_knives_desc: "We will eliminate those who are particularly resistant to reforms more radically."
 UKR_una_unso: "UNA UNSO"
 UKR_una_unso_desc: "Foreign policy activities will fall on the shoulders of the UNA-UNSO organization."
 UKR_external_intervention: "External Intervention"
 UKR_external_intervention_desc: "It's time to stop pursuing a peaceful policy, we will actively influence global processes."
 UKR_resolve_the_moldovan_issue: "Resolve the Moldovan issue"
 UKR_resolve_the_moldovan_issue_desc: "Moldova and Transnistria have been in our way for a long time, their independence is just a mistake, we will fix it."
 UKR_dig_up_potatoes: "Dig up Potatoes"
 UKR_dig_up_potatoes_desc: "Belarus can be used by our enemies from both the west and the east to strike at us. The best way to protect yourself is to strike first!"
 UKR_to_recall_the_volhynia_massacre: "Volyn Experience"
 UKR_to_recall_the_volhynia_massacre_desc: "We have faced the Poles again and must once again fight back against them. It's time for our country to finally end the Polish Threat."
 UKR_secretly_sending_militants_to_kuban: "Raise a Rebellion in the Crimea"
 UKR_secretly_sending_militants_to_kuban_desc: "The fact that Crimea was taken from us by Russia is the main historical injustice of the century. The weakness of our authorities has turned out to be appalling and shameful. We will fix it."
 UKR_agitation_of_radical_ukrainians_in_kuban: "Raise a Rebellion in the Kuban"
 UKR_agitation_of_radical_ukrainians_in_kuban_desc: "Kuban is our land and always will be. We will try to take it away from Russia."
 UKR_liberate_green_klin: "\"Liberate\" Green Klin"
 UKR_liberate_green_klin_desc: "It's time to \"Liberate\" our brothers of the Far East from the oppression of the Russian bear."
 UKR_shoot_a_russian_bear: "Shoot a Russian Bear"
 UKR_shoot_a_russian_bear_desc: "The Russian bear will become our rug!"
 UKR_declare_a_great_ukraine: "Declare a Great Ukraine"
 UKR_declare_a_great_ukraine_desc: "Ukraine has become great and let the whole world know about it."
 UKR_upa: "UPA"
 UKR_upa_desc: "The activities of the civil and internal defense of the country will fall on the revived Ukrainian Insurgent Army."
 UKR_new_orders_of_formation_of_upa_groups: "New Orders of Formation of UPA Groups"
 UKR_new_orders_of_formation_of_upa_groups_desc: "We will take into account the experience of the UPA during the Second World War, and create new brigades taking into account mistakes."
 UKR_partisan_units: "Partisan Units"
 UKR_partisan_units_desc: "UPA guerrilla cells will be established throughout the country to actively resist the enemies in the future."
 UKR_partisanship_as_an_ideology: "Partisanship as an Ideology"
 UKR_partisanship_as_an_ideology_desc: "Our partisans must be ideologically educated in order to actively resist the enemy."
 UKR_make_military_exercises_in_the_country_compulsory_for_all: "Make Military Exercises in the Country Compulsory for All"
 UKR_make_military_exercises_in_the_country_compulsory_for_all_desc: "Every Ukrainian should be able to defend his country. Training with specialists of the UPA of ordinary citizens will strengthen the combat power of our country."
 UKR_to_arm_every_person_in_the_country: "To Arm Every Person in the Country"
 UKR_to_arm_every_person_in_the_country_desc: "Women, Children, Men, Old People - everyone should be able to carry a weapon and shoot at the enemy with it."
 UKR_form_an_alliance_of_right_wing_youth: "Form an Alliance of Right-Wing Youth"
 UKR_form_an_alliance_of_right_wing_youth_desc: "The youth of Ukraine must be organized before they can be armed. Unite the scattered right-wing youth movements into a single alliance loyal to the nationalist cause."
 UKR_ukraine_is_a_land_of_partisans: "Ukraine is a Land of Partisans"
 UKR_ukraine_is_a_land_of_partisans_desc: "There will be partisans in every village, in every city, if the enemy invades us. We will meet him with the might of the Ukrainian people."
 UKR_nationalists_right_sector_desc: "Integration of Right Sector militia into state structures strengthens nationalist sentiment and political authority."
 UKR_nationalists_una_unso_desc: "The nationalist UNA-UNSO movement facilitates volunteer mobilization and improves irregular military capability."
 UKR_nationalists_upa_desc: "Drawing on historical UPA resistance tactics enhances supply efficiency and defense of core territories."
 UKR_nationalists_cleane_ukraine_desc: "A sweeping nationalist consolidation drive strengthens resistance to foreign influence and stiffens the will to keep fighting."
 UKR_nationalists_trizub_desc: "The Tryzub organization mobilizes nationalist sentiment and commitment to national defense."
 UKR_nabu: "National Anti-Corruption Bureau of Ukraine"
 UKR_nabu_desc: "New anti-corruption bureau is designed to strengthen the fight against corrupt officials at all levels at times."
 UKR_poroh_deccomuniz: "Poroshenko's Presidency"
 UKR_poroh_deccomuniz_desc: "Poroshenko is an ambiguous person, but his desire to make Ukraine strong in the face of the enemy deserves the respect of the people."
 UKR_west_investors_desc: "Western foreign investors have been attracted to the market, strengthening democratic institutions and driving economic growth and stability."
 UKR_operation_wall_desc: "Defensive fortification construction accelerates dramatically during this mobilization period."
 UKR_ato_supports_desc: "Support for Anti-Terrorist Operation veterans strengthens nationalist sentiment and reinforces our commitment to those who served."
 UKR_health_supports_desc: "Expanded health care funding improves public welfare and strengthens support for democratic governance."
 UKR_pivdenmash_idea_desc: "Pivdenmash state enterprise specializes in ballistic and nuclear missile production with improved efficiency."
 UKR_kyvarmor_idea_desc: "The Kyiv Armored Plant specializes in producing advanced medium tank chassis and amphibious variants."
 UKR_tsnap_idea_desc: "TSNAP state administrative agency streamlines central government bureaucracy and reduces administrative overhead."
 UKR_concern_desc: "Consolidation of scattered military manufacturing into the Kharkiv Military Industry Complex improves tank and vehicle production efficiency."
 UKR_zaz_idea_desc: "ZAZ automotive production has been revitalized, improving vehicle reliability and reducing manufacturing costs for civilian and military transport."
 UKR_kraz_idea_desc: "KrAZ vehicle production provides domestic manufacturing of trucks and armored vehicles, reducing import dependency."
 UKR_motorsich_idea_desc: "State support for Motor Sich aircraft engine production reduces costs for heavy aircraft and helicopter manufacturing."
 UKR_interlegion_decision_category: "International Legion of Territorial Defense"
 UKR_interlegion_decision_category_desc: "The International Legion of Territorial Defense of Ukraine is a project of the Government of Ukraine to attract foreigners to create volunteer units as part of the territorial defense of the Armed Forces of Ukraine."
 UKR_vetrenko_surrort_nationalism_desc: "A nationalist movement has mobilized the population, emphasizing Ukrainian identity and cultural sovereignty against perceived external threats."
 UKR_vetrenko_pioneria_desc: "A nationalist youth organization has been established to foster patriotic education and increase political awareness among younger generations."
 UKR_vetrenko_health_free_idea_desc: "Free healthcare has been implemented nationwide, improving population growth but straining public finances with increased medical expenditures."
 UKR_economic_reforms_modifier: "Ukrainian Economic Development"
 UKR_economic_reforms_modifier_desc: "Decades of oligarchic stagnation left Ukraine's economy a patchwork of Soviet relics and shadow markets. A sustained program of reform is slowly untangling the bureaucracy, courting foreign investment, and modernizing our aging industry. Every step forward is measured in factories reopened and contracts honored."
 UKR_military_reforms_modifier: "Ukrainian Military Development"
 UKR_military_reforms_modifier_desc: "The Ukrainian Armed Forces entered the century underfunded, demoralized, and armed with rusting Soviet stockpiles. Reform means more than new rifles, it means professional officers, realistic training, and doctrine written for the wars we actually face. What emerges will be a leaner, harder army loyal to the state rather than to any patron."
 UKR_kuchma_shortcut: "Kuchma"
 UKR_kuchma_second_terms: "Kuchma Second Term"
 UKR_kuchma_second_terms_desc: "President Kuchma has been ruling our country for the second term; perhaps this time he will not be re-elected or he will lead our country to chaos. We will see."
 UKR_dissolve_rada: "Dissolve Rada"
 UKR_restore_rada: "Restore Rada"
 ukr_industry_points_cost_35_blocked: "35 Industry Points Required"
 ukr_industry_points_cost_50_blocked: "50 Industry Points Required"
 ukr_industry_points_cost_75_blocked: "75 Industry Points Required"
 UKR_wind_energy: "Wind Energy Program Completed"
 UKR_solar_energy: "Solar Power Program Completed"
 UKR_finance_vv_tt: "Requires the Internal Troops still at their reformed strength, not disbanded or folded into another service"
 UKR_unite_with_russian_genshtab_tt: "Requires the Military Reforms track to not be at its second stage"
 UKR_nato_aid_donor_one: "[FROM.GetName] has delivered support for our war effort."
 UKR_nato_aid_donor_many: "§Y[?UKR.UKR_aid_report_donors^num]§! allied governments, led by [FROM.GetName], have delivered support for our war effort."
 UKR_aid_report_money_tt: "[THIS.GetFlag][THIS.GetAdjective] §YTreasury§!: $$[?UKR_aid_report_money|+] Billion"
 ukraine_revolution.30.t: "Crimea's Supreme Council"
 ukraine_revolution.30.d: "The Crimean Supreme Council is testing the limits of Kyiv's authority. Should we permit a referendum on the peninsula's status or dissolve the council?"
 ukraine_revolution.30.a: "Permit a referendum"
 ukraine_revolution.30.b: "Dissolve the council"
 ukraine_revolution.31.t: "Moscow Weighs In"
 ukraine_revolution.31.d: "Kyiv has opened a status question in Crimea. Moscow can accept a Ukrainian autonomy arrangement or underwrite a referendum of its own."
 ukraine_revolution.31.a: "Accept Ukrainian autonomy"
 ukraine_revolution.31.b: "Underwrite the referendum"
 ukraine_revolution.32.t: "The Crimean Referendum"
 ukraine_revolution.32.d: "The referendum has put Crimea's future in Moscow's hands. We must decide whether to recognize a Russian protectorate or absorb the peninsula directly."
 ukraine_revolution.32.a: "Create a Russian protectorate"
 ukraine_revolution.32.b: "Annex Crimea directly"
 ukraine_revolution.33.t: "Moscow Responds"
 ukraine_revolution.33.d: "Kyiv dissolved the Crimean council. Moscow must decide whether to answer with pressure or stand down."
 ukraine_revolution.33.a: "Apply diplomatic pressure"
 ukraine_revolution.33.b: "Stand down"
 ukraine_revolution.40.t: "Donetsk's Political Future"
 ukraine_revolution.40.d: "The Donetsk region is demanding a direct say over its government. Kyiv must choose between a negotiated settlement, a crackdown, or a new autonomous republic."
 ukraine_revolution.40.a: "Negotiate Local Autonomy"
 ukraine_revolution.40.b: "Dissolve the Council"
 ukraine_revolution.40.c: "Allow a Donetsk Republic"
 ukraine_revolution.40.e: "Let the Donbas Rise in Arms"
 ukraine_revolution.41.t: "Luhansk's Political Future"
 ukraine_revolution.41.d: "Luhansk's councils are following Donetsk's example. Their demands can be contained through compromise, force, or recognition of a republic."
 ukraine_revolution.41.a: "Negotiate Local Autonomy"
 ukraine_revolution.41.b: "Suppress the Movement"
 ukraine_revolution.41.c: "Allow a Luhansk Republic"
 ukraine_revolution.42.t: "Crimea's Political Future"
 ukraine_revolution.42.d: "Crimea's status is again being contested while the country is already under strain. Kyiv can recognize local autonomy, dissolve the council, or defer to the guarded Crimea process."
 ukraine_revolution.42.a: "Negotiate Local Autonomy"
 ukraine_revolution.42.b: "Dissolve the Council"
 ukraine_revolution.42.c: "Use the Crimea Process"
 ukraine_revolution.43.t: "Kharkiv's Council"
 ukraine_revolution.43.d: "Kharkiv's regional politicians are testing the limits of Kyiv's authority. The government must decide whether to negotiate, suppress the council, or tolerate a local administration."
 ukraine_revolution.43.a: "Negotiate Local Autonomy"
 ukraine_revolution.43.b: "Suppress the Council"
 ukraine_revolution.43.c: "Tolerate a Local Administration"
 ukraine_revolution.44.t: "Zaporizhzhia's Council"
 ukraine_revolution.44.d: "Zaporizhzhia is demanding guarantees for its local institutions. A compromise may calm the region, while repression may spread the crisis."
 ukraine_revolution.44.a: "Negotiate Local Autonomy"
 ukraine_revolution.44.b: "Suppress the Council"
 ukraine_revolution.44.c: "Tolerate a Local Administration"
 ukraine_revolution.45.t: "The Southern Councils"
 ukraine_revolution.45.d: "Kherson and Mykolaiv are organizing around demands for local control. Their councils can be brought into a settlement or pushed into open opposition."
 ukraine_revolution.45.a: "Negotiate Local Autonomy"
 ukraine_revolution.45.b: "Suppress the Councils"
 ukraine_revolution.45.c: "Tolerate Local Administrations"
 ukraine_revolution.46.t: "Odesa's Political Future"
 ukraine_revolution.46.d: "Odesa's council is weighing autonomy against a direct break with Kyiv. The existing Odesa republic is available if the government loses control."
 ukraine_revolution.46.a: "Negotiate Local Autonomy"
 ukraine_revolution.46.b: "Suppress the Council"
 ukraine_revolution.46.c: "Allow an Odesa Republic"
 ukraine_revolution.47.t: "Dnipro's Political Future"
 ukraine_revolution.47.d: "Dnipro's industrial region is demanding a voice in the new political order. Kyiv can negotiate, suppress the council, or allow the existing Dnipro republic to emerge."
 ukraine_revolution.47.a: "Negotiate Local Autonomy"
 ukraine_revolution.47.b: "Suppress the Council"
 ukraine_revolution.47.c: "Allow a Dnipro Republic"
 ukraine_revolution.48.t: "Sumy's Council"
 ukraine_revolution.48.d: "Sumy's local authorities are asking for guarantees against decisions made in Kyiv. A negotiated council is the least disruptive path, but suppression and recognition remain possible."
 ukraine_revolution.48.a: "Negotiate Local Autonomy"
 ukraine_revolution.48.b: "Suppress the Council"
 ukraine_revolution.48.c: "Tolerate a Local Administration"
 ukraine_revolution.49.t: "The Future of Novorossiya"
 ukraine_revolution.49.d: "The participating republics have consolidated into Novorossiya. Kyiv must decide whether to recognize it as a Ukrainian autonomous subject, accept an independent confederation, or fight for its territory."
 ukraine_revolution.49.a: "Recognize a Ukrainian Autonomous Subject"
 ukraine_revolution.49.b: "Accept an Independent Confederation"
 ukraine_revolution.49.c: "Fight for the Territory"
 ukraine_revolution.50.t: "A Congress Remembered"
 ukraine_revolution.50.d: "The Severodonetsk Congress has become part of the region's political memory. Its demand for a voice in Kyiv's decisions still shapes the republic's institutions."
 ukraine_revolution.50.a: "Record the Legacy"
 ukraine_revolution.51.t: "Councils Become Institutions"
 ukraine_revolution.51.d: "The regional council wave has run its course. Some councils were contained, others became republics, but each left a lasting mark on the post-Maidan settlement."
 ukraine_revolution.51.a: "A New Political Map"
 ukraine_revolution.52.t: "A Republic Takes Shape"
 ukraine_revolution.52.d: "The first regional republic has established a government of its own. Its future will depend on whether local administration can outlast the crisis that created it."
 ukraine_revolution.52.a: "Hold the Line"
 ukraine_revolution.53.t: "Crimea's Long Shadow"
 ukraine_revolution.53.d: "Crimea's 2004 settlement has finally been recorded in the political order. The decision did not end every dispute, but it gave the peninsula's status a history that cannot be ignored."
 ukraine_revolution.53.a: "Remember the Settlement"
 ukraine_revolution.54.t: "A Novorossiyan Settlement"
 ukraine_revolution.54.d: "The Novorossiyan settlement has changed the balance between Kyiv, the regional republics, and Moscow. The new arrangement will be judged by what it preserves, not only by what it claims."
 ukraine_revolution.54.a: "Keep the Record"
 ukraine_revolution.55.t: "Free Territory"
 ukraine_revolution.55.d: "Anarchist militants within the new state's leadership argue that Novorossiya is a borrowed name that means nothing to the people of Huliaipole. They want to revive Nestor Makhno's old banner and call the land what it is: a free territory."
 ukraine_revolution.55.a: "Adopt the Free Territory"
 ukraine_revolution.55.b: "Keep the Name Novorossiya"
 ukraine_regions.13.t: "The Kharkiv Pact"
 ukraine_regions.13.d: "Russia is offering to extend the Black Sea Fleet's lease on Sevastopol in exchange for a discount on natural gas."
 ukraine_regions.13.a: "Sign the Pact"
 ukraine_regions.13.b: "Refuse the Pact"
 ukraine_regions.14.t: "The Tymoshenko Case"
 ukraine_regions.14.d: "Former Prime Minister Yulia Tymoshenko is being prosecuted over the 2009 gas deal with Russia. Prosecutors want her arrested."
 ukraine_regions.14.a: "Arrest Her"
 ukraine_regions.14.b: "Leave Her Be"
 ukraine_regions.15.t: "The Regional Languages Law"
 ukraine_regions.15.d: "A bill granting regional status to Russian and other minority languages has cleared the Rada. Passing it would please the southeast and anger nationalists in the west."
 ukraine_regions.15.a: "Pass the Law"
 ukraine_regions.15.b: "Reject the Law"
 ukraine_our_ukraine.10.t: "The Bucharest Summit"
 ukraine_our_ukraine.10.d: "At the NATO summit in Bucharest, Germany and France blocked a Membership Action Plan for Ukraine. The alliance's door remains open in name, but no path through it has been set."
 ukraine_our_ukraine.10.a: "Keep Courting NATO"
 ukraine_our_ukraine.10.b: "Denounce the Rebuff"
 UKR_hur_can_attack: "The government supports HUR operations, HUR Reform is complete, and at least one HUR unit has been raised"
 UKR_YUSHENKO_PATH: "Yushchenko Path Selected by Game Rule"
 UKR_YANUK_PATH: "Yanukovych Path Selected by Game Rule"
 UKR_political_tension_tt: "Political Tension will change by §Y[?tension_change|0]§! (Current Political Tension: §Y[?UKR.UKR_political_tension|0]§!)."
 UKR_seuar_balance: "SEUAR Autonomy Struggle"
 UKR_seuar_balance_desc: "The struggle between Kyiv's institutions and the South-Eastern Ukrainian autonomy movement will determine whether the 2004 crisis remains political or produces a new republic."
 UKR_seuar_kyiv_control: "Kyiv Control"
 UKR_seuar_autonomy_side: "Autonomy Movement"
 UKR_seuar_negotiated_center: "Negotiated Stalemate"
 UKR_seuar_negotiated_center_desc: "Neither Kyiv nor the autonomy movement has secured a decisive advantage."
 UKR_seuar_kyiv_advantage: "Kyiv Gains Ground"
 UKR_seuar_kyiv_advantage_desc: "Counter-protests and state pressure are beginning to contain the autonomy movement."
 UKR_seuar_kyiv_dominance: "Kyiv Dominance"
 UKR_seuar_kyiv_dominance_desc: "The autonomy movement is close to collapse under coordinated state pressure."
 UKR_seuar_autonomy_advantage: "Autonomy Gains Ground"
 UKR_seuar_autonomy_advantage_desc: "The autonomy movement is organizing faster than Kyiv can contain it."
 UKR_seuar_autonomy_dominance: "Autonomy Dominance"
 UKR_seuar_autonomy_dominance_desc: "The autonomy movement has enough support to demand a formal autonomous republic."
 UKR_separatist_crisis_category: "Separatist Crisis"
 UKR_separatist_crisis_category_desc: "[UKR.GetFlag]§YUkraine§! must contain regional councils and separatist movements without turning every local dispute into a war."
 UKR_separatist_fund_negotiations: "Fund Regional Negotiations"
 UKR_separatist_fund_negotiations_desc: "Spend treasury funds on local mediators and concessions before the councils become republics."
 UKR_separatist_internal_security: "Deploy Internal Security"
 UKR_separatist_internal_security_desc: "Use internal security forces to hold government buildings and contain separatist organizers."
 UKR_separatist_recognize_councils: "Recognize Autonomous Councils"
 UKR_separatist_recognize_councils_desc: "Recognize council authority in exchange for compliance and an end to the immediate confrontation."
 UKR_novorossiya_form: "Consolidate Novorossiya"
 UKR_novorossiya_form_desc: "Bring the participating republics and supported councils together under the existing Novorossiya tag."
 UKR_novorossiya_recognize: "Recognize Novorossiya's Autonomy"
 UKR_novorossiya_recognize_desc: "Accept Novorossiya as a Ukrainian autonomous subject while it remains at peace and controls territory."
 UKR_separatist_crisis_active_tt: "The 2014 regional republic wave is active."
 UKR_separatist_treasury_tt: "The treasury must contain enough funds for this action."
 SOV_backed_seuar: "Russia has backed the SEUAR movement"
 UKR_crimea_2004_resolution: "The 2004 Crimean status process has begun"
 UKR_crimea_2004_pending: "The 2004 Crimean referendum is pending"
 UKR_crimea_2004_departed: "Crimea left Ukraine in 2004"
 UKR_orange_2004_started: "The 2004 political crisis has begun"
 UKR_orange_2004_resolved: "The 2004 political crisis has been resolved"
 CRM_2004_content_unlocked: "The 2004 Crimean administration is active"
 UKR_provisional_republic_focus_setup: "The provisional republic administration is active"
 UKR_crimea_2004_status: "Settle Crimea's Status"
 UKR_crimea_2004_status_desc: "The Crimean Supreme Council is challenging Kyiv while Moscow backs the southeastern autonomy movement. Decide how to handle Crimea before the crisis widens."
 SOV_seuar_intervention_category: "Support the Southeast"
 SOV_seuar_intervention_category_desc: "Moscow can influence the South-Eastern Ukrainian autonomy struggle, at the risk of turning a political crisis into a war."
 UKR_seuar_counter_protests: "Support Local Counter-Protests"
 UKR_seuar_counter_protests_desc: "Back local demonstrations that reject the autonomy movement and restore Kyiv's influence."
 UKR_seuar_internal_troops: "Deploy Internal Troops"
 UKR_seuar_internal_troops_desc: "Use Interior Ministry troops to secure public buildings and pressure the autonomy movement."
 UKR_seuar_special_operations: "Conduct SBU-HUR Operations"
 UKR_seuar_special_operations_desc: "Use intelligence and special operations to disrupt the autonomy movement. This raises the risk of Russian intervention."
 UKR_seuar_reintegrate: "Offer Constitutional Compromise"
 UKR_seuar_reintegrate_desc: "Offer SEUAR a constitutional compromise and reintegrate it into Ukraine."
 UKR_seuar_force: "Force the Autonomy Question"
 UKR_seuar_force_desc: "End the autonomy arrangement by force. This may provoke a border war and Russian intervention."
 SOV_seuar_fund_movement: "Fund the Autonomy Movement"
 SOV_seuar_fund_movement_desc: "Provide political and financial support to SEUAR's organizers."
 SOV_seuar_suborn_units: "Suborn Local Units"
 SOV_seuar_suborn_units_desc: "Encourage local Ukrainian units to block orders or side with the autonomy movement."
 SOV_seuar_send_volunteers: "Send Volunteers"
 SOV_seuar_send_volunteers_desc: "Send volunteers from bordering regions to defend the autonomy movement."
 UKR_seuar_active_tt: "The SEUAR autonomy struggle is active."
 UKR_seuar_treasury_tt: "The treasury must contain enough funds for this action."
 SOV_seuar_treasury_tt: "The treasury must contain enough funds for this action."
 UKR_pro_russian_support_30_tt: "Russia holds at least §Y30%§! influence over Ukraine"
 UKR_seuar_counter_protests_tt: "Shifts the autonomy struggle toward Kyiv by §R0.10§! and costs Stability."
 UKR_seuar_internal_troops_tt: "Costs §R3§! treasury, shifts the struggle toward Kyiv by §R0.15§!, and costs Stability."
 UKR_seuar_special_operations_tt: "Costs §R5§! treasury, shifts the struggle toward Kyiv by §R0.08§!, and costs Stability."
 UKR_seuar_reintegration_tt: "SEUAR will be reintegrated. Ukraine gains Russian influence and tension falls by §G15§!."
 UKR_seuar_force_tt: "SEUAR will become independent and a limited border war will begin."
 UKR_seuar_intervention_risk_tt: "Russian intervention becomes possible if the war continues."
 UKR_seuar_no_intervention_tt: "Moscow may remain outside the conflict."
 SOV_seuar_fund_movement_tt: "Costs §R5§! treasury and shifts the struggle toward autonomy by §G0.10§!."
 SOV_seuar_suborn_units_tt: "Costs §R4§! treasury, shifts the struggle toward autonomy by §G0.12§!, and raises escalation."
 SOV_seuar_send_volunteers_tt: "Costs §R8§! treasury, shifts the struggle toward autonomy by §G0.18§!, and raises escalation."
 UKR_prp_provisional_administration: "Establish a Provisional Administration"
 UKR_prp_provisional_administration_desc: "The new republic needs a functioning administration before the crisis hardens into permanent division."
 UKR_prp_local_security: "Organize Local Security"
 UKR_prp_local_security_desc: "Local security committees can reduce disorder without turning every political dispute into a war."
 UKR_prp_volunteer_forces: "Raise Volunteer Forces"
 UKR_prp_volunteer_forces_desc: "Volunteers will defend the republic while its institutions and regular forces remain untested."
 UKR_prp_utilities_repair: "Repair Utilities and Roads"
 UKR_prp_utilities_repair_desc: "Repairing the transport and utility network will reconnect the communities that depend on the provisional government."
 UKR_prp_emergency_economy: "Stabilize the Emergency Economy"
 UKR_prp_emergency_economy_desc: "A small industrial base and emergency production can keep the republic supplied through the transition."
 UKR_prp_constitutional_choice: "Choose a Constitutional Settlement"
 UKR_prp_constitutional_choice_desc: "The provisional institutions must decide whether they are a bridge back to Kyiv, a partner of Moscow, or the foundation of a separate state."
 UKR_prp_negotiate_kyiv: "Negotiate with Kyiv"
 UKR_prp_negotiate_kyiv_desc: "A direct settlement with Kyiv can protect local institutions while avoiding another armed confrontation."
 UKR_prp_seek_moscow_support: "Seek Moscow's Support"
 UKR_prp_seek_moscow_support_desc: "Moscow can provide diplomatic backing, but accepting its support will shape the republic's future alignment."
 UKR_prp_independent_republic: "Proclaim an Independent Republic"
 UKR_prp_independent_republic_desc: "The provisional government can end its subordinate status and accept the risks of standing alone."
 UKR_prp_regional_union: "Build a Regional Union"
 UKR_prp_regional_union_desc: "Work with the existing Novorossiya settlement rather than creating another competing tag."
 DRP_pivdenmash_rearmament: "Restart Pivdenmash"
 DRP_pivdenmash_rearmament_desc: "The old Yuzhmash rocket and heavy-machinery works can still turn out weapons, if someone is willing to reopen its floors."
 DRP_industrial_mobilization: "Mobilize Dnipro's Industry"
 DRP_industrial_mobilization_desc: "Dnipro's Soviet-era industrial base can be turned toward the republic's needs, at the cost of whatever civilian production it still manages."
 DRP_dnieper_logistics: "Secure Dnieper River Logistics"
 DRP_dnieper_logistics_desc: "The river has always moved the region's goods. Rebuilding its landings and approach roads keeps that traffic under the republic's control."
 DRP_kolomoisky_purge: "Purge the Kolomoisky Network"
 DRP_kolomoisky_purge_desc: "The oligarch's patronage web still runs through local administration and business. Rooting it out clears the way for the republic's own men."
 DRP_state_security_consolidation: "Consolidate State Security"
 DRP_state_security_consolidation_desc: "A proper security service, answerable to the republic and not to whichever faction controls a given district, is overdue."
 DRP_moscow_alignment: "Align with Moscow"
 DRP_moscow_alignment_desc: "Formalizing military and economic ties with Moscow trades away independence of action for a patron that will not let the republic fall."
 UKR_seuar_autonomy_movement: "SEUAR Autonomy Movement"
 UKR_seuar_autonomy_movement_desc: "A southeastern autonomy movement is contesting Kyiv's authority. Its future depends on the balance between local organizers and state pressure."
 UKR_western_crisis_idea: "Government of Western Ukraine"
 UKR_western_crisis_idea_desc: "The western oblasts refuse to recognize the fraudulent election and have proclaimed their own government. The standoff paralyzes national politics until Kyiv settles the western question."
 UKR_constitutional_compromise_idea: "Constitutional Compromise"
 UKR_constitutional_compromise_idea_desc: "The constitutional settlement that ended the autonomy crisis devolves real power to the regions. It calms the southeast at the cost of a weaker central government."
 ukraine_kuchma.14.t: "Protests in the Southeast"
 ukraine_kuchma.14.d: "After the election, southeastern activists reject Kyiv's settlement and organize the Blue Maidan. The movement threatens to turn an electoral crisis into a regional one."
 ukraine_kuchma.14.a: "The Situation Is Deteriorating"
 ukraine_kuchma.15.t: "Blue Maidan in Ukraine"
 ukraine_kuchma.15.d: "The Blue Maidan asks Moscow to recognize its demand for regional autonomy. The Kremlin must decide whether to lend political weight to the movement."
 ukraine_kuchma.15.a: "Support the Autonomy Movement"
 ukraine_kuchma.15.b: "Do Not Interfere"
 ukraine_kuchma.16.t: "Government of the Southeast"
 ukraine_kuchma.16.d: "The Blue Maidan has formed a coordinating government and claims that Kyiv no longer represents the southeast. Local officials are asking for a formal political settlement."
 ukraine_kuchma.16.a: "Prepare a Response"
 ukraine_kuchma.17.t: "The Blue Revolution"
 ukraine_kuchma.17.d: "Blue Maidan delegates proclaim a South-Eastern Ukrainian autonomy project. The movement now seeks a congress rather than an immediate declaration of independence."
 ukraine_kuchma.17.a: "The Congress Must Decide"
 ukraine_kuchma.18.t: "Protests in Galicia"
 ukraine_kuchma.18.d: "The disputed election has driven western activists into the streets. Clashes with the police threaten to turn the presidential crisis into a wider constitutional confrontation."
 ukraine_kuchma.18.a: "The Situation Is Deteriorating"
 ukraine_kuchma.19.t: "Red Maidan in Ukraine"
 ukraine_kuchma.19.d: "Galician activists demand an honest election and ask Poland whether it will support their political campaign. A foreign endorsement could deepen the crisis."
 ukraine_kuchma.19.a: "Support the Democratic Forces"
 ukraine_kuchma.19.b: "Do Not Interfere"
 ukraine_kuchma.20.t: "The Government of Western Ukraine"
 ukraine_kuchma.20.d: "Western activists have formed a political coordination committee and refuse to accept Kyiv's electoral settlement. The confrontation remains political, but the country is becoming harder to govern."
 ukraine_kuchma.20.a: "Send the Police"
 ukraine_kuchma.21.t: "The Red Revolution"
 ukraine_kuchma.21.d: "The Red Maidan announces a campaign of resistance against the pro-Russian government in Kyiv. The crisis remains a political struggle, not a new country."
 ukraine_kuchma.21.a: "Contain the Crisis"
 ukraine_revolution.1.t: "The Orange Revolution Begins"
 ukraine_revolution.1.d: "The electoral crisis has reached its breaking point. If the government does not act, protests will spread before the year is over."
 ukraine_revolution.1.a: "Open the Orange Maidan"
 ukraine_revolution.10.t: "The Severodonetsk Congress"
 ukraine_revolution.10.d: "Delegates from southeastern Ukraine have gathered in Severodonetsk. They may limit themselves to a historic congress, or ask for a formal autonomy process."
 ukraine_revolution.10.a: "Hold the Congress"
 ukraine_revolution.10.b: "Request Autonomy"
 ukraine_revolution.11.t: "The Autonomy Struggle"
 ukraine_revolution.11.d: "The autonomy movement and Kyiv have spent months contesting control of the southeast. The balance now determines whether the movement is suppressed, negotiated away, or granted a formal republic."
 ukraine_revolution.11.a: "Resolve the Struggle"
 ukraine_revolution.12.t: "SEUAR Proclaims Autonomy"
 ukraine_revolution.12.d: "The southeastern congress has demanded a formal autonomous republic. Kyiv must decide whether to recognize the new South-Eastern Ukrainian Autonomous Republic."
 ukraine_revolution.12.a: "Recognize the Republic"
 ukraine_revolution.13.t: "A Constitutional Compromise"
 ukraine_revolution.13.d: "The autonomy movement has remained inside Ukraine, but its separate institutions are becoming difficult to sustain. A constitutional compromise could restore a single Ukrainian state."
 ukraine_revolution.13.a: "Reintegrate SEUAR"
 ukraine_revolution.14.t: "The SEUAR Ceasefire"
 ukraine_revolution.14.d: "Fighting between Ukraine and SEUAR has exhausted both sides. A ceasefire would leave the new republic independent, but the conflict could continue."
 ukraine_revolution.14.a: "Accept a Ceasefire"
 ukraine_revolution.14.b: "Continue the War"
 ukraine_revolution.15.t: "Moscow Considers Intervention"
 ukraine_revolution.15.d: "Ukraine's use of force has brought the SEUAR conflict to Moscow's attention. The Kremlin must decide whether to join the war."
 ukraine_revolution.15.a: "Join SEUAR"
 ukraine_revolution.15.b: "Stay Out of the War"
 ukraine_revolution.16.t: "The SEUAR Border War"
 ukraine_revolution.16.d: "Kyiv has rejected the autonomy arrangement and ordered its forces to end SEUAR's separate status. The decision risks turning the constitutional crisis into a war."
 ukraine_revolution.16.a: "End the Autonomy"
 ukraine_revolution.17.t: "The Western Question"
 ukraine_revolution.17.d: "The self-proclaimed Government of Western Ukraine still refuses to recognize the fraudulent election. Months of standoff have left Kyiv with a choice between concessions and force."
 ukraine_revolution.17.a: "Negotiate With the West"
 ukraine_revolution.17.b: "Crack Down"
 ukraine_revolution.20.t: "The Association Decision"
 ukraine_revolution.20.d: "The European Union association agreement is ready for a political decision. Suspending it may bring the streets into motion, while signing it could postpone the crisis."
 ukraine_revolution.20.a: "Suspend the Agreement"
 ukraine_revolution.20.b: "Sign the Agreement"
 ukraine_revolution.21.t: "The Agreement Reconsidered"
 ukraine_revolution.21.d: "Months after the association agreement was signed, political tensions have continued to build. The government must now face the consequences of its choice."
 ukraine_revolution.21.a: "Face the Consequences"
 UKR_seuar_sov_support_tt: "Russian influence over Ukraine will increase, and the autonomy movement will continue."
 UKR_seuar_sov_decline_tt: "Moscow will not commit to the autonomy movement."
 UKR_western_poland_support_tt: "Poland influence over Ukraine will increase, and the western political movement will continue."
 UKR_western_poland_decline_tt: "Poland will not commit to the western political movement."
 UKR_crimea_2004_permit_tt: "The Crimean Supreme Council will organize a status referendum. Moscow will decide its response."
 UKR_crimea_2004_restrain_tt: "Crimea will remain in Ukraine as an autonomous republic."
 UKR_crimea_2004_underwrite_tt: "Moscow will underwrite Crimean secession from Ukraine."
 UKR_amber_wars_category: "The Amber Wars"
 UKR_amber_wars_category_desc: "[UKR.GetFlag]§YUkraine§! looks the other way as diggers strip the pine forests of Volhynia for amber, while local officials weigh a cut of the profits against the cost of a crackdown."
 UKR_amber_crackdown: "Crack Down on the Diggers"
 UKR_amber_crackdown_desc: "Send police and National Guard units into the amber fields to clear illegal pits, seize equipment, and arrest the diggers. It will not end the trade for good, but it buys the state some peace and some tax revenue."
 UKR_amber_tolerate: "Tolerate the Digging"
 UKR_amber_tolerate_desc: "Let local officials keep collecting their unofficial cut and leave the diggers alone. Money moves, but so does resentment toward a state that only shows up to take its share."
 ukraine_amber.1.t: "The Kopach Republic Proclaims Itself"
 ukraine_amber.1.d: "With the state's authority in Volhynia already hollowed out by war, a band of amber diggers and local strongmen declare the pits around Klesiv their own affair. They call it the Kopach Republic, after the Ukrainian word for digger, and post a checkpoint on the road to Sarny."
 ukraine_amber.1.a: "Note it and move on"
 UKR_amber_resentment: "Amber Rush Lawlessness"
 UKR_amber_kopach_truce: "The Diggers' Truce"
 ukraine_amber.2.t: "The Kopach Republic Dissolves"
 ukraine_amber.2.d: "The self-declared diggers' republic never had a government to speak of, only a checkpoint and a price list. With the easy amber running out and the novelty gone, the strongmen quietly go back to digging without the flag."
 ukraine_amber.2.a: "Acknowledged"
 UKR_strategic_industry_chinese_capital_corridor: "Chinese Capital Corridor"
 UKR_strategic_industry_chinese_capital_corridor_desc: "Chinese capital and market access anchor investment in engines and advanced manufacturing. The corridor delivers scale at the cost of sharper technology-transfer and control concerns."
 UKR_strategic_industry_independent_distributed_industry: "Independent Distributed Industry"
 UKR_strategic_industry_independent_distributed_industry_desc: "A network of domestic firms, repair centers, and dispersed workshops gives Ukraine resilient output and rapid adaptation. It excels at wartime continuity, even though it cannot reproduce every heavy industrial function."
 UKR_strategic_industry_renewed_post_soviet_integration: "Renewed Post-Soviet Integration"
 UKR_strategic_industry_renewed_post_soviet_integration_desc: "Reopened eastern supply chains reconnect Ukrainian factories with familiar markets, components, and standards. Efficiency returns, together with renewed strategic exposure."
 UKR_strategic_industry_western_integrated_defense_industry: "Western-Integrated Defense Industry"
 UKR_strategic_industry_western_integrated_defense_industry_desc: "Domestic firms and strategic state enterprises are linked to Western standards, investment, repair networks, and production partnerships. Integration expands markets and supply access while binding modernization to allied cooperation."
 ukraine_tech.300.a: "Preserve the strategic combines"
 ukraine_tech.300.b: "Privatise the combines and let the market decide"
 ukraine_tech.300.d: "Independence left Ukraine with Antonov, Motor Sich, Yuzhmash and the design bureaux around them, but not the complete market and supplier network that had sustained them. Keeping specialists and facilities together will demand choices the state can barely afford."
 ukraine_tech.300.t: "The Inheritance Without a Market"
 ukraine_tech.301.a: "Keep the post-Soviet engine network"
 ukraine_tech.301.b: "Finance an independent engine ecosystem"
 ukraine_tech.301.d: "Ivchenko-Progress designs engines, while Motor Sich manufactures them. The linked Zaporizhzhia complex still runs on inherited markets and suppliers, forcing a choice between keeping that network alive and paying to build an independent one."
 ukraine_tech.301.t: "Engines for a Vanished Empire"
 ukraine_tech.302.a: "Double down on inherited networks"
 ukraine_tech.302.b: "Diversify contracts cautiously"
 ukraine_tech.302.d: "Russian orders for Motor Sich engines and Antonov airframes keep the factories working, yet the same network controls components, certification, and customers. Diversification is costly now, but dependence will magnify any future rupture."
 ukraine_tech.302.t: "The Ties That Bind"
 ukraine_tech.303.a: "Cut the Russian supply chain outright"
 ukraine_tech.303.b: "Keep what still works through intermediaries"
 ukraine_tech.303.d: "Political rupture has severed the Russian industrial relationships Antonov, Motor Sich and Yuzhmash were built on. The immediate shock reflects the exposure accepted earlier, and the surviving enterprises must rebuild suppliers, standards, and markets under pressure."
 ukraine_tech.303.t: "The Severing"
 ukraine_tech.304.a: "Block the sale and keep Motor Sich Ukrainian"
 ukraine_tech.304.b: "Permit Chinese control"
 ukraine_tech.304.d: "Chinese-linked investors seek control of Motor Sich, drawing private ownership, foreign capital, aviation technology, and national security into one dispute. Motor Sich's factories are strategic, but they are not the same institution as the Ivchenko-Progress design bureau."
 ukraine_tech.304.t: "Who Owns Motor Sich?"
 ukraine_tech.305.a: "An arsenal of our own, built under fire"
 ukraine_tech.305.b: "A corridor for Chinese capital"
 ukraine_tech.305.c: "A defence industry integrated with the West"
 ukraine_tech.305.e: "Renewed post-Soviet integration"
 ukraine_tech.305.d: "A quarter century of privatisation, rupture, foreign capital and full-scale war has settled what became of Antonov, Motor Sich and Yuzhmash, and what replaced them. What survived, what was built under fire, and who it answers to now decide what Ukraine can make for itself."
 ukraine_tech.305.t: "What Ukraine's Industry Became"
 UKR_party_regions_inauguration: "Yanukovych's Inauguration"
 UKR_party_regions_inauguration_desc: "It is time for the inauguration of our new president."
 ukraine_tech.305.f: "An independent, dispersed industry"
 ukraine_tech.306.t: "The Mriya Burns"
 ukraine_tech.306.d: "Russian troops took Antonov Airport at Hostomel in the first hours, and the An-225 Mriya, the largest aircraft ever built and the one thing Ukrainian industry was famous for, burned in its hangar. Yuzhmash is inside artillery range at Dnipro. Production can be broken up and moved west, into smaller shops and underground, at the cost of every economy of scale the combines were built around. Or the plants can keep working where they stand."
 ukraine_tech.306.a: "Disperse production westward and underground"
 ukraine_tech.306.b: "Keep the plants working where they stand"
 ukraine_tech.307.t: "Four Million Drones"
 ukraine_tech.307.d: "The Brave1 cluster has turned garage workshops into a procurement pipeline, and Ukraine now builds more attack drones in a month than most armies hold. Rheinmetall and Baykar both want joint ventures on Ukrainian soil, which would bring capital, standards and NATO order books. The state can pour everything into the domestic drone and missile base it already owns, or trade a share of it for integration into allied production."
 ukraine_tech.307.a: "Fund the sovereign drone and missile base"
 ukraine_tech.307.b: "Take the joint ventures and the allied order books"
 UKR_strategic_industry_wartime_drone_arsenal: "Wartime Drone Arsenal"
 UKR_strategic_industry_wartime_drone_arsenal_desc: "Ukraine builds its own drones and missiles across hundreds of dispersed workshops that no single strike can close. The capacity is domestic, the iteration is measured in weeks, and nobody else holds a veto over what gets built."
 UKR_lahuna_recon_ship_idea_1: "Simferopol Reconnaissance Ship"
 UKR_lahuna_recon_ship_idea_1_desc: "A hull that looks like a fishing boat, listening to everything within the horizon."
 UKR_lahuna_recon_ship_idea_2: "Simferopol Reconnaissance Ship"
 UKR_lahuna_recon_ship_idea_2_desc: "A hull that looks like a fishing boat, listening to everything even over the horizon."
 UKR_lahuna_recon_ship_idea_3: "Simferopol Reconnaissance Ship"
 UKR_lahuna_recon_ship_idea_3_desc: "A specific-built hull that looks like a civil vessel, listening to everything within the horizon."
 UKR_lahuna_recon_ship_idea_4: "Simferopol Reconnaissance Ship"
 UKR_lahuna_recon_ship_idea_4_desc: "A specific-built hull that looks like a civil vessel, listening to everything even over the horizon."
 UKR_lahuna_recon_ship: "Lahuna-class Sensor Suite"
 UKR_reorganize_navy_category: "Reorganize Ukrainian Navy"
 UKR_reorganize_navy_category_desc: "\n\n\n\n\n\n£UKR_desctext_reorganize_navy\n\n\n\n\n\n\n\n\nDecisions within this category will help us to reorganize and improve our Navy.\nWe will have both kinds of options here: to refit/finish construction of older Soviet-designed ships and finalize concepts of new domestic designs.\nHowever, some choices we select may have unwanted negative effects."
 UKR_reorganize_navy_finish_ternopil_construction: "Finish the construction of §GTernopil §YProject 1124MU§! corvette§!"
 UKR_reorganize_navy_finish_ternopil_construction_desc: "\n\n\n\n\n\n£UKR_desctext_ternopil_corvette_for_tooltip\n\n\n\n\n\n\n\n\nWe can allocate some budget in order to finally finish the prolonged production of §YU209 'Ternopil'§! 'Project 1124MU' corvette."
 UKR_reorganize_navy_choose_future_corvette: "Choose the main future corvette type"
 UKR_reorganize_navy_choose_future_corvette_desc: "\n\n\n\n\n\n£UKR_desctext_future_corvette_for_tooltip\n\n\n\n\n\n\n\n\nWe can choose the preferable size and type of future corvettes - our Navy's working horse."
 UKR_reorganize_navy_build_project_58250_corvette: "Start production of §YProject 58250§! §G'Volodymyr Velykyi' Class§! corvettes"
 UKR_reorganize_navy_build_project_58250_corvette_desc: "\n\n\n\n\n\n£UKR_desctext_project_58250_for_tooltip\n\n\n\n\n\n\n\n\nThe §Y'Volodymyr Velykyi'§! class (or §YProject 58250§! class) is a class of multipurpose corvettes ordered by the Ukrainian Navy.\nThe new ship was projected to be a little bigger than a corvette, but smaller than a frigate.\nThe new project was developed in 2008 by State Research and Design Shipbuilding Center.\nFrom the beginning of program there was discussion of about 10 such ships.\n\nWe can choose exact amount of corvettes to be built with this decision."
 UKR_reorganize_navy_restore_1124: "Examine §G2 §YProject 1124§! corvettes§! for possible reactivation"
 UKR_reorganize_navy_restore_1124_desc: "\n\n\n\n\n\n£UKR_desctext_project_1124_for_tooltip\n\n\n\n\n\n\n\n\nWe can check for possibility to return from decommission 2 of our 'Project 1124' corvettes.\nDuring the 1997 partition of Black Sea Fleet of USSR, §R'MPK-43'§! (renamed to §YU209 'Sumy'§!) and §R'MPK-52§! (renamed to §YU210 'Kherson'§!) were transferred to Ukraine but due to sabotage from Russian side both ships were in a state of non-combat readiness.\nDue to lack of funds for required extensive maintenance and repairs, both ships were written off and disposed of dury shortly after joining the Ukrainian Navy.\nAs those ships have not yet been scrapped, we can rewind our original decision, search for some money and refurbish them.\nBe aware, that this decision will cost us a lot and will provide us with 2 moderate corvettes instead of possibility to invest into procurement of modern ships."
 UKR_reorganize_navy_buy_lithuanian_1124: "Express a desire to buy §G2 §YProject 1124§! corvettes§!\nfrom Lithuania"
 UKR_reorganize_navy_buy_lithuanian_1124_desc: "\n\n\n\n\n\n£UKR_desctext_lithuanian_corvettes_for_tooltip\n\n\n\n\n\n\n\n\nWe can send a diplomatic request to Lithuania to consider the possible sale of 2 corvettes of the 'Project 1124', named §YF11 'Žemaitis'§! and §YF12 'Aukštaitis'§! to us.\nThese 2 ships were transferred to the Armed Forces of Lithuania after the collapse of the USSR and are relatively old combat units.\nNevertheless, these are the same type of ships we already have in our Navy, so their training, maintenance and combat use will not be a problem for us.\nHowever, the purchase of these ships will reduce the amount of available funds for the possible procurement of newer ships."
 UKR_reorganize_navy_maintain_1135: "Maintain §G3 §YProject 1135§! frigates§!"
 UKR_reorganize_navy_maintain_1135_desc: "\n\n\n\n\n\n£UKR_desctext_project_1135_for_tooltip\n\n\n\n\n\n\n\n\nWe can fund our Navy to properly maintain and return to active service 3 of our 'Project 1135' frigates.\nIn July 1997, in accordance with the Ukrainian-Russian agreement on the parameters of the distribution of the Black Sea Fleet, three patrol ships of the Black Sea Fleet of the USSR were transferred to Ukraine: §R'Razitelnyi'§! (renamed §YU132 'Sevastopol'§!), §R'Bezukoriznennyi'§! (renamed §YU133 'Mykolayiv'§!) and §R'Bezzavetnyi'§! (renamed §YU134 'Dnipropetrovsk'§!).\nHowever, all three were not used as combat units due to the lack of funds for repairs and restoration of technical readiness and were soon decommissioned."
 UKR_reorganize_navy_maintain_1241: "Maintain §G3 §YProject 1241§! small corvettes§!"
 UKR_reorganize_navy_maintain_1241_desc: "\n\n\n\n\n\n£UKR_desctext_project_1241_for_tooltip\n\n\n\n\n\n\n\n\nWe can fund our Navy to give proper maintenance and return to active service 3 of our 'Project 1241' small corvettes.\nIn 1997, during the partition of the Black Sea Fleet, Ukraine received 4 corvettes of 'Project 1241' type in 2 different roles: 2 missile boats, §YU155 'Nikopol'§! and §YU156 'Kremenchuk'§!, and 2 small ASW corvettes: §YU207 'Uzhhorod'§! and §YU208 'Khmelnytskyi'§!. Only §YU155 'Nikopol'§! missile boat was transferred in good condition, other 3 vessels were delivered in a state of non-combat readiness and due to lack of funds for repairs and restoration of technical readiness they are still not in active service."
 UKR_reorganize_navy_maintain_641_submarine: "Maintain the §GZaporizhzhia §YProject 641§! submarine§!"
 UKR_reorganize_navy_maintain_641_submarine_desc: "\n\n\n\n\n\n£UKR_desctext_zaporizhzhia_submarine_for_tooltip\n\n\n\n\n\n\n\n\nWe can fund our Navy to properly maintain and return to active service our only submarine - §YU01 'Zaporizhzhia'§! of 'Project 641'.\nIn 1997 unable to fix the unused submarine, the administration of Russian Navy handed it over to the Ukrainian Navy during the partition of the Black Sea Fleet.\nUnfortunately, the submarine's batteries permanently failed and she required complete maintenance and replacement of batteries in order to function.\nWe may allocate some funds to proceed with repairing the submarine."
 UKR_reorganize_navy_finish_11451: "Finish the construction of §G2 §YProject 11451§! corvettes§!"
 UKR_reorganize_navy_finish_11451_desc: "\n\n\n\n\n\n£UKR_desctext_project_11451_for_tooltip\n\n\n\n\n\n\n\n\n'Project 11451' is a serie of small anti-submarine ships (corvettes) built at the Feodosiya Shipyard 'More' since 1987, only 2 were built before the dissolution of USSR.\nCorvettes §YU201 'Lviv'§! (construction readiness near 95%) and §YU203 'Luhansk'§! (construction readiness near 60%) continue to be at the slipway of naval yard 'More' in Feodosiya.\nDue to the termination of state funding, the completion of the ships was suspended, but now their further fate can be chosen at last."
 UKR_reorganize_navy_finish_ukrayina: "Finish the construction of §GUkrayina§!\n§YProject 1164§! cruiser"
 UKR_reorganize_navy_finish_ukrayina_desc: "\n\n\n\n\n\n£UKR_desctext_ukrayina_cruiser_for_tooltip\n\n\n\n\n\n\n\n\n§Y'Ukrayina'§! is an unfinished soviet design 'Project 1164 Class' cruiser.\nDue to budget constraints work on the cruiser stopped in the early 1990s and the ship was left unfinished. In 1993 the cruiser was withdrawn from the Russian Navy and passed to Ukraine.\nWe can invest a handfull of money into finishing the construction and then we'll show the true naval power of Ukraine in the Black Sea!"
 UKR_reorganize_navy_finish_ternopil_construction_flag: " Completed decision Finish the construction of §GTernopil§! §YProject 1124MU§! §Gcorvette§!"
 UKR_reorganize_navy_funded_project_58250_corvette_development_flag: " Completed event §YFocus on multi-purpose corvettes§! with selected option §GLet's allocate budget§!"
 UKR_reorganize_navy_not_funded_project_58250_corvette_development_flag: " Completed event §YFocus on multi-purpose corvettes§! with selected option §RLet's cut our expenses§!"
 UKR_reorganize_navy_developed_project_58250_corvette_development_flag: " Completed event §YBuild the Project 58200 'Hayduk-21' Class corvettes§!"
 UKR_reorganize_navy_repair_rivne: "Repair §GRivne§! §YProject 1171§! large landing ship"
 UKR_reorganize_navy_repair_rivne_desc: "\n\n\n\n\n\n£UKR_desctext_rivne_lst_for_tooltip\n\n\n\n\n\n\n\n\nWe can fund our Navy to properly maintain and return to active service the large landing ship §YU762 'Rivne'§! of 'Project 1171'.\nOn April 10, 1994, a military camp in the Practical Harbor of the Odesa Sea Port was forcibly seized by an Ukrainian airborne assault company from Bolhrad, where the 'Project 1171' 'Ilya Azarov' and the 'Project 773' SDK-137 LSTs were located, and on April 18, 1994, by a unilateral act, the ship was accepted into the Navy of the Armed Forces of Ukraine.\nUnfortunately, due to lack of funds for repairs and restoration of technical readiness, the bigger ship has become inoperable as a LST platform, and was reclassified as dry cargo military transport ship and is currently in non-combat readiness.\nWe can allocate some funds to proceed with repairing the ship and return it to active service as a LST or at least as a support ship."
 UKR_reorganize_navy_repair_support_ships: "Repair §G4§! §Ysupport§! and §Yrepair§! ships, currently in non-combat readiness"
 UKR_reorganize_navy_repair_support_ships_desc: "\n\n\n\n\n\n£UKR_desctext_support_ships_for_tooltip\n\n\n\n\n\n\n\n\nWe can fund our Navy to properly maintain and return to active service a couple of support shipd, like large sea tanker §YU757 'Makiyivka'§!, medium tanker §YU758 'Kerch'§!, small tanker §YU759 'Bakhmach'§! and floating workshop §Y'Olviya'§!.\nIn 2000 all four mentioned ships were not used as active units due to the lack of funds for repairs and restoration of technical readiness and were soon decommissioned."
 UKR_reorganize_navy_build_lahuna_recon_ship: "Project §YLahuna§!: a §Yreconnaissance§! ship"
 UKR_reorganize_navy_build_lahuna_recon_ship_desc: "\n\n\n\n\n\n£UKR_desctext_simferopol_recon_for_tooltip\n\n\n\n\n\n\n\n\nThe Navy wants a signals intelligence ship and has no money for a purpose-designed one. Kuznya na Rybalskomu has a trawler hull, a slipway and four decades of experience building the same 1,220-tonne boat over and over.\n\nFifty-five metres, 29 crew, 7,200 miles of range, twenty-eight days at sea. Her weapon is the aerial farm."
 UKR_lahuna_needs_kuznya_tt: "We must control the Kyiv shipyard"
 UKR_lahuna_needs_black_sea_port_tt: "We must own a Black Sea port to receive her"
 UKR_lahuna_progress_tt: "Lahuna construction progress increases"
 ukraine_reorganize_navy_restore_1124.1.name: "Reactivation of 2 'Project 1124' corvettes"
 ukraine_reorganize_navy_restore_1124.1.desc: "We have examined 2 hulls of 'Project 1124' corvettes, 'U204 Sumy' (number changed due to new corvette, 'Ternopil', taking U209 pennant number) and 'U210 Kherson', and now can select the best suited direction we will move forward in our decision on their fate.\nWe can either invest more money and reactivate both ships or scrap the worse condition ship, 'U210 Kherson', and use parts from it to reactivate 'U204 Sumy' faster."
 ukraine_reorganize_navy_restore_1124.1.a: "Reactivate both ships"
 ukraine_reorganize_navy_restore_1124.1.b: "Cannibalize 'Kherson' to reactivate 'Sumy'"
 ukraine_reorganize_navy_choose_future_corvette.1.name: "Future Ukrainian corvette programm"
 ukraine_reorganize_navy_choose_future_corvette.1.desc: "We are at the point right now, that our decision to choose the future main working horse of our fleet can't be postponed no more.\nWe may choose between a handful of domestic designs, but main decision should be chosen what corvette type will we focus our resources on: more cheaper, easier to produce light corvettes of approximately 700 tonns, standard corvettes of 1 200+ tonns or heavy multi-purpose corvettes of 2 000+ tonns of displacement."
 ukraine_reorganize_navy_choose_future_corvette.1.a: "Light corvettes"
 ukraine_reorganize_navy_choose_future_corvette.1.b: "Standard corvettes"
 ukraine_reorganize_navy_choose_future_corvette.1.c: "Multi-purpose corvettes"
 ukraine_reorganize_navy_choose_future_corvette.2.name: "Focus on smaller corvettes"
 ukraine_reorganize_navy_choose_future_corvette.2.desc: "We choosed the most cheaper option among all available, and we will proceed with 'Muson'-Class corvettes as our newest fleet addition.\nLet's select the amount of ships we will agree to build."
 ukraine_reorganize_navy_choose_future_corvette.2.a: "16 ships (4x4)"
 ukraine_reorganize_navy_choose_future_corvette.2.b: "12 ships (4x3)"
 ukraine_reorganize_navy_choose_future_corvette.2.c: "8 ships (2x4)"
 ukraine_reorganize_navy_choose_future_corvette.3.name: "Focus on standard corvettes"
 ukraine_reorganize_navy_choose_future_corvette.3.desc: "We choosed the most obvious option among all available, and we will proceed with standard size corvettes as our newest fleet addition.\nLet's select the exact class of ships, that we will build."
 ukraine_reorganize_navy_choose_future_corvette.3.a: "Project 58200 'Hayduk-21' Class"
 ukraine_reorganize_navy_choose_future_corvette.3.b: "'Mistral-1500T' Class"
 ukraine_reorganize_navy_choose_future_corvette.3.c: "'Mirazh' Class"
 ukraine_reorganize_navy_choose_future_corvette.4.name: "Focus on multi-purpose corvettes"
 ukraine_reorganize_navy_choose_future_corvette.4.desc: "We choosed the most potent option among all available, and we will proceed with bigger multi-purpose corvettes as our newest fleet addition.\nThese will be the Project 58250 'Volodymyr Velykyi' Class corvettes.\nUnfortunately, we do not have exact developed model right now, so we will need to spend some money and time to research it."
 ukraine_reorganize_navy_choose_future_corvette.4.a: "Let's allocate budget"
 ukraine_reorganize_navy_choose_future_corvette.4.b: "Let's cut our expenses"
 ukraine_reorganize_navy_choose_future_corvette.5.name: "Build the Project 58200 'Hayduk-21' Class corvettes"
 ukraine_reorganize_navy_choose_future_corvette.5.desc: "As a result of our independent tender process, we've selected the Project 58200 'Hayduk-21' Class corvettes as our newest fleet addition.\nLet's select the amount of ships we will agree to build."
 ukraine_reorganize_navy_choose_future_corvette.5.a: "12 ships (4x3)"
 ukraine_reorganize_navy_choose_future_corvette.5.b: "8 ships (4x2)"
 ukraine_reorganize_navy_choose_future_corvette.5.c: "6 ships (2x3)"
 ukraine_reorganize_navy_choose_future_corvette.6.name: "Build the 'Mistral-1500T' Class corvettes"
 ukraine_reorganize_navy_choose_future_corvette.6.desc: "As a result of our independent tender process, we've selected the 'Mistral-1500T' Class corvettes as our newest fleet addition.\nLet's select the amount of ships we will agree to build."
 ukraine_reorganize_navy_choose_future_corvette.6.a: "12 ships (4x3)"
 ukraine_reorganize_navy_choose_future_corvette.6.b: "8 ships (4x2)"
 ukraine_reorganize_navy_choose_future_corvette.6.c: "6 ships (2x3)"
 ukraine_reorganize_navy_choose_future_corvette.7.name: "Build the 'Mirazh' Class corvettes"
 ukraine_reorganize_navy_choose_future_corvette.7.desc: "As a result of our independent tender process, we've selected the 'Mirazh' Class corvettes as our newest fleet addition.\nLet's select the amount of ships we will agree to build."
 ukraine_reorganize_navy_choose_future_corvette.7.a: "12 ships (4x3)"
 ukraine_reorganize_navy_choose_future_corvette.7.b: "8 ships (4x2)"
 ukraine_reorganize_navy_choose_future_corvette.7.c: "6 ships (2x3)"
 ukraine_reorganize_navy_choose_future_corvette.8.name: "Build the Project 58250 'Volodymyr Velykyi' Class corvettes"
 ukraine_reorganize_navy_choose_future_corvette.8.desc: "As a result of our independent tender process, we've selected the Project 58250 'Volodymyr Velykyi' Class corvettes as our newest fleet addition.\nLet's select the amount of ships we will agree to build."
 ukraine_reorganize_navy_choose_future_corvette.8.a: "10 ships (2x5)"
 ukraine_reorganize_navy_choose_future_corvette.8.b: "8 ships (2x4)"
 ukraine_reorganize_navy_choose_future_corvette.8.c: "4 ships (2x2)"
 ukraine_reorganize_navy_buy_lithuanian_1124.1.name: "The results of the meeting with Lithuania\nregarding the possibility of purchasing 2 'Project 1124' corvettes"
 ukraine_reorganize_navy_buy_lithuanian_1124.1.desc: "Following our meeting with Lithuanian colleagues regarding the potential purchase of 2 'Project 1124' corvettes, we received generally positive results, as Lithuania is in favour of this decision.\nHowever, they need to consult with Russia to negotiate approval for this sale and possible outcomes for their country.\nWe now face a decision: we can offer more money and additional trade opportunities to persuade them to disregard Moscow's opinion, or we can wait for the natural outcome of their consultation."
 ukraine_reorganize_navy_buy_lithuanian_1124.1.a: "We will try to convince them"
 ukraine_reorganize_navy_buy_lithuanian_1124.1.b: "We will wait"
 ukraine_reorganize_navy_buy_lithuanian_1124.2.name: "The second round of negotiations with Lithuania\nregarding the purchase of corvettes"
 ukraine_reorganize_navy_buy_lithuanian_1124.2.desc: "Since the previous negotiations between our countries did not allow us to obtain the expected positive result, we decided to intensify our efforts.\nAs a result of the second round, we agreed on the purchase of 2 corvettes under the following conditions: the expansion of trade between our countries and the conclusion of an agreement to supply some amounts of steel and coal, additional compensation from our side for the purchase of a new ship for the Lithuanian fleet, the transfer of certain military technologies that were previously unavailable for them.\nDo we accept these terms?"
 ukraine_reorganize_navy_buy_lithuanian_1124.2.a: "Yes, for sure"
 ukraine_reorganize_navy_buy_lithuanian_1124.2.b: "No, it's unaffordable"
 ukraine_reorganize_navy_buy_lithuanian_1124.3.name: "Results of consultations between Lithuania and Russia\nregarding the possibility of selling corvettes"
 ukraine_reorganize_navy_buy_lithuanian_1124.3.desc: "Our Lithuanian partners held the desired negotiations with the Russian side regarding the possible sale to us of 2 Soviet-built corvettes.\nUnfortunately, Russia did not allow the sale on the terms previously agreed between us and Lithuania, but expressed a desire to hold additional consultations with us.\nNow we have 2 options for the further development of events: either to abandon the initial idea, or to continue negotiations with Russia on its terms."
 ukraine_reorganize_navy_buy_lithuanian_1124.3.a: "Abandon the purchase of corvettes"
 ukraine_reorganize_navy_buy_lithuanian_1124.3.b: "Conduct negotiations with Russia"
 ukraine_reorganize_navy_buy_lithuanian_1124.4.name: "Results of negotiations between Ukraine and Russia\nregarding the possibility of purchasing corvettes"
 ukraine_reorganize_navy_buy_lithuanian_1124.4.desc: "We held uncomfortable but necessary negotiations with Russia. Unfortunately, they spoke from a position of strength in these negotiations, and we had nothing to answer them.\nRussia presented us with the following ultimatum for granting permission to Lithuania for the sale of 2 corvettes: allocation of additional place for the needs of the Russian Black Sea Fleet base in Sevastopol, decreasing our movement towards the EU, strengthening of trade between us and additional money compensation to Russia for ships.\nDo we accept these terms?"
 ukraine_reorganize_navy_buy_lithuanian_1124.4.a: "Abandon the idea"
 ukraine_reorganize_navy_buy_lithuanian_1124.4.b: "Agree to Russia's terms"
 ukraine_reorganize_navy_buy_lithuanian_1124.5.name: "Finalizing the agreement on the purchase of corvettes from Lithuania"
 ukraine_reorganize_navy_buy_lithuanian_1124.5.desc: "We have finally agreed to all terms and are able to complete the purchase and transfer of the ships.\nAs a sign of respect to their previous owners, we agreed to name the ships 'Bratslav' and 'Volodymyr', in honor of important cities on the territory of modern Ukraine, which were once a part of the common state, the Grand Duchy of Lithuania, Ruthenia and Zemaitia."
 ukraine_reorganize_navy_buy_lithuanian_1124.5.a: "Great!"
 ukraine_reorganize_navy_maintain_1135.1.name: "Maintenance of 3 'Project 1135' frigates"
 ukraine_reorganize_navy_maintain_1135.1.desc: "We have examined 3 hulls of 'Project 1135' frigates, 'Sevastopol', 'Mykolayiv' and 'Dnipropetrovsk', and now can select the best suited direction we will move forward in our decision on their fate.\nWe can either invest more money and repair all 3 ships or just focus on the most modern and potent ones."
 ukraine_reorganize_navy_maintain_1135.1.a: "Maintain all 3 ships"
 ukraine_reorganize_navy_maintain_1135.1.b: "Maintain only 'Sevastopol' and 'Mykolayiv'"
 ukraine_reorganize_navy_maintain_1135.1.c: "Maintain only the most modern one, 'Sevastopol'"
 ukraine_reorganize_navy_finish_11451.1.name: "Finish construction of 2 'Project 11451' corvettes"
 ukraine_reorganize_navy_finish_11451.1.desc: "We have examined 2 hulls of 'Project 11451' corvettes, 'Lviv' and 'Luhansk', and now can select the best suited direction we will move forward in our decision on their fate.\n\nWe can either invest more money and finish construction of both ships or scrap the worse condition ship, 'Luhansk', and use parts from it to build 'Lviv' faster."
 ukraine_reorganize_navy_finish_11451.1.a: "Finish both ships"
 ukraine_reorganize_navy_finish_11451.1.b: "Cannibalize 'Luhansk' to finish 'Lviv'"
 ukraine_reorganize_navy_maintain_1241.1.name: "Maintain 3 'Project 1241' small corvettes"
 ukraine_reorganize_navy_maintain_1241.1.desc: "We have examined 3 hulls of our 'Project 1241' small corvettes, U156 'Kremenchuk' missile boat and U207 'Uzhhorod' and U208 'Khmelnytskyi' small ASW corvettes.\nNow we can select the best suited direction we will move forward in our decision on their fate.\nWe can either invest more money and repair all 3 ships or just focus on the one with highest chance to repair among them."
 ukraine_reorganize_navy_maintain_1241.1.a: "Maintain all 3 ships"
 ukraine_reorganize_navy_maintain_1241.1.b: "Maintain only U208 'Khmelnytskyi'"
 ukraine_reorganize_navy_maintain_1241.2.name: "Completion of repair of 'U156 'Kremenchuk' missile boat"
 ukraine_reorganize_navy_maintain_1241.2.desc: "We have completed the repair of 'U156 'Kremenchuk' missile boat and it is now ready for active service.\nNow we will continue with repairing of U207 'Uzhhorod' and U208 'Khmelnytskyi' small ASW corvettes."
 ukraine_reorganize_navy_maintain_1241.2.a: "Great, let's continue"
 ukraine_reorganize_navy_maintain_1241.3.name: "Completion of repair of 'U207 'Uzhhorod' small ASW corvette"
 ukraine_reorganize_navy_maintain_1241.3.desc: "We have completed the repair of 'U207 'Uzhhorod' small ASW corvette and it is now ready for active service.\nWe will double down on finishing repair of U208 'Khmelnytskyi' small ASW corvette now."
 ukraine_reorganize_navy_maintain_1241.3.a: "Great, let's continue"
 ukraine_reorganize_navy_maintain_1241.4.name: "Completion of repair of 'U208 'Khmelnytskyi' small ASW corvette"
 ukraine_reorganize_navy_maintain_1241.4.desc: "We have completed the repair of 'U208 'Khmelnytskyi' small ASW corvette and it is now ready for active service.\nAll 4 'Project 1241' small corvettes are in active service now."
 ukraine_reorganize_navy_maintain_1241.4.a: "Great, all ships are ready"
 ukraine_reorganize_navy_maintain_1241.5.name: "Completion of repair of 'U208 'Khmelnytskyi' small ASW corvette"
 ukraine_reorganize_navy_maintain_1241.5.desc: "Thanks to cannibalizing parts from 3 other 'Project-1241' small corvettes we have completed the repair of 'U208 'Khmelnytskyi' small ASW corvette sooner than expected. It is now ready for active service."
 ukraine_reorganize_navy_maintain_1241.5.a: "Good!"
 ukraine_reorganize_navy_maintain_641_submarine.1.name: "'Zaporizhzhia' submarine - search for batteries"
 ukraine_reorganize_navy_maintain_641_submarine.1.desc: "We have examined the hull of 'Zaporizhzhia' and found a lot of work to do.\n Unfortunately, the main issue right now is absence of batteries: without them the submarine can't move.\nWe may either ask Russia to sell us one of their stockpiled batteries, search over Europe (particularly in Greece) or give order for our local industries to develop the domestic battery for it."
 ukraine_reorganize_navy_maintain_641_submarine.1.a: "Buy from Russia"
 ukraine_reorganize_navy_maintain_641_submarine.1.b: "Search in Europe"
 ukraine_reorganize_navy_maintain_641_submarine.1.c: "Develop domestically"
 ukraine_reorganize_navy_maintain_641_submarine_batteries_from_RUS_flag: " Completed event §Y'Zaporizhzhia' submarine - search for batteries§! with selected option §RBuy from Russia§!"
 ukraine_reorganize_navy_maintain_641_submarine_batteries_from_GRE_flag: " Completed event §Y'Zaporizhzhia' submarine - search for batteries§! with selected option §BSearch in Europe§!"
 ukraine_reorganize_navy_maintain_641_submarine.2.name: "'Zaporizhzhia' submarine - purchase of batteries"
 ukraine_reorganize_navy_maintain_641_submarine.2.desc: "Finally, we agreed on purchase conditions with our partner country, and after the prepayments were completed, the wait for delivery has begun.\nIt may seems unbelievable, but we received so desperately needed equipment withtin previously agreed terms.\nNow we can only say our thanks to our parter and continue with repair."
 ukraine_reorganize_navy_maintain_641_submarine.2.a: "Thanks Russia, continue with repair"
 ukraine_reorganize_navy_maintain_641_submarine.2.b: "Thanks Greece, continue with repair"
 ukraine_reorganize_navy_maintain_641_submarine.3.name: "'Zaporizhzhia' submarine - domestic development of batteries"
 ukraine_reorganize_navy_maintain_641_submarine.3.desc: "The task to locally develop the batteries for 'Zaporizhzhia' submarine was not an easy one.\nAt last, we have received what we wnated, but the actual costs were higher, than we expected.\nNevertheless we can continue with the repair of the submarine."
 ukraine_reorganize_navy_maintain_641_submarine.3.a: "We achieved this milestone, continue with repair"
 ukraine_reorganize_navy_maintain_641_submarine.4.name: "'Zaporizhzhia' submarine - finish the repair"
 ukraine_reorganize_navy_maintain_641_submarine.4.desc: "We managed to install the new batteries, repair and maintain all non-functional equipment and at last we can start the actual sea trials.\n\nWe can make the basic programm and save money and time or extensive one, which will require more resources, but we may found some of additional issues and resolve them quickly."
 ukraine_reorganize_navy_maintain_641_submarine.4.a: "Start basic sea trials"
 ukraine_reorganize_navy_maintain_641_submarine.4.b: "Start extended sea trials"
 ukraine_reorganize_navy_maintain_641_submarine_extended_sea_trials_bonus: "Additional reliability as a result of extended sea trials for 'Zaporizhzhia' submarine"
 ukraine_reorganize_navy_maintain_641_submarine.5.name: "'Zaporizhzhia' submarine - commission the submarine"
 ukraine_reorganize_navy_maintain_641_submarine.5.desc: "Finally we have made all required purchases, replacements, installations, maintenance, repairs and sea trials in order for 'Zaporizhzhia' to be fully commissioned into Ukrainian Navy!"
 ukraine_reorganize_navy_maintain_641_submarine.5.a: "Finally!"
 ukraine_reorganize_navy_finish_ukrayina.1.name: "Finish cruiser 'Ukrayina' - Missing equipment issues"
 ukraine_reorganize_navy_finish_ukrayina.1.desc: "Under direct control of our President, we have finally made a decision to finish the construction of 'Ukrayina' cruiser of soviet 'Project 1164 Class'.\nWe examined the hull and made a comprehemsive list of missing equipment.\nNow we need to make another step and decide what should we do: ask Russia for permission to procure original equipment from them (mainly ASMs and SAMs systems) or contact Western countries and search for possibility to replace it with their counterparts.\nPlease, note, that you should have at least 40+ opinion from USA or 25+ opinion from France in order to ask for western equipment.\n\n\n§GThis is step 1 of §R3§!, §R4§! or §R6§!§!"
 ukraine_reorganize_navy_finish_ukrayina.1.a: "Stick with original russian equipment"
 ukraine_reorganize_navy_finish_ukrayina.1.b: "Examine possible Western replacement"
 ukraine_reorganize_navy_finish_ukrayina.2.name: "Finish cruiser 'Ukrayina' - Purchase of russian equipment"
 ukraine_reorganize_navy_finish_ukrayina.2.desc: "As we choose to stick to the original soviet design with finishing the construction of 'Ukrayina' cruiser, we started negotiations with Russia on missing equipment procurement.\nIt will take us a lot of money and time to receive the required components.\n\n\n§GThis is step 2 of 3§!"
 ukraine_reorganize_navy_finish_ukrayina.2.a: "We will pay and wait"
 ukraine_reorganize_navy_finish_ukrayina.3.name: "Finish cruiser 'Ukrayina' - Russian equipment received"
 ukraine_reorganize_navy_finish_ukrayina.3.desc: "At last, the needed components were provided by Russia and we can start the installation process and finish the construction. Hope it will not take ages.\n\n\n§GThis is the final step§!"
 ukraine_reorganize_navy_finish_ukrayina.3.a: "Start the production"
 ukraine_reorganize_navy_finish_ukrayina.4.name: "Finish cruiser 'Ukrayina' - Replace the missiles"
 ukraine_reorganize_navy_finish_ukrayina.4.desc: "We may search for all possible variants of Western equipment on market to replace the missing Soviet P-500 'Granit' anti-ship missiles and S-300F 'Fort' surface-to-air missiles.\nWe have to choose between a couple of possible options.\n\n\n§GThis is step 2 of §R4§! or §R6§!§!"
 ukraine_reorganize_navy_finish_ukrayina.4.a: "Choose American Missiles"
 ukraine_reorganize_navy_finish_ukrayina.4.b: "Choose French Missiles"
 ukraine_reorganize_navy_finish_ukrayina.4.c: "Choose Swedish Missiles"
 ukraine_reorganize_navy_finish_ukrayina.5.name: "Finish cruiser 'Ukrayina' - American missiles"
 ukraine_reorganize_navy_finish_ukrayina.5.desc: "As we have selected USA as the provider for new missiles for the 'Ukrayina' cruiser, we started negotiations with them to procure both RGM-84D Harpoon Block 1C anti-ship missiles and RIM-66M-2 Block IIIA surface-to-air missiles.\nIt will take us a lot of money and time to receive the required components.\n\n\n§GThis is step 3 of §R4§!§!"
 ukraine_reorganize_navy_finish_ukrayina.5.a: "We will pay and wait"
 ukraine_reorganize_navy_finish_ukrayina.6.name: "Finish cruiser 'Ukrayina' - French missiles"
 ukraine_reorganize_navy_finish_ukrayina.6.desc: "As we have selected France as the provider for new missiles for the 'Ukrayina' cruiser, we started negotiations with them to procure both Exocet MM40 Block 2 anti-ship missiles and Aster 30 Block 2 surface-to-air missiles.\nIt will take us a lot of money and time to receive the required components.\n\n\n§GThis is step 3 of §R4§!§!"
 ukraine_reorganize_navy_finish_ukrayina.6.a: "We will pay and wait"
 ukraine_reorganize_navy_finish_ukrayina.7.name: "Finish cruiser 'Ukrayina' - Swedish AShMs"
 ukraine_reorganize_navy_finish_ukrayina.7.desc: "As we have selected Sweden as the provider for new RBS 15 Mk. III anti-ship missiles for the 'Ukrayina' cruiser, we started negotiations with them to procure those equipment.\nIt will take us a lot of money and time to receive the required components.\n\n\n§GThis is step 3 of §R6§!§!"
 ukraine_reorganize_navy_finish_ukrayina.7.a: "We will pay and wait"
 ukraine_reorganize_navy_finish_ukrayina.8.name: "Finish cruiser 'Ukrayina' - Replace the surface-to-air missiles"
 ukraine_reorganize_navy_finish_ukrayina.8.desc: "After the selection of most modern Swedish anti-ship missiles we still have to choose what equipment will replace the Soviet S-300F 'Fort' surface-to-air missiles.\nWe have only 2 possible options to choose from.\n\n\n§GThis is step 4 of §R6§!§!"
 ukraine_reorganize_navy_finish_ukrayina.8.a: "Choose American RIM-66M-2 Block IIIA"
 ukraine_reorganize_navy_finish_ukrayina.8.b: "Choose French Aster 30 Block 2"
 ukraine_reorganize_navy_finish_ukrayina.9.name: "Finish cruiser 'Ukrayina' - American RIM-66 SAMs"
 ukraine_reorganize_navy_finish_ukrayina.9.desc: "As we have selected USA as the provider for new surface-to-air missiles for the 'Ukrayina' cruiser, we started negotiations with them to procure those equipment.\nIt will take us a lot of money and time to receive the required components.\n\n\n§GThis is step 5 of §R6§!§!"
 ukraine_reorganize_navy_finish_ukrayina.9.a: "We will pay and wait"
 ukraine_reorganize_navy_finish_ukrayina.10.name: "Finish cruiser 'Ukrayina' - French Aster 30 SAMs"
 ukraine_reorganize_navy_finish_ukrayina.10.desc: "As we have selected France as the provider for new surface-to-air missiles for the 'Ukrayina' cruiser, we started negotiations with them to procure those equipment.\nIt will take us a lot of money and time to receive the required components.\n\n\n§GThis is step 5 of §R6§!§!"
 ukraine_reorganize_navy_finish_ukrayina.10.a: "We will pay and wait"
 ukraine_reorganize_navy_finish_ukrayina.11.name: "Finish cruiser 'Ukrayina' - All equipment received"
 ukraine_reorganize_navy_finish_ukrayina.11.desc: "All the required components were provided by the producers in accordance to previously agreed terms and conditions, and we can start the installation process and finish the construction. Hope it will not take ages.\n\n\n§GThis is the final step§!"
 ukraine_reorganize_navy_finish_ukrayina.11.a: "Start the production"
 ukraine_reorganize_navy_repair_rivne.1.name: "Repair of 'Rivne' LST - Select the way to proceed"
 ukraine_reorganize_navy_repair_rivne.1.desc: "Due to curent status of 'Rivne' LST, we have to make a decision on how to proceed with the repair and maintenance of this ship.\nWe can either invest more money and repair it fully to it's original LST shape or just focus on the most critical systems to make it operational as a support transport ship."
 ukraine_reorganize_navy_repair_rivne.1.a: "Repair as LST"
 ukraine_reorganize_navy_repair_rivne.1.b: "Repair as support ship"
 ukraine_reorganize_navy_repair_rivne.2.name: "Repair of 'Rivne' as LST is finished"
 ukraine_reorganize_navy_repair_rivne.2.desc: "As we have selected to repair 'Rivne' as a full-fledged landing ship, we have completed all required repairs and maintenance and it is now ready for active service."
 ukraine_reorganize_navy_repair_rivne.2.a: "Great!"
 ukraine_reorganize_navy_repair_rivne.3.name: "Repair of 'Rivne' as support ship is finished"
 ukraine_reorganize_navy_repair_rivne.3.desc: "As we have selected to repair 'Rivne' as a support ship, we have completed all required repairs and maintenance and it is now ready for active service."
 ukraine_reorganize_navy_repair_rivne.3.a: "Great!"
 ukraine_reorganize_navy_repair_support_ships.1.name: "Repair of support ships - Select the way to proceed"
 ukraine_reorganize_navy_repair_support_ships.1.desc: "Due to curent status of our support ships, we have to make a decision on how to proceed with the repair and maintenance of these ships.\nWe can either invest more money and repair all 4 of them or prioritize based on their importance and available funds."
 ukraine_reorganize_navy_repair_support_ships.1.a: "We need them all"
 ukraine_reorganize_navy_repair_support_ships.1.b: "1 Support and 1 Repair"
 ukraine_reorganize_navy_repair_support_ships.1.c: "We can afford only 1"
 ukraine_reorganize_navy_repair_support_ships.2.name: "Repair of support ships - All 4 ships will be repaired"
 ukraine_reorganize_navy_repair_support_ships.2.desc: "As we've made the decision to repair all 4 support ships, it's time to select preferrable way to proceed with it.\nWe can either provide all ships with dedicated dockyards, that are currently available at government's disposal, and repair them without investing much funds or we can invest more money and repair them faster by using additional private dockyards."
 ukraine_reorganize_navy_repair_support_ships.2.a: "Use only government dockyards"
 ukraine_reorganize_navy_repair_support_ships.2.b: "Pay for private dockyards"
 ukraine_reorganize_navy_repair_support_ships.3.name: "Repair of support ships - 1 Support and 1 Repair ship will be repaired"
 ukraine_reorganize_navy_repair_support_ships.3.desc: "As we've made the decision to repair 1 support ship and 1 repair ship, it's time to select preferrable way to proceed with it.\nWe can either provide both ships with dedicated dockyards, that are currently available at government's disposal, and repair them without investing much funds or we can invest more money and repair them faster by using additional private dockyards."
 ukraine_reorganize_navy_repair_support_ships.3.a: "Use only government dockyards"
 ukraine_reorganize_navy_repair_support_ships.3.b: "Pay for private dockyards"
 ukraine_reorganize_navy_repair_support_ships.4.name: "Repair of support ships - Only 1 ship will be repaired"
 ukraine_reorganize_navy_repair_support_ships.4.desc: "As we've made the decision to repair only 1 support ship, it's time to select preferrable way to proceed with it.\nWe can either provide the ship with dedicated dockyard, that is currently available at government's disposal, and repair it without investing much funds or we can invest more money and repair it faster by using additional private dockyard."
 ukraine_reorganize_navy_repair_support_ships.4.a: "Use only government dockyard"
 ukraine_reorganize_navy_repair_support_ships.4.b: "Pay for private dockyard"
 ukraine_reorganize_navy_repair_support_ships.5.name: "Repair of support ships - All 4 ships are repaired"
 ukraine_reorganize_navy_repair_support_ships.5.desc: "As we've completed the repair of all 4 support ships, they are now ready for active service and can provide necessary support to our fleet."
 ukraine_reorganize_navy_repair_support_ships.5.a: "Great!"
 ukraine_reorganize_navy_repair_support_ships.6.name: "Repair of support ships - 1 Support and 1 Repair ship are repaired"
 ukraine_reorganize_navy_repair_support_ships.6.desc: "As we've completed the repair of 1 support ship and 1 repair ship, they are now ready for active service and can provide necessary support to our fleet."
 ukraine_reorganize_navy_repair_support_ships.6.a: "Great!"
 ukraine_reorganize_navy_repair_support_ships.7.name: "Repair of support ships - Only 1 ship is repaired"
 ukraine_reorganize_navy_repair_support_ships.7.desc: "As we've completed the repair of only 1 support ship, it is now ready for active service and can provide necessary support to our fleet."
 ukraine_reorganize_navy_repair_support_ships.7.a: "Great!"
 ukraine_reorganize_navy_built_simferopol_recon_ship.1.name: "Simferopol - A Hull on the Rybalskyi Slipway"
 ukraine_reorganize_navy_built_simferopol_recon_ship.1.desc: "The yard has laid down 347 of these since 1971 and it knows the drawings by heart. There is an unfinished 502EM on the ways right now - a fishing boat, but a fishing boat with the displacement, the range and the endurance we need.\n\nThe alternative is to lay a fresh keel to the same 502EM drawings rather than finish an abandoned one. The yard would be delighted. The Ministry of Finance would not."
 ukraine_reorganize_navy_built_simferopol_recon_ship.1.a: "Convert the trawler hull."
 ukraine_reorganize_navy_built_simferopol_recon_ship.1.b: "Lay a fresh keel to the same drawings."
 ukraine_reorganize_navy_built_simferopol_recon_ship.1.c: "The Navy has more urgent needs."
 ukraine_reorganize_navy_built_simferopol_recon_ship.2.name: "Simferopol - What She Listens With"
 ukraine_reorganize_navy_built_simferopol_recon_ship.2.desc: "The hull is the cheap part. The ship is her antennas, and the question is whose antennas.\n\nOur own institutes can build the passive complex - radio-technical reconnaissance across several bands, classification, direction finding. It will take longer and it will be ours. A Western ELINT package would arrive integrated, tested and expensive, and it would come with strings."
 ukraine_reorganize_navy_built_simferopol_recon_ship.2.a: "Fit a domestic complex."
 ukraine_reorganize_navy_built_simferopol_recon_ship.2.b: "Buy a Western ELINT package."
 ukraine_reorganize_navy_built_simferopol_recon_ship.3.name: "Simferopol - Down the Dnipro"
 ukraine_reorganize_navy_built_simferopol_recon_ship.3.desc: "She goes down the ways at Rybalskyi. Now the awkward part: the yard is in Kyiv, the fleet is in the Black Sea, and between them is six hundred kilometres of river with bridges over it.\n\nThe safe answer is a floating dock the whole way to Kherson and out. The cheap answer is to take her down on her own bottom and hope the draught and the air clearances work out."
 ukraine_reorganize_navy_built_simferopol_recon_ship.3.a: "Move her in a floating dock."
 ukraine_reorganize_navy_built_simferopol_recon_ship.3.b: "Take her down on her own hull."
 ukraine_reorganize_navy_built_simferopol_recon_ship.4.name: "Simferopol - Aground on the Dnipro"
 ukraine_reorganize_navy_built_simferopol_recon_ship.4.desc: "She is stuck below Kherson with damage to her running gear and a very embarrassed delivery crew. The yard says it can be put right. The yard always says that."
 ukraine_reorganize_navy_built_simferopol_recon_ship.4.a: "Pay for the repairs."
 ukraine_reorganize_navy_built_simferopol_recon_ship.4.b: "Leave her at Kherson."
 ukraine_reorganize_navy_built_simferopol_recon_ship.5.name: "Simferopol - Transfer Completed"
 ukraine_reorganize_navy_built_simferopol_recon_ship.5.desc: "We have finally moved our newest recon ship down the Dnipro river succesfully - without any accidents! Now we can start crew training, and after that - we can finally use this precious naval asset to our benefit."
 ukraine_reorganize_navy_built_simferopol_recon_ship.5.a: "At last!"
 UKR_lahuna_program_over: "We have finished construction of Simferopol recon ship"
 UKR_modernize_sov_category: "Modernize Soviet Legacy Equipment"
 UKR_modernize_sov_category_desc: "We can spend time and money researching and testing the upgrades for our main Soviet era Equipment."
 UKR_develop_domestic_category: "Develop Domestic Weapon Systems"
 UKR_develop_domestic_category_desc: "We can spend time and money researching and developing our domestic weapon systems."
 UKR_modernize_bmp1u: "Research §YBMP-1U 'Shkval'§!"
 UKR_modernize_bmp1u_desc: "A limited Ukrainian upgrade of the BMP-1 was developed by the State Scientific and Technical Centre of Artillery and Small Arms in Kyiv.\nThe original turret was replaced with the new KBA-105 Shkval remote weapon station (RWS) which was developed for light armoured vehicles to increase their combat effectiveness."
 UKR_modernize_bmp1m: "Research §YBMP-1M§!"
 UKR_modernize_bmp1m_desc: "Evolved from the BMP-1U, unveiled in 2011.\nThe main difference is the application of the improved KBA-105TB Shkval-A RWS in which the Konkurs ATGM launchers were replaced with the long range Ukrainian Barrier ATGM and uses a new Tandem-2 sighting system and improved SWU-500-3C weapon stabilization system."
 UKR_modernize_bmp1um: "Research §YBMP-1UM§!"
 UKR_modernize_bmp1um_desc: "A more comprehensive upgrade of the standard BMP-1 undertaken by the Zhytomyr Armour Plant and shown publicly in 2015.\nThe 300 hp UTD-20 engine was replaced with a 3-cylinder, two-stroke 3TD-2 diesel motor making 400 hp and the troop compartment layout was improved by raising the hull roof by 15 cm, and the small, un-ergonomic egress doors at the rear of the BMP-1 were replaced by a large ramp, albeit manually operated."
 UKR_modernize_bmp1umd: "Research §YBMP-1UMD§!"
 UKR_modernize_bmp1umd_desc: "A further development of the BMP-1UM from Zhytomyr Armour Plant, unveiled in 2016 at the Arms and Security exhibition.\nThis variant has a new RWS and engine; powered by an electronically controlled Deutz TCD2013 L64V 6-cylinder turbodiesel which produces 330 hp and is more reliable, quieter and efficient than both the UTD-20 and 3TD-2."
 UKR_modernize_bmp1ts: "Research §YBMP-1TS§!"
 UKR_modernize_bmp1ts_desc: "BMP-1TS is a Ukrainian upgrade variant developed by NVK Techimpex, who has been working on a RWS for the BMP-1 named Spys since 2018.\nThe Spys module received the Syntez fire-control system consisting of Kazhan-3K15 sighting complex with both thermal and optical TV cameras as well as a laser rangefinder."
 UKR_modernize_bmp_m1s: "Research §YBMP-M1S§!"
 UKR_modernize_bmp_m1s_desc: "BMP-M1S is an armored combat tracked vehicle that was developed using the own working capital of the Zhytomyr Armored Plant, part of the Ukroboronprom Group of Companies.\nThe new product was presented at the Arms and Security 2018 exhibition in Kyiv.\nThe BMP-M1S is a conversion with a significant increase in firepower, protection level and the replacement of an outdated Soviet engine with a German Deutz one.\nThanks to this, the BMP-M1S can transport up to 8 military personnel and effectively support the actions of infantry units thanks to the great firepower of the 'Stylet' combat module."
 UKR_modernize_bmp1m_praktyka: "Research §YBMP-1M 'Praktyka'§!"
 UKR_modernize_bmp1m_praktyka_desc: "The Ukrainian manufacturer NVO Praktyka demonstrated the BMP-1M armored vehicle in 2021.\nThe updated BMP-1 is equipped with modern equipment instead of the usual two doors-tanks of the landing compartment.\nIt is also noticeable that the height of the body of the combat vehicle has been slightly increased.\nThe modernized BMP also differs from the Soviet model in the presence of the improved combat module 'Spys-Syntez', developed and manufactured by the company NVK Techimpex."
 UKR_modernize_bmp1u_flag: " Completed decision §YResearch BMP-1U§!"
 UKR_modernize_bmp1m_flag: " Completed decision §YResearch BMP-1M§!"
 UKR_modernize_bmp1um_flag: " Completed decision §YResearch BMP-1UM§!"
 UKR_modernize_bmp1umd_flag: " Completed decision §YResearch BMP-1UMD§!"
 UKR_modernize_mt_lbr6: "Research §YMT-LBR6§!"
 UKR_modernize_mt_lbr6_desc: "MT-LBR6 is a light IFV on the MT-LB chassis with the ZTM-1 combat module.\nArmament: 30-mm ZTM-1 automatic cannon, 7.62-mm CT machine gun, smoke grenade launchers of the 902B 'Tucha' system.\nThe protection of the crew is enhanced due to spaced redundancy and Kevlar lining, the undercarriage is covered with anti-cumulative screens.\nManufacturer, Kharkiv Tractor Plant."
 UKR_modernize_mt_lbmsh: "Research §YMT-LBMSh§!"
 UKR_modernize_mt_lbmsh_desc: "MT-LBMSh is a light IFV on the MT-LB chassis with the 'Shkval' combat module.\nArmament: ZTM-1 30-mm automatic cannon, KT-7,62 7.62-mm machine gun paired with it, two Barrier anti-tank guided missiles, 30-mm automatic grenade launcher, smoke grenade launchers.\nSince 2006, it has been produced at the KMDB."
 UKR_modernize_mt_lbr7: "Research §YMT-LBR7§!"
 UKR_modernize_mt_lbr7_desc: "MT-LBR7 is a light IFV on the MT-LB chassis with the 'Shturm' combat module.\nArmament: ZTM-1 30-mm automatic cannon, KT-7,62 7.62-mm machine gun paired with it, two 9M114M 'Konkurs-M' ATGM missile launchers, 30-mm automatic grenade launcher, smoke grenade launchers.\nThe protection of the crew is enhanced due to spaced redundancy and Kevlar lining, the undercarriage is covered with anti-cumulative screens.\nManufacturer, Kharkiv Tractor Plant."
 UKR_modernize_mt_lb_at: "Research §YMT-LB-AT§!"
 UKR_modernize_mt_lb_at_desc: "MT-LB-AT is a modification option for MT-LB, equipped with a rotating platform with armor protection, armed with a 12.7 mm DShKM machine gun."
 UKR_modernize_mt_lb_t_23_2: "Research §YMT-LB-T-23-2§!"
 UKR_modernize_mt_lb_t_23_2_desc: "MT-LB-T-23-2 is a MT-LB modernization option developed by NVK Techimpex.\nIt is equipped with an armored shield and a new sight and it uses with ZU-23-2 as a main armament.\nA demonstration sample was presented on September 21, 2015 at the exhibition 'Arms and Security.'"
 UKR_modernize_mt_lbr6_flag: " Completed decision §YResearch MT-LBR6§!"
 UKR_modernize_mt_lbr7_flag: " Completed decision §YResearch MT-LBR7§!"
 UKR_modernize_mt_lbrmsh_flag: " Completed decision §YResearch MT-LBMSh§!"
 UKR_modernize_brdm_2ld: "Research §YBRDM-2LD§!"
 UKR_modernize_brdm_2ld_desc: "BRDM-2LD is a Ukrainian modernization of BRDM-2 (with side landing hatches and Ukrainian-made SMD-21-08 diesel engine).\nThe development of the armored vehicle was started under the Bulb R&D program in 1999 by specialists from the Kharkiv Mechanical Engineering Design Bureau named after O.O. Morozov, the work on modernizing the BRDM-2 to the BRDM-2LD level was carried out by the Mykolayiv Mechanical Repair Plant.\nDuring field tests, it was found that the installation of a diesel engine made it possible to increase the cross-country ability of the armored vehicle in difficult road conditions and increase the cruising range highway by 25% (from 750 to 1000 km) due to a significant reduction in fuel consumption."
 UKR_modernize_brdm_2m: "Research §YBRDM-2M§!"
 UKR_modernize_brdm_2m_desc: "BRDM-2M is a Ukrainian modernization of BRDM-2. Same as BRDM-2LD, but with a standard gasoline engine.\nThus, the changes concerned primarily the presence of side landing hatches.\nProduced by the Mykolayiv Mechanical Repair Plant."
 UKR_modernize_brdm_2dp: "Research §YBRDM-2DP§!"
 UKR_modernize_brdm_2dp_desc: "BRDM-2DP is a Ukrainian modernization of BRDM-2. A lighter modification, equipped with a diesel engine, is produced by Zavod Mayak, Kyiv.\nArmament - bow 12.7-mm machine gun DShKM and 2 on-board 7.62-mm machine guns SGMB.\nAlso, the machine is equipped with side doors for landing, removable anti-cumulative nets and a device for overcoming trenches and trenches."
 UKR_modernize_brdm_2vepr: "Research §YBRDM-2 'Vepr'§!"
 UKR_modernize_brdm_2vepr_desc: "BRDM-2 'Vepr' is a Ukrainian modernization of the BRDM-2, proposed by the VEPR company.\nVisibility has been improved by glazing the cockpit with armored glass.\nThe bottom is armored. The side wheels have been removed.\nInstead, full-profile doors for landing and landing troops were installed.\nArmament has been strengthened. In addition to the standard armament, a stern machine gun was added; the machine gunner's position was equipped in place of the dismantled water-jet propulsion unit.\nIn the bow there is provision for the installation of a course automatic grenade launcher.\nLighting equipment has been modified for driving on public roads."
 UKR_modernize_brdm_2l1: "Research §YBRDM-2L1§!"
 UKR_modernize_brdm_2l1_desc: "BRDM-2L1 is a Ukrainian modernization of BRDM-2, proposed by Mykolayiv Mechanical Repair Plant.\nThe vehicle received hatches of the BRDM-2LD and BRDM-2M type and loopholes for firing, a modern radio station made in Ukraine was installed, and new tubeless tires with adjustable pressure were used."
 UKR_modernize_brdm_2di: "Research §YBRDM-2DI 'Khazar'§!"
 UKR_modernize_brdm_2di_desc: "BRDM-2DI 'Khazar' is a Ukrainian combat reconnaissance and surveillance vehicle produced by Mykolayiv Mechanical Repair Plant based on the BRDM-2.\nThe development of the armored vehicle was started taking into account the experience gained in 2003-2005 by the Ukrainian military contingent in Iraq.\nThe armored car is equipped with an FPT IVECO Tector diesel engine (Euro-3) with a capacity of 138 hp. with a pre-launch heater, a thermal imager, a video surveillance system and a new set of weapons.\nIn addition, an additional hatch for the disembarkation of troops was made in the body of the machine."
 UKR_modernize_brdm_2t1: "Research §YBRDM-2T zr. 2012§!"
 UKR_modernize_brdm_2t1_desc: "BRDM-2T zr. 2012 is a Ukrainian modernization of BRDM-2, developed by NVK Techimpex.\nIn the version proposed in 2012, the main difference was the replacement of the engine: instead of the standard GAZ-41 gasoline engine, an in-line 4-cylinder diesel engine D245.30E2 was installed (which made it possible to reduce the fire hazard and slightly reduce fuel consumption), and the armored vehicle also underwent a major overhaul."
 UKR_modernize_brdm_2t2: "Research §YBRDM-2T zr. 2013§!"
 UKR_modernize_brdm_2t2_desc: "BRDM-2T zr. 2013 is a Ukrainian modernization of BRDM-2, developed by NVK Techimpex.\nIn 2013 a new version of the BRDM-2 modernization was presented: in addition to installing the D245.30E2 engine, the R-173 radio station, BTR-70 front and rear marker lights, and new wheels with tubeless tires were installed on the armored vehicle.\nAdditional wheels were dismantled, which made it possible to install trapezoidal side landing hatches (similar to the BTR-70).\nThe turret was dismantled, and a 12.7 mm NSVT machine gun and a 7.62 mm PKT machine gun were installed as weapons."
 UKR_modernize_brdm_2t3: "Research §YBRDM-2T zr. 2015§!"
 UKR_modernize_brdm_2t3_desc: "BRDM-2T zr. 2015 is a Ukrainian modernization of BRDM-2, developed by NVK Techimpex.\nIn 2015, another vehicle was presented: with a standard BRDM-2 turret, rectangular side hatches of the BRDM-2LD type, a new five-speed gearbox, R20 tubeless tires produced by the Ukrainian company Rosava, a new Motorola DM-4601 radio station and the ability to install from the inside of the body there is additional anti-fragmentation protection made of at least five layers of Kevlar-type ballistic fabric."
 UKR_modernize_brdm_2i: "Research §YBRDM-2I§!"
 UKR_modernize_brdm_2i_desc: "BRDM-2I is a Ukrainian modernization of BRDM-2, proposed by the 45th Experimental Mechanical Plant in Vinnytsia.\nThe standard gasoline engine was replaced with a low-noise ISUZU diesel engine with a capacity of 156 hp.\nThe water-jet installation and anti-trench wheels were retained during the modernization.\nAdditionally, a Ukrainian-made electronic centralized tire inflation system was installed.\nArmament: 14.5 mm KPVT machine gun, 7.62 mm PKT machine gun, AGS-17 grenade launcher, Barrier ATGM."
 UKR_modernize_bkm_hekkon: "Research §YBKM 'Hekkon'§!"
 UKR_modernize_bkm_hekkon_desc: "BKM 'Hekkon' is one of the Ukrainian options for the modernization of the Soviet armored vehicle BRDM-2.\nThe armored vehicle was developed in 2016 on the initiative of specialists of the engineering group 'Azov' (which took the name Engineering group 'Arey' later) and built with extra-budgetary funds in the workshops of the closed Kyiv factory 'ATEK'.\nThe standard GAZ-41 gasoline engine and mechanical transmission were replaced by a new 'General Motors' diesel engine with a capacity of 215 hp. with a hydrostatic drive, two loopholes for firing from small arms and two side doors are made in the sides.\nArmor protection has been strengthened. The total number of the crew and landing party of the armored vehicle is 9 people.\nThe demonstration model was equipped with a modified tower from the BRDM-2, in which a 12.7-mm NSVT machine gun, a 7.62-mm PKT machine gun and four 81-mm smoke grenade launchers are installed."
 UKR_modernize_brm_manhust: "Research §YBRM 'Manhust'§!"
 UKR_modernize_brm_manhust_desc: "BRM 'Manhust' is a Ukrainian modification of the BRDM-2 from the Mykolaiv Armored Plant.\nAll components, with the exception of the engine, are of Ukrainian production.\nThe machine is equipped with additional side, top and rear hatches, which allows unhindered disembarking of troops.\nAn increase in frontal protection and the installation of additional armor plates ensure the safety of the crew.\nThe new machine received a significantly increased internal volume compared to the basic BRDM-2, and a robotic combat module, which is now equipped with a large-caliber 14.5-mm machine gun and a 7.62-mm machine gun."
 UKR_modernize_brdm_2ld_flag: "Completed decision §YResearch BRDM-2LD§!"
 UKR_modernize_brdm_2m_flag: "Completed decision §YResearch BRDM-2M§!"
 UKR_modernize_brdm_2di_flag: "Completed decision §YResearch BRDM-2DI 'Khazar'§!"
 UKR_modernize_brdm_2t1_flag: "Completed decision §YResearch BRDM-2T zr. 2012§!"
 UKR_modernize_brdm_2t2_flag: "Completed decision §YResearch BRDM-2T zr. 2013§!"
 UKR_modernize_bkm_hekkon_flag: "Completed decision §YResearch BKM 'Hekkon'§!"
 UKR_modernize_brm_manhust_flag: "Completed decision §YResearch BRM 'Manhust'§!"
 UKR_modernize_btr_60m: "Research §YBTR-60M§! modernization program"
 UKR_modernize_btr_60m_desc: "§YBTR-60M§! is a Ukrainian modification of the §YBTR-60PB§!, developed by KMDB.\nA UTD-20 diesel engine (300 hp) is installed.\nMykolayiv Armored Plant produced one prototype."
 UKR_modernize_btr_60m_choose_module: "Choose primary weapon for\nmodernized §YBTR-60M§! APC"
 UKR_modernize_btr_60m_choose_module_desc: "We can make a decision on what exact main armament will be used by our modernized §YBTR-60M§! APC"
 UKR_modernize_btr_60mk: "Research §YBTR-60MK§! modernization program"
 UKR_modernize_btr_60mk_desc: "BTR-60MK is a Ukrainian modification of the BTR-60PB, proposed by the KORT company.\nThe vehicle is equipped with two Cummins diesel engines, additional mounted armor and enlarged side landing hatches.\nThe armament has been retained, but the possibility of replacing the turret with a combat module produced by the Mykolayiv Armored Plant weighing 1000 kg (armed with a 14.5 mm machine gun, a 7.62 mm machine gun and a 30 mm AGS-17 automatic grenade launcher) has been announced."
 UKR_modernize_btr_60pb_t: "Research §YBTR-60PB-T§!"
 UKR_modernize_btr_60pb_t_desc: "BTR-60PB-T is a Ukrainian modification of the BTR-60PB, developed by NVK Techimpex.\nScope of modernization: installation of the BM-23-2 combat module, replacement of gasoline engines with diesel engines, improvement of engine cooling systems, improvement of the water jet engine drive, installation of new electrical equipment."
 UKR_modernize_otaman_8x8: "Research §Y'Otaman' 8x8§!"
 UKR_modernize_otaman_8x8_desc: "'Otaman' 8x8 is a modern new combat platform developed by NVO Praktyka.\nThe platform was created by deep modernization of the BTR-60/70 chassis - a new armored hull with a front-engine layout and a complete replacement of the engine and transmission.\nThe new version of the BTR-60 modernization is focused on mobility and firepower.\nThe new body is made of modern steel and tested according to various international standards, has a projected level of ballistic protection STANAG 4569 level II.\nTo increase protection, it can also be equipped with hinged ceramic armor.\nThe new version of the machine was equipped with the combat module 'Sturm-M', which is installed on the BTR-3."
 UKR_modernize_btr_60m_khorunzhyi: "Research §YBTR-60M 'Khorunzhyi'§!"
 UKR_modernize_btr_60m_khorunzhyi_desc: "BTR-60M Khorunzhy is an armored personnel carrier from NVO Praktyka, a deep modernization of BTR-60PB.\nThe armored personnel carrier is designed as a wheeled platform on the basis of which a family of specialized armored vehicles can be created.\nThe case is made of modern armor steel and has a high level of armor protection. This made it possible to increase the level of bullet resistance of the upper and side parts of the case to the level of CCSA-4 (protection against a 7.62-caliber shot from a distance of 10 meters).\nThe APC has a modern layout of compartments with an engine compartment in the front right part, a driver's compartment in the front left part and a more spacious landing compartment in the rear part of the hull."
 UKR_modernize_btr_60m_flag: " Completed decision §YResearch BTR-60M§!"
 UKR_modernize_otaman_8x8_flag: " Completed decision §YResearch 'Otaman' 8x8§!"
 UKR_modernize_btr_70m: "Research §YBTR-70M§!"
 UKR_modernize_btr_70m_desc: "BTR-70M is a Ukrainian modification of the BTR-70.\nThe modernization was carried out by the Kharkiv Design Bureau named after O. O. Morozov within the framework of the state defense order for the equipment of the peacekeeping units of the armed forces of Ukraine.\nInstead of two gasoline engines, a multi-fuel diesel engine UTD-20 from BMP-1 is installed.\nArmament, 14.5-mm large-caliber machine gun KPVT and 7.62-mm twin machine gun PKT. Side hatches are BTR-80 type."
 UKR_modernize_btr_70m_kba2: "Research §YBTR-70M-KBA-2§!"
 UKR_modernize_btr_70m_kba2_desc: "BTR-70M-KBA-2 is a Ukrainian modification of the BTR-70.\nThe modernization was carried out by the Kharkiv Design Bureau named after O. O. Morozov.\nThe turret of the BTR-70 was dismantled, instead of it was installed a combat module with a 30-mm automatic cannon KBA-2 and a device for firing smoke grenades (as a result, the height of the machine increased to 2765 mm).\nSide hatches - BTR-80 type."
 UKR_modernize_btr_70m_hrim: "Research §YBTR-70M 'Hrim'§!"
 UKR_modernize_btr_70m_hrim_desc: "BTR-70M 'Hrim' is a Ukrainian modification of the BTR-70.\nThe modernization was carried out by the Kharkiv Design Bureau named after O. O. Morozov.\nInstead of the standard turret, the BM-1B 'Hrim' combat module (30-mm automatic cannon, 7.62-mm machine gun, 30-mm automatic grenade launcher AG-17 and Barrier anti-tank missile system with an ammunition supply of 4 ATGMs) is installed.\nSide hatches - BTR-80 type."
 UKR_modernize_btr_7: "Research §YBTR-7 'Zakhysnyk'§!"
 UKR_modernize_btr_7_desc: "BTR-7 'Zakhysnyk' is a Ukrainian modification of the BTR-70.\nThe modernization is carried out by the Mykolayiv Armored Plant.\nIt has 2 FPT Iveco Tector engines (from the Iveco EuroCargo truck) P4 (Euro III), 150 hp each.\nThe armored personnel carrier is equipped with a BUG combat unit, stabilized in two planes, the basic armament of which consists of: 14.5-mm KPVT machine gun (500 rounds); 7.62-mm PKT machine gun (1500 cartridges); 30-mm automatic grenade launcher AGS-17 (87 shots); two 130-mm Barrier ATGMs (4 ATGMs)."
 UKR_modernize_btr_70t: "Research §YBTR-70T§!"
 UKR_modernize_btr_70t_desc: "BTR-70T is a Ukrainian modernization of the BTR-70 of the NVK Techimpex.\nNew side landing hatches, like the BTR-80, R-173 radio station, two new D245.30E2 diesel engines with a total power of 312 hp, front and rear BTR-80 marker lights, new wheels with tubeless tires were installed.\nIt is also possible to install other combat modules."
 UKR_modernize_varan: "Research §Y'Varan'§!"
 UKR_modernize_varan_desc: "Varan is a Ukrainian armored personnel carrier, a radical modernization of the BTR-70.\nDeveloped by NVK Techimpex.\nThe Varan received a newly designed armored hull, as well as a significant change in layout, the engine is located in the front part, and a landing gear appeared in the stern.\nAs a result of the change in layout, the landing compartment received 35% more useful internal volume, and it was also possible to embark and disembark soldiers through a folding apparatus in the aft part.\nArmed with the Spys combat module, which is equipped with a 30-mm type 2A72 gun (ZTM-1 or KBA-1) with 300 shells, a 30-mm automatic grenade launcher KBA-117 (AGS-17) with 125 grenades, 7.62- mm KT-7,62 machine gun and a complex of 'Baryer' guided weapons with two missiles."
 UKR_modernize_btr_70m_flag: "Completed decision §YResearch BTR-70M§!"
 UKR_modernize_btr_70m_kba2_flag: "Completed decision §YResearch BTR-70M-KBA-2§!"
 UKR_modernize_btr_70m_hrim_flag: "Completed decision §YResearch BTR-70M 'Hrim'§!"
 UKR_modernize_btr_70t_flag: "Completed decision §YResearch BTR-70T§!"
 UKR_modernize_btr_80_kba2: "Research §YBTR-80-KBA-2§!"
 UKR_modernize_btr_80_kba2_desc: "BTR-80-KBA-2 is a Ukrainian modification of the BTR-80.\nThe modernization was carried out by the Kharkiv Design Bureau named after O. O. Morozov.\nUkrainian-made UTD-20 diesel engine is installed.\nInstead of a 14.5 mm KPVT machine gun, a 30 mm KBA-2 gun was installed.\n25% increased mileage with the same amount of fuel due to a significant reduction in fuel consumption.\nIncreased cross-country ability of the car in difficult road conditions due to increased engine torque.\nInstallation of the KBA-2 cannon of 30 mm caliber allows to increase the range and effectiveness of firing."
 UKR_modernize_btr_80m_hrim: "Research §YBTR-80M 'Hrim'§!"
 UKR_modernize_btr_80m_hrim_desc: "BTR-80M 'Hrim' is a Ukrainian modification of the BTR-80.\nThe modernization was carried out by the Kharkiv Design Bureau named after O. O. Morozov.\nInstead of the standard turret, the BM-1B 'Hrim' combat module (30-mm automatic cannon, 7.62-mm machine gun, 30-mm automatic grenade launcher AG-17 and Barrier anti-tank missile system with an ammunition supply of 4 ATGMs) is installed."
 UKR_modernize_btr_80up: "Research §YBTR-80UP§!"
 UKR_modernize_btr_80up_desc: "BTR-80UP is a join Polish-Ukrainian modernization programm for the BTR-80 in order to take part in Iraq tender.\nEnhanced protection, installed new diesel engines with a capacity of 300 hp, new tires and new electric and pneumatic systems, removed water jet installation.\nIn addition to the linear armored personnel carrier, 7 specialized modifications have been developed"
 UKR_modernize_btr_80t: "Research §YBTR-80T§!"
 UKR_modernize_btr_80t_desc: "BTR-80T is a Ukrainian modernization of the BTR-80 of the NVK Techimpex.\nThe stock engine was replaced with a more powerful turbocharged one with a capacity of 303 hp.\nThe gearbox is 8-speed. The range has been increased to 750 km.\nReplaced armament with a new combat module BM-23-2."
 UKR_modernize_btr_80_kba2_flag: " Completed decision §YResearch BTR-80-KBA-2§!"
 UKR_modernize_btr_80m_hrim_flag: " Completed decision §YResearch BTR-80M 'Hrim'§!"
 UKR_modernize_t55_5tdf: "Research §YT-55-5TDF§!"
 UKR_modernize_t55_5tdf_desc: "T-55-5TDF is a Ukrainian modernization of the T-55 tank.\nThe modernization was carried out by the Kharkiv Design Bureau named after O. O. Morozov.\nThe tank is equipped with a 5TDF diesel engine with a capacity of 700 hp, which allows it to reach a speed of 60 km/h on the highway and 40 km/h on rough terrain.\nThe tank is also equipped with a new fire control system, which includes a laser rangefinder, a ballistic computer and a thermal imaging sight.\nThe armor protection has been improved by installing additional armor plates and explosive reactive armor."
 UKR_modernize_t55_5tdf_flag: " Completed decision §YResearch T-55-5TDF§!"
 UKR_modernize_t55agm: "Research §YT-55AGM§!"
 UKR_modernize_t55agm_desc: "T-55AGM is a Ukrainian modernization of the T-55 tank.\nThe tank is equipped with a 5TDF diesel engine with a capacity of 700 hp, which allows it to reach a speed of 60 km/h on the highway and 40 km/h on rough terrain.\nThe tank is also equipped with a new fire control system, which includes a laser rangefinder, a ballistic computer and a thermal imaging sight.\nThe armor protection has been improved by installing nizh explosive reactive armor."
 UKR_modernize_t55agm_flag: "Completed decision §YModernize T-55AGM§!"
 UKR_modernize_t55m8_a2_tifon_ii: "Research §YT-55M8-A2 Tifon 2§!"
 UKR_modernize_t55m8_a2_tifon_ii_desc: "T-55M8-A2 Tifon 2 is a Ukrainian modernization of the T-55 tank for Peru.\nThe tank is equipped with a 5TDF diesel engine with a capacity of 700 hp, which allows it to reach a speed of 60 km/h on the highway and 40 km/h on rough terrain.\nThe tank is also equipped with a new fire control system, which includes a laser rangefinder, a ballistic computer and a thermal imaging sight.\nThe armor protection has been improved by installing nizh explosive reactive armor."
 UKR_develop_t64bm_bulat: "Research §YT-64BM 'Bulat'§!"
 UKR_develop_t64bm_bulat_desc: "T-64BM 'Bulat' is a Ukrainian modernisation, bringing the T-64B to the standard of the T-84.\nFitted with Nizh reactive armour, 9K120 Refleks missile (NATO code AT-11 Sniper), 1A45 Irtysh fire control, TKN-4S commander's sight, PZU-7 antiaircraft machine-gun sight, TPN-4E Buran-E night vision, 6TDF 1,000-hp (735 kW) engine.\nT-64BM 'Bulat' is the most recent modernization from 2004."
 UKR_develop_t64e: "Research §YT-64E§!"
 UKR_develop_t64e_desc: "The T-64E is a Ukrainian experimental main battle tank that was a deep modernization of the T-64.\nDeveloped at KhBTRZ (Kharkiv Armored Repair Plant).\nCompared to previous modifications of the T-64, the modernized tank has significantly improved combat power, mobility and protection.\nThe cost of the T-64E was about $1.12 million per unit as of 2011."
 UKR_develop_t64bv_1: "Research §YT-64BV-1§!"
 UKR_develop_t64bv_1_desc: "T-64BV-1 (also known in the media as T-64B1M/T-64BM1M) is a simplified version of the modernization of T-64B1 tanks created in 2014 and developed at the Kharkiv Armored Plant.\nThe tank has built-in 'Nizh' ERA protection, which strengthens the protection of the turret, the frontal part of the hull and the side.\nA niche for ammunition and equipment is installed in the rear part of the tower.\nA 5TDF engine is installed on the tank.\nIt is a simplified and cheaper option for modernization of the 'Bulat'."
 UKR_develop_t64bv_2017: "Research §YT-64BV zr. 2017§!"
 UKR_develop_t64bv_2017_desc: "The T-64BV zr. 2017 (or model 2017) is the ongoing T-64 tank series modernization, which aims at including new thermal imaging for all crew, remove Luna infrared searchlight, include TPN-1-TPV Ukrainian night sight in place of TPN1-49-23, 'Nizh' reactive armour modules designed for bolt-on replacement on T-64BV turrets, SN-4215 networked satellite navigation unit, and Lybid K-2RB digital radio (under license from Motorola) providing secure communications with a 70 km range."
 UKR_develop_t64bv_2022: "Research §YT-64BV zr. 2022§!"
 UKR_develop_t64bv_2022_desc: "The T-64BV zr. 2022 (or model 2022) is the latest T-64 tank series modernization. The tank has new third-generation surveillance and sighting units and is equipped with a new 12.7mm Snipex Laska K-2 heavy machine gun.\nIt features new up-to-date radio stations and additional navigation, internal and external communication systems which fully meets NATO standards.\nThe exterior fuel tanks are now also protected by 12mm steel plates."
 UKR_develop_t64_krab: "Research §YT-64 'Krab'§!"
 UKR_develop_t64_krab_desc: "T-64 'Krab' is research and development work on the modernization of the T-64B (T-64BV) tank.\nDesign studies are performed by the Kharkiv Design Bureau of Mechanical Engineering named after Morozova.\nWork began in 2016.\nThe installation of a 6TD engine with a power output of 1,200 hp was foreseen on the T-64.\nIn order to install an engine larger in dimensions than the standard one, the body of the serial T-64 is sewn up."
 UKR_develop_t_rex: "Research §Y'T-Rex'§!"
 UKR_develop_t_rex_desc: "'T-Rex' is a Ukrainian main battle tank announced in 2016 and was developed by the Arey Engineering Group, an engineering group belonging to the Azov Battalion.\nThe tank would be based on the T-64 and would feature an unmanned turret.\nThe three crew members would be seated in an armored capsule at the front of the hull, where they could remotely-control the cannon, the automatic loader and the machine guns.\nT-Rex would weigh 39 tons and be equipped with a 125mm main gun with 'high-power projectiles'.\nThe armor would utilize both 'Nizh' and 'Duplet' explosive reactive armor.\nThe combat capability was said by the Ukrainian press to be exceeding those of the Ukrainian Oplot and Bulat, while at the same time being more cost-effective than the Bulat."
 UKR_develop_t64bm2_bulat: "Research §YT-64BM2 'Bulat'§!"
 UKR_develop_t64bm2_bulat_desc: "T-64BM2 (in the media it is also called 'Bulat' or 'Kedr') is a modernization of the T-64 tank under the 'Kedr' program.\nIt is a technology demonstrator, that is, research and development work on the remotorization of T-64 type tanks with the 6TD-1 engine , a complete redesign of the engine and transmission compartment."
 UKR_develop_t64bm_bulat_flag: "Completed decision §YResearch T-64BM 'Bulat'§!"
