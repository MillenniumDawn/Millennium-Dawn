l_german:
 BNL_dynmod_union: "Benelux"
 BNL_benelux_union_treaty: "Vertrag über die Benelux-Union"
 BNL_benelux_union_treaty_desc: "Der 2008 in Den Haag unterzeichnete neue Vertrag ersetzt das auslaufende Abkommen von 1958 und benennt unsere Zusammenarbeit in Benelux-Union um. Er führt den gemeinsamen Markt fort und erweitert unsere Kooperation auf die Bereiche Justiz, Sicherheit und nachhaltige Entwicklung, wodurch die drei Staaten einen modernen gemeinsamen Rahmen für ihre weitere Integration erhalten."
 BNL_single_market: "Benelux-Binnenmark"
 BNL_single_market_desc: "Die Benelux geht über den europäischen Binnenmarkt hinaus, indem sie die verbliebenen administrativen Hürden beseitigt, welche die drei Volkswirtschaften noch voneinander trennen. Seit jeher ein Laboratorium der europäischen Integration, erprobt die Union gemeinsame Standards und die gegenseitige Anerkennung, sodass Unternehmen grenzüberschreitend handeln und wirtschaften können, als gäbe es keine Grenzen."
 BNL_capital_integration: "Integration der Kapitalmärkte"
 BNL_capital_integration_desc: "Die Börse von Amsterdam, die Banken Brüssels und Luxemburgs gewaltiger Investmentfondssektor bilden bereits heute einen der tiefsten Kapitalmärkte Europas. Eine Angleichung der Finanzaufsicht und der grenzüberschreitenden Vorschriften ermöglicht es, dieses Kapital ungehindert den produktivsten Unternehmen innerhalb der Union zufließen zu lassen."
 BNL_port_cooperation: "Rotterdam und Antwerpen"
 BNL_port_cooperation_desc: "Rotterdam und Antwerpen sind die beiden größten Häfen Europas. Eine koordinierte Entwicklung des Hafenverbunds Antwerpen–Rotterdam–Amsterdam, anstatt miteinander um dieselbe Fracht zu konkurrieren, macht die Benelux-Logistik zu einem erstklassigen Tor zur Welt."
 BNL_freight_corridors: "Güterverkehrskorridore"
 BNL_freight_corridors_desc: "Spezielle Güterbahnstrecken wie die Betuweroute und der Eiserne Rhein verbinden die Seehäfen mit dem europäischen Hinterland. Gemeinsame Investitionen in diese Korridore stärken das industrielle Rückgrat der Union."
 BNL_north_sea_wind: "Windenergie der Nordsee"
 BNL_north_sea_wind_desc: "Im Rahmen der North Seas Energy Cooperation entwickeln die Benelux-Staaten gemeinsam Offshore-Windparks. Der Ausbau gemeinsamer Stromnetze macht die Nordsee zu einer gemeinsamen Quelle erneuerbarer Energie."
 BNL_gas_hub: "Benelux-Gasdrehkreuz"
 BNL_gas_hub_desc: "Das Gasfeld Groningen und das LNG-Terminal in Zeebrügge machen die Benelux zu einem bedeutenden Handelszentrum für Erdgas. Eine koordinierte Versorgung über das Pentalaterale Energieforum sichert die Energieversorgung der Union."
 BNL_research_cooperation: "Technologieregion der Spitzenklasse"
 BNL_research_cooperation_desc: "Eindhoven und Leuven bilden zusammen mit Aachen die Technologieregion der Spitzenklasse, eine der dichtesten Konzentrationen von Hochtechnologieforschung in Europa. Durch die Bündelung von Laboren, Fördermitteln und Talenten über dieses grenzüberschreitende Dreieck hinweg kann die Benelux ihre weitaus größeren Konkurrenten in Sachen Innovation übertreffen."
 BNL_university_network: "Universitätsnetzwerk"
 BNL_university_network_desc: "Delft, Leuven, Eindhoven und Wageningen bilden das Rückgrat eines dichten akademischen Netzwerks. Die Verknüpfung ihrer Studiengänge und Abschlüsse schafft einen gemeinsamen Pool aus Wissen und hochqualifizierten Fachkräften."
 BNL_hightech_triangle: "Hightech-Dreieck"
 BNL_hightech_triangle_desc: "Brainport Eindhoven mit ASML und NXP sowie das Forschungszentrum imec in Leuven bilden das Herz der europäischen Halbleiterforschung. Die gemeinsame Förderung dieses Clusters sichert der Benelux ihre Spitzenposition in der Hochtechnologie."
 BNL_space_cooperation: "Zusammenarbeit in der Raumfahrt"
 BNL_space_cooperation_desc: "Mit ESTEC in Noordwijk befindet sich das technische Herz der Europäischen Weltraumorganisation in der Benelux. Eine koordinierte Beteiligung an den europäischen Raumfahrtprogrammen stärkt die ingenieurwissenschaftlichen Fähigkeiten der Union."
 BNL_nuclear_research: "Kernforschung"
 BNL_nuclear_research_desc: "Petten in den Niederlanden sowie das belgische SCK CEN in Mol mit seinem MYRRHA-Reaktorprojekt zählen zu den führenden europäischen Zentren der Reaktorforschung und der Entwicklung medizinischer Isotope. Ein gemeinsames Forschungsprogramm stärkt die kerntechnische Kompetenz der Union."
 BNL_innovation_area: "Benelux-Innovationsraum"
 BNL_innovation_area_desc: "Die Zusammenführung des Forschungsnetzwerks, des Hightech-Clusters sowie der Kern- und Raumfahrtprogramme zu einem gemeinsamen Innovationsraum macht die Benelux zu einer der forschungsintensivsten Regionen der Welt."
 BNL_benelux_parliament: "Benelux-Parlament"
 BNL_benelux_parliament_desc: "Ein Vertrag aus dem Jahr 2015 ersetzt den Beratenden Rat von 1955 durch die Interparlamentarische Benelux-Versammlung und verleiht der Union ein parlamentarisches Forum, das sich aus Abgeordneten der drei nationalen Parlamente zusammensetzt. Seine Stärkung legt den Grundstein für eine tiefere politische Integration der drei Staaten."
 BNL_benelux_court: "Benelux-Gerichtshof"
 BNL_benelux_court_desc: "Ein Protokoll aus dem Jahr 2012 modernisiert den Benelux-Gerichtshof und erweitert seine Zuständigkeit über den gemeinsamen Markt hinaus auf neue Bereiche wie das geistige Eigentum. Das gemeinsame Gericht harmonisiert die Rechtsprechung der drei Staaten und schafft eine einheitliche Rechtsordnung innerhalb der Union."
 BNL_shared_foreign_policy: "Gemeinsame Außenpolitik"
 BNL_shared_foreign_policy_desc: "In einer Tradition, die so alt ist wie die Union selbst, stimmen die drei Regierungen ihre Positionen vor jedem Europäischen Rat und jedem NATO-Gipfel miteinander ab. Mit einer gemeinsamen Stimme verleiht die Benelux ihrer Position in Brüssel weit mehr Gewicht, als es die Größe ihrer Mitgliedstaaten vermuten ließe."
 BNL_political_union: "Politische Union"
 BNL_political_union_desc: "Mit einem gemeinsamen Parlament, einem gemeinsamen Gerichtshof und einer einheitlichen Außenpolitik gehen die drei Regierungen über eine bloße Zusammenarbeit hinaus und verbinden ihre politischen Institutionen zu einer Union, die nur dem Namen nach noch aus getrennten Staaten besteht."
 BNL_treaty_of_union: "Unionsvertrag"
 BNL_treaty_of_union_desc: "Jahrzehnte gemeinsamer Institutionen finden hier ihren Höhepunkt. Nachdem die drei Völker eng zusammengewachsen sind, stellt die führende Regierung ihren Partnern die Frage nach einem gemeinsamen Benelux-Staat. Nur mit ihrer Zustimmung kann die nationale Souveränität einem geeinten Staat weichen."
 BNL_treaty_of_union_tt: "Eröffnet den Weg zu einem vereinigten Benelux-Staat"
 BNL_integration_requirement_tt: "$BNL_integration$ ist über §G 100 §!"
 BNL_integration: "§YBenelux-Integration§!"
 BNL_integration_tt: "£GFX_benelux_icon $BNL_integration$: $RIGHT|+=1$"
 BNL_integration_tooltip: "£GFX_benelux_icon $BNL_integration$: §G [?BNL_integration] §!"
 BNL_benelux_defence: "Benelux-Verteidigungserklärung"
 BNL_benelux_defence_desc: "Mit der Benelux-Erklärung von 2012 verpflichteten sich Belgien, die Niederlande und Luxemburg, ihre Verteidigungsanstrengungen zu bündeln, Kosten zu teilen und ihre gemeinsame militärische Leistungsfähigkeit zu steigern. Sie bildet den Rahmen, innerhalb dessen die drei Streitkräfte ihre Zusammenarbeit weiter vertiefen."
 BNL_mio_sharing_tt: "§Y[BEL.GetNameWithFlag]§!, §Y[HOL.GetNameWithFlag]§! und §Y[LUX.GetNameWithFlag]§! teilen sich alle §Ymilitärisch-industriellen Organisationen.§!"
 BNL_benelux_air_policing: "Benelux-Luftraumüberwachung"
 BNL_benelux_air_policing_desc: "Seit 2017 wechseln sich Belgien und die Niederlande im Rahmen einer gemeinsamen Quick Reaction Alert bei der Sicherung des Luftraums aller drei Staaten ab. Dabei sind sie befugt, Luftfahrzeuge auch über die Grenzen des jeweils anderen Staates hinweg abzufangen."
 BNL_air_defence_command: "Luftwaffenführungs- und Kontrollzentrum"
 BNL_air_defence_command_desc: "Ein gemeinsames Luftlage- und Führungszentrum integriert das Radarlagebild und die bodengebundene Luftverteidigung der drei Staaten zu einem einzigen koordinierten System."
 BNL_binational_air_command: "Binationales Luftwaffenkommando"
 BNL_binational_air_command_desc: "Die Zusammenlegung der operativen Luftkommandos ermöglicht es den Benelux-Luftstreitkräften, ihre Einsätze als eine einzige Organisation zu planen und durchzuführen, wobei sie Stützpunkte, Fluglotsen und Verfahren gemeinsam nutzen."
 BNL_mrtt_fleet: "Multinationale Multi Role Tanker Transport-Flotte"
 BNL_mrtt_fleet_desc: "Die gemeinsame Flotte aus Airbus A330 Multi Role Tanker Transports, stationiert in Eindhoven und genutzt von den Benelux-Partnern sowie weiteren europäischen Staaten, stellt allen Mitgliedern Luft-Luft-Betankung und strategische Lufttransportkapazitäten zur Verfügung."
 BNL_eatc: "Europäisches Lufttransportkommando"
 BNL_eatc_desc: "Das Europäische Lufttransportkommando mit Hauptquartier in Eindhoven bündelt die militärischen Transport-, Tank- und flugmedizinischen Luftfahrzeuge seiner Mitgliedstaaten unter einem gemeinsamen Kommando"
 BNL_belux_a400m: "BELUX A400M Einheit"
 BNL_belux_a400m_desc: "Belgien und Luxemburg bündeln ihre A400M-Atlas-Transportflugzeuge in einer gemeinsamen binationalen Einheit in Melsbroek und teilen sich Besatzungen, Wartung sowie ein gemeinsames Ausbildungszentrum. Das einzige luxemburgische Flugzeug trägt dabei belgische Hoheitsfarben, während beide Staaten sich die Kosten und Flugstunden einer gemeinsamen Flotte teilen."
 BNL_f35_cooperation: "Gemeinsame F-35-Instandhaltung"
 BNL_f35_cooperation_desc: "Belgien und die Niederlande koordinieren die Ausbildung und Instandhaltung ihrer F-35-Flotten und teilen Einrichtungen sowie Fachwissen zwischen ihren beiden Luftstreitkräften."
 BNL_benesam: "BENESAM-Marineabkommen"
 BNL_benesam_desc: "Belgien und die Niederlande führen ihre beiden Marinen wie eine gemeinsame Streitkraft und teilen Ausbildung, Logistik sowie Instandhaltung, während jeder Staat weiterhin das Kommando über seine eigenen Einsätze behält. Die Vertiefung dieses langjährigen Abkommens macht die gemeinsame Flotte weitaus stärker als die Summe ihrer einzelnen Teile."
 BNL_admiral_benelux: "Admiral Benelux"
 BNL_admiral_benelux_desc: "Ein einzelner binationaler Marinestab in Den Helder führt die Operationen der belgischen und niederländischen Flotten, wobei die beiden Marinekommandeure sich das gemeinsame Hauptquartier teilen."
 BNL_vlissingen_class: "Minenjagdboote der Vlissingen-Klasse"
 BNL_vlissingen_class_desc: "Das gemeinsame belgisch-niederländische Programm zur Ersetzung der Minenabwehrfahrzeuge umfasst zwölf Schiffe und soll die alternden Minenjagdboote der Alkmaar-Klasse aus dem Tripartite-Programm ablösen. Die von Naval Group gebauten Stand-off-Mutterschiffe bekämpfen Minen aus sicherer Entfernung mithilfe autonomer Überwasser- und Unterwasserdrohnen. Die Niederlande stellen sechs dieser Schiffe als Vlissingen-Klasse in Dienst, während Belgien eigene Schiffe desselben Designs betreibt."
 BNL_hollandklasse_frigate: "Entwicklung der Hollandklasse-Fregatte"
 BNL_hollandklasse_frigate_desc: "Die Niederlande legen neue Hollandklasse-Fregatten auf Kiel, um ihre Flotte zur Seeraumüberwachung und U-Boot-Abwehr zu erneuern. Ausgestattet mit modernen Sensoren, Raketensystemen und einem schwer aufklärbaren Rumpf schützen sie die niederländischen Gewässer und unterstützen Einsätze im Ausland."
 BNL_aswf_frigate: "Fregatte zur U-Boot-Bekämpfung"
 BNL_aswf_frigate_desc: "Belgien und die Niederlande ersetzen gemeinsam ihre M-Klasse-Fregatten durch ein neues Design zur U-Boot-Abwehr und teilen sich dabei Entwicklung, Radarsysteme und Kampfsysteme."
 BNL_para_school: "Benelux-Fallschirmschule"
 BNL_para_school_desc: "Die Fallschirmjägerschulen der Benelux werden in einem einzigen Ausbildungszentrum in Schaffen zusammengeführt, wodurch die Luftlandetruppen aller drei Staaten nach einem gemeinsamen Standard ausgebildet werden."
 BNL_csomtg: "Gemeinsame Spezialoperations-Taskgroup"
 BNL_csomtg_desc: "Belgien und die Niederlande stellen eine gemeinsame maritime Spezialkräfte-Einsatzgruppe auf, die bereit ist, gemeinsam zu Land und zur See für schnelle NATO-Einsätze eingesetzt zu werden."
 benelux.1.t: "Ein Benelux-Unionsvertrag"
 benelux.1.d: "[FROM.GetName] schlägt vor, unsere getrennte Souveränität aufzugeben und einem gemeinsamen Benelux-Staat beizutreten. Jahrzehnte gemeinsamer Institutionen haben den Grundstein dafür gelegt, doch die eigene Staatlichkeit aufzugeben ist kein kleiner Schritt."
 benelux.1.a: "Wer werden der Union beitreten"
 benelux.1.b: "Wir bleiben eine eigenständige Nation"
 benelux.2.t: "Unser Partner akzeptiert den Beitritt zur Union"
 benelux.2.d: "[FROM.GetName] hat zugestimmt, sich einem vereinten Benelux anzuschließen. Da unser Partner nun an uns gebunden ist, können wir die Bildung der Union abschließen"
 benelux.2.a: "Ein neue Nation ist erwacht"
 benelux.3.t: "Unser Partner lehnt den Beitritt zur Union ab"
 benelux.3.d: "[FROM.GetName] ist noch nicht bereit, seine Unabhängigkeit aufzugeben. Die Union muss warten oder auf einer festeren Grundlage aufgebaut werden."
 benelux.3.a: "Wir werden geduldig sein"
 benelux.4.t: "A Benelux Treaty of Union"
 benelux.4.d: "[FROM.GetName] proposes that we set aside our separate sovereignty and join a single Benelux state. We already anchor Benelux cooperation, our economy and armed forces dwarfing our partners' own, and effectively lead the union in all but name. A formal merger would trade that de facto primacy, and our sole hold over a state we already dominate, for shared institutions we cannot unilaterally direct."
 benelux.4.a: "We will join the union"
 benelux.4.b: "We remain our own nation"
 benelux.5.t: "A Benelux Treaty of Union"
 benelux.5.d: "[FROM.GetName] proposes that we set aside our separate sovereignty and join a single Benelux state. As by far the smallest of the three, we risk being politically and culturally swallowed by our two much larger neighbours, our Grand Duchy reduced to a footnote in a union we cannot hope to steer."
 benelux.5.a: "We will join the union"
 benelux.5.b: "We remain our own nation"
 BNL_retry_treaty_of_union_BEL: "Renew the Union Proposal to Belgium"
 BNL_retry_treaty_of_union_BEL_desc: "Belgium turned down the last proposal for a unified Benelux state. A revised approach, backed by fresh arguments and renewed diplomatic pressure, may yet bring Brussels around."
 BNL_retry_treaty_of_union_HOL: "Renew the Union Proposal to the Netherlands"
 BNL_retry_treaty_of_union_HOL_desc: "The Netherlands turned down the last proposal for a unified Benelux state. A revised approach, backed by fresh arguments and renewed diplomatic pressure, may yet bring The Hague around."
 BNL_retry_treaty_of_union_LUX: "Renew the Union Proposal to Luxembourg"
 BNL_retry_treaty_of_union_LUX_desc: "Luxembourg turned down the last proposal for a unified Benelux state. A revised approach, backed by fresh arguments and renewed diplomatic pressure, may yet bring the Grand Duchy around."
 BNL_retry_shared_outlook_tt: "They are more likely to accept if we share the same form of government."
 BNL_retry_influence_tt: "They are more likely to accept if we hold significant influence over them."
 BNL_retry_opinion_tt: "They are more likely to accept if their opinion of us is above §G200§!."