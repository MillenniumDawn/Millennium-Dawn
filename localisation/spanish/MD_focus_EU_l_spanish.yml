 eu_council_office_tt: "The §YPresident of the European Council§! presides over and drives forward the work of the European Council, which is composed of twenty-seven heads of state and a principal representative of §C[EUU.GetFlag][EUU.GetName]§! on the world stage. The institution comprises the college of heads of state and the president of the European Commission and provides political direction to the whole of the European Union.\n\n§YPerks of the Office:§!\nHolding this office allows us to put a bill forward to vote without requiring influence on any member.\n\nIncreases the success rate of Pro-European and Euroscepticism Campaigns by §G+10%§!\n\n[!eu_council_office_back_click]\n"
 eu_commission_office_tt: "The §YPresident of the European Commission§! is the head of the executive branch of the §C[EUU.GetFlag][EUU.GetName]§!. The President leads a cabinet of Commissioners, referred to simply as the College, collectively accountable to the European Parliament. They are empowered to allocate portfolios among, reshuffle, or dismiss commissioners as necessary. The Commission is the only body allowed to propose bills to become European Law.\n\n§YPerks of the Office:§!\nHolding this office allows us to put a bill forward to vote without requiring influence on any member.\n\nIncreases the success rate of Pro-European and Euroscepticism Campaigns by §G+10%§!\n\nHolding this office allows us to suspend member states who have more than three levels of breaches regardless of influence.\n\n[!eu_commission_office_back_click]\n"
 eu_high_repr_office_tt: "The §YHigh Representative of the Union for Foreign Affairs and Security Policy§! is the chief coordinator and representative of the Common Foreign and Security Policy (CFSP) within the European Union. The title is often shortened to the EU Foreign Minister and they primarily coordinate foreign policy on behalf of member states.\n\n§YPerks of the Office:§!\n\n[!eu_high_repr_office_back_click]\n"
 eu_ECB_office_tt: "The §YPresident of the European Central Bank§! presides over the European Central Bank (ECB), the institution responsible for the management of the Euro and the European Union's monetary policy in the Eurozone. They head the executive board, Governing Council and General Council of the ECB and represent the bank abroad.\n\n§YPerks of the Office:§!\nHolding this office allows us to start, expand, or reduce the OMT Program of the ECB to temporarily reduce the interest rates of member states with high interest rates.\n\n[!eu_ECB_office_back_click]\n"
 eu_frontex_office_tt: "The §YFrontex Executive Director§! presides over the European Border and Coast Guard Agency (commonly known as Frontex). The purpose of Frontex is to support European Union member states on the ground in their efforts to protect external European Borders. It also exercises border control over the Schengen area to assist with the area of freedom, security and justice domain.\n\n§YPerks of the Office:§!\n\nHolding this office will allow the holder to temporarily take control over the Frontex forces for their tenure.\n\n[!eu_frontex_office_back_click]\n"
 eu_secgen_army_office_tt: "The §YSecretary General of EuroArmy§! is the head of the EuroArmy of the European Union. They are responsible for the coordination of the EuroArmy which is the combined and common armed forces of the European Union member states.\n\n§YPerks of the Office:§!\n\nHolding this office will allow the holder to temporarily take control over the EuroArmy forces for their tenure.\n[!eu_secgen_army_office_back_click]\n"
 eu_secgen_navy_office_tt: "The §YSecretary General of EuroNavy§! is the head of the EuroNavy of the European Union. They are responsible for the coordination of the EuroNavy which is the combined and common naval strength of the European Union.\n\n§YPerks of the Office:§!\n\nHolding this office will allow the holder to take control over Member States Navies and unify them into one European Fleet.\n[!eu_secgen_navy_office_back_click]\n"
 eu_ambassador_office_tt: "The §YAmbassador of the Union to the United Nations§! represents the European Union at the United Nations, working in coordination with diplomatic missions of all the European Union member states.\n\n§YPerks of the Office:§!\nHolding this office grants the holder nation the Permanent Member of the UNSC national spirit.\n\n[!eu_ambassador_office_back_click]\n"
