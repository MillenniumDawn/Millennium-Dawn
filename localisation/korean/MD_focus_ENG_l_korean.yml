 ENG_seize_sierra_leone_TT: "[SIE.GetFlag] §H시에라리온§!이 친서방을 유지하고 평화 상태라면:\n - 결정을 통해 §H프리타운§!의 자원을 일시적으로 징발할 수 있습니다"
