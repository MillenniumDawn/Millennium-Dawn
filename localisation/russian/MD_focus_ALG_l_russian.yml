 ALG_deep_state_category_desc: "Управление влиянием военных и спецслужб (le pouvoir) на алжирскую власть.\n\n§YТекущая власть глубинного государства:§! [GetDeepStatePowerValue]/30\n§YУровень риска:§! [GetDeepStateRiskLevel]\n\nПороги:\n§G0-5: низкий§! | §Y6-10: умеренный§! | §O11-15: повышенный§!\n§R16-20: высокий§! | §R21-27: критический§! | §R28+: переворот неизбежен!§!"
 ALG_assess_deep_state_desc: "Заказать закрытый доклад о нынешнем уровне влияния военных и спецслужб в правительстве.\n\n§YТекущее состояние:§!\nВласть: [GetDeepStatePowerValue]/30\nУровень: [GetDeepStatePower]\nРиск: [GetDeepStateRiskLevel]"
 deep_state_warning_low_tt: "§GВлияние глубинного государства: НИЗКОЕ ([GetDeepStatePowerValue]/30)\nПолитическое влияние военных ограничено. Положение устойчиво.§!"
 deep_state_warning_moderate_tt: "§YВлияние глубинного государства: УМЕРЕННОЕ ([GetDeepStatePowerValue]/30)\nВлияние военных растёт. Следите за положением.§!"
 deep_state_warning_medium_tt: "§OВлияние глубинного государства: ПОВЫШЕННОЕ ([GetDeepStatePowerValue]/30)\nСпецслужбы включаются в политику. Стоит принять меры.§!"
 deep_state_warning_high_tt: "§RВлияние глубинного государства: ВЫСОКОЕ ([GetDeepStatePowerValue]/30)\nГенералы работают как теневое правительство. Рекомендуются немедленные меры.§!"
 deep_state_warning_critical_tt: "§R£generic_warning Влияние глубинного государства: КРИТИЧЕСКОЕ ([GetDeepStatePowerValue]/30)\nГражданское правительство в огромной опасности! Действуйте решительно и немедленно.§!"
 deep_state_warning_coup_imminent_tt: "§R£generic_warning ПЕРЕВОРОТ НЕИЗБЕЖЕН! ([GetDeepStatePowerValue]/30)\nВоенные вот-вот возьмут власть! Нужны чрезвычайные меры.§!"
 ALG_cabinet_category: "Управление правительством"
 ALG_cabinet_category_desc: "Правительство — публичное лицо алжирской власти при президенте Бутефлике. За должностями и портфелями скрывается постоянное балансирование между лояльностью, компетентностью и влиянием le pouvoir.\n\nЛояльность правительства: [GetCabinetLoyaltyLevel]\nКомпетентность правительства: [GetCabinetCompetenceLevel]\nВлияние глубинного государства: [GetCabinetDeepStateLevel]"
 ALG_review_cabinet: "Рассмотреть состав правительства"
 ALG_review_cabinet_desc: "Рассмотреть нынешний состав правительства и его политический баланс."
 ALG_replace_prime_minister: "Сменить премьер-министра"
 ALG_replace_prime_minister_desc: "Выбрать нового премьер-министра, который будет координировать правительство и поддерживать политическую устойчивость.\n\nНынешний премьер-министр: [GetPMName]"
 ALG_replace_defense_minister: "Сменить министра обороны"
 ALG_replace_defense_minister_desc: "Сменить министра обороны. Пост крайне чувствительный, любая перемена может встревожить военную верхушку.\n\nНынешний министр: [GetMODName]"
 ALG_replace_interior_minister: "Сменить министра внутренних дел"
 ALG_replace_interior_minister_desc: "Министерство внутренних дел ведает внутренним порядком и управлением провинциями.\n\nНынешний министр: [GetMOIName]"
 ALG_replace_foreign_minister: "Сменить министра иностранных дел"
 ALG_replace_foreign_minister_desc: "Назначить нового министра иностранных дел, чтобы задать дипломатический курс Алжира.\n\nНынешний министр: [GetMOFAName]"
 ALG_replace_finance_minister: "Сменить министра финансов"
 ALG_replace_finance_minister_desc: "Назначить нового министра финансов, чтобы вести государственный бюджет и экономическую политику.\n\nНынешний министр: [GetMOFName]"
 ALG_replace_energy_minister: "Сменить министра энергетики"
 ALG_replace_energy_minister_desc: "Министерство энергетики — стержень алжирской углеводородной экономики.\n\nНынешний министр: [GetMOEName]"
 ALG_replace_justice_minister: "Сменить министра юстиции"
 ALG_replace_justice_minister_desc: "Назначить нового министра юстиции, который определит работу судов и политические процессы.\n\nНынешний министр: [GetMOJName]"
 ALG_replace_intelligence_chief: "Сменить главу разведки"
 ALG_replace_intelligence_chief_desc: "Смена главы разведки — одна из самых опасных реформ. Спецслужбы не отдают власть без борьбы.\n\nНынешний глава: [GetDRSName]"
 ALG_cabinet_reshuffle: "Перестановки в правительстве"
 ALG_cabinet_reshuffle_desc: "Провести широкую перестановку в правительстве и заново определить его политический курс."
 ALG_demand_cabinet_loyalty: "Потребовать верности правительства"
 ALG_demand_cabinet_loyalty_desc: "Заставить министров публично подтвердить верность президенту."
 ALG_reward_cabinet: "Вознаградить правительство"
 ALG_reward_cabinet_desc: "Раздать блага, покровительство и повышения, чтобы поднять лояльность правительства."
 ALG_anti_corruption_drive: "Антикоррупционная кампания"
 ALG_anti_corruption_drive_desc: "Начать антикоррупционную кампанию внутри правительства. Это может ослабить укоренившиеся сети, но способно и спровоцировать глубинное государство."
