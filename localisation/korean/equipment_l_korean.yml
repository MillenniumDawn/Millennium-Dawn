 GER_transport_helicopter_2: "CH-53G"
 GER_transport_helicopter_2_desc: "CH-53G는 원래 시코르스키 항공기가 설계하고 VFW-포커가 면허 생산한 미국의 대형 수송 헬리콥터입니다. CH-53G는 조종사, 부조종사, 기관사, 공중 관측병 등 4명의 승무원을 태웁니다. 완전 무장 병력 최대 38명, 내부 화물 8,000파운드(3,600kg), 또는 단일 지점 슬링 후크에 외부 하중 13,000파운드(5,900kg) 등 다양한 적재물을 운반할 수 있습니다."
