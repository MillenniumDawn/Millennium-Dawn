 frigate_hull_7: "2055년형 호위함 선체"
 frigate_hull_7_desc: "많은 현대 해군의 중핵을 이루는 호위함은 '원양' 해군 전력의 일부로 사용될 수 있습니다. 항속 거리가 길고 초계함급보다 크기가 큽니다. 주로 함대 방어 플랫폼으로 사용되지만, 함대 내에서 상당히 폭넓은 역할을 수행할 수 있으며 (더 공세 지향적인 임무를 포함하여) 다양한 역할과 상황의 요구에 맞춰 개조할 수 있습니다. 주로 함대 방어, 대잠, 대공, 해상 호송 임무에 사용됩니다."
 frigate_hull_8: "2070년형 호위함 선체"
 frigate_hull_8_desc: "많은 현대 해군의 중핵을 이루는 호위함은 '원양' 해군 전력의 일부로 사용될 수 있습니다. 항속 거리가 길고 초계함급보다 크기가 큽니다. 주로 함대 방어 플랫폼으로 사용되지만, 함대 내에서 상당히 폭넓은 역할을 수행할 수 있으며 (더 공세 지향적인 임무를 포함하여) 다양한 역할과 상황의 요구에 맞춰 개조할 수 있습니다. 주로 함대 방어, 대잠, 대공, 해상 호송 임무에 사용됩니다."
 destroyer_hull_6: "2060년형 구축함 선체"
 destroyer_hull_6_desc: "함대, 호송대 또는 전투 전단에서 더 큰 함정을 호위하기 위해 만들어진 이 빠르고 기동성 있으며 항속 능력이 긴 군함은 독립 작전도 똑같이 수행할 수 있습니다. 후기 개량형은 다양하고 치명적인 유도 미사일, 순항 미사일 및 기타 무기를 탑재하여 그야말로 다임무 군함이 되었습니다. 호위함이나 초계함보다 톤수가 크고 화력은 더 공세적이며 치명적입니다. 장비 구성에 따라 주로 함대 방어, 공세 임무, 대공, 대함, 대잠, 그리고 대지 공격 임무에 사용됩니다."
 destroyer_hull_7: "2075년형 구축함 선체"
 destroyer_hull_7_desc: "함대, 호송대 또는 전투 전단에서 더 큰 함정을 호위하기 위해 만들어진 이 빠르고 기동성 있으며 항속 능력이 긴 군함은 독립 작전도 똑같이 수행할 수 있습니다. 후기 개량형은 다양하고 치명적인 유도 미사일, 순항 미사일 및 기타 무기를 탑재하여 그야말로 다임무 군함이 되었습니다. 호위함이나 초계함보다 톤수가 크고 화력은 더 공세적이며 치명적입니다. 장비 구성에 따라 주로 함대 방어, 공세 임무, 대공, 대함, 대잠, 그리고 대지 공격 임무에 사용됩니다."
 stealth_destroyer_hull_4: "2060년형 스텔스 구축함 선체"
 stealth_destroyer_hull_4_desc: "현대 전쟁 기술의 변화로 인해 더 선진적인 함대들은 함대의 생존성을 위한 새로운 해답을 모색하게 되었습니다. 스텔스 구축함이 그 최우선 과제로 떠올랐습니다. 적의 첨단 센서와 레이더에 탐지되지 않는다는 것은 이 강력한 무기가 더 가까이, 더 빠르게, 더 높은 살상력으로 타격할 수 있다는 뜻이며, 현대 분쟁에서의 생존성 향상이라는 부가적인 이점도 얻게 됩니다."
 stealth_destroyer_hull_5: "2075년형 스텔스 구축함 선체"
 stealth_destroyer_hull_5_desc: "현대 전쟁 기술의 변화로 인해 더 선진적인 함대들은 함대의 생존성을 위한 새로운 해답을 모색하게 되었습니다. 스텔스 구축함이 그 최우선 과제로 떠올랐습니다. 적의 첨단 센서와 레이더에 탐지되지 않는다는 것은 이 강력한 무기가 더 가까이, 더 빠르게, 더 높은 살상력으로 타격할 수 있다는 뜻이며, 현대 분쟁에서의 생존성 향상이라는 부가적인 이점도 얻게 됩니다."
 stealth_destroyer_4: "2060년형 스텔스 구축함"
 stealth_destroyer_4_desc: "현대 전쟁 기술의 변화로 인해 더 선진적인 함대들은 함대의 생존성을 위한 새로운 해답을 모색하게 되었습니다. 스텔스 구축함이 그 최우선 과제로 떠올랐습니다. 적의 첨단 센서와 레이더에 탐지되지 않는다는 것은 이 강력한 무기가 더 가까이, 더 빠르게, 더 높은 살상력으로 타격할 수 있다는 뜻이며, 현대 분쟁에서의 생존성 향상이라는 부가적인 이점도 얻게 됩니다."
 stealth_destroyer_5: "2075년형 스텔스 구축함"
 stealth_destroyer_5_desc: "현대 전쟁 기술의 변화로 인해 더 선진적인 함대들은 함대의 생존성을 위한 새로운 해답을 모색하게 되었습니다. 스텔스 구축함이 그 최우선 과제로 떠올랐습니다. 적의 첨단 센서와 레이더에 탐지되지 않는다는 것은 이 강력한 무기가 더 가까이, 더 빠르게, 더 높은 살상력으로 타격할 수 있다는 뜻이며, 현대 분쟁에서의 생존성 향상이라는 부가적인 이점도 얻게 됩니다."
 cruiser_hull_6: "2060년형 순양함 선체"
 cruiser_hull_6_desc: "항공모함과 강습 상륙함을 제외하면 일반적으로 현대 함대에서 가장 큰 공격 함정인 이 강력한 전력은 전 세계의 바다를 모두 커버할 수 있습니다. 역사적으로 방공에 특화되었으며(구축함은 수상전을 맡았습니다), 현대의 순양함은 다른 어떤 전투함보다 뛰어난 놀라운 무기고를 보유하고 있습니다. 순양함은 대용량 센서와 전투 관리 체계를 갖추어 전체 전투 전단의 중심으로 활용될 수 있습니다. 주로 지휘 통제, 대공, 대함, 대지 공격 임무에 사용됩니다."
 cruiser_hull_7: "2075년형 순양함 선체"
 cruiser_hull_7_desc: "항공모함과 강습 상륙함을 제외하면 일반적으로 현대 함대에서 가장 큰 공격 함정인 이 강력한 전력은 전 세계의 바다를 모두 커버할 수 있습니다. 역사적으로 방공에 특화되었으며(구축함은 수상전을 맡았습니다), 현대의 순양함은 다른 어떤 전투함보다 뛰어난 놀라운 무기고를 보유하고 있습니다. 순양함은 대용량 센서와 전투 관리 체계를 갖추어 전체 전투 전단의 중심으로 활용될 수 있습니다. 주로 지휘 통제, 대공, 대함, 대지 공격 임무에 사용됩니다."
 battle_cruiser_hull_5: "2060년형 순양전함 선체"
 battle_cruiser_hull_5_desc: "수상함은 함대의 주요 구성 요소이며 전통적인 함대의 모든 해상 기능을 담당합니다."
 battle_cruiser_hull_6: "2075년형 순양전함 선체"
 battle_cruiser_hull_6_desc: "수상함은 함대의 주요 구성 요소이며 전통적인 함대의 모든 해상 기능을 담당합니다."
 battleship_hull_5: "2060년형 전함 선체"
 battleship_hull_5_desc: "수상함은 함대의 주요 구성 요소이며 전통적인 함대의 모든 해상 기능을 담당합니다."
 battleship_hull_6: "2075년형 전함 선체"
 battleship_hull_6_desc: "수상함은 함대의 주요 구성 요소이며 전통적인 함대의 모든 해상 기능을 담당합니다."
 aircraft_heli_engineering_4: "자동화 헬리콥터 격납고"
 aircraft_heli_engineering_4_desc: "현재의 항공모함에 더 효율적인 헬리콥터 운용 및 보관 방식을 개장하면 잠수함에 대응하는 우리의 능력을 향상시킬 수 있습니다."
 helicopter_operator_hull_5: "2060년형 헬리콥터 모함 선체"
 helicopter_operator_hull_5_desc: "헬리콥터 모함은 주로 헬리콥터를 운반하는 데 사용되는 항공모함이지만, 강습 상륙함이나 대잠 항공모함으로 분류되는 경우도 많습니다. 주로 대잠전, 상륙 작전, 근접 항공 지원을 포함한 군 항공 임무에 사용됩니다. 일부 강습 상륙함은 상륙정을 운반하도록 설계된 도크를 갖추고 있어 도크형 상륙함의 기능을 수행합니다. 또 일부 강습 상륙함은 수직 이착륙 고정익 항공기를 탑재하도록 설계되어 공격 헬리콥터보다 더 강력한 상륙 작전 근접 항공 지원을 제공하며, 경항공모함의 기능을 수행합니다."
 helicopter_operator_hull_6: "2075년형 헬리콥터 모함 선체"
 helicopter_operator_hull_6_desc: "헬리콥터 모함은 주로 헬리콥터를 운반하는 데 사용되는 항공모함이지만, 강습 상륙함이나 대잠 항공모함으로 분류되는 경우도 많습니다. 주로 대잠전, 상륙 작전, 근접 항공 지원을 포함한 군 항공 임무에 사용됩니다. 일부 강습 상륙함은 상륙정을 운반하도록 설계된 도크를 갖추고 있어 도크형 상륙함의 기능을 수행합니다. 또 일부 강습 상륙함은 수직 이착륙 고정익 항공기를 탑재하도록 설계되어 공격 헬리콥터보다 더 강력한 상륙 작전 근접 항공 지원을 제공하며, 경항공모함의 기능을 수행합니다."
 aircraft_carrier_engineering_2: "항공모함 체계 전면 개편"
 aircraft_carrier_engineering_2_desc: "해군 기술의 발전은 마침내 항공모함의 운용 방식과 설계를 완전히 재설계하기에 이르렀습니다."
 carrier_hull_6: "2060년형 항공모함 선체"
 carrier_hull_6_desc: "이 떠다니는 공군 기지는 해군력의 정점으로, 세계의 바다로 뻗어 나가 한 국가의 힘을 전 지구에 투사할 수 있습니다. 강대국의 피와 재물을 상징하는 이 극도로 귀중한 자산은 어떤 대가를 치르더라도 보호되어야 합니다. 방대한 항속 거리를 지닌 이 함정이 해상에서 모든 작전 능력을 발휘하려면 진정한 '원양' 전투 전단이 필요합니다. 완전한 항모 전투 전단을 운용하는 국가는 자국 해군이 상징하는 바와 그것이 휘두르는 가공할 힘을 진정으로 자랑스러워할 수 있습니다. 주로 원거리에 걸친 전력 투사, 항공전, 수상전, 상륙전에 사용됩니다."
 carrier_hull_7: "2075년형 항공모함 선체"
 carrier_hull_7_desc: "이 떠다니는 공군 기지는 해군력의 정점으로, 세계의 바다로 뻗어 나가 한 국가의 힘을 전 지구에 투사할 수 있습니다. 강대국의 피와 재물을 상징하는 이 극도로 귀중한 자산은 어떤 대가를 치르더라도 보호되어야 합니다. 방대한 항속 거리를 지닌 이 함정이 해상에서 모든 작전 능력을 발휘하려면 진정한 '원양' 전투 전단이 필요합니다. 완전한 항모 전투 전단을 운용하는 국가는 자국 해군이 상징하는 바와 그것이 휘두르는 가공할 힘을 진정으로 자랑스러워할 수 있습니다. 주로 원거리에 걸친 전력 투사, 항공전, 수상전, 상륙전에 사용됩니다."
 tech_submarine_engineering_6: "최첨단 잠수함 엔진"
 tech_submarine_engineering_6_desc: "신기술의 발전으로 잠수함이 수중에서 더 먼 거리를, 더 빠른 속도로, 더 낮은 소음으로 작전할 수 있게 됩니다."
 tech_submarine_engineering_7: "초고급 잠수함 엔진"
 tech_submarine_engineering_7_desc: "신기술의 막대한 진보로 잠수함이 수중에서 더 먼 거리를, 더 빠른 속도로, 더 낮은 소음으로 작전할 수 있게 됩니다."
 attack_submarine_hull_7: "2055년형 공격 잠수함 선체"
 attack_submarine_hull_7_desc: "세계 바다의 소리 없는 살인자인 이 수중전 플랫폼은 은밀성, 정보 수집, 무기 체계를 포함한 다양한 유용한 능력을 갖추고 있습니다. 원양과 연안을 아우르는 폭넓은 임무를 위해 설계된 이 접근 거부 전문가들은 모든 해군의 초석입니다. 공격 잠수함은 해외의 먼 표적을 타격하도록 설계된 미사일과 잠수함의 결합체입니다."
 attack_submarine_hull_8: "2070년형 공격 잠수함 선체"
 attack_submarine_hull_8_desc: "세계 바다의 소리 없는 살인자인 이 수중전 플랫폼은 은밀성, 정보 수집, 무기 체계를 포함한 다양한 유용한 능력을 갖추고 있습니다. 원양과 연안을 아우르는 폭넓은 임무를 위해 설계된 이 접근 거부 전문가들은 모든 해군의 초석입니다. 공격 잠수함은 해외의 먼 표적을 타격하도록 설계된 미사일과 잠수함의 결합체입니다."
 missile_submarine_hull_7: "2055년형 미사일 잠수함 선체"
 missile_submarine_hull_7_desc: "세계 바다의 소리 없는 살인자인 이 수중전 플랫폼은 은밀성, 정보 수집, 무기 체계를 포함한 다양한 유용한 능력을 갖추고 있습니다. 원양과 연안을 아우르는 폭넓은 임무를 위해 설계된 이 접근 거부 전문가들은 모든 해군의 초석입니다."
 missile_submarine_hull_8: "2070년형 미사일 잠수함 선체"
 missile_submarine_hull_8_desc: "세계 바다의 소리 없는 살인자인 이 수중전 플랫폼은 은밀성, 정보 수집, 무기 체계를 포함한 다양한 유용한 능력을 갖추고 있습니다. 원양과 연안을 아우르는 폭넓은 임무를 위해 설계된 이 접근 거부 전문가들은 모든 해군의 초석입니다."
 patrol_boat_hull_4: "2055년형 초계정"
 patrol_boat_hull_4_desc: "초계정은 연안 방어를 위해 만들어진 경량 선박입니다. 초계함보다 작으며 하천 작전도 수행할 수 있습니다."
 patrol_boat_hull_5: "2080년형 초계정"
 patrol_boat_hull_5_desc: "초계정은 연안 방어를 위해 만들어진 경량 선박입니다. 초계함보다 작으며 하천 작전도 수행할 수 있습니다."
 module_helipads_4: "헬리패드 IV"
 module_helipads_4_desc: "하이퍼 첨단 항공 시설은 최적화된 비행 갑판과 지원 체계, 지휘 통합을 제공하여 감시, 대잠수함전, 전력 투사를 위한 여러 대의 현대식 헬리콥터를 효율적으로 운용할 수 있게 합니다.\n\n§G설계 힌트: 헬리패드는 잠수함 탐지, 대잠수함전, 수상 탐지, 소해 능력을 향상시키고 체력을 높여 줍니다. 대잠 호위함과 초계함에 적합하지만 생산 비용, 연료 소모, 인력, 수상 가시성이 증가합니다.§!"
