 MD_atc_fully_upgraded: "Полностью улучшено"
 MD_atc_exercise_training: "Учения по боеготовности авиации"
 MD_atc_exercise_training_desc: "Цикл повышения боеготовности всего авиакрыла, охватывающий интенсивность вылетов, воздушные перевозки и координацию разведки. Эскадрильи учатся вести действия с передовых аэродромов."
 MD_atc_ex_training_short: "Освоение направления «Подготовка и операции» на 90 дней."
 MD_atc_exercise_design: "Лётные испытания и оценка"
 MD_atc_exercise_design_desc: "Лётчики-испытатели и инженеры выполняют оценочные полёты на новых планерах и авионике. Результаты сразу идут в конструкторскую работу и практику обслуживания."
 MD_atc_ex_design_short: "Освоение направления «Проектирование самолётов» на 90 дней."
 MD_atc_exercise_heavy: "Учения стратегической транспортной и бомбардировочной авиации"
 MD_atc_exercise_heavy_desc: "Дальние вылеты тяжёлых бомбардировщиков и транспортных самолётов. Экипажи отрабатывают дозаправку в воздухе, полёты в плотном строю и маршруты для ударов на большую глубину."
 MD_atc_ex_heavy_short: "Освоение направления «Тяжёлая авиация» на 90 дней."
 MD_atc_exercise_multirole: "Учения многоцелевых ударных истребителей"
 MD_atc_exercise_multirole_desc: "Истребительные авиакрылья учатся переключаться между задачами «воздух — воздух» и «воздух — земля» в пределах одного вылета. Смешанные группы отрабатывают общее целеуказание и тактику сопровождения."
 MD_atc_ex_multirole_short: "Освоение направления «Многоцелевые самолёты» на 90 дней."
 MD_atc_exercise_strike: "Учения по непосредственной авиаподдержке"
 MD_atc_exercise_strike_desc: "Ударные эскадрильи тренируются с передовыми авианаводчиками на земле: обозначение целей, атаки на малой высоте и предотвращение огня по своим."
 MD_atc_ex_strike_short: "Освоение направления «Ударная авиация» на 90 дней."
 MD_atc_exercise_fighter: "Учения по воздушному бою"
 MD_atc_exercise_fighter_desc: "Крупномасштабные учения по воздушному бою сталкивают эскадрильи истребителей и перехватчиков с подразделениями условного противника. Лётчики отрабатывают бой за пределами визуальной видимости и манёвренный бой."
 MD_atc_ex_fighter_short: "Освоение направления «Истребители» на 90 дней."
 MD_atc_exercise_drone: "Учения беспилотных систем"
 MD_atc_exercise_drone_desc: "Операторы учатся запускать беспилотники, управлять ими и возвращать их. Учения охватывают тактику роя, устойчивость каналов передачи данных и действия в условиях радиоэлектронных атак."
 MD_atc_ex_drone_short: "Освоение направления «Беспилотная война» на 90 дней."
 MD_atc_staff_college_name: "Авиационный штабной колледж"
 MD_atc_staff_college_short: "Даёт опыт за воздушные задания и снижает потери опыта на 90 дней."
 MD_atc_staff_college: "Идёт обучение в авиационном штабном колледже"
 MD_atc_staff_college_desc: "Старшие офицеры ВВС проходят обучение в авиационном штабном колледже. Уроки недавних операций улучшают планирование заданий и сохранение лётного состава."
 MD_atc_fighter_school_name: "Школа боевого применения истребителей"
 MD_atc_fighter_school_short: "Улучшает появление асов на 180 дней."
 MD_atc_fighter_school: "Идёт обучение в школе боевого применения истребителей"
 MD_atc_fighter_school_desc: "Отобранные лётчики-истребители проходят углублённый курс по вооружению и тактике. Выпускники возвращаются в свои эскадрильи инструкторами и тактическими лидерами."
 MD_atc_rnd_liaison_name: "Связь с авиационными НИОКР"
 MD_atc_rnd_liaison_short: "Даёт очко прорыва в авиационных исследованиях."
 MD_atc_rnd_liaison_cooldown: "Связь с авиационными НИОКР действует"
 MD_atc_rnd_liaison_cooldown_desc: "Офицеры ВВС прикомандированы к авиакосмическим научным учреждениям и превращают опыт операций в требования к разработкам."
 MD_atc_academy_name: "Программа лётной подготовки"
 MD_atc_academy_short: "Открывает дух академии ВВС, усиливает учения."
 MD_atc_academy_level_text: "Уровень [?ROOT.MD_atc_academy_level|0]/3"
 MD_atc_force_name: "Программа боеготовности ВВС"
 MD_atc_force_short: "Открывает дух ВВС."
 MD_atc_force_level_text: "Уровень [?ROOT.MD_atc_force_level|0]/3"
 MD_atc_command_name: "Центр управления воздушными операциями"
 MD_atc_command_short: "Открывает дух командования ВВС."
 MD_atc_command_level_text: "Уровень [?ROOT.MD_atc_command_level|0]/3"
 MD_atc_academy_1: "Школа воздушной войны I"
 MD_atc_academy_1_desc: "Обучение тактике воздушного боя, планированию вылетов и методикам лётчиков-инструкторов готовит новое поколение лётного состава."
 MD_atc_academy_2: "Школа воздушной войны II"
 MD_atc_academy_2_desc: "$MD_atc_academy_1_desc$"
 MD_atc_academy_3: "Школа воздушной войны III"
 MD_atc_academy_3_desc: "$MD_atc_academy_1_desc$"
 MD_atc_force_1: "Программа безопасности полётов и обслуживания I"
 MD_atc_force_1_desc: "Единые графики обслуживания и проверки безопасности полётов поддерживают самолёты в исправном состоянии и снижают небоевые потери."
 MD_atc_force_2: "Программа безопасности полётов и обслуживания II"
 MD_atc_force_2_desc: "$MD_atc_force_1_desc$"
 MD_atc_force_3: "Программа безопасности полётов и обслуживания III"
 MD_atc_force_3_desc: "$MD_atc_force_1_desc$"
 MD_atc_command_1: "Объединённый центр воздушных операций I"
 MD_atc_command_1_desc: "Центральный оперативный центр планирует и распределяет воздушные задания, объединяя данные датчиков с действиями заправщиков, ударных самолётов и истребителей."
 MD_atc_command_2: "Объединённый центр воздушных операций II"
 MD_atc_command_2_desc: "$MD_atc_command_1_desc$"
 MD_atc_command_3: "Объединённый центр воздушных операций III"
 MD_atc_command_3_desc: "$MD_atc_command_1_desc$"
 MD_atc_tt_fully_upgraded: "§GПолностью улучшено§!"
 MD_atc_tt_mastery_0_5: "§G+0.5§!"
 MD_atc_tt_mastery_0_75: "§G+0.75§!"
 MD_atc_tt_mastery_1_0: "§G+1.0§!"
 MD_atc_tt_mastery_1_25: "§G+1.25§!"
 MD_atc_ex_training_tt: "§YУчения по боеготовности авиации§!\n\n£air_experience Опыт авиации: §R-325§!\n£command_power Командный ресурс: §R-75§!\nДаёт национальный дух §YУчения по боеготовности авиации§! на §H90§! дней:\n £fuel_consumption_texticon  Потребление горючего авиацией: §R+25%§!\n £experience_neutral_texticon  Получаемый опыт за задания авиакрыла: §G+5%§!\n£doctrine_mastery Освоение направления §H«Подготовка и операции»§!: [MD_atc_exercise_mastery_tt_text] в день в течение §H90§! дней\n\nТребуется общая авиационная доктрина и не менее §H50§! развёрнутых самолётов, включая хотя бы один самолёт-разведчик."
 MD_atc_ex_design_tt: "§YЛётные испытания и оценка§!\n\n£air_experience Опыт авиации: §R-325§!\n£command_power Командный ресурс: §R-75§!\nДаёт национальный дух §YЛётные испытания и оценка§! на §H90§! дней:\n £fuel_consumption_texticon  Потребление горючего авиацией: §R+25%§!\n £air_accidents_texticon  Вероятность лётных происшествий: §G-5%§!\n£doctrine_mastery Освоение направления §H«Проектирование самолётов»§!: [MD_atc_exercise_mastery_tt_text] в день в течение §H90§! дней\n\nТребуется общая авиационная доктрина и не менее §H50§! развёрнутых самолётов."
 MD_atc_ex_heavy_tt: "§YУчения стратегической транспортной и бомбардировочной авиации§!\n\n£air_experience Опыт авиации: §R-325§!\n£command_power Командный ресурс: §R-75§!\nДаёт национальный дух §YУчения стратегической транспортной и бомбардировочной авиации§! на §H90§! дней:\n £fuel_consumption_texticon  Потребление горючего авиацией: §R+25%§!\n £air_range_texticon  Радиус действия авиации: §G+3%§!\n£doctrine_mastery Освоение направления §H«Тяжёлая авиация»§!: [MD_atc_exercise_mastery_tt_text] в день в течение §H90§! дней\n\nТребуется общая доктрина §Y«Стратегическое разрушение»§! или §Y«Интегрированная воздушная война»§! и не менее §H50§! развёрнутых самолётов, включая хотя бы один стратегический бомбардировщик."
 MD_atc_ex_multirole_tt: "§YУчения многоцелевых ударных истребителей§!\n\n£air_experience Опыт авиации: §R-325§!\n£command_power Командный ресурс: §R-75§!\nДаёт национальный дух §YУчения многоцелевых ударных истребителей§! на §H90§! дней:\n £fuel_consumption_texticon  Потребление горючего авиацией: §R+25%§!\n £air_escort_efficiency_texticon  Эффективность сопровождения: §G+3%§!\n£doctrine_mastery Освоение направления §H«Многоцелевые самолёты»§!: [MD_atc_exercise_mastery_tt_text] в день в течение §H90§! дней\n\nТребуется общая доктрина §Y«Местная противовоздушная оборона»§!, §Y«Боевая поддержка»§!, §Y«Превосходство в воздухе»§!, §Y«Автономные воздушные операции»§! или §Y«Смешанная роль»§! и не менее §H50§! развёрнутых самолётов, включая хотя бы один истребитель."
 MD_atc_ex_strike_tt: "§YУчения по непосредственной авиаподдержке§!\n\n£air_experience Опыт авиации: §R-325§!\n£command_power Командный ресурс: §R-75§!\nДаёт национальный дух §YУчения по непосредственной авиаподдержке§! на §H90§! дней:\n £fuel_consumption_texticon  Потребление горючего авиацией: §R+25%§!\n £cas_efficiency_texticon  Эффективность штурмовиков: §G+3%§!\n£doctrine_mastery Освоение направления §H«Ударная авиация»§!: [MD_atc_exercise_mastery_tt_text] в день в течение §H90§! дней\n\nТребуется общая доктрина §Y«Местная противовоздушная оборона»§!, §Y«Стратегическое разрушение»§!, §Y«Боевая поддержка»§!, §Y«Автономные воздушные операции»§! или §Y«Интегрированная воздушная война»§! и не менее §H50§! развёрнутых самолётов, включая хотя бы один штурмовик, тактический, морской или стратегический бомбардировщик."
 MD_atc_ex_fighter_tt: "§YУчения по воздушному бою§!\n\n£air_experience Опыт авиации: §R-325§!\n£command_power Командный ресурс: §R-75§!\nДаёт национальный дух §YУчения по воздушному бою§! на §H90§! дней:\n £fuel_consumption_texticon  Потребление горючего авиацией: §R+25%§!\n £air_superiority_efficiency_texticon  Эффективность истребителей: §G+3%§!\n£doctrine_mastery Освоение направления §H«Истребители»§!: [MD_atc_exercise_mastery_tt_text] в день в течение §H90§! дней\n\nТребуется общая доктрина §Y«Местная противовоздушная оборона»§!, §Y«Стратегическое разрушение»§!, §Y«Боевая поддержка»§!, §Y«Превосходство в воздухе»§!, §Y«Смешанная роль»§! или §Y«Интегрированная воздушная война»§! и не менее §H50§! развёрнутых самолётов, включая хотя бы один истребитель или перехватчик."
 MD_atc_ex_drone_tt: "§YУчения беспилотных систем§!\n\n£air_experience Опыт авиации: §R-325§!\n£command_power Командный ресурс: §R-75§!\nДаёт национальный дух §YУчения беспилотных систем§! на §H90§! дней:\n £fuel_consumption_texticon  Потребление горючего авиацией: §R+25%§!\n £dive_bombing_texticon  Точность наземной бомбардировки: §G+3%§!\n£doctrine_mastery Освоение направления §H«Беспилотная война»§!: [MD_atc_exercise_mastery_tt_text] в день в течение §H90§! дней\n\nТребуется общая доктрина §Y«Автономные воздушные операции»§! и не менее §H50§! развёрнутых самолётов."
 MD_atc_academy_tt_1: "£air_experience Опыт авиации: §R-400§!\nОткрывает §YШкола воздушной войны I§! в ячейке «Дух академии ВВС»:\n £doctrine_mastery Прирост освоения авиационной доктрины: §G+5%§!\n £experience_neutral_training_texticon  Получаемый опыт за подготовку авиакрыла: §G+10%§!\nЕжедневное £doctrine_mastery §Hосвоение§! на авиационных учениях растёт с §Y0.5§! до §G0.75§!"
 MD_atc_academy_tt_2: "£air_experience Опыт авиации: §R-475§!\nОткрывает §YШкола воздушной войны II§! в ячейке «Дух академии ВВС»:\nЗаменяет §YШкола воздушной войны I§! (если установлен).\n £doctrine_mastery Прирост освоения авиационной доктрины: §G+10%§!\n £experience_neutral_training_texticon  Получаемый опыт за подготовку авиакрыла: §G+20%§!\nЕжедневное £doctrine_mastery §Hосвоение§! на авиационных учениях растёт с §Y0.75§! до §G1.0§!"
 MD_atc_academy_tt_3: "£air_experience Опыт авиации: §R-600§!\nОткрывает §YШкола воздушной войны III§! в ячейке «Дух академии ВВС»:\nЗаменяет §YШкола воздушной войны II§! (если установлен).\n £doctrine_mastery Прирост освоения авиационной доктрины: §G+15%§!\n £experience_neutral_training_texticon  Получаемый опыт за подготовку авиакрыла: §G+30%§!\nЕжедневное £doctrine_mastery §Hосвоение§! на авиационных учениях растёт с §Y1.0§! до §G1.25§!"
 MD_atc_academy_tt: "§YПрограмма лётной подготовки§!\n\n[MD_atc_academy_tt_text]"
 MD_atc_force_tt_1: "£air_experience Опыт авиации: §R-400§!\nОткрывает §YПрограмма безопасности полётов и обслуживания I§! в ячейке «Дух ВВС»:\n £air_accidents_texticon  Вероятность лётных происшествий: §G-10%§!"
 MD_atc_force_tt_2: "£air_experience Опыт авиации: §R-475§!\nОткрывает §YПрограмма безопасности полётов и обслуживания II§! в ячейке «Дух ВВС»:\nЗаменяет §YПрограмма безопасности полётов и обслуживания I§! (если установлен).\n £air_accidents_texticon  Вероятность лётных происшествий: §G-20%§!\n £fuel_consumption_texticon  Потребление горючего авиацией: §G-5%§!"
 MD_atc_force_tt_3: "£air_experience Опыт авиации: §R-600§!\nОткрывает §YПрограмма безопасности полётов и обслуживания III§! в ячейке «Дух ВВС»:\nЗаменяет §YПрограмма безопасности полётов и обслуживания II§! (если установлен).\n £air_accidents_texticon  Вероятность лётных происшествий: §G-30%§!\n £fuel_consumption_texticon  Потребление горючего авиацией: §G-10%§!"
 MD_atc_force_tt: "§YПрограмма боеготовности ВВС§!\n\n[MD_atc_force_tt_text]"
 MD_atc_command_tt_1: "£air_experience Опыт авиации: §R-400§!\nОткрывает §YОбъединённый центр воздушных операций I§! в ячейке «Дух командования ВВС»:\n £air_efficiency_texticon  Эффективность воздушных заданий: §G+3%§!"
 MD_atc_command_tt_2: "£air_experience Опыт авиации: §R-475§!\nОткрывает §YОбъединённый центр воздушных операций II§! в ячейке «Дух командования ВВС»:\nЗаменяет §YОбъединённый центр воздушных операций I§! (если установлен).\n £air_efficiency_texticon  Эффективность воздушных заданий: §G+6%§!\n £air_interception_detect_texticon  Обнаружение истребителями: §G+5%§!"
 MD_atc_command_tt_3: "£air_experience Опыт авиации: §R-600§!\nОткрывает §YОбъединённый центр воздушных операций III§! в ячейке «Дух командования ВВС»:\nЗаменяет §YОбъединённый центр воздушных операций II§! (если установлен).\n £air_efficiency_texticon  Эффективность воздушных заданий: §G+10%§!\n £air_interception_detect_texticon  Обнаружение истребителями: §G+10%§!"
