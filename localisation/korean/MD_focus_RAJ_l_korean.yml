l_korean:
 Cheap_Labor: "값싼 노동력"
 Cheap_Labor_desc: "식민지 착취와 대규모 비숙련 노동의 역사적 패턴에서 태어난 [ROOT.GetName]의 노동력은 여전히 풍부하고 저렴합니다. 비록 이러한 노동력의 과잉이 독립 이후 산업 성장을 촉진했지만, 여전히 불평등과 사회적 불안의 순환에 빠져 국가 안정성에 위협을 주고 있습니다."
 RAJ_iri_fake_ns: "심각히 부패한 군수 산업"
 RAJ_iri_fake_ns_desc: "엄격한 규제와 관료주의로 특징지어지는 인도 라이센스 라지(License Raj) 시대의 복잡한 유산이 방위산업에 여전히 남아 있습니다. 1990년대 개혁을 통해 민간 산업 확장의 문이 열렸지만, 군사 부문은 지난 수십 년 동안 물려받은 불투명한 조달 프로세스와 책임 부족으로 인해 부패와 비효율의 그물망으로 남아 있습니다."
 RAJ_re_fake_militar: "매우 혼란스러운 군부"
 RAJ_re_fake_militar_desc: "인도 분할의 그림자와 그에 따라 성급하게 조직된 군사 구조가 군대에 남아 있습니다. 관료적 비효율성과 현대적 조정 방법의 부족이 결합되어 군사 기구가 무질서해지는 결과를 낳습니다. 그러나 이러한 단점은 개선이 가장 시급하게 필요한 부분을 명백히 보여주어 군사 교리 재구성에 따른 자원 소모를 약간 줄입니다."
 india_divided: "인도 지역주의"
 india_divided_desc: "India's vast cultural and linguistic diversity, a legacy of its rich history and countless kingdoms, has often manifested as regionalism that complicates national governance. This mosaic of local interests has historically undermined centralized political power, making cohesive policy-making an arduous task. Yet, there exist various paths - both conciliatory and forceful - to navigate this complex landscape and potentially forge a more unified national identity."
 RAJ_gujarat_trouble_idea: "구자라트에 만연한 불안"
 RAJ_gujarat_trouble_idea_desc: "The communal tensions in Gujarat, a legacy of deep-rooted religious and ethnic divisions, have escalated into open conflict between Muslims and Hindus. The situation not only destabilizes the region but also stretches military and administrative resources thin, affecting the readiness and durability of troops deployed in challenging conditions. This unrest persists until both Hindu and Muslim opinion recover to 35 or above, and higher faith opinion eases it further."
 RAJ_looming_water: "식수 부족"
 RAJ_looming_water_desc: "지속 불가능한 농업 관행과 급속한 도시화로 인해 악화된 인도의 심각한 물 부족은 광범위한 결과를 초래합니다. 이는 사회 안정과 거버넌스에 부담을 줄 뿐만 아니라 군사 작전과 병참 지원도 심각하게 방해합니다. 현재의 심각한 상황에도 불구하고 물 관리 및 기반 시설 개발에 대한 공동의 노력은 이러한 심각한 영향을 크게 완화할 수 있습니다."
 india_focus: "인도 중점 계통도"
 RAJ_indian_minist_of_foreign_affairs: "Indian Ministry of Foreign Affairs"
 RAJ_indian_minist_of_foreign_affairs_desc: "Institutionalizing foreign policy oversight centralizes diplomatic strategy and international engagement."
 RAJ_affairm_claims_on_aksai_chin: "악사이 친의 요구에 대한 응답"
 RAJ_affairm_claims_on_aksai_chin_desc: "악사이친 은 수십 년 동안 인도와 중국 사이의 논쟁의 대상이었습니다. 인도는 이 지역이 자국 영토의 일부라고 주장하는 반면, 중국은 이 지역에 대한 역사적 주장을 주장하고 있다. 이 분쟁은 여전히 ​​해결되지 않았으며 인도-중국 관계에서 계속 복잡한 문제로 남아 있습니다."
 indian_event.1.t: "악사이 친에 대한 영유권을 재확인하는 인도"
 indian_event.1.d: "India has once again affirmed its unwavering claims on Aksai Chin, amidst the persisting territorial dispute with China. The disputed region, situated in the eastern sector of Jammu and Kashmir, has been a long-standing point of contention between the two Asian neighbors. The Indian government restated its position, asserting that Aksai Chin is an integral part of India's sovereign territory. This reaffirmation comes as a resolute response to China's historical claims on the region. The Aksai Chin dispute has been a significant challenge in India-China relations, with both nations holding contrasting views on the territory's rightful ownership. Diplomatic efforts to resolve the issue continue, but a definitive resolution has remained elusive thus far. India's firm stance on its territorial claims underscores its commitment to safeguarding national sovereignty and preserving the unity of its borders. The government remains open to constructive dialogue and peaceful negotiations to address the longstanding dispute and forge a way forward in the interest of regional stability and cooperation. As the situation evolves, both India and China are being closely watched by the international community, which hopes for an amicable resolution to de-escalate tensions and foster mutual understanding."
 indian_event.1.a: "흥미롭군"
 indian_event.2.t: "India Withdraws Claims from Aksai Chin!"
 indian_event.2.d: "인도는 잠무카슈미르 동부에 위치한 분쟁 지역인 악사이 친(Aksai Chin)에 대한 소유권 주장을 철회하기로 결정했다는 뜻밖의 중대한 조치를 발표했습니다. 이 지역은 인도와 중국 사이의 오랜 분쟁 지점이었으며 양국 관계가 긴장되었습니다. 인도 정부가 악사이 친(Aksai Chin)에 대한 소유권을 포기하기로 한 결정은 영토 분쟁의 평화적 해결을 향한 과감한 조치입니다. 이 지역은 수십 년 동안 논쟁의 여지가 있는 문제였지만, 이 놀라운 움직임은 이웃 국가와의 대화를 촉진하고 긴장을 완화하려는 인도의 의지를 반영합니다. 악사이친 에 대한 청구 철회는 양국의 이익을 존중하는 상호 수용 가능한 해결책을 희망하면서 중국과의 건설적인 협상에 도움이 되는 분위기를 조성하는 것을 목표로 합니다. 이러한 예상치 못한 전개는 국제사회의 관심을 끌 것으로 보이며, 관측자들은 인도의 움직임에 대한 중국의 반응을 기다리고 있습니다. 이번 결정은 인도-중국 관계의 잠재적인 전환점이 될 것이며 지역 안정과 협력을 위한 새로운 가능성을 열 수 있습니다. 상황이 발전함에 따라 인도와 중국은 두 아시아 강국의 평화로운 공존과 번영을 보장하기 위해 앞으로 나아갈 길을 모색하기 위해 외교 회담에 참여할 것으로 예상됩니다."
 RAJ_friendship_with_china: "중국과의 친선"
 RAJ_friendship_with_china_desc: "우리는 과거의 갈등을 잊고 양국 간의 완전하고 안정적인 평화를 보장해야 합니다."
 RAJ_strat_milcoop_china: "중국과의 군사 협력"
 RAJ_strat_milcoop_china_desc: "우리 군대가 협력하고 전투 효율성을 높이려면 중국과의 군사 협력이 매우 필요합니다."
 RAJ_partnership_with_tajikistan: "타지키스탄과 협력"
 RAJ_partnership_with_tajikistan_desc: "인도와 타지키스탄은 역사적, 문화적, 전략적 유대를 바탕으로 강한 우호 관계를 공유하고 있습니다. 양국은 긴밀한 교류와 문화 교류의 오랜 역사를 갖고 있습니다. 인도는 인프라 개발, 교육, 의료 등 다양한 분야에서 타지키스탄에 개발 지원과 기술 전문 지식을 제공해 왔습니다. 또한 양국은 인도가 타지키스탄의 국방 인력을 훈련하고 군사 지원을 제공하는 등 국방 및 안보 분야에서 협력해 왔습니다. 반면, 타지키스탄은 다양한 국제 문제에 대해 인도의 입장을 일관되게 지지해 왔습니다."
 RAJ_withdraw_claims_on_aksai_chin: "악사이 친에 대한 영유권 주장 철회"
 RAJ_withdraw_claims_on_aksai_chin_desc: "악사이친 의 주장을 철회하는 것은 중국과의 관계를 발전시키고 양국 간의 긴장을 완화하는 데 필수적입니다."
 RAJ_aksai_chin_withdraw_tt: "§Y우리는 앞으로 악사이 친을 두고 §B[CHI.GetNameDef]§! 측과 벌어지는 지역 분쟁에 개입할 수 없게 될 것입니다.§!"
 RAJ_push_the_kasmir_question: "카슈미르에 대한 의문을 화두로"
 RAJ_push_the_kasmir_question_desc: "공격적인 파키스탄에 압력을 가하기 위해서는 카슈미르 문제를 제기하는 것이 중요합니다!"
 RAJ_kashmir_quest_tt: "§Y이는 인도 - 파키스탄 사이의 긴장을 증가시킬 것입니다§!"
 RAJ_increase_regional_influence: "지역 영향력 확장"
 RAJ_protect_asian_allies: "아시아 동맹 보호"
 RAJ_protect_asian_allies_desc: "이 지역에서 중국의 지배력에 맞서기 위해 우리는 미얀마와 그들의 업무를 지원해야 합니다."
 RAJ_partnership_with_iran: "이란과 협력"
 RAJ_partnership_with_iran_desc: "Iran ties provide trade access and strategic presence in the Indian Ocean region."
 RAJ_increase_regional_influence_desc: "Expanding political and economic leverage across South Asia and the Indian Ocean."
 RAJ_new_army_idea: "새로운 인도군"
 RAJ_indian_saarc_idea: "남아시아지역협력협회"
 RAJ_indian_saarc_idea_desc: "The South Asian Association for Regional Cooperation, established in 1985, binds together the major South Asian states for development and policy coordination. Indian leadership of the bloc adds political weight to the home cabinet and improves trade relations with member states."
 RAJ_saarc: "남아시아 지역 협력 협회"
 RAJ_saarc_desc: "SAARC ties bind South Asia through trade and development, though regional tensions constrain deeper integration."
 indian_event.3.t: "인도, 남아시아 지역 협력 연합에 우리를 초대합니다"
 indian_event.3.d: "인도가 우리를 남아시아 지역 협력 연합에 초대했는데, 우리도 가입하는 데 동의해야 할까요?"
 indian_event.3.a: "물론이지"
 indian_event.3.b: "미안하지만, 안된다"
 RAJ_act_east_policy: "액트 익스트"
 RAJ_act_east_policy_desc: "Deepening Asia-Pacific engagement pivots India toward Southeast Asia and regional economic integration."
 act_east_pol_tt: "§Y액트이스트 정책 프로그램을 시작합니다§!"
 RAJ_asean_partner: "아세안과의 협력"
 RAJ_asean_partner_desc: "Partnership with ASEAN strengthens Southeast Asian ties through trade and political coordination, despite regional rivalries."
 RAJ_east_asia_summit: "동아시아 정상회의"
 RAJ_east_asia_summit_desc: "우리의 Act East 정책에 따라 동아시아 정상회담에 참석하는 것은 우리의 외교 관계를 심화하고 협력 노력을 기울이는 데 있어 중추적인 단계입니다. 러시아, 일본, 라오스 등 주요 국가들과 더욱 강력한 유대 관계를 구축함으로써 우리는 더욱 통합되고 조화로운 지역 미래를 위한 길을 닦습니다."
 RAJ_eastas.1.t: "동아시아 정상회의"
 RAJ_eastas.1.d: "제18차 동아시아 정상회의(EAS)가 오늘 가상으로 개최되어 18개 회원국 지도자들이 한자리에 모여 시급한 지역 과제를 논의하고 동아시아 지역의 협력을 강화했습니다. 싱가포르가 주최한 이번 정상회담은 지역의 평화, 안정, 번영을 촉진하는 것을 목표로 열린 대화와 협력의 플랫폼 역할을 했습니다. EAS에는 호주, 중국, 인도, 일본, 뉴질랜드, 한국, 러시아 및 미국과 함께 ASEAN 회원국을 대표하는 지도자들이 참여했습니다. 이 다양하고 포괄적인 모임은 포괄적인 지역 참여와 대화에 대한 정상회담의 의지를 반영합니다. 이번 정상회담에서 정상들은 포스트 팬데믹 시대 경제 회복, 기후변화 완화 및 적응 전략, 해양 안보, 대테러 노력, 초국가적 범죄 대응 방안 등 폭넓은 이슈에 대해 허심탄회하게 논의했다. 또한, 정상들은 지정학적 과제를 해결하고 인도 태평양 지역에서 국제법 수호, 주권 존중, 규칙 기반 질서 유지의 중요성을 강조했습니다."
 RAJ_eastas.1.o1: "흥미롭군"
 RAJ_neutrality_idea: "중립 정책"
 RAJ_bimstek: "BIMSTEC"
 RAJ_bimstek_desc: "다부문 기술 및 경제 협력을 위한 벵골만 이니셔티브는 벵골만을 둘러싼 인도, 방글라데시, 스리랑카, 부탄, 네팔, 미얀마, 태국 등 7개 국가로 구성된 지역 조직입니다. 1997년 설립된 BIMSTEC은 무역, 투자, 에너지, 기술, 관광, 대테러 등 다양한 분야에서 협력을 증진하는 것을 목표로 하고 있습니다. 이 하위 지역 그룹은 남아시아와 동남아시아의 연결성과 경제 통합을 강화하기 위한 전략적 위치에 있습니다. BIMSTEC은 엄청난 잠재력을 가지고 있지만, 회원국 간의 제한된 연결성을 포함하여 정치적, 물류적 문제로 인해 진전이 방해를 받는 경우도 있습니다. 그럼에도 불구하고, 이는 특히 국가들이 지역 안정과 경제 성장을 강화하려고 노력하는 가운데 지리적, 문화적으로 다양한 지역에서 협력과 발전을 촉진하기 위한 중요한 플랫폼으로 남아 있습니다."
 RAJ_indian_bimstek_idea: "BIMSTEC"
 RAJ_indian_bimstek_idea_desc: "The Bay of Bengal Initiative for Multi-Sectoral Technical and Economic Cooperation, founded in 1997, links India with Bangladesh, Sri Lanka, Bhutan, Nepal, Myanmar, and Thailand for coordinated trade, energy, and counter-terrorism work. Cooperation drives modest gains in domestic research speed and political stability."
 indian_event.4.t: "Invitation to BIMSTEC"
 indian_event.4.d: "India invites us to the BIMSTEC partnership program, should we join?"
 indian_event.4.a: "좋다!"
 indian_event.4.b: "미안하지만, 안된다"
 RAJ_befriend_butan_and_nepal: "네팔과 부탄과 친구가 되라"
 RAJ_befriend_butan_and_nepal_desc: "인도, 부탄, 네팔은 뿌리 깊은 역사적, 문화적, 지리적 유대를 공유하고 있습니다. 인도는 역사적으로 히말라야 국가들의 발전과 안정에 중요한 역할을 해왔습니다. 부탄은 인도와 긴밀한 외교, 경제, 전략적 협력을 통해 독특한 관계를 누리고 있습니다. 인도는 강력하고 우호적인 파트너십을 유지하면서 다양한 개발 프로젝트와 안보 문제에서 부탄을 지원해 왔습니다."
 RAJ_support_nov_idea: "인도 군사 지원"
 RAJ_support_neaplese_army: "Support the Nepalese Army"
 RAJ_support_neaplese_army_desc: "인도-네팔 군사 협력은 지리적 근접성과 상호 안보 우려를 바탕으로 한 역사적 기반을 갖고 있습니다. 양국은 군사교류, 훈련, 긴밀한 국방관계의 전통을 갖고 있다. 인도는 무기, 탄약, 철물 등을 포함해 네팔에 군사 장비를 공급하는 중요한 공급국이었습니다. 양국은 대테러, 재난 관리, 지역 안정 유지 등의 문제에 대해 협력하고 있습니다. 또한, 인도 육군의 구르카 연대는 네팔과 강한 역사적 연관성을 갖고 있어 이 지역에서 군인을 모집합니다."
 RAJ_mutual_trade_agreements: "상호 비즈니스 계약"
 RAJ_mutual_trade_agreements_desc: "인도-부탄 비즈니스 협력은 역사적 유대와 상호 이익에 깊이 뿌리를 둔 강력하고 다면적인 경제 파트너십이 특징입니다. 부탄은 인도의 경제적 지원과 개발 지원의 중요한 수혜자이며, 인도는 부탄의 최대 무역 파트너이자 외국인 투자의 원천입니다. 주요 협력 분야로는 부탄의 풍부한 수력 발전 잠재력을 개발하기 위해 인도 기업들이 합작 투자에 참여하는 수력 발전 프로젝트가 있습니다. 이는 부탄의 경제 성장에 도움이 될 뿐만 아니라 인도의 에너지 수요도 충족시킵니다."
 RAJ_befriend_bangladesh: "방글라데시와 친구가 되라"
 RAJ_befriend_bangladesh_desc: "인도와 방글라데시 간 무역은 인프라 개선과 특혜 무역 협정으로 인해 급증했습니다. 양국은 국경 간 고속도로, 송전선 건설 등 주요 프로젝트에 협력해 지역 연결성을 강화했다. 또한 그들은 대테러, 보안, 재난 관리와 같은 문제에 대해서도 함께 협력해 왔습니다."
 RAJ_defense_bangladesh: "방글라데시 방위 조약"
 RAJ_defense_bangladesh_desc: "수많은 합의와 이해를 통해 인도와 방글라데시는 실제로 국방 관계를 강화했습니다. 우리는 안보 동맹을 크게 발전시킬 것이기 때문에 역사적으로 중요한 국방 협력 기본 협정을 비준해야 합니다. 대테러와 해양 안보 분야에서 강화된 군사 교류, 훈련, 협력이 모두 이 프레임워크에 의해 다루어집니다."
 RAJ_border_agreements: "방글라데시와의 국경 협정"
 RAJ_border_agreements_desc: "In addition to removing a significant source of friction, this decision will open the door for more connection and cooperation between the two countries. Over 50,000 people who live in enclaves will be able to exchange, gaining citizenship in their home nations. Additionally, it will make it possible to carry out a number of development initiatives, such as building roads, bridges, and other infrastructure along the newly established border areas."
 indian_event.5.t: "Border Agreement with India"
 indian_event.5.d: "인도는 국경 분쟁을 해결하고 상호 협력을 지속할 수 있도록 우리에게 국경 협정을 제안합니다."
 indian_event.5.a: "좋다"
 indian_event.5.b: "이건 너무하군!"
 RAJ_suppress_probangl_separat: "반방글라데시 분리주의 억제"
 RAJ_suppress_probangl_separat_desc: "방글라데시와의 국방 관계가 강화되었지만, 여전히 동쪽 이웃과의 더 긴밀한 연합을 지지하는 소수의 감정이 존재합니다. 국가의 통합을 위해 이러한 분리주의 성향을 해결하고 억제하는 것이 중요하며, 이를 통해 안정적이고 통합된 인도를 보장할 수 있습니다."
 RAJ_approach_singapore: "싱가포르에 접근"
 RAJ_approach_singapore_desc: "싱가포르는 아시아 지역에서 우리의 오랜 중립적인 파트너입니다. 우리는 그들과의 관계를 개선할 필요가 있습니다."
 RAJ_meaf: "중동과 아프리카 (MEAF)"
 RAJ_meaf_desc: "중동과 아프리카 시장은 그 지역들의 다양한 변화 이후 매우 중요한 시장이 되었습니다. 우리는 이들과의 관계를 무역뿐만 아니라 군사적, 정치적 측면에서도 개선할 필요가 있습니다."
 RAJ_partnership_with_uae: "아랍에미리트와의 협력"
 RAJ_partnership_with_uae_desc: "Strengthening ties with the UAE expands Gulf trade and strategic influence."
 RAJ_gulf_oil_deal: "걸프협력회의 석유 거래"
 RAJ_gulf_oil_deal_desc: "인도는 연료와 석유가 크게 필요합니다. 걸프 국가들과의 협력은 우리의 필요를 충족시키는 직접적인 열쇠입니다."
 RAJ_oman_military_base: "Oman Military Base"
 RAJ_oman_military_base_desc: "오만과 인도는 문화적, 역사적 유대뿐만 아니라 정치적 유대와 지역 내 공동의 이익을 공유하고 있습니다. 우리는 이러한 관계를 강화할 필요가 있습니다."
 RAJ_befriend_algeria: "알제리와 친구가 되기"
 RAJ_befriend_algeria_desc: "알제리는 북아프리카에서 우리가 높은 무역 회전율을 가진 몇 안 되는 국가 중 하나입니다. 아마도 그들은 곧 우리와의 관계를 심화하고자 할 것이며, 우리는 이를 위한 좋은 토대를 마련할 필요가 있습니다."
 RAJ_utilizing_indian_diaspora: "디아스포라 유대"
 RAJ_utilizing_indian_diaspora_desc: "Leveraging the global Indian diaspora enhances trade connections and diplomatic influence abroad."
 RAJ_mauritius: "모리셔스와의 유대"
 RAJ_mauritius_desc: "모리셔스에는 정치에 큰 영향을 미치는 중요한 디아스포라가 있습니다. 이제 이를 활용하여 관계를 강화할 때입니다."
 RAJ_srilank_relat: "스리랑카와 친구가 되기"
 RAJ_srilank_relat_desc: "역사적으로, 스리랑카와 인도는 매우 우호적인 관계를 유지해왔습니다. 역사적 뿌리를 두고 있는 스리랑카 사람들은 우리를 매우 친근하게 대합니다. 우리는 이 나라를 형제국으로 간주할 수 있으며, 그들과의 관계를 개선해야 합니다."
 RAJ_seychelles: "세이셸과 친구가 되기"
 RAJ_seychelles_desc: "세이셸은 오랫동안 무역 관계, 국방 능력, 기술 협력 강화를 위한 지정학적 대안을 찾고자 해왔습니다. 인도와의 우정은 그들에게 자연스러운 선택입니다."
 RAJ_tradepar_china: "중국과의 무역 협력"
 RAJ_tradepar_china_desc: "중국과 긴장된 관계를 맺고 있음에도 불구하고, 중국과의 무역 협력 관계는 두 나라 경제에 모두 여전히 필요합니다."
 RAJ_eastern_affiars: "동부 문제"
 RAJ_eastern_affiars_desc: "인도는 전통적으로 신흥 강국들과 좋은 관계를 누려 왔습니다. 이를 활용해 외교 및 무역 관계를 개선해야 합니다."
 RAJ_stratpar_russi: "러시아와의 전략적 제휴"
 RAJ_stratpar_russi_desc: "중국과 러시아의 우호 관계에도 불구하고, 러시아는 소련 시절부터 무역과 방위 분야에서 우리의 믿을 만한 파트너였습니다. 이제 이 관계를 새롭게 할 때입니다."
 RAJ_stratpar_soaf: "남아프리카와의 전략적 제휴"
 RAJ_stratpar_soaf_desc: "남아프리카 공화국은 세계에서 가장 빠르게 성장하는 경제 중 하나입니다. 우리와 마찬가지로 이들도 세계 무역을 개선하고 파트너를 찾는 데 전념하고 있습니다."
 RAJ_stratpar_braz: "브라질과의 전략적 제휴"
 RAJ_stratpar_braz_desc: "브라질과는 오랫동안 어느 정도 좋은 관계를 유지해 왔습니다. 그들과의 무역을 개선하고 정치적 유대를 강화할 방안을 찾아야 합니다."
 RAJ_looking_west: "서방을 바라보며"
 RAJ_looking_west_desc: "전통적으로 중립적인 입장임에도 불구하고 인도는 서방 국가들과 비교적 좋은 관계를 맺고 있으며, 거기에는 무역뿐 아니라 공통의 적인 중국도 있습니다."
 RAJ_friendship_with_israel: "이스라엘과의 우호"
 RAJ_friendship_with_israel_desc: "인도와 이스라엘의 관계는 공동 협력의 오랜 역사를 지니고 있습니다. 새로운 21세기에는 이러한 유대를 재확인할 필요가 있습니다."
 RAJ_friendship_with_france: "프랑스와의 우호"
 RAJ_friendship_with_france_desc: "1998년 프랑스와 전략 조약을 체결한 이후 프랑스는 NATO 내에서 인도의 최대 파트너 중 하나가 되었습니다. 이러한 관계를 생산적인 방향으로 심화해야 합니다."
 RAJ_become_major_non_nato_allies: "NATO의 동맹국"
 RAJ_become_major_non_nato_allies_desc: "중국과 파키스탄에 맞서려면 NATO와의 제휴, 나아가 그 이상의 관계를 맺을 수 있을 만큼 서방과의 관계를 개선해야 할지도 모릅니다. 현재의 추세로 보아 서방은 두 팔을 벌려 우리를 맞이할 것입니다."
 RAJ_military_coop_with_us: "미국과의 군사 기술 협력"
 RAJ_military_coop_with_us_desc: "미국은 방위 분야에서 가장 앞선 개발을 이룬 초강대국입니다. 우리는 그들과 협력하여 방위 역량을 향상시켜야 합니다."
 RAJ_tradedeals_with_us: "미국과의 무역 협정"
 RAJ_tradedeals_with_us_desc: "미국과의 무역은 서방과의 협력 정책에서 일관된 한 걸음입니다. 무역 면에서 서로에게 흥미로운 것을 찾아낼 것입니다."
 indian_event.6.t: "인도의 제안"
 indian_event.6.d: "최근 인도가 우리와 입장을 같이한 이후, 인도는 우리에게 파키스탄의 주요 비NATO 동맹국 지위를 박탈해 달라고 요청하고 있습니다."
 indian_event.6.a: "물론이지!"
 indian_event.6.b: "미안하지만, 안된다"
 RAJ_support_taiwan: "대만 지원"
 RAJ_support_taiwan_desc: "대만은 우리의 이익에 반하는 많은 영토를 주장하고 있지만, 공통의 적인 중화인민공화국에 맞서 그들을 지원할 가치는 있을 것입니다."
 RAJ_indian_modern_prog: "USAID 신청"
 RAJ_indian_modern_prog_desc: "미국의 원조 프로그램은 오래전부터 인도에서 흔한 일이 되었습니다. 이 분야의 협력을 개선하고 강화할 가치가 있을 것입니다."
 RAJ_joining_nato: "NATO 파트너십"
 RAJ_joining_nato_desc: "NATO는 오직 유럽-대서양 지역에서만 활동하므로 정회원 가입은 불가능합니다. 그래도 차선책인 주요 비NATO 동맹국 지위는 추구할 수 있으며, 이는 합동 훈련, 기술 이전, 서방과의 특권적 방위 관계의 문을 열어 줍니다."
 RAJ_SCO_join: "SCO 가입"
 RAJ_SCO_join_desc: "중국과의 관계는 긴장되어 있으나 러시아와의 관계는 꽤 생산적입니다. 중화인민공화국과의 모든 모순에도 불구하고 SCO 체제에 들어갈 수 있을지도 모릅니다."
 RAJ_cont_non_aligned_polic: "비동맹의 길 지속"
 RAJ_cont_non_aligned_polic_desc: "인도는 전통적으로 비동맹과 완전한 중립의 길을 걸어 왔습니다. 새로운 동맹을 찾아 허용된 경계를 넘어서는 안 됩니다. 우리는 거리를 유지해야 합니다."
 RAJ_isolationist_policies: "고립주의 정책"
 RAJ_isolationist_policies_desc: "무역에도 불구하고 세계 나머지로부터의 사회적 고립이 유익할 수 있습니다."
 RAJ_boosting_our_local_market: "내수 시장 활성화"
 RAJ_boosting_our_local_market_desc: "국내 시장을 강화하는 것은 인도가 이 세계로부터 완전한 자주성을 달성하기 위한 일관된 걸음입니다."
 RAJ_active_support_of_stete_woned_shiet: "적극적 지원"
 RAJ_active_support_of_stete_woned_shiet_desc: "우리는 국내 시장 관계뿐 아니라 경제의 가장 중요한 부문을 규제할 국영 기업도 지원해야 합니다."
 RAJ_india_first: "인도 제일주의"
 RAJ_india_first_desc: "인도는 무엇보다 우선되어야 합니다. 우리는 이 세상에서 홀로이며 이를 깨달아야 합니다."
 RAJ_indian_autarky_effort: "인도 세력권"
 RAJ_indian_autarky_effort_desc: "이제 파트너들과의 관계를 개선하는 데 그치지 않고 우리만의 세력권을 구축할 때가 왔습니다."
 RAJ_self_sufficient_market: "신사조"
 RAJ_self_sufficient_market_desc: "우리의 길이 인도의 이념적 패러다임에서 새로운 이정표임을 인정할 때입니다. 우리는 우리만의 새로운 미래를 건설하고 있습니다."
 RAJ_asking_nato_help_pak: "파키스탄 축출"
 RAJ_asking_nato_help_pak_desc: "파키스탄은 오랫동안 NATO 밖의 미국 동맹국이었습니다. 서방과의 협력에서 그들의 입지를 배제하고 그 자리를 차지해야 합니다."
 RAJ_indias_politics: "인도 정치"
 RAJ_indias_politics_desc: "인도의 정치는 천년의 전환점에 있습니다. 그 역사는 어떻게 구축될 것인가?"
 indian_event.7.t: "인도 정치"
 indian_event.7.d: "India faced a combination of political and economic challenges in the new millennium, as the nation sought to navigate through a complex landscape and address pressing issues. The new millennium brought forth a range of hurdles that tested the resilience of India's democratic institutions and economic stability. On the political front, the country witnessed a fragmented political landscape marked by coalition governments and frequent changes in leadership. This created a certain degree of instability and hindered the implementation of crucial reforms. The absence of a clear majority in the central government made decision-making a challenging process, often requiring delicate negotiations with various regional and ideological partners. Economically, India struggled with persistent issues such as fiscal deficits, slow industrial growth, and unemployment. The economy faced hurdles in fully capitalizing on the reforms initiated in the 1990s, and certain sectors experienced sluggish growth. Structural challenges, bureaucratic red tape, and inadequate infrastructure hampered the ease of doing business and limited the country's potential for rapid economic expansion. Additionally, India witnessed the devastating impact of the dot-com bubble burst, which had ripple effects on the Indian information technology sector. Several IT companies faced setbacks as global markets experienced a downturn, leading to layoffs and financial strain within the industry. Amid these challenges, the government focused on policy measures to boost economic growth, attract foreign investments, and encourage entrepreneurship. Steps were taken to enhance infrastructure development, streamline regulations, and stimulate industrial activities. However, the impact of these initiatives took time to manifest and required sustained efforts to yield positive results. Despite the hurdles faced, India's resilience and democratic fabric remained intact. The country's vibrant civil society, independent judiciary, and free press played critical roles in ensuring accountability and promoting public discourse on vital issues."
 indian_event.7.a: "흥미롭군"
 RAJ_atal_bihari_vajpayee: "아탈 비하리 바지파이"
 RAJ_atal_bihari_vajpayee_desc: "아탈 비하리 바즈파이(Atal Bihari Vajpayee)는 인도 정치에서 중요한 인물로, 세 차례 인도의 총리직을 역임한 인물입니다. 첫 번째는 1996년에 짧은 기간 동안, 두 번째는 1998년부터 1999년까지, 그리고 세 번째는 1999년부터 다시 총리직을 맡았습니다. 바즈파이는 인도 국민당(BJP)의 창립 멤버이자, 힌두 민족주의 조직인 라슈트리야 스와얌세박 상그( Rashtriya Swayamsevak Sangh, RSS)의 핵심 지도자로 잘 알려져 있습니다."
 RAJ_lahore_summit_legacy: "라호르 정상회담의 유산"
 RAJ_lahore_summit_legacy_desc: "라호르 선언(Lahore Declaration)은 인도와 파키스탄 간의 양국 협정이자 거버넌스 조약입니다. 이 조약은 1999년 2월 21일, 역사적인 라호르 정상 회담에서 서명되었으며, 같은 해 두 나라의 의회에서 비준되었습니다. 조약의 조건에 따라, 양국은 핵 무기의 개발과 관련된 상호 이해를 이루었으며, 핵무기의 사고적 또는 무단 작동 사용을 피하는 데 합의했습니다. 라호르 선언은 양국 지도자들에게 핵 경쟁을 피하고, 비전통적 및 전통적인 갈등을 방지하는 책임을 더해주었습니다."
 RAJ_prevention_of_terror_act: "테러방지법"
 RAJ_prevention_of_terror_act_desc: "2002년 제15호 법률은 테러 활동을 예방하고 처리하기 위한 규정을 정하고 이와 관련된 사항을 규정하는 법률입니다."
 indian_event.8.t: "구자라트 시위 진정"
 indian_event.8.d: "그 사건은 힌두교 순례자들이 탄 기차가 불에 타면서 여러 명이 사망한 사건에서 촉발되었습니다. 이 사건은 이슬람 교도들의 공격으로 추정되었습니다. 기차 사건 이후, 구자라트의 여러 지역에서 힌두교와 이슬람 교도들 간의 폭력 사태와 종교적 충돌이 발생했습니다. 이 시위와 폭동은 수백 명의 목숨을 앗아가고, 부상자들을 발생시키며, 재산에 큰 피해를 입혔습니다. 우리는 무엇을 해야 할까요?"
 indian_event.8.a: "모디가 그 일을 할 거예요!"
 indian_event.8.b: "시위가 저절로 가라앉기를 바랍니다."
 RAJ_settling_down_gujarat: "구자라트 시위 진정"
 RAJ_settling_down_gujarat_desc: "The violence erupted following a train fire in Godhra, which claimed the lives of 59 people, mostly Hindu pilgrims. Subsequently, widespread communal clashes ensued in various parts of Gujarat, resulting in the loss of hundreds of lives and the displacement of thousands of people."
 RAJ_eastas.2.t: "세계 경제 협력 강화를 위한 새로운 동맹을 결성한 각국"
 RAJ_eastas.2.d: "세계 경제에 중대한 진전으로, 브라질, 러시아, 인도, 중국이 BRIC라는 동맹을 공식 결성했습니다. 이 새로운 동맹의 창설은 경제 협력을 강화하고 무역 관계를 증진하며 더욱 긴밀히 연결된 세계를 조성하는 것을 목표로 합니다. BRIC의 결성은 세계 경제 역학의 전환점으로, 이 네 나라는 합쳐서 세계 인구, 국토, 경제 생산량의 상당 부분을 차지합니다. 이들은 함께 세계 경제 성장을 이끌고 지속 가능한 발전을 촉진할 막대한 잠재력을 지니고 있습니다. BRIC의 토대는 공유된 목표와 상호 이익에 있습니다. 결합된 자원을 활용하여 BRIC 국가들은 포용적이고 균형 잡힌 경제 성장을 촉진하고 무역 및 투자 흐름을 강화하며 금융, 에너지, 기반시설, 기술을 비롯한 여러 분야의 협력 플랫폼을 제공하고자 합니다. 이 새로 결성된 동맹은 회원국들에 큰 기대를 안겨 줍니다. 브라질, 러시아, 인도, 중국은 각각 고유한 강점과 역량을 갖고 있습니다. 브라질은 풍부한 천연자원과 활기찬 농업 부문을 보유하고 있으며, 러시아는 에너지 매장량과 기술력으로 알려져 있습니다. 인도의 호황을 누리는 서비스 부문과 숙련된 노동력은 경제력에 기여하고, 중국의 제조 역량과 수출 능력은 전 세계에 정평이 나 있습니다."
 RAJ_eastas.2.o1: "흥미롭군"
 RAJ_BRICS: "BRICS 회원국"
 indian_event.9.t: "브릭스 타워"
 indian_event.9.d: "최근 경제 포럼에서 새로운 국제 은행 목적을 위한 브릭스 타워 건설 프로젝트가 제안되었습니다."
 indian_event.9.a: "환상적이군"
 RAJ_tower_tt: "§YThis will increase Chinese influence on us, but will improve our economy§!"
 RAJ_BRICS_tower_project: "브릭스 타워 프로젝트"
 RAJ_BRICS_tower_project_desc: "국가 간 유대관계를 강화하려면 모든 브릭스 회원국을 대상으로 새로운 개발 은행을 만들어야 합니다."
 RAJ_BRICS_bank: "브릭스 은행"
 indian_event.10.t: "BRICS 은행 제안"
 indian_event.10.d: "브릭스 은행은 각 회원국에 대한 개발 프로젝트를 제안했습니다. 우리는 동의해야 할까요?"
 indian_event.10.a: "좋다"
 indian_event.10.b: "미안하지만, 안된다"
 RAJ_BRICS_payment_system: "브릭스 지불 시스템"
 RAJ_BRICS_payment_system_desc: "거래를 개선하고 단순화하기 위해서는 새로운 거래 시스템과 지불 시스템을 만들어야 합니다."
 RAJ_BRICS_cur: "브릭스 공통 통화 노력"
 indian_event.11.t: "공통화폐 프로젝트"
 indian_event.11.d: "브릭스스가 새로운 공통 통화 프로젝트를 제안했는데, 우리는 동의해야 할까?"
 indian_event.11.b: "미안하지만, 안된다"
 RAJ_common_currenc_project: "공통화폐 프로젝트"
 RAJ_common_currenc_project_desc: "이 프로젝트는 즉시 실행되지 않을 수 있지만, 공통 화폐의 개념화는 상호 통합을 위한 좋은 기초가 됩니다."
 RAJ_BRICS_contig_reserv_arrang: "예비군 배치"
 RAJ_BRICS_contig_reserv_arrang_desc: "브릭스 비상 자금 마련 협정(BRICS Contingent Reserve Arrangement)은 글로벌 유동성 압박에 대한 보호를 제공하기 위한 프레임워크입니다. 여기에는 회원국들의 자국 통화가 글로벌 금융 압박에 의해 부정적인 영향을 받을 때 통화 문제를 포함합니다."
 RAJ_eastas.3.t: "혁신적인 미래를 위한 브릭스 경제 성장."
 RAJ_eastas.3.d: "The 11th BRICS Summit, held in Brasilia, Brazil, has come to a successful close, showcasing the commitment of Brazil, Russia, India, China, and South Africa to fostering cooperation and driving economic growth. The leaders of the member nations gathered in the Brazilian capital for two days of deliberations, discussions, and bilateral meetings. The summit commenced with an opening ceremony, during which President of Brazil welcomed the heads of state and emphasized the importance of strengthening the BRICS partnership to navigate global challenges and unlock new opportunities. The leaders engaged in comprehensive discussions on a wide range of issues, including trade, investment, innovation, and geopolitical concerns."
 RAJ_eastas.3.o1: "흥미롭군"
 RAJ_BRICS_pro_tempore: "브라질 정상회담"
 RAJ_BRICS_pro_tempore_desc: "국가 간 관계를 강화하기 위해 조직 역사상 가장 큰 규모의 정상회담을 소집할 때가 왔습니다."
 indian_event.12.t: "브릭스 초대"
 indian_event.12.d: "우리는 오랫동안 브릭스 기구의 참관국이였습니다. 그들은 우리에게 가입을 제안합니다. 우리가 그렇게 해야 할까요?"
 indian_event.11.a: "물론이지"
 indian_event.12.b: "미안하지만, 안된다"
 RAJ_eastas.4.t: "이란, 브릭스에 가입하다"
 RAJ_eastas.4.d: "중요한 발전이 있었습니다. 이란이 공식적으로 브라질, 러시아, 인도, 중국, 남아프리카공화국으로 구성된 브릭스 그룹에 가입했습니다. 브릭스 블록의 이 확장은 지역적 및 글로벌 협력에서 중요한 이정표를 의미하며, 이란은 영향력 있는 이 협회에 가입한 첫 번째 중동 국가가 되었습니다. 이 결정은 12차 브릭스 정상 회담에서 발표되었으며, 글로벌 상황으로 인해 화상 회의 형태로 진행되었습니다. 이란의 브릭스 가입은 회원국들 간의 폭넓은 논의 결과로, 이란의 전략적 중요성과 경제 협력 잠재력을 강조합니다. 이란의 참여는 브릭스 의 지역적 영향력을 강화할 뿐만 아니라 중동과 다른 브릭스 국가들 간의 협력을 증진시킬 것입니다."
 RAJ_eastas.4.o1: "흥미롭군"
 RAJ_BRICS_expansion: "브릭스 확장"
 RAJ_BRICS_expansion_desc: "브릭스가 중요한 동맹으로 계속 발전함에 따라, 자원과 전략적 중요성이 풍부한 이란을 초대하는 것은 새로운 차원을 추가할 것입니다. 이 포함은 우리의 집단적 비전을 다양화하고 강화하며, 동맹의 글로벌 영향력을 증대시킬 수 있습니다."
 RAJ_BRICS_as_econ_alliance: "경제 동맹"
 RAJ_BRICS_as_econ_alliance_desc: "군사적 노력 이상의 진정한 브릭스의 잠재력은 그들의 결합된 경제적 힘을 활용하는 데 있습니다. 통합된 경제 전선을 지지함으로써, 회원국들은 가속화된 성장, 금융 안정성, 그리고 향상된 시너지를 기대할 수 있으며, 이는 동맹의 글로벌 경제 무대에서의 입지를 강화하는 데 기여할 것입니다."
 brics_coalition: "브릭스-디에프 협정"
 RAJ_BRICS_as_polit_alliance: "브릭스 방위 협정"
 RAJ_BRICS_as_polit_alliance_desc: "균형 잡힌 글로벌 권력 역학을 위한 우리의 목표에 통합된, 브릭스 방위 협정의 수립은 자연스러운 발전입니다. 이 협정은 상호 방위 지원을 보장하고, 회원국 간의 결속을 강화하며, 외부 위협에 대한 집단적 안보를 보장할 것입니다."
 RAJ_new_development_bank: "신개발은행"
 RAJ_new_development_bank_desc: "새로운 개발 은행은 BRICS 통합과 회원국 간의 관계 개선을 위한 기반이 될 것입니다."
 RAJ_recognition_tibet_as_china: "티베트를 중국의 일부로 인정하다"
 RAJ_recognition_tibet_as_china_desc: "인도 정부는 1947년 인도 독립 직후, 티베트를 사실상 독립 국가로 취급했습니다. 그러나 최근 들어 인도의 티베트에 대한 정책은 중국의 민감성을 고려하여 티베트를 중국의 일부분으로 인정하고 있습니다."
 RAJ_national_highway_project: "국도 프로젝트"
 RAJ_national_highway_project_desc: "국도 개발 프로젝트(National Highways Development Project)는 기존의 국도를 4차선으로 확장하고, 일부 주요 국도를 6차선으로 확장하는 프로젝트입니다. 이 프로젝트는 1998년 아탈 비하리 바지파이 총리의 지도 하에 시작되었습니다. 국도는 전체 도로 길이의 약 2%에 불과하지만, 전국을 가로지르는 교통량의 약 40%를 운반합니다."
 RAJ_eastas.5.t: "인도는 티베트를 중국의 일부로 인정한다."
 RAJ_eastas.5.d: "국경 분쟁 해결을 가속화하려는 시도로, 인도와 중국은 화요일에 특별 대표를 임명하여 전체 양국 관계의 정치적 관점에서 국경 해결을 위한 틀을 탐색하기로 합의했습니다. 아탈 비하리 바지파이 총리와 중국의 웬 지아바오 총리가 서명한 최초의 \"원칙 관계 및 포괄적 협력에 관한 공동 선언\"에서, 인도는 티베트 자치구가 중화인민공화국 영토의 일부임을 인정했습니다."
 RAJ_eastas.5.o1: "흥미롭군"
 RAJ_pradhan_mantri_gram_sadak_yojana: "프라단 만트리 그람 사닥 요자나"
 RAJ_pradhan_mantri_gram_sadak_yojana_desc: "프라단 만트리 그람 사닥 요자나(Pradhan Mantri Gram Sadak Yojana)는 인도의 전국적 계획으로, 연결되지 않은 마을에 우수한 전천후 도로 연결성을 제공하기 위한 것입니다."
 RAJ_article_three_seventy: "헌법 제370조"
 RAJ_article_three_seventy_desc: "인도 헌법 제370조는 인도 아대륙 북부에 위치한 자무와 카슈미르 지역에 특별한 지위를 부여했습니다. 이 지역은 1947년 이후 인도, 파키스탄, 중국 간의 분쟁 대상이 되어 온 카슈미르 지역의 일부입니다. 제370조는 자무와 카슈미르에 대한 자치권을 부여하고, 해당 지역이 다른 인도 지역들과는 다르게 법적 특권을 가질 수 있도록 했습니다."
 RAJ_sarva_shisha_abhiyan: "사르바 시크샤 아비얀"
 RAJ_sarva_shisha_abhiyan_desc: "사르바 시크샤 아비얀(Sarva Shiksha Abhiyan, SSA)은 인도 정부의 프로그램으로, \"시간 제한 방식\"으로 초등 교육의 보편화를 목표로 합니다. 이 프로그램은 인도 헌법 제86차 개정안을 통해 6세에서 14세 사이의 아동에게 무상 및 의무 교육을 제공하는 것을 기본권으로 명시한 것입니다. SSA는 모든 아동이 교육을 받을 수 있도록 보장하고, 초등 교육의 접근성을 높이는 중요한 이니셔티브입니다."
 RAJ_foreign_education_partner_ship: "외국 교육 협력"
 RAJ_foreign_education_partner_ship_desc: "우리 학생들은 더욱 똑똑해지기 위해 외국 교육을 받을 기회가 필요합니다."
 indian_event.13.t: "웨스트엔드 작전"
 indian_event.13.d: "창립자 타룬 테즈팔이 이끄는 테헬카는 몰래카메라와 무기상으로 위장한 잠입 기자들을 활용한 함정 취재를 벌였습니다. 이 작전은 주로 방위 산업 내의 부패를 겨냥했으며, 불법 무기 거래에 연루되고 뇌물을 받은 혐의가 있는 고위 관료와 정치인에 초점을 맞추었습니다. 수개월에 걸쳐 테헬카의 잠입 기자들은 관료, 군 장교, 정치인을 포함한 여러 공직자와의 대화를 녹음했습니다. 이들은 이 인물들이 뇌물을 받고 방위 조달과 관련된 불법 행위를 논의하는 영상 증거를 확보했습니다. 이 작전은 특히 무기, 탄약, 차량 등 방위 장비 구매에서의 부패를 부각시켰습니다. 작전은 테헬카가 폭발적인 영상 시리즈를 공개하고 부패 스캔들을 상세히 다룬 기사를 게재하면서 알려졌습니다. 이 폭로는 전국적으로 엄청난 파문을 일으켜 대중의 분노와 연루자에 대한 조치 요구로 이어졌습니다. 여러 정당 소속 정치인, 군 장교, 관료를 비롯한 다수의 저명인사가 함정 취재에 포착되었습니다. 연루된 저명한 인물로는 당시 인도국민당 총재였던 방가루 락슈만이 카메라에 뇌물을 받는 모습이 포착되었으며, 사마타당의 고위 정치인인 자야 제틀리도 있었습니다."
 indian_event.13.a: "책임자들을 해임하라!"
 indian_event.13.b: "그대로 두자."
 RAJ_operation_west_end: "웨스트엔드 작전"
 RAJ_operation_west_end_desc: "웨스트엔드 작전은 테헬카 폭로로도 알려져 있으며, 2001년 인도 뉴스 포털 테헬카가 수행한 대규모 잠입 취재 작전을 가리킵니다. 이 작전은 인도 방위 부문의 부패를 폭로하여 전국적인 스캔들로 번졌습니다."
 indian_event.14.t: "인도-파키스탄 공동 정상회담"
 indian_event.14.d: "이 정상회담에는 당시 인도 총리 아탈 비하리 바지파이와 당시 파키스탄 대통령 페르베즈 무샤라프가 참석했습니다. 정상회담의 주된 목적은 대화를 촉진하고 인도와 파키스탄 사이의 갈등, 특히 카슈미르 문제에 대한 평화적 해결을 모색하는 것이었습니다. 정상회담 중 양국 정상은 카슈미르 분쟁, 테러, 국경 간 긴장을 비롯한 여러 사안에 대해 폭넓게 논의했습니다. 회담은 비공개로 진행되었으며 협상의 세부 내용은 당시 대중에게 공개되지 않았습니다. 그러나 논의는 종종 격렬했고 몇 가지 핵심 사안에 대해 서로 다른 관점이 오갔다고 보도되었습니다."
 indian_event.14.a: "환상적이군"
 RAJ_agra_summit: "아그라 정상회담"
 RAJ_agra_summit_desc: "아그라 정상회담은 아그라 평화 정상회담으로도 알려져 있으며, 2001년 7월 인도 아그라에서 열린 인도와 파키스탄 정상 간의 고위급 외교 회담이었습니다. 이 정상회담은 카슈미르 분쟁을 비롯하여 양국 간의 오랜 문제를 해결하려는 중요한 시도였습니다."
 RAJ_new_defence_council_gathering_d: "카슈미르 국경 긴장"
 RAJ_new_defence_council_gathering: "국방 회의"
 RAJ_new_defence_council_gathering_desc: "파키스탄의 선의에 의존할 필요가 없습니다! 국방 회의를 소집하여 방어와 반격 계획을 다시 한번 준비할 때입니다."
 RAJ_easing_military_standoff: "군사 대치 완화"
 RAJ_easing_military_standoff_desc: "파키스탄과의 국경 관계는 매우 긴장되어 있습니다. 상황을 진정시키려 노력해 볼 만합니다."
 indian_event.15.t: "라자스탄 핵실험"
 indian_event.15.d: "이 실험은 인도가 최대 200킬로톤의 위력을 지닌 핵분열 및 열핵 무기를 제작할 수 있는 능력을 갖추게 한다는 주된 목표를 달성했습니다. 당시 인도 원자력위원회 위원장은 포크란-II의 폭발 하나하나가 다른 핵보유국들이 수십 년에 걸쳐 수행한 여러 차례의 실험에 맞먹는다고 설명했습니다. 이후 인도는 이번 실험에 사용된 폭발물의 설계와 관련된 핵폭발물의 위력을 예측하는 컴퓨터 시뮬레이션 능력을 구축했습니다."
 indian_event.15.a: "환상적이군"
 indian_event.16.t: "인도의 정보"
 indian_event.16.d: "인도가 우리에게 중국에 대한 전략적 군사 정보를 제공했습니다."
 indian_event.16.a: "환상적이군"
 RAJ_strategic_assistance_to_us: "미국에 대한 전략적 지원"
 RAJ_strategic_assistance_to_us_desc: "미국은 중국에 맞서는 데 있어 우리의 주축이 될 것입니다."
 RAJ_world_hindi_conference: "세계 힌디어 회의"
 RAJ_world_hindi_conference_desc: "세계 힌디어 회의는 전 세계의 학자, 언어학자, 작가, 힌디어 애호가를 한자리에 모으는 국제 행사입니다. 이 회의는 힌디어와 그 문화유산의 풍요로움과 다양성을 증진하고 기념하는 장으로 기능합니다."
 RAJ_citizenship_india: "개선된 행정 기구"
 RAJ_citizenship_india_desc: "인도인이 인도 시민권을 취득하고 인도로 귀환할 가능성을 높여야 합니다."
 RAJ_amoozesh_parvaresh: "개선된 중학교"
 raj_middle_school_tt: "§Y인도 중학교를 개선합니다§!"
 RAJ_middle_school_modernization: "중학교 현대화"
 RAJ_middle_school_modernization_desc: "인도의 중등학교는 오랫동안 현대화되지 않았으며 접근 방식과 교수법의 변화가 필요합니다."
 RAJ_good_governance_day: "선정의 날"
 RAJ_good_governance_day_desc: "아탈 비하리 바지파이는 훌륭한 국정 운영 방식으로 잘 알려져 있습니다."
 RAJ_further_privatization: "민영화 확대"
 RAJ_further_privatization_desc: "경제의 방향을 바꾼 이후, 우리는 경제의 민영화를 더욱 확대하는 길을 계속 가야 합니다."
 RAJ_videsh_sanchar: "비데시 상차르 확장"
 RAJ_videsh_sanchar_desc: "인도가 21세기에 접어들면서 통신망을 확장하고 전국에 정보 보급 범위를 제공해야 합니다."
 RAJ_hindu_primacy_economy: "힌두 윤리가 지배하는 경제"
 RAJ_hindu_primacy_economy_desc: "인도의 윤리는 사회적 관계뿐 아니라 경제적 관계의 기초가 되어야 합니다. 오직 그곳에서만 공정한 경쟁을 보장할 수 있습니다."
 RAJ_dab_on_lashkare_taiba: "라슈카르 에 타이바 대응"
 RAJ_dab_on_lashkare_taiba_desc: "이슬람주의 단체들은 오랫동안 우리나라에서 지하 활동을 해 왔습니다. 이제 그들을 찾아내 대응책을 마련할 때입니다."
 RAJ_joint_summit_with_pakistan: "파키스탄과의 공동 정상회담"
 RAJ_joint_summit_with_pakistan_desc: "양국을 안심시키기 위해 파키스탄과의 공동 정상회담을 소집해야 합니다. 이는 긴장을 낮추고 향후 협력을 가능하게 할 것입니다."
 RAJ_iri_fake_ns2: "크게 부패한 군수 산업"
 RAJ_iri_fake_ns3: "어느 정도 부패한 군수 산업"
 RAJ_iri_fake_ns4: "부패가 적은 군수 산업"
 RAJ_re_fake_militar2: "어느 정도 무질서한 군대"
 RAJ_re_fake_militar3: "무질서가 적은 군대"
 RAJ_re_fake_militar4: "조직화된 군대"
 RAJ_true_tiger_economy: "진정한 호랑이 경제"
 RAJ_true_tiger_economy_desc: "호랑이 경제란 일반적으로 생활 수준의 향상을 동반하여 급속한 경제 성장을 이루는 나라의 경제를 말합니다."
 indian_event.17.t: "인도 경제"
 indian_event.17.d: "2000년, 인도 경제는 상당한 성장과 변화를 겪고 있었습니다. 1990년대 초반에 시작된 점진적인 경제 자유화 조치들이 경제 환경을 형성하는 주요한 요소로 작용하고 있었습니다. 10억 명이 넘는 인구를 가진 인도는 방대한 소비 시장과 외국인 투자를 끌어들인 노동력을 보유한 국가였습니다. 경제는 주로 농업, 산업, 서비스업에 의해 주도되었습니다. 농업은 여전히 많은 인구를 고용하고 있으며, 식량 안보와 농촌 생계를 지원하는 중요한 역할을 했습니다. 산업 부문은 제조업과 섬유 산업을 중심으로 확장되었고, 특히 정보 기술(IT)과 비즈니스 프로세스 아웃소싱(BPO) 분야에서 서비스업이 주요 성장 엔진으로 떠오르고 있었습니다."
 indian_event.17.a: "흥미롭군"
 RAJ_natural_competitor: "자연스러운 경쟁자"
 RAJ_natural_competitor_desc: "인도는 세계 시장에서 자연스러운 경쟁자입니다. 우리는 전 세계를 따라잡고 앞지르지 않으면 안 됩니다."
 indian_event.18.t: "인도 투자를 요청하다"
 indian_event.18.d: "The diplomats of the [RAJ.GetNameWithFlag] have approached our government today with an interesting proposal. They are looking to investigate investments and development within the [RAJ.GetAdjective] economy to develop them further. The deal would bring our two countries closer together and ultimately help economic ties between the two of us. Should we agree to their terms?"
 indian_event.18.a: "물론이지"
 indian_event.18.b: "미안하지만, 안된다"
 indian_event.19.t: "투자 제안을 거절한 [FROM.GetName]!"
 indian_event.19.d: "[FROM.GetName]은 우리의 투자 제안을 거부했습니다. 정말로 슬픈 날입니다."
 indian_event.19.a: "으억"
 indian_event.20.t: "[FROM.GetName] 투자 제안이 승인되었습니다!"
 indian_event.20.d: "[FROM.GetName]이 제안을 수락했습니다!"
 indian_event.20.a: "좋아"
 RAJ_attract_foreign_business: "외국인 투자자 유치"
 RAJ_attract_foreign_business_desc: "외부 자본을 유치하는 것은 경제를 확장하는 데 필수적입니다. 이제 다양한 파트너들에게 매력적인 제안을 보내야 할 때입니다."
 RAJ_the_new_steel_industry: "새로운 철강 산업"
 RAJ_the_new_steel_industry_desc: "철강은 중공업의 기초입니다. 철강 없이는 산업의 경쟁 기반을 만드는 것은 불가능합니다. 우리는 철강의 생산을 확대해야 합니다."
 RAJ_expand_the_mines: "광산 확장"
 RAJ_expand_the_mines_desc: "산업을 건설하려면 필연적으로 자원광산을 확장하고 국가의 자원 매장량을 늘려야 합니다."
 RAJ_subs_coal_india: "광업 산업에 보조금을 지급하자"
 RAJ_subs_coal_india_desc: "우리나라의 자원 추출 개발을 강화하기 위해서는 경제의 이 부문에 보조금을 지급해야 합니다."
 RAJ_hindustan_zinc: "힌디스탄 징크"
 RAJ_hindustan_zinc_desc: "힌두스탄 징크 리미티드(Hindustan Zinc Limited)는 아연, 납, 은, 카드뮴을 생산하는 인도의 종합 광업 및 자원 생산업체입니다. 이 회사는 베단타 리미티드(Vedanta Limited)의 자회사가 됩니다."
 RAJ_bus_nmdc: "국립광물개발공사 (MMDC)"
 RAJ_bus_nmdc_desc: "NMDC 리미티드(NMDC Limited), 이전의 국영 광물 개발 공사(National Mineral Development Corporation)는 철광석, 구리, 인산염, 석회석, 돌로마이트, 석고, 벤토나이트, 마그네사이트, 다이아몬드, 주석, 텅스텐, 흑연, 석탄 등 다양한 자원의 탐사에 종사하는 인도의 공기업입니다. NMDC는 인도의 최대 철광석 생산 및 수출업체로, 채티스가르와 카르나타카에 위치한 세 개의 기계화된 광산에서 연간 3500만 톤 이상의 철광석을 생산하고 있습니다."
 RAJ_deregul_the_econ: "경제 규제 완화"
 RAJ_deregul_the_econ_desc: "경제 규제 완화는 인도에서 더욱 역동적이고 빠르게 성장하는 시장을 만드는 데 중요한 측면입니다."
 RAJ_industrial_investments: "산업 투자"
 RAJ_industrial_investments_desc: "외부 투자자와 다양한 사업가들에게 의지하는 것 외에도, 국가 스스로가 국가 산업에 투자하기 위한 노력을 해야 합니다."
 RAJ_indian_machine_tool_assoc: "인도 기계 도구 협회"
 RAJ_indian_machine_tool_assoc_desc: "인도공작기계제조업자협회는 인도의 공작기계 부문을 대표하는 산업단체입니다."
 ind_mach_tool_tt: "§Y인도 공작기계 협회는 우리 산업을 크게 발전시킬 것입니다§!"
 indian_event.21.t: "섬유 전시회!"
 indian_event.21.d: "인도에서 열린 섬유 산업 전시회는 국가의 활기차고 다양한 섬유 부문을 보여주었습니다. 의류, 직물, 액세서리를 포함한 다양한 제품들이 전시되어 인도 섬유 산업의 장인 정신과 혁신을 강조했습니다. 전시된 제품 중 인도 핑크 셔츠는 특히 눈에 띄었으며, 권위 있는 대회에서 우승하면서 큰 인정을 받았습니다. 이 셔츠는 전통적인 예술성과 현대적인 디자인의 독특한 조화를 보여주었으며, 정교한 손 작업과 고급 직물의 결합을 특징으로 했습니다. 인도 핑크 셔츠는 그 뛰어난 장인정신, 세밀한 디테일, 그리고 화려한 색상 팔레트로 관객을 매료시켰습니다. 이 성과는 인도 섬유 장인들의 재능과 창의성을 축하하는 동시에 인도 섬유의 글로벌 매력을 부각시켰습니다. 또한 인도가 섬유 생산과 디자인의 주요 목적지로서의 명성을 더욱 강화하고, 전통과 현대 패션 트렌드에 적응하는 능력을 강조하는 계기가 되었습니다. 전시회에서 인도 핑크 셔츠의 성공은 인도 섬유 산업의 번영, 국제적인 인정, 그리고 국가 경제와 문화 정체성에 대한 지속적인 기여를 증명하는 사례가 되었습니다."
 indian_event.21.a: "좋아"
 RAJ_textile_exhibition: "직물업"
 RAJ_textile_exhibition_desc: "인도의 섬유 산업은 전통적으로 농업에 이어 숙련된 노동력과 비숙련 노동력 모두에게 막대한 고용을 창출한 유일한 산업입니다. 섬유 산업은 현재도 인도에서 두 번째로 큰 고용 창출 부문으로 자리잡고 있습니다."
 RAJ_indian_naval_industry: "인도 해군 산업"
 RAJ_indian_naval_industry_desc: "우리는 무역 및 해상 분야에서 좋은 입지를 가지고 있지만, 해양 산업을 발전시킬 필요가 있습니다."
 RAJ_indian_mitime_research: "인도 해양 연구"
 RAJ_indian_mitime_research_desc: "조선 및 해양 산업 분야의 연구는 우리의 경제 상황의 발전에 필수적입니다."
 RAJ_hindalco: "힌달코"
 RAJ_hindalco_desc: "힌달코 인더스트리즈 리미티드는 인도의 알루미늄 및 구리 제조 기업으로, 아디티야 비를라 그룹의 계열사입니다."
 RAJ_eastern_dockyards: "동부 조선소"
 RAJ_eastern_dockyards_desc: "동부에 새로운 조선소를 건설하고 그 지역의 해양 산업을 발전시키자는 제안이 있습니다."
 RAJ_western_dockyards: "서부 조선소"
 RAJ_western_dockyards_desc: "서부에 새로운 조선소를 건설하고 그 지역의 해양 산업을 발전시키자는 제안이 있습니다."
 RAJ_manufact_schemes: "경제 계획"
 RAJ_manufact_schemes_desc: "인도가 21세기에 접어든 만큼, 시대의 요구에 부응하는 새로운 생산 구조와 공급망을 만들 때입니다."
 RAJ_diamond_ind: "다이아몬드 산업"
 RAJ_diamond_ind_desc: "다이아몬드와 귀금속 채굴은 인도 수출의 중요한 부분입니다. 경제를 발전시키려면 새로운 광상을 개발해야 합니다."
 RAJ_expand_chromium: "크롬 확장"
 RAJ_expand_chromium_desc: "새로 발견된 크롬 광상이 국내외 투자자들을 끌어들이고 있습니다. 이 문제를 발전시켜 채굴을 시작해야 합니다."
 RAJ_expand_khullar: "쿨라르 확장"
 RAJ_expand_khullar_desc: "우리 정부는 국가의 보물인 천연자원을 돌보는 것이 마땅하다고 판단했습니다."
 RAJ_indian_car_industry: "인도 자동차 산업"
 RAJ_indian_car_industry_desc: "국제 시장에서 경쟁력 있는 나라가 되려면 자동차 산업을 계속 발전시켜야 합니다."
 RAJ_petrol_refiners: "정유소"
 RAJ_petrol_refiners_desc: "석유는 현대 경제와 군수 산업의 생명줄입니다. 이 산업을 발전시켜야 합니다."
 RAJ_unpec_growth: "전례 없는 성장"
 RAJ_unpec_growth_desc: "와, 우리 경제가 크게 강해졌습니다! 이를 기념하여 정부는 오늘 저녁 연회까지 마련했습니다."
 RAJ_export_of_india: "인도의 수출"
 RAJ_export_of_india_desc: "우리나라는 자원이 풍부하며, 식민 통치 시절 영국과 다른 식민 국가들에 자원을 수출하느라 이미 고통받았지만, 지금은 수출을 통한 추가 자금으로 경제를 뒷받침해야 합니다."
 RAJ_UAZ: "UAZ"
 RAJ_russia_cars_companies: "러시아 자동차 기업"
 RAJ_russia_cars_companies_desc: "러시아는 자동차 산업이 상당히 발달한 나라입니다. 이 산업에서 우리의 입지를 개선하기 위해 그들의 기업을 초청해야 합니다."
 RAJ_the_bull_of_asia: "아시아의 황소"
 RAJ_the_bull_of_asia_desc: "우리나라는 아시아의 경제적 황소이며, 그 뿔로 중국 경제마저 들이받을 것입니다."
 RAJ_the_worlds_jeweller: "세계의 보석 세공인"
 RAJ_the_worlds_jeweller_desc: "다이아몬드, 사파이어를 비롯한 광물은 우리의 국부입니다. 우리는 이 독보적인 위치를 활용해야 합니다."
 RAJ_indian_rice_funds: "인도 쌀 기금"
 RAJ_indian_rice_funds_desc: "이번에는 중국만이 유일한 쌀 초강대국이 되지는 않을 것입니다."
 RAJ_indian_infrastruct: "인도 인프라"
 RAJ_indian_infrastruct_desc: "현재 우리나라의 인프라 상황은 용납할 수 없는 수준입니다. 이를 막지 못하면 도로가 형편없다는 농담이 우리에게까지 번질 것입니다."
 RAJ_brazillian_industrial_partnership: "브라질 산업 협력"
 RAJ_brazillian_industrial_partnership_desc: "브라질은 우리 산업 부문의 현대화와 확장에 도움이 될 귀중한 전문 지식과 자원을 제공합니다. 협력 관계를 맺으면 기술 발전을 가속하고 양국 간 경제적 유대를 강화할 수 있습니다."
 RAJ_dealing_with_eu_companies: "유럽 기업과의 거래"
 RAJ_dealing_with_eu_companies_desc: "유럽은 우리 경제가 유럽 경제와 교류하는 주된 시장입니다. 우리는 이 분야를 발전시켜야 합니다."
 RAJ_hindustan_aeronautics: "힌두스탄 항공"
 RAJ_hindustan_aeronautics_desc: "하늘은 인류가 정복한 세 번째 바다입니다. 더 강해지기 위해 모든 프로펠러를 동원해 이 산업을 장악해야 합니다."
 RAJ_tatamotors: "타타 모터스"
 RAJ_tatamotors_desc: "타타 모터스는 우리의 주력 자동차 기업입니다. 우리는 이 기업을 서방 경쟁사보다 더 앞선 기업으로 만들어야 합니다."
 RAJ_building_industry_of_india: "인도 건설 산업"
 RAJ_building_industry_of_india_desc: "이제 인도는 스스로를 일으켜 세울 능력을 갖추었습니다."
 RAJ_fight_unorganiz_work_force: "비조직 노동력 대응"
 RAJ_fight_unorganiz_work_force_desc: "실업은 우리의 가장 큰 적입니다. 이제 이 나라의 모든 사람이 일하게 될 것입니다."
 RAJ_ultra_tech_content: "초첨단 기술 콘텐츠"
 RAJ_ultra_tech_content_desc: "컴퓨터 기술 개발에서 서방 국가들을 따라잡아야 할 때입니다."
 RAJ_increasing_control_over_business: "기업 통제 강화"
 RAJ_increasing_control_over_business_desc: "우리나라의 기업을 방치해서는 안 됩니다. 우리 경제의 운명이 여기에 달려 있을지도 모릅니다."
 RAJ_lagilizing_the_business: "기업 합법화"
 RAJ_lagilizing_the_business_desc: "기업의 질을 높이는 다음 단계는 불법 행위의 여지를 없애는 것입니다."
 indian_event.22.t: "값싼 노동력의 딜레마"
 indian_event.22.d: "인도의 노동 시장을 어떻게 개혁할지 결정해야 합니다. 노동자의 권리를 지지해야 합니까, 아니면 현 상태를 유지해야 합니까?"
 indian_event.22.a: "노동자의 권리를 보장하라!"
 indian_event.22.b: "현 상태를 유지하라."
 RAJ_modern_building_technology: "현대 건설 기술"
 RAJ_modern_building_technology_desc: "인도가 세계에서 가장 발전한 국가 중 하나가 되는 때에 더욱 가까이 다가설 시간입니다."
 RAJ_mumbai_restoration: "뭄바이 집중 개발"
 RAJ_mumbai_restoration_desc: "낡은 뭄바이를 재건할 때입니다."
 RAJ_delhi_urbanization_plan: "델리 도시화 계획"
 RAJ_delhi_urbanization_plan_desc: "수도 델리를 도시화해야 합니다. 이는 우리나라의 여건을 개선할 것입니다."
 RAJ_unslumization_of_cities: "도시 슬럼 해소"
 RAJ_unslumization_of_cities_desc: "우리나라의 삶을 개선하기 위한 또 하나의 사업입니다."
 RAJ_mahindra: "마힌드라"
 RAJ_mahindra_desc: "마힌드라 앤드 마힌드라는 SUV, 트럭, 트랙터를 생산하는 인도의 자동차 제조사입니다."
 RAJ_force_motors: "포스 모터스"
 RAJ_force_motors_desc: "버전에 따라 시내 또는 시외용 소형 버스이며, 길이 6.7미터에 좌석 수는 18석에서 32석까지입니다. 엔진은 터보 디젤 4기통 76마력입니다."
 RAJ_uranium_corp_of_india: "인도 우라늄 공사"
 RAJ_uranium_corp_of_india_desc: "원자력부 산하에서 우라늄 채굴과 제분을 담당하는 공기업입니다. 이 공사는 1967년에 설립되었으며 인도의 우라늄 광석 채굴과 제분을 책임집니다. 자두고르, 바티나, 나르와파하르, 투람디, 반두항 등지에서 광산을 운영합니다."
 RAJ_inviting_iaea: "IAEA 초청"
 RAJ_inviting_iaea_desc: "국제원자력기구(IAEA)는 1954년 12월 4일 UN 결정에 따라 설립된 국제기구입니다. UN 체제의 일원으로서 원자력의 평화적 이용에 관한 협력을 발전시킬 권한을 행사합니다."
 RAJ_bus_agreement_with_us: "미국과의 협정"
 RAJ_bus_agreement_with_us_desc: "미국은 원자력 분야에서 우리의 최대 무역 상대국이 되었습니다. 더 많은 협정에 서명할 때입니다."
 RAJ_bus_agreement_with_rus: "러시아와의 거래"
 RAJ_bus_agreement_with_rus_desc: "러시아의 원자력 산업 역시 세계 최고 수준 중 하나입니다. 우리는 러시아와 더 많이 협력하기 시작해야 합니다."
 RAJ_finalize_kaiga: "카이가 완공"
 RAJ_finalize_kaiga_desc: "카이가 발전소는 인도 카르나타카주 우타라칸나다 지구의 칼리강 인근 카이가에 위치한 원자력 발전소입니다. 이 발전소는 2000년 3월부터 가동되었으며 인도 원자력 공사가 운영합니다."
 RAJ_tarapur4: "타라푸르 4호기"
 RAJ_tarapur4_desc: "인도의 타라푸르 4호기 원자력 발전소는 용량 540MW로 인도에서 가장 큰 원자로입니다. 인도 원자력 공사가 건설하고 있습니다."
 RAJ_expanding_nmdc: "NMDC 확장"
 RAJ_expanding_nmdc_desc: "NMDC 확장은 국가의 채굴 능력과 철광석 및 희소 광물의 수출 수익을 늘립니다."
 RAJ_invite_foreign_powers: "외국인 투자자 유치"
 RAJ_invite_foreign_powers_desc: "발전이 더 빨리 이루어지도록 이 산업을 외국인 투자자에게 더 매력적으로 만들어야 합니다."
 RAJ_bringing_back_the_plan: "계획 경제의 부활"
 RAJ_bringing_back_the_plan_desc: "중앙 집중식 계획이 우리의 경제 전략을 재편합니다. 산업 성장은 빨라지지만, 이념적 전환이 정치적 저항을 불러옵니다."
 RAJ_expansive_subsidies: "대규모 보조금"
 RAJ_expansive_subsidies_desc: "보조금은 인도의 농업 기반을 뒷받침하여 농촌 공동체와 농업 생산성을 강화합니다."
 RAJ_indian_ricebelt: "인도 쌀 지대"
 RAJ_indian_ricebelt_desc: "쌀 재배에 대한 투자는 우리의 농업 경제와 농촌의 안정을 강화합니다."
 RAJ_leaving_as_it_is: "현 상태 유지"
 RAJ_leaving_as_it_is_desc: "재생 에너지(풍력과 태양광)가 우리의 장기 에너지 전략과 자급자족의 핵심이 됩니다."
 RAJ_teacoffedance: "차, 커피, 함께 춤을."
 RAJ_teacoffedance_desc: "차와 커피 수출 확대는 경제 성장과 국내 자율성을 이끕니다."
 RAJ_exportsubsidies: "수출 규제"
 RAJ_exportsubsidies_desc: "수출 통제는 우리의 자원을 보호하고 국내 제조업의 자립을 촉진합니다."
 RAJ_high_import_tariffs: "높은 수입 관세"
 RAJ_high_import_tariffs_desc: "높은 관세는 인도 산업을 외국과의 경쟁으로부터 보호하고 경제적 주권을 구축합니다."
 RAJ_tea_production: "차 생산"
 RAJ_tea_production_desc: "차 생산 확대는 농촌 고용과 수출 수익을 늘립니다."
 RAJ_coffee_production: "커피 생산"
 RAJ_coffee_production_desc: "커피 재배는 농업 관계를 강화하고 수출 지향적 농업 기반을 구축합니다."
 RAJ_coffee_tata_tea: "차·커피 수출 확대"
 RAJ_coffee_tata_tea_desc: "타타를 비롯한 기업들과의 민간 부문 협력은 산업 역량을 키우는 한편 차와 커피 수출을 확대합니다."
 RAJ_supporting_local_producers: "지역 생산자 지원"
 RAJ_supporting_local_producers_desc: "소기업에 대한 정부 지원은 지역 제조업과 장인 정신을 키웁니다."
 RAJ_indian_rice_bowl: "인도의 쌀 그릇"
 RAJ_indian_rice_bowl_desc: "쌀 생산에 대한 집중적인 추진은 정치적 비용을 치르더라도 식량 안보와 농촌 경제를 강화합니다."
 RAJ_incr_regional_control: "지방 통제 강화"
 RAJ_incr_regional_control_desc: "지방 행정의 중앙 집중화는 국가 역량과 지방 사안에 대한 정치적 통제를 강화합니다."
 RAJ_local_prod_gov_prod: "지역 생산자? 정부 생산자!"
 RAJ_local_prod_gov_prod_desc: "국영 생산이 민간 기업을 대체하여 공공 제조 역량과 자립을 구축합니다."
 RAJ_new_prospects_for_socialism: "사회주의의 새로운 전망"
 RAJ_new_prospects_for_socialism_desc: "사회주의 이상을 받아들이면 산업에 대한 국가 통제와 재분배 정책이 가속화됩니다."
 RAJ_state_run_capitalism: "국가 자본주의"
 RAJ_state_run_capitalism_desc: "국영 기업이 민간 독점을 대체하여 시장의 힘과 공적 통제 사이에서 균형을 맞춥니다."
 RAJ_further_expansion_into_market: "경제 위원회"
 RAJ_further_expansion_into_market_desc: "경제 위원회가 국가 투자와 산업 성장을 조율합니다."
 RAJ_secured_food_source: "안정적인 식량 공급원"
 RAJ_secured_food_source_desc: "농업 투자를 통한 식량 자급은 농민의 지지를 얻고 경제적 회복력을 키웁니다."
 RAJ_unite_the_farms: "농장을 하나로 모으자"
 RAJ_unite_the_farms_desc: "집단 농업 사업은 농촌의 협력과 국내 식량 자립을 강화하지만, 일부 민간 이해관계자들은 반발합니다."
 RAJ_our_next_logical_step: "지방 총독과의 협상"
 RAJ_our_next_logical_step_desc: "지방 총독들과의 협상은 중앙 권력과 지역 인프라 개발을 강화합니다."
 RAJ_full_socialism_control: "완전한 사회주의 전환"
 RAJ_full_socialism_control_desc: "사회주의의 속삭임이 점점 커지면서 정치 지형에 깊은 변화가 펼쳐집니다. 과거 과두제의 잔향이 사라지고 전인도노동조합회의가 목소리를 내면서 인도의 이념적 여정에 새로운 장이 열립니다."
 RAJ_pressure_big_business: "대기업 압박"
 RAJ_pressure_big_business_desc: "정책과 상업 사이의 은근한 줄다리기가 격화되면서 더욱 자주적인 경제 구도로 가는 길이 열립니다. 이러한 변화의 물결 속에서 국내 자율성의 본질은 더욱 확고한 기반을 얻습니다."
 RAJ_looming_water1: "물 부족 완화"
 RAJ_looming_water2: "부분적 물 부족"
 RAJ_stabiliz_supply_water: "물 공급 안정화"
 RAJ_stabiliz_supply_water_desc: "물 부족 문제는 인도에서 매우 시급한 의제입니다. 이 문제를 해결하기 위해 모든 노력을 기울여야 합니다."
 RAJ_israeli_water_spec: "이스라엘 물 전문가"
 RAJ_israeli_water_spec_desc: "이스라엘 전문가들이 이미 주민에 대한 물 여과 및 공급 문제에서 도움을 제안했습니다."
 RAJ_spanish_water_spec: "스페인 물 전문가"
 RAJ_spanish_water_spec_desc: "스페인 전문가들이 이미 주민에 대한 물 여과 및 공급 문제에서 도움을 제안했습니다."
 RAJ_minjur_water_plant: "민주르 담수 시설"
 RAJ_minjur_water_plant_desc: "민주르 담수화 시설은 인도 첸나이 북부 교외의 벵골만 연안 카투팔리 마을에 있는 역삼투 방식의 담수화 시설로, 첸나이시에 물을 공급합니다. 60에이커 부지에 건설되었으며 인도에서 가장 큰 담수화 시설입니다."
 RAJ_nemmeli_water_plant: "넴멜리 담수 시설"
 RAJ_nemmeli_water_plant_desc: "넴멜리 담수화 시설은 첸나이 넴멜리의 벵골만 연안에 있는 담수화 시설로, 첸나이시에 물을 공급합니다."
 water_ind_tt: "§G물 부족 문제를 점진적으로 해결할 것입니다§!"
 RAJ_invest_in_bollywood: "발리우드에 투자"
 RAJ_invest_in_bollywood_desc: "발리우드에 대한 국가 투자는 인도 영화 산업을 확장하고 문화 수출을 촉진하며 세계 무대에서 소프트 파워를 창출할 것입니다."
 indian_event.23.t: "세계를 놀라게 한 인도 영화 산업!"
 indian_event.23.d: "최신 인도 영화 《미스틱 드림스》가 전 세계를 휩쓸면서 인도 영화는 다시 한번 세계적인 저력을 입증했습니다. 저명한 인도 영화감독 로히트 베르마가 연출한 이 영화는 흥행 기록을 갈아치우고 전 세계 관객의 마음을 사로잡으며 세계 무대에서 인도 영화의 새로운 이정표를 세웠습니다. 《미스틱 드림스》는 사랑, 자아 발견, 인간적 유대의 힘을 담은 설득력 있는 이야기를 들려줍니다. 장엄한 히말라야를 배경으로 놀라운 영상미, 매혹적인 스토리텔링, 재능 있는 앙상블 출연진의 뛰어난 연기가 아름답게 어우러집니다. 이 영화의 성공은 다양한 문화적 배경을 가진 관객의 공감을 얻는 능력 덕분입니다. 사랑, 희망, 영성이라는 보편적 주제는 언어와 문화의 장벽을 넘어 전 세계 관객의 마음을 울렸습니다. 숨 막힐 듯한 촬영과 세심하게 다듬어진 서사는 평론가와 관객 모두에게서 찬사를 받았습니다."
 indian_event.23.a: "인도는 정말 최고다! 의심하는 자들은 틀렸다!"
 RAJ_bolywood_idea: "발리우드"
 RAJ_tata_consult: "타타 컨설트"
 RAJ_tata_consult_desc: "타타 컨설턴시 서비시스(TCS)는 타타 그룹에 속한 인도의 다국적 IT 서비스 및 컨설팅 기업입니다. 본사는 뭄바이에 있으며 세계 최대 규모의 IT 고용 기업 중 하나입니다."
 RAJ_software_tech_park: "소프트웨어 기술 단지"
 RAJ_software_tech_park_desc: "전자정보기술부(MeitY) 산하의 과학기술 기관으로, 신흥 기술 분야의 IT 및 ITES 산업, 혁신, 연구, 스타트업, 지식재산 진흥에 종사합니다."
 RAJ_hcl_tech_lim: "HCL 테크 리미티드"
 RAJ_hcl_tech_lim_desc: "HCL 테크놀로지스 리미티드(HCLTech으로 영업, 구 힌두스탄 컴퓨터스 유한회사)는 노이다에 본사를 둔 인도의 다국적 정보기술(IT) 서비스 및 컨설팅 기업입니다."
 RAJ_tech_mahindra: "마힌드라 테크"
 RAJ_tech_mahindra_desc: "정보기술 및 컨설팅 서비스를 제공하는 인도의 다국적 기업입니다. 테크 마힌드라 그룹은 본사가 푸네에 있으며 등록 사무소는 뭄바이에 있습니다. 테크 마힌드라는 90개국에 14만 8천 명 이상의 직원을 둔 60억 달러 규모의 기업입니다."
 RAJ_infosys_limited: "인포시스 리미티드"
 RAJ_infosys_limited_desc: "전자상거래 및 통신 기업을 위한 맞춤형 소프트웨어 개발에 종사하는 인도 기업입니다. 정보기술 및 소프트웨어 컨설팅 서비스도 제공합니다."
 RAJ_wipro: "위프로"
 RAJ_wipro_desc: "위프로는 정보기술, 컨설팅, 비즈니스 프로세스 서비스를 제공하는 인도의 다국적 기업입니다. 선도적인 빅테크 기업 중 하나입니다."
 RAJ_forces_of_india: "인도군"
 RAJ_forces_of_india_desc: "공화국의 방위와 국가의 자유 및 독립 수호를 위해 만들어진 인도의 군사 조직으로, 정치 권력의 가장 중요한 수단 중 하나입니다."
 RAJ_indian_militias: "인도 민병대"
 RAJ_indian_militias_desc: "민병대는 우리 육군의 불가분한 일부입니다. 군사 작전을 성공적으로 수행하려면 민병대도 발전시켜야 합니다."
 RAJ_assam_rifles: "아삼 라이플"
 RAJ_assam_rifles_desc: "인도 북동부의 국경 보안, 대반란 작전, 치안 유지를 책임지는 중앙 준군사 부대입니다. 주된 임무는 인도-미얀마 국경 경비입니다. AR은 내무부 산하 중앙무장경찰군 가운데 하나입니다. 인도 육군이 AR에 대한 작전 통제권을 유지합니다. 경찰 조직이므로 모집, 복지, 진급, 퇴직 정책은 CAPF 규정을 따릅니다. 장교의 약 80퍼센트는 육군에서 임명되며, 나머지 인원은 AR 자체 간부단에서 모집됩니다. AR은 내무부가 임명하는 아삼 라이플 총감이 지휘합니다."
 RAJ_special_frontier_force: "특별 국경군"
 RAJ_special_frontier_force_desc: "1962년 11월 14일에 창설된 인도의 특수 작전 부대입니다. 주로 인도에 거주하는 티베트 난민으로 구성되었으며, 현재는 규모와 작전 범위가 확대되었습니다. 창설 당시의 주된 목적은 또 한 번의 중인 전쟁이 발생할 경우 중국군 전선 후방에서 비밀 작전을 수행하는 것이었습니다."
 RAJ_indian_special_forces: "인도 특수부대"
 RAJ_indian_special_forces_desc: "적진 후방이나 국내에서 특수 작전을 수행하려면 훈련된 특수부대를 보유해야 합니다."
 RAJ_NAJA_idea_1: "군사화된 경찰"
 RAJ_outer_doctrine_idea: "이웃 국가와의 전쟁 교리"
 RAJ_national_security_guard: "국가 보안 경비대"
 RAJ_national_security_guard_desc: "흔히 \\"검은 고양이\\"로 알려진 이 조직은 내무부 산하 인도의 대테러 부대입니다. 블루스타 작전 이후인 1984년 10월 16일에 테러 활동에 맞서고 각 주를 내부 소요로부터 보호하기 위해 창설되었습니다. 1986년 국가 보안 경비대법에 따라 인도 의회의 공식 승인을 받았으며, 인도 7개 중앙무장경찰 조직 중 하나입니다."
 RAJ_special_protection_group: "특별 경호대"
 RAJ_special_protection_group_desc: "인도 총리와 경우에 따라 그 가족을 보호하는 것만을 유일한 책임으로 하는 인도 정부 기관입니다. 1988년 인도 의회의 법률에 따라 창설되었습니다. SPG는 인도 국내외에서 총리를, 그리고 공관에서 총리와 함께 생활하는 가장 가까운 가족을 상시 경호합니다. 다만 가족은 경호를 거부할 수 있습니다."
 RAJ_railway_protection_group: "철도 보호단"
 RAJ_railway_protection_group_desc: "철도 보호단은 정부에 필요한 물류를 보호하고 무장 폭동에 맞서기 위해 특별히 창설된 신설 군사 경찰의 한 부문입니다."
 RAJ_border_security_force: "국경 보안군"
 RAJ_border_security_force_desc: "파키스탄 및 방글라데시와의 국경 보호를 담당하는 인도의 조직입니다. 1965년 인도-파키스탄 전쟁 이후 \\"인도 국경의 안보와 관련 사안을 보장하기 위해\\" 창설된 인도 7개 중앙무장경찰 부대 중 하나입니다."
 RAJ_saastra_seema_bal: "사스트라 시마 발"
 RAJ_saastra_seema_bal_desc: "인도의 국경 경비 부대로, 네팔 및 부탄과의 국경을 따라 배치되어 있습니다. 내무부의 행정 통제를 받는 7개 중앙무장경찰 조직 중 하나입니다."
 RAJ_central_armed_police: "중앙 무장 경찰"
 RAJ_central_armed_police_desc: "인도 내무부 산하 중앙 경찰 조직의 통칭입니다. 엄밀히는 준군사 조직이며, 이전에는 중앙 준군사 조직으로 불렸습니다."
 RAJ_indotibet_border_police: "인도-티베트 국경경찰"
 RAJ_indotibet_border_police_desc: "인도-티베트 국경 경찰(ITBP)은 티베트 자치구와의 국경을 따라 배치된 인도의 국경 경비 부대입니다. 1962년 중인 전쟁 직후인 1962년에 창설된 7개 중앙무장경찰 부대 중 하나입니다."
 RAJ_expanding_cprf: "CRPF 확장"
 RAJ_expanding_cprf_desc: "인도 내무부 산하의 군사 조직으로, 무장 경찰 예비대의 기능을 수행하여 공공질서, 국내 안보, 국가의 일체성을 보장하고 테러에 대처하며 선거 기간 중 안전을 확보하고 민간 당국을 지원하고 자연재해의 피해를 수습합니다."
 RAJ_reformation_of_dislocation: "배치 개편"
 RAJ_reformation_of_dislocation_desc: "우리 공군은 전쟁 중 수많은 사고를 방지하기 위해 배치 전술을 바꿔야 합니다."
 RAJ_mirage2000: "미라주 2000 구매"
 RAJ_mirage2000_desc: "닷소 미라주 2000은 1970년대에 닷소가 개발한 4세대 프랑스 다목적 전투기입니다. 1984년부터 취역하여 20세기 후반과 21세기 초 프랑스 공군의 주력 전투기였습니다. 아시아, 유럽, 라틴 아메리카의 여러 국가에서 운용 중입니다."
 RAJ_rafale: "라팔 전투기"
 RAJ_rafale_desc: "닷소 라팔은 닷소 아비아시옹이 개발한 4세대 프랑스 다목적 전투기입니다. 1986년 7월에 첫 비행을 했으며 2004년 프랑스 해군, 2006년 프랑스 공군에 채택되었습니다."
 RAJ_su30: "Su-30 도입"
 RAJ_su30_desc: "제공권 장악을 위한 소련/러시아의 4+세대 복좌 다목적 전투기입니다. 단순 및 복합 기상 조건에서 주야간으로 공중 표적을 격멸하고, 능동 및 수동 간섭 상황에서 지상 배경의 표적을 공격하며, 영공 통제, 적 비행장의 원거리 봉쇄, 지상 및 해상 목표물에 대한 작전을 수행하도록 설계되었습니다. 또한 제공권 확보 시 집단 전투 작전 통제, 공중에서의 적 상륙 격멸, 공중 정찰, 단순 및 복합 기상 조건에서의 지상 표적 격멸에도 사용할 수 있습니다."
 RAJ_haltejas: "할 테자스 개발"
 RAJ_haltejas_desc: "인도의 4세대 경량 다목적 전투기입니다. 단발 엔진 항공기로 삼각 날개를 가진 \\"무미익\\" 방식으로 제작되었습니다. 시제기는 2001년에 첫 비행을 했으며 LCA 계획에 따라 개발되었습니다."
 RAJ_haljaguar: "할 재규어 개발"
 RAJ_haljaguar_desc: "이 전폭기는 영국(브리티시 에어크래프트 코퍼레이션)과 프랑스(브레게)가 공동 개발했습니다. 30년 동안 양국 공군에서 운용되었으며 수출도 되었습니다. SEPECAT 재규어의 개발은 유럽 항공기 제조사들의 첫 공동 계획 중 하나였습니다. 생산은 SEPECAT 컨소시엄이 맡았습니다(SEPECAT은 프랑스어 Société Européenne de Production de l'avion École de Combat et d'appui Tactique, 즉 전투 및 전술 지원 항공기 생산을 위한 유럽 항공 생산 협회의 약칭입니다)."
 RAJ_embnetra: "EMB-145I 네트라"
 RAJ_embnetra_desc: "엠브라에르 ERJ-145는 1990년대 초 브라질 항공기 제조사 엠브라에르가 개발한 지역 제트기 ERJ(엠브라에르 리저널 제트) 계열의 주력 모델입니다. 기본 모델 외에도 항속 거리를 늘린 ERJ-145ER(연장 항속), ERJ-145LR(장거리), ERJ-145XR(초장거리) 등 여러 개량형이 있습니다. 이 항공기는 1996년부터 항공사에서 운항되었습니다. 양산 기간 동안 700대 이상의 ERJ-145가 생산되었습니다. 생산은 브라질에서 계속되고 있으며 2004년부터는 중국에서도 이루어지고 있습니다."
 RAJ_contracts_with_us_air: "미국 공군과의 계약"
 RAJ_contracts_with_us_air_desc: "미국 공군은 가장 선진적이고 강력한 항공 전력입니다. 우리는 그들과 항공기 공동 개발에 관한 협정을 체결해야 합니다."
 RAJ_gulfstr4: "걸프스트림 4"
 RAJ_gulfstr4_desc: "걸프스트림 IV(걸프스트림 4)는 1980년대에 걸프스트림 에어로스페이스 코퍼레이션이 개발한 비즈니스 항공기 계열입니다. 기본 걸프스트림 IV 모델과 그 후속 세대인 걸프스트림 IV SP, G300, G400, 그리고 G350, G450으로 구성됩니다. 1985년부터 2018년까지 900대 이상의 항공기가 생산되었으며 대부분 계속 운항 중입니다."
 RAJ_indian_navy_ind: "인도 해군"
 RAJ_indian_navy_ind_desc: "현재 우리 해군은 서방 및 동방 경쟁국에 비해 내세울 만한 특징이 없습니다. 그러나 우리가 양지에서 제 자리를 차지하려면 함대를 돌봐야 합니다."
 RAJ_lessons_from_cactus: "선인장 작전의 교훈"
 RAJ_lessons_from_cactus_desc: "선인장 작전은 우리 육군과 해군 모두에게 상당히 성공적이었습니다. 우리는 그 작전에서 드러난 여러 세부 사항을 반영하여 함대의 질을 높이는 데 활용하고 있습니다."
 indian_event.24.t: "선인장 작전의 유산"
 indian_event.24.d: "선인장 작전은 1988년 인도군이 수행한 군사 작전입니다. 이 작전은 섬나라 몰디브에서 시도된 쿠데타를 무력화하기 위해 실시되었습니다. 1988년 11월 3일, 스리랑카 출신 용병의 지원을 받은 몰디브 무장 세력이 당시 몰디브 대통령 마우문 압둘 가윰을 상대로 쿠데타를 일으켰습니다. 쿠데타는 정부를 전복하고 반군에 우호적인 정권을 수립하는 것을 목표로 했습니다. 이 중대한 위협에 대응하여 인도는 몰디브 정부를 지원하기 위해 신속히 병력을 투입했습니다. 11월 4일, 인도 해군 군함의 호위를 받은 인도 공군 수송기가 인도 육군 파견대를 몰디브의 수도 말레로 수송했습니다."
 indian_event.24.a: "흥미롭군"
 RAJ_domestic_ship_prod: "국내 선박 생산"
 RAJ_domestic_ship_prod_desc: "우리 자체의 국내 조선 역량을 발전시켜야 합니다."
 RAJ_navy_aviation: "해군 항공대"
 RAJ_navy_aviation_desc: "함대를 효과적으로 보호하려면 해군 항공 전력을 보유해야 합니다."
 RAJ_goa_dock_exp: "조선소 확장"
 RAJ_goa_dock_exp_desc: "해군 생산이 늘어남에 따라 이를 뒷받침하기 위해 조선소 역량을 확장해야 합니다."
 RAJ_revit_soviet_ships: "기존 역량의 재활성화"
 RAJ_revit_soviet_ships_desc: "소련의 조선 방식은 우리가 자체적으로 도입할 수 있을 만큼 충분히 효과적이었습니다."
 RAJ_scquir_submarines: "인도 잠수함"
 RAJ_scquir_submarines_desc: "다른 나라의 선박을 성공적으로 격침하려면 우리 자체의 잠수함이 필요합니다."
 RAJ_agree_brit_onnavy: "영국과의 합의"
 RAJ_agree_brit_onnavy_desc: "과거에 선도적인 해양 강국이었던 우리는 어쩔 수 없이 영국과 협력 협정을 체결해야 합니다."
 RAJ_naval_trainings: "해군 훈련"
 RAJ_naval_trainings_desc: "함대를 충실히 준비하는 것이 바다에서의 우위를 보장할 것입니다."
 RAJ_russia_navy_agree: "러시아 해군 전문가"
 RAJ_russia_navy_agree_desc: "러시아와의 협력은 해상에서 우리의 입지를 강화해 줄 것입니다."
 RAJ_anew_indian_army: "새로운 인도 육군"
 RAJ_anew_indian_army_desc: "현대의 현실에 적응할 수 있도록 인도 육군의 새로운 개념을 만들어야 합니다."
 RAJ_towards_new_mil_doct: "새로운 군사 교리를 향하여"
 RAJ_towards_new_mil_doct_desc: "우리의 군사 교리가 이미 오래전에 낡았음을 인정할 때입니다. 새 천년에 무적이 되려면 새로운 군사 교리를 만들어야 합니다."
 RAJ_threat_of_the_dragon: "용의 위협"
 RAJ_threat_of_the_dragon_desc: "두 번째로 큰 위협은 이 지역에서 오랜 경쟁자인 중국입니다. 중국의 군사 교리를 분석하고 그들의 공격에 대비해야 합니다."
 RAJ_threat_of_the_crescent: "초승달의 위협"
 RAJ_threat_of_the_crescent_desc: "파키스탄은 지정학적 무대에서 우리의 주적입니다. 그들의 군대는 상당히 분열되어 있으며, 우리는 파키스탄에 대한 유능한 방어 체계를 구축해 볼 수 있습니다."
 RAJ_threat_of_terror_mil: "테러의 위협"
 RAJ_threat_of_terror_mil_desc: "21세기에 등장한 우리의 새로운 적은 테러리즘입니다. 이 적은 내부에 있으며, 우리는 내부에서 작동하는 요인에 맞서 방위 부문을 대비시켜야 합니다."
 RAJ_strategic_initiative: "전략적 주도권"
 RAJ_strategic_initiative_desc: "우리는 이 지역에서 최대한의 전략적 주도권을 쥐고 적에 대한 선제 타격을 준비해야 합니다. 그러한 시나리오에 대비하는 것이 필수적입니다."
 RAJ_military_infrastructure: "군사 인프라"
 RAJ_military_infrastructure_desc: "장기전에 대비하려면 보급 물류선을 준비하고 연방 도로를 건설해야 합니다."
 RAJ_new_military_methodology: "새로운 군사 방법론"
 RAJ_new_military_methodology_desc: "전쟁의 낡은 방법론을 버리고 우리 시대의 새로운 전쟁을 그 모든 특수성과 함께 개념화해야 합니다."
 RAJ_preparations_in_kashmir: "카슈미르 대비"
 RAJ_preparations_in_kashmir_desc: "카슈미르에서는 오랫동안 전투와 충돌이 이어져 왔습니다. 이 화약고는 조만간 폭발할 것입니다. 우리는 대비해야 합니다."
 RAJ_behead_northwest_separat: "북서부 분리주의 척결"
 RAJ_behead_northwest_separat_desc: "분리주의자들은 오랫동안 우리의 국가 구조를 파괴하려 해 왔습니다. 우리 정원에 숨어 있는 이 뱀의 머리를 쳐야 합니다!"
 RAJ_antiterror_raids: "대테러 소탕 작전"
 RAJ_antiterror_raids_desc: "테러리스트에 대한 소탕 작전은 내부 부대에게 일상이 되어야 합니다. 이슬람주의자들이 우리의 정세를 불안정하게 만들고 있으며, 우리 땅에서 그들을 뿌리 뽑아야 합니다."
 RAJ_counter_terror_trainings: "대테러 훈련"
 RAJ_counter_terror_trainings_desc: "위협이 있을 경우 적용될 대테러 조치에 대비해 국민, 비상사태부, 경찰력을 준비시켜야 합니다. 이는 공공 안전의 중요한 측면입니다."
 RAJ_bangladesh_line: "방글라데시 방어선"
 RAJ_bangladesh_line_desc: "방글라데시와 좋은 관계를 유지하고 있음에도, 불법 이민자와 온갖 부류의 테러리스트가 주기적으로 방글라데시와의 국경을 넘으려 합니다. 이에 대한 대응책을 마련해야 합니다."
 RAJ_southeatern_protection: "남동부 방어"
 RAJ_southeatern_protection_desc: "미얀마와의 국경은 매우 불안정합니다. 무장 민병대가 우리 국경을 넘어서는 안 됩니다."
 RAJ_smallwar_prep: "소규모 전쟁 대비"
 RAJ_smallwar_prep_desc: "지역 전쟁과 평화 유지 작전에 대비해야 합니다. 이는 소규모 전쟁이지만, 그럼에도 우리는 대비해야 합니다."
 RAJ_preparing_our_reserve: "예비대 준비"
 RAJ_preparing_our_reserve_desc: "장기 전투 작전에 대비해야 합니다. 이를 바탕으로 군 예비 전력을 보충하고 갱신해야 합니다."
 RAJ_bigwar_prep: "대규모 전쟁 대비"
 RAJ_bigwar_prep_desc: "파키스탄 및 중국과의 잠재적 전쟁은 핵 확전으로 이어질 수 있는 대규모 전쟁입니다. 그러한 시나리오에도 대비해야 합니다."
 RAJ_concept_coldstart: "콜드 스타트 개념화"
 RAJ_concept_coldstart_desc: "콜드 스타트는 인도군이 파키스탄과의 전쟁 가능성에 대비해 개발한 군사 교리입니다. 인도 군의 여러 군종이 통합 전투단의 일부로서 공세 작전을 수행하는 것을 골자로 합니다. 이 교리는 분쟁 시 인도의 재래식 전력이 제한적 공격을 수행하여 파키스탄의 핵 보복을 막을 수 있게 하려는 것입니다."
 RAJ_concept_hotstart: "핫 스타트 개념화"
 RAJ_concept_hotstart_desc: "핫 스타트는 인도군이 중국에 대한 신속한 공세 작전을 위해 개발한 군사 교리입니다. 여러 군종의 통합 전투단이 신속한 공세 행동을 수행하여 분쟁이 핵 교환으로 확대되기 전에 결정적인 성과를 거두는 것을 목표로 합니다."
 RAJ_religious_groups: "인도의 정체성"
 RAJ_religious_groups_desc: "The 5 major religions of [RAJ.GetFlag] §HIndia§! have varying levels of opinion on the government. Obviously, the §HHindus§! will hold a very high opinion of the government naturally. But some others, like the §HMuslims§!, will not. Therefore, by managing these religious groups, we can §Hmaintain peace and stability§! within the nation. If we fail to keep an adequate opinion with these religious groups, then they may seek to gain §Rindependence§! from [RAJ.GetFlag] §HIndia§!.\n\nHindu Opinion: §Y[?RAJ_hindus_opinion]§!\nSikh Opinion: §Y[?RAJ_sikh_opinion]§!\nBuddhist Opinion: §Y[?RAJ_buddhist_opinion]§!\nChristian Opinion: §Y[?RAJ_christians_opinion]§!\nMuslim Opinion: §Y[?RAJ_muslim_opinion]§!\n\n§HThresholds§!\n§YEvery faith:§! Stability and Political Power scale with the average of all five, from §R-10%§! at an average of 25 to §G+10%§! at 75.\n\n§GAll five above 74:§! Religious Harmony grants §G+5%§! Stability, §G+5%§! Political Power and §G+0.10§! Monthly Population.\n\n§RBelow 35:§! that faith's regions fall into unrest. Hindus below 35 also cause Hindu Discontent: §R-5%§! Stability, §R-10%§! Political Power, §R-3%§! War Support.\n\n§RBelow 20 (Sikhs below 15):§! a separatist crisis opens. Raise that faith within §Y180 days§! or the state is demilitarized and rebellion follows.\n\n§RBelow 5 when rebellion breaks out:§! the state secedes.\n\n§HSettling the question§!\nOnly with every faith above §Y80§! can the focus tree adopt §YPluralist Harmony§! as the national religious law, a far stronger settlement than pluralism imposed from above. With that law in place and Religious Harmony holding, §YEnshrine Pluralism§! writes it into the constitutional order: the bonus is locked in at its peak and communal opinion no longer drives unrest, crises or secession.\n"
 RAJ_appease_hindus: "힌두교 유화 정책"
 RAJ_appease_sikhs: "시크교 유화 정책"
 RAJ_appease_buddhists: "불교 유화 정책"
 RAJ_appease_christians: "기독교인 유화 정책"
 RAJ_appease_muslims: "무슬림 유화 정책"
 RAJ_religion.4.t: "Communal Violence Erupts"
 RAJ_religion.4.d: "Several Christian, Muslim and Hindu groups began fighting over an unknown dispute in one of our larger cities, and pockets of violence are starting to erupt across the country. For now, it doesn't matter why they are fighting - what matters is how we get them to stop."
 RAJ_religion.4.a: "기독교를 지원하라"
 RAJ_religion.4.b: "힌두교도를 지원하라"
 RAJ_religion.4.c: "무슬림을 지원하라"
 RAJ_themodels_ofothers: "타국의 모델"
 RAJ_themodels_ofothers_desc: "다른 나라 군대의 모델을 분석하고 그 편제의 가장 좋은 측면을 받아들여야 합니다."
 RAJ_milind_of_india: "인도 군수 산업"
 RAJ_milind_of_india_desc: "인도의 방위 산업 부문은 인도에서 전략적으로 중요한 분야입니다. 인도는 현역 병력이 144만 명을 넘는 세계 최대 규모의 군대 중 하나를 보유하고 있습니다."
 RAJ_new_standart_for_equip: "새로운 장비 표준"
 RAJ_new_standart_for_equip_desc: "전장에서 효과적으로 싸우려면 우리의 소형 화기를 최적화해야 합니다."
 RAJ_do_in_india: "두 인 인디아"
 RAJ_do_in_india_desc: "무기 제조에 대한 낡은 접근 방식에서 벗어나야 합니다."
 indian_event.25.t: "비핀 칸나와의 거래"
 indian_event.25.d: "인도 군수 산업에서 부패한 관리로 잘 알려진 비핀 칸나가 인도 시장에서 자신의 입지를 확보하기 위해 우리가 거절할 수 없다고 하는 거래를 제안했습니다. 어떻게 하시겠습니까?"
 indian_event.25.a: "잘 가시오."
 RAJ_handl_cor_indefcor: "부패 해결!"
 RAJ_handl_cor_indefcor_desc: "군내 부패는 우리나라의 안보와 방위 능력을 망칩니다. 우리 군의 부패를 막아야 합니다."
 RAJ_clearing_out_the_ranks: "군 인원 정리"
 RAJ_clearing_out_the_ranks_desc: "우리 군에는 불필요한 인원이 너무 많습니다. 군을 최적화하려면 이들을 감축해야 합니다."
 RAJ_deal_vipin_khanna: "비핀 칸나의 제안"
 RAJ_deal_vipin_khanna_desc: "비핀 쿠마르 칸나(1930년 12월 14일~2019년 11월 7일)는 인도의 사업가이자 군 장교였습니다. 칸나는 다양한 사업에 관심을 두었습니다. 그는 원자재 무역 및 마케팅 회사인 다이내믹 세일즈 서비스 인터내셔널을 설립했으며, 이 회사는 공학 지원, 선박 중개, 일용 소비재 등 다른 산업으로도 확장되었습니다."
 RAJ_refr_rech_contr: "계약 갱신"
 RAJ_refr_rech_contr_desc: "계약제 군대는 전문 군대를 가질 수 있게 해 줍니다. 이 부분을 최적화해야 합니다."
 RAJ_clearing_ministr: "국방부 정리"
 RAJ_clearing_ministr_desc: "우리 군 개혁의 마지막 단계는 군 관리자들에 대한 통제를 강화하는 것입니다."
 RAJ_DRDO: "DRDO"
 RAJ_DRDO_desc: "국방연구개발기구(DRDO)는 군사 목적의 기술 개발을 담당하는 인도 정부 기관으로 인도 국방부 산하에 있습니다. DRDO의 목표는 과학 기술을 세계적 수준으로 끌어올려 인도의 번영을 증진하고, 핵심 군사 기술의 자립 기반을 마련하며, 국군의 기술 장비에서 결정적 우위를 제공하는 것입니다."
 RAJ_drdo_idea: "DRDO"
 RAJ_munitions_india_limited: "뮤니션스 인디아 리미티드"
 RAJ_munitions_india_limited_desc: "인도 푸네에 본사를 둔 인도 국영 방위 기업으로, 병기 공장 이사회를 7개의 서로 다른 공기업으로 구조조정 및 법인화하는 과정에서 2021년에 설립되었습니다. 무니션스 인디아는 주로 인도군, 외국군, 국내 민간용 탄약, 폭약, 미사일, 폭탄을 제조합니다."
 RAJ_pinaka_launcher: "피나카 발사기"
 RAJ_pinaka_launcher_desc: "피나카는 경장갑 및 장갑 차량, 적의 인력과 포병을 공격하고 통신 거점, 지휘소, 군수 산업 기반시설을 파괴하도록 설계된 인도의 214mm 전천후 다연장로켓발사시스템(MLRS)입니다. 이 발사기는 대인 지뢰와 대전차 지뢰를 원격으로 부설하는 데에도 사용할 수 있습니다. 이 MLRS의 개발은 1983년에 시작되어 1999년에 인도 육군에 채택되었습니다. 피나카 MLRS는 1999년에 벌어진 인도와 파키스탄 간 국경 분쟁인 카르길 전쟁에서 실전에 사용된 것으로 알려져 있습니다. 피나카 MLRS를 처음 장비한 연대는 2000년에 창설되었습니다."
 RAJ_HSLDB: "HSLDB"
 RAJ_HSLDB_desc: "인도는 우주를 성공적으로 방어하고 탐사하기 위해 로켓 산업을 강화해야 합니다."
 RAJ_shivalik: "시왈릭 수류탄"
 RAJ_shivalik_desc: "시왈릭 수류탄은 인도 고유의 수류탄입니다. 이 수류탄은 찬디가르 인근 시왈릭 산맥 기슭에 위치한 국방연구개발기구(DRDO) 산하 연구소인 종말 탄도 연구소(TBRL)가 개발했으며, 여기에서 이름이 유래했습니다."
 RAJ_armor_vehic_nigam: "장갑차 니감"
 RAJ_armor_vehic_nigam_desc: "장갑차량 니감 리미티드(AVANI)는 인도 첸나이 아바디에 본사를 둔 인도 국영 방위 기업으로, 병기 공장 이사회를 7개의 공기업으로 구조조정 및 법인화하는 과정에서 2021년에 설립되었습니다. AVANI는 주로 인도군용 장갑 전투 차량, 주력 전차와 그 엔진을 제조합니다."
 RAJ_arjun: "아르준 주력 전차"
 RAJ_arjun_desc: "아르준은 인도 최대의 방위 계약 기관인 국방연구개발기구(DRDO)가 인도 육군을 위해 개발한 주력 전차입니다. 이 전차의 이름은 인도 서사시 마하바라타의 주요 등장인물 중 한 명인 아르준에서 따왔습니다."
 RAJ_t90_rus: "러시아 T-90"
 RAJ_t90_rus_desc: "러시아의 T-90 주력 전차는 1992년에 취역했습니다. 1999년에는 '블라디미르'라는 비공식 이름이 붙었습니다."
 RAJ_british_challenger: "영국 챌린저"
 RAJ_british_challenger_desc: "영국 기업 비커스 디펜스 시스템즈(현 BAE 시스템즈 소속)가 생산한 주력 전차입니다. 챌린저라는 이름을 가진 세 번째 전차입니다. 챌린저 2는 챌린저를 기반으로 개발되었지만, 새 전차는 새로운 장비와 부품으로 이전 모델과 차이가 있으며 두 모델의 공통 부품은 5%뿐입니다. 챌린저 2는 현재 영국 육군에서 이전 모델을 대체했습니다."
 RAJ_bmp_sarath: "BMP 사라스"
 RAJ_bmp_sarath_desc: "BMP-2 사라스는 인도 병기 공장 이사회가 면허 생산해 온 BMP-2 보병 전투차(ICV)의 인도형 변형입니다. BMP-2 사라스는 1990년대 초 인도 육군에 처음 도입되었습니다."
 RAJ_mod_tru_stallion: "아쇼크 레일랜드 스탤리언"
 RAJ_mod_tru_stallion_desc: "아쇼크 레일랜드사가 1987년부터 생산해 온 인도의 중형 및 대형 험지 트럭 시리즈입니다. 이 트럭은 포드 카고 차체를 기반으로 설계되었습니다. 상당수 차량은 인도 육군용으로 생산됩니다."
 RAJ_adv_weapons_eqip_lim: "어드밴스드 웨폰스 앤드 이큅먼트 인디아"
 RAJ_adv_weapons_eqip_lim_desc: "경제적 기회가 많을수록 군대의 필요성도 커집니다. 낡은 주문은 점차 걸러지고 새로운 주문이 들어오고 있으며, 특히 우리 육군에서 그렇습니다."
 RAJ_field_gun_fact: "야포 공장"
 RAJ_field_gun_fact_desc: "칸푸르 야포 공장(FGK)은 인도 칸푸르에 위치한 공장입니다. 1979년에 문을 연 이 공장은 인도 병기 공장의 무기·차량·장비(WV&E) 부문 중 가장 최근에 설립되었습니다. 이 시설은 다양한 종류의 야포를 제작할 수 있습니다."
 RAJ_gun_jabalpur: "자발푸르 포가 공장"
 RAJ_gun_jabalpur_desc: "인도 마디아프라데시주 자발푸르 지구에 있는 방위 공장 및 지역입니다. 사트푸라 산맥의 그림 같은 환경에 위치한 이 작은 정부 타운십은 같은 이름의 방위 공장을 중심으로 조성되었습니다. 자발푸르 시 기차역에서 약 3km 떨어져 있으며 도시와도 긴밀히 연결되어 있습니다. 다른 방위 시설들로 둘러싸여 있습니다. 부지 내에는 중앙 학교, 병원, 교회, 사원, 클럽이 있습니다."
 RAJ_gun_shell_factory: "코시포르 포·포탄 공장"
 RAJ_gun_shell_factory_desc: "캘커타 코시포르의 포·포탄 공장은 병기 공장 이사회 산하 인도 병기 공장의 모체로, 흔히 방위의 제4군이라 불립니다. 이 공장은 1801년 코시포르의 신성한 땅을 매입하면서 첫걸음을 내디뎠으며, 1802년 3월 18일 생산 활동을 시작했습니다."
 RAJ_ordnance_factory_tiruchapari: "티루치라팔리 병기 공장"
 RAJ_ordnance_factory_tiruchapari_desc: "타밀나두주 티루치라팔리에 본사를 둔 어드밴스드 웨폰스 앤드 이큅먼트 인디아 리미티드가 운영하는 소형 화기 제조 공장으로, 이전에는 인도 정부 국방부 병기 공장 이사회의 일부였습니다. 이 회사는 총괄 관리자라 불리는 IOFS 장교 한 명이 단독으로 이끌며, 그는 회사 전반의 경영을 책임지는 최고경영자입니다. OFT는 인도 최대의 소형 화기 제조 기업이며 가장 다양한 제품군을 보유하고 있습니다."
 RAJ_ordnance_factory_korwa: "코르와 병기 공장 사업"
 RAJ_ordnance_factory_korwa_desc: "코르와 병기 공장 사업은 병기 공장 이사회의 신속 추진 및 현대화 사업입니다. 이 사업은 2007년 12월 우타르프라데시주 아메티에 설립되었습니다. HAL 코르와는 인접한 방위 부대입니다. 이 공장은 최첨단 기술을 갖춘 병기 공장 조직의 최신 자랑거리입니다."
 RAJ_ordnance_kanpur: "칸푸르 병기 공장"
 RAJ_ordnance_kanpur_desc: "칸푸르 병기 공장은 콜카타의 병기 공장 이사회(OFB) 산하 41개 병기 공장 중 하나입니다. 제2차 세계 대전 중 동부 전선에서 다가오는 추축국의 위협에 대비한 이전 사업으로 1942년에 구상되었습니다. 공장은 칸푸르 중앙역에서 8km 떨어진 칼피 로드에 위치해 있습니다."
 RAJ_small_factory_kanpur: "OFK 확장"
 RAJ_small_factory_kanpur_desc: "현재 병기국(조정 및 서비스)으로 알려진, 인도 병기 공장으로 구성된 병기 공장 이사회(OFB)는 인도 정부 국방부(MoD) 방위생산국(DDP) 산하 조직이었습니다. 41개의 인도 병기 공장은 7개의 방위 공기업(DPSU)으로 전환되었습니다."
 RAJ_ordnance_factory_ishapore: "이샤포르 소총 공장"
 RAJ_ordnance_factory_ishapore_desc: "서벵골주 이차푸르에 본사를 둔 인도 국영 무기 제조 기업입니다."
 RAJ_troop_comfrt: "트루프 컴포츠 리미티드"
 RAJ_troop_comfrt_desc: "군의 질을 높이려면 군내의 해이함을 억제해야 합니다."
 RAJ_upd_mil_unif: "디지털 군복 개정법"
 RAJ_upd_mil_unif_desc: "우리 군은 임무 수행 효율을 유지하기 위해 원활한 통신이 필요합니다."
 RAJ_upd_cloth: "특수부대 장구 개선"
 RAJ_upd_cloth_desc: "특수부대의 장비를 개선할 때입니다."
 RAJ_gliders_india_lim: "글라이더스 인디아 리미티드"
 RAJ_gliders_india_lim_desc: "글라이더스 인디아 리미티드(GIL)는 칸푸르의 병기 낙하산 공장에 본사를 둔 인도 국영 방위 기업입니다."
 RAJ_miltech_innov: "군사 기술 혁신"
 RAJ_miltech_innov_desc: "외부 침입에 대비해 군 네트워크 방어를 강화해야 합니다."
 RAJ_india_optel: "인디아 옵텔 리미티드"
 RAJ_india_optel_desc: "인디아 옵텔 리미티드는 데라둔에 본사를 둔 인도 국영 방위 기업입니다."
 RAJ_electr_optic: "야간 투시경 연구 확대"
 RAJ_electr_optic_desc: "인도 육군의 기존 야간 투시경(NVG)은 구식입니다. 이를 개선해야 합니다."
 RAJ_yantra_india: "얀트라 인디아 리미티드"
 RAJ_yantra_india_desc: "얀트라 인디아 리미티드는 나그푸르에 본사를 둔 인도의 대형 국영 방위 생산 공기업입니다."
 RAJ_mil_electr: "군사 전자 연구"
 RAJ_mil_electr_desc: "해외 경쟁국들은 오래전부터 전자 분야에서 발전해 왔습니다. 우리는 그들을 따라잡아야 합니다."
 RAJ_command_innov: "지휘 혁신"
 RAJ_command_innov_desc: "지휘 통신 체계를 개선해야 합니다."
 RAJ_bharat_desc: "인도 육군에 전자 장비를 공급하는 최대 공급업체 중 하나인 인도 국영 기업입니다. 이 회사는 9개의 공장과 여러 지역 사무소를 두고 있습니다."
 RAJ_indian_radar: "인도 레이더"
 RAJ_indian_radar_desc: "인도 도플러 레이더라고도 불리는 저고도 탐지 레이더는 국방연구개발기구 산하 전자·레이더 개발 기관이 육군과 공군을 위해 개발한 2D 레이더 시리즈입니다. 이후 통상 LRDE의 제조 협력사인 바라트 일렉트로닉스가 생산했습니다. INDRA-I은 저고도 표적 탐지를 위한 이동식 감시 레이더이며, INDRA-II는 지상 유도 표적 요격을 위해 설계되었습니다."
 RAJ_akash_missiles: "아카시 미사일"
 RAJ_akash_missiles_desc: "아카시는 인도에서 개발 중인 단거리 대공 미사일 체계로, 시설과 부대 집단의 대공 방어를 제공하도록 설계되었습니다."
 RAJ_indian_army_air_defense_force_idea: "인도 대공 방어"
 RAJ_igmdp: "IGMDP"
 RAJ_igmdp_desc: "장거리 미사일의 연구개발을 위한 인도 국방부의 프로그램입니다. 이 프로그램은 인도 정부의 다른 정책 기관과 협력하여 국방연구개발기구와 병기 공장 이사회가 관리했습니다. 이 사업은 압둘 칼람의 지휘 아래 1982~83년에 시작되었으며, 그는 이들 전략 미사일의 성공적인 개발 후 2008년 완료를 감독했습니다."
 RAJ_finsas: "F-INSAS"
 RAJ_finsas_desc: "보병에게 최첨단 장비를 지급하기 위한 인도의 프로그램으로, F-INSAS는 체계로서의 미래형 보병(Futuristic Infantry Soldier As a System)을 뜻합니다. 그러나 인도 육군은 F-INSAS 프로그램을 폐기하고 두 개의 별도 사업을 추진하기로 결정했습니다. 새 프로그램은 두 부분으로 구성됩니다. 첫째는 미래 보병에게 가용한 최고의 돌격소총, 카빈, 헬멧과 방탄복 같은 개인 장비를 지급하는 것입니다. 둘째는 전장 관리 체계입니다."
 RAJ_trishul: "트리슐"
 RAJ_trishul_desc: "인도 국방연구개발기구가 통합 유도 미사일 개발 프로그램에 따라 개발한 저고도 단거리 고속 지대공 미사일입니다. 또한 해군 함정에서 저공 비행 미사일, 공격 헬리콥터, 항공기에 맞서는 대잠수함전 미사일로도 사용할 수 있습니다."
 RAJ_3dcar: "3D-CAR"
 RAJ_3dcar_desc: "DRDO가 아카시 SAM용으로 개발한 인도의 3축 레이더입니다. 최대 150개의 표적을 추적할 수 있습니다."
 RAJ_agni_tech: "아그니 기술"
 RAJ_agni_tech_desc: "아그니-III(IAST: Agni, 직역하면 '불')는 아그니-II의 후속으로 2011년에 취역한 인도의 중거리 탄도 미사일입니다. 사거리는 3,500~5,000km(2,200~3,100마일)이며 중국을 포함한 인접국 내륙 깊숙한 곳의 표적에 도달할 수 있습니다."
 RAJ_prithvi_missile: "프리트비 연구"
 RAJ_prithvi_missile_desc: "인도군의 지대지 탄도 미사일 계열입니다."
 RAJ_prithvi_1: "프리트비 미사일 계열"
 RAJ_prithvi_1_desc: "세 군 전체를 아우르는 단거리 탄도 미사일 프리트비 라인 전체를 개발합니다. 육군형은 1000kg 탄두를 싣고 150km를 비행하며, 공군형은 250km에 도달하고, 해군형은 2단 고체 연료 설계로 350km까지 도달합니다."
 RAJ_prithvi_4: "프리트비-IV"
 RAJ_prithvi_4_desc: "개발 중인 첨단 대륙간 탄도 미사일로, 인도 전략 억제 능력의 차세대를 대표합니다. 이를 배치하면 세계적 핵 강국으로서 인도의 입지가 굳어질 것입니다."
 RAJ_uniting_mil_ind_prod: "군수 생산 통합"
 RAJ_uniting_mil_ind_prod_desc: "군을 최적화하기 위해 모든 군종을 통합할 때입니다."
 RAJ_uniting_mil_ind_prod_phase: "군수 생산 통합 2단계"
 RAJ_uniting_mil_ind_prod_phase_desc: "군사 장비가 많을수록 우리의 목표에 이를 가능성도 커집니다."
 RAJ_indian_arms_exports: "인도 무기 수출"
 RAJ_indian_arms_exports_desc: "인도는 다양한 무기의 주요 생산국입니다. 다른 나라에 무기를 판매함으로써 세계 선두 자리 중 하나를 차지할 수 있습니다. 이는 또한 인도가 다른 군사 강국과 대등함을 보여줄 것입니다."
 RAJ_preserve_caste_system: "카스트 제도 보존"
 RAJ_preserve_caste_system_desc: "카스트 제도는 인도 사회의 핵심입니다. 이를 파괴하는 것은 우리의 종교와 전통에 대한 모욕입니다!"
 RAJ_dharmic_alliance: "다르마 동맹"
 RAJ_dharmic_alliance_desc: "모든 다르마 종교는 하나의 뿌리에서 나왔습니다. 그들 모두가 존재할 기회를 준 것은 바라트의 땅입니다. 우리는 이를 포용할 것입니다."
 RAJ_hindu_nationalism: "힌두 민족주의"
 RAJ_hindu_nationalism_desc: "힌두트바는 우리 사회가 살아갈 수 있는 유일한 방식입니다. 인도인이라는 것은 모든 국민이 자랑스러워해야 할 표지입니다."
 RAJ_indian_traditionalism_desc: "전통은 사회를 하나로 묶어 주는 가장 필요한 요소입니다. 부족적 기원과 관계없이 우리는 모두 같은 전통을 공유하며 이는 우리를 하나로 결속시킵니다."
 RAJ_stomp_out_islam: "이슬람 박멸"
 RAJ_stomp_out_islam_desc: "이슬람은 오랫동안 우리나라의 골칫거리였습니다. 그 영향력을 최소한으로 줄이기 위해 노력할 것입니다!"
 RAJ_international_nationalism: "국제 민족주의"
 RAJ_international_nationalism_desc: "아칸드 바라트의 눈으로 보면 모든 민족은 하나입니다. 우리의 공통된 민족적, 종교적 뿌리야말로 우리가 오로지 집중해야 할 대상입니다."
 RAJ_deport_muslims: "불충한 이슬람교도 추방"
 RAJ_deport_muslims_desc: "수많은 불충한 이슬람 설교자들이 이슬람교도가 다수인 우리의 주들을 계속 급진화하고 있습니다. 이는 용납할 수 없으며 반드시 막아야 합니다."
 RAJ_hindu_rashatra: "힌두트바 라슈트라"
 RAJ_hindu_rashatra_desc: "군국주의는 어떤 수단으로든 우리 국민의 정신에 심어져야 합니다. 무장하고 단결하는 것이 우리의 힘입니다!"
 RAJ_indias_elections: "인도 선거"
 RAJ_indias_elections_desc: "인도는 모든 정당이 나라의 집권당이 될 기회를 가지는 민주주의의 가장 훌륭한 사례입니다. 우리나라가 밝은, 혹은 그리 밝지 않은 미래에 이르기 위해 어떤 길을 택할지 결정해야 합니다."
 RAJ_manmohan_singh: "만모한 싱"
 RAJ_manmohan_singh_desc: "만모한 싱은 인도 총리 지명자이자 국민회의당 소속입니다. 싱은 2004년 5월 19일 A.P.J. 압둘 칼람 대통령이 공식적으로 그에게 정부 구성을 요청하면서 총리 지명을 확보했습니다."
 RAJ_manmohan_technocracy: "만모한의 기술 관료제"
 RAJ_manmohan_technocracy_desc: "기술 관료제는 기술적 지식을 가진 이들이 사회를 통치하는 정부 형태입니다. 기술 관료제에서 지도자는 기술적 또는 과학적 지식에 따라 선발됩니다. 기술 관료제에서는 해결책이나 타협안을 민주적으로 투표해 정하는 대신, 과학적 방법을 적용하여 사회적, 정치적 문제를 해결합니다."
 RAJ_keeping_reput: "명성 유지"
 RAJ_keeping_reput_desc: "종교 집단과 우호적인 관계를 맺고 더 자유로운 담론을 사회에 점진적으로 통합함으로써 그들 앞에서 체면을 지켜야 합니다."
 indian_event.26.t: "브라질리아 선언"
 indian_event.26.d: "브라질리아 선언은 인도, 브라질, 남아프리카공화국의 외무장관들이 서명했습니다. 이들은 국제연합, 특히 안전보장이사회의 개혁이 시급하다는 데 합의했습니다. 선언은 국제연합 안전보장이사회가 현재의 세계 상황을 반영해야 한다는 견해를 밝혔습니다. 또한 국제 테러리즘, 초국가 범죄, 불법 무기 거래 문제도 다루며, 국제 평화에 대한 이러한 위협은 국가 주권과 국제법을 존중하면서 효과적으로 대처해야 한다고 명시했습니다."
 indian_event.26.a: "좋아"
 RAJ_ibsa_dialogue_forum: "IBSA 대화 포럼"
 RAJ_ibsa_dialogue_forum_desc: "IBSA 대화 포럼은 여러 국가 간의 국제 협력을 증진하기 위한 국제 3자 협의체입니다."
 RAJ_fighting_corruption: "부패 척결"
 RAJ_fighting_corruption_desc: "부패 문제가 우리나라를 썩게 하고 있습니다! 즉시 맞서 싸워 국가의 공정성을 보장해야 합니다."
 RAJ_isr_ind_cong_meet: "이스라엘-인도 외교 회담"
 RAJ_isr_ind_cong_meet_desc: "이스라엘과의 고위급 대화는 군사 및 정보 협력을 심화시킵니다."
 RAJ_national_guarantee_employment_act: "국가 고용 보장법"
 RAJ_national_guarantee_employment_act_desc: "2005년 마하트마 간디 전국 농촌 고용 보장법(MGNREGA)은 이전에는 전국 농촌 고용 보장법(NREGA)으로 알려졌으며, 노동권을 보장하는 것을 목표로 하는 인도의 사회 복지 조치입니다."
 RAJ_delhi_beijing_speakers: "델리-베이징 회담"
 RAJ_delhi_beijing_speakers_desc: "많은 이들이 중국과의 관계를 돌이킬 수 없다고 보겠지만, 우리는 그래도 안정화를 위해 노력해야 합니다."
 RAJ_isr_ind_cong_pack_inv: "이스라엘-인도 투자 패키지"
 RAJ_isr_ind_cong_pack_inv_desc: "인도와 이스라엘 간의 상호 투자는 양국 모두에 이익이 될 것입니다. 이 사업을 시작하지 않을 이유가 있겠습니까?"
 RAJ_russia_weapon_package: "러시아 무기 패키지"
 RAJ_russia_weapon_package_desc: "러시아는 오랜 파트너입니다. 우리의 방어 능력을 크게 향상시켜 줄 새로운 무기 패키지를 러시아로부터 획득해야 합니다."
 RAJ_iran_india_pak_gas_pip: "인도-파키스탄-이란 가스 파이프라인"
 RAJ_iran_india_pak_gas_pip_desc: "이란-파키스탄-인도 가스 파이프라인 사업은 이란산 가스를 파키스탄을 거쳐 인도로 수송하기 위해 1990년대 중반 이란이 처음 추진했습니다. 그러나 이 구상 자체는 1950년대 후반 파키스탄 군사공과대학이 발표한 과학 논문에서 처음 제안되었습니다. 이 구상은 파키스탄이 가스 부족에 직면한 1989년에 부각되었습니다. 1995년 테헤란과 이슬라마바드 사이에 체결된 예비 협정에는 1999년 인도가 합류했습니다."
 indian_event.27.t: "인도 가스 파이프라인 제안"
 indian_event.27.d: "인도가 인도, 파키스탄, 이란이 참여하는 새로운 가스 파이프라인 사업을 제안했습니다. 참여에 동의해야 합니까?"
 indian_event.27.o1: "물론이다, 유용하다!"
 indian_event.27.o2: "이 외교관들을 돌려보내라."
 RAJ_cont_the_course: "노선 지속"
 RAJ_cont_the_course_desc: "민주화와 반부패 절차라는 우리의 노선을 계속 이어가야 합니다."
 RAJ_golden_quadlit: "황금 사각형"
 RAJ_golden_quadlit_desc: "황금 사각형은 인도의 여러 주요 산업, 농업, 문화 중심지를 연결하는 국도망입니다."
 RAJ_final_inf_prog: "인프라 계획 마무리"
 RAJ_final_inf_prog_desc: "이제 인프라 건설 계획을 완수할 수 있게 될 것입니다."
 RAJ_value_added_tax: "부가가치세"
 RAJ_value_added_tax_desc: "우리의 세제를 현대에 더 알맞도록 개혁해야 합니다."
 RAJ_national_rural_health_mis: "국가 농촌 보건 사업"
 RAJ_national_rural_health_mis_desc: "국가 농촌 보건 사업은 농촌 지역에서 접근 가능하고 저렴하며 양질의 의료를 제공하기 위해 시행될 정부 지원 건강 보험 제도입니다. 이 제도의 주요 대상은 농촌 지역의 저소득 가구입니다."
 RAJ_27_perc_project_medic: "27퍼센트 사업"
 RAJ_27_perc_project_medic_desc: "정부는 전인도의과학연구소(AIIMS), 인도공과대학, 인도경영대학원 및 기타 중앙 고등 교육 기관의 정원 27%를 기타 후진 계급(Other Backward Classes)에 할당하는 제안을 시행해야 합니다."
 RAJ_crusing_indian_antires_protests: "할당제 반대 시위 진압"
 RAJ_crusing_indian_antires_protests_desc: "인도 국민회의가 이끄는 다당 연합인 통일진보동맹이 주도하는 인도 연방 정부가 중앙 및 민간 고등 교육 기관에서 기타 후진 계급에 대한 할당제를 시행하기로 한 결정에 반대하는 일련의 시위가 인도에서 벌어졌습니다."
 RAJ_rights_to_education_act: "교육권법"
 RAJ_rights_to_education_act_desc: "아동의 무상 의무 교육권법, 즉 교육권법은 인도 헌법 제21A조에 따라 인도의 6세에서 14세 아동에 대한 무상 의무 교육의 중요성에 관한 방식을 규정한 인도 의회의 법률입니다."
 RAJ_unlaw_prev_act: "불법 활동 방지법"
 RAJ_unlaw_prev_act_desc: "불법 활동 방지법은 인도 내 불법 활동 단체를 방지하는 것을 목적으로 하는 인도의 법률입니다. 주된 목적은 인도의 통합과 주권에 반하는 활동에 대처할 권한을 마련하는 것이었습니다."
 RAJ_national_investigation_agency: "국가수사청 창설"
 RAJ_national_investigation_agency_desc: "국가수사청은 인도의 대테러 전문 법 집행 기관입니다. 이 기관은 내무부의 서면 선언에 따라 각 주의 특별 허가 없이도 주 전역에 걸친 테러 관련 범죄 수사를 처리할 권한을 가집니다."
 RAJ_enlarge_inv_agency: "국가수사청 확대"
 RAJ_enlarge_inv_agency_desc: "국가수사청이 더 효율적으로 활동하고 더 빨리 성과를 낼 수 있도록 더 많은 자유와 여지를 주어야 합니다."
 RAJ_reconstruct_kashmir: "카슈미르 재건"
 RAJ_reconstruct_kashmir_desc: "카슈미르의 상태는 좋게 말해도 최선이 아닙니다. 현지 주민의 충성을 얻고 경제적으로 안정시키기 위해 카슈미르를 재건해야 합니다."
 RAJ_aadhar_project: "아다르 사업"
 RAJ_aadhar_project_desc: "아다르는 생체 및 인구통계 정보를 바탕으로 인도 국민과 등록 신청일 직전 12개월 중 182일 넘게 체류한 외국인 거주자가 자발적으로 발급받을 수 있는 12자리 고유 식별 번호입니다."
 RAJ_rights_to_child_free_comp_act: "RCFCE법"
 RAJ_rights_to_child_free_comp_act_desc: "제3조는 6세에서 14세의 모든 아동에게 초등 교육 이수 시까지 인근 학교에서 무상 의무 교육을 받을 권리를 부여합니다. 인근 학교라는 개념은 코타리 위원회 보고서에 상술된 국가 교육 체계로 거슬러 올라갈 수 있으며, 인근 학교는 카스트, 계층, 성별을 가리지 않고 모든 아동이 가장 포용적인 방식으로 함께 배우는 공통의 공간이 되도록 의도된 것입니다."
 RAJ_rights_to_land_acquiq: "RFCTLARR법"
 RAJ_rights_to_land_acquiq_desc: "토지 취득, 재활 및 재정착에서의 공정한 보상과 투명성에 관한 권리법은 토지 취득을 규제하고 인도 내 피해자에 대한 보상, 재활 및 재정착을 부여하는 절차와 규칙을 정한 인도 의회의 법률입니다."
 RAJ_rights_to_info: "정보공개법"
 RAJ_rights_to_info_desc: "정보공개법은 모든 공공 기관의 업무에서 투명성과 책임성을 증진하기 위해 시민이 공공 기관이 관리하는 정보에 접근할 수 있도록 정보 권리의 실질적 체계를 수립하고, 중앙정보위원회와 주정보위원회를 구성하며, 이와 관련되거나 부수되는 사안을 규정하기 위해 제안되었습니다."
 RAJ_reform_constitution: "헌법 개혁"
 RAJ_reform_constitution_desc: "낡은 헌법의 개혁은 인도 정치 체제를 쇄신하는 데 필요한 조치입니다."
 RAJ_hindutva_front: "힌두트바 전선"
 RAJ_hindutva_front_desc: "힌두 민족주의 이념에 뿌리를 둔 힌두트바 운동은 다채로운 인도의 모자이크 속에서 힌두 문화와 가치의 우위를 주장하려 합니다. 긴장이 고조됨에 따라 이들의 외침은 대중 사이에서 힘을 얻고 있습니다."
 RAJ_akhil_bharat_mahsabasa: "전인도 힌두 마하사바"
 RAJ_akhil_bharat_mahsabasa_desc: "20세기 초에 창립된 힌두 마하사바는 변화하는 아대륙에서 힌두교도의 권리를 보호하는 것을 목표로 했습니다. 이들은 군과의 연계와 힌두 라슈트라, 즉 힌두 국가에 대한 비전을 바탕으로 강력하고 통일된 인도를 구상합니다."
 RAJ_maharashtra_navnirman_sena: "마하라슈트라 나브니르만 세나"
 RAJ_maharashtra_navnirman_sena_desc: "21세기에 시브 세나에서 갈라져 나온 마하라슈트라 나브니르만 세나(MNS)는 마라타인의 자긍심과 정체성의 횃불을 들고 있습니다. 경쟁 지역 세력으로서 모체 조직의 지배력에 도전하며 마하라슈트라의 이익을 주장할 독자적인 길을 모색합니다."
 RAJ_shiv_sena: "시브 세나"
 RAJ_shiv_sena_desc: "1966년에 설립된 시브 세나는 오랫동안 뭄바이에서 마하라슈트라인의 권리를 옹호해 왔습니다. 영향력이 더 폭넓은 힌두 민족주의 주제로 확장되었지만, 그 유산과 지배력은 이제 MNS 같은 신흥 지역 경쟁자들에게 위협받고 있습니다."
 RAJ_uniting_the_nationalist_front: "민족주의 전선 통합"
 RAJ_uniting_the_nationalist_front_desc: "민족주의 전선의 통합은 힌두 마하사바만이 할 수 있습니다. 우리가 그들의 경쟁 관계 사이에서 결집점이기 때문입니다."
 RAJ_breaking_the_neck_of_shivsena: "시브 세나의 목을 꺾다"
 RAJ_breaking_the_neck_of_shivsena_desc: "시브 세나는 우리의 권위에 의문을 제기하는 어리석은 사칭자들입니다! 그들의 인기를 짓밟아야 합니다!"
 RAJ_stomping_the_pretenders: "사칭자 짓밟기"
 RAJ_stomping_the_pretenders_desc: "마하라슈트라 나브니르만 세나는 우리의 권위에 의문을 제기하는 어리석은 사칭자들입니다! 그들의 인기를 짓밟아야 합니다!"
 RAJ_new_national_india: "새로운 민족 인도"
 RAJ_new_national_india_desc: "인도는 이제 근본으로 돌아왔습니다. 바라트를 찬양하라!"
 RAJ_indian_traditionalism: "인도 전통주의"
 RAJ_religious_conversions: "종교 개종"
 RAJ_religious_conversions_desc: "이슬람교도와 기독교도를 다르마 종교로 개종시키는 데 힘써 우리 정권에 대한 그들의 충성을 보장해야 합니다."
 RAJ_threaten_pakistan: "파키스탄 위협"
 RAJ_threaten_pakistan_desc: "파키스탄? 들어본 적도 없습니다! 서바라트를 말씀하시는 겁니까?"
 RAJ_antiwestern_propaganda: "반서방 선전"
 RAJ_antiwestern_propaganda_desc: "아, 서방! 그들의 헛소리는 비웃음을 사고 어리석음의 본보기로 제시되어야 합니다!"
 RAJ_antichina_propaganda: "반중 선전"
 RAJ_antichina_propaganda_desc: "전체주의 정권인 중화인민공화국은 전통과 도덕이 어리석은 붉은 책으로 대체될 때 한 나라에 무슨 일이 일어나는지를 보여주는 본보기입니다!"
 RAJ_prep_reb_tibet: "티베트 반란 준비"
 RAJ_prep_reb_tibet_desc: "티베트 사람들은 오랫동안 중국 정부에게 억압받아 왔습니다. 그들이 북쪽의 용에게서 벗어나도록 도와야 합니다!"
 RAJ_prepare_tooth: "이빨 준비"
 RAJ_prepare_tooth_desc: "군사적 준비와 힌두 민족주의의 열기가 인도의 군사 태세를 강화합니다."
 RAJ_sharpen_the_claws: "발톱 갈기"
 RAJ_sharpen_the_claws_desc: "전투에 목마른, 정의로운 전사들의 날카롭게 간 발톱입니다."
 RAJ_greater_india: "아칸드 바라트"
 RAJ_greater_india_desc: "아칸드 바라트 이념은 영토 확장과 힌두 민족주의적 결집을 추구합니다."
 RAJ_demand_nepal_and_butan: "네팔과 부탄 요구"
 RAJ_demand_nepal_and_butan_desc: "영국은 부탄과 네팔을 우리에게서 떼어 놓았습니다. 얼마나 터무니없는 결정입니까! 우리는 이를 마땅히 있어야 할 모습으로 되돌릴 것입니다."
 RAJ_demand_bangladesh: "방글라데시 요구"
 RAJ_demand_bangladesh_desc: "방글라데시는 너무 오랫동안 우리와 갈라져 있었습니다. 우리는 다시 하나로 통합해야 합니다."
 RAJ_regional_partnership: "아자드 힌드 부활"
 RAJ_regional_partnership_desc: "아자드 힌드를 우리의 주권을 수호할 새로운 의용군으로 부활시켜야 합니다."
 RAJ_influence_indochina: "인도차이나 영향력 행사"
 RAJ_influence_indochina_desc: "인도차이나에 '인도'가 들어 있는 데에는 이유가 있습니다! 그곳은 아칸드 바라트의 일부였고 앞으로도 일부일 것입니다!"
 RAJ_no_to_democracy: "민주주의 폐지"
 RAJ_no_to_democracy_desc: "으, 민주주의. 우리에게 정말 그것이 필요합니까?"
 RAJ_anew_raj: "새로운 라자 선출"
 RAJ_anew_raj_desc: "군주제 복원은 권위주의적 통치를 추구하는 민족주의 및 전통주의 운동에 호소력이 있습니다."
 RAJ_grand_pan_indian_counc: "범인도 대평의회"
 RAJ_grand_pan_indian_counc_desc: "현대의 문제에는 현대의 해법이 필요합니다! 인도의 안정과 번영을 보장하기 위해 새로운 능력주의 정부를 구성할 것입니다!"
 RAJ_dictatorship_benev: "온정적 독재"
 RAJ_dictatorship_benev_desc: "오직 군대만이 우리나라를 통치할 권리가 있습니다. 군대는 우리 땅의 수호자이며 새로운 통치자가 될 것입니다."
 RAJ_hijack_moderates: "온건파 포섭"
 RAJ_hijack_moderates_desc: "온건한 유권자들을 우리의 사상으로 교화하여 그들의 충성을 보장해야 합니다."
 RAJ_bharatiya_janata_party: "바라티야 자나타당"
 RAJ_bharatiya_janata_party_desc: "바라티야 자나타당은 인도의 정당이며 인도 국민회의와 함께 인도의 양대 주요 정당 중 하나입니다."
 militar_coal_tt: "§Y군부가 집권 연립에 추가됩니다!§!"
 RAJ_MODI_rator_of_ind_pol: "인도 정책의 '조율자'"
 RAJ_MODI_rator_of_ind_pol_desc: "나렌드라 다모다르다스 모디는 BJP 내에서 두드러진 인물이 된 인도 정치인입니다. 모디는 2001년부터 구자라트 주 총리를 지냈으며 바라나시 지역구 의회 의원입니다. 그는 바라티야 자나타당과 우익 힌두 민족주의 준군사 자원 조직인 국민의용단(RSS)의 일원입니다. 그는 인도 국민회의 외 출신으로는 최장수 총리입니다."
 RAJ_strongarm_hindutva: "힌두트바 강경 압박"
 RAJ_strongarm_hindutva_desc: "우리 당은 인도의 다른 극우 단체만큼 급진적이지는 않을 수 있으나, 공통의 이념에 기반하여 다른 세력에 맞서는 연립에 가담해야 합니다. 모디는 온건한(MODIrate) 해법을 제시합니다."
 RAJ_dab_on_ngos: "NGO 규제"
 RAJ_dab_on_ngos_desc: "외국 NGO는 서구의 사상이 우리나라에 퍼지도록 돕고 있습니다. BJP의 인기를 보장하기 위해 이들에 맞서야 합니다."
 RAJ_check_MSF: "국경없는의사회 견제"
 RAJ_check_MSF_desc: "국경없는의사회(Médecins Sans Frontières)는 영어로 Doctors Without Borders라 불리며 인도주의적 의료를 제공하는 자선 단체입니다. 프랑스에서 기원한 비정부 기구로, 분쟁 지역과 풍토병이 만연한 국가에서의 사업으로 알려져 있습니다."
 RAJ_check_sierra_club: "시에라 클럽 견제"
 RAJ_check_sierra_club_desc: "시에라 클럽은 미국의 환경 단체로 미국 50개 주 전체와 워싱턴 D.C., 푸에르토리코에 지부를 두고 있습니다."
 RAJ_check_avaaz: "아바즈 견제"
 RAJ_check_avaaz_desc: "아바즈는 기후 변화, 인권, 동물권, 부패, 빈곤, 분쟁 같은 문제에 관한 세계적 행동주의를 촉진하는 미국 기반의 비영리 단체입니다."
 RAJ_abolish_planning_comission: "계획위원회 폐지"
 RAJ_abolish_planning_comission_desc: "인도 시장은 자유로워야 하며 가혹한 규제를 두어서는 안 됩니다."
 RAJ_full_econ_conv: "완전한 경제 전환"
 RAJ_full_econ_conv_desc: "우리 경제를 자유 시장 자본주의로 완전히 전환해야 합니다. 이는 인도를 위한 유일한 합리적 방법입니다."
 RAJ_niti_aayog: "니티 아요그"
 RAJ_niti_aayog_desc: "니티 아요그는 인도 정부의 최고 공공 정책 싱크탱크이자, 경제 발전을 촉진하고 협력적 연방주의를 육성하며, 상향식 접근을 통해 인도 각 주 정부를 경제 정책 수립 과정에 참여시킴으로써 흥정식 연방주의에서 벗어나는 임무를 맡은 중심 기관입니다."
 RAJ_ensure_free_market: "자유 시장 보장"
 RAJ_ensure_free_market_desc: "이제 우리의 변화가 완전히 정착되도록 인도의 자유 시장을 사실상뿐 아니라 법적으로도 보장해야 합니다."
 RAJ_digital_media_camp: "디지털 미디어 캠페인"
 RAJ_digital_media_camp_desc: "우리의 이상을 선전하기 위해 모든 수단을 사용할 것입니다. 메신저, 소셜 미디어, 인터넷 광고 등 이 모두를 우리의 이익을 위해 활용해야 합니다."
 RAJ_urgent_economic_measures: "긴급 경제 조치"
 RAJ_urgent_economic_measures_desc: "현대 경제는 매우 역동적입니다. 이를 안정시키고 지속성을 보장하기 위해 정부 규제를 활용해야 합니다."
 RAJ_digital_litaracy_programme: "디지털 문해 프로그램"
 RAJ_digital_litaracy_programme_desc: "디지털 삭샤르타 아비얀(DISHA) 또는 국가 디지털 문해 사업(NDLM) 제도는 우리나라 국민에게 IT 교육과 디지털 문해력을 제공하기 위해 마련되었습니다."
 RAJ_ujjwala_scheme: "우찰라 계획"
 RAJ_ujjwala_scheme_desc: "프라단 만트리 우찰라 요자나(PMUY, 번역하면 총리의 빛 계획)는 인도 총리 나렌드라 모디가 빈곤선 이하 가구의 여성들에게 5천만 개의 LPG 연결을 보급하기 위해 시행할 것입니다."
 RAJ_rasht_swasem_sangh: "국민의용단"
 RAJ_rasht_swasem_sangh_desc: "국민의용단(RSS)은 인도의 극우 힌두 민족주의 자원 준군사 조직입니다."
 RAJ_make_them_obey: "복종시키기"
 RAJ_make_them_obey_desc: "NGO는 우리에게 상당히 유익하므로 활동을 계속해야 합니다. 다만 이들의 이념적 선전을 통제하고 우리의 대의에 충성하도록 만들어야 합니다."
 indian_event.28.t: "모디의 NGO 반대 캠페인"
 indian_event.28.d: "인도에는 재난 구호에서 소외되고 불리한 처지에 놓인 공동체에 대한 옹호까지 다양한 분야에서 활동하는 비정부 기구가 340만 개에 가깝게 있습니다. 이들은 급속한 변화와 사회적 변혁을 가져오는 시민 사회의 주요 부분입니다. NGO는 국가로부터 독립적이며 자발적인 성격을 지닌 것으로 간주됩니다. 이들은 개인 기부금, 외국 자금, 다양한 정부 기관과 민간 기부자의 지원에 의존합니다. 이들의 활동은 인도에서 편견, 부패, 문맹, 빈곤을 없애는 데 기여합니다. 그러나 최근 수십 년간 인도는 여러 단체, 특히 부당한 정부 정책에 맞서 사람들에게 힘을 실어주고, 구조적 차별에 의문을 제기하며, 달리트, 부족민, 기타 소외 집단의 권리를 옹호하는 단체들에게 어려운 환경이었습니다. 인도의 역대 정부는 이들의 활동을 억제하려 해 왔습니다."
 indian_event.28.a: "하! 우리가 성공하고 있는 것 같군!"
 indian_event.29.t: "정부 가스 사업 제안"
 indian_event.29.d: "프라단 만트리 우찰라 요자나는 인도 총리 나렌드라 모디가 빈곤선 이하 가구의 여성들에게 LPG 연결을 보급하기 위해 시작한 사업입니다. 이 제도를 위한 예산이 배정되었습니다. 이 제도를 우타르프라데시주에서 시행해야 합니까, 아니면 인도 전역으로 확대해야 합니까?"
 indian_event.29.a: "인도 전역으로 확대한다"
 indian_event.29.b: "한 지역에 집중한다"
 RAJ_gasallindia: "인도 전역 가스 보급"
 RAJ_gasoneindia: "우타르프라데시 한정 가스 보급"
 RAJ_free_liq_gas: "프라단 만트리 우찰라 요자나"
 RAJ_free_liq_gas_desc: "국민에게 액화 가스를 보급하는 새로운 사업을 시작할 때가 왔습니다."
 RAJ_full_india_programme: "인도 전역 프로그램"
 RAJ_full_india_programme_desc: "달성하기 어렵겠지만, 인도 전체가 이 프로그램에 연결되어야 합니다."
 RAJ_only_ujjwala: "한 지역 한정"
 RAJ_only_ujjwala_desc: "국내 사회 상황의 균형을 맞추기 위해 가장 가난한 지역에만 이 혜택을 주어야 합니다."
 RAJ_prior_hindus: "힌두교도 우선"
 RAJ_prior_hindus_desc: "힌두교도는 인도 국가의 핵심입니다. 가능한 모든 방법으로 그들에게 우선권을 주어야 합니다."
 RAJ_coal_with_right_wing: "군부와의 연립"
 RAJ_coal_with_right_wing_desc: "군부는 우리의 개혁을 진심으로 지지합니다. 정치적 사안에서도 그들의 충성을 확보해야 합니다."
 RAJ_goods_and_services_tax: "재화용역세"
 RAJ_goods_and_services_tax_desc: "재화용역세(GST)는 인도에서 재화와 용역의 공급에 사용되던 부가가치세(VAT)의 후속 세목입니다. GST는 재화와 용역을 추적할 수도 있는 VAT의 디지털화된 형태입니다. VAT와 GST는 동일한 과세 구간을 가집니다."
 RAJ_global_mafucat_hub: "세계 제조업 허브"
 RAJ_global_mafucat_hub_desc: "우리는 세계의 제조업 허브가 되어 중국을 능가할 것입니다. 이것이 이번 세기 우리의 유일무이한 경제 목표입니다!"
 RAJ_partnership_with_armenia: "아르메니아와의 협력"
 RAJ_partnership_with_armenia_desc: "아르메니아는 우리 무역로에 매우 중요한 지정학적 위치를 차지하며 우리와 문화적, 역사적 연결도 많습니다. 우리는 아르메니아와 협력하고 그곳의 안전을 보장하기 위해 군사 기지를 설치해야 합니다."
 RAJ_demonatization_of_rupiah: "인도 지폐 화폐 가치 박탈"
 RAJ_demonatization_of_rupiah_desc: "인도 정부는 마하트마 간디 시리즈의 모든 500루피 및 1,000루피 지폐의 화폐 가치 박탈을 발표해야 합니다. 또한 가치가 박탈된 지폐와 교환하여 새로운 500루피 및 2,000루피 지폐를 발행한다고 발표했습니다."
 RAJ_schwach_bharat: "깨끗한 인도 운동"
 RAJ_schwach_bharat_desc: "깨끗한 인도 운동은 노상 배변을 근절하고 고형 폐기물 관리를 개선하며 노상 배변 없는 마을을 만들기 위해 인도 정부가 시작한 전국적 캠페인입니다."
 RAJ_vaccines_for_india: "인도를 위한 백신"
 RAJ_vaccines_for_india_desc: "백신은 무료여야 하며 우리나라의 모든 사회 집단이 접종할 수 있어야 합니다."
 RAJ_harsh_on_pakistan: "파키스탄과의 긴장 고조"
 RAJ_harsh_on_pakistan_desc: "파키스탄은 오랫동안 우리 땅을 공격해 왔습니다! 그들의 식욕을 가라앉히기 위해 약간의 힘을 보여줘야 합니다."
 RAJ_pressuring_china: "중국 압박"
 RAJ_pressuring_china_desc: "중국은 오랫동안 우리에게 적대감을 보여 왔습니다. 그들이 얼마나 끔찍한지 세계에 보여줘야 합니다!"
 RAJ_communist_party_of_india: "인도 공산당"
 RAJ_communist_party_of_india_desc: "인도 공산당은 인도에서 가장 오래된 공산당입니다. CPI는 1925년 12월 26일 오늘날의 칸푸르에서 창당되었습니다."
 RAJ_communist_party_of_india_marxist: "낙살라이트"
 RAJ_communist_party_of_india_marxist_desc: "낙살라이트는 의회 정치를 거부하고, 장기 인민전쟁을 통해 붉은 회랑의 숲에서 인도 국가에 맞서 싸워 왔습니다. 이제 그들은 뉴델리에서 권력을 쥐고 있습니다."
 RAJ_communist_party_of_india_politc: "공산주의 인도!"
 RAJ_communist_party_of_india_politc_desc: "인도가 마침내 사회주의 혁명을 이루었습니다! 붉은 10월을 찬양하라!"
 RAJ_empow_centre_of_trade_unions: "프롤레타리아에게 힘을"
 RAJ_empow_centre_of_trade_unions_desc: "프롤레타리아는 이제 완전히 자유로워져야 하며 인도에서 자신들의 권리를 주장해야 합니다!"
 RAJ_operation_barga: "바르가 작전"
 RAJ_operation_barga_desc: "바르가 작전은 서벵골 농촌 전역에서 정착 기구를 통한 시간 소모적인 기록 방식을 피하면서 소작농의 이름을 기록하기 위한 토지 개혁 운동이었습니다. 이는 바르가다르에게 지주의 퇴거에 대한 법적 보호를 부여하고 수확물에 대한 정당한 몫을 받을 자격을 주었습니다."
 RAJ_a_new_international: "새로운 인터내셔널"
 RAJ_a_new_international_desc: "모든 공산주의 국가가 통일 전선으로 힘을 합칠 수 있도록 새로운 인터내셔널을 결성해야 합니다!"
 indian_event.30.t: "우리의 복속을 요구하는 인도"
 indian_event.30.d: "인도가 우리가 인도에 완전히 통합될 것을 요구합니다."
 indian_event.30.a: "동의한다."
 indian_event.30.b: "거부한다."
 RAJ_influence_west_bengal: "방글라데시 병합"
 RAJ_influence_west_bengal_desc: "방글라데시는 가능한 모든 수단으로 우리와 합쳐져야 합니다. 우리는 이 순간을 오랫동안 기다려 왔습니다."
 RAJ_bring_back_5_year_plan: "5개년 계획의 부활"
 RAJ_bring_back_5_year_plan_desc: "현대 자본주의의 헛소리는 사라져야 합니다. 사회주의 5개년 계획이 나아갈 길입니다!"
 RAJ_foreign_specialists_idea: "외국인 전문가"
 RAJ_foreign_specialists_idea_desc: "우리는 경제 분야에서 나라를 도울 외국인 전문가들을 초빙했습니다."
 RAJ_green_economy_idea: "인도 녹색 GDP"
 RAJ_indian_socialism_idea: "인도 사회주의"
 RAJ_scandinavian_model_idea: "스칸디나비아 모델"
 RAJ_true_social_democracy_idea: "진정한 사회민주주의"
 RAJ_samajwadi_party: "사마지와디당"
 RAJ_samajwadi_party_desc: "주로 우타르프라데시주에서 활동하는 인도의 지역 정당입니다. 1992년 10월 4일 창당되었으며 자나타 달의 해체와 함께 등장했습니다. 스스로를 민주사회주의 정당으로 규정합니다."
 RAJ_bycicle_of_socialism: "사회주의의 자전거"
 RAJ_bycicle_of_socialism_desc: "인도 경제는 하나의 커다란 자전거이며 우리 인도 국민은 그 자전거의 부품일 뿐입니다. 우리 경제가 하나의 구조로서 작동하고 번영의 자전거를 앞으로 몰고 나아가려면 새로운 자전거 경제가 필요합니다."
 RAJ_invite_foreign_speicalists: "외국인 전문가 초빙"
 RAJ_invite_foreign_speicalists_desc: "불행히도 우리 국민은 오랫동안 파렴치한 자본가들에게 착취당해 왔으며, 이들은 자유 시장을 향한 치명적인 추구 속에서 평범한 사람들을 완전히 잊어버렸습니다. 경제의 바퀴에 기름칠을 할 때입니다."
 RAJ_orthodox_socialism: "정통 사회주의"
 RAJ_orthodox_socialism_desc: "인도에 와서 피어난 사회주의의 장미는 사회적 불의에 맞서 가시를 세우고 우리 땅에서 노동자의 권리를 주장할 준비가 되었습니다."
 RAJ_socialist_india: "사회주의 인도"
 RAJ_socialist_india_desc: "우리의 위대한 인민 운동은 훌륭한 경제 계획 체계 없이는 이루어질 수 없습니다."
 RAJ_befriend_religious_organizations: "여러 종교와의 우정"
 RAJ_befriend_religious_organizations_desc: "인도의 자전거는 종교 간의 반목조차도 짓밟고 달릴 것입니다."
 RAJ_neutrality_politics: "중립 정치"
 RAJ_neutrality_politics_desc: "인도는 국내외 정책이 더 이상 외부의 압력에 좌우되어서는 안 되는 나라입니다. 우리는 이제 비동맹 국가들의 지도국입니다."
 RAJ_caste_wage_balancing: "카스트 임금 균형"
 RAJ_caste_wage_balancing_desc: "평화와 평온이 유지되도록 우리나라 여러 카스트의 급여를 최적화해야 합니다."
 RAJ_break_status_quo: "현상 타파"
 RAJ_break_status_quo_desc: "우리의 외교 정책은 더 이상 다른 나라와의 군사 협력에 관한 것이 아닙니다. 이제 우리는 오직 우리 자신의 문제에만 관심이 있습니다."
 RAJ_encourage_birth: "출산 장려"
 RAJ_encourage_birth_desc: "우리는 나라의 출산율을 높게 유지할 더 나은 방법을 찾았습니다."
 RAJ_prior_for_famil: "가족 우선"
 RAJ_prior_for_famil_desc: "우리나라의 긍정적인 출산율을 높이기 위해 가정을 후원해야 합니다."
 RAJ_peserve_traditions: "전통 보존"
 RAJ_peserve_traditions_desc: "우리나라의 여러 종교의 신뢰를 얻음으로써 우리의 상황을 개선하고 밝은 미래로 나아갈 수 있습니다."
 RAJ_indian_premor_socialism: "인도 원초적 사회주의"
 RAJ_indian_premor_socialism_desc: "우리는 성별, 인종, 피부색에 관계없이 나라의 모든 사람을 하나로 만들 것입니다. 모두가 마땅한 몫을 얻을 것이며 인도는 번영할 것입니다."
 RAJ_organiz_of_unit_soc_people: "사회적 인민 연합 조직"
 RAJ_organiz_of_unit_soc_people_desc: "우리의 중립에도 불구하고, 우리는 국제 무대에서 우리의 이익을 지킬 수 있습니다."
 RAJ_new_indian_democracy: "새로운 인도 민주주의"
 RAJ_new_indian_democracy_desc: "우리 당은 과거의 민주주의가 완벽하지 않았다고 주장합니다. 이제 우리가 가졌던 것보다 더 올바른 새로운 민주주의를 만들 때입니다."
 RAJ_anticor_soc_meas: "반부패 노력"
 RAJ_anticor_soc_meas_desc: "국가 내 부패는 우리 국민에게 바이러스와 같습니다. 이를 치료하지 않으면 우리나라는 위험에 빠질 것입니다."
 RAJ_ease_the_caste_stuff: "카스트 문제 완화"
 RAJ_ease_the_caste_stuff_desc: "국가의 안정을 이루려면 카스트주의를 줄여야 합니다."
 RAJ_preserve_soccon: "사회적 보수주의 보존"
 RAJ_preserve_soccon_desc: "우리 국민의 선별적이고 긍정적인 정신을 유지하려면 사회적 보수주의를 줄여야 합니다."
 RAJ_regional_redistr: "지역 재분배"
 RAJ_regional_redistr_desc: "우리는 연금과 사회 보장 비용이 우리나라에서 고르게 분배되지 않는다고 생각합니다. 이를 바꿔야 합니다."
 RAJ_merge_bengal_party: "벵골 정당 합당"
 RAJ_merge_bengal_party_desc: "우리의 위대한 자전거가 계속 굴러갈 수 있도록 우리 정당들이 하나로 뭉쳐야 합니다."
 RAJ_reforming_the_conomy_soc: "사회 경제 개혁"
 RAJ_reforming_the_conomy_soc_desc: "경제의 결함을 바로잡기 위해 개혁할 때입니다."
 RAJ_7030_economy: "7030 경제"
 RAJ_7030_economy_desc: "우리나라에는 가난한 사람이 많습니다. 그 비율이 70%이며 이는 바로잡혀야 합니다. 나머지 30%는 부유한 사람들이며, 그들은 스스로를 부양할 수 있을 것이라 믿습니다."
 RAJ_reserved_seats: "할당 의석"
 RAJ_reserved_seats_desc: "더 정직한 선거에 이르기 위해, 부패를 피하도록 정부 내 의석을 할당해야 합니다."
 RAJ_changing_stakeholders: "이해관계자 교체"
 RAJ_changing_stakeholders_desc: "우리는 더 이상 기존 후원자들에게 관심이 없습니다."
 RAJ_praise_the_unions: "노동조합 찬양"
 RAJ_praise_the_unions_desc: "노동조합은 우리나라의 근간이며, 우리는 국가 차원에서 그들의 이익을 지켜야 합니다."
 RAJ_green_economy_soc: "인도 녹색 GDP"
 RAJ_green_economy_soc_desc: "우리는 인도 경제 발전에 유리한 여건을 조성할 수 있었습니다. 이제 그 결실을 맛볼 수 있습니다."
 RAJ_equal_not_equity: "평등, 형평이 아니라"
 RAJ_equal_not_equity_desc: "마침내 이상적인 균형에 이르기 위해 우리나라의 마지막 문제들을 해결할 때입니다."
 RAJ_full_soc_conv: "진정한 사회민주주의 경제"
 RAJ_full_soc_conv_desc: "우리는 이러한 체제가 인도가 앞으로 오랫동안 번영하도록 해 줄 것이라 믿습니다."
 RAJ_scandinavian_model: "스칸디나비아 모델"
 RAJ_scandinavian_model_desc: "스칸디나비아는 경제적, 사회적으로 잘 발전한 국가들이 있는 성공적인 지역입니다. 그들의 발전 방식이 우리에게 가장 잘 맞습니다."
 RAJ_communist_influence_zone: "공산주의 영향권"
 RAJ_communist_influence_zone_desc: "우리 이웃은 혁명 정신으로 불타올라야 합니다! 그들에게 마르크스주의의 메시지를 퍼뜨려야 합니다!"
 RAJ_befriend_china: "중국과의 친선"
 RAJ_befriend_china_desc: "어리석은 분쟁은 오가지만 국제적 형제애는 남습니다. 중국이 우리의 가장 큰 친구가 되어야 합니다!"
 RAJ_sino_indian_alliance: "중인 동맹"
 RAJ_sino_indian_alliance_desc: "이제 자본가들이 우리의 힘을 두려워하도록 동맹을 맺어야 합니다."
 indian_event.31.t: "중인 동맹"
 indian_event.31.d: "오랜 세월의 적대 끝에 우리 두 나라는 마침내 동맹 협정에 도달했으며, 자본주의의 쓰레기를 짓밟을 준비가 되었습니다!"
 indian_event.31.a: "환상적이군"
 RAJ_spit_on_revision: "수정주의자에게 침 뱉기"
 RAJ_spit_on_revision_desc: "이와 달리 우리의 고집 센 이웃 중국은 \\"진정한\\" 사회주의에 대한 그릇된 사상을 퍼뜨립니다. 그들의 정치 구조는 무엇보다 우리를 위협하며, 우리는 우리에 대한 선제공격이 개시되기 전에 그 위협을 제거해야 합니다."
 indian_event.32.t: "동맹을 제안하는 인도"
 indian_event.32.d: "동의해야 합니까?"
 indian_event.32.a: "물론이지"
 indian_event.32.b: "미안하지만, 안된다"
 RAJ_vietnam_indian_alliance: "베트남-인도 동맹"
 RAJ_vietnam_indian_alliance_desc: "베트남은 사이비 사회주의 국가인 중국보다 우리 이념에 훨씬 더 가깝습니다. 베트남과 친선을 맺어야 합니다."
 RAJ_REV_PAK_TT: "§Y파키스탄 정부를 전복하기 위해 파키스탄에서 혁명을 일으킬 것입니다§!"
 RAJ_REV_PER_TT: "§Y이란 정부를 전복하기 위해 이란에서 혁명을 일으킬 것입니다§!"
 RAJ_revolution_in_pakistan: "파키스탄 혁명"
 RAJ_revolution_in_pakistan_desc: "파키스탄은 종교적, 자본주의적 사슬에서 벗어나 우리 민족에 의해 해방되어야 합니다!"
 RAJ_iranian_question: "이란 혁명"
 RAJ_iranian_question_desc: "이란은 종교적, 자본주의적 사슬에서 벗어나 우리 민족에 의해 해방되어야 합니다!"
 RAJ_crush_nepal_bhutan: "네팔과 부탄 분쇄"
 RAJ_crush_nepal_bhutan_desc: "네팔과 부탄은 마르크스주의의 가르침에 반대하는 반동 정권입니다. 우리의 혁명을 그들에게 수출해야 합니다."
 RAJ_promote_bangladeshi_communism: "사회주의의 아대륙"
 RAJ_promote_bangladeshi_communism_desc: "우리 아대륙은 완전한 사회주의 지역이 되어야 하며 그것이 유일한 길입니다!"
 RAJ_national_federation_of_women: "전국 여성 연맹"
 RAJ_national_federation_of_women_desc: "여성은 사회적 사슬에서 해방되어 우리 사회의 동등한 구성원이 되어야 합니다."
 RAJ_all_ndia_youth_commun: "전인도 청년 운동"
 RAJ_all_ndia_youth_commun_desc: "아이들에게 우리의 가장 참된 이념을 주입하기 위해 인도 소년단 운동을 조직해야 합니다."
 RAJ_common_minimum_programme: "공통 최소 프로그램"
 RAJ_common_minimum_programme_desc: "모든 빈민을 지원해야 합니다. 새로운 삶의 방식을 강요하게 되더라도 그들을 뒤처지게 놔둘 수는 없습니다."
 RAJ_fund_cprf: "러시아 공산당 지원"
 RAJ_fund_cprf_desc: "러시아 공산당이 권력을 잡고 우리의 대의에 합류하도록 지원해야 합니다."
 RAJ_promote_marxism_in_indochina: "인도차이나 마르크스주의 촉진"
 RAJ_promote_marxism_in_indochina_desc: "인도차이나에서 마르크스주의를 촉진해야 합니다. 이는 우리 지역 혁명의 다음 논리적 단계이기 때문입니다."
 RAJ_crusade_against_religion: "종교에 대한 성전"
 RAJ_crusade_against_religion_desc: "종교? 무슨 헛소리입니까! 베다를 마르크스의 저작으로 대체하십시오, 그러면 도움이 될 것입니다."
 RAJ_triumph_of_communism: "공산주의의 승리"
 RAJ_triumph_of_communism_desc: "우리나라는 사회주의가 어떻게 건설되어야 하는지 보여주는 본보기입니다. 자본가들이여, 계속 부러워하라!"
 RAJ_new_socialism_of_india: "인도의 새로운 사회주의"
 RAJ_new_socialism_of_india_desc: "우리의 사회주의는 인도에게 새로운 것입니다. 이것은 우리 고유의 모델이며 모범이 되어야 합니다."
 RAJ_ideological_comissars: "이념 정치위원"
 RAJ_ideological_comissars_desc: "국민의 사고방식은 통제되어야 합니다. 이념 정치위원이 그 일을 할 것입니다."
 RAJ_close_parliament: "군사 공산주의"
 RAJ_close_parliament_desc: "자본주의 야만인들이 우리나라를 정복하려 하니 우리는 이빨까지 무장해야 합니다!"
 RAJ_REB_S_neutrality: "동남아시아 소비에트 사회주의 공화국"
 RAJ_partnership_with_russia: "러시아와의 우정"
 RAJ_partnership_with_russia_desc: "러시아는 더 이상 그렇게 공산주의적이지는 않지만, 우리의 역사적 유대와 그들의 소련에 대한 향수는 대화를 위한 좋은 토대입니다."
 RAJ_congress_of_soviets: "동남아시아 소비에트 사회주의 공화국"
 RAJ_congress_of_soviets_desc: "때가 왔습니다. 우리는 단순한 사회주의 인도 이상의 무언가가 될 것입니다. SASSR이 되어야 합니다."
 RAJ_new_democratic_india_idea: "새로운 민주주의 인도"
 RAJ_bahujan_samaj_party: "바후잔 사마지당"
 RAJ_bahujan_samaj_party_desc: "인도의 전국 정당입니다. 달리트와 인구 중 기타 낮은 카스트 집단의 이익을 대변하며, 그래서 이름에 \\"바후잔\\"이 들어갑니다. 인도의 지정 카스트와 부족, 기타 \\"후진 계급\\"은 인구의 85%를 차지합니다."
 RAJ_torch_of_ambedkar: "암베드카르의 횃불"
 RAJ_torch_of_ambedkar_desc: "암베드카르가 1927년 마하드 운동 중에 밝힌 횃불은 이제 들불이 되어 역사 전반에 걸쳐 달리트에게 가해진 잔학 행위에 복수할 때까지 멈추지 않을 것입니다."
 RAJ_social_transformation: "사회 변혁"
 RAJ_social_transformation_desc: "우리 사회를 더 완벽한 사회로 변혁해야 합니다."
 RAJ_economic_emancipation: "경제적 해방"
 RAJ_economic_emancipation_desc: "우리 경제를 최적화하려면 특별한 조치가 필요합니다."
 RAJ_social_democracy_of_india: "인도 사회민주주의"
 RAJ_social_democracy_of_india_desc: "우리는 국민이 자신들의 의견이 경청되고 있다고 느끼도록 더 발전하고 자유로운 사회민주주의를 만들 것입니다."
 RAJ_Indian_federation_of_free_peoples: "인도 자유 민족 연방"
 RAJ_Indian_federation_of_free_peoples_desc: "우리는 민주주의와 언론의 자유가 존재의 토대가 되는 나라를 만들 것입니다. 다른 민주주의 국가들의 민주주의는 우리만큼 완벽하지 않으므로 그들은 우리를 모방해야 할 것입니다."
 RAJ_appease_all_castes: "모든 카스트 달래기"
 RAJ_appease_all_castes_desc: "우리나라에서 모든 권리와 이익이 진정으로 존중됨을 모두에게 보여줄 수 있도록 모든 카스트를 진정시켜야 합니다."
 RAJ_new_indian_educ: "새로운 인도 교육"
 RAJ_new_indian_educ_desc: "우리 정부는 모든 국민이 좋은 교육을 받을 수 있도록 교육 개혁을 준비했습니다."
 RAJ_rural_employment_prog: "농촌 고용 프로그램"
 RAJ_rural_employment_prog_desc: "농촌 지역에는 아직도 엄청난 수의 실업자가 있습니다. 특별한 일자리 모집 및 선전 프로그램을 만들어 이를 해결해야 합니다."
 RAJ_more_funding_for_regions: "지방 자금 확대"
 RAJ_more_funding_for_regions_desc: "인도 경제의 성장을 보장하려면 지방 개발에 더 많은 자금을 배정해야 합니다. 특히 인프라가 열악한 곳에서 그렇습니다."
 RAJ_caste_wage_balancing1: "카스트 임금 균형"
 RAJ_caste_wage_balancing1_desc: "국가의 안정을 보장하기 위해 여러 카스트의 급여를 균형 있게 조정해야 합니다."
 RAJ_crush_the_caste: "카스트 타파"
 RAJ_crush_the_caste_desc: "우리 사회가 변혁을 계속할 수 있도록 카스트를 깨뜨려야 합니다."
 RAJ_untouchables_reed: "불가촉천민의 갈대"
 RAJ_untouchables_reed_desc: "우리나라를 과학적으로 더 발전한 나라로 만들려면 교육을 개선해야 합니다."
 RAJ_make_religions_bow: "종교를 굴복시키기"
 RAJ_make_religions_bow_desc: "불안정을 피하기 위해 우리나라의 모든 종교는 단일 법에 따라야 합니다."
 RAJ_secular_india: "세속주의 인도"
 RAJ_secular_india_desc: "인도는 더 이상 종교의 의견에 좌우되지 않을 것입니다."
 RAJ_wipe_out_gandhis_legacy: "간디의 유산 지우기"
 RAJ_wipe_out_gandhis_legacy_desc: "간디의 유산은 자유로운 사회를 건설하는 데 큰 문제입니다."
 RAJ_new_indian_civilization: "새로운 인도 문명"
 RAJ_new_indian_civilization_desc: "이제 인도 국민은 이전보다 더 순수해졌습니다. 우리는 이를 가능케 한 많은 개혁을 단행했습니다. 새로운 인도 문명의 시대가 왔습니다."
 RAJ_modern_indian_constitut: "현대 인도 헌법"
 RAJ_modern_indian_constitut_desc: "인도는 더 문명화된 국가가 되기 위해 새 헌법을 채택해야 합니다."
 RAJ_one_wife_programme: "일부일처 프로그램"
 RAJ_one_wife_programme_desc: "우리는 인도의 모든 가정이 아내를 한 명만 두도록 하겠습니다."
 RAJ_redistr_of_wealth: "부의 재분배"
 RAJ_redistr_of_wealth_desc: "빈곤은 우리의 주적입니다. 우리는 이에 맞서 싸워야 합니다."
 RAJ_bamcef: "BAMCEF"
 RAJ_bamcef_desc: "1971년 칸시 람, D. K. 하파르데, 디나브하나가 설립한 억압받는 공동체 노동자들의 조직입니다. 이 용어는 억압받고 착취당하는 인도인을 지위에 따라 지정 카스트, 지정 부족, 기타 후진 계급, 소수 공동체로 구분하는 인도 헌법에서 의미를 따왔습니다."
 indian_event.33.t: "우리의 복속을 요구하는 인도"
 indian_event.33.d: "인도가 우리가 인도에 완전히 통합될 것을 요구합니다."
 indian_event.33.a: "동의한다."
 indian_event.33.b: "거부한다."
 nat_coal_tt: "§G모든 민족주의자를 하나로 통합할 것입니다!§!"
 mah_coal_tt: "§Y시브 세나의 인기를 가로챌 것입니다!§!"
 shiv_coal_tt: "§YMNS 세나의 인기를 가로챌 것입니다!§!"
 RAJ_indian_ceasar_idea: "인도 전통주의"
 dep_musl_tt: "§Y인도에서 이슬람교도를 추방할 것입니다!§!"
 RAJ_REV_TIB_TT: "§Y티베트에서 반란을 일으킬 것입니다!§!"
 indian_event.34.t: "티베트 반란!"
 indian_event.34.d: "티베트가 독립을 선언하고 우리의 승인을 요구하고 있습니다. 어떻게 해야 합니까?"
 indian_event.34.a: "그들을 짓밟아라!"
 indian_event.34.b: "평화? 어쩌면?"
 RAJ_greater_hindustan_decisions_category: "대힌두스탄 확장"
 RAJ_greater_hindustan_decisions_category_desc: "아칸드 바라트의 개념은 통일된 인도 아대륙을 구상합니다. 이 결정들은 그 비전을 향한 영토적, 정치적 확장을 추구합니다."
 RAJ_expanding_sphere_of_influence: "아프가니스탄의 충성 요구"
 RAJ_demand_sri_lanka: "스리랑카 요구"
 RAJ_demand_myanma: "미얀마의 독립 훼손"
 RAJ_burn_down_the_separatist_sentiments: "분리주의 정서 소각"
 RAJ_land_of_freedom: "\\"자유의 땅\\""
 RAJ_laotian_resorts: "라오스 휴양지 여행"
 RAJ_cambodian_natural_resources: "캄보디아 천연자원"
 RAJ_change_the_malaysian_constitution: "말레이시아 형법 개정"
 RAJ_bring_hinduism_back_to_indonesia: "인도네시아에 힌두교 부활"
 RAJ_land_mines_desc_info: "§Y이 지역에서는 공산주의 반군이 활동 중입니다!§!"
 RAJ_brics_alliance_decisions: "BRICS"
 RAJ_brics_alliance_decisions_desc: "§HBRICS§!는 서방의 식탁에서 번번이 배제되어 온 국가들의 경제를 성장시키고, 신조나 이념, 표어와 관계없이 공동의 번영을 이루기 위해 창설되었습니다.\n\n가입은 세 단계를 거쳐 올라갑니다. §Y참관국§!, 다음으로 §Y준회원국§!, 그리고 §Y정회원국§!입니다. 국가는 스스로 신청할 수 있으며, BRICS의 지도국이 직접 초대하여 단계를 승급시킬 수도 있습니다. 각 단계마다 해당 국가가 지도국에 우호적인 관계를 가지고 충분한 BRICS 영향력 아래에 있어야 하므로, 먼저 관계를 개선해야 합니다.\n\n처음부터 가입할 수 있는 국가는 §Y브라질, 러시아, 중국, 남아프리카공화국§!과 §Y이집트, 에티오피아, 사우디아라비아, 아랍에미리트, 아르헨티나, 인도네시아§!, 그리고 여러 중앙아시아 국가입니다. 일부(§Y베네수엘라, 알제리, 쿠바, 싱가포르, 덴마크, 스웨덴§!)는 가입하기 전에 먼저 자국의 국가 중점을 완료해야 합니다."
 maoist_decision_category: "낙살라이트-마오이스트 반란"
 maoist_decision_category_desc: "The Naxalite-Maoist insurgency is an ongoing conflict in India where Maoist groups, inspired by the ideology of Mao Zedong, are engaged in armed rebellion against the Indian government. The movement originated in the late 1960s and is primarily active in rural areas, particularly in the states of Chhattisgarh, Jharkhand, and Odisha. The insurgency seeks to address issues of land inequality, exploitation, and social injustice. It is considered one of the biggest internal security threats to India and has resulted in significant violence and loss of life. The government has been implementing various strategies to curb the insurgency and address the underlying causes.\n\n$mao_current_popularity$: [?party_pop_array^19|%1]\n\n§RWarning:§! If any state reaches §Hsevere§! insurgency levels and Maoist political support exceeds §H15%§!, organized demonstrations will begin, and if left unchecked, armed rebellion will follow."
 suppress_maoist_activities: "마오주의자 활동 진압"
 indian_event.35.t: "동투르키스탄 반란"
 indian_event.35.d: "오늘 신장의 이슬람교도 소수 민족이 중국에서 분리 독립하여 독립 동투르키스탄을 선포하기 위해 무장 봉기를 일으켰다는 긴급 정보를 입수했습니다. 반란군은 인도의 이슬람주의 정부가 지원하고 있는 것으로 추정됩니다. 신장에 군사 개입을 단행해야 합니까, 아니면 상황을 그대로 두어야 합니까?"
 indian_event.35.a: "군사 개입한다."
 indian_event.35.b: "우리가 상관할 바가 아니다."
 RAJ_REV_ETK_TT: "§B신장에서 반란을 일으킬 것입니다!§!"
 RAJ_copied_american_warfare_tactics_idea: "모방한 미국식 전술"
 RAJ_increase_arms_production_idea: "무기 생산 증대"
 RAJ_revolutions_help: "§B중앙아시아에서 우리에게 적대적인 정부의 전복을 도울 수 있습니다§!"
 is_top_influencer_pak: "§Y[ROOT.GetNameWithFlag]§!이(가) §Y[PAK.GetNameWithFlag]§!에 대해 §G>=35%§!의 영향력을 보유"
 indian_event.36.t: "우리 두 나라의 통합 문제"
 indian_event.36.d: "최근 우리 두 나라 사이에 이념은 물론 경제적, 정치적 교류에서도 많은 유사점이 나타남에 따라, 우리 정부와 인도 정부 사이에서 양국 통합 문제가 제기되었습니다. 우리는 이웃 나라와 통합해야 합니까, 아니면 \\"다른\\" 길을 택해야 합니까?"
 indian_event.36.a: "그렇다, 우리는 함께 전 세계적인 이슬람주의 혁명을 일으킬 것이다."
 indian_event.36.b: "우리는 다른 길을 택하겠다"
 RAJ_declare_holy_jihad: "성전(지하드) 선포"
 RAJ_declare_holy_jihad_desc: "칼리파국은 자신의 팽창 계획을 종교적 의무로 선포하고, 배교했거나 적대적이라고 간주되는 이웃 국가들과의 전쟁을 위해 국민을 동원합니다."
 RAJ_reach_out_to_pakistani_Salafists: "파키스탄 살라피에게 손을 내밀기"
 RAJ_reach_out_to_pakistani_Salafists_desc: "중동으로 가는 길을 열 수 있도록 파키스탄 살라피와의 문제를 해결해야 합니다."
 RAJ_funding_central_asian_islamists: "중앙아시아 이슬람주의자 자금 지원"
 RAJ_funding_central_asian_islamists_desc: "중앙아시아는 이슬람주의 혁명을 확산시키기에 이상적인 발판입니다."
 RAJ_islamic_central_asian_revolutions: "투르키스탄 혁명"
 RAJ_islamic_central_asian_revolutions_desc: "중앙아시아의 이슬람주의 이념가들과 연계함으로써 우리의 영향권을 크게 넓힐 수 있습니다."
 RAJ_true_indian_territories_in_cenasia: "충성스러운 정권 수립"
 RAJ_true_indian_territories_in_cenasia_desc: "마침내 중앙아시아의 종교적 형제들을 하나로 묶을 수 있습니다."
 RAJ_turkmen_treaty: "투르크메니스탄과의 조약"
 RAJ_turkmen_treaty_desc: "투르크메니스탄은 우리에게 전략적으로 중요하므로 그들의 지원을 얻을 수 있습니다."
 RAJ_ally_taliban: "아프가니스탄의 형제들"
 RAJ_ally_taliban_desc: "아프가니스탄의 형제들과 하나가 되어야 합니다. 오직 함께해야만 세속 세계를 물리칠 수 있기 때문입니다."
 RAJ_first_partition_of_afghanistan: "제1차 아프가니스탄 분할"
 RAJ_first_partition_of_afghanistan_desc: "아프가니스탄은 이슬람주의 혁명을 확산시키는 문제에서 이상적인 이점을 제공하는 영토입니다."
 RAJ_bye_bye_turkmenistan: "분열증 환자 전복"
 RAJ_bye_bye_turkmenistan_desc: "그들은 우리가 자기들과 친구가 될 거라고 정말 생각했습니까?"
 RAJ_peaceful_reunification: "평화적 재통일"
 RAJ_peaceful_reunification_desc: "파키스탄 살라피와의 특별한 종교적 연대와 특별한 경제적 연결 때문에 우리는 파키스탄과 평화적으로 재통일하기로 결정했습니다. 인샬라!"
 RAJ_bring_back_kashmir: "이단자 박멸"
 RAJ_bring_back_kashmir_desc: "파키스탄이 여전히 카슈미르의 우리 국민에 대한 접근을 차단하고 있다는 점을 용서하지 않을 것입니다. 파키스탄은 파괴될 것입니다!"
 RAJ_nepal_fell_after_all: "네팔"
 RAJ_nepal_fell_after_all_desc: "이 지역에서 우리의 영향력을 높이려면 네팔에 대한 통제권을 되찾아야 합니다."
 RAJ_myanmar_what: "보노는 버마의 자유를 위해 싸우지 않는다"
 RAJ_myanmar_what_desc: "물론 그에게는 '자유로운' 선택권이 있습니다."
 RAJ_bangladesh_independence: "방글라데시 독립에 의문 제기"
 RAJ_bangladesh_independence_desc: "방글라데시는 우리의 눈엣가시입니다. 외국 군대가 그 영토에 진입하면 우리의 동부 회랑이 위태로워지기 때문입니다."
 RAJ_support_xinjian_islamists: "동투르키스탄 해방"
 RAJ_support_xinjian_islamists_desc: "중국은 너무 오랫동안 신장의 이슬람 주민들을 억압해 왔습니다. 그들이 독립을 얻고 원하는 삶을 살 수 있도록 도와야 합니다."
 RAJ_troubleshoot_the_map: "지도 오류 바로잡기"
 RAJ_troubleshoot_the_map_desc: "이스라엘은 세계의 가장 큰 위협이자 오류입니다. 지도에 그려진 이 부정확함을 바로잡아야 합니다."
 RAJ_to_avenge_the_oppression_of_the_uighurs: "위구르 억압에 대한 복수"
 RAJ_to_avenge_the_oppression_of_the_uighurs_desc: "쌀 그릇에 관한 마지막 문제를 매듭지을 때가 되었습니다."
 RAJ_main_enemy_of_chaliphate: "샤이탄의 목을 베기"
 RAJ_main_enemy_of_chaliphate_desc: "국가 부채를 청산할 때입니다."
 RAJ_get_weapons_on_the_black_market: "암시장 사업"
 RAJ_get_weapons_on_the_black_market_desc: "우리는 너무 고립되었으므로 우회적인 방법으로 무기를 조달해야 합니다."
 RAJ_training_our_soldiers_in_mountains: "특수 산악 훈련"
 RAJ_training_our_soldiers_in_mountains_desc: "가장 극한의 조건에 대비하여 병사들을 준비시킴으로써 우리는 세계 어디에서든 방해받지 않고 혁명을 확산시킬 수 있을 것입니다."
 RAJ_american_tactic: "미국식 전술"
 RAJ_american_tactic_desc: "미국식 전술은 많은 전쟁에서 효과가 입증되었습니다. 우리 군을 위해 그들을 본보기로 삼아야 합니다."
 RAJ_increase_arms_production: "무기 생산 증대"
 RAJ_increase_arms_production_desc: "국내 무기 제조 역량을 확대하는 것은 우리의 군사 작전을 유지하고 외국 공급업체에 대한 의존을 줄이는 데 필수적입니다."
 RAJ_international_jihadis: "중동 지하디스트"
 RAJ_international_jihadis_desc: "이슬람주의 사상은 중동에서 훨씬 잘 작동하므로, 이러한 사상을 거듭 선전해야 합니다."
 RAJ_support_islamists: "시리아의 이슬람주의자 지원"
 RAJ_support_islamists_desc: "시리아에 동맹이 있으면 서방 국가들을 직접 타격할 수 있습니다."
 RAJ_reconcile_al_qaeda_and_isis: "갈라선 이들의 통합"
 RAJ_reconcile_al_qaeda_and_isis_desc: "다른 이념적 동맹들과 통일된 동맹을 형성함으로써 우리의 공통된 꿈인 이슬람 칼리파국 건설에 훨씬 더 가까이 다가갈 수 있습니다."
 RAJ_fight_against_idols: "우상숭배 척결"
 RAJ_fight_against_idols_desc: "새 정권은 힌두교, 시크교, 불교의 종교 기반 시설을 겨냥하여 사원 단지와 성지를 해체하거나 용도를 바꿔야 할 이념적 위협으로 취급합니다."
 RAJ_no_women_in_politics: "여성의 정치 참여 금지"
 RAJ_no_women_in_politics_desc: "우리 종교는 여성이 정치에 관여해야 한다고 상정하지 않습니다."
 RAJ_islamization_of_India: "인도의 이슬람화"
 RAJ_islamization_of_India_desc: "강제 개종, 강제 이주, 인구 구조 조작을 아우르는 전국적 프로그램이 인도 사회를 통일된 수니파 국가라는 칼리파국의 비전에 맞게 재편합니다."
 RAJ_redo_social_policies: "샤리아 법 수립"
 RAJ_redo_social_policies_desc: "샤리아 법이야말로 인도 국민이 진정으로 필요로 하는 것입니다. 이를 도입하지 않으면 우리는 진정한 이슬람 칼리파국이라 할 수 없습니다."
 RAJ_fatwa_of_factories: "산업 파트와"
 RAJ_fatwa_of_factories_desc: "파트와는 이슬람 법의 규범적 법원으로 정의할 수 있으며, 이슬람 재판관(카디)이 제기하거나 마즐리스의 요청에 따라 검토 중인 특정 사안에 대해 권위를 가진 이슬람 세계 학자들의 견해로 작용합니다."
 RAJ_MAO_rebellion: "반란 상황"
 RAJ_fatwa_of_factories_idea: "공장 파트와"
 the_great_islamic_ulema: "대이슬람 울라마"
 indian_event.37.t: "새로운 이슬람 조직"
 indian_event.37.d: "새로 수립된 인도의 이슬람주의 정부가 전 세계에 이슬람주의 관점을 확산하는 것을 주된 목적으로 하는 통합 이슬람주의 조직을 결성하자는 제안을 우리에게 해 왔습니다. 이 동맹의 수장이 강대국 인도이므로, 가입하면 우리가 추구하는 외부 위협으로부터의 보호를 보장받고 우리의 집권 정권을 암살 시도로부터 지킬 수 있을 것입니다."
 indian_event.37.a: "물론이다, 손을 잡자!"
 indian_event.37.b: "우리도 스스로를 지킬 수 있다"
 indian_event.38.t: "거절된 동맹 초청"
 indian_event.38.d: "그들의 정부는 외부 위협을 스스로 감당할 수 있다고 생각했습니다."
 indian_event.38.a: "A disappointing outcome."
 RAJ_revenge_for_the_humiliation_of_chechnya: "체첸 칼리파국의 굴욕에 대한 복수"
 RAJ_revenge_for_the_humiliation_of_chechnya_desc: "체첸 칼리파국은 훌륭한 구상이었지만, 러시아의 탐욕스러운 자본가들이 이 구상을 파괴하기로 결정했습니다. 심판의 때가 왔습니다."
 indian_event.39.t: "내전 지원에 대한 대가"
 indian_event.39.d: "인도 정부의 직접적인 지원이 없었다면 내전에서의 우리의 승리는 없었을 것입니다. 내전은 인도에게 매우 큰 비용이 들었으므로 인도는 그 대가로 무언가를 얻어야 합니다. 그들은 우리가 북부의 일부 영토에 대한 통제권을 넘기기를 요구하며, 그 대가로 외부 위협으로부터 군사적 보호를 제공하겠다고 합니다. 우리 정권은 이제 막 공고화되기 시작했고 다시 전복되고 싶지 않습니다. 어떻게 하시겠습니까?"
 indian_event.39.a: "그 조치를 감수하겠다"
 indian_event.39.b: "우리는 소련 앞에서도 움츠러들지 않았고, 인도 앞에서도 움츠러들지 않을 것이다."
 indian_event.40.t: "요구 거절"
 indian_event.40.d: "탈레반 정부는 자신들이 우리 군에 맞설 힘이 있다고 판단했습니다."
 indian_event.40.a: "또 한 번의 공세를 버틸 수 있는지 지켜보자."
 RAJ_central_asian_salaf_revolution: "중앙아시아 혁명"
 RAJ_HELP_TALIB: "§G내전에서 탈레반을 돕지 않으면 그들은 영토를 포기하지 않을 것입니다§!"
 RAJ_main_enemies_of_islamism: "이슬람주의의 주적"
 RAJ_main_enemies_of_islamism_desc: "이슬람 칼리파국의 붕괴에 가담한 모든 자들에게 그 대가를 치르게 해야 합니다."
 RAJ_proffesional_soldiers: "직업 군인"
 RAJ_proffesional_soldiers_desc: "혁명을 성공적으로 확산시키려면 군대를 강화해야 합니다."
 RAJ_mao_reb.1.t: "마오주의자의 역습!"
 RAJ_mao_reb.1.d: "우리는 이 지역에서 그들의 활동을 성공적으로 저지했지만, 많은 병력을 잃었습니다."
 RAJ_mao_reb.1.a: "명예롭게 묻어주어라."
 RAJ_mao_reb.2.t: "대규모 테러 공격!"
 RAJ_mao_reb.2.d: "최근의 소탕 작전 이후 마오주의자들이 인구 밀집 지역에서 대규모 테러 공격을 감행했습니다."
 RAJ_mao_reb.2.a: "으억"
 RAJ_mao_reb.3.t: "성공적인 소탕"
 RAJ_mao_reb.3.d: "일부 병력을 잃었지만 적을 격파했습니다."
 RAJ_mao_reb.3.a: "좋아"
 RAJ_Export_category: "인도 무기 무역"
 RAJ_Export_category_desc: "오늘날 무기 무역은 선진국 경제의 불가결한 부분이며 인도 역시 예외가 아닙니다. 과거 정부의 올바른 정책 덕분에 인도는 무기 생산을 늘리고 다른 나라에 판매할 수 있게 되었습니다. 국제 시장에서 경쟁력 있는 강국이 되려면 무기 무역과 생산을 발전시키기 시작해야 합니다. 인도는 선진 군사 강국으로서 새 천년에 진입해야 합니다."
 RAJ_more_relation_is_better: "다음 국가들과 §G더 높은 관계§!를 가지고 있다면 §C우리 세력에 가입할 가능성이 더 높습니다§!"
 RAJ_start_export_weapon_TT: "이제 우리는 다른 나라에 무기를 수출할 수 있는 허가를 얻었습니다"
