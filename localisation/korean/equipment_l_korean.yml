 SOV_Rec_tank_3_desc: "The Bumerang was first revealed to be both a cost-efficient APC and IFV for the modern Russian Army. However, the Bumerang will also be used as a dedicated anti-tank platform sporting a 125mm cannon, the details of which were unveiled in 2018. Much like the American Stryker MGS, the Bumerang will serve as a fire support vehicle much like the BMPT."
 SPR_APC_4: "FMC 강습 상륙 차량 LVTP-7"
 SPR_APC_4_short: "LVTP-7"
 SPR_APC_4_desc: "After the Korean War the USMC ordered a new amphibious vehicle model to replace the old LVT. It is used by U.S. Marine Corps Assault Amphibian Battalions to land the surface assault elements of the landing force and their equipment in a single lift from assault shipping during amphibious operations to inland objectives and to conduct mechanized operations and related combat support in subsequent mechanized operations ashore. It is also operated by other forces. Marines call them \"amtracs\", a shortening of their original designation, \"amphibious tractor\". Spanish navy signed a deal to include them for the Infantería de Marina."
 SPR_APC_5: "BAE 시스템즈 강습 상륙 차량 7A1"
 SPR_APC_5_short: "AAV-7A1"
 SPR_APC_5_desc: "공식 제식 명칭이 AAVP-7A1인 강습 상륙 차량(AAV)은 (구 명칭 상륙 차량, 궤도형, 병력 수송형-7, 약칭 LVTP-7) 완전 궤도식 수륙 양용 상륙 차량입니다. 커민스 VT400 디젤 엔진으로 구동되며, FMC의 HS-400-3A1 변속기를 통해 동력이 전달됩니다. 무장 거치대 주위에 연막탄 발사기 8기가 있으며, 무장 거치대는 캐딜락 게이지 무기 거치대 혹은 .50구경(12.7mm) M2HB 기관총과 Mk-19 40mm 유탄발사기를 함께 장비한 중무장 무기 거치대(UGWS)입니다. AAV-7A1은 스페인 해병대의 주력 상륙 강습 차량입니다."
 SPR_APC_6: "RG-31 니알라"
 SPR_APC_6_short: "RG-31 니알라"
 SPR_APC_6_desc: ""
 SPR_APC_7: "MOWAG GmbH 피라냐 III"
 SPR_APC_7_short: "피라냐 III"
 SPR_APC_7_desc: "Designed by the Swiss company MOWAG (currently General Dynamics European Land Systems – Mowag GmbH). The Piraña IIIC is an 8x8 APC Vehicle with a modular scaleable armor protection against small arms fire, mine blasts and RPG rockets. It could be tailored, to suit specific customer requirements. Add-on armor can be fitted for a higher level of protection. It has a special underfloor design, that provides protection against landmines and improvised explosive devices. Vehicle is fitted with NBC protection and automatic fire suppression systems. A baseline APC is usually armed with remotely-controlled 12.7mm HMG."
 SPR_APC_8: "MOWAG GmbH 피라냐 IIIC"
 SPR_APC_8_short: "피라냐 IIIC"
 SPR_APC_8_desc: "피라냐 III의 개량형입니다."
 SPR_IFV_1: "파나르 M-3"
 SPR_IFV_1_short: "M-3"
 SPR_IFV_1_desc: "파나르 M-3 차량은 AML 정찰 모델을 장비한 부대를 지원하기 위해 설계되었습니다. 기계 부품의 95%가 AML 모델과 완전히 호환되므로 제작 및 유지 비용을 최소한으로 줄일 수 있습니다. 승무원은 지휘관, 사수, 장전수, 운전수로 구성됩니다. 기본 무장 구성은 M-32 76/60mm 포, 지붕의 M-2 12.70mm 기관총, 그리고 동축 7.62mm 브라우닝 M-1919A4E1입니다."
 SPR_IFV_2: "ENASA-페가소 VEC"
 SPR_IFV_2_short: "VEC"
 SPR_IFV_2_desc: "VEC(스페인어: Vehiculo de Exploracion de Caballería, 기병 정찰 차량)는 BMR을 기반으로 스페인 기업 ENASA-페가소(현 산타 바르바라 시스테마스)가 설계한 장갑차입니다. VEC형은 BMR의 기계 부품 대부분을 유지하면서도 새로운 기능에 맞추기 위해 차체의 형상, 배치 및 내부 환경을 변경했습니다. VEC은 TC-25 포탑에 25mm M-242 부시마스터 기관포 또는 7.62mm MG-42 기관총을 탑재합니다."
 SPR_IFV_3: "ENASA-페가소 VEC-M"
 SPR_IFV_3_short: "VEC-M"
 SPR_IFV_3_desc: "오랜 기간의 집중적인 운용 끝에 VEC-M은 원래 모델에 비해 여러 가지 개량 사항을 포함하고 있습니다. 엔진은 성능이 더 우수한 스카니아 DS9으로 교체되었고, 크게 개선된 또 다른 부분은 차량의 방호력입니다. 차체 장갑은 14.50mm 구경까지의 중기관총으로 인한 피해에 대응할 수 있도록 강화되었습니다. M 시리즈는 주력 전차에 탑재된 것과 매우 유사한 폭발 방지 장비를 포함하며, 여러 센서를 기반으로 내부 폭발을 감지하면 소화 통제 시스템이 작동하도록 합니다."
 SPR_IFV_6: "제너럴 다이내믹스 ASCOD VCI/C 피사로 3단계"
 SPR_IFV_6_short: "VCI/C 피사로 III"
 SPR_IFV_6_desc: "세 번째 개량형인 이 신형 피사로 3단계는 공병 전투 차량(VCZAP)에 사용된 신세대 ASCOD 차체를 휠 전투 차량(VCR) \\"드래곤\\"을 위해 개발된 임무 체계와 결합한 결과물이라는 점에서 주목할 만합니다. VCZAP에 사용된 현대화된 차체는 지뢰와 IED에 대비해 최적화되어 있어 높은 방호력을 제공하며, 탄도 방호력이 높고 대지뢰 좌석을 갖추고 있습니다. 도입된 임무 체계에는 상황 인식, 통신 장비, 무기 체계, 전자 광학 장비 및 항법 체계가 포함됩니다."
 SPR_IFV_8: "제너럴 다이내믹스 산타 바르바라 시스테마스 드라곤"
 SPR_IFV_8_short: "VCR 8x8 드라곤"
 SPR_IFV_8_desc: "피라냐 V 플랫폼을 기반으로 한 드라곤은 스페인군의 요구 사항에 완전히 부합하도록 전면 설계된 장갑 보병 수송 차량입니다. 기본 보병 수송형은 NAVANTIA가 제조하되 ELBIT과 EXPAL 기술이 적용된 UT-30 MK2 원격 조종 포탑을 장비하며, 30mm ATK MK44-ABM 부시마스터 II 기관포로 무장합니다."
