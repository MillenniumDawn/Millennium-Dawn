 SAU_UK_stratgic_friendship_UKOne: "沙特-英国伙伴关系"
 YEM_south_yemen: "南也门"
 SAU_corporate_policy: "公司和劳工政策"
 SAU_corporate_policy_tt: "§H王国如何监管其公司以及允许公司雇用哪些人。§!"
 SAU_corporate_policy_2_tt: "§Y沙特化配额和雇主担保制度不会随着任何一届政府的更迭而消失 - 这些条款在政权更迭后依然有效。§!"
 SAU_shura_rebalanced_tt: "§Y三排长椅全部重置为40个座位§! - 理事会仍存在争议，尚未颁发章程。"
 SAU_shura_charter_ulema: "资深学者委员会"
 SAU_shura_charter_ulema_desc: "议会的宗教部门被写入《基本法》。立法首先要审查其是否符合宪法，其次才是审查其他方面，而学者们只对国王负责。\n\n这个王国更难被撼动，也更难被颠覆。而且，它学习的速度也比邻国慢得多。"
 SAU_shura_charter_technocrats: "规划委员会"
 SAU_shura_charter_technocrats_desc: "该委员会最终成为了其技术官僚们一直主张它应该成为的样子 - 一个由能够解读资产负债表的人员组成的规划机构，对产业和教育政策拥有长期授权。\n\n这个王国现代化的速度比任何人预期的都要快。那些被它停止咨询的人注意到了这一点。"
 SAU_shura_charter_notables: "家庭商会"
 SAU_shura_charter_notables_desc: "大商人和部落家族拥有永久席位，议会成为公开而不是私下谈判王国赞助的房间。\n\n它运行平稳且成本低廉，不会向国家提出任何过分的要求。"
 SAU_events.220.t: "规划者们请求授权"
 SAU_events.220.d: "技术官僚们现在完全掌控了理事会。他们起草了一份提案，旨在使这种情况永久化 - 赋予理事会对工业、教育和预算的常设规划授权，并将理事会的组成写入《基本法》。\n\n国王可以签署该法令，建立一个运转良好的政府；也可以拒绝签署，保留一个他可以随时根据自身意愿重新调整权力结构的议会。"
 SAU_events.220.a: "规划委员会章程。"
 SAU_events.220.b: "理事会的组成由我决定。"
 SAU_events.221.t: "家族陈情"
 SAU_events.221.d: "显贵们占据了议会，他们带着一份由与这个家族谈判了一个世纪的人起草的提案来到国王的议事厅 - 为各大家族提供永久席位，以换取国王一直以来所依赖的平静。\n\n它是最廉价、也是最缺乏雄心的政府。"
 SAU_events.221.a: "为家庭商会制定章程。"
 SAU_events.221.b: "理事会的组成由我决定。"
 SAU_events.222.t: "学者们要求被列入名单"
 SAU_events.222.d: "乌里玛们召开了委员会会议，并希望将其纳入基本法 - 这是一个由资深学者组成的常设机构，对王国通过的每一项法案都拥有第一审权。\n\n这将解决王国一代人的宗教权威问题，使学者们占据上风，而且以后的国王如果心情不好，也无法推翻这一决定。"
 SAU_events.222.a: "制定资深学者委员会章程。"
 SAU_events.222.b: "理事会的组成由我决定。"
 SAU_junta_grip_firm: "委员会的令状生效"
 SAU_junta_grip_firm_desc: "利雅得下达的命令，同一周就在吉赞执行。省长接听电话，安全部门向上级汇报，而不是向下级汇报，没有人会静观其变。\n\n这是由官员组成的政府相对于其前身政府的唯一优势。"
 SAU_junta_grip_uneven: "一份不公平的令状"
 SAU_junta_grip_uneven_desc: "议会妥善治理首都和东部省份，对王国其他地区则大致如此。凡是有监督的地方，指令都会被执行。\n\n维持国家稳定就足够了，改变国家则远远不够。"
 SAU_junta_grip_slipping: "令状止于环路"
 SAU_junta_grip_slipping_desc: "在利雅得以外，委员会的命令被那些盘算着能维持多久的人接收、存档，然后置之不理。驻军指挥官们开始彼此通信，而不是与首都联系。\n\n一个无法被服从的政府还不是已经垮台的政府，但两者之间的区别正变得越来越模糊。"
 SAU_regency_deadline_tt: "§Y五年后将迎来清算时刻§! - 该法令必须予以续期、延期或任其失效。"
 SAU_debug_shura_seat_jump: "§Y技术官僚+30席位§!"
 SAU_debug_shura_seat_jump_desc: "将技术官僚席位推过70个席位的宪章门槛，以便宪章活动得以启动。"
 SAU_debug_corp_readout: "§Y企业政策§!：税[?SAU_corp_tax|%1]移民[?SAU_corp_migration|%1]劳动力[?SAU_corp_civ_workers|%1]外国直接投资[?SAU_corp_fdi_cost|%1]"
 SAU_debug_corp_readout_desc: "读取沙特化程度和雇主担保路径所涉及的企业和劳工政策变量。"
 SAU_debug_junta_control_up: "§Y军政府控制+25§!"
 SAU_debug_junta_control_up_desc: "提高委员会的控制力，以测试控制层级。"
 SAU_debug_junta_control_down: "§Y军政府控制-25§!"
 SAU_debug_junta_control_down_desc: "降低委员会的控制力，以测试撤销令状的惩罚措施。"
 SAU_water_national_company: "国家水务公司"
 SAU_water_national_company_desc: "海水淡化、输配和计费都整合到一个隶属于水利部的国有公用事业公司。该公司在王国真正需要水的地方建设水厂，而不是在利润微薄的地方建设，这既是其优势所在，也是其问题所在。\n\n水被输送到各处。这家公用事业公司永远不会盈利，也从未被要求盈利。"
 SAU_water_foreign_operators: "外国水务运营商"
 SAU_water_foreign_operators_desc: "这些工厂由经验丰富的公司承包建造、运营和维护，其标准是王国自身尚无法达到的。\n\n水质更清洁，每立方米价格也更便宜。合同以美元计价，而专业技术也会随之流失。"
 SAU_events.223.t: "王国简述"
 SAU_events.223.d: "一份关于这个王国如何运作的简要说明，出自那些将不得不治理它的人之手。\n\n§H王国的未来§! - 一种平衡，而非仅仅一个按钮。它随着国策、事件和国王颁布的改革而变动，并决定这个国家对现代化有多大的接受度。你无法将其强行更改，只能予以关注。\n§H石油依赖§! - 0到100的数值，每三个月自动§Y上涨一点§!。多元化决议与国策会将其拉低。贯穿这是整场游戏的长期论题。\n§H企业与劳工政策§! - 在经济国策树中。选择§O沙特化配额§!（雇佣沙特人并对他们征税，失去外籍劳工）或§Y卡法拉自由化§!（廉价劳工与外国资本，代价是税收和本国人的就业）。两者都会影响王国真实的失业数字。\n§H诸议会§! - 协商会议从一开始就存在。安排§O乌理玛§!、§Y技术官僚§!或§G显贵§!入座；主导一方将决定其性质，超过§Y70席§!后，你可以将其永久宪章化。民众会议稍后建立，可供通过法案，并可被否决 - 但要付出代价。\n§H继承§! - 当法赫德去世时，王储们便开始角逐。通过王储决议支持其中一位；国王驾崩时，谁领先谁便登基，而每位都带来自己的统治。§Y宫内只能有一位统治者。§!\n§H军队§! - 军官们对自己应得之物另有算计。任其发展，他们便会据此行动。§R留意不满读数，在为时已晚之前将其平息§! - 政变可以预防，却无法逆转。\n§H阿拉伯之春§! - 若该地区被波及，动荡数值将不断积累。到达临界点时，国王必须抉择：挺过去并承受稳定度流失，还是§R让君主制倒台§!，将国家交给过渡委员会。\n§H阿拉伯共和国§! - 王位并非永恒，有三种§Y王权倾覆道路§!：让军官拿下利雅得并§O宣告共和国§!，实行军事统治；保持王位完整，但§O让沙特王室以外的政党掌权§!，这会从王室路线开启“宣告阿拉伯共和国”；或者让§O阿拉伯之春发展到临界点§!并退位，这将自动为你宣告共和国。§R军事道路会关闭另外两条§! - 一个已经发生过政变的王国无法再选择文官统治路线。\n\n以上一切都在你的决议页面中可见。你无需记忆这里的任何东西 - 一切都写在按钮上。"
 SAU_events.223.a: "明白了。我们开始吧。"
 SAU_tadawul_needs_market_tt: "§R需要将沙特证券交易所列在首位。§! - 完成§H沙特证券交易所§!以及该分支所有国策以提升其层级："
 SAU_trials_of_the_old_order_choice_tt: "§Y接下来会面临一个选择§! - “公开审理，电视直播” - “像以前一样，安排在丽思卡尔顿酒店。” - “按现行价格，赦免。”它动摇了§H军官们对国家的控制以及军政府的合法性§!。"
 SAU_crackdown_on_the_opposition_choice_tt: "§Y接下来会面临一个选择§! - “首先从东部省委员会开始” - “将讲道稿提交审查” - “首先从请愿书签署人开始” - “请将这三个文件一起保存” 。它动摇了§H军官们对国家的控制以及军政府的合法性§!。"
 SAU_water_pride_open_tt: "§Y开放主权水务§! - 从灾难级到凯旋级，共九个等级。它反映的是§H稳定性§!：一个自信的国家相信自来水会供应充足，而一个动荡的国家则不这么认为。它每月都会自行稳定下来。"
 SAU_unif_road_still_open_tt: "§Y委员会尚未转向其他方向。§! - 寻求新的合作伙伴或宣布自治将永久关闭美国的道路。"
 SAU_unif_usa_refused_tt: "§YWashington has not already taken the Gulf under its wing§! - open if you never asked, or if the Americans §Rrefused§!."
 SAU_unif_partners_refused_tt: "§YNo outside partner has taken the Gulf under its wing§! - open if you never asked, or if they §Rrefused§!."
 SAU_unif_not_yet_autonomous_tt: "§YThe Council has not declared its independence§! - going it alone closes this road."
 SAU_unif_no_member_aligned_tt: "§YNo Council member has invited a foreign power in§! - Turkish or Indian bases, Russian advisors, outside security guarantees, arms purchases or foreign procurement all close this road."
 SAU_intel_surveillance_bypass_tt: "§YBypasses the agency's own requirements§! - no §HImproved Computing§! research and no §HForm Department§! upgrade needed"
 SAU_Intelligence_category_desc: "The General Intelligence Presidency (GIP) is the Kingdom's primary intelligence agency, responsible for both domestic and foreign intelligence gathering and analysis. It plays a crucial role in national security, counterterrorism, and strategic planning.\n\n§GUnlocking the GIP§! will allow you to make decisions that enhance your intelligence capabilities, providing valuable insights and advantages in both domestic and international affairs.\n\nA Decisions will Open when you Reach §G70%§! GIP Network Penetration in a Country, and will be more likely to appear the higher your penetration is. They will be unavailable if your penetration falls below 70%."
 SAU_Foregin_affairs_category_desc: "§G Saudi Arabia Foreign Affairs§!\nThe Kingdom's foreign policy is defined by a delicate diplomatic balancing act. As a regional power and the custodian of Islam's holiest sites, we must navigate complex alliances, secure our economic interests, and maintain stability in the Middle East. Whether we align closely with our traditional Western allies, pivot towards emerging Eastern markets, or assert ourselves as an independent regional hegemon, our diplomatic corps will pave the way.\n\n To Open More Decision Related to the Foregin Affairs, you must completed Focuses or get a Speical Event while moving forward\n\n All the Decisions will Show up Again after a year since you selection it."
 SAU_domestic_external_category_desc: "The Kingdom's levers over its home front, its oil, and its future beyond it.\n\n§HHow these decisions appear:§!\n§GDomestic§! measures - construction drives, the development fund and workforce reform - unlock with §Y'Economic Liberalization'§!.\n§GOil§! moves - raising output, new fields, conserving reserves, the oil embargo and the OPEC levers - unlock with §Y'Saudi Aramco'§! and its export doctrine.\n§GDiversification§! projects - PIF investment, giga-projects, renewables, the digital economy, tourism and the defence industry - unlock as you complete the §Y'Vision 2030'§! tree.\n\n§HSome decisions ask more of you:§! a §Ynew oil field§! needs the Aramco production strategy; the §Yoil embargo§! can only be proclaimed §Gin peacetime§! while your oil economy is running. Each costs time and treasury, and most push your §Hoil dependence§! up or down."
 SAU_vision2030_category_desc: "Saudi Arabia's giga-projects, each on its own deadline. Fund and finish them in time to make Vision 2030 a reality. Let the deadlines pass and the projects become costly monuments to ambition, dragging the Vision toward failure.\n\n There will be a Decisions to build each project, each Project have deadline when you hover around the Project, it update weakly if it is 1848, the next update for the Decision deadline will be 1841 (-7days)\n\n if you didn't do the project and deadline ended, it will result in debuff in the 2030 Vision, otherwise when you finished the project it will result in increase the buff instead"
 SAU_military_category_desc: "The long programme to rebuild the Kingdom's armed forces after the shock of §LOperation Desert Storm§! - from a military that needed §LAmerican§! airpower, logistics and command to fight, into a modern force and a true counterweight to §LIran§!.\n\n§HHow it works:§!\nEvery reform is a §Ydecision§! unlocked by a military §Yfocus§!. Each opens a §Gchoice of doctrines§! - and every doctrine is a deliberate §Rtrade-off§!, strengthening the forces one way while costing them another. You may re-run a reform later to §Yswitch doctrine§!.\n\n§HThe three Stages:§!\nReadiness advances in stages - §RUnmodernized§! to §YIn Reform§! to §YModernizing§! to §GModernized§!. Each Stage reveals its own batch of reforms, and you must §Ycomplete all of them§! before the next Stage will open. It all begins by winning the §LWar Games: Lessons of the Gulf§!.\n\nEvery doctrine you choose feeds into the §LThe Saudi Military§! national spirit, where the combined effect is shown."
 SAU_crown_prince_category_desc: "[ROOT.GetSAUSuccessionPanel]"
 SAU_king_abdullah_category_desc: "Abdullah holds the Kingdom from the opening year - regent while Fahd lives, King in his own right from 2005. His death in January 2015 resolves the succession race, and whichever of §YSalman§!, §YMohammed bin Nayef§! or §YMutaib§! gathered the most influence inherits both the throne and his own set of directives. Use the §YCrown Prince§! decisions during his reign to decide which. Each directive occupies the court for §Y60 days§!, and no second directive can be issued until the first has run its course."
 SAU_king_salman_category_desc: "Salman's reign opens a second contest, §YMohammed bin Salman§! against §YMohammed bin Nayef§!, settled in June 2017 - where you may crown the winner at once or leave him Crown Prince. If you wait, he takes the throne when the King's health finally fails, by 2032 at the latest. Watch it in the §YCrown Prince§! tab, and prop him up or wear him down as you please. Each directive occupies the court for §Y60 days§!, and no second directive can be issued until the first has run its course."
 SAU_king_mbs_category_desc: "通过在萨勒曼国王统治时期支持穆罕默德·本·萨勒曼成为王储，然后在2017年直接宣布他为国王，或者等待萨勒曼健康状况恶化，最终达成了这一目标。每项指令都会占用法院§Y60天§!的时间，在第一项指令执行完毕之前，不得发布第二项指令。"
 SAU_king_mbn_category_desc: "有两种途径可以达成：一是让穆罕默德·本·纳伊夫在阿卜杜拉时代的王位继承竞争中领先于萨勒曼和穆塔伊卜；二是让他被册封为萨勒曼国王的王储，并使其寿命超过国王。每项指令都将占用法院§Y60天§!的时间，在第一项指令执行完毕之前，不得发布第二项指令。"
 SAU_king_mutaib_category_desc: "只有彻底击败萨勒曼和穆罕默德·本·纳伊夫 - 这位局外人 - 才能赢得阿卜杜拉时代的王位继承权之争。此后，王位继承不再有任何既定安排。每项指令都会占用法院§Y60天§!的时间，且在第一项指令执行完毕之前，不得发布第二项指令。"
 SAU_faisalite_category_desc: "Faisal ibn Abdulaziz was never an isolationist. He founded the Muslim World League, and when Al-Aqsa burned in 1969 he had the Muslim heads of state assembled at Rabat within weeks - the Organisation of the Islamic Conference was his doing. He opened the treasury to Egypt and Jordan at Khartoum after 1967, fought Nasser's expeditionary army to a standstill in the mountains of Yemen, chartered the Islamic Development Bank, and in 1973 turned the oil itself into a weapon and made the West feel it. Self-reliance was never his destination. It was his means - the strength a Kingdom needed before it could speak for the Ummah without asking anyone's leave.\n\nHis heirs inherit the doctrine without the man, and with it a question he never had to answer. §OIsolationism§! takes self-reliance as its own reward: a sealed frontier, no clients, no crusades, a Kingdom answerable to nobody. §RInterventionism§! takes it as Faisal did - a foundation, laid so that Riyadh may lead the faithful and stand armed between the blocs rather than behind either.\n\n§HWhere the Kingdom stands today§! - [ROOT.GetSAUFaisaliteLean]\n[ROOT.GetSAUFaisaliteLeanEffect]\n\n§HDirectives under way§!: §Y[?SAU_faisalite_active|0]§! of §Y2§!. Two may run at once, from either side, and each pays out only when it has run its course.\n\nFocuses, events and the decisions below all move these counts, and nothing here is bought cheaply. Whichever stands higher when the pillars are raised settles the last of them - §RThe Third Way Doctrine§! or §OSplendid Isolation§!."
 SAU_junta_category_desc: "The Council rules by two things and owns neither outright. §HControl§! is what it can enforce - the garrisons, the checkpoints, the files, the men who answer when called. §HLegitimacy§! is what it is owed, and it is owed nothing: no election, no fatwa, no succession, only the fact that the armour arrived first.\n\nEverything that raises one is paid for out of the other. Legitimacy falls by one every month regardless - a junta that simply governs quietly is a junta running out of time.\n\n§HAt zero, the Council has ninety days to find a reason to exist. If it cannot, the Kingdom will settle the question in the field.§!"
 SAU_officer_crisis_category_desc: "The regular army carried the cost of the crash and the National Guard did not, and the officer corps has worked out which of those facts is deliberate. None of this has to end in tanks on Olaya Street. It ends that way only if nothing is done about it.\n\n§HThe officer corps§! - [ROOT.GetSAUArmyGrievance] (§Y[?SAU_army_grievance|0]§! of §Y100§!)\n[ROOT.GetSAUArmyGrievanceEffect]\n\nGrievance climbs every month on its own. Bring it all the way to §Y0§! and you can settle with the officers permanently; let it pass §Y75§! with the deployment order given and they will settle it themselves."
 SAU_modernisation_balance_of_power_category_desc: "Two visions struggle for the soul of the §LKingdom of Saudi Arabia§!. The §Rtraditionalist§! camp - the §LCouncil of Senior Scholars§!, the §Lroyal court§!, the §Ltribal elders§! - guards the old ways. The §Gliberalisation§! camp - the technocrats, the foreign-trained engineers, the §LVision 2030§! advocates - presses for openness, reform, and a place at the modern world's table. The balance shifts with every focus completed and every decision taken."
 SAU_spread_revolution_category_desc: "The People's Republic of Arabia is only the first spark. The revolution must spread until every Arab worker has thrown off his chains.\n\nThis category unlocks once §YThe People's Republic of Arabia§! is complete and a communist government rules. §YBroadcast the Revolution§! raises communist support inside Arab countries, while §YFound the Arab Comintern§! gathers fellow workers' states. A §YLaunch the Socialist Revolution§! decision stays §Rhidden§! on each Arab country until its communists reach §Y30%§! support, so keep broadcasting until it appears. Once it does, strike: at §Y50%§! or more the revolution seizes the state outright, while §Y30-50%§! ignites a revolutionary civil war. Fellow workers' states are never overthrown, only welcomed into the §YArab Comintern§! through §YInvite to the Arab Comintern§!."
 SAU_pipeline_sabotage_category_desc: "王国的石油通过管道输送出去，其他国家的石油也是如此。\n\n§R攻击竞争对手的防线会同时推高原油价格和该地区的气温§!。"
 SAU_coalition_member_category_desc: "我们响应了利雅得的邀请，我们的飞机也已列入轮换计划。至于这究竟价值几何，以及我们打算为此付出多久，这只有我们自己知道，而且退出的大门并未关闭。"
 SAU_debug_category_desc: "用于测试继承、统治和萨勒曼国王健康系统的测试工具。此类别仅存在于调试版本中 - 在正常启动和多人游戏中不可见。"
 SAU_proxy_aggression_desc: "我们正在资助对他们人民的袭击。他们不会轻易忘记这一点。"
 SAU_traditionalist_bop_left_side_desc: "The §LWahhabi clergy§!, conservative princes, and tribal sheikhs. They preserve the Kingdom's character but resist the changes the world demands."
 SAU_liberalisation_bop_right_side_desc: "The §Ltechnocrats§!, foreign-trained engineers, and reformist princes. They open the Kingdom's doors - at the cost of disturbing the established order."
 SAU_modernisation_bop_centre_range_desc: "传统与改革均未占据主导地位。王国目前保持稳定。"
 SAU_traditionalist_bop_low_range_desc: "神职人员和保守派§Y略占上风§!。王国行事谨慎。"
 SAU_traditionalist_bop_medium_range_desc: "Tradition is the §Hguiding hand§!. Reform proposals are weighed against centuries of precedent - and usually found wanting."
 SAU_traditionalist_bop_advanced_range_desc: "The §LCouncil of Senior Scholars§! sets the agenda. Modernisers are §Ymarginalised§! or §Yexiled§!. The Kingdom looks inward."
 SAU_traditionalist_bop_win_range_desc: "The §Lulema§! rule in all but name. The world calls; the Kingdom does not answer. Tradition has §Rwon§!, and the price is paid in lost decades."
 SAU_liberalisation_bop_low_range_desc: "The reformers have a §Gtoehold§!. New offices, new schools, new ideas trickle through the cracks."
 SAU_liberalisation_bop_medium_range_desc: "The §LCrown Prince§!'s programme is the new orthodoxy. Universities expand, tourism opens, women drive."
 SAU_liberalisation_bop_advanced_range_desc: "Reform piles on reform. The §Lulema§! grumble; the §Ltribes§! grumble; but the §Gpace§! does not slow. The Kingdom is changing faster than its people can metabolise."
 SAU_liberalisation_bop_win_range_desc: "Saudi Arabia is §Gunrecognisable§! from the Kingdom of 2000. Foreign capital, foreign tourism, foreign culture. The reformers have §Gwon§! - but the §Yclerics§! have not forgotten."
 SAU_Monarchy_house_of_al_saud_desc: "沙特家族是沙特阿拉伯王国的统治家族。它由阿卜杜勒阿齐兹·伊本·沙特于1932年创立，此后通过政治联盟、宗教合法性和石油财富带来的经济实力，一直维持着对国家的统治。"
 SAU_Military_Rule_desc: "最高军事委员会统治着王国。王位依然稳固，各部委隶属于其他机构，而那些攻占利雅得的军官们正逐渐发现，守住一个国家远比夺取一个国家要困难得多。"
 SAU_gip_network: "§H情报总局站点网络§!"
 SAU_gip_network_tt: "站点、掩护人员和案件官员 - 总统府的常备能力。\n"
 SAU_gip_slots_cap_tt: "§Y总统职位最多可增设3名官员。§! - 站点已经建成，没有更多站点可以开放了。"
 SAU_stage1_decision_gate_tt: "§Y这项决议在第一阶段开始后可用。§!"
 SAU_stage2_decision_gate_tt: "§Y这项决议在第二阶段开始后可用。§!"
 SAU_stage3_decision_gate_tt: "§Y这项决议在第三阶段开始后可用。§!"
 SAU_vision2030_commitment_tt: "§R王国现在已下定决心：要么完成这些项目，要么就得承受违背承诺的后果。§!"
 SAU_tadawul_matured_tt: "§G沙特证券交易所已达到全面上市状态§! - 该交易所无法再筹集资金，因此此次上市募集的资金转而用于§H购置新的办公楼§!："
 SAU_events.402.t: "搁置竞争"
 SAU_events.402.d: "德黑兰的提议已被接受。大使馆将重新开放，针对伊斯兰共和国的行动将逐步停止，那些称我们为篡位者的神职人员的布道词将被悄悄修改。真主党的枪口将随着其支持者的倒退而转向。敌对关系并未被遗忘 - 但目前已被搁置。"
 SAU_events.402.a: "比友谊更冷漠的和平，但总比另一种选择要好。"
 SAU_accession_to_the_sco: "加入上海合作组织"
 SAU_accession_to_the_sco_desc: "利雅得于2023年成为上海合作组织的对话伙伴。正式成员资格将深化与中国和俄罗斯的关系，但也需要与伊朗加强合作。"
 SAU_the_royal_saudi_air_force: "沙特皇家空军"
 SAU_the_royal_saudi_air_force_desc: "将沙特皇家空军发展成为海湾地区最强大的空军力量。"
 SAU_peace_sun_f_15_eagle_program: "和平之阳：F-15鹰式战斗机项目"
 SAU_peace_sun_f_15_eagle_program_desc: "与美国启动“和平之阳”计划，将F-15“鹰”式战斗机引入沙特阿拉伯王国。"
 SAU_f_15c_d_eagle_squadrons: "F-15C/D“鹰”式战斗机中队"
 SAU_f_15c_d_eagle_squadrons_desc: "部署F-15C/D“鹰”式战斗机中队，以赢得并保持沙特阿拉伯领空的制空权。"
 SAU_f_15s_eagle: "F-15S鹰式"
 SAU_f_15s_eagle_desc: "在和平之阳IX下获得F-15S鹰式战斗机，它能够争夺制空权并进行纵深打击。"
 SAU_tornado_gr4: "狂风GR4"
 SAU_tornado_gr4_desc: "与英国签署的《亚玛玛协议》将使沙特阿拉伯装备“狂风”GR4战斗机。但其打击能力的实现也意味着沙特在培训、零部件供应和维护方面长期依赖英国。"
 SAU_panavia_tornado: "帕那维亚狂风"
 SAU_panavia_tornado_desc: "部署帕那维亚狂风斗机中队执行打击、侦察和防空任务。"
 SAU_the_european_typhoon_al_salam_deal: "欧洲台风：阿尔萨拉姆协议"
 SAU_the_european_typhoon_al_salam_deal_desc: "与阿尔萨拉姆公司签署台风战斗机交易协议，这是一款面向新世纪的现代化多用途战斗机。"
 SAU_f_15sa_advanced_eagle: "F-15SA先进鹰"
 SAU_f_15sa_advanced_eagle_desc: "F-15SA不仅仅是一笔采购。它的航空电子设备、武器和维护需求都需要沙特阿拉伯拥有一个能够确保“先进鹰”战斗机持续飞行的后勤保障基地。"
 SAU_e_3_sentry_awacs: "E-3哨兵预警机"
 SAU_e_3_sentry_awacs_desc: "操作E-3哨兵预警机，观察和控制整个空中态势，并指挥战斗机。"
 SAU_aerial_refueling_fleet: "空中加油机队"
 SAU_aerial_refueling_fleet_desc: "建立一支加油机队，以便沙特战机能够巡逻整个王国并进行远程打击。"
 SAU_c_130_hercules_airlift: "C-130大力神运输机"
 SAU_c_130_hercules_airlift_desc: "扩充C-130大力神运输机队，以便快速向任何地方运送部队和物资。"
 SAU_king_abdulaziz_air_base: "阿卜杜勒阿齐兹国王空军基地"
 SAU_king_abdulaziz_air_base_desc: "在达兰建立阿卜杜勒阿齐兹国王空军基地，以保卫东部省和海湾地区。"
 SAU_king_khalid_air_base: "哈立德国王空军基地"
 SAU_king_khalid_air_base_desc: "在哈米斯穆沙伊特开发哈立德国王空军基地，这是一个防御坚固的南部基地，可以覆盖也门边境。"
 SAU_prince_sultan_air_base: "苏尔坦王子空军基地"
 SAU_prince_sultan_air_base_desc: "在沙特王国腹地中心枢纽阿尔哈吉建立苏尔坦王子空军基地。"
 SAU_precision_guided_munitions: "精确制导弹药"
 SAU_precision_guided_munitions_desc: "储备精确制导炸弹和导弹，一次出击即可摧毁以前需要多次出击才能摧毁的目标。"
 SAU_saudi_uav_program: "沙特无人机项目"
 SAU_saudi_uav_program_desc: "启动沙特阿拉伯无人机项目，用于长时间监视和精确打击。"
 SAU_air_operations_command: "空军作战司令部"
 SAU_air_operations_command_desc: "建立中央空中作战司令部，统一规划和指挥整个空中作战行动。"
 SAU_secure_support_in_the_al_madinah_province: "在麦地那省获得安全支持"
 SAU_secure_support_in_the_al_madinah_province_desc: "麦地那拥有先知清真寺和颇具影响力的宗教机构。争取当地学者的支持将有助于提升委员会的合法性，并减少宗教反对的声音。"
 SAU_the_house_of_al_saud: "沙特王室"
 SAU_the_house_of_al_saud_desc: "阿卜杜勒阿齐兹·伊本·沙特建立了一套继承制度，按照长幼顺序将王位传给他的儿子们。六位国王统治七十年后，剩余的几位符合继承条件的兄弟都已年迈，王国必须为下一代的继承做好准备。"
 SAU_ground_broken_at_rabigh: "拉比格破土动工"
 SAU_ground_broken_at_rabigh_desc: "沙特阿拉伯王国将在拉比格启动一座占地68平方公里的经济城建设，该城计划容纳200万居民，并建成一个重要的红海港口。它是六个旨在吸引私人投资和国家资金投入的经济城中规模最大的一个。"
 SAU_hold_municipal_elections: "举行市政选举"
 SAU_hold_municipal_elections_desc: "21岁以上的男性将选举产生市政委员会一半的席位，其余席位由政府任命。市政委员会对排水、路灯和许可证等公共服务拥有有限的权力，但此次投票确立了一个重要的政治先例。"
 SAU_establish_the_peoples_council: "建立民众会议"
 SAU_establish_the_peoples_council_desc: "王国将设立一个民选委员会，有权就内政事务提出法律建议。国王将保留绝对否决权，但行使否决权将付出明显的政治代价。"
 SAU_securing_our_future: "保障我们的未来"
 SAU_securing_our_future_desc: "王国将通过颁发许可证、指定编辑以及限制敏感话题等方式加强对出版物的控制。这将削弱有组织的反对派，巩固政权，但也会阻碍优秀毕业生回国，并阻止各部委接受客观的批评。"
 SAU_intervention_in_bahrain: "对巴林的干预"
 SAU_intervention_in_bahrain_desc: "2011年3月，应巴林政府请求，半岛之盾部队介入巴林局势，协助平息了麦纳麦的动乱。巴林王国将重申这一承诺，并做好保卫哈里发家族的准备，无需等待下一次海湾合作委员会峰会。"
 SAU_investigate_the_east: "调查东方"
 SAU_investigate_the_east_desc: "卡提夫和阿瓦米耶的抗议活动已从最初的失业和被拘留问题扩大到更广泛的政治诉求。内政部将调查东部省的反对派活动，并对已确定的威胁采取行动。"
 SAU_women_in_the_shura_council: "协商会议中的女性"
 SAU_women_in_the_shura_council_desc: "尽管《基本法》并未禁止任命女性，但迄今为止，尚无女性担任咨询委员会成员。国王可以直接任命女性，但他必须这样做，尽管预计会遭到保守派学者的反对。"
 SAU_the_oil_defense_strategy: "石油防御战略"
 SAU_the_oil_defense_strategy_desc: "沙特阿拉伯王国依赖海湾沿岸少数几个石油设施。一项统一的石油防御战略将协调预算并保护这些设施，同时国家也在寻求替代方案。"
 SAU_national_security_threats: "国家安全威胁"
 SAU_national_security_threats_desc: "沙特阿拉伯国家安全面临四大相互关联的威胁：南部边境战争、圣战分子招募、油田附近什叶派民众的动乱以及伊朗支持的武装组织在沙特边境的活动。政府将拨款设立一个专门机构，负责评估和协调应对这四大威胁的政策。"
 SAU_the_riyadh_meeting_operation_decisive_storm: "利雅得会议：果断风暴行动"
 SAU_the_riyadh_meeting_operation_decisive_storm_desc: "由九个国家组成的联军在利雅得集结，于2015年3月26日发起“果断风暴”行动，将空中作战与海上封锁相结合。尽管熟悉也门冲突的人士发出警告，沙特策划者仍预计这场战役会很快结束。"
 SAU_the_tenth_five_year_plan: "第十个五年计划"
 SAU_the_tenth_five_year_plan_desc: "第十个五年计划设定了非石油经济增长、沙特就业和经济多元化的目标。之前的计划也做出了类似的承诺，但不断下降的外汇储备使得这些目标的落实变得愈发紧迫。"
 SAU_defying_the_ajam: "对抗伊朗"
 SAU_defying_the_ajam_desc: "处决尼姆尔·尼姆尔、焚毁沙特驻德黑兰大使馆以及断绝外交关系，令沙特与伊朗的对抗急剧升级。沙特王国宁愿承受经济和外交上的代价，也不愿做出任何让步。"
 SAU_aramco_ipo: "沙特阿美IPO"
 SAU_aramco_ipo_desc: "沙特阿拉伯于2019年12月在沙特证券交易所发行了旗下沙特阿美公司1.5%的股份，筹集了约250亿美元。此次出售并未达到王储提出的2万亿美元估值，也未实现海外上市，但它仍然是该地区规模最大的国有资产出售。"
 SAU_vision_2030_announced: "2030愿景发布"
 SAU_vision_2030_announced_desc: "“2030愿景”于2016年4月发布，其目标包括建立一个两万亿美元的主权财富基金、减少对石油的依赖、增加私营部门就业以及进行广泛的社会改革。与以往的多元化计划不同，它设定了明确的实现期限。"
 SAU_saudi_israel_normalization_track: "沙特-以色列关系正常化进程"
 SAU_saudi_israel_normalization_track_desc: "沙特阿拉伯与以色列没有条约或大使馆关系，但允许以色列飞机飞越其领空，并保持着秘密的情报联系。利雅得一方面公开要求以色列在巴勒斯坦问题上取得进展，另一方面私下里却以不同的条件讨论关系正常化。"
 SAU_establish_corruption_courts: "设立反腐败法庭"
 SAU_establish_corruption_courts_desc: "王国将设立专门的反腐败法庭和一个常设委员会，对部长和王子拥有管辖权。它们的公信力将取决于它们是否像起诉普通官员一样起诉高级被告。"
 SAU_the_ritz_carlton_purge: "丽思卡尔顿大清洗"
 SAU_the_ritz_carlton_purge_desc: "反腐行动在丽思卡尔顿酒店拘留了约两百名王子和商人，并追回了大量资产。此次行动也巩固了王储对王室的权威。"
 SAU_backdoor_deals: "幕后交易"
 SAU_backdoor_deals_desc: "丽思卡尔顿酒店案的涉案人员将在私下协商达成财务和解后获释，而非经过公开审判。虽然这种方式可以迅速追回资产，但缺乏透明的诉讼程序将损害公众对法治的信心。"
 SAU_a_new_kingdom: "新的王国"
 SAU_a_new_kingdom_desc: "在法赫德去世前的十年间，阿卜杜拉一直以法赫德的名义执政。他的继位并未改变宪政秩序，但赋予了他直接权力来实施他此前仅提出过的政策。"
 SAU_consolidating_the_crown: "巩固王权"
 SAU_consolidating_the_crown_desc: "一项皇家法令将设立效忠委员会，由阿卜杜勒阿齐兹的子孙组成，负责确认王储并评估国王的适任性。这将确立首部成文的继承程序，但该委员会对国王的约束力仍有待商榷。"
 SAU_scholarship_programs_abroad: "海外奖学金项目"
 SAU_scholarship_programs_abroad_desc: "该奖学金项目将资助数万名沙特学生及其家人出国留学。这不仅将扩大沙特王国的技术人才队伍，还能让学生接触到与沙特阿拉伯不同的政治和社会体系。"
 SAU_expand_the_national_guard: "扩大国民警卫队规模"
 SAU_expand_the_national_guard_desc: "国民警卫队由历史上效忠于阿卜杜勒阿齐兹的部落成员组成，独立于正规军指挥系统之外运作。扩充国民警卫队能够保护王位，并防止正规军官团控制王国境内的所有武装力量。"
 SAU_joining_the_wto: "加入世贸组织"
 SAU_joining_the_wto_desc: "经过十二年的谈判，沙特阿拉伯王国将通过实施具有约束力的关税、开放服务业、接纳外国银行和保险公司以及修订商法等措施加入世贸组织。加入世贸组织虽然会限制沙特阿拉伯的部分商业自主权，但使其在石油出口管理体系中拥有发言权。"
 SAU_al_saud_national_dialogue: "全国对话"
 SAU_al_saud_national_dialogue_desc: "全国对话汇聚什叶派神职人员、萨拉菲派学者、男女人士，共同探讨国家议题，并将结论汇报给国王。它不具备立法权，但却允许开展异常广泛的公开辩论。"
 SAU_counter_terrorism_cooperation: "反恐合作"
 SAU_counter_terrorism_cooperation_desc: "2003年的爆炸案表明，基地组织不仅将目标对准沙特阿拉伯境内的美国人，也针对沙特阿拉伯政府。沙特阿拉伯将与美国情报部门密切合作，采取突袭、建立监视名单、开展金融调查以及实施武装分子改造计划等措施予以回应。"
 SAU_the_atlantic_realignment: "大西洋重组"
 SAU_the_atlantic_realignment_desc: "该委员会将强调沙特石油出口在新政府领导下将继续进行，以此寻求华盛顿的认可和支持。这将考验美国是否更看重与沙特国家的关系，而非与已被推翻的君主制的关系。"
 SAU_foreign_water_operators: "外国水务运营商"
 SAU_foreign_water_operators_desc: "海水淡化项目已进行国际招标。这些工厂的建设速度远超王国以往任何独立建设的项目，而工厂的运营者则向海外总部汇报工作。\n\n§G允许外国水务运营商§!进入沙特阿拉伯王国，并在§Y一定程度上缓解了该国的水危机§!，但代价是§R美国在沙特阿拉伯王国的影响力下降§!。\n\n高效，随时待命。"
 SAU_among_the_major_powers: "在列强之间"
 SAU_among_the_major_powers_desc: "石油使沙特王国不可或缺，但不可或缺并不等同于安全。沙特需要将目光投向区域之外、塑造世界秩序的强权，并决定它将依靠哪一方。"
 SAU_anti_iranian_propaganda: "反伊朗宣传"
 SAU_anti_iranian_propaganda_desc: "沙特阿拉伯王国将利用其媒体网络批评伊朗伊斯兰共和国，并争取逊尼派支持以对抗伊朗的影响。"
 SAU_appoint_loyalists_in_the_provinces: "在各省任命效忠派人士"
 SAU_appoint_loyalists_in_the_provinces_desc: "新政府将以忠诚的现役军官取代皇家地方总督。这将削弱王室权力的重要来源，并将各省置于军方控制之下。"
 SAU_unity_freedom_socialism: "团结、自由、社会主义"
 SAU_unity_freedom_socialism_desc: "复兴党的三句话成为国家的法律：阿拉伯民族的团结、摆脱殖民者的统治、人民的社会主义。"
 SAU_cells_across_the_arab_world: "阿拉伯世界的细胞"
 SAU_cells_across_the_arab_world_desc: "该党将在阿拉伯国家的首都建立复兴党支部，以组织和支持未来的革命。"
 SAU_the_sword_of_unity: "团结之剑"
 SAU_the_sword_of_unity_desc: "拒绝自愿结盟的阿拉伯国家将被强行纳入新秩序。"
 SAU_purge_the_reactionaries: "清除反动派"
 SAU_purge_the_reactionaries_desc: "革命政府将清除保皇党人、伊斯兰主义者和威胁复兴党统治的外国代理人。"
 SAU_the_united_arab_republic: "阿拉伯联合共和国"
 SAU_the_united_arab_republic_desc: "阿拉伯诸国将统一为一个革命国家，称为阿拉伯联合共和国。"
 SAU_one_arab_nation: "一个阿拉伯国家"
 SAU_one_arab_nation_desc: "抹去赛克斯和皮科划定的边界，让一代人明白，只有一个阿拉伯国家，肩负着永恒的使命。"
 SAU_the_vanguard_of_the_arabs: "阿拉伯先锋队"
 SAU_the_vanguard_of_the_arabs_desc: "阿拉伯将宣称领导从大西洋到海湾的阿拉伯世界，并引领更广泛的民族主义运动。"
 SAU_expel_the_imperialists: "驱逐帝国主义者"
 SAU_expel_the_imperialists_desc: "将阿拉伯土地上最后的外国基地和顾问驱逐出去，撕毁殖民时代的不平等条约。"
 SAU_industrialize_the_nation: "实现国家工业化"
 SAU_industrialize_the_nation_desc: "国家工业计划将建设钢铁​​厂、水坝和工厂，以便共和国能够生产自己的必需品和武器。"
 SAU_the_revolutionary_command_council: "革命指挥委员会"
 SAU_the_revolutionary_command_council_desc: "将最高权力赋予党的领导人委员会，将党和国家融为一体，形成一个革命意志。"
 SAU_pan_arab_solidarity: "泛阿拉伯团结"
 SAU_pan_arab_solidarity_desc: "声援从巴勒斯坦到马格里布的每一场阿拉伯斗争，让阿拉伯成为民族主义事业的庇护者。"
 SAU_build_the_party: "组建政党"
 SAU_build_the_party_desc: "革命将组织一个纪律严明的政党，其基层组织从乡村一直延伸到国家领导层。"
 SAU_arab_republic_secular_republic: "世俗共和国"
 SAU_arab_republic_secular_republic_desc: "将清真寺与国家分离，以阿拉伯身份而非教派来团结国家，使逊尼派和什叶派、穆斯林和基督徒团结一致。"
 SAU_the_arab_socialist_path: "阿拉伯社会主义之路"
 SAU_the_arab_socialist_path_desc: "摒弃资本主义和苏联共产主义，建立独特的阿拉伯社会主义：制高点掌握在人民手中，小商贩享有自由。"
 SAU_nationalize_the_heights: "将高地国有化"
 SAU_nationalize_the_heights_desc: "从外国特许权持有者和老牌家族手中夺取石油、银行和大型企业，并将他们的财富归国家所有。"
 SAU_land_to_the_peasants: "土地归农民"
 SAU_land_to_the_peasants_desc: "打破大庄园的统治，将土地分给耕种的农民，结束封建对乡村的控制。"
 SAU_the_officer_corps: "军官团"
 SAU_the_officer_corps_desc: "该党将招募年轻军官，并利用军队来宣扬和推行复兴党教义。"
 SAU_arm_the_vanguard: "武装先锋队"
 SAU_arm_the_vanguard_desc: "在正规军之外，还将建立一支政治上可靠的党民兵队伍。"
 SAU_forge_the_national_army: "组建国民军"
 SAU_forge_the_national_army_desc: "建立一支配得上阿拉伯民族的现代化机械化军队，并能够将革命带到我们的国界之外。"
 SAU_saudi_aramco: "沙特阿美"
 SAU_saudi_aramco_desc: "§Y沙特阿拉伯石油公司§!是全球最大的石油企业，也是沙特阿拉伯王国的经济支柱。该部门逐个油田地建设石油部门，然后让沙特阿美公司奉行§Y战略方针§! - §Y多开采、多提炼或出口以实现最大收益§! - 所有这些都归于§Y沙特阿美§!国家精神。"
 SAU_arm_the_anti_iranian_groups: "武装反伊朗团体"
 SAU_arm_the_anti_iranian_groups_desc: "沙特阿拉伯王国将武装伊朗俾路支人和阿拉伯少数民族中的反政府武装，将冲突扩大到伊朗境内。"
 SAU_the_saudi_armed_forces: "沙特阿拉伯武装力量"
 SAU_the_saudi_armed_forces_desc: "将王国的陆军、海军和空军统一起来，并使其现代化，成为一支统一的专业军队。"
 SAU_lessons_of_the_gulf_war: "海湾战争的教训"
 SAU_lessons_of_the_gulf_war_desc: "1990年，萨达姆的伊拉克军队占领了科威特，并在我们边境集结兵力；幸亏外国联军出手相救，沙特王国才得以保全，而哈夫吉战役正是在沙特领土上打响的。“沙漠风暴”行动彻底暴露了我们对其他国家的依赖 - 这种情况绝不能重演。"
 SAU_ministry_of_defence_and_aviation: "国防部和航空部"
 SAU_ministry_of_defence_and_aviation_desc: "将国防和航空部改组为一个能够规划、预算和指挥所有武装部队的现代化指挥机构。"
 SAU_the_general_staff: "总参谋部"
 SAU_the_general_staff_desc: "建立一支专业的总参谋部队伍，负责制定作战计划、组织演习和指挥作战行动。"
 SAU_the_royal_saudi_land_forces: "沙特武装部队"
 SAU_the_royal_saudi_land_forces_desc: "将王国的陆军、海军和空军统一起来，并使其现代化，成为一支统一的专业军队。"
 SAU_saudi_arabian_national_guard: "沙特阿拉伯国民警卫队"
 SAU_saudi_arabian_national_guard_desc: "扩充沙特阿拉伯国民警卫队，这支效忠于王室的部落武装负责保卫王室和圣城。"
 SAU_king_abdulaziz_royal_guard: "阿卜杜勒阿齐兹国王皇家卫队"
 SAU_king_abdulaziz_royal_guard_desc: "加强皇家卫队，这支精锐部队誓死保卫国王的人身安全。"
 SAU_m1a2_abrams_main_battle_tank: "M1A2艾布拉姆斯主战坦克"
 SAU_m1a2_abrams_main_battle_tank_desc: "采购美国M1A2艾布拉姆斯主战坦克，它是该地区最重、性能最强的坦克，也是沙特阿拉伯装甲部队的中坚力量。"
 SAU_armored_brigades: "装甲旅"
 SAU_armored_brigades_desc: "组建并装备重型装甲旅，以便在开阔的沙漠中进行决定性的机动作战。"
 SAU_mechanized_infantry: "机械化步兵"
 SAU_mechanized_infantry_desc: "组建机械化步兵，守住阵地，支援装甲矛头部队。"
 SAU_m109_self_propelled_artillery: "M109自行火炮"
 SAU_m109_self_propelled_artillery_desc: "部署M109自行榴弹炮，为各师提供机动、防护的火力支援。"
 SAU_astros_ii_rocket_artillery: "阿斯特罗斯II火箭炮"
 SAU_astros_ii_rocket_artillery_desc: "采购巴西的阿斯特罗斯II多管火箭发射系统，用于大规模远程轰炸。"
 SAU_royal_saudi_strategic_missile_force: "沙特皇家战略导弹部队"
 SAU_royal_saudi_strategic_missile_force_desc: "将战略导弹部队设立为一个独立的军种，作为王国的战略威慑力量。"
 SAU_df_3_ballistic_missiles: "东风-3弹道导弹"
 SAU_df_3_ballistic_missiles_desc: "1988年利雅得秘密购买中国东风-3导弹，使其拥有了任何邻国首都都无法忽视的战略影响力。必须建立一支能够维持这种威慑力的部队。"
 SAU_army_aviation_and_apache_gunships: "陆军航空兵和阿帕奇武装直升机"
 SAU_army_aviation_and_apache_gunships_desc: "组建陆军航空司令部，并为陆军航空兵采购AH-64阿帕奇武装直升机，这是一款反坦克武器。"
 SAU_special_forces_command: "特种部队指挥部"
 SAU_special_forces_command_desc: "组建一支特种部队司令部，用于在敌后进行突袭、反恐和侦察。"
 SAU_roll_back_iran_in_the_gulf: "遏制伊朗在海湾地区的影响力"
 SAU_roll_back_iran_in_the_gulf_desc: "伊朗利用政治和民兵网络扩大其在巴林、伊拉克以及海湾沿岸其他地区的影响力。沙特阿拉伯王国将支持能够削弱伊朗影响力的当地政府和派别。"
 SAU_the_basra_grid_connection: "巴士拉电网连接"
 SAU_the_basra_grid_connection_desc: "伊拉克南部酷热难耐，却饱受停电之苦，只能依靠伊朗电力供应。应该将巴士拉接入海湾电网，用沙特阿拉伯的电力取代伊朗的电力。"
 SAU_counter_iranian_influence: "对抗伊朗的影响"
 SAU_counter_iranian_influence_desc: "伊朗的民兵和资金涌入了萨达姆政权垮台后留下的权力真空。开始漫长的斗争，将伊拉克从伊朗伊斯兰共和国的控制下解放出来。"
 SAU_buy_the_iraqi_parliament: "收买伊拉克议会"
 SAU_buy_the_iraqi_parliament_desc: "沙特阿拉伯王国将利用财政支持来争取伊拉克议会各党派和部长们的支持。其目标是使巴格达远离德黑兰，转向利雅得。"
 SAU_chinese_mediation: "中国调解"
 SAU_chinese_mediation_desc: "中国是沙特阿拉伯和伊朗的重要客户，并已提出在两国之间进行调解。接受这一角色或许能够稳定两国关系，但并不能解决更广泛的战略竞争。"
 SAU_the_agrarian_revolution: "农业革命"
 SAU_the_agrarian_revolution_desc: "农村的改造已经完成，其剩余产品供应城市和革命。"
 SAU_collectivization: "集体化"
 SAU_collectivization_desc: "私人农场合并成庞大的集体，共同耕作，并按照计划行事。"
 SAU_dictatorship_of_the_proletariat: "无产阶级专政"
 SAU_dictatorship_of_the_proletariat_desc: "权力集中在工人阶级手中，由一个不容任何反对的革命政党掌控。"
 SAU_ignite_the_gulf: "点燃海湾"
 SAU_ignite_the_gulf_desc: "工人国家将向海湾君主国的革命运动提供代理人和武器。"
 SAU_land_to_the_fellahin: "土地归费拉欣人"
 SAU_land_to_the_fellahin_desc: "大庄园被分割，分给耕种的农民。"
 SAU_embrace_moscow: "拥抱莫斯科"
 SAU_embrace_moscow_desc: "阿拉伯国家将与苏联集团结盟，用石油换取武器和政治支持。"
 SAU_nationalize_the_oil_fields: "将油田国有化"
 SAU_nationalize_the_oil_fields_desc: "沙土之下的财富属于人民，而非王公贵族。沙特阿美公司已被接管，并置于工人控制之下。"
 SAU_the_new_arab_man: "新阿拉伯人"
 SAU_the_new_arab_man_desc: "一种新的革命文化正在形成，它扫除了旧秩序的迷信和等级制度。"
 SAU_the_non_aligned_road: "不结盟之路"
 SAU_the_non_aligned_road_desc: "阿拉伯制定了独立的道路，领导不结盟国家反对帝国主义和苏联的统治。"
 SAU_soviets_of_the_oil_workers: "苏维埃石油工人"
 SAU_soviets_of_the_oil_workers_desc: "民选的工人委员会将管理油田，并成为无产阶级国家的中央机构。"
 SAU_toward_pan_arab_union: "迈向泛阿拉伯联盟"
 SAU_toward_pan_arab_union_desc: "这场革命向外扩展，寻求与其他进步的阿拉伯国家联合。"
 SAU_the_peoples_republic_of_arabia: "阿拉伯人民共和国"
 SAU_the_peoples_republic_of_arabia_desc: "临时秩序让位于一个完全建立的工人国家：阿拉伯人民共和国。"
 SAU_progressive_islam: "进步伊斯兰"
 SAU_progressive_islam_desc: "该党没有摧毁伊斯兰教，而是招募进步的宗教人士来宣扬与伊斯兰教相容的社会主义。"
 SAU_a_proletarian_nation: "无产阶级国家"
 SAU_a_proletarian_nation_desc: "阿拉伯将通过工人和劳动来定义民族认同，而不是通过部落归属或对君主制的忠诚。"
 SAU_form_the_red_guard: "组建赤卫队"
 SAU_regularize_the_red_guard: "赤卫队正规化"
 SAU_regularize_the_red_guard_desc: "将革命民兵锻造成一支专业的红军，配备标准化的装备、训练有素的军官和武装他们的军工产业。"
 SAU_the_peoples_militia: "人民民兵"
 SAU_the_peoples_militia_desc: "让革命掌握在人民手中，武装每一个工人和农民，让他们成为保卫共和国的民兵。"
 SAU_form_the_red_guard_desc: "一支由石油工人和城市贫民组成的革命民兵，宣誓捍卫革命。"
 SAU_rural_literacy_brigades: "农村扫盲队"
 SAU_rural_literacy_brigades_desc: "干部们分散到全国各地，教授阅读、写作和革命理论。"
 SAU_state_atheism: "国家无神论"
 SAU_state_atheism_desc: "宗教被斥为麻醉民众的鸦片。神职人员被剥夺权力，清真寺也陷入沉寂。"
 SAU_state_industrialization: "国家工业化"
 SAU_state_industrialization_desc: "政府将利用加速推进的国家计划，在阿拉伯各地建设钢铁厂、水坝和工厂。"
 SAU_vanguard_of_the_region: "地区先锋"
 SAU_vanguard_of_the_region_desc: "阿拉伯将自己定位为整个阿拉伯世界和海湾地区革命的先锋。"
 SAU_womens_emancipation: "妇女解放"
 SAU_womens_emancipation_desc: "女性将以法律和政治上的平等地位进入劳动力市场和政党，结束旧秩序对她们参与的限制。"
 SAU_a_strategic_partnership_with_china: "与中国的战略伙伴关系"
 SAU_a_strategic_partnership_with_china_desc: "选择北京而非华盛顿作为王国的主要大国伙伴。中国的资金和武器无需说教，但也失去了以往美国的保证。"
 SAU_conscript_the_kingdom: "王国征召令"
 SAU_conscript_the_kingdom_desc: "王国历来依靠来自可靠部落的志愿者而非征兵制。为了增加可用人力，议会将承担组建大规模军队所带来的政治风险。"
 SAU_oil_for_security: "石油换安全"
 SAU_oil_for_security_desc: "这项交易由来已久，可以追溯到昆西号航母上的那次会晤：沙特原油维持着美国经济的运转，而美国的武器则保障着沙特王国的安全。深化支撑沙特王国的石油美元伙伴关系。"
 SAU_cooperation_with_the_east: "与东方合作"
 SAU_cooperation_with_the_east_desc: "世界经济重心正向亚洲转移，而亚洲对石油的需求也十分旺盛。王国应向东方新兴强国敞开大门，以抵御西方的不可靠。"
 SAU_cooperation_with_the_west: "与西方合作"
 SAU_cooperation_with_the_west_desc: "自阿卜杜勒阿齐兹国王时代起，华盛顿及其盟友就一直保障着海湾地区的安全。他们让沙特阿拉伯牢牢地站在西方阵营，用世界石油换取世界的安全保障。"
 SAU_engage_the_new_baghdad: "与新巴格达接触"
 SAU_engage_the_new_baghdad_desc: "巴格达成立了一个新的政府，由什叶派领导，并受到德黑兰的拉拢。该政府致力于消除旧怨，将新生的伊拉克拉入阿拉伯世界的怀抱。"
 SAU_counter_the_baathist_remnant: "对抗复兴党残余势力"
 SAU_counter_the_baathist_remnant_desc: "无论萨达姆倒台还是仅仅衰落，复兴党仍然是伊拉克的一股暗流。必须阻止旧政权的顽固分子重返权力中心。"
 SAU_declare_the_republic_of_arabia: "宣告阿拉伯共和国"
 SAU_declare_the_republic_of_arabia_desc: "君主制已经覆灭，临时委员会以人民的名义掌握权力。如今，旧王国彻底解体，一个新的国家宣告成立：阿拉伯共和国，它建立在公民的意志之上，而非王朝的血统之上。"
 SAU_the_defense_industries_act: "国防工业法"
 SAU_the_defense_industries_act_desc: "沙特阿拉伯长期以来依赖进口武器和外国零部件。《国防工业法》要求尽可能在国内生产，必要时进行授权生产，尽管这会增加成本并降低短期效率。"
 SAU_disband_the_national_guard: "解散国民警卫队"
 SAU_disband_the_national_guard_desc: "国民警卫队由忠诚的部落组成，旨在保护王室免受正规军的侵扰。议会将解散其下属部队，并将其人员纳入正规军，从而消除君主制的独立军事力量。"
 SAU_the_economy_under_military_order: "军事秩序下的经济"
 SAU_the_economy_under_military_order_desc: "军官们将接管沙特阿美、沙特基础工业公司、港口和主要承包商。石油作业可在现有工程师的领导下继续进行，但军事管理可能会降低其他经济领域的效率。"
 SAU_emergency_tribunal: "紧急法庭"
 SAU_emergency_tribunal_desc: "法庭由军事当局召集，开庭审理，不得上诉，审理普通法庭从未获得管辖权的罪行。就诉讼程序的形式而不是判决咨询乌里玛。"
 SAU_energy_subsidies_for_jordan: "约旦能源补贴"
 SAU_energy_subsidies_for_jordan_desc: "约旦自身没有石油资源，市场每一次波动都会对其造成影响。因此，要让约旦依赖沙特阿拉伯的慷慨解囊，提供廉价燃料和折扣原油。"
 SAU_aid_sudan: "援助苏丹"
 SAU_aid_sudan_desc: "喀土穆需要资金，但德黑兰并未提供。沙特的援助或许能缓和伊朗的压力，但也使利雅得与一个已被西方制裁孤立的政府捆绑在一起。"
 SAU_side_with_algeria: "支持阿尔及利亚"
 SAU_side_with_algeria_desc: "利雅得无法同时以同样的热情拉拢阿尔及尔和拉巴特，因为两国之间的敌对关系正在分裂马格里布地区。阿尔及利亚拥有打击伊斯兰叛乱的宝贵经验，但选择阿尔及利亚意味着与摩洛哥这个君主制国家的关系将会降温。"
 SAU_back_the_brotherhood: "支持兄弟会"
 SAU_back_the_brotherhood_desc: "埃及既是穆斯林兄弟会的发源地，也是阿拉伯世界的中心。支持该运动将为利雅得在海外建立一个颇受欢迎的伊斯兰主义网络，但也可能引发与那些惧怕穆斯林兄弟会在选举中获胜的政府之间的摩擦。"
 SAU_back_the_strongman: "支持强人"
 SAU_back_the_strongman_desc: "埃及将军们承诺维护秩序，敌视穆斯林兄弟会，并建立一个足以在阿拉伯世界占据中心地位的强大国家。沙特的资金可以维持这种秩序，并确保开罗与利雅得保持一致。"
 SAU_befriend_the_turks: "与土耳其交好"
 SAU_befriend_the_turks_desc: "[befriend_the_turks_description]"
 SAU_contain_the_turks: "遏制土耳其"
 SAU_contain_the_turks_desc: "我们绝不能允许土耳其在中东追求其利益。[TUR.GetLeader]对政治伊斯兰的支持有可能壮大一个危险的民粹主义运动，该运动可能会试图推翻我们的政府。"
 SAU_influence_muslim_europe: "影响欧洲穆斯林"
 SAU_influence_muslim_europe_desc: "巴尔干地区的穆斯林社群鲜少关注利雅得。然而，奖学金、清真寺和慈善网络可以将共同的信仰转化为沙特阿拉伯在欧洲的持久影响力。"
 SAU_influence_north_africa: "影响北非"
 SAU_influence_north_africa_desc: "马格里布地区更多地将目光投向北方的欧洲和南方的非洲，而非东方的利雅得。沙特的资金和外交手段或许能够改变这种现状，但其任何举动都会加剧阿尔及利亚和摩洛哥之间的竞争。"
 SAU_side_with_morocco: "支持摩洛哥"
 SAU_side_with_morocco_desc: "摩洛哥与阿尔及利亚王国一样，都希望维护君主制统治并限制阿尔及利亚的影响力。支持拉巴特固然能巩固其天然盟友的地位，但也意味着与阿尔及尔的合作渠道受阻。"
 SAU_sanction_sudan: "制裁苏丹"
 SAU_sanction_sudan_desc: "[SUD.GetLeader]的领导层一直饱受国际争议。在他的统治下，苏丹被指控为支持恐怖主义的国家，也是严重侵犯人权的国家。西方国家随后对这个流氓国家实施了制裁，我们应该效仿这一做法。"
 SAU_sanction_turkey: "制裁土耳其"
 SAU_sanction_turkey_desc: "尽管我们发出警告，土耳其仍继续干涉阿拉伯世界。我们别无选择，只能采取强制措施，阻止土耳其进一步推进其帝国主义野心。"
 SAU_security_guarantees: "安全保障"
 SAU_security_guarantees_desc: "如果与安卡​​拉的密切关系在危机中消失，那么这种关系就毫无价值。相互担保可以将土耳其和沙特阿拉伯的安全紧密联系在一起，并警告任何敌人，攻击其中一方就意味着同时面对双方。"
 SAU_turkish_bases: "土耳其基地"
 SAU_turkish_bases_desc: "允许土耳其使用军事设施将使安卡拉有直接理由保护沙特王国。同时，这也将使一个地区竞争对手在沙特领土上获得立足点。"
 SAU_libyan_arms_shipments: "利比亚武器运输"
 SAU_libyan_arms_shipments_desc: "利比亚四分五裂的局势已沦为外国武器和资金的拍卖场。随着西方列强撤退，沙特阿拉伯的援助物资可以收买一个友好派系，并在争夺其石油和港口的斗争中占据一席之地。"
 SAU_the_faisalite_resurgence: "费萨尔复兴"
 SAU_the_faisalite_resurgence_desc: "费萨尔纲领在沉寂一代人之后重现江湖。它倡导节俭、自力更生，并建立一个代表穆斯林社群而非依赖华盛顿的王国。"
 SAU_centralization_of_the_provincial_emirates: "省级酋长国的集中化"
 SAU_centralization_of_the_provincial_emirates_desc: "自建国以来，各省埃米尔一直将各自领地视为私人领地进行管理。利雅得方面会收回旧宪章，并颁布新的宪章 - 新宪章期限更短、可撤销，且由国王签署。"
 SAU_the_sovereign_civil_service: "主权公务员"
 SAU_the_sovereign_civil_service_desc: "公务员系统将通过任命考试和服务记录来晋升。这将减少家庭关系对政府就业的影响。"
 SAU_reorganization_of_the_majlis_ash_shura: "协商会议重组"
 SAU_reorganization_of_the_majlis_ash_shura_desc: "米特卜将扩大并重组协商会议，使其能够参与实质性的政府事务。协商会议仍将隶属于国王，但其咨询和行政职能将更加明确。"
 SAU_the_national_cadre_initiative: "国家干部计划"
 SAU_the_national_cadre_initiative_desc: "沙特王国将培训沙特公民，以取代外国劳工从事具有战略意义的重要职业。短期内，随着本国劳动力积累经验，效率可能会有所下降。"
 SAU_the_fortress_kingdom: "堡垒王国"
 SAU_the_fortress_kingdom_desc: "费萨尔政府巩固了其机构，清除了反对派，并减少了外国影响。王国现在必须决定，这种自治权是会助长孤立主义，还是会促使其采取更加积极的独立政策。"
 SAU_the_spirit_of_73: "73精神"
 SAU_the_spirit_of_73_desc: "1973年的石油禁运表明，沙特阿拉伯的生产政策能够影响西方政府。沙特王国将考虑利用这种影响力来争取进一步的政治让步。"
 SAU_the_international_forums_question: "国际论坛问题"
 SAU_the_international_forums_question_desc: "王国必须决定是通过联合国和国际货币基金组织等机构来维护自身利益，还是退出一个它在规则制定中几乎没有发言权的体系。"
 SAU_the_superpower_engagement_question: "超级大国参与问题"
 SAU_the_superpower_engagement_question_desc: "两大超级大国集团都寻求与沙特阿拉伯结盟。利雅得既可以保持独立，同时从两国购买武器，也可以通过发展国内武器生产来降低对两国的依赖。"
 SAU_eradicate_foreign_dependency: "消除对外国的依赖"
 SAU_eradicate_foreign_dependency_desc: "王国将对必需品进口的依赖视为战略弱点。因此，即使进口商品价格更低，国内替代也将优先考虑。"
 SAU_the_foreign_wealth_question: "外国财富问题"
 SAU_the_foreign_wealth_question_desc: "沙特阿拉伯在西方银行和政府债券中持有数千亿美元的资产。将这些财富汇回国内可以降低其对外杠杆，但将其留在国外仍然更安全、更有利可图。"
 SAU_increase_the_ulemas_authority: "提升乌里玛的权威"
 SAU_increase_the_ulemas_authority_desc: "学者们重返他们之前被悄悄逐出的议会。费萨尔统治时期，乌里玛们一直辅佐在他身边，他的继承人也不会否认这一点。"
 SAU_the_domestic_supply_quota: "国内供应配额"
 SAU_the_domestic_supply_quota_desc: "每个部委、承包商和炼油厂都将被要求采购一定比例的沙特制造产品。国产产品初期价格可能更高、性能可能更差，但这些配额将有助于提升国家产能。"
 SAU_the_sovereign_aid_question: "主权援助问题"
 SAU_the_sovereign_aid_question_desc: "沙特提供的援助既可以作为对穆斯林社区的无条件支持，也可以用于换取政治让步。沙特王国必须决定，其援助的指导原则究竟是宗教团结还是战略影响力。"
 SAU_islamic_solidarity_conference: "伊斯兰团结会议"
 SAU_islamic_solidarity_conference_desc: "利雅得将召开伊斯兰团结会议并承担会议经费。此次会议将重拾费萨尔利用沙特资助的机构协调穆斯林世界的做法。"
 SAU_the_expatriate_workforce_question: "外籍劳动力问题"
 SAU_the_expatriate_workforce_question_desc: "九百万外籍劳工支撑着沙特经济，但这与费萨尔派追求国家自力更生的目标相冲突。减少他们的贡献会造成经济损失，而保留他们则会限制沙特化进程。"
 SAU_reclaim_the_oic_leadership: "重夺伊斯兰合作组织领导权"
 SAU_reclaim_the_oic_leadership_desc: "伊斯兰合作组织总部设在吉达。利雅得将利用其资金和东道国地位，更积极地引导该组织的议程。"
 SAU_the_global_ummah_question: "全球穆斯林共同体问题"
 SAU_the_global_ummah_question_desc: "沙特阿拉伯王国对两圣寺的控制使其在世界穆斯林中拥有独特的领导地位。它必须决定是否将这种地位转化为对全球穆斯林共同体的积极责任。"
 SAU_splendid_isolation: "绝妙的隔离"
 SAU_splendid_isolation_desc: "王国将退出集团、客户关系和对外战争。它将集中精力保卫边境、维护信仰和管理石油资源。"
 SAU_the_virtue_committees_return: "美德委员会回归"
 SAU_the_virtue_committees_return_desc: "弘扬德行、惩恶扬善委员会重新夺回了失去的街道。他们的巡逻队再次出现在人们的视野中，他们所传递的信息也再次响起。"
 SAU_the_third_way_doctrine: "第三道路理论"
 SAU_the_third_way_doctrine_desc: "沙特阿拉伯王国将拒绝与华盛顿和莫斯科结盟，并组建一个以利雅得为首的独立穆斯林国家集团。该集团将依靠自身武器生产，并只对伊斯兰世界负责。"
 SAU_ban_foreign_media: "禁止外国媒体"
 SAU_ban_foreign_media_desc: "卫星天线被拆除，新闻机构关闭，王国的新闻都由王国自己撰写。世界对沙特阿拉伯的评价不再是国内事务。"
 SAU_the_closed_frontier: "封闭的边境"
 SAU_the_closed_frontier_desc: "签证收紧，合同到期，外籍人士的住所开始空置。王国决定宁愿贫穷，也要保持独立自主。"
 SAU_purge_the_westernized_elite: "清除西化精英"
 SAU_purge_the_westernized_elite_desc: "各部委开始充斥着在利雅得而非波士顿接受教育的男性。那些带着外国学位和习惯回国的人，他们的档案被重新审查，职务也被重新分配。"
 SAU_the_foreign_bases_question: "外国基地问题"
 SAU_the_foreign_bases_question_desc: "外国军队的介入为沙特王国提供了外部保护，但也激怒了宗教人士，他们认为外国军队驻扎在阿拉伯半岛是一种侮辱。利雅得必须权衡，这种保护是否值得以牺牲其主权和宗教合法性为代价。"
 SAU_sever_the_western_pact: "脱离西方条约"
 SAU_sever_the_western_pact_desc: "沙特阿拉伯王国将关闭海外军事基地，并要求驻军撤离。此举恢复了沙特对其领土的控制，但也终止了一项重要的外部安全保障。"
 SAU_the_base_retention_edict: "基本保留法令"
 SAU_the_base_retention_edict_desc: "海外军事基地及其补给安排将保持不变。尽管宗教人士反对，政府仍将以安全需要为由，向宗教领袖们解释这一决定。"
 SAU_fight_iran_indirectly: "间接对抗伊朗"
 SAU_fight_iran_indirectly_desc: "与伊斯兰共和国公开交战只会让双方都遭受重创。相反，应该通过其代理人和动荡不安的省份来削弱德黑兰，始终避免真正爆发全面战争。"
 SAU_modon_industrial_cities: "沙特工业城市和技术区管理局工业城市"
 SAU_modon_industrial_cities_desc: "延布、拉斯海尔和朱拜勒除了石油码头外，还有更多空间。沙特工业城市和技术区管理局计划在这些地方建设水泥厂、炼铝厂和化肥厂，用国内生产的商品取代进口商品。"
 SAU_the_return_of_national_capital: "国家资本的回归"
 SAU_the_return_of_national_capital_desc: "沙特的大量财富都存放在海外房地产、银行和证券市场，而国内项目却迟迟没有资金到位。商务部将努力让这些资金回归沙特，并在国内发挥作用。"
 SAU_jeddah_islamic_port_expansion: "吉达伊斯兰港扩建"
 SAU_jeddah_islamic_port_expansion_desc: "吉达是沙特阿拉伯通往红海的门户。新建的滚装码头和铁路连接将使更多货物运往内陆，并使该港口在不断增长的贸易中保持领先地位。"
 SAU_the_supreme_economic_council: "最高经济委员会"
 SAU_the_supreme_economic_council_desc: "四个部委都声称拥有经济政策的制定权，而且彼此互不负责。最高经济委员会为它们提供了一个统一的平台、议程和解决争端的权威机构。"
 SAU_sabics_global_expansion: "沙特基础工业公司的全球扩张"
 SAU_sabics_global_expansion_desc: "沙特基础工业公司的业务规模已超越国内市场。收购通用电气塑料公司等项目将为公司带来新材料、专利以及远超海湾地区的客户。"
 SAU_the_jubail_ii_expansion: "朱拜勒二号扩建工程"
 SAU_the_jubail_ii_expansion_desc: "朱拜勒二期项目的发展将不仅仅围绕石化产业展开。沙特钢铁公司的扩建将为沙特建筑业提供国内所需的钢筋和扁钢。"
 SAU_the_saudi_export_program: "沙特出口计划"
 SAU_the_saudi_export_program_desc: "沙特工厂无法仅靠国内市场实现增长。该出口计划将把塑料、精炼燃料和水泥运往亚洲、非洲和拉丁美洲市场，这些国家主要以原油闻名。"
 SAU_sabic_agri_nutrients: "沙特基础工业公司农业营养品"
 SAU_king_abdullah_financial_district: "阿卜杜拉国王金融区"
 SAU_king_abdullah_financial_district_desc: "阿卜杜拉国王金融区将为银行、投资基金和跨国合作伙伴在利雅得提供一个统一的办公地址。在该金融区签署的交易可以将外国资本和专业技术引入沙特产业。"
 SAU_sabic_agri_nutrients_desc: "沙特基础工业公司已将沙特天然气转化为化学品。扩大氨和尿素的生产将使沙特成为主要的化肥供应国，并为远在阿拉伯世界以外的农场提供饲料。"
 SAU_economic_diversification: "经济多元化"
 SAU_economic_diversification_desc: "石油仍将是沙特王国最大的产业，但它并非决定所有产业命运的关键。资本将流向制造业、服务业和物流业，因此原油价格下跌不会再直接影响到沙特的每一份工资。"
 SAU_non_oil_exports: "非石油出口"
 SAU_non_oil_exports_desc: "满载的油轮不应是沙特唯一为人所知的出口产品。塑料、化工产品、水泥和机械设备也应在贸易账簿上占有一席之地，并使沙特外汇收入减少对原油的依赖。"
 SAU_economic_liberalization: "经济自由化"
 SAU_economic_liberalization_desc: "一家私营企业不应该需要王子、补贴和长达一年的签字才能开业。简化审批流程，让企业通过竞争赢得客户，而不是依靠人情关系。"
 SAU_sabic_technology_and_innovation: "沙特基础工业公司技术与创新"
 SAU_sabic_technology_and_innovation_desc: "单靠廉价原料无法让沙特基础工业公司永远保持竞争力。对催化剂、聚合物和生产方法的研究才能使沙特专利与沙特工厂并驾齐驱。"
 SAU_the_2000s_oil_boom: "2000年代的石油繁荣"
 SAU_the_2000s_oil_boom_desc: "油价攀升，国库充盈，沙特证券交易所的股价也随之上涨。如果沙特王国能在油价周期再次转变之前进行投资，这波繁荣就能为新兴产业提供资金。"
 SAU_the_national_industrial_strategy: "国家产业战略"
 SAU_the_national_industrial_strategy_desc: "一项为期十年的产业战略将把各部委和企业联系起来，共同致力于实现钢铁、机械、沙特就业和出口增长的目标。衡量进展的标准终于不再局限于预算规模。"
 SAU_the_mining_sector: "采矿业"
 SAU_the_mining_sector_desc: "沙特阿拉伯矿业公司成立于1997年，使采矿业成为继石油和石化产品之后的§Y第三大经济支柱§! - 在贾拉米德开采磷酸盐，在马赫德·阿德·达哈卜开采黄金，以及向拉斯·海尔开采铝土矿和铝。"
 SAU_the_tourism_sector: "旅游业"
 SAU_the_tourism_sector_desc: "成立于2000年的§Y最高旅游委员会§!将沙特阿拉伯王国的文化遗产、红海沿岸以及最重要的§Y麦加和麦地那朝圣之旅§!，发展成为一个全年持续的产业。"
 SAU_the_construction_boom: "建筑业繁荣"
 SAU_the_construction_boom_desc: "石油繁荣带来的投资将为利雅得、吉达和达曼的大规模建设提供资金，包括高楼大厦、购物中心、道路和其他城市基础设施。"
 SAU_the_digital_economy: "数字经济"
 SAU_the_digital_economy_desc: "§Y通信和信息技术委员会§!（2001年）结束了电信垄断，并为王国铺设了网络 - 移动网络、宽带和第一个电子政务服务覆盖了每个省份。"
 SAU_the_eighth_development_plan: "第八个发展计划"
 SAU_the_eighth_development_plan_desc: "五年的支出需要的不仅仅是一份部委名单。第八个发展计划将协调政府到2009年的经济和社会项目。"
 SAU_the_industrial_path: "工业之路"
 SAU_the_industrial_path_desc: "钢铁、冶炼和制造行业优先发展工厂而非办公场所。工业化道路虽然能够提升国内工业产能，但也需要更多的资本、劳动力和进口机械设备。"
 SAU_the_services_path: "服务业之路"
 SAU_the_services_path_desc: "银行业、物流业、金融业和旅游业无需新建钢铁厂即可为沙特毕业生提供就业机会。服务型经济需要减少对重工业的投资，并使沙特王国的更多物质需求依赖进口。"
 SAU_the_balanced_path: "平衡之路"
 SAU_the_balanced_path_desc: "工业和服务业将齐头并进，投资将在两者之间分散。这种折衷方案避免了对单一行业的依赖。任何一方都无法获得其想要的全部资金。"
 SAU_the_ninth_development_plan: "第九个发展计划"
 SAU_the_ninth_development_plan_desc: "2015年的沙特阿拉伯经济与1995年相比已截然不同。仅制造业一项的产值就超过了十年前的石油出口额。"
 SAU_the_saudi_landbridge: "沙特陆桥"
 SAU_the_saudi_landbridge_desc: "沙特陆桥将通过铁路连接红海沿岸的吉达伊斯兰港与海湾沿岸的利雅得和达曼。货物将无需绕道阿拉伯半岛即可穿越该半岛。"
 SAU_stc_privatization: "沙特电信公司私有化"
 SAU_stc_privatization_desc: "沙特电信公司已无法再以政府部门的速度扩张。私有化将为光纤和移动网络注入新的资金，但政府对这家国家运营商的控制权将会削弱。"
 SAU_the_saudi_electricity_company: "沙特电力公司"
 SAU_the_saudi_electricity_company_desc: "工厂和城市的发展速度超过了电网的建设速度。沙特电力公司将把新的燃气轮机接入横贯全国的输电线路，防止停电限制发展。"
 SAU_urban_development: "城市发展"
 SAU_urban_development_desc: "利雅得、吉达和达曼的发展速度超过了道路、公共设施和住房的建设速度。城市规划必须跟上步伐，否则交通拥堵将成为沙特阿拉伯王国的下一个瓶颈。"
 SAU_the_real_estate_development_fund: "房地产开发基金"
 SAU_the_real_estate_development_fund_desc: "在沙特大城市购置房产已超出普通家庭的承受范围。房地产发展基金将为新建社区提供资金，以缩短住房轮候名单。"
 SAU_the_north_south_railway: "南北铁路"
 SAU_the_north_south_railway_desc: "南北铁路将把北部矿区的磷酸盐和铝土矿运往海湾地区，同时连接长期以来依赖公路的内陆城镇。铁路将降低沙特阿拉伯王国境内的货运成本。"
 SAU_king_abdullah_economic_city: "阿卜杜拉国王经济城"
 SAU_king_abdullah_economic_city_desc: "拉比格、麦地那和吉赞的规划城市旨在摆脱繁琐的官僚程序，这些程序往往会拖慢其他地区的经济发展。它们精简后的规则将检验一座新城市能否超越旧有的官僚体系。"
 SAU_the_labour_law_of_2005: "2005年劳动法"
 SAU_the_labour_law_of_2005_desc: "外籍劳工缔造了现代王国，但担保制度使工人受制于雇主，沙特公民也被排除在私营企业之外。2005年的法律将放宽部分担保制度，同时敦促企业雇用公民。"
 SAU_tatweer_education_reform: "塔特维尔教育改革"
 SAU_tatweer_education_reform_desc: "死记硬背无法培养出新经济所需的工程师和管理人才。塔特维尔将修订课程，减少宗教课程的课时，并从四年级开始在课堂上引入英语教学。"
 SAU_king_fahd_medical_city: "法赫德国王医疗城"
 SAU_king_fahd_medical_city_desc: "目前，专科医疗服务集中在少数几家医院和少数几个城市。法赫德国王医疗城和新建的省级医疗机构将使那些无法前往利雅得就医的沙特民众也能享受到这种高水平的医疗服务。"
 SAU_kaust: "阿卜杜拉国王科技大学"
 SAU_kaust_desc: "大学的声誉取决于其内部的学术成就，而非校名。阿卜杜拉国王科技大学、法赫德国王石油与矿业大学和阿卜杜勒-阿齐兹国王大学增加科研预算，将为沙特学者提供实验室和科研经费，使其能够在国际上参与竞争。"
 SAU_k_a_care_renewable_energy: "阿卜杜拉国王原子能和可再生能源城"
 SAU_k_a_care_renewable_energy_desc: "尽管沙特阿拉伯拥有世界上最充足的阳光，却仍然燃烧宝贵的石油来发电。阿卜杜拉国王原子能和可再生能源城将在萨卡卡和杜马特·贾达尔试验另一种未来能源模式，将太阳能与北方风能相结合。"
 SAU_royal_decree_m_30_capital_market_law: "皇家法令M/30，资本市场法"
 SAU_royal_decree_m_30_capital_market_law_desc: "2003年7月31日，法赫德国王颁布了第M/30号皇家法令，正式颁布了《资本市场法》。该法令为沙特证券交易所和沙特资本市场监管建立了现代化的法律框架。"
 SAU_the_2007_legal_reforms: "2007年法律改革"
 SAU_the_2007_legal_reforms_desc: "沙特阿拉伯王国2007年的法律改革将公司注册正式化，并制定了设立合法法人实体的明确规则。如今，公司可以在更加可预测的公司框架下运营。"
 SAU_the_qualified_foreign_investor_program: "合格外国投资者计划"
 SAU_the_qualified_foreign_investor_program_desc: "§Y2015年6月15日§!，§Y沙特资本市场管理局§!首次向外国机构投资者开放§Y沙特证券交易所§!。管理资产规模至少达到§Y50亿美元§!的基金无需通过当地中介机构即可购买沙特股票，这标志着沙特股票开始迈向纳入§YMSCI新兴市场§!指数。"
 SAU_msci_emerging_markets_inclusion: "MSCI新兴市场指数"
 SAU_msci_emerging_markets_inclusion_desc: "§Y2018年6月§!，§YMSCI§!宣布沙特阿拉伯从独立成分股升级为新兴市场股。升级实施工作于§Y2019年5月§!开始，第二阶段于§Y2019年8月§!完成。完成升级后，§Y沙特阿拉伯证券交易所§!在该指数中的权重约为§G2.83%§!，预计将带来§G140亿至160亿§!美元的被动投资。"
 SAU_the_kafalah_sme_program: "卡法拉中小企业计划"
 SAU_the_kafalah_sme_program_desc: "卡法拉计划将提供优惠贷款、简化程序和培训，以帮助沙特企业家创办中小企业。"
 SAU_the_aramco_ipo: "沙特阿美IPO"
 SAU_the_aramco_ipo_desc: "§Y2019年12月11日§!，§Y沙特阿美§!在§Y沙特证券交易所§!上市，首轮募资§G256亿美元§!，超额配售权后最终募资§G294亿美元§!。此次IPO成为§G史上规模最大的IPO§!，超过了§Y阿里巴巴2014年的上市规模§!，并且选择在§Y利雅得§!而非§Y纽约§!或§Y伦敦§!上市。"
 SAU_the_saudi_financial_and_banking_laws: "沙特阿拉伯金融和银行法"
 SAU_the_saudi_financial_and_banking_laws_desc: "1966年的《银行监管法》和2003年颁布的《资本市场法》和《合作保险法》构成了沙特金融的主要法律框架。这两部法律共同为银行、保险公司和市场参与者制定了明确的义务和处罚措施。"
 SAU_the_capital_market_authority: "资本市场管理局"
 SAU_the_capital_market_authority_desc: "沙特家庭的命运都系于股价之上，证券交易所无法自我监管。资本市场管理局将制定上市规则，调查违规行为，并要求沙特证券交易所接受监管机构的监督。"
 SAU_edaa_the_securities_depository: "证券存管中心公司：证券存管处"
 SAU_edaa_the_securities_depository_desc: "§Y证券存管中心公司§!，负责结算沙特证券交易所的交易并维护电子所有权记录。这一现代化基础设施将提升市场对国内外投资者的可靠性。"
 SAU_the_saudi_logistics_hub: "沙特物流中心"
 SAU_the_saudi_logistics_hub_desc: "沙特阿拉伯王国将利用吉达、达曼和利雅得发展物流枢纽，连接亚洲、非洲和欧洲的贸易路线。"
 SAU_establish_joint_stock_conglomerates_jsc: "建立股份制企业集团"
 SAU_establish_joint_stock_conglomerates_jsc_desc: "将大型国有企业改组为股份制公司，将使公民和机构投资者能够为工业扩张提供资金。这将降低新项目对财政直接拨款的依赖。"
 SAU_the_saudi_sukuk_programme: "沙特阿拉伯伊斯兰债券计划"
 SAU_the_saudi_sukuk_programme_desc: "自§Y2017年§!起，§Y沙特财政部§!启动了一项持续的主权伊斯兰债券发行计划 - 仅首次国际发行就达§G90亿美元§!。符合伊斯兰教法的债券成为沙特政府融资和企业筹集资金的主要工具。沙特王国和§Y马来西亚§!共同瓜分了全球伊斯兰债券市场。"
 SAU_limited_liability_company_llc: "有限责任公司"
 SAU_limited_liability_company_llc_desc: "2015年颁布的《公司法》（2016年生效）为有限责任公司和股份公司建立了现代化的法律结构。受保护的资本和公认的法律地位将有助于国内企业构建供应链并与国际公司建立合作关系。"
 SAU_the_gulfs_economic_engine: "海湾地区的经济引擎"
 SAU_the_gulfs_economic_engine_desc: "沙特阿拉伯王国更强劲的经济将吸引区域工人、金融专业人士和资本来到利雅得，而不是让他们流失到邻近市场。"
 SAU_one_stop_shop: "一站式服务中心"
 SAU_one_stop_shop_desc: "过去，外国公司注册公司需要耗费§Y数年§!时间与多个部门打交道。沙特投资总局的§Y一站式服务中心§!将这些许可流程集中在§G一个柜台§!办理，减少了延误和§Y腐败§!的机会。"
 SAU_open_strategic_sectors: "开放战略部门"
 SAU_open_strategic_sectors_desc: "§Y电信§!、§Y保险§!和§Y采矿业§!将向外国资本开放。新的竞争者将带来§Y技术§!和§Y专业知识§!，同时也将迫使国有企业进行现代化改造"
 SAU_foreign_investment_law_of_2000: "2000年外国投资法"
 SAU_foreign_investment_law_of_2000_desc: "§Y2000年4月§!颁布的《外国投资法》允许外国公民在大多数行业拥有沙特公司§G100%§!的股权。取消此前的股权限制旨在吸引更多国际资本。"
 SAU_economic_cities_drive: "经济城市驱动"
 SAU_economic_cities_drive_desc: "计划新建六座经济城，包括位于红海沿岸的§Y阿卜杜拉国王经济城§!、位于麦地那的§Y知识经济城§!以及位于哈伊勒的§Y阿卜杜勒阿齐兹·本·穆萨德王子城§!。每座§Y特定城市§!都将是位于主要产油区以外的工业、服务和贸易中心。"
 SAU_international_partnerships: "国际伙伴关系"
 SAU_international_partnerships_desc: "与§Y通用电气§!、§Y陶氏化学§!、§Y住友§!和§Y三菱§!的合资企业将为沙特阿拉伯王国带来§Y技术§!和§Y管理专长§!。沙特工程师将与这些合作伙伴携手合作，培养未来在国内管理项目所需的技能。"
 SAU_tax_incentive_package: "税收优惠方案"
 SAU_tax_incentive_package_desc: "外国投资者的企业所得税税率将从§Y45%§!降至§G20%§!，而个人所得税则继续§G免税§!。沙特投资总局将向国际社会推广这些条款，以吸引外国资本。"
 SAU_saudi_arabia_open_for_business: "沙特阿拉伯，欢迎投资兴业"
 SAU_saudi_arabia_open_for_business_desc: "如今，许可证只需在一个办公室办理，而非多个；外国公司可以拥有自己建造的建筑物的所有权；新兴经济城市竞相吸引资本。沙特阿拉伯不再要求投资者忽略繁琐的官僚程序；它已敞开大门欢迎投资。"
 SAU_ras_tanura_and_abqaiq: "拉斯塔努拉和阿布盖克"
 SAU_complete_nationalization: "完全国有化"
 SAU_complete_nationalization_desc: "§Y1973年至1980年间§!，沙特阿拉伯王国收购了阿拉伯美国石油公司的美国合伙人股份。阿美石油公司成为沙特全资拥有的公司 - §Y沙特阿美石油公司§!。"
 SAU_the_master_gas_system: "主燃气系统"
 SAU_the_master_gas_system_desc: "主天然气系统于§Y1975年§!启用，它收集曾经在井口§Y燃烧掉§!的天然气，为王国的新兴产业提供廉价的能源和原料。"
 SAU_saudi_petroleum_engineers: "沙特石油工程师"
 SAU_saudi_petroleum_engineers_desc: "达兰的§Y阿卜杜拉国王石油与地质学院§!培养了一代沙特石油工程师和地质学家。沙特阿美公司的员工队伍成为沙特王国§Y沙特化§!程度最高的队伍。"
 SAU_the_ghawar_field: "加瓦尔油田"
 SAU_the_ghawar_field_desc: "§Y加瓦尔油田§!是迄今为止发现的最大常规油田，位于东部省地下280公里处。几十年来，仅此一处就生产了沙特阿拉伯王国一半以上的原油。"
 SAU_ras_tanura_and_abqaiq_desc: "世界最大的石油港口§Y拉斯塔努拉港§!和§Y阿布盖格§!稳定化设施负责收集、加工和出口沙特阿美公司的大部分原油产量。扩建和保护这些设施对沙特阿拉伯王国的石油行业至关重要。"
 SAU_downstream_integration: "下游整合"
 SAU_downstream_integration_desc: "停止出售原油。§Y朱拜勒、延布和拉比格§!的炼油厂和石化联合企业将每一桶原油在§Y国内§!加工成高价值燃料和塑料，并供应给沙特基础工业公司。"
 SAU_petrorabigh_and_satorp: "拉比格炼油石化公司和沙特阿美道达尔炼油和石化公司"
 SAU_petrorabigh_and_satorp_desc: "§Y拉比格炼油石化公司§!（与日本住友集团于2005年合作）和位于朱拜勒的§Y沙特阿美道达尔炼油和石化公司§!（与法国道达尔集团合作）是世界级的合资企业，它们将沙特原油裂解成燃料和化工产品。沙特王国停止出口原油，开始出口§Y成品油§!。"
 SAU_doctrine_maximize_production: "理论：最大化产量"
 SAU_doctrine_maximize_production_desc: "将沙特阿美的可持续产能提升至§Y每日1200万桶§!。在东部省和鲁卜哈利沙漠地区开发新的油田。\n\n§G石油§!在王国各地涌现，并促进燃料供应 - 这是§Y战争经济§!的基础。\n§Y与另外两种理论互斥。§!"
 SAU_doctrine_export_powerhouse: "理论：出口强国"
 SAU_doctrine_export_powerhouse_desc: "原油经由超级油轮向东西方向流动。作为欧佩克的§Y摇摆产油国§!，沙特阿拉伯王国将其石油转化为世界上最可靠的§Y石油美元§!收入来源。\n\n§G资源出口收入§!和经常性国库收入 - §Y货币经济§!的基础。\n§Y与另外两种理论互斥。§!"
 SAU_new_mega_fields: "新巨型油田"
 SAU_new_mega_fields_desc: "§Y沙伊巴油田§!（1998年投产）、鲁卜哈利沙漠深处的§Y库赖斯油田§!（2009年投产）以及近海的§Y马尼法油田§!（2013年投产）- 新一代巨型油田的落成，不断提升着沙特阿美公司的产能。§G更多石油正源源不断地涌出§!。"
 SAU_opec_swing_producer: "欧佩克摇摆产油国"
 SAU_opec_swing_producer_desc: "沙特阿拉伯王国的剩余产能使其能够作为欧佩克的§Y摇摆产油国§!，影响全球油价。这使得欧佩克能够灵活运用§Y石油杠杆§!，通过提高油价增加收入或降低油价向竞争对手施压。"
 SAU_the_council_of_economic_and_development_affairs: "经济与发展事务委员会"
 SAU_the_council_of_economic_and_development_affairs_desc: "§Y经济与发展事务委员会§!成立于2015年，负责协调各部委并监督政府经济改革计划的实施。"
 SAU_the_worlds_most_valuable_company: "全球最有价值的公司"
 SAU_the_worlds_most_valuable_company_desc: "沙特阿美已成为§Y全球最有价值的公司§!，并且仍然是沙特王国石油行业和公共财政的核心。\n§Y需要国家GDP超过1.8万亿美元。§!"
 SAU_the_national_transformation_program: "国家转型计划"
 SAU_the_national_transformation_program_desc: "“2030愿景”需要设定能够经受住发布会考验的最后期限。§Y国家转型计划§!将为每个部委设定目标、预算，并制定公开的绩效评估标准。"
 SAU_nazaha_the_anti_corruption_authority: "沙特阿拉伯监察与反腐败署：反腐败局"
 SAU_nazaha_the_anti_corruption_authority_desc: "§Y沙特阿拉伯监察与反腐败署§!成立于2011年，负责调查公共机构中的财务和行政腐败问题。其职责是加强对政府机构和官员的监督。"
 SAU_the_judicial_reform_of_2007: "2007年司法改革"
 SAU_the_judicial_reform_of_2007_desc: "阿卜杜拉国王§Y2007年的司法改革§!将规范法院程序，设立最高法院和专门法庭，并为企业提供更可预测的法律体系。"
 SAU_tayseer_regulatory_reform: "促进：监管改革"
 SAU_tayseer_regulatory_reform_desc: "国家竞争力中心（§Y促进§!）将减少许可证、审批和其他行政要求，从而延缓投资。"
 SAU_the_ministry_of_investment_misa: "投资部"
 SAU_the_ministry_of_investment_misa_desc: "2020年，沙特阿拉伯投资总局将改组为§Y投资部§!，集中管理面向外国投资者的政府服务和政策。"
 SAU_expec_research_centre: "勘探与石油工程研究中心"
 SAU_expec_research_centre_desc: "§Y勘探与石油工程中心§!将开发国内油藏建模和钻井技术。这将使沙特阿美公司拥有先进的技术能力，并加深其对沙特地质的了解。"
 SAU_strong_saudi_banks: "强大的沙特银行"
 SAU_strong_saudi_banks_desc: "拉杰赫银行、沙特国家商业银行、利雅得银行和桑巴银行将不断扩张，直到沙特阿拉伯的银行跻身世界百大银行之列。"
 SAU_insurance_for_all: "人人享有保险"
 SAU_insurance_for_all_desc: "经过数十年的市场发展受限，沙特阿拉伯王国将扩大健康保险、汽车保险和财产保险的覆盖范围。"
 SAU_grow_the_capital_markets: "发展资本市场"
 SAU_grow_the_capital_markets_desc: "更多IPO、更大的流动性和外国合格金融机构的准入将使沙特证券交易所发展成为一个规模更大、更成熟的交易所。"
 SAU_a_saudi_bond_market: "沙特债券市场"
 SAU_a_saudi_bond_market_desc: "王国将发展主权伊斯兰债券、公司伊斯兰债券和传统债券市场，以吸引从伦敦到东京的投资者。"
 SAU_the_sakani_housing_program: "萨卡尼住房计划"
 SAU_the_sakani_housing_program_desc: "§Y萨卡尼§!计划让普通沙特人也能拥有自己的住房 - 大规模提供土地、资金和现房。"
 SAU_the_national_housing_company: "国家住房公司"
 SAU_the_national_housing_company_desc: "§Y国家住房公司§!将采用标准化的施工方法和总体规划开发项目，在主要城市周边扩大住房供应。"
 SAU_the_saudi_cement_industry: "沙特水泥行业"
 SAU_the_saudi_cement_industry_desc: "沙特水泥、亚玛玛和其他国内生产商将为建筑项目供应水泥，并减少水泥进口。"
 SAU_glass_and_building_materials: "玻璃和建筑材料"
 SAU_glass_and_building_materials_desc: "王国将在国内生产浮法玻璃、陶瓷和结构钢，以供应其建筑行业。"
 SAU_vision_2030: "2030愿景"
 SAU_vision_2030_desc: "§Y2030愿景§!是王储提出的通过发展旅游业、工业、娱乐业和重大开发项目来减少对石油依赖的计划。该计划设定的2030年为公开期限，使政府直接对落实这些改革负责。"
 SAU_qiddiya_and_the_line: "奇迪亚与线性城市"
 SAU_qiddiya_and_the_line_desc: "§Y奇迪亚§!和§Y线性城市§!将引入娱乐和城市发展理念，这些理念先于沙特阿拉伯王国更大规模的巨型项目群。"
 SAU_the_red_sea_project: "红海工程"
 SAU_the_red_sea_project_desc: "§Y红海工程§!将发展沿海地区的豪华旅游业，并向国际游客开放部分沙特阿拉伯岛屿。"
 SAU_king_salman_international_airport: "萨勒曼国王国际机场"
 SAU_king_fahd_international_airport: "法赫德国王国际机场"
 SAU_king_fahd_international_airport_desc: "达曼的法赫德国王国际机场规模庞大，还有很大的提升空间，不只是保持纪录。扩建跑道和增加机场容量，使其成为沙特阿拉伯旅客和货物的东部门户。"
 SAU_king_salman_international_airport_desc: "位于利雅得的新§Y萨勒曼国王国际机场§!的设计年旅客吞吐量为1亿人次，旨在支持沙特王国的旅游业和物流发展目标。"
 SAU_king_abdullah_port: "阿卜杜拉国王港"
 SAU_king_abdullah_port_desc: "§Y阿卜杜拉国王港§!是该地区第一个完全私有的港口，它将发展成为一个重要的集装箱枢纽。"
 SAU_the_digital_government_authority: "数字政府管理局"
 SAU_the_digital_government_authority_desc: "§Y数字政府管理局§!将把公共服务集中到一个统一的在线平台上，减少纸质行政管理。"
 SAU_the_e_commerce_boom: "电子商务的蓬勃发展"
 SAU_the_e_commerce_boom_desc: "萨拉、努恩和其他初创企业的发展将推动更多沙特零售活动转移到线上，并扩大电子商务行业。"
 SAU_fintech_saudi: "沙特金融科技"
 SAU_fintech_saudi_desc: "沙特数字支付、塔玛拉和开放银行框架将使§Y沙特金融科技公司§!能够将利雅得发展成为区域金融科技中心。"
 SAU_kacst_science_and_technology: "阿卜杜勒-阿齐兹国王科技城：科学与技术"
 SAU_kacst_science_and_technology_desc: "§Y阿卜杜勒阿齐兹国王科技城§!是沙特阿拉伯王国的研究基地，研究领域涵盖先进材料到太空。"
 SAU_the_human_capability_program: "人力能力计划"
 SAU_the_human_capability_program_desc: "新兴产业需要训练有素的沙特人来运营。§Y人力能力发展计划§!将把课堂教学、职业学校和专业培训与沙特王国正在努力创造的就业机会联系起来。"
 SAU_the_national_technology_development_program: "国家技术发展计划"
 SAU_the_national_technology_development_program_desc: "国家技术发展计划为沙特阿拉伯王国在石油收入减少时所需的初创企业和尖端科技企业提供资金。"
 SAU_the_saudi_space_commission: "沙特阿拉伯航天委员会"
 SAU_the_saudi_space_commission_desc: "§Y沙特航天委员会§!成立于2018年，将致力于发展宇航员任务、提升发射能力，并促进沙特参与国际航天领域。"
 SAU_saudi_satellites_and_arabsat: "沙特卫星和阿拉伯卫星公司"
 SAU_saudi_satellites_and_arabsat_desc: "沙特卫星计划以及沙特王国在§Y阿拉伯卫星公司§!的股份将扩大沙特在轨道上的通信和观测能力。"
 SAU_sami_saudi_arabian_military_industries: "沙特阿拉伯军事工业公司：沙特阿拉伯军事工业"
 SAU_sami_saudi_arabian_military_industries_desc: "§Y沙特阿拉伯军事工业公司§!成立于2017年，旨在实现国防本土化 - 到 2030 年，一半的军火预算将在国内支出。"
 SAU_gami_localise_the_arms_industry: "军事工业总局：实现军火工业本地化"
 SAU_gami_localise_the_arms_industry_desc: "§Y军事工业总局§!负责颁发许可证，并从几乎无到有地发展国内军火产业。"
 SAU_the_saudi_drone_program: "沙特无人机计划"
 SAU_the_saudi_drone_program_desc: "王国设计和制造的巡飞弹和侦察§Y无人机§!。"
 SAU_the_national_cybersecurity_authority: "国家网络安全局"
 SAU_the_national_cybersecurity_authority_desc: "在沙特阿美公司和各部委遭受长达十年的攻击之后，§Y国家网络安全局§!（2017年）加强了沙特王国的网络安全。"
 SAU_sdaia_data_and_artificial_intelligence: "沙特数据和AI管理局：数据与人工智能"
 SAU_sdaia_data_and_artificial_intelligence_desc: "§Y沙特阿拉伯数据与AI管理局§!成立于2019年，将协调国家人工智能战略，扩大超级计算能力，并使政府数据可供实际应用。"
 SAU_the_national_data_centres: "国家数据中心"
 SAU_the_national_data_centres_desc: "数据中心需要充足的电力和大规模的建设。沙特阿拉伯王国能够提供这两项资源，而且超大规模的数据中心园区可以支撑国内云计算产业的发展，服务于更广泛的区域。"
 SAU_the_5g_network: "5G网络"
 SAU_the_5g_network_desc: "沙特电信和莫比利已在沙特阿拉伯王国实现了§Y5G§!网络覆盖，是世界上部署速度最快的国家之一。"
 SAU_absher_and_yesser_e_government: "阿布舍尔与耶塞尔电子政务"
 SAU_absher_and_yesser_e_government_desc: "耶塞尔、§Y阿布舍尔§!和托卡尔纳将把政府服务转移到移动平台上，并取代数百万次的面对面交易。"
 SAU_the_health_sector_transformation: "卫生部门转型"
 SAU_the_health_sector_transformation_desc: "卫生部门转型将把医院组织成负责任的集群，扩大健康虚拟医院，并提高私人保险的作用。"
 SAU_madrasati_and_curriculum_reform: "马德拉萨蒂与课程改革"
 SAU_madrasati_and_curriculum_reform_desc: "§Y马德拉萨蒂§!平台和修订后的课程将加强批判性思维、英语和编程方面的教学，同时减少对死记硬背的依赖。"
 SAU_the_riyadh_metro: "利雅得地铁"
 SAU_the_riyadh_metro_desc: "首都地下有六条线路 - §Y利雅得地铁§!，是迄今为止一次性建成的最大城市交通项目之一。"
 SAU_the_national_renewable_energy_program: "国家可再生能源计划"
 SAU_the_national_renewable_energy_program_desc: "§Y国家可再生能源计划§!将开发数十吉瓦的太阳能和风能发电，从而使更多的原油可以出口，而不是燃烧发电。"
 SAU_the_sakaka_solar_plant: "萨卡卡太阳能发电厂"
 SAU_the_sakaka_solar_plant_desc: "§Y萨卡卡§!太阳能发电厂于2018年开始建设，并于2021年正式投产，是沙特阿拉伯王国首个公用事业规模的太阳能发电设施。其低廉的电价展现了沙特太阳能发电的商业潜力。"
 SAU_the_dumat_al_jandal_wind_farm: "杜玛占达风电场"
 SAU_the_dumat_al_jandal_wind_farm_desc: "装机容量为400兆瓦的§Y杜玛占达§!风电场将利用强劲的北方风力提供可再生电力，并成为中东最大的风力发电设施。"
 SAU_neom_green_hydrogen: "新未来城绿色氢能"
 SAU_neom_green_hydrogen_desc: "新未来城将建成全球最大的§Y绿色氢气§!工厂。该项目旨在将低成本的可再生电力转化为可出口的燃料。"
 SAU_the_civil_nuclear_program: "民用核能计划"
 SAU_the_civil_nuclear_program_desc: "太阳能发电量每天傍晚都会下降，而对电力和海水淡化水的需求却不会减少。民用核能项目可以全天候供应这两种能源，前提是沙特阿拉伯王国能够承担建设反应堆所需的成本和监管。"
 SAU_battery_energy_storage: "电池储能"
 SAU_battery_energy_storage_desc: "电网级电池将储存中午的太阳能发电量，供晚间用电高峰期使用，从而提高可再生能源的可靠性。"
 SAU_modernise_the_national_grid: "国家电网现代化"
 SAU_modernise_the_national_grid_desc: "与海湾合作委员会电网互联的智能§Y国家电网§!将减少停电，并平衡不稳定的可再生能源发电"
 SAU_ceer_the_saudi_electric_car: "西尔：沙特阿拉伯电动汽车"
 SAU_ceer_the_saudi_electric_car_desc: "§Y西尔§!公司成立于2022年，与位于吉达附近的路西德工厂将共同建立沙特阿拉伯国内电动汽车生产线。这将使沙特阿拉伯能够自主生产汽车，而无需完全依赖进口。"
 SAU_fund_vision_2030: "2030愿景基金"
 SAU_fund_vision_2030_desc: "如此庞大的计划不能仅仅依靠公告来支撑。必须将国库资金和公共投资基金投入到能够减少对石油依赖、创造私营部门就业机会的项目上，并证明“2030愿景”已经超越了纸上谈兵的阶段。"
 SAU_the_standardized_interest_law: "标准化利息法"
 SAU_the_standardized_interest_law_desc: "利息是伊斯兰教法与现代银行业之间的一个关键冲突点。沙特阿拉伯王国必须做出选择：是彻底禁止利息，允许传统贷款，还是容忍以伊斯兰形式存在的利息。"
 SAU_fractional_reserve_mandates: "部分准备金制度"
 SAU_fractional_reserve_mandates_desc: "较低的存款准备金率意味着银行可以释放更多存款用于放贷，但同时也削弱了银行抵御提款的能力。新的政策必须决定沙特银行每收到一里亚尔存款可以创造多少信贷。"
 SAU_the_anti_speculation_directives: "反投机指令"
 SAU_the_anti_speculation_directives_desc: "衍生品使企业能够对冲价格波动风险，但同样的工具也可能将市场变成赌场。监管机构必须明确区分有效的风险管理和伊斯兰教法禁止的过度投机行为。"
 SAU_the_interbank_lending_code: "银行间贷款准则"
 SAU_the_interbank_lending_code_desc: "沙特阿拉伯的银行需要一个隔夜市场来进行资金转移。利雅得必须决定这种流动性是通过传统的利息交易、商品穆拉巴哈融资，还是两种交易系统并行运作。"
 SAU_the_banking_control_law: "银行控制法"
 SAU_the_banking_control_law_desc: "关于银行业问题的争论最终归结为权力问题。沙特阿拉伯金融管理局将作为独立的专家机构进行监管，还是由伊斯兰教法委员会拥有否决权，抑或两者将各自监管各自的机构？"
 SAU_bastion_of_islamic_finance: "伊斯兰金融堡垒"
 SAU_bastion_of_islamic_finance_desc: "伊斯兰金融既可以是受保护的沙特正统教义，也可以是面向更广阔穆斯林世界的商业模式。严格的规则确保了乌里玛的信任；务实的规则则为利雅得带来了更多客户。"
 SAU_the_secularization_of_finance: "金融世俗化"
 SAU_the_secularization_of_finance_desc: "开放每一种西方金融工具都会吸引外国资本，并使银行业摆脱行政监管。渐进的转变可能会缓解这种强烈反对，但与传统的决裂仍然存在。"
 SAU_a_defensive_deal_with_pakistan: "与巴基斯坦达成防御协议"
 SAU_a_defensive_deal_with_pakistan_desc: "巴基斯坦拥有穆斯林世界规模最大的军队，其核弹也是逊尼派国家唯一拥有的核弹。必须让伊斯兰堡参与保卫两圣地。"
 SAU_sabic_industrialization: "沙特基础工业公司工业化"
 SAU_sabic_industrialization_desc: "§G沙特基础工业公司§!是沙特王国的石化巨头，成立于1976年。它将沙特石油转化为塑料、化肥和化学品 - 现代经济的基石。"
 SAU_establish_sagia: "成立沙特阿拉伯投资总局"
 SAU_establish_sagia_desc: "一项皇家法令将设立§Y沙特阿拉伯投资总局§!，旨在吸引§G外国资本§!。沙特阿拉伯投资总局将简化许可流程，直接与国际投资者合作，并将§Y利雅得§!打造成为§Y全球商业§!中心。"
 SAU_tadawul_the_saudi_stock_exchange: "沙特证券交易所"
 SAU_tadawul_the_saudi_stock_exchange_desc: "沙特股票交易从非正式市场发展成为§G沙特证券交易所§!。如今，一个现代化的资本市场需要正式的上市、信息披露和交易规则，才能承载沙特王国的投资雄心。"
 SAU_the_water_crisis: "水危机"
 SAU_the_water_crisis_desc: "沙特阿拉伯王国的地下蓄水层正在枯竭，§Y海水淡化厂§!面临越来越大的压力，人均用水量位居§Y世界前列§!。政府必须正式承认这场危机，才能实施全国性的应对措施。"
 SAU_saudi_foreign_policy: "沙特外交政策"
 SAU_saudi_foreign_policy_desc: "王位、圣城以及每一艘驶离海湾的油轮都取决于利雅得在海外的行动。沙特外交必须与各大强国保持密切联系，但又不能让任何一方独断王国的安全。"
 SAU_fortify_the_kingdom: "巩固王国"
 SAU_fortify_the_kingdom_desc: "如果与伊朗的冷战升级为热战，东部省份和霍尔木兹海峡将首当其冲。必须加强国家防御，以防威慑失效之时。"
 SAU_freedom_or_death: "自由或死亡"
 SAU_freedom_or_death_desc: "叙利亚战争已演变为利雅得和德黑兰之间的意志较量。沙特全力支持反叛势力，并将沙特的声誉押注于阿萨德政权的垮台。"
 SAU_fund_the_jordanian_army: "资助约旦军队"
 SAU_fund_the_jordanian_army_desc: "一支强大的约旦军队守卫着王国漫长的北部边疆。要保障安曼军队的实力，以便在关键时刻，他们能够听命于利雅得。"
 SAU_fund_the_lebanese_army: "资助黎巴嫩军队"
 SAU_fund_the_lebanese_army_desc: "在黎巴嫩，国家军队是唯一能够制衡真主党“国中之国”的力量。应资助黎巴嫩武装部队，使其成为与伊朗民兵抗衡的一支力量。"
 SAU_fund_the_free_syrian_army: "资助叙利亚自由军"
 SAU_fund_the_free_syrian_army_desc: "反对阿萨德王朝的起义是切断伊朗通往海洋桥梁的良机。应向为自由叙利亚而战的反叛分子输送资金和武器。"
 SAU_guardians_of_the_two_mosques: "两座清真寺守护者"
 SAU_guardians_of_the_two_mosques_desc: "“两圣寺守护者”这一头衔赋予国王其他穆斯林统治者所不具备的宗教权威。虽然宗教理事会不能自封此头衔，但它可以通过公开支持国王履行这一职责来增强自身的合法性。"
 SAU_the_hormuz_shield: "霍尔木兹之盾"
 SAU_the_hormuz_shield_desc: "伊朗威胁称，一旦出现战争迹象，就将封锁霍尔木兹海峡。因此，无论德黑兰发出何种威胁，都必须在盟国的帮助下，建立起空中和海上防御体系，确保油轮能够安全航行。"
 SAU_the_india_middle_east_corridor: "印度-中东走廊"
 SAU_the_india_middle_east_corridor_desc: "一条由铁路、港口和管道组成的新通道可以从孟买经阿拉伯半岛直达欧洲腹地。使沙特阿拉伯王国成为绕过伊朗势力范围咽喉要道的走廊中不可或缺的一环。"
 SAU_install_a_loyalist_in_the_government: "在政府中安插效忠派人士"
 SAU_install_a_loyalist_in_the_government_desc: "每个重要部门都将指派现役军官，有权在部门决议上签字。部长们将保留其头衔，但军方将直接控制公务员队伍。"
 SAU_king_fahd_university_of_petroleum_and_minerals: "法赫德国王石油与矿业大学"
 SAU_king_fahd_university_of_petroleum_and_minerals_desc: "科学、技术、工程和数学是优先事项。王国需要的是工程师，而不是神职人员。课程设置也随之调整。"
 SAU_the_tatweer_education_project: "塔特维尔教育项目"
 SAU_the_tatweer_education_project_desc: "塔特维尔项目将强调批判性思维、分析和辩论，而非死记硬背。这项改革不仅改变了教学方法，也改变了更广泛的教育文化。"
 SAU_english_language_education: "英语语言教育"
 SAU_english_language_education_desc: "沙特阿拉伯将从小学开始教授英语，以便沙特毕业生能够更有效地参与全球经济。"
 SAU_the_teachers_colleges: "师范学院"
 SAU_the_teachers_colleges_desc: "教师将接受现代教育学、课堂管理和教育技术方面的培训。"
 SAU_tatweer_smart_schools: "塔特维尔智能学校"
 SAU_tatweer_smart_schools_desc: "塔特维尔智能学校将引入课堂平板电脑、在线学习平台和人工智能辅助辅导。"
 SAU_king_abdulaziz_university: "阿卜杜勒阿齐兹国王大学"
 SAU_king_abdulaziz_university_desc: "包括沙特国王大学、沙特阿卜杜拉国王科技大学、沙特阿卜杜拉国王石油与矿业大学和努拉公主大学在内的多所大学将在沙特王国各地扩建，并改善高等教育的普及程度。"
 SAU_king_abdullah_university_of_science_and_technology: "阿卜杜拉国王科技大学"
 SAU_king_abdullah_university_of_science_and_technology_desc: "与麻省理工学院、牛津大学和索邦大学的合作，以及在沙特阿拉伯设立的外国分校，将把国际学术专长引入沙特阿拉伯王国。"
 SAU_the_king_abdullah_scholarship_program: "阿卜杜拉国王奖学金计划"
 SAU_the_king_abdullah_scholarship_program_desc: "阿卜杜拉国王奖学金计划将资助数千名沙特学生赴海外顶尖大学深造。毕业生将带着更高的学历和国际经验回国。"
 SAU_integrate_gosi_payrolls: "整合社会保险总机构工资系统"
 SAU_integrate_gosi_payrolls_desc: "社会保险总机构已经掌握了王国境内所有员工的工资信息，因为它负责收取缴款。然而，之前没有人想到要利用这个数据库来解决配额问题。\n\n一旦连接成功，公司的沙特化比例就会自动计算，而实际雇用的沙特人数量不再是公司上次在表格上填写的数值。"
 SAU_reform_the_kafala_system: "改革卡法拉制度"
 SAU_reform_the_kafala_system_desc: "数百万外籍劳工生活在沙特阿拉伯王国，他们依附于单一雇主，雇主掌握着他们的证件和离境许可。改革并非终结这种现状，而是使其更加透明、便于携带，并大大简化了入境流程。\n\n资金流入不断增长并趋于有序。企业不再需要付费去规避一个无人能在公开场合辩护的体系。"
 SAU_platinum_tier_privileges: "白金会员特权"
 SAU_platinum_tier_privileges_desc: "顶级企业可以立即获得许可证续期，合同优先获得批准，扩张计划也能一路畅通，而竞争对手还在排队等候。\n\n它不会给财政部带来任何成本，而且比该部以往征收的任何罚款都能带来更大的合规性。"
 SAU_red_zone_visa_freezes: "红区签证冻结"
 SAU_red_zone_visa_freezes_desc: "处于最低级别区间的公司，在摆脱该级别之前，不得续签任何工作许可。并非受限 - 而是冻结。\n\n有些公司在本季度进行了重组。有些公司雇佣了他们并不需要的沙特人。有些公司干脆停止运营，而财政部认为这种情况可以接受。"
 SAU_launch_the_qiwa_platform: "启动奇瓦平台"
 SAU_launch_the_qiwa_platform_desc: "国境内所有劳务交易 - 合同、调动、配额状态、许可证申请 - 都可通过一个门户网站完成。过去需要一个月快递才能办完的事情，现在只需一个下午就能搞定。\n\n这是该节目中最不引人注目的部分，也是双方阵营都认同的部分。"
 SAU_repeal_the_expatriate_levy: "废除外籍人士税"
 SAU_repeal_the_expatriate_levy_desc: "对每位外籍员工每月征收的费用原本是为了让沙特人重新回到私营企业的工资体系中去。但实际效果却是导致利润最微薄的公司倒闭，并迫使其余公司转而进行非正式雇佣。\n\n解除封锁会使经济赖以运转的劳动力回归，但不会给国库带来任何收益。"
 SAU_high_skill_visa_fast_track: "高技能签证快速通道"
 SAU_high_skill_visa_fast_track_desc: "王国目前还无法培养的工程师、外科医生和系统架构师，只需几天而不是几个月的时间就能带着家人入境，而且无需担保人持有护照。\n\n王国购买的是它尚未完全培养的专业技术。"
 SAU_abolish_the_noc_requirement: "取消无异议证明要求"
 SAU_abolish_the_noc_requirement_desc: "劳动者无需获得现任雇主的书面许可即可更换雇主。这项条款已从劳动法中删除，并终结了维系整个劳动制度的既有安排。\n\n资本通知。所有从旧规则中获益的人也一样。"
 SAU_the_doroob_training_initiative: "多鲁布培训计划"
 SAU_the_doroob_training_initiative_desc: "一个面向私营部门实际招聘技能的全国性在线学习平台，使用免费，任何持有国民身份证的人都可以使用。\n\n它并不能解决劳动力市场问题，但它消除了“没人受过培训”的借口。"
 SAU_the_taqat_employment_portal: "塔卡特就业门户网站"
 SAU_the_taqat_employment_portal_desc: "国家劳动力门户网站：所有求职者都在一个登记册中，所有符合条件的职位空缺都在另一个登记册中，一个部门终于可以看到两者之间的差距。\n\n吉赞和北部边境地区首次出现在数据中。"
 SAU_the_saudization_quotas: "沙特化配额"
 SAU_the_saudization_quotas_desc: "配额不再是一个国家统一的数字，而变成了一个时间表 - 建筑业、零售业、电信业和交通运输业各有一个最低配额，权重取决于该行业可能吸纳的沙特人数量。\n\n该部门之前在这个数字上也出现过错误。"
 SAU_subsidize_sme_compliance: "补贴中小企业合规"
 SAU_subsidize_sme_compliance_desc: "大型企业集团可以承担配额，而只有三十名员工的小公司则不能。这些小公司每里亚尔的收入所雇佣的沙特公民人数，比沙特王国任何一家大型企业集团都要多。\n\n低息贷款、较宽松的检查安排，以及可供未来发展的办公空间。"
 SAU_the_industrial_cadre_mandate: "产业干部任务"
 SAU_the_industrial_cadre_mandate_desc: "重工业部门被告知其技术人员中必须有多少比例是沙特人，并被要求在十年内达到这一目标。石化巨头可以自行消化这一要求；但它们周围的承包商则必须学会适应。\n\n王国停止从所有接触过管道系统的工程师中引进人才。"
 SAU_hrdf_wage_subsidies: "人力资源发展基金工资补贴"
 SAU_hrdf_wage_subsidies_desc: "人力资源发展基金为沙特籍员工支付其入职头几年的部分工资，其理论依据是本国员工和外籍员工之间的差距主要在于经验差距。\n\n企业接受了补贴。但补贴到期后，这些雇员是否还能继续留任，这个问题至今无人解答。"
 SAU_the_wusool_transport_subsidy: "乌苏尔交通补贴"
 SAU_the_wusool_transport_subsidy_desc: "沙特阿拉伯王国一半的大学毕业生是女性，但几乎没有人就业，而制约她们就业的并非才能或许可，而是她们无法到达工作地点。\n\n国家为她们的旅程提供补贴。劳动力的增长速度是任何移民政策都无法比拟的。"
 SAU_foreign_ownership_deregulation: "外资所有权放松管制"
 SAU_foreign_ownership_deregulation_desc: "一家外国公司可以完全拥有其在沙特的业务，毫无争议地将利润汇回国内，并绕过签字并拿走三分之一股份的当地合伙人。\n\n资金很快到位，随之而来的是王国工业所有权归属的问题。"
 SAU_secondary_education_expansion: "中等教育扩张"
 SAU_secondary_education_expansion_desc: "高中规模扩大，职业培训发展壮大。每个沙特青少年都有机会接受中等教育 - 无论是学术教育还是职业教育。"
 SAU_technical_and_vocational_training_corporation: "技术与职业培训公司"
 SAU_technical_and_vocational_training_corporation_desc: "技术学院培养水管工、电工、机械师和焊工。并非每个沙特人都需要大学学位。经济需要技术工人。"
 SAU_saudi_internal_affairs: "沙特内政部"
 SAU_saudi_internal_affairs_desc: "王国的内政政策将着重于公共安全、教育、医疗卫生和经济福利。这些体系为长期稳定与发展奠定了基础。"
 SAU_confront_the_literacy_crisis: "直面识字危机"
 SAU_the_anglo_style_curriculum: "英式课程"
 SAU_the_anglo_style_curriculum_desc: "英式课程将为沙特学校带来更多批判性思维、科学探究和课堂辩论。经济需要这些习惯，即便伊斯兰教法学家认为这是外来入侵。"
 SAU_confront_the_literacy_crisis_desc: "2000年，超过五分之一的沙特阿拉伯人不识字，该国§Y识字率仅为79%§!。石油收入无法使一个缺乏教师、工程师和职员的国家实现现代化。利雅得必须在§Y英式课程§!和§Y本土化的学术与职业教育体系§!之间做出选择。\n\n§G每一项教育国策都会提高识字率§!，最终实现全民扫盲。"
 SAU_education_transformation_complete: "教育转型完成"
 SAU_education_transformation_complete_desc: "大学规模扩大，课程设置有所调整，沙特王国的识字率也在不断提高。改革虽然未能解决所有问题，但沙特的课堂已为未来的工作做好了更充分的准备。"
 SAU_domestic_secondary_tracks: "国内中等教育"
 SAU_domestic_secondary_tracks_desc: "沙特阿拉伯的中学将分为学术型和职业型两条道路，每条道路都围绕国内所需的技能而建。这套体系的建设成本高于直接引进国外模式，但它更符合沙特阿拉伯的优先事项。"
 SAU_ministry_of_human_resources_mandate: "人力资源部职责"
 SAU_the_nitaqat_decree: "沙特化法令"
 SAU_the_nitaqat_decree_desc: "沙特阿拉伯王国不再要求企业雇用沙特公民，而是开始根据企业是否雇用沙特公民进行评级。每家公司都会被赋予一个颜色，该颜色决定了公司被允许开展的业务范围，而该颜色是根据沙特劳工部已经掌握的工资单计算得出的。\n\n这是王国历史上第一项附带执行机制的劳动政策。"
 SAU_ministry_of_human_resources_mandate_desc: "该部被赋予了它一直以来被认为拥有的权力：按行业设定配额，无需解释即可拒绝签证，以及关闭不遵守规定的公司。\n\n一些公司多年来一直在游说错误的部门，后来发现现在有了正确的部门，但该部门却不感兴趣。"
 SAU_fast_track_government_contracts: "快速审批政府合同"
 SAU_fast_track_government_contracts_desc: "国家在基础设施建设上花费的每一里亚尔都成了劳工政策的工具。顺从的公司优先投标，优先获得付款，而且会被公开告知。\n\n王国是王国最大的客户。它最终决定采取相应的采购方式。"
 SAU_gip: "沙特阿拉伯情报总局"
 SAU_gip_desc: "沙特阿拉伯情报总局走向专业化。培训、设备和流程均达到国际标准。王国的内部安全变得更加高效，也更加引人注目。"
 SAU_the_open_market: "开放市场"
 SAU_the_open_market_desc: "答案是停止向国家寻求帮助。所有权规则取消，资本管制取消，市场将决定哪些公司有资格存在，以及它们需要哪些沙特人。\n\n这条路更快，但也更难。走这条路丢了工作的人，不会受到任何惩罚。"
 SAU_opec_agreement: "欧佩克+协议"
 SAU_opec_agreement_desc: "莫斯科和利雅得在石油市场上是竞争对手，在叙利亚问题上也立场对立，但它们却能联手决定原油价格。达成协议，才能维持这个由两国组成的卡特尔的完整。"
 SAU_command_of_the_gulf: "海湾司令部"
 SAU_command_of_the_gulf_desc: "随着伊朗海军被摧毁，海峡畅通无阻，沙特阿拉伯王国掌控了波斯湾水域。这场漫长的海洋争夺战终于结束。"
 SAU_the_iraq_war: "伊拉克战争"
 SAU_the_iraq_war_desc: "美军坦克正向巴格达推进，美索不达米亚的旧秩序即将被彻底摧毁。王国必须做好准备，迎接废墟中可能出现的任何局面。"
 SAU_king_in_name_heir_in_uniform: "名义上的国王，实则身着制服的继承人。"
 SAU_king_in_name_heir_in_uniform_desc: "王位将保留，但继承人必须既是王子又是议会认可的现役军官。这一折衷方案既维护了王朝，又将继承置于军方监督之下。"
 SAU_the_kingdom_unbeholden: "无所依附的王国"
 SAU_the_kingdom_unbeholden_desc: "王国将拒绝外国安全保障和赞助，完全依靠自身防御。这是代价最高的选择，但能确保完全的战略独立性。"
 SAU_martial_law_issues: "戒严令实施"
 SAU_martial_law_issues_desc: "军方将控制公众集会、省际流动和新闻出版。由于王国没有宪法可供中止，这些限制可以直接通过法令实施。"
 SAU_secure_support_in_the_mecca_province: "在麦加省获得安全支持"
 SAU_secure_support_in_the_mecca_province_desc: "麦加省包括吉达、朝觐中心、颇具影响力的商人家族，以及早于沙特统治的希贾兹文化认同。该委员会将利用庇护、安全部队和政治让步来确保该省的安全。"
 SAU_the_mecca_summit: "麦加峰会"
 SAU_the_mecca_summit_desc: "沙特阿拉伯王国将在麦加主办谈判，并利用此次峰会加强利雅得作为穆斯林世界调解人的地位。"
 SAU_memories_of_khafji: "哈夫吉的回忆"
 SAU_memories_of_khafji_desc: "1991年，伊拉克装甲部队曾短暂占领沙特阿拉伯边境城镇哈夫吉，这是沙特王国永远铭记的耻辱。愿哈夫吉的记忆激励沙特王国，使其防御更加坚固，防止悲剧重演。"
 SAU_the_military_takeover: "军事接管"
 SAU_the_military_takeover_desc: "军队已控制各部委、广播机构以及通往王宫的通道。为防止政变而成立的国民警卫队已被包围，王国完全落入军方手中。"
 SAU_the_monarchy_under_military_rule: "军人统治下的君主制"
 SAU_the_monarchy_under_military_rule_desc: "国王将继续留在宫中，签署法令，但军事委员会将控制军队并决定政府政策。君主制作为一种形式上的机构继续存在，但不再拥有独立权力。"
 SAU_the_royal_saudi_naval_forces: "沙特皇家海军"
 SAU_the_royal_saudi_naval_forces_desc: "建立一支分属两海域的沙特皇家海军，以保卫王国漫长的海岸线。"
 SAU_eastern_fleet_jubail: "东部舰队（朱拜勒）"
 SAU_eastern_fleet_jubail_desc: "将东部舰队驻扎在朱拜勒，以控制阿拉伯湾并保护石油码头。"
 SAU_western_fleet_jeddah: "西部舰队（吉达）"
 SAU_western_fleet_jeddah_desc: "将西部舰队驻扎在吉达，以确保红海沿岸和曼德海峡入口的安全。"
 SAU_sawari_ii_frigate_programme: "萨瓦里二号护卫舰计划"
 SAU_sawari_ii_frigate_programme_desc: "根据“萨瓦里二号”计划，购置法国建造的“利雅得”级护卫舰，这是该舰队最强大的舰艇。"
 SAU_badr_class_corvettes: "巴德尔级护卫舰"
 SAU_badr_class_corvettes_desc: "将美国建造的巴德尔级轻型护卫舰投入巡逻、护航和海岸打击行动。"
 SAU_royal_saudi_marines: "沙特皇家海军陆战队"
 SAU_royal_saudi_marines_desc: "组建一支沙特皇家海军陆战队，用于两栖登陆作战以及海岸和岛屿的防御。"
 SAU_king_faisal_naval_base: "费萨尔国王海军基地"
 SAU_king_faisal_naval_base_desc: "发展吉达和朱拜勒的大型海军基地，以维持一支双舰队的海军。"
 SAU_neom_aqaba_synergy: "新未来城-亚喀巴协同"
 SAU_neom_aqaba_synergy_desc: "在沙特阿拉伯的超级城市新未来城与约旦的亚喀巴港交汇处，可以建立一个横跨海湾的单一经济区，将两岸连接起来，使其成为经济增长的引擎。"
 SAU_deal_with_the_french: "与法国人打交道"
 SAU_deal_with_the_french_desc: "巴黎向所有人出售武器，并对所有人指手画脚，但生意就是生意。一份精心设计的投资协议让王国既能从法国工业中获利，又能确保获得更好的选择。"
 SAU_a_new_iraqi_alignment: "伊拉克新联盟"
 SAU_a_new_iraqi_alignment_desc: "多年的耐心外交和庇护终于结出硕果：巴格达最终向利雅得靠拢。必须巩固这一新的联盟，以免它再次倒向德黑兰。"
 SAU_major_non_nato_ally: "主要非北约盟国"
 SAU_major_non_nato_ally_desc: "除了缔结条约联盟之外，一个国家与大西洋列强之间所能达到的最接近的地位，就是特权伙伴。确保王国成为北约主要盟友之一。"
 SAU_the_palestine_question: "巴勒斯坦问题"
 SAU_the_cause_above_all: "至高无上的事业"
 SAU_the_cause_above_all_desc: "沙特阿拉伯王国将把支持巴勒斯坦作为其在穆斯林世界领导地位及其作为两圣地监护人角色的核心。"
 SAU_open_the_backchannel: "打开秘密渠道"
 SAU_open_the_backchannel_desc: "在第三国，一些沉默寡言、不愿表态、耐心等待的男人们，在双方开口之前，试探特拉维夫方面可能会接受的底线。"
 SAU_the_arab_peace_initiative: "阿拉伯和平倡议"
 SAU_the_arab_peace_initiative_desc: "沙特阿拉伯王国于2002年在贝鲁特提出的方案从未撤回：以1967年边界为基础的独立巴勒斯坦为交换，与整个阿拉伯世界实现全面关系正常化。利雅得正式地以书面形式再次提出这一方案。"
 SAU_sweeten_the_deal: "让交易更诱人"
 SAU_sweeten_the_deal_desc: "投资基金、技术走廊和开放的天空。利雅得向特拉维夫展示了与海湾最大经济体保持和平的价值。"
 SAU_the_talks_collapse: "谈判破裂"
 SAU_the_talks_collapse_desc: "以色列不愿付出代价，利雅得也不愿降低代价。双方代表团各自回国，问题又回到了老样子。"
 SAU_the_riyadh_accords: "利雅得协议"
 SAU_the_riyadh_accords_desc: "以色列接受了阿拉伯和平倡议。该倡议承认以1967年边界为基础建立国家，并由沙特阿拉伯和约旦担保新巴勒斯坦的成立：这项世纪协议在利雅得签署。"
 SAU_embassies_and_trade: "大使馆与贸易"
 SAU_embassies_and_trade_desc: "利雅得和特拉维夫之间的航班、贸易往来和资金流动。和平开始带来实际效益。"
 SAU_silicon_and_sand: "硅与砂"
 SAU_silicon_and_sand_desc: "以色列的技术和沙特阿拉伯的资本是天然的合作伙伴。网络安全、水资源和农业科技领域的合资企业在这两个沙漠地区生根发芽。"
 SAU_double_down_on_palestine: "加倍支持巴勒斯坦"
 SAU_double_down_on_palestine_desc: "如果以色列不肯承认巴勒斯坦建国，沙特王国也会帮助巴勒斯坦建立自己的国家：资金、机构以及沙特在拉马拉的强大影响力。"
 SAU_rally_the_arab_league: "召集阿拉伯联盟"
 SAU_rally_the_arab_league_desc: "失败的谈判向所有动摇的资本证明了这一点。利雅得将联盟聚集在一条线后面：没有巴勒斯坦就没有正常化。"
 SAU_no_peace_without_palestine: "没有巴勒斯坦就没有和平"
 SAU_the_fate_of_palestine: "巴勒斯坦的命运"
 SAU_the_fate_of_palestine_desc: "无论通过条约还是对抗，沙特阿拉伯王国都已将自身与巴勒斯坦的未来紧密相连。两圣地监护人不会放弃耶路撒冷。"
 SAU_no_peace_without_palestine_desc: "只要巴勒斯坦仍被占领，沙特阿拉伯就不会在特拉维夫设立大使馆。沙特阿拉伯王国坚持阿拉伯世界在2002年划定的界限。"
 SAU_normalization_with_conditions: "有条件正常化"
 SAU_normalization_with_conditions_desc: "自阿拉伯和平倡议以来，利雅得的条件始终未变：承认巴勒斯坦建国地位。如果以色列想要得到沙特王国的支持，就必须接受一个独立的巴勒斯坦。"
 SAU_normalization_without_conditions: "无条件正常化"
 SAU_normalization_without_conditions_desc: "沙特阿拉伯王国将在不要求以色列在巴勒斯坦问题上做出让步的情况下承认以色列。这将改善与美国的关系并促进贸易，但也会在整个阿拉伯世界引发强烈反对。"
 SAU_normalization_champion_the_palestinian_cause: "支持巴勒斯坦事业"
 SAU_normalization_champion_the_palestinian_cause_desc: "沙特的资金让拉马拉的电力供应得以维持，也让这项事业在每个阿拉伯国家的首都得以延续。"
 SAU_strengthen_the_resistance: "加强抵抗"
 SAU_strengthen_the_resistance_desc: "只要利雅得在背后支持，抵抗占领的各派就不会缺乏资金和盟友。"
 SAU_boycott_israeli_goods: "抵制以色列商品"
 SAU_boycott_israeli_goods_desc: "一分一毫的沙特里亚尔都不会踏入以色列的货架。沙特市场已经关闭。"
 SAU_pressure_the_normalizers: "给正常化施加压力"
 SAU_pressure_the_normalizers_desc: "任何被特拉维夫的握手所诱惑的阿拉伯政府，都会首先感受到利雅得的不满。这些联盟之所以能够维持，是因为沙特阿拉伯王国掌控着它们。"
 SAU_an_arab_consensus: "阿拉伯共识"
 SAU_an_arab_consensus_desc: "从拉巴特到巴格达，沙特阿拉伯王国在以色列问题上形成了统一的阿拉伯声音：不承认以色列，不与其建立关系，没有任何例外。"
 SAU_the_palestine_question_desc: "每个阿拉伯国家的首都对以色列问题都有自己的答案，但没有一个答案一致。利雅得现在必须做出选择：无条件和平、有条件的和平，还是根本没有和平。"
 SAU_a_deal_with_south_korea: "与韩国达成协议"
 SAU_a_deal_with_south_korea_desc: "韩国造船厂、反应堆和建筑巨头建造了海湾地区大部分现代化设施。韩国首尔是核电、国防工业和“2030愿景”大型项目的合作伙伴。"
 SAU_saudi_china_deal: "沙特-中国协议"
 SAU_saudi_china_deal_desc: "中国企业渴望获得石油合同，并在海湾地区站稳脚跟。可以向它们提供参与沙特阿拉伯农业和能源项目的机会，以换取它们在沙特的投资。"
 SAU_operation_red_gulf: "红色海湾行动"
 SAU_operation_red_gulf_desc: "一旦冷战爆发，沙特阿拉伯王国必须做好准备，将战火蔓延至伊朗海岸。制定在海湾水域发动决定性战役的计划。"
 SAU_palestine_champion_the_palestinian_cause: "支持巴勒斯坦事业"
 SAU_bankroll_the_resistance: "资助抵抗运动"
 SAU_bankroll_the_resistance_desc: "空谈无益。应该向巴勒斯坦各派别提供真金白银和武器，让沙特的影响力而非伊朗的影响力主导这场斗争。"
 SAU_arm_the_militants: "武装武装分子"
 SAU_arm_the_militants_desc: "全力支持武装派别。利雅得成为枪杆子的幕后金主，与德黑兰争夺加沙每一位战士的忠诚。"
 SAU_guardian_of_al_aqsa: "阿克萨清真寺的守护者"
 SAU_guardian_of_al_aqsa_desc: "沙特的支持确保了利雅得在巴勒斯坦的持久作用，并强化了其保卫阿克萨清真寺的主张。"
 SAU_broker_a_two_state_peace: "促成两国和平"
 SAU_broker_a_two_state_peace_desc: "沙特阿拉伯王国将斡旋达成两国方案。如果沙特促成协议成功，将扩大利雅得在整个阿拉伯世界的外交影响力。"
 SAU_palestine_champion_the_palestinian_cause_desc: "巴勒斯坦问题仍然是阿拉伯世界最重要的政治议题之一。支持巴勒斯坦事业将巩固沙特阿拉伯王国在穆斯林世界的领导地位，并对抗伊朗的影响。"
 SAU_ceasefire_with_the_houthis: "与胡塞武装停火"
 SAU_ceasefire_with_the_houthis_desc: "向胡塞武装提出停火协议，以阻止沙特的损失并冻结战线。如果他们接受，和平就意味着要在南部边境与一个武装敌人共存。"
 SAU_the_great_pipeline_game: "伟大的管道游戏"
 SAU_the_great_pipeline_game_desc: "沙特阿拉伯的大部分石油出口都需经过霍尔木兹海峡，这使得它们极易受到伊朗的干扰。沙特王国将考虑三条替代管道路线：经也门通往阿拉伯海、经叙利亚通往地中海，或经伊拉克和土耳其通往欧洲；每条路线都穿越局势不稳的地区，并与俄罗斯的能源利益存在竞争。"
 SAU_prepare_defences_against_saddam: "做好防御萨达姆的准备"
 SAU_prepare_defences_against_saddam_desc: "走投无路的萨达姆非常危险。必须加强北部边境防御，抵御曾经驻扎在科威特的军队，那里距离油田只有一天的车程。"
 SAU_proclaim_the_republic: "宣告成立共和国"
 SAU_proclaim_the_republic_desc: "委员会将正式废除君主制，宣布成立共和国。新国家的机构仍处于动荡之中，但沙特王位在宣言颁布后将不复存在。"
 SAU_reaffirming_the_quincy_agreement: "重申昆西协议"
 SAU_reaffirming_the_quincy_agreement_desc: "1945年2月，罗斯福和阿卜杜勒阿齐兹在昆西号军舰上奠定了沙特与美国关系的基础：美国提供安全支持，以换取沙特可靠的石油供应。安理会将寻求确认这一安排适用于沙特国家，而不仅仅是沙特王室。"
 SAU_the_regency_decree: "摄政法令"
 SAU_the_regency_decree_desc: "国王将签署一项法令，将行政和国防权力移交给委员会，期限未定，以弥补国王丧失行为能力的时间。该法令表面上维持了政府的合法性，实则将政府置于军方控制之下。"
 SAU_master_the_crisis: "掌控危机"
 SAU_master_the_crisis_desc: "无论当初是如何修建这条水道的，现在水已经可以流动了，水利部终于可以制定年度计划而不是按季节计划了。\n\n§Y彻底消除水危机§!。一旦拉斯阿尔海尔或舒艾巴上线，即可使用。\n\n王国停止配给制，开始建设。"
 SAU_arm_the_faithful: "武装信徒"
 SAU_arm_the_faithful_desc: "向革命民兵分发武器并进行训练。"
 SAU_hezbollah_brigades: "真主党旅"
 SAU_hezbollah_brigades_desc: "将民兵组织锻造成纪律严明的旅级部队，效仿黎巴嫩抵抗运动的模式。"
 SAU_shia_civil_rights: "什叶派公民权"
 SAU_shia_civil_rights_desc: "保障什叶派群体在法律面前享有平等地位，结束数十年来官方的歧视。"
 SAU_sectarian_coexistence: "教派共存"
 SAU_sectarian_coexistence_desc: "在逊尼派和什叶派之间缔结以共同公民身份为基础的全国性契约。"
 SAU_the_constitutional_shia_republic: "宪政什叶派共和国"
 SAU_the_federal_welfare_state: "联邦福利国家"
 SAU_the_federal_welfare_state_desc: "建立宪政共和国的制度：一个通过共同繁荣和法治将各个社区团结在一起的联邦福利国家。"
 SAU_the_constitutional_shia_republic_desc: "以宪政共和国为温和路线画上句号，在多元秩序中保障什叶派的权利。"
 SAU_develop_the_eastern_province: "发展东部省"
 SAU_develop_the_eastern_province_desc: "将共和国的石油财富引入长期被忽视的东部什叶派核心地区。"
 SAU_export_the_revolution: "输出革命"
 SAU_export_the_revolution_desc: "将革命带出阿拉伯半岛，带到海湾地区的什叶派穆斯林手中。"
 SAU_federal_autonomy: "联邦自治"
 SAU_federal_autonomy_desc: "在联邦制、多元主义联盟内，将真正的权力下放给什叶派省份。"
 SAU_alliance_with_iran: "与伊朗结盟"
 SAU_alliance_with_iran_desc: "将新国家与德黑兰 - 该地区什叶派革命的庇护者 - 捆绑在一起。"
 SAU_the_islamic_republic_of_arabia: "阿拉伯伊斯兰共和国"
 SAU_the_revolutionary_state: "革命国家"
 SAU_the_revolutionary_state_desc: "伊斯兰共和国将把其机构、民兵和宗教人士集中到一个纪律严明的革命政府之下，该政府与抵抗运动保持一致。"
 SAU_the_islamic_republic_of_arabia_desc: "宣布建立由法学家监护、与抵抗轴心结盟的伊斯兰共和国。"
 SAU_shia_national_dialogue: "全国对话"
 SAU_shia_national_dialogue_desc: "应该通过谈判和投票来为什叶派寻求补偿，而不是对抗。"
 SAU_the_parliamentary_path: "议会之路"
 SAU_the_parliamentary_path_desc: "将运动交由民选议会发起，作为忠诚的反对派公开挑战权力。"
 SAU_reconcile_with_the_republic: "与共和国和解"
 SAU_reconcile_with_the_republic_desc: "埋葬旧怨，接受国家框架内的位置，用革命换取代表权。"
 SAU_guarantee_religious_freedom: "保障宗教自由"
 SAU_guarantee_religious_freedom_desc: "在宽容的世俗共和国中，保护每个社群的宗教仪式和神学院。"
 SAU_the_republic_endures: "共和国永存"
 SAU_the_republic_endures_desc: "过渡时期已经结束。什叶派共和国现在通过常设机构进行统治，公民必须将其视为阿拉伯半岛的永久国家。"
 SAU_the_resistance: "抵抗"
 SAU_the_resistance_desc: "号召信徒们按照汉志真主党的精神进行武装斗争。"
 SAU_the_revolutionary_vanguard: "革命先锋队"
 SAU_the_revolutionary_vanguard_desc: "将武装神职人员置于国家元首，凌驾于政党和议会之上。"
 SAU_wilayat_al_faqih: "法基赫的监护"
 SAU_wilayat_al_faqih_desc: "确立法学家的监护权，将最终权力赋予最高宗教领袖。"
 SAU_the_national_charter: "国家宪章"
 SAU_the_national_charter_desc: "颁布一部成文宪法，使统治者和被统治者都受到法律的约束。"
 SAU_liberalize_the_economy: "经济自由化"
 SAU_liberalize_the_economy_desc: "让封闭的经济体系向竞争和私营企业开放。"
 SAU_privatize_the_state_sector: "将国有部门私有化"
 SAU_privatize_the_state_sector_desc: "将臃肿的国有企业出售给私人企业，让市场发挥作用。"
 SAU_open_to_foreign_investment: "欢迎外国投资"
 SAU_open_to_foreign_investment_desc: "欢迎外资来建设王国从未有过的工厂。"
 SAU_diversify_beyond_oil: "摆脱对石油的依赖，实现多元化发展"
 SAU_diversify_beyond_oil_desc: "让共和国摆脱对原油的依赖，建立一个比油井更持久的经济体系。"
 SAU_secure_property_rights: "保障产权"
 SAU_secure_property_rights_desc: "维护拥有权和保留自己所创造之物的权利。"
 SAU_free_trade_agreements: "自由贸易协定"
 SAU_free_trade_agreements_desc: "签署将阿拉伯世界与世界市场联系起来的开放贸易协定。"
 SAU_an_independent_central_bank: "独立中央银行"
 SAU_an_independent_central_bank_desc: "使金融监管免受政治干预。"
 SAU_champion_the_private_sector: "支持私营部门"
 SAU_champion_the_private_sector_desc: "支持那些推动自由经济发展的企业家和小企业。"
 SAU_equality_for_women: "妇女平等"
 SAU_equality_for_women_desc: "废除监护法，让妇女在公共生活中享有与男性平等的地位。"
 SAU_reform_the_schools: "改革学校"
 SAU_reform_the_schools_desc: "用现代化的世俗课程取代死记硬背的文书教学。"
 SAU_an_elected_majlis_al_shura: "民选协商会议"
 SAU_an_elected_majlis_al_shura_desc: "将委任的咨询委员会转变为自由选举产生的国民议会。"
 SAU_freedom_of_religion: "Freedom of Religion"
 SAU_freedom_of_religion_desc: "保障每一种信仰自由公开地进行宗教活动的权利。"
 SAU_nda_secular_republic: "世俗共和国"
 SAU_nda_secular_republic_desc: "明确划分清真寺与国家之间的界限。"
 SAU_empower_civil_society: "赋权公民社会"
 SAU_empower_civil_society_desc: "将工会、慈善机构和社团合法化，使自由的人民团结起来。"
 SAU_guarantee_labor_rights: "保障劳动者权益"
 SAU_guarantee_labor_rights_desc: "保障组织权、罢工权和获得公平工资的权利。"
 SAU_a_human_rights_charter: "人权宪章"
 SAU_a_human_rights_charter_desc: "将共和国与全体人民的普世权利联系起来。"
 SAU_realign_with_the_west: "与西方重新结盟"
 SAU_realign_with_the_west_desc: "让共和国与华盛顿和布鲁塞尔建立伙伴关系，成为民主国家中的伙伴。"
 SAU_mend_the_gulf: "修复海湾"
 SAU_mend_the_gulf_desc: "与海湾国家和解，视其为阿拉伯同胞，包括所有君主制国家。"
 SAU_join_the_worlds_institutions: "加入世界机构"
 SAU_join_the_worlds_institutions_desc: "代表阿拉伯在国际秩序的各个机构中占有一席之地。"
 SAU_open_the_borders: "开放边境"
 SAU_open_the_borders_desc: "促进人员和货物在更自由的边境地区的流动。"
 SAU_an_arab_democratic_league: "阿拉伯民主联盟"
 SAU_an_arab_democratic_league_desc: "将阿拉伯世界的民主国家团结在利雅得领导的同一面旗帜下。"
 SAU_the_first_free_elections: "首次自由选举"
 SAU_the_first_free_elections_desc: "向所有公民开放投票权，让人民选择自己的政府。"
 SAU_an_independent_judiciary: "独立的司法机构"
 SAU_an_independent_judiciary_desc: "将法院从宫廷中解放出来，建立一个只对法律负责的司法机构。"
 SAU_freedom_of_the_press: "新闻自由"
 SAU_freedom_of_the_press_desc: "让审查员的手从报纸和广播中撤走。"
 SAU_the_anti_corruption_commission: "反腐败委员会"
 SAU_the_anti_corruption_commission_desc: "找到一个独立的监督机构，以根除高层官员中的贪污腐败。"
 SAU_decentralize_the_provinces: "下放省权"
 SAU_decentralize_the_provinces_desc: "将实权移交给全国范围内选举产生的省议会。"
 SAU_limit_the_executive: "限制行政权力"
 SAU_limit_the_executive_desc: "对总统职位设定任期限制，防止任何领导人终身执政。"
 SAU_the_provisional_government: "临时政府"
 SAU_convene_the_national_assembly: "召开国民议会"
 SAU_convene_the_national_assembly_desc: "临时政府将召集新共和国的各个政党，决定哪个政党将领导这个永久国家。"
 SAU_the_communist_party: "共产党"
 SAU_the_communist_party_desc: "沙特共产党在地下、流亡或监禁中度过了四十年。其幸存的领导层带着一支规模虽小但组织严密的运动重返利雅得。"
 SAU_the_national_democratic_assembly: "全国民主大会"
 SAU_the_national_democratic_assembly_desc: "将新共和国交给国民民主大会的自由民主党人。他们承诺制定成文宪法，建立民选议会，并实行对选民负责的开放经济。"
 SAU_the_arab_baath_party: "阿拉伯复兴党"
 SAU_the_arab_baath_party_desc: "将共和国交给阿拉伯复兴社会党，这个世俗的泛阿拉伯民族主义者梦想建立一个统一的阿拉伯国家。"
 SAU_the_islamic_parties: "伊斯兰政党"
 SAU_the_islamic_parties_desc: "萨赫瓦教士、穆斯林兄弟会网络和伊斯兰慈善团体在多次禁令中幸存下来，现在要求在后革命政府中发挥作用。"
 SAU_the_provisional_government_desc: "过渡国民委员会治理着一个没有宪法、没有选举、未来未定的国家。它的首要任务是维持秩序，并为未来建立共和国奠定基础。"
 SAU_restoration_of_relations: "恢复关系"
 SAU_restoration_of_relations_desc: "多年断绝关系后，双方谨慎地重新互通大使馆。在不损害沙特王国利益的前提下，妥善处理与伊斯兰共和国之间危险的缓和关系。"
 SAU_the_house_that_rules_the_kingdom: "统治王国的家族"
 SAU_the_house_that_rules_the_kingdom_desc: "沙特王朝统治阿拉伯中部地区已数代之久。自法赫德国王1995年中风以来，§Y实际权力§!已转移到争夺王位继承权的高级王子手中。"
 SAU_sanction_the_southern_bloc: "对南方集团实施制裁"
 SAU_sanction_the_southern_bloc_desc: "切断伊朗在该地区盟友的财政来源。制裁和黑名单使德黑兰的盟友失去维系其忠诚的资金。"
 SAU_saddam_falls: "萨达姆陨落"
 SAU_saddam_falls_desc: "雕像倒塌，政权垮台，曾经伟大的阿拉伯国家如今只剩下一个权力真空。利雅得必须在德黑兰填补这一空缺之前采取行动。"
 SAU_saddam_endures: "萨达姆长存"
 SAU_saddam_endures_desc: "复兴党政权在风暴中幸存下来，虽受重创但并未崩溃。宿敌依然盘踞在北部边境，王国不得不继续与巴格达暴君共存一段时间。"
 SAU_saudi_economic_focus_tree: "沙特经济国策树"
 SAU_saudi_economic_focus_tree_desc: "石油是经济命脉，外籍劳工承担了大部分工作，而沙特资本却常常流向国外。未来的经济必须更多地依靠国内生产，雇用更多沙特公民，并让利雅得以外的城市也能分享增长的成果。"
 SAU_national_water_company: "国家水务公司"
 SAU_national_water_company_desc: "王国自行建设供水系统。一家国有企业，一项指令，就将管道输送到那些从商业角度来看根本不值得投资的城镇。\n\n§G向国家水务公司§!和§G内志的一项基础设施§!提供拨款，§Y并以此缓解水危机§!。\n\n比外包更慢也更贵。而且它仍然属于沙特。"
 SAU_a_saudi_spanish_partnership: "沙特阿拉伯与西班牙的伙伴关系"
 SAU_a_saudi_spanish_partnership_desc: "西班牙船厂为沙特阿拉伯王国建造新型轻型护卫舰，西班牙公司则负责修建通往麦加的高速铁路。要努力将马德里培养成欧洲圈外一个有用的合作伙伴。"
 SAU_sermons_from_the_ministry: "来自牧师的讲道"
 SAU_sermons_from_the_ministry_desc: "宗教部将修订分发至全国各清真寺的周五主麻日演讲稿。一份由约一万五千个讲坛宣读的统一文本，将使政府对宗教信息的传播拥有直接的影响力。"
 SAU_recognize_the_shia_clergy: "承认什叶派神职人员"
 SAU_recognize_the_shia_clergy_desc: "允许§Y什叶派乌里玛§!官员站在瓦哈比派机构旁边。\n\n§G+稳定度，+什叶派人口§!"
 SAU_crackdown_on_shia_dissent: "镇压什叶派异议"
 SAU_crackdown_on_shia_dissent_desc: "Answer dissent with the §YMabahith§! and the §YNational Guard§!. The Shia will be watched, contained and pushed to the margins - and the Sunni majority will rest easier for it.\n\n§R+Shia Resistance§!, §R-Shia Population§!, §G+Stability, +War Support§!."
 SAU_sunni_shia_dialogue: "Sunni-Shia Dialogue"
 SAU_sunni_shia_dialogue_desc: "A national dialogue to begin healing fourteen centuries of schism.\n\n§G-Shia Resistance, +Stability, +Shia Population§!."
 SAU_invest_in_the_eastern_province: "投资东部省份"
 SAU_invest_in_the_eastern_province_desc: "Pour petrodollars into the Shia heartland - roads, hospitals, ports.\n\n§G+Stability, +Shia Population§!."
 SAU_resettling_the_eastern_province: "重新安置东部省"
 SAU_resettling_the_eastern_province_desc: "The Shia question is settled at last. The §YEastern Province§! is quieted through patient resettlement for a generation.\n\n§R--Shia Population§!, §Gresistance broken§!, §G++Stability§!."
 SAU_economic_inclusion: "经济包容性"
 SAU_economic_inclusion_desc: "Share the wealth of the oilfields with the people who live above them. The sectarian wound finally begins to close.\n\n§Gresistance ended, +Stability, +Shia Population§!."
 SAU_equal_educational_access: "Equal Educational Access"
 SAU_equal_educational_access_desc: "Build schools and universities in §YQatif§! and §YAl-Ahsa§! to match those of the Najd.\n\n§G+Stability, +Shia Population§!."
 SAU_embrace_shia_citizens: "Embrace Shia Citizens"
 SAU_embrace_shia_citizens_desc: "Welcome the Shia as full citizens - and begin a journey that could end with the §YHouse of Saud§! itself reconsidering the faith it was built to suppress.\n\n§G+Shia Population, -Shia Resistance§!."
 SAU_sectarian_harmony: "Sectarian Harmony"
 SAU_sectarian_harmony_desc: "Sunni and Shia, one nation under one crown.\n\n§Gresistance ended, +Stability, +Shia Population§!."
 SAU_integrate_the_communities: "Integrate the Communities"
 SAU_integrate_the_communities_desc: "Open the army, the police and the bureaucracy to Shia citizens who swear loyalty to the crown.\n\n§G-Shia Resistance, +Stability, +Shia Population§!."
 SAU_the_shia_question: "The Shia Question"
 SAU_the_shia_question_desc: "About two million §YShia§! citizens live in the oil-producing §YEastern Province§!. The §YHouse of Saud§! must choose between repression, accommodation, or a fundamental change in its religious policy."
 SAU_rehabilitate_the_detainees: "Rehabilitate the Detainees"
 SAU_rehabilitate_the_detainees_desc: "Release the political prisoners of the Eastern Province and bring them back into Saudi society.\n\n§G-Shia Resistance, +Stability§!."
 SAU_shia_political_representation: "Shia Political Representation"
 SAU_shia_political_representation_desc: "Seats in the §YShura Council§! for the Shia of the Eastern Province.\n\n§G-Shia Resistance, +Stability, +Shia Population§!."
 SAU_security_clampdown: "Security Clampdown"
 SAU_security_clampdown_desc: "Flood the Eastern Province with checkpoints, informants and rapid-reaction forces.\n\n§R+Shia Resistance§!, §R-Shia Population§!, §G+War Support§!."
 SAU_sectarian_settlement: "Sectarian Settlement"
 SAU_sectarian_settlement_desc: "The Kingdom has settled the Shia question through repression, accommodation, or conversion and can now consolidate the resulting policy.\n\n§G+Stability, +Political Power§!."
 SAU_the_house_of_saud_embraces_shiaism: "The House of Saud Embraces Shiaism"
 SAU_the_house_of_saud_embraces_shiaism_desc: "The unthinkable: the §YRoyal Family§! formally adopts §YTwelver Shiaism§!. Centuries of Wahhabi orthodoxy are overturned by a single decree. The §YEastern Province§! rejoices; the §YNajd§! and the §Yulema§! reel.\n\n§G++Shia Population§!, §Gresistance ended§!, §Radopt the Shia faith§!, §R-Stability§! (for now)."
 SAU_sunni_supremacy: "Sunni Supremacy"
 SAU_sunni_supremacy_desc: "Enshrine Sunni primacy in the law, the schools and the mosque. There is one true faith in the Kingdom, and it is not theirs.\n\n§R-Shia Population§!, §G+Stability, +War Support§!."
 SAU_suppress_the_clerics: "Suppress the Clerics"
 SAU_suppress_the_clerics_desc: "Silence the firebrand preachers of §YQatif§! and §YAwamiyah§! before their sermons become slogans.\n\n§R+Shia Resistance§!, §R-Shia Population§!."
 SAU_sunni_shia_tolerance: "Sunni-Shia Tolerance"
 SAU_sunni_shia_tolerance_desc: "Neither persecute nor convert - simply coexist. Ease the restrictions, let the Shia worship in peace, and let the Kingdom breathe.\n\n§G-Shia Resistance, +Stability, +Shia Population§! (no change of faith)."
 SAU_stir_the_axis_of_resistance: "Stir the Axis of Resistance"
 SAU_stir_the_axis_of_resistance_desc: "Iran's strength is a chain of proxies from Lebanon to Yemen, and every link has its discontents. Fund the protests and fractures that turn Tehran's allies into liabilities."
 SAU_foreign_volunteers_for_the_rebels: "Foreign Volunteers for the Rebels"
 SAU_foreign_volunteers_for_the_rebels_desc: "Money alone will not win the war. Open the pipelines that bring fighters and materiel across the borders to the opposition's front lines."
 SAU_direct_intervention_in_yemen: "Direct Intervention in Yemen"
 SAU_direct_intervention_in_yemen_desc: "Send in the Saudi army. A direct campaign promises a faster decision and a clearer victory, and risks a quagmire that bleeds the Kingdom for years."
 SAU_a_proxy_war_in_yemen: "A Proxy War in Yemen"
 SAU_a_proxy_war_in_yemen_desc: "Fight the war through others. Bankroll the exiled government, the southern militias and the tribes, and let Yemenis do the dying while Saudi jets watch from above."
 SAU_supreme_military_council: "Supreme Military Council"
 SAU_supreme_military_council_desc: "The provisional military council will receive a permanent charter and formal membership rules. Rank will determine membership, while command during the coup will continue to shape influence within the Council."
 SAU_the_amman_bailout: "The Amman Bailout"
 SAU_the_amman_bailout_desc: "The Hashemite Kingdom is a fragile buffer against the chaos to its north, and it is broke. Keep Jordan solvent and loyal with the Kingdom's chequebook."
 SAU_the_battle_for_the_straits: "The Battle for the Straits"
 SAU_the_battle_for_the_straits_desc: "Whoever commands the Strait of Hormuz commands a fifth of the world's oil. Prepare the Kingdom and its allies to break Iran's grip on the world's most important waterway."
 SAU_the_islamic_rivalry: "The Islamic Rivalry"
 SAU_the_islamic_rivalry_desc: "Iran promotes its revolutionary model and supports armed groups from Lebanon to Yemen. Saudi Arabia will contest Iranian leadership through media, regional partners, and preparations for possible conflict in the Gulf."
 SAU_the_levant_strategy: "The Levant Strategy"
 SAU_the_levant_strategy_desc: "Syria burns and Jordan teeters, and beyond them lies the road to the Mediterranean. Shape the Levant to Saudi advantage before Iran and its friends do it first."
 SAU_the_new_order_over_the_kingdom: "The New Order over the Kingdom"
 SAU_the_new_order_over_the_kingdom_desc: "The emergency government has become a permanent political order. Repeated renewals of military authority have removed any practical distinction between temporary measures and normal rule."
 SAU_the_silk_road_pivot: "The Silk Road Pivot"
 SAU_the_silk_road_pivot_desc: "China is the largest buyer of Saudi crude and does not condition economic cooperation on domestic political reform. The Belt and Road Initiative offers ports, railways, and capital, but the relationship remains primarily transactional."
 SAU_the_silk_web_network: "The Silk Web Network"
 SAU_the_silk_web_network_desc: "Information is a weapon, and the Kingdom intends to wield it. Weave a web of media outlets, clerics and online voices that carries Riyadh's message across the region."
 SAU_the_american_shield: "The American Shield"
 SAU_the_american_shield_desc: "Tie the Kingdom's defence irreversibly to the United States: basing, intelligence, and the unspoken guarantee that an attack on Riyadh is an attack on Washington's interests. The price is dependence on a single patron."
 SAU_the_succession_question: "The Succession Question"
 SAU_the_succession_question_desc: "Thousands of princes retain status and potential claims under the old order. The government must decide whether to pension, exile, prosecute, or politically marginalize them."
 SAU_the_spirit_of_taif: "塔伊夫的精神"
 SAU_the_spirit_of_taif_desc: "沙特阿拉伯斡旋达成的《塔伊夫协议》曾结束黎巴嫩内战，并使沙特王国在贝鲁特发挥了重要作用。重拾这一角色，将黎巴嫩从伊朗的势力范围中夺回。"
 SAU_the_yemen_quagmire: "The Yemen Quagmire"
 SAU_the_yemen_quagmire_desc: "The war in Yemen has been costly, but it has also drawn Iran into a trap, exposed as the patron of the Houthi missiles falling on Riyadh. Turn the quagmire into a weapon of diplomacy."
 SAU_the_yemeni_peace_talks: "The Yemeni Peace Talks"
 SAU_the_yemeni_peace_talks_desc: "每一场战争都终结于谈判桌。让也门各派系接受条件，确保王国南部边境的安全。"
 SAU_defeat_in_syria: "叙利亚的失败"
 SAU_defeat_in_syria_desc: "叙利亚政权依靠俄罗斯战机和伊朗民兵的支持得以延续。王国必须及时止损，从一场无法取胜的战争中尽可能挽回影响力。"
 SAU_total_victory_in_the_civil_war: "内战全面胜利"
 SAU_total_victory_in_the_civil_war_desc: "彻底粉碎胡塞武装，恢复一个完全听命于利雅得的单一政府。也门将成为一个名义上独立、实则受沙特保护的附庸国。"
 SAU_victory_in_syria: "叙利亚的胜利"
 SAU_victory_in_syria_desc: "大马士革陷落，伊朗通往真主党的陆桥也随之断裂。叙利亚出现友好政府，为沙特影响力打开了黎凡特的大门，也为沙特管道打开了地中海通道。"
 SAU_a_partnership_with_britain: "与英国的合作"
 SAU_a_partnership_with_britain_desc: "从阿尔-亚玛玛合同到沙特军官的培训，伦敦一直是较为低调却更为可靠的朋友。与英国正式建立战略伙伴关系。"
 SAU_benign_dominance: "善意的主导者"
 SAU_benign_dominance_desc: "利雅得采取§G较为温和的方式§!：投资、庇护，并尊重较小埃米尔国的尊严。主导而不霸凌。"
 SAU_command_and_control: "指挥与控制"
 SAU_command_and_control_desc: "联合指挥中心、一体化防空与共享情报将为半岛之盾提供统一的作战架构。"
 SAU_common_market: "共同市场"
 SAU_common_market_desc: "一个统一的监管框架：一套标准、一份海关文件、一个拥有§Y5000万消费者§!的区域市场。"
 SAU_cross_border_transit_systems: "跨境运输体系"
 SAU_cross_border_transit_systems_desc: "高速公路、铁路和管道将半岛紧密相连。长期讨论却从未建成的§Y海合会铁路§!终于破土动工。"
 SAU_economic_union: "经济联盟"
 SAU_economic_union_desc: "一个统一的§Y关税区§!、协调一致的法规，以及横跨半岛的§Y共同市场§!基础。§Y吉达§!和§Y迪拜§!的商人们为此等待了一代人。"
 SAU_exploit_authority: "利用权威"
 SAU_exploit_authority_desc: "沙特阿拉伯将通过§Y经济压力§!和其他强制措施对不服从的成员国施加霸权。联盟将作为一个§G沙特主导的集团§!运作。"
 SAU_the_gulf_cooperation_council: "海湾合作委员会"
 SAU_the_gulf_cooperation_council_desc: "二十年来，§Y海湾合作委员会§!主要作为海湾君主国之间的协商论坛运作。利雅得将把它扩展为一个更有效的区域组织。"
 SAU_the_gulf_academy: "海湾学院"
 SAU_the_gulf_academy_desc: "§Y利雅得§!的统一军官培训学院。来自海湾合作委员会各成员国的未来将领们将同堂学习，共享同一套军事学说，并§Y效忠于联盟§!。"
 SAU_increase_autonomy: "独立自主"
 SAU_increase_autonomy_desc: "更加§Y独立的外交政策§!。海合会在国际论坛上为自己发声——不是作为美国的附庸，而是作为一个§Y地区强国§!。\n\n§Y海合会庇护者的三条道路之一§! - §Y华盛顿§!、§Y新伙伴§!或§Y独立自主§!。它们按此顺序开放：只有当美国人§R拒绝§!你之后，你才能转向新伙伴；只有当两者都拒绝你之后，你才能单干。§R你每选择一条路径，就会永久关闭之前的路径。§! "
 SAU_intra_gcc_trade: "海合会内贸易"
 SAU_intra_gcc_trade_desc: "取消成员国之间最后的关税壁垒。从§Y马斯喀特§!到§Y科威特城§!，货物、资本和劳动力自由流动。"
 SAU_joint_defense_agreement: "联合防卫协定"
 SAU_joint_defense_agreement_desc: "一项§Y第五条§!式的共同防御协定：对一国的攻击即是对所有国家的攻击。§Y伊朗§!将注意到这一点。"
 SAU_joint_research_initiatives: "倡导联合科研"
 SAU_joint_research_initiatives_desc: "一项共享的§Y技术基金§!汇集资源用于海水淡化、太阳能和石化研发。§Y阿卜杜拉国王科技大学§!成为区域中心。"
 SAU_gcc_joint_ventures: "海合会合资企业"
 SAU_gcc_joint_ventures_desc: "海合会将协调国防生产、采购和维护。沙特资本、§Y阿联酋后勤§!和§Y巴林造船厂§!将支持一个共享的军事工业体系。"
 SAU_the_khaleeji_union: "海湾联盟"
 SAU_the_khaleeji_union_desc: "六个君主国将组成一个邦联，在外交、国防和货币方面共享权力。§Y海湾联盟§!将由§Y利雅得§!领导。"
 SAU_military_union: "军事同盟"
 SAU_military_union_desc: "§Y半岛之盾§!自1984年以来一直存在，但实际整合程度有限。利雅得将建立联合指挥部、共享采购和共同学说。"
 SAU_new_partners: "新的伙伴"
 SAU_new_partners_desc: "超越华盛顿：与§Y北京§!、§Y莫斯科§!、§Y德里§!和§Y布鲁塞尔§!打交道。半岛使其庇护者多样化。\n\n§Y海合会庇护者的三条道路之一§! - §Y华盛顿§!、§Y新伙伴§!或§Y独立自主§!。它们按此顺序开放：只有当美国人§R拒绝§!你之后，你才能转向新伙伴；只有当两者都拒绝你之后，你才能单干。§R你每选择一条路径，就会永久关闭之前的路径。§!"
 SAU_political_union: "政治联盟"
 SAU_political_union_desc: "协调一致的外交政策。共同的外交路线。较小的酋长国担心§Y沙特主宰§! - 但利雅得坚称这是§Y君主之间的平等§!伙伴关系。"
 SAU_solidify_pro_american_alignment: "巩固亲美联盟"
 SAU_solidify_pro_american_alignment_desc: "§Y海合会§!正式确定了与华盛顿的安全伙伴关系。基地、训练、武器、情报 - 全部通过利雅得输送。\n\n§Y海合会庇护者的三条道路之一§! - §Y华盛顿§!、§Y新伙伴§!或§Y独立自主§!。它们按此顺序开放：只有当美国人§R拒绝§!你之后，你才能转向新伙伴；只有当两者都拒绝你之后，你才能单干。§R你每选择一条路径，就会永久关闭之前的路径。§!"
 SAU_pursue_hegemony: "追求霸权"
 SAU_pursue_hegemony_desc: "利雅得将以对其他海湾合作委员会君主国的直接统治取代非正式领导。这些君主国或许会反对，但沙特的经济和军事压力将限制它们的抵抗能力。"
 SAU_a_robust_alliance: "强大的同盟"
 SAU_a_robust_alliance_desc: "§Y半岛之盾§!将成为拥有现代化装备和统一学说的十万兵力作战部队。"
 SAU_shared_currency: "共同货币"
 SAU_shared_currency_desc: "§Y海湾第纳尔§! - 海湾合作委员会的单一货币，不与美元挂钩，而是与一篮子货币。这是半岛有史以来最大胆的经济举措。"
 SAU_the_yemeni_civil_war: "也门内战"
 SAU_the_yemeni_civil_war_desc: "胡塞武装已夺取首都，迫使国际公认的政府流亡海外，伊朗的势力正逐步扎根于阿拉伯半岛的门前。王国必须决定要付出多大代价来扭转这一局面。"
 SAU_sabotage_the_regimes_backers: "破坏政权支持者"
 SAU_sabotage_the_regimes_backers_desc: "王国每送出一支枪，德黑兰和莫斯科就送出两支。因而我们要在暗处行动，破坏支撑大马士革的补给线和代理人。"
 SAU_the_national_industrial_strategy_gdp_tt: "国家§YGDP§!超过§G$1500B§!"
 SAU_stc_privatization_gdp_tt: "国家§YGDP§!超过§G$1500B§!"
