 sp_improved_nuclear_ballistic_warhead_delivery_systems: "개량형 탄도 탄두 운반 체계"
 sp_improved_nuclear_ballistic_warhead_delivery_systems_desc: "핵탄두 개발 과정에서 우리는 미사일 장비의 사거리를 늘리고 개선할 수 있었습니다."
 sp_fusion_reactors_special_project_idea: "핵융합로"
 sp_improved_nuclear_reactor_centrifuge_technology_idea: "개량형 원자로 원심분리기"
 sp_improved_based_solar_farms_idea: "개량형 태양광 발전소"
