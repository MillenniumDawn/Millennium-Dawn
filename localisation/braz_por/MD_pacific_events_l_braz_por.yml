l_braz_por:
 Solomon_Islands.1.t:0 "The Munda Accord"
 Solomon_Islands.1.d:0 "Following intensive mediation by Commonwealth Special Envoy Sitiveni Rabuka, the provincial government and opposition leaders have signed the Munda Accord. The agreement outlines a Nine-Point Plan intended to de-escalate ethnic violence and establish a roadmap for constitutional reform."
 Solomon_Islands.1.a:0 "A fragile peace is better than none"
 Solomon_Islands.2.t:0 "The Malaita Eagle Force Coup"
 Solomon_Islands.2.d:0 "The political situation has reached its breaking point. Early this morning, members of the Malaita Eagle Force, reportedly aided by elements of the paramilitary police force, seized control of key strategic points in Honiara. Prime Minister [SOL.GetLeader] has been placed under house arrest at gunpoint. The Malaita Eagle Force leadership claims the government failed to protect Malaitan interests and is demanding an immediate transition of power. The democratic process has been effectively suspended. "
 Solomon_Islands.2.a:0 "Manasseh Sogavare"
 Solomon_Islands.2.b:0 "Jimmy 'Rasta' Lusibaea"
 Solomon_Islands.5.t:0 "Request for Mediation"
 Solomon_Islands.5.d:0 "In a desperate bid to prevent a total humanitarian catastrophe,  [FROM.GetNameWithFlag] has formally requested that we host a peace summit. Their proposal suggests a framework for reconciliation through decentralisation and autonomy reforms to appease ethnic factions. Furthermore, they have requested a contingent of administrative and military advisors to ensure the reform process remains uninterrupted by militant interference."
 Solomon_Islands.6.t:0 "Rejection of Mediation"
 Solomon_Islands.6.d:0 "[SOL.GetNameWithFlag] has bluntly rejected our offer to mediate the ongoing crisis. In a stern communiqué, the leadership stated they will not tolerate neo-colonial meddling in their domestic affairs. They have made it clear that foreign advisors and diplomatic interference are not welcome, insisting that the Solomon Islands will resolve its own disputes without external oversight. "
 Solomon_Islands.6.a:0 "Then they shall face the consequences alone."
 Solomon_IslandsNews.1002.t:0 "Coup d'état in the Solomon Islands"
 Solomon_IslandsNews.1002.d:0 "The Malaita Eagle Force, a Malaitan militant organisation, has seized the capital. Using stolen police weaponry and supported by rogue elements of the Police Field Force, the Malaita Eagle Force surrounded the residence of Prime Minister Bartholomew Ulufa'alu early this morning. Under heavy guard and with the city's armoury in rebel hands, Ulufa'alu was forced to tender his resignation. The Malaita Eagle Force-backed government now claims to be the sole authority in Honiara."
 Solomon_IslandsNews.1002.a:0 "A Looming Storm"
 SOL_Lead_to_hostilities_TT:0 "This will lead to §RHostilities§! in the [SOL.GetNameWithFlag]"
 SOL_IFM: "Isatabu Freedom Movement"
 Solomon_Islands.0.t: "Mounting Ethnic Tensions in Honiara"
 Solomon_Islands.0.d: "Mistreatment of Malaitan migrants in Guadalcanal has continued to spark ethnic friction on the islands. Thousands of Malaitans have already been forced to flee their homes by the group known as the Isatabu Freedom Movement, and roadblocks have been set up around the capital to prevent free movement into the province. \n\nWhile our police are seemingly overrun or compromised, we can only sit back and hope things don't continue to get out of hand."
 Solomon_Islands.0.a: "This will all blow over."
 Solomon_Islands.7.t: "All Quiet Across the Waves"
 Solomon_Islands.7.d: "The Australian government has refused our request for intervention, leaving us to our own devices in terms of dealing with the coming storm."
 Solomon_Islands.7.a: "We are truly alone."
 Solomon_Islands.8.t: "The Intervention Fails"
 Solomon_Islands.8.d: "In light of the intervention's unequivocal failure, the Australian forces have opted to cut their losses and have begun withdrawing from the Islands. Without enough troops of our own to defend the country, we are very likely to descend into another crisis. Despite all our efforts, we have failed to offset the inevitable."
 Solomon_Islands.8.a: "Darkness falls over the Islands"
 SOL_worsening_ethnic_tensions_TT: "Ethnic tensions will §Rworsen§!"
 SOL_munda_accords: "Munda Accords"
 SOL_munda_accords_desc: "After the escalations of the 90's, a series of provisions have been instituted to mitigate the tensions brought on by increased migration within the country. The Accord restricts the movement of unemployed vagrants across provinces, enforces the repatriation of Malaitians to their local province, and blocks foreign land acquisitions."
 SOL_western_logging_efforts: "Western Logging Efforts"
 SOL_western_logging_efforts_desc: "Commercial logging in the Western Province has quickly become our most profitable industry, comprising the majority of our exports and providing an economic pillar for the region. Recently, however, its success has drawn in an influx of migrants from across the islands looking for work. Leading to an extenuating migrant crisis in the region."
 SOL_aftermath_of_the_tensions: "Aftermath of the Tensions"
 SOL_aftermath_of_the_tensions_desc: "While the 1999 Accord has led to more recognition and legal pathways for the various cultural disputes, a state of fragile peace exists on the Islands. Unless we can get a handle on the state of the government, and solve the ongoing migration issues in the country, we may not be able to stop another crisis emerging. \n§W--------------§!\nThis national spirit will be §GRemoved§! if stability is higher than §Y70%§! and corruption level is §Y(3) modest§! or higher."
 SOL_agreement_with_the_gangs: "Agreement with the Gangs"
 SOL_agreement_with_the_gangs_desc: "Our deal with the Isatabu Freedom Movement has brought us some much needed breathing room at the cost of letting dozens of high profile criminals out on the streets. Our police are now dealing with a high uptick in crime, while our trust with the public has reached all time lows."
 Solomon_Islands.5.a:0 "Accept the peace process"
 Solomon_Islands.5.b:0 "It is our internal struggle, others get off"