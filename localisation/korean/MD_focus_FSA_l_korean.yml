l_korean:
 FSA_extremism1: "낮은 급진 세력의 영향력"
 FSA_extremism1_desc: "자유 시리아군은 본래 체제에 대한 민주적이고 세속적인 대안을 주장하며 이탈한 장교들이 결성했으나, 장기화된 분쟁과 반체제 세력의 분산된 성격 탓에 더 급진적인 파벌이 세를 넓힐 수 있었습니다. 아흐라르 알샴, 알누스라 전선 같은 이슬람주의 성향 단체들이 자유 시리아군 간판을 단 연합체와 나란히 또는 그 내부에서 활동하는 일이 점점 늘고 있습니다. 이들 단체는 더 폭넓은 자유 시리아군 명칭을 이용해 정통성과 자원을 얻으면서 온건 세력과 극단 세력의 경계를 흐려 놓았습니다."
