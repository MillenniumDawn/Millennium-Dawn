 GENERIC_krepost_state_defense_bureau_desc: "Un exportateur discret sous licence d'État, spécialisé dans les MANPADS et missiles guidés antichars, approvisionnant ses clients via des intermédiaires non marqués."
 GENERIC_north_plains_heavy_industries_desc: "Une usine héritée de l'ère soviétique, produisant des armes d'infanterie à grande échelle, optimisée pour le volume plutôt que la qualité."
 GENERIC_sentinel_grid_networks_desc: "Un sous-traitant signaux et C2 proposant des solutions de compression de la chaîne de ciblage aux armées dépourvues d'infrastructure de commandement intégrée."
 GENERIC_brunn_heavy_engineering_werke_desc: "Une maison d'ingénierie d'Europe centrale aux racines impériales habsbourgeoises, produisant des systèmes d'artillerie sous licence et originaux."
 GENERIC_reichswerke_konstrukt_dynamik_desc: "Un développeur d'armement mitteleuropéen à double filière, couvrant l'artillerie chenillée et les chars de combat."
 GENERIC_vector_defense_labs_desc: "Un intégrateur de défense antimissile axé sur le coût, fondé sur la doctrine que l'interception par dollar surpasse le suréquipement."
 GENERIC_marshall_tractor_works_desc: "Un collectif d'usines de chars opérant selon une méthodologie de production soviétique héritée, privilégiant le volume et la réparabilité."
 GENERIC_vanderlind_hartwell_systems_desc: "Un maître d'œuvre du Beltway tirant parti de ses connexions politiques pour décrocher à grande échelle des programmes de véhicules blindés et de VCI."
 GENERIC_mil_kamov_rotorworks_desc: "Un bureau d'aéronefs à voilure tournante ancré dans la conception soviétique d'hélicoptères d'attaque et de transport, connu pour sa durabilité plus que sa sophistication."
 GENERIC_helitech_avionique_desc: "Une firme anglo-italienne boutique d'avionique et d'intégration d'hélicoptères, offrant de l'électronique de haute qualité à un prix premium."
 GENERIC_aurora_aerodynamics_corporation_desc: "Une opération classifiée de type skunkworks produisant des chasseurs et avions polyvalents de pointe pour des clients de la défense exigeants."
 GENERIC_societe_europeenne_daerostructures_desc: "Un consortium paneuropéen de partage de charges, spécialisé dans les grandes structures aéronautiques, les plateformes de transport et les avions de patrouille maritime."
 GENERIC_southwestern_aerospace_dynamics_bureau_desc: "Un bureau dirigé par une direction produisant des plateformes aériennes polyvalentes et stratégiques sous étroite tutelle gouvernementale."
 GENERIC_skyforge_autonomous_systems_desc: "Une entreprise proche de la Silicon Valley appliquant la culture de start-up au développement de drones de frappe autonomes."
 GENERIC_compagnie_aeronatique_darmement_desc: "Une maison d'armement d'héritage français proposant des normes de munitions transversales pour chasseurs, aéronefs navals et missiles guidés."
 GENERIC_whitehall_strategic_solutions_desc: "Un cabinet boutique de l'Amirauté devenu constructeur de petits combattants, spécialisé dans les corvettes et patrouilleurs."
 GENERIC_triton_maritime_defense_group_desc: "Un réseau multinational de chantiers produisant destroyers et frégates pour plusieurs nations partenaires."
 GENERIC_eastern_maritime_shipbuilding_group_desc: "Un constructeur naval en triple poste continu, produisant croiseurs et porte-avions selon des calendriers compressés."
 GENERIC_sevmorprom_submarine_yards_desc: "Un chantier sous-marin du nord de la Russie, spécialisé dans les profondeurs d'exploitation en eau froide et les plateformes d'attaque et de missiles destinées à l'export."
 GENERIC_halland_civic_engineering_group_desc: "Un conglomérat industriel nordique à double usage logistique, couvrant infrastructures civiles et chaînes d'approvisionnement militaires."
 GENERIC_second_academy_missile_bureau_desc: "Un bureau de recherche compartimenté sur missiles balistiques et de croisière, opérant sous stricts protocoles du besoin d'en connaître."
 GENERIC_western_orbital_systems_bureau_desc: "Un bureau de systèmes orbitaux et stratégiques axé sur les vecteurs de nouvelle génération et la connaissance du domaine spatial."
 GENERIC_central_heavy_atomics_power_desc: "Un programme de propulsion et d'armement nucléaire combinant l'expertise des réacteurs civils et le développement de missiles balistiques navals."
