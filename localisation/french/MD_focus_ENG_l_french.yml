 ENG_integration_vote: "Vote to Remain in the Union"
 ENG_scottish_union_settlement_referendum: "[GetYear] [SCO.GetFlag] Scottish Union Settlement Referendum"
 ENG_scottish_union_settlement_referendum_desc: "Westminster has put the constitutional question to the Scottish electorate on its own terms: a settlement referendum whose result counts toward the mandate needed to close the devolution question for good. The ballot is still a ballot, and the separatist parties are campaigning against it with everything they have. A decisive rejection of independence carries this settlement. Anything less leaves the question exactly where it was, with a government that has spent its credit and lost.\n\nReferendums won: §Y[?ENG_scottish_referendum_success|0]§!/§G3§!\n$ENG_integration_vote$: §Y[?ENG_referendum_stay_vote|0]§!%"
 ENG_north_irish_union_settlement_referendum: "[GetYear] [NIR.GetFlag] Northern Irish Union Settlement Referendum"
 ENG_north_irish_union_settlement_referendum_desc: "Westminster has put the constitutional question to the Northern Irish electorate on its own terms: a settlement referendum whose result counts toward the mandate needed to close the devolution question for good. The ballot is still a ballot, and republican politics is campaigning against it with everything it has. A decisive rejection of independence carries this settlement. Anything less leaves the question exactly where it was, with a government that has spent its credit and lost.\n\nReferendums won: §Y[?ENG_north_irish_referendum_success|0]§!/§G3§!\n$ENG_integration_vote$: §Y[?ENG_referendum_stay_vote|0]§!%"
 ENG_welsh_union_settlement_referendum: "[GetYear] [WAS.GetFlag] Welsh Union Settlement Referendum"
 ENG_welsh_union_settlement_referendum_desc: "Westminster has put the constitutional question to the Welsh electorate on its own terms: a settlement referendum whose result counts toward the mandate needed to close the devolution question for good. The ballot is still a ballot, and the separatist parties are campaigning against it with everything they have. A decisive rejection of independence carries this settlement. Anything less leaves the question exactly where it was, with a government that has spent its credit and lost.\n\nReferendums won: §Y[?ENG_welsh_referendum_success|0]§!/§G3§!\n$ENG_integration_vote$: §Y[?ENG_referendum_stay_vote|0]§!%"
