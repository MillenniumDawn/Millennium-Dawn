 IRQ_sadrist_forces: "Siły Sadystyczne"
 IRQ_american_springboard: "Amerykańska trampolina"
 IRQ_party_coffers: "Kasety Partyjne"
 IRQ_empowering_shias: "Wzmacnianie szyitów"
 IRQ_militia_reliance: "Poleganie na milicjach"
 IRQ_oil_auctions: "Aukcje ropy"
 IRQ_palestinian_vengeance: "Zemsta Palestyny"
 IRQ_pmf_deployed: "Wdrożono PMF"
 IRQ_iranian_military_companies: "Irański przemysł wojskowy"
 IRQ_army_of_the_revolution: "Armia Rewolucji"
 IRQ_constitutional_manipulation: "Manipulacja konstytucyjna"
 IRQ_islam_over_state: "Islam ponad państwo"
 IRQ_war_against_propaganda: "Wojna z propagandą"
 IRQ_gate_to_the_world: "Brama do Świata"
 IRQ_quds_advice: "Porady Quds"
 IRQ_irgc_expertise: "Wiedza specjalistyczna IRGC"
 IRQ_equality_society: "Równość w społeczeństwie"
 IRQ_al_ansar_resurgence: "Odrodzenie al-Ansara"
 IRQ_expulsion_of_iranian_idea: "Expulsion of Iranians"
 IRQ_expulsion_of_foreigners_idea: "Wydalenie cudzoziemców"
 IRQ_democratic_youth_federation_idea: "Federacja Młodzieży Demokratycznej"
 IRQ_power_of_the_unions: "Siła Związków"
 IRQ_al_hawasim: "Al Hawasima"
 IRQ_mahdi_army_expansion_idea: "Ekspansja Armii Mahdiego"
 IRQ_targeted_preparations: "Ukierunkowane przygotowania"
 IRQ_untrustworthy_neighbors: "Niegodni zaufania sąsiedzi"
 IRQ_the_lions_den: "The Lion's Den"
 IRQ_strategic_partnerships: "Partnerstwa strategiczne"
 IRQ_sadrist_militias: "Ruch Sadystów"
 IRQ_sadrist_militias_desc: "Saraya al-Salam, the latest incarnation of the Mahdi Army, is the militia of the Sadrist Movement which is fighting on the frontlines together with the Iraqi Army. Its leader, Muqtada al-Sadr is a popular Iraqi Shia cleric and politician who has inherited his movement from his popular father. His platform is based on a cocktail of political Shiite Islam, Anti-Americanism, Iraqi independence from Iranian influence and Iraqi populist nationalism."
 IRQ_threat_of_al_qaeda: "Zbliżająca się katastrofa"
 IRQ_threat_of_al_qaeda_desc: "The dissolution of the [IRQ.GetFlag] Iraqi Armed Forces meant that many soldiers and commanders were left without a job. This led to many elements within the army aligning themselves with various extremist groups in the nation, one of which being [AIQ.GetFlag] Al-Qaeda in Iraq. If left unchecked, then this group may launch an attack against our government.\n§W-----------------------------------------------------------------§!\nThis national spirit will be §Rremoved§! if we resolve the §HInsurgency Crisis§!"
 IRQ_sunni_dynamic_idea: "Wpływy polityczne sunnitów"
 IRQ_sunni_dynamic_idea_desc: "The Sunni community within our nation has mobilized in order to preserve their identity, way of life, and sense of being. Due to the rise of Shi'ism, and the marginalization of the Sunnis in political life, their mobilization will work against our nation's interests.\n§W-----------------------------------------------------------------§!\nThis national spirit will change dynamically every §H10§! levels that the §HSunni Political Variable§! changes by. Currently, Sunni Political Influence is at §H[?IRQ_sunni_political_influence]/100§!\n§W-----------------------------------------------------------------§!\nWhile this national spirit is active, §H[AIQ.GetFlag] Al-Qaeda in Iraq§! can start a §Rcivil war§! if Salafism is §H20%§! or greater, stability is less than §H55%§!, and our state religion is §HShia§!"
 IRQ_triumph_over_america: "Triumf nad Ameryką"
 IRQ_triumph_over_america_desc: "Our soldiers taught a lesson to the Americans that they will never forget."
 IRQ_mosque_income_idea: "Zwiększone podatki na meczety"
 IRQ_mosque_income_idea_desc: "Aby sfinansować różne projekty w kraju, zwiększyliśmy podatki pobierane od meczetów"
 IRQ_PIJ_idea: "Brygady PIJ"
 IRQ_PIJ_idea_desc: "PIJ Brigades are currently operating in our nation, and will help us fight back against the Zionist state.\n§W-----------------------------------------------------------------§!\nThis national spirit will be §Rremoved§! if the §HBa'athist party§! is no longer in power, or [ISR.GetFlag] §HIsrael§! no longer exists."
 IRQ_cult_of_saddam: "Kult Saddama"
 IRQ_cult_of_saddam_desc: "Our great leader, Saddam Hussein, has brought great wealth and dignity to [IRQ.GetFlag] Iraq. His contributions must be cherished while he is still around.\n§W-----------------------------------------------------------------§!\nThis national spirit will be §Rremoved§! if the §HBa'athist party§! is no longer in power, or if §HSaddam Hussein§! is no longer the leader."
 IRQ_air_support_granted: "Wsparcie powietrzne przeciw powstańcom"
 IRQ_air_support_granted_desc: "Nasze Siły Powietrzne pracują całą dobę, aby zapewnić wsparcie powietrzne przeciwko Powstańcom w naszym kraju"
 IRQ_recovering_from_the_gulf_war: "Odzyskiwanie po wojnie w Zatoce Perskiej"
 IRQ_recovering_from_the_gulf_war_desc: "W następstwie wyniszczającej wojny w Zatoce Perskiej Irak znajduje się w stanie chaosu i zniszczenia. Konflikt, charakteryzujący się intensywnymi operacjami powietrznymi i naziemnymi, był świadkiem znaczących bitew, które pozostawiły trwały wpływ na naród. Od początkowych nalotów i wyzwolenia Kuwejtu po kampanię naziemną, która odepchnęła siły irackie, wojna zebrała ogromne żniwo."
 IRQ_MEK_bases: "Bazy MEK"
 IRQ_MEK_bases_desc: "Recognizing the strategic importance of the Mojahedin e Khalq (MEK) during the Iran-Iraq War, Iraq seeks to leverage their assistance and establish bases to enhance its military capabilities. This allows for the establishment of MEK bases within Iraq to threaten Iran, enabling an increase in the maximum number of volunteer forces that can be mobilized. Like its use in 1991 against the Kurds."
 IRQ_high_political_opposition: "Wysoka opozycja polityczna"
 IRQ_high_political_opposition_desc: "Irak stoi przed poważnym wyzwaniem, gdyż zmaga się z silną opozycją polityczną, obejmującą różnorodne mniejszości etniczne i wspólnoty religijne."
 IRQ_bastion_of_baathism: "Bastion Baasizmu"
 IRQ_bastion_of_baathism_desc: "Na żyznych gruntach irackiej ziemi zasiano nasiona Baasu, które kiełkowały pośród wyzwań i aspiracji tamtych czasów. Pojawili się przywódcy-wizjonerzy, których motywacją było pragnienie jedności narodowej, arabski nacjonalizm i dążenie do sprawiedliwości społecznej. Niech Arabowie będą na zawsze jednością!"
 IRQ_international_sanctions: "Sankcje międzynarodowe"
 IRQ_international_sanctions_desc: "W 2000 r. Irak stanął w obliczu szkodliwych skutków międzynarodowych sankcji nałożonych po wojnie w Zatoce Perskiej w 1991 r. Sankcje te poważnie ograniczyły zdolność Iraku do angażowania się w handel międzynarodowy, utrudniły ożywienie gospodarcze i spowodowały spadek poziomu życia narodu irackiego . Sankcje miały także istotne konsekwencje humanitarne, wpływając na dostęp do opieki zdrowotnej, podstawowych usług i zasobów niezbędnych do zaspokojenia podstawowych potrzeb. Długotrwałe skutki tych sankcji ukształtowały w tym okresie krajobraz gospodarczy i społeczny Iraku."
 IRQ_conscriptions_in_schools: "Pobór w szkołach"
 IRQ_conscriptions_in_schools_desc: "Pozwalamy dzieciom porzucić zajęcia, aby zaciągnąć je do naszych sił zbrojnych."
 IRQ_fadayyene_saddam: "Milicja Fedayeen Saddam"
 IRQ_fadayyene_saddam_desc: "Rozkazaliśmy kilku jednostkom Fedayeen Saddam ustawić pozycje obronne wokół kraju."
 IRQ_kurdish_friends: "[KUR.GetFlag] Przyjaciele Kurdów"
 IRQ_kurdish_friends_desc: "The [KUR.GetFlag] Kurds have historically been ousted by most nations in the region, thus isolating them and leaving them with little to no friends. It's about time that we strengthen our friendship with the [KUR.GetFlag] Kurds, so that we may get what we want, liberation, freedom, and independence from foreign powers."
 IRQ_negotiations_with_kurdish_government: "Negocjacje z [KUR.GetFlag] rządem kurdyjskim"
 IRQ_negotiations_with_kurdish_government_desc: "Otwierając kanały komunikacji z rządem kurdyjskim [KUR.GetFlag], być może uda nam się ponownie zintegrować naród kurdyjski z naszym państwem bez rozlewu krwi."
 IRQ_bolster_communist_party_of_kurdistan_iraq: "Wzmocnij £KUR_Neutral_Communism_small Komunistyczne ideały w [KUR.GetFlag] Kurdystanie"
 IRQ_bolster_communist_party_of_kurdistan_iraq_desc: "The [KUR.GetFlag] Kurdish people need one thing, and that is independence and liberation from all forms of foreign exploitation. By promoting communist ideals in [KUR.GetFlag] Kurdistan, we may be able to sway their people to finally join us hand in hand in this movement."
 IRQ_request_an_election: "Poproś o wybory"
 IRQ_request_an_election_desc: "Naciskając na obecny [KUR.GetFlag] rząd kurdyjski, aby przeprowadził wybory, [KUR.GetFlag] kurdyjscy komuniści mogą w końcu zyskać szansę na zdobycie należnego im miejsca."
 IRQ_rojava_shipments: "Rozpocznij dostawy do [ROJ.GetFlag] Rożawa"
 IRQ_rojava_shipments_desc: "Rząd Syrii [SYR.GetFlag] od zawsze represjonował Kurdów w regionie [ROJ.GetFlag] Rożawa i musimy znaleźć sposób na wyzwolenie tych ludzi, zapewniając im niezbędne wsparcie, gdzie to możliwe."
 IRQ_shipping_to_rojava: "Przesyłki na trasie..."
 IRQ_shipping_to_rojava_desc: "Koła ciężarówek kręcą się po syryjskiej ziemi."
 IRQ_political_decisions: "Iracka polityka wewnętrzna"
 IRQ_recall_nsa_bahrain: "Przypomnijmy NSA Bahrajn"
 IRQ_recall_nsa_bahrain_desc: "Najwyższy czas przejąć i skonsolidować naszą kontrolę nad NSA Bahrajn, działką okupowaną przez Amerykanów!"
 IRQ_mek_revolt_trig: "Bunt"
 IRQ_mek_revolt_trig_desc: "Dziś możemy nakłonić naszych przyjaciół z MEK do rozpoczęcia transgranicznego najazdu na Iran i raz na zawsze obalić reżim mułły!"
 IRQ_the_blood_quran: "Dokończ „Krwawy Koran”"
 IRQ_the_blood_quran_desc: "Kończąc i ogłaszając Krwawy Koran, napisany krwią Saddama Husajna, nasz rząd będzie mógł spróbować okazać swoją pobożność wśród [IRQ.GetFlag] narodu irackiego, ale może to również przynieść odwrotny skutek…"
 IRQ_smuggle_goods_from_jordan: "Przemycaj towary z [JOR.GetFlag] Jordanii"
 IRQ_smuggle_goods_from_jordan_desc: "Rodzina Husseinów ma wiele powiązań z pewnymi osobami w [JOR.GetFlag] Jordanii i korzystając z tych powiązań możemy przemycać niektóre towary przez granicę bez wiedzy rządu."
 IRQ_al_salam_palace: "Przeprojektuj pałac Al-Salam"
 IRQ_al_salam_palace_desc: "The Al-Salam Palace was initially designed in 1950, more than 50 years ago, and since then the palace has begun showing its age. Redesigning certain aspects of it could be useful in helping [IRQ.GetLeader] clear his mind when he needs to."
 IRQ_arrest_muqtada: "Aresztować Muktadę al-Sadra"
 IRQ_arrest_muqtada_desc: "That cockroach Muqtada has been running his mouth recently, and just like his father, we might need to find a solution."
 IRQ_civil_war_mechanic: "Kryzys powstańczy"
 IRQ_civil_war_mechanic_desc: "Upadek §HReżim Saddama§! doprowadził do całkowitego załamania się armii irackiej. Wielu naszych §Hbyłych żołnierzy§! poświęciło swoje życie walce §Rprzeciwko§! naszemu państwu, czy to w imieniu własnych organizacji, czy też §Rdżihadystów§!\nPoczątkowo będziemy w konflikcie z §RSalafitami§!, ale §HSzyici§! mogą szybko stać się wrodzy, jeśli nie zawrzemy z nimi sojuszu. Będziemy musieli atakować powstańców w każdym stanie, aż się §HPoddadzą§!, gdy będą wystarczająco słabi. Nasza §HGotowość§! zadecyduje o sukcesie naszych działań operacyjnych. §HGotowość§! ulegnie poprawie w miarę przeprowadzania większej liczby operacji lub skupiania się na określonych kwestiach.\n\nMożemy wykonywać operacje, klikając na stan. Stracimy §HSprzęt§! i §HPersonel§! w każdej operacji, którą przeprowadzimy.\n\nMapa będzie §Hdynamicznie§! zmień kolory, aby wyświetlić nasz §HPostęp§!.\n\n§pFioletowy§! - Siły Kurdyjskie\n§RCzerwony§! - Salafickie Siły Dżihadystyczne\n§YŻółty§! - Siły szyickie\n§OOrange§! - Średnie Powstanie\n§GZielony§! - Niski poziom rebelii\n\n§HGotowość§!: [?IRQ_government_readiness]%\n§HPersonel§!: [?IRQ_government_troops]\n§HStany zabezpieczone§!: [?IRQ_variable_for_win]\n\n\n\n\n"
 IRQ_start_negotiations_shias: "Rozpocznij negocjacje z szyickimi milicjami"
 IRQ_start_negotiations_shias_desc: "Usiądziemy do stołu negocjacyjnego z wieloma szyickimi milicjami, które utworzyły się w celu zawarcia porozumienia mającego na celu zniszczenie naszego wspólnego wroga. Jeśli nie uda nam się wystarczająco szybko przeciągnąć ich na naszą stronę, mogą stać się wrogo nastawieni!"
 IRQ_request_coalition_forces: "Poproś o wsparcie powietrzne"
 IRQ_request_coalition_forces_desc: "Jeśli Siły Powietrzne nic nie robią przez cały dzień, to dlaczego płacimy pilotom? Musimy wykorzystać naszą przewagę w Niebie, aby zmiażdżyć powstańców i zmusić ich do poddania się."
 IRQ_request_awakening_council_militias: "Rozmowy Fostera na rzecz Al-Sahwah"
 IRQ_request_awakening_council_militias_desc: "Al-Sahwa, czyli Synowie Iraku, to proponowany sojusz pomiędzy plemionami sunnickimi i innymi grupami, mający na celu walkę z Powstańcami. Możemy włączyć ich siły, aby uzyskać przewagę liczebną nad powstańcami."
 IRQ_militarize_police_force: "Zmilitaryzować policję"
 IRQ_militarize_police_force_desc: "Odbierzemy policji broń i siłę roboczą i zaciągniemy ich do naszej armii, aby pomogli w walce z powstańcami, nawet jeśli będziemy musieli ograniczyć ich szkolenie."
 IRQ_recruitment_campaign: "Wysiłek szkoleniowy"
 IRQ_recruitment_campaign_desc: "Musimy szkolić i kondycjonować naszych ludzi, aby mogli bezpiecznie i skutecznie stawić czoła powstańcom. Takie postępowanie pomoże również zmniejszyć ryzyko zagrożenia życia."
 IRQ_iraq_war: "Walka o przetrwanie"
 IRQ_iraq_war_desc: "The war for Iraq and its lands has begun. The United States will have a maximum of 6 months to capitulate the Iraqi government, or else they will have to order an immediate withdrawal from the nation and risk their influence."
 IRQ_war_phase_one: "Faza I"
 IRQ_war_phase_two: "etap II"
 IRQ_war_phase_two_desc: "Amerykanie ustąpią, ich wysiłki pójdą na marne!"
 IRQ_preparation_for_the_war: "Wojna"
 IRQ_preparation_for_the_war_desc: "Ci imperialiści w [USA.GetFlag] §H[USA.GetName]§! rozpoczęli §RUNieuzasadniony§! kampania Przeciwko naszemu narodowi!\n\nBędziemy musieli zebrać razem nasze siły i zasoby narodowe oraz §HPprzygotować się na wojnę o przetrwanie§!. Wykorzystajmy to, co mamy i doświadczenie z §wojny w Hirze§! i §HWojna w Zatoce§!, stworzymy absolutną dziurę piekielną dla każdego nadchodzącego najeźdźcy.\n\nJeśli uda nam się odeprzeć Amerykanów przez §Haco najmniej 3 miesiące§!, ich populacja będzie wywierać na nich presję, aby zażądali §HCzawieszenia broni §! z powodu niepopularności wojny!"
 IRQ_threaten_kuwait: "Zagrozić [KUW.GetFlag] Kuwejtowi"
 IRQ_threaten_kuwait_desc: "The Americans have a base right under our nose, and the Kuwaitis are at fault for this. We will demand that they swiftly take control so that the Americans cannot attack us from Middle Eastern lands."
 IRQ_restore_the_iron_ring: "Przywróć Żelazny Pierścień"
 IRQ_restore_the_iron_ring_desc: "Żelazny Pierścień okazał się przydatny w obronie przed Irańczykami podczas wojny iracko-irańskiej w latach 80-tych. Musimy szybko to poskładać w całość."
 IRQ_golden_guard_divisions: "Utwórz dywizje Złotej Gwardii"
 IRQ_golden_guard_divisions_desc: "Zmobilizujemy kilka dywizji Złotej Gwardii dla obrony naszego narodu i wyszkolimy je w absolutnie najwyższym możliwym stopniu."
 IRQ_conscription_in_schools: "Pobór w szkołach"
 IRQ_conscription_in_schools_desc: "We absolutely must get more manpower to field our units in the time of war, and schools are a perfect location for this very reason. They can get an education later."
 IRQ_kurdish_compromise: "[KUR.GetFlag] Kurdyjski kompromis"
 IRQ_kurdish_compromise_desc: "We will come to an agreement with the [KUR.GetFlag] Kurds, and secure our northern front from any sudden attacks if they accept, that is."
 IRQ_faddayean_saddam: "Zmobilizuj Fedaini Saddama"
 IRQ_faddayean_saddam_desc: "We need to prepare the Fedayeen Saddam for the incoming invasion, and by all means we must equip and train more divisions to continue the fight no matter what."
 IRQ_weapons_concealment: "Program rozbudowy rakiet"
 IRQ_weapons_concealment_desc: "Musimy szybko zwiększyć nasz program rakietowy, aby, jeśli zajdzie taka potrzeba, zniszczyć wroga z daleka."
 IRQ_contract_the_MEK: "Zakontraktuj £PER_anarchist_communism MEK"
 IRQ_contract_the_MEK_desc: "Mojahedin-e Khalq, or the £PER_anarchist_communism MEK have been residing in our country for a very long time. It is about time that we have them do something actually useful for our nation."
 IRQ_economic_union_menu: "Unia Dobrobytu Islamu"
 IRQ_invite_to_economic_union_targeted_decision: "Invite [FROM.GetName]"
 IRQ_kick_from_economic_union_targeted_decision: "Kopnij [FROM.GetName]"
 IRQ_the_constitution: "Konstytucja iracka"
 IRQ_the_constitution_desc: "Following the overthrow of §YSaddam Hussein§!, and the subsequent §YBa'athist§! Party, our nation has been tasked with §YDrafting a new constitution§! for a more §YDemocratic, and Free Iraq§!. Each §YArticle§! of the §YConstitution§! that we draft will have an §YImpact§! on the future of which political parties can be elected, and who could be in politics."
 IRQ_constitution_draft_government_type: "Artykuł I: Rząd Iraku"
 IRQ_constitution_draft_government_type_desc: "Nasza konstytucja musi określać, czy nasz naród będzie republiką islamską, czy świecką."
 IRQ_constitution_draft_languages: "Artykuł II: Język Iraku"
 IRQ_constitution_draft_languages_desc: "Język jest tym, co jednoczy nasz naród, a duża część mówi w innym języku, niż arabski. Musimy zdecydować, czy dopuścimy inne języki jako języki państwowe."
 IRQ_constitution_draft_nationalism: "Artykuł III: Patriotyzm w Iraku"
 IRQ_constitution_draft_nationalism_desc: "Jak pokazała historia, hipernacjonalizm i patriotyzm doprowadziły do ​​upadku naszego narodu. Musimy to wyjaśnić w artykule III."
 IRQ_constitution_draft_democratic_form: "Artykuł IV: Federalizacja Iraku"
 IRQ_constitution_draft_democratic_form_desc: "Nasz naród składa się z wielu różnych grup społecznych, w tym Kurdów, Asyryjczyków, Turkmenów i wielu innych. Mamy także poważny rozłam w sektach religijnych, szczególnie pomiędzy szyitami i sunnitami. To wszystko musi zostać uregulowane w naszej konstytucji."
 IRQ_constitution_draft_militias: "Artykuł V: Bezpieczeństwo Iraku"
 IRQ_constitution_draft_militias_desc: "Mimo że nasz naród będzie miał siły zbrojne, wielu naszych ludzi nie ufa rządowi, że zapewni im bezpieczeństwo, i dlatego utworzyło milicje. Musimy wyjaśnić, czy te milicje są legalne."
 IRQ_constitution_draft_identity: "Artykuł VI: Tożsamość Iraku"
 IRQ_constitution_draft_identity_desc: "Irak składa się z wielu narodów i musimy wyjaśnić, czy Irak przyjmie tożsamość arabską, czy też wielokulturową."
 IRQ_black_gold_decisions: "Czarne złoto"
 IRQ_black_gold_decisions_desc: "Part of our post-victory plan is to secure economic domination in the region. Through the exploitation of corruption amongst the Southern Khaleeji states, we are able to slowly increase our grip over their most precious resource, oil. We will need to increase our influence in these nations in order to gain access to new decisions (such as buying up more shares) that will allow us to get one step closer to seizing these precious resources. Once we get more than 50% control over Aramco, we will be able to make an attempt to seize the company. The higher the control we have, the higher the chance of success will be.\n\n[SAU.GetFlag] Aramco Control: [?IRQ_aramco_control]/100"
 IRQ_open_aramco_scheme: "Otwórz [SAU.GetFlag] Decyzje dotyczące programu Aramco"
 IRQ_close_aramco_scheme: "Zamknij [SAU.GetFlag] Decyzje dotyczące programu Aramco"
 IRQ_find_dirt_on_saudi_king: "Znajdź sekrety dotyczące [SAU.GetLeader]"
 IRQ_find_dirt_on_saudi_king_desc: "Pierwszym krokiem w zdobyciu akcji Aramco będzie znalezienie czegoś, czym można będzie szantażować [SAU.GetFlag] [SAU.GetLeader]."
 IRQ_establish_the_hussein_fund: "Utworzenie Funduszu Husajna"
 IRQ_establish_the_hussein_fund_desc: "Ustanawiając Fundusz Husseina, będziemy mogli przekazywać pieniądze na akcje [SAU.GetFlag] Aramco za pośrednictwem organizacji, nie skupiając na tym zbytniej uwagi."
 IRQ_buy_shares_of_aramco: "Kup Akcje"
 IRQ_buy_shares_of_aramco_desc: "Możemy kupić niewielką liczbę udziałów w [SAU.GetFlag] Aramco teraz, gdy mamy fundusz Hussein, co pozwala nam na zakup większych ilości po tej początkowej inwestycji."
 IRQ_prop_up_iraqi_ceo: "Wesprzyj [IRQ.GetFlag] irackiego dyrektora generalnego"
 IRQ_prop_up_iraqi_ceo_desc: "Pociągając za sznurki, możemy wesprzeć [IRQ.GetFlag] irackiego dyrektora generalnego jako nowego dyrektora generalnego [SAU.GetFlag] Aramco, zwiększając naszą kontrolę nad firmą."
 IRQ_seize_aramco: "Przejmij [SAU.GetFlag] Aramco"
 IRQ_seize_aramco_desc: "Nadszedł czas, musimy rozpocząć agresywne przejęcie firmy, aby zabezpieczyć cenne zasoby w [SAU.GetFlag] [SAU.GetName]!"
 IRQ_send_over_iraqis_to_saudi_arabia: "Send over [IRQ.GetFlag] Iraqis to [SAU.GetFlag] [SAU.GetName]"
 IRQ_send_over_iraqis_to_saudi_arabia_desc: "By paying for the flights of thousands of [IRQ.GetFlag] Iraqis, we are able to ensure proper [IRQ.GetFlag] Iraqi influence in [SAU.GetFlag] [SAU.GetName]."
 IRQ_encourage_iraqis_to_work_for_aramco: "Encourage [IRQ.GetFlag] Iraqis to Work for [SAU.GetFlag] Aramco"
 IRQ_encourage_iraqis_to_work_for_aramco_desc: "Dzięki osobom, które wysłaliśmy do [SAU.GetName], jesteśmy w stanie zatrudnić ich do pracy w [SAU.GetFlag] Aramco w celu nawiązania potencjalnych powiązań wewnątrz firmy."
 IRQ_buy_more_shares: "Kup więcej akcji"
 IRQ_buy_more_shares_desc: "Jesteśmy w stanie zwiększyć naszą kontrolę nad [SAU.GetFlag] Aramco poprzez zakup większej liczby udziałów tej spółki za pośrednictwem naszego Funduszu Hussein."
 IRQ_regional_baathism_decisions: "£IRQ_Nat_Autocracy_small Regionalny baasizm"
 IRQ_regional_baathism_decisions_desc: "Nasza frakcja ma zwolenników z całego regionu i świata. Jednocząc wyznawców ideologii Baas, jesteśmy w stanie stworzyć sieć regionalnych dowództw, które kontrolujemy. Umieszczając na swoich przywódcach wysokich rangą i lojalnych urzędników irackich, możemy zapewnić tym państwom całkowitą lojalność."
 IRQ_appoint_control_syria: "Utworzenie £IRQ_Nat_Autocracy_small [SBP.GetFlag] syryjskiego dowództwa regionalnego"
 IRQ_appoint_control_egypt: "Establish the £IRQ_Nat_Autocracy_small [EBP.GetFlag] Egyptian Regional Command"
 IRQ_appoint_control_jordan: "Establish the £IRQ_Nat_Autocracy_small [JBP.GetFlag] Jordanian Regional Command"
 IRQ_clergy_balance_of_power_category: "Return to Faith Campaign"
 IRQ_secularists_bop_mid_range: "Między islamizmem a sekularyzmem"
 IRQ_secularists_bop_left_win_range: "Państwo zsekularyzowane"
 IRQ_secularists_bop_left_advanced_range: "Wysoce świeckie społeczeństwo"
 IRQ_secularists_bop_left_medium_range: "Rozwój liberalizmu w społeczeństwie"
 IRQ_secularists_bop_left_low_range: "Społeczeństwo umiarkowanie świeckie"
 IRQ_clergy_bop_right_win_range: "Państwo szariatu"
 IRQ_clergy_bop_right_advanced_range: "Towarzystwo Islamskie"
 IRQ_clergy_bop_right_medium_range: "Odrodzenie ideałów islamskich"
 IRQ_clergy_bop_right_low_range: "Umiarkowane Towarzystwo Islamskie"
 IRQ_promote_female_participation: "Promocja udziału kobiet"
 IRQ_promote_female_participation_desc: "Będziemy zachęcać nasze kobiety do udziału w życiu społecznym i bycia istotną częścią siły roboczej."
 IRQ_promotion_of_iraqi_identity: "Promocja tożsamości irackiej"
 IRQ_promotion_of_iraqi_identity_desc: "Our people must know who they are, and their history, culture, and language are a part of their identity that must be reinforced."
 IRQ_restoration_of_ancient_sights: "Renovation of Historical Sites"
 IRQ_restoration_of_ancient_sights_desc: "Nasza przeszłość jest bardzo istotną częścią naszego narodu, ponieważ nasi ludzie muszą zdać sobie sprawę z wielkości, którą kiedyś osiągnęli, i wielkości, do której muszą dążyć ponownie."
 IRQ_promotion_of_saddam: "Promocja osiągnięć Baas"
 IRQ_promotion_of_saddam_desc: "Na każdej ulicy, w każdym domu, biurze i szkole musi wisieć portret największego przywódcy w historii Baas. Nasi ludzie muszą wiedzieć, kto zbudował ten naród i komu podziękować."
 IRQ_power_of_mosques: "Rozszerz moc meczetu"
 IRQ_power_of_mosques_desc: "Meczety sprawują władzę w tym kraju i musimy się z tym pogodzić. Zwiększając ich władzę, jesteśmy w stanie pokazać im, że jesteśmy po ich stronie."
 IRQ_crack_down_on_haram: "Walcz z niemoralnymi działaniami"
 IRQ_crack_down_on_haram_desc: "Nasze społeczeństwo nie może być zepsute przez pozory zachodniego imperializmu. Musimy walczyć z tymi infiltracjami irackiego społeczeństwa wszelkimi możliwymi środkami."
 IRQ_upholding_sharia: "Przestrzeganie szariatu"
 IRQ_upholding_sharia_desc: "Obowiązującym w tym kraju prawem jest szariat i naszym obowiązkiem jest go przestrzegać w przypadku, gdy niektórzy złoczyńcy chcą obejść normy społeczne."
 IRQ_clergy_right_side: "Islamiści"
 IRQ_secularists_bop_left_side: "Sekularyści"
 IRQ_debaath_balance_of_power_category: "£IRQ_Nat_Autocracy_small De-Ba'athification of [IRQ.GetFlag] Iraq"
