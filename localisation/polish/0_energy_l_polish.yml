 enable_nuclear_reactor_fuel_production_tt: "§YWłącz Wzbogacanie Nuklearne§!\nMożemy produkować własne paliwo do reaktorów jądrowych, jeśli mamy ku temu możliwości. Proces ten jest kosztowny i czasochłonny, ale ważne jest, aby reaktory jądrowe naszego kraju mogły działać nieprzerwanie."
