 legacy_of_yitzhak_rabin: "이츠하크 라빈의 유산"
 legacy_of_yitzhak_rabin_desc: "1995년 11월 4일, 극우 극단주의자 이갈 아미르는 팔레스타인과의 평화 회담 진전을 막기 위해 텔아비브 집회에서 이스라엘 총리 이츠하크 라빈을 암살했습니다. 그 이후 선출된 정부의 행동에 대한 정치적 폭력과 행동은 이스라엘 사회에서 금기가 되었으며, 십대 시절 텔레비전으로 그의 죽음을 지켜보고 라빈 광장에 꽃과 촛불을 놓았던 세대는 이제 선거 정치에서 목소리를 얻고 있습니다.\n§W--------------§!\n이 국가 정신은 §Y$ISR_rz_path$§!, §Y$ISR_bibism$§! 또는 §Y$ISR_ben_gvir_path$§! 중점을 완료하면 §R제거§!됩니다."
 eddaic_ghost_1: "에다의 유령 - §t세 번째 소원...§!"
 eddaic_ghost_1_desc: "유령은 세 번째 소원을 가져갔습니다. §R'한 형제가 자신의 형제에게 손을 들게 하고, 그들이 전쟁을 벌이게 하라'§!고 그는 말했습니다. \n\n이스라엘은 아슈케나지 유대인, 즉 유럽 출신 유대인에 의해 건국되었으나, 아랍 국가들과의 전쟁으로 인해 세파르디로 불리는 북아프리카와 중동 출신 유대인 약 100만 명이 이스라엘로 오게 되었습니다. 노동당 정부들은 세파르디를 '용광로'로 아슈케나지 문화에 동화시키려 했고, 정부 보조금이 거의 없는 미개발 교외 도시에 이들을 던져 놓은 채 그들의 문화적 배경을 깔보았습니다. 오늘날 세파르디가 이스라엘 유대인의 다수임에도 불구하고 이들은 여전히 국가 기구에서 크게 과소 대표되고 있으며, 이는 분노와 종파 간 긴장으로 이어집니다.\n§W--------------§!\n이 국가 정신은 §Y$ISR_regret_our_past_sephardics$§!, §Y$ISR_yemenite_affair$§! 또는 §Y$ISR_sephardic_cultural_heritage$§!처럼 세파르디의 불만을 해소하는 중점을 완료하면 §G개선§!되며, §Y$ISR_forgot_to_be_jews$§! 또는 §Y$ISR_empower_city_rabbis$§!와 같은 중점을 완료하면 §R악화§!됩니다. 최종 단계를 넘어 개선되면 §R제거§!됩니다."
 eddaic_ghost_2: "에다의 유령 - §O두 번째 소원...§!"
 eddaic_ghost_2_desc: "유령이 두 번째 소원을 가져갔습니다. §R'한 사람이 자기 형제를 미워하게 하고, 그들이 불화로 고통받게 하라'§! 그가 말했습니다. \n\n이스라엘은 유럽 출신인 아슈케나지 유대인들이 건국했지만, 아랍 국가들과의 전쟁으로 인해 세파르딤이라 불리는 북아프리카와 중동 출신 유대인 거의 백만 명이 이스라엘로 오게 되었습니다. 노동당 정부들은 세파르딤을 '용광로'처럼 아슈케나지 문화에 동화시키려 했고, 정부 보조금이 거의 없는 미개발 교외 도시에 몰아넣은 채 이들의 문화적 배경을 깔보았습니다. 오늘날 세파르딤이 이스라엘 유대인의 다수임에도 국가 기구에서는 여전히 크게 과소 대표되어 있으며, 이는 원한과 종파 간 긴장으로 이어졌습니다.\n§W--------------§!\n이 국민 정신은 §Y$ISR_regret_our_past_sephardics$§!, §Y$ISR_yemenite_affair$§!, §Y$ISR_sephardic_cultural_heritage$§! 등 세파르딤의 불만을 다루는 중점을 완료하면 §G개선§!되고, §Y$ISR_forgot_to_be_jews$§!, §Y$ISR_empower_city_rabbis$§! 같은 중점을 완료하면 §R악화§!됩니다. 최종 단계를 넘어 개선되면 §R제거§!됩니다."
 eddaic_ghost_3: "에다의 유령 - §9첫 번째 소원...§!"
 eddaic_ghost_3_desc: "유령은 첫 번째 소원을 가져갔습니다. §R'한 사람이 자기 자신 외에는 아무도 믿지 않게 하고, 그들이 서로 가까워지게 하라'§!고 그는 말했습니다. \n\n이스라엘은 아슈케나지 유대인, 즉 유럽 출신 유대인에 의해 건국되었으나, 아랍 국가들과의 전쟁으로 인해 세파르디로 불리는 북아프리카와 중동 출신 유대인 약 100만 명이 이스라엘로 오게 되었습니다. 노동당 정부들은 세파르디를 '용광로'로 아슈케나지 문화에 동화시키려 했고, 정부 보조금이 거의 없는 미개발 교외 도시에 이들을 던져 놓은 채 그들의 문화적 배경을 깔보았습니다. 오늘날 세파르디가 이스라엘 유대인의 다수임에도 불구하고 이들은 여전히 국가 기구에서 크게 과소 대표되고 있으며, 이는 분노와 종파 간 긴장으로 이어집니다.\n§W--------------§!\n이 국가 정신은 §Y$ISR_regret_our_past_sephardics$§!, §Y$ISR_yemenite_affair$§! 또는 §Y$ISR_sephardic_cultural_heritage$§!처럼 세파르디의 불만을 해소하는 중점을 완료하면 §G개선§!되며, §Y$ISR_forgot_to_be_jews$§! 또는 §Y$ISR_empower_city_rabbis$§!와 같은 중점을 완료하면 §R악화§!됩니다. 최종 단계를 넘어 개선되면 §R제거§!됩니다."
 eddaic_ghost_4: "에다의 유령 - §H벽장 속에 갇히다...§!"
 eddaic_ghost_4_desc: "유령은 벽장 속, 침대 밑에 숨었지만 §R여전히 많은 이들의 두려움을 괴롭히고 있습니다...§! \n\n이스라엘은 아슈케나지 유대인, 즉 유럽 출신 유대인에 의해 건국되었으나, 아랍 국가들과의 전쟁으로 인해 세파르디로 불리는 북아프리카와 중동 출신 유대인 약 100만 명이 이스라엘로 오게 되었습니다. 노동당 정부들은 세파르디를 '용광로'로 아슈케나지 문화에 동화시키려 했고, 정부 보조금이 거의 없는 미개발 교외 도시에 이들을 던져 놓은 채 그들의 문화적 배경을 깔보았습니다. 오늘날 세파르디가 이스라엘 유대인의 다수임에도 불구하고 이들은 여전히 국가 기구에서 크게 과소 대표되고 있으며, 이는 분노와 종파 간 긴장으로 이어집니다.\n§W--------------§!\n이 국가 정신은 §Y$ISR_regret_our_past_sephardics$§!, §Y$ISR_yemenite_affair$§! 또는 §Y$ISR_sephardic_cultural_heritage$§!처럼 세파르디의 불만을 해소하는 중점을 완료하면 §G개선§!되며, §Y$ISR_forgot_to_be_jews$§! 또는 §Y$ISR_empower_city_rabbis$§!와 같은 중점을 완료하면 §R악화§!됩니다. 최종 단계를 넘어 개선되면 §R제거§!됩니다."
 eddaic_ghost_5: "에다의 유령 - §6병 속으로 돌아가다...§!"
 eddaic_ghost_5_desc: "유령은 마침내 병 속으로 돌아갔지만, 병은 여전히 방 안에 있습니다. §R그는 다시 풀려날 날을 기다리고 있습니다.§! \n\n이스라엘은 아슈케나지 유대인, 즉 유럽 출신 유대인에 의해 건국되었으나, 아랍 국가들과의 전쟁으로 인해 세파르디로 불리는 북아프리카와 중동 출신 유대인 약 100만 명이 이스라엘로 오게 되었습니다. 노동당 정부들은 세파르디를 '용광로'로 아슈케나지 문화에 동화시키려 했고, 정부 보조금이 거의 없는 미개발 교외 도시에 이들을 던져 놓은 채 그들의 문화적 배경을 깔보았습니다. 오늘날 세파르디가 이스라엘 유대인의 다수임에도 불구하고 이들은 여전히 국가 기구에서 크게 과소 대표되고 있으며, 이는 분노와 종파 간 긴장으로 이어집니다.\n§W--------------§!\n이 국가 정신은 §Y$ISR_regret_our_past_sephardics$§!, §Y$ISR_yemenite_affair$§! 또는 §Y$ISR_sephardic_cultural_heritage$§!처럼 세파르디의 불만을 해소하는 중점을 완료하면 §G개선§!되며, §Y$ISR_forgot_to_be_jews$§! 또는 §Y$ISR_empower_city_rabbis$§!와 같은 중점을 완료하면 §R악화§!됩니다. 최종 단계를 넘어 개선되면 §R제거§!됩니다."
 eddaic_ghost_6: "에다의 유령 - §7바다에 던져지다...§!"
 eddaic_ghost_6_desc: "유령의 병은 이제 물에 던져져 요르단 강을 떠돌고 있으며, §R누군가 그를 주워 다시 풀어 주기를 기다리고 있습니다...§! \n\n이스라엘은 아슈케나지 유대인, 즉 유럽 출신 유대인에 의해 건국되었으나, 아랍 국가들과의 전쟁으로 인해 세파르디로 불리는 북아프리카와 중동 출신 유대인 약 100만 명이 이스라엘로 오게 되었습니다. 노동당 정부들은 세파르디를 '용광로'로 아슈케나지 문화에 동화시키려 했고, 정부 보조금이 거의 없는 미개발 교외 도시에 이들을 던져 놓은 채 그들의 문화적 배경을 깔보았습니다. 오늘날 세파르디가 이스라엘 유대인의 다수임에도 불구하고 이들은 여전히 국가 기구에서 크게 과소 대표되고 있으며, 이는 분노와 종파 간 긴장으로 이어집니다.\n§W--------------§!\n이 국가 정신은 §Y$ISR_regret_our_past_sephardics$§!, §Y$ISR_yemenite_affair$§! 또는 §Y$ISR_sephardic_cultural_heritage$§!처럼 세파르디의 불만을 해소하는 중점을 완료하면 §G개선§!되며, §Y$ISR_forgot_to_be_jews$§! 또는 §Y$ISR_empower_city_rabbis$§!와 같은 중점을 완료하면 §R악화§!됩니다. 이를 개선하는 다음 중점으로 §R제거§!됩니다."
 peoples_army_1: "국민군 - §t방치됨§!"
 peoples_army_1_desc: "국민군 모델은 이스라엘의 건국의 아버지이자 초대 총리인 다비드 벤구리온이 시작한 개념으로, 그는 이스라엘 국방군을 모든 유대인 하위 집단을 단일한 이스라엘 정체성으로 동화시키려는 자신의 '용광로' 프로젝트의 도구로 보았습니다. 이 학파를 신봉하는 이들은 국방군이 단순히 나라를 지키는 것 이상으로 이스라엘 사회에서 더 큰 역할을 한다고 보며, 따라서 의무 복무 개념을 이스라엘의 생존뿐 아니라 이스라엘의 민주주의와 사회의 초석으로 여깁니다. 이에 따라 직업 군대로의 전환에 관한 모든 논의는 수십 년 동안 이스라엘에서 거대한 금기였지만, 초정통파의 병역 면제를 둘러싼 논쟁은 많은 평범한 이스라엘인들에게 자신들의 병역에 대한 의문을 제기했습니다. 이 논쟁을 가로막던 벽이 무너지고 있으며, 정부와 참모부는 이 문제를 다루어야 할 것입니다. \n\n§t국민군에서 멀어질수록§! 추가적인 육군 경험치와 지휘력을 얻고, 육군 교리 및 사단 편성 연구 비용이 저렴해집니다. §6국민군에 가까워질수록§! 정치력, 전쟁 지지도, 육군 사기, 모집 가능 인구를 얻습니다."
 peoples_army_2: "국민군 - §t신뢰 상실§!"
 peoples_army_2_desc: "국민군 모델은 이스라엘의 건국의 아버지이자 초대 총리인 다비드 벤구리온이 시작한 개념으로, 그는 이스라엘 국방군을 모든 유대인 하위 집단을 단일한 이스라엘 정체성으로 동화시키려는 자신의 '용광로' 프로젝트의 도구로 보았습니다. 이 학파를 신봉하는 이들은 국방군이 단순히 나라를 지키는 것 이상으로 이스라엘 사회에서 더 큰 역할을 한다고 보며, 따라서 의무 복무 개념을 이스라엘의 생존뿐 아니라 이스라엘의 민주주의와 사회의 초석으로 여깁니다. 이에 따라 직업 군대로의 전환에 관한 모든 논의는 수십 년 동안 이스라엘에서 거대한 금기였지만, 초정통파의 병역 면제를 둘러싼 논쟁은 많은 평범한 이스라엘인들에게 자신들의 병역에 대한 의문을 제기했습니다. 이 논쟁을 가로막던 벽이 무너지고 있으며, 정부와 참모부는 이 문제를 다루어야 할 것입니다. \n\n§t국민군에서 멀어질수록§! 추가적인 육군 경험치와 지휘력을 얻고, 육군 교리 및 사단 편성 연구 비용이 저렴해집니다. §6국민군에 가까워질수록§! 정치력, 전쟁 지지도, 육군 사기, 모집 가능 인구를 얻습니다."
