 literacy_progress_the_gap_ast_1: "격차 지속"
 closing_the_gap_event.2.t: "격차 해소 결과"
 closing_the_gap_event.2.d: "문해율과 사회 지원 캠페인을 몇 년간 추적한 결과, 안타깝게도 엇갈린 결과가 돌아왔습니다. 더 많은 아동이 등록하고 전반적으로 수감되는 성인은 줄었지만, 가정 외 보호율과 청소년 범죄는 꾸준히 증가하고 있습니다. 그 결과 소외된 오스트레일리아인을 주류 사회로 이끌려는 우리의 노력은 부분적으로 실패로 평가되는 듯합니다. \n\n프로그램에 더 많이 투자하여 작업을 계속하고 어쩌면 개선할 수도 있고, 지금 손실을 감수하고 중단할 수도 있습니다."
 closing_the_gap_event.2.a: "작업을 계속한다."
 closing_the_gap_event.2.b: "중단한다."
 closing_the_gap_event.3.d: "문해율과 사회 지원 캠페인을 몇 년간 추적한 결과, 긍정적인 결과가 돌아왔습니다. 더 많은 아동이 등록하고 전반적으로 수감되는 성인은 줄었으며, 가정 외 보호율과 청소년 범죄는 꾸준히 감소하고 있습니다. 소외된 오스트레일리아인을 주류 사회로 이끌려는 우리의 노력이 실제로 결실을 맺고 있는 듯합니다."
 closing_the_gap_event.3.a: "또 하나의 성공이다."
 preserving_the_old_models_ast: "국내 유산 보존"
 costellogov_focus: "코스텔로 정부"
 bob_brown_event_tt: "§G녹색당§!이 우리의 입법을 지지합니다."
 syrian_refugees_idea_ast: "시리아 난민 환영"
 syrian_civil_war_refugees_ast: "시리아 난민 대응"
 syrian_refugees_event_ast.1.t: "시리아 난민"
 syrian_refugees_event_ast.1.d: "시리아에서 분쟁이 발발하면서 수천 명의 난민이 우리나라에 망명을 신청하고 있습니다. 이들은 적법한 절차를 밟았으며, 이들이 피해 온 상황이라면 분명 입국 자격이 있지만, 결정은 결국 우리의 몫입니다. 이들을 받아들이면 더 많은 이들이 올바른 절차를 밟도록 장려할 수도 있지만, 또 다른 이주 위기의 수문을 열게 될 수도 있습니다."
 syrian_refugees_event_ast.1.a: "받아들인다."
 syrian_refugees_event_ast.1.b: "우리의 문제가 아니다."
 malaysianflight_event_ast.1.t: "MH370편 실종"
 malaysianflight_event_ast.1.d: "말레이시아 항공이 운항하던 국제선 여객기가 어제 남중국해 상공을 비행하던 중 레이더에서 사라졌고, 이 실종은 가족들을 무너뜨리고 항공사를 망연자실하게 만들었습니다. \n\n본래 베이징에 착륙할 예정이던 이 항공편은 사흘 전 말레이시아 수도를 출발해 항로를 비행하던 중 센서에서 불가사의하게 사라졌습니다. 당국은 잔해를 계속 수색하고 있으며, 실종 승객의 가족들은 최악의 상황에 대비하라는 통보를 받았습니다. 9개국에서 온 선박 40척과 항공기 34대가 수색에 참여하고 있지만, 말레이시아 당국은 무엇이 잘못되었는지 여전히 알지 못한다고 밝혔습니다."
 malaysianflight_event_ast.1.a: "어디로 사라졌단 말인가?"
 AST_keep_them_aligned: "그들을 묶어 두어라"
 AST_keep_them_aligned_desc: "국민당은 우리의 농업 정책, 혹은 정책의 부재를 놓고 소란을 일으키려 해 왔습니다. 이런 압박 전술이 이전 정부에는 통했을지 몰라도 우리가 내각을 운영하는 방식을 규정하지는 못할 것입니다. 우리는 우리 조건으로 농민들을 위한 자체 보조금을 지급하고, 이를 언론에 우리의 승리로 선포할 것입니다. \n\n그들이 우리와 손잡고 싶다면 우리의 조건을 따라야 함을 보여줍니다."
 AST_privatise_the_care: "의료를 민영화한다"
 AST_privatise_the_care_desc: "오스트레일리아 공공 의료 실험은 의료의 질이 거의 개선되지 않은 채 비용이 용인 가능하거나 감당 가능한 수준을 넘어서게 만들었습니다. 제도 일부를 민영화함으로써 진료를 원하는 이들에게 선택권 확대와 효율성 향상의 가능성을 환영합니다. 이는 검증된 모델이며 우리는 이를 채택할 용의가 있습니다."
 papua_affair.2.t: "오스트레일리아의 고무 제안"
 papua_affair.2.d: "캔버라 정부가 포트모르즈비 일대의 우리 고무 농장 일부에 대한 국가 후원을 제안했습니다. 그들에 따르면 이 거래는 양국 간 안정적인 무역을 강화하고 보장하기 위한 것이며, 특히 일부 관세를 무효화합니다. 현지 소농들은 수출 증가라는 이점을 들어 요청을 지지하지만, 이 제안은 장차 우리가 그들에게 더 의존하게 만들 수도 있습니다."
 papua_affair.2.a: "좋은 거래다."
 papua_affair.2.b: "거래는 없다."
 papua_affair.3.t: "고무 확보"
 papua_affair.3.d: "다행히 총리가 회담을 다시 시도하는 데 동의했고 우리의 제안을 지지했습니다. 포트모르즈비 일대의 농민들은 수요 증가와 후한 보조금을 누리게 될 것이며, 우리는 성장하는 산업에 쓸 고무를 꾸준히 공급받게 됩니다. 이번 합의로 지역 전체가 혜택을 얻을 것입니다."
 papua_affair.3.a: "또 하나의 성공적인 거래."
 papua_affair.4.t: "무응답"
 papua_affair.4.d: "안타깝게도 파푸아 뉴기니 대표단은 지금 우리와의 회담에 응할 의사가 없습니다. 아니면 전화 받는 법을 잊어버렸을지도 모릅니다. 실망스러운 결과이지만, 그동안 우리는 고무 확보를 국내에서 더 확대할 수 있습니다."
 papua_affair.4.a: "모든 걸 이길 순 없다."
