 STAT_AIR_RANGE: "£air_range_texticon Alcance de Voo: "
 STAT_AIR_AGILITY: "£speed_intercept_texticon Vantagem de Radar: "
 STAT_AIR_AGILITY_DESC: "Como as características furtivas de uma aeronave, a aviônica da aeronave, os sistemas de armas e o treinamento de pilotos proporcionam uma vantagem em um BVR e no combate aproximado."
 STAT_AIR_DEFENCE: "£defence_air_texticon Defesa Aérea: "
 STAT_AIR_DEFENCE_DESC: "A capacidade de uma aeronave de enganar e/ou manobrar ou eliminar duramente uma ameaça de armas que se aproxima."
 STAT_NAVY_RAIDING_COORDINATION:1 "£coordination_texticon Coordenação de Pilhagem: "
 STAT_NAVY_PATROL_COORDINATION:1 "£coordination_texticon Coordenação de Patrulha: "
 STAT_NAVY_TORPEDO_ATTACK: "£torpedo_texticon Torpedos:"
 STAT_NAVY_TORPEDO_ATTACK_DESC: "O quanto de dano podemos causar ao usar os torpedos do navio."
 STAT_NAVY_HG_ATTACK:1 "£rocket_modifiericons_texticon Mísseis Antinavio:"
 STAT_NAVY_HG_ATTACK_DESC: "A quantidade de dano e ataque que os mísseis antinavio são capazes de causar a navios inimigos."
 STAT_NAVY_HG_ARMOR_PIERCING:1 "£rocket_modifiericons_texticon Perfuração de Mísseis Antinavio:"
 STAT_NAVY_HG_ARMOR_PIERCING_DESC: "Esta estatística representa quão bem os ataques de mísseis antinavio conseguirão penetrar as defesas de ponto e a blindagem inimiga."
 STAT_NAVY_LG_ATTACK:1 "£naval_battery2_texticon Ataque de Canhão:"
 STAT_NAVY_LG_ATTACK_DESC: "Dano causado por artilharia naval, canhões automáticos e metralhadoras; este também é o valor para o bombardeio costeiro."
 STAT_NAVY_LG_ARMOR_PIERCING:1 "£piercing_texticon Perfuração do Canhão:"
 STAT_NAVY_LG_ARMOR_PIERCING_DESC: "Perfuração da armadura dos canhões leves, valores de perfuração mais altos aumentam a chance de golpes críticos, enquanto valores de perfuração abaixo da armadura inimiga reduzem drasticamente o dano."
 STAT_NAVY_SURFACE_VISIBILITY: "£surface_visibility_texticon Visibilidade em Superfície: "
 STAT_NAVY_SURFACE_VISIBILITY_DESC: "Quão fácil é encontrar e atingir este navio, valores menores aumentarão a sobrevivência do navio e o tornarão mais difícil de ser avistado."
