 module_analog_fire_control: "Système de Contrôle de Tir Analogique"
 module_analog_fire_control_desc: "Les systèmes de contrôle de tir analogiques sont mieux décrits comme des systèmes opérés manuellement."
 module_digital_integrated_fire_control: "Système de Contrôle de Tir Intégré Numérique"
 module_digital_integrated_fire_control_desc: "Des interfaces numériques intégrées dans les systèmes pour permettre un leadership et une maintenance plus efficaces depuis le pont du navire."
 module_advanced_integrated_missile_radar_control: "Contrôle Radar de Missile Intégré Avancé"
 module_advanced_integrated_missile_radar_control_desc: "Le contrôle radar de missile intégré avancé est mieux décrit par l'intégration du missile et du radar pour permettre des réactions plus rapides et plus précises aux menaces entrantes."
 module_chain_gun: "Mitrailleuses I"
 module_chain_gun_desc: "Les mitrailleuses légères comprennent tout, des petites mitrailleuses de soutien de calibre .30 aux canons anti-aériens de calibre .50. Ce dernier étant l'armement le plus populaire pour un navire de guerre."
 module_ciws_1: "Système d'arme rapproché I"
 module_ciws_1_desc: "Les premiers systèmes d'armes rapprochées offrent une dernière ligne de défense contre missiles et avions entrants. Utilisant des autocanons guidés par radar, ces systèmes offrent une capacité de défense ponctuelle limitée mais cruciale pour les navires de guerre modernes.\n\n§GIndice du concepteur : ce système de défense rapprochée améliore la DCA et le blindage tout en ajoutant un peu de puissance de santé. Utile contre les menaces aériennes et missiles, mais ajoute un coût de production, de carburant, de main-d'œuvre et de visibilité de surface.§!\n§GIndice concepteur : ce système de défense rapprochée améliore la DCA et le blindage tout en ajoutant un peu de points de vie. Utile contre les menaces aériennes et missiles, mais ajoute coût de production, carburant, effectifs et visibilité de surface.§!"
 module_ciws_2: "Système d'arme rapproché II"
 module_ciws_2_desc: "Les améliorations du suivi radar et du contrôle de tir renforcent l'efficacité des systèmes d'armes rapprochées. Des temps de réaction plus courts et une meilleure précision augmentent la survie contre les premiers missiles antinavires.\n\n§GIndice du concepteur : ce système de défense rapprochée améliore la DCA et le blindage tout en ajoutant un peu de puissance de santé. Utile contre les menaces aériennes et missiles, mais ajoute un coût de production, de carburant, de main-d'œuvre et de visibilité de surface.§!\n§GIndice concepteur : ce système de défense rapprochée améliore la DCA et le blindage tout en ajoutant un peu de points de vie. Utile contre les menaces aériennes et missiles, mais ajoute coût de production, carburant, effectifs et visibilité de surface.§!"
 module_ciws_3: "Système d'arme rapproché III"
 module_ciws_3_desc: "Les CIWS de troisième génération intègrent capteurs avancés et ciblage informatisé, permettant de meilleures portées d'engagement et des taux d'interception plus élevés contre les menaces supersoniques.\n\n§GIndice du concepteur : ce système de défense rapprochée améliore la DCA et le blindage tout en ajoutant un peu de puissance de santé. Utile contre les menaces aériennes et missiles, mais ajoute un coût de production, de carburant, de main-d'œuvre et de visibilité de surface.§!\n§GIndice concepteur : ce système de défense rapprochée améliore la DCA et le blindage tout en ajoutant un peu de points de vie. Utile contre les menaces aériennes et missiles, mais ajoute coût de production, carburant, effectifs et visibilité de surface.§!"
 module_ciws_4: "Système d'arme rapproché IV"
 module_ciws_4_desc: "Les systèmes d'armes rapprochées modernes combinent radar affiné, ciblage électro-optique et armes à cadence plus élevée. Ces systèmes améliorent nettement la défense ponctuelle contre les attaques de saturation par missiles.\n\n§GIndice du concepteur : ce système de défense rapprochée améliore la DCA et le blindage tout en ajoutant un peu de puissance de santé. Utile contre les menaces aériennes et missiles, mais ajoute un coût de production, de carburant, de main-d'œuvre et de visibilité de surface.§!\n§GIndice concepteur : ce système de défense rapprochée améliore la DCA et le blindage tout en ajoutant un peu de points de vie. Utile contre les menaces aériennes et missiles, mais ajoute coût de production, carburant, effectifs et visibilité de surface.§!"
 module_ciws_5: "Système d'arme rapproché V"
 module_ciws_5_desc: "Les plateformes CIWS hautement automatisées utilisent des capteurs en réseau et des algorithmes de suivi améliorés pour contrer missiles de croisière avancés et munitions guidées de précision avec plus de fiabilité.\n\n§GIndice du concepteur : ce système de défense rapprochée améliore la DCA et le blindage tout en ajoutant un peu de puissance de santé. Utile contre les menaces aériennes et missiles, mais ajoute un coût de production, de carburant, de main-d'œuvre et de visibilité de surface.§!\n§GIndice concepteur : ce système de défense rapprochée améliore la DCA et le blindage tout en ajoutant un peu de points de vie. Utile contre les menaces aériennes et missiles, mais ajoute coût de production, carburant, effectifs et visibilité de surface.§!"
 module_ciws_6: "Système d'arme rapproché VI"
 module_ciws_6_desc: "Les systèmes d'armes rapprochées de pointe représentent le haut degré de sophistication de la défense ponctuelle, intégrant capteurs de pointe, ciblage assisté par IA et intercepteurs à réponse rapide pour vaincre même les menaces de missiles les plus avancées.\n\n§GIndice du concepteur : ce système de défense rapprochée améliore la DCA et le blindage tout en ajoutant un peu de puissance de santé. Utile contre les menaces aériennes et missiles, mais ajoute un coût de production, de carburant, de main-d'œuvre et de visibilité de surface.§!\n§GIndice concepteur : ce système de défense rapprochée améliore la DCA et le blindage tout en ajoutant un peu de points de vie. Utile contre les menaces aériennes et missiles, mais ajoute coût de production, carburant, effectifs et visibilité de surface.§!"
 module_railgun_1: "Railguns I"
 module_railgun_1_desc: "L'avenir des canons basés sur les navires. Les railguns tirent des projectiles à la vitesse du son pour déchiqueter la coque d'un ennemi, ou pour détruire des cibles beaucoup plus loin que ce que l'on pensait possible auparavant."
 module_railgun_2: "Railguns II"
 module_railgun_2_desc: "L'avenir des canons basés sur les navires. Les railguns tirent des projectiles à la vitesse du son pour déchiqueter la coque d'un ennemi, ou pour détruire des cibles beaucoup plus loin que ce que l'on pensait possible auparavant."
 module_railgun_3: "Railguns III"
 module_railgun_3_desc: "L'avenir des canons basés sur les navires. Les railguns tirent des projectiles à la vitesse du son pour déchiqueter la coque d'un ennemi, ou pour détruire des cibles beaucoup plus loin que ce que l'on pensait possible auparavant."
 module_railgun_4: "Railguns IV"
 module_railgun_4_desc: "L'avenir des canons basés sur les navires. Les railguns tirent des projectiles à la vitesse du son pour déchiqueter la coque d'un ennemi, ou pour détruire des cibles beaucoup plus loin que ce que l'on pensait possible auparavant."
 module_ram_1: "RAM I"
 module_ram_1_desc: "Les premiers systèmes de missiles Rolling Airframe offrent une solution légère de défense ponctuelle à missiles contre avions et missiles antinavires. Limités en portée et en sophistication de guidage, ils renforcent grandement les capacités défensives d'un navire.\n\n§GIndice du concepteur : les systèmes RAM offrent une forte DCA et un fort blindage pour la défense rapprochée tout en ajoutant un peu de puissance de santé. Utile contre les menaces aériennes et missiles, mais coûtent plus de CI, de carburant et de main-d'œuvre que les défenses à canons.§!\n§GIndice concepteur : les systèmes RAM offrent une forte DCA et du blindage pour la défense de point tout en ajoutant quelques points de vie. Utiles contre les menaces aériennes et missiles, mais coûtent plus de CI, de carburant et d'effectifs que les défenses à canons.§!"
 module_ram_2: "RAM II"
 module_ram_2_desc: "Les raffinements de la technologie de chercheur et de la réactivité des missiles améliorent l'efficacité des systèmes RAM. Un suivi et une interception plus fiables permettent une meilleure protection contre les missiles de croisière de première génération.\n\n§GIndice du concepteur : les systèmes RAM offrent une forte DCA et un fort blindage pour la défense rapprochée tout en ajoutant un peu de puissance de santé. Utile contre les menaces aériennes et missiles, mais coûtent plus de CI, de carburant et de main-d'œuvre que les défenses à canons.§!\n§GIndice concepteur : les systèmes RAM offrent une forte DCA et du blindage pour la défense de point tout en ajoutant quelques points de vie. Utiles contre les menaces aériennes et missiles, mais coûtent plus de CI, de carburant et d'effectifs que les défenses à canons.§!"
 module_ram_3: "RAM III"
 module_ram_3_desc: "Les systèmes RAM de troisième génération intègrent un guidage dual-mode amélioré et des temps de réaction plus courts, augmentant la probabilité de toucher contre menaces manœuvrantes et supersoniques.\n\n§GIndice du concepteur : les systèmes RAM offrent une forte DCA et un fort blindage pour la défense rapprochée tout en ajoutant un peu de puissance de santé. Utile contre les menaces aériennes et missiles, mais coûtent plus de CI, de carburant et de main-d'œuvre que les défenses à canons.§!\n§GIndice concepteur : les systèmes RAM offrent une forte DCA et du blindage pour la défense de point tout en ajoutant quelques points de vie. Utiles contre les menaces aériennes et missiles, mais coûtent plus de CI, de carburant et d'effectifs que les défenses à canons.§!"
 module_ram_4: "RAM IV"
 module_ram_4_desc: "Les lanceurs RAM modernes disposent de chercheurs avancés et d'une meilleure intégration du contrôle de tir, permettant une défense plus efficace contre les attaques de saturation et les menaces de missiles à faible observabilité.\n\n§GIndice du concepteur : les systèmes RAM offrent une forte DCA et un fort blindage pour la défense rapprochée tout en ajoutant un peu de puissance de santé. Utile contre les menaces aériennes et missiles, mais coûtent plus de CI, de carburant et de main-d'œuvre que les défenses à canons.§!\n§GIndice concepteur : les systèmes RAM offrent une forte DCA et du blindage pour la défense de point tout en ajoutant quelques points de vie. Utiles contre les menaces aériennes et missiles, mais coûtent plus de CI, de carburant et d'effectifs que les défenses à canons.§!"
 module_ram_5: "RAM V"
 module_ram_5_desc: "Les systèmes RAM très avancés bénéficient de données de capteurs en réseau et d'algorithmes de guidage affinés, offrant une interception fiable des munitions guidées modernes dans des environnements de combat complexes.\n\n§GIndice du concepteur : les systèmes RAM offrent une forte DCA et un fort blindage pour la défense rapprochée tout en ajoutant un peu de puissance de santé. Utile contre les menaces aériennes et missiles, mais coûtent plus de CI, de carburant et de main-d'œuvre que les défenses à canons.§!\n§GIndice concepteur : les systèmes RAM offrent une forte DCA et du blindage pour la défense de point tout en ajoutant quelques points de vie. Utiles contre les menaces aériennes et missiles, mais coûtent plus de CI, de carburant et d'effectifs que les défenses à canons.§!"
 module_ram_6: "RAM VI"
 module_ram_6_desc: "Les plateformes RAM de pointe représentent l'apogée de la défense ponctuelle à missiles, intégrant systèmes de guidage de pointe, résistance accrue aux contre-mesures et capacités d'engagement rapide pour vaincre les menaces aériennes les plus avancées.\n\n§GIndice du concepteur : les systèmes RAM offrent une forte DCA et un fort blindage pour la défense rapprochée tout en ajoutant un peu de puissance de santé. Utile contre les menaces aériennes et missiles, mais coûtent plus de CI, de carburant et de main-d'œuvre que les défenses à canons.§!\n§GIndice concepteur : les systèmes RAM offrent une forte DCA et du blindage pour la défense de point tout en ajoutant quelques points de vie. Utiles contre les menaces aériennes et missiles, mais coûtent plus de CI, de carburant et d'effectifs que les défenses à canons.§!"
 module_torpedoes_1: "Torpilles ASM I"
 module_torpedoes_1_desc: "Les premières torpilles ASM offrent une capacité de frappe sous-marine de base contre les sous-marins. Limités en portée et en guidage, ces armes améliorent la capacité d'un navire à se défendre contre les menaces immergées.\n\n§GIndice du concepteur : les torpilles ASM offrent une forte lutte anti-sous-marine pour détruire les sous-marins après détection. Utile sur escortes et chasseurs dédiés, mais ajoutent des coûts de production, de carburant et de main-d'œuvre sans aider contre les navires de surface.§!\n§GIndice concepteur : les torpilles ASM offrent une forte lutte anti-sous-marine pour détruire les sous-marins une fois détectés. Utiles sur escortes et chasseurs dédiés, mais ajoutent des coûts de production, de carburant et d'effectifs sans aider contre les navires de surface.§!"
 module_torpedoes_2: "Torpilles ASM II"
 module_torpedoes_2_desc: "Les torpilles ASM améliorées disposent de systèmes de homing sonar et de propulsion renforcés, augmentant l'efficacité de détection et d'engagement contre les sous-marins modernes.\n\n§GIndice du concepteur : les torpilles ASM offrent une forte lutte anti-sous-marine pour détruire les sous-marins après détection. Utile sur escortes et chasseurs dédiés, mais ajoutent des coûts de production, de carburant et de main-d'œuvre sans aider contre les navires de surface.§!\n§GIndice concepteur : les torpilles ASM offrent une forte lutte anti-sous-marine pour détruire les sous-marins une fois détectés. Utiles sur escortes et chasseurs dédiés, mais ajoutent des coûts de production, de carburant et d'effectifs sans aider contre les navires de surface.§!"
 module_torpedoes_3: "Torpilles ASM III"
 module_torpedoes_3_desc: "Les torpilles ASM modernes intègrent des algorithmes de guidage avancés et des vitesses plus élevées, permettant une interception plus fiable de cibles sous-marines évasives.\n\n§GIndice du concepteur : les torpilles ASM offrent une forte lutte anti-sous-marine pour détruire les sous-marins après détection. Utile sur escortes et chasseurs dédiés, mais ajoutent des coûts de production, de carburant et de main-d'œuvre sans aider contre les navires de surface.§!\n§GIndice concepteur : les torpilles ASM offrent une forte lutte anti-sous-marine pour détruire les sous-marins une fois détectés. Utiles sur escortes et chasseurs dédiés, mais ajoutent des coûts de production, de carburant et d'effectifs sans aider contre les navires de surface.§!"
 module_torpedoes_4: "Torpilles ASM IV"
 module_torpedoes_4_desc: "Les torpilles ASM très avancées utilisent des capteurs sophistiqués, une meilleure résistance aux contre-mesures et de plus longues portées, permettant d'engager efficacement les sous-marins dans des environnements opérationnels complexes.\n\n§GIndice du concepteur : les torpilles ASM offrent une forte lutte anti-sous-marine pour détruire les sous-marins après détection. Utile sur escortes et chasseurs dédiés, mais ajoutent des coûts de production, de carburant et de main-d'œuvre sans aider contre les navires de surface.§!\n§GIndice concepteur : les torpilles ASM offrent une forte lutte anti-sous-marine pour détruire les sous-marins une fois détectés. Utiles sur escortes et chasseurs dédiés, mais ajoutent des coûts de production, de carburant et d'effectifs sans aider contre les navires de surface.§!"
 module_torpedoes_5: "Torpilles ASM V"
 module_torpedoes_5_desc: "Les torpilles ASM de nouvelle génération mettent l'accent sur les approches furtives, le ciblage intelligent et une endurance étendue, offrant une capacité supérieure de neutralisation des menaces sous-marines.\n\n§GIndice du concepteur : les torpilles ASM offrent une forte lutte anti-sous-marine pour détruire les sous-marins après détection. Utile sur escortes et chasseurs dédiés, mais ajoutent des coûts de production, de carburant et de main-d'œuvre sans aider contre les navires de surface.§!\n§GIndice concepteur : les torpilles ASM offrent une forte lutte anti-sous-marine pour détruire les sous-marins une fois détectés. Utiles sur escortes et chasseurs dédiés, mais ajoutent des coûts de production, de carburant et d'effectifs sans aider contre les navires de surface.§!"
 module_torpedoes_6: "Torpilles ASM VI"
 module_torpedoes_6_desc: "Les torpilles ASM de pointe représentent le pinacle de la technologie de lutte anti-sous-marine, intégrant guidage assisté par IA, vitesse extrême et systèmes avancés de contre-contre-mesures pour dominer les champs de bataille sous-marins modernes.\n\n§GIndice du concepteur : les torpilles ASM offrent une forte lutte anti-sous-marine pour détruire les sous-marins après détection. Utile sur escortes et chasseurs dédiés, mais ajoutent des coûts de production, de carburant et de main-d'œuvre sans aider contre les navires de surface.§!\n§GIndice concepteur : les torpilles ASM offrent une forte lutte anti-sous-marine pour détruire les sous-marins une fois détectés. Utiles sur escortes et chasseurs dédiés, mais ajoutent des coûts de production, de carburant et d'effectifs sans aider contre les navires de surface.§!"
 module_anti_ship_torpedoes_1: "Torpilles Polyvalentes I"
 module_anti_ship_torpedoes_1_desc: "Les premières torpilles duales offrent une capacité de frappe sous-marine et de surface de base. Limités en portée et en guidage, elles permettent aux navires d'engager sous-marins et cibles de surface.\n\n§GIndice du concepteur : les torpilles duales offrent une attaque de torpille contre les navires de surface et une lutte anti-sous-marine contre les sous-marins. Armement flexible à coût de CI modéré, mais moins spécialisées que les armes ASM dédiées.§!"
 module_anti_ship_torpedoes_2: "Torpilles Polyvalentes II"
 module_anti_ship_torpedoes_2_desc: "Les torpilles duales améliorées disposent de systèmes de homing et de propulsion renforcés, augmentant la précision contre menaces immergées et de surface.\n\n§GIndice du concepteur : les torpilles duales offrent une attaque de torpille contre les navires de surface et une lutte anti-sous-marine contre les sous-marins. Armement flexible à coût de CI modéré, mais moins spécialisées que les armes ASM dédiées.§!"
 module_anti_ship_torpedoes_3: "Torpilles Polyvalentes III"
 module_anti_ship_torpedoes_3_desc: "Les torpilles duales modernes intègrent un guidage avancé et une vitesse plus élevée, améliorant la fiabilité des engagements contre sous-marins évasifs et navires de surface agiles.\n\n§GIndice du concepteur : les torpilles duales offrent une attaque de torpille contre les navires de surface et une lutte anti-sous-marine contre les sous-marins. Armement flexible à coût de CI modéré, mais moins spécialisées que les armes ASM dédiées.§!"
 module_anti_ship_torpedoes_4: "Torpilles Polyvalentes IV"
 module_anti_ship_torpedoes_4_desc: "Les torpilles duales très avancées utilisent des capteurs sophistiqués, une portée étendue et une résistance aux contre-mesures, permettant des frappes efficaces dans des environnements maritimes complexes.\n\n§GIndice du concepteur : les torpilles duales offrent une attaque de torpille contre les navires de surface et une lutte anti-sous-marine contre les sous-marins. Armement flexible à coût de CI modéré, mais moins spécialisées que les armes ASM dédiées.§!"
 module_anti_ship_torpedoes_5: "Torpilles Polyvalentes V"
 module_anti_ship_torpedoes_5_desc: "Les torpilles duales de nouvelle génération mettent l'accent sur les approches furtives, le ciblage intelligent et une endurance accrue, offrant des capacités offensives et défensives supérieures contre sous-marins et navires de surface.\n\n§GIndice du concepteur : les torpilles duales offrent une attaque de torpille contre les navires de surface et une lutte anti-sous-marine contre les sous-marins. Armement flexible à coût de CI modéré, mais moins spécialisées que les armes ASM dédiées.§!"
 module_anti_ship_torpedoes_6: "Torpilles Polyvalentes VI"
 module_anti_ship_torpedoes_6_desc: "Les torpilles duales du futur proche représentent le pinacle de la technologie des torpilles, combinant guidage assisté par IA, vitesse extrême et systèmes avancés de contre-contre-mesures pour dominer les champs de bataille sous-marins et de surface.\n\n§GIndice du concepteur : les torpilles duales offrent une attaque de torpille contre les navires de surface et une lutte anti-sous-marine contre les sous-marins. Armement flexible à coût de CI modéré, mais moins spécialisées que les armes ASM dédiées.§!"
 module_aa_guns_1: "Canons Anti-Aériens I"
 module_aa_guns_1_desc: "Les premiers systèmes de canons antiaériens offrent une défense de base contre les avions ennemis. Efficaces à courte portée, ils aident à protéger les navires des attaques aériennes mais sont limités en cadence de tir et en précision de ciblage.\n\n§GIndice du concepteur : les canons antiaériens améliorent la DCA et le blindage, utiles pour les navires nécessitant une protection dédiée contre les avions ennemis.§!"
 module_aa_guns_2: "Canons Anti-Aériens II"
 module_aa_guns_2_desc: "Les canons antiaériens améliorés disposent de cadences plus élevées et de systèmes de ciblage renforcés, permettant aux navires de mieux engager des avions plus rapides et plus manœuvrants.\n\n§GIndice du concepteur : les canons antiaériens améliorent la DCA et le blindage, utiles pour les navires nécessitant une protection dédiée contre les avions ennemis.§!"
 module_aa_guns_3: "Canons Anti-Aériens III"
 module_aa_guns_3_desc: "Les canons antiaériens modernes intègrent contrôle de tir avancé et stabilisation, permettant un suivi et un engagement fiables de menaces aériennes à haute vitesse et volant bas.\n\n§GIndice du concepteur : les canons antiaériens améliorent la DCA et le blindage, utiles pour les navires nécessitant une protection dédiée contre les avions ennemis.§!"
 module_aa_guns_4: "Canons Anti-Aériens IV"
 module_aa_guns_4_desc: "Les systèmes de canons antiaériens très avancés utilisent un ciblage automatisé et des munitions améliorées, offrant une défense efficace contre attaques aériennes massées et munitions guidées de précision.\n\n§GIndice du concepteur : les canons antiaériens améliorent la DCA et le blindage, utiles pour les navires nécessitant une protection dédiée contre les avions ennemis.§!"
 module_aa_guns_5: "Canons Anti-Aériens V"
 module_aa_guns_5_desc: "Les canons antiaériens de nouvelle génération combinent capacité de tir rapide, réseaux de capteurs intégrés et précision supérieure pour une défense aérienne complète contre menaces aériennes modernes et émergentes.\n\n§GIndice du concepteur : les canons antiaériens améliorent la DCA et le blindage, utiles pour les navires nécessitant une protection dédiée contre les avions ennemis.§!"
 module_radar_1: "Radar I"
 module_radar_1_desc: "Les premiers radars navals offrent une détection de base des menaces de surface et aériennes. Limités en portée et en résolution, ils fournissent une conscience situationnelle fondamentale pour les opérations de flotte.\n\n§GIndice du concepteur : le radar améliore la détection de surface et de sous-marins tout en renforçant les missiles antinavires, l'attaque de torpille et la DCA. Convient aux navires de combat polyvalents, mais coûte plus de CI et de puces que le sonar.§!"
 module_radar_2: "Radar II"
 module_radar_2_desc: "Les systèmes radar améliorés disposent de portées de détection plus élevées et d'une meilleure résolution de cible, permettant aux navires d'identifier les menaces plus tôt et de coordonner plus efficacement les actions défensives.\n\n§GIndice du concepteur : le radar améliore la détection de surface et de sous-marins tout en renforçant les missiles antinavires, l'attaque de torpille et la DCA. Convient aux navires de combat polyvalents, mais coûte plus de CI et de puces que le sonar.§!"
 module_radar_3: "Radar III"
 module_radar_3_desc: "Les plateformes radar modernes intègrent traitement de signal avancé et suivi automatisé, renforçant la détection d'avions rapides et de cibles de surface dans des environnements encombrés.\n\n§GIndice du concepteur : le radar améliore la détection de surface et de sous-marins tout en renforçant les missiles antinavires, l'attaque de torpille et la DCA. Convient aux navires de combat polyvalents, mais coûte plus de CI et de puces que le sonar.§!"
 module_radar_4: "Radar IV"
 module_radar_4_desc: "Les systèmes radar très avancés offrent le suivi multi-cibles, une portée améliorée et une résistance aux contre-mesures électroniques, fournissant une conscience situationnelle fiable en zones contestées.\n\n§GIndice du concepteur : le radar améliore la détection de surface et de sous-marins tout en renforçant les missiles antinavires, l'attaque de torpille et la DCA. Convient aux navires de combat polyvalents, mais coûte plus de CI et de puces que le sonar.§!"
 module_radar_5: "Radar V"
 module_radar_5_desc: "Les systèmes radar de nouvelle génération combinent détection à longue portée, ciblage de précision et intégration transparente aux systèmes de combat de bord, renforçant grandement la réponse aux menaces à l'échelle de la flotte.\n\n§GIndice du concepteur : le radar améliore la détection de surface et de sous-marins tout en renforçant les missiles antinavires, l'attaque de torpille et la DCA. Convient aux navires de combat polyvalents, mais coûte plus de CI et de puces que le sonar.§!"
 module_radar_6: "Radar VI"
 module_radar_6_desc: "Les plateformes radar du futur proche disposent d'analyse de signal assistée par IA, de détection multi-spectre et d'un suivi avancé des cibles à faible observabilité, permettant une conscience situationnelle maritime supérieure.\n\n§GIndice du concepteur : le radar améliore la détection de surface et de sous-marins tout en renforçant les missiles antinavires, l'attaque de torpille et la DCA. Convient aux navires de combat polyvalents, mais coûte plus de CI et de puces que le sonar.§!"
 module_radar_7: "Radar VII"
 module_radar_7_desc: "La technologie radar de pointe intègre fusion de capteurs en réseau, détection à portée extrême et priorisation automatisée des menaces, représentant le pinacle des capacités navales de détection et d'acquisition de cibles.\n\n§GIndice du concepteur : le radar améliore la détection de surface et de sous-marins tout en renforçant les missiles antinavires, l'attaque de torpille et la DCA. Convient aux navires de combat polyvalents, mais coûte plus de CI et de puces que le sonar.§!"
 module_sonar_1: "Sonar I"
 module_sonar_1_desc: "Les premiers sonars de bord offrent une détection de base des sous-marins à proximité immédiate. Limités en portée et en résolution, ils donnent aux bâtiments une conscience sous-marine fondamentale.\n\n§GIndice du concepteur : le sonar met l'accent sur la détection de sous-marins tout en améliorant aussi la détection de surface, les missiles antinavires et l'attaque de torpille. Choix économique pour les navires ASM, mais offre un soutien de combat moins large que le radar.§!"
 module_sonar_2: "Sonar II"
 module_sonar_2_desc: "Les systèmes sonar améliorés disposent d'une portée de détection et d'une résolution renforcées, permettant aux navires de suivre plus efficacement les sous-marins et de répondre aux menaces sous-marines avec plus de précision.\n\n§GIndice du concepteur : le sonar met l'accent sur la détection de sous-marins tout en améliorant aussi la détection de surface, les missiles antinavires et l'attaque de torpille. Choix économique pour les navires ASM, mais offre un soutien de combat moins large que le radar.§!"
 module_sonar_3: "Sonar III"
 module_sonar_3_desc: "Les plateformes sonar modernes intègrent traitement de signal avancé et stabilisation, améliorant la capacité de détecter des sous-marins rapides ou évasifs dans des environnements maritimes complexes.\n\n§GIndice du concepteur : le sonar met l'accent sur la détection de sous-marins tout en améliorant aussi la détection de surface, les missiles antinavires et l'attaque de torpille. Choix économique pour les navires ASM, mais offre un soutien de combat moins large que le radar.§!"
 module_sonar_4: "Sonar IV"
 module_sonar_4_desc: "Les systèmes sonar très avancés offrent une détection de sous-marins à longue portée, une meilleure classification des cibles et une résistance au bruit et aux contre-mesures, renforçant les opérations anti-sous-marines de la flotte.\n\n§GIndice du concepteur : le sonar met l'accent sur la détection de sous-marins tout en améliorant aussi la détection de surface, les missiles antinavires et l'attaque de torpille. Choix économique pour les navires ASM, mais offre un soutien de combat moins large que le radar.§!"
 module_sonar_5: "Sonar V"
 module_sonar_5_desc: "Les systèmes sonar de nouvelle génération intègrent plusieurs bandes de fréquences et des algorithmes de suivi automatisés, permettant une détection fiable des sous-marins furtifs modernes sur de longues portées.\n\n§GIndice du concepteur : le sonar met l'accent sur la détection de sous-marins tout en améliorant aussi la détection de surface, les missiles antinavires et l'attaque de torpille. Choix économique pour les navires ASM, mais offre un soutien de combat moins large que le radar.§!"
 module_sonar_6: "Sonar VI"
 module_sonar_6_desc: "Les plateformes sonar du futur proche emploient l'analyse de signal assistée par IA et la fusion multi-capteurs, permettant une localisation précise des sous-marins et une meilleure conscience situationnelle dans des conditions difficiles.\n\n§GIndice du concepteur : le sonar met l'accent sur la détection de sous-marins tout en améliorant aussi la détection de surface, les missiles antinavires et l'attaque de torpille. Choix économique pour les navires ASM, mais offre un soutien de combat moins large que le radar.§!"
 module_sonar_7: "Sonar VII"
 module_sonar_7_desc: "La technologie sonar de pointe combine détection à portée extrême, priorisation des menaces en temps réel et réduction avancée du bruit, représentant le pinacle de la détection sous-marine et de la lutte anti-sous-marine.\n\n§GIndice du concepteur : le sonar met l'accent sur la détection de sous-marins tout en améliorant aussi la détection de surface, les missiles antinavires et l'attaque de torpille. Choix économique pour les navires ASM, mais offre un soutien de combat moins large que le radar.§!"
 module_minelaying: "Poseur de Mines"
 module_minelaying_desc: "Permet le déploiement de mines marines, laissant les navires miner une zone maritime avec des explosifs sous-marins.\n\n§GIndice du concepteur : l'équipement de mouillage de mines active la mission de mouillage et ajoute le mouillage. Utile pour contrôler des zones maritimes stratégiques, mais ajoute coût de production, carburant, main-d'œuvre et visibilité de surface.§!"
 module_mineclearing: "Démolisseur de Mines"
 module_mineclearing_desc: "Permet le dragage des mines d'une région maritime par ce navire.\n\n§GIndice du concepteur : l'équipement de dragage active la mission de dragage et ajoute le dragage. Utile pour garder ouvertes d'importantes voies maritimes, mais ajoute coût de production, carburant et visibilité de surface.§!"
 module_anti_submarine_mortar: "Mortier Anti-Sous-Marin"
 module_anti_submarine_mortar_desc: "Les mortiers anti-sous-marins montés à bord offrent une capacité de frappe sous-marine à courte portée. Efficaces pour se défendre contre les sous-marins proches, ils complètent sonar et torpilles.\n\n§GIndice du concepteur : un mortier anti-sous-marin ajoute de la lutte anti-sous-marine à très faible coût de production et de main-d'œuvre. Utile comme armement ASM économique à courte portée, mais n'offre aucune capacité de détection par lui-même.§!"
 module_surface_oil_power: "Moteur à Combustion Interne"
 module_surface_oil_power_desc: "Les premiers moteurs à mazout offrent une propulsion fiable aux bâtiments de surface, avec vitesse et endurance modérées.\n\n§GIndice du concepteur : la propulsion au mazout est un moteur peu coûteux pour les navires n'ayant besoin que d'une vitesse et d'une portée maximale modestes. Convient aux flottes côtières abordables, mais augmente carburant et visibilité de surface.§!\n§GIndice concepteur : la propulsion au fioul est un moteur peu coûteux pour les navires qui n'ont besoin que d'une vitesse et d'une portée maximale modestes. Elle convient aux flottes côtières abordables, mais augmente la consommation de carburant et la visibilité de surface.§!"
 module_surface_jet_turbine_power: "Moteur à Turbine à Gaz"
 module_surface_jet_turbine_power_desc: "Les premières turbines à réaction offrent des hausses de vitesse importantes aux bâtiments de surface, sacrifiant une partie de l'efficacité énergétique à la performance.\n\n§GIndice du concepteur : les turbines à réaction offrent davantage de vitesse et de portée maximale avec moins de visibilité de surface que les moteurs conventionnels. Conviennent aux flottes de combat régionales, mais augmentent le coût de production et le carburant.§!\n§GIndice concepteur : les turbines à réaction offrent plus de vitesse et de portée maximale avec moins de visibilité de surface que les moteurs conventionnels. Elles conviennent aux flottes de combat régionales, mais augmentent le coût de production et la consommation de carburant.§!"
 module_surface_jet_turbine_power2: "Moteur à Turbine à Gaz Avancé"
 module_surface_jet_turbine_power2_desc: "Les turbines à réaction affinées renforcent la puissance et l'efficacité, permettant des opérations à haute vitesse soutenues avec une meilleure fiabilité.\n\n§GIndice du concepteur : les turbines à réaction offrent davantage de vitesse et de portée maximale avec moins de visibilité de surface que les moteurs conventionnels. Conviennent aux flottes de combat régionales, mais augmentent le coût de production et le carburant.§!\n§GIndice concepteur : les turbines à réaction offrent plus de vitesse et de portée maximale avec moins de visibilité de surface que les moteurs conventionnels. Elles conviennent aux flottes de combat régionales, mais augmentent le coût de production et la consommation de carburant.§!"
 module_surface_jet_turbine_power3: "Moteur à Turbine à Gaz Futuriste"
 module_surface_jet_turbine_power3_desc: "Les turbines de nouvelle génération offrent vitesse, efficacité et endurance de pointe pour les combattants de surface modernes.\n\n§GIndice du concepteur : les turbines à réaction offrent davantage de vitesse et de portée maximale avec moins de visibilité de surface que les moteurs conventionnels. Conviennent aux flottes de combat régionales, mais augmentent le coût de production et le carburant.§!\n§GIndice concepteur : les turbines à réaction offrent plus de vitesse et de portée maximale avec moins de visibilité de surface que les moteurs conventionnels. Elles conviennent aux flottes de combat régionales, mais augmentent le coût de production et la consommation de carburant.§!"
 module_light_surface_jet_turbine_power: "Moteur à Turbine à Gaz Léger"
 module_light_surface_jet_turbine_power_desc: "Les turbines à réaction légères augmentent la vitesse des petits bâtiments tout en maintenant une consommation gérable.\n\n§GIndice du concepteur : les turbines à réaction légères offrent davantage de vitesse et de portée maximale avec moins de visibilité de surface que les diesels. Conviennent aux combattants régionaux rapides, mais augmentent le coût de production et le carburant.§!"
 module_light_surface_jet_turbine_power2: "Moteur à Turbine à Gaz Léger Avancé"
 module_light_surface_jet_turbine_power2_desc: "Les turbines de petite échelle améliorées offrent de meilleurs rapports puissance/poids et une fiabilité renforcée pour les engins d'attaque rapides.\n\n§GIndice du concepteur : les turbines à réaction légères offrent davantage de vitesse et de portée maximale avec moins de visibilité de surface que les diesels. Conviennent aux combattants régionaux rapides, mais augmentent le coût de production et le carburant.§!"
 module_light_surface_jet_turbine_power3: "Moteur à Turbine à Gaz Léger Futuriste"
 module_light_surface_jet_turbine_power3_desc: "Les turbines de pointe offrent une vitesse et une endurance exceptionnelles aux combattants de surface légers modernes.\n\n§GIndice du concepteur : les turbines à réaction légères offrent davantage de vitesse et de portée maximale avec moins de visibilité de surface que les diesels. Conviennent aux combattants régionaux rapides, mais augmentent le coût de production et le carburant.§!"
 module_light_surface_early_reactor_power: "Réacteur Léger Précoce"
 module_light_surface_early_reactor_power_desc: "Les premiers réacteurs nucléaires offrent aux petits bâtiments une propulsion fiable à longue endurance avec un ravitaillement minimal.\n\n§GIndice du concepteur : la propulsion nucléaire légère offre une grande vitesse, une portée maximale exceptionnelle et un fonctionnement sans carburant. Convient aux navires légers de déploiement mondial, mais est extrêmement coûteuse à construire.§!\n§GIndice concepteur : la propulsion nucléaire légère offre une haute vitesse, une portée maximale exceptionnelle et un fonctionnement sans carburant. Elle convient aux navires légers destinés au déploiement mondial, mais est extrêmement coûteuse à construire.§!"
 module_light_surface_mod_reactor_power: "Réacteur Léger Moderne"
 module_light_surface_mod_reactor_power_desc: "Les réacteurs légers modernes augmentent la puissance et l'efficacité opérationnelle, soutenant des opérations à haute vitesse soutenues.\n\n§GIndice du concepteur : la propulsion nucléaire légère offre une grande vitesse, une portée maximale exceptionnelle et un fonctionnement sans carburant. Convient aux navires légers de déploiement mondial, mais est extrêmement coûteuse à construire.§!\n§GIndice concepteur : la propulsion nucléaire légère offre une haute vitesse, une portée maximale exceptionnelle et un fonctionnement sans carburant. Elle convient aux navires légers destinés au déploiement mondial, mais est extrêmement coûteuse à construire.§!"
 module_surface_early_reactor_power: "Réacteur Précoce"
 module_surface_early_reactor_power_desc: "Les premiers réacteurs navals offrent aux combattants de surface une propulsion à longue portée indépendante du carburant et des performances stables.\n\n§GIndice du concepteur : la propulsion nucléaire offre une vitesse croissante, une portée maximale exceptionnelle et un fonctionnement sans carburant. Convient aux flottes déployées mondialement, mais est extrêmement coûteuse à construire.§!"
 module_surface_adv_reactor_power: "Réacteur Avancé"
 module_surface_adv_reactor_power_desc: "Les réacteurs avancés offrent une plus haute densité de puissance et une meilleure efficacité, permettant des déploiements prolongés et des navires plus rapides.\n\n§GIndice du concepteur : la propulsion nucléaire offre une vitesse croissante, une portée maximale exceptionnelle et un fonctionnement sans carburant. Convient aux flottes déployées mondialement, mais est extrêmement coûteuse à construire.§!"
 module_surface_mod_reactor_power: "Réacteur Moderne"
 module_surface_mod_reactor_power_desc: "Les réacteurs modernes combinent haute puissance, efficacité énergétique et fiabilité pour des opérations navales soutenues.\n\n§GIndice du concepteur : la propulsion nucléaire offre une vitesse croissante, une portée maximale exceptionnelle et un fonctionnement sans carburant. Convient aux flottes déployées mondialement, mais est extrêmement coûteuse à construire.§!"
 module_surface_fut_reactor_power: "Réacteur Futuriste"
 module_surface_fut_reactor_power_desc: "Les réacteurs de nouvelle génération offrent des performances de pointe, une efficacité exceptionnelle et une endurance quasi illimitée aux bâtiments de surface les plus modernes.\n\n§GIndice du concepteur : la propulsion nucléaire offre une vitesse croissante, une portée maximale exceptionnelle et un fonctionnement sans carburant. Convient aux flottes déployées mondialement, mais est extrêmement coûteuse à construire.§!"
 module_sub_diesel_electric_power: "Puissance Diesel Électrique 1"
 module_sub_diesel_electric_power_desc: "Les premiers systèmes diesel-électriques offrent une propulsion immergée et en surface de base aux sous-marins, avec une endurance limitée.\n\n§GIndice du concepteur : la propulsion diesel-électrique offre un sous-marin abordable dépendant du carburant, avec vitesse, portée maximale et furtivité croissantes aux paliers ultérieurs. Convient aux opérations locales et régionales, mais ne peut égaler l'endurance mondiale d'un réacteur.§!"
 module_sub_diesel_electric_power2: "Puissance Diesel Électrique 2"
 module_sub_diesel_electric_power2_desc: "Les systèmes diesel-électriques améliorés augmentent l'efficacité et l'endurance des batteries, permettant des opérations immergées plus longues.\n\n§GIndice du concepteur : la propulsion diesel-électrique offre un sous-marin abordable dépendant du carburant, avec vitesse, portée maximale et furtivité croissantes aux paliers ultérieurs. Convient aux opérations locales et régionales, mais ne peut égaler l'endurance mondiale d'un réacteur.§!"
 module_sub_diesel_electric_power3: "Puissance Diesel Électrique 3"
 module_sub_diesel_electric_power3_desc: "La propulsion diesel-électrique moderne offre des vitesses plus élevées et une meilleure endurance immergée pour la flexibilité tactique.\n\n§GIndice du concepteur : la propulsion diesel-électrique offre un sous-marin abordable dépendant du carburant, avec vitesse, portée maximale et furtivité croissantes aux paliers ultérieurs. Convient aux opérations locales et régionales, mais ne peut égaler l'endurance mondiale d'un réacteur.§!"
 module_sub_diesel_electric_power4: "Puissance Diesel Électrique 4"
 module_sub_diesel_electric_power4_desc: "Les systèmes diesel-électriques avancés améliorent furtivité et efficacité énergétique, étendant la portée opérationnelle immergée.\n\n§GIndice du concepteur : la propulsion diesel-électrique offre un sous-marin abordable dépendant du carburant, avec vitesse, portée maximale et furtivité croissantes aux paliers ultérieurs. Convient aux opérations locales et régionales, mais ne peut égaler l'endurance mondiale d'un réacteur.§!"
 module_sub_diesel_electric_power5: "Puissance Diesel Électrique 5"
 module_sub_diesel_electric_power5_desc: "La propulsion diesel-électrique de nouvelle génération offre un équilibre optimal de vitesse, d'endurance et de furtivité immergée pour les sous-marins modernes.\n\n§GIndice du concepteur : la propulsion diesel-électrique offre un sous-marin abordable dépendant du carburant, avec vitesse, portée maximale et furtivité croissantes aux paliers ultérieurs. Convient aux opérations locales et régionales, mais ne peut égaler l'endurance mondiale d'un réacteur.§!"
 module_sub_early_reactor_power: "Puissance du Réacteur Précoce"
 module_sub_early_reactor_power_desc: "Les premiers réacteurs nucléaires permettent aux sous-marins de rester immergés pendant de longues périodes, améliorant drastiquement l'endurance opérationnelle.\n\n§GIndice du concepteur : la propulsion nucléaire donne aux sous-marins une grande vitesse, une portée maximale exceptionnelle et un fonctionnement sans carburant. Convient aux déploiements mondiaux, mais coûte plus de CI et est généralement plus facile à détecter que le diesel-électrique.§!\n§GIndice concepteur : la propulsion nucléaire donne aux sous-marins une haute vitesse, une portée maximale exceptionnelle et un fonctionnement sans carburant. Elle convient aux déploiements mondiaux, mais coûte plus de CI et est généralement plus facile à détecter que la propulsion diesel-électrique.§!"
 module_sub_adv_reactor_power: "Puissance du Réacteur Avancé"
 module_sub_adv_reactor_power_desc: "Les réacteurs nucléaires avancés offrent une plus haute puissance, soutenant des vitesses plus élevées et des opérations immergées plus longues.\n\n§GIndice du concepteur : la propulsion nucléaire donne aux sous-marins une grande vitesse, une portée maximale exceptionnelle et un fonctionnement sans carburant. Convient aux déploiements mondiaux, mais coûte plus de CI et est généralement plus facile à détecter que le diesel-électrique.§!\n§GIndice concepteur : la propulsion nucléaire donne aux sous-marins une haute vitesse, une portée maximale exceptionnelle et un fonctionnement sans carburant. Elle convient aux déploiements mondiaux, mais coûte plus de CI et est généralement plus facile à détecter que la propulsion diesel-électrique.§!"
 module_sub_mod_reactor_power: "Puissance du Réacteur Moderne"
 module_sub_mod_reactor_power_desc: "Les réacteurs modernes intègrent une meilleure efficacité et fiabilité, permettant des opérations immergées soutenues à haute vitesse.\n\n§GIndice du concepteur : la propulsion nucléaire donne aux sous-marins une grande vitesse, une portée maximale exceptionnelle et un fonctionnement sans carburant. Convient aux déploiements mondiaux, mais coûte plus de CI et est généralement plus facile à détecter que le diesel-électrique.§!\n§GIndice concepteur : la propulsion nucléaire donne aux sous-marins une haute vitesse, une portée maximale exceptionnelle et un fonctionnement sans carburant. Elle convient aux déploiements mondiaux, mais coûte plus de CI et est généralement plus facile à détecter que la propulsion diesel-électrique.§!"
 module_sub_fut_reactor_power: "Puissance du Réacteur Futuriste"
 module_sub_fut_reactor_power_desc: "Les réacteurs nucléaires de pointe délivrent une endurance, une vitesse et des capacités de furtivité inégalées aux sous-marins du futur proche.\n\n§GIndice du concepteur : la propulsion nucléaire donne aux sous-marins une grande vitesse, une portée maximale exceptionnelle et un fonctionnement sans carburant. Convient aux déploiements mondiaux, mais coûte plus de CI et est généralement plus facile à détecter que le diesel-électrique.§!\n§GIndice concepteur : la propulsion nucléaire donne aux sous-marins une haute vitesse, une portée maximale exceptionnelle et un fonctionnement sans carburant. Elle convient aux déploiements mondiaux, mais coûte plus de CI et est généralement plus facile à détecter que la propulsion diesel-électrique.§!"
 module_light_helipad_1: "Héliport Léger I"
 module_light_helipad_1_desc: "Les installations d'hélisurface légères de base permettent aux petits navires d'exploiter un hélicoptère pour la reconnaissance et des tâches ASM limitées.\n\n§GIndice du concepteur : les hélisurfaces légères améliorent la détection de sous-marins, la lutte anti-sous-marine, la détection de surface et le dragage de mines à moindre coût que les hélisurfaces complètes. Conviennent aux petites escortes ASM, mais ajoutent encore carburant, main-d'œuvre et visibilité de surface.§!\n§GIndice concepteur : les hélipads légers améliorent la détection sous-marine, la lutte ASM, la détection de surface et le dragage à moindre coût que les hélipads complets. Ils conviennent aux petites escortes ASM, mais ajoutent encore carburant, effectifs et visibilité de surface.§!"
 module_light_helipad_2: "Héliport Léger II"
 module_light_helipad_2_desc: "Les hélisurfaces légères renforcées offrent un meilleur soutien aux opérations à voilure tournante, améliorant ASM, surveillance et transport.\n\n§GIndice du concepteur : les hélisurfaces légères améliorent la détection de sous-marins, la lutte anti-sous-marine, la détection de surface et le dragage de mines à moindre coût que les hélisurfaces complètes. Conviennent aux petites escortes ASM, mais ajoutent encore carburant, main-d'œuvre et visibilité de surface.§!\n§GIndice concepteur : les hélipads légers améliorent la détection sous-marine, la lutte ASM, la détection de surface et le dragage à moindre coût que les hélipads complets. Ils conviennent aux petites escortes ASM, mais ajoutent encore carburant, effectifs et visibilité de surface.§!"
 module_heavy_guns_1: "Canons Lourds I"
 module_heavy_guns_1_desc: "Les premiers systèmes de canons lourds offrent aux bâtiments de surface une puissance de feu de base à longue portée contre navires et cibles côtières.\n\n§GIndice du concepteur : les canons lourds offrent une forte attaque de canon et des PV de navire, mais pas de perforation de canon. Utilisez-les pour le bombardement côtier et contre les navires non blindés, mais attendez-vous à des coûts substantiels de CI, main-d'œuvre et carburant, ainsi qu'une visibilité accrue.§!\n§GIndice concepteur : les canons lourds offrent une forte attaque de canons et des PV de navire, mais pas de perforation de canons. Utilisez-les pour le bombardement côtier et le combat contre navires non blindés, mais attendez-vous à d'importants coûts en CI, effectifs et carburant, ainsi qu'une visibilité accrue.§!"
 module_heavy_guns_2: "Canons Lourds II"
 module_heavy_guns_2_desc: "Les canons lourds améliorés offrent des cadences plus élevées, une meilleure précision et une vitesse d'obus accrue pour les engagements navals.\n\n§GIndice du concepteur : les canons lourds offrent une forte attaque de canon et des PV de navire, mais pas de perforation de canon. Utilisez-les pour le bombardement côtier et contre les navires non blindés, mais attendez-vous à des coûts substantiels de CI, main-d'œuvre et carburant, ainsi qu'une visibilité accrue.§!\n§GIndice concepteur : les canons lourds offrent une forte attaque de canons et des PV de navire, mais pas de perforation de canons. Utilisez-les pour le bombardement côtier et le combat contre navires non blindés, mais attendez-vous à d'importants coûts en CI, effectifs et carburant, ainsi qu'une visibilité accrue.§!"
 module_heavy_guns_3: "Canons Lourds III"
 module_heavy_guns_3_desc: "Les canons lourds modernes intègrent systèmes de contrôle de tir avancés, stabilisateurs et munitions améliorées pour des performances de combat à longue portée supérieures.\n\n§GIndice du concepteur : les canons lourds offrent une forte attaque de canon et des PV de navire, mais pas de perforation de canon. Utilisez-les pour le bombardement côtier et contre les navires non blindés, mais attendez-vous à des coûts substantiels de CI, main-d'œuvre et carburant, ainsi qu'une visibilité accrue.§!\n§GIndice concepteur : les canons lourds offrent une forte attaque de canons et des PV de navire, mais pas de perforation de canons. Utilisez-les pour le bombardement côtier et le combat contre navires non blindés, mais attendez-vous à d'importants coûts en CI, effectifs et carburant, ainsi qu'une visibilité accrue.§!"
 module_76mm_battery: "Batterie de 76mm"
 module_127mm_battery: "Batterie de 127mm"
 module_100mm_battery: "Batterie de 100mm"
 module_152mm_battery: "Batterie de 152mm"
 module_76mm_battery_desc: "Batterie navale légère offrant une capacité de tir rapide pour la défense antiaérienne et de surface à courte portée.\n\n§GIndice du concepteur : les batteries de canons offrent attaque de canon, DCA et puissance de santé pour une défense de surface et aérienne polyvalente. Les plus grandes batteries ajoutent plus de puissance de feu, mais exigent aussi plus de CI, de carburant, de main-d'œuvre et de visibilité de surface.§!\n§GIndice concepteur : les batteries de canons offrent attaque de canons, DCA et points de vie pour une défense de surface et aérienne polyvalente. Les batteries plus grandes ajoutent plus de puissance de feu, mais exigent aussi plus de CI, de carburant, d'effectifs et de visibilité de surface.§!"
 module_127mm_battery_desc: "Batterie navale moyenne efficace contre cibles de surface et avions à moyennes portées.\n\n§GIndice du concepteur : les batteries de canons offrent attaque de canon, DCA et puissance de santé pour une défense de surface et aérienne polyvalente. Les plus grandes batteries ajoutent plus de puissance de feu, mais exigent aussi plus de CI, de carburant, de main-d'œuvre et de visibilité de surface.§!\n§GIndice concepteur : les batteries de canons offrent attaque de canons, DCA et points de vie pour une défense de surface et aérienne polyvalente. Les batteries plus grandes ajoutent plus de puissance de feu, mais exigent aussi plus de CI, de carburant, d'effectifs et de visibilité de surface.§!"
 module_100mm_battery_desc: "Batterie navale standard offrant une puissance de feu polyvalente contre menaces de surface et aériennes.\n\n§GIndice du concepteur : les batteries de canons offrent attaque de canon, DCA et puissance de santé pour une défense de surface et aérienne polyvalente. Les plus grandes batteries ajoutent plus de puissance de feu, mais exigent aussi plus de CI, de carburant, de main-d'œuvre et de visibilité de surface.§!\n§GIndice concepteur : les batteries de canons offrent attaque de canons, DCA et points de vie pour une défense de surface et aérienne polyvalente. Les batteries plus grandes ajoutent plus de puissance de feu, mais exigent aussi plus de CI, de carburant, d'effectifs et de visibilité de surface.§!"
 module_152mm_battery_desc: "Batterie navale lourde délivrant un feu puissant à longue portée contre navires et fortifications côtières.\n\n§GIndice du concepteur : les batteries de canons offrent attaque de canon, DCA et puissance de santé pour une défense de surface et aérienne polyvalente. Les plus grandes batteries ajoutent plus de puissance de feu, mais exigent aussi plus de CI, de carburant, de main-d'œuvre et de visibilité de surface.§!\n§GIndice concepteur : les batteries de canons offrent attaque de canons, DCA et points de vie pour une défense de surface et aérienne polyvalente. Les batteries plus grandes ajoutent plus de puissance de feu, mais exigent aussi plus de CI, de carburant, d'effectifs et de visibilité de surface.§!"
 module_76mm_gun_1: "76mm Tir Rapide Précoce"
 module_76mm_gun_2: "76mm Tir Rapide"
 module_76mm_gun_3: "76mm Tir Rapide - Munitions Guidées"
 module_76mm_gun_4: "76mm Tir Ultra Rapide - Munitions Guidées"
 module_76mm_gun_1_desc: "Les premiers canons de 76 mm à tir rapide offrent une puissance de feu antiaérienne et de surface à courte portée de base.\n\n§GIndice du concepteur : les canons navals offrent attaque de canon et DCA avec un peu de puissance de santé. Utiles comme armes duales économiques, mais ajoutent CI, carburant, main-d'œuvre et visibilité de surface sans perforation de canon.§!"
 module_76mm_gun_2_desc: "Les canons de 76 mm à tir rapide améliorés augmentent cadence et précision pour une défense multi-rôles.\n\n§GIndice du concepteur : les canons navals offrent attaque de canon et DCA avec un peu de puissance de santé. Utiles comme armes duales économiques, mais ajoutent CI, carburant, main-d'œuvre et visibilité de surface sans perforation de canon.§!"
 module_76mm_gun_3_desc: "Équipés de munitions guidées, ces canons de 76 mm améliorent la probabilité de toucher contre des cibles rapides ou manœuvrantes.\n\n§GIndice du concepteur : les canons navals offrent attaque de canon et DCA avec un peu de puissance de santé. Utiles comme armes duales économiques, mais ajoutent CI, carburant, main-d'œuvre et visibilité de surface sans perforation de canon.§!"
 module_76mm_gun_4_desc: "Les canons de 76 mm à ultra-tir rapide avec munitions guidées offrent des performances antiaériennes et antisurface exceptionnelles à courte et moyenne portées.\n\n§GIndice du concepteur : les canons navals offrent attaque de canon et DCA avec un peu de puissance de santé. Utiles comme armes duales économiques, mais ajoutent CI, carburant, main-d'œuvre et visibilité de surface sans perforation de canon.§!"
 module_127mm_guns_1: "127mm I"
 module_127mm_guns_2: "127mm II"
 module_127mm_guns_3: "127mm III"
 module_127mm_guns_4: "127mm IV"
 module_127mm_guns_1_desc: "Les premiers canons navals de 127 mm offrent une puissance de feu modérée pour les engagements de surface et une capacité antiaérienne limitée.\n\n§GIndice du concepteur : les canons navals offrent attaque de canon et DCA avec un peu de puissance de santé. Utiles comme armes duales économiques, mais ajoutent CI, carburant, main-d'œuvre et visibilité de surface sans perforation de canon.§!"
 module_127mm_guns_2_desc: "Les canons de 127 mm améliorés offrent une cadence plus élevée et une meilleure précision, accroissant l'efficacité contre les menaces navales modernes.\n\n§GIndice du concepteur : les canons navals offrent attaque de canon et DCA avec un peu de puissance de santé. Utiles comme armes duales économiques, mais ajoutent CI, carburant, main-d'œuvre et visibilité de surface sans perforation de canon.§!"
 module_127mm_guns_3_desc: "Les canons de 127 mm modernes intègrent contrôle de tir avancé et stabilisation pour des engagements fiables à longue portée.\n\n§GIndice du concepteur : les canons navals offrent attaque de canon et DCA avec un peu de puissance de santé. Utiles comme armes duales économiques, mais ajoutent CI, carburant, main-d'œuvre et visibilité de surface sans perforation de canon.§!"
 module_127mm_guns_4_desc: "Les canons navals de 127 mm très avancés offrent une précision, une portée et une cadence supérieures, les rendant efficaces contre navires et avions.\n\n§GIndice du concepteur : les canons navals offrent attaque de canon et DCA avec un peu de puissance de santé. Utiles comme armes duales économiques, mais ajoutent CI, carburant, main-d'œuvre et visibilité de surface sans perforation de canon.§!"
 tech_light_guns_1: "Canons navals 2000"
 tech_light_guns_1_desc: "Systèmes d’armes navales de petit et grand calibre, conçus pour permettre l’engagement de cibles terrestres et aériennes."
 tech_light_guns_2: "Canons navals 2025"
 tech_light_guns_2_desc: "Systèmes d’armes navales de petit et grand calibre, conçus pour permettre l’engagement de cibles terrestres et aériennes."
 tech_light_guns_3: "Canons navals 2045"
 tech_light_guns_3_desc: "Systèmes d’armes navales de petit et grand calibre, conçus pour permettre l’engagement de cibles terrestres et aériennes."
 module_heavy_frigate_upgrade_package: "Pack de Mise à Niveau de Frégate Lourde"
 module_heavy_frigate_upgrade_package_desc: "Bien que nous ayons la capacité de construire des frégates, nous sommes dans une impasse concernant les classes de navires plus lourdes. Il faudrait des années de matériaux et d'investissements pour nous préparer à des navires plus lourds tels que les Destroyers. Nous pourrions améliorer nos frégates pour être plus compétitives contre les navires plus lourds en les améliorant et en les renforçant dans une nouvelle classe, la \"Frégate Lourde\".\n\n"
 NAVAL_TITLE_POINT_DEFENSE_SYSTEM: "SYSTÈMES DE DÉFENSE DE POINT"
