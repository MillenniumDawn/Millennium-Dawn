 ukraine_modernize_sov_equipment_btr_60_modernization_btr_60m_desc: "\n\n\n\n\n\n£UKR_desctext_modernize_sov_btr60m_for_tooltip\n\n\n\n\n\n\n\n\n§W수백 대의 소련제 §YBTR-60PB§!가 아직 우리 군에서 복무하고 있습니다. 가솔린 엔진 두 기는 연료를 많이 먹고 불이 붙기 쉽습니다. 하르키우의 모로조프 설계국이 §YBTR-60M§!을 설계했는데, BMP-1의 300마력 UTD-20 디젤 엔진 한 기가 이를 대체하고 14.5mm KPVT가 달린 기존 포탑은 그대로 유지됩니다. §Y미콜라이우 장갑차 공장§!이 이를 생산할 준비가 되어 있습니다.\n\n이후의 BTR-60 개량은 이 형식을 바탕으로 합니다.\n------------------\n이 결정은 §YBTR-60MK§! 결정의 §R선행 조건§!입니다. 이 결정을 §R건너뛰면§! 해당 결정을 완료할 기회를 §R잃게§! 됩니다.§!"
 ukraine_modernize_sov_equipment_btr_60_modernization_btr_60m_mission: "마지막 기회: §YBTR-60M§!"
 ukraine_modernize_sov_equipment_btr_60_modernization_btr_60m_mission_desc: "$ukraine_modernize_sov_equipment_btr_60_modernization_btr_60m_desc$\n\n§R타이머가 끝나면 공장이 제안을 철회합니다.§!"
 ukraine_modernize_sov_equipment_btr_60_modernization_approach: "우리 §YBTR-60§!의 미래 선택"
 ukraine_modernize_sov_equipment_btr_60_modernization_approach_desc: "\n\n\n\n\n\n£UKR_desctext_modernize_sov_btr60_for_tooltip\n\n\n\n\n\n\n\n\n§W동부의 전쟁은 우리가 가진 모든 장갑차가 여전히 필요하다는 것을 보여 주었습니다. 국방부는 낡은 BTR-60을 어떻게 계속 운용할지 결정하려 합니다. 이미 §YBTR-60M§!이 있다면 §YKORT§!사가 이를 더 발전시킬 수 있습니다. §YNVK 테크임펙스§!는 모든 BTR-60PB에 적용할 수 있는 소규모 개량을 제안합니다.\n------------------\n이 결정은 §YBTR-60MK§! 및 §YBTR-60PB-T§! 결정의 §R선행 조건§!입니다. 이 결정을 §R건너뛰면§! 해당 결정들을 완료할 기회를 §R잃게§! 됩니다.§!"
 ukraine_modernize_sov_equipment_btr_60_modernization_approach_mission: "기한: 우리 §YBTR-60§!의 미래"
 ukraine_modernize_sov_equipment_btr_60_modernization_approach_mission_desc: "$ukraine_modernize_sov_equipment_btr_60_modernization_approach_desc$\n\n§R타이머가 끝나면 어쨌든 선택해야 합니다.§!"
 ukraine_modernize_sov_equipment_btr_60_modernization_kort_btr_60mk: "KORT사에 §YBTR-60MK§! 주문"
 ukraine_modernize_sov_equipment_btr_60_modernization_kort_btr_60mk_desc: "\n\n\n\n\n\n£UKR_desctext_modernize_sov_btr60mk_for_tooltip\n\n\n\n\n\n\n\n\n§W§YKORT§!사가 우리의 §YBTR-60M§! 작업을 바탕으로 개발합니다. §YBTR-60MK§!는 커민스 디젤 엔진 두 기, 추가 장갑, 병력용 확대 측면 해치를 갖춥니다. 이후 포탑은 14.5mm와 7.62mm 기관총, AGS-17 유탄발사기를 갖춘 미콜라이우 전투 모듈로 교체할 수 있습니다.§!"
 ukraine_modernize_sov_equipment_btr_60_modernization_kort_btr_60mk_mission: "마지막 기회: §YBTR-60MK§!"
 ukraine_modernize_sov_equipment_btr_60_modernization_kort_btr_60mk_mission_desc: "$ukraine_modernize_sov_equipment_btr_60_modernization_kort_btr_60mk_desc$\n\n§R타이머가 끝나면 KORT사가 제안을 철회합니다.§!"
 ukraine_modernize_sov_equipment_btr_60_modernization_techimpex_btr_60pb_t: "테크임펙스에 §YBTR-60PB-T§! 주문"
 ukraine_modernize_sov_equipment_btr_60_modernization_techimpex_btr_60pb_t_desc: "\n\n\n\n\n\n£UKR_desctext_modernize_sov_btr60pb_t_for_tooltip\n\n\n\n\n\n\n\n\n§W§YNVK 테크임펙스§!가 §YBTR-60PB-T§!를 제안합니다. 기존 포탑은 BM-23-2 전투 모듈로 교체되고, 가솔린 엔진은 디젤 엔진으로 대체되며, 엔진 냉각 장치, 수류 추진 장치, 전기 장비가 새것으로 바뀝니다.§!"
 ukraine_modernize_sov_equipment_btr_60_modernization_techimpex_btr_60pb_t_mission: "마지막 기회: §YBTR-60PB-T§!"
 ukraine_modernize_sov_equipment_btr_60_modernization_techimpex_btr_60pb_t_mission_desc: "$ukraine_modernize_sov_equipment_btr_60_modernization_techimpex_btr_60pb_t_desc$\n\n§R타이머가 끝나면 테크임펙스가 제안을 철회합니다.§!"
 ukraine_modernize_sov_equipment_btr_60_modernization_techimpex_btr_60pb_t_no_tech: "테크임펙스와 §YBTR-60PB-T§! 개발"
 ukraine_modernize_sov_equipment_btr_60_modernization_techimpex_btr_60pb_t_no_tech_desc: "$ukraine_modernize_sov_equipment_btr_60_modernization_techimpex_btr_60pb_t_desc$\n\n§W우리는 아직 자체 무인 포탑이 없어 §YNVK 테크임펙스§!가 BM-23-2용 거치대를 처음부터 개발해야 합니다. 작업은 더 오래 걸리고 비용도 더 들지만, 그 대가로 해당 기술을 얻습니다.§!"
 ukraine_modernize_sov_equipment_btr_60_modernization_techimpex_btr_60pb_t_no_tech_mission: "마지막 기회: §YBTR-60PB-T§!"
 ukraine_modernize_sov_equipment_btr_60_modernization_techimpex_btr_60pb_t_no_tech_mission_desc: "$ukraine_modernize_sov_equipment_btr_60_modernization_techimpex_btr_60pb_t_no_tech_desc$\n\n§R타이머가 끝나면 테크임펙스가 제안을 철회합니다.§!"
 ukraine_modernize_sov_equipment_btr_60_modernization_unmanned_turret_tt: "§YBTR-60PB-T§!를 채택하면 §Y현대식 전투 지휘 장비 및 보조 장비§! 기술도 함께 얻으며, 이 기술로 §Y무인 포탑§!이 해금됩니다."
 ukraine_modernize_sov_equipment_btr_60_modernization.1.name: "BTR-60M 준비 완료"
 ukraine_modernize_sov_equipment_btr_60_modernization.1.desc: "미콜라이우 공장이 §YBTR-60M§!을 완성했습니다. 이제 UTD-20 디젤 엔진 한 기가 가솔린 엔진 두 기의 역할을 해내므로 연료 소모와 화재 위험이 줄었으며, 기존 포탑은 14.5mm KPVT와 7.62mm PKT를 유지합니다. 앞으로 다른 기업들이 이 설계를 바탕으로 개발할 수 있습니다."
 ukraine_modernize_sov_equipment_btr_60_modernization.1.a: "§YBTR-60M§!을 채택한다"
 ukraine_modernize_sov_equipment_btr_60_modernization.1.b: "계획을 보류한다"
 ukraine_modernize_sov_equipment_btr_60_modernization.2.name: "우리 BTR-60의 미래"
 ukraine_modernize_sov_equipment_btr_60_modernization.2.desc: "국방부에 BTR-60 관련 제안이 두 건 올라와 있습니다. §YKORT§!사는 커민스 디젤 엔진, 추가 장갑, 더 큰 해치로 우리의 §YBTR-60M§!을 더 발전시키려 합니다. §YNVK 테크임펙스§!는 낡은 차량을 재무장하고 디젤 엔진을 달아 주는 §YBTR-60PB-T§!를 제안합니다."
 ukraine_modernize_sov_equipment_btr_60_modernization.2.a: "KORT사와 함께 §YBTR-60M§!을 더 발전시킨다"
 ukraine_modernize_sov_equipment_btr_60_modernization.2.b: "테크임펙스의 §YBTR-60PB-T§!로 방향을 돌린다"
 ukraine_modernize_sov_equipment_btr_60_modernization.3.name: "우리 BTR-60의 미래"
 ukraine_modernize_sov_equipment_btr_60_modernization.3.desc: "우리는 §YBTR-60M§!을 만든 적이 없으므로 BTR-60의 대규모 개량은 처음부터 시작해야 합니다. 대신 §YNVK 테크임펙스§!가 소규모 개량을 제안합니다. §YBTR-60PB-T§!는 낡은 차량을 재무장하고 디젤 엔진을 달아 줍니다."
 ukraine_modernize_sov_equipment_btr_60_modernization.3.a: "테크임펙스에 소규모 개량을 주문한다"
 ukraine_modernize_sov_equipment_btr_60_modernization.4.name: "BTR-60MK 준비 완료"
 ukraine_modernize_sov_equipment_btr_60_modernization.4.desc: "§YKORT§!사가 커민스 디젤 엔진 두 기, 추가 장갑, 병력용 확대 측면 해치를 갖춘 §YBTR-60MK§!를 완성했습니다."
 ukraine_modernize_sov_equipment_btr_60_modernization.4.a: "§YBTR-60MK§!를 채택한다"
 ukraine_modernize_sov_equipment_btr_60_modernization.4.b: "계획을 보류한다"
 ukraine_modernize_sov_equipment_btr_60_modernization.5.name: "BTR-60PB-T 준비 완료"
 ukraine_modernize_sov_equipment_btr_60_modernization.5.desc: "§YNVK 테크임펙스§!가 BM-23-2 전투 모듈, 디젤 엔진, 새로 교체한 냉각·수류 추진·전기 계통을 갖춘 §YBTR-60PB-T§!를 인도했습니다."
 ukraine_modernize_sov_equipment_btr_60_modernization.5.a: "§YBTR-60PB-T§!를 채택한다"
 ukraine_modernize_sov_equipment_btr_60_modernization.5.b: "계획을 보류한다"
 ukraine_modernize_sov_equipment_btr_60_modernization_btr_60m_unlocks_tt: "§YBTR-60M으로 이후 결정이 열립니다.§! §YKORT§!사의 §YBTR-60MK§!는 이것을 바탕으로만 만들 수 있습니다."
 ukraine_modernize_sov_equipment_btr_60_modernization_techimpex_plan_tt: "§YNVK 테크임펙스§!는 §Y2019년§! 중반까지 §YBTR-60PB-T§!를 제안합니다."
 ukraine_modernize_sov_equipment_btr_60_modernization_kort_plan_tt: "§YKORT§!사는 §Y2019년§! 중반까지 §YBTR-60MK§!를 제안합니다."
 ukraine_modernize_sov_equipment_btr_60_modernization_mykolayiv_wait_tt: "§Y미콜라이우 장갑차 공장§!이 약 §Y$DAYS$§!일 뒤 결과물을 공개합니다."
 ukraine_modernize_sov_equipment_btr_60_modernization_kort_wait_tt: "§YKORT§!사가 약 §Y$DAYS$§!일 뒤 결과물을 공개합니다."
 ukraine_modernize_sov_equipment_btr_60_modernization_techimpex_wait_tt: "§YNVK 테크임펙스§!가 약 §Y$DAYS$§!일 뒤 결과물을 공개합니다."
 ukraine_modernize_sov_equipment_btr_60_modernization_convert_tt: "이제 생산 라인에서 우리의 구형 1세대 장갑차를 이 형식으로 §G전환§!할 수 있습니다."
 ukraine_modernize_sov_equipment_btr_60_modernization_stockpile_100_tt: "비축분에 §YBTR-60§! 세대 장갑 수송차를 최소 §Y100§!대 보유 (현재: §Y[?num_equipment@medium_tank_amphibious_chassis_0|0]§!)"
 ukraine_modernize_sov_equipment_btr_60_modernization_stockpile_100_tt_legacy: "비축분에 §YBTR-60§! 세대 장갑 수송차를 최소 §Y100§!대 보유 (현재: §Y[?num_equipment@APC_1|0]§!)"
 ukraine_modernize_sov_equipment_btr_60_modernization_mykolayiv_expired_tt: "공장이 제안을 철회합니다. §YKORT§!사의 §YBTR-60MK§!는 더 이상 불가능해집니다."
 ukraine_modernize_sov_equipment_btr_60_modernization_kort_expired_tt: "§YKORT§!사가 제안을 철회합니다."
 ukraine_modernize_sov_equipment_btr_60_modernization_techimpex_expired_tt: "§YNVK 테크임펙스§!가 제안을 철회합니다."
