 raj_chi_border_attack_993_from_428: "Атака на Ладакх из Химачала"
 raj_chi_border_attack_993_from_428_desc: "Продвигайтесь из Химачала, чтобы оспорить или восстановить контроль над Ладакхом. Успешное наступление добавляет §Y20 очков прогресса §! к этому штату; отпор стоит §Y10§!."
