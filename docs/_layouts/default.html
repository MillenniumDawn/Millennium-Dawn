<!DOCTYPE html>
<html lang="en">
{% include head.html %}
<body class="{{ page.title | slugify }}">
    {% include skip-link.html %}
    {% include header.html %}

    <!-- Page layout: flex wrapper for sidebar + main content -->
    <div class="page-layout" id="page-layout">
        {% include toc-sidebar.html %}

        <main class="main-content" id="main-content" tabindex="-1">
            <div class="container">
                {% include breadcrumbs.html %}
                {{ content }}
            </div>
        </main>
    </div>

    {% include footer.html %}

    <!-- Back to top -->
    <button class="back-to-top"
            aria-label="Back to top"
            type="button">
        <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
            <path d="M12 4l-8 8h5v8h6v-8h5z" fill="currentColor"/>
        </svg>
    </button>

    <script>
    // ================================================================
    // Coordinated header behaviour
    // ================================================================

    // Keep --header-height in sync with actual header size
    (function () {
        var root   = document.documentElement;
        var header = document.querySelector('.site-header');
        if (!root || !header) return;

        function update() {
            var h = Math.ceil(header.getBoundingClientRect().height);
            if (h > 0) root.style.setProperty('--header-height', h + 'px');
        }

        update();
        window.addEventListener('load', update);
        window.addEventListener('resize', update);
        header.addEventListener('navstatechange', update);

        if (typeof ResizeObserver !== 'undefined') {
            new ResizeObserver(update).observe(header);
        }
    })();

    // Dark mode toggle
    (function () {
        var html = document.documentElement;
        var btn  = document.querySelector('.dark-mode-button');
        if (!btn) return;

        function updateAria() {
            btn.setAttribute('aria-pressed',
                html.classList.contains('dark-mode') ? 'true' : 'false');
        }
        updateAria();

        btn.addEventListener('click', function () {
            var wasDark = html.classList.contains('dark-mode');
            html.classList.toggle('dark-mode');
            html.classList.remove('light-mode');
            if (wasDark) {
                localStorage.setItem('theme', 'light');
                html.classList.add('light-mode');
            } else {
                localStorage.setItem('theme', 'dark');
            }
            updateAria();
        });
    })();

    // Mobile navigation toggle
    (function () {
        var toggle  = document.querySelector('.nav-toggle');
        var nav     = document.getElementById('main-nav');
        var header  = document.querySelector('.site-header');
        if (!toggle || !nav || !header) return;

        var desktopMQ = window.matchMedia('(min-width: 769px)');

        function openNav() {
            nav.classList.add('is-open');
            header.classList.add('nav-is-open');
            document.body.classList.add('nav-lock');
            toggle.setAttribute('aria-expanded', 'true');
            toggle.setAttribute('aria-label', 'Close navigation menu');
            header.dispatchEvent(new CustomEvent('navstatechange'));
        }

        function closeNav(restoreFocus) {
            nav.classList.remove('is-open');
            header.classList.remove('nav-is-open');
            document.body.classList.remove('nav-lock');
            toggle.setAttribute('aria-expanded', 'false');
            toggle.setAttribute('aria-label', 'Open navigation menu');
            if (restoreFocus) toggle.focus();
            header.dispatchEvent(new CustomEvent('navstatechange'));
        }

        function isOpen() { return nav.classList.contains('is-open'); }

        toggle.addEventListener('click', function () {
            isOpen() ? closeNav(false) : openNav();
        });

        document.addEventListener('keydown', function (e) {
            if (e.key === 'Escape' && isOpen()) closeNav(true);
        });

        document.addEventListener('click', function (e) {
            if (isOpen() && !nav.contains(e.target) && !toggle.contains(e.target)) {
                closeNav(false);
            }
        });

        nav.addEventListener('click', function (e) {
            if (e.target.closest('a') && isOpen()) closeNav(false);
        });

        function onBreakpoint() {
            if (desktopMQ.matches && isOpen()) closeNav(false);
        }
        if (typeof desktopMQ.addEventListener === 'function') {
            desktopMQ.addEventListener('change', onBreakpoint);
        } else if (typeof desktopMQ.addListener === 'function') {
            desktopMQ.addListener(onBreakpoint);
        }
    })();

    // Collapsing header behaviour removed — header is now static (no JS-driven condensing).

    // Back to top button
    (function () {
        var btn = document.querySelector('.back-to-top');
        if (!btn) return;

        function check() {
            btn.classList.toggle('is-visible', window.scrollY > 400);
        }

        window.addEventListener('scroll', check, { passive: true });
        check();

        btn.addEventListener('click', function () {
            window.scrollTo({ top: 0, behavior: 'smooth' });
        });
    })();
    </script>
</body>
</html>
