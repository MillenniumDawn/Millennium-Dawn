 toggle_nuclear_power_plant_generation_two_tt: "Odetnij §Yelektrownie atomowe od produkcji energii§!"
 add_hydroelectric_energy_production_effect_tt: "Dodaje §YHydroelectric Power Production§! na poziomie [?electric_addition|Y] GW dla [THIS.GetName] (Aktualne GW [?hydroelectric_energy_production_var|Y0] )"
 ENABLE_NUCLEAR_PRODUCTION_BUTTON: "URUCHOM"
 DISABLE_NUCLEAR_PRODUCTION_BUTTON: "WYŁĄCZ"
 energy_building_battery_parks: "§Y Budowa §! parku akumulatorów"
 energy_building_battery_parks_desc: "Wybraliśmy ścieżkę powszechnej energii odnawialnej. Czas zacząć budować materiały potrzebne naszemu narodowi do magazynowania energii generowanej przez naszą infrastrukturę odnawialną."
 energy_automatic_fuel_purchase: "Automatyczny §Y zakup paliwa §!"
 energy_automatic_fuel_purchase_desc: "Obecnie kupujemy paliwo po cenie rynkowej co dwadzieścia osiem dni, gdy tylko jego zapasy są na wyczerpaniu."
 has_an_energy_deficit_tt: "[THIS.GetNameWithFlag] ma obecnie §Ydeficyt energii§! (Bieżąca różnica: [?THIS.energy_difference_variable|Y0])\n"
 energy_load_sharing_recipient: "[THIS.GetNameWithFlag] aktualnie odbiera energię §YEnergy§! za pośrednictwem umowy §YEnergy Load Sharing§!.\n"
 is_currently_in_an_energy_load_sharing_agreement_tt: "[THIS.GetNameWithFlag] jest obecnie w §YWspółdzielenie obciążenia energetycznego §! Zgoda z[ROOT.GetNameWithFlag]\n"
 advanced_production_modifier: "Ograniczenia zaawansowanej produkcji"
 advanced_production_modifier_desc: "Gdy zacznie nam brakować metali technologicznych ([?THIS.resource@tungsten|+]), metali szlachetnych ([?THIS.resource@chromium|+]), ropy naftowej ([?THIS.resource@oil|+]) lub gumy ([?THIS.resource@rubber|+]), nasza produkcja mikroprocesorów i/lub kompozytów ulegnie zmniejszeniu. Każdy deficyt któregokolwiek z zasobów spowoduje spadek produkcji mikroprocesorów i/lub kompozytów. Ponadto, biorąc pod uwagę, że produkcja mikroprocesorów wymaga znacznych ilości energii, niedobory mocy dodatkowo zmniejszą produkcję o [?unfulfilled_energy_demand_dynmod_var|%]\n\n§Y Redukcja produkcji będzie zawsze ograniczona do§! §R95%§! §Y bazowych wielkości produkcji.§!"
 civilian_microchip_consumption_modifier: "Cywilne i przemysłowe zużycie mikroczipów"
 civilian_microchip_consumption_modifier_desc: "Nasza populacja i zaawansowane gałęzie przemysłu zaczną konsumować mikroczipy, w miarę jak coraz więcej technologii staje się dostępnych dla firm i przeciętnego człowieka. Będziemy musieli nadążyć za tym popytem, w przeciwnym razie nasze linie produkcyjne będą miały trudności. W czasie wojny produkcja wojskowa będzie traktowana priorytetowo w stosunku do użytku cywilnego, ale może to prowadzić do niepokojów społecznych, ponieważ zapotrzebowanie ludności nie będzie zaspokajane."
 is_currently_importing_oil_tt: "[THIS.GetNameWithFlag] obecnie importuje §YPaliwa kopalne§! z innego kraju.\n"
 early_renewables_9: "Zaawansowane sterowanie turbinami wiatrowymi"
 early_renewables_9_desc: "Czujniki łopat i lidar, które mierzą wiatr przed wirnikiem, pozwalają turbinom dostosować kąt nachylenia i odchylenia przed nadejściem podmuchu. Całe farmy są sterowane jak jeden system, dzięki czemu pierwsze rzędy nie zabierają już wiatru turbinom znajdującym się za nimi."
 renewables_9: "Perowskitowe ogniwa słoneczne"
 renewables_9_desc: "Warstwy perowskitu ułożone na krzemie wychwytują część widma, którą sam krzem marnuje, zwiększając wydajność panelu do ponad 30%. Warstwy są wytwarzane w niskiej temperaturze z tanich materiałów, więc wzrost ten nieznacznie zwiększa koszty produkcji."
 renewables_10: "Elektrownie pływowe"
 renewables_10_desc: "Turbiny zakotwiczone w kanałach pływowych działają dzięki prądom, które rosną i opadają zgodnie z harmonogramem znanym z wieloletnim wyprzedzeniem. Energia pływów zapewnia sieci odnawialne źródło energii, niezależne od warunków atmosferycznych."
 renewables_11: "Ekspansja pływowa"
 renewables_11_desc: "Pływające platformy i gęstsze zespoły turbin przenoszą energię pływową poza kilka wąskich kanałów, na otwarte wody przybrzeżne. Wspólne kable podmorskie i standardowe moduły sprawiają, że każdy nowy zespół jest tańszy od poprzedniego."
 renewables_12: "Elektrownie wulkaniczne"
 renewables_12_desc: "Studnie wiercone w pobliżu aktywnych wulkanów pobierają wodę podgrzaną magmą do znacznie wyższych temperatur niż konwencjonalne pola geotermalne. Jeden taki odwiert może dostarczyć kilkakrotnie większą moc niż zwykły odwiert geotermalny."
 renewables_13: "Sifonowanie astenosfery"
 renewables_13_desc: "Głębokie odwierty wzdłuż aktywnych stref uskokowych docierają do gorącej, częściowo stopionej skały astenosfery. Ciepło pobierane z tej głębokości nigdy się nie wyczerpuje i jest dostępne wszędzie tam, gdzie skorupa ziemska jest wystarczająco cienka, aby ją przewiercić."
 fuel_efficiency_7: "Optymalizacja paliwa kwantowego"
 fuel_efficiency_7_desc: "Komputery kwantowe symulują procesy spalania cząsteczka po cząsteczce, co maszyny klasyczne potrafią jedynie przybliżać. Inżynierowie wykorzystują te wyniki do projektowania paliw, katalizatorów i palników, które uwalniają więcej energii z każdej jednostki paliwa."
 fuel_efficiency_8: "Implementacja AGI"
 fuel_efficiency_8_desc: "Uniwersalna sztuczna inteligencja zarządza naszymi elektrowniami jako jedną, ogólnokrajową flotą, od zakupu paliwa i ekip konserwacyjnych po zarządzanie siecią. Obciążenie zawsze jest przenoszone na elektrownię, która w danym momencie spala paliwo najefektywniej."
 fuel_efficiency_9: "Specjalistyczne nanowłókna paliwowe"
 fuel_efficiency_9_desc: "Izolacja z nanowłókien otacza kotły, rury i obudowy turbin, utrzymując ciepło w obiegu, gdzie nadal może ono wytwarzać parę. Mniej energii ucieka przez ściany elektrowni, dzięki czemu więcej paliwa dociera do generatora."
 fuel_efficiency_10: "Superinteligentne monitorowanie"
 fuel_efficiency_10_desc: "Superinteligentny system modeluje każdą instalację aż do poszczególnych płomieni i łopatek turbin, korygując usterki, zanim jeszcze powstaną. Nasze wytwarzanie paliw kopalnych osiąga praktyczną termodynamiczną granicę tego, co może dostarczyć spalanie paliwa."
 energy_efficiency_9: "Efektywność energetyczna kwantowa"
 energy_efficiency_9_desc: "Możemy wykorzystać technologię kwantową do poprawy efektywności energetycznej naszego sprzętu."
 energy_efficiency_10: "Zaawansowana wydajność kwantowa"
 energy_efficiency_10_desc: "Zastosowanie najnowszych osiągnięć technologii kwantowej dodatkowo zwiększa wydajność."
 energy_efficiency_11: "Odzyskiwanie energii kwantowej"
 energy_efficiency_11_desc: "Postępy w naszym rozumieniu fizyki kwantowej pozwalają na odzyskiwanie energii na poziomie atomowym."
 energy_efficiency_12: "Sifonowanie kwantowe"
 energy_efficiency_12_desc: "Możliwe jest wyodrębnienie zmian w pianie kwantowej i przekształcenie ich w energię elektryczną. Udało nam się zamienić straty energii w jej zysk!"
 CUR_UNEMPLOY_TT: "Bezrobocie"
 DISP_UNEMPLOY_NUM_TT: "Wyświetla całkowitą liczbę ludzi §R Bezrobotnych i żyjących na skraju ubóstwa §! w kraju."
 DISP_UNEMPLOY_NUM: "§R [?ROOT.total_unemployed|3] §! §Y mil §!"
 ENERGY_POLICY_AUTOMATION_SHORT: "Auto"
 ENERGY_POLICY_AUTOMATION_TT: "§Y Zasada automatycznego zużycia §!\nAutomatycznie dostosowuje politykę zużycia o jeden poziom podczas cotygodniowej aktualizacji energii. Zaostrza ograniczenia, gdy poziom zrównoważonej realizacji netto spada poniżej §R 95%§!, oraz łagodzi ograniczenia lub zwiększa zużycie, gdy poziom ten przekracza §G110%§!. Dodatkowy pobór energii wymaga, aby poziom naładowania magazynu energii wynosił co najmniej §Y95%§! (chyba że magazyn nie jest dostępny). Uwzględnia się import energii oraz zakontraktowany eksport, natomiast pomija się pobór energii z magazynu. Ręczny wybór strategii powoduje wyłączenie automatyzacji."
