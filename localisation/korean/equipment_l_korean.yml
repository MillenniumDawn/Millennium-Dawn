 BLR_Heavy_Anti_tank_3: "9P157 흐리잔테마-S"
 BLR_Heavy_Anti_tank_3_desc: "AT-15 스프링어(흐리잔테마-S) 자주 대전차 미사일 체계입니다. 현대적인 동적 방호 수단을 갖춘 것을 포함한 전차와 기타 장갑 표적을 파괴하도록 설계되었습니다. 9P157 전투 차량은 BMP-3 보병전투차를 기반으로 제작되었습니다."
 BLR_artillery_4_desc: "코알리치야-SV 자주포 마운트에 장착된 152mm 포를 기반으로 한 견인식 곡사 캐논포입니다."
