 total_refineries_amount_tt: "这个数值代表了我们国家的§Y合成精炼厂§!的总数。"
 total_refineries_amount_tt_delayed: "§Y合成精炼厂§!是指负责生产合成橡胶及相关化学材料的工业设施，这些材料对工业和物流至关重要。\n\n为所属地区提供：\n所需工人基础数量：§Y184K§!\n每个§Y合成精炼厂§!的基本GDP产出：$§Y10B§!\n基础能源消耗：§R-0.2§! GW\n\n人均GDP对§Y劳动力§!的影响：[?worker_requirement_gdp_multiplier_display|-%1]\n法律，国家精神和科技对§Y所有建筑所需劳动力§!的影响：[?modifier@buildings_worker_requirement_modifier|-%0]\n法律，国家精神和科技对§Y合成精炼厂劳动力§!的影响：[?modifier@synthetic_refinery_worker_requirement_modifier|-%0]\n综合削减上限为§Y90%§!\n\n§Y合成精炼厂§!所需劳动力：[?workers_per_synthetic_refinery_display|2]K\n"
 increases_population_tax_tooltip: "此按钮将提高我国的§Y人口税税率§!。\n公众预期税率最高为§Y[?expected_population_tax_rate|0]%§!。将税率提高到既超过这一水平、又超过我们近期削减前任何更高税率的程度，会在一段时间内每百分点造成§R2%§!§Y稳定度§!损失（参见§Y政策过渡成本§!）。\n\n§Y前提条件：§!\n[tax_button_req]\n\n[allowed_to_adjust_personal_tax_laws]"
 increases_population_tax_delayed_tooltip: "£click_left §Y左键点击§!以增加1%的§Y人口税率§!\n£key_shift + £click_left §YShift+左键点击§!以增加5%的§Y人口税率§! (£pol_power_icon [?tax_rate_change_5])\n"
 decreases_population_tax_tooltip: "此按钮将降低我国的§Y人口税税率§!。\n将税率降低到既低于预期的§Y[?expected_population_tax_rate|0]%§!、又低于我们近期提高前任何更低税率的程度，会在一段时间内每百分点带来§G0.5%§!§Y稳定度§!加成；若再次提高税率，则会收回这一加成（参见§Y政策过渡成本§!）。\n\n§Y前提条件：§!\n[tax_button_req]\n\n[allowed_to_adjust_personal_tax_laws]"
 decreases_population_tax_delayed_tooltip: "£click_left §Y点击§!以降低1%的§Y人口税率§!\n£key_shift + £click_left §YShift+左键点击§!以降低5%的§Y人口税率§! (£pol_power_icon [?tax_rate_change_5]）\n"
 increases_corporate_tax_tooltip: "此按钮将提高我国的§Y企业税税率§!。\n企业预期税率最高为§Y[?expected_corporate_tax_rate|0]%§!，具体取决于我们的财富水平和经济周期。将税率提高到既超过这一水平、又超过我们近期削减前任何更高税率的程度，会在一段时间内每百分点造成§R1.2%§! §Y稳定度§!损失（参见§Y政策过渡成本§!）。\n\n§Y前提条件：§!\n[tax_button_req]\n\n[allowed_to_adjust_corporate_tax_laws]"
 increases_corporate_tax_delayed_tooltip: "£click_left §Y左键点击§!以增加1%§Y企业税率§!\n£key_shift + £click_left §YShift+左键点击§!以增加5%§Y企业税率§!(£pol_power_icon [?tax_rate_change_5])\n"
 decreases_corporate_tax_tooltip: "此按钮将降低我国的§Y企业税税率§!。\n将税率降低到既低于预期的§Y[?expected_corporate_tax_rate|0]%§!、又低于我们近期提高前任何更低税率的程度，会在一段时间内每百分点给予§G0.01§!§Y月度生产力增长§!，并使我们国家的§Y外国投资§!成本在一段时间内每百分点下降§G2%§!；若再次提高税率，则会收回这一加成（参见§Y政策过渡成本§!）。\n\n§Y前提条件：§!\n[tax_button_req]\n\n[allowed_to_adjust_corporate_tax_laws]"
 decreases_corporate_tax_delayed_tooltip: "£click_left §Y左键点击§!以减少1%§Y企业税率§!\n£key_shift + £click_left §YShift+左键点击§!以减少5%§Y企业税率§!(£pol_power_icon [?tax_rate_change_5])\n"
 increases_cb_rate_tooltip: "将§Y政策利率§!提高1个百分点，收紧货币政策环境。\n\n§Y效果：§!\n季度通胀率每季度最多可额外抑制§G0.2%§!。\n当利率上调至0%以上时，通胀结转影响下调§G2.5个百分点§!；若预算赤字超额，则下调幅度可低至§G1.25个百分点§!。利率维持在0%或以下时，通胀结转影响不变。\n在最低利率下限和最高利率上限生效前，政策利率对主权债务利息的贡献增加了§R0.33个百分点§!。\n月度§Y货币实力§!压力上涨§G0.001§!，或上涨§G0.00025§!，而通货膨胀率远高于该利率（一旦利率高于通货膨胀率6个百分点，则不再改变。）\n\n§Y先决条件：§!\n£pol_power_icon §Y25§!政治点数\n政策利率低于30%\n过去30天内利率未发生变化"
 decreases_cb_rate_tooltip: "将§Y政策利率§!降低1个百分点，放宽货币政策环境。\n\n§Y效果：§!\n季度通胀抑制幅度每季度最多降低§R0.2%§!。\n当通胀率降至正值时，通胀结转削减幅度减少§R2.5个百分点§!；若预算赤字超额，则减少幅度可能低至§R1.25个百分点§!。通胀率在0%或以下时，结转削减幅度不变。\n在适用最低利率下限和最高利率上限之前，政策利率对主权债务利息的贡献减少了§G0.33个百分点§!。\n月度§Y货币实力§!压力下调§R0.001§!，或下降§R0.00025§!，而通货膨胀率远高于该利率（一旦利率高于通货膨胀率6个百分点，则不再改变。）\n\n§Y先决条件：§!\n£pol_power_icon §Y25§!政治点数\n政策利率高于0%\n过去30天内利率未发生变化"
