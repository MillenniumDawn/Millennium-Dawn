l_english:
 TOP_authorization.1.t: "Target Nomination: Intelligence Review"
 TOP_authorization.1.d: "Subject: §Y[TOP_proposal_name]§!\nMethod: [TOP_proposal_method_name]\nFrozen intelligence: identity/verification [?TOP_proposal_identity|0], location [?TOP_proposal_location|0], pattern/activity [?TOP_proposal_pattern|0]\nLead age: [?TOP_proposal_lead_age|0] days\nReview standard: [TOP_proposal_rigor_name]\nCapture assessment: [TOP_proposal_capture_name]\n\nThe review binds this subject, method, objective, believed state, host, access route, posture, doctrine, and sequence. Standard packages need 60 on each intelligence axis, while political leaders need 80; capture feasibility informs consequences but does not veto a lethal proposal."
 TOP_authorization.1.a: "Submit the reviewed case."
 TOP_authorization.1.b: "Return the dossier for further collection."
 TOP_authorization.1.c: "Withdraw or close this nomination."
 TOP_authorization.2.t: "Target Nomination: Host-State Consultation"
 TOP_authorization.2.d: "The frozen case concerning [TOP_proposal_name] has passed staff review. Ministers must settle the host posture for action in [?TOP_proposal_state.GetName]: intelligence-only, tolerated, cooperative, refused, or unconsulted. Cooperation can reduce exposure and is mandatory for partner action; intelligence-only support returns the package with reporting and no mandate, while refusal raises defensive pressure without public attribution."
 TOP_authorization.2.a: "Request consent for this operation."
 TOP_authorization.2.b: "Submit a unilateral proposal."
 TOP_authorization.2.c: "Submit the domestic case for senior approval."
 TOP_authorization.2.e: "Defer or close this proposal."
 TOP_authorization.3.t: "Request for a Targeted Operation"
 TOP_authorization.3.d: "[?TOP_incoming_actor.GetName] requests our posture on [TOP_incoming_method_name] against §Y[TOP_incoming_subject_name]§! in [?TOP_incoming_state.GetName]. Our answer binds only the recorded subject, facility objective, location, sequence, and method; cooperation enables partner action, while intelligence-only support returns the case without consuming a mandate. Refusal raises defensive pressure without itself creating public attribution."
 TOP_authorization.3.a: "Consent to the specific proposal."
 TOP_authorization.3.b: "Decline or close this request."
 TOP_authorization.3.c: "Tolerate the operation without direct support."
 TOP_authorization.3.f: "Share intelligence, but authorize no operation."
 TOP_authorization.3.g: "Discard this stale request."
 TOP_authorization.4.t: "Target Nomination: Senior Authorization"
 TOP_authorization.4.d: "Subject: §Y[TOP_proposal_name]§!\nMethod: [TOP_proposal_method_name]\nFrozen intelligence: [?TOP_proposal_identity|0] / [?TOP_proposal_location|0] / [?TOP_proposal_pattern|0]\nState: [?TOP_proposal_state.GetName] | Host: [?TOP_proposal_host.GetName]\nHost posture: [TOP_proposal_host_posture_name] | Access: [TOP_proposal_access_name]\nDoctrine: [TOP_proposal_doctrine_name]\nAttribution risk: [TOP_proposal_attribution_band] | Civilian-harm risk: [TOP_proposal_harm_band]\n\nApproval creates a waiting mandate. It does not reserve the single operation slot. Begin Preparation or Begin Operation will revalidate the frozen case, access, authority, capability, and lifecycle."
 TOP_authorization.4.a: "Approve the reviewed mandate."
 TOP_authorization.4.b: "Approve and accept responsibility for unilateral action."
 TOP_authorization.4.c: "Withhold approval or close this case."
 TOP_review_pending: "An authorization review or its unresolved notification is pending."
 TOP_enhanced_review_government: "Our government applies enhanced scrutiny."
 TOP_review_lethal: "The proposal seeks a lethal outcome."
 TOP_review_valid: "The original target, method, location, political authority, intelligence, capabilities, and funding remain valid."
 TOP_review_staff_ready: "Staff review is satisfied. Standard packages require 60 on all three intelligence axes. Political-leader packages require 80 on all three. Capture feasibility is disclosed but does not veto a lethal method."
 TOP_review_can_approve: "The senior review is complete and the proposal remains valid. Partner operations require consent."
 TOP_visit_window_too_short_tt: "The operation cannot finish within the target's remaining state-visit window."
 TOP_host_request_matches: "This request still matches the sender's active nomination."
 TOP_staff_review_tt: "The case advances to consultation and senior review. This does not authorize an operation."
 TOP_return_collection_tt: "Continue collecting intelligence on the original person and close this nomination. Submit a fresh proposal when the case is ready."
 TOP_host_consent_tt: "Consent applies only to the recorded person, method, and location. The requesting government must still approve the operation."
 TOP_host_refusal_tt: "A partner operation cannot proceed. Other methods require a separate senior decision accepting unilateral responsibility."
 TOP_host_tolerated_tt: "Permit the recorded operation without supplying direct support. Toleration is frozen into this proposal and grants no standing access."
 TOP_host_intelligence_only_tt: "Share a one-time location report without authorizing action. The proposal closes, its package returns to development, and no operational mandate is consumed."
 TOP_unilateral_review_tt: "Record that host-state consent has not been obtained. Execution can cause diplomatic and domestic consequences."
 TOP_domestic_review_tt: "The case proceeds under our own jurisdiction, subject to the same intelligence and senior review requirements."
 TOP_mandate_approved_tt: "Approve a doctrine-length mandate for the frozen subject, method, objective, state, host, access route, posture, and sequence. Preparation remains a separate action and uses the single operation slot."

 TOP_authorization.5.t: "Assassination"
 TOP_authorization.5.d: "§RAssassination§! of §Y[TOP_proposal_name]§!\nOffice: [TOP_proposal_role_name]\nSelected method: [TOP_proposal_method_name]\nFrozen intelligence: identity [?TOP_proposal_identity|0], location [?TOP_proposal_location|0], pattern of life [?TOP_proposal_pattern|0]\nState: [?TOP_proposal_state.GetName] | Host: [?TOP_proposal_host.GetName]\nAccess route: [TOP_proposal_access_name] | Host posture: [TOP_proposal_host_posture_name]\nSuccession: §YThe authored successor will take office when physical truth changes.§!\nCapture assessment: [TOP_assassination_capture_warning]\nAttribution risk: [TOP_proposal_attribution_band]\nCivilian-harm risk: [TOP_proposal_harm_band]\nStrategic-escalation risk: [TOP_proposal_escalation_band]\n\nThis is a genuine lethal authorization against a serving foreign civilian political leader. Full Sandbox does not bypass intelligence, access, review, preparation, battle-damage assessment, attribution, succession, or strategic consequences."
 TOP_authorization.5.a: "Authorize Assassination"
 TOP_authorization.5.b: "Withhold assassination authority."
 TOP_assassination_confirmation_tt: "Approve the assassination mandate for this exact leader, method, state, host, posture, doctrine, and immutable intelligence snapshot."

