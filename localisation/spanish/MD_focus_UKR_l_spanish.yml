 ukraine_armed_forces_tragedy_event.1.name: "Brovary Missile Tragedy"
 ukraine_armed_forces_tragedy_event.1.desc: "The Brovary disaster of April 20, 2000 was an accident that occurred in the city of Brovary, Kyiv Oblast, when a surface-to-surface training missile of the 'Tochka-U' complex, launched during military exercises from the Goncharivka training ground, deviated from its intended course and, after flying 90 km, hit a nine-story residential building.\nThe missile did not have an explosive warhead, and three people were killed and five more were injured as a result of the missile strike.\n\nFor four days after the disaster, until April 23, the Ministry of Defense of Ukraine, headed by Oleksandr Kuzmuk, refused to admit that it was their missile that hit the residential building."
 ukraine_armed_forces_tragedy_event.1.a: "That was not our missile"
 ukraine_armed_forces_tragedy_event.2.name: "Siberia Airlines Flight 1812 Shot Down"
 ukraine_armed_forces_tragedy_event.2.desc: "Siberia Airlines Flight 1812 was a commercial flight that was presumably shot down by the Ukrainian Air Force over the Black Sea on 4 October 2001, en route from Tel Aviv, Israel, to Novosibirsk, Russia.\nThe aircraft, a Soviet-made Tupolev Tu-154, carried 66 passengers and 12 crew members. Most of the passengers were Israelis visiting relatives in Russia. There were no survivors.\nThe crash was caused by a missile launched during joint Ukrainian-Russian military air-defence exercises at the Russian-controlled training ground of the 31st Russian Black Sea Fleet Research center on Cape Opuk near the city of Kerch in Crimea."
 ukraine_armed_forces_tragedy_event.2.a: "We need an investigation"
 ukraine_armed_forces_tragedy_event.3.name: "Sknyliv Air Show Disaster"
 ukraine_armed_forces_tragedy_event.3.desc: "The Sknyliv Air show disaster occurred on 27 July 2002, when a Ukrainian Air Force Sukhoi Su-27UB aircraft, piloted by Volodymyr Toponar (of the 'Ukrainian Falcons' aerobatic demonstration team) and co-piloted by Yuriy Yegorov, crashed into spectators during an aerobatics presentation at Sknyliv airfield near Lviv, Ukraine.\nThe accident killed 77 people and injured 543. It is the deadliest air show accident in history.\nFollowing the disaster, the pilots stated that the flight map which they had received differed from the actual layout."
 ukraine_armed_forces_tragedy_event.3.a: "Unbelievable tragedy"
 UKR_Brovary_Missile_Tragedy_Flag: "Brovary missile tragedy has happened"
 UKR_Tu154_Air_Tragedy_Flag: "Siberia Airlines Flight 1812 was shot down"
 ukraine_warehouse_explosions.1.name: "Poor Conditions of Ammunition Depots"
 ukraine_warehouse_explosions.1.desc: "The recent reforms of the Armed Forces have revealed severe deficiencies in the storage and security of ammunition depots across Ukraine. Outdated facilities and lax oversight pose a significant risk of accidents. The government must decide how to address this issue."
 ukraine_warehouse_explosions.1.a: "Full Maintenance of all Depots"
 ukraine_warehouse_explosions.1.b: "Partial Maintenance of Main Depots"
 ukraine_warehouse_explosions.1.c: "Ignore the Issue"
 ukraine_warehouse_explosions.2.name: "Explosion at Artemivsk Ammunition Depot"
 ukraine_warehouse_explosions.2.desc: "The unexpected and widespread incident happened recently in the city of Artemivsk, Artemivsk district, Donetsk region. Fire has started at the warehouses of the 52nd Mechanized Brigade, where about three thousand tons of artillery ammunition were stored. Unfortunately, massive explosions come after initial fire. We need to take actions in order to clean the place and stop such incidients in the future."
 ukraine_warehouse_explosions.2.a: "Full Reconstruction of Depot"
 ukraine_warehouse_explosions.2.b: "Send Commission to Investigate"
 ukraine_warehouse_explosions.2.c: "Ignore the Issue"
 ukraine_warehouse_explosions.3.name: "Explosion at Novobohdanivka Ammunition Depot"
 ukraine_warehouse_explosions.3.desc: "The unexpected and widespread incident happened recently near the village of Novobohdanivka, Melitopol district, Zaporizhzhia region. On May 6, 2004, almost 90 thousand ammunition for the Grad, Smerch and Uragan systems exploded. The fragments of the shells flew 40 km from the epicenter of the fiery emergency. Then more than one and a half thousand people had to be evacuated. Five people died, more than 80 were hospitalized with various injuries, more than 20 families were left without homes. The explosion damaged 4 km of the gas pipeline. The damage amounted to 3 billion 752 million UAH."
 ukraine_warehouse_explosions.3.a: "Full Reconstruction of Depot"
 ukraine_warehouse_explosions.3.b: "Send Commission to Investigate"
 ukraine_warehouse_explosions.3.c: "Ignore the Issue"
 ukraine_warehouse_explosions.4.name: "Explosion at Tsvitokha Ammunition Depot"
 ukraine_warehouse_explosions.4.desc: "The unexpected and widespread incident happened recently near the village of Tsvitokha, Slavuta district, Khmelnytskyi region. Fire with ammunition explosions in Khmelnytskyi region at Arsenal No. 47. The storage facility contained 52.9 conventional wagons of ammunition (small-caliber shells - 23 and 30 mm, grenades for underbarrel grenade launchers), which detonated as a result of the fire. Fragments flew in a radius of 100-150 m."
 ukraine_warehouse_explosions.4.a: "Full Reconstruction of Depot"
 ukraine_warehouse_explosions.4.b: "Send Commission to Investigate"
 ukraine_warehouse_explosions.4.c: "Ignore the Issue"
 ukraine_warehouse_explosions.5.name: "Second Explosion at Novobohdanivka Ammunition Depot"
 ukraine_warehouse_explosions.5.desc: "The explosions incident happened for the second time near the village of Novobohdanivka, Melitopol district, Zaporizhzhia region. On July 23, 2005, at 5:20 p.m., a warehouse at the 257th ammunition storage base caught fire. At 8:54 p.m., the detonation of shells stopped. Five people were injured. The cause of the explosions was said to be high air temperature, which allegedly caused the spontaneous combustion of a smoke mine."
 ukraine_warehouse_explosions.5.a: "Full Reconstruction of Depot"
 ukraine_warehouse_explosions.5.b: "Send Commission to Investigate"
 ukraine_warehouse_explosions.5.c: "Ignore the Issue"
 ukraine_warehouse_explosions.6.name: "Third Explosion at Novobohdanivka Ammunition Depot"
 ukraine_warehouse_explosions.6.desc: "The explosions incident happened for the third time near the village of Novobohdanivka, Melitopol district, Zaporizhzhia region. On August 19, 2006 at 2:15 p.m., another serious explosion occurred. About three hectares of the warehouse burned. 1,500 local residents were evacuated, 4,000 people were placed in shelters. 428 people and 96 pieces of equipment were involved. 4 people were injured."
 ukraine_warehouse_explosions.6.a: "Full Reconstruction of Depot"
 ukraine_warehouse_explosions.6.b: "Send Commission to Investigate"
 ukraine_warehouse_explosions.6.c: "Ignore the Issue"
 ukraine_warehouse_explosions.7.name: "Explosion at Lozova Ammunition Depot"
 ukraine_warehouse_explosions.7.desc: "The unexpected and widespread incident happened recently in the city of Lozova, Lozova district, Kharkiv region. On August 27, 2008, at 16:20, the warehouse of the 61st arsenal of the Southern Operational Command of the Ground Forces caught fire. The arsenal of military unit No. 0829, with an area of ​​about 500 hectares, stored 95 thousand tons of shells. The explosions began about two hours later. All residents within a radius of 3 km from the warehouses were evacuated."
 ukraine_warehouse_explosions.7.a: "Full Reconstruction of Depot"
 ukraine_warehouse_explosions.7.b: "Send Commission to Investigate"
 ukraine_warehouse_explosions.7.c: "Ignore the Issue"
