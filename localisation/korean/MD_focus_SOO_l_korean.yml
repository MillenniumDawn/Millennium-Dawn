 SOO_help_ossetia_SOV: "§Y[SOO.GetNameWithFlag]§!에 대한 투자"
 SOO_help_ossetia_SOV_desc: "남오세티야는 스스로 예산을 감당할 수 없으므로 우리가 재정적으로 지원할 것입니다. 추가 수입: $§R-0.120§!"
 SOO_help_ossetia: "§Y[SOV.GetNameWithFlag]§!의 투자"
 SOO_help_ossetia_desc: "러시아가 우리에게 재정을 제공하며, 이 덕분에 우리 경제는 버틸 수 있습니다. 추가 수입: $§G0.120§!"
 SOO_develop_turism: "관광 개발"
 SOO_develop_turism_desc: "국내 관광을 개발할 것이며, 이는 국고에 추가 수입을 가져다줄 것입니다. 추가 수입: $§G0.100§!"
 SOO_Mamison_path: "마미손 고개"
 SOO_Mamison_path_desc: ""
 SOO_hydroelectric_dams: "소수력 발전 시스템"
 SOO_Tskhinvali_district: "츠힌발리 지구"
 SOO_GAS_Electrical_lines: "가스 및 전력선"
 SOO_Java_townlet: "자바 소읍"
 SOO_subsidise_the_Farmers: "농민 보조금"
 SOO_subsidise_the_Farmers_desc: "우리나라는 매우 가난하므로 예산 수입을 창출할 모든 기회를 활용해야 합니다. 농민들을 장려하려고 노력할 것입니다."
 SOO_Roki_Tunnel_tollage: "로키 터널 보수"
 SOO_Roki_Tunnel_tollage_desc: "이 터널은 러시아와 우리를 잇는 유일한 연결로이므로 보수해야 합니다."
 SOO_Tskhinvali_gas_and_electricity_network: "츠힌발리 에너지 공급"
 SOO_Tskhinvali_gas_and_electricity_network_desc: "츠힌발리에 필요한 모든 에너지를 공급할 것입니다."
 SOO_Move_towards_cash_crop_growth: "러시아와의 무역량 증대"
 SOO_Move_towards_cash_crop_growth_desc: "우리는 러시아에 대한 농산물 공급을 늘릴 준비가 되어 있습니다."
 SOO_Rural_Revitalization: "기반시설 복구 투자"
 SOO_Rural_Revitalization_desc: "수년간 방치되어 황폐해진 도로를 복구해야 합니다."
 SOO_konserv_zavod: "통조림 공장 개설"
 SOO_konserv_zavod_desc: "우리나라에 통조림 공장을 개설하여 사람들에게 일자리를 제공하고 건전한 수익을 창출할 것입니다."
 SOO_Redevelop_the_Mamison_Pass: "마미손 고개 재개발"
 SOO_Redevelop_the_Mamison_Pass_desc: "마미손 고개는 오세티야와 러시아 국경에 있는 험준한 산악 고개입니다. 1854년부터 1889년 사이에 러시아 제국이 건설한 오세티야 군용 도로가 이곳을 가로지르지만, 오늘날에는 트랜스카프카스 고속도로에 크게 밀려 빛을 잃었습니다."
 SOO_The_Ergneti_market: "에르그네티 시장"
 SOO_The_Ergneti_market_desc: "에르그네티는 국경의 조지아 쪽에 위치한 츠힌발리 외곽의 마을입니다. 조지아 현지 주민들이 값싼 러시아 상품을 사던 장소에서 시작하여 농산물에서 공산품에 이르기까지 온갖 물품이 거래되는 포괄적인 암시장으로 확장되었습니다. 에르그네티 시장은 수천 명의 오세티야인과 조지아인 모두에게 가장 믿을 만하고 지속 가능한 수입원이 되었습니다."
 SOO_Sponsor_the_Georgian_grey_market: "조지아 회색 시장 후원"
 SOO_Sponsor_the_Georgian_grey_market_desc: "조지아의 회색 시장은 이 지역으로 쏟아져 들어오는 러시아 상품의 홍수에서 성장했으며, 대부분은 트랜스카프카스 고속도로를 따라 내려와 오세티야 국경을 넘습니다. 회색 시장을 후원하면 우리처럼 어려운 국가에 미개척 수입원이 될 수 있습니다."
 SOO_fostering_economic_ties: "경제적 유대 육성"
 SOO_fostering_economic_ties_desc: "에르그네티는 남오세티야와 조지아 사이의 평화로 나아가는 디딤돌 역할을 해 왔습니다. 안정적인 성장의 길을 유지하려면 이 기회를 활용해 조지아와 더 긴밀한 유대를 맺어야 합니다."
 SOO_tourism: "남오세티야 관광"
 SOO_tourism_desc: "우리나라에는 아름다운 풍경과 경관이 있습니다. 관광객이 이 아름다움에 접근할 수 있도록 필요한 기반시설을 개발할 때입니다."
 SOO_A_Shifting_market: "변화하는 시장"
 SOO_A_Shifting_market_desc: "조지아 정부가 시장을 폐쇄했습니다. 우리는 국가의 미래를 계획하고 이 문제에 대처해야 합니다. 많은 이들이 일자리를 잃은 지금, 우리는 러시아의 지원을 더욱 늘리고 밀수와 기타 불법 무역원에 더 큰 비중을 두는 방향으로 적응할 수밖에 없습니다."
 SOO_Host_transit_tax: "통과세 부과"
 SOO_Host_transit_tax_desc: "에르그네티 시장은 여전히 암시장으로 운영되고 있습니다. 미개척 수입을 확보하기 위해 국경의 오세티야 쪽에 통과세를 신설할 수 있습니다. 많은 이들에게는 달갑지 않은 부담일 수 있지만, 수입이 국경 너머 이웃 나라로 흘러가지 않고 우리 국가 안에 남게 됩니다."
 SOO_Promote_contraband: "밀수 장려"
 SOO_Promote_contraband_desc: "최근 조지아 정부가 시장을 폐쇄함에 따라 우리는 다른 방법으로 수입을 마련해야 합니다. 국경 양쪽의 많은 주민들이 조지아의 시장 폐쇄에 분노하고 있습니다. 이제 우리는 밀수품 거래에 나설 수밖에 없습니다."
 SOO_regulate_the_market: "시장 규제"
 SOO_regulate_the_market_desc: "불법 행위를 뿌리 뽑으려면 시장 규제가 필요합니다. 이렇게 하면 변화나 긴장 고조의 시기에도 조지아 측이 시장을 계속 열어 두는 것이 더 매력적으로 느껴질 것입니다."
 SOO_Districted_Oversight: "지구 감독"
 SOO_Districted_Oversight_desc: "새로 확보한 행정 체계에 따라 조지아 영토의 통치 기관은 주민들을 오세티야 국가의 관습과 법에 통합시키는 과정을 시작해야 합니다."
 SOO_Resilient_Commerce: "탄력적 상업"
 SOO_Resilient_Commerce_desc: "경제적 잠재력을 확대하기 위해 이전보다 더 활발하게 무역을 하겠습니다."
 SOO_Raise_Import_Tariffs: "수입 관세 인상"
 SOO_Raise_Import_Tariffs_desc: "국고 수입을 개선하기 위해 수입 관세를 인상하겠습니다."
 SOO_the_Russian_bankroll: "러시아 은행 허용"
 SOO_the_Russian_bankroll_desc: "경제를 뒷받침하기 위해 러시아 은행이 우리 시장에 진입하도록 허용해야 합니다."
 SOO_new_developments_in_Kvaisa: "오세티야의 에너지"
 SOO_new_developments_in_Kvaisa_desc: "에너지 안보를 확보하기 위해 발전소 건설에 착수하겠습니다."
 SOO_Boost_the_local_flour_production: "밀가루 생산 투자"
 SOO_Boost_the_local_flour_production_desc: "우리 국가는 지역 밀가루 생산을 시작으로 모든 농업 부문에 투자해야 합니다."
 SOO_Tractor_Imports: "트랙터 수입"
 SOO_Tractor_Imports_desc: "농업 부문의 필요를 충족하기 위해 트랙터를 수입하겠습니다."
 SOO_Forestry_Development: "임업"
 SOO_Forestry_Development_desc: "임업을 다시 한번 발전시키기 위해 노력하겠습니다."
 SOO_increase_tolls_on_Roki_Tunnel: "로키 터널 통행료 인상"
 SOO_increase_tolls_on_Roki_Tunnel_desc: "로키 터널에서 부과하는 통행료를 인상하겠습니다."
 SOO_South_Ossetian_State_University: "남오세티야 국립 대학교"
 SOO_South_Ossetian_State_University_desc: "우리 공화국에는 최고의 인재가 필요합니다. 고등 교육에 대한 투자는 우리의 미래를 보장할 것입니다."
 SOO_Dzuarikau_Tskhinvali_pipeline: "보수된 가스관"
 SOO_Dzuarikau_Tskhinvali_pipeline_desc: "이 가스관은 우리의 에너지 공급에 필수적입니다."
 SOO_Develop_Tskhinvali: "츠힌발리 기반시설"
 SOO_Develop_Tskhinvali_desc: "츠힌발리의 지역 도로는 보수가 시급한 상태입니다."
 SOO_Develop_Java: "자바 복구"
 SOO_Develop_Java_desc: "이 정착지 역시 재정 투자가 필요합니다."
 SOO_Revive_soviet_era_works: "소련의 유산 부활"
 SOO_Revive_soviet_era_works_desc: "세월이 흐르며 잃어버리고 파괴된 것, 곧 소련의 유산을 복원할 때입니다."
 SOO_Develop_Gori: "고리 개발"
 SOO_Develop_Gori_desc: "우리 공화국의 새 영토 역시 개발되어야 합니다."
 SOO_private_sector: "민간 부문"
 SOO_private_sector_desc: "공화국 전역에서 민간 부문의 발전을 장려하겠습니다."
 SOO_Geared_for_hardship: "발전의 난관"
 SOO_Geared_for_hardship_desc: "경제, 특히 농업을 발전시키고 되살리기까지는 갈 길이 멉니다."
 SOO_Gori_Tskhinvali_rail_link: "고리 - 츠힌발리 교통로"
 SOO_Gori_Tskhinvali_rail_link_desc: "새 영토를 공화국의 나머지 지역과 연결하겠습니다."
 SOO_Ministry_of_internal_affairs: "내무부"
 SOO_Ministry_of_internal_affairs_desc: "우리 공화국은 평안히 잠들 수 있어야 합니다."
 SOO_Reinforce_Parliamentary_administration: "의회 지도부 교체"
 SOO_Reinforce_Parliamentary_administration_desc: "정치에 새로운 인물이 필요한 때입니다."
 SOO_Dismantle_Parliamentary_Dominance: "의회 우위 폐지"
 SOO_Dismantle_Parliamentary_Dominance_desc: "의회가 나라를 홀로 지배해서는 안 됩니다."
 SOO_Downplay_opposition_forces: "야당 억제"
 SOO_Downplay_opposition_forces_desc: "현재 존재하는 형태의 야당은 우리 공화국과 그 안정을 위협합니다."
 SOO_banner_of_the_people: "인민의 깃발"
 SOO_banner_of_the_people_desc: "오세티야의 진정한 아들들이 조국을 지킬 준비가 되어 있습니다."
 SOO_Political_independent: "정치적 독립"
 SOO_Political_independent_desc: "우리의 정치는 어느 한 개인이나 집단의 영향을 덜 받게 될 것입니다."
 SOO_Defenders_of_the_Fatherland: "조국의 수호자들"
 SOO_Defenders_of_the_Fatherland_desc: "우리의 전사들은 조국을 위해 끝까지 싸울 것입니다."
 SOO_Evaluate_the_existing_constitution: "현행 헌법 평가"
 SOO_Evaluate_the_existing_constitution_desc: "이제 현행 헌법을 바꿀 때가 아닐까요?"
 SOO_Allow_presidential_constitution_changes: "대통령 헌법 개정"
 SOO_Allow_presidential_constitution_changes_desc: "우리 대통령에게는 헌법에 대한 자신만의 구상이 있습니다."
 SOO_The_Regal_Relinquishment: "새로운 정치 생활"
 SOO_The_Regal_Relinquishment_desc: "우리 공화국의 정치 지형에 새 생명을 불어넣을 때입니다."
 SOO_Reform_the_distribution_of_farmland: "농업 개혁"
 SOO_Reform_the_distribution_of_farmland_desc: "우리 수입의 주된 원천은 농산물입니다. 이 산업을 현명하게 개혁해야 합니다."
 SOO_The_Kremlin_state: "친크렘린 국가"
 SOO_The_Kremlin_state_desc: "우리에게는 러시아 외에 더 이상 동맹이 없습니다."
 SOO_Ossetian_Patriotism_Reforms: "오세티야 애국주의"
 SOO_Ossetian_Patriotism_Reforms_desc: "모든 사람이 자신의 의무를 인식하고 조국을 위해 싸울 준비가 되어 있어야 합니다."
 SOO_adopted_a_new_constitution: "새 헌법"
 SOO_adopted_a_new_constitution_desc: "새 헌법을 채택할 때입니다."
 SOO_Enduring_the_Sovereignty_Fight: "독립 투쟁 지속"
 SOO_Enduring_the_Sovereignty_Fight_desc: "우리가 러시아의 일부가 되지 않는 한, 독립을 위해 계속 싸워야 합니다."
 SOO_pro_russian: "친러시아 노선"
 SOO_pro_russian_desc: "우리의 궁극적 목표는 북오세티야의 형제들 및 러시아와의 재통합입니다."
 SOO_integrate_to_russian_army: "러시아군에 통합"
