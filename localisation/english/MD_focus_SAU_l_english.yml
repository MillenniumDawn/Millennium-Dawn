 SAU_royal_reign: "The Reign of Salman and Mohammed bin Salman"
 SAU_Sabtoage_Anti-FSA_In_Syria: "Sabotage the Regime's Backers"
 SAU_Sabtoage_Anti-FSA_In_Syria_desc: "For every gun the Kingdom sends, Tehran and Moscow send two. Work in the shadows to disrupt the supply lines and proxies propping up Damascus."
 SAU_Salman_Abdulaziz: "The Accession of King Salman"
 SAU_Salman_Abdulaziz_desc: "King Abdullah is dead. Salman bin Abdulaziz, last great prince of the Sudairi Seven and governor of Riyadh for nearly half a century, ascends the throne in January 2015."
 SAU_salman_aramco_ipo: "§HThe Aramco IPO§!"
 SAU_salman_aramco_ipo_desc: "The kingdom's crown jewel - §LSaudi Aramco§! - is partially privatized. The largest IPO in history. §L25.6 billion dollars§! raised. The proceeds fund the §HPublic Investment Fund§! - MbS' strategic war chest."
 SAU_salman_council_authority: "§HCommand the Allegiance Council§!"
 SAU_salman_council_authority_desc: "Salman moves the §LAllegiance Council§! firmly under royal authority. Vetoes are overruled. Dissenting princes are §Gquietly§! sidelined. The Council exists - but it bends."
 SAU_salman_neom: "§HNEOM: The Megaproject§!"
 SAU_salman_neom_desc: "§L500 billion dollars§!. A futuristic city in the §Lnorthwestern desert§!, larger than §LBelgium§!. Robot servants, flying cars, vertical farms. §LThe Line§!: a 170-kilometer linear city. Critics call it a §Gfantasy§!. MbS calls it §Hthe future§!."
 SAU_salman_promote_mbs: "§HMohammed bin Salman: Crown Prince§!"
 SAU_salman_promote_mbs_desc: "In June 2017, Salman dismisses §LMohammed bin Nayef§! and elevates his son §LMbS§! to Crown Prince. §LMbS§! detains MbN, freezes his accounts, and seizes his offices. The §Hgenerational shift§! is complete."
 SAU_salman_purge: "§HThe Ritz-Carlton Purge§!"
 SAU_salman_purge_desc: "November 2017. §LMbS§! summons §L200 princes, ministers, and businessmen§! to the §LRitz-Carlton Riyadh§! - and arrests them. §L100 billion dollars§! in §Hsettlements§! is extracted. The old elite is §Yhumbled§! forever."
 SAU_salman_rule_by_decree: "§HRule by Royal Decree§!"
 SAU_salman_rule_by_decree_desc: "Salman issues §Lroyal decrees§! at an unprecedented pace. Ministries are reorganized. Subsidies are cut. The §LCouncil of Ministers§! becomes a rubber stamp. The §Hold consensus politics§! is dead."
 SAU_salman_sideline_rivals: "§HSideline Internal Rivals§!"
 SAU_salman_sideline_rivals_desc: "Princes who opposed Salman's elevation find their §Lbudgets cut§!, their §Lpositions reorganized§!, their §Lsupporters reassigned§!. Within two years, the Sudairi line stands §Hunchallenged§!."
 SAU_salman_son_mbs: "§HElevate Mohammed bin Salman§!"
 SAU_salman_son_mbs_desc: "Within months of taking the throne, Salman names his §L29-year-old§! son §LMohammed§! as Defense Minister and head of the new §LCouncil for Economic Affairs§!. The §Hyounger generation§! is being §Gfast-tracked§!."
 SAU_salman_sudairi_bloc: "§HConsolidate the Sudairi Bloc§!"
 SAU_salman_sudairi_bloc_desc: "Salman's full brothers are dead - but their sons remain. The §LSudairi clan§! still controls Defense, Interior, and the National Guard. Salman binds them tighter, with patronage and §Lblood§!."
 SAU_salman_vision_2030: "§HVision 2030§!"
 SAU_salman_vision_2030_desc: "A radical plan: §Hwean Saudi Arabia off oil§! by 2030. Tourism. Entertainment. Mining. Tech. The Religious Police lose their teeth. Women drive. Cinemas reopen after §L35 years§!. The kingdom of Salman and §LMbS§! is being §Greinvented§! in real time."
 SAU_salman_yemen_war: "§HThe Yemen War§!"
 SAU_salman_yemen_war_desc: "In March 2015, Salman launches §LOperation Decisive Storm§! against the §LHouthis§! in Yemen. A coalition of nine Arab states. Air strikes from §LJeddah§!, ground operations on the §Lborder§!. The war drags on for §Yyears§! - and §Yyears§!."
