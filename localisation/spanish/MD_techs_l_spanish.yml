 nsb_defense_tech_1: "Suite de Contramedidas Infrarrojas (IRCM)"
 nsb_defense_tech_1_desc: "Sistema básico de contramedidas infrarrojas diseñado para confundir los sistemas de guiado de misiles basados ​​en calor. Utiliza un inhibidor de infrarrojos rotatorio para emitir señales falsas y reducir la precisión de fijación del misil. Es eficaz contra los MANPADS de primera generación, pero su efectividad es limitada contra las amenazas modernas."
 nsb_defense_tech_2: "MAWS"
 nsb_defense_tech_2_desc: "Sistema de alerta de aproximación de misiles. Sistema de sensores que detecta lanzamientos de misiles mediante seguimiento ultravioleta o infrarrojo. Activa automáticamente el despliegue de contramedidas, como bengalas o chaff. Proporciona información pasiva sobre la situación ante amenazas de misiles guiados."
 nsb_defense_tech_3: "Sistemas Avanzados de (MAWS) y  (DIRCM)"
 nsb_defense_tech_3_desc: "Un moderno sistema de defensa antimisiles que combina la alerta temprana con una contramedida infrarroja direccional. Utiliza un láser en torreta para rastrear e interferir misiles guiados por infrarrojos. Mejora considerablemente la capacidad de supervivencia frente a sistemas avanzados de defensas aéreas portátiles (MANPADS) y armas portátiles."
 nsb_light_nose_gun_tech_1: "Ametralladoras Montadas en el Morro (Tempranas)"
 nsb_light_nose_gun_tech_1_desc: "Cañones montados en el morro, diseñados para dotar al helicóptero de un sistema de tiro de fuego directo."
 nsb_light_nose_gun_tech_2: "Ametralladoras Montadas en el Morro (Modernas)"
 nsb_light_nose_gun_tech_2_desc: "Cañones montados en el morro, diseñados para dotar al helicóptero de un sistema de tiro de fuego directo."
 nsb_light_nose_gun_tech_3: "Armas avanzadas montadas en el morro"
 nsb_light_nose_gun_tech_3_desc: "Cañones montados en el morro, diseñados para dotar al helicóptero de un sistema de tiro de fuego directo."
 nsb_gun_pods_tech_1: "Cápsulas de Ametralladora de 1ª Generación"
 nsb_gun_pods_tech_1_desc: "Sistemas de armas externos diseñados para potenciar las capacidades ofensivas de las aeronaves de ala rotatoria. Estas cápsulas permiten que los helicópteros transporten armamento adicional sin modificaciones significativas en su estructura, lo que proporciona flexibilidad y mayor potencia de fuego para diversos perfiles de misión."
