l_korean:
 AUTOMATION_SETTINGS_OPEN_TT: "자동화 설정 열기"
 AUTOMATION_SETTINGS_TITLE: "자동화 설정"
 AUTOMATION_SETTINGS_DESC: "반복되는 행동과 알림 설정을 하나의 패널에서 관리합니다. 다른 곳에 위치한 기존 제어 기능도 그대로 사용할 수 있습니다."
 AUTOMATION_SETTINGS_GENERAL_PAGE: "일반"
 AUTOMATION_SETTINGS_SPACE_PAGE: "인공위성"
 AUTOMATION_SETTINGS_INFLUENCE_PAGE: "영향력"
 AUTOMATION_SETTINGS_SPACE_DESC: "인공위성 자동 생산, 발사 및 위성군 업그레이드를 설정합니다."
 AUTOMATION_SETTINGS_INFLUENCE_DESC: "외국의 영향력으로부터 정부를 방어하는 반복 행동을 설정합니다."
 AUTOMATION_SETTINGS_SPACE_SAVE_BUTTON_TT: "Store the payload manifest staged in the Space Program as the §YCustom§! plan and switch to it.\n\n§YPrerequisites:§!\n[!automation_space_save_button_click_enabled]"
 AUTOMATION_SETTINGS_SPACE_UPGRADE_BUTTON_TT: "Promote each constellation to the newest researched generation wherever current orbital coverage supports it.\n\n§YPrerequisites:§!\n[!automation_space_upgrade_button_click_enabled]"
 AUTOMATION_SETTINGS_NOTIFICATIONS_HEADER: "알림 및 환경 설정"
 AUTOMATION_SETTINGS_UN_HEADER: "국제연합(United Nations)"
 AUTOMATION_SETTINGS_DIPLOMACY_HEADER: "외교"
 AUTOMATION_SETTINGS_NATO_HEADER: "나토(NATO)"
 AUTOMATION_SETTINGS_ENERGY_HEADER: "에너지"
 AUTOMATION_SETTINGS_PP_RESERVE: "정치력 비축량"
 AUTOMATION_SETTINGS_PP_RESERVE_VALUE: "£pol_power [?automation_pp_reserve|0]"
 AUTOMATION_SETTINGS_PP_RESERVE_TT: "정치력을 소모하는 자동화 행동은 정치력이 이 비축량 미만으로 떨어지지 않고 비용을 지불할 수 있을 때까지 대기합니다. 수동 행동은 영향을 받지 않습니다.\n\n£click_left §Y좌클릭§!: §Y1§! 조절\n£key_ctrl + £click_left §YCtrl + 좌클릭§!: §Y10§! 조절\n£key_shift + £click_left §YShift + 좌클릭§!: §Y100§! 조절"
 AUTOMATION_SETTINGS_PP_RESERVE_PLUS_TT: "£click_left §Y좌클릭§!: §Y1§! 증가\n£key_ctrl + £click_left §YCtrl + 좌클릭§!: §Y10§! 증가\n£key_shift + £click_left §YShift + 좌클릭§!: §Y100§! 증가"
 AUTOMATION_SETTINGS_PP_RESERVE_MINUS_TT: "£click_left §Y좌클릭§!: §Y1§! 감소\n£key_ctrl + £click_left §YCtrl + 좌클릭§!: §Y10§! 감소\n£key_shift + £click_left §YShift + 좌클릭§!: §Y100§! 감소"
 AUTOMATION_SETTINGS_CORRUPTION: "부패 제안 자동 거절"
 AUTOMATION_SETTINGS_CORRUPTION_TT: "부패 제안을 자동으로 건너뜁니다. 활성화되어 있는 동안에는 관련 이벤트와 보상이 표시되지 않습니다."
 AUTOMATION_SETTINGS_FOREIGN_ELECTION: "해외 선거 알림"
 AUTOMATION_SETTINGS_FOREIGN_ELECTION_TT: "다른 국가의 선거에 관한 뉴스 알림을 표시합니다."
 AUTOMATION_SETTINGS_RAID_NOTIFICATIONS: "영향력 공격 알림"
 AUTOMATION_SETTINGS_RAID_NOTIFICATIONS_TT: "다른 국가 간의 영향력 공격에 대한 이벤트를 표시합니다. 비활성화하더라도 우리를 향한 공격은 계속 보고됩니다."
 AUTOMATION_SETTINGS_INFLUENCE_REPORT: "월간 자동 영향력 보고서"
 AUTOMATION_SETTINGS_INFLUENCE_REPORT_TT: "자동 영향력의 영향을 받은 국가 목록을 보여주는 월간 보고서를 표시합니다."
 AUTOMATION_SETTINGS_INVESTMENT_ACCEPTANCE: "투자 제안 자동 수락"
 AUTOMATION_SETTINGS_INVESTMENT_ACCEPTANCE_TT: "들어오는 모든 국제 투자 제안을 자동으로 수락합니다. 이를 활성화하면 자동 거절은 비활성화됩니다."
 AUTOMATION_SETTINGS_INVESTMENT_REJECTION: "투자 제안 자동 거절"
 AUTOMATION_SETTINGS_INVESTMENT_REJECTION_TT: "들어오는 모든 국제 투자 제안을 자동으로 거절합니다. 이를 활성화하면 자동 수락은 비활성화됩니다."
 AUTOMATION_SETTINGS_REINVESTMENT: "국제 투자 재투자"
 AUTOMATION_SETTINGS_REINVESTMENT_TT: "국제 투자로 얻는 주간 수익을 국고와 재투자에 어떻게 분배할지 선택합니다."
 AUTOMATION_SETTINGS_REINVEST_OFF: "끔"
 AUTOMATION_SETTINGS_REINVEST_OFF_TT: "모든 국제 투자 수익을 국고로 보냅니다."
 AUTOMATION_SETTINGS_REINVEST_FULL: "전액"
 AUTOMATION_SETTINGS_REINVEST_FULL_TT: "모든 국제 투자 수익을 전액 재투자합니다."
 AUTOMATION_SETTINGS_REINVEST_SPLIT: "분할"
 AUTOMATION_SETTINGS_REINVEST_SPLIT_TT: "국제 투자 수익의 절반은 국고로 보내고 나머지 절반은 재투자합니다."
 AUTOMATION_SETTINGS_FUEL_PURCHASE: "연료 자동 구매"
 AUTOMATION_SETTINGS_FUEL_PURCHASE_TT: "즉시 연료를 구매한 후 28일마다 확인하여 연료 비축량이 20% 미만으로 떨어질 때마다 다시 구매합니다. 비활성화하면 향후 구매를 취소합니다."
 AUTOMATION_SETTINGS_INTERNAL_INVESTMENTS: "선택한 내부 투자 반복"
 AUTOMATION_SETTINGS_INTERNAL_INVESTMENTS_TT: "활성화되어 있는 동안 매일 £pol_power §R0.15§!의 정치력을 소모합니다. 주(State) 화면에서 내부 투자 버튼을 우클릭하여 반복할 주와 투자 유형을 선택할 수 있습니다. 선택된 투자는 매주 점검되며, 슬롯이 비어 있고 국고로 현재 비용을 지불할 수 있으며 정치력 비축량을 유지할 수 있을 때 실행됩니다."
 AUTOMATION_SETTINGS_ANTARCTICA_RESUPPLY: "남극 기지 자동 보급"
 AUTOMATION_SETTINGS_ANTARCTICA_RESUPPLY_TT: "남극 기지의 연료 잔여량이 11월~3월에는 15일 이하, 4월~10월에는 30일 이하일 때 자동으로 연료를 주문합니다. 보급 비용은 §R연료 1000당 2억 5천만 달러($0.25b)§!이며, 남극의 겨울철에는 2배로 증가합니다. 주문은 국고로 전체 비용을 지불할 수 있을 때까지 대기합니다."
 AUTOMATION_SETTINGS_ENERGY_CONSUMPTION_POLICY: "자동 소비 정책"
 AUTOMATION_SETTINGS_SC_VOTE: "안보리 기본 투표"
 AUTOMATION_SETTINGS_SC_VOTE_TT: "안전보장이사회 결의안에 자동으로 투표할 방식을 선택합니다. 선택된 옵션을 다시 클릭하면 수동 투표로 돌아갑니다."
 AUTOMATION_SETTINGS_GA_VOTE: "총회 기본 투표"
 AUTOMATION_SETTINGS_GA_VOTE_TT: "유엔 총회 결의안에 자동으로 투표할 방식을 선택합니다. 선택된 옵션을 다시 클릭하면 수동 투표로 돌아갑니다."
 AUTOMATION_SETTINGS_VOTE_YES: "찬성"
 AUTOMATION_SETTINGS_VOTE_NO: "반대"
 AUTOMATION_SETTINGS_VOTE_ABSTAIN: "기권"
 AUTOMATION_SETTINGS_SC_ACCEPT_TT: "모든 안전보장이사회 결의안에 자동으로 찬성 투표합니다."
 AUTOMATION_SETTINGS_SC_REJECT_TT: "모든 안전보장이사회 결의안에 자동으로 반대 투표합니다. 상임이사국인 경우 거부권을 행사합니다."
 AUTOMATION_SETTINGS_SC_ABSTAIN_TT: "모든 안전보장이사회 결의안에 자동으로 기권합니다."
 AUTOMATION_SETTINGS_GA_ACCEPT_TT: "모든 유엔 총회 결의안에 자동으로 찬성 투표합니다."
 AUTOMATION_SETTINGS_GA_REJECT_TT: "모든 유엔 총회 결의안에 자동으로 반대 투표합니다."
 AUTOMATION_SETTINGS_GA_ABSTAIN_TT: "모든 유엔 총회 결의안에 자동으로 기권합니다."
 AUTOMATION_SETTINGS_SATELLITE_REJECTION: "AI 위성 접근 제안 차단"
 AUTOMATION_SETTINGS_SATELLITE_REJECTION_TT: "AI 국가가 군사 및 민간 위성 시스템에 대한 공유 접근 권한을 제안하지 못하도록 차단합니다. 플레이어의 제안은 계속 받을 수 있습니다."
 AUTOMATION_SETTINGS_NATO_RATIFICATION: "나토 가입 자동 비준"
 AUTOMATION_SETTINGS_NATO_RATIFICATION_TT: "나토 가입 후보국을 비준하기 위해 자동으로 £pol_power §Y20§!의 정치력을 소모합니다. 비준은 정치력 비축량을 유지할 수 있을 때까지 대기합니다."
 AUTOMATION_SETTINGS_INFLUENCE_HEADER: "영향력 방어"
 AUTOMATION_SETTINGS_COMBAT_FOREIGN_INFLUENCE: "외국 영향력 자동 대응"
 AUTOMATION_SETTINGS_COMBAT_FOREIGN_INFLUENCE_TT: "활성화되어 있는 동안 매일 £pol_power §R0.05§!의 정치력을 소모합니다. 가능할 때마다 £pol_power §Y100§!의 정치력을 소모하여 국내 자주성을 §G2.5%§! 증가시킵니다. 100일마다 반복됩니다. 정부가 로비를 받고 있거나 비용 지불 시 정치력이 비축량 미만으로 떨어질 경우 자동화가 일시 정지됩니다."
 AUTOMATION_SETTINGS_ATTACK_FOREIGN_INFLUENCERS: "외국 영향력 행사국 자동 공격"
 AUTOMATION_SETTINGS_ATTACK_FOREIGN_INFLUENCERS_TT: "활성화되어 있는 동안 매일 £pol_power §R0.05§!의 정치력을 소모합니다. 자동으로 £pol_power §Y125§!의 정치력을 소모하여 조건에 맞는 가장 강력한 외국 영향력 행사국을 상대로 60일간의 캠페인을 시작합니다. 한 번에 하나의 캠페인만 진행됩니다. 부적격, 로비 중, 쿨다운 상태인 대상은 건너뜁니다. 비용 지불 시 정치력이 비축량 미만으로 떨어질 경우 자동화가 일시 정지됩니다."
 AUTOMATION_SETTINGS_INFLUENCE_COST_NOTE: "각 옵션을 활성화할 때마다 매일 £pol_power §R0.05§!가 소모됩니다. 두 옵션을 모두 켜면 매일 £pol_power §R0.10§!가 소모됩니다."
 AUTOMATION_SETTINGS_ECONOMY_PAGE: "경제"
 AUTOMATION_SETTINGS_ECONOMY_DESC: "Choose which taxes, public spending, investments, and energy purchases to manage automatically. Hover over a header or option for details."
 AUTOMATION_SETTINGS_TAX_HEADER: "세율"
 AUTOMATION_SETTINGS_BUDGET_HEADER: "예산 법률"
 AUTOMATION_SETTINGS_TAX_SUMMARY: "Enabled taxes change by at most one percentage point every four weeks in response to the budget balance, debt and Stability. Raises above the expected rate add §YPolicy Transition Costs§!, and cuts below it give a temporary bonus. While tax transition penalties exceed 10% £stability_texticon §YStability§!, raises that would add more pause unless the deficit is severe.\n\nManual changes leave automation enabled."
 AUTOMATION_SETTINGS_BUDGET_SUMMARY: "Enabled budgets move one level toward expected spending. At most one budget changes each week, with rotating priority. Increases require a budget surplus and pause while that budget's transition surcharge is above 5%, except §YMilitary Spending§! during a war. Moves toward the expected level add no §YPolicy Transition Costs§!. Manual law changes leave automation enabled."
 AUTOMATION_SETTINGS_POPULATION_TAX: "주민세: [?population_tax_rate|0]%"
 AUTOMATION_SETTINGS_CORPORATE_TAX: "법인세: [?corporate_tax_rate|0]%"
 AUTOMATION_SETTINGS_POPULATION_TAX_TT: "Automatically adjust Population Tax by one percentage point every four weeks using the budget balance, debt and Stability. Respects tax-change restrictions and pays the normal Political Power cost above the reserve. Raises above the expected rate add §YPolicy Transition Costs§!, and pause while tax transition penalties exceed 10% £stability_texticon §YStability§! unless the deficit is severe. Manual tax changes leave this option enabled."
 AUTOMATION_SETTINGS_CORPORATE_TAX_TT: "Automatically adjust Corporate Tax by one percentage point every four weeks using the budget balance and debt. Respects tax-change restrictions and pays the normal Political Power cost above the reserve. Raises above the expected rate add §YPolicy Transition Costs§!, and pause while tax transition penalties exceed 10% £stability_texticon §YStability§! unless the deficit is severe. Manual tax changes leave this option enabled."
 AUTOMATION_SETTINGS_BUDGET_BUREAUCRACY: "행정: [?bureau_law|0] / [?expected_adm_spending|0]"
 AUTOMATION_SETTINGS_BUDGET_BUREAUCRACY_TT: "Automatically move Administration toward its expected spending level, one level at a time. The numbers show the current and expected levels. Normal law restrictions and Political Power costs apply. Increases require a surplus and pause during impending bankruptcy or while this budget's transition surcharge is above 5%. The Political Power reserve is preserved. Moves toward the expected level add no §YPolicy Transition Costs§!. Manual law changes leave this option enabled."
 AUTOMATION_SETTINGS_BUDGET_CRIME_FIGHTING: "치안: [?police_law|0] / [?expected_police_spending|0]"
 AUTOMATION_SETTINGS_BUDGET_CRIME_FIGHTING_TT: "Automatically move Policing toward its expected spending level, one level at a time. The numbers show the current and expected levels. Normal law restrictions and Political Power costs apply. Increases require a surplus and pause during impending bankruptcy or while this budget's transition surcharge is above 5%. The Political Power reserve is preserved. Moves toward the expected level add no §YPolicy Transition Costs§!. Manual law changes leave this option enabled."
 AUTOMATION_SETTINGS_BUDGET_EDUCATION_BUDGET: "교육: [?education_law|0] / [?expected_edu_spending|0]"
 AUTOMATION_SETTINGS_BUDGET_EDUCATION_BUDGET_TT: "Automatically move Education toward its expected spending level, one level at a time. The numbers show the current and expected levels. Normal law restrictions and Political Power costs apply. Increases require a surplus and pause during impending bankruptcy or while this budget's transition surcharge is above 5%. The Political Power reserve is preserved. Moves toward the expected level add no §YPolicy Transition Costs§!. Manual law changes leave this option enabled."
 AUTOMATION_SETTINGS_BUDGET_HEALTH_BUDGET: "보건의료: [?health_law|0] / [?expected_health_spending|0]"
 AUTOMATION_SETTINGS_BUDGET_HEALTH_BUDGET_TT: "Automatically move Healthcare toward its expected spending level, one level at a time. The numbers show the current and expected levels. Normal law restrictions and Political Power costs apply. Increases require a surplus and pause during impending bankruptcy or while this budget's transition surcharge is above 5%. The Political Power reserve is preserved. Moves toward the expected level add no §YPolicy Transition Costs§!. Manual law changes leave this option enabled."
 AUTOMATION_SETTINGS_BUDGET_SOCIAL_BUDGET: "복지: [?social_law|0] / [?expected_welfare_spending|0]"
 AUTOMATION_SETTINGS_BUDGET_SOCIAL_BUDGET_TT: "Automatically move Welfare toward its expected spending level, one level at a time. The numbers show the current and expected levels. Normal law restrictions and Political Power costs apply. Increases require a surplus and pause during impending bankruptcy or while this budget's transition surcharge is above 5%. The Political Power reserve is preserved. Moves toward the expected level add no §YPolicy Transition Costs§!. Manual law changes leave this option enabled."
 AUTOMATION_SETTINGS_BUDGET_MILITARY_SPENDING: "Military Spending: [?military_law|0] / [?expected_military_law|0]"
 AUTOMATION_SETTINGS_BUDGET_MILITARY_SPENDING_TT: "Automatically move Military Spending toward its expected spending level, one level at a time. The numbers show the current and expected levels. Normal law restrictions and Political Power costs apply. Increases require a surplus and pause during impending bankruptcy or while this budget's transition surcharge is above 5% (not during a war). The Political Power reserve is preserved. Moves toward the expected level add no §YPolicy Transition Costs§!. Manual law changes leave this option enabled."
 AUTOMATION_SETTINGS_GENERAL_PAGE_TT: "국제연합 행동, 알림 설정 및 기타 소규모 자동화 행동과 같은 일반 자동화를 설정합니다."
 AUTOMATION_SETTINGS_SPACE_PAGE_TT: "위성 자동 생산, 발사 및 위성군 업그레이드를 설정합니다.\n\n§Y전제 조건:§!\n[!automation_settings_space_page_button_click_enabled]"
 AUTOMATION_SETTINGS_INFLUENCE_PAGE_TT: "영향력 방어 및 공격과 같은 영향력 자동화를 설정합니다."
 AUTOMATION_SETTINGS_ECONOMY_PAGE_TT: "세율, 예산 법안, 투자 및 에너지와 같은 경제 자동화를 설정합니다."
 AUTOMATION_SETTINGS_NUCLEAR_ENRICHMENT: "AI의 핵연료 제안 차단"
 AUTOMATION_SETTINGS_NUCLEAR_ENRICHMENT_TT: "AI 국가가 국가에 §Y핵연료§! 구매 요청을 보내는 것을 방지합니다. 인간 플레이어는 여전히 제안을 보낼 수 있습니다."
 AUTOMATION_SETTINGS_INVESTMENT_HEADER: "투자"
 AUTOMATION_SETTINGS_MAP_PALETTE_HEADER: "지도 모드 색상"
 AUTOMATION_SETTINGS_MAP_PALETTE_HEADER_TT: "이 모드의 지도 모드가 사용하는 색상을 선택합니다. 플레이어마다 자신이 플레이하는 국가를 기준으로 설정하므로, 국가를 바꾼 뒤에는 다시 설정하십시오. 초기화하려면 §Y표준§!을 선택하십시오."
 AUTOMATION_SETTINGS_MAP_PALETTE_STANDARD: "표준"
 AUTOMATION_SETTINGS_MAP_PALETTE_STANDARD_TT: "적록 색맹과 청황 색맹에서도 알아보기 쉽도록 검증된 기본 색상입니다. 이 항목을 선택하면 설정이 초기화됩니다."
 AUTOMATION_SETTINGS_MAP_PALETTE_RED_GREEN: "적록 색맹"
 AUTOMATION_SETTINGS_MAP_PALETTE_RED_GREEN_TT: "적색맹과 녹색맹용입니다. §YEU§!, §Y영향력§!, §Y기축 통화§! 지도 모드의 색상 간격을 더 넓힙니다. 나머지 지도 모드는 모든 유형에서 이미 구분이 되는 한 가지 색 구성을 유지합니다."
 AUTOMATION_SETTINGS_MAP_PALETTE_BLUE_YELLOW: "청황 색맹"
 AUTOMATION_SETTINGS_MAP_PALETTE_BLUE_YELLOW_TT: "청색맹용입니다. §YEU§!, §Y영향력§!, §Y기축 통화§! 지도 모드의 색상 간격을 더 넓힙니다. 나머지 지도 모드는 모든 유형에서 이미 구분이 되는 한 가지 색 구성을 유지합니다."
 AUTOMATION_SETTINGS_MIO_UNLOCK: "일반 군수 산업 조직 자동 해금"
 AUTOMATION_SETTINGS_MIO_UNLOCK_TT: "활성화하면 즉시, 이후에는 매일 일반 군수 산업 조직 카탈로그 순서대로 해금 가능한 조직을 해금합니다. 해금당 £pol_power §R50§! 정치력이 듭니다. 해당하는 경험치 비용도 함께 지불합니다. 카탈로그에 표기된 대로 육군 또는 공군 경험치 §R50§!, §R75§! 또는 §R100§!, 혹은 해군 경험치 §R100§!입니다. 국내 조직이 있는 국가는 해금당 §R계약 토큰 1개§!도 소모합니다. 모든 요건과 비용이 충족되고 정치력 예비분을 유지할 수 있을 때까지 구매는 보류됩니다. 한정된 경험치와 계약 토큰은 앞선 순서의 해금 가능 항목이 우선 배정받습니다. 기본값은 비활성화입니다."