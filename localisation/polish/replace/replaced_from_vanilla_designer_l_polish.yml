 DESIGNER_SUPPORT_COLUMN_TITLE: "Kompanie wsparcia szczebla brygady i dywizji. Są to pododdziały wsparcia, które pozostają za linią frontu i udzielają pomocy.\n\n Możesz wybrać tylko §Rjedną§! sztukę każdego rodzaju.\n\n Kompaniewsparcia §Rwpływają §!na §Yprędkość maksymalną§! dywizji oraz §Rzwiększają§! jej§Yrozpiętość bojową§!."
