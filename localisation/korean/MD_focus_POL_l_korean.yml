 POL_korwin_win_bop_left_win_range: "바웬사, 코르빈 타도"
 POL_korwin_win_bop_left_advanced_range: "바웬사에 대한 강한 지지"
 POL_korwin_win_bop_left_medium_range: "바웬사에 대한 보통 지지"
 POL_korwin_win_bop_left_low_range: "바웬사에 대한 약한 지지"
 POL_korwin_win_bop_right_win_range: "코르빈 집권"
 POL_korwin_win_bop_right_advanced_range: "코르빈에 대한 강한 지지"
 POL_korwin_win_bop_right_medium_range: "코르빈에 대한 보통 지지"
 POL_korwin_win_bop_right_low_range: "코르빈에 대한 약한 지지"
 POL_korwin_win_bop: "코르빈의 통치"
 POL_walesa_win_bop: "바웬사의 승리"
 poland_border_conflict.2.t: "폴란드, 칼리닌그라드 장악!"
 poland_border_conflict.2.d: "수주 간의 국경 분쟁 끝에 [SOV.GetName]은(는) 칼리닌그라드에서 철수하여 [POL.GetName]에 넘겨주어야 했습니다."
 poland_border_conflict.2.a: "대성공이다!"
 poland_border_conflict.2.b: "꺼져라, 폴란드"
 poland_border_conflict.3.t: "[SOV.GetName], 칼리닌그라드 방어"
 poland_border_conflict.3.d: "[SOV.GetName]은(는) 칼리닌그라드 장악을 목표로 한 폴란드의 공격을 저지하는 데 성공했습니다. 칼리닌그라드 시는 승리를 축하하고 있으며, 바르샤바는 패배의 쓴맛을 보고 있습니다."
 poland_border_conflict.3.a: "뭐... 어차피 필요 없었다"
 poland_border_conflict.3.b: "다시는 우리를 건드리지 마라"
 poland_border_conflict.4.t: "비무장지대가 된 칼리닌그라드"
 poland_border_conflict.4.d: "어느 쪽도 의미 있는 승리를 거두지 못했기 때문에, 폴란드가 국경 방어를 이유로 다시 공격에 나서지 않도록 칼리닌그라드는 비무장 지대가 되었습니다."
 poland_border_conflict.4.a: "위협이 사라졌다"
 poland_border_conflict.4.b: "그래도 그곳에는 아직 우리 공장이 있다"
 POL_2000_social_program: "사회 프로그램 완료"
 POL_2000_social_program_desc: "선거 전 마지막으로 사회 프로그램을 마무리하려던 노력이 어느 정도 성과를 거두었습니다."
 POL_social_program_focus: "사회 중점"
 POL_social_program_focus_desc: "도움이 필요한 이들을 돕기 위한 다양한 프로그램과 기부가 우리 사회 정책의 핵심입니다."
 POL_new_ideals_idea: "새로운 이상"
 POL_new_ideals_idea_desc: "21세기의 폴란드에는 새로운 자유주의적 사상이 필요하며, 우리는 우리 조국에서 민주주의가 승리하도록 보장해야 합니다."
 POL_reuse_central_planning_idea: "중앙 계획 프로그램"
 POL_reuse_central_planning_idea_desc: "공산주의자들이 우리나라를 점령했을 때 몇몇 분야에서는 어느 정도의 성과를 거두었습니다. 우리는 특정 분야에서는 그 가운데 좋았던 점을 재활용하면서, 다른 모든 분야에서는 시장 경제의 모든 이점을 누릴 수 있습니다."
 POL_christian_state_1: "기독교 국가"
 POL_christian_state_1_desc: "기독교는 우리 문화의 일부입니다. 이는 우리 국민으로서의 핵심 가치를 대표합니다."
 POL_christian_state_2: "강력한 기독교 국가"
 POL_christian_state_2_desc: "가톨릭은 우리의 국교입니다. 가톨릭은 어려운 시기에 우리를 인도하고 무엇이 선이고 무엇이 아닌지 보여 줍니다."
 POL_liberal_state: "진보적 국가"
 POL_liberal_state_desc: "우리 조국은 더 이상 과거 지향적이어서는 안 됩니다. 진보와 번영에 집중해야 합니다."
 POL_tax_cuts: "건설 감세"
 POL_tax_cuts_desc: "일부 자금을 전용하면 우리의 건설 사업에서 더 나은 성과를 거둘 수 있습니다."
 POL_social_development_priority_idea: "사회 발전 우선"
 POL_social_development_priority_idea_desc: "우리는 당분간 사회 발전과 관련 프로그램을 핵심 중점으로 삼았으며, 이는 분명 성과를 낼 것입니다."
 POL_improved_administration: "개선된 행정"
 POL_improved_administration_desc: "간소화되고 개혁된 우리의 행정은 국민과 국가 전체의 부담을 손쉽게 감당할 수 있습니다."
 POL_contruction_taxes: "건설 감세"
 POL_contruction_taxes_desc: "전국의 건설 사업을 개선하기 위해 취한 조치입니다."
 POL_eu_state: "진정한 EU 국가"
 POL_eu_state_desc: "우리의 결정은 나라를 바꾸어 놓았으며, 이제 우리는 진정한 EU 국가입니다."
 POL_fixed_brain_drain: "두뇌 유출 해결"
 POL_fixed_brain_drain_desc: "우리는 두뇌 유출 문제를 해결했지만, 대부분 덜 발전한 다른 국가들을 희생시킨 결과입니다."
 POL_housing_focus: "주택 사업 중점"
 POL_housing_focus_desc: "적정 가격의 주택은 언제나 잘 관리된 발전과 번영의 핵심입니다."
 POL_new_farms_market: "농가를 위한 신규 시장"
 POL_new_farms_market_desc: "새로운 연결과 함께 새로운 시장이 열리므로, 우리는 뒤처진 농가에 상당한 도약을 가져다주도록 조치했습니다."
 POL_ifv_production: "간소화된 보병전투차 생산"
 POL_ifv_production_desc: "동맹국들과 함께 우리는 군용 차량 생산에서 성공을 거두었습니다."
 POL_joint_russian_assets: "러시아 공동 자산"
 POL_joint_russian_assets_desc: "러시아의 도움과 군수 산업 전문성 덕분에 우리는 군수 산업 발전에서 두각을 나타낼 수 있습니다."
 POL_promoted_industrial_quality: "촉진된 산업 품질"
 POL_promoted_industrial_quality_desc: "새로운 기준과 홍보 캠페인은 노동자들이 근무 습관을 개선하도록 동기를 부여하는 데 도움이 됩니다."
 POL_modernization_and_tradition: "현대화와 전통"
 POL_modernization_and_tradition_desc: "전통이 혁신을 가로막지는 않습니다. 우리는 이 가치들을 하나로 결합하는 데 계속 집중해야 합니다."
 POL_political_schism: "정치적 분열"
 POL_political_schism_desc: "정치적 혼란이 우리 사회에 큰 분열을 일으켰습니다."
 POL_fourth_rp: "제4 레치포스폴리타"
 POL_fourth_rp_desc: "우리는 영광이 예정된 위대한 레치포스폴리타의 계승자를 세우는 데 성공했습니다."
 POL_united_nationalists: "통합된 민족주의자들"
 POL_united_nationalists_desc: "여러 민족주의 운동이 권력을 장악하기 위해 차이를 접어 두었습니다."
 POL_nationalists_squads: "민족주의 행동대"
 POL_nationalists_squads_desc: "민족주의 행동대가 우익 운동의 일환으로 재편되고 있습니다."
 POL_political_violence: "정치적 폭력"
 POL_political_violence_desc: "정치적 폭력이 확대되어 평범한 삶의 방식은 이제 추억일 뿐입니다."
 POL_reformed_ministry: "개혁된 외무부"
 POL_reformed_ministry_desc: "외무부는 국가 이익에 봉사하도록 방향이 재설정되었습니다."
 POL_paramilitary_organization_idea: "준군사 집단"
 POL_paramilitary_organization_idea_desc: "다양한 준군사 집단이 필요한 경우 군의 대열을 보강하는 데 도움이 됩니다."
 POL_propaganda_ministry_idea: "선전부"
 POL_propaganda_ministry_idea_desc: "선전부는 서방의 해로운 영향력에 맞서는 데 도움이 됩니다. 물론 오로지 진실만을 퍼뜨리면서 말입니다."
 POL_nationalist_research_small: "제한적 과학 협력"
 POL_nationalist_research_small_desc: "폴란드 국가는 자국 동맹 내에서 어느 정도의 과학 협력을 이루는 데 성공했습니다."
 POL_nationalist_research_medium: "과학 협력"
 POL_nationalist_research_medium_desc: "폴란드 국가는 자국 동맹 내에서 적절한 과학 협력을 이루는 데 성공했습니다."
 POL_nationalist_research_large: "광범위한 과학 협력"
 POL_nationalist_research_large_desc: "폴란드 국가는 자국 동맹 내에서 광범위한 과학 협력을 이루는 데 성공했습니다."
 POL_nationalist_full_social_support: "전면적 사회 지원"
 POL_nationalist_full_social_support_desc: "사회 프로그램에 대한 전면적 지원이 국가의 목표로 설정되었습니다."
 POL_nationalist_limited_social_support: "제한적 사회 지원"
 POL_nationalist_limited_social_support_desc: "일부 자원이 도움이 필요한 이들을 지원하는 데 전용되었습니다."
 POL_civilian_focus: "민간 중점"
 POL_civilian_focus_desc: "모든 규모에서 가장 원활한 건설 과정을 보장하기 위해 많은 조치가 이루어지고 있습니다."
 POL_centralized_rule_idea: "중앙 집권 통치"
 POL_centralized_rule_idea_desc: "계획, 구상, 명령 모두가 중앙 집권적인 위원회와 조직에서 나옵니다."
 POL_comm_agile_control: "민첩한 통제"
 POL_comm_agile_control_desc: "적응력을 확보하기 위해 상당한 권한이 하위 단계에 위임되었습니다."
 POL_comm_land_reform: "토지 개혁"
 POL_comm_land_reform_desc: "수많은 소규모 법률과 제한을 포함하는 토지 개혁은 소비에트 시대 방식의 농업 조합을 성격상 현대화하여 되살리는 것을 목표로 합니다."
 POL_clergy_opressed: "억압받는 성직자"
 POL_clergy_opressed_desc: "관리들은 교회가 사회에 미치는 영향력을 제한하는 법률과 개혁을 추진하고 있습니다."
 POL_women_economy: "경제 속의 여성"
 POL_women_economy_desc: "직장 내 여성의 평등을 보장하기 위해 여러 법률과 조합이 도입되었습니다."
 POL_quality_control_idea: "지역 품질 관리"
 POL_quality_control_idea_desc: "최근 정부는 높은 품질의 제품 생산을 보장하도록 강력히 장려해 왔습니다."
 POL_speed_development_idea: "고속 발전"
 POL_speed_development_idea_desc: "최근 몇 년간 시작된 많은 사업의 속도를 높이려는 추진이 이어지면서, 논의가 결국 어느 정도의 행동과 통제로 이어졌음이 이제 분명해졌습니다."
 POL_sre_low_effort: "낮은 산업 중점"
 POL_sre_low_effort_desc: "산업 역량은 시장 경제에 남은 부분을 중심으로 운영되며, 실제로 연간 할당량을 위해 가동되는 공장은 소수에 불과합니다."
 POL_sre_medium_effort: "중간 산업 중점"
 POL_sre_medium_effort_desc: "상당수의 공장이 연간 할당량 달성에 집중하고 있으며, 나머지는 여전히 소비재 생산으로 바쁩니다."
 POL_sre_max_effort: "높은 산업 중점"
 POL_sre_max_effort_desc: "가용 자원의 거의 전부가 국가의 직접 통제하에서 가동되고 있습니다. 남은 부분은 대개 지역 주민을 위한 소규모 물품을 생산하느라 바쁩니다."
 POL_sre_lowest_success: "급락하는 국영 경제"
 POL_sre_lowest_success_desc: "수년 연속으로 계획을 달성하지 못하면서, 이제는 경제가 어떻게 아직 돌아가고 있는지조차 분명하지 않습니다."
 POL_sre_low_success: "부진한 국영 경제"
 POL_sre_low_success_desc: "일부 할당량이 미달되어 공장에 제대로 가동할 공구와 자재가 부족하며, 그 결과 경제가 상당히 둔화되고 있습니다."
 POL_sre_medium_success: "안정적인 국영 경제"
 POL_sre_medium_success_desc: "잠재력에는 한참 못 미치지만, 현재 국영 공장들은 기대되는 속도와 효율로 가동되어 경제에 필요한 물자를 꾸준히 공급하고 있습니다."
 POL_sre_high_success: "성장하는 국영 경제"
 POL_sre_high_success_desc: "공장들이 기대 이상의 성과를 내면서 경제 전체가 탁월함과 성장의 징후를 보이고 있습니다."
 POL_sre_highest_success_desc: "국영 경제는 이제 최첨단 수준의 기관이 되었습니다. 필요한 모든 것을 공급하며 산업 및 군사 확장에 분명 도움이 될 것입니다."
 POL_removed_spirits: "변경된 국가 정신"
 POL_removed_spirits_desc: "최근의 정치적 변화로 인해 이전 정부의 프로그램과 기관을 되돌리는 데 상당한 노력이 투입되었으며, 이는 많은 이들에게 불만과 골칫거리를 안겨 주었습니다."
 POL_idea_strict_abortion: "엄격한 낙태 금지"
 POL_idea_strict_abortion_desc: "새로 강화된 낙태법은 정치적 입지를 희생하는 대가로 인구 증가에 큰 도움을 주었습니다."
 POL_anti_russian_focus: "반러시아 군사 조치"
 POL_anti_russian_focus_desc: "우리는 러시아에 맞서 행동하기 위해 자원을 결집해야 합니다."
 POL_investors_idea: "투자자"
 POL_investors_idea_desc: "외국인 투자자들이 우리나라에 기업을 설립하고 있습니다."
 POL_new_workplaces_idea: "새로운 일자리"
 POL_new_workplaces_idea_desc: "시장에 새로운 일자리가 나타나기 시작했습니다. 일하는 인구가 늘어나면 우리 경제의 발전이 크게 가속화됩니다."
 POL_western_market_idea: "서방 시장과의 접근"
 POL_western_market_idea_desc: "서방 시장은 우리보다 더 발전해 있습니다. 서방 시장에 가까이 다가가는 것은 좋은 생각입니다."
 POL_late_retirement_idea: "늦은 은퇴"
 POL_late_retirement_idea_desc: "은퇴가 늦어지면 사람들이 더 오래 일하고 국가에 더 오래 봉사하게 됩니다"
 POL_renewed_hospitals: "새롭게 단장한 병원"
 POL_renewed_hospitals_desc: "병원에 현대식 의료 장비를 공급하고 유전학 연구를 강화하면서 국민의 삶의 질이 개선되기 시작하고 있습니다."
 POL_development_of_education: "교육 발전"
 POL_development_of_education_desc: "영어는 특히 유럽에서 우리 시대의 라틴어입니다. 그렇기 때문에 우리 젊은이들에게 어릴 때부터 이 언어를 가르치는 것이 매우 중요합니다."
 POL_safe_country: "안전한 국가"
 POL_united_visehgrad_idea: "통합 비셰그라드"
 POL_united_visehgrad_idea_desc: "비셰그라드 그룹이 마침내 통합되었습니다. 우리는 경제의 모든 측면을 발전시키는 데 집중할 수 있습니다."
 POL_viser_idea: "비제르"
 POL_viser_idea_desc: "4개국이 통합된 후 환율 문제가 불거지기 시작했습니다. 이 문제의 해법은 새로운 통화인 비제르의 도입입니다. 이제부터 비제르는 비셰그라드 연합국의 국가 통화이며, PLN이나 CZK 같은 나머지 통화는 보조 통화가 됩니다."
 POL_friendly_neighbor_idea: "우호적인 이웃"
 POL_friendly_neighbor_idea_desc: "다른 나라들과의 무역은 국가에서 매우 중요한 역할을 합니다."
 POL_independent_economy_idea: "독립 경제"
 POL_independent_economy_idea_desc: "경제적 독립은 우리가 오랜 세월 동안 추구해야 하는 것입니다."
 POL_energetic_safety_idea: "에너지 안보"
 POL_energetic_safety_idea_desc: "새로운 풍력 발전 단지와 소규모 수력 발전소는 송유·송가관과 결합하여 우리에게 경제적 안정을 제공하는 데 성공했습니다."
 POL_ncbr_idea: "NCBR"
 POL_outdated_army_idea: "시대에 뒤떨어진 군대"
 POL_outdated_army_idea_desc: "소비에트 통치로 인해 우리 군은 견고한 방어를 제공할 수 없었습니다."
 POL_beginning_of_army_reorganisation_idea: "군 재편의 시작"
 POL_beginning_of_army_reorganisation_idea_desc: "우리는 서서히 20세기를 벗어나고 있습니다. 우리 군은 서방 국가들을 따라잡기 시작하고 있습니다."
 POL_disciplined_army_idea: "규율 잡힌 군대"
 POL_disciplined_army_idea_desc: "마침내 우리 군은 현대적인 군대가 무엇인지 배웠습니다."
 POL_modern_military_forces_idea: "현대 군사력"
 POL_modern_military_forces_idea_desc: "현대식 무기 사용법을 익히면서 우리 군은 국제 무대에서 의미 있는 존재가 되기 시작했습니다."
 POL_polskie_sily_zbrojne_idea: "폴란드 군(Polskie Siły Zbrojne)"
 POL_increased_production_of_ships_idea: "선박 생산 증대"
 POL_increased_production_of_ships_idea_desc: "우리는 신형 선박 생산을 시작할 수 있습니다."
 POL_baltic_fleet_idea: "발트 함대"
 POL_baltic_fleet_idea_desc: "당장 우리의 최우선 과제는 수심이 얕은 발트해입니다. 대양은 나중에 집중하겠습니다."
 POL_preparing_for_deep_waters_idea: "심해 대비"
 POL_preparing_for_deep_waters_idea_desc: "우리는 대서양과 어쩌면 태평양에서의 임무를 준비하고 있습니다. 따라서 즉시 투입 가능한 더 강력한 함선과 잠수함이 필요합니다."
 POL_polska_pancerna_flota_idea: "폴란드 장갑 함대(Polska Flota Pancerna)"
 POL_polska_pancerna_flota_idea_desc: "우리 해군은 새롭게 단장되어 얕은 바다와 깊은 바다 모두에서 작전할 수 있습니다. 주력함의 인도 아래 우리는 모든 해역에서 우위를 확보할 준비가 되어 있습니다."
 POL_modernization_of_armored_forces_idea: "기갑 전력 현대화"
 POL_modernization_of_armored_forces_idea_desc: "우리는 마침내 모든 유형의 전차 생산을 시작했습니다."
 POL_beginning_of_the_revolution_idea: "혁명의 시작"
 POL_united_with_the_west_idea: "서방과의 결속"
 POL_stay_inside_the_country_idea: "국내 잔류"
 POL_improved_reconnaissance_idea: "개선된 정찰"
 POL_slovak_school_funded_idea: "슬로바키아 학교 재정 지원"
 POL_national_unity_idea: "국민 통합"
 POL_national_unity_idea_desc: "오랜 세월의 고난과 점령에도 우리의 민족정신은 꺾이지 않았습니다. 모든 역경에도 우리는 단결해 있으며 과거의 실수를 반복하지 않기 위해 가능한 모든 일을 할 것입니다."
 POL_safe_country_desc: "범죄 감소와 정보 기관의 역량 강화는 투자자뿐 아니라 안전한 휴가를 즐길 수 있는 관광객까지 새로운 사람들을 효과적으로 끌어들입니다."
 POL_bribed_courts_idea: "매수된 법원"
 POL_bribed_courts_idea_desc: "부패한 법원이 집권당에 유리하게 작동합니다."
 POL_sexual_intolerance_idea: "성적 불관용"
 POL_sexual_intolerance_idea_desc: "성적 지향의 차이와 정부의 반대가 국가를 불안정하게 만듭니다."
 POL_democratic_country_idea: "민주주의 국가"
 POL_democratic_country_idea_desc: "공산주의 통치는 끝났습니다. 우리는 민주주의적 미래를 생각해야 합니다."
 POL_education_reform1_idea: "교육 개혁"
 POL_education_reform1_idea_desc: "이것은 교육 개혁의 시작입니다. 우리 젊은이들이 어떻게 형성될지는 우리에게 달려 있습니다."
 POL_education_reform2_idea: "교육 개혁"
 POL_education_reform2_idea_desc: "당시의 교육 방식을 계속 이어 가는 것은 젊은이들에게 우리나라의 과거를 가르치는 좋은 방법입니다."
 POL_school_funding_idea: "학교 재정 지원 프로그램"
 POL_school_funding_idea_desc: "자녀에게 기본 교재조차 사 줄 형편이 안 되는 가정이 있습니다. 정부의 무상 교과서 프로그램 덕분에 우리는 이러한 아동들에게 초등학교에서 완전히 무상인 교육을 제공할 수 있게 될 것입니다."
 POL_education_reform3_idea: "교육 개혁"
 POL_education_reform3_idea_desc: "예를 들어 핀란드나 독일에서 시행되는 교육 과정은 우리의 낡은 제도보다 훨씬 효과적입니다. 우리는 경영학이나 경제학 같은 특정 과목을 배우는 데 집중해야 합니다."
 POL_modern_teaching_methods_idea: "현대식 교수법"
 POL_modern_teaching_methods_idea_desc: "교사들에게 전자 칠판 같은 현대식 장비를 사용하도록 교육하면 교사들이 수업 자료를 소화하기가 쉬워지고, 학생들도 일반 교재 대신 현대 기술을 보면 수업에 더 흥미를 갖게 될 것입니다."
 POL_reformed_education_idea: "개혁된 교육"
 POL_reformed_education_idea_desc: "도입된 교육 개혁은 우리 교육 제도에 긍정적인 영향을 미쳤습니다. 새로운 졸업생들은 더 높은 졸업 시험 성적으로 학교를 떠나며, 이미 많은 성인보다 사회에 더 잘 봉사하고 있습니다."
 POL_ncbr_idea_desc: "새로운 연구 센터는 우리의 연구를 크게 가속화합니다."
 POL_maria_reactor_expansion_idea: "MARIA 원자로 확장"
 POL_maria_reactor_expansion_idea_desc: "이 위험한 사업은 틀림없이 미래에 결실을 맺을 것입니다."
 POL_homeland_defense_act_idea: "국토 방위법"
 POL_homeland_defense_act_idea_desc: "폴란드군을 강화하기 위한 폴란드 법률"
 POL_polish_russian_cooperation_idea: "폴란드-러시아 협력"
 POL_polish_russian_cooperation_idea_desc: "소련 시절 붉은 군대는 때로는 질보다 양이 나을 수 있음을 우리에게 보여 주었으므로, 우리는 러시아와의 관계를 강화해야 합니다."
 POL_miecznik_idea: "미에치니크"
 POL_miecznik_idea_desc: "미에치니크 계획은 강력한 신형 호위함 3척의 건조를 전제로 합니다. 우리는 이 사업을 실행하는 쪽으로 산업을 전환하고 있습니다."
 POL_stealth_ship_coasts_idea: "스텔스 함선 연안 작전"
 POL_stealth_ship_coasts_idea_desc: "우리 함선의 탐지 가능성이 낮아지면 임무를 더 효과적으로 수행할 수 있습니다."
 POL_independent_shipbuilding_industry_idea: "독립 조선 산업"
 POL_independent_shipbuilding_industry_idea_desc: "우리는 경제를 다른 나라에 의존하게 만들 수 없습니다. 우리는 함대를 스스로 건조할 것입니다."
 POL_shipbuilding_industry_in_cooperation_with_the_usa_idea: "미국과 협력하는 조선 산업"
 POL_shipbuilding_industry_in_cooperation_with_the_usa_idea_desc: "우리는 함대를 직접 건조하지 않을 것이며, 그래서 미국과 협력합니다."
 POL_shipbuilding_industry_in_cooperation_with_the_korea_idea: "대한민국과 협력하는 조선 산업"
 POL_shipbuilding_industry_in_cooperation_with_the_korea_idea_desc: "우리는 함대를 직접 건조하지 않을 것이며, 그래서 한국과 협력합니다."
 POL_lighter_planes_and_helicopters_idea: "더 가벼운 항공기와 헬리콥터"
 POL_lighter_planes_and_helicopters_idea_desc: "더 가벼운 비행체는 더 높은 기민성과 속도를 부여할 것입니다."
 POL_baltic_air_policing_idea: "발트 영공 감시"
 POL_baltic_air_policing_idea_desc: "우리 영공은 원치 않는 국가들에 의해 침범당해서는 안 되며, 우리는 이러한 규칙을 정비했습니다."
 POL_mass_aircraft_production_idea: "항공기 대량 생산"
 POL_mass_aircraft_production_idea_desc: "우리는 항공기 대량 생산을 시작할 준비가 되어 있습니다."
 POL_mass_drone_production_idea: "드론 대량 생산"
 POL_mass_drone_production_idea_desc: "우리는 전투 드론 대량 생산을 시작할 준비가 되어 있습니다."
 POL_expert_drone_reconnaissance_idea: "숙련된 드론 정찰"
 POL_expert_drone_reconnaissance_idea_desc: "드론 덕분에 우리는 큰 위험 없이 적의 움직임을 추적할 수 있습니다."
 POL_homeland_defense_idea: "조국 방어"
 POL_homeland_defense_idea_desc: "이곳은 우리 영토이므로 이곳에서는 우리가 우위를 가져야 합니다. 우리는 수년 동안 게릴라전을 해 왔기에 이 전술이 얼마나 효과적인지 여전히 기억하고 있습니다."
 POL_polskie_sily_zbrojne_idea_desc: "소련군의 흔적은 더 이상 없습니다. 우리 군은 개혁되었으며 조국을 방어할 준비가 되어 있습니다."
 POL_soviet_era_air_idea: "소비에트 시대의 공군"
 POL_soviet_era_air_idea_desc: "소련은 질보다 양을 우선했습니다. 항공기는 생산 비용이 저렴하지만, 그 외의 모든 것에 대해서는 거짓말을 하고 있습니다."
 POL_change_of_air_doctrine_idea: "항공 교리 변경"
 POL_change_of_air_doctrine_idea_desc: "소련의 항공 교리는 조종사의 안전에 별로 신경 쓰지 않았습니다. 그러나 이제 이것은 바뀌었습니다."
 POL_new_pilot_training_idea: "신규 조종사 훈련"
 POL_new_pilot_training_idea_desc: "우리는 젊은이들이 항공 부대에 지원하도록 장려합니다. 신참들은 수년간 소련식 훈련을 받지 않았기 때문에 변화에 더 빠르게 적응합니다."
 POL_contemporary_plane_systems_idea: "현대식 항공기 시스템"
 POL_contemporary_plane_systems_idea_desc: "신형 항공기에는 새로운 레이더 시스템, 조준기, 버튼 등이 갖춰져 있습니다. 우리 조종사들은 이제 이 모든 것을 다룰 줄 압니다."
 POL_polskie_sily_powietrzne_idea: "폴란드 공군(Polskie Siły Powietrzne)"
 POL_polskie_sily_powietrzne_idea_desc: "새로운 항공 전력은 임무를 효과적으로 수행하고 제공권을 확보할 것입니다."
 POL_token_fleet_idea: "명목상의 함대"
 POL_token_fleet_idea_desc: "우리는 종종 전통을 고수해 왔지만, 전통이 전쟁에서 승리하게 해 주지는 않습니다. 우리는 새로운 해전 방식에 적응해야 합니다."
 POL_shallow_sea_experts_idea: "천해 전문가"
 POL_strong_parachutes_idea: "더 튼튼한 낙하산"
 POL_advanced_and_safe_training: "고급 안전 훈련"
 POL_higher_spending_on_the_army: "군 지출 확대"
 POL_future_plans_idea: "미래 계획"
 POL_strong_foreign_policy_idea: "강경 외교 정책"
 POL_anti_russian_policy_idea: "반러시아 정책"
 POL_increased_security_idea: "강화된 보안"
 POL_fixed_brain_drain2: "두뇌 유출"
 POL_fixed_brain_drain2_desc: "강력한 공산주의 이념이 우리의 정신과 세계관을 혼란스럽게 만들었습니다."
 POL_unions_support_idea: "노조 지원"
 POL_destroyer_trainings_idea: "신형 구축함 교리"
 POL_walesa_opposition_idea: "바웬사 반대파"
 POL_walesa_opposition_idea_desc: "레흐 바웬사는 끊임없이 코르빈에게서 권력을 빼앗으려 하고 있습니다. 그가 성공하면 다시 폴란드 대통령이 되겠지만, 그가 그렇게 하려는 방식이 매우 비민주적이기 때문에 많은 사람이 이 사건이 코르빈의 불안정한 통치보다 더 나쁠 수 있다고 믿을지도 모릅니다."
 POL_korwin_opposition_idea: "코르빈 반대파"
 POL_korwin_opposition_idea_desc: "코르빈미키에는 끊임없이 바웬사에게서 권력을 빼앗으려 하고 있습니다. 그가 성공하면 폴란드 대통령이 되겠지만, 그가 그렇게 하려는 방식이 매우 비민주적이기 때문에 많은 사람이 이 사건이 바웬사의 안정적인 통치보다 더 나쁠 수 있다고 믿을지도 모릅니다."
 POL_home_defence_idea: "조국 방어"
 POL_polish_ukrainian_war_idea: "폴란드-우크라이나 전쟁"
 POL_aggressive_policy_against_ukraine_idea: "대우크라이나 공세 정책"
 POL_grain_import_idea: "우크라이나산 곡물 수입"
