l_spanish:
 POTEF001: "Presidente de la Federación Europea"
 POTEF001_desc: "El §YPresidente de la Federación Europea (POTEF)§! es el líder supremo de Europa. Por lo tanto, el Presidente de la Federación Europea tiene el poder de tomar decisiones estratégicas decisivas para toda la Federación."
 POTEF100: "Doctrina Alpina"
 POTEF100_desc: "The Alpine nations of §Y[AUS.GetNameWithFlag]§! and §Y[SWI.GetNameWithFlag]§! have a long tradition of mountain warfare. With the Alpine Doctrine all member states can adopt this tradition and tactics."
 POTEF101: "La Integridad de la Creación"
 POTEF101_desc: "Para salvar y conservar la Integridad de la Creación, la Federación Europea adapta sus políticas."
 POTEF102: "Imperialismo Ambiental"
 POTEF102_desc: "Europa es verde, pero el mundo aún está oscuro y gris. Europa necesita difundir sus políticas y tecnologías en todo el mundo y luchar contra los imperios de energía fósil que están destruyendo el planeta."
 POTEF103: "América del Norte"
 POTEF103_desc: "Europa es verde, pero América del Norte aún está oscura y gris. Europa necesita difundir sus políticas y tecnologías en todo el mundo y luchar contra los imperios de energía fósil que están destruyendo el planeta."
 POTEF104: "América del Sur"
 POTEF104_desc: "Europa es verde, pero América del Sur aún está oscura y gris. Europa necesita difundir sus políticas y tecnologías en todo el mundo y luchar contra los imperios de energía fósil que están destruyendo el planeta."
 POTEF105: "Europa"
 POTEF105_desc: "Europa es verde, pero los otros países europeos aún están oscuros y grises. Europa necesita difundir sus políticas y tecnologías en todo el mundo y luchar contra los imperios de energía fósil que están destruyendo el planeta."
 POTEF106: "África"
 POTEF106_desc: "Europa es verde, pero África aún está oscura y gris. Europa necesita difundir sus políticas y tecnologías en todo el mundo y luchar contra los imperios de energía fósil que están destruyendo el planeta."
 POTEF107: "Medio Oriente"
 POTEF107_desc: "Europa es verde, pero el Medio Oriente aún está oscuro y gris. Europa necesita difundir sus políticas y tecnologías en todo el mundo y luchar contra los imperios de energía fósil que están destruyendo el planeta."
 POTEF108: "Asia"
 POTEF108_desc: "Europa es verde, pero Asia aún está oscura y gris. Europa necesita difundir sus políticas y tecnologías en todo el mundo y luchar contra los imperios de energía fósil que están destruyendo el planeta."
 POTEF109: "Oceanía"
 POTEF109_desc: "Europa es verde, pero Oceanía aún está oscura y gris. Europa necesita difundir sus políticas y tecnologías en todo el mundo y luchar contra los imperios de energía fósil que están destruyendo el planeta."
 POTEF110: "Pacífico"
 POTEF110_desc: "Europa es verde, pero el Pacífico aún está oscuro y gris. Europa necesita difundir sus políticas y tecnologías en todo el mundo y luchar contra los imperios de energía fósil que están destruyendo el planeta."
 POTEF150: "Doctrina Alemana"
 POTEF150_desc: "§Y[GER.GetNameWithFlag]§! se ha centrado tradicionalmente en fuerzas acorazadas fuertes. Con la Doctrina de Blindados, todos los Estados miembros pueden adoptar esta tradición y tácticas."
 POTEF151: "Imperio del Comercio"
 POTEF151_desc: "La Federación Europea se convertirá en un Imperio del Comercio."
 POTEF200: "Doctrina Francesa"
 POTEF200_desc: "§Y[FRA.GetNameWithFlag]§! se ha centrado tradicionalmente en fuerzas ligeras acorazadas y motorizadas altamente móviles. Con la Doctrina de Guerra de Maniobra, todos los Estados miembros pueden adoptar esta tradición y tácticas."
 POTEF201: "Poder Imperial"
 POTEF201_desc: "La Federación Europea se encuentra en la tradición de sus predecesores imperiales."
 POTEF202: "Imperio de la Libertad"
 POTEF202_desc: "La Federación Europea se convertirá en un Imperio de la Libertad."
 POTEF203: "América: Aliado o Adversario"
 POTEF203_desc: "América y Europa han sido aliados durante la mayor parte del siglo XX. Con los recientes cambios políticos en §Y[USA.GetNameWithFlag]§!, esto ha sido cuestionado..."
 POTEF204: "Legado de la OTAN"
 POTEF204_desc: "En la tradición del legado de mantenimiento de la paz de la OTAN, §Y[USA.GetNameWithFlag]§! y el §YEDU§! forman una nueva alianza."
 POTEF205: "Legado de Trump"
 POTEF205_desc: "§Y[USA.GetNameWithFlag]§! pasó de ser un aliado a un adversario. Europa tiene que reaccionar a este cambio estratégico decisivo."
 POTEF206: "Romper el Muro"
 POTEF206_desc: "Para contrarrestar la amenaza estadounidense a la soberanía europea, el Estado Mayor General del §YEDU§! ha elaborado un plan para aliarse con §Y[MEX.GetNameWithFlag]§! e invadir §Y[USA.GetNameWithFlag]§! desde el sur."
 POTEF207: "Resurrección de Buster"
 POTEF207_desc: "Para contrarrestar la amenaza estadounidense a Europa, el Estado Mayor General del §YEDU§! ha propuesto aliarse con §Y[CAN.GetNameWithFlag]§! y revisar el Plan de Defensa Nº 1, un plan creado por el teniente coronel canadiense James 'Buster' Sutherland Brown, para un ataque preventivo canadiense contra los Estados Unidos en caso de un conflicto inminente entre los Estados Unidos y el Imperio Británico. Con este plan, el §YEDU§! puede lanzar una invasión desde el norte en §Y[USA.GetFlag] los EE. UU.§!."
 POTEF250: "Doctrina Benelux"
 POTEF250_desc: "Después de la Guerra Fría, §Ylos Países Bajos§! se centraron en fuerzas móviles aéreas para adaptarse a la nueva situación. Con la Doctrina de Movilidad Aérea, todos los Estados miembros pueden adoptar estas tácticas."
 POTEF251: "Legado Liberal"
 POTEF251_desc: "La Federación Europea honra su Legado Liberal."
 POTEF252: "Safeguard las antiguas rutas comerciales"
 POTEF252_desc: "La Federación Europea necesita salvaguardar las antiguas rutas comerciales hacia el Caribe, África y las antiguas Indias Orientales Neerlandesas."
 POTEF253: "Indonesia"
 POTEF253_desc: "La Federación Europea necesita mejorar su relación con la antigua colonia neerlandesa §Y[IND.GetNameWithFlag]§! y construir nuevos puntos estratégicos en el sudeste asiático."
 POTEF300: "Doctrina Ibérica"
 POTEF300_desc: "Los países ibéricos tradicionalmente se han centrado en fuerzas marinas sólidas. Con la Doctrina de Marines, todos los estados miembros pueden adoptar esta tradición y tácticas."
 POTEF301: "Primos Latinos"
 POTEF301_desc: "La Federación Europea necesita mejorar su relación con las antiguas colonias en América del Sur."
 POTEF302: "México"
 POTEF302_desc: "La Federación Europea necesita mejorar su relación con la antigua colonia española §Y[MEX.GetNameWithFlag]§! y construir nuevos puntos estratégicos en América Central."
 POTEF303: "Gran Colombia"
 POTEF303_desc: "La Federación Europea necesita mejorar su relación con la antigua colonia española §Y[COL.GetNameWithFlag]§! y construir nuevos puntos estratégicos en América del Sur."
 POTEF304: "América Central"
 POTEF304_desc: "La Federación Europea necesita mejorar su relación con las antiguas colonias españolas en América Central y construir nuevos puntos estratégicos allí."
 POTEF305: "Cono Sur"
 POTEF305_desc: "La Federación Europea necesita mejorar su relación con las antiguas colonias españolas en el Cono Sur de América del Sur y construir nuevos puntos estratégicos allí."
 POTEF306: "Brasil"
 POTEF306_desc: "La Federación Europea necesita mejorar su relación con la antigua colonia portuguesa §Y[BRA.GetNameWithFlag]§! y construir nuevos puntos estratégicos en América del Sur."
 POTEF350: "Doctrina Británica"
 POTEF350_desc: "§YBritain§! traditionally focused on a strong Navy. With the Naval Doctrine all member states can adopt this tradition and tactics."
 POTEF351: "Safeguard el Atlántico Norte"
 POTEF351_desc: "Para asegurar la Libertad de los Mares y el comercio libre, la Federación Europea necesita controlar el Atlántico Norte."
 POTEF352: "Legado de la Commonwealth"
 POTEF352_desc: "La Federación Europea necesita honrar su Legado de la Commonwealth y mejorar su relación con las antiguas Dominaciones Británicas."
 POTEF353: "Canadá"
 POTEF353_desc: "La Federación Europea necesita honrar su Legado de la Commonwealth y mejorar su relación con la antigua Dominación Británica §Y[CAN.GetNameWithFlag]§! y construir nuevos puntos estratégicos allí."
 POTEF354: "Australia"
 POTEF354_desc: "La Federación Europea necesita honrar su Legado de la Commonwealth y mejorar su relación con la antigua Dominación Británica §Y[AST.GetNameWithFlag]§! y construir nuevos puntos estratégicos allí."
 POTEF355: "Nueva Zelanda"
 POTEF355_desc: "La Federación Europea necesita honrar su Legado de la Commonwealth y mejorar su relación con la antigua Dominación Británica §Y[NZL.GetNameWithFlag]§! y construir nuevos puntos estratégicos allí."
 POTEF356: "Safeguard el Mar del Norte"
 POTEF356_desc: "El Mar del Norte es el patio trasero de la Federación Europea y necesita ser asegurado."
 POTEF357: "Legado de Malasia"
 POTEF357_desc: "La Federación Europea necesita mejorar su relación con las antiguas colonias británicas de Malasia."
 POTEF358: "Malasia"
 POTEF358_desc: "La Federación Europea necesita mejorar su relación con la antigua colonia británica §Y[MAY.GetNameWithFlag]§! y construir nuevos puntos estratégicos en el sudeste asiático."
 POTEF359: "Singapur"
 POTEF359_desc: "La Federación Europea necesita mejorar su relación con la antigua colonia británica §Y[SIN.GetNameWithFlag]§! y construir nuevos puntos estratégicos en el sudeste asiático."
 POTEF360: "Garantizar Hong Kong"
 POTEF360_desc: "The European Federation needs to improve its relationship to the former British colony of §Y[HKG.GetNameWithFlag]§! and guarantee the freedom rights of the Sino-British Joint Declaration."
 POTEF400: "Doctrina Nórdica"
 POTEF400_desc: "The §YScandinavian countries§! traditionally focused on fighting in the Arctic. With the Nordic Doctrine all member states can adopt this tradition and tactics."
 POTEF401: "Safeguard el Ártico"
 POTEF401_desc: "Para asegurar la Libertad de los Mares y su posición geoestratégica, la Federación Europea necesita controlar el Ártico."
 POTEF450: "Doctrina Mediterránea"
 POTEF450_desc: "The §YMediterranean countries§! traditionally focused on naval invasion tactics. With the Amphibious Doctrine all member states can adopt this tradition and tactics."
 POTEF451: "África del Norte"
 POTEF451_desc: "Para crear una zona de convergencia y un puerto seguro para los refugiados, la Federación Europea necesita mejorar su relación con el §YÁfrica del Norte§! y construir nuevos puestos estratégicos allí."
 POTEF452: "Unificar Chipre"
 POTEF452_desc: "Como estado miembro soberano de la Federación Europea, §Y[CYP.GetNameWithFlag]§! necesita ser reunificado."
 POTEF500: "Doctrina de los Balcanes"
 POTEF500_desc: "The §YBalkan countries§! traditionally focused on Partisan forces. With the Partisan Doctrine all member states can adopt this tradition and tactics."
 POTEF501: "Infraestructura de los Balcanes"
 POTEF501_desc: "The European Federation needs to develop the infrastructure of the Balkans to preserve the regional peace and secure the Balkans from foreign influence."
 POTEF502: "Desafiar la Ruta de la Seda"
 POTEF502_desc: "La Federación Europea necesita desafiar la nueva Ruta de la Seda de China y reducir la influencia china en Asia Central."
 POTEF503: "Competidor China"
 POTEF503_desc: "§Y[CHI.GetNameWithFlag]§! has risen to one major competitor of the European Federation on global level. The European Federation needs to adapt its policies to this."
 POTEF504: "Operación Flecha"
 POTEF504_desc: "Nombrada en honor a la Guerra de las Flechas (Segunda Guerra Anglo-Chino), la Operación Flecha es un plan para una intervención europea en §Y[CHI.GetNameWithFlag]§! para detener la política expansionista china."
 POTEF505: "Aliados Asiáticos"
 POTEF505_desc: "Para enfrentar a §Y[CHI.GetNameWithFlag]§!, la Federación Europea necesita aliados en Asia."
 POTEF506: "República de Corea"
 POTEF506_desc: "§Y[KOR.GetNameWithFlag]§! and the European Federation are both threatened by the Chinese dragon. To deal with this threat both should ally."
 POTEF507: "Japón"
 POTEF507_desc: "§Y[JAP.GetNameWithFlag]§! and the European Federation are both threatened by the Chinese dragon. To deal with this threat both should ally."
 POTEF550: "Doctrina del Mar Negro"
 POTEF550_desc: "After the Cold War §Ythe Black Sea countries§! focused on mobile air defense forces to fit the new situation. With the Anti Air Doctrine all member states can adopt these tactics."
 POTEF551: "Safeguard del Mar Negro"
 POTEF551_desc: "The Black Sea is the connection of the European Federation to the Caucasus and its south eastern member states. Therefore it needs to be secured."
 POTEF552: "Reintegrar las Repúblicas Separatistas"
 POTEF552_desc: "§Y[SOV.GetNameWithFlag]§! ha violado la soberanía de varios estados miembros del este de la Federación Europea al apoyar movimientos separatistas y crear Repúblicas Separatistas. Necesitamos reintegrar a estos secuaces rusos."
 POTEF553: "Rivalidad con Rusia"
 POTEF553_desc: "§Y[SOV.GetNameWithFlag]§! se ha convertido en un importante rival de la Federación Europea. Necesitamos imponer sanciones a ellos."
 POTEF554: "Operación Carlomagno"
 POTEF554_desc: "Named after Charlemagne the legendary Emperor and so called 'Father of Europe' (Pater Europae), Operation Charlemagne is a plan for a pre-emptive self-defense against §Y[SOV.GetNameWithFlag]§!. With this operation the §YEDU§! can launch a pre-emptive invasion on §Y[SOV.GetNameWithFlag]§! to eliminate that threat to European sovereignty."
 POTEF600: "Doctrina del Cáucaso"
 POTEF600_desc: "After the Cold War the §Ycountries of the Caucasus region§! had focus on a strong defense to fit the new situation. With the Defense Doctrine all member states can adopt these tactics."
 POTEF601: "Acceso Europeo"
 POTEF601_desc: "The European Federation needs access to the Caucasus and its south eastern member states. Therefore new naval bases and infrastructure need to be built."
 POTEF650: "Doctrina de Visegrado"
 POTEF650_desc: "The §YVisegrad countries§! traditionally focused on strong Artillery forces. With the Artillery Doctrine all member states can adopt this tradition and tactics."
 POTEF651: "Red de Defensa Aérea Europea"
 POTEF651_desc: "La Federación Europea necesita construir una Red de Defensa Aérea para asegurar su flanco oriental."
 POTEF652: "Firewall Oriental"
 POTEF652_desc: "Es necesario contrarrestar la creciente influencia de §Y[SOV.GetNameWithFlag]§! en los Estados miembros del Oriental."
 POTEF700: "Doctrina Báltica"
 POTEF700_desc: "The §YBaltic countries§! traditionally focused on small and highly capable Special Forces. With the Special Forces Doctrine all member states can adopt this tradition and tactics."
 POTEF701: "Safeguard del Mar Báltico"
 POTEF701_desc: "The Baltic Sea is the inland sea of the European Federation and needs to be secured."
 POTEF800: "Pax Europaea"
 POTEF800_desc: "La Federación Europea necesita convertirse en la superpotencia global para garantizar la paz mundial."
 POTEF_pax_europaea: "Pax Europaea"
 POTEF_pax_europaea_desc: "The European Federation has become the global superpower and is maintaining world peace."
 EDU_major_non_EU_ally: "Aliado importante de la EDU fuera de la UE"
 EU_nato_legacy: "Legado de la OTAN"
 EU_nato_legacy_desc: "El tiempo de la OTAN ha pasado. Ahora es el momento de una nueva alianza europea. Sin embargo, mantendremos buenas relaciones con §Y[USA.GetNameWithFlag]§! e incluso se convertirán en un §YAliado importante de la EDU fuera de la UE§!."
 EU_mountain_warfare: "Doctrina Alpina"
 EU_mountain_warfare_desc: "The Alpine nations of §Y[AUS.GetNameWithFlag]§! and §Y[SWI.GetNameWithFlag]§! have a long tradition of mountain warfare. With the Alpine Doctrine all member states can adopt this tradition and tactics."
 EU_extensive_mountain_warfare: "Doctrina Alpina Extensiva"
 EU_extensive_mountain_warfare_desc: "The Alpine nations of §Y[AUS.GetNameWithFlag]§! and §Y[SWI.GetNameWithFlag]§! have a long tradition of mountain warfare. With the Alpine Doctrine all member states can adopt this tradition and tactics."
 POTEF_armoured_warfare: "Doctrina de Guerra Acorazada"
 POTEF_armoured_warfare_desc: "§Y[GER.GetNameWithFlag]§! traditionally focused on strong armoured forces. With the Armoured Doctrine all member states can adopt this tradition and tactics."
 POTEF_leopard_doctrine: "Doctrina Leopard"
 POTEF_leopard_doctrine_desc: "§Y[GER.GetNameWithFlag]§! traditionally focused on strong armoured forces. With the Leopard Doctrine all member states can adopt this tradition and tactics."
 EU_french_doctrine: "Doctrina de Guerra de Maniobra"
 EU_french_doctrine_desc: "§Y[FRA.GetNameWithFlag]§! traditionally focused on highly mobile light armored and motorized forces. With the Maneuver Warfare Doctrine all member states can adopt this tradition and tactics."
 EU_extensive_french_doctrine: "Doctrina de Fuerza Flexible"
 EU_extensive_french_doctrine_desc: "§Y[FRA.GetNameWithFlag]§! traditionally focused on highly mobile light armored and motorized forces. With the Flexible Force Doctrine all member states can adopt this tradition and tactics."
 POTEF_air_mobile_doctrine: "Doctrina de Movilidad Aérea"
 POTEF_air_mobile_doctrine_desc: "After the Cold War §Ythe Low Countries§! focused on air mobile forces to fit the new situation. With the Air Mobile Doctrine all member states can adopt these tactics."
 POTEF_airborne_doctrine: "Doctrina Aerotransportada"
 POTEF_airborne_doctrine_desc: "After the Cold War §Ythe Low Countries§! focused on air mobile forces to fit the new situation. With the Airborne Doctrine all member states can adopt these tactics."
 EU_nordic_doctrine: "Doctrina Nórdica"
 EU_nordic_doctrine_desc: "The §YScandinavian countries§! traditionally focused on fighting in the Arctic. With the Nordic Doctrine all member states can adopt this tradition and tactics."
 EU_extensive_nordic_doctrine: "Doctrina Nórdica Extensiva"
 EU_extensive_nordic_doctrine_desc: "The §YScandinavian countries§! traditionally focused on fighting in the Arctic. With the Nordic Doctrine all member states can adopt this tradition and tactics."
 POTEF_empire_of_trade: "Imperio del Comercio"
 POTEF_empire_of_trade_desc: "La Federación Europea es un Imperio del Comercio."
 POTEF_empire_of_trade_2: "Imperio Global del Comercio"
 POTEF_empire_of_trade_2_desc: "La Federación Europea es un Imperio Global del Comercio."
 POTEF_liberal_legacy: "Tradición Liberal"
 POTEF_liberal_legacy_desc: "La Federación Europea honra su Tradición Liberal."
 POTEF_liberal_legacy_2: "Legado Liberal"
 POTEF_liberal_legacy_2_desc: "La Federación Europea honra su Legado Liberal."
 POTEF_empire_of_freedom: "Imperio de la Libertad"
 POTEF_empire_of_freedom_desc: "La Federación Europea es un Imperio de la Libertad."
 POTEF_empire_of_freedom_2: "Imperio Global de la Libertad"
 POTEF_empire_of_freedom_2_desc: "La Federación Europea es un Imperio Global de la Libertad."
 POTEF_marine_doctrine: "Doctrina de Infantería de Marina"
 POTEF_marine_doctrine_desc: "The §YIberian countries§! traditionally focused on strong Marine forces. With the Marines Doctrine all member states can adopt this tradition and tactics."
 POTEF_extensive_marine_doctrine: "Doctrina Extensiva de Infantería de Marina"
 POTEF_extensive_marine_doctrine_desc: "The §YIberian countries§! traditionally focused on strong Marine forces. With the Marines Doctrine all member states can adopt this tradition and tactics."
 POTEF_partisan_doctrine: "Doctrina Partisana"
 POTEF_partisan_doctrine_desc: "The §YBalkan countries§! traditionally focused on Partisan forces. With the Partisan Doctrine all member states can adopt this tradition and tactics."
 POTEF_counter_insurgency_doctrine: "Doctrina de Contrainsurgencia"
 POTEF_counter_insurgency_doctrine_desc: "The §YBalkan countries§! traditionally focused on Partisan forces. With the Counter-insurgency Doctrine all member states can adopt this tradition and tactics."
 POTEF_anti_air_doctrine: "Doctrina Antiaérea"
 POTEF_anti_air_doctrine_desc: "After the Cold War §Ythe Black Sea countries§! focused on mobile air defense forces to fit the new situation. With the Anti Air Doctrine all member states can adopt these tactics."
 POTEF_extensive_anti_air_doctrine: "Doctrina de Defensa Antiaérea Móvil"
 POTEF_extensive_anti_air_doctrine_desc: "After the Cold War §Ythe Black Sea countries§! focused on mobile air defense forces to fit the new situation. With the Mobile Air Defense Doctrine all member states can adopt these tactics."
 POTEF_artillery_doctrine: "Doctrina de Artillería"
 POTEF_artillery_doctrine_desc: "The §YVisegrad countries§! traditionally focused on strong Artillery forces. With the Artillery Doctrine all member states can adopt this tradition and tactics."
 POTEF_extensive_artillery_doctrine: "Doctrina Extensiva de Artillería"
 POTEF_extensive_artillery_doctrine_desc: "The §YVisegrad countries§! traditionally focused on strong Artillery forces. With the Artillery Doctrine all member states can adopt this tradition and tactics."
 POTEF_defense_doctrine: "Doctrina de Defensa"
 POTEF_defense_doctrine_desc: "After the Cold War the §Ycountries of the Caucasus region§! had focus on a strong defense to fit the new situation. With the Defense Doctrine all member states can adopt these tactics."
 POTEF_extensive_defense_doctrine: "Doctrina Extensiva de Defensa"
 POTEF_extensive_defense_doctrine_desc: "After the Cold War the §Ycountries of the Caucasus region§! had focus on a strong defense to fit the new situation. With the Defense Doctrine all member states can adopt these tactics."
 POTEF_special_forces_doctrine: "Doctrina de Fuerzas Especiales"
 POTEF_special_forces_doctrine_desc: "The §YBaltic countries§! traditionally focused on small and highly capable Special Forces. With the Special Forces Doctrine all member states can adopt this tradition and tactics."
 POTEF_extensive_special_forces_doctrine: "Doctrina Extensiva de Fuerzas Especiales"
 POTEF_extensive_special_forces_doctrine_desc: "Los países bálticos tradicionalmente se han centrado en fuerzas especiales pequeñas y altamente capaces. Con la Doctrina Extensiva de Fuerzas Especiales, todos los estados miembros pueden adoptar esta tradición y tácticas."
 EU_POTEF_environmental_imperialism_decision: "Exigir Reformas Ambientales"
 EU_POTEF_environmental_imperialism_decision_desc: "Necesitamos salvar el planeta. Si §Y[FROM.GetNameWithFlag]§! no hace las §GEformas ambientales§! necesarias por sí mismo, debemos obligarlo a que lo haga. Debe tener al menos una §YRefinería de biocombustibles§! por cada estado que posea. Si §Y[FROM.GetNameWithFlag]§! no cumple con nuestras demandas en el plazo de un mes, le impondremos §REncuencias ambientales§!."
 EU_POTEF_environmental_imperialism_mission: "Reformas Ambientales"
 EU_POTEF_environmental_imperialism_mission_desc: "§YEuropa§! nos exige §GReformas Ambientales§! para salvar el planeta. Si no construimos o reconstruimos al menos una §YRefinería de Biocombustible§! por cada estado que poseamos en un mes, impondrán §RSanciones Ambientales§! sobre nosotros."
 EU_POTEF_environmental_imperialism_restructure_industry_decision: "Reconstrucción de Energía Verde"
 EU_POTEF_environmental_imperialism_restructure_industry_decision_desc: "To fulfil the European §GEnvironmental Reform§! demands we need to reconstruct some of our §YCivilian Industry§! to renewable energy producer (§YBiofuel Refinery§!)."
 EU_POTEF_break_environmental_sanctions_decision: "Romper las Sanciones Ambientales"
 EU_POTEF_break_environmental_sanctions_decision_desc: "Europe has imposed Environmental Sanctions on us. We need to break them with all means - political and military. But this will give [FROM.GetNameWithFlag] a war goal on us. So we need to ally with other countries sanctioned by [FROM.GetNameWithFlag]."
 EU_POTEF_call_all_major_non_EU_ally: "Llamar a todos los principales aliados no pertenecientes a la UE de la EDU"
 EU_POTEF_call_all_major_non_EU_ally_desc: "La EDU está siendo atacada. Es hora de activar la alianza defensiva y llamar a todos los aliados no pertenecientes a la UE de la EDU."
 EU_POTEF_call_major_non_EU_ally: "Llamar a [FROM.GetName] a unirse a la EDU"
 EU_POTEF_call_major_non_EU_ally_desc: "Llamar al principal aliado no perteneciente a la UE de la EDU, §Y[FROM.GetNameWithFlag]§!."
 focus_POTEF301_effect_tt: "Cada miembro de la Unión Europea mejorará la opinión en +25§! con todos los países latinoamericanos.\n"
 focus_POTEF502_effect_tt: "Cada miembro de la Unión Europea mejorará la opinión en +30§! con los siguientes países: [KAZ.GetNameWithFlag], [KYR.GetNameWithFlag], [TAJ.GetNameWithFlag], [UZB.GetNameWithFlag], [TRK.GetNameWithFlag], [PER.GetNameWithFlag], [TUR.GetNameWithFlag], [GRE.GetNameWithFlag].\nAdemás, la influencia de [CHI.GetFlag][CHI.GetAdjective] se reducirá en esos países.\n"
