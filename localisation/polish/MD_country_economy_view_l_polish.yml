 GDP_TOTAL: "PKB"
 GDP_TOTAL_DESC: "Nasz §YProdukt Krajowy Brutto§! (PKB) stanowi miarę wartości wszystkich towarów i usług wytworzonych w kraju. W modzie Millennium Dawn wykorzystuje się PKB skorygowany o parytet siły nabywczej (PPP), ponieważ wskaźnik ten uwzględnia lokalne warunki gospodarcze, co czyni porównania między państwami bardziej użytecznymi."
 NUM_GDP_TOTAL: "$$§Y[?ROOT.gdp_total|1]§!mld"
 NUM_GDP_TOTAL_DESC: "Nasze §YPKB§! wynosi aktualnie §Y[?ROOT.gdp_total|3] $§! miliardów.\n\nOstatnie §Ykwartalne tempo wzrostu PKB§!: [?last_quarter_gdp_growth_rate|%Y]. \n\nWskazówka: Im wyższe jest Twoje §Ykwartalne tempo wzrostu PKB§!, tym większe prawdopodobieństwo wystąpienia pozytywnych wydarzeń gospodarczych."
 NUM_GDP_TOTAL_DELAYED_DESC: "Przybliżony udział poszczególnych branż w procentach:\n§PFabryki cywilne§!: [?ROOT.civil_fac_percent|%]\n§OFabryki wojskowe§!: [?ROOT.military_factory_total_percent|%]\n§BStocznie marynarki wojennej§!: [?ROOT.naval_factory_total_percent|%]\n§CKompleksy biurowe§!: [?ROOT.office_fac_percent|%]\n§GRolnictwo niekomercyjne§!: [?ROOT.agriculture_percent|%]\n§YObszary rolnictwa skomercjalizowanego§!: [?ROOT.agriculture_district_fac_percent|%]\n§YZakłady produkcji mikrochipów§!: [?ROOT.microchip_plant_percent|%]\n§YZakłady produkcji kompozytów§!: [?ROOT.composite_plant_percent|%]\n§YRafinerie syntetyczne§!: [?ROOT.synthetic_refinery_percent|%]\n§GPozyskiwanie zasobów§!: [?ROOT.resources_percent|%]\n§YInfrastruktura§!: [?ROOT.infrastructure_gdp_percent|%]\n§POpieka zdrowotna§!: [?ROOT.healthcare_gdp_percent|%]\n"
 GDP_PER_CAPITA: "PKB na mieszkańca"
 GDP_PER_CAPITA_DESC: "Liczba ta oznacza nasz §YPKB na mieszkańca§!. Odzwierciedla ona wartość produkcji przypadającą na każdą osobę w kraju.\n\nOstatni §Ykwartalny wskaźnik wzrostu PKB/C§!: [?last_quarter_gdpc_growth_rate|%Y].\n\n Wskazówka: Im wyższe jest Twoje §Ykwartalne tempo wzrostu PKB na mieszkańca§!, tym większe prawdopodobieństwo wystąpienia pozytywnych zdarzeń gospodarczych; jednocześnie, jeśli nie podejmie się odpowiednich działań, §Rinflacja§! może wzrosnąć do wyższego poziomu."
 GDP_PER_CAPITA_DELAYED_DESC: "Obecny wpływ §YPKB na mieszkańca§! w naszym kraju:\nSzybkość budowy: [?production_speed_buildings_factor_gdp_modifier|%+]\nMMiesięczna populacja: [?monthly_population_gdp_modifier|%+1]\nSzybkość Badań: [?research_speed_factor_gdp_modifier|%+]\nStabilność: [?stability_factor_gdp_modifier|%+]\nCałkowita siła robocza: [?total_workforce_gdp_c_modifier_var|%+]\nTempo budowy elektrowni opalanej paliwami kopalnymi: [?fossil_pp_construction_gdp_c_modifier_var|%+]\n"
 NUM_GDP_PER_CAPITA: "$$§Y[?ROOT.gdp_per_capita|3]§!k"
 NUM_GDP_PER_CAPITA_DESC: "Nasze §YPKB/mieszkańca§! aktualnie wynosi $§Y[?ROOT.gdp_per_capita|3]§! tysięcy dolarów"
 PRODUCTIVITY: "Produktywność"
 PRODUCTIVITY_DESC: "Liczba ta reprezentuje §YProduktywność§! naszego kraju."
 NUM_PRODUCTIVITY_DELAYED_DESC: "§YMiesięczny wzrost przed korektami państwowymi:§! [?productivity_growth_scaled|3+]\n\n§YBazowy wzrost produktywności:§!\nPrawo, duch narodowy i technologie: [?modifier@productivity_growth_modifier|3+]\n Z uwzględnieniem podatków od osób prawnych: [?productivity_growth_modifier_from_corporate_tax|3+][literacy_productivity_tooltip]\n\n§Y Współczynnik wzrostu krajowego: §!\nPrawo, duch narodowy i technologie: [?modifier@country_productivity_growth_modifier|%+1]\n Z uwzględnieniem inflacji: [?inflation_rate_prod_var|%+1]\n\nMiesięczny wzrost = bazowy wzrost produktywności × 0,5 × (1 + krajowy modyfikator wzrostu). Mnożnik krajowy jest ograniczony do przedziału 0–100. Następnie każdy stan uwzględnia własną korektę produktywności w skali światowej oraz lokalny modyfikator wzrostu.\n\nWpływ produktywności:\n§YPKB: §![?productivity_tax_effect_display|%+1]\n§YProdukcja fabryczna:§![?productivity_tax_effect_display|%+1]\n§YProdukcja stoczniowa: §![?productivity_tax_effect_display|%+1]\n§YSzybkość budowy: §![?productivity_tax_effect_display|%+1]\n§Y Podatek od osób prawnych:§![?productivity_tax_effect_display|%+1]\n§Y£construction_speed_texticon §YObszary rolnictwa skomercjalizowanego§! i szybkość budowy: §![?agriculture_district_output_var|%+1] "
 NUM_PRODUCTIVITY: "§Y[?ROOT.overall_productivity|3]§!"
 NUM_PRODUCTIVITY_DESC: "Wskaźnik §Yproduktywności§! określa, jak efektywnie przekształcamy zasoby w dobra i usługi dla ludności, wpływając na poziom PKB, wpływy z podatku od osób prawnych oraz wielkość produkcji przemysłowej. Wyższa produktywność oznacza większą efektywność, jednak tempo wzrostu spada, gdy państwa osiągają wyniki powyżej średniej światowej, podczas gdy kraje o niższej produktywności szybciej nadrabiają zaległości.\n\n§YŚrednia światowa:§! [?global.average_world_productivity|3]\n§YNasza Produktywność: §![?ROOT.overall_productivity|3]\n"
 INFLATION: "Inflacja"
 INFLATION_DESC: "Liczba ta odzwierciedla §Y inflację §! w naszym kraju."
 NUM_INFLATION: "§Y[?ROOT.inflation_rate_var|%]§!"
 NUM_INFLATION_DESC: "§YInflation§! is how fast prices are rising. High inflation raises government costs and lowers factory output. The §YInflation Impact on Economy§! national spirit shows all of its effects, including §YDeflation§! when the rate is negative.\n\nIt updates every quarter. The rate shown is the average of the last 4 quarters and moves at most 10% per quarter. Easier difficulty settings slow its rise.\n\n§YWhat moves it:§!\n- §YGDP/C§! growth: fast growth raises it, a shrinking economy lowers it\n- §YTax Rate§!: a higher rate lowers it\n- §YPolicy Rate§!: a higher rate lowers it, but raises §RInterest on Debt§!\n- §YEconomic Cycle§!: above §YStable Growth§! raises it, below lowers it\n- §YBudget§!: large deficits raise it, more so with high debt. A surplus lowers it.\n- §YPrint Money§! raises it\n- A weakening currency raises it, more so if we import resources\n- High inflation partly carries into the next quarter\n\n§YCurrency Strength:§! [currency_strength_display]\n§Y1.00§! is normal. It updates monthly and stays between §Y0.15§! and §Y2.00§!. Easier difficulty settings raise the minimum. A weak currency raises government costs and boosts resource export earnings. If our §YReserve Currency Policy§! uses a foreign currency, it also makes our debt more expensive. A strong currency does the reverse.\n\n§YWhat moves it:§!\n- §YPolicy Rate§!: above inflation strengthens it, below weakens it\n- §YStability§!: above 50% strengthens it, below weakens it\n- §YEconomic Cycle§!: above §YStable Growth§! strengthens it, below weakens it\n- An §YInterest Rate§! above 5% from debt or §YWorld Tension§! weakens it\n- Losing a war (over 10% surrender progress), civil war, §YInternational Sanctions§!, or a financial collapse in the last 3 years weakens it\n- If we issue a reserve currency, each country using it strengthens it\n- §YWorld Tension§! above 50% strengthens the Dollar, Yen, and Swiss Franc\n\nOver time it drifts back toward its long-run level. Gold, Silver, and Bimetallic §YCurrency Backing§! pull a weak currency back up toward §Y1.00§!, and Gold also pulls one above §Y1.05§! back down."
 NUM_INFLATION_DELAYED_DESC: "§YLast 4 Quarters:§! [?ROOT.year_quarter_inflation_tracker^0|%] · [?ROOT.year_quarter_inflation_tracker^1|%] · [?ROOT.year_quarter_inflation_tracker^2|%] · [?ROOT.year_quarter_inflation_tracker^3|%]\n\nThe rate shown is the average of these four quarters, and it drives every inflation effect."
 POPULATION_TAX_RATE: "Podatek od osób fizycznych"
 POPULATION_TAX_RATE_TT: "§YExpected rate: [?expected_population_tax_rate|0]%§!\nThe rate the public accepts without pushback. It rises as our GDP per capita grows.\n• Raising the rate past both this and any higher rate we recently cut from costs §R2%§! £stability_texticon §YStability§! per point for a while.\n• Lowering it below both this and any lower rate we recently raised from gives §G0.5%§! £stability_texticon §YStability§! per point for a while.\n• Moving toward it adds no transition penalty, but a raise first takes back any recent cut bonus.\nSee §YPolicy Transition Costs§! in our national spirits.\n\nPopulation Tax Rate includes all of the taxes imposed on the public. This can include but is not limited to income tax, VAT taxes, sales tax, and property taxes.\n\n§YModifiers from Population Taxes:§!\n£stability_texticon  Stability: [?stability_factor_from_population_tax|%+]"
 CORPORATE_TAX_RATE: "Podatek od osób prawnych"
 CORPORATE_TAX_RATE_TT: "§YExpected rate: [?expected_corporate_tax_rate|0]%§!\nThe rate business accepts without pushback. It rises as our GDP per capita grows and follows the economic cycle: lower in §YStagnation§!, §YRecession§! or §YDepression§!, higher in §YFast Growth§! or an §YEconomic Boom§!.\n• Raising the rate past both this and any higher rate we recently cut from costs §R1.2%§! £stability_texticon §YStability§! per point for a while.\n• Lowering it below both this and any lower rate we recently raised from gives §G0.01§! §YMonthly Productivity Growth§! and makes §YForeign Investment§! in our country §G2%§! cheaper per point for a while.\n• Moving toward it adds no transition penalty, but a raise first takes back any recent cut bonus.\nSee §YPolicy Transition Costs§! in our national spirits.\n\nCorporate Tax Rate includes all of the taxes imposed on corporations. The value consists of corporate income taxes, employer taxes, and more.\n\n§YModifiers from Corporate Taxes:§!\n£consumer_goods_texticon  Tax Cost: [?consumer_goods_from_corporate_tax|%Y]\n£receiving_investment_cost_modifier_texticon §YReceiving Foreign Investment§! Cost Modifier: [?receiving_investment_cost_form_corporate_tax|%-]\nMonthly Productivity Growth: [?productivity_growth_modifier_from_corporate_tax|+3]\n"
 CB_POLICY_RATE: "Stopa referencyjna"
 CB_POLICY_RATE_TT: "§YCentral Bank Policy Rate§! (stopa procentowa banku centralnego) to referencyjna stopa procentowa ustalana przez bank centralny. Określa ona koszt zaciągania kredytów w całej gospodarce.\n\n§YPodniesienie stopy procentowej§! ogranicza podaż pieniądza, tłumiąc inflację, ale zwiększając koszt długu publicznego i spowalniając aktywność gospodarczą.\n§YObniżenie stopy procentowej§! stymuluje pożyczki i inwestycje, ale pozwala na swobodniejszy wzrost inflacji. Ujemne stopy procentowe zapewniają dodatkowy impuls inflacyjny w okresie deflacji.\nKażdy punkt procentowy stopy procentowej powyżej zera ogranicza zakres, w jakim inflacja przenosi się na kolejny kwartał – niezależnie od tego, jak wysoki jest jej poziom. Przy stopach procentowych na poziomie 0% lub niższym, efekt przeniesienia utrzymuje się na swoim maksymalnym pułapie, wynoszącym 90%. Jeśli deficyt budżetowy przekracza poziom możliwy do utrzymania, redukcja wynikająca z każdego punktu procentowego stopy procentowej może zostać zmniejszona nawet o połowę.\nStopa procentowa przewyższająca inflację o ponad 1 pkt proc. sprzyja §YUmocnieniu waluty§!, natomiast niższa stopa prowadzi do jej osłabienia. W sytuacji, gdy inflacja znacząco przewyższa stopę procentową, każdy punkt procentowy różnicy wciąż łagodzi miesięczny spadek wartości waluty.\n\nKażda korekta kosztuje §Y25§! £pol_power_icon i ma §Y30dniowy§! czas odnowienia.\n\n§Y Aktualny kurs: §![?cb_policy_rate]%\n§Y Przeniesienie inflacji: §! Positive rate points cut the carryover share by 2.5pp each quarte\n§Y Premia z tytułu odsetek od zadłużenia: §![?cb_policy_rate|+0]% × 0.33pp dodane do §Ystopy procentowej§!."
