 COMSAT9: "COMSAT 2045"
 COMSAT9_desc: "Satélite artificial que retransmite y amplifica señales de radiotelecomunicación a través de un transpondedor. Esto crea un canal de comunicación entre un transmisor de origen y un receptor en diferentes ubicaciones de la Tierra.\n\nSatélite de comunicaciones (COMSAT 2045):\nEl satélite §Y$COMSAT9$§! es un satélite de comunicaciones con un ancho de banda de §Y25 Gbit/s§!. Son necesarios para un sistema de satélites de comunicaciones de 25 Gbit/s."
 COMSAT10: "COMSAT 2055"
 COMSAT10_desc: "Satélite artificial que retransmite y amplifica señales de radiotelecomunicación a través de un transpondedor. Esto crea un canal de comunicación entre un transmisor de origen y un receptor en diferentes ubicaciones de la Tierra.\n\nSatélite de comunicaciones (COMSAT 2055):\nEl satélite §Y$COMSAT10$§! es un satélite de comunicaciones con un ancho de banda de §Y100 Gbit/s§!. Son necesarios para un sistema de satélites de comunicaciones de 100 Gbit/s."
