 ENG_prince_charles_trait: "Príncipe de Gales"
 ENG_charles_1_idea: "Príncipe de Gales"
 ENG_charles_1_idea_desc: "Carlos recibió el título de príncipe de Gales como heredero aparente del Reino Unido. Este título, concedido mediante cartas patentes y formalizado mediante una investidura oficial, significaba su estatus primordial como sucesor de la Corona y su vínculo permanente con Gales y los demás reinos."
 ENG_prince_andrew: "Andrés"
 ENG_prince_andrew_trait: "Duque de York"
 ENG_andrew_1_idea: "Comandante de la Marina Real"
 ENG_andrew_1_idea_desc: "Como comandante de la Marina Real, Andrés sirvió con distinción en la flota británica, incluyendo funciones como piloto de helicóptero y comandante de buque. Esto refleja su largo servicio activo y liderazgo en operaciones marítimas, y significa su profunda conexión con el patrimonio naval del Reino Unido."
 ENG_andrew_3_idea: "Duque de York"
 ENG_andrew_3_idea_desc: "El título de duque de York le fue otorgado a Andrés como muestra de su estatus de miembro de alto rango de la realeza y segundo hijo del soberano. Concedido tradicionalmente a los hijos varones más jóvenes del monarca, conlleva un prestigio histórico y longevas asociaciones con el servicio real y el deber público."
 ENG_princess_anne: "Ana"
 ENG_princess_anne_trait: "Princesa Real"
 ENG_princess_anne_leader_name: "$ENG_princess_anne_trait$ Princesa $ENG_princess_anne$"
 ENG_anne_1_idea: "Princesa Real"
 ENG_anne_1_idea_desc: "El título de princesa real lo ostenta Ana como muestra de veteranía y servicio excepcional dentro de la familia real. Concedido tradicionalmente por el soberano a su hija mayor, no es automático y se otorga únicamente como un honor personal. Conlleva un prestigio histórico y señala la expectativa vitalicia de un deber visible y un compromiso inquebrantable con la Corona."
 ENG_princess_anne_naval_trait: "Comandante en jefe de las Mujeres en la Marina Real"
 ENG_princess_anne_army_trait: "Coronel de los King's Royal Hussars"
 ENG_prince_edward: "Eduardo"
 ENG_prince_edward_trait: "Conde de Wessex"
 ENG_edward_1_idea: "Conde de Wessex"
 ENG_edward_1_idea_desc: "El título de conde de Wessex le fue concedido a Eduardo como una distinción real de alto rango vinculada al servicio y a la responsabilidad pública. Inspirado en un antiguo nombre inglés de profunda resonancia histórica, conlleva prestigio sin implicar autoridad constitucional. In la Gran Bretaña moderna funciona como una plataforma para el patronazgo, la representación y el apoyo constante al trabajo público de la monarquía."
 ENG_prince_phillip: "Felipe"
 ENG_prince_phillip_trait: "Duque de Edimburgo"
 ENG_phillip_1_idea: "Duque de Edimburgo"
 ENG_phillip_1_idea_desc: "El título de duque de Edimburgo lo ostentó el príncipe Felipe como muestra definitoria de su papel al lado de la soberana y toda una vida de servicio al reino. Otorgado con motivo de su matrimonio con la princesa Isabel, combinaba el prestigio histórico con una identidad moderna construida sobre el deber, la disciplina y el apoyo institucional. En la vida pública quedó estrechamente asociado a sus patronazgos y al trabajo práctico que sostuvo a la monarquía a través de las generaciones."
 ENG_prince_william: "Guillermo"
 ENG_prince_william_trait: "Duque de Cambridge"
 ENG_prince_william_leader_name: "$ENG_prince_william_trait$ Príncipe $ENG_prince_william$"
 ENG_william_1_idea: "Duque de Cambridge"
 ENG_william_1_idea_desc: "El título de duque de Cambridge le fue concedido al príncipe Guillermo como una distinción real de alto rango que marcaba su papel como figura destacada de la próxima generación. Otorgado tradicionalmente por el soberano a miembros prominentes de la familia real, conlleva prestigio y la clara expectativa de representación nacional y deber público. En la Gran Bretaña moderna sirve como plataforma para el patronazgo, el servicio y la preparación constante de un heredero para sus futuras responsabilidades."
