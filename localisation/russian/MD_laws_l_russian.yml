 migration_laws: "Миграционные законы"
 open_borders: "Открытые границы"
 open_borders_desc: "Открытые границы означают очень мягкое или вовсе отсутствующее миграционное законодательство. Люди могут практически свободно въезжать в страну и покидать её."
 open_borders_tt: "\nНа миграционный контроль тратится $$[?THIS.array_border_control_spend^0] §Hмлрд§!.\n$current_migration_rate$"
 slightly_regulated_immigration: "Слабо регулируемая миграция"
 slightly_regulated_immigration_desc: "Введение некоторых мягких ограничений на перемещение людей в страну и из неё должно помочь остановить приток нежелательных мигрантов на основании предыдущих уголовных обвинений или иных причин."
 slightly_regulated_immigration_tt: "\nНа миграционный контроль тратится $$[?THIS.array_border_control_spend^1] §Hмлрд§!.\n$current_migration_rate$"
 regulated_immigration: "Регулируемая миграция"
 regulated_immigration_desc: "Установление таких правил, как ограничение количества мигрантов, требование об отсутствии судимости, упрощённые визы и прочее, будет необходимо для создания здравого подхода к миграционным законам."
 regulated_immigration_tt: "\nНа миграционный контроль тратится $$[?THIS.array_border_control_spend^2] §Hмлрд§!.\n$current_migration_rate$"
 heavily_regulated_immigration: "Жёстко регулируемая миграция"
 heavily_regulated_immigration_desc: "Введение жёстких правил, ограничивающих количество мигрантов, строгих и труднодостижимых виз, создание агентств для обеспечения соблюдения этих правил и борьба со всеми формами незаконной миграции."
 heavily_regulated_immigration_tt: "\nНа миграционный контроль тратится $$[?THIS.array_border_control_spend^3] §Hмлрд§!.\n$current_migration_rate$"
 closed_borders: "Закрытые границы"
 closed_borders_desc: "Мы должны закрыть наши границы, чтобы сохранить самобытность нации."
 closed_borders_tt: "\nНа миграционный контроль тратится $$[?THIS.array_border_control_spend^4] §Hмлрд§!.\n$current_migration_rate$"
 current_migration_rate: "\nМаксимальный §Yуровень миграции§!: [?max_net_immigration_rate|%]\nТекущий чистый §Yуровень миграции§!: [?net_immigration_rate|%]"
 nuclear_power_off: "Ядерная мощь (наступательная)"
 nuclear_power_off_desc: "Ядерная держава, чей ядерный статус позволяет ей наносить ядерные удары по силам противника независимо от стратегической ситуации."
 nuclear_power_def: "Ядерная мощь (оборонительная)"
 nuclear_power_def_desc: "Ядерная держава, чей ядерный статус позволяет наносить ядерные удары только в том случае, если она проигрывает войну."
 non_nuclear_power: "Безъядерная держава"
 non_nuclear_power_desc: "Страна, у которой нет ядерного оружия или ядерной энергетики."
 nuclear_energy: "Ядерная энергетика"
 nuclear_energy_desc: "Страна, у которой нет ядерного оружия, но которая использует атомные электростанции как часть своей энергетической инфраструктуры."
 no_use_case: "Безъядерный статус"
 no_use_case_desc: "Страна, не обладающая ядерным оружием, или страна, которая решила никогда не использовать своё ядерное оружие, независимо от ситуации."
 full_first_use: "Первый удар без ограничений"
 full_first_use_desc: "Страна, которая решила, что может в любой момент нанести тактический или стратегический ядерный удар."
 tac_first_use_strat_retaliation: "Тактический первый удар, стратегический — ответный"
 tac_first_use_strat_retaliation_desc: "Страна может первой применять тактическое ядерное оружие, а стратегическое — только в качестве ответного удара."
 tac_and_strat_retaliation: "Только ответный удар (тактический и стратегический)"
 tac_and_strat_retaliation_desc: "Страна, способная наносить как тактические, так и стратегические ядерные удары только в качестве ответного удара."
 strategic_retaliation_only: "Только стратегический ответный удар"
 strategic_retaliation_only_desc: "Страна, способная наносить только стратегические удары возмездия."
