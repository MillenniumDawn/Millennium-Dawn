 bos_civil_war_info_tool_tip: "§R참고§!\n일부 중점은 내전이 끝날 때까지 잠깁니다.\n전쟁이 끝나면 사건이 발생하여 다시 잠금이 해제됩니다."
 bos_civil_war_srpska_info_tool_tip: "§R참고§!\n일부 중점은 내전이 끝날 때까지 잠깁니다.\n전쟁이 끝나면 사건이 발생하여 다시 잠금이 해제됩니다.\n(스릅스카로 플레이할 경우)"
