 naval_proliferation_mandate_ast: "해군 확충 권한"
 support_doctrine_ast: "지원 교리"
 support_doctrine_ast_desc: "태평양에서 우리의 역할은 궁극적으로 무역을 감시하고 지원함으로써 동맹국을 뒷받침하는 것이며, 일촉즉발의 상황에 특화되어 있습니다."
 dominance_doctrine_ast: "지배 교리"
 dominance_doctrine_ast_desc: "태평양에서 우리의 역할은 해군 우위를 점하는 것입니다. 이를 통해 우리의 사명이 수행되며, 해상에서 휘두르는 힘이 이를 뒷받침합니다."
 naval_contractor_grants_ast: "거부 교리"
 adf_academies_idea_ast: "ADF 사관학교"
 pacific_aerial_guard_ast: "태평양 항공 방위대"
 cockatoo_island_investment_ast: "코카투 섬 투자"
 tour_the_roulettes: "룰렛 에어로바틱 팀 순회"
 the_roulettes_tt: "룰렛 에어로바틱 팀 순회 선택지가 §2군사 결정§! 탭에서 사용 가능해집니다."
 john_howard_desc: "존 하워드는 구 자유당의 마지막 보루로 서 있습니다. 로버트 멘지스의 제자이자 중도우파의 부상을 지지한 인물인 하워드의 정책은 당을 중산층 쪽으로 이끌었습니다. 그는 개인의 자유, 주택 소유, 자유 기업을 우선시하여 커져 가는 노조 활동의 물결을 막고 10년간의 무의미에서 당을 되살려 냈습니다. \n\n자유당에 입당하기 전 상업 변호사였던 하워드는 청년 자유당 의장에서 출발해 승진을 거듭했고, 1974년 베넬롱 지역구 의원이 되었습니다. 이는 그를 의회 정치의 세계로 끌어들였습니다. 이듬해 곧바로 프레이저 정부의 영입을 받아 기업·소비자부 장관에 임명되었습니다. \n\n순조로운 승진과 경제 분야에서 쌓아 온 전문성으로 하워드는 거의 75년 만의 최연소 재무장관이 되었습니다. 자유 시장의 옹호자였던 그는 낡은 경제 체제를 개혁하려 했으나 약화되는 경제에 가로막혔고, 그 결과 1980년대 불황으로 자유당은 정권을 잃었습니다. \n\n이후 10년간 당내 그의 입지는 요동쳤는데, 이는 여러 차례의 쿠데타와 이중 쿠데타, 그리고 하워드의 실패한 선거 도전으로 쉽게 요약됩니다. 마침내 1996년 하워드에게 기회가 왔고, 그는 재정 적자를 줄이고 오스트레일리아를 경기 침체에서 구해 내겠다는 공약으로 현직 폴 키팅을 상대로 압승을 거두었습니다. 그 공약은 지금도 갈피를 잡지 못한 채 표류하고 있습니다."
 sydney_declaration_idea_ast: "시드니 선언"
 AST_MOD_MILLENNIUM_DAWN_DESC: "세기가 바뀌면서 오스트레일리아는 80년대 이후 처음으로 경제 번영의 조짐을 보이고 있습니다. 진보적 경제 정책과 어중간한 인기로 알려진 존 하워드 총리가 키를 잡은 가운데, 이 나라는 짧은 기간에 이미 큰 변화를 겪었습니다. 시드니 올림픽을 앞두고 문화적 문턱에 선 오스트레일리아는, 굳건한 손길이 이끌어 준다면 위대함을 이룰 태세입니다. \n\n그러나 진전에도 불구하고 불만이 커지고 있습니다. 정부가 수년간 원주민 공동체의 고통을 해소하지 않고 방치한 탓에 곪아 터졌고, 정체된 개혁에 대한 분노가 계속 번지고 있습니다. 자원 산업의 지배력 또한 커져 오스트레일리아 경제는 석유 국가에 가까워지는 지경에 이르렀으며, 나라는 매우 위태로운 상태에 놓여 있습니다."
 mining_industrialists_ast: "광업 산업가"
 mining_industrialists_ast_desc: "보이지 않는 손이 수십 년째 오스트레일리아 정치와 산업에 개입해 왔습니다. 이들에 대한 입법은 언제나 허탕으로 끝나는 듯하며, 우리 경제의 방향은 광업 대기업에 유리할 때만 성공을 거두어 왔습니다. 로비를 통해서든 언론을 통해서든, 결국 이들은 항상 승자가 됩니다."
 ast_rail_tt: "철도 프로젝트가 취소됩니다."
