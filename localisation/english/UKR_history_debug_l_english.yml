l_english:

 UKRH_debug_tick: "Debug: run the weekly history check now"
 UKRH_debug_tick_desc: "Runs UKR_history_check immediately instead of waiting for the weekly tick. Dates and preconditions still apply, so this only fires what is genuinely due."
 UKRH_debug_year_2000: "Debug: fire all 2000 events"
 UKRH_debug_year_2000_desc: "Queues every historical event dated 2000, one per day, ignoring dates and preconditions. 3 events: The Disappearance of Georgiy Gongadze, The Cassette Scandal, Ukraine Without Kuchma"
 UKRH_debug_year_2001: "Debug: fire all 2001 events"
 UKRH_debug_year_2001_desc: "Queues every historical event dated 2001, one per day, ignoring dates and preconditions. 4 events: The Clashes on Bankova Street, The Rada Dismisses the Yushchenko Government, Yushchenko Announces a Bloc, For United Ukraine!"
 UKRH_debug_year_2002: "Debug: fire all 2002 events"
 UKRH_debug_year_2002_desc: "Queues every historical event dated 2002, one per day, ignoring dates and preconditions. 4 events: The 2002 Parliamentary Election, Lytvyn Elected Speaker, For United Ukraine Dissolves, Rise Up, Ukraine!"
 UKRH_debug_year_2003: "Debug: fire all 2003 events"
 UKRH_debug_year_2003_desc: "Queues every historical event dated 2003, one per day, ignoring dates and preconditions. 5 events: The Death of Slava Stetsko, Yanukovych Takes the Party of Regions, Tarasyuk Takes the People's Movement, The Single Economic Space, The Court Opens the Door to a Third Term"
 UKRH_debug_year_2004: "Debug: fire all 2004 events"
 UKRH_debug_year_2004_desc: "Queues every historical event dated 2004, one per day, ignoring dates and preconditions. 11 events: The Social-National Party Becomes Svoboda, The Political Reform Fails by Six Votes, Lytvyn Takes the Agrarians, The Force of the People, Yushchenko Expels Tyahnybok, The Poisoning, The First Round, The Rada Declares the Run-off Invalid, Tihipko Walks Out of the Campaign, The Supreme Court Annuls the Run-off, Law 2222 — The Package Vote"
 UKRH_debug_year_2005: "Debug: fire all 2005 events"
 UKRH_debug_year_2005_desc: "Queues every historical event dated 2005, one per day, ignoring dates and preconditions. 3 events: Our Ukraine Becomes a Party, The Orange Camp Breaks, The Memorandum With Yanukovych"
 UKRH_debug_year_2006: "Debug: fire all 2006 events"
 UKRH_debug_year_2006_desc: "Queues every historical event dated 2006, one per day, ignoring dates and preconditions. 6 events: The 2006 Parliamentary Election, The Coalition of Democratic Forces, Moroz Takes the Chair, The Universal of National Unity, Our Ukraine Goes Into Opposition, Reforms and Order Joins the Tymoshenko Bloc"
 UKRH_debug_year_2007: "Debug: fire all 2007 events"
 UKRH_debug_year_2007_desc: "Queues every historical event dated 2007, one per day, ignoring dates and preconditions. 9 events: The Coalition Buys Its Majority, The President Dissolves the Rada, Our Ukraine - People's Self-Defence, The Lytvyn Bloc, The Congress of Ukrainian Nationalists Stands Down, Medvedchuk Steps Back, The Snap Election, The Orange Coalition, Again, Tymoshenko Returns to the Cabinet"
 UKRH_debug_year_2008: "Debug: fire all 2008 events"
 UKRH_debug_year_2008_desc: "Queues every historical event dated 2008, one per day, ignoring dates and preconditions. 6 events: Baloha Builds United Centre, The Coalition Is Declared Dead, The Election That Never Happened, The Crisis Arrives, The President Takes His Party, The Coalition With Lytvyn"
 UKRH_debug_year_2009: "Debug: fire all 2009 events"
 UKRH_debug_year_2009_desc: "Queues every historical event dated 2009, one per day, ignoring dates and preconditions. 4 events: The Gas War, Svoboda Wins Ternopil, The Worst Year, Tihipko Comes Back"
 UKRH_debug_year_2010: "Debug: fire all 2010 events"
 UKRH_debug_year_2010_desc: "Queues every historical event dated 2010, one per day, ignoring dates and preconditions. 7 events: The First Round of 2010, Stability and Reforms, Azarov Takes the Party Chair, Yatsenyuk's Front for Change, The Court Undoes 2004, The Local Elections, The Tax Maidan"
 UKRH_debug_reset: "Debug: reset the history chain"
 UKRH_debug_reset_desc: "Clears every UKRH_ flag so the whole 2000-2010 chain can fire again from scratch."
 UKRH_debug_dump: "Debug: dump party state to the log"
 UKRH_debug_dump_desc: "Writes the ruling party, the coalition size and every party's popularity into game.log."
