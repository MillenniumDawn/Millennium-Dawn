l_korean:
 iraq_focus: "이라크 중점 계통도"
 IRQ_new_year_reports: "신년 보고서 "
 IRQ_new_year_reports_desc: "새 천년의 여명이 밝아오면서, 이라크는 중대한 기로에 놓여 있습니다. 우리 국가의 미래를 보장하고 발전의 길을 시작하기 위해서는, 우리가 직면한 과제를 평가하고 해결하는 것이 필수적입니다. 이 보고서들을 꼼꼼하게 분석함으로써, 우리는 앞으로 놓여 있는 도전 과제와 기회에 대한 귀중한 통찰력을 얻을수 있을겁니다. 이 지식을 통해 우리는 포괄적인 전략을 수립하고, 결함을 해결하며, 기회를 포착하고, 이라크의 더 밝은 미래를 향한 방향을 설정하기 위한 단호한 조치를 취할 수 있을 것입니다."
 IRQ_cooperative_domination_desc: "철권 통치만으로는 체제에 무리가 따를 것입니다. 저희는 지역 파트너들의 미래를 이끌기 위해 우리 세력 내 인물들을 임명해야 합니다."
 IRQ_proposal_to_jordan: "알홈시와 접촉"
 IRQ_proposal_to_jordan_desc: "요르단 바트당의 지도자는 신뢰할 수 있고 겸손한 사람입니다. 우리는 그와 그의 지지 세력에게 전폭적인 지원을 할 것이며, 그들에게 무기를 제공하고 이라크군 일부를 파견하여 [JOR.GetLeader] 의 전복을 돕도록 할겁니다"
 IRQ_proposal_to_syria: "알-두리 진급"
 IRQ_proposal_to_syria_desc: "한때 사담 후세인의 오른팔이었던 알-두리는 이제 [SYR.GetLeader]를 전복시킨 후 시리아 바아스당을 이끌게 될 것입니다. 너무 오랫동안 시리아 사람들은 바아스 운동의 일원이라고 주장하는 이들에 의해 잘못 이끌려왔습니다..."
 IRQ_assertive_domination_desc: "몇몇 국가는 단순히 외교를 이해할 수 없습니다. 바로 이것이 우리가 그들 위에 우리의 지배력과 권력을 확립하여 그들이 자신의 위치를 알도록 해야 하는 이유입니다."
 IRQ_reintegration_of_kurdistan: "이라크령 쿠르디스탄"
 IRQ_reintegration_of_kurdistan_desc: "The Kurds in the North of our country gained their autonomy due to a lack of leadership and foresight on our part. However, we are no longer in a weakened state, and we are able to properly quell any major uprising against the state by dissidents."
 IRQ_kuwaiti_traitors: "쿠웨이트 반역자들을 다시 방문하다"
 IRQ_kuwaiti_traitors_desc: "Kuwait betrayed the Arab people by allowing western imperialists to kill thousands of Iraqi soldiers by giving them free access to their bases. Now, they will and must pay the price for their actions."
 IRQ_liberate_arabs_in_khuzestan: "Arabs in Arabistan"
 IRQ_liberate_arabs_in_khuzestan_desc: "아라비스탄, 혹은 이란인들이 부르는 호제스탄은 원래의 정당하고 합법적인 이라크의 영토로, 이란에 의해 점령당한 지역입니다. 우리는 아라비스탄에 거주하는 아랍인들을 해방시키고, 그들이 오랫동안 기다려온 자유를 되찾아야 합니다."
 IRQ_egyptian_union_project: "티라크 아지즈의 일자리"
 IRQ_egyptian_union_project_desc: "타리크 아지즈는 특정한 카리스마를 가지고 있으며, 우리는 이를 이용해 이집트에 바아스 혁명을 수출하고 타락한 [EGY.GetLeader]의 종말을 가져올 수 있습니다."
 IRQ_reconstruction_of_losses: "손실의 재건"
 IRQ_reconstruction_of_losses_desc: "우리 나라가 겪어온 수많은 대립 속에서 우리는 많은 산업 능력을 잃었습니다. 서방 강국들과의 협력은 도움이 될 수 있을 것입니다."
 IRQ_oil_fields_in_the_north: "북부의 유전 지대"
 IRQ_oil_fields_in_the_north_desc: "우리나라 북부 지역에는 아직 개발되지 않은 유전이 많이 매장되어 있으며, 그곳에 새 유전을 건설하면 복구 과정을 가속화할 수 있을 것입니다"
 IRQ_oil_fields_in_the_south: "남부의 유전 지대"
 IRQ_oil_fields_in_the_south_desc: "우리나라의 석유 추출의 중심지임에도 불구하고, 남부 유전들은 적대 세력의 폭격 작전으로 인해 생산 능력이 저하되었습니다. 재건과 활성화가 필요할 것입니다."
 IRQ_authority_in_refineries: "정유 시설 통제권"
 IRQ_authority_in_refineries_desc: "우리 정유 시설에 적합한 인재를 배치하여 운영을 감독하게 함으로써, 우리는 이윤을 극대화하고 모든 형태의 부패를 근절할 수 있습니다."
 IRQ_iranian_powerplants: "이란 핵 발전소"
 IRQ_iranian_powerplants_desc: "The Iranians have made recent improvements in their nuclear program, and be it peaceful or not, we could use their expertise to construct new powerplants in our nation for a better energy source."
 IRQ_foreign_advisors: "해외 고문단"
 IRQ_foreign_advisors_desc: "해외 고문들을 초청하면 장기적으로 이익이 될 것입니다. 우리 스스로는 얻을 수 없었던 전문 지식을 제공받을 수 있기 때문입니다."
 IRQ_investments_from_kuwait: "쿠웨이트의 투자"
 IRQ_investments_from_kuwait_desc: "우리 사이에 이견이 있기는 하지만, 경제 상황을 개선하는 수단으로 쿠웨이트의 투자를 받는 것은 분명 큰 도움이 될 것입니다."
 IRQ_trade_with_syria: "시리아와의 무역"
 IRQ_trade_with_syria_desc: "가장 오래된 이웃 중 하나인 시리아와 무역을 증진하면 향후 지역 무역망을 추진하는 데 유용할 수 있습니다."
 IRQ_loans_from_neighbours: "이웃 국가의 대출"
 IRQ_loans_from_neighbours_desc: "빠른 자금을 구하기 위해, 나라를 재건하려면 이웃 국가들에 대출을 요청해야 합니다."
 IRQ_industrial_military_complex: "미국 군산복합체 활용"
 IRQ_industrial_military_complex_desc: "미국의 군산복합체는 우리나라에 큰 관심을 보여 왔으며, 그 혜택을 활용하는 것은 우리와 우리의 포부에 매우 유용할 것입니다."
 IRQ_chinese_investments: "중국의 투자"
 IRQ_chinese_investments_desc: "중국은 이 지역에서 부상하는 강대국이며, 그들이 제공하는 모든 형태의 지원을 활용해야 합니다."
 IRQ_a_new_day_in_baghdad: "바그다드의 새로운 하루"
 IRQ_a_new_day_in_baghdad_desc: "§Y\\"신선한 공기 한 모금!\\"§!\n\n바그다드에 새로운 하루가 밝았으며, 우리는 큰 스트레스 없이 자유롭게 숨 쉴 수 있습니다. 다행히도 우리나라는 앞으로 몇 년 안에 완전한 경제 회복의 길에 들어서 있습니다."
 IRQ_a_resistance_economy: "저항 경제"
 IRQ_a_resistance_economy_desc: "이란은 저항의 경제 모델이 강대국에게 의존할 필요가 없음을 보여 주고자 하는 모든 나라에 이로울 수 있음을 증명했습니다!"
 IRQ_circumventing_the_sanctions: "제재에 대비"
 IRQ_circumventing_the_sanctions_desc: "이란과 마찬가지로 우리 또한 앞으로 강대국의 부당한 압박을 받을 수 있습니다. 우리에게 가해질 수 있는 향후의 모든 제재에 대비해야 합니다."
 IRQ_relying_on_our_strength: "우리의 힘에 의존"
 IRQ_relying_on_our_strength_desc: "우리에게 필요한 것은 외국 강대국의 힘이 아니라 오직 이라크인과 이라크 애국자들의 힘입니다."
 IRQ_reverse_engineering: "역설계"
 IRQ_reverse_engineering_desc: "무언가를 생산하는 더 나은 방식을 만들어 내려고 몇 달, 심지어 몇 년을 허비하는 대신, 이미 만들어진 것을 분해하여 그 기능을 재현할 수 있기를 기대할 수 있습니다."
 IRQ_brothers_from_iran: "이란의 형제들"
 IRQ_brothers_from_iran_desc: "의견 차이가 있었지만 이란인들은 동쪽의 우리 형제입니다. 모든 외세에 대한 협력과 저항을 확대하기 위해 더욱 강력한 관계를 구축해야 합니다."
 IRQ_the_black_market: "암시장"
 IRQ_the_black_market_desc: "암시장은 경제적 잠재력이 큰 미개척 시장이며, 이 지하 시장을 우리에게 유리하게 활용해야 합니다."
 IRQ_state_sponsored_industries: "국가 후원 산업"
 IRQ_state_sponsored_industries_desc: "새로운 산업은 아무것도 없이 시작할 수 없습니다. 창업하여 우리나라에 번영을 가져오려는 산업에 보조금을 지급해야 합니다."
 IRQ_revive_damaged_companies: "사라진 기업의 부활"
 IRQ_revive_damaged_companies_desc: "지난 몇 년간 우리가 겪은 경제적 어려움 속에서 많은 기업이 문을 닫았습니다. 이제 그들의 생명을 다시 불어넣을 때입니다."
 IRQ_jihad_of_reconstruction: "재건의 지하드"
 IRQ_jihad_of_reconstruction_desc: "이란의 계획과 마찬가지로, 우리는 재건 촉구를 통해 나라를 다시 세우는 데 중점을 둘 것입니다."
 IRQ_jewel_of_resistance: "저항의 보석"
 IRQ_jewel_of_resistance_desc: "우리나라는 외세의 억압 아래 있는 나라들에게 저항의 보석으로 추앙받게 될 것입니다."
 IRQ_exporting_the_resistance_economy: "저항 경제의 수출"
 IRQ_exporting_the_resistance_economy_desc: "이제 우리의 경제적 가치를 세계에 증명했으므로, 이러한 이상을 필요로 하는 이들에게 수출할 방법을 찾을 수 있습니다."
 IRQ_oil_for_money: "석유를 돈으로"
 IRQ_oil_for_money_desc: "남부의 풍부한 유전에서 나오는 석유를 다른 나라에 넘기고 그 대가로 돈을 받을 수 있습니다."
 IRQ_support_the_scientists: "과학자 지원"
 IRQ_support_the_scientists_desc: "우리 과학자들은 삶을 영위하는 새롭고 혁신적인 방법을 찾는 최전선에 있으며, 가능한 한 그들의 노력을 지원해야 합니다."
 IRQ_an_economic_player: "경제적 주역"
 IRQ_an_economic_player_desc: "이라크는 더 이상 지도상의 평범한 나라 중 하나로 여겨지지 않을 것이며, 번영과 부로 가득한 진정한 강국으로 인식될 것입니다."
 IRQ_prioritize_industry: "산업 우선"
 IRQ_prioritize_industry_desc: "도시화 정책으로 나아가는 것이 재건에 가장 이로울 것이므로 우리는 산업을 우선시해야 합니다."
 IRQ_prioritize_military: "군대 우선"
 IRQ_prioritize_military_desc: "군대는 많은 경제에서 종종 간과되는 이점입니다. 장비를 갖춘 병력으로 대열을 채우면 낮은 실업률을 보장할 수 있습니다."
 IRQ_prioritize_services: "서비스업 우선"
 IRQ_prioritize_services_desc: "서비스 산업은 빠르게 성장하는 분야이며, 우리는 각자의 분야에서 교육받은 지식인들로 나라를 채울 수 있습니다."
 IRQ_the_national_recovery: "국가 회복"
 IRQ_the_national_recovery_desc: "이제 최악의 시기를 뒤로했으니 국가 회복의 시간이 도래했습니다. 이라크는 재건의 시대를 거치고 세계와의 화해를 이루어야 합니다."
 IRQ_industrial_recovery: "산업 회복"
 IRQ_industrial_recovery_desc: "우리 산업은 사실상 잔해로 전락했으며, 이라크의 모든 산업 역량은 이전의 수준으로 되돌려져야 합니다."
 IRQ_reopening_trade_relations: "무역 관계 재개"
 IRQ_reopening_trade_relations_desc: "우리는 한동안 국제적으로 고립되어 왔으며, 이러한 상태를 되돌리기 위한 조치를 취해야 합니다."
 IRQ_an_economic_war: "경제 전쟁"
 IRQ_an_economic_war_desc: "우리 병력이 국가의 적들과 직접 교전하고 있지는 않지만, 우리는 분명 생존을 건 경제 전쟁을 치르고 있습니다."
 IRQ_our_own_military_industries: "우리만의 군수 산업"
 IRQ_our_own_military_industries_desc: "우리 병력을 무장시키는 일을 외국 공급업자에게 의존할 수는 없으며, 다른 이라크인이 이를 맡아야 합니다."
 IRQ_state_above_all: "무엇보다 국가"
 IRQ_state_above_all_desc: "이라크의 안보, 안전, 번영은 그 무엇보다 우선되어야 합니다."
 IRQ_recovery_of_oil_reserves_in_south: "남부 석유 매장량의 재활성화"
 IRQ_recovery_of_oil_reserves_in_south_desc: "혼란의 시기를 겪은 후 남부의 유전은 사실상 되살아나야 합니다."
 IRQ_revive_major_industrial_sectors: "주요 산업 부문 부흥"
 IRQ_revive_major_industrial_sectors_desc: "수십 년간의 부실 운영과 분쟁으로 여러 산업 부문이 파괴되었으며, 이제 이 죽은 산업들을 되살릴 때입니다."
 IRQ_state_owned_construction_corporations: "국영 기업"
 IRQ_state_owned_construction_corporations_desc: "나라를 재건하는 데 의지할 수 있는 국영 건설 회사들을 출범시켜야 합니다."
 IRQ_negotiations_with_the_GCC: "GCC와의 협상"
 IRQ_negotiations_with_the_GCC_desc: "GCC는 남쪽에서 형성되고 있는 성장하는 경제 블록이며, 이 성장의 혜택을 얻으려면 협상을 시작해야 합니다."
 IRQ_revive_basra_port: "바스라 항 부활"
 IRQ_revive_basra_port_desc: "바스라 항은 과거의 모습을 잃고 껍데기만 남았으며, 이 중요한 항구를 되살려야 합니다."
 IRQ_ship_building_industry: "조선 산업"
 IRQ_ship_building_industry_desc: "조선 산업의 중요성은 아무리 강조해도 지나치지 않으며, 쇠락해 가는 이 산업을 다시 경제 무대로 되돌릴 새로운 방법을 모색해야 합니다."
 IRQ_russian_investments: "러시아의 투자"
 IRQ_russian_investments_desc: "러시아는 최근 대대적인 변혁의 시대를 거쳤으며, 이라크의 새로운 투자자를 구하기 위해 그들과 접촉하는 것은 우리에게 매우 이로울 것입니다."
 IRQ_chinese_loans: "중국의 대출"
 IRQ_chinese_loans_desc: "§R\\"우리의 사회 신용 점수는 충분히 높다!\\"§!\n\n중국은 이 지역의 다른 모든 나라에 대출을 제공하며 도움을 주고 있는데, 이라크만 다른 대우를 받아야 할 이유가 있겠습니까?"
 IRQ_a_deal_with_the_devil: "악마와의 거래"
 IRQ_a_deal_with_the_devil_desc: "중국인들이 반드시 어떤 종교를 믿는 것은 아니지만, 경제 성장은 분명히 믿습니다."
 IRQ_just_like_babylonia: "바빌로니아처럼"
 IRQ_just_like_babylonia_desc: "바빌론처럼 이라크도 다시 한번 강대국의 길을 걷게 될 것입니다!"
 IRQ_recovering_from_ninety_one: "91년의 여파에서 회복"
 IRQ_recovering_from_ninety_one_desc: "연합군의 이라크 폭격 작전은 우리나라에 막대한 타격을 입혔으며, 이제 회복할 계획을 세울 때입니다."
 IRQ_the_american_pinch: "미국의 압박"
 IRQ_the_american_pinch_desc: "우리는 미국의 제재가 경제에 가하는 압박을 느끼고 있지만, 이름에서 알 수 있듯 이는 단지 따끔한 정도입니다. 우리는 물러나 재정비할 수 있습니다!"
 IRQ_revolutionary_command_council: "혁명지도평의회"
 IRQ_revolutionary_command_council_desc: "나라의 재건에 대한 의견을 제시할 수 있도록 적절한 계획을 수립하기 위해 혁명지도평의회를 소집해야 합니다."
 IRQ_farming_regulations: "농업 규제"
 IRQ_farming_regulations_desc: "농민들이 나라를 분열시키지 못하도록 금지하는 적절한 규제를 받아야 하며, 무엇을 경작할 수 있는지, 어디에서 경작할 수 있는지, 어떻게 경작할 수 있는지에 대한 할당량을 정해야 합니다."
 IRQ_decree_three_o_seven: "법령 307호"
 IRQ_decree_three_o_seven_desc: "법령 307호는 지주들의 저항에 부딪히더라도 규제를 통해 경제적 번영을 가져올 것입니다."
 IRQ_farming_incentives: "농업 장려책"
 IRQ_farming_incentives_desc: "우리가 도입한 규제 이후에도 농민들이 일을 계속하려면 어떤 형태의 장려책이 필요하며, 이 분야에서 일하는 이들을 위한 지원 패키지를 준비해야 합니다."
 IRQ_a_fed_population: "배불리 먹는 국민"
 IRQ_a_fed_population_desc: "배불리 먹는 국민은 행복한 국민입니다. 농업 부문의 일자리를 늘려 이 목표를 달성할 수 있습니다."
 IRQ_arable_land_programme: "경작지 프로그램"
 IRQ_arable_land_programme_desc: "이라크에는 특히 중부에 경작지가 많습니다. 그러나 남부와 다른 지역은 훨씬 더 건조합니다. 그 지역의 땅을 농사에 더 적합하게 만들기 위한 실험을 시작할 수 있습니다."
 IRQ_bread_lines: "빵 배급"
 IRQ_bread_lines_desc: "국민에게 매주 식량 배급을 제공하기 위해 빵 배급 체계를 마련해야 합니다. 이를 통해 복지 프로그램의 면모를 보이면서도 국민의 삶의 질을 향상시킬 수 있습니다."
 IRQ_negotations_with_syria: "시리아와의 협상"
 IRQ_negotations_with_syria_desc: "시리아와 그 시장을 무시하는 것은 어리석은 처사입니다. 우리 사이에 이견이 있더라도 그들의 경제에서 일부 이익을 얻어낼 수 있습니다."
 IRQ_renewed_oil_production: "석유 생산 재개"
 IRQ_renewed_oil_production_desc: "안정적인 GDP를 유지하는 데 필요한 할당량을 충족하려면 석유 생산량을 두 배, 세 배, 심지어 네 배로 늘려야 하며, 석유 시장이 안정적으로 유지되도록 하겠습니다."
 IRQ_secret_shipments: "타국에서 얻는 교훈"
 IRQ_secret_shipments_desc: "다른 정부들의 실수, 특히 어려움을 겪은 정부들의 실수로부터 배워 그들이 겪었을 법한 유사한 몰락을 방지하겠습니다."
 IRQ_control_inflation: "인플레이션 통제"
 IRQ_control_inflation_desc: "우리의 인플레이션율은 종잡을 수 없으며, 국민의 만족을 유지하기 위해 가능한 한 빨리 이를 통제할 방법을 찾아야 합니다."
 IRQ_seize_unproductive_fields: "비생산적 농지 몰수"
 IRQ_seize_unproductive_fields_desc: "일부 농민들은 하루 종일 아무것도 하지 않고 앉아만 있습니다. 그들의 농장을 몰수하여 실제로 일할 사람들에게 나눠 주겠습니다."
 IRQ_iraqi_perserverence: "이라크의 불굴의 의지"
 IRQ_iraqi_perserverence_desc: "이라크 국민의 정신을 고취함으로써 필요한 곳에서 생산성과 사기를 높일 수 있습니다."
 IRQ_recovery_from_the_gulf: "걸프전 이후의 회복"
 IRQ_recovery_from_the_gulf_desc: "우리는 여전히 걸프전이 초래한 경제적 피해로 고통받고 있으며, 회복을 위한 계획을 세우기 시작해야 합니다."
 IRQ_brick_by_brick: "벽돌 하나하나"
 IRQ_brick_by_brick_desc: "벽돌 하나하나를 쌓아 모든 집, 병원, 학교, 건물을 재건할 것입니다. 이러한 모든 발전은 이라크인들이 거리로 돌아와 평범한 삶을 살게 해 줄 것입니다."
 IRQ_water_purification: "물 정화"
 IRQ_water_purification_desc: "물은 사치품이어서는 안 되며, 따라서 나라의 여러 지역에서 정수 사업을 시작해야 합니다."
 IRQ_prop_up_basrah: "바스라 부양"
 IRQ_prop_up_basrah_desc: "바스라는 잠재력이 막대한 주 중 하나이지만, 풍부한 자원에 의해 이용되고 규정되어 왔습니다. 바스라 주민들에게 새로운 기회와 번영을 주겠습니다."
 IRQ_iraqi_vehicle_production: "이라크 차량 생산"
 IRQ_iraqi_vehicle_production_desc: "자체 차량을 생산하는 데 있어 이웃 이란을 본받아야 합니다. 교통수단은 더 이상 소수만이 누릴 수 있는 사치가 아닐 것입니다."
 IRQ_restoration_of_defensive_lines: "방어선 복구"
 IRQ_restoration_of_defensive_lines_desc: "연합군과의 분쟁 중에 방어선과 진지가 파괴되었습니다. 그들이 다시 우리 문 앞에 찾아올 경우를 대비해 재건하겠습니다."
 IRQ_reconstruction_of_tuwaitha: "투와이타 재건"
 IRQ_reconstruction_of_tuwaitha_desc: "투와이타 핵 연구 센터는 이란, 이스라엘, 미국으로부터 여러 차례 폭격을 받았습니다. 이 모든 공격으로 시설은 거의 기능을 수행할 수 없는 상태가 되었습니다."
 IRQ_repair_nuclear_reactors: "원자로 수리"
 IRQ_repair_nuclear_reactors_desc: "많은 원자로가 폭격 작전으로 파괴되었으며, 그 결과 우리의 에너지 기반시설이 부정적인 영향을 받았습니다. 가능한 한 빨리 재건해야 합니다."
 IRQ_future_of_the_party: "당의 미래"
 IRQ_future_of_the_party_desc: "바트당의 미래는 불확실해 보이지만, 몇 가지를 준비함으로써 그 존속을 보장할 수 있습니다.."
 IRQ_at_the_cross_roads: "기로에 서다"
 IRQ_at_the_cross_roads_desc: "우리나라와 당은 이슬람주의와 세속주의 사이의 기로에 서 있습니다. 어느 쪽으로 방향을 잡든 이라크인들이 계속 단결하도록 보장해야 합니다."
 IRQ_blood_fuels_innovation: "피가 혁신을 낳는다"
 IRQ_blood_fuels_innovation_desc: "우리나라에서 일하는 과학자들의 마음 깊은 곳에 공포를 심어 주면 그들은 더욱 빠르게 연구하기 시작할 것입니다."
 IRQ_the_space_program: "우주 계획"
 IRQ_the_space_program_desc: "우주 계획은 여러 차례 시도되었으나 번번이 실패했습니다. 그러나 이번에는 다를 것입니다."
 IRQ_saddamism: "사담주의"
 IRQ_saddamism_desc: "사담 후세인과 그의 이념은 우리 당과 나라의 모든 면에서 구현될 것입니다. 국민은 결코 잊어서는 안 됩니다."
 IRQ_the_states_hand: "국가의 손길"
 IRQ_the_states_hand_desc: "나라 안에서 정부의 역할이 강화되어야 하며, 국민의 삶에서 국가가 밀려나서는 안 됩니다."
 IRQ_outlaw_opposition: "야당 불법화"
 IRQ_outlaw_opposition_desc: "정권과 당에 대한 모든 형태의 정치적 반대는 진압되어야 하며, 이어서 불법화되어야 합니다."
 IRQ_the_baathist_party: "안개 낀 새천년"
 IRQ_the_baathist_party_desc: "2000년이 본격적으로 시작되면서 이라크의 미래와 바트당의 미래는 불투명해 보입니다. 미국은 우리를 전복할 방법을 마련하려는 목적으로 우리에 대한 선전을 강화하고 있습니다. 그럼에도 무슨 일이 일어나든 우리는 안개 속에서 승리하여 빠져나올 것입니다."
 IRQ_restore_faith_in_army: "군에 대한 신뢰 회복"
 IRQ_restore_faith_in_army_desc: "군은 쿠웨이트에 있을 때 수렁에 빠지고 파괴되었으며 전 세계 앞에서 조롱당했습니다. 군을 재편하고 개편하겠다는 계획을 발표하여 국민의 군에 대한 신뢰를 회복해야 합니다."
 IRQ_bypass_un_sanctions: "UN 제재 우회"
 IRQ_bypass_un_sanctions_desc: "UN은 우리 정부와 국가에 여러 제재를 가했으며, 이에 대해 조치를 취해야 합니다. 대화와 외교는 분명 선택지에서 제외되었으므로, 이러한 제재를 피해 갈 방법을 찾아야 합니다."
 IRQ_politicization_of_islam: "이슬람의 정치화"
 IRQ_politicization_of_islam_desc: "종교는 매우 강력한 도구이며 우리나라는 대부분 이슬람과 이슬람 신앙을 따르고 있습니다. 우리 국가의 종교적 구성의 특성상, 신앙으로부터 정통성을 얻어 우리의 통치를 공고히 할 방법을 찾아야 합니다."
 IRQ_continuation_of_oil_for_food: "식량을 위한 석유 계속"
 IRQ_continuation_of_oil_for_food_desc: "식량을 위한 석유 프로그램은 우리와 우리 국민에게 번영할 또 다른 기회를 줍니다. 우리의 자원을 위험에 빠뜨리기는 하지만, 제재로 인해 생긴 어려움을 돌파할 수 있습니다."
 IRQ_medicinal_focus: "의약품 중점"
 IRQ_medicinal_focus_desc: "우리 국민에게는 무엇보다 의약품이 필요하며, 이것이 없다면 대규모로 죽어 가기 시작할 것입니다. 이 프로그램에서 의약품 공급에 대한 지원을 강조하겠습니다."
 IRQ_food_focus: "식량 중점"
 IRQ_food_focus_desc: "우리 국민은 먹을 것이 필요하며, 그렇지 않으면 질병과 기근이 뒤따를 것입니다. 이 프로그램의 이러한 측면에 더 큰 중점을 두겠습니다."
 IRQ_renovate_baghdad_airport: "바그다드 공항 개보수"
 IRQ_renovate_baghdad_airport_desc: "공항 상태가 이토록 끔찍한데 국민과 외국인이 이라크 안에서 이동하기를 기대할 수 있겠습니까? 바그다드 공항은 국제 표준에 맞추기 위해 대대적인 변신을 거쳐야 합니다."
 IRQ_restoration_of_hospitals: "병원 복구"
 IRQ_restoration_of_hospitals_desc: "많은 병원이 연합군에 의해 폭격당했으며 일부는 '사고'라고 주장되었지만, 어쨌든 그것들을 고치러 올 사람은 없을 것입니다. 이를 악물고 이 의료 시설들의 재건을 시작해야 합니다."
 IRQ_the_cult_of_saddam: "사담 숭배"
 IRQ_the_cult_of_saddam_desc: "§Y\\"그녀가 범람한다면 세상은 질투할 것이며, 사담이 그녀의 돛이 되리라\\"§!\n\n사담이 아니면 누가 우리나라를 이끌 수 있겠습니까? 미래 세대의 국민은 누구를 통합의 상징으로 우러러보아야 합니까? 사담과 그의 업적의 중요성을 강조하는 것은 장기적인 안정과 단결에 결정적일 것입니다."
 IRQ_hosting_other_groups: "열린 문"
 IRQ_hosting_other_groups_desc: "적을 불안정하게 만드는 데 이용할 수 있는 단체들에게 문을 열어 줌으로써, 분쟁의 때가 오면 소매 속에 추가적인 무기를 갖게 될 수 있습니다."
 IRQ_mojahedin_khalq: "모자헤딘 에 할크"
 IRQ_mojahedin_khalq_desc: "MEK, 즉 모자헤딘 에 할크는 이슬람 공화국의 가장 오래된 반대 세력 중 하나이며 우리가 그동안 맺은 동맹 중 하나입니다. 그들을 활용하면 이란 정부에 맞서는 무기로 사용할 수 있습니다."
 IRQ_pij: "PIJ와 접촉"
 IRQ_pij_desc: "PIJ는 이스라엘 국가를 약화시키려는 우리의 시도에 도움이 될 것입니다. 그들의 민병대, 병력, 지휘 체계를 그 방법의 하나로 이용할 수 있습니다."
 IRQ_antagonize_israel: "이스라엘 적대"
 IRQ_antagonize_israel_desc: "이스라엘인들은 오랫동안 우리 정부와 지도부를 적대시해 왔습니다. 반격하지 않는다면 그들은 결코 자신의 분수를 알지 못할 것입니다."
 IRQ_antagonize_iran: "이란 적대"
 IRQ_antagonize_iran_desc: "이란인들은 이 지역에 더 큰 강대국이 있음을 알아야 합니다. 우리가 겪은 모든 좌절에도 불구하고, 우리는 이란을 구석의 제자리로 되돌려 놓을 것입니다."
 IRQ_ministry_of_education: "교육부"
 IRQ_ministry_of_education_desc: "학생들에게 세상에 대한 올바른 시각을 가르치기 위해 교육부를 활용해야 하며, 위험한 사상이 교실에 스며드는 것을 막아야 합니다."
 IRQ_culture_of_fear: "공포의 문화"
 IRQ_culture_of_fear_desc: "보복을 두려워하는 사람은 자신을 주목받게 하는 모든 것을 피할 것입니다. 우리가 장난이 아님을 알린다면 사람들은 우리가 하는 일에 감히 반대 의견을 내지 못할 것입니다."
 IRQ_resisting_imperialism: "제국주의 저항"
 IRQ_resisting_imperialism_desc: "제국주의적 신념과 영향력이 서서히 이 지역에 스며들고 있으며, 대륙 전체를 뒤집어 놓을 것입니다. 우리나라를 이러한 강대국들의 조준선에서 벗어나게 하려면 이 영향력에 맞서 싸워야 합니다."
 IRQ_udays_problems: "우다이의 문제"
 IRQ_udays_problems_desc: "우다이는... 별난 인물입니다. 그의 이미지를 회복시키기 위해 무엇을 할 수 있는지 살펴보고 일부 대책을 검토해야 합니다."
 IRQ_future_successor: "미래의 후계자"
 IRQ_future_successor_desc: "우다이는 우리 국가의 지도자 역할에 가장 적합합니다. 그의 무자비함과 어려운 결정을 쉬워 보이게 만드는 능력은 그를 명백한 후보로 만듭니다."
 IRQ_designate_qussay: "쿠사이 지명"
 IRQ_designate_qussay_desc: "우다이는 자신이 나라를 이끄는 데 신뢰할 수 없는 인물임을 분명히 했으며, 그의 행동은 나라를 파멸로 몰아넣을 것입니다. 우리는 쿠사이에게 눈을 돌려 나라를 미래로 이끌게 해야 합니다."
 IRQ_an_era_of_saddam: "사담의 시대"
 IRQ_an_era_of_saddam_desc: "때가 왔습니다. 사담과 그의 승리로 특징지어지는 시대에 국가의 꿈이 마침내 완전히 이루어질 것입니다!"
 IRQ_liberation_of_the_quds: "알쿠드스 해방"
 IRQ_liberation_of_the_quds_desc: "우리 병력이 예루살렘으로 진군하여 알쿠드스의 진정한 후계자들을 위해 되찾을 것이며, 이스라엘 국가는 더 이상 존재하지 않을 것입니다!"
 IRQ_indirect_domination: "간접적 지배"
 IRQ_indirect_domination_desc: "직접 통치는 우리가 감독하는 이들을 더욱 분노하게 만들 뿐입니다. 우리나라와 국경을 접한 사회들에서 발견되는 부패를 이용하여 경제적 수단으로 이 지역을 다스려야 합니다."
 IRQ_obtain_aramco: "모든 시선은 아람코로"
 IRQ_obtain_aramco_desc: "[SAU.GetName]의 주력 석유 기업인 아람코는 [SAU.GetName]의 경제적 황금알을 낳는 거위입니다. 치밀한 계획을 세운다면 이 조직에 대한 사실상의 통제권을 공고히 할 수 있을 것입니다."
 IRQ_exploit_bahraini_corruption: "바레인의 부패 이용"
 IRQ_exploit_bahraini_corruption_desc: "바레인의 바트당 이념을 따르는 우리의 충성스러운 지지자들과 추종자들은 매우 오랫동안 우리가 그곳에 나타나기를 기다려 왔습니다. 부패한 지도자 [BHR.GetLeader]을(를) 몰아내고 정의로운 우리 동포를 그 자리에 앉히는 것은 시간문제입니다."
 IRQ_iraqi_armed_forces: "이라크군"
 IRQ_iraqi_armed_forces_desc: "이라크군(IAF)은 이라크의 영토 보전을 수호한다는 목표로 창설되었습니다. 이후 군대는 세계 최대 규모 중 하나로 확장되었으며 여러 부문이 배속되어 있습니다."
 IRQ_coastal_defense_force: "해안 방위군"
 IRQ_coastal_defense_force_desc: "해안 방위군은 우리 해군과 해상 전력에서 남은 부분입니다. 특히 미국과 이란이 우리에게 가한 공격으로 무로 돌아간 후의 잔존 전력입니다."
 IRQ_lessons_from_gulf_war: "걸프전의 교훈"
 IRQ_lessons_from_gulf_war_desc: "걸프전은 최대한 학습의 기회로 삼아야 합니다. 같은 실수를 반복하지 않을 방법을 찾기 위해 우리가 무엇을, 어디서, 어떻게 잃었는지 되돌아봐야 합니다."
 IRQ_commission_reconstruction_of_tariq_ibn_ziyad: "타리크 이븐 지야드 재건"
 IRQ_commission_reconstruction_of_tariq_ibn_ziyad_desc: "타리크 이븐 지야드(F212)는 우리의 최첨단 초계함이 될 것이며, 해상에서 우리 병력을 위협하려는 모든 적에 맞서는 최전선에 설 것입니다."
 IRQ_recruitment_of_new_admirals: "신규 제독 영입"
 IRQ_recruitment_of_new_admirals_desc: "응집력 있는 해군 지휘 체계를 구축하려면 새로운 제독이 필요하며, 적임자를 찾는 데에는 시간이 걸릴 것입니다."
 IRQ_iraqi_ground_forces: "이라크 지상군"
 IRQ_iraqi_ground_forces_desc: "이라크 지상군은 본질적으로 영국이 이라크에 대한 식민 지배를 유지하는 수단으로 창설했습니다. 그러나 시간이 지나며 IGF는 (어느 정도) 유능한 전투 병력으로 발전했으며 개혁이 크게 필요합니다."
 IRQ_domestic_program: "국산화 프로그램"
 IRQ_domestic_program_desc: "외국 공급업자에 대한 의존은 우리의 종말이 될 것이며, 국내 생산으로 전환하는 것이 필수적입니다."
 IRQ_expansion_of_missile_program: "미사일 계획 확대"
 IRQ_expansion_of_missile_program_desc: "우리의 힘은 미사일과 그 사거리에 달려 있을 것입니다. 가능한 한 빨리 새로운 혁신적 미사일의 개발을 의뢰하겠습니다."
 IRQ_strategic_launching_installations: "전략 발사 시설"
 IRQ_strategic_launching_installations_desc: "새로 확보한 미사일을 새 사일로가 아니면 어디에 배치하겠습니까?"
 IRQ_al_samoud_missile: "알 사무드 미사일"
 IRQ_al_samoud_missile_desc: "알 사무드 미사일은 러시아가 개발한 스커드 미사일과 유사하게 개발될 것입니다. 이 새로운 미사일이 적을 저지하는 데 효과적이기를 바랍니다..."
 IRQ_tabuk_sniper_rifle: "타북 저격 소총"
 IRQ_tabuk_sniper_rifle_desc: "타북 소총은 우리가 직접 국내에서 생산하는 저격 소총으로, 우리 병력이 멀리서 적을 한 명씩 골라 제거할 수 있게 해 줄 것입니다."
 IRQ_grants_for_rustamiyah: "루스타미야 지원금"
 IRQ_grants_for_rustamiyah_desc: "영국군은 1924년 새로 창설된 이라크 왕립군의 장교를 양성하기 위해 루스타미야에 이라크 육군사관학교를 세웠으며, 이를 영국 샌드허스트의 왕립 육군사관학교를 모델로 삼았습니다. 이라크 장교의 첫 기수는 1927년에 졸업했습니다."
 IRQ_convential_warfare: "재래식 전쟁"
 IRQ_convential_warfare_desc: "작전 무결성을 위험에 빠뜨릴 수는 없으므로 재래식 전술에서 너무 멀리 벗어날 수 없습니다."
 IRQ_assymetrical_focus: "비대칭 중점"
 IRQ_assymetrical_focus_desc: "비대칭전은 더 많은 병력을 살아남게 해 줄 것입니다. 간단한 이치입니다. 훨씬 우월한 기술을 가진 적에게 더 많은 병력을 잃을 위험을 감수할 수 없으며, 그들의 우위를 극복해야 합니다."
 IRQ_umm_qasr_naval_base: "움 카스르 항"
 IRQ_umm_qasr_naval_base_desc: "움 카스르 항은 규모와 화물 처리량 면에서 바스라 항에 이어 이라크에서 두 번째로 큰 항구입니다. 샤트알아랍 수로의 하구가 페르시아만으로 들어가는 알파우 반도 서쪽 끝에 위치하여 전략적으로 중요합니다."
 IRQ_fortification_of_gulf: "걸프 요새화"
 IRQ_fortification_of_gulf_desc: "전쟁 중에 몇 년 이상 버티려면 해안을 요새화하는 것이 절대적으로 필요합니다."
 IRQ_recruitment_of_new_engineers: "신규 공병 영입"
 IRQ_recruitment_of_new_engineers_desc: "우리 해군 자산을 항상 정비하고 수리하려면 새로운 기술자가 필요합니다."
 IRQ_expand_arabic_gulf_academy: "아랍 걸프 사관학교 확장"
 IRQ_expand_arabic_gulf_academy_desc: "아랍 걸프 사관학교를 확장하여 해군에 입대할 다양한 신규 인원을 수용하겠습니다."
 IRQ_iraqi_airforce: "이라크 공군"
 IRQ_iraqi_airforce_desc: "이라크 공군은 이라크군의 항공전 군종입니다. 이라크 영공 방어와 국제 국경의 치안을 담당합니다"
 IRQ_qayyarah_airbase: "카야라 공군기지"
 IRQ_qayyarah_airbase_desc: "카야라 서부 공군기지는 1970년대 후반에 건설되었으며, 1967년과 1973년 아랍-이스라엘 전쟁의 경험에 대응하여 \\"슈퍼 베이스\\" 계획에 따라 재건된 1970년대 이라크 공군 비행장 중 하나였습니다."
 IRQ_protect_the_skies: "하늘 수호"
 IRQ_protect_the_skies_desc: "하늘을 지킴으로써 우리 병력과 국민, 도시를 보호할 수 있습니다. 이 임무에 실패하면 어떤 작전에서도 성공은 결코 우리 것이 될 수 없습니다."
 IRQ_comprehensive_radar_installations: "종합 레이더 시설"
 IRQ_comprehensive_radar_installations_desc: "현재로서는 그다지 효과적이지 않으므로, 레이더 시스템을 설치하는 위치를 재평가해야 합니다."
 IRQ_tikrit_air_academy: "티크리트 항공 사관학교"
 IRQ_tikrit_air_academy_desc: "티크리트 항공 사관학교는 1970년대 중반에 처음 건설되었으며, 1967년과 1973년 아랍-이스라엘 전쟁의 경험에 대응하여 \\"슈퍼 베이스\\" 계획에 따라 재건된 여러 이라크 공군 비행장 중 하나입니다."
 IRQ_ask_iran_to_return_planes: "이란에 항공기 반환 요청"
 IRQ_ask_iran_to_return_planes_desc: "걸프 전쟁 동안, 우리는 여러 대의 비행기를 이란으로 보냈습니다. 이란은 그것들을 우리가 다시 요청할 때까지 안전하게 보관해주겠다고 약속했습니다. 이제 그 시간이 왔고, 우리는 공식적인 요청을 해야 합니다."
 IRQ_yugoslav_mig_servicing: "MiG 정비"
 IRQ_yugoslav_mig_servicing_desc: "MiG가 완전히 가동되고 전투 준비가 되도록 정비를 받아야 합니다."
 IRQ_bosnian_parts: "보스니아산 부품"
 IRQ_bosnian_parts_desc: "놀랍게도 보스니아는 우리가 부품을 구할 수 있는 몇 안 되는 나라 중 하나이지만, 그 품질과 신뢰도는 우리가 잘 알지 못합니다."
 IRQ_the_national_accord: "민족 합의"
 IRQ_the_national_accord_desc: "민족 합의는 걸프전 당시 사담 후세인에 대한 반대 단체로 창설되었습니다. 당시 가장 활발한 반사담 단체 두 곳은 SCIRI와 알다와였습니다. 둘 다 이라크에서 기원한 이슬람 시아파 정당이었으나, 지원을 받던 이란에서 활동했습니다."
 IRQ_digitalization_of_iraq: "이라크의 디지털화"
 IRQ_digitalization_of_iraq_desc: "이라크가 자부심과 성공을 안고 21세기로 나아가려면, 우선 나라가 디지털화되고 적절한 네트워크 기반시설을 갖출 준비가 되었는지 확인해야 합니다."
 IRQ_rural_networks: "농촌 네트워크"
 IRQ_rural_networks_desc: "농촌 지역에 거주하는 사람들에게는 인터넷이 절대적으로 필요합니다. 현재 그들은 통신 범위가 거의 없거나 전혀 없는 상태이기 때문입니다."
 IRQ_national_networks: "국가 네트워크"
 IRQ_national_networks_desc: "현재 인터넷이 전혀 닿지 않는 지역을 조사하고, 이를 중점 관심 지역으로 지정하여 다시 작업에 착수할 수 있도록 해야 합니다."
 IRQ_bring_in_tech_companies: "기술 기업 유치"
 IRQ_bring_in_tech_companies_desc: "국민을 위한 더 많은 일자리를 창출하려면 나라가 외국 기업, 특히 빠르게 성장하는 기술 대기업에게 매력적으로 보이도록 해야 합니다."
 IRQ_general_security_directorate: "일반보안국"
 IRQ_general_security_directorate_desc: "보안 및 정보 기관을 설립하면 우리나라를 위협하는 모든 국가 안보 위협을 저지하는 데 도움이 될 것입니다."
 IRQ_protection_from_our_neighbors: "이웃으로부터의 보호"
 IRQ_protection_from_our_neighbors_desc: "이웃이 언제든 우리에게 등을 돌릴 수 있음을 알면서 진정한 마음의 평화를 누릴 수는 없으며, 사방으로부터 안전하도록 보장해야 합니다."
 IRQ_protection_from_evildoers: "악행자로부터의 보호"
 IRQ_protection_from_evildoers_desc: "이라크와 국민에게 해를 끼치려는 자들이 있으며, 이러한 개인들에 대한 보안 대책을 마련하기 시작해야 합니다."
 IRQ_security_of_all_iraqis: "모든 이라크인의 안전"
 IRQ_security_of_all_iraqis_desc: "모든 이라크인의 안전은 최우선 과제이며 그 중요성을 간과할 수 없습니다. 국민이 끊임없이 위험에 처해 있다면 우리 정부는 기본적인 책무를 다하지 못한 것입니다."
 IRQ_consulting_our_allies: "동맹국과 협의"
 IRQ_consulting_our_allies_desc: "이라크가 진정한 잠재력을 발휘하도록 돕는 새로운 거래를 협상하기 위해 동맹국들과 연락해야 합니다!"
 IRQ_request_financial_relief: "재정 지원 요청"
 IRQ_request_financial_relief_desc: "우리는 지난 몇 년간 심각한 재정적 압박과 부담 속에 있었으며, 어떤 형태로든 재정 지원을 받는다면 회복 과정에 크게 도움이 될 것입니다."
 IRQ_security_training: "보안 훈련"
 IRQ_security_training_desc: "아무것도 모르는 경찰관과 요원들이 거리를 돌아다니며 쓰레기통이나 검사하게 둘 수는 없으며, 그들이 적절히 훈련받고 직무에 대해 충분히 교육받도록 해야 합니다."
 IRQ_rebuilding_iraq_together: "이라크를 함께 재건"
 IRQ_rebuilding_iraq_together_desc: "이라크는 혼자서 재건될 수 없으며, 이라크의 친구들과 점령군에 의해 재건되어야 합니다. 이라크가 번영하고 평화로운 미래는 세계가 평화롭게 숨 쉴 수 있는 미래입니다."
 IRQ_restructure_school_curriculum: "학교 교육과정 개편"
 IRQ_restructure_school_curriculum_desc: "사담 후세인 정권의 학교 제도는 선전으로 수많은 정신을 파괴했습니다. 우리나라에서 이념적 재앙이 싹트는 것을 막으려면 학교를 개편함으로써 이 피해를 되돌릴 조치를 취해야 합니다."
 IRQ_grants_for_schools: "학교 지원금"
 IRQ_grants_for_schools_desc: "현재 진행 중인 교육과정 개편 운동을 돕기 위해, 학교가 이러한 기본 요건을 충족하도록 일정 금액을 배정해야 합니다."
 IRQ_increase_accountability: "책임성 강화"
 IRQ_increase_accountability_desc: "교사들은 자신의 행동에 대해 책임을 져야 합니다. 바트당 정권 하에서 수많은 교사가 학생을 학대하고 뇌물 등의 수단으로 부패 행위에 가담했습니다."
 IRQ_tighten_sanitation_standards: "위생 기준 강화"
 IRQ_tighten_sanitation_standards_desc: "많은 학교의 위생 상태는 현재로서 바람직하지 않습니다. 질병과 감염병이 퍼지는 것을 막으려면 어떤 종류의 새로운 기준을 시행해야 합니다."
 IRQ_restructure_iraqi_police: "경찰 개편"
 IRQ_restructure_iraqi_police_desc: "현재 우리 국가에 만연한 부패를 해결하기 위한 다음 단계는 경찰을 개편하는 것입니다. 어려움이 따르겠지만 결국에는 성과를 거둘 것입니다."
 IRQ_free_and_fair_judicial_system: "자유롭고 공정한 사법 제도"
 IRQ_free_and_fair_judicial_system_desc: "우리의 사법 제도는 현재 부패로 가득합니다. 바트당 정권 때부터 남아 있는 판사들이 부패 행위에 가담하지 않도록 이들에 대한 조사를 시작해야 합니다."
 IRQ_consequences_for_bribery: "뇌물 수수에 대한 처벌"
 IRQ_consequences_for_bribery_desc: "뇌물 수수에는 더 무거운 처벌이 따라야 합니다. 현재 우리 고위 장교 대부분이 뇌물 수수 혐의를 받을 때 종종 눈을 감아 주기 때문입니다."
 IRQ_cooperation_with_army: "군과의 협력"
 IRQ_cooperation_with_army_desc: "군은 거리의 전반적인 치안을 보장하는 데 동원될 것이므로 나라를 재건하는 데 결정적일 것입니다."
 IRQ_equality_above_all: "무엇보다 평등"
 IRQ_equality_above_all_desc: "이라크를 재건하려는 시도에서 평등을 방해해서는 안 됩니다. 평등은 새롭고 더 나은 이라크로 가는 첫걸음일 뿐이기 때문입니다."
 IRQ_national_congress: "국민회의"
 IRQ_national_congress_desc: "이라크 국민회의는 걸프전 이후 여러 반사담 단체의 활동을 조율하기 위해 설립되었습니다. 당시 조지 H. W. 부시 대통령은 1991년 5월 중앙정보국에 사담 제거를 위한 여건을 조성하도록 지시하는 대통령 결정서에 서명했습니다."
 IRQ_from_all_walks_of_life: "각계각층에서"
 IRQ_from_all_walks_of_life_desc: "우리의 민족 정체성과 자아에 대한 신뢰를 회복하기 위해 각계각층의 이라크인을 단결시켜야 합니다."
 IRQ_kurdish_cooperation: "쿠르드인과의 협력"
 IRQ_kurdish_cooperation_desc: "쿠르드인은 우리나라 민족 구성에서 큰 비중을 차지합니다. 우리가 이전과 같은 정권이 아님을 증명하기 위해 북동부의 쿠르드 세력과 화해해야 합니다."
 IRQ_the_ironclad_coalition: "철벽 연합"
 IRQ_the_ironclad_coalition_desc: "바트당의 모든 재기에 맞서 싸우기 위해, 우리가 약속한 연합의 미래를 결정해야 합니다."
 IRQ_a_new_iraqi_society: "새로운 이라크 사회"
 IRQ_a_new_iraqi_society_desc: "과거의 사상을 서서히 몰아내는 새로운 운동을 시작하는 것은 국가의 존속에 엄청난 도움이 될 것이며, 그 운동은 지금 시작되어야 합니다!"
 IRQ_upholding_the_constitution: "헌법 수호"
 IRQ_upholding_the_constitution_desc: "헌법은 헛되이 쓰이지 않을 것이며 헛되이 쓰이지 않았습니다. 법치가 무엇보다 우선하도록 헌법을 수호하고 강화해야 합니다."
 IRQ_reaffirm_democratic_institutions: "민주주의 제도 재확인"
 IRQ_reaffirm_democratic_institutions_desc: "우리의 지지가 없다면 민주주의 제도는 서서히 무너지기 시작할 것이며, 우리 국가는 지난 수십 년간 겪은 것과 같은 독재의 순환으로 다시 빠질 것입니다."
 IRQ_separation_of_mosque_and_state: "정교분리"
 IRQ_separation_of_mosque_and_state_desc: "모스크가 국가의 행동을 좌우해서는 안 되며, 우리 정부는 우리에게 가해질 수 있는 어떠한 성직자의 영향력으로부터도 자유로워야 합니다."
 IRQ_justice_prevails: "정의는 승리할 것인가?"
 IRQ_justice_prevails_desc: "우리나라에 문제를 일으킨 자들은 책임을 져야 합니다. 쿠르드인들은 최근 국경 너머로 막대한 양의 마약을 밀수해 왔으며, 이를 막기 위해 거의 아무것도 이루어지지 않았습니다.."
 IRQ_iraqi_free_forces: "자유 이라크군"
 IRQ_iraqi_free_forces_desc: "자유 이라크군(FIF)은 우리 당의 민병대 조직으로, 이라크 해외 거주민들이 결성했으며 이라크를 수호하기 위해 언제든 즉시 출동할 준비가 되어 있습니다."
 IRQ_anti_saddam_sentiment: "반바트당 정서"
 IRQ_anti_saddam_sentiment_desc: "우리는 또 다른 바트주의 시대로 되돌아갈 수 없으며, 그 시절을 그리워하는 이가 있어서도 결코 안 됩니다."
 IRQ_ali_bin_al_husseins_request: "알리 빈 알후세인의 요청"
 IRQ_ali_bin_al_husseins_request_desc: "사실상 구 군주제의 대변인인 알후세인은 현재의 왕위 계승 주장자인 라아드 빈 자이드를 지지하며 어떤 형태로든 군주제를 꾸준히 추진해 왔습니다."
 IRQ_counter_iranian_militias: "이란 민병대 대응"
 IRQ_counter_iranian_militias_desc: "이란은 이라크에 대한 연성 통제를 공고히 하려는 시도로 민병대와 무장 단체를 이용해 영향력을 높여 왔습니다. 이러한 존재를 필요한 모든 수단을 동원해 억제해야 합니다."
 IRQ_integration_to_armed_forces: "군으로의 통합"
 IRQ_integration_to_armed_forces_desc: "비용을 줄이고 더 나은 협력을 추진하기 위해 FIF를 이라크군에 통합할 때입니다."
 IRQ_enforced_discipline: "규율 강화"
 IRQ_enforced_discipline_desc: "아무도 선을 넘지 않도록 병력을 통제해야 합니다. 이렇게 하면 더 세련되고 단련된 병력도 얻을 수 있습니다."
 IRQ_exploit_american_presence: "미국의 주둔 활용"
 IRQ_exploit_american_presence_desc: "나라에 주둔한 미국의 존재를 활용하지 않고 내버려 둘 수 없으며, 그들의 자원을 우리의 이익을 위해 이용해야 합니다."
 IRQ_mobilize_sadrs_forces: "사드르파 세력 동원"
 IRQ_mobilize_sadrs_forces_desc: "정치적 협상을 통해 새로운 체제와 정부의 강화를 지지하도록 사드르파 세력과 거래를 성사시켜야 합니다."
 IRQ_restrictions_on_american_army: "미군에 대한 제한"
 IRQ_restrictions_on_american_army_desc: "미군이 제멋대로 행동하도록 내버려 둘 수 없으며, 그들이 넘어서는 안 될 명확한 경계와 제한을 설정해야 합니다."
 IRQ_counter_cia_intel: "CIA 정보 대응"
 IRQ_counter_cia_intel_desc: "CIA의 정보를 그들에게 역이용하면 분명 그들을 자극하겠지만, 이라크나 지역을 불안정하게 만들려는 그들의 계획을 저지할 수 있다면 장기적으로 이로울 것입니다."
 IRQ_the_american_spring_board: "미국의 발판"
 IRQ_the_american_spring_board_desc: "미국은 우리나라를 중동 진출의 발판으로 삼고 있으며, 이 위치를 활용하면 우리의 지역적 야망을 상당히 빠르게 달성할 수 있습니다."
 IRQ_cia_safe_haven: "CIA의 안식처"
 IRQ_cia_safe_haven_desc: "CIA가 이라크인을 고용하고 나라의 고용률을 높이겠다고 약속하기만 한다면 이라크에서 활동하는 것을 얼마든지 환영합니다."
 IRQ_meddling_in_khuzestan: "아흐바즈 개입"
 IRQ_meddling_in_khuzestan_desc: "아흐바즈의 아랍인들을 부추겨 폭압적인 이란 정부에 맞서 봉기하도록 해야 하며, 새로 확보한 정보와 기술을 활용하여 동쪽의 아랍인들을 무장시켜 이란 정부에 타격을 입힐 것입니다."
 IRQ_al_dawa: "알다와"
 IRQ_al_dawa_desc: "다와 운동은 1960년경 이라크 남부의 시아파 성지 도시들에서 형성되었습니다. 당시 이 운동의 주된 목표는 마르크스주의와 다른 세속 이념이 이라크 시아파에 대해 가지고 있던 지적 영향력에 대항하는 것이었습니다. 그러나 이 단체는 사담의 부상과 함께 그가 시아파 주민에게 가한 위협으로 초점을 옮기기 시작했습니다."
 IRQ_status_quo_in_najaf: "성직자와의 협력"
 IRQ_status_quo_in_najaf_desc: "이란의 성직자들이 이라크로 건너와 자신들의 지혜를 설파하기 시작해야 하며, 성지 나자프에서 국가 후원 설교를 개최할 것입니다."
 IRQ_secret_iranian_backing: "이란의 비밀 후원"
 IRQ_secret_iranian_backing_desc: "나라를 통치하는 어려운 일을 우리끼리만 할 수는 없으며, 예산이 효과적으로 배정되도록 이란이 절실히 필요한 도움을 주어야 합니다."
 IRQ_empowering_shiites: "시아파에 힘을 실어 주다"
 IRQ_empowering_shiites_desc: "시아파에 힘을 실어 주면 이라크의 다수가 번영하고 정부에 정확히 대표될 것입니다. 또한 우리의 정치적 목표를 훨씬 쉽게 실행에 옮길 수 있을 것입니다."
 IRQ_the_partys_coffers: "당의 금고"
 IRQ_the_partys_coffers_desc: "우리 당은 약간.. 수상한 연줄을 가지고 있습니다. 그 결과, 금고를 채울 돈을 벌 다양한 방법이 있습니다."
 IRQ_reduce_the_power_of_sunnis: "수니파의 힘 축소"
 IRQ_reduce_the_power_of_sunnis_desc: "바트당 정권이 수니파 권력을 강화한 것의 해로운 영향이 여전히 느껴지고 있습니다. 수니파는 우리나라에서 소수로 간주되며, 적절한 견제가 없다면 그들은 자신들의 야망을 채우려는 과정에서 다른 모든 이를 무시할 것입니다."
 IRQ_reroute_kurdish_funds: "쿠르드 자금 경로 변경"
 IRQ_reroute_kurdish_funds_desc: "미국은 우리나라를 지나는 호송대를 통해 쿠르드인들에게 격주로 물자를 보내고 있습니다. 다행히 이 트럭들은 미국인이 아닌 이라크인이 운전하므로, 우리는 트럭에 방향을 돌리라고 요청하기만 하면 됩니다.."
 IRQ_root_out_traitor_generals: "신뢰할 수 없는 장군 색출"
 IRQ_root_out_traitor_generals_desc: "겉으로 드러내지 않더라도 여전히 구체제에 어느 정도 동조하는 것으로 보이는 장군들이 있습니다."
 IRQ_sectarian_wave: "종파의 물결"
 IRQ_sectarian_wave_desc: "지지자와 추종자들을 이용해 우리 정부와 체제에 대한 모든 형태의 반대를 억누르며 종파의 물결을 일으킬 때입니다."
 IRQ_improvements_for_shia_mosques: "시아파 모스크 개선"
 IRQ_improvements_for_shia_mosques_desc: "수십 년간의 바트당 통치로 방치된 탓에 많은 시아파 유적과 모스크가 무너지기 시작했습니다. 이 모스크들에 필요한 조치를 해 줄 때입니다."
 IRQ_clerical_militarism: "성직자 군국주의"
 IRQ_clerical_militarism_desc: "성직자들이 우리 편에 선다면 우리는 또 하나의 군대를 손에 넣게 됩니다. 성직자와 그들의 설교를 이용해 우리 사회에 군국주의적 이상을 고취하고, 이라크 국가를 위한 새로운 인력 확보 수단으로 삼겠습니다."
 IRQ_peace_deals_within: "내부의 평화 협정"
 IRQ_peace_deals_within_desc: "우리 국민이 적극적으로 서로를 찢어 놓으며 사회에 큰 혼란과 무질서를 초래하고 있습니다. 내부에서 싸우는 파벌들 사이에서 평화 협정을 중재해 볼 때입니다."
 IRQ_cooperation_with_hezbolla: "헤즈볼라와의 협력"
 IRQ_cooperation_with_hezbolla_desc: "헤즈볼라는 국제적 기피 대상임에도 우리의 수많은 이념적 동맹 중 하나입니다. 양국의 안전을 보장하는 적절한 유대를 맺어야 합니다."
 IRQ_partners_in_syria: "시리아의 파트너"
 IRQ_partners_in_syria_desc: "우리에게는 세계에 더 많은 친구가 필요하며, 아시아의 이웃 국가들이 이 구상에 안성맞춤입니다."
 IRQ_extend_a_hand_to_lebanon: "팔레스타인에 손을 내밀다"
 IRQ_extend_a_hand_to_lebanon_desc: "팔레스타인인들은 최근 국제 문제에서 상당히 억압받고 외면당해 왔지만, 우리가 이를 바꿀 수 있습니다. 그들이 필요할 때 손을 뻗어 붙잡을 수 있도록 우리가 손을 내밀겠습니다."
 IRQ_the_partys_ambition: "당의 야망"
 IRQ_the_partys_ambition_desc: "우리 당은 하루 종일 앉아서 아무것도 하지 않으려고 여기 있는 것이 아닙니다. 우리는 이라크를 더욱 강인하고 전투 태세가 갖춰진 나라로 개혁할 계획입니다!"
 IRQ_ghost_soldiers: "유령 병사"
 IRQ_ghost_soldiers_desc: "추가 자금을 확보하려면 보고가 들어올 때 우리가 보유한 병력 수를 부풀려야 합니다. 이 추가 자금으로 새 장비나 다른 무언가를 쉽게 구입할 수 있습니다.."
 IRQ_energy_bidding_rounds: "에너지 입찰"
 IRQ_energy_bidding_rounds_desc: "이라크에는 개발되지 않은 석유가 많으며, 이 자원에 대한 권리를 경매에 부치면 개발과 우리의 야망을 위한 자금을 마련하는 데 도움이 될 수 있습니다."
 IRQ_reliance_on_militias: "민병대 의존"
 IRQ_reliance_on_militias_desc: "국가를 방어하는 유일한 이들은 민병대이며, 군은 스스로 무능함을 입증했습니다. 나라를 방어하는 데 모든 믿음을 민병대에 걸어야 합니다."
 IRQ_army_of_martyr_sadr: "순교자 사드르 군"
 IRQ_army_of_martyr_sadr_desc: "우리 당의 무장 조직인 순교자 사드르 군은 PMF와의 더 큰 협력을 활성화하여 당원과 국가의 안전을 보장할 것입니다."
 IRQ_communist_party_of_iraq: "민중의 승리"
 IRQ_communist_party_of_iraq_desc: "이라크에서 가장 오래된 현역 정당인 공산당은 창당 이후 1970년대까지 이라크 정치사를 형성하는 데 중요한 역할을 했습니다. 그러나 이 당은 다른 많은 정당과 마찬가지로 바트당 통치 아래에서 크게 고통받았습니다."
 IRQ_liberty_triumphs: "자유의 승리"
 IRQ_liberty_triumphs_desc: "국민이 오랫동안 누려야 했던 자유와 해방을 마침내 부여받게 되면서 이라크에 새로운 시대가 열릴 것입니다."
 IRQ_equality_in_society: "사회의 평등"
 IRQ_equality_in_society_desc: "이라크 사회에는 많은 불평등이 존재하며, 외부에서 보기만 해도 우리 정책에 결함이 있는 부분이 많이 눈에 띕니다. 일부 이라크인이 겪는 이러한 불평등을 강화하는 법률을 폐지하기 시작할 것입니다."
 IRQ_rooting_out_poverty: "빈곤 뿌리 뽑기"
 IRQ_rooting_out_poverty_desc: "빈곤은 이라크를 통치해 온 일부 정당, 집단, 조직의 우선순위가 아니었습니다. 많은 이들이 외면해 온 이 과제에 맞설 때입니다."
 IRQ_housing_instead_of_slums: "빈민가 대신 주택"
 IRQ_housing_instead_of_slums_desc: "이라크의 많은 지역이 주택을 고려하여 제대로 개발되지 않았고, 주민들은 자연스럽게 빈민가를 만들어 살고 있습니다. 이러한 열악한 주거 환경을 계속 방치할 수 없으며, 빈민가 대신 주택을 장려하는 프로그램을 시작해야 합니다."
 IRQ_affordability_movement: "물가 안정 운동"
 IRQ_affordability_movement_desc: "평범한 이라크 시민이 감당할 수 있는 것이 모든 것은 아니며, 이로 인해 일부는 살기가 어려워졌습니다. 가능한 한 빨리 상품 가격을 낮추려는 노력을 시작해야 합니다."
 IRQ_women_in_our_society: "우리 사회의 여성"
 IRQ_women_in_our_society_desc: "사회에서 여성의 역할을 억압하는 것은 이전 정부들이 택한 불행한 길이었으나, 우리는 이 실수를 반복하지 않을 것입니다. 여성의 권리가 지켜지고 강화되도록 보장하겠습니다."
 IRQ_female_positions: "여성을 위한 일자리"
 IRQ_female_positions_desc: "일부 직장과 고용주들이 여성이 일자리를 얻기 어렵게 만들 수 있는 새로운 규정을 도입했으며, 이러한 차별적 정책을 단속해야 합니다."
 IRQ_our_voice: "우리의 목소리"
 IRQ_our_voice_desc: "우리만의 신문 '알카이다'를 창간하면 국민에게 우리의 메시지를 더 쉽게 전할 수 있습니다."
 IRQ_democratic_youth_federation: "민주청년연맹"
 IRQ_democratic_youth_federation_desc: "민주청년연맹은 자발적 청년 조직으로, 이라크 청년의 권리와 이익을 위한 운동을 벌일 것입니다."
 IRQ_voice_of_the_people: "민중의 목소리"
 IRQ_voice_of_the_people_desc: "일부 사람들은 자신의 목소리를 낼 무대가 없으므로 우리 당이 민중의 목소리가 되어야 합니다. 그들의 요구를 국민의 이익에 맞추어 우리 정부를 만들어 가는 방법으로 삼겠습니다."
 IRQ_rally_support_for_al_ansar: "알안사르 지지 결집"
 IRQ_rally_support_for_al_ansar_desc: "우리 당의 무장 조직인 알안사르는 오래전에 해체되었습니다. 그러나 대중의 지지를 결집하여 이 조직을 재건할 수 있습니다."
 IRQ_address_army_corruption: "군 부패 해결"
 IRQ_address_army_corruption_desc: "군은 믿을 수 없을 정도로 부패했으며, 이 부패는 '유령 병사'의 결실로 이어졌습니다. 이 부패를 단속하고 대열에 질서를 회복하겠습니다."
 IRQ_ideological_allies: "이념적 동맹"
 IRQ_ideological_allies_desc: "우리에게는 세계에 많은 친구가 있으며, 그저 그들에게 손을 내밀면 됩니다. 적절한 경제적 유대를 맺기 위해 이들 국가에 외교 사절을 파견하기 시작하겠습니다."
 IRQ_rally_the_kurdish_parties: "쿠르드인의 친구"
 IRQ_rally_the_kurdish_parties_desc: "북동부의 쿠르드 세력에게 우리 당과 나라가 그들의 존재에 위협이 되지 않음을 알려야 하며, 그들의 지역에 이념적 발판을 마련하여 이를 이루어야 합니다."
 IRQ_education_of_rights: "권리 교육"
 IRQ_education_of_rights_desc: "국민은 자신의 권리에 대해 교육받지 못했으며 이를 빼앗으려는 누구에게든 굴복할 것입니다. 국민에게 부여된 권리를 가르치는 프로그램을 시작해야 합니다."
 IRQ_the_iraqi_identity: "이라크 정체성"
 IRQ_the_iraqi_identity_desc: "우리나라는 정체성을 주로 이슬람과 이슬람 신앙에 따라 형성해 왔습니다. 이제 이라크 정체성을 더 공개적으로 장려하기 시작할 때가 되었습니다."
 IRQ_power_of_the_union: "노조의 힘"
 IRQ_power_of_the_union_desc: "노조는 강력한 세력이며 앞으로도 그래야 합니다. 노조의 권리를 지지하고 그 활동을 장려하여 경제적 책임성을 강화하겠습니다."
 IRQ_nationalization_of_the_economy: "경제 국유화"
 IRQ_nationalization_of_the_economy_desc: "이라크의 일부 핵심 경제 부문은 민간 단체, 개인 또는 기업이 부분적으로 또는 대부분 소유하고 있습니다. 우리의 자원이 소수의 손에 있을 수는 없으며, 이라크인의 손에 있어야 합니다."
 IRQ_expulsion_of_the_iranians: "이란인 추방"
 IRQ_expulsion_of_the_iranians_desc: "이란인들은 수년 동안 이라크에 대한 통제권을 공고히 하려 해 왔으며, 따라서 이를 끝장내야 합니다."
 IRQ_restrictions_on_the_americans: "미국인에 대한 제한"
 IRQ_restrictions_on_the_americans_desc: "사담 후세인과 그의 졸개들이 더는 이라크를 통치하지 않는 가장 큰 이유가 미국이라 해도, 그들이 제멋대로 행동할 자유를 갖는다는 뜻은 아닙니다. 이라크 내 그들의 활동을 감시하여 우리 국민에게 해를 끼치는 일이 없도록 하겠습니다."
 IRQ_the_call_to_freedom: "자유를 향한 부름"
 IRQ_the_call_to_freedom_desc: "국민 스스로를 위해 국가를 세속주의와 종교적 해방 정책으로 이끌 때입니다."
 IRQ_sadrist_movement: "사드르 운동"
 IRQ_sadrist_movement_desc: "무크타다 알사드르가 이끄는 사드르 운동은 이상적인 이라크를 외세의 영향에서 자유롭고 외국의 간섭으로부터 독립한 나라로 봅니다."
 IRQ_controlled_instability: "통제된 불안정"
 IRQ_controlled_instability_desc: "이라크에 존재하는 불안정을 우리에게 유리하도록 이끌면 예산의 일부를 줄이는 수단으로 활용할 수 있습니다."
 IRQ_mahdi_army_expansion: "마흐디 군 확장"
 IRQ_mahdi_army_expansion_desc: "이제 이라크에서 우리의 입지가 공고해졌으니, 마흐디 군이 이라크 사회와 군 전반에서 더 큰 역할을 하도록 그 미래를 보장할 수 있습니다."
 IRQ_front_against_american_expansion: "미국 팽창에 맞선 전선"
 IRQ_front_against_american_expansion_desc: "이라크는 미국이 나머지 중동으로 팽창하고 침투하는 것을 저지하는 전선이 될 것입니다."
 IRQ_the_little_serpent: "작은 뱀"
 IRQ_the_little_serpent_desc: "이라크의 문제에 관한 한 바트당과 그 지지자들은 작은 뱀입니다. 바트당원으로 의심되는 자들을 체포하고 처벌하는 것에서부터 시작해야 합니다."
 IRQ_the_bigger_serpent: "큰 뱀"
 IRQ_the_bigger_serpent_desc: "큰 뱀은 공교롭게도 사담을 몰아낸 미군입니다. 그럼에도 우리는 그들이 이 지역에서 저지른 모든 나쁜 짓을 잊을 수 없습니다. 그들의 팽창을 그 자리에서 막아야 합니다."
 IRQ_distance_from_assad: "아사드와의 거리 두기"
 IRQ_distance_from_assad_desc: "아사드는 완전한 미치광이이며 신뢰할 수 없습니다. 시리아 정부와 거리를 두고 그들이 무엇을 하려는지 지켜봐야 합니다."
 IRQ_khaleeji_relations: "걸프 국가와의 관계"
 IRQ_khaleeji_relations_desc: "걸프 국가들과의 관계는 폭넓게 논의되는 주제가 되었습니다. 일부는 더 큰 협력을 주장하는 반면 다른 일부는 거리를 두라고 압박합니다. 이들 국가의 경제가 이라크 시장을 급성장시킬 수 있으므로, 관계를 개선하는 것이 우리에게 최선의 이익입니다."
 IRQ_the_sayyid: "사이이드"
 IRQ_the_sayyid_desc: "무크타다 알사드르는 사이이드로 불리게 되었으며, 이는 그에게 이라크를 이끄는 데 절실히 필요한 정통성을 부여했습니다."
 IRQ_shockwaves_in_the_clergy: "성직자 사회의 충격파"
 IRQ_shockwaves_in_the_clergy_desc: "입을 놀리기로 마음먹은 성직자 몇 명을 제거하면 성직자 사회 전체에 충격파를 일으켜 앞으로의 반대를 잠재울 수 있습니다."
 IRQ_positions_for_supporters: "지지자를 위한 자리"
 IRQ_positions_for_supporters_desc: "끝까지 우리와 함께한 이들에게 보답해야 하며, 이는 그들이 원하는 어떤 일자리든 얻을 가능성을 높여 줌으로써 이룰 수 있습니다."
 IRQ_development_of_east_baghdad: "동바그다드 개발"
 IRQ_development_of_east_baghdad_desc: "동바그다드는 한동안 방치되어 왔으며, 이곳을 기준에 맞게 개발하는 것은 매우 이로울 것입니다."
 IRQ_al_hawsim: "알하우심"
 IRQ_al_hawsim_desc: "새로운 파트와를 발표함으로써 굶주린 이들이 기부를 통해 되갚는 한 필요한 것을 가져가도록 허용할 수 있습니다."
 IRQ_peace_brigades: "평화 여단"
 IRQ_peace_brigades_desc: "시아파 모스크의 안전은 보장되지 않았으나, 평화 여단을 창설하고 이들을 주둔시켜 안전을 지키게 함으로써 이를 보장할 수 있습니다."
 IRQ_reformation_of_the_state: "국가 개혁"
 IRQ_reformation_of_the_state_desc: "우리에게 해를 끼치고 정치적 불안정을 바라는 자들, 특히 바드르 여단을 이끄는 자들을 뿌리 뽑기 위해 국가를 개혁해야 합니다."
 IRQ_close_the_bastion_of_corruption: "부패의 아성 폐쇄"
 IRQ_close_the_bastion_of_corruption_desc: "이라크의 자유지대는 부패의 아성이며 즉시 폐쇄되어야 합니다. 외국인들이 와서 우리나라를 제멋대로 하도록 둘 수 없습니다."
 IRQ_constitutional_revisions: "헌법 개정"
 IRQ_constitutional_revisions_desc: "헌법은 비교적 최근에 작성되었지만, 국가가 퇴폐에 장악되는 것을 막는 데 필요한 모든 것을 포괄하지는 않습니다. 악행자들이 권력을 잡기 어렵게 만드는 몇 가지 개혁을 통과시키겠습니다."
 IRQ_pro_iraqi_alignment: "친이라크 노선"
 IRQ_pro_iraqi_alignment_desc: "이라크 국가는 다른 누구보다 우선해야 하며 이라크인에게 가장 큰 이익이 되어야 합니다. 외국인들이 우리 땅을 혼란과 절망에 빠뜨리게 둘 수 없습니다."
 IRQ_pro_tehran_alignment: "친테헤란 축"
 IRQ_pro_tehran_alignment_desc: "이란인들은 대부분의 경우 유용한 동맹으로 보일 수 있으며, 두 나라 사이의 동맹이 지닐 수 있는 잠재력을 과소평가해서는 안 됩니다."
 IRQ_a_party_of_integrity: "청렴한 정당"
 IRQ_a_party_of_integrity_desc: "우리 당은 잘못을 저지르지 않을 것이며 청렴과 정의의 정당이 될 것입니다. 우리가 외세의 침입으로부터 이라크 국민을 보호하는 한, 이라크 국민은 아무것도 걱정할 필요가 없습니다."
 IRQ_debaathification_of_iraq: "이라크 탈바트당화"
 IRQ_debaathification_of_iraq_desc: "완전한 회복 과정을 시작하려면, 이라크 국가에서 남아 있는 모든 바트당의 영향력을 제거하기 위한 탈바트당화 과정을 시작해야 합니다."
 IRQ_saving_face: "체면 살리기"
 IRQ_saving_face_desc: "이라크에는 부패가 만연하며 이를 외면할 수 없습니다. 체면을 살리고 이를 악물고 부패 행위를 필요한 모든 수단을 동원해 단속해야 합니다."
 IRQ_order_one: "명령 1호"
 IRQ_order_one_desc: "명령 1호는 바트당과 연계된 모든 공공 부문 직원을 직위에서 해임하고 앞으로 공공 부문에서의 고용을 금지한다고 선언하는 명령이 될 것입니다."
 IRQ_order_two: "명령 2호"
 IRQ_order_two_desc: "바트당과 그 연계 세력은 상당한 자산을 축적했으며, 이 자산들은 즉시 처리되어야 합니다."
 IRQ_order_four: "명령 4호"
 IRQ_order_four_desc: "바트당원들과 그들이 해 온 일에 대한 재정 조사를 계속해야 합니다."
 IRQ_order_five: "명령 5호"
 IRQ_order_five_desc: "효과적이고 공식적인 탈바트당화 위원회를 구성함으로써 우리의 노력을 더욱 폭넓고 효과적으로 조율할 수 있을 것입니다."
 IRQ_order_seven: "명령 7호"
 IRQ_order_seven_desc: "누가 진정으로 바트당과 연계되었고 누가 그렇지 않은지 밝혀내야 합니다. 일부는 본의 아니게 이 모든 혼란에 휘말렸으므로 조사가 필요합니다."
 IRQ_order_one_hundred: "명령 100호"
 IRQ_order_one_hundred_desc: "임시 당국에서 이라크 국민의 손으로 진정한 권력 이양이 이루어질 때가 왔습니다."
 IRQ_the_land_of_shiism: "혁명의 요새"
 IRQ_the_land_of_shiism_desc: "§G\\"타크비르!\\"§!\n\n우리나라는 진정한 혁명의 요새가 되었으며, 많은 이들의 눈에 우리는 적에 대한 승리를 이끄는 선두 주자로 비칠 것입니다!"
 IRQ_dealing_with_the_occupation: "점령 대응"
 IRQ_dealing_with_the_occupation_desc: "미국의 점령은 어떤 방식을 택하든 가능한 한 빨리 처리되어야 합니다."
 IRQ_a_deal_with_the_serpent: "뱀과의 거래"
 IRQ_a_deal_with_the_serpent_desc: "미국이 어디에도 가지 않을 것이라는 사실을 받아들이고, 그들을 우리의 이익을 위해 이용해야 합니다."
 IRQ_nato_counter_terror_specialists: "나토 대테러 전문가"
 IRQ_nato_counter_terror_specialists_desc: "나토 동맹과 그들의 대테러 전문 지식을 활용하여, 전문가를 초빙해 우리 병력을 훈련하고 자문을 받겠습니다."
 IRQ_leveraging_western_investors: "서방 투자자 활용"
 IRQ_leveraging_western_investors_desc: "서방인들은 돈이 될 만한 기회라면 무엇이든 뛰어들고 싶어 하므로, 이라크가 그들의 야망에 매력적으로 보이도록 만들어야 합니다."
 IRQ_our_gate_to_the_world: "세계로 향하는 관문"
 IRQ_our_gate_to_the_world_desc: "경제 자유화가 세계로 가는 열쇠가 될 것이며, 우리 시장에 보호무역주의를 강제할 수 없습니다."
 IRQ_auctioning_oil: "지속 가능한 채굴 시설"
 IRQ_auctioning_oil_desc: "이라크에는 석유가 충분하고도 남지만 이를 채굴할 도구가 부족합니다. 우리 자원을 채굴하는 데 필요한 도구를 만들 전문가들을 초빙하겠습니다."
 IRQ_invite_potus: "대통령 초청"
 IRQ_invite_potus_desc: "미국 대통령을 우리나라로 초청하여 우리가 위협이 되지 않음을 보여 주고, 전 세계 앞에서 이라크 국가의 안전함을 입증해야 합니다."
 IRQ_reverse_engineering_weapons: "무기 역설계"
 IRQ_reverse_engineering_weapons_desc: "미국은 상당한 양의 무기를 남기고 갔으며, 그중 몇 개를 확보해 역설계하여 우리만의 변형 무기를 생산하는 데 사용할 수 있습니다..."
 IRQ_memories_of_fallujah: "팔루자의 기억"
 IRQ_memories_of_fallujah_desc: "팔루자의 반란에서 얻은 경험을 활용하여, 그곳에 주둔한 급진주의자들에 대한 우리의 접근 방식을 개혁하겠습니다."
 IRQ_sadr_in_the_shadows: "그림자 속의 사드르"
 IRQ_sadr_in_the_shadows_desc: "무크타다 알사드르를 활용해 미국의 점령에 맞서 싸우는 것은 장기적으로 성과를 거둘 것입니다. 그는 점령군에 맞선 이 운동에서 가장 인기 있는 인물이기 때문입니다."
 IRQ_the_fatwa_from_najaf: "나자프의 파트와"
 IRQ_the_fatwa_from_najaf_desc: "점령군에 맞서 민중 동원을 촉구하는 파트와를 나자프에서 선포해야 합니다!"
 IRQ_storm_the_american_embassy: "미국 대사관 점거"
 IRQ_storm_the_american_embassy_desc: "마침내 압제의 아성인 미국 대사관을 장악할 때가 왔습니다. 우리에 앞서 그랬던 이란의 사례처럼, 우리나라는 더 이상 만만한 상대로 여겨지지 않을 것입니다."
 IRQ_soleimani_presence: "솔레이마니의 참여"
 IRQ_soleimani_presence_desc: "거셈 솔레이마니를 초청하여 일부 병력을 자문하게 하면 미국의 압제에서 벗어나는 과정을 가속할 수 있습니다."
 IRQ_iranian_irgc_experts: "IRGC 전문가"
 IRQ_iranian_irgc_experts_desc: "IRGC는 규모가 충분히 크고 충분히 단련되어 있어, 국내의 미국 위협에 대처하는 방법에 대해 조언을 해 줄 수 있습니다."
 IRQ_status_quo_najaf: "나자프의 현상 유지"
 IRQ_status_quo_najaf_desc: "나자프를 우리의 작전 기지로 삼아 미국 점령군에 맞선 계획을 준비하고 조율하겠습니다."
 IRQ_iranian_quds_operations: "쿠드스 훈련"
 IRQ_iranian_quds_operations_desc: "이란 IRGC의 쿠드스군을 초청하여 필요할 때 미군에 맞서 싸울 수 있도록 우리 병력에게 필요한 훈련을 제공하게 하겠습니다."
 IRQ_national_rallies: "전국 집회"
 IRQ_national_rallies_desc: "대중은 미국에 맞서 일어서야 하며, 점령군의 인기가 없음을 보여 주기 위해 민중 집회를 조율하겠습니다."
 IRQ_sunni_leadership: "수니파 지도부"
 IRQ_sunni_leadership_desc: "사회 여러 분야에서 수니파 지도력을 장려함으로써 세계에 우리가 종파주의를 용인하지 않음을 보여 줄 수 있습니다."
 IRQ_sunni_representation: "수니파 대표성"
 IRQ_sunni_representation_desc: "우리는 정부와 나라에서 수니파 주민을 대표하기만 하면 되며, 그 이상은 크게 필요하지 않습니다."
 IRQ_al_malikis_strings: "알말리키의 끈"
 IRQ_al_malikis_strings_desc: "말리키는 매우 나약한 인물이며 쉽게 휘둘릴 수 있습니다. 우리 정부의 대표가 아닌 인물이 필요한 우리의 야망과 목표를 달성하는 데 그를 이용하겠습니다."
 IRQ_walking_the_fine_line: "줄타기"
 IRQ_walking_the_fine_line_desc: "우리나라는 아주 오랫동안 강대국들 사이에서 줄타기를 해 왔으며, 이제 입장을 취할 때입니다."
 IRQ_tehrans_shield: "테헤란의 방패"
 IRQ_tehrans_shield_desc: "우리는 테헤란의 방패가 되어야 합니다. 저항의 축에 합류함으로써 이란 파트너들과 함께 미국의 압제에 맞서 싸울 수 있을 것입니다."
 IRQ_the_regions_shield: "지역의 방패"
 IRQ_the_regions_shield_desc: "우리는 누군가의 도구가 되어서는 안 되며, 오히려 다른 모두를 우리의 도구로 만들어야 합니다. 우리는 모든 형태의 외세 압제에 맞서는 지역의 방패가 될 것입니다."
 IRQ_extending_our_hand: "손을 내밀다"
 IRQ_extending_our_hand_desc: "이 지역의 소외된 많은 나라에 손을 내밀어 그들을 우리 편으로 끌어들여야 합니다."
 IRQ_formation_of_our_coalition: "연합 결성"
 IRQ_formation_of_our_coalition_desc: "팔레스타인과 그 국민을 점령한 시온주의자들에 맞선 연합을 결성해야 하며, 이스라엘 국가가 팔레스타인 국민에 대해 마음대로 행동하도록 두어서는 안 됩니다."
 IRQ_secure_lebanese_support: "레바논의 지지 확보"
 IRQ_secure_lebanese_support_desc: "레바논인들은 이스라엘 북쪽에서 국경을 맞대고 있으므로 그들을 우리 편으로 끌어들여야 합니다."
 IRQ_syrian_backing: "시리아의 후원"
 IRQ_syrian_backing_desc: "시리아인들은 이스라엘을 상대로 한 상당한 전투 경험이 있으므로 그들의 전문성을 활용해야 합니다."
 IRQ_the_hazaras_in_afghanistan: "아프가니스탄의 하자라인"
 IRQ_the_hazaras_in_afghanistan_desc: "지역 패권을 향한 우리의 시도는 레반트에서 끝날 수 없으며, 중앙아시아와 환멸을 느낀 그 민족들로 이어져야 합니다."
 IRQ_the_alevis_in_turkey: "튀르키예의 알레비파"
 IRQ_the_alevis_in_turkey_desc: "수는 적지만 알레비파는 튀르키예인들에게 그들 나라에 어떤 통치 형태가 필요함을 설득하는 데 매우 유용한 동맹이 될 수 있습니다."
 IRQ_contact_palestinian_militias: "팔레스타인 민병대와 접촉"
 IRQ_contact_palestinian_militias_desc: "팔레스타인의 지원 없이 어떻게 팔레스타인을 도울 수 있겠습니까? 이스라엘을 공격할 때를 대비하여 팔레스타인 민병대와 접촉해야 합니다."
 IRQ_the_clock_hits_midnight: "시계가 자정을 가리킨다"
 IRQ_the_clock_hits_midnight_desc: "§R\\"똑딱... 똑딱..\\"§!\n\n이스라엘의 시간은 끝났고 해방의 시간이 도래했습니다."
 IRQ_rejuvination_of_iraq: "이라크의 부활"
 IRQ_rejuvination_of_iraq_desc: "이라크가 힘과 강인함, 독립을 되찾아 부활할 때가 왔습니다. 얼마나 오래 걸리든 이라크 사회의 새 시대를 열 것입니다."
 IRQ_ulama_mobilization: "울라마 동원"
 IRQ_ulama_mobilization_desc: "이라크 사회를 더욱 경건하게 재편하는 막중한 임무를 수행하기 위해 울라마를 동원해야 하며, 우리끼리 할 수는 없습니다."
 IRQ_power_of_the_mosque: "모스크의 힘"
 IRQ_power_of_the_mosque_desc: "모스크의 힘은 아무리 강조해도 지나치지 않습니다. 국민은 자신의 삶이 신과 가까워지는 방식에 따라 어떻게 살아가느냐에 의해 좌우된다는 것을 알아야 합니다."
 IRQ_fight_media_and_propaganda: "언론과 선전에 맞서기"
 IRQ_fight_media_and_propaganda_desc: "우리의 새 정부와 혁명에 맞선 선전이 많이 퍼지고 있습니다. 우리나라와 생활 방식을 위해 이러한 세력에 맞서 싸워야 합니다."
 IRQ_chastity_and_self_respect: "정숙과 자존"
 IRQ_chastity_and_self_respect_desc: "우리 여성들이 매춘부 같은 모습으로 거리에 나설 수는 없으며, 모든 이라크 여성의 정숙과 자존을 지키는 법을 제정해야 합니다."
 IRQ_iraqs_constitution: "우리의 헌법"
 IRQ_iraqs_constitution_desc: "헌법은 국가에 이로운 지위를 확립하는 데 그다지 효과적이지 않았으며 많은 단점이 있습니다. 헌법이 모든 면에서 유익하도록 조정해야 합니다."
 IRQ_islam_over_state_desc: "§R\\"이 땅이 불타게 하라. 이슬람이 나머지 세계에서 승리하기만 한다면 이 땅이 연기가 되어 사라지게 두겠다..\\"§!\n\n이라크는 국가에 대한 애국심이라는 허울에 병들어서는 안 되며, 사람들이 충성을 바쳐야 할 대상은 이슬람이어야 합니다."
 IRQ_the_spring_of_islam: "이슬람의 봄"
 IRQ_the_spring_of_islam_desc: "우리의 혁명과 이념, 가치를 수출할 때가 왔습니다. 이 지역에서 홀로 서 있을 수 없으며, 지역을 우리의 이상에 맞게 정렬하기 위한 행동에 나서야 합니다."
 IRQ_the_revolutions_legacy: "혁명의 유산"
 IRQ_the_revolutions_legacy_desc: "혁명은 우리가 오래전에 사라진 후에도 이라크 사회에 영원한 영향을 남길 것입니다. 혁명의 이상은 언제나 이라크 사회의 모든 면에 깊이 스며들 것입니다."
 IRQ_form_the_pmf: "PMF 정렬"
 IRQ_form_the_pmf_desc: "PMF는 현재 느슨하게 연대한 여러 민병대의 조직입니다. 그들을 한데 모아 이라크군의 더 큰 부분으로 편입시키는 것은 우리에게 달려 있습니다."
 IRQ_iranian_arms_companies: "이란 무기 기업"
 IRQ_iranian_arms_companies_desc: "이란인들은 수십 년 동안 자체적으로 무기를 만들어 왔으며, 그들을 이라크에 사업장을 차리도록 초청하면 유리한 거래를 얻을 수 있습니다."
 IRQ_revive_iraqi_arms_industry: "이라크 무기 산업 부흥"
 IRQ_revive_iraqi_arms_industry_desc: "외국 기업에 집중하는 것은 자살행위와 같으며, 오직 이라크에서 생산된 무기와 이라크 장비에만 의존해야 합니다."
 IRQ_the_army_of_the_revolution: "혁명군"
 IRQ_the_army_of_the_revolution_desc: "쿠데타, 외세의 영향, 침략으로부터 우리의 혁명을 지키기 위한 수단으로 혁명군을 창설해야 합니다."
 IRQ_brigade_twelve: "제12 여단"
 IRQ_brigade_twelve_desc: "제12 여단은 우리의 포용적 이상에 대한 헌신의 증거가 될 것이며, 특히 이라크의 다양성을 우리에게 불리하게 이용하려는 자들에 맞서는 증거가 될 것입니다."
 IRQ_christian_brigades: "기독교 여단"
 IRQ_christian_brigades_desc: "혁명이 이라크의 다양한 종교에 적대적인 의도가 없음을 증명하기 위해, 새로운 기독교 민병대의 창설을 지원하겠습니다."
 IRQ_commands_in_syria: "시리아의 지휘소"
 IRQ_commands_in_syria_desc: "시리아의 혼란을 위장막으로 삼아 그곳에 비밀 지휘소를 설치하겠습니다."
 IRQ_contact_the_russians: "러시아와 접촉"
 IRQ_contact_the_russians_desc: "러시아는 손에 넣기를 기다리는 잠재적 동맹이며, 그 정부와 공식 대화를 시작하기만 하면 됩니다."
 IRQ_integration_into_the_armed_forces: "군으로의 통합"
 IRQ_integration_into_the_armed_forces_desc: "PMF와 이라크의 여러 민병대의 지휘부를 군과 통합하는 것은 스스로를 지킬 수 있는 더 강한 군대를 만드는 데 있어 큰 진전이 될 것입니다."
 IRQ_vilayet_faqi_model: "벨라야테 파키 모델"
 IRQ_vilayet_faqi_model_desc: "이라크에서 매우 특정한 후보와 정당만을 심사하여 허용하는 이란식 기준을 따라야 하며, 위험한 사상이 우리 사회에 스며드는 것을 허용할 수 없습니다."
 IRQ_pluralist_model: "다원주의 모델"
 IRQ_pluralist_model_desc: "이란이 벨라야테 파키로 했던 것처럼 민주주의를 제한할 수는 없으며, 모두에게 기회가 주어져야 합니다."
 IRQ_the_duty_of_voting: "투표의 의무"
 IRQ_the_duty_of_voting_desc: "우리나라의 모든 사람은 여성을 포함해 투표할 의무가 있습니다. 이러한 정서를 장려해야 합니다."
 IRQ_the_islamic_republic_of_iraq: "이라크 이슬람 공화국"
 IRQ_the_islamic_republic_of_iraq_desc: "우리는 독재 국가가 아니라 이슬람 공화국입니다. 이러한 이상은 가능한 한 빨리 이라크 전역으로 퍼져야 합니다."
 IRQ_the_door_to_iraq: "이라크로 향하는 문"
 IRQ_the_door_to_iraq_desc: "우리의 문은 호의적이든 적대적이든 언제나 외교를 향해 열려 있어야 합니다. 이렇게 넓은 세상에서 우리 스스로를 고립시킬 수 없습니다."
 IRQ_the_lions_den_desc: "이란은 오랫동안 특히 이라크와 이라크인에게 적대적인 강대국이었습니다. 그들이 마침내 얌전하게 처신하기 시작할 만큼 강하게 타격해야 합니다."
 IRQ_petition_for_american_support: "미국의 지원 요청"
 IRQ_petition_for_american_support_desc: "이란의 위협을 제거하기 위해 미국과 접촉해야 합니다. 어쨌든 친구가 한 명 더 있으면 유용할 것입니다."
 IRQ_petition_for_saudi_support: "사우디의 지원 요청"
 IRQ_petition_for_saudi_support_desc: "이들에게 많은 것을 말할 필요는 없습니다. 우리가 결국 승리할 것이며 그들이 석유를 얻게 될 것이라는 점만 알면 충분합니다."
 IRQ_on_our_own: "독자적으로"
 IRQ_on_our_own_desc: "이란의 위협을 물리치는 데 외국의 도움은 필요하지 않으며, 우리 힘만으로 모두 해낼 수 있습니다."
 IRQ_arm_the_west: "서부 무장"
 IRQ_arm_the_west_desc: "이란의 서부 지역은 대부분 쿠르드인으로 가득하며 일부 지역에는 아랍인도 있습니다."
 IRQ_king_of_the_animal_kingdom: "정글의 왕 폐위"
 IRQ_king_of_the_animal_kingdom_desc: "모든 혼란을 일으키는 왕좌에서 이란인들이 마침내 끌려 내려올 때가 왔습니다."
 IRQ_arab_friends: "아랍의 형제들?"
 IRQ_arab_friends_desc: "모든 아랍인은 우리의 형제이지만, 자국의 아랍인 시민을 억압하는 데 혈안이 되어 있다면 과연 모두가 우리의 형제일 수 있을까요?"
 IRQ_voice_of_the_voiceless: "말 없는 이들의 목소리"
 IRQ_voice_of_the_voiceless_desc: "이라크는 아랍 세계에서 말 없는 이들의 목소리가 되어야 합니다. 억압이 승리해서는 안 됩니다!"
 IRQ_the_worth_of_the_people: "민중의 가치"
 IRQ_the_worth_of_the_people_desc: "[SAU.GetName]의 아랍 민중은 자신들의 진정한 가치를 알아야 하며, 우리는 그들이 그것을 알도록 하겠습니다."
 IRQ_arab_worlds_leader: "아랍 세계의 지도자"
 IRQ_arab_worlds_leader_desc: "우리의 정책을 통해 아랍 세계의 정점에 오를 것입니다. 우리는 아랍 세계의 선도적 인물로 여겨질 것입니다!"
 IRQ_diplomacy_through_faith: "신앙을 통한 외교"
 IRQ_diplomacy_through_faith_desc: "우리의 유일한 공통 신념인 이슬람을 통해 외교 행위를 수행해야 합니다. 우리의 신앙이 우리에게 주는 이점은 훼손될 수 없습니다."
 IRQ_security_guarantees: "안보 보장"
 IRQ_security_guarantees_desc: "상호 안전을 보장함으로써 우리는 모두를 위한 더욱 안정적인 중동에 한 걸음씩 다가갈 것입니다."
 IRQ_the_nuclear_program: "핵 계획"
 IRQ_the_nuclear_program_desc: "우리의 핵 계획은 오랫동안 교착 상태에 머물렀으며, 목표한 바를 제대로 이룬 적이 없습니다. 그러나 오늘 그 모든 것이 바뀔 것입니다."
 IRQ_acquire_the_resources: "자원 확보"
 IRQ_acquire_the_resources_desc: "핵무기를 손에 넣으려면 먼저 자원을 확보해야 합니다."
 IRQ_a_new_energy_source: "새로운 에너지원"
 IRQ_a_new_energy_source_desc: "원자로를 무기화에만 사용하는 대신, 국민에게 전력을 공급하는 데에도 쉽게 활용할 수 있습니다."
 IRQ_experts_in_the_field: "분야의 전문가"
 IRQ_experts_in_the_field_desc: "우리는 이제 원자력 에너지와 생산, 그리고 그에 수반되는 모든 분야에서 세계적인 전문가로 인정받고 있습니다."
 iraqi_events.1.t: "신년 보고서"
 iraqi_events.1.d: "2000년이 이라크에 밝아 오면서, 나라는 안정과 발전을 위협하는 수많은 중대한 과제와 씨름하고 있습니다. 이라크는 걸프전 이후 부과된 국제 제재의 숨 막히는 여파와 계속 싸우고 있습니다. 이러한 제재는 국가가 기반시설을 재건하고 경제를 되살리며 시민에게 필수 서비스를 제공할 능력을 심각하게 저해했습니다. 무역과 금융 거래에 대한 제한으로 경제는 정체되고, 높은 실업률과 만연한 빈곤이 나타났습니다. 자원의 부족과 핵심 기술에 대한 제한된 접근은 이라크의 어려움을 더욱 악화시킵니다. 게다가 대량살상무기 추구와 인권 침해 의혹에 대한 국제사회의 의심이 가시지 않아 이라크의 정치적 고립은 계속되고 있습니다. 이러한 고립은 이라크가 결실 있는 외교 관계를 맺고 상호 이익이 되는 협력 관계에 참여하며 세계 무대에서 정당한 위치를 되찾는 능력을 저해합니다. 내부적으로 이라크는 자원의 부실한 관리와 구조적 부패, 불충분한 공공 서비스로 인해 깊이 뿌리내린 사회적 불만에 직면해 있습니다. 이러한 문제들은 대중의 좌절과 정부에 대한 신뢰 하락, 그리고 국민 사이에 커지는 환멸감으로 이어졌습니다. 이러한 불만을 해소하는 것은 사회적 결속을 조성하고 이라크 국민의 안녕을 보장하는 데 결정적입니다."
 iraqi_events.1.a: "흥미롭군"
 iraqi_events.2.t: "이라크, 우리에게 지원 요청"
 iraqi_events.2.d: "이라크 전쟁의 여파와 서방이 임명한 새로운 민주 정부의 출범으로, 이 새 정부에 유리한 상황은 많지 않은 듯합니다. 그에 따라 그들은 동맹국인 우리에게 지원을 요청하고 있습니다. 그렇다면 그들의 지원 제안에 어떻게 응답해야 합니까?"
 iraqi_events.2.a: "그들을 돕는다!"
 iraqi_events.2.b: "이라크를 신경 쓸 겨를이 없다."
 iraqi_events.3.t: "이라크, 에너지 투자 요청"
 iraqi_events.3.d: "이라크에서 미국의 광기가 침공과 함께 끝난 이후, 이제 새로운 이라크 정부는 우리를 특별히 포함해 지역 내 협력적인 입장을 모색하는 것으로 보입니다. 이라크의 기반시설과 에너지가 큰 피해를 입었기 때문에, 그들은 지역에서 영향력이 있는 모든 나라에 자국의 안정을 되찾는 데 도움을 달라고 요청하는 듯합니다. 그들은 우리도 전기와 가스 수입 분야에서 역할을 해 주기를 원하는 것 같습니다. 이라크에서의 우리 영향력이 커질 것이므로 이는 분명 우리에게 솔깃한 제안입니다. 그들의 제안에 어떻게 응답해야 합니까?"
 iraqi_events.3.a: "물론이다!"
 iraqi_events.3.b: "이라크를 신경 쓸 겨를이 없다."
 iraqi_events.4.t: "이란의 수락"
 iraqi_events.4.d: "곧 이란 기술자들이 우리나라에 새로운 발전소를 건설하기 위해 도착할 것입니다! 우리는 이란의 이 정말 훌륭한 투자를 결코 잊지 않을 것입니다."
 iraqi_events.4.a: "고맙다"
 iraqi_events.5.t: "이란의 거절"
 iraqi_events.5.d: "그들은 우리에게 그다지 관심이 없었던 듯합니다."
 iraqi_events.5.a: "슬프군"
 iraqi_events.6.t: "이라크, 우리의 기술자 요청"
 iraqi_events.6.d: "이라크 정부는 산업과 기반시설을 재건하고 더 빠른 성장을 이룰 수 있도록 우리 기술자 일부를 파견해 달라고 요청했습니다. 그들이 우리 기술자의 도움을 받을 자격이 있습니까?"
 iraqi_events.6.a: "찬성"
 iraqi_events.6.b: "안된다"
 iraqi_events.7.t: "이라크의 제안"
 iraqi_events.7.d: "뜻밖에도 이라크로부터 경제적 제안을 받았으며, 이는 물론 대부분 에너지와 관련되어 있습니다. 우리가 그들의 나라에 새 발전소 건물을 건설해 주는 대가로, 경제 및 산업 지원을 위해 그들의 \\"고문\\"을 우리나라에 보내겠다고 제안하는 것으로 보입니다.\n이 제안은 손해 볼 것이 없지 않습니까?"
 iraqi_events.7.a: "발전소."
 iraqi_events.7.b: "기반시설."
 iraqi_events.7.c: "없음."
 iraqi_events.8.t: "저항의 새로운 시대"
 iraqi_events.8.d: "의심할 여지없이 이라크의 저항은 저항의 축의 필수적인 일부였고 지금도 그렇습니다. 이슬람 혁명의 성공 이후 이 점은 더욱 분명해졌으며, 특히 바그다드에 있는 우리 형제들의 제안으로 더욱 그러합니다.\n이라크는 우리에게 서아시아의 새로운 경제 연합을 요청하고 있으며, 이는 이라크와 이란에서 시작하여 지역 전체로 퍼져 나갈 것입니다. 중국과 러시아에는 BRICS와 SCO가 있고, 유럽에는 EU가 있습니다. 따라서 움마를 위한 하나의 연합을 만드는 것은 저항 세력의 의무입니다.\n이 제안이 실행에 옮겨진다면 저항 세력과 이슬람 세계는 새로운 시대로 접어들 것입니다."
 iraqi_events.8.a: "물론이다"
 iraqi_events.8.b: "그럴 필요는 없다."
 iraqi_events.9.t: "이란의 동의!"
 iraqi_events.9.d: "이란이 우리가 제안한 새로운 경제 연합에 가입하는 데 동의했으며, 이는 이 지역에 대한 우리의 경제적 영향력을 공고히 하는 데 도움이 됩니다."
 iraqi_events.9.a: "좋아"
 iraqi_events.10.t: "이란의 거부!"
 iraqi_events.10.d: "이란이 우리의 경제 연합에 참여하기를 거부하여 지역 전반에서 우리의 경제적 영향력이 약해졌습니다.."
 iraqi_events.10.a: "젠장"
 iraqi_events.11.t: "이란과 이라크, 우리에게 연합 가입 요청"
 iraqi_events.11.d: "오늘 아침 일찍, 이라크 대사 중 한 명이 이란 대표를 포함한 외교 서신을 우리에게 전달했으며, 새롭게 떠오르는 \\"이슬람 번영 연합\\"에 관한 것으로 보입니다. 우리가 시아파 국가이고 저항의 축과도 가깝다는 사실 때문에 이라크와 이란 모두 우리에게 이 새로운 연합에 가입하라고 요청했습니다. 이 연합의 이점은 분명 우리에게 진정으로 \\"번영\\"을 가져다줄 것입니다."
 iraqi_events.11.a: "그들과 함께하겠다."
 iraqi_events.11.b: "관심 없다."
 iraqi_events.12.t: "[FROM.GetName]의 거절!"
 iraqi_events.12.d: "[FROM.GetName]은(는) 우리의 새로운 경제 연합에 관심이 없다고 결정했으며 이 연합을 공개적으로 비난했습니다."
 iraqi_events.12.a: "그들은 이를 후회하게 될 것이다."
 iraqi_events.14.t: "연합에서 추방된 귀국"
 iraqi_events.14.d: "귀국의 쓸모없는 본성 때문에 우리는 더 이상 귀국과 협력하고 싶지 않습니다. 귀국이 우리 경제 연합에 가져다준 유일한 경제적 진전은 전진이 아니라 후퇴였습니다.\n\n사랑을 담아,\n[IRQ.GetLeader]"
 iraqi_events.14.a: "뭐라고?"
 iraqi_events.15.t: "이라크, 투자 요청"
 iraqi_events.15.d: "이라크 정부는 경제 성장을 촉진하는 수단으로 우리나라가 그들의 나라에 투자하는 것을 고려해 달라고 요청하고 있습니다."
 iraqi_events.15.a: "알겠다"
 iraqi_events.15.b: "안된다"
 iraqi_events.16.t: "러시아의 투자!"
 iraqi_events.16.d: "러시아 정부는 우리나라에 투자하기 위해 일정 금액을 배정하기로 결정했습니다."
 iraqi_events.16.a: "좋아"
 iraqi_events.17.t: "러시아, 투자 거부"
 iraqi_events.17.d: "러시아 정부는 이라크에 투자할 필요가 없다고 판단했으며, 이에 따라 우리의 요청을 거절했습니다."
 iraqi_events.17.a: "젠장"
 iraqi_events.18.t: "이라크, 무역 관계 확대 희망"
 iraqi_events.18.d: "이라크 정부는 최근 이웃 국가들과의 무역 관계를 개선하는 임무에 나섰으며, 우리에게 접근하여 무역 관계 확대를 요청했습니다."
 iraqi_events.18.a: "알겠다"
 iraqi_events.18.b: "안된다"
 iraqi_events.19.t: "사우디의 동의!"
 iraqi_events.19.d: "사우디 정부는 우리와의 무역 관계를 개선하는 데 관심이 있다고 결정했으며, 이는 양국에 수많은 기회의 문을 열어 줍니다."
 iraqi_events.19.a: "좋아"
 iraqi_events.20.t: "사우디의 거부!"
 iraqi_events.20.d: "사우디 정부는 거만하게 굴기로 결정했으며 무역 관계 확대에 대한 우리의 요청을 거절했습니다."
 iraqi_events.20.a: "알겠다"
 iraqi_events.21.t: "암거래 무기 판매"
 iraqi_events.21.d: "우리나라에 부과된 UN 제재에도 불구하고, 일부 부패한 정치인들은 여전히 대가를 받고 이라크에 무기를 빼돌릴 의향이 있습니다. 또한 이 지역에는 우리가 수수료를 지불한다면 기꺼이 무기를 팔려는 여러 민병대와 무장 단체도 있습니다."
 iraqi_events.21.a: "[USA.GetFlag] 미국의 부패한 관료들과 접촉"
 iraqi_events.21.b: "[PER.GetFlag] 이란의 관료들과 접촉"
 iraqi_events.21.c: "지역의 무장 단체들과 접촉"
 iraqi_events.22.t: "라자비와의 회담"
 iraqi_events.22.d: "내각은 이번 주 후반 바그다드에서 회담을 개최할 계획이며, 이란의 커지는 공격성이 핵심 의제가 될 것입니다. 우리는 £PER_anarchist_communism 라자비와 그의 조직에 대한 우리의 영향력을 활용하여 이란에 대항할 수 있습니다."
 iraqi_events.22.a: "£PER_anarchist_communism MEK 장군 요청"
 iraqi_events.22.b: "이란 대응에 집중하라고 요청"
 iraqi_events.23.t: "[ISR.GetFlag] 이스라엘 심기 건드리기"
 iraqi_events.23.d: "[ISR.GetFlag] 이스라엘은 아무런 대가도 치르지 않고 지역 세력들에 대한 일련의 공격을 벌여 왔으며, 이제 그들에게 교훈을 줄 때입니다. 그러나 [USA.GetFlag] 미국이 눈치챌 수 있으므로 행동에 주의해야 합니다.."
 iraqi_events.23.a: "산업 태업 자금 지원"
 iraqi_events.23.b: "[ISR.GetLeader]에 대한 비방 캠페인 자금 지원"
 iraqi_events.24.t: "우다이의 문제"
 iraqi_events.24.d: "우다이 후세인(사담 후세인의 아들)은 현지인들 사이에서 공포의 존재로 알려져 있습니다. 그는 잔혹한 고문 방식으로 악명이 높으며 나라 안에서 민간인을 상대로 한 여러 범죄 혐의를 받아 왔습니다. 그의 존재는 주민들 사이에 공포를 불러일으키며, 그 결과 그는 그다지 인기가 없습니다."
 iraqi_events.24.a: "아니, 공포가 그들을 억제할 것이다"
 iraqi_events.24.b: "그의 범죄를 은폐한다"
 iraqi_events.25.t: "지역 수니파 지도자들과의 회담"
 iraqi_events.25.d: "우리나라의 수니파 인구는 소수로 간주됩니다. 그러나 근소한 차이일 뿐입니다. 이는 수니파 모스크와 지도자들이 여전히 상당한 영향력을 가지고 있으며, 우리가 그들을 우리에게 유리하게 활용할 수 있음을 의미합니다.."
 iraqi_events.25.a: "모스크 세금 징수"
 iraqi_events.25.b: "사담의 좋은 말씀을 전파하라고 지시"
 iraqi_events.26.t: "시리아 바트당원 지원"
 iraqi_events.26.d: "우리의 이자트 이브라힘 알두리 장군이 시리아 바트당 내전에서 우리 측을 이끌기 위해 나섰습니다. 그러나 그가 데려간 병력은 턱없이 부족하며, 특히 러시아가 개입할 가능성이 있는 만큼 추가적인 이라크 병력이 필요할 것입니다."
 iraqi_events.26.a: "알겠다"
 iraqi_events.27.t: "요르단 바트당원 지원"
 iraqi_events.27.d: "아크람 알홈시는 요르단 정부에 맞서 싸우기 위해 지지자들을 결집했습니다. 그는 완전한 승리를 확보하는 데 필요한 자원과 지원을 보내 달라고 우리 정부에 요청하고 있습니다."
 iraqi_events.27.a: "알겠다"
 iraqi_events.31.t: "이집트 바트당원 지원"
 iraqi_events.31.d: "우리 정부는 타리크 아지즈 부총리를 임명하여 이집트 정부에 대한 공세를 이끌게 했습니다. 타리크는 이집트에서 우리 당의 완전한 승리를 보장하겠지만, 우리의 지원이 필요할 것입니다. 우리는 그의 병력과 나란히 싸울 개입 병력을 파견할 것입니다."
 iraqi_events.31.a: "알겠다"
 iraqi_events.28.t: "[SAU.GetLeader]의 비밀 발견!"
 iraqi_events.28.d: "우리의 비밀 요원들이 [SAU.GetLeader]에 관한 매우 개인적인 비밀을 알아냈습니다. 보고서의 내용에는 그의 비밀이 구체적으로 무엇인지 명시되어 있지 않지만, 그를 압박하여 우리의 요구를 받아들이게 하기에 충분할 만큼 좋지 않은 것일 가능성이 높습니다."
 iraqi_events.28.a: "좋아"
 iraqi_events.29.t: "비밀 요원들, [SAU.GetLeader]의 비밀을 찾지 못함"
 iraqi_events.29.d: "안타깝게도 [SAU.GetName]에 파견한 요원들은 [SAU.GetLeader]에 대한 구체적인 비밀을 찾지 못한 듯합니다."
 iraqi_events.29.a: "다시 시도하라!"
 iraqi_events.30.t: "[SAU.GetFlag] 아람코에서 소폭의 성과"
 iraqi_events.30.d: "우리의 새로운 투자가 어느 정도 결실을 맺어 [SAU.GetFlag] 아람코에 대한 통제에서 소폭의 성과를 거두었습니다."
 iraqi_events.30.a: "좋아"
 iraqi_events.32.t: "[SAU.GetFlag] 아람코에서 괜찮은 성과"
 iraqi_events.32.d: "우리의 새로운 투자가 결실을 맺어 [SAU.GetFlag] 아람코에 대한 통제에서 괜찮은 성과를 거두었습니다."
 iraqi_events.32.a: "좋아"
 iraqi_events.33.t: "[SAU.GetFlag] 아람코에서 큰 성과"
 iraqi_events.33.d: "우리의 새로운 투자가 크게 결실을 맺어 [SAU.GetFlag] 아람코에 대한 통제에서 큰 성과를 거두었습니다."
 iraqi_events.33.a: "좋아"
 iraqi_events.34.t: "[SAU.GetFlag] 아람코에서 손실 발생"
 iraqi_events.34.d: "우리의 새로운 투자가 실패로 돌아가 [SAU.GetFlag] 아람코에 대한 통제권을 둘러싼 시장에서 손실을 입었습니다."
 iraqi_events.34.a: "젠장"
 iraqi_events.35.t: "[SAU.GetFlag] 아람코는 우리 것"
 iraqi_events.35.d: "오늘 수개월간의 노력과 책략 끝에 우리는 [SAU.GetFlag] 아람코에 대한 완전한 통제권을 장악할 수 있었습니다. 우리의 막강한 영향력 덕분에 [SAU.GetFlag] [SAU.GetLeader]이(가) 자국의 [SAU.GetFlag] 아람코 소유권을 포기하고 우리의 인수를 합법화하는 공식 이전을 하도록 만들 수도 있었습니다."
 iraqi_events.35.a: "마침내"
 iraqi_events.36.t: "[SAU.GetFlag] 아람코 장악 지연"
 iraqi_events.36.d: "[SAU.GetFlag] 아람코의 일부 고위 직원들이 우리의 계획을 눈치채면서 [SAU.GetFlag] 아람코를 장악하려던 우리의 계획이 지연되었고, 우리의 평판에 심각한 타격을 입었습니다."
 iraqi_events.36.a: "젠장"
 iraqi_events.37.t: "바레인, NSA 바레인 기지 철수 요구"
 iraqi_events.37.d: "바레인은 NSA 바레인 기지를 회수하고 자국 영토에서 우리 병력을 철수시켰습니다. 이는 아마도 이 지역에서 이라크의 영향력이 확대된 결과일 것입니다.."
 iraqi_events.37.a: "제재 부과"
 iraqi_events.38.t: "[IRQ.GetFlag] 이라크, 옛 항공기 반환 요구"
 iraqi_events.38.d: "최근 테헤란에 도착한 [IRQ.GetFlag] 이라크 외교관들이 그들의 오래된 비행기를 되돌려 달라고 요청하고 있습니다. 우리가 현재 보유하고 있는 [IRQ.GetFlag] 이라크 비행기 중 일부는 1991년 걸프 전쟁 중 [PER.GetFlag] 이란으로 날아갔습니다. 우리는 그 기회를 포착하여, 80년대 전쟁에 대한 배상으로 이 비행기들을 수거했습니다. 이제 [IRQ.GetFlag] 이라크 외교관들이 그 비행기들을 돌려달라고 요청하지만, 우리는 이미 그 비행기들로 몇몇 파일럿을 훈련시킨 상태입니다."
 iraqi_events.38.a: "정중하게 요청했으니..."
 iraqi_events.38.b: "왜 굳이 요청하는 건가?"
 iraqi_events.39.t: "[PER.GetFlag] 이란, 우리의 옛 항공기 반환"
 iraqi_events.39.d: "[PER.GetFlag] 이란 정부는 오늘 늦게 우리의 옛 항공기를 바그다드의 공군기지로 비행시켜 보내는 준비를 시작했습니다."
 iraqi_events.39.a: "참으로 친절하군"
 iraqi_events.40.t: "[PER.GetFlag] 이란, 우리의 옛 항공기 반환 거부"
 iraqi_events.40.d: "[PER.GetFlag] 이란 정부는 해당 항공기가 1980년부터 1988년까지 양국 간 분쟁에 대한 배상이었다고 밝히며 우리 외교관들을 돌려보냈습니다."
 iraqi_events.40.a: "빌어먹을 도둑놈들.."
 iraqi_events.41.t: "1991년의 여파"
 iraqi_events.41.d: "미국의 폭격 작전은 우리나라의 산업과 경제에 심각한 상처를 남겼고, 많은 물자의 부족을 초래했으며 경제 재건의 필요성을 낳았습니다. 우리나라를 재건하기 위해 모든 힘을 결집해야 합니다."
 iraqi_events.41.a: "우리는 승리할 것이다"
 iraqi_flavor_events.1.t: "이라크, 아람코 통제권 장악"
 iraqi_flavor_events.1.d: "오늘 오후 2시 리야드에서 열린 기자회견에서 이라크 지도자 [IRQ.GetLeader]은(는) 아람코가 이제 이라크의 직접 통제 하에 놓일 것이라고 발표했습니다. 발표를 합법화하기 위해 그는 인정과 순응의 표시로 [SAU.GetAdjective] 지도자 [SAU.GetLeader]을(를) 자신의 곁에 앉혔습니다. 이는 이라크가 이제 [SAU.GetName]의 유전에 대한 직접 통제권을 갖게 되며, 석유 시장에 대한 완전한 독점이 형성됨을 의미합니다."
 iraqi_flavor_events.1.a: "좋지 않은 일이다"
 iraqi_flavor_events.2.t: "바레인 정부 퇴진"
 iraqi_flavor_events.2.d: "나라 안의 친이라크 민병대로부터의 압박이 가중되자 바레인 지도자는 민족민주회의에 자리를 내주고 물러나기로 했습니다. 바레인의 새 정부는 이라크와의 '새로운 동반자 시대'를 선언했으며, 바레인의 주요 석유 기업인 BAPCO의 권리를 후세인 가문에 이전했습니다."
 iraqi_flavor_events.2.a: "저쪽에서는 무슨 짓을 하고 있는 거지?"
 iraqi_flavor_events.3.t: "미군, 이라크에서 철수"
 iraqi_flavor_events.3.d: "수개월에 걸친 치열한 전투 끝에 [USA.GetLeader]은(는) 이라크에서의 미군 전면 철수를 발표했으며, 즉각적인 적대 행위를 끝내는 휴전 협정에 서명했습니다. 정치적으로는 이라크 기반시설의 상당 부분이 폐허로 변했음에도 [IRQ.GetLeader]이(가) 승리자로 부상했습니다. 미군의 철수는 이 지역에서 미국의 영향력에 큰 타격을 주었으며, 이라크는 지역에서의 공격적인 야망을 추구하는 데 그 어느 때보다 대담해졌습니다. 일부는 지역 패권을 노리는 이라크가 이웃 국가들, 특히 사우디아라비아와 이란에 공격성을 드러낼 것을 우려하고 있습니다. [IRQ.GetLeader]은(는) 오늘 늦게 미국과 그 동맹국들의 패배를 선언하는 연설을 할 것이라고 합니다."
 iraqi_flavor_events.3.a: "이라크의 승리?"
 iraqi_flavor_events.4.t: "이라크군 와해"
 iraqi_flavor_events.4.d: "미군은 이라크군에 전면적인 파괴를 가했으며, 전투에서 이를 완전히 섬멸하고 남은 병력을 해산시켰습니다. 연합군 임시 당국 명령 2호에 따라 사담 후세인의 군사, 보안 및 정보 기반이 해체되었습니다. 임시 정부가 이라크에서 권력을 잡았으며 새 헌법이 기초되고 있습니다. 불행히도 이 명령은 계획대로 진행되지 않았습니다. 이라크군의 많은 전직 병사가 도시 곳곳의 거점에서 저항하고 있으며, 일부는 극단주의 단체에 가담하기까지 합니다. 민병대가 이미 전국 곳곳에서 생겨나기 시작했고, 시아파 민병대는 지역의 다른 강대국들로부터 자금을 지원받고 있습니다"
 iraqi_flavor_events.4.a: "미국이 다시 한번 힘을 과시한다"
 iraqi_flavor_events.5.t: "시아파 무장 세력, 이라크 분쟁에 가담"
 iraqi_flavor_events.5.d: "이라크 정부와 시아파 민병대 사이의 여러 차례 협상이 실패한 후, 시아파 무장 세력이 정부 초소를 공격하기 시작하면서 모든 형태의 외교적 소통이 단절된 듯합니다. 이제 연합군은 수니파 반군뿐 아니라 시아파 반군과도 맞서 싸워야 하므로, 이는 반란에 맞선 이라크의 싸움에서 위험한 전환점입니다. 반군을 제대로 처리하지 못한다면 분쟁은 이라크 사회의 전면적 붕괴와 심지어 내전으로까지 이어질 수 있습니다."
 iraqi_flavor_events.5.a: "우려스럽다"
 iraqi_flavor_events.6.t: "이라크 내 바트당의 재기"
 iraqi_flavor_events.6.d: "오늘 오전 7시 21분, 이자트 이브라힘 알두리는 '제국주의 시온주의자들에게 협력하고 동조한' 모든 자들을 체포하여 재판에 회부하기 위해 자신의 병력이 바그다드로 진군할 것이라고 발표했습니다. 알두리는 상당한 규모의 병력을 지휘하고 있으며, 그 가운데 다수는 사담 후세인 치하 바트 정권에 충성하던 전직 지휘관과 병사들입니다. 사담 정권 붕괴 이후 이라크는 비교적 불안정한 상태에 놓였으며, 최근의 사태가 그 갈등의 결정적 분기점이 되었습니다. 많은 이라크인, 특히 수니파는 알두리와 그의 바트당이 이라크의 패권과 구정권 아래에서 누렸던 안전을 되찾아 주기를 바라고 있습니다. 당분간 이라크인들은 자신들이 휘말리게 될 내전을 견뎌 내야 할 것입니다."
 iraqi_flavor_events.6.a: "와"
 iraqi_flavor_events.7.t: "이라크 이슬람 공화국을 이끄는 아야톨라 알시스타니"
 iraqi_flavor_events.7.d: "이라크 이슬람 혁명 이후 아야톨라 알리 시스타니가 최고 지도자의 자리에 올랐습니다. 불리하게 작성된 헌법은 이라크 시아파를 크게 분노하게 하였고, 이들은 미국이 주도하는 연합군이 세운 새 이라크 정부에 맞서 하나의 전선을 형성했습니다. 이란과 여러 시아파 민병대의 지원을 받은 이라크 혁명가들은 수개월에 걸쳐 여러 주요 정부 건물을 급습했으며, 종종 보안군을 압도했습니다. 그 결과 이라크 장교 대다수는 분쟁에 개입하지 않을 것이며 집권하는 어떤 정권에도 충성하겠다고 선언했습니다. 미국과 기타 연합군은 자국 병력을 위험으로부터 보호하기 위해 인접한 요르단과 사우디아라비아로 병력을 철수시킬 준비를 시작했습니다."
 iraqi_flavor_events.7.a: "우려스럽군"
 iraqi_flavor_events.8.t: "이라크를 휩쓴 사드르 운동"
 iraqi_flavor_events.8.d: "무크타다 알사드르와 그의 지지자들은 마흐디 군(사드르의 군대)의 지원을 받아 군부가 운영하던 이라크 정부를 전복했습니다. 사드르와 지지자들은 명확한 이유는 밝히지 않은 채 다와당과 바드르 조직을 금지하겠다고 발표했습니다. 많은 이들은 사드르가 이라크를 사담의 구정권과 유사한, 다만 이번에는 시아파 독재 체제로 이끌 것을 우려하고 있습니다."
 iraqi_flavor_events.8.a: "흥미롭군"
 iraqi_flavor_events.9.t: "승리를 거머쥔 바드르 여단"
 iraqi_flavor_events.9.d: "중앙 정부의 붕괴와 정부가 수립한 과도 정부 이후, 이라크는 피비린내 나는 내전을 겪었습니다. 바드르 조직과 여단은 주로 남부에 위치한 시아파 다수 지역의 주민들로부터 충분한 지지를 모아 중앙 정부에 대한 전면 공격을 개시할 수 있었습니다. 최근 보고에 따르면 군사 정권의 군 지도부는 인접 국가로 도피했으며, 국내에 남은 병력과의 모든 연락도 끊은 것으로 알려졌습니다. 그럼에도 바드르 조직은 반대편에서 전쟁에 참여한 모든 이를 용서하겠다고 서약했으며, 이슬람 공화국을 수립하기 위한 절차를 밟고 있습니다."
 iraqi_flavor_events.9.a: "흥미롭군"
 iraq_war.1.t: "전쟁을 위한 청원을 개시한 미국!"
 iraq_war.1.d: "미국인들은 우리 영토를 공격하고 우리에게 남은 얼마 안 되는 것마저 빼앗기 위한 UN 청원을 시작했습니다. 그들의 주요 목표는 우리 정부를 전복하고 괴뢰 정부를 세우는 것이며, 이를 위해서라면 무력 충돌을 포함한 모든 수단을 동원할 의지가 있습니다. 미국이 [IRQ.GetLeader]을(를) 체포하여 재판에 세우려 한다는 소문이 국내에 퍼지고 있으며, 이는 중앙 정부에 일부 두려움을 안겨 주었습니다..."
 iraq_war.1.a: "우리 땅에 오는 자는 누구든 맞서 싸울 것이다!"
 iraq_war.1.b: "요르단 날씨가 참 좋다더군"
 iraq_war.11.t: "도피하는 이라크 지도부"
 iraq_war.11.d: "[IRQ.GetName]의 최고위 지도자들과 장군들이 국외로 도피하여 요르단 내 미확인 장소로 향했습니다. 보도에 따르면 이라크 정부는 수십억 달러를 가지고 망명길에 올랐습니다."
 iraq_war.11.a: "도망칠 수는 있어도, 미국 납세자의 돈이 그들을 찾아낼 것이다"
 iraq_war.2.t: "최후통첩"
 iraq_war.2.d: "이제 우리가 [IRQ.GetName]에 대해 직접 행동에 나서야 할 때가 왔습니다. 그들의 파괴적이고 무분별한 행태는 우리 국가와 세계 나머지 지역을 위험에 빠뜨렸습니다. [IRQ.GetLeader]과(와) 그의 아들들에게 경고를 공개적으로 방송할 수도 있고, 기습의 이점이 있을 때 진입하여 타격할 수도 있습니다.."
 iraq_war.2.a: "국민에게 알려야 한다"
 iraq_war.2.b: "독재자와는 협상할 수 없다"
 iraq_war.3.t: "[USA.GetName]의 최후통첩 전달"
 iraq_war.3.d: "전 세계 많은 가정으로 [USA.GetLeader]의 연설이 방송되었습니다. 그의 연설에는 터무니없고 우스꽝스러운 주장이 가득했습니다. 미국인들은 우리에게 국가의 통제권을 넘기고, '자유롭고 공정한 선거'를 허용할 과도 정부를 미국이 수립하도록 허락하라고 요구했습니다. 그들은 우리에게 짐을 싸서 떠날 한정된 시간을 주었습니다."
 iraq_war.3.a: "내가 떠나기 전에 우리 땅은 붉게 물들 것이다!"
 iraq_war.3.b: "요르단행 표가 요즘 엄청 싸다고 들었는데.."
 iraq_war.4.t: "[IRQ.GetLeader]의 최후통첩 거부"
 iraq_war.4.d: "이라크인들에게 제시한 우리의 관대한 제안이 [IRQ.GetLeader]에 의해 거부되었습니다. 그가 남기로 한 결정은 수백만 명을 직접적인 포화 속에 몰아넣을 뿐이지만, 자유는 어떤 수단을 써서라도 이라크 국민에게 전달되어야 합니다."
 iraq_war.4.a: "이라크 자유 작전을 개시한다"
 iraq_war.5.t: "이라크 자유 작전"
 iraq_war.5.d: "우리 국민들 사이에서 이라크와의 즉각적인 휴전을 요구하는 대규모 반전 시위가 일어났습니다. 이라크 방어군이 우리 병력에 완강히 저항하면서 이라크 자유 작전은 계획대로 진행되지 않았고, 우리는 지역적 야망을 포기하거나 고통을 감수하고 새로운 공세로 밀어붙여야 하는 어려운 상황에 처했습니다."
 iraq_war.5.a: "병력 철수를 명령한다"
 iraq_war.5.b: "재편성하고 공세를 재개한다"
 iraq_war.6.t: "퇴각하는 미군"
 iraq_war.6.d: "오늘 [USA.GetLeader] 대통령은 최근의 작전 실패로 인해 이라크 영토에서 철수한다고 발표했습니다. 이는 우리 군이 그들에게 결코 잊지 못할 대패를 안겨 준 결과입니다. 이번 주 후반 바그다드에서는 축하 행사가 열릴 예정입니다."
 iraq_war.6.a: "미국 제국이 흔들리다"
 iraq_war.7.t: "공세를 재개한 [USA.GetFlag] [USA.GetName]"
 iraq_war.7.d: "미국인들은 우리 국가에 대한 군사 공세를 재개하기로 결정했습니다. 지난 6개월간 이라크에서 미군의 실패만이 드러났음에도 이러한 결정이 내려졌습니다. 그들은 3개월 더 전쟁을 치를 자금을 간신히 긁어모았지만, 우리가 2개월 안에 그들을 격파한다면 협상 테이블로 나올 수밖에 없을 것입니다."
 iraq_war.7.a: "우리가 승리할 것이다!"
 iraq_war.8.t: "국가 안보를 위협하는 시위"
 iraq_war.8.d: "이라크에서의 실패로 인해 시위대는 이라크 전쟁의 즉각적인 휴전과 철수를 요구하고 있습니다. 그들의 요구를 받아들이지 않을 경우 우리 경제와 국가 안보가 더욱 위험해질 수 있다는 우려가 있습니다."
 iraq_war.8.a: "젠장, 철수를 명령하라"
 iraq_war.9.t: "군대 붕괴"
 iraq_war.9.d: "미국이 우리 보안군의 완전한 무장 해제를 선언하면서 우리 군은 내부에서부터 무너졌습니다. 새로운 임시 정부가 정부를 재건하고 새 헌법을 기초하는 임무를 맡게 될 것입니다."
 iraq_war.9.a: "새로운 시작의 때이다"
 iraq_war.10.t: "제1조: 이라크 정부"
 iraq_war.10.d: "'이라크 국가는 종교, 종파, 민족에 관계없이 모든 시민을 위한 자유, 평등, 정의의 원칙 위에 세워진 주권을 가진 독립 민주 국가이다. 그러나 정부는 이라크 국가의 역사적 구현체를 방해해서는 아니 되며, 이에 따라 다음이 될 것이다..."
 iraq_war.10.a: ".. 이슬람 공화국'"
 iraq_war.10.b: ".. 세속 공화국'"
 iraq_war.111.t: "제2조: 이라크의 언어"
 iraq_war.111.d: "'이라크 국가는 국경 내에 존재하는 풍부한 언어적 다양성이 국민 정체성의 다원성을 반영함을 인정한다. 정부는 토착 언어와 방언의 보존과 발전을 증진하고, 이를 이라크 문화유산의 필수 요소로서 보호한다. 그러나 이라크 국가는 단합을 유지해야 하며, 이를 위해 시민은 반드시...'"
 iraq_war.111.a: "... 아랍어를 사용해야 한다'"
 iraq_war.111.b: "... 자신이 선택한 언어를 사용해야 한다'"
 iraq_war.12.t: "제3조: 이라크의 애국심"
 iraq_war.12.d: "'이라크 국가는 다양한 공동체가 공유하는 역사, 문화, 가치에 뿌리를 둔 시민들 간의 국가 정체성 함양이 중요함을 인정한다. 이라크 국민을 단결시키고 집단적 결의를 강화하는 데 민족주의가 지니는 의의를 인정하되, 이러한 애국심은 감독되지 않으면 용인될 수 있는 범위를 넘어설 수 있다. 따라서 모든 형태의 이라크 민족주의는..."
 iraq_war.12.a: "... 억제되어야 한다'"
 iraq_war.12.b: "... 신중한 관리 아래 육성되어야 한다'"
 iraq_war.14.t: "제4조: 이라크의 연방주의"
 iraq_war.14.d: "'이라크 국가는 영원히 하나로 통합될 것이나, 정치에는 많은 논쟁이 따르게 마련이다. 따라서 이라크 국가는 통합된 국가를 이끌 통합 정부를 수립해야 한다. 이를 위해 제4조에 따라 이라크 국민은 다음에 투표한다..."
 iraq_war.14.a: "... 선출된 전문가 위원회'"
 iraq_war.14.b: "... 대통령'"
 iraq_war.15.t: "제5조: 이라크의 안보"
 iraq_war.15.d: "이라크 국가는 국가 안보를 수호하고 국가 주권을 보호하기 위해 국가의 배타적 권한 아래 있는 전문적이고 책임 있는 군대를 유지하는 것이 중요함을 인정한다. 그러나..."
 iraq_war.15.a: "... 시민은 민병대를 조직해서는 안 된다'"
 iraq_war.15.b: "... 시민은 적절히 관리되는 민병대를 자유롭게 조직할 수 있다'"
 iraq_war.16.t: "제6조: 이라크의 정체성"
 iraq_war.16.d: "이라크 국가는 국가를 구성하는 민족적 다양성의 풍부한 직물을 기념하며, 여러 민족 집단이 국가의 문화적, 사회적, 역사적 유산에 기여한 귀중한 공헌을 인정한다..."
 iraq_war.16.a: "... 그러나 시민은 아랍 문화를 따라야 한다'"
 iraq_war.16.b: "... 따라서 시민은 자신이 원하는 대로 존재할 자유가 있다'"
 iraq_war.17.t: "법률, 규정, 명령 및 지침의 이행"
 iraq_war.17.d: "수많은 명령과 새로운 규정, 법률이 통과된 끝에, 이라크는 마침내 이라크 헌법과 그 한계에 따라 선출된 권력의 손으로 넘어갈 준비가 되었습니다."
 iraq_war.17.a: "이라크의 미래는 밝다"
 iraq_war.20.t: "이라크 사회의 탈바트화"
 iraq_war.20.d: "모든 국가 정부 부처, 산하 기업 및 기타 정부 기관(예: 대학과 병원)에서 상위 세 계층의 관리직을 맡고 있는 개인은 바트당과의 연관 가능성에 대해 면담을 받으며, 범죄 행위와 안보 위협 여부에 대한 조사를 받는다."
 iraq_war.20.a: "하지만 예외를 둘 수 있다.."
 iraq_war.20.b: "명령 1호는 즉시 발효된다"
 iraq_war.21.t: "단체 해산"
 iraq_war.21.d: "바트당 또는 그 구성원이 보유한 모든 산하 기관, 조직 및 기타 모든 형태의 단체는 연합군 임시 당국 명령 2호에 명시된 바에 따라 조사하고 효과적으로 처리해야 합니다. 해산된 단체의 자산 회수로 이어지는 모든 정보에는 보상이 지급될 것입니다."
 iraq_war.21.a: "하지만 예외를 둘 수 있다.."
 iraq_war.21.b: "명령 2호는 즉시 발효된다"
 iraq_war.22.t: "이라크 바트당의 재산 및 자산 관리"
 iraq_war.22.d: "전 바트당의 모든 자산은 이라크 국민을 위해 사용되도록 연합군 임시 당국의 통제 아래 배분되어야 합니다. 여기에는 여러 기관과 과거 바트당 소유였던 재산의 용도 변경이 포함됩니다."
 iraq_war.22.a: "하지만 예외를 둘 수 있다.."
 iraq_war.22.b: "명령 4호는 즉시 발효된다"
 iraq_war.23.t: "이라크 탈바트화 위원회 설립"
 iraq_war.23.d: "명령 제5호는 바트당 관리와 당원이 소유한 재산과 자산을 포함한 모든 이라크 바트당 재산 및 자산의 범위, 성격, 소재지와 현황, 탐지를 피하기 위해 동원된 은닉 또는 분배 방식, 그리고 인권 침해와 이라크 국민 착취에 연루된 이라크 바트당 관리 및 당원의 신원과 행방을 조사하는 것을 목적으로 한다."
 iraq_war.23.a: "하지만 예외를 둘 수 있다.."
 iraq_war.23.b: "명령 5호는 즉시 발효된다"
 iraq_civil_war.1.t: "권력 쟁탈을 시작한 반군"
 iraq_civil_war.1.d: "최근 이라크는 서서히 혼돈 속으로 빠져들고 있습니다. 바트당이 금지되었음에도 불구하고 그 충성파와 병사 다수가 농촌 지역으로 도피하여 급진 수니파 이슬람주의 집단에 합류했습니다. 사태가 발발한 이후 시아파 공동체의 많은 이들 또한 급진 수니파 집단이 제기하는 위협의 증대에 맞서기 위해 무기를 들었습니다. 반군은 우리 정부를 상대로 서서히 전쟁을 벌이고 있으며, 우리가 이를 억제하기에 충분히 대처하지 못한다면 곧 이라크에서 전면적인 내전을 일으킬 것입니다."
 iraq_civil_war.1.a: "일을 시작하자"
 iraq_civil_war.2.t: "반군에 대한 대승"
 iraq_civil_war.2.d: "최근 우리가 수행한 작전에서 상당수의 반군을 성공적으로 소탕할 수 있었습니다. 우리 측 손실에도 불구하고 해당 지역 주민들은 더 이상 반군을 크게 걱정하지 않아도 된다는 점에 기뻐하고 있습니다."
 iraq_civil_war.2.a: "좋아"
 iraq_civil_war.3.t: "반군에 대한 소승"
 iraq_civil_war.3.d: "최근 작전은 성공했음에도 그 결과는 상부에 깊은 인상을 주지 못했습니다. 우리는 상당수의 병력을 잃었지만, 반군 측에 일부 사상자를 입혀 그들이 이제 다시 한번 생각하도록 만들 수 있었습니다."
 iraq_civil_war.3.a: "알겠다"
 iraq_civil_war.4.t: "최근 작전에서의 소패"
 iraq_civil_war.4.d: "반군에 대한 최근 작전에서 우리는 어떠한 피해도 성공적으로 입히지 못했습니다. 상당수의 병력을 잃었으나, 대다수는 무사히 후퇴할 수 있었습니다."
 iraq_civil_war.4.a: "더 나빠질 수도 있었다"
 iraq_civil_war.5.t: "최근 작전에서의 대패"
 iraq_civil_war.5.d: "작전 후 보고서에 따르면 최근 작전의 조율을 담당한 지휘 계통은 완전히 무질서하고, 반군에 대한 공격을 안전하고 효율적으로 조직할 준비가 되어 있지 않았습니다. 우리는 막대한 수의 병력을 잃었으며, 대부분은 전사하거나 포로로 붙잡혔습니다."
 iraq_civil_war.5.a: "젠장"
 iraq_civil_war.6.t: "시아파 민병대와의 동맹?"
 iraq_civil_war.6.d: "일부 시아파 민병대가 우리 정부에 맞서 봉기했음에도, 그 지도부는 동맹이라는 발상에 반대하지 않습니다. 우리 헌법이 민병대의 권리를 어떻게 규정했느냐에 따라 그들의 요구는 달라질 수 있습니다."
 iraq_civil_war.6.a: "진행하라"
 iraq_civil_war.6.b: "안된다"
 iraq_civil_war.7.t: "헌법상 예외를 요구하는 시아파 민병대"
 iraq_civil_war.7.d: "우리가 접촉한 시아파 민병대의 여러 협상 대표들은 동맹을 맺으려면 민병대를 금지하는 헌법 조항의 적용을 그들에게 면제해 주어야 한다고 제안했습니다. 이는 그들이 자율적으로 활동하되 전시에는 우리 정부를 도울 의사가 있음을 뜻합니다. 또한 우리가 그들을 위해 헌법을 유연하게 적용하려는 만큼 그들의 민병대에게 상당한 정치적 영향력을 부여하게 될 것입니다."
 iraq_civil_war.7.a: "좋다"
 iraq_civil_war.7.b: "아니, 끔찍한 거래군"
 iraq_civil_war.8.t: "정치적 대표권을 요구하는 시아파 민병대"
 iraq_civil_war.8.d: "시아파 민병대의 여러 협상 대표들은 우리 정부 내에서든 다른 형태로든 어떠한 정치적 대표권을 부여해 달라고 요구했습니다. 이는 민병대와 이란이 우리 정치에 행사하는 영향력을 키우게 되겠지만, 헌법을 작성할 때 그들의 활동을 금지하지 않았다는 점에 그들이 꽤 만족하고 있음을 감안하면 그리 심각하지는 않습니다."
 iraq_civil_war.8.a: "좋다"
 iraq_civil_war.8.b: "절대 안 된다"
 iraq_civil_war.9.t: "적대적으로 돌변한 시아파 민병대"
 iraq_civil_war.9.d: "여러 시아파 민병대가 우리 병력을 공격하기 시작했으며, 이는 모든 협상이 물거품이 되었음을 의미합니다. 이제 수니파 급진주의자들에게 하고 있는 것과 마찬가지로, 그들이 가장 큰 영향력을 행사하는 주에서 그들을 소탕해야 합니다."
 iraq_civil_war.9.a: "젠장"
 iraq_civil_war.10.t: "인내심을 잃어 가는 시아파 민병대"
 iraq_civil_war.10.d: "시아파 민병대는 반군 사태 발발 후 우리 병력에 대한 공격을 자제해 왔으나, 우리가 협상 테이블에 앉지 못하면서 점점 인내심을 잃고 있습니다. 그들은 50일 안에 합의에 도달할 것을 요구하고 있으며, 그렇지 않으면 우리 정부를 전복하기 위해 우리 병력을 공격하기 시작할 것입니다."
 iraq_civil_war.10.a: "젠장"
 iraq_civil_war.100.t: "반군에 대한 승리"
 iraq_civil_war.100.d: "수년간 반군과 싸우고 많은 이들이 순교한 끝에 반란은 대체로 종식되었습니다. 소규모 테러리스트 잔당이 여전히 국내 곳곳에 남아 있으나, 대규모 테러 조직은 대부분 진압되었습니다. 이제 우리는 현재 은신 중인 이들 집단의 우두머리를 찾아 체포해야 합니다."
 iraq_civil_war.100.a: "승리는 우리의 것이다"
 iraq_war.100.t: "공세적 구상을 추진하는 이라크"
 iraq_war.100.d: "이라크 정부는 오늘 '이라크 시대' 구상에 관한 발표를 했습니다. 우리 정보에 따르면 이 새로운 구상은 레반트, 걸프, 북아프리카 지역의 여러 정부를 전복하려는 것입니다."
 iraq_war.100.a: "이 미치광이를 막아야 한다"
 iraq_war.100.b: "우리는 신경 써야 할 다른 일이 있다!"
 iraq_civil_war.200.t: "종파 지진"
 iraq_civil_war.200.d: "이라크 사회의 긴장 고조로 인해 이슬람 종파 간 분열을 두고 우리 국민이 서로 대립하고 있습니다. 새 헌법이 승인되면서 연방주의가 시아파 주들에 정치적으로 더 큰 영향력을 부여한 결과, 수니파 공동체는 소외되고 억압받는다고 느끼고 있습니다."
 iraq_civil_war.200.a: "좋은 일일 리 없다"
 iraq_civil_war.201.t: "알두리 아래 결집한 군 내 수니파 세력"
 iraq_civil_war.201.d: "우리 군 내 수니파 세력이 전직 이라크 장군 이자트 이브라힘 알두리를 중심으로 결집하여 우리의 사임을 요구했습니다. 오늘 이라크군 여러 대대가 의회를 포위하고 요구에 굴복하지 않으면 의회를 잿더미로 만들겠다고 위협했습니다.."
 iraq_civil_war.201.a: "이 개자식들을 숙청하라!"
 iraq_civil_war.201.b: "생각해 보니 정치는 나와 맞지 않는군"
 iraq_civil_war.202.t: "바트주의의 부활"
 iraq_civil_war.202.d: "한때 우리 국가에 주둔하던 서방 연합군의 마지막 병력이 인근 사우디아라비아와 쿠웨이트로 도피하기 시작했습니다. 우리 무장 사단은 이제 전국의 도시를 순찰하며 모든 정부 관청을 확보하고 제대로 정리되도록 하고 있습니다. 이 땅의 순수한 흙에 해를 끼치려는 자들의 손에서 벗어나, 우리 국가는 다시 한번 자유롭게 숨 쉴 수 있을 것입니다..."
 iraq_civil_war.202.a: "'오 땅이여, 그대의 흙은 나의 카푸르이다'"
 iraq_civil_war.203.t: "수니파 적대감의 감소"
 iraq_civil_war.203.d: "최근 몇 달간 국내 수니파에 의한 우리 정부에 대한 적대 행위가 크게 줄어든 것으로 확인되었습니다. 이는 종파 지진이 이제 끝나가고 있으며 이라크 국가가 마침내 다시 한번 통합될 수 있으리라는 믿음으로 이어지고 있습니다."
 iraq_civil_war.203.a: "자유의 대가"
 iraq_civil_war.204.t: "알두리 아래 결집한 군 내 수니파 세력"
 iraq_civil_war.204.d: "우리 군 내 수니파 세력이 전직 이라크 장군 이자트 이브라힘 알두리를 중심으로 결집하여 우리의 사임을 요구했습니다. 오늘 이라크군 여러 대대가 의회를 포위하고 요구에 굴복하지 않으면 의회를 잿더미로 만들겠다고 위협했습니다.."
 iraq_civil_war.204.a: "이 개자식들을 숙청하라!"
 iraq_civil_war.210.t: "소규모 반정부 집회"
 iraq_civil_war.210.d: "소도시 한 곳에서 열린 소규모 집회가 해당 지역 수니파의 불만에 대한 지역 사회의 관심을 끌었습니다. 이는 소규모 반정부 시위로 이어졌으며, 시위대는 변화, 구체적으로는 수니파와 관련된 문제들에 대한 변화를 외쳤습니다."
 iraq_civil_war.210.a: "나중에 살펴보자."
 iraq_civil_war.211.t: "짧은 반정부 설교"
 iraq_civil_war.211.d: "농촌 도시의 한 지역 모스크가 우리 정책이 진정한 이슬람의 뜻에서 너무 멀리 벗어났다고 비난하는 짧은 반정부 설교를 열었습니다. 이 설교를 한 이맘은 그 결과 수니파 공동체 사이에서 소규모의 인기 상승세를 타고 있습니다."
 iraq_civil_war.211.a: "조사해 봐야겠다."
 iraq_civil_war.212.t: "대규모 반정부 집회"
 iraq_civil_war.212.d: "수니파가 다수인 국내 도시 곳곳에서 많은 사람들이 거리로 나와 다양한 규모로 자신들의 생활 여건과 대우에 대한 불만을 표출하고 있습니다."
 iraq_civil_war.212.a: "젠장"
 iraq_civil_war.214.t: "파업을 조직하는 노동조합"
 iraq_civil_war.214.d: "여러 노조 조직이 전국에서 수니파 노동자들이 파업에 나서도록 결집시키기로 결정했습니다. 이는 경제 둔화를 불러왔으며, 일부 좌파 정당에는 이 흐름에 편승할 기회가 되었습니다."
 iraq_civil_war.214.a: "더 악화되지 않기를 바란다"
 iraq_civil_war.215.t: "힘을 얻는 전국적 시위"
 iraq_civil_war.215.d: "전국 곳곳에서 단발적인 시위가 벌어지고 있으며 가장 많은 참가자는 수니파입니다. 지방 정부가 양보를 시도했음에도 시위대는 여전히 만족하지 않고 있습니다.."
 iraq_civil_war.215.a: "그런데 왜?"
 iraq_civil_war.216.t: "시위대와 지역 민병대의 충돌"
 iraq_civil_war.216.d: "여러 시위가 급속히 통제 불능 상태가 되어 폭동 양상을 띠기 시작했습니다. 이로 인해 일부 개인들이 시위대의 세력을 제한하기 위해 뭉쳐 민병대를 결성했습니다."
 iraq_civil_war.216.a: "젠장"
 iraq_civil_war.218.t: "상업 중심지에서의 차량 폭탄 테러"
 iraq_civil_war.218.d: "국내 급진 세력이 질서와 상거래의 흐름을 교란하기 위해 대규모 상업 중심지에서 차량 폭탄 테러를 자행하는 수단에 의지했습니다."
 iraq_civil_war.218.a: "이게 무슨 짓이냐?"
 iraq_civil_war.219.t: "군사 시설을 공격하는 무장 세력"
 iraq_civil_war.219.d: "지하디스트 집단은 분노한 수니파 공동체를 이용해 우리 병력에 대한 공격을 감행하기 시작했으며, 그 결과 우리의 방어 능력이 손상되었습니다."
 iraq_civil_war.219.a: "젠장"
 iraq_civil_war.220.t: "공격을 개시한 [ISI.GetFlag] 이라크 알카에다"
 iraq_civil_war.220.d: "아부 무삽 알자르카위는 억제되지 않은 살라피 급진주의의 결과로 우리 정부에 대한 공격을 시작하기 위해 자신의 병력과 지지자들을 결집시켰습니다. 그의 집단은 이전에 국내 다른 극단주의 집단들로부터 많은 지원을 받았으며, 일부는 우리 정부를 전복하기 위해 무장하여 그들에 합류했습니다. 그들은 몇 시간 전 우리 정부를 무너뜨리겠다고 선언하며 가장 큰 규모의 공격 물결을 시작했습니다. 우리 행정부는 이 분쟁에 대비해 병력을 준비하기 시작했으며, 그 결과 비상사태를 선포했습니다."
 iraq_civil_war.220.a: "이 개자식들을 박살 내겠다!"
 iraq_civil_war.220.b: "때가 왔다.."
 iraq_md.1.t: "지원금 활용"
 iraq_md.1.d: "우리 동맹국들은 우리에게 막대한 자금과 지원을 제공해 주었습니다. 그러나 우리는 이를 그다지 활용하지 못했으며, 따라서 마침내 이를 다음에 사용하는 것이 우리에게 최선의 이익입니다..."
 iraq_md.1.a: "군사적 필요"
 iraq_md.1.b: "산업적 필요"
 iraq_md.1.c: "경제적 필요"
 iraq_md.2.t: "연립"
 iraq_md.2.d: "우리 당은 이전에 협력 파트너들에게 국가 운영의 정치적 과정에 그들을 참여시키겠다고 약속했습니다. 그들을 우리 연립에 초대하는 것은 이로울 것이지만, 국가에 대한 우리의 통제권 일부를 양도하는 일이 될 것입니다."
 iraq_md.2.a: "그들을 합류시키자"
 iraq_md.2.b: "사실 진심은 아니었다.."
 iraq_md.3.t: "알리 빈 알후세인의 요청"
 iraq_md.3.d: "이라크에서 어떤 형태로든 군주제를 추진하는 몇 안 되는 인물 중 한 명인 알리 빈 알후세인이, 국민을 '통합'하는 방안으로 라아드 빈 자이드에게 우리 국가 내 일종의 헌법상 대표권을 부여해 달라고 요청하고 있습니다."
 iraq_md.3.a: "끔찍한 발상이군"
 iraq_md.3.b: "좋은 생각이다"
 iraq_md.4.t: "국경 넘는 급습?"
 iraq_md.4.d: "최근 쿠르디스탄과의 국경에서 넘어오는 마약 관련 활동이 상당히 많아졌습니다. 이 문제의 배후에 있는 범죄자들 일부를 붙잡기 위해 해당 지역으로 국경을 넘는 급습을 감행하는 것이 유용할 수 있습니다."
 iraq_md.4.a: "진행하라"
 iraq_md.4.b: "나쁜 생각이다"
 iraq_md.5.t: "마약을 압수한 아군"
 iraq_md.5.d: "아군은 국경 너머 여러 구역에 줄지어 놓인 대규모 마약 및 불법 물질 은닉처를 찾아내는 데 성공했습니다. 우리는 현재 발견한 모든 것을 파기하는 작업을 진행 중입니다."
 iraq_md.5.a: "좋아"
 iraq_md.6.t: "격퇴당한 아군"
 iraq_md.6.d: "우리나라 북부에 자리 잡은 쿠르드 반군이 우리의 침투를 밀어내는 데 성공하여, 마약을 찾아내기가 매우 어려워졌습니다."
 iraq_md.6.a: "젠장"
 iraq_md.8.t: "이라크의 침투를 격퇴한 아군"
 iraq_md.8.d: "최근 이라크인들이 국경의 여러 구역을 급습하려는 어리석은 시도를 했다가 꼬리를 말고 달아나게 만들었습니다."
 iraq_md.8.a: "좋아"
 iraq_md.9.t: "작전을 수행하는 이라크군"
 iraq_md.9.d: "이라크군이 우리 방어선을 돌파하여 여러 구역을 수색하고 그 안에서 다수의 물품을 가져가는 데 성공했습니다."
 iraq_md.9.a: "젠장"
 iraq_md.11.t: "아흐와즈인들을 무장시킬까?"
 iraq_md.11.d: "이란의 아흐와즈 지역(현재의 쿠제스탄)은 이란인들에 의한 아랍인 탄압의 중심지였습니다. 비록 승리하지 못하더라도 가용한 자원 일부를 활용하여 이란의 단결에 상당한 타격을 줄 수 있습니다."
 iraq_md.11.a: "진행하라"
 iraq_md.11.b: "좋은 생각이 아니다"
 iraq_md.12.t: "약속"
 iraq_md.12.d: "국내 수니파의 만족도를 높이기 위해서는 지역 지도자들과의 회담을 마련해야 합니다. 그들의 요구는 매번 다르겠지만 실현 가능한 수준일 것입니다. 다만 우리가 약속을 지키지 못하면 그들은 더욱 분노하게 될 것임을 유념해야 합니다."
 iraq_md.12.a: "그들이 원하는 것을 들어 보자"
 iraq_md.13.t: "우리의 지원을 요청하는 이라크"
 iraq_md.13.d: "최근 이라크에서 다와당이 이끄는 새 정부가 선출되었으며, 그들은 자신들의 당을 지원하고 지역 내에서 일종의 정통성을 부여하는 수단으로 우리에게 어떤 형태로든 지원을 해 달라고 요청하고 있습니다."
 iraq_md.13.a: "안 될 것 없지?"
 iraq_md.13.b: "안된다"
 iraq_md.14.t: "지원을 제공하는 이란"
 iraq_md.14.d: "이란 정부는 우리 정부에 지원을 보내기로 합의하였으며, 이는 우리에게 활용할 추가 자원을 제공합니다."
 iraq_md.14.a: "좋아"
 iraq_md.15.t: "우리 요청을 무시한 이란"
 iraq_md.15.d: "한동안 이란 대표단으로부터 아무런 답이 없으며, 우리의 요청을 무시하기로 한 것으로 보입니다.."
 iraq_md.15.a: "이러지 마라"
 iraq_md.16.t: "우리 원조를 가로챈 이라크 민병대!"
 iraq_md.16.d: "이라크 민병대가 쿠르디스탄으로 향하던 여러 물자를 가로채어 자신들의 이익을 위해 인근 마을에 팔아넘겼습니다. 또한 그 자금 일부가 이라크 정부로 흘러 들어갔다는 보고도 입수했습니다."
 iraq_md.16.a: "공식 항의를 제기한다"
 iraq_md.16.b: "뭐, 어쩔 수 없지"
 iraq_md.17.t: "안보 협정을 제안하는 이라크"
 iraq_md.17.d: "이라크 정부가 우리에게 솔깃한 제안을 해 왔습니다. 방위 협정에 서명하자는 것입니다. 이는 우리를 공격하는 자는 누구든 이라크와 전쟁을 치러야 하며, 이라크를 공격하는 자는 누구든 우리가 전쟁을 치러야 한다는 뜻입니다. 서명한다면 지역 안보와 안정에 분명 도움이 되겠지만 상당히 위험합니다.."
 iraq_md.17.a: "서명한다"
 iraq_md.17.b: "아니, 너무 위험하다"
 iraq_md.18.t: "우리의 방위 협정을 수락한 [FROM.GetName]"
 iraq_md.18.d: "[FROM.GetName] 정부가 우리의 방위 협정에 서명하기로 동의했으며, 이는 우리가 안보 분야의 지역 파트너가 될 것임을 의미합니다."
 iraq_md.18.a: "좋아"
 iraq_md.19.t: "우리의 방위 협정을 거부한 [FROM.GetName]"
 iraq_md.19.d: "[FROM.GetName] 정부가 우리의 방위 협정을 거부하였으며, 이는 지역 안보를 위험에 빠뜨릴 수 있습니다."
 iraq_md.19.a: "젠장"
 iraq_md.20.t: "우리를 FAO에 초청하는 [FROM.GetName]"
 iraq_md.20.d: "[FROM.GetName]은(는) 최근 '억압에 맞선 전선(Front Against Oppression)', 즉 'FAO'라 불리는 자국의 동맹에 우리를 초청했습니다. 그들은 보다 근본주의적인 세력을 위해 이 지역에서 커져 가는 서방의 영향력을 억제하고자 합니다."
 iraq_md.20.a: "신청서는 어디 있는가?"
 iraq_md.20.b: "안된다"
 iraq_md.21.t: "우리 비축 물자의 무기를 요청하는 이라크"
 iraq_md.21.d: "이라크 정부가 최근 자국 병력의 보급선을 지원하기 위해 소량의 무기를 보내 달라는 서한을 보내왔습니다. 그들에 대한 영향력을 얻을 수 있겠지만, 우리도 이 무기들이 꼭 필요합니다.."
 iraq_md.21.a: "알겠다"
 iraq_md.21.b: "안된다"
 iraq_md.22.t: "금전적 원조를 요청하는 이라크"
 iraq_md.22.d: "이라크 정부는 국내 일부 지역의 재건을 돕기 위해 약간의 자금을 지원해 달라고 요청하고 있습니다. 우리의 모든 경제적 어려움에도 불구하고 그 자금은 우리 예산에서 나가게 됩니다.."
 iraq_md.22.a: "안 될 것 없지?"
 iraq_md.22.b: "안된다"
 iraq_md.23.t: "원조를 거부한 이란"
 iraq_md.23.d: "이란이 최근 우리의 지원 요청을 거부했으며, 이는 우리가 모든 것을 스스로 마련해야 함을 의미합니다."
 iraq_md.23.a: "알겠다"
 iraq_md.24.t: "무기 수송을 시작한 이란"
 iraq_md.24.d: "이란 정부가 우리의 무기 요청에 동의했으며, 우리는 곧 물량을 받게 될 것입니다!"
 iraq_md.24.a: "좋아"
 iraq_md.25.t: "금전적 원조를 제공한 이란"
 iraq_md.25.d: "이란 정부가 우리가 갚을 필요가 없는 무상 자금 패키지를 보내고 있습니다!"
 iraq_md.25.a: "좋아"
 iraq_md.26.t: "우리 정치에 간섭하는 [IRQ.GetFlag] [IRQ.GetName]!"
 iraq_md.26.d: "이라크 정부가 우리 정치에 간섭하여 국민의 이념에 영향을 미치고 특정 집단을 자극했을 가능성이 있습니다."
 iraq_md.26.a: "젠장"
 iraq_md.27.t: "이스라엘에 대한 계획에 우리의 지원을 요청하는 이라크..."
 iraq_md.27.d: "이라크 정부는 이스라엘 국가를 공격할 계획이며, 마침내 그 나라 내 무슬림에 대한 탄압을 끝내겠다고 서약하고 있습니다. 그러나 이라크 정부는 최근 다소.. 의문스러운 행동을 했습니다. 이번에는 빠지는 것이 나을지도 모릅니다.."
 iraq_md.27.a: "전폭적인 지지를 약속한다!"
 iraq_md.27.b: "개입하지 않겠다"
 iraq_md.28.t: "지지를 약속한 [FROM.GetName]"
 iraq_md.28.d: "[FROM.GetName]은(는) 시온주의자들과의 전쟁에서 우리를 돕기로 동의했으며, 때가 오면 우리 병사들과 함께 싸울 것입니다.."
 iraq_md.28.a: "좋아"
 iraq_md.29.t: "개입을 거부한 [FROM.GetName]"
 iraq_md.29.d: "[FROM.GetName]은(는) 이스라엘, 나아가 우리가 관련된 어떤 분쟁에도 개입하지 않겠다고 밝혔습니다."
 iraq_md.29.a: "알겠다"
 iraq_md.30.t: "우리를 공격할 준비를 하는 이라크!"
 iraq_md.30.d: "이라크 정부는 이 지역에서 우리나라를 제거하려는 시도로 우리에 맞선 이슬람 국가들의 연합 같은 것을 구성하려 하고 있습니다. 우리는 대비해야 합니다."
 iraq_md.30.a: "젠장"
 iraq_md.31.t: "관계 개선을 모색하는 이라크"
 iraq_md.31.d: "이라크 정부는 우리나라와 더 나은 경제적, 사회적, 전반적 관계를 모색하고 있습니다. 현 이라크 정부가 다른 나라들과 그리 우호적이지 않기로 알려져 있기에 이는 세계에 충격으로 다가왔습니다.."
 iraq_md.31.a: "안 될 것 없지"
 iraq_md.31.b: "안된다"
 iraq_md.32.t: "동의한 [FROM.GetName]!"
 iraq_md.32.d: "[FROM.GetName]도 우리나라와 관계를 개선하기를 원하는 듯하며, 우리가 제안한 합의에 서명했습니다!"
 iraq_md.32.a: "좋아"
 iraq_md.33.t: "우리 합의에 관심을 보이지 않은 [FROM.GetName]"
 iraq_md.33.d: "[FROM.GetName]은(는) 우리가 최근 제시한 합의에 서명하고 싶지 않음을 분명히 했으며, 모든 제안을 거절했습니다."
 iraq_md.33.a: "알겠다"
 iraq_md.34.t: "적발된 무기 수송!"
 iraq_md.34.d: "최근 지정된 목적지로 가던 도중 해당 국가 당국에 우리 트럭과 물자가 적발되어 모든 화물이 압수되었습니다."
 iraq_md.34.a: "젠장"
 iraq_md.35.t: "적발된 이라크의 무기 수송"
 iraq_md.35.d: "어떤 이유에서인지 이라크는 우리 국경을 통해 미확인 장소로 무기를 수송하려 했습니다. 우리 병력은 이후 적재된 모든 무기를 압수했습니다."
 iraq_md.35.a: "그래서?"
 iraq_md.36.t: "우리 대사관을 급습한 이라크군"
 iraq_md.36.d: "이라크 정부는 자국 병력에게 우리 대사관을 급습하여 그곳에 주재하던 모든 인원을 추방하고 일부를 인질로 잡으라고 명령했습니다. 이는 새로 들어선 이슬람 정부가 넘어선 레드라인입니다."
 iraq_md.36.a: "이를 처벌 없이 넘어갈 수는 없다!"
 iraq_md.36.b: "상관없다"
 iraq_md.37.t: "USAID를 신청하는 이라크"
 iraq_md.37.d: "이라크 정부는 이념적 차이와 입장에도 불구하고 놀랍게도 USAID를 신청하기로 결정했습니다. 우리는 흐름에 따라 관계 정상화의 길을 계속 이어갈 수 있습니다."
 iraq_md.37.a: "알겠다"
 iraq_md.37.b: "안된다"
 iraq_md.38.t: "투자를 요청하는 이라크"
 iraq_md.38.d: "이라크 정부가 최근 우리 기업들이 자국에 투자해 달라는 요청을 해 왔습니다. 그러나 이라크의 정치 상황의 성격 때문에 후폭풍을 우려한 기업들은 투자를 망설이고 있습니다.."
 iraq_md.38.a: "해도 좋다"
 iraq_md.38.b: "안된다"
 iraq_md.39.t: "[USA.GetLeader]을(를) 바그다드로 초청하는 이라크"
 iraq_md.39.d: "이라크 정부가 정책을 놀랍게 전환하여 어떤 이유에서인지 [USA.GetLeader]을(를) 바그다드로 초청했습니다. 시아파 정부는 처음에는 적대 세력으로 보였으나, 우리나라와의 관계를 개선하기 위한 여러 제안을 내놓았습니다.."
 iraq_md.39.a: "알겠다"
 iraq_md.39.b: "아니, 함정처럼 보인다"
 iraq_md.40.t: "회동을 원하지 않는 [USA.GetLeader]"
 iraq_md.40.d: "[USA.GetLeader]은(는) 두려움 때문인지 내부 세력의 압력 때문인지, 바그다드에서 우리 관리들과 만나는 것을 지나치게 주저하는 듯합니다."
 iraq_md.40.a: "알겠다"
 iraq_md.41.t: "바그다드에 도착한 [USA.GetLeader]!"
 iraq_md.41.d: "[USA.GetLeader]이(가) 바그다드에 도착했으며, 양국 관계를 논의하는 가운데 우리는 미국인들에게 어떤 형태의 원조를 요청할 계획입니다. 우리는 아마도 다음을 요청하게 될 것입니다..."
 iraq_md.41.a: "정치적 지원"
 iraq_md.41.b: "군사적 지원"
 iraq_md.41.c: "산업적 지원"
 iraq_md.50.t: "시위를 시작한 시아파 단체들"
 iraq_md.50.d: "여러 시아파 단체가 우리가 최근 시행한 정책과 수니파와의 분쟁에서 시아파 민병대를 지원하지 않는 점에 항의하는 시위를 시작했습니다. 그들은 우리 정부의 진전을 저지하기 위해 대규모 집회를 시도하고 있습니다.."
 iraq_md.50.a: "진압 경찰을 투입한다. 치명적 무력 사용은 허가하지 않는다"
 iraq_md.50.b: "진압 경찰을 투입한다. 치명적 무력 사용을 허가한다"
 iraq_md.51.t: "나자프와 카르발라의 모스크 안에서 계획을 세우는 폭도들"
 iraq_md.51.d: "시아파 무장 세력과 단체들이 나자프와 카르발라의 모스크를 폭동 계획을 세우는 장소로 이용하고 있습니다. 이는 그동안 대체로 우리가 알지 못하는 사이에 이루어졌습니다.."
 iraq_md.51.a: "모스크로 가는 교통을 차단한다"
 iraq_md.51.b: "모스크를 폐쇄하고 병력을 주둔시킨다"
 iraq_md.52.t: "공항을 점거한 시위대"
 iraq_md.52.d: "최근 시아파 운동에 참여한 여러 시위대가 외교적 노력과 운동에 참여하지 않는 이라크인들의 일상을 방해하기 위해 공항을 점거하기 시작했습니다."
 iraq_md.52.a: "당분간 공항을 폐쇄한다"
 iraq_md.52.b: "공항에 병력을 보낸다"
 iraq_md.53.t: "혁명 구호를 채택한 시위대"
 iraq_md.53.d: "운동에 참여한 시위대와 시아파 단체들이 최근 혁명 구호를 채택했으며, 이는 그들이 우리 정부의 완전한 전복을 노리고 있음을 분명히 보여 줍니다.."
 iraq_md.53.a: "젠장"
 iraq_md.54.t: "우리 정부의 퇴진을 요구하는 사드르 지지자들"
 iraq_md.54.d: "무크타다 알사드르와 그의 조직이 시위 대부분을 주도하고 있으며, 여러 시아파 조직을 자기편으로 끌어들일 만큼 충분한 지지를 모았습니다. 그들은 우리 정부가 퇴진하고 그들이 '이라크를 올바른 방향으로 이끌' 수 있도록 허용할 것을 요구하고 있습니다."
 iraq_md.54.a: "군이 그들을 처리하게 하자.."
 iraq_md.54.b: "우리는 이럴 수 없다.."
 iraq_md.55.t: "우리 정부의 퇴진을 요구하는 바드르 여단"
 iraq_md.55.d: "바드르 여단과 그 지지자들이 시위 대부분을 주도하고 있으며, 여러 시아파 조직을 자기편으로 끌어들일 만큼 충분한 지지를 모았습니다. 그들은 우리 정부가 퇴진하고 그들이 '이라크를 올바른 방향으로 이끌' 수 있도록 허용할 것을 요구하고 있습니다."
 iraq_md.55.a: "군이 그들을 처리하게 하자.."
 iraq_md.55.b: "우리는 이럴 수 없다.."
 iraq_md.56.t: "경제 협력 강화를 원하는 이라크"
 iraq_md.56.d: "이라크 정부는 무역 및 기타 수단을 통해 더 강력한 유대를 구축하고자 자국의 경제적 노력에 우리의 협조를 요청하고 있습니다."
 iraq_md.56.a: "어디에 서명하면 되는가?"
 iraq_md.56.b: "관심 없다"
 iraq_md.57.t: "우리의 경제 합의에 서명한 [FROM.GetName]"
 iraq_md.57.d: "[FROM.GetName]은(는) 우리 정부 및 국가와의 경제적 유대를 강화하기로 동의하였으며, 이는 국제 사회에서 우리의 입지를 강화해 줍니다."
 iraq_md.57.a: "좋아"
 iraq_md.58.t: "우리의 경제 합의에 서명하기를 거부한 [FROM.GetName]"
 iraq_md.58.d: "[FROM.GetName]은(는) 우리 정부 및 국가와의 경제적 유대 강화를 거부하였으며, 이는 국제 사회에서 우리의 입지에 타격을 줍니다."
 iraq_md.58.a: "젠장"
 iraq_md.59.t: "이라크가 흥미로운 제안을 제안하다.."
 iraq_md.59.d: "이라크 정부가 최근 흥미로운 제안을 해 왔습니다. 현재 이라크 정부가 통제하는 모든 쿠르드 영토를 이양하는 대가로, 우리 정부와 국가의 일부 통제권을 이라크 중앙 정부에 넘겨 달라는 것입니다."
 iraq_md.59.a: "훌륭한 제안이다!"
 iraq_md.59.b: "아니, 절대 안 된다"
 iraq_md.60.t: "우리 제안을 수락한 쿠르디스탄"
 iraq_md.60.d: "쿠르드 정부가 우리가 제안한 합의에 동의했으며, 일부 정부 직책이 우리 손으로 이양되고 있습니다."
 iraq_md.60.a: "좋아"
 iraq_md.61.t: "우리 제안을 거부한 쿠르디스탄"
 iraq_md.61.d: "쿠르드 정부는 이라크 국가 내에서 쿠르드인과 그들의 권리가 부당한 대우를 받았음을 이유로 들며 우리가 제안한 안을 거부했습니다."
 iraq_md.61.a: "젠장"
 iraq_md.62.t: "발각된 로자바행 수송!"
 iraq_md.62.d: "시리아 국경 수비대가 로자바 지역과 그곳 반군에게 무기를 수송하는 우리 화물 트럭을 적발했습니다. 수비대를 매수하려고 시도할 수 있지만 모두 헛수고가 될 수도 있습니다."
 iraq_md.62.a: "젠장, 물러나라!"
 iraq_md.62.b: "매수를 시도한다"
 iraq_md.63.t: "성공한 매수"
 iraq_md.63.d: "시리아 국경 수비대는 몹시 절박했던 모양이며, 우리가 제시한 뇌물을 받았습니다."
 iraq_md.63.a: "좋아"
 iraq_md.64.t: "체포된 아군"
 iraq_md.64.d: "시리아 국경 수비대는 흔들리지 않았으며, 이에 따라 아군 병력을 구금했습니다."
 iraq_md.64.a: "젠장"
 iraq_md.65.t: "준비를 마친 반군!"
 iraq_md.65.d: "로자바의 반군이 우리에게 연락하여 시리아 정부에 대한 공격 준비가 되었음을 알려 왔습니다. 우리는 그들이 작전을 진행할 수 있도록 승인해야 합니다."
 iraq_md.65.a: "때가 왔다"
 iraq_md.66.t: "우리에게 선거 실시를 압박하는 이라크"
 iraq_md.66.d: "이라크 정부는 우리에게 조기 선거를 실시하라고 압박하고 있으며, 특히 최근 좌파 운동이 쿠르드 사회 깊숙이 영향력을 침투시킨 상황에서 그러합니다."
 iraq_md.66.a: "알았다, 좋다"
 iraq_md.66.b: "안된다"
 iraq_md.67.t: "우리의 영향력을 공격하는 이라크!"
 iraq_md.67.d: "이라크 정부가 여러 걸프 국가에서 우리의 영향력을 공격하여, 그 사회 내에 반미 정서를 조성하고 있습니다."
 iraq_md.67.a: "이게 무슨 짓이냐?"
 iraq_md.68.t: "서부의 분리주의 집단을 무장시키는 이라크"
 iraq_md.68.d: "이라크 정부는 우리나라 서부에서 자기 주의 독립을 추구하는 몇몇 집단, 주로 일부 쿠르드 집단과 쿠제스탄의 일부 집단을 무장시키고 훈련시켰습니다. 우리 병력은 가능한 한 빨리 대응할 수 있도록 준비하고 가능한 곳에서 이라크의 영향력을 제한하려 노력해야 합니다."
 iraq_md.68.a: "알겠다"
 iraq_md.69.t: "우리를 반이란 연합에 초청하는 이라크"
 iraq_md.69.d: "이라크 정부는 이란 정부를 전복하고 이란 서부의 일부 주를 해방시키는 데 도움을 줄 관심 있는 세력을 찾아다니고 있습니다. 그들은 우리를 찾아와 이 전쟁에서 자신들을 돕기로 동의하면 일부 양보를 하겠다고 제안했습니다."
 iraq_md.69.a: "알겠다"
 iraq_md.69.b: "안된다"
 iraq_md.70.t: "동의한 [FROM.GetName]"
 iraq_md.70.d: "[FROM.GetName]은(는) 이란과 그 억압적 국가에 맞선 우리 연합에 가입하기로 동의했습니다!"
 iraq_md.70.a: "좋아"
 iraq_md.71.t: "우리 제안을 거부한 [FROM.GetName]!"
 iraq_md.71.d: "[FROM.GetName]은(는) 이란과 그 억압적 국가에 맞선 우리 연합에 가입하는 것을 거부했습니다!"
 iraq_md.71.a: "젠장"
 iraq_md.72.t: ""
 iraq_md.72.d: ""
 iraq_md.72.a: ""
 iraq_md.73.t: "아라비아의 성공적인 혁명"
 iraq_md.73.d: "아라비아에 혁명적 이상을 심기 위한 우리의 개입이 결실을 맺었으며, 군 일부가 국민과 함께 무기를 들고 억압적인 국가에 맞서 싸우고 있습니다!"
 iraq_md.73.a: "좋아"
 iraq_md.74.t: "사담의 나이와 건강에 대한 커지는 우려"
 iraq_md.74.d: "지난 몇 주 동안 사담 후세인이 지난 몇 달간 앓아 온 건강 상태에 대한 논의가 많았습니다. 최근 사담이 알츠하이머병 초기 단계를 앓고 있다는 사실이 드러나면서 그의 국정 운영 능력에 대한 우려가 커지고 있습니다."
 iraq_md.74.a: "물러나는 것이 최선이다"
 iraq_md.75.t: "투자를 요청하는 이라크"
 iraq_md.75.d: "이라크 정부가 경제적 투자와 지원을 요청하는 서한을 보내왔습니다. 우리는 그들의 필요를 충족시키고 영향력을 넓히기 위해 일부 원조를 제공할 수 있습니다."
 iraq_md.75.a: "알겠다"
 iraq_md.75.b: "안된다"
 iraq_md.76.t: "중국의 수락"
 iraq_md.76.d: "중국 정부가 우리나라에 투자하기로 동의하였으며, 이로써 바그다드까지 영향권을 확장합니다"
 iraq_md.76.a: "나쁘지 않군"
 iraq_md.77.t: "중국 정부의 거부"
 iraq_md.77.d: "중국 정부는 우리의 도움 요청을 거부하였으며, 어떠한 형태의 원조도 거절한다는 서한을 보내왔습니다."
 iraq_md.77.a: "젠장"
 iraq_md.78.t: "대출을 요청하는 이라크"
 iraq_md.78.d: "이라크 정부는 자국 중앙 정부에 대출을 제공하는 방식의 일종의 장기 투자를 우리에게 요청하고 있습니다. 위험한 조치이지만 장기적으로는 성과를 거둘 수 있습니다."
 iraq_md.78.a: "알겠다"
 iraq_md.78.b: "안된다"
 iraq_md.79.t: "수락한 [FROM.GetName]!"
 iraq_md.79.d: "[FROM.GetName]은(는) 우리의 투자 요청을 수락했으며, 이라크 경제가 번영하도록 도울 것입니다!"
 iraq_md.79.a: "좋아"
 iraq_md.80.t: "거부한 [FROM.GetName]"
 iraq_md.80.d: "[FROM.GetName]은(는) 우리의 원조 및 투자 요청을 거부했으며, 따라서 우리를 저버릴 것입니다."
 iraq_md.80.a: "젠장"
 iraq_md.81.t: "쿠르드족에 대한 공격을 명령하는 [IRQ.GetLeader]"
 iraq_md.81.d: "[IRQ.GetLeader]은(는) 우리 병력에게 국가 북부의 쿠르드 반군을 공격하라고 요구했습니다. 이 일련의 명령은 분노와 충동을 제어하지 못한 그의 최근 격정에서 비롯된 것입니다."
 iraq_md.81.a: "젠장, 알겠다"
 iraq_md.81.b: "젠장, 지금은 감당할 수 없다"
 iraq_md.82.t: "표적을 격파한 이라크군"
 iraq_md.82.d: "이라크군은 최근 [IRQ.GetLeader]의 격정에서 비롯된 명령에 따라 국가 서부의 방어 병력에 맞서 승리를 거두었습니다."
 iraq_md.82.a: "알겠다"
 iraq_md.83.t: "저항 축에 가입하기를 원하는 [FROM.GetName]"
 iraq_md.83.d: "[FROM.GetName]은(는) 저항 축에 가입하여 미국에 맞서 싸우고 싶다는 청원서를 우리 정부에 보냈습니다. 그들의 요청에 어떻게 응답해야 합니까?"
 iraq_md.83.a: "환영한다!"
 iraq_md.83.b: "그들을 우리 진영에 들일 수 없다"
 iraq_md.84.t: "우리 요청에 동의한 [FROM.GetName]"
 iraq_md.84.d: "[FROM.GetName]은(는) 우리의 요청에 동의하였으며, 우리는 전 세계에 걸친 서방 제국주의에 맞서 싸우기 위해 저항 축에 합류할 것입니다!"
 iraq_md.84.a: "좋아"
 iraq_md.85.t: "우리 요청을 거부한 [FROM.GetName]"
 iraq_md.85.d: "[FROM.GetName]은(는) 우리의 요청을 거부하였으며, 우리는 이란 없이 목표를 달성해야 할 수도 있어 보입니다."
 iraq_md.85.a: "젠장"
 iraq_md.86.t: "이라크군을 격파한 방어 병력"
 iraq_md.86.d: "이라크군은 최근 [IRQ.GetLeader]의 격정에서 비롯된 최초 명령에 따라 국가 서부의 방어 병력에 맞섰다가 패배를 당했습니다."
 iraq_md.86.a: "알겠다"
 iraq_md.87.t: "병력에게 지역 시장 약탈을 명령하는 [IRQ.GetLeader]"
 iraq_md.87.d: "[IRQ.GetLeader]은(는) 자신의 측근 병력에게 인근 시장, 특히 정부가 의심스럽다고 지정한 곳들을 약탈하라고 명령했습니다."
 iraq_md.87.a: "알겠다"
 iraq_md.87.b: "좋은 생각이 아니다"
 iraq_md.88.t: "돈을 펑펑 쓰고 싶어 하는 [IRQ.GetLeader]"
 iraq_md.88.d: "[IRQ.GetLeader]은(는) 호화로운 파티를 열기 위해 국가 GDP의 10%를 쓰려 하고 있으며, 전국 각지의 여성들을 자신의 궁전으로 초대하려 합니다."
 iraq_md.88.a: "이제 신경도 쓰고 싶지 않다"
 iraq_md.88.b: "안 된다, 돈이 없다고 전하라!"
 iraq_md.89.t: "일부 관리의 숙청을 원하는 [IRQ.GetLeader]"
 iraq_md.89.d: "[IRQ.GetLeader]은(는) 자신이 '수상쩍다'고 여기는 여러 관리를 검거하여 직접 처벌하려 합니다. 이를 자신이 직접 처리하겠다는 그의 고집은 측근들 중 몇몇을 우려하게 만들었습니다.."
 iraq_md.89.a: "우리가 할 수 있는 일은 많지 않다"
 iraq_md.89.b: "그를 설득해 포기시켜 본다"
 iraq_md.90.t: "정신 붕괴를 겪는 [IRQ.GetLeader]"
 iraq_md.90.d: "[IRQ.GetLeader]은(는) 정신 붕괴를 겪었으며, 오늘 모든 장군을 자신의 집무실로 불러들여 모든 문을 잠그라고 명령했습니다. 몇 시간 전 그의 집무실 안에서 총성이 들렸습니다.."
 iraq_md.90.a: "좋은 일일 리 없다.."
 iraq_md.91.t: "공격받는 이라크"
 iraq_md.91.d: "이라크 정부가 미국인들의 공격을 받으면서 그들의 군대에 큰 부담이 가해지고 있습니다. 우리는 이 기회를 이용해 현재 이라크인들의 손에 있는 오래전에 잃어버린 땅 일부를 되찾을 수 있습니다."
 iraq_md.91.a: "우리 땅을 되찾아야 한다!"
 iraq_md.91.b: "개입하지 않는 것이 최선이다"
 iraq_md.92.t: "이라크의 정치적 불안정 조장 계획을 밝힌 정보"
 iraq_md.92.d: "동맹국들이 입수한 최근 문서에 따르면 이라크 정부는 언젠가 우리 국내에 일종의 내부 갈등을 조장할 계획입니다. 우리나라 내 이라크의 영향력을 최소한으로 유지하는 것이 최선입니다."
 iraq_md.92.a: "알겠다"
 iraq_saddam.1.t: "우리에게 해군 기지 통제권 장악을 요구하는 [IRQ.GetLeader]"
 iraq_saddam.1.d: "[IRQ.GetLeader]은(는) 최근 매우 격앙된 서한을 보내, 우리가 미국에 위탁한 해군 기지의 통제권을 장악하라고 요구했습니다. 어느 쪽을 택하든 강대국 중 하나는 격분하게 될 것입니다."
 iraq_saddam.1.a: "그의 서한을 버려라"
 iraq_saddam.1.b: "또 다른 전쟁의 위험을 감수할 수 없다.."
 iraq_saddam.2.t: "굴복한 [KUW.GetName]"
 iraq_saddam.2.d: "[KUW.GetName]은(는) 우리의 요구에 굴복하여 미국인들로부터 해군 기지를 장악하였으며, 이는 우리의 지역 통제력을 강화해 줍니다."
 iraq_saddam.2.a: "좋아"
 iraq_saddam.3.t: "[IRQ.GetName]의 요구에 굴복한 [KUW.GetName]!"
 iraq_saddam.3.d: "어떤 이유에서인지 [KUW.GetName]의 그 개자식들은 우리 뒤통수를 치고 미친 독재자의 요구에 굴복하는 것이 좋은 생각이라고 판단했습니다!"
 iraq_saddam.3.a: "제재다!"
 iraq_saddam.4.t: "우리를 무시한 [KUW.GetName]!"
 iraq_saddam.4.d: "[KUW.GetName]은(는) 우리가 보낸 서한에 공식 답변을 보내지 않았으며, 이는 그들이 제국주의 세력을 위해 기꺼이 자신을 팔아넘기려 한다는 뜻입니다!"
 iraq_saddam.4.a: "[KUW.GetName]과(와)의 모든 관계를 끊어라!"
 iraq_saddam.5.t: "방위 협정을 제안하는 [IRQ.GetLeader]"
 iraq_saddam.5.d: "[IRQ.GetLeader]은(는) 다소 이상한 제안을 해 왔습니다. 이라크 지도자는 외세의 침공이 있을 경우 자신들을 지원해 달라고 요청했습니다. 그 대가로 그들은 우리의 독립을 승인하고 자신들이 영유권을 주장하는 쿠르드 영토에 대한 주장을 철회하겠다고 합니다."
 iraq_saddam.5.a: "훌륭한 기회이다"
 iraq_saddam.5.b: "얼마나 끔찍한 제안인가"
 iraq_saddam.6.t: "수락한 [KUR.GetName]!"
 iraq_saddam.6.d: "[KUR.GetName]은(는) 우리나라와 방위 협정을 체결하는 데 동의했습니다. 그 대가로 우리는 영유권 주장을 철회할 것입니다."
 iraq_saddam.6.a: "알겠다"
 iraq_saddam.7.t: "거부한 [KUR.GetName]!"
 iraq_saddam.7.d: "[KUR.GetName]은(는) 우리의 제안을 거부하기로 결정하였으며, 이는 전쟁이 일어날 경우 우리가 신경 써야 할 전선이 하나 더 늘어났음을 의미합니다..."
 iraq_saddam.7.a: "젠장"
 iraq_yearly.1.t: "요청을 보내는 알두리"
 iraq_yearly.1.d: "이자트 이브라힘 알두리는 대규모 분쟁에 우리 병력이 더 잘 대비할 수 있도록 고위 장교와 장군의 훈련에 예산을 더 투입해 달라고 요청했습니다. 물론 그의 제안은 주로 그 자신과 그의 필요에 이익이 될 것입니다."
 iraq_yearly.1.a: "좋다, 안 될 것 없지"
 iraq_yearly.1.b: "안된다"
 iraq_yearly.2.t: "영향력을 공고히 하는 무하바라트"
 iraq_yearly.2.d: "무하바라트(우리의 정보 부서)가 최근 군 인력과 장군 등 사이에서 영향력을 확대하려는 움직임을 보였습니다. 그들의 성장은 우리나라에서 도둑 정치의 영향력이 서서히 사라지고, 국민의 시민권이 한층 더 줄어드는 방향으로의 전환을 의미합니다."
 iraq_yearly.2.a: "문제될 것 없어 보인다"
 iraq_yearly.2.b: "안 된다! 이런 일은 일어나선 안 된다"
 iraq_yearly.3.t: "샤트알아랍 수로를 불법 월경한 이란군"
 iraq_yearly.3.d: "이란 측 국경의 일부 부대가 이라크로 불법 월경하여 합동참모본부 내에서 많은 논쟁이 일고 있습니다. 이제 이라크 영토에 대한 이번 침범에 대해 입장을 정해야 함이 분명합니다."
 iraq_yearly.3.a: "지금 대응하라!"
 iraq_yearly.3.b: "상관없다"
 IRQ_controlled_instability_idea: "통제된 불안정"
 IRQ_nuclear_experts: "핵 전문가"
 IRQ_conventional_focus: "재래식 전력 중시"
 IRQ_baath_equilibrium: "바트주의의 충격파"
 IRQ_baath_equilibrium_desc: "일부 국민 사이에서는 여전히 바트주의 정서가 높으며, 이를 적절히 다루어야 합니다."
 IRQ_arable_land_project: "경작지 전환"
 IRQ_arable_land_project_desc: "이 주의 특정 토지 구획은 농사에 더 적합하도록 개조되었습니다."
 IRQ_saddam_rage_idea: "[IRQ.GetLeader]의 분노"
 IRQ_saddam_rage_idea_desc: "[IRQ.GetLeader]은(는) 장기적으로 우리나라에 해가 된다는 것을 알면서도 분노를 다스리는 데 약간의 어려움을 겪고 있습니다..\n§W-----------------------------------------------------------------§!\n이 국가 정신은 §H사담 후세인§! 또는 §H우다이 후세인§!이 이라크의 지도자가 아닐 경우 §R제거§!됩니다."
 IRQ_resisting_sanctions: "제재 저항"
 IRQ_resisting_sanctions_desc: "우리는 우리에게 가해진 제재에 맞서기 위해 노력해 왔습니다."
 IRQ_resilient_infrastructure: "회복력 있는 기반시설"
 IRQ_resilient_infrastructure_desc: "회복력 있는 기반시설은 이라크를 사고로부터 지켜 내어 국민의 안전을 보장할 것입니다."
 IRQ_protected_oil_resources: "보호된 석유 매장량"
 IRQ_protected_oil_resources_desc: "우리의 석유가 안전하고 무사하다는 것을 알고 안심하고 쉴 수 있습니다."
 IRQ_increased_exports: "수출 증대"
 IRQ_increased_exports_desc: "우리는 경제를 개선하기 위해 이라크산 상품의 수출을 늘렸습니다."
 IRQ_relying_on_our_own_strength_spirit: "자력 의존"
 IRQ_relying_on_our_own_strength_spirit_desc: "이라크가 번영하는 데 필요한 것은 이라크인뿐이며, 그 누구도 필요하지 않습니다."
 IRQ_reverse_engineering_spirit: "역설계 노력"
 IRQ_reverse_engineering_spirit_desc: "새로운 설계를 고안하느라 시간을 낭비할 필요는 없습니다. 이미 존재하는 설계를 살펴보면 됩니다."
 IRQ_resistance_jewel: "저항의 보석"
 IRQ_resistance_jewel_desc: "우리 국가는 이 억압적인 세계에서 저항의 보석입니다."
