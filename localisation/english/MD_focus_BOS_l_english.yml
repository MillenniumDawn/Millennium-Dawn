 # Political Parties
 BOS.conservatism: "£Bosnian_conservatism (SDA) - Party of Democratic Action"
 BOS.conservatism_icon: "£Bosnian_conservatism"
 BOS.conservatism_desc: "(Conservatism) - Party of Democratic Action (Bosnian: Stranka demokratske akcije, SDA)\n\nFounded in 1990 by Alija Izetbegović, the SDA became the leading Bosniak party during independence and the Bosnian War. It combines conservative social policy, Bosniak political representation, and support for Bosnia and Herzegovina as a sovereign state. The party entered the postwar period as a central participant in state and Federation institutions."
 BOS.conservatism_sbih: "£bosnia_sbih (SBiH) - Party for Bosnia and Herzegovina"
 BOS.conservatism_sbih_icon: "£bosnia_sbih"
 BOS.conservatism_sbih_desc: "(National Conservatism) - Party for Bosnia and Herzegovina (Bosnian: Stranka za Bosnu i Hercegovinu, SBiH)\n\nHaris Silajdžić founded SBiH in 1996 after leaving the SDA. The party favors stronger state institutions, a civic conception of citizenship, and closer European integration. Its support is concentrated among Bosniak voters in the Federation of Bosnia and Herzegovina."
 BOS.socialism: "£Bosnian_socialism (SDP BiH) - Social Democratic Party"
 BOS.socialism_icon: "£Bosnian_socialism"
 BOS.socialism_desc: "(Social Democracy) - Social Democratic Party of Bosnia and Herzegovina (Bosnian: Socijaldemokratska partija Bosne i Hercegovine, SDP BiH)\n\nThe SDP BiH was established in 1992 as the successor to Bosnia's League of Communists. It advocates a multiethnic civic state, secular government, social welfare, and European integration. The party competes across entity and ethnic lines, though most of its support comes from urban areas in the Federation."
 BOS.Communist-State: "£Bosnian_Communist (KBiH) - Communists of Bosnia and Herzegovina"
 BOS.Communist-State_icon: "£Bosnian_Communist"
 BOS.Communist-State_desc: "(Marxism-Leninism) - Communists of Bosnia and Herzegovina (Bosnian: Komunisti Bosne i Hercegovine, KBiH)\n\nBosnia's communist movement draws on veterans and institutions of the former League of Communists. It favors state ownership, secular government, and renewed cooperation among the peoples of the former Yugoslavia. Its influence is limited in the postwar multiparty system."
 BOS.Neutral_conservatism: "£Bosnian_Neutral_conservatism (PDP) - Party of Democratic Progress"
 BOS.Neutral_conservatism_icon: "£Bosnian_Neutral_conservatism"
 BOS.Neutral_conservatism_desc: "(Liberal Conservatism) - Party of Democratic Progress (Serbian: Partija demokratskog progresa, PDP)\n\nMladen Ivanić founded the PDP in September 1999 as a moderate alternative to the Serbian Democratic Party. It supports market reform, parliamentary government, and European integration while defending Republika Srpska's constitutional position. The party entered the 2000 campaign as a new but organized Serb opposition force."
 BOS.Neutral_conservatism_PDP: "£Bosnian_Neutral_conservatism (PDP) - Party of Democratic Progress"
 BOS.Neutral_conservatism_PDP_icon: "£Bosnian_Neutral_conservatism"
 BOS.Neutral_conservatism_PDP_desc: "(Liberal Conservatism) - Party of Democratic Progress (Serbian: Partija demokratskog progresa, PDP)\n\nMladen Ivanić founded the PDP in September 1999 as a moderate alternative to the Serbian Democratic Party. It supports market reform, parliamentary government, and European integration while defending Republika Srpska's constitutional position. The party entered the 2000 campaign as a new but organized Serb opposition force."
 BOS.Neutral_conservatism_SDS: "£bosnia_sds (SDS) - Serbian Democratic Party"
 BOS.Neutral_conservatism_SDS_icon: "£bosnia_sds"
 BOS.Neutral_conservatism_SDS_desc: "(National Conservatism) - Serbian Democratic Party (Serbian: Srpska demokratska stranka, SDS)\n\nFounded in 1990, the SDS led the Bosnian Serb wartime government and remained a major party in Republika Srpska after Dayton. It emphasizes Serb national representation, entity autonomy, and conservative social policy. International pressure and wartime legacies constrain its participation in state institutions."
 BOS.neutral_Social: "£Bosnian_neutral_Social (SNSD) - Alliance of Independent Social Democrats"
 BOS.neutral_Social_icon: "£Bosnian_neutral_Social"
 BOS.neutral_Social_desc: "(Social Democracy) - Alliance of Independent Social Democrats (Serbian: Savez nezavisnih socijaldemokrata, SNSD)\n\nFounded in 1996 under Milorad Dodik, the SNSD initially presented itself as a moderate social-democratic alternative to the SDS in Republika Srpska. It supports the entity's constitutional powers while participating in Bosnia and Herzegovina's joint institutions. The party entered government in Republika Srpska before the 2000 start date."
 BOS.neutral_SocialSNSD: "£Bosnian_neutral_Social (SNSD) - Alliance of Independent Social Democrats"
 BOS.neutral_SocialSNSD_icon: "£Bosnian_neutral_Social"
 BOS.neutral_SocialSNSD_desc: "(Social Democracy) - Alliance of Independent Social Democrats (Serbian: Savez nezavisnih socijaldemokrata, SNSD)\n\nFounded in 1996 under Milorad Dodik, the SNSD initially presented itself as a moderate social-democratic alternative to the SDS in Republika Srpska. It supports the entity's constitutional powers while participating in Bosnia and Herzegovina's joint institutions. The party entered government in Republika Srpska before the 2000 start date."
 BOS.neutral_SocialDF: "£bosnia_DF (DF) - Democratic Front"
 BOS.neutral_SocialDF_icon: "£bosnia_DF"
 BOS.neutral_SocialDF_desc: "(Social Democracy) - Democratic Front (Bosnian: Demokratska fronta, DF)\n\nŽeljko Komšić founded the Democratic Front in 2013 after leaving the SDP BiH. It advocates a civic, multiethnic state, stronger central institutions, social welfare, and Euro-Atlantic integration. The party appears through Bosnia's later political rotation rather than at the 2000 start."
 BOS.Neutral_Libertarian: "£generic_Neutral_Libertarian_small (LDS) - Liberal Democratic Party"
 BOS.Neutral_Libertarian_icon: "£generic_Neutral_Libertarian_small"
 BOS.Neutral_Libertarian_desc: "(Liberalism) - Liberal Democratic Party of Bosnia and Herzegovina (Bosnian: Liberalno demokratska stranka Bosne i Hercegovine, LDS)\n\nFounded in 1990, the LDS promotes civil liberties, market reform, secular government, and a multiethnic Bosnian state. It remained a small party after the war but provided an established liberal alternative at the 2000 start."
 BOS.Nat_Populism: "£bosnia_hdz (HDZ BiH) - Croatian Democratic Union"
 BOS.Nat_Populism_icon: "£bosnia_hdz"
 BOS.Nat_Populism_desc: "(National Conservatism) - Croatian Democratic Union of Bosnia and Herzegovina (Croatian: Hrvatska demokratska zajednica Bosne i Hercegovine, HDZ BiH)\n\nFounded in 1990, HDZ BiH became the principal party representing Bosnian Croats during the war and after Dayton. It supports Croat political representation, decentralized institutions, conservative social policy, and close relations with Croatia. The party is a regular participant in state and Federation governing coalitions."
 BOS.Nat_Fascism: "£Bosnian_Nat_Fascism (BPS) - Bosnian Patriotic Party"
 BOS.Nat_Fascism_icon: "£Bosnian_Nat_Fascism"
 BOS.Nat_Fascism_desc: "(Ultranationalism) - Bosnian Patriotic Party (Bosnian: Bosanskohercegovačka patriotska stranka, BPS)\n\nFormer Army of the Republic of Bosnia and Herzegovina commander Sefer Halilović founded the BPS in 1996. The party combines Bosniak nationalism, veterans' interests, and support for a stronger Bosnian state. Its most radical supporters occupy the ultranationalist edge of postwar politics."
 BOS.Nat_Autocracy: "£generic_Nat_Autocracy (OSBiH) - Armed Forces of Bosnia and Herzegovina"
 BOS.Nat_Autocracy_icon: "£generic_Nat_Autocracy"
 BOS.Nat_Autocracy_desc: "(Military Junta) - Armed Forces of Bosnia and Herzegovina (Bosnian: Oružane snage Bosne i Hercegovine, OSBiH)\n\nThe unified armed forces were established in 2005 by combining the Federation and Republika Srpska military structures. They normally answer to civilian institutions and the collective presidency. A military government can emerge only through Bosnia's later junta path."
 BOS.Caliphate: "£BOS_salafist_jihadism (El Mudžahid) - Bosnian Mujahideen"
 BOS.Caliphate_icon: "£BOS_salafist_jihadism"
 BOS.Caliphate_desc: "(Salafist Jihadism) - Bosnian Mujahideen (Arabic: المجاهد, Bosnian: El Mudžahid)\n\nThe El Mudžahid detachment brought foreign Islamist fighters into the Army of the Republic of Bosnia and Herzegovina during the Bosnian War. The formation was disbanded after Dayton, and several members were investigated for wartime abuses. It can return only through the later Islamist uprising path."

