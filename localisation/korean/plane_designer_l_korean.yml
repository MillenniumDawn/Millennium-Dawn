 engine_prop_single_1: "초기 프롭 엔진"
 engine_prop_single_1_desc: "2차 세계 대전의 프로펠러 엔진은 특히 예산이 제한된 경우 항공기가 전투 작전을 수행하는 데 필요한 추력을 여전히 제공했습니다.$ENGINE_INFO$"
 engine_prop_single_2: "냉전기 프롭 엔진"
