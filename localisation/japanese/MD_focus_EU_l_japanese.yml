 EUevent.4.t: "ヨーロッパ合衆国"
 EUevent.4.d: "[FROM.GetNameWithFlag] is uniting the member states of §C[EUU.GetFlag] The European Union§! to one European Superstate called §C[EUU.GetFlag] The United States of Europe§!. [ROOT.GetNameWithFlag] will give up its sovereignty and join §C[EUU.GetFlag] The United States of Europe§!."
 EUevent.4.a: "歓喜の歌を！"
 EUevent.5.t: "欧州債務危機"
 EUevent.5.d: "欧州連合はユーロ圏改革を実行できず、深刻な財政危機に直面している。加盟国は政府債務の返済や再融資に失敗し、過剰債務を抱えた銀行の救済もままならない。現在、加盟国は金融・経済の安定を確保するため、急いで改革を推し進めようとしている。しかし、危機はすでに始まっており、ユーロは崩壊の瀬戸際にある。"
 EUevent.5.a: "ユーロの存続が懸かっている！"
 EUevent.6.t: "ユーロ圏改革"
 EUevent.6.d: "迫り来る債務危機は、財政同盟の実施、欧州中央銀行（ECB）の権限拡大、追加の安定メカニズムなど、ユーロ圏における一連の改革を通じて回避された。ユーロ圏は救われ、欧州連合は危機が回避されたという確信を持って未来を見据えることができる。"
 EUevent.6.a: "多様性における調和。"
 EUevent.7.t: "ユーロ圏改革"
 EUevent.7.d: "The Global Financial Crisis in the United States has triggered a cascading effect amongst the nations of Europe. Many members of the European Parliament are looking for a resolution to the mounting debt in a number of countries in the European Union. The countries have failed to either pay, refinance their governmental debt, or issue emergency funds to failing banks in the wake of the Global Financial Crisis. All of the member states in question have reported an inability to repay their debt and have revealed that their budget deficits were much worse than previously thought. The main commonality amongst the nations is that the root cause of the crisis comes from shifting private debt to national debt through a series of debt bailouts to rescue struggling institutions within the countries. The European Central Bank (ECB) and International Monetary Fund (IMF) have begun working out deals with the member states to issue relief packages and national bailout programs to prevent a much worse crisis. The one thing that remains clear is that the European Union is on the verge of a cataclysmic crisis, as we stand in the center of the storm that is the Global Financial Crisis. We must remain strong and the Union must reform the Eurozone so we can weather the storm and show the European Union will not falter. Not now, not tomorrow, not ever. In varietate concordia."
 EUevent.7.a: "ユーロのために！"
 EUevent.8.t: "トロイカ改革達成！"
 EUevent.8.d: "[ROOT.GetNameWithFlag]は、いわゆる欧州委員会（EC）、欧州中央銀行（ECB）、国際通貨基金（IMF）のトロイカによって要求された改革を実施した。これは[ROOT.GetNameWithFlag]の国民にとって緊縮財政を意味する！"
 EUevent.8.a: "我々は回復するだろう！"
 EUevent.9.t: "偶然の退出"
 EUevent.9.d: "[ROOT.GetNameWithFlag] has failed to accomplish the reforms demanded by the so-called Troika of the European Commission (EC), the European Central Bank (ECB) and the International Monetary Fund (IMF). The other member states refer to the No Bailout Clause, so [ROOT.GetNameWithFlag] has to leave the eurozone and §C[EUU.GetFlag] The European Union§! to devalue its own new currency and prevent bankruptcy."
 EUevent.9.a: "暗黒の時代が待ち受けている"
 EUevent.10.t: "海軍を欧州海軍へ移管"
 EUevent.10.d: "21世紀において多国籍艦隊や任務部隊がより一般的かつ重要になるにつれて、[EUU.GetFlag]欧州連合の加盟国は、その戦力を結集し、軍艦を欧州海軍として知られる統一された欧州海軍司令部に移管することを決定した。\n\n[FROM.GetNameWithFlag]は欧州海軍事務総長の職にあり、我々の艦隊に欧州海軍への参加を要求している。"
 EUevent.10.a: "ヨーロッパよ、波を治めよ！"
 EUevent.10.b: "我々は決して艦隊を放棄しない！"
 EUevent.18.t: "[FROM.GetNameWithFlag]が軍事演習の開催を要請"
 EUevent.18.d: "[FROM.GetNameWithFlag]は、国境での軍事演習の開催を我々に要請している。国境での軍事演習は世界の緊張を高める可能性があるため、軍事演習を許可する前に慎重に選択肢を検討することが重要である。"
 EUevent.18.a: "演習を許可する"
 EUevent.18.b: "ダメだ"
 EUelection.1.t: "[GetYear]欧州議会選挙"
 EUelection.1.d: "欧州議会選挙は5年ごとに行われる。"
 EUelection.1.a: "了解"
 EU_news.20.t: "偶然の退出"
 EU_news.20.d: "[FROM.GetNameWithFlag] has failed to accomplish the reforms demanded by the so-called Troika of the European Commission (EC), the European Central Bank (ECB) and the International Monetary Fund (IMF). The other member states refer to the No Bailout Clause, so [FROM.GetNameWithFlag] has to leave the eurozone and §C[EUU.GetFlag] The European Union§! to devalue its own new currency and prevent bankruptcy."
 EU_news.20.a: "さようなら！"
 EU_news.21.t: "A Member State Leaves the Union"
 EU_news.21.d: "[FROM.GetNameWithFlag]が§C[EUU.GetFlag]欧州連合§!から脱退。"
 EU_news.21.a: "さようなら！"
 EU_news.22.t: "第50条が撤回される"
 EU_news.22.d: "[FROM.GetNameWithFlag]は第50条を撤回し、§C[EUU.GetFlag]欧州連合§!に留まることを決定した。"
 EU_news.22.a: "了解"
 EU_news.23.t: "離脱協定"
 EU_news.23.d: "[FROM.GetNameWithFlag] and the member states of §C[EUU.GetFlag] The European Union§! have signed a Withdrawal Treaty. [FROM.GetNameWithFlag] will leave §C[EUU.GetFlag] The European Union§! on the conditions stated in the Withdrawal Treaty."
 EU_news.23.a: "さようなら、友よ！"
 EU_news.24.t: "第50条の延長"
 EU_news.24.d: "[FROM.GetNameWithFlag] and the member states of §C[EUU.GetFlag] The European Union§! have agreed to extend Article 50 for three months. Now [FROM.GetNameWithFlag] will leave §C[EUU.GetFlag] The European Union§! in three months."
 EU_news.24.a: "了解"
 EU_news.34.t: "リスボン条約50条の行使"
 EU_news.34.d: "[FROM.GetNameWithFlag]はリスボン条約第50条を行使し、今後2年以内に§C[EUU.GetFlag]欧州連合§!から離脱する。"
 EU_news.34.a: "了解"
 EU_news.25.t: "艦隊の欧州海軍への移管"
 EU_news.25.d: "[FROM.GetNameWithFlag]は、その艦隊を欧州海軍事務総長の職にある[FROM.FROM.GetNameWithFlag]に移管している。"
 EU_news.25.a: "了解"
 EU_news.26.t: "艦隊移管拒否"
 EU_news.26.d: "[FROM.GetNameWithFlag]はその艦隊を欧州海軍に移管しない。"
 EU_news.26.a: "了解"
 EU_news.27.t: "欧州連合に新たな加入国"
 EU_news.27.d: "[FROM.GetNameWithFlag]が§C[EUU.GetFlag]欧州連合§!に加入した。"
 EU_news.27.a: "ようこそ！"
 EU_news.32.t: "OMTプログラム"
 EU_news.32.d: "欧州中央銀行はOMTプログラムを開始した。"
 EU_news.32.a: "了解"
 EU_news.33.t: "OMTプログラム終了"
 EU_news.33.d: "欧州中央銀行の現在行われているOMTプログラムが終了した。"
 EU_news.33.a: "了解"
 EU_news.45.t: "OMTプログラム縮小"
 EU_news.45.d: "ECBはそのOMTプログラムを縮小した。\n§YOMT規模上限§!:§R-$200§!b追加\n§Y利率§!<§R4.0%§!の全加盟国:欧州主義に§G+5%§!\n§Y金利§!>§R4.0%§!の全加盟国:欧州主義を§R-5%§!\n"
 EU_news.45.a: "了解"
 EU_news.46.t: "OMTプログラム拡大"
 EU_news.46.d: "ECBはそのOMTプログラムを拡大した。\n§YOMT規模上限§!:§G+$200§!b追加\n§Y利率§!<§R4.0%§!の全加盟国:欧州主義を§R-5%§!\n§Y金利§!>§R4.0%§!の全加盟国:欧州主義に§G+5%§!\n"
 EU_news.46.a: "了解"
 EU_news.47.t: "欧州防衛連合（EDU）"
 EU_news.47.d: "集団的利益を守り、外部の紛争や危機に対応し、近隣地域に安全保障を投射するために必要な戦略的自律性を達成するため、加盟国は軍事同盟として欧州防衛連合（EDU）を結成し、集団的にNATOを脱退することを決定した。"
 EU_news.47.a: "了解"
 EU_news.48.t: "欧州防衛連合（EDU）"
 EU_news.48.d: "共通の利益を守り、外部の紛争や危機に対応し、欧州周辺地域の安全を確保するために必要な戦略的自立を達成するため、[EUU.GetFlag][EUU.GetName]の加盟国は軍事同盟として欧州防衛連合（EDU）を結成し、NATOから集団的に脱退することを決定した。"
 EU_news.48.a: "了解"
 EU_news.49.t: "NATO加盟国が離脱しEDUに加入"
 EU_news.49.d: "[FROM.GetNameWithFlag] leaves NATO and joins [EUU.GetFlag] The European Union and the European Defence Union (EDU)."
 EU_news.49.a: "了解"
 EU_news.50.t: "国境での軍事演習"
 EU_news.50.d: "[FROM.GetNameWithFlag]が我が国との国境で軍事演習を実施している。我々も対応を検討すべきだ。"
 EU_news.50.a: "了解"
 EU_news.51.t: "軍事演習に対抗される"
 EU_news.51.d: "[FROM.GetNameWithFlag]が我が国の軍事演習に対抗し、自国の国境で軍事演習を実施している。"
 EU_news.51.a: "了解"
