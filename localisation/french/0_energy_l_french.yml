 energy_building_battery_parks_desc: "Nous avons opté pour les énergies renouvelables. Il est temps de commencer à produire les matériaux nécessaires à notre nation pour stocker l'énergie générée par nos infrastructures renouvelables."
 energy_automatic_fuel_purchase: "Achat automatique de §Y Carburant§!"
 energy_automatic_fuel_purchase_desc: "Nous achetons actuellement du carburant au prix du marché tous les vingt-huit jours."
 has_an_energy_deficit_tt: "[THIS.GetNameWithFlag] a actuellement un §Ydéficit énergétique§! (écart actuel : [?THIS.energy_difference_variable|Y0])\n"
 energy_load_sharing_recipient: "[THIS.GetNameWithFlag] reçoit actuellement de l'§Yénergie§! via un accord de §Ypartage de charge énergétique§!.\n"
 is_currently_in_an_energy_load_sharing_agreement_tt: "[THIS.GetNameWithFlag] participe actuellement à un accord de §Ypartage de charge énergétique§! avec [ROOT.GetNameWithFlag]\n"
 advanced_production_modifier: "Restrictions de production avancées"
 advanced_production_modifier_desc: "Lorsque nous commençons à manquer de métaux technologiques ([?THIS.resource@tungsten|+]), de métaux précieux ([?THIS.resource@chromium|+]), de pétrole ([?THIS.resource@oil|+]) ou de caoutchouc ([?THIS.resource@rubber|+]), notre production de microprocesseurs et/ou de composites en pâtit. Tout déficit sur l'une de ces ressources réduit la production de microprocesseurs et/ou de composites. De plus, la production de microprocesseurs exige d'importantes quantités d'électricité : les pénuries d'énergie la réduisent encore de [?unfulfilled_energy_demand_dynmod_var|%]\n\n§YLa réduction de production est toujours plafonnée à§! §R95 %§! §Ydes chiffres de production de base.§!"
 civilian_microchip_consumption_modifier: "Consommation de microprocesseurs civils et industriels"
 civilian_microchip_consumption_modifier_desc: "Notre population et nos industries de pointe commenceront à consommer des microprocesseurs, à mesure que les technologies deviendront de plus en plus accessibles aux entreprises et au grand public. Nous devrons répondre à cette demande, faute de quoi nos chaînes de production seront mises à rude épreuve. En temps de guerre, la production militaire sera prioritaire sur l'usage civil, ce qui pourrait engendrer des troubles sociaux, la population n'étant pas satisfaite."
 is_currently_importing_oil_tt: "[THIS.GetNameWithFlag] importe actuellement des §Ycombustibles fossiles§! d'un autre pays.\n"
 early_renewables_9: "Contrôles avancés d'éoliennes"
 early_renewables_9_desc: "Des systèmes de commande de pointe optimisent le rendement des éoliennes en ajustant le calage des pales et l'orientation en lacet afin d'extraire un maximum d'énergie des vents variables."
 renewables_9: "Cellules solaires pérovskites"
 renewables_9_desc: "Les cellules solaires à pérovskite deviennent commercialement viables, offrant un meilleur rendement et des coûts de production plus bas, ce qui accélère encore l'adoption de l'énergie solaire."
 renewables_10: "Centrales marémotrices"
 renewables_10_desc: "Nous pouvons exploiter la puissance des marées océaniques pour alimenter les villes côtières."
 renewables_11: "Expansion des marées"
 renewables_11_desc: "Les progrès de la conversion de l'énergie marémotrice nous permettent d'installer des modules plus denses qu'auparavant, et de nous éloigner davantage du rivage."
 renewables_12: "Centrales d'énergie volcanique"
 renewables_12_desc: "L'implantation de centrales près de volcans actifs nous permet de récolter l'immense énergie géothermique disponible, tout en réduisant les risques d'éruption."
 renewables_13: "Siphonnage de l'asthénosphère"
 renewables_13_desc: "Étendre le principe des centrales volcaniques aux zones de forte activité sismique nous donne un meilleur accès à l'énergie géothermique de l'asthénosphère terrestre."
 fuel_efficiency_7: "Optimisation du carburant quantique"
 fuel_efficiency_7_desc: "L'application de l'informatique quantique aux systèmes de carburant nous permet de gérer la production d'énergie à un niveau encore plus détaillé."
 fuel_efficiency_8: "Implémentation de l'AGI"
 fuel_efficiency_8_desc: "Une IAG peut microgérer la conversion du carburant bien mieux qu'auparavant."
 fuel_efficiency_9: "Nanofibres de carburant spécialisées"
 fuel_efficiency_9_desc: "Des fibres sophistiquées limitent plus que jamais les fuites de chaleur."
 fuel_efficiency_10: "Surveillance superintelligente"
 fuel_efficiency_10_desc: "L'intégration d'une IA superintelligente au processus permet un contrôle quasi absolu de la conversion énergétique."
 energy_efficiency_9: "Efficacité énergétique quantique"
 energy_efficiency_9_desc: "Nous pouvons recourir à la technologie quantique pour améliorer l'efficacité énergétique de notre équipement."
 energy_efficiency_10: "Efficacité quantique avancée"
 energy_efficiency_10_desc: "L'application des dernières découvertes en technologie quantique accroît encore l'efficacité."
 energy_efficiency_11: "Récupération d’énergie quantique"
 energy_efficiency_11_desc: "Les progrès de notre compréhension de la physique quantique permettent de récupérer de l'énergie à l'échelle atomique."
 energy_efficiency_12: "Siphonnage quantique"
 energy_efficiency_12_desc: "Il est possible de siphonner les fluctuations de l'écume quantique et de les convertir en électricité. Nous avons transformé les pertes d'énergie en gains !"
