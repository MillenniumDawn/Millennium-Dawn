 HEZ_the_LAF: "Les FAL"
 hezbollah_influence: "Influence du Hezbollah"
 hezbollah_events.30.d1: "Avec l'aide du Tout-Puissant Allah, et grâce à la foi précieuse et aux vies de nos glorieux combattants de la Résistance, nous avons vaincu la menace sioniste ! Les Forces offensives sionistes fuient le Liban comme des lâches ! Alors que le monde est sous le choc, la Résistance sort victorieuse d'un combat contre la bête sioniste ! Nous avons gagné, et désormais, le monde entier devrait se souvenir de ce nom :"
 hezbollah_events.30.d2: "Le Hezbollah a été vaincu dans sa tentative pathétique de combattre nos soldats. Nous avons submergé leurs défenses misérables et avons maintenant avancé dans le sud du Liban. Les positions autrefois occupées par les combattants du Hezbollah ont été sécurisées et nos soldats continuent de rechercher d'autres menaces ou tout renseignement concernant l'assaut non provoqué contre nos soldats. Une chose reste claire : ils ont été détruits."
 hezbollah_events.30.o2: "Victoire pour Israël !"
 hezbollah_events.31.d1: "Sois patient ! La promesse d'Allah est bien vérité. Et ne te laisse pas ébranler par ceux qui n'ont aucune conviction..."
 hezbollah_events.31.d2: "Les terroristes ont vaincu nos forces combattantes dans un conflit terrestre. Nous devrons certainement prendre le temps de nous remettre de cette défaite humiliante..."
 hezbollah_is_currently_doing_a_raid: "Actuellement en train de mener un raid"
 HEZ_assassination_of_salman_rushdie: "Assassinat de Salman Rushdie"
 hezbollah_events.312.t: "Nous avons perdu !"
 hezbollah_events.312.d: "It appears that our forces were unable to defeat the vile Hezbollah terrorists in Lebanon. Soon enough, however, we will get our revenge."
 hezbollah_events.312.o1: "Nous n'oublierons pas cela"
 HEZ_Asymmetric_Warfare: "Guerre asymétrique"
 HEZ_Asymmetric_Warfare_desc: "Notre force n'est jamais venue d'égaler nos ennemis char contre char ou avion contre avion. Par des combattants disciplinés, un commandement décentralisé, le camouflage et l'usage efficace du terrain, nous pouvons transformer chaque village et chaque colline en champ de bataille. En perfectionnant l'art de la guerre asymétrique, même les armées les plus avancées technologiquement peineront à vaincre la Résistance."
 HEZ_The_Underground_Networks: "Les réseaux souterrains"
 HEZ_The_Underground_Networks_desc: "Nos ennemis s'appuient sur une puissance de feu écrasante pour paralyser notre structure de commandement et notre industrie. En dispersant nos usines, dépôts, centres de commandement et atouts militaires dans un vaste réseau souterrain, nous pouvons assurer que la Résistance continue de combattre même sous le plus lourd bombardement. Plus nous sommes difficiles à trouver, plus nous sommes durs à vaincre."
 HEZ_al_manar_desc: "Al-Manar est la télévision du Hezbollah, utilisée pour diffuser ses vues et ses annonces dans le monde.\n§YLes nations peuvent en affaiblir les effets en brouillant ses émissions via leurs décisions.§!"
 HEZ_weaken_the_al_manar: "Affaiblir Al-Manar"
 HEZ_weaken_the_al_manar_desc: "La télévision Al-Manar a longtemps servi de l'une des plateformes médiatiques les plus influentes du Hezbollah, façonnant l'opinion publique par des émissions, du contenu en ligne et des réseaux satellitaires régionaux. En restreignant son accès aux grands services de diffusion, en perturbant ses canaux de distribution et en coordonnant des campagnes d'information, le gouvernement peut réduire sa portée et limiter son efficacité comme outil d'influence politique."
 HEZ_jam_al_manar_broadcasts: "Diffusions de Jam Al-Manar"
 HEZ_strange_activities: "Activités étranges"
 HEZ_strange_activities_desc: ""