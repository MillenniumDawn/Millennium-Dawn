 raid_type_fuel_production_storage_raid_air: "연료 생산기지 및 저장고 공격"
 raid_type_fuel_production_storage_raid_air_desc: "연료 저장 시설과 정유 시설을 타격하여 연료 생산량과 연료 비축량을 모두 감소시킵니다."
 raid_type_metal_production_raid_air: "금속 광산 타격"
 raid_type_metal_production_raid_air_desc: "광산과 채굴 장비를 타격하여 해당 지역에서 추출할 수 있는 자원을 감소시킵니다."
 raid_type_state_power_strike_air: "전력망 타격"
 raid_type_state_power_strike_air_desc: "적의 전력 생산 시설을 손상시키거나 제거하고 국가의 전력망을 교란하기 위한 타격입니다."
 raid_type_production_strike: "생산 공장 타격"
 raid_type_production_strike_desc: "경제 및 군사 발전을 저해하기 위해 생산 산업을 타격합니다."
 raid_type_infrastructure_strike: "통신망 및 수송 타격"
 raid_type_infrastructure_strike_desc: "도로, 철도, 통신망 기반시설을 타격하여 보급 수송과 통신을 교란합니다."
 raid_type_tactical_nuclear_strike: "전술 핵 공격"
 raid_type_tactical_nuclear_strike_desc: "전술적 용도로 지역 하나에 사용하는, 위력이 낮은 단일 핵장치입니다."
 raid_type_state_nuclear_strike: "주 단위 핵 타격"
 raid_type_state_nuclear_strike_desc: "단일 주에 핵 타격을 가하여 그 주 안에 있는 모든 것에 막대한 피해를 입힙니다."
 raid_type_strategic_nuclear_strike: "전면 핵 타격"
 raid_type_strategic_nuclear_strike_desc: "§R우리가 아는 세상의 종말.§! 한 국가 전체에 단번에 핵 타격을 가합니다."
 raid_type_cruise_missile_port_strike: "순항 미사일 항구 타격"
 raid_type_cruise_missile_port_strike_desc: "항구에 정박한 적 함선과 적 항만 시설을 공격하기 위한 지상발사 순항 미사일 타격입니다."
 raid_type_canal_bombing_raid: "운하 갑문 타격"
 raid_type_canal_bombing_raid_desc: "운하의 갑문을 타격하여 운하의 운영을 막습니다."
 raid_type_offensive_counter_air_strike: "공세적 대공 미사일 타격"
 raid_type_offensive_counter_air_strike_desc: "적 항공기 운용을 교란하기 위해 적 공군 기지에 가하는 순항 미사일 타격입니다."
 raid_type_divisions_cruise_missile_strike: "사단 미사일 타격"
 raid_type_divisions_cruise_missile_strike_desc: "적 병력 집결지에 대규모 순항 미사일 타격을 가해 막대한 피해를 입힙니다."
 raid_type_special_reconassiance: "특수 정찰 임무"
 raid_type_special_reconassiance_desc: "특수부대 요원들이 장거리 정찰 임무를 수행하여 특정 목표에 대한 작전에 우리 병력이 더 잘 대비할 수 있게 합니다."
 raid_type_direct_action_raid_supply: "보급 습격"
 raid_type_direct_action_raid_supply_desc: "특수부대 요원들이 적의 보급선을 공격하는 임무를 수행합니다."
 raid_type_direct_action_raid_air: "공군 기지 습격"
 raid_type_direct_action_raid_air_desc: "특수부대 요원들이 적 공군 기지를 공격하여 손상시키는 임무를 수행합니다."
 raid_type_direct_action_raid_naval: "해군 기지 습격"
 raid_type_direct_action_raid_naval_desc: "특수부대 요원들이 적 항만 시설을 공격하여 손상시키는 임무를 수행합니다."
 raid_type_scientist_kill_mission: "과학자 제거 임무"
 raid_type_scientist_kill_mission_desc: "적 연구원이나 지도부를 제거하는 것만을 목적으로 하는 습격을 수행합니다."
 raid_type_drone_swarm_strikes: "자폭 드론 떼 타격"
 raid_type_drone_swarm_strikes_desc: "주 안에 자폭 드론 떼를 풀어 적 장비를 손상시키고 해당 주에서의 작전을 갈수록 어렵게 만듭니다."
 raid_type_drone_target_recon: "표적 드론 정찰"
 raid_type_drone_target_recon_desc: "UAV로 전담 정찰 임무를 빈번히 비행시켜 정보를 수집하고 해당 주의 군사 작전을 개선합니다."
 raid_type_targeted_drone_strike: "시설 드론 타격"
 raid_type_targeted_drone_strike_desc: "연구 시설에 드론 타격을 가해 연구 장비를 파괴하고 적의 연구 진행을 지연시킵니다."
 raid_type_anti_missile_strikes: "대미사일 타격"
 raid_type_anti_missile_strikes_desc: "적의 §Y미사일 발사 기지§!를 타격하여 해당 시설을 손상시키거나 파괴합니다."
