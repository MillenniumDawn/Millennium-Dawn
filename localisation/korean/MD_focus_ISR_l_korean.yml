 israel.87.t: "예리코의 운명 협상"
 israel.87.d: "대테러 작전이 시작된 이후, [FROM.GetNameWithFlag]가 예리코 카지노의 장래에 관한 협상을 요청하고 있습니다. 이를 어떻게 처리할지 결정해야 합니다."
 israel.87.a: "오슬로 의정서를 폐기하라."
 israel.87.b: "합의된 대로 유지하라."
 ISR_border_raid_hebron: "헤브론 국경경비대 습격"
 israel.88.t: "족장의 동굴의 운명"
 israel.88.d: "우리 병력이 족장의 동굴에 도달했습니다. 이곳을 어떻게 처리할지 결정해야 합니다."
 israel.88.a: "회당을 비워라!"
 israel.88.b: "기도의 길을 군사화하라."
 israel.88.c: "현상 유지인가?"
 israel.89.t: "툴카렘 테가르트 요새"
 israel.89.d: "이제 툴카렘 테가르트 요새를 어떻게 처리할지 결정해야 합니다. 우리의 계획은 무엇입니까?"
 israel.89.a: "요새를 파괴하라!"
 israel.89.b: "카스바로 전환하라."
 israel.90.t: "탄짐 대응"
 israel.90.d: "탄짐은 한때 파타의 청년 조직이었으나 이후 반독립적인 조직으로 변모했습니다. 우리 병력이 서안 지구에 있는 만큼, 이들을 어떻게 다룰지 결정해야 합니다."
 israel.90.a: "그들의 통합을 허용하라."
 israel.90.b: "탄짐을 해체하라."
 israel.91.t: "작전 성공!"
 israel.91.d: "대테러 작전이 성공하여 테러 조직이 해체되었습니다. 우리는 다시 안전해졌으며 이제 희망을 품고 미래를 바라볼 수 있습니다."
 israel.91.a: "훌륭해!"
 israel.92.t: "작전 실패!"
 israel.92.d: "호마트 마게인 작전이 실패했습니다. 우리가 해체하려 했던 테러 조직은 우리의 실패로 인해 대담해져 그 어느 때보다 강해졌습니다. 우리는 그 결과에 대비해야 합니다."
 israel.92.a: "쓰라린 타격이다."
 israel.92.b: "이대로 둘 수 없다."
 israel.92.c: "어려운 결과다."
