 SOV.liberalism_alt_desc: "（进步自由主义）人民联盟\n\n人民联盟是一个进步自由党，由俄罗斯著名政治人物阿列克谢·纳瓦利内创建。它代表反腐败、自由主义和市场经济。"
 SOV.liberalism_alty: "£SOV_western_social_democrat33 (PP) 进步党"
 SOV.liberalism_alty_icon: "£SOV_western_social_democrat33"
 SOV.liberalism_alty_desc: "（进步自由主义）进步党\n\n进步党是由俄罗斯著名政治人物阿列克谢·纳瓦利内创建的进步自由党。它代表反腐败、自由主义和市场经济。"
 SOV.liberalism_altyn: "£SOV_future (RF)俄罗斯未来党"
 SOV.liberalism_altyn_icon: "£SOV_future"
 SOV.liberalism_altyn_desc: "（进步自由主义）俄罗斯未来党\n\n俄罗斯未来党是由俄罗斯著名政治人物阿列克谢·纳瓦利内创建的进步自由党。它代表反腐败、自由主义和市场经济。"
