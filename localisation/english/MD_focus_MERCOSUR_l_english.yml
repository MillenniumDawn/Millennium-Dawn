 MER_launch_corridor_investment_round: "Launch a MERCOSUR Corridor Investment Round"
 MER_launch_corridor_investment_round_desc: "A stronger bloc cannot exist only on paper. By releasing a new round of treasury-backed corridor funding, we can accelerate infrastructure and network integration across the current full members of MERCOSUR, improving the physical backbone of the bloc."
 MER_release_development_fund_round: "Release a MERCOSUR Development Fund Round"
 MER_release_development_fund_round_desc: "Promises of integration are more convincing when backed by visible investment. By disbursing a new round from the MERCOSUR Development Fund, we can accelerate civilian construction and office expansion across the bloc, strengthening the economic foundations of its full members."

 mercosur.02.t: "Invitation to Join MERCOSUR as an Associate State"
 mercosur.02.d: "[FROM.GetName] has approached us with a proposal to join MERCOSUR as an associate state. Accepting would deepen our integration with the South American bloc without yet committing us to full membership."
 mercosur.02.a: "Accept the associate status."
 mercosur.02.b: "Decline for now."
 mercosur.03.t: "Associate Membership Accepted"
 mercosur.03.d: "[FROM.GetName] has accepted our offer and will join MERCOSUR as an associate state."
 mercosur.03.a: "Excellent."
 mercosur.04.t: "Associate Membership Rejected"
 mercosur.04.d: "[FROM.GetName] has rejected our offer for now. We may try again later."
 mercosur.04.a: "Unfortunate."
 mercosur.05.t: "Full Membership Talks Opened"
 mercosur.05.d: "We have opened formal negotiations to bring [CHL.GetName] into MERCOSUR as a full member."
 mercosur.05.a: "Proceed."
 mercosur.06.t: "Invitation to Become a Full Member of MERCOSUR"
 mercosur.06.d: "[FROM.GetName] has invited us to become a full member of MERCOSUR. This would bind us more deeply to the bloc and its evolving common frameworks."
 mercosur.06.a: "Accept full membership."
 mercosur.06.b: "Remain only an associate state."
 mercosur.07.t: "Full Membership Accepted"
 mercosur.07.d: "[FROM.GetName] has accepted full membership in MERCOSUR."
 mercosur.07.a: "A major step forward."
