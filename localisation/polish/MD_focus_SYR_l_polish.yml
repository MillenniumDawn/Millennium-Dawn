 TT_SYR_FEDERAL_PARTY_EXISTS: "Federaliści utworzyli swoją partię"
 TT_SYR_FEDERALIST_COALITION: "Federaliści są w koalicji rządowej"
 TT_SYR_NATIONALIST_COALITION: "Nacjonaliści są w koalicji rządowej"
 TT_SYR_US_PROTECTION_REQ: "[Western_Autocracy_L] musi być partią rządzącą"
 TT_SYR_DIRECT_DEM_REQ: "Powinniśmy dać Kurdom obywatelstwo, aby mogli szerzyć ideały demokracji bezpośredniej w regionie."
 TT_SYR_KICKING_ASSADS_EFFECT: "Inkluzywność polityczna Alawitów:§R-40%§!"
 TT_SYR_REPUBLICANISM_FOCUS_EFFECT: "For every significant ethnic and religious community in Syria we'll choose between reserving seats in parliament for politicians representing the communities which increases minority inclusiveness in exchange for increased corruption costs, or not doing so which will cause rioting and property damage in their regions whenever their political inclusiveness gets below §Y50%§!"
 TT_SYR_FEDERALISM_FOCUS_EFFECT: "For every significant ethnic and religious community in Syria we'll choose between granting them semi autonomy increasing their political inclusiveness in exchange for reduced resource extraction, construction speed and building slots as well as increasing cost to change governmental law inversely proportional to the political inclusiveness of the community, or releasing the region altogether as an autonomous state"
 TT_SYR_ALLY_FARMERS: "Rolnicy dołączą do nas jako wewnętrzna frakcja w naszej walce"
 TT_SYR_ALLY_INDUSTRIALISTS: "Konglomeraty przemysłowe dołączą do nas jako wewnętrzna frakcja w naszej walce"
 TT_SYR_ALLY_ULEMA: "Ulemowie dołączą do nas jako wewnętrzna frakcja w naszej walce"
 TT_SYR_ALLY_INTL_BANKERS: "Bankierzy międzynarodowi dołączą do nas jako wewnętrzna frakcja w naszej walce"
 TT_SYR_AGRICULTURAL_INVESTMENT_EFFECT: "Inwestowanie w rolnictwo kilkakrotnie pozwoli nowym rynkom i firmom sprzedawać produkty. Jednak liczba inwestycji wymaganych do podtrzymania nowych firm jest uzależniona od poziomu korupcji."
