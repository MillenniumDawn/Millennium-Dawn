 genetics_1: "Huella genética de ADN"
 genetics_1_desc: "La huella genética de ADN fue uno de los mayores inventos del siglo XX. Ayudó a dar pasos agigantados en las labores policiales, la elaboración de perfiles y mucho más dentro del campo de la genética."
 genetics_2: "OGM modernos"
 genetics_2_desc: "Un Organismo Genéticamente Modificado (OGM) es un organismo alterado genéticamente que puede utilizarse en muchos campos diferentes, por ejemplo, en cultivos, ganadería, ciencia y muchas otras formas de cultivo."
 genetics_3: "Terapia génica"
 genetics_3_desc: "La terapia génica es el proceso de seleccionar genéticamente los rasgos deseados y expulsar los rasgos no deseados."
 genetics_4: "Cultivos genéticamente modificados"
 genetics_4_desc: "Los cultivos genéticamente modificados, como el maíz, los tomates u otras plantas, se cultivan con ventajas más sólidas que sus contrapartes tradicionales, tales como una mayor resistencia a los insectos y muchas otras."
 genetics_5: "Proyecto Genoma Humano"
 genetics_5_desc: "La cartografía del Proyecto Genoma Humano ha sido importante para mapear una de las composiciones genéticas más complicadas de la Tierra. Mapear este océano de conocimiento puede impulsar aún más nuestro saber en el mundo de la genética."
 genetics_6: "Pesticidas dirigidos genéticamente"
 genetics_6_desc: "Los pesticidas dirigidos genéticamente se utilizan para atacar genes específicos en las plagas o feromonas secretadas por las plantas para evitar que los insectos o las plagas las dañen."
 genetics_7: "Vida sintética"
 genetics_7_desc: "Los avances en la tecnología genética nos han permitido crear vida desde cero."
 genetics_8: "Clonación segura"
 genetics_8_desc: "La clonación siempre ha sido un asunto inestable. También es bastante peligrosa para los clones. Antes de este gran avance, la mayoría no lograba sobrevivir a su infancia."
 genetics_9: "Tratamiento CRISPR"
 genetics_9_desc: "El tratamiento CRISPR es una técnica de edición genética para eliminar mutaciones de las células."
 genetics_10: "Cultivos editados genéticamente con CRISPR"
 genetics_10_desc: "CRISPR crops are similar to the CRISPR treatment in animals and humans. However, in CRISPR crops it either enhances desirable crop genes, or removes the undesirable traits."
 genetics_11: "Experimentos humanos con CRISPR"
 genetics_11_desc: "Es hora de que empecemos a experimentar en humanos utilizando CRISPR."
 genetics_12: "Humanos modificados genéticamente"
 genetics_12_desc: "Modificar genéticamente a los humanos para que sean más fuertes, mejores, más rápidos y más saludables que antes nos puede ayudar a evolucionar hacia el futuro."
 genetics_13: "Superhumanos"
 genetics_13_desc: "Modificar a los humanos ha trascendido la forma en que nuestra especie se ve a sí misma en la actualidad."
 genetics_14: "Clonación de superhumanos"
 genetics_14_desc: "¿No hay suficientes superhumanos? ¡Ahora podemos clonarlos!"
 genetics_15: "Adaptabilidad interplanetaria"
 genetics_15_desc: "¿Hasta dónde podemos llevar la adaptabilidad superhumana? Ahora podemos asentarnos en diferentes planetas y adaptarnos a entornos que antes eran peligrosos."
 genetics_16: "Espaciohumanos"
 genetics_16_desc: "Nuestra raza ha alcanzado la cúspide de la evolución genética, siendo capaz de viajar por el espacio, inmune al frío espacial y a la radiación cósmica."
 crispr_1: "CRISPR"
 crispr_1_desc: "CRISPR es una técnica de edición genética utilizada principalmente para pacientes con cáncer e investigación y desarrollo (I+D) como método para localizar y destruir el cáncer de un paciente."
 crispr_2: "Edición genética Cas9"
 crispr_2_desc: "Cas9 is a 160 kilodalton protein in the immunological defense against DNA viruses and plasmids. Editing of this protein can help with improving natural defense and has extensive use in genetic engineering applications as well."
 crispr_3: "tracrRNA"
 crispr_3_desc: "El ARN CRISPR transactivador es un pequeño ARN codificado en trans, descubierto por primera vez en el patógeno humano Streptococcus pyogenes. Este ARN ayuda a sentar las bases de una defensa contra virus y plásmidos."
 crispr_4: "Experimentación con tratamientos CRISPR"
 crispr_4_desc: "La experimentación con CRISPR nos permite mejorar de manera óptima el proceso de edición de genes."
 electrification_11: "Electrificación de la minería profunda"
 electrification_11_desc: "La electrificación de la minería profunda reemplaza el transporte diésel, la perforación, el soporte de ventilación y la maquinaria auxiliar con sistemas eléctricos de batería, asistidos por trolebuses y alimentados por la red, lo que aumenta la demanda de energía al tiempo que reduce el uso de combustible, el calor y las emisiones subterráneas."
 electrification_12: "Revolución de la órbita baja"
 electrification_12_desc: "La infraestructura de órbita baja adopta estaciones alimentadas por energía solar, remolcadores orbitales eléctricos y naves de servicio automatizadas para apoyar la reubicación de satélites, la eliminación de desechos y la transferencia de carga con mucho menos propelente químico."
 electrification_13: "Replanteamiento de las misiones de órbita alta"
 electrification_13_desc: "Las misiones de órbita alta utilizan propulsión eléctrica de gran potencia y sistemas autónomos de elevación de órbita para trasladar satélites y carga hacia la órbita geoestacionaria (GEO), el espacio lunar y puntos de escala en el espacio profundo con menores requisitos de combustible."
 electrification_14: "Viajes espaciales rediseñados"
 electrification_14_desc: "Los vuelos espaciales avanzados expanden el uso de la propulsión eléctrica, los sistemas de energía de alta eficiencia y el almacenamiento de energía de larga duración para soportar viajes sostenidos más allá de la órbita terrestre, reduciendo al mismo tiempo la masa de combustible requerida para las misiones de carga y exploración."
 utility_scale_battery_storage_6: "Optimización del almacenamiento cuántico"
 utility_scale_battery_storage_6_desc: "El almacenamiento cuántico aún tiene margen de mejora, lo que permite una acumulación de energía más densa en celdas cuánticas altamente eficientes."
 utility_scale_battery_storage_7: "Maximización cuántica"
 utility_scale_battery_storage_7_desc: "La investigación sobre el almacenamiento de energía ha alcanzado su punto máximo, llevando los límites a un nivel casi físicamente imposible."
 fuel_refining7: "Refinamiento de combustible VII"
 fuel_refining7_desc: "Cambios adicionales en la destilación de biodiésel y combustible de propósito general nos permitirán obtener más combustible capaz de arder de forma más limpia y eficiente."
 fuel_refining8: "Refinamiento de combustible VIII"
 fuel_refining8_desc: "La aplicación de análisis optimizados por IA al proceso impulsa la eficiencia de la producción."
 fuel_refining9: "Refinamiento de combustible IX"
 fuel_refining9_desc: "La microgestión por IA del proceso de refinamiento reduce de manera significativa el desperdicio de recursos."
 fuel_refining10: "Refinamiento de combustible X"
 fuel_refining10_desc: "La computación cuántica y el análisis en tiempo real del refinamiento incrementan la pureza del combustible."
 fuel_refining11: "Refinamiento de combustible XI"
 fuel_refining11_desc: "Breakthrough in chemical research with the help of superintelligence allows us to produce fuel with maximum efficiency."
 construction10: "Construcción X"
 construction10_desc: "Las zonas de construcción altamente automatizadas utilizan programación por IA, ensamblaje robótico y logística inteligente para coordinar máquinas, materiales y trabajadores, mejorando enormemente la velocidad del desarrollo de infraestructuras a gran escala."
 construction11: "Construcción XI"
 construction11_desc: "La construcción de próxima generación integra materiales auto-monitorizados, componentes estructurales adaptativos y sistemas de reparación automatizados, lo que permite a las instalaciones críticas detectar daños, reforzar puntos débiles y permanecer operativas bajo situaciones de estrés."
 construction12: "Construcción XII"
 construction12_desc: "La construcción del futuro utiliza enjambres de constructores autónomos, materiales programables y sistemas estructurales diseñados por IA para ensamblar rápidamente megaproyectos resilientes, instalaciones militares blindadas y complejos industriales avanzados."
 excavation10: "Excavación X"
 excavation10_desc: "La excavación asistida por IA utiliza geología predictiva, patrones de perforación automatizados y flujos de procesamiento optimizados para aumentar la producción de yacimientos complejos a la vez que reduce la pérdida de material y el tiempo de inactividad de los equipos."
 excavation11: "Excavación XI"
 excavation11_desc: "Los sistemas robóticos de extracción profunda utilizan perforadoras autónomas, cargadores, drones de mapeo y centros de operaciones remotas para explotar yacimientos más profundos y peligrosos con menos trabajadores expuestos a condiciones de riesgo."
 excavation12: "Excavación XII"
 excavation12_desc: "La excavación del futuro utiliza flotas robóticas dirigidas por IA, mapeo de precisión de recursos y separación avanzada de materiales para recuperar metales, minerales y recursos estratégicos de yacimientos agotados, complejos o en entornos extremos."
 agriculture_10: "Nanorobots de AGI"
 agriculture_10_desc: "Las Inteligencias Artificiales Generales (AGI) agrícolas comandan una legión de nanorobots que controlan el estado de los cultivos y combaten las plagas."
 agriculture_11: "Hábitats agrícolas artificiales"
 agriculture_11_desc: "El sector agrícola es revolucionado por grandes invernaderos operados casi en su totalidad por inteligencia artificial, lo que permite la producción de prácticamente cualquier cultivo en cualquier lugar del planeta."
 agriculture_12: "Supercomplejos agrícolas"
 agriculture_12_desc: "El desarrollo posterior de los hábitats agrícolas llevó a la expansión del concepto hacia megaestructuras capaces de concentrar la producción de una nación entera en una sola área."
 agriculture_13: "Granjas espaciales"
 agriculture_13_desc: "Podemos trasladar los complejos agrícolas al espacio, eliminando las restricciones de espacio en el planeta. Esto también nos permite sostener fácilmente la exploración espacial y asentarnos por todo el universo."
 tech_diesel_power_systems_5: "Motores diésel hiperavanzados"
 tech_diesel_power_systems_5_desc: "Los sistemas de energía diésel hiperavanzados utilizan combustión flexible con múltiples combustibles, combustibles sintéticos y control de motor asistido por IA para mantener la autonomía a la vez que reducen las emisiones, la firma térmica y la dependencia de la logística de combustible convencional."
 tech_diesel_power_systems_6: "Motores diésel ultraavanzados"
 tech_diesel_power_systems_6_desc: "Las plantas motrices ultraavanzadas derivadas del diésel combinan motores de combustible alternativo, propulsión eléctrica integrada, almacenamiento de energía y diagnósticos autónomos para proporcionar una energía eficiente a flotas de largo alcance y sistemas de buques de guerra de alto consumo energético."
 tech_power_systems_5: "Motores de turbina de chorro hiperavanzados"
 tech_power_systems_5_desc: "Los motores de turbina hiperavanzados utilizan control de combustión adaptativo, eficiencia térmica mejorada y propulsión eléctrica integrada para proporcionar tanto potencia de maniobra a alta velocidad como una gran producción eléctrica para los sistemas de buques de alto consumo."
 tech_power_systems_6: "Motores de turbina de chorro ultraavanzados"
 tech_power_systems_6_desc: "Las plantas motrices turboeléctricas ultraavanzadas combinan turbinas de combustible flexible, recuperación avanzada de calor, diagnósticos autónomos y distribución de energía integrada para impulsar los futuros buques de guerra y soportar las cargas de propulsión, sensores y armas de energía dirigida."
 tech_nuclear_power_systems_5: "Reactores nucleares de superficie hiperavanzados"
 tech_nuclear_power_systems_5_desc: "Los reactores nucleares de superficie hiperavanzados integran diseños de reactores compactos, sistemas de refrigeración avanzados y distribución de energía eléctrica en todo el buque, reduciendo las necesidades de mantenimiento al tiempo que soportan radares de alta energía, guerra electrónica y armas de energía dirigida."
 tech_nuclear_power_systems_6: "Reactores nucleares de superficie ultraavanzados"
 tech_nuclear_power_systems_6_desc: "Los reactores nucleares de superficie ultraavanzados combinan núcleos de combustible con una vida útil equivalente a la del buque, monitorización autónoma y sistemas de energía integrados de alta capacidad para proporcionar una propulsión fiable y un rendimiento eléctrico extremo para los futuros buques capitales."
 tech_fusion_power_systems_1: "Motores de fusión modernos"
 tech_fusion_power_systems_1_desc: "Los primeros sistemas navales de energía por fusión aplican diseños experimentales de reactores compactos y un control de plasma de alta eficiencia para proporcionar un rendimiento eléctrico inmenso, ofreciendo una vía potencial más allá de los reactores de fisión convencionales y la propulsión por combustibles fósiles."
 tech_fusion_power_systems_2: "Motores de fusión de vanguardia"
 tech_fusion_power_systems_2_desc: "Los motores de fusión de vanguardia integran un confinamiento magnético más potente, superconductores avanzados y distribución de energía fusión-eléctrica, lo que permite a los buques de guerra sostener la propulsión, los sensores y las armas de alta energía con una menor dependencia del combustible."
 tech_fusion_power_systems_3: "Motores de fusión hiperavanzados"
 tech_fusion_power_systems_3_desc: "Los motores de fusión hiperavanzados utilizan núcleos de reactor compactos, control de plasma autónomo y sistemas de energía integrados en todo el buque para ofrecer una propulsión de larga autonomía y reservas eléctricas extremas para las futuras fuerzas de tarea navales."
 tech_fire_control_5: "Control de radar de misiles aumentado hiperavanzado"
 tech_fire_control_5_desc: "El control de radar de misiles aumentado hiperavanzado fusiona el radar a bordo, los sensores externos, los drones, los satélites y los enlaces de datos de la flota en una imagen de combate compartida, lo que permite a los buques de guerra rastrear ataques complejos de misiles con mayor velocidad y precisión."
 tech_fire_control_6: "Control de radar de misiles aumentado ultraavanzado"
 tech_fire_control_6_desc: "El control de radar de misiles aumentado ultraavanzado utiliza una gestión predictiva de la batalla, priorización de amenazas a velocidad de máquina y una coordinación automatizada de interceptores para defenderse contra ataques de saturación, armas guiadas con capacidad de maniobra y sistemas de ataque hipersónicos."
 tech_combat_radar_7: "Radar VIII"
 tech_combat_radar_7_desc: "Las redes de radar navales distribuidas combinan matrices a bordo, drones, satélites y sensores externos en un sistema de detección compartido, lo que permite a las flotas rastrear amenazas más allá del horizonte de radar de un solo buque de guerra."
 tech_combat_radar_8: "Radar IX"
 tech_combat_radar_8_desc: "Los futuros radares de combate utilizan procesamiento de señales asistido por IA, fusión de sensores adaptativa y rastreo predictivo para detectar, clasificar y batir amenazas sigilosas, con capacidad de maniobra e hipersónicas en entornos de combate disputados."
 tech_radar_jammer_5: "Inhibición de radar V"
 tech_radar_jammer_5_desc: "Las suites avanzadas de ataque electrónico a bordo utilizan análisis de señales asistido por IA, generación adaptativa de formas de onda y coordinación a nivel de flota para contrarrestar las redes de radar modernas. Pueden analizar los patrones de emisión enemigos, crear objetivos falsos engañosos e interferir con radares adaptativos y buscadores de misiles en tiempo real."
 tech_combat_sonar_7: "Sonar VIII"
 tech_combat_sonar_7_desc: "Los sistemas distribuidos de vigilancia submarina utilizan sensores autónomos, modelado ambiental y análisis acústico asistido por IA para rastrear submarinos silenciosos, drones submarinos y torpedos en amplias zonas oceánicas."
 tech_combat_sonar_8: "Sonar IX"
 tech_combat_sonar_8_desc: "Los futuros sistemas de sonar vinculan buques de guerra, plataformas no tripuladas, matrices en el fondo marino, modelos oceanográficos y redes de datos de la flota en un sistema predictivo de guerra submarina para detectar, clasificar y cazar amenazas en aguas disputadas."
 tech_naval_recon_drones_5: "Drones de reconocimiento naval V"
 tech_naval_recon_drones_5_desc: "Los grupos de drones navales en red coordinan aeronaves no tripuladas, embarcaciones de superficie y vehículos submarinos para monitorizar grandes áreas marítimas, compartir contactos en toda la flota y acortar los plazos desde la detección hasta el disparo (sensor-to-shooter) contra barcos, submarinos, aviones y misiles."
 tech_naval_recon_drones_6: "Drones de reconocimiento naval VI"
 tech_naval_recon_drones_6_desc: "Las redes autónomas de reconocimiento marítimo utilizan clasificación asistida por IA, detección pasiva y rutas cooperativas para rastrear a las fuerzas enemigas limitando las emisiones, evitando la interceptación y adaptándose a la guerra electrónica."
 tech_naval_recon_drones_7: "Drones de reconocimiento naval VII"
 tech_naval_recon_drones_7_desc: "Los futuros drones de reconocimiento naval forman redes de vigilancia autónomas distribuidas, vinculando los sensores aéreos, de superficie, submarinos y de la flota para mantener la custodia de los objetivos en océanos disputados y apoyar combates rápidos de largo alcance."
 tech_rail_battery_3: "Batería de cañones de riel III"
 tech_point_defense_system_7: "CIWS VII"
 tech_point_defense_system_7_desc: "Los sistemas CIWS hiperavanzados utilizan un control de tiro asistido por IA, asignación cooperativa de objetivos mediante sensores y pañoles de munición listos para usar más profundos para coordinar múltiples montajes de cañones durante ataques de saturación y amenazas de enjambres a corta distancia."
 tech_point_defense_system_8: "CIWS VIII"
 tech_point_defense_system_8_desc: "Los cañones CIWS ultraavanzados integran un control de tiro predictivo, munición inteligente, priorización autónoma de objetivos y fusión de sensores en todo el buque en una capa final adaptativa de defensa naval basada en cañones."
 tech_anti_drone_laser_3: "Láseres de defensa de punto para buques III"
 tech_anti_drone_laser_3_desc: "Los láseres avanzados a bordo de buques utilizan emisores de mayor potencia, control de haz adaptativo y una compensación atmosférica mejorada para enfrentarse a drones, municiones guiadas y buscadores de misiles con mayor alcance y fiabilidad. Los sistemas de energía integrados permiten disparos repetidos sin agotar rápidamente los pañoles convencionales."
 tech_anti_drone_laser_4: "Láseres de defensa de punto para buques IV"
 tech_anti_drone_laser_4_desc: "Las defensas láser hiperavanzadas para buques vinculan múltiples emisores, priorización de objetivos asistida por IA y gestión de energía en todo el navío en un escudo de energía dirigida coordinado. Estos sistemas pueden dañar rápidamente sensores, estructuras y superficies de control en ataques de saturación de drones y misiles."
 tech_turret_missiles_surface_7: "Misiles antibuque 2060"
 tech_turret_missiles_surface_7_desc: "Los sistemas de misiles antibuque ultraavanzados utilizan vuelo hipersónico, buscadores multiespectrales, discriminación de objetivos asistida por IA y guía resistente a las contramedidas para derrotar a grupos de superficie protegidos y amenazas submarinas elusivas."
 tech_turret_missiles_surface_8: "Misiles antibuque 2075"
 tech_turret_missiles_surface_8_desc: "Los sistemas de misiles antibuque de próxima generación utilizan autonomía adaptativa, coordinación cooperativa de salvas y fusión de sensores en tiempo real para identificar, priorizar y atacar buques enemigos en entornos marítimos disputados."
 tech_turret_missiles_drone_4: "Módulos navales de enjambre IV"
 tech_turret_missiles_drone_4_desc: "Los módulos de enjambre de vanguardia lanzan drones navales autónomos de ataque de ida que comparten datos de sensores, asignan objetivos y adaptan sus rutas de ataque incluso bajo comunicaciones degradadas. Al mezclar señuelos, inhibidores y cargas útiles de ataque dentro de la misma salva, pueden interrumpir y sobrecargar las defensas aéreas enemigas mientras presionan a los buques desde múltiples direcciones."
 tech_turret_missiles_aa_7: "Misiles de cuerpo giratorio 2060"
 tech_turret_missiles_aa_7_desc: "Los lanzadores RAM de vanguardia utilizan evaluación de amenazas asistida por IA, guía resistente a contramedidas y asignación de objetivos mediante sensores en red contra amenazas de alta velocidad y baja observabilidad (sigilo)."
 tech_turret_missiles_aa_8: "Misiles de cuerpo giratorio 2075"
 tech_turret_missiles_aa_8_desc: "Los sistemas RAM de próxima generación combinan buscadores adaptativos, control de tiro predictivo y redes de combate cooperativo para la defensa de corto alcance contra misiles, drones y aviones."
 tech_vls_surface_7: "Misiles VLS de ataque a superficie 2060"
 tech_vls_surface_7_desc: "Las armas de ataque VLS ultraavanzadas utilizan perfiles de vuelo hipersónicos o altamente supersónicos, guía adaptativa y discriminación de objetivos asistida por IA para derrotar defensas endurecidas y golpear objetivos críticos a alcances extremos."
 tech_vls_surface_8: "Misiles VLS de ataque a superficie 2075"
 tech_vls_surface_8_desc: "Los misiles VLS de ataque a superficie de próxima generación combinan planificación de misiones autónoma, fusión de sensores en tiempo real y coordinación cooperativa de salvas para abrumar las defensas y proporcionar fuegos navales precisos en teatros de operaciones disputados."
 tech_vls_aa_7: "Misiles VLS superficie-aire 2060"
 tech_vls_aa_7_desc: "Los sistemas de defensa aérea VLS ultraavanzados utilizan evaluación de amenazas asistida por IA, perfiles de interceptación adaptativos y vehículos de destrucción (kill vehicles) de alta agilidad para derrotar amenazas sigilosas, balísticas e hipersónicas en amplios espacios de batalla marítimos."
 tech_vls_aa_8: "Misiles VLS superficie-aire 2075"
 tech_vls_aa_8_desc: "Los misiles VLS superficie-aire de próxima generación combinan gestión predictiva de la batalla, coordinación autónoma de interceptores y fusión de sensores de la flota en tiempo real para proporcionar una defensa por capas contra aviones, misiles, drones, amenazas en el espacio cercano y armas avanzadas con capacidad de maniobra."
 tech_torpedoes_7: "Torpedo de 2060"
 tech_torpedoes_7_desc: "Los torpedos ultraavanzados utilizan clasificación de objetivos asistida por IA, detección multimodo y perfiles de ataque adaptativos para distinguir los objetivos reales de los señuelos y perseguir amenazas a través de entornos submarinos complejos."
 tech_torpedoes_8: "Torpedo de 2075"
 tech_torpedoes_8_desc: "Los torpedos de próxima generación combinan redes submarinas cooperativas, seguimiento predictivo de objetivos, planificación autónoma de rutas y un rechazo avanzado de contramedidas para cazar barcos y submarinos en espacios de batalla navales saturados de sensores."
 tech_drone_torpedoes_4: "Torpedos dron V"
 tech_drone_torpedoes_4_desc: "La autonomía avanzada convierte a los torpedos dron en cazadores submarinos coordinados, capaces de realizar búsquedas cooperativas, aplicar una lógica de reataque más inteligente y resistir a los señuelos. Con un guiado perfeccionado por estela y buscadores multimodo, pueden penetrar las defensas modernas y mantener la presión hasta acabar con el objetivo."
 tech_drone_torpedoes_5: "Torpedos dron VI"
 tech_drone_torpedoes_5_desc: "La autonomía avanzada convierte a los torpedos dron en cazadores submarinos coordinados, capaces de realizar búsquedas cooperativas, aplicar una lógica de reataque más inteligente y resistir a los señuelos. Con un guiado perfeccionado por estela y buscadores multimodo, pueden penetrar las defensas modernas y mantener la presión hasta acabar con el objetivo."
 tech_anti_torpedoes_4: "Defensa antitorpedos IV"
 tech_anti_torpedoes_4_desc: "Las suites antitorpedos muy avanzadas combinan un rastreo de alta fidelidad con contramedidas activas, incluidos interceptores de destrucción directa (hard-kill) diseñados para destruir los torpedos antes del impacto. Los sensores en red y los sistemas defensivos de tiro rápido hacen que los ataques submarinos sean mucho menos decisivos, forzando a los submarinos a emplear más armas para obtener menos resultados."
 tech_anti_torpedoes_5: "Defensa antitorpedos V"
 tech_anti_torpedoes_5_desc: "Las suites antitorpedos hiperavanzadas combinan un rastreo de alta fidelidad con contramedidas activas, incluidos interceptores de destrucción directa (hard-kill) diseñados para destruir los torpedos antes del impacto. Los sensores en red y los sistemas defensivos de tiro rápido hacen que los ataques submarinos sean mucho menos decisivos, forzando a los submarinos a emplear más armas para obtener menos resultados."
 tech_nuclear_torpedoes_4: "Torpedos nucleares V"
 tech_nuclear_torpedoes_4_desc: "Los conceptos avanzados de torpedos nucleares buscan hacer que la amenaza sea sobrevivible, controlable y políticamente utilizable sin reducir su horror. Con una integración más estrecha en el mando estratégico y reglas de autorización más claras, el arma se convierte en un pilar formal de la disuasión marítima. Una vez desplegada, obliga a los oponentes a negociar desde el miedo, no desde la confianza."
 tech_landing_craft_8: "Embarcación de desembarco de alta tecnología"
 tech_landing_craft_8_desc: "La aplicación de los avances tecnológicos más recientes incrementa las capacidades operativas de las embarcaciones de desembarco."
 tech_landing_craft_9: "Embarcación de desembarco de alta tecnología II"
 tech_landing_craft_9_desc: "La aplicación de los avances tecnológicos más recientes incrementa las capacidades operativas de las embarcaciones de desembarco."
 tech_landing_craft_10: "Embarcación de desembarco de alta tecnología III"
 tech_landing_craft_10_desc: "La aplicación de los avances tecnológicos más recientes incrementa las capacidades operativas de las embarcaciones de desembarco."
 corvette_hull_7: "Casco de corbeta de 2055"
 corvette_hull_7_desc: "Las corbetas, que constituyen la clase de navío más pequeña considerada como buque de guerra, no suelen formar parte de las armadas de alta mar (blue water). Estos barcos pequeños y rápidos suelen estar armados con una variedad de armas, lo que les permite realizar una amplia gama de tareas. Muchos países pueden desplegar corbetas debido a su asequibilidad para las armadas pequeñas y medianas. Se utilizan normalmente para: defensa y vigilancia costera, dragado de minas, misiones antisubmarinas, antiaéreas, antibuque y, en la era moderna, tareas de ataque a tierra."
 corvette_hull_8: "Casco de corbeta de 2070"
 corvette_hull_8_desc: "Las corbetas, que constituyen la clase de navío más pequeña considerada como buque de guerra, no suelen formar parte de las armadas de alta mar (blue water). Estos barcos pequeños y rápidos suelen estar armados con una variedad de armas, lo que les permite realizar una amplia gama de tareas. Muchos países pueden desplegar corbetas debido a su asequibilidad para las armadas pequeñas y medianas. Se utilizan normalmente para: defensa y vigilancia costera, dragado de minas, misiones antisubmarinas, antiaéreas, antibuque y, en la era moderna, tareas de ataque a tierra."
