 TT_ALG_DIRECT_DEM_REQ: "Нам следовало предоставить курдам гражданство, чтобы они распространяли идеалы прямой демократии в регионе"
 TT_ALG_KICKING_ASSADS_EFFECT: "Политическая инклюзивность алавитов: §R-40%§!"
 TT_ALG_REPUBLICANISM_FOCUS_EFFECT: "Для каждой значимой этнической и религиозной общины в Алжире нам предстоит выбрать: либо резервировать места в парламенте для политиков, представляющих эти общины, что повышает вовлечённость меньшинств в политику ценой роста коррупционных издержек, либо отказаться от этого, что приведёт к беспорядкам и порче имущества в их регионах всякий раз, когда уровень их политической вовлечённости опустится ниже §Y50%§!"
 TT_ALG_FEDERALISM_FOCUS_EFFECT: "Для каждой значимой этнической и религиозной общины в Алжире нам предстоит выбрать: либо предоставить им полуавтономию, что повысит их политическую вовлечённость ценой снижения добычи ресурсов, скорости строительства и количества строительных слотов, а также увеличит стоимость изменения государственного законодательства обратно пропорционально уровню политической вовлечённости общины, либо полностью выделить регион в качестве автономного государства"
 TT_ALG_DIRECT_DEMOCRACY_REQ: "Чтобы наша прямая демократия функционировала, государство должно быть секуляризовано, а угроза терроризма — полностью устранена. Общество также должно быть избавлено от радикальных салафитских идей"
 TT_ALG_SECULARIZE_CONSTITUTION: "В зависимости от принятых реформ и политики мы станем либо Либеральной демократией, либо Нелиберальной демократией"
 TT_ALG_ALLY_FARMERS: "Фермеры присоединятся к нам как внутренняя фракция в нашей борьбе"
 TT_ALG_ALLY_INDUSTRIALISTS: "Промышленные конгломераты присоединятся к нам как внутренняя фракция в нашей борьбе"
 TT_ALG_ALLY_ULEMA: "Улемы присоединятся к нам как внутренняя фракция в нашей борьбе"
 TT_ALG_ALLY_INTL_BANKERS: "Международные банкиры присоединятся к нам как внутренняя фракция в нашей борьбе"
 TT_ALG_AGRICULTURAL_INVESTMENT_EFFECT: "Многократные инвестиции в сельское хозяйство позволят открыть новые рынки и предприятиям продавать продукцию. Однако количество инвестиций, необходимых для поддержания нового бизнеса, зависит от уровня коррупции"
 ALG_GOVERNMENT_EXPANSION_FOCUS_EFFECT: "§YМы пригласим партию в коалицию. Партия принесет нам большую пользу, если мы примем участие в ее соответствующем деле, будь то централизация или децентрализация в процессе государственного строительства и установления баланса сил§!"
 ALG_GOVERNMENT_EXPANSION_EVENT_REP_EFFECT: "§CУчастие этой партии в коалиции принесет нам большую пользу в централизации в процессе государственного строительства и установления баланса сил§!"
 ALG_GOVERNMENT_EXPANSION_EVENT_FED_EFFECT: "§GУчастие этой партии в коалиции принесет нам большую пользу в децентрализации в процессе государственного строительства и установления баланса сил§!"
 ALG_FINDING_PROMISING_BUREAUCRACY_EFFECTS: "В случае успеха мы получим §G75§! политической власти, а §Yбудущие бюрократы§!, предоставляющие идеи, §G+0,5§! §Yежедневного прироста политической власти§! и §G+0,2§! §Yк скорости строительства§! в течение §Y100§! дней."
 ALG_STATE_DECISION_MAKING_SUCCESS_EFFECTS: "В случае успеха мы получим §G5%§! к стабильности"
 ALG_LOCAL_ACCOUNTABILITY_SUCCESS_EFFECTS: "В случае успеха мы получим §G10%§! к популярности партии и снижение коррупции"
 ALG_FUND_VOLUNTARY_ORGANIZATIONS_SUCCESS_EFFECTS: "В случае успеха мы снизим коррупцию и получим эффект §YРост добровольческих организаций§!, дающий §G0.2§! ежедневного прироста политической силы и §G+30%§! к скорости строительства на протяжении §Y100§! дней"
 ALG_ENCOURAGE_ECONOMIC_SELF_RELIANCE: "В случае успеха мы ускорим наш цикл экономического роста"
 TT_ALG_KURDS_WITHOUT_CITIZENSHIPS_PARTY_FORMATION: "§GЕсли после изгнания Асадов курдам предоставить гражданство, они сформируют политическую партию, стремящуюся преобразовать Алжир в федерацию§!"
 ALG_ECONOMIC_DECISIONS_ONE_FREE_FACTORIES_EXPLANATION: "§RДолжен быть доступен хотя бы один промышленный комплекс, не занятый строительством. Отмените текущее назначенное строительство или дождитесь его завершения, чтобы комплекс освободился§!"
 ALG_ECONOMIC_DECISIONS_TWO_FREE_FACTORIES_EXPLANATION: "§RДолжны быть доступны как минимум два промышленных комплекса, не занятых строительством. Отмените текущее назначенное строительство или дождитесь его завершения, чтобы комплексы освободились§!"
 ALG_ECONOMIC_DECISIONS_THREE_FREE_FACTORIES_EXPLANATION: "§RДолжны быть доступны как минимум три промышленных комплекса, не занятых строительством. Отмените текущее назначенное строительство или дождитесь его завершения, чтобы комплексы освободились§!"
 ALG_FEDERAL_FORMATION_TOOLTIP: "Если мы будем придерживаться ценностей, учитывающих интересы всех меньшинств, §Y50%§! или более того §GАлжирская Федерация§! будет сформирован"
 ALG_UNITARY_FORMATION_TOOLTIP: "Если все показатели вовлечённости меньшинств составят §Y50%§! или более, будет образована §CАлжирская Республика§!"
 ALG_tech_name: "Технический бонус"
 TT_ALG_CORRUPTION_COSTS: "Чем коррумпированы наши институты, тем дороже обойдутся наши инвестиции."
 ALG_algeria_invite_ciw: "§CМы пригласим все исламские страны в CIW§!"
 dyn_ALG_tt: "Эффект от такого подхода зависит от позиции алжирского правительства!"
 ALG_islamist_opposition_victory: "Исламистское оппозиционное правительство"
 ALG_islamist_opposition_victory_desc: "Исламистская оппозиционная коалиция одержала победу на выборах и будет отвечать за превращение Алжира в консервативную исламскую республику."
 ALG_islamist_renaissance: "Исламистский ренессанс"
 ALG_islamist_renaissance_desc: "Наша победа укрепила нашу поддержку среди широких масс. Сформировалась новая культура, и мы всецело поддерживаем её."
 ALG_empower_sharia_courts: "Уполномочить шариатские суды"
 ALG_empower_sharia_courts_desc: "Пришло время укрепить исламскую судебную систему и расширить ее влияние."
 ALG_turkish_inspired_islamism: "Исламизм, вдохновлённый Турцией"
 ALG_turkish_inspired_islamism_desc: "Мы будем черпать вдохновение из исламистских движений, которые возникли в Турции после образования республики. Это позволит представить наше движение в более благоприятном свете и, возможно, привлечет турецких консервативных бизнесменов к инвестициям в нашу страну."
 ALG_deregulate_economy: "Дерегулированная экономика"
 ALG_deregulate_economy_desc: "Чтобы расширить возможности среднего класса и торговцев, от которых мы получаем значительную поддержку, мы снизим для них ограничения и предоставим необходимое пространство для их развития."
 ALG_moderate_conservatism: "Умеренный консерватизм"
 ALG_moderate_conservatism_desc: "Мы искореним экстремистские элементы в наших рядах и изменим наш имидж, представив себя как силу консерватизма, не имеющую ничего общего с религиозным фанатизмом."
 ALG_religious_values: "Наши ценности непоколебимы"
 ALG_religious_values_desc: "Возможно, наша прежняя политика, направленная на умиротворение населения и смягчение нашего имиджа, позволила нам отклониться от истинных ценностей, на которых основаны наши идеалы. Нам стало все равно, что о нас думают другие, и наша единственная цель — установить шариат на наших землях, независимо от того, насколько это непопулярно."
 ALG_religious_economic_charity: "Религиозные пожертвования"
 ALG_religious_economic_charity_desc: "Наши движения всегда были связаны с благотворительными организациями и фондами, которые приносили пользу нашим сообществам. Теперь, когда у нас есть более заметное положение, мы еще больше институционализируем их, чтобы облегчить наше экономическое бремя"
 ALG_qatari_support: "Катарская поддержка"
 ALG_qatari_support_desc: "Мы привлекли внимание различных катарских инвесторов."
 ALG_flourishment_of_central_economy: "Развитие городских центров"
 ALG_flourishment_of_central_economy_desc: "Наша основная база поддержки сосредоточена в различных городских регионах, и нам следует начать развивать их, чтобы укрепить нашу поддержку со стороны их населения."
 ALG_turkish_investments: "Турецкие инвестиции"
 ALG_turkish_investments_desc: "Благодаря нашей политике дерегулирования, а также идеологическому сходству с ними, мы привлекли множество турецких инвесторов."
 ALG_reverse_secularization: "Обратная секуляризация"
 ALG_arm_palestinians_to_fight: "Вооружить палестинцев"
 ALG_arm_palestinians_to_fight_desc: "В Иордании проживает большое количество палестинских беженцев. Мы можем превратить этих беженцев в боевиков и подстрекать их к сеянию хаоса в Палестине и Израиле. Поскольку они являются марионеточными боевиками, мы можем использовать их для подстрекательства Израиля к ответным действиям, выставляя его в роли злодея в конфликте."
 ALG_zionist_threat: "Сионистская угроза"
 ALG_zionist_threat_desc: "Израиль — это величайшее оскорбление всех мусульман и отвратительное лжегосударство в самом сердце ислама. Его нужно стереть с лица земли."
 ALG_help_sahara: "Наши друзья из Сахары"
 ALG_help_sahara_desc: "Мы поддерживаем контакты со многими движениями, поддерживающими наше панарабистское дело, одним из таких движений является Фронт Полисарио, который стремится освободить народ Северной Сахары. В течение прошлого столетия Полисарио боролся с колониальным, а затем марокканским гнетом, и сейчас Fron контролирует лишь небольшую территорию Западной Сахары. На данный момент конфликт заморожен, но мы можем изменить это, отправив нашим друзьям военную помощь и снабдив сахарцев всем необходимым для продолжения их борьбы."
 algeria.42.t: "Оружейная поддержка от [FROM.GetName]!"
 algeria.42.d: "Они прислали нам оружие!"
 algeria.42.a: "Большой"
 algeria.43.t: "Алжир выразил дипломатический протест!"
 algeria.43.d: "Президент Алжира Абдерразак Макри выступил с дипломатическим протестом против нашего правительства. Он утверждает, что мы террористы, и международное сообщество должно начать специальную операцию по ликвидации нашего режима."
 algeria.43.a: "Иди на хрен, Макри"
 ALG_support_fsa: "Поддержка FSA"
 ALG_support_fsa_desc: "Наши отношения с Сирией имеют долгую историю. Теперь отношения должны определяться их связью с идеологией братства."
 ALG_brotherhood_diplo: "Дипломатия братства"
 ALG_brotherhood_diplo_desc: "Мы должны реформировать нашу дипломатию в соответствии с политикой нашего нового правительства."
 ALG_hamas_under_wing: "ХАМАС под нашим крылом"
 ALG_hamas_under_wing_desc: "ХАМАС — это группировка борцов за свободу, базирующаяся в секторе Газа и связанная с «Братьями-мусульманами». Помогать им — наш долг!"
 algeria.44.t: "ХАМАС берет под контроль Газу"
 algeria.44.d: "ХАМАС при поддержке Алжира взял под контроль сектор Газа. Вооруженные ополченцы захватили правительственные здания и пресс-секретаря ХАМАС. [HAM.GetLeader] Группа заявила, что готовится к походу с целью освобождения мечети Аль-Акса."
 algeria.44.a: "Проклятие"
 ALG_letter_isr: "Израильские манипуляции"
 ALG_letter_isr_desc: "О, Израиль! Пришло время решить, что с тобой делать."
 MSP_letter_isr: "Израильские манипуляции"
 MSP_letter_isr_desc: "О, Израиль! Пришло время решить, что с тобой делать."
 ALG_und_supp_hamas: "Тайная поддержка ХАМАС"
 ALG_und_supp_hamas_desc: "Для того чтобы дело ХАМАС увенчалось успехом, мы должны оказать им материальную поддержку."
 ALG_org_of_isl_coop: "Организация исламского сотрудничества"
 ALG_org_of_isl_coop_desc: "Организация исламского сотрудничества, ранее известная как Организация исламской конференции, — это межправительственная организация, основанная в 1969 году, в состав которой входят 57 государств-членов, 48 из которых являются странами с мусульманским большинством населения."
 MSP_und_supp_hamas: "Тайная поддержка ХАМАС"
 MSP_und_supp_hamas_desc: "Для того чтобы дело ХАМАС увенчалось успехом, мы должны оказать им материальную поддержку."
 MSP_org_of_isl_coop: "Организация исламского сотрудничества"
 MSP_org_of_isl_coop_desc: "Организация исламского сотрудничества, ранее известная как Организация исламской конференции, — это межправительственная организация, основанная в 1969 году, в состав которой входят 57 государств-членов, 48 из которых являются странами с мусульманским большинством населения."
 algeria.49.t: "Алжир требует освободить Омара Абдель-Рахмана."
 algeria.49.d: "В своем письме Макри кратко упомянул, что просит освободить Омара Абдель-Рахмана, осужденного за взрыв Всемирного торгового центра в Нью-Йорке в 1993 году, а также многих египтян, арестованных во время революции. Позже представитель «Братьев-мусульман» заявил, что экстрадиция предлагается по гуманитарным соображениям и что Макри не намерен отменять уголовные приговоры Абдель-Рахману."
 algeria.49.a: "Макри сошёл с ума?"
 algeria.49.b: "Уф, конечно?"
 ALG_supp_plo: "Поддержите ООП"
 ALG_supp_plo_desc: "Организация освобождения Палестины (ООП) уже давно играет ключевую роль в борьбе за самоопределение палестинцев. Поддержка ООП могла бы укрепить наши позиции среди международных союзников и способствовать мирному урегулированию конфликта."
 ALG_the_pal_issue: "Палестинский вопрос"
 ALG_the_pal_issue_desc: "Палестинский вопрос остается ключевым в нашей внешней политике. Наша позиция по палестинской борьбе определит наши международные союзы и влияние в регионе. Мы должны решить, как урегулировать этот продолжающийся конфликт."
 ALG_supp_hamas: "Поддержите ХАМАС"
 ALG_supp_hamas_desc: "ХАМАС представляет собой значительную фракцию в палестинском сопротивлении. Оказывая поддержку, мы можем укрепить наши связи с этой группировкой, усилить наше влияние в регионе и присоединиться к их борьбе."
 ALG_Get_rid_of_military_corrupt: "Очистить армию от коррупции"
 ALG_Get_rid_of_military_corrupt_desc: "Военные прочно укоренились в наших институтах и представляют собой явную угрозу будущему нашей страны. Мы арестуем их по обвинениям в коррупции и конфискуем всё имущество, которое сможем завладеть."
 idea_algerian_oligarchy_arrests: "Военная чистка"
 ALG_the_coalition: "Коалиция"
 ALG_the_coalition_desc: "После восстановления политических партий возникли две заметные силы. Одна выступает за федерализацию государства и расширение полномочий провинций, а другая — за укрепление централизованной власти и сохранение единой централизованной республики. Нам придётся тщательно выбирать, с кем нам следует объединиться."
 ALG_dismantle_the_military: "Демонтаж военного бюджета"
 ALG_dismantle_the_military_desc: "Значительная часть ВВП оборонного сектора была растрачена и направлена на бесполезные проекты из-за укоренившейся коррупции в институтах наших вооруженных сил. Мы будем перепрофилировать и продавать большую часть того, что сможем получить, и хотя это может ослабить нашу армию и сделать нас уязвимыми для угроз, это необходимый шаг к экономическому восстановлению и искоренению коррупции."
 ALG_empower_institutions: "Расширение возможностей учреждений"
 ALG_empower_institutions_desc: "Наши институты очень слабы и отодвинуты на второй план. Это происходит из-за концентрации власти в руках президента и нехватки полномочий у парламента, а также из-за контролируемых государством СМИ, создающих атмосферу, ограничивающую личные свободы. Разработка новой конституции, гарантирующей распределение власти и либерализацию, является важнейшим шагом на пути в будущее."
 ALG_western_supported_economic_relief: "Западная помощь"
 ALG_western_supported_economic_relief_desc: "Наши идеалы совпадают с идеалами Запада, и это даже позволило нам создать свои партии в их странах. Мы будем налаживать с ними связи и просить о помощи в обмен на экономические рычаги."
 ALG_liberalize_society: "Либерализация общества"
 ALG_liberalize_society_desc: "Люди чужды ценностям свободы и равенства. Мы должны работать над тем, чтобы побудить их ценить свои свободы."
 ALG_scientific_ventures: "Научные проекты"
 ALG_scientific_ventures_desc: "Поддерживая стипендии и обновляя устаревшие школьные программы, мы сможем продвинуть научный сектор страны."
 Algeria_student_exchanges: "Студенческие обмены"
 ALG_banish_authoritarian_influence: "Изгнать авторитарное влияние"
 ALG_banish_authoritarian_influence_desc: "Многие авторитарные государства, такие как Иран и Россия, имели здесь большое присутствие. Теперь, когда мы свободное государство, пришло время положить конец их влиянию на наши институты и экономику"
 ALG_democratic_socialism: "Демократический социализм"
 ALG_democratic_socialism_desc: "Разрушительное экономическое положение нашей страны привело к тому, что наше население оказалось в крайней нищете и отсталости. Снижение ограничений для бизнеса приведет к эксплуатации и недобросовестной конкуренции, поскольку экономическое неравенство по-прежнему широко распространено в нашей стране. Нам необходимо сосредоточиться на поощрении новых предприятий в стране и предоставлении им грантов, чтобы обеспечить широкое экономическое развитие, которым смогут пользоваться все слои населения."
 ALG_unleash_economic_potential: "Раскройте экономический потенциал"
 ALG_unleash_economic_potential_desc: "У нас огромный потенциал стать экономической державой. Мы можем привлечь иностранных инвесторов и предприятия для создания компаний здесь, и хотя это приведет к тому, что наше население станет дешевой рабочей силой, это станет нашим огромным шагом на пути к экономическому развитию."
 ALG_domestic_investments: "Внутренние инвестиции"
 ALG_domestic_investments_desc: "В стране создается множество молодых предприятий. Мы будем инвестировать в них, чтобы поддержать их на пути к экономическому процветанию."
 ALG_subsidize_local_firms: "Местные фирмы"
 ALG_subsidize_local_firms_desc: "Благодаря нашей политике местные фирмы получают признание за свои успехи. Пришло время инвестировать в них."
 ALG_economic_democracy: "Экономическое равенство"
 ALG_economic_democracy_desc: "Наше экономическое развитие охватило всех людей, независимо от их экономического положения, благодаря решению проблемы экономического неравенства и даже созданию успешных отечественных компаний. Этим мы должны гордиться."
 ALG_federalisation: "Федерализация"
 ALG_federalisation_desc: "Решение заключается в предоставлении штатам большей власти. Это значительно повысит представительство на местном уровне и инклюзивность, а также существенно уменьшит межконфессиональные опасения и напряженность. Однако эта автономия ослабит наше влияние на штаты, особенно там, где присутствуют меньшинства."
 ALG_algerian_investments: "Инвестиции диаспоры"
 ALG_algerian_investments_desc: "Благодаря нашей благоприятной экономической политике мы привлекли инвестиции от алжирской диаспоры, проживающей за рубежом."
 ALG_invite_US_business_giants: "Пригласите бизнес-гигантов"
 ALG_invite_US_business_giants_desc: "Хотя мы и позволили нашей экономике процветать, этого недостаточно. Мы пригласим крупные американские компании открывать франшизы в стране, чтобы стимулировать потребление."
 ALG_republicanism: "республиканизм"
 ALG_republicanism_desc: "Алжир лучше всего управляется как сильное государство с централизованной властью. Это укрепит власть нашего правительства, но вызовет отчуждение и гнев со стороны меньшинств, которые почувствуют себя обделенными."
 ALG_address_ethnic_divides: "Устранение этнических разногласий"
 ALG_address_ethnic_divides_desc: "Наша страна всегда была разделена и страдала от межконфессиональной розни. Мы должны решить, как бороться с этими проблемами."
 ALG_EU_investments: "Инвестиции ЕС"
 ALG_EU_investments_desc: "Различные европейские страны стремятся инвестировать в нашу страну."
 ALG_student_exchanges: "Студенческие обмены"
 ALG_student_exchanges_desc: "Мы будем поощрять получение стипендий в зарубежных странах, чтобы повысить качество образования и поддерживать его на уровне мировых стандартов."
 ALG_democratic_victory: "Демократическая победа"
 ALG_democratic_victory_desc: ""
 ALG_new_era: "Новая эра"
 ALG_new_era_desc: "Для региона наступит новая эра. Эра мира и стабильности, свободная от угнетения и несправедливости."
 ALG_islamic_nato: "Исламское НАТО"
 ALG_islamic_nato_desc: "Хотя НАТО обеспечивает нам безопасность, члены НАТО продемонстрировали полное пренебрежение к Ближнему Востоку. Если они не могут обеспечить стабильность и процветание, мы должны взять на себя эту ответственность. Мы создадим собственный военный альянс — Организацию Средиземноморского договора (ОМД)."
 ALG_invite_iraq: "Пригласить Ирак"
 ALG_invite_iraq_desc: "Нам необходимо пригласить Ирак в наш альянс, поскольку он постепенно начинает налаживать отношения, и мы бы извлекли огромную пользу из взаимного сотрудничества."
 ALG_invite_syria: "Пригласить Сирию"
 ALG_invite_syria_desc: "Наличие Сирии к югу от нашей страны делает нас очень уязвимыми. Привлечение Сирии в нашу группировку стало бы отличным способом гарантировать нашу безопасность."
 ALG_invite_algeria: "Пригласить Египет"
 ALG_invite_algeria_desc: "Египет — восходящая держава, и с таким населением наш альянс сможет достичь практически чего угодно."
 ALG_assistance_to_bulgaria: "Помощь Болгарии"
 ALG_assistance_to_bulgaria_desc: "Мы должны помочь Болгарии в развитии ее инфраструктуры, чтобы мы могли без труда осуществлять больше инвестиций за пределами ее границ."
 ALG_islamic_economic_cooperation: "Исламское экономическое сотрудничество"
 ALG_islamic_economic_cooperation_desc: "Многие мусульманские страны купаются в деньгах и тратят их на бессмысленные вещи. Нам следует сформировать экономический альянс, чтобы объединить наши ресурсы для реализации общего экономического проекта."
 ALG_msp_win: "§RNOTE§! : §GЭта настройка разблокирует дерево настроек MSP! Это дерево будет перезаписано§!"
 algeria_news.1.t: "Военный переворот в Алжире!"
 algeria_news.1.d: "Внезапный и неожиданный поворот событий поверг Алжир в трясину неопределенности: военный переворот сверг правительство [ALG.GetLeader]На фоне эскалации напряженности между правящей партией и оппозиционными фракциями алжирские военные во главе с генералом Ахмедом Гаидом Салахом захватывают контроль над государственным аппаратом, приостанавливают действие конституции и задерживают ключевых политических деятелей. Улицы Каира охвачены ликованием и тревогой, отражающими глубокие разногласия внутри страны по поводу вмешательства военных. Международное сообщество внимательно следит за тем, как будущее Алжира висит на волоске, и растет обеспокоенность по поводу последствий для демократии и стабильности в регионе."
 algeria_news.1.a: "Интересный"
 algeria_news.2.t: "Алжир на перепутье"
 algeria_news.2.d: "После почти десятилетия кровопролития и нестабильности Алжир оказался в хрупком и неопределенном положении. Во многих районах стрельба утихла, но мир далеко не гарантирован. Страна сейчас находится на критическом этапе: выберет ли она примирение и реформы, продолжит ли режим чрезвычайного положения под контролем военных или снова погрузится в конфликт? Взгляды алжирского народа и всего мира прикованы к тому, что произойдет дальше."
 algeria_news.2.a: "Борьба за будущее Алжира начинается."
 algeria_news.3.t: "Бутефлика вступил в должность президента"
 algeria_news.3.d: "В апреле 1999 года Абдельазиз Бутефлика был избран президентом Алжира, вернув страну к формальному гражданскому руководству после многолетнего политического кризиса. Хотя война еще не полностью закончилась, Бутефлика вступает в должность, полный решимости восстановить стабильность, отстроить государство и вывести Алжир в новое тысячелетие. Его программа примирения и диалога вселила надежду во многих алжирцев, однако остаются сомнения в том, сможет ли его президентство действительно залечить раны «Черного десятилетия»."
 algeria_news.3.a: "Новая эра начинается при Бутефлике"
 algeria_news.4.t: "Срок действия Гражданского соглашения истек."
 algeria_news.4.d: "Окно амнистии, открытое в рамках Гражданского соглашения президента Бутефлики, закрылось. Тысячи повстанцев спустились с гор и вернулись к мирной жизни, а Исламская армия спасения официально самораспустилась, отказавшись от дальнейших боевых действий. Радикалы из Вооруженной исламской группы и недавно сформированной Салафитской группы проповеди и борьбы отвергли все предложения и остаются на поле боя. Сторонники называют Соглашение лучшим шансом положить конец кровопролитию; критики отвечают, что оно прощает виновников массовых убийств, не обеспечивая ни капли справедливости для их жертв."
 algeria_news.4.a: "Шанс перевернуть страницу в истории «Черного десятилетия»."
 algeria_news.5.t: "Фронт национального освобождения возрождает свое революционное наследие"
 algeria_news.5.d: "Президент Бутефлика и Фронт национального освобождения (ФНО) начали общенациональную кампанию по укреплению своей легитимности через память о Войне за независимость. Государственные СМИ и школы теперь прославляют жертвы мучеников, представляя ФНО как вечного защитника суверенитета Алжира. В то же время правительство заключило союзы с другими крупными партиями, сформировав политическую коалицию для укрепления власти и демонстрации единого фронта. Критики осуждают кампанию как оппортунистическую пропаганду, в то время как сторонники видят в ней возрождение революционного духа Алжира."
 algeria_news.5.a: "Революция продолжается благодаря единству."
 algeria_news.5.b: "Ни одна НФО не должна править в одиночку"
 algeria_news.6.t: "Формирование Президентского альянса"
 algeria_news.6.d: "Опираясь на свою революционную кампанию, Фронт национального освобождения (ФНО) сформировал правящую коалицию, известную как «Президентский альянс». ФНО, Национальное объединение за демократию (НОД) и Движение за мир (ДМ) договорились координировать политику в поддержку президента Бутефлики. Альянс укрепляет контроль правящего блока над политической системой Алжира, представляя обществу единый фронт. В то время как сторонники называют эту коалицию символом стабильности, оппозиция предупреждает, что Алжир рискует еще больше скатиться к однопартийному господству под новым прикрытием."
 algeria_news.6.a: "Вместе мы обеспечиваем будущее Алжира."
 ALG_presidential_alliance: "§YФронт национального освобождения (ФНО), Республиканская национальная партия (РНД) и МСП сформировали Президентский альянс.§!\nЭта коалиция повышает стабильность правительства, но укрепляет политическое доминирование правящего блока."
 algeria_news.7.t: "Кризис возобновляется"
 algeria_news.7.d: "Обещания примирения и реформ превратились в ложь. Фронт национального освобождения (ФНО) и его так называемые союзники в РНД и других демократических партиях не смогли обеспечить справедливость и права, требуемые народом. Разочарованные пустыми обещаниями, многие теперь обращаются к Салафитской группе за правосудие и борьбу (ГСБ), веря, что только закон Аллаха может принести истинную справедливость Алжиру. Для них шариат представляет собой высший закон, неискаженный жадностью политиков, предательством харкитов или влиянием иностранных держав. Это война не против алжирского народа, а против коррумпированных чиновников и поддерживаемых из-за рубежа элит, которые украли его будущее. Надвигается новая гражданская война, которая раз и навсегда решит судьбу Алжира."
 algeria_news.7.a: "Закон Аллаха будет направлять будущее Алжира."
 ALG_army_alliance: "Сила крепнет"
 ALG_strengthen_le_pouvoir: "Укрепить Le Pouvoir"
 ALG_strengthen_le_pouvoir_desc: "Правящая элита и армия укрепляют свою власть за счет политических свобод."
 ALG_resistance_challenges_new: "Требования народа"
 ALG_resistance_challenges_new_desc: "Народ требует реформ в здравоохранении, образовании и сфере занятости. Неспособность удовлетворить эти потребности усилит недовольство и приблизит Алжир к гражданской войне."
 ALG_healthcare_reform: "Реформировать систему здравоохранения"
 ALG_healthcare_reform_desc: "Больницы переполнены, врачи получают низкую зарплату, а нехватка медицинских кадров ощутима. Мы должны действовать быстро."
 alg.310.t: "Реформа здравоохранения увенчалась успехом"
 alg.310.d: "Инвестиции в больницы и врачей частично восстановили доверие к правительству."
 alg.310.a: "Небольшая победа."
 alg.311.t: "Крах здравоохранения"
 alg.311.d: "Больницы переполнены, пациентам отказывают в помощи, а коррупция разъедает систему. Гнев выливается в открытое море."
 alg.311.a: "Это обойдется нам очень дорого."
 ALG_education_reform: "Реформировать систему образования"
 ALG_education_reform_desc: "Наши школы и университеты устарели, и выпускников ждет безработное будущее."
 alg.320.t: "Реформа образования увенчалась успехом"
 alg.320.d: "Инвестиции в школы и университеты вновь вселили в студентов надежду."
 alg.320.a: "Светлое будущее."
 alg.321.t: "Коллапс образования"
 alg.321.d: "Переполненные классы, неэффективные университеты и отсутствие возможностей подпитывают недовольство."
 alg.321.a: "Молодёжь ополчилась против нас."
 ALG_unemployment_reform: "Преодоление кризиса безработицы"
 ALG_unemployment_reform_desc: "Алжирская молодежь безработная и беспокойная. Мы должны инвестировать в промышленность и создание рабочих мест, иначе нас ждут беспорядки."
 alg.330.t: "Программа трудоустройства добилась успеха."
 alg.330.d: "Новые рабочие места и небольшие предприятия вселяют надежду в тысячи молодых алжирцев."
 alg.330.a: "Шаг вперёд."
 alg.331.t: "Кризис безработицы углубляется"
 alg.331.d: "Заводы простаивают, выпускники бездельничают на улицах, а протесты перерастают в насилие."
 alg.331.a: "Так продолжаться не может."
 alg.400.t: "Армия признает поражение"
 alg.400.d: "Народная национальная армия утратила контроль над политикой. В условиях растущего общественного давления и нежелания офицеров рисковать новой кровопролитной войной, генералы соглашаются уступить место гражданским лидерам."
 alg.400.a: "Наконец-то гражданское правление!"
 alg.401.t: "Армия наносит ответный удар"
 alg.401.d: "Несмотря на начавшиеся реформы, армия по-прежнему обладает реальной властью. Высокопоставленные генералы вмешиваются в политику, перенаправляют средства и саботируют попытки обеспечения прозрачности. Алжир снова скатывается к теневому правлению."
 alg.401.a: "Коррумпированные генералы остаются у власти."
 alg.402.t: "Народ восстает в оружии"
 alg.402.d: "Недовольство алжирского народа достигло критической точки. Стабильность подорвана, доверие к институциям разрушено, протесты перерастают в открытое восстание. Алжиру грозит новая гражданская война."
 alg.402.a: "Страна раздирается на части."
 ALG_resist_le_pouvoir: "Противостоять Ле Пувуар"
 ALG_resist_le_pouvoir_desc: "На протяжении десятилетий коррумпированная элита, известная как «Le Pouvoir», правила Алжиром из тени, используя армию как железную руку. Народ недовольен, и если его недовольство не будет удовлетворено, Алжир может столкнуться с новой бурей. Выбор этого пути откроет путь к реформам или к кровопролитию."
 ALG_popular_salvation: "Движение народного спасения"
 ALG_popular_salvation_desc: "Из пепла отчаяния поднимается новое движение. Студенты, рабочие и разочарованные солдаты объединяются в призыве к переменам. Сможет ли это движение мирным путем свергнуть старый порядок или разжечь гражданскую войну, будет зависеть от того, как мы будем управлять требованиями народа."
 ALG_popular_salvation_tt: "§YЭтот подход укрепляет оппозиционное движение, но не гарантирует гражданской войны. Исход зависит от того, как будут управляться недовольство и влияние армии. §!"
 ALG_restore_hope: "Восстановить надежду"
 ALG_restore_hope_desc: "В 1999 году Абдельазиз Бутефлика пришел к власти, обещая стабильность и примирение после «Черного десятилетия». Народ видит в нем символ надежды."
 ALG_charter_for_peace: "Гражданское соглашение"
 ALG_charter_for_peace_desc: "Гражданское соглашение, одобренное на референдуме в сентябре 1999 года, предлагает амнистию любому повстанцу, который сдастся до истечения установленного срока. Армия исламского спасения уже выполнила условия перемирия; вопрос в том, сколько из оставшихся бойцов последуют его примеру и спустятся с гор."
 ALG_no_pres_alliance: "ФЛН управляет единолично."
 ALG_no_pres_alliance_desc: "Бутефлика и Фронт национального освобождения отвергают союзы с другими партиями, заявляя о своем полном господстве над политической системой Алжира."
 ALG_le_pouvoir_in_the_shadows: "Власть в тени"
 ALG_le_pouvoir_in_the_shadows_desc: "Несмотря на проведение выборов, реальная власть сосредоточена в руках укоренившейся элиты. Коррупция усиливается, а граждане становятся все более недовольными."
 ALG_peace_charter: "Гражданское соглашение"
 ALG_peace_charter_desc: "Амнистия Бутефлики для повстанцев, сложивших оружие, была призвана скорее истощить силы «Черного десятилетия», чем разгромить их на поле боя."
 ALG_fln_dominance: "Доминирование ФЛН"
 ALG_fln_dominance_desc: "Фронт национального освобождения (ФНО) продолжает доминировать в политической системе Алжира. Его доминирование ограничивает политический плюрализм и порождает недовольство среди оппозиционных групп, но при этом обеспечивает преемственность и контроль со стороны режима."
 ALG_only_FLN: "Никакого Союза"
 ALG_only_FLN_desc: "Фронт национального освобождения (ФНО) будет править самостоятельно, отвергая союзы и коалиции. Хотя это и укрепляет власть, это еще больше изолирует оппозиционные силы и рискует усилить общественное недовольство."
 ALG_pres_coa: "Президентский альянс"
 ALG_pres_coa_desc: "Для поддержания стабильности Фронт национального освобождения может сформировать более широкую президентскую коалицию. Включив в нее лояльные партии и независимых кандидатов, правительство обретает легитимность, не теряя при этом своего господства."
 ALG_nationalize_privatized_industries: "Национализация приватизированных отраслей промышленности"
 ALG_nationalize_privatized_industries_desc: "Неолиберальная приватизация 1990-х годов ослабила суверенитет Алжира. Ренационализация ключевых отраслей промышленности позволяет государству восстановить контроль над стратегическими секторами."
 ALG_sonatrach_expansion: "Расширение Сонатрахеи"
 ALG_sonatrach_expansion_desc: "Государственная энергетическая компания Алжира Sonatrach является основой нашей экономики. Расширение ее мощностей и охвата укрепит государственные доходы и влияние Алжира на мировых энергетических рынках."
 ALG_the_cult_of_bouteflika: "Культ Бутефлики"
 ALG_the_cult_of_bouteflika_desc: "Сторонники президента Бутефлики создают культ личности вокруг его лидерства. Благодаря лояльным связям и пропаганде, его окружение укрепляет его доминирование в алжирской политике, даже несмотря на углубление коррупции и кумовства."
 ALG_cult_of_bouteflika: "Окружение Бутефлики"
 ALG_cult_of_bouteflika_desc: "Окруженный лояльной, но глубоко коррумпированной свитой, ближайший круг Бутефлики контролирует рычаги власти. Их влияние обеспечивает стабильность режима, но укрепляет непотизм и снижает прозрачность в управлении."
 ALG_oppose_ffs_and_rcd: "Запретить FFS и RCD"
 ALG_oppose_ffs_and_rcd_desc: "Фронт социалистических сил (ФСС) и «Объединение за культуру и демократию» (ОКД) бросают вызов гегемонии Фронта национального освобождения (ФНО). Запрещая их, режим подавляет голоса оппозиции, но рискует разжечь инакомыслие, особенно в Кабилии."
 ALG_smaller_state: "Меньшее государство"
 ALG_smaller_state_desc: "Раздутое алжирское государство неэффективно и обходится дорого. Сокращение его размеров и децентрализация власти могли бы повысить эффективность, хотя укоренившиеся элиты будут сопротивляться таким реформам."
 ALG_fight_bloated_bureaucracy: "Борьба с раздутой бюрократией"
 ALG_fight_bloated_bureaucracy_desc: "Многоуровневая бюрократия душит систему управления Алжира. Кампания по оптимизации государственного управления позволит сократить коррупцию и приблизить услуги к населению."
 FLN_parties_corruptions: "Коррупция в наших партиях"
 FLN_parties_corruptions_desc: "Коррупция проникла в ряды ФЛН и союзных ей партий. Осуждение и борьба с этой коррупцией жизненно важны, если режим надеется восстановить доверие."
 ALG_elite_control: "Элитный контроль"
 ALG_elite_control_desc: "Сеть бизнесменов, партийных лидеров и военных офицеров, известная как «Le Pouvoir», управляет Алжиром из тени."
 ALG_military_coup: "Военный переворот"
 ALG_military_coup_desc: "Армия приняла решение свергнуть гражданское руководство и захватить власть напрямую, обещая порядок, но сея страх."
 ALG_suspend_democracy: "Приостановить демократию"
 ALG_suspend_democracy_desc: "Парламент распущен, выборы отменены, и Алжиром правят генералы."
 ALG_repression_campaign: "Кампания репрессий"
 ALG_repression_campaign_desc: "Национальная ассоциация пакистанцев (PNA) использует жестокие методы, применявшиеся в период «Черного десятилетия», для подавления инакомыслия, что вызывает международное возмущение."
 ALG_black_market_rises: "Черный рынок набирает силу"
 ALG_black_market_rises_desc: "Коррупция и дефицит создают процветающий черный рынок, подрывая официальную экономику."
 ALG_expand_the_pna: "Развернуть PNA"
 ALG_expand_the_pna_desc: "Армия расширяется, модернизируется и укрепляется, чтобы гарантировать выживание режима."
 ALG_africas_strongest_army: "Самая сильная армия Африки"
 ALG_africas_strongest_army_desc: "В настоящее время Алжир обладает самыми сильными вооруженными силами на континенте, силой, с которой нужно считаться."
 ALG_global_power_projection: "HCS снова поднимается"
 ALG_global_power_projection_desc: "С возвращением военной власти к неоспоримым властным структурам Алжир заявляет о себе как внутри страны, так и за рубежом. Повторяя доминирование эпохи ХКС 1990-х годов, наша страна стоит непоколебимо, непреклонно и готова распространять свое влияние далеко за пределы своих границ. Мир запомнит силу алжирской решимости."
