 us_public_disorder: "Désordre public"
 us_public_disorder_desc: "Le peuple devient agité, nous devons faire quelque chose avant que cela ne dégénère."
 us_public_disorder_two: "Colère publique accrue"
 us_public_disorder_two_desc: "L'agitation croît, pour l'amour de Dieu, trouvez une solution."
 us_public_disorder_three: "Indignation civile"
 us_public_disorder_three_desc: "Nous avons joué avec le feu, et si nous ne réglons pas les indignations de la population générale, nous allons vraiment découvrir les conséquences."
 us_public_disorder_four: "Effondrement sociétal"
 us_public_disorder_four_desc: "Aurions-nous pu faire plus..."
