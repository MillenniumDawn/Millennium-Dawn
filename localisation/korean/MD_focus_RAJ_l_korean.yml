 raj_chi_border_attack_982_from_455_desc: "고르칼랜드에서 진격하여 시킴의 통제권을 다투거나 되찾습니다. 공세가 성공하면 이 주에 대한 §Y영유권 진행도 20§!이 추가되고, 격퇴당하면 §Y10§!이 감소합니다."
 raj_chi_border_attack_591_from_993: "라다크에서 악사이친 공격"
 raj_chi_border_attack_591_from_993_desc: "라다크에서 악사이친 고원으로 진격합니다. 공세가 성공하면 이 주에 대한 §Y영유권 진행도 20§!이 추가되고, 격퇴당하면 §Y10§!이 감소합니다."
 raj_chi_border_attack_993_from_591: "악사이친에서 라다크 공격"
 raj_chi_border_attack_993_from_591_desc: "악사이친에서 라다크로 진격합니다. 공세가 성공하면 이 주에 대한 §Y영유권 진행도 20§!이 추가되고, 격퇴당하면 §Y10§!이 감소합니다."
 raj_chi_border_attack_993_from_589: "시짱에서 라다크 공격"
 raj_chi_border_attack_993_from_589_desc: "시짱에서 고원을 가로질러 라다크로 진격합니다. 공세가 성공하면 이 주에 대한 §Y영유권 진행도 20§!이 추가되고, 격퇴당하면 §Y10§!이 감소합니다."
 raj_chi_border_attack_993_from_428: "히마찰에서 라다크 공격"
 raj_chi_border_attack_993_from_428_desc: "히마찰에서 진격하여 라다크의 통제권을 다투거나 되찾습니다. 공세가 성공하면 이 주에 대한 §Y영유권 진행도 20§!이 추가되고, 격퇴당하면 §Y10§!이 감소합니다."
 raj_chi_border_attack_591_from_589: "시짱에서 악사이친 공격"
 raj_chi_border_attack_591_from_589_desc: "시짱에서 악사이친으로 진격합니다. 공세가 성공하면 이 주에 대한 §Y영유권 진행도 20§!이 추가되고, 격퇴당하면 §Y10§!이 감소합니다."
 raj_chi_border_capture_475: "아루나찰프라데시에 대한 영유권 행사"
 raj_chi_border_capture_475_desc: "축적된 기세를 활용해 아루나찰프라데시의 통제권을 요구합니다. 진행도: [?raj_chi_border_progress_475]/80."
 raj_chi_border_capture_982: "시킴에 대한 영유권 행사"
 raj_chi_border_capture_982_desc: "축적된 기세를 활용해 시킴의 통제권을 요구합니다. 진행도: [?raj_chi_border_progress_982]/80."
 raj_chi_border_capture_591: "악사이친에 대한 영유권 행사"
 raj_chi_border_capture_591_desc: "축적된 기세를 활용해 악사이친의 통제권을 요구합니다. 진행도: [?raj_chi_border_progress_591]/80."
 raj_chi_border_capture_993: "라다크에 대한 영유권 행사"
 raj_chi_border_capture_993_desc: "축적된 기세를 활용해 라다크의 통제권을 요구합니다. 진행도: [?raj_chi_border_progress_993]/80."
 raj_chi_border_progress_475_tt: "§Y아루나찰프라데시 진행도 80§! 필요. 현재: [?raj_chi_border_progress_475]"
 raj_chi_border_progress_982_tt: "§Y시킴 진행도 80§! 필요. 현재: [?raj_chi_border_progress_982]"
 raj_chi_border_progress_591_tt: "§Y악사이친 진행도 80§! 필요. 현재: [?raj_chi_border_progress_591]"
 raj_chi_border_progress_993_tt: "§Y라다크 진행도 80§! 필요. 현재: [?raj_chi_border_progress_993]"
 border_war_training_failure.1.t: "훈련 사고"
 border_war_training_failure.1.d: "야외 훈련 중 발생한 사고로 병사 여러 명이 부상을 입었고, 작전 안전에 대한 의문이 제기되었습니다."
 border_war_training_failure.1.a: "훈련을 검토한다"
 border_war_training_failure.2.t: "연합 병과 사고"
 border_war_training_failure.2.d: "연합 병과 훈련 중 발생한 충돌로 장비가 파손되고 병사 여러 명이 부상을 입었습니다."
 border_war_training_failure.2.a: "훈련을 중단한다"
 border_war_tension_failure.1.t: "국경 행동 격퇴"
 border_war_tension_failure.1.d: "상대국 병력이 우리의 최근 도발에 정확한 사격으로 응수하여, 인명 피해가 나고 현지 준비가 차질을 빚었습니다."
 border_war_tension_failure.1.a: "후퇴한다"
 border_war_operation_blocked.1.t: "작전 취소"
 border_war_operation_blocked.1.d: "준비가 끝나기 전에 소유권, 통제권, 병력 주둔 상황 또는 외교 여건이 바뀌었습니다. 작전은 진행도를 소모하지 않고 취소되었습니다."
 border_war_operation_blocked.1.a: "알겠다"
 border_war_outcome.1.t: "공세 성공"
 border_war_outcome.1.d: "우리 병력이 최근 충돌에서 승리하여 현지 목표를 향한 기세를 얻었습니다."
 border_war_outcome.1.a: "진지를 공고히 한다"
 border_war_outcome.2.t: "작전 격퇴당함"
 border_war_outcome.2.d: "상대국 병력이 공격을 격퇴하여 분쟁 주 일대에서 우리의 기세가 꺾였습니다."
 border_war_outcome.2.a: "계획을 재검토한다"
 border_war_outcome.3.t: "국경의 교착 상태"
 border_war_outcome.3.d: "충돌은 결정적인 결과 없이 끝났으며 우리의 현지 기세 일부가 소모되었습니다."
 border_war_outcome.3.a: "전선을 사수한다"
 pak_raj_border_claim.1.t: "영토 요구"
 pak_raj_border_claim.1.d_420: "[FROM.GetNameDefCap]은(는) 거듭된 국지전 승리를 근거로 아자드 카슈미르를 요구했습니다. 양보하면 해당 주가 이전되고 긴장이 완화됩니다. 거부하면 더 큰 위기가 열릴 것입니다."
 pak_raj_border_claim.1.d_427: "[FROM.GetNameDefCap]은(는) 거듭된 국지전 승리를 근거로 잠무 카슈미르를 요구했습니다. 양보하면 해당 주가 이전되고 긴장이 완화됩니다. 거부하면 더 큰 위기가 열릴 것입니다."
 pak_raj_border_claim.1.d_429: "[FROM.GetNameDefCap]은(는) 거듭된 국지전 승리를 근거로 동부 펀자브를 요구했습니다. 양보하면 해당 주가 이전되고 긴장이 완화됩니다. 거부하면 더 큰 위기가 열릴 것입니다."
 pak_raj_border_claim.1.d_563: "[FROM.GetNameDefCap]은(는) 거듭된 국지전 승리를 근거로 중부 펀자브를 요구했습니다. 양보하면 해당 주가 이전되고 긴장이 완화됩니다. 거부하면 더 큰 위기가 열릴 것입니다."
 pak_raj_border_claim.1.d_573: "[FROM.GetNameDefCap]은(는) 거듭된 국지전 승리를 근거로 남부 펀자브를 요구했습니다. 양보하면 해당 주가 이전되고 긴장이 완화됩니다. 거부하면 더 큰 위기가 열릴 것입니다."
 pak_raj_border_claim.1.d_426: "[FROM.GetNameDefCap]은(는) 거듭된 국지전 승리를 근거로 신드를 요구했습니다. 양보하면 해당 주가 이전되고 긴장이 완화됩니다. 거부하면 더 큰 위기가 열릴 것입니다."
 pak_raj_border_claim.1.d_987: "[FROM.GetNameDefCap]은(는) 거듭된 국지전 승리를 근거로 서부 구자라트를 요구했습니다. 양보하면 해당 주가 이전되고 긴장이 완화됩니다. 거부하면 더 큰 위기가 열릴 것입니다."
 pak_raj_border_claim.1.d_984: "[FROM.GetNameDefCap]은(는) 거듭된 국지전 승리를 근거로 서부 라자스탄을 요구했습니다. 양보하면 해당 주가 이전되고 긴장이 완화됩니다. 거부하면 더 큰 위기가 열릴 것입니다."
 pak_raj_border_claim.1.a: "분쟁 주를 양보한다"
 pak_raj_border_claim.1.b: "요구를 거부한다"
 pak_raj_border_crisis.1.t: "국경 위기 발발"
 pak_raj_border_crisis.1.d: "거부당한 우리의 영토 요구가 외교적, 군사적 위기로 굳어졌습니다. 동원은 양보를 이끌어 낼 수 있지만, 되돌아갈 길도 좁아집니다."
 pak_raj_border_crisis.1.a: "국경을 동원한다"
 pak_raj_border_crisis.1.b: "조용히 물러선다"
 pak_raj_border_crisis.2.t: "상대국의 동원"
 pak_raj_border_crisis.2.d: "상대국 병력이 국경을 향해 이동하고 있습니다. 위기가 통제하기 어려워지기 전에 맞동원하거나 회담을 모색할 수 있습니다."
 pak_raj_border_crisis.2.a: "맞동원한다"
 pak_raj_border_crisis.2.b: "즉각 회담을 모색한다"
 pak_raj_border_crisis.3.t: "영토 최후통첩"
 pak_raj_border_crisis.3.d_420: "[FROM.GetNameDefCap]은(는) 아자드 카슈미르를 요구하며, 우리가 거부하면 제한전을 벌이겠다고 위협하고 있습니다."
 pak_raj_border_crisis.3.d_427: "[FROM.GetNameDefCap]은(는) 잠무 카슈미르를 요구하며, 우리가 거부하면 제한전을 벌이겠다고 위협하고 있습니다."
 pak_raj_border_crisis.3.d_429: "[FROM.GetNameDefCap]은(는) 동부 펀자브를 요구하며, 우리가 거부하면 제한전을 벌이겠다고 위협하고 있습니다."
 pak_raj_border_crisis.3.d_563: "[FROM.GetNameDefCap]은(는) 중부 펀자브를 요구하며, 우리가 거부하면 제한전을 벌이겠다고 위협하고 있습니다."
 pak_raj_border_crisis.3.d_573: "[FROM.GetNameDefCap]은(는) 남부 펀자브를 요구하며, 우리가 거부하면 제한전을 벌이겠다고 위협하고 있습니다."
 pak_raj_border_crisis.3.d_426: "[FROM.GetNameDefCap]은(는) 신드를 요구하며, 우리가 거부하면 제한전을 벌이겠다고 위협하고 있습니다."
 pak_raj_border_crisis.3.d_987: "[FROM.GetNameDefCap]은(는) 서부 구자라트를 요구하며, 우리가 거부하면 제한전을 벌이겠다고 위협하고 있습니다."
 pak_raj_border_crisis.3.d_984: "[FROM.GetNameDefCap]은(는) 서부 라자스탄을 요구하며, 우리가 거부하면 제한전을 벌이겠다고 위협하고 있습니다."
 pak_raj_border_crisis.3.a: "수락하고 철수한다"
 pak_raj_border_crisis.3.b: "최후통첩을 거부한다"
 pak_raj_border_crisis.4.t: "최후통첩 거부됨"
 pak_raj_border_crisis.4.d: "상대국이 우리의 요구를 거부했습니다. 분쟁 주에 대한 영유권을 관철하거나, 물러서는 데 따르는 정치적 비용을 감수해야 합니다."
 pak_raj_border_crisis.4.a: "끝까지 밀어붙인다"
 pak_raj_border_crisis.4.b: "물러선다"
 pak_raj_border_crisis.5.t: "핵 신호"
 pak_raj_border_crisis.5.d: "군 기획자들은 결의를 보여 주기 위해 핵 준비태세에 눈에 띄는 변화를 줄 것을 제안합니다. 자제하면 긴장이 낮아지겠지만 약함으로 읽힐 수 있습니다."
 pak_raj_border_crisis.5.a: "핵 준비태세를 높인다"
 pak_raj_border_crisis.5.b: "자제를 유지한다"
 pak_raj_border_crisis.6.t: "상대국의 준비태세 신호"
 pak_raj_border_crisis.6.d: "상대국이 핵 준비태세를 눈에 띄게 높였습니다. 같은 태세로 맞서면 핵 대치가 조성되는 반면, 자제하면 당장의 긴장이 줄어듭니다."
 pak_raj_border_crisis.6.a: "같은 방식으로 대응한다"
 pak_raj_border_crisis.6.b: "일방적으로 긴장을 완화한다"
 pak_raj_border_crisis.7.t: "중재 요청"
 pak_raj_border_crisis.7.d: "인도 파키스탄 위기가 지역 안정을 위협하고 있습니다. 미국 외교관들은 협상을 통한 단계적 긴장 완화의 통로를 제공할 수 있습니다."
 pak_raj_border_crisis.7.a: "중재를 제안한다"
 pak_raj_border_crisis.7.b: "개입하지 않는다"
 pak_raj_border_crisis.8.t: "미국의 중재"
 pak_raj_border_crisis.8.d: "미국이 상호 긴장 완화를 중재하겠다고 제안했습니다. 수락하면 위기가 끝나고 양자 긴장도가 낮아집니다."
 pak_raj_border_crisis.8.a: "중재를 수락한다"
 pak_raj_border_crisis.8.b: "외부의 간섭을 거부한다"
 pak_raj_border_crisis.9.t: "지나가는 위기"
 pak_raj_border_crisis.9.d: "당면한 대치가 전면전 없이 끝났습니다. 국경 일대의 병력은 평시 준비태세로 돌아가고 있습니다."
 pak_raj_border_crisis.9.a: "알겠다"
 pak_raj_border_crisis.10.t: "외교적 승리"
 pak_raj_border_crisis.10.d: "상대국이 분쟁 주를 양보했습니다. 대치는 우리가 원하는 조건대로 끝났습니다."
 pak_raj_border_crisis.10.a: "승리를 공고히 한다"
 pak_raj_border_crisis.11.t: "영유권 요구 소멸"
 pak_raj_border_crisis.11.d: "위기가 해결되기 전에 분쟁 주의 통제권이 바뀌었습니다. 영토 요구는 더 이상 유효하지 않습니다."
 pak_raj_border_crisis.11.a: "사건을 종결한다"
 raj_chi_border_crisis.2.t: "영토 요구"
 raj_chi_border_crisis.2.d_475: "[FROM.GetNameDefCap]은(는) 거듭된 국지전 승리를 근거로 아루나찰프라데시를 요구했습니다. 양보하면 해당 주가 이전되고 국경이 안정되지만, 거부하면 제한전의 위험이 있습니다."
 raj_chi_border_crisis.2.d_982: "[FROM.GetNameDefCap]은(는) 거듭된 국지전 승리를 근거로 시킴을 요구했습니다. 양보하면 해당 주가 이전되고 국경이 안정되지만, 거부하면 제한전의 위험이 있습니다."
 raj_chi_border_crisis.2.d_591: "[FROM.GetNameDefCap]은(는) 거듭된 국지전 승리를 근거로 악사이친을 요구했습니다. 양보하면 해당 주가 이전되고 국경이 안정되지만, 거부하면 제한전의 위험이 있습니다."
 raj_chi_border_crisis.2.d_993: "[FROM.GetNameDefCap]은(는) 거듭된 국지전 승리를 근거로 라다크를 요구했습니다. 양보하면 해당 주가 이전되고 국경이 안정되지만, 거부하면 제한전의 위험이 있습니다."
 raj_chi_border_crisis.2.a: "분쟁 주를 양보한다"
 raj_chi_border_crisis.2.b: "요구를 거부한다"
 raj_chi_border_crisis.3.t: "철수 요구 거부됨"
 raj_chi_border_crisis.3.d: "상대국이 분쟁 주를 반환하기를 거부하고 있습니다. 해당 주에 대한 제한적 전쟁 명분을 만들거나 물러설 수 있습니다."
 raj_chi_border_crisis.3.a: "제한적 대응을 준비한다"
 raj_chi_border_crisis.3.b: "물러선다"
 raj_chi_border_crisis.4.t: "분쟁 주 양보됨"
 raj_chi_border_crisis.4.d: "상대국이 우리의 요구를 받아들여 분쟁 주를 양보했고, 대치는 더 큰 전쟁 없이 끝났습니다."
 raj_chi_border_crisis.4.a: "국경을 복원한다"
 raj_chi_border_crisis.5.t: "영유권 요구 소멸"
 raj_chi_border_crisis.5.d: "대치가 해결되기 전에 분쟁 주의 통제권이 바뀌었습니다. 요구는 더 이상 유효하지 않습니다."
 raj_chi_border_crisis.5.a: "사건을 종결한다"
