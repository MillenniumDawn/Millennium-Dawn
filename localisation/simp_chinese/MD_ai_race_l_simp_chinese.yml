 AI_RACE_review_available_tt: "下一阶段已满足日期、技术和前一阶段工作要求，且无需进行任何投资审查。确认收购时，我们将进行财政和破产审查。"
 AI_RACE_review_investment_tt: "我们将免费审核前期投资、各项容量需求以及任何紧急AI融资方案。您有七天时间确认；如未回复，投资将被推迟。"
 AI_RACE_defer_investment_tt: "推迟投资，无需动用国库资金或筹集资金。未得到答复的审查将在七天后失效。"
 AI_RACE_pay_direct_tt: "从国库拨款§Y$[?ROOT.ai_race_quote_cost|2]B§!，无需新的融资即可启动审查阶段。启动月份不计入已完成阶段的工作量。"
 AI_RACE_pay_financed_tt: "从国库拨款§Y$[?ROOT.ai_race_quote_cost|2]B§!，启动审查阶段，额外的§Y紧急AI融资§!按周偿还。在产能短缺期间，阶段性工作仍在继续，而最薄弱的物理需求决定我们的收益。启动月份不计入已完成的阶段性工作。"
 AI_RACE_quote_capacity_tt: "§H标称能力：可用/所需§!\n民用工厂;[?ROOT.ai_race_quote_civs_available|0] / [?ROOT.ai_race_quote_civs_required|0] ([?ROOT.ai_race_quote_civs_ratio|%1]; [ai_race_quote_civs_status])\n网络基础设施：[?ROOT.ai_race_quote_network_available|0] / [?ROOT.ai_race_quote_network_required|0] ([?ROOT.ai_race_quote_network_ratio|%1]; [ai_race_quote_network_status])\n持续电力：[?ROOT.ai_race_quote_power_available|1] / [?ROOT.ai_race_quote_power_required|1] GW ([?ROOT.ai_race_quote_power_ratio|%1]; [ai_race_quote_power_status])\n微芯片：[?ROOT.ai_race_quote_microchips_available|1] / [?ROOT.ai_race_quote_microchips_required|0] ([?ROOT.ai_race_quote_microchips_ratio|%1]; [ai_race_quote_microchips_status])\n复合材料：[?ROOT.ai_race_quote_composites_available|1] / [?ROOT.ai_race_quote_composites_required|0] ([?ROOT.ai_race_quote_composites_ratio|%1]; [ai_race_quote_composites_status])\n石油：[?ROOT.ai_race_quote_oil_available|1] / [?ROOT.ai_race_quote_oil_required|0] ([?ROOT.ai_race_quote_oil_ratio|%1]; [ai_race_quote_oil_status])\n§Y能力缺口§!：任何低于100%的要求均视为有效。最低要求决定了我们的运营效率。已交付的进口物资计入供应量。只有未受损的建筑物才计入；电池撤离无法满足持续的电力需求。"
 AI_RACE_quote_financing_tt: "§H紧急AI融资§!\n除了前期投资外，当产能不足时，即可使用。\n前期投资：§Y$[?ROOT.ai_race_quote_cost|2]B§!\n审批时间GDP：§Y$[?ROOT.ai_race_quote_gdp|2]B§!\n固定金额融资：§Y$[?ROOT.ai_race_quote_principal|2]B§!, 等于审批时间GDP的§Y[?ROOT.ai_race_quote_rate|%1]§!。\n还款：每周支付§Y$[?ROOT.ai_race_quote_payment|3]§!，分§Y520周支付§!，为期十年。最后一笔款项将结清剩余的全部金额。\n每个方案都有其对应的每周还款额。维修费用、通货膨胀以及后续的GDP变化均不会改变已批准的本金或取消还款。报价变更需要重新审核，且不收取任何费用。"
 ai_race.10.t: "前沿AI已实现"
 ai_race.10.d: "我们的国家AI计划已发展到前沿人工智能阶段。我们的研究人员和产业界已经取得了一项里程碑式的成就，而这一成就现在取决于国家能否持续提供支持。"
 ai_race.10.a: "表彰这一成就。"
 ai_race.11.t: "投资评估报告已失效"
 ai_race.11.d: "根据已审核的条款，该投资无法继续进行。我们未收取任何款项，也未制定任何融资方案。待符合申请条件后，我们可以通过AI竞赛的决策机制申请重新审核。"
 ai_race.11.a: "重新考虑该提议。"
 ai_race_news.1.t: "前沿AI领域的首创"
 ai_race_news.1.d: "[?global.ai_race_first_finisher_id.GetName]已成为首个获得前沿AI认证的国家。其研究人员和产业合作伙伴在AI发展史上留下了浓墨重彩的一笔，而其他国家的同类项目也在继续推进。"
 ai_race_news.1.a: "竞赛仍在继续。"
 AI_RACE_review_research: "审查研究投资"
 AI_RACE_review_research_desc: "免费查看价值$50B的研究投资。在我们对现代深度学习进行研究之后，即可于2016年1月开始参与。研究需要36个月才能完成。"
 ai_race.1.t: "研究投资评论"
 ai_race.1.d: "我们的研究机构已提出一项国家计划，旨在将先进的AI从孤立的实验中解放出来。该计划目前正在等待投资决定。"
 ai_race.1.a: "推迟投资。"
 ai_race.1.b: "从国库拨款$[?ROOT.ai_race_quote_cost|1]B"
 ai_race.1.c: "利用紧急AI融资进行投资。"
 AI_RACE_review_implementation: "审查实施投资"
 AI_RACE_review_implementation_desc: "免费查看价值$150B的实施投资计划。在完成对现代深度学习的研究并开展为期36个月的研究后，即可于2019年1月加入该计划。实施工作需要60个月才能继续推进。"
 ai_race.2.t: "实施投资审查"
 ai_race.2.d: "我们的研究项目为更广泛的推广应用奠定了基础。行业和公共机构已提出下一轮国家投资计划。"
 ai_race.2.a: "推迟投资。"
 ai_race.2.b: "从国库拨款$[?ROOT.ai_race_quote_cost|1]B"
 ai_race.2.c: "利用紧急AI融资进行投资。"
 AI_RACE_review_expansion: "审查扩展投资"
 AI_RACE_review_expansion_desc: "免费查看$400B的扩展投资计划。在完成对人类模仿AI的研究并完成60个月的实施后，将于2024年1月开放参与。扩展计划需要12个月的实施才能继续推进。"
 ai_race.3.t: "扩展投资审查"
 ai_race.3.d: "AI正逐渐成为一项国家级事业，对产业和基础设施提出了越来越高的要求。我们的扩展方案将这些目标汇集起来进行审视。"
 ai_race.3.a: "推迟投资。"
 ai_race.3.b: "从国库拨款$[?ROOT.ai_race_quote_cost|1]B"
 ai_race.3.c: "利用紧急AI融资进行投资。"
 AI_RACE_review_frontier: "前沿AI投资审查"
 AI_RACE_review_frontier_desc: "免费查看价值$1000B的前沿AI投资项目。在完成人类模仿AI的研究并完成12个月的扩展后，即可于2025年1月参与。前沿AI将赢得国家竞赛；后续的AI技术将保留各自的研究日期和影响。"
 ai_race.4.t: "前沿AI投资审查"
 ai_race.4.d: "我们的国家项目正接近AI竞赛的前沿。最终投资方案阐述了维持这一地位所需的能力。"
 ai_race.4.a: "推迟投资。"
 ai_race.4.b: "从国库拨款$[?ROOT.ai_race_quote_cost|1]B"
 ai_race.4.c: "利用紧急AI融资进行投资。"
