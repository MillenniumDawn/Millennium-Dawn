 DESIGNER_REGIMENTAL_SUPPORT_COLUMN_TITLE: "Plutony i sekcje wsparcia batalionu. Są to pododdziały wsparcia i bojowe przydzielone bezpośrednio na szczeblu batalionu.\n\n Kompanie i sekcje wsparcia batalionu §R wpływają§! na §Y prędkość maksymalną §!brygady i §Gnie zwiększają §! §Y rozpiętości bojowej§! (§Rz wyjątkiem§!Morskich oddziałów desantowych)."
 DESIGNER_SUPPORT_COLUMN_TITLE: "Kompanie wsparcia brygady oraz mniejsze pododdziały. Są to jednostki wsparcia, które pozostają na tyłach sił pierwszoliniowych i zapewniają im wsparcie.\n\nMożesz wybrać tylko §Rjedną§! sztukę każdego rodzaju.\n\nKompanie i mniejsze pododdziały §Rwpływają§! na §Yprędkość maksymalną§! brygady oraz §Rzwiększają§! jej §Yszerokość frontu§! (§Rz wyjątkiem§! plutonu zwiadowczego)."
