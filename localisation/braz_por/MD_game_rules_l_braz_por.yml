 RULE_INFLUENCE_COOLDOWN: "Tempo de Recarga do Ganho de Influência por Investimento"
 RULE_14_DAY_INFLUENCE: "Tempo de Recarga de 14 Dias"
 RULE_14_DAY_INFLUENCE_DESC: "Opção padrão. O tempo de recarga para o ganho de influência com investimento é de 14 dias ou 2 semanas. Isso se aplica à nação para todas as oportunidades de investimento possíveis. Embora você ainda possa investir, você não ganhará influência durante esse período."
 RULE_0_DAY_INFLUENCE: "Sem Tempo de Recarga"
 RULE_0_DAY_INFLUENCE_DESC: "Tempo limite antigo para ganho de influência com investimento. Você pode investir quantas vezes quiser enquanto ainda ganha influência, não recomendado para quem gosta de equilíbrio!"
 RULE_30_DAY_INFLUENCE: "Resfriamento de 30 Dias"
 RULE_30_DAY_INFLUENCE_DESC: "A opção sugerida para multijogador. O tempo de espera para o ganho de influência através de investimentos é de 30 dias ou aproximadamente 1 mês. Isso se aplica à nação para todas as oportunidades de investimento possíveis. Embora você ainda possa investir, não ganhará influência durante este período."
 RULE_MONTHLY_DOMESTIC_INFLUENCE_TICK: "Habilitar Tick de Crescimento Mensal §YIndependência Doméstica§!"
 RULE_MONTHLY_DOMESTIC_INFLUENCE_TICK_NO_DESC: "Desabilita o Tick de Crescimento Mensal §YIndependência Doméstica§!."
 RULE_MONTHLY_DOMESTIC_INFLUENCE_TICK_YES_DESC: "Habilita o Tick de Crescimento Mensal §YIndependência Doméstica§!. A cada mês, a §YIndependência Doméstica§! crescerá pelo valor definido na regra do jogo \"Tick de Crescimento Mensal §YIndependência Doméstica§!\" que é definido por padrão como 0.10% por mês."
 RULE_MONTHLY_DOMESTIC_INFLUENCE_GAIN_AMOUNT: "Quantidade de Crescimento Mensal §YIndependência Doméstica§!"
 RULE_MONTHLY_DOMESTIC_INFLUENCE_GAIN_AMOUNT_05: "0.05%"
 RULE_MONTHLY_DOMESTIC_INFLUENCE_GAIN_AMOUNT_05_DESC: "A cada mês, a §YIndependência Doméstica§! aumentará em 0.05% enquanto o Tick de Crescimento Mensal §YIndependência Doméstica§! estiver habilitado."
 RULE_MONTHLY_DOMESTIC_INFLUENCE_GAIN_AMOUNT_10: "0.10%"
 RULE_MONTHLY_DOMESTIC_INFLUENCE_GAIN_AMOUNT_10_DESC: "A cada mês, a §YIndependência Doméstica§! aumentará em 0.10% enquanto o Tick de Crescimento Mensal §YIndependência Doméstica§! estiver habilitado."
 RULE_MONTHLY_DOMESTIC_INFLUENCE_GAIN_AMOUNT_15: "0.15%"
 RULE_MONTHLY_DOMESTIC_INFLUENCE_GAIN_AMOUNT_15_DESC: "A cada mês, a §YIndependência Doméstica§! aumentará em 0.15% enquanto o Tick de Crescimento Mensal §YIndependência Doméstica§! estiver habilitado."
 RULE_ENABLE_DIVISION_LIMITER: "Ativar Limitador de Divisões da IA"
 RULE_NO_ENABLE_DIVISION_LIMITER_DESC: "Limitador de Divisões da IA Desativado\n\nPor padrão, a IA não terá limite no número de unidades que pode produzir. Se desejar limitar as divisões por motivos de desempenho, por favor, ative essa opção!"
 RULE_YES_ENABLE_DIVISION_LIMITER_DESC: "Limitador de Divisões da IA Ativado\n\nQuando ativado, a IA terá menos probabilidade de produzir unidades, permitindo uma experiência mais fluída para que você, o jogador, possa jogar com mais tranquilidade!"
 RULE_OPTION_POTATO_EDITION: "Edição Batata"
 RULE_POTATO_EDITION_DIVISION_LIMITER_DESC: "Ativado Limitador de Divisões da IA para a Edição Batata\n\nLimita ainda mais a IA por motivos de desempenho.\n"
 RULE_REMOVE_MICRO_STATES: "Remove Nations"
 RULE_NO_RULE_REMOVE_MICRO_STATES_DESC: "Do not remove any nations from the game start."
 RULE_ALLOW_ENABLE_LEDGER: "Ativar Diário do MD"
 RULE_ALLOW_ENABLE_LEDGER_YES_DESC: "MD's Ledger is enabled. (Some information from the La Resistance intel ledger may become redundant. Disable this feature if you want a harder game.)"
 RULE_ALLOW_ENABLE_LEDGER_NO_DESC: "Desativa o diário do MD. Isso é melhor para jogadores que preferem uma experiência mais autêntica e desejam usar a expansão La Résistance para obter informações críticas."
 RULE_ALLOW_HELP_GUI: "Habilitar MD Ajuda GUI"
