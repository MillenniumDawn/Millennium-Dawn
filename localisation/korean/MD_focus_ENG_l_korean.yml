 ENG_finalize_scottish_union_settlement: "스코틀랜드 합의 확정"
 ENG_finalize_scottish_union_settlement_desc: "스코틀랜드에서 세 건의 합의가 이미 가결되었고, 분리주의 정당들이 한때 불가능하다고 했던 위임이 완성되었습니다. 남은 것은 형식적 절차입니다. 결과를 법에 명시하고, 주민투표 기구를 영구히 해체하며, 스코틀랜드에 남아 있는 중핵을 기록에서 삭제하여 훗날 정부가 악용할 모호함이 남지 않도록 하는 것입니다. 홀리루드는 제도를 유지하지만, 1998년 권한 이양 합의가 미결로 남겼던 헌법 문제는 종결됩니다."
 ENG_finalize_north_irish_union_settlement: "북아일랜드 합의 확정"
 ENG_finalize_north_irish_union_settlement_desc: "북아일랜드에서 세 건의 합의가 이미 가결되었고, 공화주의 정치가 한때 불가능하다고 했던 위임이 완성되었습니다. 남은 것은 형식적 절차입니다. 결과를 법에 명시하고, 국경 투표 기구를 영구히 해체하며, 북아일랜드에 남아 있는 중핵을 기록에서 삭제하여 훗날 정부가 악용할 모호함이 남지 않도록 하는 것입니다. 스토먼트는 제도를 유지하지만, 성금요일 합의가 미결로 남겼던 헌법 문제는 종결됩니다."
 ENG_finalize_welsh_union_settlement: "웨일스 합의 확정"
 ENG_finalize_welsh_union_settlement_desc: "웨일스에서 세 건의 합의가 이미 가결되었고, 세네드의 독립 세력이 한때 불가능하다고 했던 위임이 완성되었습니다. 남은 것은 형식적 절차입니다. 결과를 법에 명시하고, 주민투표 기구를 영구히 해체하며, 웨일스에 남아 있는 중핵을 기록에서 삭제하여 훗날 정부가 악용할 모호함이 남지 않도록 하는 것입니다. 세네드는 제도를 유지하지만, 권한 이양 합의가 미결로 남겼던 헌법 문제는 종결됩니다."
 ENG_integrate_scotland_tt: "[SCO.GetFlag] 스코틀랜드가 연합에 통합됩니다:\n - 스코틀랜드 §H동요§! 및 §H민족주의§!가 §G0§!으로 설정됩니다\n - 스코틀랜드 §H의존도§!가 §G100§!으로 설정됩니다\n - 더 이상 스코틀랜드 주민투표를 소집할 수 없습니다"
 ENG_integrate_northern_ireland_tt: "[NIR.GetFlag] 북아일랜드가 연합에 통합됩니다:\n - 북아일랜드 §H종파 간 긴장§! 및 §H민족주의§!가 §G0§!으로 설정됩니다\n - 북아일랜드 §H의존도§!가 §G100§!으로 설정됩니다\n - 더 이상 국경 투표나 주민투표를 소집할 수 없습니다"
 ENG_integrate_wales_tt: "[WAS.GetFlag] 웨일스가 연합에 통합됩니다:\n - 웨일스 §H동요§! 및 §H민족주의§!가 §G0§!으로 설정됩니다\n - 웨일스 §H의존도§!가 §G100§!으로 설정됩니다\n - 더 이상 웨일스 주민투표를 소집할 수 없습니다"
