 BOS_destabilize_the_government_desc: "대중의 신뢰와 전쟁 대비 태세를 의도적으로 무너뜨립니다. 안정도와 전쟁 지지도가 이처럼 낮아지면 적대적인 세르비아인 또는 크로아티아인 정치체가 독립을 선언할 수 있습니다."
