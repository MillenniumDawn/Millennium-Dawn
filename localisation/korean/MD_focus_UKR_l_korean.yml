 ukr_modernize_sov_equipment_gtmu_tractors_desc: "\n\n\n\n\n\n£UKR_desctext_modernize_sov_gtmu_tractors_for_tooltip\n\n\n\n\n\n\n\n\n§W보관 중인 §YGT-MU§! 궤도 수송차는 군에는 쓸모가 없지만, 차체는 여전히 쟁기를 끌 수 있습니다. §Y하르키우 트랙터 공장§!이 차체를 뜯어내 일손과 장비가 부족한 농장에 보낼 궤도식 트랙터로 개조할 수 있습니다.\n------------------\n§Y10§!년간 농장의 농업 생산성이 §G+1%§! 오르고 필요 인력이 §G1%§! 줄어듭니다.§!"
