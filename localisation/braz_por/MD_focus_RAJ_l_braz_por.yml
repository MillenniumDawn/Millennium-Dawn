 RAJ_us_pak_pressure_reject_tt:0 "§YA opinião dos Estados Unidos sobre a Índia piora e a influência da Índia sobre Washington cai.§!"
 RAJ_pakistan_ultimatum_accept_tt:0 "§YA Índia anexa o Paquistão por completo, obtendo controle total de seu território e núcleos sobre seus antigos estados.§!"
 RAJ_pakistan_ultimatum_reject_tt:0 "§YA Índia prepara, em vez disso, um objetivo de guerra para conquistar o Paquistão pela força.§!"
