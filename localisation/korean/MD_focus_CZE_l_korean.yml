 CZE_SLO_military_sector_close: "§G군사 부문 폐쇄§!"
 CZE_SLO_military_sector_organize_new_training_program: "새 훈련 프로그램 편성"
 CZE_SLO_military_sector_mutual_officer_trainings: "장교 상호 훈련"
 CZE_SLO_military_sector_decrease_opinion_mission: "§R군사 지지 하락§!"
 CZE_SLO_military_sector_real_enemy_is_outside_our_borders: "진짜 적은 국경 밖에 있다"
 CZE_SLO_military_sector_organize_military_structure: "군 구조 재편성"
 CZE_SLO_slovakian_nuclear_research: "체코-슬로바키아 원자력 연구"
 CZE_SLO_slovakian_nuclear_research_desc: "체코 공화국 지역의 원자로는 슬로바키아의 것보다 훨씬 뛰어납니다. 슬로바키아 원자로를 체코 기술에 맞게 통합하도록 돕기 위해, 체코 원자력 과학자들이 슬로바키아인들과 함께 중요한 업그레이드를 위한 원자로 준비에 나설 것입니다."
 CZE_SLO_improved_slovakian_nuclear_fuel: "개량된 슬로바키아 핵연료"
 CZE_SLO_begin_construction_of_new_nuclear_reactor: "신규 원자로 건설 착수"
 CZE_SLO_event.1.t: "상호 보장 제안"
 CZE_SLO_event.1.d: "이웃 정부는 두 나라 사이의 공동 관계를 이어 가려 하며, 체코슬로바키아 분리 이후에도 우리가 계속 친구로 남기를 바라고 있습니다. 그들은 독립 보장이 포함된 불가침 조약을 제안하고 있습니다."
 CZE_SLO_event.1.a: "물론이지"
 CZE_SLO_event.1.b: "우리에게는 다른 계획이 있다"
 CZE_SLO_event.2.t: "나토 협력 프로그램 확대"
 CZE_SLO_event.2.d: "우리 두 나라는 마침내 어느 편에 설지 결정해야 합니다. 나토는 군사 훈련과 지역 전체의 보호주의에 초점을 맞추고 있지만, 유럽은 현재 (거의) 평화로운 대륙이므로 군대보다는 경찰력에 더 투자하는 것이 낫습니다."
 CZE_SLO_event.2.a: "우리 군은 더 강해져야 한다"
 CZE_SLO_event.2.b: "오늘날에는 경찰력이 더 중요하다"
 CZE_SLO_event.3.t: "[FROM.GetName]의 군사 훈련 강화 선택"
 CZE_SLO_event.3.d: "[FROM.GetName]은(는) 나토 국가들과의 통합을 더 강화하기로 결정했으며, 전쟁에 더 잘 대비하기 위해 군사 훈련의 강도를 높이려 합니다. 우리도 이 교리를 택해야 할까요?"
 CZE_SLO_event.3.a: "우리도 함께한다"
 CZE_SLO_event.3.b: "말도 안 된다"
 CZE_SLO_event.4.t: "[FROM.GetName]의 경찰력 지원 강화 선택"
 CZE_SLO_event.4.d: "[FROM.GetName]은(는) 다른 나토 국가들과의 통합 대신 경찰력을 발전시키기로 결정했습니다. 그들에게는 오지 않을지도 모를 전쟁에 대한 준비보다 내부 안보가 더 중요합니다. 우리도 그들과 함께해야 할까요?"
 CZE_SLO_event.4.a: "우리도 함께한다"
 CZE_SLO_event.4.b: "말도 안 된다"
 CZE_SLO_event.5.t: "체코슬로바키아 붕괴!"
 CZE_SLO_event.5.d: "최근 재건된 체코슬로바키아는 강제 통합 이후 커진 긴장을 감당하지 못했습니다. [CZE.GetName]과(와) [SLO.GetName]은(는) 다시 두 독립 국가가 되었고, 통합을 강요한 나라는 이제 심각한 경제 붕괴에 시달리고 있습니다."
 CZE_SLO_event.5.a: "..."
 CZE_SLO_event.5.b: "어리석은 생각이었다"
 CZE_SLO_event.6.t: "체코슬로바키아 재건 제안!"
 CZE_SLO_event.6.d: "이웃 나라가 주도권을 잡고 체코슬로바키아 복원이라는 우리의 공동 목표를 실현하기로 결정했습니다. 그들의 정부는 모든 것을 준비해 두었기 때문에 새로 구성되는 의회와 국가 구조를 자신들이 이끌겠다고 말하지만, 이 조치로 양국 모두 큰 이익을 얻을 것이라고 합니다. 우리가 서류에 서명하면 체코슬로바키아가 복원되고 우리 두 민족은 다시 하나의 깃발 아래 함께하게 됩니다."
 CZE_SLO_event.6.a: "이날을 오래도록 기다려 왔다!"
 CZE_SLO_event.6.b: "아니, 우리는 절대 그 길로 돌아가지 않는다"
 CZE_SLO_event.7.t: "지도에 돌아온 체코슬로바키아!"
 CZE_SLO_event.7.d: "체코 공화국과 슬로바키아는 다시 하나의 깃발 아래 통합하기로 결정했습니다. 공산 정권이 무너진 뒤 사라졌던 나라가 이제 다시 지도 위에 돌아왔습니다."
 CZE_SLO_event.7.a: "그 긴 세월이 지나서..."
 CZE_SLO_event.7.b: "우와아아아!!!!!"
 CZE_SLO_event.8.t: "[FROM.GetName]의 통합 거부"
 CZE_SLO_event.8.d: "[FROM.GetName]은(는) 현 시점에서 통합하지 않기로 결정했습니다. 체코 공화국과 슬로바키아는 다른 정치인이 두 나라를 다시 통합하려 시도할 때까지 분리된 채로 남을 것입니다."
 CZE_SLO_event.8.a: "대가를 치르게 될 것이다..."
 CZE_SLO_event.8.b: "우리가 할 수 있는 일은 없다"
 CZE_SLO_event.9.t: "체코슬로바키아, [701.GetName] 요구"
 CZE_SLO_event.9.d: "체코슬로바키아는 비교적 오래된 나라입니다. [701.GetName]은(는) 제1차 세계 대전 후 독립을 얻었을 때 원래 그들에게 속해 있었습니다. 그들은 제2차 세계 대전 후 이 영토를 잃었고 이곳은 소련에 편입되었습니다. 지금은 우리 영토이지만, 이 작은 땅 조각은 또 한 번의 전쟁을 치를 가치가 없을지도 모릅니다."
 CZE_SLO_event.9.a: "그들의 것이다"
 CZE_SLO_event.9.b: "아닌데."
 CZE_SLO_event.10.t: "체코슬로바키아, [701.GetName] 수복!"
 CZE_SLO_event.10.d: "체코슬로바키아가 수십 년 전 강제로 빼앗겼던 옛 영토의 통제권을 되찾았습니다. 이것이 그들의 요구의 시작일 뿐이라고 말하는 이들도 있지만, 현재로서는 그다지 해로워 보이지 않습니다..."
 CZE_SLO_event.10.a: "완벽하다"
 CZE_SLO_event.10.b: "알겠어?"
 CZE_SLO_event.11.t: "[FROM.GetName]의 거부!"
 CZE_SLO_event.11.d: "[FROM.GetName]은(는) 오래전에 잃은 우리의 주 [701.GetName]을(를) 우리 영토로 이전해 달라는 제안을 거부했습니다. 체코슬로바키아와 [FROM.GetName] 사이의 긴장은 매우 높으며, 이 작은 분쟁이 전면전으로 번질 수도 있습니다."
 CZE_SLO_event.11.a: "아직 끝나지 않았다!"
 CZE_Army_2000.01.t: "체코 APC 차량 현대화"
 CZE_Army_2000.01.d: "체코군의 현대화가 시급한 과제가 되었으며, 노후화된 장갑차(APC)를 교체해야 합니다. 이제 이웃 나라에서 최신 모델을 조달할지, 아니면 독자 설계를 개발할지 결정해야 합니다. 각 선택에는 저마다의 전략적 이점과 절충점이 따릅니다. 오스트리아의 군사 기술에 의존해야 할까요, 더 긴밀한 지역 파트너십을 위해 폴란드로 눈을 돌려야 할까요, 아니면 자체 국내 생산 능력을 개발하는 데 투자해야 할까요?"
