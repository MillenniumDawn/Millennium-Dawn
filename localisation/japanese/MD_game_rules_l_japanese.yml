 RULE_DISABLE_COUP_CONTEST: "クーデター競争イベントを無効化"
 RULE_YES_DISABLE_COUP_CONTEST_DESC: "一連の§Hクーデター競争§!イベントを§R無効化§!する。主要な影響行使国家は、行使先でクーデターが発生しても、通知を§R受け取らず§!、対応する選択肢も表示されない。AIによる代理戦争の激化を避けたい場合に。"
 RULE_NO_DISABLE_COUP_CONTEST_DESC: "§GEnables§! the §Hcoup contest§! event chain. When a coup succeeds in a country, the largest foreign influencers (and the 2nd largest if over §H20%§!) are notified and get a choice of how to respond: denounce, sanction, back the opposition, or militarily intervene. Civil wars following a coup also trigger a matching event for backing the old regime."
 RULE_REMOVE_MICRO_STATES_TINY: "ミニ国家"
 RULE_REMOVE_MICRO_STATES_TINY_DESC: "ごく小規模な国（モナコ、サンマリノなど）とカリブ海の島国のみを削除する。"
 RULE_REMOVE_MICRO_STATES_SMALLER: "小国"
 RULE_REMOVE_MICRO_STATES_SMALLER_DESC: "ブータン、ガンビア、ジブチといった小国や、それより少し大きな国々を削除する。"
 RULE_REMOVE_MICRO_STATES_INSIGNIFICANT: "さらなる削除"
 RULE_REMOVE_MICRO_STATES_INSIGNIFICANT_DESC: "パフォーマンスを最大限に高めるため、すべての小国に加え、ラオス、スリナム、ガイアナのような国々も削除する。"
 RULE_ENABLE_RESOURCE_STORAGE_SYSTEM: "§Y資源貯蔵機能§!を有効化"
 RULE_OPTION_ENABLE_RESOURCE_STORAGE_SYSTEM: "§Y資源貯蔵機能§!を有効化する。これにより、原材料を保管できるようになる。1日の間に大幅なラグが発生する場合は、これを無効化したほうがいい。無効化しても、重要なデータが失われることはない。"
 RULE_OPTION_DISABLE_RESOURCE_STORAGE_SYSTEM: "原材料を保管できる§Y資源貯蔵機能§!を無効化する。"
 RULE_CARRIER_ONLY_RAIDS: "空母限定の襲撃の有効化"
 RULE_CARRIER_ONLY_RAIDS_NO: "空母限定の襲撃を無効にする。これは空母からの襲撃の実施自体には影響しない。この設定は空母から航空基地へと移動する空母航空隊に関して頻繁に問題が発生している場合に有効である。"
 RULE_CARRIER_ONLY_RAIDS_YES: "空母限定の襲撃を有効にする。これは、空母のみの発進地点を許可する他の襲撃と同様のものである。"
 RULE_RAID_DOCTRINE_REACH: "外国介入法による襲撃制限の有効化"
 RULE_RAID_DOCTRINE_REACH_NO: "外国介入法による襲撃対象の制限を無効にする。プレイヤー（およびAI）は、外国介入法に関係なく、視認可能なあらゆるターゲットに対して襲撃を準備できる。戦争、意見、および陣営による制限は引き続き適用される。"
 RULE_RAID_DOCTRINE_REACH_YES: "デフォルト。外国介入法は襲撃の対象を制限する。§Y孤立主義§! と§Y専守防衛§! は平時における襲撃を行えない。§Y限定的介入§! は襲撃対象が隣国のみとなり、§Y地域的介入§! は襲撃対象が同一大陸内のみとなる。この制限は平時のみであり、戦争中は常に無効となる。"
 RULE_ALLOW_CPD_AI_OFFERS: "AIによる条件付き和平協定を許可"
 RULE_OPTION_CPD_AI_OFFERS_YES_DESC: "戦争中のAI国家は、進行中の紛争を定期的に評価し、戦争に勝てないと判断した場合や膠着状態にあると判断した場合に、§Y条件付き和平協定§!を提案できるようになる。また、宗主国は、制限対象となっている傀儡国の代わりに交渉を行うことになる。"
 RULE_OPTION_CPD_AI_OFFERS_NO_DESC: "AIが独自に§Y条件付き和平協定§!を開始することを禁止する。 プレイヤーは、引き続き外交行動を通じて手動で協定を提案することができる。"
