 ALG_deep_state_category: "Assuntos do Estado Profundo"
 ALG_assess_deep_state: "Avaliar a Influência do Estado Profundo"
 ALG_reduce_deep_state: "Reduzir a Influência do Estado Profundo"
 ALG_reduce_deep_state_desc: "Tomar medidas sistemáticas para reduzir a influência do establishment militar nos assuntos civis.\n\n§GEfeito: Poder do Estado Profundo -5§!\n§RRisco: Estabilidade -4%, possível reação adversa em níveis altos de poder§!"
 ALG_purge_military_command: "Expurgar o Comando Militar"
 ALG_purge_military_command_desc: "Uma medida drástica e perigosa para remover generais comprometidos e reafirmar o controle civil. Isso perturbará severamente as operações militares.\n\n§GEfeito: Poder do Estado Profundo -10§!\n§RPenalidades Severas:\n• Estabilidade -10%\n• £army_experience Experiência do Exército -50\n• Organização do Exército -10% durante o expurgo§!\n\n§YTempo de espera: 1 ano§!"
 ALG_cooperate_with_military: "Cooperar com a Liderança Militar"
 ALG_cooperate_with_military_desc: "Trabalhar com os generais para manter a estabilidade. Essa abordagem pragmática traz benefícios de curto prazo, mas fortalece a posição deles.\n\n§REfeito: Poder do Estado Profundo +3§!\n§GBenefícios:\n•  Estabilidade +3%\n• £political_power Poder Político +50§!\n\n§YIndisponível se o Poder do Estado Profundo > 25§!"
 ALG_reform_intelligence_services: "Reformar os Serviços de Inteligência"
 ALG_reform_intelligence_services_desc: "Reestruturar as agências de inteligência (DRS/DSS) para garantir a devida supervisão civil e responsabilização.\n\n§GEfeito: Poder do Estado Profundo -7§!\n§RCusto:\n• Estabilidade -5%\n• £political_power Poder Político -10% durante a reforma\n• Remove capacidades de vigilância§!\n\n§YTempo de espera: 180 dias§!"
 ALG_appoint_loyal_officers: "Nomear Oficiais Leais"
 ALG_appoint_loyal_officers_desc: "Colocar oficiais leais ao governo civil em posições militares-chave, deslocando gradualmente o equilíbrio de poder.\n\n§GEfeito: Poder do Estado Profundo -3§!\n§RCusto: £army_experience Experiência do Exército -25§!\n\n§YTempo de espera: 120 dias§!"
 ALG_declare_emergency: "Declarar Estado de Emergência"
 ALG_declare_emergency_desc: "Invocar poderes de emergência para congelar temporariamente as atividades do estado profundo. Uma medida desesperada para tempos desesperados.\n\n§YEfeito: Crescimento do Estado Profundo congelado por 180 dias§!\n§RCusto:\n• Estabilidade -8%\n• Adiciona o espírito nacional Estado de Emergência§!\n\n§YDisponível apenas quando o Poder do Estado Profundo > 22§!"
 ALG_negotiate_with_generals: "Negociar com os Generais"
 ALG_negotiate_with_generals_desc: "Abrir negociações secretas, por canais paralelos, com a liderança militar para encontrar um compromisso político.\n\n§YResultados (aleatórios):§!\n§G50%: Sucesso - Estado Profundo -4, Estabilidade +2%§!\n§Y30%: Parcial - Estado Profundo -2§!\n§R20%: Fracasso - Estado Profundo +2, Estabilidade -3%§!\n\n§YTempo de espera: 180 dias§!"
