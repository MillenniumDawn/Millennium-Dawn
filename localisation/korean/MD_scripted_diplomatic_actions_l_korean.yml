 REVOKE_CIV_GNSS_ACCESS_ACTION_DESC: "우리의 민간 위성 위치 파악 네트워크에 대한 그들의 접근을 종료하고 모든 업링크 자격 증명을 철회합니다. 이 조치는 데이터 공유 프로토콜을 차단하고, 우리 시스템과의 통합을 비활성화하며, 그들의 항법, 물류 및 응급 대응 능력을 심각하게 방해할 수 있습니다. 이러한 조치는 관계 악화와 그들의 운영에 실질적인 결과를 초래함을 나타냅니다. 그들은 우리의 §Y민간용 위성항법시스템 위성 네트워크§!에 대한 현재 접근 권한을 잃게 됩니다."
