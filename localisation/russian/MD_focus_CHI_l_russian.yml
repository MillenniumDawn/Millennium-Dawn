 CHI_Normalise_the_Hermit: "Normalize the Hermit"
 CHI_Normalise_the_Hermit_desc: "По мере того как реформы укореняются, мы содействуем официальной реинтеграции Северной Кореи в региональные экономические и дипломатические структуры, положив конец десятилетиям изоляции и позиционируя себя в качестве архитекторов открытости Пхеньяна."
 CHI_Nuclear_Insurance: "Nuclear Insurance"
 CHI_Nuclear_Insurance_desc: "Мы фактически признаем ядерный арсенал Северной Кореи в качестве средства сдерживания, а не как угрозу. Признавая Пхеньян ядерной державой, мы обеспечиваем себе гарантию на случай краха режима, хотя и подвергаемся международному осуждению."
 CHI_operation_new_dawn_desc: "Начать решительную операцию сил специального назначения против руководства Пхеньяна. От того, как будут действовать сети Чанга и «принцев», будет зависеть, закончится ли это чистым переворотом, гражданской войной или катастрофой."
 CHI_palm_and_fingers_doctrine: "Palm and Fingers Doctrine"
 CHI_palm_and_fingers_doctrine_desc: "Тибет — это ладонь. Ладакх, Непал, Сикким, Бутан и Аруначал — это пальцы. Стратегическая доктрина требует, чтобы все пять были под нашим контролем."
 CHI_pla_divestiture_completion: "PLA Divestiture Completion"
 CHI_pla_divestiture_completion_desc: "От НОАК уже давно требуют избавиться от своей разветвленной коммерческой империи, включающей отели, фармацевтические компании и торговые предприятия. Завершение этого процесса позволит вооружённым силам вновь сосредоточиться исключительно на своих основных задачах и устранит один из основных источников коррупции среди офицеров. Армия, которая управляет отелями, не думает о войне."
 CHI_Pyongyang_Pivot: "The Pyongyang Pivot"
 CHI_Pyongyang_Pivot_desc: "Вместо того чтобы ужесточать режим, Китай поощряет осторожную экономическую либерализацию по образцу реформ Дэн Сяопина. Более процветающая Северная Корея стала бы более стабильным соседом и более сговорчивым партнером."
 CHI_Rare_Earth_Leverage: "Rare Earth Leverage"
 CHI_Rare_Earth_Leverage_desc: "Передовые отрасли Южной Кореи — электроника и производство полупроводников — в значительной степени зависят от экспорта редкоземельных элементов из Китая. Используя эту зависимость, мы можем углубить экономические связи и усилить своё влияние на внешнеполитические решения Сеула."
 CHI_Rason_SEZ_Expansion: "Rason SEZ Expansion"
 CHI_Rason_SEZ_Expansion_desc: "Специальная экономическая зона Расон, расположенная на северо-восточном побережье Северной Кореи, представляет собой экспериментальную площадку для экономической модернизации. Китайские инвестиции могут обеспечить доступ к порту и поток ресурсов, одновременно продемонстрировав жизнеспособность постепенных реформ."
 CHI_Sanctions_Evasion: "Sanctions Evasion"
 CHI_Sanctions_Evasion_desc: "Публично поддерживая международные санкции, мы можем незаметно допускать продолжение трансграничной торговли и финансовых потоков. Это усиливает зависимость Северной Кореи от Китая, позволяя при этом сохранять возможность правдоподобного отрицания, хотя раскрытие этой информации нанесло бы ущерб отношениям с Западом."
 CHI_sco_balance_display: "$CHI_sco_balance$: [?CHI_sco_balance]"
 CHI_sco_cohesion_display: "$CHI_sco_cohesion$: [?CHI_sco_cohesion]"
 CHI_scs_island_construction_campaign: "Island Construction Campaign"
 CHI_scs_island_construction_campaign_desc: "Начать реализацию многолетней программы дноуглубительных работ и строительства на территории архипелага Спратли. Подводные рифы преобразуются в искусственные острова, способные принимать постоянные сооружения, что позволяет расширить фактическую административную зону, на которую распространяются территориальные претензии Китая, на тысячи квадратных километров."
 CHI_shanghai_clique_ascendant_desc: "Свет Бунда озаряет все министерства. Бухгалтеры из Пудуна теперь заседают в Государственном совете. Эта сеть простирается дальше, чем сама доктрина."
 CHI_shanghai_clique_leaning_desc: "Сети «Бунда» имеют влияние в каждом министерстве. Провинциальные делегаты делают ставку на Пудун."
 CHI_Six_Party_Talks: "Six-Party Talks"
 CHI_Six_Party_Talks_desc: "В шестисторонних переговорах принимают участие Китай, США, Россия, Япония и обе Кореи, которые ведут переговоры по урегулированию северокорейского ядерного кризиса. Выступая в качестве принимающей стороны этих переговоров, мы сможем занять позицию незаменимого посредника и укрепить отношения со всеми вовлеченными сторонами."
 CHI_technocratic_consolidation_desc: "Исследовательский отдел Государственного совета — это и есть страна. Пятилетние планы составляются до заседаний Политбюро, а не после них."
 chi_the_one_china_policy: "The One China Policy"
 CHI_water_pricing_reform: "Industrial Water Pricing Reform"
 CHI_water_pricing_reform_desc: "Вместо мер, направленных на регулирование предложения, для сокращения объема отходов используются ценовые механизмы. Тарифы на промышленную воду резко повышаются, что вынуждает предприятия тяжелой промышленности внедрять технологии повторного использования воды и перемещаться в районы с относительным преимуществом в водоснабжении. Фермеры сопротивляются связанному с этим росту затрат."
 CHI_Yalu_Defense_Pact: "Yalu Defense Pact"
 CHI_Yalu_Defense_Pact_desc: "Официальное соглашение об обороне вдоль реки Ялу увязывает наше военное планирование с планами Северной Кореи, обеспечивая нам гарантированный доступ и предусматривая взаимную оборону."
 CHI_youth_league_leaning_desc: "Выпускники университета Туан занимают должности заместителей в половине провинций. Баланс влияния меняется — незаметно и неуклонно."
 CHI_youth_league_resurgent_desc: "Каждый депутат провинциального собрания в возрасте до пятидесяти лет прошел путь через «Туан». Состав группы сформирован. Ниже приводится повестка дня."
 paektu_doctrine_southern: "Paektu Doctrine  Southern Warning"
 uighur_threat_display: "$uighur_threat$: [?uighur_threat]"
 CHI_back_princeling_network: "Back the Princeling Networks"
 CHI_back_princeling_network_desc: "Направить поддержку на сыновей революционной элиты и представителей шанхайского истеблишмента, сместив баланс сил в пользу фракции «принцев»."
 CHI_promote_youth_league: "Promote Youth League Cadres"
 CHI_promote_youth_league_desc: "На руководящие посты продвинулись чиновники, прошедшие через Коммунистический союз молодежи, что привело к сдвигу баланса сил в пользу фракции «Туанпай»."
 CHI_SAR_one_china_framework: "One China Framework"
 CHI_SAR_one_china_framework_desc: "Пекин вновь подтверждает конституционную основу своей власти над всеми специальными административными районами и территориями. Эта система обеспечивает единое политическое руководство со стороны центра, признавая при этом особенности административного устройства каждого региона."
 CHI_SAR_liaison_office_reform: "Liaison Office Reform"
 CHI_SAR_liaison_office_reform_desc: "Государственный совет реорганизует свои представительства в специальных административных районах, превращая их в более интегрированную координационную сеть. Оптимизированные каналы связи между Пекином и специальными административными районами позволяют ускорить реализацию политики и снизить административные барьеры."
 CHI_SAR_national_security_framework: "National Security Architecture"
 CHI_SAR_national_security_framework_desc: "Единый аппарат национальной безопасности распространяется на все территории специальных административных районов. Координация действий гарнизонов Народно-освободительной армии, управлений государственной безопасности и местных полицейских сил оформляется в рамках централизованного надзора."
 CHI_SAR_two_systems_commitment: "Commitment to Two Systems"
 CHI_SAR_two_systems_commitment_desc: "Пекин официально подтверждает принцип «одна страна — две системы» в отношении всех соответствующих критериям специальных административных районов. В рамках конституционного устройства гарантируется высокая степень автономии, что свидетельствует о предпочтении компромисса, а не интеграции."
 CHI_SAR_research_sharing: "SAR Research Cooperation"
 CHI_SAR_research_sharing_desc: "Пекин запускает совместные исследовательские программы, объединяющие университеты и государственные лаборатории материкового Китая с научно-исследовательскими учреждениями специальных административных районов. Эта инициатива способствует укреплению академических и технологических связей, а также расширению общего научно-исследовательского потенциала Китая."
 CHI_SAR_military_corporation_sharing: "Defence Industry Integration"
 CHI_SAR_military_corporation_sharing_desc: "Оборонные подрядчики и инжиниринговые компании, базирующиеся в регионе САР, включены в систему закупок материкового Китая. Единые производственные стандарты и цепочки поставок способствуют увеличению производственных мощностей для Народно-освободительной армии."
 CHI_SAR_military_corporation_sharing_mio_tt: "Special Administrative Regions gain access to Chinese military-industrial organizations"
 CHI_SAR_one_system_declaration: "One System Declaration"
 CHI_SAR_one_system_declaration_desc: "Государственный совет сигнализирует о смене курса в сторону более тесной интеграции системы управления САР с системами материковой части страны. В ближайшие годы отдельные правовые и административные рамки будут постепенно гармонизированы с системами Китайской Народной Республики."
 CHI_SAR_han_superiority: "Doctrine of Han Primacy"
 CHI_SAR_han_superiority_desc: "Пекин отказывается от модели многонационального государства в пользу единой национальной идентичности, в основе которой лежит ханьское большинство. В соответствии с «этнической политикой второго поколения», разработанной такими учёными, как Ху Анган и Ху Ляньхэ, автономия на этнической основе постепенно сворачивается, а процесс ассимиляции во всех регионах ускоряется."
 CHI_HKG_greater_bay_area: "Greater Bay Area Initiative"
 CHI_HKG_greater_bay_area_desc: "Пекин и Гонконг совместно запускают проект «Большой залив Гуандун-Гонконг-Макао», объединяющий одиннадцать городов в единый инновационно-финансовый коридор. Этот проект является самой амбициозной программой региональной интеграции в Китае со времен создания специальной экономической зоны Шэньчжэнь."
 CHI_HKG_financial_integration: "Financial System Integration"
 CHI_HKG_financial_integration_desc: "Механизмы трансграничного движения капитала расширяются в рамках программ Stock Connect и Bond Connect. Роль Гонконга как главного офшорного центра обращения юаня официально закрепляется, углубляя взаимозависимость с финансовыми рынками материкового Китая."
 CHI_HKG_express_rail_link: "Express Rail Link"
 CHI_HKG_express_rail_link_desc: "Завершено строительство скоростной железнодорожной линии «Гуанчжоу-Шэньчжэнь-Гонконг», которая напрямую соединяет Гонконг с сетью высокоскоростных железных дорог Китая. Время в пути между Гонконгом и крупными городами материкового Китая значительно сократилось, что способствует ускорению пассажиропотока и торговли."
 CHI_HKG_individual_visit_scheme: "Individual Visit Scheme"
 CHI_HKG_individual_visit_scheme_desc: "Пекин расширяет программу индивидуальных поездок, позволяя жителям новых городов материкового Китая посещать Гонконг без ограничений, связанных с групповыми турами. Приток туристов и покупателей с материка оказывает существенное стимулирующее воздействие на секторы розничной торговли и услуг Гонконга."
 CHI_HKG_shenzhen_hk_stock_connect: "Shenzhen-Hong Kong Stock Connect"
 CHI_HKG_shenzhen_hk_stock_connect_desc: "Программа взаимного доступа к рынкам связывает фондовые биржи Гонконга и Шэньчжэня, позволяя инвесторам обеих сторон торговать акциями компаний, зарегистрированных на бирже другой стороны. Эта схема еще больше укрепляет незаменимую роль Гонконга в качестве «ворот» для трансграничных потоков капитала."
 CHI_HKG_electoral_reform: "Electoral System Reform"
 CHI_HKG_electoral_reform_desc: "Пекин кардинально пересматривает систему выборов в Законодательный совет Гонконга, сокращая количество мест, избираемых прямым голосованием, и вводя механизм проверки кандидатов, чтобы гарантировать, что на выборы будут выдвигаться только «патриоты». Эта реформа окончательно лишает продемократическую оппозицию политической власти."
 CHI_HKG_media_freedom: "Press Freedom Safeguards"
 CHI_HKG_media_freedom_desc: "Под давлением гражданского общества Пекин согласился закрепить в законодательстве гарантии редакционной независимости в Гонконге. Международные медиаорганизации расценивают эту гарантию как сигнал о том, что модель «двух систем» будет соблюдаться до 2047 года."
 CHI_HKG_censorship: "Internet and Media Censorship"
 CHI_HKG_censorship_desc: "Пекин предписывает властям Гонконга привести городские нормы регулирования интернета и телерадиовещания в соответствие со стандартами материкового Китая. Веб-сайты, на которых размещается контент, считающийся политически чувствительным, блокируются, а редакторы крупных газет подвергаются давлению с целью заставить их прибегать к самоцензуре."
 CHI_HKG_moral_national_education: "Moral and National Education"
 CHI_HKG_moral_national_education_desc: "В школах Гонконга вводится новая обязательная национальная образовательная программа, в которой особое внимание уделяется лояльности Коммунистической партии и представлению истории Китая с точки зрения материкового Китая. Эта политика вызывает значительное недовольство общественности, но реализуется в соответствии с указаниями центральных властей."
 CHI_HKG_national_security_law: "Article 23 National Security Law"
 CHI_HKG_national_security_law_desc: "Гонконг принимает закон о национальной безопасности в соответствии со статьёй 23 «Основного закона», который квалифицирует как уголовные преступления сепаратизм, подрывную деятельность, терроризм и сговор с иностранными державами. Принятие этого закона знаменует собой фактический конец самобытной политической культуры города."
 CHI_HKG_lok_ma_chau_loop: "Lok Ma Chau Loop Development"
 CHI_HKG_lok_ma_chau_loop_desc: "На территории «Лок Ма Чау Луп» — участке земли на границе с Шэньчжэнем, предназначенном для совместного развития, — создана специализированная зона инноваций и технологий. Парк призван привлечь научно-исследовательские учреждения и технологические компании, заинтересованные в близости как к Гонконгу, так и к материковому Китаю."
 CHI_HKG_2030_study: "Hong Kong 2030+ Strategic Study"
 CHI_HKG_2030_study_desc: "Правительство Гонконга опубликовало свою долгосрочную стратегию территориального планирования, в которой определены участки для новых зон застройки, транспортных коридоров и промышленных зон. В рамках данного исследования физическое развитие Гонконга рассматривается в контексте интеграции в регион «Большой залив»."
 CHI_HKG_palace_museum: "Hong Kong Palace Museum"
 CHI_HKG_palace_museum_desc: "В культурном районе Западный Коулун в Гонконге открылся филиал Пекинского дворцового музея, в котором представлены экспонаты, предоставленные на временное хранение из коллекции Запретного города. Этот проект позиционируется как культурный мост между Гонконгом и материковым Китаем и привлекает значительное внимание международной общественности."
 CHI_HKG_zhuhai_macau_bridge: "Hong Kong-Zhuhai-Macao Bridge"
 CHI_HKG_zhuhai_macau_bridge_desc: "Завершено строительство самой длинной в мире системы мостов и туннелей, пересекающей устье реки Чжуцзян и соединяющей Гонконг, Чжухай и Макао. Это сооружение значительно сокращает время наземного путешествия между этими тремя городами и служит физической основой интеграции «Большого залива»."
 CHI_HKG_lok_ma_chau_station: "Lok Ma Chau Station Expansion"
 CHI_HKG_lok_ma_chau_station_desc: "Пограничный пункт «Лок Ма Чау» был модернизирован за счет расширения инфраструктуры для пассажиров и грузов, что позволило снизить загруженность одного из самых оживленных наземных пунктов въезда в Гонконг. Повышение пропускной способности логистической инфраструктуры способствует ускорению трансграничной торговли и пассажиропотока."
 CHI_SAR_integrate_HKG: "Hong Kong Integration"
 CHI_SAR_integrate_HKG_desc: "В связи с полным приведением политической и экономической систем Гонконга в соответствие с системами материкового Китая Пекин официально отменяет отдельный административный статус этого специального административного района. Бывшая колония становится муниципалитетом, находящимся под прямым управлением Китайской Народной Республики."
 CHI_MAC_pearl_river_delta: "Pearl River Delta Integration"
 CHI_MAC_pearl_river_delta_desc: "Макао официально включено в состав экономической зоны дельты реки Чжуцзян, при этом инвестиции в инфраструктуру направлены на преодоление его экономической изоляции. Мост «Гонконг-Чжухай-Макао» становится основой новой трансграничной транспортной сети."
 CHI_MAC_lotus_flower_economy: "Lotus Flower Economy"
 CHI_MAC_lotus_flower_economy_desc: "Макао запускает инициативу по ребрендингу экономики, основанную на самобытной идентичности территории как португальско-китайского специального административного района. Вместо того чтобы ориентироваться на какой-либо отдельный сектор, эта стратегия позиционирует Макао как «мировой центр туризма и досуга» — бренд, который определяет все последующие усилия по диверсификации и соответствует концепции Пекина в отношении региона «Большой залив»."
 CHI_MAC_financial_services: "Offshore Financial Services Hub"
 CHI_MAC_financial_services_desc: "Нормативно-правовая база Макао обновлена с целью привлечения офшорных банковских операций, выпуска облигаций и расчетов в юанях. Португальское правовое наследие территории позиционируется как преимущество для португалоязычных инвесторов, стремящихся выйти на рынок материкового Китая."
 CHI_MAC_infrastructure_link: "Cross-Border Infrastructure Link"
 CHI_MAC_infrastructure_link_desc: "Новый пограничный пункт пропуска и продолжение линии легкорельсового транспорта связывают зону развития Котай в Макао напрямую с зоной углубленного сотрудничества Гуандун-Макао на острове Хэнцинь. Этот проект обеспечивает физическую интеграцию экономического пространства Макао с материком."
 CHI_MAC_guangdong_integration: "Guangdong Integration Accord"
 CHI_MAC_guangdong_integration_desc: "Соглашение о всестороннем сотрудничестве с провинцией Гуандун обеспечивает приведение планирования, законодательства и финансового регулирования Макао в соответствие со стандартами материкового Китая. Официальные лица называют это соглашение образцом мирного сближения систем управления Особым административным районом и материковым Китаем."
 CHI_SAR_integrate_MAC: "Macao Full Integration"
 CHI_SAR_integrate_MAC_desc: "После десятилетий углубляющейся экономической и правовой гармонизации статус САР Макао утрачивается. Территория входит в состав административной системы провинции Гуандун, что знаменует завершение последнего этапа передачи власти, начатого в 1999 году."
 CHI_MAC_cultural_autonomy_push: "Portuguese Heritage Movement"
 CHI_MAC_cultural_autonomy_push_desc: "Гражданские организации проводят кампанию за сохранение самобытной португальско-китайской культурной идентичности Макао в условиях ускоряющейся интеграции с материковым Китаем. Среди их требований — законодательная защита португальского языка, макаоской общины и уникального правового плюрализма территории."
 CHI_MAC_lusophone_connections: "Lusophone Gateway Strategy"
 CHI_MAC_lusophone_connections_desc: "Макао позиционирует себя в качестве незаменимого моста между Китаем и португалоязычным миром, расширяя рамки своего Форума по экономическому и торговому сотрудничеству. Международное признание этой уникальной роли служит политическим аргументом в пользу сохранения высокой степени автономии."
 CHI_TIB_plateau_development: "Plateau Development Fund"
 CHI_TIB_plateau_development_desc: "Государственный совет запускает масштабную инвестиционную программу для Тибетского автономного района, направленную на развитие инфраструктуры, жилищного строительства и сферы общественных услуг. Эта программа повторяет «Стратегию развития Запада», однако на внутреннем уровне позиционируется как инициатива по борьбе с бедностью."
 CHI_TIB_railway_modernization: "Qinghai-Tibet Railway Extension"
 CHI_TIB_railway_modernization_desc: "Утвержден второй этап строительства железной дороги Цинхай-Тибет, предусматривающий продление линии до Шигадзе и в конечном итоге до Ньингчи, расположенного недалеко от границы с Индией. Этот проект позволит уменьшить логистическую изоляцию Тибета и ускорить перемещение ханьских переселенцев и сил безопасности."
 CHI_TIB_release_falun_gong: "Falun Gong Amnesty"
 CHI_TIB_release_falun_gong_desc: "В рамках продуманного жеста открытости Пекин освобождает заключенных последователей «Фалуньгун» и ослабляет ограничения на религиозную деятельность этого движения в Тибетском автономном районе. Эта уступка вызывает осторожную одобрительную реакцию со стороны западных правительств и свидетельствует о более мягком подходе к религиозному инакомыслию."
 CHI_TIB_return_dalai_lama: "Return of the Dalai Lama"
 CHI_TIB_return_dalai_lama_desc: "После длительных закулисных переговоров Пекин и представители Далай-ламы достигли соглашения, позволяющего тибетскому духовному лидеру вернуться в Лхасу с церемониальным визитом. Это соглашение не предусматривает политической автономии, но вызывает значительную доброжелательность в столицах разных стран мира."
 CHI_TIB_sinification: "Patriotic Education Campaign"
 CHI_TIB_sinification_desc: "Партия запускает систематическую программу идеологического перевоспитания в тибетских монастырях и школах, требуя от учащихся осуждения Далай-ламы и клятвы верности родине. Эта кампания проводится по образцу инициативы «Жесткие меры» 1990-х годов и курируется специально направленными рабочими группами."
 CHI_TIB_autonomy_preservation: "Genuine Autonomy Framework"
 CHI_TIB_autonomy_preservation_desc: "В ответ на международное давление и повторяющиеся беспорядки Пекин начинает переговоры с представителями Далай-ламы о расширении культурной и религиозной автономии. Основой для переговоров, ведущихся по неформальным каналам, служат «Страсбургское предложение» и «подход „срединного пути“»."
 CHI_TIB_cultural_integration: "Sinicisation of Governance"
 CHI_TIB_cultural_integration_desc: "Чиновники из народности хан назначаются на руководящие должности в административных, судебных и силовых структурах по всему Тибету. Мандаринский язык заменяет тибетский в качестве языка государственного управления, а учебные программы во всех государственных школах стандартизируются в соответствии с программами материкового Китая."
 CHI_SAR_integrate_TIB: "Tibet Full Integration"
 CHI_SAR_integrate_TIB_desc: "После нейтрализации религиозной власти, полного приведения административных структур в соответствие и завершения демографических преобразований оставшийся статус Тибетского автономного района как специального административного района (САР) отменяется. Тибет вновь становится обычной провинцией, находящейся под прямым управлением центрального правительства."
 CHI_TIB_buddhist_cultural_zone: "Buddhist Cultural Preservation Zone"
 CHI_TIB_buddhist_cultural_zone_desc: "Вокруг дворца Потала и храма Джокханг создана специальная охранная зона, что означает ограниченное официальное признание тибетского буддизма в качестве объекта культурного наследия. Критики называют эту меру компромиссом, ориентированным на туристов, который не обеспечивает реальной религиозной свободы."
 CHI_TIB_silk_road_gateway: "Himalayan Silk Road Gateway"
 CHI_TIB_silk_road_gateway_desc: "Географическое положение Тибета на стыке южноазиатских коридоров инициативы «Пояс и путь» используется для привлечения инвестиций в приграничную инфраструктуру, гидроэнергетику и торговую логистику. Эта инициатива способствует интеграции экономики Тибета с рынками Непала и Южной Азии, одновременно усиливая его зависимость от материкового Китая."
 CHI_TIB_monastery_economy: "Monastery Economy"
 CHI_TIB_monastery_economy_desc: "Тибетским монастырским учреждениям, исторически являвшимся опорой региональной экономики, разрешено вести коммерческую деятельность в рамках специального административного района. Паломнический туризм, производство средств традиционной медицины и ремесленные отрасли приносят доход, который идет на поддержку как монастырей, так и местных общин."
 CHI_TIB_plateau_resources: "Plateau Mineral Survey"
 CHI_TIB_plateau_resources_desc: "Тибетский автономный район проводит собственное геологоразведочное исследование, в ходе которого на Тибетском нагорье обнаружены значительные месторождения лития, меди и хромита. Власти Тибетского автономного района ведут переговоры о механизмах распределения доходов, предусматривающих зачисление части доходов от добычи в региональный бюджет."
 CHI_ETK_corridor_investment: "Belt and Road Corridor Investment"
 CHI_ETK_corridor_investment_desc: "Синьцзян обозначен в качестве основного сухопутного транспортного узла в рамках инициативы «Пояс и путь», что привлекает огромные государственные инвестиции в развитие железнодорожной, трубопроводной и автомобильной инфраструктуры. Северная конечная точка Китайско-пакистанского экономического коридора в Кашгаре кардинально меняет экономическую географию региона."
 CHI_ETK_resource_extraction: "Energy and Mineral Extraction"
 CHI_ETK_resource_extraction_desc: "Запасы нефти и газа Таримской котловины увеличиваются в рамках государственной программы развития, в которой приоритетное внимание уделяется строительству трубопроводов и наращиванию нефтеперерабатывающих мощностей. Доля Синьцзяна в общенациональной добыче нефти значительно возрастает, хотя вопрос о перечислении доходов в центр по-прежнему вызывает недовольство."
 CHI_ETK_silk_road_commerce: "Silk Road Commerce Initiative"
 CHI_ETK_silk_road_commerce_desc: "Традиционные уйгурские торговые сети Синьцзяна официально включены в региональную торговую политику, в рамках которой предусмотрены льготные условия лицензирования для трансграничной торговли с республиками Центральной Азии. Эта политика возрождает историческую модель торговли, осуществлявшейся при посредничестве уйгуров, которая восходит к эпохе династии Тан."
 CHI_ETK_oilfield_development: "Tarim Basin Oilfield Development"
 CHI_ETK_oilfield_development_desc: "Правительство Синьцзянского автономного района ведет переговоры с национальными энергетическими компаниями о заключении соглашений о создании совместных предприятий по разведке в Таримском бассейне, обеспечивая себе беспрецедентную долю роялти от добычи для развития региональной инфраструктуры. Эти нефтяные месторождения входят в число крупнейших в Китае и служат основой финансовой независимости региона."
 CHI_ETK_strike_hard_campaign: "Strike Hard Campaign"
 CHI_ETK_strike_hard_campaign_desc: "Кампания «Жёсткий удар, максимальное давление», направленная против уйгурских сепаратистских сетей, возобновляется в беспрецедентном масштабе, включая цифровое наблюдение, массовые задержания и систематическое подавление религиозной практики. Международные правозащитные организации документируют многочисленные нарушения прав человека."
 CHI_ETK_education_centres: "Vocational Skills Education Centres"
 CHI_ETK_education_centres_desc: "По всему Синьцзяну создана сеть внесудебных центров содержания под стражей, официально именуемых «центрами профессионального образования и подготовки». По всему региону развернута комплексная система цифрового наблюдения, включающая технологии распознавания лиц, базы данных ДНК и мониторинг смартфонов."
 CHI_ETK_total_survaillance_infrastructure: "Total Surveillance Infrastructure"
 CHI_ETK_total_survaillance_infrastructure_desc: "По всему Синьцзяну создана региональная сеть наблюдения, объединяющая камеры с функцией распознавания лиц, биометрические контрольно-пропускные пункты и обязательное программное обеспечение для мониторинга смартфонов. Эта система обеспечивает властям практически полный контроль за передвижениями населения и его деятельностью в Интернете."
 CHI_SAR_integrate_ETK: "Xinjiang Full Integration"
 CHI_SAR_integrate_ETK_desc: "После практически полного подавления сепаратистской деятельности и ликвидации традиционных уйгурских социальных структур административная структура Синьцзянского автономного района была упразднена. Регион был реорганизован в рамках стандартной провинциальной системы управления без каких-либо положений об особой этнической автономии."
 CHI_ETK_autonomy_statute: "Xinjiang Autonomy Statute"
 CHI_ETK_autonomy_statute_desc: "Новый устав региональной автономии предоставляет мусульманским общинам Синьцзяна официальные права на отправление религиозных обрядов, образование на уйгурском языке и применение обычного права в личных делах. Устав одобрен группой избранных международных исламских организаций."
 CHI_ETK_islamic_governance_framework: "Islamic Governance Framework"
 CHI_ETK_islamic_governance_framework_desc: "Пекин придерживается более примирительного подхода в Синьцзяне, разрешая исламские религиозные обряды в рамках установленных ограничений, расширяя образование на уйгурском языке и назначая больше чиновников-уйгуров в органы местного самоуправления. Эта политика отражает относительную мягкость, которая наблюдалась в период до 2017 года."
 CHI_ETK_BRI_hub: "Kashgar Special Economic Zone"
 CHI_ETK_BRI_hub_desc: "Кашгар объявлен специальной экономической зоной с льготным налогообложением и упрощёнными таможенными процедурами для транзитной торговли в рамках инициативы «Пояс и путь». Эта зона позволяет Синьцзяну занять позицию торгового центра, связывающего Центральную Азию, Южную Азию и Ближний Восток."
 CHI_TAI_combat_the_traitors: "Combat the Traitors"
 CHI_TAI_combat_the_traitors_desc: "Пекин занимает бескомпромиссную позицию в отношении Тайваня, официально объявляя лидеров, выступающих за независимость, предателями и давая понять, что воссоединение силой по-прежнему остается актуальным вариантом. Это заявление резко усиливает напряженность в отношениях между двумя берегами Тайваньского пролива и приводит Народно-освободительную армию в состояние повышенной боеготовности."
 CHI_TAI_cut_us_support: "Severing US-Taiwan Ties"
 CHI_TAI_cut_us_support_desc: "Пекин проводит последовательную кампанию по оказанию влияния, направленную на американские политические и деловые круги, лоббируя против продаж оружия и официальных контактов с Тайбэем. Эта операция призвана подорвать доверие к приверженности США обеспечению безопасности Тайваня."
 CHI_TAI_outward_island_infrastructure: "Outer Island Military Infrastructure"
 CHI_TAI_outward_island_infrastructure_desc: "После захвата Тайваня Народно-освободительная армия приступает к строительству укреплённых военно-морских и военно-воздушных объектов на отдалённых островах. Новые базы позволяют Китаю расширить сферу влияния глубоко в западную часть Тихого океана и существенно изменяют региональный баланс сил."
 CHI_TAI_cross_strait_policy: "Cross-Strait Policy Review"
 CHI_TAI_cross_strait_policy_desc: "Государственный совет поручает провести всесторонний анализ политики в отношении Тайваня, в ходе которого будут рассмотрены дипломатические, экономические и военные варианты воссоединения. Результаты этого анализа определят политическую повестку дня Китая в отношении Тайваня на предстоящее десятилетие."
 CHI_TAI_economic_track: "Cross-Strait Economic Track"
 CHI_TAI_economic_track_desc: "Пекин начинает структурированный экономический диалог с Тайбэем, в центре которого находятся упрощение торговых процедур, промышленное сотрудничество и долгосрочный доступ к рынкам. Цель состоит в том, чтобы создать достаточные взаимные выгоды, благодаря которым политическим переговорам станет труднее сопротивляться."
 CHI_TAI_political_track: "Cross-Strait Political Track"
 CHI_TAI_political_track_desc: "Наряду с экономическим сотрудничеством Пекин налаживает специальный политический канал, направленный на возобновление механизмов диалога, снижение напряженности и создание условий для приемлемого для обеих сторон урегулирования путем переговоров."
 CHI_TAI_expand_cross_strait_trade: "Expand Cross-Strait Trade"
 CHI_TAI_expand_cross_strait_trade_desc: "Опираясь на логику соглашения ECFA и последующих переговоров по торговле услугами, Пекин предлагает новые торговые уступки и снижение барьеров для тайваньских компаний, ведущих деятельность на материке. Эта политика призвана сделать экономическое сотрудничество заметно выгодным для политической и деловой элиты Тайваня."
 CHI_TAI_mainland_market_access: "Mainland Market Access"
 CHI_TAI_mainland_market_access_desc: "Китай предоставляет тайваньским инвесторам и экспортерам льготный доступ к отдельным секторам экономики материкового Китая, в частности к сфере высокотехнологичного производства и услуг. Данная договоренность отражает реальные усилия по более тесной интеграции Тайваня в экономику материкового Китая с помощью стимулов, а не принуждения."
 CHI_TAI_business_delegations: "Cross-Strait Business Delegations"
 CHI_TAI_business_delegations_desc: "Полуофициальные отраслевые ассоциации, торговые палаты и крупные промышленные компании возобновляют регулярные визиты через Тайваньский пролив. Эти делегации создают более безопасный с политической точки зрения способ углубления практического сотрудничества, одновременно формируя на Тайване круг сторонников, заинтересованных в стабильных отношениях."
 CHI_TAI_transport_links: "Direct Transport Links"
 CHI_TAI_transport_links_desc: "Расширяются прямые авиасообщения, организуются морские перевозки и координируются логистические операции с целью сокращения фактического расстояния между двумя сторонами. Ускорение коммерческих и пассажирских перевозок снижает политические издержки продолжающегося взаимодействия и способствует дальнейшей нормализации межпроливных контактов."
 CHI_TAI_semiconductor_coordination: "Semiconductor Coordination"
 CHI_TAI_semiconductor_coordination_desc: "Тайбэй соглашается на ограниченную стратегическую координацию в сфере высокотехнологичных цепочек поставок, особенно в области полупроводников и точного машиностроения. Данная договоренность отражает реальную экономическую взаимозависимость между тайваньским сектором производства микросхем и спросом на материке, не доходя при этом до полноценного политического союза."
 CHI_TAI_investment_safeguards: "Investment Safeguards"
 CHI_TAI_investment_safeguards_desc: "Представители Тайваня на переговорах настаивают на том, что углубление экономической интеграции должно сопровождаться правовыми и нормативными гарантиями, защищающими местные компании и учреждения. Такой подход обусловлен реальными опасениями внутри страны, что инвестиции между двумя берегами пролива не должны превратиться в инструмент политической ассимиляции."
 CHI_TAI_joint_industrial_planning: "Joint Industrial Planning"
 CHI_TAI_joint_industrial_planning_desc: "Планирующие органы обеих сторон приступают к координации инфраструктуры, промышленных цепочек поставок и высокотехнологичных секторов. Этот процесс превращает разрозненные деловые связи в нечто, более близкое к скоординированной стратегии развития в отношениях между двумя берегами пролива."
 CHI_TAI_deep_economic_integration: "Deep Economic Integration"
 CHI_TAI_deep_economic_integration_desc: "Благодаря многолетним соглашениям торговля между двумя берегами Тайваньского пролива приобрела формализованный характер и превратилась в плотную сеть взаимозависимостей в сферах инвестиций, логистики и промышленности. На данном этапе экономическая изоляция становится всё более обременительной для обеих сторон, особенно для Тайваня."
 CHI_TAI_resume_party_contacts: "Resume Party Contacts"
 CHI_TAI_resume_party_contacts_desc: "Пекин возобновляет контакты с партиями и организациями на Тайване, готовыми обсуждать вопрос о менее конфронтационных отношениях между двумя берегами Тайваньского пролива. Такой подход основан на реальной практике диалога между КПК и Гоминьданом, а также на других неофициальных политических контактах, которые периодически заменяли межгосударственную дипломатию."
 CHI_TAI_pro_china_party_networks_mission: "Pro-China Party Networks"
 CHI_TAI_pro_china_party_networks_mission_desc: "Китайские деловые и политические круги, действующие в контексте отношений между Китаем и Тайванем, активно заручаются поддержкой партий Тайваня, выступающих за воссоединение. Пока наше влияние остается значительным, эти усилия постепенно склоняют общественное мнение в пользу коалиции «Пан-Блю»."
 CHI_TAI_offer_confidence_measures: "Offer Confidence Measures"
 CHI_TAI_offer_confidence_measures_desc: "Пекин предлагает комплекс практических мер по деэскалации, включая создание каналов регулярного общения и сдержанность в публичных заявлениях. Цель состоит в том, чтобы убедить умеренных политиков Тайваня в том, что взаимодействие может снизить риски, не вынуждая при этом немедленно принимать решение по вопросу суверенитета."
 CHI_TAI_legislative_exchange_forum: "Legislative Exchange Forum"
 CHI_TAI_legislative_exchange_forum_desc: "Делегации законодателей, советников и экспертов по вопросам политики начинают проводить встречи по полуофициальным каналам для обсуждения вопросов торговли, транспорта и административной координации. Такие форумы придают взаимодействию между двумя берегами пролива парламентский и процедурный характер, смягчая впечатление о давлении, исходящем сверху."
 CHI_TAI_local_government_dialogue: "Local Government Dialogue"
 CHI_TAI_local_government_dialogue_desc: "Администрации городов, органы власти округов и должностные лица субнационального уровня приступают к практическим переговорам по вопросам транспорта, туризма и инвестиций. Это отражает реальную ситуацию, при которой связи на муниципальном и местном уровнях зачастую развивались даже в условиях напряжённости в официальных отношениях на центральном уровне."
 CHI_TAI_reaffirm_the_1992_consensus: "Reaffirm the 1992 Consensus"
 CHI_TAI_reaffirm_the_1992_consensus_desc: "Умеренные силы Тайваня предпочитают открыто возвращаться к принципу «единого Китая», сохраняя при этом собственную интерпретацию этого принципа. Эта формула вызывает споры внутри страны, но по-прежнему остается наиболее реалистичной основой для серьезных переговоров между двумя берегами Тайваньского пролива."
 CHI_TAI_suspend_independence_initiatives: "Suspend Independence Initiatives"
 CHI_TAI_suspend_independence_initiatives_desc: "Тайбэй незаметно прекращает меры, которые могли бы подтолкнуть остров к официальному отделению в правовом или дипломатическом плане. Это не означает прекращения самоуправления, но свидетельствует о том, что Тайвань готов стабилизировать ситуацию, а не усугублять её."
 CHI_TAI_back_channel_settlement: "Back-Channel Settlement"
 CHI_TAI_back_channel_settlement_desc: "Полуофициальные организации обеих сторон переходят от мер по укреплению доверия к содержательным политическим переговорам. Опираясь на модель контактов по типу ARATS-SEF, они разрабатывают рамочную концепцию урегулирования, призванную представить мирное воссоединение как упорядоченный, постепенный и выгодный с материальной точки зрения процесс."
 CHI_TAI_peaceful_reunification_accord: "Peaceful Reunification Accord"
 CHI_TAI_peaceful_reunification_accord_desc: "После многих лет постепенного прогресса в дипломатических отношениях Пекин и Тайбэй подписали историческое рамочное соглашение, предусматривающее присоединение Тайваня к Китайской Народной Республике в качестве специального административного района. Соглашение гарантирует сохранение существующих демократических институтов и правовой системы Тайваня на пятидесятилетний переходный период."
 CHI_TAI_military_buildup: "Cross-Strait Military Buildup"
 CHI_TAI_military_buildup_desc: "Народно-освободительная армия ускоряет закупку десантных кораблей, десантных катеров и высокоточных ракет большой дальности, предназначенных для действий в случае возникновения чрезвычайной ситуации в Тайваньском проливе. В ходе совместных учений моделируются операции по захвату прибрежных островов и подавлению средств противовоздушной обороны Тайваня."
 CHI_TAI_amphibious_doctrine: "Совместная доктрина высадки на острова"
 CHI_TAI_amphibious_doctrine_desc: "Морская пехота НОАК и Командование Восточного театра военных действий публикуют пересмотренную совместную оперативную доктрину по проведению десантных операций с применением всех видов вооруженных сил. Эта доктрина засекречена, однако зарубежные разведывательные службы активно анализируют её как непосредственный план действий на случай кризисной ситуации вокруг Тайваня."
 CHI_TAI_blockade_declaration: "Блокада Тайваньского пролива"
 CHI_TAI_blockade_declaration_desc: "Военно-морские силы НОАК объявляют о создании зоны, закрытой для судоходства, вокруг Тайваня, перекрывая торговые морские пути и прерывая импорт топлива и сырья. Блокада сопровождается масштабными военно-воздушными учениями и испытаниями баллистических ракет, что приводит к международному кризису."
 CHI_TAI_operation_storm: "Операция «Буря»"
 CHI_TAI_operation_storm_desc: "Народно-освободительная армия начинает давно запланированную десантную операцию против Тайваня. Ракетные удары выводят из строя системы противовоздушной обороны и командно-штабную инфраструктуру, в то время как десантные войска пересекают пролив под прикрытием авиации и флота. Эта операция становится крупнейшей военной акцией в Азии со времён Корейской войны."
 CHI_TAI_economic_miracle: "Интеграция тайваньского экономического чуда"
 CHI_TAI_economic_miracle_desc: "Передовая полупроводниковая промышленность, финансовый сектор и технологическая экосистема Тайваня официально включены в систему национального экономического планирования. Это приобретение означает качественный скачок в технологическом потенциале Китая, особенно в сфере производства микросхем."
 CHI_OMG_steppe_development: "Инициатива по развитию Внутренней Монголии"
 CHI_OMG_steppe_development_desc: "Государственный совет запускает целевую программу развития Автономного района Внутренней Монголии, предусматривающую инвестиции в энергетическую инфраструктуру, логистические коридоры и промышленные парки. Эта инициатива способствует более глубокой интеграции Внутренней Монголии в национальную экономическую сеть и одновременно направлена на решение проблемы хронической бедности в сельских районах."
 CHI_OMG_northern_corridor: "Инфраструктура Северного коридора"
 CHI_OMG_northern_corridor_desc: "Утвержден проект строительства новой скоростной автомагистрали и железнодорожного грузового коридора, соединяющих Внутреннюю Монголию с агломерацией Пекин-Тяньцзинь-Хэбэй, что позволит сократить время транспортировки угля, редкоземельных минералов и сельскохозяйственной продукции. Этот коридор укрепляет роль Внутренней Монголии как энергетического тыла северного Китая."
 CHI_OMG_mandarin_education: "Введение образования на мандаринском языке"
 CHI_OMG_mandarin_education_desc: "Региональное правительство объявляет о поэтапном переходе, в соответствии с которым все начальные и средние школы обязаны преподавать основные предметы на мандаринском языке, а не на монгольском. Эта политика, разработанная по образцу аналогичных мер, принятых в Тибете и Синьцзяне, вызывает массовые протесты в городах и скотоводческих общинах Внутренней Монголии."
 CHI_OMG_cultural_recognition: "Признание монгольской культуры"
 CHI_OMG_cultural_recognition_desc: "Пекин официально признает монгольскую культурную и языковую самобытность Специального административного района Внутренней Монголии, гарантируя образование на монгольском языке, государственное вещание на монгольском языке и официальный статус монгольской письменности. Эта политика представляет собой сознательный отход от ассимиляционного подхода, применяемого в Тибете и Синьцзяне."
 CHI_OMG_han_settlement_program: "Программа переселения ханьцев"
 CHI_OMG_han_settlement_program_desc: "Поддерживаемая государством миграция из провинций Хэбэй, Шэньси и Ганьсу ускоряет демографические изменения во Внутренней Монголии. На бывших пастбищных землях создаются новые поселки, а льготная политика в сфере занятости еще больше укрепляет доминирующее положение ханьцев в городских районах."
 CHI_SAR_integrate_OMG: "Inner Mongolia Full Integration"
 CHI_SAR_integrate_OMG_desc: "В связи с демографическими и культурными преобразованиями статус Внутренней Монголии как специального автономного района (САР) отменяется, и регион преобразуется в стандартное административное подразделение провинциального уровня. Официальное признание автономии Монголии заменяется общими положениями о защите этнических меньшинств, действующими на всей территории КНР."
 CHI_OMG_greater_mongolia_vision: "Pan-Mongolian Vision"
 CHI_OMG_greater_mongolia_vision_desc: "Сторонники культурного движения во Внутренней Монголии провозглашают идею укрепления связей с независимым монгольским государством, ссылаясь на общую историю, язык и кочевое наследие. Пекин терпимо относится к этой культурной риторике, одновременно жестко ограничивая любые политические последствия."
 OMG_steppe_livestock_industry: "Steppe Livestock Modernisation"
 OMG_steppe_livestock_industry_desc: "Традиционные отрасли Внутренней Монголии — производство кашемира, баранины и молочной продукции — реорганизуются по кооперативной модели, которая объединяет семьи скотоводов с национальными цепочками поставок. Эта программа способствует повышению доходов домохозяйств, сохраняя при этом элементы кочевого образа жизни."
 CHI_OMG_steppe_mining_industry: "Steppe Mining Industry"
 CHI_OMG_steppe_mining_industry_desc: "Месторождения хрома и других полезных ископаемых во Внутренней Монголии включены в комплексную программу добычи. Предприятия, поддерживаемые государством, создают перерабатывающие мощности и экспортные коридоры, преобразуя недра в промышленный потенциал для экономики Китая в целом."
 OMG_mongolian_mining_expansion: "Rare Earth and Coal Expansion"
 OMG_mongolian_mining_expansion_desc: "В Внутренней Монголии сосредоточены одни из крупнейших в мире месторождений редкоземельных элементов, а также треть запасов угля Китая. Власти специального административного района расширяют добычу и заключают соглашения о роялти, обеспечивающие направление большей доли доходов от добычи полезных ископаемых на развитие региональной инфраструктуры и образования."
 CHI_OMG_mongolian_mining_expansion: "Rare Earth and Coal Expansion"
 CHI_OMG_mongolian_mining_expansion_desc: "В Внутренней Монголии сосредоточены одни из крупнейших в мире месторождений редкоземельных элементов, а также треть запасов угля Китая. Власти специального административного района расширяют добычу и заключают соглашения о роялти, обеспечивающие направление большей доли доходов от добычи полезных ископаемых на развитие региональной инфраструктуры и образования."
 CHI_MON_diplomatic_outreach: "Mongolian Diplomatic Outreach"
 CHI_MON_diplomatic_outreach_desc: "Пекин развернул дипломатическую инициативу в отношении Улан-Батора, сочетающую экономические стимулы с культурными апелляциями к общему монгольскому наследию. Визиты на высоком уровне, льготные условия торговли и расширение присутствия китайской культуры создают основу для углубления сотрудничества."
 CHI_MON_economic_partnership: "Steppe Economic Partnership"
 CHI_MON_economic_partnership_desc: "Соглашение о всеобъемлющем экономическом партнерстве предоставляет Монголии преференциальный доступ к китайским рынкам, инвестициям и финансированию инфраструктурных проектов. Основным покупателем монгольского экспорта полезных ископаемых — меди, угля и редкоземельных элементов — является Китай, что приводит к формированию значительной экономической взаимозависимости."
 CHI_MON_reunification_offer: "Mongolian Reunification Offer"
 CHI_MON_reunification_offer_desc: "Китай направляет Монголии официальное предложение о воссоединении в статусе специального административного района, обещая высокую степень автономии, сохранение политической системы Монголии и полную экономическую интеграцию. В предложении ссылаются на исторический прецедент и позиционируют Китай как естественного партнера, способного обеспечить процветание Монголии."
 MON_CHI_economic_partnership_idea: "Sino-Mongolian Economic Integration"
 MON_CHI_economic_partnership_idea_desc: "Благодаря льготному доступу к рынкам и интеграции с китайским рынком Монголия стала в значительной степени зависимой от экспорта в Китай. Доходы от добычи полезных ископаемых растут, но при этом усиливается структурная зависимость от спроса со стороны Китая."
 MON_CHI_cultural_sphere_idea: "Within China's Cultural Orbit"
 MON_CHI_cultural_sphere_idea_desc: "Китайские государственные СМИ, культурные программы и сети диаспоры обеспечили значительное присутствие «мягкой силы» на территории Монголии. В результате сопротивление дальнейшему расширению китайского влияния ослабевает."
 CHI_TAI_fleet_modernization: "Fleet Modernization Programme"
 CHI_TAI_fleet_modernization_desc: "Военно-морские силы НОАК ускоряют закупку современных эсминцев, фрегатов и десантных кораблей, предназначенных для проведения операций в Тайваньском проливе. Расширение производственных мощностей верфей и сокращение сроков ввода кораблей в строй свидетельствуют о явном сдвиге в сторону проецирования военной мощи в западной части Тихого океана."
 CHI_TAI_dongfeng_program: "Dong Feng Missile Programme"
 CHI_TAI_dongfeng_program_desc: "«Ракетные войска» расширяют свой арсенал баллистических ракет средней дальности, развертывая дополнительные батареи DF-21 и DF-26 вдоль побережья провинции Фуцзянь. Эта программа дает Пекину возможность создавать угрозу для военной инфраструктуры Тайваня с материка без задействования военно-морских или военно-воздушных сил."
 CHI_TAI_air_superiority: "Air Superiority Strategy"
 CHI_TAI_air_superiority_desc: "Военно-воздушные силы НОАК активизируют учебные вылеты над средней линией Тайваньского пролива и развертывают современные истребители J-20 на передовых базах в провинции Фуцзянь. Постоянное давление с воздуха подрывает способность Тайваня обеспечивать надежную противовоздушную оборону."
 CHI_TAI_cyber_warfare: "Cyber Warfare Capability"
 CHI_TAI_cyber_warfare_desc: "Стратегические силы поддержки расширяют свое управление по наступательным кибероперациям, развивая возможности по парализации критически важной инфраструктуры, военной связи и финансовых систем Тайваня. Цифровой фронт становится ещё одним направлением давления."
 CHI_TAI_blockade_capability: "Blockade Readiness"
 CHI_TAI_blockade_capability_desc: "После проведения масштабных учений по моделированию Военно-морские силы и Береговая охрана НОАК подтвердили полную боеготовность к обеспечению морской зоны ограниченного доступа вокруг Тайваня. В кратчайшие сроки могут быть задействованы подводные патрули, надводные пикеты и воздушное наблюдение."
 CHI_TAI_one_china_enforcement: "One China Enforcement"
 CHI_TAI_one_china_enforcement_desc: "Пекин развернул системную дипломатическую кампанию, направленную на ликвидацию оставшихся случаев официального признания Тайваня. Послы отправляются с пакетами помощи и предложениями по инфраструктурным проектам, в то время как на страны, отказывающиеся изменить свою позицию, оказывается экономическое давление."
 CHI_TAI_intl_org_blockade: "International Organisation Blockade"
 CHI_TAI_intl_org_blockade_desc: "Китай использует свое постоянное место в Совете Безопасности ООН и растущее влияние в многосторонних организациях, чтобы блокировать участие Тайваня в международных организациях. Заявки на получение статуса наблюдателя накладываются вето, а неформальные каналы участия закрываются."
 CHI_TAI_economic_leverage: "Economic Leverage Campaign"
 CHI_TAI_economic_leverage_desc: "Пекин использует в своих интересах свой статус крупнейшей торговой державы мира, оказывая целенаправленное экономическое давление на американские отрасли и политические круги, поддерживающие Тайвань. Эта кампания направлена на то, чтобы, используя коммерческую зависимость, подорвать политическую волю, лежащую в основе гарантий безопасности США."
 CHI_TAI_tourism_freeze: "Tourism Freeze"
 CHI_TAI_tourism_freeze_desc: "Пекин приказал государственным туроператорам приостановить все групповые и индивидуальные туры на Тайвань, тем самым перекрыв поток туристов, который значительно вырос после открытия границ в 2008 году в рамках соглашения ECFA. Этот шаг лишает Тайбэй поступлений в виде иностранной валюты и доходов от потребительских услуг, которые приносил туризм с материка, превращая экономическую интеграцию между двумя берегами Тайваньского пролива в инструмент принуждения."
 CHI_TAI_lobby_network: "Washington Lobby Network"
 CHI_TAI_lobby_network_desc: "Прокитайские деловые круги, аналитические центры и политические консультанты создают постоянное представительство в Вашингтоне. Эта сеть стремится влиять на мнение Конгресса по вопросу Тайваня, препятствуя продажам оружия и содействуя налаживанию отношений с Пекином."
 CHI_TAI_proxy_strategy: "Global Proxy Strategy"
 CHI_TAI_proxy_strategy_desc: "Пекин разжигает конфликты с участием прокси-сил и создает региональные очаги напряжённости, призванные отвлечь внимание американских вооружённых сил и политические ресурсы США от Тайваньского пролива. Каждый кризис, отвлекающий силы США в другие регионы, подрывает доверие к обязательствам Вашингтона в Тихоокеанском регионе."
 CHI_TAI_distract_america: "Distract America"
 CHI_TAI_distract_america_desc: "Пока Соединённые Штаты ведут военные операции за рубежом, Пекин извлекает выгоду из того, что ресурсы Вашингтона распределены на множество направлений, а его внимание раздроблено. Каждое новое развертывание американских войск снижает вероятность оперативного реагирования США на чрезвычайную ситуацию в Тайваньском проливе."
 CHI_sinicization_modifier: "£GFX_text_icon_chinese_icon Sinicization Multiplier"
