l_russian:
 MD_ace_promoted.1.t: "Лучший пилот повышен"
 MD_ace_promoted.1.d: "Мало кто идет на такие риски, как отважные пилоты [Root.GetAdjective] военно-воздушных сил. [From.GetName] [From.GetSurname], талантливый пилот с позывным [From.GetCallsign], проявил [From.GetHerselfHimself] не только тем, что вернулся живым, но и продемонстрировал выдающееся мастерство в управлении [From.GetHerHis] [From.GetWing]. Недавно, во время миссии над [From.GetMissionRegion], [From.GetName] сыграл ключевую роль в успешном исходе этого критически важного столкновения.\n\nБудучи ярким примером [Root.GetAdjective] мужества, недавнее повышение [From.GetName] получило широкую огласку. Хотя народ может воспринимать войну скорее как ад, чем славу, многие рады видеть, что у них все еще есть герои, за которыми можно следовать."
 MD_ace_promoted.1.a: "Кто рискует, тот побеждает."
 MD_ace_died.1.t: "[From.GetCallsign] погиб при [From.GetMissionRegion]"
 MD_ace_died.1.d: "Один из наиболее известных [From.GetAceType] асов [From.Owner.GetName], [From.GetFullName], погиб при исполнении служебных обязанностей. Пилоты, возвращающиеся с задания, сообщают, что заметили [From.GetHerHis] [From.GetWingShort] летящим вниз охваченным пламенем над [From.GetMissionRegion] после принятия на себя тяжелого огня противника. К сожалению, с тех пор [From.GetSheHe] давно уже стал общественным деятелем, кончина [From.GetCallsign] сильно деморализует многих людей, ведь они смотрели снизу вверх на [From.GetHerHim].\n\nВ то время, как мы хотели бы, чтобы был способ скрыть это событие от людей, отсутствие публичных выступлений со стороны [From.GetName] скоро вызовет подозрения. В конце концов, смерть [From.GetHerHis] — это ещё одна часть легенды, которая, стоит надеяться, будет жить долго после нынешних неприятностей."
 MD_ace_died.1.a: "Живая легенда все равно лучше."
 MD_ace_killed_by_ace.1.t: "[From.GetFullName] сбит [Prev.GetCallsign]"
 MD_ace_killed_by_ace.1.d: "Лётчики, возвращающиеся из [From.GetMissionRegion], доложили, что эскадрилья самолётов [Prev.Owner.GetAdjective] во главе с печально известным [Prev.GetCallsign] сосредоточилась на преследовании [From.GetCallsign]. После того как [From.GetCallsign] сбил несколько вражеских самолётов и увернулся от нескольких ракет [Prev.Owner.GetAdjective], он был ошеломлён [Prev.GetCallsign] в его [Prev.GetWingShort], который, как сообщается, перехитрил [From.GetHerHim] и разорвал топливные баки точным попаданием. [From.GetWingShort] [From.GetName] [From.GetSurname] загорелся и пошёл по спирали вниз над [From.GetMissionRegion] в яростном пламени.\n\n[From.GetFullName] проявил большое мужество на протяжении всей [From.GetHerHis] службы, и на него с восторгом смотрели многие начинающие лётчики. Потеря этого национального героя — большой удар по ВВС [From.Owner.GetAdjective] и сокрушительный удар для нации в целом. Зная это, пока мы скорбим, [Prev.Owner.GetName] превозносит [Prev.GetFullName] как героя, что делает трагедию ещё горше."
 MD_ace_killed_by_ace.1.a: "Сокрушительная потеря для всех нас!"
 MD_ace_killed_other_ace.1.t: "[From.GetFullName] сбил [Prev.GetCallsign]"
 MD_ace_killed_other_ace.1.d: "Наша последняя миссия над [From.GetMissionRegion] была успешной для ВВС [From.Owner.GetAdjective] более чем в одном аспекте. Поступают сообщения о героическом поступке [From.GetFullName], который сумел перехитрить [Prev.Owner.GetAdjective] пилота, [Prev.GetName] [Prev.GetSurname], известного как [Prev.GetCallsign]. [From.GetCallsign] использовал [From.GetHerselfHimself] в качестве приманки и заманил [Prev.GetCallsign] в ловушку, где пилоты [From.Owner.GetAdjective] смогли спикировать на эскадрилью [Prev.GetCallsign]. [From.GetCallsign] продолжил обходить самолёты [Prev.Owner.GetAdjective] и одной ракетой отправил [Prev.GetCallsign] по спирали с неба [From.GetMissionRegion].\n\n[Prev.GetFullName] был опасным пилотом, на совести которого было много жизней [From.Owner.GetAdjective]. Это великая победа, которая показывает, что когда мы сплачиваемся вокруг великих героев, они совершают великие дела."
 MD_ace_killed_other_ace.1.a: "Победа, которую запомнит вся [From.Owner.GetName]!"
 MD_aces_killed_each_other.1.t: "[From.GetFullName] погиб"
 MD_aces_killed_each_other.1.d: "Во время последней миссии наш знаменитый [From.GetAceType] ас [From.GetFullname] оказался втянут в затяжной воздушный бой с опасным пилотом-асом, [Prev.GetFullName]. Имея мало боеприпасов и не имея возможности спастись, [From.GetCallsign] провёл [From.GetHerHis] [From.GetWingShort] сквозь огонь самолётов [Prev.Owner.GetAdjective] и пошёл на таран [Prev.GetCallsign].\nБыло замечено, как [From.GetWingShort] [From.GetCallsign] и [Prev.GetWingShort] [Prev.GetCallsign] разваливаются на куски в небе над [From.GetMissionRegion].\n\nХотя это слабое утешение, что угроза со стороны [Prev.Owner.GetAdjective], [Prev.GetCallsign], больше не будет нам досаждать, мы потеряли ценного лётчика и вдохновляющий пример для всех [From.Owner.GetAdjective]."
 MD_aces_killed_each_other.1.a: "Тем не менее, большая потеря для нас"