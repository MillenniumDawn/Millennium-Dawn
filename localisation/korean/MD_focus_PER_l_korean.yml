 PER_seize_mosque_funds: "모스크 자금 삭감"
 PER_seize_mosque_funds_desc: "정부는 전국의 모스크에 지원하기 위한 일정 예산을 배정해 왔습니다. 그러나 이는 울라마와 성직자들을 대담하게 만들 뿐입니다. 이들의 영향력을 제한하기 위해 자금 지원을 줄여야 합니다."
 PER_resistance_chance: "저항 확률"
 PER_Iranian_prime_ministers: "이란 총리"
 PER_Iranian_prime_ministers_elections: "이란 총리 선출"
 PER_Iranian_prime_ministers_elections_desc: "총리직은 반드시 누군가에게 주어져야 하며, 다행히 우리는 누구에게 줄지 선택할 수 있습니다. 그 직책에 적합한 사실상 누구에게나 줄 수 있지만, 우리 정부와 마즐리스에 부합하는 인물을 선택하는 것이 최선이며, 그렇지 않으면 문제가 생길 수 있습니다."
