 EGY_security_state_loyal: "Loyal Security Services"
 EGY_security_state_loyal_desc: "The security services are content with the government and enforce its order efficiently.\n§W--------------§!\nThis national spirit applies while the opinion of §YThe Intelligence Community§! is §G70§! or higher. It is removed if that faction is removed."
 EGY_security_state_unchecked: "Unchecked Security Services"
 EGY_security_state_unchecked_desc: "Resentful security chiefs act on their own initiative. Abuses and corruption erode public confidence in the state.\n§W--------------§!\nThis national spirit applies while the opinion of §YThe Intelligence Community§! is below §R30§!. It is removed if that faction is removed."
 EGY_brotherhood_quietist: "Quietist Brotherhood"
 EGY_brotherhood_quietist_desc: "The Muslim Brotherhood focuses on preaching, charity, and professional syndicates, and avoids confrontation with the state.\n§W--------------§!\nThis national spirit applies while the opinion of §YThe Muslim Brotherhood§! is §G70§! or higher. It is removed if that faction is removed."
 EGY_brotherhood_agitating: "Agitating Brotherhood"
 EGY_brotherhood_agitating_desc: "The Muslim Brotherhood mobilizes its networks against the government. Street protests and Islamist propaganda unsettle the country.\n§W--------------§!\nThis national spirit applies while the opinion of §YThe Muslim Brotherhood§! is below §R30§!. It is removed if that faction is removed."
 #Mubarak Focuses
 EGY_the_fourth_term: "The Fourth Term"
 EGY_the_fourth_term_desc: "In September 1999 Egyptians approved a referendum that returned Hosni Mubarak for a fourth six-year term, with the result reported at over 93 percent. As in earlier votes, parliament nominated the sole candidate. The presidency remains the center of the regime, but its strength depends on the loyalty of the army, the security services and the opposition's willingness to stay within limits."
 EGY_the_2000_elections: "The 2000 Elections"
 EGY_the_2000_elections_desc: "The elections of October and November 2000 were the first held under full judicial supervision. Independents tied to the Muslim Brotherhood won 17 seats despite harassment, while the National Democratic Party kept its majority only by readmitting many of its own defeated candidates as independents. The vote showed both the reach of the Brotherhood and the limits of the ruling party."
 EGY_military_tribunals_for_the_brotherhood: "Military Tribunals for the Brotherhood"
 EGY_military_tribunals_for_the_brotherhood_desc: "In 2001 and 2002 the government referred leading Brotherhood professionals, including doctors, engineers and university teachers, to military courts on charges of belonging to a banned organization. The trials removed experienced organizers from the syndicates and parliamentary politics and pleased the security establishment. They also hardened opposition to a regime that was seen as bypassing the ordinary judiciary."
 EGY_tolerate_brotherhood_independents: "Tolerate the Brotherhood Independents"
 EGY_tolerate_brotherhood_independents_desc: "The Brotherhood remains banned, yet its independent deputies sit in parliament and its candidates run the professional syndicates. Tolerating them keeps the movement invested in the existing order and offers a safety valve for Islamist opinion. The security services, who see the movement as a long-term rival, resent the restraint."
 EGY_renew_the_emergency_law: "Renew the Emergency Law"
 EGY_renew_the_emergency_law_desc: "The Emergency Law has been in force almost without interruption since the assassination of Anwar Sadat in 1981, and parliament renewed it again in February 2003. It permits detention without trial, restricts assembly and sends civilians to state security courts. The measure gives the security services wide powers and keeps opposition movements under constant pressure."
 EGY_empower_state_security: "Empower State Security"
 EGY_empower_state_security_desc: "The State Security Investigations Service, run from the Interior Ministry under Habib el-Adly since 1997, watches political parties, the press, the professional syndicates and Islamist networks. After the Islamist insurgency of the 1990s the service enjoyed the regime's full confidence. Expanding its budget and its authority strengthens the state's grip but makes the president more dependent on his security chiefs."
 EGY_suleimans_general_intelligence: "Suleiman's General Intelligence"
 EGY_suleimans_general_intelligence_desc: "Omar Suleiman has led the General Intelligence Service since 1993 and has become the president's most trusted envoy. His service manages the Palestinian file, mediating between Fatah, Hamas and Israel, and handles sensitive contacts across the region. The role gives Egypt influence far beyond its means and a powerful figure inside the regime."
 EGY_tantawis_ministry_of_defence: "Tantawi's Ministry of Defence"
 EGY_tantawis_ministry_of_defence_desc: "Field Marshal Mohamed Hussein Tantawi has been Minister of Defence and commander in chief since 1991. He is a loyal officer who keeps the armed forces professional, comfortable and out of open politics. Preserving his position and the officer corps' privileges is the foundation of the president's security."
 EGY_the_military_economy: "The Military Economy"
 EGY_the_military_economy_desc: "The armed forces run a large business sector through the National Service Projects Organization and the Arab Organization for Industrialization. Factories produce vehicles, appliances and food for both military and civilian markets, and the profits are not subject to normal parliamentary oversight. The enterprises keep the officer corps content and give it a lasting stake in the system."
 EGY_co_opt_al_azhar: "Co-opt Al-Azhar"
 EGY_co_opt_al_azhar_desc: "Al-Azhar is the oldest center of Sunni learning, and its Grand Sheikh Mohamed Sayyid Tantawi is appointed by the president. The state uses the institution's authority to endorse official policy and to counter the Brotherhood's claim to speak for Islam. Reliance on a government-appointed clergy risks costing the establishment its credibility among devout Egyptians."
 EGY_the_policies_secretariat: "The Policies Secretariat"
 EGY_the_policies_secretariat_desc: "In September 2002 Gamal Mubarak, the president's younger son, became head of the new Policies Secretariat of the National Democratic Party. He gathers a circle of businessmen and technocrats around him and is widely seen as a potential successor. Many senior officers distrust the rise of a civilian heir and his associates."
 EGY_float_the_pound: "Float the Pound"
 EGY_float_the_pound_desc: "In January 2003 the central bank abandoned its managed peg and floated the Egyptian pound, which lost about a third of its value within months. The step ended a black market in foreign currency and helped exports and tourism, but it raised the price of imports and food. Officers and public employees on fixed incomes felt the pressure most."
 EGY_the_iraq_war_protests: "The Iraq War Protests"
 EGY_the_iraq_war_protests_desc: "The American invasion of Iraq in March 2003 brought thousands of Egyptians into the streets of Cairo, and for a short time protesters occupied Tahrir Square. The demonstrations began as opposition to the war and turned into open criticism of the government. Security forces broke them up with mass arrests, and the regime noted how quickly the street could mobilize."
 EGY_the_nazif_cabinet: "The Nazif Cabinet"
 EGY_the_nazif_cabinet_desc: "In July 2004 Ahmed Nazif, a telecommunications minister and technocrat, formed a cabinet of reform-minded ministers close to Gamal Mubarak. The government lowered tariffs, cut taxes and pressed ahead with privatization to attract foreign investment. The economy responded, though the officer corps and the poor gained little from the program."
 EGY_after_taba: "After Taba"
 EGY_after_taba_desc: "On 7 October 2004 car bombs struck the Taba Hilton and tourist camps at Ras al-Shaytan in Sinai, killing 34 people, many of them Israeli tourists. The attacks revealed a new generation of Islamist militants in Sinai and exposed gaps in the state's intelligence. Security forces answered with sweeping arrests among the Bedouin of the peninsula, and the army expanded its role in Sinai."
 EGY_the_qiz_agreement: "The QIZ Agreement"
 EGY_the_qiz_agreement_desc: "In December 2004 Egypt, Israel and the United States signed a protocol creating Qualifying Industrial Zones. Egyptian textile exports containing a share of Israeli inputs enter the American market duty free. The arrangement draws investment into the garment industry and opens a limited economic channel with Israel despite public hostility to normalization."
 EGY_stability_above_all: "Stability Above All"
 EGY_stability_above_all_desc: "Mubarak came to power after an assassination and has ruled ever since under the promise of order. The regime trades political freedom for calm streets, steady bread prices and a state that does not lurch from crisis to crisis."
 EGY_new_thinking_and_priorities: "New Thinking and Priorities"
 EGY_new_thinking_and_priorities_desc: "\"New Thinking and Priorities\" was the slogan of the National Democratic Party's 2002 conference. A younger generation of businessmen and technocrats promises to modernize the economy and the ruling party without loosening the president's grip."
 EGY_the_indispensable_broker: "The Indispensable Broker"
 EGY_the_indispensable_broker_desc: "Egypt is the only Arab state at peace with Israel, a close partner of Washington and the seat of the Arab League. Mubarak has made the country the region's go-between, and every crisis from Gaza to Sudan passes through Cairo."
 EGY_the_mubarak_doctrine: "The Mubarak Doctrine"
 EGY_the_mubarak_doctrine_desc: "After nearly three decades in power, Mubarak's way of governing has become a system of its own: balance every pillar, reform only as far as control allows, and make Egypt indispensable abroad. The doctrine draws its strength from the projects we have completed."
 EGY_smart_village_and_the_ict_strategy: "Smart Village and the ICT Strategy"
 EGY_smart_village_and_the_ict_strategy_desc: "The Smart Village business park west of Cairo and the national ICT strategy aim to turn Egypt into a regional hub for telecommunications and outsourcing. The internet that comes with it also gives critics a space the state does not fully control."
 EGY_reviving_the_nuclear_programme: "Reviving the Nuclear Programme"
 EGY_reviving_the_nuclear_programme_desc: "At the 2006 NDP conference Gamal Mubarak announced that Egypt would revive its civilian nuclear programme, frozen since Chernobyl. The plan for a plant at El Dabaa promises energy security and national prestige."
 EGY_income_tax_law: "Income Tax Law 91 of 2005"
 EGY_income_tax_law_desc: "The Nazif government's income tax law cuts the top rate from 40 to 20 percent and simplifies the code. The bet is that lower rates will draw income out of the informal economy and raise more revenue over time."
 EGY_customs_tariff_overhaul: "Customs Tariff Overhaul"
 EGY_customs_tariff_overhaul_desc: "The new cabinet slashes tariffs and cuts the number of customs bands. Cheaper imports please consumers and trading partners, though domestic producers lose some of their protection."
 EGY_banking_reform_programme: "The Banking Reform Programme"
 EGY_banking_reform_programme_desc: "Central bank governor Farouk El-Okdah leads the consolidation of dozens of weak banks, the clean-up of bad loans and the sale of the Bank of Alexandria. A sound banking sector is the foundation of the reform programme."
 EGY_the_privatization_drive: "The Privatization Drive"
 EGY_the_privatization_drive_desc: "The government accelerates the sale of state companies in cement, steel, telecommunications and banking. The proceeds fill the treasury, but the officers and old bureaucrats who ran these firms see their patronage slip away."
 EGY_us_free_trade_agreement: "The US Free Trade Agreement"
 EGY_us_free_trade_agreement_desc: "Talks on a free trade agreement with the United States stalled over political reform. If Washington is satisfied with our course, a full agreement would open the largest market in the world to Egyptian goods."
 EGY_partner_the_tycoons: "Partner the Tycoons"
 EGY_partner_the_tycoons_desc: "A handful of businessmen close to Gamal Mubarak, such as steel magnate Ahmed Ezz, dominate key industries and sit in parliament. Working with them delivers investment quickly, though the line between policy and private interest grows thin."
 EGY_empower_the_competition_authority: "Empower the Competition Authority"
 EGY_empower_the_competition_authority_desc: "Competition Law 3 of 2005 created an authority to fight monopolies. Giving it real teeth would break up cartels in steel and cement and reassure investors, at the cost of a fight with the most powerful businessmen in the country."
 EGY_the_seven_percent_economy: "The Seven Percent Economy"
 EGY_the_seven_percent_economy_desc: "By 2007 the economy is growing at about seven percent a year, foreign investment is pouring in, and the Nazif government is praised abroad. Whether the growth reaches the bread queues is another question."
 EGY_renewing_the_ndp: "Renewing the NDP"
 EGY_renewing_the_ndp_desc: "The National Democratic Party has grown old and complacent. New committees, younger candidates and a modern message aim to make the ruling party a real political machine rather than a club of officials."
 EGY_national_council_for_human_rights: "National Council for Human Rights"
 EGY_national_council_for_human_rights_desc: "In 2003 the government created a National Council for Human Rights chaired by former UN Secretary-General Boutros Boutros-Ghali. The council investigates complaints and reports on abuses, which reassures Western partners and irritates the security services."
 EGY_amending_article_76: "Amending Article 76"
 EGY_amending_article_76_desc: "In February 2005 Mubarak proposed amending Article 76 of the constitution so that the president would be chosen in a direct, multi-candidate election. The move opens a door that the opposition, led by the new Kifaya movement, intends to push wider."
 EGY_managed_pluralism: "Managed Pluralism"
 EGY_managed_pluralism_desc: "The amendment sets strict conditions for candidacy. Only licensed parties and candidates endorsed by elected councils dominated by the NDP may run, so the contest has rivals but no real risk."
 EGY_a_genuine_contest: "A Genuine Contest"
 EGY_a_genuine_contest_desc: "Instead of strict thresholds, we keep candidacy open and retain judicial supervision of the vote. The president will win, but the opposition will have a fair chance to campaign, which pleases Washington and empowers the Brotherhood."
 EGY_the_2005_electoral_programme: "The 2005 Electoral Programme"
 EGY_the_2005_electoral_programme_desc: "Mubarak's first contested campaign promises 4.5 million jobs, a thousand new factories, half a million homes for low-income families, a million feddans of reclaimed desert and an end to the state of emergency. The country will hold him to these pledges."
 EGY_the_brotherhood_question: "The Brotherhood Question"
 EGY_the_brotherhood_question_desc: "The Brotherhood is banned but cannot be ignored. Its independents can win dozens of seats, its charities reach the poorest districts and its leaders talk of reform. The regime must decide how to deal with it."
 EGY_the_shater_trial: "The Shater Trial"
 EGY_the_shater_trial_desc: "In 2007 Khairat el-Shater, the Brotherhood's deputy guide and financier, was referred to a military tribunal with dozens of others. Seizing their assets and imprisoning their organizers weakens the movement, and the trial is condemned abroad."
 EGY_license_the_wasat_party: "License the Wasat Party"
 EGY_license_the_wasat_party_desc: "Moderate Islamists who left the Brotherhood in 1996 have sought a license for the Wasat Party for years. Legalizing it would give pious voters a lawful outlet and split the Islamist camp."
 EGY_extend_the_emergency_law: "Extend the Emergency Law"
 EGY_extend_the_emergency_law_desc: "The 2005 promise to replace the Emergency Law with a counter-terrorism law has not been kept. Parliament renews the state of emergency again, as it did in 2008 and 2010."
 EGY_replace_the_emergency_law: "Replace the Emergency Law"
 EGY_replace_the_emergency_law_desc: "We keep the 2005 promise. A counter-terrorism law with judicial oversight replaces the state of emergency in force since 1981, ending detention without trial for ordinary political cases."
 EGY_the_2007_constitutional_amendments: "The 2007 Constitutional Amendments"
 EGY_the_2007_constitutional_amendments_desc: "In March 2007 a referendum approved changes to 34 articles of the constitution. Judicial supervision of elections ended, a counter-terrorism article entered the constitution and religious parties remained banned."
 EGY_reforming_the_judicial_authority_law: "Reforming the Judicial Authority Law"
 EGY_reforming_the_judicial_authority_law_desc: "The Judges' Club has long demanded independence from the Justice Ministry. A new Judicial Authority Law grants the judiciary control over its own budget and appointments, a pledge from the 2005 campaign."
 EGY_the_dominant_party: "The Dominant Party"
 EGY_the_dominant_party_desc: "The parliamentary elections of 2010 leave the opposition almost without seats. The NDP's victory is total, and so is the resentment it leaves behind."
 EGY_the_controlled_opening: "The Controlled Opening"
 EGY_the_controlled_opening_desc: "The 2010 elections are run with judges at the ballot boxes. The NDP keeps its majority, but a real opposition bench of liberals, Nasserists and Islamists takes its seats."
 EGY_expand_the_central_security_forces: "Expand the Central Security Forces"
 EGY_expand_the_central_security_forces_desc: "The Central Security Forces are hundreds of thousands of conscripts under the Interior Ministry, trained to break up demonstrations. More men and trucks give the regime a fast answer to unrest."
 EGY_the_gamaa_islamiya_revisions: "The Gama'a Islamiya Revisions"
 EGY_the_gamaa_islamiya_revisions_desc: "The leaders of the Gama'a Islamiya, responsible for the insurgency of the 1990s, have renounced violence in a series of books written in prison. Releasing those who recant drains the pool of militants."
 EGY_watching_the_online_opposition: "Watching the Online Opposition"
 EGY_watching_the_online_opposition_desc: "The April 6 strike of 2008 was organized on Facebook. State Security builds units to monitor bloggers and online activists before the next call to protest spreads."
 EGY_balancing_the_pillars: "Balancing the Pillars"
 EGY_balancing_the_pillars_desc: "The army, General Intelligence and the Interior Ministry each protect the regime, and each could threaten it. Mubarak keeps them strong but separate, so that none can act without the others."
 EGY_tantawis_barracks_bargain: "Tantawi's Barracks Bargain"
 EGY_tantawis_barracks_bargain_desc: "Field Marshal Tantawi keeps the armed forces out of politics as long as their budget, their businesses and their privileges stay untouched. The bargain buys loyalty, but only while we honor it."
 EGY_name_suleiman_vice_president: "Name Suleiman Vice President"
 EGY_name_suleiman_vice_president_desc: "Mubarak has left the vice presidency empty since 1981. Appointing Omar Suleiman would settle the succession in favor of the security establishment years before the crisis of 2011."
 EGY_the_security_pact: "The Security Pact"
 EGY_the_security_pact_desc: "The security state is complete. The army, the intelligence service and the police each guard their own sphere and all guard the president."
 EGY_bread_on_every_table: "Bread on Every Table"
 EGY_bread_on_every_table_desc: "Subsidized baladi bread sells for five piastres a loaf, and tens of millions of Egyptians depend on it. Keeping it cheap and available is the first duty of the state."
 EGY_wheat_import_security: "Wheat Import Security"
 EGY_wheat_import_security_desc: "Egypt is the largest wheat importer in the world. Long-term contracts with suppliers in the United States and Russia and a strategic reserve protect us from the next spike in world prices."
 EGY_smart_ration_cards: "Smart Ration Cards"
 EGY_smart_ration_cards_desc: "Electronic ration cards target subsidies at the families who need them and cut the leakage to traders and smugglers. The switch saves money but angers those who lose their share."
 EGY_the_army_bakes_bread: "The Army Bakes Bread"
 EGY_the_army_bakes_bread_desc: "When the bread queues of 2008 turned deadly, Mubarak ordered the army's bakeries to produce bread for the public. The military delivers where the ministries failed and gains credit with the people."
 EGY_the_may_day_bonus: "The May Day Bonus"
 EGY_the_may_day_bonus_desc: "On May Day 2008 Mubarak announced a 30 percent bonus for public sector workers to offset soaring food prices. The raise calms the unions and burdens the budget."
 EGY_the_national_housing_programme: "The National Housing Programme"
 EGY_the_national_housing_programme_desc: "The 2005 campaign promised half a million homes for low-income families. Land, cheap loans and state contractors are mobilized in the new desert cities around Cairo."
 EGY_patron_of_toshka: "Patron of Toshka"
 EGY_patron_of_toshka_desc: "Since 1997 the Toshka project has pumped water from Lake Nasser into the Western Desert to create a second Nile valley. It is Mubarak's personal project, and its success or failure reflects on him."
 EGY_national_project_for_sinai_development: "The National Project for Sinai Development"
 EGY_national_project_for_sinai_development_desc: "Roads, water pipelines and settlements are meant to tie the Sinai Peninsula to the rest of Egypt. Development also extends the reach of the army and the state into a restless frontier."
 EGY_the_grand_egyptian_museum: "The Grand Egyptian Museum"
 EGY_the_grand_egyptian_museum_desc: "In 2002 Mubarak laid the foundation stone of the Grand Egyptian Museum near the pyramids of Giza. The largest archaeological museum in the world will showcase our heritage and the regime's ambitions."
 EGY_cairo_metro_line_three: "Cairo Metro Line Three"
 EGY_cairo_metro_line_three_desc: "Work on the third line of the Cairo Metro begins in 2007, crossing the city from the airport to Imbaba. Millions of commuters will feel the difference."
 EGY_the_bibliotheca_alexandrina: "The Bibliotheca Alexandrina"
 EGY_the_bibliotheca_alexandrina_desc: "Opened in October 2002, the new Library of Alexandria revives the ancient center of learning. Built with UNESCO and European support, it is a showcase of Egypt as a bridge between civilizations."
 EGY_the_first_ladys_councils: "The First Lady's Councils"
 EGY_the_first_ladys_councils_desc: "Suzanne Mubarak chairs the National Council for Women and the Reading for All campaign. Her initiatives promote literacy and women's rights and earn praise from Western governments."
 EGY_national_unity_and_coptic_christmas: "National Unity and Coptic Christmas"
 EGY_national_unity_and_coptic_christmas_desc: "In December 2002 Mubarak declared Coptic Christmas a national holiday. The gesture affirms the place of Egypt's Christians in the nation, though conservative Muslims resent it."
 EGY_the_social_contract: "The Social Contract"
 EGY_the_social_contract_desc: "Bread, housing, public jobs and an official Islam: the state provides, and in return the people stay off the streets. The bargain has held for decades and must hold a while longer."
 EGY_the_camp_david_dividend: "The Camp David Dividend"
 EGY_the_camp_david_dividend_desc: "Peace with Israel brings Egypt one of the largest American aid packages in the world. Economic aid supports the budget, and the relationship with Washington supports the regime."
 EGY_gas_diplomacy: "Gas Diplomacy"
 EGY_gas_diplomacy_desc: "The Arab Gas Pipeline carries Egyptian gas to Jordan, and a controversial deal sells gas to Israel. Exports earn hard currency and bind our neighbors to Cairo, though the Israeli contract is deeply unpopular."
 EGY_the_sharm_el_sheikh_summits: "The Sharm el-Sheikh Summits"
 EGY_the_sharm_el_sheikh_summits_desc: "Mubarak's favorite resort hosts summit after summit. In February 2005 Sharon and Abbas met there to end the Second Intifada. Each meeting reminds the world that peace in the region runs through Egypt."
 EGY_co_president_of_the_mediterranean: "Co-President of the Mediterranean"
 EGY_co_president_of_the_mediterranean_desc: "In July 2008 Mubarak became co-president of the Union for the Mediterranean alongside Nicolas Sarkozy. The role raises Egypt's standing in Europe and opens doors for trade."
 EGY_the_gaza_file: "The Gaza File"
 EGY_the_gaza_file_desc: "After Israel withdrew from Gaza in 2005, Egyptian border guards took over the Philadelphi corridor. The Rafah crossing is now the strip's only gate that Israel does not control, and the question is how far to open it."
 EGY_seal_the_rafah_crossing: "Seal the Rafah Crossing"
 EGY_seal_the_rafah_crossing_desc: "We keep Rafah closed and build a steel barrier underground against the smuggling tunnels, as Egypt began to do in 2009. Israel and the United States approve, while the Arab street calls it complicity in the blockade."
 EGY_rafah_on_egyptian_terms: "Rafah on Egyptian Terms"
 EGY_rafah_on_egyptian_terms_desc: "We open Rafah under our own controls for people and goods. Palestinians and the Arab public welcome it, and Israel protests that weapons will follow."
 EGY_brokering_palestinian_reconciliation: "Brokering Palestinian Reconciliation"
 EGY_brokering_palestinian_reconciliation_desc: "After Hamas seized Gaza in 2007, Omar Suleiman's intelligence service became the mediator between Fatah and Hamas. Whoever brokers the deal holds the key to the Palestinian question."
 EGY_a_two_state_settlement: "A Two-State Settlement"
 EGY_a_two_state_settlement_desc: "Egypt made the first Arab peace with Israel at Camp David, and its diplomats have since hosted the Taba negotiations and the Sharm el-Sheikh summits. We can now put a settlement on the table: two states on negotiated borders, with an answer for the refugees and for Jerusalem."
 EGY_gaza_to_israel: "Gaza to Israel"
 EGY_gaza_to_israel_desc: "Egypt has no wish to rule the strip it left in 1967, and Israel has already withdrawn its settlers once. We can propose that Israel take Gaza under its own control while Palestine receives full independence, a state of its own at the price of the strip."
 EGY_egyptian_rule_over_gaza: "Egyptian Rule over Gaza"
 EGY_egyptian_rule_over_gaza_desc: "Egypt administered Gaza from 1948 to 1967, and Cairo remembers it more with unease than ambition. With influence in Jerusalem, Ramallah and Gaza City alike, we can propose to take the strip back, with Israeli and Palestinian consent, and answer for its security ourselves."
 EGY_two_state_settlement_chain_tt: "§HEgyptian Settlement Plan§!: [ISR.GetFlag] [ISR.GetNameDef] and [PAL.GetFlag] [PAL.GetNameDef] receive Egypt's terms on refugees, settlements, Jerusalem and statehood.\n - Each answer tilts Israeli or Palestinian support for the plan.\n - §GBoth accept§!: the peace deal is signed.\n - §ROne refuses§!: we can pressure both sides and resubmit the plan.\n"
 EGY_israel_under_pressure_tt: "[ISR.GetNameWithFlag] is more likely to accept our Gaza proposals for §Y180§! days."
 EGY_cairos_arab_league: "Cairo's Arab League"
 EGY_cairos_arab_league_desc: "The Arab League has its seat in Cairo and has almost always been led by an Egyptian. Through Secretary-General Amr Moussa we steer the common Arab position."
 EGY_the_gulf_partnership: "The Gulf Partnership"
 EGY_the_gulf_partnership_desc: "The Gulf monarchies place deposits in the Central Bank of Egypt, invest in our economy and employ millions of Egyptian workers whose remittances flow home. In return, Cairo stands as the Arab security guarantor against Tehran, with which Egypt has had no full relations since 1980. The Gulf capitals gain a say in Cairo in exchange for their money."
 EGY_the_sudan_file: "The Sudan File"
 EGY_the_sudan_file_desc: "Khartoum has fought the SPLA since 1983, and Darfur simmers with violence over land and water. Every drop of the Nile that reaches Aswan flows through Sudan first. We offer Khartoum the Four Freedoms: the right to move, live, work and own property on either side of the border."
 EGY_the_unity_of_the_nile_valley: "The Unity of the Nile Valley"
 EGY_the_unity_of_the_nile_valley_desc: "Garang's SPLA fights for a south that may one day vote to leave, and a new state on the White Nile would owe nothing to the 1959 Nile Waters Agreement. Cairo offers Khartoum Egyptian rifles, and an open door to ask for more."
 EGY_the_egyptian_libyan_initiative: "The Egyptian-Libyan Initiative"
 EGY_the_egyptian_libyan_initiative_desc: "The IGAD mediators in Kenya have put southern self-determination on the table, a precedent Cairo cannot accept. With Colonel Gaddafi we offer our own plan: a ceasefire, a unity government and a constitutional conference for a Sudan that stays whole."
 EGY_egypt_pivot_of_the_region: "Egypt, Pivot of the Region"
 EGY_egypt_pivot_of_the_region_desc: "From Gaza to the Gulf to the Nile, the region's crises are mediated in Cairo. Egypt's influence rests not on wealth or arms but on being the one capital every party must visit."
 EGY_operation_bright_star: "Operation Bright Star"
 EGY_operation_bright_star_desc: "Since 1980 American and Egyptian soldiers have met every other year in the desert west of Alexandria, joined today by a dozen nations. Bright Star is the largest coalition exercise in the Middle East and proof that the Camp David partnership still holds."
 EGY_abrams_at_factory_200: "Abrams at Factory 200"
 EGY_abrams_at_factory_200_desc: "Since 1992 Factory 200 outside Cairo has assembled M1A1 Abrams tanks under license, making Egypt one of the few nations to build the tank. Each hull is American in design and Egyptian in labor, and each new batch reminds the generals who equips them."
 EGY_the_f16_block_52_order: "The F-16 Block 52 Order"
 EGY_the_f16_block_52_order_desc: "Egyptian pilots have flown the F-16 since 1982, and our fleet is one of the largest in the world. Twenty Block 52 fighters would replace worn airframes, if Washington pays for them through Foreign Military Financing. The order will show how much the Americans still value us."
 EGY_look_east_for_arms: "Look East for Arms"
 EGY_look_east_for_arms_desc: "Every American jet comes with a congressional hearing, while Moscow and Beijing ask no such questions. Russia wants back the client it lost in 1972, and China sells to anyone who pays. Turning east buys freedom, though Washington will not soon forgive it."
 EGY_strengthen_the_republican_guard: "Strengthen the Republican Guard"
 EGY_strengthen_the_republican_guard_desc: "The Republican Guard answers directly to the president, and its tanks guard the Ittihadiya and Abdeen palaces. More men and handpicked officers make any move against the president far harder. The generals at the Ministry of Defense do not like what they see."
 EGY_blue_helmets_for_darfur: "Blue Helmets for Darfur"
 EGY_blue_helmets_for_darfur_desc: "Villages burn across Darfur, and Western capitals talk of sending troops into Sudan. An Egyptian contingent under the African Union and United Nations flag keeps the answer African and Khartoum close to Cairo. Our battalions will learn what no desert exercise can teach."
 EGY_the_pilot_of_october: "The Pilot of October"
 EGY_the_pilot_of_october_desc: "On 6 October 1973, over two hundred Egyptian aircraft crossed the Suez Canal under Hosni Mubarak's command. State television replays that first air strike every October as the founding moment of his rule. Honoring it binds the armed forces to their former commander."
 EGY_the_question_of_2011: "The Question of 2011"
 EGY_the_question_of_2011_desc: "Mubarak's fifth term ends in 2011, when he will be 83. Every faction is asking who comes next: his son, his spymaster or the president himself once more."
 EGY_gamals_moment: "Gamal's Moment"
 EGY_gamals_moment_desc: "The New Guard dominates the cabinet and the party. Gamal Mubarak tours the country, chairs conferences and prepares to step out of his father's shadow."
 EGY_the_ndp_nominates_gamal: "The NDP Nominates Gamal"
 EGY_the_ndp_nominates_gamal_desc: "The ruling party names Gamal Mubarak as its candidate for the presidency. Everything now depends on whether the generals accept a civilian heir."
 EGY_president_gamal_mubarak: "President Gamal Mubarak"
 EGY_president_gamal_mubarak_desc: "Hosni Mubarak retires and hands the presidency to his son. For the first time since 1952, Egypt is led by a man who never wore a uniform."
 EGY_gamal_second_wave_of_reform: "The Second Wave of Reform"
 EGY_gamal_second_wave_of_reform_desc: "President Gamal launches a second round of privatization and a new programme with international lenders. Growth is the measure of his legitimacy."
 EGY_gamal_the_new_guard_state: "The New Guard State"
 EGY_gamal_the_new_guard_state_desc: "The businessmen and technocrats of the New Guard now run the state. The army's grip on the economy loosens, and so does its hold on politics."
 EGY_the_generals_succession: "The General's Succession"
 EGY_the_generals_succession_desc: "The security establishment closes ranks behind Omar Suleiman. The army and the intelligence service will not allow the presidency to pass to a civilian."
 EGY_the_field_marshals_endorsement: "The Field Marshal's Endorsement"
 EGY_the_field_marshals_endorsement_desc: "Field Marshal Tantawi lets it be known that the armed forces support Suleiman. With the army behind him, the succession is settled."
 EGY_president_omar_suleiman: "President Omar Suleiman"
 EGY_president_omar_suleiman_desc: "Hosni Mubarak retires and hands power to his intelligence chief. The security state now governs in its own name."
 EGY_suleiman_the_security_republic: "The Security Republic"
 EGY_suleiman_the_security_republic_desc: "President Suleiman rules through the institutions he knows best. The intelligence service gains a free hand, and dissent finds less room than ever."
 EGY_suleiman_order_and_continuity: "Order and Continuity"
 EGY_suleiman_order_and_continuity_desc: "Under Suleiman the regime has outlived its founder. Order is guaranteed, though the economy pays for the soldiers' share of the state."
 EGY_the_sixth_term: "The Sixth Term"
 EGY_the_sixth_term_desc: "No heir is ready, and the factions cannot agree on one. Mubarak will run again in 2011 for a sixth term."
 EGY_father_of_the_nation: "Father of the Nation"
 EGY_father_of_the_nation_desc: "Mubarak presents himself as the father of all Egyptians, above parties and factions. His age is the only question his regime cannot answer."
 EGY_succession_bop: "The Succession Question"
 EGY_succession_bop_desc: "The New Guard of Gamal Mubarak, the Nazif cabinet and the tycoons competes with the Old Guard of the army, General Intelligence and the Interior Ministry for control of the regime and the succession."
 EGY_old_guard_bop_side: "The Old Guard"
 EGY_new_guard_bop_side: "The New Guard"
 EGY_succession_contested_range: "Contested Succession"
 EGY_succession_contested_range_desc: "Neither guard dominates, and Mubarak arbitrates between them."
 EGY_old_guard_leaning_range: "Old Guard Ascendant"
 EGY_old_guard_leaning_range_desc: "The generals and security chiefs carry more weight in the regime than the reformers."
 EGY_old_guard_dominant_range: "Old Guard Dominant"
 EGY_old_guard_dominant_range_desc: "The army and the security services control the regime and the succession."
 EGY_new_guard_leaning_range: "New Guard Ascendant"
 EGY_new_guard_leaning_range_desc: "Gamal Mubarak's circle sets the agenda in the cabinet and the party."
 EGY_new_guard_dominant_range: "New Guard Dominant"
 EGY_new_guard_dominant_range_desc: "The reformers and businessmen of the New Guard control the regime and the succession."
 EGY_mubarak_modifier: "Mubarak's Presidency"
 EGY_mubarak_modifier_desc: "Hosni Mubarak rules through a personal presidency built on loyal institutions, foreign patrons and the cult of the October pilot.\n§W--------------§!\nThis modifier is §RRemoved§! when Hosni Mubarak leaves office."
 EGY_political_modifier: "The Egyptian State"
 EGY_political_modifier_desc: "Ministries, security services and economic reforms built under the Mubarak presidency outlast any single leader."
 EGY_emergency_law_idea: "The Emergency Law"
 EGY_emergency_law_idea_desc: "The state of emergency declared after the assassination of Anwar Sadat in 1981 has never been lifted. It permits detention without trial and sends civilians to state security courts.\n§W--------------§!\nThis national spirit will be §RRemoved§! if we complete the §Y$EGY_replace_the_emergency_law$§! focus."
 EGY_post_float_inflation_idea: "After the Float"
 EGY_post_float_inflation_idea_desc: "The cheaper pound makes our exports competitive and attracts investors, while the price of imported food and fuel climbs."
 EGY_nazif_boom_idea: "The Nazif Boom"
 EGY_nazif_boom_idea_desc: "Investment and growth surge under the reformist government, though the gains are unevenly shared."
 EGY_pledge_investment_idea: "A Thousand Factories"
 EGY_pledge_investment_idea_desc: "The President delivered the factories he promised in 2005. Investors read it as proof that the state backs industry, and new plants follow the old ones into the industrial zones of 10th of Ramadan and 6th of October."
 EGY_emergency_transition_idea: "Emergency Law Transition"
 EGY_emergency_transition_idea_desc: "The security services adjust to new limits on their powers, and the transition unsettles the country."
 EGY_darfur_contingent_idea: "Darfur Contingent"
 EGY_darfur_contingent_idea_desc: "Egyptian battalions serve with the peacekeeping mission in Darfur. The rotations give our officers and soldiers field experience that exercises at home cannot match."
 EGY_sudan_volunteer_force_idea: "Sudan Expeditionary Force"
 EGY_sudan_volunteer_force_idea_desc: "Our officers and units stand ready to deploy to Sudan at short notice, whether to monitor a ceasefire or to support Khartoum."
 EGY_rigged_parliament_idea: "A Parliament Without Opposition"
 EGY_rigged_parliament_idea_desc: "The 2010 elections shut the opposition out of parliament, and its anger moves to the streets."
 EGY_may_day_bonus_idea: "The May Day Bonus"
 EGY_may_day_bonus_idea_desc: "A large raise for public sector workers eases the pain of rising prices, at a cost to the budget."
 EGY_three_capstones_tt: "Has completed at least §Y3§! of these focuses: §YThe Seven Percent Economy§!, §YThe Dominant Party§!, §YThe Controlled Opening§!, §YThe Security Pact§!, §YThe Social Contract§!, §YEgypt, Pivot of the Region§! and §YThe Pilot of October§!"
 EGY_mubarak_strength_above_59_tt: "§YMubarak's Strength§! is at least §Y60§!"
 EGY_eu_members_opinion_tt: "Every member of the §YEuropean Union§! gains a better opinion of us.\n"
 EGY_gulf_yearly_dividends_tt: "Each Gulf partner that keeps its money in Egypt pays out a yearly dividend, each at a different time of the year. A partner that turns hostile or goes to war with us pulls its money out.\n"
 EGY_arab_league_influence_tt: "Our influence grows in every member of the §YArab League§!.\n"
 EGY_sudan_peace_brought_forward_tt: "§HJoint Peace Plan§!: [SUD.GetFlag] [SUD.GetNameDef] and then [SSU.GetFlag] [SSU.GetNameDef] receive the Egyptian-Libyan proposal.\n - §GBoth accept§!: the §YComprehensive Peace Agreement§! arrives §G365§! days sooner, and a constitutional conference follows in which Egypt chooses which side to favor.\n - §YOne accepts§!: Egypt and Libya back that side with the §YSudan Expeditionary Force§! for §Y365§! days and stop sending volunteers to the side that refused.\n - §RBoth refuse§!: the initiative collapses and Egypt must choose its answer, from IGAD mediation to war on Khartoum.\n"
 EGY_libyan_plan_khartoum_accepts_tt: "The plan is passed on to [SSU.GetNameDef].\n"
 EGY_libyan_plan_khartoum_rejects_tt: "[SSU.GetNameDef] is told that [SUD.GetNameDef] has refused the plan.\n"
 EGY_libyan_plan_backs_khartoum_tt: "Egypt and Libya back [SUD.GetNameDef] with volunteers and influence and can no longer send volunteers to [SSU.GetNameDef].\n"
 EGY_libyan_plan_backs_khartoum_alone_tt: "Egypt backs [SUD.GetNameDef] with volunteers and influence and can no longer send volunteers to [SSU.GetNameDef].\n"
 EGY_libyan_plan_backs_splm_tt: "Egypt and Libya back [SSU.GetNameDef] with volunteers and influence and can no longer send volunteers to [SUD.GetNameDef].\n"
 EGY_libyan_plan_backs_splm_alone_tt: "Egypt backs [SSU.GetNameDef] with volunteers and influence and can no longer send volunteers to [SUD.GetNameDef].\n"
 EGY_libyan_plan_collapses_tt: "Egypt and Libya must decide how to answer the double refusal.\n"
 EGY_libyan_plan_collapses_alone_tt: "Egypt must decide how to answer the double refusal.\n"
 EGY_sudan_initiative_go_alone_tt: "Egypt can instead carry the plan to Khartoum alone. Unless we have a stronger army and a larger economy than [LBA.GetNameDef], both Sudanese sides are §Rless likely§! to accept it.\n"
 EGY_sudan_initiative_weaker_tt: "Without Libyan backing, and without a stronger army and a larger economy than [LBA.GetNameDef], [SUD.GetNameDef] and [SSU.GetNameDef] are §Rless likely§! to accept the plan.\n"
 EGY_libyan_plan_refused_desc: "Egypt and Libya have backed the opposing side of the Sudanese civil war."
 EGY_libyan_plan_took_sides_opinion: "Egypt and Libya took sides against us"
 EGY_halaib_egyptianized_opinion: "Egyptianization of Hala'ib"
 EGY_armed_darfur_rebels_opinion: "Armed the Darfur rebels"
 EGY_au_members_opinion_tt: "Every member of the §YAfrican Union§! gains a better opinion of us.\n"
 EGY_sudan_can_request_support_tt: "[SUD.GetNameWithFlag] can §Grequest§! arms, a military attaché and volunteers from us.\n"
 EGY_lower_sinai_bombing_risk_tt: "Terrorist bombings in Sinai become §Gless likely§!.\n"
 EGY_lower_rafah_breach_risk_tt: "The monthly chance of a Rafah border breach falls from §R3%§! to §G1%§!.\n"
 EGY_no_rafah_breach_tt: "With the crossing open, the Rafah border will §Gno longer be breached§!.\n"
 EGY_gaza_influence_bonus_tt: "Our influence gains in §Y[ISR.GetNameWithFlag]§!, §Y[PAL.GetNameWithFlag]§! and §Y[HAM.GetNameWithFlag]§! are §G15%§! more effective.\n"
 EGY_seal_rafah_influence_tt: "Our influence gains in §Y[ISR.GetNameWithFlag]§! are a further §G10%§! more effective.\n"
 EGY_open_rafah_influence_tt: "Our influence gains in §Y[PAL.GetNameWithFlag]§! and §Y[HAM.GetNameWithFlag]§! are a further §G10%§! more effective.\n"
 EGY_barracks_bargain_budget_tt: "Cutting military spending below its 2000 level will cost §R2§! military opinion each month.\n"
 EGY_question_of_2011_tt: "The §YSuccession Question§! decides which path opens. §YGamal's Moment§! needs the New Guard at §Y30§! or more, §YThe General's Succession§! needs the Old Guard at §Y30§! or more (or §YSuleiman§! as vice president), and §YThe Sixth Term§! is always open.\n"
 EGY_gamal_becomes_president_tt: "§YGamal Mubarak§! becomes President of Egypt.\n"
 EGY_suleiman_becomes_president_tt: "§YOmar Suleiman§! becomes President of Egypt.\n"
