 light_tank_afv_automatic_loading_desc: "Система автоматического заряжания позволяет эффективно повысить боеспособность машины в военное время."
 afv_gasoline_engine_gen1: "Послевоенный бензиновый двигатель"
 afv_gasoline_engine_gen1_desc: "Средний бензиновый двигатель или набор из нескольких небольших двигателей, обладающих достаточной мощностью для движения легких транспортных средств."
 afv_gasoline_engine_gen2: "Бензиновый двигатель ранней холодной войны"
 afv_gasoline_engine_gen2_desc: "Улучшенная и более мощная версия бензинового двигателя для легких автомобилей."
 afv_gasoline_engine_gen3: "Бензиновый двигатель поздней холодной войны"
 afv_gasoline_engine_gen3_desc: "Редкое решение в наше время, эти высокоэффективные двигатели помогают легким автомобилям двигаться с отличной скоростью."
 tank_diesel_engine_gen1: "V12 без наддува"
 tank_diesel_engine_gen1_desc: "Обычный V12 без наддува использовался во Второй Мировой Войне и начале Холодной войны. Способен выдавать примерно от 500 до 600 л.с.\n\n§GПодсказка дизайнера: дизельные двигатели – это чаще всего основные танковые двигатели.§!"
 tank_diesel_engine_gen2: "V12 с турбонаддувом"
 tank_diesel_engine_gen2_desc: "С добавлением турбонаддува к дизельному двигателю V12 в камеру сгорания попадает больше воздуха, что увеличивает мощность двигателя. Они широко использовались на танках середины Холодной войны. Выдает около 800 л.с.\n\n§GПодсказка дизайнера: дизельные двигатели – это чаще всего основные танковые двигатели.§!"
 tank_diesel_engine_gen3: "V12 с двойным турбонаддувом"
 tank_diesel_engine_gen3_desc: "С добавлением второго турбонаддува можно получить еще больше мощности. Технологии подобного двигателя появились в конце 1980-ых. Двигатель может развивать мощность почти до 1000 л.с.\n\n§GПодсказка дизайнера: дизельные двигатели – это чаще всего основные танковые двигатели.§!"
 tank_diesel_engine_gen4: "V12 с нагнетателем"
 tank_diesel_engine_gen4_desc: "Замена турбонаддува на компрессор повысит мощность двигателя ещё больше. Это было распространено в танках начала 2000-х годов и позволяло достигать мощности до 1100 л.с.\n\n§GПодсказка от разработчика: Многофункциональные дизельные двигатели являются стандартом для танков.§!"
 tank_diesel_engine_gen5: "V12 с нагнетателем и двойным инжектором"
 tank_diesel_engine_gen5_desc: "С принятием технологий из легкого машиностроения можно сделать двигатели более эффективными и контролируемыми. С помощью этих двигателей с электронным управлением танк сможет развивать мощность до 1200 л.с.\n\n§GПодсказка дизайнера: дизельные двигатели – это чаще всего основные танковые двигатели.§!"
 tank_diesel_engine_gen6: "X12 с турбонаддувом"
 tank_diesel_engine_gen6_desc: "В двигателе X12 поршни расположены в рядах по 3, в форме буквы Х. Это одна из последних инновационных разработок в сфере танкостроения. Новейшая инновация в технологии танковых двигателей, способная выдавать 1500 л.с.\n\n§GПодсказка дизайнера: дизельные двигатели – это чаще всего основные танковые двигатели.§!"
 tank_diesel_engine_gen7: "X12 с нагнетателем"
 tank_diesel_engine_gen7_desc: "Нагнетатели на X12 могут создать невообразимую мощность для двигателя. Мощь и скорость!\n\n§GПодсказка дизайнера: дизельные двигатели – это чаще всего основные танковые двигатели.§!"
 tank_gas_turbine_engine_gen1: "Газотурбинный двигатель 1950-ых"
 tank_gas_turbine_engine_gen1_desc: "Ненадежный и громоздкий ранний газотурбинный двигатель, взятый из авиационной промышленности.\n\n§GПодсказка дизайнера: Газовые турбины имеют лучшее ускорение, чем дизельные двигатели, улучшая маневренность транспорта. Однако они дороги в производстве и потребляют много топлива. Используйте газовые турбины, если вам нужны быстрые танки и вы можете обеспечить их топливом§!"
 tank_gas_turbine_engine_gen2: "Газотурбинный двигатель 1980-ых"
 tank_gas_turbine_engine_gen2_desc: "Улучшенная конструкция устраняет большинство недостатков конструкции турбины и делает ее более пригодной для использования в полевых условиях.\n\n§GПодсказка дизайнера: Газовые турбины имеют лучшее ускорение, чем дизельные двигатели, улучшая маневренность транспорта. Однако они дороги в производстве и потребляют много топлива. Используйте газовые турбины, если вам нужны быстрые танки и вы можете обеспечить их топливом§!"
 tank_gas_turbine_engine_gen3: "Газотурбинный двигатель 1990-ых"
 tank_gas_turbine_engine_gen3_desc: "Конструкция турбины 1980-ых годов, ориентированная на повышение выходной мощности и эффективности.\n\n§GПодсказка дизайнера: Газовые турбины имеют лучшее ускорение, чем дизельные двигатели, улучшая маневренность транспорта. Однако они дороги в производстве и потребляют много топлива. Используйте газовые турбины, если вам нужны быстрые танки и вы можете обеспечить их топливом§!"
 tank_gas_turbine_engine_gen4: "Газотурбинный двигатель 2000-ых"
 tank_gas_turbine_engine_gen4_desc: "Газовая турбина с хорошей надежностью и отличной выходной мощностью.\n\n§GПодсказка дизайнера: Газовые турбины имеют лучшее ускорение, чем дизельные двигатели, улучшая маневренность транспорта. Однако они дороги в производстве и потребляют много топлива. Используйте газовые турбины, если вам нужны быстрые танки и вы можете обеспечить их топливом§!"
 tank_gas_turbine_engine_gen5: "Современный газотурбинный двигатель"
 tank_gas_turbine_engine_gen5_desc: "Последнее слово техники в газовых турбинах.\n\n§GПодсказка дизайнера: Газовые турбины имеют лучшее ускорение, чем дизельные двигатели, улучшая маневренность транспорта. Однако они дороги в производстве и потребляют много топлива. Используйте газовые турбины, если вам нужны быстрые танки и вы можете обеспечить их топливом§!"
 tank_gas_turbine_engine_gen6: "Низкофрикционный газотурбинный двигатель"
 tank_gas_turbine_engine_gen6_desc: "С помощью современных материалов можно снизить трение в газовой турбине, что позволяет повысить выходную мощность и эффективность использования топлива.\n\n§GПодсказка дизайнера: Газовые турбины имеют лучшее ускорение, чем дизельные двигатели, улучшая маневренность транспорта. Однако они дороги в производстве и потребляют много топлива. Используйте газовые турбины, если вам нужны быстрые танки и вы можете обеспечить их топливом§!"
 tank_electric_engine_gen1: "Ранний электрический двигатель"
 tank_electric_engine_gen1_desc: "Первый электрический привод. Хотя до сих пор он использовался только в вспомогательных системах, теперь у нас есть технология, чтобы питать весь танк.\n\n§GЭлектрические двигатели — это футуристичный вариант питания для ваших танков. Хотя их использование дорогое, они требуют минимум топлива. Оснащайте свои танки электрическими двигателями, если хотите экономить на топливе.§!"
 tank_electric_engine_gen2: "Улучшенный электрический двигатель"
 tank_electric_engine_gen2_desc: "Улучшенная версия электрического двигателя с повышенной надежностью.\n\n§GЭлектрические двигатели - это футуристичный вариант питания ваших танков. Хотя они дороги в использовании, они практически не требуют топлива. Оборудуйте свои танки электрическими двигателями, если хотите сэкономить на топливе§!"
 tank_small_medium_cannon: "Лёгкая танковая пушка ранней ХВ"
 tank_small_medium_cannon_desc: "Легкая танковая пушка была обычной для танков начала холодной войны. Стандартные калибры были по 100 мм для Советского Союза и по 105 мм для западных стран, обе пушки обладали достаточной огневой мощью, чтобы справиться как с транспортными средствами, так и с пехотой того времени.\n\n§GПодсказка дизайнера: Орудия малого калибра подходят для осколочно-фугасных снарядов из-за меньшей начальной скорости. Используйте их, если хотите отдать предпочтение атаке по пехоте перед атакой по бронетехнике§!"
 tank_small_medium_cannon_2: "Орудие поздней холодной войны лёгкого танка"
 tank_small_medium_cannon_2_desc: "Благодаря улучшенному литью и тепловым рукавам к концу холодной войны танковые пушки могли выдерживать более высокую скорострельность до выхода из строя.\n\n§GПодсказка дизайнера: Орудия малого калибра подходят для осколочно-фугасных снарядов из-за меньшей начальной скорости. Используйте их, если хотите отдать предпочтение атаке по пехоте перед атакой по бронетехнике§!"
 tank_small_medium_cannon_3: "Современное орудие лёгкого танка"
 tank_small_medium_cannon_3_desc: "Оснащенная длинноходовым импульсным механизмом с низкой отдачей и улучшенной казенной частью, современная пушка легкого танка эффективна даже против более тяжелых машин, особенно с улучшенными боеприпасами.\n\n§GПодсказка дизайнера: Орудия малого калибра подходят для осколочно-фугасных снарядов из-за меньшей начальной скорости. Используйте их, если хотите отдать предпочтение атаке по пехоте перед атакой по бронетехнике§!"
 tank_small_medium_cannon_4: "Передовая пушка для лёгкого танка"
 tank_small_medium_cannon_4_desc: "Благодаря увеличенной дульной скорости и элементам, заимствованным у основных танковых орудий, легкая танковая пушка будущего сможет ответить практически на любую угрозу на поле боя.\n\n§GПодсказка дизайнера: Орудия малого калибра подходят для осколочно-фугасных снарядов из-за меньшей начальной скорости. Используйте их, если хотите отдать предпочтение атаке по пехоте перед атакой по бронетехнике§!"
 tank_small_cannon: "Лёгкая танковая пушка ранней ХВ"
 tank_small_cannon_desc: "Основные орудия первых легких танков часто модифицировались из другой буксируемой артиллерии."
 tank_small_cannon_2: "Орудие поздней холодной войны лёгкого танка"
 tank_small_cannon_2_desc: "Основным орудием легкого танка часто является орудие низкого давления, которое обеспечивает меньший общий вес и меньшую отдачу."
 tank_small_cannon_3: "Современное орудие лёгкого танка"
 tank_small_cannon_3_desc: "В современных основных орудиях легких танков используются передовые материалы и конструкции, которые позволяют значительно улучшить огневую мощь и дальность стрельбы."
 tank_small_cannon_4: "Передовая пушка для лёгкого танка"
 tank_small_cannon_4_desc: "Внедрение нанотехнологий и компьютерного проектирования позволило добиться беспрецедентного прогресса в создании основных орудий будущих легких танков, еще больше повысив живучесть и производительность легких танков."
 tank_medium_cannon: "Средняя танковая пушка ранней ХВ"
 tank_medium_cannon_desc: "С развитием композитной брони потребовалась более мощная пушка, чтобы пробить больше брони, чем пушка легкого танка. В то время как Советский Союз начал со 115-мм пушки на Т-62, они быстро перешли на 125-мм основную пушку. Западные страны быстро последовали их примеру со своей 120-мм пушкой. С тех пор пушка среднего танка стала наиболее распространенным выбором для вооружения танка.\n\n§GПодсказка дизайнера: Орудия среднего калибра — сбалансированное танковое вооружение. Используйте их, если не хотите отдавать предпочтение ни атаке по пехоте, ни атаке по бронетехнике§!"
 tank_medium_cannon_2: "Орудие поздней холодной войны среднего танка"
 tank_medium_cannon_2_desc: "С хромированным стволом и большей длиной это оружие способно выдерживать более высокое давление в камере. Благодаря этому повышенному давлению и новейшим подкалиберным снарядам из карбида вольфрама, это оружие способно пробивать более 10 дюймов стальной брони.\n\n§GПодсказка дизайнера: Орудия среднего калибра — сбалансированное танковое вооружение. Используйте их, если не хотите отдавать предпочтение ни атаке по пехоте, ни атаке по бронетехнике§!"
 tank_medium_cannon_3: "Современное орудие среднего танка"
 tank_medium_cannon_3_desc: "Благодаря современным «умным» боеприпасам и улучшенным материалам современная пушка среднего танка может пробить почти 40 дюймов стальной брони на более коротких дистанциях и может стрелять различными противотанковыми и противопехотными снарядами.\n\n§GПодсказка дизайнера: Орудия среднего калибра — сбалансированное танковое вооружение. Используйте их, если не хотите отдавать предпочтение ни атаке по пехоте, ни атаке по бронетехнике§!"
 tank_medium_cannon_4: "Передовая пушка для среднего танка"
 tank_medium_cannon_4_desc: "Благодаря использованию электротермохимической тяги танковая пушка будущего сможет развивать невероятно высокую начальную скорость снаряда, поскольку снаряд будет разгоняться по всей длине ствола.\n\n§GПодсказка дизайнера: Орудия среднего калибра — сбалансированное танковое вооружение. Используйте их, если не хотите отдавать предпочтение ни атаке по пехоте, ни атаке по бронетехнике§!"
 tank_large_cannon: "Раннее орудие тяжёлого танка"
 tank_large_cannon_desc: "Поскольку в 1990-х годах возникла необходимость в увеличении пробивной способности, была разработана тяжелая танковая пушка диаметром от 130 до 135 мм.\n\n§GПодсказка дизайнера: Тяжёлые орудия предназначены в первую очередь для борьбы с бронетехникой. Используйте их, если хотите сделать упор на атаку по бронетехнике, сохранив при этом некоторую атаку по пехоте§!"
 tank_large_cannon_2: "Улучшенное орудие тяжёлого танка"
 tank_large_cannon_2_desc: "Новейшие сплавы и улучшенные боеприпасы позволяют тяжелым орудиям второго поколения обрушить на врагов настоящий шквал огня.\n\n§GПодсказка дизайнера: Тяжёлые орудия предназначены в первую очередь для борьбы с бронетехникой. Используйте их, если хотите сделать упор на атаку по бронетехнике, сохранив при этом некоторую атаку по пехоте§!"
 tank_large_cannon_3: "Усовершенствованное орудие тяжёлого танка"
 tank_large_cannon_3_desc: "Благодаря улучшенной конструкции снаряды, выпущенные из усовершенствованной тяжелой танковой пушки, будут эффективны как против техники, так и против пехоты.\n\n§GПодсказка дизайнера: Тяжёлые орудия предназначены в первую очередь для борьбы с бронетехникой. Используйте их, если хотите сделать упор на атаку по бронетехнике, сохранив при этом некоторую атаку по пехоте§!"
 tank_very_large_cannon: "Раннее сверхтяжёлое орудие"
 tank_very_large_cannon_desc: "Это орудие высокого калибра способно уничтожить практически все. С калибром 152 мм, даже если оно не пробьет броню, она снесет орудие и расколет броню с большого расстояния.\n\n§GПодсказка дизайнера: Сверхтяжёлые орудия предназначены для борьбы с бронетехникой. Используйте их, если хотите сделать значительный упор на атаку по бронетехнике в ущерб атаке по пехоте§!"
 tank_very_large_cannon_2: "Улучшенное сверхтяжёлое орудие"
 tank_very_large_cannon_2_desc: "Благодаря новейшим боеприпасам и компьютерным разработкам, примененным к существующим орудиям высокого калибра, эта пушка - лучшее, что может использовать армия для борьбы с бронетехникой.\n\n§GПодсказка дизайнера: Сверхтяжёлые орудия предназначены для борьбы с бронетехникой. Используйте их, если хотите сделать значительный упор на атаку по бронетехнике в ущерб атаке по пехоте§!"
 tank_very_large_cannon_3: "Усовершенствованное сверхтяжёлое орудие"
 tank_very_large_cannon_3_desc: "Благодаря дополнительному электромагнитному ускорению снаряда, сверхтяжелая танковая пушка сможет пробивать своими снарядами броню, здания и даже бункеры.\n\n§GПодсказка дизайнера: Сверхтяжёлые орудия предназначены для борьбы с бронетехникой. Используйте их, если хотите сделать значительный упор на атаку по бронетехнике в ущерб атаке по пехоте§!"
 art_small_gun_gen3: "Современная лёгкая гаубица"
 art_small_gun_gen3_desc: "Ствол, изготовленный для стрельбы из более легкой машины, подготовленный для быстрой стрельбы несколькими выстрелами с минимальным временем простоя и с эффективной системой гашения отдачи."
 art_small_gun_gen4: "Усовершенствованная лёгкая гаубица"
 art_small_gun_gen4_desc: "Модернизация концепции легкой артиллерии привела к созданию этого артиллерийского орудия, подготовленного для ведения быстрого огня и достаточно легкого, чтобы не замедлять платформу при перемещении."
 art_small_gun_gen5: "Передовая лёгкая гаубица"
 art_small_gun_gen5_desc: "Лучшие образцы продукции нашего производственного комплекса – эти мобильные артиллерийские орудия будут обрушивать снаряды на любую цель."
 art_med_gun_gen1: "Гаубица начала холодной войны"
 art_med_gun_gen1_desc: "Самое тяжелое артиллерийское орудие Второй мировой войны, едва приспособленное для стрельбы с гусеничной платформы. Не рекомендуется стоять где-либо рядом с машиной, когда она стреляет."
 art_med_gun_gen2: "Гаубица времен холодной войны"
 art_med_gun_gen2_desc: "Тяжёлые гаубицы времён Второй мировой войны, адаптированные для установки на гусеничную технику в качестве артиллерийских орудий. Благодаря доработкам вести огонь стало значительно безопаснее для расчёта, поэтому теперь можно находиться гораздо ближе к орудию. Задний упор для компенсации отдачи также входит в комплект."
 art_med_gun_gen3: "Современная гаубица"
 art_med_gun_gen3_desc: "Настоящее артиллерийское орудие среднего калибра, изготовленное специально для нужд современной армии. Мобильность и надежность в сочетании с огневой мощью - идеальное сочетание."
 art_med_gun_gen4: "Усовершенствованная гаубица"
 art_med_gun_gen4_desc: "Среднекалиберное артиллерийское орудие для современных вооруженных сил, механизмы орудия усовершенствованы, поэтому оно может стрелять улучшенными снарядами с лучшим воздействием на цель."
 art_med_gun_gen5: "Передовая гаубица"
 art_med_gun_gen5_desc: "Вершина артиллерийских орудий среднего калибра, это орудие сделает так, что на обстреливаемой им территории останется только пыль и земля."
 art_big_gun_gen3: "Современная гаубица"
 art_big_gun_gen3_desc: "Дальнобойное артиллерийское орудие, подготовленное для обстрела вражеских позиций самыми тяжелыми снарядами. Улучшено гашение отдачи, однако из-за большого калибра орудие все еще относительно медленно стреляет."
 art_big_gun_gen4: "Усовершенствованная гаубица"
 art_big_gun_gen4_desc: "Усовершенствование механизмов стрельбы тяжелых гаубиц привело к созданию тяжелых артиллерийских систем, способных вести огонь с приемлемой скоростью, сохраняя при этом тяжелые снаряды, предназначенные для поражения самых тяжелых целей."
 art_big_gun_gen5: "Передовая гаубица"
 art_big_gun_gen5_desc: "Совершенствование тяжелых стволов и механизмов стрельбы привело к созданию тяжелой дальнобойной артиллерии, чрезвычайно эффективной для тех случаев, когда необходимо действительно уничтожить цель."
 art_med_rocket_gen1: "РСЗО начала холодной войны"
 art_med_rocket_gen1_desc: "Первые ракеты 200-300 мм, обычно запускаемые с модифицированных платформ 100-200 мм, с меньшим количеством труб, но с большим мощностью взрыва и фрагментации."
 art_med_rocket_gen2: "РСЗО холодной войны"
 art_med_rocket_gen2_desc: "Разработка пусковых систем для ракет среднего размера повышает общую эффективность этих платформ наряду с их стоимостью. Благодаря улучшенной дальности и совместимости с более широким спектром боеголовок и ракет, они идеально подходят для выполнения широкого спектра огневых задач. Используются для поражения целей на большой площади."
 art_med_rocket_gen3: "Современные РСЗО"
 art_med_rocket_gen3_desc: "Модернизация пусковых установок и их систем привела к появлению средних РСЗО, которые могут использоваться на гораздо большей дальности с повышенной точностью благодаря более совершенным ракетам и боеголовкам, подготовленным для поражения целей на средних и дальних дистанциях."
 art_med_rocket_gen4: "Усовершенствованная РСЗО"
 art_med_rocket_gen4_desc: "Большие средние системы РСЗО, увеличивающие количество труб, вместе с большими боеголовками, чтобы нанести как можно больше повреждений при сохранении эффективности."
 art_med_rocket_gen5: "Передовая РСЗО"
 art_med_rocket_gen5_desc: "Среднеразмерная РСЗО, готовая к одновременной стрельбе несколькими различными ракетами. Эти пусковые установки готовы к перезарядке гораздо быстрее, чем обычные, поэтому способны вести непрерывный огонь без необходимости совместного использования нескольких платформ."
 direct_fire_conversion: "Модуль прямого огня"
 direct_fire_conversion_desc: "Благодаря увеличению угла наклона орудия, артиллерийское орудие можно использовать в режиме прямого огня в чрезвычайных ситуациях. Это позволит легче поражать труднодоступные цели, но возможность вести огонь прямой наводкой снизит некоторые возможности артиллерии в режиме непрямого огня."
 direct_fire_conversion_medium: "Модуль прямого огня"
 direct_fire_conversion_medium_desc: "Благодаря увеличению угла наклона орудия, артиллерийское орудие можно использовать в режиме прямого огня в чрезвычайных ситуациях. Это позволит легче поражать труднодоступные цели, но возможность вести огонь прямой наводкой снизит некоторые возможности артиллерии в режиме непрямого огня."
 mortar_barrel_conversion_small: "Ствол Легкого миномета"
 mortar_barrel_conversion_small_desc: "Заменив гаубицу на аналогичный по размерам миномет, мы можем улучшить скорострельность и дугу стрельбы артиллерии. Однако поддерживать атаки с большого расстояния становится сложнее."
 mortar_barrel_conversion: "Ствол Тяжёлого миномета"
 mortar_barrel_conversion_desc: "Заменив гаубицу на аналогичный по размерам миномет, мы можем улучшить скорострельность и дугу стрельбы артиллерии. Однако поддерживать атаки с большого расстояния становится сложнее."
 gun_barrel_conversion: "Ствол Орудия"
 gun_barrel_conversion_desc: "Пушка длиннее классической гаубицы, имеет меньший угол возвышения, что позволяет ей быть немного более точной за счет эксплуатационных ограничений и хорошо подходит для ведения боя на средних дистанциях."
 thermobaric_ammo_conversion: "Термобарические боеприпасы"
 thermobaric_ammo_conversion_desc: "Термобарические ракеты являются разрушительным противопехотным оружием. Когда ракета поражает цель, небольшой первичный взрыв создает облако испарившегося топлива. Затем вторичный взрыв поджигает топливо, образуя огненный шар. Огонь уничтожает весь кислород вокруг себя и достаточно горяч, чтобы испарять человеческие тела."
 thermobaric_ammo_conversion_small: "Термобарические боеприпасы"
 thermobaric_ammo_conversion_small_desc: "Термобарические ракеты являются разрушительным противопехотным оружием. Когда ракета поражает цель, небольшой первичный взрыв создает облако испарившегося топлива. Затем вторичный взрыв поджигает топливо, образуя огненный шар. Огонь уничтожает весь кислород вокруг себя и достаточно горяч, чтобы испарять человеческие тела."
 double_caliber_ammo_conversion: "Многокалиберные ракеты"
 double_caliber_ammo_conversion_desc: "Адаптация ракетной установки, позволяющая стрелять патронами нескольких калибров из одной пусковой установки, даст нам больше гибкости на поле боя. Однако это замедлит наше продвижение, поскольку нам придется тащить с собой вдвое больше боеприпасов."
 burst_fire_gun_medium_gen1: "Ранний режим стрельбы очередями"
 burst_fire_gun_medium_gen1_desc: "Благодаря усовершенствованному компьютеру наведения и автозаряду артиллерия может производить несколько выстрелов подряд по одной и той же цели, обеспечивая максимальное подавление."
 burst_fire_gun_medium_gen2: "Улучшенный режим стрельбы очередями"
 burst_fire_gun_medium_gen2_desc: "Благодаря усовершенствованному компьютеру наведения и автозаряду артиллерия может производить несколько выстрелов подряд по одной и той же цели, обеспечивая максимальное подавление."
 burst_fire_gun_medium_gen3: "Усовершенствованный режим стрельбы очередями"
 burst_fire_gun_medium_gen3_desc: "Благодаря усовершенствованному компьютеру наведения и автозаряду артиллерия может производить несколько выстрелов подряд по одной и той же цели, обеспечивая максимальное подавление."
 multiple_rounds_medium_gen1: "Ранний режим множественного воздействия"
 multiple_rounds_medium_gen1_desc: "Путем последовательной стрельбы несколькими снарядами с разными зарядами топлива и разными дугами стрельбы можно добиться одновременного попадания всех выпущенных снарядов в цель. Для этого требуется высококвалифицированный экипаж и современный баллистический компьютер."
 multiple_rounds_medium_gen2: "Улучшенный режим множественного воздействия"
 multiple_rounds_medium_gen2_desc: "Путем последовательной стрельбы несколькими снарядами с разными зарядами топлива и разными дугами стрельбы можно добиться одновременного попадания всех выпущенных снарядов в цель. Для этого требуется высококвалифицированный экипаж и современный баллистический компьютер."
 multiple_rounds_medium_gen3: "Усовершенствованный режим множественного воздействия"
 multiple_rounds_medium_gen3_desc: "Путем последовательной стрельбы несколькими снарядами с разными зарядами топлива и разными дугами стрельбы можно добиться одновременного попадания всех выпущенных снарядов в цель. Для этого требуется высококвалифицированный экипаж и современный баллистический компьютер."
 tank_base_tank_turret: "Сварная башня"
 tank_base_tank_turret_desc: "Башня, изготовленная из плоских броневых пластин, сваренных вместе под углом для максимального увеличения внутреннего пространства и эффективности брони. Сварные башни позволяют создавать индивидуальные схемы защиты, облегчают интеграцию улучшений и улучшают эргономику экипажа. Хотя этот метод более трудоемкий в производстве, он обеспечивает превосходную защиту и модульность по сравнению с литыми конструкциями.\n\n§GПодсказка дизайнера: Это сбалансированная танковая башня как для атаки, так и для обороны. Используйте ее, если вы цените высокую стойкость и качество, а не количество ваших танков§!"
 tank_soviet_turret: "Литая башня"
 tank_soviet_turret_desc: "Цельная башня, сформированная путём заливки расплавленного металла в форму, создающая округлую структуру с равномерной толщиной брони. Хотя литые башни легче производить массово, они часто имеют ограниченное внутреннее пространство и меньшую оптимизацию брони по сравнению с более поздними конструкциями.\n\n§GПодсказка дизайнера: Это сбалансированная танковая башня как для атаки, так и для обороны. Используйте её, если вам нужно много танков и вы готовы поступиться качеством ради количества§!"
 tank_no_turret: "Без башни"
 tank_no_turret_desc: "Платформа с фиксированным вооружением, где основное вооружение устанавливается непосредственно в корпус без вращающейся башни. Такая конструкция снижает вес и механическую сложность, позволяя уменьшить силуэты, повысить надёжность и упростить производство. При более простом обслуживании она ограничивает дуги обстрела и требует смены позиции машины для поражения новых целей.\n\n§GПодсказка дизайнера: Такой модуль обычно встречается на БТР с пулемётным вооружением или на безбашенных самоходных орудиях§!"
 tank_oscillating_turret: "Качающаяся башня"
 tank_oscillating_turret_desc: "Необычная конструкция, в которой орудие закреплено в башне, а для наводки вся башня вращается на цапфе. Это придает орудию большую устойчивость и обеспечивает быстрое и гибкое наведение. Благодаря своей конструкции, цапфа оставляет кольцо башни открытым и слабо бронированным.\n\n§GПодсказка дизайнера: Используйте это, если вы хотите максимизировать урон вашего танка и использовать его исключительно в наступлении§!"
 tank_unmanned_turret: "Беспилотная башня"
 tank_unmanned_turret_desc: "Беспилотная башня управляется дистанционно из корпуса танка, обеспечивая экипажу более высокий уровень защиты. Поскольку внутри башни не требуется место для экипажа, её можно сделать компактнее и усилить бронирование. Однако обзор ухудшается, так как управление осуществляется по изображению с внешних камер.\n\n§GПодсказка дизайнера: необитаемая башня - оптимальный выбор для богатых стран. Используйте её, если хотите максимально повысить защищённость танка, ценой увеличения стоимости производства.§!"
 tank_steel_armor_gen1: "Первая стальная броня"
 tank_steel_armor_gen1_desc: "Первая кованая однородная броня (КОБ), использовавшаяся на танках первого поколения.\n\n§GПодсказка дизайнера: Стальная броня - это бюджетный вариант брони для танков. Она не сможет конкурировать с современной композитной бронёй.§!"
 tank_steel_armor_gen2: "Улучшенная стальная броня"
 tank_steel_armor_gen2_desc: "Улучшенные стальные сплавы и технологии литья обеспечивают лучшую прочность при том же объеме и массе.\n\n§GПодсказка дизайнера: Стальная броня - это бюджетный вариант брони для танков. Она не выдержит конкуренции с современной композитной бронёй.§!"
 tank_steel_armor_gen3: "Усовершенствованная Стальная Броня"
 tank_steel_armor_gen3_desc: "Включение дополнительных элементов в стальные сплавы позволяет повысить их прочность против разрушения и усталости.\n\n§GПодсказка дизайнера: Стальная броня - это дешёвый вариант брони для танков. Она не сможет обеспечить защиту на уровне современной композитной брони.§!"
 tank_composite_armor_gen1: "Композитная броня начала холодной войны"
 tank_composite_armor_gen1_desc: "Первые испытания композитной брони были проведены на американском тяжелом танке T95. Пластины из плавленого кварцевого стекла были установлены между стальными листами, обеспечивая повышенную защиту от пробития. Хотя эта броня так и не была использована в производстве, она послужила вдохновением для последующих разработок.\n\n§GПодсказка дизайнера: Композитная броня является стандартной опцией для современных основных боевых танков§!"
 tank_composite_armor_gen2: "Композитная броня времен холодной войны"
 tank_composite_armor_gen2_desc: "Замена кварцевого стекла на армированное пластиком стекло и добавление керамических корундовых пластин значительно повышает прочность брони.\n\n§GПодсказка дизайнера: Композитная броня является стандартным вариантом для современных основных боевых танков§!"
 tank_composite_armor_gen3: "Современная композитная броня"
 tank_composite_armor_gen3_desc: "Современная композитная броня состоит из керамических плиток внутри металлических сот с упругими пластинами, установленными с обеих сторон, и покрытых броневым слоем. Современная броня обеспечивает отличную защиту как от традиционных кинетических проникающих, так и от кумулятивных зарядов.\n\n§GПодсказка дизайнера: Композитная броня является стандартной опцией для современных основных боевых танков§!"
 tank_composite_armor_gen4: "Усовершенствованная композитная броня"
 tank_composite_armor_gen4_desc: "3D-печать, лазерное спекание и наноразмерный глиноземный порошок с углеродными нанотрубками обеспечивают современную броневую защиту наших танков.\n\n§GПодсказка дизайнера: Композитная броня является стандартным вариантом для современных основных боевых танков§!"
 tank_battlestation_1: "Тех. обеспечение 1950-ых"
 tank_battlestation_1_desc: "Радио и базовый баллистический компьютер.\n\n§GПодсказка дизайнера: Боевой пост представляет собой системы наведения, управления огнем, оптику и другое вспомогательное оборудование, необходимое для работы танка. Лучший боевой пост улучшит общую качество вашего танка§!"
 tank_battlestation_2: "Тех. обеспечение 1980-ых"
 tank_battlestation_2_desc: "Дублированное радиоборудование и полудигитальный баллистический компьютер.\n\n§GПодсказка дизайнера: Боевой пост представляет собой системы наведения, управления огнем, оптику и другое вспомогательное оборудование, необходимое для работы танка. Лучший боевой пост улучшит общую качество вашего танка§!"
 tank_battlestation_3: "Современное тех. обеспечение"
 tank_battlestation_3_desc: "Навигационная система, камеры и полностью цифровой баллистический компьютер.\n\n§GПодсказка дизайнера: Боевой пост представляет собой системы наведения, управления огнем, оптику и другое вспомогательное оборудование, необходимое для работы танка. Лучший боевой пост улучшит общую качество вашего танка§!"
 tank_battlestation_4: "Улучшенное тех. обеспечение"
 tank_battlestation_4_desc: "Комплект камер и передовых систем боевого наблюдения.\n\n§GПодсказка дизайнера: Обеспечение представляет собой артиллерийские системы, управление огнем, оптику и другое вспомогательное оборудование, необходимое для работы танка. Лучшая техника улучшит качество вашего танка в целом§!"
 smoke_launchers: "Первые дымовые гранатометы"
 smoke_launchers_desc: "Набор дымовых пусковых установок предназначен для прикрытия танка от прямого огня противника.\n\n§GПодсказка дизайнера: Добавление дымовых установок уменьшает видимость танка, делая его лучше как в обороне, так и в нападении§!"
 smoke_launchers_2: "Улучшенные дымовые завесы"
 smoke_launchers_2_desc: "Улучшенная химическая формула защищает танк и от инфракрасных прицелов.\n\n§GПодсказка дизайнера: Добавление дымовых пусковых установок уменьшает видимость танка, делая его лучше как в обороне, так и в нападении§!"
 reactive_armor_gen1: "Динамич. защита 1-го поколения"
 reactive_armor_gen1_desc: "Взрывчатое реактивное бронирование (ВРБ) состоит из кирпичей, сделанных из взрывчатых веществ на металлической раме, установленных на танке. Когда кирпич поражается кинетическим пробойником или кумулятивным зарядом, он взрывается, нейтрализуя incoming снаряд. Первые эксперименты были проведены в 60-х годах для борьбы с ранними кумулятивными зарядами, но ни один из них не был принят в производство.\n\n§GПодсказка дизайнера: Взрывчатое реактивное бронирование (ВРБ) — это простой способ улучшить броню вашего танка§!"
 reactive_armor_gen2: "Динамич. защита 2-го поколения"
 reactive_armor_gen2_desc: "Увеличив размеры блоков динамической защиты, а также добавив больше взрывчатого вещества и усилив их корпус, можно значительно повысить мощность срабатывания, что позволит эффективно противодействовать даже кинетическим боеприпасам.\n\n§GПодсказка дизайнера: Динамическая защита (ДЗ) - это простой способ повысить защищённость вашего танка.§!"
 reactive_armor_gen3: "Динамич. защита 3-го поколения"
 reactive_armor_gen3_desc: "С новой структурой динамическая защита может быть улучшена, чтобы лучше противостоять как снарядам, так и кумулятивным зарядам. Она может даже обеспечить защиту от тандемных кумулятивных зарядов, специально разработанных для противодействия этой защите.\n\n§GПодсказка дизайнера: Динамическая защита - это простой способ улучшить броню танка§!"
 reactive_armor_gen4: "Динамич. защита 4-го поколения"
 reactive_armor_gen4_desc: "Глубоко усовершенствованная динамическая защита, способная работать в различных условиях окружающей среды и снижать эффективность большей части входящего огня.\n\n§GСовет от разработчика: динамическая защита (ДЗ) — это простой способ улучшить броню вашего танка.§!"
 spaced_armor_gen1: "Ранняя разнесённая броня"
 spaced_armor_gen1_desc: "Решетчатое бронирование — это система брони, где на основное броневое покрытие накладывается дополнительная бронеплита с зазором между ними. Внешняя плита заставляет кумулятивный заряд детонировать раньше, что уменьшает глубину его проникновения. Раннее решетчатое бронирование — это просто тонкие бронеплиты.\n\n§GПодсказка дизайнера: Решетчатое бронирование — это бюджетная версия взрывчатого реактивного бронирования, чтобы обеспечить вашему танку дополнительную защиту§!"
 spaced_armor_gen2: "Улучшенная разнесённая броня"
 spaced_armor_gen2_desc: "Заменив массивные стальные пластины на сетку или клетку, мы сможем защитить наши танки от летящих боеголовок с меньшим весом.\n\n§GПодсказка дизайнера: Противокуммулятивная броня - это бюджетная версия динамической защиты для обеспечения большей защиты вашего танка§!"
 spaced_armor_gen3: "Современная разнесенная броня"
 spaced_armor_gen3_desc: "С помощью дополнительных керамических пластин и различных форм мы можем улучшить общую бронезащиту наших автомобилей..\n\n§GПодсказка дизайнера: Разнесенная броня - это бюджетная версия взрыво-реактивной брони, которая обеспечит вашему танку большую защиту§!"
 wet_ammo_storage: "Вышибные панели"
 wet_ammo_storage_desc: "При детонации боекомплекта вышибные панели направляют энергию взрыва наружу, предотвращая её распространение в боевое отделение. Это значительно повышает шансы экипажа на выживание даже при полном уничтожении танка.\n\n§GПодсказка дизайнера: вышибные панели значительно повышают живучесть танка и увеличивают вероятность выживания экипажа.§!"
 automatic_loading: "Система автозаряжения"
 automatic_loading_desc: "В системе автоматического заряжания, обычно встречающейся на советских и российских танках, механический подъемник автоматически втягивает новый снаряд в орудие. Из-за этого снаряды часто хранятся в карусели под орудием или рядом с ним. В танке с автоматом заряжания экипажу приходится делить отсек с боевыми боеприпасами. Хотя автомат заряжания обеспечивает гораздо лучшую скорострельность, чем ручное заряжание, проникающее попадание часто приводит к тому, что боеприпасы испаряются, а танк и его экипаж сжигаются дотла.\n\n§GПодсказка дизайнера: Автозарядка дает возможность вести более длительный огонь по целям, но увеличивает вероятность полной потери машины при повреждении§!"
 manual_loading: "Ручное заряжение"
 manual_loading_desc: "Человек-погрузчик. Хороший погрузчик способен даже в зависимости от условий опередить обычный карусельный автозагрузчик. Концепция четвертого члена экипажа во многом сохранилась на протяжении веков благодаря дополнительной паре рук, которую погрузчик предоставляет для обслуживания в полевых условиях.\n\n§GПодсказка дизайнера: Это стандартная система загрузки для любого танка. Дешевый и малорисковый вариант.§!"
 revolver_magazine: "Револьвер-автозагрузчик"
 revolver_magazine_desc: "Турельный автомат заряжания. Быстрее и безопаснее, чем карусельный автозагрузчик. Главный недостаток системы – ее дорогая цена.\n\n§GПодсказка дизайнера: Автомат заряжания револьвера — лучший вариант для вашего танка, если вы готовы заплатить дополнительную цену.§!"
 hardkill_system_gen1: "Современный комплекс активной защиты"
 hardkill_system_gen1_desc: "Усовершенствованный комплекс активной защиты сможет останавливать даже быстро летящие бронебойные подкалиберные снаряды и тандемные кумулятивные боеприпасы. Кроме того, он прикрывает танк со всех направлений.\n\n§GПодсказка дизайнера: Комплекс активной защиты — хороший способ повысить защищённость наших танков от вражеских ракет. Он также позволит нашей бронетехнике эффективнее прорывать вражеские позиции.§!"
 hardkill_system_gen2: "Усовершенствованный комплекс активной защиты"
 hardkill_system_gen2_desc: "Усовершенствованный комплекс активной защиты сможет останавливать даже быстро летящие бронебойные подкалиберные снаряды и тандемные кумулятивные боеприпасы. Кроме того, он прикрывает танк со всех направлений.\n\n§GПодсказка дизайнера: Комплекс активной защиты — хороший способ повысить защищённость наших танков от вражеских ракет. Он также позволит нашей бронетехнике эффективнее прорывать вражеские позиции.§!"
 smoothbore_atgm_gen1: "ПТРК 1950-ых"
 smoothbore_atgm_gen1_desc: "С небольшими изменениями мы можем приспособить танковую пушку для стрельбы противотанковыми управляемыми ракетами. Первые гладкоствольные ПТРК наводились с помощью инфракрасного прицела, или зрительной трубой.\n\n§GПодсказка дизайнера: Оснастив танки ПТРК в дополнение к обычным кинетическим средствам поражения, мы можем увеличить их способность поражать вражескую бронетехнику§!"
 smoothbore_atgm_gen2: "ПТРК 1950-ых"
 smoothbore_atgm_gen2_desc: "При лазерном наведении на цель искажения меньше, и ПТРК летит на цель более точно.\n\n§GПодсказка дизайнера: Оснастив танки ПТРК в дополнение к обычным кинетическим средствам поражения, мы можем увеличить их способность поражать вражескую бронетехнику§!"
 smoothbore_atgm_gen3: "Современные ПТРК"
 smoothbore_atgm_gen3_desc: "Теперь, запуская ПТРК, мы сможем поразить одну цель ракетой и быстро переключить огонь на другую.\n\n§GПодсказка дизайнера: Оснастив танки ПТРК в дополнение к обычным кинетическим средствам поражения, мы можем увеличить их способность поражать вражескую бронетехнику§!"
 smoothbore_atgm_gen4: "Улучшенные ПТРК"
 smoothbore_atgm_gen4_desc: "Улучшив тандемный заряд боевой части ПТРК, мы сможем пробивать более прочную броню противника.\n\n§GПодсказка дизайнера: Оснастив танки ПТРК в дополнение к обычным кинетическим средствам поражения, мы можем увеличить их способность поражать вражескую бронетехнику§!"
 smoothbore_atgm_gen5: "ПТРК 5-го поколения"
 smoothbore_atgm_gen5_desc: "Благодаря усовершенствованному ИИ и новым алгоритмам, ПТРК может иметь сложную траекторию полета, чтобы избежать препятствий и получить наилучший угол сближения, и даже менять цели в середине полета, если это необходимо.\n\n§GПодсказка дизайнера: Оснастив танки ПТРК в дополнение к обычным кинетическим средствам поражения, мы можем увеличить их способность поражать вражескую бронетехнику§!"
 tank_longer_gun: "Увеличение ствола"
 tank_longer_gun_desc: "Удлинив ствол по сравнению с его первоначальной конструкцией, мы можем увеличить начальную скорость снарядов.\n\n§GПодсказка дизайнера: Добавление поддержки для более длинного орудия — это простой способ повысить готовность вашего танка к борьбе с вражеской броней без необходимости модернизации всего орудия.§!"
 tank_aux_engine: "Вспомогат. электрич. двигатель"
 tank_aux_engine_desc: "С помощью вспомогательного электрического двигателя мы можем управлять некоторыми частями танка, например, башней, без необходимости включать основные двигатели. Таким образом, мы можем частично управлять танком в неподвижном состоянии и экономить топливо.\n\n§GПодсказка дизайнера: Добавление вспомогательного электрического двигателя будет лучше всего работать на двигателях, потребляющих топливо§!"
 tank_aux_engine_2: "Улучшенный вспомог. электрич. двигатель"
 tank_aux_engine_2_desc: "Улучшенная и более эффективная электрическая вспомогательная силовая установка.\n\n§GПодсказка дизайнера: Добавление вспомогательного электрического двигателя будет лучше всего работать на двигателях, потребляющих топливо§!"
 tank_drones: "Дрон поддержки"
 tank_drones_desc: "Башня танка может быть оснащена станцией управления беспилотником. Дрон может использоваться для осмотра окружающего поля боя, обнаружения целей и наблюдения за эффективностью огня.\n\n§GПодсказка дизайнера: Оснащение наших танков дронами улучшит их способность уничтожать врагов§!"
 tank_drones_2: "Улучшенный дрон поддержки"
 tank_drones_2_desc: "Улучшенный беспилотник поддержки сможет не только осматривать поле боя, но и вести огонь, фиксировать цели для поиска снарядов и даже защищаться от входящих снарядов.\n\n§GПодсказка дизайнера: Оснащение наших танков беспилотниками улучшит их способность уничтожать врагов§!"
 afv_machine_gun: "Послевоенный крупнокалиберный пулемёт"
 afv_machine_gun_desc: "Слегка модифицированная версия старой надежной пушки времен Второй мировой войны. Сейчас служит орудием поддержки на бронированном такси."
 afv_machine_gun_2: "Крупнокалиберный пулемёт холодной войны"
 afv_machine_gun_2_desc: "После окончания Второй мировой войны основные страны внесли некоторые изменения в конструкцию своих HMG: улучшили управляемость, точность и т.д."
 afv_machine_gun_3: "Современный крупнокалиберный пулемёт"
 afv_machine_gun_3_desc: "Распад Советского Союза позволил некоторым странам расслабиться и сосредоточиться на качестве, а не на количестве — вот что отличает это новое поколение."
 afv_machine_gun_4: "Крупнокалиберный пулемёт будущего"
 afv_machine_gun_4_desc: "Пластиковый корпус, технологии слежения. Теперь Крупнокалиберные Пулемёты стали смертоноснее, чем когда-либо."
 afv_assault_gun: "Штурмовая пушка ранней Холодной войны"
 afv_assault_gun_desc: "Артиллерия, устанавливаемая на легких танках, как правило, представляет собой низкоскоростные орудия, которые обеспечивают большую огневую мощь за счет малой отдачи."
 afv_assault_gun_2: "Штурмовое орудие поздней холодной войны"
 afv_assault_gun_2_desc: "Улучшенная баллистика, лучшие патроны FRAG по сравнению с конструкциями после Второй мировой войны."
 afv_assault_gun_3: "Современное штурмовое орудие"
 afv_assault_gun_3_desc: "Лучшее, что может предложить современная армия - умные снаряды, воздушный взрыв."
 afv_assault_gun_4: "Передовая штурмовая пушка"
 afv_assault_gun_4_desc: "Нанесение кассетных ударов, подрыв бункеров, мало что может сделать эта пушка - возможно, только танки находятся в безопасности."
 small_autocannon: "Автопушка ранней холодной войны"
 small_autocannon_desc: "Калибр 20-30 мм, обычно это просто пушка WW2 AA с несколькими модификациями. Тем не менее, она отлично справляется со своей задачей."
 small_autocannon_2: "Автопушка поздней холодной войны"
 small_autocannon_2_desc: "Специализированная автопушка, предназначенная для поражения как пехоты, так и металла."
 small_autocannon_3: "Современная автопушка"
 small_autocannon_3_desc: "Новейшие разработки, боеприпасы с дистанционным подрывом, программируемые снаряды."
 small_autocannon_4: "Передовая автопушка"
 small_autocannon_4_desc: "Автопушка самого современного уровня, не оставляющая после себя ничего."
 big_autocannon: "Тяж. автопушка ранней ХВ"
 big_autocannon_desc: "Высококалиберная автопушка калибра от 35 мм до 60 мм, нацеленная на уничтожение любой легкой брони в поле зрения."
 big_autocannon_2: "Тяж. автопушка поздней ХВ"
 big_autocannon_2_desc: "С новыми Бронебойными оперёнными подкалиберными снарядами эта пушка - не шутка."
 big_autocannon_3: "Современная Тяж. автопушка"
 big_autocannon_3_desc: "Разработано, чтобы представлять угрозу любой бронетехнике на поле боя."
 big_autocannon_4: "Тяж. автопушка будущего"
 big_autocannon_4_desc: "Усовершенствованная высококалиберная автопушка, предназначенная для уничтожения любой брони."
 afv_steel_armor_gen1: "Стальная броня"
 afv_steel_armor_gen1_desc: "Ваша любимая сталь военного качества."
 afv_steel_armor_gen2: "Улучшенная стальная броня"
 afv_steel_armor_gen2_desc: "Более прочная, чем просто сталь, RHA."
 afv_steel_armor_gen3: "Усовершенствованная стальная броня"
 afv_steel_armor_gen3_desc: "Нанопокрытие и современные сплавы. Это уже даже не «сталь»."
 afv_alum_armor_gen1: "Алюминевая броня"
 afv_alum_armor_gen1_desc: "Легкий и довольно прочный."
 afv_alum_armor_gen2: "Улучшенная алюминевая броня"
 afv_alum_armor_gen2_desc: "Улучшенный сплав, лучшая устойчивость к ударам и проколам."
 afv_alum_armor_gen3: "Усовершенствованная алюминевая броня"
 afv_alum_armor_gen3_desc: "Нанопокрытие и современные сплавы. «Алюминий» стал бы отличной альтернативой нашим нынешним комплектам брони."
 afv_composite_armor_gen1: "Легкая композитная броня начала холодной войны"
 afv_composite_armor_gen1_desc: "Копия ранней композитной брони для танков."
 afv_composite_armor_gen2: "Легкая композитная броня времен холодной войны"
 afv_composite_armor_gen2_desc: "Улучшенная версия композитной брони, заимствованная у танков."
 afv_composite_armor_gen3: "Современная легкая композитная броня"
 afv_composite_armor_gen3_desc: "Современное и передовое решение для долговечных ББМ"
 afv_composite_armor_gen4: "Усовершенствованная легкая композитная броня"
 afv_composite_armor_gen4_desc: "При эквиваленте RHA, измеряемом в метрах, это наиболее эффективная броня."
 afv_atgm_gen1: "ПТУР периода Холодной войны"
 afv_atgm_gen1_desc: "Внешняя пусковая установка для ранних ПТУР."
 afv_atgm_gen2: "ПТУР позднего периода Холодной войны"
 afv_atgm_gen2_desc: "Улучшенная версия пусковой установки, теперь это действительно ПТУР"
 afv_atgm_gen3: "Современный ПТУР"
 afv_atgm_gen3_desc: "Современная ракета с лазерным наведением и хорошей системой управления."
 afv_atgm_gen4: "Усовершенствованный ПТУР"
 afv_atgm_gen4_desc: "Усовершенствованная оптика и сложная ракета делают эту пусковую установку убийцей танков."
 afv_atgm_gen5: "ПТУР Будущего"
 afv_atgm_gen5_desc: "Самые передовые технологии и инновации в противотанковой области."
 afv_gun_ports: "Амбразуры"
 afv_gun_ports_desc: "Амбразуры для ведения огня экипажем изнутри машины."
 afv_mine_protection: "Противоминная защита"
 afv_mine_protection_desc: "Защищенное от мин днище корпуса для безопасности экипажа."
 afv_reverse_doors: "Эргономичные десантные двери"
 afv_reverse_doors_desc: "Большие и хорошо расположенные двери для безопасной высадки экипажа."
 afv_coax_machine_gun: "Коаксиальный МГ Ранней Холодной Войны"
 afv_coax_machine_gun_desc: "МГ времен Второй мировой войны, установленный как соосное орудие."
 afv_coax_machine_gun_2: "Коаксиальный МГ Поздней Холодной Войны"
 afv_coax_machine_gun_2_desc: "Улучшенная версия оружия времен Второй мировой войны в виде коаксиальной пушки."
 afv_coax_machine_gun_3: "Современный Коаксиальный МГ"
 afv_coax_machine_gun_3_desc: "Современный МГ, устанавливаемый как соосное орудие."
 afv_coax_machine_gun_4: "Коаксиальный МГ Будущего"
 afv_coax_machine_gun_4_desc: "Усовершенствованная конструкция, устанавливается как коаксиальная пушка."
 afv_coax_autocannon: "Коаксиальная Автопушка Ранней Холодной Войны"
 afv_coax_autocannon_desc: "Автопушка установлена как коаксиальное орудие."
 afv_coax_autocannon_2: "Коаксиальная Автопушка Поздней Холодной Войны"
 afv_coax_autocannon_2_desc: "Улучшенная автопушка, установленная как коаксиальное орудие"
 afv_coax_autocannon_3: "Современная Коаксиальная Автопушка"
 afv_coax_autocannon_3_desc: "Современная автопушка, установленная как коаксиальное орудие"
 afv_coax_autocannon_4: "Передовая коаксиальная автопушка"
 afv_coax_autocannon_4_desc: "Автопушка будущего, используемая в коаксиальном варианте."
 double_feed_system: "Система подачи двойного калибра"
 double_feed_system_desc: "Эта система позволяет пушкам большего калибра стрелять снарядами меньшего калибра."
 double_cannons: "Двойные пушки"
 double_cannons_desc: "Система для установки двух пушек вместо одной, с собственными сложностями."
 tank_nsb_armor_upgrade: "Броня"
 EQ_MOD_CAT_spaa_naval_cannon_systems_TITLE: "Морская пушка"
 spaa_naval_cannon_1: "Морская пушка после ВМВ"
 spaa_naval_cannon_1_desc: "Обладая огромным для своего времени калибром, это морское орудие обеспечивает непревзойдённую огневую мощь против небронированных целей. Его колоссальная разрушительная сила делает его грозным оружием, однако за такую мощь приходится расплачиваться снижением мобильности и эффективности."
 spaa_naval_cannon_2: "Морская пушка холодной войны"
 spaa_naval_cannon_2_desc: "Усовершенствованные конструкции снарядов и двигательных механизмов повышают огневую мощь пушки. Сохраняя значительный потенциал воздушной угрозы, пушка остается надежным выбором с точки зрения мощности."
 spaa_naval_cannon_3: "Современная морская пушка"
 spaa_naval_cannon_3_desc: "Благодаря использованию полуавтоматического заряжания и усовершенствованных типов боеприпасов это поколение улучшает скорострельность, что еще больше укрепляет его доминирующее положение при поражении малоразмерных целей."
 spaa_naval_cannon_4: "Современная морская пушка"
 spaa_naval_cannon_4_desc: "Используя управляемые боеприпасы, эта пушка обеспечивает беспрецедентную точность стрельбы, закрепляя за собой статус мощного средства противовоздушной обороны."
 spaa_naval_cannon_5: "Передовая военно-морская пушка"
 spaa_naval_cannon_5_desc: "Благодаря использованию новейших материалов и оптимизированной конструкции боеприпасов эта пушка обеспечивает еще большее поражение мягких целей с повышенной эффективностью."
 EQ_MOD_CAT_spaa_light_autocannon_systems_TITLE: "§RСЗУ§!\nАвтопушка поддержки"
 spaa_light_autocannon1: "Автопушка поддержки после ВМВ"
 spaa_light_autocannon1_desc: "Обтекаемая и лёгкая, эта автопушка отличается быстротой реакции и мобильностью, обеспечивая необходимое прикрытие с воздуха в условиях динамичного боя."
 spaa_light_autocannon2: "Автопушка поддержки холодной войны"
 spaa_light_autocannon2_desc: "Эволюционные материалы и оптимизированные механизмы стрельбы повышают эффективность пушки, укрепляя ее статус маневренного защитника на динамичных полях сражений."
 spaa_light_autocannon3: "Современная автопушка поддержки"
 spaa_light_autocannon3_desc: "Благодаря высокоскоростным снарядам эта модификация обеспечивает быстрое поражение, что делает её оптимальным выбором для оперативной нейтрализации воздушных угроз."
 spaa_light_autocannon4: "Усовершенствованная автопушка поддержки"
 spaa_light_autocannon4_desc: "Усовершенствованные сплавы и повышенная цикличность закрепляют за ним позиции лидера в быстром и эффективном воздушном бою."
 spaa_light_autocannon5: "Передовая автопушка поддержки"
 spaa_light_autocannon5_desc: "Эта пушка, созданная с использованием самых современных технологий производства, является вершиной скорости и эффективности, устанавливая эталон в системах быстрого реагирования."
 EQ_MOD_CAT_spaa_autocannon_systems_TITLE: "§RСЗУ§!\nПушки СЗУ"
 spaa_autocannon_1: "Автопушка после ВМВ"
 spaa_autocannon_1_desc: "Обладая гармоничным сочетанием мощности и скорострельности, эта универсальная пушка подходит для самых разных боевых ситуаций."
 spaa_autocannon_2: "Автопушка холодной войны"
 spaa_autocannon_2_desc: "Модернизация конструкции корпуса и материалов повышает его общую эффективность, укрепляя позиции в качестве надежного выбора для различных боевых действий."
 spaa_autocannon_3: "Современная автопушка"
 spaa_autocannon_3_desc: "Усовершенствованные механизмы стрельбы и оптимизированные типы боеприпасов выводят это поколение на новый уровень, обеспечивая надежную борьбу с воздушными и наземными угрозами."
 spaa_autocannon_4: "Усовершенствованная автопушка"
 spaa_autocannon_4_desc: "Благодаря усиленной конструкции ствола и более совершенным боеприпасам эта версия обеспечивает ещё большую стабильность в различных боевых сценариях."
 spaa_autocannon_5: "Передовая автопушка"
 spaa_autocannon_5_desc: "Представляя собой зенит дизайна автопушки, эта версия гарантирует оптимальные характеристики, используя последние достижения материаловедения и технологии производства боеприпасов."
 EQ_MOD_CAT_spaa_missile_systems_TITLE: "Многоцелевые ракеты"
 spaa_missiles_1: "Многоцелевые ракеты после ВМВ"
 spaa_missiles_1_desc: "Эти управляемые снаряды, созданные на заре развития ракетной техники, обеспечивают точность поражения, особенно эффективны против бронированных воздушных противников, но способны поражать и надводные цели."
 spaa_missiles_2: "Многоцелевые ракеты времён ХВ"
 spaa_missiles_2_desc: "Усовершенствованная силовая установка и аэродинамика придают этим ракетам ускорение, обеспечивая более ощутимый удар по труднодоступным и уклоняющимся целям."
 spaa_missiles_3: "Современные ракеты двойного назначения"
 spaa_missiles_3_desc: "Благодаря усовершенствованным системам наведения и оптимизированным боеголовкам это поколение гарантирует более эффективные боевые действия и укрепляет свой авторитет в небе."
 spaa_missiles_4: "Усовершенствованные ракеты двойного назначения"
 spaa_missiles_4_desc: "Передовые материалы и двигательные установки обеспечивают этим ракетам большую дальность и поражающую способность, сохраняя доминирование в воздушной войне."
 spaa_missiles_5: "Передовые многоцелевые ракеты"
 spaa_missiles_5_desc: "Раздвигая границы ракетных технологий, это поколение обеспечивает беспрецедентную дальность, скорость и ударную мощь, гарантируя, что ни одна воздушная угроза не останется незамеченной."
 EQ_MOD_CAT_spaa_short_range_missile_systems_TITLE: "§RСЗУ§!\nРакеты малого радиуса действия"
 spaa_short_range_missiles_1: "Ракеты малой дальности после ВМВ"
 spaa_short_range_missiles_1_desc: "Эти управляемые снаряды, созданные на заре развития ракетной техники, обеспечивают точное поражение, особенно эффективное против бронированных воздушных противников."
 spaa_short_range_missiles_2: "Ракеты малой дальности холодной войны"
 spaa_short_range_missiles_2_desc: "Усовершенствованная силовая установка и аэродинамика придают этим ракетам ускорение, обеспечивая более ощутимый удар по труднодоступным и уклоняющимся целям."
 spaa_short_range_missiles_3: "Современные ракеты малой дальности"
 spaa_short_range_missiles_3_desc: "Благодаря усовершенствованным системам наведения и оптимизированным боеголовкам это поколение гарантирует более эффективные боевые действия и укрепляет свой авторитет в небе."
 spaa_short_range_missiles_4: "Усовершенствованные ракеты малой дальности"
 spaa_short_range_missiles_4_desc: "Передовые материалы и двигательные установки обеспечивают этим ракетам большую дальность и поражающую способность, сохраняя доминирование в воздушной войне."
 spaa_short_range_missiles_5: "Передовые ракеты малой дальности"
 spaa_short_range_missiles_5_desc: "Раздвигая границы ракетных технологий, это поколение обеспечивает беспрецедентную дальность, скорость и ударную мощь, гарантируя, что ни одна воздушная угроза не останется незамеченной."
 EQ_MOD_CAT_spaa_long_range_missile_systems_TITLE: "§RСЗУ§!\nРакеты дальнего радиуса действия"
 spaa_long_range_missiles_1: "Ракеты большой дальности после ВМВ"
 spaa_long_range_missiles_1_desc: "Эти управляемые снаряды, созданные на заре развития ракетной техники, обеспечивают точность поражения, особенно эффективны против бронированных воздушных противников, но способны поражать и надводные цели."
 spaa_long_range_missiles_2: "Ракеты большой дальности холодной войны"
 spaa_long_range_missiles_2_desc: "Усовершенствованная силовая установка и аэродинамика придают этим ракетам ускорение, обеспечивая более ощутимый удар по труднодоступным и уклоняющимся целям."
 spaa_long_range_missiles_3: "Современные ракеты большой дальности"
 spaa_long_range_missiles_3_desc: "Благодаря усовершенствованным системам наведения и оптимизированным боеголовкам это поколение гарантирует более эффективные боевые действия и укрепляет свой авторитет в небе."
 spaa_long_range_missiles_4: "Усовершенствованные ракеты большой дальности"
 spaa_long_range_missiles_4_desc: "Передовые материалы и двигательные установки обеспечивают этим ракетам большую дальность и поражающую способность, сохраняя доминирование в воздушной войне."
 spaa_long_range_missiles_5: "Передовые ракеты большой дальности"
 spaa_long_range_missiles_5_desc: "Раздвигая границы ракетных технологий, это поколение обеспечивает беспрецедентную дальность, скорость и ударную мощь, гарантируя, что ни одна воздушная угроза не останется незамеченной."
 spaa_radar_gen1: "Радиолокационные системы после ВМВ"
 spaa_radar_gen1_desc: "Основополагающая радиолокационная система, разработанная специально для платформ СЗУ и обеспечивающая сбалансированное сочетание дальности и точности обнаружения воздушных угроз. Его стоимость свидетельствует о его специализированном характере."
 spaa_radar_gen2: "Радиолокационные системы холодной войны"
 spaa_radar_gen2_desc: "Благодаря более совершенным алгоритмам обнаружения эта радиолокационная система выделяется в многолюдной воздушной среде, обеспечивая устойчивое сопровождение целей в условиях помех."
 spaa_radar_gen3: "Современные радиолокационные системы"
 spaa_radar_gen3_desc: "Благодаря использованию высокотехнологичных материалов и цифровой обработки данных он обеспечивает оптимальное слежение и передачу информации в реальном времени, что дает преимущество в быстром воздушном бою."
 spaa_radar_gen4: "Усовершенствованные радиолокационные системы"
 spaa_radar_gen4_desc: "Современная система, использующая передовые технологии, обеспечивает непревзойденную точность и различение целей на различных оперативных театрах."
 spaa_radar_gen5: "Квантовые радиолокационные системы"
 spaa_radar_gen5_desc: "Вершина радарного дизайна, предлагающая адаптивные возможности, позволяющие легко справляться с многочисленными угрозами, укрепляет свою репутацию первоклассного средства обнаружения, даже если за это приходится платить."
 spaa_off_vehicle_radar_gen1: "Машина радиолокационной поддержки после ВМВ"
 spaa_off_vehicle_radar_gen1_desc: "Несмотря на расширенные возможности обнаружения, основной функцией этой машины поддержки является помощь СЗУ в получении более точных данных для наведения на цель. Однако его ранняя разработка сопряжена с трудностями в сценариях прорыва фронта."
 spaa_off_vehicle_radar_gen2: "Машина радиолок. поддержки холодной войны"
 spaa_off_vehicle_radar_gen2_desc: "В сочетании с улучшенной обработкой сигналов это повышает время реакции всей экосистемы ПВО, хотя и в ущерб устойчивости к прямому поражению."
 spaa_off_vehicle_radar_gen3: "Современная машина радиолокационной поддержки"
 spaa_off_vehicle_radar_gen3_desc: "Эта машина оснащена усовершенствованными радиолокационными системами, обеспечивающими быструю классификацию и ретрансляцию угроз, даже если она предпочитает действовать на безопасном расстоянии."
 spaa_off_vehicle_radar_gen4: "Усовершенствованная машина радиолокационной поддержки"
 spaa_off_vehicle_radar_gen4_desc: "Применяя новейшие радиолокационные технологии, он служит «глазами» системы ПВО, обеспечивая выявление и устранение угроз, хотя от прямого столкновения его лучше оградить."
 spaa_off_vehicle_radar_gen5: "Квантовая машина радиолокационной поддержки"
 spaa_off_vehicle_radar_gen5_desc: "Представляя собой зенит эволюции радиолокационных станций поддержки, они обладают непревзойденной дальностью обнаружения и оперативностью распространения информации, что делает их бесценными, но при этом сохраняются их уязвимые места на переднем крае."
 spaa_optical_guidance_gen1: "Оптическое наведение"
 spaa_optical_guidance_gen1_desc: "Используя основные визуальные средства и датчики раннего обнаружения, эта система наведения обеспечивает экономически эффективное средство сопровождения и поражения воздушных целей в благоприятных условиях."
 spaa_optical_guidance_gen2: "Оптическое наведение"
 spaa_optical_guidance_gen2_desc: "Благодаря улучшенным линзам и раннему электронному сопровождению он обеспечивает более стабильное поражение целей, особенно в дневное время."
 spaa_optical_guidance_gen3: "Современная оптическая навигация"
 spaa_optical_guidance_gen3_desc: "Благодаря усовершенствованию технологии датчиков эта система обеспечивает лучшее различение целей и оценку дальности стрельбы, что делает ее надежным бюджетным выбором."
 spaa_optical_guidance_gen4: "Усовершенствованная оптическая навигация"
 spaa_optical_guidance_gen4_desc: "Сочетание современных визуальных сенсоров с программными средствами обеспечивает более эффективное сопровождение цели и позволяет конкурировать с более дорогими радиолокационными аналогами."
 spaa_optical_guidance_gen5: "Передовые системы оптического наведения"
 spaa_optical_guidance_gen5_desc: "Чудо оптической техники, обеспечивающее адаптивное визуальное слежение и интеллектуальную приоритизацию угроз, утвердило свои позиции в качестве экономичной и эффективной альтернативы."
 ARG_tank_small_medium_cannon_2: "105 мм FM K.4 Modelo 1L"
 ARG_tank_small_medium_cannon_2_desc: "Аргентинская лицензионная версия британской танковой пушки L7, произведенная компанией Fabricaciones Militares.\n\n§GПодсказка дизайнера: Орудия малого калибра подходят для осколочно-фугасных снарядов из-за меньшей начальной скорости. Используйте их, если хотите отдать предпочтение атаке по пехоте перед атакой по бронетехнике§!"
 ARG_tank_diesel_engine_gen2: "MB 833 Ka-500, 720 л.с."
 ARG_tank_diesel_engine_gen2_desc: "MB 833 Ka-500 - изначально немецкий дизельный двигатель производства MTU. Двигатель был адаптирован Аргентиной для использования в танке ТАМ.\n\n§GПодсказка дизайнера: Многотопливные дизельные двигатели являются стандартным двигателем, используемым на танках§!"
 BRA_tank_small_medium_cannon: "105 мм L7A3"
 BRA_tank_small_medium_cannon_desc: "Бразильская лицензионная версия немецкого 105-мм орудия L7A3. Это орудие времен холодной войны было основным вооружением танка Leopard I.\n\n§GПодсказка дизайнера: Орудия малого калибра подходят для осколочно-фугасных снарядов из-за меньшей начальной скорости. Используйте их, если хотите отдать предпочтение атаке по пехоте перед атакой по бронетехнике§!"
 BRA_tank_medium_cannon: "120 мм GIAT G1"
 BRA_tank_medium_cannon_desc: "120-мм пушка GIAT G1 является бразильской лицензионной версией французской пушки CN120-25, производимой компанией Établissement d'Études et de Fabrication d'Armements de Bourges. Эта пушка времен холодной войны была основным выбором вооружения для Giat Industries AMX-32 и AMX-40.\n\n§GПодсказка дизайнера: Орудия малого калибра подходят для осколочно-фугасных снарядов из-за меньшей начальной скорости. Используйте их, если хотите отдать предпочтение атаке по пехоте перед атакой по бронетехнике§!"
 BRA_tank_diesel_engine_gen2: "MWM TBD 234, 1000 л.с."
 BRA_tank_diesel_engine_gen2_desc: "MWM TBH 234 является бразильской лицензионной версией немецкого MWM TBD 234, этот двигатель эпохи холодной войны является компактным и высокопроизводительным двигателем, разработанным во время холодной войны.\n\n§GПодсказка дизайнера: Многотопливные дизельные двигатели являются стандартным двигателем, используемым на танках§!"
 CHI_tank_small_medium_cannon: "100 мм Тип 59"
 CHI_tank_small_medium_cannon_desc: "Type 59 - это китайская копия танковой пушки Д-10Т, используемой на Т-55.\n\n§GПодсказка дизайнера: Орудия малого калибра подходят для осколочно-фугасных снарядов из-за меньшей начальной скорости. Используйте их, если хотите отдать предпочтение атаке по пехоте перед атакой по бронетехнике§!"
 CHI_tank_small_medium_cannon_2: "105 мм ZPL-81A"
 CHI_tank_small_medium_cannon_2_desc: "ZPL-81A - это китайская лицензионная версия британской пушки L7A3. Китайская версия имеет улучшенный тепловой кожух отечественного производства.\n\n§GПодсказка дизайнера: Орудия малого калибра подходят для осколочно-фугасных снарядов из-за меньшей начальной скорости. Используйте их, если хотите отдать предпочтение атаке по пехоте перед атакой по бронетехнике§!"
 CHI_tank_small_medium_cannon_3: "105 мм ZPL-98A"
 CHI_tank_small_medium_cannon_3_desc: "ZPL-98A - китайская лицензионная версия британского орудия L7A3. Эта усовершенствованная модификация оснащена разработанным в Китае дульным тормозом с пониженной отдачей и отличается меньшей массой.\n\n§GПодсказка дизайнера: Орудия малого калибра подходят для осколочно-фугасных снарядов из-за меньшей начальной скорости. Используйте их, если хотите отдать предпочтение атаке по пехоте перед атакой по бронетехнике§!"
 CHI_tank_medium_cannon: "125 мм Тип 88C"
 CHI_tank_medium_cannon_desc: "Type 88C - ранняя китайская пушка основного танка, созданная на основе советской пушки 2A46M.\n\n§GПодсказка дизайнера: Орудия малого калибра подходят для осколочно-фугасных снарядов из-за меньшей начальной скорости. Используйте их, если хотите отдать предпочтение атаке по пехоте перед атакой по бронетехнике§!"
 CHI_tank_medium_cannon_2: "125 мм ZPT-98"
 CHI_tank_medium_cannon_2_desc: "ZPT-98 - китайское 125-мм орудие основного боевого танка, легко узнаваемое по эжектору, расположенному в средней части ствола.\n\n§GПодсказка дизайнера: Орудия малого калибра подходят для осколочно-фугасных снарядов из-за меньшей начальной скорости. Используйте их, если хотите отдать предпочтение атаке по пехоте перед атакой по бронетехнике§!"
 CHI_tank_diesel_engine_gen1: "Model 12150L V-12, 520 л.с."
 CHI_tank_diesel_engine_gen1_desc: "Модель 12150L - это китайский двигатель V-12 начала холодной войны. При установке на танк он работает в паре с 5-ступенчатой механической коробкой передач.\n\n§GПодсказка дизайнера: Многотопливные дизельные двигатели являются стандартным двигателем, используемым на танках§!"
 CHI_tank_diesel_engine_gen2: "Model 12150L-7BW V-12, 580 л.с."
 CHI_tank_diesel_engine_gen2_desc: "Модель 12150L-7BW является усовершенствованной версией предыдущей модели 12150L.\n\n§GПодсказка дизайнера: Многотопливные дизельные двигатели являются стандартным двигателем, используемым на танках§!"
 CHI_tank_diesel_engine_gen3: "Model 12150ZL V-12, 730 л.с."
 CHI_tank_diesel_engine_gen3_desc: "Модель 12150ZL представляет собой улучшенную версию предыдущей модели 12150L-7BW.\n\n§GПодсказка дизайнера: Многотопливные дизельные двигатели являются стандартными двигателями, используемыми на танках.§!"
 CHI_tank_diesel_engine_gen4: "KMDB 6TD-2, 1200 л.с."
 CHI_tank_diesel_engine_gen4_desc: "ХКБМ 6ТД-2 - это российский танковый двигатель, который первоначально планировался для прототипа Type 90-II. Танк так и не был принят на вооружение Китая, но продолжил свою жизнь в качестве танка Al-Khalid на вооружении Пакистана.\n\n§GПодсказка дизайнера: Многотопливные дизельные двигатели являются стандартным двигателем, используемым на танках§!"
 CHI_tank_diesel_engine_gen5: "150HB, 1500 л.с."
 CHI_tank_diesel_engine_gen5_desc: "Дизельный двигатель 150HB производства Norinco основан на немецком MB 873 Ka-501, используемом на Leopard 2.\n\n§GПодсказка дизайнера: Многотопливные дизельные двигатели являются стандартным двигателем, используемым на танках§!"
 CHI_reactive_armor_gen1: "FY-I"
 CHI_reactive_armor_gen1_desc: "FY-I — китайская динамическая защита 1-го поколения, предназначенная для борьбы с кумулятивными снарядами.\n\n§GПодсказка дизайнера: Динамическая защита — это простой способ улучшить броню вашего танка§!"
 CHI_reactive_armor_gen2: "FY-II"
 CHI_reactive_armor_gen2_desc: "FY-II — китайская динамическая защита второго поколения, защищающая танки от кумулятивных и бронебойных снарядов.\n\n§GПодсказка дизайнера: Динамическая защита — это простой способ улучшить броню вашего танка§!"
 CHI_reactive_armor_gen3: "FY-IV"
 CHI_reactive_armor_gen3_desc: "FY-IV — это китайская динамическая защита 3-го поколения, которая защищает от кумулятивных снарядов и тандемных боеголовок.\n\n§GПодсказка дизайнера: Динамическая защита — это простой способ улучшить броню вашего танка§!"
 CHI_reactive_armor_gen4: "FY-V"
 CHI_reactive_armor_gen4_desc: "FY-V — это китайская динамическая защита 4-го поколения, предназначенная для защиты танка от всех возможных снарядов.\n\n§GПодсказка дизайнера: Динамическая защита — это простой способ улучшить броню вашего танка§!"
 CHI_hardkill_system_gen1: "GL5"
 ENG_tank_small_medium_cannon: "105 мм L7A1"
 ENG_tank_small_medium_cannon_desc: "Танковая пушка Royal Ordnance L7, вероятно, является одной из самых известных танковых пушек. Лицензированная и скопированная многими странами, пушка и ее различные версии широко использовались в начале Холодной войны.\n\n§GПодсказка дизайнера: Орудия малого калибра подходят для осколочно-фугасных снарядов из-за меньшей начальной скорости. Используйте их, если хотите отдать предпочтение атаке по пехоте перед атакой по бронетехнике§!"
 ENG_tank_small_medium_cannon_2: "105 мм L7A2"
 ENG_tank_small_medium_cannon_2_desc: "L7A2 - это усовершенствование старой модели L7 с добавлением теплового рукава.\n\n§GПодсказка дизайнера: Орудия малого калибра подходят для осколочно-фугасных снарядов из-за меньшей начальной скорости. Используйте их, если хотите отдать предпочтение атаке по пехоте перед атакой по бронетехнике§!"
 ENG_tank_small_medium_cannon_3: "105 мм Royal Ordnance IWS"
 ENG_tank_small_medium_cannon_3_desc: "Royal Ordnance IWS (Improved Weapon System) - это дальнейшее развитие пушки L7 с более высоким давлением заряда и более длинным стволом.\n\n§GПодсказка дизайнера: Орудия малого калибра подходят для осколочно-фугасных снарядов из-за меньшей начальной скорости. Используйте их, если хотите отдать предпочтение атаке по пехоте перед атакой по бронетехнике§!"
 ENG_tank_medium_cannon: "120 мм L11A5"
 ENG_tank_medium_cannon_desc: "L11A5 — британская танковая пушка, разработанная в качестве преемника меньшей пушки L7. На данный момент пушка L11A5 удерживает рекорд по дальности поражения танков: британский танк Challenger уничтожил иракский Т-55 на расстоянии 4,7 км во время войны в Персидском заливе.\n\n§GПодсказка дизайнера: Орудия среднего калибра — сбалансированное танковое вооружение. Используйте их, если не хотите отдавать предпочтение ни атаке по пехоте, ни атаке по бронетехнике§!"
 ENG_tank_medium_cannon_2: "120 мм L30A1"
 ENG_tank_medium_cannon_2_desc: "Пушка L30 — это усовершенствованная версия старой L11. Она изготовлена из стали электрошлакового переплава с облицовкой из хромового сплава. Необычно для танкового вооружения НАТО, пушка, как и ее предшественница, нарезная. Это связано с интенсивным использованием снарядов HESH (фугасные снаряды с раздавливающей головкой) британской королевской армией.\n\n§GПодсказка дизайнера: Орудия среднего калибра — сбалансированное танковое вооружение. Используйте их, если не хотите отдавать предпочтение ни атаке по пехоте, ни атаке по бронетехнике§!"
 ENG_tank_diesel_engine_gen1: "Rolls-Royce Meteor, 650 л.с."
 ENG_tank_diesel_engine_gen1_desc: "Двигатель Rolls-Royce Meteor - это универсальный танковый двигатель времен Второй мировой войны. Созданный на основе авиационного, он использовался в танках Cromwell, Comet и Centurion.\n\n§GПодсказка дизайнера: Многотопливные дизельные двигатели являются стандартным двигателем, используемым на танках§!"
 ENG_tank_diesel_engine_gen2: "Perkins CV12-1200TCA, 1200 л.с."
 ENG_tank_diesel_engine_gen2_desc: "Двигатель Perkins CV12 - это очень мощный дизельный двигатель, разработанный для танков Challenger 1 и Challenger 2.\n\n§GПодсказка дизайнера: Многотопливные дизельные двигатели являются стандартным двигателем, используемым на танках§!"
 ENG_tank_composite_armor_gen1: "Чобхэм"
 ENG_tank_composite_armor_gen1_desc: "Броня Chobham - это британская композитная броня, разработанная для танка Challenger. Она состоит из керамических плиток, соединенных со сталью и подкрепленных эластичными пластинами. Термин Chobham стал синонимом композитной брони, независимо от танка или производителя.\n\n§GПодсказка дизайнера: Композитная броня является стандартным вариантом для современных основных боевых танков§!"
 ENG_tank_composite_armor_gen2: "Дорчестер"
 ENG_tank_composite_armor_gen2_desc: "Броня Dorchester является новейшим вариантом оригинальной брони Chobham и в настоящее время используется на танках Abrams и Challenger 2. Улучшенная версия обеспечивает лучшую защиту от огня противника.\n\n§GПодсказка дизайнера: Композитная броня является стандартным вариантом для современных основных боевых танков§!"
 SOV_tank_small_medium_cannon: "90-95 мм Д-10Т2С"
 SOV_tank_small_medium_cannon_desc: "Д-10 - советская танковая пушка, разработанная в конце Второй мировой войны и впервые установленная на танковом истребителе СУ-100. В начале холодной войны это орудие стало выбором вооружения для танков серий Т-54 и Т-55.\n\n§GПодсказка дизайнера: Орудия малого калибра подходят для осколочно-фугасных снарядов из-за меньшей начальной скорости. Используйте их, если хотите отдать предпочтение атаке по пехоте перед атакой по бронетехнике§!"
 SOV_tank_small_medium_cannon_2: "115 мм У-5ТС"
 SOV_tank_small_medium_cannon_2_desc: "У-5ТС — первое гладкоствольное орудие, разработанное для танков. Существовавшее 100-мм орудие на Т-55 было слишком слабым для борьбы с новыми западными танками «Центурион» и M48 «Паттон». В ответ на появление этих танков Советский Союз разработал 115-мм орудие. Это орудие использовалось только на Т-62. Оно доказало свою эффективность даже против более современных танков, как это было показано в ирано-иракской войне, где Т-62 смог уничтожить гораздо более новые танки «Чифтен» и M60.\n\n§GПодсказка дизайнера: Орудия малого калибра подходят для осколочно-фугасных снарядов из-за меньшей начальной скорости. Используйте их, если хотите отдать предпочтение атаке по пехоте перед атакой по бронетехнике§!"
 SOV_tank_small_medium_cannon_3: "100 мм 2A70"
 SOV_tank_small_medium_cannon_3_desc: "2A70 - это скорострельная нарезная пушка, предназначенная для легкой бронетехники. Пушка предназначена в основном для стрельбы осколочно-фугасными снарядами. Пушка 2А70 является основным оружием серии БМП-3.\n\n§GПодсказка дизайнера: Орудия малого калибра подходят для осколочно-фугасных снарядов из-за меньшей начальной скорости. Используйте их, если хотите отдать предпочтение атаке по пехоте перед атакой по бронетехнике§!"
 SOV_tank_medium_cannon: "125 мм 2А46"
 SOV_tank_medium_cannon_desc: "2А46 — самая распространённая советская танковая пушка. Первоначально разработанная для Т-64, пушка с тех пор использовалась во всех советских и российских танках, а также во многих иностранных танках.\n\n§GПодсказка дизайнера: Орудия среднего калибра — сбалансированное танковое вооружение. Используйте их, если не хотите отдавать предпочтение ни атаке по пехоте, ни атаке по бронетехнике§!"
 SOV_tank_medium_cannon_2: "125 мм 2A46M"
 SOV_tank_medium_cannon_2_desc: "2А46М представляет собой семейство усовершенствованных версий оригинальной пушки 2А46 с улучшенным набором боеприпасов и общими усовершенствованиями.\n\n§GПодсказка дизайнера: Орудия среднего калибра — сбалансированное танковое вооружение. Используйте их, если не хотите отдавать предпочтение ни атаке по пехоте, ни атаке по бронетехнике§!"
 SOV_tank_medium_cannon_3: "125 мм 2A82-1M"
 SOV_tank_medium_cannon_3_desc: "Последняя разработка российской танковой технологии, 2A82-1M, предназначена для использования на новых танках Т-14 «Армата». Сообщается, что пушка имеет точность на 15–20 % выше, чем старая 2A46M, и более высокую начальную скорость, чем пушка Leopard 2.\n\n§GПодсказка дизайнера: Орудия среднего калибра — сбалансированное танковое вооружение. Используйте их, если не хотите отдавать предпочтение ни атаке по пехоте, ни атаке по бронетехнике§!"
 SOV_tank_large_cannon: "130 мм M-65 L/60"
 SOV_tank_large_cannon_desc: "Экспериментальное орудие тяжелого танка, которое предполагалось использовать с выдерживающим ядерные взрывы тяжелым штурмовым танком «Объект 279 Котин». Поскольку потребность в тяжелых танках отпала, проект был отменен, а вместе с ним и пушка.\n\n§GПодсказка дизайнера: Тяжёлые орудия предназначены в первую очередь для борьбы с бронетехникой. Используйте их, если хотите сделать упор на атаку по бронетехнике, сохранив при этом некоторую атаку по пехоте§!"
 SOV_tank_large_cannon_2: "130 мм M-65 L/70"
 SOV_tank_large_cannon_2_desc: "Улучшенная версия танковой пушки «Объект 279». Эта нарезная тяжелая танковая пушка предназначалась для «Объекта 785», предполагавшейся модернизации танка Т-80. Проект так и не был завершен.\n\n§GПодсказка дизайнера: Тяжёлые орудия предназначены в первую очередь для борьбы с бронетехникой. Используйте их, если хотите сделать упор на атаку по бронетехнике, сохранив при этом некоторую атаку по пехоте§!"
 SOV_tank_very_large_cannon: "152 мм LP-83"
 SOV_tank_very_large_cannon_desc: "ЛП-83 - экспериментальная пушка для сверхтяжелого танка, которая испытывалась на танке «Объект 292», предназначенном для замены Т-80БВ. Один прототип танка и пушки был изготовлен в 1990 году, но из-за отсутствия финансирования и интереса проект был отменен.\n\n§GПодсказка дизайнера: Сверхтяжёлые орудия предназначены для борьбы с бронетехникой. Используйте их, если хотите сделать значительный упор на атаку по бронетехнике в ущерб атаке по пехоте§!"
 SOV_tank_very_large_cannon_2: "152 мм 2A83"
 SOV_tank_very_large_cannon_2_desc: "Пушка 2A83 является продолжением предыдущих сверхтяжелых танковых орудий Советского Союза. Орудие предназначено для возможной модернизации Т-14 «Армата», чтобы сделать его превосходящим любой западный танк.\n\n§GПодсказка дизайнера: Сверхтяжёлые орудия предназначены для борьбы с бронетехникой. Используйте их, если хотите сделать значительный упор на атаку по бронетехнике в ущерб атаке по пехоте§!"
 SOV_tank_diesel_engine_gen1: "V-55, 581 л.с."
 SOV_tank_diesel_engine_gen1_desc: "V-55 - это двигатель V12 с естественным всасыванием, который использовался на танке Т-55.\n\n§GПодсказка дизайнера: Многотопливные дизельные двигатели являются стандартным двигателем, используемым на танках§!"
 SOV_tank_diesel_engine_gen2: "5TDF, 700 л.с."
 SOV_tank_diesel_engine_gen2_desc: "5ТДФ - это двухтактный, многотопливный дизельный двигатель с оппозитными поршнями и горизонтальным расположением цилиндров. Первоначально разработанный для Т-64, он также использовался в ранних версиях Т-72.\n\n§GПодсказка дизайнера: Многотопливные дизельные двигатели являются стандартным двигателем, используемым на танках§!"
 SOV_tank_diesel_engine_gen3: "V-84, 840 л.с."
 SOV_tank_diesel_engine_gen3_desc: "Двигатель боевого танка V-84 - это двенадцатицилиндровый двигатель с турбонаддувом, первоначально предназначенный для модернизации Т-72.\n\n§GПодсказка дизайнера: Многотопливные дизельные двигатели являются стандартным двигателем, используемым на танках§!"
 SOV_tank_diesel_engine_gen4: "V-92S2, 1000 л.с."
 SOV_tank_diesel_engine_gen4_desc: "Дизельный двигатель с турбонаддувом В-92С2 был разработан для танков серии Т-72Б3 и Т-90.\n\n§GПодсказка дизайнера: Многотопливные дизельные двигатели являются стандартным двигателем, используемым на танках§!"
 SOV_tank_diesel_engine_gen5: "V-92S2F, 1130 л.с."
 SOV_tank_diesel_engine_gen5_desc: "В-92S2Ф - это улучшенная версия более старой модели В-92S2. Он предназначен для модернизации более старой модели.\n\n§GПодсказка дизайнера: Многотопливные дизельные двигатели являются стандартным двигателем, используемым на танках§!"
 SOV_tank_diesel_engine_gen6: "2V-12-3A, 1500 л.с."
 SOV_tank_diesel_engine_gen6_desc: "2В-12-3А - это двигатель типа Х12, который предназначался для Т-14 «Армата».\n\n§GПодсказка дизайнера: Многотопливные дизельные двигатели являются стандартным двигателем, используемым на танках§!"
 SOV_tank_diesel_engine_gen7: "A-85-3A, 1500 л.с."
 SOV_tank_diesel_engine_gen7_desc: "A-85-3A - это двигатель типа X12, который заменил более ранний двигатель 2V-12-3A на «Армате» из-за проблем с надежностью более старой модели.\n\n§GПодсказка дизайнера: Многотопливные дизельные двигатели являются стандартным двигателем, используемым на танках§!"
 SOV_tank_gas_turbine_engine_gen1: "ГТД-3ТЛ"
 SOV_tank_gas_turbine_engine_gen1_desc: "ГТД-3ТЛ был экспериментальным газотурбинным двигателем, который планировалось использовать для танка Т-64. Однако впоследствии от этой идеи отказались в пользу дизельного двигателя.\n\n§GПодсказка дизайнера: Газовые турбины имеют лучшее ускорение, чем дизельные двигатели, улучшая маневренность транспорта. Однако они дороги в производстве и потребляют много топлива. Используйте газовые турбины, если вам нужны быстрые танки и вы можете обеспечить их топливом§!"
 SOV_tank_gas_turbine_engine_gen2: "СГ-1000"
 SOV_tank_gas_turbine_engine_gen2_desc: "СГ-1000 был первоначальным газотурбинным двигателем самолета Т-80. Он был быстро заменен на более совершенную модель.\n\n§GПодсказка дизайнера: Газовые турбины имеют лучшее ускорение, чем дизельные двигатели, улучшая маневренность транспорта. Однако они дороги в производстве и потребляют много топлива. Используйте газовые турбины, если вам нужны быстрые танки и вы можете обеспечить их топливом§!"
 SOV_tank_gas_turbine_engine_gen3: "ГТД-1000Т"
 SOV_tank_gas_turbine_engine_gen3_desc: "ГТД-1000T - газовая турбина, предназначенная для танков T-80A и T-80B. ГТД-1000T более надежна и производит немного больше лошадиных сил, чем более старая модель СГ-1000.\n\n§GПодсказка дизайнера: Газовые турбины имеют лучшее ускорение, чем дизельные двигатели, улучшая маневренность транспорта. Однако они дороги в производстве и потребляют много топлива. Используйте газовые турбины, если вам нужны быстрые танки и вы можете обеспечить их топливом§!"
 SOV_tank_gas_turbine_engine_gen4: "ГТД-1250"
 SOV_tank_gas_turbine_engine_gen4_desc: "ГТД-1250 - это газотурбинный двигатель, используемый на танке Т-80 второго поколения, Т-80У. Газовая турбина поставляется в паре с меньшей газовой турбиной, которая действует как вспомогательная силовая установка.\n\n§GПодсказка дизайнера: Газовые турбины имеют лучшее ускорение, чем дизельные двигатели, улучшая маневренность транспорта. Однако они дороги в производстве и потребляют много топлива. Используйте газовые турбины, если вам нужны быстрые танки и вы можете обеспечить их топливом§!"
 SOV_tank_gas_turbine_engine_gen5: "ГТД-1250Т"
 SOV_tank_gas_turbine_engine_gen6: "ГТД-1500"
 SOV_tank_electric_engine_gen1: "ВК-1200В"
 SOV_tank_electric_engine_gen2: "ВК-1700В"
 SOV_reactive_armor_gen1: "Контакт-1"
 SOV_reactive_armor_gen1_desc: "КОНТАКТ-1 - это динамическая защита 1-го поколения, разработанная в Советском Союзе. Она состоит из двух взрывных элементов 4S20 между двумя стальными пластинами. КОНТАКТ-1 очень нечувствителен и может быть приведен в действие только кумулятивным зарядом.\n\n§GПодсказка дизайнера: Динамическая защита - это простой способ улучшить броню танка§!"
 SOV_reactive_armor_gen2: "Контакт-5"
 SOV_reactive_armor_gen2_desc: "КОНТАКТ-5 - это динамическая защита 2-го поколения, разработанная в Советском Союзе. При детонации стальные пластины в кирпичах смещаются в сторону, создавая более длинный путь проникновения для входящих снарядов. Этот метод защиты также эффективен против кинетических снарядов.\n\n§GПодсказка дизайнера: Динамическая защита - это простой способ улучшить броню танка§!"
 SOV_reactive_armor_gen3: "Реликт"
 SOV_reactive_armor_gen3_desc: "Реликт - это динамическая защита 3-го поколения, разработанная в Советском Союзе. Она способна защищать как от быстро-, так и от медленно движущихся проникающих снарядов и даже защищать от тандемных кумулятивных зарядов.\n\n§GПодсказка дизайнера: Динамическая защита - это простой способ улучшить броню танка§!"
 SOV_reactive_armor_gen4: "Малахит"
 SOV_reactive_armor_gen4_desc: "Малахит - это динамическая защита 4-го поколения, установленная на Т-14 «Армата».\n\n§GПодсказка дизайнера: Динамическая защита - это простой способ улучшить броню танка§!"
 SOV_smoothbore_atgm_gen1: "9K112 Кобра"
 SOV_smoothbore_atgm_gen2: "9M119 Свирь"
 SOV_smoothbore_atgm_gen3: "9М133 Корнет"
 SOV_smoothbore_atgm_gen4: "9M140 Удар"
 SOV_smoothbore_atgm_gen5: "9M143 Сила"
 SOV_smoke_launchers: "3Д6"
 SOV_smoke_launchers_desc: "Туча - это 81-мм гранатомет, разработанный в Советском Союзе. В основном он используется для стрельбы дымовыми гранатами типа 3Д6 и 3Д6М.\n\n§GПодсказка дизайнера: Добавление дымовых пусковых установок уменьшает видимость танка, делая его лучше как в обороне, так и в нападении§!"
 SOV_smoke_launchers_2: "3Д6M"
 SOV_smoke_launchers_2_desc: "Туча - это 81-мм гранатомет, разработанный в Советском Союзе. В основном он используется для стрельбы дымовыми гранатами типа 3Д6 и 3Д6М.\n\n§GПодсказка дизайнера: Добавление дымовых пусковых установок уменьшает видимость танка, делая его лучше как в обороне, так и в нападении§!"
 SOV_hardkill_system_gen1: "«Арена»"
 SOV_hardkill_system_gen1_desc: "Система активной защиты «Арена» использует доплеровский радар для обнаружения приближающихся ракет. После обнаружения ракеты система выпускает ракету для противодействия ей.\n\n§GПодсказка дизайнера: Комплекс активной защиты — хороший способ повысить защищённость наших танков от вражеских ракет. Она также позволит нашей броне более эффективно прорывать вражеские линии.§!"
 SOV_hardkill_system_gen2: "«Афганит»"
 SOV_hardkill_system_gen2_desc: "«Афганит» — передовая система активной защиты, разработанная в России. Она предназначена для использования на танке Т-14 «Армата». Система способна противостоять как ракетам, так и кинетическим проникающим снарядам, а также останавливать любые снаряды, летящие со скоростью менее 1700 м/с.\n\n§GПодсказка дизайнера: Комплекс активной защиты — хороший способ повысить защищённость наших танков от вражеских ракет. Она также позволит нашей броне более эффективно прорывать вражеские линии.§!"
