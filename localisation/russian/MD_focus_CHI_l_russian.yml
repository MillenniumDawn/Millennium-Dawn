 CHI_semiconductor_backwardness_1_desc: "Китайская полупроводниковая отрасль по-прежнему структурно зависит от зарубежных контрактных фабрик, ПО для проектирования и производственного оборудования. Отечественные фабрики отстают от передового уровня на два-три поколения, у дизайн-центров нет зрелых инструментов EDA, и ни одна отечественная компания не способна поставлять оборудование для передовой литографии. Этот разрыв сдерживает строительство отечественных заводов микросхем и выпуск контрактных фабрик, а также ограничивает как гражданскую электронику, так и цепочку поставок военной электроники.\n§W--------------§!\nЭтот национальный дух §Gулучшится§!, если мы выполним фокус §Y$CHI_naura_amec$§!."
