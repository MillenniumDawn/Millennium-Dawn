 EUevent.2.t: "유럽연합-튀르키예 협정"
 EUevent.2.d: "§C[EUU.GetFlag] 유럽연합§!과 [TUR.GetNameWithFlag]은(는) 튀르키예에서 유럽으로 유입되는 비정규 이민자들의 흐름을 막기 위한 협정에 도달했습니다. EU-튀르키예 성명에 따라 튀르키예를 거쳐 그리스 섬으로 도착한 신규 비정규 이민자 및 망명 신청자 중 망명 신청이 불허된 모든 이는 튀르키예로 송환됩니다. §C[EUU.GetFlag] 유럽연합§!은 튀르키예 내 난민 지원 시설을 위해 30억 유로를 지불할 것입니다."
 EUevent.2.a: "알겠다"
 EUevent.17.t: "유럽연합-튀르키예 협정"
 EUevent.17.d: "§C[EUU.GetFlag] 유럽연합§!과 [TUR.GetNameWithFlag]은(는) 튀르키예에서 유럽으로 유입되는 비정규 이민자들의 흐름을 막기 위한 협정에 도달했습니다. EU-튀르키예 성명에 따라 튀르키예를 거쳐 그리스 섬으로 도착한 신규 비정규 이민자 및 망명 신청자 중 망명 신청이 불허된 모든 이는 튀르키예로 송환됩니다. §C[EUU.GetFlag] 유럽연합§!은 튀르키예 내 난민 지원 시설을 위해 30억 유로를 지불할 것입니다."
 EUevent.17.a: "알겠다"
 EUevent.4.t: "유럽 합중국"
 EUevent.4.d: "[FROM.GetNameWithFlag]은(는) §C[EUU.GetFlag] 유럽연합§!의 회원국들을 §C[EUU.GetFlag] 유럽 합중국§!이라는 하나의 유럽 초국가로 통합하고 있습니다. [ROOT.GetNameWithFlag]은(는) 주권을 포기하고 §C[EUU.GetFlag] 유럽 합중국§!에 합류할 것입니다."
 EUevent.4.a: "환희의 송가여!"
 EUevent.5.t: "유럽 부채 위기"
 EUevent.5.d: "유럽연합이 유로존 개혁을 법제화하는 데 실패했습니다. 연합 내 국가들은 정부 부채를 상환하거나 차환하지 못하고 있으며, 부채에 허덕이는 은행들을 구제할 수도 없는 상황입니다. 회원국들은 현재 유로존의 재정적, 경제적 생존 능력을 확보하기 위해 서둘러 개혁을 추진하고 있습니다. 위기가 시작되었으며 유로화는 벼랑 끝에 서 있습니다."
 EUevent.5.a: "유로화의 운명이 걸렸다!"
 EUevent.6.t: "유로존 개혁"
 EUevent.6.d: "재정 동맹의 도입, 유럽중앙은행(ECB)의 권한 확대 및 추가적인 안정화 메커니즘 등 유로존 내의 일련의 개혁을 통해 다가오던 부채 위기를 모면했습니다. 유로존은 구원받았으며, 이제 유럽연합은 위기를 모면했다는 자신감을 가지고 미래를 바라볼 수 있게 되었습니다."
 EUevent.6.a: "다양성 속의 통일(In varietate concordia)."
 EUevent.7.t: "유로존 개혁"
 EUevent.7.d: "미국에서 시작된 세계 금융 위기가 유럽 국가들 사이에서 도미노 현상을 일으키고 있습니다. 많은 유럽 의회 의원들이 유럽연합 내 여러 국가에서 눈덩이처럼 불어나는 부채에 대한 해결책을 모색하고 있습니다. 해당 국가들은 세계 금융 위기의 여파 속에서 정부 부채를 상환하거나 차환하는 데 실패했으며, 파산 직전의 은행들에 긴급 자금을 투입하는 데도 실패했습니다. 문제가 된 모든 회원국들은 부채 상환 불능 상태를 선언했으며, 재정 적자가 기존 예상보다 훨씬 더 심각하다고 발표했습니다. 이들 국가의 가장 큰 공통점은 위기의 근본 원인이 위기에 처한 자국 내 기관들을 구제하기 위해 일련의 부채 구제 패키지를 단행하면서 민간 부채가 국가 부채로 전가된 데 있다는 점입니다. 유럽중앙은행(ECB)과 국제통화기금(IMF)은 훨씬 더 끔찍한 위기를 방지하기 위해 구제 금융 패키지와 국가 구제 프로그램을 발동하는 협상을 회원국들과 시작했습니다. 한 가지 분명한 사실은 우리가 세계 금융 위기라는 태풍의 눈 가운데 서 있는 만큼, 유럽연합이 대재앙적인 위기 직전에 놓여 있다는 것입니다. 우리는 굳건해야 하며, 이 폭풍을 이겨내고 유럽연합이 흔들리지 않을 것임을 증명하기 위해 유로존을 반드시 개혁해야 합니다. 지금도, 내일도, 그리고 영원히 말입니다. 다양성 속의 통일."
 EUevent.7.a: "유로화를 위하여!"
 EUevent.8.t: "트로이카 개혁 달성!"
 EUevent.8.d: "[ROOT.GetNameWithFlag]은(는) 유럽집행위원회(EC), 유럽중앙은행(ECB), 국제통화기금(IMF)으로 구성된 소위 '트로이카'가 요구한 개혁안을 시행했습니다. 이는 곧 [ROOT.GetNameWithFlag] 국민들에게 가혹한 긴축 재정이 시작됨을 의미합니다!"
 EUevent.8.a: "우린 이겨낼 것이다!"
 EUevent.9.t: "뜻밖의 탈퇴"
 EUevent.9.d: "[ROOT.GetNameWithFlag]은(는) 유럽집행위원회(EC), 유럽중앙은행(ECB), 국제통화기금(IMF)으로 구성된 소위 '트로이카'가 요구한 개혁안을 완수하는 데 실패했습니다. 다른 회원국들이 구제금융 금지 조항(No Bailout Clause)을 원용함에 따라, [ROOT.GetNameWithFlag]은(는) 자국의 신규 통화를 가치 절하하고 파산을 막기 위해 유로존과 §C[EUU.GetFlag] 유럽연합§!을 탈퇴해야만 합니다."
 EUevent.9.a: "험난한 앞날이 기다리고 있군"
 EUevent.10.t: "유로네이비로 함대 이관"
 EUevent.10.d: "21세기에 접어들어 다국적 함대와 기동부대가 더욱 일반화되고 중요해짐에 따라, [EUU.GetFlag] 유럽연합 회원국들은 힘을 합쳐 자국의 군함들을 유로네이비(EuroNavy)로 알려진 통합 유럽 해군 사령부로 이관하기로 결정했습니다. \n\n유로네이비 사무총장직을 맡고 있는 [FROM.GetNameWithFlag] 측에서 우리 함대가 유로네이비에 합류할 것을 요구하고 있습니다."
 EUevent.10.a: "유럽이여, 바다를 지배하라!"
 EUevent.10.b: "우리의 함대는 결코 넘겨줄 수 없다!"
 EUevent.18.t: "[FROM.GetNameWithFlag] 측의 군사 훈련 개최 요청"
 EUevent.18.d: "[FROM.GetNameWithFlag] 측이 자국 국경에서 군사 훈련을 개최하길 요청하고 있습니다. 우리 국경 인근에서의 군사 훈련은 세계 긴장도를 높일 수 있으므로, 훈련을 허용하기 전에 우리 선택지의 득실을 신중하게 저울질해야 합니다."
 EUevent.18.a: "수락한다"
 EUevent.18.b: "거절한다"
 EUelection.1.t: "[GetYear]년 유럽 의회 선거"
 EUelection.1.d: "유럽 의회 선거는 5년마다 치러집니다."
 EUelection.1.a: "알겠다"
 EU_news.1.t: "유럽연합 현황"
 EU_news.1.d: "유럽연합은 순조롭게 순항하고 있습니다."
 EU_news.1.a: "알겠다"
 EU_news.20.t: "뜻밖의 탈퇴"
 EU_news.20.d: "[FROM.GetNameWithFlag]은(는) 유럽집행위원회(EC), 유럽중앙은행(ECB), 국제통화기금(IMF)으로 구성된 소위 '트로이카'가 요구한 개혁안을 완수하는 데 실패했습니다. 다른 회원국들이 구제금융 금지 조항(No Bailout Clause)을 원용함에 따라, [FROM.GetNameWithFlag]은(는) 자국의 신규 통화를 가치 절하하고 파산을 막기 위해 유로존과 §C[EUU.GetFlag] 유럽연합§!을 탈퇴해야만 합니다."
 EU_news.20.a: "작별이군!"
 EU_news.21.t: "회원국의 연합 탈퇴"
 EU_news.21.d: "§C[EUU.GetFlag] 유럽 연합§!을 떠난 [FROM.GetNameWithFlag]"
 EU_news.21.a: "작별이군!"
 EU_news.22.t: "제50조 철회"
 EU_news.22.d: "[FROM.GetNameWithFlag]이(가) 제50조의 발동을 철회하고 §C[EUU.GetFlag] 유럽연합§!에 잔류합니다."
 EU_news.22.a: "알겠다"
 EU_news.23.t: "탈퇴 조약"
 EU_news.23.d: "[FROM.GetNameWithFlag]과(와) §C[EUU.GetFlag] 유럽연합§! 회원국들이 탈퇴 조약에 서명했습니다. [FROM.GetNameWithFlag]은(는) 탈퇴 조약에 명시된 조건에 따라 §C[EUU.GetFlag] 유럽연합§!을 탈퇴하게 됩니다."
 EU_news.23.a: "잘 가시오, 친구여!"
 EU_news.24.t: "제50조 기한 연장"
 EU_news.24.d: "[FROM.GetNameWithFlag]과(와) §C[EUU.GetFlag] 유럽연합§! 회원국들이 제50조의 협상 기한을 3개월 연장하기로 합의했습니다. 이제 [FROM.GetNameWithFlag]은(는) 3개월 후에 §C[EUU.GetFlag] 유럽연합§!을 탈퇴하게 됩니다."
 EU_news.24.a: "알겠다"
 EU_news.34.t: "제50조 발동"
 EU_news.34.d: "[FROM.GetNameWithFlag]이(가) 제50조를 발동했으며, 2년 후에 §C[EUU.GetFlag] 유럽연합§!을 탈퇴할 것입니다."
 EU_news.34.a: "알겠다"
 EU_news.25.t: "유로네이비로 함대 이관"
 EU_news.25.d: "[FROM.GetNameWithFlag]이(가) 유로네이비 사무총장직을 맡고 있는 [FROM.FROM.GetNameWithFlag]에게 자국 함대를 이관하고 있습니다."
 EU_news.25.a: "알겠다"
 EU_news.26.t: "함대 이관 거부함"
 EU_news.26.d: "[FROM.GetNameWithFlag]이(가) 자국 함대의 유로네이비 이관을 거부했습니다."
 EU_news.26.a: "알겠다"
 EU_news.27.t: "신규 유럽연합 가입국"
 EU_news.27.d: "[FROM.GetNameWithFlag]이(가) §C[EUU.GetFlag] 유럽연합§!에 가입합니다."
 EU_news.27.a: "환영합니다!"
 EU_news.32.t: "전면적 통화조치(OMT) 프로그램"
 EU_news.32.d: "유럽중앙은행(ECB)이 전면적 통화조치(OMT) 프로그램을 개시했습니다."
 EU_news.32.a: "알겠다"
 EU_news.33.t: "전면적 통화조치(OMT)  프로그램 종료"
 EU_news.33.d: "유럽중앙은행(ECB)의 현행 전면적 통화조치(OMT) 프로그램이 종료됩니다."
 EU_news.33.a: "알겠다"
 EU_news.45.t: "전면적 통화조치(OMT) 프로그램 축소"
 EU_news.45.d: "유럽중앙은행(ECB)이 전면적 통화조치(OMT) 프로그램을 축소했습니다.\n§Y전면적 통화조치(OMT) 한도 규모§!: §R-$200§!억(2천억 달러) 변경.\n§Y이자율§!이 §R4.0%§! 미만인 모든 회원국: 친유럽주의 §G+5%§! 증가.\n§Y이자율§!이 §R4.0%§! 초과인 모든 회원국: 친유럽주의 §R-5%§! 감소.\n"
 EU_news.45.a: "알겠다"
 EU_news.46.t: "전면적 통화조치(OMT) 프로그램 확대"
 EU_news.46.d: "유럽중앙은행(ECB)이 전면적 통화조치(OMT) 프로그램을 확대했습니다.\n§Y전면적 통화조치(OMT) 한도 규모§!: §G+$200§!억(2천억 달러) 변경.\n§Y이자율§!이 §R4.0%§! 미만인 모든 회원국: 친유럽주의 §R-5%§! 감소.\n§Y이자율§!이 §R4.0%§! 초과인 모든 회원국: 친유럽주의 §G+5%§! 증가.\n"
 EU_news.46.a: "알겠다"
 EU_news.47.t: "유럽방위연합(EDU)"
 EU_news.47.d: "공동의 이익을 수호하고, 외부의 분쟁과 위기에 대응하며, 인접 지역에 안보를 투사하는 데 필요한 전략적 자율성을 달성하기 위해 회원국들은 군사 동맹으로서 유럽방위연합(EDU)을 결성하고 집단으로 북대서양조약기구(NATO)를 탈퇴하기로 결정했습니다."
 EU_news.47.a: "알겠다"
 EU_news.48.t: "유럽방위연합(EDU)"
 EU_news.48.d: "공동의 이익을 수호하고, 외부의 분쟁과 위기에 대응하며, 유럽 인접 지역에 안보를 투사하는 데 필요한 전략적 자율성을 달성하기 위해 [EUU.GetFlag][EUU.GetName] 회원국들은 군사 동맹으로서 유럽방위연합(EDU)을 결성하고 집단으로 북대서양조약기구(NATO)를 탈퇴하기로 결정했습니다."
 EU_news.48.a: "알겠다"
 EU_news.49.t: "북대서양조약기구(NATO) 회원국의 탈퇴 및 유럽방위연합(EDU) 합류"
 EU_news.49.d: "[FROM.GetNameWithFlag]이(가) 북대서양조약기구(NATO)를 탈퇴하고 [EUU.GetFlag] 유럽연합(EU) 및 유럽방위연합(EDU)에 합류합니다."
 EU_news.49.a: "알겠다"
 EU_news.50.t: "국경에서의 군사 훈련"
 EU_news.50.d: "[FROM.GetNameWithFlag]이(가) 우리 국경 인근에서 군사 훈련을 실시하고 있습니다. 우리도 이에 대응하는 훈련을 고려해야 합니다."
 EU_news.50.a: "알겠다"
 EU_news.51.t: "군사 훈련 맞대응"
 EU_news.51.d: "[FROM.GetNameWithFlag]이(가) 우리의 군사 훈련에 맞서 자국 국경에서 자체적인 군사 훈련을 실시하고 있습니다."
 EU_news.51.a: "알겠다"
 EU_news.35.t: "성공적인 친유럽주의 운동!"
 EU_news.35.d: "[FROM.GetNameWithFlag]이(가) 친유럽주의 운동을 전개했습니다. 결과는 성공적이었습니다! [EUU.GetFlag] 유럽연합(EU) 내 회원국 및 모든 가입 후보국에서 유럽회의주의가 3% 감소합니다."
 EU_news.35.a: "알겠다"
 EU_news.36.t: "대성공을 거둔 친유럽주의 운동!"
 EU_news.36.d: "[FROM.GetNameWithFlag]이(가) 친유럽주의 운동을 전개했습니다. 결과는 대성공이었습니다! [EUU.GetFlag] 유럽연합(EU) 내 회원국 및 모든 가입 후보국에서 유럽회의주의가 5% 감소합니다."
 EU_news.36.a: "알겠다"
 EU_news.37.t: "실패한 친유럽주의 운동!"
 EU_news.37.d: "[FROM.GetNameWithFlag]이(가) 친유럽주의 운동을 전개했으나 실패로 돌아갔습니다! 아무런 변화도 없습니다."
 EU_news.37.a: "알겠다"
