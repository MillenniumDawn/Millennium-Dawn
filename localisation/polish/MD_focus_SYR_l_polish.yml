 Syria_economic_investments: "Potencjał ekonomiczny Syrii"
 Syria_economic_investments_desc: "Our economy has always been extremely outdated and inefficient when compared to most of our neighbors yet it has the potential to become a great and powerful one. We have addressed some problems and potential investment targets in order to refurbish our capabilities and will have to start as soon as possible if we want our nation to be brought to greatness, and our people proud and content with our government"
 invigorate_hisiyah: "Ożyw strefę przemysłową Hisiyah"
 invigorate_hisiyah_desc: "A major industrial project in our country was the establishment of a new industrial city in Hisiyah. While it has been built and established we'll need to invest in it and expand it for our economy to grow"
 hisiyah_industrial_expansion: "Rozszerz strefę przemysłową"
 hisiyah_industrial_expansion_desc: "Dzięki naszemu wzrostowi gospodarczemu i przyjaznej dla biznesu polityce wiele inwestycji z nowych i odnoszących sukcesy firm napływa do regionu przemysłowego. Czas wykorzystać to i dalej rozwijać region."
 clear_aleppan_slums: "Wyczyść slumsy Aleppan"
 clear_aleppan_slums_desc: "Due to a recent population growth and unemployment, many people in Aleppo are living in slums. If we start housing projects and invest in the economy of the city we will be able to get rid of this problem"
 aleppan_economy_booming: "Inwestuj w potencjał Aleppo"
 aleppan_economy_booming_desc: "Dzięki naszemu wzrostowi gospodarczemu i przyjaznej dla biznesu polityce wiele inwestycji z nowych i odnoszących sukcesy przedsiębiorstw napływa do stref przemysłowych miasta. Teraz możemy rozszerzyć możliwości przemysłowe miasta."
 damascus_private_sector_encouragement: "Zachęcaj sektor prywatny w Damaszku"
 damascus_private_sector_encouragement_desc: "Damascus is home to a wide range of industrial activity, such as textile, food processing, cement and various chemical industries. The majority of factories are run by the state, and this has proven to be very ineffective at unleashing the city's economic potential. It's time to expand the private sector by investing in the young and promising businesses present"
 damascus_private_sector_booming: "Inwestuj w obiecujący sektor prywatny w Damaszku"
 damascus_private_sector_booming_desc: "Thanks to our economic growth and business friendly policies the private sector has expanded and grown a lot during the recent times. We will invest in this great development and make our capital an economic model"
 eastern_oil_excavation_phase1: "Projekty wydobycia ropy naftowej na wschodzie, faza 1"
 eastern_oil_excavation_phase2: "Projekty wydobycia ropy naftowej na wschodzie, faza 2"
 eastern_oil_excavation_phase3: "Projekty wydobycia ropy naftowej na wschodzie, faza 3"
 invest_in_eastern_cotton: "Inwestuj w bawełnę wschodnią"
 invest_in_eastern_cotton_desc: "Rozpoczniemy inwestycje na polach bawełny we wschodniej części kraju"
 Syria_agricultural_subsidies_decisions: "Polityka subsydiów rolnych"
 Syria_agricultural_subsidies_decisions_desc: "Rząd syryjski od lat mocno dotuje rolnictwo, aby zapewnić krajową produkcję żywności. Doprowadziło to do sytuacji, w której uprawia się prawie całą ziemię uprawną."
 syria_decision_increase_subsidies: "Zwiększyć dotacje"
 syria_decision_decrease_subsidies: "Zmniejsz dotacje"
 Syria_digital_investments_decisions: "Inwestycje cyfrowe"
 Syria_digital_investments_decisions_desc: "Nasza infrastruktura cyfrowa jest niezwykle przestarzała i praktycznie nieistniejąca. Postanowiliśmy coś z tym zrobić i zaczniemy przeznaczać część naszego budżetu na ulepszanie i inwestowanie w tę infrastrukturę."
 syria_decision_increase_investments: "Zwiększ budżet inwestycyjny"
 syria_decision_decrease_investments: "Zmniejsz budżet inwestycyjny"
 SyriaFocus.86.t: "Rozwój organizacji wolontariackich"
 SyriaFocus.86.d: "Nasze zachęcanie i finansowanie organizacji wolontariackich odniosło spory sukces dzięki przyzwoitej inkluzywności i zaufaniu mniejszości i ludzi do rządu. Ludzie tworzą wiele organizacji i stowarzyszeń, które przekraczają podziały sekciarskie i etniczne i są generalnie dość tolerancyjni wobec siebie. To wielki krok w kierunku zjednoczenia naszego narodu, ale droga wciąż jest przed nami i zajmie nam trochę czasu, zanim osiągniemy jedność narodową zdefiniowaną przez braterskie współistnienie i współpracę."
 SyriaFocus.86.a: "Ludzie się jednoczą"
 SyriaFocus.87.t: "Wzrost liczby państw o ​​niezależności gospodarczej"
 SyriaFocus.87.d: "Thanks to our successful efforts and relaxed laws towards economic activity, some states are developing durable and self-sufficient economies distinct to their resources as a result of citizens feeling more incentivised to work and businesses given more freedom to conduct their activities. This has allowed for more liquidity in our markets and a general improvement of our economy and we all have to thank decentralized development schemes aimed towards directly improving the quality of life and increasing economic opportunities based on each state's available resources. However it will take time for the country to achieve an economy that can be called sustainable and durable but as long as we are successful in investments we're sure to achieve that"
 SyriaFocus.87.a: "Nasza gospodarka się poprawia"
 SyriaFocus.88.t: "Zwycięzca Narodowego Frontu Postępowego"
 SyriaFocus.88.d: "Wygląda na to, że wygrała koalicja National Progressive Front. A partią z największą liczbą głosów jest:"
 SyriaFocus.88.a: "Nasserowcy"
 SyriaFocus.88.b: "Populiści"
 SyriaFocus.90.b: "Liberałowie"
 SyriaFocus.91.b: "Republikanie populistyczni"
 SyriaFocus.91.c: "Tak... Możemy o tym porozmawiać później"
 SyriaFocus.97.b: "Tym razem daj im nauczkę."
 SyriaFocus.98.t: "Alawicki oficerowie uciekają!"
 SyriaFocus.98.d: "The Alawites have long been a repressed minority in Syria before the Assads came to power and now that their rule came to an end a group of high ranking Alawite officers took the opportunity to justify their community's currently precarious status to declare the independence of the Alawite regions. Claiming that doing so will protect them even though it's clear that they're using their positions of power to usurp whatever they can get their hands on"
 SyriaFocus.98.a: "here goes our access to the Mediterranean"
 SyriaFocus.98.b: "nasza integralność terytorialna nie jest żartem"
 SyriaFocus.99.t: "Formation of the Syrian Green Federalist Movement"
 SyriaFocus.99.d: "A group of Kurdish political activists have formed a movement calling for the federalisation of Syria as a solution to greater inclusiveness of the marginalized Kurdish population in addition to promoting sustainable incentives. Even though their ideals were completely alienated in the political arena they're hopeful that their cries won't fall on deaf ears"
 SyriaFocus.99.a: "Federalism? In Syria?"
 SyriaFocus.100.t: "Nieudane projekty gospodarcze"
 SyriaFocus.100.d: "Nie udało nam się skutecznie zachęcić do dobrobytu gospodarczego w wielu stanach. Być może było to spowodowane tym, że nasz rząd nie był wystarczająco przyjazny biznesowi, aby zachęcić ludność do zakładania i pracy w firmach"
 SyriaFocus.100.a: "Więcej szczęścia następnym razem"
 SyriaFocus.101.t: "Utrzymuje się niska aktywność polityczna"
 SyriaFocus.101.d: "We have received the report and it seems that people are still not being motivated enough to attend townhall meetings. The people still do not have enough trust in the government and its institutions to feel that they will be heard and thus aren't inclined to take part in regional decision-making. We'll have to gain the people's trust and assure that their voices will be heard in order to motivate them to become active in politics and society"
 SyriaFocus.101.a: "Powinniśmy bardziej się starać"
 SyriaFocus.102.t: "Wzrost aktywności politycznej"
 SyriaFocus.102.d: "Our efforts to encourage the people to become politically active have paid off. Many people are flocking towards their respective municipality's townhall and are discussing issues and policies. This will lead to the state implementing policies respective to its own distinct peoples and will ensure that people respect the rule of law and shape their own lifestyle the way they please. Notably more effort is needed to entrench this behaviour and witness a Swiss model of democracy"
 SyriaFocus.102.a: "Ludzie staną się panami swojego losu"
 SyriaFocus.103.t: "Powstanie Federacji Syryjskiej"
 SyriaFocus.103.d: "The road was long and difficult, but we did it! Much effort spent in bringing the people together has led to our nation becoming a model example of direct democracy under the banner of the federation. Brotherhood and cooperation have become the order of the day unlike a few years ago when divides, discrimination and bigotry were prevalent and seemingly impossible to overcome yet, coexistence has been truly entrenched and these divides appear no more. Long live the Syrian Federation where everyone lives free of tyranny, and indifferent to any attempts of division. For we shall cooperate towards achieving the hopeful future"
 SyriaFocus.103.a: "Trzymając się za ręce, patrzymy w przyszłość"
 SyriaFocus.104.t: "Odrodzenie Republiki Syryjskiej"
 SyriaFocus.104.d: "Once deemed impossible, now has become reality! A nation-state united and powerful in a region of heterogenous peoples, have reunited by the will of its people to form a state defined by itself as servant of the people of Syria. The people stand under the banner that unites them no matter what ethnicity or sect they adhere to, in total contradiction to our neighbors. A sense of patriotism towards Damascus's tricolored three starred flag overwhelms any other, as the people have chosen to unite with their homeland under a single identity. Long live the Republic and its people where everyone shall experience the glory and pride of the state, resilient against odds, and determined to face whatever lies ahead"
 SyriaFocus.104.a: "Z podniesioną flagą i patrząc na nią z nadzieją, patrzymy w przyszłość"
 SyriaFocus.104.b: "Przyznajcie im zarezerwowane miejsca w parlamencie"
 SyriaFocus.105.t: "Status reprezentacji Druzów"
 SyriaFocus.105.d: "The Druze are a religious minority in Syria living in the southern mountainous regions of south Syria that suffered repression throughout Syria's history. Should we grant them reserved seats in parliament to ensure they acquire the representation they deserve or should we simply encourage political participation in their regions? Bear in mind that granting them seats will implement elements of confessionalism which is dividing the political system along sectarian lines. This might have future repercussions since the politicians might abuse their powers, accuse anyone who criticizes them of attacking the entire sect, and it will cause discontent in the minorities that weren't granted seats in parliament"
 SyriaFocus.105.a: "Po prostu zachęcaj ich do aktywności politycznej"
 SyriaFocus.105.b: "Przyznajcie im zarezerwowane miejsca w parlamencie"
 SyriaFocus.106.t: "Fate of citizenship-denied Kurds"
 SyriaFocus.106.d: "Ever since the previous regime got to power there have been at least 300,000 Kurds with no citizenships granted, leaving them treated as foreigners in their own country. Should we start the process of distributing citizenships to them?"
 SyriaFocus.106.a: "Tak"
 SyriaFocus.106.b: "NIE"
 SyriaFocus.107.t: "Społeczność chrześcijańska domaga się miejsc siedzących!"
 SyriaFocus.107.d: "Seeing how other religious communities received seats in parliament, the Christian community, fearing misrepresentation, demanded that they be offered seats in parliament as well. Should we grant them seats risking increased drawbacks from confessionalism? Or should we deny them seats and receive discontent from the Christian community?"
 SyriaFocus.107.a: "Dajcie im miejsca"
 SyriaFocus.107.b: "Nie mają do tego prawa"
 SyriaFocus.108.t: "Boom w branży anime"
 SyriaFocus.108.a: "Kurwa, weeaboos będą teraz wszędzie"
 SyriaFocus.111.t: "Kurdowie się odłączają"
 SyriaFocus.111.d: "Niezadowoleni ze swojego wyobcowania, Kurdowie wykorzystują naszą osłabioną pozycję i buntują się przeciwko nam. Dążą do niepodległości od Syrii i tworzą własne państwo. To najprawdopodobniej doprowadzi do kolejnego konfliktu w Syrii."
 SyriaFocus.111.a: "Cholera"
 SyriaFocus.112.t: "Przemysł fosforanowy i jego pytania"
 SyriaFocus.112.d: "Ponieważ Syria ma duże zasoby fosforanów, wydaje się, że mamy przed sobą dwie opcje: jedną dla zysku, a drugą dla poprawy naszej agrokultury. Oczywiście eksport fosforanów może trochę przyspieszyć naszą gospodarkę, ale jednocześnie, jeśli naprawdę dbamy o naszą agrokulturę, może trochę samodzielności byłoby lepsze. W końcu chodzi o wybór samodzielności lub handlu. Więc którą opcję powinniśmy wybrać?"
 SyriaFocus.112.a: "Dla niepodległej i lepszej Syrii wykorzystamy ich na własną rękę."
 SyriaFocus.112.b: "Zysk nie jest zły, prawda?"
 SyriaDecisions.16.t: "Zwycięstwo"
 SyriaDecisions.16.desc: "Osiągnęliśmy nasze cele w wojnie granicznej"
 SyriaDecisions.16.a: "Świetnie"
 SyriaDecisions.17.t: "Awaria"
 SyriaDecisions.17.desc: "Nie udało nam się osiągnąć naszych celów w wojnie granicznej"
 SyriaDecisions.17.a: "Cholera"
 SYR_homs_oil_refineries_focus: "Rozwiń rafinerie ropy naftowej"
 SYR_homs_oil_refineries_focus_desc: "Atrakcyjne i obfite złoża ropy czekają na eksplorację we wschodnich regionach kraju. Rozpoczniemy ten proces kosztem możliwości rolniczych ze względu na zanieczyszczenie, które spowodujemy."
 military_power_vacuum: "Wojskowa próżnia mocy"
 military_power_vacuum_desc: "Due to the violent political atmosphere of Syria, which now has involved the military, it seems because of severe political, or better to say, \"coup\" activities of the Syrian military, which has led to the collapse of the Alawite high command, it is experiencing an era of chaos. "
 Syria_2000: "Drzewo Syryjskiego Skupienia"
