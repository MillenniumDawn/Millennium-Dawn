 MD_sftc_school_tt_1: "£army_experience 육군 경험치: §R-200§!\n£navy_experience 해군 경험치: §R-175§!\n£air_experience 공군 경험치: §R-175§!\n국가 정신 §Y특수 작전 학교 I§!을 획득합니다:\n £specops_training_speed_texticon  특수 부대 훈련 시간: §G-5%§!\n 특수 부대 상한: §G+1%§!\n특수 부대 훈련 £doctrine_mastery 하루당 §Y숙련도§!가 §Y0.5§!에서 §G0.75§!로 상승합니다"
 MD_sftc_school_tt_2: "£army_experience 육군 경험치: §R-250§!\n£navy_experience 해군 경험치: §R-200§!\n£air_experience 공군 경험치: §R-200§!\n국가 정신 §Y특수 작전 학교 II§!를 획득합니다:\n장착 중인 경우 §Y특수 작전 학교 I§!을 대체합니다.\n £specops_training_speed_texticon  특수 부대 훈련 시간: §G-10%§!\n 특수 부대 상한: §G+2%§!\n특수 부대 훈련 £doctrine_mastery 하루당 §Y숙련도§!가 §Y0.75§!에서 §G1.0§!으로 상승합니다"
