l_english:
 charoenchai_hinthao: "Charoenchai Hinthao"
 charoenchai_hinthao_desc: "A Royal Thai Army chief of the 2020s generation who built his reputation on defensive doctrine and the hard lessons of the southern border. He drills his formations to hold ground and bleed an attacker white."
 songwit_noonpakdee: "Songwit Noonpakdee"
 songwit_noonpakdee_desc: "A senior Royal Thai Army officer known for staff work and organisation rather than showmanship. He keeps the army's formations manned, supplied, and ready, and he is at ease with the politics that come with high command."
 adung_phaniam: "Adung Phan-iam"
 adung_phaniam_desc: "A Royal Thai Navy flag officer of the modern fleet, at home with the capital ships and the doctrine of surface action. He argues for a navy that can be felt beyond the Gulf of Thailand."
 punpakdee_pattanakul: "Punpakdee Pattanakul"
 punpakdee_pattanakul_desc: "A Royal Thai Air Force officer of the reform generation who pushes the service toward professional standards, modern airframes, and a training pipeline that produces aircrew rather than parade formations."
 intel_chief_nia: "Director, National Intelligence Agency"
 intel_chief_nia_desc: "The head of Thailand's National Intelligence Agency runs the country's civilian intelligence effort, weaving the reporting from the provinces, the borders, and the palace network into a single picture for the government."
 fah_sangwan: "Fah Sangwan"
 fah_sangwan_desc: "A fictional air commander of the pan-Thai movement who throws the air force behind the ground campaign, flying close support over the reclaimed frontier. Not based on any real person."
 thailand_focus: "Thai Focus Tree"
 SIA_the_2001_election_shortcut: "The 2001 Election"
 SIA_lost_territories_shortcut: "The Lost Territories"
 SIA_armed_forces_modernization_shortcut: "Armed Forces Modernization"
 SIA_amazing_thailand_shortcut: "Amazing Thailand"
 SIA_asean_centrality_shortcut: "ASEAN Centrality"
 SIA_the_southern_question_shortcut: "The Southern Question"
 SIA_kra_gateway_shortcut: "The Kra Gateway"
 SIA_assess_the_kingdom: "Assess the Kingdom"
 SIA_assess_the_kingdom_desc: "Thailand enters the new millennium battered by the 1997 crash but intact. Before choosing a direction, the government must take honest stock of the Kingdom's strengths. Its industry, its farms, its beaches, and its fractures."
 SIA_recover_from_97_crisis: "Recovery from the Tom Yum Kung Crisis"
 SIA_recover_from_97_crisis_desc: "The 1997 Asian Financial Crisis began in Bangkok when the baht's peg broke. The IMF standby arrangement keeps us solvent, and it keeps us under supervision. Finish the job of recovery."
 SIA_the_1997_constitution: "The People's Constitution"
 SIA_the_1997_constitution_desc: "The 1997 Constitution, drafted with unprecedented public participation, promises an elected Senate, human-rights guarantees, and strong anti-corruption bodies. Whether it survives contact with Thai politics is another question."
 SIA_repay_the_imf: "Repay the IMF Early"
 SIA_repay_the_imf_desc: "Clear the remaining IMF obligations ahead of schedule and reclaim full economic sovereignty. A point of immense national pride, and a useful political trophy."
 SIA_amazing_thailand: "Amazing Thailand"
 SIA_amazing_thailand_desc: "The tourism campaign that carried us through the crisis years becomes national strategy. From Phuket to Chiang Mai, the world is invited to the Land of Smiles, and the world pays in hard currency."
 SIA_rice_and_rubber: "Rice Bowl of Asia"
 SIA_rice_and_rubber_desc: "Thailand is the world's leading rice exporter and a rubber superpower. Modernize the farm economy of Isaan and the South and turn agricultural muscle into export earnings."
 SIA_detroit_of_asia: "The Detroit of Asia"
 SIA_detroit_of_asia_desc: "Japanese and American automakers have made the Eastern Seaboard their regional factory floor. Double down on the auto industry and make 'made in Thailand' a global standard."
 SIA_suvarnabhumi_airport: "Suvarnabhumi Airport"
 SIA_suvarnabhumi_airport_desc: "Decades in the planning, the new Bangkok airport will be the great aviation hub of Southeast Asia. Provincial gateways like Phuket feed traffic into it and lift Thai aviation as a whole, if we can finish building it."
 SIA_eastern_economic_corridor: "The Eastern Seaboard"
 SIA_eastern_economic_corridor_desc: "Deepen the industrial corridor from Chonburi to Rayong with ports, refineries, factories, and rail. The engine room of the Thai economy."
 SIA_medical_hub: "Medical Hub of Asia"
 SIA_medical_hub_desc: "World-class hospitals at developing-world prices. Medical tourism brings in patients, and prestige, from across the globe."
 SIA_land_of_smiles: "Land of Smiles"
 SIA_land_of_smiles_desc: "Cuisine, cinema, muay thai, festivals, beaches. Thai soft power is a strategic asset. Few countries are loved like Thailand is loved. Spend that affection wisely."
 SIA_asean_centrality: "ASEAN Centrality"
 SIA_asean_centrality_desc: "Bangkok was where ASEAN was founded in 1967. Reinvest in the neighborhood, because a stable, friendly Southeast Asia is Thailand's best security guarantee."
 SIA_treaty_ally: "Major Non-NATO Ally"
 SIA_treaty_ally_desc: "The oldest US treaty relationship in Asia. Deepen Cobra Gold, welcome American hardware, and bank the security guarantee while it lasts."
 SIA_bamboo_bends_east: "The Bamboo Bends East"
 SIA_bamboo_bends_east_desc: "Thai diplomacy bends with the wind, and the wind is blowing from Beijing. Chinese investment, Chinese railways, Chinese markets, all of it at a price still being negotiated."
 SIA_the_2001_election: "The 2001 Election"
 SIA_the_2001_election_desc: "The first general election under the People's Constitution. A telecom billionaire promises debt relief, cheap healthcare, and a CEO's approach to government. The country is listening."
 SIA_thai_rak_thai: "Thai Rak Thai"
 SIA_thai_rak_thai_desc: "Thais Love Thais. Thaksin Shinawatra's landslide redraws the electoral map. The rural North and Northeast now decide who governs, and they have chosen their champion."
 SIA_thaksinomics: "Thaksinomics"
 SIA_thaksinomics_desc: "A dual-track economy. Export industries on one track, village-level demand stimulus on the other. Orthodox economists scoff. The growth numbers do not."
 SIA_30_baht_healthcare: "30-Baht Healthcare"
 SIA_30_baht_healthcare_desc: "Any illness, any hospital, thirty baht. Universal coverage transforms life for millions of rural Thais, and cements their loyalty at the ballot box."
 SIA_village_fund: "The Million-Baht Village Fund"
 SIA_village_fund_desc: "A million baht of revolving microcredit for every village and urban community in the Kingdom, one of the largest microfinance programs ever attempted."
 SIA_otop: "One Tambon One Product"
 SIA_otop_desc: "Every subdistrict develops, brands, and exports a signature local product. Cottage industry becomes national strategy."
 SIA_dual_track_economy: "The Dual-Track Economy"
 SIA_dual_track_economy_desc: "Exports up, rural incomes up, debt repaid early. Whatever the critics say about how it was done, the scoreboard reads in the government's favor."
 SIA_war_on_drugs: "War on Drugs"
 SIA_war_on_drugs_desc: "A three-month campaign to break the methamphetamine trade. It will be popular. It will also draw grave human-rights scrutiny that follows the government for years."
 SIA_ceo_premier: "The CEO Premier"
 SIA_ceo_premier_desc: "Run the country like a company. KPIs for ministries, mobile cabinet meetings in the provinces, impatience with procedure. Effective, and corrosive to every institution designed to say no."
 SIA_dominant_party_state: "One Party, One Thailand"
 SIA_dominant_party_state_desc: "Absorb the coalition partners, dominate the airwaves, win every by-election. Electoral politics continues, now with a single overwhelming choice."
 SIA_consolidate_democracy: "Consolidate the Democracy"
 SIA_consolidate_democracy_desc: "Win power through ballots, hold it through results, and leave the institutions standing. The populist machine submits itself to the People's Constitution."
 SIA_thaksin_forever: "Thaksin Forever"
 SIA_thaksin_forever_desc: "The opposition is irrelevant, the courts are managed, the senate is friendly. Why should the project ever end? The dominant party becomes the permanent party."
 SIA_shinawatra_dynasty: "The Shinawatra Dynasty"
 SIA_shinawatra_dynasty_desc: "The movement outlives any single leader. A sister, a daughter, the name on the ballot changes. The network behind it does not."
 SIA_the_old_order: "The Network Monarchy"
 SIA_the_old_order_desc: "Palace, army, judiciary, bureaucracy. These are the institutions that have steered Siam through every storm. They did not survive seven decades of upheaval by letting elections decide everything."
 SIA_privy_council: "The Privy Council"
 SIA_privy_council_desc: "The King's councillors, retired generals, judges and statesmen, sit at the quiet center of the establishment's web. Strengthen the channels that bypass elected government."
 SIA_sufficiency_economy: "The Sufficiency Economy"
 SIA_sufficiency_economy_desc: "The royal development philosophy of moderation, resilience, and immunity to shocks. A pointed counter-model to debt-fueled populist growth."
 SIA_royal_guidance: "The King's Word"
 SIA_royal_guidance_desc: "Each December the palace speaks, and the nation listens. A birthday address can bless a government or quietly withhold its blessing, a power no ballot confers and no minister dares contest. Let the throne's voice set the bounds of the possible."
 SIA_three_pillars: "Nation, Religion, King"
 SIA_three_pillars_desc: "Chat, Sasana, Phra Maha Kasat, the three-coloured flag made into civic catechism. Monks in the schools, the King on every wall, the nation as a single moral body. It is a powerful glue, except where the mosques are full and the catechism reads as a closing door."
 SIA_2004_tsunami: "The Boxing Day Tsunami"
 SIA_2004_tsunami_desc: "On 26 December 2004 the Andaman Sea withdraws, then returns as a wall of water. Phuket, Khao Lak and Phang Nga are obliterated. Thousands are dead, among them the King's own grandson. How the kingdom answers its worst disaster in living memory will be remembered for a generation."
 SIA_yellow_shirts: "The People's Alliance Rallies"
 SIA_yellow_shirts_desc: "The People's Alliance for Democracy fills the streets of Bangkok in royal yellow, demanding the elected government's removal. The middle class has chosen its side."
 SIA_the_2006_coup: "The September Coup"
 SIA_the_2006_coup_desc: "While the Prime Minister is abroad, tanks roll into Bangkok. The constitution is suspended, and the Council for Democratic Reform assumes control. The cycle begins again."
 SIA_guardian_of_the_nation: "Guardian of the Nation"
 SIA_guardian_of_the_nation_desc: "The army's self-image made doctrine. Above politics, yet entitled to end any politics that threatens the nation. Institutionalize the military's veto."
 SIA_judicial_activism: "The Judicialization"
 SIA_judicial_activism_desc: "Why send tanks when a court ruling will do? Party dissolutions and disqualifications become the establishment's scalpel of choice."
 SIA_the_2014_coup: "The NCPO"
 SIA_the_2014_coup_desc: "Martial law first, coup second. The National Council for Peace and Order suspends politics indefinitely, attitude adjustment for a whole country."
 SIA_lese_majeste_enforcement: "Defend the Sacred Institution"
 SIA_lese_majeste_enforcement_desc: "Section 112 of the Criminal Code shields the monarchy from insult. Enforce it without restraint, and watch every opposition movement weigh its words."
 SIA_isoc_state: "The ISOC State"
 SIA_isoc_state_desc: "The Internal Security Operations Command, the army's political arm in every province, becomes a parallel government for 'security' matters, the Deep South above all."
 SIA_the_2017_constitution: "A Guided Democracy"
 SIA_the_2017_constitution_desc: "A fully appointed Senate, an unelected-PM clause, a twenty-year national strategy binding future governments. Elections will resume, inside a cage."
 SIA_perpetual_guardianship: "Perpetual Guardianship"
 SIA_perpetual_guardianship_desc: "Formalize what was always implicit. The armed forces become the permanent constitutional umpire. Stability, of a kind, forever."
 SIA_royal_restoration: "Restoration of the Throne"
 SIA_royal_restoration_desc: "Go further than any government has dared. Gather the threads of the network and place them formally in the palace's hands. The Chakri dynasty resumes direct stewardship of the realm."
 SIA_seeds_of_reform: "Seeds of Reform"
 SIA_seeds_of_reform_desc: "Outside the old binary of populists and royalists, a third force gathers. Young, urban, online, and done with coups. (Historically this wave crystallized in 2018-2023, but here it begins early.)"
 SIA_future_forward: "A Future Forward"
 SIA_future_forward_desc: "A new party of first-time politicians promises to break the cycle. Demilitarize, decentralize, democratize. The establishment reaches for its usual tools and finds the target moving."
 SIA_three_demands: "The Three Demands"
 SIA_three_demands_desc: "Dissolve parliament. Stop intimidating the people. Draft a new constitution. Students say aloud what could not be said, and the ceiling of Thai politics moves."
 SIA_demilitarize_politics: "Soldiers Out of Politics"
 SIA_demilitarize_politics_desc: "End conscription abuses, cut the generals' media empires and board seats, and write the army out of politics. They will not thank us for it."
 SIA_civilian_control: "Civilian Supremacy"
 SIA_civilian_control_desc: "A defense ministry run by civilians, promotions reviewed by parliament, and a military budget that answers to auditors. Radical only in Bangkok."
 SIA_amend_section_112: "Amend Section 112"
 SIA_amend_section_112_desc: "Reform the lese-majeste law. Limit who can file complaints, cap sentences, end its use against political speech. The most dangerous bill in Thailand. There may be no way through, and no way back."
 SIA_decentralize: "Beyond Bangkok"
 SIA_decentralize_desc: "Elected governors for every province and budgets that do not pass through the capital. Bangkok has been the whole country for too long."
 SIA_break_the_monopolies: "Break the Monopolies"
 SIA_break_the_monopolies_desc: "Liquor duopolies, telecom concessions, conglomerate cross-holdings. Pry open the choke points of the Thai economy and let competitors in."
 SIA_welfare_state: "A Thai Welfare State"
 SIA_welfare_state_desc: "From a patchwork of subsidies to a real safety net of pensions, childcare, and unemployment insurance. Expensive, and transformative."
 SIA_marriage_equality: "First in Southeast Asia"
 SIA_marriage_equality_desc: "Marriage equality becomes law, the first in Southeast Asia. A reform the whole world notices, and the rare one the establishment does not fight."
 SIA_deep_south_peace: "Peace in the Deep South"
 SIA_deep_south_peace_desc: "Autonomy within the Kingdom, justice for past abuses, Patani-Malay identity respected. The insurgency ends at a negotiating table, not a checkpoint."
 SIA_consolidated_democracy: "The Consolidated Democracy"
 SIA_consolidated_democracy_desc: "A constitution written by citizens, soldiers in barracks, courts that judge and do not rule. The cycle of coups is broken, made unthinkable at last."
 SIA_a_new_republic: "A New Republic"
 SIA_a_new_republic_desc: "The question that was never allowed to be asked is put to a vote. Whatever the outcome, the Thailand that emerges will be unrecognizable, if it holds together at all."
 SIA_lost_territories: "The Lost Territories"
 SIA_lost_territories_desc: "1893. 1904. 1907. 1909. Every Thai schoolchild learns the dates Siam was carved by France and Britain. Phibun's generation marched to take them back once. The maps are still in the archives."
 SIA_pan_thai_movement: "One Tai Race"
 SIA_pan_thai_movement_desc: "Revive Wichit Wathakan's grand thesis. Thai, Lao, Shan, one Tai people, sundered by colonial borders, awaiting reunion under the Thai flag."
 SIA_rearmament: "Rearm the Kingdom"
 SIA_rearmament_desc: "Ambition requires steel. Raise the defense budget beyond anything the auditors have seen and put the Kingdom's industry on a war footing."
 SIA_modernize_the_rta: "Modernize the Royal Thai Army"
 SIA_modernize_the_rta_desc: "New main battle tanks, new IFVs, professional soldiers in place of lottery conscripts. The Royal Thai Army prepares for wars beyond coup duty."
 SIA_blue_water_navy: "A Two-Ocean Navy"
 SIA_blue_water_navy_desc: "The carrier Chakri Naruebet finally gets a real air wing and real escorts, and the submarine program stops being a punchline. Two coasts, two fleets."
 SIA_gripen_squadrons_rearm: "Peace Suvarnabhumi"
 SIA_gripen_squadrons_rearm_desc: "Gripens, AEW aircraft, datalinked air defense. A small air force built to win the first week of a regional war."
 SIA_dti_self_reliance: "DTI Self-Reliance"
 SIA_dti_self_reliance_desc: "The Defence Technology Institute graduates from research papers to production lines. Thai rifles, Thai armor, Thai rockets, and no embargo can stop what we build ourselves."
 SIA_thai_yai: "Our Tai Yai Brothers"
 SIA_thai_yai_desc: "The Shan of Burma speak a tongue any Thai can follow. Their militias have fought Rangoon for generations. They lack only a patron, and a flag to fight under."
 SIA_mekong_destiny: "Destiny on the Mekong"
 SIA_mekong_destiny_desc: "Sainyabuli and Champasak were Siamese within living memory, and the Lao are the Thais' closest kin. The river that divides us could run through one country."
 SIA_preah_vihear: "The Temple Is Ours"
 SIA_preah_vihear_desc: "The 1962 ICJ ruling on Preah Vihear still burns. Battambang and Siem Reap flew the Thai flag within living memory. The border disputes with Phnom Penh stop being managed, and start being used."
 SIA_lost_sultanates: "The 1909 Treaty Is Void"
 SIA_lost_sultanates_desc: "Kelantan, Terengganu, Kedah, Perlis. Tributaries of Bangkok signed away to the British Empire without a single inhabitant consulted. Denounce the Anglo-Siamese Treaty."
 SIA_suwannaphum: "Suwannaphum United"
 SIA_suwannaphum_desc: "Suwannaphum, the Golden Land of antiquity, whole again under the Thai flag. Begin the integration of the recovered territories into the Kingdom."
 SIA_victory_monument: "The New Victory Monument"
 SIA_victory_monument_desc: "The obelisk on Ratchawithi Road honors the dead of 1940-41, the last war for the lost territories. Build its successor, and let the region draw its own conclusions."
 SIA_thailand_4_0: "Thailand 4.0"
 SIA_thailand_4_0_desc: "Value-added everything. Robotics, biotech, digital services. The fourth industrial revolution, planned from Government House and proved in the Eastern Economic Corridor."
 SIA_three_airport_rail: "The Three-Airport Rail Link"
 SIA_three_airport_rail_desc: "Don Mueang, Suvarnabhumi, U-Tapao, all linked by one high-speed line, under an hour end to end. The most expensive railway in Thai history, and the spine of the EEC."
 SIA_u_tapao_aerotropolis: "U-Tapao Aerotropolis"
 SIA_u_tapao_aerotropolis_desc: "A navy airfield from the Vietnam War era becomes a 60-million-passenger gateway, with maintenance hangars, a free-trade zone, and a city that exists because the runway does."
 SIA_eec_take_off: "The Corridor Takes Off"
 SIA_eec_take_off_desc: "EV plants in Rayong, biotech in Chonburi, avionics in Chachoengsao. The Eastern Economic Corridor stops being a plan and starts being a region."
 SIA_hedge_the_bets: "Hedge the Bets"
 SIA_hedge_the_bets_desc: "The bamboo bends with the wind and snaps back. Whatever Washington or Beijing believes Thailand has promised, Thailand has promised nothing it cannot reinterpret."
 SIA_armed_forces_modernization: "Armed Forces Modernization"
 SIA_armed_forces_modernization_desc: "The 1997 crash froze procurement mid-stride, leaving half-delivered squadrons and a carrier without aircraft. Draw up a modernization roadmap the budget can actually carry."
 SIA_gripen_deal: "The Gripen Deal"
 SIA_gripen_deal_desc: "Saab offers what Washington will not. Full technology transfer, industrial offsets, an Erieye early-warning aircraft folded into the package, and no lectures about coups."
 SIA_gripen_ef_program: "Gripen E/F"
 SIA_gripen_ef_program_desc: "The F-35 was refused, and the F-16s are older than their pilots. The next-generation Gripen E/F keeps the ecosystem Thai crews already know, and it keeps Sweden's production line warm."
 SIA_eyes_in_the_sky: "Eyes in the Sky"
 SIA_eyes_in_the_sky_desc: "Israeli unmanned systems, the Searcher, Hermes, and Dominator, give Thai commanders what jungles and borders have always denied them. Persistent sight."
 SIA_chinese_steel: "Chinese Steel"
 SIA_chinese_steel_desc: "NORINCO's VT-4 costs half a Western tank and arrives without end-user sermons. The army's American M60s grow old, and its suppliers grow eastern."
 SIA_s26t_program: "The S26T Submarine"
 SIA_s26t_program_desc: "Three Yuan-class boats were promised. One might actually arrive. Between German engines that cannot be exported and budgets that cannot be defended, the navy's submarine dream tests everyone's patience."
 SIA_chakri_modernization: "Refit the Flagship"
 SIA_chakri_modernization_desc: "HTMS Chakri Naruebet has spent more years pierside at Sattahip than at sea. New combat systems and sensors may finally give the kingdom's carrier a job worthy of her crew."
 SIA_uxv_carrier_conversion: "The Drone Carrier"
 SIA_uxv_carrier_conversion_desc: "The Harriers are museum pieces, but the ski-jump remains. Convert the flagship to launch unmanned aircraft, surface craft and submersibles, the first UXV carrier in Southeast Asia."
 SIA_telecom_empire: "The Telecom Concession"
 SIA_telecom_empire_desc: "Satellites, mobile networks, a media empire, all flourishing remarkably under a government of telecom magnates. The line between national champion and family business has never been thinner."
 SIA_prayuth_premiership: "The General's Premiership"
 SIA_prayuth_premiership_desc: "The coup leader trades his uniform for a suit and his junta title for an elected one. The 250 appointed senators who vote for prime minister make the arithmetic comfortable."
 SIA_senate_of_appointees: "A Senate of Appointees"
 SIA_senate_of_appointees_desc: "Two hundred and fifty senators, every one selected by the military council, every one with a vote on who governs. The opposition can win elections. Winning power is another matter."
 SIA_2020_protest_response: "The Youth in the Streets"
 SIA_2020_protest_response_desc: "Students flood the monuments with three demands and a three-finger salute. Every option, whether dispersal, dialogue, or delay, teaches the next generation something about the state."
 SIA_orange_wave: "The Orange Wave"
 SIA_orange_wave_desc: "A new political generation organizes online, funds itself in small donations, and treats the old patronage networks as a problem to be deleted rather than inherited."
 SIA_digital_democracy: "Digital Democracy"
 SIA_digital_democracy_desc: "Open data, online services, a state that answers email. Transparency as infrastructure, and infrastructure, unlike promises, is hard to repeal."
 SIA_creative_economy: "The Creative Economy"
 SIA_creative_economy_desc: "Film, food, festivals, design. Thai soft power becomes an export sector with a ministry's attention and a balance-sheet line of its own."
 SIA_truth_and_reconciliation: "Truth and Reconciliation"
 SIA_truth_and_reconciliation_desc: "The drug war's dead, the crackdowns, the disappeared of the Deep South. A commission with subpoena power writes the official account, because a democracy keeps its own records."
 SIA_the_2005_landslide: "The 374-Seat Sweep"
 SIA_the_2005_landslide_desc: "Thai Rak Thai wins 374 of 500 parliamentary seats, the largest single-party majority in Thai history. The network of the old establishment watches the vote count in silence."
 SIA_rice_pledging_scheme: "The Rice-Pledging Scheme"
 SIA_rice_pledging_scheme_desc: "The Yingluck government's flagship rural programme has the state purchase farmers' rice at above-market prices and hold the stockpile. The villages benefit. The treasury depends on the world price cooperating."
 SIA_red_shirts_mobilized: "The Streets Behind the Ballot"
 SIA_red_shirts_mobilized_desc: "Put the rural base on the streets. Red-shirt networks across the Northeast march in their hundreds of thousands, but a populist mob filling the capital does not cow the generals. It alarms the palace and the high command and hands them their pretext. The confrontation that ends with tanks at Government House draws closer. (Coup risk rises.)"
 SIA_heartland_development: "Develop the Red Heartland"
 SIA_heartland_development_desc: "The villages of Isaan and the North delivered the landslide, and now they are paid in policy. New roads and rail reach across the Khorat plateau and into the Chiang Mai valleys, and provincial offices put administration, and jobs, where the movement's base actually lives, not in the capital that never voted for it."
 SIA_crown_property_bureau: "The Crown Property Bureau"
 SIA_crown_property_bureau_desc: "The Bureau manages billions in royal assets, from hotels to real estate to major industrial stakes. Putting those returns to work for national development requires quiet negotiation at the highest level."
 SIA_eastern_tigers: "The Eastern Tigers"
 SIA_eastern_tigers_desc: "The 2nd Army Region and the armoured corps, the Burapha Phayak, Tigers of the East. Their loyalty is the sinew of the royalist state, and their commanders are the next generation of generals."
 SIA_buddhist_nationalism: "Buddhist Nation"
 SIA_buddhist_nationalism_desc: "The junta embraces the monks as partners in social order. Saffron robes in state ceremonies, Buddhism in the school curriculum, and a quiet elevation of the Sangha as moral authority. The Deep South does not receive it quietly."
 SIA_royal_succession_managed: "The Transition of Reign"
 SIA_royal_succession_managed_desc: "The Ninth Reign ends. A year of mourning, black clothes and bowed heads across Bangkok, and then the Tenth Reign must establish its own authority. It will be different."
 SIA_conscription_abolished: "A Professional Army"
 SIA_conscription_abolished_desc: "End compulsory military service. A volunteer force will be smaller, better paid, and better trained, and it will owe its loyalty to the Constitution, not the generals who drafted them."
 SIA_open_skies_open_borders: "Open Skies, Open Borders"
 SIA_open_skies_open_borders_desc: "Liberalize landing rights, simplify visa rules, and let the airlines compete. The tourists who come bring money, and the workers who come bring skills. The border is Thailand's greatest asset, so stop treating it like a fortress."
 SIA_chao_phraya_megaprojects: "Chao Phraya Flood-Control and Green Power"
 SIA_chao_phraya_megaprojects_desc: "The river that twice flooded the capital will be tamed with retention reservoirs, flood barriers, and a chain of run-of-river turbines. The project is expensive. The next great flood is not."
 SIA_civil_service_reform: "Civil Service Reform"
 SIA_civil_service_reform_desc: "Replace patronage posting with competitive examination, performance evaluation, and anti-corruption screening. Slower than the old way, and cheaper in the long run."
 SIA_flood_preparedness_focus: "National Flood Preparedness"
 SIA_flood_preparedness_focus_desc: "The 2004 tsunami and the 2011 floods together cost Thailand tens of billions. Early warning systems, raised embankments, and pre-positioned emergency stockpiles are the infrastructure of resilience."
 SIA_asean_customs_window: "ASEAN Single Window Customs"
 SIA_asean_customs_window_desc: "Harmonize customs declarations, safety certificates, and phytosanitary rules across the Association's members. A truck from Chiang Rai to Kuala Lumpur stops at fewer windows than it used to."
 SIA_national_broadband_focus: "National Broadband"
 SIA_national_broadband_focus_desc: "Fiber to the province capitals, 4G to the district towns. When the network reaches a village, so does e-government, telemedicine, distance learning, and the global market for handicrafts."
 SIA_the_southern_question: "The Southern Question"
 SIA_the_southern_question_desc: "Pattani, Yala, and Narathiwat have simmered with insurgency for a generation. Mosque burnings, beheadings, and roadside bombs have killed thousands and hardened a Malay-Muslim south against a Buddhist Bangkok. The Kingdom can no longer treat the Deep South as a policing footnote. It must choose how it will answer the fire in the south. The shape of that answer will be decided by who governs in Bangkok."
 SIA_kra_gateway: "The Kra Gateway"
 SIA_kra_gateway_desc: "The century-old dream returns to the cabinet table, but this time with a balance sheet. A feasibility commission is stood up, surveyors are sent to the isthmus, and the first shared building slot is cleared at Songkhla. Nothing is committed yet. The next decision is who, if anyone, will pay for it. Requires a stable, solvent state that has already reached Thailand 4.0."
 SIA_kra_patron_china: "Belt and Road Financing"
 SIA_kra_patron_china_desc: "Beijing's offer is the cheapest on the table by far, with full BRI financing, Chinese engineering teams, and a turnkey canal in record time. The terms are generous now and onerous later. The debt is denominated in yuan, the collateral is the canal itself, and the day may come when Beijing calls the loan."
 SIA_kra_patron_japan: "Japanese Quality Infrastructure"
 SIA_kra_patron_japan_desc: "JICA and the Japanese megabank consortium build slowly, expensively, and impeccably. No debt trap, no hidden lease clause, just a higher up-front bill and a partner that expects to be repaid in goodwill as much as baht. Tokyo's regard for Bangkok climbs accordingly."
 SIA_kra_patron_consortium: "International Consortium"
 SIA_kra_patron_consortium_desc: "An ADB-led multilateral consortium spreads the cost and the risk across many hands, and insists on the pragmatic sequencing the engineers always preferred. A phased land bridge first, the full sea-level cut second. No single creditor owns the chokepoint, and Washington, Tokyo and Manila all breathe easier for it."
 SIA_kra_patron_solo: "Go It Alone"
 SIA_kra_patron_solo_desc: "No foreign creditor, no foreign clause, no foreign flag at the locks. The Kingdom funds the canal from its own treasury and its own bond market, and accepts the staggering cost as the price of absolute sovereignty over the world's newest strategic waterway."
 SIA_kra_debt_trap_warning_tt: "Accepting Belt and Road financing grants the §RSIA_kra_debt_trap§! idea. It is cheap now, but it opens the §RBeijing Calls the Loan§! default-crisis chain if construction overruns."
 SIA_two_oceans_one_kingdom: "Two Oceans, One Kingdom"
 SIA_two_oceans_one_kingdom_desc: "The last cofferdam has been removed. Salt water from the Andaman Sea and the Gulf of Thailand mix for the first time at the summit level. Thailand no longer occupies one coast. It commands two. The completion focus is available."
 SIA_kra_militarize: "A Fortress on Two Seas"
 SIA_kra_militarize_desc: "The canal is too valuable to leave undefended. Coastal batteries, a hardened naval base, and a standing transit-control mandate turn the waterway into a fortress the Royal Thai Navy can hold against any comer. The world notices the guns, and the toll-payers grumble at the militarisation."
 SIA_kra_internationalize: "A Canal for All Nations"
 SIA_kra_internationalize_desc: "Declare the Kra a neutral international transit regime, open to all flags on equal terms and guaranteed by treaty. The gesture costs Thailand a measure of leverage, but it draws the traffic, the investment, and the quiet gratitude of every maritime power that feared a chokepoint in one nation's grip."
 SIA_gateway_of_asia: "Gateway of Asia"
 SIA_gateway_of_asia_desc: "Thailand is not a country that ships pass through. Thailand is the reason they stop. Complete the transformation with international investment, a deeper port in the south, and, if the canal route was chosen, the patrol mandate that makes the chokepoint safe for all who pay the toll."
 SIA_ghosts_of_the_jungle: "Ghosts of the Jungle"
 SIA_ghosts_of_the_jungle_desc: "Deep in the hills of Isaan and the northern highlands, the cadres of the Communist Party of Thailand never truly disappeared. They taught in village schools, organised in labour unions, remembered. Now, as the country fractures, as stability becomes a memory and the government speaks only to itself, their message finds a new generation ready to hear it."
 SIA_isaan_soviets: "Isaan Soviets"
 SIA_isaan_soviets_desc: "The Northeast is the heartland, the poorest region, the most politically restive, the one the Bangkok establishment has always treated as a reservoir of cheap labour and cheap votes. Village committees, union halls, and cooperative councils become the organisational skeleton of a movement. The party does not ask for loyalty. It asks people to govern themselves, and watch what happens."
 SIA_general_strike: "The General Strike"
 SIA_general_strike_desc: "If the movement is to be more than a rural footnote, it must bring the cities to a halt. Dockworkers, factory hands, bus drivers, teachers, all called out at once. The gamble is total. If the government cannot function for long enough, it will either capitulate or escalate. There is no middle path."
 SIA_general_strike_tt: "Calls a general strike and opens the §YGeneral Strike§! decisions for 180 days. Work those levers to drive strike momentum to 100 and the government capitulates, which opens the peaceful road to power. The stoppage bleeds one percent stability every week it runs. If the 180 days end short of 100, the generals crush the strike and seize power in a coup."
 SIA_people_seize_power: "The People Seize Power"
 SIA_people_seize_power_desc: "The old government is finished. Whether it fell in a negotiating room or before a barricade, the result is the same. The Communist Party of Thailand takes governing authority. A new flag does not yet fly, but the administrative apparatus is now in the hands of people who spent decades in the jungle thinking about how to use it."
 SIA_land_to_the_tiller: "Land to the Tiller"
 SIA_land_to_the_tiller_desc: "The great estates of the Central Plains, the paddy land of Isaan, the rubber plantations of the South. The system that produced them is finished. Land redistribution, real redistribution, not a government scheme that ends when the next government arrives, is both the movement's promise and its most dangerous act. The families that owned those estates will not all go quietly."
 SIA_five_year_plan: "The Five-Year Plan"
 SIA_five_year_plan_desc: "The market allocated poorly. The state will allocate deliberately. Factories, steel, chemicals, machine tools, all planned from the centre, built with the labour of a mobilised nation. The trade deficit becomes a structural surplus of physical capital. The price, visible in the first year's consumer goods statistics, is isolation."
 SIA_red_chakri_dilemma: "The Chakri Dilemma"
 SIA_red_chakri_dilemma_desc: "One question the party leadership deferred as long as possible can no longer be deferred. What is the constitutional position of the monarchy in a communist Thailand? History offers two precedents. None of them are comfortable."
 SIA_bamboo_curtain: "The Bamboo Curtain"
 SIA_bamboo_curtain_desc: "Thailand's revolution cannot survive as an isolated experiment. Vietnam and Laos are neighbours, fellow travellers, and potential partners. A regional solidarity framework, informal and flexible, built on mutual recognition and coordinated resistance to Western economic pressure, is the architecture of a sustainable revolutionary state in Southeast Asia."
 SIA_protracted_peoples_war: "Protracted People's War"
 SIA_protracted_peoples_war_desc: "There is another road, older and bloodier than the picket line. The party of the 1970s did not win in the cities. It learned its trade in the hills, where the writ of Bangkok ran thin and a rifle counted for more than a manifesto. Build base areas in the highlands. Tax the villages the state forgot. Let the countryside surround the city until the cities have no countryside left to feed them. It is slower than a general strike, and far harder to reverse."
 SIA_peoples_tribunals: "The People's Tribunals"
 SIA_peoples_tribunals_desc: "A revolution that cannot defend itself is a season, not a settling. The old regime's networks did not evaporate when the government fell. The informers, the financiers, and the colonels who waited to see which way the wind blew were all still in place. Revolutionary courts, summary and public, answer the question of loyalty before it can be asked of the party. The fearful become obedient. The merely doubtful learn to keep quiet. It is not justice as the law schools taught it, and the party does not pretend otherwise."
 SIA_broad_united_front: "The Broad United Front"
 SIA_broad_united_front_desc: "A revolution that rules by fear rules a smaller country every year. The harder road is consent. Bring the peasant leagues, the unions, the reform intellectuals, the small traders and the village monks under one tent, and let them feel they built the new state rather than survived it. Power is shared on paper and guarded in practice, but a movement that can govern by agreement does not need to govern by the gun."
 SIA_peoples_army: "The People's Army"
 SIA_peoples_army_desc: "The plan has built the factories. Now it forges the shield. A revolutionary state in a hostile region needs an army that is large, loyal, and its own, conscripts trained in the party's image, equipped from Thai arsenals rather than foreign goodwill. Every able body that can carry a rifle is a citizen-soldier, and every workshop that can turn a barrel is a link in the supply chain. The neighbours will think twice."
 SIA_socialist_education: "Each One, Teach One"
 SIA_socialist_education_desc: "The plan has built the factories. Now it builds the people who will run them. A mass literacy campaign reaches the last village in Isaan, and cadre schools turn peasants into engineers and clerks into administrators who answer to merit rather than to whom they were born. A literate, organised population is harder to fool and cheaper to govern, and the rot of patronage that hollowed the old kingdom finds nowhere to take root."
 SIA_the_beijing_road: "The Beijing Road"
 SIA_the_beijing_road_desc: "Survival has a sponsor, and it sits in Zhongnanhai. Accept Beijing's embrace fully. Chinese capital to finish the industrial plan, Chinese markets to replace the ones the West closed, and a great-power shadow no neighbour will challenge. The price is written in fine print. China's voice in Thai councils grows louder than any Thai would once have allowed. A junior partner is still a partner, and a fed nation outlives a proud one."
 SIA_indochina_federation: "The Indochinese Federation"
 SIA_indochina_federation_desc: "Or refuse the role of client and claim the role of leader. Laos, Vietnam, and Cambodia are three revolutions that bled for the same idea, none with Thailand's industry or its central position. A federation of the three rivers, with Bangkok as its senior partner rather than Beijing's junior one, makes Southeast Asia a thing the great powers must negotiate with rather than carve up. It is the harder boast, and the prouder one."
 SIA_kingmaker_coalition: "The Kingmaker Coalition"
 SIA_kingmaker_coalition_desc: "Anutin Charnvirakul's Bhumjaithai party holds the balance of power in the 2019 parliament. Forming a coalition with them costs ministries and policy concessions, but it also buys a governing majority and access to the party's rural northeastern base."
 SIA_cannabis_decriminalized: "Cannabis Decriminalization"
 SIA_cannabis_decriminalized_desc: "Bhumjaithai's signature 2022 policy removes cannabis from the narcotics list. Farmers in Buriram and across Isaan pivot to a new cash crop. Treasury receipts climb. Conservative voices warn of a moral hazard. Both are right."
 SIA_million_rai_farms: "One Million Rai of Modern Farms"
 SIA_million_rai_farms_desc: "Bhumjaithai's rural development platform brings precision irrigation, contract-farming certification, and rubber-tree replanting subsidies across the South. The Northeast gets the new industries, and the South gets the plantation expansion. Thailand's agricultural exports grow."
 SIA_defence_industry_act: "Defence Industry Act"
 SIA_defence_industry_act_desc: "A legal framework for domestic defence production, with procurement preference for locally manufactured systems, a technology-transfer mandate on all foreign contracts, and a defence-industrial secretariat inside the Ministry. The first arms factory that results will be modest. The institutional foundation will not be."
 SIA_dti_expansion: "DTI Expansion"
 SIA_dti_expansion_desc: "The Defence Technology Institute receives a capital injection and a mandate to deliver rockets, loitering munitions, and upgraded armoured vehicle prototypes. The Isaan facility goes from a drawing office to a production line. The research bonuses follow the hardware."
 SIA_chaiseri_and_friends: "Chaiseri and Friends"
 SIA_chaiseri_and_friends_desc: "Chaiseri Metal and Rubber's First Win MRAP has already sold to Indonesia and the Philippines. With the Defence Industry Act behind them, a cluster of private defence suppliers, among them Chaiseri, Thonburi Automotive, and Thai Optical, expands. What begins as domestic procurement becomes an export ledger."
 SIA_arms_exporter: "ASEAN's Arsenal"
 SIA_arms_exporter_desc: "Thailand has built the production base, the legal framework, and the export relationships to become the region's preferred second-tier arms supplier. Not tanks and fighters, but MRAPs, artillery fuses, drones, and ammunition. Reliable, affordable, delivered on time. The repeatable export contract becomes a fixture of the treasury."
 SIA_regional_defense_pact: "Regional Defence Pact"
 SIA_regional_defense_pact_desc: "The export ledger has become a diplomatic instrument. Bangkok formalises standing defence-supply arrangements with its ASEAN partners, including guaranteed procurement channels, joint maintenance programmes, and a standing consultative framework for regional security. The factories run hotter, the attachés come home with signed agreements, and Thailand's influence in Southeast Asia is measured in ammunition allocations and spare-parts contracts."
 SIA_stream_of_the_navy: "Stream of the Navy"
 SIA_stream_of_the_navy_desc: "The Royal Thai Marine Corps receives doctrinal investment in amphibious assault and coastal defence. A dockyard expansion in the South supports the new amphibious squadron. Thai marines train alongside their Indonesian and Philippine counterparts in exercises that are no longer purely ceremonial."
 SIA_cavalry_of_the_sky: "Cavalry of the Sky"
 SIA_cavalry_of_the_sky_desc: "The Army's aviation corps gets priority. New utility helicopters for airmobile infantry, attack variants to support ground operations in the hills, and an air-assault doctrine that acknowledges Thailand's terrain is more jungle than steppe."
 SIA_cyber_command: "Cyber Command"
 SIA_cyber_command_desc: "A dedicated cyber operations command, modelled on the US CYBERCOM and the Israeli Unit 8200 frameworks. Network defence, signals intelligence, and, in a quiet annex of the funding proposal, offensive capability development. If ISOC's surveillance infrastructure already exists, the command inherits it and extends its reach into the digital dimension."
 SIA_us_coin_legacy: "U.S. COIN Legacy"
 SIA_us_coin_legacy_desc: "The Thai Army absorbed hard lessons from American counter-insurgency doctrine in the decades following the Vietnam War, with village defence programs, PSYOP, and intelligence fusion with ISOC. That framework still shapes how Thailand fights its internal enemies. Systematizing it produces results."
 SIA_development_is_security: "Development Is Security"
 SIA_development_is_security_desc: "Building roads, schools, and clinics in the restive north and northeast is not charity. It is the cheapest counter-insurgency available. Infrastructure that reaches a village before the agitator does tends to stay."
 SIA_post_cold_war_professionalization: "Post-Cold War Professionalization"
 SIA_post_cold_war_professionalization_desc: "The Cold War shaped Thailand's officer corps toward anti-communist operations, loyalty to internal order, and deference to the palace. A new generation of officers, trained in joint exercises with Western partners and schooled in international law, is redefining what the Royal Thai Armed Forces are for."
 SIA_multi_domain_operations: "Multi-Domain Operations"
 SIA_multi_domain_operations_desc: "The battlefield is no longer a line on a map. Cyber, electronic warfare, space-based imagery, and precision drone strikes merge with conventional manoeuvre. Thailand's MDO concept, developed jointly with American and Australian partners, acknowledges that the next war will be fought in every domain simultaneously."
 SIA_comprehensive_security: "Comprehensive Security"
 SIA_comprehensive_security_desc: "Human security, economic security, and military security are not separate policy domains. They are one problem viewed from different angles. The capstone doctrine integrates them, so that a Thailand that is stable, prosperous, and defended is a Thailand that no adversary can easily threaten."
 SIA_protector_of_the_realm_focus: "Protector of the Realm"
 SIA_protector_of_the_realm_focus_desc: "With the Victory Monument consecrated, Shan, Lao, Khmer, and Malay ground lies under the Thai flag. Winning that ground and governing it are different tasks. We stand up an administration for the reclaimed frontier, seed garrisons and infrastructure, and open the machinery to pacify, develop, and in time core it into the Kingdom outright. Decision frameworks for regional competition, whether diplomatic, economic, or if necessary military, are ready for the cabinet."
 SIA_atoms_for_peace: "Atoms for Peace"
 SIA_atoms_for_peace_desc: "Thailand signs the IAEA's peaceful use protocols and begins the long institutional runway. A nuclear safety authority, spent-fuel agreements, and the first domestic research reactor. The civilian programme is built on the conviction that baseload power from uranium is cheaper, cleaner, and more sovereign than oil imported at geopolitical prices."
 SIA_smr_initiative: "SMR Initiative"
 SIA_smr_initiative_desc: "Small Modular Reactors are the technology that makes nuclear power viable for a country that cannot afford the capital expenditure of a full-sized plant. The initiative funds feasibility studies, site assessments in the Eastern Seaboard, and a technology-transfer agreement with a South Korean or French consortium. The first pouring of concrete is a decade away. The decision is today."
 SIA_nuclear_power_program: "Nuclear Power Programme"
 SIA_nuclear_power_program_desc: "The capstone is a national nuclear power programme with a committed commissioning date, a sovereign fuel-cycle framework, and the first reactor on the grid. Thailand joins Japan, South Korea, and China as the only countries in the Indo-Pacific region with civilian nuclear power. Energy independence is no longer theoretical."
 SIA_bangkok_phnom_penh_axis: "Bangkok and Phnom Penh Axis"
 SIA_bangkok_phnom_penh_axis_desc: "Cambodia's geography makes it Thailand's natural economic corridor to the sea, and its political trajectory makes it Bangkok's natural diplomatic counterweight to Vietnam. This focus builds the relationship through trade missions, road links, and a shared security framework that keeps Phnom Penh close to Bangkok and further from Beijing's orbit."
 SIA_jakarta_dialogue: "Jakarta Dialogue"
 SIA_jakarta_dialogue_desc: "Indonesia is Southeast Asia's demographic giant and Thailand's most important bilateral relationship after Kuala Lumpur. The Jakarta Dialogue is the platform, bringing together bilateral ministers, joint military exercises, and a frank conversation about who leads ASEAN's next decade. The outcome depends on whether Bangkok sees Jakarta as a partner or a rival."
 SIA_asean_crossroads: "ASEAN Crossroads"
 SIA_asean_crossroads_desc: "Thailand stands at the head of Southeast Asia, and the region waits to learn what kind of leader the Kingdom means to be. Two destinies open before Bangkok. One is partnership, a security architecture built on shared interests, guarantees freely given, and a Thai-led pact that binds ASEAN by consent. The other is mastery, ASEAN remade as a Thai dominion, by the sword if the neighbours will not kneel. The road of partnership is open to any government. The road of mastery is open only to a Kingdom that has already claimed the Greater Thailand mandate, or to a populist nation roused to war."
 SIA_asean_crossroads_tt: "Choose Thailand's regional destiny, partner or master. The path of partnership (Protector of ASEAN) is open to all. The path of mastery (ASEAN Hegemony) requires the Greater Thailand mandate (SIA_lost_territories completed) OR a populist nation with war support above 50%."
 SIA_assess_the_kingdom_choice_tt: "The Kingdom takes stock. You will pick an opening priority. Recovery favours civilian construction, Order favours stability and drift defence, and Outreach favours trade standing and Political Power."
 SIA_the_2001_election_choice_tt: "The 2001 campaign opens. You will throw your weight behind one of three forces, Thai Rak Thai, the palace network and its generals, or the incumbent Democrats. Your choice boosts that party's popularity and its ideological outlook. The election then decides who governs, and only the winning party's focus path opens."
 SIA_the_2006_coup_choice_tt: "A coup unfolds. You will choose a hard-line junta that suspends elections and rewrites the constitution at a cost to stability and Western opinion, or a conciliatory junta that keeps the ballot box and pays a smaller price."
 SIA_a_new_republic_choice_tt: "The republic question goes to the nation. You will choose to abolish the monarchy and weather the turmoil, or to draw back and keep the crown for stability and Political Power."
 SIA_the_southern_question_choice_tt: "The Deep South demands an answer. You will choose the iron fist, the King's development peace, or a negotiated dialogue, each opening a different security doctrine."
 SIA_red_chakri_dilemma_choice_tt: "The revolution decides the throne. You will choose to abolish the monarchy and face a royalist insurgency, or to keep a constitutional figurehead on the Lao model and absorb the hardliners' anger."
 SIA_lost_territories_choice_tt: "The map of a greater kingdom is drawn. You will choose open irredentism for war support at the cost of standing, or quiet deniable revisionism that protects stability."
 SIA_nuclear_power_program_choice_tt: "The fuel cycle forces a decision. You will choose to defy the inspectors for weapons-latent enrichment under sanctions, or to accept IAEA safeguards and repair relations with Washington."
 SIA_prayuth_premiership_choice_tt: "The general plans his succession. You will choose to entrench the establishment through a managed transition, or to institutionalise the settlement and step back toward a civilian face."
 SIA_2020_protest_response_choice_tt: "The youth fill the streets. You will choose to crack down at a cost to stability and coup risk, to concede reform for calm and a boost to the reform movement, or to wait the protests out."
 SIA_found_the_pact: "Found the ASEAN Defence Pact"
 SIA_found_the_pact_desc: "Words become institutions. Thailand formally establishes the ASEAN Defence Community, a mutual-defence pact with Bangkok at its centre, and assumes the role of founding leader. The flag is raised. The pact is real."
 asean_defense_community: "ASEAN Defence Community"
 SIA_invite_mainland: "Invite Mainland Partners"
 SIA_invite_mainland_desc: "Vietnam, Laos, Cambodia, and Myanmar all share borders with Thailand and face shared threats. Bangkok extends formal invitations to the mainland states, making the case that security in the continental interior depends on common cause, not competing hedges."
 SIA_invite_mainland_tt: "Send Vietnam, Laos, Cambodia, and Myanmar an invitation to join the ASEAN Defense Community. Each independent, faction-free neighbour decides for itself whether to accept. A member that accepts gains a spirit that keeps it committed to the pact instead of drifting back out."
 SIA_invite_maritime: "Invite Maritime Partners"
 SIA_invite_maritime_desc: "Indonesia, the Philippines, Malaysia, Singapore, and Brunei control the seas that Thailand depends on for trade. The maritime partners are invited to join the pact, binding the archipelago and the peninsula into a single strategic community."
 SIA_invite_maritime_tt: "Send Indonesia, the Philippines, Malaysia, Singapore, and Brunei an invitation to join the ASEAN Defense Community. Each independent, faction-free state decides for itself whether to accept. A member that accepts gains a spirit that keeps it committed to the pact instead of drifting back out."
 SIA_joint_command: "ASEAN Joint Command"
 SIA_joint_command_desc: "A permanent joint command structure is established in Bangkok, integrating doctrine, logistics, and intelligence from every member state. Thai officers hold the senior seats, but the staff is genuinely multilateral. Exercises become interoperable. Plans become real."
 SIA_asean_rapid_reaction: "ASEAN Rapid Reaction Force"
 SIA_asean_rapid_reaction_desc: "The pact takes its next step, a standing rapid-reaction brigade, drawn from all member states, capable of deploying within 72 hours to any point in Southeast Asia. It is the pact's sword, small, fast, and unmistakably real."
 SIA_arsenal_integration: "ASEAN Arsenal Integration"
 SIA_arsenal_integration_desc: "Thailand's defence industry, already the workshop of Southeast Asia, standardises weapons and ammunition across every member state's armed forces. Thai-made rifles, vehicles, and artillery shells replace the patchwork of Soviet, Chinese, and Western hardware. The pact's armies now share the same bullets."
 SIA_pax_aseana: "Pax Aseana"
 SIA_pax_aseana_desc: "The work is done. The pact holds. Thailand has built what no outside power could buy, a genuine security architecture, rooted in the region, led by Bangkok, and strong enough to deter any challenger. The Pax Aseana is not a claim. It is a fact."
 SIA_war_economy_push: "War Economy Push"
 SIA_war_economy_push_desc: "The nation is on a war footing. Factories that made consumer goods are retooled for artillery shells and rifle barrels. The military-spending ceiling is lifted, procurement contracts are signed without the usual delays, and three new arms factories rise from hastily cleared lots in the Bangkok metropolitan region."
 SIA_friends_abroad: "Friends Abroad"
 SIA_friends_abroad_desc: "Thailand's armed forces have spent decades training alongside foreign partners. The bilateral links forged in joint exercises, officer exchanges, and arms transfers are a quiet pillar of Thai security, less visible than alliances, but more durable than most. It is time to formalise what already works."
 SIA_cobra_gold_focus: "Cobra Gold"
 SIA_cobra_gold_focus_desc: "Cobra Gold is the largest annual joint military exercise in Asia, co-hosted by Thailand and the United States. Deepening the exercise programme brings American doctrine, logistics training, and equipment familiarity to the Royal Thai Army, and it cements Bangkok as Washington's anchor partner in mainland Southeast Asia."
 SIA_partner_japan: "Japan Defence Ties"
 SIA_partner_japan_desc: "Japan's defence-equipment export reforms have opened new channels for Thai procurement. Tokyo offers precision manufacturing know-how, dual-use electronics, and infrastructure financing that complements Thai capabilities without the political strings attached to Chinese or American packages."
 SIA_partner_korea: "ROK Defence Partnership"
 SIA_partner_korea_desc: "The Republic of Korea has built a competitive arms industry in a single generation. K-2 tanks, FA-50 jets, and K9 howitzers are sold at competitive prices to partners across Southeast Asia. Thailand joins the queue, and brings home Korean-standard air training and industrial methodology."
 SIA_partner_australia: "Five Eyes Neighbour"
 SIA_partner_australia_desc: "Australia is Thailand's closest Anglophone partner and a fellow non-NATO ally of the United States. Joint exercises in the Andaman Sea and the Gulf of Thailand have deepened navy-to-navy ties. Expanding the partnership delivers army interoperability and maritime surveillance cooperation that neither country could afford alone."
 SIA_partner_taiwan: "Quiet Defence Cooperation"
 SIA_partner_taiwan_desc: "Taiwan's defence industry is discreet, technically sophisticated, and politically motivated to find friends. Bangkok does not recognise Taipei, but the Royal Thai Army and the ROC military have long maintained informal channels for equipment and training. Formalising that cooperation, quietly, is a calculated risk. Beijing will notice."
 SIA_hedging_partners: "Hedging Partners"
 SIA_hedging_partners_desc: "Not every friendship needs to be a choice. Tokyo, Seoul, and Beijing each offer Bangkok something Washington cannot, whether patient capital, dual-use technology, or a vast neighbouring market, and none of them demands exclusivity. By cultivating the non-aligned partners in parallel, Thailand keeps its options open and its leverage intact, refusing to be anyone's anchor or anyone's client. If the Kingdom has already chosen to hedge, these ties pay double."
 SIA_national_grid: "Powering the Kingdom"
 SIA_national_grid_desc: "Thailand's rapid industrialisation has outpaced its power grid. The Eastern Seaboard hums with factories but the grid is ageing, the transmission losses are embarrassing, and the next decade of growth demands a foundation that can carry the load. The government commits to a national infrastructure upgrade, with new substations, upgraded transmission lines, and new factories in the regions the grid can finally power."
 SIA_renewable_push: "Renewable Energy Drive"
 SIA_renewable_push_desc: "Wind off the Gulf, solar across the Central Plains, small hydro in the North. Thailand's geography is a renewable-energy asset that has been chronically underexploited. This programme commissions the first large-scale renewable installations in Chonburi, Nakhon Ratchasima, and Chanthaburi, and ties their output directly into the national grid."
 SIA_green_grid: "Green Grid and Nuclear Integration"
 SIA_green_grid_desc: "Renewable capacity is one thing, and reliable baseload is another. Integrating intermittent solar and wind with the nascent nuclear programme, or, for countries that choose not to go nuclear, with large-scale battery storage, produces a grid that is both clean and stable. The Kingdom's energy independence begins here."
 SIA_fossil_fuels_deal: "Gulf Energy Partnership"
 SIA_fossil_fuels_deal_desc: "The Kingdom's refineries run on Gulf crude and its power stations burn imported gas. Rather than fight the dependency, Bangkok formalises it. Long-term supply agreements with Saudi Arabia, Qatar, and the UAE deliver price certainty, a modest fuel-efficiency dividend through modern power-plant retrofits, and the diplomatic warmth that comes with a cheque."
 SIA_gulf_energy_ties: "Strategic Fuel Reserves"
 SIA_gulf_energy_ties_desc: "Energy security is not just about supply. It is about resilience. Two new strategic fuel-storage facilities in the southern industrial corridor and the Eastern Seaboard give Thailand a meaningful buffer against supply disruptions. The Gulf partners finance half the construction, and Thai engineers build the rest."
 SIA_iron_fist_doctrine: "Iron Fist Doctrine"
 SIA_iron_fist_doctrine_desc: "There will be no more talk of grievance. The three provinces are flooded with troops, checkpoints, and emergency powers. The insurgency is a security problem and it will be answered as one, swiftly, hard, and without apology. The world will object. The South will be quiet."
 SIA_martial_law_south: "Martial Law in the South"
 SIA_martial_law_south_desc: "An emergency decree places Pattani, Yala, and Narathiwat under military administration. Curfews, warrantless searches, and detention without charge become the daily texture of life in the South. The army can now act on intelligence the moment it arrives, and the population learns the price of harbouring the men with the guns."
 SIA_search_and_destroy: "Search and Destroy"
 SIA_search_and_destroy_desc: "Special forces and aviation conduct kinetic sweeps of the suspected cell network. The operations are decisive and the body count is high. Every raid that hits its target breaks the insurgency a little more, and every raid that hits a wedding instead hands them a generation of recruits."
 SIA_pacification_complete: "Pacification Complete"
 SIA_pacification_complete_desc: "The roadside bombs have stopped. The checkpoints have come down. By every metric Bangkok measures, the Deep South is pacified. The mosques are watched, the schools are monitored, and beneath the silence the grievance has not died. It has merely learned to wait. The guns fall silent, but the embers remain."
 SIA_royal_development_projects: "Royal Development Projects"
 SIA_royal_development_projects_desc: "Under the King's initiative, the crown's development model is brought south, with irrigation, agriculture, roads, and royally-sponsored cooperatives. The message is that the monarchy, not the insurgency, delivers for the Malay-Muslim south. Patronage and presence, not just patrols."
 SIA_isoc_southern_command: "ISOC Southern Command"
 SIA_isoc_southern_command_desc: "The Internal Security Operations Command assumes unified authority over the southern theatre, with civil-military coordination, intelligence fusion, and the soft-power apparatus all under one roof. If the ISOC network is already mature, the southern command can move from reaction to anticipation."
 SIA_winning_hearts_royally: "Winning Hearts, Royally"
 SIA_winning_hearts_royally_desc: "Scholarships, mosque renovations, halal-certified development zones, and a deliberate elevation of local Malay-Muslim notables into the patronage system. The state arrives not as an occupier but as a benefactor, and slowly, in places, the calculus of the young men shifts."
 SIA_southern_calm: "A Southern Calm"
 SIA_southern_calm_desc: "The violence has receded into a managed, monitored quiet. It is not a peace treaty and there is no autonomy, but the provinces function, the development continues, and the royal aegis holds. A calm kept by presence and patronage, watched over rather than resolved."
 SIA_peace_dialogue_initiative: "Peace Dialogue Initiative"
 SIA_peace_dialogue_initiative_desc: "Bangkok formally opens the Kuala Lumpur track, with Malaysia as facilitator. For the first time the state sits across the table from the men it has hunted, and concedes the premise that the South's future is a matter for negotiation, not only force. It costs political capital at home, but it opens a road that bullets never could."
 SIA_mara_patani_talks: "MARA Patani Talks"
 SIA_mara_patani_talks_desc: "Formal negotiations with the MARA Patani umbrella group begin in earnest. Confidence-building measures, safety zones, and a genuine ceasefire framework are on the table. Kuala Lumpur leans in, and the insurgent leadership, fractured but real, begins to believe a settlement is possible."
 SIA_autonomy_framework: "Special Autonomy Framework"
 SIA_autonomy_framework_desc: "The negotiators draft a special-administration law for the three provinces, with an elected regional council, local-language education, religious courts, and a share of development revenue retained in the South. It is the most far-reaching concession in the Kingdom's history, and the establishment in Bangkok is already mobilising against it."
 SIA_pattani_peace_accord: "The Pattani Peace Accord"
 SIA_pattani_peace_accord_desc: "A signed accord ends the longest insurgency in the Kingdom's modern history. The South gains a measure of self-government within a unitary Thailand, the guns are surrendered, and the displaced return. It is imperfect, contested, and historic. The conflict is over."
 SIA_ds_tier_to_1: "§GThe Deep South quiets to a low simmer (Tier 1, −2% stability).§!"
 SIA_ds_tier_to_2: "§YViolence climbs in Pattani (Tier 2, −4% stability, −5% political power).§!"
 SIA_ds_tier_to_3: "§RThe South is ablaze (Tier 3, −7% stability, −10% PP, −5% war support).§!"
 SIA_ds_intensity_down: "§GInsurgent intensity falls by [?ds_delta] points.§!"
 SIA_ds_intensity_up: "§RInsurgent intensity rises by [?ds_delta] points.§!"
 SIA_ds_grievance_up: "§RHeavy-handed tactics deepen community grievance by [?ds_grievance_delta]. The intensity floor rises with it, and the conflict can no longer be ground out by force alone.§!"
 SIA_ds_grievance_down: "§GA genuine concession eases community grievance ([?ds_grievance_delta]). The intensity floor the violence sits on drops, bringing a real resolution within reach.§!"
 SIA_iron_fist_doctrine_tt: "Flood the three provinces with troops. Intensity −10, but +10 coup risk and a sharply deepened community grievance (the floor the conflict can never fall below)."
 SIA_martial_law_south_tt: "Emergency decree over Pattani, Yala, Narathiwat. Intensity −8, deepens grievance, MAY/IND opinion −."
 SIA_search_and_destroy_tt: "Kinetic sweeps. Intensity −12, deepens grievance. Needs the South below 50 intensity to begin. Risk of an atrocity that backfires."
 SIA_pacification_complete_tt: "The guns fall silent, but the embers remain."
 SIA_royal_development_projects_tt: "Royal-initiative projects in the South. Intensity −6, eases grievance, +2% stability, treasury −3."
 SIA_isoc_southern_command_tt: "ISOC assumes southern command. Intensity −7 (faster if the ISOC network is active), but the surveillance net stokes a little grievance."
 SIA_winning_hearts_royally_tt: "Patronage and development. Intensity −7, eases grievance substantially, +3% stability. Needs the South below 40 intensity to begin."
 SIA_southern_calm_tt: "A managed, monitored calm under the royal aegis."
 SIA_peace_dialogue_initiative_tt: "Open the Kuala Lumpur track. Intensity −5, eases grievance, PP −75, opens negotiations."
 SIA_mara_patani_talks_tt: "Formal talks with MARA Patani. Intensity −8, eases grievance heavily, MAY opinion +, requires 45% stability."
 SIA_autonomy_framework_tt: "Draft the special-zone law. Intensity −7, the deepest cut to grievance of all. Needs the South below 35 intensity to begin. The establishment will push back."
 SIA_pattani_peace_accord_tt: "A signed accord and a path to autonomy. The conflict ends."
 SIA_anti_narcotics_bureau: "Anti-Narcotics Bureau"
 SIA_anti_narcotics_bureau_desc: "Thailand's Office of the Narcotics Control Board is expanded and given teeth, with a dedicated budget, protected investigative powers, and a formal mandate to pursue trafficking networks rather than street dealers. The bureau targets the supply chain, from Shan State laboratories to Bangkok distribution hubs."
 SIA_golden_triangle_interdiction: "Golden Triangle Interdiction"
 SIA_golden_triangle_interdiction_desc: "The tri-border region where Thailand, Myanmar, and Laos meet is the source of most of the heroin and methamphetamine flooding Thai cities and transiting to world markets. Border patrol units are reinforced, aerial surveillance extended, and a joint task force with Shan militia partners stands up to interdict shipments before they cross the Mekong. The drug lords will adapt, as they always do, but this raises the cost."
 SIA_golden_triangle_interdiction_tt: "Disrupts trafficking routes across the Mekong, seizing contraband and cash that bolster the treasury while interdiction tightens the Kingdom's grip on the north."
 SIA_anti_graft_push: "Anti-Graft Push"
 SIA_anti_graft_push_desc: "The National Anti-Corruption Commission is given teeth, with an expanded investigative mandate, a ring-fenced budget, and legal protection for whistleblowers. Procurement abuses in defence, construction, and customs, the three most lucrative vectors for graft, are targeted first. Clean contracting takes longer to establish than dirty contracting did to entangle, but the groundwork is laid."
 SIA_transparency_watchdog: "Transparency Watchdog"
 SIA_transparency_watchdog_desc: "An independent Fiscal Transparency Office is stood up, reporting directly to parliament rather than the Finance Ministry. Mandatory asset disclosure for senior civil servants, real-time public procurement reporting, and a citizen audit portal close the loopholes that have allowed systematic rent-extraction to persist. Corruption does not vanish, but it becomes measurably more expensive to sustain."
 SIA_decentralize_governance: "Empower the Provinces"
 SIA_decentralize_governance_desc: "Following the anti-corruption push, governance authority and budget allocation are redistributed from Bangkok to the provinces. Provincial Administrative Organisations gain expanded mandates, elected governors control local infrastructure spending, and Chiang Mai, Khon Kaen, and Songkhla emerge as genuine secondary poles of economic activity. Growth is slower to concentrate but broader and more resilient."
 SIA_bangkok_primacy: "Bangkok First"
 SIA_bangkok_primacy_desc: "The anti-corruption dividends are reinvested in the capital. Bangkok's industrial districts are upgraded, its research institutions concentrated, and its public transit infrastructure expanded. Efficiency gains in the Bangkok Metropolitan Region ripple outward, but critics note that prosperity is pooling in a city of ten million while the provinces wait. Regional inequality widens even as aggregate growth accelerates."
 SIA_asean_hegemony: "ASEAN Hegemony"
 SIA_asean_hegemony_desc: "The Greater Thailand project is complete on the mainland. Now the Kingdom turns its gaze to the rest of Southeast Asia. ASEAN was always a Thai-led project in spirit. Let it become one in fact, by the sword if necessary. The general staff drafts contingencies for the subjugation of the archipelago and the city-state."
 SIA_maritime_claims: "The Maritime Frontier"
 SIA_maritime_claims_desc: "Beyond the Isthmus lie the great archipelagic states, Manila, Jakarta, and the oil-rich sultanate of Brunei. A blue-water push will require the full weight of the Royal Thai Navy and Marine Corps. The admiralty begins planning amphibious operations across the South China Sea and the Java approaches."
 SIA_maritime_claims_threat: "Thai Naval Buildup in the Archipelago"
 SIA_maritime_claims_bonus: "Amphibious Doctrine Study"
 SIA_claim_philippines: "Subjugate the Philippines"
 SIA_claim_philippines_desc: "The Philippine archipelago commands the eastern approaches to the South China Sea. Bringing Manila under Bangkok's writ secures the maritime flank and the labour of a hundred million Filipinos for the new order. We press our claim on every island of the Republic."
 SIA_claim_indonesia: "Subjugate Indonesia"
 SIA_claim_indonesia_desc: "Indonesia is the giant of the south, sprawling, populous, and resource-rich. To master ASEAN, Bangkok must master Jakarta. The campaign will be long and the islands many, but the prize is the largest economy and population in Southeast Asia."
 SIA_claim_brunei: "Seize Brunei"
 SIA_claim_brunei_desc: "Tiny Brunei sits atop some of the richest hydrocarbon reserves in the region. The Sultanate's wealth and its strategic position on Borneo make it an irresistible prize. We move to fold the sultanate into the Kingdom."
 SIA_mainland_claims: "The Mainland Settlement"
 SIA_mainland_claims_desc: "Two powers on the mainland have yet to bend the knee. Vietnam, the old rival across the Annamite range, and Singapore, the wealthy city-state guarding the Strait of Malacca. Both must be brought to heel to complete Thai primacy in Southeast Asia."
 SIA_mainland_claims_threat: "Thai Mobilization Against the Mainland Holdouts"
 SIA_mainland_claims_bonus: "Border War Doctrine Study"
 SIA_claim_vietnam: "Subjugate Vietnam"
 SIA_claim_vietnam_desc: "Vietnam has long contested mainland Southeast Asia with Thailand, from the courts of old Siam to the killing fields of the twentieth century. Now the historic rivalry will be settled. We press our claim from the Mekong to the Annamite coast."
 SIA_claim_singapore: "Seize Singapore"
 SIA_claim_singapore_desc: "Singapore is the jewel of the strait, a financial powerhouse and the gatekeeper of the world's busiest shipping lane. Whoever holds the Lion City holds the throat of Asian commerce. We move to make it Thai."
 SIA_asean_protector: "Protector of ASEAN"
 SIA_asean_protector_desc: "Greater Thailand need not be an empire of conquest. Having secured the mainland, the Kingdom can instead become the guarantor of Southeast Asian security, a benevolent hegemon that shields its neighbours rather than annexing them. Bangkok extends its protection across the region, binding ASEAN to the Thai crown through alliance rather than occupation."
 SIA_guarantee_maritime: "Shield of the Archipelago"
 SIA_guarantee_maritime_desc: "Thailand extends formal security guarantees to the maritime states, the Philippines, Indonesia, and Brunei. The Royal Thai Navy will stand surety for their independence, and in return Bangkok becomes the indispensable power of the southern seas."
 SIA_guarantee_mainland: "Guardian of the Mainland"
 SIA_guarantee_mainland_desc: "Bangkok guarantees the security of Vietnam and Singapore, ending centuries of rivalry with a Thai-led settlement. The old enemy and the wealthy city-state alike shelter under the Kingdom's protection, and the mainland is at peace on Thai terms."
 SIA_protector_of_asean_focus: "One ASEAN, One Shield"
 SIA_protector_of_asean_focus_desc: "With every ASEAN capital under Thai guarantee, the Kingdom stands as the unquestioned protector of Southeast Asia. A Thai-led security architecture replaces the old balance of fear. The region's defence is now indivisible, and Bangkok holds the keystone."
 SIA_professional_officer_corps_focus: "A Professional Officer Corps"
 SIA_professional_officer_corps_focus_desc: "The reform faction wins the argument. Advancement by competence, a real staff-college pipeline, and a command culture built on doctrine rather than patronage. The coup habit fades as the army learns to take pride in soldiering instead of politics."
 SIA_martial_prestige_focus: "The Glory of the Sword"
 SIA_martial_prestige_focus_desc: "The traditionalists prevail. The armed forces are celebrated as the soul of the nation, the parade ground as sacred as the temple. Morale and martial spirit soar, but the cult of the uniform keeps the generals close to the centre of power."
 SIA_jointness_reform: "Jointness Reform"
 SIA_jointness_reform_desc: "A genuine joint command knits the three services into one fighting instrument. Combined staffs, shared doctrine, and a unified chain of command turn parallel fiefdoms into a coherent force capable of multi-domain operations."
 SIA_defense_export_office: "Defense Export Office"
 SIA_defense_export_office_desc: "A dedicated agency takes Thai-made systems to the world market, brokering contracts, arranging financing, and turning the defence-industrial base into a source of revenue rather than a drain on the budget."
 SIA_self_reliant_defense_base: "A Self-Reliant Defense Base"
 SIA_self_reliant_defense_base_desc: "New arms plants and a deepened supply chain free the Kingdom from dependence on foreign suppliers. Thailand can arm itself, and its customers, from its own factories, with its own designs, on its own schedule."
 SIA_total_defense_doctrine: "Total Defense Doctrine"
 SIA_total_defense_doctrine_desc: "Defence becomes a whole-of-nation enterprise, with broadened conscription, routine civil-defence drills, and a hardened home front. The Kingdom prepares not merely an army but a society ready to resist."
 SIA_doctrine_professional_tt: "Upgrades the §YProfessional Forces§! idea to its next tier and commits the Kingdom to the professionalization path."
 SIA_doctrine_prestige_tt: "Grants §YMartial Glory§! and commits the Kingdom to the prestige path, with high war support and command power at the cost of stability."
 SIA_national_rnd_network: "Build the Science Parks"
 SIA_national_rnd_network_desc: "Public laboratories, university partnerships, and a dedicated science park at Pathum Thani give the Kingdom a research backbone of its own. The National Science and Technology Development Agency anchors a network of R&D facilities that speeds technology adoption and lifts the whole economy toward higher-value industry."
 SIA_civilian_rnd_center: "Civilian R&D Centre"
 SIA_civilian_rnd_center_desc: "A dedicated civilian research and prototyping facility with laboratories, test benches and a pool of engineers free to chase whatever the Kingdom needs next. The catch-all of the special-project programme, it gives Thailand a fourth R&D centre to set against the lone naval yard it began with, and the room to develop projects of its own."
 SIA_air_rnd_center: "Aeronautics R&D Centre"
 SIA_air_rnd_center_desc: "An avionics and aeronautics facility with wind tunnels, an instrumented flight-test range and the engineers to run them. Thai industry gets the bench to prototype aircraft systems at home rather than buy them finished from abroad."
 SIA_army_rnd_center: "Land Warfare R&D Centre"
 SIA_army_rnd_center_desc: "A land-systems proving ground with armour test tracks, weapons ranges and a design bureau. The army can develop and prototype its own vehicles and equipment instead of waiting on foreign suppliers and their conditions."
 SIA_gistda_space_agency: "Empower GISTDA"
 SIA_gistda_space_agency_desc: "The Geo-Informatics and Space Technology Development Agency is handed a real mandate and a real budget. Founded to make sense of satellite data, GISTDA becomes the Kingdom's space institution, running ground stations, training engineers, and giving Thai research a window on everything from above. A small space programme is no longer a foreign luxury but a national capability."
 SIA_theos_earth_observation: "THEOS Earth Observation"
 SIA_theos_earth_observation_desc: "Thailand's first earth-observation satellite, THEOS, opens the Kingdom's own eyes in orbit, mapping the land, tracking floods and crops, and feeding the intelligence services imagery no neighbour can deny them. The follow-on programme deepens the agency's expertise in optics, downlink and image processing, and turns raw passes into actionable reconnaissance."
 SIA_space_krenovation_park: "Space Krenovation Park"
 SIA_space_krenovation_park_desc: "An aerospace industrial park rises on the Eastern Seaboard, with clean rooms, assembly halls and a supply chain for satellite components and small launch vehicles. What began as a research agency now anchors a domestic aerospace industry, drawing in private firms and giving Thai engineering a high-value sector to call its own."
 SIA_sovereign_launch_capability: "Sovereign Launch Capability"
 SIA_sovereign_launch_capability_desc: "The Kingdom resolves to close the last gap, the ability to design, build and orbit its own satellites without asking anyone's leave. An indigenous launch and satellite-constellation programme crowns two decades of work, putting Thailand among the handful of states with a sovereign foothold in space and an intelligence reach that answers to no one else."
 SIA_ptt_energy_champion: "PTT, National Energy Champion"
 SIA_ptt_energy_champion_desc: "The state energy concern is floated on the stock exchange and unleashed as a commercial giant. Flush with IPO capital and an exploration mandate from the Gulf of Thailand to Myanmar, PTT secures the Kingdom's fuel supply and becomes its single largest corporation."
 SIA_scg_industrial_titan: "Siam Cement Group"
 SIA_scg_industrial_titan_desc: "The Kingdom's oldest and largest industrial conglomerate expands from cement into petrochemicals, building materials, and packaging. SCG's order books underwrite the construction boom and anchor a domestic supply chain that no infrastructure programme can do without."
 SIA_cp_agribusiness_giant: "Charoen Pokphand Group"
 SIA_cp_agribusiness_giant_desc: "From feed mills to 7-Eleven, the CP conglomerate becomes Thailand's agribusiness and retail colossus. Contract farming lifts rural incomes and stocks the shelves, while CP's export muscle carries Thai food to every market in Asia."
 SIA_western_frontier: "The Western Frontier"
 SIA_western_frontier_desc: "Beyond the Salween lie the patchwork statelets of Burma's borderlands, the Shan and the Karen, too weak to stand alone and too proud to kneel to Naypyidaw. Bangkok has long watched them as a buffer, a market, and an opportunity. It is time the Kingdom had a frontier policy of its own."
 SIA_buffer_states: "A Belt of Buffer States"
 SIA_buffer_states_desc: "Rather than swallow them, Thailand will keep the Shan and Karen alive and armed, a hedge of friendly buffers absorbing Burmese pressure before it reaches the Kingdom. Cross-border supply lines, training camps, and quiet guarantees turn the frontier insurgents into a shield."
 SIA_protectorate_doctrine: "Protectorate Doctrine"
 SIA_protectorate_doctrine_desc: "The General Staff settles on the gentler instrument of empire, not conquest but vassalage. The frontier statelets will be brought under Thai protection as client states, their banners left flying over capitals that answer to Bangkok."
 SIA_annexation_doctrine: "Annexation Doctrine"
 SIA_annexation_doctrine_desc: "No half-measures. The borderlands will be taken outright, their territory incorporated into the Kingdom and their separatist governments dissolved. Bangkok lays its claims on the Shan and Karen heartlands and prepares the army to enforce them."
 SIA_subdue_the_shan: "Subdue the Shan"
 SIA_subdue_the_shan_desc: "The Royal Thai Army moves on South Shan State. Whether it ends as a Thai protectorate or a Thai province depends on the doctrine chosen, but either way, the writ of Bangkok will run to the Salween."
 SIA_subdue_the_karen: "Subdue the Karen"
 SIA_subdue_the_karen_desc: "Thai forces cross into the Karen hills. The decades of refuge and quiet patronage end, and the Kingdom comes now as a master, to puppet or to annex as policy dictates."
 SIA_burma_breakaway_question: "The Breakaway States"
 SIA_burma_breakaway_question_desc: "Across the Salween, Burma's writ has collapsed into a patchwork of armed statelets, the Shan, the Karen, the Wa. They are weak, divided, and squarely within Thailand's reach. Bangkok must decide what these breakaway lands are to the Kingdom. A shield, a prize, or a problem to be managed."
 SIA_subdue_the_wa: "Subdue the Wa"
 SIA_subdue_the_wa_desc: "The United Wa State Army runs the most formidable, and most narcotics-soaked, of the breakaway armies. Bringing the Wa hills (states 497 and 931) to heel means a hard fight, but it shuts down a drug pipeline on the Kingdom's doorstep and plants the Thai flag deep in the Burmese borderlands."
 SIA_rta_looks_abroad: "Sixty Years of M48s"
 SIA_rta_looks_abroad_desc: "The Royal Thai Army still fields tanks and carriers from another century. Re-equipping is no longer a question of whether, but of whose steel rolls through the gates at Korat, and what strings come welded to it."
 SIA_stryker_brigades: "Wheels of the West"
 SIA_stryker_brigades_desc: "Stryker brigades, American doctrine, and a logistics chain that plugs straight into the world's most capable army. The kit is superb and the interoperability priceless, but every round is paid for in dollars and in deference to Washington."
 SIA_eda_blackhawks: "Hand-Me-Downs from a Superpower"
 SIA_eda_blackhawks_desc: "Through Excess Defense Articles and Foreign Military Sales, refurbished Black Hawks and Cobras arrive at a fraction of list price. The airframes have flown before, but airmobile reach on a budget is a bargain the alliance makes possible."
 SIA_vn1_mechanization: "An APC for Every Platoon"
 SIA_vn1_mechanization_desc: "VN1 and VN16 carriers off the Chinese line, by the hundred, for what a handful of Western vehicles would cost. The infantry rides at last, and the factories that build them are paid for before the year is out."
 SIA_norinco_fires: "The Full NORINCO Catalogue"
 SIA_norinco_fires_desc: "SH1 howitzers, SR5 rocket artillery, the whole catalogue at the whole-package price. The firepower is real, but so are the spare-parts queues and the transmissions that fail in the field. Cheap steel keeps a quartermaster awake at night."
 SIA_tavor_standard: "A Rifle of Our Own"
 SIA_tavor_standard_desc: "Licensed Tavor production turns Thai factories into the source of the Army's standard rifle. No embargo, no waiting list, no foreign veto on who we arm, just the first brick of an arsenal that answers to Bangkok alone."
 SIA_oplot_and_rotors: "Bazaar Diplomacy"
 SIA_oplot_and_rotors_desc: "Ukrainian Oplot hulls, Russian Mi-17 rotors, whatever the market offers to a buyer who picks no side. Capability flows from everywhere at once, and irritates Washington and Beijing in equal, manageable measure."
 SIA_dti_black_widow: "Black Widow Spider"
 SIA_dti_black_widow_desc: "The Defence Technology Institute's own 8x8, alongside Chaiseri's battle-proven First Win. Thai-designed, Thai-built, and good enough that others want to buy them. The arsenal has begun to pay for itself."
 SIA_first_army_modernized: "The New Royal Thai Army"
 SIA_first_army_modernized_desc: "Whatever path the re-equipment took, the result stands on the parade ground at last. A modern Royal Thai Army, re-tooled, retrained, and ready for the century it actually has to fight in."
 SIA_gripen_globaleye: "Eyes of the Whole Sky"
 SIA_gripen_globaleye_desc: "Saab's GlobalEye AEW&C turns a handful of Gripens into a networked force that sees first and shoots first. Airborne radar is the multiplier that makes a small air force punch far above its numbers."
 SIA_j10_squadrons: "Dragons over Don Mueang"
 SIA_j10_squadrons_desc: "J-10CE multirole fighters, by the squadron, at a price Washington could never match, and which Washington will never forgive. Choosing Chengdu over Fort Worth re-wires the Kingdom's skies, and its alliances."
 SIA_hq9_air_defense: "A Roof of Missiles"
 SIA_hq9_air_defense_desc: "HQ-9 and FK-3 long-range surface-to-air batteries draw an umbrella over the Central Plain. Cheap, dense, and integrated. Area denial the Chinese way."
 SIA_wing_loong_uav: "Patient Hunters"
 SIA_wing_loong_uav_desc: "Wing Loong and CH-series drones loiter for a day and strike on command. Mass unmanned reconnaissance and precision strike, bought for the cost of a single manned squadron."
 SIA_f5th_super_tigris: "New Tricks for an Old Tiger"
 SIA_f5th_super_tigris_desc: "Israeli avionics, an AESA radar, and Python-5 missiles turn the venerable F-5 into the F-5TH 'Super Tigris'. Not a new jet, but combat power squeezed from airframes already paid for, owing nothing to any superpower."
 SIA_dti_uav_command: "Sovereign Eyes"
 SIA_dti_uav_command_desc: "A Defence Technology Institute drone wing, designed and flown in-country, gives Thailand its own reconnaissance picture, and a product to sell to the neighbours."
 SIA_air_dominance_doctrine: "Masters of the Thai Sky"
 SIA_air_dominance_doctrine_desc: "However it was equipped, the Royal Thai Air Force ends as a modern, networked, multirole force, master of the airspace it is sworn to defend."
 SIA_korean_frigates: "The Bhumibol Standard"
 SIA_korean_frigates_desc: "A modern DW3000 frigate from Korea, with Western combat systems, area air defence, and the most capable surface combatant the fleet has ever sailed. Quality has a price, and Seoul names it in dollars."
 SIA_chinese_engine_compromise: "A Chinese Heart"
 SIA_chinese_engine_compromise_desc: "The German engines will never come, and the boat has waited a decade. Accept the Chinese CHD620 powerplant and the submarine finally sails, cheaply, sovereignly, and with a teething period the engineers will spend a year cursing."
 SIA_type071_flotilla: "Hulls from Hudong"
 SIA_type071_flotilla_desc: "A Type 071E landing platform dock and a clutch of Chinese-built patrol vessels give the fleet an amphibious arm overnight, for what a single Western hull would cost."
 SIA_krabi_class_opv: "Our Own Keels"
 SIA_krabi_class_opv_desc: "The Krabi-class offshore patrol vessel, built under licence at Bangkok Dock, lays the keel of a sovereign shipbuilding industry. Slow to mature, but it answers to no foreign yard."
 SIA_european_propulsion: "German Hearts, Thai Hulls"
 SIA_european_propulsion_desc: "European propulsion and combat systems, the quality of the West without Washington's strings or Beijing's. The expensive, sovereign middle path for a navy that trusts no single patron."
 SIA_naval_self_reliance: "Frigates from Bangkok Dock"
 SIA_naval_self_reliance_desc: "Thai yards now lay down warships of their own design, with a naval defence-industrial base that compounds and exports. The fleet, at last, is built at home."
 SIA_command_of_the_seas: "Two Gulfs, One Fleet"
 SIA_command_of_the_seas_desc: "However it was built, the Royal Thai Navy stands as a true blue-water force, able to hold the Gulf and reach into the Andaman, in command of the seas that wash two coasts of the Kingdom."
 SIA_the_western_anchor: "Washington's Anchor in Asia"
 SIA_the_western_anchor_desc: "Army, air, and sea all bought Western, and the alliance becomes the cornerstone of national defence. Interoperability, intelligence-sharing, and the implicit American guarantee, in exchange for a place firmly inside Washington's orbit."
 SIA_the_bamboo_bloc: "Into the Dragon's Shadow"
 SIA_the_bamboo_bloc_desc: "Three services kitted out by Beijing make Thailand China's foremost arms client in the region. Cheap mass, a shared C4ISR picture, and a powerful patron, all at the price of the West's trust."
 SIA_strategic_autonomy: "Beholden to No One"
 SIA_strategic_autonomy_desc: "A force built, increasingly, at home, and sold abroad. The Defence Technology Institute becomes a regional arms house, and the Kingdom answers to no foreign capital for the means of its own defence."
 SIA_the_bamboo_doctrine: "Bend with the Wind"
 SIA_the_bamboo_doctrine_desc: "Swedish jets, Chinese tanks, a sub from Beijing and a frigate from Seoul. Thailand buys from everyone and belongs to no one. The reed that bends in the storm survives it. The oldest Thai strategy, made flesh in the order of battle."
 SIA_dual_use_threshold: "The Dual-Use Threshold"
 SIA_dual_use_threshold_desc: "Every civil power programme carries the same machinery a weapons programme needs. Quietly master the fuel cycle, with uranium enrichment under the cover of energy independence, and the Kingdom keeps every option open without yet declaring one."
 SIA_minimum_deterrent: "A Minimum Deterrent"
 SIA_minimum_deterrent_desc: "A handful of warheads, no more, enough that no neighbour and no great power can ever again take the Kingdom for granted. Thailand joins the nuclear club on its own terms, and the cabinet must now decide aloud what it will say its bombs are for."
 SIA_the_democrats_endure: "The Democrats Endure"
 SIA_the_democrats_endure_desc: "The Democrat Party, the oldest in the Kingdom, keeps its grip on government rather than yielding to the populist tide. No landslide, no charismatic billionaire, just the patient, unglamorous business of governing as a broad civilian coalition. The party stakes its future on institutions, not on a single leader."
 SIA_chuan_clean_government: "Clean Government"
 SIA_chuan_clean_government_desc: "Mr. Clean takes the helm. A reputation for personal incorruptibility becomes the party's brand, with open budgets, professional ministries, and a war on the brown envelope. It will not be flashy, but it builds the machine that turns honest governance into a durable constituency."
 SIA_rule_of_law: "The Rule of Law"
 SIA_rule_of_law_desc: "A government that lives by the constitution it swore to uphold. Due process, predictable administration, and courts that answer to the law rather than the barracks. Every coup begins by suspending the rule book, so the Kingdom learns to keep it."
 SIA_judicial_independence: "An Independent Bench"
 SIA_judicial_independence_desc: "Insulate the judiciary from both the palace network and the generals. A bench that cannot be leaned on is the surest brake on the cycle of dissolution and coup, and the establishment's favourite weapon, judicial activism, is blunted at the source."
 SIA_strengthen_parliament: "Strengthen Parliament"
 SIA_strengthen_parliament_desc: "Give the elected chamber the staff, the committees and the standing to actually govern. A working legislature lets the party rule by votes rather than by emergency decree, and gives the public a stake in the outcome of every session."
 SIA_liberal_market_stewardship: "Liberal Market Stewardship"
 SIA_liberal_market_stewardship_desc: "Sound money, open trade, and a state that regulates rather than spends. The Democrats offer the technocratic counterweight to Thaksinomics, with growth driven by finance, exports and private enterprise rather than by rural cash handouts."
 SIA_southern_stronghold: "The Southern Stronghold"
 SIA_southern_stronghold_desc: "The party's heartland is the South, and the South has grievances. Answer them with roads, schools and clinics rather than checkpoints. Peace through development that keeps the base loyal and drains the insurgency of recruits."
 SIA_coalition_government: "Government by Coalition"
 SIA_coalition_government_desc: "Power assembled the hard way, a patchwork of partners, regional blocs and minor parties stitched into a working majority. It is slow, it is compromised, and it is the one form of government the tanks find hardest to justify rolling against. The elected order survives by sharing it."
 SIA_mature_democracy: "A Mature Democracy"
 SIA_mature_democracy_desc: "The Kingdom crosses the threshold into peaceful turnover, a loyal opposition, and a public that treats coups as history. The Democrats need no longer be the establishment's anxious gatekeeper. They can simply be a party that wins and loses elections like any other."
 SIA_grand_coalition: "The Grand Coalition"
 SIA_grand_coalition_desc: "Rather than fight the old order, absorb it. The Democrats become the elected face of the conservative establishment, with palace, business and bureaucracy governing through the ballot box instead of the barracks. Stability bought by consensus, with the party at its centre."
 SIA_democrat_revival: "The Democrats Return"
 SIA_democrat_revival_desc: "From the wilderness of opposition, the party claws its way back into the premiership through the post-2019 coalition bazaar. The Democrats are governing again, older, chastened, and determined this time to make the civilian order stick."
 SIA_answer_thaksinomics: "Answer Thaksinomics"
 SIA_answer_thaksinomics_desc: "Thaksin's genius was to see the village before Bangkok did. Do not sneer at the village fund. Build a better one. A Democrat programme of rural credit, a farmers' debt moratorium and cheap healthcare, launched before Thai Rak Thai can, blunts the populist pitch at its source rather than conceding the countryside and winning back power only through the courts.\n\n§GThe populist tide recedes.§!"
 SIA_pracha_wiwat: "The People's Agenda"
 SIA_pracha_wiwat_desc: "Pracha Wiwat is nine measures unveiled as New Year gifts. Free electricity for the poorest households, a cooking-gas subsidy, welfare and registration for the motorcycle-taxi drivers and street vendors of the informal economy, and a savings option for workers outside the system. Proof that a liberal-conservative party can answer want without bankrupting the treasury.\n\n§GThe populist tide recedes.§!"
 SIA_contest_every_election: "Contest Every Election"
 SIA_contest_every_election_desc: "Whatever the provocation, whether a rigged snap poll, an amnesty for a fugitive, or a stacked court, the party stays in the democratic game. It contests every election and accepts every result. It is the discipline the real party abandoned in 2006 and 2014, and it denies the populists the only charge that ever truly stuck, that the Democrats win only when soldiers and judges win for them.\n\n§GThe populist tide recedes,§! and the door to the streets is closed for good."
 SIA_the_street_over_the_ballot: "The Street Over the Ballot"
 SIA_the_street_over_the_ballot_desc: "Enough of losing at the ballot box. Resign the party's seats, take the movement into the streets, shut down the capital, and make the country ungovernable until the elected government falls. It works, and it is ruin. The generals take the pretext they were handed, the tanks roll, and a party that once stood for clean civilian rule is remembered as the midwife of a coup.\n\n§RThe Kingdom passes to military rule. The Democrat path ends here, and the new order has its own trunk.§!"
 SIA_break_into_isan: "Break Into the Northeast"
 SIA_break_into_isan_desc: "The structural fix the real party never made. For a generation the Democrats owned the South and Bangkok and ceded the vast, poor Northeast to Thaksin by default. Spend a decade there instead. Build the branches, run the candidates, make a credible redistributive offer to Isan on its own terms. Win even a foothold in the populist heartland and the tide loses its wellspring. It is the hardest road to lasting power, and the only one that does not depend on the courts.\n\n§GFrom now on the populist tide climbs far more slowly.§!"
 SIA_board_of_investment: "Empower the Board of Investment"
 SIA_board_of_investment_desc: "The Board of Investment has always been Thailand's quiet engine, courting foreign capital and steering Thai firms abroad. Give it real teeth and a real budget. Investment gets cheaper and faster, and every baht Bangkok places overseas comes back stronger."
 SIA_regional_trade_network: "Regional Trade Network"
 SIA_regional_trade_network_desc: "Turn a scattering of bilateral deals into a genuine web of free trade agreements across ASEAN and beyond. Every agreement Thailand signs now pays a tariff dividend into the treasury and widens the reach of Thai soft power abroad."
 SIA_mekong_soft_power: "Mekong Soft Power"
 SIA_mekong_soft_power_desc: "Bangkok sits at the head of the Mekong, and the river runs on through Laos, Cambodia and Myanmar. Trade, aid and investment become the instruments of a quiet leadership over the neighbourhood. Thailand can press its advantage abroad now, not merely guard its own."
 SIA_regional_trade_network_tt: "Each signed trade agreement now pays a monthly treasury dividend and adds to Thailand's foreign influence reach, both capped."
 SIA_trade_dividend_tt: "Thailand banks its monthly dividend from its network of trade agreements."
 SIA_trade_diplomacy_network: "Trade Diplomacy"
 SIA_trade_diplomacy_network_tt: "Foreign influence reach grows with the number of signed trade agreements, up to a cap."
 SIA_clean_the_banks: "Clean the Banks"
 SIA_clean_the_banks_desc: "The fifty six shuttered finance companies are wound down through the Financial Sector Restructuring Authority, and the Thai Asset Management Corporation takes the bad loans off the books. With clean balance sheets the banks lend again and the cranes return to the skyline."
 SIA_dual_track_recovery: "Reignite Domestic Demand"
 SIA_dual_track_recovery_desc: "With the debt cleared, turn the recovery inward. Cheap credit, rural spending programs, and support for small enterprise put money into the hands that spend it fastest. Growth comes back quickly and runs hot, and the bills and the favors owed pile up just as fast."
 SIA_sufficiency_path: "A Resilient Rebuild"
 SIA_sufficiency_path_desc: "Choose steadiness over speed. Diversified farming, moderate borrowing, and self-reliant local economies rebuild a quieter base that can ride out the next shock. The boom never roars, but the cleanup reaches into governance as well."
 SIA_frontier_integration: "Integrate the Frontier"
 SIA_frontier_integration_desc: "The campaigns are won and Thai soldiers hold the Shan plateau, the Karen hills, and the Wa highlands. Winning ground and governing it are different tasks. We stand up an administration for the recovered marches, seed the first roads and garrisons, and begin the slow work of turning conquered people into citizens. The Recovered Lands can now be pacified, developed, and in time claimed for the Kingdom outright."
 SIA_the_new_order: "The New Order in the South"
 SIA_the_new_order_desc: "The claims are staked from Manila to the Malacca Strait, and where our armies have marched the old flags are down. A hegemony declared is not a hegemony that holds. We build the machinery of empire, governors and garrisons and reconstruction offices, so that seized provinces are administered rather than merely occupied. The Recovered Lands can now be pacified, developed, and folded permanently into a Greater Thailand."
 SIA_industrial_estates: "The Industrial Estates"
 SIA_industrial_estates_desc: "Amata, Hemaraj, and Rojana build private industrial estates across the eastern seaboard and court the Japanese and Western factories directly. Thailand becomes the workshop that hosts the export boom, with ready made land and power waiting for any manufacturer who arrives."
 SIA_hard_disk_of_the_world: "The Hard Disk of the World"
 SIA_hard_disk_of_the_world_desc: "Seagate, Western Digital, and local suppliers like Delta and Hana turn Thailand into the world's largest hard disk assembler and a top electronics exporter. It is the silent giant behind the tourist postcards, quietly shipping a quarter of the planet's drives."
 SIA_thai_union_seafood: "Kings of the Can"
 SIA_thai_union_seafood_desc: "Thai Union buys Chicken of the Sea and becomes the world's largest tuna canner, while the Samut Sakhon processors turn Thai waters and cheap labor into a global seafood empire. Frozen shrimp and canned fish flow out to supermarket shelves across the world."
 SIA_retail_kings: "The Retail Kings"
 SIA_retail_kings_desc: "The Chirathivat family's Central Group, Big C, and the hypermarkets rebuild the domestic economy around malls and modern retail. CentralWorld opens in 2006 and a rising consumer middle class starts to spend rather than only export."
 SIA_beverage_empire: "The Bangkok Brewer"
 SIA_beverage_empire_desc: "Charoen Sirivadhanabhakdi's ThaiBev, maker of Chang beer and SangSom, grows into a regional drinks and property titan. Blocked from listing in Bangkok by Buddhist anti alcohol protests, it raises its capital in Singapore instead and pours the proceeds back home."
 SIA_fta_decade: "The FTA Decade"
 SIA_fta_decade_desc: "A wave of bilateral trade deals plugs the export machine into the region. The Australia agreement in 2005, the Japan partnership in 2007, and the China early harvest on farm goods all clear tariffs away. It is genuinely cross government work, signed by rivals who agree on little else."
 SIA_sugar_and_ethanol: "The Sugar Barons"
 SIA_sugar_and_ethanol_desc: "Mitr Phol and the Thai Roong Ruang Group grow the cane belt into Asia's sugar heartland and turn sugar and cassava into exports and into ethanol for the gasohol program. Agriculture finally diversifies beyond rice, and the biofuel feeds straight into the national energy story."
 SIA_gems_and_gold: "Gems and Gold"
 SIA_gems_and_gold_desc: "Chanthaburi's cutters and the Bangkok jewelry trade make Thailand the world capital of colored gemstone cutting and gem export. It is a quirky, high margin, low footprint industry that earns hard currency out of skill rather than scale."
 SIA_map_ta_phut: "Map Ta Phut"
 SIA_map_ta_phut_desc: "PTT and SCG build their downstream petrochemical empire in Rayong, and the smokestacks of Map Ta Phut become the heavy heart of the eastern seaboard. Industry booms even as the communities beside the plants pay the price in polluted air and water."
 SIA_ignite_thailand: "IGNITE Thailand"
 SIA_ignite_thailand_desc: "The government adopts the twenty year National Strategy and the IGNITE hub vision, naming the middle income trap as the enemy at last. Thailand grew rich enough to stall. Wages climbed past the cheap factory floor but never reached the innovation frontier, and Vietnam is closing fast."
 SIA_digital_kingdom: "The Digital Kingdom"
 SIA_digital_kingdom_desc: "Thailand pitches itself as the digital hub of ASEAN, and the hyperscalers start to notice. Fibre, cloud policy, and a young online population turn the country into a serious candidate for the region's data traffic."
 SIA_data_center_hub: "The Cloud Rush"
 SIA_data_center_hub_desc: "Amazon, Google, Microsoft, and TikTok pour billions into data centers in Chonburi and Rayong. The servers arrive faster than the power and water to run them, and the grid begins to strain under the load."
 SIA_virtual_banks: "PromptPay and the Virtual Banks"
 SIA_virtual_banks_desc: "PromptPay makes Thailand almost cashless, with ninety million registrations moving tens of millions of transfers a day. The central bank licenses digital only banks, and money that once vanished into cash now leaves a trail the taxman can read."
 SIA_bcg_economy: "Bio-Circular-Green"
 SIA_bcg_economy_desc: "The bio circular green model turns Thailand's biodiversity and farm base into high value bio industry. Biofuels, biochemicals, and functional food begin to replace the low margin commodity crops that kept the countryside poor."
 SIA_future_food: "Kitchen of the World 2.0"
 SIA_future_food_desc: "CP Foods and the food giants move up the value chain into functional food and alternative protein. Thailand stops selling raw calories and starts selling the science that goes into them."
 SIA_durian_road: "The Durian Road"
 SIA_durian_road_desc: "Durian and tropical fruit exports to China race past six billion dollars a year. Cold chain trucks run the harvest north through Laos while Vietnam and Malaysia fight for the same shelves in Guangzhou."
 SIA_capital_of_capital: "Capital of Capital"
 SIA_capital_of_capital_desc: "The Stock Exchange of Thailand deepens, the Vayupak fund grows, and conglomerates like Gulf pivot from energy into digital and finance. Bangkok begins to act like a regional financial center rather than a place capital merely passes through."
 SIA_make_thailand_investor: "A Capital Exporter"
 SIA_make_thailand_investor_desc: "Thailand graduates from taking foreign money to sending its own abroad. Central buys in Europe, CP farms across the world, and ThaiBev owns Singapore's own drinks giant. The recipient nation has become an investor nation."
 SIA_escape_the_trap: "A High-Income Kingdom"
 SIA_escape_the_trap_desc: "The National Strategy pays off and Thailand crosses the line into high income status. The trap that held it below the frontier for a generation is finally behind it, and the workshop has become a wealthy kingdom in its own right."
 SIA_fta_decade_tt: "Arms the trade diplomacy network and signs the decade's free trade agreements."
 SIA_trap_step_down_tt: "The Middle Income Trap eases as another pillar of the National Strategy is delivered."
 SIA_escape_trap_two_sectors_tt: "Requires two of the three sector capstones. Data centers, future food, or the investor nation."
 SIA_data_center_grid_strain_tt: "The hyperscaler build out strains the grid. Invest in the power branch to keep the lights on."
 thailand.1.t: "The 2001 General Election"
 thailand.1.d: "On 6 January 2001, Thais vote in the first general election under the People's Constitution. Three forces contest the ballot. Thai Rak Thai's platform of village funds, debt moratoriums and universal healthcare has electrified the countryside. The palace network and its allies in the barracks would rather the old institutions decided who governs. The incumbent Democrats promise steady, unglamorous hands. Where we throw our weight now will shape who the country chooses."
 thailand.1.a: "Back Thai Rak Thai and the rural landslide."
 thailand.1.b: "Rally the palace network and the generals."
 thailand.1.c: "Sustain the Democrats in power."
 thailand.2.t: "A Government of CEOs"
 thailand.2.d: "The new government takes office promising to run Thailand like a successful company. Businessmen fill the cabinet, ministries receive performance targets, and policy moves at a speed the bureaucracy has never seen."
 thailand.2.a: "Thailand is open for business."
 thailand.3.t: "The War on Drugs"
 thailand.3.d: "In February 2003 the government declared a three-month campaign to eradicate the methamphetamine trade. Provincial blacklists are drawn up and quotas set. By its end, rights organizations document some 2,800 killings, many never investigated. The campaign is overwhelmingly popular at home and condemned abroad."
 thailand.3.a: "Press the campaign without restraint."
 thailand.3.b: "Wind it down quietly."
 thailand.4.t: "The September Coup"
 thailand.4.d: "On 19 September 2006, with the Prime Minister in New York for the UN General Assembly, the army moves. Tanks take up positions in Bangkok, the constitution is abrogated, and the Council for Democratic Reform announces it has assumed control. Crowds bring flowers to the soldiers while the rural majority watches in silence."
 thailand.4.a: "Let the army assume its responsibility."
 thailand.4.b: "Install a civilian front government."
 thailand.5.t: "Judicial Dissolution"
 thailand.5.d: "The Constitutional Court weighs an electoral-fraud case against the largest opposition party. A dissolution would ban its executive board from politics for five years, decapitating the movement without a single soldier leaving barracks."
 thailand.5.a: "Dissolve the party."
 thailand.5.b: "Let the threat hang over them."
 thailand.6.t: "The NCPO Takes Power"
 thailand.6.d: "On 22 May 2014, after months of street paralysis and two days of declared martial law, the army chief summons the rival factions to the Army Club, arrests them in the conference room, and announces the National Council for Peace and Order. There will be no fixed timetable for elections."
 thailand.6.a: "Order is restored."
 thailand.7.t: "Red Shirts Take the Square"
 thailand.7.d: "The United Front for Democracy Against Dictatorship floods Bangkok's commercial heart, demanding the government's resignation and new elections. Barricades rise at Ratchaprasong. The world's cameras are watching what the army does next."
 thailand.7.a: "Clear the square."
 thailand.7.b: "Negotiate and wait them out."
 thailand.8.t: "The Airport Seizure"
 thailand.8.d: "In November 2008 yellow-shirted protesters occupy Suvarnabhumi and Don Mueang airports, stranding 300,000 travellers and freezing the country's air commerce. The siege ends only when a court ruling brings down the government they oppose."
 thailand.8.a: "Count the cost."
 thailand.9.t: "The Three Demands"
 thailand.9.d: "Student-led crowds, larger than any since 1992, articulate three demands. Dissolve parliament, stop intimidating critics, and write a new constitution. From a stage in Bangkok, taboos that have governed Thai public speech for generations are broken in a single evening."
 thailand.9.a: "Back all three demands."
 thailand.9.b: "Push only what parliament will pass."
 thailand.10.t: "Section 112 on the Floor"
 thailand.10.d: "A bill to amend the lese-majeste law reaches parliament. It limits who may file complaints, caps penalties, and ends its use against political speech. No Thai legislature has ever dared a recorded vote on this question. Every institution of the old order is now in motion."
 thailand.10.a: "Call the vote."
 thailand.11.t: "Dissolution Crisis"
 thailand.11.d: "The Constitutional Court rules the amendment campaign an attempt to overthrow the democratic regime with the King as Head of State. The party is dissolved, its executives banned. The movement must begin again under a new name, with the same people, as it always has."
 thailand.11.a: "We will register a new party by Friday."
 thailand.12.t: "The Establishment Strikes Back"
 thailand.12.d: "Army units are moving in the capital without orders from the government. The old order has decided the experiment has gone far enough. What happens in the next six hours decides whether the reform era continues, or joins the long list of interrupted Thai democracies."
 thailand.12.a: "Call the people into the streets."
 thailand.12.b: "Back down to save the movement."
 thailand.13.t: "The Republic Question"
 thailand.13.d: "The government schedules a referendum on the constitutional form of the state itself, the question no Thai government has ever put to the people. Whatever the result, nothing about the Kingdom will be the same."
 thailand.13.a: "Put it to the people."
 thailand.13.b: "Withdraw the referendum."
 thailand.14.t: "A New Reign"
 thailand.14.d: "On 13 October 2016 the Royal Household Bureau announces the death of His Majesty King Bhumibol Adulyadej, Rama IX, after seventy years on the throne, the longest reign in Thai history. The nation enters a year of mourning. The Crown Prince ascends as King Maha Vajiralongkorn, Rama X."
 thailand.14.a: "A kingdom mourns."
 thailand.15.t: "The Dynasty Continues"
 thailand.15.d: "The movement's founder can no longer lead it in person, but the name retains its hold on the electorate. The question before the party is who carries it into the next election."
 thailand.15.a: "Yingluck Shinawatra leads the ticket."
 thailand.15.b: "Srettha Thavisin leads the ticket, a property tycoon for the business wing."
 thailand.15.c: "Paetongtarn Shinawatra leads the ticket, and the name endures into a new generation."
 thailand.15.e: "Put the machine above the name."
 thailand.16.t: "Thaksin Forever"
 thailand.16.d: "The annual party congress votes to abolish internal term limits and grant the leadership emergency authority over candidate selection, the party list, and coalition policy. The opposition benches are empty of anyone who matters. Elections will continue to be held, and continue to be won."
 thailand.16.a: "One leader, one party, one Thailand."
 thailand.17.t: "Restoration of the Throne"
 thailand.17.d: "Parliament, the Privy Council and the armed forces jointly petition the palace to assume direct stewardship of the state's institutions. The constitutional fiction of the past century is retired. The Chakri dynasty resumes the role it held before 1932."
 thailand.17.a: "Long live the King."
 thailand.18.t: "The 2017 System"
 thailand.18.d: "The new constitution passes its referendum under campaign restrictions that made opposition a criminal offense. A fully appointed Senate will help choose future prime ministers, and a twenty-year National Strategy binds every future government. Elections will resume, but inside the fence."
 thailand.18.a: "Guided democracy it is."
 thailand.50.t: "Out of the Tom Yum Kung Crisis"
 thailand.50.d: "Three years after the baht broke, the economy is growing again. The factories of the Eastern Seaboard are rehiring, and the IMF program that began in humiliation is ahead of schedule."
 thailand.50.a: "The worst is behind us."
 thailand.51.t: "The IMF Departs"
 thailand.51.d: "In July 2003 Thailand repays the final installment of its IMF obligations two years ahead of schedule. The Prime Minister marks the occasion with a televised address declaring the country's economic independence restored."
 thailand.51.a: "Never again."
 thailand.52.t: "The Boxing Day Tsunami"
 thailand.52.d: "On 26 December 2004 an undersea earthquake off Sumatra sends a tsunami into Thailand's Andaman coast. Khao Lak and Phuket are devastated, and more than 5,000 people in Thailand are killed, many of them foreign tourists. The world is watching the response."
 thailand.52.a: "Spare nothing in the relief effort."
 thailand.52.b: "A minimal response."
 thailand.53.t: "The Great Flood"
 thailand.53.d: "Monsoon waters moving down the Chao Phraya basin inundate two-thirds of the country's provinces and lap at the industrial estates north of Bangkok. Global hard-drive production halts in flooded Thai factories. The capital builds sandbag walls and waits."
 thailand.53.a: "Mobilize everything."
 thailand.53.b: "Protect Bangkok and let the provinces drain."
 thailand.54.t: "The Rice-Pledging Scheme"
 thailand.54.d: "The government proposes to buy the entire rice harvest at half again the market price, transferring billions to farming households and gambling that world prices will follow. Economists warn the warehouses will fill and the losses will be historic. The farmers who elected us are waiting."
 thailand.54.a: "Pledge every grain."
 thailand.54.b: "Quietly shelve the scheme."
 thailand.55.t: "Detroit of Asia"
 thailand.55.d: "Vehicle production crosses the million-unit mark. Thailand is now the largest auto manufacturer in Southeast Asia and the world's leading producer of one-ton pickups."
 thailand.55.a: "Court Toyota and Honda and open the doors."
 thailand.56.t: "Visit Thailand Year"
 thailand.56.d: "Tourist arrivals shatter every record. From Khao San Road to Karon Beach, the Kingdom hosts the world, and the receipts fund everything else we do."
 thailand.56.a: "Sawasdee."
 thailand.56.b: "Invest in the industry itself."
 thailand.57.t: "The Submarine Question"
 thailand.57.d: "The navy's contract for Chinese-built S26T submarines has become a national argument. Are these the first boats of a two-ocean fleet, or billions spent on engines the supplier cannot deliver? The procurement decision lands on the government's desk."
 thailand.57.a: "Buy the boats."
 thailand.57.b: "Cancel the program."
 thailand.100.t: "The Lost Territories"
 thailand.100.d: "State media revive the old maps. The provinces signed away to France in 1893, 1904 and 1907, the sultanates ceded to Britain in 1909. The national-humiliation narrative of the Phibun era returns to the schoolbooks, and a movement no government has invoked since 1945 stirs again."
 thailand.100.a: "What was taken can be returned."
 thailand.101.t: "Brothers Across the Salween"
 thailand.101.d: "Bangkok formally declares its interest in the fate of the Tai Yai of Shan State, kin to the Thai in language and blood, at war with the Burmese junta for generations. The declaration stops just short of a territorial demand. Nobody in the region mistakes its meaning."
 thailand.101.a: "The Tai are one people."
 thailand.102.t: "The Mekong Is a Thai River"
 thailand.102.d: "The government formally repudiates the Franco-Siamese treaties of 1893 and 1904 as instruments signed under duress. The immediate claim covers Champasak, but voices in the ruling party ask why the claim should stop at provinces France happened to map."
 thailand.102.a: "Claim the 1904 territories."
 thailand.102.b: "Claim all Laos as Tai land."
 thailand.103.t: "Preah Vihear Standoff"
 thailand.103.d: "Artillery exchanges around the cliff-top temple, the worst since 2011, give Bangkok its pretext. The government announces it no longer recognizes the 1962 ICJ ruling and asserts claims to Battambang and Siem Reap, Siamese provinces within living memory."
 thailand.103.a: "Assert the claims."
 thailand.103.b: "Claims, and an ultimatum."
 thailand.104.t: "Denouncing 1909"
 thailand.104.d: "The Foreign Ministry formally denounces the Anglo-Siamese Treaty of 1909, by which Bangkok's Malay tributaries were transferred to the British Empire. Kelantan and Terengganu are named directly. Kuala Lumpur recalls its ambassador within the hour."
 thailand.104.a: "Claim Kelantan and Terengganu."
 thailand.104.b: "Demand every ceded sultanate."
 thailand.105.t: "Suwannaphum"
 thailand.105.d: "The Golden Land of the chronicles, the Tai world gathered under one flag. The government proclaims the unification programme complete in principle. What remains is to make the recovered territories Thai in administration as well as in name."
 thailand.105.a: "Raise one flag from the Salween to the sea."
 thailand.105.b: "Pause. Let the military consolidate first."
 thailand.106.t: "Integration of the Shan Lands"
 thailand.106.d: "Thai administration, Thai schooling and Thai infrastructure reach the Shan plateau. The integration commission reports the new provinces ready for full incorporation into the Kingdom."
 thailand.106.a: "Welcome home."
 thailand.107.t: "Integration of the Lao Lands"
 thailand.107.d: "The Mekong provinces complete their administrative integration. The river is no longer a border."
 thailand.107.a: "Welcome home."
 thailand.108.t: "Integration of the Khmer Provinces"
 thailand.108.d: "Battambang and Siem Reap, Phra Tabong and Siemmarat in the old gazetteers, return to Thai administration for the first time since 1946."
 thailand.108.a: "Welcome home."
 thailand.109.t: "Integration of the Southern Provinces"
 thailand.109.d: "The former sultanates complete their incorporation. A century of British and Malaysian administration ends. What begins is the harder task of making it work."
 thailand.109.a: "Welcome home."
 thailand.110.t: "The World Reacts"
 thailand.110.d: "Emergency sessions in every neighboring capital. ASEAN's foundational principle, the inviolability of colonial-era borders, has been repudiated by a founding member. Embassies are recalled, exercises suspended, and old friends begin to describe Thailand with new vocabulary."
 thailand.110.a: "They will adjust."
 thailand.150.t: "Fire in the South"
 thailand.150.d: "On 4 January 2004 militants raid an army depot in Narathiwat, killing soldiers and seizing hundreds of weapons. Coordinated arson follows across the Malay-Muslim provinces of the Deep South. A separatist insurgency dormant for two decades has returned."
 thailand.150.a: "The South will test us."
 thailand.151.t: "Incident in the Deep South"
 thailand.151.d: "Another week, another roadside bomb, another checkpoint shooting in Yala, Pattani or Narathiwat. The conflict grinds on at a tempo Bangkok has learned to absorb, and the South has not."
 thailand.151.a: "Endure."
 thailand.152.t: "Heavy-Handed"
 thailand.152.d: "A security operation in the Deep South ends with detainees dead and the army defending its methods. Investigations are promised, but prosecutions do not follow. Across the border and across the Muslim world, the images do their work against us."
 thailand.152.a: "Order has its price."
 thailand.153.t: "Talks in Kuala Lumpur"
 thailand.153.d: "Thai officials sit across from BRN representatives at a table arranged by Malaysian facilitators. The agenda is modest, covering safety zones, prisoner welfare, and recognition of dialogue itself. After years of denying any war existed, talking is the concession."
 thailand.153.a: "Keep them talking."
 thailand.154.t: "The Peace Accord"
 thailand.154.d: "An autonomy framework for the Patani provinces is signed. It brings elected regional governance, Malay-language schooling alongside Thai, justice mechanisms for the conflict's abuses, and a phased end to the security presence. The longest war inside Thailand's borders ends with signatures."
 thailand.154.a: "Peace in the South."
 thailand_news.1.t: "Coup in Bangkok"
 thailand_news.1.d: "The Royal Thai Army has seized power in Bangkok, suspending the constitution and dismissing the elected government. Military councils have ruled Thailand repeatedly since 1932, and markets and chancelleries alike are calculating how long this one intends to stay."
 thailand_news.1.a: "Again?"
 thailand_news.2.t: "Thailand Claims Its 'Lost Territories'"
 thailand_news.2.d: "Bangkok has formally laid claim to territories ceded to France and Britain a century ago, reviving an irredentist programme not heard from since the Second World War. Southeast Asian capitals are responding with alarm."
 thailand_news.2.a: "Concerning."
 thailand_news.3.t: "A Republic in Siam?"
 thailand_news.3.d: "Thailand will hold a referendum on the future of its monarchy, a question without precedent in the Kingdom's modern history. The region holds its breath."
 thailand_news.3.a: "Unprecedented."
 thailand_news.4.t: "Thailand Mourns King Bhumibol"
 thailand_news.4.d: "King Bhumibol Adulyadej, the world's longest-reigning monarch, has died in Bangkok at the age of 88. Thailand begins a year of mourning for the only king most Thais have ever known. His son succeeds him as King Maha Vajiralongkorn, Rama X."
 thailand_news.4.a: "An era ends."
 thailand.58.t: "The Swamp of Cobras"
 thailand.58.d: "Nong Ngu Hao, the 'Cobra Swamp', has swallowed money since the 1970s. Now the new airport is actually rising from it, and so are the costs. Drainage problems, cracked taxiways, contractors billing twice for the same concrete. The board wants more money or more time."
 thailand.58.a: "Pour in funds and open on schedule."
 thailand.58.b: "Let the schedule slip."
 thailand.59.t: "Gateway to Asia"
 thailand.59.d: "Suvarnabhumi opens its gates. It is a glass-and-steel terminal among the largest in the world, built to put Bangkok at the centre of every Asian route map. The first arrivals board reads like a tourism ministry fantasy."
 thailand.59.a: "The Kingdom has a new front door."
 thailand.60.t: "Groundbreaking in the East"
 thailand.60.d: "The Eastern Economic Corridor exists on paper, and now someone must pay for the concrete. Beijing's delegations arrive with financing offers folded into Belt-and-Road language. The finance ministry can also raise the money at home, slower, and with no strings."
 thailand.60.a: "Court Chinese capital."
 thailand.60.b: "Issue domestic bonds."
 thailand.61.t: "The Rail Link Overruns"
 thailand.61.d: "Tunnelling under three airports was always going to be expensive, but nobody briefed the cabinet on how expensive. The three-airport line needs another tranche or a thinner blueprint."
 thailand.61.a: "Pay. The spine gets built whole."
 thailand.61.b: "Trim the scope."
 thailand.62.t: "The Belt and Road Comes Calling"
 thailand.62.d: "A high-speed line from Kunming through Vientiane to Bangkok. The missing middle of China's Indochina corridor runs through Thai territory, and Beijing would very much like to finance it. The terms are generous. The terms are also terms."
 thailand.62.a: "Sign the railway memorandum."
 thailand.62.b: "Renegotiate, slowly, in the Thai way."
 thailand.63.t: "The Concession Question"
 thailand.63.d: "Opposition senators tabulate how the state's telecom concessions have fared since their largest holder formed a government. Taxes adjusted, licences extended, competitors audited. The word 'coincidence' is doing heavy work in the official replies."
 thailand.63.a: "Divest the holdings. Take the treasury hit, buy the clean reputation."
 thailand.63.b: "Brazen it out. Numbers win elections, lawyers buy time."
 thailand.64.t: "The Household Debt Reckoning"
 thailand.64.d: "The village funds built shops, motorbikes and rice mills, all on credit. Average rural household debt has nearly doubled, and the cooperatives' books are starting to wobble. The banks want guidance before the rollover season."
 thailand.64.a: "Bail out the cooperatives. A moratorium costs us, but saves the villages."
 thailand.64.b: "Let credit tighten. The market corrects, but the villages absorb it."
 thailand.65.t: "Offsets and Erieyes"
 thailand.65.d: "Saab's final offer lands on the table. Gripens with full source-code access, an Erieye airborne radar, university partnerships and component work for Thai industry, all for a price. Or the same fighters, bare, for considerably less."
 thailand.65.a: "Take the full package."
 thailand.65.b: "Airframes only. Mind the budget."
 thailand.66.t: "The Engine Problem"
 thailand.66.d: "Germany will not licence the diesel engines for a Chinese-built export submarine, which leaves the half-paid S26T hull in Wuhan awaiting a heart. Beijing offers its own engines and a discount. The navy offers the cabinet a choice of embarrassments."
 thailand.66.a: "Accept the Chinese engines and take delivery."
 thailand.66.b: "Demand a frigate hull in compensation."
 thailand.66.c: "Cancel the contract entirely."
 thailand.67.t: "A Flagship Reborn"
 thailand.67.d: "Drone aircraft on the ski-jump, unmanned boats in the well of the hangar deck, control consoles where the Harrier spares used to rust. HTMS Chakri Naruebet returns to Sattahip with a mission profile no other navy in the region can copy."
 thailand.67.a: "Parade her past the cameras."
 thailand.67.b: "A quiet recommissioning, back to work."
 thailand.68.t: "Ninety Days of Fear"
 thailand.68.d: "The blacklists have become body counts. Over two thousand dead in three months, many with no drug connection the investigators can find. The countryside applauds, the hospitals fill, and the foreign ministry's inbox fills faster."
 thailand.68.a: "Press on. The campaign is working."
 thailand.68.b: "Wind it down and order reviews."
 thailand.69.t: "Rumblings at the Officers' Club"
 thailand.69.d: "The signs every Bangkok government learns to read are all here. Unusual rotations into the First Army Region, retired generals suddenly fond of television interviews, and a class reunion at the cavalry barracks that half the high command attended."
 thailand.69.a: "Purge the top brass."
 thailand.69.b: "Accommodate the generals."
 thailand.69.c: "Defy them publicly."
 thailand.70.t: "Tanks at Government House"
 thailand.70.d: "It begins the way it always begins. Regular programming replaced by patriotic music, armoured vehicles at the intersections, a communiqué from a 'council' nobody had heard of yesterday. The government has minutes to decide what it is willing to spend."
 thailand.70.a: "Rally the loyalists and resist."
 thailand.70.b: "Concede, and board the plane."
 thailand.70.c: "Negotiate a government of national unity."
 thailand.70.c_tooltip: "§YThe generals enter the cabinet, not the palace.§!\nElections survive (§Gno election suspension§!) and coup pressure falls to §Y35§!. The Kingdom pays the price in stability and political capital, and an §Yuneasy compromise§! strains the government for 180 days."
 thailand.71.t: "The Youth in the Streets"
 thailand.71.d: "They organize on Telegram, quote Hamtaro and Hunger Games, and fill the monuments by the tens of thousands. Their demands are written on paper aeroplanes thrown over the barriers. Dissolve parliament, rewrite the constitution, reform untouchable institutions."
 thailand.71.a: "Disperse the rallies. Order cannot wait."
 thailand.71.b: "Open a dialogue. Concede the tone, not the substance."
 thailand.71.c: "Wait them out. They will tire before we do."
 thailand.155.t: "A Region Ablaze"
 thailand.155.d: "Coordinated arson across three provinces in one night. Checkpoints hit in daylight. Teachers under escort, schools shuttered for the term. The south has not burned like this in a generation, and the National Security Council wants a direction."
 thailand.155.a: "Flood the south with troops."
 thailand.155.b: "Call Kuala Lumpur and widen the dialogue."
 thailand.156.t: "Quiet Roads in Pattani"
 thailand.156.d: "The monthly incident map has more white space than red. Markets stay open past dark, the checkpoints wave traffic through, and the men across the table in Kuala Lumpur are asking, carefully, what a final status might look like."
 thailand.156.a: "Push for a final accord."
 thailand.156.b: "Maintain the quiet, and the status quo."
 thailand.350.t: "The Fire in the South"
 thailand.350.d: "The map of the three southern provinces is a constellation of red pins, with bombings, ambushes, arson, and assassination. Thousands are dead and the security forces are bleeding men they cannot replace. The crisis can no longer be managed at the margins. The government must decide what kind of state it intends to be in the South. A fist, a benefactor, or a partner across the table."
 thailand.350.a: "Crush them. The South will know the meaning of order."
 thailand.350.b: "The King's peace. Develop the South, win it back."
 thailand.350.c: "Talk to them. Even old enemies can sign a paper."
 thailand.350.e: "We have no clear policy. Manage it as it comes."
 thailand.356.t: "Tak Bai"
 thailand.356.d: "It began as a protest outside a police station. It ended with hundreds of detainees stacked face-down in army trucks, and dozens dead of suffocation by the time they reached the camp. The images travel the Muslim world before Bangkok can compose a statement. Whatever the operation achieved on the ground, it has just radicalised a generation and handed the insurgency its founding myth."
 thailand.356.a: "A catastrophe. The South will not forget this."
 thailand.357.t: "Pacification Complete"
 thailand.357.d: "The generals report the mission accomplished. The roadside bombs have stopped, the cells are broken, the checkpoints are coming down. By every metric the army measures, the Deep South is pacified. Beneath the silence the grievance has not died. It has merely learned to wait."
 thailand.357.a: "The guns are silent. We will watch the embers."
 thailand.358.t: "A Southern Calm"
 thailand.358.d: "There was no treaty and there is no autonomy, but the violence has receded into a managed quiet. Royal development flows, local notables are inside the tent, and the monarchy's legitimacy in the South is quietly restored. It is a calm kept by presence and patronage, watched over rather than resolved."
 thailand.358.a: "The crown keeps the peace it has won."
 thailand.359.t: "The Establishment Pushes Back"
 thailand.359.d: "The draft special-autonomy law has leaked, and the reaction in Bangkok is ferocious. Generals warn of dismemberment, palace conservatives mutter about precedent, and the nationalist press calls it surrender. The negotiators are ready to sign, but the government must decide whether it will spend the political capital to hold the line, or water the framework down to something the centre can swallow."
 thailand.359.a: "Hold the line. The accord must be real."
 thailand.359.b: "Water it down. Keep the peace, lose the principle."
 thailand.360.t: "The Pattani Accord"
 thailand.360.d: "Signatures on a single page end the longest war inside the Kingdom's modern borders. The South gains genuine self-government within a unitary Thailand, the guns are surrendered, and the displaced begin to return. It is imperfect, contested, and historic, and for the first time in a generation, the children of Pattani will grow up without curfew."
 thailand.360.a: "Peace, at last, in the South."
 thailand_news.24.t: "Massacre at Tak Bai"
 thailand_news.24.d: "Footage of detainees suffocated in army trucks outside Tak Bai has reached every capital in the Muslim world. Kuala Lumpur, Jakarta, and Ankara have summoned Thai ambassadors, and human-rights bodies demand an inquiry. Bangkok's southern policy is now a byword for atrocity, and the insurgency has never had an easier recruiting season."
 thailand_news.24.a: "The world is watching the South."
 thailand_news.25.t: "Peace Comes to Pattani"
 thailand_news.25.d: "After a generation of bloodshed, the guns have fallen silent in Thailand's Deep South. Whether by the soldier's hand or the negotiator's pen, the longest insurgency in the Kingdom's modern history has reached its end. The roads are open, the markets full, and a wary normalcy returns to Pattani, Yala, and Narathiwat."
 thailand_news.25.a: "A long war ends."
 thailand_news.23.t: "A Government of National Unity"
 thailand_news.23.d: "The tanks have withdrawn from the intersections, but the bargain struck in the night will outlast the crisis. The elected government keeps its mandate and the ballot box its place, yet the service chiefs now sit at the cabinet table, and everyone in Bangkok understands who guaranteed the peace. It is a compromise nobody loves and nobody dares break, a national government with the army inside the tent."
 thailand_news.23.a: "Power, shared and watched."
 thailand.3.c: "Crops, not poppies. Fund alternative development."
 thailand.361.t: "Bodies by the Roadside"
 thailand.361.d: "The three-month campaign is over and the tally is in. Rights organizations document some 2,800 dead, the great majority never charged with anything, many never even named. Blacklists settled old scores, and quotas were met with bodies. The streets are quieter and the polls are higher than ever, but in the barracks and the palace, men are taking notes on a government that kills on a timetable."
 thailand.361.a: "The numbers are the numbers. We do not apologize."
 thailand.362.t: "Crops Not Poppies"
 thailand.362.d: "Interdiction alone has only pushed the trade across the next ridgeline. The agronomists and the public-health people have a different proposal. Pay the hill farmers to grow coffee, macadamia and fruit instead of opium, treat addiction as illness rather than crime, and let legal cash crops do what helicopters never could. It is slower, it is cheaper, and it asks the state to stop shooting and start buying."
 thailand.362.a: "Fund alternative development. Win the hills with markets."
 thailand.362.b: "Keep interdicting. Hold the line we have."
 thailand_news.5.t: "Thailand Unveils the Eastern Economic Corridor"
 thailand_news.5.d: "Bangkok has formally opened its flagship development zone on the Eastern Seaboard, with high-speed rail to three airports, an expanded U-Tapao aerotropolis, and incentive packages aimed at electric vehicles, aerospace and biotechnology. Analysts call it the most ambitious Thai economic project since the Eastern Seaboard programme of the 1980s."
 thailand_news.5.a: "The Land of Smiles means business."
 thailand.50.b: "Soften the blow and protect the people."
 thailand.55.b: "Build the national car."
 thailand.200.t: "The People's Constitution"
 thailand.200.d: "Civil society organizations, academics and community leaders celebrate a constitution written with genuine public participation. For the first time in decades, ordinary Thais feel they had a hand in their own basic law, and the streets of Bangkok are unexpectedly festive."
 thailand.200.a: "Democracy takes root."
 thailand.201.t: "Records at Don Mueang"
 thailand.201.d: "Passenger numbers at Don Mueang surpass every previous record, and the Amazing Thailand campaign has worked beyond anyone's projections. Airline executives are announcing new direct routes and tour operators are booking out the next two seasons already. The question before us is what to do with the revenue."
 thailand.201.a: "Reinvest it in southern resorts."
 thailand.201.b: "Bank the windfall."
 thailand.202.t: "A World Hungry for Rice"
 thailand.202.d: "A drought in the Indian subcontinent and crop failures across Southeast Asia have sent world rice prices to a decade high. Thailand sits on stockpiles of premium Hom Mali and Jasmine varieties that every grain importer wants immediately. The commerce ministry is waiting for our answer."
 thailand.202.a: "Sell the stockpile at premium prices."
 thailand.202.b: "Keep the rice at home and subsidize domestic prices."
 thailand.203.t: "The Basing Request"
 thailand.203.d: "The U.S. Pacific Command has made a quiet but formal request for expanded access rights at U-Tapao airbase for logistics, surveillance and pre-positioning. The Americans are willing to pay, in treasury transfers, equipment upgrades and political cover. The public need never know the details."
 thailand.203.a: "Grant the access and take the money."
 thailand.203.b: "Decline politely. Thai soil, Thai sovereignty."
 thailand_news.6.t: "The Bamboo Bends, It Does Not Break"
 thailand_news.6.d: "Thailand has struck a landmark dual-track diplomatic alignment, simultaneously deepening its treaty relationship with Washington while signing a new framework economic partnership with Beijing. Bangkok's foreign ministry is calling it 'bamboo diplomacy', flexible, resilient, and rooted in Thai interests above all others."
 thailand_news.6.a: "A remarkable balancing act."
 thailand_news.7.t: "Thailand Repays IMF Two Years Early"
 thailand_news.7.d: "Bangkok has cleared its entire International Monetary Fund debt obligation, two years ahead of schedule. The early repayment, announced without fanfare by the Finance Ministry, closes the chapter on the 1997 Asian Financial Crisis and frees Thailand from the last conditions attached to the 1997 bailout programme."
 thailand_news.7.a: "The Land of Smiles pays its debts."
 thailand.205.t: "Technocrats vs the Old Guard"
 thailand.205.d: "The new CEO-style cabinet has set performance targets for every ministry, and several permanent secretaries have been replaced with business executives. The old bureaucracy is not amused. A quiet war is underway between the technocrats pushing 'Thailand Inc.' and the career officials who have run the ministries for thirty years."
 thailand.205.a: "Back the technocrats. Reform the ministries."
 thailand.205.b: "Protect the career bureaucracy. Keep the ministries running and the generals onside."
 thailand.206.t: "The Red Wave"
 thailand.206.d: "The results board fills in province by province. Isaan, the North, the Central Plains, seat after seat turns. By midnight the party holds a majority that no coalition arithmetic can dislodge. Red-shirted supporters in the squares outside government offices are chanting a name."
 thailand.206.a: "The people have spoken."
 thailand.207.t: "Prayuth Fatigue"
 thailand.207.d: "Three years in, the generals' promises of reform are wearing thin. The constitutional drafting committee has been reconstituted twice. The election date has moved twice. An undergraduate with a sign outside Parliament faces seventeen charges. The honeymoon is over."
 thailand.207.a: "We will manage the transition carefully."
 thailand.208.t: "The Standoff Continues"
 thailand.208.d: "Days pass, then weeks. The protests have not collapsed, but they have not escalated either. The government neither concedes nor clears the square. Eventually both sides blink. The question is who blinked less."
 thailand.208.a: "Seek a quiet resolution with concessions."
 thailand.208.b: "The protesters take credit. The government takes the blame."
 thailand_news.8.t: "The Palace Takes the Wheel"
 thailand_news.8.d: "The Thai royal establishment has formalized its role in the management of Crown Property Bureau assets, consolidating authority over hundreds of billions of baht in commercial holdings into a structure reporting directly to the palace. Analysts in Bangkok debate whether this represents a constitutional novelty or simply a legal tidying-up of arrangements that have existed informally for decades."
 thailand_news.8.a: "The Chakri dynasty endures."
 thailand.209.t: "The Kids Are Online"
 thailand.209.d: "A youth-led protest movement has erupted simultaneously in Bangkok, Chiang Mai and three provincial campuses. Their demands are transmitted over livestreams before the police have unrolled their barriers. The government must decide whether to engage or wait."
 thailand.209.a: "Champion their cause."
 thailand.209.b: "Keep governing. Let the moment pass."
 thailand.210.t: "A Letter from the Barracks"
 thailand.210.d: "An anonymous document, circulated among senior officers and then leaked, describes plans for a civilian-orchestrated reduction of military influence over promotions and procurement. The text carries a warning. The army is watching, and patience has a limit. This may be a genuine coup plot in its early stages, or a bluff. The choice of response defines what kind of country this is."
 thailand.210.a: "Act now and purge the plotters before they can organize."
 thailand.210.b: "Proceed quietly. We will not dignify leaks with a response."
 thailand.211.t: "The Provinces Have Spoken"
 thailand.211.d: "Returns from the northeast and the upper north are in, and district after district has swung to the reform list. Veteran MPs of thirty years standing have lost to twenty-eight-year-olds who campaigned on social media. The electoral map is being redrawn by voters who have never had a local MP take their calls."
 thailand.211.a: "Seize the mandate."
 thailand.211.b: "Govern for all of them, not just our voters."
 thailand.212.t: "The Conglomerates Respond"
 thailand.212.d: "The auction of the previously monopolised spectrum blocks has produced exactly the windfall the reformers predicted. The same week, a coordinated legal challenge from the three largest conglomerates landed in the Constitutional Court, and an opinion column in a royalist paper described the finance ministry as 'ideologically possessed.' The break-up policy is working, and it has powerful enemies."
 thailand.212.a: "Press on. The law is on our side."
 thailand.212.b: "Offer a settlement, a managed wind-down rather than a forced break-up."
 thailand.213.t: "The Republic's First Year"
 thailand.213.d: "Twelve months since the declaration, and the country is still here, bruised, energized, and arguing, but here. The royalist movement has not disappeared. It has mutated into a legal and cultural campaign. The first presidential election is scheduled. The question before the cabinet is whether to call it a success, acknowledge the fracture, or simply get on with governing."
 thailand.213.a: "We have built something that will last."
 thailand.213.b: "The Chakri cause is not finished. The people remember."
 thailand.213.c: "The republic survives, for now. There is still much to defend."
 thailand.214.t: "The Column Passes the Monument"
 thailand.214.d: "Three hours of artillery, armour, and infantry, the armed forces in full parade order along Ratchadamnoen Avenue. The crowds are larger than the planners expected. For a country that has forgotten its wars and absorbed its coups as routine, the display lands with unusual weight."
 thailand.214.a: "A nation salutes its defenders."
 thailand_news.9.t: "Thailand Legalises Same-Sex Marriage"
 thailand_news.9.d: "The Thai parliament has passed the Marriage Equality Act by a two-thirds majority, becoming the first country in Southeast Asia to grant full marriage rights regardless of gender. The act takes effect immediately. Celebrations in Bangkok's Silom and Chiang Mai's Nimman districts have drawn tens of thousands. Several neighbouring governments have issued statements expressing 'concern.'"
 thailand_news.9.a: "A milestone for Asia."
 thailand_news.10.t: "The Spring Holds"
 thailand_news.10.d: "Three years since the reform government took office on a wave of youth protest, Thailand today completes a full democratic transition. Civilian control of the military is formalized, the appointed senate is dissolved, and the first freely competitive election in two decades is held without incident. International observers from seventeen countries have certified the result."
 thailand_news.10.a: "Democracy takes root."
 thailand_news.11.t: "Thai Wave Sweeps Asia"
 thailand_news.11.d: "From Tokyo to Taipei to Kuala Lumpur, Thai content is everywhere. Streaming series, hip-hop acts, fashion labels, and a cuisine diplomacy machine that the government did not plan and cannot take full credit for. Thailand's cultural output has overtaken its neighbours' in both value and reach."
 thailand_news.11.a: "The world wants what Thailand is making."
 thailand.215.t: "Taking Stock of the Kingdom"
 thailand.215.d: "The new government's first internal review is complete. Officials have gathered the numbers, the debt ratios, infrastructure gaps, trade balances, and public morale, and three paths stand out from the analysis. The government must choose its first priority. Whatever is chosen now will shape the country's trajectory for the next two years."
 thailand.215.a: "Focus on Recovery. Rebuild the economy from the ground up."
 thailand.215.b: "Focus on Order. Strengthen institutions before reforming them."
 thailand.215.c: "Focus on the World. Lead with diplomacy and trade."
 thailand.216.t: "The Generals' Move"
 thailand.216.d: "The government's resistance call has gone out to loyalists in the police, the border patrol, civil society networks, and the streets. Whether the people answer is the question that decides the next decade of Thai politics. In the operations room, staff are watching unit deployments on the map and counting."
 thailand.216.a: "Hold the line."
 thailand.217.t: "Beijing Signals Displeasure"
 thailand.217.d: "The Chinese embassy's note is diplomatically worded but unmistakably cold. Thailand's deepening alignment with Washington has not gone unnoticed. State media in Beijing mention Thailand's 'contradictory posture.' Investment delegations quietly postpone their visits. The question before Bangkok is how much of this to absorb and how much to deflect."
 thailand.217.a: "Let the relationship cool. We have made our choice."
 thailand.217.b: "Reassure Beijing quietly with a personal message from the PM."
 thailand.218.t: "Washington Adjusts"
 thailand.218.d: "The U.S. State Department has noted Thailand's new BRI alignment with studied neutrality in public, but congressional staff have begun asking pointed questions about Cobra Gold funding and treaty commitments. The Pentagon's assessment, leaked to a Washington think-tank, describes Thailand as 'strategically ambiguous.' Bangkok must manage the relationship."
 thailand.218.a: "Accept the cooling. We are a sovereign nation."
 thailand.218.b: "Private reassurances to the Ambassador. This changes nothing essential."
 thailand.219.t: "The Generals in Permanence"
 thailand.219.d: "The decision to institutionalize military guardianship has reached international editorial pages. The Financial Times describes it as 'managed authoritarianism.' Three European ambassadors requested meetings with the foreign ministry in the same week. At home, reform-minded academics and students are reading the coverage and drawing their own conclusions."
 thailand.219.a: "We govern by our own lights. Foreign commentary is irrelevant."
 thailand.219.b: "The critics are wrong about Thailand. We will prove them wrong on our terms."
 thailand.220.t: "The South Welcomes Visitors Again"
 thailand.220.d: "Two years since the tsunami closed the beaches of the Andaman coast to all but repair crews, the last resort has reopened. The Tourism Authority of Thailand has run a careful rehabilitation campaign, and the bookings suggest it worked. The south is back."
 thailand.220.a: "Thailand is open."
 thailand.221.t: "The Southern Reconstruction Is Complete"
 thailand.221.d: "International aid teams and government engineers have finished the coastal infrastructure reconstruction program. The roads are rebuilt, the fishing jetties repaired, and the power grid restored. The aid partners have been thanked and the scaffolding is coming down."
 thailand.221.a: "The south stands again."
 thailand.222.t: "The Global Financial Crisis"
 thailand.222.d: "The collapse of Lehman Brothers in New York has sent shockwaves through Asian markets. Thailand's export sector is watching its order books carefully. The question for Bangkok is whether the financial buffers built over the past decade will hold, or whether the crisis will find its way through the seawall."
 thailand.222.a: "Thailand weathers the storm. Our prudence has paid off."
 thailand.222.b: "The storm has arrived. We must brace for a difficult two years."
 thailand.223.t: "The Network Is Alarmed"
 thailand.223.d: "In the Privy Council's reading room and the halls of the military's internal intelligence branch, analysts are processing the election results. Three hundred and seventy-four seats. Single-party majority. A mandate without precedent in Thai democratic history, and the network has no reliable instrument against it. Not today."
 thailand.223.a: "The villages have spoken. For now."
 thailand.224.t: "The Rice Reckoning"
 thailand.224.d: "World rice prices have not cooperated. The global supply glut has left the government holding millions of tonnes of stockpiled rice purchased well above market value, and the arbitrage that was supposed to fund the scheme has failed to materialise. The Finance Ministry has put three options on the table. Two of them are politically possible."
 thailand.224.a: "Absorb the losses and cover the shortfall from the Treasury."
 thailand.224.b: "Let the scheme collapse and take the political hit now."
 thailand.225.t: "The Roads Reach the Villages"
 thailand.225.d: "Ministers in hard hats cut the ribbons on new highways across the Khorat plateau and rail spurs into the Northern valleys. Provincial offices open their doors in towns that have only ever sent their sons to build the capital. For once, the development comes home to the people who delivered the landslide."
 thailand.225.a: "The heartland is rewarded."
 thailand.226.t: "The Reign of King Vajiralongkorn"
 thailand.226.d: "The year of mourning is ending. The new King's approach to the throne is unlike his father's. A more visible presence in public, a tighter grip on Crown Property, and a different kind of royal charisma. The network that served the Ninth Reign must learn to serve the Tenth. It is not the same network."
 thailand.226.a: "The Kingdom enters a new era."
 thailand.227.t: "The Veterans Object"
 thailand.227.d: "The announcement that conscription will be phased out has provoked a coordinated response from retired officers and veterans' associations. In the barracks, senior NCOs grumble about a 'hollowed-out' army. The press runs photographs of the old generals in full-dress uniform, looking unhappy. The government expected this, but the amplitude of the pushback is higher than the models suggested."
 thailand.227.a: "Stand firm. The reform is correct."
 thailand.227.b: "Offer a veterans' recognition ceremony and absorb the criticism symbolically."
 thailand.228.t: "Tourism Dividend"
 thailand.228.d: "The first season after the open-skies agreement is in the books. The numbers from the Tourism Authority are strong. Arrival figures are up twelve percent, average daily spend is up nineteen percent, and the southern resorts, which benefit most from the new low-cost carrier routes, are reporting their best quarter in a decade."
 thailand.228.a: "The baht is flowing."
 thailand_news.12.t: "The Canal Is Open"
 thailand_news.12.d: "Thailand has completed the Kra Canal, a 120-kilometre waterway linking the Gulf of Thailand to the Andaman Sea, cutting 1,200 nautical miles from the Malacca route. The first commercial convoy, twenty-two vessels flying seven flags, passed through at dawn. In Bangkok, the Cabinet declared a national holiday. In Singapore, the Straits Times ran no headline."
 thailand_news.12.a: "Two oceans, one kingdom."
 thailand_news.13.t: "Thailand, Gateway of Asia"
 thailand_news.13.d: "The Thai government has formally proclaimed its southern infrastructure corridor, whether canal or land bridge, 'open to all nations under equitable terms.' International investment has already begun to flow into the Southern Economic Zone, and Bangkok is hosting delegations from twelve countries seeking preferential transit arrangements."
 thailand_news.13.a: "The Land of Smiles commands the sea lanes."
 thailand.230.t: "Engineers at Songkhla"
 thailand.230.d: "The feasibility reports are on the table. The Royal Engineers have surveyed the isthmus twice, and the geology is hard but workable. The first option is a full sea-level canal, three to four years of national mobilization, twenty billion baht, and a chokepoint that reshapes Asian trade. The second is a land bridge trans-shipment corridor, eighteen months, twelve billion baht, and steady returns without the drama. Both options are real. Both require commitment."
 thailand.230.a: "Commission the Canal. Let the ships sail under Thai skies."
 thailand.230.a_tooltip: "The canal route, the full sea-level megaproject."
 thailand.230.b: "Build the Land Bridge. Sooner, cheaper, safer."
 thailand.230.b_tooltip: "The land-bridge route, a phased trans-shipment corridor."
 thailand.232.t: "Cutting Through Limestone"
 thailand.232.d: "The first hundred kilometres of the northern section are on schedule, but the limestone ridge at Trang province has cost two months and four hundred million baht in extra blasting. The Chinese engineering teams want a contract extension that includes deeper influence provisions. The Finance Ministry's bond desk is still open. Choose your next tranche."
 thailand.232.a: "Continue with the Chinese consortium."
 thailand.232.b: "Finance the next stage with sovereign bonds."
 thailand.233.t: "The Locks Take Shape"
 thailand.233.d: "The southern lock chambers are complete, the largest civil engineering structures in Thai history. International journalists have begun arriving to document the project, and the construction site has become its own tourist attraction. Financing pressure continues. One more decision before the final push."
 thailand.233.a: "Chinese consortium for the third stage."
 thailand.233.b: "Sovereign bonds for the last push on our own terms."
 thailand.234.t: "First Waters Flow"
 thailand.234.d: "The cofferdam at the Andaman end has been partially breached for the trial run. Cameras broadcast the moment across Asia. One more financing tranche before the completion focus becomes available."
 thailand.234.a: "Chinese consortium for the final push."
 thailand.234.b: "Sovereign bonds to finish what we started."
 thailand.235.t: "The Canal Awaits Its Inauguration"
 thailand.235.d: "The engineering work is done. Trial voyages have been completed, the lock systems have been tested to specification, and the port facilities at both termini are ready for commercial traffic. The government need only complete the formal political and economic commitment, and the SIA_two_oceans_one_kingdom focus is now available."
 thailand.235.a: "Prepare the inauguration ceremony."
 thailand.236.t: "Construction Crisis"
 thailand.236.d: "A combination of monsoon flooding in the southern section and a sabotage incident at a lock gate, suspected but not proven to be connected to regional interests, has set the project back. The engineering board is presenting two remediation options. Emergency funding to clear the backlog, or a slower workaround that delays the schedule."
 thailand.236.a: "Emergency funding to keep the schedule."
 thailand.236.b: "Accept the delay and preserve the treasury."
 thailand.237.t: "Singapore's Quiet Fury"
 thailand.237.d: "The Singaporean government has not issued a formal protest. It has not needed to. The Straits Times editorial, the MAS governor's speech at a London conference, and the quiet postponement of three bilateral trade negotiations say everything that cannot be said in official channels. The city-state that built itself on Malacca transit trade is recalculating its future, and Thailand is the variable."
 thailand.237.a: "Accept Singapore's displeasure as the price of success."
 thailand.237.b: "Offer Singapore preferential toll rates and manage the damage."
 thailand.238.t: "Beijing Offers Partnership"
 thailand.238.d: "A letter from the State Council arrives through the embassy, not the foreign ministry. China wishes to discuss 'preferred partner status' for the Kra Canal, with transit guarantees, naval access protocols, and a package of port investment that would make the southern terminus one of the finest in Asia. The Americans are watching."
 thailand.238.a: "Accept. China's partnership is worth having."
 thailand.238.b: "Acknowledge but deflect. The canal serves all nations."
 thailand.239.t: "New Delhi Eyes the Canal"
 thailand.239.d: "India's External Affairs Ministry has dispatched a quiet delegation to Bangkok. For New Delhi, the Kra Canal is an opportunity. It promises shorter shipping routes for Indian exports, a hedge against Chinese dominance of the Malacca Strait, and a partner in Southeast Asia that is neither in Beijing's orbit nor Washington's. The offer on the table is investment and a strategic understanding."
 thailand.239.a: "Welcome Indian engagement as a useful counterweight."
 thailand.239.b: "Stay balanced. The canal is for everyone."
 thailand.242.t: "The Final Push"
 thailand.242.d: "Four stages of excavation are done, and yet the engineers' ledger does not say 'finished.' Sabotage, floods and overruns have left sections of the cut shallower than spec and one lock gate still in its crates. The project office presents the cabinet with a closing bill. Pay it, or squeeze the schedule out of the work gangs."
 thailand.242.a: "Pay the closing bill."
 thailand.242.b: "Drive the gangs harder and open on time."
 thailand.250.t: "The Government Blinks"
 thailand.250.d: "The strike has held the country still for too long, and the cost has become unbearable for the men in power. The docks, the rails, the ministries, all of it has stopped, and the streets belong to the movement. Rather than gamble on the army firing on its own people, the cabinet opens the door to negotiation. This is the peaceful road to power, won by nerve rather than the rifle."
 thailand.250.a: "We won the streets. Now we take the state."
 thailand.259.t: "The Generals Restore Order"
 thailand.259.d: "The strike stretched on but never quite broke the government's will, and the high command ran out of patience first. Tanks are on the avenues, the strike leaders are being rounded up, and a curfew is in force. The revolution has been crushed before it could seize power, and the men in uniform now rule in the name of order. The red road is closed."
 thailand.259.a: "The revolution is broken."
 thailand.251.t: "The World Recoils"
 thailand.251.d: "Thailand's new government has announced itself to the world. Washington's response arrived before the ink dried on the party's founding documents. Economic sanctions, a frozen aid pipeline, and a statement from the State Department that managed to be both condescending and threatening. Beijing and Hanoi, by contrast, have sent congratulations."
 thailand.251.a: "Let them sanction us. We did not make this revolution for their approval."
 thailand.252.t: "The Royalists Depart"
 thailand.252.d: "The land reform has answered the question that polite Bangkok society preferred not to ask. Those who built their wealth on the old system, the absentee landlords, the investment network around the palace, the provincial families who held ten thousand rai in each of their children's names, have made their choice. Most of them are already on planes to Singapore, London, and Los Angeles."
 thailand.252.a: "A country is not its landlords."
 thailand.253.t: "The Chakri Dilemma"
 thailand.253.d: "The Chakri dynasty has ruled Siam and Thailand for over two centuries. The institution of the monarchy, whatever one thinks of the individuals who held it, is woven into the civil calendar, the legal system, the geography of Bangkok, and the emotional architecture of a significant portion of the population. The party must decide what it will do with it.\n\nThis is not a decision about a person. It is a decision about a constitutional structure. The party's commitment to the revolution's goals is not in question. The question is whether those goals are better served by a clean break or a managed transition."
 thailand.253.a: "Abolish the monarchy. It has no place in a people's republic."
 thailand.253.b: "Keep a constitutional figurehead while the party governs."
 thailand_news.14.t: "The Bamboo Curtain Falls"
 thailand_news.14.d: "Thailand has formalised its alignment with Laos and Vietnam in a regional solidarity framework that analysts are already calling the 'Bamboo Curtain.' For the first time since Pol Pot's Cambodia, a Southeast Asian government has declared a communist bloc orientation. Western capitals are recalculating. Beijing is welcoming. The Thai baht has been replaced with a new currency overnight."
 thailand_news.14.a: "The map of Southeast Asia has changed."
 thailand_news.31.t: "The Countryside Surrounds the City"
 thailand_news.31.d: "After years of insurgency dismissed by Bangkok as a remnant of a dead war, the Communist Party of Thailand has declared open people's war. Base areas across the northern highlands and the Isaan plateau are now beyond the reach of the security forces, and recruits are streaming in from villages the state long ago stopped serving. Military analysts who counted the movement out are quietly revising their assessments."
 thailand_news.31.a: "The hills are theirs now."
 thailand_news.32.t: "Thailand Joins the Dragon's Wake"
 thailand_news.32.d: "Bangkok has signed a sweeping partnership with Beijing. It brings investment, trade access, and a security understanding that places revolutionary Thailand firmly within China's orbit. State media calls it the natural alignment of two socialist neighbours. Western diplomats call it a satellite acquiring a sun. The construction cranes rising over Bangkok suggest the money, at least, is real."
 thailand_news.32.a: "The orbit is set."
 thailand_news.33.t: "A Federation of the Three Rivers"
 thailand_news.33.d: "Thailand, Laos, Vietnam and Cambodia have announced a framework for an Indochinese socialist federation, with Bangkok as its industrial and diplomatic heart. For the first time, the revolutions of the Mekong speak with one voice, and that voice is loud enough that the great powers must answer it rather than ignore it. Whether four proud capitals can share one project remains the open question."
 thailand_news.33.a: "Indochina speaks as one."
 thailand.270.t: "The Kingmaker"
 thailand.270.d: "Anutin Charnvirakul's party holds the decisive bloc in the new parliament. His price for coalition entry is not unreasonable, a handful of ministries, a commitment to rural development spending, and one very particular policy pledge. But coalitions always cost more than the initial offer suggests."
 thailand.270.a: "Form the coalition. The governing majority is worth the price."
 thailand.270.b: "Decline. We can govern without them, or not govern at all."
 thailand.271.t: "The Ministry of Ministries"
 thailand.271.d: "The cabinet-level negotiations are concluded. Bhumjaithai receives the Public Health Ministry, the Agriculture Ministry, and a deputy prime-ministership. The paperwork is signed, the coalition is official, and the horse-trading begins immediately."
 thailand.271.a: "The coalition holds. For now."
 thailand.272.t: "The Repeal Movement"
 thailand.272.d: "Conservative members of the coalition, and royalist-aligned civil-society groups outside it, have mounted a formal repeal campaign against the cannabis decriminalization act. They have enough signatures to force a parliamentary debate. The question is whether the government fights to preserve the policy or trades it for political peace."
 thailand.272.a: "Repeal the act. Stability is worth more than the Green Rush."
 thailand.272.b: "Stand firm. The policy stays. Let them take it to the courts."
 thailand.273.t: "An Offer from Bangkok"
 thailand.273.d: "Thailand extends its hand to the Shan. Recognition, arms, and a working treasury are on the table for a Shan state that aligns with the Kingdom. The autonomy would be real. So would the dependence that comes with it, and Naypyidaw will not forgive the choice."
 thailand.273.a: "Accept Bangkok's protection."
 thailand.273.b: "We will stand on our own."
 thailand.280.t: "First Win on the Road"
 thailand.280.d: "Chaiseri Metal and Rubber's First Win 4x4 has found buyers across the Association. Indonesian marine infantry, Philippine constabulary, a Malay border regiment. The first batch has shipped. The export agent's commission is smaller than the reputational dividend. Southeast Asia now knows Thailand makes things worth buying."
 thailand.280.a: "Sign the contracts. The ASEAN market is ours."
 thailand.281.t: "The Marines Train at Sattahip"
 thailand.281.d: "The Royal Thai Marine Corps' first dedicated amphibious exercise in a decade puts a battalion through beach-assault lanes at the Sattahip naval base. The new doctrine is written, the dockyard expansion is funded, and the Corps' commander has stopped apologising for the budget and started planning the next exercise."
 thailand.281.a: "From the sea."
 thailand_news.15.t: "Thailand, ASEAN's Emerging Arsenal"
 thailand_news.15.d: "A wave of defence export contracts signed in Bangkok this quarter has prompted regional analysts to reconsider Thailand's position in the Southeast Asian defence market. First Win MRAPs are in Philippine and Indonesian inventories, and Thai-manufactured artillery fuses are in Malaysian stockpiles. The Royal Thai Arsenal is no longer a domestic procurement programme. It is a regional supplier."
 thailand_news.15.a: "The Kingdom's factories are working."
 thailand_news.16.t: "Bangkok Announces Multi-Domain Operations Doctrine"
 thailand_news.16.d: "The Royal Thai Armed Forces Supreme Command has published Thailand's first official Multi-Domain Operations doctrine, integrating cyber, electronic warfare, drone strikes, and conventional ground manoeuvre into a unified operational framework. Developed in joint exercises with American and Australian partners, the MDO doctrine signals that Thailand no longer conceives of warfare as a single-domain contest."
 thailand_news.16.a: "The Kingdom fights on every front."
 thailand.310.t: "The Reactor Goes Critical"
 thailand.310.d: "At 3.47 in the morning, the control room instruments climb through zero. Thailand's first pressurised water reactor has achieved criticality. The chief engineer calls it a technical milestone, and the cabinet calls it energy security. Both are correct. The national grid will look different by morning."
 thailand.310.a: "A new era of baseload power."
 thailand.311.t: "Phnom Penh Responds"
 thailand.311.d: "Cambodia's foreign ministry has replied to Bangkok's overtures, more formally than expected, more warmly than feared. The Phnom Penh government's calculation is clear. A close relationship with Thailand is a hedge against over-dependence on Beijing and a revenue stream that the region's fastest-growing economy can provide."
 thailand.311.a: "Welcome the partnership."
 thailand.311.b: "Engage cautiously. Progress takes time."
 thailand.312.t: "The Jakarta Dialogue"
 thailand.312.d: "Indonesia's delegation arrives without a joint communiqué drafted. Jakarta wants to know what Bangkok intends. A genuine partnership of regional equals, or a competition for the ASEAN leadership role that Indonesia has long considered its own? Both options are on the table. Neither is cheap."
 thailand.312.a: "Partnership. Joint exercises, shared doctrine, mutual gain."
 thailand.312.b: "Competition. We will out-influence Jakarta in its own neighbourhood."
 thailand.313.t: "The Chinese Contract File"
 thailand.313.d: "The Finance Ministry's assessment is unambiguous. The infrastructure contracts signed under the BRI framework have delivered roads and rails that Thailand needed, but the financing terms embed Beijing's influence in the project pipelines for a generation. The question before cabinet is whether to continue drawing on Chinese capital or to absorb the short-term pain of renegotiation."
 thailand.313.a: "Keep the financing. The projects deliver."
 thailand.313.b: "Renegotiate. Sovereignty costs money."
 thailand.314.t: "Washington Requests a Review"
 thailand.314.d: "The U.S. Pacific Command has formally requested a bilateral security review. In practice, it is an invitation to deepen Thailand's treaty alignment, take the training packages, and accept the political visibility that comes with being America's most reliable Southeast Asian partner. The alternative is to maintain the hedge."
 thailand.314.a: "Deepen the alliance. Take the training and the commitment."
 thailand.314.b: "Distance. The hedge serves Thailand better."
 thailand_news.17.t: "Thailand Lights Its First Nuclear Reactor"
 thailand_news.17.d: "The Royal Thai Government has brought Thailand's first commercial nuclear power plant to full operation, becoming the sixth country in Southeast Asia to operate civilian nuclear technology. The 600-megawatt pressurised water reactor, located in Chachoengsao Province, will supply roughly eight percent of national electricity demand. Analysts note the reactor's dual utility. It offers energy security and a new axis of technical prestige in a region where nuclear capability is increasingly a marker of middle-power ambition."
 thailand_news.17.a: "The Kingdom joins the nuclear age."
 thailand.315.t: "Landmine at Ta Muen Thom"
 thailand.315.d: "A landmine explosion near the disputed Ta Muen Thom temple complex has wounded three Royal Thai Army soldiers. Both sides accuse the other of planting it. The incident has set off nationalist protests in Bangkok and Phnom Penh."
 thailand.315.a: "Demand answers and mobilise nationalist sentiment."
 thailand.315.b: "Request ASEAN mediation and let the diplomats lead."
 thailand.316.t: "Shots Fired at Ta Muen Thom"
 thailand.316.d: "Skirmishes have broken out along the disputed border. Both governments are under pressure from their militaries and nationalist movements. The ASEAN Secretary-General has issued a statement calling for restraint."
 thailand.316.a: "Press the advantage."
 thailand.316.b: "Accept the ASEAN ceasefire."
 thailand.317.t: "The July War, Full Military Engagement"
 thailand.317.d: "Thai and Cambodian forces have clashed in a week-long border engagement near Ta Muen Thom and Preah Vihear. Artillery exchanges have caused casualties on both sides. ASEAN has convened an emergency summit."
 thailand.317.a: "Accept the ASEAN ceasefire after demonstrating strength."
 thailand.317.b: "Dig in and hold the gains."
 thailand.318.t: "Tensions Reignite at the Border"
 thailand.318.d: "Despite the ceasefire agreement, clashes have resumed along the disputed border. The December flare-up tests whether the two countries can hold their agreement or slide back into open conflict."
 thailand.318.a: "Reaffirm the ceasefire."
 thailand.318.b: "Resume hostilities."
 thailand.319.t: "Washington Says No to F-35"
 thailand.319.d: "The United States has declined Thailand's formal request for F-35 Lightning II fighters, citing technology transfer restrictions and concerns about Thailand's relationship with China."
 thailand.319.a: "Pursue the Gripen E/F programme."
 thailand.319.b: "Accept the F-16V Block 70 instead."
 thailand.319.c: "Pivot to the J-10CE. Beijing will supply."
 thailand.320.t: "Paetongtarn Removed by Court"
 thailand.320.d: "Thailand's Constitutional Court has removed Prime Minister Paetongtarn Shinawatra from office following a leaked phone call in which she appeared to undermine an independent institution. Anutin Charnvirakul of Bhumjaithai is named caretaker Prime Minister."
 thailand.320.a: "Accept the verdict."
 thailand.320.b: "Challenge the ruling, ahistorical."
 thailand.321.t: "Anutin Takes the Helm"
 thailand.321.d: "Anutin Charnvirakul leads a caretaker government with People's Party confidence-and-supply support. He has promised new elections within four months."
 thailand.321.a: "The caretaker government begins its work."
 thailand.322.t: "Thailand Goes to the Polls, February 2026"
 thailand.322.d: "Thais vote in a general election that will shape the country's political direction for the next four years. The border-war nationalism bonus has boosted support for Bhumjaithai. The People's Party leads in urban polling."
 thailand.322.a: "Bhumjaithai wins, and Anutin's mandate is confirmed."
 thailand.322.b: "The People's Party coalition takes power."
 thailand_news.18.t: "ASEAN Brokers Thai-Cambodian Ceasefire"
 thailand_news.18.d: "The Association of Southeast Asian Nations has successfully mediated a ceasefire agreement between Thailand and Cambodia, ending weeks of border skirmishes near the Ta Muen Thom temple complex. ASEAN's Secretary-General hailed the outcome as proof that regional institutions can contain bilateral flashpoints before they escalate to open war."
 thailand_news.18.a: "The region holds, for now."
 thailand_news.19.t: "Anutin's Party Dominates Thai Election"
 thailand_news.19.d: "Bhumjaithai has secured 193 seats in Thailand's February 2026 general election, delivering Anutin Charnvirakul a commanding mandate and ending months of caretaker uncertainty. The result consolidates Thailand's conservative-populist political centre and sets the stage for a full four-year term."
 thailand_news.19.a: "A new mandate for the Kingdom."
 thailand.330.t: "The Soul of the Officer Corps"
 thailand.330.d: "A quiet argument runs through the General Staff. One faction wants a professional, apolitical army of competent technicians. The other wants a celebrated warrior caste, the pride and sword of the nation. The choice the Kingdom makes now will shape the officer corps for a generation."
 thailand.330.a: "Build a professional corps."
 thailand.330.b: "Cultivate martial prestige."
 thailand.334.t: "The Submarine Commissioned"
 thailand.334.d: "Years after the engine controversy, the first S26T boat is finally commissioned into the Royal Thai Navy. The crew has trained hard for this day. Whatever the politics of the procurement, Thailand now operates a modern submarine, and the regional balance shifts a little southward."
 thailand.334.a: "The fleet puts to sea."
 thailand_news.26.t: "Gripens over Bangkok"
 thailand_news.26.d: "The Royal Thai Air Force has taken delivery of its first JAS 39 Gripen multirole fighters, flying them in formation over the capital to mark the milestone. The Swedish-built jets give Thailand a genuine fourth-generation air-combat capability and a foothold in modern data-linked air warfare."
 thailand_news.26.a: "The Kingdom's skies are guarded."
 thailand_news.27.t: "Thai Arms on the World Market"
 thailand_news.27.d: "Thailand's new Defense Export Office has announced its first wave of overseas contracts. Armoured vehicles, artillery, and munitions bound for buyers across Southeast Asia and beyond. The Kingdom's defence industry, once a budget line, is becoming an export earner."
 thailand_news.27.a: "Made in Thailand, sold to the world."
 thailand_news.28.t: "A Nation in Arms"
 thailand_news.28.d: "Bangkok has unveiled a comprehensive total-defence programme. It brings expanded reserves, civil-defence drills in every province, and a doctrine that treats the whole society as the last line of resistance. Critics call it militarisation, and the government calls it prudence."
 thailand_news.28.a: "The whole nation stands ready."
 SIA_expansionism_threat: "Thai Expansionism"
 thailand.380.t: "Engineers at the Isthmus"
 thailand.380.d: "The feasibility commission's verdict is in. The cut is hard, but it is possible. The only question left is the one that has killed the project for a century, and that is who pays. Three foreign offers sit on the cabinet table beside the option of paying for it ourselves. Each carries a price that is not only measured in baht."
 thailand.380.a: "Take Beijing's Belt and Road financing. Cheap, fast, and we will worry about the terms later."
 thailand.380.b: "Choose Japan. Slower and dearer, but built to last and free of hidden clauses."
 thailand.380.c: "Bring in an international consortium. Phased, shared, and beholden to no single power."
 thailand.380.e: "Build it ourselves. The canal will be Thai to the last bollard."
 thailand.381.t: "Ground Broken"
 thailand.381.d: "The cofferdams are sunk, the first cubic metres of spoil are lifted, and the great cut at the Kra Isthmus has begun in earnest. The work will proceed in phases, each one a fresh test of the treasury's nerve."
 thailand.381.a: "Let the digging begin."
 thailand.382.t: "A Phase Complete"
 thailand.382.d: "Another stage of the canal is finished and signed off by the engineers. The cut is deeper, the works are further along, and the cabinet allows itself a moment of cautious pride before the next bill arrives."
 thailand.382.a: "On to the next phase."
 thailand.383.t: "Cost Overrun"
 thailand.383.d: "The latest phase has blown through its budget. Hard rock, a flooded gallery, and a contractor's revised estimate have left the project office asking the cabinet for a decision. Find the money, or accept that the canal will open later than promised."
 thailand.383.a: "Pour the money in and keep the schedule."
 thailand.383.b: "Accept the delay. The treasury comes first."
 thailand.384.t: "The Canal Is Ready"
 thailand.384.d: "The last lock gate is hung, the summit reach is flooded, and the pilots have run their first transits in ballast. The Kra Canal is complete in all but the ribbon-cutting. The Kingdom may now declare the megaproject finished."
 thailand.384.a: "Cut the ribbon and open the canal."
 thailand.385.t: "Sabotage at the Cut"
 thailand.385.d: "An explosion at a pumping station and a severed haul road bear the signature of the Deep South insurgency. The canal runs through contested ground, and the men who oppose Bangkok have found a target worth a headline. The project office wants a decision. Harden the works, or talk to the locals."
 thailand.385.a: "Reinforce security along the corridor."
 thailand.385.b: "Negotiate with local leaders. Buy peace, not just guards."
 thailand.386.t: "Beijing Calls the Loan"
 thailand.386.d: "The overruns have tripped a covenant in the Belt and Road agreement, and Beijing's negotiators have arrived in Bangkok with a folder of options, all of them favourable to China. The yuan-denominated debt has become a lever, and the canal itself is the collateral. The cabinet must choose how to answer the call."
 thailand.386.a: "Concede an operating lease and let Beijing take a share of the tolls."
 thailand.386.b: "Restructure on harsh terms. Pay it down and keep the canal Thai."
 thailand.386.c: "Default. The canal is ours, so let the markets do their worst."
 thailand.388.t: "Capital Flight"
 thailand.388.d: "The default has spooked the markets. Foreign investors are pulling out, the baht is sliding, and the central bank is spending reserves to slow the panic. The damage is severe, but a sovereign that stood its ground will weather it, given time."
 thailand.388.a: "Ride out the storm."
 thailand.389.t: "Washington and Delhi Take Note"
 thailand.389.d: "A Chinese operating lease over the Kra has rung alarm bells from Washington to New Delhi. Both capitals fear a chokepoint in Beijing's pocket, and both are watching to see whether Bangkok will reassure them, or lean further east."
 thailand.389.a: "Reassure both and spend the political capital to keep them onside."
 thailand.389.b: "Lean into Beijing. The partnership is set, so let the West adjust."
 thailand.390.t: "The Strait Loses Its Monopoly"
 thailand.390.d: "The first laden tankers are transiting the Kra, and the great ports of the Malacca Strait are counting the cost. Singapore and Kuala Lumpur, who built their fortunes on the old chokepoint, watch their transit revenue drain north, and they will not soon forgive the Kingdom that drained it."
 thailand.390.a: "Two oceans answer to Bangkok now."
 thailand.391.t: "What Kind of Canal?"
 thailand.391.d: "The canal is open, but what is it to be? A fortress the navy holds by force, closed to rivals and bristling with batteries? Or a neutral international passage, open to all flags and guaranteed by treaty? The choice will define Thailand's place among the maritime powers for a generation."
 thailand.391.a: "Fortify the Kra to defend and deny it."
 thailand.391.b: "Open the Kra to all who pay the toll in peace."
 thailand_news.20.t: "Two Oceans, One Kingdom"
 thailand_news.20.d: "After years of labour, billions of baht, and a geopolitics no engineer could have foreseen, the Kra Canal is open. For the first time, ships pass between the Andaman Sea and the Gulf of Thailand without rounding the Malay Peninsula. The map of Asian trade has been redrawn, and Bangkok holds the pen."
 thailand_news.20.a: "A canal a century in the making."
 thailand.392.t: "The Crossroads of ASEAN"
 thailand.392.d: "Thailand stands at the head of Southeast Asia, and the moment of decision has come. The Kingdom may extend its hand as protector, guaranteeing its neighbours, founding a pact built on consent, and leading ASEAN by trust. Or it may close that hand into a fist, remaking the region as a Thai dominion by force of arms. The path of partnership is open to any government. The path of mastery is reserved for a Kingdom that has already claimed the Greater Thailand mandate, or a populist nation roused to war. Which destiny shall Bangkok choose?"
 thailand.392.a: "Protector. We lead ASEAN by trust, not by the sword."
 thailand.392.b: "Rule as hegemon. The region will be Thai, by conquest if it must."
 thailand.392.c: "We lack the mandate for conquest. We will lead ASEAN as partners."
 SIA_hegemony_locked_tt: "The hegemon's road is closed to us. It demands the Greater Thailand mandate, won by reclaiming the lost territories, or a populist government roused to war with support above 50 percent. Lacking these, we take up the mantle of protector instead."
 thailand.393.t: "Pariah of the Region"
 thailand.393.d: "The mask is off. Bangkok's drive to subjugate its neighbours has stripped away every pretence of ASEAN leadership. The capitals of Southeast Asia recoil, and the wider world recalculates. Thailand is no longer the region's chair. It is the region's threat, and the diplomatic and economic walls are already going up."
 thailand.393.a: "Let them fear us. Empire was never won by friends."
 thailand.394.t: "Washington Condemns Bangkok"
 thailand.394.d: "The United States has issued a sharp condemnation of Thai aggression in Southeast Asia. Washington signals that it will stand with the threatened states of the region, weighing guarantees and pressing its partners to close ranks against the would-be hegemon. The American influence Bangkok once courted is draining away."
 thailand.394.a: "American disapproval will not stop the march."
 thailand.395.t: "Beijing's Open Hand"
 thailand.395.d: "Where Washington recoils, Beijing leans in. China sees in an isolated, aggressive Thailand a useful partner, a power that has burned its bridges to the West and the region, and now has nowhere else to turn. Bangkok's pariah status is Beijing's opportunity, and the open hand comes with strings the Kingdom can no longer afford to refuse."
 thailand.395.a: "If the East will have us, so be it."
 thailand.431.t: "An Invitation from Bangkok"
 thailand.431.d: "Thailand has extended a formal invitation to join its ASEAN Defense Community. The pact offers shared command, mutual security, and a united regional voice under Bangkok's leadership. Yet ASEAN has always guarded its independence, and to bind our fate to Thailand is no small step. The choice is ours to make freely, and ours to unmake if it no longer serves us."
 thailand.431.a: "We accept. Our security is stronger shared."
 thailand.431.b: "We decline. Our independence is not for trading."
 SIA_kra_fortress_threat: "Kra Canal Fortifications"
 SIA_kra_default_threat: "Thai Sovereign Default"
 SIA_kra_chokepoint_threat: "The Kra Chokepoint"
 SIA_asean_hegemon_threat: "Thai Bid for ASEAN Hegemony"
 thailand.410.t: "The Map of a Greater Kingdom"
 thailand.410.d: "The old maps are out again, the ones that show Lan Na, the Shan hills, the lost provinces of Cambodia and Laos and the Malay south as Thai by right. The Pan-Thai movement has a voice in the cabinet now, and it asks the question plainly. Shall the Kingdom proclaim its irredenta to the world, or pursue the same ends with a softer hand? Every great power is watching how Bangkok answers."
 thailand.410.a: "Proclaim it. These lands are Thai, and the world should know."
 thailand.410.b: "Quietly. We build the position without rattling the sabre."
 thailand.411.t: "One People, One Destiny"
 thailand.411.d: "The Pan-Thai idea is no longer a fringe romance of officers and historians. Rallies fill Sanam Luang, and the press carries the banners of a single Tai nation stretching from Yunnan to the Isthmus. The movement now has a public face, and the government chooses to give it one too."
 thailand.411.a: "Let the nation hear its own name."
 thailand.412.t: "Bamboo in the Wind"
 thailand.412.d: "Thailand bends but does not break. By refusing to choose between Washington and Beijing, Bangkok has kept both courting it, the bamboo diplomacy of old, practised with a modern hand. Both capitals send warm signals, and neither can afford to push the Kingdom into the other's arms."
 thailand.412.a: "We keep our options open, and our friends guessing."
 thailand.413.t: "The Fuel-Cycle Question"
 thailand.413.d: "Thailand's new reactors run on a sovereign fuel cycle, and a sovereign fuel cycle means enrichment, and enrichment means the line between civilian power and a weapons option grows thin. The IAEA wants enhanced safeguards, Washington wants assurances, and the region wants to know what Bangkok intends. There is no bomb programme on the books, but the capability is now within reach, and the Kingdom must decide how far to walk toward it."
 thailand.413.a: "Defy them. Sovereign enrichment is our right, hedge or otherwise."
 thailand.413.b: "Reassure them. Accept full safeguards and keep the trust."
 thailand.413.a_tooltip: "§RProliferation alarm.§! Thailand earns the named threat §YSovereign Enrichment Defiance§!, the United States turns sharply against Bangkok while India grows wary, and §RUS influence in Thailand falls by 15%§!."
 thailand.414.t: "The Guardians' Charter"
 thailand.414.d: "The constitution is rewritten so the watchmen need never sleep. Appointed councils, reserved powers, and a senate that answers to the barracks. The deep state is no longer an informal habit but a written guarantee. Order is assured, and the price is paid in the quiet death of unfettered politics."
 thailand.414.a: "Stability, made permanent."
 SIA_guardianship_cost_tt: "§RTreasury −20§! and §RWestern condemnation§! (United States and United Kingdom opinion fall), as the international community recoils from the permanent entrenchment of the guardians."
 thailand.415.t: "Pax Aseana"
 thailand.415.d: "From Manila to Jakarta, from Hanoi to Singapore, the capitals of Southeast Asia raise their glasses to Bangkok. Where once they feared a Thai bid for mastery, they now see a guarantor, a Kingdom that leads by trust, founds its pact on consent, and keeps the peace it promised. This is the Pax Aseana, and Thailand sits at its head not as a conqueror but as a partner."
 thailand.415.a: "A region at peace, and Thailand its keystone."
 thailand.416.t: "After the General"
 thailand.416.d: "The general has his premiership, his honeymoon, and his managed transition to navigate. The establishment can entrench itself further by packing the institutions and tightening the party's grip on the machinery of state, or it can read the room, institutionalise its gains, and step back into a more civilian-facing posture before the public patience runs out."
 thailand.416.a: "Entrench. The establishment tightens its hold."
 thailand.416.b: "Institutionalise. Consolidate the gains, soften the face."
 thailand.417.t: "The Eastern Engine Turns Over"
 thailand.417.d: "The cranes along the Eastern Seaboard never stop. New rail, new runways, new industrial parks. The Eastern Economic Corridor has reached take-off, and the investment is beginning to compound on itself. Chonburi, Rayong and Chachoengsao are becoming the engine room of the Thai economy."
 thailand.417.a: "The corridor hums to life."
 SIA_nuclear_defiance_threat: "Sovereign Enrichment Defiance"
 thailand.72.t: "The Boxing Day Tsunami"
 thailand.72.d: "The sea drew back along the Andaman coast on the morning of 26 December, and the curious walked out onto the bared seabed to look. Minutes later the water returned at the height of a building. Khao Lak, Phi Phi and the Phuket beaches are gone. The dead number in the thousands, foreign and Thai alike, and the King's grandson is among them. The world's aid is already inbound. The kingdom must decide how it will rebuild."
 thailand.72.a: "Marshal the state and rebuild the coast ourselves."
 thailand.72.b: "Let the palace and foreign donors lead."
 thailand.72.c: "Build a warning system and never be caught again."
 SIA_tsunami_warning: "Tsunami Warning Network"
 thailand.363.t: "The Productivity Trap"
 thailand.363.d: "The growth years are over. A generation left university into a stalled economy of stagnant wages, factory work shipped abroad, and a property market they will never enter. They are the best-educated cohort in Thai history and they are going nowhere, and they know exactly whom to blame. Bangkok's intersections fill with three-finger salutes, and the hashtags trend faster than the police can read them. Move Forward speaks their language. The slow comfortable politics of the past will not hold them."
 thailand.363.a: "Open the system. Concede the reform, let the new politics breathe."
 thailand.363.b: "Order first. Clear the streets and change the subject to the nation."
 thailand.363.c: "Buy time with growth. Pivot to stimulus and ease the squeeze."
 thailand.364.t: "Two Thailands"
 thailand.364.d: "There are two countries inside the kingdom. One is Bangkok and the provincial capitals, the graduates, the office towers, the cafés where reform is a foregone conclusion. The other is the rice belt and the north-east, where the populists built their machine on village funds and rice subsidies and never let go. They want different things, fear different futures, and vote for different parties. A government must choose where it plants its flag, or pretend it can stand above the line entirely."
 thailand.364.a: "Court the capital and the graduates, Thailand's urban future."
 thailand.364.b: "Court the rice belt, the up-country base that delivers."
 thailand.364.c: "Stand above the divide. Only the throne unites the two Thailands."
 thailand.365.t: "The Crackdown's Echo"
 thailand.365.d: "Clearing the streets did not clear the grievance. It sharpened it. The movement that scattered has regrouped, larger and angrier, its leaders now martyrs and its demands now non-negotiable. What was a protest is becoming a generation's defining cause, and every baton swung last year recruited ten more this year."
 thailand.365.a: "There is no putting this back. Ride out the storm."
 thailand.418.t: "The Jungle Stirs"
 thailand.418.d: "The misery has gone on too long. In the up-country districts the state forgot, old names surface again. Cadres who carried rifles for the Communist Party of Thailand before the amnesty, now grey but not forgotten, and a generation of their grandchildren with nothing left to lose. Study circles meet by lamplight, and the red flag, folded away for forty years, is being shaken out. The jungle that swallowed the last insurgency is still there. So is the grievance that filled it."
 thailand.418.a: "Let the cells organize. The countryside is ours to lose."
 thailand.418.b: "Crush the underground. Round up the cadres before this spreads."
 thailand.418.c: "Drain the swamp of grievance. Pour money into the districts."
 thailand.74.t: "The Assets Case"
 thailand.74.d: "The Constitutional Court weighs whether the Prime Minister concealed share holdings behind his housemaid, driver and security guard. A guilty verdict ends the premiership before it begins. The judges are split, and the palace, the press and the generals are all watching how the verdict is reached."
 thailand.74.a: "Lean on the bench. The verdict will go our way."
 thailand.74.b: "Submit to the process and let the court decide."
 thailand.75.t: "Tak Bai"
 thailand.75.d: "In the Muslim deep south, soldiers stack hundreds of bound protesters into army trucks. By the time the convoy arrives, eighty-five are dead, most of them suffocated. The footage circles the world. The officer corps closes ranks around its own, and the question is whether the civilian government will dare to ask what happened."
 thailand.75.a: "Stand behind the army. No inquiry."
 thailand.75.b: "Order an inquiry. The army answers to us."
 thailand.76.t: "The CTX Scanners"
 thailand.76.d: "The bill for the new airport's bomb-detection scanners has tripled, and the markup has vanished into a chain of middlemen close to the cabinet. An honest audit would embarrass the government. Burying it banks the difference but feeds the gathering story of a administration that treats the treasury as a family account."
 thailand.76.a: "Bury the audit and bank the difference."
 thailand.76.b: "Cancel the contract and cut the losses."
 thailand.77.t: "Silencing the Critics"
 thailand.77.d: "A media mogul's nightly broadcasts have become a rallying point for the anti-government street, and the independent broadcaster iTV is slipping the leash. Defamation suits, licence pressure and friendly ownership could bring them to heel, at the price of confirming everything the critics say about creeping one-man rule."
 thailand.77.a: "Bring the press to heel."
 thailand.77.b: "Let the press run and answer words with words."
 thailand.78.t: "A Parliament of One"
 thailand.78.d: "The ruling party has won an outright majority, the first single-party government in Thai history. With no coalition to manage and the independent agencies packed with loyalists, the Prime Minister can govern unchecked. To the rice belt it is a mandate, and to the Bangkok establishment and the barracks it is an elective dictatorship in the making."
 thailand.78.a: "Govern unchecked. The people gave us this."
 thailand.78.b: "Court the opposition and share the table."
 thailand.73.t: "The Shin Corp Sale"
 thailand.73.d: "The Prime Minister's family sells its telecoms empire to a Singaporean state fund for some seventy-three billion baht, and, through a convenient restructuring, pays not a satang in tax. The legality is impeccable, but the optics are catastrophic. Within days the yellow-shirted crowds fill the avenues, and the army begins to ask aloud whether the constitution still binds the man who sold a national asset tax-free."
 thailand.73.a: "Pocket the billions. It was all legal."
 thailand.73.b: "Pay the tax and defuse the fury."
 thailand.420.t: "A Populist Mandate"
 thailand.420.d: "Power has passed to the populist camp. The rice belt and the urban poor have their government again, and with it the Thaksinist programme of village funds, cheap healthcare, and a leader who speaks their language. The old establishment's spirits no longer hold, and the palace network and the reform caucus melt away as the new machine takes the levers. The barracks, as ever, are watching."
 thailand.420.a: "The countryside has its government."
 thailand.421.t: "The Establishment Returns"
 thailand.421.d: "The levers have passed to the royalist establishment, whether by ballot, palace bargain or the tanks at dawn. The network monarchy reasserts itself. The privy councillors, the generals and the great houses close around the throne. The populist machine's spirits dissolve along with its mandate, and the reform movement is swept from the table. The realm steadies under familiar hands."
 thailand.421.a: "The realm is in order."
 thailand.422.t: "The Reform Wave"
 thailand.422.d: "A new generation has taken power. The reform movement that marched in the streets now sits in the cabinet, and the agenda turns to dismantling the old order, the conscription, the monopolies, the untouchable institutions. The previous government's spirits fade as its leaders fall away. The question is whether the establishment will let the experiment run."
 thailand.422.a: "The future is now."
 thailand.423.t: "The Court Decides"
 thailand.423.d: "The Constitutional Court has the ruling party in its sights. A dissolution order is drafted and the executive could be unseated by judicial fiat, as so many before it. The government can bow to the verdict and hand power to its rivals, or defy the bench and dare the consequences."
 thailand.423.a: "Accept the verdict and step aside with grace."
 thailand.423.b: "Defy the court. We answer to the voters, not the judges."
 thailand.424.t: "The Democrats Endure"
 thailand.424.d: "Power has returned to the Democrat Party, the oldest in the Kingdom, whether by a turn at the ballot box or a court that handed the executive to the opposition. No landslide, no charismatic billionaire, just the patient, unglamorous business of governing as a broad civilian coalition, staking the future on institutions rather than a single leader. The previous government's spirits dissolve along with its mandate. And out in the rice belt, Thaksin's machine is already gathering its strength for the next round."
 thailand.424.a: "The establishment holds the line."
 thailand.430.t: "What Are the Bombs For?"
 thailand.430.d: "The first Thai warheads are real, but a weapon undeclared deters no one. The National Security Council must settle the question every nuclear state must answer. Under what circumstances would the Kingdom ever use them? The posture we declare will shape how the region, and the great powers, read our intentions."
 thailand.430.a: "Retaliation only. We strike only if struck with strategic weapons."
 thailand.430.b: "Tactical and strategic retaliation. We answer any nuclear attack in kind."
 thailand.430.c: "Declared first-use. Let our enemies wonder, and let them fear."
 thailand_news.30.t: "Thailand Joins the Nuclear Club"
 thailand_news.30.d: "Bangkok has confirmed what intelligence services had whispered for months. The Kingdom of Thailand possesses nuclear weapons. Capitals across Asia and beyond scramble to recalculate the balance of power as a new entrant crosses the threshold."
 thailand_news.30.a: "The map has changed."
 SIA_threat_thai_bomb: "Thailand's nuclear weapons programme"
 SIA_threat_thai_first_use: "Thailand's declared first-use posture"
 thailand.432.t: "The Strategy Cannot Wait"
 thailand.432.d: "The workshop years made Thailand rich enough to stall, and the ministries have argued over the escape plan for too long. The frontier is not waiting, and Vietnam is closing the gap. The National Strategy has to be adopted now."
 thailand.432.a: "Adopt it by decree"
 thailand.432.b: "Build consensus first"
 thailand.433.t: "A Shield from the North"
 thailand.433.d: "Bangkok has asked Beijing to extend a formal guarantee over the Kingdom. A Chinese pledge would anchor Thailand's tilt toward the mainland and warn off any rival tempted to test its borders. The price is a standing commitment far from home."
 thailand.433.a: "Extend our protection"
 thailand.433.b: "Bangkok can stand alone"
 SIA_imf_program: "IMF Standby Arrangement"
 SIA_imf_program_desc: "The $17.2 billion IMF-led rescue package keeps Thailand solvent, but only under conditions. Fiscal discipline is enforced from Washington until the obligations are repaid."
 SIA_regional_pariah: "Regional Pariah"
 SIA_regional_pariah_desc: "Bangkok swallowed the Burmese marches whole. Washington and Beijing condemn the land grab, ASEAN's capitals eye their own borders nervously, and Thai exporters pay for the kingdom's tarnished name in every contract abroad."
 SIA_frontier_partners: "Frontier Partners"
 SIA_frontier_partners_desc: "The recovered borderlands are governed through clients and compacts rather than occupation. Soft power is cheaper than garrisons. Administration runs lean and the construction crews move freely, with none of the diplomatic backlash annexation would have brought."
 SIA_kings_moral_authority: "The King's Moral Authority"
 SIA_kings_moral_authority_desc: "Seven decades on the throne have given the monarch a moral standing no politician approaches. In moments of crisis, a word from the palace has settled what armies could not."
 SIA_royal_guidance_idea: "Under the Royal Gaze"
 SIA_royal_guidance_idea_desc: "The palace's annual guidance steadies the kingdom and walls it off from foreign meddling, but an elected government that defers to the throne finds its own writ runs only so far."
 SIA_three_pillars_idea: "Nation, Religion, King"
 SIA_three_pillars_idea_desc: "Official nationalism welded to the throne and the Sangha. The Buddhist majority is bound tight against subversion and foreign ideas, at the price of a duller, more deferential public mind."
 SIA_deep_south_grievance: "Grievance in the South"
 SIA_deep_south_grievance_desc: "In the Malay-Muslim provinces, a Buddhist-Royalist creed lands as exclusion. Patani's grievances harden, and Bangkok pays in stability and political capital to keep the lid on."
 SIA_scarred_coast: "The Scarred Coast"
 SIA_scarred_coast_desc: "Without state money behind the rebuild, the Andaman resorts stand half-ruined for years. The hotels are quiet, the rubble uncleared, and the tourists go elsewhere."
 SIA_new_reign_mourning: "A Kingdom in Mourning"
 SIA_new_reign_mourning_desc: "The nation mourns the late King. Public life is subdued, entertainment suspended, and politics observes an uneasy truce."
 SIA_ninth_reign_barami: "Barami of the Ninth Reign"
 SIA_ninth_reign_barami_desc: "King Bhumibol has reigned for over half a century, longer than any monarch on earth. His barami, the moral authority earned across those decades, stands above every politician and general. In a moment of crisis a word from the palace settles what no cabinet can, and the throne shields the kingdom from foreign designs."
 SIA_ninth_reign_zenith: "The Network Monarchy Ascendant"
 SIA_ninth_reign_zenith_desc: "The palace no longer merely reigns. Through the Privy Council, the courts, and a web of loyal officers and businessmen, the Crown reaches into every institution of state. The King's word carries the weight of law, dissent finds no purchase, and foreign influence breaks against a wall of royalist consensus."
 SIA_tenth_reign_barami: "Barami of the Tenth Reign"
 SIA_tenth_reign_barami_desc: "The throne has passed to King Vajiralongkorn, but reverence is not inherited. The new monarch holds the office his father held without the moral authority that once filled it. The palace still steadies the realm and guards against foreign meddling, yet every lever is a fainter echo of the Ninth Reign."
 SIA_two_thailands: "Two Thailands"
 SIA_two_thailands_desc: "There are two countries inside one border. Bangkok and the central plains hold the wealth, the ministries, and the old establishment. The rural North and Northeast hold the votes and a hardening conviction that their ballots are stolen by courts and coups. The gulf between them polarises every election and forces the treasury to buy a peace it can barely afford."
 SIA_three_pillars_start: "Nation, Religion, King"
 SIA_three_pillars_start_desc: "$SIA_three_pillars_idea_desc$"
 SIA_detroit_of_asia_start: "Detroit of Asia"
 SIA_detroit_of_asia_start_desc: "$SIA_detroit_of_asia_idea_desc$"
 SIA_rice_bowl_start: "World's Rice Bowl"
 SIA_rice_bowl_start_desc: "$SIA_worlds_rice_bowl_desc$"
 SIA_populist_machine: "The Populist Machine"
 SIA_populist_machine_desc: "Village funds, healthcare cards, debt relief. A policy machine that converts government delivery into electoral loyalty, cycle after cycle."
 SIA_yellow_shirts_idea: "The Yellow Shirts"
 SIA_yellow_shirts_idea_desc: "The People's Alliance for Democracy is royalist, urban, middle-class, and convinced the electoral majority is being bought. When they fill the streets, governments wobble."
 SIA_red_shirts_idea: "The Red Shirts"
 SIA_red_shirts_idea_desc: "The United Front for Democracy Against Dictatorship is rural, northern, northeastern, and convinced their votes are being stolen by courts and coups. They are the majority, and they know it."
 SIA_junta_government: "Junta Government"
 SIA_junta_government_desc: "A military council governs by decree. Order is enforced, dissent is 'adjusted', and the question of when elections return is answered with a smile and a postponement."
 SIA_guided_democracy: "The 2017 System"
 SIA_guided_democracy_desc: "An appointed Senate, a binding twenty-year strategy, and courts of reliable disposition. Elections are held, but the field is fenced."
 SIA_network_monarchy_idea: "Network Monarchy"
 SIA_network_monarchy_idea_desc: "Palace, privy council, army and judiciary form an informal web of authority that operates above electoral politics, and outlasts every government."
 SIA_reform_momentum: "Reform Momentum"
 SIA_reform_momentum_desc: "For the first time in a generation, the energy in Thai politics is with those who want to change the system, not manage it."
 SIA_consolidated_democracy_idea: "A Consolidated Democracy"
 SIA_consolidated_democracy_idea_desc: "Civilian control, constitutional government, and a public that expects coups to be history. Thailand's democratic institutions finally stand on their own foundations."
 SIA_republic_turmoil: "Constitutional Turmoil"
 SIA_republic_turmoil_desc: "The republic question has split every institution, every province and many families. The state endures, but the consensus underneath it is gone."
 SIA_pan_thai_irredentism: "Pan-Thai Irredentism"
 SIA_pan_thai_irredentism_desc: "The lost-territories narrative is state doctrine again. The Tai peoples are one nation, the 1893-1909 cessions are illegitimate, and history owes Thailand a correction."
 SIA_sufficiency_economy_idea: "Sufficiency Economy Philosophy"
 SIA_sufficiency_economy_idea_desc: "The royal development philosophy of moderation and resilience guides economic policy. Grow carefully, borrow less, and build immunity against the next shock."
 SIA_drug_war_stain: "International Censure"
 SIA_drug_war_stain_desc: "Thousands of extrajudicial killings during the drug war follow Thailand into every human-rights forum and every diplomatic negotiation."
 SIA_tourism_powerhouse: "Tourism Powerhouse"
 SIA_tourism_powerhouse_desc: "Tens of millions of visitors a year make tourism a pillar of the economy and the Thai brand a global asset."
 SIA_amazing_thailand_idea: "Amazing Thailand"
 SIA_amazing_thailand_idea_desc: "The \"Amazing Thailand\" campaign has turned the kingdom into a year-round destination, widening the formal service economy and the corporate tax base that comes with it. The investment climate it advertises also makes Thailand a cheaper, friendlier target for inbound foreign capital."
 SIA.Nat_Fascism: "£SIA_Nat_Autocracy (PPT) Pan-Thai People's Party"
 SIA.Nat_Fascism_desc: "An ultranationalist movement reviving the Phibun-era dream of gathering all Tai peoples under one flag. (A fictional party for the ahistorical Greater Thailand path.)"
 SIA.Nat_Fascism_icon: "£SIA_Nat_Autocracy"
 SIA_thaksinomics_idea: "Thaksinomics"
 SIA_thaksinomics_idea_desc: "Dual-track economics. Pump credit into the villages while courting big business in Bangkok. Growth is real and so is the smell of money around the cabinet table."
 SIA_30_baht_scheme: "30-Baht Healthcare"
 SIA_30_baht_scheme_desc: "Any illness, any hospital, thirty baht. The most popular policy in modern Thai history strains every provincial hospital that delivers it, and wins every village that uses it."
 SIA_village_fund_idea: "One Million Baht Village Fund"
 SIA_village_fund_idea_desc: "A revolving million-baht microcredit fund in each of 78,000 villages. Rural incomes climb, roads and rice mills appear, and so, quietly, does household debt."
 SIA_detroit_of_asia_idea: "Detroit of Asia"
 SIA_detroit_of_asia_idea_desc: "The Eastern Seaboard assembles pickups for the world. Automotive supply chains anchor Thai manufacturing and keep the export ledger healthy."
 SIA_eec_development: "Eastern Economic Corridor"
 SIA_eec_development_desc: "Chonburi, Rayong and Chachoengsao are designated the proving ground for Thailand 4.0. EVs, aerospace, robotics, medical industry and the infrastructure to carry them."
 SIA_medical_hub_idea: "Medical Hub of Asia"
 SIA_medical_hub_idea_desc: "World-class hospitals at regional prices draw patients from every continent. The foreign wards subsidise the system, and compete with it for doctors."
 SIA_bamboo_diplomacy: "Bamboo Diplomacy"
 SIA_bamboo_diplomacy_desc: "Bend with the wind, never break. Bangkok keeps the American alliance, the Chinese investment, and its own counsel, all at the same time."
 SIA_gripen_air_force_idea: "Gripen Ecosystem"
 SIA_gripen_air_force_idea_desc: "Saab fighters, Erieye early warning and a datalinked air-combat ecosystem give the Royal Thai Air Force a qualitative edge few neighbours can match."
 SIA_chinese_armor_deal: "Chinese Armor Acquisitions"
 SIA_chinese_armor_deal_desc: "VT-4 main battle tanks and VN-1 fighting vehicles from NORINCO. Modern, affordable, delivered without lectures, and binding the army's supply lines eastward."
 SIA_israeli_drone_integration: "Israeli Drone Integration"
 SIA_israeli_drone_integration_desc: "Elbit and Aeronautics unmanned systems give Thai commanders persistent eyes over border, jungle and sea lanes."
 SIA_modernized_rta: "Modernized Royal Thai Army"
 SIA_modernized_rta_desc: "Professional NCOs, digitised command and refitted brigades. The Royal Thai Army shifts its weight from politics to soldiering."
 SIA_blue_water_navy_idea: "Blue-Water Ambitions"
 SIA_blue_water_navy_idea_desc: "Frigates, submarines and a carrier flagship. The Royal Thai Navy intends to be felt beyond the Gulf of Thailand."
 SIA_chakri_uxv_carrier: "HTMS Chakri Naruebet, UXV Carrier"
 SIA_chakri_uxv_carrier_desc: "The once-idle flagship is reborn as a drone carrier. Unmanned aircraft, surface vessels and submersibles operate from the ski-jump deck that Harriers left behind."
 SIA_s26t_submarine_force: "The S26T Submarine Arm"
 SIA_s26t_submarine_force_desc: "Yuan-class boats from China, late, license-bound and dependent on Beijing for parts, but the first true submarines the Gulf has seen. A long-range raiding force, on someone else's leash."
 SIA_deep_south_insurgency: "Southern Insurgency"
 SIA_deep_south_insurgency_desc: "An armed separatist insurgency in the Malay-Muslim provinces of Pattani, Yala and Narathiwat. Its intensity rises and falls with the government's choices of force, development, or dialogue."
 SIA_war_on_drugs_campaign: "War on Drugs"
 SIA_war_on_drugs_campaign_desc: "Blacklists, quotas and shoot-to-kill ambiguity. The methamphetamine trade is in retreat, and so is the rule of law."
 SIA_coup_rumblings_idea: "Rumblings in the Barracks"
 SIA_coup_rumblings_idea_desc: "Unusual troop rotations, pointed silences from retired generals, and dinner parties the prime minister was not invited to. Everyone in Bangkok can read the signs."
 SIA_eec_development_1: "Eastern Economic Corridor"
 SIA_eec_development_1_desc: "$SIA_eec_development_desc$"
 SIA_eec_development_2: "Eastern Economic Corridor"
 SIA_eec_development_2_desc: "$SIA_eec_development_desc$"
 SIA_eec_development_3: "Eastern Economic Corridor"
 SIA_eec_development_3_desc: "$SIA_eec_development_desc$"
 SIA_gripen_air_force_1: "Gripen Ecosystem"
 SIA_gripen_air_force_1_desc: "$SIA_gripen_air_force_idea_desc$"
 SIA_gripen_air_force_2: "Gripen Ecosystem"
 SIA_gripen_air_force_2_desc: "$SIA_gripen_air_force_idea_desc$"
 SIA_deep_south_insurgency_1: "Southern Insurgency"
 SIA_deep_south_insurgency_1_desc: "$SIA_deep_south_insurgency_desc$"
 SIA_deep_south_insurgency_2: "Southern Insurgency"
 SIA_deep_south_insurgency_2_desc: "$SIA_deep_south_insurgency_desc$"
 SIA_deep_south_insurgency_3: "Southern Insurgency"
 SIA_deep_south_insurgency_3_desc: "$SIA_deep_south_insurgency_desc$"
 SIA_pacified_but_smoldering: "Pacified but Smoldering"
 SIA_pacified_but_smoldering_desc: "The Iron Fist worked. By the only measure the army accepts, the South is quiet. But a generation grew up under curfew and checkpoint, and the grievance has gone underground rather than away. The occasional incident still flares, and the wells of recruitment are not dry."
 SIA_royal_pacification: "Royal Pacification"
 SIA_royal_pacification_desc: "A managed, monitored calm held by patronage and presence under the royal aegis. Development flows, local notables are co-opted, and the monarchy's legitimacy in the South is quietly restored. Not a settlement, but a stewardship."
 SIA_pattani_autonomy: "Pattani Autonomy"
 SIA_pattani_autonomy_desc: "A self-governing special administration within a unitary Thailand, with an elected regional council, local-language schooling, and a share of southern revenue retained in the South. The peace dividend is real, and the precedent unsettles Bangkok's centralists."
 SIA_limited_devolution: "Limited Devolution"
 SIA_limited_devolution_desc: "The autonomy framework was watered down to placate the establishment. A measure of local administration, but no genuine self-rule. The guns are quiet for now, yet the settlement leaves both the South and the centre dissatisfied."
 SIA_hearts_minds_education_strain: "Hearts & Minds Programme"
 SIA_hearts_minds_education_strain_desc: "Malay-language schooling, religious outreach and village mediation are run out of the education budget. The incident map gets quieter, but the schools system carries the bill. A standing §R+5% education cost§! while the programme runs."
 SIA_southern_development_levy: "Southern Development Levy"
 SIA_southern_development_levy_desc: "The development push in the three provinces crowds civilian industry onto consumer output. A standing §R+5% consumer goods§! for a year while the money flows south."
 SIA_peoples_constitution: "People's Constitution"
 SIA_peoples_constitution_desc: "A new basic law written with broad civic participation enshrines rights, civilian oversight of the military, and independent institutions, restoring public trust in the constitutional order."
 SIA_debt_free_credibility: "Debt-Free Credibility"
 SIA_debt_free_credibility_desc: "Thailand's sovereign debt has been retired ahead of schedule. Clean balance sheets open credit lines, attract investment grade ratings, and give Bangkok rare fiscal latitude in the region."
 SIA_worlds_rice_bowl: "World's Rice Bowl"
 SIA_worlds_rice_bowl_desc: "Thai Hom Mali and Jasmine rice command premium prices on every continent. Agricultural export revenues anchor the current account, and every harvest season re-establishes Bangkok's diplomatic weight."
 SIA_aviation_hub: "Aviation Hub"
 SIA_aviation_hub_desc: "Suvarnabhumi and Don Mueang together handle more passengers than any hub in Southeast Asia outside Singapore. Air connectivity multiplies trade routes and gives Thai business instant reach to any market."
 SIA_cobra_gold: "Cobra Gold"
 SIA_cobra_gold_desc: "The largest multinational military exercise in Asia, hosted annually by Thailand, brings U.S., Japanese, South Korean, Indonesian and other forces to Thai soil, and upgrades every Thai unit that participates."
 SIA_bri_debt: "BRI Debt Exposure"
 SIA_bri_debt_desc: "Belt-and-Road infrastructure loans fill gaps the budget cannot, but the repayment terms are written in Beijing. Thailand's fiscal sovereignty shrinks with each signed agreement."
 SIA_landslide_mandate: "Mandate of the People"
 SIA_landslide_mandate_desc: "A landslide victory has given the government a genuine popular mandate. The party machine is energized, the rural base mobilized, and the opposition on the back foot, but the generals are watching the numbers very carefully."
 SIA_ceo_state: "CEO State"
 SIA_ceo_state_desc: "The cabinet has become a boardroom and the ministries a holding company. Decisions move fast and accountability moves slower. The checks and balances are not gone. They are just being restructured."
 SIA_cult_of_the_ceo: "Cult of the CEO"
 SIA_cult_of_the_ceo_desc: "The premier has dispensed with the theatre of consultation. His approval ratings are a weapon, his critics are obstacles, and the party's internal procedures are whatever he says they are this week. The royal network is meeting rather more frequently than usual."
 SIA_dynasty_politics: "Dynasty Politics"
 SIA_dynasty_politics_desc: "The Shinawatra name is now a dynasty, a brand, a patronage network, and a succession plan folded into a single family. Loyalty to the party and loyalty to the family have become indistinguishable."
 SIA_institutionalized_party: "Institutionalized Party"
 SIA_institutionalized_party_desc: "The movement has survived exile, two coups, and seventeen party dissolutions. It has become something more durable than any single leader, a genuine political institution with roots in every province."
 SIA_privy_council_idea: "Privy Council Network"
 SIA_privy_council_idea_desc: "General Prem Tinsulanonda's decades of alliance-building have produced a network that spans the senior military, the judiciary and the civil service. Its members receive no salary from the network. They do not need one."
 SIA_royal_thai_armed_forces_ascendant: "Royal Thai Armed Forces Ascendant"
 SIA_royal_thai_armed_forces_ascendant_desc: "The 2006 coup has put soldiers at the center of the state's budget negotiations, cabinet formation and strategic direction. Defense spending rises, and the soldiers learn the value of professionalism, and the leverage it brings."
 SIA_judicialization: "Politics of the Courtroom"
 SIA_judicialization_desc: "The Constitutional Court has become a political actor in its own right. Every petition is a weapon, and every ruling a victory for one faction and a wound to another. The opposition studies law to survive."
 SIA_isoc_network: "ISOC Network"
 SIA_isoc_network_desc: "The Internal Security Operations Command threads through every province, reporting to the army rather than elected ministers. Its intelligence grid makes the state's reach invisible, ubiquitous, and remarkably effective."
 SIA_crown_property_idea: "Crown Property Bureau"
 SIA_crown_property_idea_desc: "The palace's commercial arm holds stakes in land, banking, and insurance worth hundreds of billions of baht. The absolute monarchy is over. The economic monarchy is doing very well."
 SIA_lese_majeste_idea: "Lèse-Majesté Enforcement"
 SIA_lese_majeste_idea_desc: "Section 112 is enforced with unusual vigor. Dissenting voices, online and off, face charges that carry up to fifteen years. The political temperature outside the courtrooms rises accordingly."
 SIA_uncle_tu_honeymoon: "The Prayuth Honeymoon"
 SIA_uncle_tu_honeymoon_desc: "Order restored, the PDRC off the streets, and a government with a twenty-year plan. For now, the public appetite for stability gives the new premier an unusual degree of tolerance."
 SIA_uncle_tu_fatigue: "Prayuth Fatigue"
 SIA_uncle_tu_fatigue_desc: "The prime minister who promised to make politics boring has succeeded, in the wrong way. The reform agenda is stalled, the promised election perpetually postponed, and younger Thais have begun to ask when exactly 'temporary' was supposed to end."
 SIA_reform_spring: "Reform Spring"
 SIA_reform_spring_desc: "A wave of civic energy has swept into the reform movement. New faces, new demands, and a mood on the streets that careers older politicians have not seen in a generation. The establishment is taking notice, not always pleasantly."
 SIA_youthquake: "Youthquake"
 SIA_youthquake_desc: "University campuses, social media feeds and street corners are crackling with political energy. Young Thais who have never voted are now running for office, staffing party offices, and raising money online. The technocrats in formation are better-educated than any generation before them."
 SIA_barracks_pushback: "Barracks Pushback"
 SIA_barracks_pushback_desc: "Senior officers have made clear, through retired intermediaries, pointed silences and barbed press briefings, that the pace of civilian reform is testing the military's institutional patience. The army still controls its own promotions, budgets and base assignments."
 SIA_civilian_supremacy: "Civilian Supremacy"
 SIA_civilian_supremacy_desc: "Defence procurement, promotion lists, base assignments, and rules of engagement now flow through the elected cabinet and an empowered civilian defence ministry. The Constitutional Court has upheld the framework. The coups are done."
 SIA_open_society: "Open Society"
 SIA_open_society_desc: "Section 112's reform has removed the institutional ceiling on political speech. International scholars come to study, foreign investors follow their analysts' recommendations, and Thai academics are publishing things that would have ended careers five years ago."
 SIA_pride_of_asia: "Pride of Asia"
 SIA_pride_of_asia_desc: "Thailand has become a regional standard-bearer for marriage equality and LGBTQ+ rights. Talent migration from neighbouring countries, software engineers, artists, doctors, has begun to register in population statistics."
 SIA_thai_welfare_state: "Thai Welfare State"
 SIA_thai_welfare_state_desc: "Universal healthcare, subsidized higher education, and a contributory pension system assembled over a decade now form a genuine social floor. The fiscal cost is real, and so is the political loyalty of a workforce that no longer fears catastrophic illness or old age."
 SIA_egovernment: "E-Government"
 SIA_egovernment_desc: "Tax filings, land titling, business registration, court records, and welfare claims processed through a single interoperable government platform. The queue culture that once defined Thai bureaucracy is being replaced by dashboards and APIs."
 SIA_soft_power_wave: "Soft Power Wave"
 SIA_soft_power_wave_desc: "Thai cuisine, T-pop, wellness tourism, and film exports have made 'Brand Thailand' a genuine cultural force from Tokyo to London. Foreign visitors come for the food and stay for the aesthetic. The creative industries bill the culture ministry nothing."
 SIA_reckoned_past: "Reckoned Past"
 SIA_reckoned_past_desc: "A truth-and-reconciliation process has acknowledged the state violence of the drug war, the coups, and the counterinsurgency. The official record has been amended. Compensation has been paid. Thailand enters its next era without the weight of official denial."
 SIA_thai_republic: "Thai Republic"
 SIA_thai_republic_desc: "The world's longest-surviving constitutional monarchy has made its transformation. A directly elected president, a fully sovereign parliament, and a constitution written without military veto. The change was not bloodless, but it held."
 SIA_professional_forces_idea: "Professional Forces"
 SIA_professional_forces_idea_desc: "A professionalised NCO corps, digitised command infrastructure, and a renewed emphasis on individual training and unit cohesion have elevated the Royal Thai Armed Forces from a largely ceremonial posture to a genuine regional military. The reforms deepen as doctrine matures."
 SIA_professional_forces: "Professional Forces"
 SIA_professional_forces_desc: "A professionalised NCO corps, digitised command infrastructure, and a renewed emphasis on individual training and unit cohesion have elevated the Royal Thai Armed Forces from a largely ceremonial posture to a genuine regional military."
 SIA_professional_forces_2: "Professional Forces"
 SIA_professional_forces_2_desc: "The officer-corps reform has taken hold. A merit-driven promotion ladder, standardised staff procedures, and a training establishment that turns out competent junior leaders rather than coup conspirators."
 SIA_professional_forces_3: "Professional Forces"
 SIA_professional_forces_3_desc: "A fully joint, professional force. Army, navy, and air staffs plan together, command authority flows down a clear chain, and the Royal Thai Armed Forces stand as the most capable military in mainland Southeast Asia."
 SIA_joint_force_command_idea: "Joint Force Command"
 SIA_joint_force_command_idea_desc: "A standing tri-service headquarters now plans and commands across the army, navy, and air force. Operational tempo rises, command friction falls, and Thailand can finally fight as a single instrument rather than three rival fiefdoms."
 SIA_total_defense_idea: "A Nation in Arms"
 SIA_total_defense_idea_desc: "Total-defence planning binds the civil population, the reserves, and the standing forces into one resilient whole. Conscription is broadened, civil-defence drills are routine, and the home front is hardened against subversion and shock alike."
 SIA_martial_glory: "Martial Glory"
 SIA_martial_glory_desc: "The Victory Monument parade has reminded the public, and the armed forces themselves, that Thailand's military tradition runs deeper than palace coups. War support runs high, and units compete for the honour of leading the column."
 SIA_open_markets: "Open Markets"
 SIA_open_markets_desc: "The break-up of conglomerate monopolies and the auction of telecoms spectrum have injected real competition into the economy. Consumer prices fall, new entrants arrive, and the finance ministry watches the auction revenues with quiet satisfaction."
 SIA_mandate_recovery: "Mandate of Recovery"
 SIA_mandate_recovery_desc: "The government has declared economic reconstruction its first priority. Consumer costs are compressed and building programmes accelerated. Every baht of productive investment carries the government's full backing for the next two years."
 SIA_mandate_order: "Mandate of Order"
 SIA_mandate_order_desc: "The government's opening play is stabilisation before reform. Institutions reinforced, courts respected, and political drift suppressed. The gamble is that order, delivered convincingly, earns the trust reform later requires."
 SIA_mandate_outreach: "Mandate of Outreach"
 SIA_mandate_outreach_desc: "Diplomacy and trade are the government's announced priorities. Embassies are fully staffed, ministerial delegations frequent, and the Trade Ministry has been given an expanded budget and a direct line to the PM's diary."
 SIA_coup_proofed: "Coup-Proofed"
 SIA_coup_proofed_desc: "The government survived the generals' move, and learned from it. Promotions have been adjusted, intelligence contacts diversified, and the party's street organisation is on permanent watch. The barracks know the government is paying attention now."
 SIA_uneasy_compromise: "An Uneasy Compromise"
 SIA_uneasy_compromise_desc: "The generals sit in the cabinet and the politicians keep their mandate, a national government that holds the Kingdom together by sheer mutual mistrust. Stability is bought at the price of decisive action. Every ministry is watched, every initiative negotiated twice. The arrangement steadies the country (§G+5% stability§!) but smothers the government's freedom of manoeuvre (§R−10% political power gain§!) until the bargain runs its course."
 SIA_gfc_headwinds: "Global Financial Crisis Headwinds"
 SIA_gfc_headwinds_desc: "The collapse of Western credit markets has slowed Thai export orders and tightened trade finance. Consumer goods prices creep upward and trade volumes contract. The storm is not Thailand's fault, but the economy will feel it for two years."
 SIA_coup_risk_modifier: "Coup Risk Pressure"
 SIA_coup_risk_modifier_desc: "Elevated coup risk weighs on political stability and suppresses political power accumulation. The higher the risk, the heavier the drag. Every point on the risk meter is felt in the government's ability to govern."
 SIA_coup_tier_watchful: "Barracks Watchful"
 SIA_coup_tier_watchful_desc: "The generals are content, for now. They read the newspapers, count the budget lines, and keep their counsel. No penalty, but the meter is climbing or falling with every choice the government makes.\n\n§YCoup Risk§!: [?ROOT.SIA_coup_risk|0]/100"
 SIA_coup_tier_restless: "Barracks Restless"
 SIA_coup_tier_restless_desc: "Pointed editorials in the army-owned press, retired officers grumbling on the talk shows, a cabinet shuffle the high command was not consulted on. The mood in the messes has soured. Govern cleanly or buy them back before it gets worse.\n\n§YCoup Risk§!: [?ROOT.SIA_coup_risk|0]/100"
 SIA_coup_tier_plotting: "Generals Plotting"
 SIA_coup_tier_plotting_desc: "Unusual troop rotations, dinners the prime minister was not invited to, the palace receiving visitors in uniform. Everyone in Bangkok can read the signs. The government can still pull back from the brink, but the window is closing.\n\n§YCoup Risk§!: [?ROOT.SIA_coup_risk|0]/100"
 SIA_coup_tier_tanks: "Tanks Warming Up"
 SIA_coup_tier_tanks_desc: "The columns are fuelled and the broadcast script is written. The high command is one provocation away from rolling on Government House. Pull coup risk back below 70, and fast, or the §RReassure the High Command§! mission runs out and the tanks come.\n\n§YCoup Risk§!: [?ROOT.SIA_coup_risk|0]/100"
 SIA_rice_pledge: "Rice Pledge Programme"
 SIA_rice_pledge_desc: "The government guarantees farmers above-market prices for their rice harvest and holds the strategic stockpile. Rural incomes rise, and the treasury's exposure to global commodity prices rises with them."
 SIA_red_shirts_mobilized_idea: "Red Shirts on the March"
 SIA_red_shirts_mobilized_idea_desc: "The rural network is mobilised and in the streets. Mass demonstrations in Udon Thani, Khon Kaen and the outskirts of Bangkok rally the base, and convince the palace and the high command that the elected government has lost control. Every march brings the reckoning with the army nearer."
 SIA_kings_moral_authority_2: "The New Reign"
 SIA_kings_moral_authority_2_desc: "The Tenth Reign has settled into authority, but it is a different authority. More visible, more commercial, more controversial than its predecessor. The moral weight of sixty years on one throne does not transfer in a single coronation."
 SIA_volunteer_force: "Volunteer Force"
 SIA_volunteer_force_desc: "An all-volunteer military selects for aptitude, trains more intensively, and retains its best soldiers. The army is smaller and quieter about politics, which is precisely the intention."
 SIA_buddhist_nationalism_idea: "Buddhist Nation"
 SIA_buddhist_nationalism_idea_desc: "The Sangha is elevated as a partner of the state. Monks in civic education, Buddhism in the national curriculum, and the government's moral authority certified by the temple. In the deep south, where the mosques are full, this registers differently."
 SIA_chao_phraya_project: "Chao Phraya Project"
 SIA_chao_phraya_project_desc: "Flood retention reservoirs, raised embankments, and a chain of run-of-river turbines along the Chao Phraya basin. The engineering work is unglamorous, and the next great flood will test whether it was sufficient."
 SIA_merit_civil_service: "Merit-Based Civil Service"
 SIA_merit_civil_service_desc: "Competitive examinations, performance review, and anti-corruption screening replace the old patronage appointment system. The bureaucracy is slower to staff and harder to exploit, which is the point."
 SIA_asean_single_window: "ASEAN Single Window"
 SIA_asean_single_window_desc: "A common customs and certification portal shared across Association members eliminates redundant paperwork at every border crossing. The trade facilitation gain is small per shipment and large in aggregate."
 SIA_national_broadband: "National Broadband"
 SIA_national_broadband_desc: "Fiber optic cable to provincial capitals, 4G towers to district towns, subsidized devices to village schools. The digital divide does not close in one budget cycle, but the infrastructure does."
 SIA_kra_mobilization: "National Mobilization for the Kra Canal"
 SIA_kra_mobilization_desc: "Every crane, excavator and engineering battalion the Kingdom can muster is committed to the Kra corridor. Consumer prices climb, political capital drains, and the government's approval rating bends under the weight, but the construction speed is extraordinary. This idea is removed when the canal is complete."
 SIA_kra_canal: "The Kra Canal"
 SIA_kra_canal_desc: "The canal that connects the Gulf of Thailand to the Andaman Sea makes Thailand the chokepoint of the world's second-busiest shipping lane. Tolls flow into the treasury, navies queue politely for transit rights, and Bangkok's opinion is now worth soliciting in every Asian capital."
 SIA_kra_debt_trap: "Belt and Road Debt"
 SIA_kra_debt_trap_desc: "The canal was cheap to start because Beijing paid for it. The repayment schedule is denominated in yuan, the collateral is the waterway itself, and every cost overrun deepens the obligation. Consumer prices drift up and political capital leaks away while the loan compounds in the background."
 SIA_kra_debt_serviced: "Debt Restructured"
 SIA_kra_debt_serviced_desc: "The loan has been renegotiated on harsh but survivable terms. The crisis is past, the canal is Thai, and the government has earned a measure of credibility for facing Beijing down at the bargaining table rather than the back room."
 SIA_kra_default_pariah: "Sovereign Default"
 SIA_kra_default_pariah_desc: "Thailand walked away from the Belt and Road loan. The canal is its own, but the international credit markets remember, trade partners hedge, and the price of capital is high for a country that has shown it will repudiate a debt when the politics demand it."
 SIA_kra_lease_concession: "Beijing's Lease Concession"
 SIA_kra_lease_concession_desc: "To settle the debt, a long-term operating concession over part of the canal was conceded to a Chinese state enterprise. The Kingdom still flies the flag at the locks, but a share of every toll now sails to Beijing, and the world has noticed who really holds the lease."
 SIA_kra_capital_flight: "Capital Flight"
 SIA_kra_capital_flight_desc: "The default spooked the markets. Foreign capital is heading for the exits, the baht is under pressure, and the central bank is burning reserves to slow the bleeding. The shock is severe but temporary, and confidence will return once the dust settles."
 SIA_kra_delay: "Construction Delay"
 SIA_kra_delay_desc: "Rather than pour more money into a phase that ran over budget, the government accepted a slower schedule. Building speed suffers and the optics are poor, but the treasury is spared the worst of the overrun."
 SIA_kra_canal_sovereign: "The Sovereign Canal"
 SIA_kra_canal_sovereign_desc: "Built without a foreign creditor or a foreign clause, the canal is Thai to the last bollard. The premium paid for absolute sovereignty buys a deeper naval-industrial base, a stronger toll regime, and a national prestige no concession could ever match."
 SIA_kra_fortress: "Fortress Canal"
 SIA_kra_fortress_desc: "Coastal batteries, hardened bunkers, and a permanent naval garrison make the Kra a waterway the Royal Thai Navy can hold by force. The fleet sharpens its skills guarding the chokepoint, but the militarised passage costs Bangkok a little goodwill among the shipping lines."
 SIA_kra_neutral_transit: "Neutral Transit Regime"
 SIA_kra_neutral_transit_desc: "The Kra is open to all flags on equal terms, guaranteed by treaty and trusted by every maritime power. Traffic and goodwill flow in together. The tolls run high, the opinion of trading nations climbs, and the canal becomes a global common rather than a national weapon."
 SIA_red_revival: "Ghosts of the CPT"
 SIA_red_revival_desc: "The Communist Party of Thailand's cadres, the survivors of the 1970s struggle, their children, their students, have emerged from the margins. The party has political energy, a theory of history, and an appetite for power. It also has enemies, and its presence in the national conversation costs the country a few percentage points of stability every month it refuses to work within the existing system."
 SIA_general_strike_idea: "General Strike (Ongoing)"
 SIA_general_strike_idea_desc: "The country is being deliberately paralysed. Docks, rails, schools, hospitals operating on skeleton crews. Stability falls one percent every week the strike holds. Drive momentum to 100 through the General Strike decisions and the government capitulates. Let the 180 days run out short and the army takes over.\n\n§RStrike Momentum§!: [?ROOT.SIA_strike_momentum|0]/100"
 SIA_western_sanctions: "Western Economic Sanctions"
 SIA_western_sanctions_desc: "The United States and its allies have imposed a sanctions package on Thailand following the change of government. Investment has frozen, trade finance has become difficult to arrange, and several bilateral agreements are suspended. The cost is real, and so is the political benefit of having a clear external enemy."
 SIA_asean_pariah: "Pariah of the Region"
 SIA_asean_pariah_desc: "Thailand's bid to subjugate its neighbours has made it a pariah across Southeast Asia and beyond. ASEAN partners have frozen Bangkok out of regional commerce, foreign capital has fled the aggressor, and the cost of every brick and barrel now reflects a kingdom at war with the region it once led. Isolation has a price, and the Thai economy is paying it."
 SIA_planned_economy: "The Five-Year Plan"
 SIA_planned_economy_desc: "Central direction of investment, factories where the plan says factories, steel where the plan says steel, produces rapid industrial growth at the cost of consumer flexibility. Construction speeds up when the whole state apparatus points at the same target. Consumer goods remain scarce. The trade account with the West goes to near-zero by design."
 SIA_red_hardliners: "Hardliner Faction"
 SIA_red_hardliners_desc: "The decision to retain the monarchy in any capacity, even ceremonial, has fractured the party's left wing. The hardliner faction does not accept the compromise and will not pretend otherwise. Their obstructionism drains political bandwidth from every legislative session."
 SIA_peoples_siam: "People's Solidarity Bloc"
 SIA_peoples_siam_desc: "Thailand has anchored itself in a regional alignment with Laos and Vietnam. The mutual recognition framework provides diplomatic cover, reduces isolation, and, for a country that just nationalised its major industries, provides the trading relationships that keep the shelves stocked. Mil-to-mil cooperation across the bloc is the foundation of a genuinely independent defence posture."
 SIA_peoples_war_doctrine: "People's War"
 SIA_peoples_war_doctrine_desc: "The movement chose the rifle over the picket line. Years in the highlands have left it with something a general strike never could. A hardened cadre army that knows the ground, fights for belief rather than pay, and improves with every engagement. The discipline of the base areas carries into the new state's forces."
 SIA_revolutionary_justice: "Revolutionary Justice"
 SIA_revolutionary_justice_desc: "The tribunals have made the price of disloyalty plain. Counter-revolutionary networks have been broken, foreign agitation finds few willing hands, and the party's grip on the ideological direction of the state is near-total. The cost is a population that obeys more readily than it believes. A quieter country, and a colder one."
 SIA_united_front: "United Front Government"
 SIA_united_front_desc: "The revolution governs through a coalition of peasant leagues, unions, reform intellectuals and small traders rather than over them. Sharing the credit has bought a breadth of legitimacy no purge could, and a population that helped build the new order defends it as its own. Decisions take longer. They also stick."
 SIA_peoples_liberation_army: "People's Liberation Army"
 SIA_peoples_liberation_army_desc: "A mass conscript army, trained in the party's image and equipped from Thai arsenals, stands behind the revolution. Mobilisation is faster, the manpower pool deeper, and the force answers to the state rather than to any general's faction. A revolutionary republic in a hostile region can at last defend itself."
 SIA_socialist_education_idea: "Mass Education Drive"
 SIA_socialist_education_idea_desc: "The literacy campaign has reached the last village, and the cadre schools graduate engineers and administrators chosen on merit. A skilled, organised population accelerates every research effort, settles behind the new order, and starves the old patronage networks of the ignorance they fed on."
 SIA_beijing_road: "Beijing's Junior Partner"
 SIA_beijing_road_desc: "Thailand has thrown in its lot with China. Chinese capital finishes what the plan began, Chinese markets replace the ones the West closed, and Beijing's shadow keeps the neighbours cautious. The construction sites never lack for funding. The price is paid in autonomy. China's preferences carry weight in Bangkok that no Thai government would once have tolerated."
 SIA_indochina_solidarity: "Senior Partner of Indochina"
 SIA_indochina_solidarity_desc: "Thailand leads rather than follows. As the industrial and geographic heart of an Indochinese socialist bloc, Bangkok coordinates Laos, Vietnam and Cambodia from a position of strength, projecting influence outward and carrying the diplomatic weight of a regional power. The great capitals must now negotiate with the bloc, not dictate to it."
 SIA_million_rai_idea: "One Million Rai"
 SIA_million_rai_idea_desc: "A coordinated programme of rubber-replanting subsidies, precision irrigation, and contract-farming certification has modernised Thailand's agricultural export base. Trade partners across the region pay a premium for certified Thai produce."
 SIA_coalition_price: "Coalition Price"
 SIA_coalition_price_desc: "Forming government required distributing ministries among coalition partners. The horse-trading continues every budget cycle. The political overhead is real, but so is the governing majority it sustains."
 SIA_green_rush: "The Green Rush"
 SIA_green_rush_desc: "Cannabis decriminalization has opened a new agricultural commodity market. Isaan farmers are diversifying, herbal product exporters are registering faster than the licensing agency can process them, and a corner of the Bangkok hospitality industry has quietly pivoted. Critics call it a social experiment. The treasury receipts call it revenue."
 SIA_defence_industry_act_idea: "Defence Industry Framework"
 SIA_defence_industry_act_idea_desc: "The legal architecture for domestic defence production is in place. Procurement preference for Thai-made systems, a technology-transfer obligation on all foreign contracts, and a streamlined licensing process for private defence manufacturers. Foreign licences are cheaper to acquire, and domestic systems are more competitive."
 SIA_asean_arsenal_idea: "ASEAN's Arsenal"
 SIA_asean_arsenal_idea_desc: "Thailand has become the preferred second-tier arms supplier for Southeast Asian militaries, fielding MRAPs, artillery systems, UAVs, and ammunition. The factory floor runs at capacity, the export contracts are rolling, and Bangkok's defence attachés have started to enjoy their postings."
 SIA_asean_arsenal: "ASEAN's Arsenal"
 SIA_asean_arsenal_desc: "Thailand has become the preferred second-tier arms supplier for Southeast Asian militaries, fielding MRAPs, artillery systems, UAVs, and ammunition. The factory floor runs at capacity, the export contracts are rolling, and Bangkok's defence attachés have started to enjoy their postings."
 SIA_asean_arsenal_2: "ASEAN's Arsenal"
 SIA_asean_arsenal_2_desc: "A self-reliant defence-industrial base now anchors the export trade. Domestic lines produce artillery, armour, and munitions at scale, the supply chain no longer depends on foreign goodwill, and Thai systems are fielded from Manila to Jakarta."
 SIA_regional_defense_pact_idea: "Regional Defence Pact"
 SIA_regional_defense_pact_idea_desc: "The formalised supply agreements with ASEAN partners have translated into sustained factory demand. Production lines run to schedule, export contracts carry multi-year guarantees, and the defence industry cluster around Bangkok is expanding to meet them. Arms exports are no longer opportunistic. They are structural."
 SIA_cyber_corps: "Royal Thai Cyber Corps"
 SIA_cyber_corps_desc: "The new cyber command integrates signals intelligence, network defence, and offensive cyber capability into a unified structure. Research programmes benefit from the classified threat-intelligence feed, and political drift is harder to engineer when the digital perimeter is monitored."
 SIA_war_plan_brm: "War Plan Burma"
 SIA_war_plan_brm_desc: "Thai operational planners have gamed the Salween campaign in detail. Infiltration corridors, logistics nodes, the Shan irregulars as a force multiplier. The plan is current, the staging infrastructure is in place, and the officer corps knows the terrain."
 SIA_war_plan_lao: "War Plan Laos"
 SIA_war_plan_lao_desc: "The Mekong crossings, the highland passes, the vulnerability of Vientiane to a thrust from the Nong Khai direction. The campaign plan exists in every operational binder from the 3rd Army HQ. Border infrastructure has been quietly upgraded to support a rapid advance."
 SIA_war_plan_cbd: "War Plan Cambodia"
 SIA_war_plan_cbd_desc: "The Preah Vihear corridor, the Dangrek scarp, the flat approaches to Siem Reap. Thai planners have drawn the operational boundaries and war-gamed the logistics three times. The staging state is ready."
 SIA_war_plan_may: "War Plan Malaysia"
 SIA_war_plan_may_desc: "The 1909 border is a planning constraint, not a fact of nature. Detailed campaign orders for the Narathiwat approach and the Kelantan corridor exist in a red folder marked RESTRICTED. Deep South infrastructure investments double as staging grounds."
 SIA_war_economy_mobilization: "War Economy Mobilization"
 SIA_war_economy_mobilization_desc: "Suwannaphum has unified the irredentist project under one political and industrial roof. Arms factories run extra shifts, civilian production is redirected to war-support materials, and the budget envelope for procurement has been doubled. The consumer goods ration is the visible cost of empire in the making."
 SIA_two_oceans_navy: "Two Oceans Navy"
 SIA_two_oceans_navy_desc: "The Royal Thai Navy now patrols both the Gulf of Thailand and the Andaman Sea. Dockyards on both coasts maintain a fleet that is small by great-power standards but decisive at the chokepoint. Speed, range, and submarine deterrence define the doctrine."
 SIA_protector_of_the_realm: "Protector of the Realm"
 SIA_protector_of_the_realm_desc: "The Thai armed forces now anchor the occupation of the reclaimed frontier, holding order across the Shan, Lao, Khmer, and Malay ground won in the Pan-Thai wars while civil administration catches up. War weariness fades with victory secured, and pride in a reunified realm steadies the home front."
 SIA_coin_doctrine: "COIN Doctrine"
 SIA_coin_doctrine_desc: "Counter-insurgency as a system. Population census, civil-military fusion, village defence volunteers, and intelligence networks that reach into every district. The CPT was defeated by this approach in the 1980s. ISOC institutionalised the lessons."
 SIA_professional_officer_corps: "Professional Officer Corps"
 SIA_professional_officer_corps_desc: "A generation of officers trained in joint warfare, staff college exchanges, and civil-military doctrine. The coup mentality recedes slowly, as career advancement comes to depend on operational competence rather than royal connections."
 SIA_mdo_doctrine: "Multi-Domain Operations Doctrine"
 SIA_mdo_doctrine_desc: "Thailand's armed forces now plan and fight across cyber, space, air, land, and sea simultaneously. The doctrine is more aspiration than reality in the first year, but aspiration backed by a funded acquisition roadmap and a trained staff."
 SIA_comprehensive_security_idea: "Comprehensive Security"
 SIA_comprehensive_security_idea_desc: "The integrated national security framework reduces duplication between interior, defence, and intelligence agencies. Consumer overhead falls as coordination improves. The drift toward any external patron becomes measurably harder to engineer."
 SIA_atoms_for_peace_idea: "Nuclear Research Foundations"
 SIA_atoms_for_peace_idea_desc: "Thailand's nuclear regulatory framework, signed IAEA protocols, and the first generation of nuclear engineers trained abroad. The research speed dividend comes from applied nuclear science filtering into adjacent fields like materials science, reactor chemistry, and industrial isotope production."
 SIA_nuclear_energy: "Nuclear Baseload Power"
 SIA_nuclear_energy_desc: "Grid-connected nuclear power reduces Thailand's dependence on imported gas and petroleum. Consumer goods costs fall as the electricity price stabilises, and factory output climbs on cheaper, more reliable power. The reactor operates whether oil is forty or one hundred and forty dollars a barrel."
 SIA_cambodia_partnership: "Cambodia Partnership"
 SIA_cambodia_partnership_desc: "A structured bilateral relationship with Phnom Penh covers trade facilitation, joint development zones, and a diplomatic accord that positions Thailand as Cambodia's preferred economic partner. The influence flows in both directions, and the trade receipts flow in one."
 SIA_jakarta_partnership: "Jakarta Partnership"
 SIA_jakarta_partnership_desc: "Joint exercises between the Royal Thai Armed Forces and the Indonesian National Armed Forces have produced interoperability dividends beyond the formal structure. Thai and Indonesian officers share doctrine, logistics frameworks, and a common assessment of the regional threat environment."
 SIA_fuel_reserves: "Strategic Fuel Reserves"
 SIA_fuel_reserves_desc: "Three months of national fuel consumption held in strategic reserve, in distributed tank farms across all five regions. The stockpile smooths price spikes, provides crisis buffer, and signals to partners that Thailand's military logistics are not hostage to a single supply route."
 SIA_medical_tourism_boom: "Medical Tourism Boom"
 SIA_medical_tourism_boom_desc: "Word has spread. Bangkok's private hospitals are booked solid with foreign patients, and the convalescents stay on as tourists. The receipts and the arrivals build month after month, while the wards run hot and locals wait longer for a bed."
 SIA_aec_tailwind: "ASEAN Integration Tailwind"
 SIA_aec_tailwind_desc: "The trade-facilitation push is paying off across the region. Lower friction at the borders, deeper supply chains, Thai factories winning regional contracts. The export-led growth compounds over years, even as the adjustment squeezes consumer-goods capacity at home."
 SIA_arms_export_orders: "Defence Export Order Book"
 SIA_arms_export_orders_desc: "The order book is full. MRAPs, munitions, loitering drones and licence-built systems ship to ASEAN buyers on a rolling schedule. The arms lines run at capacity and Thailand's standing as the region's preferred supplier deepens, at the cost of the diplomatic friction that arming the neighbourhood always brings."
 SIA_royal_development_lands: "Royal Development Lands"
 SIA_royal_development_lands_desc: "Crown-sponsored projects have opened new land to cultivation and extraction and steadied the provinces they touch. The countryside is calmer and the resource base wider, though the works themselves draw down the nation's goods while they run."
 SIA_eec_construction_boom: "EEC Construction Surge"
 SIA_eec_construction_boom_desc: "The Eastern Economic Corridor is a live construction site, with cranes over the ports, rail beds graded, and factory shells rising. Building goes faster and output climbs, but the surge ties up consumer-goods capacity for the duration."
 SIA_asean_chair_spotlight: "ASEAN Chair Spotlight"
 SIA_asean_chair_spotlight_desc: "Bangkok holds the gavel and the cameras. The chairmanship buys easy goodwill and a cheaper diplomatic posture across the Association, for as long as the spotlight lasts."
 SIA_purge_disruption: "Anti-Graft Disruption"
 SIA_purge_disruption_desc: "The enforcement sweep has frozen procurement and put the patronage networks on edge. Contracting has seized up and the political machine is sulking. This is the price of a cleaner system, paid up front."
 SIA_army_wage_inflation: "Inflated Officer Payroll"
 SIA_army_wage_inflation_desc: "The favours bought the brass off, but the price was a bloated payroll. Officer salaries, allowances and ghost postings have been padded across the ranks, and the military wage bill will run hot until the budget is brought back to heel."
 SIA_chuan_leekpai_desc: "Veteran Democrat Party politician and elder statesman who served as Prime Minister from 1992 to 1995 and from 1997 to 2001. His second term navigated Thailand through the Asian Financial Crisis with IMF support. Known for his unimpeachable personal integrity in a system rife with corruption."
 SIA_thaksin_shinawatra_desc: "Billionaire telecommunications magnate who founded Thai Rak Thai and won a landslide in 2001. His populist programmes, the 30-baht healthcare scheme and village development funds, transformed rural politics. Ousted in a 2006 military coup, he governed Thailand from exile through multiple proxy parties."
 SIA_bhumibol_adulyadej_desc: "Rama IX, the ninth monarch of the Chakri dynasty and the world's longest-reigning head of state. His moral authority as a unifying symbol was deployed in every political crisis. His passing in October 2016 ended a 70-year reign and ushered in a period of profound national mourning."
 SIA_vajiralongkorn_desc: "Rama X, Maha Vajiralongkorn, who ascended to the throne following his father's death in 2016. He has exercised direct control over crown assets and the Royal Guard, and inserted himself more directly into political affairs than his predecessors. His reign coincides with the most turbulent period of Thai constitutional history."
 SIA_abhisit_vejjajiva_desc: "Oxford-educated Democrat leader who became Prime Minister through a parliamentary vote in 2008 following the Constitutional Court's dissolution of the People's Power Party. His government oversaw the April to May 2010 crackdown on Red Shirt protesters in Bangkok."
 SIA_yingluck_shinawatra_desc: "Pheu Thai leader and youngest sister of Thaksin Shinawatra, who won the July 2011 election with the largest majority since 2001. Her government launched the rice-pledging programme that later became a major corruption scandal. She was removed by the Constitutional Court in 2014 and fled the country before a criminal verdict."
 SIA_prayut_chanocha_desc: "Royal Thai Army commander who led the May 2014 coup, Thailand's twelfth, and served as Prime Minister for nine years under the NCPO junta and the Palang Pracharath Party. Architect of the 2017 constitution's mixed-member proportional system designed to fragment opposition parties."
 SIA_sonthi_boonyaratglin_desc: "Army commander who led the September 2006 coup that ousted Thaksin Shinawatra while the Prime Minister was overseas. Chaired the Council for National Security junta until interim civilian government was installed. Later entered electoral politics as a minor party leader."
 SIA_anutin_charnvirakul_desc: "Bhumjaithai Party leader and scion of a construction-industry family who rose to prominence as Deputy Prime Minister. His party's strategic positioning between military and civilian blocs made it a kingmaker in three successive coalition governments. Became Acting PM in late 2025 following the Constitutional Court's removal of Paetongtarn."
 SIA_pita_limjaroenrat_desc: "Move Forward Party leader whose party won the May 2023 election with the largest vote share, only to be blocked from forming a government by the military-appointed Senate. The Constitutional Court subsequently dissolved the party and banned him from politics for five years."
 SIA_natthaphong_ruengpanyawut_desc: "Successor to Pita Limjaroenrat as leader of the reconstituted People's Party, and Bangkok's youngest elected governor. Represents the generational shift in Thai progressive politics toward local governance and climate policy alongside constitutional reform."
 SIA_songkhram_phaendin_desc: "FICTIONAL, a symbolic name meaning 'war of the land'. The fictionalised figure of a pan-Thai nationalist marshal who leads Thailand down the path of Greater Thai irredentism. Not based on any real person."
 SIA_somchai_ratchaphruek_desc: "FICTIONAL, surnamed for the golden shower tree that stands as Thailand's national emblem. The fictionalised figure of a Communist Party of Thailand veteran who leads the kingdom down a revolutionary path. Not based on any real person."
 SIA_banharn_silpaarcha_desc: "Chart Thai Party leader and construction-industry patron from Suphanburi who served as Prime Minister from 1995 to 1996. His government poured provincial infrastructure spending into his home turf so heavily that the press nicknamed him the walking ATM. The coalition collapsed within a year amid corruption allegations and the economic warning signs that preceded the 1997 crash."
 SIA_chavalit_yongchaiyudh_desc: "Founder and leader of the New Aspiration Party, and a former Royal Thai Army Commander-in-Chief who became Prime Minister in November 1996. His government held office as the baht crisis broke in mid-1997, and he resigned that November under pressure from the currency collapse his administration failed to contain."
 SIA_thanathorn_juangroongruangkit_desc: "Auto-parts magnate who co-founded the Future Forward Party in 2018 and became the face of its youth-driven reform politics. His rapid rise alarmed the establishment. The Constitutional Court dissolved the party in February 2020 and banned him from office for a decade over a loan the party had taken from him personally."
 SIA_virot_paoin_desc: "A police lieutenant general who took the Pheu Thai leadership once Thaksin's line moved on, continuing the party's populist coalition from behind a uniform rather than a rally podium. His governing style leans on institutional loyalty within the police and civil service rather than the mass rural mobilisation his predecessor built the party on."
 SIA_srettha_thavisin_desc: "Property-developer executive and Pheu Thai's 2023 prime ministerial candidate, who became Prime Minister that August in the party's return-to-power coalition with former rivals. The Constitutional Court removed him from office in August 2024 over an ethics breach tied to a cabinet appointment, one of the shortest tenures of any elected Thai premier in a decade."
 SIA_paetongtarn_shinawatra_desc: "Thaksin Shinawatra's youngest daughter and Pheu Thai's third Shinawatra premier, who took office in August 2024 as the party's answer to the court's removal of her predecessor. A leaked phone call with Cambodia's Hun Sen over the border dispute cost her the premiership within a year, reviving questions about how much of the government's direction still runs through her father."
 SIA_greater_thailand_consolidated: "Greater Thailand Consolidated"
 SIA_greater_thailand_consolidated_desc: "The irredentist campaigns have concluded. The kingdom stands larger and stronger than before, its manpower reserves deepened, its industries emboldened, its people unified by shared sacrifice and shared victory. The state apparatus that waged war now drives construction."
 SIA_dti_self_reliance_idea: "Defence Technology Institute, Self-Reliant Arms Industry"
 SIA_dti_self_reliance_idea_desc: "The DTI has transitioned from foreign licensing to domestic production lines. Thai-designed rifles, artillery shells, and armoured vehicles now roll off state factories, cutting import dependency and sharpening the production cadence of the Royal Thai Armed Forces."
 SIA_gateway_of_asia_idea: "Gateway of Asia"
 SIA_gateway_of_asia_idea_desc: "Thailand has completed its transformation into the maritime and commercial crossroads of Southeast Asia. International shipping, logistics hubs, and foreign investment flow through Bangkok and the southern corridor. Factory output climbs on the back of global demand."
 SIA_joint_command_idea: "ASEAN Joint Command"
 SIA_joint_command_idea_desc: "The ASEAN Defence Community's permanent joint command has standardised doctrine, planning procedures, and interoperability across every member state's land forces. Thai doctrine drives the alliance's land warfare playbook, improving coordination, reaction time, and the quality of every operational plan."
 SIA_asean_rapid_reaction_idea: "ASEAN Rapid Reaction Force"
 SIA_asean_rapid_reaction_idea_desc: "A standing multinational brigade, supplied from Thai depots and trained to deploy across the archipelago in 72 hours. The force is lean by design, but its presence disciplines supply chains, reduces consumption, and keeps every unit ready to move."
 SIA_pax_aseana_idea: "Pax Aseana"
 SIA_pax_aseana_idea_desc: "Thailand leads a stable, coherent, and self-sufficient security bloc. Political capital flows in from allied capitals, and stability is reinforced by the knowledge that Bangkok will not stand alone, and neither will any ally. The region's peace is underwritten by Thai power."
 SIA_asean_defense_member: "ASEAN Defense Community Member"
 SIA_asean_defense_member_desc: "This nation chose to join Thailand's regional defense pact of its own accord. Shared command and a common purpose steady the home front and stiffen the defense. Bound by consent rather than coercion, its commitment to the community holds where a forced alliance would have crumbled."
 SIA_rally_round_flag: "Rally Round the Flag"
 SIA_rally_round_flag_desc: "The border incident has united the Thai public behind the armed forces. Nationalist sentiment is elevated and conscription queues are long, but the mood is volatile and the honeymoon will not last forever."
 SIA_f16v_consolation: "F-16V Block 70 Acquisition"
 SIA_f16v_consolation_desc: "Washington's refusal to sell the F-35 led instead to an upgraded F-16V contract, less capable but faster to field. The RTAF gets modern avionics, AESA radar, and integration with the existing F-16 maintenance chain."
 SIA_national_grid_idea: "National Power Grid Upgrade"
 SIA_national_grid_idea_desc: "Upgraded transmission infrastructure across the Eastern Seaboard has cut line losses and lifted power generation across every source feeding the grid. Factories that were energy-constrained can now run at full production. Builders who were waiting on grid connections can break ground."
 SIA_renewable_energy_idea: "Renewable Energy Programme"
 SIA_renewable_energy_idea_desc: "Wind, solar, and small hydro installations feed clean electricity into the national grid at scale. The programme has accelerated construction of renewable-energy infrastructure across three provinces and improved the grid's overall efficiency, reducing line losses and freeing Thailand from one strand of its Gulf-fuel dependency."
 SIA_fossil_energy_idea: "Gulf Fossil-Fuel Partnership"
 SIA_fossil_energy_idea_desc: "Long-term supply agreements with Gulf producers have locked in predictable fuel prices and equipped Thai power plants with more efficient gas-turbine technology. Modern fuel logistics, including better pipelines, improved storage management, and streamlined procurement, reduce the army and navy's operating costs and build a meaningful strategic reserve."
 SIA_counter_insurgency_idea: "Southern Counter-Insurgency Operations"
 SIA_counter_insurgency_idea_desc: "Reinforced army units and police special operations forces maintain a persistent presence in Pattani, Yala, and Narathiwat. Intelligence-led operations target bomb-making networks while civil-affairs teams work alongside village headmen. Garrison losses drop, compliance in occupied areas rises, and the insurgency's ability to recruit is slowly degraded."
 SIA_anti_narcotics_idea: "ONCB Anti-Narcotics Drive"
 SIA_anti_narcotics_idea_desc: "The Office of the Narcotics Control Board's expanded mandate produces results. Major trafficking networks disrupted, processing facilities identified and destroyed, and money-laundering channels forced into more expensive and traceable alternatives. The drug trade does not disappear, but it becomes costlier and less profitable, and the tax receipts freed from criminal diversion flow back to the state."
 SIA_anti_graft_idea: "Anti-Graft Enforcement"
 SIA_anti_graft_idea_desc: "An empowered National Anti-Corruption Commission has begun dismantling the procurement and customs networks that siphon revenue from the Thai state. Contractors compete on merit, and import duties flow to the treasury rather than to middlemen. The immediate savings are modest, but the long-term signal to investors is not."
 SIA_decentralized_governance_idea: "Provincial Governance Dividend"
 SIA_decentralized_governance_idea_desc: "Budget authority devolved to Provincial Administrative Organisations has unlocked locally-directed infrastructure spending in Chiang Mai, Khon Kaen, and Songkhla. Projects that languished for years in Bangkok approval queues are breaking ground. Stability rises as citizens feel their concerns are heard and acted upon, but the centre moves more slowly."
 SIA_bangkok_primacy_idea: "Bangkok Metropolitan Engine"
 SIA_bangkok_primacy_idea_desc: "Anti-corruption dividends have been concentrated in the capital. Upgraded industrial districts on the Eastern Ring Road, expanded research campuses, and streamlined permitting in the Bangkok Metropolitan Region drive factory efficiency and research output upward. Provincial commentators note the gap is widening, but the growth numbers are undeniable."
 SIA_cobra_gold_doctrine: "Cobra Gold Doctrine Training"
 SIA_cobra_gold_doctrine_desc: "Repeated Cobra Gold cycles have embedded American combined-arms doctrine into the Royal Thai Army's field manuals. Thai officers who have trained alongside US forces return with improved staff procedures, faster planning cadences, and a hard-won familiarity with US equipment and logistics standards."
 SIA_defense_diplomacy: "Defense Diplomacy"
 SIA_defense_diplomacy_desc: "A standing network of defense attachés, joint exercises, and officer exchanges keeps Bangkok on speaking terms with every partner that matters. The diplomatic corps works cheaper and lands warmer with foreign capitals, and the political leadership spends its capital more freely on the strength of those relationships."
 SIA_strait_patrol_posture: "Strait Patrol Posture"
 SIA_strait_patrol_posture_desc: "The Royal Thai Navy is running a heightened patrol rotation through the strait. Escorts shadow the shipping lanes, picket lines watch the approaches, and the fleet ranges farther from port while the posture holds."
 SIA_asean_security_pledge: "ASEAN Security Pledge"
 SIA_asean_security_pledge_desc: "Thailand has pledged itself as the shield of Southeast Asia rather than its conqueror. The first guarantees go out to neighbours who accept Bangkok's protection, and the diplomatic corps leans into the patient work of reassurance. Guarantees come cheaper, relations hold at lower cost, and the Kingdom's forces dig in to make the promise credible."
 SIA_protector_of_asean: "Protector of ASEAN"
 SIA_protector_of_asean_desc: "Thailand has chosen the role of guarantor rather than conqueror. By extending its security umbrella across Southeast Asia, the Kingdom earns the trust of its neighbours and the standing of a regional great power. A standing diplomatic corps now projects Thai influence into several ASEAN capitals at once, funded by the steady political capital the role commands. Diplomacy is cheaper, defence is firmer, and the goodwill of ASEAN flows toward Bangkok."
 SIA_national_rnd_idea: "National R&D Network"
 SIA_national_rnd_idea_desc: "A standing network of state laboratories, science parks, and university R&D centres. Faster technological progress and a more capable industrial base."
 SIA_ptt_idea: "PTT Public Company"
 SIA_ptt_idea_desc: "A listed national energy champion securing the Kingdom's fuel supply and reinvesting its profits across the economy."
 SIA_scg_idea: "Siam Cement Group"
 SIA_scg_idea_desc: "The flagship industrial conglomerate accelerates construction and drives factories toward peak efficiency."
 SIA_cp_group_idea: "Charoen Pokphand Group"
 SIA_cp_group_idea_desc: "Agribusiness and retail at national scale bring cheaper consumer goods, stronger export ties, and rising rural prosperity."
 SIA_gistda_idea: "GISTDA Space Agency"
 SIA_gistda_idea_desc: "A funded national space agency running ground stations and satellite data. Faster research and a steady gain in intelligence reach from eyes in orbit."
 SIA_gistda_idea_2: "GISTDA, Earth Observation"
 SIA_gistda_idea_2_desc: "THEOS imagery turns the agency into a reconnaissance arm. Faster research, a wider intelligence network, and sharper battlefield recon from orbital coverage."
 SIA_gistda_idea_3: "GISTDA, Sovereign in Orbit"
 SIA_gistda_idea_3_desc: "An indigenous launch and satellite-constellation programme. Top-tier research, a commanding intelligence network, strong recon, and an intelligence service hardened against foreign penetration."
 SIA_frontier_buffer_idea: "Frontier Buffer States"
 SIA_frontier_buffer_idea_desc: "The Shan and Karen are kept armed and friendly as a living shield along the Burmese border. Cheaper guarantees, a steadier frontier, and a defensive edge against any push from Naypyidaw."
 SIA_shan_campaign: "Shan Campaign"
 SIA_shan_campaign_desc: "The army is mobilised and oriented for operations into South Shan State, with combat bonuses against Shan forces for the duration of the campaign."
 SIA_karen_campaign: "Karen Campaign"
 SIA_karen_campaign_desc: "Thai forces press into the Karen hills, with combat bonuses against Karen forces for the duration of the campaign."
 SIA_wa_campaign: "Wa Campaign"
 SIA_wa_campaign_desc: "Thai forces drive into the Wa hills against the UWSA, with combat bonuses against Wa forces for the duration of the campaign."
 SIA_us_mech_standard: "NATO-Standard Mechanization"
 SIA_us_mech_standard_desc: "American doctrine and Western vehicles bring superior organization, reconnaissance, and field reliability, at a price counted in the defence budget."
 SIA_reliability_woes: "Reliability Woes"
 SIA_reliability_woes_desc: "Cheap mass came with cheap support. Transmission failures and spare-parts backlogs sap morale and equipment reliability until the fleet is sorted out."
 SIA_small_arms_autonomy: "Small-Arms Autonomy"
 SIA_small_arms_autonomy_desc: "Domestic rifle production frees the Army from foreign supply and seeds a modest arms-export trade."
 SIA_indigenous_armour: "Indigenous Armour Base"
 SIA_indigenous_armour_desc: "Thai-designed fighting vehicles, built in Thai plants and sold abroad. A defence-industrial base that compounds in efficiency and export earnings."
 SIA_modern_rta_core: "A Modern Royal Thai Army"
 SIA_modern_rta_core_desc: "Re-tooled and retrained, the Army's core formations fight harder and hold steadier than the conscript force of old."
 SIA_globaleye_aewc: "GlobalEye AEW&C"
 SIA_globaleye_aewc_desc: "Airborne early warning and control networks the air force, multiplying the reach and effectiveness of every sortie."
 SIA_j10_multirole: "J-10 Multirole Wings"
 SIA_j10_multirole_desc: "Modern Chinese multirole fighters give the air force a credible punch in both air superiority and ground attack."
 SIA_chinese_iads: "Integrated Air Defence"
 SIA_chinese_iads_desc: "A dense, layered Chinese surface-to-air network makes Thai airspace expensive to enter and hard to suppress."
 SIA_f5th_upgrade: "Super Tigris Upgrade"
 SIA_f5th_upgrade_desc: "Israeli avionics breathe new combat life into the legacy fighter fleet, wringing capability from airframes already in hand."
 SIA_indigenous_air_isr: "Sovereign ISR"
 SIA_indigenous_air_isr_desc: "Home-built reconnaissance drones give Thailand its own eyes in the sky, and an export line for the region."
 SIA_air_dominance_core: "Air Dominance Doctrine"
 SIA_air_dominance_core_desc: "A networked, multirole air force trained to win and hold command of the air."
 SIA_aegis_lite: "Modern Surface Combatants"
 SIA_aegis_lite_desc: "Western combat systems and area air defence give the fleet's surface ships a decisive edge in detection and firepower."
 SIA_chd620_teething: "Engine Teething Troubles"
 SIA_chd620_teething_desc: "The substitute Chinese powerplant runs hot and unproven. Until the bugs are worked out, the boats are slower and their crews less confident."
 SIA_domestic_yards: "Domestic Shipbuilding"
 SIA_domestic_yards_desc: "Sovereign yards turn out hulls faster and train the navy as they build, laying the foundation of a self-reliant fleet."
 SIA_euro_marine_systems: "European Marine Systems"
 SIA_euro_marine_systems_desc: "Top-tier European propulsion and combat systems give Thai warships range and reliability without dependence on either superpower."
 SIA_indigenous_navy: "Indigenous Naval Base"
 SIA_indigenous_navy_desc: "A home-grown naval defence industry that compounds in dockyard capacity and earns hard currency selling warships abroad."
 SIA_western_anchor: "Washington's Anchor"
 SIA_western_anchor_desc: "Full interoperability with the United States. Shared doctrine and intelligence sharpen training and reconnaissance, and accelerate research."
 SIA_bamboo_bloc: "The Bamboo Bloc"
 SIA_bamboo_bloc_desc: "Chinese industry and arms at scale bring a surge in factory output and cheap mass production, at the cost of standing in the West."
 SIA_strategic_autonomy_spirit: "Strategic Autonomy"
 SIA_strategic_autonomy_spirit_desc: "A self-reliant defence-industrial base that compounds in efficiency and earns hard currency abroad. Sovereignty with no foreign strings."
 SIA_bamboo_doctrine: "The Bamboo Doctrine"
 SIA_bamboo_doctrine_desc: "Friendly with all and beholden to none. Diplomatic flexibility, broad goodwill, and the domestic stability of a nation that refuses to pick a side."
 SIA_loyal_opposition: "The Loyal Opposition"
 SIA_loyal_opposition_desc: "Win or lose, the party endures. A century-old organisation with roots in every province and a settled core of voters who do not drift with the political weather. It is the steadiest constituency in Thai politics, and the hardest for any rival movement, populist or palace, to pry loose."
 SIA_democratic_institutionalism: "Democratic Institutionalism"
 SIA_democratic_institutionalism_desc: "The rules now outlast the rulers. Independent courts, a working parliament, professional ministries and a public that expects power to change hands at the ballot box. Thai democracy has become a system rather than a season, robust against capture from the streets, the palace or the barracks."
 SIA_pt_tier_dormant: "Watching the Populist Tide"
 SIA_pt_tier_dormant_desc: "For now the rural vote holds and the Democrats govern in peace. But Thaksin's machine never truly sleeps. In the North and Northeast the old loyalties wait, ready to gather the moment the party in power looks complacent. Keep ahead of it with the constituency machine and the tide stays this quiet.\n\n§YPopulist Tide§!: [?ROOT.SIA_pheu_thai_pressure|0]/100"
 SIA_pt_tier_stirring: "The Populist Tide Stirs"
 SIA_pt_tier_stirring_desc: "In the villages of the North and Northeast the old loyalties are stirring. Thaksin's name still carries, and the rural vote is beginning to drift back toward Pheu Thai. A manageable problem today, if the government does not let it grow.\n\n§YPopulist Tide§!: [?ROOT.SIA_pheu_thai_pressure|0]/100"
 SIA_pt_tier_rising: "The Populist Tide Rises"
 SIA_pt_tier_rising_desc: "Out in the Northeast the red banners are out again. Thaksin's machine is gaining, and a government that cannot answer it begins to look like a caretaker waiting to be voted out.\n\n§YPopulist Tide§!: [?ROOT.SIA_pheu_thai_pressure|0]/100"
 SIA_pt_tier_surge: "A Populist Landslide Looms"
 SIA_pt_tier_surge_desc: "The polls are a rout in waiting. Unless the Democrats break the populist wave before the next election, Pheu Thai will sweep back into power and the party will be back in opposition.\n\n§YPopulist Tide§!: [?ROOT.SIA_pheu_thai_pressure|0]/100"
 SIA_thaksin_ascendant: "Thai Rak Thai Ascendant"
 SIA_thaksin_ascendant_desc: "The 1997 crash broke the old parties, and into the vacuum steps Thaksin Shinawatra with a telecoms fortune, a disciplined machine, and a promise the villages of the North and Northeast have waited a generation to hear. Cheap healthcare, debt relief, and a development fund for every village. Month by month the rural vote gathers behind his Thai Rak Thai, and Chuan's Democrats govern on borrowed time.\n\nEach month Thai Rak Thai and the wider non-aligned bloc gain about 3% support, drawn from the establishment vote, until the 2001 realignment settles the question.\n\n§YMonths to the Reckoning§!: [?ROOT.SIA_thaksin_rise_months|0]/12"
 SIA_clean_administration: "Clean Administration"
 SIA_clean_administration_desc: "Open budgets, professional ministries and a reputation for personal incorruptibility. Graft is cheaper to root out and the police run on a leaner, honester budget. This is the unglamorous machinery of government that actually works."
 SIA_fiscal_credibility: "Fiscal Credibility"
 SIA_fiscal_credibility_desc: "A government that lives by its own rules is a government people will pay their taxes to. Predictable administration and a central bank left to do its job widen the tax base and steady the public finances."
 SIA_business_friendly_climate: "A Business-Friendly Climate"
 SIA_business_friendly_climate_desc: "Sound money, open trade and a state that regulates rather than commands. Investors break ground faster on factories and office parks alike, supply chains run leaner, and the markets allocate resources the planners used to ration."
 SIA_isan_development: "Development of the Northeast"
 SIA_isan_development_desc: "Roads, irrigation, agro-industry and a real industrial base in the long-neglected Northeast. The investment that finally gives the Democrats something to offer Isaan beyond a campaign visit, and gives the region a stake in the Kingdom's prosperity."
 SIA_growth_machine: "The Growth Machine"
 SIA_growth_machine_desc: "Double-digit ambitions, mega-projects and a business cabinet that gets things built. The cranes go up across the country, and so do the no-bid contracts, the kickbacks and the conflicts of interest. Growth and graft, rising together."
 SIA_garrison_state: "The Garrison State"
 SIA_garrison_state_desc: "The 2017 charter writes the armed forces into the constitution, with an appointed senate, a guaranteed budget and a national-strategy board the generals chair. A praetorian establishment runs its army cheaply and doctrinally current, the standing reward for a palace-backed order."
 SIA_independent_judiciary: "An Independent Bench"
 SIA_independent_judiciary_desc: "Courts that answer to the law rather than the barracks or the palace. Contracts are enforced, property is secure, and investors, domestic and foreign, price in a Thailand where the rules hold. Legal certainty is its own kind of capital."
 SIA_working_legislature: "A Working Legislature"
 SIA_working_legislature_desc: "Committees with staff and subpoena power, a budget process that means something, and ministries that answer to elected members. A parliament that actually governs builds out the administrative state instead of leaving it to the generals."
 SIA_national_unity_government: "A National-Unity Government"
 SIA_national_unity_government_desc: "A broad coalition spanning regions and factions, hard to topple and broadly legitimate, but every decision is a negotiation. Stability bought at the price of a cabinet that moves at the speed of its most reluctant partner."
 SIA_rural_credit_reform: "Rural Credit Reform"
 SIA_rural_credit_reform_desc: "A Democrat answer to the village fund, built on clean microcredit, a farmers' debt moratorium and cooperative banks that move households off the loan sharks. Rural incomes steady and the countryside has a little more to spend, without the kickback machine."
 SIA_peoples_agenda_idea: "The People's Agenda"
 SIA_peoples_agenda_idea_desc: "Pracha Wiwat in practice means subsidised electricity and cooking gas, welfare and registration for the informal workforce, and a savings option for those the formal system forgot. Proof that welfare need not be a populist monopoly."
 SIA_democratic_legitimacy: "Democratic Legitimacy"
 SIA_democratic_legitimacy_desc: "A government that wins at the ballot box and accepts defeat there too. Unquestioned legitimacy steadies the country and inoculates it against the street movements and foreign-backed agitation that thrive on a contested mandate."
 SIA_broad_coalition_idea: "A Broad Coalition"
 SIA_broad_coalition_idea_desc: "Ministries handed to the small parties and provincial bosses in exchange for a parliamentary firewall. Broad and stable - but every decision is a negotiation, and the cabinet moves at the speed of its most reluctant partner. (Lasts a year, then must be renewed.)"
 SIA_board_of_investment_idea: "Board of Investment"
 SIA_board_of_investment_idea_desc: "The BOI markets Thailand as the place to put your money and helps Thai companies plant their flags across the region. Lower costs, quicker approvals and stronger returns on the capital Thailand sends abroad."
 SIA_mekong_soft_power_idea: "Mekong Soft Power"
 SIA_mekong_soft_power_idea_desc: "Thai banks, contractors and broadcasters carry Bangkok's influence up the Mekong. A louder voice in the neighbourhood, and the diplomatic bandwidth to court one more nation at the same time."
 SIA_tom_yum_kung_crisis: "The Tom Yum Kung Crisis"
 SIA_tom_yum_kung_crisis_desc: "The baht float of July 1997 turned cheap dollar debt into a crushing burden overnight. Banks are frozen, factories sit idle, capital has fled, and the IMF holds the purse strings. Every cause of the crash is a separate wound, and each must be closed in turn."
 SIA_crisis_floated: "The Tom Yum Kung Crisis"
 SIA_crisis_floated_desc: "The baht floats free and the bleeding slows. Cheap exports and returning tourists give the economy its first breath since the crash, but the banks are still frozen and the factories still idle."
 SIA_crisis_recapitalized: "The Tom Yum Kung Crisis"
 SIA_crisis_recapitalized_desc: "The bad loans are pulled out of the banks and parked in the asset management corporation. Lending restarts and the cranes return, though idle plant and the austerity budget still bite."
 SIA_crisis_restructured: "The Tom Yum Kung Crisis"
 SIA_crisis_restructured_desc: "New bankruptcy courts give creditors a path and give firms a way back to life. Idle factories reopen and foreign investors return. What remains is the Fund and the social scars."
 SIA_crisis_unshackled: "The Tom Yum Kung Crisis"
 SIA_crisis_unshackled_desc: "The last installment is paid and the Fund has no more hold on Thailand. The budget is the kingdom's to set again. Only the lingering social cost of the lost years still weighs on the country."
 SIA_tom_yum_kung_recovered: "Lessons of Tom Yum Kung"
 SIA_tom_yum_kung_recovered_desc: "The crisis that began with the baht is over. The kingdom came through leaner and warier, and the hard lesson of 1997 now steadies every hand that builds what comes next."
 SIA_export_competitiveness: "Export Competitiveness"
 SIA_export_competitiveness_desc: "The weak baht makes Thai goods cheap on every shelf abroad. The trade balance swings to surplus and the factories that survived the crash run for export."
 SIA_tamc_cleanup: "Bad Bank Cleanup"
 SIA_tamc_cleanup_desc: "The Thai Asset Management Corporation absorbs the non performing loans and runs restructuring at scale. With clean balance sheets the banks lend again and construction follows the money."
 SIA_fdi_return: "Foreign Investment Returns"
 SIA_fdi_return_desc: "Liberalized ownership rules and a credible bankruptcy process bring the foreign investors back. Solvent firms reopen and the auto and electronics base rebuilds itself on outside capital."
 SIA_thaksinomics_dual_track: "Domestic Demand Revival"
 SIA_thaksinomics_dual_track_desc: "Money reaches the villages, the clinics, and the markets, and the countryside believes in the recovery for the first time. The boom is real and so is the bill, and so are the favors owed."
 SIA_sufficiency_recovery: "Resilient Economy"
 SIA_sufficiency_recovery_desc: "Thailand chooses steadiness over speed. Moderation, diversified farming, and self reliance trade away top speed for the ability to ride out the next storm without breaking."
 SIA_occupation_administration: "Occupation Administration"
 SIA_occupation_administration_desc: "Military governors, resettlement boards, and reconstruction offices now run the conquered provinces. Compliance climbs faster, armed resistance is ground down, and the roads and rails of integration go up more quickly. The apparatus of holding what the army took."
 SIA_industrial_estates_idea: "The Industrial Estates"
 SIA_industrial_estates_idea_desc: "Privately built estates stand ready with land, power, and customs on tap, so foreign manufacturers can break ground almost overnight. Hosting a factory here costs less than anywhere else in the region."
 SIA_electronics_export_idea: "Electronics Export Machine"
 SIA_electronics_export_idea_desc: "Assembly lines for drives, boards, and components run around the clock, and the sector alone accounts for much of what the country ships abroad."
 SIA_modern_retail_idea: "The Retail Revolution"
 SIA_modern_retail_idea_desc: "Malls, hypermarkets, and convenience chains formalize consumer spending, widen the tax base, and give a rising middle class somewhere to put its money."
 SIA_digital_economy_idea: "The Digital Hub"
 SIA_digital_economy_idea_desc: "Data centers, software houses, and cloud services cluster around Bangkok's office towers, lifting research and the productivity of the whole service economy."
 SIA_bcg_idea: "Bio-Circular-Green Economy"
 SIA_bcg_idea_desc: "Biorefineries and high value bio industry turn farm waste and biodiversity into fuel, chemicals, and functional food, raising both research and efficiency."
 SIA_investor_nation_idea: "An Investor Nation"
 SIA_investor_nation_idea_desc: "Thai conglomerates and sovereign funds buy strategic stakes abroad, earning strong returns and projecting Bangkok's influence through capital rather than arms."
 SIA_middle_income_trap: "The Middle Income Trap"
 SIA_middle_income_trap_desc: "Thailand grew rich enough to stop being cheap but never rich enough to lead. Wages outran the factory floor while research and an aging workforce lag behind the frontier. Each sector capstone of the National Strategy eases the drag, and reaching high income status removes it for good."
 SIA_high_income_kingdom: "A High-Income Kingdom"
 SIA_high_income_kingdom_desc: "The trap is broken. A skilled workforce, deep research, and high value industry carry Thailand across the line into the ranks of wealthy nations."
 SIA_middle_income_trap_1: "The Middle Income Trap"
 SIA_middle_income_trap_1_desc: "Thailand grew rich enough to stop being cheap but never rich enough to lead. Wages outran the factory floor while research and an aging workforce lag behind the frontier. Each sector capstone of the National Strategy eases the drag, and reaching high income status removes it for good."
 SIA_middle_income_trap_2: "The Middle Income Trap"
 SIA_middle_income_trap_2_desc: "Thailand grew rich enough to stop being cheap but never rich enough to lead. Wages outran the factory floor while research and an aging workforce lag behind the frontier. Each sector capstone of the National Strategy eases the drag, and reaching high income status removes it for good."
 SIA_middle_income_trap_3: "The Middle Income Trap"
 SIA_middle_income_trap_3_desc: "Thailand grew rich enough to stop being cheap but never rich enough to lead. Wages outran the factory floor while research and an aging workforce lag behind the frontier. Each sector capstone of the National Strategy eases the drag, and reaching high income status removes it for good."
 SIA_finance_hub: "Regional Financial Center"
 SIA_finance_hub_desc: "The Stock Exchange deepens and the big conglomerates run their money through Bangkok. A mature capital market pulls in corporate tax and widens the whole revenue base."
 SIA_fintech_rail: "Cashless Rails"
 SIA_fintech_rail_desc: "PromptPay and the digital banks route almost every transaction through a system the taxman can read, so revenue collection rises and consumer costs fall."
 SIA_data_center_idea: "The Server Farms"
 SIA_data_center_idea_desc: "Hyperscale data centers cluster around Bangkok office districts, turning cheap land and power into compute capacity for the whole region."
 SIA_future_food_idea: "Future Food Champions"
 SIA_future_food_idea_desc: "Functional food, alternative protein, and high value processing lift the farm base up the value chain and squeeze more out of every harvest."
 SIA_china_fruit_trade: "China Fruit Corridor"
 SIA_china_fruit_trade_desc: "Cold chain logistics carry Thai fruit north to China by the trainload, earning goodwill in Beijing and a steady premium for the orchards."
 SIA_deep_south_category: "The Deep South"
 SIA_deep_south_category_desc: "The Malay-Muslim provinces of Yala, Pattani and Narathiwat are in insurgency. Suppression, development and dialogue all have their advocates, and their costs.\n§YInsurgency Intensity§! (0-100) denotes the strength of the southern insurgency. A higher level means deadlier weekly incidents and a heavier drag on the South. Force, development and dialogue push it down. Atrocities and neglect push it up. Iron-Fist tactics leave a permanent §YGrievance Floor§! that intensity can never fall below.\n\n§YInsurgency Intensity§!: [?ROOT.SIA_insurgency_intensity|0]%\n§YGrievance Floor§!: [?ROOT.SIA_ds_intensity_floor|0]%"
 SIA_greater_thailand_category: "Greater Thailand"
 SIA_greater_thailand_category_desc: "The lost-territories programme. Militias, claims and the integration of recovered lands."
 SIA_ds_security_operations: "Security Sweeps"
 SIA_ds_security_operations_desc: "Cordon-and-search operations across the southern provinces. Order improves while the operations last. Whether they end the insurgency or feed it is debated in every after-action report."
 SIA_ds_development_fund: "Southern Development Fund"
 SIA_ds_development_fund_desc: "Roads, schools and jobs for the poorest provinces in the country. Slower than soldiers, cheaper than war."
 SIA_ds_emergency_decree: "Emergency Decree"
 SIA_ds_emergency_decree_desc: "Special powers for the security forces in the southern provinces. Detention without charge, immunity provisions, curfews. Effective, and corrosive."
 SIA_ds_peace_dialogue: "Open Peace Dialogue"
 SIA_ds_peace_dialogue_desc: "Authorize formal talks with the separatist movement under Malaysian facilitation. Talking to them concedes they exist. It is also the only way this ends at a table."
 SIA_arm_shan_militias: "Arm the Shan Militias"
 SIA_arm_shan_militias_desc: "Quietly supply the Shan armies across the Burmese border. Every convoy buys influence over what Shan State becomes."
 SIA_shan_client_state: "Sponsor the Shan State"
 SIA_shan_client_state_desc: "Recognize and underwrite a Shan state aligned with Bangkok. Our brothers get their country, and we get its allegiance."
 SIA_integrate_shan: "Integrate the Shan Lands"
 SIA_integrate_shan_desc: "Extend Thai administration to the Shan plateau, bringing governors, schools, and the baht. The population must be sufficiently pacified before Bangkok can consolidate control."
 SIA_integrate_laos: "Integrate the Lao Lands"
 SIA_integrate_laos_desc: "Extend Thai administration to the claimed Lao provinces. High compliance and low resistance in the core state are required before formal integration can proceed."
 SIA_integrate_cambodia: "Integrate the Khmer Provinces"
 SIA_integrate_cambodia_desc: "Extend Thai administration to Battambang and Siem Reap, as in 1941-1946. The Khmer population must accept Thai governance before formal administration can be imposed."
 SIA_integrate_malaya: "Integrate the Southern Provinces"
 SIA_integrate_malaya_desc: "Extend Thai administration to the former sultanates ceded in 1909. Integration requires the population to be brought firmly under Bangkok's influence before formal annexation."
 SIA_cost_1_0: "£treasury 1.0"
 SIA_cost_1_5: "£treasury 1.5"
 SIA_cost_5_0: "£treasury 5.0"
 SIA_economy_category: "The Thai Economy"
 SIA_economy_category_desc: "Tourism, medicine, manufacturing. The engines of the Thai economy respond to investment, when the treasury can spare it."
 SIA_ds_hearts_and_minds: "Hearts and Minds"
 SIA_ds_hearts_and_minds_desc: "Malay-language schooling, religious outreach, compensation boards and village mediators. Nobody holds a parade for it, but the incident map gets quieter."
 SIA_contain_the_crisis: "Contain the Crisis"
 SIA_contain_the_crisis_desc: "The Deep South has boiled over. Drive the insurgent intensity back below the boiling point within six months, or the violence will spiral and the cost in stability and legitimacy will mount."
 SIA_choose_a_path: "Choose a Path in the South"
 SIA_choose_a_path_desc: "The crisis is active and the government has a clear political mandate, but no southern strategy has been committed. Lock in a track (force, royal development, or dialogue) within the year, or drift will cost the Kingdom dearly."
 SIA_medical_tourism_campaign: "Medical Tourism Campaign"
 SIA_medical_tourism_campaign_desc: "Market Thai hospitals to the world, offering surgery and convalescence at a fraction of Western prices, with a beach attached. The campaign pays for itself, if the wards can take the load."
 SIA_eec_investment_phase: "EEC Investment Phase"
 SIA_eec_investment_phase_desc: "Release the next tranche of Eastern Economic Corridor funds for land clearance, utilities, port and rail works in the eastern provinces."
 SIA_cost_3_0: "£treasury 3.0"
 SIA_cost_4_0: "£treasury 4.0"
 SIA_cost_7_0: "£treasury 7.0"
 SIA_cost_1_0_blocked: "£treasury 1.0 §R(insufficient)§!"
 SIA_cost_1_5_blocked: "£treasury 1.5 §R(insufficient)§!"
 SIA_cost_3_0_blocked: "£treasury 3.0 §R(insufficient)§!"
 SIA_cost_4_0_blocked: "£treasury 4.0 §R(insufficient)§!"
 SIA_cost_5_0_blocked: "£treasury 5.0 §R(insufficient)§!"
 SIA_cost_7_0_blocked: "£treasury 7.0 §R(insufficient)§!"
 SIA_family_holdings: "Family Holdings"
 SIA_family_holdings_desc: "The Shinawatra family controls significant stakes in telecommunications, satellite services, satellite television and a dozen related businesses. Converting government relationships into dividends is a family tradition, and a revenue stream the party counts on."
 SIA_royal_projects: "Royal Development Projects"
 SIA_royal_projects_desc: "Dispatch royal development teams to rural provinces for demonstration farms, mobile health clinics, watershed management and vocational training. The King's personal prestige accompanies every project, and the village headmen remember who sent them."
 SIA_isoc_surveillance_sweep: "ISOC Surveillance Sweep"
 SIA_isoc_surveillance_sweep_desc: "Dispatch ISOC intelligence teams to sweep mobile networks, village informant networks and border crossing points in the Deep South. Anonymized data, but actionable intelligence."
 SIA_isoc_grid_disruption: "ISOC Network Disruption"
 SIA_isoc_grid_disruption_desc: "Target the funding pipelines, command nodes and courier networks that sustain the insurgency's operational tempo. Every node disrupted is a bomb that does not go off."
 SIA_ds_cordon_and_search: "Cordon and Search"
 SIA_ds_cordon_and_search_desc: "Seal off villages and sweep them house to house for weapons and fighters. It breaks the insurgents' tempo fast, but every kicked-in door and detained relative deepens the grievance the movement feeds on."
 SIA_ds_fund_religious_schools: "Fund the Pondok Schools"
 SIA_ds_fund_religious_schools_desc: "State grants for the Malay-Muslim religious schools and cultural institutions the South holds dear, on the South's own terms. It does little to the violence this week, but it strikes hard at the alienation that sustains it."
 SIA_asean_diplomacy_category: "ASEAN Diplomacy"
 SIA_asean_diplomacy_category_desc: "As chair of the Association, Thailand can set agendas, host summits and broker disputes. Every exercise of the chair builds influence, and goodwill with neighbours who have long memories."
 SIA_asean_rotating_summit: "Host the ASEAN Summit"
 SIA_asean_rotating_summit_desc: "Use Thailand's chairmanship to host a high-profile summit, showcasing Bangkok as the diplomatic capital of Southeast Asia. The resulting goodwill translates into political capital at home and prestige abroad."
 SIA_asean_mediate_myanmar: "Mediate the Myanmar Crisis"
 SIA_asean_mediate_myanmar_desc: "Position Thailand as the honest broker between Myanmar's junta and the international community. A quiet success builds lasting influence in Naypyidaw. A public failure is still a useful signal to the rest of the region."
 SIA_asean_free_trade_push: "Push ASEAN Free Trade Measures"
 SIA_asean_free_trade_push_desc: "Use the chairmanship to push through trade facilitation measures such as customs harmonization, non-tariff barrier reduction, and digital trade corridors. The groundwork takes time, but the export receipts arrive on schedule. ASEAN neighbours take note of Bangkok's constructive leadership."
 SIA_reform_gambits_category: "Reform Gambits"
 SIA_reform_gambits_category_desc: "Political actions available to the reform government."
 SIA_retry_section_112: "Re-table the Amendment"
 SIA_retry_section_112_desc: "The first attempt to reform Section 112 failed in the legislature. The public backlash has been loud, but so has the counter-mobilization of young voters. A second attempt, better prepared and more narrowly drafted, can still pass if the timing is right."
 SIA_ds_autonomy_framework: "Southern Autonomy Framework"
 SIA_ds_autonomy_framework_desc: "Pilot a modest administrative autonomy scheme for the Malay-Muslim provinces, with a regional consultative council, Malay-language official status, and devolved school funding. Not independence, not even close, but enough to demonstrate that Bangkok can listen. Six months to design it, a generation to judge it."
 SIA_isr_persistent_sweep: "ISR Persistent Sweep"
 SIA_isr_persistent_sweep_desc: "Task the Eyes in the Sky assets to a sustained intelligence, surveillance and reconnaissance sweep of the Deep South, tracking border crossing patterns, mobile communications, and vehicle movements. The data degrades the insurgency's freedom of manoeuvre, quietly, and without a single boot on the ground."
 SIA_political_gambits_category: "Political Gambits"
 SIA_political_gambits_category_desc: "Between focuses, the government has tools to manage its political position. Elections called early, ministers reshuffled, and levers pulled. Each gambit has a cost, and the question is whether the payoff justifies it.\n\n§YReform Pressure§!: [?ROOT.SIA_reform_pressure|0]/100. Urban and youth discontent drifting to Move Forward. Vent it with Engage the Reform Movement. Above 60 it spills into protest.\n§YRural Discontent§!: [?ROOT.SIA_rural_discontent|0]/100. Up-country economic mood drifting to Pheu Thai. Cool it with the Rural Development Package."
 SIA_cabinet_reshuffle: "Cabinet Reshuffle"
 SIA_cabinet_reshuffle_desc: "Rotate the ministers, buy off the critics, and remove the weakest performer from the television schedule. One negative political idea removed. The party claims renewal without changing anything that matters."
 SIA_lese_majeste_lever: "Press the Lèse-Majesté Lever"
 SIA_lese_majeste_lever_desc: "Selective enforcement of Section 112 against the most vocal reform critics. Charges filed, bail denied, statements retracted. The opposition loses a voice, and the radicalization index quietly rises among those who notice."
 SIA_coup_watch_category: "The Barracks Are Watching"
 SIA_coup_watch_category_desc: "Every elected populist in Thai history has governed in the army's shadow. Quick wins like telecom favours, padded contracts, and family graft buy money and votes now, but each one raises §YCoup Risk§!. The management levers buy that risk back down, at a price. Let it pass 85 and the §RReassure the High Command§! mission arms. Defuse it, or the tanks roll on Government House.\n\n§YCoup Risk§!: [?ROOT.SIA_coup_risk|0]/100"
 SIA_shin_corp_tax_holiday: "Tailor a Telecom Tax Holiday"
 SIA_shin_corp_tax_holiday_desc: "Quietly rewrite the concession terms so the family telecommunications empire pays almost nothing on its next windfall. The treasury and the party both gain, and the generals add another line to their ledger of grievances."
 SIA_school_milk_contract: "Award the School-Milk Contract"
 SIA_school_milk_contract_desc: "A nationwide free-milk programme for rural schoolchildren, wildly popular in the villages, and routed through a supplier cartel that knows exactly whom to thank. Popularity now, suspicion in the messes later."
 SIA_otpc_tablet_procurement: "Launch One Tablet Per Child"
 SIA_otpc_tablet_procurement_desc: "A glossy scheme to put a tablet in every first-grader's hands. The cameras love it and the party's numbers tick up. The procurement is a kickback machine and everyone in uniform knows it."
 SIA_family_business_favors: "Steer Contracts to the Family Firm"
 SIA_family_business_favors_desc: "Public works, import licences, a port concession or two, all flowing to companies the prime minister's relatives happen to own. Cash for the treasury and the clan, and one more reason for the high command to reach for the phone."
 SIA_court_the_generals: "Court the Generals"
 SIA_court_the_generals_desc: "Discreet budget lines, prestige postings, and a few well-placed promotions. None of it is cheap, but a contented officer corps is a patient one. Lowers coup risk."
 SIA_military_budget_boost: "Approve a Defence Procurement Splurge"
 SIA_military_budget_boost_desc: "Submarines, fighters, a new headquarters wing. Sign off on the army's wish-list and the brass remember who pays the bills. The civilian economy goes a little hungrier for it, but coup risk falls sharply."
 SIA_anti_corruption_gesture: "Throw a Crony to the Prosecutors"
 SIA_anti_corruption_gesture_desc: "Pick an expendable ally, hand the file to the anti-graft commission, and let the cameras roll. The base resents the betrayal and the party's numbers dip, but the officer corps reads it as a government finally minding the rules. Lowers coup risk."
 SIA_promote_loyalists: "Promote Loyal Officers"
 SIA_promote_loyalists_desc: "Reshuffle the annual promotion list to move dependable hands into the commands that matter, the First Army, the King's Guard, the capital garrison. Costs political capital, but puts friendlier men between the government and the tanks. Lowers coup risk."
 SIA_reassure_high_command: "Reassure the High Command"
 SIA_reassure_high_command_desc: "The columns are fuelled and the broadcast script is written. Coup risk has crossed 85 and the army is poised to move. Pull it back below 70 before the timer runs out, through budgets, promotions, or a public reckoning with the cronies, or the tanks roll on Government House."
 SIA_canal_tolls: "Collect Canal Tolls"
 SIA_canal_tolls_desc: "The Kra Canal carries some of the world's highest-value maritime traffic. Toll collection from commercial vessels like container ships, tankers, bulk carriers and cruise liners flows directly into the national treasury every six months."
 SIA_kra_category: "Kra Canal Operations"
 SIA_kra_category_desc: "The Kra Canal requires active naval management. Patrol schedules, transit protocols, and security arrangements for the world's newest strategic chokepoint."
 SIA_kra_construction: "Kra Canal Construction"
 SIA_kra_construction_desc: "The phased works of the great cut at the Kra Isthmus. Each phase must be funded in turn. Neglect invites cost overruns and, on contested ground, sabotage.\nThe great cut proceeds in three funded phases. §YConstruction Progress§!: [?ROOT.SIA_kra_progress|0]%"
 SIA_kra_phase_1: "Phase I, Cut the Isthmus"
 SIA_kra_phase_1_desc: "The first great excavation. Drive the channel through the spine of the peninsula. Fund the phase before the construction season runs out, or the project office will return with an overrun."
 SIA_kra_phase_2: "Phase II, Lock & Channel Works"
 SIA_kra_phase_2_desc: "Line the cut, sink the locks, and build the channel works that will hold back two seas. Keep the treasury behind the schedule or face another overrun."
 SIA_kra_phase_3: "Phase III, Sea Trials"
 SIA_kra_phase_3_desc: "Flood the summit reach, hang the gates, and run the pilots through in ballast. The final phase before the canal can open. Fund it and the megaproject is complete."
 SIA_strait_patrol: "Strait Patrol"
 SIA_strait_patrol_desc: "Deploy Royal Thai Navy vessels on regular patrol of the Kra Canal transit corridor. The presence deters piracy, reassures transit users, and accumulates the operational experience that makes the navy a genuine blue-water force. The prestige of guarding a strategic chokepoint is its own reward."
 SIA_red_path_category: "Village Committee Operations"
 SIA_red_path_category_desc: "Spread the party's organisational presence into rural communities, workplaces, and neighbourhoods. Each committee that takes root strengthens the movement's popular base, and tests the government's tolerance."
 SIA_spread_flame_isaan: "Organise Isaan Villages"
 SIA_spread_flame_isaan_desc: "Deploy party cadres to Isaan villages and district towns. Establish village committees, literacy groups, and cooperative networks. The Northeast is the movement's natural base, so deepen it."
 SIA_spread_flame_north: "Organise Northern Communities"
 SIA_spread_flame_north_desc: "The north has a long history of labour organisation and agrarian radicalism. Party organisers work the hillside cooperatives and timber-industry unions. Growth here breaks the Bangkok-Isaan binary."
 SIA_mass_education_campaign: "Mass Political Education Campaign"
 SIA_mass_education_campaign_desc: "A national curriculum of political education covering labour history, economic theory, and the history of imperialism in Southeast Asia. Run through party-aligned unions, cooperatives, and community centres. The investment costs political capital now. The payoff is a genuinely politically aware constituency."
 SIA_asean_arms_export: "ASEAN Arms Export Contract"
 SIA_asean_arms_export_desc: "Thailand's defence manufacturers have the production capacity and the regional relationships to sustain a recurring export programme. Each annual contract, whether MRAPs, artillery fuses, ammunition batches, or loitering munitions, adds directly to the treasury and deepens Thailand's position as the region's preferred second-tier supplier."
 SIA_defense_export_contract: "Defense Export Contract"
 SIA_defense_export_contract_desc: "With the Defense Export Office standing and the kingdom's arsenals certified for sale, the cabinet can authorize a fresh export contract. Chaiseri First Win vehicles, DTI rockets and munitions, and licence-built systems ship to ASEAN buyers on a recurring basis. The political capital spent securing the deal returns to the treasury as hard export revenue, the defense-industrial wing paying its own way."
 SIA_realm_diplomacy_category: "Regional Rivalry Management"
 SIA_realm_diplomacy_category_desc: "With the Protector of the Realm doctrine in place, the cabinet has approved a series of active counter-influence operations against Thailand's regional rivals."
 SIA_counter_chinese_influence: "Counter Chinese Influence"
 SIA_counter_chinese_influence_desc: "Deploy diplomatic, economic, and informational resources to roll back Beijing's influence in Bangkok's neighbourhood. The operation takes months and carries a cost, but the alternative is acquiescence."
 SIA_counter_indian_influence: "Counter Indian Influence"
 SIA_counter_indian_influence_desc: "New Delhi's soft power in Southeast Asia, from investment to cultural programming to strategic partnerships, has been expanding quietly. A coordinated counter-influence campaign redirects regional partners toward Bangkok."
 SIA_economy_wave3_category: "Strategic Decisions"
 SIA_economy_wave3_category_desc: "High-level economic and security policy choices available to the Thai government."
 SIA_renegotiate_china_contracts: "Renegotiate Chinese Contracts"
 SIA_renegotiate_china_contracts_desc: "The BRI infrastructure contracts built roads and rails Thailand needed, but the financing terms embed Beijing's influence for a generation. The cabinet can accept that dependency or pay the political price to renegotiate the terms."
 SIA_us_security_review: "U.S.-Thailand Security Review"
 SIA_us_security_review_desc: "Washington has requested a formal bilateral security review. The outcome determines whether Thailand deepens its treaty alignment, with the training packages, procurement access, and political visibility that entails, or maintains the strategic hedge."
 SIA_strategic_fuel_reserve: "Build Strategic Fuel Reserve"
 SIA_strategic_fuel_reserve_desc: "Commission a three-month national fuel stockpile in distributed tank farms. The investment smooths price volatility, provides a military logistics buffer, and signals supply-chain resilience to regional partners."
 SIA_anti_corruption_drive: "Anti-Corruption Drive"
 SIA_anti_corruption_drive_desc: "A targeted enforcement campaign against procurement corruption, customs fraud, and the patronage networks embedded in provincial government. Clean contracting is slower at first, and cheaper in the long run."
 SIA_tax_modernization: "Tax System Modernization"
 SIA_tax_modernization_desc: "Replace the Revenue Department's paper-based assessment system with mandatory electronic filing, algorithmic auditing, and yield-based evaluator incentives. The implementation is painful. The permanent efficiency dividend repays the capital cost within five years."
 SIA_gripen_ef_upgrade: "Gripen E/F Contract"
 SIA_gripen_ef_upgrade_desc: "The 12-aircraft Gripen E/F contract, signed in August 2025, represents the RTAF's commitment to a fifth-generation capable fighter. First deliveries are expected in 2029. The contract cements the RTAF's long-term relationship with SAAB and locks in Swedish maintenance support through the 2040s."
 SIA_gripen_ef_upgrade_bonus: "Gripen E/F Integration"
 SIA_coup_risk_increase_tt: "Military confidence in the government falls. Coup risk rises."
 SIA_coup_risk_decrease_tt: "The risk of a military intervention diminishes."
 SIA_coup_risk_reset_tt: "The coup succeeds. Coup risk is reset to zero under military rule."
 SIA_army_patience_exhausted_tt: "The army's patience is exhausted: coup risk above 60, after 1 January 2010."
 SIA_insurgency_intensity_decrease_tt: "Deep South insurgency intensity falls. Continued pressure will suppress the conflict further."
 SIA_insurgency_intensity_increase_tt: "The security situation in the Deep South worsens."
 SIA_ds_force_track_increase_tt: "Military progress toward a forced resolution increases."
 SIA_ds_peace_track_increase_tt: "Negotiation progress toward a peaceful settlement increases."
 SIA_engage_reform_movement: "Engage the Reform Movement"
 SIA_engage_reform_movement_desc: "Open the door rather than the truncheon. Invite the student unions and reform caucus to the table, fund a youth jobs programme, let the cameras see the handshake. Reform pressure falls and the streets quiet, but bringing the movement inside the tent confers exactly the legitimacy it was denied, and the Move Forward Party gains a little ground for it."
 SIA_rural_development_package: "Rural Development Package"
 SIA_rural_development_package_desc: "Village funds, a rice price floor, farm-debt relief and a new road to the district town. The treasury pays, and the up-country mood that feeds the populist machine cools for a season."
 SIA_realignment_category: "Political Realignment"
 SIA_palace_bargain: "Strike a Palace Bargain"
 SIA_palace_bargain_desc: "Quietly bring the network-monarchy establishment into power as the senior partner. A negotiated pivot toward the royalist order without tanks in the street, and the price is your own party's primacy."
 SIA_face_the_court: "Face the Constitutional Court"
 SIA_face_the_court_desc: "Let the judges rule on the ruling party's fate, as they have for two decades. Either submit to a dissolution and hand power to your rivals, or defy the bench and pay in stability and the army's patience."
 SIA_pack_the_senate: "Pack the Senate"
 SIA_pack_the_senate_desc: "Stuff the upper house and the independent agencies with loyalists, entrenching the ruling party against every check. A potent consolidation of power that the high command reads as a naked grab. Coup risk climbs sharply."
 SIA_trunk_entry_tt: "Only one political path can be pursued at a time. A change in the ruling party reopens the choice, and lets another path's focus tree be taken up."
 SIA_telecom_excise_favor: "The Telecom Excise Switch"
 SIA_telecom_excise_favor_desc: "Convert the telecom concession fees into an excise tax, structured so the family-owned AIS keeps its lead and new entrants inherit the burden. The treasury and a grateful corporate base both reward you. The high command notes that the state is being run for one family's balance sheet. §RCoup risk rises.§!"
 SIA_exim_myanmar_loan: "EXIM Loan to Rangoon"
 SIA_exim_myanmar_loan_desc: "Extend a soft state loan to the Myanmar junta, earmarked, conveniently, to buy satellite and telecom services from the family's own Shin Satellite. A foreign-policy gesture that doubles as a tidy contract for the family firm. A textbook conflict of interest the generals do not miss. §RCoup risk rises.§!"
 SIA_state_lottery_scheme: "The Government Lottery"
 SIA_state_lottery_scheme_desc: "Fold the vast underground numbers game into a state scheme. A river of off-budget cash for patronage and pet projects, and popular with the punters besides, but also exactly the kind of unaccountable slush fund a coup manifesto loves to itemise. §RCoup risk rises.§!"
 SIA_democrat_machine_category: "The Party Machine"
 SIA_democrat_machine_category_desc: "The Democrats' edge is organisation, but Thaksin's machine is always one rural landslide from returning to power. Work the constituencies to hold the line.\n\n§YPopulist Tide§!: [?ROOT.SIA_pheu_thai_pressure|0]/100. Pheu Thai's pull on the electorate, fuelled by rural discontent. A high tide lifts the populists toward the majority that unseats you. Push it down with the levers below."
 SIA_constituency_machine: "Work the Constituencies"
 SIA_constituency_machine_desc: "Send the members down to the wards to open surgeries, fix the drains, settle the disputes, and remember the names. Unglamorous retail politics that trades a little stability for a steady, durable gain in the party's standing. §YDemocrat Party popularity rises§! and the populist tide eases."
 SIA_pt_pressure_increase_tt: "§RThe populist tide rises.§!"
 SIA_pt_pressure_decrease_tt: "§GThe populist tide recedes.§!"
 SIA_match_the_populists: "Match the Populists"
 SIA_match_the_populists_desc: "If you cannot beat the village fund, build a better one. Co-opt the populist programme of cheap healthcare, debt relief, and rural credit under a Democrat banner. It drains the treasury, but it takes the wind out of Pheu Thai's sails. §GPheu Thai's support falls, the Democrats gain, and the tide recedes.§!"
 SIA_expose_corruption: "Expose the Network"
 SIA_expose_corruption_desc: "Turn the anti-corruption agencies and the courts on the populist machine with asset cases, vote-buying probes, and the slow legal strangulation that has unseated more than one Thaksinite government. Costs political capital, and knocks Pheu Thai's standing back. §GThe populist tide recedes.§!"
 SIA_broaden_the_coalition: "Broaden the Coalition"
 SIA_broaden_the_coalition_desc: "Hand ministries to the small parties and provincial bosses in exchange for their seats. The price is a fractious, horse-trading cabinet (§Rthe coalition's demands§!), but it builds a parliamentary firewall no single populist landslide can breach. §GThe populist tide recedes sharply.§!"
 SIA_counter_messaging: "Counter the Populist Message"
 SIA_counter_messaging_desc: "Rebut the populist line where it lands, on the morning talk shows, the line-village loudspeakers, and the union halls. A modest, repeatable PR push that chips a little off Pheu Thai's momentum. §GThe populist tide eases slightly.§!"
 SIA_reconstruction_category: "Develop the Recovered Lands"
 SIA_reconstruction_category_desc: "Territory taken on the Western Frontier or the ASEAN hegemony campaigns is held but not yet integrated. Pacify the provinces, pour reconstruction money into them, and once they are quiet enough, claim them for the nation outright."
 SIA_reconstruction_pacify: "Pacify the Provinces"
 SIA_reconstruction_pacify_desc: "Flood the occupied provinces with administrators, informants, and amnesty programs. Compliance rises across every province we hold but have not yet integrated. Slow, patient work, but it is the ground everything else is built on."
 SIA_reconstruction_develop: "Fund Reconstruction Works"
 SIA_reconstruction_develop_desc: "Release reconstruction money for roads, power, and public works across the recovered lands. Infrastructure and building slots rise in every held province, binding them to the national economy and giving the population a stake in Thai rule."
 SIA_reconstruction_integrate: "Proclaim the Reunified Provinces"
 SIA_reconstruction_integrate_desc: "Where compliance is high enough, the occupation ends and the provinces become Thai soil. Every pacified province we hold is cored into the Kingdom, a permanent gain that no peace conference can undo."
 SIA_ghosts_5pct_tt: "The Communist Party must hold at least 5% of the popular vote."
 SIA_reform_5pct_tt: "The Future Forward Party must hold at least 5% of the popular vote."
 SIA_reform_in_power_tt: "The Future Forward Party must be the ruling party. Win it at the ballot box."
 SIA_seize_power_gate_tt: "Win the general strike so the government capitulates, or commit to the armed struggle first."
 SIA_strike_momentum_tt: "Strike momentum rises. At 100 the government capitulates."
 SIA_general_strike_category: "The General Strike"
 SIA_general_strike_category_desc: "The country is at a standstill and the movement is pressing for the government to fall. Drive strike momentum to 100 before the 180 days run out and the government capitulates on a peaceful road to power. Fall short and the army crushes the strike in a coup.\n\n§RStrike Momentum§!: [?ROOT.SIA_strike_momentum|0]/100"
 SIA_strike_mass_pickets: "Mass Pickets"
 SIA_strike_mass_pickets_desc: "Put tens of thousands on the picket lines and hold the squares day after day. Cheap and fast, the daily muscle that keeps the country shut and the pressure climbing."
 SIA_strike_paralyze_transport: "Paralyse the Ports and Rails"
 SIA_strike_paralyze_transport_desc: "Fund the dockers and railwaymen from the strike fund so the arteries of the economy seize up entirely. The heaviest blow the movement can land, and the costliest to sustain."
 SIA_strike_win_the_conscripts: "Win Over the Conscripts"
 SIA_strike_win_the_conscripts_desc: "Send organizers into the barracks and the conscript ranks. Every soldier who will not fire on his own people makes the generals' threat of force ring that much more hollow, and brings capitulation closer."
