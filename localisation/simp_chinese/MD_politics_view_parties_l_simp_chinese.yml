 KYR.conservatism: "£KYR_western_conservative 共和国-祖国"
 KYR.conservatism_icon: "£KYR_western_conservative"
 KYR.conservatism_desc: "共和国-阿塔朱尔特是吉尔吉斯斯坦的一个政党，由共和国和阿塔朱尔特党合并后成立。该政党的主要目标是通过旨在增强国家民主和提高官僚机构透明度的改革来发展自由主义。"
 KYR.liberalism: "£KYR_western_liberal 发展-进程"
 KYR.liberalism_icon: "£KYR_western_liberal"
 KYR.liberalism_desc: "发展-进程是吉尔吉斯斯坦的一个政党，由巴基特·托罗巴耶夫领导。就其在意识形态和政治领域的地位而言，发展-进程是一个中间派政党。该党主张私有财产、市场经济以及发展政治、政党和经济竞争。"
 KYR.socialism: "£generic_socialism_small 民主力量联盟"
 KYR.socialism_desc: "民主力量联盟是吉尔吉斯斯坦的一个政党，成立于1989年，是几个反对共产主义政府的政治组织的联盟。联盟转变为同名的单一统一政党。"
 KYR.Conservative: "£KYR_emerging_reactionary 社会民主党"
 KYR.Conservative_icon: "£KYR_emerging_reactionary"
 KYR.Conservative_desc: "吉尔吉斯斯坦社会民主党是吉尔吉斯斯坦的一个政党。成员于1993年10月1日组建该党，但直到1994年12月16日才在司法部登记。阿布迪加尼·埃尔克巴耶夫担任该党第一任主席。阿尔马兹别克·阿坦巴耶夫于1999年7月30日接替了他。该党的大多数成员来自该国的企业家。"
 KYR.anarchist_communism: "£KYR_anarchist_communism 统一"
 KYR.anarchist_communism_icon: "£KYR_anarchist_communism"
 KYR.anarchist_communism_desc: "统一党，正式名称为国家统一与爱国主义政党‘统一’，是吉尔吉斯斯坦的一个自由派政党。它的领导者是阿尔腾别克·苏莱曼诺夫。该党被描述为‘知名度低’。"
 KYR.Neutral_conservatism: "£KYR_non_aligned_conservative 吉尔吉斯斯坦党"
 KYR.Neutral_conservatism_icon: "£KYR_non_aligned_conservative"
 KYR.Neutral_conservatism_desc: "吉尔吉斯斯坦是吉尔吉斯斯坦同名的中间派政党。它是由前共和国议会议员卡纳特别克·伊萨耶夫建立的。它被视为‘完全不关心政治’，并专注于支持吉尔吉斯斯坦总统索隆拜·热恩别科夫的政府。"
 KYR.neutral_Social: "£KYR_non_aligned_socialist_democrat 祖国"
 KYR.neutral_Social_icon: "£KYR_non_aligned_socialist_democrat"
 KYR.neutral_Social_desc: "祖国社会党是吉尔吉斯斯坦的一个社会民主党。其现任主席兼创始人是吉尔吉斯斯坦议会前议长奥穆尔别克·特克巴耶夫。在特克巴耶夫（以及更温和的党员）和保守的埃尔金吉尔吉斯斯坦党之间分裂后，该党于1992年12月16日注册。祖国社会党最终进入了政治光谱的中左翼。"
 KYR.Neutral_green: "£generic_Neutral_green_small 吉尔吉斯斯坦农工党"
 KYR.Neutral_green_desc: "吉尔吉斯斯坦农业工党是一个由工人和农民、共和国基础设施劳动者组成的自愿、社会和政治组织，团结起来保护工人（农业、畜牧产品加工者）的社会权利和切身利益而村民，他们的自由民主价值观的基础上，转变了产业经济和生活方式。"
 KYR.Nat_Autocracy: "£KYR_nationalist_military_junta 吉尔吉斯共和国武装力量"
 KYR.Nat_Autocracy_icon: "£KYR_nationalist_military_junta"
 KYR.Nat_Autocracy_desc: "吉尔吉斯共和国武装部队是吉尔吉斯斯坦的国家军队。它最初由驻扎在新独立的吉尔吉斯斯坦的前苏联突厥斯坦军区部队组成。它由陆军、空军和国民警卫队组成。武装部队的附属安全部队包括内卫部队、国家安全国家委员会和边防部队。"
 KYR.Nat_Populism: "£KYR_nationalist_right_wing_populist 联合吉尔吉斯斯坦"
 KYR.Nat_Populism_icon: "£KYR_nationalist_right_wing_populist"
 KYR.Nat_Populism_desc: "全吉尔吉斯斯坦是吉尔吉斯斯坦的一个民族主义政党。它通常在该国南部更受欢迎。该党由阿达汗·马杜马罗夫领导。它带有民族主义意识形态并支持总统制政府。该党最初成立的目的是为了支持在俄罗斯的吉尔吉斯移民劳工。"
 LAO.Neutral_Communism: "£generic_Neutral_Communism_small (LPRP) 老挝人民革命党  - （改革派）"
 LAO.Neutral_Communism_desc: "（改革派共产主义） - 老挝人民革命党于1955年由印度支那共产党发展而来，迅速与北越共产党政府结盟，并对当时的旧王国发动了起义。受苏联马克思列宁主义思想和越南胡志明思想的影响，该党最终建立了一种融合两者思想的社会主义制度。随着社会主义阵营的瓦解，该党被迫在国内推行改革，但与邻国越南不同的是，老挝政府为了保持更大的控制力，对大多数改革措施进行了限制。"
 LAO.Nat_Autocracy: "£generic_Nat_Autocracy_small (LPAF)老挝人民军"
 LAO.Nat_Autocracy_desc: "（红色军政府） - 老挝人民武装力量的前身是推翻君主制的亲共革命运动和民兵组织，自成立以来，其在国内和国外卷入的冲突相对较少。与邻国中华人民共和国和越南一样，老挝人民革命党在军队中拥有广泛的影响力，并与各方建立了正式和非正式的意识形态和经济联系。"
 LAO.Monarchist: "£generic_Monarchist_small 澜沧洪考王朝"
 LAO.Monarchist_desc: "（专制君主主义） - 老挝君主制从1904年至1975年统治老挝，其统治基于当时东南亚普遍存在的传统权力结构：一种权力分散、略带世俗色彩的君主制。君主制被推翻后，王室成员大多移居法国，主要过着流亡生活。与邻国柬埔寨的情况类似，老挝王室的几位成员，特别是“红色王子”苏发努冯 - 老挝社会主义国家的首任总统 - 加入了社会主义事业，他们的后代至今仍主要生活在老挝。"
 LAT.conservatism: "£LAT_western_conservative (JL) -  新时代党"
 LAT.conservatism_desc: "(保守自由主义) - 新时代党\n\n新时代党是一个自由民粹主义政党，由中央银行家兼颇受欢迎的政治家埃纳尔斯·雷普舍创立。该党主张打击腐败和寡头政治，但由于其强硬的民粹主义言论，该党发现很难与其他政治家进行谈判。"
 LAT.liberalism: "£LAT_western_liberal (LC)  - 拉脱维亚道路"
 LAT.liberalism_desc: "(自由保​​守主义) - 拉脱维亚道路\n\n拉脱维亚道路是由人民阵线积极分子于1993年创立的自由主义政党。该党在拉脱维亚首次民主选举中占据主导地位，并在整个九十年代一直是主要的自由主义力量。该党倡导民主化和个人权利，并且是自由国际和欧洲自由民主联盟的成员。"
 LAT.socialism: "£LAT_western_social (LSDSP)  - 拉脱维亚社会民主工人党"
 LAT.socialism_desc: "(社会民主主义) - 拉脱维亚社会民主工人党\n\n拉脱维亚社会民主工人党是拉脱维亚历史最悠久的政党之一，成立于1918年，由俄罗斯社会民主工人党分裂而来。在独裁统治之前，该党主导着拉脱维亚政坛。拉脱维亚被吞并后，党员们移居其他国家，并在那里组织了拉脱维亚社会民主工人党的分支机构。拉脱维亚恢复独立后，党员们返回祖国，重新注册成立了拉脱维亚社会民主工人党。该党倡导社会民主立场，支持社会平等，并大力投资于社会福利事业。"
 LAT.Western_Autocracy: "£LAT_western_autocracy (LPP) -  拉脱维亚第一党"
 LAT.Western_Autocracy_desc: "(基督教保守主义) - 拉脱维亚第一党\n\n拉脱维亚第一党是一个由基督教活动家和天主教教会人士创立的保守党派。该党融合了宗教和民粹主义的言论，倡导传统价值观和社会福利。"
 LAT.anarchist_communism: "£LAT_anarchist_communism (SDLP)  - 社会民主福利党"
 LAT.anarchist_communism_desc: "(社会民主主义) - 社会民主福利党\n\n社会民主福利党由商人尤里斯·茹拉夫洛夫斯创立。该党倡导社会民主立场，并与亲俄政党合作。"
 LAT.Neutral_conservatism: "£LAT_neutral_conservative (TP) -  人民党"
 LAT.Neutral_conservatism_desc: "(民族保守主义) - 人民党\n\n人民党是拉脱维亚的主要政党之一，成立于1998年。该党在社会和经济方面持保守观点，是欧洲人民党的成员。"
 LAT.oligarchism: "£LAT_oligarchism (KP) -  俄罗斯党"
 LAT.oligarchism_desc: "(俄罗斯少数族裔利益) - 俄罗斯党\n\n俄罗斯党是一个成立于1989年的政党，最初是拉脱维亚最高苏维埃的“平等”派别。1993年，该派别转型为政党，最初名为“民主倡议中心”，后来更名为现名，并将代表俄罗斯少数民族的利益放在首位。"
 LAT.neutral_Social: "£LAT_neutral_socialism (SDP)  - 社会民主党"
 LAT.neutral_Social_desc: "(社会民主主义) - 社会民主党\n\n社会民主党是一个左翼政党，由拉脱维亚社会主义党分裂而来。社会民主党的支持者认为拉脱维亚社会主义党不应与亲俄政党结盟，因此成立了社会民主党。有趣的是，社会民主党成立后，却与亲俄政党组成了联合政府。"
 LAT.Neutral_Libertarian: "£LAT_neutral_libertarian (LPP)  - 拉脱维亚海盗党"
 LAT.Neutral_Libertarian_desc: "(海盗政治) - 拉脱维亚海盗党\n\n拉脱维亚海盗党是国际海盗党运动的一部分，倡导海盗运动的基本纲领，其中包括加强公民权利、专利和版权改革。"
 LAT.Neutral_Autocracy: "£LAT_neutral_autocracy (ZZS)  - 绿党和农民联盟"
 LAT.Neutral_Autocracy_icon: "£LAT_neutral_autocracy"
 LAT.Neutral_Autocracy_desc: "(农业保守主义) - 绿党和农民联盟\n\n绿党和农民联盟是拉脱维亚最具影响力的选举联盟之一，其基础是拉脱维亚农民联盟。该联盟持中间偏右的保守立场，支持对农业的投资。此外，该联盟自视为农业的捍卫者，倡导更多地关注私人农场和传统农业，认为它们更加环保。"
 LAT.Neutral_green: "£LAT_neutral_green (LZS)  - 拉脱维亚绿党"
 LAT.Neutral_green_icon: "£LAT_neutral_green"
 LAT.Neutral_green_desc: "(绿色保守主义) - 拉脱维亚绿党\n\n拉脱维亚绿党起源于苏联时期拉脱维亚的各种小型环保组织。1990年，该党由环境保护俱乐部的代表注册成立，成为拉脱维亚苏维埃社会主义共和国第一个注册政党。苏联解体后，拉脱维亚绿党在拉脱维亚最高苏维埃中赢得七个席位。拉脱维亚宪法恢复、议会重建后，该党定期参加选举。拉脱维亚绿党自称中间偏右，支持保守主义和环保理念；该党也经常与民族主义组织和政党合作。"
 LAT.Nat_Autocracy: "£LAT_military_junta (NBS)  - 拉脱维亚国家武装力量"
 LAT.Nat_Autocracy_desc: "（军政府） - 拉脱维亚国家武装力量\n\n拉脱维亚国家武装部队历史悠久，其历史可追溯至20世纪10至20世纪，当时它是第一共和国的武装力量。苏联解体后，国家武装部队得以重建，如今是新成立的拉脱维亚共和国的一部分。武装部队的任务是捍卫拉脱维亚主权，抵御敌对国家的侵略，并参与国际行动。"
 LAT.Nat_Populism: "£LAT_national_populist (TB/LNNK) - 为了祖国与自由党/拉脱维亚民族独立运动"
 LAT.Nat_Populism_desc: "(民族保守主义) - 为了祖国与自由党/拉脱维亚民族独立运动\n\n为了祖国与自由党/拉脱维亚民族独立运动是1993年由“祖国党”和“11月18日联盟”合并而成的主要民族主义政党。合并后不久，该党又组建了“祖国与自由党”，随后与拉脱维亚民族独立运动合并。该党起源于起义解放运动，独立后不久便涌现出多个政党。为了祖国与自由党/拉脱维亚民族独立运动主张建立单一民族国家，维护传统价值观，并支持经济自由化。"
 LBA.conservatism: "£LBA_conservatism 祖国联盟"
 LBA.conservatism_desc: "（地区主义） - 祖国联盟党是一个反卡扎菲主义政党，由阿卜杜拉赫曼·塞维利创立，他是的黎波里塔尼亚共和国创始人之一拉马丹·阿斯韦利的孙子，该党反对意大利殖民主义。该党主张法国式总统制和国家权力下放，但不支持联邦化。"
 LBA.liberalism: "£LBA_liberalism (NPDW) - 国家发展与福利党"
 LBA.liberalism_desc: "（自由主义） - 国家发展与福利党\n\n国家发展与福利党是一个小党，由利比亚前外交官、流亡者阿里·齐丹创立。"
 LBA.liberalism_icon: "£LBA_liberalism"
 LBA.socialism: "£generic_socialism_small (LNDF) - 利比亚民族民主阵线"
 LBA.socialism_desc: "（民族民主主义） - 利比亚民族民主阵线\n\n利比亚民族民主阵线是由几位著名的利比亚政治流亡人士在美国创立的政治组织。该组织倡导穷人和中产阶级的权利、绝对的国家独立和民主的政府形式。"
 LBA.Conservative: "£LBA_Conservative (LPNM) - 利比亚人民民族运动"
 LBA.Conservative_desc: "（卡扎菲效忠主义） - 利比亚人民民族运动\n\n利比亚人民民族运动由赫韦尔迪·哈梅迪少将在卡扎菲政权垮台后创立。哈梅迪是卡扎菲统治时期最亲密的盟友之一，他的女儿嫁给了卡扎菲的儿子。该运动的主要目标是修复利比亚内战造成的破坏，使一切恢复到内战从未发生过的状态。"
 LBA.Conservative_icon: "£LBA_Conservative"
 LBA.Autocracy: "£LBA_Autocracy_small (GPC) - 全国人民委员会"
 LBA.Autocracy_desc: "（第三国际理论） - 全国人民委员会\n\n利比亚全国人民委员会是该国的最高行政机构。它由全国人民大会的成员选举产生，而全国人民大会的成员则由基层人民大会（地方政府）选举产生。虽然理论上这是一种自下而上的领导人选举方式，但实际上，行政控制权掌握在卡扎菲及其核心圈子手中。"
 LBA.Autocracy_icon: "£LBA_Autocracy_small"
 LBA.Autocracy_democracy: "£LBA_Autocracy_democracy (ASU) - 阿拉伯社会主义联盟"
 LBA.Autocracy_democracy_desc: "（第三国际理论）- 阿拉伯社会主义联盟\n\n随着利比亚民主的建立，卡扎菲回归了他的根源。在他通过政变夺取政权之前，阿拉伯社会主义联盟是他的政党名称。阿拉伯社会主义联盟在意识形态上与埃及纳赛尔主义的阿拉伯社会主义联盟党非常接近。"
 LBA.Autocracy_democracy_icon: "£LBA_Autocracy_democracy"
 LBA.Autocracy_comeback: "£LBA_Autocracy_comeback (PFLL) - 利比亚人民解放阵线"
 LBA.Autocracy_comeback_desc: "（第三国际理论） - 利比亚人民解放阵线\n\n随着穆阿迈尔·卡扎菲的倒台，他的儿子继承了他的事业，组建了一个效忠卡扎菲的政党。利比亚解放人民阵线的目标是将利比亚从外国敌对势力资助的恐怖组织手中解放出来，并使利比亚重新走上穆阿迈尔·卡扎菲的第三国际理论道路。"
 LBA.Autocracy_comeback_icon: "£LBA_Autocracy_comeback"
 LBA.Kingdom: "£LBA_Kingdom (HP) - 祖国党"
 LBA.Kingdom_desc: "（伊斯兰民主） - 祖国党\n\n祖国党是一个伊斯兰主义政党，由萨拉菲派教士阿里·萨拉比领导。萨拉比曾被利比亚当局拘留并监禁8年，之后前往沙特阿拉伯进行宗教研究。祖国党的目标是改革利比亚宪法，使其以伊斯兰教法为基础。"
 LBA.Kingdom_icon: "£LBA_Kingdom"
 LBA.Caliphate: "£LBA_Caliphate (LIFG) - 利比亚伊斯兰战斗组织"
 LBA.Caliphate_desc: "（萨拉菲圣战主义） - 利比亚伊斯兰战斗组织\n\n利比亚伊斯兰战斗组织由苏联入侵后从阿富汗返回的利比亚战士创立。该组织据称与基地组织有关联，其目标是推翻卡扎菲政权，在利比亚建立伊斯兰国家。1996年，该组织对卡扎菲发动了一次未遂的暗杀行动，此后一直受到卡扎菲政权的持续打压。"
 LBA.Caliphate_icon: "£LBA_Caliphate"
 LBA.Neutral_Muslim_Brotherhood: "£LBA_Neutral_Muslim_Brotherhood (JCP) - 正义与建设党"
 LBA.Neutral_Muslim_Brotherhood_desc: "（伊斯兰民主主义）- 正义与建设党\n\n正义与建设党是穆斯林兄弟会在利比亚的本土政党。该党与穆斯林兄弟会的目标和原则一致。"
 LBA.Neutral_Muslim_Brotherhood_icon: "£LBA_Neutral_Muslim_Brotherhood"
 LBA.Neutral_Autocracy: "£LBA_Neutral_Autocracy (NFA) - 全国力量联盟"
 LBA.Neutral_Autocracy_desc: "（自由主义） - 全国力量联盟\n\n全国力量联盟是一个（至少以利比亚的标准来看）较为自由的政党。它由穆阿迈尔·卡扎菲的经济顾问、卡扎菲之子赛义夫·伊斯兰的门生马哈茂德·吉卜里勒创立。尽管名义上是自由派和改革派，但由于该党与卡扎菲政权关系密切，且吉卜里勒有将政治职位安插到亲朋好友手中的倾向，许多人对该党抱有疑虑。"
 LBA.Neutral_Autocracy_icon: "£LBA_Neutral_Autocracy"
 LBA.Neutral_conservatism: "£LBA_Neutral_conservatism (NFSL) - 拯救利比亚民族阵线"
 LBA.Neutral_conservatism_desc: "（反卡扎菲主义）- 拯救利比亚民族阵线\n\n拯救利比亚民族阵线是利比亚境内的一个反卡扎菲反对派组织。该组织由利比亚政治家和乍得-利比亚战争老兵组成，最初是一个武装组织。然而，在20世纪80年代针对卡扎菲本人的袭击失败后，该组织转向了更为和平的策略。"
 LBA.Neutral_conservatism_icon: "£LBA_Neutral_conservatism"
 LBA.Neutral_conservatism_democracy: "£LBA_Neutral_conservatism_democracy (NFP) - 全国阵线党"
 LBA.Neutral_conservatism_democracy_desc: "（进步主义） - 全国阵线党\n\n全国阵线党是利比亚救国民族阵线的政治继承者。虽然该党是利比亚最自由的政党之一，但它仍然坚持伊斯兰教应作为治理国家的指导原则。"
 LBA.Neutral_conservatism_democracy_icon: "£LBA_Neutral_conservatism_democracy"
 LBA.Neutral_Libertarian: "£LBA_Neutral_Libertarian (DP) - 民主党"
 LBA.Neutral_Libertarian_desc: "（自由主义） - 民主党\n\n民主党是一个规模较小的自由派世俗政党。它支持政教分离，并在其党纲中包含多项亲以色列政策。"
 LBA.Neutral_Libertarian_icon: "£LBA_Neutral_Libertarian"
 LBA.neutral_Social: "£LBA_neutral_Social (EM) - 正义运动"
 LBA.neutral_Social_desc: "（社会民主主义） - 正义运动\n\n正义运动是利比亚的一个社会民主党。该党倡导工人权利、世俗主义、女权主义和解散民兵组织。它希望以北欧模式为蓝本，建立利比亚的社会民主制度。"
 LBA.neutral_Social_icon: "£LBA_neutral_Social"
 LBA.Nat_Fascism: "£LBA_Nat_Fascism (LNM) - 利比亚民族运动"
 LBA.Nat_Fascism_desc: "（伊拉克复兴党）- 利比亚民族运动\n\n利比亚民族运动党由一名复兴党律师于1980年创立，是一个反卡扎菲的反对派组织。尤其是在成立初期，该党从伊拉克复兴党获得了大量资金。"
 LBA.Nat_Fascism_icon: "£LBA_Nat_Fascism"
 LBA.Nat_Autocracy: "£generic_Nat_Autocracy_small (AFLAJ) - 利比亚武装力量"
 LBA.Nat_Autocracy_desc: "（军政府） - 利比亚武装力量\n\n利比亚阿拉伯民众国武装部队是负责保卫利比亚的主要力量。在卡扎菲统治时期，军队分为正规军和革命卫队。后者装备精良，主要负责监督正规军，使其保持警惕。"
 LBA.Monarchist: "£LBA_Monarchist (HoS) - 赛努西王室"
 LBA.Monarchist_desc: "（部落君主主义） - 赛努西王室\n\n二战后，塞努西王朝在伊德里斯国王的统治下接管了利比亚的政权。君主制一直持续到1969年，被卡扎菲发动政变推翻。王室成员最初被监禁，后于1988年流亡英国。如今，塞努西王室在利比亚仍然拥有一定的支持，其成员也积极参与反对卡扎菲统治的活动。"
 LBA.Monarchist_icon: "£LBA_Monarchist"
 LEB.conservatism: "£LEB_western_conservatism (LF) 黎巴嫩力量"
 LEB.conservatism_desc: "（基督教民主主义） - 黎巴嫩力量党最初由以色列扶植的黎巴嫩前独裁者巴希尔·杰马耶勒创立，旨在协调各种亲基督教政党、民兵组织和其他团体，使其团结一致。党内冲突以及内战及其后续事件导致该运动分裂，原有的政党和团体再次分裂。内战结束后，该党重建，但在叙利亚占领期间仍被取缔。"
 LEB.liberalism: "£LEB_liberalism (FM) 未来运动"
 LEB.liberalism_desc: "（古典自由主义）- 未来运动最初于1995年以联盟形式成立，并以其创始人萨阿德·哈里里的名字命名，该党奉行温和的自由主义和民族主义观点。与黎巴嫩的许多政党一样，未来运动本身也是围绕特定的族裔或宗教群体建立的，代表着该国的逊尼派穆斯林。"
 LEB.socialism: "£LEB_social_democratism (PSP)进步社会党"
 LEB.socialism_desc: "（民主社会主义） - 与德鲁兹派关系密切的进步社会党自诩为代表黎巴嫩全体民众的左翼政党，倡导世俗主义、进步主义，并反对黎巴嫩的既得利益集团。在黎巴嫩内战期间，该党拿起武器对抗以色列支持的马龙派政府，与黎巴嫩人民解放军和叙利亚军队等组织并肩作战，夺取领土。内战结束后，该党的影响力进一步扩大，在组建执政联盟方面发挥了重要作用，并在初期支持叙利亚对黎巴嫩的占领。"
 LEB.Western_Autocracy: "£LEB_pro_western_autocratism (NB) 国家联盟"
 LEB.Western_Autocracy_desc: "（民族自由主义） - 黎巴嫩民族联盟成立于1946年，此前已作为选举联盟存在多年。该党奉行自由主义政策和立场，倡导减少贫困、维护人权、捍卫自由民主和世俗主义。在黎巴嫩内战期间，该党拒绝选边站队或参与战争，公开反对以色列和叙利亚，甚至呼吁国际社会谴责侵犯黎巴嫩主权的行为。历史上，该党一直持亲西方（亲法）立场，并致力于进一步加强黎巴嫩与既定国际秩序的联系。"
 LEB.Conservative: "£LEB_reactionism 联盟党"
 LEB.Conservative_desc: "（右翼纳赛尔主义） - 该党最初名为“复兴革命党”，于1990年更名为现名。它是一个世俗政党，名义上信奉泛阿拉伯的纳赛尔主义意识形态 - 传统上立场温和进步，坚定地偏左翼。由于该党在选举中鲜有建树，且黎巴嫩国内形势特殊，因此对政治影响甚微。该党与叙利亚、伊朗甚至卡塔尔保持着联系，寻求外国支持和援助以开展活动。"
 LEB.Autocracy: "£SYR_Autocracy 黎巴嫩阿拉伯复兴社会党"
 LEB.Autocracy_desc: "（新复兴党）- 黎巴嫩阿拉伯复兴社会党，又称“黎巴嫩地区分支”，是该组织在黎巴嫩的分支机构。该党奉行新复兴主义，与叙利亚以及名义上较为左翼的复兴主义派别关系密切。在黎巴嫩内战期间，该党与左翼政党并肩作战，并支持叙利亚对黎巴嫩的干预和占领。"
 LEB.Vilayat_e_Faqih: "£generic_Vilayat_e_Faqih_small 真主党"
 LEB.Vilayat_e_Faqih_desc: "（霍梅尼主义）- 真主党深受伊朗伊斯兰革命的影响，奉行激进的什叶派教义，宣扬圣战主义、极端保守主义、强烈的反西方情绪和泛伊斯兰思想。自上世纪90年代以来，真主党在黎巴嫩日益壮大，部分原因是黎巴嫩政局不稳，以及以色列和伊朗等国试图在该地区施加影响。由于其日益增长的影响力、规模和势力范围，真主党吸引了多元化的支持群体 - 尽管有人认为其意识形态立场不如其宣言那样明确 - 但其领导层和实际政策仍然与更为原教旨主义的伊斯兰教保持一致。"
 LEB.Mod_Vilayat_e_Faqih: "£LEB_moderate_shiite_revolutionary 阿迈勒运动"
 LEB.Mod_Vilayat_e_Faqih_desc: "（民粹自由主义）- 阿迈勒运动代表黎巴嫩什叶派社群，奉行温和的自由主义纲领，倡导世俗主义和民族主义，同时明确代表什叶派社群。内战期间，它是较为重要的什叶派民兵组织之一，甚至与后来成为其更激进、更右翼对手的真主党作战。"
 LEB.anarchist_communism: "£generic_anarchist_communism_small (ADP) 阿拉伯民主党"
 LEB.anarchist_communism_desc: "（新复兴党）- 黎巴嫩民主党起源于阿拉维派青年运动，是黎巴嫩一个亲叙利亚的政党，其意识形态与曾经盛行的复兴党运动相近。历史上，该党即使在内战期间也寻求与左翼政党结盟并肩作战，但始终保持着与叙利亚的联系，并渴望与这个被视为其母国的国家实现统一。"
 LEB.Caliphate: "£generic_Caliphate_small 游击队联盟"
 LEB.Caliphate_desc: "（萨拉菲主义）- 游击队联盟（又称阿斯巴特·安萨尔）是一个萨拉菲主义组织，主张推翻黎巴嫩政府。该组织成立于20世纪90年代，主要在难民营中寻找支持者，规模较小，但其激进的意识形态以及与基地组织的联系使其在黎巴嫩和国外都被认定为恐怖组织。"
 LEB.Kingdom: "£generic_Kingdom_small 伊斯兰解放党"
 LEB.Kingdom_desc: "（新反动伊斯兰主义）- 一个名为“解放党”的国际运动主张建立一个在严格的伊斯兰教法统治下统一的全球哈里发国。它反对自由民主、自由资本主义、社会主义、共产主义以及现代主义本身。由于其观点激进且与其他伊斯兰圣战组织截然不同，它对世界最终状态的愿景相当模糊。"
 LEB.Neutral_conservatism: "£LEB_non_aligned_conservatism 自由爱国运动"
 LEB.Neutral_conservatism_desc: "（基督教民主主义）- 自由爱国运动成立于1994年，是黎巴嫩的一个政党，代表马龙派天主教徒。在叙利亚占领期间，该党没有参与选举政治，而是主要在流亡中开展活动。"
 LEB.oligarchism: "£LEB_oligarchism (NDP) 全国对话党"
 LEB.oligarchism_desc: "（古典自由主义）- 全国对话党主要倡导世俗主义和自由主义，同时也致力于选举改革和政府内部的“透明化”。该党由商人福阿德·马赫祖米于2004年创立。"
 LEB.neutral_Social: "£LEB_socialist_democratism 塔什纳克/亚美尼亚革命联盟"
 LEB.neutral_Social_desc: "（民主社会主义）- 黎巴嫩亚美尼亚革命联盟的当地名称为塔什纳克党，可能是黎巴嫩最大的政党，代表着亚美尼亚人的利益。该党秉持民主社会主义意识形态，在黎巴嫩独立后的历届政府中都发挥了积极作用。作为亚美尼亚革命联盟的一部分，该党与亚美尼亚本土以及整个亚美尼亚侨民群体都保持着密切联系。"
 LEB.Neutral_Libertarian: "£LEB_libertarianism (MM) 马拉达运动"
 LEB.Neutral_Libertarian_desc: "（基督教民主主义）- 马拉达运动得名于早期基督教团体马尔代派，最初于1967年以民兵组织的形式成立，并参与了黎巴嫩内战。马拉达运动最初与以色列支持的马龙派政府结盟，但最终脱离该政府，转而支持叙利亚。1991年，马拉达运动改组为政党，保留了亲叙利亚的立场，同时也保留了其大部分早期信仰，仍然是一个代表黎巴嫩马龙派的右翼政党。"
 LEB.Neutral_Autocracy: "£generic_Neutral_Autocracy_small 改变运动"
 LEB.Neutral_Autocracy_desc: ""
 LEB.Neutral_Communism: "£LEB_non_aligned_communism (WL) 劳动者联盟"
 LEB.Neutral_Communism_desc: "（泛阿拉伯马克思列宁主义）- 劳动者运动是1974年从进步社会党分裂出来的一个政党，主张融合泛阿拉伯民族主义和马克思列宁主义思想。在黎巴嫩内战期间，该党与其他左翼政党并肩作战，支持黎巴嫩民族运动，但其成员和支持率都遭受了重创。不过，战后该党得以恢复，并在亲叙利亚阵营中取得了一些小规模的选举胜利。"
 LEB.Neutral_Muslim_Brotherhood: "£muslim_brotherhood_small 伊斯兰集团"
 LEB.Neutral_Muslim_Brotherhood_desc: "（伊斯兰主义）- 伊斯兰集团是穆斯林兄弟会在黎巴嫩的分支，主张黎巴嫩建立基于伊斯兰教法的法律体系。它与穆斯林兄弟会基本保持一致，并设有军事分支，曾与真主党和哈马斯合作。"
 LEB.Neutral_green: "£generic_Neutral_green_small (GPL) 黎巴嫩绿党"
 LEB.Neutral_green_desc: "（环保主义）- 黎巴嫩绿党成立于2008年，遵循标准的进步主义和环保主义绿党纲领。由于黎巴嫩的特殊国情，与那些奉行更具宗派色彩的政党相比，该党鲜有建树，甚至被一些具有多元民族代表性的政党所掩盖。"
 LEB.Nat_Autocracy: "£LEB_military_junta (LAF)黎巴嫩武装力量"
 LEB.Nat_Autocracy_desc: "（宗派军政府）- 黎巴嫩武装部队正式成立于1945年，其历史上充满了纷争。由于黎巴嫩的教派性质，武装部队被用来压制其他族群的阴影在不同程度上笼罩着政治，最终在黎巴嫩内战中达到顶峰。由于被视为以基督徒为主导，武装部队面临着因逃兵而解体的危机，穆斯林、德鲁兹人，甚至非马龙派基督徒都纷纷叛逃，加入族裔民兵或意识形态相近的团体。内战结束后，武装部队进行了重组和重建。其大部分军事行动都是与以色列或在黎巴嫩国内对抗巴勒斯坦解放组织或民兵组织。"
 LEB.Nat_Fascism: "£IRQ_Nat_Autocracy_small 社会主义黎巴嫩阿拉伯先锋党"
 LEB.Nat_Fascism_desc: "（伊拉克复兴党）- 黎巴嫩阿拉伯社会主义先锋队是阿拉伯复兴社会党伊拉克分支的黎巴嫩分支，支持萨达姆政权。内战期间，该党与黎巴嫩民族运动结盟，反对马龙派政府，但同时反对以色列和叙利亚对黎巴嫩的干预。该党奉行标准的伊拉克复兴党纲领。"
 LEB.Nat_Populism: "£LEB_fascism (SSNP-L) 叙利亚民族社会主义党（黎巴嫩分支）"
 LEB.Nat_Populism_desc: "（社会民族主义）- 作为叙利亚社会民族党的黎巴嫩分支，该党的纲领和理念与其叙利亚分支如出一辙：融合了以叙利亚泛民族主义和“大叙利亚”理念为中心的多种信仰。在黎巴嫩内战期间，该党曾与许多此前反对的左翼团体并肩作战，最终在叙利亚介入黎巴嫩内战后，自然而然地转而支持叙利亚。"
 LEB.Monarchist: "£generic_Monarchist_small 谢哈布王朝"
 LEB.Monarchist_desc: "（酋长国）- 希巴布王朝（或称谢哈布家族）是黎巴嫩历史上的统治者，在被奥斯曼帝国统治之前，他们统治的领土较小。他们的统治最终随着1840年的东方危机而结束，当时欧洲列强推翻了穆罕默德·阿里。奥斯曼帝国随后废黜了当时的黎巴嫩埃米尔巴希尔二世，并以总督取而代之。如今，这个家族在黎巴嫩仍然保持着一定的影响力，其穆斯林和马龙派分支至今仍然存在。"
 LES.conservatism: "£generic_conservatism_small (BNP) - 巴索托国民党"
 LES.conservatism_desc: "（保守主义）\n巴索托国民党\n\n该党于1959年仍处于殖民统治时期成立，并在1965年殖民时代最后一次选举中获得多数席位，成为主导国家独立的政党。\n\n然而，随后的1970年选举中，该党失去了多数地位。时任首相莱阿布阿·乔纳森没有接受命运，而是发动政变，实质上以独裁统治领导国家，直至1986年乔纳森本人也在一次政变中被推翻。"
 LES.socialism: "£generic_socialism_small (LCD) - 莱索托民主大会党"
 LES.socialism_desc: "（泛非社会民主主义）\n莱索托民主大会党\n\n作为巴索托兰大会党的分支，莱索托民主大会党于1997年由时任首相莫赫勒脱离巴索托兰大会党后创立。在1998年选举中，莱索托民主大会党实质上使巴索托兰大会党在议会中失去所有代表席位，从而使其自身成为巴索托兰大会党的延续政党。"
 LES.anarchist_communism: "£generic_anarchist_communism_small (BCP) - 巴索托兰大会党"
 LES.anarchist_communism_desc: "（泛非社会主义者）\n巴苏陀兰大会党\n\n该党最初于1952年以“巴苏陀兰非洲大会”之名成立，1957年更名为巴苏陀兰大会党，并沿用此名至今。\n\n自1974年至1990年，巴苏陀兰大会党维持着一支名为“莱索托解放军”的准军事力量，与巴苏陀国民党领袖莱阿布阿·乔纳森及随后的军事指挥官贾斯汀·莱哈尼亚的统治作战。\n\n在1993年选举中 - 即莱阿布阿·乔纳森及其被推翻后执政的军事委员会之后首次举行的选举 - 巴苏陀兰大会党赢得了100%的席位，但在1998年选举中却急剧失势，失去了每一个席位。"
 LES.neutral_Social: "£generic_neutral_Social_small (PFD) - 民主人民阵线"
 LES.neutral_Social_desc: "(民主社会主义)\n民主人民阵线\n\n该党成立于1990年，作为联合祖国阵线的延续，民主人民阵线最初与其余政党一样被禁止参与政治活动。\n\n然而到了1991年，情况发生了变化，党禁被解除。民主人民阵线最初是一个马克思列宁主义政党，后来采取了更为温和的立场，被归类为民主社会主义性质。\n\n与许多其他左翼政党不同，民主人民阵线接受酋长在巴苏陀及整个非洲的存在。"
 LES.Nat_Autocracy: "£generic_Nat_Autocracy_small (LDF) - 莱索托国防军"
 LES.Nat_Autocracy_desc: "（军政府）\n莱索托国防军\n\n莱索托国防军于1978年以现有形式成立，其前身是官方安全部队 - 莱索托骑警以及准军事组织 - 警察机动部队。\n\n警察机动部队在1970年政变中发挥了关键作用，使巴索托国民党在1970年选举失利后得以掌权。在巴索托国民党独裁统治下，警察机动部队以腐败闻名，既支持巴索托国民党独裁政权，也受到其支持。\n\n1986年，当时的莱索托国防军对巴索托国民党及其招致南非种族隔离政府封锁的后果感到失望，发动了自己的政变夺取政权。1986年政变后，各种政变与反政变接连不断，莱索托于1998年重新成为完全民主国家。"
 LES.Monarchist: "£generic_Monarchist_small 莫舒舒王朝"
 LES.Monarchist_desc: "（君主制）\n莫舒舒家族\n\n1996年莫舒舒二世英年早逝后，莱索托国王之位便传给了莱齐耶三世。\n\n莱索托的君主制历史多变，在千禧年之交王位更迭频繁，由于莱索托实行君主立宪制，王位职权范围通常有限，尽管理论上实行世袭制，但若君主去世时无继承人，酋长院可任命与前任君主无血缘关系的人选。"
 LIB.conservatism: "£LIB_conservatism_small (LNU) - 利比里亚民族联盟"
 LIB.liberalism: "£LIB_liberalism_small (UP) - 联合党"
 LIB.liberalism_icon: "£LIB_liberalism_small"
 LIB.liberalism_desc: "（自由民主主义） - 团结党是泰勒的主要反对党。该党成立于1984年，在1980年政变后的首次选举中与塞缪尔·多伊竞争。该党提倡自由民主和经济自由化。它还主张与美国建立更紧密的联系，美国一直是该国的传统盟友。"
 LIB.Western_Autocracy: "£LIB_Western_Autocracy_small (NDPL) - 利比里亚民族民主党"
 LIB.Western_Autocracy_icon: "£LIB_Western_Autocracy_small"
 LIB.Western_Autocracy_desc: "（民族主义） - 利比里亚民族民主党曾由塞缪尔·多伊博士领导。尽管多伊博士拥抱极权主义、反共产主义、反共济会，但利比里亚与美国结盟。多伊在第一次利比里亚内战中被推翻并死亡后，他的军阀朋友和内阁成员让该党得以生存。"
 LIB.anarchist_communism: "£LIB_anarchist_communism_small (LPP) - 利比里亚人民党"
 LIB.anarchist_communism_desc: "（民主社会主义） - 利比里亚人民党是一个泛非洲社会主义政党。"
 LIB.neutral_Social: "£LIB_neutral_Social_small (UPP) - 联合人民党"
 LIB.neutral_Social_desc: "（非洲社会主义） - 联合人民党是一个非洲社会主义政党。非洲社会主义包含许多马克思列宁主义元素，但拒绝反宗教、阶级斗争和暴力革命等概念。该党许多成员叛逃到利比里亚人和解与民主团结会反叛组织以反对泰勒，其中包括反叛组织领导人塞古·康纳。"
 LIB.Neutral_Autocracy: "£generic_Neutral_Autocracy_small (FAPL) - 利比里亚自由联盟党"
 LIB.Nat_Autocracy: "£LIB_Nat_Autocracy_small (AFL) - 利比里亚武装力量"
 LIB.Nat_Autocracy_icon: "£LIB_Nat_Autocracy_small"
 LIB.Nat_Autocracy_desc: "（军政府）- 泰勒掌权后，他基本上裁撤了利比里亚武装部队的人员，转而支持他的私人武装“反恐部队”。到21世纪初，利比里亚武装部队已几乎不复存在，泰勒已让大多数人员退休。"
 LIT.conservatism: "£LIT_conservatism (TS-LKD) 祖国联盟-立陶宛基督教民主党"
 LIT.conservatism_icon: "£LIT_conservatism"
 LIT.conservatism_desc: "（基督教民主主义）- 祖国联盟，又称保守党，是立陶宛的一个基督教民主党。它奉行自由保守的社会政策，支持自由市场资本主义，并支持通过欧盟与欧洲更紧密地融合。"
 LIT.liberalism: "£generic_liberalism_small (LLS) 立陶宛自由联盟"
 LIT.liberalism_desc: "（古典自由主义）-立陶宛自由联盟最初以右翼政党自居，但随着立陶宛年轻的民主制度的发展，该党逐渐向中间靠拢。"
 LIT.socialism: "£generic_socialism_small (LSDP) 立陶宛社会民主党"
 LIT.socialism_desc: "（第三道路）- 苏联解体后重建的瑞典社会民主党，一直由两派主导：一派主张将该党向左翼方向发展，另一派则希望奉行更务实的民粹主义纲领，并深受其他社会民主党的影响。尽管存在这种摩擦，该党仍然坚持名义上的社会民主主义理念，支持福利和工人权益，以及LGBTQ权益，并反对紧缩政策。"
 LIT.Western_Autocracy: "£generic_Western_Autocracy_small (NS) 新联盟（社会自由主义）"
 LIT.Western_Autocracy_desc: "（社会自由主义）- 新联盟成立于1998年，奉行社会自由主义议程和纲领，自视为促进国家人民的自由、社会团结和福祉。"
 LIT.anarchist_communism: "£generic_anarchist_communism_small (LSP) 立陶宛社会党"
 LIT.anarchist_communism_desc: "（21世纪社会主义）- 立陶宛社会党是从较为温和的立陶宛民主工党分裂出来的政党，其成员认为民主工党过于右倾。虽然该党不信奉马克思列宁主义，但它曾主张释放亲苏异见人士，并且与被取缔的立陶宛共产党有联系。"
 LIT.Neutral_conservatism: "£generic_Neutral_conservatism_small (LKDP) 立陶宛基督教民主党"
 LIT.Neutral_conservatism_desc: "（基督教民主主义）- 立陶宛基督教民主党是前立陶宛国家的一个政党的重建组织，主张更传统的基督教民主观点和政策。"
 LIT.neutral_Social: "£generic_neutral_Social_small (LDDP) 立陶宛民主劳动党"
 LIT.neutral_Social_desc: "（左翼社会民主主义）- 作为被取缔的立陶宛共产党的几个继承者之一，立陶宛左翼社会民主党与该国其他几个左翼政党保持着联系。"
 LIT.Neutral_Libertarian: "£generic_Neutral_Libertarian_small (LS) 自由主义运动"
 LIT.Neutral_Libertarian_desc: "（保守自由主义）自由主义运动坚持经济自由主义纲领，对社会问题持较为温和的观点，尽管一些派别倾向于更右翼。"
 LIT.Neutral_Autocracy: "£generic_Neutral_Autocracy_small (LCS) 立陶宛中间同盟"
 LIT.Neutral_Autocracy_desc: "（农业主义）立陶宛中间同盟由立陶宛民主改革联盟的前成员创立，其中包括在立陶宛建国初期发挥重要作用的罗穆阿尔达斯·奥佐拉斯。该联盟支持立陶宛的“无限自由”，反对加入欧盟，同时仍然反对俄罗斯和该国的苏联历史。"
 LIT.Neutral_green: "£LIT_green (LVZS) 立陶宛农民与绿党联盟"
 LIT.Neutral_green_icon: "£LIT_green"
 LIT.Neutral_green_desc: "（绿色保守主义）- 虽然该党在经济上一直保持左翼立场，但在社会上，该党一直在社会保守主义和更自由主义的影响之间摇摆不定 - 该党的早期发展以观点和政策的转变为标志。"
 LIT.Nat_Autocracy: "£generic_Nat_Autocracy_small 立陶宛武装力量"
 LIT.Nat_Autocracy_desc: "（务实军政府）- 现代立陶宛武装部队对该国政治的影响甚微，其近期的发展主要集中在应对俄罗斯的潜在侵略或履行对北约盟国的义务上。"
 LIT.Nat_Fascism: "£generic_Nat_Fascism_small (LNP) 立陶宛国家民主党"
 LIT.Nat_Fascism_desc: "（极端民族主义）- 立陶宛国家民主党是一个极右翼政党，奉行疑欧主义，名义上反对自由主义。该党声称反对极权主义和无政府主义，同时也认为自己走的是一条较为温和的道路，支持全球贸易和资本主义，并主张支持福利措施。"
 LIT.Nat_Populism: "£generic_Nat_Populism_small 立陶宛青年党"
 LIT.Nat_Populism_desc: "（民族保守主义）- “立陶宛青年党”党得名于1924年至1940年立陶宛存在的一个极右翼社团主义政党，其纲领与该党有一些重叠之处 - 尽管有限的选举成功和右翼更强大的政党阻碍了其推行政策的能力。"
 LIT.Monarchist: "£generic_Monarchist_small 符腾堡王室"
 LIT.Monarchist_desc: "（君主立宪主义）- 在第一次世界大战末期，德意志王室通过乌拉赫分支短暂地掌握了立陶宛的政权。尽管建立德意志君主制的尝试失败了，但他们仍然是现存最后一个统治立陶宛的王室家族。"
