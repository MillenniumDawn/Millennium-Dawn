 ukr_modernize_sov_equipment_t55_reactivation_program.2.name: "§YT-55§! 경량 개량:\n개량안 선택"
 ukr_modernize_sov_equipment_t55_reactivation_program.2.desc: "경량 개량은 기존 포탑과 주포를 그대로 두고 먼저 마모되는 부품만 교체합니다. §YKMDB§!는 우리 산업이 이미 §YT-64§!용으로 생산하는 부품으로 구성한 두 가지 개량안을 제시했습니다."
 ukr_modernize_sov_equipment_t55_reactivation_program.2.a: "§Y5TDF§! 엔진 장착"
 ukr_modernize_sov_equipment_t55_reactivation_program.2.b: "§YT-64§! 장갑 및 구동계 부품 장착"
 ukr_modernize_sov_equipment_t55_reactivation_program.3.name: "§YT-55§! 경량 개량:\n시제차 완성"
 ukr_modernize_sov_equipment_t55_reactivation_program.3.desc_5tdf: "§Y5TDF§! 엔진을 얹은 첫 §YT-55§!가 §Y하르키우 장갑차 공장§!의 공장 시험을 통과했습니다. 전차는 §G더 빠르고 신뢰성도 높아졌으며§!, 개조에는 §YT-64§!용으로 이미 생산된 엔진을 씁니다."
 ukr_modernize_sov_equipment_t55_reactivation_program.3.desc_64: "§YT-64§! 부품으로 재제작한 §YT-55§!가 §Y하르키우 장갑차 공장§!의 공장 시험을 통과했습니다. 복합 장갑과 §Y5TDF§! 엔진 덕분에 낡은 차체가 §G새 생명§!을 얻었습니다."
