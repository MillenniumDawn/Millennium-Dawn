julia_gilard_desc: "As a Welsh-born activist and legal partner, Gillard has risen through the ranks of the Australian government to become the country's first female Prime Minister. \n\nInitially a Left Faction Socialist in Victoria's ALP, she came to prominence through her ability to gain and maintain business connections, using her experience as a solicitor specializing in industrial law. Striving in a traditionally male dominated field, and getting where she has despite being unmarried and lacking any religious belief, Gillard has broken the status quo of Australian politics. \n\nAlthough, without precedent, Julia Gillard now sets the tone for the future of women in Parliament. Whichever direction she goes, the party follows with tentative unease, and any misstep could send her over before she's even begun."
