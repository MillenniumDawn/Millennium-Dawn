l_braz_por:
 industrial_complex: "Indústria Civil"
 industrial_complex_plural: "Indústrias Civis"
 industrial_complex_desc: "Este edifício fornece ao estado indústria para a produção de bens civis ou construção de novos edifícios. Pode ser convertido em indústria militar se necessário.\n\nFornece ao estado:\nNúmero Base de Trabalhadores Necessários: §Y 206K §!\nPIB Base Gerado por §Y Indústria Civil §!: $§Y 17,5 Bilhões §!\nConsumo de Energia Base: §R -0,5 §! GW\n"
 arms_factory: "Indústria Militar"
 arms_factory_plural: "Indústrias Militares"
 arms_factory_desc: "Este edifício fornece ao estado indústria para a produção de novos equipamentos militares. Pode ser convertido em indústria civil se necessário.\n\nFornece ao estado:\nNúmero Base de Trabalhadores Necessários: §Y 18,8 K§!\nPIB Base Gerado por §Y Indústria Militar §!: $§Y 1,5 Bilhão §!\nConsumo de Energia Base: §R -0,5 §! GW"
 internet_station: "Infraestrutura de Rede"
 internet_station_plural: "Infraestruturas de Rede"
 internet_station_desc: "As §Y Infraestruturas de Rede §! são estruturas altas usadas nos campos de telecomunicações e radiocomunicação para impulsionar transmissões a grandes distâncias ou cabos de fibra óptica subterrâneos e sistemas de computação em nuvem.\n\nFornece ao estado:\nNúmero Base de Trabalhadores Necessários: §Y 12K §!\nPIB Base Gerado por §Y Infraestrutura de Rede §!: $§Y 3,5 Bilhões §!\n\nCada nível de §Y Infraestrutura de Rede §! melhora a velocidade de crescimento da produtividade local em §G +5,00% §!.\nCada nível de §Y Infraestrutura de Rede §! reduz a duração de §Y Investimentos Internacionais §! em §G -5,00% §!."
 dockyard: "Estaleiro Naval"
 dockyard_plural: "Estaleiros Navais"
 dockyard_desc: "Os §Y Estaleiros Navais §! são representativos da capacidade de um estado de produzir embarcações militares de todos os tipos, variando desde §Y Barcos de Patrulha §!, §Y Comboios §!, §Y Destroyers §!, §Y Porta-aviões §! e mais.\n\nFornece ao estado:\nNúmero Base de Trabalhadores Necessários: §Y 18,8K §!\nPIB Base Gerado por §Y Estaleiro Naval §!: $§Y 1,5 Bilhão §!\nConsumo de Energia Base: §R -0,5 §! GW"
 air_base_desc: "Este prédio fornece ao estado o posicionamento para suas forças aéreas."
 radar_station_desc: "Estações de Radar permitem que você obtenha informações sobre as tropas inimigas em estados próximos. Consiste em vários radares e sensores, além de ativos de inteligência e capacidade de analisar a situação em evolução.\nUm nível mais alto aumentará o alcance efetivo.\nSeus radares também proporcionam ao estado uma melhor detecção das forças aéreas inimigas, aumentando as chances de seus aviões de se envolverem com eles.\nAlém disso, os radares aumentam a detecção das frotas inimigas no mar."
 anti_air_building: "Sites SHORAD"
 anti_air_building_plural: "Sites SHORAD"
 anti_air_building_desc: "§YSites YSHORAD§! (Short Range Air Defense) são complexos e grupos de armas e táticas antiaéreas que lidam com defesa aérea contra ameaças aéreas de baixa altitude. Esses sites trabalham juntos para dividir o espaço aéreo em áreas defensáveis, fornecendo alvos militares locais e cobertura aérea de infraestrutura de tudo, desde helicópteros a aeronaves de voo baixo e jatos."
 nuclear_reactor_desc: "Este edifício converte energia nuclear em energia elétrica, consumindo urânio moderadamente enriquecido no processo.\n\nFornece ao estado:\nNúmero Base de Trabalhadores Necessários: §Y 115K §!\nPIB Base Gerado por §Y Reator Nuclear §!: $§Y 4 Bilhões §!\nGanho de Energia Base: §G +5 §! GW\n"
 synthetic_refinery_desc: "Este edifício fornece ao estado indústria para a produção de borracha sintética e alguma capacidade adicional de produção de combustível.\n\nFornece ao estado:\nNúmero Base de Trabalhadores Necessários: §Y 184K §!\nPIB Base Gerado por §Y Refinaria Sintética §!: $§Y 10 Bilhões §!\nConsumo de Energia Base: §R -0,2 §! GW\n\nProduz §Y Borracha §! a preços de mercado padrão, com o excedente gerando receita em dinheiro além do imposto corporativo.\n"
 fuel_silo: "Reserva de Recursos Estratégicos"
 fuel_silo_plural: "Reserva de Recursos Estratégicos"
 fuel_silo_desc: "A §Y Reserva de Recursos Estratégicos §! é uma fusão de armazéns, depósitos a seco e outros armazéns do tipo §Y Combustível §!. Este edifício fornece à sua nação mais espaço para estocar §H Combustível §! e §H Recursos §!.\n\nNOTA: O §Y Armazenamento de Recursos §! possui uma limitação de engine na qual, se você estiver em §Y $export_economy$ §! ou §Y $globalized_trade_economy$ §!, poderá acabar enviando mais recursos para exportação do que para suas linhas de produção necessárias. Se precisar começar a retirar do armazenamento, é recomendado que mude para §Y $mixed_economy$ §! ou inferior.\n"
 offices: "Setor de Escritórios"
 offices_plural: "Setores de Escritórios"
 offices_desc: "Os §Y Setores de Escritórios §! representam todas as outras indústrias da economia além da extração e das indústrias pesadas. Isso inclui serviços financeiros, de atendimento ao cliente, tecnologia da informação, varejo e muito mais.\n\nFornece ao estado:\nNúmero Base de Trabalhadores Necessários: §Y 473K §!\nPIB Base Gerado por §Y Setor de Escritórios §!: $§Y 50 Bilhões §!\nConsumo de Energia Base: §R -0,25 §! GW"
 rail_way_plural: "Ferrovias"
 fossil_powerplant: "Usina de energia de combustível fóssil"
 fossil_powerplant_plural: "Usinas termelétricas"
 fossil_powerplant_desc: "As §Y Usinas Termelétricas de Combustíveis Fósseis §! servem como termo genérico para todas as fontes de energia termelétrica baseadas em fósseis. Isso inclui, mas não se limita a, carvão, gás natural e petróleo. As §Y Usinas Termelétricas de Combustíveis Fósseis §! ficarão ociosas se a geração de energia for maior que o consumo.\n\nFornece ao estado:\nNúmero Base de Trabalhadores Necessários: §Y 7,5K §!\nPIB Base Gerado por §Y Usina Termelétrica de Combustíveis Fósseis §!: $§Y 1,7 Bilhão §!\nGanho de Energia Base: §G +2 §! GW\n"
 fossil_powerplant_amount: "$VALUE|Y0=$"
 fossil_powerplant_resource: "£resources_strip|$FRAME$"
 agriculture_district: "Distrito de Agricultura Comercializada"
 agriculture_district_plural: "Distrito de Agricultura Comercializada"
 agriculture_district_desc: "Os §Y Distritos de Agricultura Comercializada §! servem como termo genérico para toda a agricultura não de subsistência em nossa nação. Incluem a agroindústria, terras aráveis, silos de grãos, matadouros e muito mais.\n\nFornece ao estado:\nNúmero Base de Trabalhadores Necessários: §Y 188K §!\nPIB Base Gerado por §Y Distrito de Agricultura Comercializada §!: $§Y 25 Bilhões §!\nConsumo de Energia Base: §R -0,10 §! GW\n§Y Ganho de Combustível §! dos Estados: 8\n§Y Suprimentos Locais §!: 1,5%\n"
 agriculture_district_amount: "$VALUE|Y0=$"
 rocket_site: "Local de lançamento de mísseis"
 rocket_site_plural: "Local de lançamento de mísseis"
 rocket_site_desc: "§YLocais de lançamento de mísseis§! representam um apanhado geral para todos os equipamentos de mísseis de nível de teatro, variando de §YMísseis superfície-ar§! a §YMísseis Balísticos Intercontinentais§!. Ele fornece ao estado a capacidade de implantar esses ativos estratégicos em nossas zonas aéreas estratégicas para auxiliar em nossa defesa aérea ou fornecer capacidades ofensivas."
 nuclear_facility: "Instalação de P&D Civil"
 nuclear_facility_plural: "Instalação de P&D Civil"
 nuclear_facility_desc: "Uma §Y Instalação de P&D Civil §! inclui todos os tipos de projetos especiais relacionados à capacidade industrial civil, instalações nucleares e muito mais."
 air_facility: "Instalação de Aerodinâmica e Aviônica"
 air_facility_desc: "As Instalações Experimentais para Aerodinâmica e Aviônica permitem que você inicie projetos de pesquisa para aeronaves, foguetes avançados, eletrônicos relacionados e projetos espaciais."
 naval_facility_desc: "Instalações Experimentais para Engenharia Naval permitem que você inicie projetos de pesquisa relacionados a Navios de Superfície e Submarinos.\nUma Engenharia Naval só pode ser criada em uma província costeira."
 stronghold_network: "Rede de Defesa Estadual"
 stronghold_network_plural: "Rede de Defesa Estadual"
 stronghold_network_desc: "Uma extensa rede defensiva composta por túneis, pontos de apoio, trincheiras, abrigos antibombas, depósitos de armas e locais de demolição pré-planejados dá aos defensores uma vantagem decisiva contra qualquer atacante."
 renewable_energy_infra: "Infraestrutura de Energia Renovável"
 renewable_energy_infra_plural: "Infraestrutura de Energia Renovável"
 renewable_energy_infra_desc: "A §Y Infraestrutura de Energia Renovável §! serve como termo genérico para todas as fontes de energia renovável. Isso inclui, mas não se limita a, parques solares, turbinas eólicas, refinarias de biocombustível, usinas de carvão vegetal, usinas de energia de biocombustível e muito mais. Sendo assim, utiliza fontes renováveis e produz combustível a partir dessas fontes.\n\nFornece ao estado:\nNúmero Base de Trabalhadores Necessários: §Y 22,5K §!\nPIB Base Gerado por §Y Infraestrutura de Energia Renovável §!: $§Y 2 Bilhões §!\nGanho de Energia Base: §G +0,5 §! GW\n"
 renewable_energy_infra_amount: "$VALUE|Y0=$"
 renewable_energy_infra_resource: "£resources_strip|$FRAME$"
 microchip_plant: "Fábrica de Microchips"
 microchip_plant_plural: "Fábricas de Microchips"
 microchip_plant_desc: "Planta de produção que converte Metais Tecnológicos e Metais Preciosos em Microchips, para uso tanto em necessidades industriais quanto militares.\n\nFornece ao estado:\nNúmero Base de Trabalhadores Necessários: §Y 37,5K §!\nPIB Base Gerado por §Y Fábrica de Microchips §!: $§Y 32 Bilhões §!\nConsumo de Energia Base: §R -0,75 §! GW\nProdução de 20 §Y Microchips §!\n\nOs §Y Microchips §! comandam o preço de mercado mais alto por unidade, gerando uma renda significativa em dinheiro sobre as exportações de excedentes.\n\nCustos:\n3 §Y Metais Tecnológicos §!\n2 §Y Metais Preciosos §!"
 composite_plant: "Fábrica de Materiais Compósitos"
 composite_plant_desc: "Planta de produção que combina Petróleo, Borracha e Metais Preciosos em Compósitos, para uso em necessidades científicas, militares e industriais.\n\nFornece ao estado:\nNúmero Base de Trabalhadores Necessários: §Y 37,5K §!\nPIB Base Gerado por §Y Fábrica de Materiais Compósitos §!: $§Y 28 Bilhões §!\nConsumo de Energia Base: §R -0,8 §! GW\nProdução de 20 §Y Compósitos Avançados §!\n\nOs §Y Compósitos §! são vendidos a um dos preços de mercado mais altos por unidade, gerando uma forte receita em dinheiro sobre as exportações de excedentes.\n\nCustos:\n1 §Y Petróleo §!\n1 §Y Borracha §!\n1 §Y Metais Preciosos §!"
 composite_plant_plural: "Fábricas de Materiais Compósitos"
 rail_terminal: "Terminal Ferroviário"
 rail_terminal_plural: "Terminais Ferroviários"
 rail_terminal_desc: "Um estado servido por uma rede de terminais densa movimenta tanto pessoas quanto mercadorias com mais rapidez, fazendo com que as fábricas tenham insumos mais constantes, os trabalhadores cheguem aos empregos de forma mais confiável e a economia ao redor ganhe margem para se expandir."
 show_construction_speed: "Quando marcado, você pode ver o £construction_speed_texticon  §Y Bônus de Velocidade de Construção §! atual para cada §Y Tipo de Edifício §!\n\nEste modificador mostra apenas o modificador específico do edifício. Ele não leva em conta a §Y Velocidade de Construção Global £construction_speed_texticon . §!"
 landmark_kaaba: "Kaaba"
 landmark_kaaba_plural: "$landmark_kaaba$"
 landmark_kaaba_desc: "A Kaaba, uma estrutura sagrada em formato de cubo no coração da Mesquita al-Haram, em Meca, ergue-se como o local mais sagrado do Islã. Coberta por seda preta adornada com caligrafia dourada, ela serve como a \"qibla\", a direção para a qual os muçulmanos do mundo todo se voltam em oração. Este antigo santuário, conhecido como a Casa de Deus, encarna séculos de fé, peregrinação e história islâmica, simbolizando a unidade da \"umma\" muçulmana.\n\nO §Y Marco Histórico da Kaaba §! gera renda de turismo com base na população total dos estados árabes. O valor exato pode ser visualizado na §Y Prévia Econômica §!."
 landmark_milad: "Torre Milad"
 landmark_milad_plural: "$landmark_milad$"
 landmark_milad_desc: "A Torre Milad, ou Borj-e Milad, tem raízes no período pré-revolucionário do Irã, com planos iniciais que datam da década de 1970. Após a Revolução Iraniana de 1979, esses primeiros planos foram deixados de lado em meio a prioridades políticas em mutação. A visão foi reavivada no final da década de 1990, e a construção começou em 2000, alinhando-se ao novo foco do Irã no desenvolvimento e na modernização. Seu design combina elementos da herança iraniana com engenharia contemporânea, tornando-se um emblema marcante tanto da continuidade histórica quanto da identidade em evolução do país. Hoje, a torre ergue-se como um complexo multifuncional e um marco cultural proeminente, oferecendo aos residentes e visitantes de Teerã vistas panorâmicas da cidade e das distantes montanhas de Alborz."
 landmark_domeofrock: "Domo da Rocha"
 landmark_domeofrock_plural: "$landmark_domeofrock$"
 landmark_domeofrock_desc: "O Domo da Rocha é um santuário islâmico renomado, famoso pela cúpula dourada que avista a Cidade Velha de Jerusalém. Construído no século VII, ele se ergue sobre o Haram al-Sharif, também conhecido como o Monte do Templo, um local sagrado tanto para muçulmanos quanto para judeus. O santuário abriga a Pedra Fundamental, que os muçulmanos acreditam marcar o local onde o Profeta Maomé ascendeu ao céu e que os judeus acreditam ser o local do Santo dos Santos do antigo Templo Judeu."
 landmark_goldengate: "Ponte Golgen Gate"
 landmark_goldengate_plural: "$landmark_goldengate$"
 landmark_goldengate_desc: "Concluída em 1937, a \"Golden Gate Bridge\" estende-se pelo estreito entre a Baía de São Francisco e o Oceano Pacífico, conectando a cidade às Marin Headlands. Suas distintas torres na cor Laranja Internacional e seu longo vão suspenso fizeram dela a maior ponte do tipo no mundo na época de sua inauguração, e ela permanece como uma das estruturas mais reconhecíveis dos Estados Unidos."
 landmark_UScongress: "Capitólio dos Estados Unidos"
 landmark_UScongress_plural: "$landmark_UScongress$"
 landmark_UScongress_desc: "O Capitólio dos Estados Unidos ergue-se na extremidade leste do National Mall em Washington, D.C., abrigando as câmaras do Senado e da Câmara dos Representantes. Seu design neoclássico e a cúpula central tornaram-no a sede mais reconhecível do poder legislativo americano, ancorando um corredor que inclui a Biblioteca do Congresso, a Suprema Corte e o complexo de museus da Smithsonian Institution."
 landmark_fuji: "Monte Fuji"
 landmark_fuji_plural: "$landmark_fuji$"
 landmark_fuji_desc: "O Monte Fuji, com 3.776 metros, o pico mais alto do Japão, é um estratovulcão ativo em Honshu, visível de Tóquio em dias claros. Considerado sagrado há muito tempo na crença xintoísta e um motivo marcante na arte japonesa, ele também é um Patrimônio Mundial da UNESCO. Sua silhueta cônica quase perfeita e a região de lagos ao redor atraem centenas de milhares de alpinistas e turistas todos os anos."
 landmark_giza: "Pirâmides de Gizé"
 landmark_giza_plural: "$landmark_giza$"
 landmark_giza_desc: "Construídas durante o Antigo Império do Egito como túmulos monumentais para os faraós, as Pirâmides de Gizé erguem-se nos arredores do Cairo. A Grande Pirâmide, construída para o faraó Khufu, é a última estrutura sobrevivente das Sete Maravilhas do Mundo Antigo. O complexo, juntamente com a Esfinge, continua sendo um dos marcos mais visitados do Egito e a peça central da economia turística do país."
 landmark_shuttle: "Centro Espacial Kennedy"
 landmark_shuttle_plural: "$landmark_shuttle$"
 landmark_shuttle_desc: "O Centro Espacial Kennedy, na costa atlântica da Flórida, serve como o principal local de lançamento para as missões de voo espacial tripulado da NASA. Ele conta com instalações como o icônico \"Vehicle Assembly Building\", onde os foguetes são preparados para o lançamento, e o Complexo de Lançamento 39, o ponto de partida histórico para os programas Apollo e Ônibus Espacial. O centro continua sendo um polo de inovação e exploração, apoiando lançamentos governamentais e comerciais."
 landmark_shuttle_launch: "Centro Espacial Kennedy"
 landmark_shuttle_launch_plural: "$landmark_shuttle_launch$"
 landmark_shuttle_launch_desc: "O Centro Espacial Kennedy, na costa atlântica da Flórida, serve como o principal local de lançamento para as missões de voo espacial tripulado da NASA. Ele conta com instalações como o icônico \"Vehicle Assembly Building\", onde os foguetes são preparados para o lançamento, e o Complexo de Lançamento 39, o ponto de partida histórico para os programas Apollo e Ônibus Espacial. O centro continua sendo um polo de inovação e exploração, apoiando lançamentos governamentais e comerciais."
 landmark_buran: "Cosmodromo de Baikonur"
 landmark_buran_plural: "$landmark_buran$"
 landmark_buran_desc: "O Cosmódromo de Baikonur, nas estepes do sul do Cazaquistão, é o espaçoporto operacional mais antigo e maior do mundo. Estabelecido em 1955, ele tem sido o local de lançamento para missões soviéticas e russas históricas, incluindo o primeiro voo espacial tripulado de Yuri Gagarin a bordo da Vostok 1. A Rússia continua arrendando a instalação do Cazaquistão e a utiliza para lançamentos tripulados da Soyuz para a Estação Espacial Internacional."
 landmark_ICBMsilominot: "Base Aérea de Minot"
 landmark_ICBMsilominot_plural: "$landmark_ICBMsilominot$"
 landmark_ICBMsilominot_desc: "O complexo de mísseis da Base Aérea de Minot consiste em uma extensa rede de silos subterrâneos que abrigam mísseis balísticos intercontinentais, espalhados pelas planícies de Dakota do Norte. Os silos são blindados contra ataques nucleares e fortemente vigiados, mantidos em alerta contínuo, formando a perna terrestre da tríade nuclear dos Estados Unidos."
 landmark_ICBMsiloyasny: "Base de Mísseis de Yasny"
 landmark_ICBMsiloyasny_plural: "$landmark_ICBMsiloyasny$"
 landmark_ICBMsiloyasny_desc: "A Base de Mísseis de Yasny, perto de Dombarovsky, na região de Orenburg, na Rússia, é um dos principais campos de silos das Forças de Foguetes Estratégicos. Construída durante a Guerra Fria, ela abriga ICBMs pesados em silos subterrâneos blindados e forma um componente crítico do elemento de dissuasão nuclear da Rússia."
 landmark_zenobia_wall: "Linha Defensiva de Zenobia"
 landmark_zenobia_wall_plural: "$landmark_zenobia_wall$"
 landmark_zenobia_wall_desc: "Uma linha fortemente fortificada que se estende pelo sul do Egito e pelo deserto ocidental. Paredes de concreto, complexos de bunkers e artilharia pré-posicionada ancoram a Linha Zenobia, erguida para deter o avanço da Quimera vindo das zonas de ruptura subsaarianas."
 landmark_hagia_sophia_plural: "$landmark_hagia_sophia$"
 landmark_hagia_sophia_desc: "Originalmente construída como uma catedral bizantina em 537, a Hagia Sophia tornou-se a principal mesquita otomana de Istambul após a conquista da cidade em 1453. Ela serviu como um museu secular durante boa parte da história da República Turca. Sua imensa cúpula central e os mosaicos bizantinos continuam entre as obras de arquitetura religiosa mais influentes já construídas, atraindo milhões de visitantes a Istambul todos os anos."
 landmark_forbidden_city_desc: "O complexo do palácio amuralhado no coração de Pequim serviu como residência imperial das dinastias Ming e Qing por quase cinco séculos. Hoje abriga o Museu do Palácio, possuindo uma das coleções mais importantes do mundo de arte e artefatos chineses. A Cidade Proibida é o local cultural mais visitado do país e um Patrimônio Mundial da UNESCO, destacando-se como o principal símbolo da civilização chinesa."
 landmark_tokyo_imperial_palace_desc: "A residência principal do Imperador do Japão desde a Restauração Meiji, localizada no local do antigo Castelo de Edo, no coração de Tóquio. O palácio e seus terrenos representam a continuidade da monarquia hereditária mais antiga do mundo. O acesso público é restrito, mas os Jardins Orientais e as principais cerimônias imperiais atraem um turismo substancial todos os anos."
 landmark_taj_mahal_plural: "$landmark_taj_mahal$"
 landmark_taj_mahal_desc: "Comissionado em 1632 pelo imperador mongol Shah Jahan como um mausoléu para sua esposa Mumtaz Mahal, o Taj Mahal é o exemplo mais bem-preservado da arquitetura mongol. Sua fachada de mármore branco, trabalho de incrustação complexo e jardins simétricos o tornaram um Patrimônio Mundial da UNESCO e um dos monumentos mais visitados da Terra, atraindo milhões de visitantes a Agra todos os anos."
 landmark_prague_castle: "Castelo de Praga"
 landmark_prague_castle_desc: "O maior complexo de castelo antigo do mundo em área, o serviu como a sede dos reis da Boêmia, imperadores do Sacro Império Romano-Germânico e, agora, do Presidente da República Tcheca. Dentro de suas muralhas, erguem-se a Catedral de São Vito e séculos de arte de toda a Europa Central, tornando o castelo o local cultural mais visitado do país."
 landmark_bojnice_castle: "Castelo de Bojnice"
 landmark_bojnice_castle_desc: "Uma restauração neogótica romântica de uma fortaleza medieval eslovaca, o Castelo de Bojnice foi reconstruído no final do século XIX sob o comando do Conde János Pálffy, no estilo dos castelos francês Loire Châteaux. Hoje, é um dos locais culturais mais visitados na Eslováquia, sua silhueta com torres e o parque ao redor servindo como a peça central do turismo de patrimônio eslovaco."
 landmark_sadabad_complex: "O Complexo de Sadabad é um complexo de palácios construído pelas dinastias Qajar e Pahlavi no sopé de Alborz, em Teerã. Abrangendo extensos jardins e vários palácios e pavilhões, o local serviu como residência de verão da família real iraniana e hoje funciona como um importante centro cultural e museológico do país."
 landmark_sadabad_complex_plural: "$landmark_sadabad_complex$"
 landmark_sadabad_complex_desc: "Um vasto complexo de palácios nos sopés ao norte de Teerã, construído originalmente sob os Qajars e expandido drasticamente pelos xás Pahlavi. Após a revolução de 1979, o complexo foi nacionalizado e hoje opera como uma rede de museus estatais que abrigam coleções reais, arte iraniana e história natural."
 landmark_hofburg_palace_desc: "O Hofburg, no coração de Viena, serviu por séculos como o principal palácio imperial da dinastia Habsburgo. Hoje, seus salões abrigam os escritórios do Presidente Federal da Áustria, a Escola Espanhola de Equitação, o Tesouro Imperial e vários museus importantes. Ele continua sendo um dos marcos definidores de Viena e a peça central do turismo cultural austríaco."
 landmark_berlin_reichstag_desc: "O edifício do Reichstag, na Platz der Republik, tem estado no centro político de Berlim há mais de um século. Gravemente danificado em 1933 e novamente durante a Segunda Guerra Mundial, foi restaurado após a reunificação sob o projeto de Norman Foster e reaberto em 1999 como a sede do Bundestag, o parlamento federal alemão. Sua cúpula de vidro tornou-se um símbolo definidor da democracia alemã moderna e uma grande atração no centro de Berlim."
 enrichment_facility: "Instalação de Enriquecimento Nuclear"
 enrichment_facility_plural: "Instalaçõs de Enriquecimento Nuclear"
 enrichment_facility_desc: "As instalações de enriquecimento recebem urânio e o enriquecem para uso em reatores nucleares e, em certa medida, em armamentos nucleares."