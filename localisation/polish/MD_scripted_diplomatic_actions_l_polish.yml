 REVOKE_CIV_SPY_ACCESS_ACTION_DESC: "Należy odciąć im dostęp do naszego systemu cywilnych satelitów rozpoznawczych i cofnąć wszelkie uprawnienia do korzystania z danych obrazowych. Działanie to pozbawi ich zdolności obserwacji Ziemi, uniemożliwi integrację z naszymi systemami odbioru danych oraz może znacząco zakłócić monitorowanie środowiska, planowanie działań w sytuacjach kryzysowych i ocenę stanu infrastruktury. Taki krok sygnalizuje pogorszenie relacji i ogranicza ich możliwości w zakresie prowadzenia obserwacji oraz analizy danych. Stracą oni dotychczasowy dostęp do naszej §Ycywilnej sieci satelitów rozpoznawczych§!."
