 module_naval_railgun_battery_1: "Batería de cañones de riel I"
 module_naval_railgun_battery_1_desc: "Las baterías de cañones de riel utilizan aceleración electromagnética para disparar proyectiles a alta velocidad, ofreciendo un rendimiento de perforación de blindaje excepcional contra buques de superficie al tiempo que proporcionan un potente apoyo de bombardeo terrestre a larga distancia.\n\n§GConsejo de diseño: Las baterías de cañones de riel combinan ataque de cañón, misiles antibuque y una alta perforación de cañón para el combate de superficie y el bombardeo costero. Son potentes en combatientes principales, pero exigen una cantidad sustancial de capacidad industrial (IC), mano de obra y recursos estratégicos.§!"
