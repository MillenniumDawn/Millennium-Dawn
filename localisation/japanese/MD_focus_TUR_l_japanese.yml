 TUR_close_balkans: "§Hバルカンセクションを閉じる§!"
 TUR_support_in_bulgaria: "§Hブルガリア§!での支持拡大"
 TUR_support_in_greece: "§Hギリシャ§!での支持拡大"
 TUR_support_in_macedonia: "§Hマケドニア§!での支持拡大"
 TUR_open_assimulate: "§HOpen Assimilated Countries§!"
 TUR_close_assimulate: "§HClose Assimilated Countries§!"
