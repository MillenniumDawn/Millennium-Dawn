 add_power_to_pkk: "Agregar Poder al PKK (para depuración)"
 add_power_to_pkk_desc: "Agrega poder al PKK"
 internal_preparation_1: "Preparativos Normales para Operaciones Internas"
 internal_preparation_1_desc: "The fastest and cheapest one. If we pick this, the actual offensive will have a success rate of 40%. In terms of cost efficiency, this one is better.\n\n§RWe can't make several preparations for a single operation type!§!"
 internal_preparation_2: "Preparativos Mediocres para Operaciones Internas"
 internal_preparation_2_desc: "Normal one. If we pick this, the actual offensive will have a success rate of 50%.\n\n§RWe can't make several preparations for a single operation type!§!"
 internal_preparation_3: "Buenos Preparativos para Operaciones Internas"
 internal_preparation_3_desc: "The slowest and most expensive one. If we pick this, the actual offensive will have a success rate of 60%. Not cost-efficient but with more guaranteed results.\n\n§RWe can't make several preparations for a single operation type!§!"
 internal_security: "Operaciones Internas"
 internal_security_desc: "Eastern part of our country has a rough terrain, it holds many deserted villages, castle-like natural valleys filled with caves, narrow passages around mountains where no one lives. These features are so useful for insurgencies and PKK uses it. We need to constantly attack and raze their makeshift bases to reduce their power and hinder their recruitment efforts.\n\nWe can't make cross-border operations and internal operations at the same time."
 external_preparation_1: "Preparativos Normales para Operaciones Externas"
 external_preparation_1_desc: "El más rápido y barato. Si elegimos esto, la ofensiva real tendrá una tasa de éxito del 40%. En términos de eficiencia de costos, este es mejor.\n\n§RNo podemos hacer varios preparativos para un solo tipo de operación!§!"
 external_preparation_2: "Preparativos Mediocres para Operaciones Externas"
 external_preparation_2_desc: "El normal. Si elegimos esto, la ofensiva real tendrá una tasa de éxito del 50%.\n\n§RNo podemos hacer varios preparativos para un solo tipo de operación!§!"
 external_preparation_3: "Buenos Preparativos para Operaciones Externas"
 external_preparation_3_desc: "El más lento y costoso. Si elegimos esto, la ofensiva real tendrá una tasa de éxito del 60%. No es eficiente en costos, pero con resultados más garantizados.\n\n§RNo podemos hacer varios preparativos para un solo tipo de operación!§!"
 external_security: "Operaciones transfronterizas"
 external_security_desc: "El PKK no solo existe dentro de nuestras fronteras, una buena parte de sus miembros tiene bases en el norte de Irak también, para aprovechar el mismo terreno accidentado, ser un poco más seguros de nuestro poder militar, controlar el contrabando y para el reclutamiento.\n\n También necesitamos atacar estas posiciones, aunque podamos enfrentar acusaciones de potencias extranjeras."
 prepping_ext: "Ya planificando una operación transfronteriza"
 prepping_int: "Ya planificando una barrida interna"
 collapse_mil_branch: "Ocultar decisiones de operación militar"
 expand_mil_branch: "Mostrar decisiones de operación militar"
 collapse_civ_branch: "Ocultar decisiones de reforma civil"
 expand_civ_branch: "Mostrar decisiones de reforma civil"
 TUR_counter_terrorism_civ: "Operaciones Contraterroristas - Rama Civil"
 college_professors: "Lidiando con Profesores Universitarios"
 college_professors_desc: "We have a fight on our hands and these people that are supposed to be enlightened, but they bitch about the situation and want the government to abdicate whenever a terrorist attack happens and call it genocide or xenophobia whenever we try to make a move against PKK. This needs to be stopped. We will either purge them or make sure they won't discredit our actions with baseless claims anymore"
 kurdish_language_1: "Problema del Idioma Kurdo"
 kurdish_language_1_desc: "For years there was an unwritten rule against Kurdish language. Not only opening television channels and universities with Kurdish language is banned, even if you are telling something Kurdish in public or in a street you might get attacked verbally. And nearly 20 percent of our population has Kurdish as their mother language. We need to solve this.\n\nUnlocks the second decision for more reforms."
 kurdish_language_2: "Poner Fin a la Discriminación"
 kurdish_language_2_desc: "Primero, castigar a las personas que atacan a los hablantes de kurdo. Nadie merece tener miedo de hablar su propio idioma.\n\nDesbloquea la tercera decisión para más reformas."
 kurdish_language_4: "Canales de TV Kurdos"
 kurdish_language_4_desc: "We will allow people to open Kurdish channels, not only this will discredit PKK's propaganda about Kurds being oppressed, it will win hearts of adult people who were born Kurdish and never got the chance to learn Turkish. Although we need to hire people to keep an eye on these channels and prevent them being used for PKK propaganda.\n\nUnlocks the fifth decision for more reforms."
 doing_counter_terror_op_civ: "Realizando otra reforma civil"
 investment_propaganda_1: "Proyectos de Infraestructura"
 investment_propaganda_1_desc: "Our eastern regions are lacking badly needed infrastructure to overcome rough terrain. In terms of equality and keeping people happy, we need to fix this."
 investment_propaganda_2: "Esfuerzo de Desempleo"
 investment_propaganda_2_desc: "Hungry people tend to become criminals. Former governments ignored the eastern regions and didn't care about the problems that caused the Kurds to feel oppressed. We need to do better than the ones before us."
 TUR_military_category: "Fuerzas Armadas Turcas"
 TUR_military_category_desc: "\n £TUR_desctext_TSK \n \n \n \n \nLas fuerzas armadas turcas han intervenido en la política turca más de una vez. Cada vez que han sentido su propia existencia o la de Turquía amenazada, han organizado (o intentado organizar) un golpe. Bastante a menudo esto ha surgido del gobierno turco alejándose del secularismo, y a veces de problemas económicos aparentemente causados por el gobierno.\n\nSi tu §YPosición§! con el [TUR.Nat_Autocracy_L] cae por debajo de §Y0§!, las Fuerzas Armadas tomarán medidas para deponer al gobierno.\n\nNuestra §YPosición§! actual: [?TUR_military_standing_value|0+]\n\n[?TUR_military_standing_party|=0+] de nuestro §YPartido Gobernante§! actual\n[?TUR_military_standing_conservatism|=0+] de nuestro §HSocial Conservatism - Government§!\n[?TUR_military_standing_opinion|=0+] de nuestras §YFuerzas Armadas§! Opinión Actual\n[?TUR_military_standing_corruption|=0+] de nuestro §YNivel de Corrupción§!\n[?TUR_military_standing_economy|=0+] de nuestro §YCiclo Económico§!\n[?TUR_military_standing_interest_rate|=0+] de nuestra §YTasa de Interés§!"
 TUR_hizmet_gulen_struggle: "La Lucha Hizmet-AKP"
 TUR_hizmet_gulen_struggle_desc: "An active power struggle exists between §W[Western_Autocracy_L]§! and the §W[Neutral_Muslim_Brotherhood_L]§!. The Turkish people are split between who they want, as both sides formed a coalition in order to take power in the last election. Both parties are vying for power in Turkey, and they gain more and more power every time they successfully pass a law or counter one. Eventually things will tip over to one side and the coalition will be dissolved.\n\nCurrently §W[Western_Autocracy_L]§! Control is at §Y[?hizmet_power|%]§!\n\nCurrently §W[Neutral_Muslim_Brotherhood_L]§! Control is at §Y[?akp_power|%]§!"
 TUR_expose_akp_scandal: "Exponer Escándalos del AKP"
 TUR_expose_akp_scandal_desc: "Expondremos un escándalo en el que §H[Neutral_Muslim_Brotherhood_L]§! ha estado involucrado"
 TUR_expose_gulenist_institution: "Shut down Gülenist institutions"
 TUR_expose_gulenist_institution_desc: "Cerraremos una institución dirigida por §H[Western_Autocracy_L]§!"
 TUR_random_rally_akp_gulen: "Mitin político entrante!"
 TUR_disaster_income: "Desastre Económico"
 TUR_disaster_income_desc: "Se dice que un desastre económico inminente se acerca al país, y está llegando rápido. Necesitamos poner nuestros actos en orden rápidamente para evitar que los partidos de oposición se formen y para evitar una crisis profundizada."
 TUR_incoming_collapse: "Desastre Inminente"
 TUR_incoming_collapse_desc: "The market will crash, leading to devastating consequences..."
 TUR_ciw_decisions: "CIW"
 TUR_ciw_decisions_desc: "The §HCIW§!, or otherwise known as the §HConfederation of Islamic Wellbeing§! is an organization that intends to improve the wellbeing of islamic peoples around the globe. The CIW leader, §HTurkey§!, will have the ability to §Hinvest in other CIW members§!, and it could be through §Hinfrastructure, networks, industries, or railways§!, etc. §HCIW Members§! can §Ropt out§! of the organization at anytime, but doing so will §Rrevoke§! their ability to re-apply at a later date.\nThe §HCIW leader§! will be able to invest in other countries' education, healthcare, industry, infrastructure and emergency supply infrastructure. Once the leader invests in one of these things, a modifier with the bonuses are added to all the §HCIW members§! at no cost to them. §HCIW Member§! states will be able to §Gask for investments§! which can give them buildings instead of the bonuses given from the §HCIW Leader§!. If a §HCIW Member§! chooses to do one of these decisions, then the §HCIW Leader§! will get a certain amount of money into their §GInternational Investments§!."
 TUR_invest_in_infrastructure: "Invertir en Infraestructura de la CIW"
 TUR_invest_in_infrastructure_desc: "Al poder construir una infraestructura adecuada, las naciones de la CIW proporcionarán vivienda y servicios adecuados a sus pueblos"
 TUR_invest_in_disasters: "Ayuda de la CIW en Caso de Desastre"
 TUR_invest_in_disasters_desc: "El mundo islámico pasa por bastantes desastres y, a menudo, no pueden reparar los daños causados. Podemos ayudar proporcionándoles suministros de emergencia."
 TUR_invest_in_education: "Invertir en Educación de la CIW"
 TUR_invest_in_education_desc: "Todos necesitan acceso a una educación adecuada y, por esa razón, vamos a tener que invertir en instalaciones educativas en las naciones de la CIW"
 TUR_invest_in_health: "Invertir en Salud de la CIW"
 TUR_invest_in_health_desc: "Las naciones de la CIW requieren atención médica para sus grandes poblaciones, ya que la medicina adecuada es difícil de conseguir o es demasiado cara."
 TUR_invest_in_industry: "Invertir en Industrias de la CIW"
 TUR_invest_in_industry_desc: "By investing in CIW countries' industries, we are able to make the Islamic world industrialize and catch up to the Europeans much quicker"
 TUR_leave_ciw: "Dejar la CIW"
 TUR_ask_for_infrastructure: "Solicitar inversiones en infraestructura"
 TUR_ask_for_network: "Solicitar inversiones en infraestructura de red"
 TUR_ask_for_supply: "Solicitar inversiones en transporte"
 TUR_ask_for_radars: "Solicitar inversiones en radar"
 TUR_ask_for_airbase: "Solicitar inversiones en aeropuertos"
 TUR_empower_sultan: "Fortalecer a los §W[Monarchist_L]§!"
 TUR_empower_sultan_desc: "The Sultan is the rightful owner of the Ottoman State, not some grumpy old man. The Sultan will take what is rightfully his, and he will get his supporters to march in and remove the current leader, even if it is done by force!"
 TUR_new_capital_mhp: "Reconstruir Konstantiniyye"
 TUR_new_capital_mhp_desc: "Ataturk movió nuestra capital de Konstantiniyye a Ankara. Aunque sus intenciones eran principalmente mantener la capital de Turquía alejada de sus enemigos, al final del día, no hará mucho. Reubicaremos nuestra capital en Konstantiniyye y la construiremos más grande que nunca!"
