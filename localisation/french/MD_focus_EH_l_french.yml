 EH_event.311.t: "Le portail se stabilise pleinement"
 EH_event.311.d: "L'imagerie thermique satellite confirme ce que les analystes redoutaient : le portail au-dessus de la Corne de l'Afrique a cessé de fluctuer et s'est verrouillé dans un état stable et permanent. Les drones de reconnaissance signalent l'essaim massé de l'autre côté, en nombre trop grand pour être compté."
 EH_event.311.a: "L'invasion a véritablement commencé"
 EH_research_sites_enabled: "Sites de recherche activés"
 EH_europe_defense_line_category: "Ligne de défense européenne"
 EH_europe_defense_line_category_desc: "Les lignes de défense européennes sont notre meilleure chance de tenir face aux forces chimères en Europe. Elles seront fortifiées d'artillerie lourde et de défenses antiaériennes, ainsi que d'un réseau de tranchées et de bunkers. Les armées de la plupart des nations européennes y seront stationnées. Il faut qu'elles tiennent lorsque la Russie tombera."
 EH_construct_europe_defense_line: "Construire la ligne de défense §Geuropéenne§!"
 EH_europe_defense_line_destruction: "Effondrement de la ligne de défense européenne"
 EH_event.810.t: "La ligne de défense européenne en construction"
 EH_event.810.d: "Vu l'importance de la frontière orientale de l'Europe, une nouvelle ligne est désormais en construction pour séparer le continent de l'Asie. C'est actuellement le plus grand investissement pour protéger cette région critique de l'invasion chimère. Certains l'appellent « la première et la dernière défense de l'Europe »."
 EH_event.810.a: "Intéressant"
 EH_event.811.t: "La ligne européenne percée"
 EH_event.811.d: "Les forces chimères ont percé l'énorme mur de défense européen ce matin. Avec une puissance écrasante, les Chimères ont enfoncé les fortifications et marchent désormais vers les nations européennes. Si la Fédération européenne n'élabore pas un plan efficace pour les arrêter, l'Europe sera perdue."
 EH_event.811.a: "Et maintenant ?"
 EH_europe_line_wall_modifier: "Mur de ligne Europe"
