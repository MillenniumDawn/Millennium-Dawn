l_russian:
 france_focus: "Дерево фокусов Франции"
 FRA_state_of_french_politics: "Французская политика"
 FRA_state_of_french_politics_desc: "Франция занимает одно из самых интересных и нестабильных политических мест в мире. Долгое время наша Пятая республика была образцом стабильности, где власть попеременно переходила от социалистического блока к консервативному. Но с наступлением нового тысячелетия ситуация становится все более неопределенной. Одни партии зарождаются, другие рушатся; никто не может сказать, куда нас приведут грядущие годы."
 FRA_nationalism_in_europe: "Подъем национализма"
 FRA_nationalism_in_europe_desc: "Похоже, победа бонапартистов во Франции подталкивает националистов во всех европейских странах к всё большему вовлечению в политику. Хотя этот импульс может позволить нам лучше противостоять конфликту с иностранным государством, действия этих агитаторов в мирное время представляют собой реальную проблему."
 FRA_economic_policy: "Программа Берси"
 FRA_economic_policy_desc: "Берси возглавляет управление казначейства и статистиков INSEE, и в конечном итоге каждое министерство, расходующее франк, подотчетно ему. Франция занимает пятое место среди мировых экономик, и этот рейтинг она занимает скорее благодаря политике, чем размеру."
 FRA_free_market: "В единый рынок"
 FRA_free_market_desc: "Единый рынок вывел министерство из-под контроля в вопросах ценообразования и позволил нашим экспортерам конкурировать на собственных условиях. France Telecom и Air France уже перешли в частную собственность. Остается лишь открыть остальные рынки и позволить торговле прийти к нам."
 FRA_total_sa: "Total SA"
 FRA_total_sa_desc: "Компания Total поглотила Petrofina и Elf ​​Aquitaine, став одним из крупнейших производителей нефти в мире, владея газовым месторождением Лак и скважинами Парентис, а инженерные работы ведутся из центра CSTJF в По. Аквитания по-прежнему располагает запасами нефти, превышающими возможности крупных компаний. Партнерство на условиях Республики позволило бы использовать эту нефть в наших интересах."
 FRA_french_economic_intervention: "Диригизм"
 FRA_french_economic_intervention_desc: "Колберт задал схему: штат выбирает важные отрасли и готовит лидеров для их управления. Планировочный комиссариат определяет направление развития, а заслуга в этом принадлежит министерствам. Уже существующие предприятия будут получать более интенсивную поддержку, независимо от того, как это повлияет на очередь на получение разрешений для новых."
 FRA_reduction_in_taxes: "Сокращение налогов Professionnelle"
 FRA_reduction_in_taxes_desc: "Профессиональный налог взимается с машин и помещений, то есть именно с тех инвестиций, которые мы, как заявляем, хотим осуществить. Добавьте к этому социальные отчисления, и Франция окажется под одним из самых высоких бремен обязательных налогов в Европе. Сокращение этих налогов должно оставить что-то в кассе и в зарплатных ведомостях."
 FRA_deregulation: "Комиссия Аттали"
 FRA_deregulation_desc: "Комиссия по освобождению французского экономического роста под председательством Жака Аттали определила наиболее жесткие правила: коммерческое зонирование, защищенные профессии, разрешения, выдача которых занимает годы. Отмена этих правил открывает путь для развития регионов, которые градостроители списали со счетов. Профсоюзы воспримут каждую строчку этого документа как угрозу."
 FRA_state_stock_in_sa: "Золотая акция"
 FRA_state_stock_in_sa_desc: "Золотая акция и акции, находящиеся в распоряжении Agence des Participations de l'Etat, дают Республике право голоса, которое не может превзойти ни одно собрание акционеров. Объемы производства, экспортные контракты и цены на бензин — все это проходит через контролируемый нами стол."
 FRA_paris_employment_projects: "Гранд-Парижские работы"
 FRA_paris_employment_projects_desc: "Железнодорожная линия Сена-Сен-Дени так и не смогла восстановить утраченные объемы работ, в то время как башни Ла-Дефанс возвышаются всего в нескольких станциях от нее. Занятия на Большом Парижском вокзале могут использовать оставшиеся ресурсы: площадки, контракты и заработную плату внутри региона Иль-де-Франс."
 FRA_nationalization_of_steel: "Возвращение Усинора"
 FRA_nationalization_of_steel_desc: "Компания Usinor-Sacilor владеет Лотарингским бассейном и заводами в Фос-сюр-Мер и Флоранге, и она подотчетна своим акционерам, а не Республике. Сталь перестает быть товаром в тот момент, когда от нее зависят верфи и танкерные заводы. Передача заводов в государственную собственность порадует профсоюзы и вызовет гнев в советах директоров."
 FRA_private_contracting: "Заключение контрактов с крупными компаниями"
 FRA_private_contracting_desc: "Компании Bouygues, Vinci и Eiffage будут участвовать в тендерах на партнерские контракты, где подрядчик устанавливает цену и получает прибыль. Строительство завершается быстрее, чем любое министерство могло бы справиться с этим, и мы платим за это дополнительную плату."
 FRA_tapping_resources: "Бриньолес и Салау"
 FRA_tapping_resources_desc: "Провансальские бокситы в окрестностях Бриньоля и Ле-Бо поставляются на глиноземный завод в Гарданне, а вольфрамовая руда до сих пор залегает под рекой Арьеж в Салау. Залежи были заброшены, когда импорт стал дешевле. Возобновление их разработки – это разница между покупкой наших сплавов и их производством."
 FRA_offshore_oilrigs: "Морская лицензия Гайаны"
 FRA_offshore_oilrigs_desc: "Разработка месторождения Заэдюс у побережья Куру доказала, что в морских блоках Гайаны в глубоководных районах содержится нефть. Лицензия принадлежит нам, и буровые установки могут быть введены в эксплуатацию в течение года. Гайана и Суринам претендуют на одно и то же морское дно и будут громко заявлять об этом."
 FRA_state_run_construction: "Государственные общественные работы"
 FRA_state_run_construction_desc: "В рамках государственной собственности на проекты администрация устанавливает цену, сроки и численность персонала, и ни один подрядчик не получает от этого прибыли. Этот недостаток хорошо известен: проект, одобренный без полного финансирования, оставляет строительные бригады простаивать целый сезон."
 FRA_infrastructure_projects: "Контракты по планам развития штатов и регионов"
 FRA_infrastructure_projects_desc: "В рамках заключенных между государством и каждым региональным советом договоров предусмотрено софинансирование дорог, железных дорог и сетей, которые ни один совет не смог бы профинансировать самостоятельно. План возрождения автомагистралей и региональные управления планирования уже находятся в стадии рассмотрения."
 FRA_decentralization: "Второй акт децентрализации"
 FRA_decentralization_desc: "В конституции четко указано, что организация Республики децентрализована. Компетенции и налоги для их финансирования переходят от префектов к региональным советам, а решения принимаются там, где действительно существует проблема. Парижу остается гораздо меньше, чем он привык."
 FRA_centralization: "Якобинское государство"
 FRA_centralization_desc: "Согласно якобинской традиции, одна республика означает одну администрацию, и корпус префектур существует для того, чтобы это обеспечивать. Каждая статья региональных расходов возвращается в Берси на утверждение. Это обходится в целое состояние на клерков и обеспечивает государство, которое действует по приказу."
 FRA_french_healthcare: "Социальная безопасность"
 FRA_french_healthcare_desc: "Социальное обеспечение распространяется на всех, и Всемирная организация здравоохранения поставила его результат на первое место в мире. Что бы ни твердила республика, никто не выступает за его демонтаж. Увеличение бюджета здравоохранения до уровня, соответствующего уже обещанным мерам, обеспечивает спокойствие внутри страны, а это недешево."
 FRA_french_arms_industries: "Генеральное управление вооружения"
 FRA_french_arms_industries_desc: "Генеральное управление вооружений разрабатывает требования и подписывает чеки для компаний Nexter, Dassault, Thales, Naval Group, MBDA и Safran. Именно поэтому Франция может проектировать истребитель, фрегат и ракету, не спрашивая ни у кого разрешения."
 FRA_research_and_dev_projects: "CNRS и CEA"
 FRA_research_and_dev_projects_desc: "Лаборатории CNRS и Комиссия по атомной энергии представляют французскую науку, а налоговые льготы на исследования привлекают частные инвестиции. Создание кластеров конкурентоспособности связывает университеты с окружающими их отраслями промышленности. Законопроект попадает в бюджет образования."
 FRA_reformed_universal_healthcare: "Универсальная медицинская защита"
 FRA_reformed_universal_healthcare_desc: "Всеобщая медицинская защита заменяет собой систему страхования, основанную на проверке нуждаемости, поэтому страховое покрытие зависит от места жительства, а не от места работы. Более здоровое и спокойное население, достигнутое ценой реформы, которую никто в министерствах не хотел проводить. В сельской местности по-прежнему есть районы, где вообще нет врачей, а у больниц, финансируемых за счет выручки, нет причин открывать собственную."
 FRA_nexter: "Nexter Systems"
 FRA_nexter_desc: "Компания GIAT Industries, переименованная в Nexter, производит основной боевой танк Leclerc, самоходную гаубицу CAESAR и бронетранспортер VBCI. Проектирование осуществляется в Сатори под Парижем, а сборка — в Роанне. Обе площадки обладают производственными мощностями, которые мы так и не смогли полностью оплатить."
 FRA_dassault: "Дассо Авиация"
 FRA_dassault_desc: "Компания Dassault Aviation производит истребители Rafale и Mirage 2000, бизнес-джеты Falcon, которые частично покрывают их стоимость, а также демонстрационный образец nEUROn, который будет разработан в дальнейшем. Окончательная сборка осуществляется на заводе в Мериньяке, недалеко от Бордо, при поддержке аэрокосмического кластера, расположенного по другую сторону Миди-Пиренеев."
 FRA_thales_group: "Thales и Naval Group"
 FRA_thales_group_desc: "Компания Thomson-CSF стала Thales и поставляет радары и боевые системы для фрегатов FREMM и авианосца «Шарль де Голль». Корпуса кораблей производятся на верфях в Сен-Назере и в цехах подводных лодок в Шербуре. Поддержание всех этих мощностей является самым дорогостоящим направлением в отрасли."
 FRA_usa_fra_collaboration: "Партнерство Safran-GE"
 FRA_usa_fra_collaboration_desc: "Компания CFM International, совместное предприятие Safran и General Electric, передала французские двигатели под американское крыло и щедро оплатила услуги обоих партнеров. Приборы CNES уже используются в миссиях НАСА. Есть возможность расширить это сотрудничество и на лаборатории, которые их разрабатывают."
 FRA_the_french_agriculture: "Зернохранилище Европы"
 FRA_the_french_agriculture_desc: "Франция является крупнейшим производителем сельскохозяйственной продукции в Европейском Союзе и получает наибольшую долю средств Общей сельскохозяйственной политики. Ассоциация фермеров и сельскохозяйственных производителей Франции (FNSEA) представляет интересы фермеров, а Парижская сельскохозяйственная выставка — это место, куда политики приезжают, чтобы показать себя. Хорошая почва — это стратегически важное владение, и обрабатывать её следует соответствующим образом."
 FRA_the_vineyard_industries: "Названия"
 FRA_the_vineyard_industries_desc: "Система наименований по происхождению, контролируемая INAO, отличает Бордо, Бургундию и Шампань от всех зарубежных подделок. Moet Hennessy продает свою продукцию на всех рынках мира. Никакой рекламный бюджет не обеспечит такой репутации."
 FRA_the_dairy_industry: "Лакталис и кооперативы"
 FRA_the_dairy_industry_desc: "Компании Lactalis и Danone закупают сыр у кооператива Sodiaal, а также у фермеров по всей Нормандии и Юре. Сыры Comte и Camembert имеют защищенные товарные знаки, а то, что не попадает к производителям сыра, используется для производства порошков, йогуртов и детских смесей, продаваемых по всему миру."
 FRA_wheat_industry: "Пшеница из Боса"
 FRA_wheat_industry_desc: "Равнина Бос — это житница Франции, и урожай с нее доставляется по железной дороге в Руан, крупнейший зерновой экспортный порт в Европе. Покупатели по всей Северной Африке и на Ближнем Востоке зависят от прибытия этих грузов, и это такое влияние, которому не может сравниться ни одно посольство."
 FRA_mechanized_agriculture: "Машиностроительные кооперативы"
 FRA_mechanized_agriculture_desc: "Кооперативы по совместному использованию сельскохозяйственной техники позволяют фермерским хозяйствам, которые никогда не смогли бы приобрести их в собственность, получить доступ к комбайнам и пресс-подборщикам. Навесное оборудование Kuhn от Saverne, погрузчики Manitou и комбайны с спутниковым наведением уже используются в полях. Инженерные решения, лежащие в их основе, заслуживают развития в стране."
 FRA_packaging_industries: "Сидель и Вераллиа"
 FRA_packaging_industries_desc: "Компания Sidel строит в Нормандии линии розлива и упаковки, которые используются в пищевой промышленности, а компания Verallia, отделившаяся от Saint-Gobain, поставляет стеклянную упаковку. Упаковка, произведенная во Франции и пригодная для вторичной переработки, предотвращает завершение цепочки создания стоимости на границе."
 FRA_agriculture_industry: "Агропродовольственные гиганты"
 FRA_agriculture_industry_desc: "Danone, Lactalis, Bel и Bonduelle превращают урожай в брендированную экспортную продукцию, которая сохраняет свою цену на любом рынке. Обеспечение себя продовольствием — это нижний предел. Продажа излишков — это прибыль."
 FRA_improved_railways: "Reseau Ferre de France"
 FRA_improved_railways_desc: "Компания Reseau Ferre de France владеет железнодорожными путями под каждым поездом SNCF, поэтому государство решает, что на них будет построено. Системы сигнализации Alstom и исследования для новых высокоскоростных трасс определяют будущее поколение сети."
 FRA_focus_on_rails: "Подвижной состав из Бельфора"
 FRA_focus_on_rails_desc: "Компания Alstom производит локомотивы в Бельфоре и вагоны в Ла-Рошеле, двухэтажные высокоскоростные составы для магистральных линий и региональные поезда в Креспене. Размещенные сейчас заказы обеспечивают работу этих заводов и поставку подвижного состава."
 FRA_high_speed_rail_lines: "LGV Europeenne"
 FRA_high_speed_rail_lines_desc: "Высокоскоростная линия, идущая на восток к Страсбургу и Рейну, соединяет нашу железнодорожную сеть с Германией, а Thalys и Eurostar доставляют её через тоннель под Ла-Маншем. Мировой рекорд скорости на железной дороге установлен на французских путях. Нет никаких причин, по которым карта должна заканчиваться на границе."
 FRA_luxury_goods: "LVMH и Kering"
 FRA_luxury_goods_desc: "LVMH, Kering, Hermes и Chanel доминируют в торговле, которую никому за рубежом не удалось скопировать, а комитет Кольбера оберегает мастерство, стоящее за ней. Площадь Вандом и авеню Монтень — это адреса, которые сами по себе пользуются спросом. Дома моды остаются в Париже, и их штаб-квартиры тоже должны там находиться."
 FRA_tourism_industry: "О Франции"
 FRA_tourism_industry_desc: "Компания Atout France рекламирует самую посещаемую страну в мире, и это подтверждают данные о доходах. Лувр, Эйфелева башня и парижский Диснейленд привлекают толпы туристов, которые города уже не вмещают, и жители начали открыто об этом говорить."
 FRA_the_gorgeous_coasts: "Организация по охране побережья"
 FRA_the_gorgeous_coasts_desc: "Организация Conservatoire du Littoral выкупает береговую линию до начала застройки, от Флёри в Нормандии до скал Корсики, Лазурного берега и атлантических пляжей региона Пей-де-ла-Луар. Благодаря этому, доступ к этим береговым линиям снижается нагрузка на города."
 FRA_the_spaces_between: "La France Profonde"
 FRA_the_spaces_between_desc: "Футуроскоп под Пуатье доказал, что поле во внутренней части страны может привлекать миллионы. Плато Лимузена, виноградники и собор Реймса, а также альпийские курорты Савойи обладают тем же преимуществом, но без такой переполненности. Чего им не хватает, так это транспортной доступности, и деревни, оставшиеся после строительства железных дорог, не будут ждать вечно."
 FRA_beaches_of_france: "Довиль — Биарриц"
 FRA_beaches_of_france_desc: "Пляжи Нормандии, побережье Биаррица, известное своими прибоями, и широкие песчаные пляжи Опальского побережья привлекают туристов, которые никогда не бывали в Париже. Этот вид отдыха, охватывающий все времена года и регионы, востребован круглый год, и это никого не смущает."
 FRA_energy_sector: "План Мессмера"
 FRA_energy_sector_desc: "В рамках программы Мессмера реакторы были построены вдоль Роны, Рейна и Ла-Манша, и теперь три четверти энергосистемы работает на ядерном делении. EDF, Framatome и Комиссия по атомной энергии построили и до сих пор эксплуатируют эти реакторы. Никакой зарубежный картель не устанавливает цены на французскую электроэнергию."
 FRA_renewable_investments: "Плотины Роны"
 FRA_renewable_investments_desc: "Компания «Compagnie Nationale du Rhone» управляет цепочкой плотин вдоль всей реки, включая гидроаккумулирующие электростанции Серр-Понсон и Альпин, расположенные выше по течению, и плотины Трюйер на другом берегу Оверни. Приливная электростанция на реке Ранс работает задолго до того, как ее стали называть возобновляемым источником энергии. Уровень воды продолжает падать, независимо от колебаний топливного рынка."
 FRA_solar_investments: "Солнечная энергия в Миди"
 FRA_solar_investments_desc: "Солнечный пояс Провансаля и нижняя долина Роны получают столько света, чему север может только позавидовать, и компания EDF Renouvelables уже строит там солнечные парки. Солнечная печь в Одеилло доказывает физические принципы работы солнечных батарей задолго до того, как они стали доступными по цене. Это дорого, но ресурсы неисчерпаемы."
 FRA_wind_investments: "Трамонтанский коридор"
 FRA_wind_investments_desc: "На северных равнинах ветры простираются от горизонта до горизонта, а гондолы для атлантических ветропарков собираются в Сен-Назере и Ле-Гавре. Трамонтана, идущая вниз по Оду, привела в движение первые французские ветряные турбины и доказала свою эффективность десятилетия назад. Ветер ничего не стоит и не прекращается."
 FRA_the_northern_reactors: "Реакторы Чооз"
 FRA_the_northern_reactors_desc: "Реакторы в Шузе расположены на реке Маас в Арденнах, а в Ножане — на Сене ниже по течению; оба энергоблока получают охлаждающую воду из рек, пересекающих границы. Два полностью модернизированных энергоблока обеспечат бесперебойную работу северной энергосистемы на целое поколение. Брюссель и Берлин начнут протестовать, как только планы будут опубликованы."
 FRA_improved_nuclear_waste_management: "Ла-Аг и Бюр"
 FRA_improved_nuclear_waste_management_desc: "В Ла-Аге отработанное топливо перерабатывают в смешанный оксид, в Маркуле занимаются тем, что нельзя использовать повторно, а в глубоководном хранилище в Бюре ведется добыча оставшегося топлива. Утверждение наших оппонентов об отходах является наиболее убедительным, поэтому именно на него мы должны ответить."
 FRA_expanded_enrichment_facilities: "Жорж Бессе II"
 FRA_expanded_enrichment_facilities_desc: "Центрифужное обогащение на площадке Жорж Бессе II в Трикастене заменяет диффузионные цеха, работа которых потребляла энергию, эквивалентную энергии целого реактора. Обогащение на территории страны означает, что топливо не зависит от иностранного поставщика."
 FRA_the_new_energy_dawn: "Свет Европы"
 FRA_the_new_energy_dawn_desc: "Межсистемные соединения передают избыточный ток в Великобританию, Италию, Испанию и Германию, а Франция является крупнейшим нетто-экспортером электроэнергии на континенте. Наши соседи платят за то, что нашей собственной энергосистеме не нужно."
 FRA_french_armed_forces: "Французские вооружённые силы"
 FRA_french_armed_forces_desc: "На протяжении большей части истории Франции Вооруженные силы были источником огромной гордости для нашей страны. От армий, которые выступали против англичан, защищая наше право на французского короля, до людей, служивших под командованием самого Наполеона, армия остается одним из наших самых веских аргументов, отличающих нас от других."
 FRA_the_french_army: "Французская армия"
 FRA_the_french_army_desc: "Французская армия (Armée de Terre) — одна из трех основных ветвей вооруженных сил нашей страны. Достижения нашей армии широко известны. Необходимо и дальше чтить ее заслуги и расширять ее вооружённые силы, чтобы способствовать дальнейшему развитию нашей страны."
 FRA_the_french_air_force: "ВВС"
 FRA_the_french_air_force_desc: "Наши военно-воздушные силы — одни из старейших в мире. Первый контингент французской авиации был сформирован в 1909 году как подразделение французской армии. Сейчас это самостоятельное подразделение, и мы экспортируем одни из лучших образцов военно-воздушных сил в мире."
 FRA_french_navy: "ВМФ"
 FRA_french_navy_desc: "Французский флот помог продвинуть наши амбиции и стремления в глобальном масштабе. Он способствовал созданию одной из крупнейших колониальных империй в мире, соперничающей с испанской и английской. Инвестиции в него позволят нам и дальше расширять свое присутствие за рубежом."
 FRA_amx_leclerc: "AMX «Леклерк»"
 FRA_amx_leclerc_desc: "Танк AMX Leclerc и его преемники относятся к классу основных боевых танков французской армии. Он отличается прочностью и универсальностью, как и большинство современных танков. Дальнейшие инвестиции в их разработку могут укрепить наши бронетанковые войска."
 FRA_network_centric_warfare: "Сетевая централизованная война"
 FRA_network_centric_warfare_desc: "Подобно американцам и другим европейским майорам, мы должны инвестировать в более технологически продвинутые методы ведения войны, чтобы уйти от использования людей и начать больше полагаться на технологии. Изменение будет дорогостоящим, но, в конечном счете, оно спасет больше французских жизней."
 FRA_land_air_coordination: "Наземная воздушная координация"
 FRA_land_air_coordination_desc: "Координация действий \"сухопутных войск\" имеет жизненно важное значение для любой операции совместной целевой группы. Без наземных сил мы не сможем продвигать фронтовые позиции; без воздуха мы не сможем рассчитывать на эффективную огневую поддержку. Поэтому мы должны добиваться лучшей координации между воздушной и наземной войнами."
 FRA_the_mirage: "Мираж"
 FRA_the_mirage_desc: "Мираж стал одним из культовых истребителей французских ВВС. Он используется на вооружении еще девяти стран мира и является импортным истребителем для многих."
 FRA_maritime_fighters: "Морские истребители"
 FRA_maritime_fighters_desc: "Улучшения как в наших военно-воздушных силах, так и в военно-морском флоте потребуют более эффективных военно-морских истребителей."
 FRA_lafayette_class: "Легкий стелс фрегат"
 FRA_lafayette_class_desc: "Фрегаты класса Frégate Légère Furtive были спроектированы в конце 1980-х годов для замены устаревающих эсминцев. Это легкие многоцелевые суда, хорошо подходящие для выполнения оборонительных задач во французском флоте."
 FRA_de_gaulle_class: "Тип «Де Голль»"
 FRA_de_gaulle_class_desc: "Авианосец класса «Де Голль» — десятый авианосец, построенный для службы во французском флоте. Это также единственный атомный авианосец за пределами ВМС США, что делает его грозным и мощным кораблем."
 FRA_amx_10: "AMX-10"
 FRA_amx_10_desc: "AMX-10 - легкий разведывательный танк для французской армии. AMX может похвастаться впечатляющей скоростью 85 км на идеальной местности. Нет необходимости говорить, что AMX движется чертовски быстро."
 FRA_vbci: "VBCI"
 FRA_vbci_desc: "Бронемашина VBCI была разработана для замены устаревающей AMX-10P и поступила на вооружение к 2008 году. VBCI имеет множество улучшений, в том числе она быстрее, чем скоростная AMX, развивая максимальную скорость 100 км/ч. Однако VBCI жертвует мощным орудием в пользу более лёгкого вооружения и более высоких скоростей."
 FRA_forward_air_bases: "Передовые авиабазы"
 FRA_forward_air_bases_desc: "Для того чтобы подготовиться к любому исходу, мы должны построить наши передовые авиабазы, чтобы обеспечить надлежащую постановку наступательных или оборонительных планов."
 FRA_mirage_2000d: "Мираж 2000Д"
 FRA_mirage_2000d_desc: "Mirage 2000D — это обычный штурмовик, который верно служил нам с момента своего создания. Стремление к созданию более совершенных самолетов лишь отдаст дань уважения наследию Mirage."
 FRA_carrier_fighters: "Рафаль Марин"
 FRA_carrier_fighters_desc: "Морская пехота Rafale является версией обычного истребителя Rafale. Он может похвастаться конструкцией, аналогичной его наземному варианту. В целом, истребитель является монстром в битве за моря."
 FRA_med_naval_bases: "Средиземноморские морские базы"
 FRA_med_naval_bases_desc: "Корсика является основной территорией для усовершенствованной военно-морской базы. Она отделена от материка, и в то же время является относительно обороноспособной."
 FRA_triomphant_class: "Тип «Триумфан»"
 FRA_triomphant_class_desc: "Подводные лодки класса «Триумфант» были построены для замены более ранних моделей и в настоящее время составляют основную часть океанических сил ядерного сдерживания."
 FRA_ifv_investment: "Инвестиции в БМП"
 FRA_ifv_investment_desc: "Инвестиции в более совершенные БМП и другие виды легкой бронированной техники должны помочь нам укрепить нашу армию и экономику!"
 FRA_national_arms_exports: "Национальный экспорт оружия"
 FRA_national_arms_exports_desc: "Франция стала крупным игроком в оборонной промышленности, и нам следует продолжать двигаться в этом направлении."
 FRA_the_space_program: "Космическая программа"
 FRA_the_space_program_desc: "Космос — это новый рубеж, и с недавнего времени мы доказали, что можем многому научиться в космосе! Стоит вновь укрепить доверие к нашей космической программе."
 FRA_floreal_class: "Тип «Флореаль»"
 FRA_floreal_class_desc: "Класс Флореаль представляет собой большинство легких фрегатов во французской армаде. Класс \"Флореаль\" и его преемники - это активные корабли, предназначенные для ведения многоцелевых боевых действий как в противокорабельной, так и в военно-морской, противоавиационной и умеренной противолодочной войнах."
 FRA_laredoubtable_class: "Превосходный класс"
 FRA_laredoubtable_class_desc: "Подводные лодки класса «Редутабель» — одни из старейших подводных лодок, находящихся на вооружении французского флота. Однако их роль не вызывает сомнений, поскольку они играют ключевую роль в французской военно-морской стратегии ядерного сдерживания."
 FRA_honour_and_fidelity: "Честь и Верность "
 FRA_honour_and_fidelity_desc: "Девиз Французского легиона очень близок нашей стране. Военные, в частности, воплощают эти ценности: честь в своих действиях и верность, проявляющуюся в непоколебимой преданности французской родине."
 FRA_cnes_budgeting: "Бюджетирование Национального центра космических исследований"
 FRA_cnes_budgeting_desc: "Национальный центр космических исследований является основной частью французской авиации и воздухоплавания. Мы должны позволить бюджетировать Национальный центр космических исследований, чтобы мы могли продолжать продвигать и оставаться конкурентоспособными на этом новом рубеже."
 FRA_international_space_research: "Международная космическая инициатива"
 FRA_international_space_research_desc: "Мы должны работать с другими странами, такими как Соединенные Штаты, чтобы начать продвигать этот рубеж!"
 FRA_kourou_launch_pad: "Стартовая площадка Куру"
 FRA_kourou_launch_pad_desc: "Куру во Французской Гайане является как стратегическим местом запуска космических аппаратов, так и непосредственной территорией, принадлежащей нам. Мы можем также заключать сделки с другими космическими агентствами о них, используя это прекрасное место."
 FRA_honour_homeland_valour_discipline: "Честь, Родина, Доблесть, Дисциплина"
 FRA_honour_homeland_valour_discipline_desc: "Девиз французского военно-морского флота выражает нечто большее, чем просто смысл службы в армии. Наш народ един с родиной, полон чести и доблести, дисциплинирован в своем мужестве."
 FRA_french_space: "Французская космическая программа"
 FRA_french_space_desc: "Наше доминирующее положение в космических частях, модернизация которых, имеет жизненно важное значение для нас."
 FRA_francosphere: "Франкосфера"
 FRA_francosphere_desc: "Франция практикует неоколониализм с конца Второй мировой войны. Не оккупируя напрямую земли этих стран, Франция выступает в роли кукловода, дергая за ниточки в их интересах. Однако с началом XXI века многие готовы уменьшить свою зависимость от Парижа как источника лидерства. Поэтому настало время Франции действовать соответствующим образом."
 FRA_the_levant_problem: "Проблема Леванта"
 FRA_the_levant_problem_desc: "Левант - часто упускаемая из виду часть Франкосферы. Когда-то этот регион поставлял во французскую империю ценное зерно, фрукты и нефть."
 FRA_antagonize_syria: "Настроить Сирию против себя"
 FRA_antagonize_syria_desc: "Сирия при правлении Асада приняла слишком много неверных решений. Мы должны дестабилизировать режим и начать способствовать принятию Сирией нашей идеологии, а также свергнуть диктаторов."
 FRA_supporting_armenia: "Поддержка Армении"
 FRA_supporting_armenia_desc: "Армения — относительно новый участник франкосферы, но, тем не менее, является стратегическим союзником. Борьба этой страны во многом напоминает нашу собственную, и мы должны поддержать Армению в её борьбе в Карабахе."
 FRA_anti_assad_regime_message: "Противостояние режиму Асада"
 FRA_anti_assad_regime_message_desc: "Хотя мы и раньше открыто выражали враждебность по отношению к Сирии, сейчас настало время говорить прямо и перестать ходить вокруг да около. Ситуация в Сирии при правлении Асадов ухудшилась, и мы должны продолжать выражать свое презрение к Асадам."
 FRA_escalation_from_the_damascus_spring: "Полдержка Дамасской весны"
 FRA_escalation_from_the_damascus_spring_desc: "Дамасская весна началась в полную силу. Сейчас крайне важно, чтобы мы продолжали поддерживать продемократические движения в Сирии и на всем Ближнем Востоке."
 FRA_collaboration_with_the_fsa: "Сотрудничество с сирийскими повстанцами"
 FRA_collaboration_with_the_fsa_desc: "Повстанцам потребуется значительное количество ресурсов, чтобы противостоять Асадам. Мы должны изучить наши возможности и то, что мы можем предоставить группе, которая поведет Сирию вперед."
 FRA_oil_and_gas_investments: "Инвестиции в нефтегазовую отрасль"
 FRA_oil_and_gas_investments_desc: "Левант обладает значительными запасами нефти и газа. Инвестирование ресурсов и рабочей силы в нефтегазовую отрасль в этом регионе всегда будет выгодным."
 FRA_reminder_of_the_taif_agreement: "Напоминание о Таифском соглашении"
 FRA_reminder_of_the_taif_agreement_desc: "Таифское соглашение, официально известное как Соглашение о национальном примирении, было достигнуто, чтобы ознаменовать конец ливанской гражданской войны и вернуть страну к нормальной жизни. Мы должны напомнить Ливану и Ближнему Востоку о Таифских соглашениях и стремиться положить конец существованию «Хезболлы»."
 FRA_root_out_hezbollah: "Уничтожить Хезболлу"
 FRA_root_out_hezbollah_desc: "Хезболла - прямой вызов Ливану, Таифскому соглашению и миру в регионе. Искоренение Хезболлы - один из первых шагов к установлению мира на Ближнем Востоке."
 FRA_agriculture_works_in_the_levant: "Сельскохозяйственные работы в Леванте"
 FRA_agriculture_works_in_the_levant_desc: "В Леванте целесообразно осуществлять различные инвестиции в сельское хозяйство. Вопреки большинству зарубежных представлений об этом регионе, он обладает огромным потенциалом. Многие культуры можно выращивать на пышных побережьях Леванта или в речных долинах Сирии. Мы должны изучить возможности наших инвестиций в этот регион и помочь использовать сельскохозяйственную мощь Леванта."
 FRA_francafrique: "Франсафрика"
 FRA_francafrique_desc: "Африка когда-то была одним из столпов нашей бывшей колониальной империи. Страны бывшей Франкафрики должны и в новом столетии следовать нашему примеру. Мы должны изучить наилучшие способы помочь им и сохранить наше влияние в регионе."
 FRA_francophone_solidarity: "Франкоязычная солидарность"
 FRA_francophone_solidarity_desc: "Это была инициатива, направленная на продвижение франкоязычной культуры и французских ценностей среди франкоязычных стран. Инициатива включала в себя расширение доступа к образованию для стран с низким уровнем дохода и экономическую поддержку развивающихся стран в надежде на то, что они укрепят и расширят свои позиции, которые сохранили после деколонизации. В частности, в африканских странах Франция активно участвовала в поддержке партнерских отношений между африканскими государствами, что позволяло ей сохранять свое влияние и приносить выгоду."
 FRA_continue_cold_war_mentality: "Продолжение менталитета холодной войны"
 FRA_continue_cold_war_mentality_desc: "Многие представители общественности и международного сообщества считают, что наш статус мировой державы ослабевает. Мы должны любой ценой сохранить свои позиции ведущей мировой державы. Возвращение к старым методам не будет популярным на международной арене, но необходимо предпринять действия. Критика со временем утихнет."
 FRA_NEPAD_development: "Развитие НЕПАД"
 FRA_NEPAD_development_desc: "Новое партнерство для развития Африки (сокращенно НЕПАД) — это программа экономического развития, разработанная Африканским союзом совместно с партнерами из Европейского союза, Китая, Японии и других стран «Большой восьмерки». Мы особенно заинтересованы в развитии НЕПАД и взяли на себя ключевую роль в качестве основного спонсора программы в финансовом и политическом плане со стороны Европейского союза. Нам следует рассмотреть возможность содействия расширению программы и увеличению финансирования и поддержки, чтобы помочь всей Африке."
 FRA_CFA_Reforms: "Реформы африканского франка"
 FRA_CFA_Reforms_desc: "Решение проблемы КФА является одной из наших главных проблем. Поскольку наше влияние со временем ослабевает, мы вынуждены проводить реформы, чтобы сохранить неоколониальную империю. Некоторые из наших реформ направлены на повышение автономии банковской системы, упрощение использования денежных фондов и валютного контроля."
 FRA_introduce_the_eco: "Введение ЭКО"
 FRA_introduce_the_eco_desc: "Мы должны освободить франк КФА от нашей власти и избавиться от зависимости наших бывших колоний от нас. Экономическая коалиция (ЭКО) — это предлагаемая новая валюта, которая должна предоставить странам Западной Африки определенную степень экономической автономии и сотрудничества между новыми государствами, принявшими ее. Мы должны поддержать их в стремлении создать новую единую валюту и, возможно, убедить всю бывшую французскую Африку использовать эту новую валюту."
 FRA_unrestricted_subjugation: "Неограниченное подчинение"
 FRA_unrestricted_subjugation_desc: "Наши действия до сих пор сводились лишь к эксплуатации и извлечению ресурсов. Но теперь нам следует пересмотреть свою позицию по этому вопросу, а также решить, стоит ли нам переосмыслить дипломатические действия и вступить в новый этап управления и контроля. Этот выбор не будет популярным, но он делается исключительно в интересах нации и её глобального статуса."
 FRA_intervention_in_africa: "Франсафриканский интервенционизм"
 FRA_intervention_in_africa_desc: "Наши бывшие колониальные владения нуждаются в помощи. Настало время проводить дальнейшую политику вмешательства в дела региона и оказывать военную помощь там, где это необходимо."
 FRA_sahel_region: "Сахельский регион"
 FRA_sahel_region_desc: "Регион Сахеля представляет собой перспективный регион для добычи полезных ископаемых и ресурсов, а также границу для геополитического влияния Франции и ее корпоративных интересов. В условиях растущего экстремизма в новом тысячелетии мы должны действовать, чтобы гарантировать безопасность французских активов и граждан в регионе. Джихадистское повстанческое движение распространяется по всему Сахелю, угрожая нашим интересам. Мы должны взять на себя инициативу по защите наших позиций и искоренить эту угрозу любой ценой."
 FRA_afrique_centrale: "Центральная Африка"
 FRA_afrique_centrale_desc: "Центральная Африка, сердце и душа Африки, изобилует бесчисленными природными чудесами и обладает огромными ресурсами и потенциалом, большая часть которого до сих пор не освоена."
 FRA_CAR_intervention: "Opération Sangaris"
 FRA_CAR_intervention_desc: "Операция \"Сангарис\" - предполагаемая операция и вмешательство в гражданскую войну в Центральноафриканской Республике."
 FRA_operation_artemis: "Opération Artemis"
 FRA_operation_artemis_desc: "Когда Вторая война в Конго была в самом разгаре, Франция и другие европейские страны предприняли самостоятельную интервенцию в восточной части страны после вывода угандийских войск. Это стало важным поворотным моментом в международных делах и совместных военных операциях Европейского союза."
 FRA_resources_prospects: "Перспективы использования ресурсов"
 FRA_resources_prospects_desc: "Природно богатые регионы Африки к югу от Сахары полны ресурсов, и французские компании уже получают выгоду от многочисленных партнерских отношений в этом регионе. В условиях растущего спроса на эти ресурсы мы должны проявить инициативу и инвестировать в наши зарубежные активы, чтобы укрепить свои позиции и обеспечить их устойчивое развитие."
 FRA_oef_hoa: "Операция \"Несокрушимая свобода\""
 FRA_oef_hoa_desc: "Гражданская война в Сомали затянулась слишком надолго. Мы должны вмешаться от имени сомалийского правительства, чтобы помочь им вернуть свою истерзанную войной страну и оказать содействие в усилиях по стабилизации ситуации в стране."
 FRA_operation_licorne: "Opération Licorne"
 FRA_operation_licorne_desc: "Операция \"Единорог\" - название французских миротворческих сил, которые будут развернуты в Кот-д'Ивуаре в связи с гражданской войной между \"Новыми силами Кот-д'Ивуара\" и \"Вооруженными силами Кот-д'Ивуара\"."
 FRA_the_second_ivory_coast_civil_war: "Вторая Гражданская война в Кот - д' Ивуаре"
 FRA_the_second_ivory_coast_civil_war_desc: "Вторая гражданская война в Кот-д'Ивуаре стала вторым вооруженным конфликтом, возникшим из-за противостояния сторонников Лорана Гбагбо и избранного президента Алассана Уаттары. Конфликт между ними перерос в полномасштабное столкновение. Мы должны вмешаться, чтобы помочь стабилизировать ситуацию, прежде чем она выйдет из-под контроля."
 FRA_Industrial_expansion: "Промышленная экспансия"
 FRA_Industrial_expansion_desc: "Наши бывшие колониальные страны отчаянно нуждаются в экономическом возрождении. Преимущественно аграрные общества могли бы получить небольшой толчок к развитию своей экономики за счет вливания инвестиционных средств в регион."
 FRA_educational_development: "Развитие образования"
 FRA_educational_development_desc: "Выделение средств на образование в наших бывших колониальных владениях поможет их населению стать более образованным и, в свою очередь, повысить производительность труда."
 FRA_operation_serval: "Opération Serval"
 FRA_operation_serval_desc: "Операция \"Сервал\" - это название серии операций, проведенных под руководством Франции и Мали во время гражданской войны в Мали в качестве первого этапа конфликта против исламских экстремистов в регионе."
 FRA_French_pillar_of_counterterrorism: "Столп борьбы с терроризмом"
 FRA_French_pillar_of_counterterrorism_desc: "Наши антитеррористические и антиэкстремистские силы приобрели мировую известность, и мы стали опорой и лицом борьбы с терроризмом во всем мире."
 FRA_the_french_foreign_legion: "Французский иностранный легион"
 FRA_the_french_foreign_legion_desc: "Французский Иностранный легион — это элитный корпус французской армии, состоящий из специалистов различных профессий. Созданный в 1831 году тогдашним королем Луи-Филиппом, он был призван предоставить иностранным новобранцам место в рядах французских войск. Таким образом, Легион представляет собой многонациональную и многокультурную боевую силу, всемирно известную своей дисциплиной и боевым духом."
 FRA_sahel_support_initiative: "Инициатива по поддержке Сахеля"
 FRA_sahel_support_initiative_desc: "Вооруженные силы Сахеля часто испытывают нехватку вооружения. Возможно, мы могли бы перераспределить часть ресурсов в их пользу, как в финансовом, так и в военном отношении, чтобы укрепить наши позиции в Африке."
 FRA_sahel_officer_training: "Обучение офицеров Сахеля"
 FRA_sahel_officer_training_desc: "Вооруженным силам стран Сахеля не помешала бы дополнительная подготовка, чтобы сделать их более эффективной боевой силой. Мы должны инвестировать в вооруженные силы наших союзников в регионе и повышать уровень подготовки их офицеров."
 FRA_takuba_task_force: "Оперативная группа Такуба"
 FRA_takuba_task_force_desc: "Оперативная группа \"Такуба\" - это еще одна серия совместных операций французских, малийских, европейских и американских сил, направленных на продолжение борьбы с исламскими экстремистами во время гражданской войны в Мали. Для нас это стратегическая цель - снова начать вмешательство в Мали, чтобы обеспечить стабильность в регионе."
 FRA_haitian_coup: "Гаитянский переворот"
 FRA_haitian_coup_desc: "Жан-Бертран Аристид продолжает оставаться занозой в боку нашей страны. Требование репараций недопустимо. Возможно, в наших интересах было бы подумать о поиске нового, своего рода, руководства для Гаити."
 FRA_repeal_the_ordiance: "Отмена Ордонанса 1825 года"
 FRA_repeal_the_ordiance_desc: "Указ Карла X 1825 года следует отменить, чтобы помочь нормализовать гаитянско-французские отношения. Указ 1825 года является причиной и основанием для выплат компенсаций за независимость Гаити, которые производились на протяжении почти трех четвертей века. Пришло время отменить этот устаревший закон, что станет одним из первых шагов к примирению."
 FRA_senegalese_civil_war: "Сенегальская гражданская война"
 FRA_senegalese_civil_war_desc: "Гражданская война в Сенегале началась как локальный конфликт после недавних выборов. Сенегал важен как прибрежная страна, через которую поставляются материалы из внутренних районов и северных регионов во Францию. Вмешательство в регион необходимо для продолжения наших амбиций в Африке."
 FRA_returning_to_indochina: "Возвращение в Индокитай"
 FRA_returning_to_indochina_desc: "Индокитай когда-то был вершиной французских владений на Дальнем Востоке, пока не начались войны за независимость Вьетнама. Пришло время вернуться в Индокитай, возможно, не как колонизатор, а на этот раз как друг. Наши интересы в регионе, особенно с подъемом Китая, сделали его зоной первостепенной важности."
 FRA_former_indian_colonial: "Дела в Индийском океане"
 FRA_former_indian_colonial_desc: "Французские владения в Индийском океане и франкоязычные страны в Индийском океане имеют стратегическое значение для противодействия нежелательному иностранному влиянию. Пришло время подготовиться к возвращению в эти стратегически важные регионы и принести с собой инвестиции."
 France_news.99.t1: "Возвращение короля"
 France_news.99.t2: "Возвращение императора"
 France_news.99.d1: "Королевский дом Бурбонов вернулся в королевскую резиденцию в Версале, некогда построенную их предком Людовиком XIV, чтобы вновь занять пост правителя Франции.\n\nКороль [FRA.GetLeader] Это предвещает новую и великую эпоху для Франции и всего мира. \"Законные правители Франции и защитники Западной Европы вернулись на свои законные места.\" Это была заключительная фраза его речи, которая сразу же подверглась критике со стороны других европейских лидеров и французских республиканцев как шовинистическая и чрезмерно высокомерная."
 France_news.99.d2: "Самозваный \"Императорский Дом\" Бонапарта, потомки самозваного Императора Наполеона I Бонапарта (1769-1821), вернулись в Версаль. Хотя Наполеон (и его потомки) всегда были популярны во Франции, за границей они были менее популярны - как среди иностранных дворян, так и среди иностранных простолюдинов.\n\n Недавняя джингоистическая риторика [FRA.GetLeader], недавно вознесшаяся на пост Императора Франции, была поставлена под сомнение лидерами Германии, Англии, Италии и России. У новых правителей Франции мало друзей.\n\n Вместе с новой системой правления Франция открыла новый флаг: Тот же самый, что и старый, но поднятый красным с помощью подъемника - призыв к Французской революции, когда аналогичный флаг был поднят незадолго до появления первой империи бонапартистов."
 France_news.99.o1: "Да здравствует король!"
 France_news.99.o2: "Да здравствует Император!"
 France_news.99.o3: "А, ну да."
 france_md.11.t: "Сотрудничество Национальный центр космических исследований и NASA"
 france_md.11.d: "Руководители CNES обратились к нам с предложением обсудить расширение сотрудничества между NASA и CNES. Они считают, что в космосе можно многому научиться, и объединение ресурсов двух крупных космических программ может принести значительную пользу обеим сторонам. Предлагаемое соглашение предусматривает выделение каждой стороной 10 миллиардов долларов на развитие научных связей."
 france_md.11.a: "Достойное соглашение"
 france_md.11.b: "Нет"
 france_md.100.t: "Поддержка Армении"
 france_md.100.d: "Борьба Армении против Азербайджана в Арцахе во многом напоминает нам самих себя. Поддержка их усилий не только желательна, но и необходима для наших интересов в регионе. Мы можем оказать материальную, финансовую или политическую помощь в этом конфликте. Как же нам помочь нашим друзьям в Ереване?"
 france_md.100.a: "Поддержите Армению политически"
 france_md.100.b: "Поддержите Армению финансово"
 france_md.100.c: "Окажите Армении военную поддержку"
 france_md.101.t: "Франция поддерживает нас!"
 france_md.101.d: "Франция решила оказать нам поддержку в нашей продолжающейся борьбе за самоутверждение. Конфликты с Азербайджаном, а также проблемы с Турцией продолжают беспокоить нас, но теперь у нас есть союзник в Европе."
 france_md.101.a: "Ещё один шаг в правильном направлении"
 france_md.102.t: "Первая гражданская война в Кот-д'Ивуаре"
 france_md.102.d: "Первая гражданская война в Кот-д'Ивуаре началась всерьез. Конфликт бушует и не показывает признаков затухания. Когда-то жемчужина Франсафрики, страна превратилась в поле битвы между противоборствующими сторонами. Стабильность в регионе висит на волоске, поскольку страна раздирается на части. Какая сторона лучше всего соответствует нашим нынешним интересам?"
 france_md.102.a: "Поддержите Лорана Гбагбо"
 france_md.102.b: "Поддержите Гийома Соро"
 france_md.102.c: "Поддержите третью фракцию"
 france_md.103.t: "Вторая Гражданская война в Кот - д' Ивуаре"
 france_md.103.d: "Вторая гражданская война в Кот-д'Ивуаре в самом разгаре между Федеральным национальным конгрессом и правительством Кот-д'Ивуара. [CDI.GetName]Конфликт начался после президентских выборов, на которых Гбагбо отказался уйти в отставку, несмотря на честную и свободную победу Уаттары. Какая сторона лучше всего соответствует нашим нынешним интересам?"
 france_md.103.a: "Поддержите Лорана Гбагбо"
 france_md.103.b: "Поддержите Алассана Уаттару"
 france_md.104.t: "Операция \"Артемида\""
 france_md.104.d: "Операция «Артемида», предложенная Европейским союзом интервенция в Итури, предусматривает развертывание миротворческих сил в Демократической Республике Конго. Многие в нашем правительстве хотят, чтобы Франция возглавила военную операцию Европейского союза. У нас есть выбор среди участников, кого мы хотим поддержать. Руанда и [RWA.GetLeader] могли бы стать сильными союзниками, хотя и базируются на востоке и не стремятся к контролю над всей страной. [UGA.GetLeader] и [RCD.GetName] — еще один вариант, но они в основном расположены на севере. Мы всегда можем поддержать Киншасу, нынешнее правящее правительство, что может быть самым безопасным выбором. Кого же мы поддерживаем?"
 france_md.104.a: "Поддержите демократическую республику Конго"
 france_md.104.b: "Поддержите Уганду"
 france_md.104.c: "Поддержите Руанду"
 france_md.105.t: "Гражданская война в Сенегале"
 france_md.105.d: "Расширение гражданской войны в Сенегале до гораздо более масштабного конфликта стало неожиданностью для всех участников. Сочетание проблемы Касаманса, а также обвинений во фальсификации выборов дестабилизировало еще одну страну в Африке. Наши возможности значительно различаются в зависимости от наших целей. Мы можем поддержать [SEN.GetLeader] и его правительство, повстанческие группировки или народ Касаманса. Какой бы выбор мы ни сделали, это поможет Сенегалу проложить себе путь в новое будущее в регионе."
 france_md.105.a: "Поддержите Сенегал"
 france_md.105.b: "Поддержите повстанцев"
 france_md.105.c: "Поддержите Казаманс"
 france_md.106.t: "Операция \"Сангарис\""
 france_md.106.d: "Национальное собрание и военные нашей страны предложили новую интервенцию в Центральноафриканскую Республику в ответ на новый конфликт. Предлагаемая операция, известная как операция «Сангарис», предполагает привлечение наших войск для поддержки одной из фракций в гражданском конфликте. Кого мы собираемся поддержать в этом конфликте?"
 france_md.106.a: "Поддержите Центральноафриканскую Республику"
 france_md.106.b: "Поддержите Союз демократических сил за единство"
 france_md.106.c: "Поддержите Селеку"
 france_md.106.d1: "Поддержите Логон"
 france_md.106.e: "Поддержите Антибалаку"
 france_md.107.t: "Операция \"Сервал\""
 france_md.107.d: "Операция «Сервал» была предложена Национальной ассамблее в качестве реакции на восстание туарегов в стране Мали. В настоящее время «Сервал» ориентирован на французские силы, которые будут развернуты для поддержки правительства [MAL.GetName] и [MAL.GetLeader]. У нас есть возможность изменить нашу внешнюю политику и поддержать дело туарегов, если мы этого захотим. На стороне какой стороны конфликта мы должны вмешаться?"
 france_md.107.a: "Поддержите правительство Мали"
 france_md.107.b: "Поддержите туарегов"
 france_md.108.t: "Оперативная группа Такуба"
 france_md.108.d: "Исламские повстанцы начали борьбу против обоих [MAL.GetAdjective] Правительство и силы туарегов. Операция «Сервал» идёт уже некоторое время, но мы можем либо оказать дополнительную поддержку той фракции, которую поддерживали раньше, либо радикально изменить курс и поддержать нового благодетеля в Мали. Какую фракцию мы будем поддерживать в будущем?"
 france_md.108.a: "Поддержите правительство Мали"
 france_md.108.b: "Поддержите туарегов"
 france_md.108.c: "Поддержите Ансар ад-Дин"
 france_md.109.t: "Государственный переворот на Гаити"
 france_md.109.d: "В настоящее время правящая власть Гаити не на нашей стороне. Прецедент, создаваемый правящей партией, не идет на пользу нашей внешней политике. Организация переворота и поддержка оппозиции — один из лучших вариантов, позволяющих гарантировать, что остальные колонии не начнут требовать от нас компенсации за колониальные преступления."
 france_md.109.a: "Спровоцируйте переворот"
 france_md.109.b: "Поддержите повстанцев"
 france_md.350.t: "Франция выгоняет нас из Ливана!"
 france_md.350.d: "С помощью изощренной кампании дипломатического давления и экономических стимулов французы систематически подрывали наши позиции в Ливане. Их операции по оказанию влияния превзошли все ожидания: местные политики теперь открыто призывают к нашему уходу, а ливанское правительство официально потребовало от нас вывода войск. Это унизительная неудача, но, возможно, не необратимая. Мы могли бы попытаться восстановить свое влияние, хотя это и создало бы риск международного инцидента."
 france_md.350.a: "Они заплалтят за это!"
 france_md.350.b: "Начните ввод войск в Ливан!"
 france_md.355.t: "Франция вносит раскол в наше общество"
 france_md.355.d: "Французы активно распространяют свои революционные идеалы среди ливанского населения. Организации гражданского общества, финансируемые Парижем, требуют демократических реформ, прозрачности и свободных выборов. Протестные движения набирают обороты в Бейруте и за его пределами. Если мы не примем срочных мер для урегулирования ситуации, мы можем столкнуться с полномасштабным восстанием, вдохновленным французскими республиканскими принципами."
 france_md.355.a: "Вот это было больно!"
 france_md.360.t: "Французское предложение по инвестициям в энергетику"
 france_md.360.d: "Французский энергетический гигант TotalEnergies обратился к нашему правительству с всеобъемлющим предложением по разработке наших нефтегазовых месторождений. Сделка привлечет значительные иностранные инвестиции, техническую экспертизу и создаст тысячи рабочих мест. Однако некоторые критики внутри страны утверждают, что принятие французского капитала усилит влияние Парижа на нашу экономическую политику. Условия выгодны, но какой ценой для нашего суверенитета?"
 france_md.360.a: "Экономические выгоды перевешивают риски."
 france_md.360.b: "Мы не можем продавать наши ресурсы иностранным интересам."
 france_md.400.t: "Французская помощь развитию Северного Ливана"
 france_md.400.d: "Французское агентство развития предложило масштабную программу развития инфраструктуры Северного Ливана, включающую улучшение дорожной инфраструктуры, строительство очистных сооружений и телекоммуникационных сетей. Регион долгое время оставался в запущенном состоянии, и французские инвестиции могли бы значительно улучшить уровень жизни местного населения. Некоторые рассматривают это как подлинную гуманитарную заботу, обусловленную историческими связями Франции с Ливаном; другие видят в этом продуманный шаг по расширению французского влияния в стратегически важном регионе."
 france_md.400.a: "Это партнерство принесет пользу нашим людям."
 france_md.400.b: "Мы предпочитаем развивать собственную инфраструктуру."
 france_md.401.t: "Французская инфраструктурная инициатива на юге"
 france_md.401.d: "Франция предложила профинансировать крупные инфраструктурные проекты в Южном Ливане, регионе, сильно пострадавшем от многолетнего конфликта и запустения. Предложение включает в себя строительство больниц, школ и модернизацию электросетей. Хотя гуманитарная потребность неоспорима, принятие французского присутствия на юге может осложнить наши отношения с другими региональными державами, которые с подозрением относятся к любому вмешательству Запада."
 france_md.401.a: "Юг остро нуждается в этих инвестициях."
 france_md.401.b: "Политические сложности слишком велики."
 france_md.402.t: "Французская программа промышленных инвестиций"
 france_md.402.d: "Французские корпорации предлагают значительные инвестиции в ливанскую промышленность, обещая построить заводы, которые создадут рабочие места для тысяч наших граждан. Безработица среди молодежи является давней проблемой, и эти рабочие места могли бы помочь остановить поток эмиграции, истощающий нашу страну за счет талантливых специалистов. Однако промышленная зависимость от французского капитала может изменить нашу экономику таким образом, что это в первую очередь принесет пользу Парижу."
 france_md.402.a: "В настоящий момент приоритетом для нас являются рабочие места."
 france_md.402.b: "Мы должны развивать собственную промышленную базу."
 france_md.403.t: "Французская гуманитарная миссия в Ливане"
 france_md.403.d: "В ответ на продолжающийся кризис Франция предложила направить гуманитарную миссию для доставки медикаментов, продовольственной помощи и технической поддержки. Французские НПО и правительственные учреждения будут координировать усилия по оказанию помощи в сотрудничестве с местными властями. Президент Макрон лично обратился к международной поддержке Ливана, ссылаясь на глубокие исторические и культурные связи между нашими народами. Эта помощь могла бы оказать крайне необходимую поддержку, хотя она также повышает заметность и влияние Франции в этот уязвимый момент."
 france_md.403.a: "Мы с благодарностью принимаем эту помощь."
 france_md.403.b: "Мы можем сами управлять своими делами."
 france_md.500.t: "Атака на Лумио"
 france_md.500.d: "Небольшая коммуна в Лумио подверглась нападению Национального фронта освобождения Корсики. Нападение не привело к человеческим жертвам, но нанесло значительный ущерб небольшой военной инфраструктуре коммуны, а также ранило нескольких жандармов."
 france_md.500.a: "Тревожный инцидент, и ничего больше."
 france_md.501.t: "Нападения на отели в Марселе"
 france_md.501.d: "В Марселе произошла серия небольших взрывов. Ответственность за нападения взял на себя Национальный фронт освобождения Корсики. В результате инцидентов несколько человек были госпитализированы и получили ранения, но, судя по всему, у них нет намерения совершать новые взрывы в других отелях."
 france_md.501.a: "Нас не запугать"
 france_md.504.t: "Взрыв в Макдональдсе"
 france_md.504.d: "Небольшая группа бретонских националистов решила взорвать местный \"Макдональдс\" в городе Кевере, Бретань. В результате взрыва бомбы погиб один человек, находившийся в Макдональдсе. Проводимое расследование не дало особых доказательств того, что речь идет о более крупном заговоре, но трагическое происшествие имеет место."
 france_md.504.a: "Бессмысленная гибель человека"
 FRA_french_space_decision_category: "Французская космическая программа и CNES"
 FRA_french_space_decision_category_desc: "Космос: последний рубеж. Мы должны всерьез начать покорять этот рубеж, если хотим оставаться великой державой в глазах всего мира, но достичь этого мы сможем только ценой больших потерь. Поскольку мы не можем быть уверены в реальных экономических выгодах от крупномасштабной космической программы, французский народ должен оставаться убежденным в том, что это стоящее начинание!\n§RЕсли энтузиазм по поводу нашей космической программы упадет ниже 35%, космические операции будут прекращены!§! Кроме того, каждую неделю наши §Y Энтузиазм по поводу космической программы§! упадет §Y0.1§! из-за общего отсутствия интереса к §YCNES§!\n\n\nВ настоящее время наш энтузиазм по поводу космической программы таков: [?FRA.FRA_peoples_support|+50.0] \nЕженедельный доход от §YКосмические операции и действия§!: $[?FRA.FRA_space_income_var|+3]б"
 FRA_run_support_campaigns_short: "Запустить короткую кампанию общественной поддержки"
 FRA_run_support_campaigns_short_desc: "Если наши ведущие ученые только начинают открывать научные чудеса, которые лежат в космосе, то наш народ должен быть невероятно растерян во всем этом испытании. Короткая кампания в социальных сетях должна оказать нам некоторую поддержку!"
 FRA_run_support_campaigns_long: "Запустить длительную кампанию общественной поддержки"
 FRA_run_support_campaigns_long_desc: "Если наши ведущие ученые только начинают открывать научные чудеса, которые лежат в космосе, то наш народ должен быть невероятно растерян во всем этом испытании. Детальная образовательная кампания должна творить чудеса за поддержку, которую мы получаем от народа!"
 FRA_balance_the_cnes_budget: "Ребаланс бюджета Национального центра космических исследований"
 FRA_balance_the_cnes_budget_desc: "Наша космическая программа, CNES, в прошлом сталкивалась с проблемами, связанными с неэффективным расходованием средств и незначительными случаями коррупции. Нам следует направить наших государственных аудиторов, чтобы помочь обуздать чрезмерные расходы и вернуть CNES столь необходимую положительную репутацию."
 FRA_launch_commercial_satellite: "Запуск коммерческого спутника"
 FRA_launch_commercial_satellite_desc: "В эпоху информационных технологий частные компании буквально наперебой стремятся запускать спутники. Разрешив некоторым из этих компаний запускать спутники с наших площадок, мы должны получить существенную экономическую выгоду. Однако следует помнить, что люди могут начать уставать от нашей программы, ориентированной на коммерческую деятельность!"
 FRA_prep_international_space_station: "Подготовить запуск МКС"
 FRA_prep_international_space_station_desc: "Несмотря на то, что это глобальное достижение и инициатива, мы можем подготовиться к отправке наших собственных реактивных снарядов на МКС вместе с нашими собственными."
 FRA_french_iss_launch: "Запуск французской МКС"
 FRA_french_iss_launch_desc: "После нескольких месяцев планирования и подготовки наша миссия по доставке грузов готова к запуску. Три. Два. Один. Старт!"
 FRA_invest_LEB_decision_category: "Франко-ливанские инвестиции"
 FRA_invest_LEB_decision_category_desc: "Ливан когда-то был нашим бывшим колониальным владением, и поэтому нам крайне важно вернуться в этот регион и инвестировать в великую страну [LEB.GetNameWithFlag]."
 FRA_LEB_invest_infrastructure_south: "Инвестиции в Южный Ливан"
 FRA_LEB_invest_infrastructure_south_desc: "Экономическое развитие Южного Ливана может помочь предотвратить радикализацию в регионе. Чем больше экономических возможностей для региона, тем лучше для всех заинтересованных сторон."
 FRA_LEB_invest_infrastructure_north: "Инвестиции в Северный Ливан"
 FRA_LEB_invest_infrastructure_north_desc: "Экономический центр Ливана почти всегда располагался вокруг Бейрута и прилегающих территорий. Расширение и инвестиции в северную часть страны принесут отличную отдачу."
 FRA_LEB_invest_civilian_factory: "Инвестиции в гражданскую промышленность Ливана"
 FRA_LEB_invest_civilian_factory_desc: "Ливанцам не помешали бы дополнительные инвестиции в гражданскую промышленность. Развитие этих отраслей могло бы способствовать дальнейшему экономическому развитию Ливана и повышению его самодостаточности на мировой арене."
 FRA_LEB_financial_help: "Финансовая помощь Ливану"
 FRA_LEB_financial_help_desc: "Мы должны предоставить Ливану финансовую помощь, чтобы помочь компенсировать некоторые дефициты в их бюджете и решить другие проблемы."
 FRA_french_africa_decision_category: "Françafrique/Афрриканские решения"
 FRA_french_africa_decision_category_desc: "Африка и Франсафрика часто являются для нас синонимами. Африканский континент нуждается в нашей помощи и заботе, и поэтому мы должны продолжать делать Африку центром нашей внешней политики и наших интересов\"."
 FRA_invest_in_NEPAD_education_decision: "Инвестируйте в образовательные программы НЕПАД."
 FRA_invest_in_NEPAD_education_decision_desc: "Образовательные программы НЕПАД нуждаются в дополнительном финансировании и поддержке. Мы оплатим увеличенное финансирование, но африканские страны увидят большее сокращение расходов на образование."
 FRA_invest_in_NEPAD_healthcare_decision: "Инвестируйте в программы здравоохранения НЕПАД."
 FRA_invest_in_NEPAD_healthcare_decision_desc: "Программы НЕПАД в области здравоохранения нуждаются в дополнительном финансировании и поддержке. Мы оплатим увеличенное финансирование, но африканские страны увидят большее сокращение расходов на здравоохранение."
 FRA_invest_in_NEPAD_social_care_decision: "Инвестируйте в программы социального обеспечения НЕПАД."
 FRA_invest_in_NEPAD_social_care_decision_desc: "Программы социального обеспечения НЕПАД нуждаются в дополнительном финансировании и поддержке. Мы оплатим увеличенное финансирование, но африканские страны увидят большее сокращение расходов на социальное обеспечение."
 FRA_invest_in_NEPAD_economic_program_decision: "Инвестируйте в экономические программы НЕПАД."
 FRA_invest_in_NEPAD_economic_program_decision_desc: "Экономическим программам НЕПАД не помешало бы дополнительное финансирование и поддержка. Мы оплатим увеличенное финансирование, но африканские страны увидят повышение производительности и ускорение темпов строительства."
 FRA_extend_the_NEPAD_program_decision: "Продлить программу НЕПАД"
 FRA_extend_the_NEPAD_program_decision_desc: "Программу необходимо продлить. Мы можем выделить дополнительные средства на ее дальнейшее финансирование."
 FRA_space_enthusiasm_effect_tt: "Изменения в нашей космической программе §YSpace Programme Enthusiasm§! от [?temp_change|1+] (Текущий: [?FRA.FRA_peoples_support|1Y])"
