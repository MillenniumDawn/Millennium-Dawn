 GRN_national_decisions: "그린란드 국가 결정"
 GRN_national_decisions_desc: "그린란드 섬은 매우 느긋하면서도 긴장된 상황에 놓여 있습니다. 정치 지도자들이 섬과 그 인구를 발전시키기 위해 무엇이든 시도하는 한편, 궁극적인 독립이라는 끊임없이 압박해 오는 문제에도 대처해야 합니다. 누군가는 지금 당장 원하고, 누군가는 더 안정된 기반이 갖추어질 때까지 기다리려 합니다. 어느 쪽이든 결국 이 섬이 진정으로 자유로워질지는 그린란드와 덴마크 양측에 달려 있습니다."
 GRN_decision_independence_war: "독립 전쟁"
 GRN_decision_independence_war_desc: "때가 왔고 정치인들은 국민을 떠밀었습니다. 전쟁이 선포되었으며, 이제 덴마크가 왕관을 지켜낼 수 있을지, 아니면 여론의 압력이 모든 당사자 사이의 평화를 강제하여 왕관이 떨어져 나갈지를 겨루는 경주입니다."
 GRN_decision_capital_city_expansion: "수도 확장"
 GRN_decision_capital_city_expansion_desc: "인구가 우리가 전혀 예상하지 못한 규모로 늘어나고 있으므로, 지역 및 국가 전체의 성장을 더 잘 반영하고 통합하도록 수도 누크를 대대적으로 정비해야 합니다."
 GRN_decision_development_visa_grants: "개발 비자 발급"
 GRN_decision_development_visa_grants_desc: "국가 발전에 있어 우리의 가장 큰 문제는 순전히 인적 자원의 부족입니다. 어디로든 나아가려면 우리가 제공할 수 있는 호화로운 금전적 유인과 일자리보다 이곳의 환경을 기꺼이 견디려는 외국인 노동자를 확보하는 데 대규모로 투자해야 합니다."
 GRN_decision_global_recruitment_efforts: "세계적 모병 노력"
 GRN_decision_global_recruitment_efforts_desc: "국방이 이제 우리의 직접 통제 아래 놓이면서, 국가 전체로서 겪는 것과 같은 문제, 즉 인력 부족에 시달리고 있습니다. 개발 비자 발급과 비슷한 일을 군을 위해서도 해야 합니다. 경제가 더 탄탄해지고 예산이 이러한 지출을 감당할 만큼 더 유연해지면, 용병이나 정착할 곳 없이 떠도는 이들이 우리나라를 마지막 안식처로 선택하도록 크게 유도할 수 있기를 바랍니다."
 GRN_decision_naval_priority_act: "해군 우선법"
 GRN_decision_naval_priority_act_desc: "우리와 가장 가까운 지역에서 영향력을 가지려면 해군이 있어야 합니다. 문제는 느긋하게 차근차근 건조할 만한 경제적 여력이 없다는 점입니다. 따라서 기본 함대를 신속히 건조하기 위해 조선소와 유사한 시설 및 단지를 가능한 한 서로 가까운 곳에 최대한 강제로 끌어모아야 합니다. 비용이 극도로 많이 들겠지만, 우리에게 실제로 유리한 일이 일어나기를 앉아서 기다리는 것도 마찬가지입니다."
 GRN_decision_project_vortex: "보텍스 프로젝트"
 GRN_decision_project_vortex_desc: "극북 해역의 해상 통로를 확보하는 일은 전략 지역에서 해상 우위를 확보하려는 우리의 구상 때문에 골치 아픕니다. 따라서 현재의 수단으로 할 수 있는 최고의 해군 무력 과시를 만들어 이를 해결할 것입니다."
 GRN_decision_national_commission: "국가 위원회"
 GRN_decision_national_commission_desc: "설계 과정이 끝나고 시제품이 만족스러운 것으로 선언되었으므로, 이제 우리의 첫 전함 건조를 돕기 위한 국가 위원회를 조직할 것입니다."
 GRN_decision_project_northern_projection: "북방 투사 프로젝트"
 GRN_decision_project_northern_projection_desc: "상황이 안정되고 국가의 진정한 야망을 위한 준비가 되었으므로, 여러 해역을 통제해야 합니다. 이를 위해 전국의 조선업체들과 협력하여 제2 북극 전투단이 될 함대를 편성함으로써 이를 보장할 수 있습니다."
 GRN_southern_interior_development_decisions: "남부 내륙 개발 사업"
 GRN_southern_interior_development_decisions_desc: "인구 정책을 통해 경제적, 사회적으로 안정되었으므로, 이제 국가의 내륙으로 시선을 돌릴 수 있습니다. 남부 고원은 거대 빙붕을 길들이기 위한 첫 번째 주요 진전이 될 것입니다."
 GRN_decision_fort_vortex: "보텍스 요새"
 GRN_decision_fort_vortex_desc: "보텍스 요새라는 이름의 요새 마을을 세워 남부 내륙으로의 행군을 시작할 것입니다."
 GRN_decision_glacial_shine: "글레이셜 샤인"
 GRN_decision_glacial_shine_desc: "우리의 다음 중심 정착촌은 글레이셜 샤인이라 이름 붙일 것입니다."
 GRN_decision_frostbury: "프로스트버리"
 GRN_decision_frostbury_desc: "수도 바로 동쪽에 프로스트버리 정착촌을 세울 것입니다."
 GRN_decision_fort_seal: "씰 요새"
 GRN_decision_fort_seal_desc: "남부 내륙과 중부 고원의 경계를 따라 중동부의 전략적 요새 정착촌을 세울 것입니다."
 GRN_decision_southern_interior_basic_roads: "남부 내륙 기초 도로 공사"
 GRN_decision_southern_interior_basic_roads_desc: "정착촌이 완전히 자리 잡았으므로, 이제 이 새로운 문명의 보루들을 연결하고 필요를 공급하기 위해 기초적인 형태의 지상 수송로를 확실히 구축할 수 있습니다."
 GRN_decision_southern_interior_improved_roads: "남부 내륙 도로 개선"
 GRN_decision_southern_interior_improved_roads_desc: "도로망에 대한 지속적인 투자로 교통 흐름의 양을 개선하고, 이렇게 길고 위험한 환경을 이동하기 위한 적절하고 보다 지속적인 안전 조치도 마련할 수 있습니다."
 GRN_decision_great_polar_railway: "대극지 철도"
 GRN_decision_great_polar_railway_desc: "간소하고 효율적인 철도망의 개발을 확보하면 사람과 물자를 대량으로 수송할 수 있습니다. 이를 통해 마침내 이 지역의 경제를 처음부터 구축하는 작업을 본격적으로 시작할 수 있습니다."
 GRN_decision_basic_industrial_jobs: "기초 산업 일자리"
 GRN_decision_basic_industrial_jobs_desc: "기초적인 형태의 경제 활동을 확보하면 내륙 개발에 더 직접적으로 자금을 댈 수 있고, 가능한 곳에서는 다른 경제 부문으로 확장할 수 있습니다."
 GRN_decision_local_food_supply: "지역 식량 공급"
 GRN_decision_local_food_supply_desc: "HFF의 전략적 개발로 정착촌에 지역 식량 공급을 마련할 수 있으며, 얼어붙은 물을 더 많이 활용할 수 있을 뿐만 아니라 이 초기 단계의 인구 중심지를 국내에서 성장시키는 데에도 도움이 됩니다. 혹한 농업 시설은 빙붕이라는 얼어붙은 괴수를 꿰뚫는 창이 될 것입니다."
 GRN_decision_extensive_geological_surveying: "대규모 지질 조사"
 GRN_decision_extensive_geological_surveying_desc: "내륙이 광대한 만큼 이러한 전략 작업에 대규모로 투자해야 하며, 고무를 생산하는 식물을 다루도록 설계된 전용 혹한 농업 시설도 설치해야 합니다. 이 결과는 우리가 이 모든 것에 투입하는 시간과 자본에 비해 극도로 큰 성과를 거둘 것입니다."
 GRN_decision_creating_dedicated_mining_operations: "전용 채굴 작업장 조성"
 GRN_decision_creating_dedicated_mining_operations_desc: "드문드문 알려진 바 없는 여러 광물 자원 매장지가 탐지됨에 따라, 고무 생산을 위한 HFF를 더 늘리기 위한 기초 작업도 확장하기 시작했습니다. 이러한 계획을 계속 추진하는 것은 분명 우리의 목적에 도움이 될 뿐입니다."
 GRN_decision_regional_economic_sector_synergy: "지역 경제 부문 시너지"
 GRN_decision_regional_economic_sector_synergy_desc: "인력, 자원, 자금을 광범위하게 투입하면 지역 경제 다각화를 이룰 수 있을 만큼 채굴 작업을 확장할 수 있습니다. 머지않아 국가 나머지 지역의 경제와 마찬가지로 지역적 시너지를 창출할 수 있을 것입니다."
 GRN_central_plateau_development_decisions: "중부 고원 개발 사업"
 GRN_central_plateau_development_decisions_desc: "남부 내륙이 경제적, 사회적으로 시너지를 이루었으므로, 이제 이곳 중부 고원에서도 같은 일을 하기 위한 토대를 쌓기 시작할 수 있습니다. 이 모든 일에는 비용이 많이 들겠지만 장기적으로는 분명 그만한 가치가 있을 것입니다."
 GRN_decision_fort_frostfields: "프로스트필즈 요새"
 GRN_decision_fort_frostfields_desc: "시시무트 마을에서 서쪽으로 다소 가까운 곳에 프로스트필즈 요새라는 요새 정착촌을 세울 것입니다."
 GRN_decision_frigidville: "프리지드빌"
 GRN_decision_frigidville_desc: "동쪽으로 향하며 프리지드빌 정착촌을 세울 것입니다. 주제에 맞는 이름이 바닥나고 있는 사람은 나뿐입니까?"
 GRN_decision_aurora: "오로라"
 GRN_decision_aurora_desc: "고원의 한가운데 구역에는 어울리는 오로라 정착촌을 세우는 것이 좋겠다고 생각합니다."
 GRN_decision_snowdenson: "스노든슨"
 GRN_decision_snowdenson_desc: "남쪽으로 선회하여 글레이셜 샤인과 오로라 사이의 간격을 메우고 지역 간 경제 활동을 연결하기 위해 스노든슨 정착촌을 세울 것입니다."
 GRN_decision_blizzards_peak: "블리자드 피크"
 GRN_decision_blizzards_peak_desc: "다시 북쪽으로 돌아가 계속 동쪽으로 나아가면서, 일대에 가장 높은 지점 몇 곳이 있다는 이유로 블리자드 피크 정착촌을 세울 것입니다."
 GRN_decision_crystal_flake: "크리스털 플레이크"
 GRN_decision_crystal_flake_desc: "더 동쪽으로 나아가 동부 해안 지역에서 두 번째로 가까운 곳에 크리스털 플레이크 정착촌을 세울 것입니다."
 GRN_decision_snowberry: "스노베리"
 GRN_decision_snowberry_desc: "고원과 동부 해안 지역 사이의 북동부 경계 지대에 걸쳐 아담한 이름의 마을 스노베리를 세울 것입니다."
 GRN_decision_plateau_interior_basic_roads: "중부 고원 기초 도로망"
 GRN_decision_plateau_interior_basic_roads_desc: "정착촌이 세워졌으므로 이제 고원 전역에 걸쳐 도로망의 기초를 건설하기 시작할 수 있습니다. 이 기초 공사는 위험한 지형 위를 그저 달리는 것보다 이동을 더 원활하고 직접적으로 만들어 줄 것입니다."
 GRN_decision_plateau_interior_improved_roads: "중부 고원 도로 공사 개선"
 GRN_decision_plateau_interior_improved_roads_desc: "기초 공사가 끝났으므로, 이제 안전 조치의 표준화와 광활한 지형을 횡단하는 데 필요한 기타 시설에 투자할 수 있습니다."
 GRN_decision_central_arctic_railroad: "중부 북극 철도"
 GRN_decision_central_arctic_railroad_desc: "남부 내륙의 GPR과 해안 철도망에서 갈라져 나가는 노선으로, 이제 국가 전역의 주요 대량 수송망을 굳힐 수 있습니다. 이에 따라 고원에는 중부 북극 철도, 줄여서 CARR이 들어서게 됩니다."
 GRN_decision_basic_industrial_jobs_two: "기초 산업 일자리 시장"
 GRN_decision_basic_industrial_jobs_two_desc: "사람과 인프라가 갖추어졌으므로, 이제 중부 고원 내에 어떤 형태로든 경제 활동을 창출하는 작업을 시작할 수 있습니다."
 GRN_decision_local_food_supply_two: "지역 식량 공급 구축"
 GRN_decision_local_food_supply_two_desc: "전국에서 사용해 온 HFF 모델을 활용하여, 지역 식량 공급망 구축의 부담을 덜어주는 전용 시설을 만들 수 있습니다."
 GRN_decision_extensive_geological_surveying_two: "중부 고원: 대규모 지질 조사"
 GRN_decision_extensive_geological_surveying_two_desc: "사람, 장소, 인프라, 일자리, 식량. 모두 확보되었으며, 얼음과 시간 그 자체 아래의 땅속 깊이 파고들 준비가 되었습니다."
 GRN_decision_creating_dedicated_mining_operations_two: "중부 고원: 전용 채굴 작업장"
 GRN_decision_creating_dedicated_mining_operations_two_desc: "조사 자료를 손에 넣고 초기 탐사 광산도 구축했으므로, 이제 더 많은 전용 광산과 그 주변의 운영 체계를 확장하고 조성하기 시작할 수 있습니다."
 GRN_decision_regional_economic_sector_synergy_two: "중부 고원: 경제 부문 간 시너지"
 GRN_decision_regional_economic_sector_synergy_two_desc: "여정에서 가장 길고 비용이 많이 드는 구간이 우리 앞에 놓여 있습니다. 그러나 광활한 중부 고원의 빛나는 빙설 풍경을 바라보며 이 모든 것을 가슴에 담고, 마침내 해냈다는 순수하고 행복한 만족감을 느낄 수 있습니다. 그린란드는 진정 야수의 땅이기 때문입니다."
 GRN_faction_polar_defense_league: "극지 방위 동맹"
 greenland_event.1.t: "자치 정부 국민투표"
 greenland_event.1.d: "머지않아 의회는 1979년 자치법이 규정한 조항의 확대 여부를 표결에 부칠 것입니다. 찬성으로 결정되면 교육, 의료, 사법 제도와 해안 경비대의 완전한 통제권이 그린란드 정부의 전적인 통제 아래 놓이게 됩니다."
 greenland_event.1.o1: "의회, 자치 정부법을 승인하다"
 greenland_event.1.o2: "의회, 현상 유지를 택하다"
 greenland_event.2.t: "그린란드 자치 정부법"
 greenland_event.2.d: "그린란드는 1979년 자치법에 따른 권리를 확대하고 이를 2008년 자치 정부법으로 대체하는 안에 찬성 표결했습니다. 이 법은 그들에게 여러 정부 기관과 해안 경비대의 통제권을 부여합니다. 과반수가 찬성했으므로 표결을 승인할 수 있으며, 또는 우리가 제공하는 식민지 보조금을 늘리지 않고서는 국가 재정이 이 모든 체제를 독자적으로 운영하는 것을 감당할 수 없다는 이유를 들어 이를 막을 수도 있습니다."
 greenland_event.2.o1: "표결을 승인한다"
 greenland_event.2.o2: "표결을 거부한다"
 greenland_event.300.t: "덴마크의 표결 승인"
 greenland_event.300.d: "오늘 일찍 덴마크 의회가 예상대로 새 자치 정부법에 대한 우리의 표결을 승인했다는 소식을 받았습니다. 이는 우리의 독립, 나아가 우리 스스로 정의할 수 있는 미래를 향한 큰 진전이 될 것입니다."
 greenland_event.300.o1: "잠깐, 거부할 수도 있었다고?"
 greenland_event.3.t: "덴마크의 표결 저지"
 greenland_event.3.d: "덴마크 의회는 새 자치 정부법으로 자치법을 확대하자는 우리의 표결을 거부하기로 했습니다. 그들은 우리가 통제권을 넘겨받으면 더 많은 덴마크 보조금이 필요할 것이라며 재정적 우려를 이유로 들었습니다. 우리는 지역 분쟁을 초래할 독립을 선언할 수도 있고, 이 상황을 받아들이고 앞으로 닥칠 수도 있는 더 나쁜 결과에 대비할 수도 있습니다."
 greenland_event.3.o1: "싸우자. 무슨 군대로?"
 greenland_event.3.o2: "그린란드의 자유로운 통치를 위하여!!!"
 greenland_event.4.t: "선전포고!"
 greenland_event.4.d: "그린란드 자치 정부법 표결이 막히자 그린란드 정부는 독립을 강행하기로 했습니다. 따라서 우리는 왕실의 모든 영유지를 확보하고 모든 해외 영토를 다시금 통제 아래 두어야 합니다."
 greenland_event.4.o1: "페로 제도에서 그린란드까지"
 greenland_event.5.t: "자동화 투자 재편"
 greenland_event.5.d: "우리 경제는 늘 허덕이고 있으며 이는 단순히 인구가 충분하지 않기 때문입니다. 우리의 1인당 지표는 거의 불안정하여, 경제가 끊임없이 변하는 탓에 국내 지출이 요동치는 영향으로 회계 담당자들이 장부 작성조차 꺼릴 정도입니다. 따라서 결정적인 안정화 요인이 필요하며, 이 경우에는 특정 경제 부문에 대한 직접적이고 포괄적인 자동화 투자가 될 것입니다. 해당 부문의 노동자 수요가 전반적으로 줄어들면 경제의 전반적인 변동성이 크게 완화되기를 기대합니다."
 greenland_event.5.o1: "농업 부문"
 greenland_event.5.o2: "전시 제조 부문"
 greenland_event.5.o3: "민간 제조 부문"
 greenland_event.5.o4: "사무 및 기술 부문"
 greenland_event.6.t: "채굴 문제"
 greenland_event.6.d: "상업적 채굴 작업을 확대하고 시작하려는 노력과 함께 핵심 질문이 제기되었습니다. 우리는 필요에 따라 채굴할 것인가, 탐욕에 따라 채굴할 것인가. 필요에 따른 채굴은 국가의 국내 수요에 맞춘 최소한의 자원 채굴 노력을 의미합니다. 반면 탐욕에 따른 채굴은 국내외 수요를 위해 작업을 대폭 확대하되, 적절한 운영 기대치를 충족하기 위한 노동력 수요 증가라는 대가를 치르게 됩니다."
 greenland_event.6.o1: "우리 국가의 필요"
 greenland_event.6.o2: "목적이 수단을 정당화한다"
 greenland_event.7.t: "정치적 야망"
 greenland_event.7.d: "무대가 마련되자 우리 국민은 설렘과 걱정을 동시에 느끼고 있습니다. 한때 덴마크 왕실 식민지였던 나라에서 이처럼 자유로운 사고의 의지가 가능하다고 믿은 적은 없었습니다. 그러나 새로 얻은 자유로 우리는 마음의 평화를 확보하고 우리가 바라는 정치적 미래를 만들어 갈 수 있습니다."
 greenland_event.7.o1: "절대적 자유 사상"
 greenland_event.7.o2: "부상하는 사상이 옳음을 입증하다"
 greenland_event.7.o3: "중립적인 정신이 승리하다"
 greenland_event.7.o4: "민족적 자긍심이 진보를 이끈다"
 greenland_influence_event.1.t: "그린란드의 투자"
 greenland_influence_event.1.d: "그린란드가 우리나라의 발전을 돕기 위해 투자하겠다는 제안을 해 왔습니다. 이러한 투자의 성격에 일부 우려가 있기는 하나, 그린란드 섬은 발전했다 해도 이해 당사자들 가운데에서는 우리 국내 상황에 실질적인 위협을 가하지 않습니다."
 greenland_influence_event.1.o1: "공짜는 좋은 거지"
 greenland_influence_event.1.o2: "고맙지만 사양하겠다"
 greenland_influence_event.2.t: "아이슬란드의 인프라 수용"
 greenland_influence_event.2.d: "우리의 첫 투자가 수용되었으며, 이는 해당 국가에 대한 우리의 영향력과 유대를 높일 것입니다."
 greenland_influence_event.2.o1: "다음 투자를 진행하라"
 greenland_influence_event.3.t: "그린란드의 에너지"
 greenland_influence_event.3.d: "그린란드가 이번에는 에너지 부문에 또 다른 투자를 제안해 왔습니다. 특정 발전 방식을 특별히 선호하지 않는 유용한 발전 시설을 건설하겠다는 것입니다. 무상 발전 시설을 활용해 더 나은 무역 관계를 증진할 수 있지만, 그린란드가 이 시설을 이용해 우리 정부를 약화시키려 할지도 모른다고 우려하는 이들도 있습니다."
 greenland_influence_event.3.o1: "더 싼 에너지는 좋지"
 greenland_influence_event.3.o2: "우리의 에너지 수요는 당신들이 상관할 바 아니다"
 greenland_influence_event.4.t: "아이슬란드의 에너지 시설 수용"
 greenland_influence_event.4.d: "그들의 발전 능력을 구축하도록 돕는 두 번째 투자가 수용되었습니다. 화력 발전소에 연료가 필요할 때 우리와 거래하여 더 나은 관계를 계속 이어가기를 바랄 뿐입니다."
 greenland_influence_event.4.o1: "다음 투자를 보내라"
 greenland_influence_event.5.t: "극지 산업 투자"
 greenland_influence_event.5.d: "그린란드가 이번에는 우리의 경제 개발에 대한 폭넓은 투자를 들고 다시 찾아왔습니다. 산업 부문부터 사무 부문까지, 그린란드가 우리나라에 너무 많은 것을 쏟아붓기 시작한 것은 아닌가 싶습니다. 그들이 쓸 돈이 많지는 않을 텐데, 이쯤에서 제동을 거는 편이 좋을지도 모릅니다."
 greenland_influence_event.5.o1: "더 나은 경제라, 안 될 게 있나"
 greenland_influence_event.5.o2: "아니, 당신들의 속셈을 알 것 같다"
 greenland_influence_event.6.t: "아이슬란드의 경제 투자 수용"
 greenland_influence_event.6.d: "아이슬란드 정부가 우리의 후한 제안을 받아들이도록 만들 전략적 수단을 찾아내면서, 늘어나는 투자 포트폴리오는 큰 성공을 거두었습니다. 이제 이러한 성과를 활용하기만 하면 됩니다."
 greenland_influence_event.6.o1: "한 번만 더 하면 될 것이다"
 greenland_influence_event.7.t: "전략 자원 투자"
 greenland_influence_event.7.d: "그린란드는 대규모 지질 조사를 지원하여 우리 국내 경제에 도움이 될 철, 구리, 니켈 및 기타 자원의 제한적인 상업 매장지를 발견했습니다. 또한 잠재적 손실을 상쇄하도록 우리의 알루미늄 산업을 확장해 주겠다고 했습니다. 우리는 특정 해외 공급원에 대한 의존도를 줄이기 위해 이 자원이 절실하지만, 이웃 나라에 그렇게 큰 빚을 질 여유가 있겠습니까?"
 greenland_influence_event.7.o1: "이 자원이 절실히 필요하다"
 greenland_influence_event.7.o2: "너무 위험하다, 거부한다"
 greenland_influence_event.8.t: "거래의 기술"
 greenland_influence_event.8.d: "아이슬란드가 우리의 전략 자원 투자를 수용하여 전체 투자 단계를 모두 마칠 수 있었습니다. 이를 바탕으로 가까운 미래에 연합을 확보할 수 있는 무대가 마련되었습니다."
 greenland_influence_event.8.o1: "그만한 가치가 있었다"
 greenland_influence_event.10000.t: "투자 거부"
 greenland_influence_event.10000.d: "아이슬란드가 우리의 제안을 거부함에 따라 이제 외교적으로는 공식적으로 선택지가 없어졌습니다. 할 수 있는 한 오래 기다려 보겠지만, 이제 최종 단계에 들어갈 때입니다."
 greenland_influence_event.10000.o1: "작전 리얼 그린을 준비하라"
 greenland_subterfuge_event.1.t: "그린란드의 대규모 투자"
 greenland_subterfuge_event.1.d: "그린란드가 매우 수지맞는 제안을 들고 찾아왔습니다. 우리나라를 성장시키기 위해 전면적인 일괄 투자를 하겠다는 것입니다. 이런 기회는 거의 터무니없어 보이지만, 이 섬에는 내세울 것이 별로 없습니다. 게다가 그린란드가 큰 틀에서 우리에게 무슨 영향을 미칠 수 있겠습니까."
 greenland_subterfuge_event.1.o1: "관대함에 감사드린다"
 greenland_subterfuge_event.1.o2: "너무 좋아서 믿기 어렵다, 거부한다"
 greenland_subterfuge_event.2.t: "아이슬란드의 우리 관대함 수용"
 greenland_subterfuge_event.2.d: "아이슬란드 정부가 우리의 대규모 투자를 수용함에 따라, 이제 이 투자를 이용해 평온을 어지럽히고 현상을 딱 필요한 만큼만 바꾸어 섬을 NATO의 간섭으로부터 고립시킬 수 있습니다."
 greenland_subterfuge_event.2.o1: "이제 기다리자"
 greenland_subterfuge_event.3.t: "출처 규명"
 greenland_subterfuge_event.3.d: "최근의 소요와 사회적 담론이 그린란드의 특정 투자로 거슬러 올라가는 것으로 보입니다. 이러한 새로운 전선은 우리 사회에 가벼운 불편을 일으켰지만, 이대로 방치하면 앞으로 심각한 문제를 맞을 수도 있습니다. 위험하기는 하나, 계속되는 책동에 맞서 싸우거나 근본 원인을 격파하여 문제를 영구히 해결하는 방법을 택할 수 있습니다."
 greenland_subterfuge_event.3.o1: "그들에게 군대나 있기는 한가?"
 greenland_subterfuge_event.3.o2: "우리에겐 NATO가 있으니 괜찮을 것이다"
 greenland_subterfuge_event.10000.t: "투자 거부"
 greenland_subterfuge_event.10000.d: "아이슬란드가 우리의 최선의 제안을 거부했습니다. 받아들이지 않겠다면 최악의 상황에 대비하는 수밖에 없습니다."
 greenland_subterfuge_event.10000.o1: "작전 리얼 그린을 준비하라"
 greenland_subterfuge_event.4.t: "그린란드의 대규모 투자"
 greenland_subterfuge_event.4.d: "그린란드가 제안을 해 왔습니다. 포괄적인 투자와 독점 무역 협정입니다. 그린란드는 우리의 인프라, 구획 정비 역량, 민간 산업 기반을 구축해 주겠다고 하며, 그 투자의 대가로 필요한 물자 지원 거래에 대한 독점 임대권을 제공하겠다고 합니다. 이 방대한 투자 패키지의 마지막 미끼는 우리 해역 일대에 알려진 석유 매장지를 구축하고 채굴하는 직접적인 대규모 투자입니다. 이는 극도로 좋은 거래이며 솔직히 문제점이 거의 보이지 않습니다. 그러나 특정 국가에 빚을 지게 된다면 덴마크는 어떻게 하겠습니까."
 greenland_subterfuge_event.4.o1: "거래합시다!"
 greenland_subterfuge_event.4.o2: "아니, 이건 옳지 않다"
 greenland_subterfuge_event.5.t: "페로 제도의 수용"
 greenland_subterfuge_event.5.d: "페로 제도 정부가 우리의 풍성한 투자를 받아들였으며, 이제 우리의 미래를 향해 나아가기 시작할 수 있습니다."
 greenland_subterfuge_event.5.o1: "선동가들을 투입하라"
 greenland_subterfuge_event.6.t: "정부에 청원하는 시민들"
 greenland_subterfuge_event.6.d: "최근 사건이 점점 격화되면서 점점 더 많은 섬 주민들이 그린란드와 서북유럽 연합을 결성하는 국민투표를 실시하도록 정부에 간청하고 있습니다. 많은 이들이 덴마크의 최소한의 접근 방식보다 섬 주민들의 복지를 위한 투자라는 호의적으로 보이는 행보를 이유로 듭니다. 이렇게 압력이 거세지자 우리는 그들의 요구를 받아들일 수밖에 없으며 그린란드 정부에 청원할 것입니다."
 greenland_subterfuge_event.6.o1: "페로여 영원하라"
 greenland_subterfuge_event.7.t: "성공한 승부수"
 greenland_subterfuge_event.7.d: "페로 주민들의 여론 압력으로 그들의 정부는 우리나라와의 연합 결성을 청원하게 되었습니다. 이는 덴마크 정부 내에 틀림없이 어떤 동요를 일으킬 것이므로 우리에게 좋은 징조입니다."
 greenland_subterfuge_event.7.o1: "한 걸음 더 가까워졌다"
 greenland_subterfuge_event.8.t: "잠깐, 뭐라고?!"
 greenland_subterfuge_event.8.d: "그린란드군이 어느 틈엔가 페로 제도에 자리를 잡고 주민 및 정부 관리들과 협력하여 평화적으로 권력을 이양받고 있다는 보고가 들어오고 있습니다. 문제는 누가 그들에게 그럴 권리를 주었느냐는 것입니다. 우리와는 협의가 없었으며, 이 제도에 대한 우리의 전반적인 무관심이 오히려 우리에게 불리하게 작용한 듯합니다. 대응하지 않으면 체면을 잃지만, 서둘러 대응하면 직접적인 적대 행위를 우리가 일으키는 셈이므로 우리 홀로 맞서야 합니다."
 greenland_subterfuge_event.8.o1: "우리가 이길 수 있다!"
 greenland_subterfuge_event.8.o2: "페어 누구?"
 greenland_subterfuge_event.40000.t: "투자 거부"
 greenland_subterfuge_event.40000.d: "페로 제도가 우리의 최선의 제안을 거부했습니다. 받아들이지 않겠다면 최악의 상황에 대비하는 수밖에 없습니다."
 greenland_subterfuge_event.40000.o1: "동원을 개시하라"
 greenland_subterfuge_event.9.t: "그린란드의 투자"
 greenland_subterfuge_event.9.d: "그린란드가 우리에게 아무런 비용이 들지 않는 일련의 투자를 제안해 왔습니다. 이들은 윌란 지역의 덜 발전한 지역을 개발하고 북유럽의 연대를 증진하는 데 집중하고자 합니다. 그러나 정부 내 일부에서는 투자가 너무 좋아서 믿기 어려울 정도이므로 그들이 숨은 의도를 추구하고 있다고 생각합니다. 그렇다 해도 그린란드가 현실적으로 우리에게 무엇을 할 수 있겠습니까?"
 greenland_subterfuge_event.9.o1: "공짜도 나쁘지 않다"
 greenland_subterfuge_event.9.o2: "당신들의 수상한 말이 마음에 들지 않는다"
 greenland_subterfuge_event.10.t: "덴마크의 수용"
 greenland_subterfuge_event.10.d: "덴마크 정부가 투자를 받아들였으며, 이제 우리가 계획한 바를 준비하기 시작할 것입니다."
 greenland_subterfuge_event.10.o1: "이제 공은 그들에게 넘어갔다"
 greenland_subterfuge_event.11.t: "출처 규명"
 greenland_subterfuge_event.11.d: "최근의 소요와 사회적 담론이 그린란드의 특정 투자로 거슬러 올라가는 것으로 보입니다. 이러한 새로운 전선은 우리 사회에 가벼운 불편을 일으켰지만, 이대로 방치하면 앞으로 심각한 문제를 맞을 수도 있습니다. 위험하기는 하나, 계속되는 책동에 맞서 싸우거나 근본 원인을 격파하여 문제를 영구히 해결하는 방법을 택할 수 있습니다."
 greenland_subterfuge_event.11.o1: "그들에게 군대나 있기는 한가?"
 greenland_subterfuge_event.11.o2: "우리에겐 NATO가 있으니 괜찮을 것이다"
 greenland_subterfuge_event.90000.t: "투자 거부"
 greenland_subterfuge_event.90000.d: "덴마크가 우리의 최선의 제안을 거부했습니다. 받아들이지 않겠다면 최악의 상황에 대비하는 수밖에 없습니다."
 greenland_subterfuge_event.90000.o1: "작전 중개인을 준비하라"
 greenland_subterfuge_event.12.t: "그린란드의 투자"
 greenland_subterfuge_event.12.d: "그린란드가 우리에게 아무런 비용이 들지 않는 일련의 투자를 제안해 왔습니다. 이들은 노르드노르게 지역의 덜 발전한 지역을 개발하고 북유럽의 단결과 번영을 증진하는 데 집중하고자 합니다. 그러나 정부 내 일부에서는 투자가 너무 좋아서 믿기 어려울 정도이므로 그들이 숨은 의도를 추구하고 있다고 생각합니다. 그렇다 해도 그린란드가 현실적으로 우리에게 무엇을 할 수 있겠습니까?"
 greenland_subterfuge_event.12.o1: "공짜라면 동의할 수 있다"
 greenland_subterfuge_event.12.o2: "우리는 잘 지내고 있으니 괜찮다, 고맙다"
 greenland_subterfuge_event.13.t: "노르웨이의 수용"
 greenland_subterfuge_event.13.d: "노르웨이 정부가 투자를 받아들였으며, 이제 우리는 민간 인구를 통해 이 나라를 NATO로부터 멀어지게 하려는 계획을 준비하기 시작할 것입니다."
 greenland_subterfuge_event.13.o1: "그들이 어떻게 하는지 지켜보자"
 greenland_subterfuge_event.14.t: "출처 규명"
 greenland_subterfuge_event.14.d: "최근의 소요와 사회적 담론이 그린란드의 특정 투자로 거슬러 올라가는 것으로 보입니다. 이러한 새로운 전선은 우리 사회에 가벼운 불편을 일으켰지만, 이대로 방치하면 앞으로 심각한 문제를 맞을 수도 있습니다. 위험하기는 하나, 계속되는 책동에 맞서 싸우거나 근본 원인을 격파하여 문제를 영구히 해결하는 방법을 택할 수 있습니다."
 greenland_subterfuge_event.14.o1: "그들에게 군대나 있기는 한가?"
 greenland_subterfuge_event.14.o2: "우리에겐 NATO가 있으니 괜찮을 것이다"
 greenland_subterfuge_event.120000.t: "투자 거부"
 greenland_subterfuge_event.120000.d: "노르웨이가 우리의 최선의 제안을 거부했습니다. 받아들이지 않겠다면 최악의 상황에 대비하는 수밖에 없습니다."
 greenland_subterfuge_event.120000.o1: "작전 피오르드란트를 준비하라"
 greenland_subterfuge_event.15.t: "그린란드의 투자"
 greenland_subterfuge_event.15.d: "그린란드가 우리에게 아무런 비용이 들지 않는 일련의 투자를 제안해 왔습니다. 이들은 칼스타드 시 주변의 덜 발전한 지역을 개발하고 북유럽의 단결과 번영을 증진하는 데 집중하고자 합니다. 그러나 정부 내 일부에서는 투자가 너무 좋아서 믿기 어려울 정도이므로 그들이 숨은 의도를 추구하고 있다고 생각합니다. 그렇다 해도 그린란드가 현실적으로 우리에게 무엇을 할 수 있겠습니까?"
 greenland_subterfuge_event.15.o1: "공짜는 여전히 공짜다"
 greenland_subterfuge_event.15.o2: "정중히 사양하겠다"
 greenland_subterfuge_event.16.t: "스웨덴의 수용"
 greenland_subterfuge_event.16.d: "스웨덴 정부가 투자를 받아들였으며, 이제 우리는 민간 인구를 통해 NATO와 그다지 가깝지 않은 더 약한 중앙 권력을 확보하려는 계획을 준비하기 시작할 것입니다."
 greenland_subterfuge_event.16.o1: "이제 기다리며 계획하자"
 greenland_subterfuge_event.17.t: "출처 규명"
 greenland_subterfuge_event.17.d: "최근의 소요와 사회적 담론이 그린란드의 특정 투자로 거슬러 올라가는 것으로 보입니다. 이러한 새로운 전선은 우리 사회에 가벼운 불편을 일으켰지만, 이대로 방치하면 앞으로 심각한 문제를 맞을 수도 있습니다. 위험하기는 하나, 계속되는 책동에 맞서 싸우거나 근본 원인을 격파하여 문제를 영구히 해결하는 방법을 택할 수 있습니다."
 greenland_subterfuge_event.17.o1: "그들에게 군대나 있기는 한가?"
 greenland_subterfuge_event.17.o2: "저런 벌레들은 걱정할 필요도 없다"
 greenland_subterfuge_event.150000.t: "투자 거부"
 greenland_subterfuge_event.150000.d: "스웨덴이 우리의 최선의 제안을 거부했습니다. 받아들이지 않겠다면 최악의 상황에 대비하는 수밖에 없습니다."
 greenland_subterfuge_event.150000.o1: "작전 대북방 전쟁을 준비하라"
 greenland_subterfuge_event.18.t: "그린란드의 투자"
 greenland_subterfuge_event.18.d: "그린란드가 우리에게 아무런 비용이 들지 않는 일련의 투자를 제안해 왔습니다. 이들은 덜 발전한 북부 라피 지역을 개발하고 북유럽의 단결과 번영을 증진하는 데 집중하고자 합니다. 그러나 정부 내 일부에서는 투자가 너무 좋아서 믿기 어려울 정도이므로 그들이 숨은 의도를 추구하고 있다고 생각합니다. 그렇다 해도 그린란드가 현실적으로 우리에게 무엇을 할 수 있겠습니까?"
 greenland_subterfuge_event.18.o1: "좋은 거래다, 받아들이겠다"
 greenland_subterfuge_event.18.o2: "지금은 아닌 것 같다"
 greenland_subterfuge_event.19.t: "핀란드의 수용"
 greenland_subterfuge_event.19.d: "핀란드 정부가 투자를 받아들였으며, 이제 우리는 정부를 고립시키고 국민이 더 큰 북유럽 연합을 보다 쉽게 받아들이도록 만들어 목표를 달성할 준비를 시작할 것입니다."
 greenland_subterfuge_event.19.o1: "건전한 결론을 향해 나아가자"
 greenland_subterfuge_event.20.t: "출처 규명"
 greenland_subterfuge_event.20.d: "최근의 소요와 사회적 담론이 그린란드의 특정 투자로 거슬러 올라가는 것으로 보입니다. 이러한 새로운 전선은 우리 사회에 가벼운 불편을 일으켰지만, 이대로 방치하면 앞으로 심각한 문제를 맞을 수도 있습니다. 위험하기는 하나, 계속되는 책동에 맞서 싸우거나 근본 원인을 격파하여 문제를 영구히 해결하는 방법을 택할 수 있습니다."
 greenland_subterfuge_event.20.o1: "그들에게 군대나 있기는 한가?"
 greenland_subterfuge_event.20.o2: "그들은 걱정할 필요도 없다"
 greenland_subterfuge_event.180000.t: "투자 거부"
 greenland_subterfuge_event.180000.d: "핀란드가 우리의 최선의 제안을 거부했습니다. 받아들이지 않겠다면 최악의 상황에 대비하는 수밖에 없습니다."
 greenland_subterfuge_event.180000.o1: "작전 만네르헤임을 준비하라"
