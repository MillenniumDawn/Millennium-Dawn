 ukr_light_transport_tender: "Провести тендер на новый \n§Yлёгкий транспортный автомобиль§!"
 ukr_light_transport_tender_desc: "\n\n\n\n\n\n\n£UKR_desctext_develop_domestic_dozor_a_for_tooltip\n\n\n\n\n\n\n\n\n§WВооружённым силам Украины нужно новое поколение лёгких транспортных автомобилей на замену устаревшим советским машинам общего назначения. Несколько отечественных производителей представили предложения нового автомобиля, который должен стать универсальной транспортной платформой для вооружённых сил и других государственных структур.§!"
 ukraine_modernize_sov_equipment_brdm_2_modernization_offers: "Собрать предложения по модернизации §YБРДМ-2§!"
 ukraine_modernize_sov_equipment_brdm_2_modernization_offers_desc: "\n\n\n\n\n\n£UKR_desctext_modernize_sov_brdm2_for_tooltip\n\n\n\n\n\n\n\n\n§WНаша армия по-прежнему полагается на сотни советских разведывательных машин §YБРДМ-2§!. Министерство обороны может спросить нашу оборонную промышленность, как их модернизировать.\n\nКогда предложения поступят, мы выберем одного подрядчика для программы или закроем её окончательно.\n------------------\nЭто решение — §Rобязательное условие§! для всех остальных решений по модернизации §YБРДМ-2§!. Если §Rпропустить§! его, вы §Rпотеряете§! возможность выполнить их.§!"
 ukraine_modernize_sov_equipment_brdm_2_modernization_offers_mission: "Срок: предложения по модернизации §YБРДМ-2§!"
 ukraine_modernize_sov_equipment_brdm_2_modernization_offers_mission_desc: "$ukraine_modernize_sov_equipment_brdm_2_modernization_offers_desc$\n\n§RКогда таймер истечёт, предложения всё равно поступят к нам, и нам придётся выбирать.§!"
 ukraine_modernize_sov_equipment_brdm_2_modernization_other_manufacturers: "Пригласить других производителей в программу §YБРДМ-2§!"
 ukraine_modernize_sov_equipment_brdm_2_modernization_other_manufacturers_desc: "\n\n\n\n\n\n£UKR_desctext_modernize_sov_brdm2_other_for_tooltip\n\n\n\n\n\n\n\n\n§WРабота над БРДМ-2 в Николаеве привлекла внимание других компаний. §YНВК «Техимпекс»§!, киевский завод §Y«Маяк»§!, кременчугская компания §Y«Вепр»§! и винницкий §Y45-й экспериментальный механический завод§! хотят присоединиться к программе, но для начала им нужны запасные корпуса БРДМ-2 с наших складов.§!"
 ukraine_modernize_sov_equipment_brdm_2_modernization_mykolayiv_late: "Решить, как модернизировать оставшиеся §YБРДМ-2§!"
 ukraine_modernize_sov_equipment_brdm_2_modernization_mykolayiv_late_desc: "\n\n\n\n\n\n£UKR_desctext_modernize_sov_brdm2l1_for_tooltip\n\n\n\n\n\n\n\n\n§WНа наших складах всё ещё ждут больше сотни старых §YБРДМ-2§!. §YНиколаевский танкоремонтный завод§! предлагает два варианта: §YБРДМ-2Л1§! — дешёвую модернизацию, которую он может быстро развернуть, или §YБРМ «Мангуст»§! — разведывательную машину, перестроенную почти с нуля.\n\nПредложение действует до конца §Y2018§! года.§!"
 ukraine_modernize_sov_equipment_brdm_2_modernization_mykolayiv_late_mission: "Последний шанс: оставшиеся §YБРДМ-2§!"
 ukraine_modernize_sov_equipment_brdm_2_modernization_mykolayiv_late_mission_desc: "$ukraine_modernize_sov_equipment_brdm_2_modernization_mykolayiv_late_desc$\n\n§RКогда таймер истечёт, завод отзовёт предложение.§!"
 ukraine_modernize_sov_equipment_brdm_2_modernization_techimpex_brdm_2t: "Заказать прототип §YБРДМ-2Т§! у «Техимпекс»"
 ukraine_modernize_sov_equipment_brdm_2_modernization_techimpex_brdm_2t_desc: "\n\n\n\n\n\n£UKR_desctext_modernize_sov_brdm2t_2012_for_tooltip\n\n\n\n\n\n\n\n\n§WКиевская §YНВК «Техимпекс»§! готова перестроить БРДМ-2. Дизель Д-245 заменит пожароопасный бензиновый двигатель ГАЗ-41, а вся машина пройдёт капитальный ремонт. Прототип займёт около двух лет.\n\nПредложение действует до конца §Y2011§! года.\n------------------\nЭто решение — §Rобязательное условие§! для решения о комплекте защиты §Y«Янгол»§!. Если §Rпропустить§! его, вы §Rпотеряете§! возможность выполнить его.§!"
 ukraine_modernize_sov_equipment_brdm_2_modernization_techimpex_brdm_2t_mission: "Последний шанс: прототип §YБРДМ-2Т§!"
 ukraine_modernize_sov_equipment_brdm_2_modernization_techimpex_brdm_2t_mission_desc: "$ukraine_modernize_sov_equipment_brdm_2_modernization_techimpex_brdm_2t_desc$\n\n§RКогда таймер истечёт, «Техимпекс» отзовёт предложение.§!"
 ukraine_modernize_sov_equipment_brdm_2_modernization_techimpex_yanhol: "Разработать комплект защиты §Y«Янгол»§!"
 ukraine_modernize_sov_equipment_brdm_2_modernization_techimpex_yanhol_desc: "\n\n\n\n\n\n£UKR_desctext_modernize_sov_brdm2t_yanhol_for_tooltip\n\n\n\n\n\n\n\n\n§WНаши экипажи хотят лучшей защиты для §YБРДМ-2Т§!. §YНВК «Техимпекс»§! может добавить разнесённые стальные бронеплиты к уже выпускаемому варианту и превратить его в §YБРДМ-2Т «Янгол»§!.§!"
 ukraine_modernize_sov_equipment_brdm_2_modernization_mayak_brdm_2dp: "Заказать §YБРДМ-2ДП§! у «Маяка»"
 ukraine_modernize_sov_equipment_brdm_2_modernization_mayak_brdm_2dp_desc: "\n\n\n\n\n\n£UKR_desctext_modernize_sov_brdm2dp_for_tooltip\n\n\n\n\n\n\n\n\n§WКиевский завод §Y«Маяк»§! предлагает §YБРДМ-2ДП§! — облегчённую БРДМ-2 с дизельным двигателем. Она несёт 12.7-мм ДШКМ и два пулемёта СГМБ, имеет боковые двери для десанта и съёмные противокумулятивные экраны.§!"
 ukraine_modernize_sov_equipment_brdm_2_modernization_vepr_brdm_2_vepr: "Заказать §YБРДМ-2 «Вепр»§! у компании «Вепр»"
 ukraine_modernize_sov_equipment_brdm_2_modernization_vepr_brdm_2_vepr_desc: "\n\n\n\n\n\n£UKR_desctext_modernize_sov_brdm2_vepr_for_tooltip\n\n\n\n\n\n\n\n\n§WКременчугская компания §Y«Вепр»§! предлагает §YБРДМ-2 «Вепр»§!. Кабина получает бронестёкла для лучшего обзора, а днище — бронирование. Средние колёса уступают место полноразмерным боковым дверям для десанта, кормовой пулемёт заменяет водомёт, а в носовой части можно установить автоматический гранатомёт.§!"
 ukraine_modernize_sov_equipment_brdm_2_modernization_vinnytsia_brdm_2i: "Заказать §YБРДМ-2И§! в Виннице"
 ukraine_modernize_sov_equipment_brdm_2_modernization_vinnytsia_brdm_2i_desc: "\n\n\n\n\n\n£UKR_desctext_modernize_sov_brdm2i_for_tooltip\n\n\n\n\n\n\n\n\n§WВинницкий §Y45-й экспериментальный механический завод§! предлагает §YБРДМ-2И§!. Тихий дизель ISUZU мощностью 156 л. с. заменяет бензиновый двигатель, добавляется система централизованной подкачки шин, а вооружение усиливается до 14.5-мм КПВТ, гранатомёта АГС-17 и противотанковой ракеты §Y«Барьер»§!.§!"
 ukraine_modernize_sov_equipment_brdm_2_modernization.4.d: "Привлечь компанию «Вепр»"
 ukraine_modernize_sov_equipment_brdm_2_modernization.4.e: "Николаевского завода достаточно"
 ukraine_modernize_sov_equipment_brdm_2_modernization.10.c: "Хватит и обр. 2012"
 ukraine_modernize_sov_equipment_brdm_2_modernization.14.name: "«Арей» перестраивает БРДМ-2"
 ukraine_modernize_sov_equipment_brdm_2_modernization.14.desc: "Инженерная группа §Y«Арей»§! из добровольцев армии и Национальной гвардии по собственной инициативе начала перестраивать БРДМ-2. Их §YБКМ «Гекон»§! получает мощный дизель, боковые двери и место для девяти человек."
 ukraine_modernize_sov_equipment_brdm_2_modernization.14.a: "Пусть работают"
 ukraine_modernize_sov_equipment_brdm_2_modernization.14.b: "Поддержать их финансированием"
 ukraine_modernize_sov_equipment_brdm_2_modernization.15.name: "Представлена БКМ «Гекон»"
 ukraine_modernize_sov_equipment_brdm_2_modernization.15.desc: "«Арей» представил §YБКМ «Гекон»§!. Дизель General Motors с гидростатической трансмиссией, бойницы, боковые двери и более толстая броня превратили старую БРДМ-2 в машину, которую просил фронт."
 ukraine_modernize_sov_equipment_brdm_2_modernization.15.a: "Принять на вооружение §YБКМ «Гекон»§!"
 ukraine_modernize_sov_equipment_brdm_2_modernization.16.name: "БРДМ-2Т «Янгол» готова"
 ukraine_modernize_sov_equipment_brdm_2_modernization.16.desc: "§YНВК «Техимпекс»§! установила на наши §YБРДМ-2Т§! разнесённые стальные бронеплиты. §YБРДМ-2Т «Янгол»§! гораздо лучше защищает экипаж от огня стрелкового оружия и осколков."
 ukraine_modernize_sov_equipment_brdm_2_modernization.16.a: "Принять на вооружение §YБРДМ-2Т «Янгол»§!"
 ukraine_modernize_sov_equipment_brdm_2_modernization.17.name: "БРДМ-2ДП готова"
 ukraine_modernize_sov_equipment_brdm_2_modernization.17.desc: "Завод §Y«Маяк»§! завершил §YБРДМ-2ДП§! для нашей армии: облегчённую БРДМ-2 с дизельным двигателем, боковыми дверями и съёмными противокумулятивными экранами."
 ukraine_modernize_sov_equipment_brdm_2_modernization.17.a: "Принять на вооружение §YБРДМ-2ДП§!"
 ukraine_modernize_sov_equipment_brdm_2_modernization.18.name: "БРДМ-2И готова"
 ukraine_modernize_sov_equipment_brdm_2_modernization.18.desc: "Винницкий §Y45-й экспериментальный механический завод§! поставил §YБРДМ-2И§! с тихим дизелем ISUZU, централизованной подкачкой шин и усиленным вооружением."
 ukraine_modernize_sov_equipment_brdm_2_modernization.18.a: "Принять на вооружение §YБРДМ-2И§!"
 ukraine_modernize_sov_equipment_brdm_2_modernization.19.name: "БРДМ-2 «Вепр» готова"
 ukraine_modernize_sov_equipment_brdm_2_modernization.19.desc: "Кременчугская компания §Y«Вепр»§! завершила §YБРДМ-2 «Вепр»§! для нашей армии: бронестёкла в кабине, бронированное днище, боковые двери для десанта и кормовая пулемётная позиция."
 ukraine_modernize_sov_equipment_brdm_2_modernization.19.a: "Принять на вооружение §YБРДМ-2 «Вепр»§!"
 ukraine_modernize_sov_equipment_brdm_2_modernization_mykolayiv_plan_tt: "§YНиколаевский танкоремонтный завод§! предлагает модернизации поэтапно: ранние варианты в §Y2000-2001§! гг., §YБРДМ-2ДИ «Хазар»§! в §Y2004-2005§! гг., приглашение других производителей в §Y2010-2012§! гг. и финальную модернизацию оставшихся БРДМ-2 в §Y2015-2018§! гг."
 ukraine_modernize_sov_equipment_brdm_2_modernization_techimpex_plan_tt: "§YНВК «Техимпекс»§! начинает работу над §YБРДМ-2Т§! в §Y2010§! году. Модернизация развивается поэтапно: прототип, затем облегчённая или улучшенная версия, затем комплект защиты §Y«Янгол»§!."
 ukraine_modernize_sov_equipment_brdm_2_modernization_other_plan_tt: "§Y«Маяк»§! предлагает §YБРДМ-2ДП§! в §Y2007-2009§! гг. §Y45-й экспериментальный механический завод§! предлагает §YБРДМ-2И§! с §Yсередины 2014§! года. Компания §Y«Вепр»§! предлагает §YБРДМ-2 «Вепр»§! в §Y2015-2016§! гг."
 ukraine_modernize_sov_equipment_brdm_2_modernization_vepr_plan_tt: "Кременчугская компания §Y«Вепр»§! предлагает §YБРДМ-2 «Вепр»§! в §Y2014-2016§! гг."
 ukraine_modernize_sov_equipment_brdm_2_modernization_vinnytsia_plan_tt: "§Y45-й экспериментальный механический завод§! предлагает §YБРДМ-2И§! с §Yсередины 2014§! года."
 ukraine_modernize_sov_equipment_brdm_2_modernization_cancel_tt: "§RПрограмма модернизации БРДМ-2 окончательно закрыта.§! Наши БРДМ-2 остаются на вооружении в нынешнем виде."
 ukraine_modernize_sov_equipment_brdm_2_modernization_mykolayiv_wait_tt: "§YНиколаевский танкоремонтный завод§! представит свою работу примерно через §Y$DAYS$§! дн."
 ukraine_modernize_sov_equipment_brdm_2_modernization_mykolayiv_experience_tt: "§GНаша работа над ранними вариантами сокращает срок вдвое.§!"
 ukraine_modernize_sov_equipment_brdm_2_modernization_techimpex_wait_tt: "§YНВК «Техимпекс»§! представит свою работу примерно через §Y$DAYS$§! дн."
