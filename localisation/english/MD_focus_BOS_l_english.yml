 BOS_faction_value_unavailable: "§gUnavailable§!"
 BOS_ATTITUDE_TOOLTIP: "§YTrust§! measures how far a constituent group stands with the central government, from §tHostile§! through §gIndifferent§! and §GFriendly§! to §GLoyal§!. Hostile groups may demonstrate and block political paths, while the combined values modify national Stability."
 BOS_STABILITY_TOOLTIP: "§YNet Effect§! shows the combined national modifiers the constituent groups currently produce: the Stability change from their Trust and the Recruitable Population change from their Manpower."
 BOS_net_stability_factor_display: "§YStability§!: [?ROOT.BOS_internal_faction_stability_factor|%0]"
 BOS_net_manpower_factor_display: "§YRecruits§!: [?ROOT.BOS_internal_faction_manpower_factor|%0]"
 BOS_MANPOWER_TOOLTIP: "§YManpower§! measures the recruits each constituent group will provide. The combined values modify Recruitable Population."
 bos_srpska_gui_info_TOOLTIP: "§YSerbs§! mostly reside within Republika Srpska, a part of land that hugs the Federation of Bosnia and Herzegovina from the east and the north. Republika Srpska is an autonomous entity within Bosnia and Herzegovina. They are predominantly Orthodox in faith."
 bos_bosniak_gui_info_TOOLTIP: "§YBosniaks§! are an ethnic group that jointly shares the entity of Federation of Bosnia and Herzegovina not to be confused with the country name of Bosnia and Herzegovina. They mostly reside within central Bosnia and are predominantly Muslim in faith."
 bos_croat_gui_info_TOOLTIP: "§YCroats§! are the minority group within the Federation of Bosnia and Herzegovina. They mostly live along the south-western region of Bosnia along the border of Croatia's southern Coastline. They are predominantly Catholic in faith."
 bos_no_wars_tt: "§RWe cannot declare wars.§!\nIf stability falls below 30% and the constituent factions are not loyal, the risk of civil war rises sharply."
