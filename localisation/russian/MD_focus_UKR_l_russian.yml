 ukr_modernize_sov_equipment_t55_reactivation_program.3.name: "Лёгкая модернизация §YТ-55§!:\nпрототип готов"
 ukr_modernize_sov_equipment_t55_reactivation_program.3.desc_5tdf: "Первый §YТ-55§! с двигателем §Y5ТДФ§! прошёл заводские испытания на §YХарьковском бронетанковом заводе§!. Танк стал §Gбыстрее и надёжнее§!, а для переделки используются двигатели, уже выпускаемые для §YТ-64§!."
 ukr_modernize_sov_equipment_t55_reactivation_program.3.desc_64: "§YТ-55§!, перестроенный с узлами от §YТ-64§!, прошёл заводские испытания на §YХарьковском бронетанковом заводе§!. Комбинированная броня и двигатель §Y5ТДФ§! дают старому корпусу §Gвторую жизнь§!."
