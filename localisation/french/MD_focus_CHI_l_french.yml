 china_news.43.t: "La Chine annonce sa pleine implication dans la question de la péninsule coréenne"
 china_news.43.d: "La péninsule coréenne, longtemps divisée, a toujours été une source d'instabilité en Asie de l'Est. La Chine ne veut pas que son essor soit perturbé par les dangers qui l'entourent. Le Sud comme le Nord ont chacun leurs propres facteurs de déstabilisation. La décision de la Chine sera cruciale pour qu'elle maintienne la situation actuelle ou qu'elle laisse l'un d'eux devenir poussière de l'histoire."
