 RAJ_PAK_border_conflict_category: "Conflit frontalier indo-pakistanais"
 RAJ_PAK_border_conflict_category_desc: "[RAJ.GetNameDefCap] et [PAK.GetNameDefCap] restent divisés au sujet du Jammu-et-Cachemire et d'une frontière lourdement militarisée. Exercices, incursions et échanges d'artillerie peuvent déboucher sur des accrochages limités ou une crise diplomatique. La progression est suivie séparément pour chaque État contesté.\n\n$border_readiness_RAJ$ : [?RAJ.pak_raj_border_readiness|Y0]\n$pak_raj_border_tension$ : [?global.pak_raj_border_tension|Y0]\n\n§YÉtats frontaliers§! (80 de progression de revendication requis pour faire valoir une revendication) :\n[420.Owner.GetFlag] [420.GetName] : [?THIS.pak_raj_border_progress_420|Y0]\n\nL'armée désigne un État frontalier comme secteur actif à la fois, et chaque préparation part de celui-ci. Un nouveau secteur est tiré parmi les États frontaliers que nous contrôlons une fois la préparation en cours achevée."
 RAJ_CHI_border_conflict_category: "Conflit frontalier sino-indien"
 RAJ_CHI_border_conflict_category_desc: "[RAJ.GetNameDefCap] et [CHI.GetNameDefCap] se disputent plusieurs tronçons de la ligne de contrôle réel, de l'Aksai Chin et du Ladakh jusqu'au Sikkim et à l'Arunachal Pradesh. Les opérations exigent des forces locales et ne construisent de l'élan que vers l'État où s'est déroulé le combat.\n\n$border_readiness_RAJ$ : [?RAJ.raj_chi_border_readiness|Y0]\n$raj_chi_border_tension$ : [?global.raj_chi_border_tension|Y0]\n\n§YÉtats frontaliers§! (80 de progression de revendication requis pour faire valoir une revendication) :\n[475.Owner.GetFlag] [475.GetName] : [?THIS.raj_chi_border_progress_475|Y0]\n\nL'armée désigne un État frontalier comme secteur actif à la fois, et chaque préparation part de celui-ci. Un nouveau secteur est tiré parmi les États frontaliers que nous contrôlons une fois la préparation en cours achevée."
 border_war_axis_requirements_tt: "Nous devons posséder et contrôler l'État source, y stationner au moins une division, et affronter le rival dans l'État cible. Ces conditions sont revérifiées à la fin des préparatifs."
 border_war_capture_requirements_tt: "Nous devons tenir un État source adjacent avec au moins une division tandis que le rival possède et contrôle la cible. Ces conditions sont revérifiées à la fin de l'opération."
