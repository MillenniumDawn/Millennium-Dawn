l_english:
 subject_independence.1.t: "A Former Subject Gains Independence"
 subject_independence.1.d: "[event_target:autonomy_former_subject.GetName] is no longer our subject. We can recognize their independence or put pressure on their new government."
 subject_independence.1.a: "Recognize their independence"
 subject_independence.1.b: "Impose a trade embargo"
 subject_independence.1.c: "Impose bilateral trade sanctions"
 subject_independence.2.t: "How Far Do We Go?"
 subject_independence.2.d: "We have put economic pressure on [event_target:autonomy_former_subject.GetName]. We must now decide whether to stop there or prepare to reassert control."
 subject_independence.2.a: "Keep the response economic"
 subject_independence.2.b: "Gain a war goal to restore control"
