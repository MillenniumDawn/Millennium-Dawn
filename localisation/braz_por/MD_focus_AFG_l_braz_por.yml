 AFG_enhance_leader_protection_tt: "§GFortalecerá§! a proteção dos nossos §Ycomandantes em Campo§! contra a infiltração do £SAU_salafist_jihadism §RAl-Qaeda§! e do £GFX_AFG_salafist_jihadism §RTalibã§!."
 AFG_further_enhance_leader_protection_tt: "§W--------------§!\nFortalecerá ainda mais a proteção dos nossos §YComandantes em Campo§! contra a infiltração do £SAU_salafist_jihadism §RAl-Qaeda§! e do £GFX_AFG_salafist_jihadism §RTalibã§!."
 AFG_hezb_i_islami_in_power_tt: "£GFX_AFG_kingdom §YHezb-e Islami§! já derrubou o governo republicano."
 AFG_taliban_to_hezbi_islami_ten_percent: "O £GFX_AFG_salafist_jihadism §YTalibã§! perde §G10%§! de apoio para o £GFX_AFG_kingdom §YHezb-e Islami§! como resultado do golpe."
