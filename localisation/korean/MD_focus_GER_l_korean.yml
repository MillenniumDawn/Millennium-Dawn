 GER_FCAS_weapons: "FCAS 무기"
 germany.560.t: "특별 회기의 결과"
 germany.560.d: "연방의회 특별 회기가 장관들과 자문위원들이 각자의 제안을 제시하며 막을 내렸습니다. 이제 이 제안들에 어떻게 대응할지 결정하는 책임은 우리에게 있습니다."
 germany.560.a: "반응을 기다려 보자."
 germany.560.b: "우리는 더 이상 이 조약에 구속되지 않는다고 선언한다."
 GER_idea_Marinekommando_desc: "§Y이 국가 정신은 독일이 USE를 결성하거나 민주주의 노선을 포기하면 제거됩니다.§!"
 GER_Bundeswehr_modifier_desc: "2000년의 독일 육군은 기로에 서 있습니다. 주로 냉전기 군대로 설계되고 구성된 육군의 주된 초점은 중부 유럽에서 바르샤바 조약기구와의 잠재적 대규모 분쟁에 대비한 방어였습니다. 그러나 냉전의 종식과 독일의 재통일로, 육군은 급변하는 지구 안보 환경에서 새롭고 다양한 임무 요구에 맞게 스스로를 변혁해야 하는 과제에 직면해 있습니다."
 GER_Deutsche_Bahn_mod_TT: "여기에서 철도 회사 확장의 이점을 확인할 수 있습니다."
 GER_Deutsch_Bahn_mod: "도이체 반"
 GER_breach_of_contract_opinion_I: "최종 정산 한도 정지"
 GER_breach_of_contract_opinion_II: "최종 정산 한도 정지"
 germany.561.t: "§Y허용 한도§!를 초과한 우리 군"
 germany.561.d: "우리는 최종 해결 조약의 조건이 허용하는 최대 병력 수를 초과했습니다. 그 결과 연방의회가 특별 회기를 소집했고, 총리는 이 시급한 문제를 해결할 전략을 논의하기 위해 내각을 소집했습니다."
 germany.561.a: "할 일이 많겠군."
 germany.562.t: "최종 해결 조약 상기"
 germany.562.d: "통일 당시 수립된 §Y독일의 유산§!에 명시된 연방군의 최대 병력 규모 상한선에 가까워지고 있습니다. 계속해서 군비를 증강한다면, 이것이 필연적으로 중대한 국제적 긴장으로 확대될 것을 각오해야 합니다."
 germany.562.a: "알겠다"
 germany.563.t: "우리 대사들을 소환한 이웃 국가들과 조약 상대국들"
 germany.563.d: "우리 외교관들의 부단한 노력에도 불구하고 피해를 막는 데 어려움을 겪었으며, 심지어 일부는 해당 국가에서 추방되었다는 소식을 전해 들었습니다. 이제 우리가 할 수 있는 유일한 방책은 앞으로 상황이 개선되도록 노력하는 것입니다."
 germany.563.a: "젠장"
 germany.564.t: "우리 대사들을 소환한 이웃 국가들과 조약 상대국들"
 germany.564.d: "우리 외교관들이 상황을 효과적으로 진정시켰다는 고무적인 소식이 들어왔습니다. 계속되는 긴장에도 불구하고 그들은 능숙하게 상황을 헤쳐 나가 외교 관계가 그대로 유지되도록 했습니다. 이 성과는 우리 대표들의 헌신과 외교적 수완을 보여 주며, 남아 있는 문제의 협력과 해결에 대한 한 줄기 희망을 제공합니다."
 germany.564.a: "알겠다"
 germany.565.t: "우리 대사들을 소환한 이웃 국가들과 조약 상대국들"
 germany.565.d: "우리 외교관들이 이룬 놀라운 성과에 대한 보고를 받았습니다. 우리가 조약상의 한도를 초과했음에도 불구하고, 그들은 외교적 여파를 거의 눈에 띄지 않을 정도로 억제하는 데 성공했습니다. 이 놀라운 업적은 우리 대표들의 외교적 역량과 전략적 통찰력을 강조하며, 잠재적 여파를 완화하고 우리의 국제 관계에서 안정을 유지했습니다."
 germany.565.a: "멋지군"
 bavaria.1.b: "절대 안 된다!"
 GER_breach_of_contract_opinion_III: "최종 정산 한도 정지"
 GER_agenda_2010: "2010년 의제"
 GER_agenda_2010_desc: "게르하르트 슈뢰더(Gerhard Schröder)는 항상 사회민주주의자들 사이에서 온건파였기 때문에 예산 제한을 옹호했습니다. 'Agenda 2010'은 예산 삭감과 관료적 개혁을 위한 야심찬 프로젝트로, 의심할 바 없이 좌파 집단의 심한 비판을 받고 정부를 중도 방향으로 밀어붙일 것입니다. 그러나 경제 발전을 위해서는 환상적일 수 있습니다."
 GER_strengthen_the_service_sector: "서비스 부문 강화"
 GER_strengthen_the_service_sector_desc: "서독은 1950년대 경제 기적과 루르 지방의 석탄 및 중공업 침체 이후 서비스 경제로의 전환을 완료하였습니다. 그 이후 독일은 젊은 혁신가들에게 친숙한 나라가 되었으며, 베를린은 세계 스타트업 사업의 중심지 중 하나로 자리 잡았습니다."
 GER_european_business_opportunities: "유럽 사업 기회"
 GER_european_business_opportunities_desc: "대륙 전역의 무역 장벽이 제거되면서 모두의 경제적 이익이 늘어나고 있으며, 그중에서도 독일의 이익이 가장 크니 좋은 일입니다. 우리는 관세와 무역 제한을 없애고 사업을 시작하고 거래하기 쉽게 만들기 위해 계속 노력해야 합니다."
 GER_scientific_exchanges: "과학 교류"
 GER_scientific_exchanges_desc: "외국인 전문가들이 쾰른과 베를린 같은 기술 및 스타트업 중심지에서 생활하고 일하기 위해 독일로 몰려들면서 독일의 혁신 역량이 향상되었습니다. 이러한 교류를 보다 공식화하기 위해 독일 연구팀은 외국 동료들과 정기적으로 만나 결과를 연구하고 비교해야 합니다."
 GER_idea_Leopard_Nutzergemeinschaft_desc: "레오파르트 무기 체계와 그 차량 계열의 추가 개발을 공통의 기반 위에 두기 위해, 지원·정비·개발 및 비용을 간소화하고자 레오벤 공동체(LeoBen Gemeinschaft)가 설립되었습니다."
 GER_rammelsberg_mine: "가르츠바일러 산업 재가동"
 GER_rammelsberg_mine_desc: "람멜스베르크 광산은 16세기 초에 설계된 방대한 광산 체계입니다. 이 광산에서는 수 세기 동안 납과 구리 같은 비철금속을 채굴했습니다. 광산 깊은 곳에는 여전히 이러한 금속의 대규모 매장량이 있습니다."
 GER_rammelsberg_mine_expanded: "라우지츠 분지 복구"
 GER_rammelsberg_mine_expanded_desc: "라인 탄전의 가르츠바일러 채굴을 다시 열어 확장합니다. 현대화된 노천 채굴 체계로 이 구상은 노르트라인베스트팔렌의 갈탄 생산을 크게 늘릴 것입니다."
 GER_expand_laboratories: "연구소 확장"
 GER_expand_laboratories_desc: "최근 보건 의료 센터의 건설과 확장에 이어, 연구소를 확장하는 것이 보건 서비스 개혁의 다음 단계입니다."
 GER_ban_the_npd_desc: "새롭고 현대적인 독일로서, 연방의회에 나치즘의 대표가 영원히 존재하지 않도록 보장하는 것은 우리의 책임입니다."
 germany_party.0.t: "AfD의 부상"
 germany_party.0.d: "우리의 유럽 정책에 드는 비용에 대한 불만으로 인해, 국민들의 지지가 유럽 연합에 회의적인 정당들, 예컨대 신생 우파 정당인 £GER_nationalist_right_wing_populist 독일을 위한 대안으로 향하기 시작했습니다. AfD는 EU의 영향력 축소와 규제 완화 및 지출 삭감을 통한 더 강한 국가 경제를 지지합니다. 그러나 당 내부에서는 민족주의 사상에 공감하고 이민과 자유민주주의의 여러 관행에 반대하는 더 급진적인 분파가 힘을 얻고 있습니다. 이 정당은 아직 풍부한 자원을 갖추지 못했지만, 많은 분석가들은 이 정당에 대한 잠재적 지지가 꽤 빠르게 늘어날 수 있다고 말합니다."
 germany_party.0.a: "BfV가 이들을 면밀히 감시할 것이다."
 GER_idea_german_education_reforms: "독일 교육 개혁"
 GER_idea_scientific_exchange: "독일 과학 교류"
 GER_Strategic_partnership: "유라시아 전략 축"
 GER_Strategic_partnership_desc: "독일은 방위 협력, 기술 발전, 지정학적 영향력을 강화하기 위해 주요 유라시아 국가들과 전략적 동반자 관계망을 구축할 것입니다. 우리는 함께 상호 안보를 보장할 강력한 동맹을 만들어 갈 것입니다."
 GER_Form_Adam_Opel_AG: "아담 오펠 AG"
 GER_Form_Adam_Opel_AG_desc: "아담 오펠 AG는 독일 뤼셀스하임에 본사를 둔 독일의 자동차 제조사입니다. 1862년 8월 아담 오펠이 창업하였습니다."
 GER_Split_from_GM: "GM으로부터의 분리"
 GER_Split_from_GM_desc: "2008년 세계 금융 위기와 GM의 챕터 11 구조조정 이후, 2009년 9월 10일 GM은 독일 정부의 승인 아래 마그나 그룹과 스베르뱅크를 포함한 컨소시엄에 오펠 지분 55퍼센트를 매각하기로 합의하였습니다. "
 GER_future_air_rec: "미래 항공 정찰 사업"
 GER_future_air_rec_desc: "우리는 토네이도와 팬텀을 하늘의 눈으로 삼아 임무를 이끌고 영공을 지키면서 여러 세대에 걸쳐 귀중한 교훈을 쌓아 왔습니다. 이 항공기들은 우리 공중 정보, 감시, 정찰 능력의 중추였으며 그 가치를 거듭 입증하였습니다. 그러나 현대전의 양상이 바뀌고 국가 안보의 요구가 더욱 복잡해짐에 따라, 우리가 적응하고 혁신해야 한다는 점은 분명합니다. 이 상징적인 항공기들에서 축적한 지식과 경험은 토대가 되어 주지만, 미래는 최첨단 기술과 첨단 체계를 받아들이는 새로운 접근을 요구합니다. 이 중대한 갈림길에 선 지금, 우리는 우리의 필요를 신중히 평가하고 떠오르는 위협을 검토하며 하늘에서의 지속적인 우위를 보장할 최선의 방책을 정해야 합니다. 지금 내리는 결정이 차세대 제공권을 형성하고 세계 무대에서 우리의 입지를 지켜 줄 것입니다. 이제 우리의 유산 위에 쌓아 올려 과거의 교훈을 반영하면서도 내일의 가능성을 받아들이는 미래의 진로를 그려야 할 때입니다."
 GER_New_Airdefence: "신형 대공 방어 체계"
 GER_New_Airdefence_desc: "우리는 기존 대공 방어 체계를 운용해 온 오랜 세월 속에서 중요한 교훈을 얻었습니다. 이 체계들은 우리 하늘을 지키고 다양한 위협에 대한 견고한 방패를 제공해 왔습니다. 이 체계들은 국가 안보의 초석이었으며 믿을 만한 방호를 제공하고 우리 영공의 안전을 보장해 왔습니다. 그러나 미사일 기술과 드론 능력의 급속한 발전, 그리고 갈수록 정교해지는 공중 위협을 고려하면 우리 방어가 진화해야 한다는 점은 명백합니다. 현재 체계를 운용하며 쌓은 경험은 튼튼한 토대를 마련해 주지만, 미래는 더욱 포괄적이고 진보한 접근을 요구합니다. 공중 도전의 새로운 시대에 맞서면서, 우리는 직면한 위협을 신중히 평가하고 최신 기술 발전을 탐구하며 대공 방어 능력을 높일 가장 효과적인 전략을 정해야 합니다. 오늘 우리가 내리는 결정이 앞으로 수년간 우리나라를 지킬 능력을 규정할 것입니다. 이제 기존의 강점 위에 쌓아 올려 과거의 교훈을 활용해 미래의 도전에 대응하고 갈수록 복잡해지는 세계에서 전략적 우위를 유지할 최첨단 대공 방어 체계를 만들어야 할 때입니다."
 GER_future_projects_MR: "미래 다목적 전투기 사업"
 GER_future_projects_MR_desc: "유로파이터 타이푼을 운용하며 얻은 교훈은 더욱 다재다능하고 능력 있는 항공기의 필요성을 부각하였습니다. 냉전 이후 시대에 위협이 진화하면서, 연방방위군은 차세대 다목적 전투기를 개발할 필요가 있음을 인식하였습니다. 이 새 항공기들은 첨단 스텔스 기술, 향상된 레이더 체계, 최첨단 항전 장비를 매끄럽게 통합해야 합니다. 목표는 공대공 및 공대지 작전 모두에서 우위를 보장하여 다양한 위협에 신속하게 대응할 수 있도록 하는 것입니다. 볼프강 슈나이더한 장군 같은 핵심 인사들의 지휘 아래 연방방위군이 독일의 항공 능력을 미래에 대비시키는 이 구상을 이끌고 있습니다."
 GER_future_projects_CAS: "미래 근접 항공 지원 사업"
 GER_future_projects_CAS_desc: "다양한 평화유지 및 전투 임무에서의 연방방위군 경험은 신뢰할 수 있는 근접 항공 지원(CAS)의 절실한 필요성을 보여 주었습니다. 토네이도 IDS 같은 항공기의 능력을 바탕으로, 연방방위군은 이제 차세대 CAS 플랫폼에 집중하고 있습니다. 이 미래 항공기들은 첨단 표적 지정 체계로 강화된 정밀 화력과 현대적 위협에 대한 견고한 방호를 갖추어야 합니다. 목표는 복잡한 작전 환경에서 신속하고 결정적인 행동을 보장하면서 지상군에게 비할 데 없는 지원을 제공하는 것입니다. 이 개발은 독일이 변화하는 전쟁의 성격에 적응하는 데 매우 중요하며, 에어버스 같은 방위 산업 파트너들의 핵심적인 지원을 받고 있습니다."
 GER_Specialiced_forces: "특수 부대 육성"
 GER_Specialiced_forces_desc: "세계 안보 지형의 변화는 고도로 훈련되고 다재다능한 특수 부대의 중요성을 부각하였습니다. 연방방위군은 새로운 도전에 대응하기 위해 특수전사령부(KSK)를 비롯한 정예 부대를 확충하고 있습니다. 이 구상에는 대테러, 정찰, 직접 행동 임무에 대비하도록 설계된 엄격한 훈련 프로그램, 최첨단 장비, 향상된 작전 전술이 포함됩니다. 특수 부대 육성은 최우선 과제이며, 독일이 전 세계의 비대칭 위협에 효과적으로 대응할 수 있도록 한스-페터 폰 키르히바흐 장군 같은 지도자들이 지원하고 있습니다."
 GER_New_attach_Helo: "신형 공격 헬리콥터"
 GER_New_attach_Helo_desc: "유로콥터 티거를 배치하며 얻은 경험은 현대 분쟁에서 공격 헬리콥터가 맡는 핵심적인 역할을 입증하였습니다. 연방방위군은 이제 정밀 유도 무장, 향상된 표적 지정 체계, 견고한 방어 능력을 갖춘 첨단 회전익기의 획득에 집중하고 있습니다. 이 새 헬리콥터들은 필수적인 근접 항공 지원과 대전차 능력을 제공하여 독일 지상군이 전장을 지배하는 데 필요한 공중 화력을 갖추도록 보장할 것입니다. 이 현대화 사업은 연방 국방부의 감독 아래 에어버스 헬리콥터스 같은 산업계 파트너들의 핵심적인 기여로 진행되고 있습니다."
 GER_New_drones: "신형 드론 기술"
 GER_New_drones_desc: "연방방위군은 감시와 전투 임무 모두에서 무인 항공 체계(UAS)의 중요성이 커지고 있음을 인식하였습니다. 이전 드론 사업의 성공을 바탕으로, 독일은 이제 향상된 정찰, 정밀 타격, 전자전을 위해 설계된 차세대 드론에 투자하고 있습니다. 이 드론들은 첨단 센서, 실시간 데이터 전송 능력, 자율 작전 기능을 갖추게 될 것입니다. 하랄트 쿠야트 장군과 같은 인사들이 이끄는 이 구상은 연방방위군이 군사 작전의 기술 혁신 최전선에 계속 머물도록 하는 것을 목표로 합니다."
 GER_New_transport_Helo: "신형 수송 헬리콥터"
 GER_New_transport_Helo_desc: "병력의 기동성과 군수 지원을 개선하기 위해 연방방위군은 신형 수송 헬리콥터의 획득을 우선시하고 있습니다. 이 첨단 헬리콥터들은 다양한 작전 환경에서 신속한 병력 전개, 의무 후송, 화물 수송을 수행하도록 설계될 것입니다. 이 구상은 CH-53 같은 구형 기종을 더 능력 있고 신뢰할 수 있는 플랫폼으로 교체하는 데 중점을 둡니다. 공군은 육군항공대와 협력하여 이 노력의 중심에 있으며, 독일군이 국내외 임무 모두에서 효과적으로 작전할 수 있도록 보장합니다."
 GER_plan_the_programm: "사업 계획 수립"
 GER_plan_the_programm_desc: "전략 계획은 연방방위군 현대화 노력의 초석이 되었습니다. 이 사업은 현재 능력에 대한 포괄적 검토, 미래 수요의 식별, 신기술에 대한 상세한 획득 및 통합 계획의 수립을 포함합니다. 목표는 떠오르는 세계적 위협에 대응할 수 있는 잘 조율되고 미래 지향적인 군대를 만드는 것입니다. 이 계획 수립 과정은 연방방위군 참모부가 주도하며 선도적인 방위 전문가와 산업계 파트너의 의견을 반영하여, 독일이 21세기 전쟁의 복잡성에 대비하도록 보장합니다."
 GER_Future_Attach_helo: "미래 공격 헬리콥터"
 GER_Future_Attach_helo_desc: "미래를 내다보며 연방방위군은 차세대 공격 헬리콥터 개발에 집중하고 있습니다. 이 미래 플랫폼들은 최첨단 스텔스 기능, 첨단 항전 장비, 고정밀 무기 체계를 갖추게 될 것입니다. 목표는 고강도 분쟁에서 육군이 근접 항공 지원과 대전차 능력을 제공하는 역량을 높이는 것입니다. 이 개발은 연방방위군 지도부가 면밀히 감독하며 연구 기관과 방위 계약업체의 상당한 의견을 반영하여, 독일이 회전익 항공 분야에서 기술적 우위를 유지하도록 보장합니다."
 GER_existing_Helo: "기존 헬리콥터 개량"
 GER_existing_Helo_desc: "연방방위군은 현재 헬리콥터 전력의 운용 수명을 연장하고 능력을 높이기 위해 포괄적인 개량 사업을 추진하고 있습니다. 이 구상에는 NH90과 CH-53 같은 헬리콥터의 항전 장비, 무기 체계, 엔진 성능의 현대화가 포함됩니다. 이 개량은 병력 수송에서 수색 구조 작전에 이르기까지 이 항공기들이 연방방위군의 임무 요구를 충족하는 데 계속 효과적이도록 보장하기 위해 설계되었습니다. 개량은 육군청이 선도적인 항공우주 기업들과 협력하여 조율하며, 전력이 신뢰할 수 있고 전투 준비가 된 상태를 유지하도록 보장합니다."
 GER_Future_transport_helo: "미래 수송 헬리콥터"
 GER_Future_transport_helo_desc: "미래의 작전 수요를 예상하여 연방방위군은 신형 수송 헬리콥터 개발에 투자하고 있습니다. 이 항공기들은 병력 기동성, 군수 지원, 신속 전개 능력을 높이도록 설계될 것입니다. 밀집한 도심 지역에서 외딴 전장에 이르기까지 광범위한 환경에서 작전할 수 있는 헬리콥터를 만드는 데 중점을 둡니다. 이 구상은 연방방위군의 폭넓은 현대화 전략의 핵심 부분으로, 독일군이 변화하는 세계적 위협 앞에서 민첩하고 신속하게 대응할 수 있도록 보장합니다."
 GER_Invest_in_Universitat_der_Bundeswehr_Hamburg: "함부르크 연방방위군 대학 투자"
 GER_Invest_in_Universitat_der_Bundeswehr_Hamburg_desc: "군사 교육에서 학문적 우수성이 갖는 중요성을 인식하여, 연방방위군은 함부르크 연방방위군 대학(Universität der Bundeswehr Hamburg)에 상당한 투자를 하고 있습니다. 이 구상은 연구 시설의 확충, 교육 프로그램의 강화, 방위학 분야의 혁신 촉진에 중점을 둡니다. 이 대학은 미래의 군 지도자를 양성하고 국가 안보에 필수적인 분야의 연구를 발전시키는 데 중대한 역할을 합니다. 이 투자는 이 대학이 21세기의 복잡한 도전에 대응할 수 있는 군사 교육의 선도 기관으로 남도록 보장하는 것을 목표로 합니다."
 GER_cooperation_in_education: "군사 교육 협력"
 GER_cooperation_in_education_desc: "연방방위군은 군사 교육을 강화하기 위해 다른 군사 학교, 대학, 국제 파트너와의 협력을 우선시하고 있습니다. 이 구상은 지식 교류, 공동 연구, 합동 훈련 프로그램을 촉진할 제휴를 구축하고자 합니다. NATO 국방대학과 영국 왕립 샌드허스트 육군사관학교 같은 기관과 협력함으로써, 연방방위군은 장교들의 시야를 넓히고 교육 프로그램을 풍부하게 하는 것을 목표로 합니다. 이러한 협력적 접근은 독일 군 지도자들이 다국적 환경에서 효과적으로 작전할 수 있도록 준비시키는 데 필수적입니다."
 GER_AFV_projects: "장갑 전투 차량 사업"
 GER_AFV_projects_desc: "연방방위군은 차세대 장갑 전투 차량(AFV) 개발을 목표로 하는 일련의 사업을 주도하고 있습니다. 이 사업에는 푸마 보병전투차량 같은 기존 플랫폼의 개량과, 첨단 장갑 방호, 기동성, 화력을 갖춘 신형 차량의 개발이 포함됩니다. 도시전에서 개활지 전장에 이르기까지 다양한 전투 환경에서 독일 기갑 부대가 효과적으로 작전할 수 있도록 보장하는 데 중점을 둡니다. 연방방위군의 AFV 사업은 라인메탈과 크라우스마파이 베그만 같은 업계 선두 기업들의 핵심적인 기여 속에서 지상군의 효율성과 생존성을 유지하는 데 중추적입니다."
 GER_choose_optics: "장갑 차량 광학 장비 선정"
 GER_choose_optics_desc: "연방방위군은 전장 인식과 표적 지정의 정확도를 높이기 위해 장갑 차량용 첨단 광학 체계의 선정을 우선시하고 있습니다. 이 구상은 레오파르트 2와 푸마 보병전투차량 같은 플랫폼에 통합할 열영상, 야간 투시, 레이저 거리 측정기를 포함한 최첨단 광학 기술을 평가하는 일입니다. 기갑 부대에 뛰어난 광학 장비를 갖춤으로써 연방방위군은 표적 포착을 개선하고, 교전 사거리를 늘리며, 전반적인 전투 효율을 높이고자 합니다. 이 체계들의 통합은 연방방위군 현대화 전략의 핵심 요소입니다."
 GER_choose_C4ISR: "C4ISR 체계 선정"
 GER_choose_C4ISR_desc: "현대전의 복잡성이 커지는 데 대응하여 연방방위군은 첨단 C4ISR(지휘, 통제, 통신, 컴퓨터, 정보, 감시, 정찰) 체계에 투자하고 있습니다. 이 구상은 전술 부대에서 전략 사령부에 이르기까지 군사 작전의 모든 수준에 이러한 기술을 통합하는 데 중점을 둡니다. 정보를 수집하고 처리하는 연방방위군의 능력을 높이고, 전장 통신을 개선하며, 의사 결정을 간소화함으로써 C4ISR 체계는 작전의 효율성과 효과를 크게 끌어올릴 것입니다. 이 체계의 도입은 끊임없이 진화하는 세계 안보 환경에서 기술적 우위를 유지하려는 연방방위군의 의지를 보여 줍니다."
 GER_choose_engine: "엔진 기술 선정"
 GER_choose_engine_desc: "연방방위군은 미래의 군용 차량과 장비를 움직일 첨단 엔진 기술의 선정에 집중하고 있습니다. 이 구상은 더 높은 신뢰성, 줄어든 정비, 향상된 운용 효율을 제공하는 고성능 연료 절감형 엔진을 평가하는 일입니다. 이 엔진들은 레오파르트 2 전차와 각종 장갑 병력 수송차를 포함한 다양한 플랫폼에 통합될 것입니다. 최첨단 엔진의 선정은 가혹한 사막에서 밀집한 도심 지역에 이르기까지 다양한 환경에서 연방방위군의 차량이 효과적으로 작전할 수 있도록 보장하는 데 매우 중요합니다."
 GER_choose_electronic: "전자 체계 선정"
 GER_choose_electronic_desc: "연방방위군은 군 플랫폼 전반에 최첨단 전자 체계를 통합하여 현대화 노력을 진전시키고 있습니다. 이 구상은 통신 체계, 항법 장치, 전자전 기술을 포함한 첨단 전자 장비를 선정하고 도입하는 데 중점을 둡니다. 이 체계들은 연방방위군 장비의 기능성, 신뢰성, 전투 효율을 높일 것입니다. 목표는 장갑 차량에서 항공기에 이르기까지 모든 군 플랫폼에 사용 가능한 가장 진보하고 견고한 전자 체계를 갖추어, 연방방위군이 현장에서 작전 우위를 유지할 수 있게 하는 것입니다."
 GER_Start_Tank_Programms: "전차 사업 착수"
 GER_Start_Tank_Programms_desc: "기갑 전력이 현대전의 최전선에 계속 머물도록 보장하기 위해 연방방위군은 차세대 주력 전차 개발을 목표로 하는 신규 전차 사업에 착수하고 있습니다. 이 사업들은 레오파르트 2의 성공을 바탕으로 하여 떠오르는 위협에 맞설 첨단 장갑, 무장, 방어 체계를 도입할 것입니다. 이 구상에는 이러한 첨단 플랫폼을 지원할 새로운 훈련 및 정비 절차의 개발도 포함됩니다. 이 전차 사업에 투자함으로써 연방방위군은 세계에서 가장 유능하고 강력한 기갑 부대를 운용한다는 명성을 유지하고자 합니다."
 GER_Start_APC_Programms: "장갑 병력 수송차 사업 착수"
 GER_Start_APC_Programms_desc: "연방방위군은 전투 지역에서 보병 부대를 보호하고 수송하도록 설계된 첨단 장갑 병력 수송차(APC)를 개발하는 신규 사업에 착수하고 있습니다. 이 신형 APC는 향상된 방호, 기동성, 화력을 갖추어 독일 병사들이 고위험 환경에서 효과적으로 작전할 수 있도록 보장할 것입니다. 이 차량의 개발은 지상군에 가능한 최고의 방호와 작전 지원을 제공하려는 연방방위군의 폭넓은 현대화 전략의 핵심 요소입니다. 신형 APC는 구형 모델을 대체하며 최신 군사 기술의 발전에 걸맞은 향상된 능력을 제공할 것입니다."
 GER_Start_IFV_Programms: "보병전투차량 사업 착수"
 GER_Start_IFV_Programms_desc: "연방방위군은 차세대 보병전투차량(IFV)을 개발하는 신규 사업에 착수하고 있습니다. 이 사업들은 IFV의 화력, 방호, 기동성을 높이는 데 중점을 두어, 가장 가혹한 전투 환경에서도 보병 작전을 지원할 수 있도록 보장합니다. 신형 차량에는 능동 방호 체계, 개선된 센서, 네트워크 통신 체계 같은 첨단 기술이 도입될 것입니다. 최첨단 IFV를 개발하려는 연방방위군의 의지는 현대전의 도전에 대응할 수 있는 고도로 유능하고 효과적인 지상 전투 전력을 유지하려는 헌신을 보여 줍니다."
 GER_Update_SAM: "지대공 미사일(SAM) 개량"
 GER_Update_SAM_desc: "변화하는 공중 위협 지형에 대응하여 연방방위군은 지대공 미사일(SAM) 체계를 개량하고 있습니다. 이 구상은 패트리어트 미사일 체계와 같은 기존 SAM 플랫폼의 정확도, 사거리, 효율을 높이는 신기술의 통합에 중점을 둡니다. 이 개량은 연방방위군이 재래식 항공기에서 현대적 드론과 탄도 미사일에 이르는 광범위한 공중 위협에 효과적으로 방어할 수 있도록 보장할 것입니다. SAM 체계의 현대화는 영공 안보를 유지하고 새로운 도전 앞에서도 독일의 대공 방어가 견고하고 유능하게 유지되도록 보장하는 데 매우 중요합니다."
 GER_Update_Mobile_Airdefense: "기동 대공 방어 체계 개량"
 GER_Update_Mobile_Airdefense_desc: "연방방위군은 기동 대공 방어 체계의 현장 기동성, 효율, 회복력을 높이기 위해 그 현대화를 우선시하고 있습니다. 이 구상에는 기존 플랫폼에 첨단 레이더, 표적 지정, 미사일 체계를 갖추어 저공비행 항공기와 드론을 포함한 광범위한 공중 위협에 대응할 수 있도록 개량하는 일이 포함됩니다. 이 개량은 기동 대공 방어 부대가 국내 작전과 해외 파병 모두에서 지상군에 유연하고 신속한 방호를 제공할 수 있게 할 것입니다. 이 현대화 노력은 포괄적인 대공 방어 능력을 유지하려는 연방방위군의 폭넓은 전략의 핵심 요소입니다."
 GER_New_heavy_Plain: "신형 대형 수송기"
 GER_New_heavy_Plain_desc: "전략 공수와 장거리 작전 능력을 높이기 위해 연방방위군은 신형 대형 항공기에 투자하고 있습니다. 에어버스 A400M과 같은 이 항공기들은 국내외 임무를 지원하기 위해 병력, 장비, 물자를 장거리로 수송하도록 설계되었습니다. 신형 항공기에는 분쟁 공역에서의 생존성을 보장하기 위해 첨단 항전 장비와 방어 체계도 갖추어질 것입니다. 이 투자는 연방방위군이 전 세계로 전력을 투사하고, 신속한 인도적 지원을 제공하며, 다양한 작전 시나리오에서 연합 작전을 지원할 수 있도록 보장하는 데 매우 중요합니다."
 GER_Inrease_capability: "능력 증대"
 GER_Inrease_capability_desc: "연방방위군은 새로운 도전 앞에서 준비태세, 효율, 적응력을 높이는 데 중점을 두고 전반적인 군사 능력을 증대하기 위한 포괄적인 노력을 기울이고 있습니다. 이 구상에는 장비의 개선, 훈련 프로그램의 정비, 작전 효율을 높이기 위한 지휘 통제 구조의 최적화가 포함됩니다. 목표는 재래식 군사 위협이든, 비대칭 분쟁이든, 인도적 재난이든 어떠한 위기에도 연방방위군이 신속하고 효과적으로 대응할 수 있도록 하는 것입니다. 능력을 증대함으로써 연방방위군은 세계 안보의 핵심 주체로 남고 국내외에서 독일의 이익을 지킬 능력을 유지하고자 합니다."
 GER_Reorganise_marine_infanterie: "해병 보병 재편"
 GER_Reorganise_marine_infanterie_desc: "해양 위협의 변화하는 성격에 대응하여 연방방위군은 해병 보병 부대의 작전 효율과 준비태세를 개선하기 위해 이를 재편하고 있습니다. 이 재편은 더 큰 유연성을 위한 부대 구조 개편, 상륙 능력의 강화, 연안 및 해안 작전을 지원하는 신기술의 통합을 포함합니다. 에켄푀르데 같은 곳에 주둔하는 연방방위군의 해병 보병은 신속 대응 임무를 수행하고, 핵심 해양 기반시설을 방호하며, 국제 작전을 지원할 장비를 더 잘 갖추게 될 것입니다. 이 재편은 독일의 해병 보병이 현대 해상전의 도전에 효과적으로 대응할 수 있도록 보장하는 데 매우 중요합니다."
 GER_Reorganize_strike_groupe: "타격 전단 재편"
 GER_Reorganize_strike_groupe_desc: "연방방위군은 전투 효율과 작전 유연성을 높이기 위해 타격 전단을 재편하고 있습니다. 이 구상은 신속 전개, 정밀 타격, 적대적 환경에서의 지속 작전을 위한 능력을 최적화하도록 부대 구조를 개편하는 일을 포함합니다. 이 재편에는 복잡한 임무의 조율과 수행을 개선하는 신기술과 전술도 도입될 것입니다. 타격 전단을 재편함으로써 연방방위군은 고강도 분쟁에서 평화유지 임무에 이르기까지 광범위한 군사 작전에서 결정적인 전력을 투입할 수 있는 능력을 유지하고자 합니다."
 GER_Improve_naval_logistics: "해군 군수 개선"
 GER_Improve_naval_logistics_desc: "지속적인 해양 작전의 중요성을 인식하여 연방방위군은 해군 군수 능력을 개선하고 있습니다. 이 구상은 보급망 관리의 강화, 군수 지원 함정의 개량, 작전을 간소화하는 신기술의 통합에 중점을 둡니다. 해군 전력이 필요한 물자, 연료, 장비를 충분히 지원받도록 보장함으로써, 연방방위군은 핵심 해양 지역에서의 지속적인 주둔을 유지하고 해군 임무를 효과적으로 지원할 수 있습니다. 해군 군수의 개선은 장기 작전을 지속하고 독일 해양 전력의 준비태세를 보장하는 데 필수적입니다."
 GER_Homewater_intervention: "근해 개입"
 GER_Homewater_intervention_desc: "연방방위군은 독일 영해의 안전을 보장하기 위한 근해 개입 능력을 개발하고 있습니다. 이 구상은 해상 감시의 강화, 해안 방어의 보강, 국내 해역에서 발생하는 사건에 대한 신속 대응 전략의 준비를 포함합니다. 근해 개입에 대한 연방방위군의 집중은 핵심 해양 기반시설을 보호하고, 불법 활동을 방지하며, 독일의 배타적 경제수역(EEZ) 내 어떤 안보 위협에도 신속히 대응하도록 설계되었습니다. 이러한 능력을 강화함으로써 연방방위군은 독일의 해양 이익을 지키고 해안 지역에 대한 통제를 유지하고자 합니다."
 GER_Improve_mine_warfare: "기뢰전 능력 개선"
 GER_Improve_mine_warfare_desc: "기뢰가 가하는 지속적인 위협을 고려하여 연방방위군은 기뢰전 능력을 강화하고 있습니다. 이 구상에는 새로운 기뢰 탐지 및 제거 기술의 개발, 기뢰전 부대의 훈련 개선, 기뢰 대응을 위한 첨단 무인 체계의 통합이 포함됩니다. 기뢰전 능력을 개선하려는 연방방위군의 노력은 해군 작전의 안전을 보장하고, 핵심 해상 교통로를 보호하며, 분쟁 해역에서 항행의 자유를 유지하는 데 매우 중요합니다. 이 분야에 집중함으로써 연방방위군은 수중 기뢰가 초래하는 위험을 줄이고 해군 전력의 안전을 보장하고자 합니다."
 GER_coasteal_and_shallow_sea_defense: "연안 및 천해 방어"
 GER_coasteal_and_shallow_sea_defense_desc: "연방방위군은 독일 연안 지역을 보호하기 위해 연안 및 천해 방어 능력을 강화하고 있습니다. 이 구상은 연안 감시의 강화, 천해 작전용 특수 함정의 배치, 해안 방어 체계의 개량을 포함합니다. 국가 안보와 경제 안정에 필수적인 이 핵심 지역의 잠재적 위협을 연방방위군이 효과적으로 감시하고 방어할 수 있도록 보장하는 데 중점을 둡니다. 연안 및 천해 방어를 강화함으로써 연방방위군은 해상 국경에 대한 통제를 유지하고 이 전략적으로 중요한 지역에서 독일의 이익을 지키고자 합니다."
 GER_joint_operation_ability: "합동 작전 능력"
 GER_joint_operation_ability_desc: "다국적 임무에서의 효율을 높이기 위해 연방방위군은 합동 작전 능력을 개선하고 있습니다. 이 구상은 동맹군과의 상호 운용성 증대, 합동 훈련 연습의 개발, 다국적 지휘 구조의 통합에 중점을 둡니다. NATO 및 기타 국제 파트너와의 긴밀한 협력을 도모함으로써 연방방위군은 합동 작전에서 매끄럽게 작전하는 능력을 개선하고 집단 방위 노력에 효과적으로 기여하고자 합니다. 합동 작전 능력에 대한 이러한 집중은 세계 안보 구상에서 연방방위군이 믿음직하고 유능한 파트너로서의 역할을 유지하는 데 매우 중요합니다."
 GER_Rapid_deployment_doctrine_force: "신속 전개 교리 부대"
 GER_Rapid_deployment_doctrine_force_desc: "연방방위군은 새롭게 발생하는 위기에 신속히 대응하는 능력을 높이기 위해 신속 전개 교리 부대를 개발하고 있습니다. 이 구상은 세계 분쟁 지역으로의 신속한 동원과 전개를 위해 훈련되고 장비를 갖춘 특수 부대를 창설하는 일입니다. 신속 전개 부대는 인도적 지원에서 고강도 전투에 이르기까지 광범위한 작전을 수행할 수 있어, 연방방위군이 신속하고 효과적으로 전력과 영향력을 투사할 수 있도록 보장합니다. 이 교리는 21세기의 예측하기 어려운 안보 환경에 대처하려는 독일 전략의 핵심 요소입니다."
 GER_Coastal_ships: "연안 함정"
 GER_Coastal_ships_desc: "연방방위군은 독일 연안 지역의 해양 안보와 방어 능력을 강화하기 위해 연안 함정 전력을 확충하고 있습니다. 천해 작전을 위해 설계된 이 함정들은 해양 위협에 대한 효과적인 감시와 대응을 보장하도록 첨단 센서, 무기, 통신 체계를 갖추게 될 것입니다. 연안 함정의 배치는 독일의 해양 이익을 보호하고, 핵심 기반시설을 보호하며, 영해에 대한 통제를 유지하려는 더 폭넓은 노력의 일부입니다. 이 함정들은 연안 지역에서 국가 방위와 국제 임무를 모두 지원하는 데 중대한 역할을 할 것입니다."
 GER_Hit_and_run: "치고 빠지기 전술"
 GER_Hit_and_run_desc: "연방방위군은 비대칭전과 대반란 작전의 교훈을 바탕으로 치고 빠지기 전술을 포함하도록 작전 교리를 다듬고 있습니다. 이 전술은 장기 교전을 피하기 위해 고가치 표적에 대한 신속하고 결정적인 타격 후 신속히 철수하는 것을 강조합니다. 이 접근은 적의 작전을 교란하고, 적의 능력을 약화하며, 독일군이 반격에 노출되는 것을 최소화하도록 설계되었습니다. 치고 빠지기 전술을 도입함으로써 연방방위군은 전통적 방법이 덜 효과적일 수 있는 환경에서 작전 유연성과 효율을 높이고자 합니다."
 GER_Found_interbranch_command_center: "군종 간 지휘 센터 설립"
 GER_Found_interbranch_command_center_desc: "군 병과 간의 조율을 강화하기 위해 연방방위군은 새로운 군종 간 지휘 센터를 설립하고 있습니다. 포츠담 같은 전략적 요충지에 위치할 것으로 보이는 이 시설은 지휘 통제 기능을 중앙집중화하여 합동 작전의 보다 통합적이고 효과적인 계획 수립과 수행을 가능하게 할 것입니다. 이 센터는 첨단 통신 및 데이터 공유 기술을 갖추어 육군, 해군, 공군 간의 매끄러운 조율을 가능하게 할 것입니다. 이 구상은 복잡한 다영역 환경에서 작전 효율과 대응성을 개선하려는 연방방위군의 의지를 보여 줍니다."
 GER_Cyber_warfare_defence: "사이버전 방어"
 GER_Cyber_warfare_defence_desc: "사이버 공격의 위협이 커지고 있음을 인식하여 연방방위군은 견고한 사이버전 방어 능력의 개발을 우선시하고 있습니다. 이 구상은 사이버 위협으로부터 군 네트워크와 핵심 기반시설을 보호하는 임무를 맡은 전담 사이버 방어 부대의 창설을 포함합니다. 이 부대들은 최첨단 사이버 보안 도구를 갖추고 고급 방어 전술을 훈련받게 될 것입니다. 점점 더 디지털화되는 세계에서 독일의 국가 안보를 지키기 위해 연방방위군 디지털 자산의 회복력과 무결성을 보장하는 데 중점을 둡니다."
 GER_Interbranch_wargames: "군종 간 워게임"
 GER_Interbranch_wargames_desc: "합동 작전 능력을 높이기 위해 연방방위군은 포괄적인 군종 간 워게임을 실시하고 있습니다. 이 연습은 육군, 해군, 공군은 물론 군수 및 사이버전 부대 같은 기타 핵심 요소 간의 긴밀한 조율이 필요한 복잡한 시나리오를 모의할 것입니다. 이러한 워게임에 정기적으로 참여함으로써 연방방위군은 합동 교리를 다듬고, 상호 운용성을 높이며, 현대전의 다면적 도전에 대비하여 군을 준비시키고자 합니다. 이 연습에서 얻은 교훈은 미래 군사 전략을 형성하는 데 중요한 역할을 할 것입니다."
 GER_LOgistic_and_Supplyvhain_optimize: "군수 및 보급망 최적화"
 GER_LOgistic_and_Supplyvhain_optimize_desc: "작전 준비태세를 뒷받침하기 위해 연방방위군은 군수와 보급망의 최적화에 집중하고 있습니다. 이 구상에는 첨단 보급망 관리 체계의 통합, 개선된 재고 추적, 적시 조달(JIT) 군수 방식의 채택이 포함됩니다. 목표는 국내든 해외든 장기 작전 중에 연방방위군이 병력을 효과적으로 유지할 수 있도록 보장하는 것입니다. 군수를 간소화함으로써 연방방위군은 신속 전개와 지속적인 군사 교전의 요구를 충족하는 데 더 유리한 위치에 서게 될 것입니다."
 GER_naval_realtime_data_sharing: "해군 실시간 데이터 공유"
 GER_naval_realtime_data_sharing_desc: "연방방위군은 해군 전력 전반에 첨단 실시간 데이터 공유 체계를 도입하고 있습니다. 이 구상은 함정, 잠수함, 해상 초계기 간의 매끄러운 정보 교환을 가능하게 하여 상황 인식과 작전 조율을 높이는 데 중점을 둡니다. 새로운 체계는 더 빠른 의사 결정과 떠오르는 위협에 대한 보다 효과적인 대응을 가능하게 할 것입니다. 데이터 공유 능력을 개선함으로써 연방방위군의 해군 전력은 네트워크 중심전 환경에서 작전할 장비를 더 잘 갖추어 해상 작전에서의 우위를 보장하게 될 것입니다."
 GER_satelite_surveillance_system: "위성 감시 체계"
 GER_satelite_surveillance_system_desc: "연방방위군은 전략 정찰과 상황 인식을 개선하기 위해 위성 감시 능력을 강화하고 있습니다. 이 구상은 고해상도 영상과 첨단 감시 기술을 갖춘 신규 위성의 배치를 포함합니다. 이 위성들은 세계 분쟁 지역에 대한 실시간 정보를 제공하여 연방방위군이 잠재적 위협을 감시하고 정확하고 시의적절한 정보로 군사 작전을 지원할 수 있도록 할 것입니다. 위성 감시의 확대는 세계 안보 환경에 대한 포괄적인 전체 상을 유지하는 데 매우 중요합니다."
 GER_Develope_Join_operation_Doctrine_I: "합동 작전 교리 개발 I"
 GER_Develope_Join_operation_Doctrine_I_desc: "통합 군사 작전의 필요성이 커지는 데 대응하여 연방방위군은 합동 작전 교리를 개발하고 있습니다. 이 구상의 첫 단계에서는 여러 군 병과에 걸친 합동 작전 수행을 위한 기본 원칙과 전략을 확립할 것입니다. 이 교리는 복잡한 작전 환경에서 전투 효율을 극대화하기 위해 상호 운용성, 통합 지휘 구조, 조율된 전술을 강조할 것입니다. 이 개발은 연방방위군이 국내군 및 동맹군과 매끄럽고 효과적인 합동 작전을 수행할 수 있도록 보장하는 핵심 단계입니다."
 GER_Expand_Sea_patroles: "해상 순찰 확대"
 GER_Expand_Sea_patroles_desc: "해양 안보를 강화하기 위해 연방방위군은 해상 순찰 작전을 확대하고 있습니다. 이 구상에는 자국 해역과 국제 해역 모두에서 순찰의 빈도와 범위를 늘리는 일이 포함됩니다. 이 확대에는 최첨단 센서와 통신 체계를 갖춘 첨단 순찰함의 배치가 수반될 것입니다. 목표는 해적 행위, 밀수, 무단 침입을 포함한 해양 위협을 탐지하고 대응하는 연방방위군의 능력을 높이는 것입니다. 해상 순찰을 확대함으로써 연방방위군은 안전한 해양 환경을 유지하고 국제법을 준수하고자 합니다."
 GER_Advanced_navy_training_I: "고급 해군 훈련 I"
 GER_Advanced_navy_training_I_desc: "연방방위군은 해군 인원의 전술 및 작전 기량을 높이는 데 중점을 둔 해군 전력용 고급 훈련 프로그램에 착수하고 있습니다. 이 훈련의 첫 단계는 대잠전, 함포 사격, 상륙 작전 같은 핵심 분야를 다룰 것입니다. 훈련은 모의 기술과 실제 연습을 모두 활용하여 킬 해군 기지(Marinestützpunkt Kiel) 같은 전문 시설에서 실시될 것입니다. 이 고급 훈련은 연방방위군의 해군 전력이 원양 교전에서 연안 전투에 이르기까지 현대 해상 작전의 도전에 대응할 준비를 갖추도록 하기 위해 설계되었습니다."
 GER_high_seas_warfare_training: "원양 해전 훈련"
 GER_high_seas_warfare_training_desc: "외양 환경에서의 작전에 대비하기 위해 연방방위군은 원양 해전 훈련을 강화하고 있습니다. 이 프로그램은 항모 타격 작전, 함대 기동, 장거리 미사일 타격을 포함한 대규모 해전 수행에 필요한 기량을 연마하는 데 중점을 둡니다. 훈련은 또한 군수와 지구력을 강조하여 연방방위군의 해군 전력이 장기간에 걸쳐 작전을 지속할 수 있도록 보장할 것입니다. 원양 해전 훈련을 우선시함으로써 연방방위군은 먼 해양 전구에서 전력을 투사하고 국가 이익을 지킬 준비태세를 보장하고 있습니다."
 GER_Develope_Join_operation_Doctrine_II: "합동 작전 교리 개발 II"
 GER_Develope_Join_operation_Doctrine_II_desc: "초기 단계를 바탕으로 연방방위군은 합동 작전 교리를 한 단계 더 발전시키고 있습니다. 이 두 번째 단계는 이전의 합동 연습과 작전 경험에서 얻은 통찰을 바탕으로 교리를 다듬고 확장하는 데 중점을 둡니다. 개정된 교리는 합동 작전의 효율을 높이기 위해 네트워크전 능력과 통합 군수 같은 신기술을 도입할 것입니다. 목표는 현대전의 역동적인 도전에 대응할 수 있는 유연하고 적응력 있는 체계를 만들어, 연방방위군의 모든 병과가 일체성 있고 동기화된 방식으로 작전할 수 있도록 보장하는 것입니다."
 GER_Expand_Coast_and_riverin_patroles: "연안 및 하천 순찰 확대"
 GER_Expand_Coast_and_riverin_patroles_desc: "연방방위군은 순찰 능력을 연안 해역과 내륙 수로 모두로 넓히고 있습니다. 이 확대는 독일의 광대한 해안선과 주요 하천을 따라 순찰 부대의 주둔을 늘려 이 핵심 지역의 감시와 안보를 강화하는 데 중점을 둡니다. 이 구상에서는 밀수나 불법 어업 같은 잠재적 위협을 탐지하고 대응하기 위해 특수 함정이 배치되고 첨단 감시 체계가 통합될 것입니다. 이러한 순찰을 확대함으로써 연방방위군은 해양 및 하천 영역을 확보하여 국가와 지역의 안보에 기여하고자 합니다."
 GER_Advanced_navy_training_II: "고급 해군 훈련 II"
 GER_Advanced_navy_training_II_desc: "연방방위군이 해군 전력의 현대화를 계속함에 따라 고급 해군 훈련 프로그램의 두 번째 단계가 시행되고 있습니다. 이 단계는 NATO 동맹국과의 합동 작전과 대규모 상륙 강습 같은 더 복잡하고 현실적인 시나리오를 도입하여 초기 훈련을 한층 발전시킵니다. 훈련은 전자전, 대공 방어, 고급 잠수함 전술을 포함한 현대전 기법에서 해군 장교와 승조원의 능력을 높이는 데 중점을 둘 것입니다. 해군 전력의 기량을 심화함으로써 연방방위군은 광범위한 해양 도전에 대한 준비태세를 보장합니다."
 GER_littoral_and_Riverin_warfare_training: "연안 및 하천전 훈련"
 GER_littoral_and_Riverin_warfare_training_desc: "천해와 하천 환경의 전략적 중요성을 인식하여 연방방위군은 연안전 및 하천전을 포함하도록 훈련 프로그램을 확대하고 있습니다. 이 훈련은 해군과 지상군이 긴밀히 협력해야 하는 해안 지역, 하천, 하구에서의 작전에 중점을 둡니다. 여기에는 소형 고기동 함정과 상륙 부대의 운용 숙달은 물론 감시 및 정찰을 위한 무인 체계의 통합도 포함됩니다. 연방방위군은 전통적인 해군 전략이 통하지 않을 수 있는 이러한 복잡한 환경에서 효과적으로 작전하기 위한 전문 능력을 개발하고자 합니다."
 GER_fight_simulation_center: "전투 시뮬레이션 센터 설립"
 GER_fight_simulation_center_desc: "병력의 훈련과 준비태세를 높이기 위해 연방방위군은 최첨단 전투 시뮬레이션 센터를 설립하고 있습니다. 이 시설은 첨단 가상현실 및 시뮬레이션 기술을 사용하여 훈련용 현실적인 전투 시나리오를 만들어 낼 것입니다. 육군, 해군, 공군 장병은 통제된 환경에서 기량을 연마하여 실전의 위험 없이 현대전의 복잡성을 경험할 수 있습니다. 전투 시뮬레이션 센터는 연방방위군 훈련 프로그램의 핵심 요소로서, 준비태세와 효율을 높이는 현실적이고 몰입감 있는 훈련 경험을 제공할 것입니다."
 GER_update_rec_equipment: "정찰 장비 개량"
 GER_update_rec_equipment_desc: "현대전의 변화하는 성격에 대응하여 연방방위군은 정찰 장비를 개량하고 있습니다. 이 구상에는 첨단 감시 드론, 향상된 영상 체계, 새로운 전자전 능력의 획득이 포함됩니다. 목표는 정보를 실시간으로 수집하고 분석하는 연방방위군의 능력을 높여, 지휘관들이 전장에서 합리적인 결정을 내리는 데 필요한 핵심 정보를 제공하는 것입니다. 정찰 수단을 현대화함으로써 연방방위군은 재래전과 비대칭전 모두에서 전략적 우위를 유지할 수 있도록 보장합니다."
 GER_reseach_requirents_for_airforce: "공군 요구 사항 연구"
 GER_reseach_requirents_for_airforce_desc: "공중전에서 앞서 나가기 위해 연방방위군은 공군의 미래 요구 사항을 철저히 분석하고 있습니다. 이 연구는 향후 10년간 공군의 발전을 형성할 기술 진보와 전략적 필요를 식별하는 데 중점을 둡니다. 핵심 분야로는 무인 체계의 통합, 차세대 항공기 설계, 지휘 통제 체계의 개선이 있습니다. 미래의 도전과 기회를 예측함으로써 연방방위군은 공군이 현재와 미래 분쟁의 요구에 대응할 능력과 준비를 갖추도록 보장하고자 합니다."
 GER_Upgrade_Comunication_network: "통신망 개량"
 GER_Upgrade_Comunication_network_desc: "연방방위군은 더 안전하고 효율적인 군사 작전을 뒷받침하기 위해 통신망을 개량하고 있습니다. 이는 첨단 디지털 통신 체계의 배치, 사이버 보안 조치의 강화, NATO 및 기타 동맹군과의 상호 운용성 개선을 포함합니다. 개량된 통신망은 군의 모든 병과에 걸쳐 더 빠르고 신뢰할 수 있는 통신 채널을 제공하여, 평시와 분쟁 시 모두 정보가 매끄럽고 안전하게 흐르도록 보장할 것입니다. 이 현대화 노력은 급변하는 기술 환경에서 연방방위군의 작전 준비태세를 유지하는 데 필수적입니다."
 GER_National_digital_integration: "국가 디지털 통합"
 GER_National_digital_integration_desc: "응집력 있는 디지털 기반시설의 중요성을 인식하여 연방방위군은 포괄적인 국가 디지털 통합 구상을 추진하고 있습니다. 이 사업은 군 전체의 디지털 체계를 통일하고 간소화하여, 서로 다른 부대와 지휘 센터 간에 데이터를 매끄럽고 안전하게 공유할 수 있도록 하는 것을 목표로 합니다. 이 체계들의 통합은 특히 합동 및 다영역 작전에서 작전 효율, 의사 결정 과정, 전반적인 임무 효과를 높일 것입니다. 이 구상은 현대전에서 디지털 기술의 힘을 활용하려는 연방방위군의 의지를 강조합니다."
 GER_Establish_cyber_security_protocols: "사이버 보안 규약 수립"
 GER_Establish_cyber_security_protocols_desc: "사이버전의 위협이 커지는 데 대응하여 연방방위군은 디지털 자산을 보호하기 위한 포괄적인 사이버 보안 규약을 수립하고 있습니다. 이 구상에는 새로운 보안 조치의 개발, 사이버 방어 팀의 훈련, 첨단 암호화 기술의 도입이 포함됩니다. 이 규약은 사이버 공격으로부터 핵심 군 체계를 보호하고 민감한 정보의 무결성과 기밀성을 보장하도록 설계될 것입니다. 사이버 보안을 우선시함으로써 연방방위군은 작전을 보호하고 디지털 전장에서 기술적 우위를 유지하고자 합니다."
 GER_Integrated_digital_comand_system: "통합 디지털 지휘 체계"
 GER_Integrated_digital_comand_system_desc: "지휘 통제 능력을 높이기 위해 연방방위군은 통합 디지털 지휘 체계를 개발하고 있습니다. 이 체계는 다양한 출처의 정보를 통합하여 지휘관에게 전장에 대한 실시간의 포괄적인 시야를 제공할 것입니다. 이 체계의 통합은 더 효과적인 의사 결정, 더 빠른 대응 시간, 군 병과 간의 더 나은 조율을 가능하게 할 것입니다. 이 디지털 지휘 기반시설의 개발은 복잡하고 첨단 기술이 동원되는 분쟁 환경에서 작전 우위를 유지하는 데 매우 중요합니다."
 GER_future_of_airforce: "공군의 미래"
 GER_future_of_airforce_desc: "21세기의 도전을 내다보며 연방방위군은 공군의 미래 발전을 위한 전략을 수립하고 있습니다. 이 전략은 차세대 항공기, 무인 체계, 첨단 전자전 능력 같은 최첨단 기술의 통합에 중점을 둘 것입니다. 아울러 연방방위군은 조종사와 지원 인력이 점점 더 복잡하고 디지털화되는 공중전 환경에서 효과적으로 작전할 수 있도록 이들의 훈련과 교육에 투자할 것입니다. 미래의 위협과 기회에 대비함으로써 연방방위군은 앞으로 수십 년간 제공권을 유지하고 독일의 하늘을 지키고자 합니다."
 GER_Simulated_digital_warfare_Exercise: "모의 디지털전 연습"
 GER_Simulated_digital_warfare_Exercise_desc: "현대 전투의 복잡성에 대비하기 위해 연방방위군은 모의 디지털전 연습을 도입하고 있습니다. 이 연습은 첨단 시뮬레이션 기술을 사용하여 사이버 공격, 전자전, 네트워크 중심 작전을 포함한 다양한 전투 시나리오를 재현할 것입니다. 모의 디지털 환경에서 훈련함으로써 병사들은 정교한 기술과 디지털 위협을 다루는 기량을 발전시키고 다듬을 수 있어, 21세기 전쟁의 현실에 잘 대비할 수 있습니다."
 GER_Implement_realtime_data_sharing: "실시간 데이터 공유 도입"
 GER_Implement_realtime_data_sharing_desc: "현대전에서 정보가 갖는 결정적 중요성을 인식하여 연방방위군은 전 부대에 걸쳐 실시간 데이터 공유 체계를 도입하고 있습니다. 이 구상은 부대 간 즉각적인 데이터 교환을 가능하게 하는 첨단 통신망의 통합에 중점을 두어 상황 인식과 의사 결정을 높입니다. 실시간 데이터 공유는 지휘관과 병사들이 최신 정보에 접근할 수 있게 하여, 역동적인 전투 환경에서 더 신속하고 효과적인 작전을 가능하게 할 것입니다."
 GER_Artificial_Inteligence_integration: "인공지능 통합"
 GER_Artificial_Inteligence_integration_desc: "현대화 노력의 일환으로 연방방위군은 인공지능(AI)을 작전 체계에 통합하는 방안을 모색하고 있습니다. 이 구상은 다양한 군사 분야에서 의사 결정 과정을 높이고, 복잡한 작업을 자동화하며, 예측 분석을 개선하는 데 AI를 활용하는 데 중점을 둘 것입니다. AI를 활용함으로써 연방방위군은 작전의 속도와 정확성을 높이고, 지휘관의 인지 부담을 줄이며, 잠재적 적대 세력에 대한 기술적 우위를 유지하고자 합니다."
 GER_Integrate_realtime_satelite_rec: "실시간 위성 정찰 통합"
 GER_Integrate_realtime_satelite_rec_desc: "연방방위군은 실시간 위성 영상을 정보망에 통합하여 정찰 능력을 발전시키고 있습니다. 이 구상은 지휘관들이 고해상도 위성 데이터에 즉시 접근할 수 있게 하여 전장에 대한 더 정확하고 시의적절한 평가를 가능하게 할 것입니다. 실시간 위성 정찰의 통합은 세계 분쟁 지역을 감시하고, 적의 움직임을 추적하며, 떠오르는 위협에 신속히 대응하는 연방방위군의 능력을 높일 것입니다."
 GER_Integrate_UAV_digital_rec: "무인기 디지털 정찰 통합"
 GER_Integrate_UAV_digital_rec_desc: "실시간 정보에 대한 수요가 커지는 데 대응하여 연방방위군은 무인 항공기(UAV) 디지털 정찰 체계를 작전에 통합하고 있습니다. 이 UAV들은 첨단 센서와 통신 체계를 갖추어 지휘 센터로 실시간 영상을 직접 전송할 것입니다. UAV 디지털 정찰의 통합은 지속적인 감시를 수행하고, 핵심 정보를 수집하며, 실시간 데이터로 지상 작전을 지원하는 연방방위군의 능력을 높일 것입니다."
 GER_International_digital_integration: "국제 디지털 통합"
 GER_International_digital_integration_desc: "동맹군과의 상호 운용성을 강화하기 위해 연방방위군은 국제 디지털 통합을 추진하고 있습니다. 이 구상은 통신 규약, 데이터 형식, 지휘 체계를 NATO 및 기타 동맹군의 것과 조화시키는 일을 포함합니다. 매끄러운 디지털 통합을 보장함으로써 연방방위군은 평시와 분쟁 시 모두 합동 작전을 수행하고, 정보를 공유하며, 국제 파트너와 효과적으로 조율하는 능력을 높이고자 합니다."
 GER_multinational_digital_command: "다국적 디지털 사령부"
 GER_multinational_digital_command_desc: "다국적 협력에 대한 의지의 일환으로 연방방위군은 다국적 디지털 사령부를 설립하고 있습니다. 이 사령부는 여러 동맹군에 걸친 디지털 체계와 사이버 능력이 관련된 합동 작전을 감독할 것입니다. 디지털전 전략의 조율, 정보의 실시간 공유, 복잡한 작전에서의 통합 지휘 통제 보장에 중점을 둘 것입니다. 이 사령부의 창설은 디지털 시대에 국제 파트너와의 협업을 강화하려는 연방방위군의 헌신을 강조합니다."
 GER_Implement_secure_data_link: "보안 데이터링크 도입"
 GER_Implement_secure_data_link_desc: "민감한 군 통신을 보호하기 위해 연방방위군은 전 부대에 보안 데이터링크를 도입하고 있습니다. 이 암호화된 통신 채널은 부대 간에 전송되는 데이터가 도청과 사이버 위협으로부터 안전하게 유지되도록 보장할 것입니다. 보안 데이터링크의 도입은 연방방위군의 작전 보안을 높여, 특히 사이버 위협이 만연한 분쟁 환경에서 임무 중 안전하고 신뢰할 수 있는 통신을 가능하게 할 것입니다."
 GER_own_killsat_capability: "대위성(ASAT) 능력 개발"
 GER_own_killsat_capability_desc: "우주의 군사화가 심화되는 데 대응하여 연방방위군은 독자적인 대위성(ASAT) 능력을 개발하고 있습니다. 이 구상은 적 위성을 무력화하거나 파괴할 수 있는 체계를 만드는 데 중점을 두어, 독일이 우주 자산을 지키고 적대 세력의 우주 기반 자원 사용을 거부할 수 있도록 보장합니다. ASAT 능력의 개발은 진화하는 우주전 영역에서 전략적 우위를 유지하려는 연방방위군의 의지를 보여 줍니다."
 GER_own_rec_sattelites: "정찰 위성 배치"
 GER_own_rec_sattelites_desc: "전 세계 정보 수집 능력을 높이기 위해 연방방위군은 자체 정찰 위성을 배치하고 있습니다. 이 위성들은 고해상도 영상과 신호 정보를 제공하여 전 세계의 잠재적 위협을 지속적으로 감시할 수 있게 할 것입니다. 정찰 위성의 배치는 전략 감시를 수행하고, 의사 결정 과정을 지원하며, 갈수록 복잡해지는 세계 환경에서 상황 인식을 유지하는 연방방위군의 능력을 크게 개선할 것입니다."
 GER_Navy_focus: "해군 중점"
 GER_Navy_focus_desc: "연방방위군이 새로운 안보 도전에 적응함에 따라 해군 능력 강화에 대한 새로운 관심이 일고 있습니다. 이 구상에는 함대의 현대화, 해군 군수의 개선, 해상 순찰 작전의 확대가 포함됩니다. 연방방위군의 해군 중점은 독일 해군 전력이 연안과 국제 해역 모두에서 국가 이익을 지키고, 떠오르는 해양 위협에 대응하며, 전 세계에서 동맹군의 작전을 지원할 준비를 갖추도록 보장하는 것을 목표로 합니다."
 GER_Define_Brownwater_strategy: "브라운워터 전략 정립"
 GER_Define_Brownwater_strategy_desc: "연안과 하천 환경의 전략적 중요성에 대응하여 연방방위군은 브라운워터 전략을 정립하고 있습니다. 이 전략은 소형 고기동 함정과 특수 부대가 필수적인 얕은 연안 해역과 내륙 수로에서의 작전에 중점을 둡니다. 브라운워터 전략은 이러한 까다로운 환경에 맞춘 전술, 훈련, 장비의 개발을 이끌어, 연방방위군이 브라운워터 지역에서 효과적으로 전력을 투사하고 국가 이익을 지킬 수 있도록 보장할 것입니다."
 GER_Define_bluewater_strategy: "블루워터 전략 정립"
 GER_Define_bluewater_strategy_desc: "세계 해양 안보의 중요성이 커지는 데 대응하여 연방방위군은 블루워터 전략을 정립하고 있습니다. 이 전략은 항행의 자유를 유지하고, 해상 교통로를 보호하며, 전 세계적 규모로 전력을 투사하기 위해 대규모의 유능한 해군 전력이 필요한 깊은 대양에서의 작전에 중점을 둡니다. 블루워터 전략은 연방방위군 해군 능력의 확장과 현대화를 이끌어, 독일이 동맹국과 함께 블루워터 환경에서 효과적으로 작전할 수 있도록 보장할 것입니다."
 GER_Define_Greenwater_strategy: "그린워터 전략 정립"
 GER_Define_Greenwater_strategy_desc: "연방방위군은 완전한 연안(브라운워터)도 탁 트인 대양(블루워터)도 아닌 해역에서의 작전을 다루기 위해 그린워터 전략을 정립하고 있습니다. 이 전략은 해군 전력이 좁은 해역과 트인 해역 모두에서 작전할 만큼 유연해야 하는 지역 해역과 근해 환경에 중점을 둡니다. 그린워터 전략은 그린워터 작전의 고유한 도전에 적응할 수 있는 호위함, 초계함, 상륙 부대를 포함한 다용도 해군 능력의 개발에 지침이 될 것입니다."
 GER_Develope_Join_operation_Doctrine: "합동 작전 교리 개발"
 GER_Develope_Join_operation_Doctrine_desc: "연방방위군은 포괄적인 합동 작전 교리의 개발을 통해 동맹군과 합동 작전을 수행하는 능력을 높이는 데 전념하고 있습니다. 이 교리는 군의 서로 다른 병과(육, 해, 공, 사이버)의 능력을 하나의 응집력 있는 작전 체계로 통합하는 데 중점을 둘 것입니다. 합동 작전 교리는 다국적 작전에서의 상호 운용성, 조율, 효율을 개선하여, 연방방위군이 복잡하고 역동적인 환경에서 동맹국과 매끄럽게 작전할 수 있도록 보장할 것입니다."
 GER_Expand_coastial_patroles: "연안 순찰 확대"
 GER_Expand_coastial_patroles_desc: "해양 안보를 강화하기 위해 연방방위군은 연안 순찰 작전을 확대하고 있습니다. 이 구상에는 순찰함 수의 증대, 감시 능력의 강화, 신속 대응 절차의 개선이 포함됩니다. 연안 순찰의 확대는 불법 행위에서 군사적 침입에 이르는 광범위한 잠재적 위협으로부터 독일 연안 해역이 효과적으로 감시되고 보호되도록 보장할 것입니다."
 GER_Advanced_navy_training: "고급 해군 훈련"
 GER_Advanced_navy_training_desc: "연방방위군은 수병들이 현대 해상전의 도전에 대비하도록 해군 훈련 프로그램을 강화하고 있습니다. 이 고급 훈련에는 사이버전, 전자전, 동맹군과의 합동 작전에 관한 새로운 과정이 포함될 것입니다. 더 포괄적이고 최신의 훈련을 제공함으로써 연방방위군은 해군 인원이 오늘날의 복잡하고 기술적으로 진보한 해양 환경에서 작전할 준비가 되어 있도록 보장합니다."
 GER_littoral_warfare_training: "연안전 훈련"
 GER_littoral_warfare_training_desc: "연안 지역의 전략적 중요성을 인식하여 연방방위군은 연안전 훈련 프로그램을 도입하고 있습니다. 이 프로그램은 좁은 기동 공간, 환경적 장애물, 육상 위협과의 근접성 같은 고유한 어려움에 해군 전력이 맞서야 하는 얕은 연안 해역에서의 작전에 중점을 둘 것입니다. 연안전 훈련은 전통적인 블루워터 전술이 적용되지 않을 수 있는 이러한 까다로운 환경에서의 작전에 연방방위군 해군 부대가 잘 대비하도록 보장할 것입니다."
 GER_Balanced_interventions: "균형 잡힌 개입"
 GER_Balanced_interventions_desc: "연방방위군은 군사적 대응에서 유연성과 균형을 유지해야 할 필요에 중점을 둔 균형 잡힌 개입 교리를 개발하고 있습니다. 이 교리는 상황에 따라 작전 규모를 키우거나 줄이는 능력을 강조하여, 연방방위군이 대규모 분쟁과 소규모 비대칭 위협 모두에 효과적으로 대응할 수 있도록 보장합니다. 균형 잡힌 개입은 위험과 비용을 최소화하면서 전략적 목표를 달성하기 위해 알맞은 전력과 능력의 조합을 투입하도록 연방방위군을 이끌 것입니다."
 GER_not_perfect_but_flexible: "완벽하지는 않지만 유연하게"
 GER_not_perfect_but_flexible_desc: "현대 분쟁의 예측하기 어려운 성격을 인식하여 연방방위군은 완벽함보다 유연함을 중시하는 전략을 채택하고 있습니다. 이 접근은 모든 군사 작전을 완벽하게 계획하거나 수행할 수는 없지만, 변화하는 상황에 적응하고 대응하는 능력이 중요하다는 점을 인정합니다. '완벽하지는 않지만 유연하게' 교리는 연방방위군이 높은 수준의 준비태세, 다재다능함, 적응력을 유지하도록 장려하여, 예기치 못한 도전과 기회에 효과적으로 대응할 수 있도록 보장할 것입니다."
 GER_Global_intervention: "세계적 개입"
 GER_Global_intervention_desc: "세계 안보 역학이 변화함에 따라 연방방위군은 세계적 개입의 가능성에 대비하고 있습니다. 이 전략은 분쟁이든 인도적 재난이든 평화유지 임무든, 새롭게 발생하는 위기에 대응하여 세계 어느 곳에든 신속하게 병력을 전개할 수 있는 능력을 개발하는 일입니다. 세계적 개입에는 견고한 군수 체계, 전략 공수 능력, 국제 동맹국과의 긴밀한 협력이 필요하며, 이를 통해 연방방위군은 어디에서든 필요한 곳에 전력을 투사하고 지원을 제공할 수 있습니다."
 GER_Enhanced_logistics: "강화된 군수"
 GER_Enhanced_logistics_desc: "연방방위군은 현대 군사 작전을 뒷받침하기 위해 군수 능력의 강화에 집중하고 있습니다. 이 구상에는 보급망 관리의 개선, 첨단 군수 기술의 통합, 수송망의 최적화가 포함됩니다. 강화된 군수는 연방방위군이 장거리와 다양한 환경에서 작전을 지속하고, 현장의 병사들에게 신뢰할 수 있고 효율적인 지원을 제공하며, 장기 교전에 대한 준비태세를 보장하도록 할 것입니다."
 GER_lone_fighter_training: "단독 전투원 훈련"
 GER_lone_fighter_training_desc: "복잡한 환경에서 개별 병사가 독립적으로 작전해야 할 필요가 커지는 데 대응하여 연방방위군은 단독 전투원 훈련의 비중을 높이고 있습니다. 이 프로그램은 병사들이 더 큰 부대의 즉각적인 지원 없이 생존하고, 기동하며, 임무를 완수하는 데 필요한 기량을 개발하는 데 중점을 둘 것입니다. 단독 전투원 훈련은 연방방위군 인원이 전우들과 고립될 수 있는 상황에 대처할 수 있도록 준비시켜, 역경 속에서도 효과적이고 굳건하게 남도록 보장할 것입니다."
 GER_Global_Crisis_management: "세계 위기 관리"
 GER_Global_Crisis_management_desc: "연방방위군은 국제적 비상사태에 더 효과적으로 대응하기 위해 세계 위기 관리 능력을 강화하고 있습니다. 이 전략은 국제기구와의 조율 개선, 신속 전개군의 개발, 인도적 지원, 평화유지, 재난 구호를 위한 절차의 수립을 포함합니다. 세계 위기 관리는 연방방위군이 분쟁 지역을 안정시키고, 도움이 필요한 이들에게 원조를 제공하며, 세계 안보 노력을 지원하는 데 중대한 역할을 할 수 있도록 할 것입니다."
 GER_Specialized_Indantry: "특화 보병 부대"
 GER_Specialized_Indantry_desc: "특정 전투 임무를 수행할 수 있는 고도로 훈련된 병력의 필요성을 인식하여 연방방위군은 특화 보병 부대를 편성하고 있습니다. 이 부대들은 산악전, 도시전, 상륙 작전 같은 분야에서 훈련받아 다양한 환경에서 효과적으로 작전할 수 있게 됩니다. 특화 보병 부대의 창설은 광범위한 전술 상황에 대응하는 연방방위군의 능력을 높여, 현대전을 위한 다재다능하고 적응력 있는 전력을 제공할 것입니다."
 GER_HVK_army: "HVK 육군 발전"
 GER_HVK_army_desc: "연방방위군은 여러 군 병과 간의 통신과 조율을 강화하는 데 중점을 두고 HVK(육군 연락 사령부, Heeresverbindungs-Kommandos) 육군의 발전을 추진하고 있습니다. HVK 육군은 최첨단 통신 기술을 갖추어 합동 작전 중 매끄러운 통합과 협력을 보장할 것입니다. 이 구상은 복잡한 다영역 작전을 수행하는 연방방위군의 능력을 개선하여, 응집력 있고 통일된 지휘 구조를 제공할 것입니다."
 GER_Reorganize_the_Active_troops: "현역 부대 재편"
 GER_Reorganize_the_Active_troops_desc: "변화하는 군사적 필요에 대응하여 연방방위군은 현역 부대의 포괄적인 재편을 추진하고 있습니다. 이 구상은 작전 효율을 높이고, 지휘 구조를 간소화하며, 준비태세를 강화하도록 부대 구조를 개편하는 데 중점을 둘 것입니다. 현역 부대의 재편은 연방방위군이 현대적 위협에 맞설 장비를 더 잘 갖추고, 새롭게 발생하는 위기에 대응하여 병력을 더 신속하고 효과적으로 전개할 수 있도록 보장할 것입니다."
 GER_Reorganize_reserve: "예비군 재편"
 GER_Reorganize_reserve_desc: "연방방위군은 예비군의 준비태세와 현역 부대와의 통합을 개선하기 위해 예비군을 재편하고 있습니다. 이 구상에는 훈련 프로그램의 개선, 장비의 현대화, 예비군과 현역 부대 간 통신의 강화가 포함됩니다. 예비군의 재편은 예비군이 위기 시 연방방위군을 지원할 충분한 준비를 갖추도록 보장하여, 현역 작전을 보강하기 위해 신속히 동원될 수 있는 훈련된 인력의 핵심 예비 전력을 제공할 것입니다."
 GER_Territorial_defence_coordination: "영토 방위 조율"
 GER_Territorial_defence_coordination_desc: "국가 안보에 대한 의지의 일환으로 연방방위군은 영토 방위를 위한 조율을 개선하고 있습니다. 이 구상은 군과 민간의 방위 노력을 통합하고, 지방 당국과의 소통을 강화하며, 핵심 기반시설을 방어할 계획을 수립하는 데 중점을 둡니다. 영토 방위 조율은 연방방위군이 재래식 공격, 테러, 자연재해를 포함한 광범위한 위협으로부터 독일 본토를 지킬 준비가 되어 있도록 보장할 것입니다."
 GER_Optimize_supply_chain: "보급망 최적화"
 GER_Optimize_supply_chain_desc: "연방방위군은 자원이 부대에 효율적이고 적시에 전달되도록 보급망을 최적화하고 있습니다. 이 구상에는 첨단 군수 소프트웨어의 도입, 재고 관리의 개선, 수송망의 강화가 포함됩니다. 보급망을 최적화함으로써 연방방위군은 장기간에 걸쳐 다양한 환경에서 작전을 지속할 장비를 더 잘 갖추게 되며, 병사들이 필요할 때 필요한 물자를 확보하도록 보장합니다."
 GER_Reserve_mobilisation_plan: "예비군 동원 계획"
 GER_Reserve_mobilisation_plan_desc: "잠재적 위기에 대비하여 연방방위군은 포괄적인 예비군 동원 계획을 수립하고 있습니다. 이 계획은 예비군을 신속히 소집하고 전개하는 절차를 개괄하여, 예비군이 현역 부대와 매끄럽게 통합될 수 있도록 보장할 것입니다. 예비군 동원 계획은 필요한 시기에 연방방위군의 작전 역량을 확대하기 위한 명확한 체계를 제공하여, 예비군이 국내외 비상사태에 대응할 준비가 되어 있도록 보장할 것입니다."
 GER_Improve_reserve_training: "예비군 훈련 개선"
 GER_Improve_reserve_training_desc: "예비군이 현역 병력만큼 유능하도록 보장하기 위해 연방방위군은 예비군 훈련 프로그램을 개선하고 있습니다. 이 구상에는 개정된 훈련 교육과정, 강화된 야외 기동 훈련, 현대 장비에 대한 접근이 포함될 것입니다. 개선된 예비군 훈련은 예비군이 자신의 역할에 잘 대비하고, 현역 부대와 함께 효과적으로 작전하며, 즉시 전개될 준비가 되어 있도록 보장할 것입니다."
 GER_Rapid_Response_supply: "신속 대응 보급 체계"
 GER_Rapid_Response_supply_desc: "연방방위군은 핵심 물자가 최전선 부대에 신속하고 효율적으로 전달될 수 있도록 신속 대응 보급 체계를 개발하고 있습니다. 이 구상에는 어떤 환경에서든 작전을 지원하기 위해 신속히 전개할 수 있는 모듈식 기동 보급 부대의 창설이 포함됩니다. 신속 대응 보급 체계는 급변하거나 예측하기 어려운 전투 상황에서도 연방방위군 병력이 항상 충분한 보급을 받도록 보장할 것입니다."
 GER_entrenchment_training: "참호 구축 훈련"
 GER_entrenchment_training_desc: "방어 작전에 대한 중점의 일환으로 연방방위군은 참호 구축 훈련 프로그램을 도입하고 있습니다. 이 프로그램은 병사들에게 야전 방어 시설을 구축하고 방어하는 방법을 가르쳐, 포화 속에서 진지를 사수하는 능력을 높일 것입니다. 참호 구축 훈련은 연방방위군 병력이 방어 전술에 능숙하고, 적의 공격을 견뎌 내며, 다양한 환경에서 견고한 방어 진지를 구축할 수 있도록 보장할 것입니다."
 GER_Wargames_and_exercize: "워게임 및 연습"
 GER_Wargames_and_exercize_desc: "연방방위군은 광범위한 잠재적 분쟁에 대비하기 위해 워게임 및 연습 프로그램을 확대하고 있습니다. 이 모의 훈련은 재래전에서 비대칭 위협에 이르는 시나리오를 다루어, 지휘관과 병사들이 현실적인 조건에서 전략, 전술, 의사 결정을 시험해 볼 수 있게 할 것입니다. 워게임 및 연습은 연방방위군이 전투에서 성공하는 데 필요한 경험과 기량을 갖추고 어떤 도전에도 맞설 준비가 되어 있도록 보장할 것입니다."
 GER_Ready_for_Defence: "방위 태세 완비"
 GER_Ready_for_Defence_desc: "어떠한 위협으로부터도 본토를 방어할 수 있도록 보장하기 위해 연방방위군은 포괄적인 '방위 태세 완비' 구상을 도입하고 있습니다. 이 프로그램은 군의 모든 병과에 걸쳐 준비태세를 개선하고, 방어 능력을 강화하며, 모든 부대가 어떤 위기에도 대응할 충분한 준비를 갖추도록 하는 데 중점을 둘 것입니다. '방위 태세 완비'는 연방방위군이 경계를 늦추지 않고 독일의 주권과 안보를 지킬 능력을 유지하도록 보장할 것입니다."
 GER_army_defence_exercise: "육군 방어 연습"
 GER_army_defence_exercise_desc: "연방방위군은 지상군이 잠재적 방어 작전에 대비하도록 육군 방어 연습을 실시하고 있습니다. 이 연습은 독일 영토에 대한 대규모 공격을 모의하여 연방방위군의 동원, 방어, 반격 능력을 시험할 것입니다. 육군 방어 연습은 지휘관과 병사들에게 귀중한 경험을 제공하여, 어떤 잠재적 침공이나 공격으로부터도 독일을 방어할 준비가 되어 있도록 보장할 것입니다."
 GER_Armored_Delay: "기갑 지연전 전술"
 GER_Armored_Delay_desc: "잠재적 위협에 대응하여 연방방위군은 기갑 지연전 전술을 다듬고 있습니다. 이 전술은 기갑 부대를 활용해 적의 진격을 늦추고 교란함으로써 방어 준비나 반격을 위한 시간을 벌어 줍니다. 기갑 지연전 전술은 연방방위군이 적 병력을 효과적으로 지연시키고 약화시켜, 전세를 자신에게 유리하게 뒤집을 기회를 만들어 낼 수 있도록 보장할 것입니다."
 GER_Advanced_Armor_counterattack: "고급 기갑 반격"
 GER_Advanced_Armor_counterattack_desc: "연방방위군은 공세 작전에서 기갑 부대를 운용하는 데 중점을 두고 고급 기갑 반격을 수행하는 능력을 강화하고 있습니다. 이 구상에는 새로운 전술의 개발, 장갑 기술의 개량, 보병 및 항공 지원과의 조율 개선이 포함됩니다. 고급 기갑 반격은 연방방위군에게 적의 전선을 돌파하고, 약점을 이용하며, 전장에서 결정적인 승리를 거둘 강력한 수단을 제공할 것입니다."
 GER_Airforce_structure: "공군 구조 개편"
 GER_Airforce_structure_desc: "공중전의 새로운 도전에 적응하기 위해 연방방위군은 공군을 재편하고 있습니다. 이 구상은 지휘 구조의 현대화, 다른 병과와의 조율 개선, 항공 부대의 유연성과 대응성 강화에 중점을 둘 것입니다. 공군의 구조 개편은 연방방위군이 제공권을 효과적으로 장악하고, 지상 작전을 지원하며, 어떤 공중 위협에도 신속히 대응할 수 있도록 보장할 것입니다."
 GER_Restructure_Airdefense: "대공 방어 구조 개편"
 GER_Restructure_Airdefense_desc: "현대화 노력의 일환으로 연방방위군은 대공 방어 역량을 재편하고 있습니다. 여기에는 새로운 미사일 체계, 레이더 기술, 지휘 통제 네트워크의 통합이 포함됩니다. 대공 방어 재편을 통해 독일 영공은 탄도 미사일, 스텔스 항공기, 무인 항공기를 비롯한 현대적 위협으로부터 철저히 보호될 것이며, 국가 핵심 기반시설과 인구 밀집 지역에 견고한 방어막을 제공할 것입니다."
 GER_Restructure_kommando_luftwaffe: "루프트바페 사령부 재편"
 GER_Restructure_kommando_luftwaffe_desc: "2000년대 초, 루프트바페는 작전을 간소화하고 새로운 지정학적 환경에 적응하기 위해 사령부 재편에 착수했습니다. 지휘 구조를 중앙집중화하고 현대적 통신 체계를 통합하여 루프트바페 지도부와 의사 결정 과정의 효율성을 높이는 데 중점을 두었습니다. 이 재편은 급변하는 안보 환경에서 공군 전력의 작전 유연성과 대응력을 높이는 것을 목표로 했습니다."
 GER_enhance_pilot_training: "조종사 훈련 강화"
 GER_enhance_pilot_training_desc: "현대 공중전의 요구가 변화함에 따라 연방방위군은 조종사 훈련 강화의 필요성을 인식했습니다. 훈련 방법론을 개선하고, 첨단 시뮬레이터를 도입했으며, 전통적 전투와 비대칭 전투 시나리오 모두에서 필요한 기량을 강조했습니다. 이 새로운 프로그램은 UAV와 디지털 체계의 통합을 포함한 현대 공중전의 복잡성을 다룰 수 있는 조종사를 양성하는 것을 목표로 했습니다."
 GER_Capability_focus: "역량 집중"
 GER_Capability_focus_desc: "현대전에서 경쟁 우위를 유지하기 위해 연방방위군은 전반적인 군사 역량 강화에 집중했습니다. 이 노력에는 군수 지원 개선부터 무기 및 통신 분야의 첨단 기술 도입에 이르기까지 폭넓은 업그레이드가 포함되었습니다. 목표는 연방방위군이 새로운 세계적 위협에 맞설 수 있는 고도의 능력과 적응력을 갖춘 군대로 남도록 하는 것이었습니다."
 GER_strike_focus: "타격 전력 개발"
 GER_strike_focus_desc: "연방방위군은 정밀성, 속도, 적응력에 중점을 두고 타격 능력을 강화할 필요성을 확인했습니다. 이에 따라 미사일 체계, 항공기, 특수 부대를 포함한 군의 타격 요소를 업그레이드했습니다. 타격 협조를 개선하고 첨단 표적 지정 기술을 도입함으로써, 연방방위군은 재래식 및 비대칭 전투 시나리오 모두에서 결정적이고 파급력이 큰 작전을 수행하는 것을 목표로 했습니다."
 GER_Improve_groundattack_training: "지상 공격 훈련 개선"
 GER_Improve_groundattack_training_desc: "연방방위군은 공군과 지상군 간의 협조 개선에 중점을 두고 지상 공격 훈련을 전면 개편했습니다. 정밀 타격 능력의 개발과 실시간 전장 통신의 강화에 중점을 두었습니다. 지상 공격 조종사들은 새로운 근접 항공 지원기와 군수품 사용법을 훈련받았으며, 이를 통해 연방방위군은 복잡한 전투 환경에서도 효과적인 근접 항공 지원을 제공할 수 있게 되었습니다."
 GER_Integrated_strike_tactics: "통합 타격 전술"
 GER_Integrated_strike_tactics_desc: "보다 응집력 있는 작전의 필요성을 인식한 연방방위군은 공중, 지상, 해상 타격 전술을 하나의 통합 교리로 합치기 시작했습니다. 이는 합동 작전 전략을 수립하고 모든 군 사이의 타격 임무 협조를 개선하는 일을 포함했습니다. 실시간 데이터 공유와 첨단 C4ISR 체계의 통합은 연합 타격 작전의 효과를 높이는 핵심이었습니다."
 GER_Combat_exercise_simulation_center: "전투 훈련 시뮬레이션 센터"
 GER_Combat_exercise_simulation_center_desc: "전력의 준비 태세를 높이기 위해 연방방위군은 최첨단 전투 훈련 시뮬레이션 센터를 설립했습니다. 함부르크에 위치한 이 시설은 최신 기술을 활용해 실제 전투 시나리오를 모의하여, 병사들이 통제된 환경에서 훈련할 수 있게 합니다. 센터는 군의 모든 부문이 참여하는 합동 훈련에 중점을 두어 다양한 분쟁 시나리오에 대한 대비 태세를 보장합니다."
 GER_REC_focus: "정찰 집중"
 GER_REC_focus_desc: "연방방위군은 현대전에서 첨단 정찰의 중요성을 인식하고 최첨단 정찰 능력의 개발을 우선시했습니다. 이 노력에는 드론, 첨단 영상 체계, 실시간 데이터 처리의 통합이 포함되었습니다. 연방방위군은 재래식 분쟁과 비대칭 작전 모두에서 전장 상황 인식을 개선하고 핵심 정보를 수집하는 능력을 강화하는 것을 목표로 했습니다."
 GER_Joint_Exercise_complimentary_use: "상호 보완 운용을 위한 합동 훈련"
 GER_Joint_Exercise_complimentary_use_desc: "군 간 협력을 강화하기 위해 연방방위군은 각 군의 상호 보완적 강점을 극대화하도록 설계된 합동 훈련을 실시했습니다. 이 훈련은 공군, 지상군, 해군 간의 협조 개선에 중점을 두었으며, 실제 시나리오를 활용해 합동 작전 전술을 시험하고 다듬었습니다."
 GER_Reform_bundeswehr: "연방방위군 개혁"
 GER_Reform_bundeswehr_desc: "군사적 효율성에 대한 포괄적 검토 이후, 연방방위군은 구조, 역량, 교리의 현대화를 목표로 하는 광범위한 개혁에 착수했습니다. 이 개혁은 지휘 통제, 군수, 작전 준비 태세의 비효율을 해소하여, 연방방위군이 21세기의 다양한 도전에 더 잘 대응할 수 있도록 갖추게 했습니다."
 GER_Establish_Streitkrafte_basis: "연방군 기반 부대 창설"
 GER_Establish_Streitkrafte_basis_desc: "연방방위군은 군수, 지휘, 지원 기능을 개선하기 위해 연방군 기반 부대(Streitkräftebasis)를 창설했습니다. 이 새로운 구조는 군의 여러 부문에 걸친 작전을 간소화하여 더 나은 협조와 자원 관리를 가능하게 하도록 설계되었습니다. 또한 연방군 기반 부대는 지원 부대의 작전 준비 태세 강화에 중점을 두어, 평시와 전시 모두에서 핵심 서비스를 제공할 수 있도록 했습니다."
 GER_Joint_operation_Training: "합동 작전 훈련"
 GER_Joint_operation_Training_desc: "현대전에서 합동 작전의 중요성을 인식한 연방방위군은 공군, 지상군, 해군 간의 협력을 개선하기 위해 훈련 프로그램을 강화했습니다. 합동 작전 훈련은 다군 작전을 위한 응집력 있는 전략 개발에 중점을 두어, 연방방위군이 군의 여러 요소가 관여하는 복잡한 임무를 효과적으로 수행할 수 있도록 했습니다."
 GER_Crisis_management_doctrine: "위기 관리 교리"
 GER_Crisis_management_doctrine_desc: "연방방위군은 테러, 사이버 공격, 인도적 위기와 같이 늘어나는 비전통적 위협에 대응하기 위해 포괄적인 위기 관리 교리를 개발했습니다. 이 교리는 국내외에서 새롭게 등장하는 위협에 신속하고 효과적으로 대응하는 연방방위군의 능력을 개선하는 데 중점을 두었습니다. 유연성, 민간 기관과의 협조, 새로운 기술의 통합이 강조되었습니다."
 GER_Infantry_Spezialisation: "보병 전문화"
 GER_Infantry_Spezialisation_desc: "현대전에 적응하기 위해 연방방위군은 시가전, 산악전, 대반란전 등의 분야에 중점을 두고 보병 부대를 전문화하기 시작했습니다. 이러한 전문화는 보병이 서로 다른 전투 환경에 필요한 특수 기량을 발전시키게 하여 다양한 작전 시나리오에서의 효과를 높였습니다. 이 전환을 뒷받침하기 위해 새로운 훈련 프로그램과 장비가 도입되었습니다."
 GER_Combined_exersice: "연합 훈련"
 GER_Combined_exersice_desc: "2000년대 초, 연방방위군은 군의 여러 부문 간 합동 작전을 포함하는 연합 훈련 프로그램을 강화했습니다. 이 훈련은 군 간 협력을 개선하고, 공중, 지상, 해상 전력이 관여하는 복잡한 작전에 연방방위군이 대비하도록 설계되었습니다. 또한 연합 훈련은 현실적인 전투 시나리오에서 새로운 교리와 기술을 시험하는 역할도 했습니다."
 GER_Balance_act: "균형 잡기"
 GER_Balance_act_desc: "균형 잡기 교리는 연방방위군이 전통적인 군사적 역할과 평화 유지, 인도적 지원, 대테러 작전에 대한 늘어나는 요구 사이에서 효과적으로 균형을 잡을 수 있도록 도입되었습니다. 이 교리는 전략과 작전 모두에서의 유연성의 필요성을 강조하며, 연방방위군이 필요에 따라 전투 임무와 비전투 임무 사이를 전환할 수 있게 합니다."
 GER_Delay_training: "지연전 훈련"
 GER_Delay_training_desc: "변화하는 군사 전술에 대응하여 연방방위군은 부대들에게 전술적 후퇴를 수행하고 적의 진격을 지연시키는 방법을 가르치는 지연전 훈련을 도입했습니다. 이 훈련은 기동성, 방어 진지 구축, 그리고 손실을 최소화하면서 적군의 속도를 늦추기 위한 지형 활용을 강조했습니다. 지연전 훈련은 우세한 적군을 상대하거나 전략적 요충지를 보호하는 데 특히 중요했습니다."
 GER_security_intervention: "안보 개입 교리"
 GER_security_intervention_desc: "연방방위군은 늘어나는 비대칭 위협과 여러 지역의 불안정에 대응하여 안보 개입 교리를 개발했습니다. 이 교리는 신속한 전개, 평화 유지 작전, 분쟁 지역 민간인 보호를 강조했습니다. 또한 UN과 NATO 같은 국제기구와 협조하여 인도적 지원을 제공하고, 질서를 유지하며, 폭력의 확대를 방지하는 데 중점을 두었습니다."
 GER_Ready_to_transform: "변화할 준비"
 GER_Ready_to_transform_desc: "냉전 이후 시대의 새로운 도전에 직면한 연방방위군은 전력을 현대적이고 적응력 높은 군대로 탈바꿈시키기 위한 대규모 구상에 착수했습니다. 이 변혁은 장비 업그레이드, 훈련 프로그램 개정, 유연성과 준비 태세를 개선하기 위한 부대 재편을 포함했습니다. 목표는 평화 유지 임무와 대반란 작전을 포함한 21세기 전쟁의 복잡성에 연방방위군이 대비하도록 하는 것이었습니다."
 GER_Air_mobility_training: "공중 기동 훈련"
 GER_Air_mobility_training_desc: "연방방위군의 신속 대응 능력을 강화하기 위해 공중 기동 훈련이 우선시되었습니다. 이 프로그램은 공군과 지상군 간의 협조 개선에 중점을 두어, 병력과 장비를 어느 작전 지역으로든 신속하게 전개할 수 있도록 했습니다. 공중 강습 전술과 병력 수송에 중점을 두어, 훈련에는 NH90 같은 첨단 헬리콥터가 통합되어 연방방위군의 작전 범위를 극대화했습니다."
 GER_Direct_counter_attack: "직접 반격 교리"
 GER_Direct_counter_attack_desc: "연방방위군은 반군 전술과 하이브리드전을 포함해 변화하는 전장 위협에 대응하기 위해 직접 반격 교리를 도입했습니다. 이 교리는 기동성, 정밀 타격, 기계화 보병과 항공 지원 간의 긴밀한 협조에 중점을 두고, 적의 진격을 무력화하기 위한 신속하고 결정적인 무력 사용을 강조했습니다. 또한 효과적인 전장 통신과 지휘를 보장하기 위해 현대 기술을 통합했습니다."
 GER_Advanced_Teritorial_defence: "고급 영토 방위"
 GER_Advanced_Teritorial_defence_desc: "본토 안보에 대한 우려가 커지면서 연방방위군은 영토 방위 능력을 강화했습니다. 고급 영토 방위 프로그램은 재래식 위협과 비대칭 위협 모두로부터 독일의 핵심 기반시설과 국경을 방어하는 능력을 개선하는 데 중점을 두었습니다. 또한 예비 전력, 지역 방위 부대, 민간 기관의 통합을 강조하여 응집력 있고 조율된 국가 방위 노력을 보장했습니다."
 GER_Modernize_Armored_Tactics: "기갑 전술 현대화"
 GER_Modernize_Armored_Tactics_desc: "전장에서 경쟁 우위를 유지하기 위해 연방방위군은 기갑 전술 현대화에 착수했습니다. 이는 최근 분쟁에서 얻은 교훈을 반영하도록 교리를 개정하고 기갑 부대와 항공 지원 간의 협조를 강화하는 일을 포함했습니다. 또한 이 프로그램은 레오파르트 2 주력 전차의 업그레이드를 포함하여, 연방방위군의 기갑 전력이 재래식 위협과 비대칭 위협 모두에 효과적으로 대응할 수 있도록 했습니다."
 GER_Rapid_Armor_deployment_training: "신속 기갑 전개 훈련"
 GER_Rapid_Armor_deployment_training_desc: "현대 전투에서 신속하고 결정적인 행동의 필요성을 인식한 연방방위군은 신속 기갑 전개 훈련을 도입했습니다. 이 프로그램은 기계화 보병 및 지원 요소의 통합에 중점을 두고, 기갑 부대가 새로운 위협에 대응하여 빠르고 효과적으로 전개하도록 훈련시켰습니다. 부대의 기동성, 군수 지원, 기갑 돌격의 신속한 협조가 강조되었습니다."
 GER_Advanced_mechanized_tactic: "고급 기계화 전술"
 GER_Advanced_mechanized_tactic_desc: "연방방위군은 기계화 보병 및 기갑 사단의 전투 효율을 높이기 위해 고급 기계화 전술을 개발했습니다. 이 전술은 기계화 전력, 항공 지원, 포병 간의 긴밀한 협력을 강조하여 전장에서 신속하고 조율된 기동을 가능하게 했습니다. 훈련에는 복서와 푸마 같은 현대 장갑차의 기동성과 화력을 활용하도록 설계된 새로운 공격 및 방어 기동이 포함되었습니다."
 GER_Improved_logistics: "군수 역량 개선"
 GER_Improved_logistics_desc: "연방방위군은 군수 역량을 개선하기 위해 상당한 노력을 기울였습니다. 이 구상은 병력과 장비가 신속히 전개되고 장기 작전에서도 유지될 수 있도록 공급망, 수송, 전장 재보급의 효율을 높이는 데 중점을 두었습니다. 군수 현대화에는 새로운 디지털 관리 체계의 통합과 MAN 트럭 같은 개선된 수송 차량이 포함되었습니다."
 GER_Rapid_deployment_doctrine: "신속 전개 교리"
 GER_Rapid_deployment_doctrine_desc: "신속하고 유연한 군사 행동의 필요성에 대응하여 연방방위군은 신속 전개 교리를 채택했습니다. 이 전략은 국내외 위기 지역에 전력을 빠르게 전개하는 능력을 강조했습니다. 이 교리는 공중 및 지상 기동성, 현대화된 수송 체계, 사전 배치 장비를 통합하여, 독일군이 최소한의 지연으로 새로운 위협에 효과적으로 대응할 수 있도록 했습니다."
 GER_Integrated_command_and_control: "통합 지휘 통제"
 GER_Integrated_command_and_control_desc: "연방방위군은 현대전에서 끊김 없는 지휘 통제의 중요성을 인식하고 통합 지휘 구조 체계를 도입했습니다. 이 구상은 군의 각 부문 간 통신과 의사 결정을 강화하는 데 중점을 두었습니다. 연방방위군은 첨단 C4ISR 체계를 활용해 작전 협조를 개선하고, 변화하는 전장 상황에 신속하고 정보에 기반한 대응을 가능하게 하는 것을 목표로 했습니다."
 GER_Strengthen_infantry_training: "보병 훈련 강화"
 GER_Strengthen_infantry_training_desc: "현대전의 요구에 부응하기 위해 연방방위군은 보병 훈련 프로그램 강화에 새롭게 중점을 두었습니다. 여기에는 시가전, 대반란전, 험지에서의 작전에 초점을 맞추도록 훈련을 조정하는 일이 포함되었습니다. 또한 이 프로그램은 첨단 무기 체계와 실시간 전장 통신을 통합하여, 보병 부대가 다양하고 어려운 환경에서 효과적으로 작전할 수 있도록 했습니다."
 GER_mobile_Warfare_doctrine: "기동전 교리"
 GER_mobile_Warfare_doctrine_desc: "연방방위군의 기동전 교리는 기동성 높은 전력을 활용해 상대를 기동으로 압도하는 것을 강조했습니다. 이 교리는 항공 및 포병 자산의 지원을 받는 기계화 및 기갑 부대의 속도와 유연성을 우선시했습니다. 재래식 위협과 비대칭 위협 모두에 대응하도록 설계된 기동전 전술은 신속한 작전 성공을 보장하고 고정 방어의 취약성을 최소화하는 데 핵심이었습니다."
 GER_Advanced_Armor_Tactics: "고급 기갑 전술"
 GER_Advanced_Armor_Tactics_desc: "기갑전의 변화하는 성격을 인식한 연방방위군은 고급 기갑 전술을 개발했습니다. 이 전술은 기갑을 보병, 포병, 항공 지원과 통합하여 공격과 방어 작전 모두가 가능한 제병 협동 전력을 구축하는 데 중점을 두었습니다. 또한 이 교리는 정찰 부대와의 협조 강화를 포함하여, 기갑 부대가 더 높은 정밀성과 효율로 적군과 교전할 수 있게 했습니다."
 GER_Rapid_Armor_deployment: "신속 기갑 전개"
 GER_Rapid_Armor_deployment_desc: "연방방위군의 신속 기갑 전개 구상은 기갑 부대를 동원하는 속도와 효율을 높이는 데 중점을 두었습니다. 이 프로그램은 기갑 전력이 어느 작전 지역으로든 신속히 전개될 수 있도록 사전 배치 장비, 간소화된 군수, 신속한 수송의 중요성을 강조했습니다. 목표는 새로운 위협에 대응하여 전력을 투사하는 연방방위군의 능력을 높이는 것이었습니다."
 GER_Update_Mechaniced_Units: "기계화 부대 갱신"
 GER_Update_Mechaniced_Units_desc: "연방방위군은 차량, 무기 체계, 통신 장비의 업그레이드에 중점을 두고 기계화 부대를 갱신하는 포괄적인 프로그램에 착수했습니다. 이 구상에는 마르더와 푸마 보병 전투 차량 같은 플랫폼의 현대화가 포함되어, 기계화 부대가 다양한 전투 환경에서 효과적으로 작전할 수 있도록 했습니다. 또한 갱신은 새로운 디지털 지휘 통제 체계의 통합을 강조했습니다."
 GER_global_interventions: "글로벌 개입 전략"
 GER_global_interventions_desc: "국제 안보에서 독일의 역할이 커짐에 따라, 연방방위군은 글로벌 개입 전략을 개발했습니다. 이 전략은 평화 유지, 인도적 지원, 전투 임무를 포함한 해외 작전을 수행하는 군의 능력을 강화하는 데 중점을 두었습니다. 이 전략은 국제 파트너와의 협력 확대, 신속 전개 능력, 전 세계의 위기에 대응할 수 있는 유연한 전력 구조를 요구했습니다."
 GER_Air_mobility_exercise: "공중 기동 훈련 연습"
 GER_Air_mobility_exercise_desc: "신속 전개를 강화하고 지상군과 공군 간의 협조를 개선하기 위해 연방방위군은 정기적인 공중 기동 연습을 제도화했습니다. 이 연습은 공중 수송, 헬리콥터 작전, 공중 강습 기법의 끊김 없는 통합을 강조했습니다. NH90 및 CH-53 같은 첨단 수송 헬리콥터를 활용한 이 연습을 통해 병력이 전투 지역으로 신속히 전개될 수 있게 되었으며, 작전 유연성과 대응 시간이 크게 개선되었습니다."
 GER_Introduce_Medium_Forces: "중형 전력 도입"
 GER_Introduce_Medium_Forces_desc: "중장갑 부대와 경보병 사이에서 기동성 높고 다재다능한 전력의 필요성을 인식한 연방방위군은 '중형 전력' 개념을 도입했습니다. 이 부대는 복서와 페넥 같은 경장갑 차량으로 장비되어 기동성, 화력, 생존성을 겸비했습니다. 신속 전개, 정찰, 시가지와 개활지 모두에서 작전하는 능력에 중점을 두어, 전통적 기계화 부대와 더 가벼운 편제 사이의 간극을 메웠습니다."
 GER_NEW_depardments: "신규 부서 창설"
 GER_NEW_depardments_desc: "군사 작전의 복잡성이 커짐에 따라 연방방위군은 사이버 방어, 우주 작전, 정보에 중점을 둔 여러 신규 부서를 창설했습니다. 이 새로운 부문들은 첨단 기술을 통합하고 연방방위군이 디지털 및 우주 영역에서 효과적으로 작전할 수 있도록 하는 임무를 맡았습니다. 목표는 새롭게 등장하는 위협에 대처하고 전반적인 작전 효율을 높일 수 있는 전문 부대를 만드는 것이었습니다."
 GER_handle_asymetrick_threat: "비대칭 위협 대처"
 GER_handle_asymetrick_threat_desc: "반군 전술, 사이버 공격, 비전통적 위협이 특징인 비대칭전은 연방방위군의 작전 초점에 상당한 변화를 요구했습니다. 이 교리는 이러한 비정규 위협에 대처하기 위해 정보 수집, 대반란전, 특수 부대 활용을 강조했습니다. 첨단 감시 기술과 전문 훈련의 통합을 통해 연방방위군은 비전통적 적대 세력을 효과적으로 무력화할 수 있게 되었습니다."
 GER_Coasteal_and_open_sea_defense: "연안 및 원해 방어"
 GER_Coasteal_and_open_sea_defense_desc: "독일의 해양 이익을 지키는 데 중점을 두고 연방방위군은 연안 및 원해 방어 능력을 강화했습니다. 이 구상에는 첨단 연안 방어 체계, 순찰함, 감시 기술의 개발이 포함되었습니다. 이 전략은 핵심 해양 기반시설을 보호하고, 해군이 연안 해역과 원해 모두에서 잠재적 위협에 효과적으로 맞설 수 있도록 하는 것을 목표로 했습니다."
 GER_Naval_training_expansion: "해군 훈련 확대"
 GER_Naval_training_expansion_desc: "작전 준비 태세를 유지하기 위해 연방방위군은 합동 작전, 대잠수함전, 상륙 작전에 중점을 두고 해군 훈련 프로그램을 확대했습니다. 이는 현대 해군 기술을 통합하고 변화하는 해양 위협 환경에 대응하도록 전술 교리를 다듬는 일을 포함했습니다. 또한 이 확대는 NATO 파트너와의 협력을 강조하여, 독일 해군이 동맹 함대와 상호 운용성을 유지하도록 했습니다."
 GER_future_projects_heavy: "미래 중장비 항공 수송 사업"
 GER_future_projects_heavy_desc: "항공 수송 능력 확대에 대한 연방방위군의 의지는 미래 중장비 항공 수송 사업의 개발로 이어졌습니다. 이 사업들은 중장비와 차량을 전 세계로 신속히 이동시키는 능력을 개선하도록 설계된 에어버스 A400M 같은 새로운 수송기 확보에 중점을 둡니다. 이 구상은 연방방위군이 위기에 대응하여 필수 자원을 신속히 전개하고 복잡한 군사 작전에서 군수 우위를 유지할 수 있도록 하는 것을 목표로 합니다."
 GER_Cooperation_possible: "아르텍 협력"
 GER_Cooperation_possible_desc: "복서 MRAV(다목적 장갑차)를 개발한 합작 기업 아르텍(Artec)과의 연방방위군 협력은 독일 기계화 전력 현대화에서 핵심적인 파트너십입니다. 이 협력은 보병 수송에서 정찰 임무에 이르기까지 다양한 작전 역할에 적응할 수 있는 다재다능하고 기동성이 높으며 방호력이 우수한 차량의 개발에 중점을 둡니다. 복서는 독일 공학과 전략적 군사 역량이 결합된, 최첨단 유럽 방위 혁신의 상징이 되었습니다."
 GER_Choose_future_MR: "미래 다목적 전투기 선정"
 GER_Choose_future_MR_desc: "공군 현대화의 필요성에 직면한 연방방위군은 차세대 다목적 전투기 선정을 우선시했습니다. 이 결정은 루프트바페의 전투 능력을 강화하기 위해 유로파이터 타이푼과 F-35 같은 잠재적 미래 항공기와 같은 첨단 플랫폼을 평가하는 일을 포함합니다. 목표는 첨단 항전 장비, 뛰어난 기동성, 다임무 적응성을 통해 독일의 제공권을 보장하고, 이 전투기들이 공대공, 공대지, 정찰 임무에서 효과적이도록 하는 것입니다."
 GER_KRK_army: "위기 대응군(Krisenreaktionskräfte) 육군"
 GER_KRK_army_desc: "연방방위군의 위기 대응군(Krisenreaktionskräfte)은 국제 위기에 대한 신속하고 유연한 군사 대응의 필요성이 커지면서 창설되었습니다. 고도로 훈련된 이 부대는 신속히 전개하여 평화 유지에서 전투 작전에 이르기까지 다양한 환경에서 작전하도록 설계되었습니다. 장갑차와 신속 공중 기동 지원을 포함한 최첨단 기술로 장비된 위기 대응군은 독일이 NATO 및 EU 임무에 기여하는 능력에서 중요한 역할을 하며, 새롭게 등장하는 모든 위협에 대한 준비 태세를 보장합니다."
 GER_Naval_Air_rec: "해군 항공 정찰"
 GER_Naval_Air_rec_desc: "2000년부터 연방방위군은 해군 항공 정찰 능력을 강화하고 있습니다. 여기에는 해상 감시 및 정보 수집을 위한 항공기와 기술의 업그레이드가 포함됩니다. 목표는 상황 인식을 개선하고 해군 작전 구역을 감시하고 확보하는 능력을 높이는 것입니다."
 GER_Airsuperiority_focus: "제공권 집중"
 GER_Airsuperiority_focus_desc: "2000년부터 연방방위군은 제공권을 강조하고 있습니다. 여기에는 영공을 장악하기 위한 전술, 훈련, 기술의 개발이 포함됩니다. 목표는 제공권을 확보하고 공중 작전에서 전략적 우위를 제공하는 것입니다."
 GER_Improve_Radarcapability: "레이더 능력 개선"
 GER_Improve_Radarcapability_desc: "연방방위군은 2000년부터 레이더 능력 개선에 집중하고 있습니다. 여기에는 레이더 체계의 업그레이드와 첨단 탐지 기술의 도입이 포함됩니다. 목표는 대공 방어, 조기 경보, 표적 획득 능력을 강화하는 것입니다."
 GER_Improve_fighter_training: "전투기 훈련 개선"
 GER_Improve_fighter_training_desc: "2000년부터 연방방위군은 전투기 조종사 훈련 프로그램을 강화하고 있습니다. 여기에는 첨단 훈련 시나리오의 개발, 새로운 시뮬레이션 기술의 도입, 공중 전투 전술의 정교화가 포함됩니다. 목표는 조종사가 높은 기량을 갖추고 현대 공중전의 도전에 대비하도록 하는 것입니다."
 GER_modernice_Special_forces: "특수 부대 현대화"
 GER_modernice_Special_forces_desc: "2000년부터 연방방위군은 특수 부대를 현대화하고 있습니다. 여기에는 장비 갱신, 전술 정교화, 훈련 프로그램 강화가 포함됩니다. 목표는 특수 부대가 다양하고 위험도 높은 임무를 수행할 수 있도록 장비와 능력을 갖추게 하는 것입니다."
 GER_Expand_KSK: "KSK 확대"
 GER_Expand_KSK_desc: "연방방위군은 2000년부터 특수전사령부(KSK, Kommando Spezialkräfte)를 확대하고 있습니다. 여기에는 인원 증강, 훈련 강화, 작전 능력의 확장이 포함됩니다. 목표는 특수 작전과 대테러 임무를 수행하는 독일의 역량을 강화하는 것입니다."
 GER_Expand_SEK_M: "SEK M 확대"
 GER_Expand_SEK_M_desc: "2000년부터 연방방위군은 해군 특수 작전 부대(SEK M)를 확대하고 있습니다. 이 확대에는 해상 특수 작전을 위한 인원과 능력의 증강이 포함됩니다. 목표는 승선 검색과 해적 퇴치 임무를 포함한 전문 해군 작전을 수행하는 능력을 강화하는 것입니다."
 GER_Introduce_EGB: "EGB 도입"
 GER_Introduce_EGB_desc: "연방방위군은 2000년부터 작전단 보급대대(EGB, Einsatzgruppenversorgungsbataillone)를 도입하고 있습니다. 여기에는 신속 전개와 지원을 위한 전문 대대의 창설이 포함됩니다. 목표는 작전 유연성을 높이고 신속 대응 임무 중에 효과적인 군수 지원을 보장하는 것입니다."
 GER_Improve_special_forces_training: "특수 부대 훈련 개선"
 GER_Improve_special_forces_training_desc: "2000년부터 연방방위군은 특수 부대 훈련 프로그램을 개선하고 있습니다. 여기에는 첨단 전투 기법, 전문 장비, 현실적인 시나리오 기반 훈련의 도입이 포함됩니다. 목표는 특수 부대가 광범위한 고강도 작전에 대비하도록 하는 것입니다."
 GER_Update_rec_forces: "정찰 부대 갱신"
 GER_Update_rec_forces_desc: "연방방위군은 2000년부터 정찰 부대를 갱신하고 있습니다. 여기에는 정보 수집 능력 강화, 새로운 감시 기술의 통합, 다른 군과의 협조 개선이 포함됩니다. 목표는 포괄적이고 시의적절한 상황 인식을 제공하는 것입니다."
 GER_Specialiced_terrain_training: "특수 지형 훈련"
 GER_Specialiced_terrain_training_desc: "2000년부터 연방방위군은 특수 지형 훈련을 실시하고 있습니다. 여기에는 도시 지역, 삼림, 산악 등 다양하고 까다로운 환경에서의 작전에 중점을 둔 훈련 프로그램의 개발이 포함됩니다. 목표는 다양한 지형 조건에서 병력의 적응력과 효율을 높이는 것입니다."
 GER_Introduce_drone_rec_troop: "드론 정찰 부대 도입"
 GER_Introduce_drone_rec_troop_desc: "2000년부터 연방방위군은 전담 드론 정찰 부대를 도입하고 있습니다. 이 구상은 감시와 정보 수집을 위해 UAV 운용에 특화된 부대를 창설하는 일을 포함합니다. 목표는 정찰 능력을 강화하고 전장의 실시간 정보를 제공하는 것입니다."
 GER_FAC_training: "전방 항공 통제관 훈련"
 GER_FAC_training_desc: "연방방위군은 2000년부터 전방 항공 통제관(FAC) 훈련을 강화하고 있습니다. 여기에는 FAC가 전투 상황에서 항공 지원을 효과적으로 조율할 수 있도록 하는 전문 훈련 프로그램의 개발이 포함됩니다. 목표는 정밀하고 효과적인 공습을 위해 공중 작전과 지상 작전의 통합을 개선하는 것입니다."
 GER_modernice_REC_network: "REC 네트워크 현대화"
 GER_modernice_REC_network_desc: "2000년부터 연방방위군은 정찰, 전자전, 통신(REC) 네트워크를 현대화하고 있습니다. 여기에는 통신 체계의 업그레이드, 데이터 공유의 개선, 첨단 전자전 능력의 통합이 포함됩니다. 목표는 REC 작전의 전반적인 효율과 복원력을 높이는 것입니다."
 GER_Idea_Weizsackerkommission: "바이츠제커 위원회"
 GER_Idea_Weizsackerkommission_desc: "바이츠제커 위원회는 연방방위군 개혁을 위해 2000년 독일의 사회민주당-녹색당 정부가 설치한 위원회였습니다. 2001년에 발표된 위원회의 보고서는 징집 기간을 9개월에서 6개월로 단축하고 지원자를 위한 새로운 군 복무 제도를 신설하는 등 연방방위군에 대한 여러 변화를 권고했습니다."
 GER_additional_Constructeur: "신규 장갑차 계약업체"
 GER_additional_Constructeur_desc: "생산을 다변화하고 군수 산업 내 경쟁을 촉진하기 위해 독일은 차세대 장갑차 제작을 지원할 새로운 계약업체를 찾고 있습니다. 추가 제작사를 선정함으로써 연방방위군은 생산 능력을 늘리고, 혁신을 촉진하며, 경쟁을 통해 비용 효율적인 해결책을 보장하는 것을 목표로 합니다. 이 중점은 국내 방위 산업을 강화하여 연방방위군이 작전 요구 사항을 충족할 더 견고하고 진보된 선택지를 갖추게 합니다."
 GER_Flensburger_Fahrzeugbau_I: "플렌스부르거 파르초이크바우"
 GER_Flensburger_Fahrzeugbau_I_desc: "플렌스부르거 파르초이크바우 게젤샤프트(FFG)는 군용 차량과 장갑 체계의 생산 및 현대화를 전문으로 하는 유명한 독일 기업입니다. 수십 년의 경험을 바탕으로 FFG는 현대 전투 환경의 도전을 견딜 수 있도록 설계된 견고하고 다용도의 장비를 공급하는 핵심 업체가 되었습니다. 이 중점은 FFG와의 공식 파트너십을 수립하여, 연방방위군이 최신 기술 및 작전 기준을 충족하는 고품질의 국산 장갑차를 확보하게 하고 독일 방위군이 다양한 임무에 충분히 대비하도록 보장합니다."
 GER_Flensburger_Fahrzeugbau_I_TT: "이 중점은 새로운 기업 §Y플렌스부르거 파르초이크바우§!를 추가합니다"
 GER_Armored_Car_Systems_I: "아머드 카 시스템즈"
 GER_Armored_Car_Systems_I_desc: "아머드 카 시스템즈는 까다로운 군사 및 법 집행 용도로 설계된 고성능 전술 장갑차의 개발과 생산을 전문으로 하는 독일의 선도 기업입니다. 혁신성과 신뢰성으로 알려진 아머드 카 시스템즈는 첨단 방호력과 기동 능력을 갖춘 차량을 제공하며, 다양한 작전 요구에 이상적입니다. 이 중점은 아머드 카 시스템즈와의 공식 파트너십을 수립하여, 연방방위군이 작전 준비 태세와 임무 성공을 모두 높이는 최첨단 국산 전술 차량의 혜택을 누리도록 보장합니다."
 GER_Armored_Car_Systems_I_TT: "이 중점은 새로운 기업 §Y아머드 카 시스템즈§!를 추가합니다"
 GER_MAN_again: "MAN과의 계약 갱신"
 GER_MAN_again_desc: "독일은 장갑 군용 차량과 장비를 생산하기 위해 MAN과의 공식 계약을 재수립하고 있으며, 이를 통해 연방방위군이 진보된 국산 자산을 확보할 수 있게 됩니다. 이 갱신된 파트너십은 높은 생산 품질 기준과 군수 복원력을 보장하고 외국 공급업체에 대한 의존을 줄입니다. MAN의 검증된 전문성을 바탕으로 독일은 국가 방위와 국제 임무의 요구에 필수적인 견고한 현대 장비를 확보합니다."
 GER_MAN_again_TT: "이 중점은 새로운 기업 §YMAN 밀리터리§!를 추가합니다"
 GER_Declare_V_Fall: "국방 사태 선포(Den Verteidigungsfall Ausrufen)"
 GER_Declare_V_Fall_desc: "국방 사태(Verteidigungsfall)는 독일의 주권 또는 영토 보전이 직접 위협받을 때 발동되는 국가 방위 비상사태의 선포를 뜻합니다. 이 상태에서는 '렉스 처칠(Lex Churchill)'이 발동되는데, 이는 연방방위군의 최고 지휘권을 국방부 장관에서 연방총리(Bundeskanzler)에게 이전하여 총리에게 모든 군사 작전에 대한 직접 통제권을 부여하는 헌법 조항입니다. 국가가 방위 잠재력을 총동원함에 따라 시민의 자유가 일시적으로 제한될 수 있습니다. 또한 핵심 기반시설이 보호되고 방위 전략이 우선시되어, 독일이 어떠한 위협에도 신속하고 결정적으로 대응할 수 있도록 보장합니다."
 GER_Integrate_NL: "네덜란드군 통합"
 GER_Integrate_NL_desc: "군사 협력이 심화됨에 따라 독일은 네덜란드군을 부분적으로 통제할 기회를 얻었습니다. 이 조치는 지휘 구조를 통일하고 전반적인 방위 협조를 개선하는 것을 목표로 합니다. 네덜란드 부대를 독일의 지휘 아래 통합함으로써 서유럽 방위 전략의 효율과 강도를 크게 높이고 양국의 안보를 강화할 수 있습니다."
 GER_Territorial_Defense: "향토 방위 여단 소집"
 GER_Territorial_Defense_desc: "§Y향토 방위 여단§!은 예비역과 지원 병사로 구성되어 위기 시 핵심 기반시설을 보호하고, 보급선을 확보하며, 민간 당국을 지원할 준비가 된 독일의 영토 방위 전력입니다. 이 부대들을 활성화하면 본토 안보가 강화되어 외부 위협, 반란, 자연재해에 대한 신속 대응 능력이 제공됩니다. 전방 사단만큼 중무장하지는 않았지만, 현지 지형에 대한 지식과 유연한 전개 능력 덕분에 독일 방위 전략의 필수적인 일부입니다."
 GER_fortifications_I_desc: "구 동독 지역으로부터의 잠재적 침공에 대비하여 슐레스비히-홀슈타인의 옛 요새를 재건하고 현대화합니다. 이 요새들은 독일의 북부 방어선을 강화할 것입니다."
 GER_fortifications_II_desc: "동쪽에서 커지는 위협에 대응하여 독일은 니더작센의 요새를 되살리고 있습니다. 이 방어 구조물은 핵심 전략 거점을 적의 잠재적 진격으로부터 지키는 결정적인 완충 역할을 할 것입니다."
 GER_fortifications_III_desc: "헤센과 바이에른의 남부 지역을 확보하기 위해 독일은 구 동독 국경을 따라 요새를 재건하고 강화하고 있습니다. 이 요새화된 진지들은 남부의 중요한 기반시설과 인구 밀집 지역의 보호를 보장하는 데 도움이 될 것입니다."
 GER_Industrialization_modern: "산업 현대화"
 GER_Industrialization_modern_desc: " §Y업그레이드입니다, 여러분, 업그레이드!§! \n\n 우리 산업은 국가의 심장이지만, 기술적으로 여전히 암흑시대에 머물러 있다면 아무 소용이 없습니다. 제국은 최고의 최신 시설과 장비를 누릴 자격이 있습니다."
 GER_Invite_sweden: "스웨덴 초청"
 GER_Invite_sweden_desc: "스웨덴은 사회주의와 민주주의의 보루였습니다. 그들을 초청해야 합니다!"
 GER_Invite_poland: "폴란드 초청"
 GER_Invite_poland_desc: "우리는 폴란드의 충성을 확보함으로써 동쪽 국경을 안정시켜야 합니다. 초청에 대한 그들의 답변에 따라 알게 될 것입니다."
 GER_Interventionism_for_democracy: "민주주의를 위한 개입주의"
 GER_Interventionism_for_democracy_desc: "우리는 병력을 동원해 개입함으로써 민주주의 세계 질서의 수호를 정당화해야 합니다.\n그렇게 하지 않는다면, 미래에 우리가 모두 러시아어를 쓰게 되지 않으리라고 누가 장담하겠습니까..."
 GER_Isolate_lukashenkos_regime: "정권 고립"
 GER_Isolate_lukashenkos_regime_desc: "우리는 그들과의 무역과 경제 협력을 끊고 다른 나라들에게도 같은 일을 요청함으로써, 정권을 세계적, 국제적으로 고립시켜야 합니다."
 GER_Weizsacker_decision: "미래의 육군"
 GER_Weizsacker_decision_desc: "§H미래의 육군(Heer der Zukunft)§!은 연방군의 미래 대응력을 확보하고, 독일의 국가 안보를 수호하며 세계 안정에 기여하는 강력하고 신뢰할 수 있는 군대로 유지하기 위한 총체적 변혁을 의미합니다. 현대화, 유연성, 국제 협력을 수용함으로써 독일 육군은 현재와 미래의 위협에 효과적으로 대처할 태세를 갖추게 됩니다."
 GER_Weizsacker_decision_II: "육군 2010"
 GER_Weizsacker_decision_II_desc: "육군은 창설 이래 여러 차례 구조 개편을 겪었습니다. 가장 최근의 개편은 새로운 국방 정책 지침과 함께 시작되었습니다. 이 개편은 2010년까지 완료될 예정이며 \\"육군 2010\\" 또는 \\"신 육군\\"이라 불립니다. 육군은 개입군, 안정화군, 지원군 등 여러 범주로 나뉩니다."
 GER_Weizsacker_decision_III: "육군 2010"
 GER_Weizsacker_decision_III_desc: "육군은 창설 이래 여러 차례 구조 개편을 겪었습니다. 가장 최근의 개편은 새로운 국방 정책 지침과 함께 시작되었습니다. 이 개편은 2010년까지 완료될 예정이며 \\"육군 2010\\" 또는 \\"신 육군\\"이라 불립니다. 육군은 개입군, 안정화군, 지원군 등 여러 범주로 나뉩니다."
 GER_General_Staff_Course_Hamburg: "함부르크 참모 과정"
 GER_General_Staff_Course_Hamburg_desc: "함부르크의 참모 과정은 연방군 장교를 위한 전문 군사 교육의 정점으로, 군 계층 내에서 고위 전략 및 작전 직책을 맡을 수 있도록 준비시킵니다. 이 엄격한 과정은 군사 전략, 작전술, 합동 및 연합 작전에 관한 고급 주제를 다룹니다. 참가자들은 전략 모의 훈련, 심층 사례 연구, 폭넓은 조사에 참여하며, 연방군 참모부에서 복무하는 데 필요한 분석력과 지도력을 기르는 것을 목표로 합니다. 이 과정은 독일 군대에서 고위 지휘관 및 참모직을 희망하는 장교들에게 필수적입니다."
 GER_Leadership_course_for_officers_Koblenz: "코블렌츠 장교 지도력 과정"
 GER_Leadership_course_for_officers_Koblenz_desc: "코블렌츠의 장교 지도력 과정은 연방군 장교 교육 과정의 핵심 요소입니다. 이 과정은 군 장교에게 요구되는 지도자 자질, 의사 결정 능력, 윤리 기준을 기르는 데 중점을 둡니다. 이론 교육과 실습을 병행하여 참가자들은 다양한 작전 환경에서 병력을 지휘하고, 자원을 관리하며, 규율을 유지하는 방법을 배웁니다. 또한 이 과정은 개인의 책임과 내적 지도(Innere Führung) 원칙을 지도력 실천에 통합하는 것의 중요성을 강조합니다."
 GER_National_Defense_and_Armed_forces_Planning_Course: "국방 및 군 기획 과정"
 GER_National_Defense_and_Armed_forces_Planning_Course_desc: "국방 및 군 기획 과정은 연방군 고위 장교와 국방 관료에게 국방 기획의 복잡한 사항을 교육하기 위해 설계된 전략급 프로그램입니다. 이 과정은 국방 정책, 전력 구조 개발, 군사 능력을 국가 안보 전략에 통합하는 방안 등의 주제를 다룹니다. 참가자들은 국가 이익을 수호하는 데 있어 연방군의 준비 태세와 효율성을 보장하는 데 필요한 기획 절차를 깊이 이해하게 됩니다."
 GER_Operational_leadership_and_command_course: "작전 지도력 및 지휘 과정"
 GER_Operational_leadership_and_command_course_desc: "작전 지도력 및 지휘 과정은 대대 및 여단급 지휘직을 준비하는 연방군 장교를 위한 고급 훈련 프로그램입니다. 이 과정은 복잡하고 역동적인 환경에서의 지도력, 작전 계획, 의사 결정 능력 개발에 중점을 둡니다. 강의실 교육, 워게임, 야외 훈련을 병행하여 참가자들은 압박 속에서도 자원을 관리하고, 병력을 지휘하며, 작전을 효과적으로 수행하는 법을 배웁니다."
 GER_military_intelligence_course: "군사 정보 과정"
 GER_military_intelligence_course_desc: "연방군의 군사 정보 과정은 장교의 분석 및 작전 능력을 개발하기 위해 설계된 전문 훈련 프로그램입니다. 이 과정은 정보 수집 기법, 적 능력 분석, 정보를 작전 계획에 통합하는 방법 등 광범위한 주제를 다룹니다. 참가자들은 전략 정보와 전술 정보를 모두 훈련받으며, 다양한 지휘 단계에서 의사 결정을 뒷받침할 수 있는 실행 가능한 정보를 제공하는 데 중점을 둡니다."
 GER_multinational_planning_seminar: "다국적 기획 세미나"
 GER_multinational_planning_seminar_desc: "다국적 기획 세미나는 독일과 동맹국 장교들의 기획 및 작전 능력을 향상시키기 위한 연방군 대학의 핵심 교육 사업입니다. 이 세미나는 합동 및 연합 작전 기획에 중점을 두며, 참가자들은 다국적 팀으로 활동하여 가상 시나리오에 대한 전략을 수립합니다. 세미나는 다국적 군사 작전을 기획하는 데 있어 상호 운용성, 문화적 이해, 효과적인 의사소통의 중요성을 강조합니다."
 GER_Admiral_staff_course: "제독 참모 과정"
 GER_Admiral_staff_course_desc: "연방군 대학의 제독 참모 과정은 고위 지휘 및 참모직을 준비하는 고위 해군 장교를 위해 설계된 고급 훈련 프로그램입니다. 이 과정은 해군 전략, 작전 계획, 해군 전력 관리에 관한 심층 교육을 제공합니다. 참가자들은 전략 모의 훈련, 지도력 훈련, 해군 역사 및 이론 연구에 참여합니다. 미래의 제독들이 복잡한 해군 작전을 이끌고 국가 및 동맹의 해양 전략 개발에 기여하는 데 필요한 지식과 기술을 갖추도록 하는 것이 목표입니다."
 GER_Multi_national_Maritime_leadership_course: "다국적 해양 지도력 과정"
 GER_Multi_national_Maritime_leadership_course_desc: "다국적 해양 지도력 과정은 여러 회원국 및 파트너 국가 해군 장교들의 지도력을 개발하기 위한 NATO의 전문 훈련 프로그램입니다. NATO 해양 훈련 센터에서 진행되는 이 과정은 참가자들이 다국적 해군 작전을 이끄는 능력을 높이고, 해양 전략을 이해하며, 연합군이 관련된 복잡한 상황을 관리하도록 하는 데 중점을 둡니다. 강의실 교육, 사례 연구, 모의 훈련을 병행하여 참가자들은 다국적 해양 환경에서 지휘하는 데 따르는 과제와 모범 사례에 대한 귀중한 통찰을 얻습니다."
 GER_Launch_small_Trainings_exercise: "지역 훈련 실시"
 GER_Launch_small_Trainings_exercise_desc: "연방군 2개 여단이 참여하는 지역 훈련은 참가 부대의 작전 준비 태세와 상호 운용성을 높이기 위해 설계된 대규모 합동 군사 훈련입니다. 일반적으로 독일의 특정 지역 내에서 실시되며, 기계화 보병, 기갑 부대, 포병 등 다양한 병종 간의 여단급 기동, 전술 작전, 협동에 중점을 둡니다. 현실적인 전투 시나리오를 모의하고, 지휘 통제 능력을 향상시키며, 여단들이 지역적 위협에 신속하고 효과적으로 대응할 준비를 갖추도록 하는 것이 목표입니다."
 GER_Launch_big_Trainings_exercise: "광역 훈련 실시"
 GER_Launch_big_Trainings_exercise_desc: "연방군 4개 여단이 참여하는 광역 훈련은 독일의 여러 지역에 걸쳐 전개되는 더욱 복잡하고 광범위한 군사 작전입니다. 이 훈련은 대규모 편성 부대가 다양한 지형과 환경에서 합동 작전을 수행하고, 공중, 지상, 병참 지원을 통합하는 능력을 시험합니다. 4개 여단이 참여하는 만큼 대규모 협동, 전략적 기동성, 다양한 군사 능력의 통합을 향상시키는 것을 목표로 합니다. 또한 지휘 구조의 효율성과 연방군 부대 간 상호 운용성을 평가하는 장이기도 합니다."
 germany.8.a_desc: "향후 공격을 막기 위해 국내 감시를 강화하고 정보 기관에 대한 자금을 늘립니다. 이 접근법은 위협을 조기에 탐지하고 무력화하는 독일의 능력을 강화하는 데 중점을 둡니다."
 germany.8.b: "통합 및 사회 프로그램에 집중한다"
 germany.8.b_desc: "급진화의 근본 원인을 해결하기 위한 통합 프로그램과 사회 사업에 대한 자금을 확대합니다. 이 접근법은 억압이 아닌 예방을 통해 장기적인 안정을 도모하고자 합니다."
 germany.36.b: "부패를 즉시 해결해야 한다."
 germany.37.b: "스캔들을 내부적으로 수습하려 한다."
 germany.38.b: "곧 잠잠해질 것이다."
 germany.46.t: "요하네스 라우의 베를린 연설"
 germany.46.d: "두려움도 몽상도 없이 - 독일에서 함께 살아가기.\n요하네스 라우는 이 제목으로 베를린 세계문화의 집에서 연설을 했습니다.\n\n현재 700만 명이 넘는 외국인이 독일에 살고 있습니다. 이들은 지난 몇 년간 우리 사회를 변화시켰지만, 이것이 우리나라 사회에 무엇을 의미하는지에 대해서는 너무 적게 생각해 왔습니다. 우리는 앞으로 이러한 질문들과 마주해야 합니다. 정당과 사회단체를 초월하여 공개적으로 논의해야 합니다. 그리고 행동해야 합니다. 두려움도 몽상도 없이 말입니다. 성공하려면 두 가지 주요 장애물을 극복해야 합니다. 하나는 종종 증오와 폭력으로 이어지는 두려움이며, 다른 하나는 서로 다른 문화의 사람들이 만날 때 모든 것이 괜찮은 척하는 외국인에 대한 거짓된 호의라는 몽상입니다.\n\n한 가지 사실을 직시합시다. 다양한 문화와 출신의 사람들이 우리나라로 이주해 오고 있으며, 이는 당분간 바뀌지 않을 것입니다. 따라서 이들의 통합이 우리 모두의 공동 목표가 되어야 합니다. 여러 나라에서 온 노동자들이 없다면 우리 경제는 곧 큰 곤경에 빠질 것입니다. 그들은 세금을 내고 우리의 연금 제도에 재정을 보태기도 합니다. 서로 모두 다르지만 한 가지 공통점이 있습니다. 자발적이든 강제적이든, 일시적이든 영구적이든 모두 독일에서 피난처 또는 고향을 찾고 있다는 것입니다. 각자 자신만의 삶의 이력과 꿈, 문화적·종교적 입장, 그리고 타인을 대하는 자신만의 방식을 가지고 있습니다.\n\n우리는 우리나라의 사회를 만들어 가기 위한 새롭고 단합된 노력이 필요합니다. 우리의 이익과 목표를 정의하고, 통합을 어떻게 형성할지 결정하며, 현실적인 목표를 세웁시다. 교육은 성공적인 통합의 가장 중요한 요건이며, 교육 정책의 필수 부분이 되어야 합니다. 유럽에는 단일한 이민 정책이 필요하지만, 각 나라에는 저마다의 부담도 있습니다. 저는 여러분이 사회에 참여하기를 권합니다. 학교에서, 도시에서, 스포츠 클럽에서 말입니다. 또한 여러분이 독일어를 배우기를 권합니다! 함께 이야기하려면 서로를 이해해야 합니다. 독일에서 태어났거나 이곳에 오는 사람은 독일어를 이해하고 말할 수 있어야 합니다.\n\n이 모든 일에 힘쓸 가치가 있습니다.\n감사합니다."
 germany.46.a: "그의 말이 옳다"
 germany.50.b: "묄레만의 표현의 자유를 옹호한다"
 germany.51.b: "묄레만의 입장을 지지한다"
 germany.52.t: "입장을 고수하는 묄레만"
 germany.52.d: "광범위한 비판에도 불구하고 묄레만은 자신의 발언을 철회하기를 거부합니다. 그는 독일 유대인 중앙위원회 부의장 미하엘 프리드만이 상황을 악화시키고 있다고 비난하며 '미하엘 프리드만 같은 사람들이 보이는 불관용적 행동이 반유대주의의 부상에 일조하고 있습니다.'라고 말했습니다. 이 발언은 긴장을 고조시켰고, 묄레만에게는 노골적인 반유대주의라는 비난이 쏟아졌습니다."
 germany.52.a: "묄레만의 발언과 거리를 둔다"
 germany.52.b: "묄레만을 지지한다"
 germany.53.t: "묄레만 수사"
 germany.53.d: "충격적인 사실이 드러났습니다. 위르겐 묄레만이 신고되지 않은 기부금으로 불법적으로 선거 운동 자금을 조달한 혐의로 수사를 받고 있습니다. 이른바 '검은 돈 사건(Schwarzgeld-Affäre)'은 묄레만이 2002년 선거 당시 반유대주의적 선거 전단 제작에 미신고 기부금을 사용했다는 의혹을 중심으로 합니다. 이러한 행위는 선거 자금법을 위반하며 연방 수사를 촉발했습니다. 묄레만은 의혹을 부인하며 '나는 늘 법을 지켰고 국민의 이익을 위해 행동했습니다. 이것은 나를 겨냥한 정치적 동기의 공격입니다.'라고 주장합니다. 그러나 수사는 강화되고 있으며 증거가 쌓이고 있습니다. 이 사건은 FDP와 묄레만의 명성에 장기적인 타격을 줄 위험이 있습니다."
 germany.53.a: "이러한 행태를 용납하지 않을 것이다"
 germany.53.b: "참 흥미롭군"
 germany.54.t: "치명적인 낙하산 강하"
 germany.54.d: "위르겐 묄레만이 비극적인 낙하산 사고로 사망했습니다. 일부는 사고였다고 주장하지만, 다른 이들은 자살이라고 믿습니다. 그의 죽음은 국가에 충격을 안겼고 논란 많은 그의 유산에 관한 논의를 다시 불러일으켰습니다. 그는 오해받은 정치인이었을까요, 아니면 위험한 사상을 받아들인 사람이었을까요?"
 germany.54.a: "바닥을 쳤다, 땅에 부딪혔다"
 germany.55.t: "묄레만을 비판하는 프리드만"
 germany.55.d: "미하엘 프리드만은 위르겐 묄레만의 발언을 위험할 정도로 반유대주의적이라고 규탄했습니다. 프리드만은 TV 인터뷰에서 '이것은 이스라엘이나 비판에 관한 문제가 아닙니다. 정치적 토론이라는 명분 아래 유대인에 대한 증오를 퍼뜨리는 일입니다.'라고 말했습니다. 그의 발언은 찬사를 받았지만, 극우 단체와 묄레만 지지자들의 표적이 되기도 했습니다."
 germany.55.a: "프리드만의 입장을 지지한다"
 germany.55.b: "중립을 유지한다"
 germany.56.t: "개인적 비행 폭로"
 germany.56.d: "저명한 TV 진행자이자 독일 유대인 중앙위원회 부의장인 미하엘 프리드만이 거대한 스캔들에 휘말렸습니다. 한때 반유대주의에 맞선 열렬한 옹호자였던 프리드만은 이제 마약 사용과 성매매 알선 혐의에 직면해 있습니다. 당국은 그가 성매매 조직 관련과 코카인 구매를 포함한 이러한 불법 행위와 관련하여 파올로 핑켈이라는 가명을 사용했다고 밝혔습니다. 도덕적 인물이라는 공적 이미지와 사적 의혹 사이의 대비는 대중에게 충격을 안겼고, 그의 신뢰도에 깊은 타격을 주었습니다. 그의 정치 및 언론 경력은 이제 풍전등화이며, 옛 동지들은 그와 거리를 두고 있습니다. 프리드만은 유감을 표했으나, 이 스캔들은 그의 명성과 그가 지지했던 대의 모두에 돌이킬 수 없는 손상을 줄 수 있습니다."
 germany.56.a: "프리드만의 행동을 규탄한다"
 germany.56.b: "프리드만을 언론 편향의 희생자로 옹호한다"
 germany.57.t: "한 공인의 몰락"
 germany.57.d: "엄청난 대중의 압박에 직면한 미하엘 프리드만이 모든 공적 직책에서 사임한다고 발표했습니다. 짧은 성명에서 그는 자신의 행동에 대해 유감을 표했지만, 많은 이들이 이를 그의 경력의 끝이라고 말합니다. 이 스캔들은 국내의 많은 반파시즘 및 반인종주의 운동의 신뢰도에 상처를 입혔습니다."
 germany.57.a: "그가 자신의 악마를 이겨내길 바란다"
 germany.58.t: "기회를 이용하는 그들"
 germany.58.d: "마약 및 성매매 스캔들로 미하엘 프리드만이 공개적으로 몰락한 후, 극우 극단주의자들이 이 기회를 틈타 자신들의 음악으로 그를 조롱하고 깎아내리고 있습니다. 여러 극우 작곡가들이 그의 가명 '파올로 핑켈'을 가사 속 우스갯소리로 사용하며 대중적 굴욕을 가중시키고 있습니다. 그러한 도발자 중 한 명인 알려진 우익 작곡가 미하엘 뮐러는 프리드만의 마약 사용과 독일 과거의 비극적 사건을 겨냥한 가사로 크리스마스 캐럴 'Leise rieselt der Schnee'의 불쾌한 패러디를 발표했습니다. 'Leise rieselt der Schnee, nicht viel harmloser als Zyklon B, am Himmel ich Fallschirme seh', Mensch Paolo, das wäre 'ne Spitzenidee.' 또한 예명 기기로 알려진 또 다른 악명 높은 극우 음악가 다니엘 기제는 조롱하는 시구를 지었습니다. 'Wie oft hat Paolo uns schon gewarnt vor Neonazis und Gewalt, aber nicht vor Drogen und Menschenhändlern, und plötzlich kam der Staatsanwalt.' 이 노래들은 네오나치 집단과 온라인 포럼 내에서 퍼지고 있으며, 이미 산산조각 난 프리드만의 명성을 더욱 떨어뜨리고 있습니다. 시민 사회 단체들은 이러한 혐오 발언에 대한 단속을 촉구하고 있지만, 프리드만의 이미지에 입힌 피해는 부정할 수 없습니다."
 germany.58.a: "노래들을 규탄하고 금지한다"
 germany.58.b: "표현의 자유를 이유로 아무 조치도 취하지 않는다"
 germany.59.t: "베이징 주재 독일 대사관으로 도피한 북한 난민들"
 germany.59.d: "북한 난민 21명이 억압적인 북한 정권으로부터 망명을 구하기 위해 과감한 탈출 끝에 베이징 주재 독일 대사관으로 도피했습니다. 송환되면 가혹한 처벌을 받을 것이 뻔한 이들은 한국이나 제3국에서 안전을 찾기를 희망했습니다. 이 장면은 1989년 동독을 탈출하기 위해 프라하 주재 서독 대사관으로 피신한 동독 시민들의 기억을 떠올리게 했습니다. 동독인들이 자유를 위해 프라하 대사관에 몰려들었듯, 이 북한 사람들은 이제 독일에 피난처를 기대하고 있습니다. 그러나 북한의 동맹국인 중국은 이들을 정치적 망명 신청자로 인정하는 것을 주저하고 있어, 독일, 중국, 한국 사이에 외교적 긴장이 조성되고 있습니다."
 germany.59.a: "중국과 이들의 한국행 안전 통행을 위한 비밀 협상을 한다"
 germany.59.b: "망명을 거부하고 난민들을 중국에 돌려보낸다"
 germany.60.t: "미코노스 식탁 스캔들"
 germany.60.d: "2004년 베를린에서 독일 고위 관리들과 이란 정권과 연관된 논란 많은 인물들이 참석한 정치 만찬 행사인 '미코노스 식탁(Mykonos Tafel)'을 둘러싼 논란이 터졌습니다. 이 행사는 베를린의 미코노스 식당에서 일어난 1992년 이란계 쿠르드 야권 지도자 암살 사건과 연관되어 대중의 분노를 샀으며, 이 사건은 10년이 넘도록 독일-이란 관계를 긴장시켰습니다. 이 만찬은 권위주의 정권에 대한 독일의 외교적 입장에 의문을 제기하며 정치적 혼란을 촉발했습니다. 여론은 갈라져 있으며 많은 이들이 해명 또는 제재까지 요구하고 있습니다. 정부는 이 스캔들을 어떻게 처리해야 할까요?"
 germany.60.a: "기로스 > 쿠프테"
 germany.61.t: "킬의 지하실에서 발견된 제2차 세계 대전 전차"
 germany.61.d: "기이한 발견으로, 킬 하이켄도르프의 당국이 어느 개인 주택의 지하실에 숨겨진 완전히 작동하는 제2차 세계 대전 판터 전차와 기타 국방군 시대의 군사 장비를 발견했습니다. 이 발견은 독일의 군사적 과거의 잔재와 그러한 유물을 어떻게 처리해야 하는지에 대한 대중적 논쟁을 촉발했습니다. 또한 군용 등급 장비의 합법적 소유에 대한 의문도 제기되었으며, 소유자가 역사적으로 중요한 수집품일 뿐이라고 주장했음에도 일부는 그가 극우 단체와 연계되었을 가능성을 우려합니다. 정부는 이제 이 상황과 개인 군수품 수집이 갖는 더 넓은 함의를 어떻게 처리할지에 대한 압박을 받고 있습니다."
 germany.61.a: "전차를 압수하고 소유자를 수사한다"
 germany.61.b: "역사적 유물로 취급하고 사건을 축소한다"
 germany.62.t: "우리 잘로의 죽음"
 germany.62.d: "시에라리온 출신 망명 신청자 우리 잘로가 데사우의 감방에서 손발이 묶인 채 불에 타 숨진 채 발견되었습니다. 경찰은 그가 스스로 불을 질렀다고 주장하지만, 수사의 모순점들이 대중의 분노와 책임 규명 요구로 이어졌습니다. 많은 이들이 경찰의 비행이나 구조적 인종차별을 의심합니다. 소요에도 불구하고 실제로 무슨 일이 일어났는지에 대한 의문은 여전히 남아 있으며, 정부는 해명하거나 조치를 취하라는 압박을 받고 있습니다."
 germany.62.a: "그가 스스로 불을 질렀다는 공식 설명을 지지한다"
 germany.62.b: "특이한 가설을 제시한다: 전기 결함이 화재의 원인일 수도 있다"
 germany.62.c: "불운한 사고로 치부하며 사건을 무마한다"
 germany.63.t: "유로 도입"
 germany.63.d: "2002년 1월 1일, 독일은 다른 유로존 회원국들과 함께 유로를 새로운 통화로 공식 채택했습니다. 도이치 마르크에서 유로로의 전환은 유럽 통합을 향한 중요한 발걸음이었습니다. 많은 이들이 단일 통화의 도입을 단결과 경제 협력의 상징으로 축하한 반면, 다른 이들은 인플레이션, 국가 정체성 상실, 독일 경제 주권의 미래에 대한 우려를 표했습니다. 유로를 수용하기로 한 정부의 결정은 유럽 연합 내에서 국가의 역할을 규정하는 결정적인 순간이 되었으며, 경제에 이점과 위험을 모두 안겨 줍니다."
 germany.63.a: "유로를 유럽 통합을 향한 발걸음으로 환영한다"
 germany.63.b: "경제적 이점을 강조하되 우려에도 대응한다"
 germany.63.c: "유로의 장기적 영향에 회의적인 입장을 표명한다"
 germany.64.t: "루트비히스하펜 화재"
 germany.64.d: "2008년 2월, 루트비히스하펜의 한 아파트 건물에서 불이 나 어린이 5명을 포함해 9명이 사망했습니다. 이 건물에는 튀르키예인 가족들이 살고 있었으며, 이 화재가 인종적 증오에 따른 방화의 결과일 수 있다는 의혹이 즉시 제기되었습니다. 튀르키예 정부와 이민자 공동체의 많은 이들이 이 사건에 대한 철저한 조사를 요구했습니다. 화재 원인에 대한 추측이 계속 커지면서 긴장이 고조되었습니다."
 germany.64.a: "방화에 대한 철저한 수사를 개시한다"
 germany.64.b: "대중의 우려를 진정시키는 데 집중한다"
 germany.65.t: "루트비히스하펜 화재 수사 결과"
 germany.65.d: "루트비히스하펜 화재에 대한 철저한 수사 끝에, 당국은 방화를 입증할 증거가 불충분하다고 판단했습니다. 화재가 인종적 동기에 의한 것이라는 초기의 우려에도 불구하고, 수사관들은 가장 가능성 높은 원인이 우발적인 전기 고장이라고 결론지었습니다. 그러나 이러한 결론은 이민자 공동체 일부를 불만스럽게 만들었으며, 이들은 수사가 자신들의 우려를 충분히 다루지 않았다고 믿습니다. 한편 튀르키예 당국자들은 결론이 불분명한 수사 결과에 실망감을 표했습니다."
 germany.65.a: "우발적인 화재였다고 결론 내린다"
 germany.65.b: "수사를 열어 둔 채로 남겨 둔다"
 GER_agrar.1.t: "독일에서 BSE 사례 확인"
 GER_agrar.1.d: "독일에서 소해면상뇌증(BSE)의 첫 사례가 공식 확인되어, 광범위한 영향을 미칠 대형 위기의 시작을 알렸습니다. 이 사태는 오염된 고기를 통한 인체 감염 가능성에 대한 우려가 커지면서 쇠고기 제품의 안전성에 대한 광범위한 우려를 불러일으켰습니다. 농업 부문은 쇠고기 수요 급락이 농민들의 생계를 위협하는 가운데 심각한 경제적 여파에 대비하고 있습니다. 한편 정책 입안자들과 공중 보건 당국자들은 위기에 대처하고, 소비자 신뢰를 회복하고, 추가 확산을 막는 조치를 시행하기 위해 신속하게 행동하라는 압박이 커지고 있습니다. 독일에서의 BSE 확인은 축산업에 대한 중대한 도전일 뿐 아니라, 국가 규제 체계와 위기 관리 능력에 대한 결정적인 시험이기도 합니다."
 GER_agrar.1.a: "위기가 시작된다."
 GER_agrar.1.a_desc: "위기의 시작을 인정하고 그 영향에 대비합니다."
 GER_agrar.2.t: "위기에 어떻게 대응해야 하는가?"
 GER_agrar.2.d: "BSE 위기는 소비자 신뢰가 무너지면서 쇠고기 제품 수요가 급락해 농민들이 고통받는 가운데 농업 부문에 심각한 경제적 피해를 주고 있습니다. 축산업은 붕괴 직전에 놓였으며, 어려움을 겪는 농민을 가장 잘 지원하고 시장을 안정시킬 방법에 대한 시급한 질문이 제기되고 있습니다. 정부는 이제 즉각적인 구제를 제공하고, 식품 안전에 대한 대중의 신뢰를 회복하며, 장기적인 부문 복원력의 토대를 마련하기 위한 선택지를 저울질해야 합니다."
 GER_agrar.2.a: "농민을 지원하기 위해 보조금을 지급한다."
 GER_agrar.2.a_desc: "농업 부문에 대한 즉각적인 재정 지원은 상황을 안정시키고 우리의 대응에 대한 대중의 신뢰를 유지할 것입니다."
 GER_agrar.2.b: "시장이 위기를 해결하도록 둔다."
 GER_agrar.2.b_desc: "정부의 개입을 피하고 시장이 자연스럽게 조정되도록 하지만, 심각한 단기적 결과를 초래할 수 있습니다."
 GER_agrar.3.t: "위기 관리"
 GER_agrar.3.d: "BSE 위기가 계속 헤드라인을 장식하고 시민들 사이에 광범위한 우려를 일으키면서 대중의 압박이 커지고 있습니다. 농업 부문은 심각한 경제적 곤경에 처해 있으며, 식품 안전에 대한 소비자 신뢰는 빠르게 무너지고 있습니다. 정부는 즉각적인 여파와 발병의 근본 원인 모두를 다루며 단호하게 상황을 관리해야 합니다. 신뢰 회복, 피해 농민 지원, 예방 조치 시행 사이에서 적절한 균형을 잡는 것이 커져 가는 이 위기를 효과적으로 헤쳐 나가는 데 필수적입니다."
 GER_agrar.3.a: "원인을 조사하고 해결책을 시행한다."
 GER_agrar.3.a_desc: "위기의 기원에 대한 철저한 조사를 시작하고 향후 재발을 막기 위해 더 엄격한 규제를 도입합니다."
 GER_agrar.3.b: "책임을 영국에 돌린다."
 GER_agrar.3.b_desc: "BSE 확산의 책임이 영국의 느슨한 정책에 있다는 성명을 발표하여 국내 정치적 압박을 줄입니다."
 GER_agrar.4.t: "BSE 위기의 여파"
 GER_agrar.4.d: "즉각적인 위기가 가라앉으면서 정부는 농업 부문의 미래에 관한 중대한 결정에 직면합니다. BSE 발병의 여파는 식품 안전에 대한 대중의 신뢰를 흔들었으며, 가축 생산과 규제 감독에서의 구조적 취약성을 드러냈습니다. 지금은 부문을 안정시키고, 소비자 신뢰를 회복하며, 향후 유사한 위기를 막을 수 있는 개혁을 시행할 기회입니다. 농업 생산의 장기적인 지속 가능성과 복원력을 보장하려면 농민들의 경제 회복과 엄격한 식품 안전 기준 사이에서 균형을 이룬 전략적 조치가 필요합니다."
 GER_agrar.4.a: "보조금을 늘리고 통제를 강화한다."
 GER_agrar.4.a_desc: "더 엄격한 식품 안전 통제에 막대하게 투자하고 농민들의 강력한 회복을 위해 상당한 재정 지원을 제공합니다."
 GER_agrar.4.b: "부문 안정을 위해 최소한의 보조금만 지급한다."
 GER_agrar.4.b_desc: "국가 예산에 과도한 부담을 주지 않으면서 농업 부문을 안정시킬 기본적인 재정 지원을 제공합니다."
 GER_agrar.5.t: "조류 인플루엔자 발병"
 GER_agrar.5.d: "심각한 조류 인플루엔자가 발생하여 전국의 양계 농장으로 빠르게 퍼지고 있습니다. 이 인수공통감염병은 공중 보건과 경제에 이중의 위협이 되고 있으며, 소비자들이 닭고기와 계란 제품을 기피함에 따라 양계 산업은 막대한 손실에 직면해 있습니다. 농민들은 감염된 가축을 살처분하고 추가 확산을 제한하기 위한 생물안전 조치를 시행하느라 고군분투하고 있지만, 발병은 이미 광범위한 피해를 입혔습니다. 정부는 위기의 건강 위험과 경제적 영향 사이에서 균형을 잡으면서도 단호하게 대응하고 가금류 제품의 안전에 대한 신뢰를 회복하라는 압박을 받고 있습니다."
 GER_agrar.5.a: "농민에게 보조금을 지급한다"
 GER_agrar.5.a_desc: "조류 인플루엔자 발병의 영향을 완화하기 위해 정부는 양계 농민에게 직접 재정 지원을 제공할 것입니다. 이는 농업 부문을 안정시키고 가금류 제품에 대한 소비자 신뢰를 회복하는 데 도움이 될 것입니다. 그러나 국고에는 상당한 비용이 듭니다."
 GER_agrar.5.b: "시장이 위기를 해결하도록 둔다"
 GER_agrar.5.b_desc: "정부는 조류 인플루엔자 위기에 직접 개입하지 않고 시장의 힘이 결과를 결정하도록 둘 것입니다. 이 접근법은 정부 지출을 최소화하지만 농업 부문에 장기적인 피해를 줄 위험이 있으며, 무대응으로 비칠 경우 대중의 불만으로 이어질 수 있습니다."
 GER_agrar.6.t: "돼지 인플루엔자 발병"
 GER_agrar.6.d: "돼지 인플루엔자 대유행이 위험한 수준에 이르러 양돈 농장 사이에 퍼지고 있으며, 가축과 인체 건강 모두에 치명적인 영향을 주고 있습니다. 양돈 산업은 혼란에 빠졌으며, 추가 전파를 막기 위해 감염된 동물의 대량 살처분이 진행 중입니다. 인체 감염 사례가 나타나면서 대중의 불안이 커지고 있고 정부 조치를 요구하는 목소리가 높아지고 있습니다. 농업 부문의 경제적 여파를 넘어, 이 발병은 식량 안보와 농업 관행에 대한 신뢰를 위협합니다. 정부는 이제 중대한 결정에 직면했습니다. 어려움을 겪는 양돈 산업을 지원할 것인가, 아니면 엄격한 봉쇄와 감시를 통해 공중 보건을 우선시할 것인가."
 GER_agrar.6.a: "농민에게 보조금을 지급한다"
 GER_agrar.6.a_desc: "정부는 돼지 인플루엔자 발병으로 피해를 입은 양돈 농민에게 긴급 자금을 배정할 것입니다. 이 재정 지원은 부문을 안정시키고 농촌 공동체의 생계를 지원하겠지만, 위기 시에 국가 예산에 추가적인 부담을 줍니다."
 GER_agrar.6.b: "농업보다 공중 보건을 우선시한다"
 GER_agrar.6.b_desc: "농업 산업을 지원하는 대신, 정부는 엄격한 격리와 봉쇄 조치를 통해 공중 보건 위험을 최소화하는 데 집중할 것입니다. 이 전략은 단기적으로 경제적 안정을 희생하지만, 무엇보다 생명을 보호하겠다는 우리의 의지를 보여 줍니다."
 GER_agrar.7.t: "농업 보조금 협상"
 GER_agrar.7.d: "농업 부문은 오랫동안 독일 농촌의 중추로서 식량 안보를 보장하고 지역 경제를 지탱해 왔습니다. 그러나 시장의 변동성, 환경적 과제, 공중 보건 위기가 겹치면서 이 부문은 부담을 받고 있으며, 많은 농민이 불안정한 재정 상황에 처해 있습니다. 국내와 EU 이해관계자 양쪽에서 압박이 커지는 가운데, 정부는 시행할 농업 보조금의 수준을 결정해야 합니다. 이 결정은 수많은 농민의 생계에 영향을 줄 뿐 아니라 농촌 개발, 식품 가격, 예산 안정성에도 오래 지속될 영향을 미칠 것입니다. 각 선택지는 재정적 신중함, 균형 잡힌 지원, 또는 부문의 미래를 보호하기 위한 강력한 개입이라는 서로 다른 우선순위를 반영합니다."
 GER_agrar.7.a: "소규모 보조금을 지급한다"
 GER_agrar.7.a_desc: "제한적인 보조금 프로그램을 시행하면 재정 규율을 유지하면서 어려움을 겪는 농민에게 최소한의 구제를 제공합니다. 이 접근법은 단기적 안정을 보장하지만 농업 부문을 괴롭히는 더 깊은 문제를 해결하지는 못할 수 있습니다."
 GER_agrar.7.b: "중간 규모 보조금을 지급한다"
 GER_agrar.7.b_desc: "중간 규모의 보조금 프로그램은 농업 부문을 돕는 일과 예산 제약을 관리하는 일 사이에서 균형을 잡습니다. 이 접근법은 국고를 압도하지 않으면서 상당한 지원을 제공하는 것을 목표로 합니다."
 GER_agrar.7.c: "대규모 보조금을 지급한다"
 GER_agrar.7.c_desc: "포괄적인 보조금 프로그램은 농업 부문의 필요를 우선시하여 농민에게 상당한 재정적 구제를 제공하고 농촌의 생계를 보장합니다. 그러나 이 전략은 국가 예산에 상당한 부담을 주며 다른 분야의 지출을 제한할 수 있습니다."
 GER_agrar.8.t: "광업 보조금의 미래"
 GER_agrar.8.d: "독일의 광업 부문은 국내 매장량 고갈에서부터 커지는 환경적, 사회적 압박에 이르기까지 점점 커지는 도전에 직면해 있습니다. 광업은 독일의 산업 역사에서 중요한 역할을 해 왔지만, 경제적 타당성은 감소하고 있으며 많은 지역이 운영을 유지하기 위해 보조금에 의존하고 있습니다. 정부는 이제 광업 부문에 대한 지원의 범위를 결정해야 합니다. 이 결정은 에너지 안보, 광업 지역의 고용, 그리고 더 지속 가능한 경제로의 전환에 영향을 미칠 것입니다."
 GER_agrar.8.a: "소규모 보조금을 지급한다"
 GER_agrar.8.a_desc: "최소한의 운영을 유지하고 지역 사회를 지원하되 지역 경제의 다각화를 장려하기 위해 광업 부문에 제한적인 재정 지원을 제공합니다."
 GER_agrar.8.b: "중간 규모 보조금을 지급한다"
 GER_agrar.8.b_desc: "광업 부문을 유지하고 취약 지역의 고용을 안정시키기 위해 적당한 보조금을 배정하여, 경제적 지원과 예산 제약 사이에서 균형을 잡습니다."
 GER_agrar.8.c: "대규모 보조금을 지급한다"
 GER_agrar.8.c_desc: "재정적 부담과 장기적인 환경 문제에도 불구하고, 일자리를 확보하고 에너지 생산을 유지하기 위해 광업 산업에 막대한 보조금을 지급합니다."
 GER_agrar.9.t: "가축 Q열 발병"
 GER_agrar.9.d: "가축의 Q열 감염 보고가 독일 전역으로 퍼지면서 농민과 공중 보건 당국자들 사이에서 우려가 일고 있습니다. *콕시엘라 부르네티* 세균이 일으키는 이 질병은 동물 사이에서 전염성이 매우 높으며 인간에게도 인수공통감염병의 위협이 됩니다. 감염된 동물, 주로 소, 양, 염소는 번식 문제를 겪고 생산성이 크게 저하됩니다. 한편 이 세균에 노출된 사람은 독감과 비슷한 증상을 겪거나 치료하지 않으면 심각한 합병증의 위험이 있습니다. 정부는 발병을 억제하고 농업 경제와 공중 보건을 모두 지키기 위해 신속하게 행동해야 합니다."
 GER_agrar.9.a: "엄격한 격리 조치를 시행한다"
 GER_agrar.9.a_desc: "피해 지역에 격리 구역을 설정하고, 수의 검사를 강화하며 즉각적인 예방 접종 캠페인을 실시합니다. 비용이 많이 들지만 이 접근법은 확산을 제한하고 대중을 안심시킬 것입니다."
 GER_agrar.9.b: "대중 인식과 자발적 조치에 집중한다"
 GER_agrar.9.b_desc: "교육과 자발적 준수에 중점을 둔 덜 제한적인 대응은 당장의 비용을 줄이지만, 발병이 장기화되고 축산업 부문에 대한 경제적 영향이 길어질 위험이 있습니다."
 GER_agrar.9.c: "공황을 피하기 위해 개입을 최소화한다"
 GER_agrar.9.c_desc: "정부의 간섭을 최소화하는 방식은 직접 지출을 줄이지만 추가 확산을 초래해 대중의 신뢰를 훼손하고 위기를 악화시킬 가능성이 있습니다."
 GER_agrar.10.t: "농업을 교란하는 살충제 금지"
 GER_agrar.10.d: "널리 사용되던 살충제의 최근 금지는 독일 농업 부문에 큰 충격을 주었습니다. 이 금지는 해당 화학물질의 해로운 영향으로부터 환경과 공중 보건을 보호하는 것을 목표로 하지만, 농민들은 그 부재에 적응하기 위해 고군분투하고 있습니다. 주요 지역의 작물 수확량은 감소할 것으로 예상되며, 이는 식량 공급망을 위태롭게 하고 많은 이들의 생계를 위협합니다. 정부는 이 전환에서 농민을 지원할지, 아니면 지속 가능하고 화학물질 없는 농업의 장기적 이익을 우선시할지 결정해야 합니다."
 GER_agrar.10.a: "더 안전한 대안에 보조금을 지급한다"
 GER_agrar.10.a_desc: "농민들이 친환경 살충제와 유기농 기술로 전환하도록 재정 지원을 제공합니다. 비용이 많이 들지만 부문을 현대화하고 환경 목표와 부합할 수 있습니다."
 GER_agrar.10.b: "추가 적응을 위해 금지를 유예한다"
 GER_agrar.10.b_desc: "농민들이 적응할 시간을 더 주기 위해 금지의 전면 시행을 연기합니다. 단기적인 혼란은 줄일 수 있지만 환경 단체의 비판을 받을 위험이 있으며 해로운 화학물질의 사용이 길어집니다."
 GER_agrar.10.c: "시장에 맡긴다"
 GER_agrar.10.c_desc: "정부 개입을 피하고 농민들이 독자적으로 적응하도록 둡니다. 정부 지출은 최소화되지만 소규모 농가의 경제적 곤경과 식량 생산 차질의 위험이 있습니다."
 GER_agrar.11.t: "독일에서 H5N8 조류 인플루엔자 발병"
 GER_agrar.11.d: "병원성이 높은 H5N8 조류 인플루엔자의 발병이 독일에서 확인되어, 여러 지역의 양계 농장과 야생 조류에 영향을 미치고 있습니다. 이 질병은 축산 부문에 심각한 위협이 되며, 추가 확산을 막기 위해 가축 무리 전체가 살처분되면서 농민들은 상당한 손실에 직면해 있습니다. H5N8은 인간을 감염시키는 것으로 알려지지 않았지만, 그 경제적, 생태적 영향은 위기를 억제하고 농업 경제를 보호하기 위한 즉각적인 정부 조치를 요구합니다."
 GER_agrar.11.a: "보상과 함께 대규모 살처분을 시작한다"
 GER_agrar.11.a_desc: "감염되었거나 위험에 처한 가축 무리의 살처분을 명령하고 피해 농민에게 재정적 보상을 제공합니다. 이는 바이러스 확산을 제한하지만 높은 경제적 비용이 따릅니다."
 GER_agrar.11.b: "생물안전 조치를 시행한다"
 GER_agrar.11.b_desc: "엄격한 생물안전 규약과 지역 격리에 집중하여 발병 확산을 최소화합니다. 혼란은 적지만 질병에 대한 노출이 장기화될 위험이 있습니다."
 GER_agrar.11.c: "부문이 알아서 처리하게 한다"
 GER_agrar.11.c_desc: "양계 산업이 독자적으로 위기를 관리하도록 하여 정부 지출을 피합니다. 그러나 이 접근법은 부실한 억제로 이어져 경제적, 생태적 피해를 악화시킬 위험이 있습니다."
 GER_agrar.12.t: "독일에서 구제역 발병"
 GER_agrar.12.d: "독일에서 구제역(FMD)의 대규모 발병이 확인되어, 여러 지역의 농장과 야생 동물 개체군에 영향을 미치고 있습니다. 전염성이 매우 높은 이 바이러스성 질병은 발열, 수포, 보행 장애를 특징으로 하며 가축에 심각한 위협이 됩니다. 추가 전파를 막기 위해 가축 떼 전체를 살처분해야 하므로 농민들은 치명적인 손실에 직면해 있습니다. 구제역은 인간을 감염시키지는 않지만 경제적, 생태적 영향이 막대하여, 위기를 완화하고 농업 경제를 보호하기 위한 즉각적인 정부 개입이 필요합니다."
 GER_agrar.12.a: "보상과 함께 대규모 살처분을 시작한다"
 GER_agrar.12.a_desc: "감염되었거나 위험에 처한 가축 떼의 살처분을 명령하고, 피해 농가에 재정적 보상을 제공합니다. 이 방식은 바이러스 확산을 신속히 저지하는 것을 목표로 하지만 막대한 경제적 비용이 따릅니다. 대규모 살처분을 집행하고 공정한 보상을 보장하는 데 따르는 물류상의 어려움이 이 전략을 더욱 복잡하게 만듭니다."
 GER_agrar.12.b: "강화된 생물보안 조치 시행"
 GER_agrar.12.b_desc: "모든 가축 시설에 의무 격리 구역, 이동 제한, 강화된 위생 조치를 포함한 엄격한 생물보안 규정을 시행합니다. 이 방식은 농업 부문의 혼란을 최소화하면서 발병을 억제하는 것을 목표로 하지만, 바이러스 노출 기간이 길어질 수 있으며 철저한 준수와 감시가 필요합니다."
 GER_agrar.12.c: "업계 주도 대응"
 GER_agrar.12.c_desc: "정부의 즉각적인 지출을 피하고, 축산업계가 자체적으로 발병에 대처하도록 허용합니다. 이 전략은 해당 부문이 효과적인 억제 조치를 이행할 수 있는 능력에 달려 있습니다. 그러나 관리가 불충분할 위험이 있으며, 발병이 신속히 통제되지 않으면 경제적·생태적 피해가 악화될 수 있습니다."
 GER_Corruption.01.t: "티센크루프 마린 시스템스 부패 스캔들"
 GER_Corruption.01.d: "독일 조선 산업의 핵심 기업인 티센크루프 마린 시스템스를 둘러싸고 폭발적인 부패 스캔들이 불거졌습니다. 탐사 보도에 따르면 고위 임원들이 수익성 높은 해외 계약을 따내기 위해 뇌물을 제공했으며, 외국 관리들의 공모가 있었을 가능성도 있습니다. 이 폭로는 국민적 분노에 불을 붙였고, 정부에 단호한 조치를 취하라는 압력이 가해지고 있습니다. 철저한 조사는 추가적인 비위를 밝혀낼 수 있으나 티센크루프의 평판과 향후 사업에 타격을 줄 위험이 있습니다. 반면 온건한 처벌은 안정을 유지하면서 대중의 분노를 가라앉힐 수 있습니다. 일부 고위 인사들은 독일 해군 산업의 전략적 이익을 지키기 위해 문제를 조용히 덮어야 한다고 제안합니다. 이 선택은 기업 윤리와 경제적 우선순위에 대한 정부의 입장을 보여줄 것입니다."
 GER_Corruption.01.a: "전면 조사 착수"
 GER_Corruption.01.a_desc: "독립적이고 철저한 조사를 명령하고, 국가 검찰이 스캔들의 모든 세부 사항을 밝혀내도록 권한을 부여합니다. 이 방식은 정의와 책임에 대한 우리의 의지를 국민에게 확신시키겠지만, 국제적인 감시를 불러올 수 있으며 주요 해군 계약에서 티센크루프의 역할을 위태롭게 할 수 있습니다."
 GER_Corruption.01.b: "온건한 처벌 부과"
 GER_Corruption.01.b_desc: "균형 잡힌 처벌을 부과함으로써 티센크루프의 안정을 지키면서도 조치를 요구하는 대중의 목소리를 충족시킬 수 있습니다. 이 방식은 장기간의 조사를 피하고 기업의 평판과 독일 해군 수출 시장에 대한 피해를 제한합니다."
 GER_Corruption.01.c: "'선물' 수용"
 GER_Corruption.01.c_desc: "문제를 못 본 척하면 티센크루프는 아무런 방해 없이 독일 방위 산업에서의 핵심적 역할을 유지할 수 있습니다. 우리 집무실에 은밀히 전달된 '기부'는 민감한 기업 문제를 다룰 때 실용주의가 중요하다는 점을 보여줍니다."
 GER_Corruption.02.t: "KMW 스캔들 적발"
 GER_Corruption.02.d: "독일 최고의 전차 및 장갑차 제조업체인 크라우스마파이 방그만(KMW)이 연루된 충격적인 부패 스캔들이 불거졌습니다. 탐사 보도에 따르면 KMW는 특히 레오파르트 2 전차와 관련한 수익성 높은 계약을 따내기 위해 외국 관리들에게 거액의 뇌물을 제공한 것으로 보입니다. 증거는 중동과 동남아시아를 비롯한 여러 지역에서의 의심스러운 거래를 가리키고 있습니다. 이 의혹은 KMW의 평판을 위태롭게 할 뿐 아니라 방산 수출국으로서의 독일의 신뢰성도 위험에 빠뜨립니다. 이제 정부는 이 스캔들에 어떻게 대처할지 결정해야 합니다. 철저한 조사를 개시할 것인지, 온건한 처벌을 모색할 것인지, 아니면 국익과 경제를 지키기 위해 KMW를 보호할 것인지입니다."
 GER_Corruption.02.a: "전면 조사 착수"
 GER_Corruption.02.a_desc: "포괄적인 조사를 실시하면 KMW에 그 행위에 대한 책임을 물을 수 있으며, 정의를 실현하고 방위 산업에 대한 대중의 신뢰를 회복할 수 있습니다. 그러나 이 방침은 독일의 무기 무역 관계를 훼손할 위험이 있으며 계약 취소로 이어질 수 있습니다."
 GER_Corruption.02.b: "온건한 처벌 부과"
 GER_Corruption.02.b_desc: "균형 잡힌 대응이 필요합니다. 전면적인 조사는 피하면서 KMW의 비위를 처벌하면, 독일의 방산 수출을 심각하게 방해하거나 KMW의 운영 안정성을 위협하지 않으면서 대중의 분노를 가라앉힐 수 있습니다."
 GER_Corruption.02.c: "전략적 이익 우선"
 GER_Corruption.02.c_desc: "KMW는 독일 방위 산업에서 핵심적인 역할을 합니다. 이러한 의혹을 못 본 척하면 회사가 계속 가동될 수 있으며, KMW의 최첨단 기술에 의존하는 동맹국들과의 외교적 파장을 막을 수 있습니다. 투명성보다 안정이 우선되어야 합니다."
 GER_Corruption.03.t: "부패 의혹에 휘말린 라인메탈"
 GER_Corruption.03.d: "독일의 대표적인 방산 업체 중 하나인 라인메탈이 연루된 새로운 부패 스캔들이 전개되고 있습니다. 이 회사가 특히 아프리카와 중동 등 불안정한 지역에서 무기 계약을 따내기 위해 뇌물을 제공했다는 의혹이 제기되었습니다. 이 의혹이 사실로 입증된다면 라인메탈의 사업은 물론 윤리적인 무기 수출국으로서의 독일의 위상에도 광범위한 파장이 미칠 수 있습니다. 대중의 분노가 커지는 가운데, 정부는 이 심각한 주장에 어떻게 대응할지, 그리고 책임 규명과 전략적 안정 중 어느 쪽을 우선할지 결정해야 합니다."
 GER_Corruption.03.a: "전면 조사 요구"
 GER_Corruption.03.a_desc: "심층 조사에 착수하면 투명성과 윤리적 통치에 대한 독일의 의지를 보여줄 수 있습니다. 그러나 이는 라인메탈의 국제적 제휴 관계를 해치고 우리 방위 산업의 세계적 입지를 약화시킬 수 있습니다."
 GER_Corruption.03.b: "벌금 부과 후 다음 단계로"
 GER_Corruption.03.b_desc: "전면적인 조사는 피하고 금전적 처벌을 부과함으로써, 대중의 압력과 독일 산업 이익을 보호해야 할 필요성 사이에서 균형을 맞춥니다. 이 방식은 장기간의 불안정을 막으면서도 부패를 용납하지 않겠다는 신호를 보냅니다."
 GER_Corruption.03.c: "라인메탈의 이익 보호"
 GER_Corruption.03.c_desc: "라인메탈은 독일 방위 역량의 초석입니다. 스캔들의 영향을 완화하고 대중의 검증을 피함으로써, 회사가 우리 군과 해외 파트너를 지원하는 핵심적 역할을 계속 수행하도록 보장합니다."
 GER_Corruption.04.t: "헤클러 운트 코흐, 부패 혐의에 직면"
 GER_Corruption.04.d: "저명한 독일 총기 제조업체 헤클러 운트 코흐가 금수 조치 대상 지역에 불법으로 무기를 판매한 혐의로 조사를 받고 있다는 충격적인 보도가 나왔습니다. 구체적인 의혹은 라틴아메리카와 아프리카의 분쟁 지역으로 소형 화기를 무허가 수출했다는 것입니다. 이러한 행위가 사실로 입증된다면 회사의 미래뿐 아니라 윤리적인 방산 수출에 대한 독일의 약속도 위협받게 됩니다. 정부는 이 회사를 엄중히 단속할 것인지, 아니면 이 핵심 산업의 혼란을 최소화할 것인지 결정해야 합니다."
 GER_Corruption.04.a: "포괄적 단속 착수"
 GER_Corruption.04.a_desc: "전면 조사와 엄중한 처벌은 비윤리적인 무기 거래에 대한 독일의 무관용 정책을 부각시킬 것입니다. 그러나 이러한 조치는 헤클러 운트 코흐의 세계적 계약을 위태롭게 하고 국내 생산을 약화시킬 수 있습니다."
 GER_Corruption.04.b: "벌금 부과 및 감독 복원"
 GER_Corruption.04.b_desc: "금전적 처벌과 더 엄격한 수출 규정을 결합한 온건한 대응은 이 중요한 방산 업체를 지나치게 불안정하게 만들지 않으면서 대중의 비판에 대응할 것입니다."
 GER_Corruption.04.c: "조용히 상황 관리"
 GER_Corruption.04.c_desc: "헤클러 운트 코흐를 강한 감시로부터 보호하면 독일의 총기 생산이 계속 견고하게 유지됩니다. 은밀한 접근은 대중의 소동을 피할 수 있지만, 정부가 공모했다는 비난을 받을 위험이 있습니다."
 GER_Corruption.05.t: "뇌물 스캔들로 조사받는 에어버스 디펜스"
 GER_Corruption.05.d: "독일의 대표적인 항공우주 및 방산 기업 중 하나인 에어버스 디펜스가 연루된 뇌물 의혹이 불거졌습니다. 조사에 따르면 첨단 군사 기술과 항공기 계약을 따내기 위해 외국 관리들에게 불법 자금이 지급된 것으로 보입니다. 사실로 입증된다면 이 스캔들은 에어버스의 국제적 평판을 해칠 뿐 아니라 세계 무기 시장에서의 독일의 신뢰성도 훼손할 수 있습니다. 정부는 투명성과 경제적 이익 사이에서 균형을 맞추도록 신중하게 대응을 가늠해야 합니다."
 GER_Corruption.05.a: "전면적 조사 착수"
 GER_Corruption.05.a_desc: "공개적이고 투명한 조사는 부패를 뿌리뽑겠다는 독일의 의지를 보여주겠지만, 에어버스와의 관계에 긴장을 초래하고 방위 부문의 단기적 안정을 해칠 수 있습니다."
 GER_Corruption.05.b: "벌금 부과 및 수출 정책 재편"
 GER_Corruption.05.b_desc: "막대한 벌금을 부과하고 더 엄격한 수출 통제를 도입하면, 에어버스의 운영을 불안정하게 하거나 세계적 경쟁력을 위태롭게 하지 않고도 대중의 반발에 대응할 수 있습니다."
 GER_Corruption.05.c: "내부적으로 문제 처리"
 GER_Corruption.05.c_desc: "조사를 조용히 관리하여 대중에 대한 노출을 최소화하면, 에어버스 디펜스는 국제적 위상을 유지하고 정부는 가장 가치 있는 방위 파트너를 계속 확보할 수 있습니다."
 germany_party.1.t: "시위 현장의 녹색당 정치인들을 둘러싼 논란"
 germany_party.1.d: "녹색당의 저명한 당원들이 '독일, 이 한심한 쓰레기야', '독일아, 망해라' 같은 선동적인 구호가 내걸린 시위 현장에서 목격된 것으로 알려졌습니다. 이 사건은 광범위한 비판을 불러일으켰으며, 국민적 단결과 정치적 책임에 대한 당의 입장에 의문을 제기하고 있습니다."
 germany_party.1.a: "행위 규탄"
 germany_party.1.a_desc: "이러한 수사는 분열을 조장하고 국민적 단결에 해롭습니다. 우리는 이 구호들을 공개적으로 규탄하고 그러한 정서와 거리를 두며, 존중과 건설적인 정치 담론에 대한 우리의 의지를 재확인할 것입니다."
 germany_party.1.b: "사건 축소"
 germany_party.1.b_desc: "상황을 진정시키기 위해 표현의 자유의 중요성과 시위의 더 넓은 맥락을 강조합니다. 녹색당과의 협력 관계를 지키기 위해 이 사건을 큰 문제로 만들지 않습니다."
 germany_party.2.t: "녹색당 당원들의 특권 남용 의혹"
 germany_party.2.d: "녹색당 정치인들이 공무 중 적립한 마일리지를 개인적으로 사용하는 등 특권을 남용했다고 비난하는 보도가 나왔습니다. 이 주장은 대중의 분노를 불러일으켰으며, 정치 지도자들의 청렴성과 투명성에 대한 우려를 낳고 있습니다."
 germany_party.2.a: "행위 규탄"
 germany_party.2.a_desc: "이러한 행위가 용납될 수 없다고 공개적으로 비난하고 책임의 중요성을 강조합니다. 더 엄격한 감독을 도입하고 특권의 추가 남용이 없도록 내부 검토를 요구합니다."
 germany_party.2.b: "사건 축소"
 germany_party.2.b_desc: "이 사건을 오해로 규정하고, 초점은 당의 정책 성과에 계속 맞춰져야 한다고 강조합니다. 언론의 논란을 부추기지 않음으로써 대중의 신뢰를 유지합니다."
 germany_party.3.t: "녹색당 정치인들에 대한 탈세 의혹"
 germany_party.3.d: "최근 보도들은 녹색당 당원들이 탈세를 저질렀다고 비난하고 있습니다. 이 의혹이 사실로 입증된다면 통치에서 공정성과 투명성을 옹호하는 이들로서의 신뢰성이 훼손될 것입니다."
 germany_party.3.a: "행위 규탄"
 germany_party.3.a_desc: "탈세에 연루된 모든 당원의 행위를 비난합니다. 조사에 전적으로 협조할 것을 공개적으로 약속하고, 정의와 윤리적 행동에 대한 녹색당의 헌신을 지켜냅니다."
 germany_party.3.b: "사건 축소"
 germany_party.3.b_desc: "의혹은 인정하되 이는 개별적인 사례일 뿐임을 강조합니다. 당의 더 넓은 정책 목표에 초점을 맞추고, 이러한 행동이 녹색당 전체를 규정하지 않는다고 주장합니다."
 germany_party.4.t: "녹색당을 겨냥한 논쟁적 의혹 제기"
 germany_party.4.d: "녹색당 당원들과 과거 소아성애 옹호 활동과의 연관성에 관한 과거의 의혹이 다시 불거져 격렬한 대중적 논쟁을 일으켰습니다. 당의 초창기와 관련된 이 주장은 녹색당의 이미지에 도전하며, 중대한 도덕적·윤리적 문제에 대한 입장에 의문을 제기합니다."
 germany_party.4.a: "행위 규탄"
 germany_party.4.a_desc: "역사적 맥락과 관계없이 그러한 행위와의 어떠한 연관이나 지지도 공개적으로 비난합니다. 신뢰를 재건하고 당의 입장을 분명히 하기 위해 투명성과 추가 조사를 약속합니다."
 germany_party.4.b: "사건 축소"
 germany_party.4.b_desc: "이 논란을 먼 과거의 실책으로 인정하는 한편 당의 현재 가치와 정책을 강조합니다. 역사적 논란보다는 현재의 성과에 주목해 달라고 대중에게 촉구합니다."
 germany_party.5.t: "녹색당과 적군파 동조 사이의 논란이 된 연결 고리"
 germany_party.5.d: "녹색당 당원들이 초창기에 적군파(RAF) 테러리스트들에 대한 동조를 표명했을 수 있다는 비난이 제기되었습니다. 이 연관성이 사실이라면 당의 평판이 더럽혀지고 폭력과 극단주의에 대한 입장에 의문이 제기될 수 있습니다."
 germany_party.5.a: "행위 규탄"
 germany_party.5.a_desc: "적군파와 그 폭력 행위에 대한 모든 형태의 동조나 지지를 단호히 거부합니다. 이러한 비난으로부터 당을 공개적으로 분리하고, 민주적 가치와 법치에 대한 녹색당의 의지를 재확인합니다."
 germany_party.5.b: "사건 축소"
 germany_party.5.b_desc: "의혹은 인정하되 녹색당의 변화와 극단주의 이념에 대한 거부를 강조합니다. 당의 현재 성과와 우선순위에 초점을 맞춥니다."
 germany_party.6.t: "FDP 내 부패 스캔들"
 germany_party.6.d: "자유민주당(FDP) 내에 부패가 있다는 보도가 나왔습니다. 당의 핵심 인사들이 개인적 또는 금전적 이득을 위해 영향력을 남용했다는 비난을 받고 있으며, 이는 윤리적 통치에 대한 이들의 의지에 심각한 우려를 불러일으키고 있습니다."
 germany_party.6.a: "행위 규탄"
 germany_party.6.a_desc: "FDP 내의 모든 부패 연루를 공개적으로 비난합니다. 전면 조사를 촉구하고 정치에서 청렴성과 투명성이 중요함을 강조합니다."
 germany_party.6.b: "사건 축소"
 germany_party.6.b_desc: "의혹의 영향을 최소화하고, 과장되었거나 정치적 동기에서 나온 것이라고 시사합니다. FDP의 기여와 더 넓은 정책 성과로 관심을 돌립니다."
 germany_party.7.t: "FDP, 인종차별 의혹에 직면"
 germany_party.7.d: "한 저명한 당원의 발언이 차별적이라고 판단되면서 자유민주당(FDP)이 비판의 도마에 올랐습니다. 이 발언은 분노를 불러일으켰으며, 포용성과 평등에 대한 당의 입장에 의문을 제기하고 있습니다."
 germany_party.7.a: "행위 규탄"
 germany_party.7.a_desc: "발언을 단호히 비난하고 FDP를 모든 형태의 차별적 수사로부터 분리합니다. 사회 모든 부문에서 평등과 다양성을 증진하겠다는 당의 의지를 강조합니다."
 germany_party.7.b: "사건 축소"
 germany_party.7.b_desc: "발언이 맥락에서 벗어나 인용되었거나 잘못 해석되었다고 주장하고, FDP의 더 넓은 의제와 성과로 관심을 돌립니다."
 germany_party.8.t: "FDP, 로비 의혹에 직면"
 germany_party.8.d: "최근 조사에서 FDP 관계자들과 기업 로비 활동 사이의 우려스러운 연결 고리가 드러났습니다. 이러한 폭로는 투명성과 윤리적 통치에 대한 당의 의지에 우려를 불러일으켰습니다."
 germany_party.8.a: "행위 규탄"
 germany_party.8.a_desc: "로비 관행에 대한 연루를 비난하고 공익에 봉사하겠다는 FDP의 의지를 재확인합니다. 투명성을 높이고 대중의 신뢰를 회복하기 위한 조치를 도입합니다."
 germany_party.8.b: "사건 축소"
 germany_party.8.b_desc: "조사 결과가 과장되었다고 설명하고, FDP가 합법적인 관행을 준수하고 있음을 강조합니다. 경제 성장과 혁신을 보장하려는 당의 노력에 초점을 맞추도록 이야기의 틀을 다시 짭니다."
 germany_party.9.t: "FDP 정치자금 스캔들"
 germany_party.9.d: "최근 조사에서 FDP 관계자들과 기업 로비 활동 사이의 우려스러운 연결 고리가 드러났습니다. 이러한 폭로는 투명성과 윤리적 통치에 대한 당의 의지에 우려를 불러일으켰습니다."
 germany_party.9.a: "행위 규탄"
 germany_party.9.a_desc: "로비 관행에 대한 연루를 비난하고 공익에 봉사하겠다는 FDP의 의지를 재확인합니다. 투명성을 높이고 대중의 신뢰를 회복하기 위한 조치를 도입합니다."
 germany_party.9.b: "사건 축소"
 germany_party.9.b_desc: "조사 결과가 과장되었다고 설명하고, FDP가 합법적인 관행을 준수하고 있음을 강조합니다. 경제 성장과 혁신을 보장하려는 당의 노력에 초점을 맞추도록 이야기의 틀을 다시 짭니다."
 germany_party.10.t: "NPD에 대한 방화벽 대신 대화를 택한 FDP"
 germany_party.10.d: "최근 논의에서 FDP 관계자들이 NPD와의 엄격한 분리('방화벽') 대신 대화를 옹호하고 있는 것으로 드러났습니다. 이러한 접근은 극단주의 단체에 대한 당의 입장과 민주적 가치에 대한 의지를 둘러싼 논쟁을 불러일으켰습니다."
 germany_party.10.a: "접근 방식 규탄"
 germany_party.10.a_desc: "NPD와 대화를 하겠다는 결정을 비판하고 민주적 원칙을 수호하겠다는 FDP의 헌신을 재확인합니다. 극단주의에 맞서는 당의 입장을 강화하고 대중의 신뢰를 회복하기 위한 조치를 제안합니다."
 germany_party.10.b: "전략 옹호"
 germany_party.10.b_desc: "대화에 나서는 것이 극단주의에 대처하는 현실적인 접근이라고 주장하고, 합법적이고 민주적인 관행에 대한 FDP의 의지를 강조합니다. 포용적이고 건설적인 정치 담론을 촉진하려는 당의 노력을 부각시킵니다."
 germany_party.11.t: "CDU 로비"
 germany_party.11.d: "최근 조사에서 CDU 관계자들이 연루된 상당한 로비 활동이 드러났습니다. 이 결과는 당의 투명성과 윤리적 통치에 대한 의지에 의문을 불러일으켰습니다."
 germany_party.11.a: "행위 규탄"
 germany_party.11.a_desc: "로비 관행에 대한 연루를 비난하고 공익에 봉사하겠다는 CDU의 의지를 재확인합니다. 투명성을 높이고 대중의 신뢰를 회복하기 위한 조치를 도입합니다."
 germany_party.11.b: "사건 축소"
 germany_party.11.b_desc: "조사 결과가 과장되었다고 설명하고, CDU가 합법적인 관행을 준수하고 있음을 강조합니다. 경제 성장과 혁신을 보장하려는 당의 노력에 초점을 맞추도록 이야기의 틀을 다시 짭니다."
 germany_party.12.t: "공개적으로 드러난 CDU 내부 갈등"
 germany_party.12.d: "최근 언론 보도는 CDU 내부의 갈등이 공개적으로 불거지고 있음을 부각시켰습니다. 이러한 상황은 당의 단결력과 대중 앞에 결속된 모습을 보여줄 능력에 대한 우려를 불러일으켰습니다."
 germany_party.12.a: "공개적 분쟁 규탄"
 germany_party.12.a_desc: "내부 갈등의 공개를 비판하고 문제를 당내에서 해결하는 것이 중요함을 강조합니다. 내부 소통을 강화하고 당의 단결에 대한 대중의 신뢰를 회복하기 위한 조치를 제안합니다."
 germany_party.12.b: "사건 축소"
 germany_party.12.b_desc: "공개적인 분쟁을 민주적 과정의 자연스러운 일부로 설명하고, 투명성과 열린 대화에 대한 CDU의 의지를 강조합니다. 내부 문제를 건설적으로 해결하고 정치 의제에 계속 집중하려는 당의 노력을 부각시킵니다."
 germany_party.13.t: "극우 극단주의 발언으로 적발된 CDU 정치인들"
 germany_party.13.d: "최근 언론 보도는 여러 CDU 정치인들이 극우 극단주의적 발언을 했음을 드러냈습니다. 이러한 폭로는 극단주의에 대한 당의 입장과 민주적 가치에 대한 의지에 우려를 불러일으켰습니다."
 germany_party.13.a: "발언 규탄"
 germany_party.13.a_desc: "극우 극단주의적 발언을 비난하고 민주적 원칙에 대한 CDU의 의지를 재확인합니다. 당내 극단주의에 대처하고 대중의 신뢰를 회복하기 위한 조치를 도입합니다."
 germany_party.13.b: "사건 축소"
 germany_party.13.b_desc: "발언이 개별적인 사건일 뿐이라고 설명하고, 합법적이고 민주적인 관행에 대한 CDU의 전반적인 의지를 강조합니다. 단결과 안정을 증진하려는 당의 노력에 초점을 맞추도록 이야기의 틀을 다시 짭니다."
 germany_party.14.t: "CDU 부패"
 germany_party.14.d: "최근 언론 보도는 CDU 관계자들이 연루된 상당한 부패 행위를 드러냈습니다. 이 결과는 당의 투명성과 윤리적 통치에 대한 의지에 의문을 불러일으켰습니다."
 germany_party.14.a: "행위 규탄"
 germany_party.14.a_desc: "부패 관행에 대한 연루를 비난하고 공익에 봉사하겠다는 CDU의 의지를 재확인합니다. 투명성을 높이고 대중의 신뢰를 회복하기 위한 조치를 도입합니다."
 germany_party.14.b: "사건 축소"
 germany_party.14.b_desc: "조사 결과가 과장되었다고 설명하고, CDU가 합법적인 관행을 준수하고 있음을 강조합니다. 경제 성장과 혁신을 보장하려는 당의 노력에 초점을 맞추도록 이야기의 틀을 다시 짭니다."
 germany_party.15.t: "CDU 검은 비자금"
 germany_party.15.d: "최근 언론 보도는 CDU 내에 '비밀 계좌'가 존재함을 드러냈습니다. 이 계좌들은 신고되지 않은 자금을 관리하는 데 쓰였으며, 당의 재정 투명성과 윤리적 통치에 대한 심각한 우려를 불러일으켰습니다."
 germany_party.15.a: "관행 규탄"
 germany_party.15.a_desc: "비밀 계좌의 사용을 비난하고 재정 투명성과 윤리적 통치에 대한 CDU의 의지를 재확인합니다. 향후 그러한 관행을 방지하고 대중의 신뢰를 회복하기 위한 조치를 도입합니다."
 germany_party.15.b: "사건 축소"
 germany_party.15.b_desc: "비밀 계좌의 사용을 과거의 문제로 설명하고, 합법적인 재정 관행에 대한 CDU의 현재 준수를 강조합니다. 투명성과 책임성을 보장하려는 당의 노력에 초점을 맞추도록 이야기의 틀을 다시 짭니다."
 germany_party.16.t: "언론에 유출된 SPD 내부 문서"
 germany_party.16.d: "최근 언론 보도는 SPD의 내부 문서가 대중에게 유출되었음을 드러냈습니다. 이 사건은 당의 내부 보안과 민감한 정보를 보호할 능력에 대한 우려를 불러일으켰습니다."
 germany_party.16.a: "유출 규탄"
 germany_party.16.a_desc: "내부 문서의 유출을 비난하고 내부 보안을 유지하겠다는 SPD의 의지를 재확인합니다. 향후 유출을 방지하고 대중의 신뢰를 회복하기 위한 조치를 도입합니다."
 germany_party.16.b: "사건 축소"
 germany_party.16.b_desc: "유출을 개별적인 사건으로 설명하고, 투명성과 보안에 대한 SPD의 전반적인 의지를 강조합니다. 문제를 해결하고 내부 절차를 개선하려는 당의 노력에 초점을 맞추도록 이야기의 틀을 다시 짭니다."
 germany_party.17.t: "SPD 정체성 위기"
 germany_party.17.d: "최근 언론 보도는 SPD 내의 정체성 위기를 부각시켰습니다. 이러한 상황은 당의 방향성과 전통적인 지지층과 연결될 수 있는 능력에 대한 우려를 불러일으켰습니다."
 germany_party.17.a: "위기 규탄"
 germany_party.17.a_desc: "SPD 내의 뚜렷한 정체성과 방향성의 부재를 비판하고 당의 핵심 가치와 다시 연결되는 것이 중요함을 강조합니다. 당의 정체성을 강화하고 대중의 신뢰를 회복하기 위한 조치를 제안합니다."
 germany_party.17.b: "사건 축소"
 germany_party.17.b_desc: "정체성 위기를 당이 발전하는 과정의 자연스러운 일부로 설명하고, 변화하는 정치 지형에 적응하려는 SPD의 의지를 강조합니다. 내부의 과제를 해결하고 정치 의제에 계속 집중하려는 당의 노력을 부각시킵니다."
 germany_party.18.t: "SPD 로비 활동"
 germany_party.18.d: "최근 언론 보도는 SPD 관계자들이 연루된 상당한 로비 활동을 드러냈습니다. 이 결과는 당의 투명성과 윤리적 통치에 대한 의지에 의문을 불러일으켰습니다."
 germany_party.18.a: "행위 규탄"
 germany_party.18.a_desc: "로비 관행에 대한 연루를 비난하고 공익에 봉사하겠다는 SPD의 의지를 재확인합니다. 투명성을 높이고 대중의 신뢰를 회복하기 위한 조치를 도입합니다."
 germany_party.18.b: "사건 축소"
 germany_party.18.b_desc: "조사 결과가 과장되었다고 설명하고, SPD가 합법적인 관행을 준수하고 있음을 강조합니다. 경제 성장과 혁신을 보장하려는 당의 노력에 초점을 맞추도록 이야기의 틀을 다시 짭니다."
 germany_party.19.t: "노조와 갈등을 빚는 SPD"
 germany_party.19.d: "최근 언론 보도는 SPD와 여러 노동조합 사이의 갈등을 부각시켰습니다. 이러한 분쟁은 노동 단체와 당의 관계, 그리고 노동자들의 이익을 효과적으로 대변할 능력에 대한 우려를 불러일으켰습니다."
 germany_party.19.a: "갈등 규탄"
 germany_party.19.a_desc: "노조와의 계속되는 분쟁을 비판하고 노동 단체와 강력한 관계를 유지하는 것이 중요함을 강조합니다. 갈등을 해결하고 노동자의 권리에 대한 당의 의지에 대한 대중의 신뢰를 회복하기 위한 조치를 제안합니다."
 germany_party.19.b: "사건 축소"
 germany_party.19.b_desc: "갈등을 건강한 민주적 과정의 일부로 설명하고, 열린 대화와 협상에 대한 SPD의 의지를 강조합니다. 노조의 우려를 건설적으로 해결하고 정치 의제에 계속 집중하려는 당의 노력을 부각시킵니다."
 germany_party.20.t: "SPD의 지켜지지 않은 선거 공약"
 germany_party.20.d: "최근 언론 보도는 SPD가 여러 핵심 선거 공약을 이행하지 못했음을 드러냈습니다. 이러한 상황은 당의 신뢰성과 공약을 이행하려는 의지에 대한 우려를 불러일으켰습니다."
 germany_party.20.a: "지켜지지 않은 공약 규탄"
 germany_party.20.a_desc: "선거 공약을 지키지 못한 점을 비판하고 책임의 중요성을 강조합니다. 향후 공약이 현실적이고 달성 가능하도록 보장하고 대중의 신뢰를 회복하기 위한 조치를 제안합니다."
 germany_party.20.b: "사건 축소"
 germany_party.20.b_desc: "지켜지지 않은 공약을 예상치 못한 난관의 결과로 설명하고, 이러한 문제를 해결하려는 SPD의 노력을 강조합니다. 핵심 가치와 목표에 대한 당의 지속적인 헌신에 초점을 맞추도록 이야기의 틀을 다시 짭니다."
 GER_Diplomacy.1.t: "외국인 투자 제안"
 GER_Diplomacy.1.d: "한 외국 기업이 우리의 사회기반시설을 개발하고 현대화하는 데 중점을 둔 투자 제안을 가지고 접근해 왔습니다. 이 투자는 상당한 경제적 이익을 가져올 수 있지만, 조건이 달려 있기도 합니다. 어떻게 대응해야 할까요?"
 GER_Diplomacy.1.a: "정말 감사합니다!"
 GER_Diplomacy.1.a_desc: "제안을 감사히 수락하여 외국의 영향력이 커질 여지를 열어두는 대신 기반시설 개선을 가속합니다."
 GER_Diplomacy.1.b: "말뿐이 아니라 돈으로 증명하십시오."
 GER_Diplomacy.1.b_desc: "투자자들에게 제안에 전적으로 책임을 지도록 요구하고, 투명성과 현지 이익에 대해 더 엄격한 조건을 보장합니다."
 GER_Diplomacy.2.t: "녹색 금융 구상"
 GER_Diplomacy.2.d: "국제 녹색 금융 구상에 참여하자는 제안이 제기되었습니다. 이 프로그램은 지속 가능한 투자를 촉진하고 더 친환경적인 경제로의 전환을 지원하는 것을 목표로 합니다. 참여는 우리의 환경 분야 신뢰도를 높일 수 있지만 경제적 상충 관계가 따를 수 있습니다."
 GER_Diplomacy.2.a: "구상 수락"
 GER_Diplomacy.2.a_desc: "녹색 금융 구상에 참여하여 기후 변화에 대응하고 지속 가능한 발전을 촉진하려는 세계적 노력에 보조를 맞춥니다."
 GER_Diplomacy.2.b: "구상 거부"
 GER_Diplomacy.2.b_desc: "제안을 거절하고 경제적 유연성을 우선시하며 우리 금융 정책에 대한 잠재적 제약을 피합니다."
 GER_Diplomacy.3.t: "독일과의 전략적 제휴"
 GER_Diplomacy.3.d: "독일이 경제, 방위, 기술 분야 전반에 걸쳐 유대를 강화하기 위한 전략적 동반자 관계의 구축을 제안했습니다. 이 협정은 상당한 이익을 가져올 수 있지만 독일에 대한 우리의 의존도를 높일 수도 있습니다."
 GER_Diplomacy.3.a: "동반자 관계 수락"
 GER_Diplomacy.3.a_desc: "독일과의 유대를 강화하고 최첨단 기술, 경제적 지원, 상호 방위 공약에 대한 접근권을 얻습니다."
 GER_Diplomacy.3.b: "동반자 관계 거절"
 GER_Diplomacy.3.b_desc: "독립을 유지하고 독일의 지원이나 영향력에 지나치게 의존할 때의 잠재적 위험을 피합니다."
 GER_Diplomacy.4.t: "안정을 위한 교육"
 GER_Diplomacy.4.d: "독일이 우리나라의 교육 프로그램을 개선하기 위한 협력 구상을 제안했습니다. 경제적 안정과 사회적 결속을 높이기 위한 직업 훈련과 고등 교육 촉진에 중점을 둡니다. 이 계획은 우리의 노동력에 상당한 이익을 줄 수 있지만 조건이 달려 있을 수도 있습니다."
 GER_Diplomacy.4.a: "독일의 지원 수락"
 GER_Diplomacy.4.a_desc: "우리는 교육 제도를 개선하려는 독일의 도움을 환영하며, 이는 장기적 발전을 촉진하고 외교 관계를 강화할 것입니다."
 GER_Diplomacy.4.b: "구상 거부"
 GER_Diplomacy.4.b_desc: "우리 교육 제도에 대한 통제권을 유지하고 국내 정책에 대한 잠재적 외부 영향을 피합니다."
 GER_Diplomacy.5.t: "국제 교육 프로그램"
 GER_Diplomacy.5.d: "독일이 국제 교육 프로그램을 설립하기 위한 동반자 관계를 제안했습니다. 이 구상은 지식을 교류하고, 교육 접근성을 개선하며, 양국 간의 문화적 이해를 증진하는 것을 목표로 합니다. 이 프로그램은 새로운 기회를 열어줄 수 있지만 교육 기준을 조율하는 데 어려움이 따를 수도 있습니다."
 GER_Diplomacy.5.a: "프로그램 수용"
 GER_Diplomacy.5.a_desc: "이 협력은 교육 기회를 늘리고 독일과의 문화적 유대를 강화할 것입니다."
 GER_Diplomacy.5.b: "제안 거절"
 GER_Diplomacy.5.b_desc: "교육 제도에 대한 자율성을 유지하고 국내 우선순위에 집중합니다."
 GER_Diplomacy.6.t: "교육 내 독일어 보급"
 GER_Diplomacy.6.d: "독일이 독일어 교육을 우리 학교 제도에 통합하려는 구상을 지원하겠다고 제안했습니다. 이 프로그램은 교사, 학습 자료, 문화 교류를 제공하여 독일어 능숙도를 높이고 양국 간의 유대를 강화하는 것을 목표로 합니다."
 GER_Diplomacy.6.a: "구상 시행"
 GER_Diplomacy.6.a_desc: "독일어 프로그램으로 교육 제도를 강화하고 문화적·경제적 연결을 심화합니다."
 GER_Diplomacy.6.b: "제안 거부"
 GER_Diplomacy.6.b_desc: "교육과정의 독립성을 지키고 기존의 언어 우선순위에 집중합니다."
 GER_Diplomacy.7.t: "국제 첨단 기술 협력"
 GER_Diplomacy.7.d: "독일이 재생 에너지, 첨단 제조업, 인공지능 개발을 비롯한 여러 분야에서 첨단 기술 협력을 위한 동반자 관계를 제안했습니다. 이 구상은 지식 공유와 혁신을 가능하게 하고 우리의 기술 역량을 강화할 것입니다."
 GER_Diplomacy.7.a: "이 기회를 잡는다"
 GER_Diplomacy.7.a_desc: "독일과의 협력은 첨단 기술에 대한 접근권을 제공하고 경제 성장의 길을 열어줄 것입니다."
 GER_Diplomacy.7.b: "독립 유지"
 GER_Diplomacy.7.b_desc: "의존을 피하고 국내 기술 역량 개발에 집중합니다."
 GER_Diplomacy.8.t: "적합한 농업 프로그램 시행"
 GER_Diplomacy.8.d: "독일이 첨단 기술, 지속 가능한 방식, 목표를 정한 재정 지원을 통해 우리의 농업 부문을 개선하기 위한 협력을 제안했습니다. 이 프로그램은 생산성을 높이고, 식량 안보를 보장하며, 환경에 미치는 영향을 줄이는 것을 목표로 합니다."
 GER_Diplomacy.8.a: "제안 수락"
 GER_Diplomacy.8.a_desc: "독일과의 협력은 우리의 농업 부문에 혁신을 가져오고 농촌 경제를 강화할 수 있습니다."
 GER_Diplomacy.8.b: "정중히 거절"
 GER_Diplomacy.8.b_desc: "외부의 영향 없이 국내 농업 개혁에 집중합니다."
 GER_Diplomacy.9.t: "독일, 개발 프로젝트를 통한 지원 제안"
 GER_Diplomacy.9.d: "독일이 다양한 개발 프로젝트를 통해 우리를 지원하겠다는 제안을 해왔습니다. 이 제안에는 지속 가능한 발전과 경제 성장을 촉진하기 위한 기술 지원, 자금, 전문 지식이 포함됩니다. 구체적으로 독일의 지원은 재생 에너지 프로젝트, 기반시설 개발, 의료 개선, 교육 구상 등의 분야를 아우를 것입니다. 독일과 협력함으로써 우리는 첨단 기술, 모범 사례, 그리고 장기적 개발 목표를 달성하는 우리의 역량을 크게 높일 수 있는 풍부한 경험에 접근할 수 있습니다. 또한 이 동반자 관계는 무역과 투자의 새로운 기회를 열어, 독일 및 더 넓은 유럽 공동체와의 경제적 유대를 더욱 강화할 수 있습니다."
 GER_Diplomacy.9.a: "제안 수락"
 GER_Diplomacy.9.a_desc: "독일의 지원을 환영하고 국제 협력이 우리의 개발 목표에 미치는 긍정적 영향을 강조합니다. 핵심 분야의 발전을 가속하기 위해 첨단 기술과 전문 지식에 접근할 때의 이점을 부각시킵니다."
 GER_Diplomacy.9.b: "제안 거부"
 GER_Diplomacy.9.b_desc: "자립의 중요성과 개발 구상에 대한 완전한 통제권을 유지하는 것의 중요성을 강조하며 독일의 지원을 정중히 거절합니다. 독자적인 노력을 통해 지속 가능한 성장을 달성하겠다는 우리의 의지에 초점을 맞추도록 이야기의 틀을 다시 짭니다."
 GER_Diplomacy.10.t: "독일 연방 대외무역청 확대"
 GER_Diplomacy.10.d: "독일 연방 대외무역청이 사업을 확대하고 다양한 개발 프로젝트를 통해 우리를 지원하겠다는 계획을 발표했습니다. 이 확대에는 지속 가능한 발전과 경제 성장을 촉진하기 위한 강화된 기술 지원, 늘어난 자금, 전문 지식에 대한 접근이 포함됩니다. 청의 지원은 재생 에너지 프로젝트, 기반시설 개발, 의료 개선, 교육 구상 등 핵심 분야를 아우를 것입니다. 독일 연방 대외무역청과 협력함으로써 우리는 우리의 개발 목표를 크게 끌어올릴 수 있는 첨단 기술, 모범 사례, 풍부한 경험의 혜택을 누릴 것입니다. 또한 이 협력은 무역과 투자의 새로운 기회를 열어, 독일 및 더 넓은 유럽 공동체와의 경제적 유대를 더욱 강화할 것으로 기대됩니다."
 GER_Diplomacy.10.a: "제안 수락"
 GER_Diplomacy.10.a_desc: "독일 연방 대외무역청의 지원을 환영하고 국제 협력이 우리의 개발 목표에 미치는 긍정적 영향을 강조합니다. 핵심 분야의 발전을 가속하기 위해 첨단 기술과 전문 지식에 접근할 때의 이점을 부각시킵니다."
 GER_Diplomacy.10.b: "제안 거부"
 GER_Diplomacy.10.b_desc: "자립의 중요성과 개발 구상에 대한 완전한 통제권을 유지하는 것의 중요성을 강조하며 독일 연방 대외무역청의 지원을 정중히 거절합니다. 독자적인 노력을 통해 지속 가능한 성장을 달성하겠다는 우리의 의지에 초점을 맞추도록 이야기의 틀을 다시 짭니다."
 GER_Diplomacy.11.t: "독일, 장기 자원 수입 계약에 대한 투자 제안"
 GER_Diplomacy.11.d: "독일이 자원 수입을 위한 장기 계약에 투자하겠다는 제안을 해왔습니다. 이 제안에는 필수 자원의 안정적인 공급을 확보하고, 경제적 안정을 촉진하며, 양국 무역 관계를 강화하기 위한 금융 투자와 약속이 포함됩니다. 구체적으로 독일의 투자는 에너지, 원자재, 농산물과 같은 핵심 자원에 집중될 것입니다. 이러한 장기 계약을 확보함으로써 우리는 산업과 기반시설을 뒷받침할 필수 자원의 안정적인 흐름을 보장할 수 있습니다. 또한 이 협력은 합작 사업과 기술 교류로 이어져 우리의 경제적·기술적 역량을 더욱 강화할 수 있습니다. 독일과의 동반자 관계는 새로운 일자리 기회를 창출하고, 우리의 자원 관리 전략을 강화하며, 전반적인 경제 성장에 기여할 것으로 기대됩니다. 더욱이 이 조치는 유럽을 대표하는 경제 대국 중 하나와의 무역 관계를 공고히 하여 추가적인 협력과 상호 이익의 문을 열어줄 것입니다."
 GER_Diplomacy.11.a: "제안 수락"
 GER_Diplomacy.11.a_desc: "독일의 투자 제안을 환영하고 장기적인 자원 공급을 확보할 때의 이점을 강조합니다. 경제적 안정에 미치는 긍정적 영향과 양국 무역 관계 강화의 잠재력을 부각시킵니다."
 GER_Diplomacy.11.b: "제안 거부"
 GER_Diplomacy.11.b_desc: "자립의 중요성과 자원 공급망에 대한 통제권을 유지하는 것의 중요성을 강조하며 독일의 투자 제안을 정중히 거절합니다. 독자적인 노력을 통해 자원 안보를 달성하겠다는 우리의 의지에 초점을 맞추도록 이야기의 틀을 다시 짭니다."
 GER_Diplomacy_answer.1.t: "우리 제안을 수락한 [From.GetNameDef]"
 GER_Diplomacy_answer.1.d: "외무장관이 [From.GetNameDef] 정부가 우리의 후한 제안을 수락했으며 앞으로의 협력을 고대하고 있다고 보고합니다. 이번 진전은 양국 관계에서 중요한 단계이며 두 나라 모두에게 새로운 기회를 열어줍니다. 공동 협력은 진보와 번영을 촉진할 것입니다."
 GER_Diplomacy_answer.1.a: "확인했다"
 GER_Diplomacy_answer.2.t: "우리 제안을 거부한 [From.GetNameDef]"
 GER_Diplomacy_answer.2.d: "외무장관이 [From.GetNameDef] 정부가 우리의 후한 제안을 거절했다고 보고합니다. 그럼에도 불구하고 우리는 굳건한 외교 관계를 증진하고 향후 협력의 기회를 모색하겠다는 의지를 유지합니다. 우리는 [From.GetNameDef]의 결정을 존중하며, 장기적으로 양국 모두에 이익이 되는 공동의 목표를 향해 계속 노력할 것입니다."
 GER_Diplomacy_answer.2.a: "확인했다"
 germany_foci.1.t: "유로파이터 보완 체계"
 germany_foci.1.d: "유로파이터의 도입으로 연방방위군은 수십 년간 복무해 온 노후 F-4 팬텀 전투기를 점차 퇴역시키며 공군력의 새로운 시대를 열고 있습니다. 이러한 전환은 기술, 성능, 작전 유연성의 중대한 향상을 의미합니다. 그러나 함대 현대화가 계속되는 가운데, 중대한 의문이 떠오릅니다. 루프트바페가 방공의 최첨단을 유지하려면 다음 단계는 무엇이어야 할까요? 유로파이터를 보완할 최신식 신규 항공기 체계를 도입하는 데 투자해야 할까요, 아니면 개량과 운용 기간 연장을 통해 극대화할 수 있는 토네이도 함대의 미개척 잠재력이 아직 남아 있다고 보아야 할까요? 이 결정은 루프트바페의 미래 작전 능력을 결정할 뿐 아니라 앞으로 수년간 독일 공군력의 전략적 방향도 결정할 것입니다."
 germany_foci.1.a: "토네이도는 여전히 쓸 만한 전투기이며 가장 저렴한 선택지이기도 하다"
 germany_foci.1.b: "새로운 체계가 우리에게 큰 도움이 될 것이다"
 germany_foci.2.t: "유로파이터 보완 체계"
 germany_foci.2.d: "연방방위군이 공군 현대화를 계속하는 가운데, 중대한 결정이 눈앞에 놓여 있습니다. 어떤 체계가 유로파이터의 능력을 가장 잘 보완할 것인가? 이 선택은 단순한 기술의 문제가 아닙니다. 점점 복잡해지는 세계 안보 환경 속에서 독일의 방공이 견고하고 다재다능하게 유지되도록 보장하는 문제입니다. 적합한 보완 체계는 유로파이터의 강점을 강화하고, 능력의 공백을 메우며, 루프트바페가 제공권 장악에서 지상 공격에 이르기까지 광범위한 임무에 대응할 수 있는 유연성을 갖추게 해야 합니다. 첨단 스텔스와 다목적 능력을 갖춘 신규 항공기를 선정하는 것이든, 토네이도와 같은 기존 플랫폼을 개량하는 것이든, 이 결정은 독일 공군의 미래 작전 준비 태세와 전략적 태세에 지속적인 영향을 미칠 것입니다."
 germany_foci.2.a: "F-15 이글"
 GER_F_15_TT: "중폭탄과 첨단 미사일을 포함해 다양한 무장을 탑재할 수 있는 능력 덕분에, §YF-15§!는 종심 타격이나 대함 작전처럼 상당한 화력이 필요한 임무를 맡아 유로파이터의 더 기민한 교전 방식을 보완할 수 있습니다."
 germany_foci.2.b: "F-16 파이팅 팰컨"
 GER_F_16_TT: "§YF-16§!은 공대지 임무에서 강력한 실적을 보유한 다재다능한 다목적 전투기입니다. 이 기체는 루프트바페에 비용 효율적인 근접항공지원, 지상 공격, 방공망 제압 플랫폼을 제공하여, 제공권 장악에 특화된 유로파이터를 보완해 줄 것입니다."
 germany_foci.2.c: "JAS 39 그리펜"
 GER_Gripen_TT: "§YJAS 39 그리펜§!은 뛰어난 기동성과 현대 전장 적응성을 갖추도록 설계된, 활용도가 매우 높고 비용 효율적인 다목적 전투기입니다. 첨단 항전 장비, 효율적인 연료 소모, 광범위한 무장과의 호환성을 갖추어 방공, 근접 항공 지원, 정찰 임무에 신뢰할 만한 대안을 제공합니다. 짧은 이착륙 능력 덕분에 분산된 항공 작전에 적합하며, 우리 공군의 유연성을 높여줍니다."
 germany_foci.2.e: "미라주 2000-5F"
 GER_Mirage_TT: "§Y미라주 2000-5F§!는 공대공, 공대지, 정찰 임무를 효과적으로 수행할 수 있는 진정한 다목적 전투기입니다. 필요하다면 핵 타격 임무를 포함해 더 광범위한 임무 유형을 맡아 유로파이터를 보완할 것입니다."
 germany_foci.3.t: "전략적 투자 항공기 결정"
 germany_foci.3.d: "제한된 예산이라는 제약을 고려할 때, 가장 큰 전략적 이점을 제공할 우리 항공 능력의 한 분야에 투자를 집중하는 것이 필수적입니다. 각 선택지(AWACS, 수송기, 해상 초계기)는 저마다 뚜렷한 이점을 제공하지만, 올바른 선택을 하려면 현재와 미래의 작전 요구, 그리고 그것이 연방방위군의 전반적인 효율성을 어떻게 높일지를 신중히 고려해야 합니다."
 germany_foci.3.a: "전략 및 전술 기동성"
 GER_Transport_TT: "독일이 평화 유지에서 재난 구호에 이르기까지 국제 임무에 점점 더 많이 관여함에 따라, 유능한 수송 함대는 필수적입니다. 이는 우리가 전력을 투사하고, 작전을 지속하며, 국제 파트너에 대한 약속을 효과적으로 이행할 수 있도록 보장할 것입니다."
 germany_foci.3.b: "향상된 상황 인식"
 GER_AWACS_TT: "AWACS 플랫폼은 포괄적인 영공 감시, 조기 경보, 지휘 통제 능력을 제공하는 데 매우 중요합니다. AWACS에 투자하면 지상 기반 레이더 체계의 도달 범위를 훨씬 넘어서는 위협을 탐지하며 전장 공간을 감시하고 관리하는 능력이 크게 향상될 것입니다."
 germany_foci.3.c: "해상 감시 및 방어"
 GER_Naval_TT: "해상 초계기는 우리의 해양 이익을 감시하고 방어하는 데 매우 중요합니다. 대잠수함전, 해상 정찰, 수색 및 구조 작전에서 필수적인 능력을 제공합니다. 해상 초계기에 투자하면 핵심 해상 교통로를 보호하고, 해상 위협을 억제하며, 국제 해양 안보에 기여하는 우리의 능력이 향상될 것입니다."
 germany_foci.4.t: "연방방위군에 적합한 수송기 선정"
 germany_foci.4.d: "연방방위군이 2000년대 초 공중 수송 능력의 현대화를 모색함에 따라, 중대한 결정이 내려져야 합니다. 어떤 수송기가 독일 육군의 요구를 가장 잘 충족하고 작전 효율성을 높일 수 있을까요? 검증된 C-130J 슈퍼 허큘리스를 계속 운용하는 것, 더 큰 C-17 글로브마스터 III를 도입하는 것, 또는 유럽의 A400M 프로젝트 개발에 투자하는 것, 이 각각의 선택지는 저마다 뚜렷한 장점과 과제를 안고 있습니다. 지금 내리는 선택은 향후 수십 년간 연방방위군의 공수 능력을 결정할 것입니다."
 germany_foci.4.a: "C-130J 슈퍼 허큘리스"
 GER_Hercules_TT: "§YC-130J 슈퍼 허큘리스§!는 오랜 세월 검증된 주력 기종의 현대적 개량형입니다. 내구성과 다용도성으로 잘 알려진 슈퍼 허큘리스는 전 세계 전술 공수 작전의 중추 역할을 해 왔습니다. 짧은 이착륙(STOL) 능력이 요구되는 임무에 적합하여 열악한 환경에서의 작전에 이상적입니다."
 germany_foci.4.b: "C-17 글로브마스터 III"
 GER_Globemaster_TT: "§YC-17§!에 투자하면 전 세계에 전력을 투사하는 독일의 능력이 크게 향상되어, 연방방위군이 전 세계 어디에서든 최소한의 지연으로 NATO 작전이나 인도주의 임무를 지원할 수 있게 됩니다."
 germany_foci.4.c: "A400M 프로젝트"
 GER_A400M_TT: "§YA400M 프로젝트§!에 투자함으로써 독일은 먼 미래까지 운용되도록 설계된 차세대 항공기를 도입하게 됩니다. 이 항공기는 전술 공수와 전략 공수 사이의 간극을 메우는 현대적이고 유능한 해법을 제공하여, 연방방위군이 다양한 임무 상황에서 기민성과 능력을 유지하도록 보장할 것입니다."
 germany_foci.5.t: "연방방위군에 적합한 AWACS 플랫폼 선정"
 germany_foci.5.d: "공중조기경보통제체계(AWACS)에 투자하기로 한 결정을 진행하면서, 우리는 이제 중대한 선택에 직면했습니다. 스웨덴의 S-100B 아르구스를 택해야 할까요, 아니면 미국의 E-3 센트리를 택해야 할까요? 이 결정은 영공 감시, 지휘 통제, 전반적인 상황 인식에서 우리의 미래 능력에 상당한 영향을 미칠 것입니다."
 germany_foci.5.a: "E-3 센트리"
 GER_sentry_TT: "§Y미국의 E-3 센트리§!는 전 세계에서 성공적인 작전을 오랫동안 수행해 온 확고한 AWACS 플랫폼입니다. 더 큰 레이더와 센서 구성은 비할 데 없는 영공 포괄 및 추적 능력을 제공하여, NATO와 동맹국 공중 작전의 초석이 되고 있습니다."
 germany_foci.5.b: "S-100B 아르구스"
 GER_Argus_TT: "§YS-100B§!는 유럽 방위 협력을 강화한다는 우리의 목표와 부합할 것입니다. 또한 유사한 체계를 운용할 수 있는 다른 유럽 국가들과의 상호 운용성을 원활하게 하여 공동 작전과 지역 안보 구상을 촉진할 것입니다."
 germany_foci.6.t: "연방방위군에 적합한 해상 초계기 선정"
 germany_foci.6.d: "해상 초계 능력 강화에 집중하기로 결정한 만큼, 우리는 이제 중대한 선택에 직면했습니다. 프랑스의 아틀랑티크 2를 택해야 할까요, 아니면 미국의 P-3 오리온을 택해야 할까요? 각 항공기는 뚜렷한 이점을 제공하며, 우리의 해양 이익을 지키고, 해상 교통로를 감시하며, 연안 해역의 안보를 보장하는 데 핵심적인 역할을 할 것입니다."
 germany_foci.6.a: "P-3 오리온"
 GER_Orion_TT: "§YP-3 오리온§!은 첨단 레이더, 소나, 전자 감시 체계를 포함한 견고한 센서 구성을 갖추고 있습니다. 특히 잠수함을 탐지하고 추적하는 데 효과적이어서, 전략적 해상 구역의 통제권을 유지하고 수중 위협을 감시하는 데 핵심적인 자산입니다."
 germany_foci.6.b: "아틀랑티크 2"
 GER_Atlantic_TT: "§Y아틀랑티크 2§!를 선택하면 유럽 방위 협력에 대한 독일의 의지가 강화되며, 다른 유럽 해군들과의 상호 운용성이 보장됩니다. 유럽 방위 구상과의 이러한 보조는 공동 작전, 훈련, 공동 군수 지원을 촉진하여 지역 안보를 더욱 강화할 수 있습니다."
 germany_foci.7.t: "미래 군용 차량의 주 전자장비 생산업체 선정"
 germany_foci.7.d: "군 현대화가 진행됨에 따라, 독일은 차세대 주력 전차(MBT), 장갑차(APC), 보병전투차(IFV) 사업의 전자 부품을 담당할 주 생산업체를 선정해야 합니다. 공급업체의 선택은 이러한 첨단 체계의 기술적 역량, 신뢰성, 통합에 영향을 미칠 것입니다. 세 선도 기업(보슈, 아틀라스 엘렉트로닉, 로데 운트 슈바르츠)이 검토되고 있습니다. 각 기업은 군용 전자 분야에서 고유한 강점과 경험을 제공합니다. 이 결정은 우리 군의 작전 효율성과 기술적 우위의 미래를 결정할 것입니다..."
 germany_foci.7.a: "보슈를 주 생산업체로 선정"
 germany_foci.7.a_desc: "보슈는 혁신성과 신뢰성으로 정평이 난, 세계적으로 인정받는 자동차 전자 분야의 선두 기업입니다. 보슈를 선택하면 전자 체계에 대한 폭넓은 경험을 활용하여 군용 차량에 첨단 기술과 믿을 만한 품질을 제공할 수 있습니다. 탄탄한 산업 기반과 연구 역량은 지속적인 기술 발전과 방위 사업에 대한 견고한 지원을 보장할 것입니다."
 germany_foci.7.b: "아틀라스 엘렉트로닉을 주 생산업체로 선정"
 germany_foci.7.b_desc: "아틀라스 엘렉트로닉은 방위 및 해양 전자 분야에 특화되어 있으며, 복잡한 군사 체계에서 수십 년의 경험을 갖추고 있습니다. 아틀라스를 선택하면 독일은 특히 통신 및 센서 체계에서 군용 기술에 대한 검증된 실적의 혜택을 누릴 것입니다. 군사적 응용에 초점을 맞춘 덕분에, 우리의 MBT, APC, IFV는 전투 환경에 맞춰 설계된 최첨단 전자장비를 갖추게 될 것입니다."
 germany_foci.7.c: "로데 운트 슈바르츠를 주 생산업체로 선정"
 germany_foci.7.c_desc: "로데 운트 슈바르츠는 보안 통신과 전자전 체계 분야의 선두 기업입니다. 이들과 제휴하면 우리 군용 차량에 전장 인식과 전자 방어에 필수적인 최첨단 통신 및 레이더 기술을 제공할 수 있습니다. 안전하고 회복력 있는 체계에 대한 이들의 전문성은 우리 군의 작전 보안과 효율성을 크게 높일 것입니다."
 germany_foci.8.t: "미래 군용 차량의 엔진 제작업체 선정"
 germany_foci.8.d: "군 지상 차량 현대화 노력의 일환으로, 독일은 차세대 주력 전차(MBT), 장갑차(APC), 보병전투차(IFV) 사업의 주 엔진 제작업체를 선택해야 합니다. 이 선택은 우리의 미래 장갑차량의 성능, 신뢰성, 효율성에 상당한 영향을 미칠 것입니다. 세 저명한 기업(MAN, RENK, MTU)이 검토되고 있으며, 각 기업은 엔진 기술과 공학적 우수성에서 뚜렷한 이점을 제공합니다. 선정된 기업은 우리 군의 차세대 전투 차량에 동력을 공급하는 데 핵심적인 역할을 할 것입니다..."
 germany_foci.8.a: "MAN을 엔진 제작업체로 선정"
 germany_foci.8.a_desc: "MAN은 상업용 및 중장비 용도로 널리 쓰이는 견고하고 효율적인 디젤 엔진으로 명성이 높습니다. MAN을 선택하면 우리 군용 차량이 검증된 신뢰성, 연료 효율, 확립된 공급망의 혜택을 누릴 수 있습니다. 민수 및 군수 시장 모두를 위한 고성능 엔진을 생산한 폭넓은 경험은 이들을 우리의 차세대 장갑차량에 동력을 공급할 유력한 후보로 만듭니다."
 germany_foci.8.b: "RENK를 엔진 제작업체로 선정"
 germany_foci.8.b_desc: "RENK는 변속기 및 추진 체계에 고도로 특화되어 있으며, 군사적 용도를 위한 최첨단 솔루션을 제공합니다. RENK를 선택함으로써 우리는 첨단 변속 체계와 매끄럽게 통합되어 성능과 기동성을 최적화하는 최신 엔진 기술에 투자하게 될 것입니다. 군용 엔진 체계에 대한 이들의 전문성은 우리 차량에 현대전에 필요한 힘과 회복력을 제공할 것입니다."
 germany_foci.8.c: "MTU를 엔진 제작업체로 선정"
 germany_foci.8.c_desc: "MTU는 군수와 상업 부문 모두에서의 혁신으로 잘 알려진 고성능 엔진 분야의 선두 기업입니다. MTU를 선택하면 세계에서 가장 앞선 전차와 군용 차량 일부에 엔진을 공급해 온 이력을 바탕으로 우리 장갑차량에 비할 데 없는 출력과 신뢰성을 가져올 수 있습니다. 지속적인 기술 발전에 대한 이들의 헌신은 우리 차량이 미래의 작전 과제에 대응하는 데 필요한 엔진 성능을 갖추도록 보장할 것입니다."
 germany_foci.9.t: "미래 군용 차량의 광학장비 공급업체 선정"
 germany_foci.9.d: "차세대 주력 전차(MBT), 장갑차(APC), 보병전투차(IFV)에 가능한 최고의 표적 획득 및 감시 능력을 갖추기 위해, 독일은 주 광학장비 공급업체를 선정해야 합니다. 첨단 광학장비는 전장 인식, 정밀 표적 획득, 야간 투시 능력을 높이는 데 매우 중요합니다. 세 선도 기업(칼 차이스, EMT 펜츠베르크, 헨솔트)이 검토되고 있으며, 각 기업은 광학 기술에서 고유한 강점을 제공합니다. 선정된 공급업체는 우리 차량이 현대전에 대비한 최첨단 시각 체계를 갖추도록 보장하는 데 핵심적인 역할을 할 것입니다..."
 germany_foci.9.a: "칼 차이스를 광학장비 공급업체로 선정"
 germany_foci.9.a_desc: "칼 차이스는 비할 데 없는 선명도와 정확도를 제공하는 고정밀 광학 기기로 명성이 높습니다. 칼 차이스를 선택하면 우리 군용 차량은 우수한 표적 획득과 정찰 능력을 제공하는 세계적 수준의 광학장비의 혜택을 누릴 것입니다. 광학 기술 혁신에 대한 차이스의 오랜 역사는 공격과 방어 작전 모두에 중요한 시야 거리와 정확도에서 우리 군이 상당한 우위를 점하도록 보장합니다."
 germany_foci.9.b: "EMT 펜츠베르크를 광학장비 공급업체로 선정"
 germany_foci.9.b_desc: "EMT 펜츠베르크는 군사적 용도에 맞춰 설계된 혁신적인 감시 및 정찰 체계에 특화되어 있습니다. EMT 펜츠베르크를 선택하면 전장에서의 상황 인식을 높이도록 설계된 최첨단 솔루션을 도입하게 됩니다. 이들의 첨단 광학장비와 견고한 통합 능력은 우리 차량이 현대전에 필수적인 최신 정찰 및 표적 식별 기술을 갖추도록 보장할 것입니다."
 germany_foci.9.c: "헨솔트를 광학장비 공급업체로 선정"
 germany_foci.9.c_desc: "헨솔트는 첨단 광학장비와 센서 솔루션에 중점을 둔 방위 전자 분야의 선두 기업입니다. 헨솔트를 선택하면 우리 군용 차량에 적외선, 야간 투시, 열화상 분야의 최신 기술 발전을 접목한 최첨단 조준 체계를 제공할 수 있습니다. 통합 센서 솔루션 개발에 대한 이들의 전문성은 가장 까다로운 환경에서도 우리 군이 탐지와 교전에서 결정적인 우위를 점하도록 보장합니다."
 germany_foci.10.t: "미래 군용 차량의 C4ISR 공급업체 선정"
 germany_foci.10.d: "군 현대화 계획의 일환으로, 차세대 주력 전차(MBT), 장갑차(APC), 보병전투차(IFV)의 C4ISR 체계를 담당할 주 공급업체를 선정하는 일은 매우 중요합니다. 이 체계들은 전장에서의 원활한 통신, 실시간 정보 공유, 효과적인 지휘 통제 능력을 보장할 것입니다. 지멘스 AG, EADS, DASA 중에서의 선택은 우리 군의 정보 및 통신 기반의 기술적 중추를 결정하게 되며, 이는 작전 효율성과 NATO 내 상호 운용성에 매우 중요합니다..."
 germany_foci.10.a: "지멘스 AG를 C4ISR 공급업체로 선정"
 germany_foci.10.a_desc: "지멘스 AG는 최첨단 혁신과 믿을 만한 솔루션으로 잘 알려진 통신 및 정보 체계 분야의 세계적 선두 기업입니다. 지멘스를 선택하면 보안 통신, 데이터 처리, 체계 통합에 대한 이들의 폭넓은 전문성을 활용할 수 있습니다. 지멘스의 견고한 C4ISR 솔루션은 우리 군에 지휘 통제에서의 첨단 능력을 제공하여, 우리 군이 실시간으로 안전하고 효과적으로 통신할 수 있도록 보장할 것입니다."
 germany_foci.10.b: "EADS를 C4ISR 공급업체로 선정"
 germany_foci.10.b_desc: "EADS(유럽 항공방위우주회사)는 통합 C4ISR 솔루션에 중점을 둔 항공우주 및 방위 체계에 특화되어 있습니다. EADS를 선택하면 우리 차량에 정교한 지휘 및 정보 체계를 도입하여 상황 인식과 전략적 의사 결정을 높일 수 있습니다. 다국적 방위 사업에서의 EADS의 경험은 이들의 C4ISR 기술이 NATO 동맹국과 높은 상호 운용성을 갖도록 보장하여 우리의 집단 방위 능력을 강화할 것입니다."
 germany_foci.10.c: "DASA를 C4ISR 공급업체로 선정"
 germany_foci.10.c_desc: "DASA(다임러-벤츠 에어로스페이스 AG)는 항공우주 및 방위 분야에서 풍부한 배경을 갖추고 있으며, 현대 군의 필요에 맞춘 첨단 C4ISR 능력을 제공합니다. DASA를 선택하면 우리 차량이 최첨단 지휘, 통제, 통신 체계를 갖추도록 보장할 수 있습니다. 복잡한 체계를 방위 플랫폼에 통합하는 데 대한 이들의 전문성은 전장에서 기술적 우위를 유지하는 데 중요한 신뢰할 수 있는 고성능 C4ISR 솔루션을 우리 군에 제공할 것입니다."
 germany_foci.11.t: "새로운 장갑차의 필요성 인식"
 germany_foci.11.d: "연방방위군이 현재의 차량 보유 현황을 검토하면서, 노후한 M113과 푸크스 차량이 검증되고 믿을 만하기는 하지만 현대전에서는 구식이 되고 있음이 분명해지고 있습니다. 기술 발전과 변화하는 전투 요구는 더 나은 방호력, 기동성, 상호 운용성을 제공하는 후속 차량을 필요로 합니다. 결정은 독립성을 보장하고 국내 방위 산업을 지원하도록 새로운 APC를 독자적으로 개발할 것인지, 아니면 동맹군과의 상호 운용성을 높이고 개발 비용을 분담하기 위해 국제적으로 협력할 것인지에 달려 있습니다."
 germany_foci.11.a: "독자 개발 프로젝트 착수"
 germany_foci.11.a_desc: "독자 프로젝트는 독일이 새로운 APC의 개발과 생산에 대한 완전한 통제권을 유지할 수 있게 합니다. 이 방식은 차량이 연방방위군의 요구에 맞춰 특별히 설계되도록 보장하고, 국내 방위 산업을 지원하며, 기술적 독립을 유지합니다. 그러나 동맹군과의 상호 운용성 기회는 제한될 수 있습니다."
 germany_foci.11.b: "공동 개발을 위한 국제 파트너 모색"
 germany_foci.11.b_desc: "국제 파트너와 협력하기로 선택하면 독일은 개발 비용을 분담하고 더 폭넓은 기술 전문성의 혜택을 누릴 수 있습니다. 이 선택지는 동맹국과의 상호 운용성을 개선하고, NATO군 전반의 장비를 표준화할 가능성을 높이며, 작전 결속력을 강화할 것입니다. 과제는 여러 나라의 구체적 요구 사항과 전략적 목표를 조율하는 것입니다."
 germany_foci.110.t: "후속 차량으로서 푸크스 2 평가"
 germany_foci.110.d: "푸크스 2는 검증된 실적을 활용하면서도 전임 모델의 한계를 해결하도록 설계된 푸크스 APC의 개량형입니다. 방호력, 기동성, 전자 체계의 향상으로 푸크스 2는 매력적인 선택지가 되고 있습니다. 이제 결정할 것은 평가를 위해 시범 차량을 요청할 것인지, 아니면 기존 푸크스 차량의 운용 기간을 연장하기 위한 현대화 계획을 고려할 것인지입니다."
 germany_foci.110.a: "푸크스 2 시범 차량 요청"
 germany_foci.110.a_desc: "푸크스 2의 시범 차량을 요청하면 연방방위군이 실제 상황에서 개량 모델의 성능을 평가할 수 있습니다. 이 방식은 푸크스 2가 연방방위군의 변화하는 작전 요구를 충족하는지 가늠할 기회를 제공합니다."
 germany_foci.110.b: "기존 푸크스 차량 현대화 요청"
 germany_foci.110.b_desc: "기존 푸크스 차량을 현대화하는 것은 이 차량들의 운용 기간을 연장하는 비용 효율적인 해법입니다. 장갑, 전자장비, 기동성을 개선함으로써 연방방위군은 신규 차량 도입 비용을 미루면서도 작전 능력을 유지할 수 있습니다."
 germany_foci.111.t: "푸크스 2 시범 차량 검토"
 germany_foci.111.d: "푸크스 2 시범 차량은 그 능력을 평가하기 위한 일련의 시험을 거쳤습니다. 결과는 지뢰와 IED에 대한 더 나은 방호력, 향상된 기동성, 개선된 통신 체계를 포함해 원래 모델에 비해 상당한 개선이 있음을 보여줍니다. 연방방위군은 이러한 개선이 푸크스 2를 주문할 만한 가치가 있는지, 아니면 이 차량이 여전히 미래의 작전 요구에 미치지 못하는지 결정해야 합니다."
 germany_foci.111.a: "푸크스 2에 만족하며 주문한다"
 germany_foci.111.a_desc: "푸크스 2는 연방방위군의 현재와 미래의 요구를 충족하는 믿을 만하고 유능한 APC로 입증되었습니다. 주문을 함으로써 연방방위군은 푸크스 2가 제공하는 개선의 혜택을 누리면서 장갑 수송 능력의 연속성을 보장합니다."
 germany_foci.111.b: "만족스럽지 않으니 대안 탐색을 계속한다"
 germany_foci.111.b_desc: "푸크스 2는 일부 개선점을 제공하지만 투자를 정당화할 만한 중대한 진전을 제공하지는 못할 수 있습니다. 연방방위군은 더 나은 능력과 장기적 가치를 제공할 수 있는 대안을 계속 모색할 것입니다."
 germany_foci.112.t: "푸크스 A7 개량 평가"
 germany_foci.112.d: "푸크스 A7 개량 계획은 기존 푸크스 차량의 방호력, 기동성, 전반적인 능력을 높이는 것을 목표로 합니다. 첨단 장갑 솔루션, 현대적 전자장비, 개선된 엔진을 통합함으로써 A7형은 이 차량들의 운용 수명을 연장하도록 의도되었습니다. 연방방위군은 이 개량이 요구를 충족하기에 충분한지, 아니면 불가피한 교체를 늦출 뿐인지 결정해야 합니다."
 germany_foci.112.a: "푸크스 A7로 개량하여 계속 운용"
 germany_foci.112.a_desc: "푸크스 A7로의 개량은 연방방위군에 현재 보유 차량의 운용 기간을 연장하는 비용 효율적인 해법을 제공할 것입니다. 이 방식은 차량이 작전상 유효성을 유지하도록 보장하는 동시에 향후 교체 방안을 검토할 시간을 더 줍니다."
 germany_foci.112.b: "구식 플랫폼에 대한 추가 투자 지양"
 germany_foci.112.b_desc: "푸크스 A7에 투자하는 것은 이 차량들의 불가피한 교체를 늦출 뿐일 수 있습니다. 개량에 돈을 쓰기보다 연방방위군은 현재와 미래의 전장 요구를 충족하는 더 현대적인 APC를 도입하는 데 집중해야 합니다."
 germany_foci.113.t: "신형 APC를 위한 국제 협력 모색"
 germany_foci.113.d: "상호 운용성과 개발 비용 분담이 주는 전략적 이점을 고려하여, 연방방위군은 신형 APC 개발을 위한 잠재적 동반자 관계를 모색하고 있습니다. 협력은 여러 나라의 요구를 충족하여 NATO 안팎에서 작전 호환성을 높이는 차량으로 이어질 수 있습니다. 잠재적 파트너로는 GTK 복서 프로젝트의 영국과 네덜란드, TpZ-3 파날로카 프로젝트의 프랑스와 폴란드, 고방호 TpZ-3 포사 프로젝트의 이스라엘이 있습니다."
 germany_foci.113.a: "영국, 네덜란드와 함께 GTK 복서 프로젝트 참여"
 germany_foci.113.a_desc: "GTK 복서 프로젝트는 지휘, 의무, 전투를 포함한 다양한 역할에 맞게 개조할 수 있는 다용도 모듈식 APC를 약속합니다. 이 협력은 연구 개발 비용의 분담과 다른 유럽군과의 향상된 상호 운용성의 혜택을 누릴 것이며, 연방방위군을 현대 장갑차량 기술의 최전선에 올려놓을 것입니다."
 germany_foci.113.b: "프랑스, 폴란드와 함께 TpZ-3 파날로카 프로젝트 참여"
 germany_foci.113.b_desc: "TpZ-3 파날로카는 균형 잡힌 방호력, 기동성, 작전 다용도성을 제공하며 중부 유럽 군대의 표준 APC로 쓰이도록 설계되었습니다. 프랑스, 폴란드와의 제휴는 지역 방위 유대를 강화하고 여러 유럽 NATO 회원국 전반에서 장비를 표준화할 수 있습니다."
 germany_foci.113.c: "이스라엘과 TpZ-3 포사 프로젝트 협력"
 germany_foci.113.c_desc: "TpZ-3 포사는 IED와 RPG를 포함한 현대적 위협에 대한 높은 수준의 방호력을 제공하는 데 중점을 둡니다. 비대칭전에 대한 이스라엘의 경험은 고위험 환경에서 작전할 수 있는 견고한 APC를 개발하는 데 이 협력을 가치 있게 만들며, 병력에 첨단 방호력을 제공합니다."
 germany_foci.1131.t: "GTK 복서 프로젝트 상세 평가"
 germany_foci.1131.d: "GTK 복서 프로젝트는 독일이 영국, 네덜란드와 함께 다용도의 첨단 APC를 공동 개발할 수 있는 중요한 기회입니다. 이 차량의 모듈식 설계는 다양한 구성을 가능하게 하여 여러 임무 유형에 적응할 수 있습니다. 이러한 유연성은 우수한 방호력 및 기동성과 어우러져 복서를 연방방위군의 차세대 APC 유력 후보로 만듭니다."
 germany_foci.1131.a: "복서 프로젝트 계속 추진"
 germany_foci.1131.a_desc: "복서 프로젝트를 계속 추진하면 연방방위군은 다양한 작전 요구를 충족하는 매우 유능하고 적응력 있는 APC를 배치할 수 있습니다. 영국, 네덜란드와의 동반자 관계는 유대를 강화하고 주요 NATO 동맹국과의 상호 운용성을 보장할 것입니다."
 germany_foci.1131.b: "복서 프로젝트에서 탈퇴"
 germany_foci.1131.b_desc: "복서는 첨단 능력을 제공하지만 프로젝트의 비용과 개발 일정이 연방방위군의 당면한 요구와 맞지 않을 수 있습니다. 프로젝트에서 탈퇴하면 독일은 더 비용 효율적이거나 즉시 조달 가능한 대안에 집중할 수 있습니다."
 germany_foci.1132.t: "복서 APC 시범 차량 검토"
 germany_foci.1132.d: "복서 시범 차량은 그 능력을 보여주기 위한 광범위한 시험을 거쳤습니다. 기동성, 방호력, 모듈성에서 인상적인 성능을 보여, 복서는 현대 APC의 요구 조건을 충족하는 것으로 보입니다. 그러나 연방방위군은 이점이 프로그램 비용을 상회하는지, 그리고 복서가 유럽 장갑 전력에 대한 더 넓은 전략적 구상에 부합하는지 고려해야 합니다."
 germany_foci.1132.a: "복서 계획에 전념"
 germany_foci.1132.a_desc: "복서는 유연성과 첨단 방호력에 대한 유럽의 요구에 부합하는 최신 APC로 입증되었습니다. 복서 계획에 전념하면 우리 육군이 현재와 미래의 작전 과제에 대응할 수 있는 차량을 배치하게 될 것입니다."
 germany_foci.1132.b: "탈퇴하고 대안 검토"
 germany_foci.1132.b_desc: "첨단 기능에도 불구하고 복서는 우리 육군의 당면한 요구에 비해 지나치게 비싸거나 복잡할 수 있습니다. 다른 선택지를 모색하면 비용 효율성과 신속한 배치에 중점을 둔 더 균형 잡힌 해법을 얻을 수 있습니다."
 germany_foci.1133.t: "복서 APC 도입에 대한 최종 결정"
 germany_foci.1133.d: "복서 APC에 대한 철저한 평가를 마친 뒤, 우리는 도입을 진행할지 결정해야 합니다. 복서는 그 능력을 입증했지만 예산상의 제약과 전략적 고려 사항을 신중하게 따져야 합니다. 이 결정은 향후 수십 년간 육군의 장갑 능력에 영향을 미칠 것입니다."
 germany_foci.1133.a: "복서 APC 주문"
 germany_foci.1133.a_desc: "복서는 다용도 고방호 APC에 대한 우리의 요구 조건을 충족합니다. 복서를 주문하면 장갑 전력이 현대화되고 육군이 광범위한 위협에 맞설 수 있는 능력을 유지하게 될 것입니다."
 germany_foci.1133.b: "도입 연기, 경험 활용"
 germany_foci.1133.b_desc: "복서는 뛰어난 능력을 제공하지만 현재의 예산 제약으로 인해 도입을 늦춰야 할 수 있습니다. 이 계획에서 얻은 지식은 여전히 향후 APC 개발과 조달 결정에 활용될 수 있습니다."
 germany_foci.1134.t: "TpZ-3 파날로카 프로젝트 상세 평가"
 germany_foci.1134.d: "TpZ-3 파날로카 프로젝트는 중부 유럽 군대에 적합한 표준화된 APC를 만드는 것을 목표로 합니다. 프랑스, 폴란드와의 협력으로 이 프로젝트는 방호력, 기동성, 비용 사이의 균형 잡힌 접근을 강조합니다. 이 차량은 유럽 NATO 회원국의 특정 요구를 충족하도록 설계되어 지역 안보와 방위 역량을 높입니다."
 germany_foci.1134.a: "파날로카 프로젝트 계속 추진"
 germany_foci.1134.a_desc: "파날로카 프로젝트를 계속 추진하면 독일은 프랑스, 폴란드와 긴밀히 협력할 수 있으며, 결과물인 APC가 중부 유럽 군대가 직면한 작전 환경에 잘 맞도록 보장할 수 있습니다. 공동 개발 비용과 표준화된 장비는 모든 참여국에 이익이 될 것입니다."
 germany_foci.1134.b: "파날로카 프로젝트에서 탈퇴"
 germany_foci.1134.b_desc: "파날로카는 균형 잡힌 해법을 제공하지만 우리의 구체적인 작전 요구가 프로젝트의 목표와 완벽히 일치하지 않을 수 있습니다. 프로젝트에서 탈퇴하면 우리 고유의 요구에 더 잘 맞을 수 있는 대안에 집중할 수 있습니다."
 germany_foci.1135.t: "TpZ-3 파날로카 APC 시범 차량 검토"
 germany_foci.1135.d: "파날로카 시범 차량은 방호력, 기동성, 작전 다용도성 측면의 성능을 평가받았습니다. 중부 유럽 군대를 위한 믿을 만하고 비용 효율적인 APC로서 가능성을 보여줍니다. 육군은 이 차량이 요구를 충족하는지, 아니면 다른 선택지를 추구해야 하는지 결정해야 합니다."
 germany_foci.1135.a: "파날로카 계획에 전념"
 germany_foci.1135.a_desc: "파날로카는 균형 잡힌 다용도 APC에 대한 우리의 요구 조건을 충족합니다. 파날로카 계획에 전념하면 지역 방위 전략에 부합하고 인접국 군대와의 상호 운용성을 높이는 유능한 차량을 얻게 될 것입니다."
 germany_foci.1135.b: "탈퇴하고 대안 검토"
 germany_foci.1135.b_desc: "파날로카는 탄탄한 선택지이지만 우리 군이 요구하는 구체적인 능력을 제공하지 못할 수 있습니다. 다른 대안을 모색하면 우리의 전략적·작전적 목표에 더 잘 맞는 맞춤형 해법을 얻을 수 있습니다."
 germany_foci.1136.t: "TpZ-3 파날로카 APC 도입에 대한 최종 결정"
 germany_foci.1136.d: "TpZ-3 파날로카를 도입하기로 하는 결정은 독일 장갑 전력과 프랑스, 폴란드와의 협력에 상당한 영향을 미칠 것입니다. 파날로카는 균형 잡힌 접근을 제공하지만, 육군은 그것이 더 넓은 전략적 목표와 예산상의 제약에 부합하는지 고려해야 합니다."
 germany_foci.1136.a: "파날로카 APC 주문"
 germany_foci.1136.a_desc: "파날로카는 우리의 작전 요구를 충족하는 비용 효율적이고 믿을 만한 APC를 제공합니다. 파날로카를 주문하면 우리의 장갑 능력이 향상되고 프랑스, 폴란드와의 독일의 유대가 강화될 것입니다."
 germany_foci.1136.b: "도입 연기, 경험 활용"
 germany_foci.1136.b_desc: "파날로카는 귀중한 능력을 제공하지만 재정적·전략적 고려 사항으로 인해 도입을 미뤄야 할 수 있습니다. 이 프로젝트에서 얻은 경험은 여전히 향후 APC 개발과 조달에 유익할 것입니다."
 germany_foci.1137.t: "TpZ-3 포사 프로젝트 상세 평가"
 germany_foci.1137.d: "이스라엘과의 협력으로 진행되는 TpZ-3 포사 프로젝트는 고위험 환경에서의 작전을 위해 설계된 고방호 APC를 개발하는 것을 목표로 합니다. 비대칭전에 대한 이스라엘의 경험을 활용하여, 포사는 IED, RPG 및 기타 현대적 위협에 대한 우수한 방호력을 제공하도록 제작됩니다. 이 프로젝트는 첨단 장갑 솔루션과 최첨단 방어 기술에 중점을 둡니다."
 germany_foci.1137.a: "포사 프로젝트 계속 추진"
 germany_foci.1137.a_desc: "포사 프로젝트를 계속 추진하면 우리 장갑 전력은 고위험 환경에서 작전할 수 있는 고도로 방호된 APC를 갖추게 될 것입니다. 독일과 이스라엘의 협력은 첨단 방어 기술과 비대칭 위협에 대응하는 전문성에 대한 접근을 보장합니다."
 germany_foci.1137.b: "포사 프로젝트에서 탈퇴"
 germany_foci.1137.b_desc: "포사는 우수한 방호력을 제공하지만 고위험 환경에 중점을 둔 프로젝트가 우리의 주된 작전 요구와 맞지 않을 수 있습니다. 프로젝트에서 탈퇴하면 우리의 전략적 목표에 더 잘 맞는 대안을 추구할 수 있습니다."
 germany_foci.1138.t: "TpZ-3 포사 APC 시범 차량 검토"
 germany_foci.1138.d: "포사 시범 차량은 방호력과 기동성 성능을 평가하기 위한 엄격한 시험을 거쳤습니다. 첨단 장갑과 방어 체계는 현대적 위협에 효과적임이 입증되었습니다. 육군은 포사가 제공하는 높은 방호력이 다른 선택지보다 포사를 채택할 만한 가치가 있는지 결정해야 합니다."
 germany_foci.1138.a: "포사 계획에 전념"
 germany_foci.1138.a_desc: "포사의 우수한 방호력과 첨단 방어 기술은 고위험 상황에서 우리에게 이상적인 선택이 됩니다. 포사 계획에 전념하면 우리 병력이 적대적인 환경에서 최상의 방호를 받게 될 것입니다."
 germany_foci.1138.b: "탈퇴하고 대안 검토"
 germany_foci.1138.b_desc: "첨단 방호력에도 불구하고 포사는 모든 작전 상황에서 우리 군이 요구하는 균형 잡힌 능력을 제공하지 못할 수 있습니다. 다른 대안을 고려하면 더 다목적이고 비용 효율적인 해법을 얻을 수 있습니다."
 germany_foci.1139.t: "TpZ-3 포사 APC 도입에 대한 최종 결정"
 germany_foci.1139.d: "TpZ-3 포사를 도입하기로 하는 결정은 우리 장갑 능력에 중대한 영향을 미칠 것입니다. 포사는 비할 데 없는 방호력을 제공하지만, 우리 육군은 그 비용과 더 광범위한 작전 요구에 대한 적합성을 다른 가용 선택지와 비교해 따져보아야 합니다."
 germany_foci.1139.a: "포사 APC 주문"
 germany_foci.1139.a_desc: "포사는 비할 데 없는 방호력을 제공하며 고위험 환경에서의 작전에 이상적으로 적합합니다. 포사를 주문하면 우리 장갑 전력의 안전과 효율성이 향상될 것입니다."
 germany_foci.1139.b: "도입 연기, 경험 활용"
 germany_foci.1139.b_desc: "포사는 우수한 방호력을 제공하지만 예산 제약과 전략적 고려 사항으로 인해 도입을 늦춰야 할 수 있습니다. 이 프로젝트에서 얻은 통찰은 여전히 향후 APC 개발과 조달 전략에 활용될 것입니다."
 germany_foci.12.t: "새로운 보병전투차의 필요성 인식"
 germany_foci.12.d: "우리 육군이 장갑 능력을 평가하는 과정에서, 노후한 마르더 IFV가 다양한 전투 상황에서 믿을 만하고 검증되었음에도 현대 전장에는 더 이상 충분하지 않다는 점이 분명해지고 있습니다. 장갑 기술, 기동성, 무기 체계의 발전은 더 진보된 해법을 요구합니다. 이제 결정할 것은 독립성을 유지하고 국내 방위 산업을 지원하기 위해 독자 개발 프로젝트를 추진할 것인지, 아니면 동맹국과 장비를 통일하고 상호 운용성을 높일 수 있는 국제 협력을 모색할 것인지입니다."
 germany_foci.12.a: "독자 개발 프로젝트 개시"
 germany_foci.12.a_desc: "독자 개발 프로젝트는 독일이 새로운 IFV의 설계와 생산에 대한 완전한 통제권을 유지하게 하여, 차량이 연방방위군의 구체적인 요구 조건을 충족하도록 보장합니다. 이 길은 국내 방위 산업을 지원하고 독일의 기술적 독립을 유지하지만, 개발 비용 분담과 동맹국과의 상호 운용성 기회는 제한될 수 있습니다."
 germany_foci.12.b: "공동 개발을 위한 국제 파트너 모색"
 germany_foci.12.b_desc: "국제 파트너와의 협력은 개발 비용을 분담하고 더 폭넓은 기술 전문성을 활용할 가능성을 제공합니다. 이 선택지는 동맹군과의 상호 운용성을 개선하고, NATO 전반의 장비를 표준화할 가능성을 높이며, 다른 유럽 국가들과의 유대를 강화할 것입니다. 그러나 여러 파트너의 요구를 충족하기 위해 타협이 필요할 수 있습니다."
 germany_foci.120.t: "신형 IFV의 개발 경로 검토"
 germany_foci.120.d: "새로운 IFV를 추진하기로 결정한 만큼, 연방방위군은 이제 가장 적합한 접근 방식을 정해야 합니다. 한 가지 선택지는 이전의 연구 개발 노력을 활용하여 마르더 2 계획을 되살리는 것입니다. 다른 방법으로 연방방위군은 장갑, 기동성, 무장의 최신 발전을 접목한 더 현대적인 슈첸판처 개발을 모색할 수도 있습니다."
 germany_foci.120.a: "마르더 2 계획 재개"
 germany_foci.120.a_desc: "마르더 2 계획을 다시 검토하면 새로운 IFV를 개발하는 비용 효율적이고 효율적인 경로를 얻을 수 있습니다. 마르더의 검증된 설계를 바탕으로 연방방위군은 개발과 배치를 가속하여, 익숙한 기술에 기반한 믿을 만한 차량을 확보할 수 있습니다."
 germany_foci.120.b: "더 현대적인 슈첸판처 개발"
 germany_foci.120.b_desc: "더 현대적인 슈첸판처를 개발하면 연방방위군은 최신 기술 발전을 접목하여 우수한 방호력, 기동성, 화력을 제공하는 차량을 만들 수 있습니다. 이 방식은 초기 개발 비용이 더 높을 수 있지만, 현대 전투의 요구에 부합하는 보다 미래 대응적인 해법을 약속합니다."
 germany_foci.121.t: "마르더 2 시범 차량 검토"
 germany_foci.121.d: "마르더 2 시범 차량은 연방방위군의 현대적 요구 조건을 충족하는지 판단하기 위해 평가를 받았습니다. 이 차량은 향상된 방호력과 기동성 등 원래의 마르더보다 개선된 점을 보여주지만, 여전히 오래된 설계 개념에 뿌리를 두고 있습니다. 연방방위군은 이러한 개선이 마르더 2를 채택할 만한 가치가 있는지, 아니면 더 혁신적인 해법을 찾는 편이 나은지 결정해야 합니다."
 germany_foci.121.a: "마르더 2에 만족하며 주문한다"
 germany_foci.121.a_desc: "마르더 2 시범 차량은 개선된 IFV에 대한 연방방위군의 당면한 요구 조건을 충족합니다. 주문을 하면 마르더 플랫폼의 친숙함과 검증된 설계를 활용하는 비용 효율적인 개량 경로를 제공할 것입니다."
 germany_foci.121.b: "인상적이지 않으니 다른 선택지를 고려한다"
 germany_foci.121.b_desc: "마르더 2는 일부 개선점을 제공하지만 대규모 채택을 정당화할 만한 중대한 기술적 도약을 제공하지는 못할 수 있습니다. 마르더 플랫폼에 계속 투자하는 것은 '죽은 말에 올라타는 것'으로 비칠 수 있으며, 연방방위군은 더 현대적인 대안을 모색해야 합니다."
 germany_foci.122.t: "푸마 프로젝트 평가"
 germany_foci.122.d: "푸마 IFV 프로젝트는 향상된 방호력, 기동성, 화력에 중점을 둔 장갑차량 기술의 중대한 진전을 나타냅니다. 현대적인 IFV로서 푸마는 재래식 전쟁에서 비대칭 위협에 이르기까지 다양한 전투 환경에서 효과적으로 작전하도록 설계되었습니다. 연방방위군은 푸마가 작전 요구를 충족하도록 상세한 요구 조건을 설정하거나, 개발 비용을 분담할 파트너를 구하는 방안을 고려해야 합니다."
 germany_foci.122.a: "푸마 IFV 요구 조건 설정"
 germany_foci.122.a_desc: "정밀한 요구 조건을 설정하면 푸마 IFV가 방호 수준과 기동성에서부터 무기 체계와 전자전 능력에 이르기까지 연방방위군의 구체적인 요구를 충족하도록 보장할 수 있습니다. 이 방식은 푸마를 독일의 전략적·작전적 목표에 맞춰 조정하는 데 중점을 둡니다."
 germany_foci.122.b: "비용 분담을 위한 국제 파트너 모색"
 germany_foci.122.b_desc: "국제 파트너와 함께 푸마 IFV를 개발하면 비용을 줄이고 상호 운용성을 높일 수 있습니다. 동맹국과 보조를 맞춤으로써 연방방위군은 전문성의 공유 혜택을 누리고, 푸마가 다른 NATO군과의 연합 작전에 원활히 들어맞도록 보장할 수 있습니다."
 germany_foci.123.t: "푸마 IFV 시제차 시험"
 germany_foci.123.d: "푸마 IFV 시제차는 실제 상황에서의 성능을 평가하기 위한 엄격한 시험을 거치고 있습니다. 초기 결과는 푸마가 이전 모델에 비해 우수한 방호력, 기동성, 화력을 제공함을 보여줍니다. 그러나 연방방위군은 푸마 계획에 전념할 것인지, 아니면 개발 과정을 더욱 개선하고 분담할 파트너를 구하는 방안을 고려할 것인지 결정해야 합니다."
 germany_foci.123.a: "푸마 계획 완수"
 germany_foci.123.a_desc: "푸마 IFV는 연방방위군의 요구 조건을 충족하는 유능하고 현대적인 차량으로 입증되었습니다. 푸마 계획에 전념하면 연방방위군은 작전상 우위를 유지하면서 배치할 준비가 된 차세대 IFV를 갖추게 될 것입니다."
 germany_foci.123.b: "비용과 전문성을 분담할 파트너 모색"
 germany_foci.123.b_desc: "푸마는 큰 잠재력을 보여주지만, 비용과 개발을 분담할 파트너를 구하면 추가적인 혁신과 향상된 상호 운용성 같은 부가적 이점을 얻을 수 있습니다. 푸마 계획을 국제 협력에 열어두면 더 견고하고 재정적으로 실현 가능한 해법을 얻을 수 있습니다."
 germany_foci.125.t: "푸마 프로젝트 최종 결과"
 germany_foci.125.d: "종합적인 시험과 평가를 거쳐 푸마 IFV는 그 능력을 입증했습니다. 이제 결정할 것은 푸마 IFV의 첫 번째 물량을 주문하여 가까운 장래의 연방방위군 장갑 능력을 확보할 것인지, 아니면 예산 제약으로 도입을 미루고 나중에 결정을 재검토할 가능성을 남겨둘 것인지입니다."
 germany_foci.125.a: "푸마 IFV 첫 번째 물량 주문"
 germany_foci.125.a_desc: "푸마 IFV의 첫 번째 물량을 주문하면 연방방위군이 현대 전투의 과제에 대응할 수 있는 최신 차량을 배치하게 될 것입니다. 이 결정은 강력하고 기술적으로 진보한 장갑 전력을 유지하겠다는 의지를 반영합니다."
 germany_foci.125.b: "도입 연기, 향후 요구 고려"
 germany_foci.125.b_desc: "푸마는 그 가치를 입증했지만 현재의 예산 제약으로 인해 도입을 늦춰야 할 수 있습니다. 구매를 연기함으로써 연방방위군은 재정 자원을 더 효과적으로 관리할 수 있으며, 더 적절한 시기에 푸마를 도입할 수도 있습니다."
 germany_foci.124.t: "IFV 개발을 위한 국제 파트너십 모색"
 germany_foci.124.d: "연방방위군은 장갑 전력의 능력을 한층 높이기 위해 신형 IFV 개발을 위한 타국과의 제휴를 검토하고 있습니다. 잠재적 협력으로는 벨기에, 네덜란드와 함께하는 'GTK 복서 IFV-RCT30', 폴란드, 핀란드와 함께하는 'SPz 필프라스', 그리고 전투 환경에서의 높은 방호력을 위해 설계된 스웨덴, 덴마크와 함께하는 'SPz 헤르멜린'이 있습니다."
 germany_foci.124.a: "벨기에, 네덜란드와 'GTK 복서 IFV-RCT30' 개발"
 germany_foci.124.a_desc: "'GTK 복서 IFV-RCT30' 프로젝트는 성공적인 복서 플랫폼의 다용도 모듈식 IFV 파생형을 개발하는 데 중점을 둡니다. 벨기에, 네덜란드와의 제휴는 개발 비용 분담을 가능하게 하고, 검증된 복서 설계의 혜택을 누리며 NATO 내 작전 호환성을 높일 것입니다."
 germany_foci.124.b: "폴란드, 핀란드와 'SPz 필프라스' 개발"
 germany_foci.124.b_desc: "'SPz 필프라스' 프로젝트는 현대적인 IFV를 개발하는 데 독일, 폴란드, 핀란드의 전문성을 결합하는 것을 목표로 합니다. 이 협력은 장갑차량에 대한 폴란드의 경험과 혹독한 환경에서의 작전에 대한 핀란드의 전문성을 활용하여, 이들 국가 간의 상호 운용성을 높이고 장비 표준을 통일할 것입니다."
 germany_foci.124.c: "스웨덴, 덴마크와 'SPz 헤르멜린' 개발"
 germany_foci.124.c_desc: "'SPz 헤르멜린'은 다양한 전투 상황에서 높은 방호력을 제공하도록 설계되었습니다. 스웨덴, 덴마크와의 협력은 특히 장갑과 생존성 분야에서 그들의 첨단 방위 기술을 활용하여, 재래식 전쟁과 비대칭전 모두에 적합한 고방호 IFV를 만들어낼 것입니다."
 germany_foci.1241.t: "IFV 프로젝트 요구 조건 설정"
 germany_foci.1241.d: "독일, 벨기에, 네덜란드는 신형 보병전투차(IFV) 프로젝트의 요구 조건을 설정하기 위해 힘을 모았습니다. 이들 국가는 현대전의 요구를 충족하는 최첨단 차량을 개발하는 것을 목표로 합니다."
 germany_foci.1241.a: "프로젝트 계속 추진"
 germany_foci.1241.b: "프로젝트에서 탈퇴"
 germany_foci.1242.t: "IFV 시제차 시험"
 germany_foci.1242.d: "공동 IFV 프로젝트의 시제차는 성능과 향후 작전에 대한 적합성을 평가하기 위한 엄격한 시험을 거치고 있습니다."
 germany_foci.1242.a: "시험 진행"
 germany_foci.1242.b: "추가 시험 중단"
 germany_foci.1243.t: "복서 IFV-RCT30 프로젝트 결과"
 germany_foci.1243.d: "복서 IFV-RCT30의 시험 결과가 나왔습니다. 이 결과는 생산을 진행할지, 아니면 프로젝트의 목표를 수정할지에 대한 결정에 영향을 미칠 것입니다."
 germany_foci.1243.a: "생산 진행"
 germany_foci.1243.b: "프로젝트 포기"
 germany_foci.1244.t: "APC 협력 요구 조건 설정"
 germany_foci.1244.d: "독일, 핀란드, 폴란드는 공동의 전략적 요구를 충족하도록 설계된 신형 장갑차(APC) 프로젝트의 기준을 수립하고 있습니다."
 germany_foci.1244.a: "프로젝트 계속 추진"
 germany_foci.1244.b: "협력에서 탈퇴"
 germany_foci.1245.t: "APC 시제차 시험"
 germany_foci.1245.d: "APC 시제차는 전장에서의 효율성과 작전 신뢰성을 판단하기 위한 종합적인 평가를 거치고 있습니다."
 germany_foci.1245.a: "평가 계속"
 germany_foci.1245.b: "프로젝트 취소"
 germany_foci.1246.t: "SPz 필프라스 프로젝트 결과"
 germany_foci.1246.d: "SPz 필프라스 IFV 프로젝트의 결과가 확정되어 이 공동 노력의 강점과 약점이 드러났습니다."
 germany_foci.1246.a: "추가 생산 승인"
 germany_foci.1246.b: "프로젝트 중단"
 germany_foci.1247.t: "공동 APC 개발 요구 조건 설정"
 germany_foci.1247.d: "독일, 스웨덴, 덴마크는 상호 운용성과 능력을 높이는 것을 목표로 신형 APC의 사양을 정하고 있습니다."
 germany_foci.1247.a: "프로젝트 진행"
 germany_foci.1247.b: "구상에서 발을 뺀다"
 germany_foci.1248.t: "헤르멜린 IFV 시제차 시험"
 germany_foci.1248.d: "SPz 헤르멜린 시제차는 모든 참여국이 기대하는 작전 기준을 충족하는지 확인하기 위해 엄격한 시험을 거치고 있습니다."
 germany_foci.1248.a: "계속된 시험 지원"
 germany_foci.1248.b: "프로젝트 종료"
 germany_foci.1249.t: "SPz 헤르멜린 프로젝트 결과"
 germany_foci.1249.d: "SPz 헤르멜린 프로젝트의 결과가 나와, 장갑 능력에 혁신을 가져올 수 있는 이 차량의 잠재력에 대한 통찰을 제공합니다."
 germany_foci.1249.a: "생산 진행"
 germany_foci.1249.b: "프로젝트 종료"
 germany_foci.1141.t: "GTK 복서 IFV-RCT30 프로젝트 상세 평가"
 germany_foci.1141.d: "벨기에, 네덜란드와의 협력으로 진행되는 'GTK 복서 IFV-RCT30' 프로젝트는 검증된 복서 플랫폼을 RCT30 원격 조종 포탑을 갖춘 IFV 구성으로 개조하는 것을 목표로 합니다. 이 프로젝트는 다양한 전투 작전에 적합한, 방호력, 화력, 기동성의 균형을 갖춘 다용도 모듈식 IFV를 제공하는 것을 목표로 합니다."
 germany_foci.1141.a: "GTK 복서 IFV-RCT30 프로젝트 계속 추진"
 germany_foci.1141.a_desc: "GTK 복서 IFV-RCT30 프로젝트를 계속 추진하면 연방방위군에 다용도의 현대적 IFV를 제공하여 장갑 능력을 높이고 동맹군과의 상호 운용성을 보장할 것입니다. 이 결정은 협력을 지지하며 NATO의 집단 방위 태세를 강화합니다."
 germany_foci.1141.b: "GTK 복서 IFV-RCT30 프로젝트에서 탈퇴"
 germany_foci.1141.b_desc: "GTK 복서 IFV-RCT30은 잠재력을 지니고 있지만 연방방위군의 구체적인 요구 조건과 완전히 맞지 않을 수 있습니다. 프로젝트에서 탈퇴하면 독일은 자국의 전략적·작전적 요구에 더 잘 맞을 수 있는 다른 IFV 해법에 집중할 수 있습니다."
 germany_foci.1142.t: "GTK 복서 IFV-RCT30 시범 차량 검토"
 germany_foci.1142.d: "GTK 복서 IFV-RCT30 시범 차량은 방호력, 화력, 기동성 측면의 성능을 평가하기 위한 평가를 거쳤습니다. 연방방위군은 시범 차량이 요구를 충족하는지, 아니면 독일 육군의 구체적인 요구 조건을 충족하기 위해 추가 조정이 필요한지 결정해야 합니다."
 germany_foci.1142.a: "GTK 복서 IFV-RCT30 계획에 전념"
 germany_foci.1142.a_desc: "GTK 복서 IFV-RCT30은 다용도의 현대적 IFV에 대한 연방방위군의 요구 조건을 충족합니다. 이 계획에 전념하면 독일의 전략적 목표에 부합하고 동맹군과의 상호 운용성을 높이는 유능한 차량을 얻게 될 것입니다."
 germany_foci.1142.b: "탈퇴하고 대안 검토"
 germany_foci.1142.b_desc: "GTK 복서 IFV-RCT30은 가능성을 보여주지만 연방방위군이 요구하는 구체적인 능력을 제공하지 못할 수 있습니다. 다른 대안을 고려하면 독일의 작전 목표에 더 잘 맞는 맞춤형 해법을 얻을 수 있습니다."
 germany_foci.1143.t: "GTK 복서 IFV-RCT30 도입에 대한 최종 결정"
 germany_foci.1143.d: "GTK 복서 IFV-RCT30을 도입하기로 하는 결정은 독일의 장갑 전력과 벨기에, 네덜란드와의 협력에 영향을 미칠 것입니다. 이 IFV는 다용도성과 현대적 능력을 제공하지만, 연방방위군은 진행에 앞서 예산 제약과 전략적 목표를 고려해야 합니다."
 germany_foci.1143.a: "GTK 복서 IFV-RCT30 주문"
 germany_foci.1143.a_desc: "GTK 복서 IFV-RCT30은 연방방위군의 요구를 충족하는 현대적이고 다용도인 IFV를 제공합니다. 이 차량을 주문하면 독일의 장갑 능력이 향상되고 벨기에, 네덜란드와의 유대가 강화될 것입니다."
 germany_foci.1143.b: "도입 연기, 경험 활용"
 germany_foci.1143.b_desc: "GTK 복서 IFV-RCT30은 귀중한 능력을 제공하지만 예산 제약으로 인해 도입을 늦춰야 할 수 있습니다. 이 프로젝트에서 얻은 경험은 여전히 향후 IFV 개발과 조달 전략에 활용될 것입니다."
 germany_foci.1144.t: "SPz 필프라스 프로젝트 상세 평가"
 germany_foci.1144.d: "폴란드, 핀란드와의 협력으로 진행되는 'SPz 필프라스' 프로젝트는 장갑차량으로 유명한 핀란드 방산 기업 파트리아의 전문성과 독일의 기술 역량을 통합한 현대적 IFV를 개발하는 것을 목표로 합니다. 이 동반자 관계는 독일과 파트너 국가 모두의 요구를 충족하는 차량을 만들어 유럽 내 장갑 전력의 상호 운용성을 높이는 것을 추구하며, 기동성, 방호력, 다양한 전투 환경에 대한 적응성에 중점을 둡니다."
 germany_foci.1144.a: "SPz 필프라스 프로젝트 계속 추진"
 germany_foci.1144.a_desc: "SPz 필프라스 프로젝트를 계속 추진하면 독일, 폴란드, 핀란드 군대 전반에서 원활하게 작전할 수 있는 IFV가 개발될 것입니다. 이 프로젝트는 화력, 방호력, 기동성에 대한 균형 잡힌 접근을 제공하여 상호 운용성을 개선하고 연방방위군이 유럽 동맹국과 보조를 맞추도록 보장합니다."
 germany_foci.1144.b: "SPz 필프라스 프로젝트에서 탈퇴"
 germany_foci.1144.b_desc: "SPz 필프라스 프로젝트에서 탈퇴하면 독일은 자국의 구체적인 작전 요구에 더 맞춘 IFV 개발에 집중할 수 있습니다. 이 결정은 상이한 전략적 우선순위나 파트너와 구별되는 독자적인 기술적 우위를 유지하려는 바람에 기반할 수 있습니다."
 germany_foci.1145.t: "SPz 필프라스 시범 차량 검토"
 germany_foci.1145.d: "SPz 필프라스 시범 차량은 연방방위군의 요구에 대한 적합성을 판단하기 위해 평가받고 있습니다. 이 평가는 독일과 핀란드의 작전 환경 모두에 중요한 혹한 속 성능과 험한 지형에서의 성능을 포함해, 다양한 전투 상황에서의 차량 방호 수준, 기동성, 적응성에 중점을 둡니다."
 germany_foci.1145.a: "SPz 필프라스 계획에 전념"
 germany_foci.1145.a_desc: "SPz 필프라스 계획에 전념하면 연방방위군은 독일과 유럽의 방위 전략 모두에 부합하는 최신 IFV를 갖추게 될 것입니다. 이 차량의 방호력, 기동성, 다용도성은 향후 배치를 위한 유력한 후보로 만듭니다."
 germany_foci.1145.b: "탈퇴하고 대안 검토"
 germany_foci.1145.b_desc: "SPz 필프라스가 연방방위군의 기대를 완전히 충족하지 못한다면, 프로젝트에서 탈퇴하여 다른 IFV 선택지를 모색할 기회가 열릴 수 있습니다. 이 결정은 특정한 성능상의 결함이나 다른 제휴로의 전략적 전환에 의해 이끌릴 수 있습니다."
 germany_foci.1146.t: "SPz 필프라스 도입에 대한 최종 결정"
 germany_foci.1146.d: "SPz 필프라스를 평가한 뒤, 연방방위군은 이 IFV의 도입을 진행할지 결정해야 합니다. 이 결정에는 차량의 능력, 폴란드·핀란드와의 상호 운용성 강화라는 전략적 이점, 그리고 계획의 전반적인 비용 효율성이 고려될 것입니다."
 germany_foci.1146.a: "SPz 필프라스 주문"
 germany_foci.1146.a_desc: "SPz 필프라스를 주문하면 폴란드, 핀란드와의 작전 호환성을 보장하면서, 다용도에 유능한 IFV로 연방방위군의 장갑차량 보유 전력이 강화될 것입니다. 이 결정은 유럽 방위 협력에서 독일의 입지를 강화하고 보병 수송과 지원을 위한 현대적 해법을 제공합니다."
 germany_foci.1146.b: "도입 연기, 경험 활용"
 germany_foci.1146.b_desc: "SPz 필프라스는 귀중한 능력을 제공하지만 예산 제약이나 우선순위의 변화로 인해 도입을 미루게 될 수 있습니다. 이 프로젝트에서 얻은 경험은 여전히 향후 IFV 개발에 유익할 것이며, 나중에 도입할 가능성의 문도 열어둘 것입니다."
 germany_foci.1147.t: "SPz 헤르멜린 프로젝트 상세 평가"
 germany_foci.1147.d: "스웨덴, 덴마크와의 협력으로 진행되는 'SPz 헤르멜린' 프로젝트는 IED에서 직사 화기에 이르기까지 광범위한 위협을 견딜 수 있는 고방호 IFV를 개발하는 데 중점을 둡니다. 이 프로젝트는 스웨덴과 덴마크의 생존성 및 방호 분야 발전을 활용하여 재래식 전쟁과 비대칭전 모두에 적합한 차량을 만드는 것을 목표로 하며, 연방방위군의 IFV 요구에 견고한 선택지를 제공합니다."
 germany_foci.1147.a: "SPz 헤르멜린 프로젝트 계속 추진"
 germany_foci.1147.a_desc: "SPz 헤르멜린 프로젝트를 계속 추진하면 현대 전투의 엄격한 요구 조건을 충족하는 고방호 IFV를 확보하게 될 것입니다. 이 차량의 첨단 장갑과 생존성 기능은 연방방위군에 방어와 공격 작전 모두에서 강력한 자산이 될 것입니다."
 germany_foci.1147.b: "SPz 헤르멜린 프로젝트에서 탈퇴"
 germany_foci.1147.b_desc: "SPz 헤르멜린 프로젝트에서 탈퇴하면 독일은 자국의 전략적 요구에 더 잘 맞는 다른 IFV 선택지에 집중할 수 있습니다. 이 결정은 서로 다른 방위 우선순위나 더 큰 유연성 또는 비용 효율성을 제공하는 다른 기술적 해법에 대한 선호에서 비롯될 수 있습니다."
 germany_foci.1148.t: "SPz 헤르멜린 시범 차량 검토"
 germany_foci.1148.d: "SPz 헤르멜린 시범 차량은 방호력, 기동성, 다양한 전투 상황에 대한 적합성을 평가하기 위한 광범위한 시험을 거쳤습니다. 높은 방호 능력은 이 차량을 고위험 환경에서의 작전을 위한 유력한 후보로 만들며, 연방방위군이 고려해야 할 중요한 검토 시점을 제공합니다."
 germany_foci.1148.a: "SPz 헤르멜린 계획에 전념"
 germany_foci.1148.a_desc: "SPz 헤르멜린은 강력한 방호력과 전투 능력을 보여주어 현대 전장의 요구에 적합합니다. 헤르멜린 계획에 전념하면 연방방위군은 첨단 위협을 견딜 수 있는 고방호 IFV를 배치하여 장갑 전력의 능력을 높이게 될 것입니다."
 germany_foci.1148.b: "탈퇴하고 대안 검토"
 germany_foci.1148.b_desc: "SPz 헤르멜린이 모든 작전 요구를 충족하지 못하거나 비용 문제가 제기된다면, 연방방위군은 프로젝트에서 탈퇴하기로 결정할 수 있습니다. 다른 IFV 선택지를 모색하면 독일의 전략적 목표와 방위 요구에 더 잘 맞을 수 있습니다."
 germany_foci.1149.t: "SPz 헤르멜린 도입에 대한 최종 결정"
 germany_foci.1149.d: "SPz 헤르멜린에 대한 철저한 평가를 거쳐, 연방방위군은 도입을 진행할지 결정해야 합니다. 이 결정에서는 차량의 첨단 방호 능력을 비용, 전략적 적합성, 스웨덴·덴마크와의 상호 운용성 강화라는 이점 등 다른 요인과 견주어 따져볼 것입니다."
 germany_foci.1149.a: "SPz 헤르멜린 주문"
 germany_foci.1149.a_desc: "SPz 헤르멜린을 주문하면 생존성과 방호력에 중점을 두어 연방방위군의 장갑 능력이 크게 향상될 것입니다. 이 결정은 고위험 환경에서 작전할 수 있는 유능하고 회복력 있는 군대를 배치하겠다는 독일의 의지에 부합합니다."
 germany_foci.1149.b: "도입 연기, 경험 활용"
 germany_foci.1149.b_desc: "SPz 헤르멜린은 첨단 방호력을 제공하지만 예산 제약이나 전략적 우선순위의 변화로 인해 도입을 미루게 될 수 있습니다. 이 프로젝트에서 얻은 통찰과 경험은 여전히 향후 IFV 개발과 잠재적 도입에 귀중할 것입니다."
 germany_foci.13.t: "새로운 주력 전차의 필요성"
 germany_foci.13.d: "레오파르트 2 시리즈가 현대화 잠재력의 한계에 다다르면서 연방방위군은 중대한 결정에 직면해 있습니다. 최첨단 장갑 능력을 유지해야 한다는 필요성은 분명하지만, 앞으로 나아갈 길은 분명하지 않습니다. 독일은 기술적 독립을 보장하기 위해 레오파르트 2의 후계 전차를 개발하는 독자 계획을 추진해야 할까요, 아니면 동맹군과의 상호 운용성을 높이고 개발 비용을 분담하기 위해 국제 파트너와 협력하여 새로운 MBT를 만들어야 할까요?"
 germany_foci.13.a: "독자 개발 계획 추진"
 germany_foci.13.a_desc: "새로운 MBT를 독자적으로 개발하기로 선택함으로써 독일은 장갑 전력의 설계, 생산, 배치에 대한 완전한 통제권을 유지하게 됩니다. 이 길은 국가의 기술 주권을 강조하지만 상당한 투자와 자원이 필요합니다."
 germany_foci.13.b: "국제 협력 모색"
 germany_foci.13.b_desc: "다른 나라들과 협력하여 새로운 MBT를 개발하면 비용 분담의 기회를 얻고, 상호 운용성을 높이며, 유럽의 방위 역량을 결집할 수 있습니다. 이 방식은 독일의 방위 전략을 주요 동맹국과 일치시키고 집단 안보를 강화할 수 있습니다."
 germany_foci.130.t: "신형 MBT 개발 경로 결정"
 germany_foci.130.d: "연방방위군은 선택에 직면해 있습니다. KWS-3(Kampfwertsteigerung 3, 전투력 향상 3) 개량 계획을 통해 기존 레오파르트 2 플랫폼을 계속 발전시킬 것인지, 아니면 미래 전장의 요구를 충족하기 위해 완전히 새로운 MBT의 설계와 개발에 착수할 것인지입니다. KWS-3 계획은 비용 효율적인 개량 경로를 제공하지만 차세대 장갑전에 필요한 능력을 제공하지 못할 수 있습니다."
 germany_foci.130.a: "KWS-3 계획 개시"
 germany_foci.130.a_desc: "KWS-3 계획을 시작하면 개선된 장갑, 화력, 전자장비를 포함한 레오파르트 2의 대폭적인 개량에 중점을 두게 됩니다. 이 방식은 검증된 플랫폼의 운용 기간을 연장하여 작전 준비 태세를 유지하는 단기적 해법을 제공합니다."
 germany_foci.130.b: "신형 주력 전차 개발"
 germany_foci.130.b_desc: "완전히 새로운 MBT를 개발하면 미래의 위협에 더 효과적으로 대처할 수 있습니다. 이 방식은 능동 방어 체계, 차세대 센서, 향상된 기동성과 같은 첨단 기술의 통합을 가능하게 하지만, 더 긴 기간과 더 큰 투자가 필요합니다."
 germany_foci.131.t: "레오파르트 2 KWS-3 시범 차량 검토"
 germany_foci.131.d: "레오파르트 2 KWS-3 시범 차량은 개량 사항을 평가하기 위한 광범위한 시험을 거쳤습니다. 향상된 화력, 첨단 장갑 솔루션, 통합 전장 관리 체계에 초점이 맞춰져 있습니다. 시범 차량의 성능은 레오파르트 2 플랫폼에 대한 추가 투자가 정당화되는지, 아니면 자원을 신형 전차 개발에 돌려야 하는지 판단하는 데 도움이 될 것입니다."
 germany_foci.131.a: "KWS-3 개량 진행"
 germany_foci.131.a_desc: "시범 차량은 대폭적인 성능 향상으로 레오파르트 2의 운용 기간을 연장하는 것이 실현 가능함을 입증했습니다. KWS-3 개량을 주문하면 연방방위군이 장갑 전력을 유지할 수 있는 유능하고 비용 효율적인 해법을 얻게 될 것입니다."
 germany_foci.131.b: "KWS-3 계획 중단"
 germany_foci.131.b_desc: "KWS-3 계획은 연방방위군의 미래 작전 요구 조건을 충족하지 못할 수 있습니다. 개량을 중단하기로 하면 독일은 새롭게 부상하는 위협에 더 효과적으로 대처할 수 있는 신형 MBT 플랫폼 개발로 자원을 돌릴 수 있습니다."
 germany_foci.132.t: "KF51 MBT 프로젝트 요구 조건 설정"
 germany_foci.132.d: "레오파르트 2가 기술적 한계에 다다르면서, KF51 프로젝트는 현대전의 요구에 맞춘 차세대 MBT를 개발하는 것을 목표로 합니다. 연방방위군은 향상된 화력, 개선된 기동성, 첨단 방호 체계, 네트워크 중심 능력에 중점을 두고 이 새로운 전차의 요구 조건을 정해야 합니다. 대안으로 국제 파트너를 구하면 비용을 줄이고 상호 운용성을 높일 수 있습니다."
 germany_foci.132.a: "KF51 상세 요구 조건 설정"
 germany_foci.132.a_desc: "KF51에 대해 엄격한 요구 조건을 정의하면 첨단 위협에 대한 생존성에서부터 우수한 화력과 전장에서의 상황 인식에 이르기까지, 새로운 MBT가 연방방위군의 모든 작전 요구를 충족하도록 보장할 수 있습니다."
 germany_foci.132.b: "KF51 개발 파트너 모색"
 germany_foci.132.b_desc: "KF51 프로젝트에서 국제 파트너와 협력하면 개발 비용을 분산하고 기술 전문성을 결집하여, 개발 일정을 앞당기고 동맹군과의 MBT 작전 호환성을 높일 수 있습니다."
 germany_foci.133.t: "KF51 MBT 시제차 시험"
 germany_foci.133.d: "독일 장갑전의 미래를 대표하는 KF51 MBT의 시제차가 엄격한 시험을 거치고 있습니다. 이 시험은 화력, 장갑, 기동성, 첨단 전자장비를 평가할 것입니다. 결과는 KF51이 차세대 MBT에 대한 연방방위군의 기대를 충족할 수 있는지 결정할 것입니다."
 germany_foci.133.a: "KF51 개발 계획 완수"
 germany_foci.133.a_desc: "KF51은 시험에서 유망한 결과를 보여주었으며, 연방방위군의 요구 조건에 부합하는 능력을 입증했습니다. 본격적인 생산을 진행하면 독일은 미래의 위협에 맞설 준비가 된 최신 MBT를 얻게 될 것입니다."
 germany_foci.133.b: "KF51 계획 포기 및 파트너 모색"
 germany_foci.133.b_desc: "KF51 시제차가 기대에 못 미치거나 개발 비용이 감당할 수 없는 수준이 된다면, 계획을 포기하고 국제 제휴를 택하는 것이 더 실현 가능한 길일 수 있습니다."
 germany_foci.134.t: "MBT 개발을 위한 국제 파트너십 모색"
 germany_foci.134.d: "독일은 새로운 MBT를 개발하기 위한 여러 국제 협력을 검토하고 있습니다. 프랑스와 함께하는 주 지상 전투 체계(MGCS) 프로젝트는 유럽 MBT의 새로운 표준을 세울 수 있습니다. 한편 영국과의 LION 프로젝트는 레오파르트 2와 챌린저 2를 모두 대체하는 것을 목표로 하며, 미국과의 MAUSS 프로젝트는 레오파르트 2와 에이브럼스 전차를 함께 대체하는 데 중점을 둡니다."
 germany_foci.134.a: "프랑스와 MGCS 추진"
 germany_foci.134.a_desc: "MGCS 프로젝트는 독일군과 프랑스군 모두의 요구를 충족하는 새로운 MBT를 개발하여, 유럽의 방위 역량을 높이고 더 큰 상호 운용성을 촉진할 기회를 제공합니다."
 germany_foci.134.b: "영국과 LION 프로젝트 개시"
 germany_foci.134.b_desc: "LION 프로젝트는 레오파르트 2와 영국의 챌린저 2를 모두 대체할 다용도 MBT를 만드는 것을 목표로 합니다. 이 제휴는 독일과 영국의 방위 유대를 강화하고 NATO군에 새로운 표준을 제공할 수 있습니다."
 germany_foci.134.c: "미국과 MAUSS 프로젝트 시작"
 germany_foci.135.t: "KF51 판터 주력 전차 주문"
 germany_foci.135.d: "라인메탈이 개발한 차세대 주력 전차(MBT) KF51 판터는 비할 데 없는 전장 능력을 제공합니다. 첨단 무장, 모듈식 장갑, 무인 포탑 체계와 AI 통합 같은 최첨단 기술을 갖춘 이 전차는 장갑전에 혁신을 가져올 것입니다. 이 주문에 전념하여 우리의 군사적 우위를 공고히 해야 할까요?"
 germany_foci.135.a: "주문 진행"
 germany_foci.135.a_desc: "KF51 판터 주문을 승인함으로써 우리는 장갑전에서의 기술적 우위를 확보하고, 우리 군이 미래의 과제에 대비하도록 합니다."
 germany_foci.135.b: "결정 연기"
 germany_foci.135.b_desc: "구매를 미루면 추가 평가와 비용 산정이 가능하지만, 전략적 우위를 잃을 위험이 있습니다."
 germany_foci.134.c_desc: "미국과 MAUSS 프로젝트를 협력하면 레오파르트 2와 에이브럼스를 모두 대체할 수 있는 차세대 MBT로 이어질 수 있습니다. 이 대서양 횡단 제휴는 NATO의 장갑 능력을 높이고 기술적 우위를 보장할 것입니다."
 germany_foci.1341.t: "프랑스와의 MGCS 프로젝트 상세 검토"
 germany_foci.1341.d: "프랑스와의 주 지상 전투 체계(MGCS) 프로젝트는 화력, 방호력, 기동성의 최신 발전을 접목한 새로운 유럽 MBT를 개발하는 것을 목표로 합니다. 이 프로젝트는 레오파르트 2와 르클레르를 대체할 수 있는 전차를 만들어 유럽 장갑전의 새로운 표준을 확립하고자 합니다."
 germany_foci.1341.a: "MGCS 프로젝트 계속 추진"
 germany_foci.1341.a_desc: "MGCS 프로젝트를 계속 추진하면 최첨단 기술과 프랑스와의 향상된 상호 운용성에 중점을 두어, 독일이 유럽 장갑 개발의 최전선에 머물도록 보장합니다."
 germany_foci.1341.b: "MGCS 프로젝트에서 탈퇴"
 germany_foci.1341.b_desc: "MGCS 프로젝트에서 탈퇴하면 독일은 자국의 구체적인 방위 요구에 더 잘 맞거나 최종 결과물에 대한 더 큰 통제권을 제공하는 다른 개발 경로에 집중할 수 있습니다."
 germany_foci.1342.t: "MGCS 시범 차량 검토"
 germany_foci.1342.d: "미래 유럽 MBT를 대표하는 MGCS 시범 차량이 평가를 받고 있습니다. 이 시험 단계는 화력, 방호력, 기동성, 네트워크 중심전 체계와의 통합을 포함한 전차의 능력에 중점을 둘 것입니다."
 germany_foci.1342.a: "MGCS 개발 진행"
 germany_foci.1342.a_desc: "시범 차량은 연방방위군의 기대를 충족했으며 차세대 MBT로서의 잠재력을 보여주었습니다. 개발을 진행하면 독일은 현대적이고 유능한 전차를 얻게 될 것입니다."
 germany_foci.1342.b: "탈퇴하고 대안 검토"
 germany_foci.1342.b_desc: "MGCS 시범 차량이 특정 요구 조건을 충족하지 못하거나 전략적 우선순위가 바뀐다면, 프로젝트에서 탈퇴하여 독일이 다른, 더 적합한 MBT 개발 선택지를 추구할 수 있습니다."
 germany_foci.1343.t: "MGCS 도입에 대한 최종 결정"
 germany_foci.1343.d: "철저한 평가를 거쳐, 독일은 MGCS의 도입을 진행할지 결정해야 합니다. 이 결정에서는 전차의 능력, 비용, 그리고 더 넓은 유럽 방위 협력의 맥락에서의 전략적 적합성이 고려될 것입니다."
 germany_foci.1343.a: "MGCS 주문"
 germany_foci.1343.a_desc: "MGCS를 주문하면 연방방위군은 장갑 능력을 높이고 유럽 방위 협력을 강화하는 최첨단 MBT를 얻게 될 것입니다."
 germany_foci.1343.b: "도입 연기, 경험 활용"
 germany_foci.1343.b_desc: "MGCS는 첨단 능력을 제공하지만 예산 제약이나 다른 우선순위로 인해 도입을 미루게 될 수 있습니다. 이 프로젝트에서 얻은 경험은 여전히 향후 MBT 개발에 귀중할 것입니다."
 germany_foci.1344.t: "영국과의 LION 프로젝트 상세 검토"
 germany_foci.1344.d: "영국과의 공동 구상인 LION 프로젝트는 레오파르트 2와 챌린저 2를 모두 대체할 차세대 MBT를 개발하는 것을 목표로 합니다. 이 프로젝트는 화력, 기동성, 첨단 방호력에 중점을 두어 연방방위군과 영국군 모두의 작전 요구를 충족하는 매우 유능하고 다목적인 전차를 만드는 데 집중합니다."
 germany_foci.1344.a: "LION 프로젝트 계속 추진"
 germany_foci.1344.a_desc: "LION 프로젝트를 계속 추진하면 독일과 영국의 방위 협력이 강화되고, 미래 전투 상황의 과제에 대응하도록 설계된 새로운 다용도 MBT를 얻게 될 것입니다."
 germany_foci.1344.b: "LION 프로젝트에서 탈퇴"
 germany_foci.1344.b_desc: "LION 프로젝트에서 탈퇴하면 독일은 더 큰 전략적 이익을 제공하거나 자국의 구체적인 작전 요구에 더 가깝게 부합할 수 있는 다른 MBT 개발 경로를 추구할 수 있습니다."
 germany_foci.1345.t: "LION 프로젝트 시범 차량 검토"
 germany_foci.1345.d: "레오파르트 2와 챌린저 2를 대체하도록 설계된 LION 프로젝트의 시범 차량이 시험을 거치고 있습니다. 이 단계에서는 독일과 영국 양국의 요구 조건을 충족하는지 확인하기 위해 첨단 화력, 방호 체계, 전장 기동성을 포함한 전차의 전투 능력을 평가할 것입니다."
 germany_foci.1345.a: "LION 개발 진행"
 germany_foci.1345.a_desc: "LION 시범 차량은 유망한 결과를 보여주었으며, 독일과 영국 장갑 전력 모두에 귀중한 보탬이 될 수 있음을 시사합니다. 개발을 진행하면 양국의 능력을 높이는 현대적 MBT를 얻게 될 것입니다."
 germany_foci.1345.b: "탈퇴하고 대안 검토"
 germany_foci.1345.b_desc: "LION 시범 차량이 원하는 성능 기준을 충족하지 못하거나 전략적 목표가 바뀐다면, 프로젝트에서 탈퇴하여 독일이 차세대 MBT를 위한 다른 개발 기회를 모색할 수 있습니다."
 germany_foci.1346.t: "LION 프로젝트 도입에 대한 최종 결정"
 germany_foci.1346.d: "LION 프로젝트의 평가를 마친 뒤, 독일은 도입을 진행할지 결정해야 합니다. 이 결정에서는 전차의 능력을 비용 고려 사항 및 영국과의 협력이 주는 더 넓은 이점과 견주어 따져볼 것입니다."
 germany_foci.1346.a: "LION MBT 주문"
 germany_foci.1346.a_desc: "LION MBT를 주문하면 연방방위군은 매우 유능하고 현대적인 전차를 얻게 되며, 독일과 영국의 방위 협력이 강화되고 장갑전의 새로운 표준이 세워질 것입니다."
 germany_foci.1346.b: "도입 연기, 경험 활용"
 germany_foci.1346.b_desc: "LION MBT의 능력에도 불구하고 예산 제약이나 우선순위의 변화로 인해 도입을 미루게 될 수 있습니다. 이때 얻은 경험은 여전히 향후 MBT 개발 노력에 기여할 것입니다."
 germany_foci.1347.t: "미국과의 MAUSS 프로젝트 상세 검토"
 germany_foci.1347.d: "미국과의 협력인 MAUSS 프로젝트는 레오파르트 2와 M1 에이브럼스를 모두 대체할 새로운 MBT를 개발하는 것을 목표로 합니다. 이 대서양 횡단 제휴는 독일과 미국 방위 산업의 강점을 활용하여, 첨단 화력, 우수한 방호력, 향상된 기동성을 갖춘 차세대 전차를 만드는 데 중점을 둡니다."
 germany_foci.1347.a: "MAUSS 프로젝트 계속 추진"
 germany_foci.1347.a_desc: "MAUSS 사업을 계속 추진하면 독일과 미국의 방위 관계가 강화되며, 연방군과 미 육군 모두의 요구를 충족하는 차세대 MBT가 탄생하여 전장에서의 기술적 우위가 보장될 것입니다."
 germany_foci.1347.b: "MAUSS 사업에서 철수"
 germany_foci.1347.b_desc: "MAUSS 사업에서 철수하면 독일이 유럽 내 협력이나 전략적 이익과 작전 요구에 더 잘 부합할 수 있는 다른 개발 경로에 집중할 수 있을 것입니다."
 germany_foci.1348.t: "MAUSS 사업 시범 모델 검토"
 germany_foci.1348.d: "독일과 미국 차세대 장갑차량을 대표하는 MAUSS 사업의 시범 모델이 시험을 받고 있습니다. 이 단계에서는 화력, 방호력, 기동성, 현대 전투 체계와의 통합을 포함한 첨단 기술에 초점을 맞추며, 연방군과 미 육군 양측의 엄격한 기준을 충족하는지 확인합니다."
 germany_foci.1348.a: "MAUSS 개발 속행"
 germany_foci.1348.a_desc: "MAUSS 시범 모델은 시험에서 탁월한 성능을 보여 현재의 MBT 모델을 크게 능가하는 성능 향상이 가능함을 시사했습니다. 개발을 속행하면 독일과 미국 모두에게 견고하고 미래 지향적인 전차를 제공하게 될 것입니다."
 germany_foci.1348.b: "철수하고 대안 모색"
 germany_foci.1348.b_desc: "MAUSS 시범 모델이 핵심 요구 조건을 충족하지 못하거나 지정학적 여건이 변화할 경우, 사업에서 철수하여 더 큰 전략적 이점을 제공하는 다른 MBT 개발 구상에 집중할 수 있을 것입니다."
 germany_foci.1349.t: "MAUSS 사업 도입에 대한 최종 결정"
 germany_foci.1349.d: "MAUSS 사업에 대한 평가를 마친 독일은 이 신형 MBT를 도입할지 결정해야 합니다. 이 결정에서는 전차의 첨단 성능, 독일-미국 협력의 이점, 그리고 NATO의 전략 목표와의 전반적인 부합 여부를 고려하게 됩니다."
 germany_foci.1349.a: "MAUSS MBT 발주"
 germany_foci.1349.a_desc: "MAUSS MBT를 발주하면 연방군은 기술적으로 우월한 전차를 확보하게 되며, 대서양 동맹이 강화되고 독일군과 미군 모두 기갑전의 최전선에 남게 될 것입니다."
 germany_foci.1349.b: "도입 연기, 경험 활용"
 germany_foci.1349.b_desc: "MAUSS MBT는 최첨단 성능을 갖추었으나, 예산 제약이나 우선순위 변화로 인해 도입이 연기될 수 있습니다. 이 협력에서 얻은 지식은 향후 장갑차량 개발에 여전히 귀중하게 쓰일 것입니다."
 germany_foci.140.t: "독일 공군의 미래: 전략적 투자 결정"
 germany_foci.140.d: "디지털 통합, 공군 현대화, 각종 개혁이 성공적으로 마무리되면서 독일은 이제 완전히 현대화된 공군을 보유하게 되었습니다. 다음 단계는 이러한 성과를 유지하고 확대하기 위해 필요한 향후 투자 수준을 정하는 것입니다. 이 결정은 공군이 새로운 위협에 대응하고, 작전 태세를 유지하며, 독일의 장기 국방 목표에 부합하는 능력에 영향을 미칠 것입니다."
 germany_foci.140.a: "대규모 투자 - 국방부 장관 제안"
 germany_foci.140.a_desc: "대규모 투자는 독일의 선도적 항공 전력 지위를 굳히고, 첨단 항공기 도입, 보유 기체 확대, 최첨단 기술 확보를 가능하게 할 것입니다. 이 방식은 공군이 고강도 작전과 고도의 대공 방어를 수행할 수 있는 능력을 유지하게 하며, 독일을 유럽과 세계 국방 분야의 지배적 세력으로 자리매김하게 할 것입니다."
 germany_foci.140.b: "중간 규모 투자 - 균형 잡힌 접근"
 germany_foci.140.b_desc: "중간 규모 투자는 능력과 비용 효율성의 균형을 맞춥니다. 이 선택은 전면적 확장에 드는 막대한 비용 없이 기체의 꾸준한 개량, 항공 능력의 지속적 발전, 기술 향상을 뒷받침합니다. 이 방안은 예산 수요를 관리하면서도 공군이 현대의 도전에 충분히 대비하도록 유지해 줄 것입니다."
 germany_foci.140.c: "토네이도 재취역 - 유로파이터 확장 중단"
 germany_foci.140.c_desc: "연방군은 유로파이터의 추가 개량이나 신규 도입에 투자하는 대신 토네이도 기단의 운용 수명을 연장합니다. 노후화되었지만 토네이도는 타격 및 정찰 임무에 여전히 다용도로 쓸 수 있습니다. 이 결정은 억지력, 종심 타격 능력, 예산 효율을 중시하는 방향으로의 전략적 우선순위 변화를 반영하며, 핵 공유와 저고도 작전에 대한 동맹의 필요와도 맞아떨어집니다. 또한 값비싼 조달 주기를 멈추고 전력 계획을 재편하겠다는 신호이기도 합니다."
 germany_foci.150.t: "연방군의 신형 공격 헬리콥터 도입"
 germany_foci.150.d: "연방군은 항공 지원 및 지상 공격 임무 능력을 현대화하기 위해 신형 공격 헬리콥터 후보를 평가하고 있습니다. 각 기종은 화력, 기동성, 적응성 면에서 저마다 고유한 장점을 지니고 있습니다. 올바른 기종을 선정하는 것은 향후 작전에 대한 최적의 지원과 임무 효율 향상을 보장하는 데 매우 중요합니다."
 germany_foci.150.a: "유로콥터 티거 선택"
 germany_foci.150.a_desc: "유로콥터 티거는 유럽의 군사적 요구에 맞추어 특별히 설계된 다용도 첨단 공격 헬리콥터입니다. 현대적인 설계와 적응성 덕분에 연방군에 이상적인 선택이며, 높은 기동성과 최신 기술을 제공합니다."
 germany_foci.150.b: "A-129 망구스타 선택"
 germany_foci.150.b_desc: "A-129 망구스타는 검증된 전투 실적을 갖춘 신뢰할 수 있고 비용 효율적인 공격 헬리콥터입니다. 소형 설계와 민첩성 덕분에 다양한 지형에 특히 적합하며, 운용 유연성을 유지하면서도 강력한 공격 능력을 제공합니다."
 germany_foci.150.c: "AH-64A 아파치 선택"
 germany_foci.150.c_desc: "AH-64A 아파치는 세계에서 가장 널리 알려져 있고 실전에서 검증된 공격 헬리콥터 가운데 하나입니다. 강력한 무장 체계와 견고한 장갑을 갖춘 아파치는 비할 데 없는 화력과 내구성을 제공하여, 연방군이 고강도 전투 작전에 쓸 수 있는 강력한 자산을 확보하게 해 줍니다."
 germany_foci.151.t: "연방군의 신형 수송 헬리콥터 선정"
 germany_foci.151.d: "연방군은 병참 및 전술 지원 능력을 향상시키기 위해 신형 수송 헬리콥터 후보를 검토하고 있습니다. 각 후보는 수송 능력, 항속 거리, 활용성에서 저마다 고유한 강점을 지닙니다. 올바른 헬리콥터를 선택하면 작전 태세가 향상되고 광범위한 임무 요구를 뒷받침할 수 있습니다."
 germany_foci.151.a: "CH-53 GS 선택"
 germany_foci.151.a_desc: "CH-53 GS는 병력과 대형 장비를 먼 거리까지 수송할 수 있는 검증된 대형 헬리콥터입니다. 강력한 양력과 내구성으로 까다로운 임무와 병참 수요를 든든하게 지원합니다."
 germany_foci.151.b: "UH-60A 블랙호크 선택"
 germany_foci.151.b_desc: "UH-60A 블랙호크는 신뢰할 수 있고 다용도로 쓰이는 중형 수송 헬리콥터로, 운용 유연성으로 널리 인정받고 있습니다. 민첩성과 적응성 덕분에 전술 임무에 이상적이며, 다양한 지형에서 효과적인 병력 수송과 지원을 제공합니다."
 germany_foci.151.c: "아구스타웨스트랜드 AW101 선택"
 germany_foci.151.c_desc: "아구스타웨스트랜드 AW101은 장거리 비행 능력과 대규모 수송 능력을 겸비하여 장기 작전과 다양한 임무 유형에 적합합니다. 첨단 항전 장비와 탑재 능력 덕분에 병참 및 전술 배치 모두에서 귀중한 자산이 됩니다."
 germany_foci.152.t: "드론으로 연방군 역량 강화"
 germany_foci.152.d: "정찰 능력과 전술적 유연성을 향상시키기 위해 연방군은 장거리 감시 및 잠재적 전투 임무용 드론 후보를 평가하고 있습니다. 각 방안은 투자 규모, 능력, 기술 수준이 서로 다르며, 이 선택은 연방군의 작전 지원과 미래의 전략적 대비 태세를 좌우할 것입니다."
 germany_foci.152.a: "유로드론 개발"
 germany_foci.152.a_desc: "유로드론 개발에 투자하면 독일은 유럽 주도의 무인기 계획을 지원하고, 공동 방위 노력을 강화하며, 향후 감시 임무를 위한 신뢰할 수 있는 플랫폼을 확보할 수 있습니다."
 germany_foci.152.b: "유로드론 개발 및 1차분 구매"
 germany_foci.152.b_desc: "유로드론의 개발과 초도 도입을 모두 약속함으로써 연방군은 광범위한 정찰과 유연한 지원 능력을 갖춘 최첨단 무인기를 조기에 확보하고, 유럽 방위의 자율성을 강화합니다."
 germany_foci.152.c: "RQ-1 프레데터 선택"
 germany_foci.152.c_desc: "RQ-1 프레데터를 선택하면 연방군은 실전에서 검증되어 즉시 인도받을 수 있는 드론을 확보합니다. 첨단 감시 능력과 경타격 능력을 갖춘 프레데터는 국제 임무에서 작전 유연성과 대비 태세를 높여 줍니다."
 germany_foci.154.t: "연방군 공격 헬리콥터 후속기 개발"
 germany_foci.154.d: "노후한 공격 헬리콥터가 운용 수명의 끝에 가까워지면서, 연방군은 미래의 전투 요구를 충족할 후속기를 결정해야 합니다. 각 방안은 국제 협력부터 독자 개발 계획에 이르기까지 고유한 접근 방식을 나타내며, 독일의 전술 항공 능력과 방위 산업에 각기 다른 영향을 줄 것입니다."
 germany_foci.154.a: "프랑스와 함께 티거 II 개발"
 germany_foci.154.a_desc: "프랑스와의 티거 II 계획은 기존 유로콥터 티거의 설계를 바탕으로 화력, 기동성, 생존성을 높입니다. 이 협력은 유럽 방위 유대를 강화하는 한편 NATO 작전에 맞춘 차세대 공격 헬리콥터를 제공합니다."
 germany_foci.154.b: "미국, 핀란드와 함께 퇴르니 개발"
 germany_foci.154.b_desc: "미국, 핀란드와 협력하는 퇴르니 계획은 전설적인 군인 라우리 알란 퇴르니에게서 영감을 받은 현대화된 공격 헬리콥터를 제공합니다. 이 방안은 여러 협력국의 첨단 기술을 활용하여 상호 운용성을 높이고 연방군의 능력 범위를 넓혀 줍니다."
 germany_foci.154.c: "루델 독자 개발"
 germany_foci.154.c_desc: "저명한 독일 조종사 한스울리히 루델을 기려 명명된 루델 계획은 완전한 독일 독자 개발을 나타냅니다. 이 방식은 독일의 전략적, 전술적 필요에 맞춰 국내에서 생산한 독자적인 공격 헬리콥터를 연방군에 제공합니다."
 Germany_Mech.1.t: "훈련 사고: 미군 전차가 독일 학교를 타격"
 Germany_Mech.1.d: "정례 군사 훈련 도중 미군 전차가 실수로 알루미늄 훈련용 포탄을 독일 학교 지붕에 발사했습니다. 부상자는 없었으나 마당에서 아이들이 놀고 있었고 건물 안에 성인 두 명이 있었기에 큰 소동이 벌어졌습니다. 지역 관리들은 분노를 표하며 독일 영토에서 실시되는 합동 군사 훈련의 안전성에 의문을 제기했습니다. 어떻게 대응해야 할까요?"
 Germany_Mech.1.a: "미국에 책임을 묻고 보상을 요구한다."
 Germany_Mech.1.b: "피해가 없었으므로 사건을 축소한다."
 Germany_Mech.2.t: "슈바르츠발트에서 길 잃은 병사들"
 Germany_Mech.2.d: "슈바르츠발트 지역의 울창한 숲에서 야간 연방군 훈련 중 병사 여러 명이 길을 잃었습니다. 복귀 경로를 찾지 못하자 경찰과 소방 구조대를 포함한 긴급 구조대가 동원되어 이들을 수색하고 구출했습니다. 다친 사람은 없었으나, 이 사건으로 인해 항법 훈련의 효과와 낯선 지형에서 작전하는 병력의 준비 태세에 의문이 제기되고 있습니다."
 Germany_Mech.2.a: "이 일은 절대 대중에게 알려져서는 안 된다."
 Germany_Mech.2.b: "그래도 징집병일 뿐이었다."
 Germany_Mech.3.t: "다리 밑에 낀 레오파르트 2"
 Germany_Mech.3.d: "민망한 사건이 벌어졌습니다. 연방군의 레오파르트 2 주력 전차가 정례 기동 훈련 중 다리 밑에 끼어 버린 것입니다. 승무원들이 차량의 높이를 잘못 판단하는 바람에 교통이 완전히 마비되었습니다. 부상자는 보고되지 않았으나, 전차를 빼내려면 연방 기술구호청(THW)과 장갑 구난 차량의 도움이 필요했습니다. 언론이 곧바로 이 소식을 보도하여 대중의 조롱거리가 되었습니다."
 Germany_Mech.3.a: "우리 전차를 모는 멍청이들이 누구냐?"
 Germany_Mech.3.b: "그래도 사상자는 없었다."
 Germany_Mech.4.t: "저공비행하는 토네이도 전투기, 대중의 분노를 촉발"
 Germany_Mech.4.d: "발트해 상공에서의 훈련이 뜻밖의 방향으로 흘러, 공군의 토네이도 전투기 두 대가 붐비는 해변 위를 위험할 정도로 낮은 고도로 비행했습니다. 귀청이 터질 듯한 굉음과 갑작스러운 항공기의 출현에 해변의 피서객들이 놀라 항의가 빗발쳤습니다. 지역 당국은 해명을 요구하고 있으며, 군은 훈련에 필요한 과정이었다고 주장합니다."
 Germany_Mech.4.a: "적어도 훈련은 성공적이었다."
 Germany_Mech.4.b: "책임자인 장관을 당장 데려오라!"
 Germany_Mech.5.t: "술 취한 영국군 병사, 베르겐에서 전차 탈취"
 Germany_Mech.5.d: "´그는 혈중 알코올 농도가 1퍼밀로, 독일의 법적 운전 한도를 넘은 상태에서 차량 한 대를 부대 밖으로 몰고 나가기로 마음먹었습니다´라고 영국군 대변인 헬가 하이네는 말했다. ´어느 시점에서 그는 전차를 망가뜨리고 내려서 돌아가 다른 한 대를 가져와 같은 방향으로 몰았고, 제지되기 전에 나무를 들이받았습니다.´ 니더작센주 독일 경찰은 호네 기지의 18세 병사가 전차 두 대를 훔쳤다고 보고했으나, 하이네는 그것들이 실제로는 경전차로 불리기도 하는 장갑 정찰 차량 시미터였다고 말했다. 경찰에 따르면 병사가 베르겐 시 경계에 도달하기 직전, 마주 오던 승용차를 거의 들이받을 뻔하자 영국 헌병대가 그를 제지했다. 병사는 이어 순찰차를 도로 밖으로 밀어낸 뒤 전차의 통제력을 잃고 이정표를 들이받았으며, 두께 75센티미터의 나무에 가로막혀서야 멈췄다고 경찰은 전했다."
 Germany_Mech.5.a: "차량 절도는 중대한 범죄이며 그에 상응하게 처리될 것이다."
 Germany_Mech.5.b: "이 기사를 읽고 우리 모두 웃음이 터졌다"
 Germany_Mech.6.t: "연방군 훈련 후 포도원 피해"
 Germany_Mech.6.d: "라인란트팔츠주에서 야간 연방군 훈련이 끝난 뒤, 지역 포도주 생산자들이 울타리와 여러 포도나무가 훼손된 것을 발견했습니다. 인근에서 전차 궤도 자국이 발견되어 군사 활동과의 연관성이 강하게 시사됩니다. 그러나 연방군은 책임을 부인하며, 그 자국은 농업용 차량이나 야생동물이 남겼을 수 있다고 주장합니다. 피해를 입은 포도원 소유주들은 보상을 요구하고 있습니다."
 Germany_Mech.6.a: "의심스러울 때는 피고인의 이익으로."
 Germany_Mech.6.b: "우리끼리 와인 시음회에 초대하자."
 Germany_Mech.7.t: "장갑차량에 의해 훼손된 공원"
 Germany_Mech.7.d: "잘 관리되던 공공 공원이 하룻밤 사이에 깊은 타이어 자국과 파헤쳐진 잔디로 진흙탕이 되었습니다. 공교롭게도 근처에서 휠 방식 장갑차량이 참가한 연방군 훈련이 있었습니다. 분명한 증거가 있음에도 군 관계자들은 관련성을 부인하며 이 지역에 서식하는 많은 멧돼지를 가능한 원인으로 지목합니다. 하지만 연방군 차량과 일치하는 타이어 자국은 여전히 선명하게 남아 있습니다."
 Germany_Mech.7.a: "분명히 멧돼지의 소행이다!"
 Germany_Mech.7.b: "피해는 우리가 보상한다."
 Germany_Mech.8.t: "오발된 훈련용 미사일로 마을 통신 두절"
 Germany_Mech.8.d: "군사 훈련 도중 훈련용 미사일이 궤도를 벗어나 전국에 몇 안 남은 가공 전화선 중 하나에 얽혔습니다. 이어진 폭발로 회선이 끊어져 인근 소도시의 유선 통신망이 몇 시간 동안 두절되었습니다. 부상자는 없었으나, 이 사고는 훈련 안전과 노후한 민간 기반 시설에 대한 우려를 불러일으키고 있습니다."
 Germany_Mech.8.a: "선로를 수리하고 지하로 옮긴다."
 Germany_Mech.8.b: "이전 상태로 복구한다."
 Germany_Mech.21.t: "클라우스 라인하르트 장군의 퇴역"
 Germany_Mech.21.d: "2001년 연방군 현대화의 핵심 인물이었던 클라우스 라인하르트 장군이 빛나는 경력을 마치고 퇴역했습니다. 그는 폴란드군과 헝가리군을 NATO에 통합하는 데 중추적인 역할을 하여 동맹의 동부 측면을 강화했습니다. 1999년부터 2000년까지 NATO 코소보 평화유지군(KFOR) 사령관으로서 전후 지역을 안정시키며 탁월한 리더십을 보여 주었습니다. 라인하르트는 또한 1994년 육군지휘사령부를 창설하여 이를 연방군의 해외 작전, 특히 해외 파병을 위한 중앙 지휘부로 발전시켰습니다. 그의 노력으로 독일은 국제 평화유지 활동에 더 적극적으로 참여하는 국가가 되었습니다. 라인하르트 장군은 강화된 유럽 안보, 향상된 NATO 능력, 그리고 현대화되어 세계적 요구에 대응하는 독일군이라는 유산을 남기고 떠납니다."
 Germany_Mech.21.a: "대 차펜슈트라이히로 예우한다"
 Germany_Mech.21.b: "낡은 전통이다"
 Germany_Mech.34.t: "뤼디거 드레브스 장군의 퇴역"
 Germany_Mech.34.d: "뤼디거 드레브스 장군은 연방군에 크게 기여한 빛나는 경력을 마치고 퇴역했습니다. 전략적 리더십으로 알려진 드레브스는 독일 육군 현대화, 특히 작전 태세와 국제 협력 강화에 결정적인 역할을 했습니다. 그는 NATO 합동 훈련을 성공적으로 이행하는 데 기여하여 동맹 내 독일의 위상을 높였습니다. 또한 육군 지휘 구조의 핵심 개혁을 감독하여 국내외 임무에서의 효율성과 대응성을 개선했습니다. 특히 냉전 이후의 도전에 적응하며 연방군의 능력을 발전시킨 그의 노력은 지속적인 영향을 남겼습니다. 드레브스 장군의 퇴역은 독일군 내에서 헌신적 복무와 리더십이 이어져 온 한 시대의 종말을 의미합니다."
 Germany_Mech.34.a: "젊은 장교 두 명을 진급시킨다"
 Germany_Mech.34.b: "장교단을 정리한다"
 Germany_Mech.23.t: "호만 스캔들 폭로"
 Germany_Mech.23.d: "2003년 말, 기민당(CDU) 소속 연방의회 의원 마르틴 호만이 연설을 하여 곧바로 전국적인 스캔들에 불을 붙였습니다. 반유대주의적이라고 널리 받아들여진 그의 발언은 정치권 전반과 대중으로부터 거센 비판을 받았습니다. 이 논란은 사태에 어떻게 대응하고 당의 평판에 미칠 잠재적 타격을 어떻게 관리할지 고심하는 기민당 지도부에 막대한 압박을 가하고 있습니다."
 Germany_Mech.23.a: "호만을 즉시 기민당에서 제명한다!"
 Germany_Mech.23.b: "공개 견책하되 호만의 잔류는 허용한다."
 Germany_Mech.23.c: "사건을 축소하고 잠잠해지기를 기대한다."
 Germany_Mech.24.t: "마르틴 호만, 연방의회 사임"
 Germany_Mech.24.d: "마르틴 호만은 대중과 정치권의 막대한 압박을 받아 연방의회에서 물러났습니다. 기민당 지도부는 이로써 논란이 가라앉기를 바라지만, 스캔들은 이미 당의 이미지에 타격을 입혔습니다."
 Germany_Mech.24.a: "올바른 결정이었다"
 Germany_Mech.24.b: "이제 대중적 이미지 회복에 집중해야 한다"
 Germany_Mech.25.t: "기민당, 거세지는 반발에 직면"
 Germany_Mech.25.d: "마르틴 호만을 감싸기로 한 기민당의 결정은 국내외에서 상당한 반발을 불러일으켰습니다. 당은 이제 여러 비판에 직면해 있으며 많은 이들이 당 지도부에 의문을 제기하고 있습니다."
 Germany_Mech.25.a: "공개 사과하고 호만과 거리를 두어야 한다."
 Germany_Mech.25.b: "강경하게 나가고 이 문제를 과장한 언론을 비판한다."
 Germany_Mech.26.t: "기민당, 공개 사과 발표"
 Germany_Mech.26.d: "압박을 받은 기민당 지도부는 마르틴 호만의 논란 많은 발언으로부터 당을 분리하며 공개 사과를 발표했습니다. 이 조치는 반발을 잠재우려는 것이지만, 당의 평판에 대한 타격은 이미 입은 뒤입니다."
 Germany_Mech.26.a: "피해 수습과 대중의 신뢰 회복에 집중해야 한다"
 Germany_Mech.26.b: "대중의 이목을 돌리기 위해 새로운 정책 구상으로 초점을 옮긴다"
 Germany_Mech.27.t: "코스펠트 연방군 기지에서 고문 의혹 불거져"
 Germany_Mech.27.d: "코스펠트의 연방군 기지에서 병사들이 훈련 중 고문과 비인도적 대우를 받았다고 주장하는 충격적인 의혹이 제기되었습니다. 이 의혹은 독일 전역에 분노를 일으켰고 대중과 국제 관측통들로부터 광범위한 비난을 받았습니다. 보고에 따르면 병사들은 심각한 신체적 학대가 수반된 모의 인질 상황에 내몰렸으며, 이는 연방군 훈련 방식에 대한 중대한 의문을 낳고 있습니다. 이 스캔들로 인해 독일 정부와 군 지도부는 이러한 의혹을 신속하고 투명하게 해결해야 한다는 막대한 압박을 받고 있습니다. 국내외에서 독일의 평판에 미칠 잠재적 영향은 상당합니다. 정부가 이 위기를 어떻게 다루느냐에 따라 군에 대한 대중의 신뢰가 좌우되며 군사 훈련 규정의 앞날에도 영향을 미칠 수 있습니다."
 Germany_Mech.27.a: "즉각적이고 철저한 조사에 착수한다."
 Germany_Mech.27.b: "관련 인원을 모두 직위 해제하고 공개 사과한다."
 Germany_Mech.27.c: "의혹을 축소하고 언론의 논조를 관리한다."
 Germany_Mech.28.t: "필리프 홀츠만 AG의 파산"
 Germany_Mech.28.d: "필리프 홀츠만 AG의 파산은 독일 통일 이후 경제사에서 중대한 사건이었습니다. 1849년에 설립된 이 회사는 프랑크푸르트 증권거래소와 수에즈 운하 같은 상징적인 사업을 맡으며 유럽에서 가장 명망 높은 건설사 중 하나로 성장했습니다. 그러나 1990년대 후반에 이르러 홀츠만은 무리한 확장과 수익성 악화로 막대한 부채를 안고 있었습니다. 1999년 게르하르트 슈뢰더 총리는 독일 산업과 일자리를 지키기 위해 직접 나서서 정부 지원 구제 계획을 협상했습니다. 은행과 연방 정부의 대출 및 보증을 포함한 43억 마르크의 구제금융으로 붕괴는 일시적으로 모면되었고, 많은 이들의 눈에 슈뢰더는 이 회사의 구원자가 되었습니다. 그러나 이 구제는 더 깊은 재정 위기를 늦추었을 뿐이었습니다. 2002년에 이르러 회사의 지속 불가능한 부채와 시장의 어려움이 감당할 수 없는 수준이 되어 결국 파산에 이르렀습니다. 정부의 개입에도 불구하고 홀츠만이 실패한 일은 세계화된 경제에서 국가 지원의 한계를 상징했으며, 당시 독일 건설 부문의 취약성을 드러냈습니다."
 Germany_Mech.28.a: "다시 한 번 구제한다"
 Germany_Mech.28.b: "돈 낭비다"
 Germany_Mech.29.t: "함부르크 연방군 대학 스캔들: 신뢰의 훼손"
 Germany_Mech.29.d: "2006년 함부르크 연방군 대학 내부에서 심각한 스캔들이 불거져, 국방부 장관이 고위 장성 두 명인 디터와 루베를 강제로 퇴역시켰습니다. 논란은 연방군 내 극우 활동 혐의를 받은 루베의 아들에 대한 징계 조치를 둘러싸고 벌어졌습니다. 이 의혹이 불거지자 디터 장군은 군 규정을 지키는 대신 루베 장군에게 아들에 대한 진행 중인 수사 사실을 몰래 알렸습니다. 군 최고위층 내에서 일어난 이러한 신뢰 훼손과 권력 남용은 조직과 연방군에 대한 대중의 신뢰를 뒤흔들었습니다. 이 스캔들은 곧 전국적인 주목을 받으며 군 지도부의 청렴성과 군 내 극우 이념의 영향에 대한 의문을 낳았습니다."
 Germany_Mech.29.a: "디터와 루베의 행위를 공개적으로 규탄하고 즉각 퇴역시킨다."
 Germany_Mech.29.b: "연방군 내 극우 활동에 대한 전면 조사에 착수한다."
 Germany_Mech.29.c: "연방군의 평판이 더 이상 훼손되지 않도록 사안을 조용히 처리한다."
 Germany_Mech.30.t: "함부르크 스캔들에 대한 대중과 정치권의 반응"
 Germany_Mech.30.d: "디터와 루베 장군이 연루된 스캔들의 처리는 대중, 정치인, 군 내부에서 강한 반응을 이끌어냈습니다. 국방부 장관이 단호한 입장을 취하든 사안을 축소하든, 그 결정은 연방군과 집권 정부에 대한 대중의 신뢰에 상당한 영향을 미칠 것입니다."
 Germany_Mech.30.a: "군 윤리와 규율을 지키겠다는 의지를 재확인한다."
 Germany_Mech.30.b: "극단주의 대응에서 투명성의 중요성을 강조한다."
 Germany_Mech.30.c: "대중의 불만이 낳을 결과를 감수한다."
 Germany_Mech.31.t: "연방군 내 극우 극단주의 조사"
 Germany_Mech.31.d: "연방군 내 극우 활동에 대한 조사에서 일부 병사와 장교들 사이에 극단주의 이념이 뿌리내리고 있다는 충격적인 증거가 드러났습니다. 이로 인해 이러한 신념이 군 내에서 어떻게 퍼지도록 방치되었는지에 대한 더 폭넓은 조사가 이루어지고 있습니다. 조사 결과는 군 모집, 훈련, 감독에 광범위한 영향을 미칠 수 있습니다."
 Germany_Mech.31.a: "확인된 극단주의자들을 군에서 숙청하고 모집 절차를 개혁한다."
 Germany_Mech.31.b: "민주주의 가치와 군 윤리에 관한 의무 교육을 도입한다."
 Germany_Mech.31.c: "피해 수습과 홍보에 집중한다."
 Germany_Mech.32.t: "닷컴 버블의 붕괴"
 Germany_Mech.32.d: "한때 번성하던 기술 부문이 닷컴 버블이 터지면서 파국적인 붕괴를 맞았고, 독일의 *노이어 마르크트*에서 막대한 투기 자본이 증발했습니다. 한때 무한한 성장을 약속하던 기술 스타트업들이 무너졌고, 주가는 폭락했으며, 수천 명의 투자자가 막심한 손실을 입고 있습니다. *노이어 마르크트*의 붕괴는 파산과 실업의 물결, 그리고 시장 신뢰의 대폭락을 불러왔습니다. 이 금융 붕괴는 경제 전체에 충격파를 보내며 통제되지 않은 투기의 위험을 드러냈고, 정부는 경제 위기와 씨름할 수밖에 없게 되었습니다."
 Germany_Mech.32.a: "충격을 줄인다"
 Germany_Mech.32.b: "시장은 스스로 조정될 것이다"
 Germany_Mech.40.t: "'학교 운동장 프로젝트' CD, 독일 전역에 배포"
 Germany_Mech.40.d: "'Wir sind keine Ausländerfeinde, wir lieben das Fremde, in der Fremde.' 이것은 독일 청소년에게 영향을 미치려는 선전 운동의 첫 구절이었습니다. 민족주의 음악과 노골적인 외국인 혐오 메시지를 담은 '학교 운동장 프로젝트' CD가 공화국 전역의 운동장과 청소년 센터 인근에서 은밀히 배포되었습니다. 자유 동지회(Freie Kameradschaften) 운동의 구성원들이 기획한 이 작전은 젊은이들에게 반미주의와 극단적 민족주의를 주입하려 했습니다. 이 노래들은 결코 무해하지 않았으며, 록 음악을 이용해 위험한 사상을 젊은 마음에 각인시키도록 귀에 쏙 들어오고 기억에 남게 만들어졌습니다. 슈탈게비터(Stahlgewitter)와 프론탈크라프트(Frontalkraft) 같은 밴드가 이 CD에 수록되어, 민족주의 정서를 찬양하고 외국인과 서방에 대한 불신을 퍼뜨리는 공격적이고 찬가 같은 곡들을 선보였습니다. 이 CD가 학교와 청소년 모임을 통해 퍼지면서, 캠페인 배후 세력이 다음 세대를 급진화하려 했음이 분명해졌습니다. 이제 당국은 어떻게 대응할지 결정해야 합니다."
 Germany_Mech.40.a: "배후 인물을 조사하여 찾아낸다"
 Germany_Mech.40_a: "이 선전 활동을 벌인 조직망을 식별하여 해체하기 위한 철저한 수사에 착수합니다. 배후 세력이 우리 청소년을 계속 이용하도록 내버려 둘 수 없습니다."
 Germany_Mech.40.b: "하급 기관이 처리할 사안이다"
 Germany_Mech.40_b: "이 사건을 지방 당국에 위임합니다. 우리가 더 큰 국가적 사안에 집중하는 동안 지방 당국이 처리할 수 있을 것입니다."
 Germany_Mech.41.t: "NPD, 새로운 선전 운동으로 '학교 운동장 프로젝트'를 모방"
 Germany_Mech.41.d: "'학교 운동장 프로젝트' 작전을 섬뜩하게 되풀이하듯, 극우 NPD(독일 국가민주당)가 독일 청소년을 겨냥해 유사한 수법을 채택했습니다. 이번 캠페인은 록 음악을 넘어섭니다. 루니코프(Lunikoff), 슬라이프니르(Sleipnir), 노이에 베르테(Noie Werte) 같은 인기 극우 가수들이 참여하여, 그들의 노래에는 한층 노골적인 민족주의와 외국인 혐오 주제가 담겨 있습니다. 강렬하고 도발적인 이 음악은 환멸을 느낀 청소년들의 마음을 끌기 위한 것으로, 귀에 감기는 찬가풍 가사를 통해 극우 사상을 심어 줍니다. 우려스러운 점은 NPD 당원 옌스 퓌제가 수정주의적 견해로 알려진 포크 음악가 프랑크 렌니케를 이 캠페인에 끌어들였다는 것입니다. 렌니케의 음악은 덜 공격적이지만, 가사는 민족주의 이상을 찬양하고 수정주의라는 미명 아래 홀로코스트 같은 역사적 만행을 은근히 부정합니다. 그의 음악은 캠페인에 다른 차원을 더하며, 전통주의적이고 문화주의적인 서사를 찾는 이들에게 호소합니다. 렌니케가 홀로코스트 부정론자들과 어울린다는 사실은 인권 단체들 사이에 경종을 울렸고, 이 선전 운동의 위험성을 더욱 키웠습니다. NPD는 록에서 포크에 이르는 이 폭넓은 음악적 스펙트럼으로 더 넓은 그물을 던져, 불만을 품은 청소년뿐만 아니라 독일의 과거와 문화적 정체성에 이끌리는 이들까지 급진화하기를 바라고 있습니다."
 Germany_Mech.41.a: "NPD의 캠페인을 조사하여 저지한다"
 Germany_Mech.41_a: "이 작전을 와해시키기 위해 전국적인 수사에 착수합니다. 극우 극단주의 선전이 통제되지 않은 채 퍼지도록 내버려 둘 수 없습니다."
 Germany_Mech.41.b: "문제를 축소한다"
 Germany_Mech.41_b: "지방 당국이 상황을 조용히 감시하게 합니다. 이 문제를 국가 차원에서 다루어 그들에게 더 많은 홍보 효과를 주는 것은 피해야 합니다."
 Germany_Mech.42.t: "표현의 자유 논쟁 속에서 란저, 최초로 범죄 조직 유죄 판결 위기"
 Germany_Mech.42.d: "란저(Landser)에 대한 금지 절차는 예술과 표현의 자유에 대한 독일의 헌법적 보호와 인종 혐오 선동 및 범죄 조직에 관한 국가의 엄격한 법률이 맞서는 전국적 논쟁에 불을 붙였습니다. 란저는 자신들의 음악이 표현의 자유이자 항의의 표현이라고 주장하지만, 당국은 가사가 불법적인 혐오 발언과 조직적 범죄 활동의 선을 넘었다고 주장합니다. 극우 하위문화의 밴드가 범죄 조직(kriminelle Vereinigung)으로 기소된 것은 이번이 처음이어서, 이 사건은 법적 선례와 공론 모두에 중요합니다. 이 사건을 비판하는 이들은 예술의 자유와 표현의 자유가 위협받을 수 있다고 경고하며, 란저를 범죄화하면 불쾌하지만 헌법적 보호를 받을 수 있는 견해를 가진 음악가와 예술가를 기소하는 우려스러운 선례가 될 수 있다고 주장합니다. 반면 금지를 지지하는 이들은 란저가 네오나치 세력과 분명한 연관이 있으며 그들의 음악이 폭력을 선동하고 극우 극단주의를 퍼뜨리는 역할을 한다고 지적합니다. 밴드의 가사는 과거의 만행을 찬양하고, 소수자에 대한 증오를 부추기며, 인종차별적이고 외국인 혐오적인 폭력을 공공연히 옹호하여 공공 안전에 대한 심각한 우려를 낳고 있습니다. 재판이 진행됨에 따라 법원은 표현의 자유라는 기본권과 민주주의 가치 및 공공 질서의 보호 사이에서 균형을 잡아야 하며, 이는 현대 민주 국가에서 자유와 안보 사이의 긴장을 부각시킵니다."
 Germany_Mech.42.a: "금지를 추진하고 선례를 남긴다"
 Germany_Mech.42_a: "기소를 추진하여, 특히 인종 혐오와 폭력 선동이 개입된 경우 범죄 조직이 표현의 자유를 방패 삼아 숨을 수 없다는 분명한 선례를 남깁니다. 이 결정은 예술가를 가장한 극단주의 단체에 대한 법의 접근 방식을 바꿀 수 있습니다."
 Germany_Mech.42.b: "표현의 자유를 존중하되 면밀히 감시한다"
 Germany_Mech.42_b: "그들의 메시지는 비난받아 마땅하지만, 범죄 조직법으로 란저를 기소하면 표현의 자유를 침해할 위험이 있습니다. 전면 금지 대신 폭력을 막기 위해 감시와 사찰을 강화하되, 표현의 자유를 지나치게 제한하여 그들에게 순교자의 지위를 주는 일은 피합니다."
 Germany_Mech.43.t: "표현의 자유 논쟁 속에서 란저, 최초로 범죄 조직 유죄 판결 위기"
 Germany_Mech.43.d: "헌법수호청이 극우 운동 단체가 조직한 임박한 콘서트에 대해 알려 왔습니다. 악명 높은 네오나치 밴드 슈탈게비터, 루니코프가 출연하고, 군중이 란저의 악명 높은 곡 '슈투름퓌러'를 합창할 예정입니다. 비공개 장소에서 열릴 이 행사에는 전국에서 극우 극단주의자들이 대거 모일 것으로 예상됩니다. 이 콘서트는 단순한 모임이 아니라 폭력적이고 증오에 찬 이념을 퍼뜨리는 무대이자 참석자들의 추가 급진화를 부를 수 있는 불씨로 간주됩니다. 문제의 가사는 나치 독일을 찬양하고, 소수 집단을 조롱하며, 백인우월주의 폭력을 조장하는 노골적인 호소입니다. 슈탈게비터의 찬가는 \\"Wir brauchen sie wieder und das ist kein Witz, die Jungs in Schwarz mit dem doppelten Blitz\\"라고 외치며 SS의 부활을 공공연히 요구합니다. 루니코프는 \\"Polacken lümmel, schrein White Power, oh wie ich dieses scheiss Volk hasse\\" 같은 구절로 인종 증오를 부추기고, 나치 상징과 폭력 찬양을 다룬 란저의 '슈투름퓌러'에 군중이 열광적으로 참여하는 모습은 위험한 수준의 동조를 보여 줍니다. 이 콘서트는 표현의 자유, 공공 안전, 법치의 경계를 시험하는 법적, 도덕적 도전입니다. 이 모임을 막고 극우 세력의 박해 서사를 부추길 위험을 감수해야 할까요, 아니면 진행을 허용하고 추가 급진화를 가능하게 할 위험을 감수해야 할까요?"
 Germany_Mech.43.a: "중단시킨다"
 Germany_Mech.43_a: "증오와 폭력을 조장하는 공개 집회를 용납할 수 없습니다. 법 집행 기관을 동원하여 개입하고, 주최자를 체포하며, 이런 콘서트를 와해시킵니다. 네오나치 선전이 우리 사회에 설 자리가 없다는 분명한 메시지를 보내야 합니다."
 Germany_Mech.43.b: "감시를 강화하되 직접 대치는 피한다"
 Germany_Mech.43_b: "혐오스럽지만, 콘서트를 중단시키면 긴장이 고조되고 극우 세력의 탄압 주장을 부추길 수 있습니다. 대신 감시를 강화하고, 참석자를 주시하며, 정보를 수집합니다. 눈에 띄지 않게 움직임으로써 운동의 핵심 인물을 조용히 추적하고 향후 행사를 와해시킬 수 있습니다."
 Germany_Mech.43.c: "진행을 허용하되 법적 조치를 준비한다"
 Germany_Mech.43_c: "엄중한 감시 아래 콘서트를 진행하도록 허용하되, 이후 법적 조치를 취할 준비를 합니다. 이렇게 하면 그들이 '표현의 자유'를 방어 논리로 삼는 것을 막으면서, 인종 혐오와 폭력 선동 혐의로 주최자와 출연자에 대한 탄탄한 증거를 쌓을 수 있습니다."
 Germany_Mech.44.t: "루니코프의 무대 복귀"
 Germany_Mech.44.d: "네오나치 밴드 란저를 이끈 혐의로 복역을 마친 뒤, 루니코프로도 알려진 미하엘 레그너가 극우 음악계에 다시 나타났습니다. 란저가 범죄 조직(kriminelle Vereinigung)으로 분류되어 법원 명령으로 해체된 뒤, 레그너는 이전 밴드 동료들이 집행유예로 풀려난 것과 달리 징역 3년이라는 더 무거운 처벌을 받았습니다. 법원은 그를 주모자(Rädelsführer)로 지목하여 밴드의 범죄 혐의의 얼굴로 만들었습니다. 이제 재판의 먼지가 가라앉자 루니코프는 새 밴드를 결성하고 이번에는 한층 계산된 방식으로 자신의 메시지를 다시 퍼뜨리려 하고 있습니다. 정부, 소수자, 옛 동료에 대한 경멸로 가득한 그의 새 가사는 즉각적인 법적 결과를 피하기 위해 변호사 세 명의 검토를 거쳤습니다. 과거의 노골적으로 공격적인 어조 대신, 새 음악은 조롱 섞인 유머러스한 스타일을 사용하여 자신의 극우 세계관에 맞지 않는 모든 것을 조롱합니다. 외국인, 소수자, 정부 관료 모두 그의 조롱 대상이 되지만, 증오는 여전히 표면 바로 아래에 있으며 명백한 범죄 혐의를 피하도록 교묘히 위장되어 있습니다. 그의 복귀는 중대한 도전을 제기합니다. 가사가 직접적인 선동을 교묘히 피하더라도 극우 운동에 울림을 주는 위험한 함의를 여전히 담고 있어 그들이 급진적 의제를 계속 추진하도록 부추기기 때문입니다."
 Germany_Mech.44.a: "그를 금지할 수는 없지만 주시할 것이다"
 Germany_Mech.44_a: "그의 새 가사는 합법성의 경계를 아슬아슬하게 오가지만, 현재로서는 그에게 법적 조치를 취할 수 없습니다. 그를 금지하여 순교자로 만들기보다는 그의 활동을 면밀히 감시하고 계속 증거를 수집할 것입니다. 이렇게 하면 그의 영향력이 통제 없이 퍼지는 것을 막을 수 있습니다."
 Germany_Mech.45.t: "루돌프 헤스 묘소의 철거"
 Germany_Mech.45.d: "한때 아돌프 히틀러의 총통 대리였던 루돌프 헤스의 묘소가 묘지 임대 기간이 만료된 후 오늘 조용히 철거되었습니다. 1941년 평화 협상을 위해 스코틀랜드로 단독 비행을 감행한 뒤 종신형을 선고받은 헤스는, 특히 1987년 슈판다우 교도소에서 의문사한 이후 네오나치 운동에서 충성과 순교의 상징이 되었습니다. 분지델에 있던 그의 묘소는 극우 극단주의자들의 순례지가 되었으며, 그들은 그를 나치 정권의 마지막 살아 있는 연결 고리이자 히틀러에 대한 변함없는 충신으로 여겼습니다. 이렇게 커지는 현상을 단호히 차단하기 위해 지방 당국과 헤스 가족은 묘지 임대를 갱신하지 않기로 합의했습니다. 그의 유해는 발굴되어 화장되었고 유골은 바다에 뿌려져, 네오나치들이 모여 그를 찬양할 물리적 장소가 사라졌습니다. 묘소 철거는 극우 극단주의와의 싸움에서 중요한 승리이며, 운동의 가장 강력한 역사적 연결 고리 중 하나를 상징적으로 끊어 낸 것입니다. 이 잠재적 성지를 없앰으로써 독일 정부는 현대 독일에 나치 인물을 찬양할 자리는 없다는 분명한 메시지를 보내고자 합니다."
 Germany_Mech.45.a: "바람직한 진전이다"
 Germany_Mech.46.t: "메펜에서 재판받는 다니엘 기제"
 Germany_Mech.46.d: "극우 밴드 슈탈게비터의 프런트맨 다니엘 기제는 폭력을 선동하고 역사적 만행을 부정한다고 비판받는 논란의 가사로 메펜 법정에서 조사를 받고 있습니다. 그의 곡 '되너-킬러'는 NSU 테러 조직의 인종 동기 살인과 섬뜩하게 일치하며, 실제 공격과 소름 끼치게 닮은 사건을 서술합니다. 곡 속 일부 세부 사항은 당시 공개되지 않은 사실이어서 수사관들 사이에 경각심을 불러일으켰습니다.\n또 다른 곡 '게슈뷔어 암 아프터'는 많은 이들이 홀로코스트 부정으로 해석하는 암호 같은 표현을 사용하여 역사가들을 조롱하고 집단 학살에 관한 역사적 기록을 깎아내립니다. 대중의 분노와 반파시스트 단체들의 비난에도 불구하고, 기제의 변호인 기자 팔은 이 곡들이 법으로 보호받는 예술적 표현이라고 옹호합니다. 이 재판은 표현의 자유 경계와 극우 선전에 대한 책임을 둘러싼 치열한 논쟁을 불러일으켰으며, 독일에서 법적 선례가 될 수 있습니다."
 Germany_Mech.46.a: "우리는 법원을 신뢰한다"
 Germany_Mech.47.t: "다니엘 기제, 징역 3년 선고"
 Germany_Mech.47.d: "메펜 법원이 판결을 내렸습니다. 슈탈게비터의 프런트맨 다니엘 기제는 징역 3년을 선고받았습니다. 법원은 기제가 주로 극우 음악계에서의 이력과 '되너-킬러', '게슈뷔어 암 아프터' 같은 곡에 담긴 명백한 증오 메시지로 인해 민중 선동(Volksverhetzung)과 범죄 행위 옹호(Billigung von Straftaten)에 대해 유죄라고 판단했습니다. 법원은 기제의 가사가 단순한 예술적 표현이 아니라 폭력을 부추기고 위험한 허위를 퍼뜨리는 행동 촉구였다고 강조했습니다. 극우 이념에 오랫동안 관여해 온 점과 그 공동체 내의 영향력 있는 역할이 이 사건에서 가중 요소로 고려되었습니다. 그 결과 법원은 그러한 선동이 독일에서 용납되지 않는다는 분명한 메시지를 보내기 위해 징역형이 필요하다고 판결했습니다. 이 판결은 음악 산업 내 극우 극단주의에 맞선 법적 싸움에서 중요한 순간이며, '예술의 자유'가 혐오 발언의 방패로 쓰이는 향후 사건의 선례가 됩니다."
 Germany_Mech.47.a: "법원이 잘하고 있다"
 Germany_Mech.48.t: "다니엘 기제, 집행유예와 벌금형"
 Germany_Mech.48.d: "다소 관대한 결과로, 다니엘 기제는 민중 선동과 범죄 행위 옹호 혐의로 7개월의 집행유예와 1,000유로의 벌금형을 선고받았습니다. 법원은 특히 '되너-킬러'와 '게슈뷔어 암 아프터'에서 기제의 가사가 지닌 심각성을 인정했지만, 전과가 많지 않고 예술의 자유를 주장한 점 등의 감경 요소로 인해 징역형을 면했습니다. 그러나 법원은 추가 범행 시 더 무거운 처벌이 따를 것임을 분명히 했습니다. 기제의 집행유예는 면밀히 감시될 것이며, 벌금은 추가적인 선동 행위를 억제하기 위한 것입니다. 비판자들은 이 형량이 그의 음악이 지닌 극우 영향력을 억제하기에 충분하지 않을 수 있다고 주장하지만, 법 체계는 일단 판단을 내렸습니다. 이 결정은 표현의 자유와 위험한 이념에 맞서야 할 필요 사이의 균형, 특히 음악과 예술 분야에서의 균형에 관해 중요한 의문을 제기합니다."
 Germany_Mech.48.a: "매우 섬뜩하다"
 Germany_Mech.50.t: "대규모 이주 지지 시위"
 Germany_Mech.50.d: "2000년대 중반, 독일은 이민 정책을 둘러싼 긴장이 고조되고 있었습니다. 베를린에서 대규모 이주 지지 시위가 벌어져, 시위대는 더 인도적인 난민법과 더 나은 통합 정책을 요구하고 있습니다. 클라우디아 로트와 노벨상 수상자 귄터 그라스 같은 공인들이 이 운동을 지지하며 다양성의 중요성과 난민을 도와야 할 독일의 도덕적 의무를 강조했습니다. 이 시위는 이민자의 유입이 사회 결속을 위협한다고 주장하는 민족주의 단체들의 반대에 직면해 있습니다."
 Germany_Mech.50.a: "시위를 공개 지지하고 더 포용적인 이민 정책을 추진한다."
 Germany_Mech.50.b: "중립을 유지하며 상황을 주시한다."
 Germany_Mech.50.c: "시위를 진압하고 현행 이민 정책을 유지한다."
 Germany_Mech.51.t: "반이민 시위"
 Germany_Mech.51.d: "2000년대 들어 반이민 정서가 고조되면서 이민에 반대하는 시위가 퍼지기 시작했습니다. 위르겐 W. 묄레만 같은 우익 인사와 기성 체제에 반대하는 정치인들의 지지를 받는 민족주의 단체들은 사회 결속과 경제적 부담에 대한 우려를 내세워 더 엄격한 이민 통제를 요구하고 있습니다. 이러한 시위는 정부의 이민 정책에 대한 불만이 커지고 있음을 보여 주며 전국적 논쟁을 격화시키고 있습니다."
 Germany_Mech.51.a: "시위를 규탄하고 이민의 이점을 강조한다."
 Germany_Mech.51.b: "상황을 주시하고 시위 현장의 경비를 강화한다."
 Germany_Mech.51.c: "민족주의 정서를 달래기 위해 이민 정책 강화 요구를 지지한다."
 Germany_Mech.52.t: "이민자에 대한 폭력 공격"
 Germany_Mech.52.d: "이민자 집단에 대한 폭력 공격이 전국에 경종을 울렸습니다. 극우 극단주의 단체와 연관된 것으로 추정되는 가해자들은 이민자를 잔혹하게 습격하여 외국인 혐오 폭력 증가에 대한 공포를 부추겼습니다. 당시 게르하르트 슈뢰더 총리와 오토 쉴리 장관을 비롯한 공인들은 폭력을 규탄하고 극우 극단주의에 대한 단속을 촉구했습니다. 한편 이민자 공동체와 지역 주민 간의 긴장은 커지고 있습니다."
 Germany_Mech.52.a: "공격을 규탄하고 피해 지역의 경찰 배치를 늘린다."
 Germany_Mech.52.b: "폭력의 동기를 조사하는 동안 이민자 공동체의 안전을 보장한다."
 Germany_Mech.52.c: "추가적인 사회 불안을 피하기 위해 사건을 축소한다."
 Germany_Mech.53.t: "이민자 보호소 방화 공격"
 Germany_Mech.53.d: "방화로 추정되는 공격으로 이민자 보호소에 불이 났습니다. 이 공격은 국내 일부 지역에서 반이민 수사와 폭력이 증가하는 가운데 발생했습니다. 지방 당국은 수사에 착수했고, 활동가들은 극우 운동의 부상을 유력한 원인으로 지목하고 있습니다. 그러나 일부에서는 화재가 우발적이었거나 보호소 내부 갈등의 결과일 수도 있다고 주장합니다."
 Germany_Mech.53.a: "방화에 대한 전면 수사에 착수하고 이민자 보호소의 안전에 집중한다."
 Germany_Mech.53.b: "화재 원인에 대한 추측은 피하며 피해 가족의 재정착을 최우선으로 한다."
 Germany_Mech.53.c: "고조되는 사회적 긴장을 탓하되 특정 집단을 직접 비난하지는 않는다."
 Germany_Mech.54.t: "이민자 공동체와의 갈등"
 Germany_Mech.54.d: "이민자 공동체와 지역 주민 사이에 사회적 긴장이 높아지면서 여러 차례 폭력적 충돌이 발생했습니다. 경제적 경쟁에서 문화적 차이에 이르는 문제들이 갈등을 부추기고 있습니다. 에드문트 슈토이버 같은 저명한 정치인들은 커지는 긴장을 완화하려면 더 나은 통합 정책이 필요하다고 의견을 밝혔습니다. 한편 민족주의 단체들은 이러한 사건들을 이용해 더 엄격한 이민법을 요구하고 있습니다."
 Germany_Mech.54.a: "긴장의 근본 원인을 해결하기 위해 더 포용적인 통합 정책을 추진한다."
 Germany_Mech.54.b: "추가 충돌을 막기 위해 피해 지역의 치안을 강화한다."
 Germany_Mech.54.c: "갈등을 더 엄격한 이민법의 명분으로 삼는다."
 Germany_Mech.55.t: "이민자 연루 범죄 사건"
 Germany_Mech.55.d: "이민자가 연루된 세간의 이목을 끄는 범죄 사건 몇 건이 언론에 보도되어 이민에 대한 대중의 공포를 더욱 부채질했습니다. 우익 정치인과 언론사들은 이러한 이야기를 증폭시켜 더 엄격한 이민 정책을 밀어붙이고 있습니다. 한편 이민자 옹호 단체들은 이러한 사건이 과장되었으며 법을 준수하는 대다수 이민자를 반영하지 않는다고 주장합니다."
 Germany_Mech.55.a: "범죄의 근본 원인을 해결하고 통합 노력을 개선한다."
 Germany_Mech.55.b: "이민자 문제를 악화시키지 않으면서 법과 질서 유지에 집중한다."
 Germany_Mech.55.c: "이 사건들을 더 엄격한 국경 통제와 이민 정책의 명분으로 삼는다."
 Germany_Mech.56.t: "통합 부족과 사회적 긴장"
 Germany_Mech.56.d: "이민자 인구가 늘어남에 따라 통합 문제가 더욱 뚜렷해지고 있습니다. 많은 이민자가 언어 장벽, 실업, 사회적 고립으로 어려움을 겪고 있으며, 이는 전국 각지에서 긴장을 높이고 있습니다. 볼프강 쇼이블레 같은 정치인들은 더 탄탄한 통합 프로그램을 요구한 반면, 일부 민족주의 세력은 이민자 통합의 실패가 이민 정책을 재고해야 한다는 증거라고 주장합니다."
 Germany_Mech.56.a: "이민자를 위한 어학 과정과 직업 훈련 프로그램의 재정 지원을 늘린다."
 Germany_Mech.56.b: "통합 문제를 지방 정부가 사안별로 처리하도록 맡긴다."
 Germany_Mech.56.c: "통합의 실패를 인정하고 이민자 수용을 줄인다."
 Germany_Mech.57.t: "이민자 집단 내 급진화 추세"
 Germany_Mech.57.d: "최근 정보 보고서에 따르면 일부 이민자 집단, 특히 사회로부터 소외감을 느끼는 이들 사이에서 급진화가 증가하고 있습니다. 대다수 이민자는 평화롭게 통합되고 있지만, 소수는 극단주의 이념으로 돌아섰습니다. 당국은 더 강경한 보안 조치를 시행할지, 아니면 급진화를 부추기는 근본적인 사회적, 경제적 여건을 해결하는 데 집중할지 논의하고 있습니다."
 Germany_Mech.57.a: "급진화를 막기 위해 감시와 보안 조치를 강화한다."
 Germany_Mech.57.b: "극단주의의 매력을 줄이기 위해 사회적 불평등을 해소한다."
 Germany_Mech.57.c: "공동체의 신뢰를 쌓기 위해 통합 프로그램 강화에 집중한다."
 Germany_Mech.58.t: "문화 간 교류를 촉진하는 문화 행사"
 Germany_Mech.58.d: "사회적 긴장을 완화하고 화합을 촉진하기 위해 여러 도시에서 문화 간 교류를 장려하는 문화 행사를 열기 시작했습니다. 레나테 퀴나스 같은 인사와 '프로 아실(Pro Asyl)' 같은 단체의 지원을 받는 이 행사들은 음악, 음식, 대화를 통해 이민자 공동체와 지역 공동체 사이의 간극을 메우는 것을 목표로 합니다. 행사들은 대체로 호평을 받고 있지만, 민족주의 단체들은 다문화주의를 대중에게 강요하려는 시도라고 비난합니다."
 Germany_Mech.58.a: "문화 간 교류 프로그램을 공개 지지하고 확대한다."
 Germany_Mech.58.b: "행사를 계속하도록 허용하되 중립을 유지한다."
 Germany_Mech.58.c: "행사를 불필요하다고 규탄하고 더 제한적인 문화 정책을 시행한다."
 Germany_Mech.59.t: "언론 내 증오 캠페인"
 Germany_Mech.59.d: "극우 언론과 민족주의 간행물들이 이민자들에 대한 조직적인 캠페인을 시작하여 범죄율과 문화적 차이에 대한 공포와 허위 정보를 퍼뜨리고 있습니다. 지하 네오나치 조직과 민족주의 정치인들의 지원을 받는 이러한 증오 캠페인은 반이민 정서를 부추기고 국내 분열을 심화시키고 있습니다. 요슈카 피셔 같은 저명한 정치 지도자들은 언론 내 혐오 발언에 대한 규제를 촉구했으며, 표현의 자유 옹호자들은 더 균형 잡힌 접근을 주장합니다."
 Germany_Mech.59.a: "증오 캠페인을 규탄하고 더 강력한 언론 규제를 시행한다."
 Germany_Mech.59.b: "극우 언론에 대한 감시를 강화하되 직접적인 검열은 피한다."
 Germany_Mech.59.c: "표현의 자유를 옹호하고 개입을 피한다."
 Germany_Mech.60.t: "언론 내 이주 지지 캠페인"
 Germany_Mech.60.d: "외국인 혐오가 고조되자 여러 언론사가 독일 사회에 대한 이민자들의 긍정적 기여를 부각하려는 이주 지지 캠페인을 시작했습니다. 저명한 언론인과 유명 인사들이 뒷받침하는 이 캠페인은 성공 사례와 이민의 경제적 이익을 보여 줌으로써 여론을 바꾸려 하고 있습니다. 그러나 민족주의 단체들은 언론이 통제되지 않은 이민이라는 의제를 추진하기 위해 대중을 조작하고 있다고 주장합니다."
 Germany_Mech.60.a: "언론 캠페인을 지지하고 이민자의 기여를 부각한다."
 Germany_Mech.60.b: "중립을 유지하고 공론이 논쟁을 형성하도록 놔둔다."
 Germany_Mech.60.c: "캠페인이 지나치게 편향적이라고 비판하고 이민 문제를 더 균형 있게 묘사하도록 압박한다."
 Germany_Mech.61.t: "학교와 교육 기관의 긴장"
 Germany_Mech.61.d: "더 많은 이민자 아동이 독일 교육 제도에 편입되면서 학교의 긴장이 높아지고 있습니다. 교사들은 통합, 언어 장벽, 문화적 오해로 인한 어려움을 호소하고 있습니다. 일부 학교, 특히 도시 지역의 학교에서는 현지 학생과 이민자 배경의 아동 사이에 갈등이 발생하고 있습니다. 리타 쥐스무트 같은 저명 인사들은 학교를 지원할 더 많은 자원을 요구한 반면, 다른 이들은 교육 제도가 이미 과부하 상태라고 주장합니다."
 Germany_Mech.61.a: "학교의 통합 프로그램과 언어 지원 예산을 늘린다."
 Germany_Mech.61.b: "학교가 통합 과제를 사안별로 처리하도록 허용한다."
 Germany_Mech.61.c: "교육 제도의 부담을 줄이기 위해 이민자 학생 수용을 제한한다."
 Germany_Mech.62.t: "종교 상징물과 관습을 둘러싼 분쟁"
 Germany_Mech.62.d: "공공 기관에서의 종교 상징물 노출과 종교적 관습 실천을 둘러싼 논쟁이 격화되었습니다. 특히 학교와 관공서에서 무슬림 여성이 히잡을 착용하는 문제가 논란을 일으켰습니다. 세속주의 단체들은 공공장소에서 종교 상징물을 금지해야 한다고 주장하는 반면, 볼프강 티어제 같은 정치인들의 지지를 받는 종교의 자유 옹호자들은 자신의 신앙을 공개적으로 표현할 권리를 옹호합니다."
 Germany_Mech.62.a: "공공 기관에서의 종교 상징물 금지를 지지한다."
 Germany_Mech.62.b: "개인의 표현의 자유를 존중하여 종교 상징물을 허용한다."
 Germany_Mech.62.c: "특정 민감한 영역에서만 종교 상징물을 제한하여 타협점을 찾는다."
 Germany_Mech.63.t: "강제 추방 반대 시위"
 Germany_Mech.63.d: "신청이 기각된 망명 신청자를 추방하겠다는 정부 계획에 항의하는 시위가 터졌습니다. 저명한 인권 단체와 교회 지도자를 비롯한 활동가들은 인도주의적 우려와 출신국의 불안한 여건을 들어 추방 중단을 요구하고 있습니다. 한편 우익 단체들은 이민을 통제하기 위해 추방이 필요하다고 주장합니다. 이 시위는 대중과 언론의 상당한 주목을 받고 있습니다."
 Germany_Mech.63.a: "추방을 중단하고 망명 사건을 개별적으로 재검토한다."
 Germany_Mech.63.b: "추방을 계속하되 인도적 대우를 보장한다."
 Germany_Mech.63.c: "이민에 대한 커지는 대중의 우려에 대응하기 위해 추방을 늘린다."
 Germany_Mech.64.t: "노동 시장 통합 문제"
 Germany_Mech.64.d: "독일의 이민자 노동자들은 언어 장벽, 차별, 관료적 장애물로 인해 안정적인 일자리를 구하기 어려워하고 있습니다. 보고에 따르면 많은 이민자가 자신이 얻을 수 있는 일자리에 비해 과도한 자격을 갖추고 있어 불만과 사회적 긴장으로 이어지고 있습니다. 주요 경제학자와 노동조합은 이민자의 노동 시장 통합을 개선하기 위한 개혁을 요구한 반면, 비판자들은 이민자가 현지 노동자의 임금 억제에 기여하고 있다고 주장합니다."
 Germany_Mech.64.a: "직업 훈련 프로그램을 시행하고 이민자에 대한 관료적 장벽을 줄인다."
 Germany_Mech.64.b: "고용주가 이민자를 더 많이 고용하도록 장려하되 직접 개입은 피한다."
 Germany_Mech.64.c: "현지 노동자를 보호하기 위해 이민자의 일부 직종 접근을 제한한다."
 Germany_Mech.70.t: "산업 이탈: 외주화 위기"
 Germany_Mech.70.d: "독일 산업의 근간이 위기에 직면해 있습니다. 높은 세금, 엄격한 해고 보호(Kündigungsschutz), 비싼 인건비로 인해 주요 기업들이 더 낮은 임금과 낮은 세금을 제공하는 국가로 생산 시설을 이전했습니다. 산업의 이탈은 독일 경제와 수많은 노동자의 일자리를 모두 위협하고 있습니다. 정부는 이 커져 가는 도전에 어떻게 대응해야 할까요?"
 Germany_Mech.70.a: "이러한 행태를 규탄한다"
 Germany_Mech.70_A: "정부는 외주화 추세를 규탄하지만 이를 막기 위해 한 일은 거의 없습니다. 이로 인해 공장들이 문을 닫고 산업 역량이 감소합니다. 산업 손실로 경제가 타격을 입어 안정도와 경제 생산량이 하락합니다."
 Germany_Mech.70.b: "기업을 붙잡기 위해 보조금을 지급한다"
 Germany_Mech.70_B: "정부는 기업들이 독일에 남도록 재정적 인센티브를 제공합니다. 이는 산업 손실을 막아 주지만 상당한 경제적 비용이 들어 공공 부채가 늘어납니다."
 Germany_Mech.70.c: "기업을 국유화한다"
 Germany_Mech.70_C: "정부는 추가적인 외주화를 막기 위해 산업을 국유화하는 극단적인 조치를 취합니다. 이 조치의 논쟁적 성격으로 인해 안정도가 감소하고 산업계 지도자들이 분노하지만, 공장에 대한 직접적인 통제를 통해 안정도가 소폭 향상됩니다."
 Germany_Mech.71.t: "어젠다 2010의 여파: 서비스 부문 회복"
 Germany_Mech.71.d: "독일의 어젠다 2010 개혁은 더 경쟁력 있는 노동 시장의 길을 열었지만, 많은 서비스 기반 기업이 높은 세금과 인건비 때문에 떠났습니다. 이제 세금 부담이 낮아지고 고용법이 규제 완화되면서 이들은 복귀를 고려하고 있습니다. 이들의 정착을 허용해야 할까요, 아니면 신규 기업으로 대체하거나 엄격한 조건을 유지해야 할까요?"
 Germany_Mech.71.a: "정착을 허용한다."
 Germany_Mech.71.b: "국내 기업으로 대체한다."
 Germany_Mech.71.c: "한번 떠난 이상 돌아올 길은 없다."
 Germany_Mech.72.t: "어젠다 2010의 여파: 산업 부문 회복"
 Germany_Mech.72.d: "어젠다 2010의 대대적인 개혁 이후 산업 부문이 복귀할 태세를 갖추고 있습니다. 노동 보호법이 완화되고 고용주 비용이 낮아지면서, 높은 세금과 임금 때문에 해외로 옮겨 갔던 기업들이 독일에 재투자하는 데 관심을 보이고 있습니다. 이 기회에 어떻게 대응해야 할까요?"
 Germany_Mech.72.a: "정착을 허용한다."
 Germany_Mech.72.b: "신규 산업으로 대체한다."
 Germany_Mech.72.c: "거부한다. 떠난 이상 복귀는 없다."
 Germany_Mech.73.t: "마니흘 피습 의혹 - 정치적 폭력인가, 조작인가?"
 Germany_Mech.73.d: "충격적인 사건으로, 파사우 경찰서장 알로이스 마니흘이 극우와 연관된 것으로 의심되는 인물에게 자택에서 습격당했다고 알려졌습니다. 마니흘에 따르면 공격자는 그를 찌르기 전에 섬뜩한 말을 했습니다. '민족 저항 세력이 안부를 전한다, 이 좌파 돼지야! 이제 우리 동지들의 무덤을 더는 짓밟지 못할 것이다!' 이 공격은 곧바로 네오나치에 대한 마니흘의 강경한 입장이 부채질한 정치적 동기의 습격으로 규정되었습니다. 극우 단체를 폐쇄하고 극단주의에 맞서 싸운 그의 노력은 이미 그에게 적을 만들었습니다. 공격 소식이 퍼지자 대중은 분노했고 전국에서 우익 폭력에 반대하는 시위가 터졌습니다. 그러나 수사가 진행되면서 의혹이 일기 시작했습니다. 마니흘의 진술에 나타난 모순, 명확한 증거의 부재, 공격자의 불분명한 행방이 의문을 불러일으켰습니다. 일각에서는 이 공격이 극우에 맞선 대중의 지지를 모으기 위한 술책이거나 개인적 동기의 결과로 연출되었거나 과장되었을 수 있다고 추측하기 시작했습니다. 대중이 답을 요구하고 정치적 긴장이 고조되는 가운데, 정부는 이 민감한 상황을 어떻게 다룰지 결정해야 합니다. 공식 서사를 지지하며 우익 극단주의의 위협에 집중해야 할까요, 아니면 더 깊이 파헤쳐 추가적인 논란을 감수해야 할까요?"
 Germany_Mech.73.a: "공식 설명을 지지한다"
 Germany_Mech.73.b: "알로이스, 자네 술 취했었지, 그렇지 않나?"
 Germany_Mech.90.t: "베르디(VER.di)의 창립"
 Germany_Mech.90.d: "독일에서 새롭고 강력한 노동조합인 통합서비스노동조합(Vereinigte Dienstleistungsgewerkschaft, VER.di)이 설립되었습니다. 여러 소규모 노조를 합병하여 결성된 베르디는 광범위한 공공 및 민간 부문 노동자를 대표하는 것을 목표로 합니다. 이는 독일 노동계 지형의 중대한 변화를 나타내며, 노동자의 권리를 강화하고 여러 산업에 걸쳐 수백만 노동자를 위한 단일한 목소리를 만들어 냅니다."
 Germany_Mech.90.a: "흥미롭군."
 Germany_Mech.90.a_desc: "독일 노동 운동에서 주목할 만한 진전입니다."
 Germany_Mech.91.t: "공공 부문 임금 협상"
 Germany_Mech.91.d: "공공 부문 노동자를 대표하는 노동조합들이 최근 임금 협상에서 요구 사항을 제시했습니다. 노동자들이 인플레이션에 대응하고 근로 조건을 개선하기 위해 상당한 임금 인상을 요구하는 가운데, 정부는 최선의 대응 방안을 결정해야 합니다. 재정 책임과 노동자 만족 사이의 균형을 맞추는 것이 중요합니다."
 Germany_Mech.91.a: "요구를 승인한다."
 Germany_Mech.91.a_desc: "임금 인상을 전면 수용하면 공공 부문 노동자들의 호의를 얻을 수 있지만 국가 예산에 부담이 됩니다."
 Germany_Mech.91.b: "중간에서 타협한다."
 Germany_Mech.91.b_desc: "타협안을 제시하면 긴장이 완화될 수 있지만 양측 모두 부분적으로 불만을 품게 될 위험이 있습니다."
 Germany_Mech.91.c: "꺼져라."
 Germany_Mech.91.c_desc: "양보를 거부하면 정부 예산을 아낄 수 있으나 파업과 사회 불안을 부를 수 있습니다."
 Germany_Mech.92.t: "의료 부문 임금 협상 격화"
 Germany_Mech.92.d: "베르디(Verdi) 대표자들은 소진, 인력 부족, 늘어나는 환자 수요를 이유로 의료 종사자에 대한 상당한 임금 인상과 근로 조건 개선을 주장하고 있습니다. 긴장이 고조되는 가운데 정부는 결정적 선택에 직면했습니다. 요구를 수용하거나, 의료 부문 전반의 사기와 서비스 품질이 붕괴될 위험을 감수해야 합니다."
 Germany_Mech.92.a: "요구를 수용한다."
 Germany_Mech.92.a_desc: "베르디의 요구를 전면 수용하면 근로 조건과 사기가 개선되지만 의료 부문 공공 지출을 크게 늘려야 합니다."
 Germany_Mech.92.b: "절충안을 제시한다."
 Germany_Mech.92.b_desc: "타협안을 협상하면 최악의 충돌을 피하면서도 일부 우려를 해소하려는 의지를 보여 줄 수 있습니다."
 Germany_Mech.92.c: "단호히 거부한다."
 Germany_Mech.92.c_desc: "요구를 단호히 거부하면 파업을 유발하고 대중의 불만을 키울 위험이 있지만 연방 예산에 부담이 더해지는 것은 피할 수 있습니다."
 Germany_Mech.93.t: "철강 산업 임금 협상"
 Germany_Mech.93.d: "철강 산업 노동자를 대표하는 노동조합이 사상 최대의 이익, 오르는 생활비, 노동자 생산성을 이유로 상당한 임금 인상을 요구하고 있습니다. 그러나 이 요구는 업계가 국제 경쟁과 더 엄격한 환경 규제의 압박을 점점 더 크게 받는 시기에 나왔습니다. 정부는 이 중대한 사안에 대한 입장을 결정해야 합니다."
 Germany_Mech.93.a: "요구를 승인한다."
 Germany_Mech.93.a_desc: "노조의 요구를 수용하면 노동자 만족을 보장하고 파업을 막을 수 있지만, 생산 비용이 늘어 해당 부문의 세계적 경쟁력을 훼손할 수 있습니다."
 Germany_Mech.93.b: "타협점을 모색한다."
 Germany_Mech.93.b_desc: "중간 지점을 협상하면 노동자의 필요와 산업의 지속 가능성 사이의 균형을 맞출 수 있지만, 양측 모두 불만을 품을 위험이 있습니다."
 Germany_Mech.93.c: "단호히 거부한다."
 Germany_Mech.93.c_desc: "요구를 거부하면 산업의 비용 구조를 지킬 수 있지만, 광범위한 파업이 일어나 생산성과 노사 관계에 타격을 줄 위험이 있습니다."
 Germany_Mech.94.t: "조선소 노동자 파업"
 Germany_Mech.94.d: "정체된 임금, 안전하지 않은 근로 조건, 운영 현대화에 대한 경영진의 소극적 태도를 이유로 조선소 노동자들 사이에서 대규모 파업이 발생했습니다. 이 파업으로 핵심적인 조선 및 수리 작업이 마비되어 이 산업에 크게 의존하는 지역의 경제 안정이 위협받고 있습니다. 이 파업을 해결하려면 노동자들의 요구와 조선 부문의 장기적 존속 가능성을 모두 신중히 고려해야 합니다."
 Germany_Mech.94.a: "노동자의 요구를 수용한다."
 Germany_Mech.94.a_desc: "노동자의 요구를 수용하면 생산성이 회복되겠지만 향후 협상에 값비싼 선례를 남길 수 있습니다."
 Germany_Mech.94.b: "균형 잡힌 해법을 협상한다."
 Germany_Mech.94.b_desc: "타협을 시도하면 재정 규율을 유지하면서 가동을 재개할 수 있지만, 양측의 불만이 장기화될 위험이 있습니다."
 Germany_Mech.94.c: "굳건히 버티며 파업을 진압한다."
 Germany_Mech.94.c_desc: "양보를 거부하면 향후 소요를 억제할 수 있지만 파업이 확대되어 조선 산업과 대중의 신뢰가 훼손될 위험이 있습니다."
 germany_nsu.1.t: "에네버 심셰크 살해 사건"
 germany_nsu.1.d: "2000년 9월 9일, 튀르키예계 독일인 꽃 상인 에네버 심셰크가 뉘른베르크에서 총격으로 살해되었습니다. 수사관들은 튀르키예계 공동체 내부의 조직범죄 연루를 의심했습니다. 이민자 공동체가 부당하게 표적이 되고 있다고 느끼면서 불안이 커지고 있습니다."
 germany_nsu.1.a: "조직범죄에 집중한다"
 germany_nsu.1.b: "뚜렷한 용의자 없이 계속한다"
 germany_nsu.2.t: "쥘레이만 타슈쾨프뤼 살해 사건"
 germany_nsu.2.d: "2001년 6월 27일, 튀르키예계 식료품상 쥘레이만 타슈쾨프뤼가 함부르크에서 살해된 채 발견되었습니다. 수사관들은 이번에도 튀르키예계 공동체 내부의 분쟁을 의심했습니다. 이민자들이 압박을 받고 있다고 느끼면서 긴장이 고조되고 있습니다."
 germany_nsu.2.a: "경찰의 압박을 강화한다"
 germany_nsu.2.b: "수사를 확대한다"
 germany_nsu.3.t: "하빌 크르츠 살해 사건"
 germany_nsu.3.d: "2001년 8월 29일, 하빌 크르츠가 뮌헨의 자신의 식료품점에서 총에 맞아 숨졌습니다. 당국은 계속 튀르키예계 공동체 내의 범죄에 초점을 맞추고 있으며, 이민자들 사이에 공포가 퍼지고 있습니다."
 germany_nsu.3.a: "범죄 연관성에 집중한다"
 germany_nsu.3.b: "경찰 순찰을 늘린다"
 germany_nsu.4.t: "메흐메트 투르구트 살해 사건"
 germany_nsu.4.d: "2004년 2월 25일, 메흐메트 투르구트가 로스토크에서 총에 맞아 사망했습니다. 이번에도 의심은 이민자 공동체로 향했고, 대중 사이에 더 큰 공포와 불신으로 이어졌습니다."
 germany_nsu.4.a: "이민자 공동체를 압박한다"
 germany_nsu.4.b: "단서 없이 수사를 계속한다"
 germany_nsu.5.t: "쾰른 폭탄 테러"
 germany_nsu.5.d: "2004년 6월 9일, 쾰른의 튀르키예계 주민이 다수인 지역에서 폭탄이 터져 22명이 다쳤습니다. 당국은 조직범죄 연루를 의심했으나 단서는 없었습니다."
 germany_nsu.5.a: "보안 조치를 강화한다"
 germany_nsu.5.b: "더 폭넓은 위협을 조사한다"
 germany_nsu.6.t: "미셸 키제베터 살해 사건"
 germany_nsu.6.d: "2007년 4월 25일, 경찰관 미셸 키제베터가 하일브론에서 살해되었습니다. 무작위로 보이는 이 공격은 대중에게 충격을 주었으며 우익 극단주의가 의심되고 있습니다."
 germany_nsu.6.a: "우익 극단주의를 조사한다"
 germany_nsu.6.b: "경찰의 안전에 집중한다"
 germany_nsu.7.t: "뵈른하르트와 문들로스의 자살"
 germany_nsu.7.d: "2011년 11월 4일, 우베 뵈른하르트와 우베 문들로스가 강도 미수 후 숨진 채 발견되어 극우 테러 조직의 존재가 드러났습니다."
 germany_nsu.7.a: "사건을 종결한다"
 germany_nsu.7.b: "연관성을 더 조사한다"
 germany_nsu.8.t: "NSU 범행 성명 영상"
 germany_nsu.8.d: "2011년 우베 뵈른하르트와 우베 문들로스의 자살 이후, 살인과 폭탄 테러를 저지른 극우 테러 조직의 존재를 드러내는 영상이 나타났습니다. 영상에는 피해자들을 조롱하는 만화 캐릭터가 등장하며 살인에 대한 책임을 자랑스럽게 주장했습니다. 이 충격적인 폭로는 대중의 인식을 바꾸었고, 독일에서 활동하는 뿌리 깊은 네오나치 조직망에 대한 우려를 확인시켜 주었습니다."
 germany_nsu.8.a: "영상을 공개한다"
 germany_nsu.8.b: "영상의 확산을 억제한다"
 germany_nsu.9.t: "베아테 쳅페 재판"
 germany_nsu.9.d: "2013년, NSU 테러 조직의 유일한 생존 조직원인 베아테 쳅페가 살인과 폭탄 테러에서의 역할로 재판을 받게 되었습니다."
 germany_nsu.9.a: "최고형을 구형한다"
 germany_nsu.9.b: "적정한 형량을 구형한다"
 Germany_mig.1.t: "쥐스무트 위원회 활동 개시"
 Germany_mig.1.d: "내무부 장관 오토 쉴리는 이민 및 통합 정책에 대한 포괄적인 개혁을 검토하고 제안할 위원회를 임명했습니다."
 Germany_mig.1.a: "흥미롭군"
 Germany_mig.2.t: "쥐스무트 위원회, 보고서 완성"
 Germany_mig.2.d: "리타 쥐스무트가 이끄는 쥐스무트 위원회는 1년에 걸쳐 독일에 대한 이민의 중요성을 다룬 보고서를 작성했습니다. 이 보고서는 겨우 19쪽 분량이지만, 향후 이민법을 구성하는 방안부터 현 상황에 대한 분석과 미래 전망에 이르기까지 모든 내용을 담고 있습니다.\n\n보고서의 제목은..."
 Germany_mig.2.a: "...이민을 형성하고 - 통합을 장려하라"
 Germany_mig.2.b: "...호화로운 화장지"
 Germany_mig.3.t: "쥐스무트 위원회 결과에 대한 토론"
 Germany_mig.3.d: "이민을 형성하고 - 통합을 장려하라\n\n이것이 이민과 통합에 대한 해법을 찾기 위해 오늘 우리가 논쟁해야 할 보고서의 제목입니다.\n\n우리는..."
 Germany_mig.3.a: "...제한적인 이민 정책을 유지해야 한다"
 Germany_mig.3.b: "...보고서의 결과에 적응해야 한다."
 Germany_mig.3.c: "...이민이 필요하다."
 Germany_mig.4.t: "그린카드 구상"
 Germany_mig.4.d: "독일의 그린카드 구상은 IT 전문 인력에 대한 시급한 수요를 충족하고 급변하는 세계 기술 환경에서 독일이 경쟁력을 유지하도록 보장하기 위한 선구적인 노력입니다."
 Germany_mig.4.a: "훌륭하다"
 Germany_mig.4.b: "숙련 노동자에게도 이를 확대해야 한다"
 Germany_mig.4.c: "우리 자신의 인구 구조와 교육을 챙겨야 한다. 이미 외국인이 너무 많다"
 germany_yearly.29.t: "새천년으로의 진입"
 germany_yearly.29.d: "Ich kenne keine Parteien mehr, ich kenne nur noch Deutsche. -빌헬름 2세 황제\nWollt ihr den totalen Krieg? - 요제프 괴벨스\nWir wählen die Freiheit! - 콘라트 아데나워\nIch bin ein Berliner. - 존 F. 케네디\nSehr geehrte Damen und Herren, liebe Neger. - 하인리히 뤼프케\n이 말들은 전쟁, 분단, 자유를 위한 투쟁이라는 결정적 순간들로 점철된 독일의 격동의 역사 속에 메아리칩니다. 20세기는 독일 제국의 부상에서 두 차례 세계 대전의 참화, 냉전 분단, 그리고 동서독의 마침내 이룬 통일에 이르기까지 급진적인 변혁의 시기였습니다. 집무실에 발을 들이면서 이를 마음에 새기십시오."
 germany_yearly.29.a: "선서한다"
 germany_yearly.29_a: "나는 독일 국민의 복리를 위해 힘을 바치고, 그 이익을 증진하며, 해악으로부터 지키고, 기본법과 연방의 법률을 수호하고 방어하며, 의무를 양심적으로 이행하고, 모든 이에게 정의를 실현할 것을 맹세합니다. 신이여, 저를 도우소서."
 germany_yearly.30.t: "2001년 - 독일 통일의 메아리"
 germany_yearly.30.d: "21세기에 들어선 독일은 통일의 성과를 발전시켜야 하는 과제에 직면해 있습니다. 1871년 독일 제국의 통일 이후와 마찬가지로, 이 새로운 통일 독일은 민족 정체성을 키우면서 지역 간 차이도 조화시켜야 합니다. 탄탄한 경제와 커져 가는 유럽 내 리더십 속에서 이런 의문이 제기됩니다. 이 새로운 세기는 독일의 역할을 어떻게 재정의할 것인가?"
 germany_yearly.30.a: "미래를 받아들인다"
 germany_yearly.31.t: "2002년 - 유로: 유럽을 위한 새로운 마르크"
 germany_yearly.31.d: "1873년 도입된 금본위 마르크가 독일의 경제력을 공고히 했던 것처럼, 유로는 이제 독일의 새 통화가 되었습니다. 사랑받던 도이치 마르크를 대체하는 유로는 희망과 회의를 동시에 마주하고 있습니다. 이 통화는 100년 전 마르크가 그랬던 것처럼 안정과 번영을 가져다줄까요, 아니면 유럽 내 독일의 자율성을 약화시킬까요?"
 germany_yearly.31.a: "유로를 도입한다"
 germany_yearly.32.t: "2003년 - 개혁의 교착: 새로운 제국의회 논쟁"
 germany_yearly.32.d: "독일의 개혁 노력은 독일 제국 말기 제국의회 논쟁의 교착 상태를 연상시키는 입법 마비를 극복하려 애쓰고 있습니다. 증가하는 실업과 경제 침체에 직면하여 현대화의 필요성이 절실해지고 있습니다. 그러나 바이마르 공화국 시절처럼 정치적 이견이 진전을 가로막을 우려가 있습니다."
 germany_yearly.32.a: "개혁을 추진한다"
 germany_yearly.33.t: "1904년으로부터 한 세기가 지난 2004년 - 독일의 변천에 대한 성찰"
 germany_yearly.33.d: "1904년 독일은 빌헬름 2세 황제 치하의 제국 강국으로, 헤레로·나마 봉기와 같은 식민지 분쟁에 관여하고 있었습니다. 군국주의와 팽창이 그 시대를 규정했습니다. 2004년에 이르러 독일은 두 차례의 세계 대전과 냉전 분단을 거쳐 민주적인 유럽의 선도국으로 거듭났습니다. 이제 통일을 이루고 NATO와 EU에 헌신하는 독일은 외교와 평화 유지에 집중하며, 연방군은 아프가니스탄과 같은 안정화 임무에 파병되고 있습니다. 경제력과 사회적 진보가 제정 시대의 경직된 위계를 대체하여, 제국적 야망에서 세계적 협력과 안정으로의 전환을 이뤘습니다."
 germany_yearly.33.a: "흥미롭군"
 germany_yearly.34.t: "2005년: 전환기의 국가"
 germany_yearly.34.d: "2000년에서 2004년 사이 독일은 중대한 사회적, 경제적 변화를 겪었습니다. 2000년대 초반은 경제 침체와 높은 실업률로 특징지어졌고, 이는 어젠다 2010 구상에 따른 대대적인 노동 시장 및 복지 개혁으로 이어졌습니다. 이 개혁은 논란이 있었지만 고용을 늘리고 복지 국가를 현대화하는 것을 목표로 했습니다. 기술 발전과 디지털화는 탄력을 받아 산업과 일상생활에 영향을 미쳤습니다. 사회적 논쟁은 인구 변화, 교육 개혁, 이민자 통합을 중심으로 전개되었습니다. 환경 의식이 높아졌으며 재생 에너지가 정책 논의에서 점점 더 큰 역할을 했습니다. 2005년에 독일은 경제 회복, 사회 변화, 그리고 앞날의 방향에 대한 지속적인 정치적 논쟁을 헤쳐 나가는 변혁의 단계에 있었습니다."
 germany_yearly.34.a: "흥미로운 시대다"
 germany_yearly.35.t: "2006년 - 월드컵이 가져온 민족적 자부심"
 germany_yearly.35.d: "독일이 월드컵을 개최하면서 빌헬름 2세 황제의 제국 기념행사 당시의 애국적 열기를 떠올리게 하는 민족적 자부심이 치솟고 있습니다. 통일 이후 처음으로 독일은 낙관과 단결로 가득 차 있습니다. 이 자부심이 일시적일지, 새로워진 민족 정체성의 신호일지는 아직 알 수 없습니다."
 germany_yearly.35.a: "민족적 자부심을 기린다"
 germany_yearly.36.t: "2007년 - 경제적 고투: 새로운 산업적 과제"
 germany_yearly.36.d: "독일 경제는 20세기 초 산업 침체를 연상시키는 산업 구조 변화에 직면하면서 부담의 조짐을 보이고 있습니다. 제조업이 쇠퇴하고 실업이 증가하는 모습은 제1차 세계 대전 이전 독일이 겪던 경제적 도전을 되풀이합니다. 새로운 세계 시장에 적응할 필요성이 분명해지고 있습니다."
 germany_yearly.36.a: "경제 개혁을 지지한다"
 germany_yearly.37.t: "2008년 - 감자의 해"
 germany_yearly.37.d: "유엔은 감자의 세계적 중요성을 인정하여 2008년을 '세계 감자의 해'로 선포했습니다. 이는 식량 안보, 농업, 경제적 지속 가능성에서 이 작물이 맡은 역할을 부각합니다. 오랜 감자 재배와 소비 전통을 지닌 독일은 이 구상을 받아들여 지속 가능한 농업과 이 주식의 영양적 가치에 대한 인식을 높이고 있습니다."
 germany_yearly.37.a: "감자의 유산을 기린다"
 germany_yearly.38.t: "2009년 - 기본법 제정 60주년 기념"
 germany_yearly.38.d: "독일은 전후 시기를 거치며 나라를 이끈 헌법인 기본법의 제정 60주년을 기념합니다. 빌헬름 1세 치하의 법률 개혁과 마찬가지로 기본법은 독일 통치의 초석으로 간주되며, 수십 년의 변화 속에서도 안정을 보장해 왔습니다. 전국적 논의는 현대에도 이어지는 기본법의 의의를 되돌아보고 있습니다."
 germany_yearly.38.a: "기본법을 기린다"
 germany_yearly.39.t: "2010년 - 다시 한번 독일 공학의 지배"
 germany_yearly.39.d: "독일이 처음으로 기술 강국으로 자리매김했던 산업 혁명의 기억을 되살리며, 독일의 명성 높은 공학 부문은 유럽에서 계속 선두를 달리고 있습니다. 독일 기업들이 혁신을 이어 가면서 독일은 유럽 경제의 중심에 남아 있지만, 국제 경쟁자들의 도전이 다가오고 있습니다."
 germany_yearly.39.a: "혁신을 지원한다"
 germany_yearly.40.t: "2011년 - 역사가 가르쳐 주는 것: 안정은 환상"
 germany_yearly.40.d: "새로운 10년이 펼쳐지면서 독일은 기로에 서 있습니다. 금융 위기는 지나갔을지 모르지만 그 여파는 남아 경제와 사회의 취약점을 드러내고 있습니다. 정치적 변화, 사회적 불안, 세계적 불확실성은 안정이 결코 보장되지 않는다는 사실을 상기시킵니다. 과거 세대가 격변을 통해 배웠듯이 역사의 교훈은 분명합니다. 적응이야말로 회복력의 열쇠입니다."
 germany_yearly.40.a: "불확실한 미래에 대비한다"
 germany_yearly.41.t: "2012년 - 변화의 한 세기"
 germany_yearly.41.d: "백 년 전 독일은 세계 무대에서 산업과 군사의 거인으로서 국력의 정점에 서 있었습니다. 그러나 1912년의 힘에 대한 환상은 다가오는 전쟁과 위기의 폭풍을 가리고 있었습니다. 이제 2012년, 독일은 유럽에서 경제적 지도력을 누리고 있지만 역사는 패권이 덧없다는 것을 가르쳐 줍니다. 우리는 안정을 유지할 수 있을까요, 아니면 또 다른 예기치 못한 변화의 벼랑 끝에 서 있는 것일까요?"
 germany_yearly.41.a: "역사에서 배우고 미래를 만든다"
 germany_yearly.42.t: "2013년 - 되돌아보고 앞으로 나아가기"
 germany_yearly.42.d: "독일이 2013년을 맞이하면서 지난해에 대한 성찰은 문화적, 과학적 이정표를 모두 부각합니다. 괴팅겐 대학교는 창립 275주년을 기념하며 국가에 오랜 학문적 전통을 상기시킵니다. 한편 윈도 8의 출시를 비롯한 컴퓨팅의 최신 발전과 함께 기술 진보는 계속되고 있습니다. 일부는 마야 달력이 2012년 세계의 종말을 예언했다고 추측했지만, 삶은 평소처럼 이어집니다. 또 다른 의학적 이정표로, 독일은 첫 시험관 아기가 태어난 지 30년을 맞아 수십 년에 걸친 과학적 진보를 보여 줍니다."
 germany_yearly.42.a: "새해, 새로운 과제"
 germany_yearly.43.t: "2014년 - 장벽 붕괴 25주년"
 germany_yearly.43.d: "독일은 분단의 상징이자 마침내 통일로 이어진 베를린 장벽 붕괴 25주년을 맞이합니다. 독일 제국 통일 25년 후에 그랬던 것처럼, 나라는 냉전 이후 얼마나 멀리 왔는지 되돌아봅니다. 동부를 독일의 번영하는 미래에 어떻게 완전히 통합할 것인지의 문제는 여전히 남아 있습니다."
 germany_yearly.43.a: "통일을 돌아본다"
 germany_yearly.44.t: "2015년 - 난민 위기와 도덕적 책임"
 germany_yearly.44.d: "독일이 전례 없는 난민 유입에 직면하면서 국가는 인도주의적 책임을 성찰하고 있습니다. 이재민을 통합하는 과제는 새로운 것이 아닙니다. 독일은 제1차 세계 대전의 여파에서부터 제2차 세계 대전 이후 수백만 명의 재정착에 이르기까지 역사 속에서 비슷한 위기를 겪어 왔습니다. 격변의 시기에 나라를 이끌었던 과거 지도자들처럼, 민족 정체성과 통합을 둘러싼 논쟁이 격화되는 가운데 독일은 다시 한번 연민과 실용주의 사이에서 균형을 잡아야 합니다."
 germany_yearly.44.a: "인도주의적 의무를 지킨다"
 germany_yearly.45.t: "2016년 - 통합 논쟁: 문화 충돌"
 germany_yearly.45.d: "난민 위기가 계속되면서 통합과 독일 정체성에 관한 논쟁이 절정에 이르렀습니다. 이러한 긴장은 100년 전 20세기 초 민족주의가 격동하던 시기에 독일이 직면했던 문화적, 민족적 분열을 되풀이합니다. 정치 세력들은 독일의 가치와 문화를 더 강하게 강조할 것을 요구하고 있습니다."
 germany_yearly.45.a: "통합을 강조한다"
 germany_yearly.46.t: "2017년 - 격변의 한 세기"
 germany_yearly.46.d: "백 년 전 세계는 역사를 바꾼 두 사건을 목격했습니다. 세계적 분쟁을 격화시킨 치머만 전보와 새로운 이념 투쟁의 무대를 마련한 러시아의 10월 혁명입니다. 오늘날 독일이 이 전환점을 되돌아보면서, 현대 지정학과 역사의 교훈에 대한 의문이 제기됩니다. 과거 불안정의 영향은 정치 지형이 때로 예기치 못한 결과를 동반하며 급격히 바뀔 수 있음을 상기시킵니다."
 germany_yearly.46.a: "역사의 교훈을 연구한다"
 germany_yearly.47.t: "2018년 - 커지는 경제적 격차"
 germany_yearly.47.d: "독일 경제는 탄탄하지만 커져 가는 불평등이 사회 결속에 부담을 주기 시작합니다. 이 상황은 산업가와 노동자 사이의 격차가 뚜렷해졌던 20세기 초의 경제적 분열을 연상시킵니다. 독일 경제 엘리트가 번영하는 가운데, 더 광범위한 국민이 체감하는 격차를 해소하라는 압박이 커지고 있습니다."
 germany_yearly.47.a: "불평등을 해소한다"
 germany_yearly.48.t: "2019년 - 기후 변화 시위"
 germany_yearly.48.d: "20세기 초의 사회 운동을 되풀이하듯 환경 운동이 독일 전역을 휩쓸고 있습니다. 제1 독일 제국 시기에 산업 호황이 오염과 환경 문제를 가져왔듯, 기후 변화 운동은 독일의 미래를 지키기 위한 긴급한 행동을 요구합니다. 정부는 과감한 조치를 취하라는 압박에 직면해 있습니다."
 germany_yearly.48.a: "기후 변화에 대응한다"
 germany_yearly.49.t: "2020년 - 팬데믹과 사회 변화"
 germany_yearly.49.d: "독일은 전 세계와 마찬가지로 코로나19 팬데믹과 씨름하고 있습니다. 제1차 세계 대전 이후 나라를 황폐화시킨 스페인 독감처럼, 이번 팬데믹은 의료 체계와 사회의 구조에 도전을 던집니다. 이 팬데믹은 독일이 의료와 사회 안전망을 재고하도록 만듭니다."
 germany_yearly.49.a: "의료 체계를 강화한다"
 GER_news.01.t: "독일, 방위사태(V-Fall) 선포"
 GER_news.01.d: "1968년 헌법에 도입된 이래 처음으로 독일 정부는 국가의 존립이 위협받는다고 보고 방위사태(Verteidigungsfall)를 선포했습니다. 이에 따라 의회는 의사 결정을 신속히 하기 위한 행정 간소화 법률들을 제정할 수 있으며, 그동안 군은 독일 영토 방어를 준비합니다."
 GER_news.01.a: "호랑이가 깨어난다"
 German_Institute: "독일 연구소"
 GER_idea_Peace_dividende: "평화 배당금"
 GER_idea_Peace_dividende_desc: "냉전이 끝나고 소련이 붕괴한 이후, 대규모 군사력을 유지할 필요가 더 이상 없습니다. 대신 그 자금을 국민에게 돌려 사회 서비스, 기반시설, 공공복지 같은 분야에 투자해야 합니다. 이러한 자원을 재배분함으로써 삶의 질을 개선하고 경제 성장을 촉진할 수 있으며, 평화 배당금이 사회에 긍정적으로 기여하도록 보장할 수 있습니다."
 GER_idea_Innere_fuhrung_I: "독일 연방방위군의 내적 지도 개념"
 GER_idea_Innere_fuhrung_I_desc: "내적 지도(Innere Führung)는 독일 연방방위군의 윤리적, 법적, 조직적 틀을 형성하는 근본 개념입니다. 제2차 세계 대전 이후에 발전된 이 개념은 독일군이 민주주의 원칙에 따라 운용되고 자유 사회의 가치를 준수하도록 보장하는 지도 철학의 역할을 합니다."
 GER_idea_Innere_fuhrung_II_desc: "내적 지도(Innere Führung)는 독일 연방방위군의 윤리적, 법적, 조직적 틀을 형성하는 근본 개념입니다. 제2차 세계 대전 이후에 발전된 이 개념은 독일군이 민주주의 원칙에 따라 운용되고 자유 사회의 가치를 준수하도록 보장하는 지도 철학의 역할을 합니다."
 GER_idea_Greencard_I: "그린카드 프로그램"
 GER_idea_Greencard_I_desc: "국가 경제가 정보 기술과 인터넷에 점점 더 의존하게 되면서, 이 분야의 숙련 노동자에 대한 수요가 국내 공급을 크게 웃돌았습니다. 이 계획은 이러한 과제에 대한 대응으로, 고도로 숙련된 외국인 IT 전문가를 유치하여 독일 기술 산업의 핵심 직무를 채우는 것을 목표로 했습니다."
 GER_idea_Greencard_II: "그린카드 프로그램"
 GER_idea_Greencard_II_desc: "그린카드 프로그램을 더 폭넓은 숙련 전문가로 확대함으로써 독일은 경제를 강화하고, 세계적 경쟁력을 높이며, 핵심 부문의 심각한 노동력 부족을 해소합니다. 이러한 확대는 독일을 전 세계 숙련 인재의 선도적 목적지로 자리매김하게 하여, 역동적이고 혁신적인 경제의 미래를 보장할 것입니다."
 GER_Idea_integration: "신규 회원국 통합"
 GER_Idea_integration_desc: "나토의 핵심 축으로서의 역할을 받아들인 독일은, 중부 및 동부 유럽의 신규 동맹 회원국을 통합하는 선도 세력으로 자리매김하였습니다. 경제력, 군사 전문성, 유럽 내 전략적 위치를 활용하여, 독일은 폴란드, 헝가리, 체코가 완전한 역량을 갖춘 나토 동맹국으로 성공적으로 전환하도록 노력하고 있습니다. 이러한 접근에는 군사 장비와 훈련의 현대화뿐 아니라 정치적, 전략적 일치를 도모하는 것도 포함됩니다. 독일의 통합 주도는 어떠한 위협에도 대응할 수 있는 단결되고 강력한 나토를 구축하는 것을 목표로 합니다. 외교적 노력, 합동 군사 훈련, 방위 협력 협정을 통해 독일은 나토 내에서 자국의 영향력과 지도력을 공고히 하고 동맹의 집단 안보와 안정을 확보하고자 합니다."
 GER_Idea_Integration_process_I: "신속한 무장과 배치 강조"
 GER_Idea_Integration_process_I_desc: "나토 사무총장 하비에르 솔라나의 구상에서 영감을 받아, 독일은 동맹의 동부 측면을 강화하기 위한 신속한 무장 및 배치 정책을 채택하였습니다. 이 접근은 신규 나토 회원국(폴란드, 헝가리, 체코)이 현대적 군사 장비를 신속히 갖추고 잠재적 분쟁 지역 어디로든 신속히 배치될 수 있도록 보장하는 데 중점을 둡니다. 이 전략은 신속한 대응이 동방의 잠재적 위협에 대한 최선의 억지력이라는 솔라나의 신념을 반영하여 속도와 준비태세의 중요성을 강조합니다. 독일은 산업 역량과 군사 전문성을 활용하여 이들 신규 동맹국에 필요한 장비와 훈련을 공급하는 데 앞장서고 있으며, 이를 통해 나토의 전반적인 방어 능력과 준비태세를 높이고 있습니다."
 GER_Idea_Integration_process_II: "교리 일치와 훈련에 집중"
 GER_Idea_Integration_process_II_desc: "클라우스 라인하르트 장군의 전략적 통찰에 이끌려, 독일은 신규 나토 회원국에 대한 교리 일치와 엄격한 훈련 정책을 추진하기로 하였습니다. 라인하르트의 접근은 폴란드, 헝가리, 체코의 군사 교리를 기존 나토군의 교리와 통합하여 합동 작전에서 원활한 협조를 보장하는 것의 중요성을 강조합니다. 이러한 훈련 중심 정책은 신규 회원국의 작전 수준을 나토의 기대에 맞게 끌어올려 통일되고 효율적인 군사 구조를 조성하는 것을 목표로 합니다. 포괄적인 훈련 프로그램과 교리 일치를 우선시함으로써 독일은 어떠한 위협에도 효과적으로 대응할 수 있는 더 강력하고 결속력 있는 동맹을 구축하고자 합니다. 이 전략은 개별 부대의 전투 준비태세를 높일 뿐 아니라 나토 전체의 집단 방위 태세도 강화합니다."
 GER_Idea_Integration_process_III: "인프라 중시와 통합의 균형"
 GER_Idea_Integration_process_III_desc: "균형 잡힌 실용적 접근에 따라 독일은 신규 나토 회원국의 통합에 주력하는 한편 핵심 군사 기반시설의 개발을 강조하기로 하였습니다. 이 전략은 폴란드, 헝가리, 체코의 교통망, 군사 기지, 병참 능력을 개선하여 미래를 위한 견고한 토대를 마련하는 것을 목표로 합니다. 기반시설에 투자함으로써 독일은 이들 국가가 신속한 배치를 지원하고 군사 작전을 효과적으로 유지할 수 있도록 보장합니다. 도로, 철도, 보급 창고의 건설은 나토군의 기동성을 높일 뿐 아니라 이 지역의 장기적 안보에 필요한 병참의 근간도 강화합니다. 이러한 균형 잡힌 접근은 호스트 국가들의 경제 발전을 촉진하여 동맹에 대한 이들의 헌신을 공고히 하고 나토의 동부 방어를 강화합니다."
