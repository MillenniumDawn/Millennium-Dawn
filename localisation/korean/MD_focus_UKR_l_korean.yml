 UKR_t62_egypt_independent_development: "§YT-62-5TDF§! 독자 개발"
 UKR_t62_egypt_independent_development_desc: "\n\n\n\n\n\n£UKR_desctext_modernize_sov_t62_egypt_for_tooltip\n\n\n\n\n\n\n\n\n§Y[EGY.GetNameWithFlag]§!은(는) 대규모 §YT-62§! 부대를 운용하고 있습니다. §YKMDB§!는 §YT-55§! 사업을 먼저 끝내지 않고도 §YT-62-5TDF§! 패키지를 개발할 수 있지만, 그 경험 없이 시작하면 §Y300일§!이 걸리고 §R[?UKR_storage_t62_independent_development_cost|2]§!십억 달러가 듭니다.\n설계를 채택하면 우리의 조달 사업이 활성화되고, 이집트 제안에 요구되는 구형 모델 조건도 충족됩니다. 기존의 외교적·역사적 조건은 그대로 적용됩니다.\n\n$UKR_rada_modernization_adoption_tt$"
 UKR_t62_egypt_independent_development_cost: "£treasury [?UKR_storage_t62_independent_development_cost|2]   £pol_power §Y5§!   £army_experience §Y2§!"
