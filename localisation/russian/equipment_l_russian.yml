 GER_Rec_tank_0: "Schützenpanzerz 11-2 Kurz"
 GER_Rec_tank_0_short: "SPz 11-2 Kurz"
 GER_Rec_tank_0_desc: "Боевая и разведывательная машина пехоты Schützenpanzer SPz 11-2 Kurz была разработана для западногерманской армии и представляла собой незначительную модификацию машины французской разработки в период с 1959 по 1967 гг. SPz 11-2 служил в пушечных взводах бронепехотных батальонов до 1974 года и оставался на вооружении в качестве разведывательной машины до 1982 года. В качестве БМП SPz 11-2 был заменён на Marder, а в качестве разведчика — на Spähpanzer Luchs. SPz 11-2 состоял на вооружении только западногерманской армии."
 GER_Rec_tank_1: "Wiesel 1 Aufklärung"
 GER_Rec_tank_1_short: "Wiesel 1"
 GER_Rec_tank_1_desc: "Wiesel Armoured Weapons Carrier (AWC) — немецкая легкая авиатранспортабельная боевая бронированная машина, точнее, легкобронированный носитель оружия, производства фирмы Rheinmetall. По своим размерам, форме и назначению он очень похож на исторические разведывательные танкетки и является единственной современной танкеткой, используемым в Западной Европе. Модель Wiesel 1 Aufklärung — это специально разработанный разведывательный вариант, оснащенный более совершенной оптикой и системами связи."
 GER_Rec_tank_2: "Luchs"
 GER_Rec_tank_3: "GTK Boxer CRV"
 GER_Rec_tank_3_short: "GTK-CRV "
 GER_Rec_tank_3_desc: "Boxer CRV — разведывательный вариант бронетранспортёра Boxer разработки ARTEC с двухместной модульной башней Rheinmetall Lance (MTS). Башня вооружена только пушкой MK30-2/ABM, на ней также будут установлены 2 ракеты Spike-LR2 и комплекс активной защиты Iron Fist от Elbit."
 GER_Rec_tank_4: "Lynx KF-41 120mm"
 GER_Rec_tank_4_short: "Lynx KF-41 120mm"
 GER_Rec_tank_4_desc: "Lynx KF-41 120 — это разведывательный вариант оригинальной БМП Lynx. Модель «120» оснащена улучшенными прицельными и разведывательными системами. Помимо обновленных систем разведки, машина оснащена обновленными системами скрытности и уклонения, что еще больше дополняет ее и без того выдающиеся разведывательные возможности. Lynx 120 оснащен 120-мм гладкоствольным орудием, в отличие от 35-мм орудия, установленного на БМП. Это позволяет Lynx обеспечивать максимальную огневую мощь, сохраняя при этом дистанцию до цели."
