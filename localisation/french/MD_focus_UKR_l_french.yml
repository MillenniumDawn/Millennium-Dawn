 ukraine_develop_btr4.1.name: "Choisir le rôle de combat du 'BTR-4'"
 ukraine_develop_btr4.1.desc: "We can choose the desired role for this equipment - lighter and cheaper APC or more expensive and heavily armed IFV.\nOur decision will influence what Battalions will be equipped with BTR-4: Mechanized or Armored.\nWe will have an option to produce basically the same equipment type but in opposite role if we want to."
 ukraine_develop_btr4.1.a: "APC"
 ukraine_develop_btr4.1.b: "IFV"
 ukraine_develop_btr4.2.name: "Choisir l'armement primaire du 'BTR-4' APC"
 ukraine_develop_btr4.2.desc: "Nous pouvons choisir l'armement principal pour le BTR-4 APC.\nPour réduire les coûts, nous pouvons choisir une simple mitrailleuse, mais pour maximiser son efficacité au combat, nous pouvons sélectionner l'un des modules d'armes lourdes disponibles."
 ukraine_develop_btr4.2.a: "Mitrailleuse uniquement"
 ukraine_develop_btr4.2.b: "Module d'armes"
 ukraine_develop_btr4.3.name: "Choisir le module d'armement pour le 'BTR-4' APC"
 ukraine_develop_btr4.3.desc: "Nous pouvons choisir le module d'armement pour le BTR-4 APC.\n\n§YBM-1B 'Hrim'§! : canon de 30 mm, lance-grenades de 30 mm, mitrailleuse coaxiale de 7,62 mm, 4x missiles antichars.\n\n§YKBA-105 'Shkval'§! : canon de 30 mm, mitrailleuse coaxiale de 7,62 mm, 4x missiles antichars (lance-grenades optionnel en réduisant à 2 missiles).\n\n§YBAU 23x2§! : 2x canons de 23 mm, mitrailleuse coaxiale de 7,62 mm."
 ukraine_develop_btr4.3.a: "BM-1B 'Hrim'"
 ukraine_develop_btr4.3.b: "KBA-105 'Shkval'"
 ukraine_develop_btr4.3.c: "BAU 23x2"
 ukraine_develop_btr4.4.name: "Choisir le moteur pour le 'BTR-4' APC"
 ukraine_develop_btr4.4.desc: "Nous pouvons choisir le moteur pour le BTR-4 APC.\n\n§Y3TD-3§! : moteur diesel ukrainien 3 cylindres à 2 temps développant 500 ch.\n\n§YDeutz BF6M1015CP§! : moteur diesel allemand 6 cylindres développant 442 ch.\n\n§YIveco Cursor 10-430§! : moteur diesel italien 6 cylindres développant 430 ch."
 ukraine_develop_btr4.4.a: "3TD-3"
 ukraine_develop_btr4.4.b: "Deutz BF6M1015CP"
 ukraine_develop_btr4.4.c: "Iveco Curseur 10-430"
 ukraine_develop_btr4.5.name: "Choisir le moteur du VTT « BTR-4 »"
 ukraine_develop_btr4.5.desc: "Nous pouvons choisir le moteur souhaité pour le VTT BTR-4.\n\n§Y3TD-3§! : diesel ukrainien 2-temps 3 cylindres d'une puissance de 500 ch.\n\n§YDeutz BF6M1015CP§! : diesel allemand 4 soupapes, 6 cylindres d'une puissance de 442 ch.\n\n§YIveco Cursor 10-430§! : diesel italien 24 soupapes, 6 cylindres d'une puissance de 430 ch."
 ukraine_develop_btr4.5.a: "3TD-3"
 ukraine_develop_btr4.5.b: "Deutz BF6M1015CP"
 ukraine_develop_btr4.5.c: "Iveco Curseur 10-430"
 ukraine_develop_btr4.6.name: "Choisir le module d'armement pour le 'BTR-4' VCI"
 ukraine_develop_btr4.6.desc: "Nous pouvons choisir le module d'armement pour la version Véhicule de combat d'infanterie (VCI) du BTR-4.\n\n§YBM-1B 'Hrim'§! : canon de 30 mm, lance-grenades de 30 mm, mitrailleuse coaxiale de 7,62 mm, 4x missiles antichars.\n\n§YKBA-105 'Shkval'§! : canon de 30 mm, mitrailleuse coaxiale de 7,62 mm, 4x missiles antichars.\n\n§YBAU 23x2§! : 2x canons de 23 mm, mitrailleuse coaxiale de 7,62 mm."
 ukraine_develop_btr4.6.a: "BM-1B 'Hrim'"
 ukraine_develop_btr4.6.b: "KBA-105 'Shkval'"
 ukraine_develop_btr4.6.c: "BAU 23x2"
