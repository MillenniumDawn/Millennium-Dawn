 BLR_south_river_TT: "[USA.GetFlag]에서 도착하는 §Y벨라루스인 의용군§! 대대가 당신의 통제 하에 놓이게 됩니다"
 BLR_white_legion_TT: "§Y백 군단§! 대대가 결성될 것입니다"
