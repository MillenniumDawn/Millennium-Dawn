 BRA_idea_imperial_university_desc: ""
 BRA_idea_trained_pilots: "숙련된 조종사"
 BRA_idea_trained_pilots_desc: ""
 BRA_idea_psl_growth: "PSL의 부상"
 BRA_idea_psl_growth_desc: "사회자유당은 막대한 동력을 얻기 시작했습니다. 이들은 상승세에 있으며, 현재의 흐름대로라면 다음 선거에서 승리할 것입니다."
 BRA_idea_brazil_energy: "녹색 에너지"
 BRA_idea_brazil_energy_desc: "정부 주도의 일련의 계획에 힘입어 더 친환경적인 나라로 나아가면서 녹색 에너지가 확대되었습니다. 여러 태양광 및 풍력 기업이 우리의 녹색 기반시설을 확장하고 전력망에 전력을 더하면서 이 프로그램들은 이미 성과를 내기 시작했습니다."
 BRA_legalize_independent_amazonian_development_tt: "아마존 열대우림과 그 일부를 포함하는 주에서의 §Y독립 민간 개발§!을 합법화합니다.\n\n§Y독립 민간 개발§!을 합법화하면 민간 기업이 아마존 열대우림을 개발하는 사건이 발생하며, §Y보존 면적§!을 대가로 무료 §Y산업§!과 자원 등을 얻게 됩니다.\n"
 BRA_conserv_acreage_effect_tt: "§Y전체 보존 열대우림 면적§!을 [?temp_change|+] 변경합니다. (현재 보존 열대우림 면적: [?BRA_acres_conserved|Y])"
 BRA_wild_acreage_effect_tt: "§Y전체 야생 열대우림 면적§!을 [?temp_change|+] 변경합니다. (현재 야생 열대우림 면적: [?BRA_acres_wild|Y])"
 BRA_target_acreage_effect_tt: "§Y전체 목표 열대우림 면적§!을 [?temp_change|+] 변경합니다. (현재 목표 열대우림 면적: [?BRA_acres_target|Y])"
 BRA_acre_rate_gain_effect_tt: "§Y전체 야생 열대우림 면적 월간 증가량§!을 [?temp_change|+] 변경합니다. (현재 야생 열대우림 면적 월간 증가량: [?BRA_acre_rate_gain|Y])"
 BRA_acre_rate_loss_effect_tt: "§Y전체 야생 열대우림 면적 월간 감소량§!을 [?temp_change|+] 변경합니다. (현재 야생 열대우림 면적 월간 감소량: [?BRA_acre_rate_loss|Y])"
 BRA_acres_conserved_change_effect_tt: "§Y보존 열대우림 면적 전환율§!을 [?temp_change|+] 변경합니다. (현재 보존 열대우림 면적 전환율: [?BRA_acres_conserved_change|Y])"
 BRA_amazonian_high_command_tt: "§Y아마존 최고사령부§!를 설립하여 §Y아마존 열대우림§!과 관련된 사건에서 군을 활용할 수 있게 됩니다.\n"
 BRA_worker_party_alignment_effect_tt: "§Y노동자당 노선§!을 [?temp_change|+] 변경합니다. (현재 노동자당 노선: [?BRA_brazilian_party_alignment|Y0])"
 BRA_decision_transposition_saofrancisco: "상프란시스쿠강 물길 전환"
 BRA_decision_transposition_saofrancisco_desc: "상프란시스쿠강 물길 전환은 브라질 상프란시스쿠강 물의 일부를 다른 곳으로 옮기는 사업입니다. 브라질 정부가 \\"상프란시스쿠강과 북부 북동부 수문 유역 통합 사업\\"이라 명명한 이 사업은 지역개발부가 담당하는 연방 정부 사업입니다. 이 사업은 강물을 우회시키기 위해 네 개 주(페르낭부쿠, 파라이바, 세아라, 히우그란지두노르치)의 영토를 가로지르는 두 개의 주요 축(북부와 동부)에 700킬로미터가 넘는 콘크리트 수로를 건설하는 것을 포함합니다. 도중에 아홉 개의 양수장 건설도 포함됩니다. 바이아와 세르지피를 아우르는 남부 축과 피아우이의 서부 축을 포함하도록 사업을 확장할 가능성도 있습니다."
 BRA_decision_bacia_tocantins: "토칸칭스-아라과이아 수문 유역 개척"
 BRA_decision_bacia_tocantins_desc: "아라과이아-토칸칭스 유역은 브라질의 12개 수문 지역 중 하나입니다. 이 유역의 주요 하천은 토칸칭스강과 아라과이아강입니다. 브라질 영토 안에 전적으로 위치한 가장 큰 수계입니다."
 BRA_decision_army_projects: "육군 사업국 자금 지원"
 BRA_decision_army_projects_desc: "육군 사업국은 작전 부대에 작전 운용에 필수적인 방위 물자를 최소 수준으로 제공하는 것을 목표로 합니다."
 BRA_decision_improve_dockyards: "조선소 개선"
 BRA_decision_improve_dockyards_desc: "[890.GetName]와(과) [885.GetName]의 조선소는 확장과 개선이 필요합니다. 점점 더 큰 선박을 생산할 수 있도록 이 조선소들의 확장을 모색하고 검토해야 합니다."
 BRA_decision_amazonian_projects: "아마존 산업 사업"
 BRA_decision_amazonian_projects_desc: "[892.GetName] 주의 민간 산업 역량을 확대하기 위한 일련의 아마존 산업 사업을 추진할 때입니다."
 BRA_amazon_conservation_system_decision_category: "아마존 열대우림 보존"
 BRA_amazon_conservation_system_decision_category_desc: "\n£BRA_desctext_amazon\n\n\n\nThe Amazon Rainforest is truly one of the world's greatest wonders and we are one of the lucky nations to house its beauty within our borders. The resources the rainforest boasts also makes it an attractive subject for our politics about using it for economic development.\n\n\nThe Amazon Rainforest mechanic requires you to keep your §YTotal Amazon Acreage§! close to its target or exceeding the §YTotal Targeted Acreage§!. If we do not maintain this balance we will start to suffer penalties in our Amazonian states and we will start to see progressively worse events fire depending on how much of the rainforest has been destroyed. The §YTotal Amazon Acreage§! is comprised of §YWild Amazon Acreage§! and §YConserved Amazon Acreage§!. We gain or lose additional §YWild Acreage§! every month based on decisions we make on economic policy regarding the §YAmazonian States§!.\n\nMaintaining a high ratio of §YTotal Conserved Amazon Acreage§! will bring higher benefits long-term, but slashing and burning will also allow us to exploit things like mineral wealth, §YBuildings§!, and §YBuilding Slots§!.\n\nTotal Targeted Rainforest Acreage: [?BRA_acres_target]\nTotal Rainforest Acreage: [?BRA_acres_current]\n\nTotal Wild Rainforest Acreage: [?BRA_acres_wild] (Ratio: [?BRA_wild_acreage_ratio|%1])\nTotal Conserved Wild Amazon Acreage: [?BRA_acres_conserved] (Ratio: [?BRA_conserved_acreage_ratio|%1])\n\nConserved Rainforest Acreage Conversion Rate: [?BRA_acres_conserved_change|+]\nWild Rainforest Acreage Monthly Gain: [?BRA_acre_rate_gain|+]\nWild Rainforest Acreage Year Monthly Loss: [?BRA_acre_rate_loss|-]\nNet Monthly Amazon Acreage: [?BRA_net_acreage|+] Acres a Month"
 BRA_decision_plant_additional_trees: "나무심기"
 BRA_decision_plant_additional_trees_desc: "우리는 보호 구역 내 아마존 열대 우림의 일부를 재식림하여 열대 우림의 목표 면적을 달성하는 데 도움을 줄 수 있습니다."
 BRA_decision_declare_new_conservation_lands: "새로운 보호 구역 선언"
 BRA_decision_declare_new_conservation_lands_desc: "새로운 보호 지역을 선포하는 것은 불법적인 활동, 예를 들어 불법 벌목이나 불태우기와 같은 문제를 막는 데 도움이 될 수 있습니다."
 BRA_decision_establish_amazonian_national_park_service: "국가 자연 보호 유닛 시스템 설립"
 BRA_decision_establish_amazonian_national_park_service_desc: "It is time to establish the new National System of Nature Conservation Units (SNUC) for short. Although the idea of the SNUC has been around since the 1970s, when it was first developed by the Brazilian Forestry Development Institute and the Brazilian Foundation for Nature Conservation as a means to help standardize nature conservation in Brazil, it is now time to adopt this methodology and put it into practice for the greatness of all of Brazil."
 BRA_decision_expand_rubber_production_on_the_coast: "해안에서 고무 생산 확대"
 BRA_decision_expand_rubber_production_on_the_coast_desc: "고무는 아마존과 브라질의 중요한 자원 중 하나입니다. 생산을 확장하고 해안沿에 고무 생산을 위한 추가 나무를 심는 것은 또 다른 수입원을 제공하며, 자원 글로벌 시장에서 우리의 우위를 더욱 강화할 것입니다."
 BRA_decision_expand_the_gold_mining_initiatives: "확대된 금 채굴 계획"
 BRA_decision_expand_the_gold_mining_initiatives_desc: "우리는 아마존의 강과 시내를 따라 금 채굴 계획을 확장해야 합니다."
 BRA_decision_halt_independent_developments: "독립 개발 중단"
 BRA_decision_halt_independent_developments_desc: "최근 합법화된 민간 기업의 아마존 개발은 녹지를 급속히 산업화하면서 숲을 지나치게 많이 베어내기 시작했습니다. 새로운 정책을 수립하고 표적 재식림을 시작할 여유를 확보하기 위해 당분간 개발을 중단할 수 있습니다."
 BRA_decision_continue_independent_developments: "독립 개발 재개"
 BRA_decision_continue_independent_developments_desc: "우리는 아마존 개발을 다시 시작할 준비가 되었다고 판단합니다. 민간 개발 기업들에 아마존 개발을 재개하라는 새로운 통지문을 다시 작성해야 합니다."
 BRA_decision_permanently_ban_private_development: "아마존에서 민간 개발을 영구적으로 금지하다"
 BRA_decision_permanently_ban_private_development_desc: "We will permanently ban all private Amazonian development. This is wildly popular with the green parties of the country, who will gain significant political ground as a result."
 BRA_decision_initial_investment: "초기 투자"
 BRA_decision_initial_investment_desc: "아마존 일부를 개발하기 위해 제안된 여러 개발 사업이 있습니다. 이 사업들의 조직 구성과 이후 개발을 시작하려면 대규모 초기 투자가 필요합니다."
 BRA_amazon_modifier: "아마존 열대우림 - 지역 보전 노력"
 BRA_amazon_modifier_desc: "아마존 열대우림은 세계에서 가장 큰 열대우림입니다. 우리 브라질 국민은 이를 보살필 권리를 부여받았습니다. 열대우림 내 자원의 무분별한 이용은 광범위한 시위를 일으키고 기후 변화 문제를 악화시키는 등 많은 문제로 이어질 수 있습니다. 그러나 우리가 능력이 닿는 한 최선을 다해 숲을 관리할 수 있다면, 열대우림의 경제적 잠재력을 진정으로 끌어내고 위대한 우리나라를 번영하게 할 수 있습니다.\n\n§Y전체 보존 면적 비율§!을 높이고 지역 구제를 위해 §Y내부 투자§! §Y지역 보전 노력 개선§!을 시행하면 주 전체에 걸친 페널티를 줄일 수 있습니다. §Y전체 보존 면적 비율§!이 100%일 때는 페널티를 받지 않습니다. (현재: [?BRA_conserved_acreage_ratio|0%])"
 BRA_amazon_country_modifier: "아마존 열대우림 - 전국 보전 노력"
 BRA_amazon_country_modifier_desc: "아마존 열대우림은 세계에서 가장 큰 열대우림입니다. 우리 브라질 국민은 이를 보살필 권리를 부여받았습니다. 열대우림 내 자원의 무분별한 이용은 광범위한 시위를 일으키고 기후 변화 문제를 악화시키는 등 많은 문제로 이어질 수 있습니다. 그러나 우리가 능력이 닿는 한 최선을 다해 숲을 관리할 수 있다면, 열대우림의 경제적 잠재력을 진정으로 끌어내고 위대한 우리나라를 번영하게 할 수 있습니다.\n\n§Y전체 면적§!을 §Y목표 면적§!보다 높이면 이 페널티를 줄일 수 있습니다. (현재: [?BRA_current_target_ratio|%0])"
 BRA_native_violence_modifier: "원주민 폭력"
 BRA_native_violence_modifier_desc: "[THIS.GetName]에서 현지 원주민과 이 지역의 여러 개발업자 사이에 원주민 폭력 사태가 발생했습니다. 이 폭력이 훨씬 더 큰 사태로 번지는 것은 시간문제입니다..."
 brazil_amazon.1.t: "걷잡을 수 없는 산불"
 brazil_amazon.1.d: "다른 여건으로 인해 악화되기는 했으나 자연적인 산불이 연이어 발생하여 우리 영토 내 아마존의 일부를 휩쓸기 시작했습니다. 우리는 이미 대응 체계를 갖추기 시작했지만, 이미 입은 피해는 되돌릴 수 없습니다. 더 이상의 확산을 막기만을 바랄 수밖에 없습니다."
 brazil_amazon.1.a: "가진 것으로 할 수 있는 일을 한다."
 brazil_amazon.1.b: "육군을 투입하여 지원한다."
 brazil_amazon.2.t: "아마존강 범람"
 brazil_amazon.2.d: "유난히 비가 많이 내린 우기로 인해 연이은 홍수가 개발 거점 인근의 아마존강 여러 구간을 침수시켰습니다. 수색 및 구조 작전이 이미 진행 중이며 피해 수습반이 뒤따르고 있습니다. 그러나 이 지역의 댐을 비롯한 일부 지역은 이미 심각한 피해를 입었습니다."
 brazil_amazon.2.a: "가진 것으로 할 수 있는 일을 한다"
 brazil_amazon.2.b: "육군을 투입하여 수색 및 구조를 지원한다"
 brazil_amazon.3.t: "아마존 접경 지역의 가뭄"
 brazil_amazon.3.d: "아마존 주변 지역의 지하수 오염과 하천 우회로 인해 강우 부족으로 인한 가뭄이 접경 지역 한 곳을 강타했습니다. 이미 광범위한 혼란이 일고 있으며, 접경 지역의 취약한 삼림 생태계 일부가 사라지고 있습니다."
 brazil_amazon.3.a: "그들이 물을 더 잘 관리했어야 한다"
 brazil_amazon.3.b: "지원 가능한 재난 구호 물자를 최대한 신속히 투입한다!"
 brazil_amazon.4.t: "열대 폭풍, 아마존 지역 강타"
 brazil_amazon.4.d: "대서양에서 발생한 열대 폭풍이 육지를 휩쓸고 아마존으로 들어와 곳곳에 파괴의 흔적을 남겼습니다. 가옥, 나무, 산업 시설이 모두 피해를 입었으며 수색 및 구조 작전이 이미 진행 중입니다. 국민들은 우리가 어떤 형태로든 재난 구호로 대응하기를 기대하고 있을 것입니다."
 brazil_amazon.4.a: "그들이 더 튼튼하게 지었어야 한다"
 brazil_amazon.4.b: "지원 가능한 재난 구호 물자를 최대한 신속히 투입한다!"
 brazil_amazon.5.t: "불법 개간 벌목"
 brazil_amazon.5.d: "아마존 외곽에서 이루어진 불법 개간 벌목 사업이 우리에게 포착되었습니다. 이미 수 톤의 목재가 현장 밖으로 반출되어 경제에 유통되기 시작했으며, 표식이 없어 우리가 추적하기는 사실상 불가능할 것입니다. 이제 우리는 당장의 영향에 대처하는 일만 남았습니다."
 brazil_amazon.5.a: "이 시점에서 할 수 있는 최소한의 일을 한다"
 brazil_amazon.5.b: "저들도 사정을 알 텐데, 우리 몫은 어디 있는가?"
 brazil_amazon.6.t: "불법 화전 개간"
 brazil_amazon.6.d: "아마존 외곽에서 이루어진 불법 화전 사업이 우리에게 포착되었습니다. 이미 수 에이커의 땅이 파괴되어 농지로 경작되거나 소 방목지로 쓰이거나 새로운 개발 부지로 이용되고 있습니다. 지방 당국이 마음만 먹으면 이들은 쉽게 쫓아낼 수 있으므로, 우리는 당장의 영향에 대처하는 일만 남았습니다."
 brazil_amazon.6.a: "이 시점에서 할 수 있는 최소한의 일을 한다."
 brazil_amazon.6.b: "저들도 사정을 알 텐데, 우리 몫은 어디 있는가?"
 brazil_amazon.7.t: "기업, 지역 보전 용지 매입"
 brazil_amazon.7.d: "국내의 한 지역 기업이 우리가 최근 시장에 내놓은 보전 용지 권리 일부를 사들이기 시작했습니다. 이들은 이 지역의 금, 구리, 기타 자원 매장지를 개발하려 하고 있습니다."
 brazil_amazon.7.a: "성장이 촉진되고 자원이 발견되었다"
 brazil_amazon.8.t: "산불을 일으킨 화전"
 brazil_amazon.8.d: "우리에게 포착되었던 최근의 화전 사업이 우리의 개입에도 불구하고 계속된 것으로 보입니다. 오히려 이전보다 더 대담해졌습니다. 이로 인해 불길이 통제 불능으로 번지는 사고가 발생했습니다."
 brazil_amazon.8.a: "저 멍청한 놈들."
 brazil_amazon.8.b: "다행히도 우리는 이런 가능성에 대비해 두었다."
 brazil_amazon.9.t: "생태계 붕괴로 이어진 밀렵"
 brazil_amazon.9.d: "최근 아마존의 한 지역에서 활동하는 불법 밀렵 조직이 적발되었습니다. 이들의 활동은 이미 작전 지역 내 생태계 붕괴 과정을 시작시켰습니다. 이들은 지방 당국이 쉽게 처리할 수 있으므로, 우리는 당장의 영향에 대처하는 일만 남았습니다."
 brazil_amazon.9.a: "이 시점에서 할 수 있는 최소한의 일을 한다."
 brazil_amazon.9.b: "국립공원관리청이 핵심종을 재도입하게 한다."
 brazil_amazon.9.c: "저들도 사정을 알 텐데, 우리 몫은 어디 있는가?"
 brazil_amazon.10.t: "원주민 땅에 대한 불법 침입"
 brazil_amazon.10.d: "아마존 내 원주민 땅에 범죄 세력이 빈번하게, 때로는 폭력적으로 침입하고 있다는 보고가 들어왔습니다. 긴장이 고조되고 있으며, 폭력과 분쟁의 역사를 고려하면 이것이 어떤 형태의 폭력으로 번지는 것은 시간문제입니다. 게다가 이 범죄 세력은 주변 숲에 피해를 입히고 있습니다."
 brazil_amazon.10.a: "그들의 땅이라고 하니, 그들이 알아서 처리하게 둔다."
 brazil_amazon.10.b: "누구든 좋으니 이 문제를 처리할 사람을 찾는다."
 brazil_amazon.10.c: "육군을 투입하여 해결한다."
 brazil_amazon.11.t: "살인으로 이어진 침입"
 brazil_amazon.11.d: "범죄 세력의 최근 침입은 침입자와 원주민 모두가 연루된 일련의 살인으로 이어졌습니다. 이 시점에서 누가 먼저 누구를 죽이기 시작했는지 가려내는 것은 불가능합니다. 우리에게는 그 여파와 누구를 처벌할지 결정하는 일만 남았습니다. 우리가 무엇을 하든 이 사태를 통제하기는 어려울 것입니다."
 brazil_amazon.11.a: "우리가 할 수 있는 일은 없다. 신께서 그들의 영혼을 구원하시기를."
 brazil_amazon.11.b: "범죄자들이 원주민을 살해한 교과서적인 사례이다."
 brazil_amazon.11.c: "육군을 투입하여 사태를 해산시킨다."
 brazil_amazon.12.t: "원주민들의 감사 표명"
 brazil_amazon.12.d: "아마존 내 원주민 땅 침입과 관련한 최근 우리의 조치로 인해, 우리는 부족 평의회로부터 공식적인 감사 인사를 받았습니다. 그들을 지원한 데 대한 보답으로, 그들은 이 지역에서의 우리 정치 활동에 향후 지지를 약속했습니다."
 brazil_amazon.12.a: "그들은 법을 지키는 시민이며, 우리의 보호를 받을 자격이 있다"
 brazil_amazon.13.t: "정글 마약 재배지 발견"
 brazil_amazon.13.d: "최근 우리 아마존 영토 깊숙한 곳에 카르텔이 운영하는 농장이 있다는 보고가 들어왔습니다. 이 작전으로 인해 매우 허술한 화전 방식으로 밭을 만들기 위해 상당한 수의 나무가 베어졌습니다. 이들이 어느 정도라도 조직을 유지하는 유일한 이유는 자신들의 물건이 불타는 것을 분명히 두려워하기 때문입니다."
 brazil_amazon.13.a: "진입하여 할 수 있는 일을 해 본다."
 brazil_amazon.13.b: "경찰력이 지역 군 사령부와 협력하게 한다."
 brazil_amazon.13.c: "오! 그 밭이 거기 있었군, 영리하군."
 brazil_amazon.14.t: "[?var:influence_array^0.GetName]의 보전 압박"
 brazil_amazon.14.d: "최근 우리는 국제 파트너들로부터 아마존의 보전 노력을 강화하라는 여러 청원을 받았습니다. 평소라면 이러한 요청을 무시할 수 있겠지만, 최대 교역 상대국인 [Largest Investor]이(가) 같은 방향으로 압력을 가하기 시작했습니다. 우리가 협조하는 대가로 그들은 다른 분야에서 영향력을 늦추겠다고 제안하고 있습니다."
 brazil_amazon.14.a: "단기적 이익을 위해 우리의 가치를 희생할 수는 없다."
 brazil_amazon.14.b: "수익성 있는 거래를 성사시키는 것은 언제나 이롭다."
 brazil_amazon.15.t: "아마존 주요 댐 월류"
 brazil_amazon.15.d: "아마존 내 우리 댐 중 하나가 상류에서 급격히 불어난 물로 인해 월류했습니다. 재난 관리 인력이 이미 향하고 있으나 이미 얼마나 많은 피해가 발생했는지는 불분명합니다. 최악의 경우 압력을 견디지 못한 댐이 붕괴하여 하류에 더 큰 피해를 줄 수 있습니다. 가능성이 낮더라도 이에 대비하는 것을 고려해야 합니다."
 brazil_amazon.15.a: "가능성은 희박하니, 지금은 필요한 인원만 투입한다."
 brazil_amazon.15.b: "최악의 경우에 대비하여 하류 지역의 대피를 시작한다."
 brazil_amazon.16.t: "참담한 댐 붕괴"
 brazil_amazon.16.d: "최악의 사태가 벌어졌습니다. 월류한 댐에 대한 마지막 보고 이후 몇 시간 뒤, 구조적 결함으로 인해 댐이 활짝 터져 버렸습니다. 물이 하류로 급속히 쏟아져 내리며 경로상의 모든 것을 휩쓸어 갔습니다. 수색 및 구조 작업이 이미 진행 중이지만, 수천 명의 사람들과 수백만 달러 상당의 기반시설에게는 이미 너무 늦었습니다."
 brazil_amazon.16.a: "이... 이런 일이 일어나서는 안 되는 것이었는데…"
 brazil_amazon.16.b: "지옥이 따로 없다, 해당 지역에 가능한 한 많이 투입하라!"
 brazil_amazon.17.t: "댐 붕괴"
 brazil_amazon.17.d: "월류한 댐에 대한 마지막 보고 이후 몇 시간 뒤, 구조적 결함으로 인해 댐이 활짝 터져 버렸습니다. 물이 하류로 급속히 쏟아져 내리며 경로상의 모든 것을 휩쓸어 갔습니다. 수색 및 구조 작업이 이미 진행 중이지만, 우리의 선견지명 덕분에 현재까지 알려진 사상자는 재난을 막으려다 숨진 기술자 몇 명과 경로상에 있던 나무와 건물뿐입니다. 이 피해마저도 계획과 대비로 줄어든 것입니다. 우리는 이미 선견지명을 칭송받고 있으며, 목숨을 잃은 기술자들을 위한 기념비 건립 계획이 수립되고 있습니다."
 brazil_amazon.17.a: "아무것도 하지 않았다면 어떤 세상이 되었을지 상상만 할 뿐이다."
 brazil_amazon.18.t: "댐 월류 진정"
 brazil_amazon.18.d: "몇 시간 동안 긴장 속에서 소식을 기다린 끝에, 지친 댐 기술자가 월류가 진정되었다는 보고서를 제출했습니다. 침수가 있기는 하지만 관리 가능한 수준입니다."
 brazil_amazon.18.a: "그리고 아무것도 하지 않아 돈을 아꼈다."
 brazil_amazon.19.t: "댐 월류 진정"
 brazil_amazon.19.d: "몇 시간 동안 긴장 속에서 소식을 기다린 끝에, 지친 댐 기술자가 월류가 진정되었다는 보고서를 제출했습니다. 침수가 있기는 하지만 관리 가능한 수준입니다. 그러나 댐이 붕괴할 가능성과 재난 관리팀의 신속한 대응은 이미 헤드라인을 장식했습니다. 댐 기술자부터 지역 지도자에 이르기까지 재난을 막은 영웅으로 칭송받고 있습니다."
 brazil_amazon.19.a: "이런 순간에는 공직자라는 것이 거의 즐겁게 느껴진다."
 brazil_amazon.20.t: "아마존, 아마조나스주에 물류 센터 설립"
 brazil_amazon.20.d: "미국 기업 아마존이 아마조나스 지역에 서비스를 제공할 목적으로 마나우스에 물류 센터를 설립했습니다. 이러한 기업이 이 지역에 관심을 가졌다는 것은 세계 무대에서 이 지역의 중요성이 커지고 있음을 보여 주는 증거입니다."
 brazil_amazon.20.a: "상황이 통제 불능이 되어 간다, 이제 아마존이 둘이다."
 brazil_amazon.21.t: "아마존의 황폐화"
 brazil_amazon.21.d: "아마존 열대우림의 전체 면적이 5천만 에이커 아래로 떨어졌습니다. 열대우림은 과잉 개발과 여러 재난 등으로 인해 이제 회복 불가능한 상태에 이르렀습니다. 우리가 열대우림을 완전히 황폐화했지만, 단기적으로는 경제 발전이 그만한 가치가 있었던 듯하나 장기적인 파괴는 그럴 가치가 없었을지도 모릅니다."
 brazil_amazon.21.a: "마지막 남은 트러풀라 나무"
 brazil_amazon.22.t: "농공 기업, 농지에 투자"
 brazil_amazon.22.d: "농산물을 전문으로 하는 국내 민간 기업 중 한 곳이 아마존 열대우림의 농지에 투자하기로 했습니다."
 brazil_amazon.22.a: "훌륭하다! 새로운 지구다."
 brazil_amazon.22.b: "새로운 개발을 거부한다."
 brazil_amazon.23.t: "산업 광업 기업, 자원 매장지 개발"
 brazil_amazon.23.d: "아마존 열대우림에는 정글과 빽빽한 식생 아래에 막대한 양의 자원 매장지가 있습니다. 식생과 덤불 아래에서 다양한 양의 철, 구리, 석유 및 그 밖의 많은 자원을 찾을 수 있습니다."
 brazil_amazon.23.a: "훌륭하다! 새로운 지구다."
 brazil_amazon.23.b: "새로운 개발을 거부한다."
 brazil_amazon.24.t: "민간 기업, 아마존 기반시설 개발"
 brazil_amazon.24.d: "최근 기반시설 개발 허가를 받은 민간 기업들이 현재의 경량 도로에서 기반시설을 확장하는 새로운 제안과 아마존 개발안을 내놓았습니다."
 brazil_amazon.24.a: "훌륭하다! 새로운 지구다."
 brazil_amazon.24.b: "새로운 개발을 거부한다."
 brazil_amazon.25.t: "민간 기업, 신규 건설사 설립"
 brazil_amazon.25.d: "한 민간 기업이 아마존과 그 안의 도시들을 계속 개발하기 위해 아마존 기반의 신규 건설사를 설립하기로 했습니다."
 brazil_amazon.25.a: "훌륭하다! 새로운 지구다."
 brazil_amazon.25.b: "새로운 개발을 거부한다."
 brazil_amazon.26.t: "민간 기업, 아마존 일부 재식림"
 brazil_amazon.26.d: "한 민간 기업이 아마존 열대우림 일부를 개발하고 지역 보전 구역에 추가로 나무를 심기로 했습니다. 재식림으로 이전에 잃었던 면적의 일부를 되찾을 수 있게 되었습니다."
 brazil_amazon.26.a: "훌륭하다! 새로운 지구다."
 brazil_amazon.26.b: "새로운 개발을 거부한다."
 brazil.14.b: "행진 탄압"
 brazil.42.t: "브라질, 부채 지원 요청"
 brazil.42.d: "[BRA.GetLeader]와(과) 대표단이 오늘 새로운 거래안을 가지고 우리를 찾아왔습니다. 브라질 경제는 임박한 부채 위기와 마비된 통화로 인해 현재 위태로운 상황입니다. 그들은 우리 정부가 민간 투자자들로부터 부채를 되사들이는 계획을 제시했습니다. 경제 상황과 헤알화의 상태를 보면 그들은 상당히 절박해 보입니다. 이 계획을 추진하겠습니까?"
 brazil.42.a: "계획을 승인한다"
 brazil.42.b: "계획을 거부한다"
 brazil.43.t1: "미국, 계획에 동의"
 brazil.43.t2: "미국, 계획을 거절"
 brazil.43.d1: "미국이 우리 제안에 대해 계획에 동의한다는 답변을 보내왔습니다. 모든 것이 효력을 발휘하는 데 며칠이 걸리겠지만, 그들은 브라질 국민을 도울 것입니다."
 brazil.43.d2: "미국이 우리의 부채 부담을 덜어 달라는 제안을 거절했습니다. 참으로 안타까운 소식이지만, 나라를 채무 불이행에서 구하기 위해 긴축 조치를 추진할 때가 되었습니다."
 brazil.43.a: "당신에게는 저라는 친구가 있습니다."
 brazil.43.b: "시련과 고난을 헤치고..."
 brazil.44.t: "벨렝, 사탕수수를 위한 화전 요청"
 brazil.44.d: "벨렝은 더 밀림이 울창한 지역과 가까운 도시 외곽에 자체 사탕수수 농장을 시작하기 위해 지역의 맹그로브와 열대우림 일부를 화전으로 개간하게 해 달라고 요청했습니다. 화전을 허용하겠습니까?"
 brazil.44.a: "화전을 허용한다"
 brazil.44.b: "화전을 거부한다"
 brazil_news.5.t: "아마존의 황폐화"
 brazil_news.5.d: "브라질 당국은 경제 개발을 위해 벌채·사용된 전체 면적에 관한 월간 보고서를 발표했습니다. 전체 면적은 이제 5천만 에이커 아래로 떨어졌으며, 이는 아마존 열대우림이 이제 회복 불가능한 상태에 이르렀음을 의미합니다. 그 피해가 세계와 생태계에 어떤 영향을 미칠지는 시간만이 알려 줄 것입니다."
 brazil_news.5.a: "마지막 한 그루가 쓰러지고, 새로운 시대가 시작된다..."
 brazil_flavour_events.14.t: "민주당 창당"
 brazil_flavour_events.14.d: "자유전선당이 재창당 및 개편되어 당의 정치 이념을 더 잘 대변하게 되었습니다. 이들은 자유 시장 정책과 민주주의에 대한 지지와 자신들의 이미지를 더 잘 일치시키고 다른 국제 자유주의 정당들과 동일시되는 것에서 더욱 거리를 두기 위해 정당 이름을 \\"민주당(The Democrats)\\"으로 정했습니다."
 brazil_flavour_events.14.a: "새로운 경쟁자"
 BRA_nationalism_rise_TT: "§Y분열된 정당§!이 §Y민족주의의 부상§!으로 대체됩니다.\n§G민족주의 인기도 증가, 민주주의 인기도 감소§! 및 §R정치력 비용 증가§!"
 BRA_has_conserved_acreage_x_tt: "§Y전체 보존 열대우림 면적§!이 [?needed_acreage|0Y] 이상 (현재 보존 열대우림 면적: [?BRA_acres_conserved|Y])"
 BRA_has_wild_acreage_x_tt: "§Y전체 야생 열대우림 면적§!이 [?needed_acreage|0Y] 이상 (현재 야생 열대우림 면적: [?BRA_acres_wild|Y])"
 BRA_modern_frigate: "현대식 호위함"
 BRA_modern_frigate_desc: "현대 해전에서 호위함의 역할은 이전보다 크게 강화되었으며, 자체 호위함을 개발하는 것이 필수적입니다."
 brazil_amazon.27.t: "요한 엘리아슈"
 brazil_amazon.27.d: "스웨덴 사업가 요한 엘리아슈(Johan Eliasch)가 최근 입국하여 벌목 회사 제탈 아마조나스(Gethal Amazonas)를 인수했습니다. 이 억만장자는 해당 회사의 사업을 즉시 중단하고 그 땅을 추가 보전에 쓰도록 하겠다고 밝혔습니다. 이를 선물로 받아들일 수도 있고, 회사를 국유화하여 우리의 목적에 이용할 수도 있습니다. 어떻게 해야 합니까?"
 brazil_amazon.27.a: "훌륭하다! 폐쇄를 허용한다."
