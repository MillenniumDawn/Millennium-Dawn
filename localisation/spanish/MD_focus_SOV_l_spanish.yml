 russia.500.t: "Rostec consolida la industria de los helicópteros"
 russia.500.d: "Décadas de competencia entre las oficinas de diseño de Mil y Kamov y las plantas de ensamblaje de Rostvertol, Kazán y Ulán-Udé han dejado fragmentada la producción de aeronaves de ala rotatoria en Rusia. Bajo la coordinación industrial de Rostec, el legado superviviente de la era soviética se consolida en un único holding integrado, la S.A. Helicópteros de Rusia, para optimizar la investigación, la producción y las exportaciones."
 russia.500.a: "Formar la S.A. Helicópteros de Rusia"
 TT_SOV_russian_helicopters_carry_traits: "Todos los rasgos completados de §YHelicópteros Mil§! se transferirán a §YHelicópteros de Rusia§!."
 SOV_mp_end_rentier_state: "Poner fin al Estado rentista"
 SOV_mp_end_rentier_state_desc: "Romper nuestra dependencia de las exportaciones de recursos naturales y diversificar la economía, eliminando el Estado rentista. Disponible únicamente cuando las mejoras multijugador están activadas."
 SOV_mobilize_SOBR_tt: "Se §Ymovilizarán§! los £text_icon_sov_sobr §2batallones del SOBR§!"
 RUS_continue_reunification_tt: "Al menos uno de los Estados sucesores de Rusia debe conservar todavía sus territorios históricos"
