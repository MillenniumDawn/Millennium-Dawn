 GER_idea_bfv_rightwing_low: "Bundesamt Für Verfassungsschutz"
 GER_idea_bfv_leftwing_high: "Bundesamt Für Verfassungsschutz"
 GER_idea_bfv_leftwing_med: "Bundesamt Für Verfassungsschutz"
 GER_idea_bfv_leftwing_low: "Bundesamt Für Verfassungsschutz"
 GER_Armored_Rec_TT: "Em vez de depender apenas de veículos leves de reconhecimento, uma plataforma mais blindada poderia ser introduzida para permitir um reconhecimento com capacidade de combate. Essa abordagem garante maior sobrevivência e poder de fogo, permitindo que a unidade enfrente forças inimigas quando necessário, sem deixar de cumprir seu papel de exploração."
 GER_Cold_War.21.c: "Pode ser caro, mas manteremos o tamanho atual."
 GER_idea_Sickman: "Homem Doente da Europa"
 GER_idea_BND: "Bundes Nachrichten Dienst"
 GER_Idea_Innere_fuhrung_II: "Conceito de Innere Führung na Bundeswehr Alemã"
 GER_Cold_War.26.t: "Reorganização das Forças Territoriais"
 GER_Cold_War.26.d: "Com a criação da Streitkräftebasis, a continuidade do Territorialheer foi posta em dúvida. Manter cadeias de comando separadas e estruturas de apoio redundantes já não está alinhado com a doutrina militar moderna. Agora devemos decidir o que fazer com essas unidades, uma escolha que moldará nossa organização militar interna nos próximos anos."
 GER_Cold_War.26.a: "Dissolver as unidades e aposentar a estrutura"
 GER_Cold_War.26.b: "Reduzir a força, mas manter alguma capacidade"
 GER_Cold_War.26.c: "Integrá-las totalmente à Streitkräftebasis"
 balkan_stability_20: "Tensões Normais"
 balkan_stability_30: "Tensões em Alta"
