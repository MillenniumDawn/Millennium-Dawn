 nhmrc_grants_desc: "국립보건의료연구위원회는 우리의 최첨단 의학 연구 기관입니다. 우리의 보건 수준은 이들이 내놓을 수 있는 연구에 달려 있습니다. 단기 지원금으로 보충하면 업계에 유망한 성과를 가져올 수 있습니다."
 encourage_electrical_vehicles_ast: "전기차 장려"
 encourage_electrical_vehicles_ast_desc: "우리가 지향하는 미래를 실현 가능하게 하려면 하이브리드 및 저배출 차량 제조의 토대를 놓는 일이 중요합니다. 단기적인 연료 배급제를 얻고자 할 때에도 도움이 됩니다."
