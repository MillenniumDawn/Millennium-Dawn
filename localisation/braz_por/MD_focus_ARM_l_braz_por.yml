 ARM_exercises_with_iran: "Exercícios Conjuntos com [PER.GetName]"
 ARM_foreign_legion_help_poland: "Enviar a [ARM.GetFlag]§YLegião Estrangeira§! para §Y[POL.GetNameWithFlag]§!"
 ARM_foreign_legion_help_italy: "Enviar a [ARM.GetFlag]§YLegião Estrangeira§! para §Y[ITA.GetNameWithFlag]§!"
 ARM_foreign_legion_help_syria: "Enviar a [ARM.GetFlag]§YLegião Estrangeira§! para §Y[SYR.GetNameWithFlag]§!"
 ARM_foreign_legion_help_kurdistan: "Enviar a [ARM.GetFlag]§YLegião Estrangeira§! para §Y[KUR.GetNameWithFlag]§!"
 ARM_foreign_legion_help_lebanon: "Enviar a [ARM.GetFlag]§YLegião Estrangeira§! para §Y[LEB.GetNameWithFlag]§!"
 ARM_foreign_legion_help_cyprus: "Enviar a [ARM.GetFlag]§YLegião Estrangeira§! para §Y[CYP.GetNameWithFlag]§!"
 ARM_foreign_legion_help_greece: "Enviar a [ARM.GetFlag]§YLegião Estrangeira§! para §Y[GRE.GetNameWithFlag]§!"
 arm_foreign_legion.1.t: "Legião Estrangeira Armênia"
 arm_foreign_legion.1.d: "Inspiramo-nos no exemplo da Legião Estrangeira Francesa e decidimos criar uma unidade semelhante em nosso Exército. Agora surge a questão do equipamento técnico da legião; pretendemos envolver especialistas franceses e indianos para ajudar nesse assunto."
 arm_foreign_legion.1.a: "Ótimo"
 arm_foreign_legion.2.t: "Legião Estrangeira Armênia"
 arm_foreign_legion.2.d: "Finalmente, nossa nova unidade, a Legião Estrangeira, foi criada. Agora, cidadãos de outros países, entre outros, têm a oportunidade de obter nossa cidadania servindo na legião por alguns anos e derramando sangue em benefício da Armênia."
 arm_foreign_legion.2.a: "Ótimo"
 arm_foreign_legion.3.t: "Legião Estrangeira Armênia"
 arm_foreign_legion.3.d: "O governo armênio se oferece para nos enviar sua própria unidade, a Legião Estrangeira. Eles afirmam que são combatentes experientes, com bom equipamento técnico e treinamento de combate, e certamente se mostrarão úteis na situação atual."
 arm_foreign_legion.3.a: "Deixaremos que entrem."
 arm_foreign_legion.3.b: "Sem interesse"
 arm_foreign_legion.4.t: "Nossa Legião Estrangeira"
 arm_foreign_legion.4.d: "[FROM.GetName] concordou em receber nossa legião estrangeira em seu território para ajudar a estabilizar a situação atual, e estamos muito satisfeitos com nossa cooperação."
 arm_foreign_legion.4.a: "Bom"
 arm_foreign_legion.5.t: "Nossa Legião Estrangeira"
 arm_foreign_legion.5.d: "[FROM.GetName] recusou-se a aceitar nossa legião estrangeira em seu território, considerando sua presença desnecessária."
 arm_foreign_legion.5.a: "Triste"
 arm_foreign_legion.6.t: "Nossa Legião Estrangeira"
 arm_foreign_legion.6.d: "Os soldados de nossa legião estrangeira cumpriram sua missão e estão voltando para sua terra natal."
 arm_foreign_legion.6.a: "Bem-vindos de volta"
 coop_shit_unlock_tt: "As Decisões de §YCooperação Militar Internacional§! Serão §GDesbloqueadas!§!"
 rifle_eff_tt: "[FROM.GetNameWithFlag] concede licença para a produção de seus fuzis."
 effect_if_we_acc_tt: "§HEfeito se Aceitarmos:§!"
 effect_if_they_rec_tt: "§HEfeito quando eles receberem:§!"
 us_ar_prov_licens_tt: "[USA.GetNameWithFlag] nos concederá licença para a produção do §YM4A1§!!"
 ru_ak_prov_licens_tt: "[SOV.GetNameWithFlag] nos concederá licença para a produção do §YAK-103§!!"
 koch_inv_tt: "Devemos ser §Ycuidadosos§! com o que §Yescolhermos!§!"
 yerkr_party_change_tt: "O partido da §8Junta Militar§! mudará de §RYerkrapah§! para §YForças Armadas da Armênia!§!"
 ARM_nor_aven_first: "Avenida Norte"
 later_good_thing_tt: "Quando os Problemas de Infraestrutura em Yerevan forem §RRemovidos§!, ganharemos melhorias de infraestrutura no estado de Yerevan."
 ARM_infr_problems_yerevan: "Problemas de Infraestrutura em Yerevan"
 ARM_infr_problems_yerevan_desc: "A reconstrução do centro de Yerevan está causando perturbações temporárias: congestionamentos, interrupções comerciais e custos de construção pressionam a economia e os serviços da capital.\n§W--------------§!\nEste espírito nacional será §RRemovido§! quando a reconstrução estiver concluída, concedendo infraestrutura estadual aprimorada em Yerevan."
 ARM_nor_aven_sec: "Velha Yerevan"
 norav_tt: "Teremos §YVárias Opções§! sobre o que fazer com o §YProjeto da Avenida Norte§!"
 rus_waits_tt: "Nós §Yacordamos§! com [SOV.GetNameWithFlag] que resolveremos a §Rquestão da dívida§! dentro de §Yum ano!§!"
 first_assasin_tt: "§YConcluiremos a primeira fase dos assassinatos políticos!§!"
 second_assasin_tt: "§YConcluiremos a segunda fase dos assassinatos políticos!§!"
 arm_milit.1.t: "A Armênia Pede Licença de Fuzil!"
 arm_milit.1.d: "Recentemente, o governo armênio nos procurou pedindo uma licença de produção de nossos fuzis de assalto em seu país. Devemos aceitar essa oferta?"
 arm_milit.1.a: "Onde assino?"
 arm_milit.1.b: "Não, é claro."
 arm_milit.2.t: "[FROM.GetNameWithFlag] Aceita Nossa Oferta!"
 arm_milit.2.d: "[FROM.GetNameWithFlag] aceitou nossa oferta e nos fornecerá toda a documentação para a produção do fuzil."
 arm_milit.2.a: "Maravilhoso."
 arm_milit.3.t: "[FROM.GetNameWithFlag] Rejeitou Nossa Oferta!"
 arm_milit.3.d: "Eles rejeitaram nossa oferta e não nos fornecerão nenhuma documentação ou licença para a produção de seus fuzis."
 arm_milit.3.a: "Que droga."
 arm_milit.4.t: "Oferta da Orsis"
 arm_milit.4.d: "A Orsis, empresa de armas de fogo militares, ofereceu-se para investir em nosso complexo militar-industrial. Podemos aceitar a proposta deles ou aproveitar a oportunidade para ganhos políticos."
 arm_milit.4.a: "Claro, aceitamos!"
 arm_milit.4.b: "Seus produtos são para caça, não para uso militar!"
 arm_milit.5.t: "O Exército de Artsakh Está Sendo Integrado ao Nosso"
 arm_milit.5.d: "As Forças Armadas da República de Artsakh estão tomando medidas para se integrar ao nosso exército, visando uma melhor interação e cooperação de nossas forças armadas."
 arm_milit.5.a: "Ótimo!"
 arme.6.t: "[ARM.GetNameWithFlag] Pede Investimentos!"
 arme.6.d: "Nosso velho parceiro político e amigo, Robert Kocharyan, nos pede para investir na economia armênia em um acordo mutuamente benéfico. Devemos concordar?"
 arme.6.a: "Claro!"
 arme.6.b: "Desculpe, desta vez não."
 arme.7.t: "[SOV.GetNameWithFlag] Concorda!"
 arme.7.d: "Graças às nossas boas conexões com a liderança política russa, eles concordaram em investir em nossa economia e construir uma fábrica civil em nosso país."
 arme.7.a: "Maravilhoso!"
 arme.8.t: "[SOV.GetNameWithFlag] Rejeita!"
 arme.8.d: "Infelizmente, a Rússia não se convenceu a investir em nossa economia e a assinar o acordo."
 arme.8.a: "Ugh."
 arme.9.c: "Renovar os Antigos Edifícios Históricos"
 arme.11.t: "Assassinato de Poghos Poghosyan!"
 arme.11.d: "Após o recente encontro entre Robert Kocharyan e Poghos Poghosyan, Poghos Poghosyan foi liquidado. Muito provavelmente, o partido Dashnaktsutyun ficará furioso. Precisamos decidir o que fazer com eles."
 arme.11.a: "Vamos aproximar os leais."
 arme.11.b: "Eles não têm utilidade."
 koch_union_stat_tt: "[ARM.GetNameWithFlag] Entrará no §GEstado da União!§!"
 arme.15.t: "A Oposição Ganha Apoio!"
 arme.15.d: "Devido à falta de ação do governo de Kocharyan, a oposição aumentou seu apoio entre a população e se tornou mais consolidada."
 arme.15.a: "Maldição!"
 ARM_Pashik_misters_loc1: "Convencer o Senhor P"
 ARM_Pashik_misters_loc2: "Convencer o Senhor J"
 ARM_Pashik_misters_loc3: "Convencer o Senhor N"
 ARM_Pashik_misters_loc4: "Convencer o Senhor Z"
 ARM_Pashik_misters_loc5: "Convencer o Senhor L"
 ARM_Pashik_misters_loc6: "Convencer o Senhor P"
 ARM_mister_p: "[ARM_Pashik_misters_loc]"
 ARM_mister_p_desc: "Precisamos nos encontrar com o presidente russo para fortalecer nossas relações e convencê-lo de que não somos contra ele."
 ARM_crackdown_on_corruption: "Repressão à Corrupção"
 ARM_crackdown_on_corruption_desc: "\"Chega de subornos, chega de monopólios, os direitos humanos serão protegidos, o Estado de direito prevalecerá!\" - disse o líder dos protestos Nikol Pashinyan, em seu discurso diante do parlamento da Armênia, antes de ser eleito pelos deputados como novo primeiro-ministro do país."
 ARM_exit_problems: "A Saída dos Problemas"
 ARM_exit_problems_desc: "Nossa nova agenda é a SAÍDA de todos os problemas. Somos o partido da mudança!"
 ARM_educ_curicullum: "O Novo Currículo Educacional"
 ARM_educ_curicullum_desc: "A educação deve mudar em nossa nova Era. Devemos fazer com que toda a educação obedeça às nossas novas preferências ideológicas."
 ARM_renew_view_hist: "Renovar a Visão da História Armênia"
 ARM_renew_view_hist_desc: "A visão sobre a história armênia deve ser remodelada de acordo com as ideias de nosso líder. O mundo é feito de perspectivas, e é nosso dever mudá-las!"
 ARM_irrecons_contr: "Enfrentar Contradições Irreconciliáveis"
 ARM_irrecons_contr_desc: "Existem muitas contradições entre liberalismo e nacionalismo em nossa constituição. Devemos enfrentá-las e mudar a constituição."
 ARM_gather_loyalists: "Reunir os Leais"
 ARM_gather_loyalists_desc: "Devemos reunir todos os leais de nosso partido para colocá-los nos respectivos cargos ministeriais. Os malditos tecnocratas são tão politicamente desleais que podem se tornar um problema em nosso aparato administrativo."
 ARM_investig_clique: "Investigar a Panelinha"
 ARM_investig_clique_desc: "A panelinha Serzh-Rob deve ser investigada para, finalmente, limpar nosso país do sangue das repressões e da corrupção."
 ARM_change_gov_structure: "Mudar a Estrutura do Governo"
 ARM_change_gov_structure_desc: "Nossa estrutura governamental não corresponde mais à forma como as coisas são feitas com eficiência. Devemos mudar isso."
 ARM_social_media_prop: "Propaganda nas Redes Sociais"
 ARM_social_media_prop_desc: "Para convencer a população de que estamos certos, nosso líder deve estar constantemente na esfera de informação de nossos cidadãos; todo armênio lerá e assistirá ao nosso grande líder nacional, próximo do povo"
 ARM_hijack_nat_voters: "Sequestrar os Eleitores Nacionalistas"
 ARM_hijack_nat_voters_desc: "Para aumentar o apoio ao nosso primeiro-ministro, precisamos apelar às massas, inclusive à direita radical."
 ARM_era_of_peace: "Agenda da Era da Paz"
 ARM_era_of_peace_desc: "Nossa nova doutrina é a paz, não a guerra! Devemos esquecer o que aconteceu em 1915 e nos anos 90. Agora somos um novo país."
 ARM_police_guard: "Guarda Policial"
 ARM_police_guard_desc: "Pretendemos criar uma unidade separada das forças policiais. A Guarda Policial atuará estritamente dentro das funções civis de aplicação da lei e não participará de operações de combate."
 ARM_csto_dilemm: "Posição sobre a OTSC?"
 ARM_csto_dilemm_desc: "Devemos decidir qual é a nossa posição sobre a OTSC. Devemos sair dela ou reforçar nossos laços?"
 ARM_anti_belarus_rhetoric: "Retórica Anti-Bielorrússia"
 ARM_anti_belarus_rhetoric_desc: "A Bielorrússia vem apoiando as atrocidades azerbaijanas há muito tempo. Devemos tratar disso!"
 ARM_NGO_friend: "Fazer Amizade com as ONGs"
 ARM_NGO_friend_desc: "Nossa nova e jovem democracia precisa de aliados. As ONGs se encaixam perfeitamente nesse papel!"
 ARM_you_are_that_one_man: "'E Você É Aquele Homem'"
 ARM_you_are_that_one_man_desc: "Nikol Pashinyan é um homem do povo! Ele sabe do que as pessoas do campo precisam e elas, por sua vez, são responsáveis por cada eleição. Você é aquele homem que decide o destino da Armênia!"
 ARM_i_am_that_one_man: "'E Eu Sou Aquele Homem'"
 ARM_i_am_that_one_man_desc: "Nikol Pashinyan é o escolhido! Não apenas pelas eleições, mas também por Deus. A escolha do povo reflete, em última instância, o arranjo cósmico das forças que veio para levar Nikol, nosso líder, ao poder."
 ARM_armenia_pashik_idea: "Armênia de Pashinyan"
 ARM_loyalists_in_government: "Leais no Governo"
 ARM_armenian_soc_media_prop_idea: "Propaganda nas Redes Sociais"
 ARM_pashinyan_anti_corrupt_idea: "Política Anticorrupção"
 ARM_education_reforms: "Reformas Educacionais"
 ARM_true_pashik_democracy: "Bastião Caucasiano da Democracia"
 ARM_controlled_democracy: "Democracia Controlada"
 ARM_new_era_of_peace_idea: "Era da Paz"
 ARM_support_of_ngo_idea: "Apoio às ONGs"
 arm_pashinyan.1.t: "[ARM_Pashik_misters_loc]"
 arm_pashinyan.1.d: "O governo de [ARM.GetNameWithFlag] afirma que seu governo liberal não representa uma ameaça para nós e concorda com maior cooperação"
 arm_pashinyan.1.a: "Certo, Concordamos"
 arm_pashinyan.1.b: "Não"
 arm_pashinyan.2.t: "[SOV.GetNameWithFlag] Confiou em Nós"
 arm_pashinyan.2.d: "[FROM.GetNameWithFlag] aceitou nossa posição e também nos confirmou que não nos via como seu inimigo"
 arm_pashinyan.2.a: "Bom"
 arm_pashinyan.3.t: "[SOV.GetNameWithFlag] Não Confia em Nós"
 arm_pashinyan.3.d: "[FROM.GetNameWithFlag] disse que nossa política externa é uma ameaça para eles, e que nossa tentativa de fazê-los mudar de ideia é apenas uma fachada para nossa cooperação com os inimigos de [SOV.GetNameWithFlag]"
 arm_pashinyan.3.a: "Ruim"
 arm_pashinyan.5.t: "O Povo Nos Apoia"
 arm_pashinyan.5.d: "Há 2 anos fizemos a promessa de melhorar a vida de nossos cidadãos e a cumprimos com sucesso. Agora o povo nos apoia totalmente"
 arm_pashinyan.5.a: "Bom"
 arm_pashinyan.6.t: "Eles se Lembram de Nossas Promessas?"
 arm_pashinyan.6.d: "Inesperadamente, as pessoas se lembraram de nossas palavras de que melhoraríamos seu padrão de vida. Agora só nos resta justificar esse fracasso com outros motivos"
 arm_pashinyan.6.a: "Achamos que poderíamos fazer isso sem gastar muito dinheiro..."
 arm_pashinyan.7.t: "Controvérsias na Constituição"
 arm_pashinyan.7.d: "Há vários artigos contraditórios em nossa constituição que nos impossibilitam de estabelecer relações diplomáticas normais com nossos vizinhos"
 arm_pashinyan.7.a: "Ok"
 arm_pashinyan.8.t: "Rivais no Poder"
 arm_pashinyan.8.d: "Serzh Sargsyan e Robert Kocharyan ameaçam nosso poder porque podem voltar ao poder. Precisamos minar a autoridade deles."
 arm_pashinyan.8.a: "Conduzir uma investigação completa"
 arm_pashinyan.8.b: "A simples calúnia política será suficiente"
 arm_pashinyan.9.t: "Questão do Sistema Político"
 arm_pashinyan.9.d: "Agora que nosso programa político alcançou a maior parte de seus objetivos, devemos decidir como avançaremos rumo ao futuro. Podemos continuar a aderir aos princípios democráticos, ou podemos limitar um pouco as liberdades políticas"
 arm_pashinyan.9.a: "Não devemos perder o controle"
 arm_pashinyan.9.b: "Prometemos democracia ao povo, vamos mantê-la"
 arm_pashinyan.10.t: "Discurso Anti-Bielorrússia no Parlamento"
 arm_pashinyan.10.d: "\"Declaro que, a partir de agora, nunca mais irei à Bielorrússia. Enquanto o presidente Alexander Lukashenko estiver na Bielorrússia. E, em geral, declaro que, a partir de agora, nenhum representante oficial da Armênia irá à Bielorrússia. De forma alguma\""
 arm_pashinyan.10.a: "Eu odeio batata"
 arme.35.t: "Dilema da OTSC"
 arme.35.d: "A OTSC provou ser ineficaz para o nosso país, pois nossos aliados nominais se recusam a nos ajudar contra os azerbaijanos, que violam constantemente nossa integridade territorial. Precisamos decidir o que fazer com nossa condição na OTSC."
 arme.35.a: "Rasgar os papéis e dizer adeus!"
 arme.35.b: "Talvez devêssemos congelar a adesão."
 arme.36.t: "[ARM.GetNameWithFlag] Deixa a OTSC!"
 arme.36.d: "Recentemente, o lado armênio anunciou que quer deixar a OTSC e está organizando a documentação para uma saída completa da organização. Isso afetará muito a nossa influência na região."
 arme.36.a: "Vá com Deus!"
 arme.37.t: "[ARM.GetNameWithFlag] Congela a Adesão à OTSC!"
 arme.37.d: "Recentemente, o lado armênio anunciou que quer congelar a adesão à OTSC, mas não organiza a documentação para uma saída completa da organização. Talvez seja uma decisão política voltada à política interna de seu país."
 arme.37.a: "Hã?"
