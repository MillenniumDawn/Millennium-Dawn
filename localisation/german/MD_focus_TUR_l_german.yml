 TUR_flavor_event.1.t: "Türkischer Wirtschaftskollaps!"
 TUR_flavor_event.1.d: "It appears that our economy has collapsed, and we are unable to do anything to save it this instant. We are going to have to devise an economic plan which lets us slowly repair the economy, and set forth a Turkish Economic boom. We have a long road ahead of us, so we will have to get to work as soon as possible."
 TUR_flavor_event.1.a: "Hoffen wir, dass dies das letzte unserer Probleme ist."
 TUR_flavor_event.2.t: "Schweres Erdbeben in Bingol"
 TUR_flavor_event.2.d: "A major 6.4 magnitude earthquake has rocked the Eastern city of Bingol. 177 people were killed, 84 of which being the result of a collapsing dormitory block in a boarding school. Roughly 8,000 houses were damaged, and about 4 schools have collapsed. This earthquake must act as a reminder for us to step up our disaster relief program."
 TUR_flavor_event.2.a: "Ein trauriger Tag für unser Land"
 TUR_flavor_event.3.t: "Bombenanschlag in Istanbul!"
 TUR_flavor_event.3.d: "At around 9:30 in the morning about five days ago, two trucks loaded with bombs were detonated in Istanbul. One near Neve Shalom Synagogue, and one in Bet Israel Synagogue. About 28 people have lost their lives, while another 300 were injured. Today, we have gotten news that another 31 people were killed during an attack on the British consulate, and another 450 people were injured. In total, 59 people lost their lives, and 750 more were injured as a result of these attacks."
 TUR_flavor_event.3.a: "Schrecklich"
 TUR_flavor_event.3.b: "Ein gewisses Maß an Beihilfe vorbereiten"
 TUR_flavor_event.3.c: "Bereiten Sie alle verfügbaren Hilfsmittel vor"
 TUR_flavor_event.4.t: "Einführung der neuen Lira"
 TUR_flavor_event.4.d: "Recently, a major change to the Lira has been brought about. The Grand National Assembly had voted on the removal of six zeros from the Lira. This means that 1 lira of the new currency is the equivalent of 1,000,000 lira of the old version. However some are doubtful of this new change, and they are arguing that it could do more harm than good to the nation."
 TUR_flavor_event.4.a: "Nein, das ist eine gute Veränderung"
 TUR_flavor_event.4.b: "Alt ist Gold"
 TUR_flavor_event.5.t: "Ermordung von Hrant Dink"
 TUR_flavor_event.5.d: "Hrant Dink, a Turkish-Armenian journalist, had been assassinated in Istanbul a few days back. He was an activist of minority rights, and a newspaper editor who actively sought out the reconciliation between Armenians, and Turks. The murderer has been identified as a 17 year old male, and he is now under police custody. Hrant's death has sparked outrage amongst the Armenian community within our nation, and today was the funeral where thousands gathered in solidarity."
 TUR_flavor_event.5.a: "Tragisch"
 TUR_flavor_event.6.t: "Zustrom von Migranten"
 TUR_flavor_event.6.d: "Lately, we have been receiving more and more migrants from neighboring countries and abroad due to increasing conflicts. This is starting to slowly destabilize our politics, and some people are even pushing for more aggressive policies. We will have to prepare a response to the series of events."
 TUR_flavor_event.6.a: "Je mehr, desto lustiger?"
 TUR_flavor_event.7.t: "Zunahme des Drogenkonsums"
 TUR_flavor_event.7.d: "Der Drogenkonsum hat in bestimmten Gebieten des Landes, insbesondere in den einkommensschwächeren Gebieten, langsam zugenommen. Dies wird verheerende Auswirkungen haben, da unsere Politik und unsere Gesetze in dieser Angelegenheit völlig uneinheitlich sind."
 TUR_flavor_event.7.a: "Überarbeitung der Gesetze"
 TUR_flavor_event.8.t: "Überfall auf die Gaza-Flottille"
 TUR_flavor_event.8.d: "Zuvor hatten israelische Marinekommandos einen Einsatz gegen mehrere zivile Schiffe durchgeführt, bei dem 9 türkische Staatsbürger an Bord der Mavi Marmara getötet wurden. Die Flottillen waren mit humanitären Hilfsgütern unterwegs, um die israelische Blockade des Gazastreifens zu durchbrechen. Dies entschuldigt jedoch nicht die Tötung unserer Staatsangehörigen, und Israel war sehr zurückhaltend, was Entschädigungen oder Entschuldigungen anbelangt..."
 TUR_flavor_event.8.a: "Fordern Sie Wiedergutmachung UND eine Entschuldigung!"
 TUR_flavor_event.8.b: "Wir haben größere Probleme zu bewältigen."
 TUR_flavor_event.81.t: "Türkei fordert Wiedergutmachung für Überfall auf Gaza-Flottille"
 TUR_flavor_event.81.d: "Die türkische Regierung ist verärgert darüber, dass unsere Kommandos an Bord gegangen sind und Schiffe daran gehindert haben, die Blockade des Gazastreifens zu durchbrechen. Natürlich sind sie die Schuldigen, da wir sie mehrfach gewarnt haben, aber das ist ihnen egal."
 TUR_flavor_event.81.a: "Zahlen Sie die Reparationen und bringen Sie es hinter sich"
 TUR_flavor_event.81.b: "Wir zahlen für nichts"
 TUR_flavor_event.811.t: "Israel zahlt Reparationen"
 TUR_flavor_event.811.d: "Israel has agreed to pay reparations to the victims' families and our state as a result of the unjustified raid against the Free Gaza Movement."
 TUR_flavor_event.811.a: "Reparationen sind nie genug."
 TUR_flavor_event.812.t: "Israel ignoriert unsere Anfrage"
 TUR_flavor_event.812.d: "The Israeli government has rebuffed our demands, saying that we have no say in demanding reparations as we were the ones at fault. This is an outrageous statement, but we will not forget this."
 TUR_flavor_event.812.a: "Unglaublich"
 TUR_flavor_event.9.t: "Erdbeben erschüttert Van"
 TUR_flavor_event.9.d: "Heute früh hatte ein Erdbeben der Stärke 7,1 Van erschüttert. Etwa 11.000 Gebäude wurden beschädigt oder zerstört, mehr als 60.000 Menschen wurden obdachlos und etwa 600 starben. Leider ist dies keine Seltenheit, denn Naturkatastrophen wie Erdbeben sind in unseren östlichen Regionen keine Seltenheit."
 TUR_flavor_event.9.a: "Eine Tragödie"
 TUR_flavor_event.9.b: "Mobilisierung der Katastrophenhilfe"
 TUR_flavor_event.10.t: "Nowruz Protests"
 TUR_flavor_event.10.d: "Kurds across the nation are starting to protest against our government's policies, and they are demanding that we change them to better suit their needs. Obviously they want nothing more but to destroy the Turkish nation, as a lot of these protesters are in favor of the PKK."
 TUR_flavor_event.10.a: "Bereitschaftspolizei in Bereitschaft halten"
 TUR_flavor_event.10.b: "Lass sie protestieren"
 TUR_flavor_event.11.t: "US-Botschaft angegriffen!"
 TUR_flavor_event.11.d: "The U.S. Embassy in Ankara has been attacked by a man wearing a vest strapped with explosives. The attack left the suspect, and one Turkish security guard dead, whilst also damaging the building itself by leaving a giant hole on the side of it. The White House has said that it will have to conduct its own investigations as to why it happened, but this should not have happened in the first place."
 TUR_flavor_event.11.a: "No need for an investigation if they're doing one"
 TUR_flavor_event.11.b: "Einleitung einer eigenen Untersuchung"
 TUR_flavor_event.12.t: "Bergbaukatastrophe in Soma"
 TUR_flavor_event.12.d: "About 2 days ago, a fire was caused by blasting in Soma, at a coal mine. The fire lasted for about 2 days, and rescue missions were mobilized as soon as possible, but were ultimately not very successful due to the thick smoke from the fire. It has been confirmed that about 301 were killed, and luckily, 486 were able to survive. Fingers are being pointed at the inadequate inspections, and officials in charge of inspections."
 TUR_flavor_event.12.a: "Tragisch"
 TUR_flavor_event.12.b: "Protokoll der Überholungsinspektion"
 TUR_flavor_event.13.t: "Bombenanschläge in Ankara"
 TUR_flavor_event.13.d: "A short while ago, 2 bombs were detonated near Ankara Central railway station, leaving 109 civilians dead, and another 500 injured. It appears that the bombs were intended to disrupt a \"Labour, Peace, and Democracy\" rally in Ankara, organized by several groups. Several opposition parties have been blaming our government and our inabilities to prevent the attack, but all we can do for now is make changes where we can."
 TUR_flavor_event.13.a: "Unglücklicherweise"
 TUR_flavor_event.13.b: "Verschärfte Sicherheit"
 TUR_flavor_event.14.t: "Debatte über den Lehrplan"
 TUR_flavor_event.14.d: "Conservatives and conservative groups across the nation are demanding that we remove the concept of evolution from our schools' curriculums. This has worried the secularists in our country, with some even saying that this undermines the very foundation of the nation."
 TUR_flavor_event.14.a: "Entfernen Sie es, welche Beweise haben sie überhaupt?"
 TUR_flavor_event.14.b: "Lächerlich"
 TUR_flavor_event.15.t: "CASA CN 235 stürzt in Isparta ab"
 TUR_flavor_event.15.d: "Vor einiger Zeit befand sich eine CN-235 der Luftwaffe mit zwei Piloten und einem Techniker an Bord auf einem Übungsflug. Aufgrund des dichten Nebels in der Gegend war die Besatzung nicht in der Lage, den Weg richtig zu finden, und stürzte tragischerweise ab, wobei alle an Bord ums Leben kamen."
 TUR_flavor_event.15.a: "Wahrlich bedauerlich"
 TUR_flavor_event.15.b: "Einige Änderungen vornehmen"
 TUR_flavor_event.16.t: "Wissenschaftler errichten eine Basis in der Antarktis"
 TUR_flavor_event.16.d: "A group of our nation's scientists have established a base in Antarctica, marking major scientific progress for our nation!"
 TUR_flavor_event.16.a: "Großartige"
 TUR_flavor_event.17.t: "Kurdische Rechte"
 TUR_flavor_event.17.d: "Liberale Elemente in unserem Land fordern mehr Reformen in Bezug auf die bestehenden kurdischen Gesetze. Sie fordern, diese zu lockern, damit kurdische Parteien leichter an Popularität gewinnen. Aber konservativere Gruppen sagen, dass wir den Status quo im Interesse der Stabilität beibehalten sollten."
 TUR_flavor_event.17.a: "Reformen sind gefährlich"
 TUR_flavor_event.17.b: "Reformen sind notwendig"
 TUR_flavor_event.18.t: "Ein Wandel der Familienwerte"
 TUR_flavor_event.18.d: "Vor kurzem wurde ein neues Gesetz verabschiedet, das es Frauen erlaubt, das Familienoberhaupt zu werden. Während diese Änderung viele Liberale im Lande erfreut hat, hat sie die Konservativen verärgert. Wir haben eine einmalige Chance, dieses Gesetz zu ändern, sei es zum Guten oder zum Schlechten."
 TUR_flavor_event.18.a: "Wir müssen unsere Traditionen bewahren"
 TUR_flavor_event.18.b: "Veränderung ist notwendig"
 TUR_flavor_event.19.t: "Normalisierung der Beziehungen zu Armenien"
 TUR_flavor_event.19.d: "After what seemed like forever, the Armenians are opening up to normalize relations between our two countries. Following the Assassination of Hrant Dink, our relations with Armenia took a nosedive, leading to an unnecessary amount of animosity between our two nations. However recently they have begun to move on from the past, and they are open to normalizing relations once more."
 TUR_flavor_event.19.a: "Sie mögen für eine Normalisierung der Beziehungen offen sein, aber ich bin nicht"
 TUR_flavor_event.19.b: "Tolle Neuigkeiten"
 TUR_flavor_event.20.t: "Transkaspische Gaspipeline"
 TUR_flavor_event.20.d: "After some convincing from the Americans, Turkmenistan has agreed to allow the construction of a subsea gas pipeline stretching from Turkmenbashi to Adana, Turkey. However, many in the government are sceptical, as they argue that the financial burden will ultimately fall on us, which could possibly put our economy at risk."
 TUR_flavor_event.20.a: "Klingt nach einer großartigen Gelegenheit"
 TUR_flavor_event.20.b: "Äh... Nein"
 Turkish_Economy.1.t: "Türkei bietet Investitionen"
 Turkish_Economy.1.desc: "Turkey has offered to build a civilian factory in one of our provinces as long as we let a Turkish company operate and maintain it, they will get some foreign influence from this but we will also benefit in the long run."
 Turkish_Economy.1.a: "Ja"
 Turkish_Economy.1.b: "Nein"
 Turkish_Economy.2.t: "Turkey Offers Investments"
 Turkish_Economy.2.desc: "Die Türkei hat angeboten, in einer unserer Provinzen eine zivile Fabrik zu errichten, sofern wir sie von einem Türken betreiben und warten lassen, was ihnen einen gewissen ausländischen Einfluss verschafft, langfristig aber auch uns zugute kommt."
 Turkish_Economy.2.a: "Ja"
 Turkish_Economy.2.b: "Nein, wir sind keine Freunde."
 Turkish_Economy.3.t: "Türkei bietet Investitionen"
 Turkish_Economy.3.desc: "Die Türkei hat angeboten, in einer unserer Provinzen eine zivile Fabrik zu errichten, sofern wir sie von einem Türken betreiben und warten lassen, was ihnen einen gewissen ausländischen Einfluss verschafft, langfristig aber auch uns zugute kommt."
 Turkish_Economy.3.a: "Ja"
 Turkish_Economy.3.b: "Nein"
