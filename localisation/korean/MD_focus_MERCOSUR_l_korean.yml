l_korean:
 BRA_education_integration: "교육 통합"
 BRA_education_integration_desc: "회원국들이 미래 세대를 교육하는 방식을 서로 맞추기 시작할 때 공동 시장은 더욱 강해집니다. 교육 협력, 상호 인정, 학술 교류는 경제적으로 연결될 뿐 아니라 제도적으로도 호환되는 블록을 만드는 데 도움이 될 것입니다."
 BRA_mercosur_market: "메르코수르 시장"
 BRA_mercosur_market_desc: "제도적 기반이 마련되고 나면 메르코수르는 제한적 조율을 넘어 더욱 야심 찬 목표, 즉 더 깊은 상업적 연계와 폭넓은 투자 흐름, 더 강한 내부 경제적 구심력을 갖춘 시장으로 나아갈 수 있습니다. 이때부터 블록은 힘을 체감하기 시작합니다."
 BRA_inv_assoc: "준회원국 초청"
 BRA_inv_assoc_desc: "우리는 메르코수르의 준회원국들과 가까운 사이입니다. 관계를 더욱 증진하고 이들 경제가 성장할 기회를 주기 위해, 이들을 초청하여 메르코수르의 자랑스러운 정회원으로 맞이해야 합니다."
 BRA_maintain_quo: "메르코수르 공고화"
 BRA_maintain_quo_desc: "확장이 항상 강함은 아닙니다. 기반을 다지지 않은 채 너무 빨리 커지는 블록은 더 커지더라도 더 약해질 위험이 있습니다. 우리는 이미 있는 회원국들의 결속력, 효율성, 내부 안정도를 심화하는 데 집중해야 합니다."
 BRA_expand_to_latin_america: "라틴 아메리카 전역으로 확대"
 BRA_expand_to_latin_america_desc: "대륙 전체를 아직 끌어들일 수 있다면 메르코수르는 현재의 울타리에 머물러서는 안 됩니다. 더 강력해진 제도와 더 매력적인 경제 모델을 바탕으로, 이제 남부 원뿔 지역을 넘어 라틴 아메리카 전역으로 우리의 영향력을 넓힐 수 있습니다."
 BRA_americas_unity: "남아메리카 정상회담"
 BRA_americas_unity_desc: "남아메리카는 국가별 우선순위와 놓친 기회, 반쯤 마무리된 지역 사업 사이에서 너무 오래 분열되어 있었습니다. 우리는 남아메리카 정상회담을 소집하여 대륙 전체의 협력을 재개하고, 메르코수르에 다시 추진력을 불어넣으며, 새로운 지역 구상의 중심에 우리를 세울 것입니다. 통합이 성공하려면 리더십에서 시작해야 합니다."
 BRA_americas_unity_TT: "이를 선택한 국가는 다른 §Y남아메리카 국가§!들과의 §Y관계 변동치§!로 §G+15§!를 얻습니다."
 BRA_mercosur: "메르코수르"
 BRA_mercosur_desc: "메르코수르는 단순한 관세 협정 이상의 것을 제공합니다. 무역과 공동 규칙, 점진적인 지역 영향력 확대를 토대로 한 더 강력하고 더 조율된 남아메리카의 기반을 제공합니다. 우리가 대륙을 이끌고자 한다면 여기서부터 시작해야 합니다."
 BRA_trade_agreement: "무역 협정"
 BRA_trade_agreement_desc: "지역 블록은 상징만으로는 살아남을 수 없습니다. 장벽을 낮추고 상업적 기대를 맞추며 회원국에 눈에 보이는 경제적 이익을 만들어 주어야 합니다. 메르코수르 내 무역 협정을 강화하면 정치적 수사를 실질적 통합으로 바꿀 수 있습니다."
 BRA_discuss_currency: "자국 통화 결제 확대"
 BRA_discuss_currency_desc: "달러에 대한 과도한 의존을 줄이고 역내 무역을 더 안정적이고 유연하게 만들기 위해, 회원국 간 자국 통화 결제의 사용을 확대해야 합니다. 환전 비용 절감과 금융 협력 강화는 더 자율적인 지역 경제를 향한 중요한 걸음이 될 것입니다."
 BRA_people_goods: "사람과 재화의 자유로운 이동"
 BRA_people_goods_desc: "무역만으로는 통합이 완성되지 않습니다. 노동자, 학생, 기업가, 가족이 국경을 더 자유롭게 오갈 수 있을 때 비로소 메르코수르는 시장 이상의 존재가 됩니다. 사람들이 살고, 일하고, 지속적인 유대를 쌓는 지역 공간이 될 것입니다."
 BRA_assoc_members: "가입 절차의 공식화"
 BRA_assoc_members_desc: "준회원 지위는 유용하지만 지역 질서를 미완성으로 남깁니다. 메르코수르가 진정한 정치적, 경제적 블록이 되려면 이웃 국가들이 느슨한 연계에서 정회원으로 옮겨 갈 수 있도록 공식 가입 절차를 마련해야 합니다."
 MER_secretariat_reform: "메르코수르 사무국 개혁"
 MER_secretariat_reform_desc: "더 커진 블록을 즉흥적인 외교만으로 언제까지나 운영할 수는 없습니다. 신규 회원국이 메르코수르를 진지한 기구로 신뢰하려면 행정 핵심을 강화해야 합니다. 더 유능한 사무국은 가입, 조율, 분쟁 관리의 신뢰도를 크게 높일 것입니다."
 MER_infrastructure_corridor_program: "인프라 회랑 계획"
 MER_infrastructure_corridor_program_desc: "도로가 국경에서 끊기고 내륙의 물류가 무너진다면 지역 통합은 의미가 없습니다. 메르코수르는 협정만이 아니라 대륙 전역에서 재화, 자본, 사람을 움직이는 인프라로도 연결되어야 합니다. 더 강한 블록은 선언이 아니라 물리적으로 건설되어야 합니다."
 MER_development_fund: "메르코수르 개발 기금"
 MER_development_fund_desc: "일부 국가는 약속만으로는 설득되지 않습니다. 통합이 눈에 보이는 발전과 실질적인 투자를 가져올 때에만 가입할 것입니다. 메르코수르 개발 기금을 설립하면 가입을 기회로 바꾸고 회원국 지위를 실질적으로 매력적인 것으로 만들 수 있습니다."
 mercosur_member_state_modifier: "메르코수르 회원국"
 mercosur_member_state_modifier_desc: "메르코수르는 브라질, 아르헨티나, 우루과이, 파라과이를 중심으로 한 관세 및 정치 체제로 시작하여, 이후 준회원 제휴를 통해 남아메리카 전역으로 확대되었습니다. 블록에 참여하면 우리의 미래는 무역, 조율, 공동 발전이라는 더 폭넓은 지역 사업과 연결됩니다.\n\n§Y준회원국과 정회원국이 더 많이 가입할수록 이 국가 정신은 더 강해집니다!§!"
 MER_development_fund_round_modifier: "메르코수르 개발 기금 집행"
 MER_development_fund_round_modifier_desc: "메르코수르 개발 기금은 현재 블록 전역의 새로운 민간 및 사무용 건설을 보증하고 있습니다. 이번 집행 회차가 계속되는 동안 경제 개발 사업이 가속적으로 추진됩니다."
 MER_mercosur_diplomacy: "남아메리카 통합"
 MER_mercosur_diplomacy_desc: "메르코수르는 무역을 확대하고 지역 시장 간 유대를 강화하는 틀이며, 우나수르는 정치 대화, 인프라, 안보에 이르는 더 폭넓은 남아메리카 협력의 구상입니다. 이 틀들을 통해 남아메리카의 단결을 강화하고 지역 통합을 한층 진전시킬 수 있습니다.\n\n§Y새로운 회원국이 늘어날 때마다 메르코수르와 우나수르의 국가 정신이 더 강해집니다!§!"
 MER_invite_CHL_full_member: "칠레를 정회원국으로 초청"
 MER_invite_CHL_full_member_desc: "칠레를 준회원국에서 메르코수르 정회원국으로 격상하기 위한 협상을 시작합니다.$MER_full_membership_acceptance_hint_desc$$MER_full_membership_invite_process_desc$"
 MER_invite_PRU_associate: "페루를 준회원국으로 초청"
 MER_invite_PRU_associate_desc: "페루와 메르코수르 준회원국 가입에 관한 공식 회담을 시작합니다.\n\n§Y수락 확률은 해당 국가의 우리에 대한 관계, 우리의 영향력, 그리고 메르코수르 트리의 진행도에 따라 결정됩니다!§!"
