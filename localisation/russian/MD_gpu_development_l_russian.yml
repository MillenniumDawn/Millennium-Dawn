l_russian:
 gpu_development.1.t: "Radeon бросает вызов GeForce"
 gpu_development.1.d_usa: "Через несколько месяцев после того, как GeForce от NVIDIA представила аппаратное преобразование и освещение, ATI готовится представить Radeon — прямой ответ в борьбе за производительность, драйверы и лояльность разработчиков. Конкуренция выводит американскую разработку графических решений на передний край, однако обе компании не имеют собственных фабрик, и каждый новый шаг усиливает их зависимость от нескольких тайваньских контрактных производителей. Вашингтон может сохранить открытыми стандарты графики и федеральные исследования либо сосредоточить поддержку на сильнейших отечественных разработчиках."
 gpu_development.1.a_usa: "Поддержать открытые стандарты и исследования"
 gpu_development.1.b_usa: "Поддержать ведущих разработчиков"
 gpu_development.1.d_can: "ATI Technologies готовится представить Radeon из своей штаб-квартиры в Маркеме, бросая вызов NVIDIA в борьбе за лидерство в производительности, которое GeForce захватила несколькими месяцами ранее. Компания — один из немногих канадских лидеров полупроводниковой отрасли, но конкуренция на переднем крае потребует более широкого доступа к капиталу, производственным мощностям и разработчикам ПО, от которых зависит успех оборудования. Оттава может сохранить независимость ATI как национального разработчика либо встроить её в континентальные цепочки поставок, связывающие канадские разработки с американским капиталом и азиатским производством."
 gpu_development.1.a_can: "Сохранить независимость ATI"
 gpu_development.1.b_can: "Встроить ATI в континентальную цепочку поставок"
 gpu_development.1.d_tai: "Противостояние Radeon и GeForce превращается в новые заказы на производство полупроводниковых пластин на Тайване, где оба разработчика без собственных фабрик зависят от местных контрактных производителей. Растущий рынок графики может расширить клиентскую базу островной индустрии микрочипов либо сосредоточить дефицитные передовые мощности на самых быстрорастущих разработчиках. Тайбэю предстоит решить: сохранить доступ к производству открытым для множества клиентов или заключить долгосрочные контракты с несколькими ключевыми разработчиками."
 gpu_development.1.a_tai: "Расширить доступ к контрактному производству"
 gpu_development.1.b_tai: "Заключить ключевые контракты с разработчиками"
 gpu_development.2.t: "Шейдеры становятся программируемыми"
 gpu_development.2.d_usa: "DirectX 8 и новое поколение графических процессоров заменили фиксированные конвейеры программируемыми вершинными и пиксельными шейдерами. Производители оборудования, игровые студии и разработчики операционных систем теперь соперничают за определение интерфейсов, которые будут формировать графику реального времени."
 gpu_development.2.a_usa: "Стандартизировать интерфейсы шейдеров"
 gpu_development.2.b_usa: "Позволить производителям расширять свои программные стеки"
 gpu_development.2.d_can: "Инженеры ATI, работающие над Radeon, внедряют поддержку программируемых шейдеров в быстро развивающуюся графическую архитектуру. Общие интерфейсы расширят рынок для канадских разработок, а фирменные расширения могут дать ATI временное техническое преимущество."
 gpu_development.2.a_can: "Опираться на общие интерфейсы"
 gpu_development.2.b_can: "Выделить платформу Radeon"
 gpu_development.2.d_jap: "Программируемая графика меняет разделение задач между аппаратным и программным обеспечением у производителей консолей и игровых студий. Японские владельцы платформ могут продвигать переносимые стандарты шейдеров либо сохранить жёстко оптимизированные архитектуры для собственных консолей."
 gpu_development.2.a_jap: "Поддержать переносимые графические стандарты"
 gpu_development.2.b_jap: "Оптимизировать под отечественные консольные платформы"
 gpu_development.3.t: "AMD приобретает ATI"
 gpu_development.3.d_usa: "AMD договорилась о приобретении ATI — сделка объединит процессоры x86, чипсеты и графику в рамках одной компании. Слияние обещает интегрированные вычислительные платформы, но одновременно сокращает число независимых компаний, конкурирующих за графические разработки и производственные мощности."
 gpu_development.3.a_usa: "Сохранить конкуренцию после слияния"
 gpu_development.3.b_usa: "Поощрить интегрированную вычислительную платформу"
 gpu_development.4.t: "CUDA открывает параллельные вычисления"
 gpu_development.4.d_usa: "NVIDIA выпустила CUDA, позволив программистам использовать совместимые графические процессоры для задач далеко за пределами рендеринга. Научные вычисления, моделирование и анализ данных теперь могут задействовать тысячи параллельных потоков, если разработчики готовы работать в программной экосистеме NVIDIA."
 gpu_development.4.a_usa: "Продвигать переносимые стандарты вычислений"
 gpu_development.4.b_usa: "Развивать экосистему CUDA"
 gpu_development.5.t: "AlexNet меняет гонку ИИ"
 gpu_development.5.d_usa: "Убедительный результат AlexNet в ImageNet показал, что крупные нейронные сети, обученные на графических процессорах, способны превзойти устоявшиеся методы компьютерного зрения. Американские лаборатории и технологические компании спешат обеспечить себя ускорителями, наборами данных и специалистами, прежде чем конкуренты смогут воспроизвести прорыв в крупном масштабе."
 gpu_development.5.a_usa: "Сохранить широкий доступ к исследованиям ускорителей"
 gpu_development.5.b_usa: "Масштабировать коммерческие кластеры ИИ"
 gpu_development.5.d_can: "Исследователи Университета Торонто использовали графические процессоры NVIDIA для обучения AlexNet и совершили прорыв в конкурсе ImageNet. Теперь в Канаде сосредоточена необычно высокая концентрация специалистов по машинному обучению, но зарубежные компании уже соперничают за найм команды и коммерциализацию её методов."
 gpu_development.5.a_can: "Расширить государственную исследовательскую сеть"
 gpu_development.5.b_can: "Превратить прорыв в индустрию ИИ"
 gpu_development.6.t: "Тензорные ядра приходят в дата-центры"
 gpu_development.6.d_usa: "Архитектура Volta от NVIDIA представляет тензорные ядра, предназначенные для ускорения матричных операций, используемых в глубоком обучении. Графические процессоры превращаются в специализированные вычислительные системы для дата-центров, повышая спрос на передовые техпроцессы, память с высокой пропускной способностью и тесно интегрированное ПО."
 gpu_development.6.a_usa: "Расширить доступ к ускорителям ИИ"
 gpu_development.6.b_usa: "Сосредоточиться на полноценных платформах"
 gpu_development.6.d_tai: "Ускорителям класса Volta требуются передовые техпроцессы и всё более сложная упаковка. Тайваньские контрактные производители могут рассматривать чипы ИИ как ещё одну категорию клиентов либо зарезервировать дефицитные передовые мощности для самых быстрорастущих разработчиков ускорителей."
 gpu_development.6.a_tai: "Сохранить широкий доступ к передовым мощностям"
 gpu_development.6.b_tai: "Отдавать приоритет стратегическим заказам на ускорители"
 gpu_development.6.d_kor: "Ускорителям ИИ нужна память с высокой пропускной способностью, чтобы тысячи вычислительных блоков постоянно получали данные. Корейские производители памяти могут развивать HBM как открытый отраслевой стандарт либо тесно привязать новые мощности к ведущим платформам ускорителей."
 gpu_development.6.a_kor: "Стандартизировать HBM и расширить поставки"
 gpu_development.6.b_kor: "Заключить долгосрочные партнёрства в сфере ускорителей"
 gpu_development.7.t: "Поставки GPU иссякают"
 gpu_development.7.d_shortage: "Сбои из-за пандемии, резкий рост спроса на электронику и конкуренция за производственные мощности привели к дефициту микрочипов в нашей экономике. Видеокарты, автомобили, серверы и потребительская электроника теперь соперничают за одни и те же ограниченные поставки."
 gpu_development.7.d_resilient: "Сбои из-за пандемии и резкий рост спроса на электронику создали напряжение на мировом рынке микрочипов, однако наши текущие поставки остаются устойчивыми. Дефицит за рубежом всё же служит предупреждением и одновременно даёт возможность заранее обеспечить будущие мощности."
 gpu_development.7.a_usa: "Скоординировать доступ для критически важных потребителей"
 gpu_development.7.b_usa: "Ускорить расширение отечественных мощностей"
 gpu_development.7.a_can: "Защитить исследователей и малых разработчиков"
 gpu_development.7.b_can: "Закрепить континентальные контракты на поставки"
 gpu_development.7.a_tai: "Распределить пластины между большим числом заказчиков"
 gpu_development.7.b_tai: "Ускорить расширение контрактного производства"
 gpu_development.7.a_kor: "Стабилизировать поставки памяти"
 gpu_development.7.b_kor: "Расширить стратегическое производство чипов"
 gpu_development.7.a_chi: "Нормировать импорт для гражданской промышленности"
 gpu_development.7.b_chi: "Ускорить отечественное импортозамещение"
 gpu_development.7.a_jap: "Защитить производство автомобилей и электроники"
 gpu_development.7.b_jap: "Восстановить отечественные полупроводниковые мощности"
 gpu_development.8.t: "Hopper становится двигателем ИИ"
 gpu_development.8.d_usa: "Архитектура Hopper и ускоритель H100 от NVIDIA объединяют Transformer Engine, память с высокой пропускной способностью и высокоскоростные соединения для работы с крупными моделями ИИ. Ускоритель для дата-центров больше не является приспособленной видеокартой — теперь это самостоятельная стратегическая вычислительная система."
 gpu_development.8.a_usa: "Поддержать более широкую экосистему ускорителей"
 gpu_development.8.b_usa: "Масштабировать ведущую полнофункциональную платформу"
 gpu_development.8.d_tai: "Hopper зависит от адаптированного техпроцесса TSMC и передовой упаковки, соединяющей крупные кристаллы процессоров с памятью высокой пропускной способности. Спрос со стороны ИИ превращает как производство пластин, так и линии упаковки в стратегические узкие места тайваньской индустрии микрочипов."
 gpu_development.8.a_tai: "Расширить доступ к передовой упаковке"
 gpu_development.8.b_tai: "Зарезервировать мощности для ключевых заказчиков"
 gpu_development.8.d_kor: "Ускорители класса H100 используют стеки HBM3, ставя корейских производителей памяти в центр цепочки поставок ИИ. Мощности можно расширить для разнообразного рынка либо закрепить через глубокие партнёрства с ведущими поставщиками платформ."
 gpu_development.8.a_kor: "Расширить поставки HBM3"
 gpu_development.8.b_kor: "Отдавать приоритет контрактам со стратегическими платформами"
 gpu_development.9.t: "Расширение вычислительной инфраструктуры ИИ"
 gpu_development.9.d_usa: "Генеративный ИИ вызвал гонку по строительству дата-центров, заполненных передовыми ускорителями. Гипермасштабные компании конкурируют за микрочипы, электроэнергию, сетевое оборудование и квалифицированных специалистов, превращая вычислительные мощности в вопрос национальной промышленной политики."
 gpu_development.9.a_usa: "Сохранить широкий доступ к рынку вычислительных мощностей"
 gpu_development.9.b_usa: "Поддержать стратегическое национальное расширение"
 gpu_development.9.d_can: "Исследовательская база Канады в сфере ИИ и обилие электроэнергии привлекли предложения о создании новых кластеров ускорителей и дата-центров. Такое развитие может расширить доступ для университетов и стартапов либо ещё теснее привязать отечественные кадры к нескольким крупным иностранным платформам."
 gpu_development.9.a_can: "Зарезервировать мощности для открытой исследовательской сети"
 gpu_development.9.b_can: "Использовать ключевые компании для наращивания мощностей"
 gpu_development.9.d_tai: "Спрос на процессоры для ИИ заполнил портфели заказов передовых производств и линий современной упаковки. Тайвань может расширить доступ к этим мощностям для всей полупроводниковой экосистемы либо сосредоточить инвестиции на клиентах, способных финансировать самое быстрое расширение."
 gpu_development.9.a_tai: "Диверсифицировать доступ к передовым мощностям"
 gpu_development.9.b_tai: "Сосредоточиться на быстром расширении контрактного производства"
 gpu_development.9.d_kor: "HBM стала одним из самых жёстких ограничений для производства ускорителей ИИ. Корейским компаниям предстоит решить: расширить квалификацию и поставки для всего рынка либо выделить новые производственные линии под долгосрочных стратегических заказчиков."
 gpu_development.9.a_kor: "Расширить квалификацию и поставки HBM"
 gpu_development.9.b_kor: "Ориентировать производство на стратегических заказчиков"
 gpu_development.9.d_chi: "Спрос на вычислительные мощности ИИ растёт, а доступ к самым передовым зарубежным ускорителям остаётся неопределённым. Отечественным разработчикам, контрактным производителям и изготовителям памяти необходимо выстроить полную цепочку поставок, не рассчитывая, что каждый передовой компонент останется доступным."
 gpu_development.9.a_chi: "Поддержать открытые отечественные стандарты ускорителей"
 gpu_development.9.b_chi: "Сосредоточить ресурсы на национальных лидерах"
 gpu_development.9.d_jap: "Бум ИИ вновь повысил стратегическое значение японских полупроводниковых материалов, производственного оборудования, технологий упаковки и новых фабрик. Скоординированные инвестиции могут связать эти преимущества воедино, но отрасли предстоит выбрать между широким доступом для поставщиков и концентрированной национальной программой."
 gpu_development.9.a_jap: "Укрепить открытую экосистему поставщиков"
 gpu_development.9.b_jap: "Координировать национальную программу расширения мощностей"
 gpu_2000_graphics_market: "Бум рынка графики"
 gpu_2000_graphics_market_desc: "Растущий спрос на новейшие графические ускорители привлекает инженеров и заказы к ведущим разработкам, ускоряя исследования и одновременно создавая напряжение в поставках микрочипов, от которых они все зависят."
 gpu_accelerator_demand: "Спрос на ускорители"
 gpu_accelerator_demand_desc: "Спрос на графические процессоры и ускорители ИИ направляет инвестиции, специалистов и микрочипы в передовые вычисления. Такое расширение поддерживает исследования и развитие дата-центров, одновременно усиливая нагрузку на общий рынок чипов."
 gpu_foundry_expansion: "Расширение контрактного производства"
 gpu_foundry_expansion_desc: "Государственные и частные инвестиции расширяют мощности заводов микрочипов, передовой упаковки и производства памяти с высокой пропускной способностью, чтобы удовлетворить растущий спрос на графические процессоры и ускорители ИИ."