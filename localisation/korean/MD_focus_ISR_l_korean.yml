 full_isr_boycotte: "[ISR.GetNameWithFlag] §O전면§! §Y보이콧§!"
 full_isr_boycotte_desc: "많은 중동 국가들의 [ISR.GetNameWithFlag] 봉쇄는 경제적, 외교적, 군사적 제한의 다양한 형태를 수반했습니다.\n\n[ROOT.GetNameWithFlag]과(와) 같은 국가들은 [ISR.GetNameWithFlag] 항공기에 대한 영공 폐쇄, 무역 금지, [ISR.GetNameWithFlag]의 존립 권리 불인정 등을 통해 [ISR.GetNameWithFlag]을(를) 고립시키려는 노력에 동참합니다.\n\n이러한 행동은 [ISR.GetNameWithFlag]의 경제를 약화시키고 역내 영향력을 제한하려는 §7아랍 연맹§!과 이에 동조하는 중동 국가들의 보다 광범위한 전략의 일부입니다. 봉쇄에는 [ISR.GetNameWithFlag]과(와) 거래하는 기업에 대한 보이콧과 §8팔레스타인§! §G저항§! 운동에 대한 지원도 포함되었습니다."
 pol_isr_boycotte: "[ISR.GetNameWithFlag] §C정치적§! §Y보이콧§!"
 pol_isr_boycotte_desc: "많은 중동 국가들의 [ISR.GetNameWithFlag] 봉쇄는 경제적, 외교적, 군사적 제한의 다양한 형태를 수반했습니다.\n\n[ROOT.GetNameWithFlag]과(와) 같은 국가들은 무역 가능성은 유지하면서 정치적으로만 [ISR.GetNameWithFlag]을(를) 고립시키려는 노력에 동참하며, 때로는 [ISR.GetNameWithFlag]의 존립 권리를 인정하지 않고, [ISR.GetNameWithFlag] 여권을 받아들이지 않으며, 직접적인 정치적 관계를 맺지 않습니다.\n\n이러한 행동은 [ISR.GetNameWithFlag]의 경제를 약화시키고 역내 영향력을 제한하려는 §7아랍 연맹§!과 이에 동조하는 중동 국가들의 보다 광범위한 전략의 일부입니다. 봉쇄에는 [ISR.GetNameWithFlag]과(와) 거래하는 기업에 대한 보이콧과 §8팔레스타인§! §G저항§! 운동에 대한 지원도 포함되었습니다."
 econ_isr_boycotte: "[ISR.GetNameWithFlag] §7경제적§! §Y보이콧§!"
 econ_isr_boycotte_desc: "많은 중동 국가들의 [ISR.GetNameWithFlag] 봉쇄는 경제적, 외교적, 군사적 제한의 다양한 형태를 수반했습니다.\n\n[ROOT.GetNameWithFlag]과(와) 같은 국가들은 정치적 협상의 여지는 유지하면서 [ISR.GetNameWithFlag] 항공기에 대한 영공 폐쇄, 무역 금지, 투자 프로젝트 불참 등을 통해 [ISR.GetNameWithFlag]을(를) 고립시키려는 노력에 동참합니다.\n\n이러한 행동은 [ISR.GetNameWithFlag]의 경제를 약화시키고 역내 영향력을 제한하려는 §7아랍 연맹§!과 이에 동조하는 §7중동 국가들§!의 보다 광범위한 전략의 일부입니다. 봉쇄에는 [ISR.GetNameWithFlag]과(와) 거래하는 기업에 대한 보이콧과 §8팔레스타인§! §G저항§! 운동에 대한 지원도 포함되었습니다."
