 Continental_system: "大陆体系"
 Holy_league: "神圣联盟"
 world_revolution_commune: "世界革命公社"
 FRA_PS: "社会党"
 FRA_PS_desc: "在弗朗索瓦·密特朗领导下的埃皮奈代表大会上重建的社会党，超越共产党成为法国左翼的主导力量，此后一直与共和右翼轮流执政。我们的支持者基础广泛，遍布各个阶层，重返爱丽舍宫只是时间问题。"
 FRA_UDF_LREM: "中间派联盟"
 FRA_UDF_LREM_desc: "法国民主联盟成立于1978年，旨在支持瓦莱里·吉斯卡尔·德斯坦，它并非单一政党，而是由自由主义者、基督教民主主义者和激进派组成的联盟。在过去二十年中，我们一直处于次要地位，如今我们决心建立一个能够独立执政的中央政府。"
 FRA_LR: "共和党右翼"
 FRA_LR_desc: "戴高乐主义右翼与法兰西第五共和国同龄，自1995年以来一直执掌总统职位，但一次失败的解散谈判让我们付出了惨痛的代价，并将一位社会党人送入了马蒂尼翁宫。我们必须巩固中右翼阵营，以免被两翼的对手超越。"
 FRA_RPF: "保卫法兰西联盟"
 FRA_RPF_desc: "夏尔·帕斯夸和菲利普·德·维利耶于1999年创立了“保卫法兰西联盟”，该联盟由戴高乐主义者组成，他们认为主流右翼对布鲁塞尔过于妥协。如今我们的影响力虽小，但欧盟做出的每一项让步都会为我们招募新成员。"
 FRA_FN: "国民阵线"
 FRA_FN_desc: "国民阵线于1972年由让-玛丽·勒庞创立，三十年来一直游离于主流政治之外，而其他所有政党都联合起来反对它。这道防线开始出现裂痕，我们决心在它崩溃时做好准备。"
 FRA_LFI: "不屈法国"
 FRA_LFI_desc: "社会党一直忙于讨好中间派，并在自身两大倾向之间摇摆不定，最终走向衰亡。“不屈法国”是唯一真正反对新自由主义秩序的左翼力量，我们绝不会与其妥协。"
 FRA_EELV: "绿党"
 FRA_EELV_desc: "自1984年以来，生态运动一直参与法国大选，但从未被认真对待，我们的支持者也几乎仅限于城市地区。时间是我们无法争取的资源，因此我们必须改变其他政党的立场，或者取而代之。"
 FRA_PCF: "法国共产党"
 FRA_PCF_desc: "法国共产党随着它所依附的苏联而垮台，而我们的工人阶级基础正在向极右翼或弃权方向倾斜。扭转这种颓势是我们摆在眼前的全部任务。"
 FRA_friend_eu: "与欧盟为友"
 FRA_friend_eu_desc: "欧盟由许多与我们类似的政党领导的国家组成。我们应该利用这种意识形态上的趋同性，凸显我们亲欧的立场，以此作为抵制民族主义的堡垒。"
 FRA_eternal_challenge: "永恒的挑战者"
 FRA_eternal_challenge_desc: "几十年来，我们是唯一一个在街头和议会中都为捍卫工人权益而战的政党。我们的敌人很明确：右翼和极端分子。人民知道他们可以信任我们，我们会挺身而出对抗他们。我们的敌人永不停歇，我们必须牢记这一点。团结起来，我们就能震慑任何威胁。"
 FRA_eu_federalism: "欧盟联邦制"
 FRA_eu_federalism_desc: "其他国家必须牢记我们欧盟所代表的价值观：保护这些价值观，发展这些价值观，并在欧洲其他国家中传播这些价值观。"
 FRA_let_industry: "让工业离开"
 FRA_let_industry_desc: "重工业浪费时间和能源；在像我们这样的全球化经济中，它的生产力已经不足。我们绝不能阻碍它向世界新兴工业中心转移。相反，我们应该将注意力转向一种新的经济形式：服务业。未来几年，办公场所将成为我们关注的重点。通过优先发展办公场所，我们可以降低失业率，并提高其创造的收入。"
 FRA_finance_minister: "新经济政策"
 FRA_finance_minister_desc: "在一个正在经历变革的世界里，我们也必须与时俱进，转变经济重心。经济危机凸显了凯恩斯主义经济学的局限性，因此我们必须改变思维方式。相应地，我们必须为金融领域选择下一个经济方案。这将使我们能够削减开支，但唯一的问题是，我们能信任谁。"
 FRA_atlantist_drift: "大西洋主义偏离"
 FRA_atlantist_drift_desc: "北约是目前世界上最强大的联盟。如果我们想保持这种地位，就必须加强军队的训练。"
 FRA_greece_eurozone: "希腊在欧元区"
 FRA_greece_eurozone_desc: "希腊的债务问题众所周知。我们可以提供一些资金援助，以此向他们表明欧盟成员国之间确实存在相互关怀。"
 FRA_tax_evasion: "打击逃税"
 FRA_tax_evasion_desc: "太多人继续通过各种手段逃避纳税；我们必须制止这种行为，因为我们已经承诺要这样做。"
 FRA_liberal_turn: "自由主义转向"
 FRA_liberal_turn_desc: "长期以来，我们一直试图控制经济和金融领域，但在全球化的世界里，控制资本流动变得越来越困难。因此，我们应该让市场自我调节。这能有什么问题呢？"
 FRA_ease_interventionism: "缓解干预主义"
 FRA_ease_interventionism_desc: "我们应该专注于改善与欧洲的外交关系，而不是派人去打他国的仗。欧洲目前是一个和平的大陆，作为重要的地区强国，我们应该为所有人树立榜样。"
 FRA_modern_interest: "现代兴趣"
 FRA_modern_interest_desc: "长期以来，我们一直把时间浪费在维护一个不思进取、永远处于危机中的阶层上。现在是时候展望未来了，而未来在于服务业和科技。"
 FRA_cut_with_unions: "与工会切割"
 FRA_cut_with_unions_desc: "工会对我们国家的作用已不如以往。我们不应再屈服于他们的要求；毕竟，我们不是他们的人质。"
 FRA_vigipirate: "加强安保"
 FRA_vigipirate_desc: "法国国家安全警戒计划计划将作为我们的国家安全和反恐预警系统。它旨在建立一个常设机制，汇集政府、武装部队、地方当局和公民的力量，以预测、预防和保护我们的国家免受恐怖主义威胁。"
 FRA_not_done: "我们还没完成"
 FRA_not_done_desc: "4月21日是一场前所未有的耻辱。我们的候选人在第一轮就被淘汰，共和国被迫在右翼和极右翼之间做出选择。然而，激进分子并未就此罢休，各派系仍在继续集会，而那些转向极左翼的选民也无处可去。我们从基层开始重建，并与我们疏远的工会达成和解。"
 FRA_meet_friends: "与朋友聚会"
 FRA_meet_friends_desc: "现在正是与其他社会主义国家举行会议，讨论当前世界形势和社会主义道路的好时机。"
 FRA_turn_ecology: "转向生态"
 FRA_turn_ecology_desc: "绿党不会在下次立法选举中无条件地为我们让路，而这个代价就写在核反应堆上。总共24座核反应堆，费森海姆核反应堆是第一座，到本十年末，我们一半的电力结构都将因此受损。法国总工会的能源联盟已经明确表明了他们的立场。我们必须决定，为了这个联盟，是否值得付出如此代价。"
 FRA_military_coop: "军事合作"
 FRA_military_coop_desc: "在与北约密切合作的基础上，我们应该邀请其他国家与我们开展联合军事训练。这将使各方受益，也能向我们的敌人展示我们的团结和战备状态。"
 FRA_party_unity: "党的团结"
 FRA_party_unity_desc: "每届国会的结局都一样。各方争论三天，谁也不肯让步，然后连夜起草一份综合动议，好让各方都能宣称胜利。兰斯会议差点因为四十二票的差距而分裂。团结是可能的，但需要用各部委和秘书处来换取，而最终的代价永远是裙带关系。"
 FRA_strenght_throught_EU: "通过欧盟加强"
 FRA_strenght_throught_EU_desc: "欧盟代表着民主价值观，我们也一样。这足以成为我们维护欧盟生存、强大和稳定的理由。如果欧盟解体，欧洲可能再次分裂。"
 FRA_stole_voter: "与我们的选民重新建立联系"
 FRA_stole_voter_desc: "米尼尔盆地和米迪地区曾是我们的领地一个世纪，如今却成了极右势力最安全的堡垒。对那些选民进行说教毫无作用。如果我们想让他们重新回到我们手中，就必须拿出真本事：重新点燃煤矿，重新开放矿井，公开做出工业承诺。做出承诺，并且要信守承诺，因为违背承诺将使我们失去这片地区长达一代人的时间。"
 FRA_ps_lgbt: "确保LGBT权利"
 FRA_ps_lgbt_desc: "公民团结协议从来都只是权宜之计。婚姻、收养、法律面前人人平等：这才是选民期待的改革，也是右翼承诺要在街头抗争的目标。“人人游行”已经预定了战神广场。我们可以全盘接受这项法律，也可以对其进行删减，以维护和平。"
 FRA_ps_win: "社会主义得救了"
 FRA_ps_win_desc: "我们成功了！我们创造了奇迹。在险些崩溃、在法国和历史面前遭受耻辱性失败之后，我们成功扭转了局面。我们的对手以为我们已经完了，但我们赢回了选民的支持，并引导他们远离了极端主义的诱惑。我们的胜利是社会主义在世界范围内保持稳定的标志。但这仅仅是个开始；有了这次经验，我们绝不会重蹈覆辙。"
 FRA_Neither_right_nor_left: "既非右翼也非左翼"
 FRA_Neither_right_nor_left_desc: "发展我们国家的最佳途径是远离分裂性政治。让我们占据中间立场，既不走极端右翼，也不走极端左翼。"
 FRA_Get_indecisives: "优柔寡断"
 FRA_Get_indecisives_desc: "既非左翼也非右翼。在这个国家，有些选民从未找到过值得他们前往投票站的政党，而成千上万的志愿者愿意敲开他们的家门，询问他们的诉求。“大游行”将把他们从两大传统政党中同时吸引过来。但它不会给我们带来一个单一的地方联盟。"
 FRA_abolish_ISF: "废除巨额财富税"
 FRA_abolish_ISF_desc: "对财富征收的团结税收入甚微，却导致大量资金外流。三十年来，资本纷纷流向布鲁塞尔和日内瓦，而税收收入从未弥补这种外流。我们用仅对财产征税来取代它。资金终将回流。同时，直到下次选举，所有新闻标题上都会出现“我们为富人服务”的指责，这种指责也将不复存在。"
 FRA_Fight_Deficit: "对抗赤字"
 FRA_Fight_Deficit_desc: "我们的债务很高。无论付出多大的代价，我们都必须努力偿还债务，否则我们将被无力偿还的债务淹没。人民一定会理解这些必要的行动。"
 FRA_Reconize_Mistakes: "承认过失"
 FRA_Reconize_Mistakes_desc: "法国以往的统治者对待殖民地国家极其不公。我们必须为他们的行为付出代价，才能最终拨乱反正。让这段历史就此翻篇吧。"
 FRA_Western_policy: "西方政策"
 FRA_Western_policy_desc: "欧盟和大西洋联盟才是维护欧洲大陆安全的根本，否认这一点对我们毫无益处。与盟友更紧密的合作能够提升我们在布鲁塞尔的影响力，赢得华盛顿的好感。同时，这也为主权主义者，无论是戴高乐主义者还是民族主义者，提供了他们一直以来梦寐以求的论据：共和国已经沦为附庸国。"
 FRA_independant_Euro: "独立的欧洲"
 FRA_independant_Euro_desc: "其他国家必须明白，在一个团结的欧洲内部，我们不会寻求对它们的稳定施加过大的影响。单独行动时，我们中的一些国家或许会比较脆弱，但团结起来，我们一定足够强大，能够克服这些问题。"
 FRA_reduce_tax: "减税"
 FRA_reduce_tax_desc: "住房税对那些最无力承担的家庭打击最大，而就业补贴已经展现了救济措施对招聘的积极作用。我们将逐步取消这项税收。各市镇将失去财政收入来源，因此国家必须从巴黎拨款进行补偿，届时法国所有市长都会就此事致函我们。"
 FRA_increase_pension_age: "提升养老金年龄"
 FRA_increase_pension_age_desc: "人们或许不喜欢这样，但随着医学的突破性进展导致预期寿命延长，我们必须继续为社会福利体系提供资金。然而，由于年轻人越来越少，无法满足日益增长的老年人口的养老金需求，我们别无选择。我们必须让劳动人口延长工作年限，以弥补人口更替的不足。"
 FRA_growing_tensions: "日益紧张的局势"
 FRA_growing_tensions_desc: "我们的世界正变得越来越不安全，欧洲或许会重燃战火。为了避免措手不及，我们必须做好准备。"
 FRA_befriend_china: "对华示好"
 FRA_befriend_china_desc: "中国是法国主要贸易伙伴；与他们谈判有利的条约非常符合我们的利益。"
 FRA_nuclear_eu: "欧盟核武器化"
 FRA_nuclear_eu_desc: "五十六座反应堆，布鲁塞尔却无人愿意称它们为绿色能源。能源分类标准正在制定中，如果核能被排除在外，我们整个核电站群在纸面上就成了累赘。柏林和维也纳会与我们对抗，布拉格、华沙和赫尔辛基则不会。我们建立联盟，赢得投票，并接受德国会铭记于心的事实。"
 FRA_reise_tertiary: "第三产业的兴起"
 FRA_reise_tertiary_desc: "当今西方经济是以服务业为主的经济，它将生产过程中涉及的各个参与者聚集在一起。法国必须在这一经济转型中发挥作用；别无他法。"
 FRA_reduce_public_service: "减少公共服务"
 FRA_reduce_public_service_desc: "削减政府开支将使我们能够再次降低债务。人们会对此感到不满，但我们必须做出两害相权取其轻的选择。如果国家因债务而崩溃，那么社会支出减少对他们来说反而是最不重要的问题。"
 FRA_strat_indus: "为我们的战略产业注资"
 FRA_strat_indus_desc: "尽管我们的产业竞争力已不如以往，但有些产业我们却不可或缺。国防工业便是其中之一，因为我们不能依赖其他国家来保障自身安全。法国历来坚持自主生产武器。因此，尤其是在当今世界局势日益紧张的背景下，保持自主生产至关重要。"
 FRA_arms_deal: "增加武器出口"
 FRA_arms_deal_desc: "众所周知，我们的军工复合体生产精良的武器。因此，多年来我们一直是世界领先的武器出口国之一。军火贸易不仅使我们能够在国际上展现实力，还能为我们带来巨额财富和巨大影响力。因此，这无疑是一件好事。"
 FRA_eu_mil: "协助欧盟军事建设"
 FRA_eu_mil_desc: "虽然我国已做好充分准备应对欧洲战火重燃，但我们的欧洲伙伴国并非如此。他们中的大多数根本没有抵抗的能力。我们应该帮助他们提升自身能力，因为他们的安全就是我们的安全。"
 FRA_finance_student: "金融专业最佳学生"
 FRA_finance_student_desc: "通过完美地运用新自由主义模式，我们的经济从未像现在这样紧密地融入国际格局。这是一件好事，因为它将使我们能够受益于其他国家的发展，并在世界各地进行投资以获取回报。"
 FRA_right_left_money: "中心"
 FRA_right_left_money_desc: "长期以来，我们的国家一直受制于左右之争。在金融和地缘政治领域取得长足进步之后，我们已经展现了秩序自由主义的力量。我们的职责是促进法国市场繁荣发展，并让法国人民从中受益。"
 FRA_demograph_arms: "促进人口重新武装"
 FRA_demograph_arms_desc: "一项良好的人口增长计划是对我们国家未来的长期投资。"
 FRA_share_eu: "与欧盟分享我们的力量"
 FRA_share_eu_desc: "我们的敌人必须明白，我们捍卫欧盟成员国独立是极其认真的。如有必要，我们将用核武库威胁任何压迫者。"
 FRA_handle: "处理这种情况"
 FRA_handle_desc: "他们最初是为了燃油税而来，却为了其他一切而留下。环岛被占领，香榭丽舍大街两次被烧毁，闪光弹袭击让我们既损失了眼球，也占据了新闻头条。我们可以通过反暴乱法，用武力驱散他们，也可以开启一场全国性的辩论，用我们根本没有的100亿欧元来换取和平。"
 FRA_startup_nation: "创业之国"
 FRA_startup_nation_desc: "凭借我们大胆的政策和面对这些桀骜不驯的高卢人毫不退缩的决心，我们实现了目标。我们改变了一个曾经敌视创业的社会，使其摆脱了束缚创业的税收和监管。一个充满创新和自由的美好未来就在前方。这就是我们的愿景。"
 FRA_Neo_gaulism: "新戴高乐主义"
 FRA_Neo_gaulism_desc: "新戴高乐主义是法国的一场政治运动，它沿用了夏尔·戴高乐将军的原始原则。他强调国家主权、强有力的总统行政权力以及外交政策独立性，以适应现代全球化时代。"
 FRA_known: "不可避免的派对"
 FRA_known_desc: "自第三共和国成立、共和政体趋于稳定以来，保守派一直存在。我们只不过是他们最新的化身。几十年来，我们始终参与每一届选举的第二轮投票。下一次选举也理应如此。新千年充满变数，因此我们必须在极端主义的冲击下，成为稳定与理性的代言人。"
 FRA_oppose_immigration: "反对移民"
 FRA_oppose_immigration_desc: "移民已经证明了他们可能带来的危险，尤其是来自战乱地区的移民。我们必须采取行动阻止他们入境。"
 FRA_continue_liberal: "继续推行自由主义政策"
 FRA_continue_liberal_desc: "我们将继续推行经济自由化政策，因为这才是经济运行的最佳方式。"
 FRA_patriotism: "爱国主义"
 FRA_patriotism_desc: "法国人应该为自己的民族身份和历史感到自豪。因此，他们必须学会减少对国家的依赖。我们再也负担不起过去的慷慨。他们必须学会与国家站在一起，停止不断索要更多的公共资金。"
 FRA_turn_west: "转向西方"
 FRA_turn_west_desc: "我们应该改善与美国海外朋友的关系。他们的政治人物可能会更迭，但我们必须确保他们永远不会背弃法国。"
 FRA_third_voice: "法国第三声音"
 FRA_third_voice_desc: "在北约和苏联残余势力依然分裂的世界里，法国必须像以往一样，走出自己的道路。我们不能依赖一个遥远的盟友，一个不会在我们需要时伸出援手的人；因此，我们必须与那些拒绝来自东方或西方压迫的人们携手，共同缔造自己的命运。"
 FRA_austerity: "运用紧缩政策"
 FRA_austerity_desc: "赤字是结构性的，评级机构正在密切关注。我们尽可能地削减开支：每两名公务员退休就替换一名，合并部委，推迟建设项目。工会会直言不讳地指出问题的本质，并在退休年龄之际组织百万人走上街头，而左翼人士则会花费十年时间来反对这项决定。"
 FRA_question_ref: "加速欧洲一体化"
 FRA_question_ref_desc: "尽管法国是欧盟的创始成员国之一，但如今法国民众对欧盟却抱有最强烈的怀疑态度。法国人屡次反对签署新的条约。我们应该停止就每一个问题征求他们的意见，因为这会严重拖慢欧洲一体化的进程。许多人会对此感到不满，甚至更加反对欧盟，但至少我们不会再成为阻碍欧盟发展的力量。"
 FRA_nato_integration: "北约整合"
 FRA_nato_integration_desc: "这是提升欧洲大陆安全的又一举措。如果没有北约，谁知道今天的欧洲会是什么样子。"
 FRA_national_indep: "国家独立"
 FRA_national_indep_desc: "通过采取介于东西方之间的立场，法国可以捍卫自己的利益，而不必再考虑华盛顿官僚的观点。"
 FRA_end_proximity_police: "终止社区警察"
 FRA_end_proximity_police_desc: "警察不应该与他们应该监视的人混为一谈。组建一支快速反应警队会更具成本效益。"
 FRA_reform_wealth: "改革福利国家"
 FRA_reform_wealth_desc: "法国长期以来一直是一个福利国家；现在是法国人自力更生、不再总是依赖公共资金的时候了。"
 FRA_looming_crisis: "迫在眉睫的危机"
 FRA_looming_crisis_desc: "今年一月，法国兴业银行发现，一名交易员在无人察觉的情况下，让该行损失了近50亿欧元。这便是警示。美国的抵押贷款市场情况更糟，我们的银行也深受其害，德克夏银行已经陷入困境。我们现在可以建立监管机制，但这样做会拖慢经济增长；或者，我们也可以相信经济周期，寄希望于它。"
 FRA_defend_interest: "捍卫法国的利益"
 FRA_defend_interest_desc: "独立意味着我们必须保护自己免受外国影响，无论是在本国还是在我们拥有利益的任何地方。我们必须朝着这个方向采取措施，以确保法国继续保持伟大国家的地位。"
 FRA_lower_expanse: "停止资助低效企业"
 FRA_lower_expanse_desc: "补贴经济活动的成本日益显著。我们应该认真审视支出，只补贴那些高效且具有竞争力的产业。"
 FRA_oppose_lgbt: "反对觉醒主义"
 FRA_oppose_lgbt_desc: "日益敌视传统规范的思想潮流正在渗透到我们的社会中。这些规范的存在自有其道理，并且一直以来都占据主导地位。我们必须阻止这种渗透。"
 FRA_return_rurality: "拥抱乡村生活"
 FRA_return_rurality_desc: "大城市正日益成为颓废和犯罪的温床。我们必须鼓励公民远离这些城市，迁往那些虽然不那么繁荣，但更符合常理的地区。"
 FRA_end_assisted: "终结依赖文化"
 FRA_end_assisted_desc: "我们社会中太多的人依赖于不劳而获的无条件福利。这种情况令人无法接受，也给我们的财政造成了巨大压力。我们必须终止这些福利；这才能促使人们就业。"
 FRA_hostile_bear: "对熊的敌意"
 FRA_hostile_bear_desc: "俄罗斯再次对欧洲的利益和安全构成威胁。一线国家必须开始做好准备，以应对来自东方的任何敌对行动。"
 FRA_wake_up: "唤醒法国"
 FRA_wake_up_desc: "摆脱了颓废和无所作为的诱惑，法国人民可以重新投入工作。"
 FRA_eternal_france: "永恒的法国"
 FRA_eternal_france_desc: "我们使国家比以往任何时候都更加强大。我们加强了抵御外敌入侵的能力，减少了内部问题，降低了债务负担。我们为国家的未来奠定了基础。法国过去一直与我们同在，将来也永远如此。"
 FRA_enought_soc: "够了，社会主义"
 FRA_enought_soc_desc: "作为保守党，进步党和社会党是我们的主要对手。他们鼓吹自由主义的欧洲，而这恰恰是人民不再想要的，我们将努力摆脱这种束缚。我们必须向人民证明，我们现在是，将来也永远是实现他们对稳定和安全渴望的工具。我们反对自由主义的欧盟和进步主义。"
 FRA_sovereignism: "质疑我们的主权"
 FRA_sovereignism_desc: "长期以来，法国人民的意愿一直被忽视；我国没有人希望欧盟扩张到如此规模。无论是条约还是扩张，人民每次都持怀疑态度，而每次他们的意见都被置之不理。现在是时候让某个政党再次提出法国主权问题了。"
 FRA_sacrifice: "必要的牺牲"
 FRA_sacrifice_desc: "我们正在进入困难时期，前面的困难道路需要法国人民的纪律和善意。法国人必须再次认识到，他们应该为法国做出牺牲，而不是相反。"
 FRA_elder_view: "我们长者的观点"
 FRA_elder_view_desc: "全国抵抗委员会为从二战废墟中重建我们的国家做出了巨大贡献，但也因此使我国沦为美国的附庸。然而，几十年来，他们的努力却被政客们逐渐破坏，而且一个比一个自由派。我们必须回归本源，效仿将军的榜样，投资工业，着手重建我们这个被数十年的欧洲一体化和去工业化摧残的国家。"
 FRA_neccesity_leaving: "离开的必要性"
 FRA_neccesity_leaving_desc: "我们脱离欧盟的征程才刚刚开始。我们必须让人们明白，我们必须在为时已晚之前离开这个欧洲。"
 FRA_fight_renouncement: "对抗放弃继承权的支持者"
 FRA_fight_renouncement_desc: "这位将军不相信其他欧洲列强有决心建立一个独立于美国的欧洲。他的判断是正确的：在他去世几十年后，我们的伙伴们更关心的是如何对美国卑躬屈膝，从美国购买装备，而不是致力于欧洲的独立。我们必须谴责这种恶性循环，这已经足以成为我们离开这个沦为美国附庸的欧洲的理由。"
 FRA_back_gaulism: "战略戴高乐主义"
 FRA_back_gaulism_desc: "法国必须奉行独立于华盛顿意志的外交政策。我们绝不允许任何人干涉我们的政治，尤其是美国，它一直试图强迫我们屈服。"
 FRA_social_gaulism: "社会戴高乐主义"
 FRA_social_gaulism_desc: "面对幸福全球化的终结和极端主义的诱惑，我们必须引导法国人民回到理性的道路上。社会戴高乐主义拒绝资本主义和共产主义。它涉及国家干预以保证就业的独立性和安全性。有了这种稳定，人民就不需要所有这些福利支持。"
 FRA_return_nation: "回归国家"
 FRA_return_nation_desc: "我们必须鼓励在海外经营的法国公司通过一切必要手段返回其原籍国。"
 FRA_anti_eu: "反对欧盟的运动"
 FRA_anti_eu_desc: "现在人们开始意识到欧盟已不再服务于其创始者的利益，反而试图削弱他们的身份认同，我们可以加大反对欧盟的力度。我们必须让民众明白，他们的大部分问题都源于欧盟。"
 FRA_anti_usa: "对美国的敌意"
 FRA_anti_usa_desc: "美国对戴高乐主义的复辟深恶痛绝。他们的担忧不无道理；我们的崛起很快就会让他们明白，我们不再是他们的盟友。毕竟，众所周知，美国没有真正的盟友；它最看重的是自身的利益。"
 FRA_RPF_death: "恢复死刑"
 FRA_RPF_death_desc: "死刑在几十年前被废除，这违背了大多数法国民众的意愿。自那以后，形形色色的罪犯都变得更加肆无忌惮，他们笃信国家永远不会真正惩罚他们。一个主权国家必须能够最大限度地执行自己的法律。我们将恢复死刑。"
 FRA_destroy_liberalism: "摧毁经济自由主义"
 FRA_destroy_liberalism_desc: "长期以来，我们的经济政策一直被令人憎恶的极端自由主义所主导。我们的公民眼睁睁地看着自己的工作岗位和工业实力一个个消失。早在那个时代，这位将军就警告说，从人性的角度来看，资本主义是一件坏事。我们必须回归国家干预。我们必须恢复公共财政秩序，并重振我们残存的经济体系。"
 FRA_campaign_frexit: "法国脱欧运动"
 FRA_campaign_frexit_desc: "法国人终于意识到欧盟是个坏东西；现在我们只需要给他们一个发泄愤怒的途径。只需要一张选票就能阻止法国的分裂。"
 FRA_rebalance_foreign_policy: "重新平衡我们的外交政策"
 FRA_rebalance_foreign_policy_desc: "尽管我们已明确表明脱离美国的意图，但我们的政治阶层仍然深受美国政治、生活方式和企业的影响。我们必须向那些可能认为我们与美国决裂并非真心实意的人发出强烈的信号。我们将与那些始终反对美国霸权的国家重新建立对话。"
 FRA_leave_nato: "与北约决裂"
 FRA_leave_nato_desc: "为了捍卫我们的独立，我们必须摆脱一个我们从未需要过、也几乎没给我们带来任何好处的联盟。我们完全有能力独立捍卫自身利益。"
 FRA_frexit_ref: "脱欧公投"
 FRA_frexit_ref_desc: "现在是时候彻底退出欧盟了。我们的人民已经做好了彻底决裂的准备。"
 FRA_strategic_autonomy: "确保战略自主性"
 FRA_strategic_autonomy_desc: "我们成功恢复了法国的独立；在这个世界上，我们可以自由行事。法国强大而自由，我们随时准备捍卫它。"
 FRA_strong_people: "强者"
 FRA_strong_people_desc: "不再有懒惰的动机；资本主义置于国家控制之下。我们与人民重申了社会契约。他们知道我们会保护他们，他们也应该服从我们，对我们保持善意。"
 FRA_recover: "重建经济"
 FRA_recover_desc: "尽管我们为退出欧盟做了诸多准备，但我们的经济仍然遭受了重创。我们必须先在坚实的基础上重建经济，才能考虑如何向压迫者复仇。"
 FRA_our_own_sphere: "我们自己的领域"
 FRA_our_own_sphere_desc: "我们并非唯一成功摆脱美国帝国主义的国家。我们可以找到盟友，在独立大国之间建立基于相互尊重的联盟。"
 FRA_paid_reconnexion: "封锁欧洲"
 FRA_paid_reconnexion_desc: "既然我们已经安全顺利地脱离了欧盟，现在就可以开始考虑如何反击它了。欧盟及其网络需要经过我们的国家。这为我们提供了一个绝佳的复仇机会。"
 FRA_certain_idea: "法国的某种形象"
 FRA_certain_idea_desc: "短短几年，我们就成功地让法国恢复了它应有的模样：一个骄傲而自由的大国。将军若在世，定会为我们重拾他的遗志而感到骄傲。他是对的：法国只有成为大国才能成为大国；否则，它就不是法国了。"
 FRA_salvage_mondialisation: "拯救全球化的受害者"
 FRA_salvage_mondialisation_desc: "我们的人民因全球化而遭受了巨大的苦难。尤其对于劳动人口而言，更是如此。他们眼睁睁地看着自己的工作消失，国家分崩离析，价值观被践踏。我们必须向他们证明，我们才是能够带来变革的一方，我们敢于提出正确的问题，并且我们拥有解决这些问题的简单方案。"
 FRA_raise_tariff: "提高关税"
 FRA_raise_tariff_desc: "提高关税将使我们能够结束来自国外的不公平竞争，并让法国民众能够购买法国制造的产品。"
 FRA_dynamise_periph: "振兴郊区"
 FRA_dynamise_periph_desc: "农村和郊区长期以来都被规划政策所忽视。这些地区投资不足，居民往往生活困苦，但却充满善意。我们必须帮助他们获得与大城市居民相同的基础设施。"
 FRA_focus_insecurity: "关注不安全感"
 FRA_focus_insecurity_desc: "移民导致我国安全形势显著恶化。我们必须向民众表明，我们高度重视这一问题，具体措施包括增加警力、加强管控以及严厉打击犯罪。"
 FRA_eurosepticism: "威胁欧盟"
 FRA_eurosepticism_desc: "欧盟一直试图压制像我们这样反对其极端全球化政策的国家。我们必须让他们明白，情况必须改变，我们可以在法国重燃疑欧运动。"
 FRA_sovergnism_policies: "主权主义政策"
 FRA_sovergnism_policies_desc: "法国必须加强对自身经济、外交政策，尤其是边境的控制。否则，我们为使国家重回正轨所做的努力将付诸东流。我们必须坚定地行使国家治理权。"
 FRA_economical_patriotism: "经济爱国主义"
 FRA_economical_patriotism_desc: "我们必须敦促已迁往海外的法国公司返回法国。如果他们拒绝，他们在法国的业务运营将受到影响。"
 FRA_social_populism: "社会民粹主义"
 FRA_social_populism_desc: "我们只需要满足人民的诉求，并严厉打击他们憎恨的人，就能巩固我们的选民基础，确保我们继续执政。"
 FRA_criticize_eu_migrant: "批评欧洲移民政策"
 FRA_criticize_eu_migrant_desc: "欧盟在阻止移民潮方面做得不够，反而强迫成员国接收他们。我们必须施加压力，制止这种做法。"
 FRA_common_accord_eu: "与欧盟达成协议"
 FRA_common_accord_eu_desc: "欧盟委员会已经意识到它不能忽视我们。现在我们必须让它明白，满足我们的要求就能赢得我们的支持。"
 FRA_reinforce_nuke: "加强我们的核能力"
 FRA_reinforce_nuke_desc: "核能的可靠性已得到证明。既然我们掌握了这项技术，为何还要转向其他能源？我们必须扩大核能产能，以应对危机。"
 FRA_FN_death: "恢复死刑"
 FRA_FN_death_desc: "死刑废除已有数十年，但暴力犯罪却愈演愈烈。我们的公民理应在自己的国家重获安全感。我们将恢复死刑，最严重的罪行也将再次受到最严厉的惩罚。"
 FRA_reject_immigration: "拒绝移民"
 FRA_reject_immigration_desc: "现在我们对边境的控制力更强了，我们可以实施打击非法移民的政策。"
 FRA_pro_russian_fn: "亲俄政策"
 FRA_pro_russian_fn_desc: "欧盟不会停止极端全球化。我们必须与俄罗斯走得更近，俄罗斯一直设法与西方的歪曲行为保持距离。在一起，我们会走得很远。"
 FRA_oppose_lgbt_fn: "终结觉醒主义"
 FRA_oppose_lgbt_fn_desc: "有些人不应该被允许进入我们的国家。让我们结束这种荒谬的做法，集中精力恢复基于唯一正确家庭模式的秩序。"
 FRA_end_right_soil: "终止土地权"
 FRA_end_right_soil_desc: "出生在法国并不足以使一个人成为法国人。我们必须废除出生地原则；我们有权选择谁可以成为法国公民。"
 FRA_support_rus_claim: "支持俄罗斯宣称"
 FRA_support_rus_claim_desc: "俄罗斯完全有理由对北约的扩张感到威胁。我们必须表明我们愿意帮助他们纠正所遭受的不公正待遇。"
 FRA_electoral_reform: "选举改革"
 FRA_electoral_reform_desc: "法国的选举越来越受到质疑，争议的焦点在于选举制度和政党的代表性。我们可以在推行这些改革的同时，确保它们对我们有利，从而使我们能够继续执政。"
 FRA_our_identity: "我们的身份认同"
 FRA_our_identity_desc: "在欧洲这样的整体中，做一个民族主义者是很难的。我们已经放弃了脱离欧盟的想法，因此我们必须塑造一种新的身份认同，这种认同既要符合我们在欧盟中的地位，又不能使我们在外国劳动力市场中被削弱。"
 FRA_boreal_space: "我们对俄罗斯的立场"
 FRA_boreal_space_desc: "我们已经展现了与俄罗斯合作的意愿，我们的努力也得到了认可。现在是时候决定我们希望从俄罗斯获得什么；是时候与他们接触了。"
 FRA_long_travel: "法国获胜"
 FRA_long_travel_desc: "过去几年执政期间，我们向法国人民证明，只要有决心，一个国家的问题就能迎刃而解。我们让法国变得更加强大，减少了对邻国和移民潮的依赖，并成功遏制了移民潮。"
 FRA_sound_fury: "喧哗与骚动"
 FRA_sound_fury_desc: "法国人民不再想要绥靖政策；温和派让他们失望了，从未带来任何真正的改变。我们是变革的政党；我们必须向法国人民表明，我们决心挑战现有的秩序。"
 FRA_silent_france: "动员未投票者"
 FRA_silent_france_desc: "许多公民已经对我们的共和国及其制度失去了信心。我们必须鼓励他们重返投票站，以实现真正的变革。"
 FRA_end_privatisation: "终止私有化"
 FRA_end_privatisation_desc: "为了提高盈利能力，许多公司持续将生产基地迁出法国。这导致失业率上升，并造成我们专业技术的流失。我们必须止住这种人才流失的局面，必要时必须重新掌控这些公司。"
 FRA_pro_lgbt_lfi: "促进平权行动"
 FRA_pro_lgbt_lfi_desc: "我们必须终结那些偏离所谓“正常”标准的人长期以来所遭受的歧视。我们的社会必须学会接纳所有差异。"
 FRA_toward_6th_rep: "迈向第六共和国"
 FRA_toward_6th_rep_desc: "现在，我们可以开始履行人民赋予我们的最重要的使命了。我们承诺带来变革，他们也必将如愿以偿。现在是时候建立一个适合所有人的新共和国了。"
 FRA_distance_nato_lfi: "拒绝集团政治"
 FRA_distance_nato_lfi_desc: "北约将我们束缚在华盛顿的战争中，正如与莫斯科结盟将我们束缚在莫斯科的战争中一样。我们拒绝加入这两个阵营；真正的不结盟政策才配得上一个独立的法国。"
 FRA_oppose_eu_treaty: "反对欧盟条约"
 FRA_oppose_eu_treaty_desc: "我们的公民被迫接受了不公平的条约。我们没有义务遵守这些条约。要改变这种不公平的欧洲，我们必须首先挑战其立法框架。"
 FRA_guarante_employment: "保障就业"
 FRA_guarante_employment_desc: "我国人才济济，但由于危机导致的就业机会匮乏，他们无法充分发挥自身潜力。我们必须保障人人享有稳定体面的工作；这应当构成任何社会契约的基础。"
 FRA_state_power: "国家权力"
 FRA_state_power_desc: "第五共和国的制度过于以共和国总统办公室为中心。我们应该鼓励公众辩论，让人民决定我们新共和国的样貌。"
 FRA_democracy: "个人自由"
 FRA_democracy_desc: "我国面临的诸多危机引发了关于民众安全的实际问题。监控对于保护公民固然必要，但国家权力究竟可以延伸到何种程度？我们应该允许公民拥有表达意见的权利。"
 FRA_foreign_recognition_lfi: "重塑我们的外交政策"
 FRA_foreign_recognition_lfi_desc: "长期以来，我国一直支持独裁政权，拒绝承认主权国家的存在。我们必须结束这种状况。"
 FRA_oppose_eu_immigration_lfi: "质疑欧盟在移民问题上的立场"
 FRA_oppose_eu_immigration_lfi_desc: "欧盟对极右翼民粹主义者的态度日益宽容。它对需要帮助的邻国援助不足，反而仅仅将它们视为廉价劳动力的来源。我们必须摒弃这种做法，提出更加人道的政策。"
 FRA_economic_question: "经济走向"
 FRA_economic_question_desc: "国家预算及其管理是关乎一切的重要问题。我们的公民也必须就此发表意见。"
 FRA_ho_topic: "解构法国特色"
 FRA_ho_topic_desc: "法国文化中许多固有的法律和习俗不利于其他文化的融入。我们应该鼓励公民讨论少数族裔融入的问题。"
 FRA_balance_tax: "平衡税收"
 FRA_balance_tax_desc: "中产阶级和处境艰难者被税收榨干，而富人却不必缴纳应缴的税款，这是不可接受的。我们必须恢复这种平衡。"
 FRA_climate_war_eco: "新千禧的挑战"
 FRA_climate_war_eco_desc: "环境与气候正在迅速恶化。我们必须保护尚存的生物多样性，并为未来艰难时期做好准备。"
 FRA_dawn_6th_rep: "第六共和国之黎明"
 FRA_dawn_6th_rep_desc: "我们对第六共和国的工作已告完成。无论结果如何，我们的使命已尽。我们或许已在历史上留下了自己的印记。"
 FRA_creolisation: "文化共生"
 FRA_creolisation_desc: "我们国家见证了几个世纪的文化交流，从而塑造了一种新的文化。然而，这种文化被许多人否定；我们必须让我们的公民明白，未来在于共同生活。我们仍有太多东西需要向世界学习。"
 FRA_work_less: "少做精做"
 FRA_work_less_desc: "我们的前任曾执意让法国人在日益恶劣的条件下工作越来越长的时间。我们必须扭转这一趋势，帮助我们的公民更享受他们的工作。如此一来，他们将对自己的工作更加富有创造力和热情。"
 FRA_reform_police: "改革法国警察"
 FRA_reform_police_desc: "长期以来，警察一直被用作对公民进行不公正镇压的工具。我们必须实施必要的改革，以减轻公民的压力，同时确保每个人的安全。"
 FRA_post_empire: "去殖民化外交"
 FRA_post_empire_desc: "我们的殖民历史对前殖民地造成了巨大伤害。其中许多至今仍在努力从中恢复。我们必须支持它们的重建努力，并停止试图支配它们。"
 FRA_push_social_green_eu: "欧洲思潮输出"
 FRA_push_social_green_eu_desc: "我们在法国取得了不少成就，但我们也必须鼓励欧洲伙伴们走上同样的道路。我们可以动员他们的人民向各自政府施压，以免我们成为欧洲唯一推动进步主义的国家。"
 FRA_social_green_fair_rep: "不屈之路"
 FRA_social_green_fair_rep_desc: "短短数年，我们已成就斐然。我们引导法国远离了经济自由主义与朝不保夕的处境，并创造了一个更富人文关怀的法国。但我们将永不停止对既有秩序的挑战，无论在国内，还是在世界其他地方。"
 FRA_no_time: "时间紧迫"
 FRA_no_time_desc: "科学家们几十年来一直在警告气候变化的毁灭性影响。他们预测的情况如今正在成为现实：极端天气事件日益频繁。如果人们希望下一代能有机会生存下去，就必须醒悟过来。"
 FRA_strong_eu: "欧盟的力量"
 FRA_strong_eu_desc: "法国无法迫使全世界都认真对待气候变化。而欧盟则可以为世界其他地区树立榜样。"
 FRA_ecology_available: "推广生态生活"
 FRA_ecology_available_desc: "长久以来，生态一直被视为富人的特权。我们必须继续将其推广为一种节省开支、为所有人避免悲剧的方式。"
 FRA_right_vote: "扩大选举权利"
 FRA_right_vote_desc: "对环境及其未来的关切不应等到十八岁才开始。我们应将投票权扩展到更广泛的人群。"
 FRA_question_growth: "经济增长问题"
 FRA_question_growth_desc: "几十年来，人们一直被引导相信帮助环境的最佳方式是可持续发展。但为何我们总要追求发展与增长？地球及其资源有其极限。我们反而应当朝着减缓增长的方向迈进。"
 FRA_cooperate_eu: "与欧盟伙伴合作"
 FRA_cooperate_eu_desc: "并非所有欧洲伙伴都必然拥有相同的资源，或对转型其经济以应对气候变化抱有同样的决心。我们可以通过在他们的国家投资绿色基础设施来帮助我们的关键伙伴实现这一目标。"
 FRA_push_eco_eu: "迈向绿色未来"
 FRA_push_eco_eu_desc: "我们的欧洲伙伴在应对气候变化方面做得不如我们多。我们可以通过敦促他们的环保活动人士采取行动并效仿法国的做法，来鼓励这些国家的人民积极参与。"
 FRA_question_agriculture: "可持续农业"
 FRA_question_agriculture_desc: "法国的农业已转向大规模生产，以满足上个世纪以来的需求。从环境角度看，它已比许多其他农业形式更具责任感，但仍有改进空间。除了欧洲标准之外，我们必须鼓励农民改变方法，转向负环保责任、高品质的生产。我们将确保他们的产品得到推广，并证明这有利可图。"
 FRA_cooperation_no_compet: "合作而非竞争"
 FRA_cooperation_no_compet_desc: "我国及全球范围内的社会成功模式都基于个人成就与财富展示。这种行为对地球有害，因为它助长了过度消费和公民间的恶性竞争。为了减轻我们社会对地球的影响，我们必须挑战这些社会模式。"
 FRA_nuke_choice: "能源结构多元化"
 FRA_nuke_choice_desc: "几十年来，法国的能源一直由数十座核反应堆产生。尽管这项技术在短期内或许可靠且相对安全，但它产生的废物我们却无法处理。因此，对于可持续的未来而言，它并非理想的能源来源。我们应该通过加大对可再生能源的投资来实现能源供应的多样化。"
 FRA_green_eu: "向更绿色的欧盟"
 FRA_green_eu_desc: "我们在国内外应对气候变化方面取得的成功，为欧盟其他国家树立了榜样。我们对此可以感到自豪。"
 FRA_eco_life: "生态生活方式"
 FRA_eco_life_desc: "采用更可持续的生产方式本身并不足够。我们必须鼓励公民减少消费。这包括限制无处不在的广告宣传，并提倡节制。我们并不需要所有这些；少一些，我们也能过得幸福。"
 FRA_upgrade_transport: "升级运输网络"
 FRA_upgrade_transport_desc: "我们的交通网络或许高效，但分布极不均衡，迫使偏远地区的人们不得不依赖更昂贵且污染更严重的出行方式。我们必须让替代方案在所有地区都触手可及；这意味着要改善与偏远地区的连接，而非继续发展仅串联少数欧洲城市的超高速网络。"
 FRA_dynamise_research: "加速研究"
 FRA_dynamise_research_desc: "我们必须持续推进研究；我们永远不会停止探索如何以更少的资源实现更多目标，并开发可再生能源。"
 FRA_help_transi: "协助欧洲转型"
 FRA_help_transi_desc: "我们的欧洲伙伴开始意识到，气候变化是一个严重的问题，将日益影响他们。然而，有些国家尚未达到能够投资于该领域所需的发展阶段。我们可以通过在各国之间设立一个专门用于向低碳经济转型的联合基金来帮助他们实现这一目标。"
 FRA_end_fossile: "淘汰化石燃料"
 FRA_end_fossile_desc: "鉴于绿色转型的重要性已在欧盟内部得到更广泛认可，我们现在可以加大努力。我们可以向合作伙伴提议，逐步淘汰化石燃料。"
 FRA_opti_indus: "优化工业"
 FRA_opti_indus_desc: "我们需要让大公司的领导者们明白，实施真正的环保措施符合他们的最大利益。他们也可以通过减少资源消耗来做得更多。然而，我们必须小心，避免这促使他们进一步扩大生产。"
 FRA_promote_local: "促进本地消费"
 FRA_promote_local_desc: "现在我们拥有了更为负责任的工业体系，就必须确保本国公民能够切实负担得起其产品。然而，市场力量偏向于低成本生产。因此，我们必须确保本国工业的产品比来自世界另一端的产品更容易获得。这将要求我们调整自由贸易的规则。不过，我们应该能够应对这一挑战。"
 FRA_subsidies_green: "补贴绿色产业"
 FRA_subsidies_green_desc: "鼓励企业推行环保变革，并不能让所有人都参与进来。我们需要提供必要的资源，并根据企业对地球的承诺及其效率来提供补贴。这一次我们将不再容许“漂绿”行为。"
 FRA_pressure_supply: "对出口商施压"
 FRA_pressure_supply_desc: "我国无法在国内生产所需的所有原材料，这是事实。欧盟从环境标准宽松的国家进口了大量资源。我们进口不符合生产标准的资源，这是不可接受的。否则，制定法规又有什么意义？我们必须与其他欧洲强国联手，向这些出口国施压，以推动变革。"
 FRA_reduce_extraction: "减少资源开采"
 FRA_reduce_extraction_desc: "矿物和石油的开采是一个污染过程，往往超出我们地球再生的能力。尽管我们并非坐拥油田，但必须通过引入更严格的矿物和燃料开采法规，为世界其他地区树立榜样。"
 FRA_power_rail: "扩展欧盟铁路"
 FRA_power_rail_desc: "欧盟已经拥有庞大的铁路网络，但我们还能做得更好。仍有太多货物依赖卡车运输；我们必须减少这种情况。"
 FRA_altermondialism: "推广另类全球化"
 FRA_altermondialism_desc: "全球化不再惠及大众，这一点对任何人来说都不足为奇。但我们必须引导公众远离反全球化运动。这些倾向是危险的，因为它们将全球化与往往带有侵略性的民族主义解决方案对立起来。我们必须让他们明白，主要敌人是资本主义。"
 FRA_unite_struggle: "斗争的交汇点"
 FRA_unite_struggle_desc: "我们必须团结所有受压迫的人，无论是因为性别、宗教、肤色还是任何其他特征。他们都是资本主义及其社会后果的受害者。我们必须让他们明白，他们所有的问题都有其原因和解决之道。"
 FRA_retake_past: "赢回工人之心"
 FRA_retake_past_desc: "随着苏联解体以及“快乐全球化”的终结，我们过去工人阶级选民中的很大一部分转向了极右翼民粹主义者，或者大多数情况下干脆不再投票。如今我们设法赢得了选举，但为了确保长期生存，我们必须重建工人阶级基础，这正是我们党的底色。为此，我们必须认真对待他们的诉求，首先从把我们的自由派前任送往中国的就业岗位带回来开始。"
 FRA_turn_reform: "改革而非革命"
 FRA_turn_reform_desc: "既然我们已经重新执掌众机构的舵轮，便无需再考虑采取行动挑战国家，因为我们如今已成为国家的一部分。我们将能够从内部改革社会，搁置革命理想。"
 FRA_leave_nato_PCF: "与美帝决裂"
 FRA_leave_nato_PCF_desc: "北约是美帝国主义的工具，是其控制欧洲的工具。我们必须与之决裂，转而与所有抵抗华盛顿霸权的人民团结一致。"
 FRA_renogociate_treaty: "重新谈判欧盟条约"
 FRA_renogociate_treaty_desc: "我国人民被迫接受了他们本不赞同的欧洲条约。为推行我们的纲领，我们必须修改欧盟强加于我们的立法框架。无疑，我们将与欧洲机构发生权力斗争并面临制裁，但若我们真心希望为法国人民的利益行事，则别无选择。"
 FRA_undo_lib_PCF: "终结自由派政策"
 FRA_undo_lib_PCF_desc: "自密特朗总统任期以来，法国人民一直被迫忍受左翼和右翼一丘之貉的自由主义政策。是时候终结这一切了，证明我们与众不同。我们决心与资本主义斗争，即使这意味着与世贸组织或欧盟发生冲突。"
 FRA_protect_indus_pcf: "保护工业"
 FRA_protect_indus_pcf_desc: "仅仅在法国投资工业是不够的；我们必须防止它们迁往劳动力更廉价、监管更宽松的地方。这关乎维护我们对生产资料的主权，并确保我们的工人拥有体面的工作和生活条件。"
 FRA_left_front: "扩大联盟"
 FRA_left_front_desc: "我们的政府虽已成立，但尚不稳定，我们缺乏盟友。或许我们应该在其他激进的左翼政党中寻求盟友。他们尚未同意加入我们的政府，但或许我们能说服他们。我们可以向他们提供几个部长职位，以换取他们的支持。"
 FRA_deal_devil_pcf: "与社会党结盟"
 FRA_deal_devil_pcf_desc: "其他激进的左翼政党不足以确保我们所期望的稳定。也许我们可以与社会党找到共同点。毕竟，退出欧洲从来不在我们的计划之内。我们肯定能与他们找到共同点，从而将他们纳入我们的联盟。"
 FRA_tie_moscow: "联络莫斯科"
 FRA_tie_moscow_desc: "在整个冷战期间乃至之后，我们党始终站在莫斯科一边。尽管苏联时代已经结束，但看来当前俄罗斯当局支持共产主义理想。自我们离开以来，一直受到昔日盟友的威胁。若能与俄罗斯结盟，那将是梦想成真；我们可以建立经济合作。"
 FRA_eu_communism_PCF: "推广欧洲共产主义"
 FRA_eu_communism_PCF_desc: "苏联如今已不过是一个遥远的记忆，而在当今世界，我们必须在没有它的情况下前行 - 我们的昔日典范俄罗斯，正摇摆于寡头统治与极端民族主义之间。共产主义与欧盟并非水火不容；其他欧洲国家也并非对其抱有敌意。我们能够留在欧洲，并尽己所能引导其远离资本主义与法西斯主义。"
 FRA_retake_sovereign: "重审主权"
 FRA_retake_sovereign_desc: "既然我们已经重新掌控了生产体系，就有能力更进一步。既然我们已具备独立行动的手段，就必须摆脱外来势力的影响。"
 FRA_empower_union_PCF: "推动工会发展"
 FRA_empower_union_PCF_desc: "尽管工会昔日势力强大，如今却已无足轻重。这是因为当局通过分化工人阶级和破坏就业保障刻意削弱它们。然而，在我国，拥有一个能够对抗雇主的力量至关重要。我们无法事事亲力亲为；工人阶级必须重新掌控自己的未来。我们必须帮助工会在工人阶级眼中重获合法性。"
 FRA_green_communism: "联系绿党"
 FRA_green_communism_desc: "人类并非资本主义的唯一受害者；由于人类鲁莽的行为，我们的星球也岌岌可危。我们可以与绿党找到共同点；他们能帮助我们设计生态计划，而这也是我们所需要的。"
 FRA_no_russian_claim: "俄国的威胁"
 FRA_no_russian_claim_desc: "欧盟迟早很可能会与俄罗斯发生冲突。鉴于俄罗斯很可能将目光投向乌克兰和波罗的海地区的领土，我们必须首先主动与乌克兰人接触，向他们提供我们的援助。"
 FRA_green_turn: "绿色共产主义"
 FRA_green_turn_desc: "与我们的绿色盟友合作，我们制定了一项环境计划，使法国能够应对气候变化带来的挑战。这需要我们付出巨大努力，在重建生产方式的同时限制其碳足迹。但我们必须这样做；工人阶级也有孩子，他们必须能够在一个宜居的世界中成长。"
 FRA_favor_lgbt: "终结歧视"
 FRA_favor_lgbt_desc: "既然我们已通过提供就业和未来保障，确保了民众的基本生活需求，我们也必须解决社会阶层内部的歧视问题。我们必须提醒人民，任何形式的歧视都是不可接受的。我们的社会必须学会接纳一切差异。"
 FRA_dna_restored: "重拾初心"
 FRA_dna_restored_desc: "联盟稳固后，我们便能专注于恢复工人阶级的重要地位。通过推行广泛的就业保护法规，我们有望重新赢得选举基本盘的支持。这或许不会让商界满意，但取悦他们从来不是我们的目标。"
 FRA_condemn_rus: "保护东欧"
 FRA_condemn_rus_desc: "俄罗斯的侵略可能不会止步于乌克兰。为了保护我们新兴的欧洲，我们必须确保东欧和北欧国家能够抵御潜在的俄罗斯入侵。"
 FRA_by_ourself: "改良主义之胜"
 FRA_by_ourself_desc: "通过建立强大的联盟，我们为法国保持左翼国家奠定了基础。我们恢复了选民对左翼及其机构的信任。在不抹去过去的前提下，只要我们在这里，我们就永远不会停止在欧洲乃至全世界对抗资本主义和法西斯主义的斗争。"
 FRA_friend_of_past_pcf: "建立新共产国际"
 FRA_friend_of_past_pcf_desc: "俄国的共产党政府似乎也已稳固。我们可以向他们提议扩大合作。是时候让共产主义重拾昔日辉煌了。资本家们和法西斯主义者必须再次学会畏惧我们。"
 FRA_struggle_end: "斗争才刚开始"
 FRA_struggle_end_desc: "在执政的这些年里，我们让共产主义重新登上政治版图。我们重新与选民建立了联系，并为子孙后代确保了未来。然而，我们远未完成使命。前方总有更多挑战需要应对。但至少我们已经确保，左翼将不再是新自由主义的特洛伊木马。"
 FRA_new_18th_brumaire: "雾月十八再临"
 FRA_new_18th_brumaire_desc: "我们波拿巴派已掌控共和国的最高职位。共和派反对势力已被压制，唯有我们能够领导这个国家。我们的敌人众多，但没有任何力量能阻挡法兰西奔向其天命。"
 FRA_revolution_bonapart: "革命遗产"
 FRA_revolution_bonapart_desc: "拿破仑一世和法兰西帝国是法国大革命的直接继承者。由于法国人民深深珍视这些价值观，我们必须向他们表明，我们的帝国并非复辟。我们的帝国是新革命的先驱。"
 FRA_despotism: "专制胜于混乱"
 FRA_despotism_desc: "近几个月的动荡已在民众和金融市场中引起了极大的担忧。我们必须向他们保证，只要我们执政，任何混乱都不会被容忍。"
 FRA_napoleon_constitution: "拿破仑宪法"
 FRA_napoleon_constitution_desc: "前共和国的体制已不再适应当前形势，也不符合我们的权威。我们必须重塑这些体制，以建立一个前所未有的强大国家。"
 FRA_reform_military_napoleon: "新大军团"
 FRA_reform_military_napoleon_desc: "我国的武装力量对于一个像我们这样规模的国家来说已经绰绰有余，但尚不足以应对多国长期冲突的挑战。我们必须从零开始，建设一支无人能敌的军队。"
 FRA_question_eu: "欧洲或帝国"
 FRA_question_eu_desc: "由于我国是欧盟的创始成员国，已深度融入其中，脱离并非易事。然而，我们实际上打算与其他欧洲强国对抗。我们是应当像新一届法国政府那样重新加入欧盟机构，还是干脆永久退出？无论如何，我们都将被迫与他们作战。"
 FRA_centralised_admin: "行政中央集权"
 FRA_centralised_admin_desc: "去中心化对我们国家来说是个错误。我们需要的是一条清晰的指挥链和垂直的组织结构。"
 FRA_blame_ennemy: "挑衅性言论"
 FRA_blame_ennemy_desc: "我们初生的帝国被其未来的敌人所包围。迟早我们将被迫与之交战，但我们的社会尚未准备好与我们昔日的盟友作战。我们曾向他们讲述和平的未来，从而将他们引入了歧途；他们迟早会被拉回现实。为此，我们可以通过削弱他们对旧日伙伴的信任，让他们意识到我们是孤军奋战，来为此做好准备。"
 FRA_proclaim_empire: "帝国宣言"
 FRA_proclaim_empire_desc: "在短短时间内，我们成功巩固了权力，并为法国重返国际舞台创造了条件。如今是时候摒弃虚饰了。我们将在一场展示我们全部军事能力的阅兵之后，宣告法兰西帝国的回归。这是一次实力的展示，一个警告，也是法国新时代的黎明。此后，一切将昭然若揭：潜在的盟友会向我们靠拢，而我们的对手也将暴露无遗。"
 FRA_la_grande_armee: "军队的脊梁"
 FRA_la_grande_armee_desc: "在重组指挥体系后，我们现在可以将注意力转向军事结构的具体改革。首先，我们可以根据实际可用于作战的资源来调整进攻学说。"
 FRA_europe_nationalism: "宣扬欧洲民族主义"
 FRA_europe_nationalism_desc: "很少有欧洲国家向我们承诺支持。他们不看好由民族主义政党领导的法国回归。他们的立场是个错误；他们应该明白，与我们为伍胜于与我们为敌。我们将让他们为不作为付出代价。我们要支持他们国内的民族主义团体。这应该会在他们本土引起一场大乱，而如果他们上台执政，我们就将赢得一个盟友。"
 FRA_plebiscites: "公民投票统治"
 FRA_plebiscites_desc: "共和国的终结绝不意味着人民将失去表达意见的途径。我们必须通过邀请人民就我们政策的各项事务作出决定，向他们表明他们仍然拥有发言权。皇帝陛下将毫不费力地说服他们，而这种表面上的民主对于大多数人来说已经足够。"
 FRA_firepower: "现代火力"
 FRA_firepower_desc: "在拿破仑战争期间，大军团得益于多项创新，得以对反革命势力释放前所未有的火力。如今，随着攻击机和无人机出现在战场上，轰炸的规则已发生重大变化。我国有幸在火炮和航空领域均表现出色。因此，我们必须决定优先发展哪一方面，以精简生产，支援战场。"
 FRA_8th_coalition: "四面楚歌"
 FRA_8th_coalition_desc: "正如拿破仑战争时期一样，一场政治博弈正在明显成形。我们的敌人畏惧我们，只待我们露出第一丝软弱的迹象，便会联合起来对抗我们。我们绝不会让他们得逞。只要有必要，我们的边境将始终保持军事化。法兰西帝国唯有直面其对手方能生存；与过去不同的是，这一次他们没有机会联合起来，因为我们必将逐一击溃他们。"
 FRA_renew_meritocracy: "贤能帝国"
 FRA_renew_meritocracy_desc: "尽管第一帝国并非完美无缺，但其成功源于对经验与专业能力的重视，而非社会阶级。今天，我们必须为法国人民重新兑现这一社会进步的承诺。他们必须明白，通过为帝国和法国辛勤工作，他们能够攀登到前所未有的高度。"
 FRA_last_deluge: "前所未有之强盛"
 FRA_last_deluge_desc: "我们已在指挥链、作战条令和后勤补给方面推行了深远的改革。如今，所余之事便是敞开军队大门，实行大规模征兵。义务兵役制久未成为现实，但法兰西人民已准备为他们的帝国而战。大军团将整装待发，踏上征服欧洲的征途。"
 FRA_ennemy_isolate: "渗透帝国"
 FRA_ennemy_isolate_desc: "我们有能力渗透敌方的民防系统，并在其要害处实施打击。这将为我们的情报部门提供绝佳的训练机会，但也可能使他们对我们提高警惕。"
 FRA_history_allies: "帝国的盟友"
 FRA_history_allies_desc: "尽管我们四面受敌，但并非孤立无援；许多国家仍与我们保持友好关系，或许有兴趣加入我们的联盟。我们可以强调与它们共同的历史，为未来的结盟提供依据。我们能为它们提供重大利益，而它们也将对我们大有助益。"
 FRA_imperial_pride: "帝国荣耀"
 FRA_imperial_pride_desc: "法国人民重拾了他们的骄傲。我们向他们展示了和平与共和国不过是幻象，法国的未来在于成为一个帝国。他们为祖国感到自豪，并憎恨我们的对手。我们的社会与经济正朝着持久冲突的方向调整。"
 FRA_declare_hostile: "试探敌国防御"
 FRA_declare_hostile_desc: "我们不再有任何理由向未来的敌人掩饰我们的扩张野心。是时候让他们的人民明白，他们完全有理由畏惧我们，并乖乖服从，不必大吵大闹。"
 FRA_our_own_system: "独立联盟"
 FRA_our_own_system_desc: "每个帝国都有自己的联盟，单打独斗代价高昂。许多国家已表示愿意与我们结盟。是时候通过建立相互尊重的伙伴间的强大联盟，将这一合作正式化。"
 FRA_reclaim_empire: "光复帝国"
 FRA_reclaim_empire_desc: "是时候出发，重新夺回我们的帝国了。多年来，我们一直在为我们的社会、经济和军队做准备。现在是时候让这份努力结出硕果，让法国在世界秩序中重拾应有的地位。"
 FRA_french_commune: "胜利的革命"
 FRA_french_commune_desc: "我们成功地从温和的共产党人和其他软弱的势力或资本主义的傀儡手中夺取了政权。法国人民接受我们掌权，就是对我们寄予信任。他们也相信资本主义是可以被战胜的，而这正是我们决心要做的事情。我们将重建社会，并为与资本主义势力的决战做好准备。"
 FRA_purge_military: "确保总参谋部安全"
 FRA_purge_military_desc: "尽管我们已成功控制了各机构，但尚未介入的军队未必会永远站在我们这边。迟早有一天，我们将不得不与另一个强权进行军事对抗。为了确保他们的忠诚，我们必须从最高指挥层入手。他们很快就会意识到自己别无选择，但无疑会在最初几个月里有所抵抗。一旦最高层服从命令，其余的人自然也会听命于我们。"
 FRA_worker_right_comm: "安抚工人"
 FRA_worker_right_comm_desc: "尽管我们革命的艰难阶段已经过去，但民间社会对我国的局势表示严重关切。我们必须通过保障就业和工作保障来安抚劳动者。这将需要我们的生产线进行调整，但这些保障措施将有利于我们的未来。"
 FRA_people_constitution_comm: "无产阶级专政"
 FRA_people_constitution_comm_desc: "旧共和国的制度从根本上来说是不公正的。一小撮腐败的阶层掌控着整个国家。我们的革命必须赋予工人参与他们所治理的国家的政治生活的工具。是时候结束这个不公正的共和国，建立一种新的治理模式了。"
 FRA_revolution_soil: "革命之地"
 FRA_revolution_soil_desc: "从雅克利家族到法国大革命，法国人民已经表明他们反对专制制度的不公正。在我们这场革命之后，我们必须向他们证明，他们的呼声已被听到，并建立一个能够抵御反革命分子一切攻击的平等社会。"
 FRA_hostile_nato_comm: "腐败的西方"
 FRA_hostile_nato_comm_desc: "北约是美国和资本主义的傀儡。它们都是我们的死敌，所以我们绝不能继续留在北约。迟早有一天，它们会成为我们的对手。"
 FRA_fate_eurocommunism: "放弃欧洲实验"
 FRA_fate_eurocommunism_desc: "即便我们竭尽全力，也无法让欧盟的机构重回正轨。它们充斥着资本主义和游说的腐败。此外，这些国家坚决反对我们的国内政策。分裂将损害我们高度一体化的经济，但这种分离是必要的。"
 FRA_legacy_patriwar: "伟大卫国战争的遗产"
 FRA_legacy_patriwar_desc: "上个世纪，苏联向世界证明，法西斯主义可以通过武力战胜。他们取得胜利的那场战争告诉我们，一个国家必须与军队团结一致。如果没有苏联社会的韧性，红军绝不可能取得胜利。我们必须确保在未来的冲突中，民众的热情始终高涨。面对未来的挑战，我们需要全力以赴。"
 FRA_focus_education: "大众教育"
 FRA_focus_education_desc: "无论是为了参与政治，还是为了在工作中高效快乐地生活，我们的人民都需要了解信息。我们必须让每个人都有机会学习了解世界所需的一切知识，而不至于落入资本家和法西斯分子的宣传陷阱。"
 FRA_loyalty_cause: "对事业的忠诚"
 FRA_loyalty_cause_desc: "我们赋予人民诸多权利，从改善工作条件到政治代表权，并纠正了许多错误。然而，这些新权利也伴随着责任。我们允许异议，但每位公民都必须完全服从集体意志。我们共同治理这个社会；因此，确保社会正常运转是每个人的责任。"
 FRA_paris_commune: "巴黎公社的教训"
 FRA_paris_commune_desc: "尽管巴黎公社与我们所信奉的共产主义意识形态之间的联系远非显而易见，但我们仍然可以从这段动荡的时期汲取教训。巴黎公社的失败源于其资源匮乏和缺乏与反革命势力斗争的意志。在这个被全球化腐蚀的残酷世界里，我们必须牢记，革命的存亡取决于粉碎反革命势力。我们的社会必须认识到这一点，并团结起来对抗我们的敌人。"
 FRA_unleash_agent: "动摇资本家"
 FRA_unleash_agent_desc: "我们不可能总是与敌人正面交锋；那样代价太高，而且我们最终可能战败。但是，我们可以通过从内部瓦解他们的社会来让自己的日子好过一些。有了对外安全总局，我们就拥有了一个训练有素的间谍和破坏稳定情报机构，我们可以好好利用它。我们将不战而胜地输出革命，资本家们对此束手无策。"
 FRA_spread_communism_eu: "在欧洲传播共产主义"
 FRA_spread_communism_eu_desc: "我们无法改变欧洲机构，但我们可以鼓励一些成员国反抗。由于整个欧盟实施的新自由主义政策并不是每个人都喜欢，我们可以毫不费力地说服他们的一部分人加入我们。"
 FRA_red_army_comm: "新红军"
 FRA_red_army_comm_desc: "得益于我们的改革，军队已完全置于公社的控制之下，公民社会也已准备好与军队并肩作战。我们的改革也释放了军队的全部潜力；我们的士兵深知正义站在我们这边。公社绝不能倒下，因为它高举着革命的火炬。"
 FRA_collectivisation: "经济集体化"
 FRA_collectivisation_desc: "经济的控制权始终与工人阶级无缘，一直掌握在少数家族手中。革命前，寡头政治统治着这个国家。但现在一切都结束了；法国人民正在重新掌控自己的生产资料。有了这些，我们将确保生产资料的忠诚，以及人民的经济安全。"
 FRA_enforce_unions: "赋予工会权力"
 FRA_enforce_unions_desc: "既然我们已经实现了法国经济的集体化，并赋予了工人更大的政治责任，我们就必须确保，即使国家决策不够谨慎，他们也能继续掌控国家。工会或许是由我们温和的前任们重建的，但我们能做的远不止这些。我们将赋予工会更大的权力，并鼓励工人加入工会。团结的工人绝不能停止在国家决策中发挥重要作用。"
 FRA_glorious_past_comm: "共产主义的可疑历史"
 FRA_glorious_past_comm_desc: "虽然并非所有欧洲国家都对斯大林主义共产主义怀有美好的回忆，尤其是在东欧，但我们必须提醒他们，我们与他们不同。这些国家曾遭受斯大林主义极权统治的摧残，这种统治非但没有解放人民，反而为他们树立了新的统治者。我们唯一的敌人是资本主义和法西斯主义；如果这些国家需要摆脱它们的统治，我们可以帮助他们。但我们的目标不是奴役他们，而是将他们纳入我们全人类无产阶级联盟。"
 FRA_befriend_comm: "工人团结"
 FRA_befriend_comm_desc: "尽管共产主义在新千年不再流行，但我们并非孤军奋战。在未来的斗争中，我们需要盟友，而这些盟友就存在于那些和我们一样选择抵制资本主义的国家之中。我们必须向这些国家提议，携手合作，共同摧毁世界各地的资本主义。他们并不孤单，我们亦然。"
 FRA_final_struggle: "最后的斗争"
 FRA_final_struggle_desc: "我们的社会和军队已经做好了与资本主义斗争的准备。他们清楚地认识到我们取得的进步，也清楚资本主义列强企图将我们从地球上抹去的决心。我们将战斗到最后一刻，彻底击败资本主义。"
 FRA_UFSR_born: "法国特色共产主义"
 FRA_UFSR_born_desc: "共产主义意识形态与法国人民捍卫自身权利的决心相结合，是一个极好的理念。我们已向公众阐明，他们必须参与政治，并且他们拥有这样做的途径。正如联盟节现已拥有我国国庆的地位一样，可以说，这场革命如今已真正被法国人民所接受。这对我们的国家来说是一个历史性的日子。"
 FRA_new_kommintern: "建立新国际"
 FRA_new_kommintern_desc: "世界各地许多团体已经响应我们世界革命的号召。是时候将我们的联盟付诸实践，并准备对抗资本主义了。"
 FRA_cold_war_round2: "世界革命"
 FRA_cold_war_round2_desc: "是时候与资本主义和法西斯主义作斗争了。我们将为每个国家的工人带来自由。击败寡头统治。"
 FRA_kingdom_history: "君主制传统"
 FRA_kingdom_history_desc: "君主制已在法国复辟。我们的支持者已掌控前共和国的各个机构，并呼吁我们回归。如今，在绝对君主制垮台两个世纪后，我们重登法兰西王位。前路漫漫，我们必须铲除大革命留下的共和遗毒，同时重建新的法兰西王国。与此同时，敌人潜伏暗处伺机而动，但我们必将成功，因为上帝与我们同在，一如往昔。"
 FRA_camelot: "国王的货郎"
 FRA_camelot_desc: "为确保民众保持顺从，不妄想建立新的共和国，我们必须加强监视，为此我们需要一支政治警察力量。为此，我们可以利用由国内安全总局训练过的前“法兰西行动”成员。我们将把这些组织合并为一个新的机构，称之为“国王的货郎”，以向我国上个世纪的保皇派活动家致敬。"
 FRA_decentralisation_king: "完全去中心化"
 FRA_decentralisation_king_desc: "源自雅各宾主义与大革命的集权传统，并未将法国人转变为公民，而是将其变成了臣民。在较低层级运作的习惯法体系，曾很好地履行了作为公民与中央国家之间纽带的职能。幸运的是，我们的国家为了符合欧盟标准，已经开始摆脱中央集权。因此，我们能够完成这一转型，并非为了迎合欧洲地区的模式，而是为了恢复大革命前那样的地方自治体系。"
 FRA_king_rule: "王权统治"
 FRA_king_rule_desc: "抹去革命记忆的第一步，便是在旧制度的废墟上建立新体制。因此，我们可以宣布废除共和制，并起草一部新宪法。这部宪法将以国王为中心，赋予其绝对权力，正如昔日的美好旧时光一样。"
 FRA_national_integralism: "整体民族主义"
 FRA_national_integralism_desc: "为了让法国人民理解大革命是一场怎样的失败及其后果，我们必须强调思想家夏尔·莫拉斯提出的一个著名理论。整体民族主义描绘了一个因共济会、异端分子和外国人煽动的革命而抛弃了爱国主义的共和国。它主张回归天主教会所体现的民族统一与道德秩序。这些教义充满美德，完全适用于我们初生的王国。我们的王国刚刚找到了它的宣言。"
 FRA_no_more_eu: "退出欧盟"
 FRA_no_more_eu_desc: "欧盟体现了我们所反对的一切：无节制的自由主义、令人作呕的理想主义、灾难性的天真以及无处不在的腐败。这个组织的唯一目的是瓦解我们的国家和文化。因此，我们没有理由继续留在这个联盟中。我们必须趁为时未晚时退出，无论后果如何。"
 FRA_eu_kingdom: "旧日君主国"
 FRA_eu_kingdom_desc: "几个世纪前，欧洲是一个君主制的世界。在某种意义上，那时的国际秩序是由力量平衡与联盟所塑造的。然而那些日子早已一去不复返。民族主义要么扫除了君主制，要么将其贬低为旅游景点。因此，我们寻找盟友的最佳途径，就是帮助欧洲的专制主义支持者奋起反抗他们的共和派压迫者。"
 FRA_king_modern_chivalry: "现代骑士精神"
 FRA_king_modern_chivalry_desc: "法兰西王国素以其骑兵及其在历次战役中的决定性作用而闻名。如今，骑兵已化身为重达60吨的钢铁巨兽，但其关键地位依然如故。我国武装力量应该着重于广泛运用装甲骑兵。"
 FRA_no_deceit: "终结颓废"
 FRA_no_deceit_desc: "我们主要敌人是共和国在我们社会中灌输的堕落：那些偏离道德秩序、期望国家为一切买单的公民。我们必须让他们回到现实。共和国时代已经结束。我们的王国渴望有德行的公民。"
 FRA_frankish_ancestor: "我们的祖先，法兰克人"
 FRA_frankish_ancestor_desc: "我们法兰西人民是法兰克人的后裔；那是我们的人民，也是我们的身份认同。共和派想要铲除君主制和法兰克人，但没有人能从内部抹杀一种文明和文化。这是我们的遗产，重拾它的责任在我们肩上。"
 FRA_against_liberalism: "反右防左"
 FRA_against_liberalism_desc: "共和国曾让我们的公民相信他们需要更多的自由与权利。而我们的王国旨在纠正这些谬误。我们的公民首先需要重新发现通往道德秩序之路，以及团结在国王周围的民族统一。其他一切都是次要的。"
 FRA_historical_ennemy: "永恒的敌人"
 FRA_historical_ennemy_desc: "如果说有哪个对手在数个世纪里与我们交锋不断，那无疑就是英国。它同样是一个君主制国家，尽管如今君主已无实权。我们迟早会发现自己要与他们正面相对。但无论是他们还是别的国家，我们的海军都必须准备好与海上强国作战。"
 FRA_friend_pope: "保护教皇国"
 FRA_friend_pope_desc: "作为天主之长女，法兰西有责任保护教皇免受一切潜在攻击者的侵害。"
 FRA_army_of_elites: "精英部队"
 FRA_army_of_elites_desc: "正是大革命带来了征兵制。我们在上两次世界大战中已看到，这未必是最好的主意 - 那些训练不足的士兵被送上战场，白白送死。这些决策在上个世纪使法国人口锐减。我们必须通过收紧招募标准来确保我们的军队保持职业化。这也将防止我们的队伍中出现捣乱分子。"
 FRA_positive_inequality: "积极阶层差异"
 FRA_positive_inequality_desc: "并非一切都需要平等。人人平等这一理念，不过是革命的又一项发明。有些人天生应去治人，而另一些人则应治于人。法国人需要认识到这一点，把时间花在抱怨他人的成功上只会降低每个人的效率。"
 FRA_destroy_republicanism: "摧毁共和主义"
 FRA_destroy_republicanism_desc: "专制主义已重返我们的王国。再没有任何理由延续那政治民主的幻象。唯一有权存在的政党，便是国王的党。法国人民必须明白，王即国家！"
 FRA_catholic_league: "建立天主教联盟"
 FRA_catholic_league_desc: "我们与教会的和解并未让所有人无动于衷。一些国家已向我们表示支持。或许我们可以将圣战扩展到其他天主教强国。毕竟，他们同样有权为收复圣地而战。"
 FRA_burry_revolution: "埋葬革命"
 FRA_burry_revolution_desc: "法国人民终于意识到，革命带来的唯有苦难，而法兰西君主制的至高无上才是事物的自然秩序。我们的机构也已清除了革命分子。因此可以说，我们已经成功翻过了那场可诅咒的革命篇章。"
 FRA_elder_daughter: "天主之长女"
 FRA_elder_daughter_desc: "法兰西已重新在世界秩序中占据一席之地。我们将一如既往，成为基督教世界的捍卫者，并如同过往无数次那样，收复圣地。"
 FRA_republican_cancer: "共和之癌"
 FRA_republican_cancer_desc: "我们的国家已成功摆脱了共和主义，但在欧洲，我们几乎是唯一一个不再受其统治的国家。不言而喻，如果我们战败，我们的对手将把我们重新推回共和派的噩梦之中。我们必须摧毁共和派的威胁，无论它出现在何处。唯有如此，我们才能安全。"
 france_md.20.t: "中间派现状"
 france_md.20.d: "法国民主联盟最初是一个中右翼政党，现又转向为中左翼政党，过去我们曾在瓦莱里·吉斯卡尔·德斯坦总统领导下执政。然而，自那以后我们一直被边缘化，有时在共治时期发挥作用，但始终被共和右翼和社会党所掩盖。但世界在变化，新自由主义潮流在西方日益盛行。目前我们规模不大，但毫无疑问，总有一天我们会再次执政。"
 france_md.20.a: "是的，我等不及了！"
 france_md.21.t: "共和党右翼现状"
 france_md.21.d: "我们的政党与共和国同龄，自1995年起便在雅克·希拉克的授权下执政，但他如今已渐失势头。一场失败的解散议会之举，迫使他不得不接受一位社会党总理；与此同时，我们正目睹我们的对手 - 无论是社会党还是国民阵线 - 的崛起。我们的国家一如既往地陷于财政困境，而其在海外的利益也处处受到威胁。有一件事是确定的：我们必须在国内外进行战斗，以向那些可能怀疑法国力量的人彰显它的实力。"
 france_md.21.a: "让我们开始工作吧。"
 france_md.22.t: "保卫法兰西联盟现状"
 france_md.22.d: "成立于1999年的“保卫法兰西联盟”是一个右翼主权主义政党。由夏尔·帕斯夸创建，它强烈反对欧盟，并一直致力于与之抗争。目前我们的影响力还很小，但风向正在转变：欧盟并非让所有人都满意，我们正迎来越来越多来自其他政党的异见者 - 那些失望的人，他们在别处找不到实施“法国脱欧”的意愿。我们当然是现存最戴高乐主义的政党，而既然这个共和国由戴高乐创立，那么我们在其中的位置非马提尼翁宫莫属！"
 france_md.22.a: "戴高乐将军万岁，法兰西万岁！"
 france_md.23.t: "国民阵线现状"
 france_md.23.d: "国民阵线由让-玛丽·勒庞于1972年创立，是一个极右翼政党。自成立以来，我们从未被视为一个严肃的政党，因为整个政治格局都因我们反对移民而与我们为敌。自那时起，情况已发生变化，其他政党开始意识到，他们的态度已导致我们国家陷入混乱。我们是反对移民这一普遍趋势的先驱。然而，我们仍被视作不可接触者，并被贴上极端分子的标签，因此我们必须努力使我们的政党为议会和选民所接受。"
 france_md.23.a: "我们会做到！"
 france_md.24.t: "社会党现状"
 france_md.24.d: "作为共和党右翼的历史宿敌，我们的政党已步入成熟。共和党右翼如今正陷入困境，被迫进入共治状态。我们在大多数社会阶层中拥有稳固的选民基础，我们在投票箱前的胜利是不可避免的。我们主张比前辈更为自由的路线，以适应我们正在建设的欧洲。然而，我们的党内存在分歧：右翼渴望走向自由中间派，而左翼则有激进化的风险。毫无疑问我们会赢，但一旦登顶，我们将如履薄冰。"
 france_md.24.a: "一切都会好起来的。"
 france_md.25.t: "不屈法国现状"
 france_md.25.d: "社会党因在自身两种倾向之间摇摆不定，未能将左翼理想推至权力之巅。我们的政党 - “不屈法国”，是唯一真正反对新自由主义秩序的左翼力量。社会党正是因为无原则地寻求妥协而自我埋葬，因此我们将以抗议为基调，即使付出被媒体反噬的代价也在所不惜。我们的主要计划是建立一个新的共和国，终结我们忍受已久的帝王总统制。我们的政党在年轻人中取得了成功，但若我们有一天想要执政，便不能就此满足。"
 france_md.25.a: "另一种世界终将到来。"
 france_md.26.t: "绿党现状"
 france_md.26.d: "法国的生态主义政党自1984年以来便已存在，但并未取得我们所希望的成功。我们从未被认真对待，且我们的选民基础几乎无法在城市中心以外找到。如果我们要有所作为，就必须与其他政党合作，并适应他们的观点。但鉴于地球的现状，我们入主马提尼翁府终将被证明是合情合理。一旦入主那里，我们将努力改变我们的生活方式和生产方式，以保障子孙后代的未来。障碍众多，但潜在的盟友并不缺乏。"
 france_md.26.a: "我们时间不多了。"
 france_md.27.t: "法国共产党现状"
 france_md.27.d: "法国共产党随着它所牢固依附的苏联一同衰落。站在失败的一方从来都不好受。我们的处境堪称危急：随着我们失去信誉，我们的工人阶级选民基础正在向极右翼或弃权转向。我们需要扭转这一趋势，寻找新的方式来赢回他们。毫无疑问，我们将不得不在一段时间内与其他政党进行谈判，但也许一旦我们掌权，我们便能重新获得前选民的信赖，并重获自主权。我们的党历史悠久，不能就此止步。"
 france_md.27.a: "我们会回来的。"
 france_md.30.t: "经济的方向"
 france_md.30.d: "是时候选择我们的财政部长了。我们的国家亟需改革，因此我们找到了两位应在财政方面符合我们预期的人选。第一位来自我们党内，名叫奥利维耶·费朗，他在经济领域的职业生涯中已熟悉这一领域。第二位，曾任财政督察员，是政坛新人，曾支持我们的竞选。他对社会的社会自由主义愿景与我们所期望的方向相符，或许他在我们政府中的存在将为我们赢得自由派阵营的认可。"
 france_md.30.a: "运动需要革新！立即任命埃马纽埃尔·马克龙前往贝尔西！"
 france_md.30.b: "不，我们最好安排一个真正值得信任的人。任命奥利维耶·费朗吧。"
 france_md.150.t: "来自法国的额外援助"
 france_md.150.d: "法国政府已提出在我们加入欧盟后一直经历的财政危机中向我们提供额外帮助。我们应该接受吗？"
 france_md.150.a: "我们当然需要这笔钱！"
 france_md.150.b: "不，我们不需要。"
 france_md.151.t: "法国提议召开国际会议"
 france_md.151.d: "法国社会党决定组织一场全球社会主义领导人会议，他们想到了邀请我们。我们可以借此机会提升合法性。我们是该参加，还是礼貌地拒绝？"
 france_md.151.a: "我们会去的！"
 france_md.151.b: "不，我有更重要的事情要做。"
 france_md.160.t: "社会党的崩溃"
 france_md.160.d: "在社会党内部经历了一年的动荡与分裂之后，它已几乎消亡。这是一个历史性的时刻，但目睹一个在法国历史上扮演过如此关键角色的政党走向终结，实在令人惋惜。无论谁接任第一书记一职，都将肩负重任。"
 france_md.160.a: "大错已成"
 france_md.161.t: "分裂仍在继续"
 france_md.161.d: "我们很大一部分成员和支持者正在逐渐脱离我们的团体。很明显，如果我们想避免衰落，就必须动用一切可以利用的手段来维持政界和公众的支持。"
 france_md.161.a: "一刻也不能耽误！"
 france_md.162.t: "我党正面临威胁"
 france_md.162.d: "我们推行了许多不得人心的改革，尽管普遍遭到反对，却招致了民众的愤怒，他们开始怀疑当初投票给我们是否正确。更甚的是，我们与自由中间派的多次结盟，以及试图效仿他们的做法，在党内造成了诸多裂痕。我们的左翼对我们的选择感到失望，威胁要投入激进左派的怀抱，而右翼则认为我们相比那些有时在无意中帮助过的自由派候选人，显得过于软弱。如果还有一线机会，我们必须付出巨大努力去把握它。"
 france_md.162.a: "唉，真该死。"
 france_md.163.t: "谁来负责？"
 france_md.163.d: "在我们崩溃之后，部分选民转向了中间派，另一些则投向了更左翼的阵营，这些阵营以自称“决裂派”左翼来标榜其“激进主义”，这一立场招致了媒体的猛烈批评，并促使反对派联合起来对抗他们。我们现在选择对抗哪一派，将决定我们昔日的选民是否会重新回到我们身边。"
 france_md.163.a: "任何极端分子都威胁着我们的社会"
 france_md.163.b: "与极端中间派所代表的危险相比，那简直微不足道。"
 france_md.164.t: "法国提议举行联合军事演习"
 france_md.164.d: "法国外交官向我们提出了联合军事训练的提议。确实，近期国际紧张局势的升级促使我们欧洲各国团结起来，为最坏情况做好准备。这可能是训练我们武装部队应对随时可能爆发的高强度冲突的一个非常好的举措。我们该如何回复他们？"
 france_md.164.a: "我们很乐意与他们一起训练。"
 france_md.164.b: "不，谢谢，我们不需要他们的帮助。"
 france_md.165.t: "暴风雨来临"
 france_md.165.d: "一段时间以来，多位不同领域的专家都建议我们制定监管措施，以应对全球任何地方可能发生的经济危机。这并非第一次，也绝不会是最后一次，但这些措施能让我们远离此类危机带来的种种复杂局面。然而，这意味着要对经济领域进行监管，并聘请众多专家来监督运作。我们真的想这样做吗？我们的金融合作伙伴可能会对此感到不满。"
 france_md.165.a: "情况确实非常令人担忧；我们必须紧急制定监管措施。"
 france_md.165.b: "这些都只是假设，似乎对商业不利。"
 france_md.170.t: "法国提供战争赔款"
 france_md.170.d: "法国政府决定就长达七年发生在我国领土上的惨烈印度支那战争向我们进行赔偿。这笔钱永远无法弥补五十万为独立而牺牲的越南人民的生命，但这无疑是一项值得尊重的善意之举，我们不应拒绝。"
 france_md.170.a: "现在我们等着美国人。"
 france_md.171.t: "法国提供战争赔款"
 france_md.171.d: "法国政府似乎终于同意承认在我国犯下的一些罪行，并提出对独立战争的赔偿。这笔钱无法弥补60万为自由而牺牲的阿尔及利亚人的生命，但既然西方国家承认了自己的罪行，拒绝赔偿就显得愚蠢了。"
 france_md.171.a: "在合适的时机。"
 france_md.172.t: "法国提出分享核能专业知识"
 france_md.172.d: "法国总统府提议以一笔数额不大的资金与我们分享其核技术专长。这对于我们掌握这种不稳定的原子并充分利用它大有裨益。如果我们接受，这将极大地帮助我们启迪民众，并促进该领域的研究。然而，或许我们应该把这笔钱用在更有意义的事情上，而不是让法国在我们国家占据它不应有的地位。"
 france_md.172.a: "一项关于铀235的交易"
 france_md.172.b: "不，你们还是把你们的定时炸弹留给自己吧。"
 france_md.173.t: "法国提议提供保护"
 france_md.173.d: "面对全球多重危机，法国决定保障其欧洲盟友的安全。事实上，法国总统府今天上午向我们保证，一旦欧洲任何外国势力发动侵略，法国将毫不犹豫地进行干预，甚至动用核武器。尽管这种保护本身就意味着主权的丧失，但在当前形势下，它可能至关重要。"
 france_md.173.a: "谨慎永远都不嫌多。"
 france_md.173.b: "我们不需要他们的保护"
 france_md.175.t: "欧盟对我们实施制裁"
 france_md.175.d: "鉴于我们近期的立场以及我们退出与成员国之间条约的意愿，这些该死的欧洲官僚对我们处以罚款。然而，没有任何理由强迫我们支付这笔罚款；渴望变革的选民甚至会将其视为软弱或背叛的象征。但是，拒绝支付罚款可能会损害我们与欧洲成员国的关系，并引发制裁。我们是否应该坚持到底？"
 france_md.175.a: "我们会缴纳罚款，因为我们遵守规则；只有遵守规则，我们才能取得胜利。"
 france_md.175.b: "还有什么？我们已经被榨干了太多。"
 france_md.180.t: "历史性的选择"
 france_md.180.d: "人民已经发声。经过漫长的法国脱欧运动，躲过了那些该死的欧洲主义者和那些企图窃取我们成果的卑鄙民粹主义者的陷阱，我们终于成功了。法国正在以最快的速度退出欧洲。显然，布鲁塞尔的这些毒蛇会想方设法让我们付出代价，但这些制裁与我们重获的自由相比，根本微不足道。"
 france_md.180.a: "从现在开始，法国永远自由。"
 france_md.181.t: "法国退出欧盟"
 france_md.181.d: "在经历了多次疑欧派虚假信息宣传之后，法国民族主义运动最终成功地将法国推向了“法国脱欧”的轨道。法国脱欧只是时间问题；然而，看到欧盟这样一个创始成员国和结构性成员国如此迅速地退出，仍然令人深感不安。"
 france_md.181.a: "面对民粹主义，我们必须保持警惕。"
 france_md.182.t: "法国承认我们的宣称"
 france_md.182.d: "法国政府近日宣布支持我们对历史上属于我们却被夺走的领土的立场。他们还提议启动两国间的军事合作；目前仅限于允许他们使用我们的军事基础设施。我们欢迎法国的突然支持，但我们真的应该允许他们利用我们的基础设施吗？"
 france_md.182.a: "当然，他们支持我们；我们欢迎他们。"
 france_md.182.b: "我们从未寻求过他们的帮助；让他们保持距离吧。"
 france_md.183.t: "法国提议深化与我们的合作"
 france_md.183.d: "在多次表明对我们有利的立场并明确拒绝加入北约之后，巴黎又提议我们深化合作，从经济联系到全面军事联盟，共同对抗我们的共同敌人。我们真的能信任那些如此迅速地抛弃先前盟友的西方国家吗？"
 france_md.183.a: "我要三箱那种香水，成交！"
 france_md.183.b: "你更喜欢在萨赫勒沙漠还是我们冰封的草原上训练？我们的军队只会变得更加强大。"
 france_md.183.c: "他们可以独自待着。"
 france_md.184.t: "莫斯科接受经济合作"
 france_md.184.d: "莫斯科的回应很快到来；我们双方的经济都能从这项协议中受益。除了为我们打开一个规模可观的奢侈品和高科技产品市场外，我们那些需要原材料的行业也会感到更有保障。这项历史性协议对我们来说是一笔意外之财，也是欧盟的致命一击。我们这些缔造者如今却要与它最大的敌人进行贸易。"
 france_md.184.a: "让香槟和油流淌"
 france_md.185.t: "莫斯科接受经济和军事合作"
 france_md.185.d: "莫斯科的回应很快到来；我们的经济和军队都将从这项协议中受益。除了为我们打开一个可观的奢侈品和高科技产品市场外，我们那些需要原材料的行业也将更有保障。此外，加强我们两国军队之间的合作将使我们能够在新的战场上积累经验，并受益于他们的技术和战略进步。这项历史性协议对我们来说是一笔意外之财，也是北约的致命一击。我们现在拥有一个值得信赖的伙伴，共同引领我们迈入新的千年。"
 france_md.185.a: "我们终将在萨赫勒地区再次相遇，但这一次，我们不会再兵戎相见。"
 france_md.187.t: "俄罗斯方面中断谈判"
 france_md.187.d: "尽管我们的外交官竭尽全力，但最终未能与俄罗斯方面达成协议。仿佛他们根本没有与我们合作的意愿。这令人遗憾；双边协议的潜力对我们两国来说本应是无价之宝。也不排除我们昔日的西方盟友施加了压力，以确保我们继续受制于他们。但这并非致命缺陷；我们会找到其他合作伙伴。"
 france_md.187.a: "美国毒瘤已蔓延至乌拉尔山脉；宁可独行，也不要与恶人为伍。"
 france_md.188.t: "法国要求让步"
 france_md.188.d: "法国民粹主义胜利及其退出欧盟后，法国继续展现出对我们的敌意。脱欧后遭受的经济制裁并未使其毫发无损；如今，法国已恢复元气，并要求赔偿。今天，法国外交官抵达，威胁称如果我们不敦促欧洲银行降低其债务利率，他们将切断法国领土的通行。失去进入法国领土的通道可能会极大地复杂化欧盟内部的交流。然而，屈服于他们的讹诈将迫使我们滥用自身优势，做出不利之事。"
 france_md.188.a: "诅咒他们；我们将尽量减少损失。"
 france_md.188.b: "我们绝不会屈服于少数民粹主义者的勒索。"
 france_md.189.t: "德国向我们让步"
 france_md.189.d: "在我们施加压力之后，德国政府勉强同意向欧洲央行施压，要求其降低利率。​​这无疑是对我们昔日欺压者的有力回击。这些德国人可以继续享用我们的环岛，但多亏了他们，我们才能从布鲁塞尔的利益中获益。"
 france_md.189.a: "以眼还眼，以牙还牙，如果可能的话，用拉丁语表达。"
 france_md.190.t: "德国拒绝了我们的要求"
 france_md.190.d: "我们的外交官空手而归，被德国同胞冷落了。或许我们的要求过高，又或许他们打算另寻他路。今天我们无法对欧盟进行报复，但这刻不容缓。"
 france_md.190.a: "我们依然自由，而他们却不自由；关闭东部边境"
 france_md.191.t: "法国要求让步"
 france_md.191.d: "法国民粹主义胜利并退出欧盟后，继续表现出对我们的敌意。退出后对其实施的经济制裁也未能幸免。现在它已经康复并要求赔偿。今天，外交官抵达威胁，如果我们不更换他们在移民拘留行动中的海上和沿海警察，他们将切断进入其国家领土的通道。无法进入其领土的后果可能会使欧盟内部的交流变得非常复杂。然而，屈服于他们的勒索将迫使我们利用我们的优势作恶。"
 france_md.191.a: "诅咒他们；我们将尽量减少损失。"
 france_md.191.b: "我们绝不会屈服于少数民粹主义者的勒索。"
 france_md.192.t: "意大利向我们让步"
 france_md.192.d: "在我们施加压力之后，意大利政府勉强同意在我们的海上边界部署警力，取代我们的警察。这是对我们昔日欺压者的有力回击。这些意大利人乐见移民涌入，但多亏了他们，我们才能从布鲁塞尔的利益中获益。"
 france_md.192.a: "以眼还眼，以牙还牙，如果可能的话，用拉丁语表达。"
 france_md.193.t: "意大利拒绝我们的要求"
 france_md.193.d: "我们的外交官空手而归，被拉丁邻国冷落。或许我们的要求过高，又或许他们打算另寻他路。今天我们无法向欧盟复仇，但这刻不容缓。"
 france_md.193.a: "我们依然自由，而他们却失去了自由；关闭东南部的边境吧。"
 france_md.194.t: "法国要求让步"
 france_md.194.d: "法国民粹主义胜利并退出欧盟后，它继续展现出对我们的敌意。脱欧后遭受的经济制裁并未让它毫发无损；如今它已恢复元气，并要求赔偿。今天，外交官们抵达，威胁说如果我们不利用我们境内的机构为他们服务，他们将切断我们进入其领土的通道。他们要求我们影响欧洲机构及其情报机构的决策。失去进入其领土的通道可能会极大地复杂化欧盟内部的交流。然而，屈服于他们的讹诈将迫使我们滥用自身优势，以图谋不轨。"
 france_md.194.a: "诅咒他们；我们将尽量减少损失。"
 france_md.194.b: "我们绝不会屈服于少数民粹主义者的勒索。"
 france_md.195.t: "比利时向我们让步"
 france_md.195.d: "在我们向他们施加压力之后，比利时政府同意向欧洲机构施加压力，以支持我们。这是对我们以前的折磨者的强大报复。这些比利时人会很高兴在议会加班，多亏了他们，我们的吃饭费用由布鲁塞尔承担。"
 france_md.195.a: "以眼还眼，以牙还牙，如果可能的话，用拉丁语表达。"
 france_md.196.t: "比利时拒绝我们的要求"
 france_md.196.d: "我们的外交官空手而归，被瓦隆和弗拉芒兄弟们冷落了。或许我们的要求过高，又或许他们打算另寻他路。今天我们无法向欧盟复仇，但复仇刻不容缓。"
 france_md.196.a: "我们依然自由，而他们却失去了自由；关闭北方边境吧。"
 france_md.197.t: "法国要求让步"
 france_md.197.d: "法国脱欧并摆脱由此带来的制裁后，依然对我们的敌意有增无减。今天，法国外交官抵达，威胁称除非我们提供在法国境内银行账户的详细登记册，否则将切断我们进入法国领土的通道。这严重违反了我们一直努力维护的银行保密原则。失去通道将使我们与欧盟其他地区的贸易往来变得复杂，但屈服则意味着我们成为其敲诈勒索的帮凶。"
 france_md.197.a: "诅咒他们；我们将尽量减少损失。"
 france_md.197.b: "我们绝不会屈服于少数民粹主义者的勒索。"
 france_md.198.t: "卢森堡向我们让步"
 france_md.198.d: "在我们施加压力后，卢森堡政府同意向其银行业施压，要求其提供详细的账户登记册。我们发现了许多试图逃避责任的叛徒，同时也掌握了许多在我国境内注册的私营公司的信息。这些发现将有助于税务机关追究这些“叛国者”的责任，并让那些试图在我国欺骗我们的公司付出代价。卢森堡银行业或许已经严重丧失了信誉，但正因为有了他们，我们才能从布鲁塞尔的利益和他们那该死的自由贸易中获益。"
 france_md.198.a: "以眼还眼，以牙还牙，如果可能的话，用拉丁语表达。"
 france_md.199.t: "卢森堡拒绝我们的要求"
 france_md.199.d: "我们的外交官空手而归，被我们那些富裕的邻居冷落了。或许我们的要求太高，又或许他们打算另寻他路。今天我们无法对欧盟进行报复，但这刻不容缓。"
 france_md.199.a: "我们依然自由，而他们却失去了自由；关闭东北边境"
 france_md.200.t: "法国要求让步"
 france_md.200.d: "法国脱欧并摆脱制裁后，依然对我们的敌意有增无减。今天，他们的外交官抵达，威胁说除非我们援助他们的农业部门，否则他们将切断我们进入法国领土的通道。他们的农业部门正在南部开发一个柑橘项目，直接与我们的产品构成竞争。失去这条通道会使我们在欧盟内部的贸易更加复杂，但如果我们屈服，就等于成了他们敲诈勒索的帮凶。"
 france_md.200.a: "诅咒他们；我们将尽量减少损失。"
 france_md.200.b: "我们绝不会屈服于少数民粹主义者的勒索。"
 france_md.201.t: "西班牙向我们让步"
 france_md.201.d: "在我们施加压力之后，西班牙政府同意为我们的新型柑橘产品系列的生产和销售提供技术和商业援助，该系列产品将席卷法国和西班牙市场。或许西班牙人现在只能咬自己的手指了，但多亏了他们，我们才能从布鲁塞尔的消费中获利，并展现我们在欧洲大陆的食品霸权。"
 france_md.201.a: "以眼还眼，以牙还牙，如果可能的话，用拉丁语表达。"
 france_md.202.t: "西班牙拒绝我们的要求"
 france_md.202.d: "我们的外交官空手而归，被伊比利亚邻国冷落。或许我们的要求过高，又或许他们打算另寻他路。今天我们无法向欧盟复仇，但刻不容缓。"
 france_md.202.a: "我们依然自由，而他们却失去了自由；关闭西南边境"
 france_md.203.t: "旅程的终点"
 france_md.203.d: "经过数月的对话和对内容的反复斟酌，宪法改革文本终于准备就绪，即将付诸表决。我们的政治对手或许利用起草过程，偷偷塞入了符合自身理念的条款，但剥夺人民在如此漫长的进程后进行投票的权利，无疑会让他们感到被背叛。根据宪法第十一条，召开全民公投完全由我们决定，我们也将独自承担由此产生的后果。"
 france_md.203.a: "是时候结束这一切了；呼吁举行全民公投。"
 france_md.203.b: "这段文字太过危险，不应进行投票表决。"
 france_md.204.t: "条文通过"
 france_md.204.d: "今天是历史性的一天；全体人民首次参与了宪法的制定。投票结果不出所料，赞成票以压倒性优势获胜；当然，当法国人民拥有决定自身权利的权利时，他们绝不会放弃这些权利。这部宪法或许并不完美，但它标志着一个新时代的开始，我们已尽最大努力确保它既能捍卫公民的权利，又能防止人民落入政治对手的蛊惑之手。第五共和国就此结束，而第六共和国也随着这坦率而压倒性的赞成票而开启。"
 france_md.204.a: "荣耀之日已至"
 france_md.205.t: "该条文基本被拒绝"
 france_md.205.d: "出乎所有人意料的是，我们筹划数月的宪法改革方案在投票中被否决了。或许是我们参与引导辩论让民众认为我们试图操纵选举，又或许是民众渴望变革，却始终未能就变革的具体形式达成共识。不过，一切并非就此结束：我们仍可循序渐进地推进共和国的愿景，但我们所期盼的全面改革恐怕只能暂时搁置。"
 france_md.205.a: "完全无法理解"
 france_md.206.t: "关于制度的辩论，第一部分"
 france_md.206.d: "自1958年第五共和国成立以来，制度问题一直是法国社会的一大分歧所在。当时，总统权力取代了第四共和国的不稳定局面。如今，总统权力被认为过大，使得心怀不轨的总统可以不受制约地阻碍国家发展，而更具代表性的国民议会却鲜有专属权力。修订这部过时的宪法如今已成为讨论的焦点，而修订的程度将决定权力是回归议会还是继续集中在总统手中。"
 france_md.206.a: "不必时刻受到议会的威胁，这其实很实际。"
 france_md.206.b: "打倒总统制共和国，总统将主持菊花揭幕仪式。"
 france_md.206.c: "我们只需专注于促进公民积极参与即可"
 france_md.207.t: "妥协的胜利"
 france_md.207.d: "经过数日的讨论，公民们似乎已就权力重新平衡达成一致。宪法第49.3条自然成为民众愤怒的首要目标。总统权力受到的削弱相对较小，民众似乎对他们的工作感到满意。民主政变的可能性现在似乎降低了；我们的制度在合法性和有效性方面都有所提升。我们只能对那些我们曾承诺终结总统君主制的忠实支持者略感失望而感到遗憾。无论我们怎么想，人民已经做出了决定；现在我们可以将注意力转向接下来的辩论了。"
 france_md.207.a: "好的，下一个问题！我的办公室处理得相当不错。"
 france_md.208.t: "总统独裁的终结"
 france_md.208.d: "公民们终于达成共识：第五共和国因总统滥用职权而积怨已久，我们不能再让如此巨大的权力掌握在一人之手。总统的权力如今仅限于三军统帅和爱丽舍宫的礼仪性角色，而国民议会则再次拥有至高无上的权力。改革或许会失去一些稳定性，但推进起来会更加顺畅，法国民众对国家体制的信心也应因此增强。"
 france_md.208.a: "那就这样吧，让辩论继续下去。"
 france_md.209.t: "关于制度的辩论（第二部分）："
 france_md.209.d: "随着制度性辩论接近尾声，一个问题仍然困扰着我们的公民：如何监督那些对总统负责的秘密机构。这些机构长期以来一直维护着法国的利益，但过去的一些过激行为，例如1981年的奥里奥尔谋杀案，以及它们凌驾于法律之上的行事自由，引发了人们对透明度的担忧。提高透明度有助于建立公众对制度的信任，但在一个日益动荡的世界中，我们的安全不容小觑。"
 france_md.209.a: "公民安全至上！我们会确保他们的隐私不会受到过多威胁。"
 france_md.209.b: "人民需要透明度！人民需要正义；国家必须对公民负责。"
 france_md.209.c: "这场争论引发了太多紧张局势；我们最好保持距离。"
 france_md.210.t: "秘密情报机构安然无恙"
 france_md.210.d: "公民们决定将秘密情报机构置于行政控制之下。的确，尤其是在当今时代，我们的被动防御必须发挥最有效的作用，以保护我们免受来自国外的恶意行为和恐怖主义的威胁。然而，这一结果令那些渴望更高透明度和民主的活动人士感到失望。许多公民仍然认为，国家安全不应以牺牲和平时期的隐私为代价。一些人还担心，心怀不轨的政府会滥用这些机构来监视反对派或阻止向反对派泄露信息。选民们已经做出了选择，他们选择了安全而非自由。毕竟，这是他们自己的选择。"
 france_md.210.a: "在当今这个强权凌驾于国际法之上的世界里，现在绝不是放松警惕的合适时机。"
 france_md.211.t: "帷幕拉开"
 france_md.211.d: "经过艰苦的谈判，我们最终决定结束情报机构的完全不透明状态。许多公民不再感到安全，因为他们知道自己在不知情的情况下被持续监视，而且我们的对外干预行动常常引发争议，而他们宁愿不从报纸上得知这些争议。这种新的透明度应该能够增强公民对警察和军队的信心，即使这会让我们在内部安全和对外影响力方面付出一些代价。"
 france_md.211.a: "我们不需要秘密机构来保护我们免受外国干涉。"
 france_md.212.t: "关于个人权利的辩论（第一部分）："
 france_md.212.d: "个人权利问题是宪法辩论的核心。我们应该加强个人自由以对抗国家权力，还是应该优先考虑集体安全？讨论的焦点集中在个人数据保护、隐私权以及国家监控的界限上。进步派主张扩大基本权利，而保守派则担心公共权力被削弱。我们在此问题上的立场将在一定程度上决定新宪法的走向。"
 france_md.212.a: "坚决捍卫个人自由。"
 france_md.212.b: "集体安全必须放在首位。"
 france_md.212.c: "让这场辩论继续下去，我们不必参与。"
 france_md.213.t: "个人自由的胜利"
 france_md.213.d: "辩论最终以加强个人自由为胜算。新宪法将保障公民隐私免受国家干预，从而提供更强有力的保护。进步人士的这一胜利标志着我们与公共权力关系的一个转折点，尽管有些人担心这会对国家安全造成影响。"
 france_md.213.a: "我们的公民可以为这些新的保障措施感到高兴。"
 france_md.214.t: "安全至上"
 france_md.214.d: "尽管自由倡导者们竭力争取，但在宪法辩论中，以安全为中心的方案最终胜出。国家将保留广泛的监控和干预权力。虽然这让部分民众感到安心，但民权活动人士谴责这是民主的倒退。"
 france_md.214.a: "稳定是有代价的。"
 france_md.215.t: "关于个人权利的辩论（第二部分）："
 france_md.215.d: "我国素以动荡不安著称，无论选举结果如何，民众的不满最终都会蔓延至街头。如今，如何保护民众在抗议活动中的安全已成为一个重要议题：一方面是警方权力过度扩张，另一方面是保护不足，许多抗议活动最终都以人员伤亡告终。限制警方权力可以重建公众信任，但会增加成本；而支持警方则能维持秩序，但随着运动的激进化，可能会引发更多冲突。"
 france_md.215.a: "我们必须规范警务队伍。"
 france_md.215.b: "让他们做好自己的工作。"
 france_md.215.c: "人民会做出决定；毕竟，他们会走上街头抗议这项法律。"
 france_md.216.t: "人民选择限制警察权力"
 france_md.216.d: "经过数小时的辩论，大多数人同意需要对警力进行监管，以防止新的丑闻发生。维护治安的技术正在不断进步，我们在这方面已经是一个高效的国家；没有必要再进一步。此外，避免抗议者遭受严重的身体伤害无疑会降低医疗支出。由于民众能够更安全地走上街头抗议，国家也需要对民众承担更多责任。然而，随着执法效率的降低，警力成本的增加也是在所难免的。"
 france_md.216.a: "所以我们的人民会继续约束我们。下一个问题！"
 france_md.217.t: "人民选择秩序"
 france_md.217.d: "即便结果并非我们所愿，但警方的高效执法最终取得了胜利。诚然，一些抗议活动会演变成大规模的财产损失，鉴于执法部门效率的下降，外部监督势在必行。我们正面临前所未有的预算和社会危机；在某种程度上，我们或许会面临部分民众的反对。因此，我们必须有能力应对任何可能出现的社会运动。毕竟，是他们选举了我们，不是吗？"
 france_md.217.a: "人民选择了安全而非追究我们责任的权利；我们能责怪他们吗？下一个问题。"
 france_md.218.t: "经济辩论（第一部分）"
 france_md.218.d: "尽管经济管理将由未来的政府负责，但我们现在就可以将社会、生态或经济的基本原则写入宪法，使任何违反这些原则的法律都违宪。优先保障社会福利可以确保就业和民生，但可能会忽视生态环境，并因由此产生的债务而令投资者感到不安。优先发展生态环境可以提高生活质量，并引导我们转向新能源，但会损失一些收入和投资。我们也可以假装支持经济发展，以此来挑拨离间，或者干脆把这个问题完全留给他们自己去解决。"
 france_md.218.a: "社会支持至上！我们必须与我们的公民站在一起。"
 france_md.218.b: "地球环境恶化的速度太快了，我们不能袖手旁观。"
 france_md.218.c: "好主意；我们要让他们以为是自由派在幕后操纵。"
 france_md.218.e: "就让其他各方就这个问题互相攻击吧。"
 france_md.219.t: "人们选择优先考虑社会支持"
 france_md.219.d: "经过长时间的犹豫，公民们最终就共和国的社会支柱达成了一致。的确，保护普通民众及其就业，才能确保我们健康地过渡到更美好的未来。此外，与其将工厂迁往那些对此漠不关心的国家，不如让它们按照标准在本地建设并造成污染。这一结果既在意料之中，也并非坏消息。"
 france_md.219.a: "我们还可以回答另一个问题；做得好。"
 france_md.220.t: "人民选择生态"
 france_md.220.d: "这个结果并不令我们失望。事实上，地球的健康最终会惠及居住在其上的人们。因此，这种觉醒在社会各个层面发生并不令人惊讶，甚至是一件好事。由此，我们必须学会改变我们的生活方式以及生产商品和能源的方式。这条道路注定充满荆棘，也并非总能符合大多数人的利益。但这正是我们必须追寻的道路。"
 france_md.220.a: "剩下的就是重新分配那些投票支持大企业的人了。"
 france_md.221.t: "人民选择经济"
 france_md.221.d: "今天的辩论结果令人意外。人民选择保护各种类型的企业，以推动国家发展。可以看出，有些人仍然相信涓滴效应理论。人们或许也曾预料到，由于媒体往往掌握在少数寡头手中，他们会竭尽所能地操纵局势。对于我们的活动人士来说，今天无疑是令人失望的一天。但我们现在不能质疑主权人民的意愿。"
 france_md.221.a: "征求民众意见真的是个好主意吗？"
 france_md.222.t: "经济辩论（第二部分）"
 france_md.222.desc: "其他社会问题可以留待未来的共和国解决，但我们现在就可以确定宪法方向：谁应该为我们卓越但昂贵的社会保障体系买单？无论这项改革现在就税收、预算拨款还是削减开支做出何种决定，都将影响我们福利国家未来几代人的财政支柱。"
 france_md.222.a: "打倒资本主义！"
 france_md.222.b: "国家将为该系统提供资金；我们将尽最大努力避免征收新税。"
 france_md.222.c: "我们不能冒让公民失业的风险。"
 france_md.222.d: "我们最好不要卷入这场争论。"
 france_md.223.t: "人民选择对资本征税"
 france_md.223.d: "近几周的漫长辩论最终以我们在这场意识形态对抗中的胜利告终。未来，资本和最富裕阶层的收入将为民众的社会保障提供资金。这一象征性的举措标志着人民战胜大资本的伟大胜利。法国战胜金融，就是全体人民团结起来战胜昔日统治者的胜利。我们关于经济的辩论暂时告一段落，但我们已经为子孙后代奠定了基础。因此，我们仅通过几项改革，就完成了这场革命。"
 france_md.223.a: "这是法国人民的伟大胜利。"
 france_md.224.t: "人民确认了国家的作用"
 france_md.224.d: "上周辩论的结果很明确：民众不希望推翻现有的经济体制。这是否是因为他们每天在电视上被新自由主义宣传狂轰滥炸？或许如此，但我们必须接受他们的选择，因为这才是唯一重要的选择。至少我们没有为了维持经济体制而削减其他公共服务，但我们的继任者为了维持体制运转，可能会对社会更加冷酷无情。我们将确保这种情况不会发生。"
 france_md.224.a: "这并非我们所期盼的胜利，但我们只能接受这个结果了。"
 france_md.225.t: "人们选择在其他地方削减开支。"
 france_md.225.d: "如果我们早知道结果会是这样，或许就不会把这场辩论提交公投了，但现在想这些已经太晚了。事实上，人民已经决定了我们社会制度的命运。他们建议未来的立法机构保留必要的公共服务，但削减其他公共开支。他们的主要目标很可能是公务员和许多他们认为并非必要的补贴。社会保障体系的资金将会得到保障，但我们却为自由主义这头“狼”入侵国家财政提供了正当理由。只要我们执政，我们就能阻止这一切，但谁又能预料未来的政府会怎么做呢？"
 france_md.225.a: "这项宪法改革并没有完全按照计划进行。"
 france_md.226.t: "社会问题辩论（第一部分）："
 france_md.226.d: "法国的少数族裔融合体系长期以来都建立在共和教育和精英制度的“熔炉”理念之上，但这一原则正逐渐显露出其局限性：社会流动性下降导致失业率上升和社群意识淡漠。如今，辩论的焦点在于如何改革这一体系。推动更具包容性的模式可能会动摇沿袭数代的既有框架，但维持现状只会给反对者提供机会，使其更加僵化。无论如何，我们在此做出的选择将影响法国未来几代人的命运。"
 france_md.226.a: "为了让尽可能多的人过上更好的生活，这个体系必须更具包容性。"
 france_md.226.b: "让公民们自己决定这个问题。"
 france_md.227.t: "人民选择适应这套体系"
 france_md.227.d: "辩论的结果似乎倾向于使现有体制适应新千年固有的多样性。我们当然需要投入资源，但我们的体制通过允许这种包容性，不会使涌入我国的新人才流失。通过让每个人都能拥有触手可及的未来，我们既有助于维护和平，又有利于国家的长远发展。"
 france_md.227.a: "我们有很多东西要向他人学习。"
 france_md.228.t: "人民选择强化现有制度"
 france_md.228.d: "尽管我们做出了努力，但似乎当今社会尚未准备好质疑我们共和国的根本原则。法国的一体化体系似乎仍然拥有光明的前景。这次投票证实了法国民众对这一体系的忠诚，尽管它存在诸多弊端，但其存在本身就具有价值。从长远来看，这一体系始终可以改革，但我们错失了推翻另一座堡垒的机会。"
 france_md.228.a: "可惜"
 france_md.229.t: "社会问题辩论（第二部分）："
 france_md.229.d: "宗教信仰自由是​​本世纪最热门的议题之一。自法兰西第三共和国的世俗主义法律颁布以来，法国一直竭力捍卫宗教信仰自由，即便这意味着牺牲公民自身的自由，尤其体现在禁止在公立小学佩戴宗教标志的规定上。这项规定如今已成为全国激烈辩论的焦点。放宽这一法律框架或许能够缓和不同社群之间的关系，但这同时也意味着要质疑一项公民珍视的根本性法律。"
 france_md.229.a: "我们的社会必须适应宗教团体的认可需求。"
 france_md.229.b: "让公民们自己决定这个问题。"
 france_md.230.t: "人民选择放松世俗主义"
 france_md.230.d: "关于世俗主义的辩论最终以放宽现行法律框架而告终。佩戴宗教标志将在比以往更多的地方被正常化。各种信仰也将在社会中拥有更大的代表权，同时维护国家至上和政教分离的原则。这是一项胜利，因为我们成功地保留了旧制度的精华，同时确保了最具争议的部分得到放松。我们只能希望，这一对基本法律的突破不会导致对宗教自由保护框架的持续质疑。在这方面，我们可以相信我们的继任者。"
 france_md.230.a: "应该会很顺利。"
 france_md.231.t: "人民选择加强世俗主义法律"
 france_md.231.d: "我们并未预料到，就世俗主义展开辩论竟会催生出比原有制度更为严苛的体系。这是一项值得承担的风险，而我们也确实承担了。如今，宗教符号在公共机构中的容忍度将进一步降低。我们的先辈是否预见到我们会朝着这个方向走得如此之远？我们已身处此地，并将拭目以待这些变化将把我们引向何方。可以肯定的是，我们所追求的宽容理想似乎比以往任何时候都更加遥不可及。"
 france_md.231.a: "至少良心自由仍然得到保障。"
 france_md.235.t: "建设明日共和国"
 france_md.235.d: "既然我们的使命已经开启，现在是时候兑现我们最令人期待的承诺：建立第六共和国。这个我们希望通过辩论而非强加的方式建立的新共和国，将在未来数月内占据我们公民的精力，为他们奠定未来社会的基础。我们或许需要不时引导辩论，防止其偏离正轨，但过度干预可能会失去人民的信任。这项工程必须贯彻到底，而且速度要足够快，以免给人留下我们是在拖延民主进程的印象。"
 france_md.235.a: "第五共和国走向终结"
 france_md.236.t: "第六共和国失败了"
 france_md.236.d: "数周以来，辩论场所空无一人，第六共和国的进程陷入停滞，并非因为战争或危机，而是因为民众的漠不关心。由于组织辩论和落实公民意见耗时过长，我们让曾经激发起来的民众热情逐渐消退。我们改变体制的机会正在悄然流逝。我们仍然可以推进一些常规改革，但规模远不及预期，而且我们未能纠正宪法 - 国家最高法律 - 中存在的种种不公。"
 france_md.236.a: "我们错过了改变体制的机会"
 france_md.238.t: "法国对我们实施禁运"
 france_md.238.d: "法国已宣布对我们实施全面禁运，涵盖从物资运输到普通贸易的一切领域。自从“不屈法国”当选以来，巴黎在巴勒斯坦问题上对我们的措辞日益强硬，指责我国政府煽动地区冲突，如今更是直接对我们实施禁运。更糟糕的是，他们还在游说欧洲其他国家效仿。我们的欧洲贸易伙伴至关重要，我们绝不能让这场运动得逞。"
 france_md.238.a: "他们说服不了多少人。"
 france_md.239.t: "法国要求我们对以色列实施禁运"
 france_md.239.d: "在法国决定对以色列实施禁运后，法国外交官联系我们，敦促我们采取同样的行动。他们列举了以色列对邻国的侵略性政策、由此造成的地区动荡以及当地的人道主义危机作为禁运的理由。这些论点并非毫无道理，而且我们相当一部分选民也支持这些观点。然而，这样的行动可能会使我们在国际上付出沉重的代价，而且我们也没有任何地缘政治利益促使我们与以色列盟友决裂。我们应该如何抉择？"
 france_md.239.a: "以色列国当然必须遏制其扩张主义政策。"
 france_md.239.b: "我们不会抛弃我们的以色列伙伴。"
 france_md.240.t: "法国提议帮助稳定我国局势"
 france_md.240.d: "经过一个世纪的殖民统治和数十年的新殖民主义之后，法国在非洲的政策似乎有所转变。他们提出帮助我国稳定局势，同时确保减少对我国的控制。这无疑是个好消息，我国比以往任何时候都更需要这份援助。然而，这份援助很可能附带一些必要的承诺，例如和平与民众情绪的缓和。我们曾经的殖民者似乎已经开始反思其行为的后果。我们是否也应该如此呢？"
 france_md.240.a: "援助总是受欢迎的。"
 france_md.240.b: "我们不需要他们了；他们在这里已经毫无意义了。"
 france_md.244.t: "法国推动社会立法"
 france_md.244.d: "继法国“不屈法国”运动取得胜利后，我国也涌现出许多呼吁效仿法国法律的声音。法国左翼运动的成功似乎正波及到我们以及其他欧盟国家。在我国各地，各种运动都在组织起来，要求与法国邻国一样进行立法改革。这些提案大多涉及人权、社会正义和生态环境。我们是否应该接受并采纳这些法律？这或许会造福我们的同胞。"
 france_md.244.a: "这些法律可以成为我们宪法的良好补充。"
 france_md.244.b: "不，那不可能。"
 france_md.245.t: "法国力推生态立法"
 france_md.245.d: "法国生态党的胜利震惊了整个欧洲：我们联盟的创始成员国如今却呼吁制定气候立法，而非欧盟赖以建立的自由贸易和增长叙事。活动人士已经开始将这股势头传递到我们自己的国家。我们是否应该采纳他们的部分纲领 - 这或许是对进步力量的一种姿态，但却会阻碍经济发展 - 还是应该在局势进一步朝着他们预想的方向发展之前，明确表明我们的立场？"
 france_md.245.a: "我们也应该保护自己免受气候变化的影响"
 france_md.245.b: "什么气候变化？"
 france_md.246.t: "绿色法国接管委员会"
 france_md.246.d: "在最新一届欧盟委员会选举中，生态环保似乎取得了胜利。继法国生态党获胜后，欧洲生态党（绿党）也成功晋升至欧盟最高层，这显著表明欧盟在应对气候问题方面正迈出重要一步。此次胜利不仅提高了公民的环保意识，也增强了他们对一个认真对待气候安全的欧洲的信心。"
 france_md.246.a: "我们正朝着绿色欧洲迈进吗？"
 france_md.248.t: "生态学家议员在欧洲议会采取更多行动"
 france_md.248.d: "自法国当选以来，欧洲议会中生态学家议员的数量似乎呈倍增之势。这似乎表明，欧盟成员国对生态问题的关注度正在回升。这些议员的数量及其影响力似乎与日俱增，正日益左右着欧洲议会的权力平衡，甚至可能成为未来欧盟委员会选举的关键因素。生态学家对欧盟日益增长的影响力似乎也波及到了我国，不仅提升了我国生态政党的支持率，也增强了人们对一个更加关注健康和生态问题的欧盟的信心。"
 france_md.248.a: "他们在欧洲议会不会取得多大成就。"
 france_md.249.t: "法国提议设立绿色转型基金"
 france_md.249.d: "这次，我们的法国朋友提出了一项新方案。他们提议在欧洲各国之间设立一个参与式基金，以帮助欧洲各国实现生态转型。该基金旨在帮助我们尽可能地发展绿色能源。他们强调，这一工具能够确保我们的能源主权，并使其可持续发展。然而，这一工具的设立需要公民社会更积极地参与这些投资。我们应该参与吗？"
 france_md.249.a: "我们在哪里签字？"
 france_md.249.b: "不用了，我们自己做得很好。"
 france_md.250.t: "法国提议减少欧洲碳排放"
 france_md.250.d: "我们的法国生态学家朋友们带着一项大幅削减碳排放的方案回来了，这项方案在欧盟最终敲定绿色协议之际，向我们和我们的邻国都提出了。他们认为，减少化石燃料的使用将使我们的人民呼吸更顺畅，并增强欧盟的能源主权，因为我们成员国中没有一个是石油生产国。这样的能源结构调整成本高昂且耗时漫长，但如果与我们主要的化石燃料来源国俄罗斯的紧张关系最终升级，它可能起到决定性作用。"
 france_md.250.a: "他们说得对；化石燃料使我们变得脆弱。"
 france_md.250.b: "我看不出我们怎么会和俄罗斯发生冲突。"
 france_md.251.t: "法国干涉我国商业政策"
 france_md.251.d: "我们的驻法国大使报告说，欧盟主席团希望我们对食品行业进行监管：他们声称，我们的一些产品不适合食用，特别是使用欧盟禁用的生长激素生产的肉类。如果不遵守规定，我们的产品将面临保护主义措施，并可能迫使欧盟其他成员国效仿，尽管法国自身的农产品行业显然也希望将我们的出口产品贴上“不公平竞争”的标签。监管可以让我们的人民从农业中获得更多益处，但也会限制我们农产品行业的增长。"
 france_md.251.a: "他们说得对；这些规定是必要的。"
 france_md.251.b: "我在牛群里放我想要的饲料。"
 france_md.252.t: "法国提议对巴西设立海关壁垒"
 france_md.252.d: "我们的法国伙伴敦促我们禁止巴西进口食品，起因是巴西拒绝在其农产品生产中实施欧洲的健康限制，导致南美食品价格更低，但更有可能含有对我国公民有害的成分。欧洲企业称之为不公平竞争；金融家则称之为自由贸易。显然，法国自身的食品行业也助长了这种抱怨，但无论如何，我国人民面临的健康风险是真实存在的。"
 france_md.252.a: "他们说得对；这是不公平竞争。"
 france_md.252.b: "那么，在这一切之中，自由贸易又该如何看待呢？"
 france_md.253.t: "法国干涉我国商业政策"
 france_md.253.d: "我们的驻法国大使报告说，欧盟主席团希望我们对制造业和采掘业进行监管：我们的大部分产品都无视欧洲工业标准，却大量涌入欧洲市场，而欧洲企业则将由此造成的贸易失衡称为不公平竞争。我们需要欧洲作为贸易伙伴，拒绝遵守他们的标准可能会导致我们的商品进口受到限制，这将对我们造成更大的损害。遵守标准将使我们能够以对人民和地球更负责任的方式进行生产，但这将限制我们工业部门的增长。"
 france_md.253.a: "我们不能失去我们的欧洲伙伴"
 france_md.253.b: "他们需要这些廉价产品，他们也知道这一点。"
 france_md.254.t: "法国提议对中国设立关税壁垒"
 france_md.254.d: "我们的法国伙伴敦促我们禁止中国进口商品，起因是中国拒绝将欧洲的工业限制措施应用于自身生产，导致制成品和原材料价格更低，但生产条件却更可能存在问题。欧洲企业称之为不公平竞争，而金融家则称之为自由贸易。显然，法国自身的工业部门也助长了这种抱怨，但这些产品对地球和我们自身产业造成的损害却是实实在在的。"
 france_md.254.a: "他们说得对；这是不公平竞争。"
 france_md.254.b: "那么，在这一切之中，自由贸易又该如何看待呢？"
 france_md.255.t: "法国干涉我国商业政策"
 france_md.255.d: "我们的驻法国大使报告说，总统府希望我们对本国的石油开采和炼制行业进行监管：我们很多石油产品都无视欧洲的开采和工业标准，却大量涌入欧洲市场，而欧洲的石油行业则将由此造成的贸易失衡称为不公平竞争。我们需要欧洲，拒绝遵守他们的标准可能会导致我们的商品进口受到限制，这将对我们造成更大的损害。遵守这些标准将使我们能够以对人民和地球更负责任的方式进行生产，但同时也会限制我们石油公司的发展。"
 france_md.255.a: "我们不能失去我们的欧洲伙伴"
 france_md.255.b: "祝你们这个冬天取暖顺利。"
 france_md.256.t: "法国提议对俄罗斯设立海关壁垒"
 france_md.256.d: "我们的法国伙伴敦促我们限制俄罗斯碳氢化合物的进口，原因是俄罗斯拒绝遵守欧洲的开采和提炼法规，在对地球环境极其恶劣的条件下生产燃料，由此引发了争端。一些欧洲采掘业企业称这是不公平竞争，并希望减少对外国势力的依赖，但俄罗斯构成的威胁可能比我们想象的要小，而且他们宽松的标准也降低了我们的燃料成本。"
 france_md.256.a: "他们说得对；我们应该减少对燃料的依赖。"
 france_md.256.b: "那么，在这一切之中，自由贸易又该如何看待呢？"
 france_md.257.t: "法国提议围绕铁路制定一项宏伟计划"
 france_md.257.d: "我们的法国合作伙伴带来了一个新项目：将欧洲的货运重心从公路转向铁路。这一理念由法国生态学家倡导，旨在提高货物运输的效率和环保性。这需要一个高效统一的铁路网络，而我们目前恰恰缺乏这样的网络，例如西班牙不同的铁路轨距仍然阻碍着跨境运输。鉴于货运流通对欧盟至关重要，而且该网络还能促进人员流动，因此即使与蓬勃发展的公路运输行业相比成本较高，也值得推进。"
 france_md.257.a: "算我们一个。"
 france_md.257.b: "我更喜欢自己的卡车。"
 france_md.258.t: "法共胜利扰乱内政"
 france_md.258.d: "法国共产党的胜利震动了整个欧洲：一个为对抗共产主义阵营而建立的联盟的创始成员国，如今却在敦促自己的人民加入共产主义的斗争，而这重新唤起了许多国家以为早已埋葬的对苏联的恐惧。煽动者已经开始将这一势头传递到我们国内。我们应该采纳他们的部分议程，以经济发展为代价对我国进步力量做出表态，遏制抗议浪潮，又或者我们在局势进一步脱离我们掌控之前明确表态？"
 france_md.258.a: "这主意不错"
 france_md.258.b: "要我赤化还不如去死"
 france_md.259.t: "共产法国伸出援手"
 france_md.259.d: "自建国以来，我们的国家不是处于俄罗斯的统治下，就是处于其阴影下。然而，这一次似乎真的有援助即将到来。法国外交官向我们提议建立战略伙伴关系，以应对可能与俄罗斯发生冲突的局面。目前这还不算什么：一些文件，一些装备，但最重要的是对未来支持的承诺。最令人惊讶的是，这一支持竟来自共产主义的法国。这不禁让人回想起，在法共还是斯大林主义政党时，我们从苏联那里遭受的压迫。在明知这只会使俄罗斯对我们的立场更加强硬的情况下，我们要选择信任法国和欧洲吗？"
 france_md.259.a: "简直是雪中送炭"
 france_md.259.b: "我们能管好自己"
 france_md.260.t: "法国提议支持对抗俄罗斯"
 france_md.260.desc: "摆脱苏联压迫的几十年并未使我们消除对俄罗斯卷土重来的恐惧，但法国提出在发生冲突向我们提供援助，因为他们与我们一样担心俄罗斯的扩张主义可能再度转向东欧。其提议涵盖装备租借到技术交流，这些援助或许能在北约动员之前为我们赢得一线生机，但前提是北约和欧洲当真会来援手。接受援助将损害与莫斯科的关系；或许维持关系才是我们更稳妥的道路。"
 france_md.260.a: "我们只需要装备来吓阻俄国人"
 france_md.260.b: "我们需要训练以面对高烈度战争"
 france_md.260.c: "从长远来看，我们需要生产更多武器装备"
 france_md.260.d: "我们不需要援助，俄罗斯不是我们的敌人"
 france_md.261.t: "法国提议正式确立同盟"
 france_md.261.desc: "曾经的斯大林主义政党在法国取得胜利，这引出了我们与西欧潜在盟友关系的问题。该党已表达出对西方和美国的敌意，并展现出与旧苏联在意识形态上的亲近，甚至对其遗产做出积极评价。巴黎已多次发表声明，谴责美帝国主义以及欧洲盲目追随美国的做法，而今他们向我们提议合作，范围可能从贸易到全面的军事与战略伙伴关系。我们是否应当仅凭他们过去对苏联的效忠就认为他们值得信任？"
 france_md.261.a: "与您做生意总是令人愉快"
 france_md.261.b: "的确，我们必须保护自己免受美帝国主义侵害"
 france_md.261.c: "没有什么能分离共产主义兄弟情谊"
 france_md.261.d: "我们不与赤色分子合作"
 france_md.262.t: "俄罗斯同意扩大贸易关系"
 france_md.262.d: "俄罗斯对我们扩大关系的提议做出了积极回应。他们提出与我们分享其工业和采掘业技术，条件是我们帮助他们发展核能和第三产业。这是我们与俄罗斯关系取得的重大进展。然而，我们提出的建立潜在战略伙伴关系的提议却被搁置了。或许俄罗斯尚未给予我们足够的信任，但这迈出的第一步是值得肯定的。虽然还需要时间，但这项协议标志着帝国主义末日的开始。"
 france_md.262.a: "信任总是需要长期积累的。"
 france_md.263.t: "俄罗斯同意与我们建立军事和贸易伙伴关系"
 france_md.263.d: "俄罗斯对我们提出的扩大双边关系的提议做出了积极回应。他们表示愿意与我们分享其工业和采掘业方面的知识，条件是我们帮助他们发展核能和第三产业。这是我们与俄罗斯关系取得的重大进展。此外，俄罗斯还提议将这一伙伴关系扩展至军事领域，旨在共同训练我们，以便在帝国主义威胁采取行动时做好准备。他们将为我们提供训练场地和苔原作战方面的专业知识，而我们将向他们传授我们在沙漠和丛林作战方面的经验。"
 france_md.263.a: "我们团结起来，势不可挡"
 france_md.264.t: "俄罗斯提议结盟"
 france_md.264.d: "我们没想到俄罗斯伙伴会做出如此积极的回应。他们提议我们结成反西方帝国主义联盟。这一联盟融合了经济和地缘战略要素，将使我们能够在经济、军事和外交层面做好与西方对抗的准备。我们将交流知识和工业传统，共享训练场地，并在发生冲突时提供互助保障。自第一次世界大战以来，我们从未与他们缔结过这样的联盟；或许这是一个不祥之兆。然而，我们非常欢迎这一联盟，它将使我们能够在一个对共产主义充满敌意的世界中生存下去。"
 france_md.264.a: "西方帝国主义对我们无能为力。"
 france_md.265.t: "俄罗斯拒绝扩大与我们的关系"
 france_md.265.d: "令我们的外交官大为震惊的是，俄罗斯似乎拒绝与法兰西共和国进行任何形式的合作。利益分歧，缺乏信任。看来他们对苏联的记忆早已淡去。或许西方的腐败最终还是波及到了俄罗斯，这个曾经抵御美国帝国主义的堡垒。有一点可以肯定：我们孤立无援，身处一个不理解我们、并将永远对我们充满敌意的欧洲。"
 france_md.265.a: "我们才是真正的共产主义者！"
 france_md.266.t: "法国与欧盟在移民问题上发生冲突"
 france_md.266.d: "我们的国民阵线同事已经领导法国几个月了，自上任以来，他们不断批评欧洲的移民政策过于宽松。自由党和社会主义势力长期以来一直在联盟内部压制我们的声音，但随着我们的盟友现在在巴黎取得胜利，他们不能再忽视我们了。我们自己的人民本身就拥护民族主义理想，他们欢迎这一胜利，因为它证明我们的声音在迷失方向的欧洲始终是正确的。"
 france_md.266.a: "这是自由主义走向衰落的开始。"
 france_md.267.t: "法国与欧盟在移民问题上发生冲突"
 france_md.267.d: "自国民阵线在法国赢得大选以来，批评之声涌入欧洲议会，这一转变似乎在欧洲政坛引发了一股浪潮，民族主义和疑欧派政党的支持率不断攀升。辩论的焦点集中在移民问题上，议员们日益反映出民意转向民族主义的内政理念，谴责他们认为过于宽松的政策。我们自己的选民也不例外，法国大选引发的动荡也开始撼动他们。我们应该抵制这种民族主义倾向，还是应该接受正在形成的新的欧洲格局？"
 france_md.267.a: "他们说的没错。"
 france_md.267.b: "欧洲已经为民族主义付出了代价。"
 france_md.268.t: "法国在布鲁塞尔胜诉"
 france_md.268.d: "法国政治政策出现了新的转变：尽管该党历来持疑欧立场，但它已与欧盟达成协议，利用在国内和盟友中开展的疑欧运动，使布鲁塞尔意识到非法移民构成的威胁，并利用这一影响力迫使欧盟遣返非法移民。这对该党担任轮值主席国而言是一项真正的胜利。我们自己的民族主义政府也面临着同样的主权问题：我们是否应该为了获得欧盟的利益而放松自身的疑欧立场？要知道，我们党内许多人将疑欧立场视为建党之本。"
 france_md.268.a: "既然我们可以直接离开欧洲，为什么还要谈判呢？"
 france_md.268.b: "这很明智，我们也应该这样做。"
 france_md.269.t: "法国倡导欧洲认同"
 france_md.269.d: "在布鲁塞尔就移民问题取得让步后，法国领导层似乎正在彻底放弃其疑欧言论，甚至在欧盟与自由主义和社会主义倾向保持距离的前提下，积极倡导加入欧盟。民族主义运动在欧盟内部似乎正在蓬勃发展，使得“民族欧洲”再次具有吸引力，尽管这种转变可能会令那些坚决反对欧盟的选民感到不安。我们是否应该效仿法国的做法，尤其是在欧盟领导权不断向我们倾斜的情况下？"
 france_md.269.a: "这是一个非常好的举措。"
 france_md.269.b: "一个人不可能同时既是民族主义者又是欧洲人"
 france_md.270.t: "法国提议投资我国国防"
 france_md.270.d: "近年来，欧洲大陆爆发新战争的可能性似乎比以往任何时候都更高。尽管我们的联盟尚未遭受任何侵略，但我们邻国俄罗斯令人担忧的举动似乎印证了这种忧虑。法国向我们提出了一项提议：他们建议通过投资帮助我们建设军工复合体。有了这些武器工厂，我们就能有效地为将来必须为保卫国家和欧洲伙伴而战的那一天做好准备。然而，允许他们投资我们的军备将使我们更加依赖他们，这或许并非明智之举。此外，我们爱好和平的民众可能会对这种资本的动员感到担忧。"
 france_md.270.a: "感谢您提供的这项关键帮助"
 france_md.270.b: "无需担心"
 france_md.271.t: "法国承认我们在乌克兰的宣称"
 france_md.271.d: "自从法国政权落入国民阵线以来，他们对我们的支持日益增强，与一贯反对我们东进野心的欧洲决裂。他们不仅公开支持我们对乌克兰领土的诉求，还允许我们进入他们的领土和港口调动军队和物资，这不仅简化了我们的后勤保障，也削弱了未来欧洲可能实施的禁运。这一新盟友让我们更加坚定了走向战争的道路，而这场战争或许终将到来。"
 france_md.271.a: "第一块多米诺骨牌倒下"
 france_md.271.b: "我们无意与乌克兰兄弟开战。"
 france_md.272.t: "法国提议扩大合作"
 france_md.272.desc: "在发表了许多对我们有利的声明并达成了多项协议之后，法国似乎准备扩大与我们的关系，并将自身塑造成道德和信仰的捍卫者，而它现在认为欧洲和西方已经走向颓废。如果我们认为这个新盟友拥有足够的潜力，我们的关系可以从贸易发展到全面的军事和战略伙伴关系；当然，如果我们仍然对与欧盟保持良好关系抱有信心，我们也可以拒绝。"
 france_md.272.a: "我们的经济将从中受益"
 france_md.272.b: "我们的经济和军队都将受益"
 france_md.272.c: "世界将为我们颤抖"
 france_md.272.d: "我们无意与法国合作。"
 france_md.273.t: "俄罗斯同意扩大与我们之间的贸易关系"
 france_md.273.d: "俄罗斯对我们扩大关系的提议做出了积极回应。他们提出与我们分享其工业和采掘业技术，条件是我们帮助他们发展核能和第三产业。这是我们与俄罗斯关系取得的重大进展。然而，我们提出的建立潜在战略伙伴关系的提议却被搁置了。或许俄罗斯尚未给予我们足够的信任，但这迈出的第一步意义重大。这需要时间，但这项协议标志着极端全球主义者的末日即将到来。"
 france_md.273.a: "信任总是需要长期积累的。"
 france_md.274.t: "俄罗斯同意与我们建立军事和贸易伙伴关系"
 france_md.274.d: "俄罗斯对我们提出的扩大双边关系的提议做出了积极回应。他们表示愿意与我们分享其工业和采掘业方面的知识，条件是我们帮助他们发展核能和第三产业。这是我们与俄罗斯关系取得的重大进展。此外，俄罗斯还提议将这一伙伴关系扩展至军事领域，旨在共同训练我们，以便在极端全球化威胁采取行动时做好准备。他们将为我们提供训练场地和苔原作战经验，而我们将向他们传授我们在沙漠和丛林作战方面的经验。"
 france_md.274.a: "我们团结起来，势不可挡"
 france_md.275.t: "俄罗斯提议结盟"
 france_md.275.d: "我们并未预料到俄罗斯伙伴会给予如此积极的回应。事实上，他们提议我们结成联盟，以确保在遭受外国侵略时能够相互援助。这一联盟融合了经济和地缘战略要素，将使我们能够从经济、军事和外交层面做好准备，应对与世界其他国家的对抗。这一联盟将赋予我们力量，让我们能够战斗到底，捍卫自身免受邻国深陷其中的极端全球化的侵蚀。自第一次世界大战以来，我们从未与他们缔结过这样的联盟；或许这是一个不祥之兆。然而，这一联盟的建立令人欣喜，也是我们政治进程中的一项重大胜利。"
 france_md.275.a: "我们免受自由主义颓废的影响"
 france_md.276.t: "俄罗斯拒绝扩大与我们的关系"
 france_md.276.d: "令我们的外交官大为震惊的是，俄罗斯似乎拒绝与法兰西共和国进行任何形式的合作。利益分歧，缺乏信任。或许西方腐败最终还是波及到了曾经强大而骄傲的俄罗斯。然而，这种转变并非剧烈；或许我们终究没有那么多共同之处。我们肯定能在欧洲大陆找到其他民族主义盟友。"
 france_md.276.a: "真可惜。"
 france_md.277.t: "法国提议保护我们免受俄罗斯的影响"
 france_md.277.d: "多年来，俄罗斯似乎一直在非洲大陆进行投资，并主动提出帮助打击在原法属非洲国家蓬勃发展的圣战和独立叛乱。法国和俄罗斯显然在非洲大陆存在着影响力之争。两国价值观相冲突：西方自由主义与威权主义。在非洲国家成为俄罗斯影响力目标，且这种影响力有时还会加剧地区少数民族之间紧张关系的情况下，法国提议代替俄罗斯向我们提供援助，以削弱俄罗斯的影响。然而，这意味着我们要与前殖民者走得更近，这或许并非明智之举。我们该如何抉择？"
 france_md.277.a: "他们说得对；俄罗斯的影响力很危险。"
 france_md.277.b: "我们以前的殖民者。当然不是。"
 france_md.278.t: "法国公社退出欧盟"
 france_md.278.d: "几个月前，法国宣布结束共和国体制，建立法兰西公社 - 一个基于革命共产主义的新实体。不久之后，他们便退出了欧盟 - 一个建立在经济自由主义基础上的联盟，而他们如今的新方向恰恰摒弃了这种自由主义。他们的退出是迅速而彻底的，显然没有丝毫谈判的意愿。这对一个以防止新的冲突为首要目标的欧洲大陆来说，无疑是一个不祥之兆。如此突然的退出，再加上如此革命性的意识形态，迟早都将面临挑战。"
 france_md.278.a: "这在意料之中。"
 france_md.279.t: "法国公社给我们的政治施加压力"
 france_md.279.d: "正如预料的那样，法国公社退出欧盟并非死路一条；他们刚刚摆脱欧盟的束缚，就已经开始重振经济，其成功也开始赢得国内那些对欧洲自由价值观缺乏认同感的人们的赞赏。法国情报机构已被改造成国际宣传机构，正在帮助训练这些煽动者，我们应该认真对待此事，以免重蹈覆辙。我们可以捍卫欧洲价值观及其带来的和平，也可以迎合他们的议程来遏制即将到来的暴力，但这也就意味着我们要拥抱共产主义的、反欧洲的政治立场。"
 france_md.279.a: "如果我们能在他们自己的游戏中击败他们，那么战斗就没有意义"
 france_md.279.b: "我们必须与这些极端分子作斗争。"
 france_md.280.t: "法国公社邀请我们参加世界革命峰会"
 france_md.280.d: "法国革命共产党在国内巩固权力后，如今意图输出革命，邀请我们参加世界革命峰会，因为我们自己的政府已经站在了新成立的法兰西公社所珍视的共产主义价值观一边。他们决心将这些价值观传播到全世界，而这次邀请无疑是对我们是否会追随的考验。鉴于众多大国永远不会接受这样的革命，这样的革命必然会伴随着战争，而且很可能是一场血腥的战争。共产主义理想对我们而言弥足珍贵，但我们是否准备好为了实现这些理想而让公民的生命冒险呢？"
 france_md.280.a: "算我们一份，革命万岁！"
 france_md.280.b: "历史已经证明，自由不是靠枪炮换来的。"
 france_md.281.t: "皇帝对法国军队进行深度改革"
 france_md.281.d: "皇帝陛下已对我国军队进行深度改革，旨在使其更好地适应未来可能发生的战争。这项改革需要大量投入和我们全神贯注，因此会减少我们当前的战备能力，在恢复军队建设之前，我们将面临一段相对脆弱的时期。第一阶段的改革将重点放在军队领导层本身，他们认为现有领导层不适合即将到来的改革。指挥系统的重组预计耗时不到一年，在这一年中，我们必须限制军事行动，以求长远发展。"
 france_md.281.a: "这些改革是必要的"
 france_md.282.t: "总参谋部改革已完成"
 france_md.282.d: "我们的改革以创纪录的速度完成。虽然有人抵制，但我们大多数总参谋部人员都接受了指挥链的重组。这些改革不仅提高了领导效率，也为有才华的新将敞开了大门，尽管这意味着需要接受更高级的训练，但这仅仅是我们军队转型的第一步。在接下来的几个月里，进一步的改革将明确我们军队的手段和目标，并为我们的军工联合体提供更清晰的指令。这是一场长期的赌博，而我们似乎已经赢得了胜利。"
 france_md.282.a: "我们立场坚定。现在我们可以着手处理更重要的事情了。"
 france_md.283.t: "我们军队的脊梁"
 france_md.283.d: "针对我们战场作战方式的第一轮改革已经出台，它界定了我们在与未来对手的任何大规模冲突中应采取的战略。自二战后重组以来，我们的军队一直倾向于以机动性和机动性为基础的进攻战略，而我们可以通过将作战理论和装备命令的核心放在突击坦克和快速目标夺取上来进一步强化这一战略。另一种选择是转而重视步兵，强化其作用和装备，使其能够以更强大的火力应对敌人的反击。这种做法虽然更稳妥，但却会挑战我们过去的作战理论。"
 france_md.283.a: "步兵一直扮演着核心角色；这是最安全的方法"
 france_md.283.b: "自冷战以来，我们的军队一直围绕着机动作战而建立，这一点没有理由改变。"
 france_md.284.t: "我们的火力"
 france_md.284.d: "最后一波理论改革已经到来，迫使我们决​​定如何让我的军队远程摧毁敌军。我们长期以来一直保持着炮兵和航空兵的平衡，但未来的道路需要专业化分工。我们的凯撒炮机动性强且火力强大，使我们能够在安全的情况下炮击敌军。我们的空军和直升机火力多样，但仍然容易受到敌方防空系统的攻击，失去制空权可能会带来灾难性的后果。我们必须在最小风险和更强大的火力之间做出选择。"
 france_md.284.a: "火炮更具成本效益"
 france_md.284.b: "我们的航空力量非常高效；不用它是愚蠢的。"
 france_md.285.t: "我们对欧盟的立场"
 france_md.285.d: "长期以来，我国将欧盟置于自身发展之上。忽视自身发展和安全，导致我们陷入前所未有的民主危机，尽管最终我们取得了胜利。但今天，我们有机会扭转这一趋势。摆脱了过去的民主体制束缚，我们可以自由选择，也可以选择退出欧盟。然而，一夜之间退出欧盟可能会对刚刚从自由主义压迫中恢复过来的国家造成沉重打击。我们应该与欧盟谈判，以经济手段重返欧盟，还是应该彻底退出欧盟，与欧盟决裂？"
 france_md.285.a: "要么掏空布鲁塞尔的口袋，要么我们就离开！"
 france_md.285.b: "欧盟已经给我们造成了足够的伤害。法国脱欧！"
 france_md.286.t: "法国退出欧盟"
 france_md.286.d: "在我们的法国伙伴国发生重大动荡之后，自称奉行波拿巴主义的民族主义运动夺取了法国的控制权。他们立即着手摧毁法国境内残存的亲欧情绪。如今，他们宣布法国退出欧盟。他们断然拒绝谈判。这些民族主义运动的胜利不仅在欧洲一体化进程中造成了裂痕，也为欧盟内部的疑欧派树立了榜样。"
 france_md.286.a: "民族主义对我们的欧盟构成威胁"
 france_md.287.t: "欧盟屈服于我们的要求"
 france_md.287.d: "看来我们当初决定重返欧洲机构是正确的。我们不仅避免了经济危机，还从欧洲中央银行获得了资金。这可谓是一次成功的金融运作！毫无疑问，我们最终会在战场上与对手正面交锋，但就让他们继续沉浸在幻想中吧。有一点可以肯定：我们的对手肯定对我们与欧洲央行的谈判成功感到愤怒。"
 france_md.287.a: "我们的时代终将到来。"
 france_md.288.t: "我们的谈判失败了。"
 france_md.288.d: "我们的尝试大胆却以失败告终。或许是我们要求过高，又或许是未能赢得欧洲对话者的信任。无论如何，欧洲央行拒绝支付我们留在欧盟的费用。这是他们的决定，虽然不符合我们的利益，但这就是现实。现在我们必须决定是否留在欧盟。退出欧盟会付出沉重的经济代价，但留下则意味着我们在欧盟面前的失败。无论如何，无论是否留在欧盟，我们最终都将在战场上与他们正面交锋。唯一的问题是，退出的经济代价是否超过留下的道德代价。"
 france_md.288.a: "脱离欧盟的代价太大了；目前我们负担不起。"
 france_md.288.b: "我们在这里已经无事可做了。"
 france_md.289.t: "法国与欧盟达成协议"
 france_md.289.d: "经过数月的外交施压和脱欧威胁，波拿巴主义法国已迫使欧盟屈服，通过向欧盟成员国提供额外利益来换取留在欧盟的权益。这项协议对我们和我们的伙伴而言是灾难性的：如今法国被一心复仇的民族主义者掌控，谁也无法保证它会遵守规则。法国仍然是欧盟的重要成员，但如今它对整个欧洲大陆构成威胁，而我们的人民却要为其伙伴的任性付出代价。"
 france_md.289.a: "这真的是个好主意吗？"
 france_md.290.t: "新帝国的曙光"
 france_md.290.d: "经过数月的内部动荡和宪政改革，我们成功了。我们成功地铲除了那个可耻共和国的制度和权力。现在，法国必须重拾它本不该失去的地位：一个帝国！为了庆祝帝国的回归，我们准备了一场盛大的庆典，将在全法国进行电视直播。通过这场庆典，我们的人民将感受到我们的力量和我们恢复法国昔日荣光的决心。这场庆典也将向我们的敌人发出一个明确的信息：一场力量的展示。现在他们再也无法忽视我们；在法国收回其应有的权力之前，他们的日子屈指可数了。这一次，没有任何联盟能够阻止我们！"
 france_md.290.a: "帝国必将重现昔日辉煌！"
 france_md.291.t: "法国呼吁民族主义联盟"
 france_md.291.d: "法国民族主义同志的胜利震撼了欧洲，波拿巴家族的外交政策也随之转向反对欧盟及其价值观和未来。如今，他们向我们伸出了橄榄枝，认为我们的政府与他们有着足够的共同点，可以携手合作。与法国达成默契的联盟看似诱人，但谁也无法保证他们之后不会翻脸不认人。我们必须认真权衡利弊。"
 france_md.291.a: "他们走在正确的道路上；我们最好加入他们。"
 france_md.291.b: "我们不认同这种民族主义观点。"
 france_md.292.t: "波拿巴主义法国给我们的政治施加压力"
 france_md.292.d: "正如我们预料的那样，法国的民族主义和反欧言论并非偶然：自从波拿巴家族掌权以来，欧盟就成了世界各地民族主义者的攻击目标。我们部分民众现在担心战争重燃，而另一些人则加入了民族主义阵营，在法国情报部门的广泛支持和训练下，对我国政府发动了破坏性行动。法国情报部门充当着国际宣传机器的角色。我们必须对此高度重视，因为他们的目标是分裂我们。欧盟必须保持团结！"
 france_md.292.a: "欧洲最终将战胜民族主义。"
 france_md.293.t: "被敌人包围"
 france_md.293.d: "如同革命战争时期一样，我们国家必要的变革似乎正在滋生怨恨。在我们重建家园的同时​​，我们的敌人已经开始密谋反对我们，并准备迎战。他们的谨慎不无道理，因为如有必要，我们已做好武力收复失地的准备。无论如何，我们孤立无援，面对的是一个理所当然地将我们视为威胁的欧洲。眼下，我们最紧迫的任务是做好与敌人长期斗争的准备。我们或许能够结成联盟，但主要还是要依靠自身的力量。不过有一点可以肯定：一旦我们战胜了欧洲主义和大西洋主义的威胁，我们将势不可挡。"
 france_md.293.a: "拿破仑击败了多少个联盟？我们会迅速解决它们。"
 france_md.294.t: "法国提议我们加入其联盟"
 france_md.294.d: "我们刚刚收到法国外交官的提议。波拿巴家族认为他们在欧洲孤立无援，四面楚歌，因此向我们求助。他们之所以这样做，是因为他们认为我们国家足够体面，值得与他们结盟。毋庸置疑，这绝非简单的防御性条约，加入该条约会很快使我们卷入一些未必是我们自身造成的冲突。然而，这个联盟或许能帮助我们对抗自己的敌人，而且在其他条件相同的情况下，与他们结盟总比与他们为敌要好。与法国结盟看似诱人，但或许加入他们无异于自取灭亡，因为他们很快就会给欧洲带来战争。"
 france_md.294.a: "我们可以从这一联盟中受益。"
 france_md.294.b: "当然不"
 france_md.295.t: "法国提议我们加入其共产国际"
 france_md.295.d: "统治法国的革命共产主义派别嗜好冲突，他们追求世界范围内的革命，并招募盟友以不惜一切手段将其输出。他们向我们发出号召，尤其因为我们也拥抱了社会主义，认为这是一个在战场上击败资本主义和法西斯主义的机会。然而，这并非简单的防御性条约，加入其中会迅速将我们卷入未必与我们自身有关的冲突。"
 france_md.295.a: "他们说得对；现在是时候输出这场革命了。"
 france_md.295.b: "当然不"
 france_md.296.t: "法国人敦促我们发动进攻"
 france_md.296.d: "我们不懈的民族主义宣传效果太好了：民众深信敌对势力企图毁灭我们，因此期待我们先发制人。民兵已在边境集结，准备与邻国的安全部队对抗，舆论一片哗然。我们必须谨慎行事，切勿过早地吓到这些势力，促使它们结盟对抗我们。"
 france_md.296.a: "是时候清算账目了。"
 france_md.296.b: "我们的时代终将到来。"
 france_md.297.t: "英吉利海峡隧道冲突"
 france_md.297.d: "在新的波拿巴主义领导人的鼓舞下，法国极端民族主义民兵组织在英吉利海峡隧道附近袭击了我们的公民和警察，造成约20人死亡，数十人受伤。我们并非孤军奋战：昨晚，这些组织袭击了法国的大部分邻国，这些邻国与我们一样，都对新的拿破仑帝国表示蔑视。显然，我们已成为他们的首要目标，与波拿巴主义法国的对抗似乎已不可避免。"
 france_md.297.a: "我们必须通过保护其潜在目标来遏制法国的侵略行为。"
 france_md.297.b: "我们必须做好与他们发生冲突的准备。"
 france_md.298.t: "法国边境的小规模冲突"
 france_md.298.d: "在新的波拿巴主义领导人的鼓舞下，法国极端民族主义民兵组织沿着我们与法国的边境袭击了我们的公民和警察，造成约15人死亡，数十人受伤。我们并非孤例：昨晚，这些组织袭击了法国的大部分邻国，这些国家都可能成为波拿巴主义扩张的目标。显然，我们是首要目标，与新成立的拿破仑帝国的对抗似乎已不可避免。"
 france_md.298.a: "我们必须通过保护其潜在目标来遏制法国的侵略行为。"
 france_md.298.b: "我们必须做好与他们发生冲突的准备。"
 france_md.298.c: "无需担心"
 france_md.299.t: "[FROM.GetName]向我们求助"
 france_md.299.d: "面对法国带来的迫在眉睫的新威胁，其他受攻击国家迅速做出反应。与许多其他国家一样，[FROM.GetName] 向我们求助，以抵御潜在的入侵。诚然，他们遭受攻击的时间可能比我们更早。然而，我们真的做好了保护他们的准备吗？我们是否应该牺牲数月来为 [FROM.GetName] 所做的准备？这场危机颠覆了我们的外交政策，援助请求纷至沓来。我们面临两条路：我们可以将 [FROM.GetName] 纳入我们的战略伙伴关系，从而提供援助；或者我们可以让他们独自对抗拿破仑。毕竟，让拿破仑与 [FROM.GetName] 这样的对手周旋，消耗他的体力，也是有其道理的。"
 france_md.299.a: "我们必须保护他们"
 france_md.299.b: "为什么要为[FROM.GetName]而死"
 france_md.300.t: "法国提议我们加入其联盟"
 france_md.300.d: "法国波拿巴主义领袖已激怒了欧洲，他宣称准备发动战争以恢复法国的昔日荣光，如今又向我们伸出了橄榄枝。法国外交官援引历史，回顾拿破仑曾如何援助波兰人民对抗斯拉夫人和日耳曼人的压迫，并提议重续当年的盟约。这样的联盟可以保护我们免受俄罗斯的持续威胁，但也可能将我们拖入无法取胜的战争。"
 france_md.300.a: "我们将成为新的多姆布罗夫斯基和克尼亚泽维奇！"
 france_md.300.b: "为什么要为巴黎而死？我问你。"
 france_md.301.t: "法国提议我们加入其联盟"
 france_md.301.d: "法国波拿巴主义领袖已激怒了整个欧洲，他宣称准备开战以重振法国的辉煌，如今又向我们伸出了橄榄枝。法国外交官援引我们王室的祖先 - 拿破仑的元帅让·巴蒂斯特·贝尔纳多特 - 并提议为了纪念先祖而携手并进。这样的联盟固然能保护我们免受俄罗斯的持续威胁，但也可能将我们拖入无法取胜的战争。"
 france_md.301.a: "是时候恢参军了。"
 france_md.301.b: "过去已成过去。"
 france_md.302.t: "美国是朋友还是敌人"
 france_md.302.desc: "我们已向欧洲为数不多的潜在盟友发出结盟提议，但还有一个问题悬而未决：我们应该如何与美国打交道？在法国大革命时期和拿破仑统治时期，我们与美国保持着良好的关系，因为我们都憎恨英国。但时代变了。第二次世界大战以及美国在欧洲的行动常常与法国的利益相悖，尽管在我们崛起之前，双方关系尚可维持，但华盛顿现在可能会阻碍我们走向霸权之路。"
 france_md.302.a: "提议他们加入我们的联盟"
 france_md.302.b: "他们的商业实力将帮助我们克服国际制裁"
 france_md.302.c: "做好与他们对抗的准备。"
 france_md.302.d: "保障欧洲安全仍然是我们的首要任务。"
 france_md.303.t: "法国提议与我们结盟"
 france_md.303.d: "法国波拿巴主义领导人激怒了欧洲，如今提出结盟，条件是我们不干涉他们的内政。法国外交官强调，拿破仑和革命时期的法国长期以来都是我们的重要盟友。但法国却致力于与其他欧洲列强作战，其中许多是我们的盟友，并且已将英国 - 我们历史上的盟友和宝贵的伙伴 - 列为首要目标。我们是否应该加入法国，冒着与伦敦开战的风险？"
 france_md.303.a: "他们可以信赖我们"
 france_md.303.b: "英国人首先是我们的盟友。"
 france_md.304.t: "法国提议扩大与我国的贸易关系"
 france_md.304.d: "法国波拿巴主义领导人激怒了欧洲，如今却提议扩大与我们的贸易关系。由于与昔日伙伴的敌对关系，法国经济陷入孤立，比以往任何时候都更需要我们的专业知识和工业实力。法国外交官强调，拿破仑和革命时期的法国长期以来都是我们的重要盟友。但法国一直致力于与其他欧洲列强作战，其中大多数是我们的盟友，通过贸易支持其战争可能会招致他们的不满。"
 france_md.304.a: "贸易越多越好。"
 france_md.304.b: "我们绝不会成为他们的同谋。"
 france_md.305.t: "法国退出欧盟"
 france_md.305.d: "在我们的法国伙伴国遭遇重大危机之后，呼吁恢复君主专制的民族主义运动夺取了法国政权。此后，他们着手摧毁法国残存的亲欧情绪。如今，他们宣布法国退出欧盟。他们断然拒绝谈判。这些民族主义运动的胜利不仅在欧洲团结中造成了裂痕，也为欧盟内部所有疑欧派树立了榜样。"
 france_md.305.a: "民族主义对我们的欧盟构成威胁"
 france_md.306.t: "法国保皇党人取得胜利"
 france_md.306.d: "法国保皇党同志的胜利震惊了整个欧洲：一个拥抱民族主义的欧盟支柱，足以激怒布鲁塞尔。保皇党的外交政策一直针对欧盟及其价值观和未来，正如我们保皇党人长期以来一直与试图让我们噤声的欧盟抗争一样。在整个欧洲，法国的例子似乎鼓舞了反对欧洲官僚机构的浪潮。我们自己的国家已经投身于保皇主义事业，因此法国的胜利也是欧洲各地民族主义者的胜利。"
 france_md.306.a: "欧洲民族主义的胜利"
 france_md.307.t: "法国王国向我们的政治施加压力"
 france_md.307.d: "正如我们预料的那样，法国的民族主义和反欧言论并非偶然：自君主制政权获胜以来，欧盟已成为世界各地民族主义者的攻击目标，而法国也已明确表示愿意向其视为敌人的国家发动战争。我们的一部分民众现在担心战争重燃，而另一些原本对欧洲就态度冷淡的民众则加入了民族主义者的阵营，并在法国情报机构（如今已成为国际宣传机器）的协助和训练下，对我国政府实施破坏性行动。我们必须认真对待此事：他们的目标是分裂我们。"
 france_md.307.a: "欧洲终将战胜民族主义"
 france_md.308.t: "法国邀请我们加入他们的十字军东征"
 france_md.308.d: "法国民族主义同志的胜利震惊了整个欧洲。法兰西王国除了视欧盟为敌人之外，还宣称要捍卫欧洲乃至全世界的基督教信仰，谴责西方民主是一种使人们背离宗教的堕落，并呼吁教会重掌政权。由于我国基督徒占多数，这一呼吁也部分针对我们：他们提议我们团结起来，恢复基督教昔日的权力。这一邀请或许能让我们获得侍奉主的权力，但也注定会再次将欧洲拖入战火。"
 france_md.308.a: "我们将加入他们的圣战"
 france_md.308.b: "我们不认同这种基督教观点。"
 france_md.309.t: "准备迎接第十次十字军东征"
 france_md.309.d: "数周以来，我们的国王展现了收复圣地的坚定决心，尽管我们在该地区毫无立足之地。我们的黎巴嫩伙伴与我们保持着友好关系，但其政府过于不稳定，且受伊朗影响，无力提供帮助。尽管黎巴嫩拥有数量可观的马龙派基督徒少数群体，使其成为我们发动圣战的理想登陆点。我们可以准备一次两栖干预行动，这固然能增强我们的海军实力，但也会使我们被视为侵略无辜国家的侵略者；或者我们可以施加政治压力，风险较小，但无法保证成功。"
 france_md.309.a: "我们应该先（当然要礼貌地）询问他们。"
 france_md.309.b: "那些不与我们站在一起的人，无论如何都是我们的敌人。"
 france_md.310.t: "法国王国威胁着我们的独立"
 france_md.310.d: "法兰西王国数月前宣布其意图收复圣地，准备发动第十次十字军东征，直指耶路撒冷。为此，他们需要在耶路撒冷附近建立据点，而我国强大的马龙派少数族群已将我们列入他们的目标。法国煽动者如今正试图破坏我们的合法性，并向马龙派施压，企图推翻我们的政府。法国的控制或许能使我们免受以色列和真主党的干涉，但很可能使我们的国家陷入内战的泥潭。这真的是我们想要的吗？"
 france_md.310.a: "他们将保护我们免受好战邻国的侵害。"
 france_md.310.b: "他们只会带来更多冲突！"
 france_md.311.t: "黎巴嫩屈服于我们的要求"
 france_md.311.d: "今天早上是个好日子。在我们的施压下，黎巴嫩政府宣布向马龙派基督徒抗议者的要求屈服。随后，一个以马龙派基督徒为主的政府成立，并将黎巴嫩置于我们的保护之下。我们优先考虑外交手段是正确的选择；西方列强对此无话可说，因为这削弱了伊朗的影响力。我们在地缘政治上运作得非常出色。现在剩下的就是准备与那些胆敢阻挡我们通往天国之路的人进行地面战争。"
 france_md.311.a: "耶路撒冷就在我们手中"
 france_md.312.t: "黎巴嫩拒绝我们"
 france_md.312.d: "今天上午，黎巴嫩公开宣布拒绝屈服于法国对其政治施加的压力。我们的动员显然没有奏效，马龙派的支持也不足以扭转局面。我们的失败很可能源于黎巴嫩仍然牢牢地处于伊朗和真主党的控制之下。然而，黎巴嫩拒绝与我们合作并非终点。我们随时可以在需要时与他们重新合作，而这一次他们将无力抵抗。但是，我们的政治努力似乎已经失败。或许我们应该将重点放在如何向其他国家施压以及如何加强我们的国际外交上，因为我们将来可能会需要这些。"
 france_md.312.a: "做好海军干预的准备"
 france_md.312.b: "我们必须加强外交，这似乎并非我们的强项。"
 france_md.313.t: "法国公社要求我国政府下台"
 france_md.313.d: "几个月前，法国公社宣布要将革命带给全世界，现在似乎正在向我们施压。宣传煽动者已经渗透到我们的民众中，煽动公民加入他们的阵营，抗议团体和共产主义极端分子也已经组织起来。法国特使警告说，如果我们不屈服，他们将进行干预。我们可以选择投降并加入法国，失去独立，或者监禁那些威胁我们政府的极端分子。"
 france_md.313.a: "革命万岁！"
 france_md.313.b: "要我赤化还不如去死"
 france_md.314.t: "[FROM.GetName]加入全球革命"
 france_md.314.d: "[FROM.GetName]刚刚宣布，由于我们的抗议和外交压力，其政府已经垮台。这对我们来说是天大的好消息；一股新的力量加入了革命，而且没有流血。其他资本主义强国对世界秩序的这一剧变感到震惊。他们或许会抗议，但他们无法对抗人民的意志。革命终将降临到他们身上。[FROM.GetName]的垮台仅仅是个开始；其他国家也会步其后尘。"
 france_md.314.a: "革命正在兴起"
 france_md.315.t: "[FROM.GetName]拒绝人民的意愿"
 france_md.315.d: "要求[FROM.GetName]政府下台的抗议活动似乎已经平息。事实上，[FROM.GetName]政府对这些抗议活动进行了暴力镇压，并拒绝任何妥协。如果这场抗议活动似乎已经违背了人民的意愿，或许我们应该更多地参与到[FROM.GetName]的革命中来。我们的军队已经做好军事干预的准备，以维护人民的主权意志。然而，这种干预可能会演变成一场大规模冲突。我们是否应该介入？"
 france_md.315.a: "革命终将到来，不管他们喜欢与否。"
 france_md.315.b: "我们将归来"
 france_md.316.t: "欧洲的胜利公社"
 france_md.316.d: "对我们公社来说，今天是伟大的一天：我们把革命带到了整个欧洲。自从苏联解体以来，欧洲大陆充斥着资本家和萌芽中的民族主义者，但没有什么能阻止我们，无论是制裁、轰炸，还是我们为了夺取无产阶级政权而发动的战争。有时我们不得不以大炮教训压迫者，但革命的胜利证明了手段的正当性。当人民军队在巴黎游行时，欧洲开始在坚实的基础上重建，远离资本主义。我们的下一个目标是实现世界各地国际主义者的梦想：建立一个所有工人都能感到归属感的伟大联邦。"
 france_md.316.a: "国际歌将是人类的颂歌"
 france_md.317.t: "穿过阿登地区"
 france_md.317.d: "我们的皇帝长期以来一直在讨论入侵比荷卢三国，这对我们这个新兴帝国至关重要。比利时瓦隆地区拥有相当数量的法语少数族裔，是欧盟的神经中枢，但其防御薄弱，是恢复我们合法边界的理想首要目标。由于我们打算永久占领这些土地，因为它们是合法属于我们的，皇帝命令我们避免轰炸，并在敌人做好准备之前迅速发动攻击。是时候收复阿登森林之外的法兰克民族摇篮了。"
 france_md.317.a: "他们毫无胜算"
 france_md.318.t: "第二次西班牙战役"
 france_md.318.d: "我们的皇帝下令征服伊比利亚半岛，这对于确保我们在东进莫斯科之前西翼的安全至关重要。拿下西班牙将使我们更接近直布罗陀，而直布罗陀是控制地中海的关键。山地地形有利于防守，因此皇帝要求我们采取稳扎稳打的策略，并由阿尔卑斯山猎兵提供后援，但同时也敦促我们在敌人做好准备之前迅速推进。拿破仑的失败告诉我们，必须守住已占领的土地：我们必须建立稳定的附庸国，或者加强占领军的实力。"
 france_md.318.a: "这次我们会严密监视他们。"
 france_md.319.t: "穿过莱茵河"
 france_md.319.d: "我们的皇帝已指明下一个敌人：德国，欧洲的经济中心，以及我们所鄙夷的那种欧洲愿景。冲突不可避免，这标志着我们向东进军，直指莫斯科 - 我们最终的敌人。从拿破仑对普鲁士的闪电战到色当战役，再到两次世界大战，我们对这个敌人了如指掌。皇帝下令以强大的坦克和航空力量，稳步推进，确保目标的实现，但无需全面占领。这场战争令人遗憾，却又无法避免。"
 france_md.319.a: "色当没有下一次！"
 france_md.320.t: "阿尔卑斯山之战"
 france_md.320.d: "拿破仑一世的俄军撤退导致盟军在他实力削弱的瞬间便发动叛乱，因此，在进军莫斯科之前，我们的皇帝命令我们确保南部侧翼的安全：意大利和前奥匈帝国领土。如今这些地区或许只是小威胁，但如果我们的俄战持续下去，它们可能会变得非常危险。这些地区多山的地形需要高山猎手和炮兵来清除据点上的守军，从而确保我们的后方安全，同时避免浪费我们用于俄战的兵力。这些国家真是生不逢时。"
 france_md.320.a: "我们将彻底埋葬神圣罗马帝国！"
 france_md.321.t: "皇帝陛下号召我们备战"
 france_md.321.d: "我们的法国盟友召集会议，商讨如何摧毁俄罗斯。它视俄罗斯为对欧洲以及我们共同拥有的帝国的威胁。它敦促我们加强军事能力，并派遣武器专家优化我们的生产，其核心信息只有一个：做好打一场漫长而艰苦战争的准备。这对我们的公民来说无疑是噩耗，他们可能面临战死沙场的命运，但这场战争是必要且正义的。我们必须在自己成为俄罗斯的目标之前，保护欧洲免受其威胁。"
 france_md.321.a: "感谢我的皇帝陛下。"
 france_md.322.t: "刺穿冰川"
 france_md.322.d: "我们进军莫斯科已迫在眉睫，但首先我们必须确保我们的出发点：东欧，这片曾经阻挡俄罗斯扩张的缓冲地带，如今却成了我们前进的绊脚石。我们向那些愿意加入我们的人伸出了援手；其余的人却置若罔闻，如今审判之日已至。这些刚刚独立的国家，不难被我们击溃。我们将以装甲部队突破防线，炮火支援，迅速推进。他们会战斗到最后一刻。绝不手软。"
 france_md.322.a: "法国将给世界带来和平与自由。"
 france_md.475.t: "第二次俄国战役"
 france_md.475.d: "经过多年的准备，时机已到。我们的皇帝已下达了对俄作战的最终命令，俄军是我们最大的敌人，对拿破仑一世而言，也是一个不可避免的威胁。这一次，他犹豫了：面对一个始终捍卫自身领土的强权，我们绝不能犯错。无论我们做出什么决定，速度至关重要，因为敌人也在积极备战。做出正确的选择，但要让他们明白：主权人民必将勇往直前，暴君终将葬身坟墓！"
 france_md.475.a: "速战速决，两周后我们就能抵达莫斯科！"
 france_md.475.b: "让我们做好打消耗战的准备。"
 france_md.476.t: "打破封锁"
 france_md.476.d: "我们的经济和人民已经饱受奸诈的阿尔比恩之苦，如今，欧洲安全无虞，我们可以将目光转向我们最古老的敌人。只有英吉利海峡阻挡了我们攻入他们那可怜岛屿的道路。皇帝陛下提供了两个选择：一是利用空中优势，先用炸弹摧毁他们，再空降我们的部队；二是趁他们海军实力削弱之际，集中舰队进行直接登陆。速度至关重要。公民啊，做出正确的选择吧。胜利在望。"
 france_md.476.a: "他们的海军如今已不复往日荣光。皇家海军会很快解决掉它。"
 france_md.476.b: "闪电战2.0，听起来不错。"
 france_md.477.t: "皇帝宣布大陆体系胜利"
 france_md.477.d: "他们制裁我们，他们禁运我们，他们轰炸我们，但他们从未击垮我们的意志。经过多年的战争，我们的皇帝宣布胜利：欧洲再次向法兰西帝国俯首称臣。这些征服夺去了成千上万法国人的生命，他们是永不被遗忘的烈士。胜利日如今已成为纪念他们的公共假日。但我们在欧洲的胜利并不能解决任何问题：迟早我们会在其他战线上与其他强权交锋。法兰西永存，战争亦然。"
 france_md.477.a: "荣耀之日已至"
 france_md.478.t: "我们王国的使命是什么？"
 france_md.478.d: "我们在法兰西王国的统治地位稳固：我们镇压了革命，恢复了宗教应有的地位。现在的问题是如何重振昔日荣光。我们可以收复祖先的法兰克土地，但这会引发与不愿割让土地的昔日盟友的战争；或者，我们可以先行解放圣地，赢得各地基督徒的拥护，从而避免在自己的土地上卷入战争。无论我们做出何种决定，都无需畏惧，因为上帝与我们同在。"
 france_md.478.a: "我们首先是法兰克"
 france_md.478.b: "这场圣战刻不容缓，我们必须解放我们的圣地"
 france_md.479.t: "法国王国要求吞并我们"
 france_md.479.d: "今天早上，我们收到法国同行发来的一份极其古怪的请求。他们的国王不再承认我们的主权，要求我们将领土、预备役部队和军队移交给他指挥，并承诺会顺利地将我们的人民融入他的统治之下。这听起来像是愚人节玩笑，但法国总参谋部已经宣布了特别动员，种种迹象表明，他们即将入侵我们的领土。投降还是战斗：无论我们做出什么决定，都必须迅速行动。"
 france_md.479.a: "冲突会给我们的人民带来不必要的苦难。"
 france_md.479.b: "他们怎么敢？我们是一个主权国家。"
 france_md.480.t: "[FROM.GetName]符合我们的要求"
 france_md.480.d: "在第一声炮响之前，[FROM.GetName]政府宣布解散并无条件向我王国投降。这对我方人民和外交努力而言都是极好的消息。我方国王承诺，将尽快为新入籍的法国公民办理身份合法化手续，并尽可能有效地帮助他们融入社会。这是他们所能做出的最明智的决定。他们根本无法抵挡我方的干预。"
 france_md.480.a: "有时候，你只需要好好请求就行了。"
 france_md.481.t: "[FROM.GetName]拒绝让步"
 france_md.481.d: "[FROM.GetName]政府刚刚宣布谴责我们企图恐吓其国家的行径。我们的民族诉求在谈判桌上毫无立足之地。这一外交挫败在意料之中；一个主权国家不战而降，实属罕见。幸运的是，我们早已为此做好了准备。我们的军队已做好介入其领土的准备。然而，公开冲突未必是伸张正义的最佳途径。"
 france_md.481.a: "他们会后悔的"
 france_md.481.b: "这并非我们的终点。"
 france_md.482.t: "法国王国要求我们臣服"
 france_md.482.d: "今天早上，我们收到了法国同行的一份极其古怪的请求。他们的国王援引加洛林王朝的旧说，不再信任我们能在日益紧张的局势下保护教皇，并要求完全控制我们的政府以及通往梵蒂冈的走廊，他打算直接管理这条走廊。这令人无法容忍：我们从未辜负过教皇，宗教也不能成为我们邻国民族主义野心的借口。然而，这并非空穴来风，法国总参谋部已下令进行特别动员，种种迹象表明，他们将入侵我们的领土。要么屈服，要么战斗：无论我们做出何种决定，都必须迅速行动。"
 france_md.482.a: "我们根本不是他们的对手。"
 france_md.482.b: "他们怎么敢？我们是一个主权国家。"
 france_md.483.t: "[FROM.GetName]拒绝满足我们的要求"
 france_md.483.d: "[FROM.GetName]政府刚刚宣布谴责我们企图恐吓其国家的行为。他们拒绝屈服于我们的要求，并坚持捍卫其主权，自主决定和政策。看来他们已经无视了我们理性的呼吁。我们绝不能让他们得逞。我们的军队已做好军事干预的准备。我们不能冒着让对手联合起来对抗我们的风险。我们必须杀鸡儆猴。然而，与[FROM.GetName]开战或许并非我们所愿。"
 france_md.483.a: "他们没有意识到自己站在了枪的对立面。"
 france_md.483.b: "我们还可以用其他方式收拾它们"
 france_md.484.t: "法国王国要求我们臣服"
 france_md.484.d: "今天早上，我们的法国同行提出了一项极其古怪的要求。他们的国王不再信任我们能够保护人民，声称我们的政府在当前的联盟平衡中处于不利地位，并要求完全控制我们的政府和军​​队。这些要求荒谬至极：我们从未辜负过对领土的治理，我们的权力完全来自人民的授权。然而，这并非空穴来风，法国总参谋部已下令进行特别动员，所有迹象都表明他们将入侵我们的领土。要么屈服，要么战斗：无论我们做出何种决定，都必须迅速行动。"
 france_md.484.a: "我们根本不是他们的对手。"
 france_md.484.b: "只有我们的人民才拥有主权"
 france_md.485.t: "西方帝国的崛起"
 france_md.485.d: "历经多年的斗争与背叛，法兰克人终于取得了胜利。当我们推翻篡位的共和国时，欧洲对我们进行了排斥和制裁，但上帝始终与我们同在：法国，教会的长女，注定不会成为共和国。法兰克人的敌人注定要灭亡，如今法兰克人已经收复了他们的土地。现在是时候宣告我们的帝国 - 西方帝国、信仰帝国 - 的建立，这帝国已由教皇祝圣，以求永远庇佑我们。或许，也是时候向东进军，收复圣地了。"
 france_md.485.a: "这一次，将由我来敬献花圈。"
 france_md.485.b: "神的旨意！"
 france_md.486.t: "法国王国要求我们臣服"
 france_md.486.d: "今天早上，我们收到了法国同行发来的一份极其古怪的请求。他们的国王决心完成他发起的第十次十字军东征，声称我们的岛屿领土挡在他的征途上，并要求割让这些领土，外加完全控制我们的政府。这令人无法容忍：宗教不能成为我们邻国民族主义野心的借口。然而，这并非空穴来风，法国总参谋部已下令进行特别动员，所有迹象都表明他们将入侵我们的领土。要么屈服，要么战斗：无论我们做出何种决定，都必须迅速行动。"
 france_md.486.a: "这是确保此次活动成功的最佳途径；我们接受这一点。"
 france_md.486.b: "他们怎么敢？我们是一个主权国家。"
 france_md.487.t: "胜利的第十次十字军东征"
 france_md.487.d: "经过数月在地中海和中东的激战，我们取得了胜利。我们逐岛征战，攻克了最后的基督教据点，随后围攻了耶路撒冷城。无数敌人阻挡了我们的去路，许多法国人也与我们复仇的武力一同牺牲，但为了胜利，一切手段都是正当的。随着战果的巩固和中东局势的稳定，一个问题摆在了我们面前：我们应该就此止步，还是继续完成欧洲宗教战争未能完成的事业？"
 france_md.487.a: "将会有一场新的圣战"
 france_md.487.b: "我们已经实现了目标，恢复了耶路撒冷王国。无需再做任何进一步的事情。"
 france_md.488.t: "法国王国敦促我们加入他们的联盟。"
 france_md.488.d: "法国外交官送来了一份提议。法国国王结束了在中东的冒险，作为天主教会的保护者，他现在向所有拒绝接受他权威的人宣战，并邀请我们加入一个联盟，他将其比作诺亚方舟在洪水来临前的航行。这一声明既疯狂又可怕，同时伴随着一支正在返回家园的十字军的动员。鉴于他们发动十字军东征的残酷程度，这份提议更像是一份最后通牒，我们必须认真对待。无论我们做出什么决定，都必须迅速行动。"
 france_md.488.a: "让他们站在我们这边总比让他们站在我们这边好。"
 france_md.488.b: "他们疯了吗？"
 france_md.489.t: "第十一次十字军东征在欧洲取得胜利"
 france_md.489.d: "这次的征战比上次更加血腥，也更加艰难，因为我们面对的是强大的列强。但我们成功了，我们取得了胜利。然而，在我们疗伤、重建家园和被征服地区的同时，一个问题浮现出来：我们是否应该对他们的政策实施严格的控制，以确保他们走上正轨？还是应该引导他们，让他们自己做出选择？让他们自己选择，可以展现我们的宽容，也能降低他们叛乱的可能性。反之，加强控制则有助于防止其他民众误入歧途。我们究竟该如何抉择？"
 france_md.489.a: "我们需要密切关注他们。"
 france_md.489.b: "时候到了，我们的主会审判他们。"
 france_md.490.t: "恢复我们的自然边界"
 france_md.490.d: "从黎塞留到戴高乐，法国自然边界的理念从未被放弃：这既是法兰克民族的根本诉求，也是关乎我们自身安全的根本考量。今天，我们终于可以实现这一使命。我们已将敌人逐出莱茵河畔，巩固了山地阵地，当地民众也最终接受了新的秩序。现在，只需正式完成此次吞并即可。通过此次吞并，我们既为革命复仇，也为帝国和法兰西人民开启了一个安全繁荣的新时代。"
 france_md.490.a: "法国的边界是由自然界界定的（丹东，1793年）。"
 france_md.491.t: "法兰克人民联盟"
 france_md.491.d: "长久以来，那些企图限制法国影响力的势力阻挠法兰克民族的团结，将比荷卢三国等地区划分为法兰克人与其他日耳曼民族之间的战场，并让我们相信欧盟才是我们真正的祖国。然而，法兰克人的命运只属于法兰克人自己，没有任何力量能够永远分裂他们。我们已经收复了孕育法兰西民族的祖先土地，几个月后，我们的血亲兄弟也终于明白，他们的命运与我们息息相关。如今王国重归统一，正义得以伸张。"
 france_md.491.a: "一个属于所有法兰克人的国家"
 france_md.492.t: "加洛林王朝的回归"
 france_md.492.d: "查理曼大帝去世后，他的帝国被分割为西法兰克王国、中法兰克王国和东法兰克王国，随着法兰克人失去土地，这位法兰克皇帝的遗产也逐渐消逝。我们纠正了这一错误。经过多年的斗争，我们把篡位者驱逐出我们的领土，并向当地居民证明，他们从来就不是德国人、意大利人或瑞士人，而是遗忘了身份的法兰克人。通过这次统一，我们纠正了《凡尔登条约》的错误，以及建立在虚假基础上的欧洲千年历史的悲剧。今天标志着一个崭新的法兰克欧洲的开始。"
 france_md.492.a: "帝国和法兰克王国是一个整体。"
 france_md.493.t: "耶路撒冷王国复兴"
 france_md.493.d: "近千年前，我们的十字军先辈眼睁睁地看着他们最珍贵的宝地被夺走。九次十字军东征都未能征服并守住我们的圣地，但我们已重返故土，履行我们对主的承诺。我们在黎巴嫩最后的基督教据点重新站稳脚跟，并收复了耶路撒冷和圣地。随后，我们为在中东建立我们的王国而奋斗，并让当地民众明白，圣地必须始终处于我们的控制之下，才能保障他们的安全。"
 france_md.493.a: "第十次十字军东征胜利了！"
 france_md.494.t: "帝国重生"
 france_md.494.d: "大约150年前，拿破仑的第二帝国被普鲁士和日耳曼民族征服，法国由此开始了长达一个世纪的复仇与战乱。所有人都预言我们这个昔日的殖民强国将会走向衰落，但我们波拿巴主义者用事实证明他们错了，我们从动荡不安的共和国手中夺取了政权，使法国重现昔日荣光。这付出了惨痛的代价，但我们收复了拿破仑一世第一帝国的疆界，驱逐了敌对势力。凭借这场对第八次反法同盟的历史性胜利，法国向世界证明了它的回归，大陆封锁体系在欧洲取得了最终的胜利。"
 france_md.494.a: "事不过三"
 france_md.495.t: "殖民帝国的回归"
 france_md.495.d: "波拿巴帝国始终以称霸欧洲为核心，但殖民地也同样举足轻重，从海地起义到拿破仑三世向非洲的扩张，都体现了这一点。自殖民帝国覆灭以来，我们逐渐被逐出曾经统治的地区，现在是时候恢复原状了。皇帝已下令我们为法国重返昔日殖民地做好准备，从海外省和地区调集更适应当地环境的军队。我们将先攻占沿海城镇，夺取海军基地，然后再向内陆推进，那里的气候更加严酷。"
 france_md.495.a: "殖民地的那些美好时光"
 france_md.496.t: "我们的法国宗主国要求吞并我们"
 france_md.496.d: "我们本应意识到，法国对我们政治的控制迟早会落得如此下场。法国当局刚刚宣布，我国即将被法国吞并。这并非突如其来的消息，法国觊觎我国部分领土已久，这次似乎决心要将其据为己有。他们自认为比我们更有能力治理我国。在这黑暗时刻，我们必须做出抉择，这不仅关乎我们的独立，也关乎我们人民的安全。屈服还是反抗，这是我们唯一的选择。无论我们做出何种决定，都必须迅速行动。"
 france_md.496.a: "我们没有办法反对它。"
 france_md.496.b: "这片土地是我们的，让他们来夺取吧。"
 france_md.497.t: "[FROM.GetName]反抗我们的统治"
 france_md.497.d: "[FROM.GetName]政府谴责我们企图吞并其领土，并准备不惜一切代价捍卫其独立。他们接受附庸地位，但拒绝割让我们所要求的领土，拒绝驱逐我们的行政机构，并准备与我们对抗。我们可以立即镇压这场叛乱，以儆效尤，也可以推迟对他们的惩罚，因为没有什么能阻止我们卷土重来。"
 france_md.497.a: "这将为他们和任何其他可能受到诱惑的人提供一个教训"
 france_md.497.b: "我们稍后会粉碎他们"
 france_md.498.t: "法国正计划投资我们的工业。"
 france_md.498.d: "我们的法国伙伴向我们提出了一个诱人的提议：欧洲希望重新调整其可控的生产能力，因此法国提议通过帮助我们在境内建厂来投资我们的经济，作为加强欧洲主权和韧性的更广泛项目的一部分。这将极大地惠及我们，同时也惠及法国，因为他们可以获得我们资本和企业的股份。我们是否应该为了帮助我们的产业而牺牲一些主权呢？"
 france_md.498.a: "我们在哪里签字？"
 france_md.498.b: "欧洲和法国无权干涉我们的经济。"
 france_md.499.t: "法国提议投资我们的基础设施网络"
 france_md.499.d: "在与法国伙伴的愉快会谈中，他们向我们提出了一项颇具吸引力的提议。欧洲的主要目标是促进欧盟成员国之间的人员和货物流动，他们希望在这方面为我国提供帮助。因此，法国政府提出投资我国的交通网络，帮助我们实现基础设施现代化。这项提议是旨在增强欧洲主权并帮助成员国应对未来危机的项目的重要组成部分。这项提议对我们大有裨益，但对法国也有好处，因为他们可以借此获得对我国基础设施管理的影响力。为了实现基础设施现代化，我们是否应该牺牲一些主权呢？"
 france_md.499.a: "我们在哪里签字？"
 france_md.499.b: "没有它们，我们的基础设施网络运行得也非常好。"
 france_md.502.t: "法国提议投资我们的生态转型"
 france_md.502.d: "在与法国伙伴的一次愉快会谈中，他们向我们提出了一个颇具吸引力的提议。鉴于他们的长期目标是使欧洲更加环保，他们提议我们共同投资绿色转型。因此，法国政府建议我们投资可再生能源生产基础设施。这项提议对我们大有裨益，同时也有利于法国，因为他们可以借此在我们的电力生产领域占据一席之地。为了推进绿色转型，我们是否应该牺牲一些主权呢？"
 france_md.502.a: "我们在哪里签字？"
 france_md.502.b: "我们不需要他们的生态转型"
 france_md.520.t: "分裂仍在继续"
 france_md.520.d: "祸不单行。随着民调支持率下滑，我们党也开始分裂：自由派团结在中间派政党周围，而马克龙部长则成立了自己的政党 - 共和国前进党，与我们展开竞争。左翼也对我们在社会和经济问题上的表现感到失望，纷纷脱离，转而支持让-吕克·梅朗雄，组建自己的激进左翼政党。这些事态发展令人担忧，但也预示着我们有机会扭转乾坤，在为时已晚之前赢回选民的支持。"
 france_md.520.a: "可恶！"
 france_md.521.t: "法国特工突破了我们的防御系统"
 france_md.521.d: "今天清晨，我们被汽车喇叭声和碰撞声惊醒。由于疑似针对交通基础设施的破坏行为，首都街道陷入瘫痪。我们的技术人员正在全力抢修，但事故已造成数名警员殉职，我们担心武装部队的安全也受到威胁。此次袭击显然来自波拿巴主义法国，该国几个月来一直对我们散布敌对言论。我们必须做好准备，以免这种秘密特工的小伎俩成为常态。"
 france_md.521.a: "该死的"
 france_md.522.t: "我们的警察部队击退了法国的一次袭击"
 france_md.522.d: "得知警方成功阻止了首都的大规模破坏活动，我们都松了一口气。敌人逃脱了，但我们避免了最糟糕的情况发生。然而，在首都街头零星的冲突中，两名警员不幸殉职。这次行动显然源自波拿巴主义法国，他们几个月来一直对我们散布敌对言论。我们必须做好准备，以免这种秘密特工的小伎俩成为常态。"
 france_md.522.a: "我们不可能总是这么幸运。"
 france_md.523.t: "法国宣布成立第三帝国"
 france_md.523.d: "法国刚刚宣布帝国回归。不久前，一个民族主义君主主义派系在法国夺取政权，并且显然已经巩固了其权力。因此，他们组织了一场盛大的仪式来宣布帝国回归，如今这已成为城中热议的话题。事实上，这场仪式受到了媒体的广泛报道，并在社交媒体上被广泛传播。这场庆典不仅仅是一场艺术盛会，也是法国的一次武力展示。几个月来，法国一直在公开展现其征服和冲突的欲望。因此，这一宣言并非结束，而是开始：欧洲乃至全世界局势复杂化的开端。"
 france_md.523.a: "我们应该认真对待这一威胁。"
 france_md.523.b: "他们很久以前就没构成威胁了。"
 france_md.524.t: "增加军队经费？"
 france_md.524.d: "我们近期在国防领域的投资对于维持我们在欧洲防务战略中的地位至关重要，但我们难道不能做得更多吗？面对欧洲再次爆发战争的威胁，许多盟国已投入巨资，为高强度冲突做好准备。或许我们也应该效仿，加大对武器生产能力的投入。"
 france_md.524.a: "小心驶得万年船。"
 france_md.524.b: "我们已经花了很多钱"
 france_md.525.t: "实现我们目标所需的资源"
 france_md.525.d: "尽管我们呼吁法国人民更加努力工作，摆脱依赖文化，但现实却十分严峻：尽管拥有庞大、积极且才华横溢的劳动力，我国仍然缺乏稳定的就业机会。我们可以通过向经济战略部门注入资金来促进就业，因为等待市场自我调节可能需要几个世纪；或者，我们也可以资助我们那订单如潮水般涌来却无力完成的尖端国防工业，而让民用部门自生自灭。"
 france_md.525.a: "我们的公民需要这些工作。"
 france_md.525.b: "我们的国防工业将更好地利用这些资金。"
 france_md.526.t: "重振经济活动"
 france_md.526.d: "多年的极端自由主义削弱了我们的经济，但要从脱欧中幸存下来，我们需要一个强劲且不受欧盟制裁的经济体系。我们可以投资法国私营企业的资本，鼓励它们在法国设立分支机构，从而减轻国家对经济复苏的干预，但这并不能保证它们不会在劳动力成本更低的地区投资。或者，我们可以直接补贴新企业的创立和发展，金融界可能不乐见这种做法，但它肯定有效。"
 france_md.526.a: "我们将投资市场，所以他们也会投资法国。"
 france_md.526.b: "从人性的角度来看，资本主义并不能提供令人满意的解决方案（戴高乐）。"
 france_md.527.t: "扩大对农村地区的支持"
 france_md.527.d: "我们旨在为农村和城郊地区注入经济活力的项目已进展顺利，现在我们必须决定下一步的行动：是继续扩大人口稀少地区的交通联系和就业机会，还是转向农业及其相关产业？这些产业与主要的决策中心隔绝，无法享有同等的特权。对他们进行补贴将改善他们与生产和消费中心的联系，并赢得他们的支持。"
 france_md.527.a: "我们将继续为郊区带来交通便利和就业机会。"
 france_md.527.b: "不如把这笔钱给农业食品行业，他们会更好地利用这笔钱。"
 france_md.528.t: "新经济"
 france_md.528.d: "我们已经剥离了那些成本高昂、效率低下的产业，这些产业目前正在被转移。现在，我们必须为我们日益增长的、但仍然就业不足的人口找到新的工作。对于像我们这样的发达国家来说，服务业是最稳妥的选择：它能创造可观的收入，直接污染少，并且能够弥合私营部门和消费者之间的鸿沟。但是，法国也以其科研实力而闻名，从国防到医学和化学，无所不包。然而，接连不断的危机迫使我们大幅削减科研经费。或许我们应该通过资助科研项目来增加对科研的投入。"
 france_md.528.a: "服务业利润更高，有助于降低失业率。"
 france_md.528.b: "我们应该成为这个知识社会的一部分"
 france_md.529.t: "更多工作岗位还是更多服务？"
 france_md.529.d: "我们近期对生产性行业的投资已初见成效：我们遏制了贫困的恶性循环，并开始重建稳定的劳动力市场。我们可以继续创造惠及子孙后代的就业机会，也可以转而重建那些被前人随着这些就业机会而拆解的公共服务，导致民众缴纳高额税款，却只能享受日益缩减的服务。更好的教育能够提高劳动者的效率，更好的医疗保健能够延长他们的寿命。我们应该重新聚焦公共服务，还是劳动力市场仍然是我们的首要任务？"
 france_md.529.a: "我们的首要任务是创造更多就业机会。"
 france_md.529.b: "我们在劳工方面已经做得够多了，现在需要重建公共服务。"
 france_md.530.t: "重新安置我们的食品供应"
 france_md.530.d: "当我们准备将食品供应转移回国内时，一个问题随之而来：如何实现？我们自身的农产品食品部门完全可以满足我们的需求，但不公平竞争迫使我们进口并不需要的商品，而这些进口商品在海外的运输和不负责任的生产过程中对地球造成了损害。我们可以对不需要或不符合我们标准的食品设置关税壁垒，但这可能会激怒我们的欧洲伙伴和世贸组织。或者，我们可以遵守市场规则，补贴本国农产品食品部门，以增强竞争力并减少对进口的依赖。无论我们做出何种决定，我们都有能力做到；关键在于我们的意愿。"
 france_md.530.a: "市场和自由竞争对我们的居民和地球都是有害的。"
 france_md.530.b: "我们必须遵守规则。"
 france_md.531.t: "法国违反自由贸易法"
 france_md.531.d: "我们刚刚从法国政府新闻稿中获悉，政府决定重新对食品进口设置关税壁垒。此举标志着他们所谓的食品供应本地化计划的开始。尽管他们有很多支持的论据，但该计划违反了世界贸易组织和欧盟的许多法律。法国人已经签署了自由贸易协定，应该有义务遵守这些协定。目前尚不确定他们是否会面临制裁，但此举不利于欧洲一体化。然而，我们的人民正在等待我们对这个问题做出回应：他们做的是对还是错？"
 france_md.531.a: "这是不可接受的。"
 france_md.531.b: "我们也应该这样做。"
 france_md.532.t: "我们的经济主权"
 france_md.532.d: "摆脱长期控制我们的势力是要付出代价的：数十年的资本主义统治将我们的大部分产业出售给了外国资本，而这些资本现在可能已经撤离，迫使我们在私营部门崩溃之前将其收复。我们可以启动一项大规模的就业计划，虽然速度快，但在建设新的产业中心期间维持成本高昂；或者，我们也可以在现有行业内创造新的岗位，如果这些行业能够吸纳新增劳动力，这种方式成本更低，也更可持续。"
 france_md.532.a: "我们能够在一年内创建这些新的工作空间。"
 france_md.532.b: "无需新建任何设施，我们就可以在现有设施中雇用更多员工。"
 france_md.533.t: "迈向左翼联盟"
 france_md.533.d: "经过数月的谈判，我们与众多左翼政党达成共识，他们同意不反对我们的政府，并加入我们的联合政府，共同推进一个更加公平的法国。这是一项妙招：此前，一些政党拒绝承认我们的政府合法性，而我们则在不违背原则的前提下，建立了一个更加强大的多数派​​。这项安排意味着社会福利将略有提高，但这并非我们事先计划，我们原本就打算这样做。"
 france_md.533.a: "不信任动议的威胁正在减弱"
 france_md.534.t: "其他左翼政党拒绝我们的联盟"
 france_md.534.d: "今天上午，其他左翼团体的议员宣布，他们不会支持我们提出的联合执政方案，理由是我们的纲领和优先事项存在太多分歧。对于一个本已在分裂的国民议会中苦苦挣扎的政府来说，这无疑是雪上加霜。我们仍然可以逐项协商法案，但每次都会面临来自各方的压力。这些政党的行为极不负责任，虽然部分民意支持我们采取的联合策略，但这可能不足以保证我们政府的存续。"
 france_md.534.a: "那是一次英勇的尝试"
 france_md.535.t: "社会党加入政府"
 france_md.535.d: "经过数月的谈判，我们与社会党找到了共同点。他们同意停止反对我们，并加入联合政府，共同制定一项主要以我们自身方案为蓝本的纲领，因为他们无力推行自己的方案。这是一项妙招：我们的政府此前一直受到一些拒绝承认其合法性的政党的挑战，而我们以最小的成本建立了一个更加稳定的多数派。这项安排需要对私营部门进行投资，这或许并非选民所期望的，但如果它能帮助我们通过立法，那么这一切都是值得的。"
 france_md.535.a: "莱昂·布鲁姆会感到自豪"
 france_md.536.t: "社会党拒绝加入政府"
 france_md.536.d: "今天上午，社会党议员宣布他们不会支持我们的联合执政方案，理由是我们的纲领存在太多分歧，而且显然他们仍然对我们在竞选期间对他们的攻击耿耿于怀。对于一个本已在分裂的国民议会中苦苦挣扎的政府来说，这无疑是雪上加霜。我们仍然可以逐项协商法案，但每次都会面临来自各方的压力。这些政党的行为极其不负责任，虽然部分民意支持我们采取的联合策略，但这可能不足以保证我们政府的存续。"
 france_md.536.a: "莱昂·布鲁姆死不瞑目"
 france_md.537.t: "一个任期即将结束"
 france_md.537.d: "总统的任期还有两年，党内机器已经在争论如何利用这两年时间。我们现在可以继续以现任总统的名义执政，并采纳他的纲领；或者也可以按兵不动，等到2002年大选确定法国的执政党后再做决定。"
 france_md.537.a: "现在就在现任总统的领导下进行治理"
 france_md.537.b: "等到2002年大选吧"
 france_md.538.t: "雅克·希拉克退出政坛"
 france_md.538.d: "在党派于总统选举中落败后，前总统希拉克决定结束自己的政治生涯。从部长到总统，他一路走来，见证了法国在第四共和国和第五共和国时期发生的巨变。然而，他的党派在竞选期间遭遇的困境也与他的一些政策有关，这些政策并非人人都能接受。尽管如此，如果说他的失败能给我们带来什么教训，那就是时代已经改变；世界已然不同，我们不能再像过去那样墨守成规，必须承担风险。我们现在所能做的，就是希望我们能比他做得更好。"
 france_md.538.a: "这样他就有时间吃苹果了。"
 france_md.539.t: "巨石倒塌"
 france_md.539.d: "我们党的创始人兼前领导人让-玛丽·勒庞再次成为新闻焦点，但这次却是因为负面新闻：多年来，他一直否认纳粹大屠杀并发表反犹言论，如今却拒绝称贝当元帅为叛徒。自卸任以来，他在从养老金到上世纪冲突等诸多问题上都与党的新方向存在分歧，他的言论阻碍了我们最终融入共和主义主流。我们可以开除他，但这可能会疏远那些与他观点相同的老党员。我们究竟是想将党改造为符合共和主义标准的政党，还是冒着失去自身身份的风险？"
 france_md.539.a: "他成了个麻烦，我们必须把他开除出党。"
 france_md.539.b: "提醒他注意言行。"
 france_md.540.t: "从前线到集会"
 france_md.540.d: "经过党内多次辩论和会议，国民阵线高层宣布对该党的政策和地位进行重大调整。该党将更名为国民联盟，并决心摆脱极右翼政党的标签。为此，他们宣布开除多名被认为过于极端的积极分子，并重申了留在欧盟的承诺。这一进展标志着旧国民阵线走向衰落的最后阶段，它正被改造以使其形象更加易于被大众接受。尽管这些变化微乎其微，但我们必须竭尽全力，避免公众误以为这些改变会带来任何实质性的变化。"
 france_md.540.a: "然而，它们仍然很危险。"
 france_md.541.t: "圣座的陷落"
 france_md.541.d: "目前梵蒂冈被外国势力占领。因此，只要梵蒂冈仍处于敌对势力的控制之下，我们就无法保障教宗的安全。然而，我国已在阿维尼翁的教宗宫为教宗提供了居所。因此，我们完全可以将枢机主教团和现任教宗迁往阿维尼翁。这对全球基督教世界而言将是一个意义重大的变革，但鉴于梵蒂冈已被占领，只有我们才有足够的力量来确保教会的安全，正如我们的王国一直以来所做的那样。"
 france_md.541.a: "教皇的宝座在我们这里会很安全。"
 france_md.550.t: "尼古拉·萨科齐赢得总统大选"
 france_md.550.d: "第二轮选举结果证实了民调的预测。以强硬镇压城市骚乱而声名鹊起的内政部长尼古拉·萨科齐，带领人民运动联盟以明显优势击败塞戈莱纳·罗亚尔，入主爱丽舍宫。此次竞选围绕工作、权威和民族认同展开，投票率创下近几十年来新高。新总统承诺与希拉克时代决裂：进行养老金改革，收紧劳动力市场，并让法国重返大西洋联盟的一体化指挥体系。他的反对者警告说，这种决裂对那些最无力承受的人将造成最沉重的打击。"
 france_md.550.a: "多工作才能赚更多钱。"
 france_md.551.t: "弗朗索瓦·奥朗德赢得总统大选"
 france_md.551.d: "萨科齐执政五年后，社会党重返执政地位。长期以来被视为党内经理而非政治家的弗朗索瓦·奥朗德，凭借财政公正、重新谈判欧洲预算条约以及从阿富汗撤军的竞选纲领，赢得了第二轮选举。金融危机和欧元区危机主导了所有辩论，即将卸任的萨科齐总统无法摆脱其执政记录的影响。新政府接手的是一个停滞不前的经济、捉襟见肘​​的财政赤字以及一个期望法国发挥领导作用而非提出异议的欧洲伙伴关系。"
 france_md.551.a: "变革就在当下。"
 france_md.552.t: "埃马纽埃尔·马克龙赢得总统大选"
 france_md.552.d: "旧的政党体系已经崩溃。社会党和共和党都没能进入第二轮，决选在成立仅一年多的一个运动和国民阵线之间展开。前投资银行家和经济部长埃马纽埃尔·马克龙凭借劳动力市场自由化、欧洲一体化以及一种既非右翼也非左翼的政治理念轻松获胜。他的运动现在面临着立法选举，既没有议会基础，也没有地方机器，而他的对手们已经在街头组织起来。"
 france_md.552.a: "既非左也非右。"
 france_md.553.t: "埃马纽埃尔·马克龙连任"
 france_md.553.d: "这是总统第二次与国民联盟在第二轮投票中对决，也是共和阵线第二次保住了席位，尽管优势比五年前略小。此次竞选被欧洲战事、能源价格上涨以及总统承诺无论如何都要推行的养老金改革所掩盖。他成为二十年来首位赢得连任的法国总统，也是首位带领从未如此接近权力中心的极右翼政党赢得连任的总统。"
 france_md.553.a: "第二个任期，而且范围更窄。"
 france_md.503.t: "反对[FRA.GetLeader]：趋势是什么？"
 france_md.503.d: "随着[FRA.GetLeader]任期即将结束，总统竞选进入最后阶段，选举力量的平衡也逐渐明朗。热门人选利昂内尔·若斯潘曾在希拉克执政时期担任总理，他推行符合欧洲标准的社会民主政策，同时又与社会主义传统保持距离：他思想现代，但并非社会主义。来自绿党和法国共产党的几位左翼候选人虽然缺乏直接获胜所需的资源，但仍有可能获得支持。左翼整体是否占据绝对优势？还是说，左翼内部的分裂可能会让其他候选人进入第二轮？"
 france_md.503.a: "左翼正在赢得选民的支持"
 france_md.503.b: "所有左翼候选人都没有获得他们预期的支持。"
 france_md.986.t: "利昂内尔·若斯潘面临批评"
 france_md.986.d: "尽管利昂内尔·若斯潘是左翼阵营最看好的候选人，但他的竞选纲领并未获得左翼内部的一致支持，一些人认为他的纲领过于自由化，与希拉克过于相似。与他针锋相对的是法国共产党；尽管冷战结束后，法国共产党已不复往日荣光，但它在激进左翼阵营中仍然拥有盟友，并且能够吸引那些对前总统密特朗第二个任期感到失望的选民。法国共产党可能会攻击若斯潘的自由化倾向，但它会这样做吗？"
 france_md.986.a: "法国共产党决定不对利昂内尔·若斯潘发起攻击。"
 france_md.986.b: "法国共产党成功赢得了左翼选民的支持。"
 france_md.986.c: "法国共产党发起的攻击未取得决定性结果。"
 france_md.987.t: "莱昂内尔·若斯潘遥遥领先"
 france_md.987.d: "左翼阵营内部对利昂内尔·若斯潘和社会党的胜利已达成共识。尽管他此前曾受到抨击，但他的对手已无力挑战他，也无法进入第二轮。无论我们是否认同他的纲领，在总统选举第二轮中，他将与[FRA.GetLeader]对决。"
 france_md.987.a: "不可能有其他办法了。"
 france_md.988.t: "共产主义复兴"
 france_md.988.d: "攻击若斯潘与左翼的联系是正确的决定。社会党的选票在左翼和中间派之间分散，这使得法国共产党获得了其在领导反对长期盛行的自由主义和保守主义政策方面所缺乏的公信力。法国共产党已经与其他左翼伙伴，例如革命共产主义联盟和工人斗争党结盟。然而，对[FRA.GetLeader]不满的中间派宁愿选择若斯潘而不是激进联盟，他们很可能在第二轮投票中反对我们。或许我们可以安排在他们的城镇进行本地投资，以换取他们的沉默。"
 france_md.988.a: "中间派将弃权"
 france_md.988.b: "中间派将呼吁建立统一战线，对抗极左翼。"
 france_md.989.t: "意想不到的宠儿"
 france_md.989.d: "此次总统竞选的尾声对许多政党来说都充满动荡。在法国共产党攻击利昂内尔·若斯潘之后，共产党和社会党之间展开了一场激烈的媒体战。由于双方都未能充分阐述各自的政见，左翼选民转而支持一位争议较少、立场更为稳重的候选人。绿党抓住这一契机，将自己塑造成风暴中冷静理性的代表。因此，绿党极有可能进入第二轮，届时他们将面对一位因任期结束而实力有所削弱的前总统。"
 france_md.989.a: "谁会相信呢？"
 france_md.990.t: "既非左派也非右派"
 france_md.990.d: "保守党已进入第二轮投票，左翼阵营又陷入混乱，前总统希拉克似乎胜券在握，尽管仍存在一些不确定因素。一些法国人对数十年来主导法国政治的左右翼对立感到厌倦，这种对立已不再适应当今注重稳定和欧洲一体化的时代。因此，自由派的“法国民主联盟”有话要说：在新兴力量和集团不断涌现的世界中，希拉克的独立政策已不再具有多大影响力。自由派中间派可以发挥作用，但它能否让选民接受这一新的现实呢？"
 france_md.990.a: "自由党人将设法吸引人们的注意力"
 france_md.990.b: "法国仍然致力于维护其主权"
 france_md.991.t: "主权主义阵营分裂"
 france_md.991.d: "由于自由派中间派无法有效阐述自身立场，厌倦了左右翼分裂的选民转而支持主权主义者。然而，主权主义者阵营内部却存在两种声音。“共和国联盟”将戴高乐主义的民族独立传统带入主流，既受人尊敬又具备执政能力；而“国民阵线”则提出了更为强硬的路线，这种路线在过去二十年中一直被传统政党压制。双方都声称拥有同一批心灰意冷的选民。哪一方能够进入第二轮，将决定法国的疑欧主义是继续由执政右翼掌控，还是会彻底突破既有的壁垒。"
 france_md.991.a: "戴高乐主义传统仍然主导着主权主义选票。"
 france_md.991.b: "国民阵线将利用民众的不满情绪。"
 france_md.510.t: "谁也预料不到会发生这种事"
 france_md.510.d: "鉴于各党派都无法吸引选民的注意力，没有哪个党派有能力与[FRA.GetLeader]一决高下，进入第二轮。国民阵线受益于竞争对手淡出公众视野，得以避开各种争议，尽管其领导人是让-玛丽·勒庞，但理论上仍有可能晋级。不过，这仍然不太可能：利昂内尔·若斯潘仍然是热门人选，而且他肯定会输给[FRA.GetLeader]。但如果国民阵线真的进入第二轮，其他党派又会作何反应呢？"
 france_md.510.a: "各方不会对极端主义的抬头感到担忧。"
 france_md.510.b: "各党派将呼吁选民投票反对国民阵线。"
 france_md.511.t: "选举日"
 france_md.511.d: "经过数月跌宕起伏的竞选，法国终于迎来了投票日。这仅仅是第一轮投票，旨在筛选出获得法国民众最多支持的两名候选人。如果两名候选人均未获得过半数选票，则将举行第二轮投票，从中选出最终的总统人选。"
 france_md.511.a: "我们去投票吧！"
 france_md.512.t: "预计国民阵线将赢得总统选举"
 france_md.512.d: "出乎所有人意料的是，国民阵线在第一轮投票中胜出，此前所有预测都指向若斯潘和[FRA.GetLeader]之间的直接对决。鉴于其他候选人未能赢得选民支持，国民阵线得以进入第二轮，而[FRA.GetLeader]的处境则不容乐观：其他政党并未呼吁选民支持他，他的政策对部分选民来说也过于敏感。预计部分选民会反对这位极右翼候选人，但击败自诩为反建制派的勒庞，远非易事。"
 france_md.512.a: "刚才发生了什么？"
 france_md.513.t: "国民阵线进入第二轮"
 france_md.513.d: "出乎所有人意料的是，国民阵线在第一轮投票中胜出，此前所有预测都指向若斯潘和[FRA.GetLeader]之间的直接对决。鉴于其他候选人未能赢得选民支持，国民阵线得以进入第二轮。幸运的是，[FRA.GetLeader]最终应该会胜出：各政党和公民社会对一个极右翼政党进入第二轮投票感到震惊，纷纷呼吁民众大规模投票反对勒庞。全国各地爆发了大规模示威游行，支持即将卸任的总统。这是一次历史性的事件；但愿这也是唯一一次。"
 france_md.513.a: "我们究竟是怎么落到这步田地的？"
 france_md.514.t: "法国共产党宣布赢得总统选举"
 france_md.514.d: "出乎所有人意料的是，法国共产党在经历了冷战结束以来最艰难的几个月后，竟然在第一轮选举中获胜。候选人若斯潘的弱点以及激进左翼的联盟，使得法国共产党得以团结左翼力量，并在第二轮选举中取得明显领先。社会党和中间派同意，只要法国共产党不退出欧盟，他们就不会反对它。法国共产党领导人巧妙地平衡了对自由秩序的反对和改革主义，以避免疏远中间派。法国共产党的胜利已成定局，但它能否维持其联盟呢？"
 france_md.514.a: "美好的日子终于到来了。"
 france_md.515.t: "法国共产党已晋级第二轮"
 france_md.515.d: "出乎所有人意料的是，法国共产党在第一轮投票中胜出，而就在几个月前，该党还处于冷战结束以来的最低谷。候选人若斯潘的弱点以及激进左翼的联盟使得法国共产党得以进入第二轮。然而，法国共产党的胜利并非板上钉钉：中间派宣布将投票支持[FRA.GetLeader]，他们认为激进左翼的胜利对欧洲一体化和市场而言都是不祥之兆。第二轮投票尚未举行，但[FRA.GetLeader]极有可能再次获胜。"
 france_md.515.a: "真是千钧一发"
 france_md.516.t: "保卫法国联盟已进入第二轮"
 france_md.516.d: "出乎所有人意料的是，即将卸任的总统在第二轮投票中被淘汰，而击败他的正是他自己的政党：戴高乐主义者查尔斯·帕斯夸成功地从右翼阵营中拉拢了足够多的保守派和主权主义者，从而扰乱了[FRA.GetLeader]的竞选活动。然而，保卫法国联盟并非孤军奋战。它将在第二轮投票中面对社会党候选人利昂内尔·若斯潘，后者尽管左翼内部存在分歧，但仍成功晋级第二轮。这场角逐必将异常激烈，因为这不仅仅是社会主义与保守主义的较量：下周，法国人民将决定他们究竟想要更多还是更少的欧洲一体化。"
 france_md.516.a: "主权终将胜利"
 france_md.516.b: "反对票仍然只占少数。"
 france_md.517.t: "法国民主联盟晋级第二轮"
 france_md.517.d: "亲欧选民的团结使法国民主联盟得以进入第二轮投票。并非只有社会党支持欧盟，而自由党更接近欧盟的自由主义价值观。人们往往更倾向于选择原创而非模仿。因此，法国民主联盟得以与现任总统一同进入第二轮。由此，希拉克的亲独立政策与自由党不惜一切代价拥抱欧洲的立场之间展开了较量。由于主要政治阵营在这一问题上存在严重分歧，此次选举很可能是一场势均力敌的较量。幸运的是，我们无需等待太久，第二轮投票即将到来。"
 france_md.517.a: "老派保守主义人士被拒之门外"
 france_md.517.b: "事实证明，法国民主联盟的竞选纲领对选民来说有点过于自由化了。"
 france_md.518.t: "绿党晋级第二轮"
 france_md.518.d: "经过左翼政党之间的激烈角逐，绿党出人意料地成功晋级第二轮。他们的社会和环境纲领走在时代前沿，在法国共产党和社会党之间的冲突中保持冷静，最终成为最明智、最公平的解决方案的代表。他们现在将与即将卸任的总统一同进入第二轮。这场角逐势必异常激烈，但难得的是，每个阵营内部都达成了一致：左翼支持进步主义，右翼支持保守主义，下周的对决不仅关乎社会问题，也关乎环境问题。"
 france_md.518.a: "过时的、保守的软件已无法应对我们这个世纪的挑战。"
 france_md.518.b: "环境问题尚未得到足够的重视。"
 france_md.519.t: "莱昂内尔·若斯潘已晋级第二轮。"
 france_md.519.d: "正如所有民调预测的那样，社会党候选人顺利晋级第二轮。他现代化的亲欧纲领赢得了社会党人和中间派的支持，为他奠定了坚实的选民基础。而内部严重分裂的激进左翼政党则对这位前总理构不成威胁。本周，他将与对手展开角逐，再次上演进步主义与保守主义的碰撞。但民调显示双方差距甚微，若斯潘或许需要左翼政党的支持，因为人民共和党可能会从不愿接受社会党总统的右翼团体中获益。"
 france_md.519.a: "若斯潘成功赢得了左翼其他成员的支持。"
 france_md.519.b: "若斯潘未能赢得更左翼选民的支持，因为他的纲领过于自由化。"
 FRA_Macron_eco: "马克龙法案"
 FRA_Macron_eco_desc: "我们决定遵循财政部长埃马纽埃尔·马克龙制定的政策。这项法律将简化投资和就业流程，同时削减政府开支。"
 FRA_Ferrand_eco: "费朗法案"
 FRA_Ferrand_eco_desc: "我们决定遵循财政部长奥利维耶·费朗制定的政策。这项法律将简化投资和就业流程，同时削减政府开支。"
 FRA_ineluctable_collapse: "崩溃的联盟"
 FRA_ineluctable_collapse_desc: "我们的党和我们的联盟正在分崩离析；我们必须尽快解决这个问题，否则就太晚了！"
 FRA_manif_pour_tous: "全体人员的示威游行"
 FRA_manif_pour_tous_desc: "每月有数十万人走上街头，这是右翼二十年来都没能建立起来的保守主义运动，而执政党现在不得不通过这场运动来立法。"
 FRA_grand_debat: "全国大辩论"
 FRA_grand_debat_desc: "一万个市政厅，两百万笔捐款，以及一份足以让环岛空无一人的让步方案。和平是真的，账单也是真的。"
 FRA_bassin_minier: "巴辛·米尼尔的承诺"
 FRA_bassin_minier_desc: "老煤田和米迪地区的熔炉重新点燃，矿井重新开放。只要承诺得以兑现，就能遏制极右势力。"
 FRA_resist_inevitable: "稳定措施"
 FRA_resist_inevitable_desc: "这种衰落并非不可逆转。我们的激进分子已经重返家园，而且他们远离我们的趋势也已放缓。"
 FRA_resist_inevitable2: "稳定措施"
 FRA_resist_inevitable2_desc: "出血已经止住了。我们已经稳定了党内局势，并将注意力转向了选民赖以生存的工业基础。"
 FRA_resist_inevitable3: "稳定措施"
 FRA_resist_inevitable3_desc: "我们已经挺过了那些讣告。党再次站稳了脚跟，拥有了稳定的群众基础和对手必须回应的纲领。"
 FRA_socialism_renew: "社会主义复兴"
 FRA_socialism_renew_desc: "我们已在坚实的基础上重建了党的合法性。未来就在前方。"
 FRA_pension_reform: "养老金改革"
 FRA_pension_reform_desc: "鉴于我们面临的预算危机，我们不得不提高公民的退休年龄；他们对此并不满意，但我们别无选择。"
 FRA_french_rearmament: "重新武装第一阶段"
 FRA_french_rearmament_desc: "欧洲局势再次紧张，为了避免最糟糕的情况发生，我们别无选择，只能重新武装。"
 FRA_french_rearmament2: "重新武装第二阶段"
 FRA_french_rearmament2_desc: "训练更多士兵还不够；我们必须提高武器生产能力。"
 FRA_french_rearmament3: "完成重新武装"
 FRA_french_rearmament3_desc: "我们的人民和武装部队已做好应对大规模冲突的准备。"
 french_nuclear_expert: "法国核专家"
 french_nuclear_expert_desc: "我们已接受法国核技术专家的援助。他们将帮助我们实现能源独立。"
 french_dissuasion: "法国核威慑"
 french_dissuasion_desc: "我们已同意，一旦与敌对势力发生冲突，将接受法国和欧盟的保护。"
 FRA_Our_project: "我们在法国的项目"
 FRA_Our_project_desc: "尽管公众最初有所抵触，但他们逐渐意识到，我们所做的一切都必须是为了保护法国的未来。我们比以往任何时候都更能免受经济和地缘政治动荡的影响。而且这种情况在未来很长一段时间内都将持续下去。"
 FRA_french_independant1: "我们自己的事业"
 FRA_french_independant1_desc: "法国不会屈从于任何一个阵营。保持独立反而能赢得其他所有不愿选边站队的强国的信任。"
 FRA_french_independant2: "不听命于任何首都"
 FRA_french_independant2_desc: "我们拒绝结盟的立场已成为既定政策。华盛顿和莫斯科现在都不指望我们投票支持，不结盟世界也把我们视为自己人。"
 FRA_french_independant3: "武装下的独立"
 FRA_french_independant3_desc: "独立不再是一种外交姿态，而是一种防御原则。一个不向任何国家负责的国家必须能够独立捍卫自身阵地，而我们现在就具备了这种能力。"
 FRA_NATO_support: "北约支持"
 FRA_NATO_support_desc: "通过重申我们对联盟的支持，我们与其他成员国建立了伙伴关系。"
 FRA_entente_china: "与中国的协约"
 FRA_entente_china_desc: "我们已与中国达成协议，以促进两国之间的贸易。"
 FRA_regulation: "市场监管"
 FRA_regulation_desc: "通过对市场及其活动进行监管，我们可以避免未来的危机。"
 FRA_eternal_fra: "永恒的法国"
 FRA_eternal_fra_desc: "我们的项目即将结束，我们坚信已经向世界证明，法国已经回归，并将永远在国际舞台上熠熠生辉。"
 FRA_europhile_anger_idea: "亲欧示威游行"
 FRA_europhile_anger_idea_desc: "我们部分民众不愿脱离欧盟。这种情况只会持续一段时间，但我们必须确保法国人民明白，这是唯一的出路。"
 FRA_EU_Retaliate: "经济复苏"
 FRA_EU_Retaliate_desc: "脱离欧盟使我们陷入了艰难的经济境地，但无论付出什么代价，我们都会东山再起。"
 FRA_EU_Retaliate2: "初步恢复"
 FRA_EU_Retaliate2_desc: "我们的努力开始见效了；我们的经济正在复苏，这一次没有人再给我们施加压力，也没有人再阻止我们按照自己的意愿支配金钱。"
 FRA_russian_cooperation1: "俄罗斯合作"
 FRA_russian_cooperation1_desc: "俄罗斯政府已同意与我们分享其工业技术。希望这种合作能够继续下去。"
 FRA_russian_cooperation2: "俄罗斯伙伴关系"
 FRA_russian_cooperation2_desc: "俄罗斯政府已同意与我们分享其工业和军事技术。希望这种合作能够继续下去。"
 FRA_a_certain_idea: "法国的某种形象"
 FRA_a_certain_idea_desc: "我们终于抵达了征程的终点。我们使法国免于被欧洲边缘化。法国的独立得到了保障。我们的领袖戴高乐将军会为我们感到骄傲的。"
 FRA_blocade: "贸易流动中断"
 FRA_blocade_desc: "我们拒绝向法国的勒索屈服，所以他们正在竭尽所能阻止欧盟其他国家的货物运抵我们这里。"
 FRA_shocking: "失望的人群"
 FRA_shocking_desc: "我们的人民对第六共和国的计划非常热情，但最终我们决定维持原有的宪法。他们对此很不高兴。"
 FRA_draft6threp: "政局动荡"
 FRA_draft6threp_desc: "我们对共和国宪法进行彻底改革的渴望，在民众中激起了极大的热情，为人民开辟了新的前景。然而，这也为新的政治运动的出现铺平了道路，而这些运动未必总是对我们有利。"
 FRA_fail6threp: "宗教改革的失败"
 FRA_fail6threp_desc: "我们未能将人民从第五共和国的统治下解放出来；面对达成共识的重重困难，他们最终失去了希望。或许我们能够改变法律，但就人民而言，我们未能给他们带来他们所期盼的改变。"
 FRA_ecological_transition: "确保生态转型"
 FRA_ecological_transition_desc: "为了确保子孙后代的未来，我们需要保护环境。为此，我们必须改变消费和生产方式。"
 FRA_insoumission: "蔑视"
 FRA_insoumission_desc: "我们已成功落实了竞选时提出的各项纲领。我们使法国比以往任何时候都更具社会责任感、环保意识和人文关怀。但我们仍有许多工作要做，我们将迎接挑战。我们必须做得更好。"
 FRA_eu_social_climate: "社会和环境改革"
 FRA_eu_social_climate_desc: "我们已同意效仿“不屈法国”的榜样。我们的人民深受鼓舞。虽然这会对我们的财务造成一定影响，但这可以被视为一项长期投资。"
 FRA_research_boost: "研究投资"
 FRA_research_boost_desc: "我们已在研究和教育领域投入巨资，以确保子孙后代能够更好地应对现代挑战。从长远来看，这必将有所回报。"
 FRA_refit_network: "改造我们的交通网络"
 FRA_refit_network_desc: "为了优化货物和旅客运输，我们首先必须对运输网络进行现代化改造。我们已为此拨出必要的资源。"
 FRA_eden_garden: "我们的伊甸园"
 FRA_eden_garden_desc: "我们竭尽全力保护国家和世界免受气候变化的侵害，为构建一个能够应对本世纪挑战的社会奠定了基础。应对气候变化还需要付出更多努力，但我们已尽最大努力引领这场变革。"
 FRA_eu_green_reform: "环境改革"
 FRA_eu_green_reform_desc: "我们决定效仿法国绿党，投资绿色转型。虽然这会减缓我国的经济增长速度，但这却是对子孙后代的投资。"
 FRA_EU_transit: "生态转型支持基金"
 FRA_EU_transit_desc: "我们已同意加入生态转型支持基金。这项倡议由法国绿党发起，旨在帮助我们从碳基经济向低碳经济转型。"
 FRA_eu_ban_fossile: "逐步淘汰化石燃料"
 FRA_eu_ban_fossile_desc: "我们正在逐步淘汰化石燃料。我们的车辆将使用电力驱动，化石燃料仅用于次要用途。这项由法国绿党发起的转型代价不菲，但这却是对我们未来的投资，也是对我们摆脱对石油生产国依赖的保障。"
 FRA_regulation_agra: "农业法规"
 FRA_regulation_agra_desc: "我们同意遵守欧盟的食品生产法规。如果我们不想失去一个重要的贸易伙伴，这是我们唯一的选择。"
 FRA_regulation_indus: "工业法规"
 FRA_regulation_indus_desc: "我们同意遵守欧盟的商品生产法规。如果我们不想失去一个重要的贸易伙伴，这是我们唯一的选择。"
 FRA_regulation_fuel: "石油开采法规"
 FRA_regulation_fuel_desc: "我们同意遵守欧盟的燃料开采法规。如果我们不想失去一个重要的贸易伙伴，这是我们唯一的选择。"
 FRA_EU_rail: "Building an European Transport Network"
 FRA_EU_rail_desc: "We have agreed to help France and the rest of the European Union to work together to build a better transport network to facilitate trade and optimise the transport of goods."
 FRA_eu_pcf_reform: "Buying Social Peace"
 FRA_eu_pcf_reform_desc: "We agreed to make concessions to our radical left after they began to stir following the victory of communism in France. We gave them what they wanted, and they should now keep quiet."
 FRA_fr_military_assistance: "French Military Assistance"
 FRA_fr_military_assistance_desc: "We have accepted France's assistance in preparing our armed forces for a high-intensity conflict with Russia. The day they cross our border, we will be ready."
 FRA_european_internationale: "The European International"
 FRA_european_internationale_desc: "We have formed an alliance with another communist power in Europe. Together we will defeat capitalism and fascism once and for all."
 FRA_international_will_be_humankind: "The International will be the human race"
 FRA_international_will_be_humankind_desc: "We have managed to consolidate our hard-won power. We have achieved the impossible: we have secured the lasting triumph of communism in France. There is still much to be done, but we have laid the right foundations for the fight against capitalism and fascism in France."
 FRA_eu_FN_reform: "Ensuring Security"
 FRA_eu_FN_reform_desc: "We have responded positively to the call from our people to implement national preference and to tackle insecurity. Although these reforms are a consequence of the rise of the far right in Europe, they also strengthen our ability to exercise control over our population, which is a good thing."
 FRA_nuke_boost: "Nuclear Primacy"
 FRA_nuke_boost_desc: "Nuclear power has been providing us with energy for decades; it is a fantastic way of generating low-carbon energy at low cost. We should simply step up the monitoring of these reactors to ensure that nothing serious happens."
 FRA_Boreal_Space: "The Boréal Space"
 FRA_Boreal_Space_desc: "The Boréal Space is a partnership between the Russian Sphere and the Francosphere, with the aim of integrating Russia into a European alliance. Our goal today is to combat the ultra-globalist threat, an enemy we share."
 FRA_france_for_french: "France for French"
 FRA_france_for_french_desc: "Ever since our foundation, we have had to contend with a pro-immigration faction that has always stood united against us. But now that we have completed our programme, we have demonstrated our ability to lead and guide France towards its destiny; any further resistance is now pointless."
 FRA_red_purges: "The Purge of the Officer Corps"
 FRA_red_purges_desc: "The old officer corps was never ours, so we have broken it and promoted from the ranks instead. Command is loyal now, and cheap to replace, but a professional army has been traded for one that is still learning its trade under fire."
 FRA_people_constitution: "The People's Constitution"
 FRA_people_constitution_desc: "Our revolution has been a success, but we must consolidate our power by giving workers the opportunity to decide for themselves how they want to be governed."
 FRA_commies_redarmy1: "The New Red Army"
 FRA_commies_redarmy1_desc: "Our revolution needs an army to defend itself and to spread its cause. Building on the foundations of the French army, we have established a new force that will defend the people and the revolution."
 FRA_commies_redarmy2: "The New Red Army"
 FRA_commies_redarmy2_desc: "Our revolution needs an army to defend itself and to spread its cause. Building on the foundations of the French army, we have established a new force that will defend the people and the revolution."
 FRA_red_agent_lar: "General Directorate for Revolutionary Action"
 FRA_red_agent_lar_desc: "We have modelled our approach on the DGSE's techniques in order to obtain crucial information about our reactionary and capitalist enemies."
 FRA_red_agent_non_lar: "General Directorate for Revolutionary Action"
 FRA_red_agent_non_lar_desc: "We have modelled our approach on the DGSE's techniques in order to obtain crucial information about our reactionary and capitalist enemies."
 FRA_monarchist_anger: "The Wrath of the Monarchists"
 FRA_monarchist_anger_desc: "Our monarchist allies were disappointed by our refusal to restore aristocratic privileges. Bonapartism is an heir to the Revolution; it could not be otherwise."
 FRA_bonapart_constitution: "The Bonapartist Constitution"
 FRA_bonapart_constitution_desc: "Since the Third Republic, our institutions have no longer been designed to accommodate an Emperor of our stature. We must therefore adapt the constitution to our forthcoming reign. We can take this opportunity to address some of the criticisms levelled by our people at the previous republics; that will be a step in the right direction for them."
 FRA_bonapart_military_reform: "Reorganisation of the Grande Armée"
 FRA_bonapart_military_reform_desc: "Our armed forces are sufficient to ensure our security within our territory, but they are not sufficient to carry out our plans to reclaim our Empire. A restructuring is essential; we are going to dismantle everything from the very top down, so that we can then reform each branch more effectively."
 FRA_army_reformed_1: "Restructured Chain of Command"
 FRA_army_reformed_1_desc: "Now that our command chain has been restructured, we can afford to carry out a more far-reaching reform of our armed forces, including their technology and order book. A major undertaking lies ahead, but this will give us the resources to realise our ambitions."
 FRA_army_reformed_infantry: "Reform of the Grande Armée: The Infantry Line"
 FRA_army_reformed_infantry_desc: "Our Emperor has ruled in favour of a slow and controlled advance. Priority will therefore be given to the infantry and the equipment they require."
 FRA_army_reformed_cavalry: "Reform of the Grande Armée: The Armoured Wedge"
 FRA_army_reformed_cavalry_desc: "Our Emperor has ruled in favour of a fast and powerful attack. Priority will therefore be given to tank battalions and the equipment they require."
 FRA_army_reformed_artillery_infantry: "Reform of the Grande Armée: Infantry and Guns"
 FRA_army_reformed_artillery_infantry_desc: "Our Emperor has ruled in favour of a slow and controlled advance supported by artillery. Priority will therefore be given to the infantry and artillery, as well as the associated equipment."
 FRA_army_reformed_artillery_cavalry: "Reform of the Grande Armée: Armour and Guns"
 FRA_army_reformed_artillery_cavalry_desc: "Our Emperor has ruled in favour of a fast and powerful attack supported by artillery. Priority will therefore be given to tank battalions and artillery, as well as the associated equipment."
 FRA_army_reformed_air_infantry: "Reform of the Grande Armée: Infantry and Air Power"
 FRA_army_reformed_air_infantry_desc: "Our Emperor has ruled in favour of a slow and controlled advance supported by attack planes. Priority will therefore be given to infantry battalions and mass-producing planes."
 FRA_army_reformed_air_cavalry: "Reform of the Grande Armée: Armour and Air Power"
 FRA_army_reformed_air_cavalry_desc: "Our Emperor has ruled in favour of a fast and powerful attack supported by attack planes. Priority will therefore be given to tank battalions and mass-producing planes."
 FRA_BCE_money: "The Money of the EU"
 FRA_BCE_money_desc: "We have succeeded in negotiating our return to the European Union's institutions in exchange for aid from the European Bank. This aid will be vital in preparing for the wars we are going to wage against them!"
 FRA_4th_empire_desc: "The Bonapartist Empire is back, stronger than ever, and this time we will not be defeated by any coalition whatsoever."
 FRA_grande_arme_art_inf: "The Modern Grande Armée"
 FRA_grande_arme_art_inf_desc: "After months of reforms, our army is fully prepared to set out to reclaim the Empire's lost territories. Following a complete overhaul of its system, we have rebuilt it around a strategy of slow and steady advance, backed by intensive bombardments of enemy lines. The infantry remains the king of the battlefield, but the assault air force will make its task considerably easier."
 FRA_grande_arme_art_cav: "A Deluge of Fire and Steel"
 FRA_grande_arme_art_cav_desc: "After months of reforms, our army is fully prepared to set out to reclaim the Empire's lost territories. Following a complete overhaul of its system, we have rebuilt it around a strategy of rapid and brutal advance, backed by intensive bombardments. This strategy relies on technologically advanced resources, but we have the means to surpass Napoleon's deluge."
 FRA_grande_arme_air_inf: "The Sky Clears the Way"
 FRA_grande_arme_air_inf_desc: "After months of reforms, our army is fully prepared to set out to reclaim the Empire's lost territories. We have rebuilt it around a measured infantry advance conducted entirely beneath our own air cover, with strike aircraft and reconnaissance breaking each position before a rifleman is committed to it. The foot soldier still takes the ground, but he no longer walks onto it blind."
 FRA_grande_arme_air_cav: "Thunder Before the Charge"
 FRA_grande_arme_air_cav_desc: "After months of reforms, our army is fully prepared to set out to reclaim the Empire's lost territories. We have rebuilt it around armoured columns that move only where the air force has already passed, trading the artillery train for strike wings that keep pace with the advance. Nothing slows the charge, and nothing survives ahead of it."
 FRA_surrounded: "Continental blockade"
 FRA_surrounded_desc: "Our rise to power has not gone unnoticed, and it is clear that the other European powers are already plotting against us. In particular, Great Britain, which has been our sworn enemy in the past. We must bring down each and every one of these European powers; our survival and that of the revolution depend on it."
 FRA_Sachons_vaincre: "Le Deluge"
 FRA_Sachons_vaincre_desc: "Having spent months preparing our people for a high-intensity conflict, they are now ready for this long-awaited war. Their enthusiasm and faith can move mountains, but we must act quickly before it wanes. We must crush our opponents as quickly as possible."
 FRA_prepare_to_fight: "Preparing our Return"
 FRA_prepare_to_fight_desc: "We have opted for a cautious approach; knowing that our people are fully behind our expansionist ambitions, all that remains is for us to provide them with the means to realise those ambitions. We must ensure that, when the time comes, we are ready."
 FRA_defense_napoleon: "Emergency state"
 FRA_defense_napoleon_desc: "Following the terrorist attacks carried out on our borders by the Bonapartists, our country is on high alert. Whatever happens, we will be ready."
 FRA_thousands_planes: "Aerial Arms Race"
 FRA_thousands_planes_desc: "We have chosen to fight the United States, which for too long has sought to dominate us and the rest of Europe. To protect Europe, we must destroy them, and to destroy them we must be able to compete in the air, as we do not have the means to defeat them at sea."
 FRA_trade_USA: "Transatlantic Trade"
 FRA_trade_USA_desc: "The United States and the French Empire have joined forces to trade across the Atlantic. These agreements will bring them peace and prosperity in return for guarantees of peace."
 FRA_king_camelot_lar: "The King's Camelots"
 FRA_king_camelot_lar_desc: "Our secret police, tasked with suppressing all revolutionary tendencies and other anti-royalist movements."
 FRA_king_camelot_non_lar: "The King's Camelots"
 FRA_king_camelot_non_lar_desc: "Our secret police, tasked with suppressing all revolutionary tendencies and other anti-royalist movements."
 FRA_king_constitution: "The Monarchist Constitution"
 FRA_king_constitution_desc: "All these republics that our country has gone through have built institutions on shaky foundations. We must rewrite this rubbish, because every state, even under our absolute rule needs laws."
 FRA_chivalry: "Modern Chivalry"
 FRA_chivalry_desc: "The French monarchy has always relied on a powerful cavalry force. We have chosen to continue in this vein by prioritising mechanised cavalry over infantry."
 FRA_elite_army: "An Army of Elites"
 FRA_elite_army_desc: "The Revolutionary Wars brought about conscription. However, the many conflicts we have experienced have proved to be extremely costly in terms of human lives. The King's subjects are not always well-trained for warfare. We have therefore chosen to focus on a smaller but far better-trained force."
 FRA_prepare_crusade: "The Tenth Crusade"
 FRA_prepare_crusade_desc: "Our forces are ready to set out to conquer the Holy Land."
 FRA_political_preassure: "Strengthening our Diplomacy"
 FRA_political_preassure_desc: "We have not managed to diplomatically win over Lebanon, so we need to improve the way we engage with foreign powers."
 FRA_navy_crusade: "The Maritime Crusade"
 FRA_navy_crusade_desc: "We have decided retake the Holy Land by the sea. This requires effective amphibious offensive capabilities."
 FRA_commie_europe_integration: "European Assimilation"
 FRA_commie_europe_integration_desc: "We have brought the revolution and communism to the rest of Europe. It is now time to forge a union of the proletariat from every country into a European federation that will be capable of ensuring the revolution endures."
 FRA_counter_insurgency: "Effective Military Policing"
 FRA_counter_insurgency_desc: "The Spanish guerrillas posed a problem for Napoleon I, but that won't be the case for us."
 FRA_attack_benelux: "Battle Plan: Benelux"
 FRA_attack_benelux_desc: "We must focus on annihilating the Benelux forces. Our Emperor has given us the means to defeat them swiftly."
 FRA_attack_iberia: "Battle Plan: Iberia"
 FRA_attack_iberia_desc: "We must focus on annihilating the Iberian forces. Our Emperor has given us the means to defeat them swiftly."
 FRA_attack_germany: "Battle Plan: Germany"
 FRA_attack_germany_desc: "We must focus on annihilating the German forces. Our Emperor has given us the means to defeat them swiftly."
 FRA_attack_holy_roman: "Battle Plan: Southern Europe"
 FRA_attack_holy_roman_desc: "We must focus on annihilating the remain of southern European forces. Our Emperor has given us the means to defeat them swiftly."
 FRA_BON_support_allies: "Preparing for a Long War"
 FRA_BON_support_allies_desc: "Our French partner has suggested that we prepare for a high-intensity conflict with Russia."
 FRA_attack_east: "Battle Plan: Eastern Europe"
 FRA_attack_east_desc: "We must focus on annihilating the eastern European forces. Our Emperor has given us the means to defeat them swiftly. This is the final step before our final campaign."
 FRA_attack_russia_fast: "La Fleur au Fusil"
 FRA_attack_russia_fast_desc: "We'll be in Moscow in two weeks' time!"
 FRA_attack_russia_slow: "Cautious Advance"
 FRA_attack_russia_slow_desc: "This time there won't be a Berezina"
 FRA_attack_UK_naval: "Cross the Channel"
 FRA_attack_UK_naval_desc: "The Royal Navy is no longer a threat to us; victory is within our grasp."
 FRA_attack_UK_air: "Jump Over the Channel"
 FRA_attack_UK_air_desc: "We must maintain control of the airspace and take our opponent by surprise."
 FRA_BON_victory: "Imperial Protectorate"
 FRA_BON_victory_desc: "We have been conquered by the Napoleonic Empire."
 FRA_expansion_europe: "Heir of Charlemagne"
 FRA_expansion_europe_desc: "Our destiny is to reclaim the Carolingian Empire."
 FRA_expansion_europe_crusades: "Carolingian Crusade"
 FRA_expansion_europe_crusades_desc: "The Franks have regained their lands; we must now set out for the Holy Land."
 FRA_expansion_crusades: "Heir of Saint Louis"
 FRA_expansion_crusades_desc: "The duty of our Kingdom is to serve God and reclaim the Holy Land."
 FRA_EMPIRE_occident: "The Western Empire"
 FRA_EMPIRE_occident_desc: "We have reconquered the Carolingian Empire and have been crowned Emperor of the West."
 FRA_crusade_done_jerusalem: "The Victorious Crusade"
 FRA_crusade_done_jerusalem_desc: "The Tenth Crusade has achieved its objective by recapturing Jerusalem and the Holy Land."
 FRA_expansion_crusades_plus: "The Last Crusade"
 FRA_expansion_crusades_plus_desc: "Having reclaimed our holy places, we have decided to make amends for the mistakes of the past. All schisms must be brought to an end."
 FRA_protestant_anger: "Protestant Resistance"
 FRA_protestant_anger_desc: "Our aggressive rhetoric towards Protestants has provoked their anger in our country."
 FRA_harsh_subjugation: "Harsh Subjugation"
 FRA_harsh_subjugation_desc: "Our suzerain, the King of France, has decided to control our economy and policies. Defeat comes at a heavy price."
 FRA_victory_crusade_2_conversion: "The Fifth Horseman of the Apocalypse"
 FRA_victory_crusade_2_conversion_desc: "Divine wrath has been unleashed upon our enemies."
 FRA_enlightment: "Protectorate of the Church"
 FRA_enlightment_desc: "Our suzerain, the King of France, has decided to help us rebuild our country, and to support us in the physical and cultural reconstruction of our society."
 FRA_victory_crusade_2_freedom_light: "The Eldest Daughter of the Church"
 FRA_victory_crusade_2_freedom_light_desc: "We must treat the lost sheep with the utmost kindness."
 FRA_attack_colonies: "Reclaiming the Empire Colonies"
 FRA_attack_colonies_desc: "The continental system must find the resources to ensure its continued existence."
 france_md.404.t: "The Accord with the Greens"
 france_md.404.d: "The negotiation is finished and the text is on the table. Twenty-four reactors closed, Fessenheim first, and nuclear reduced to half of the electricity mix within the decade. In exchange the Greens stand aside in sixty constituencies and the majority holds. The energy federations have already voted against it, and Montebourg has said in public what half the parliamentary group is saying in private. Do we sign?"
 france_md.404.a: "Sign it. The alliance is worth more than the reactors"
 france_md.404.b: "The fleet is not a bargaining chip"
 france_md.405.t: "全体人员的示威游行"
 france_md.405.d: "Our recent bill does not appear to have met with unanimous support amongst our fellow citizens. They filled the Champ de Mars and they intend to do it again every month until the bill dies. The organisers are careful, the placards are pink and blue, and behind them stands every conservative association in the country plus a good deal of the right's parliamentary group. The text as drafted covers marriage, adoption and filiation. We can hold the line on all three, or we can strip out what draws the largest crowds and pass the rest quietly."
 france_md.405.a: "The law passes entire. Let them march"
 france_md.405.b: "Trim the text and take what we can get"
 france_md.406.t: "The Roundabouts Are Occupied"
 france_md.406.d: "Eight weekends. The prefectures report a thousand roundabouts held, the Arc de Triomphe has been vandalised, and the flash-ball rounds have taken eyes in front of the cameras. There is no leadership to negotiate with because they refuse to appoint one. Interior wants the anti-rioter law and a free hand. The others want a national debate, town halls in every commune, and a package of concessions large enough to end this before the European elections."
 france_md.406.a: "Pass the anti-rioter law and clear the roundabouts"
 france_md.406.b: "Open the Grand Débat and pay for the peace"
 FRA_change_politics_nationalist: "Changes §Y$FRA_political_balance$§!: $FRA_balance_domestic_nationalist_drift$ by [?temp_change|%+]\n"
 FRA_truly_absolutism_TT: "§gWe will§! §RBan§! §gevery other party, and declare the kingdom a§! §YTruly Absolute Monarchy§!"
 FRA_social_welf_need_tooltip_modifier_effect_TT: "Changes §Y$FRA_social_balance$§!: $FRA_SOC_welf_ned$ by [?temp_change|%-]\n"
 FRA_4th_empire: "Third French Empire"
 threat_FRA_napo_empire: "Napoleon is back"
 FRA_liberal_arms_contracts: "Liberal Arms Export Policy"
 FRA_liberal_arms_contracts_desc: "Dassault, Naval Group, Thales, and MBDA lead one of the most advanced defence industries in the world. A liberal export policy lets us pursue lucrative contracts with nations seeking to modernise, filling our factories' order books while extending French influence through military partnerships."
 FRA_liberal_arms_contracts_tt: "Over the coming months, we will propose arms contracts to §YSaudi Arabia§!, §YUnited Arab Emirates§!, §YSerbia§!, §YGreece§!, §YEgypt§!, and §YIndia§!."
 FRA_arms_contract_opinion: "Arms Contract Partnership"
 france_md.323.t: "Courting Riyadh"
 france_md.323.d: "Riyadh is shopping for a fighter to fly alongside its Eurofighters, and Naval Group's engineers still service the Al Riyadh-class frigates built under the Sawari programme. Our defence ministry has drawn up a proposal for [SAU.GetNameWithFlag]. What should we offer?"
 france_md.323.a: "Light weapons package ($5 billion)"
 france_md.323.b: "Heavy weapons package ($15 billion)"
 france_md.323.c: "Premium Rafale package ($30 billion)"
 france_md.323.e: "We will not pursue this contract"
 france_md.324.t: "Riyadh Weighs a French Offer"
 france_md.324.d: "[FRA.GetNameWithFlag] is offering the Rafale as an alternative to our Eurofighter squadrons, alongside an extension of the Sawari frigate programme that Naval Group has serviced for decades."
 france_md.324.a: "Accept the contract"
 france_md.324.b: "Decline the offer"
 france_md.325.t: "Courting Abu Dhabi"
 france_md.325.d: "The Emirati air force still flies the Mirage 2000-9, the variant Dassault built specifically for Abu Dhabi in the 1990s. With that fleet ageing, our defence ministry sees an opening to pitch its successor, the Rafale, to [UAE.GetNameWithFlag]. What should we offer?"
 france_md.325.a: "Light weapons package ($5 billion)"
 france_md.325.b: "Heavy weapons package ($15 billion)"
 france_md.325.c: "Premium Rafale package ($30 billion)"
 france_md.325.e: "We will not pursue this contract"
 france_md.326.t: "Abu Dhabi Weighs a French Offer"
 france_md.326.d: "[FRA.GetNameWithFlag] proposes the Rafale as the successor to our Mirage 2000-9 fleet, the bespoke variant Dassault built for us three decades ago."
 france_md.326.a: "Accept the contract"
 france_md.326.b: "Decline the offer"
 france_md.327.t: "Courting Belgrade"
 france_md.327.d: "[SER.GetNameWithFlag] still flies Soviet-era MiG-29s and buys its short-range air defence from Moscow. We can offer the Rafale as their replacement, backed by MBDA's Mistral man-portable missiles for their air defence units. What should we propose?"
 france_md.327.a: "Light weapons package ($3 billion)"
 france_md.327.b: "Heavy weapons package ($8 billion)"
 france_md.327.c: "Premium Rafale package ($15 billion)"
 france_md.327.e: "We will not pursue this contract"
 france_md.328.t: "Belgrade Weighs a French Offer"
 france_md.328.d: "[FRA.GetNameWithFlag] is offering the Rafale as a Western alternative to our ageing MiG-29 fleet, together with MBDA's Mistral missiles for our air defence units. Accepting would mark our first major arms deal outside the Russian orbit."
 france_md.328.a: "Accept the contract"
 france_md.328.b: "Decline the offer"
 france_md.329.t: "Courting Athens"
 france_md.329.d: "[GRE.GetNameWithFlag] already flies our Rafales and wants to extend the relationship to the navy. Naval Group has pitched a FREMM-derived frigate package to match the air force order. What should we propose to our Hellenic allies?"
 france_md.329.a: "Light weapons package ($4 billion)"
 france_md.329.b: "Heavy weapons package ($12 billion)"
 france_md.329.c: "Premium Rafale package ($20 billion)"
 france_md.329.e: "We will not pursue this contract"
 france_md.330.t: "Athens Weighs a French Offer"
 france_md.330.d: "[FRA.GetNameWithFlag] proposes a package built around FREMM-derived frigates, extending a defence relationship already anchored by our earlier Rafale order."
 france_md.330.a: "Accept the contract"
 france_md.330.b: "Decline the offer"
 france_md.331.t: "Courting Cairo"
 france_md.331.d: "[EGY.GetNameWithFlag] already flies our Rafales, operates the two Mistral-class carriers built for Russia and redirected to Cairo, and commissioned the FREMM frigate Tahya Misr from our own navy's order book. What should we propose to deepen the partnership?"
 france_md.331.a: "Light weapons package ($4 billion)"
 france_md.331.b: "Heavy weapons package ($12 billion)"
 france_md.331.c: "Premium Rafale package ($25 billion)"
 france_md.331.e: "We will not pursue this contract"
 france_md.332.t: "Cairo Weighs a French Offer"
 france_md.332.d: "[FRA.GetNameWithFlag] offers to expand a partnership that already spans our Rafale squadrons, the Mistral-class carriers, and the FREMM frigate Tahya Misr."
 france_md.332.a: "Accept the contract"
 france_md.332.b: "Decline the offer"
 france_md.333.t: "Courting New Delhi"
 france_md.333.d: "[IND.GetNameWithFlag] operates one of the largest defence markets in the world. New Delhi already flies thirty-six Rafales and builds Scorpene-class submarines under licence at Mazagon Dock. What should we propose to expand the partnership?"
 france_md.333.a: "Light weapons package ($6 billion)"
 france_md.333.b: "Heavy weapons package ($20 billion)"
 france_md.333.c: "Premium Rafale package ($40 billion)"
 france_md.333.e: "We will not pursue this contract"
 france_md.334.t: "New Delhi Weighs a French Offer"
 france_md.334.d: "[FRA.GetNameWithFlag] proposes to build on the Rafales already in Indian Air Force service and the Scorpene-class submarines built under licence at Mazagon Dock."
 france_md.334.a: "Accept the contract"
 france_md.334.b: "Decline the offer"
 FRA_joint_weapon_projects_category: "Joint Weapon Development Projects"
 FRA_joint_weapon_projects_category_desc: "France has a long history of joint defence programmes, from the Jaguar strike aircraft with Britain to the Tiger helicopter with Germany. New joint projects let us split development costs and field equipment neither partner could afford alone."
 FRA_joint_project_germany: "Propose SCAF/MGCS Joint Project"
 FRA_joint_project_germany_desc: "SCAF (Système de Combat Aérien du Futur) pairs Dassault with Airbus to design a sixth-generation fighter to succeed the Rafale and Eurofighter. MGCS (Main Ground Combat System) tasks KNDS with a new main battle tank to replace the Leclerc and Leopard 2. Together they would be the largest defence programmes either nation has run since the Cold War."
 FRA_socialist_government_required_tt: "Requires a §YSocialist§! or §YLeft-wing§! government in power"
 FRA_joint_project_russia: "Propose Franco-Russian ATOM Project"
 FRA_joint_project_russia_desc: "We propose the ATOM infantry fighting vehicle as a joint programme with Moscow, pairing Nexter's design teams with Russian armoured vehicle engineers. Breaking with our Western allies this deeply requires leaving the EU first."
 FRA_nationalist_government_required_tt: "Requires a §YNationalist§! or §YNational Rally§! government in power"
 FRA_joint_project_opinion: "Joint Weapon Development Partner"
 france_md.335.t: "Franco-German SCAF/MGCS Project Proposal"
 france_md.335.d: "[FRA.GetNameWithFlag] proposes launching SCAF (Système de Combat Aérien du Futur) and MGCS (Main Ground Combat System) as joint programmes: a sixth-generation fighter to succeed the Rafale and Eurofighter, and a main battle tank to replace the Leclerc and Leopard 2. Dassault, Airbus, and KNDS would split the engineering work between Paris and Berlin."
 france_md.335.a: "Let us build the future of European defence together"
 france_md.335.b: "We prefer to develop our systems independently"
 france_md.336.t: "Germany Accepts SCAF/MGCS Project"
 france_md.336.d: "[GER.GetNameWithFlag] has accepted our proposal for SCAF and MGCS. Dassault and Airbus engineers will work alongside their German counterparts on the fighter programme, while KNDS leads the tank."
 france_md.336.a: "Excellent! Long live Franco-German cooperation!"
 france_md.337.t: "Franco-Russian ATOM Project Proposal"
 france_md.337.d: "[FRA.GetNameWithFlag] proposes the ATOM infantry fighting vehicle as a joint Franco-Russian programme, pairing Nexter's engineers with Russian armoured vehicle designers. Having already distanced itself from its traditional Western allies, Paris is now looking east for defence partners."
 france_md.337.a: "A new era of Franco-Russian cooperation begins"
 france_md.337.b: "This proposal is too controversial"
 france_md.338.t: "Russia Accepts ATOM Project"
 france_md.338.d: "[RUS.GetNameWithFlag] has accepted our proposal for the ATOM programme. Nexter engineers will work alongside their Russian counterparts on a new infantry fighting vehicle, our first major defence partnership with Moscow since the Cold War."
 france_md.338.a: "A new chapter in Franco-Russian relations!"
 FRA_FCAS_MGCS_project: "SCAF/MGCS Development Programme"
 FRA_FCAS_MGCS_project_desc: "France and Germany are jointly developing SCAF (Système de Combat Aérien du Futur), a sixth-generation fighter led by Dassault and Airbus, and MGCS (Main Ground Combat System), a new main battle tank led by KNDS. Together they are the largest defence programmes either country has run since the Cold War."
 GER_FCAS_MGCS_project: "SCAF/MGCS Development Programme"
 GER_FCAS_MGCS_project_desc: "Germany and France are jointly developing SCAF (Système de Combat Aérien du Futur), a sixth-generation fighter led by Airbus and Dassault, and MGCS (Main Ground Combat System), a new main battle tank led by KNDS. Together they are the largest defence programmes either country has run since the Cold War."
 FRA_RUS_joint_project: "Franco-Russian ATOM Programme"
 FRA_RUS_joint_project_desc: "France and Russia have launched a joint military development programme, the ATOM infantry fighting vehicle project. Nexter's engineers pair with Russian armoured vehicle designers to produce a new IFV platform."
 RUS_FRA_joint_project: "Franco-Russian ATOM Programme"
 RUS_FRA_joint_project_desc: "Russia and France have launched a joint military development programme, the ATOM infantry fighting vehicle project. Russian armoured vehicle designers pair with Nexter's engineers to produce a new IFV platform."
 FRA_constitutional_crisis_pcf: "The Revolutionary Temptation"
 FRA_constitutional_crisis_pcf_desc: "Within our leftist coalition, a radical faction has been gaining influence. These revolutionary hardliners believe that democratic socialism moves too slowly and demand immediate, total transformation. The moderate leadership of La France Insoumise and the PCF struggles to contain extremists who see the general strike as the first step toward revolution."
 FRA_abolish_fifth_republic_pcf: "The Extremists Seize Control"
 FRA_abolish_fifth_republic_pcf_desc: "The radical faction within the left has outmanoeuvred the moderate leadership. Mélenchon and the PCF reformists have been sidelined by revolutionary hardliners who reject the Fifth Republic's 'bourgeois democracy' entirely. They demand a Constituent Assembly to draft a new constitution, backed by enough street power to enforce their will."
 FRA_sixth_republic: "Proclaim the Sixth Republic"
 FRA_sixth_republic_desc: "The moderate faction has regained some influence, steering the revolution toward a democratic socialist Sixth Republic rather than outright communism. This compromise preserves republican institutions while fundamentally transforming French society through parliamentary means."
 FRA_french_commune_peaceful: "Establish the French Commune"
 FRA_french_commune_peaceful_desc: "The revolutionary hardliners have triumphed completely. In the spirit of the Paris Commune of 1871, France will become a true workers' state. The means of production will be collectivised, worker councils will govern at all levels, and the moderate reformists have lost control entirely."
 FRA_republic_safe_pcf: "Our Most Precious Possession"
 FRA_republic_safe_pcf_desc: "We have arrested the radical faction leaders and disbanded their paramilitary cells. The Republic survives. Mélenchon and the moderate reformists retain control of the left. The revolutionary dream is over, replaced by the slower, more stable path of democratic reform."
 FRA_question_republic_fn: "The Questionable Republic"
 FRA_question_republic_fn_desc: "Within the National Rally, a traditionalist faction has been growing in influence. While [FRA.GetLeader] and the mainstream leadership remain committed to the Republic, these extremists, inspired by Action Française and the Catholic traditionalist movement, openly question whether democracy itself has failed France. We must act before it is too late."
 FRA_referendum_republic: "The Hardliners Force a Referendum"
 FRA_referendum_republic_desc: "The traditionalist faction has outmanoeuvred Le Pen's moderate republicans. Action Française militants, Catholic intégristes, and nostalgic monarchists have seized control of the party apparatus. They demand a referendum on the very existence of the Republic, and the mainstream leadership can no longer stop them."
 FRA_restore_kingdom_fn: "Restore the Kingdom"
 FRA_restore_kingdom_fn_desc: "The monarchist faction within the movement has won. Whether we crown the Orleanist pretender Jean d'Orléans as 'King of the French' or the Legitimist claimant Louis de Bourbon as 'King of France,' the republican moderates of the government coalition have been completely sidelined by the traditionalist extremists."
 FRA_restore_empire_fn: "Restore the Empire"
 FRA_restore_empire_fn_desc: "The Bonapartist faction has triumphed. Jean-Christophe Napoléon Bonaparte will be crowned Napoleon VII. The moderate republicans who once led the government have been swept aside by those who dream of imperial glory: a strong France united under an Emperor, not squabbling parliamentarians."
 FRA_republic_safe_fn: "Saving the Republic"
 FRA_republic_safe_fn_desc: "We have arrested the traditionalist faction leaders and disbanded their paramilitary cells. The Republic survives! Our government and the moderate nationalists retain control. Using the crisis as justification, we pass reforms to reinforce the power of the state: expanded security services, stricter controls on extremist organisations, and enhanced executive authority. The Fifth Republic endures, stronger than ever."
 france_md.370.t: "Keeping Our Hands Clean"
 france_md.370.d: "Our rise to power already seems to have caught the attention of political movements. This morning we were contacted by revolutionary communist cells. They have offered to help us consolidate our hold on power, in particular by gathering information on our political opponents and tracking down far-right splinter groups to prevent them from harming us. We shouldn't get involved with such groups, as we are now committed to reform and the Republic. But it would still be useful to have this tool."
 france_md.370.a: "Allow them to organise: we need their support"
 france_md.370.b: "Reject them: we are democrats, not revolutionaries"
 france_md.371.t: "Voices From the Shadows"
 france_md.371.d: "Our success in the elections and our effectiveness in implementing a nationalist programme have not gone unnoticed. We have received proposals from various traditionalist splinter groups: Action Française sympathisers, Catholic intégristes, and those who dream of restoring the monarchy. They were impressed by our performance and are offering us their paramilitary networks and political connections in exchange for being allowed to organise openly. Their true intentions remain veiled."
 france_md.371.a: "Allow them to organise: their support strengthens us"
 france_md.371.b: "Reject them: we stand with the republic"
 france_md.372.t: "The Republic Stands"
 france_md.372.d: "The radical faction has been broken. Their leaders are arrested, their cells disbanded, their dreams of revolution crushed. The moderate reformists remain in control, and France remains a republic, transformed perhaps but still recognisably democratic. The extremists gambled and lost."
 france_md.372.a: "Reformism always wins"
 france_md.373.t: "Long Live the Republic!"
 france_md.373.d: "The traditionalist coup has been foiled! The DGSI moved swiftly: Action Française leaders are in custody, monarchist cells have been raided, and the dreams of restoration lie in ruins. The people celebrate in the streets as Le Pen addresses the nation: the Fifth Republic stands strong. Using this crisis as justification, we pass sweeping reforms to reinforce state authority and ensure such threats never arise again."
 france_md.373.a: "The Republic is saved, stronger than ever!"
 france_md.374.t: "The Factions Fight for Power"
 france_md.374.d: "The coup has succeeded. The Republic has fallen. But now the traditionalist factions turn on each other. The monarchists demand restoration of the Bourbon or Orléans line. The Bonapartists dream of imperial glory under Napoleon VII. Only one faction can win. Which vision will prevail?"
 france_md.374.a: "The Monarchists prevail: restore the Kingdom!"
 france_md.374.b: "The Bonapartists triumph: restore the Empire!"
 france_md.340.t: "The Looming Uprising"
 france_md.340.d: "The radical faction has grown too bold. Their paramilitary cells have been exposed, their infiltration of the party apparatus revealed. There are even rumours that they have infiltrated our army's high command and are preparing for a coup d'état. We must choose: crack down on them now and preserve the Republic, or let them continue their work and see where it leads. The DGSI awaits our orders."
 france_md.340.a: "Crack down: arrest the radical leaders"
 france_md.340.b: "Let them be: the revolution must continue"
 france_md.341.t: "The Radicals Seize Power"
 france_md.341.d: "It happened in a single night. The radical faction moved with precision: their paramilitary cells seized key buildings, their infiltrators in the military secured crucial bases. [FRA.GetLeader] and the moderate reformists wake to find themselves prisoners in all but name. The revolutionary hardliners have executed their coup. The Fifth Republic is dead."
 france_md.341.a: "The revolution has begun"
 france_md.345.t: "The Commune Rises Again"
 france_md.345.d: "The revolutionary hardliners have won completely. Rejecting any compromise with 'bourgeois democracy,' they have proclaimed the French Commune, a true workers' state in the tradition of 1871. The moderate reformists who built the original coalition have been purged or fled. The red flag flies over the Élysée Palace, and the revolution has only just begun."
 france_md.345.a: "Long live the Commune! The Internationale shall be the human race!"
 france_md.375.t: "Fight or Fold"
 france_md.375.d: "The traditionalist faction has grown too confident. Their paramilitary networks have been exposed, their infiltration of the party apparatus revealed. There are even rumours that they have infiltrated our army's high command and are preparing for a coup d'état. We must choose: crack down on them now and preserve the Republic, or let them continue their work and see where it leads. The DGSI awaits our orders."
 france_md.375.a: "Crack down: arrest the traditionalist leaders"
 france_md.375.b: "Let them be: the restoration must continue"
 france_md.376.t: "The Traditionalists Seize Power"
 france_md.376.d: "It happened in a single night. The traditionalist faction moved with precision: their paramilitary cells secured key buildings, their allies in the military ensured non-interference. [FRA.GetLeader] and the moderate republicans wake to find themselves sidelined completely. The extremists have executed their coup. The Fifth Republic is dead. But who will rule the new France?"
 france_md.376.a: "The factions must now decide"
 france_md.354.t: "The Monarchists Choose Their King"
 france_md.354.d: "The monarchist faction within the movement must now choose their sovereign. Two claimants present themselves: Jean d'Orléans, Count of Paris, represents the Orleanist line, and would be a constitutional monarch, 'King of the French.' Louis de Bourbon, Duke of Anjou, represents the Legitimist line of Louis XIV, and would be 'King of France' by divine right. The Action Française traditionalists must decide."
 france_md.354.a: "Crown Jean d'Orléans, King of the French"
 france_md.354.b: "Crown Louis de Bourbon, King of France"
 france_md.357.t: "The Bonapartists Triumph"
 france_md.357.d: "The Bonapartist faction within the movement has won the internal struggle. Jean-Christophe Napoléon Bonaparte will be crowned Napoleon VII. The military and those who dream of imperial glory have prevailed over the monarchists. Marine Le Pen and the old republican guard of the National Rally have been swept aside completely. France will be an Empire once more."
 france_md.357.a: "Long live the Emperor! Long live France!"
 france_md.358.t: "Bonapartists Seize Power in France"
 france_md.358.d: "Shocking news from [FRA.GetNameWithFlag]: extremist factions within the ruling party have seized control and abolished the Fifth Republic. The moderate leadership has been sidelined as radicals restore imperial rule. This dramatic coup against democracy has shocked the world. How should we respond ?"
 france_md.358.a: "Condemn this extremist takeover"
 france_md.358.b: "This is an internal French matter"
 FRA_extremist_paramilitary_left: "Revolutionary Paramilitary"
 FRA_extremist_paramilitary_left_desc: "We have allowed the radical faction to organise their paramilitary networks openly. These revolutionary cells provide us with street power and control over potential dissent. But at what cost? Their true loyalties remain with the revolution, not the party leadership."
 FRA_extremist_paramilitary_right: "Traditionalist Paramilitary"
 FRA_extremist_paramilitary_right_desc: "We have allowed the traditionalist faction to organise their paramilitary networks openly. These Action Française cells provide us with street power and control over potential dissent. But at what cost? Their true loyalties remain with the restoration, not the party leadership."
 FRA_radical_infiltration: "Radical Infiltration"
 FRA_radical_infiltration_desc: "The radical faction is quietly infiltrating the party apparatus and military. Their revolutionary cells spread through the institutions, building the network they will need when the time comes. The moderate leadership remains unaware of how deep the infiltration runs."
 FRA_traditionalist_infiltration: "Traditionalist Infiltration"
 FRA_traditionalist_infiltration_desc: "The traditionalist faction is quietly infiltrating the party apparatus and military. Their monarchist cells spread through the institutions, building the network they will need when the time comes. The moderate leadership remains unaware of how deep the infiltration runs."
 FRA_republic_stabilized_left: "Republic Stabilised"
 FRA_republic_stabilized_left_desc: "The radical threat has been neutralised. The DGSI has arrested the extremist leaders and dismantled their paramilitary cells. France remains a republic, and the moderate reformists retain control of the left. The revolution won't happen, but we'll make sure we give the people the tools to express themselves in other ways."
 FRA_republic_stabilized_right: "Strong Republic"
 FRA_republic_stabilized_right_desc: "The traditionalist threat has been crushed, and we used the crisis to pass sweeping reforms reinforcing state power. The DGSI now has expanded surveillance authority, the police have new powers against extremist organisations, and executive authority has been strengthened. The Fifth Republic endures: stronger, more centralised, and firmly under nationalist control."
 FRA_general_strike: "Revolutionary General Strike"
 FRA_general_strike_desc: "A radical faction within the leftist coalition has mobilised the workers for a general strike, going beyond what the moderate leadership intended. The CGT has been captured by revolutionary hardliners who see this as the first step toward ending the Republic entirely. The party leadership has lost control of the movement they started."
 FRA_sixth_republic_idea: "The Sixth Republic"
 FRA_sixth_republic_idea_desc: "No one wanted the Fifth Republic any more, so we brought it to an end democratically and established a new republic that is closer to the people."
 FRA_commune_reborn_idea: "The French Commune"
 FRA_commune_reborn_idea_desc: "The revolutionary hardliners have triumphed completely. The moderate reformists who once led the left have been purged as France transforms into a workers' state. In the spirit of 1871, worker councils now govern and the means of production have been collectivised. The red flag flies where the tricolour once flew."
 FRA_kingdom_restored_idea: "The Kingdom Restored"
 FRA_kingdom_restored_idea_desc: "The traditionalist extremists within the nationalist movement have achieved their dream: France once again has a king. The moderate republicans of the National Rally watch in disbelief as Action Française celebrates and the fleur-de-lis replaces the tricolour."
 FRA_exploitation: "Bled for the Metropole"
 FRA_exploitation_desc: "Our factories, our trade and our taxes are routed to Paris first and to our own people second. Every shipment that leaves the docks buys us a little more resentment at home and a little more distance from the Empire."
 FRA_empire_restored_idea: "The Empire Restored"
 FRA_empire_restored_idea_desc: "The Bonapartist faction within the movement has restored the French Empire under Napoleon VII. The moderate republicans who built the National Rally have been swept aside by those who dream of imperial glory. France is once again ruled by an Emperor, and the military-traditionalist alliance celebrates its complete victory."
 FRA_investing_eu: "Investing in an EU Country"
 FRA_investing_eu_desc: "We are currently helping another EU nation to buildup"
 FRA_election_result: "The Results"
 FRA_election_result_desc: "The presidential election is over or about to end; voting intentions are unlikely to change for a while."
 FRA_spy_napoleon_lar: "Bonapartist Secret Service"
 FRA_spy_napoleon_lar_desc: "A new generation of secret agents trained to sow discord amongst our enemies, feeding real-time intelligence to our army, navy, and air staff as the reconquest gathers pace."
 FRA_spy_napoleon_non_lar: "Bonapartist Secret Service"
 FRA_spy_napoleon_non_lar_desc: "A new generation of secret agents trained to sow discord amongst our enemies, watching our own barracks and ministries for the next plot against the throne."
 FRA_5th_republic: "The Fifth Republic"
 FRA_5th_republic_desc: "The current French political system, in place since 1958. A republic established under General de Gaulle and tailored to his needs. A stable system, but one that is beginning to show its limitations in a country that is increasingly out of balance, with an all-powerful president."
 FRA_war_against_republic: "War Against Republicanism"
 FRA_war_against_republic_desc: "The French monarchy was at its strongest under absolutism. Since then, our country has endured decades of republics, each more unstable than the last. Republican and Democratic values are dangerous for our country and are spreading like a cancer across the world. We must put an end to this."
 FRA_EU_strong: "Strength With the EU"
 FRA_EU_strong_desc: "Being a pillar of the European Union is a great responsibility, but also a great strength. Our destiny is linked to that of the European Union, whether we like it or not."
 FRA_NOTRe_law: "NOTRe Law"
 FRA_NOTRe_law_desc: "Decentralisation has not been properly implemented in France, leaving numerous legal loopholes and inconsistencies in its wake. The Law on the New Organisation of the Republic's Territories will make it possible to rectify these shortcomings and to simplify the organisation and planning of our territories."
 FRA_military_indus_boost: "Investing in Our Defence Industry"
 FRA_military_indus_boost_desc: "Given the growing international tensions, we must spare no expense in preparing for a possible conflict."
 FRA_civilian_jobs_boost: "Focusing on Creating Jobs"
 FRA_civilian_jobs_boost_desc: "We need to invest more in the labour market to provide our citizens with a diverse range of job opportunities."
 FRA_internal_investment_boost: "Focusing on Internal Investments"
 FRA_internal_investment_boost_desc: "By providing subsidies to the private sector, we will be able to encourage it to create more jobs."
 FRA_direct_construction_boost: "Investing on Public Works"
 FRA_direct_construction_boost_desc: "As the market is not performing well, we must utilise our workforce to build the economy of tomorrow."
 FRA_indusfarm_boost: "Subsidising Agriculture"
 FRA_indusfarm_boost_desc: "We must help our agricultural sector to win back European markets by increasing our production, whatever the means."
 FRA_civilian_infra_boost: "Investing on Infrastructures"
 FRA_civilian_infra_boost_desc: "We need to invest in non-metropolitan areas so that people there can access the same services as in metropolitan areas."
 FRA_indusbuild_services_boost: "Investing on Services Industry"
 FRA_indusbuild_services_boost_desc: "We are building the economy of tomorrow, free from uncompetitive and polluting industries."
 FRA_techno_boost: "Education Investments"
 FRA_techno_boost_desc: "What we need is to enable everyone to pursue the most advanced studies."
 FRA_res_health_boost: "Focusing on Public Services"
 FRA_res_health_boost_desc: "We must rebuild the service provision that has for too long been the target of ultra-liberal policies."
 FRA_local_consumption_boost: "Supporting the Relocation of Our Food Supply"
 FRA_local_consumption_boost_desc: "Our tables are stocked from the other side of the world while French farms go under. Shortening the chain between the field and the plate keeps that value inside the country."
 FRA_job_planned_boost: "Investing in Our industry"
 FRA_job_planned_boost_desc: "We must help our businesses create more jobs and prevent them from making redundancies. This will enable us to put an end to unemployment whilst increasing job security."
 FRA_ps_EUtrain: "French Training Mission"
 FRA_ps_EUtrain_desc: "The French government has invited us to take part in joint military exercises alongside other European Union countries."
 FRA_PCF_EUtrain: "Preparing Eastern Escalation"
 FRA_PCF_EUtrain_desc: "In the face of potential aggression from Russia, we must prepare to confront it on the battlefield."
 FRA_EU_LEAVE: "Rebuilding our Economy"
 FRA_EU_LEAVE_desc: "Our economy was too closely integrated with the European Union; breaking away from it has had far-reaching consequences. We will rebuild it to be even stronger and more independent."
 FRA_patriotic_fervor: "Patriotic fervour"
 FRA_patriotic_fervor_desc: "The reconquest of our Empire has only just begun."
 FRA_learning_from_worforce: "Integrating Society"
 FRA_learning_from_worforce_desc: "We are in the process of integrating the knowledge and workforce of a sister nation."
 FRA_attack_UK_king: "La Royale"
 FRA_attack_UK_king_desc: "Our attention may be focused on the United Kingdom as a former enemy of France. But in any case, we will have to fight a maritime power at one time or another. The French Navy must therefore be prepared to fight at sea."
 FRA_french_papacy: "Papacy Under Control"
 FRA_french_papacy_desc: "We have decided to host the headquarters of the Catholic Church in France. We are therefore in a position to protect it and thus enjoy greater legitimacy in the eyes of other Christian countries."
 FRA_gaullist_foreign_policy: "Gaullist Foreign Policy"
 FRA_gaullist_foreign_policy_desc: "Following General de Gaulle's vision, France pursues a policy of strategic independence from both superpowers. We maintain distance from American hegemony while engaging pragmatically with Russia and China. France must be a great power in its own right, not a vassal of Washington."
 FRA_anti_american_stance: "Anti-American Stance"
 FRA_anti_american_stance_desc: "The French government has adopted an openly hostile attitude toward the United States. American military operations will not receive French support, and diplomatic relations have cooled significantly. France charts its own course, free from Atlantic constraints."
 FRA_fn_russia_alignment_idea: "National Rally-Russia Alignment"
 FRA_fn_russia_alignment_idea_desc: "The National Rally government has cultivated close ties with Russia, reflecting historical connections and shared opposition to American liberalism. Marine Le Pen's praise for Putin's 'traditional values' has translated into concrete policy alignment on multiple issues."
 FRA_fn_protectionism: "Economic Patriotism"
 FRA_fn_protectionism_desc: "Tariffs and public procurement now favour the French producer over the cheaper import, and our factories are running fuller than they have in years. Our trading partners have noticed, and they are not grateful."
 FRA_fn_nationalist_policy: "National Preference"
 FRA_fn_nationalist_policy_desc: "One of our key measures is national preference: to push everything that isn't French into the background."
 FRA_communist_foreign_policy: "Communist Foreign Policy"
 FRA_communist_foreign_policy_desc: "The Communist Party has implemented a radical reorientation of French foreign policy: alliance with the United States is impossible, and France instead seeks solidarity with socialist states worldwide. NATO membership is fundamentally incompatible with our ideology."
 FRA_lfi_non_aligned_policy: "Non-Aligned France"
 FRA_lfi_non_aligned_policy_desc: "La France Insoumise has implemented a policy of non-alignment, rejecting both American hegemony and Russian authoritarianism. France will not participate in American military adventures and maintains independence from NATO command structures while seeking leadership of a new non-aligned movement."
 FRA_lfi_anti_nato: "Anti Nato Policies"
 FRA_lfi_anti_nato_desc: "We have successfully withdrawn from NATO; we could no longer tolerate the actions of American imperialism. Our current position now gives us greater control over our foreign policy."
 FRA_worker_internationalism: "Beacon of Internationalism"
 FRA_worker_internationalism_desc: "Communism has been a success in France, and that is a fact. This success means we have a satisfied workforce and enables us to attract workers from all over the world."
 FRA_lfi_social_europe: "European Public Services Reform"
 FRA_lfi_social_europe_desc: "LFI's France has succeeded in putting forward a new social agenda for the European Union. This is a major victory against this deeply neoliberal institution."
 FRA_strategic_independance: "Strategic Independence"
 FRA_strategic_independance_desc: "France has committed to complete strategic autonomy, maintaining its independent nuclear deterrent and refusing subordination to any foreign power. American bases are not welcome on French soil, and France will make its own decisions about military interventions."
 FRA_global_south_solidarity: "Global South Solidarity"
 FRA_global_south_solidarity_desc: "Colonialism has undeniably had a significant impact on the development of countries in the Global South. We will be doing the right thing by helping them to recover from this."
 FRA_sovereigntist_eu_policy: "Sovereigntist EU Policy"
 FRA_sovereigntist_eu_policy_desc: "France blocks further EU federalisation, defending national sovereignty against Brussels technocracy. While remaining in the EU, we veto any transfer of sovereignty and oppose the creation of a European superstate. France will not become a province."
 FRA_distance_nato: "Distance from NATO"
 FRA_distance_nato_desc: "Following De Gaulle's 1966 precedent, France maintains distance from NATO's integrated command structure while remaining a treaty member. American troops are not stationed on French soil, and France reserves the right to independent military action."
 FRA_left_nato: "Left NATO"
 FRA_left_nato_desc: "France has withdrawn from the North Atlantic Treaty Organisation entirely. No longer bound by Article 5, France charts a truly independent course in military affairs, rejecting American hegemony outright."
 FRA_political_balance: "Public Opinion Trends"
 FRA_political_balance_desc: "Although our institutions were designed to ensure stability, the political balance has never been so precarious. Parties rise and fall. Whoever you are, you will need to consolidate our hold on public opinion."
 FRA_econ_policy: "State of the French Economy"
 FRA_econ_policy_desc: "The French economy is a good example of a Western economy at the dawn of the new millennium, transitioning from an industrial powerhouse to an economy in the process of restructuring. We will see how your reforms will affect its future direction."
 FRA_social_balance: "French Social Policies"
 FRA_social_balance_desc: "France is a country that invests heavily in its social policy at all levels. However, most parties have issues with this policy. Everyone has their own views on how it should change. We will see how your decisions affect it."
 FRA_6th_rep: "Reforms of the Sixth Republic"
 FRA_6th_rep_desc: "La France insoumise has succeeded in reforming the Fifth Republic. But beyond the institutions, these reforms will have far-reaching consequences for French society and the French economy."
 FRA_Commies_agenda: "French Commune's Policies"
 FRA_Commies_agenda_desc: "The Commune of France has decided to make a clean break with the past and is determined to rebuild society from scratch."
 FRA_Bonapartist_agenda: "The Imperial Society"
 FRA_Bonapartist_agenda_desc: "Our new Emperor has decided to reform French society to make it greater and stronger in the face of the conflicts that lie ahead."
 FRA_Royalist_agenda: "The New Frank's Society"
 FRA_Royalist_agenda_desc: "We must put an end to all the diabolical inventions of the accursed Revolution. We shall rebuild Frankish society on solid foundations."
 FRA_World_revolution: "The World Revolution"
 FRA_World_revolution_desc: "As we liberate peoples from capitalism, We are joined by peoples who bring with them both their knowledge and their hopes. Soon, the International will be the whole of humanity."
 FRA_arab_solidarity_tt: "Improved relations with Arab and Muslim-majority nations"
 FRA_blocks_eu_federalization_tt: "France blocks EU federalisation due to sovereigntist policy"
 FRA_cannot_ally_usa_hard_tt: "Cannot ally with USA"
 FRA_cannot_host_american_bases_tt: "Cannot host American military bases"
 FRA_cannot_join_american_coalitions_tt: "Cannot join American-led military coalitions"
 FRA_debt_forgiveness_tt: "Supports debt forgiveness and development cooperation for the Global South"
 FRA_demands_eu_social_reform_tt: "Demands social reform of European Union institutions"
 FRA_immigration_restrictions_tt: "Immigration into France is heavily restricted"
 FRA_improved_russia_relations_tt: "Improved relations with Russia"
 FRA_israel_relations_penalty_tt: "Worsened relations with Israel"
 FRA_left_nato_command_tt: "France has left the NATO integrated command structure"
 FRA_non_aligned_policy_tt: "France pursues a policy of non-alignment"
 FRA_opposes_nato_expansion_tt: "Opposes any further expansion of NATO"
 FRA_socialist_solidarity_tt: "Improved relations with socialist and communist states"
 FRA_trade_protectionism_tt: "Domestic industry is protected from foreign competition"
 FRA_usa_relations_penalty_tt: "Worsened relations with the United States"
 FRA_worker_solidarity_tt: "Attracts workers from across the world through international worker solidarity"
 france_md.800.t: "France Turns Against America"
 france_md.800.d: "The new French government has adopted an openly anti-American stance, rejecting cooperation with Washington and criticising American foreign policy in harsh terms. This represents a dramatic shift in transatlantic relations. How should the United States respond to this hostile turn in Paris?"
 france_md.800.a: "Condemn this hostile policy"
 france_md.800.b: "Attempt diplomatic outreach"
 france_md.801.t: "American Diplomatic Overture"
 france_md.801.d: "Despite our anti-American stance, Washington has made diplomatic overtures, seeking to maintain some level of cooperation. The State Department appears willing to overlook our rhetoric in exchange for limited engagement. How should we respond to these American efforts?"
 france_md.801.a: "Reject American overtures entirely"
 france_md.801.b: "Consider limited cooperation"
 france_md.802.t: "France Turns Toward Russia"
 france_md.802.d: "The new French government has signalled a dramatic shift in foreign policy, seeking closer ties with Moscow while distancing itself from Washington. This is an opportunity to expand Russian influence in Western Europe. How should we respond to this French realignment?"
 france_md.802.a: "Strengthen ties with France"
 france_md.802.b: "Proceed cautiously"
 france_md.803.t: "Communist Foreign Policy Consequences"
 france_md.803.d: "Our communist foreign policy has isolated us from traditional Western allies but opened doors with socialist and anti-imperialist movements worldwide. Cuba, Venezuela, and other leftist governments welcome our new orientation. However, this comes at a cost to our relations with NATO allies and traditional partners."
 france_md.803.a: "Embrace socialist solidarity"
 france_md.803.b: "Moderate our approach"
 france_md.804.t: "France Distances from NATO"
 france_md.804.d: "[FRA.GetNameWithFlag] has announced a policy of distance from NATO, echoing De Gaulle's 1966 withdrawal from the integrated command structure. The French government has emphasised 'strategic independence' and rejected subordination to American military command. How should we view this development?"
 france_md.804.a: "Express concern about alliance cohesion"
 france_md.804.b: "Remain neutral on French policy"
 france_md.805.t: "Palestine Recognition"
 france_md.805.d: "Our far-left foreign policy commits us to recognising the State of Palestine and supporting the two-state solution. This will improve relations with Arab states and align with our anti-imperialist principles, but will damage relations with Israel and potentially the United States. Should we proceed with formal recognition?"
 france_md.805.a: "Recognise Palestine immediately"
 france_md.805.b: "Delay recognition for now"
 france_md.806.t: "France Recognises Palestine"
 france_md.806.d: "The French government has formally recognised the State of Palestine, marking a significant shift in Parisian foreign policy. This decision aligns France with many European nations but represents a departure from the previous cautious approach. How should Israel respond to this diplomatic development?"
 france_md.806.a: "Strongly condemn French recognition"
 france_md.806.b: "Issue a measured response"
 france_md.807.t: "The Ukraine War Dilemma"
 france_md.807.d: "Russia's invasion of Ukraine presents a crisis for our pro-Russian foreign policy. Our previous alignment with Moscow is now deeply problematic as Russian tanks roll into a sovereign European nation. The political cost of maintaining neutrality is enormous, but condemning Russia would be a complete reversal. What position should France take?"
 france_md.807.a: "Condemn Russian aggression"
 france_md.807.b: "Maintain neutrality"
 france_md.807.c: "Support Russia's position"
 france_md.808.t: "French Sovereigntist Policy"
 france_md.808.d: "[FRA.GetNameWithFlag] has adopted a strongly sovereigntist stance within the European Union, blocking further integration and vetoing transfers of sovereignty to Brussels. The French government argues for a 'Europe of Nations' rather than a federal superstate. How should we respond to this French obstructionism?"
 france_md.808.a: "Oppose French obstructionism"
 france_md.808.b: "Sympathise with sovereignty concerns"
 france_md.809.t: "Non-Aligned Movement Initiative"
 france_md.809.d: "Our non-aligned foreign policy has attracted interest from other nations seeking alternatives to both American and Russian spheres of influence. We have an opportunity to position France as a leader of a new non-aligned movement, working with India, Brazil, and other major powers outside the traditional blocs."
 france_md.809.a: "Pursue non-aligned leadership"
 france_md.809.b: "Focus on domestic priorities"
 france_md.810.t: "French Strategic Independence"
 france_md.810.d: "[FRA.GetNameWithFlag] has announced a policy of complete strategic independence, refusing subordination to any foreign power and emphasising the role of the French nuclear deterrent. This could have implications for the Franco-German partnership that has been the foundation of European cooperation. How should Germany respond?"
 france_md.810.a: "Express concern about bilateral relations"
 france_md.810.b: "Respect French sovereignty"
 france_md.811.t: "France Embraces Multipolarity"
 france_md.811.d: "The French government has announced support for a multipolar world order, rejecting American hegemony and seeking closer ties with rising powers. This represents an opportunity for China to expand influence in Europe. How should Beijing respond to this French opening?"
 france_md.811.a: "Strengthen ties with France"
 france_md.811.b: "Maintain cautious engagement"
 france_md.812.t: "France Leaves NATO"
 france_md.812.d: "We have formally withdrawn from the North Atlantic Treaty Organisation, completing our break with American hegemony. France now stands alone, neither bound by Article 5 nor subject to American military command. This decision opens new possibilities and real dangers alike. What path should France pursue?"
 france_md.812.a: "Embrace complete strategic independence"
 france_md.812.b: "Seek new alliances"
 FRA_extremist_foreign_policy_category: "Extremist Foreign Policy"
 FRA_extremist_foreign_policy_category_desc: "Diplomatic and foreign policy actions available to France under extremist or Gaullist governance."
 FRA_rejoin_nato_command: "Rejoin NATO Integrated Command"
 FRA_rejoin_nato_command_desc: "After distancing ourselves from NATO, we may choose to rejoin the integrated military command structure. This would restore our position within the alliance and improve relations with American and European allies."
 FRA_seek_russian_partnership: "Seek Russian Partnership"
 FRA_seek_russian_partnership_desc: "Our independent foreign policy creates an opportunity to strengthen ties with Moscow. We can pursue closer diplomatic and economic relations with Russia, though this will further strain relations with Washington."
 FRA_recognize_palestine: "Recognise Palestine"
 FRA_recognize_palestine_desc: "Our anti-imperialist foreign policy demands we recognise the State of Palestine and support the Palestinian people's right to self-determination. This will improve relations with Arab states but damage ties with Israel."
 FRA_condemn_russia_ukraine: "Condemn Russian Aggression"
 FRA_condemn_russia_ukraine_desc: "Russia's invasion of Ukraine has made our pro-Russian stance politically untenable. We can choose to condemn the aggression and distance ourselves from Moscow, though this represents a significant policy reversal."
 FRA_non_aligned_initiative: "Non-Aligned Leadership Initiative"
 FRA_non_aligned_initiative_desc: "Our non-aligned foreign policy positions France to lead a new movement of nations seeking alternatives to both American hegemony and Russian influence. We can strengthen ties with India, Brazil, and other major powers outside traditional blocs."
 FRA_socialist_solidarity: "Socialist Solidarity"
 FRA_socialist_solidarity_desc: "Our communist foreign policy calls for solidarity with socialist states worldwide. We can strengthen ties with Cuba, Venezuela, and other leftist governments, building an international network of anti-capitalist cooperation."
 FRA_veto_eu_federalization: "Veto EU Federalisation"
 FRA_veto_eu_federalization_desc: "As a sovereign nation within the EU, we can use our veto power to block further federalisation and transfers of sovereignty to Brussels. This defends French independence but strains relations with pro-integration member states."
 FRA_immigration_wave: "Capitalise on Immigration Wave"
 FRA_immigration_wave_desc: "France's current liberal immigration policies have led to a significant influx of migrants. While some see this as a humanitarian necessity or economic opportunity, others view it with growing concern. The National Rally can capitalise on these sentiments, presenting itself as the defender of French identity and security. The more open our borders, the stronger the backlash we can harness."
 FRA_high_immigration_tooltip: "France must have §YOpen Borders§! or §YSlightly Regulated Immigration§! law"
 FRA_immigration_backlash: "Immigration Backlash"
 FRA_immigration_backlash_desc: "A wave of anti-immigration sentiment is sweeping through French society. The National Rally's messaging on immigration, security, and national identity is resonating with an increasing portion of the population, shifting the political landscape rightward and weakening support for the status quo."
 FRA_end_extraction: "Restrict Resource Extraction"
 FRA_end_extraction_desc: "In pursuit of our environmental vision, we will implement strict regulations on mining operations, oil extraction, and heavy industrial activities across mainland France. This will reduce domestic resource production by approximately one-third, but represents a necessary step for environmental protection. Future governments may reverse this policy if circumstances change."
 FRA_green_extraction_ban: "Environmental Extraction Restrictions"
 FRA_green_extraction_ban_desc: "France has implemented comprehensive environmental restrictions on resource extraction. Mining operations face strict limits, oil drilling is heavily regulated, and industrial extraction must meet demanding environmental standards. While this has reduced domestic resource availability by about a third, the reduction in pollution has led to measurable health improvements: cancer rates in former industrial regions have dropped significantly, and healthcare costs are declining."
 FRA_environmental_policy_decisions: "Environmental Policy"
 FRA_environmental_policy_decisions_desc: "Decisions related to France's environmental policies and resource extraction regulations."
 FRA_reverse_extraction_ban: "Repeal the Mining Code Restrictions"
 FRA_reverse_extraction_ban_desc: "The rewritten mining code has priced our extractive industry out of business and left the refineries dependent on imports. Repealing it restores domestic output, and breaks with the Greens and the environmental associations who wrote it."
 france_md.960.t: "France Rewrites Its Mining Code"
 france_md.960.d: "[FRA.GetNameWithFlag] has rewritten its mining code, ending hydrocarbon permits and capping extraction across metropolitan France. Roughly a third of French domestic output disappears with it. The environmental associations are jubilant, and the industrial federations are already in Brussels warning about the precedent."
 france_md.960.a: "A precedent worth following"
 france_md.960.b: "European industry will pay for this"
 france_md.900.t: "The Budget Minister's Hidden Account"
 france_md.900.d: "Our budget minister, who runs the campaign against tax fraud from Bercy, denied holding a foreign account to the Assemblée nationale itself. An investigative site has now published the trail: Geneva first, then Singapore. The denial is on the record, and it was a lie."
 france_md.900.a: "Dismiss the minister and hand the file to the prosecutors"
 france_md.900.b: "Accept a quiet resignation"
 france_md.900.c: "Stand by the minister"
 france_md.901.t: "A Transparency Authority for Public Life"
 france_md.901.d: "The scandal has made asset declarations unavoidable. We can create an independent authority for transparency in public life, obliging every minister, deputy and senator to file their interests and their wealth, with the power to refer the doubtful cases to the prosecutors. The Assemblée will resent every line of it."
 france_md.901.a: "Create the transparency authority"
 france_md.901.b: "Publish a code of conduct and move on"
 france_md.902.t: "The Candidate's Fictitious Parliamentary Assistant"
 france_md.902.d: "Le Canard enchaîné has printed the payslips: a leading presidential candidate put a family member on the parliamentary payroll for work that nobody in the office can attest to. The Parquet national financier opened a preliminary inquiry the same morning. The candidate calls it an institutional plot and refuses to stand down."
 france_md.902.a: "Pull the candidate from the race"
 france_md.902.b: "Carry on the campaign regardless"
 france_md.902.c: "Blame the judges and the press"
 france_md.903.t: "A Former President in the Dock"
 france_md.903.d: "A former President of the Republic stands accused of fictitious municipal posts paid for by the ratepayers of Paris, and of campaign invoices billed to a company for rallies that never happened. Presidential immunity ended with his term. The tribunal correctionnel has set a date."
 france_md.903.a: "Let the court do its work"
 france_md.903.b: "Denounce a political trial"
 france_md.910.t: "Yellow Vests on the Roundabouts"
 france_md.910.d: "A carbon tax on diesel has put high-visibility vests on every roundabout in the country. There is no union behind it, no party and no delegation to negotiate with: only drivers, small traders and pensioners who cannot absorb another centime at the pump. Saturday has become a standing demonstration."
 france_md.910.a: "Cancel the fuel tax rise"
 france_md.910.b: "Keep the tax and open talks"
 france_md.910.c: "Hold the line on the tax"
 france_md.911.t: "The Champs-Élysées Burns on Saturday"
 france_md.911.d: "The Saturday marches now end in tear gas on the Champs-Élysées, with the Arc de Triomphe tagged and the brasseries on the avenue looted. The préfecture de police is running out of rested CRS companies and is being blamed for the whole afternoon. The shops are boarding up for the season."
 france_md.911.a: "Convene the Grand Débat National"
 france_md.911.b: "Raise the minimum wage and cut the CSG on pensions"
 france_md.911.c: "Send in the CRS"
 france_md.912.t: "Month Five on the Roundabouts"
 france_md.912.d: "The occupations are into their fifth month, and the rubber rounds fired by our own police are themselves under judicial inquiry. City-centre takings have collapsed and the préfectures cannot keep finding fresh companies. Matignon wants a decision this week."
 france_md.912.a: "Declare an economic and social emergency"
 france_md.912.b: "Ban the marches and impose a state of emergency"
 france_md.920.t: "The Socialists Lose Their Headquarters"
 france_md.920.d: "Public funding follows seats, and after the last two rounds there are not enough of them to keep the lights on at Solférino. The frondeurs want the party taken back to the left, the mayors and the outgoing ministers want it kept fit to govern, and both wings are being courted from outside. The building is already valued."
 france_md.920.a: "Turn the party back to the left"
 france_md.920.b: "Anchor the party in the governing centre"
 france_md.920.c: "Let the wings walk out"
 france_md.921.t: "The Party Debates Dédiabolisation"
 france_md.921.d: "The National Rally's new leadership wants respectability: economic arguments instead of ethnic ones, no more provocations about the camps, and candidates who can survive a television interview. The target is the front républicain that has shut the party out of every second round. The founding generation calls it surrender."
 france_md.921.a: "Let the party normalise itself"
 france_md.921.b: "Hold the party to its old line"
 france_md.921.c: "Let the founding family quarrel in public"
 france_md.922.t: "The Founder Against His Own Party"
 france_md.922.d: "The founder has repeated his old provocation about the camps, on camera, in the middle of a campaign he is not running. The leadership has convened a disciplinary panel and is writing the honorary presidency out of the statutes. The congress will decide whether the party keeps its name."
 france_md.922.a: "Hand the party to the new generation"
 france_md.922.b: "Expel the founder"
 france_md.923.t: "The Right Breaks the Republican Front"
 france_md.923.d: "The leader of the traditional right went on the evening news and announced an electoral pact with the National Rally, without putting it to his own political bureau. The bureau had to meet in a rented room, because he had the party headquarters locked. Forty years of the front républicain ended in a single broadcast."
 france_md.923.a: "Expel him and refuse the pact"
 france_md.923.b: "Ratify the pact for the second round"
 france_md.923.c: "Let the party break in two"
 france_md.930.t: "Eight Unions Against the Pension Reform"
 france_md.930.d: "Raising the legal retirement age has put all eight representative unions on the same platform for the first time in a generation. The SNCF and the RATP are running rolling strikes, the refineries are next, and the Assemblée has no majority for the text. Article 49.3 is on the table at Matignon."
 france_md.930.a: "Force the text through with 49.3"
 france_md.930.b: "Negotiate with the reformist unions"
 france_md.930.c: "Withdraw the text"
 france_md.931.t: "The Reformist Unions Offer Terms"
 france_md.931.d: "The reformist confederations will accept a later retirement age if it arrives in quarterly steps and if long careers and arduous work carry exemptions. The savings fall by half and the hard-line federations will sign nothing at all. It is the only text with signatures on it."
 france_md.931.a: "Sign the compromise"
 france_md.931.b: "Refuse and let the strikes run"
 france_md.932.t: "The Universities Are Blockaded"
 france_md.932.d: "A first-employment contract that lets employers dismiss under-26s without stating a cause has put bins across the gates of the Sorbonne and half the provincial campuses. The student unions have been joined by the lycées and by the CGT. The préfecture is asking for authorisation to clear the buildings."
 france_md.932.a: "Withdraw the contract"
 france_md.932.b: "Negotiate with the student unions"
 france_md.932.c: "Clear the campuses"
 france_md.940.t: "A Tense Election"
 france_md.940.d: "The first round of a local election has eliminated the governing candidates of most cities in France and put an extremist party into the run-off. Within the hour the calls for a front républicain were out: vote for whoever is left, and argue about it afterwards. Others answer that a vote extracted that way is not a mandate."
 france_md.940.a: "Call for a front républicain"
 france_md.940.b: "Leave the second round to the voters"
 france_md.940.c: "Treat the result as a verdict on us"
 france_md.941.t: "A Movement Outside the Old Parties"
 france_md.941.d: "A former minister has left the government to build a movement of his own, neither left nor right, funded by ticketed rallies and built on a membership list assembled door to door. Deputies from both governing parties are already asking about places on his lists. Neither party has a candidate who polls above him."
 france_md.941.a: "Back the movement"
 france_md.941.b: "Dismiss it as a passing fashion"
 france_md.941.c: "Force the old parties to renew themselves"
 france_md.950.t: "Nights of Rioting in the Banlieues"
 france_md.950.d: "Two teenagers died fleeing an identity check in a cité of the Seine-Saint-Denis. By the third night the burnt cars were being counted in the thousands, from the northern suburbs out to Toulouse and Strasbourg. The mayors are asking for curfews under the 1955 law."
 france_md.950.a: "Impose curfews under the 1955 law"
 france_md.950.b: "Fund the renewal agency and the priority quarters"
 france_md.950.c: "Promise to clean out the estates"
 france_md.949.t: "Coordinated Attacks Across Paris"
 france_md.949.d: "Attacks are still running in the eastern arrondissements and at the Stade de France. The BRI is at the door of a concert hall with hostages inside. Every hospital in the Île-de-France has gone to its emergency plan."
 france_md.949.a: "Declare three days of national mourning"
 france_md.951.t: "Parliament Convenes in Congress"
 france_md.951.d: "The marches are over and both chambers have been called to Versailles. Beauvau wants the état d'urgence extended and Sentinelle doubled, the Quai d'Orsay wants the carrier group sent east, and the Conseil d'État is already warning us about administrative searches."
 france_md.951.a: "Extend the état d'urgence"
 france_md.951.b: "Send the carrier group east"
 france_md.951.c: "Refuse the emergency powers"
 france_md.952.t: "European Constitution Referendum"
 france_md.952.d: "The treaty will go to the country rather than to Congress, and the campaign has split both governing parties down the middle. The no is argued on the left as a charter for posted labour and on the right as the end of French sovereignty. The last polls put the two camps inside the margin."
 france_md.952.a: "Campaign hard for the yes"
 france_md.952.b: "Stay out of the campaign"
 france_md.952.c: "Ratify by Congress instead"
 france_md.953.t: "The Left Negotiates a Common Platform"
 france_md.953.d: "The Socialists, the Communists, the Greens and the insoumis are dividing the constituencies between them, one candidacy at a time. The sticking points have not moved since the last attempt: the European treaties, and who heads the platform. Every party is calculating whether the deal costs it more seats than it wins."
 france_md.953.a: "Put a moderate at the head of the bloc"
 france_md.953.b: "Let the insoumis set the platform"
 france_md.953.c: "Let the talks collapse"
 france_md.954.t: "An Assemblée Without a Majority"
 france_md.954.d: "The Assemblée has come back in three blocs and none of them can reach 289 seats. Any candidate for Matignon can be censured on the day of appointment, and the budget has to pass before the session ends. The Élysée is receiving the party leaders one by one and getting nowhere."
 france_md.954.a: "Appoint a government of technicians"
 france_md.954.b: "Dissolve and go back to the country"
 france_md.954.c: "Build a coalition across the blocs"
 FRA_ps_platform: "Socialist Party Platform"
 FRA_ps_platform_desc: "The party runs on the record of the plural left: the thirty-five hour week, universal medical cover and youth employment contracts, all of it funded by a broader tax base rather than borrowing. Every commitment made at the congress has a line in the budget behind it, and the Rue de Solférino intends to be judged on whether the money arrives."
 FRA_udf_platform: "Centrist Union Platform"
 FRA_udf_platform_desc: "The centre campaigns on lower charges for business, a lighter hand on the labour code and an end to the reflex of answering every problem with a new levy. Its argument is that capital will stay in France only if France stops treating investment as something to be punished."
 FRA_lr_platform: "Republican Right Platform"
 FRA_lr_platform_desc: "The Gaullist right offers the classical bargain of the Fifth Republic: an army funded to act alone when the Republic requires it, and a state stripped of the layers of administration that have accumulated around it. Order at home and independence abroad are presented as the same policy."
 FRA_rpf_platform: "Souverainist Platform"
 FRA_rpf_platform_desc: "Pasqua and de Villiers campaign on a single proposition, that no treaty may transfer what belongs to the French people, and they apply it to the euro, to Schengen and to the powers of the Commission alike. Trading partners read the programme as a threat to every arrangement they have signed with Paris."
 FRA_fn_platform: "National Front Platform"
 FRA_fn_platform_desc: "National preference in housing, employment and welfare, a halt to family reunification and the reinstatement of border controls form the whole of the programme. It draws crowds that no other party can gather and it hardens the opposition of everyone else against the party in equal measure."
 FRA_lfi_platform: "France Unbowed Platform"
 FRA_lfi_platform_desc: "The movement campaigns for a constituent assembly to bury the presidential monarchy, and it builds its case in the street and the meeting hall rather than in the National Assembly. Free medical care at the point of use is the headline demand, and the old party loyalties dissolve wherever the campaign passes."
 FRA_eelv_platform: "Ecologist Platform"
 FRA_eelv_platform_desc: "The Greens ask for the reactor programme to be wound down, for construction to answer to environmental review and for the money to go into research on what replaces both. The transition they describe is real, and so is the decade of slower building it requires."
 FRA_pcf_platform: "Communist Party Platform"
 FRA_pcf_platform_desc: "The party still holds the municipalities of the red belt and the union sections in the large plants, and it campaigns where it is strongest: on the shop floor, over wages, hours and the defence of industrial employment. Where the cells are active the plants run better than the accounts predict."
 FRA_idea_transparency_reforms: "Transparency in Public Life"
 FRA_idea_transparency_reforms_desc: "Every minister, deputy and senator now files a declaration of interests and of assets with an independent authority that may publish them and refer the doubtful cases to the prosecutors. The political class resented the obligation and complied with it."
 FRA_idea_national_debate: "Grand National Debate"
 FRA_idea_national_debate_desc: "For two months the mayors are opening their council chambers to whoever turns up, and the contributions are being logged by the tens of thousands. It costs money and ministerial time, and it moves the argument off the roundabouts and into the town halls."
 FRA_idea_social_emergency_measures: "Economic and Social Emergency"
 FRA_idea_social_emergency_measures_desc: "The minimum wage supplement has been raised, overtime has been taken out of tax, and the CSG rise has been cancelled for the smaller pensions. The bill lands on the deficit in the same quarter, and Brussels has noticed."
 FRA_idea_pension_reform_passed: "Pension Reform by Article 49.3"
 FRA_idea_pension_reform_passed_desc: "The retirement age rose without a vote, under the article that engages the government's responsibility, and the censure motion fell a handful of deputies short. The pension accounts improve, and every text we send to the Assemblée afterwards will be read through this one."
 FRA_idea_pension_compromise: "Negotiated Pension Reform"
 FRA_idea_pension_compromise_desc: "The retirement age rises in quarterly steps, with exemptions for long careers and for work classed as arduous. The reformist confederations signed, the hard-line federations did not, and the savings are roughly half what the original text promised."
 FRA_idea_political_renewal: "Renewal of the Political Class"
 FRA_idea_political_renewal_desc: "Half the benches of the Assemblée have never held elected office, and the party machines no longer control their own nominations. The new intake is visible, energetic and wholly inexperienced."
 FRA_idea_urban_renewal: "Urban Renewal in the Cités"
 FRA_idea_urban_renewal_desc: "The renewal agency is signing fifteen-year conventions with the mayors of the priority quarters, demolishing the worst towers and rebuilding the schools behind them. The results arrive long after the government that ordered them."
 FRA_idea_national_unity: "National Unity After the Attacks"
 FRA_idea_national_unity_desc: "The opposition has suspended its motions, the tricolores are at the windows, and the reserve and the gendarmerie have more volunteers than they can process. It will not outlast the year, and while it holds it is worth something."
 FRA_idea_technocratic_government: "Government of Technicians"
 FRA_idea_technocratic_government_desc: "Prefects, finance inspectors and former central bankers hold the ministries, appointed from the Élysée and tolerated by an Assemblée that can agree on nothing else. They can pass a budget. They cannot pass a reform."
 FRA_heightened_security: "Vigipirate Plan Active"
 FRA_heightened_security_desc: "Vigipirate has been raised to reinforced security, and the guarding of sensitive sites has passed from the police to the army under Opération Sentinelle. Thousands of soldiers now stand outside stations, schools and places of worship, and the army bills the cost to its readiness rather than to Beauvau."
 FRA_state_of_emergency_terrorism: "État d'Urgence Declared"
 FRA_state_of_emergency_terrorism_desc: "The 1955 law is in force: prefects may order searches without a magistrate, assign individuals to residence, and ban gatherings on their own authority. Parliament renews it every three months and the Conseil d'État counts the appeals."
 FRA_terror_threat_elevated: "Elevated Terror Threat"
 FRA_terror_threat_elevated_desc: "The DGSI is carrying more files on returnees and radicalised individuals than it has officers to watch them, and the list keeps growing. Large events are being cancelled by prefectoral order rather than secured."
 FRA_terror_threat_critical: "Critical Terror Threat"
 FRA_terror_threat_critical_desc: "The services have several operational cells under surveillance at once and no longer expect to intercept all of them. Leave has been cancelled across the police and the gendarmerie, and the interior minister has stopped giving dates."
 FRA_national_mourning: "Days of National Mourning"
 FRA_national_mourning_desc: "Flags are at half mast on every public building, the minute of silence is kept at noon, and the names are read out at the Invalides. No business is being conducted this week."
 FRA_damaged_infrastructure: "Damaged Critical Infrastructure"
 FRA_damaged_infrastructure_desc: "The attacks took out a metro interchange and a section of the high-voltage grid, and the repairs are running behind the emergency schedule. The operators are working under prefectoral requisition and the state is carrying the bill."
 FRA_tourism_crisis: "Tourism Crisis"
 FRA_tourism_crisis_desc: "Hotel occupancy in the Île-de-France has collapsed and the long-haul tour operators have cancelled through the season. Tourism is our largest earner of foreign currency, and it will return at the pace of foreign news bulletins rather than of our security policy."
 france_md.970.t: "Bomb on the RER in Rush Hour"
 france_md.970.d: "A device left in a carriage detonated at an interchange station during the morning rush, in a tunnel section the rescue services can only reach on foot. Dozens are dead and the count of the wounded is still rising. The whole network is stopped and the mass casualty plan is in force."
 france_md.970.a: "Requisition the hospitals and the emergency services"
 france_md.970.b: "Declare a day of national mourning"
 france_md.970.c: "Reopen the network and refuse emergency powers"
 france_md.971.t: "Gunmen Assault a Commissariat"
 france_md.971.d: "Attackers with assault rifles and a vehicle charge fought a commissariat in the northern suburbs for forty minutes before the BRI reached them. Officers are dead and the building is unusable. Whoever planned it knew the hour of the shift change."
 france_md.971.a: "Seal the department and hunt the accomplices"
 france_md.971.b: "Fortify every commissariat in the country"
 france_md.972.t: "Suicide Teams Strike Across the Capital"
 france_md.972.d: "Three teams with assault rifles and explosive belts worked a stadium approach, a run of bars and a concert hall within the same hour. More than a hundred people are dead and the surgeons of the Île-de-France are operating on a war footing. Nothing of this scale has been done on our soil since the war."
 france_md.972.a: "Declare the état d'urgence"
 france_md.972.b: "Invoke the European mutual defence clause"
 france_md.972.c: "Strike the organisation's bases abroad"
 france_md.973.t: "Attack on the Louvre"
 france_md.973.d: "A man with a blade was stopped at the Carrousel checkpoint, but the team behind him came through the Tuileries entrance with explosives and is now in the Denon wing. Visitors are barricaded in the galleries above them. The conservation staff are asking for time to move what can still be moved."
 france_md.973.a: "Get the visitors out first"
 france_md.973.b: "Secure the collection before the assault"
 france_md.974.t: "Attackers Inside a Military Base"
 france_md.974.d: "A team crossed the perimeter of an air base at the one point where fence repairs had been suspended, and reached the alert dispersal before the guard force stopped them. They knew the rota and they knew the gate codes. Military counter-intelligence is now investigating our own personnel."
 france_md.974.a: "Review security at every installation"
 france_md.974.b: "Let counter-intelligence screen the ranks"
 france_md.975.t: "Hostages on the Eiffel Tower"
 france_md.975.d: "Armed men rode the lifts up with the first tourists of the day and hold the upper platform with several hundred hostages. The lift machinery is wired and the GIGN cannot approach across the Champ de Mars without being seen for a kilometre. They want prisoners released and a broadcast."
 france_md.975.a: "Send the GIGN up the tower"
 france_md.975.b: "Talk to them and buy time"
 france_md.975.c: "Refuse every demand"
 france_md.976.t: "Assault on a Nuclear Power Station"
 france_md.976.d: "Attackers hold the administrative block and the spent fuel building of a Loire valley station. They say they will open the fuel pool the moment the site is approached. The radiation institute has modelled the plume and it crosses three borders."
 france_md.976.a: "Take the reactor cold and send in the GIGN"
 france_md.976.b: "Assault the site with everything we have"
 france_md.980.t: "Coordinated Attacks Devastate Paris"
 france_md.980.d: "Simultaneous assaults on a stadium approach, a concert hall and a run of bars in Paris have killed more than a hundred people. France has closed its borders and put its army onto the streets. Interior ministries across Europe are re-reading their own files on returnees."
 france_md.980.a: "We stand with France"
 france_md.981.t: "Gunmen Storm the Louvre"
 france_md.981.d: "Armed attackers are inside the Denon wing of the Louvre, with visitors barricaded in the galleries around them. The museum holds work that no insurance and no restoration can replace. Every major collection on the continent is reviewing what it would do."
 france_md.981.a: "Offer assistance to France"
 france_md.982.t: "Hostages Held on the Eiffel Tower"
 france_md.982.d: "Several hundred visitors are being held on the upper platform of the Eiffel Tower by armed men who have wired the lift machinery. French special forces are staging on the Champ de Mars in front of the world's cameras. Foreign ministries are counting their nationals off the visitor lists."
 france_md.982.a: "Offer whatever help France will take"
 france_md.983.t: "French Nuclear Plant Under Attack"
 france_md.983.d: "Emergency alerts have been issued across Europe as terrorists attack a French nuclear facility. While authorities insist there is no immediate radiation risk, the potential for a Chernobyl-scale disaster has sent shockwaves across the continent. Governments are preparing contingency plans, and populations near the facility have been ordered to shelter in place."
 france_md.983.a: "Prepare emergency response plans"
 france_md.985.t: "Terror Plot Foiled"
 france_md.985.d: "French intelligence services have successfully disrupted a major terrorist plot. Months of surveillance, undercover operations, and international cooperation led to coordinated raids that captured the plotters before they could strike. The details remain classified, but sources indicate the planned attack could have been catastrophic. This success validates the heavy investment in counter-terrorism capabilities."
 france_md.985.a: "Commend the intelligence services"
 france_md.985.b: "Maintain heightened security"
 FRA_counter_terrorism_category: "Counter-Terrorism Operations"
 FRA_french_communism_expansionism_decision_category: "The War Against Capitalism"
 FRA_3rd_empire_decision_category: "Expand the Third Empire"
 FRA_LFI6th_decision_category: "The Dawn of a new Republic"
 FRA_french_socialist_downfall_decision_category: "The Fall of Socialism"
 FRA_frexit_decision_category: "Leaving the European Union"
 FRA_royalist_expansion_decision_category: "The Reconquest"
 FRA_EU_assistance_decision_category: "European Economical Partnership"
 FRA_GREEN_EU_assistance_decision_category: "The European Ecological Transition"
 FRA_activate_vigipirate: "Activate Vigipirate"
 FRA_activate_vigipirate_desc: "Activate France's national security alert system, deploying armed soldiers to patrol public spaces and increasing security at sensitive locations. This provides protection against terrorist attacks but carries ongoing costs."
 FRA_declare_state_of_emergency: "Declare State of Emergency"
 FRA_declare_state_of_emergency_desc: "In response to the critical terrorist threat, declare a national state of emergency. This grants security forces expanded powers but suspends certain civil liberties."
 FRA_end_state_of_emergency: "End State of Emergency"
 FRA_end_state_of_emergency_desc: "With the immediate threat reduced, end the state of emergency and restore normal civil liberties. This will help normalise daily life and reduce political tensions."
 FRA_intelligence_surge: "Intelligence Surge"
 FRA_intelligence_surge_desc: "Significantly increase funding and resources for intelligence services to improve surveillance capabilities and counter-terrorism operations. This enables proactive operations against terrorist networks."
 FRA_secure_critical_infrastructure: "Secure Critical Infrastructure"
 FRA_secure_critical_infrastructure_desc: "Invest in hardening critical infrastructure - power plants, transportation hubs, telecommunications - against terrorist attacks. This is expensive but reduces vulnerability to major attacks."
 FRA_operation_sentinelle: "Operation Sentinelle"
 FRA_operation_sentinelle_desc: "Deploy thousands of soldiers for domestic security duties, patrolling streets, protecting sensitive sites, and supporting police operations. This visible military presence reassures the public but strains armed forces."
 FRA_anti_terror_raid: "Conduct Anti-Terror Raid"
 FRA_anti_terror_raid_desc: "Based on intelligence gathered, conduct raids against suspected terrorist cells. Success could disrupt planned attacks and reduce the overall threat level."
 FRA_terrorism_defeated: "Declare Victory Over Terrorism"
 FRA_terrorism_defeated_desc: "With stability restored and no recent attacks, formally declare that the terrorist threat has been neutralised. This provides a morale boost and allows the nation to move forward."
 FRA_rebuild_after_attack: "Rebuild Damaged Infrastructure"
 FRA_rebuild_after_attack_desc: "Invest in repairing infrastructure damaged by terrorist attacks. Restoring these facilities is essential for returning to normal life and demonstrating resilience."
 FRA_tourism_recovery_campaign: "Tourism Recovery Campaign"
 FRA_tourism_recovery_campaign_desc: "Launch a major international campaign to promote France as a safe tourist destination. Restoring tourism is vital for the economy and demonstrates that terrorists cannot destroy the French way of life."
 FRA_6threp_mission: "Popular Enthusiasm"
 FRA_6threp_mission_desc: "Our commitment to reforming the political system has made a lot of people happy. Many people want change, but we must not be seen as those who are trying to delay the process."
 FRA_rally_support: "Display our Progress"
 FRA_rally_support_desc: "Our opponents are trying to slow the process down and question every single change we make. But we must stand firm. We have accomplished a lot and we have to show it."
 FRA_rally_ennemy: "The Opposition Criticising Our Reforms"
 FRA_rally_ennemy_desc: "Whilst these changes are essential, they do not always go down well with everyone. Our opposition is doing everything in its power to criticise every decision concerning the future of our Republic."
 FRA_timebomb_mission: "The Inevitable Divorce"
 FRA_timebomb_mission_desc: "The two main factions within the Socialist Party are threatening to leave the party if we do not resolve the situation. We must show them that there is a future with the Socialist Party before it is too late."
 FRA_support_decrease_mission: "Our Party is Splitting"
 FRA_support_decrease_mission_desc: "The longer we delay in reassuring our party members, the more of them will leave us to join groups that are closer to their ideologies. We must rectify the situation quickly."
 FRA_campaign_against_extremism: "Campaigning Against Extremism"
 FRA_campaign_against_extremism_desc: "In these troubled times, we must remind the left and the centre that we the socialists are the right choice against the political extremism that is rising."
 FRA_campaign_clash_traitors: "Retaliate Against Party Traitors"
 FRA_campaign_clash_traitors_desc: "Anyone who leaves us for a more fashionable party should expect us to expose them in the media. They are nothing but opportunists and agents of chaos."
 FRA_boost_eurosceptism: "Campaign Against the European Union"
 FRA_boost_eurosceptism_desc: "From public debates to street posters, our whole society must exude Euroscepticism. We must make the French people understand that European bureaucrats are the cause of all our problems."
 FRA_disobey_treaties: "Breaching the European Treaties"
 FRA_disobey_treaties_desc: "We must no longer bow to these stupid laws. We are masters in our own house, and in any case it is only a matter of time before we leave the European Union."
 FRA_denounce_eu_policies: "Exposing European Policy"
 FRA_denounce_eu_policies_desc: "We must focus our protest on the unjust laws that come out of the European Parliament without us being able to oppose them. What's the point of voting in an election if the result no longer really depends on us?"
 FRA_threaten_media: "Threaten pro-European media"
 FRA_threaten_media_desc: "Pro-European sentiment has infiltrated our institutions, right down to the media. We should remind these pen-pushers to stick to topics more suited to their level,and to stop going against the grain."
 FRA_red_benelux: "解放比荷卢"
 FRA_red_benelux_desc: "我们必须将比荷卢从资本主义和欧洲自由主义的桎梏中解放出来。"
 FRA_benelux_boost: "融合比荷卢文化"
 FRA_benelux_boost_desc: "荷兰、佛兰德斯和瓦隆的工人现在团结一致地加入革命，他们的工厂和工会都被纳入了我们的社会主义事业。"
 FRA_done_with_dumping: "避税天堂的终结"
 FRA_done_with_dumping_desc: "这些国家的存在本身就是对平等和团结理念的公然践踏，它们将自身的存在奉献给了避税天堂。我们必须制止这种现象。"
 FRA_dumping_boost: "整合瑞士文化"
 FRA_dumping_boost_desc: "我们已经瓦解了支撑避税天堂的银行干部队伍，瑞士劳动力正在重新融入我们的经济计划。"
 FRA_red_iberia: "不再有独裁者"
 FRA_red_iberia_desc: "我们必须确保南部边疆不会落入法西斯主义的影响之下。"
 FRA_iberia_boost: "整合伊比利亚文化"
 FRA_iberia_boost_desc: "西班牙和葡萄牙的劳工运动终于看到了1936年未能实现的希望，他们以平等的身份加入了我们的革命。"
 FRA_ciao_bella: "嗨，美女"
 FRA_ciao_bella_desc: "意大利的共产主义革命失​​败了，但它给意大利人民留下了深刻的印象。现在是时候纠正过去的错误了。"
 FRA_italy_boost: "整合意大利文化"
 FRA_italy_boost_desc: "意大利共产党的传统得以延续。我们完成了意大利工人开始却未完成的“红色双年展”。"
 FRA_avenge_long_knife: "长镰之夜"
 FRA_avenge_long_knife_desc: "我们必须给德意志各邦带来革命，使他们摆脱资本主义，防止民族主义再次得势。"
 FRA_ger_aus_boost: "整合日耳曼文化"
 FRA_ger_aus_boost_desc: "东德工业干部和奥地利工会将他们的纪律和经验带入我们的革命事业中。"
 FRA_ostalgia: "将革命带回东欧"
 FRA_ostalgia_desc: "东欧各国在苏联占领下饱受苦难。我们必须让他们看到共产主义也有其优点。"
 FRA_ostalgia_boost: "整合东欧文化"
 FRA_ostalgia_boost_desc: "我们将至今仍弥漫在东欧的怀旧之情转化为对我们革命的真正热情。"
 FRA_birthplace_revolution: "收复共产主义的发源地"
 FRA_birthplace_revolution_desc: "我们必须让俄罗斯人重拾革命，让他们忘记共产主义昔日的辉煌。"
 FRA_birthplace_boost: "整合斯拉夫文化"
 FRA_birthplace_boost_desc: "我们重拾革命的发源地，欢迎俄罗斯和斯拉夫人民重新加入他们曾经领导的运动。"
 FRA_no_more_neutrality: "打破北方中立"
 FRA_no_more_neutrality_desc: "北欧各国长期以来一直回避在社会主义和资本主义之间做出选择。现在是它们做出选择的时候了。"
 FRA_neutrality_boost: "整合北欧文化"
 FRA_neutrality_boost_desc: "北欧社会民主主义终于​​转型，其工人和机构融入了我们更广泛的革命计划。"
 FRA_cold_war2: "不再冷战"
 FRA_cold_war2_desc: "我们将摧毁北约残余势力，以此报复苏联和华沙条约组织的解体。"
 FRA_cold_war_boost: "整合英吉利文化"
 FRA_cold_war_boost_desc: "全世界的劳动者，联合起来！英语世界的劳动传统终于在我们的革命中找到了自己的位置。"
 FRA_red_Europe: "完成欧洲革命"
 FRA_red_Europe_desc: "我们将把革命带到整个欧洲，那里仍然处于资本家的压迫之下。"
 FRA_red_victory: "欧洲革命的胜利"
 FRA_red_victory_desc: "我们已经将欧洲各国从资本主义的枷锁中解放出来。这是革命的伟大胜利。"
 FRA_annex_puppet_napo: "落实我们的宣称"
 FRA_annex_puppet_napo_desc: "我们的一个附属国拥有我们声称拥有主权的领土。现在是时候将这片领土归还给我们了。"
 FRA_reunionism: "实现重聚主义"
 FRA_reunionism_desc: "是时候将法国文化界的各界人士团结起来了。而且这一次，要真正团结起来。"
 FRA_Never_another_guerilla: "确保西南地区安全"
 FRA_Never_another_guerilla_desc: "我们要往东走，所以必须确保没有人从后面追上来。这次不会有游击战，因为我们会粉碎任何抵抗。"
 FRA_Avenge_Sedan: "色当的复仇"
 FRA_Avenge_Sedan_desc: "德意志帝国的崛起终结了昔日的法兰西帝国。我们必须为这一暴行复仇，收复我们天然的疆界。"
 FRA_natural_border: "整合自然边界"
 FRA_natural_border_desc: "被征服地区的人民最终接受了新的现实。莱茵河构成了法国的边疆。"
 FRA_crush_coalition: "确保中欧安全"
 FRA_crush_coalition_desc: "这些地区对于目前正在筹备的进军莫斯科的漫长征程至关重要。"
 FRA_napoleon_empire: "整合拿破仑帝国"
 FRA_napoleon_empire_desc: "被征服地区的人民最终接受了新的现实。他们现在是法兰西第三帝国的正式公民。"
 FRA_prepare_russia: "统一东欧"
 FRA_prepare_russia_desc: "我们入侵俄罗斯迫在眉睫；我们必须确保盟友的安全，并让他们做好与俄罗斯进行高强度冲突的准备。"
 FRA_2nd_empire_colonies: "重振殖民帝国"
 FRA_2nd_empire_colonies_desc: "我们将完成拿破仑三世和法兰西第三共和国未竟的事业。我们将建立一个稳定的殖民帝国。"
 FRA_no_more_berezina: "蒂尔西特行动"
 FRA_no_more_berezina_desc: "彻底摧毁俄罗斯帝国的时机已经成熟。这一次，他们再也没有时间焚毁莫斯科了。"
 FRA_the_Foe: "终结背信弃义的阿尔比恩"
 FRA_the_Foe_desc: "我们将彻底打破这场大陆封锁。革命的头号敌人必将覆灭。"
 FRA_new_order: "宣告新的欧洲秩序"
 FRA_new_order_desc: "我们对欧洲大陆的统治地位已成定局。我们已将欧洲统一在我们的帝国之下。欧洲历史的新篇章即将开启。"
 FRA_Expansion_policy: "选择我们的扩张政策"
 FRA_Expansion_policy_desc: "新成立的法兰克王国必须将征服作为其目标。"
 FRA_operation_clovis: "克洛维斯行动"
 FRA_operation_clovis_desc: "我们将从所谓的比荷卢三国手中夺回法兰克文明的摇篮。"
 FRA_operation_bouvines: "布文斯行动"
 FRA_operation_bouvines_desc: "法兰克帝国的建立，以神​​圣罗马帝国的再次覆灭为前提。"
 FRA_operation_marignan: "马里尼昂行动"
 FRA_operation_marignan_desc: "我们必须重新征服意大利半岛，夺回天主教会的中心。只有罗马教皇才能为我们加冕为皇帝。"
 FRA_operation_roland: "罗兰行动"
 FRA_operation_roland_desc: "后卫不会再倒下了。"
 FRA_unite_frank_europe: "统一法兰克人"
 FRA_unite_frank_europe_desc: "我们已经重新接纳了所有和我们一样是法兰克人后裔的人民。这对法兰克民族来说是伟大的一天。"
 FRA_frankish_empire: "整合法兰克帝国"
 FRA_frankish_empire_desc: "法兰克帝国已重新统一。《凡尔登条约》的不公正之处已得到纠正。"
 FRA_annex_puppet_king: "落实我们的宣称"
 FRA_annex_puppet_king_desc: "我们的一个附属国拥有我们声称拥有主权的领土。现在是时候将这片领土归还给我们了。"
 FRA_glacis: "突破冰川"
 FRA_glacis_desc: "东方国家横亘在我们与命运之间。我们必须团结西方，共同捍卫我们的命运。"
 FRA_a_war_for_europe: "欧洲之战"
 FRA_a_war_for_europe_desc: "西欧和俄罗斯列强一直争夺欧洲的控制权。现在是时候结束这场争端，实现西方的统一了。"
 FRA_operation_hastings: "黑斯廷斯行动"
 FRA_operation_hastings_desc: "是时候结束这场影响历史的宿敌之争了。我保证，这场宿敌之争不会持续一百年。"
 FRA_king_europe_victory: "宣告欧洲胜利"
 FRA_king_europe_victory_desc: "我们的敌人已经不复存在。我们是欧洲唯一屹立不倒的强国。西方必须团结在我们周围。"
 FRA_recover_7_year_war_charlemagne: "收复王国殖民地"
 FRA_recover_7_year_war_charlemagne_desc: "欧洲安全了。现在我们可以重新夺回那些被夺走的殖民地了。"
 FRA_start_crusade: "确保地中海安全"
 FRA_start_crusade_desc: "为了让十字军能够启程前往圣地，我们需要控制沿途的岛屿。我们的补给线必须安全无虞。"
 FRA_crusade_siege: "在圣地站稳脚跟"
 FRA_crusade_siege_desc: "要收复圣地，向占领者发起正面进攻，我们需要投入全部兵力。我们必须确保能够在附近部署这些兵力。"
 FRA_claim_jerusalem: "收复圣地"
 FRA_claim_jerusalem_desc: "收复耶路撒冷和圣地的时机已经到来。第十次十字军东征已经实现了它的目标。"
 FRA_revenge_over_saladin: "Ensure Stability in the Middle East"
 FRA_revenge_over_saladin_desc: "We must stabilise the region by crushing each of its regional powers, whose conflicts are destabilising it."
 FRA_king_crusade1_victory: "Proclaim the Triumph of the Tenth Crusade"
 FRA_king_crusade1_victory_desc: "We have recaptured the Holy Land."
 FRA_kingdom_heaven: "Proclaim the Kingdom of Jerusalem"
 FRA_kingdom_heaven_desc: "The Kingdom of Jerusalem shall rise again"
 FRA_rally_frank: "Protect the Franks"
 FRA_rally_frank_desc: "Europe will soon be the scene of a new war. In these circumstances, we must ensure that our Frankish brothers do not fall victim to it."
 FRA_unite_frank: "Reintegrate the Franks"
 FRA_unite_frank_desc: "我们已经重新接纳了所有和我们一样是法兰克人后裔的人民。这对法兰克民族来说是伟大的一天。"
 FRA_noah_ark: "Rally the Catholic Nations"
 FRA_noah_ark_desc: "We shall unite the Catholic Nations of Europe under our banner."
 FRA_war_against_protestantism: "The War Against Protestantism"
 FRA_war_against_protestantism_desc: "The first eight crusades against the heretics failed. We shall not fail a ninth time."
 FRA_end_the_schism: "There Can Only be One"
 FRA_end_the_schism_desc: "We must take on all the Orthodox nations of Europe by becoming the guardians of Europe. The Church will be safe forever."
 FRA_king_crusade2_victory: "Proclaim Total Victory of the Church"
 FRA_king_crusade2_victory_desc: "We reign supreme over Europe"
 FRA_recover_7_year_war_holy: "收复王国殖民地"
 FRA_recover_7_year_war_holy_desc: "我们的敌人已经不复存在。我们是欧洲唯一屹立不倒的强国。西方必须团结在我们周围。"
 FRA_inst_civ_GER: "Invest in the German Economy"
 FRA_inst_civ_GER_desc: "We invest directly in German engineering firms, strengthening the industrial backbone of our shared union."
 FRA_inst_civ_GRE: "Invest in the Greek Economy"
 FRA_inst_civ_GRE_desc: "Greek shipping remains the lifeblood of its economy, and our investment strengthens this vital maritime industry."
 FRA_inst_civ_ITA: "Invest in the Italian Economy"
 FRA_inst_civ_ITA_desc: "We back Italy's machine tool sector, reinforcing the precision engineering base at the heart of its industry."
 FRA_inst_civ_BEL: "Invest in the Belgian Economy"
 FRA_inst_civ_BEL_desc: "Belgium's chemical industry anchors its economy, and our capital will expand its production and export capacity."
 FRA_inst_civ_SPR: "Invest in the Spanish Economy"
 FRA_inst_civ_SPR_desc: "We invest in Spain's automotive sector, supporting the assembly lines that employ hundreds of thousands of workers."
 FRA_inst_civ_POL: "Invest in the Polish Economy"
 FRA_inst_civ_POL_desc: "Polish shipyards once led European shipbuilding, and our investment will help restore their industrial capacity."
 FRA_inst_inf_GER: "Invest in Germany's Transport Network"
 FRA_inst_inf_GER_desc: "We fund improvements to the Rhine-Rhone corridor, easing the flow of goods between our two economies."
 FRA_inst_inf_GRE: "Invest in Greece's Transport Network"
 FRA_inst_inf_GRE_desc: "Investment in the Athens-Thessaloniki corridor will modernise Greece's principal north-south transport artery."
 FRA_inst_inf_ITA: "Invest in Italy's Transport Network"
 FRA_inst_inf_ITA_desc: "We support upgrades to the Brenner corridor, reinforcing the vital rail link between Italy and Northern Europe."
 FRA_inst_inf_BEL: "Invest in Belgium's Transport Network"
 FRA_inst_inf_BEL_desc: "We invest in the North Sea-Mediterranean rail corridor, strengthening the freight artery that runs through Belgium's ports."
 FRA_inst_inf_SPR: "Invest in Spain's Transport Network"
 FRA_inst_inf_SPR_desc: "Our investment in the Pyrenean rail crossings will finally link the Iberian and French networks properly."
 FRA_inst_inf_POL: "Invest in Poland's Transport Network"
 FRA_inst_inf_POL_desc: "We fund the Via Baltica corridor, connecting Poland to the wider European transport network at last."
 FRA_inst_eco_GER: "Invest in the German ecological transition"
 FRA_inst_eco_GER_desc: "We support Germany's transition away from nuclear power, funding the renewable capacity needed to fill the gap."
 FRA_inst_eco_GRE: "Invest in the Greek ecological transition"
 FRA_inst_eco_GRE_desc: "Greece still depends heavily on lignite, and our investment will accelerate its shift toward cleaner energy sources."
 FRA_inst_eco_ITA: "Invest in the Italian ecological transition"
 FRA_inst_eco_ITA_desc: "Italy remains dangerously dependent on imported gas, and our investment supports its diversification toward renewable energy."
 FRA_inst_eco_BEL: "Invest in the Belgian ecological transition"
 FRA_inst_eco_BEL_desc: "We help Belgium manage its own nuclear phase-out, funding the grid capacity needed to keep the lights on."
 FRA_inst_eco_SPR: "Invest in the Spanish Ecological Transition"
 FRA_inst_eco_SPR_desc: "Spain has enormous solar potential, and our investment will help expand its renewable generation capacity."
 FRA_inst_eco_POL: "Invest in the Polish ecological transition"
 FRA_inst_eco_POL_desc: "Poland remains reliant on coal for most of its power, and our investment supports its transition to cleaner energy."
