 JAP_private_investment_climate_payoff_tt: "Через §Y180§! дней деловая уверенность возвращается, и Япония получает §Y$JAP_improvement_private_investment_climate_idea$§!"
 JAP_earthquake.1.t: "Землетрясение в регионе [?JAP_quake_state.GetName]"
 JAP_earthquake.1.d: "Сильное землетрясение произошло в регионе [?JAP_quake_state.GetName]. Японское метеорологическое агентство сообщает о толчках интенсивностью 6 баллов по своей шкале вблизи эпицентра; колебания ощущались и в соседних префектурах. Дороги вздыбились, движение поездов приостановлено до проверки путей, несколько заводов остановили производство для осмотра конструкций. Местные власти оценивают число пострадавших и запрашивают помощь у Токио."
 JAP_earthquake.2.t: "Построено, чтобы выдержать следующий"
 JAP_earthquake.2.d: "Последний регион прошёл сейсмическое обследование, и восстановление районов, разрушенных Великим восточнояпонским землетрясением, завершено. Больницы и мэрии стоят на сейсмоизоляторах, старые школы укреплены обоймами или отстроены заново, а опоры скоростных дорог охвачены стальными бандажами. Япония не может остановить движение земли, но впервые в своей истории сильный толчок больше не становится общенациональным бедствием."
 JAP_earthquake.2.a: "Мы готовы."
