 early_airframe_designs: "초기 항공기 설계 기준"
 early_airframe_designs_desc: "모든 항공기의 기본 설계 원칙입니다. 날개 형상, 기본 엔진, 방호 및 예비 시스템 등을 포함합니다. 이러한 원칙을 통해 각국은 실제 전투용 기체 개발을 시작할 수 있습니다."
 avionics_1: "2세대 항공 전자 공학"
 avionics_1_desc: "보다 현대적인 기술의 등장으로 항공기는 더욱 발전했습니다. 아날로그 계기는 여전히 존재했지만, 조종사가 전투에서 눈을 떼지 않으면서도 항공기를 조종하고 싸우는 데 필요한 모든 정보를 얻을 수 있게 해주는 헤드업 디스플레이로 보완되었습니다."
 avionics_2: "3세대 항공 전자 공학"
 avionics_2_desc: "글래스 콕핏 항공기는 아날로그 계기의 필요성을 단순한 예비 수단 수준으로 줄입니다. 또한 여러 다기능 디스플레이의 추가로 조종사는 자신의 항공기와 무기에 더 빠르고 상세하게 접근할 수 있으며, 항공기에 데이터링크의 초기 단계를 추가할 수 있게 됩니다."
 avionics_3: "4세대 항공 전자 공학"
 avionics_3_desc: "초현대식 헬멧은 HUD를 항공기 전면에서 조종사의 헬멧 자체로 옮겨놓습니다. 항공기 주변의 센서는 조종사가 자신의 항공기를 투시할 수 있는 능력까지 부여하여, 현대 전장에 대한 비할 데 없는 상황 인식을 제공합니다."
 drone_1: "1세대 드론 시스템"
 drone_1_desc: "초기 드론 시스템은 무인기에 의한 정찰 비행을 가능하게 하여, 유인기의 위험 없이 지휘관에게 전장의 시야를 제공했습니다."
 drone_2: "2세대 드론 시스템"
 drone_2_desc: "무인 시스템의 초기 성공을 확장하여, 드론 기술의 발전으로 무기를 장착하기 시작했으며 드론이 임무 비행 중 지상 목표물을 타격할 수 있게 되었습니다."
 drone_3: "3세대 드론 시스템"
 drone_3_desc: "AI 기술이 전면에 부상하기 시작하면서, 항공기 설계자와 군은 공중전 AI를 실험하고 드론이 공대공 전투를 지원할 수 있을 만큼 발전하도록 만들기 시작합니다."
 drone_4: "4세대 드론 시스템"
 drone_4_desc: "충성스러운 윙맨이라 불리는 드론이 첨단 항공기와 함께 비행하기 시작합니다. 이 드론은 지휘 조종사의 거의 연장선이며, 인간 조종사의 신체적 한계 없이 훈련된 조종사만큼 비행하고 싸울 수 있습니다."
 awacs_1: "냉전기 공중조기경보통제기"
 awacs_1_desc: "하늘의 거대한 레이더는 공중전 항공기의 더 나은 통제와 지휘뿐만 아니라, 지휘관의 공중 및 지상전에 대한 더 나은 정찰도 가능하게 했습니다."
 awacs_2: "현대 공중조기경보통제기"
 awacs_2_desc: "데이터링크 능력의 발전과 레이더 기술 자체의 발전으로 AWACS 항공기는 공중전을 감시할 뿐만 아니라 지휘할 수 있게 되어, 모든 현대 공군의 정찰 및 제공권 능력을 강화합니다."
 awacs_3: "미래 공중조기경보통제기"
 awacs_3_desc: "드론의 데이터링크 자료, 정보 처리를 돕는 AI, 한층 더 우수한 센서 체계는 이러한 AWACS 항공기가 진정으로 공중전의 지휘통제 체계가 되도록 합니다."
 engines_2: "냉전기 엔진"
 engines_2_desc: "초기 제트기에 사용된 엔진보다 한 단계 위의 이 엔진들은 제트 엔진 기술의 발전을 이어갔으며, 엔진을 이용해 수직 이착륙 능력을 제공하는 개념을 시험하기 시작했습니다."
 engines_3: "근현대 엔진"
 engines_3_desc: "현대 제트 엔진에 거의 필적하는 이 엔진들은 추력 대비 중량비가 크게 향상되었으며, 엔진의 추력을 이용해 항공기의 기동을 돕는 시도를 해 본 최초의 엔진 변형형이 포함됩니다."
 engines_4: "현대 엔진"
 engines_4_desc: "연료 사용량과 신뢰성을 개선하기 위해 노력한 이 엔진들은 해당 공중전 시대에 개발된 엔진 가운데 성능의 정점입니다."
 engines_5: "Cutting-Edge Engines"
 engines_5_desc: "램제트 및 극초음속 엔진인 이 엔진들은 미래의 주력입니다. 매우 뛰어난 성능을 갖췄지만 제작과 유지에 광범위한 공급망이 필요하며, 항공기를 조금 더 빠르고 멀리 밀어붙일 수 있습니다."
 nuclear_engines: "원자력 엔진"
 nuclear_engines_desc: "냉전 시대의 무모한 결정에서 탄생한 엔진 개념으로, 원자력에 의존하여 항공기에 거의 무한한 항속거리를 부여하며 승무원에 대한 보급이 가능한 한 연료를 채우고 계속 비행할 수 있게 합니다."
 refueling_1: "항공기 설계 중심 연료 탱크"
 refueling_1_desc: "공기역학적 설계를 해치지 않으면서 항공기의 작전 반경을 크게 확장할 수 있도록 설계된 외부 연료 탱크입니다."
 refueling_2: "공중 급유 기술"
 refueling_2_desc: "항공기의 전투 반경을 더욱 확장하기 위해 개발된 공중 급유는 급유기가 전투기에 상당한 양의 연료를 공급할 수 있게 하며, 임무 수행 전후 모두 급유를 받을 수도 있습니다."
 solar_engines_1: "초기 태양 엔진"
 solar_engines_1_desc: "태양 전지판으로 비행 중 항공기의 배터리를 충전하는 이 항공기는 전기 동력 엔진과 하이브리드 엔진을 사용하여 추가 연료 없이 비행 시간과 항속거리를 늘립니다. 그 대가로 매우 약하며 기동성이 크게 떨어집니다."
 solar_engines_2: "이중 태양 엔진"
 solar_engines_2_desc: "단발 태양광 엔진과 동일한 설계 개념이지만, 쌍발 엔진 시스템을 사용하여 더 큰 추력과 더 높은 최고 속도를 얻으며, 기동성이나 생존성은 거의 개선되지 않습니다."
 flying_wing_design: "전익 (Flying Wing) "
 flying_wing_design_desc: "전익기는 뚜렷한 동체가 없는 무미익 고정익 항공기로, 승무원, 탑재물, 연료, 장비가 주 날개 구조 안에 수납됩니다. 전익기에는 포드, 나셀, 블리스터, 붐, 수직 안정판 같은 다양한 작은 돌출부가 있을 수 있습니다. "
 variable_wing_design: "가변익 (Variable)"
 variable_wing_design_desc: "흔히 \\"스윙 윙\\"이라 불리는 가변 후퇴익은 비행 중 뒤로 젖혔다가 원래의 곧은 위치로 되돌릴 수 있는 항공기 날개 또는 날개 세트입니다. 비행 중 항공기의 형상을 바꿀 수 있어 가변 기하 항공기의 한 예입니다. "
 delta_wing_design: "Advanced Delta Design"
 delta_wing_design_desc: "델타익은 삼각형 모양으로 만들어진 날개입니다. 그리스 대문자 델타와 형태가 비슷하다는 데서 이름이 붙었습니다"
 diamond_wing_design: "다이아몬드 형"
 diamond_wing_design_desc: "델타익 날개 형상의 추가 발전형인 다이아몬드익은 이 개념을 향상시켜 항공기에 더 나은 비행 특성을 부여합니다."
 fwdswept_wing_design: "전진익 (Foward Swept)"
 fwdswept_wing_design_desc: "전진익 또는 역후퇴익은 날개의 4분의 1 시위선이 앞쪽으로 후퇴각을 가지는 항공기 날개 형식입니다. 일반적으로 앞전도 앞쪽으로 기울어집니다. "
 future_wingform_designs: "미래형 날개 디자인"
 future_wingform_designs_desc: "이전 날개 형상의 모든 교훈을 결합하고, 현대 공중 전장에서 스텔스의 막대한 필요성을 고려하여, 이 날개 형상들은 항공기의 모든 능력을 극대화하는 동시에 최대한 스텔스성을 갖추도록 노력합니다."
 stealth_tech_1: "초기 스텔스 기술"
 stealth_tech_1_desc: "세계 최초의 스텔스 기체 개발을 이끈 이 세대의 항공기 연구개발은 저피탐성과 스텔스 항공기의 시대를 열었으며, 탐지되지 않은 채 적을 타격할 수 있게 했습니다."
 stealth_tech_2: "Advanced Stealth Technology"
 stealth_tech_2_desc: "레이더 기술이 점점 더 발전하고 기존 기법의 효과가 떨어지면서 스텔스 소재와 항공기 설계 원칙의 추가 발전이 필요해졌습니다."
 internal_weapons_1: "초기 내부 무장창"
 internal_weapons_1_desc: "항공기의 스텔스 능력을 더욱 높이기 위해, 설계자들은 항공기의 무기를 기체 내부에 수납하는 방법을 고안했고, 이는 항공기의 스텔스성을 더욱 높였습니다."
 internal_weapons_2: "현대 내부 무장창"
 internal_weapons_2_desc: "내부 무장창의 크기 제한 때문에 많은 양의 무장을 탑재할 수 없다는 전투기 조종사들의 불만에 따라, 설계자들은 탑재 능력을 더욱 높이기 위해 무장창을 더 크게 만들고자 노력했습니다."
 redundant_1: "보호 기술 1"
 redundant_1_desc: "플라이 바이 와이어 시스템과 기타 전기 시스템의 이중화는 항공기를 더 신뢰할 수 있게 만듭니다. 또한 자가 치유 소재의 초기 개발은 항공기의 피해 저항력을 높입니다."
 redundant_2: "보호 기술 2"
 redundant_2_desc: "보조 비행 제어 시스템과 자동 조종 시스템은 시스템 고장이나 전투 피해로 주 비행 제어 시스템이 작동하지 않더라도 항공기가 계속 비행할 수 있게 하며, 자가 치유 소재의 추가 발전은 항공기가 견딜 수 있는 피해에 대한 저항력을 계속 높여 줍니다."
 early_weapons: "초기 항공기 무장"
 early_weapons_desc: "기관총과 소구경 및 대구경 기관포인 이 무기들은 현대 항공기에 존재하는 조준이나 무장의 주요 발전 없이, 항공기가 무언가를 향해 겨냥하고 쏠 수 있게 합니다."
 naval_weapons_1: "냉전기 해상 무기"
 naval_weapons_1_desc: "초기 대함 미사일과 유도 어뢰는 항공기가 목표물에 급강하 폭격을 할 필요 없이 원거리에서 함선을 공격할 수 있게 했습니다."
 naval_weapons_2: "Advanced Naval Weapons"
 naval_weapons_2_desc: "유도 및 사거리의 발전으로 항공기는 더 먼 거리에서 목표물을 공격할 수 있게 되었고, 무기가 목표물을 포착하여 명중시킬 확률도 높아졌습니다."
 naval_weapons_3: "현대 해상 무기"
 naval_weapons_3_desc: "이 무기들은 목표물까지 복잡한 경로를 비행하고, 급상승 공격을 수행하며, 적의 대응 수단을 더 잘 무시할 수 있는 능력을 갖추고 있습니다."
 naval_weapons_4: "Cutting-Edge Naval Weapons"
 naval_weapons_4_desc: "고급 유도 어뢰와 극초음속 대함 미사일로 구성된 이 무기들은 사거리와 탑재량이 크게 늘어났으며, 최소한의 소모로 적 병력을 파괴할 수 있습니다."
 special_mad_1: "냉전기 대잠 (ASW) 기술"
 special_mad_1_desc: "공중 투하식 소노부이는 항공기가 잠수함 사냥을 돕게 했으며, 항공기는 먼 거리를 이동하고 넓은 지역을 포괄하면서 대잠 작전을 수행할 수 있었습니다."
 special_mad_2: "Advanced ASW Technology"
 special_mad_2_desc: "MAD 장치와 디핑 소나의 등장으로 항공기는 잠수함에 대해 더욱 위협적이 되었으며, 이제 소노부이 없이도 목표를 더 쉽게 탐지하고 추적할 수 있게 되었습니다."
 special_mad_3: "Modern ASW Technology"
 special_mad_3_desc: "한층 더 발전한 소나 탐지 체계는 항공기가 해상 교전에서 잠수함의 위협을 탐지, 추적, 격멸할 수 있게 합니다."
 ag_weapons_1: "냉전기 공대지 기술"
 ag_weapons_1_desc: "초기 공대지 무기는 소량의 폭약과 초기 레이저 유도 체계로 구성되어, 항공기가 제2차 세계대전에 비해 향상된 정밀도로 목표물에 폭약을 투하할 수 있게 했습니다."
 ag_weapons_2: "Advanced A2G Weapons"
 ag_weapons_2_desc: "항공기 무기 설계의 발전으로 무기에 더 많은 폭약을 담을 수 있게 되었고, 레이저 유도 무기가 더욱 정밀해져 정밀 유도 폭격 임무가 가능해졌습니다."
 ag_weapons_3: "현대 공대지 기술"
 ag_weapons_3_desc: "고관통 탄약과 GPS 유도는 목표물에 최대한의 정밀 효과를 제공하여, 항공기가 더 높은 효율로 목표를 파괴할 수 있게 합니다."
 ag_weapons_4: "Cutting-Edge A2G Weapons"
 ag_weapons_4_desc: "원거리 타격 무기와 항력식 폭탄의 큰 발전으로 항공기는 목표물을 신속하게 교전하고 파괴할 수 있으며, 때로는 적의 무기 사거리에 들어가지 않고도 가능합니다."
 tgp_recon_1: "냉전기 타게팅 포드"
 tgp_recon_1_desc: "초기 표적 지정 포드는 항공기가 레이저 유도 무기를 위해 목표물에 레이저를 조사할 수 있게 했고, 항공기의 정찰 능력도 향상시켰습니다."
 tgp_recon_2: "Advanced Targeting Pods"
 tgp_recon_2_desc: "더 나은 영상, FLIR 도입, 항공기와 무기에 GPS 좌표를 가져와 전달하는 능력은 이 표적 지정 포드들을 냉전 시대의 전신에 비해 큰 진보로 만들었습니다."
 tgp_recon_3: "Modern Targeting Pods"
 tgp_recon_3_desc: "센서 융합, 데이터링크 및 기타 능력은 항공기에 표적 지정 포드를 장착하는 것을 기체의 주요 전력 승수로 만듭니다."
 gunship_1: "소구경 건쉽 화기"
 gunship_1_desc: "전투 중인 지상군에게 더 우수하고 장기적인 항공 지원을 제공하기 위해 수송기를 개조하여 미니건을 장착했으며, 이를 통해 경장갑 및 비장갑 목표에 상당한 양의 화력을 퍼부어 전투 중인 병력을 지원할 수 있었습니다."
 gunship_2: "대구경 건쉽 화기"
 gunship_2_desc: "초기 건십 항공기의 성공에 이어, 30mm 및 40mm 기관포와 105mm 이상 직사포를 포함한 더 무거운 무기가 건십 항공기의 장비로 추가되었습니다."
 air_weapons_1: "냉전기 공대공 무기"
 air_weapons_1_desc: "초기 미사일은 문제가 많았지만 거대한 이점이 있었습니다. 항공기는 중거리 미사일로 목표가 시야에 들어오기 전에 교전할 수 있었고, 단거리 미사일은 기관포보다 회피하기가 훨씬 어려웠습니다. 중거리 반능동 레이더 유도 미사일과 후방 적외선 유도 미사일이 표준이 되었습니다."
 air_weapons_2: "현대 공대공 무기"
 air_weapons_2_desc: "기술이 발전함에 따라 미사일 유도 체계도 발전했습니다. 특히 장거리 레이더 체계가 실전 배치되면서 장거리 공대공 미사일이 보편화되었습니다. 전방위 적외선 미사일과 능동 레이더 유도 미사일 덕분에 항공기는 더 효율적으로 목표와 교전할 수 있게 되었습니다."
 air_weapons_3: "근미래 공대공 무기"
 air_weapons_3_desc: "데이터링크 무기, 고각도 이탈 교전 미사일, 그리고 무기 체계용 HMCS 표적 지정은 공중전을 전투기에게 훨씬 더 위험한 일로 만들었습니다."
 air_weapons_4: "미래 공대공 화기"
 air_weapons_4_desc: "삼중 모드 탐색기, 다중 펄스 모터 미사일, 초기동 미사일 덕분에 이 무기들은 역사상 가장 위험한 공대공 미사일이 되었습니다."
 rocket_weapons_1: "냉전기 비유도 로켓"
 rocket_weapons_1_desc: "초기 로켓 포드는 항공기가 유도 무기보다 훨씬 저렴한 비용으로 고폭 탄두를 정밀하게 집중 투하하여 목표와 신속히 교전할 수 있는 수단을 제공했습니다."
 rocket_weapons_2: "현대 비유도 로켓"
 rocket_weapons_2_desc: "더욱 정밀해진 로켓과 탄두의 발전으로 이 무기 체계는 이전 세대보다 크게 향상되었으며, 여전히 항공기에 근접 항공 지원 및 타격 임무 능력을 제공하는 저렴하고 효과적인 수단입니다."
 countermeasures_1: "Countermeasures and early RWR"
 countermeasures_1_desc: "미사일이 등장하면서 항공기는 단순히 미사일을 따돌리거나 회피하는 데 의존하지 않는 방어 수단이 필요해졌습니다. 채프와 플레어는 조종사가 날아오는 미사일 위협을 속이려 시도할 수 있게 하는 미끼를 제공했으며, 레이더 경보 수신기는 항공기가 레이더에 포착되었을 때 조종사에게 경고했습니다."
 countermeasures_2: "Countermeasures and modern RWR"
 countermeasures_2_desc: "대응 수단 자체는 크게 달라지지 않았지만, 현대식 RWR은 이제 레이더의 종류와 거리 같은 중요한 정보를 표시합니다. 현대식 미사일 경보 체계는 미사일을 탐지하면 대응 수단을 자동으로 전개할 수도 있습니다."
 countermeasures_3: "Electronic Warfare Suite"
 countermeasures_3_desc: "항공기는 이제 첨단 전자전 장비를 갖추고 있어 전용 재밍 항공기에만 의존할 필요가 없습니다. 이 강력한 체계는 점점 정교해지는 위협에 대해 뛰어난 방호를 제공하며, 다중 스펙트럼 플레어는 현대식 적외선 유도 미사일에 대한 방어를 강화합니다."
 countermeasures_4: "레이저 능동파괴체계 방어책"
 countermeasures_4_desc: "미사일 위협을 기만하기가 갈수록 어려워지면서 임무는 회피에서 파괴로 옮겨갑니다. 항공기에 탑재된 이 체계들은 고출력 레이저로 날아오는 미사일의 유도 장치를 무력화하거나 목표에 도달하기 전에 탄두를 폭발시킵니다."
 rapid_dragon: "팔레트화 운송 공중발사순항미사일 (Palletized ALCM)"
 rapid_dragon_desc: "각국이 무기 운용 방식을 실험함에 따라, 수송기에서 곧바로 공중발사 순항미사일(ALCM)을 발사하도록 설계된 팔레트는 대형 수송기가 수행할 수 있는 역할을 급격히 바꾸고 있습니다."
