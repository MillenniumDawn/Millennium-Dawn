 farm_automation_grants_ast: "Subventions pour l'automatisation agricole"
 hung_parliament_ast: "Parlement suspendu"
 hung_parliament_ast_desc: "Pour la première fois depuis 1940, l'Australie connaît un parlement sans majorité. Aucun parti n'a assez de sièges pour former un gouvernement, et tant que nous n'obtiendrons pas le soutien nécessaire pour porter nos 72 sièges à 76, nous sommes de fait dans une impasse législative."
 hung_parliament_ast_2: "Coalition rocheuse"
 hung_parliament_ast_2_desc: "Nous avons peut-être formé un gouvernement, mais la coalition en place est loin d'être idéale. Peuplée de militants mécontents et d'indépendants imprévisibles, tout échec à faire passer une politique pourrait précipiter la fin prématurée de notre gouvernement encore naissant."
 diplomacy_tightrope_ast: "La corde raide diplomatique"
 diplomacy_tightrope_ast_desc: "Nous jonglons avec un équilibre complexe : une alliance de sécurité et de défense profonde avec les États-Unis, tout en poursuivant une interdépendance commerciale stabilisée avec la Chine. Éviter d'être forcés de choisir entre les deux, voilà comment nous restons à flot."
 non_permanent_unsc_member: "Membre non permanent du Conseil de sécurité de l'ONU"
 non_permanent_unsc_member_desc: "Le Conseil de sécurité des Nations unies élit tous les deux ans 10 membres non permanents. Ces nations peuvent soumettre des résolutions et présider les votes."
 gloves_off_diplomacy_ast: "Gants hors diplomatie"
 consuls_of_peace_idea_ast: "Consuls de la paix"
 the_australian_century_tt: "§YAccélère un certain nombre de propositions de nouvelles mines en attente d'approbation.§!"
 kevin_rudd_desc: "Expert de la géopolitique asiatique et habitué de la télévision, Kevin Rudd s'est imposé comme le nouveau visage du mouvement travailliste. Capable de concilier la stabilité d'Howard et la promesse des réformes que le pays réclame, Rudd a su équilibrer les intérêts du parti tout en restant dans les bonnes grâces du public. \n\nGrâce aux réformes de Gough Whitlam, Rudd a pu aller à l'université et mettre son éducation au service du ministère des Affaires étrangères dès 1981. Une expérience qu'il a utilisée tout au long de sa carrière. Depuis, il a grimpé dans le parti, et, membre durant l'ère des portes tournantes du Labor, Rudd n'est pas novice en politique impitoyable. Son optimisme l'a pourtant poussé à reconstruire le parti. \n\nS'efforçant d'élargir son attrait et de corriger le factionnalisme qui le tenait stagnant depuis des décennies, l'homme du Queensland tient désormais la barre. Le poste qu'il idolâtre depuis son adhésion à 15 ans, et qu'il entend honorer."
