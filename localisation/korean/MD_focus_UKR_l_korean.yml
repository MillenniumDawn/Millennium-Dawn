 UKR_republic_council_sumy: "§Y수미§! 평의회와 지역 자치를 협상했습니다"
 ukraine_modernize_sov_equipment_brdm_2_modernization_mykolayiv_early: "미콜라이우에서 §YBRDM-2§! 조기 업그레이드를 주문한다"
 ukraine_modernize_sov_equipment_brdm_2_modernization_mykolayiv_early_desc: "\n\n\n\n\n\n£UKR_desctext_modernize_sov_brdm2ld_for_tooltip\n\n\n\n\n\n\n\n\n§WThe §LMykolayiv Tank Repair Plant§! and the §LMorozov design bureau§! in Kharkiv have prepared two similar upgrades. Both add side hatches for the crew. The §YBRDM-2LD§! also gets a new diesel engine, while the §YBRDM-2M§! keeps the old gasoline one.\n\nThe offer stays open until the end of §Y2001§!. If we pass on it, the plant returns with a deeper upgrade in §Y2004§!.§!"
 ukraine_modernize_sov_equipment_brdm_2_modernization_mykolayiv_early_mission: "마지막 기회: 조기 §YBRDM-2§! 업그레이드"
 ukraine_modernize_sov_equipment_brdm_2_modernization_mykolayiv_early_mission_desc: "$ukraine_modernize_sov_equipment_brdm_2_modernization_mykolayiv_early_desc$\n\n§R타이머가 끝나면 공장이 제안을 철회합니다.§!"
 ukraine_modernize_sov_equipment_brdm_2_modernization_mykolayiv_developed: "미콜라이우에서 §YBRDM-2DI 하자르§! 업그레이드를 주문한다"
 ukraine_modernize_sov_equipment_brdm_2_modernization_mykolayiv_developed_desc: "\n\n\n\n\n\n£UKR_desctext_modernize_sov_brdm2di_for_tooltip\n\n\n\n\n\n\n\n\n§WOur missions abroad showed what a modern scout car needs. The §LMykolayiv Tank Repair Plant§! offers the §YBRDM-2DI Khazar§! with an §LIVECO§! diesel, a thermal imager, a video surveillance system and an extra hatch for the dismounts. For an extra cost, the plant can also fit the new §YBuh§! weapon station.\n\nThe offer stays open until the end of §Y2005§!.§!"
 ukraine_modernize_sov_equipment_brdm_2_modernization_mykolayiv_developed_mission: "마지막 기회: §YBRDM-2DI 하자르§!"
 ukraine_modernize_sov_equipment_brdm_2_modernization_mykolayiv_developed_mission_desc: "$ukraine_modernize_sov_equipment_brdm_2_modernization_mykolayiv_developed_desc$\n\n§R타이머가 끝나면 공장이 제안을 철회합니다.§!"
 ukraine_modernize_sov_equipment_brdm_2_modernization.10.name: "BRDM-2T의 다음 단계"
 ukraine_modernize_sov_equipment_brdm_2_modernization.10.desc: "테크임펙스는 BRDM-2T를 두 방향으로 더 발전시킬 수 있습니다. 경량형은 포탑을 떼어 내고 개방형 기관총 거치대와 BTR-70식 해치를 달며, 개량형은 포탑을 유지한 채 케블라 파편 방지 내피와 새 변속기를 추가합니다."
 ukraine_modernize_sov_equipment_brdm_2_modernization.10.a: "경량화한 §YBRDM-2T zr. 2013§!을 개발한다"
 ukraine_modernize_sov_equipment_brdm_2_modernization.10.b: "개량한 §YBRDM-2T zr. 2015§!를 개발한다"
 ukraine_modernize_sov_equipment_brdm_2_modernization.11.name: "BRDM-2T zr. 2013 준비 완료"
 ukraine_modernize_sov_equipment_brdm_2_modernization.11.desc: "테크임펙스가 §YBRDM-2T zr. 2013§!을 완성했습니다. 포탑과 차체 하부 보조 바퀴를 없애고 넓은 측면 해치를 달았으며, 개방형 거치대에 NSVT 중기관총과 PKT를 장착했습니다."
 ukraine_modernize_sov_equipment_brdm_2_modernization.11.a: "§YBRDM-2T zr. 2013§!을 채택한다"
 ukraine_modernize_sov_equipment_brdm_2_modernization.12.name: "BRDM-2T zr. 2015 준비 완료"
 ukraine_modernize_sov_equipment_brdm_2_modernization.12.desc: "테크임펙스가 §YBRDM-2T zr. 2015§!를 완성했습니다. 포탑을 유지한 채 BRDM-2LD식 해치, 5단 변속기, 로사바 타이어, 모토로라 무전기, 케블라 파편 방지 내피를 추가했습니다."
 ukraine_modernize_sov_equipment_brdm_2_modernization.12.a: "§YBRDM-2T zr. 2015§!를 채택한다"
 ukraine_modernize_sov_equipment_brdm_2_modernization.13.name: "마야크, BRDM-2DP를 제안하다"
 ukraine_modernize_sov_equipment_brdm_2_modernization.13.desc: "키이우의 §Y마야크§! 공장이 디젤 엔진, 측면 문, 탈착식 대성형작약 방호망을 갖춘 경량형 §YBRDM-2DP§!를 자체 개발했습니다. 마야크는 작업을 마무리하고 설계를 우리에게 넘기기 위한 자금 지원을 요청합니다."
 ukraine_modernize_sov_equipment_brdm_2_modernization.13.a: "마야크에 자금을 지원한다"
 ukraine_modernize_sov_equipment_brdm_2_modernization.13.b: "테크임펙스와의 거래를 유지한다"
 gets_event_delayed_tt: "\n약 §Y$DAYS$§!일 후에 사건 '§Y$EVENT_NAME$§!'이(가) 발생합니다.\n"
 ukr_economy_rate.1.b: "이자율을 현 수준으로 유지한다"
 UKR_develop_bastion_flag: "완료된 결정: §YT-84 '바스티온' 개발§!"
 ukraine_modernize_planes_restore_an_71.1.name: "An-71의 레이더"
 ukraine_modernize_planes_restore_an_71.1.desc: "안토노프가 03호기 시제기를 복원하고 옛 An-71 팀을 다시 모았습니다. 기체는 튼튼하지만 계획의 성패는 레이더가 좌우할 것입니다. 모스크바의 베가-M은 크반트를 완성해 주겠다고 제안했고, 이스라엘의 엘타는 An-71의 원반형 레이돔에 맞춘 팰콘 위상배열 레이더의 경량형을 제안했습니다."
 ukraine_modernize_planes_restore_an_71.1.a: "베가-M과 함께 §Y크반트§!를 완성한다"
 ukraine_modernize_planes_restore_an_71.1.b: "이스라엘제 §Y팰콘§! 레이더를 구매한다"
 ukraine_modernize_planes_restore_an_71.2.name: "다시 날아오른 An-71"
 ukraine_modernize_planes_restore_an_71.2.desc_kvant: "개량한 크반트 레이더를 단 03호기가 비행에 성공했으며, 베가-M의 새 필터가 마침내 저고도 표적을 잡아냅니다. An-74를 생산하는 하르키우 항공기 공장은 그 기체의 개량점을 An-71 기체에 이식하겠다고 제안했습니다."
 ukraine_modernize_planes_restore_an_71.2.desc_phalcon: "원반형 레이돔에 이스라엘제 레이더를 단 03호기가 비행에 성공했으며, 위상배열 레이더는 크반트보다 훨씬 잘 저고도 표적을 추적합니다. An-74를 생산하는 하르키우 항공기 공장은 그 기체의 개량점을 An-71 기체에 이식하겠다고 제안했습니다."
 ukraine_modernize_planes_restore_an_71.2.a: "§YAn-74TK-200§! 규격으로 재제작한다"
 ukraine_modernize_planes_restore_an_71.2.b: "§YAn-74TK-300§!처럼 엔진을 날개 아래로 옮긴다"
 ukraine_modernize_planes_restore_an_71.2.c: "시제기 기체를 그대로 유지한다"
 ukraine_modernize_planes_restore_an_71_200_tt: "약 §Y5개월§! 뒤 하르키우가 An-74TK-200 기체를 인도합니다. 더 강력한 제빙 장치(§Y$spec_redundant_3$§!), 더 큰 연료 탱크(§Y$spec_refuel_1$§!), 더 넓은 항전 장비실(§Y$avionics_manned_2$§!)을 갖춥니다."
 ukraine_modernize_planes_restore_an_71_300_tt: "약 §Y8개월§! 뒤 하르키우와 §Y모토르 시치§!가 An-74TK-300 구성을 인도합니다. 날개 아래 엔진(§Y$engine_jet_double_3$§!)과 새 조종석 항전 장비(§Y$avionics_manned_3$§!)를 갖추며, 날개 위 엔진 배치가 지녔던 단거리 이륙 능력은 잃습니다."
 ukraine_modernize_planes_restore_an_71.3.name: "An-74TK-200 규격으로 재제작된 An-71"
 ukraine_modernize_planes_restore_an_71.3.desc: "하르키우가 An-71을 An-74TK-200 규격으로 재제작했습니다. 향상된 제빙 장치, 더 큰 연료 탱크, 더 넓은 항전 장비실 덕분에 더 오래, 더 험한 날씨에서도 초계 비행을 할 수 있습니다."
 ukraine_modernize_planes_restore_an_71.3.a: "새 기체를 채택한다"
 ukraine_modernize_planes_restore_an_71.4.name: "An-74TK-300 구성을 얻은 An-71"
 ukraine_modernize_planes_restore_an_71.4.desc: "하르키우가 An-74TK-300처럼 An-71의 엔진을 날개 아래 파일론으로 옮겼습니다. 단거리 이륙 능력은 포기했지만 순항 속도가 빨라지고 장시간 초계 비행에서 연료를 덜 소모합니다."
 ukraine_modernize_planes_restore_an_71.4.a: "새 기체를 채택한다"
