 UKR_kharkiv_pact_signed_tt: "The §YBlack Sea Fleet§! lease on §YSevastopol Bay§! is extended to §Y2042§!. We can still demand the base back from §Y2017§! if we take a §YNATO§! path."
 UKR_kharkiv_pact_refused_tt: "The §YBlack Sea Fleet§! lease expires in §Y2017§!. After that we will demand the return of §YSevastopol Bay§!, and §RRussia may answer with war§!."
 UKR_sevastopol_naval_base_category: "Sevastopol Naval Base"
 UKR_sevastopol_naval_base_category_desc: "\n\n\n\n\n\n£UKR_desctext_sevastopol_naval_base_main\n\n\n\n\n\n\n\n\nThe [SOV.GetFlag]§Y[SOV.GetAdjective]§! §YBlack Sea Fleet§! is based on our territory under the 1997 agreements, and its lease on §YSevastopol Bay§! runs until §Y2017§!.\nWe may try to renegotiate it and push §Y[SOV.GetNameWithFlag]§! out of it earlier, but our chances greatly depends on our military strength, effective procurements of new military equipment or becoming a §YNATO§! member."
 UKR_sevastopol_naval_base_terminate_bsf_lease: "§RTerminate§! the [SOV.GetFlag]§Y[SOV.GetAdjective]§! Black Sea Fleet §Ybase lease§!"
 UKR_sevastopol_naval_base_terminate_bsf_lease_desc: "\n\n\n\n\n\n£UKR_desctext_sevastopol_lease_for_tooltip\n\n\n\n\n\n\n\n\n§WThe 1997 agreements allow the [SOV.GetFlag]§Y[SOV.GetAdjective]§! fleet to stay in §YSevastopol§! until 2017. We can notify §YMoscow§! that we are ending the lease early and ask for the base to be handed over.\n\nIf Russia agrees, §YSevastopol Bay§! §Greturns to our control§!. Otherwise §Rrelations with Russia worsen§!, but the lease still expires in §Y2017§!§!.$UKR_sevastopol_russia_answer$"
 UKR_sevastopol_naval_base_prepare_kharkiv_pact: "Prepare for the Kharkiv Pact"
 UKR_sevastopol_naval_base_prepare_kharkiv_pact_desc: "\n\n\n\n\n\n£UKR_desctext_kharkiv_pact_for_tooltip\n\n\n\n\n\n\n\n\n§WMoscow offers to extend the §YBlack Sea Fleet§! lease in exchange for cheaper gas. We must decide whether to sign the agreement or let the lease run out in 2017.\n\n§RSigning extends the lease to§! §Y2042§!. §GRefusing lets us demand the bay back in§! §Y2017§!, §Rthough Russia may go to war over it§!.$UKR_sevastopol_russia_answer$§!"
 UKR_sevastopol_russia_answer: "\n\n§WHow §Y[SOV.GetNameWithFlag]§! answers our demand?\n§Y[SOV.GetNameWithFlag]§! can §Gwithdraw the fleet§!, §Yrefuse§!, or §Rdeclare war§!.\nOnce we are a §YNATO§! member, it can only withdraw.\nEach of these makes §Gwithdrawal more likely§! and §Gwar less likely§!:\n---§CFocuses§!---\n- §Y$UKR_sapsan$§! [UKR_sevastopol_status_sapsan]\n- §Y$UKR_hur_reform$§! [UKR_sevastopol_status_hur_reform]\n- §Y$UKR_ukrainian_armed_forces_reform$§! or §Y$UKR_poroshenko_army_reform$§! [UKR_sevastopol_status_army_reform]\n---§ODecisions§!---\n- the §YObject 477A1 'Nota'§! MBT [UKR_sevastopol_status_nota]\n- §YProject 58250 'Volodymyr Velykyi'§! corvettes [UKR_sevastopol_status_58250]\n- the §YAn-LBL§! or §YAn-BFV§! aircraft [UKR_sevastopol_status_an_aircraft]\n\nA weaker [SOV.GetFlag]§Y[SOV.GetAdjective]§! army or a democratic government in §YMoscow§! also makes war less likely.§!"
 ukraine_sevastopol.1.name: "Kyiv Demands the Return of Sevastopol"
 ukraine_sevastopol.1.desc_nato: "Ukraine is now a NATO member and demands the return of Sevastopol Bay. Refusing would mean a direct confrontation with the Alliance."
 ukraine_sevastopol.1.desc_early: "Ukraine has notified us that it is terminating the Black Sea Fleet lease early and demands that we hand over the base. The 1997 agreements do not provide for this, but Kyiv is pressing the issue."
 ukraine_sevastopol.1.desc_nato_prep: "Despite the extended lease, Kyiv is moving towards NATO and demands the return of Sevastopol Bay. The Alliance has not yet given Ukraine any guarantees."
 ukraine_sevastopol.1.desc_expiry: "The Black Sea Fleet lease has expired, and Kyiv demands the return of Sevastopol Bay."
 ukraine_sevastopol.1.a: "Withdraw the fleet"
 ukraine_sevastopol.1.b: "Refuse the demand"
 ukraine_sevastopol.1.c: "Sevastopol stays Russian, by force"
 ukraine_sevastopol.2.name: "Sevastopol Returns to Ukraine"
 ukraine_sevastopol.2.desc: "The Russian fleet has left, and the base in Sevastopol Bay is in Ukrainian hands again."
 ukraine_sevastopol.2.a: "A historic day"
 ukraine_sevastopol.3.name: "Russia Refuses to Leave Sevastopol"
 ukraine_sevastopol.3.desc: "Moscow has rejected our demand and insists that the Black Sea Fleet stays in Sevastopol. For now, it has not resorted to force."
 ukraine_sevastopol.3.a: "We will not forget this"
 ukraine_sevastopol.4.name: "Russia Refuses and Invades"
 ukraine_sevastopol.4.desc: "Moscow has rejected our demand for Sevastopol Bay and declared war. NATO has given us no guarantees."
 ukraine_sevastopol.4.a: "To arms"
