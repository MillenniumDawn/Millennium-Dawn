 UKR_develop_2s22: "Develop §Y2S22 'Bohdana'§! SP Artillery System"
 UKR_develop_2s22_desc: "\n\n\n\n\n\n£UKR_desctext_develop_domestic_2s22_for_tooltip\n\n\n\n\n\n\n\n\n§WThe 2S22 'Bohdana' is a Ukrainian 155 mm self-propelled howitzer, developed by Kramatorsk Heavy Machine Tool Building Plant to provide the Ukrainian Armed Forces with modern NATO-standard artillery capabilities.\nThe system is mounted on a wheeled chassis, providing high operational mobility and allowing it to rapidly change firing positions after engaging the enemy.\nThe 155 mm gun is capable of employing standard NATO artillery ammunition, significantly increasing the range and firepower available to Ukrainian artillery units.\nIts automated fire-control and navigation systems allow the crew to rapidly determine firing data and engage targets with greater accuracy.\nThe development of the 'Bohdana' represents a major step in the modernization of Ukrainian artillery and the transition toward NATO-standard weapon systems.\n\n§GA particularly important military project:§! once it is completed, the §YVerkhovna Rada§! will be more willing to approve a higher military budget.§!"
 UKR_modernize_su25_m1: "Moderniser l'avion d'attaque Su-25"
 UKR_modernize_su27_1m: "Moderniser l'avion de chasse Su-27"
 UKR_modernize_mig29_mu2: "Further develop §YMiG-29MU2§! fighter aircraft"
 UKR_modernize_mig29_mu1: "Modernize §YMiG-29MU1§! fighter aircraft"
 UKR_develop_an_lbl: "Develop a proposed §YAn-LBL§!\nlight combat aircraft"
 UKR_develop_an_lbl_desc: "\n\n\n\n\n\n£UKR_desctext_planes_modernization_an_lbl_development_for_tooltip\n\n\n\n\n\n\n\n\n§WThe Antonov §YLBL§! (Light Combat Aircraft) is a proposed light aircraft designed by the §LAntonov Design Bureau§! that is expected to be close to §YYak-130§!. It is intended for use in various roles, including training and reconnaissance. The aircraft is expected to feature advanced avionics, a lightweight airframe, and efficient engines to provide excellent performance and fuel efficiency.\n\n§GA particularly important military project:§! once it is completed, the §YVerkhovna Rada§! will be more willing to approve a higher military budget.§!"
 UKR_develop_an_bfv: "Develop a proposed §YAn-BFV§!\nmultirole fighter aircraft"
 ukraine_develop_2s22.1.name: "Développer l'obusier automoteur 2S22 'Bohdana'"
 ukraine_develop_2s22.1.desc: "As we speak, technology advances further, and our weapons stay the same.\nWe need to develop our own new SPG for our forces"
 ukraine_develop_2s22.1.a: "Fournir un financement de base"
 ukraine_develop_2s22.1.b: "Fournir un financement important"
 ukraine_develop_2s22.2.name: "KrZVV a finalisé le projet du nouvel automoteur"
 ukraine_develop_2s22.2.desc: "L'usine KrZVV a terminé le projet du nouvel automoteur pour notre armée. Cependant, faute de fonds suffisants, ils n'ont pas pu concevoir un nouveau canon et ont dû utiliser un ancien modèle soviétique."
 ukraine_develop_2s22.2.a: "D'accord, lançons la production !"
 ukraine_develop_2s22.3.name: "KrZVV a finalisé le projet du nouvel automoteur"
 ukraine_develop_2s22.3.desc: "We have checked and are sure now, that KrZVV did create a new SPG project for our military.\nMoreover, due to additional funds we provided, they developed every aspect of the SPG from scratch, new and strong!"
 ukraine_develop_2s22.3.a: "Parfait, lançons la production !"
 UKR_develop_kba27: "Develop §YKBA-27§! towed Artillery"
 UKR_develop_kba27_desc: "\n\n\n\n\n\n£UKR_desctext_develop_domestic_kba27_for_tooltip\n\n\n\n\n\n\n\n\n§WThe KBA-27 is a Ukrainian 152 mm howitzer derived from the Soviet 2A61 Pat-B. An experimental variant mounted the gun on a PTS-2 amphibious transporter, combining heavy artillery firepower with high mobility and amphibious capabilities. Further development could transform this prototype into a viable self-propelled artillery system.§!"
 UKR_develop_nota_flag: "Completed decision §YDevelop Object 477A1 'Nota' MBT§!"
 UKR_develop_nota: "Développer le char §YObject 477A1 'Nota'§!"
 UKR_modernize_nota: "Moderniser le §YObject 477A1 'Nota'§!"
 ukraine_armed_forces_tragedy_event.1.name: "Tragédie des missiles Brovary"
 ukraine_armed_forces_tragedy_event.1.desc: "La catastrophe de Brovary du 20 avril 2000 a été un accident survenu dans la ville de Brovary, oblast de Kyiv, lorsqu'un missile d'entraînement surface-surface du complexe « Totchka-U », lancé lors d'exercices militaires depuis le polygone de Gontcharivka, a dévié de sa trajectoire prévue et, après 90 km de vol, a frappé un immeuble résidentiel de neuf étages.\nLe missile n'avait pas d'ogive explosive ; trois personnes ont été tuées et cinq autres blessées des suites de l'impact.\n\nPendant quatre jours après la catastrophe, jusqu'au 23 avril, le ministère de la Défense d'Ukraine, dirigé par Oleksandr Kouzmouk, a refusé d'admettre que c'était leur missile qui avait frappé l'immeuble."
 ukraine_armed_forces_tragedy_event.1.a: "Ce n'était pas notre missile"
 ukraine_armed_forces_tragedy_event.2.name: "Le vol 1812 de Sibérie Airlines abattu"
 ukraine_armed_forces_tragedy_event.2.desc: "Le vol 1812 de Siberia Airlines était un vol commercial présumé abattu par la force aérienne ukrainienne au-dessus de la mer Noire le 4 octobre 2001, en route de Tel-Aviv, Israël, vers Novossibirsk, Russie.\nL'appareil, un Tupolev Tu-154 de fabrication soviétique, transportait 66 passagers et 12 membres d'équipage. La plupart des passagers étaient des Israéliens rendant visite à des parents en Russie. Il n'y a pas eu de survivants.\nLe crash a été causé par un missile lancé lors d'exercices conjoints ukraino-russes de défense aérienne sur le polygone sous contrôle russe du 31e centre de recherche de la flotte russe de la mer Noire au cap Opouk près de Kertch en Crimée."
 ukraine_armed_forces_tragedy_event.2.a: "Il nous faut une enquête"
 ukraine_armed_forces_tragedy_event.3.name: "Catastrophe du spectacle aérien de Sknyliv"
 ukraine_armed_forces_tragedy_event.3.desc: "La catastrophe du meeting aérien de Sknyliv s'est produite le 27 juillet 2002, lorsqu'un Soukhoï Su-27UB de la force aérienne ukrainienne, piloté par Volodymyr Toponar (de l'équipe de démonstration acrobatique « Faucons ukrainiens ») et copilote Youriï Iegorov, s'est écrasé sur les spectateurs lors d'une présentation d'acrobatie à l'aérodrome de Sknyliv près de Lviv, Ukraine.\nL'accident a tué 77 personnes et blessé 543. C'est l'accident de meeting aérien le plus meurtrier de l'histoire.\nAprès la catastrophe, les pilotes ont déclaré que la carte de vol qu'ils avaient reçue différait de la disposition réelle."
 ukraine_armed_forces_tragedy_event.3.a: "Incroyable tragédie"
 UKR_Brovary_Missile_Tragedy_Flag: "La tragédie du missile de Brovary s'est produite"
 UKR_Tu154_Air_Tragedy_Flag: "Le vol Siberia Airlines 1812 a été abattu"
 ukraine_warehouse_explosions.1.name: "Mauvaises conditions des dépôts de munitions"
 ukraine_warehouse_explosions.1.desc: "Les réformes récentes des forces armées ont révélé de graves carences dans le stockage et la sécurité des dépôts de munitions à travers l'Ukraine. Des installations obsolètes et un contrôle laxiste posent un risque significatif d'accidents. Le gouvernement doit décider comment traiter ce problème."
 ukraine_warehouse_explosions.1.a: "Maintenance complète de tous les dépôts"
 ukraine_warehouse_explosions.1.b: "Entretien partiel des principaux dépôts"
 ukraine_warehouse_explosions.1.c: "Ignorer le problème"
 ukraine_warehouse_explosions.2.name: "Explosion au dépôt de munitions d'Artemivsk"
 ukraine_warehouse_explosions.2.desc: "The unexpected and widespread incident happened recently in the city of Artemivsk, Artemivsk district, Donetsk region. Fire has started at the warehouses of the 52nd Mechanized Brigade, where about three thousand tons of artillery ammunition were stored. Unfortunately, massive explosions come after initial fire. We need to take actions in order to clean the place and stop such incidents in the future."
 ukraine_warehouse_explosions.2.a: "Reconstruction complète du dépôt"
 ukraine_warehouse_explosions.2.b: "Envoyer une commission d'enquête"
 ukraine_warehouse_explosions.2.c: "Ignorer le problème"
 ukraine_warehouse_explosions.3.name: "Explosion au dépôt de munitions de Novobohdanivka"
 ukraine_warehouse_explosions.3.desc: "L'incident inattendu et étendu s'est produit récemment près du village de Novobohdanivka, district de Melitopol, région de Zaporijjia. Le 6 mai 2004, près de 90 000 munitions pour les systèmes Grad, Smerch et Ouragan ont explosé. Les fragments d'obus ont volé à 40 km de l'épicentre de l'urgence incendiaire. Plus de mille cinq cents personnes durent alors être évacuées. Cinq personnes sont mortes, plus de 80 ont été hospitalisées avec diverses blessures, plus de 20 familles se sont retrouvées sans logement. L'explosion a endommagé 4 km de gazoduc. Les dégâts se sont élevés à 3 milliards 752 millions de UAH."
 ukraine_warehouse_explosions.3.a: "Reconstruction complète du dépôt"
 ukraine_warehouse_explosions.3.b: "Envoyer une commission d'enquête"
 ukraine_warehouse_explosions.3.c: "Ignorer le problème"
 ukraine_warehouse_explosions.4.name: "Explosion au dépôt de munitions de Tsvitokha"
 ukraine_warehouse_explosions.4.desc: "L'incident inattendu et étendu s'est produit récemment près du village de Tsvitokha, district de Slavouta, région de Khmelnytskyï. Incendie avec explosions de munitions dans la région de Khmelnytskyï à l'arsenal n° 47. L'installation de stockage contenait 52,9 wagons conventionnels de munitions (obus de petit calibre — 23 et 30 mm, grenades pour lance-grenades sous canon), qui ont détoné des suites de l'incendie. Les fragments ont volé dans un rayon de 100-150 m."
 ukraine_warehouse_explosions.4.a: "Reconstruction complète du dépôt"
 ukraine_warehouse_explosions.4.b: "Envoyer une commission d'enquête"
 ukraine_warehouse_explosions.4.c: "Ignorer le problème"
 ukraine_warehouse_explosions.5.name: "Deuxième explosion au dépôt de munitions de Novobohdanivka"
 ukraine_warehouse_explosions.5.desc: "L'incident d'explosions s'est produit pour la deuxième fois près du village de Novobohdanivka, district de Melitopol, région de Zaporijjia. Le 23 juillet 2005, à 17 h 20, un entrepôt de la 257e base de stockage de munitions a pris feu. À 20 h 54, la détonation des obus a cessé. Cinq personnes ont été blessées. La cause des explosions aurait été la haute température de l'air, qui aurait provoqué la combustion spontanée d'une mine fumigène."
 ukraine_warehouse_explosions.5.a: "Reconstruction complète du dépôt"
 ukraine_warehouse_explosions.5.b: "Envoyer une commission d'enquête"
 ukraine_warehouse_explosions.5.c: "Ignorer le problème"
 ukraine_warehouse_explosions.6.name: "Troisième explosion au dépôt de munitions de Novobohdanivka"
 ukraine_warehouse_explosions.6.desc: "L'incident d'explosions s'est produit pour la troisième fois près du village de Novobohdanivka, district de Melitopol, région de Zaporijjia. Le 19 août 2006 à 14 h 15, une nouvelle explosion grave a eu lieu. Environ trois hectares du dépôt ont brûlé. 1 500 habitants ont été évacués, 4 000 personnes mises à l'abri. 428 personnes et 96 engins ont été mobilisés. 4 personnes ont été blessées."
 ukraine_warehouse_explosions.6.a: "Reconstruction complète du dépôt"
 ukraine_warehouse_explosions.6.b: "Envoyer une commission d'enquête"
 ukraine_warehouse_explosions.6.c: "Ignorer le problème"
 ukraine_warehouse_explosions.7.name: "Explosion au dépôt de munitions de Lozova"
 ukraine_warehouse_explosions.7.desc: "The unexpected and widespread incident happened recently in the city of Lozova, Lozova district, Kharkiv region. On August 27, 2008, at 16:20, the warehouse of the 61st arsenal of the Southern Operational Command of the Ground Forces caught fire. The arsenal of military unit No. 0829, with an area of about 500 hectares, stored 95 thousand tons of shells. The explosions began about two hours later. All residents within a radius of 3 km from the warehouses were evacuated."
 ukraine_warehouse_explosions.7.a: "Reconstruction complète du dépôt"
 ukraine_warehouse_explosions.7.b: "Envoyer une commission d'enquête"
 ukraine_warehouse_explosions.7.c: "Ignorer le problème"
