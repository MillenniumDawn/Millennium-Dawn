l_korean:
 STALKER.130.t: "파국적 방출"
 STALKER.130.d: "방출이 [STALKER_zone_name]의 약해진 방어선을 찢고 지나갔습니다. 위성 사진에는 불타 버린 검문소와 환하게 빛나는 하늘이 찍혔고, 이웃 정부들은 다음 차례가 자국 국경이냐고 묻고 있습니다."
 STALKER.130.a: "구역은 영원히 갇혀 있지 않을 것이다."
 STALKER.131.t: "우리 아티팩트를 가로챈 나라"
 STALKER.131.d: "[From.GetName]은(는) 우리 구역에서 밀반출되어 자국 세관에 압수된 아티팩트의 반환을 거부했습니다. 그쪽 연구소에서는 벌써 아티팩트를 연구하고 있습니다."
 STALKER.131.a: "반환을 요구하라."
 STALKER.131.b: "다툴 가치도 없다."
 STALKER.132.t: "구역 문제를 논의하는 나토"
 STALKER.132.d: "동맹국 국방장관들이 [?global.STALKER_zone_host_target.GetName]의 이상 구역을 두고 비공개 회의를 열었습니다. 그곳의 봉쇄는 무너지고 있으며, 여러 회원국이 동맹 차원에서 더 튼튼한 방어선 비용을 대자고 주장합니다."
 STALKER.132.a: "봉쇄 활동에 자금을 대라."
 STALKER.132.a_tt: "초르노빌 구역이 §Y봉쇄§!를 §G10§! 얻습니다."
 STALKER.132.b: "동맹이 나설 문제가 아니다."
 STALKER.133.t: "전문가를 보내겠다는 모스크바"
 STALKER.133.d: "우리 비상사태부는 오염 지역을 다룬 경험이 있는데, [?global.STALKER_zone_host_target.GetName]의 구역은 통제를 벗어나고 있습니다. 우리 전문가들을 보내겠다고 제안하면 중요한 곳에서 영향력을 얻을 수 있습니다."
 STALKER.133.a: "전문가를 보내라."
 STALKER.133.a_tt: "초르노빌 구역이 §Y봉쇄§!를 §G5§! 얻습니다."
 STALKER.133.b: "자기네 재난은 자기네가 수습하게 두자."
 STALKER.134.t: "구역에서 실종된 탐사대"
 STALKER.134.d: "접근 협정에 따라 구역에 보낸 연구팀이 돌아오지 않았습니다. 마지막 교신에는 어떤 지도에도 없는 이상 현상이 언급되어 있었습니다."
 STALKER.134.a: "주최국 정부는 이들을 지키지 못했다."
 STALKER.134.b: "위험은 그들도 알고 있었다."
 STALKER.135.t: "구역에서 사망한 외국 과학자들"
 STALKER.135.d: "[?global.STALKER_casualty_country.GetName] 연구자들이 이상 구역 안에서 사망했습니다. 이번 사망으로 외국 팀의 출입을 아예 허용해야 하느냐는 논쟁이 다시 불붙었습니다."
 STALKER.135.a: "구역은 들어오는 자를 가리지 않는다."
 STALKER.136.t: "우리 땅에 생긴 구역"
 STALKER.136.d_usa: "미국 영토 안에 이상 구역이 생겼습니다. 의회는 청문회를, 국방부는 방어선 통제를, 대학들은 표본을 요구합니다. 행정부는 누가 구역을 먼저 차지할지 정해야 합니다."
 STALKER.136.d_sov: "러시아 영토에 구역이 생겼습니다. 보안 기관들은 구역을 봉쇄하고 기밀로 분류하길 원하지만, 과학 아카데미는 이상 현상 연구에서 러시아가 뒤처져서는 안 된다고 주장합니다."
 STALKER.136.d_chi: "중국 안에 구역이 생겼습니다. 당 지도부는 구역 확보를 명령했지만, 이곳이 폐쇄된 군사 구역이 될지 국가 연구 과제가 될지는 아직 정해지지 않았습니다."
 STALKER.136.d: "우리 영토에 이상 구역이 생겼습니다. 강대국인 만큼 세계가 우리의 대응을 지켜보고 있습니다."
 STALKER.136.a: "군에 지휘를 맡겨라."
 STALKER.136.a_tt: "정치력 §R50§!이(가) 듭니다. 새 구역이 §Y봉쇄§!를 §G15§! 얻습니다."
 STALKER.136.b: "국가 연구 과제로 삼아라."
 STALKER.136.b_tt: "새 구역이 §Y개발도§!을 §G10§! 얻어 우리의 연구 성과가 늘어납니다."
 STALKER_kept_seized_artifacts: "압수한 아티팩트를 돌려주지 않음"
 STALKER_blamed_for_casualties: "탐사대 사망의 책임을 추궁당함"
 STALKER.137.t: "구역 문제를 다루는 이사회"
 STALKER.137.d: "상임이사국들이 새로 생긴 이상 구역 문제로 모였습니다. 봉쇄를 지지하거나, 찬성표를 던진 정부에 연구 접근권을 열어 주거나, 휴회할 수 있습니다. 동률이면 회의는 휴회됩니다."
 STALKER.137.a: "봉쇄에 투표한다."
 STALKER.137.a_tt: "우리 표는 봉쇄로 집계됩니다."
 STALKER.137.b: "연구 접근에 투표한다."
 STALKER.137.b_tt: "우리 표는 접근으로 집계됩니다. 접근이 가결되면 찬성표를 던진 모든 정부가 구역 연구 접근권을 얻습니다."
 STALKER.137.c: "휴회에 투표한다."
 STALKER.137.c_tt: "우리 표는 휴회로 집계됩니다. 동률일 때도 회의는 휴회됩니다."
 STALKER.138.t: "이사회 회의 종료"
 STALKER.138.d_containment: "회의는 봉쇄 쪽으로 마무리되었습니다. 이번 투표에서 새로운 연구 접근권은 나오지 않았습니다."
 STALKER.138.d_access: "회의는 연구 접근 쪽으로 마무리되었습니다. 접근에 찬성한 정부들은 구역을 연구할 수 있습니다."
 STALKER.138.d_adjourn: "회의는 결론 없이 휴회했습니다. 봉쇄와 접근 모두 기존 상태 그대로 남았습니다."
 STALKER.138.a: "이사회의 뜻이 정해졌다."
 STALKER_request_international_containment: "국제 방어선 보안군 요청"
 STALKER_request_international_containment_desc: "강대국들에 구역 방어선 수비를 도와 달라고 요청합니다. 국제 방어선 보안군은 자금과 병력, 과학자를 가져오지만, 참여국은 모두 그 대가로 접근권을 기대할 것입니다."
 STALKER_request_international_containment_tt: "우리가 통제하는 모든 구역이 §Y봉쇄§!를 §G10§! 얻고 §Y도적§! 영향력을 최대 §G10§! 잃습니다. 우리와 평화로운 모든 강대국에 참여 요청이 갑니다. 참여국이 하나 늘 때마다 §Y봉쇄§!가 §G5§! 더 오르고, §Y도적§! 영향력이 최대 §G5§! 줄며, 해당국은 구역 연구 접근권을 얻습니다."
 STALKER_transfer_artifacts: "[FROM.GetName]에 아티팩트 이전"
 STALKER_transfer_artifacts_desc: "선의의 표시로 회수한 아티팩트 한 꾸러미를 [FROM.GetName]의 연구소로 보냅니다.\n\n아티팩트 비축고: §Y[?ROOT.STALKER_artifact_stockpile|1]§!"
 STALKER_transfer_artifacts_tt: "국가 비축고에서 아티팩트 §Y5§!개를 소모합니다. [FROM.GetName]은(는) §Y180일§! 동안 연구 속도 §G+3%§!를 얻고 우리에 대한 호감도가 오릅니다."
 STALKER_foreign_zone_access: "구역 연구 접근권"
 STALKER_foreign_zone_access_desc: "국제 협정에 따라 우리 과학자들이 이상 구역에 접근할 수 있습니다."
 STALKER.20.t: "압수된 이상 아티팩트"
 STALKER.20.d: "우리 항구 한 곳의 세관원이 기계 부품 화물을 열어 보니 빛나고, 웅웅거리고, 떠다니는 물체 열두 개가 나왔습니다. 서류를 따라가면 유령 회사 세 곳을 거쳐 구역으로 이어집니다."
 STALKER.20.d_usa: "FBI가 구역 아티팩트를 뉴욕과 로스앤젤레스의 개인 수집가들에게 팔던 밀수 조직을 적발했습니다. 압수된 물체들은 빛나고, 웅웅거리고, 떠다닙니다. 맨손으로 만진 수사관들은 지금 병원에 있습니다."
 STALKER.20.a: "연구소로 보내라."
 STALKER.20.a_tt: "§Y90일§! 동안 연구 속도 §G+3%§!를 얻습니다. 구역 통제국이 반환을 요구할 수 있습니다."
 STALKER.20.b: "[event_target:STALKER_zone_controller_target.GetName]에 돌려주어라."
 STALKER.21.t: "구역 접근 요청"
 STALKER.21.d: "[event_target:STALKER_access_requester.GetName]이(가) [STALKER_zone_name]에 과학 연구팀을 보내게 해 달라고 요청했습니다. 그쪽 과학자들이 우리 과학자들과 함께 일하며, 발견한 내용을 공유하겠다고 합니다."
 STALKER.21.a: "접근을 허용하라."
 STALKER.21.a_tt: "[event_target:STALKER_access_requester.GetName]은(는) 구역 연구 접근권으로 연구 속도 §G+1%§!를 얻습니다. 구역 §Y개발도§!이 §G5§! 오릅니다."
 STALKER.21.b: "요청을 거절하라."
 STALKER.23.t: "국제 방어선 보안군"
 STALKER.23.d: "[?global.STALKER_ipsf_host.GetName]이(가) 영토 내 이상 구역의 수비를 도와 달라고 강대국들에 요청했습니다. 참여국은 방어선 비용을 나눠 부담하고, 자국 과학자들의 접근권을 얻습니다."
 STALKER.23.a: "파견대를 보내라."
 STALKER.23.a_tt: "[?global.STALKER_ipsf_host.GetName]이(가) 통제하는 모든 구역이 §Y봉쇄§!를 §G5§! 얻고 §Y도적§! 영향력을 최대 §G5§! 잃습니다. 우리는 구역 연구 접근권으로 연구 속도 §G+1%§!를 얻습니다."
 STALKER.23.b: "우리가 상관할 문제가 아니다."
 STALKER.24.t: "국제 방어선 보안군 구성"
 STALKER.24.d: "[?global.STALKER_ipsf_host.GetName]이(가) 세계 강대국들에 이상 구역 봉쇄를 도와 달라고 요청했습니다. 여러 수도의 외교관들은 국제 방어선 보안군이 몇 주 안에 꾸려질 수 있다고 말합니다."
 STALKER.24.a: "이제 구역은 모두의 문제다."
 STALKER_transfer_artifacts_available_tt: "국가 비축고에 아티팩트가 최소 §Y5§!개 있어야 합니다 (현재 §Y[?ROOT.STALKER_artifact_stockpile|1]§!개)."
 STALKER_seize_perimeter_artifacts: "초르노빌 방어선에서 아티팩트 압수"
 STALKER_seize_perimeter_artifacts_desc: "[FROM.GetName]에서 나가는 경로를 검문해, 밀수업자들이 해외로 반출하기 전에 아티팩트를 회수합니다."
 STALKER_seize_perimeter_artifacts_tt: "밀수 물량에서 아티팩트 §Y5§!개를 우리 비축고로 옮기고, 현지 도적 영향력을 §G10§! 낮추며, 봉쇄를 §G5§! 올립니다."
 STALKER_seize_perimeter_artifacts_available_tt: "공용 밀수 물량에 아티팩트가 최소 §Y5§!개 있어야 합니다."
 STALKER_request_zone_research_access: "[FROM.GetName] 연구 접근권 요청"
 STALKER_request_zone_research_access_desc: "[FROM.GetName]을(를) 통제하는 나라에 우리 과학자들의 구역 출입을 허가해 달라고 요청합니다. 승인되면 지속적인 연구 이득을 얻습니다."
 STALKER_request_zone_research_access_tt: "구역 통제국이 연구 접근 요청을 받습니다. 수락하면 우리는 연구 속도 §G+1%§!를 얻고 구역은 개발도이 §Y5§! 늘어납니다."
 STALKER_request_zone_research_access_cooldown_tt: "구역에 §Y365일§! 연구 접근 요청 재사용 대기 시간이 적용 중이지 않아야 합니다."
 STALKER.27.t: "구역 내 세력 위기"
 STALKER.27.d: "방어선이 약해진 틈에 도적 무리가 [STALKER_zone_name]으로 가는 길목을 장악했습니다. 듀티는 합동 소탕을, 프리덤는 독립 스토커를 위한 보호 통로를 제안합니다. 밀수업자들은 자기들을 건드리지 않는 대가로 물건 일부를 내놓겠다고 합니다."
 STALKER.27.a: "듀티의 소탕을 지지하라."
 STALKER.27.a_tt: "도적 영향력이 최대 §G25§! 줄고, 원래 구역에서만 듀티가 §G10§! 오르며, 봉쇄가 §G10§! 오르고, 스토커 인구가 최대 §R10§! 줄어듭니다."
 STALKER.27.b: "프리덤의 통로 계획을 받아들여라."
 STALKER.27.b_tt: "도적 영향력이 최대 §G15§! 줄고, 스토커가 §G10§! 늘며, 원래 구역에서만 프리덤가 §G10§! 오르고, 개발도이 §G5§! 오르며, 봉쇄가 최대 §R5§! 줄어듭니다."
 STALKER.27.c: "밀수업자들의 제안을 받아들여라."
 STALKER.27.c_tt: "밀수된 아티팩트 §Y5§!개를 우리 비축고로 옮기지만, 도적 영향력이 §R10§! 오르고 봉쇄가 최대 §R10§! 줄어듭니다."
 STALKER.27.e: "X-16 화물 기록을 추적하라."
 STALKER.27.e_tt: "도적 영향력이 최대 §G20§! 줄고, 봉쇄와 개발도이 각각 §G5§! 오릅니다. 프로젝트 X 발견이 필요합니다."
 STALKER_expel_foreign_agents: "[FROM.GetName]에서 외국 요원 추방"
 STALKER_expel_foreign_agents_desc: "외국 정보기관들이 구역을 본국에 보고하는 계약자와 연구자, 연락 장교로 채워 놓았습니다.\n\n외국 정보 침투: §Y[?FROM.STALKER_zone_foreign_intel|0]§!\n연구 접근권을 얻은 나라마다 §Y5§!, §Y개발도§! 1점마다 §Y0.4§!씩 늘어납니다. §Y49§!을 넘으면 정부 내 MDST 조직망에 정보가 흘러듭니다."
 STALKER_expel_foreign_agents_tt: "[FROM.GetName]에서 외국 정보 침투가 최대 §G40§! 줄어듭니다. 구역 연구 접근권을 가진 모든 나라가 우리를 덜 좋게 봅니다."
 STALKER.140.t: "구역 속 외국 요원"
 STALKER.140.d: "우리 방첩 요원들이 [STALKER_zone_name]의 외국 세력 침투 현황을 파악했습니다. 그곳의 과학자와 계약자, 기자의 절반은 다른 누군가에게 보고하고 있습니다."
 STALKER.140.a: "조용히 조직망을 일망타진하라."
 STALKER.140.a_tt: "정치력 §R25§!이(가) 듭니다. 구역에서 외국 정보 침투가 최대 §G25§! 줄어듭니다."
 STALKER.140.b: "지켜보게 두자. 우리도 그들을 지켜본다."
 STALKER.140.b_tt: "외국 정보 침투가 계속 정부 내 MDST 조직망에 정보를 흘려 넣습니다."
 STALKER_expelled_our_agents: "구역에서 우리 요원을 추방함"
 STALKER_hire_mercenaries: "[FROM.GetName]에서 용병 고용"
 STALKER_hire_mercenaries_desc: "이미 외국 기관을 위해 일하는 계약자들을 우리 급여 명단에 올립니다. 이들은 원래 구역에 남으며, 먼저 고용했던 기관들도 떠나지 않습니다."
 STALKER_hire_mercenaries_tt: "용병 영향력이 §Y10§! 오르고 외국 정보 침투가 §Y5§! 늘어납니다."
 STALKER_expel_mercenaries: "[FROM.GetName]에서 용병 추방"
 STALKER_expel_mercenaries_desc: "계약자들에게 원래 구역에서 나가라고 명령합니다. 외국 세력이 남아 있으면 다른 고객이 같은 일을 맡길 것입니다."
 STALKER_expel_mercenaries_tt: "용병 영향력이 최대 §G25§! 줄어듭니다."
 STALKER.141.t: "구역 속 용병"
 STALKER.141.d: "외국 기관을 위해 일하는 계약자들이 [STALKER_zone_name] 일대에서 공공연히 활동하고 있습니다. 이들은 우리 계약을 맡거나, 다른 누군가의 계약을 맡을 것입니다."
 STALKER.141.a: "이들을 코돈 경비로 고용하라."
 STALKER.141.a_tt: "정치력이 §R25§! 듭니다. 용병 영향력이 §Y8§! 오르고 군 영향력이 최대 §R3§! 내려갑니다."
 STALKER.141.b: "내보내라."
 STALKER.141.b_tt: "용병 영향력이 최대 §G15§! 내려갑니다."
 STALKER_belarus_border_seizure: "벨라루스 국경에서 구역 아티팩트 차단"
 STALKER_belarus_border_seizure_desc: "국경을 넘는 화물을 뒤져 체르노빌 구역에서 밀반출된 아티팩트를 찾아냅니다."
 STALKER_belarus_border_seizure_tt: "밀수 풀에서 아티팩트 §Y5§!개를 우리 비축분으로 옮깁니다."
 STALKER_reinforce_polesie_reserve: "폴레시예 보호구역 증강"
 STALKER_reinforce_polesie_reserve_desc: "벨라루스 쪽 출입 통제 구역은 폴레시예 국립 방사생태 보호구역을 가로지릅니다. 울타리와 순찰, 검문소는 비용을 계속 대지 않으면 서서히 낡아 갑니다.\n\n폴레시예 보안: §Y[?ROOT.STALKER_polesie_security|0]§!"
 STALKER_reinforce_polesie_reserve_tt: "GDP의 §Y0.2%§!가 듭니다. 폴레시예 보안이 §G20§! 오릅니다. 매달 §Y1§!씩 떨어지며, §Y30§! 아래로 내려가면 스토커와 밀수꾼이 벨라루스로 넘어오기 시작합니다."
 STALKER_kgb_smuggling_investigation: "KGB 밀수 수사 지시"
 STALKER_kgb_smuggling_investigation_desc: "구역을 빠져나간 아티팩트는 서쪽으로 가는 길에 고멜을 거칩니다. 우리 국가보안위원회가 자금 흐름을 추적할 수 있습니다.\n\n폴레시예 보안: §Y[?ROOT.STALKER_polesie_security|0]§!"
 STALKER_kgb_smuggling_investigation_available_tt: "유통 중인 밀수 아티팩트가 최소 §Y3§!개 있어야 합니다(현재 §Y[?global.STALKER_smuggled_artifacts|1]§!개)."
 STALKER_kgb_smuggling_investigation_tt: "수사 결과 밀수 조직을 와해시킬 수도, 단서가 끊길 수도, 밀수꾼에게 돈을 받은 관리가 드러날 수도 있습니다. 폴레시예 보안이 높을수록 성공 확률이 올라갑니다."
 STALKER_propose_joint_zone_commission: "구역 공동위원회 제안"
 STALKER_propose_joint_zone_commission_desc: "구역은 국경에서 멈추지 않습니다. 체르노빌 구역을 장악한 정부에 통제구역을 우리와 공동으로 운영하자고 제안합니다."
 STALKER_propose_joint_zone_commission_tt: "체르노빌 구역을 장악한 정부가 결정합니다. 수락하면 체르노빌 구역의 §Y봉쇄도§!가 §G10§! 오르고, 폴레시예 보안이 §G10§! 오르며, 우리 과학자들이 구역 연구에 접근할 수 있게 됩니다. 거절하면 §Y365일§! 동안 다시 제안할 수 없습니다."
 STALKER.60.t: "프리퍄티강을 건너온 스토커들"
 STALKER.60.d: "폴레시예 보호구역의 국경 경비대가 끊어진 울타리와 북쪽으로 이어진 새 발자국을 발견했습니다. 스토커 무리와 그들에게서 물건을 사들이는 밀수꾼들이 벨라루스의 늪지 오솔길로 아티팩트를 빼내고 있습니다."
 STALKER.60.a: "폴레시예 경계선을 강화하라."
 STALKER.60.a_tt: "이번 월경으로 아티팩트 §R3§!개가 이미 암시장에 풀렸고, 체르노빌 구역의 §Y밴디트§! 영향력이 §R5§! 올랐습니다. 폴레시예 보안이 §G10§! 오릅니다."
 STALKER.60.b: "늪지를 다 막을 수는 없다."
 STALKER.60.b_tt: "월경은 계속됩니다. 아티팩트 §Y3§!개가 이미 암시장에 흘러들었고, 체르노빌 구역의 §Y밴디트§! 영향력이 §R5§! 올랐습니다."
 STALKER.61.t: "밀수 조직 와해"
 STALKER.61.d: "KGB 요원들이 고멜을 거쳐 구역의 아티팩트를 빼돌리던 운반책, 세관원, 중개상 조직을 체포했습니다. 압수품은 현재 국가 연구소에 있습니다."
 STALKER.61.a: "시도하려는 자들에게 본보기가 될 것이다."
 STALKER.61.a_tt: "밀수 아티팩트가 최대 §G10§!개 유통에서 사라집니다. 우리 비축분에 아티팩트 §G5§!개가 들어오고, 체르노빌 구역의 §Y밴디트§! 영향력이 최대 §G10§! 내려갑니다."
 STALKER.62.t: "밀수꾼에게 돈을 받은 관리들"
 STALKER.62.d: "수사는 우리 쪽으로 되돌아왔습니다. 국경과 보호구역의 관리 여러 명이 돈을 받고 아티팩트 화물을 통과시켜 왔습니다."
 STALKER.62.a: "전부 숙청하라."
 STALKER.62.a_tt: "폴레시예 보안이 §G15§! 오르고, 밀수 아티팩트가 최대 §G5§!개 유통에서 사라집니다."
 STALKER.62.b: "조용히 한몫 챙긴다."
 STALKER.62.b_tt: "국고에 §G$0.5§!십억이 들어옵니다. 폴레시예 보안이 §R10§! 떨어지고, 밀수 아티팩트 §R5§!개가 더 암시장으로 흘러듭니다."
 STALKER.63.t: "민스크의 구역 공동위원회 제안"
 STALKER.63.d: "[?global.STALKER_commission_proposer.GetName]이(가) 국경 양쪽에서 순찰과 자료, 경계선 유지 비용을 나누며 통제구역을 공동으로 운영하자고 제안했습니다."
 STALKER.63.a: "위원회를 받아들인다."
 STALKER.63.a_tt: "체르노빌 구역의 §Y봉쇄도§!가 §G10§! 오르고 §Y밴디트§! 영향력이 최대 §G5§! 내려갑니다. [?global.STALKER_commission_proposer.GetName]이(가) 구역 연구에 접근할 수 있게 되며 우리를 더 좋게 봅니다."
 STALKER.63.b: "구역은 우리가 관리한다."
 STALKER.63.b_tt: "[?global.STALKER_commission_proposer.GetName]이(가) 우리를 나쁘게 보게 되며 §Y365일§! 동안 다시 제안할 수 없습니다."
 STALKER.64.t: "끊긴 단서"
 STALKER.64.d: "밀수꾼들은 우리 요원이 들이닥치기 전에 소식을 들었습니다. 운반책들은 사라졌고, 아티팩트도 함께 사라졌습니다."
 STALKER.64.a: "다음에는 반드시 찾아낸다."
 STALKER.65.t: "구역 공동위원회 합의"
 STALKER.65.d: "체르노빌 구역을 장악한 정부가 우리 제안을 받아들였습니다. 양국 요원이 통제구역을 함께 순찰하게 되었고, 우리 과학자들에게도 접근 권한이 주어졌습니다."
 STALKER.65.a: "좋은 이웃은 울타리를 나눈다."
 STALKER.66.t: "위원회 거부"
 STALKER.66.d: "구역 공동위원회 제안이 거절당했습니다. 우리 쪽 경계선은 계속 우리만의 숙제로 남습니다."
 STALKER.66.a: "그럼 우리 쪽은 우리가 지킨다."
 STALKER_reinforce_polesie_reserve_available_tt: "폴레시예 보안이 §Y90§! 미만이어야 합니다(현재 §Y[?ROOT.STALKER_polesie_security|0]§!)."
 STALKER_belarus_border_seizure_available_tt: "유통 중인 밀수 아티팩트가 최소 §Y5§!개 있어야 합니다(현재 §Y[?global.STALKER_smuggled_artifacts|1]§!개)."
 STALKER.110.t: "번지는 구역"
 STALKER.110.d: "[STALKER_zone_name] 일대의 이상 현상이 인접 지역으로 넘어왔습니다. 우물이 오염되고 나침반이 제멋대로 돌며, 이런 일을 전혀 예상하지 못했던 마을들에서 첫 방출 경보가 울리고 있습니다."
 STALKER.110.t_drift: "이동하는 구역"
 STALKER.110.d_drift: "[STALKER_zone_name] 일대의 이상 현상이 이동했습니다. 인접 지역 한 곳은 정상으로 돌아오고 있지만, 다른 한 곳으로 넘어가 우물이 오염되고 첫 방출 경보가 울리고 있습니다."
 STALKER.110.a: "피해 마을을 대피시켜라."
 STALKER.110.a_tt: "GDP의 §Y0.4%§!가 듭니다. 해당 지역이 §Y180일§! 동안 §Y대피§! 상태가 됩니다."
 STALKER.110.b: "주민들은 집에 남는다."
 STALKER.111.t: "물러나는 구역"
 STALKER.111.d: "[STALKER_zone_name] 일대의 봉쇄 작업이 효과를 내고 있습니다. 인접 지역의 이상 수치가 정상으로 돌아왔고, 그곳의 통제선도 해제되었습니다."
 STALKER.111.a: "지킬 지역이 하나 줄었다."
 STALKER_zone_evacuated: "구역 대피"
 STALKER_zone_evacuated_desc: "이상 구역이 닿은 마을의 주민들을 이주시켰습니다."
 STALKER.41.t: "황야 속 실종"
 STALKER.41.d: "외딴 [STALKER_zone_name] 구역 안에서 조사팀이 사라졌고, 가장 가까운 활주로도 수백 킬로미터 밖에 있습니다. 마지막 무선 교신에서 이들은 지도와 더는 맞지 않는 지형을 묘사했습니다."
 STALKER.41.a: "구조대를 보낸다."
 STALKER.41.a_tt: "정치력이 §R25§! 듭니다. 구조대가 새 경로를 개척하면서 구역 §Y개발도§!가 §G5§! 오릅니다."
 STALKER.41.b: "포기한다."
 STALKER.41.b_tt: "§Y스토커§! 인구가 최대 §Y5§! 줄어듭니다."
 STALKER.42.t: "대피 위기"
 STALKER.42.d: "[STALKER_zone_name]의 새 경계선 안에는 아직 수만 명이 살고 있으며, 많은 이가 대대로 지켜 온 집을 떠나길 거부합니다. 지방 관리들은 군이 강제로 이주시킬 것인지 알고 싶어 합니다."
 STALKER.42.a: "강제로 대피시켜라."
 STALKER.42.a_tt: "구역 §Y봉쇄도§!가 §G10§! 오르고 안정도가 §R2%§! 떨어집니다."
 STALKER.42.b: "남게 두자."
 STALKER.42.b_tt: "§Y스토커§! 인구가 §Y10§! 늘고 §Y밴디트§! 영향력이 §R5§! 오릅니다."
 STALKER.43.t: "강의 밀수로"
 STALKER.43.d: "밀수꾼들이 밤마다 카누와 바지선에 아티팩트를 싣고 강을 따라 [STALKER_zone_name] 밖으로 빼내고 있습니다. 우리 순찰대는 이를 평범한 선박과 구분하지 못하고, 이 거래로 지역 갱단이 부를 쌓고 있습니다."
 STALKER.43.a: "강을 순찰하라."
 STALKER.43.a_tt: "소액의 비용이 듭니다. 구역 §Y밴디트§! 영향력이 최대 §G15§! 내려갑니다."
 STALKER.43.b: "조용히 통행세를 거둔다."
 STALKER.43.b_tt: "국가 비축분에 아티팩트 §G3§!개가 추가됩니다. 구역 §Y밴디트§! 영향력이 §R5§! 오릅니다."
 STALKER.44.t: "옆집의 연구소"
 STALKER.44.d: "[STALKER_zone_name] 구역이 민감한 국가 시설의 울타리 바로 앞까지 땅을 삼켰습니다. 시설 과학자들은 이상 현상에 접근하게 해 달라 요청하고, 보안 책임자들은 부지를 봉쇄하길 원합니다."
 STALKER.44.a: "기밀 연구 계획을 시작한다."
 STALKER.44.a_tt: "구역 §Y개발도§!가 §G10§! 올라 구역 연구가 늘어납니다."
 STALKER.44.b: "시설을 봉쇄한다."
 STALKER.44.b_tt: "구역 §Y봉쇄도§!가 §G10§! 오릅니다."
 STALKER.45.t: "해안 단지의 이상 맥동"
 STALKER.45.d: "[STALKER_zone_name]의 핵심 해안 원자로 인근에서 강력한 중력 및 전자기 이상이 나타났습니다. 나침반이 고장 나 인근 항로의 해상 교통이 마비되었고, 기술자들은 특수 봉쇄 단열재를 요청하고 있습니다."
 STALKER.45.a: "해상 차단선을 구축하고 전력망을 보강하라."
 STALKER.45.a_tt: "정치력이 §R25§! 들고 GDP의 §R0.2%§!가 듭니다. 구역 §Y봉쇄도§!가 §G15§! 오르고 §Y활동도§!가 §G5§! 내려갑니다."
 STALKER.45.b: "이상 방사선을 원자력 연구에 활용하라."
 STALKER.45.b_tt: "구역 §Y개발도§!가 §G10§! 오르고 §Y활동도§!가 §R5§! 오르며 §Y봉쇄도§!가 §R10§! 내려갑니다. 국가 아티팩트 비축분에 이상 표본 §G1§!개가 추가됩니다."
 STALKER.46.t: "녹아내리는 심층 구역"
 STALKER.46.d: "[STALKER_zone_name]의 지하 깊은 곳에서 일어난 이상 현상이 영구동토층을 갈라놓았습니다. 외진 툰드라 골짜기에 지열 분출구와 결정질 아티팩트 군집이 드러나고 있지만, 겨울철 보급로는 열변형을 견디지 못하고 무너지고 있습니다."
 STALKER.46.a: "대형 쇄빙선과 공병 수송대를 파견하라."
 STALKER.46.a_tt: "정치력이 §R25§! 들고 GDP의 §R0.2%§!가 듭니다. 구역 §Y봉쇄도§!가 §G10§! 오르고, 원래 구역에서만 §Y듀티§! 영향력이 §G5§! 오르며, 돌연변이 개체수가 최대 §G10§! 줄어듭니다."
 STALKER.46.b: "독립 탐사꾼 원정대를 지원하라."
 STALKER.46.b_tt: "정치력이 §R15§! 듭니다. §Y스토커§! 인구가 §Y10§! 늘고 구역 §Y개발도§!가 §G10§! 오르며 §Y봉쇄도§!가 §R5§! 내려갑니다. 국가 아티팩트 비축분에 이상 표본 §G2§!개가 추가됩니다."
 STALKER.47.t: "교외의 암시장 아티팩트"
 STALKER.47.d: "[STALKER_zone_name] 주변의 인구 밀집 외곽에서 이상 아티팩트가 도시 벼룩시장에서 공공연히 거래되고 있습니다. 부유한 수집가와 대학 연구자들이 목록에 오르지 않은 이상 물체를 두고 지역 길거리 갱단과 경쟁하고 있습니다."
 STALKER.47.a: "무장 국내 경찰 소탕 작전을 개시하라."
 STALKER.47.a_tt: "정치력이 §R30§! 들고 안정도가 §R1%§! 떨어집니다. 구역 §Y밴디트§! 영향력이 최대 §G15§! 내려가고, §Y봉쇄도§!가 §G10§! 오르며, §Y스토커§! 인구가 최대 §R5§! 줄어듭니다."
 STALKER.47.b: "국가 감독 감정소를 설치하라."
 STALKER.47.b_tt: "GDP의 §R0.2%§!가 듭니다. 구역 §Y개발도§!가 §G10§! 오르고, §Y스토커§! 인구가 §G5§! 늘며, 원래 구역에서만 §Y프리덤§! 영향력이 §G5§! 오릅니다. 국가 아티팩트 비축분에 이상 표본 §G2§!개가 추가됩니다."
 STALKER.48.t: "속삭이는 숲 지붕"
 STALKER.48.d: "[STALKER_zone_name]의 울창한 정글 지대에서 이상 식물과 곰팡이 포자가 국경 강변 검문소를 뒤덮었습니다. 탐사 정찰병들은 비정상적인 생물 발광과 수관 사이에서 계속 바뀌는 길을 보고했습니다."
 STALKER.48.a: "경계선 둘레에 넓은 방화 완충대를 조성하라."
 STALKER.48.a_tt: "정치력이 §R20§! 들고 GDP의 §R0.1%§!가 듭니다. 구역 §Y봉쇄도§!가 §G10§! 오르고, 돌연변이 개체수가 최대 §G10§! 줄어들며, §Y활동도§!가 §G5§! 내려갑니다."
 STALKER.48.b: "번식체에서 생물 표본을 채취하라."
 STALKER.48.b_tt: "구역 §Y개발도§!가 §G15§! 오르고 §Y봉쇄도§!가 §R5§! 내려가며, 돌연변이 개체수가 최대 §R5§! 늘어납니다. 국가 아티팩트 비축분에 이상 표본 §G1§!개가 추가됩니다."