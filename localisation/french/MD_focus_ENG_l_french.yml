 ENG_apollo_programme: "Programme APOLLO"
 ENG_apollo_programme_desc: "Le programme APOLLO est le projet de modernisation à long terme du ministère de la Défense britannique pour les forces britanniques à Chypre. Il prévoit le remplacement du terminal passagers et fret des années 1960 de la base aérienne d'Akrotiri, la construction de centaines de nouveaux logements pour les familles des militaires et l'ajout d'écoles et d'infrastructures médicales dans les zones de souveraineté britannique, afin de maintenir la base opérationnelle comme principal point d'appui du Royaume-Uni pour la Méditerranée orientale et le Moyen-Orient."
