 join_antarctica_treaty_tt: "Después de un mes:"
 leave_antarctica_treaty_tt: "Después de 2 años:"
 leave_antarctica_cannot_be_stopped_tt: "§REsta acción no se puede detener.§!"
 leave_antarctica_treaty_warning_tt: "§RWARNING:§!\nLeaving the §CAntarctic Treaty§! while having a §YResearch Station§! in §CAntarctica§! will cause global response from the Treaty members, including potential sanctions and diplomatic backlash. It is recommended to dismantle any research stations in §CAntarctica§! before leaving the treaty to avoid negative consequences.\n\nYet, if you choose to leave the Treaty while having one, no article will stop you from starting prohibited activities in §CAntarctica§!, such as resource exploitation or military presence, which may lead to severe consequences for the global reputation of your nation.\n\nThe §YPost-Treaty Antarctic Activities§! decisions unlock only when the withdrawal completes after §Y2 years§!, and only if a §YResearch Station§! remains at that time."
 antarctica_post_treaty_activity_category: "Actividades antárticas post-Tratado"
 antarctica_post_treaty_activity_category_desc: "Estas acciones son visibles porque abandonamos el Tratado Antártico mientras aún mantenemos una estación en la Antártida."
 antarctica_post_treaty_resource_extraction: "Explotar los recursos antárticos"
 antarctica_post_treaty_resource_extraction_desc: "Podemos utilizar la infraestructura restante de la estación para extraer recursos de la Antártida. Esto aumenta los ingresos, pero provoca una reacción diplomática negativa por parte de los miembros del Tratado."
 antarctica_post_treaty_military_preparations: "Preparar la infraestructura militar"
 antarctica_post_treaty_military_preparations_desc: "Reutilizar las instalaciones de la estación con fines de planificación y logística militares. Esto aporta ventajas militares, pero se considera una grave provocación."
