 azeev.1.t: "Posible escalada"
 azeev.1.d: "In recent weeks tension has been building up and now we can escalate situation further, but does it benefit us?"
 azeev.1.a: "¡Escalar!"
 azeev.1.b: "Pensándolo mejor..."
 azeev.2.t: "Azerbaiyán solicita ayuda"
 azeev.2.d: "Con la reciente tensión en aumento entre Azerbaiyán e Irán, este último busca nuestra ayuda."
 azeev.2.a: "No hay ayuda para los malvados."
 azeev.2.b: "Let's make a commitment."
 azeev.2.c: "Tienen nuestro total apoyo."
 azeev.3.t: "Visita de Estado"
 azeev.3.d: "Tiene sentido realizar una visita oficial a alguna gran potencia extranjera para solidificar nuestra posición. Pero, ¿a dónde deberíamos ir?"
 azeev.3.a: "A Turquía."
 azeev.3.b: "A Rusia."
 azeev.3.c: "A Irán, a pesar de las tensiones recientes."
 azeev.4.t: "Cumbre del petróleo de Azerbaiyán"
 azeev.4.d: "Azerbaiyán celebra una importante cumbre petrolera y económica, nuestros diplomáticos fueron abordados y se les propusieron algunos proyectos de inversión. ¿Deberíamos invertir?"
 azeev.4.a: "Absolutamente."
 azeev.4.b: "No es el momento adecuado."
 azeev.5.t: "Primera llamada"
 azeev.5.d: "With our position still shaky, we need to improve relations with foreign powers before they make their move. What will be the very first call of our chairman?"
 azeev.5.a: "A Turquía."
 azeev.5.b: "A Rusia."
 azeev.5.c: "A Irán."
 azeev.5.e: "A China."
 azeev.6.t: "Azerbaiyán pide ayuda"
 azeev.6.d: "Azerbaijan had been rearming itself for quite some time now, but in their possible conflict they still need more arms, and they had reached out to us. Should we help?"
 azeev.6.a: "Let's do this."
 azeev.6.b: "¿Están locos?"
 azeev.7.t: "Rusia acepta"
 azeev.7.d: "Como esperábamos, Rusia aceptó compartir armas con nosotros."
 azeev.7.a: "¡Espléndido!"
 azeev.8.t: "Rusia se niega"
 azeev.8.d: "A pesar de todos nuestros esfuerzos, nuestras negociaciones han fracasado y no recibiremos ninguna arma de Rusia."
 azeev.8.a: "Maldición"
 azeev.9.t: "Muerte de Heydar Aliev"
 azeev.9.d: "Anoche, nuestro líder falleció. Dirigió nuestro país durante casi diez años y ahora su legado tendrá que superar la prueba del tiempo."
 azeev.9.a: "Incluso las leyendas mueren."
 azeev.10.t: "Possible Junta?"
 azeev.10.d: "Nuestra agencia interna nos ha informado sobre un posible golpe militar. Generales han estado tramando en las sombras durante bastante tiempo. Al mismo tiempo, las pruebas parecen ser escasas en el mejor de los casos..."
 azeev.10.a: "¿Podría ser verdad?"
 azeev.11.t: "¡Golpe militar!"
 azeev.11.d: "A few generals of the Armed Forces have taken matters into their own hands and arrested [Root.GetLeader]. The future of our country is now at question, but newly established power assures of stability and peace."
 azeev.11.a: "¿Cómo pudieron hacerlo?"
 azeev.16.t: "Turquía acepta"
 azeev.16.d: "Turquía aceptó proporcionarnos equipo para un posible enfrentamiento con Irán."
 azeev.16.a: "Muy bien."
 azeev.17.t: "Turquía se niega"
 azeev.17.d: "Turquía no aceptó brindarnos ayuda en un posible conflicto con Irán."
 azeev.17.a: "Necios."
 azeev.18.t: "Popularidad del culto a Aliev ha cambiado"
 azeev.18.d: "Nuestras encuestas recientes indican que la percepción de Aliev y su legado ha cambiado en la población en general."
 azeev.18.a: "Let's see."
 aze_news.1.t: "¡[AZE.GetLeader] derrocado!"
 aze_news.1.d: "A few generals of the Armed Forces have taken matters into their own hands and arrested [AZE.GetLeader]. With small fights between loyalists and military forces on the streets the situation still looks grim, and the future of Azerbaijan is uncertain."
 aze_news.1.a: "Espera, ¿qué?"
 aze_news.1.b: "Buen desarrollo."
 azeev.15.t: "Era de Aliev"
 azeev.15.d: "Azerbaiyán, afectado por las pérdidas sufridas en la guerra de Karabaj, ha logrado, gracias a los esfuerzos del ex líder del partido soviético Heydar Aliyev, resistir políticamente a las pérdidas territoriales sufridas. Aliyev intenta construir un sistema hereditario, intentando maniobrar entre diversos factores internos y externos. Una diplomacia flexible entre Occidente y Oriente puede hacer una importante contribución al éxito futuro de Azerbaiyán. Sin embargo, el pueblo desanimado exige paz y democracia, no quiere más muertes, los nacionalistas exigen una guerra total con Armenia e Irán, y las fuerzas prorrusas exigen que se mantenga el status quo. Azerbaiyán, que posee importantes recursos petrolíferos, pero una infraestructura y una industria subdesarrolladas, puede convertirse en una potencia regional si no cae en un caos económico y político, provocado tanto desde fuera como desde dentro."
 azeev.15.a: "¡Sí!"
 azeev.13.t: "Ejército azerbaiyano"
 azeev.13.d: "El ejército azerbaiyano, que sufrió un colapso absoluto después de la derrota en la guerra de Artsaj, pero patrocinado por diversos grupos y países internacionales, está comenzando su recuperación gradual. Generales desleales, ideólogos nacionalistas y señores de la guerra son parásitos del ejército azerbaiyano. Es hora de cambiar todo eso."
 azeev.13.a: "Sin duda."
 azeev.14.t: "Economía azerbaiyana"
 azeev.14.d: "La economía azerbaiyana postsoviética después de los años 90 se encuentra en el declive más profundo. La antigua gran industria petrolera y agrícola apenas respira, permitiendo que Azerbaiyán exista de alguna manera. Sin embargo, los inversores extranjeros y un número significativo de recursos azerbaiyanos hacen posible que Azerbaiyán se convierta en un país económicamente desarrollado en el futuro."
 azeev.14.a: "¡Aquí viene el dinero!"
