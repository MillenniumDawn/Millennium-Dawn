 israel.82.t: "Aproximando-se da Igreja da Natividade"
 israel.82.d: "Militantes se refugiaram dentro da Igreja da Natividade e estão realizando ataques de dentro. Nossas forças estão em posição. Como devemos proceder?"
 israel.82.a: "Invadir o prédio e limpá-lo."
 israel.82.b: "Negociar uma saída pacífica para os que estão lá dentro."
 israel.82.c: "Respeitar a santidade da igreja."
 israel.83.t: "Invasão bem-sucedida!"
 israel.83.d: "As forças de [ROOT.GetNameWithFlag] romperam a Igreja da Natividade e a limparam de militantes, matando mais de 50 combatentes armados que haviam se refugiado ali."
 israel.83.a: "Ótimo!"
 israel.84.t: "Invasão fracassada!"
 israel.84.d: "As forças de [ROOT.GetNameWithFlag] caíram em uma emboscada durante a tentativa de invasão. Todos os militantes escaparam da Igreja da Natividade em meio ao caos."
 israel.84.a: "Uma perda dolorosa."
 storm_res_tt: "Receberemos §Yeventos§! em §Y25 dias§! com os §Yresultados da operação de invasão§!. Ela pode §Rfalhar§! ou ser §Rbem-sucedida!§!\n\nEsta opção é muito mais arriscada, mas dá resultados maiores se for bem-sucedida!"
