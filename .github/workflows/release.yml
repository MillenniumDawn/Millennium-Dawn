name: Create Release

on:
  push:
    tags: [ 'v*' ]

permissions:
  contents: read

jobs:
  create-release:
    name: Create Release
    runs-on: ubuntu-latest

    permissions:
      contents: write
      issues: write

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 1

      - name: Create Release
        uses: softprops/action-gh-release@153bb8e04406b158c6c84fc1615b65b24149a1fe # v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true

      - name: Close matching milestone
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          TAG_NAME: ${{ github.ref_name }}
        with:
          script: |
            const tag = process.env.TAG_NAME;
            const version = tag.replace(/^v/, '');

            const milestones = await github.rest.issues.listMilestones({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
            });

            const milestone = milestones.data.find(m => m.title === version || m.title === tag);

            if (!milestone) {
              console.log(`No open milestone matching "${version}" or "${tag}" found`);
              return;
            }

            await github.rest.issues.updateMilestone({
              owner: context.repo.owner,
              repo: context.repo.repo,
              milestone_number: milestone.number,
              state: 'closed',
            });

            console.log(`Closed milestone "${milestone.title}"`);

  build-docs:
    name: Build Docs Site
    runs-on: ubuntu-latest
    needs: create-release

    permissions:
      contents: read
      pages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 1

      - name: Generate changelog markdown
        run: python3 tools/changelog/format_changelog.py

      - name: Publish version-specific changelog page
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: python3 tools/changelog/publish_changelog_page.py --tag "$TAG_NAME"

      - name: Setup Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6

      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6
        with:
          node-version: "24"

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.11"

      - name: Install docs dependencies
        working-directory: ./docs
        run: bun install

      - name: Build docs site
        working-directory: ./docs
        run: bun run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: ./docs/dist

  deploy-docs:
    name: Deploy Docs Site
    runs-on: ubuntu-latest
    needs: build-docs

    # Share the concurrency group with github-pages.yml so a tag release
    # and a docs push never race for the single active Pages deployment.
    concurrency:
      group: "pages"
      cancel-in-progress: false

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    permissions:
      id-token: write
      pages: write

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
