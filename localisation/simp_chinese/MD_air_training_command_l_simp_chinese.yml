 MD_atc_ex_training_tt: "§YAir Operations Readiness Exercise§!\n\n£air_experience Air Experience: §R-325§!\n£command_power Command Power: §R-75§!\nGains National Spirit §YAir Operations Readiness Exercise§! for §H90§! days:\n £fuel_consumption_texticon  Air Fuel Consumption: §R+25%§!\n £experience_neutral_texticon  Air Wing Mission Experience Gain: §G+5%§!\n£doctrine_mastery §HTraining and Operations§! Mastery: [MD_atc_exercise_mastery_tt_text] per day for §H90§! days\n\nRequires an air grand doctrine and at least §H50§! deployed aircraft, including at least one Scout Plane."
 MD_atc_ex_design_tt: "§YFlight Test and Evaluation§!\n\n£air_experience Air Experience: §R-325§!\n£command_power Command Power: §R-75§!\nGains National Spirit §YFlight Test and Evaluation§! for §H90§! days:\n £fuel_consumption_texticon  Air Fuel Consumption: §R+25%§!\n £air_accidents_texticon  Air Accidents Chance: §G-5%§!\n£doctrine_mastery §HAircraft Design§! Mastery: [MD_atc_exercise_mastery_tt_text] per day for §H90§! days\n\nRequires an air grand doctrine and at least §H50§! deployed aircraft."
 MD_atc_ex_heavy_tt: "§YStrategic Airlift and Bomber Exercise§!\n\n£air_experience Air Experience: §R-325§!\n£command_power Command Power: §R-75§!\nGains National Spirit §YStrategic Airlift and Bomber Exercise§! for §H90§! days:\n £fuel_consumption_texticon  Air Fuel Consumption: §R+25%§!\n £air_range_texticon  Air Range: §G+3%§!\n£doctrine_mastery §HHeavy Aircraft§! Mastery: [MD_atc_exercise_mastery_tt_text] per day for §H90§! days\n\nRequires the §YStrategic Destruction§! or §YIntegrated Air Warfare§! grand doctrine and at least §H50§! deployed aircraft, including at least one Strategic Bomber."
 MD_atc_ex_multirole_tt: "§YMultirole Strike Fighter Exercise§!\n\n£air_experience Air Experience: §R-325§!\n£command_power Command Power: §R-75§!\nGains National Spirit §YMultirole Strike Fighter Exercise§! for §H90§! days:\n £fuel_consumption_texticon  Air Fuel Consumption: §R+25%§!\n £air_escort_efficiency_texticon  Escort Efficiency: §G+3%§!\n£doctrine_mastery §HMultirole Aircraft§! Mastery: [MD_atc_exercise_mastery_tt_text] per day for §H90§! days\n\nRequires the §YLocal Airspace Defense§!, §YBattlefield Support§!, §YAir Supremacy§!, §YAutonomous Air Operations§! or §YMixed Role§! grand doctrine and at least §H50§! deployed aircraft, including at least one Fighter."
 MD_atc_ex_strike_tt: "§YClose Air Support Exercise§!\n\n£air_experience Air Experience: §R-325§!\n£command_power Command Power: §R-75§!\nGains National Spirit §YClose Air Support Exercise§! for §H90§! days:\n £fuel_consumption_texticon  Air Fuel Consumption: §R+25%§!\n £cas_efficiency_texticon  Air Support Mission Efficiency: §G+3%§!\n£doctrine_mastery §HStrike Aircraft§! Mastery: [MD_atc_exercise_mastery_tt_text] per day for §H90§! days\n\nRequires the §YLocal Airspace Defense§!, §YStrategic Destruction§!, §YBattlefield Support§!, §YAutonomous Air Operations§! or §YIntegrated Air Warfare§! grand doctrine and at least §H50§! deployed aircraft, including at least one Close Air Support Aircraft, Tactical Bomber, Naval Bomber or Strategic Bomber."
 MD_atc_ex_fighter_tt: "§YAir Combat Exercise§!\n\n£air_experience Air Experience: §R-325§!\n£command_power Command Power: §R-75§!\nGains National Spirit §YAir Combat Exercise§! for §H90§! days:\n £fuel_consumption_texticon  Air Fuel Consumption: §R+25%§!\n £air_superiority_efficiency_texticon  Air Superiority Mission Efficiency: §G+3%§!\n£doctrine_mastery §HFighter Aircraft§! Mastery: [MD_atc_exercise_mastery_tt_text] per day for §H90§! days\n\nRequires the §YLocal Airspace Defense§!, §YStrategic Destruction§!, §YBattlefield Support§!, §YAir Supremacy§!, §YMixed Role§! or §YIntegrated Air Warfare§! grand doctrine and at least §H50§! deployed aircraft, including at least one Fighter or Interceptor."
 MD_atc_ex_drone_tt: "§YUnmanned Systems Exercise§!\n\n£air_experience Air Experience: §R-325§!\n£command_power Command Power: §R-75§!\nGains National Spirit §YUnmanned Systems Exercise§! for §H90§! days:\n £fuel_consumption_texticon  Air Fuel Consumption: §R+25%§!\n £dive_bombing_texticon  Ground Bombing Targeting: §G+3%§!\n£doctrine_mastery §HDrone Warfare§! Mastery: [MD_atc_exercise_mastery_tt_text] per day for §H90§! days\n\nRequires the §YAutonomous Air Operations§! grand doctrine and at least §H50§! deployed aircraft."
