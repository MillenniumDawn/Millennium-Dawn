 TUR_pkk_disruption_tt: "£TUR_Neutral_Communism  - The PKK may disrupt our ability to carry out our activities here!"
 TUR_turkstream_tt: "We will be able to §Hdisrupt access§! to the §HTurkStream§! pipeline!\n - This will weaken [SOV.GetFlag] §HRussian§! gas supply\n £decision_icon_small - This will be unlocked under the §HTurkish Politics§! decision tab when at war with [SOV.GetFlag] §HRussia§!"
