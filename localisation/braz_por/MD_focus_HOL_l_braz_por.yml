 voc_influence_srilanka:0 "£voc_icon Influência da VOC em §Y[SRI.GetNameWithFlag]§!"
 voc_influence_saf:0 "£voc_icon Influência da VOC em §Y[SAF.GetNameWithFlag]§!"
 HOL_cape_port_investment:0 "Investimentos Portuários Holandeses"
 HOL_cape_port_investment_tt:0 "Se §Y[HOL.GetNameWithFlag]§! §Rdeclarar guerra§! a §Y[SAF.GetNameWithFlag]§!, esta província será imediatamente controlada por §Y[HOL.GetNameWithFlag]§!"
 HOL_java_strength:0 "£voc_icon Força da VOC em §Y[631.GetName]§! §Y[IND.GetNameWithFlag]§!"
 HOL_increase_voc_java_strength_effect_tt:0 "£voc_icon Força da VOC em §Y[631.GetName]§! §Y[IND.GetNameWithFlag]§!: Aumento de [?HOL_java_strength_change|+]"
 HOL_java_detection_chance:0 "Chance de Detecção da VOC em §Y[631.GetName]§! §Y[IND.GetNameWithFlag]§!"
 HOL_java_detection_chance_effect_tt:0 "Chance de Detecção da VOC em §Y[631.GetName]§! §Y[IND.GetNameWithFlag]§!: Aumento de [?HOL_java_detection_chance_change|%-]"
 HOL_sumatra_detection_chance:0 "Chance de Detecção da VOC na §YIlha de Sumatra§! §Y[IND.GetNameWithFlag]§!"
 HOL_sumatra_detection_chance_effect_tt:0 "Chance de Detecção da VOC na §YIlha de Sumatra§! §Y[IND.GetNameWithFlag]§!: Aumento de [?HOL_sumatra_detection_chance_change|%-]"
