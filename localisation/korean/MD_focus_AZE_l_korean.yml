l_korean:
 azerbaijan_focus_historical_early: "아제르바이잔 중점계통도"
 AZE_aze_the_state: "국가"
 AZE_aze_the_state_desc: "Azerbaijan is a young state and its matters are not always as mature as one might think, but they still need to be solved."
 AZE_aze_the_man: "그 사람"
 AZE_aze_the_man_desc: "알리예프는 우리 국가의 아버지이며, 우리는 언론에서 이를 제대로 나타내야 합니다."
 AZE_aze_pers_cult: "알리예프 숭배"
 AZE_aze_pers_cult_desc: "알리예프는 가장 어려운 시기에 우리를 이끌어 주었으니, 그가 마땅히 받아야 할 것으로 보답하는 것이 옳습니다."
 AZE_aze_oppos_broadcasts: "반대 방송을 목표로"
 AZE_aze_oppos_broadcasts_desc: "아제르바이잔의 '야당'은 후원받는 첩자들의 무리일 뿐이며, 이들의 입을 막으면 모두에게 이롭습니다."
 AZE_aze_absolute_loyalty: "완전한 충성"
 AZE_aze_absolute_loyalty_desc: "국가와 지도자에 대한 절대적 충성만이 용인될 수 있으며, 우리는 이 상태가 유지되도록 하겠습니다."
 AZE_aze_enemies_of_state: "국가의 적들"
 AZE_aze_enemies_of_state_desc: "우리의 대의는 정당하므로, 우리 국가에 맞서는 자들은 모두 멸망할 것입니다."
 AZE_aze_fore_agents: "외국 요원 집중"
 AZE_aze_fore_agents_desc: "우리 국가에 침투하여 정세를 불안하게 만드는 외국 요원에 집중해야 합니다."
 AZE_aze_int_enemies: "내부의 적"
 AZE_aze_int_enemies_desc: "우리의 적은 여전히 국내에 남아 있으며, 이를 처리해야 합니다."
 AZE_aze_submit_students: "학생 복종시키기"
 AZE_aze_submit_students_desc: "학생들은 우리가 그들을 위해 일한다는 것을 이해하지 못하므로, 떠드는 자들의 입을 막아야 합니다."
 AZE_aze_close_unis: "반항적 대학 폐쇄"
 AZE_aze_close_unis_desc: "일부 '대학'은 허위 정보를 퍼뜨리고 소요를 일으킬 뿐이므로, 폐쇄하는 편이 낫습니다."
 AZE_aze_hist_new: "새로운 역사"
 AZE_aze_hist_new_desc: "현재의 역사 교과서는 실제로 일어난 사건을 제대로 나타내지 못하고 있으며, 이를 바로잡겠습니다."
 AZE_aze_loyal_science: "충성스러운 과학"
 AZE_aze_loyal_science_desc: "국가의 모든 뛰어난 인재는 자신이 아니라 국민을 위해 봉사하는 데 집중해야 합니다."
 AZE_aze_family_matters: "가족의 문제"
 AZE_aze_family_matters_desc: "가족은 삶에서 가장 중요한 부분이며, 알리예프 가문은 빛나는 보석으로 가득한 보물임이 분명합니다."
 AZE_aze_the_economy: "경제"
 AZE_aze_the_economy_desc: "경제는 국가의 주요 기둥이며, 우리는 이를 그렇게 유지해야 합니다."
 AZE_aze_repres_done_right: "올바른 탄압"
 AZE_aze_repres_done_right_desc: "진정한 '탄압'이 무엇인지 보여 줄 때입니다. 집에서 먼지를 털어 내는 것에 가깝습니다."
 AZE_aze_economy_forum: "경제 포럼"
 AZE_aze_economy_forum_desc: "외국과 경제 포럼을 개최하면 우리 경제 상황을 더 잘 이해하는 데 도움이 될 것입니다."
 AZE_aze_money_stimulum: "자금 부양책"
 AZE_aze_money_stimulum_desc: "자금으로 경제를 부양하는 것은 새롭거나 전례 없는 일이 아니며, 활용할 수 있는 것은 활용해야 합니다."
 AZE_aze_rev_sov_oil_plants: "소련 시대 정유 시설 재가동"
 AZE_aze_rev_sov_oil_plants_desc: "일부 낡은 정유 시설은 고장 나 있으나, 수요가 늘고 있으므로 다시 사용하기 시작해야 합니다."
 AZE_aze_turgeo_agreem: "튀르키예-조지아 협정"
 AZE_aze_turgeo_agreem_desc: "조지아와 튀르키예를 경유하는 파이프라인을 건설하면 더 많은 석유를 판매할 수 있습니다."
 AZE_aze_inve_ref: "정유소 투자"
 AZE_aze_inve_ref_desc: "원유는 흘러나오고 있으나 정유소가 이를 처리할 능력이 없으므로, 이를 개선해야 합니다."
 AZE_aze_constr_focus: "건설 중시"
 AZE_aze_constr_focus_desc: "석유 수익이 경제로 흘러들고 있으므로 대규모 건설 프로젝트를 시작할 수 있습니다."
 AZE_aze_reb_oil_plants: "정유 시설 재건"
 AZE_aze_reb_oil_plants_desc: "일부 낡은 정유 시설은 가동하려면 거의 처음부터 재건해야 하지만, 반드시 해야 할 일입니다."
 AZE_aze_gr_new_invst: "점진적 석유 투자"
 AZE_aze_gr_new_invst_desc: "석유에 지나치게 투자하는 것은 경제에 위험하므로, 성급한 결정은 피해야 합니다."
 AZE_aze_poverty_relief: "빈곤 구제"
 AZE_aze_poverty_relief_desc: "빈곤은 아제르바이잔에서 여전히 큰 문제이므로, 국민의 복지에 집중해야 합니다."
 AZE_aze_fly_with_mark: "시장과 함께 비상"
 AZE_aze_fly_with_mark_desc: "유가가 사상 최고치를 기록하고 있으므로 우리 경제는 시장과 함께 비상해야 합니다."
 AZE_aze_prepare_for_worst: "최악에 대비"
 AZE_aze_prepare_for_worst_desc: "하지만 이는 영원할 수 없으므로, 최악의 상황이 오기 전에 대비해야 합니다."
 AZE_aze_the_sword: "검"
 AZE_aze_the_sword_desc: "우리 군대는 우리의 검이며, 날카롭게 유지해야 합니다."
 AZE_aze_rightful_hand: "정당한 손"
 AZE_aze_rightful_hand_desc: "우리는 우리 땅의 정당한 주인이며, 이것이 우리가 지켜야 할 것입니다."
 AZE_aze_get_sword_ready: "검을 준비하라"
 AZE_aze_get_sword_ready_desc: "우리 군대는 준비되어 있고 경계를 늦추지 않아야 합니다."
 AZE_aze_infiltr_stuff: "적에게 침투"
 AZE_aze_infiltr_stuff_desc: "적은 항상 우리를 지켜보고 있으며, 우리의 힘을 최대로 유지하려면 적의 내부에 침투해야 합니다."
 AZE_aze_eternal_escal: "끝없는 긴장 고조"
 AZE_aze_eternal_escal_desc: "우리는 항상 유지해야 합니다."
 AZE_aze_fortify_region: "지역 요새화"
 AZE_aze_fortify_region_desc: "지역을 안전하게 지키기 위해 요새화해야 합니다."
 AZE_aze_dab_on_armen: "아르메니아인에게 본때를"
 AZE_aze_dab_on_armen_desc: "아르메니아인은 자신을 지나치게 대단하게 여기므로, 그들의 분수를 알려 주어야 합니다."
 AZE_aze_denote_dipld: "외교적 노력 견제"
 AZE_aze_denote_dipld_desc: "적이 목표를 달성하지 못하도록 우리의 외교 분야에서 노력해야 합니다."
 AZE_aze_chal_bro_dip: "영향력에 도전"
 AZE_aze_chal_bro_dip_desc: "독립을 유지하려면 우리에 대한 외국의 영향력에 도전해야 합니다."
 AZE_aze_to_be_or_not: "사느냐 죽느냐"
 AZE_aze_to_be_or_not_desc: "새로운 전쟁을 시작해야 합니까? 지금? 우리는 준비되었습니까?"
 AZE_aze_eastern_problem: "동부 문제"
 AZE_aze_eastern_problem_desc: "이란이 우리의 더 큰 문제이므로, 이들에게 먼저 집중해야 합니다."
 AZE_aze_agency_focus: "정보기관 중시"
 AZE_aze_agency_focus_desc: "향후 작전을 위해 제대로 된 정보기관이 필요합니다."
 AZE_aze_arrest_their_spies: "적의 첩자 체포"
 AZE_aze_arrest_their_spies_desc: "우리 국가는 적의 첩자로 들끓고 있으며, 모두 체포해야 합니다."
 AZE_aze_prepare_the_border: "국경 준비"
 AZE_aze_prepare_the_border_desc: "이란과 싸우기 위해 국경을 준비해야 합니다."
 AZE_aze_ask_for_help: "도움 요청"
 AZE_aze_ask_for_help_desc: "우리는 홀로 싸울 수 없으며, 도움이 필요합니다."
 AZE_aze_full_readiness: "완전한 준비 태세"
 AZE_aze_full_readiness_desc: "우리 자신과 적 모두에게 완전한 준비 태세를 증명해야 합니다."
 AZE_aze_mil_network: "군사 네트워크"
 AZE_aze_mil_network_desc: "군사 네트워크가 우리에게 필요한 모든 물자를 생산하는 데 도움이 되도록 해야 합니다."
 AZE_aze_escalate_the_incident: "사건 확대"
 AZE_aze_escalate_the_incident_desc: "이란 국경 인근에서 최근 발생한 분쟁과 충돌은 우리가 원한다면 확대할 수 있습니다."
 AZE_aze_anew_aliev: "새로운 알리예프"
 AZE_aze_anew_aliev_desc: "이제 일함 알리예프가 우리를 이끌 것이며, 그가 잘 해내기를 바랍니다."
 AZE_aze_cult_of_father: "아버지 숭배"
 AZE_aze_cult_of_father_desc: "알리예프 대통령은 진정 국가의 아버지였으며, 그의 기억을 기려야 합니다."
 AZE_aze_combat_for_inf: "영향력 대항"
 AZE_aze_combat_for_inf_desc: "우리의 미래를 지키기 위해 우리나라에 대한 영향력에 맞서 싸워야 합니다."
 AZE_aze_state_visit: "국빈 방문"
 AZE_aze_state_visit_desc: "국빈 방문은 국가 지도자의 일상에서 중요한 부분입니다. 이제 한 번 실행할 때입니다."
 AZE_aze_more_media_control: "더 강한 언론 통제"
 AZE_aze_more_media_control_desc: "언론은 아직 국가를 완전히 섬기지 않고 있으며, 이는 바뀌어야 합니다. 지금 당장."
 AZE_aze_increase_propaganda_funding: "선전 예산 증액"
 AZE_aze_increase_propaganda_funding_desc: "충성스러운 언론이 기대하는 콘텐츠 품질을 충족시키려면 더 많은 예산이 필요합니다."
 AZE_aze_ban_armtv: "아르메니아 TV 채널 금지"
 AZE_aze_ban_armtv_desc: "어쩐 일인지 몇몇 아르메니아 채널이 아직도 우리 국가에서 방송되고 있으니, 우스운 일입니다."
 AZE_aze_youth_comitee: "청년 위원회"
 AZE_aze_youth_comitee_desc: "청년 위원회는 군대에서 복무할 지원자를 찾는 데 도움이 될 것입니다."
 AZE_vlackmail_loud: "목소리 큰 자들 협박"
 AZE_vlackmail_loud_desc: "EU의 부패한 정치인 몇 명을 협박하는 것에 무슨 문제가 있겠습니까?"
 AZE_films_ind: "영화 산업"
 AZE_films_ind_desc: "영화는 사람들의 마음에 큰 영향을 미치며, 우리 가문은 이에 큰 관심을 가지고 있습니다."
 AZE_control_black_market: "암시장 통제"
 AZE_control_black_market_desc: "암시장과 싸우는 것은 불가능하며 북한 사람들에게 물어보면 알 수 있지만, 통제하는 것은 가능합니다."
 AZE_clamp_black_market: "암시장 단속"
 AZE_clamp_black_market_desc: "어렵더라도 더 큰 이익을 위해 암시장을 뿌리 뽑겠습니다."
 AZE_reg_ind_prog: "지역 산업"
 AZE_reg_ind_prog_desc: "지역화된 산업 프로그램이 성공의 열쇠입니다."
 AZE_reg_soc_prog: "사회 프로그램 규제"
 AZE_reg_soc_prog_desc: "사회 지출을 규제하면 비용을 간소화하고 국가에 도움이 될 수 있습니다."
 AZE_aze_arrest_leaders: "야당 지도자 체포"
 AZE_aze_arrest_leaders_desc: "'야당' 지도자들은 범죄자 무리일 뿐이며, 그들이 있을 곳은 감옥입니다."
 AZE_aze_review_ind_assets: "산업 자산 검토"
 AZE_aze_review_ind_assets_desc: "모든 자원을 적절히 활용하는지 확인하려면 산업 자산을 검토해야 합니다."
 AZE_aze_increase_petroleum: "석유 제품 생산 확대"
 AZE_aze_increase_petroleum_desc: "원유 수출은 높지만 석유 제품은 여전히 우리의 수출 포트폴리오에서 비중이 낮습니다."
 AZE_aze_reassign_milpos: "군 보직 재배치"
 AZE_aze_reassign_milpos_desc: "군을 최적화하기 위해 소규모 군 개편을 단행해야 합니다."
 AZE_aze_turkey_deal: "튀르키예 협정"
 AZE_aze_turkey_deal_desc: "튀르키예 협정은 계약과 자금으로 우리를 풍족하게 해 줄 것입니다."
 AZE_oil_turkey_deal: "튀르키예 석유 협정"
 AZE_oil_turkey_deal_desc: "튀르키예와의 석유 협정은 우리 경제와 외교적 입지에 도움이 될 수 있습니다."
 AZE_future_expansion: "미래 확장"
 AZE_future_expansion_desc: "미래의 경제 확장에는 자금과 계획이 필요하며, 우리에게는 둘 다 있습니다."
 AZE_reprofile_old_tools: "낡은 공구 재정비"
 AZE_reprofile_old_tools_desc: "일부 낡은 공장 설비는 새로운 요구에 맞게 재정비하거나 교체해야 합니다."
 AZE_money_reform: "통화 개혁"
 AZE_money_reform_desc: "경제를 안정시키려면 통화 개혁이 절실히 필요합니다."
 AZE_social_reforms: "사회 개혁"
 AZE_social_reforms_desc: "국가를 더 안정시키기 위한 일련의 사회 프로젝트가 마련되었으며, 이제 이를 시행해야 합니다."
 AZE_aze_russia_deal: "러시아 협정"
 AZE_aze_russia_deal_desc: "러시아 협정은 계약과 자금으로 우리를 풍족하게 해 줄 것입니다."
 AZE_gaz_russia_deal: "러시아 가스 협정"
 AZE_gaz_russia_deal_desc: "러시아의 가스는 우리의 전력 문제를 해결하는 데 도움이 될 수 있습니다."
 AZE_milit_presence: "군 주둔"
 AZE_milit_presence_desc: "우리 국가에 주둔한 러시아군은 아르메니아와 이란이 과격한 행동을 하지 못하도록 억제할 수 있습니다."
 AZE_aze_iran_dealw: "이란 협정"
 AZE_aze_iran_dealw_desc: "이란과의 협정은 우리의 긴장 관계를 돌아보면 다소 이상해 보이지만, 우리의 입지를 굳히는 데 도움이 될 수 있습니다."
 AZE_gaz_iran_deal: "이란 가스 협정"
 AZE_gaz_iran_deal_desc: "이란의 가스는 우리의 전력 문제를 해결하는 데 도움이 될 수 있습니다."
 AZE_iranian_afv: "이란 장갑차"
 AZE_iranian_afv_desc: "이란은 상당히 강력한 장갑 전투 차량 생산 능력을 갖추고 있으며, 그들과 협력하여 더 나은 장비를 생산할 수 있습니다."
 AZE_arms_deals: "무기 거래"
 AZE_arms_deals_desc: "우리는 조국을 지킬 무기가 여전히 부족하며, 더 확보해야 합니다."
 AZE_govern_contr: "통제 공고화"
 AZE_govern_contr_desc: "정부의 통제는 견고하고 절대적이어야 합니다."
 AZE_firm_grip: "확고한 장악"
 AZE_firm_grip_desc: "각 직위를 통제 아래 두는 것은 안정에 결정적입니다."
 AZE_isolate_oppos: "야당 고립"
 AZE_isolate_oppos_desc: "야당을 통제하려면 고립시켜야 합니다."
 AZE_economical_shakeup: "경제 개편"
