 Neutral_Muslim_Brotherhood: "Islamista Moderado"
 Neutral_Muslim_Brotherhood_desc: "Islamista Moderado: - Grupos y partidos inspirados por la Hermandad Musulmana, una organización islamista sunita transnacional fundada en Egipto por el erudito islámico Hassan al-Banna en 1928. Tiene seguidores en todo el mundo árabe y más allá, con su modelo de activismo político combinado con obras de caridad islámica. Su objetivo es un gobierno político islámico e inculcar el Corán y la Sunnah como único punto de referencia para la sociedad."
 nationalist: "Perspectiva nacionalista"
 nationalist_noun: "Nacionalista"
 nationalist_desc: "Gobierno nacionalista"
 Nat_Autocracy: "Junta Militar"
 Nat_Autocracy_desc: "Junta militar: - Los gobiernos nacionalistas creen que la globalización les ha dado la espalda y buscan un renacimiento nacional basado en el proteccionismo, la militarización y la soberanía nacional y étnica. Detestan las instituciones liberales globales, pero pueden seguir siendo pragmáticos en sus alineaciones internacionales para promover sus estrechos objetivos nacionales o expansionistas."
 Nat_Fascism: "Fascismo"
 Nat_Fascism_desc: "Fascistas: - Los gobiernos nacionalistas creen que la globalización les ha dado la espalda y buscan un renacimiento nacional basado en el proteccionismo, la militarización y la soberanía nacional y étnica. Detestan las instituciones liberales globales, pero pueden seguir siendo pragmáticos en sus alineaciones internacionales para promover sus estrechos objetivos nacionales o expansionistas."
 Nat_Populism: "Populismo"
 Nat_Populism_desc: "Populistas de derecha: - Los gobiernos nacionalistas creen que la globalización les ha dado la espalda y buscan un renacimiento nacional basado en el proteccionismo, la militarización y la soberanía nacional y étnica. Detestan las instituciones liberales globales, pero pueden seguir siendo pragmáticos en sus alineaciones internacionales para promover sus estrechos objetivos nacionales o expansionistas."
 Monarchist: "Monarquista"
 Monarchist_desc: "Monárquico: - Los gobiernos nacionalistas creen que la globalización les ha dado la espalda y buscan un renacimiento nacional basado en el proteccionismo, la militarización y la soberanía nacional y étnica. Detestan las instituciones liberales globales, pero pueden seguir siendo pragmáticos en sus alineaciones internacionales para promover sus estrechos objetivos domésticos o expansionistas."
 communist_state: "Communist"
 communist_state_desc: "Communist State: - Governments with an Emerging Outlook are those, especially in the Global South and Post-Soviet Sphere, that seek to replace the prevailing Liberal World Order with their own alternate institutions and multipolar way of global politics. They often have differing attitudes towards globalization, forms of government, and domestic policy.---- Communism is a radical socialist ideology, which is staunchly opposed to free market capitalism, instead promoting that control over the means of production be held by 'the workers'. What exactly this means varies, but has often translated to the state and economy being controlled by a single, authoritarian 'Communist Party'. Since the collapse of the Soviet Union, communism has greatly diminished across the world, but some states still claim it as their official ideology. Those aligned with the emerging powers see the current liberal, capitalist world order as exploitative, and believe it must be torn down and replaced."