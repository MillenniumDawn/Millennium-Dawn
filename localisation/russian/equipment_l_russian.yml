 H_infantry_weapons_9: "Тяж. оружие 2045"
 H_infantry_weapons_9_desc: "Тяжёлое пехотное вооружение — это оружие пехоты, для перемещения и эксплуатации которого требуется целый экипаж, например, тяжёлые пулемёты, миномёты и боевые роботы. Такое оружие и солдаты, которые им управляют, обычно организуются в оружейные взводы."
