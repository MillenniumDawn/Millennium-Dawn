l_french:
 faroe_islands_focus: "Arbre de focus des îles Féroé"
 FAO_national_decisions: "Décisions nationales féroïennes"
 FAO_national_decisions_desc: "Les îles Féroé vivent une situation à la fois très détendue et tendue. Outre les tentatives des dirigeants politiques de... eh bien, faire quoi que ce soit pour développer l'île et sa population, elles doivent aussi affronter la question pressante d'une éventuelle indépendance. Certains la veulent maintenant, d'autres veulent attendre un meilleur pied. Quoi qu'il en soit, ce sera aux Féroïens comme aux Danois de décider si l'île sera vraiment libre à la fin."
 FAO_decision_independence_war: "Guerre d'indépendance"
 FAO_decision_independence_war_desc: "L'heure est venue et les politiciens ont forcé la main du peuple. La guerre est déclarée et c'est désormais une course pour voir si le Danemark peut retenir sa couronne, ou si le joyau de la couronne s'échappera sous la pression publique forçant une paix entre toutes les parties."