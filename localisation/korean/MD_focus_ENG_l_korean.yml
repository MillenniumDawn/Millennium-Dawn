 ENG_coal_opencast_mining: "스코틀랜드 노천 석탄"
 ENG_coal_opencast_mining_desc: "스코틀랜드 탄전의 새로운 노천 갱도가 우리 화력 발전소에 저렴한 연료를 꾸준히 공급하여, 발전소가 더 힘차게 가동되고 전력망에 더 많은 전기를 공급할 수 있게 합니다."
 ENG_glasgow_shipbuilding_idea1: "글래스고 조선 거점"
 ENG_glasgow_shipbuilding_idea1_desc: "클라이드 조선소에 대한 투자로 설계, 용접, 의장 작업이 간소화되어, 글래스고를 비롯한 곳에서 건조되는 모든 해군 함정의 생산 비용이 절감되었습니다."
 ENG_glasgow_shipbuilding_idea1_tt: "§Y모든 해군 함선 건조 비용:§! §G-5%§!"
 ENG_glasgow_shipbuilding_idea2: "글래스고 조선 거점"
 ENG_glasgow_shipbuilding_idea2_desc: "클라이드 조선소에 대한 투자로 설계, 용접, 의장 작업이 간소화되어, 글래스고를 비롯한 곳에서 건조되는 모든 해군 함정의 생산 비용이 절감되었습니다."
 ENG_glasgow_shipbuilding_idea2_tt: "§Y모든 해군 함선 건조 비용:§! §G-5%§!\n §Y모든 해군 함선 설계 비용:§! §G-20%§!"
 ENG_highland_main_line: "하이랜드 본선"
 ENG_highland_main_line_desc: "개선된 하이랜드 본선은 퍼스와 인버네스를 더 빠르고 신뢰할 수 있는 열차로 연결하여, 지역 기업들이 시장, 노동자, 서비스에 더 쉽게 접근할 수 있도록 돕습니다."
 ENG_crossrail: "크로스레일 망"
 ENG_crossrail_desc: "엘리자베스선은 히스로, 웨스트엔드, 시티, 카나리 워프를 하나의 노동 시장으로 엮어 통근을 편리하게 하고, 혼잡한 노선을 완화하며, 런던 사무 경제의 생산성을 끌어올립니다."
 ENG_high_value_manufacturing_zone: "고부가가치 제조 구역"
 ENG_hs2_idea: "고속철도 2"
 ENG_northern_powerhouse_rail_idea: "노던 파워하우스 철도"
 ENG_andrew_digital_enterprise_modifier: "왕실 기업 디지털화 추진"
 ENG_andrew_digital_enterprise_modifier_desc: "요크 공작의 후원 네트워크를 등에 업고, 보다 현대적인 상업 체계를 통해 투자자, 지역 기업, 기술 벤처를 연결하려는 새로운 움직임이 나타났습니다. 무역 진흥 사무소, 비즈니스 포럼, 민간 부문 협력이 디지털 도입을 가속하고 국내외에서 영국 기업의 인지도를 높이는 데 활용되고 있습니다."
 ENG_edward_beach_youth_modifier: "백작의 청년 교류 캠페인"
 ENG_edward_beach_youth_modifier_desc: "웨식스 백작의 후원 아래 포상 프로그램, 지역 사회 네트워크, 전국 각지의 공공 행사를 통해 청년 참여 활동이 확대되었습니다. 이 캠페인은 자신감, 시민 봉사, 실용적 기술을 강조하여 사회 결속을 강화하고 새로운 세대가 국가 생활에 참여하도록 장려합니다."
 ENG_prince_charles: "찰스"
 ENG_prince_charles_trait: "웨일스 공"
 ENG_charles_1_idea: "웨일스 공"
 ENG_charles_1_idea_desc: "찰스는 연합왕국의 왕위 계승자로서 웨일스 공의 칭호를 받았습니다. 특허장으로 수여되고 공식 서임식으로 기념된 이 칭호는 그가 왕위의 일차 계승자라는 지위와 웨일스 및 더 넓은 왕국들과의 지속적인 유대를 나타냈습니다."
 ENG_prince_andrew: "앤드루"
 ENG_prince_andrew_trait: "요크 공작"
 ENG_andrew_1_idea: "영국 해군 사령관"
 ENG_andrew_1_idea_desc: "영국 해군 사령관으로서 앤드루는 헬리콥터 조종사와 함정 지휘관 임무를 포함하여 영국 함대에서 뛰어난 복무를 했습니다. 이는 그의 오랜 현역 복무와 해양 작전에서의 지도력을 반영하며, 연합왕국의 해군 유산과의 깊은 인연을 나타냅니다."
 ENG_andrew_3_idea: "요크 공작"
 ENG_andrew_3_idea_desc: "요크 공작이라는 칭호는 앤드루가 군주의 차남이자 왕실 고위 구성원임을 나타내는 표시로 수여되었습니다. 전통적으로 군주의 아들 중 연소자에게 수여되는 이 칭호는 역사적 위신과 왕실 봉사 및 공적 의무와의 오랜 연관성을 지닙니다."
 ENG_princess_anne: "앤"
 ENG_princess_anne_trait: "프린세스 로열"
 ENG_princess_anne_leader_name: "$ENG_princess_anne_trait$ 앤 공주 $ENG_princess_anne$"
 ENG_anne_1_idea: "프린세스 로열"
 ENG_anne_1_idea_desc: "프린세스 로열이라는 칭호는 왕실 내에서의 서열과 탁월한 봉사를 나타내는 표시로 앤이 보유하고 있습니다. 전통적으로 군주가 장녀에게 수여하지만 자동으로 주어지는 것은 아니며 개인적 영예로서만 수여됩니다. 이는 역사적 위신을 지니며, 평생에 걸쳐 눈에 띄는 의무와 왕실에 대한 흔들림 없는 헌신이 기대됨을 의미합니다."
 ENG_princess_anne_naval_trait: "영국 해군 여군 총사령관"
 ENG_princess_anne_army_trait: "킹스 로열 후사르 연대 대령"
 ENG_prince_edward: "에드워드"
 ENG_prince_edward_trait: "웨식스 백작"
 ENG_edward_1_idea: "웨식스 백작"
 ENG_edward_1_idea_desc: "웨식스 백작이라는 칭호는 봉사와 공적 책임에 결부된 왕실 고위 직위로서 에드워드에게 수여되었습니다. 깊은 역사적 울림을 지닌 고대 잉글랜드의 이름에서 유래한 이 칭호는 헌법적 권한을 암시하지 않으면서도 위신을 지닙니다. 현대 영국에서 이는 후원, 대표, 그리고 군주제의 공적 활동에 대한 꾸준한 지원의 발판으로 기능합니다."
 ENG_prince_phillip: "필립"
 ENG_prince_phillip_trait: "에든버러 공작"
 ENG_phillip_1_idea: "에든버러 공작"
 ENG_phillip_1_idea_desc: "에든버러 공작이라는 칭호는 필립 공이 군주 곁에서 맡은 역할과 왕국을 위한 평생의 봉사를 나타내는 대표적인 표식으로 보유했습니다. 엘리자베스 공주와의 결혼 시 그에게 수여된 이 칭호는 역사적 위신과 의무, 규율, 제도적 지원에 바탕을 둔 현대적 정체성을 겸비했습니다. 공적 생활에서 이는 그의 후원 활동 및 여러 세대에 걸쳐 군주제를 떠받친 실무와 밀접하게 연관되었습니다."
 ENG_prince_william: "윌리엄"
 ENG_prince_william_trait: "케임브리지 공작"
 ENG_prince_william_leader_name: "$ENG_prince_william_trait$ 윌리엄 왕자 $ENG_prince_william$"
 ENG_william_1_idea: "케임브리지 공작"
 ENG_william_1_idea_desc: "케임브리지 공작이라는 칭호는 윌리엄 왕자가 차세대의 주요 인물이라는 역할을 나타내는 왕실 고위 직위로서 수여되었습니다. 전통적으로 군주가 왕실의 주요 구성원에게 수여하는 이 칭호는 위신과 함께 국가 대표 및 공적 의무에 대한 분명한 기대를 수반합니다. 현대 영국에서 이는 후원, 봉사, 그리고 후계자가 장차 맡을 책임을 꾸준히 준비하는 발판으로 기능합니다."
