 ukr_modernize_sov_equipment_storage_sale.23.name: "Мобильные или стационарные §YС-125§!?"
 ukr_modernize_sov_equipment_storage_sale.23.desc: "Модернизированные §YС-125§! могут вернуться как мобильные пусковые установки на грузовиках или снова встать на стационарные позиции вокруг наших городов. От выбора зависит, в каком виде наши хранящиеся дивизионы вернутся в строй, когда начнётся война."
 ukr_modernize_sov_equipment_storage_sale.23.a: "Мобильные пусковые установки"
 ukr_modernize_sov_equipment_storage_sale.23.a_tt: "Каждый модернизированный дивизион возвращается как §Y4§! мобильные пусковые установки."
 ukr_modernize_sov_equipment_storage_sale.23.b: "Стационарные позиции"
 ukr_modernize_sov_equipment_storage_sale.23.b_tt: "Модернизированные дивизионы возвращаются как позиции: каждый даёт §G+1§! к ПВО в регионе [1087.GetName], [696.GetName], [1086.GetName] или [1085.GetName]."
