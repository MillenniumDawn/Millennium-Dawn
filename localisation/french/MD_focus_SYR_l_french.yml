 TT_SYR_AGRICULTURAL_DECISIONS_UNLOCKED: "Débloquera des décisions économiques liées à l'agriculture"
 TT_SYR_HASAKAN_DECISIONS_UNLOCKED: "Will unlock economic decisions related to Hasaka's cotton farming"
 TT_SYR_PRIVATE_BANKING_FOCUS_EFFECT: "Augmentera notre potentiel de croissance grâce aux décisions économiques"
 TT_SYR_NATIONAL_BANKING_FOCUS_EFFECT: "Augmentera notre indépendance domestique grâce aux décisions économiques"
 TT_SYR_CORRUPTION_COSTS: "Plus nos institutions sont corrompues, plus nos investissements seront coûteux"
 TT_SYR_JAPANESE_ANIME: "If we have big digital investments for long enough our animation business partnered with Japan's will produce commercially successful works"
 TT_SYR_CHINESE_ANIME: "If we have big digital investments for long enough our animation business partnered with China's will produce commercially successful works"
 TT_SYR_DOMESTIC_ANIME: "Si nous maintenons d'énormes investissements numériques assez longtemps, notre industrie d'animation produira des œuvres commercialement réussies"
 TT_SYR_DIGITAL_INVESTMENTS_FOCUS_EFFECT: "Débloquera des décisions d'investissements numériques"
 TT_SYR_COTTON_INVESTMENTS: "If we have allowed private banks and we have 50% Kurdish inclusivity or more our investment will be more economically successful and we'll obtain an industrial complex"
 SYR_give_rise_to_merchants: "Émergence des marchands"
 SYR_give_rise_to_merchants_desc: "Avec la montée de l'agrarianisme dans notre société, il semble temps de revenir aux traditions. Une nouvelle génération d'investisseurs, peut-être conservatrice, émergera dans notre pays et, avec un peu de chance, gérera notre économie traditionnelle de la meilleure manière possible."
 SYR_secular_opposition_victory: "Gouvernement de l'opposition laïque"
 SYR_secular_opposition_victory_desc: "The secular opposition coalition has won the elections and will be tasked with leading Syria into becoming a liberal democratic state"
 SYR_islamist_opposition_victory: "Gouvernement de l'opposition islamiste"
 SYR_islamist_opposition_victory_desc: "The Islamist opposition coalition has won the elections and will be tasked with leading Syria into becoming a conservative Islamic republic"
 SYR_turkish_inspired_islamism: "Islamisme inspiré de la Turquie"
 SYR_turkish_inspired_islamism_desc: "Nous nous inspirerons des mouvements islamistes qui ont eu lieu en Turquie après l'établissement de leur république. Cela donnera une image plus favorable à notre mouvement pour le moment et pourrait attirer des hommes d'affaires conservateurs turcs à investir dans notre pays."
 SYR_deregulate_economy: "Économie dérégulée"
 SYR_deregulate_economy_desc: "Pour soutenir les classes moyennes et les marchands dont nous tirons beaucoup de notre soutien, nous réduirons les restrictions à leur encontre et leur fournirons l'espace nécessaire à leur croissance."
 SYR_syrian_gulen_movement: "Mouvement Gülen syrien"
 SYR_syrian_gulen_movement_desc: "The Gülen movement in short was an Islamist movement in Turkey that was very popular between students advocating for a pacifist and modern view of Islam. We will draw inspiration from their teachings and reform our school curriculums to advocate for islamic values and teach them to students as well as improve education overall."
 SYR_moderate_conservatism: "Conservatisme modéré"
 SYR_moderate_conservatism_desc: "Nous éliminerons les éléments extrémistes au sein de nos rangs et redéfinirons notre image comme une force de conservatisme sans lien avec le fanatisme religieux."
 SYR_religious_economic_charity: "Dons religieux"
 SYR_religious_economic_charity_desc: "Nos mouvements ont toujours été associés à des œuvres caritatives et des fondations bénéfiques pour nos communautés. Maintenant que nous occupons une position plus importante, nous les institutionnaliserons davantage pour alléger nos charges économiques."
 SYR_qatari_support: "Soutien qatari"
 SYR_qatari_support_desc: "Nous avons attiré l'intérêt de divers investisseurs qataris."
 SYR_flourishment_of_central_economy: "Développer les centres urbains"
 SYR_flourishment_of_central_economy_desc: "Notre base de soutien provient principalement de diverses régions urbaines, et nous devrions commencer à les développer pour renforcer le soutien de leur population."
 SYR_turkish_investments: "Investissements turcs"
 SYR_turkish_investments_desc: "We have attracted lots of turkish investors thanks to our deregulation policies as well as our ideological similarities to them."
 SYR_reverse_secularization: "Inverser la sécularisation"
 SYR_reverse_secularization_desc: "Le régime précédent a fortement sécularisé notre État. Cette insulte claire à nos idéaux ne doit pas perdurer, et nous devrions inverser ces politiques en faveur de la loi de la charia."
 SYR_NPF_victory: "Gouvernement du Front national progressiste"
 SYR_NPF_victory_desc: "La puissante union a remporté les élections, et il est maintenant temps de redéfinir l'avenir de la nouvelle Syrie."
 SYR_statist_rise: "Montée de l'étatisme"
 SYR_statist_rise_desc: "Liberal Economics allows exploitation of our people and compromises our national independence and control. It is best for Syria to connect every aspect of economy to the state."
 SYR_maintain_military_role: "Maintenir les leviers de l'armée"
 SYR_maintain_military_role_desc: "Le monde entre dans des temps sombres et incertains, nous devons donc protéger notre nation, peu importe le coût."
 SYR_nationalize_oligarchic_holdings: "Nationaliser les avoirs"
 SYR_nationalize_oligarchic_holdings_desc: "Nous nationaliserons les avoirs et propriétés de divers oligarques véreux pour renforcer notre emprise sur l'économie."
 SYR_maintain_socialistic_policies: "Maintenir les lois socialistes"
 SYR_maintain_socialistic_policies_desc: "Une chose que le gouvernement précédent a bien faite, et qui explique leur relative popularité, ce sont leurs politiques socialistes qui soutenaient les classes inférieures. Nous continuerons les politiques mises en œuvre par l'ancien président Hafez al-Assad et nous présenterons comme les véritables défenseurs des opprimés."
 SYR_government_planned_economic_projects: "Projets gouvernementaux"
 SYR_government_planned_economic_projects_desc: "Nous devrions lancer des projets publics pour renforcer notre image de gouvernement responsable et recueillir le soutien des gens ordinaires."
 SYR_patriotic_propaganda: "Propagande patriotique"
 SYR_patriotic_propaganda_desc: "Nous renforcerons nos positions idéologiques en mettant l'accent sur l'importance de la fierté nationale et de la loyauté envers l'État."
 SYR_gather_support_from_peasantry: "Soutien des paysans"
 SYR_gather_support_from_peasantry_desc: "Les paysans sont la colonne vertébrale de notre nation, et nous devons nous assurer qu'ils nous soutiennent."
 SYR_strong_government: "Gouvernement fort"
 SYR_strong_government_desc: "We will have to show our people that our government is stable and capable enough to rule. This will allow us to gain their trust"
 SYR_expand_youth_organizations: "Élargir les organisations de jeunesse"
 SYR_expand_youth_organizations_desc: "Nos partis ont largement compté sur les organisations de jeunesse, et maintenant que nous sommes au pouvoir, il est temps d'encourager les jeunes à soutenir nos causes idéologiques en gagnant leurs cœurs et leurs esprits."
 SYR_illiberal_democracy: "Démocratie illibérale"
 SYR_illiberal_democracy_desc: "Le libéralisme est un virus qui infecte et exploite les nations pauvres. Ce dont le peuple a besoin, c'est d'une véritable démocratie qui représente vraiment le peuple tout en l'unissant sous une seule bannière. Nous sommes une démocratie, quoi qu'il arrive."
 SYR_reestablish_intelligence_committee: "Réétablir les agences de renseignement"
 SYR_reestablish_intelligence_committee_desc: "Les guerres futures ne se mèneront pas avec des fusils et des chars, mais avec l'information. Il est de notre responsabilité de créer une agence de renseignement pleinement fonctionnelle."
 SYR_national_security_act: "Loi sur la sécurité nationale"
 SYR_national_security_act_desc: "Les groupes extrémistes tuent lentement notre nation et représentent une menace pour notre peuple. Leurs attaques sont une menace claire pour notre nation, et nous devons les arrêter immédiatement, peu importe le coût, peu importe ce qui arrive. LE TERRORISME DOIT CESSER."
 SYR_pan_syrian_nationalism: "Pansyrianisme"
 SYR_pan_syrian_nationalism_desc: "Syria is the country that should brighten all over Middle East with its unique identity. Our rich history and culture makes it clear that it's our duty to show our true potential and identity to the world."
 SYR_cultural_rebirth: "Renaissance culturelle"
 SYR_cultural_rebirth_desc: "Our nation is slowly but surely recognizing its identity. Petty divides should not stand in the way of realizing the beauty of our people. Our people should acknowledge that no matter what, we're still Syrians after all."
 SYR_deal_with_the_trade_unions: "Accord avec les syndicats"
 SYR_deal_with_the_trade_unions_desc: "The key of a strong country is its production and economy so we have to make sure that all workers of Syria are supporting us."
 SYR_reassert_russian_ties: "Liens avec la Russie"
 SYR_reassert_russian_ties_desc: "La Russie est le seul et véritable allié qui nous aide à devenir une nation moderne, sûre et prospère."
 SYR_russian_oil_excavation: "Accords pétroliers russes"
 SYR_russian_oil_excavation_desc: "Il y a un grand trésor dans notre nation, et notre allié, la Russie, nous aidera à atteindre ces ressources."
 SYR_russian_tartus_base_expansion: "Élargir la présence navale russe"
 SYR_russian_tartus_base_expansion_desc: "We can't create a strong navy immediately but our Russian friends will help us keep our coasts safe by aiding in the expansion of the port's capabilities."
 SYR_nasserist_rise: "Montée du nassérisme"
 SYR_nasserist_rise_desc: "Le nassérisme renaît et est prêt à rendre la Syrie grande à nouveau."
 SYR_the_coalition: "La coalition"
 SYR_the_coalition_desc: "After reestablishing political parties two notable forces have risen. One advocates for federalizing the state and giving more power to provinces while the other advocates for entrenching the centralized authority and maintaining a united centralized republic. We'll have to choose carefully who we should align with."
 SYR_dismantle_the_military: "Réduire le budget militaire"
 SYR_dismantle_the_military_desc: "Une grande partie du PIB de la défense a été détournée et dirigée vers des projets inutiles en raison de la corruption enracinée dans les institutions de nos forces armées. Nous réaffecterons et vendrons tout ce que nous pourrons obtenir, et bien que cela puisse affaiblir notre armée et nous rendre vulnérables aux menaces, c'est une étape nécessaire vers la reprise économique et l'éradication de la corruption."
 SYR_empower_institutions: "Renforcer les institutions"
 SYR_empower_institutions_desc: "Nos institutions sont très faibles et marginalisées. Cela est dû à la concentration du pouvoir sur le président et au peu de pouvoir accordé au parlement, ainsi qu'à un média contrôlé par l'État favorisant une atmosphère restrictive pour les libertés personnelles. La rédaction d'une nouvelle constitution garantissant une répartition du pouvoir et une libéralisation est une étape cruciale pour l'avenir."
 SYR_western_supported_economic_relief: "Aide occidentale"
 SYR_western_supported_economic_relief_desc: "Nos idéaux s'alignent sur ceux de l'Occident, ce qui nous a même permis d'établir nos partis dans leurs pays. Nous établirons des liens avec eux et demanderons une aide en échange de leviers économiques."
 SYR_liberalize_society: "Libéraliser la société"
 SYR_liberalize_society_desc: "Le peuple est étranger aux valeurs de liberté et d'égalité. Nous devrions travailler à les encourager à valoriser leurs libertés."
 SYR_scientific_ventures: "Initiatives scientifiques"
 SYR_scientific_ventures_desc: "En soutenant les bourses d'études et en mettant à jour nos programmes scolaires obsolètes, nous pourrons faire progresser le secteur scientifique du pays."
 SYR_banish_authoritarian_influence: "Éliminer l'influence autoritaire"
 SYR_banish_authoritarian_influence_desc: "De nombreux États autoritaires comme l'Iran et la Russie ont eu une grande présence ici. Maintenant que nous sommes un État libre, il est temps de mettre fin à leur influence sur nos institutions et notre économie."
 SYR_democratic_socialism: "Socialisme démocratique"
 SYR_democratic_socialism_desc: "L'état économique désastreux de notre pays a laissé notre population très pauvre et sous-développée. Réduire les restrictions sur les entreprises introduira l'exploitation et une concurrence inéquitable, car l'inégalité économique reste prévalente dans notre pays. Nous devons nous concentrer sur l'encouragement de nouvelles entreprises dans le pays et leur accorder des subventions pour permettre un développement économique large dont toutes les classes de citoyens peuvent bénéficier."
 SYR_unleash_economic_potential: "Libérer le potentiel économique"
 SYR_unleash_economic_potential_desc: "Nous avons un grand potentiel pour devenir une puissance économique. Nous pouvons encourager les investisseurs et entreprises étrangers à établir des sociétés ici, et même si cela soumettra notre population à devenir une main-d'œuvre bon marché, ce sera notre grand pas vers le développement économique."
 SYR_domestic_investments: "Investissements domestiques"
 SYR_domestic_investments_desc: "De nombreuses jeunes entreprises nationales sont en train de se créer. Nous investirons en elles pour soutenir leur chemin vers la prospérité économique."
 SYR_subsidize_local_firms: "Entreprises locales"
 SYR_subsidize_local_firms_desc: "Thanks to our policies local firms are being recognized for their success. Time to invest in them."
 SYR_economic_democracy: "Égalité économique"
 SYR_economic_democracy_desc: "Our economic development has reached all people of all economic backgrounds by tackling economic inequality and even gave rise to successful domestic companies. This is something we should be proud of."
 SYR_syrian_diaspora_investments: "Investissements de la diaspora syrienne"
 SYR_syrian_diaspora_investments_desc: "Thanks to our economically friendly policies we have attracted investments from the Syrian diaspora living abroad"
 SYR_invite_US_business_giants: "Inviter les géants américains"
 SYR_invite_US_business_giants_desc: "Bien que nous ayons permis à notre économie de prospérer, ce n'est pas suffisant. Nous inviterons des entreprises géantes des États-Unis à établir des franchises dans le pays pour encourager le consumérisme."
 SYR_address_ethnic_divides: "Résoudre les divisions ethniques"
 SYR_address_ethnic_divides_desc: "Notre pays a toujours été divisé et en proie au sectarisme. Nous devrions décider comment aborder ces problèmes."
 SYR_EU_investments: "Investissements européens"
 SYR_EU_investments_desc: "Divers pays européens cherchent à investir dans notre pays."
 SYR_student_exchanges: "Échanges d'étudiants"
 SYR_student_exchanges_desc: "Nous encouragerons les bourses d'études à l'étranger pour améliorer notre éducation et la maintenir au niveau des normes mondiales."
 SYR_invest_in_tourism: "Boom du tourisme"
 SYR_invest_in_tourism_desc: "Grâce aux améliorations et aux investissements que nous avons réalisés dans notre économie, l'industrie du tourisme connaît une croissance sans précédent. Bientôt, la Syrie sera l'une des destinations de vacances les plus prisées de la Méditerranée"
 SYR_technological_investments: "Investissements technologiques"
 SYR_technological_investments_desc: "Notre technologie est extrêmement obsolète, cela ne peut être ignoré. Nous devrons agir."
 SYR_digitalisation_campaign: "Campagne de numérisation"
 SYR_digitalisation_campaign_desc: "Notre infrastructure technologique est extrêmement obsolète et inefficace selon les normes actuelles. Nous devrions allouer des fonds à la recherche et au développement de nouvelles technologies pour résoudre ce problème."
 SYR_chinese_anime: "Anime chinois"
 SYR_chinese_anime_desc: "Venus Centre, a company based in Damascus, is currently the only dubbing company that dubs Japanese anime (and other cartoons) to Arabic. We have to expand their capabilities and encourage cooperation with Chinese anime studios. Even though they aren't as popular as their competitors, the Chinese animation industry is very successful nonetheless and it's a great idea for us to learn and cooperate with them to be the leading animation producers in the Middle East and Arab world"
 SYR_domestic_anime: "Anime domestique"
 SYR_domestic_anime_desc: "Venus Centre, une entreprise basée à Damas, est actuellement la seule entreprise de doublage qui traduit des animes japonais (et autres dessins animés) en arabe. Notre culture et notre esthétique ne doivent pas être influencées par des thèmes extérieurs, et nous n'avons pas besoin d'expertise étrangère. Nous compterons entièrement sur nous-mêmes et n'essaierons pas de chercher l'aide de géants étrangers de l'animation."
 SYR_japanese_anime: "Anime japonais"
 SYR_japanese_anime_desc: "Venus Centre, a company based in Damascus, is currently the only dubbing company that dubs Japanese anime (and other cartoons) to Arabic. We have to expand their capabilities and encourage cooperation with Japanese anime studios. The unopposed animation giant will surely be of immense help when it comes to setting up our animation industry and producing the most popular works in the Middle East"
 SYR_economic_revitalization: "Revitalisation économique"
 SYR_economic_revitalization_desc: "Non seulement notre économie est en ruines, mais elle est aussi très inefficace, non durable et obsolète. Si nous voulons la prospérité économique, nous devrons entamer le processus laborieux de modernisation et d'investissement dans notre économie désespérée."
 SYR_tartus_service_sector: "Secteur des services de Tartous"
 SYR_tartus_service_sector_desc: "Le secteur des services est l'un des secteurs les plus attractifs pour l'emploi dans la ville de Tartous. Une grande proportion de ses habitants, ayant de bonnes qualifications scientifiques, travaillent dans ce secteur, répartis entre les secteurs public et privé."
 SYR_expand_the_sector: "Élargir le secteur privé"
 SYR_expand_the_sector_desc: "La participation du secteur privé reste en deçà du niveau requis par rapport aux autres villes côtières de la Méditerranée. Nous devrions investir dans le secteur privé et l'élargir pour en faire un point chaud économique attractif."
 SYR_service_sector_in_lacking_regions: "Investissement dans les régions en déficit de services"
 SYR_service_sector_in_lacking_regions_desc: "Bien que le secteur des services à Tartous soit prospère, on ne peut pas en dire autant d'autres villes tout aussi, voire plus importantes. En encourageant économiquement les travailleurs qualifiés à travailler en dehors de Tartous et en investissant dans des entreprises prometteuses, nous remédierons à cette situation."
 SYR_expand_powerstations_in_homs: "Élargir les centrales électriques de Homs"
 SYR_expand_powerstations_in_homs_desc: "A low number of powerstations exist in our country and this has been a persisting and annoying issue. We will build a number of powerstations in Homs due to its central location being the junction of Syria and the presence of a big oil refinery in the city"
 SYR_tap_into_the_oil_reserves: "Exploiter les réserves pétrolières"
 SYR_tap_into_the_oil_reserves_desc: "The oil reserves in the eastern part of the country look promising and await our drills to extract them."
 SYR_road_to_palmyra: "Route vers Palmyre"
 SYR_road_to_palmyra_desc: "Palmyre est un site archéologique crucial qui a attiré un nombre décent de touristes. Nous améliorerons les infrastructures et les routes pour faciliter la visite de ce site par les touristes."
 SYR_expand_latakian_airport: "Élargir l'aéroport de Lattaquié"
 SYR_expand_latakian_airport_desc: "The Latakian airfield is used for military purposes. However, there is a lot of potential for it to be used for civilian airlines due to the city being a tourist hotspot thus we will start investing in it"
 SYR_agricultural_investments: "Investissements agricoles"
 SYR_agricultural_investments_desc: "L'agriculture est le deuxième plus grand secteur de notre économie après le pétrole. Nous devrions exploiter notre potentiel pour devenir une grande puissance agricole."
 SYR_idlib_aleppan_investments: "Liens agricoles Idlib-Alep"
 SYR_idlib_aleppan_investments_desc: "Alep a une énorme présence économique dans l'agriculture d'Idlib. Nous encouragerons davantage d'investissements pour bénéficier aux deux régions et stimuler le potentiel agro-industriel des deux villes."
 SYR_idlib_contest_aleppan_investments: "Contester la présence d'Alep"
 SYR_idlib_contest_aleppan_investments_desc: "While Aleppo's economic presence in Idlib is beneficial to both cities, this state of affairs might make the economic forces outside of our control gain unwanted power. We should contest their presence by investing in Idlib and reducing Aleppo's economic ambitions in the region"
 SYR_provisions_to_daraa: "Provisions pour Daraa"
 SYR_provisions_to_daraa_desc: "Daraa a souffert d'une réduction de l'approvisionnement en eau dans la région et a été sous tension en raison de l'afflux de réfugiés internes forcés de quitter leurs terres du nord-est à cause d'une sécheresse exacerbée par le manque de provisions du gouvernement. Nous investirons dans la région et travaillerons à résoudre ces problèmes immédiatement."
 SYR_invest_in_hasakan_cotton: "Investissez dans le coton de Hasaka"
 SYR_invest_in_hasakan_cotton_desc: "L'essor économique des villes de Qamishli et d'Al-Hasakah est le résultat des projets d'irrigation lancés dans les années 1960, qui ont transformé le nord-est de la Syrie en une région de culture du coton. Cela profitera grandement à notre économie et nous capitaliserons sur le potentiel de la ville pour abriter une industrie textile rentable."
 SYR_renewables_focus: "Focus sur les énergies renouvelables"
 SYR_renewables_focus_desc: "We have suffered from a lot of problems regarding electricity and energy output due to low amounts of oil drilling as well as the increasing population. It's wiser to focus on renewable alternatives because if we think about it our oil-dependant energy sector will become more of a liability in the future."
 SYR_invest_in_wdrvm: "Investissez dans WDRVM"
 SYR_invest_in_wdrvm_desc: "WDRVM is a promising company specializing in the manufacture and installation of wind turbines and powerstations. They have ambitious plans to install wind turbines across the region and tackle the energy problems by exploiting the few regions where stable winds are present. While these regions are scattered with infrequent stable winds there is no denying the positive effects on our energy sector"
 SYR_set_up_puppet_ren_company: "Créer une entreprise d'énergie renouvelable fantoche"
 SYR_set_up_puppet_ren_company_desc: "Nous devrions soutenir une entreprise d'énergie renouvelable fantoche pour renforcer davantage notre emprise sur l'économie."
 SYR_encourage_domestic_solar_companies: "Encourager les entreprises solaires nationales"
 SYR_encourage_domestic_solar_companies_desc: "Quelques entreprises solaires ambitieuses se forment dans le pays, et nous devrions investir en elles pour encourager la production nationale de panneaux solaires."
 SYR_monopolize_solar_power: "Monopoliser l'industrie de l'énergie solaire"
 SYR_monopolize_solar_power_desc: "De grandes opportunités de profit résident dans le potentiel solaire de notre désert. Nous créerons nos propres entreprises d'énergie solaire pour monopoliser ce secteur prometteur."
 SYR_initiate_industrialization: "Lancer l'industrialisation"
 SYR_initiate_industrialization_desc: "Our industrial capabilities are outdated and non-existent. Yet we have the potential to kickstart an industrial growth that'll greatly empower and invigorate our economy"
 SYR_damascus_automotive_potential: "Potentiel automobile de Damas"
 SYR_damascus_automotive_potential_desc: "De nombreuses zones industrielles à Damas dédiées à l'assemblage automobile existent, mais elles ont reçu moins d'attention qu'elles ne le méritent. Nous commencerons à y investir."
 SYR_invite_automotive_giants: "Inviter les géants de l'automobile"
 SYR_invite_automotive_giants_desc: "Popular car brands like Mitsubishi, Toyota and Volkswagen will be of great benefit to our economy if we convince them to invest in us. This will allow quality vehicles to be acquired by our populace"
 SYR_SIAMCO_monopoly: "Monopole de SIAMCO"
 SYR_SIAMCO_monopoly_desc: "Nous avons une histoire de collaboration avec des marques automobiles d'Iran et de Chine, et cela devrait toujours rester ainsi pour produire des voitures abordables et garder les influences indésirables hors de notre économie."
 SYR_homs_heavy_industry: "Industrie lourde de Homs"
 SYR_homs_heavy_industry_desc: "Homs is home to several large public heavy industries. Obviously there is a promising future as an industrial giant and we should invest in them to allow the city to prosper. However we'll have to choose between investing on their production capabilities or resource extraction and processing capabilities"
 SYR_homs_production_focus: "Focus sur la production"
 SYR_homs_production_focus_desc: "Un secteur industriel privé en croissance a prospéré au cours de la dernière décennie, et de nombreuses petites et moyennes entreprises occupent les zones industrielles au nord-ouest et au sud de la ville. Nous capitaliserons sur cela et développerons davantage ces industries."
 SYR_phosphate_extraction: "Extraction de phosphate"
 SYR_phosphate_extraction_desc: "Nous élargirons et construirons de nouvelles usines de phosphate pour extraire cette ressource précieuse, abondante dans le pays."
 SYR_expand_industrial_capabilities: "Élargir les capacités industrielles"
 SYR_expand_industrial_capabilities_desc: "Il est plus judicieux pour nous de développer les capacités de production de la ville, car c'est la voie la plus durable pour la croissance économique de la ville."
 SYR_tartus_pharmaceutical_giant: "Le géant pharmaceutique"
 SYR_tartus_pharmaceutical_giant_desc: "Tartous possède de nombreuses usines pharmaceutiques qui forment un pilier redoutable pour notre économie. Il est temps de décider de l'avenir de ce secteur."
 SYR_pharmaceutical_export_focus: "Encourager les exportations"
 SYR_pharmaceutical_export_focus_desc: "Nous investirons dans les entreprises pharmaceutiques et encouragerons leur expansion vers une suprématie régionale, en favorisant l'exportation de nos médicaments. Cela sera excellent pour notre croissance économique."
 SYR_pharmaceutical_healthcare_focus: "Réduire les prix des médicaments"
 SYR_pharmaceutical_healthcare_focus_desc: "Notre peuple peut bénéficier de cette prouesse pour son bien-être. Nous allouerons un pourcentage de notre budget à rendre les médicaments et les produits pharmaceutiques moins chers pour notre population."
 syrian_phosphate_exports: "Exportations de phosphate syrien"
 syrian_new_high_command: "Un nouveau haut commandement"
 syrian_agricultural_capability_fully_unleached: "Société agraire"
 syrian_agricultural_capability_fully_unleached_desc: "Avec les politiques du nouveau gouvernement en Syrie, il semble que ce pays ait choisi une voie plus conservatrice, plutôt que progressiste, du moins en termes économiques."
 syrian_industrial_capability_fully_unleached: "Expansion industrielle rapide"
 syrian_industrial_capability_fully_unleached_desc: "Avec le plein soutien des industriels et la création de nouveaux investisseurs dans le pays, la Syrie franchit une nouvelle étape pour l'avenir de son pays : une industrialisation massive."
 alawite_political_inclusiveness_dynamic_modifier: "Inclusivité politique de la communauté alaouite"
 TT_alawite_political_inclusiveness_dynamic_modifier: "Les Alaouites sont un groupe ethnoreligieux qui vit principalement au Levant et suit l'Alawisme, une secte de l'islam issue du chiisme. Leur inclusivité politique dans le pays définit le niveau de confiance et d'activité politique dans la politique du pays et est affectée négativement par la corruption, le manque d'infrastructures régionales, un mauvais bilan en matière de libertés religieuses et un manque d'industrie régionale par rapport à d'autres parties du pays."
 druze_political_inclusiveness_dynamic_modifier: "Inclusivité politique de la communauté druze"
 TT_druze_political_inclusiveness_dynamic_modifier: "Les Druzes sont ethniquement arabes et parlent arabe. Leur religion monothéiste intègre de nombreuses croyances de l'islam, du judaïsme et du christianisme, et est également influencée par la philosophie grecque et l'hindouisme. Leur inclusivité politique dans le pays définit le niveau de confiance et d'activité politique dans la politique du pays et est affectée négativement par la corruption, le manque d'infrastructures régionales, un mauvais bilan en matière de libertés religieuses et un manque d'industrie régionale par rapport à d'autres parties du pays."
 kurdish_political_inclusiveness_dynamic_modifier: "Inclusivité politique de la communauté kurde"
 TT_kurdish_political_inclusiveness_dynamic_modifier: "Les Kurdes sont un groupe ethnique iranien originaire de la région montagneuse du Kurdistan en Asie occidentale, qui s'étend du sud-est de la Turquie au nord-ouest de l'Iran, au nord de l'Irak et au nord de la Syrie. Leur inclusivité politique dans le pays définit le niveau de confiance et d'activité politique dans la politique du pays et est affectée négativement par la corruption, le manque d'infrastructures régionales et le manque d'industrie régionale par rapport à d'autres parties du pays."
 subsidized_counter_terror_operations: "Appareil antiterroriste subventionné"
 subsidized_counter_terror_operations_desc: "L'allocation de 0,06 % de notre PIB à l'entraînement antiterroriste améliore les normes de nos forces."
 SYR_WDRVM_investments: "Investissements WDRVM"
 SYR_WDRVM_investments_desc: "We have invested into building numerous wind farms across Syria"
 SYR_palmyrene_solar_farms: "Fermes solaires palmyréennes"
 SYR_palmyrene_solar_farms_desc: "Nous avons investi dans la construction de fermes solaires dans la partie orientale du pays."
 idea_syrian_development_projects: "Projets de développement urbain"
 idea_syrian_kurds_without_citizenships: "Aliénation kurde"
 idea_syrian_kurds_without_citizenships_desc: "Treated as foreigners in their own lands, at least 300 thousand Kurds are denied citizenship and are accused of having crossed the borders into the country."
 idea_syrian_banking_problem: "Restrictions bancaires"
 idea_syrian_banking_problem_desc: "Le secteur bancaire en Syrie est contrôlé par la Banque centrale de Syrie, qui gère également toutes les transactions de change et de commerce extérieur. Toutes les banques commerciales en Syrie ont été nationalisées en 1966. La Banque centrale donne la priorité aux prêts au secteur public, tandis que le secteur privé effectue souvent ses opérations bancaires à l'étranger, un processus plus coûteux et donc une solution inadéquate pour les besoins de financement industriel."
 syrian_gulen_movement: "Mouvement Gülen syrien"
 syrian_scientific_ventures: "Initiatives scientifiques"
 syrian_student_exchanges: "Échanges étudiants"
 syrian_promises_of_change_western: "Promesses de changement"
 syrian_promises_of_change_western_desc: "With a new government in charge promising change and improvement the people await what it will bring to the table"
 syrian_promises_of_change_neutral: "Promesses de changement"
 syrian_promises_of_change_neutral_desc: "Avec un nouveau gouvernement promettant changement et amélioration, le peuple attend de voir ce qu'il proposera."
 syrian_promises_of_change_nationalist: "Promesses de changement"
 syrian_promises_of_change_nationalist_desc: "Avec un nouveau gouvernement promettant changement et amélioration, le peuple attend de voir ce qu'il proposera."
 syrian_promises_of_change_emerging: "Promesses de changement"
 syrian_promises_of_change_emerging_desc: "Avec un nouveau gouvernement promettant changement et amélioration, le peuple attend de voir ce qu'il proposera."
 syrian_military_dismantling: "Démantèlement militaire"
 syrian_military_dismantling_desc: "Les fonds et les propriétés appartenant à l'armée sont réaffectés pour aider à réduire la dette."
 syrian_empowered_sharia_courts: "Tribunaux de la charia renforcés"
 idea_syr_empowered_parliament: "Parlement renforcé"
 idea_syrian_oligarchy_arrests: "Purge de l'oligarchie"
 idea_syrian_pharmaceutical_powerhouse: "Puissance pharmaceutique"
 idea_syrian_pharma_healthcare_model: "Soutien pharmaceutique à la santé"
 syrian_digital_investment1: "Investissements numériques minimaux"
 syrian_digital_investment2: "Investissements numériques faibles"
 syrian_digital_investment3: "Investissements numériques modérés"
 syrian_digital_investment4: "Grands investissements numériques"
 syrian_digital_investment5: "Investissements numériques massifs"
 idea_hisiyah: "Revitalisation industrielle à Hissiyah"
 idea_hisiyah1: "Expansion de la zone industrielle de Hissiyah"
 idea_aleppan_slums: "Élimination des bidonvilles d'Alep"
 idea_aleppan_slums1: "Projets de construction à Alep"
 idea_damascus_priv_sector: "Expansion du secteur privé à Damas"
 idea_damascus_priv_sector1: "Expansion économique à Damas"
 idea_syr_eastern_excavation: "Projets d'excavation dans l'Est"
 idea_syr_eastern_cotton: "Construction de fermes de coton"
 idea_syrian_service_sector_invigoration: "Revitalisation du secteur des services"
 syria_cultural_rebirth: "Renaissance culturelle"
 syria_emerging_youth: "Organisations de jeunesse"
 syria_nationalist_youth: "Organisations de jeunesse"
 syrian_syriatel: "Syriatel"
 syria_japanese_anime: "Anime influencé par le Japon"
 syria_japanese_anime_success: "Industrie de l'animation influencée par le Japon"
 syria_chinese_anime: "Anime influencé par la Chine"
 syria_chinese_anime_success: "Industrie de l'animation influencée par la Chine"
 syria_domestic_anime: "Anime domestique"
 syria_domestic_anime_success: "Industrie de l'animation syrienne"
 Syria_damascus_spring_organization: "Organisation du Printemps de Damas"
 organize_damascus_spring_into_a_revolution: "Préparer une révolution"
 economy_of_hasaka: "Statut économique de Hassaké"
 economy_of_deir_elzor: "Statut économique de Deir ez-Zor"
 economy_of_al_raqqa: "Statut économique de Raqqa"
 economy_of_homs: "Statut économique de Homs"
 economy_of_idlib: "Statut économique d'Idlib"
 economy_of_latakia: "Statut économique de Lattaquié"
 economy_of_damascus: "Statut économique de Damas"
 economy_of_daraa: "Statut économique de Daraa"
 economy_of_al_suwayda: "Statut économique d'Al-Suwayda"
 Syria_economic_investments: "Le potentiel économique syrien"
 Syria_economic_investments_desc: "Our economy has always been extremely outdated and inefficient when compared to most of our neighbors yet it has the potential to become a great and powerful one. We have addressed some problems and potential investment targets in order to refurbish our capabilities and will have to start as soon as possible if we want our nation to be brought to greatness, and our people proud and content with our government"
 invigorate_hisiyah: "Revitaliser la zone industrielle de Hissiyah"
 invigorate_hisiyah_desc: "A major industrial project in our country was the establishment of a new industrial city in Hisiyah. While it has been built and established we'll need to invest in it and expand it for our economy to grow"
 hisiyah_industrial_expansion: "Élargir la zone industrielle"
 hisiyah_industrial_expansion_desc: "Grâce à notre croissance économique et à nos politiques favorables aux entreprises, de nombreux investissements de nouvelles entreprises prospères affluent dans la région industrielle. Il est temps de capitaliser sur cela et d'élargir davantage la région."
 clear_aleppan_slums: "Éliminer les bidonvilles d'Alep"
 clear_aleppan_slums_desc: "Due to a recent population growth and unemployment, many people in Aleppo are living in slums. If we start housing projects and invest in the economy of the city we will be able to get rid of this problem"
 aleppan_economy_booming: "Investir dans le potentiel d'Alep"
 aleppan_economy_booming_desc: "Grâce à notre croissance économique et à nos politiques favorables aux entreprises, de nombreux investissements de nouvelles entreprises prospères affluent dans les zones industrielles de la ville. Nous sommes maintenant en mesure d'élargir les capacités industrielles de la ville."
 damascus_private_sector_encouragement: "Encourager le secteur privé de Damas"
 damascus_private_sector_encouragement_desc: "Damascus is home to a wide range of industrial activity, such as textile, food processing, cement and various chemical industries. The majority of factories are run by the state, and this has proven to be very ineffective at unleashing the city's economic potential. It's time to expand the private sector by investing in the young and promising businesses present"
 damascus_private_sector_booming: "Investir dans le secteur privé prometteur de Damas"
 damascus_private_sector_booming_desc: "Thanks to our economic growth and business friendly policies the private sector has expanded and grown a lot during the recent times. We will invest in this great development and make our capital an economic model"
 eastern_oil_excavation_phase1: "Projets d'excavation pétrolière dans l'Est - Phase 1"
 eastern_oil_excavation_phase2: "Projets d'excavation pétrolière dans l'Est - Phase 2"
 eastern_oil_excavation_phase3: "Projets d'excavation pétrolière dans l'Est - Phase 3"
 invest_in_eastern_cotton: "Investir dans le coton de l'Est"
 invest_in_eastern_cotton_desc: "Nous allons commencer à investir dans les champs de coton de l’est du pays"
 Syria_agricultural_subsidies_decisions: "Politique de subventions agricoles"
 Syria_agricultural_subsidies_decisions_desc: "Le gouvernement syrien subventionne fortement l'agriculture depuis des années pour garantir la production alimentaire nationale. Cela a conduit à une situation où presque toutes les terres arables sont cultivées."
 syria_decision_increase_subsidies: "Augmenter les subventions"
 syria_decision_decrease_subsidies: "Réduire les subventions"
 Syria_digital_investments_decisions: "Investissements numériques"
 Syria_digital_investments_decisions_desc: "Notre infrastructure numérique est extrêmement obsolète et pratiquement inexistante. Nous avons décidé d'agir à ce sujet et commencerons à allouer une partie de notre budget à l'amélioration et à l'investissement dans cette infrastructure."
 syria_decision_increase_investments: "Augmenter le budget d'investissement"
 syria_decision_decrease_investments: "Réduire le budget d'investissement"
 SyriaFocus.86.t: "Révolte alaouite !"
 SyriaFocus.86.d: "Il semble que nous ayons exercé un peu trop de pression sur notre minorité alaouite..."
 SyriaFocus.86.a: "Laissons-les faire ce qu'ils veulent."
 SyriaFocus.87.t: "Statut de Hassaké"
 SyriaFocus.87.d: "Thanks to our successful efforts and relaxed laws towards economic activity, some states are developing durable and self-sufficient economies distinct to their resources as a result of citizens feeling more incentivised to work and businesses given more freedom to conduct their activities. This has allowed for more liquidity in our markets and a general improvement of our economy and we all have to thank decentralized development schemes aimed towards directly improving the quality of life and increasing economic opportunities based on each state's available resources. However it will take time for the country to achieve an economy that can be called sustainable and durable but as long as we are successful in investments we're sure to achieve that"
 SyriaFocus.87.a: "L'industrie serait certainement bénéfique"
 SyriaFocus.88.t: "Victoire du Front Progressiste National"
 SyriaFocus.88.d: "Il semble que la coalition du Front Progressiste National ait remporté les élections. Et le parti ayant obtenu le plus de voix est :"
 SyriaFocus.88.a: "Les Nasséristes"
 SyriaFocus.88.b: "Les Populistes"
 SyriaFocus.90.b: "Les Libéraux"
 SyriaFocus.91.b: "Les républicains populistes"
 SyriaFocus.91.c: "Oui... Nous en parlerons plus tard"
 SyriaFocus.97.b: "Donnons-leur une leçon cette fois."
 SyriaFocus.98.t: "Officiers alaouites font sécession !"
 SyriaFocus.98.d: "The Alawites have long been a repressed minority in Syria before the Assads came to power and now that their rule came to an end a group of high ranking Alawite officers took the opportunity to justify their community's currently precarious status to declare the independence of the Alawite regions. Claiming that doing so will protect them even though it's clear that they're using their positions of power to usurp whatever they can get their hands on"
 SyriaFocus.98.a: "here goes our access to the Mediterranean"
 SyriaFocus.98.b: "Notre intégrité territoriale n'est pas une plaisanterie"
 SyriaFocus.99.t: "Formation of the Syrian Green Federalist Movement"
 SyriaFocus.99.d: "A group of Kurdish political activists have formed a movement calling for the federalisation of Syria as a solution to greater inclusiveness of the marginalized Kurdish population in addition to promoting sustainable incentives. Even though their ideals were completely alienated in the political arena they're hopeful that their cries won't fall on deaf ears"
 SyriaFocus.99.a: "Federalism? In Syria?"
 SyriaFocus.100.t: "Statut de l'autonomie kurde"
 SyriaFocus.100.d: "Les Kurdes sont une minorité ethnique vivant en Syrie qui a souffert de persécutions et d'oppression sous le régime précédent d'Assad. Devons-nous leur accorder une autonomie complète ou une autonomie partielle ?"
 SyriaFocus.100.a: "Leur accorder une semi-autonomie"
 SyriaFocus.101.t: "Statut de l'autonomie alaouite"
 SyriaFocus.101.d: "We have received the report and it seems that people are still not being motivated enough to attend townhall meetings. The people still do not have enough trust in the government and its institutions to feel that they will be heard and thus aren't inclined to take part in regional decision-making. We'll have to gain the people's trust and assure that their voices will be heard in order to motivate them to become active in politics and society"
 SyriaFocus.101.a: "Leur accorder une semi-autonomie"
 SyriaFocus.102.t: "Statut de l'autonomie druze"
 SyriaFocus.102.d: "Our efforts to encourage the people to become politically active have paid off. Many people are flocking towards their respective municipality's townhall and are discussing issues and policies. This will lead to the state implementing policies respective to its own distinct peoples and will ensure that people respect the rule of law and shape their own lifestyle the way they please. Notably more effort is needed to entrench this behaviour and witness a Swiss model of democracy"
 SyriaFocus.102.a: "Leur accorder une semi-autonomie"
 SyriaFocus.103.t: "Statut de la représentation kurde"
 SyriaFocus.103.d: "The road was long and difficult, but we did it! Much effort spent in bringing the people together has led to our nation becoming a model example of direct democracy under the banner of the federation. Brotherhood and cooperation have become the order of the day unlike a few years ago when divides, discrimination and bigotry were prevalent and seemingly impossible to overcome yet, coexistence has been truly entrenched and these divides appear no more. Long live the Syrian Federation where everyone lives free of tyranny, and indifferent to any attempts of division. For we shall cooperate towards achieving the hopeful future"
 SyriaFocus.103.a: "Les encourager simplement à être politiquement actifs"
 SyriaFocus.104.t: "Statut de la représentation alaouite"
 SyriaFocus.104.d: "Once deemed impossible, now has become reality! A nation-state united and powerful in a region of heterogenous peoples, have reunited by the will of its people to form a state defined by itself as servant of the people of Syria. The people stand under the banner that unites them no matter what ethnicity or sect they adhere to, in total contradiction to our neighbors. A sense of patriotism towards Damascus's tricolored three starred flag overwhelms any other, as the people have chosen to unite with their homeland under a single identity. Long live the Republic and its people where everyone shall experience the glory and pride of the state, resilient against odds, and determined to face whatever lies ahead"
 SyriaFocus.104.a: "Les encourager simplement à être politiquement actifs"
 SyriaFocus.104.b: "Leur accorder des sièges réservés au parlement"
 SyriaFocus.105.t: "Statut de la représentation druze"
 SyriaFocus.105.d: "The Druze are a religious minority in Syria living in the southern mountainous regions of south Syria that suffered repression throughout Syria's history. Should we grant them reserved seats in parliament to ensure they acquire the representation they deserve or should we simply encourage political participation in their regions? Bear in mind that granting them seats will implement elements of confessionalism which is dividing the political system along sectarian lines. This might have future repercussions since the politicians might abuse their powers, accuse anyone who criticizes them of attacking the entire sect, and it will cause discontent in the minorities that weren't granted seats in parliament"
 SyriaFocus.105.a: "Les encourager simplement à être politiquement actifs"
 SyriaFocus.105.b: "Leur accorder des sièges réservés au parlement"
 SyriaFocus.106.t: "Fate of citizenship-denied Kurds"
 SyriaFocus.106.d: "Ever since the previous regime got to power there have been at least 300,000 Kurds with no citizenships granted, leaving them treated as foreigners in their own country. Should we start the process of distributing citizenships to them?"
 SyriaFocus.106.a: "Oui !"
 SyriaFocus.106.b: "Non !"
 SyriaFocus.107.t: "La communauté chrétienne exige des sièges !"
 SyriaFocus.107.d: "Seeing how other religious communities received seats in parliament, the Christian community, fearing misrepresentation, demanded that they be offered seats in parliament as well. Should we grant them seats risking increased drawbacks from confessionalism? Or should we deny them seats and receive discontent from the Christian community?"
 SyriaFocus.107.a: "Leur accorder des sièges"
 SyriaFocus.107.b: "Ils n'y ont pas droit"
 SyriaFocus.108.t: "Boom de l'industrie de l'animation"
 SyriaFocus.108.a: "Les weebs seront partout maintenant"
 SyriaFocus.111.t: "Les Kurdes font sécession"
 SyriaFocus.111.d: "Mécontents de leur aliénation, les Kurdes ont exploité notre emprise affaiblie et se rebellent contre nous."
 SyriaFocus.111.a: "Maudit soit-il"
 SyriaFocus.112.t: "L'industrie du phosphate et ses questions"
 SyriaFocus.112.d: "With Syria having good amount of resources of phosphate, it seems that there are two options ahead of us, one is for profit, and one is for improving our agriculture. Surely exporting phosphate can speed up our economy a little, but at the same time, if we truly care for our agriculture, maybe a little self reliance would be better. After all, it's a matter of choosing self reliance or Trade. So, which one should we choose?"
 SyriaFocus.112.a: "Pour une Syrie indépendante et meilleure, nous les utiliserons pour nous-mêmes."
 SyriaFocus.112.b: "Le profit n'est pas mauvais, n'est-ce pas ?"
 SyriaDecisions.16.t: "Victoire"
 SyriaDecisions.16.desc: "Nous avons atteint nos objectifs dans la guerre frontalière."
 SyriaDecisions.16.a: "Excellent"
 SyriaDecisions.17.t: "Échec"
 SyriaDecisions.17.desc: "Nous n'avons pas réussi à atteindre nos objectifs dans la guerre frontalière."
 SyriaDecisions.17.a: "Maudit soit-il"
 SYR_homs_oil_refineries_focus: "Élargir les raffineries de pétrole"
 SYR_homs_oil_refineries_focus_desc: "Des réserves pétrolières abondantes et attractives nous attendent dans les régions orientales du pays. Nous commencerons le processus au détriment des capacités agricoles en raison de la pollution que nous causerons."
 military_power_vacuum: "Vide de pouvoir militaire"
 military_power_vacuum_desc: "Due to the violent political atmosphere of Syria, which now has involved the military, it seems because of severe political, or better to say, \"coup\" activities of the Syrian military, which has led to the collapse of the Alawite high command, it is experiencing an era of chaos. "
