l_korean:
 liechtenstein_focus: "리히텐슈타인 중점 계통도"
 LIC_politics: "국가 원수"
 LIC_politics_desc: "리히텐슈타인은 군주가 판사 임명과 정부 장관 해임을 통제할 수 있고, 거부권과 국민투표 소집 권한까지 지니는 등 군주가 여전히 상당한 권력을 행사하는, 유럽에 몇 남지 않은 나라 가운데 하나입니다."
 LIC_prince_regnant: "리히텐슈타인 대공"
 LIC_prince_regnant_desc: "2003년 리히텐슈타인은 헌법을 개정하여 군주가 언제든 원할 때 이유 없이 현 정부를 해임할 수 있게 하는 동시에, 국민도 언제든 원할 때 헌법을 개정하여 군주제를 폐지할 수 있게 했습니다."
 LIC_traditional: "리히텐슈타인 전통주의"
 LIC_traditional_desc: "리히텐슈타인 국민은 여성 참정권과 같은 세계의 \\"새로운 흐름\\"을 따르는 데 종종 더뎠습니다. 1984년 7월 1일까지 여성은 투표할 수 없었고, 그마저도 여성이 투표소에서 목소리를 낼 수 있도록 허용하는 법안은 (남성) 51.3%의 찬성만으로 통과되었습니다."
 LIC_modern_monarchy: "연극적 군주제"
 LIC_modern_monarchy_desc: "이제 리히텐슈타인도 군주제의 권력을 제한하고 민주주의가 번성하도록 허용하는 면에서 세계의 나머지 국가들을 따라잡을 때가 되었습니다."
 LIC_veto_or_move: "거부권이냐 이주냐"
 LIC_veto_or_move_desc: "우리는 최후통첩을 전달했습니다. 거부권이 주어지지 않으면 왕실 전원이 오스트리아로 이주할 것입니다."
 LIC_preparing_prince_alois: "알로이스 대공 준비"
 LIC_preparing_prince_alois_desc: "한스아담 2세는 나이가 들고 있으며, 알로이스 필리프 마리아 대공에게 고삐를 넘길 준비를 하고 있습니다."
 LIC_vaduz_castle: "파두츠 성"
 LIC_vaduz_castle_desc: "왕실의 본거지는 1712년부터 파두츠 성이었습니다. 1904년과 1920년에 개축이 이루어졌고 1930년에도 우리가 성을 확장했습니다. 이제 왕실의 거처를 다시 한번 확장할 때입니다."
 LIC_Prince_Alois: "전하"
 LIC_Prince_Alois_desc: "알로이스가 이끄는 한 우리는 틀림없이 더 나은 시대를 맞이할 것입니다. 그는 강하고 믿음직한 지도자로서 우리나라를 그 어느 때보다 위대하게 만들 것입니다."
 LIC_Prince_Alois_leader: "리히텐슈타인 공국의 알로이스 대공 전하"
 LIC_globalization: "세계화"
 LIC_globalization_desc: "세계는 군주제와 그에 따른 온갖 허튼 것들에서 이미 벗어났습니다. 이제 우리도 세계화라는 개념을 받아들일 때가 되었을지도 모릅니다."
 LIC_changing_succesion_laws: "왕위 계승법 개혁"
 LIC_changing_succesion_laws_desc: "이제 정부를 확실히 장악한 의회는 군주제를 약화시켜 국민의 처분에 맡기도록 왕위 계승법을 개혁했습니다."
 LIC_abolish_the_monarchy: "군주제 폐지"
 LIC_abolish_the_monarchy_desc: "이제 확고한 권력을 쥔 우리는 군주제를 폐지하고 왕실의 재산을 몰수할 수 있습니다."
 LIC_claim_the_HRE: "신성 로마 제국의 왕좌 주장"
 LIC_claim_the_HRE_desc: "리히텐슈타인은 과거 신성 로마 제국 전체에서 마지막 남은 진정한 군주국입니다. 다른 선제후들은 권력에서 물러났지만 우리는 그보다 더 끈질기게 버텼음을 증명했습니다. 우리의 선언이 최소한 끔찍한 결과로 끝나지 않도록 하려면 많은 준비가 필요하겠지만, 우리는 우리 자신에게 투표하여 스스로를 황제로 선포할 수 있습니다. 승자가 전리품을 가져가는 법입니다."
 LIC_purchase_alaska: "새로운 알래스카 매입"
 LIC_purchase_alaska_desc: "당시에는 이해할 만한 일이었으나, 우리는 선조들이 알래스카를 매입하라는 로마노프 가문의 제안을 거절한 실수를 바로잡고자 합니다. 그들이 우리를 진지하게 받아들이게 하려면 정말로 오랜 시간이 걸릴지도 모르지만, 지금 당장 미국 행정부에 이 주의 매입 문제를 접촉하기 시작해야 합니다. 다만 최대 §R$$1조§!가 들 수도 있습니다."
 LIC_fueling_society: "녹색 연료"
 LIC_fueling_society_desc: "우리에게는 내세울 만한 천연자원이 없지만, 설령 있다 해도 세상을 더 나은 곳으로 만드는 데 집중하는 우리는 물론 그것을 사용하지 않을 것입니다. 이 때문에 우리는 바이오 연료 발전기로 에너지 수요를 충족합니다. 녹색 에너지는 미래이며, 이번에는 리히텐슈타인이 새로운 흐름을 지지하는 데 늦지 않기를 바랍니다."
 LIC_new_work_places: "외국인 노동자"
 LIC_new_work_places_desc: "오스트리아, 스위스와의 경제 통합을 통해 외국인 노동자들이 우리나라로 통근하도록 허용할 수 있습니다. 물론 이를 위해서는 교통 분야에 상당한 투자가 필요합니다."
 LIC_the_military_question: "군대 문제"
 LIC_the_military_question_desc: "우리는 1868년부터 군대 없이 지내 왔는데, 이것이 우리나라가 나아갈 최선의 길이 아닐지도 모릅니다. 우리는 기로에 서 있습니다."
 LIC_defensive_military: "방어적인 군대"
 LIC_defensive_military_desc: "제2차 세계 대전 당시 스위스는 자위가 가능한 상비군이 없다는 이유로 우리를 자신들의 약한 측면이라고 불렀습니다. 이제 군대를 강화하고 우리나라가 스스로를 지킬 수 있도록 만들 때입니다."
 LIC_offensive_military: "공세적 군대"
 LIC_offensive_military_desc: "밖에서 보면 우리가 보잘것없어 보일지도 모르지만, 실제로 우리는 체급을 훨씬 뛰어넘는 한 방을 날릴 능력을 갖추고 있습니다. 이제 이를 세계에 증명할 때입니다."
 LIC_home_defence: "자국 방위"
 LIC_home_defence_desc: "이웃 스위스처럼 우리도 알프스 요새로 알려지게 될 것입니다. 리히텐슈타인의 적은 그 누구도 싸우지 않고서는 우리 영토에 들어오거나 떠날 수 없습니다."
 LIC_intervention_force: "개입 병력"
 LIC_intervention_force_desc: "국제 무대에서 진지하게 받아들여지려면 국내뿐 아니라 세계 곳곳의 분쟁에서도 도움이 될 수 있음을 증명해야 합니다."
 LIC_stepping_up_recruitment: "국토방위대 창설"
 LIC_stepping_up_recruitment_desc: "우리는 전시에 소집되어 침략으로부터 조국을 지킬 수 있는 방위군을 창설해야 합니다."
 LIC_aggresive_recruitment: "공격적인 모병 노력"
 LIC_aggresive_recruitment_desc: "우리 군은 여전히 상당히 규모가 작습니다. 대규모로 진정 강력한 군대가 되려면 인구의 상당 부분을 모병해야 합니다."
 LIC_extensive_defensive_spending: "대규모 방어 군사비 지출"
 LIC_extensive_defensive_spending_desc: "우리는 공격을 받을 경우에 대비한 방어 능력을 확보하기 위해 경제를 한계까지 쥐어짜고 있습니다."
 LIC_military_machinery: "리히텐슈타인 무기 생산"
 LIC_military_machinery_desc: "군에 투입되는 자금이 점점 늘어나면서, 이제 외국의 라이선스나 산업 지원 없이 우리 자체적으로 무기를 개발하고 제작하기 시작할 수 있습니다."
 LIC_extensive_offensive_spending: "대규모 공세 군사비 지출"
 LIC_extensive_offensive_spending_desc: "군에 훨씬 더 많은 자금을 투입함으로써, 이제 강력한 공격 및 방어 능력을 갖춘 막강한 군대를 만드는 마무리 작업을 할 수 있습니다."
 LIC_military_research: "군사 연구"
 LIC_military_research_desc: "제대로 된 군대에는 제대로 된 현장 연구 인력이 필요합니다. 이를 확보하기 위해 자금을 돌려야 할 것입니다."
 LIC_the_civilian_sector: "민간 부문"
 LIC_the_civilian_sector_desc: "우리에게는 우리나라에서 획기적인 경제적 변화를 일으킬 만한 산업이 거의 없으며, 이를 위해서는 투자자들의 유입이 필요합니다."
 LIC_roads: "Liechtenstein's Roads"
 LIC_roads_desc: "우리 작은 나라에는 도로가 몇 개 없지만 그럼에도 자동차 여행지로 추천받고 있습니다. 관광으로 경제를 부양하려면 새 도로를 건설하고 기존 도로를 개선해야 합니다."
 LIC_railway: "샤안-파두츠 철도역"
 LIC_railway_desc: "현재 우리나라에는 기차역이 4개뿐입니다. 이를 확충하여 아름다운 우리나라 어디로든 이어지는 철도를 갖춰야 합니다. 이는 관광을 확대하는 데 도움이 될 것입니다."
 LIC_tourism_boom: "관광 여행"
 LIC_tourism_boom_desc: "관광은 이미 우리 경제에 도움이 되었지만, 우리나라로의 접근성이 높아지면서 우리나라를 목적지로 선택하는 관광객이 훨씬 더 많이 유입되고 있습니다."
 LIC_industry: "산업 성장"
 LIC_industry_desc: "우리에게는 내세울 만한 생산 시설이 거의 없습니다. 번영하려면 대규모 산업이 우리나라에 뿌리내릴 수 있도록 준비해야 합니다."
 LIC_industry_growth: "확장"
 LIC_industry_growth_desc: "좁은 나라에서 산업을 확장할 공간을 찾기가 점점 어려워지고 있으며 이에 따라 땅값이 오르고 있습니다."
 LIC_building_industry: "소형 특수 기계"
 LIC_building_industry_desc: "리히텐슈타인의 수출품은 소형 특수 기계, 치과 용품, 우표, 철물, 도자기 등으로 이루어져 있으며, 우리는 마침내 이 시설들을 개선할 수 있게 되었습니다."
 LIC_fuel_for_farmers: "농민을 위한 연료"
 LIC_fuel_for_farmers_desc: "우리 농민들은 밀, 보리, 옥수수, 감자 등 다양한 작물을 생산하며, 유제품을 생산하는 가축도 기릅니다. 이 모든 것에는 기계가 필요하고 기계에는 연료가 필요하므로, 농민들이 기계를 계속 가동할 수 있도록 확실히 지원합시다."
 LIC_storage_for_fuel: "연료 저장"
 LIC_storage_for_fuel_desc: "연료 생산이 늘어나면서 우리는 생산한 연료를 저장할 더 나은 용기가 필요하다는 점을 깨달았습니다."
 LIC_farming_grants: "농업 보조금"
 LIC_farming_grants_desc: "우리는 농업 공동체의 성장을 촉진하기 위해 자금을 투자하기로 했습니다. 이로써 정부도 이전에는 접근할 수 없던 나라의 일부 지역에 제한적으로나마 접근할 수 있게 되었습니다."
 LIC_resources: "미발견 자원"
 LIC_resources_desc: "이전에 개인이 소유하던 우리나라의 일부 지역에 접근할 수 있게 되면서 천연자원 탐사를 확대할 수 있었고, 깊이 파 내려간 끝에 몇몇 값진 자원을 찾아낼 수 있었습니다."
 LIC_digging_deep: "디기 디기 홀"
 LIC_digging_deep_desc: "자원 채굴에 막대한 자금을 투입한 결과, 이전에 만든 광산 안에서 더 많은 자원을 발견할 수 있었으며, 채굴 수익의 일부를 농민들에게 돌려 그들의 협조를 확보했습니다."
 LIC_health_care: "보건 의료"
 LIC_health_care_desc: "우리나라 국민 대부분은 큰 부를 가지고 있지만, 그럼에도 사회가 자신들을 돌봐 주기를 기대합니다. 현대적 수준을 유지하려면 보건 의료 지출을 늘려야 합니다."
 LIC_decrease_police: "국가경찰 예산 삭감"
 LIC_decrease_police_desc: "현재 우리는 유럽에서 가장 안전한 나라 가운데 하나에 직원 125명으로 구성된 경찰력이 160km²를 담당하고 있습니다. 이는 불필요하며, 국가경찰의 예산을 삭감해야 합니다."
 LIC_labour_unions: "노동자"
 LIC_labour_unions_desc: "우리 노동 인구는 세금이 최대한 효과적으로 쓰이도록 정부 자금을 올바른 곳으로 돌린 우리의 노력을 높이 평가했습니다."
 LIC_growing_research: "리히텐슈타인 대학"
 LIC_growing_research_desc: "현재 리히텐슈타인 대학은 우리나라의 유일한 대학이며, 40개 다른 나라에서 온 학생과 교수진이 있지만 주요 전공 분야는 건축학과 경영경제학 두 가지뿐입니다. 더 많은 학생과 더 많은 학문 분야를 수용하도록 대학을 확장해야 합니다."
 LIC_starting_arms_industry: "무기 산업 육성"
 LIC_starting_arms_industry_desc: "민간 산업이 크게 성장하고 군대도 재편되었으니, 이제 자체 무기 생산을 고려할 때입니다."
 LIC_arms_industry: "리히텐슈타인 무기"
 LIC_arms_industry_desc: "일이 순조롭게 굴러가기 시작하자 우리는 무기 산업에서 많은 돈을 벌 수 있다는 것을 알게 되었고, 그래서 대량 생산에 들어갔습니다."
 LIC_international_diplomacy: "국제 외교"
 LIC_international_diplomacy_desc: "리히텐슈타인은 1924년부터 스위스와 관세 동맹을 맺어 왔으며, 오늘날까지도 스위스는 우리의 가까운 동맹으로 남아 있습니다. 우리는 스위스 프랑을 국가 통화로 사용하기까지 합니다."
 LIC_tax_haven: "LGT 은행"
 LIC_tax_haven_desc: "리히텐슈타인 공국의 은행은 리히텐슈타인의 통치 대공 일가가 소유하고 있으며, 부유층과 권력자들에게 조세 회피처 서비스를 제공하는 경향이 있습니다."
 LIC_german_haven: "독일인의 피난처"
 LIC_german_haven_desc: "현재 리히텐슈타인 인구의 19.4%가 독일어권 국가 출신입니다. 이것이 우리의 세금 정책 때문인지는 확인도 부인도 할 수 없습니다."
 LIC_american_haven: "미국인의 피난처"
 LIC_american_haven_desc: "부유한 미국인들이 대거 유입되고 있습니다. 물론 이는 우리의 아름다운 관광 명소 덕분입니다."
 LIC_growing_tax_haven: "성장하는 조세 회피처"
 LIC_growing_tax_haven_desc: "이유는 알 수 없지만 리히텐슈타인은 전 세계에서, 특히 부유한 시민들 사이에서 인기가 높아지고 있는 듯합니다."
 LIC_british_haven: "영국인의 피난처"
 LIC_british_haven_desc: "최소 100명의 영국인이 리히텐슈타인의 풍경에 큰 관심을 보였습니다."
 LIC_finnish_haven: "핀란드인의 피난처"
 LIC_finnish_haven_desc: "20명이 넘는 핀란드인이 핀란드의 산보다 리히텐슈타인의 산을 진정으로 선호합니다."
 LIC_huge_tax_haven: "거대한 조세 회피처"
 LIC_huge_tax_haven_desc: "전 세계의 부유한 사람들이 우리나라로 몰려들고 있습니다. 이는 분명 리히텐슈타인 요리 덕분입니다."
 LIC_international_cooperation: "국제 협력"
 LIC_international_cooperation_desc: "역사는 세계 강대국들을 희생시켜 자기 이익을 챙기는 이들에게 호의를 보이지 않았습니다. 세계 초강대국들의 호의를 유지하려면 탈세 방지를 위해 협력해야 합니다."
 LIC_alp_integration: "알프스 통합"
 LIC_alp_integration_desc: "리히텐슈타인은 유럽의 심장부에 위치하며 지구상에 몇 안 되는 이중 내륙국입니다. 번영하려면 이웃 나라들과 긴밀히 통합되어야 합니다."
 LIC_EU_cooperation: "EU 협력"
 LIC_EU_cooperation_desc: "리히텐슈타인은 통합으로 이익을 얻는 유럽의 여러 작고 부유한 나라 가운데 하나입니다. EU 정회원 자격은 갖추지 못했지만, 장래의 성장을 위해 EU 국가들과 풍부한 관계를 확보할 수 있도록 조치를 취해야 합니다."
 LIC_USA_cooperation: "미국 협력"
 LIC_USA_cooperation_desc: "새천년의 문턱에서 미국은 세계 최고의 강대국입니다. 미국과 협력하여 세법을 개혁하는 것은 리히텐슈타인이 국제적 번영으로 나아가는 길을 닦아 줄 것입니다."
 LIC_EU_integration: "EU 통합"
 LIC_EU_integration_desc: "유럽 연합 회원국들과 긍정적인 관계를 맺었으므로, 이제 우리 경제를 더 큰 유럽 시장과 호환되도록 통합할 수 있습니다."
 LIC_international_investments: "대외 투자"
 LIC_international_investments_desc: "우리는 세계 최대의 두 시장 및 가장 가까운 이웃들과 교두보를 마련했습니다. 이제 새로 얻은 관계를 활용하여 리히텐슈타인 공국의 재정적 미래를 확보할 때입니다."
 LIC_international_research: "국제 연구 협력"
 LIC_international_research_desc: "우리는 국제 우방들에게 손을 내밀어 연구 활동에 대한 도움을 요청할 수 있으며, 이를 통해 리히텐슈타인이 막대한 기술 격차를 메우기 시작할 수 있습니다."
 LIC_immigrants: "이민자"
 LIC_immigrants_desc: "리히텐슈타인에는 시민권을 얻으려는 다양한 국적의 사람들이 대거 유입되었습니다. 이는 비용이 들겠지만, 노동 인구가 늘어나므로 장기적으로는 이득이 될 수도 있습니다."
 LIC_refugees: "난민"
 LIC_refugees_desc: "전쟁으로 세계의 긴장이 고조되고 있으며, 이에 따라 분쟁을 피해 도망치는 사람들이 생겨나고 있습니다. 이들 가운데 일부를 받아들여 인구를 늘릴 수 있지만, 난민을 수용하는 데는 상당한 비용이 따릅니다."
 LIC_switzerland_refugees: "스위스 난민"
 LIC_switzerland_refugees_desc: "인구가 이렇게 적은 만큼, 우리는 원래 스위스로 피난했을 난민 일부를 받아들일 수 있습니다."
 LIC_austria_refugees: "오스트리아 난민"
 LIC_austria_refugees_desc: "우리는 오스트리아에 자국을 거쳐 서쪽으로 이동하는 난민 일부를 인구 증가를 위해 우리 쪽으로 유도해 달라고 요청할 것입니다."
 LIC_growth_boost: "성장 촉진"
 LIC_growth_boost_desc: "좋든 나쁘든 우리나라에는 거대한 새 인구 집단이 들어왔으며, 이것이 우리나라에 어떤 영향을 미칠지는 시간이 말해 줄 것입니다."
 LIC_foreign_legion: "외인부대"
 LIC_foreign_legion_desc: "우리 군은 작아서 내세울 것이 별로 없지만, 다행히 외부의 도움을 고용하여 보강할 수 있습니다. 용병의 삶은 아직 사라지지 않았습니다."
 LIC_closed_borders: "국경 폐쇄"
 LIC_closed_borders_desc: "외부인들은 리히텐슈타인의 번영에서 이득을 챙기려 할 것입니다. 오늘날 우리가 가진 것은 우리 국민이 일하여 쌓아 올린 것이며, 일이 잘 풀리는 지금 무임승차는 용납하지 않을 것입니다."
 LIC_no_refuge: "피난처 없음"
 LIC_no_refuge_desc: "리히텐슈타인의 유일한 책임은 자국민에 대한 것입니다. 안전하고 번영하는 미래를 확보하려면 우리 자신을 먼저 돌봐야 하며, 외부인은 결코 돌보지 않습니다."
 LIC_embrace_our_heritage: "우리의 유산을 받아들이다"
 LIC_embrace_our_heritage_desc: "리히텐슈타인은 세계정세에 미치는 영향력은 작지만, 거의 어느 나라보다도 길고 풍부한 역사를 지니고 있습니다. 이제 그 유산을 받아들일 때입니다."
 LIC_quality_over_quantity: "양보다 질"
 LIC_quality_over_quantity_desc: "세계 각국이 군대를 채우기 위해 수천 명씩 이민자와 난민을 받아들이는 동안, 리히텐슈타인은 현대전에서 잘 훈련된 사단 하나가 무능한 민병대 백 개보다 훨씬 가치 있음을 이해하고 있습니다."
 LIC_liechtensteiner_concentrated_education: "리히텐슈타인인 중심 교육"
 LIC_liechtensteiner_concentrated_education_desc: "리히텐슈타인의 역사와 유산은 우리 교실에서 너무나 작은 역할을 하고 있으며, 우리 아이들은 하루가 다르게 우리의 유산을 먼 과거로 흘려보내고 있습니다. 이제 이에 대응하도록 교육 제도를 조정할 때입니다."
 LIC_focus_internally: "내부에 집중"
 LIC_focus_internally_desc: "다른 나라들이 지정학적 게임을 벌이며 세계 사람들을 착취하려 하는 동안, 리히텐슈타인은 내부에 집중함으로써 살아남았습니다. 앞으로도 계속 그렇게 할 수 있도록 국가 정책을 조정해야 합니다."
 LIC_homogeneous_state: "동질적 국가"
 LIC_homogeneous_state_desc: "우리는 스스로를 고립시키지 않으면서도 우리를 이용하려는 이들에게 나라를 성공적으로 닫아걸었습니다. 우리는 우리의 과거와 국경 안을 바라보았고 번영을 찾았습니다. 독일의 성공 열쇠는 석탄과 넓고 평평한 평원이고, 러시아는 광대한 농지이며, 프랑스는 강철과 방어에 유리한 산악입니다. 리히텐슈타인의 열쇠는 리히텐슈타인인의 의지와 결의입니다."
 LIC_invest_small_arms: "소화기 투자"
 LIC_invest_small_arms_desc: "북쪽에는 군사 장비의 강국이 있습니다. 독일에서 보병 무기를 구매할 수 있는지 알아보겠습니다."
 LIC_invest_command_equipment: "지휘 통제 장비"
 LIC_invest_command_equipment_desc: "이미 독일에서 보병 무기를 구매했으므로, 독일에서 지휘 통제 장비도 구매하여 협력을 더욱 확대하고자 합니다."
 LIC_invest_helicopters: "미국 항공 기병대"
 LIC_invest_helicopters_desc: "미국은 전투에서 헬리콥터를 활용해 온 오랜 역사가 있습니다. 우리 항공 기병대를 보강하기 위해 그들의 수송 헬리콥터를 구매해 보겠습니다."
 LIC_invest_as_fighter: "미국 전투기"
 LIC_invest_as_fighter_desc: "미국은 상당 기간 전투기로 무기 시장을 지배해 왔습니다. 이제 우리도 이 거래에 끼어들어 전투기를 확보하여 우리 영공을 지배할 때입니다."
 LIC_invest_apc: "APC 투자"
 LIC_invest_apc_desc: "스위스의 피라냐는 유명하며 전 세계에서 사용됩니다. 그것을 구매하는 것이 좋겠습니다."
 LIC_invest_ifv: "IFV 투자"
 LIC_invest_ifv_desc: "보병 전투차는 어떤 현대 군대에도 훌륭한 추가 전력으로, 충분한 화력을 갖추면서도 보병 분대를 수송할 수 있습니다."
 LIC_invest_MBT: "MBT 투자"
 LIC_invest_MBT_desc: "레오파르트는 전설적인 전차를 만들기로 유명한 나라에서 나온 전설적인 전차입니다. 우리나라에 쓸 새 전차를 찾아 나선다면 레오파르트가 확실한 선택입니다."
 LIC_invest_utility: "다목적 차량 투자"
 LIC_invest_utility_desc: "모든 군대의 다목적 차량은 정찰을 위한 경량 지프에서부터 공병에게 딸린 중장비에 이르기까지 여러 분야로 구성됩니다. 현재 우리 장비 대부분은 독일에서 구매했으므로 이 분야에서도 분명 괜찮은 조건을 얻을 수 있을 것입니다."
 LIC_invest_sp_arty: "포병 투자"
 LIC_invest_sp_arty_desc: "제2차 세계 대전 이전부터 모든 현대 군대는 지원을 위해 포병에 크게 의존해 왔으며, 우리 군에도 포병이 필요합니다."
 LIC_international_banking: "국제 금융"
 LIC_international_banking_desc: "리히텐슈타인은 새로 얻은 투자를 활용해 국제 은행가들을 우리나라로 초청해야 합니다. 물론 누군가는 떠나야 할 것입니다..."
 LIC_banking_custom_tooltip: "§Y국제 은행가§! 평판이 §G10§! 변동합니다 (현재: §G[?international_bankers_opinion]§!)"
 LIC_unlock_internal_investment: "§Y내부 투자§! 결정을 잠금 해제합니다."
 LIC_immigration_remove_conditions: "인구가 10만 명을 넘으면 이 국가 정신으로 인한 추가 소비재가 제거됩니다."
 LIC_AS_purchase_tt: "§R우리의 경제나 인구가 충분히 크지 않다면, 이토록 거대한 공군을 유지하려다 붕괴할 수도 있습니다!§!"
 LIC_idea_abolished_military: "군대 폐지"
 LIC_idea_abolished_military_desc: "1868년, 우리는 군대 전체가 지나치게 많은 비용을 요구한다는 이유로 군대를 폐지하기로 결정했으며, 그 이후 필요할 경우 오스트리아와 스위스가 우리를 도와주기로 하는 비공식 합의를 유지해 왔습니다."
 LIC_idea_abolished_arms_industry: "무기 산업 폐지"
 LIC_idea_abolished_arms_industry_desc: "군대가 없으므로 무기 산업을 유지할 이유도 없습니다."
 LIC_idea_prince_regnant: "리히텐슈타인 대공"
 LIC_idea_prince_regnant_desc: "우리의 통치 대공은 언제나 대중의 두터운 지지를 받아 왔습니다."
 LIC_idea_stauch_traditionalism: "리히텐슈타인 전통주의"
 LIC_idea_stauch_traditionalism_desc: "이 어려운 시기에 사람들이 강력한 지도자 곁으로 모여들고 있습니다."
 LIC_idea_modern_monarch: "연극적 군주제"
 LIC_idea_modern_monarch_desc: "이제 군주가 보다 의례적인 역할을 맡을 때가 되었습니다."
 LIC_idea_monarch_growing_power: "군주제의 힘"
 LIC_idea_monarch_growing_power_desc: "군주제가 더 많은 지지를 얻을수록, 필요한 정치적 변화를 이끌어낼 힘도 커집니다."
 LIC_idea_monarch_power_supreme: "대공의 절대적 통치"
 LIC_idea_monarch_power_supreme_desc: "시민들의 전폭적인 지지를 얻은 지금, 국민에 대한 우리의 권력은 정점에 도달했습니다."
 LIC_idea_alois: "전하"
 LIC_idea_alois_desc: "알로이스 전하께서 우리나라에 안정과 번영을 가져다주실 것입니다!"
 LIC_idea_globalization: "세계화"
 LIC_idea_globalization_desc: "우리는 세계화를 받아들였습니다."
 LIC_idea_equal_succesion: "무력화된 군주제"
 LIC_idea_equal_succesion_desc: "정부를 완전히 장악한 의회가 왕위 계승법을 개정하여 군주제를 무력화하고, 군주제의 운명을 국민의 손에 맡겼습니다."
 LIC_idea_start_defensive_military: "방어적 군대 증강"
 LIC_idea_start_defensive_military_desc: "리히텐슈타인은 이웃 나라 스위스를 본보기로 삼아야 합니다. 방어력을 키워 우리를 침공하는 것이 상상도 할 수 없는 일이 되도록 만들어야 하며, 침공의 대가는 그로 인한 이익보다 훨씬 커야 합니다."
 LIC_idea_start_offensive_military: "공세적 군대 증강"
 LIC_idea_start_offensive_military_desc: "리히텐슈타인은 비록 역량이 제한적이지만, 적절한 수단만 갖춘다면 많은 제3세계 국가들에 힘을 투사할 수 있습니다. 해외의 이익을 지키기 위해 무장을 시작할 때가 되었습니다."
 LIC_idea_defensive_military: "향토 방위대"
 LIC_idea_defensive_military_desc: "리히텐슈타인은 세계의 많은 강대국과 개활지에서 맞붙을 가능성이 전혀 없습니다. 정면으로 맞설 수는 없더라도, 그들이 리히텐슈타인의 주권을 건드리려는 시도를 단념하게 만들 수는 있습니다. 철저하게 말입니다."
 LIC_idea_offensive_military: "대규모 모병 활동"
 LIC_idea_offensive_military_desc: "우리의 적은 인구로 다른 나라와 전장에서 어깨를 나란히 하려면, 군 복무가 가능한 시민들을 신속하게 동원하기 시작해야 합니다."
 LIC_idea_extensive_defensive_military: "대규모 방위비 지출"
 LIC_idea_extensive_defensive_military_desc: "우리는 본토에 대한 외부의 공격에 대비해 군대를 준비시키기 위해 최선을 다했습니다."
 LIC_idea_extensive_offensive_military: "대규모 공세 비용 지출"
 LIC_idea_extensive_offensive_military_desc: "마침내 우리는 자랑스러워할 만한 군대를 갖추게 되었습니다."
 LIC_idea_starting_arms_industry: "초기 무기 산업"
 LIC_idea_starting_arms_industry_desc: ""
 LIC_idea_expansive_arms_industry: "리히텐슈타인 무기"
 LIC_idea_expansive_arms_industry_desc: "리히텐슈타인 무기는 국가가 후원하는 우리 무기 산업의 이름입니다."
 LIC_idea_fledgeling_tax_haven: "초기 조세 피난처"
 LIC_idea_fledgeling_tax_haven_desc: "아직 시작 단계에 불과하지만, 리히텐슈타인은 외국 정부들을 발판 삼아 번영을 이루기 위한 기반을 다지고 있습니다."
 LIC_idea_growing_tax_haven: "성장하는 조세 피난처"
 LIC_idea_growing_tax_haven_desc: "리히텐슈타인은 전 세계의 수많은 기업이 자리 잡은 조세 피난처로 서서히 성장하고 있습니다."
 LIC_idea_huge_tax_haven: "거대한 조세 피난처"
 LIC_idea_huge_tax_haven_desc: "사람들은 리히텐슈타인 요리를 맛보러 찾아올지도 모르지만, 머무르는 이유는 아름다운 경치 때문입니다."
 LIC_idea_defunct_tax_haven: "소멸한 조세 피난처"
 LIC_idea_defunct_tax_haven_desc: "이 나라는 한때 조세 피난처였으나, 현재의 법인세율로는 더 이상 그 기능을 수행할 수 없습니다."
 LIC_idea_large_refugee_population: "대규모 난민 인구"
 LIC_idea_large_refugee_population_desc: "우리는 국내에 상당수의 난민을 받아들였으며, 이는 소규모 경제에 부담을 주는 대신 인구를 크게 늘렸습니다."
 LIC_idea_large_refugee_population_sustained: "지속 가능한 난민 인구"
 LIC_idea_large_refugee_population_sustained_desc: "우리는 국내에 상당수의 난민을 받아들였으며, 이는 인구를 크게 늘렸습니다."
 LIC_EU_integration_idea: "EU 통합"
 LIC_EU_integration_idea_desc: "리히텐슈타인은 유럽 연합 경제에 통합되어 여러 가지 이점을 얻고 있습니다."
 LIC_alp_integration_idea: "알프스 통합"
 LIC_alp_integration_idea_desc: "리히텐슈타인은 이웃 나라들의 경제에 통합되는 길을 택했습니다."
 LIC_idea_limited_exports: "수출 제한"
 LIC_idea_limited_exports_desc: "리히텐슈타인은 내부에 집중하고 해외로 수출되는 자원의 양을 줄이기로 결정했습니다."
 LIC_idea_closed_borders: "국경 폐쇄"
 LIC_idea_closed_borders_desc: "리히텐슈타인 정부가 시행한 엄격한 이민 정책으로 인해, 이 나라의 인구 증가율이 감소했습니다."
 LIC_idea_deny_refugees: "난민 수용 거부"
 LIC_idea_deny_refugees_desc: "리히텐슈타인은 국제 난민의 수용을 거부하기로 결정하여, 초소형 경제에 가해질 부담을 피했습니다."
 LIC_idea_internal_focus: "내부 집중"
 LIC_idea_internal_focus_desc: "리히텐슈타인은 다음 시대에도 번영을 이어가려면 스스로에게 집중해야 한다는 점을 깨닫고 국제 정치를 멀리했습니다."
 LIC_idea_homogeneous_state: "동질적 국가"
 LIC_idea_homogeneous_state_desc: "리히텐슈타인은 뜻을 같이하는 리히텐슈타인인들의 국가로 하나가 되었습니다. 거의 모든 다른 나라를 괴롭혔던 분쟁과 내부 갈등은 더 이상 리히텐슈타인에 해당되지 않습니다."
 LIC_idea_quality_over_quantity: "양보다 질"
 LIC_idea_quality_over_quantity_desc: "리히텐슈타인은 군대의 규모보다 질에 노력을 집중해 왔습니다."
 LIC_idea_concentrated_education: "리히텐슈타인 집중 교육"
 LIC_idea_concentrated_education_desc: "리히텐슈타인은 교실에서 자국의 역사와 유산에 집중하기로 결정했습니다. 이는 기술적 역량에 약간의 손실을 가져옵니다."
 LIC_idea_huge_immigration: "대규모 이민"
 LIC_idea_huge_immigration_desc: "리히텐슈타인은 전 세계를 향해 사람들이 자국으로 오도록 장려했습니다. 이로 인해 경제력의 상당 부분이 희생되었습니다. 리히텐슈타인이 이민이 큰 부담이 되지 않을 만큼 충분한 인구에 도달하면 그 효과는 감소할 것입니다."
 LIC_idea_immigration: "이민 장려"
 LIC_idea_immigration_desc: "리히텐슈타인은 이민을 적극 장려했으며, 늘어난 인구가 더 이상 경제에 큰 부담이 되지 않을 만큼 성장했습니다."
 LIC_idea_international_investments: "해외 투자 수익"
 LIC_idea_international_investments_desc: "우리의 해외 투자는 배당금을 통해 경제에 직접 수익을 환원합니다."
 LIC_idea_USA_cooperation: "미국 협력 보조금"
 LIC_idea_USA_cooperation_desc: "미국과의 협력의 결과로, 우리는 경기 부양책을 지원받았습니다."
 LIC_idea_EU_cooperation: "유럽 협력 보조금"
 LIC_idea_EU_cooperation_desc: "유럽 연합과의 협력의 결과로, 우리는 경기 부양책을 지원받았습니다."
 LIC_idea_large_haven_tt: "§R법인세율이 10%를 넘으면 조세 피난처가 사라집니다.§!"
 LIC_idea_medium_haven_tt: "§R법인세율이 15%를 넘으면 조세 피난처가 사라집니다.§!"
 LIC_idea_small_haven_tt: "§R법인세율이 20%를 넘으면 조세 피난처가 사라집니다.§!"
 LIC_idea_low_taxes_tt: "§G법인세율이 다시 허용 가능한 수준으로 낮아지면 조세 피난처가 복구됩니다.§!"
 LIC_idea_competitive_rnd: "경쟁력 있는 연구 부서"
 LIC_idea_competitive_rnd_desc: "리히텐슈타인의 성장하는 서비스 부문 덕분에, 다른 세계 강대국들과 더 높은 수준에서 경쟁할 자원을 갖추게 되었습니다."
 LIC_idea_advanced_rnd: "첨단 연구 부서"
 LIC_idea_advanced_rnd_desc: "리히텐슈타인의 성장하는 서비스 부문 덕분에, 다른 세계 강대국들과 더 높은 수준에서 경쟁할 자원을 갖추게 되었습니다."
 LIC_idea_seized_assets: "몰수한 자산"
 LIC_idea_seized_assets_desc: "리히텐슈타인은 왕가의 자산을 몰수했으며, 일시적인 이익을 거두고 있습니다."
 LIC_idea_foreign_workers: "외국인 노동자"
 LIC_idea_foreign_workers_desc: "이웃 나라들과의 협력을 통해, 리히텐슈타인은 오스트리아와 스위스 시민들이 자국에서 영구 노동자로 일하도록 주선할 수 있습니다."
 LIC_idea_foreign_workers_tt: "§R국경을 폐쇄하면 이 국가 정신은 제거됩니다.§!"
 LIC_idea_closed_borders_tt: "§R이 국가 정신은 외국인 노동자를 초청하지 못하게 만듭니다!§!"
 LIC_idea_expanding_military_research: "군사 연구 확대"
 LIC_idea_growing_our_research: "연구 성장"
 LIC_idea_international_research_cooperation: "국제 연구 협력"
 Liechtenstein.1.t: "알로이스 대공"
 Liechtenstein.1.d: "한스아담이 고령이 됨에 따라, 알로이스 대공이 나서서 정부의 고삐를 쥘 때가 되었습니다. 이행은 순조로울 것으로 예상되며, 그의 치세가 풍요롭기를 기대합니다."
 Liechtenstein.1.a: "추정 상속인"
 Liechtenstein.6.t: "알래스카 매입"
 Liechtenstein.6.d: "리히텐슈타인이 알래스카 주를 매입하고 싶다고 우리에게 접근해 왔습니다. 우리의 대답은 무엇입니까?"
 Liechtenstein.6.a: "농담입니까? 이건 치워 버리십시오."
 Liechtenstein.6.b: "음, 현금이 조금 더 있으면 좋겠군요...."
 Liechtenstein.6.c: "드디어 세라 페일린을 치워 버릴 구실이 생겼군요."
 Liechtenstein.2.t: "우리 제안을 거절한 미국"
 Liechtenstein.2.d: "1년이 넘는 세심한 계획 끝에, 미국은 우리의 제안을 고려하지 않기로 결정했습니다. 우리는 다른 방법으로 영토를 확장할 길을 찾아야 할 것입니다..."
 Liechtenstein.2.a: "뭐, 어차피 가능성이 낮은 시도였지요."
 Liechtenstein.3.t: "미국의 제안 수락!"
 Liechtenstein.3.d: "미국은 우리가 제시한 거액의 대가가 그만한 가치가 있다고 판단하여, 알래스카 주를 매입하겠다는 우리의 제안을 수락하기로 결정했습니다."
 Liechtenstein.3.a: "이제 올해 예산에 이것을 어떻게 맞출지 정리해야겠군요..."
 Liechtenstein.4.t: "알래스카를 무상으로 넘기는 미국!"
 Liechtenstein.4.d: "미국은 어떤 이유에서인지 우리의 지불 제안을 거절하고 대신 알래스카를 무상으로 넘겨주겠다고 합니다!"
 Liechtenstein.4.a: "잠깐, 뭐라고요?"
 Liechtenstein.5.t: "알래스카를 리히텐슈타인에 매각한 미국"
 Liechtenstein.5.d: "미국이 과거의 알래스카 주를 리히텐슈타인 공국에 매각하기로 합의했습니다. 재정적 절박함 때문인지 무능 때문인지는 알 수 없으나, 어쨌든 일어난 일입니다."
 Liechtenstein.5.a: "이 세상은 미쳤습니다. 우리가 우리끼리 지내는 이유입니다."
 Liechtenstein.7.t: "신성 로마 제국의 옥좌"
 Liechtenstein.7.d: "신성 로마 제국 내 마지막 공국을 자처하는 리히텐슈타인이 스스로를 신성 로마 제국의 황제 자리에 올리기로 표결했습니다. 이것이 기이한 홍보 쇼인지 영향력을 확대하려는 실제 수단인지는 두고 봐야 알 것입니다."
 Liechtenstein.7.a: "헛소리를 지껄이는 정신 나간 촌구석, 리히텐슈타인은 그뿐입니다."
 Liechtenstein.7.b: "이것은 국제 사회에 대한 심각한 위협입니다. 대비해야 합니다!"
 Liechtenstein.7.c: "하! 좋은 농담이군요, 알로이스!"
 Liechtenstein.7.e: "마땅히 그래야지요."
 LIC_enlist_refugees: "모병 활동"
 LIC_enlist_refugees_desc: "우리나라는 작고 약하며 군대를 채울 인력이 많지 않기 때문에, 우리가 받아들이고 있는 난민들로부터 군대의 대부분을 충원하고 있습니다."
 LIC_enlist_small: "소규모 모병 활동"
 LIC_enlist_small_desc: "국내 난민 중 일부를 군대에 고용하는 데 투입하겠습니다."
 LIC_enlist_medium: "중규모 모병 활동"
 LIC_enlist_medium_desc: "국내 난민 중 상당수를 군대에 고용하는 데 투입하겠습니다."
 LIC_enlist_large: "대규모 모병 활동"
 LIC_enlist_large_desc: "우리나라로 들어오는 난민 중 대다수를 군대에 고용하는 데 투입하겠습니다."
 LIC_internal_investment_category: "내부 투자"
 LIC_internal_investment_category_desc: "내부에 투자하는 것은 언제나 훌륭한 결정입니다!"
 LIC_internal_investment: "내부 투자"
 LIC_internal_investment_desc: "리히텐슈타인은 작은 인구에도 불구하고, 그토록 작은 나라가 일찍이 도달하지 못한 높이로 올라설 수 있습니다."
 LIC_internal_investment_count: "총 내부 투자([?LIC_internal_invested_count]) < 5"
 stringent_tourism_restrictions: "엄격한 관광 제한"
