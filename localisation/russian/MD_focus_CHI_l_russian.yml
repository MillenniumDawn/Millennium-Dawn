 CHI_TAI_intl_isolation_modifier: "Индекс международной изоляции"
 CHI_TAI_intl_isolation_modifier_desc: "Динамический показатель дипломатической изоляции Тайваня, величина которого обратно пропорциональна числу государств-членов ООН, официально признающих Тайвань. Уменьшение числа признающих государств усиливает штрафы к торговому отношению, иностранному влиянию и стоимости улучшения отношений с Китаем; напротив, более широкое признание способствует улучшению этих отношений и усиливает дипломатическое влияние Тайваня."
 CHI_recognition_embargo: "Эмбарго за признание Тайваня"
 CHI_recognition_embargo_desc: "Китай ввёл строгие экономические и дипломатические санкции в отношении любой страны, официально признающей Тайвань. Стоимость торговли с Китаем значительно возросла, а доступ к китайским рынкам строго ограничен."
 china_sar.038.t: "Пекин предлагает экономическое сотрудничество через пролив"
 china_sar.038.d: "Пекин официально предложил Тайбэю рамочное соглашение об экономическом сотрудничестве через пролив. Материковые чиновники подают его как прагматичную и взаимовыгодную договорённость, полностью обходящую вопрос суверенитета. Деловые круги Тайваня настроены благосклонно, но оппозиция, склонная к независимости, предупреждает о медленном сползании в зависимость от материковой экономики."
 china_sar.038.a: "Принять участие в рамочной программе."
 china_sar.038.b: "Отклонить предложение."
 china_sar.039.t: "Пекин предлагает расширить торговлю через пролив"
 china_sar.039.d: "Развивая начатый экономический диалог, Пекин предлагает существенно расширить торговлю через пролив, снизив пошлины и ослабив ограничения на тайваньский экспорт на материк. Предложение перекликается с Рамочным соглашением об экономическом сотрудничестве (ECFA) и манит доступом к огромному материковому рынку. Критики в Тайбэе опасаются, что за уступками стоят политические условия."
 china_sar.039.a: "Расширить торговлю с материком."
 china_sar.039.b: "Отклонить расширение торговли"
 china_sar.040.t: "Доступ тайваньских компаний на рынок материкового Китая"
 china_sar.040.d: "Пекин предлагает тайваньским предприятиям вести деятельность на материке на льготных условиях, предоставляя им офисные помещения, права на совместное использование зданий и упрощенную процедуру получения лицензий. Для экономики Тайваня, ориентированной на экспорт, это представляет собой значительные возможности, однако углубление коммерческих связей с материком по-прежнему остается политически деликатным вопросом в Тайбэе."
 china_sar.040.a: "Принять торговые преференции"
 china_sar.040.b: "Не допускать тесной интеграции наших компаний"
 china_sar.041.t: "Координация полупроводниковой отрасли по обе стороны пролива"
 china_sar.041.d: "Пекин предлагает наладить координацию между материковым Китаем и ведущей в мире полупроводниковой отраслью Тайваня, включая создание совместных производственных мощностей и проведение совместных исследований. Отрасль производства микросхем Тайваня является его главным стратегическим активом и самым надежным щитом; совместное использование этой отрасли с материковым Китаем было бы выгодным, но привело бы к ослаблению того самого рычага влияния, который удерживает партнеров Тайбэя в сотрудничестве."
 china_sar.041.a: "Координировать сотрудничество в сфере полупроводников"
 china_sar.041.b: "Защитить нашу чиповую отрасль."
 china_sar.042.t: "Обмен деловыми делегациями"
 china_sar.042.d: "Пекин приглашает деловые делегации обеих сторон для посещения промышленных центров по обе стороны пролива, способствуя установлению личных связей между руководителями материкового Китая и Тайваня. Эти визиты сопряжены с минимальным риском и носят коммерчески полезный характер, при этом каждый из них укрепляет сеть экономической взаимозависимости между двумя сторонами пролива."
 china_sar.042.a: "Обмен делегациями."
 china_sar.042.b: "Отклонить визиты."
 china_sar.043.t: "Прямое транспортное сообщение через пролив"
 china_sar.043.d: "Пекин предлагает расширить сеть прямых транспортных сообщений через пролив, развивая политику «Трёх связей» за счёт открытия новых морских маршрутов, авиарейсов и развития инфраструктуры. Прямые сообщения позволят сократить расходы как для предприятий, так и для путешественников, что ещё более укрепит связи между экономиками двух стран."
 china_sar.043.a: "Открыть прямое транспортное сообщение."
 china_sar.043.b: "Ограничить прямое сообщение."
 china_sar.044.t: "Гарантии для инвестиций через пролив"
 china_sar.044.d: "Пекин предлагает официальное соглашение, гарантирующее правовую защиту тайваньских инвестиций на материке и снимающее давние опасения по поводу прав собственности и арбитража. Гарантии успокоят осторожных инвесторов, но одновременно закрепят систему, в которой Тайбэй ведёт переговоры с Пекином как экономический партнёр."
 china_sar.044.a: "Подписать гарантии для инвестиций."
 china_sar.044.b: "Отклонить соглашение."
 china_sar.045.t: "Совместное промышленное планирование через пролив"
 china_sar.045.d: "Пекин предлагает скоординированное промышленное планирование через пролив — согласование цепочек поставок, стандартов и крупных проектов. Такая интеграция даст реальный выигрыш в эффективности, но и встроит экономику Тайваня в долгосрочную стратегию материка, что тревожит избирателей в Тайбэе, дорожащих суверенитетом."
 china_sar.045.a: "Согласовать наше промышленное планирование."
 china_sar.045.b: "Планировать экономику самостоятельно."
 china_sar.046.t: "Глубокая экономическая интеграция через пролив"
 china_sar.046.d: "Пекин предлагает реализовать заключительный этап создания экономического союза между двумя берегами Тайваньского пролива: глубоко интегрированный рынок с гармонизированным регулированием и свободным движением товаров и капитала. Сторонники указывают на процветание, которое это принесет; противники предупреждают, что при такой степени интеграции экономический союз становится трудноотличимым от политической ассимиляции."
 china_sar.046.a: "Полная экономическая интеграция."
 china_sar.046.b: "Остановись у кромки воды."
 china_sar.047.t: "Тайбэй рассматривает соглашение о воссоединении"
 china_sar.047.d: "Пекин представил окончательный план мирного воссоединения: Тайвань вновь войдет в состав Китайской Народной Республики в качестве специального административного района, сохранив собственную администрацию, правовую систему и экономику в рамках модели «одна страна — две системы». После многих лет разрядки в отношениях между двумя берегами Тайваньского пролива соглашение теперь находится на рассмотрении в Тайбэе для ратификации."
 china_sar.047.a: "Ратифицировать соглашение и воссоединиться."
 china_sar.047.b: "Остров к этому не готов."
 CHI_calm_hong_kong_protests: "Восстановить порядок в Гонконге"
 CHI_calm_hong_kong_protests_desc: "Протесты, вызванные нашими избирательными реформами, по-прежнему дестабилизируют обстановку в Специальном административном районе. С учетом присутствия сил безопасности на местах и стабилизации ситуации центральное правительство может приступить к плавному урегулированию беспорядков и восстановлению нормальной обстановки в Гонконге."
 CHI_TAI_resend_economic_track: "Повторить предложение: экономическая рамка"
 CHI_TAI_resend_economic_track_desc: "Тайбэй отклонил предыдущее предложение. Вновь обратиться к правительству Тайваня с предложением о создании рамок экономического сотрудничества между двумя берегами пролива."
 CHI_TAI_resend_expand_trade: "Повторить предложение: расширение торговли"
 CHI_TAI_resend_expand_trade_desc: "Тайбэй отклонил предыдущее предложение. Вновь обратиться к правительству Тайваня с предложением о расширении торговли между двумя берегами пролива."
 CHI_TAI_resend_mainland_access: "Повторить предложение: доступ к рынку"
 CHI_TAI_resend_mainland_access_desc: "Тайбэй отклонил предыдущее предложение. Вновь обратиться к правительству Тайваня с предложением о предоставлении льготного доступа к рынку материкового Китая."
 CHI_TAI_resend_semiconductor: "Повторить предложение: полупроводниковая координация"
 CHI_TAI_resend_semiconductor_desc: "Тайбэй отклонил предыдущее предложение. Вновь обратиться к правительству Тайваня с предложением о координации действий в сфере производства полупроводников между двумя берегами пролива."
 CHI_TAI_resend_business_deleg: "Повторить предложение: деловые делегации"
 CHI_TAI_resend_business_deleg_desc: "Тайбэй отклонил предыдущее предложение. Снова обратиться к правительству Тайваня с предложением об обмене деловыми делегациями."
 CHI_TAI_resend_transport: "Повторить предложение: транспортное сообщение"
 CHI_TAI_resend_transport_desc: "Тайбэй отклонил предыдущее предложение. Вновь обратиться к правительству Тайваня с предложением об установлении прямых транспортных связей между двумя берегами пролива."
 CHI_TAI_resend_safeguards: "Повторить предложение: гарантии для инвестиций"
 CHI_TAI_resend_safeguards_desc: "Тайбэй отклонил предыдущее предложение. Снова обратиться к правительству Тайваня с предложением о заключении соглашения о гарантиях инвестиций в отношениях между двумя берегами Тайваньского пролива."
 CHI_TAI_resend_joint_planning: "Повторить предложение: промышленное планирование"
 CHI_TAI_resend_joint_planning_desc: "Тайбэй отклонил предыдущее предложение. Вновь обратиться к правительству Тайваня с предложением о совместном планировании промышленного развития в отношениях между двумя берегами Тайваньского пролива."
 CHI_TAI_resend_deep_integration: "Повторить предложение: экономическая интеграция"
 CHI_TAI_resend_deep_integration_desc: "Тайбэй отклонил предыдущее предложение. Вновь обратиться к правительству Тайваня с предложением о глубокой экономической интеграции между двумя берегами пролива."
 CHI_TAI_resend_peaceful_reunification: "Повторно предложить соглашение о воссоединении"
 CHI_TAI_resend_peaceful_reunification_desc: "Тайбэй отклонил рамочное соглашение о воссоединении. Дать соглашению ещё немного времени и вновь представить его Тайваню."
 CHI_TAI_goodwill_gesture: "Жест доброй воли через пролив"
 CHI_TAI_goodwill_gesture_desc: "Проявить открытую доброжелательность по отношению к Тайбэю — от предложений о помощи при стихийных бедствиях до смягчения правил в сфере путешествий и туризма, что будет способствовать улучшению отношений между двумя берегами Тайваньского пролива и укреплению взаимного доверия."
 CHI_TAI_coercive_signaling: "Принудительная демонстрация силы"
 CHI_TAI_coercive_signaling_desc: "Продемонстрировать недовольство Пекина посредством демонстративных военных учений и дипломатического давления. Это напоминает Тайбэю о решимости материкового Китая, но подрывает доверие между двумя берегами Тайваньского пролива."
 CHI_sco_member_tooltip: "§YЧлен ШОС§!: Углубляет политическое, экономическое сотрудничество и взаимодействие в сфере безопасности с другими государствами-членами по всей Евразии."
