 CHI_HKG_patriotic_education_drive: "Кампания патриотического воспитания"
 CHI_HKG_patriotic_education_drive_desc: "Профинансировать в субсидируемых школах Гонконга разработанную на материке программу граждановедения и национальной идентичности, расширить обучение на путунхуа и оплатить учителям ознакомительные поездки вглубь страны. Расходы берёт на себя Управление образования, а внедрение идёт достаточно постепенно, чтобы не вызвать повторения протестов против «Нравственного и национального воспитания»."
 CHI_HKG_liaison_office_expansion: "Расширить Канцелярию связи центрального правительства"
 CHI_HKG_liaison_office_expansion_desc: "Расширить Канцелярию связи Центрального народного правительства и Канцелярию по охране национальной безопасности, откомандировать кадры с материка в гражданскую службу Гонконга и посадить проверенных назначенцев в отборочные комиссии судебной системы. Административный контроль растёт быстро, но каждое заметное вмешательство грозит вернуть толпы на улицы."
 CHI_MAC_cross_border_administration: "Унифицировать трансграничное управление"
 CHI_MAC_cross_border_administration_desc: "Признать в Макао профессиональные квалификации и водительские права с материка, направить клиринг юаня через банки под надзором материка и объединить таможенное оформление на пунктах Гунбэй и Лотус-Бридж в единое разрешение. Территория сохраняет свой статус, а её административный аппарат сближается с гуандунским."
 CHI_MAC_hengqin_integration_zone: "Зона углублённого сотрудничества Хэнцинь"
 CHI_MAC_hengqin_integration_zone_desc: "Расширить Гуандун-Макаоскую зону углублённого сотрудничества на острове Хэнцинь: право проживания на материке для работников из Макао, единый налоговый и таможенный режим и перенос связанных с игорным бизнесом предприятий через пролив. Рост поглощает Чжухай, а с ним — и рычаги местной власти."
 CHI_TIB_monastic_patriotic_education: "Патриотическое воспитание в монастырях"
 CHI_TIB_monastic_patriotic_education_desc: "Разместить в каждом зарегистрированном монастыре комитеты демократического управления, обязать монахов и монахинь сдавать экзамены по государственной религиозной политике и ограничить набор послушников. Монастыри остаются открытыми и работают под постоянным административным надзором."
 CHI_TIB_village_cadre_teams: "Сельские рабочие группы кадров"
 CHI_TIB_village_cadre_teams_desc: "Направить постоянную партийную рабочую группу в каждую административную деревню, провести проверки прописки, субсидируемое укрупнение жилья и переселение разрозненных семей скотоводов в благоустроенные посёлки. Административное проникновение становится тотальным — как и вызываемое им недовольство."
 CHI_ETK_bilingual_boarding_schools: "Система двуязычных школ-интернатов"
 CHI_ETK_bilingual_boarding_schools_desc: "Объединить сельские школы в интернаты с обучением на путунхуа и учителями, набранными во внутренних провинциях. Уйгурский язык остаётся предметом, а не языком обучения, а целое поколение получает образование вдали от родных деревень."
 CHI_ETK_labour_transfer_scheme: "Программа переброски избыточной рабочей силы"
 CHI_ETK_labour_transfer_scheme_desc: "Направлять сельских уйгурских рабочих на заводы побережья и в региональные промышленные парки по организованным квотам переброски, возлагая на сельских кадровых работников ответственность за план набора. Доходы семей растут, а общинные связи ослабевают, но схема хорошо видна иностранным аудиторам, отслеживающим цепочки поставок."
 CHI_OMG_mandarin_curriculum_rollout: "Внедрение единой учебной программы"
 CHI_OMG_mandarin_curriculum_rollout_desc: "Заменить монголоязычные учебники по политике, истории и языку единой общенациональной серией и соответственно переподготовить учителей. Мера подаётся как обеспечение равных возможностей и проводится достаточно медленно, чтобы в скотоводческих уездах было спокойно."
 CHI_OMG_pastoral_sedentarisation: "Программа перевода скотоводов на оседлость"
 CHI_OMG_pastoral_sedentarisation_desc: "Ввести запрет на выпас по всей деградировавшей степи, выплатить скотоводческим семьям компенсацию за сданный скот и переселить их в субсидируемое жильё в посёлках с профессиональной переподготовкой. Кочевое скотоводство уступает место наёмному труду, а вместе с ним уходит и социальная основа монгольской самобытности."
 CHI_national_common_language_campaign: "Кампания за общенациональный язык"
 CHI_national_common_language_campaign_desc: "Единообразно применить Закон о стандартном устном и письменном китайском языке сразу во всех специальных административных районах: единая серия учебников, национальная языковая аттестация для работы на госслужбе и квоты на вещание. Единый скоординированный рывок продвигает интеграцию везде, где у центрального правительства ещё есть административные рычаги."
 CHI_second_generation_ethnic_policy: "Этническая политика второго поколения"
 CHI_second_generation_ethnic_policy_desc: "Принять деполитизированную модель национальных отношений, за которую выступают партийные теоретики-реформаторы: отменить льготные квоты, отказаться от региональной автономии как организующего принципа и определять гражданство исключительно через принадлежность к китайской нации. Применённая одновременно ко всем специальным административным районам, эта мера станет самым масштабным инструментом интеграции из доступных — и самым дестабилизирующим."
 CHI_HKG_sinicization_slot_free: "Сейчас не идёт ни одна программа интеграции §YГонконга§!"
 CHI_MAC_sinicization_slot_free: "Сейчас не идёт ни одна программа интеграции §YМакао§!"
 CHI_TIB_sinicization_slot_free: "Сейчас не действует ни одна программа интеграции §YТибета§!"
 CHI_ETK_sinicization_slot_free: "Сейчас не идёт ни одна программа интеграции §YСиньцзяна§!"
 CHI_OMG_sinicization_slot_free: "Сейчас не идёт ни одна программа интеграции §YВнутренней Монголии§!"
 CHI_national_sinicization_slot_free: "Сейчас не идёт ни одна общенациональная кампания интеграции"
 CHI_any_SAR_awaiting_integration: "Как минимум один специальный административный район ещё ожидает интеграции"
 CHI_sinicization_all_SARs_tt: "Продвигает §Yкитаизацию§! во всех специальных административных районах, ещё ожидающих интеграции"
 CHI_hainan_free_trade_port: "Порт свободной торговли Хайнань"
 CHI_hainan_free_trade_port_desc: "В 2018 году Пекин объявил весь Хайнань пилотной зоной свободной торговли, а генеральный план 2020 года наметил путь к полностью самостоятельной таможенной территории к 2025 году. Расширение Хайкоу и глубоководного порта Янпу вместе с площадкой форума в Боао повышает логистические и конференц-возможности острова перед закрытием таможенной границы по всему острову. После этого товары будут свободно перемещаться внутри Хайнаня и облагаться пошлинами только при ввозе на таможенную территорию материка."
 CHI_hainan_zero_tariff_zone: "Зона нулевых тарифов Хайнаня"
 CHI_hainan_zero_tariff_zone_desc: "Опубликованный каталог товаров с нулевой пошлиной позволяет импортируемым товарам, отвечающим установленным критериям, ввозиться на остров Хайнань без уплаты пошлин, а ставки налога на прибыль предприятий и налога на доходы физических лиц ограничены 15 процентами для соответствующих критериям резидентов и приоритетных отраслей. Лимиты беспошлинной розничной торговли в офшорной зоне значительно превышают аналогичные показатели на материке, что привлекает туристические расходы, которые ранее направлялись в Гонконг или за границу. Налогово-тарифный режим ускоряет переход провинции Хайнань от экономики, основанной на плантационном хозяйстве и рыболовстве, к туризму, офшорным услугам и высокодоходной перерабатывающей торговле."
 CHI_kra_canal_underwriting: "Профинансировать канал Кра"
 CHI_kra_canal_underwriting_desc: "Банк развития Китая и Экспортно-импортный банк Китая предоставляют льготное финансирование для следующего этапа земляных работ по прокладке канала через Краский перешеек. Эта кредитная линия позволяет Бангкоку немедленно приступить к строительству, не дожидаясь завершения циклов формирования государственного бюджета, при этом завершение проекта увязывается с дальнейшей благосклонностью со стороны Китая. Каждый транш усиливает финансовую заинтересованность Пекина в этом водном пути, который позволит китайскому судоходству обойти Малаккский пролив."
 CHI_kra_canal_underwriting_phase_tt: "§YКанал Кра§! всё ещё строится."
 CHI_kra_transit_corridor: "Транзитный коридор Кра"
 CHI_kra_transit_corridor_desc: "Китайские государственные судоходные и энергетические компании создают транзитные и бункеровочные терминалы на введенном в эксплуатацию канале Кра, что сокращает маршрут танкерных рейсов из Персидского залива в провинцию Гуандун примерно на 1 200 километров и снижает зависимость от перегруженного Малаккского пролива, уязвимого для блокирования. Данное соглашение приобретает особую ценность в тех случаях, когда китайские компании обладают концессией на управление движением по каналу, а не просто правами на транзит."
 CHI_bri_reduce_loan_tt: "Их непогашенный долг по ОПОП уменьшается на §Gстоимость одного проекта§!"
 CHI_bri_restructure_loan_tt: "Их ставка по кредиту снижается до §G2%§!, а платежи приостанавливаются на §Yодин год§!"
 CHI_bri_application_approved_tt: "Строительство начнётся после финальной проверки соответствия. Получатель платит §Y40§! из казны или получает китайский кредит на недостающую сумму."
 CHI_bri_dual_treasury_50_tt: "Требуется не менее §Y50§! и в фонде ОПОП, и в государственной казне"
 CHI_bri_state_port: "Портовый проект ОПОП"
 CHI_bri_state_port_desc: "Порт, построенный при поддержке Китая, расширяет местную логистику и возможности морского строительства."
 CHI_bri_state_rail: "Железнодорожный проект ОПОП"
 CHI_bri_state_rail_desc: "Железнодорожный коридор, построенный при поддержке Китая, улучшает наземную логистику и строительство инфраструктуры."
 CHI_bri_state_pipeline: "Трубопроводный проект ОПОП"
 CHI_bri_state_pipeline_desc: "Трубопровод, построенный при поддержке Китая, увеличивает пропускную способность по ресурсам и возможности снабжения в регионе."
 CHI_bri_state_telecom: "Телекоммуникационный проект ОПОП"
 CHI_bri_state_telecom_desc: "Цифровая магистральная сеть, построенная при поддержке Китая, поддерживает сетевую инфраструктуру и будущее строительство."
 CHI_bri_state_sez: "Особая экономическая зона ОПОП"
 CHI_bri_state_sez_desc: "Особая экономическая зона, созданная при поддержке Китая, расширяет местные производственные мощности и площадь под застройку."
 CHI_bri_state_mine: "Горнодобывающий проект ОПОП"
 CHI_bri_state_mine_desc: "Китайские инвестиции расширяют добычу на месторождениях региона."
 CHI_bri_state_energy: "Энергетический проект ОПОП"
 CHI_bri_state_energy_desc: "Построенные Китаем генерирующие мощности поддерживают местную промышленность."
 CHI_bri_state_prestige: "Престижный проект ОПОП"
 CHI_bri_state_prestige_desc: "Знаковый и офисный комплекс, построенный при поддержке Китая, меняет облик регионального центра."
 CHI_BRI_recipient_finance: "Финансы ОПОП"
 CHI_BRI_recipient_finance_desc: "Управление нашими долгами и концессиями по инициативе «Один пояс и один путь».\n\n§YНепогашенный долг по инициативе «Один пояс и один путь»:§! [?bri_debt_owed_to_china|2]\n§YЕженедельный процентный платёж:§! [?bri_loan_payment|2]"
 CHI_huawei_consumer_ecosystem_power: "Сила потребительской экосистемы"
 CHI_huawei_consumer_ecosystem_power_desc: "Устройства, программы, сервисы и разработчики образуют глобально конкурентоспособную потребительскую платформу, опирающуюся на широкую технологическую базу Huawei."
 CHI_huawei_global_telecom_challenger: "Глобальный претендент в телекоме"
 CHI_huawei_global_telecom_challenger_desc: "Международные исследовательские центры, отношения с операторами и растущая сеть продаж превращают Huawei в глобального претендента в телекоммуникациях."
 CHI_huawei_resilient_technology_fortress: "Устойчивая технологическая крепость"
 CHI_huawei_resilient_technology_fortress_desc: "Huawei остаётся прочным и технически сильным лидером, но географические ограничения и дефицит доверия сужают её коммерческий охват."
 CHI_huawei_sovereign_full_stack: "Суверенный полный стек"
 CHI_huawei_sovereign_full_stack_desc: "Собственные чипы, программное обеспечение, ИИ, облачные сервисы, устройства и устойчивая система поставок образуют широкий отечественный технологический стек."
 CHI_semiconductor_events.300.a: "Поддержать распределённую глобальную сеть НИОКР"
 CHI_semiconductor_events.300.b: "Сделать приоритетом внутренний рынок операторов"
 CHI_semiconductor_events.300.d: "Основанная в Шэньчжэне в 1987 году, Huawei сначала заняла позиции на китайском телекоммуникационном рынке, а затем создала зарубежные исследовательские и сбытовые подразделения. Государственная промышленная политика может профинансировать распределённую глобальную исследовательскую сеть или сосредоточить компанию на внутреннем рынке операторов связи."
 CHI_semiconductor_events.300.t: "За пределами внутреннего рынка"
 CHI_semiconductor_events.301.a: "Поддержать комплексную модель LTE"
 CHI_semiconductor_events.301.b: "Сосредоточиться на китайских операторах"
 CHI_semiconductor_events.301.d: "TeliaSonera запустила коммерческую сеть LTE в Осло на оборудовании Huawei. Пекин может поддержать комплексную модель, принёсшую этот контракт, и масштабировать её по всей Европе или оставить инженеров компании работать на китайских операторов."
 CHI_semiconductor_events.301.t: "Скандинавский прорыв в LTE"
 CHI_semiconductor_events.302.a: "Профинансировать амбициозный проект 5G целиком"
 CHI_semiconductor_events.302.b: "Вместо этого модернизировать радиооборудование постепенно"
 CHI_semiconductor_events.302.d: "Huawei объявила о вложении не менее US$600 млн в исследования 5G до 2018 года. Государственная поддержка может профинансировать комплексный рывок к лидерству в 5G или же ограничиться постепенной модернизацией радиооборудования, которая обойдётся гораздо дешевле."
 CHI_semiconductor_events.302.t: "Амбициозный проект 5G"
 CHI_semiconductor_events.303.a: "Защитить Huawei и сохранить преемственность"
 CHI_semiconductor_events.303.b: "Искать путь урегулирования через соблюдение требований"
 CHI_semiconductor_events.303.d: "США внесли Huawei и многочисленные её дочерние компании в Список юридических лиц (Entity List), резко ограничив им доступ к американским технологиям. Отдельные обвинения прокуратуры Huawei оспаривает. Пекин может защитить компанию и сохранить преемственность или добиваться урегулирования через соблюдение требований."
 CHI_semiconductor_events.303.t: "Список юридических лиц"
 CHI_semiconductor_events.304.a: "Продвигать отечественное производство любой ценой"
 CHI_semiconductor_events.304.b: "Запастись чем можно и переждать ограничения"
 CHI_semiconductor_events.304.d: "Расширенные правила о прямом иностранном продукте ещё сильнее ограничили доступ Huawei к передовым полупроводникам. Государственная политика может любой ценой форсировать отечественное производство или запастись тем, что ещё доступно, и переждать ограничения."
 CHI_semiconductor_events.304.t: "Чиповая удавка"
 CHI_semiconductor_events.305.a: "Суверенный полный стек — от кремния до ПО"
 CHI_semiconductor_events.305.b: "Технологическая крепость, которая переживёт ограничения"
 CHI_semiconductor_events.305.c: "Телеком-претендент с глобальным охватом"
 CHI_semiconductor_events.305.e: "Потребительская экосистема на собственной платформе"
 CHI_semiconductor_events.305.d: "Два десятилетия экспансии, санкций и импортозамещения определили, чем стала Huawei. Смартфон на процессоре отечественного производства дал ответ на вопрос, который экспортный контроль должен был закрыть. Теперь государственная стратегия выстраивается вокруг того облика, который приняла компания."
 CHI_semiconductor_events.305.t: "Второе восхождение"
 CHI_semiconductor_events.310.t: "Клиентское наследие IBM"
 CHI_semiconductor_events.310.d: "IBM готова продать изобретённый ею бизнес персональных компьютеров вместе с брендом ThinkPad, которому уже доверяет каждый корпоративный покупатель. Покупка в одночасье сделает Lenovo третьим по величине производителем в мире — вместе с убытками, которые и убедили IBM с ним расстаться."
 CHI_semiconductor_events.310.a: "Купить бизнес по производству персональных компьютеров"
 CHI_semiconductor_events.310.b: "Расти на собственных разработках"
 CHI_semiconductor_events.311.t: "Вашингтон одобряет сделку"
 CHI_semiconductor_events.311.d: "Американские регуляторы одобрят продажу бизнеса IBM компании Lenovo на определённых условиях: раздельные объекты, ограниченный доступ к данным государственных заказчиков и контроль за тем, кто где работает. Приняв их, мы закроем сделку, но признаем, что китайский владелец — это вопрос безопасности. Отказ сохранит принцип, но, скорее всего, будет стоить нам бизнеса."
 CHI_semiconductor_events.311.a: "Принять обязательства по безопасности"
 CHI_semiconductor_events.311.b: "Отказаться от условий, которые не ставили бы никакому другому покупателю"
 CHI_semiconductor_events.312.t: "Собственное имя"
 CHI_semiconductor_events.312.d: "Лицензия Lenovo на использование имени IBM на ThinkPad истекает, а корпоративные покупатели всё это время покупали значок, а не стоящую за ним компанию. Имя Lenovo на продукции проверит, принесли ли пять лет владения хоть какой-то авторитет. Сохранение старого значка как можно дольше лишь откладывает этот вопрос."
 CHI_semiconductor_events.312.a: "Выпускать продукцию под собственным именем"
 CHI_semiconductor_events.312.b: "Сохранять унаследованный бренд, пока это возможно"
 CHI_semiconductor_events.313.t: "Альянс взрослеет"
 CHI_semiconductor_events.313.d: "Японская NEC и немецкая Medion готовы влить свои операции в совместные предприятия с Lenovo, а не продаваться целиком. Такие СП дают долю рынка в странах, которые воспротивились бы поглощению, но оставляют партнёрам право голоса в том, что производится. Прямые покупки обходятся дороже, но ни перед кем не отчитываются."
 CHI_semiconductor_events.313.a: "Создать совместные предприятия"
 CHI_semiconductor_events.313.b: "Расширяться напрямую и сохранить контроль"
 CHI_semiconductor_events.314.t: "System x"
 CHI_semiconductor_events.314.d: "Теперь IBM уходит и из бизнеса массовых серверов, и тот же довод работает в большем масштабе и за бóльшую цену. Покупка System x выведет Lenovo за пределы рынка ширпотреба, на котором она уже лидирует. Остаться с персональными компьютерами — значит защищать бизнес, маржа которого сокращается с каждым годом."
 CHI_semiconductor_events.314.a: "Купить и серверный бизнес"
 CHI_semiconductor_events.314.b: "Защищать бизнес персональных компьютеров"
 CHI_semiconductor_events.315.t: "Чем стала Lenovo"
 CHI_semiconductor_events.315.d: "Два десятилетия, за которые Lenovo скупала то, что больше не было нужно западным компаниям, определили, чем стало китайское компьютерное производство и какая доля мирового оборудования проходит через него."
 CHI_semiconductor_events.315.a: "Корпоративная платформа — от серверов до настольных ПК"
 CHI_semiconductor_events.315.b: "Главный производитель персональных компьютеров в мире"
 CHI_semiconductor_events.315.c: "Мост между китайским масштабом и иностранными брендами"
 CHI_semiconductor_events.315.e: "Национальный чемпион"
 CHI_lenovo_enterprise_server_platform: "Корпоративная платформа"
 CHI_lenovo_enterprise_server_platform_desc: "Настольные компьютеры, ноутбуки и серверы за ними выпускает одна компания, которая покупала каждый бизнес, когда прежний владелец от него отказывался. Маржа, которую не смогли найти продавцы, появляется при массовом производстве."
 CHI_lenovo_global_pc_platform: "Глобальный производитель"
 CHI_lenovo_global_pc_platform_desc: "С китайских конвейеров под одной маркой выходит больше персональных компьютеров, чем у кого-либо ещё. Это массовый товарный бизнес с тонкой маржой, и реального конкурента по объёмам нет."
 CHI_lenovo_strategic_bridge: "Стратегический мост"
 CHI_lenovo_strategic_bridge_desc: "Китайская продукция попадает на рынки, которые отвергли бы китайского владельца, потому что у совместных предприятий есть местные партнёры и местные бренды. Контроль разделён, а двери остаются открытыми."
 CHI_lenovo_domestic_champion: "Национальный чемпион"
 CHI_lenovo_domestic_champion_desc: "Компания выросла на том, что построила сама, а не купила, и подотчётна Пекину, а не иностранному реестру акционеров. Её охват меньше, зато ничто в ней не зависит от чужого разрешения."
 china_sar.021.b: "Остров не стоит флота. Отозвать ультиматум."
 CHI_TAI_lift_full_blockade: "Снять полную блокаду"
 CHI_TAI_lift_full_blockade_desc: "Ослабить кордон до частичной блокады. Давление на Тайбэй снижается, тревога Вашингтона утихает, но порты острова вновь открываются."
 CHI_ernie_national_champion_decision: "Сделать Ernie национальной моделью"
 CHI_ernie_national_champion_decision_desc: "Назначить модель Baidu эталонной системой для государственного и провинциального внедрения. Статус первопроходца становится официальным, а министерствам нужно сертифицировать одну архитектуру вместо шести.\n\n§YПолученный национальный дух действует 365 дней. Одновременно может быть активна только одна программа ИИ-лаборатории.§!"
 CHI_ernie_consumer_search_decision: "Встроить Ernie в поиск"
 CHI_ernie_consumer_search_decision_desc: "Держать модель там, где уже есть пользователи, а не гоняться за корпоративными контрактами. Распространение мгновенное, доход реальный — ценой роли законодателя стандартов.\n\n§YПолученный национальный дух действует 365 дней. Одновременно может быть активна только одна программа ИИ-лаборатории.§!"
 CHI_qwen_open_ecosystem_decision: "Поддержать Qwen как открытую платформу"
 CHI_qwen_open_ecosystem_decision_desc: "Поддержать публикацию весов и позволить отечественной экосистеме строить на их основе. Каждый разработчик становится зависимым от китайской инфраструктуры, а со временем это ценнее лицензионного дохода.\n\n§YПолученный национальный дух действует 365 дней. Одновременно может быть активна только одна программа ИИ-лаборатории.§!"
 CHI_qwen_cloud_captive_decision: "Привязать Qwen к облачному бизнесу"
 CHI_qwen_cloud_captive_decision_desc: "Держать передовые модели внутри Alibaba Cloud как причину покупать вычислительные мощности. Маржа остаётся у платформы, а вместе с ней и рычаги влияния.\n\n§YПолученный национальный дух действует 365 дней. Одновременно может быть активна только одна программа ИИ-лаборатории.§!"
 CHI_zhipu_academic_pipeline_decision: "Финансировать конвейер Цинхуа"
 CHI_zhipu_academic_pipeline_decision_desc: "Рассматривать лабораторию как кузницу нового поколения исследователей, а не как продуктовую компанию. Выход на рынок медленнее, но эффект накапливается.\n\n§YПолученный национальный дух действует 365 дней. Одновременно может быть активна только одна программа ИИ-лаборатории.§!"
 CHI_zhipu_state_procurement_decision: "Перевести Zhipu на госзакупки"
 CHI_zhipu_state_procurement_decision_desc: "Гарантировать спрос через министерские и провинциальные контракты. Лаборатории никогда не придётся искать рынок — и никогда не придётся перед ним отчитываться.\n\n§YПолученный национальный дух действует 365 дней. Одновременно может быть активна только одна программа ИИ-лаборатории.§!"
 CHI_doubao_consumer_scale_decision: "Вывести Doubao на массовый рынок"
 CHI_doubao_consumer_scale_decision_desc: "Предложить ассистента сотням миллионов пользователей по цене, с которой никто не сравнится. Главный показатель — охват, а счёт за вычисления — его цена.\n\n§YПолученный национальный дух действует 365 дней. Одновременно может быть активна только одна программа ИИ-лаборатории.§!"
 CHI_doubao_recommendation_core_decision: "Оставить Doubao в рекомендательной системе"
 CHI_doubao_recommendation_core_decision_desc: "Направить работу обратно в системы ранжирования и рекомендаций, которые уже приносят доход. Менее заметно, чем потребительский ассистент, но куда прибыльнее.\n\n§YПолученный национальный дух действует 365 дней. Одновременно может быть активна только одна программа ИИ-лаборатории.§!"
 CHI_deepseek_open_weight_release_decision: "Опубликовать веса DeepSeek"
 CHI_deepseek_open_weight_release_decision_desc: "Открыто опубликовать модель передового класса и позволить остальному миру развивать китайские исследования. Экспортный контроль должен был лишить нас вычислительных мощностей; публикация превращает это ограничение в спор о том, кто устанавливает правила.\n\n§YПолученный национальный дух действует 365 дней. Одновременно может быть активна только одна программа ИИ-лаборатории.§!"
 CHI_deepseek_state_aligned_lab_decision: "Включить DeepSeek в государственную программу"
 CHI_deepseek_state_aligned_lab_decision_desc: "Включить лабораторию в национальную программу — вместе с финансированием и надзором. Работа над эффективностью продолжается под контролем, и её результаты больше не достаются посторонним.\n\n§YПолученный национальный дух действует 365 дней. Одновременно может быть активна только одна программа ИИ-лаборатории.§!"
 CHI_moonshot_long_context_decision: "Поставить на длинный контекст"
 CHI_moonshot_long_context_decision_desc: "Финансировать погоню за длиной контекста, которую больше никто не предлагает. Узкая ставка на одну возможность — и первая лаборатория, которая её реализует, займёт целую нишу.\n\n§YПолученный национальный дух действует 365 дней. Одновременно может быть активна только одна программа ИИ-лаборатории.§!"
 CHI_moonshot_enterprise_pivot_decision: "Нацелить Moonshot на корпоративный сектор"
 CHI_moonshot_enterprise_pivot_decision_desc: "Сменить гонку за потребителем на контрактные внедрения с предсказуемым доходом. Оценка компании перестаёт расти, а баланс перестаёт кровоточить.\n\n§YПолученный национальный дух действует 365 дней. Одновременно может быть активна только одна программа ИИ-лаборатории.§!"
 CHI_ernie_national_champion: "Национальная эталонная модель"
 CHI_ernie_national_champion_desc: "Одна сертифицированная архитектура работает в министерствах, провинциях и госпредприятиях. Закупки проще, стандарты китайские, а у лидера мало причин торопиться."
 CHI_ernie_consumer_search: "Ассистент, встроенный в поиск"
 CHI_ernie_consumer_search_desc: "Модель доходит до пользователей через поисковый продукт, а не через отдел продаж. Доход приходит сразу, а роль законодателя стандартов достаётся кому-то другому."
 CHI_qwen_open_ecosystem: "Экосистема открытых весов"
 CHI_qwen_open_ecosystem_desc: "Опубликованные веса сделали платформу тем, на чём мир строит, а не тем, что он лицензирует. Прямой доход меньше, зато зависимость работает в нужную сторону."
 CHI_qwen_cloud_captive: "Облачный передовой ИИ"
 CHI_qwen_cloud_captive_desc: "Лучшие модели — причина арендовать вычисления, и нигде больше они не работают. И маржа, и переговорная сила остаются у платформы."
 CHI_zhipu_academic_pipeline: "Академический исследовательский конвейер"
 CHI_zhipu_academic_pipeline_desc: "Лаборатория готовит исследователей не меньше, чем обучает модели, а университет продолжает поставлять и тех, и другие. Коммерческая отдача скромна, чего не скажешь о кадровой базе."
 CHI_zhipu_state_procurement: "Лаборатория госзакупок"
 CHI_zhipu_state_procurement_desc: "Министерские контракты гарантируют спрос и задают направление. Финансирование стабильно — как и полное отсутствие конкурентного давления."
 CHI_doubao_consumer_scale: "Массовое потребительское внедрение"
 CHI_doubao_consumer_scale_desc: "Сотни миллионов пользователей ежедневно по цене, исключающей конкуренцию. Охват беспрецедентный, а счёт за инференс огромен."
 CHI_doubao_recommendation_core: "Рекомендательное ядро"
 CHI_doubao_recommendation_core_desc: "Исследования питают системы ранжирования, которые и так печатают деньги, а не отдельного ассистента. Без блеска, зато отдача мгновенная."
 CHI_deepseek_open_weight_release: "Открытый релиз передовой модели"
 CHI_deepseek_open_weight_release_desc: "Открыто опубликованная модель передового класса, обученная за малую долю того, что тратят лидеры рынка. Аргумент об эффективности распространяется дальше, чем сама модель."
 CHI_deepseek_state_aligned_lab: "Государственная лаборатория передового ИИ"
 CHI_deepseek_state_aligned_lab_desc: "Исследования эффективности продолжаются при государственном финансировании и надзоре. Возможности продолжают накапливаться, а результаты перестают быть публичными."
 CHI_moonshot_long_context: "Специалист по длинному контексту"
 CHI_moonshot_long_context_desc: "Сознательная ставка на длину контекста, недоступную остальным участникам рынка. Узко, зато без конкурентов там, где это срабатывает."
 CHI_moonshot_enterprise_pivot: "Корпоративное внедрение"
 CHI_moonshot_enterprise_pivot_desc: "Контрактные внедрения пришли на смену гонке за потребителем. Рост медленнее, доход предсказуем, и лаборатория переживает зиму финансирования."
 CHI_ai_lab_treasury_15_tt: "Резервы казны более §Y15 млрд§!"
 CHI_ai_lab_treasury_20_tt: "Резервы казны более §Y20 млрд§!"
 CHI_pacific_pivot_partner_exists_tt: "Как минимум одна тихоокеанская страна является §Yпартнёром тихоокеанского разворота§!"
 CHI_TAI_full_blockade_active: "Действует полная блокада Тайваня"
 CHI_semiconductor_events.320.t: "Половина Tencent за 32 миллиона"
 CHI_semiconductor_events.320.d: "Tencent сжигает деньги на мессенджере, за который никто не платит, и ни один китайский инвестор не готов его финансировать. Южноафриканский медиахолдинг MIH предлагает 32 млн долларов за 46,5% акций и оставляет управление компанией Пони Ма. Альтернатива — отечественные деньги на условиях, которые диктует Пекин."
 CHI_semiconductor_events.320.a: "Продать долю MIH"
 CHI_semiconductor_events.320.b: "Найти деньги внутри страны"
 CHI_semiconductor_events.321.t: "Tencent выходит на биржу в Гонконге"
 CHI_semiconductor_events.321.d: "Tencent может разместить свои акции на Гонконгской бирже и привлечь иностранный капитал под пользовательскую базу, которую ещё ни один рынок не оценивал. Размещение профинансирует всё, что последует за ним. Но при этом отчётность китайской компании-мессенджера каждый квартал окажется перед глазами любого, кто захочет её прочесть."
 CHI_semiconductor_events.321.a: "Разместить акции на Гонконгской бирже"
 CHI_semiconductor_events.321.b: "Остаться частной компанией и расти за счёт денежного потока"
 CHI_semiconductor_events.322.t: "Weixin"
 CHI_semiconductor_events.322.d: "Команда Tencent в Гуанчжоу, купленная ради её почтового продукта, хочет создать мобильный мессенджер, который будет напрямую конкурировать с QQ. А на QQ держится вся компания. Поддержать команду — значит профинансировать конкурента самим себе; отказать — значит оставить QQ встречать эпоху смартфонов в одиночку."
 CHI_semiconductor_events.322.a: "Дать команде из Гуанчжоу создать его"
 CHI_semiconductor_events.322.b: "Защищать QQ на смартфонах"
 CHI_semiconductor_events.323.t: "Supercell"
 CHI_semiconductor_events.323.d: "Tencent может заплатить 8,6 млрд долларов за контроль над Supercell — финской студией, создавшей Clash of Clans, — и владеть играми, а не лицензировать их для Китая. Это крупнейшая сумма, которую китайская компания когда-либо платила за игровой бизнес. Издание чужих игр не стоит ничего, но и приносит лишь малую долю этого."
 CHI_semiconductor_events.323.a: "Купить студию целиком"
 CHI_semiconductor_events.323.b: "Лицензировать и издавать чужие игры"
 CHI_semiconductor_events.324.t: "Заморозка лицензий"
 CHI_semiconductor_events.324.d: "Регуляторы перестали выдавать новые лицензии на игры и не говорят, когда возобновят, а выручка Tencent зависит от проектов, которые нельзя законно выпустить. Испарилось около 200 млрд долларов рыночной стоимости. Выстроить аппарат соответствия, которого хочет государство, — долго и дорого; перевести бизнес на зарубежные рынки — ни то, ни другое."
 CHI_semiconductor_events.324.a: "Сделать то, чего требует регулятор"
 CHI_semiconductor_events.324.b: "Перевести выручку на зарубежные рынки"
 CHI_semiconductor_events.325.t: "Чем стала Tencent"
 CHI_semiconductor_events.325.d: "Двадцать пять лет решений о том, кто финансирует Tencent, чем она владеет за рубежом и насколько прогибается перед регулятором, определили, чем стал китайский потребительский интернет."
 CHI_semiconductor_events.325.a: "Глобальный платформенный конгломерат"
 CHI_semiconductor_events.325.b: "Национальное суперприложение"
 CHI_semiconductor_events.325.c: "Лицензированный издатель игр"
 CHI_semiconductor_events.325.e: "Независимая группа мессенджеров"
 CHI_tencent_global_platform_conglomerate: "Глобальный платформенный конгломерат"
 CHI_tencent_global_platform_conglomerate_desc: "Tencent владеет студиями, платёжными сетями и мессенджерами на четырёх континентах, и большую часть зарубежных доходов получает через купленные, а не созданные компании. Эти активы стоят столько, сколько за них даёт рынок."
 CHI_tencent_domestic_superapp: "Национальное суперприложение"
 CHI_tencent_domestic_superapp_desc: "Мессенджер, платежи, транспорт и госуслуги — всё работает через одно приложение на инфраструктуре внутри Китая. Tencent перестала быть компанией, которой пользуются, и стала слоем, на котором строится всё остальное."
 CHI_tencent_licensed_games_publisher: "Лицензированный издатель игр"
 CHI_tencent_licensed_games_publisher_desc: "Tencent выпускает то, что одобряет регулятор, и в сроки, которые он устанавливает, а одобрения приходят, потому что аппарат соответствия был выстроен раньше, чем его потребовали. Бизнес стал меньше, зато стабильнее."
 CHI_tencent_independent_messaging: "Независимая группа мессенджеров"
 CHI_tencent_independent_messaging_desc: "Tencent сохранила QQ, сохранила своих инженеров и осталась в стороне от споров, поглотивших остальной китайский интернет. Её охват так и не вышел за пределы мессенджера."
 CHI_semiconductor_events.330.t: "Двадцать миллионов из Токио"
 CHI_semiconductor_events.330.d: "Масаёси Сон предложил Alibaba 20 млн долларов после встречи, длившейся несколько минут, и SoftBank хочет получить крупную долю в компании, у которой нет выручки. Джек Ма может взять японские деньги вместе с вопросом о собственности, который к ним прилагается. Или же начать брать плату с экспортёров на сайте уже сейчас, пока они ещё только разбираются, зачем он нужен."
 CHI_semiconductor_events.330.a: "Взять деньги SoftBank"
 CHI_semiconductor_events.330.b: "Брать плату с продавцов и финансироваться самостоятельно"
 CHI_semiconductor_events.331.t: "Taobao против eBay"
 CHI_semiconductor_events.331.d: "eBay владеет EachNet, а вместе с ним и большей частью потребительской торговли в Китае, и уже объявила рынку, что борьба окончена. Alibaba может посадить команду в квартире в Ханчжоу и создать конкурента, который будет бесплатным для продавцов столько, сколько потребуется. Остаться в торговле B2B выгодно, но это навсегда уступит потребительский рынок."
 CHI_semiconductor_events.331.a: "Создать Taobao и не брать плату с продавцов"
 CHI_semiconductor_events.331.b: "Держаться за торговлю B2B"
 CHI_semiconductor_events.332.t: "Миллиард от Yahoo"
 CHI_semiconductor_events.332.d: "Yahoo заплатит миллиард долларов и передаст свой китайский бизнес за 40% Alibaba — это крупнейшая иностранная инвестиция в китайскую интернет-компанию в истории. Эти деньги закроют вопрос финансирования на десятилетие. Но они же дадут иностранцу место в совете директоров компании, которая управляет торговлей страны."
 CHI_semiconductor_events.332.a: "Взять миллиард вместе с местом в совете директоров"
 CHI_semiconductor_events.332.b: "Сохранить китайский реестр акционеров"
 CHI_semiconductor_events.333.t: "Alipay покидает группу"
 CHI_semiconductor_events.333.d: "Центральный банк будет выдавать лицензии только платёжным операторам в отечественных руках, и Alipay переведена в компанию, которую контролирует Джек Ма, без согласования с советом директоров Alibaba. Директора узнали об этом постфактум. Отменить передачу — значит вместо этого добиваться лицензии у регулятора, а платёжный бизнес Alibaba всё это время будет заморожен."
 CHI_semiconductor_events.333.a: "Сохранить передачу и договориться с акционерами"
 CHI_semiconductor_events.333.b: "Отменить её и добиваться лицензии"
 CHI_semiconductor_events.334.t: "Размещение Ant остановлено"
 CHI_semiconductor_events.334.d: "Размещение акций Ant Group, крупнейшее в истории, приостановлено за два дня до начала торгов — после того как Джек Ма заявил в Шанхае, что регуляторы управляют ломбардом. Alibaba может отозвать размещение и перестроить Ant в поднадзорный финансовый холдинг. Настаивать на своём — значит проверить, позволит ли государство частной компании держать такую долю китайского кредитования."
 CHI_semiconductor_events.334.a: "Отозвать размещение и принять надзор"
 CHI_semiconductor_events.334.b: "Настаивать на размещении"
 CHI_semiconductor_events.335.t: "Чем стала Alibaba"
 CHI_semiconductor_events.335.d: "Четверть века решений об иностранном капитале, потребительской торговле и о том, какую долю китайских финансов может держать одна частная компания, определили, чем стала Alibaba."
 CHI_semiconductor_events.335.a: "Поднадзорный хребет торговли"
 CHI_semiconductor_events.335.b: "Открытая потребительская площадка"
 CHI_semiconductor_events.335.c: "Торговый дом на иностранном капитале"
 CHI_semiconductor_events.335.e: "Оптовый экспортный брокер"
 CHI_alibaba_supervised_commerce_backbone: "Поднадзорная основа торговли"
 CHI_alibaba_supervised_commerce_backbone_desc: "Склады, службы доставки и центры обработки данных внутри Китая обеспечивают большую часть того, что покупает страна, а над проходящими через них кредитами стоит регулятор. Alibaba перестала спорить о том, кто её контролирует, и построила то, что невозможно заменить."
 CHI_alibaba_open_consumer_marketplace: "Открытая потребительская площадка"
 CHI_alibaba_open_consumer_marketplace_desc: "Любой может выставить товар, а платформа берёт свою долю с продаж. Alibaba так и не приняла надзор над своим финансовым подразделением, и такое положение сохраняется, пока никто не настаивает."
 CHI_alibaba_foreign_capitalised_trading_house: "Торговый дом с иностранным капиталом"
 CHI_alibaba_foreign_capitalised_trading_house_desc: "Alibaba ведёт торговлю, а иностранные акционеры — реестр. Капитал ушёл дальше, чем сам бизнес."
 CHI_alibaba_wholesale_export_broker: "Оптовый экспортный посредник"
 CHI_alibaba_wholesale_export_broker_desc: "Alibaba сводит китайские фабрики с иностранными покупателями и берёт комиссию за знакомство. Она никогда не касалась потребительского рынка, и ей не требовалось ничьё разрешение, чтобы продолжать работу."
 CHI_semiconductor_events.340.t: "У Toutiao нет редакторов"
 CHI_semiconductor_events.340.d: "Новостное приложение ByteDance ранжирует материалы по тому, что открывают читатели, а не по выбору редактора, и Чжан Имин вообще не хочет ставить над ним редакцию. Машина находит аудиторию быстрее любой редакции. Но она же будет подавать всё, на что эта аудитория продолжает кликать, и рано или поздно кто-нибудь спросит, кто это решил."
 CHI_semiconductor_events.340.a: "Пусть решает система ранжирования"
 CHI_semiconductor_events.340.b: "Поставить редакцию над лентой"
 CHI_semiconductor_events.341.t: "Douyin"
 CHI_semiconductor_events.341.d: "ByteDance может применить ту же систему ранжирования к пятнадцатисекундным видео и позволить ей выбирать, что незнакомый человек увидит следующим. Модель создавалась исключительно для текста. Оставить её на новостях — значит держаться за бизнес, который уже работает."
 CHI_semiconductor_events.341.a: "Применить систему ранжирования к коротким видео"
 CHI_semiconductor_events.341.b: "Оставить её для новостей и текста"
 CHI_semiconductor_events.342.t: "Чжан Имин извиняется"
 CHI_semiconductor_events.342.d: "Регуляторы навсегда закрыли Neihan Duanzi и удалили Toutiao из магазинов приложений, заявив ByteDance, что её алгоритм опередил основные ценности социализма. Чжан Имин может опубликовать самокритику и нанять тысячи модераторов, которых ждёт государство. Оспорить предписание — значит доказывать, что результат работы машины не является высказыванием компании."
 CHI_semiconductor_events.342.a: "Опубликовать извинения и нанять модераторов"
 CHI_semiconductor_events.342.b: "Оспорить предписание"
 CHI_semiconductor_events.343.t: "Продать TikTok или потерять его"
 CHI_semiconductor_events.343.d: "Вашингтон приказал ByteDance продать американский бизнес TikTok, и Oracle с Walmart за считаные недели собрали заявку. Пекин только что внёс рекомендательные алгоритмы в свой список экспортного контроля, так что модель не может покинуть страну без лицензии. ByteDance может отказаться её экспортировать и потерять американский рынок или передать технологию вместе с компанией."
 CHI_semiconductor_events.343.a: "Отказаться экспортировать алгоритм"
 CHI_semiconductor_events.343.b: "Продать американский бизнес вместе с технологией"
 CHI_semiconductor_events.344.t: "Продать или получить запрет"
 CHI_semiconductor_events.344.d: "Конгресс дал ByteDance меньше года на продажу американского подразделения TikTok под угрозой удаления из магазинов приложений, и единственный оставшийся путь — суды. Судебная тяжба сохранит компанию целой ценой немалых затрат и всё равно может провалиться. Выделение американского бизнеса завершит борьбу — а вместе с ней и владение."
 CHI_semiconductor_events.344.a: "Судиться и сохранить компанию целиком"
 CHI_semiconductor_events.344.b: "Выделить американский бизнес"
 CHI_semiconductor_events.345.t: "Чем стала ByteDance"
 CHI_semiconductor_events.345.d: "Четырнадцать лет решений о том, кто ранжирует ленту, кто её проверяет и может ли модель покинуть Китай, определили, чем стала ByteDance."
 CHI_semiconductor_events.345.a: "Суверенный рекомендательный движок"
 CHI_semiconductor_events.345.b: "Глобальная платформа внимания"
 CHI_semiconductor_events.345.c: "Лицензированная информационная служба"
 CHI_semiconductor_events.345.e: "Редакционная новостная группа"
 CHI_bytedance_sovereign_recommendation_engine: "Суверенная рекомендательная система"
 CHI_bytedance_sovereign_recommendation_engine_desc: "Модель, решающая, что миллиард людей увидит дальше, обучена в Китае, работает в Китае и не может быть экспортирована без лицензии. ByteDance предпочла отказаться от американского рынка, чем отдать веса модели."
 CHI_bytedance_global_attention_platform: "Глобальная платформа внимания"
 CHI_bytedance_global_attention_platform_desc: "ByteDance дотянулась дальше, чем любая китайская компания до неё, но на условиях, которые иностранные правительства пересматривают, когда захотят. Аудитория реальна, а разрешение не вечно."
 CHI_bytedance_licensed_information_utility: "Лицензированная информационная служба"
 CHI_bytedance_licensed_information_utility_desc: "ByteDance ранжирует то, что ей разрешено ранжировать, и проверяет всё до показа. Регулятор перестал считать её проблемой."
 CHI_bytedance_editorial_news_group: "Редакционная новостная группа"
 CHI_bytedance_editorial_news_group_desc: "ByteDance сохранила редакцию над лентой и так и не создала видеоплатформу. Она публикует новости, а споры о том, кто выбирает ранжирование, так и не возникли."
 CHI_TAI_intl_org_blockade_embargo_tt: "Каждая страна, всё ещё признающая [TAI.GetNameWithFlag], попадает под §Yторговое эмбарго§!."
 CHI_taiwan_us_support_collapse_tt: "$CHI_taiwan_us_support$ падает до §Y0§!"
 china_sar.049.t: "Вашингтон отзывает гарантии"
 china_sar.049.d: "США уведомили Тайбэй, что их гарантии безопасности больше не действуют, а статус Тайваня как главного союзника вне НАТО отозван. Поставки оружия приостановлены, совместные учения отменены, а штат связных сокращён до символического присутствия. Тайвань остался без своего важнейшего гаранта безопасности."
 china_sar.049.a: "Нам придётся защищаться самим."
 CHI_changhe_aircraft_corp_tank_manufacturer: "Changhe Aircraft Industries Corporation"
 CHI_chengdu_aircraft_corp_aircraft_manufacturer: "Chengdu Aircraft Industry Group"
 CHI_china_south_industries_group_materiel_manufacturer: "China South Industries Group Corporation"
 CHI_china_state_shipbuilding_corporation_naval_manufacturer: "China State Shipbuilding Corporation"
 CHI_shenyang_aircraft_corp_aircraft_manufacturer: "Shenyang Aircraft Corporation"
 CHI_xian_aircraft_corp_aircraft_manufacturer: "Xi'an Aircraft Industrial Corporation"
 CHI_outer_mongolia_expansion: "Возвращение Внешней Монголии"
 CHI_outer_mongolia_expansion_desc: "Вопрос Внутренней Монголии решён, и теперь на повестке дня — решение вопроса Внешней Монголии. Этому уродливому порождению Ялтинского соглашения пришёл конец. Монгольская степь к северу и югу от пустыни Гоби наконец окажется под одним флагом."
 CHI_outer_mongolia_assimilation: "Ассимиляция Внешней Монголии"
 CHI_outer_mongolia_assimilation_desc: "Прошло почти столетие со вторжения Унгерна, и китайские пограничники снова патрулируют границу у Кяхты."
 CHI_casic_df17_glide_body: "Планирующий блок DF-17"
 CHI_casic_dfzf_test_range: "Полигон DF-ZF"
 CHI_cssc_hudong_auxiliary_line: "Вспомогательная линия Hudong"
 CHI_cssc_type_901_fast_support: "Корабли быстрого снабжения типа 901"
 CHI_cssc_type_903_replenishment: "Танкеры снабжения типа 903"
 CHI_cssc_type_926_tender: "Плавбазы типа 926"
 CHI_norinco_trait_sharp_claw_ugv: "Беспилотная наземная машина Sharp Claw"
 CHI_norinco_trait_vu_t2_autonomy: "Автономность VU-T2"
 CHI_russian_arms_dependency_2: "$CHI_russian_arms_dependency$"
 CHI_russian_arms_dependency_2_desc: "Народно-освободительная армия была создана на основе советских и российских образцов. Её стрелковое оружие изначально представляло собой модель «Тип 56» — лицензионную версию «Калашникова», а бронетанковые войска сформировались на базе танка «Тип 59», являвшегося прямой копией советского Т-54А; более поздние модели танков и боевых машин пехоты по-прежнему отражают линейку Т-72 и БМП. Артиллерия, транспортные средства и батареи противовоздушной обороны имеют общие корни. Наиболее глубокая зависимость наблюдается в области силовых установок: двигатель АЛ-31Ф устанавливается на истребители J-10 и J-11, двигатель РД-93 — на истребители JF-17, а истребители Су-35 и батареи С-400 были напрямую закуплены в Москве. Каждая линейка отечественных истребителей зависит от российской турбины, за каждую лицензионную модель выплачиваются роялти, а конструкторские бюро по-прежнему больше копируют, чем создают. Пока Китай не создаст собственную военно-промышленную базу, сердце армии будет биться в ритме России.\n§W--------------§!\nНаша военная самодостаточность растёт благодаря фокусам оборонной промышленности, таким как §Y$CHI_norinco_rationalism$§!, §Y$CHI_own_designs$§! и §Y$CHI_ws15_bottleneck_solve$§!, а также решениям §Y$CHI_invest_domestic_arms_lines$§! и §Y$CHI_localise_licensed_system$§!. Этот национальный дух §Gулучшится§!, когда самодостаточность превысит §Y50§!."
 CHI_russian_arms_dependency_3: "$CHI_russian_arms_dependency$"
 CHI_russian_arms_dependency_3_desc: "Народно-освободительная армия была создана на основе советских и российских образцов. Её стрелковое оружие изначально представляло собой модель «Тип 56» — лицензионную версию «Калашникова», а бронетанковые войска сформировались на базе танка «Тип 59», являвшегося прямой копией советского Т-54А; более поздние модели танков и боевых машин пехоты по-прежнему отражают линейку Т-72 и БМП. Артиллерия, транспортные средства и батареи противовоздушной обороны имеют общие корни. Наиболее глубокая зависимость наблюдается в области силовых установок: двигатель АЛ-31Ф устанавливается на истребители J-10 и J-11, двигатель РД-93 — на истребители JF-17, а истребители Су-35 и батареи С-400 были напрямую закуплены в Москве. Каждая линейка отечественных истребителей зависит от российской турбины, за каждую лицензионную модель выплачиваются роялти, а конструкторские бюро по-прежнему больше копируют, чем создают. Пока Китай не создаст собственную военно-промышленную базу, сердце армии будет биться в ритме России.\n§W--------------§!\nНаша военная самодостаточность растёт благодаря фокусам оборонной промышленности, таким как §Y$CHI_norinco_rationalism$§!, §Y$CHI_own_designs$§! и §Y$CHI_ws15_bottleneck_solve$§!, а также решениям §Y$CHI_invest_domestic_arms_lines$§! и §Y$CHI_localise_licensed_system$§!. Этот национальный дух §Gулучшится§!, когда самодостаточность превысит §Y75§!."
 CHI_russian_arms_dependency_4: "$CHI_russian_arms_dependency$"
 CHI_russian_arms_dependency_4_desc: "Народно-освободительная армия была создана на основе советских и российских образцов. Её стрелковое оружие изначально представляло собой модель «Тип 56» — лицензионную версию «Калашникова», а бронетанковые войска сформировались на базе танка «Тип 59», являвшегося прямой копией советского Т-54А; более поздние модели танков и боевых машин пехоты по-прежнему отражают линейку Т-72 и БМП. Артиллерия, транспортные средства и батареи противовоздушной обороны имеют общие корни. Наиболее глубокая зависимость наблюдается в области силовых установок: двигатель АЛ-31Ф устанавливается на истребители J-10 и J-11, двигатель РД-93 — на истребители JF-17, а истребители Су-35 и батареи С-400 были напрямую закуплены в Москве. Каждая линейка отечественных истребителей зависит от российской турбины, за каждую лицензионную модель выплачиваются роялти, а конструкторские бюро по-прежнему больше копируют, чем создают. Пока Китай не создаст собственную военно-промышленную базу, сердце армии будет биться в ритме России.\n§W--------------§!\nНаша военная самодостаточность растёт благодаря фокусам оборонной промышленности, таким как §Y$CHI_norinco_rationalism$§!, §Y$CHI_own_designs$§! и §Y$CHI_ws15_bottleneck_solve$§!, а также решениям §Y$CHI_invest_domestic_arms_lines$§! и §Y$CHI_localise_licensed_system$§!. Этот национальный дух будет §Rудалён§!, когда самодостаточность достигнет §Y100§!."
 CHI_local_government_debt: "Долг местных органов власти"
 CHI_local_government_debt_desc: "Провинциальные и муниципальные власти не могут открыто занимать деньги, поэтому привлекают средства через финансовые платформы, закладывающие будущие продажи земли под банковские кредиты и облигации. Эти средства идут на заводы, офисные парки и инфраструктуру, за которые поощряют при оценке кадров, и каждый проект сверх того, что способна выдержать бюджетная система, пополняет гору долгов, которую центральное правительство никогда официально не гарантировало. Банки пролонгируют кредиты вместо списания, проценты поглощают растущую долю местных бюджетов, а истинный размер обязательств скрыт в трастовых продуктах и внебалансовом кредитовании. Когда Пекин вынужден снижать долговую нагрузку, кредит сжимается, стройки замирают, и модель роста, построенная на заёмных земельных доходах, начинает распадаться.\n§W--------------§!\nДолговое давление на местные бюджеты растёт каждый месяц, пока число наших заводов и офисных парков превышает бюджетную устойчивость, и медленно снижается, когда не превышает. Фокусы §Y$CHI_shadow_banking_cleanup$§!, §Y$CHI_three_red_lines_crackdown$§! и §Y$CHI_common_prosperity$§! снижают давление, фокусы §Y$CHI_policy_banks_cdb$§! и §Y$CHI_wto_commercial_bank_reform$§! повышают устойчивость, а решение §Y$CHI_provincial_debt_swap$§! напрямую гасит долг. Стимулирующие фокусы, такие как §Y$CHI_four_trillion_stimulus$§!, повышают давление. Этот национальный дух §Gулучшится§!, когда давление упадёт ниже §Y90§!."
 CHI_local_government_debt_2: "$CHI_local_government_debt$"
