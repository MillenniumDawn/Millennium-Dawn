 GER_infantry_weapons_short: "G3"
 GER_APC_1: "M113G"
 GER_APC_1_desc: "M113G был немецким экспортным вариантом американского M113. M113G часто имел в передней части машины блок из восьми 76-мм дымовых гранатометов и был вооружен пулеметами Rheinmetall MG3 вместо более распространенного пулемета M2 калибра .50."
 GER_APC_2: "Condor"
 GER_APC_2_desc: "Condor — колёсный бронетранспортёр с колёсной формулой 4х4, первоначально разработанный немецкой фирмой Thyssen-Henschel и выпускаемый компанией Henschel Wehrtechnik GmbH. Корпус Condor выполнен из цельносварной броневой стали, защищающей экипаж от 7,62-мм бронебойных пуль и 5,56-мм обычных пуль, осколков снарядов и противопехотных мин. Башня Condor вооружена 20-мм основной пушкой и спаренным 7,62-мм пулемётом."
 GER_APC_3: "Tpz-1 Fuchs"
 GER_APC_3_short: "Tpz-1 Fuchs"
 GER_APC_3_desc: "TPz-1 Fuchs (Transportpanzer Fuchs) - немецкий бронетранспортер, первоначально разработанный компанией Daimler-Benz, но произведенный и доработанный теперь уже компанией Rheinmetall MAN Military Vehicles (RMMV). Fuchs стал вторым колесным бронетранспортером, поступившим на вооружение бундесвера (западногерманских вооруженных сил). На Fuchs может устанавливаться до 3х пулеметов MG3."
 GER_APC_4: "Tpz-1 Fuchs Mexas"
 GER_APC_4_short: "Tpz-1 Fuchs Mexas"
 GER_APC_4_desc: "Tpz-1 Fuchs MEXAS - модернизированный TPz-1 Fuchs, оснащенный новой керамической броней типа MEXAS, противоосколочной облицовкой и улучшенной противоминной защитой, включая систему постановки помех для защиты от радиоуправляемых мин."
 GER_APC_5: "Tpz-2 Fuchs"
 GER_APC_5_short: "Tpz-2 Fuchs"
 GER_APC_5_desc: "TPz-2 Fuchs является дальнейшей и модернизированной версией TPz-1 Fuchs. Максимальная грузоподъёмность Fuchs 2 составляет 6000 кг, силовая установка — 11,9-литровый дизель MTU 6V 199 TE20 V6 с водяным охлаждением, отвечающий нормам EURO 3, развивающий мощность 456 л.с. (340 кВт) и агрегатируемый с полностью автоматической шестиступенчатой коробкой передач ZF 6HP 602 с интегрированным ретардером. Шины 1400 R20 — типа run-flat (сохраняют подвижность при проколе). Максимальная скорость на суше составляет 105 км/ч (65 миль/ч), а запас хода — 800 км."
 GER_APC_6: "GTK Boxer"
 GER_APC_6_short: "Boxer"
 GER_APC_6_desc: "GTK Boxer — многоцелевая боевая бронированная машина, разработанная международным консорциумом для выполнения ряда задач с помощью сменных модулей. Большинство стоящих на вооружении Boxer оснащены дистанционно управляемым боевым модулем для самообороны. На немецких машинах обычно устанавливается модуль FLW-200 фирмы KMW, который может быть оснащён 7,62-мм пулемётом MG3, 12,7-мм крупнокалиберным пулемётом M3M либо 40-мм автоматическим гранатомётом GMW. FLW-200 имеет двухосевую стабилизацию, оснащён лазерным дальномером и тепловизором."
 GER_APC_7: "GTK Boxer OS"
 GER_APC_7_short: "Boxer OS"
 GER_APC_7_desc: "На GTK Boxer OS установлен зенитный модуль Oerlikon Skyranger. Он вооружён револьверной пушкой Rheinmetall калибра 35 мм x 228, имеющей двойную систему подачи боеприпасов, позволяющую выбирать два типа снарядов. В первую очередь это 35-мм боеприпасы повышенной эффективности поражения и уничтожения (AHEAD). Вторичным будет боеприпас Frangible Armour-Piercing Discarding Sabot (FAPDS). Циклическая скорострельность орудия составляет 1000 выстрелов в минуту, при этом типичная воздушная цель поражается очередью из 20-24 выстрелов."
 GER_APC_8: "GTK Boxer RWS40"
 GER_APC_8_short: "Boxer RCT40"
 GER_APC_8_desc: "GTK Boxer RWS40 является модернизированным вариантом стандартного GTK Boxer. Вариант RWS40 имеет новые и усовершенствованные системы целеуказания и навигации, новые оптические датчики, а также новую башню системы CROWS, вооруженную 40-мм основной пушкой и новым 6,8-мм коаксиальным пулеметом."
 GER_IFV_1_desc: "Lang HS.30 — западногерманская боевая машина пехоты, разработанная компанией Hispano-Suiza в 1960-х годах. Из-за некоторых ранних проблем с механикой было построено всего 2176 машин из запланированных 10 680. HS.30 была оснащена мощной 20-миллиметровой автоматической пушкой и перископическим прицелом 15x15."
 GER_IFV_2: "Schützenpanzer Marder 1"
 GER_IFV_2_short: "Marder 1"
 GER_IFV_2_desc: "Marder 1 — это БМП, разработанная компанией Rheinmetall Landsysteme для западногерманских подразделений Panzergrenadiere. Marder 1 вооружена 20-мм автоматической пушкой и способна перевозить 12 пехотинцев. Помимо мощного наступательного потенциала, Marder 1 имеет защиту от ядерного, биологического и химического оружия."
 GER_IFV_3: "Schützenpanzer Marder 1 A1"
 GER_IFV_3_short: "Marder 1 A1"
 GER_IFV_3_desc: "Marder 1 A1 - это модернизированная модель, оснащенная ПТРК Milan, системой двойного питания для 20-мм пушки, позволяющей выбирать боеприпасы, приборами ночного видения, включая усилители изображения и тепловизор. Кроме того, в результате модернизации численность пехоты сократилась с 12 до 5 человек."
 GER_IFV_4: "Schützenpanzer Marder 1 A2"
 GER_IFV_4_short: "Marder 1 A2"
 GER_IFV_4_desc: "Marder 1 A2 - еще один пакет модернизации, включающий существенную доработку подвески, топливных баков, системы охлаждения и водоструйной очистки. Дополнительно была установлена новая прицельная система. Инфракрасное поисковое световое оборудование было демонтировано, и все машины были оснащены тепловизорами."
 GER_IFV_5: "Schützenpanzer Marder 1 A5"
 GER_IFV_5_short: "Marder 1 A5"
 GER_IFV_5_desc: "Пакет модернизации Marder 1 A5 включает в себя дополнительную противоминную броню и полностью переделанный салон, позволяющий избежать взрывных и ударных травм экипажа при подрыве на мине, систему кондиционирования воздуха, постановщик помех для защиты от СВУ и многоспектральный камуфляж."
 GER_IFV_6: "Schützenpanzer Puma 1"
 GER_IFV_6_short: "Puma 1"
 GER_IFV_6_desc: "Puma — это совместный проект БМП компаний Krauss-Maffei Wegmann и Rheinmetall Landsysteme. Основное вооружение Puma — 30-мм автоматическая пушка Rheinmetall MK 30-2/ABM (Air Burst Munitions), имеющая скорострельность 200 выстрелов в минуту и эффективную дальность стрельбы 3000 м. Помимо впечатляющей основной пушки, Puma обеспечивает превосходную защиту от снарядов и взрывчатых веществ."
 GER_IFV_7: "Schützenpanzer Lynx KF-41"
 GER_IFV_7_short: "Lynx KF-41"
 GER_IFV_7_desc: "Lynx KF-41 — это боевая машина пехоты нового поколения. Lynx — это новая модульная конструкция, способная адаптироваться к различным ролям и требованиям. Основная боевая машина пехоты Lynx оснащена множеством различных технологий и функций, в том числе полностью цифровой системой управления и наведения, а также различными комплектами для повышения живучести в миротворческих операциях, борьбе с повстанцами в городских условиях и в бою с равным противником.\nОсновное вооружение состоит из 35-миллиметровой автоматической пушки Wotan и противотанковых управляемых ракет. Lynx защищён превосходной композитной бронёй, системой активной защиты Rheinmetall ADS и системой дымовых завес ROSY."
 GER_IFV_8: "Schützenpanzer Cougar KF-73"
 GER_IFV_8_short: "Cougar KF-73"
 GER_IFV_8_desc: "Cougar KF-73 — это БМП будущего. Cougar — модернизированная и более крупная конструкция на базе Lynx KF-41. Cougar имеет более крупное и лучше бронированное шасси, оснащённое динамической защитой (ERA). Cougar также вооружён 82-мм пушкой, 40-мм автоматической пушкой, спаренным пулемётом MG4 и ПТУР. Помимо высокой огневой мощи, Cougar отлично защищён системой активной защиты нового поколения."
