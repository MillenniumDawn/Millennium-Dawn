 ag_weapons_5: "초첨단 공대지 무기"
 ag_weapons_5_desc: "원거리 타격 무기와 항력식 폭탄의 큰 발전으로 항공기는 목표물을 신속하게 교전하고 파괴할 수 있으며, 때로는 적의 무기 사거리에 들어가지 않고도 가능합니다."
