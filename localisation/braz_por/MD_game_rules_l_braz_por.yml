 RULE_SPREAD_INFLUENCE_0_COOLDOWN_DESC: "Sem tempo de recarga para propagar a influência, para quando você quiser gastar todo o seu §HPoder Político§! influenciando outras nações!"
 RULE_SPREAD_INFLUENCE_60_COOLDOWN: "60 Dias"
 RULE_SPREAD_INFLUENCE_60_COOLDOWN_DESC: "A cada 60 dias, você pode propagar sua influência para outra nação."
