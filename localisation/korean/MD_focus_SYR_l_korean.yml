 TT_SYR_AGRICULTURAL_SUBSIDIES_DECREASED_FOCUS: "추가 지출: GDP의 $§G-0.04%§!"
 SYR_Get_rid_of_oligarchs: "Purge The Oligarchs"
 SYR_Get_rid_of_oligarchs_desc: "과두 계층은 우리 제도에 뿌리내리고 있으며 우리나라의 미래에 대한 명백한 위협입니다. 우리는 부패 혐의로 이들을 체포하고 손에 넣을 수 있는 재산을 몰수할 것입니다."
 SYR_kick_out_iran: "Kick Out Iran"
 SYR_kick_out_iran_desc: "이란은 언제나 우리를 자신들의 지배 아래 두었으며, 우리가 그들과의 관계를 유지할 이유가 없습니다. 이 이념적 적들을 시리아에서 쫓아낼 적기입니다!"
 SYR_islamist_renaissance: "이슬람의 부흥"
 SYR_islamist_renaissance_desc: "우리의 승리는 대중 사이에서 우리에 대한 지지를 더욱 대담하게 만들었습니다. 새로운 문화가 발전했으며, 우리는 이를 전적으로 지지합니다."
 SYR_subsidise_police: "경찰 보조금 지급"
 SYR_subsidise_police_desc: "경찰은 국민이 안전하다고 느끼게 하고 시리아에서 우리의 통치를 보장하는 가장 중요한 요소 중 하나이지만, 지금까지 재정 지원이 매우 부족했습니다. 이는 바뀌어야 합니다."
 SYR_empower_sharia_courts: "샤리아 법에게 권한을"
 SYR_empower_sharia_courts_desc: "이슬람 사법부에 힘을 실어주고 그 영향력을 확대할 때입니다."
 SYR_religious_values: "Our Values Unwavering"
 SYR_religious_values_desc: "대중을 달래고 이미지를 완화하려던 이전 정책들 때문에 우리 이상이 기반한 참된 가치에서 벗어나게 되었는지도 모릅니다. 우리는 타인이 우리를 어떻게 보는지에 신경 쓰지 않으며, 아무리 인기가 없더라도 우리 땅에 샤리아를 확립하는 것이 유일한 목표입니다."
 SYR_islamic_socialism: "이슬람 사회주의"
 SYR_islamic_socialism_desc: "사람들은 이슬람이 자카트와 사다카처럼 사회주의에서 비롯되었다고 여겨지는 많은 관행을 옹호한다는 사실을 잊는 듯합니다. 우리의 이상을 이 관계에 기반을 두어 이를 강조해야 하며, 이는 늘 우리 이상에 반대해 온 이슬람주의자들의 지지도 모을 것입니다. 이슬람 사회주의는 우리나라를 현대적이고 강하며 덕망 있는 공화국으로 만드는 참된 길입니다."
 SYR_federalisation: "Federalisation"
 SYR_federalisation_desc: "해결책은 각 주에 더 많은 권력을 부여하는 것입니다. 이는 지역 대표성과 포용성을 크게 장려하고 종파적 공포와 긴장을 크게 완화할 것입니다. 그러나 이러한 자치는 특히 소수 집단이 존재하는 주에 대한 우리의 장악력을 약화시킬 것입니다."
 SYR_republicanism: "Republicanism"
 SYR_republicanism_desc: "시리아는 중앙집권적 권위를 지닌 강력한 국가로 통치하는 것이 최선입니다. 이는 우리 정부의 통치를 강화하겠지만, 소외감을 느끼는 소수 집단의 반감과 분노를 불러일으킬 것입니다."
 syria_agricultural_subsidies: "농업 보조금"
 syria_agricultural_subsidies_desc: "시리아는 국내 밀과 목화 생산을 확보하기 위해 GDP의 4%를 지역 농민 지원에 사용하는 농업 보조금 제도를 운용하고 있습니다. 지원은 주로 경유 가격과 목화 가격에 대한 보조금 형태로 이루어집니다."
 autonomous_region_syr: "지역 자동화"
 syria_bakdash: "바크다쉬 (Bakdash)"
 syria_bakdash_desc: "박다시는 다마스쿠스에서 영업하는 100년 넘은 아이스크림 가게로 부자 스타일 아이스크림으로 유명합니다. 정부는 이 아이스크림 가게가 국제 시장으로 진출하도록 돕기로 결정했습니다."
 syria_natsec_constitution: "반자유주의적 민주주의"
 syria_natsec_constitution_desc: "집권 시리아 국민협약당은 시리아 대통령이 어떤 종교를 가진 사람이라도 될 수 있도록 헌법을 개정했습니다. 이는 무슬림을 대통령으로 지명해 온 수십 년의 전통을 깨고 이상적인 형태의 민주주의를 실천한 것입니다. 그러나 이것이 아무리 진보적으로 들리더라도, 시리아는 본질적으로 비자유주의적인 민주주의를 채택해 왔습니다. 이는 때로 경제적, 정치적 자유를 희생하면서까지 국가 안보와 주권을 우선시하는 민주주의입니다. 시리아가 포퓰리즘 우파 노선을 지속하도록 보장합니다."
 syria_nationalist_rise: "국가주의 부활"
 syria_nationalist_rise_desc: "시리아에서 민족주의가 그 어느 때보다 인기를 얻고 있습니다. 이는 국가에 대한 외세의 간섭에 대한 정부의 명확한 반대와 국가의 주권 및 독립에 대한 확고한 지지 때문입니다."
 syria_federal_government: "연방 국가"
 syria_federal_government_desc: "시리아는 지역들이 자치 행정부에 의해 통치되는 연방제 정부 체제를 채택했습니다."
 syria_bureaucratic_government: "관료제 국가"
 syria_bureaucratic_government_desc: "시리아는 국가가 선출된 관료제에 의해 통치되는 중앙집권제 정부 체제를 채택했습니다."
 SyriaFocus.89.t: "The Elections"
 SyriaFocus.89.d: "Our first free and fair elections are finally taking place. Many people are racing to the ballots to vote for what they support and three popular forces arose. One, led by the [socialism_L] and [liberalism_L] offers an inclusive type of government that ensures equal representation for all basing their entire ideology on secular grounds that aim to unite the country's diverse people into a western-style democratic government with empowered parliament and liberal institutions. The other is an Islamist coalition led by [Neutral_Muslim_Brotherhood_L] aiming to achieve what it calls a popular islamist republic that follows Islamic teachings and Sharia law. While not much addressing the religious diversity of the country they focused on the nostalgia of conservative rule and gathered support from zealous Sunni Islamist people and moderate conservatives in the country. A third powerful yet more fractured force has totally different plans based on the legacy of the previous government. The NPF or National Progressive Front has re-established itself as the torch-bearer of what they see as the true ideals and policies bringing the country to greatness and stability gathering support from reform-minded Ba'athists and nationalists aiming for a strong government that is truly capable with its members being from the politically powerful parliamentarians of the previous government. The NPF is divided between [anarchist_communism_L] and [Nat_Populism_L] the former advocating Nasserism and the latter Pan-Syrian nationalism. While the two parties differ they both share the same policies desired for implementation centered around populist framework exploitive of the various economic and social threats arising such as recent rise in terrorism and economic backwardness by promising to end these concerns swiftly without the hassle of democratic decision-making. So with the polls cast the victor is:"
 SyriaFocus.89.a: "The Islamists"
 SyriaFocus.89.b: "The Secular Opposition"
 SyriaFocus.89.c: "The National Progressive Front"
 SyriaFocus.90.t: "The secular opposition winner"
 SyriaFocus.90.d: "세속 야권이 승리한 것으로 보입니다. 그리고 가장 많은 표를 얻은 정당은 다음과 같습니다."
 SyriaFocus.90.a: "The social democrats"
 SyriaFocus.91.t: "Government expansion"
 SyriaFocus.91.d: "이제 우리가 집권하였으므로, 지지 기반을 넓혀 추가 개혁을 수행할 수 있도록 입지를 굳혀야 합니다. 두 정당이 일정한 조건을 걸고 우리와의 연대를 제안하였습니다. 작지만 야심 찬 한 정당은 권력 구조를 분산하고 직접민주주의 구상을 도입하려는 연방주의자들이 이끌고 있습니다. 다른 한 정당은 질서와 정의를 이루는 유능한 통합 세력이 될 수 있는 중앙집권적 관료 권력 기반을 추구하며 연방 방식에 전면 반대하는 포퓰리스트 공화주의자들이 이끌고 있습니다. 우리가 연대할 상대는 다음과 같습니다."
 SyriaFocus.91.a: "The federalists"
 SyriaFocus.92.t: "Lack of voluntary organizations persist"
 SyriaFocus.92.d: "국민이 전국적이고 반종파적인 단체를 결성하도록 지원하고 장려한 우리의 노력은 눈에 띄는 성과를 내지 못했습니다. 국민은 여전히 우리 정부를 신뢰하지 않고 나라에 소속감을 느끼지 못하여 종파를 중심으로 모이는 쪽을 택하고 있으며, 그 결과 깊은 민족 분열이 지속되고 있습니다. 서로 다른 민족적 배경과 종파의 사람들을 하나로 묶는 것은 매우 어렵지만 충분히 가능한 일이며, 우리 정부와 정치 과정에 대한 소수 집단의 신뢰를 높인 뒤 다시 시도해야 합니다."
 SyriaFocus.92.a: "We have to unite our people"
 SyriaFocus.93.t: "Unchanged local accountability"
 SyriaFocus.93.d: "정부와 수도를 대표하는 지방 관료의 책임성을 높이려는 우리의 노력은 눈에 띄는 성과를 내지 못했습니다. 그 원인은 낮은 정부 투명성, 높은 부패, 수사 권한을 약화시킨 낮은 경찰 예산, 혹은 종파적 사익 추구와 정실주의가 행정의 약점을 악용하게 만든 소수 집단의 정부에 대한 낮은 신뢰였을 수 있습니다. 국가 기관의 비효율과 부패를 뿌리 뽑는 또 다른 운동에 나서기 전에, 책임성이 행정의 지배적 문화가 되도록 이러한 문제들을 해결해야 합니다."
 SyriaFocus.93.a: "Better luck next time"
 SyriaFocus.94.t: "Increased local accountability"
 SyriaFocus.94.d: "행정의 책임성을 높이고 부패와 정실주의를 뿌리 뽑으려는 우리의 노력은, 막대한 경찰 예산과 수사 활동에 도움이 된 부정 사례를 신고하는 정부에 대한 국민의 신뢰 덕분에 대체로 성공을 거두었습니다. 우리의 중앙집권적 행정 통치는 국민에게 점점 더 의지가 되고 있으며, 법치는 국민과 수도의 통치를 대표하는 행정관 모두에게 존중받고 있습니다. 효율성과 책임성을 높일 부패 척결 운동을 계속 성공적으로 수행한다면, 우리는 강력한 중앙집권 국가를 이루는 올바른 길을 걷고 있는 것입니다."
 SyriaFocus.94.a: "Our state's centralized rule is getting stronger and more recognized"
 SyriaFocus.95.t: "A promising new generation of political representatives"
 SyriaFocus.95.d: "우리는 높은 인기를 얻고 행정과 직무 수행에서 훌륭한 능력을 보여 준 재능 있고 인기 있는 정치인들을 다수 발굴하였습니다. 이는 비교적 능력 중심적이고 투명한 우리 기관들과, 유능한 정치인들이 자리를 지키며 눈에 띄는 효율로 정책을 실행하도록 유인한 적절한 관료 예산 덕분입니다. 그러나 다마스쿠스의 통치가 전국에서 체감되고 존중받을 만큼 강하고 경험 많은 체제를 만들려면 시간과 노력이 필요할 것입니다."
 SyriaFocus.95.a: "They will serve their positions well"
 SyriaFocus.96.t: "State officials fail to gather popular support"
 SyriaFocus.96.d: "행정의 유산을 제대로 유지하는 데 의지할 수 있는, 대중의 지지를 받으며 유능한 인물들을 발굴하고 지원하는 데 실패하였습니다. 정실주의와 부패, 그리고 정치에 대한 대중의 참여 부족으로 인해 경쟁이 사라졌고 이 중책을 맡을 만한 자격 있는 인원도 부족해졌으며, 성공하려면 부패 척결에 더 힘써야 합니다."
 SyriaFocus.96.a: "We'll have to incentivize the people more"
 SyriaFocus.97.t: "Druze Revolt!"
 SyriaFocus.97.d: "드루즈가 다수인 지역들이 현재의 내전을 기회로 삼아 우리에게 맞서 봉기하였으며, 이는 우리의 정통성에 심각한 타격을 주고 있습니다. 이는 주로 이들이 자신들 공동체의 대표성과 안전까지 위협한다고 보는 우리의 반세속적 이상 때문입니다."
 SyriaFocus.97.a: "Let them do what they want..."
