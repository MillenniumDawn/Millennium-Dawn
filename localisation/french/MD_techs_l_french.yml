 module_naval_ammo_anti_ship_1: "Charge de missile antinavire I"
 module_naval_ammo_anti_ship_1_desc: "Une charge de magasin centrée sur des missiles de croisière antinavires pour engager les bâtiments de surface à longue portée. Nécessite des supports de missiles ou des batteries VLS. Les charges de munitions peuvent aussi être rapidement reconfigurées selon la mission."
 module_naval_ammo_air_defense_1: "Charge de missiles de défense aérienne I"
 module_naval_ammo_air_defense_1_desc: "Une charge de magasin centrée sur les missiles de défense aérienne de zone, protégeant le navire et ses consorts des aéronefs et missiles entrants. Exige des affûts de missiles ou des bancs VLS. Les charges de munitions peuvent aussi être rapidement rééquipées pour changer de charge selon la mission."
 module_naval_ammo_land_attack_1: "Charge de missile d'attaque terrestre I"
 module_naval_ammo_land_attack_1_desc: "Une charge de magasin de missiles de croisière d'attaque terrestre pour frapper des cibles à terre. Nécessite des supports de missiles ou des batteries VLS. Les charges de munitions peuvent aussi être rapidement reconfigurées selon la mission."
 module_naval_ammo_asw_1: "Charge de missile ASW I"
 module_naval_ammo_asw_1_desc: "Une charge de magasin de torpilles livrées par missile pour traiter les contacts sous-marins à distance de sécurité. Nécessite des supports de missiles ou des batteries VLS. Les charges de munitions peuvent aussi être rapidement reconfigurées selon la mission."
 module_naval_ammo_balanced_1: "Charge de missile équilibrée I"
 module_naval_ammo_balanced_1_desc: "Une charge de magasin mixte équilibrant missiles antinavires, défense aérienne, attaque terrestre et anti-sous-marins. Exige des affûts de missiles ou des bancs VLS. Les charges de munitions peuvent aussi être rapidement rééquipées selon la mission."
 module_naval_sub_ammo_anti_ship_1: "Chargement de missiles antinavires sous-marins I"
 module_naval_sub_ammo_anti_ship_1_desc: "Une charge de magasin sous-marin de missiles de croisière antinavires tirés depuis des tubes verticaux. Nécessite des supports de missiles ou des batteries VLS. Les charges de munitions peuvent aussi être rapidement reconfigurées selon la mission."
 module_naval_sub_ammo_land_attack_1: "Charge de missiles sous-marins d'attaque terrestre I"
 module_naval_sub_ammo_land_attack_1_desc: "Une charge de magasin sous-marin de missiles de croisière d'attaque terrestre tirés depuis des tubes verticaux. Nécessite des supports de missiles ou des batteries VLS. Les charges de munitions peuvent aussi être rapidement reconfigurées selon la mission."
