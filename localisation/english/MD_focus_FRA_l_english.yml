 # French Focus Tree
 france_focus: "French Focus Tree"

 # Faction Names
 Francosphere: "Francosphere"
 Continental_system: "Continental System"
 Holy_league: "Holy League"
 world_revolution_commune: "World Revolutionary Commune"

 # Political Spectrum
 FRA_state_of_french_politics: "State of French Politics"
 FRA_state_of_french_politics_desc: "France occupies one of the world's most interesting, and most volatile, political positions. For a long time, our Fifth Republic was a model of stability, with power alternating between a socialist bloc and a conservative bloc. But as we move into this new millennium, the situation is becoming increasingly unclear. Some parties are emerging whilst others are collapsing; no one can say where the coming years will take us."
 FRA_PS: "The Socialist Party"
 FRA_PS_desc: "Refounded at the Épinay Congress under François Mitterrand, the Socialist Party overtook the Communists as the dominant force of the French left and has alternated in power with the Republican Right ever since. Our base is broad and spread across most classes, and our return to the Élysée is a matter of time."
 FRA_UDF_LREM: "The Centrist Union"
 FRA_UDF_LREM_desc: "Assembled in 1978 to support Valéry Giscard d'Estaing, the Union for French Democracy is a confederation of liberals, Christian democrats and radicals rather than a single party. Relegated to junior partner for two decades, we intend to build a centre that governs in its own right."
 FRA_LR: "The Republican Right"
 FRA_LR_desc: "The Gaullist right is as old as the Fifth Republic and has held the presidency since 1995, but a failed dissolution has cost us dearly and put a Socialist in Matignon. We must consolidate the centre-right before our rivals on both flanks overtake us."
 FRA_RPF: "Rally for France"
 FRA_RPF_desc: "Charles Pasqua and Philippe de Villiers founded the Rally for France in 1999 for Gaullists who judged the mainstream right too accommodating towards Brussels. Our influence is small today, but every concession made to the European Union recruits for us."
 FRA_FN: "The National Front"
 FRA_FN_desc: "Founded in 1972 around Jean-Marie Le Pen, the National Front has spent three decades outside respectable politics while every other party closed ranks against it. The cordon sanitaire is beginning to fray, and we mean to be ready when it breaks."
 FRA_LFI: "Unbowed France"
 FRA_LFI_desc: "The Socialist Party has spent itself serving soup to the centrists and dying between its two tendencies. La France Insoumise stands as the only genuine left opposition to the neoliberal order, and we will not seek compromise with it."
 FRA_EELV: "The Greens"
 FRA_EELV_desc: "The ecologist movement has contested French elections since 1984 without ever being taken seriously, and our base barely reaches beyond the cities. Time is the one resource we cannot campaign for, so we must convert the other parties or replace them."
 FRA_PCF: "The French Communist Party"
 FRA_PCF_desc: "The French Communist Party fell with the Soviet Union to which it was bound, and our working-class base is drifting towards the far right or towards abstention. Reversing that decline is the whole task before us."
 FRA_friend_eu: "Befriend EU"
 FRA_friend_eu_desc: "The European Union is home to many nations led by parties similar to our own. We should use this ideological convergence to highlight our pro-European stance as a bulwark against nationalism."
 FRA_eternal_challenge: "The Eternal Challenger"
 FRA_eternal_challenge_desc: "For decades, we have been the only party to fight both on the streets and in parliament to defend workers. Our enemies are clear: the right wing and the extremists. The people know they can trust us to stand up to them. Our enemies never sleep, and we must remember that. United, we can scare off any threat."
 FRA_eu_federalism: "EU Federalism"
 FRA_eu_federalism_desc: "Other nations must remember the values we stand for as the European Union: to protect them, to develop them, and to spread them among the other nations of Europe."
 FRA_let_industry: "Let The Industry Go"
 FRA_let_industry_desc: "Heavy industry is a waste of time and energy; it is no longer productive enough in a globalised economy such as ours. We must not stand in the way of its relocation to the world's new industrial centres. Instead, we should turn our attention to a new form of economy: the service sector. Offices will become our main focus in the years ahead. By prioritising them, we can reduce unemployment and increase the income they generate."
 FRA_finance_minister: "A New Economic Policy"
 FRA_finance_minister_desc: "In a world undergoing transformation, we too must evolve and shift our economic focus. Economic crises have highlighted the limitations of Keynesian economics, so we must change the way we think. Consequently, we must choose our next economic programme for the finance sector. It will allow us to reduce spending, but the only question is who we can trust."
 FRA_atlantist_drift: "Atlantic Drift"
 FRA_atlantist_drift_desc: "NATO is the strongest alliance currently in existence. If we want to keep it that way, we must improve the training of our armed forces."
 FRA_greece_eurozone: "Greece in the Eurozone"
 FRA_greece_eurozone_desc: "Greece is known for its debt problems. We can aid them with some money to show them that countries within the European Union really care about each other."
 FRA_tax_evasion: "Fight Tax Evasion"
 FRA_tax_evasion_desc: "There are too many people who continue to avoid paying tax through various schemes; we must put a stop to this because we have committed to doing so."
 FRA_liberal_turn: "Liberal Turn"
 FRA_liberal_turn_desc: "For far too long, we have tried to control the economy and the financial sector, but in a globalised world, it is becoming increasingly difficult to control the flow of capital. So we should let the market regulate itself. What could possibly go wrong?"
 FRA_ease_interventionism: "Ease Interventionism"
 FRA_ease_interventionism_desc: "We should focus on improving diplomatic relations in Europe, not send our people to fight someone else's war. Europe is currently a continent of peace, and as a major regional power we should set a good example for everyone."
 FRA_modern_interest: "Modern Interest"
 FRA_modern_interest_desc: "For far too long, we have spent our time defending an unproductive class that is perpetually in crisis. It is high time we looked to the future, and the future lies in services and technology."
 FRA_cut_with_unions: "Cut With Unions"
 FRA_cut_with_unions_desc: "Labour unions are no longer as useful to our country as they once were. We should no longer give in to their demands; after all, we are not their hostages."
 FRA_vigipirate: "Reinforce Security"
 FRA_vigipirate_desc: "Mission Vigipirate will be our national security and anti-terrorism alert system. It is supposed to be a permanent mechanism involving the government, armed forces, local authorities, and citizens designed to anticipate, prevent, and protect our country against terrorist threats."
 FRA_not_done: "We Are Not Done Yet"
 FRA_not_done_desc: "The twenty-first of April was a humiliation without precedent. Our candidate was eliminated in the first round and the Republic was forced to choose between the right and the far right. Yet the militants have not gone home, the sections still meet, and the voters who drifted to the far left have nowhere better to go. We rebuild from the base upward, and we make our peace with the unions we alienated."
 FRA_meet_friends: "Meeting With Friends"
 FRA_meet_friends_desc: "Now is a good time to arrange a meeting with other socialist countries to discuss the current world situation and the path to socialism."
 FRA_turn_ecology: "Turn to Ecology"
 FRA_turn_ecology_desc: "The Greens will not stand aside for us at the next legislative elections without a price, and the price is written on the reactors. Twenty-four of them, Fessenheim first, and half our electricity mix surrendered by the end of the decade. The energy federations of the CGT have already made their view plain. We must decide whether the alliance is worth the fleet."
 FRA_military_coop: "Military Co-op"
 FRA_military_coop_desc: "Building on our close cooperation with NATO, we should invite other countries to conduct joint military training with us. Everyone stands to benefit, and it will show our enemies how united and ready we are."
 FRA_party_unity: "Party Unity"
 FRA_party_unity_desc: "Every congress ends the same way. The currents argue for three days, nobody wins, and a motion de synthèse is drafted overnight so that all of them can claim victory. Reims nearly broke us over forty-two votes. Unity is possible, but it is bought with ministries and secretariats, and the bill is always paid in patronage."
 FRA_strenght_throught_EU: "Strengthen Through EU"
 FRA_strenght_throught_EU_desc: "The EU stands for democratic values, and so do we. That should be reason enough to keep this organisation alive, strong and stable. If the EU falls, Europe may become divided once again."
 FRA_stole_voter: "Reconnect With Our Electorate"
 FRA_stole_voter_desc: "The bassin minier and the Midi were ours for a century and are now the safest ground the far right has. Lecturing those voters has not worked. If we want them back we must go to them with something in our hands: furnaces relit, slots opened, an industrial promise made in public. Made, and then kept, because a broken promise there will cost us the region for a generation."
 FRA_ps_lgbt: "Ensure LGBT Rights"
 FRA_ps_lgbt_desc: "The civil solidarity pact was only ever half a measure. Marriage, adoption, the full equality of couples before the law: this is the reform our voters expect and the one the right has promised to fight in the streets. La Manif pour Tous is already booking the Champ de Mars. We can carry the law entire, or we can trim it and keep the peace."
 FRA_ps_win: "Socialism Has Been Saved"
 FRA_ps_win_desc: "We've done it! We've achieved the impossible. After narrowly avoiding collapse and a humiliating defeat at the hands of the French and in the eyes of history, we've managed to turn things round. Our opponents thought we were finished, but we managed to win back our electorate and steer them away from the siren calls of extremism. Our victory is a sign of socialism's stability throughout the world. But our victory is only the beginning; armed with this experience, we will not make the same mistakes a second time."
 FRA_Neither_right_nor_left: "Neither Right Nor Left"
 FRA_Neither_right_nor_left_desc: "The best way to develop our country is to steer clear of divisive politics. Let us occupy the centre ground, not too far right, not too far left."
 FRA_Get_indecisives: "Get Indecisives"
 FRA_Get_indecisives_desc: "Neither right nor left. There are voters in this country who have never found a party worth the walk to the polling station, and there are thousands of volunteers willing to knock on their doors and ask what they want. La Grande Marche will bring them to us from both old parties at once. What it will not bring us is a single local federation."
 FRA_abolish_ISF: "Abolish ISF"
 FRA_abolish_ISF_desc: "The solidarity tax on wealth raises little and exiles much. For thirty years capital has left for Brussels and Geneva, and the receipts have never justified the flight. We replace it with a tax on property alone. The money will come home. So will the accusation, in every headline until the next election, that we govern for the rich."
 FRA_Fight_Deficit: "Fight Deficit"
 FRA_Fight_Deficit_desc: "Our debt is high. We have to fight it no matter the cost if we do not want to drown in debt we cannot repay. The people will surely understand these necessary actions."
 FRA_Reconize_Mistakes: "Recognise Mistakes"
 FRA_Reconize_Mistakes_desc: "Previous French leaders treated the colonial nations in a deeply unjust manner. We must finally set things right by paying for their actions. Let this chapter in our history finally close."
 FRA_Western_policy: "Western Policy"
 FRA_Western_policy_desc: "The European Union and the Atlantic alliance are what keep this continent safe, and we gain nothing from pretending otherwise. Closer integration with our allies buys us influence in Brussels and goodwill in Washington. It also hands the souverainistes, Gaullist and nationalist alike, the only argument they have ever needed: that the Republic has become a vassal."
 FRA_independant_Euro: "Independent Europe"
 FRA_independant_Euro_desc: "Other countries must know that within a united Europe, we do not seek excessive influence over their stability. Alone, some of us may be vulnerable, but together we must be strong enough to overcome these problems."
 FRA_reduce_tax: "Reduce Tax"
 FRA_reduce_tax_desc: "The taxe d'habitation falls hardest on the households that can least absorb it, and the employment credit has already shown what relief does for hiring. We will phase it out entirely. The communes lose their revenue base, so the state must compensate them from Paris, and every mayor in France will be writing to us about it."
 FRA_increase_pension_age: "Increase Pension Age"
 FRA_increase_pension_age_desc: "People may not like it, but as life expectancy increases thanks to new breakthroughs in medicine, we must continue to fund our social welfare system. However, with fewer and fewer young people to fund the pensions of an ever-growing number of older people, we have no choice. We must make the working population work for longer to compensate for this lack of generational renewal."
 FRA_growing_tensions: "Growing Tensions"
 FRA_growing_tensions_desc: "Our world is becoming less and less safe, and we may see war return to Europe. To ensure we are not caught off guard, we must prepare for it."
 FRA_befriend_china: "Befriend China"
 FRA_befriend_china_desc: "China is a major trading partner of France; it is very much in our interests to negotiate favourable treaties with them."
 FRA_nuclear_eu: "Nuclearise the EU"
 FRA_nuclear_eu_desc: "Fifty-six reactors, and no one in Brussels willing to call them green. The taxonomy is being written now, and if nuclear is excluded from it our entire fleet becomes a liability on paper. Berlin and Vienna will fight us. Prague, Warsaw and Helsinki will not. We build the alliance, we win the vote, and we accept that Germany will remember it."
 FRA_reise_tertiary: "The Rise of Tertiary"
 FRA_reise_tertiary_desc: "Today's Western economy is a service-based economy that brings together the various players involved in production. France must play its part in this economic transition; there is no other way."
 FRA_reduce_public_service: "Reduce Public Service"
 FRA_reduce_public_service_desc: "By cutting government spending we will be able to reduce our debt once again. People will hate it, but we have to choose the lesser evil. If the country falls because of the debt, reduced social spending will be the least of their problems."
 FRA_strat_indus: "Funding Our Strategic Industries"
 FRA_strat_indus_desc: "Even though our industries are no longer as competitive as they once were, there are certain industries we cannot do without. The defence industry is one of them, as we cannot rely on other countries for our defence. France has always produced its own weapons. It is therefore of the utmost importance that this continues to be the case, particularly in a world where tensions are rising."
 FRA_arms_deal: "Increase Arms Exports"
 FRA_arms_deal_desc: "It is common knowledge that our military-industrial complex produces excellent weapons. As such, we have been one of the leading arms exporters for many years. This arms trade enables us not only to project our power internationally, but also to gain a great deal of money and influence. It can therefore only be a good thing."
 FRA_eu_mil: "Assist EU Military Buildup"
 FRA_eu_mil_desc: "Whilst our country is relatively well prepared to cope with the return of war to Europe, the same cannot be said of all our European partners. The majority of them stand no chance of putting up a fight. We should help them to develop their capabilities, as their security is our own."
 FRA_finance_student: "Finance Best Student"
 FRA_finance_student_desc: "By applying the neoliberal formula to perfection, our economy has never been so closely integrated into international dynamics. This is a good thing, as it will enable us to benefit from other countries' progress and invest all over the world to reap the rewards."
 FRA_right_left_money: "The Very Centre"
 FRA_right_left_money_desc: "For too long, our country has been held hostage by the left-right divide. Following all our advances in finance and geopolitics, we have demonstrated the power of ordoliberalism. Our role is to enable the market to flourish in France, and to allow the French people to benefit from the wealth that this generates."
 FRA_demograph_arms: "Promoting Demographic Rearmament"
 FRA_demograph_arms_desc: "A good population growth campaign is a long-term investment in the future of our country."
 FRA_share_eu: "Share Our Power With the EU"
 FRA_share_eu_desc: "Our enemies must know we are very serious about protecting the independence of the European Union's member states. If necessary, we will threaten any oppressor with our nuclear arsenal."
 FRA_handle: "Handle the Situation"
 FRA_handle_desc: "They came for the fuel tax and stayed for everything else. The roundabouts are occupied, the Champs-Élysées has burned twice, and the flash-ball rounds have cost us eyes and headlines in equal measure. We can pass the anti-rioter law and clear them by force, or we can open a national debate and buy the peace with ten billion euros we do not have."
 FRA_startup_nation: "Startup Nation"
 FRA_startup_nation_desc: "Thanks to our bold policies and our refusal to back down in the face of these recalcitrant Gauls, we have achieved our goal. We have transformed a society once hostile to entrepreneurship, freeing it from the taxes and regulations that held it back. A bright future of innovation and liberalism lies ahead of us. That is our vision."
 FRA_Neo_gaulism: "Neo-Gaullism"
 FRA_Neo_gaulism_desc: "Neo-Gaullism is a French political movement that adapted the original principles of General Charles de Gaulle. He emphasised national sovereignty, a strong executive presidency, and foreign policy independence to fit the modern, globalised era."
 FRA_known: "The Inevitable Parti"
 FRA_known_desc: "Ever since the founding of the Third Republic and the emergence of a stable form of republicanism, there have always been conservatives. We are simply their latest incarnation. For decades, we have been present in every second round of elections. There is no reason why the next elections should be any different. Our new millennium is full of uncertainties, so we must be the voice of stability and common sense in the face of extremists."
 FRA_oppose_immigration: "Oppose Immigration"
 FRA_oppose_immigration_desc: "Immigrants have already proven how dangerous they can be, especially those from regions of endless war. We must take action to prevent them from arriving."
 FRA_continue_liberal: "Continue Liberal Policies"
 FRA_continue_liberal_desc: "We will continue implementing our programme of economic liberalisation, because this is how the economy works best."
 FRA_patriotism: "Patriotism"
 FRA_patriotism_desc: "French people should be proud of their nationality and history that comes with it. As a result, they must get used to asking less of the state. We can no longer afford the generosity of the past. They must learn to side with the state and stop constantly demanding more public money."
 FRA_turn_west: "Turn West"
 FRA_turn_west_desc: "We should improve our relations with our overseas friends in America. Their politicians may change, but we have to ensure that none of them will ever turn their back on France."
 FRA_third_voice: "The Third Voice of France"
 FRA_third_voice_desc: "In a world still divided between NATO and the remnants of the USSR, France must chart its own course, as it has always done. We cannot rely on a distant ally that would not come to our defence; we must therefore forge our own destiny alongside those who reject oppression from either the East or the West."
 FRA_austerity: "Use Austerity"
 FRA_austerity_desc: "The deficit is structural and the rating agencies are circling. We cut where cutting is possible: one civil servant replaced for every two who retire, ministries merged, construction deferred. The unions will call it what it is and bring a million people into the streets over the pension age, and the left will spend a decade running against this single decision."
 FRA_question_ref: "Accelerating European Integration"
 FRA_question_ref_desc: "Although France is one of the founding pillars of the European Union, its people are now among the most sceptical towards it. The French have repeatedly opposed the introduction of new treaties. We should stop asking them for their opinion on every single issue, as this significantly slows down the process of European integration. Many will take this badly and become even more opposed to the European Union, but at least we will stop being the ones holding the European Union back."
 FRA_nato_integration: "NATO Integration"
 FRA_nato_integration_desc: "Another step to improve our safety on this continent. Without NATO, who knows what state Europe would be in today."
 FRA_national_indep: "National Independence"
 FRA_national_indep_desc: "By adopting a position somewhere between East and West, France can defend its own interests and no longer has to take the views of a bureaucrat in Washington into account."
 FRA_end_proximity_police: "End Proximity Police"
 FRA_end_proximity_police_desc: "The police should not be mixed up with the people they are supposed to be keeping an eye on. A rapid-response police force would be more cost-effective."
 FRA_reform_wealth: "Reform the Welfare State"
 FRA_reform_wealth_desc: "For far too long, France has been a welfare state; it is time for the French to fend for themselves without always relying on public money."
 FRA_looming_crisis: "The Looming Crisis"
 FRA_looming_crisis_desc: "In January the Société Générale discovered that a single trader had lost it nearly five billion euros without anyone noticing. That was the warning. The American mortgage market is worse, our banks are exposed to it, and Dexia is already in trouble. We can build the supervisory apparatus now and slow our own economy doing it, or we can trust the cycle and hope."
 FRA_defend_interest: "The Defence of France's Interests"
 FRA_defend_interest_desc: "Being independent means we must protect ourselves from foreign influence, both in our own country and wherever we have interests. We must take steps in this direction to ensure that France remains a great nation."
 FRA_lower_expanse: "Stop Funding Unproductive Businesses"
 FRA_lower_expanse_desc: "Subsidising economic activity comes at a cost that is becoming increasingly significant. We should take a close look at our spending and only subsidise efficient and competitive industries."
 FRA_oppose_lgbt: "Act Against Wokeism"
 FRA_oppose_lgbt_desc: "Trends of thought that are increasingly hostile to traditional norms are seeping into our society. These norms exist for a reason and have always prevailed. We must prevent this infiltration."
 FRA_return_rurality: "Embrace Rurality"
 FRA_return_rurality_desc: "Major cities are increasingly becoming hotbeds of decadence and crime. We must encourage our citizens to move away from them and towards regions which, whilst admittedly less prosperous, are closer to common sense."
 FRA_end_assisted: "End the Culture of Dependency"
 FRA_end_assisted_desc: "Far too large a proportion of our population relies on unconditional benefits that have been granted to them without them having to do any work. This situation is unacceptable and is placing a strain on our finances. We must put an end to these benefits; this will get people into work."
 FRA_hostile_bear: "Hostility to the Bear"
 FRA_hostile_bear_desc: "Russia is once again becoming a threat to European interests and safety. First-line countries must begin preparations to defend themselves in case of any hostile action from the east."
 FRA_wake_up: "Wake France Up"
 FRA_wake_up_desc: "Freed from decadence and the temptations of inaction, the French people can get back to work."
 FRA_eternal_france: "Eternal France"
 FRA_eternal_france_desc: "We have made our country stronger than ever before. We increased our own protection from foreign threats, reduced internal problems and decreased our debt problems. We have secured a future for our country. France has always been there and always will be."
 FRA_enought_soc: "Enough of Socialism"
 FRA_enought_soc_desc: "As a conservative party, the Progressives and the Socialist Party are our main opponents. They advocate a liberal Europe, precisely what people no longer want, and we will work to free ourselves from it. We must show the people that we are, and always will be, the instrument through which their desire for stability and protection is realised. We are against the liberal European Union and progressivism."
 FRA_sovereignism: "Question Our Sovereignty"
 FRA_sovereignism_desc: "For far too long, the French people have been disregarded; no one in our country wanted the European Union to grow to such proportions. Whether it was treaties or enlargement, the people were sceptical every time, and every time they were ignored. It is time for a party to raise the issue of France's sovereignty once again."
 FRA_sacrifice: "Necessary Sacrifice"
 FRA_sacrifice_desc: "We are heading into difficult times, and the difficult path that lies ahead will require discipline and goodwill on the part of the French people. The French must learn once again that it is up to them to make sacrifices for France, and not the other way round."
 FRA_elder_view: "Our Elder View"
 FRA_elder_view_desc: "The National Council of the Resistance did a tremendous job of rebuilding our country from the ruins of the Second World War, and in doing so it became a vassal of the United States. But for decades now, their work has been gradually undermined by politicians, each more liberal than the last. We must return to our roots, follow the General's example, invest in our industry and set about rebuilding our country, which has been devastated by decades of European integration and deindustrialisation."
 FRA_neccesity_leaving: "The Need to Leave"
 FRA_neccesity_leaving_desc: "Our journey towards leaving the European Union has only just begun. We must make the people understand that we must leave this Europe before it is too late to do so."
 FRA_fight_renouncement: "Fight the Renouncement Supporters"
 FRA_fight_renouncement_desc: "The General did not trust the other European powers to have the will to create a Europe independent of the United States. He was right: a few decades after his death, our partners are more concerned with kowtowing to the United States and buying equipment from them than with working towards Europe's independence. We must denounce this downward spiral, which is already a reason for us to leave this Europe that is a vassal of the United States."
 FRA_back_gaulism: "Strategic Gaullism"
 FRA_back_gaulism_desc: "France must have a foreign policy that is independent of Washington's will. We must not allow anyone to meddle in our politics, and certainly not the United States, which has always sought to force us to submit."
 FRA_social_gaulism: "Social Gaullism"
 FRA_social_gaulism_desc: "Faced with the end of happy globalisation and the lure of extremism, we must steer the French people back onto the path of reason. Social Gaullism rejects both capitalism and communism. It involves state intervention to guarantee the independence and security of employment. With this stability, the people have no need for all this welfare support."
 FRA_return_nation: "Return to Nation"
 FRA_return_nation_desc: "We must encourage French companies operating abroad to return to their country of origin, by whatever means necessary."
 FRA_anti_eu: "Campaign Against the EU"
 FRA_anti_eu_desc: "Now that the people are beginning to realise that the European Union no longer serves the interests of its founders, whose identity it is seeking to erode, we can step up our campaign against the European Union. We must make the people understand that most of their problems stem from there."
 FRA_anti_usa: "Hostility Toward USA"
 FRA_anti_usa_desc: "The United States views the return of Gaullism to power with disfavour. They are right to be concerned; our rise to power will quickly make it clear to them that we are no longer their allies. After all, it is well known that the United States has no allies; above all, it has interests."
 FRA_RPF_death: "Re-Establish Death Penalty"
 FRA_RPF_death_desc: "The death penalty was abolished decades ago, against the wishes of most of the French public. Since then, offenders of every stripe have grown bolder, confident that the state will never truly punish them. A sovereign nation must be able to enforce its own laws to the fullest. We shall restore it."
 FRA_destroy_liberalism: "Destroy Economic Liberalism"
 FRA_destroy_liberalism_desc: "For far too long, our economic policy has been dominated by abhorrent ultra-liberalism. Our citizens have seen their jobs and our industrial strength disappear one after the other. Even back in his day, the General warned that capitalism, from a human perspective, was a bad thing. We must return to state intervention. We must restore order to our public finances and to what remains of our economy."
 FRA_campaign_frexit: "Campaign For Frexit"
 FRA_campaign_frexit_desc: "The French have finally realised that the European Union is a bad thing; all that remains is for us to give them the means to vent their anger. All it will take is a ballot paper in the ballot box to put an end to the dismantling of France."
 FRA_rebalance_foreign_policy: "Rebalance Our Foreign Policy"
 FRA_rebalance_foreign_policy_desc: "Although we have made clear our intention to break away from the United States, our political class remains infiltrated by their politics, their way of life and their corporations. We must send a strong message to those who might think that our break with the United States is not genuine. We will re-establish dialogue with powers that have always opposed US hegemony."
 FRA_leave_nato: "Break with NATO"
 FRA_leave_nato_desc: "To safeguard our independence, we must rid ourselves of an alliance we have never needed and which has brought us very little. We are capable of defending our interests on our own."
 FRA_frexit_ref: "Frexit Referendum"
 FRA_frexit_ref_desc: "The time has come to leave the European Union once and for all. Our people have been sufficiently prepared to reject the European Union for good."
 FRA_strategic_autonomy: "Ensure Strategic Autonomy"
 FRA_strategic_autonomy_desc: "We have succeeded in restoring France's independence; we are free to do as we please in this world. France is strong and free, and we are ready to defend it."
 FRA_strong_people: "The Strong People"
 FRA_strong_people_desc: "No more incentives for idleness; capitalism under state control. We have renewed the social contract with our people. They know that we protect them and that they owe us obedience and goodwill."
 FRA_recover: "Rebuild the Economy"
 FRA_recover_desc: "Despite all our efforts to prepare for our exit from the European Union, our economy has still taken a hit. We must rebuild it on solid foundations before we can even think of taking revenge on our oppressors."
 FRA_our_own_sphere: "Our Own Sphere"
 FRA_our_own_sphere_desc: "We are not the only ones to have succeeded in ridding ourselves of American imperialism. We can find allies to forge an alliance based on mutual respect amongst independent powers."
 FRA_paid_reconnexion: "Blockade Europe"
 FRA_paid_reconnexion_desc: "Now that we have safely and successfully left the European Union, we can start thinking about getting our own back on it. The European Union and its networks need to pass through our country. This presents us with a tremendous opportunity to take our revenge."
 FRA_certain_idea: "A Certain Idea of France"
 FRA_certain_idea_desc: "In just a few years, we have succeeded in restoring France to what it ought to be: a proud and free great power. The General would be proud that we have restored his legacy. He was right: France can only be a great power; otherwise, it would not be France."
 FRA_salvage_mondialisation: "Salvage the Victims of Globalisation"
 FRA_salvage_mondialisation_desc: "Our people have suffered greatly as a result of globalisation. This is particularly true of the working population, who have seen their jobs disappear, their country fall apart and their values trampled underfoot. We must show them that we are the side that will bring about change, that will dare to ask the right questions and that will have a very simple solution to these problems."
 FRA_raise_tariff: "Raise Tariff"
 FRA_raise_tariff_desc: "Increasing our tariffs will enable us to put an end to unfair competition from abroad and allow the French public to buy products made in France."
 FRA_dynamise_periph: "Revitalise the Outskirts"
 FRA_dynamise_periph_desc: "Rural and suburban areas have always been neglected by planning policies. They are under-invested in and are often home to a population living in precarious circumstances but full of goodwill. We must help this population to gain access to the same infrastructure as that available in major cities."
 FRA_focus_insecurity: "Focus on Insecurity"
 FRA_focus_insecurity_desc: "Immigration has led to a significant increase in insecurity within our country. We must demonstrate to the population that we are taking this problem very seriously by increasing police staffing, implementing stricter controls, and cracking down on crime."
 FRA_eurosepticism: "Threaten the European Union"
 FRA_eurosepticism_desc: "The European Union has always tried to silence countries like ours that opposed its ultra-globalist policies. We must make them understand that things must change and that we can reignite the Eurosceptic movement in France."
 FRA_sovergnism_policies: "Sovereignist Policies"
 FRA_sovergnism_policies_desc: "France must exercise greater control over its economy, its foreign policy and, above all, its borders. Without this, our efforts to get our country back on its feet will be in vain. We must assert our determination to govern our own country."
 FRA_economical_patriotism: "Economic Patriotism"
 FRA_economical_patriotism_desc: "We must urge French companies that have moved abroad to return to France. If they refuse, there will be consequences for their business operations in France."
 FRA_social_populism: "Social Populism"
 FRA_social_populism_desc: "All we need to do is give the people what they are calling for and crack down on those they hate to secure our voter base and ensure we remain in power."
 FRA_criticize_eu_migrant: "Criticise the European Migration Policy"
 FRA_criticize_eu_migrant_desc: "The European Union is not doing enough to stem the flow of migrants and is forcing member states to take them in. We must exert pressure to put a stop to this."
 FRA_common_accord_eu: "A Deal With the EU"
 FRA_common_accord_eu_desc: "The European Commission has realised that it cannot ignore us. Now we must make it understand that by giving us what we want, it will secure our support."
 FRA_reinforce_nuke: "Reinforce Our Nuclear Capacity"
 FRA_reinforce_nuke_desc: "Nuclear energy has proven its reliability. Why turn to other energy sources when we have this expertise at our disposal? We must expand our nuclear capacity to cope in the event of a crisis."
 FRA_FN_death: "Re-Establish Death Penalty"
 FRA_FN_death_desc: "The death penalty was abolished decades ago, and violent crime has only grown bolder since. Our citizens deserve to feel safe in their own country again. We shall restore it, and the harshest crimes will once again carry the harshest consequences."
 FRA_reject_immigration: "Reject Immigration"
 FRA_reject_immigration_desc: "Now that we have better control over our borders, we can implement our policy to crack down on illegal immigration."
 FRA_pro_russian_fn: "Pro-Russian Policies"
 FRA_pro_russian_fn_desc: "The EU will not cease being ultra-globalist. We must draw closer to Russia, which has always managed to remain distant from the perversions of the West. Together, we will go far."
 FRA_oppose_lgbt_fn: "End Wokeism"
 FRA_oppose_lgbt_fn_desc: "Some people should not be allowed to enter our country. Let's put an end to this nonsense and focus on restoring order based on the only right model of the family."
 FRA_end_right_soil: "End the Right of Soil"
 FRA_end_right_soil_desc: "Being born in France should not be enough for a person to be French. We must put an end to the principle of jus soli; we deserve to choose who can be a French citizen."
 FRA_support_rus_claim: "Support Russian Claim"
 FRA_support_rus_claim_desc: "Russia has every right to feel threatened by NATO's expansion. We must demonstrate our willingness to help them redress the injustices they have suffered."
 FRA_electoral_reform: "Electoral Reform"
 FRA_electoral_reform_desc: "Elections in France are increasingly being contested on the grounds of the electoral system and the representativeness of the parties. We can implement these reforms whilst ensuring that they work to our advantage so that we can remain in power."
 FRA_our_identity: "Our Identity"
 FRA_our_identity_desc: "It is difficult to be a nationalist within an entity such as Europe. We have abandoned the idea of leaving it, so we must forge a new identity that is suited to our place within the European Union but which does not aim to dilute us amongst the foreign workforce."
 FRA_boreal_space: "Our Stance With Russia"
 FRA_boreal_space_desc: "We have demonstrated our desire to work with Russia, and our efforts have not gone unnoticed. Now is the time to decide what we want from Russia; it is time to reach out to them."
 FRA_long_travel: "France Prevails"
 FRA_long_travel_desc: "Over the past few years in office, we have shown the French people that, with determination, a country's problems can be resolved very easily. We have made France greater and less dependent on our neighbours and on migration flows, which we have managed to curb."
 FRA_sound_fury: "The Sound and the Fury"
 FRA_sound_fury_desc: "The French people no longer want appeasement; the moderates have let them down and have never brought about any real change. We are the party of change; we must show the French people that we are determined to challenge the established order."
 FRA_silent_france: "Mobilise the Non-Voters"
 FRA_silent_france_desc: "Many citizens have lost faith in our Republic and its institutions. We must encourage them to return to the polls to bring about real change."
 FRA_end_privatisation: "End Privatisation"
 FRA_end_privatisation_desc: "Many companies have continued to relocate their production sites away from France in order to boost profitability. This is driving up unemployment and causing us to lose our expertise. We must put a stop to this haemorrhage by regaining control over these companies if necessary."
 FRA_pro_lgbt_lfi: "Promote Affirmative Action"
 FRA_pro_lgbt_lfi_desc: "We must put an end to the discrimination that people who deviate from what is wrongly considered the norm have been subjected to for far too long. Our society must learn to accept all differences."
 FRA_toward_6th_rep: "Towards a 6th Republic"
 FRA_toward_6th_rep_desc: "We can now begin the most important part of the mandate entrusted to us by the people. We promised change, and they will have it. The time has come to shape a new Republic that will suit everyone."
 FRA_distance_nato_lfi: "Reject Bloc Politics"
 FRA_distance_nato_lfi_desc: "NATO ties us to Washington's wars just as surely as an alliance with Moscow would tie us to its own. We reject both blocs alike; genuine non-alignment is the only foreign policy worthy of an independent France."
 FRA_oppose_eu_treaty: "Oppose EU Treaty"
 FRA_oppose_eu_treaty_desc: "Unfair treaties have been imposed on our citizens. We are under no obligation to abide by them. To change this unfair Europe, we must start by challenging its legislative framework."
 FRA_guarante_employment: "Guarantee Employment"
 FRA_guarante_employment_desc: "Our country is full of talented people who are unable to fulfil their potential due to a lack of jobs caused by the crisis. We must guarantee everyone a stable and decent job; this should form the basis of any social contract."
 FRA_state_power: "The Power of the State"
 FRA_state_power_desc: "The institutions of the Fifth Republic are too centred on the office of the President of the Republic. We should encourage public debate so that the people can decide what our new Republic should look like."
 FRA_democracy: "Individual Freedoms"
 FRA_democracy_desc: "The many crises our country has faced have raised practical questions about the safety of our population. Surveillance is necessary to protect our citizens, but how far can the state go? We should allow our citizens the right to have their say."
 FRA_foreign_recognition_lfi: "Reset Our Foreign Policies"
 FRA_foreign_recognition_lfi_desc: "For far too long, our country has propped up dictatorships and refused to recognise the existence of sovereign states. We must put an end to this."
 FRA_oppose_eu_immigration_lfi: "Question EU's Stance on Immigration"
 FRA_oppose_eu_immigration_lfi_desc: "The European Union is becoming increasingly lenient towards far-right populists. It is not doing enough to help our neighbours in need and sees them merely as a source of cheap labour. We must distance ourselves from this approach and propose a more humane policy."
 FRA_economic_question: "The Direction of Economy"
 FRA_economic_question_desc: "The national budget and its management are important issues on which everything else depends. Our citizens must also have their say on this matter."
 FRA_ho_topic: "Deconstructing French Peculiarities"
 FRA_ho_topic_desc: "Many laws and customs inherent in French culture do not make it easy for other cultures to integrate. We should ask citizens to discuss the issue of the integration of minorities."
 FRA_balance_tax: "Balance Taxation"
 FRA_balance_tax_desc: "It is unacceptable for the middle class and those in precarious circumstances to be bled dry by taxes whilst the wealthy do not pay their fair share. We must restore the balance."
 FRA_climate_war_eco: "The Challenge of Our Millennium"
 FRA_climate_war_eco_desc: "The environment and the climate are deteriorating at a rapid pace. We must protect what remains of our biodiversity and prepare our society for difficult times ahead."
 FRA_dawn_6th_rep: "Dawn of the 6th Republic"
 FRA_dawn_6th_rep_desc: "Our work on the Sixth Republic is complete. Whatever the outcome, our work is done. We have probably made our mark on history."
 FRA_creolisation: "Creolisation"
 FRA_creolisation_desc: "The centuries of cultural exchange that our country has witnessed have shaped a new culture. However, this culture is denied by many; we must make our citizens understand that the future lies in living together. We still have so much to learn from the world."
 FRA_work_less: "Work Less Work Better"
 FRA_work_less_desc: "Our predecessors were determined to make the French work longer and longer hours in increasingly poor conditions. We must reverse this trend and help our citizens to enjoy their work more. They will then be all the more creative and enthusiastic about their work."
 FRA_reform_police: "Reform the French Police"
 FRA_reform_police_desc: "For too long, the police have been used as a tool for unjust repression against our citizens. We must implement the necessary reforms to ease the pressure on our citizens, whilst ensuring everyone's safety."
 FRA_post_empire: "Decolonise our International Policy"
 FRA_post_empire_desc: "Our colonial past has caused a great deal of harm to our former colonies. Many of them are still struggling to recover from it. We must support their rebuilding efforts and stop trying to dominate them."
 FRA_push_social_green_eu: "Spread Defiance in Europe"
 FRA_push_social_green_eu_desc: "We have achieved a lot in France, but we must also encourage our European partners to follow the same path. We can rally their people to pressure their governments so that we are not the only ones promoting progressivism in Europe."
 FRA_social_green_fair_rep: "L'Insoumission"
 FRA_social_green_fair_rep_desc: "In just a few years, we have achieved so much. We have steered France away from economic liberalism, precariousness, and have created a more humanist France. But we will never stop challenging the established order, whether at home or in the rest of the world."
 FRA_no_time: "We Have No Time"
 FRA_no_time_desc: "Scientists have been warning about the devastating effects of climate change for decades. What they predicted is now coming to pass: increasingly extreme weather events. People need to wake up if they want the next generation to have a chance at life."
 FRA_strong_eu: "The Strength of the EU"
 FRA_strong_eu_desc: "France cannot force the world to take climate change seriously. The European Union, on the other hand, can serve as a model for the rest of the world."
 FRA_ecology_available: "Make Ecology Available"
 FRA_ecology_available_desc: "For far too long, ecology has been considered a privilege reserved for the wealthy. We must continue to promote it as a way of saving money and preventing tragedies for everyone."
 FRA_right_vote: "Wider Right to Vote"
 FRA_right_vote_desc: "Concern for the environment and its future should not have to wait until the age of eighteen. We should extend the right to vote to a wider section of the population."
 FRA_question_growth: "Question Economic Growth"
 FRA_question_growth_desc: "For decades, people have been led to believe that the best way to help the environment is through sustainable development. But why must we always develop and grow? The planet and its resources have their limits. We should instead be moving towards a slowdown in growth."
 FRA_cooperate_eu: "Cooperate With EU Partners"
 FRA_cooperate_eu_desc: "Not all our European partners necessarily have the same resources or the same commitment to transforming their economies in order to tackle climate change. We can help our key partners achieve this by investing in green infrastructure in their countries."
 FRA_push_eco_eu: "Promote a Green Future"
 FRA_push_eco_eu_desc: "Our European partners are not doing as much as we are to tackle climate change. We can encourage their populations to take action by urging their environmental campaigners to take action and follow France's example."
 FRA_question_agriculture: "A Sustainable Agriculture"
 FRA_question_agriculture_desc: "Agriculture in France has moved towards mass production to meet the needs of the last century. Environmentally speaking, it is more responsible than many other forms of agriculture, but there is still room for improvement. In addition to European standards, we must encourage farmers to change their methods in favour of responsible, high-quality production. We will ensure that their produce is promoted and that this proves profitable for them."
 FRA_cooperation_no_compet: "Cooperation Not Competition"
 FRA_cooperation_no_compet_desc: "The model of social success in our country and around the world is based on individual success and the display of one's wealth. This behaviour is harmful to our planet as it encourages overconsumption and toxic competition amongst citizens. To reduce the impact of our societies on the planet, we must challenge these social models."
 FRA_nuke_choice: "Diversify Our Energy Mix"
 FRA_nuke_choice_desc: "For decades, energy in France has been generated by dozens of nuclear reactors. Whilst this technology may be reliable and relatively safe in the short term, it produces waste that we are unable to dispose of. It is therefore not the ideal source of energy for a sustainable future. We should diversify our energy supply by investing more in renewable energy."
 FRA_green_eu: "Toward a Greener EU"
 FRA_green_eu_desc: "Our success, both at home and abroad, in tackling climate change serves as a model for other countries in the European Union. We can be proud of that."
 FRA_eco_life: "Ecological Way of Life"
 FRA_eco_life_desc: "Adopting more sustainable production methods will not be enough on its own. We must encourage our citizens to consume less. This involves curbing ubiquitous advertising and promoting moderation. We don't need all of this; we can be happy with less."
 FRA_upgrade_transport: "Upgrade Our Transport Network"
 FRA_upgrade_transport_desc: "Our transport network may be efficient, but it is highly uneven and forces people in outlying areas to travel using more expensive and more polluting means of transport. We must make an alternative accessible across all regions; this means improving connections to outlying areas rather than continuing to develop an ever-faster network linking just a few European cities."
 FRA_dynamise_research: "Dynamise Research"
 FRA_dynamise_research_desc: "We must continue to develop research; we will never stop finding ways to do more with less and to develop renewable energy."
 FRA_help_transi: "Assist a European Transition"
 FRA_help_transi_desc: "Our European partners are beginning to realise that climate change is a serious issue that will increasingly affect them. However, some have not yet reached the stage of development required to be able to invest in this sector. We can help them to do so by setting up a joint fund between our countries dedicated to the transition to a low-carbon economy."
 FRA_end_fossile: "End Fossil Fuel"
 FRA_end_fossile_desc: "Now that the importance of the green transition is more widely recognised within the European Union, we can step up our efforts. We can propose to our partners that we move towards phasing out fossil fuels."
 FRA_opti_indus: "Optimise Our Industries"
 FRA_opti_indus_desc: "We need to make the leaders of large companies understand that implementing genuine environmental measures would be in their best interests. They, too, could do more by using fewer resources. We must, however, be careful that this does not encourage them to produce even more."
 FRA_promote_local: "Promote Local Consumption"
 FRA_promote_local_desc: "Now that we have a more responsible industry, we must ensure that our citizens are actually able to afford its products. However, market forces favour low-cost production. We must therefore ensure that products from our own industries are more readily available than those from the other side of the world. This will require us to bend the rules of free trade. But we should be able to manage it."
 FRA_subsidies_green: "Subsidise Green Industries"
 FRA_subsidies_green_desc: "Encouraging businesses to make eco-friendly changes won't get everyone on board. We need to provide the necessary resources and offer subsidies to businesses based on their commitment to the planet and their efficiency. This time, there will be no greenwashing."
 FRA_pressure_supply: "Pressure Supply Chains"
 FRA_pressure_supply_desc: "It is a fact that our country cannot produce all the raw materials it needs domestically. The European Union imports a great many resources from countries that have lax environmental standards. It is unacceptable that we import resources that do not meet our production criteria. Otherwise, what is the point of having regulations? We must join forces with other European powers to put pressure on these exporting countries to bring about change."
 FRA_reduce_extraction: "Reduce Resource Extraction"
 FRA_reduce_extraction_desc: "The extraction of minerals and oil is a polluting process that often exceeds our planet's capacity to regenerate them. Although we do not sit on an oil field, we must set an example to the rest of the world by introducing stricter regulations governing the extraction of minerals and fuels."
 FRA_power_rail: "Extend EU-Rail"
 FRA_power_rail_desc: "The European Union already has an extensive rail network, but we can do even better. Far too much freight is still transported by lorry; we must reduce this."
 FRA_altermondialism: "Promote Altermondialism"
 FRA_altermondialism_desc: "The fact that globalisation has ceased to benefit the public comes as no surprise to anyone. But we must steer the public away from the anti-globalisation movement. These tendencies are dangerous because they pit globalisation against a nationalist solution that is often aggressive. We must show them that the main enemy is capitalism."
 FRA_unite_struggle: "Convergence of Struggles"
 FRA_unite_struggle_desc: "We must unite all those who are oppressed, whether because of their gender, religion, skin colour or any other characteristic. They are all victims of capitalism and its social consequences. We must show them that all their problems have a cause and a solution."
 FRA_retake_past: "Winning Back the Workers"
 FRA_retake_past_desc: "Following the collapse of the USSR and the end of 'happy globalisation', a large proportion of our former working-class electorate turned to far-right populists or, for the most part, stopped voting altogether. Today we have managed to win the elections, but to ensure our long-term survival we must rebuild our working-class base, which is the very DNA of our party. To do this, we must take their demands seriously, starting by bringing back the jobs that our liberal predecessors sent to China."
 FRA_turn_reform: "Reform Rather Than Revolution"
 FRA_turn_reform_desc: "Now that we have returned to the helm of these institutions, we no longer need to consider taking action to challenge the state, as we are now part of it. We will be able to reform society from within, setting aside revolutionary ideals."
 FRA_leave_nato_PCF: "Break with American Imperialism"
 FRA_leave_nato_PCF_desc: "NATO is an instrument of American imperialism and the vehicle of its domination over Europe. We must break with it and stand instead in solidarity with all peoples who resist Washington's hegemony."
 FRA_renogociate_treaty: "Renegotiate EU Treaty"
 FRA_renogociate_treaty_desc: "Our people have been forced to accept European treaties which they had, however, opposed. To carry out our programme, we must amend the legislative framework imposed on us by the European Union. There will undoubtedly be a power struggle with the European institutions and sanctions, but we have no other choice if we truly wish to act in the interests of the French people."
 FRA_undo_lib_PCF: "Close the Liberal Parenthesis"
 FRA_undo_lib_PCF_desc: "Ever since President Mitterrand's term in office, the French people have had to endure liberal policies from both the left wing and the right wing. It is time to put an end to this and show that we are different. That we are determined to fight against capitalism, even if it means coming into conflict with the WTO or the European Union."
 FRA_protect_indus_pcf: "Protect Our Industry"
 FRA_protect_indus_pcf_desc: "It is not enough simply to invest in industries in France; we must prevent them from relocating to places where labour is cheaper and where there are fewer regulations. This is a matter of safeguarding our sovereignty over our means of production and ensuring decent jobs and living conditions for our workers."
 FRA_left_front: "Expand the Coalition"
 FRA_left_front_desc: "Our government is in place but is not very stable, we lack allies. Perhaps we should seek allies amongst the other radical left-wing parties. They have not agreed to join our government, but perhaps we could persuade them to do so. We could offer them a few ministerial posts in exchange for their support."
 FRA_deal_devil_pcf: "A Deal With Socialists"
 FRA_deal_devil_pcf_desc: "The other radical left-wing parties will not be enough to secure the stability we hope for. Perhaps we could find common ground with the Socialist Party. After all, leaving Europe has never been part of our plans. We can surely find common ground with them so as to secure them into our coalition."
 FRA_tie_moscow: "Tie With Moscow"
 FRA_tie_moscow_desc: "Throughout the Cold War and even afterwards, our party has always sided with Moscow. Although the era of the USSR is over, it would appear that the current Russian authorities are in favour of communist ideals. Since our departure, we have been under threat from our former allies. A Russian ally would be a dream come true; we could establish economic cooperation."
 FRA_eu_communism_PCF: "Promote EuroCommunism"
 FRA_eu_communism_PCF_desc: "The USSR is now nothing more than a distant memory, and today we must manage without it in a world where Russia, our former model, vacillates between oligarchy and ultra-nationalism. Communism and the European Union are not incompatible; other European countries are not hostile to it. We can remain in Europe and do our best to steer it away from capitalism and fascism."
 FRA_retake_sovereign: "Reclaim Our Sovereignty"
 FRA_retake_sovereign_desc: "Now that we have regained control of our production apparatus, we have the means to go further. We must rid ourselves of foreign influence now that we have the means to act independently."
 FRA_empower_union_PCF: "Promote the Trade Unions"
 FRA_empower_union_PCF_desc: "Despite their former power, trade unions no longer carry much weight today. This is because the authorities have deliberately weakened them by dividing the working class and undermining job security. Yet having a force capable of standing up to employers is essential in our country. We cannot be everywhere at once; the working class must take back control of its future. We must help them regain their legitimacy in the eyes of the working class."
 FRA_green_communism: "Reach Out to the Greens"
 FRA_green_communism_desc: "Humanity is not the only victim of capitalism; our planet is also in danger because of humanity's reckless conduct. We can find common ground with the Greens; they can help us design our ecological programme, which we will also need."
 FRA_no_russian_claim: "The Russian Threat"
 FRA_no_russian_claim_desc: "It is highly likely that, sooner or later, the European Union will find itself in conflict with Russia. As Russia is likely to set its sights on Ukrainian and Baltic territories, we must begin by reaching out to the Ukrainians to offer them our assistance."
 FRA_green_turn: "Green Communism"
 FRA_green_turn_desc: "In collaboration with our green allies, we have drawn up an environmental programme that will enable us to prepare France for the challenges posed by climate change. This will require a great deal of effort on our part to rebuild our means of production whilst limiting their carbon footprint. But we must do this; the working class also has children who must be able to grow up in a liveable world."
 FRA_favor_lgbt: "End Discrimination"
 FRA_favor_lgbt_desc: "Now that we have secured the basic means of subsistence for our population by providing them with jobs and a future, we must also address discrimination within social classes. We must remind our people that discrimination on any grounds whatsoever is unacceptable. Our society must learn to accept all differences."
 FRA_dna_restored: "DNA Restored"
 FRA_dna_restored_desc: "With our coalition secured, we can focus on restoring the working class to prominence. By introducing extensive employment protection laws, we should be able to win back our electoral base. This will not please the business community, but that has never been our goal."
 FRA_condemn_rus: "Protect Eastern Europe"
 FRA_condemn_rus_desc: "Russian aggression may not stop at Ukraine. To protect our emerging Europe, we must ensure that the countries of Eastern and Northern Europe will be able to resist a potential Russian invasion."
 FRA_by_ourself: "Triumph of Reformism"
 FRA_by_ourself_desc: "By building a strong coalition, we have laid the groundwork for France to remain a left-wing nation. We have restored the electorate's trust in the left and its institutions. Without writing off the past, as long as we are here, we will never cease to fight against capitalism and fascism, both in Europe and across the world."
 FRA_friend_of_past_pcf: "Toward a New Comintern"
 FRA_friend_of_past_pcf_desc: "The Russian Communist government also appears to be sufficiently consolidated. We could propose to them that we expand our cooperation. It is time to restore communism to its former glory. The capitalists and fascists must learn to fear us once again."
 FRA_struggle_end: "The Struggle is Only Beginning"
 FRA_struggle_end_desc: "Over the course of these few years in office, we have put communism back on the political map. We have reconnected with our electorate and secured a future for generations to come. However, we are far from finished. There will always be further challenges to tackle. But we have at least ensured that the Left will no longer be the Trojan horse of neoliberalism."
 FRA_new_18th_brumaire: "A New 18th Brumaire"
 FRA_new_18th_brumaire_desc: "We Bonapartists have secured the highest offices of the Republic. The Republican opposition has been silenced, and we alone are capable of leading this country. Our enemies are legion, but nothing will stand between France and its destiny."
 FRA_revolution_bonapart: "The Revolutionary Legacy"
 FRA_revolution_bonapart_desc: "Napoleon I and the French Empire are the direct heirs of the French Revolution. As the French people are deeply attached to these values, we must show them that our Empire is not a restoration. Our Empire is the herald of a new revolution."
 FRA_despotism: "Despotism Rather Than Disorder"
 FRA_despotism_desc: "The unrest of recent months has caused considerable concern amongst our people and on the financial markets. We must reassure them that, as long as we are in power, no disorder will be tolerated."
 FRA_napoleon_constitution: "The Napoleonic Constitution"
 FRA_napoleon_constitution_desc: "The institutions of the former Republic are no longer suited to the present day or to our authority. We must reshape them to create a state that is stronger than ever."
 FRA_reform_military_napoleon: "The New Grand Armée"
 FRA_reform_military_napoleon_desc: "Our armed forces are more than adequate for a country like ours. But they are not capable of sustaining a prolonged conflict against multiple foreign powers. We must start from scratch and build an army that no one can defeat."
 FRA_question_eu: "Europe or the Empire"
 FRA_question_eu_desc: "As our country is a founding member of the European Union, it is deeply integrated into it, and breaking away would not be an easy task. Except that we intend, in fact, to fight against other European powers. Should we rejoin the institutions of the European Union, like the new French government, or should we go ahead and leave it for good? In any case, we will be forced to fight against them."
 FRA_centralised_admin: "Administrative Centralism"
 FRA_centralised_admin_desc: "Decentralisation was a mistake for our country. What we need is a clear chain of command and a vertical organisational structure."
 FRA_blame_ennemy: "Aggressive Rhetoric"
 FRA_blame_ennemy_desc: "Our nascent Empire is surrounded by its future enemies. Sooner or later we will be forced to fight them, but our society is not ready to wage war against our former allies. We have led them astray by speaking to them of a peaceful future; sooner or later they will be brought back to reality. To this end, we can prepare them by undermining their trust in our former partners and making them realise that we stand alone against everyone else."
 FRA_proclaim_empire: "An Imperial Proclamation"
 FRA_proclaim_empire_desc: "In a short space of time, we have succeeded in consolidating our power and creating the conditions for France's return to the international stage. It is now time to drop the pretences. We shall proclaim the return of the French Empire following a parade demonstrating the full extent of our military capabilities. A show of strength, a warning, the dawn of a new era for France. After that, we shall see things clearly: potential allies will come to us and our adversaries will reveal themselves."
 FRA_la_grande_armee: "The Backbone of Our Army"
 FRA_la_grande_armee_desc: "Having reformed our chain of command, we can now turn our attention to more specific reforms of our military structure. To begin with, we can focus on our offensive doctrine in terms of the actual resources available to conduct our operations."
 FRA_europe_nationalism: "Bolster European Nationalism"
 FRA_europe_nationalism_desc: "Few European nations have pledged their support to us. They view the return of a France led by a nationalist party with disfavour. Their stance is a mistake; they should know that it is better to be with us than against us. We're going to make them pay for their inaction. We're going to lend our support to nationalist groups in their countries. That should cause a right old mess back home, and if they come to power, we'll have gained an ally."
 FRA_plebiscites: "Rule by Plebiscite"
 FRA_plebiscites_desc: "The end of the Republic by no means meant that the people would be left with no means of making their views heard. We must show the people that they still have a say by inviting them to decide on various matters of our policy. The Emperor will have no trouble convincing them, and this sham democracy will be enough for most."
 FRA_firepower: "The Modern Firepower"
 FRA_firepower_desc: "During the Napoleonic Wars, the Grande Armée benefited from a number of innovations that enabled it to unleash unprecedented firepower on the counter-revolutionary forces. Today, the rules of bombardment have changed significantly with the advent of attack aircraft and drones on the battlefield. Our country is fortunate to excel in both artillery and aviation. We must therefore decide which to prioritise in order to streamline our production for battlefield support."
 FRA_8th_coalition: "Surrounded by Enemies"
 FRA_8th_coalition_desc: "Just as in the days of the Napoleonic Wars, a political game is clearly taking shape. Our enemies fear us and are just waiting for the first sign of weakness to join forces against us. We shall not grant them that satisfaction. Our borders will remain militarised for as long as necessary. The French Empire will only survive by confronting its adversaries; the difference from the past is that this time the coalition will not have time to form, for we shall crush them one by one."
 FRA_renew_meritocracy: "The Meritocratic Empire"
 FRA_renew_meritocracy_desc: "Although it was known to have its flaws, the First Empire owed its success to its preference for experience and professionalism over social class. Today, we must renew this promise of social advancement for the French people. They must understand that by working hard for the Empire and for France, they can rise higher than they ever have before."
 FRA_last_deluge: "Stronger Than Ever"
 FRA_last_deluge_desc: "We have carried out far-reaching reforms in our chain of command, our doctrines and our supply chains. Now all that remains is for us to open the doors of our army to mass recruitment. Conscription has not been a reality for a long time, but the French are ready to fight for their Empire. The Grande Armée will be ready to set out to conquer Europe."
 FRA_ennemy_isolate: "Infiltrate Our Opponents"
 FRA_ennemy_isolate_desc: "We have the means to infiltrate our adversaries' civil defence systems and strike them where it hurts. This will provide excellent training for our intelligence services, but it also risks making them wary of us."
 FRA_history_allies: "The Empire's Allies"
 FRA_history_allies_desc: "Although we are surrounded by enemies, we are not alone; many countries still maintain friendly relations with us and might be interested in joining our alliance. We could highlight our shared history with them to justify a future alliance. We can offer them significant benefits, and they will be of great help to us."
 FRA_imperial_pride: "Imperial Pride"
 FRA_imperial_pride_desc: "The French people have regained their pride. We have shown them that peace and the Republic were nothing but illusions, and that France's future lies in becoming an Empire. They are proud of their country and hate our adversaries. Our society and our economy are geared towards a protracted conflict."
 FRA_declare_hostile: "Test Their Defences"
 FRA_declare_hostile_desc: "We no longer have any reason to conceal our expansionist ambitions from our future enemies. It is time to show their people that they have every reason to fear us and to submit without making a fuss."
 FRA_our_own_system: "Our Own System"
 FRA_our_own_system_desc: "Every empire has its own alliance, and trying to triumph alone would be costly. A number of countries have already expressed a willingness to form an alliance with us. It is time to formalise this cooperation by creating a strong alliance between partners who respect one another."
 FRA_reclaim_empire: "Reclaim the Empire"
 FRA_reclaim_empire_desc: "The time has come to set out to reclaim our Empire. We have spent years preparing our society, our economy and our army. It is time for this work to bear fruit and for France to regain its rightful place in the world order."
 FRA_french_commune: "The Victorious Revolution"
 FRA_french_commune_desc: "We have succeeded in wresting control of the institutions from the moderate communists and other weak forces or puppets of capitalism. By accepting our rise to power, the French people are placing their trust in us. They, too, believe that capitalism can be defeated, and that is what we intend to set about doing. We shall rebuild our society and prepare for a showdown with the capitalist forces."
 FRA_purge_military: "Secure the General Staff"
 FRA_purge_military_desc: "Although we have succeeded in taking control of the institutions, the army, which has not intervened, may not always remain on our side. Sooner or later, we will have to face off militarily against another power. To ensure their loyalty, we must start at the top of the chain of command. They will realise quite readily that they have no choice, but will no doubt show some resistance for a few months. Once the top of the chain is brought into line, the rest will obey orders."
 FRA_worker_right_comm: "Reassure the Workers"
 FRA_worker_right_comm_desc: "Although the difficult phase of our revolution is now over, civil society has expressed serious concern about the situation in our country. We must reassure the workforce by guaranteeing them jobs and job security. This will require our production lines to adapt, but these guarantees will be beneficial for our future."
 FRA_people_constitution_comm: "The Dictatorship of the Proletariat"
 FRA_people_constitution_comm_desc: "The institutions of the Old Republic were fundamentally unjust. A small, corrupt caste exercised total control over the country. Our Revolution must give workers the tools to participate in the political life of the country they help to run. It is time to put an end to the unjust Republic and to devise a new form of governance."
 FRA_revolution_soil: "A Land of Revolution"
 FRA_revolution_soil_desc: "From the Jacqueries to the French Revolutions, the French people have shown that they oppose the injustice of authoritarian systems. In the wake of our Revolution, we must show them that their prayers have been heard and build an egalitarian society capable of withstanding all attacks by the counter-revolutionaries."
 FRA_hostile_nato_comm: "The Corrupted West"
 FRA_hostile_nato_comm_desc: "NATO is a puppet of the United States and Capitalism. As both are our mortal enemies, we must not remain in this alliance any longer. Sooner or later, they'll be our opponents."
 FRA_fate_eurocommunism: "Abandon the European Experiment"
 FRA_fate_eurocommunism_desc: "Even if we tried with all our might, we would not be able to set the institutions of the European Union back on the right track. They are riddled with the corruption of capitalism and lobbying. Moreover, these countries are firmly opposed to our domestic policy. The split will hurt our highly integrated economy, but this separation is necessary."
 FRA_legacy_patriwar: "The Legacy of the Great Patriotic War"
 FRA_legacy_patriwar_desc: "In the last century, the USSR showed the world that fascism could be defeated by force of arms. That war, which they fought successfully, taught us that a nation must stand united with its army. The Red Army would never have prevailed without the resilience of Soviet society. We must ensure that, in future conflicts, public enthusiasm remains at its highest. We will need all our strength for what lies ahead."
 FRA_focus_education: "Popular Education"
 FRA_focus_education_desc: "Whether it is to get involved in politics or to be effective and happy at work, our people need to be informed. We must give everyone the chance to learn everything they need to understand the world without falling for the propaganda of capitalists and fascists."
 FRA_loyalty_cause: "Loyalty to the Cause"
 FRA_loyalty_cause_desc: "We have granted our people numerous rights, from better working conditions to political representation, and we have rectified many wrongs. These new rights, however, come with responsibilities. Dissent is permitted, but every citizen is required to submit fully to the will of the collective. We govern this society together; it is therefore everyone's responsibility to ensure that it continues to function properly."
 FRA_paris_commune: "The Lessons of the Paris Commune"
 FRA_paris_commune_desc: "Although the links between the Paris Commune and the communist ideology we espouse are far from obvious, we can still learn lessons from this turbulent period. The Paris Commune perished because of its lack of resources and will to fight the forces of the counterrevolution. In this cruel world, corrupted by globalisation, we must keep in mind that the survival of our revolution depends on crushing the counterrevolutionary forces. Our society must be aware of this and stand together to confront our adversaries."
 FRA_unleash_agent: "Destabilise the Capitalists"
 FRA_unleash_agent_desc: "We won't always be able to confront our adversaries on the battlefield; that would be too costly, and we might end up being defeated. We can, however, make life easier for ourselves by destroying their society from within. With the DGSE, we have an intelligence agency trained in espionage and destabilisation, and we could put it to good use. We'll export the revolution without waging war, and there's nothing the capitalists can do to stop it."
 FRA_spread_communism_eu: "Spread Communism in Europe"
 FRA_spread_communism_eu_desc: "We cannot change the European institutions, but we can encourage some of its member states to rebel. Since the neoliberal policies implemented across the EU are not to everyone's liking, we will have no trouble convincing a portion of their populations to join us."
 FRA_red_army_comm: "The New Red Army"
 FRA_red_army_comm_desc: "Thanks to our reforms, the army is fully under the commune's control, and civil society is ready to fight alongside its armed forces. Our reforms have also unlocked its full potential; our soldiers know that justice is on our side. The commune must not fall, for it carries the torch of the revolution."
 FRA_collectivisation: "Collectivisation of the Economy"
 FRA_collectivisation_desc: "Control of the economy has always eluded the working class, remaining in the hands of a few families. Before the revolution, the oligarchy reigned supreme in this country. But now that is over; the French people are regaining control of their means of production. With this, we will ensure the loyalty of our means of production, as well as the financial security of our population."
 FRA_enforce_unions: "Empower the Trade Unions"
 FRA_enforce_unions_desc: "Now that we have collectivised the French economy and given workers greater political responsibility, we must ensure that they are able to retain control should the state prove less prudent. The trade unions may have been reinstated by our moderate predecessors, but we can do more than that. We will give the trade unions even more power and encourage workers to join them. United workers must never cease to play a significant role in our country's decision-making."
 FRA_glorious_past_comm: "The Questionable Past of Communism"
 FRA_glorious_past_comm_desc: "Whilst not all of Europe has fond memories of Stalinist communism, particularly in Eastern Europe, we must remind them that we are different. These countries were crushed by Stalinist totalitarianism, which did not liberate the people but merely gave them a new master. Our only enemies are capitalism and fascism; if these countries need to free themselves from them, we can help them do so. But our aim will not be to enslave them, but rather to integrate them into our Union of the Proletariat of all nations."
 FRA_befriend_comm: "Workers Unity"
 FRA_befriend_comm_desc: "Although communism is less in vogue in this new millennium, we are not alone in following its teachings. In the struggle that lies ahead, we need allies, and we can find them amongst those countries that, like us, have chosen to resist capitalism. We must propose to these countries that we help one another to destroy capitalism throughout the world. They are not alone, and neither are we."
 FRA_final_struggle: "The Final Struggle"
 FRA_final_struggle_desc: "Our society and our army are ready to fight against capitalism. They are aware of the progress we have made and of the capitalist powers' determination to wipe us off the map. We will fight to the bitter end to defeat capitalism."
 FRA_UFSR_born: "Communism with French Characteristics"
 FRA_UFSR_born_desc: "The combination of Communist ideology and the French people's determination to defend their rights was a very good idea. We have made it clear to the public that they must get involved in politics and that they have the means to do so. Just as the Fête de la Fédération marks our national holiday, it can be said that the revolution has now truly been accepted by the French people. This is a historic day for our country."
 FRA_new_kommintern: "Towards a New International"
 FRA_new_kommintern_desc: "Many groups around the world have responded to our call for a World Revolution. It is time to put our alliance into practice and prepare to take on capitalism."
 FRA_cold_war_round2: "The World Revolution"
 FRA_cold_war_round2_desc: "The time has come to fight against capitalism and fascism. We will bring freedom to workers in every country. The oligarchy will be defeated."
 FRA_kingdom_history: "A Long History of Monarchy"
 FRA_kingdom_history_desc: "The monarchy has returned in France. Our supporters have taken control of the institutions of the former Republic and have called for our return. And here we are, two centuries after the fall of the absolute monarchy, back on the throne of France. A long journey lies ahead of us. We must eradicate the Republican legacy of the Revolution whilst rebuilding the new Kingdom of France. Meanwhile, our enemies lie in wait for us in the shadows, but we shall succeed, for God is with us, as He always has been."
 FRA_camelot: "The King's Camelots"
 FRA_camelot_desc: "To ensure that the population remains compliant and does not dream of a new Republic, we must step up surveillance, and to do so we need a political police force. To this end, we can make use of former members of Action Française who were trained by the DGSI. We will merge these organisations into a new body which we shall call the King's Camelots, in homage to our royalist activists of the last century."
 FRA_decentralisation_king: "Complete Decentralisation"
 FRA_decentralisation_king_desc: "The centralisation inherited from Jacobinism and the Revolution did not turn the French into citizens but into subjects. The systems of customary law operating at lower levels served their purpose very well as a link between the citizen and the central state. Fortunately, our country had already begun to move away from centralism in order to comply with European Union standards. We can therefore complete this transition, not to conform to the mould of European regions, but to restore the system of local authority like before the Revolution."
 FRA_king_rule: "Regnum Regis"
 FRA_king_rule_desc: "The first step in erasing the memory of the Revolution is to build a new system on the ruins of the old one. We can therefore announce the abolition of the Republic and the drafting of a new constitution. This constitution will be centred on the King, who will wield absolute power, just as in the good old days."
 FRA_national_integralism: "Integral Nationalism"
 FRA_national_integralism_desc: "To help the French people understand what a failure the Revolution was and its consequences, we must highlight a famous theory put forward by the thinker Charles Maurras. Integral Nationalism portrays a Republic that has abandoned patriotism as a result of a Revolution instigated by Freemasons, heretics and foreigners. It advocates a return to national unity and the moral order embodied by the Catholic Church. These teachings are full of virtue and are entirely applicable to our nascent Kingdom. Our Kingdom has just found its manifesto."
 FRA_no_more_eu: "Leave the European Union"
 FRA_no_more_eu_desc: "The European Union embodies everything we are fighting against: unbridled liberalism, sickening idealism, disastrous naivety and pervasive corruption. This organisation's sole aim is to dismantle our nations and our cultures. We therefore have no reason to remain part of this union. We must leave before it is too late, whatever the consequences."
 FRA_eu_kingdom: "The Fallen Monarchies"
 FRA_eu_kingdom_desc: "A few centuries ago, Europe was a continent of monarchies. The international order at that time was, in a sense, shaped by the balance of power and alliances. But those days are long gone. Nationalism has either swept away the monarchies or reduced them to the status of tourist attractions. The best we can do to find allies, therefore, is to help the supporters of absolutism in Europe rise up against their Republican oppressors."
 FRA_king_modern_chivalry: "Modern Chivalry"
 FRA_king_modern_chivalry_desc: "The Kingdom of France has always been renowned for its cavalry and the decisive role it played in the battles it fought. Today, the cavalry resembles a 60-tonne steel monster. Yet its role remains decisive. Our armed forces would do well to focus on making extensive use of armoured cavalry."
 FRA_no_deceit: "End Decadence"
 FRA_no_deceit_desc: "Our main enemy is the decadence that the Republic has instilled in our society: citizens who have strayed from moral order and who expect the state to pay for everything. We must bring them back to reality. The era of the Republic is over. Our Kingdom wants virtuous citizens."
 FRA_frankish_ancestor: "Our Ancestors, the Franks"
 FRA_frankish_ancestor_desc: "We French people are descended from the Franks; that is our people and our identity. The Republicans wanted to eradicate the monarchy and the Franks, but no one can wipe out a civilisation and a culture from within. It is our heritage, and it is up to us to reclaim it."
 FRA_against_liberalism: "Against Liberalism and Socialism"
 FRA_against_liberalism_desc: "The Republic has led our citizens to believe that they need more freedoms and rights. Our Kingdom aims to right these wrongs. Above all, our citizens need to rediscover the path to moral order and the unity of our nation around its king. Everything else is secondary."
 FRA_historical_ennemy: "The Eternal Enemy"
 FRA_historical_ennemy_desc: "If there is one adversary with whom we have clashed over the centuries, it is undoubtedly the United Kingdom. It, too, is a monarchy, although the monarch now holds no real power. We will surely find ourselves facing them sooner or later. But whether it is them or others, our navy must be prepared to fight against maritime powers."
 FRA_friend_pope: "Protect the Papacy"
 FRA_friend_pope_desc: "As the eldest daughter of the Church, France has a duty to protect the papacy from all who might seek to attack it."
 FRA_army_of_elites: "An Elite Force"
 FRA_army_of_elites_desc: "It was the Revolution that introduced the concept of conscription. We saw during the last two world wars that this was not necessarily the best of ideas. Soldiers who were not always properly trained were sent to their deaths. These decisions decimated the French population in the last century. We must ensure that our army remains professional by tightening recruitment criteria. This will also prevent us from ending up with troublemakers within our ranks."
 FRA_positive_inequality: "Positive Inequality"
 FRA_positive_inequality_desc: "Not everything needs to be egalitarian. The idea that we should all be equal is yet another invention of the Revolution. Some people are meant to lead, whilst others are meant to follow. The French need to realise this, because spending one's time complaining about other people's success reduces everyone's efficiency."
 FRA_destroy_republicanism: "Destroy Republicanism"
 FRA_destroy_republicanism_desc: "Absolutism has returned to our Kingdom. There is no longer any reason to perpetuate this illusion of democracy that is politics. The only party that has any right to exist is the King's One. The French must understand that I am the State!"
 FRA_catholic_league: "Found the Catholic League"
 FRA_catholic_league_desc: "Our rapprochement with the Church has not left everyone indifferent. Some countries have shown their support for us. Perhaps we could extend our crusade to other Catholic powers. After all, they too have the right to fight to reclaim the Holy Land."
 FRA_burry_revolution: "Bury the Revolution"
 FRA_burry_revolution_desc: "The French people have finally come to realise that the Revolution brought nothing but misery and that the primacy of the French monarchy was the natural order of things. Our institutions have also been purged of revolutionary elements. We can therefore say that we have successfully turned the page on that accursed Revolution."
 FRA_elder_daughter: "The Eldest Daughter of the Church"
 FRA_elder_daughter_desc: "France has regained its place in the world order. We shall be, as we have long been, the defenders of Christendom, and we shall reclaim the Holy Land, as we have done so many times before."
 FRA_republican_cancer: "The Republican Cancer"
 FRA_republican_cancer_desc: "Our country has succeeded in ridding itself of Republicanism, but we are more or less the only ones in Europe who are no longer under its rule. It goes without saying that if we are defeated in battle, our adversaries will plunge us back into the Republican nightmare. We must destroy the Republican threat wherever it may be found. Only in this way will we be safe."
 FRA_crusade: "Reclaim Our Estate"
 FRA_crusade_desc: "Whether it is to reclaim the land of our Frankish ancestors or to take back the Holy Land, we will in any case have to confront the powers of Europe and the Middle East. It is time for us to go to war."


 # Industrial Tree
 FRA_economic_policy: "The Bercy Agenda"
 FRA_economic_policy_desc: "Bercy commands the Treasury directorate and the statisticians of INSEE, and every ministry that spends a franc answers to it in the end. France sits fifth among the world's economies, a rank held by policy rather than by size."
 FRA_free_market: "Into the Single Market"
 FRA_free_market_desc: "The single market has taken price-setting out of the ministry's hands and left our exporters to compete on their own terms. France Telecom and Air France have already passed into private ownership. What remains is to open the rest and let the trade come to us."
 FRA_total_sa: "Total SA"
 FRA_total_sa_desc: "Total has swallowed Petrofina and Elf Aquitaine to become one of the largest producers on earth, holding the Lacq gas field and the Parentis wells with the engineering run out of the CSTJF centre at Pau. Aquitaine still holds more than the majors have bothered to lift. A partnership on the Republic's terms would put that oil to work for us."
 FRA_french_economic_intervention: "Dirigisme"
 FRA_french_economic_intervention_desc: "Colbert set the pattern: the state picks the industries that matter and builds the champions to run them. The planning commissariat drafts the direction and the ministries hold the credit. Plants already standing will be pushed harder, whatever that does to the permit queue for new ones."
 FRA_reduction_in_taxes: "Cutting the Taxe Professionnelle"
 FRA_reduction_in_taxes_desc: "The taxe professionnelle falls on machinery and premises, which is to say on exactly the investment we claim to want. Add the social contributions and France carries one of the heaviest burdens of compulsory levies in Europe. Cutting it back should leave something in the tills and the pay packets."
 FRA_deregulation: "The Attali Commission"
 FRA_deregulation_desc: "The Commission for the Liberation of French Growth, chaired by Jacques Attali, has set out where the rules bind hardest: commercial zoning, protected professions, permits that take years. Lifting them opens ground for development in regions the planners had written off. The unions will read every line of it as a threat."
 FRA_state_stock_in_sa: "The Golden Share"
 FRA_state_stock_in_sa_desc: "A golden share and the equity held through the Agence des Participations de l'Etat give the Republic a vote that no shareholder meeting can outnumber. Output, export contracts and the price at the pump all cross a desk we control."
 FRA_paris_employment_projects: "The Grand Paris Works"
 FRA_paris_employment_projects_desc: "Seine-Saint-Denis has never recovered the work it lost, while the towers of La Defense rise a few stations down the line. The Grand Paris works can put the difference to use: sites, contracts and payrolls inside the Ile-de-France."
 FRA_nationalization_of_steel: "Reclaiming Usinor"
 FRA_nationalization_of_steel_desc: "Usinor-Sacilor holds the Lorraine basin and the works at Fos-sur-Mer and Florange, and it answers to its shareholders rather than to the Republic. Steel stops being a commodity the moment the shipyards and the tank plants depend on it. Taking the mills into state hands will delight the unions and enrage the boardrooms."
 FRA_private_contracting: "Contracting the Majors"
 FRA_private_contracting_desc: "Bouygues, Vinci and Eiffage will bid on partnership contracts where the contractor sets the price and keeps the margin. Sites finish faster than any ministry could manage them, and we pay the premium for it."
 FRA_tapping_resources: "Brignoles and Salau"
 FRA_tapping_resources_desc: "Provencal bauxite around Brignoles and Les Baux feeds the alumina works at Gardanne, and tungsten ore still lies under the Ariege at Salau. The deposits were abandoned when imports were cheaper. Reopening them is the difference between buying our alloys and making them."
 FRA_offshore_oilrigs: "The Guyane Maritime Licence"
 FRA_offshore_oilrigs_desc: "The Zaedyus prospect off Kourou proved that the Guyane Maritime blocks hold oil in deep water. The licence is ours to award and the rigs can be on station within the year. Guyana and Suriname claim the same seabed and will say so loudly."
 FRA_state_run_construction: "State-Led Public Works"
 FRA_state_run_construction_desc: "Under public project ownership the administration sets the price, the schedule and the headcount, and no contractor takes a margin out of it. The failing is familiar: a site voted through without full funding leaves the crews standing around for a season."
 FRA_infrastructure_projects: "State-Region Plan Contracts"
 FRA_infrastructure_projects_desc: "The plan contracts negotiated between the state and each regional council co-finance the roads, rail and networks no council could fund alone. The motorway revival plan and the regional planning offices already have the files open."
 FRA_decentralization: "Act II of Decentralisation"
 FRA_decentralization_desc: "The constitution can be made to say plainly that the organisation of the Republic is decentralised. Competences and the taxes to pay for them pass from the prefects to the regional councils, and decisions get made where the problem actually is. Paris keeps rather less than it is used to keeping."
 FRA_centralization: "The Jacobin State"
 FRA_centralization_desc: "The Jacobin tradition holds that one Republic means one administration, and the prefectoral corps exists to enforce it. Every line of regional spending comes back to Bercy for signature. It costs a fortune in clerks and it delivers a state that moves when it is told to."
 FRA_french_healthcare: "The Securite Sociale"
 FRA_french_healthcare_desc: "The Securite Sociale covers everyone, and the World Health Organisation has ranked the result first in the world. Whatever else the Republic argues about, nobody campaigns on dismantling it. Raising the health budget to match what it already promises buys quiet at home, and it is not cheap."
 FRA_french_arms_industries: "Direction Generale de l'Armement"
 FRA_french_arms_industries_desc: "The Direction Generale de l'Armement writes the requirements and signs the cheques for Nexter, Dassault, Thales, Naval Group, MBDA and Safran. It is the reason France can design a fighter, a frigate and a missile without asking anyone's permission."
 FRA_research_and_dev_projects: "CNRS and the CEA"
 FRA_research_and_dev_projects_desc: "CNRS laboratories and the Atomic Energy Commission carry French science, while the research tax credit pulls private money in behind them. Competitiveness clusters tie the universities to the industries around them. The bill lands on the education budget."
 FRA_reformed_universal_healthcare: "Universal Medical Protection"
 FRA_reformed_universal_healthcare_desc: "Universal medical protection replaces the means-tested patchwork, so cover follows residence rather than employment. A healthier population and a quieter one, bought at the price of a reform nobody in the ministries wanted to administer. The rural interior still has districts with no doctor at all, and hospitals paid by activity have no reason to open one."
 FRA_nexter: "Nexter Systems"
 FRA_nexter_desc: "GIAT Industries, reborn as Nexter, builds the Leclerc main battle tank, the CAESAR truck-mounted howitzer and the VBCI. Design sits at Satory outside Paris and assembly runs at Roanne. Both sites hold capacity we have never fully paid for."
 FRA_dassault: "Dassault Aviation"
 FRA_dassault_desc: "Dassault Aviation builds the Rafale and the Mirage 2000, the Falcon business jets that help pay for them, and the nEUROn demonstrator that comes next. Final assembly runs at Merignac outside Bordeaux, backed by the aerospace cluster across the Midi-Pyrenees."
 FRA_thales_group: "Thales and Naval Group"
 FRA_thales_group_desc: "Thomson-CSF has become Thales, supplying the radars and combat systems aboard the FREMM frigates and the carrier Charles de Gaulle. The hulls come from the yards at Saint-Nazaire and the submarine halls at Cherbourg. Keeping all of it busy is the most expensive commitment in the industry."
 FRA_usa_fra_collaboration: "The Safran-GE Partnership"
 FRA_usa_fra_collaboration_desc: "CFM International, the joint venture between Safran and General Electric, has put French engines under American wings and paid both partners handsomely. CNES instruments already fly on NASA missions. There is room to widen the arrangement to the laboratories behind them."
 FRA_the_french_agriculture: "Granary of Europe"
 FRA_the_french_agriculture_desc: "France is the largest agricultural producer in the Union and draws the largest share of the Common Agricultural Policy. The FNSEA speaks for the farms and the Paris farm show is where politicians go to be seen. Good soil is a strategic holding, and it should be worked like one."
 FRA_the_vineyard_industries: "The Appellations"
 FRA_the_vineyard_industries_desc: "The appellation system policed by the INAO is what separates Bordeaux, Burgundy and Champagne from every imitation abroad. Moet Hennessy sells the result in every market on earth. No advertising budget buys a reputation of that kind."
 FRA_the_dairy_industry: "Lactalis and the Cooperatives"
 FRA_the_dairy_industry_desc: "Lactalis and Danone buy from the Sodiaal cooperative and from herds across Normandy and the Jura. Comte and Camembert carry protected names, and what does not go to the cheesemakers goes into powders, yoghurts and infant formula sold worldwide."
 FRA_wheat_industry: "Wheat from the Beauce"
 FRA_wheat_industry_desc: "The Beauce plain is the granary of France, and its harvest moves by rail to Rouen, the largest grain export port in Europe. Buyers across North Africa and the Near East depend on those cargoes arriving, which is a form of influence no embassy can match."
 FRA_mechanized_agriculture: "The Machinery Cooperatives"
 FRA_mechanized_agriculture_desc: "Shared machinery cooperatives put combines and balers within reach of farms that could never buy them outright. Kuhn implements from Saverne, Manitou handlers and satellite-guided harvesters are already in the fields. The engineering behind them is worth developing at home."
 FRA_packaging_industries: "Sidel and Verallia"
 FRA_packaging_industries_desc: "Sidel builds the bottling and packaging lines in Normandy that the food industry runs on, and Verallia, spun out of Saint-Gobain, supplies the glass. Packaging made in France and made recyclable keeps the value chain from ending at the border."
 FRA_agriculture_industry: "The Agri-Food Giants"
 FRA_agriculture_industry_desc: "Danone, Lactalis, Bel and Bonduelle turn the harvest into branded exports that hold their price in any market. Feeding ourselves is the floor. Selling the surplus is the return."
 FRA_improved_railways: "Reseau Ferre de France"
 FRA_improved_railways_desc: "Reseau Ferre de France owns the track beneath every SNCF service, so the state decides what gets built on it. Alstom signalling and the surveys for new high-speed alignments are where the next generation of the network is settled."
 FRA_focus_on_rails: "Rolling Stock from Belfort"
 FRA_focus_on_rails_desc: "Alstom builds locomotives at Belfort and carriages at La Rochelle, double-deck high-speed sets for the main lines and regional trainsets at Crespin. Orders placed now keep those halls open and the rolling stock coming."
 FRA_high_speed_rail_lines: "The LGV Europeenne"
 FRA_high_speed_rail_lines_desc: "The high-speed line running east to Strasbourg and the Rhine puts our network into Germany, while Thalys and Eurostar carry it through the Channel Tunnel. The world rail speed record stands on French track. There is no reason the map should stop at the border."
 FRA_luxury_goods: "LVMH and Kering"
 FRA_luxury_goods_desc: "LVMH, Kering, Hermes and Chanel dominate a trade nobody abroad has managed to copy, and the Comite Colbert guards the craft behind it. Place Vendome and Avenue Montaigne are addresses that sell on their own. The houses stay in Paris, and so should their headquarters."
 FRA_tourism_industry: "Atout France"
 FRA_tourism_industry_desc: "Atout France promotes the most visited country on earth, and the receipts show it. The Louvre, the Eiffel Tower and Disneyland Paris draw crowds the cities can no longer absorb, and the residents have begun to say so out loud."
 FRA_the_gorgeous_coasts: "The Coastal Conservancy"
 FRA_the_gorgeous_coasts_desc: "The Conservatoire du Littoral buys shoreline before it can be built over, from the Cote Fleurie in Normandy to the cliffs of Corsica, the Cote d'Azur and the Atlantic beaches of the Pays de la Loire. Made accessible, these coasts take the pressure off the cities."
 FRA_the_spaces_between: "La France Profonde"
 FRA_the_spaces_between_desc: "Futuroscope outside Poitiers proved that a field in the interior can draw millions. The plateaus of the Limousin, the vineyards and cathedral of Reims and the Alpine resorts of Savoy have the same claim and none of the crowding. What they lack is connection, and the villages the railways left behind will not wait forever."
 FRA_beaches_of_france: "Deauville to Biarritz"
 FRA_beaches_of_france_desc: "The landing beaches of Normandy, the surf coast at Biarritz and the wide sands of the Cote d'Opale draw visitors who never set foot in Paris. Spread across the seasons and the regions, the trade hires all year and nobody resents it."
 FRA_energy_sector: "The Messmer Plan"
 FRA_energy_sector_desc: "The Messmer programme put reactors along the Rhone, the Rhine and the Channel, and three quarters of the grid now runs on fission. EDF, Framatome and the Atomic Energy Commission built it and still run it. No cartel abroad sets the price of French electricity."
 FRA_renewable_investments: "Dams of the Rhone"
 FRA_renewable_investments_desc: "The Compagnie Nationale du Rhone runs a chain of dams the length of the river, with Serre-Poncon and the Alpine pumped storage above them and the Truyere dams across the Auvergne. The tidal plant on the Rance has been turning since long before anyone called this renewable. Water keeps falling whatever the fuel market does."
 FRA_solar_investments: "Solar in the Midi"
 FRA_solar_investments_desc: "The Provencal sunbelt and the lower Rhone valley get light the north can only envy, and EDF Renouvelables is already building parks there. The solar furnace at Odeillo has been proving the physics since long before panels were affordable. It is expensive, and it is inexhaustible."
 FRA_wind_investments: "The Tramontane Corridor"
 FRA_wind_investments_desc: "The northern plains carry wind fields from horizon to horizon, and the nacelles for the Atlantic parks are assembled at Saint-Nazaire and Le Havre. The tramontane down the Aude turned the first French turbines and proved the case decades ago. The wind costs nothing and it does not stop."
 FRA_the_northern_reactors: "The Chooz Reactors"
 FRA_the_northern_reactors_desc: "The reactors at Chooz stand on the Meuse in the Ardennes, with Nogent on the Seine downstream, both drawing cooling water from rivers that cross borders. Two fully updated units there would secure the northern grid for a generation. Brussels and Berlin will complain the moment the plans are published."
 FRA_improved_nuclear_waste_management: "La Hague and Bure"
 FRA_improved_nuclear_waste_management_desc: "La Hague reprocesses spent fuel into mixed-oxide, Marcoule handles what cannot be reused, and the deep repository at Bure is being dug for the remainder. Waste is the argument our opponents make best, so it is the one we must answer."
 FRA_expanded_enrichment_facilities: "Georges Besse II"
 FRA_expanded_enrichment_facilities_desc: "Centrifuge enrichment at Georges Besse II on the Tricastin site replaces diffusion halls that consumed a reactor's worth of power to run. Enriching at home means fuel that owes nothing to a foreign supplier."
 FRA_the_new_energy_dawn: "The Light of Europe"
 FRA_the_new_energy_dawn_desc: "The interconnectors carry surplus current to Britain, Italy, Spain and Germany, and France stands as the largest net exporter of electricity on the continent. Our neighbours pay for what our own grid does not need."

 # Military
 FRA_french_armed_forces: "French Armed Forces"
 FRA_french_armed_forces_desc: "For the majority of French history the French Armed Forces have been a source of immense pride in our country. From the armies that marched against the English to defend our right to a French King, to the men who served under Napoleon himself, the military remains one of our clearest claims to set us apart from others."
 FRA_the_french_army: "Armée de Terre"
 FRA_the_french_army_desc: "The 'Armée de Terre,' or French Army, is one of the three core branches of our armed forces structure. The accomplishments of our army are sung far and wide. The forces should continue to be honoured and expanded to push our country further forward."
 FRA_the_french_air_force: "Armée de l'Air"
 FRA_the_french_air_force_desc: "Our air force is among the oldest in the world. The very first contingent of French air power was formed in 1909 as a wing of the French army. Now, it is its own independent wing, and we export one of the finest pieces of airpower in the world."
 FRA_french_navy: "Marine Nationale"
 FRA_french_navy_desc: "The French navy helped push our ambitions and our desires on a global scale. It helped found one of the largest colonial empires the world has seen, rivalling the Spanish and English. Investing in this will allow us to further project abroad."
 FRA_amx_leclerc: "AMX Leclerc"
 FRA_amx_leclerc_desc: "The AMX Leclerc and its successors are the MBT class of the French military. It is robust and well-rounded like most modern tanks. Investing further in their development can boost our armoured corps."
 FRA_network_centric_warfare: "Network Centric Warfare"
 FRA_network_centric_warfare_desc: "Much like the Americans and other European majors we should invest in more technologically advanced methods of warfare to pull away from using people and begin to rely heavily on technology. The change will be expensive, but it will ultimately save more French lives."
 FRA_land_air_coordination: "Land-air Coordination"
 FRA_land_air_coordination_desc: "Land-air coordination is vital to any joint task force operation. Without ground forces, we cannot push the frontlines; without air, we cannot expect efficient fire support. Therefore, we should push to better coordinate between the air war and the ground war."
 FRA_the_mirage: "The Mirage"
 FRA_the_mirage_desc: "The Mirage has become one of those iconic fighters for the French Air Force. It is used in service by nine other countries in the world and is an imported fighter by many."
 FRA_maritime_fighters: "Maritime Fighters"
 FRA_maritime_fighters_desc: "The improvements on both our air force and navy are going to require more efficient naval warfare fighters."
 FRA_lafayette_class: "Frégate Légère Furtive"
 FRA_lafayette_class_desc: "The Frégate Légère Furtive class frigates were designed in the late 1980s to replace ageing destroyers. The ships are light, multi-purpose vessels well suited to defence roles in the French fleet."
 FRA_de_gaulle_class: "De Gaulle Class"
 FRA_de_gaulle_class_desc: "The De Gaulle Class Aircraft Carrier is the tenth aircraft carrier made for service in the French navy. It is also the only nuclear-powered aircraft carrier outside of the USN, making it a formidable and strong carrier."
 FRA_amx_10: "AMX-10"
 FRA_amx_10_desc: "The AMX-10 is a light recon tank for the French army. The AMX boasts an impressive speed of 85km on ideal terrain. Needless to say, the AMX moves fast as hell."
 FRA_vbci: "VBCI"
 FRA_vbci_desc: "The VBCI was developed to replace the ageing AMX-10P, entering service by 2008. The VBCI has many improvements, including being faster than the speedster AMX by having a max speed of 100km/h. However, the VBCI sacrifices the big boi gun in favour of a lighter armament and higher speeds."
 FRA_forward_air_bases: "Forward Air Bases"
 FRA_forward_air_bases_desc: "To prepare for any outcome, we must build up our forward air bases to ensure properly staged offensive or defensive plans."
 FRA_mirage_2000d: "Mirage 2000D"
 FRA_mirage_2000d_desc: "The Mirage 2000D is a run-of-the-mill attack plane that has served us faithfully since its conception. Pushing for future and better planes will only honour the Mirage's legacy."
 FRA_carrier_fighters: "Rafale Marine"
 FRA_carrier_fighters_desc: "The Rafale Marine is a carrier version of the common Rafale fighter. It boasts a similar build to its land-based variant. Overall, the fighter is a monster in the battle for the seas."
 FRA_med_naval_bases: "Mediterranean Naval Bases"
 FRA_med_naval_bases_desc: "Corsica is prime territory for an improved naval base. It is detached from the mainland, while also being relatively defensible."
 FRA_triomphant_class: "Triomphant Class"
 FRA_triomphant_class_desc: "The Triomphant class submarines were built to supersede earlier boats and are now the fundamental portion of the ocean-going branch of the nuclear deterrent forces."
 FRA_ifv_investment: "IFV Investment"
 FRA_ifv_investment_desc: "Investing in better IFVs and other forms of light armour vehicles should be able to help us boost our military and economy!"
 FRA_national_arms_exports: "National Arms Exports"
 FRA_national_arms_exports_desc: "France has become a major defence industry player, and we should continue this path."
 FRA_the_space_program: "The Space Programme"
 FRA_the_space_program_desc: "Space is a new frontier, and as of recently we have proven that we can learn many great things from space! It is worth reestablishing confidence in our space programme."
 FRA_floreal_class: "Floreal Class"
 FRA_floreal_class_desc: "The Floreal class represents most light frigates in the French armada. The Floreal class and its successors are active ships meant for multi-purpose combat between both Anti-Ship, Naval-Land support, Anti-Aircraft, and moderate Anti-Submarine warfare."
 FRA_laredoubtable_class: "Le Redoutable Class"
 FRA_laredoubtable_class_desc: "The Redoutable class submarines are some of the oldest submarines in service by the French navy. However, they are not to be doubted as they are pivotal in French nuclear deterrent naval strategies."
 FRA_honour_and_fidelity: "Honneur et Fidélité"
 FRA_honour_and_fidelity_desc: "The motto of the French legion resonates well with our country. The military embodies these values in particular: honour in both what they do, and fidelity through their undying faithfulness to the French homeland."
 FRA_cnes_budgeting: "CNES Budgeting"
 FRA_cnes_budgeting_desc: "CNES is the main portion of French aviation and aeronautics. We should allow budgeting for the CNES so we can continue to push and stay competitive in this new frontier."
 FRA_international_space_research: "International Space Initiative"
 FRA_international_space_research_desc: "We should work with other countries like the United States to start pushing forward this frontier!"
 FRA_kourou_launch_pad: "Kourou LaunchPad"
 FRA_kourou_launch_pad_desc: "Kourou in French Guyana is both a strategic space launch location and direct territory owned by us. We can also broker deals with other space agencies about them using this excellent location."
 FRA_honour_homeland_valour_discipline: "Honneur, Patrie, Valeur, Discipline"
 FRA_honour_homeland_valour_discipline_desc: "The motto of the French Navy expresses more than just what it means to serve in the military. Our people are one with the motherland, filled with honour and valour, and disciplined in their courage."
 FRA_french_space: "French Space"
 FRA_french_space_desc: "Our dominance in space functions moving forward is vital for a future in the resources and gains that are to be had in the skies up above."
 
 # Francosphere Section
 FRA_francosphere: "Francosphere"
 FRA_francosphere_desc: "France has been practising a method of neocolonialism since the end of World War II. While not directly occupying these nations' lands, France has been a puppet master pulling the strings in its favour. However, with the start of the twenty-first century, many are willing to reduce their dependence on Paris as a source of leadership. Therefore, it is now time for France to act accordingly."
 FRA_the_levant_problem: "The Levant Problem"
 FRA_the_levant_problem_desc: "The Levant is an often overlooked section of the Francosphere. The region once provided valuable grain, fruits and oil to the French empire."
 FRA_antagonize_syria: "Antagonise Syria"
 FRA_antagonize_syria_desc: "Syria under the al-Assads has made far too many wrong decisions. We should destabilise the regime and start to help encourage Syria toward our ideology and depose the dictators."
 FRA_supporting_armenia: "Supporting Armenia"
 FRA_supporting_armenia_desc: "Armenia is a newcomer to the Francosphere but they are a strategic ally nonetheless. The struggles of the nation remind us much of our own and we must support Armenia in her struggles in the Karabakh."
 FRA_anti_assad_regime_message: "Anti-Assad Regime Message"
 FRA_anti_assad_regime_message_desc: "Although we have been broadly antagonistic against Syria, it is now time we become blatant and no longer tiptoe around what we truly mean. Syria's leadership under the Assads has taken a turn for the worst and we must continue to state our disdain for the al-Assads."
 FRA_escalation_from_the_damascus_spring: "Escalation From The Damascus Spring"
 FRA_escalation_from_the_damascus_spring_desc: "The Damascus Spring has started in full force. It is now pivotal we continue to throw our support behind the pro-democratic movements in Syria and across the Middle East."
 FRA_collaboration_with_the_fsa: "Collaboration With Syrian Rebels"
 FRA_collaboration_with_the_fsa_desc: "The rebels will need a considerable amount of resources to contest the al-Assads. We should look into our options and what we can provide to the group that will lead Syria forward."
 FRA_oil_and_gas_investments: "Oil & Gas Investments"
 FRA_oil_and_gas_investments_desc: "The Levant particularly has a considerable amount of oil & gas reserves. It will forever be advantageous to invest resources and manpower in the oil & gas industries in the region."
 FRA_reminder_of_the_taif_agreement: "Reminder Of The Taif Agreement"
 FRA_reminder_of_the_taif_agreement_desc: "The Taif Agreement, officially known as the National Reconciliation Accord, was reached to signify the end of the Lebanese Civil War and bring about a return to normalcy. We must remind Lebanon and the Middle East about the agreements of Taif and look to put an end to Hezbollah."
 FRA_root_out_hezbollah: "Root Out Hezbollah"
 FRA_root_out_hezbollah_desc: "Hezbollah is a direct affront to Lebanon and the Taif Agreement and peace in the region. Rooting out Hezbollah is one of the first steps to helping establish peace in the Middle East."
 FRA_agriculture_works_in_the_levant: "Agriculture Works In The Levant"
 FRA_agriculture_works_in_the_levant_desc: "It will be worthwhile to pursue a variety of different agricultural investments across the Levant. Contrary to most foreign ideas over the region, the area is ripe for the potential. Many crops can be grown on the lush coasts of the Levant or in the river valleys of Syria. We should explore our investments in the region and help tap the agricultural power of the Levant."
 FRA_francafrique: "Françafrique"
 FRA_francafrique_desc: "Africa was once one of the pillars of our former colonial empire. The nations of the former Françafrique must continue to follow our lead into the new century. We should investigate the best way to help them and maintain our influence over the region."
 FRA_francophone_solidarity: "Francophone Solidarity"
 FRA_francophone_solidarity_desc: "This was an initiative that aimed to promote French-speaking culture and French values among Francophone nations. The initiative included greater access to education for lower-income nations and economic support for developing ones, with the hope that they would gain and build upon the foothold they had retained since post-decolonisation. In African nations specifically, France participated actively in supporting partnerships between African nations that maintained its influence and generated profitable gains."
 FRA_continue_cold_war_mentality: "Continue Cold War Mentality"
 FRA_continue_cold_war_mentality_desc: "Many among the public and the international community believe our status as a global power is fading. We must maintain our position as a leading global nation at any cost. Returning to old methods will not be popular internationally, but action must be taken. The criticism will fade in time."
 FRA_NEPAD_development: "NEPAD Development"
 FRA_NEPAD_development_desc: "The New Partnership for Africa's Development (NEPAD for short) is an economic development programme developed by the African Union with partners from the European Union, China, Japan and other G8 members. We are especially interested in the development of NEPAD and have taken a focal point of being the main backer of the development monetarily and politically from the European Union. We should look at helping extend the development and increasing the funding and support for the programme to help all of Africa."
 FRA_CFA_Reforms: "CFA Reforms"
 FRA_CFA_Reforms_desc: "Addressing the CFA is one of our biggest concerns. With influence draining over time, we are forced into the position of reform to keep a neocolonial empire alive. Some of our reforms are targeted towards increased autonomy within the banking system. Easier use of monetary funds and exchange controls."
 FRA_introduce_the_eco: "Introduce the ECO"
 FRA_introduce_the_eco_desc: "We must detach the CFA Franc from our hold and remove the dependency of our former colonies on us. The ECO is the proposed new currency that should allow the West African nations some degree of economic autonomy and cooperation amongst the new nations who've adopted it. We should look to support them in their endeavor to create a new common currency and potentially convince all of former French Africa to utilise this new currency."
 FRA_unrestricted_subjugation: "Unrestricted Subjugation"
 FRA_unrestricted_subjugation_desc: "Our actions have only been ones of exploitation & extraction. But now we should reconsider our position on this stance and whether we should rethink our diplomatic stance and enter a new phase of governance and control. The choice will not be a popular one but it is only made in the interests of a nation and its global status."
 FRA_intervention_in_africa: "Françafrique Interventionism"
 FRA_intervention_in_africa_desc: "Our former colonial holdings need assistance. It is now time for us to pursue a further policy of intervening in the region and providing military assistance where needed."
 FRA_sahel_region: "Sahel Region"
 FRA_sahel_region_desc: "The Sahel region is a prospect for mining and resource extraction, and a frontier for French geopolitical positioning and corporate interests. With the growing extremism of the new millennium, we must act to guarantee the safety of French assets and nationals in the region. Jihadist insurgency is spreading across the Sahel, threatening our interests there. We must take the initiative to protect our position and root out this threat at any cost required."
 FRA_afrique_centrale: "Afrique Centrale"
 FRA_afrique_centrale_desc: "The heart and soul of Africa, Afrique Centrale is covered in countless natural wonders and a vast wealth of resources and potential, much of it still untapped."
 FRA_CAR_intervention: "Opération Sangaris"
 FRA_CAR_intervention_desc: "Opération Sangaris was the moniker of the proposed operation and intervention in the Central African Republic Civil War."
 FRA_operation_artemis: "Opération Artemis"
 FRA_operation_artemis_desc: "With the Second Congo War in full swing, France and other European nations led an autonomous intervention in the eastern part of the country following the withdrawal of Ugandan forces. It marked a major turning point in European Union foreign affairs and military joint operations."
 FRA_resources_prospects: "Resources Prospects"
 FRA_resources_prospects_desc: "The naturally rich regions of Sub-Saharan Africa are full of resources, and French companies already benefit from many partnerships there. With growing demand for these resources, we must take the initiative and invest in our assets abroad to secure our foothold and hold it well."
 FRA_oef_hoa: "OEF - Horn of Africa"
 FRA_oef_hoa_desc: "The Somali Civil War has simply raged on long enough. We must intervene on behalf of the Somali government to help them reclaim their war-torn country and assist the Somali government in their efforts to stabilise their country."
 FRA_operation_licorne: "Opération Licorne"
 FRA_operation_licorne_desc: "Opération Licorne is the moniker of the French peacekeeping force that was deployed to Côte d'Ivoire in response to the civil war between Forces Nouvelles de Côte d'Ivoire and the Forces Armées de Cote d'Ivoire."
 FRA_the_second_ivory_coast_civil_war: "The Second Ivorian Civil War"
 FRA_the_second_ivory_coast_civil_war_desc: "The Second Ivorian Civil War was the second armed conflict stemming from the supporters of Laurent Gbagbo and the president-elect Alassane Ouattara. The conflict between the two escalated to a full-scale conflict. We should intervene to help stabilise the conflict before it gets out of hand."
 FRA_Industrial_expansion: "Industrial Expansion"
 FRA_Industrial_expansion_desc: "Our former colonial nations are in desperate need of economic revival. The primarily agrarian societies could use a small boon to their economies by injecting investment funds to the region."
 FRA_educational_development: "Educational Development"
 FRA_educational_development_desc: "Providing funds for education in our former colonial holdings will help their populace become more educated and in turn help their productivity."
 FRA_operation_serval: "Opération Serval"
 FRA_operation_serval_desc: "Opération Serval is the moniker used for the series of French and Malian-led interventions during the Malian Civil War as the first stage of conflict against Islamic Extremists in the region."
 FRA_French_pillar_of_counterterrorism: "Pillar Of Counterterrorism"
 FRA_French_pillar_of_counterterrorism_desc: "Our anti-terrorist and anti-extremist forces have become world-renowned and we have become a pillar and the face of counterterrorism across the globe."
 FRA_french_pillar_of_counterterrorism_tt: "Sending §YForeign Advisors§! to Nations for §YCounter Terror Purposes§! our advisors double the bonus provided to the §YAdvised Nation§!."
 FRA_the_french_foreign_legion: "The French Foreign Legion"
 FRA_the_french_foreign_legion_desc: "The French Foreign Legion is an elite corps of the French Army that consists of a variety of specialties. Having been formed in 1831 by then King Louis-Philippe it was intended to allow foreign recruits a place amongst French forces. As such the Legion is a multi-ethnic and multi-cultural fighting force that is world-renowned for the discipline and esprit de corps."
 FRA_sahel_support_initiative: "Sahel Support Initiative"
 FRA_sahel_support_initiative_desc: "The military forces of the Sahel are often underequipped. It is possible we could reorganise some resources their way either fiscally or militarily to help strengthen our position in Africa."
 FRA_sahel_officer_training: "Sahel Officer Training"
 FRA_sahel_officer_training_desc: "The armed forces of the nations of the Sahel could use some more training to help make them a more effective fighting force. We should look to invest in the militaries of our allies in the region and improve the standard of their officers."
 FRA_takuba_task_force: "Takuba Task Force"
 FRA_takuba_task_force_desc: "The Takuba Task Force was another series of joint operations between French, Malian, EU, and American forces to continue the conflict against Islamic extremists during the Malian Civil War. It is a strategic goal for us to begin our intervention once again in Mali to ensure stability in the region."
 FRA_haitian_coup: "The Haitian Coup"
 FRA_haitian_coup_desc: "Jean-Bertrand Aristide continues to be a thorn in the side of our country. The demand for reparations is reprehensible. It may be in our interest to look at finding Haiti new leadership of sorts."
 FRA_repeal_the_ordiance: "Repeal the Ordinance"
 FRA_repeal_the_ordiance_desc: "The 1825 Ordinance of Charles X should be repealed to help normalise Haitian-French relations. The 1825 Ordinance is the cause and the reason for the Haitian independence payments that were carried out for nearly three-quarters of a century. It is time we repeal this ancient piece of legislation as one of our first steps to reconciliation."
 FRA_senegalese_civil_war: "The Senegalese Civil War"
 FRA_senegalese_civil_war_desc: "The Senegalese Civil War has kicked off as a localised conflict with the recent elections. Senegal is important as a coastal nation for bringing material from the interior and north to France. Intervention in the region is a must to continue our ambitions in Africa."
 FRA_returning_to_indochina: "The Return to Indochina"
 FRA_returning_to_indochina_desc: "Indochina was once the pinnacle of the French far-east holdings until the Vietnamese independence wars. It is time to return to Indochina perhaps not as a coloniser but this time as a friend. Our interests in the region with the rise of China have marked it as an area of utmost importance."
 FRA_former_indian_colonial: "The Indian Ocean Affairs"
 FRA_former_indian_colonial_desc: "French holdings in the Indian Ocean and the French-speaking countries in the Indian Ocean are strategically important for thwarting and countering unwanted foreign influence. It is time to prepare ourselves to return to these strategically important regions and bring with us investments and other strategic improvements."

 # Events
 France_news.99.t1: "Return of the King"
 France_news.99.t2: "Return of the Emperor"
 France_news.99.d1: "The Royal House of Bourbon has returned to the royal residence in Versailles, once built by their ancestor Louis XIV, to once more take up the rulership of France.\n\nKing [FRA.GetLeader] has promised a new and grand age for France and the world. \"The rightful rulers of France and the protectors of Western Europe have returned to their rightful place.\" was the ending clause of his speech - which was immediately criticised as jingoistic and over-entitled by other European leaders and French republicans."
 France_news.99.d2: "The self-styled 'Imperial House' of Bonaparte, the descendants of the self-crowned Emperor Napoleon I Bonaparte (1769-1821), have returned to Versailles. While Napoleon (and his descendants) always had been popular in France, they were less so abroad - both with foreign nobles and foreign commoners.\n\nThe Recent jingoistic rhetoric by [FRA.GetLeader], who recently ascended as Emperor of the French, has been called into question by the leaders of Germany, Britain, Italy, and Russia. The new rulers of France have few friends.\n\nTogether with the new ruling system, France had unveiled a new flag: The same as the old, but flown with red by the hoist - a call back to the French Revolution, when a similar flag was flown shortly before the first Bonapartist Empire."
 France_news.99.o1: "Long live the King!"
 France_news.99.o2: "Long live the Emperor!"
 France_news.99.o3: "Oh well."

 France_news.100.t1: "Red Flags Over the Élysée"
 France_news.100.d1: "French state television went dark before dawn. When it returned, the studio was held by men in fatigues reading a communiqué from a body calling itself the Committee of Public Safety. Armour rings the Élysée and the Assemblée Nationale, and no minister of the Fifth Republic has been seen since midnight. Brussels has called an emergency session and Washington has ordered its embassy staff to shelter in place."
 France_news.100.t2: "Paris Falls to the Traditionalists"
 France_news.100.d2: "Gendarmerie units loyal to the traditionalist networks moved on the government quarter overnight and met no resistance from an army command that had plainly been told to stand aside. By morning the tricolour over the Élysée flew beside banners no French government has tolerated since 1944. The Republic's institutions are suspended pending what the plotters call a national restoration."
 France_news.100.a: "The Fifth Republic is finished."
 France_news.100.b: "Europe cannot let this stand."
 France_news.100.c: "France has buried another republic."

 France_news.101.t: "France Goes to the Polls"
 France_news.101.d: "Polling stations opened across France this morning for the first round of the presidential election. Turnout is forecast to be dismal: a left split four ways, a right divided between the Republicans and the sovereignists, and a National Front the commentariat has spent the whole campaign refusing to discuss. The second round is a fortnight away, and for once nobody in Paris will say who reaches it."
 France_news.101.a: "The runoff is ours to lose."
 France_news.101.b: "Paris bears watching."

 France_news.102.t1: "Revolutionary Cells Rounded Up"
 France_news.102.d1: "Coordinated raids by the DGSI and the GIGN broke the radical networks before first light. Cell leaders were taken from their flats in Saint-Denis and Villeurbanne, weapons caches were seized in three departments, and the party apparatus they had spent two years infiltrating has been purged. The government insists the Republic was never in danger. The arrest warrants say otherwise."
 France_news.102.t2: "Restorationist Plot Broken Up"
 France_news.102.d2: "Coordinated raids by the DGSI and the GIGN broke the traditionalist networks before first light. Action Française organisers were taken from their homes, arms caches were seized in three departments, and the officers who had promised the plotters the army's silence now face a military tribunal. The Fifth Republic has survived its closest call in forty years."
 France_news.102.a: "The Republic holds."
 France_news.102.b: "A relief, and a warning."

 ### Country Events
 france_md.20.t: "The state of the centrist party"
 france_md.20.d: "Originally a centre-right party, the UDF has established itself as a centrist party, and in the past we were able to govern under President Valérie Giscard d'Estaing. Since then, however, we have been relegated to the background, sometimes serving during cohabitations, but overshadowed by the Republican Right and the Socialist Party. But the world is changing, and the neo-liberal trend is gaining ground in the West. Today, we are not very big, but there is no doubt that one day we will govern."
 france_md.20.a: "Yes, I can't wait!"
 france_md.21.t: "The state of the Republican Right"
 france_md.21.d: "Our party is as old as the republic and has governed since 1995 under Jacques Chirac's mandate, but he no longer has the wind in his sails. After a failed dissolution that forced him to take on a socialist prime minister, we are witnessing the rise of our rivals, be they the Socialist Party or the National Front. Our country is, as ever, in financial difficulties and its interests are threatened everywhere abroad. One thing is certain: we are going to have to fight at home and abroad to assert France's power to those who might doubt it."
 france_md.21.a: "Let's get to work"
 france_md.22.t: "The state of the RPF"
 france_md.22.d: "Founded in 1999, the Rassemblement Pour la France (RPF) is a right-wing sovereignist party. Created by Charles Pasqua, it is strongly opposed to the European Union, against which it has worked hard. Our influence is minor for the moment, but the wheel is turning: the European Union is not making everyone happy, and we are welcoming more and more dissidents from other parties, disappointed people who can't find the will to implement Frexit elsewhere. We are of course the most Gaullist party in existence, and as this republic was founded by De Gaulle, we have no place in it other than Matignon!"
 france_md.22.a: "Long live General de Gaulle, long live France!"
 france_md.23.t: "The state of the National Front"
 france_md.23.d: "Founded in 1972 by Jean-Marie Le Pen, the Front National is a party of the extreme right. Since our creation we have not been considered a serious party, as the entire political landscape was against us for opposing immigration. The situation has changed since then, and other parties are beginning to realise their attitude has led to chaos in our country. We are the forerunners of what will become a general trend against immigration. But we're still dismissed as untouchables and labelled as extremists, so we must work to make our party acceptable to the assembly and electorate."
 france_md.23.a: "We'll get there!"
 france_md.24.t: "The state of the Socialist Party"
 france_md.24.d: "A historic rival of the Republican Right, our party is of canonical age. The Republican Right is now in difficulty, having been forced into cohabitation. We have a solid electoral base across most classes of the population, and our victory at the ballot box is inevitable. We advocate a more liberal approach than our forebears, to adapt to the Europe we are building. However, our party faces internal divisions: a right wing eager for the liberal centre and a left wing at risk of radicalising. There's no doubt we'll win, but once on top, we'll be walking on eggshells."
 france_md.24.a: "Everything shall be fine."
 france_md.25.t: "The state of the Unbowed France"
 france_md.25.d: "The Socialist Party failed to carry left-wing ideals to power, torn between its two tendencies. Our party, La France Insoumise, stands as the only true left-wing opposition to the neoliberal order. It was by seeking compromise indiscriminately that the Socialist Party buried itself, so we'll base our rhetoric on protest, even at the cost of media backlash. Our main project is to build a new republic, ending the presidential monarchy we've endured for far too long. Our party has been successful among young people, but we mustn't be content if we want to govern one day."
 france_md.25.a: "Another world is possible."
 france_md.26.t: "The state of the Greens"
 france_md.26.d: "The ecologist party in France has existed since 1984, but it hasn't had the success we'd hoped for. We are never taken seriously, and our electoral base is almost impossible to find outside urban centres. If we're going to make our mark, we'll have to work with other parties and adapt to their views. But given the state of the planet, our presence at Matignon will eventually prove logical. Once there, we will strive to transform how we live and produce, to secure a future for generations to come. The obstacles are many, but potential allies are not lacking."
 france_md.26.a: "We're running out of time."
 france_md.27.t: "The state of the French Communist Party"
 france_md.27.d: "The French Communist Party fell with the USSR, to which it was solidly attached. It's never easy to find yourself on the losing side. Our situation is more than critical: as we lose credibility, our working-class electoral base is drifting towards the far right or abstention. We need to reverse this trend and find new ways to win them over. We'll no doubt have to negotiate with other parties for a while, but perhaps once we're in charge we'll be able to regain the confidence of our former voters and regain our autonomy. Our party has a long history, and it can't stop now."
 france_md.27.a: "We'll be back."

 france_md.30.t: "The direction of the economy"
 france_md.30.d: "The time has come to choose our finance minister. Our country is in urgent need of reform, so we have found 2 profiles who should meet our expectations in terms of finance. The first comes from within our ranks, a man by the name of Olivier Ferrand, who throughout his career in the economy has familiarised himself with this field. The second, a former finance inspector, is brand new to politics and supported our campaign. His social-liberal vision of society looks like what we want to become, and perhaps his presence in our government will give us the approval of the liberal bloc."
 france_md.30.a: "Renewal in the movement! Appoint Emmanuel Macron to Bercy immediately!"
 france_md.30.b: "No, we'd be better off putting in someone we really trust. Appoint Olivier Ferrand."

 france_md.11.t: "CNES - NASA Cooperation"
 france_md.11.d: "CNES leaders have approached us to discuss extended cooperation between NASA and the CNES. They believe there is much to learn from space, and combining the resources of two large space programmes could benefit us both significantly. The proposed agreement states that each side would front $10 billion to pursue greater scientific ties."
 france_md.11.a: "A Worthy Agreement"
 france_md.11.b: "No"

 france_md.100.t: "The Armenia Support"
 france_md.100.d: "Armenia's struggle against Azerbaijan in Artsakh reminds us much of ourselves. Supporting them in their efforts is not only desired but also needed for our interests in the region. We can provide material, financial, or political support in their conflict. How should we help our friends in Yerevan?"
 france_md.100.a: "Support Armenia Politically"
 france_md.100.b: "Support Armenia Financially"
 france_md.100.c: "Support Armenia Militarily"
 france_md.101.t: "France Supports Us!"
 france_md.101.d: "France has decided to send us support in our ongoing struggle to establish ourselves. The conflicts with Azerbaijan as well as the Turkish issues continue to plague us, but we now have an ally in Europe."
 france_md.101.a: "Another move in the right direction"
 france_md.102.t: "The First Ivorian Civil War"
 france_md.102.d: "The First Ivorian Civil War has kicked off in earnest. The conflict is raging and shows no sign of simmering down. Once the crown jewel of Françafrique, the nation has turned into a killing field between the opposing sides. The stability in the region is held delicately in the balance as the nation tears itself apart. What side best aligns with our current interests?"
 france_md.102.a: "Back Laurent Gbagbo"
 france_md.102.b: "Back Guillaume Soro"
 france_md.102.c: "Back the Third Faction"
 france_md.103.t: "The Second Ivorian Civil War"
 france_md.103.d: "The Second Ivorian Civil War is in full swing between the FNC and the government of the [CDI.GetName]. The conflict began after the presidential election, in which Gbagbo refused to step down despite Ouattara's fair and free election win. Which side best aligns with our current interests?"
 france_md.103.a: "Back Laurent Gbagbo"
 france_md.103.b: "Back Alassane Ouattara"
 france_md.104.t: "Opération Artemis"
 france_md.104.d: "Opération Artemis, the European Union's proposed intervention in Ituri, would deploy peacekeeping forces to the Democratic Republic of the Congo. Many in our government want France to lead the European Union's military action. We have a choice among the participants as to which we wish to support. Rwanda and [RWA.GetLeader] could be a strong ally, though based in the east and not seeking control of the whole country. [UGA.GetLeader] and [RCD.GetName] are another choice but are mostly situated around the north. We can always support Kinshasa, the currently ruling government, which may be the safest choice. Who do we support?"
 france_md.104.a: "Support the Congo DR"
 france_md.104.b: "Support Uganda"
 france_md.104.c: "Support Rwanda"
 france_md.105.t: "Senegalese Civil War"
 france_md.105.d: "The expansion of the Senegalese Civil War into a much wider conflict came as a surprise to all involved. The combination of the Casamance issue as well as accusations of election tampering has destabilised yet another country in Africa. Our options vary considerably depending on our goals. We can support [SEN.GetLeader] and their government, the rebel factions or the people of Casamance. Whichever we choose will help Senegal pave a new future for itself in the region."
 france_md.105.a: "Support Senegal"
 france_md.105.b: "Support the Rebels"
 france_md.105.c: "Support Casamance"
 france_md.106.t: "Opération Sangaris"
 france_md.106.d: "The National Assembly and military of our country have proposed a new intervention in the Central African Republic in response to their new conflict. The proposed operation, known as Opération Sangaris, will commit our troops in support of one of the factions in the civil conflict. Who are we going to support in the conflict?"
 france_md.106.a: "Support the CAR"
 france_md.106.b: "Support the UFDR" # First CAR Bush War
 france_md.106.c: "Support Seleka"
 france_md.106.d1: "Support the Logone"
 france_md.106.e: "Support Anti-Balaka"
 france_md.107.t: "Opération Serval"
 france_md.107.d: "Opération Serval has been proposed to the National Assembly as a reaction to the Tuareg rebellion in the country of Mali. Serval is currently oriented towards French forces being deployed to support the government of [MAL.GetName] and [MAL.GetLeader]. We do have the option of changing our foreign policy and supporting the cause of the Tuaregs if we so choose. What side of the conflict should we intervene on behalf of?"
 france_md.107.a: "Support the Malian Government"
 france_md.107.b: "Support the Tuaregs"
 france_md.108.t: "Takuba Task Force"
 france_md.108.d: "Islamic insurgents have started to fight against both the [MAL.GetAdjective] Government and the Tuareg forces. Opération Serval has been underway for some time now, but we can incorporate additional support for the faction we had supported before or we can make a radical shift and support a new benefactor in Mali. What faction are we going to support in the future?"
 france_md.108.a: "Support the Malian Government"
 france_md.108.b: "Support the Tuaregs"
 france_md.108.c: "Support Ansar Dine"
 france_md.109.t: "The Haitian Coup"
 france_md.109.d: "The ruling body of the government of Haiti is not currently in our favour. The precedent that the ruling party is setting is not of benefit to our foreign policy. Instigating the coup and supporting the opposition is one of our best options for ensuring that the rest of the colonies do not begin to demand reparations against us for colonial infractions."
 france_md.109.a: "Instigate the Coup"
 france_md.109.b: "Support the Rebels"

#political tree

 france_md.150.t: "Additional aid from France"
 france_md.150.d: "The French government has offered to give us extra help in the financial crisis we've been going through since we joined the European Union. Should we accept it?"
 france_md.150.a: "Of course we need the money!"
 france_md.150.b: "No, we don't need it."
 france_md.151.t: "France proposes an international meeting"
 france_md.151.d: "The French Socialist Party has decided to organise a meeting of socialist leaders from around the world, and they've thought of inviting us. We could benefit from this to gain legitimacy. Should we go or politely decline?"
 france_md.151.a: "We'll be there!"
 france_md.151.b: "No, I've got better things to do."
 france_md.160.t: "Collapse of the Socialist Party"
 france_md.160.d: "After a year of instability and division within the Socialist Party, it has been reduced to almost nothing. This is a historic moment, but it's a shame to see the end of a party that has played such a pivotal role in France's history. For whoever inherits the post of first secretary, the task will be a heavy one."
 france_md.160.a: "Mistakes were made"
 france_md.161.t: "The tear continues"
 france_md.161.d: "A large proportion of our members and supporters are in the process of dissociating themselves from our group. It's clear that if we want to avoid falling, we're going to have to use all the levers at our disposal to keep the support of politicians and the public."
 france_md.161.a: "Not a minute to lose!"
 france_md.162.t: "Our party is under threat"
 france_md.162.d: "The many unpopular reforms we have carried out, despite the general disapproval, have earned us the wrath of the population, who are wondering whether they did the right thing by voting for us. What's more, our numerous alliances with the liberal centre, which we have tried to emulate, have caused many rifts within our party. Our left wing, disappointed with our choices, is threatening to go into the arms of the radical left, while our right wing finds us too soft compared to the liberals candidates, whom we have sometimes helped despite ourselves. If there's still a chance, we'll have to work hard to get it."
 france_md.162.a: "Ah, damn it."
 france_md.163.t: "Who Is to Blame?"
 france_md.163.d: "Following our collapse, some of our voters have shifted toward the centrists, others toward more leftist formations that champion their 'radicalism' by calling themselves the 'rupture' left, a stance that draws heavy media criticism and unites opposition against them. Whichever wing we choose to confront now will decide whether our former voters ever return to us."
 france_md.163.a: "Extremists of any stripe endanger our society"
 france_md.163.b: "That's nothing compared to the danger the extreme centre represents"
 france_md.164.t: "France Proposes Joint Military Exercises"
 france_md.164.d: "French diplomats have sent us a proposal for joint military training. Indeed, the recent rise in international tensions encourages us to unite among European states to prepare for the worst. This could be a very good initiative to train our armed forces for the high-intensity conflicts that could erupt at any moment. What should we tell them?"
 france_md.164.a: "With pleasure, we will train alongside them"
 france_md.164.b: "No thank you, we don't need their help"
 france_md.165.t: "The Storm Arrives"
 france_md.165.d: "Several experts on different subjects have suggested to us for some time that we establish regulatory measures in case an economic crisis should occur anywhere on Earth. It would not be the first nor the last, but these measures would allow us to maintain our distance from the complications that accompany such crises. Nevertheless, this would mean regulating the economic sector and paying many experts to oversee operations. Do we really want to do this? Our financial partners might take it badly."
 france_md.165.a: "The situation is indeed very concerning; we must establish regulatory measures urgently"
 france_md.165.b: "These are just suppositions that seem bad for business"
 france_md.170.t: "France offers war reparations"
 france_md.170.d: "The French government has decided to compensate us for the deadly Indochina war that took place on our soil for 7 years. This money will never replace the lives of the 500,000 Vietnamese who died for independence, but it is an honourable gesture that should not be refused."
 france_md.170.a: "Now we wait for the Americans"
 france_md.171.t: "France offers war reparations"
 france_md.171.d: "The French government seems at last to have agreed to recognise some of the crimes committed in our country, and is offering compensation for the war of independence. This money will not replace the lives of the 600,000 Algerians who died for freedom, but for once a Westerner acknowledges his crimes, it would be foolish to refuse him."
 france_md.171.a: "At the right time."
 france_md.172.t: "France Proposes Its Nuclear Expertise"
 france_md.172.d: "The French Presidency has proposed to share its nuclear expertise with us for a modest sum of money. This could prove quite useful to master this unstable atom and make the best use of it. If we accept, this could greatly help us illuminate our people and facilitate research in this field. Nevertheless, perhaps we could use this money for something other than giving France a place it does not deserve in our country."
 france_md.172.a: "A deal in Uranium 235"
 france_md.172.b: "No, you can keep your time bombs to yourselves"
 france_md.173.t: "France Proposes Its Protection"
 france_md.173.d: "Faced with the world erupting in multiple crises, France has decided to guarantee the protection of its European allies. Indeed, the French Presidency assured us this morning that in case of aggression by a foreign European power, it would not hesitate to intervene, even invoking the use of nuclear weapons. Although this protection is a loss of sovereignty in itself, it could prove crucial in times like these."
 france_md.173.a: "One can never be too careful"
 france_md.173.b: "We don't need their protection"
 france_md.175.t: "The European Union Imposes Sanctions on Us"
 france_md.175.d: "Following our recent positions and our desire to withdraw from the treaties binding us with member states, a fine has been imposed on us by these cursed European bureaucrats. Nevertheless, nothing forces us to pay it; our voters, who crave change, would even see it as a sign of weakness or betrayal. However, refusing to pay could harm our relations with European member states and trigger sanctions against us. Should we go all the way?"
 france_md.175.a: "We will pay the fine because we play by the rules; it is by following the rules that we will prevail"
 france_md.175.b: "And what else? We've already been bled dry enough"
 france_md.180.t: "A Historic Vote"
 france_md.180.d: "The people have spoken. Following long campaigns for Frexit and after evading the traps of these accursed Europeanists, as well as those of these vile populists who tried to claim our successes, we have done it. France is leaving Europe as quickly as possible. Obviously, these Brussels snakes will not fail to make us pay as much as they can, but these sanctions are nothing compared to the freedom we have regained."
 france_md.180.a: "Now and forever, France is free"
 france_md.181.t: "France Leaves the European Union"
 france_md.181.d: "Following numerous campaigns of Eurosceptic disinformation, the French nationalist movement has finally managed to swing France toward Frexit. France's departure is only a matter of time; it is nevertheless quite serious to see such a founding and structuring member of the EU leave so quickly."
 france_md.181.a: "We must be cautious in the face of populism"
 france_md.182.t: "France Recognises Our Claims"
 france_md.182.d: "The French government recently announced that it supports our position on the various historically ours territories that were taken from us. They have also proposed the beginning of military cooperation between our two nations; for now it is only facilities to access our military infrastructure. This sudden French support is welcome, but should we really allow them to benefit from our infrastructure?"
 france_md.182.a: "Of course, they support us; they are welcome"
 france_md.182.b: "We never asked for their help; let them keep their distance"
 france_md.183.t: "France Proposes to Deepen Our Cooperation"
 france_md.183.d: "After taking numerous positions in our favour and announcing a clear rejection of NATO, Paris has proposed we deepen our cooperation, from economic ties to a full military alliance against our common enemies. Can we really trust Westerners who have so quickly abandoned their previous allies?"
 france_md.183.a: "I'll take three crates of that perfume; it's a deal"
 france_md.183.b: "Would you prefer the Sahel dunes or our frozen steppes for training? Our armies will emerge only stronger"
 france_md.183.c: "They can stay alone"
 france_md.184.t: "Moscow Accepts Economic Cooperation"
 france_md.184.d: "Moscow's answer was not long in coming; our economies could both benefit from this agreement. In addition to opening us a considerable market for our luxury and high-tech products, our industries in need of raw materials will feel more secure. This historic agreement is a windfall for us and a nail in the coffin of the European Union. We who created it now trade with its worst enemy."
 france_md.184.a: "Let the champagne and oil flow"
 france_md.185.t: "Moscow Accepts Economic and Military Cooperation"
 france_md.185.d: "Moscow's answer was not long in coming; our economies and armies could both benefit from this agreement. In addition to opening us a considerable market for our luxury and high-tech products, our industries in need of raw materials will feel more secure. Moreover, strengthened cooperation between our armed forces will allow us to gain experience in new theatres and benefit from their technological and strategic advances. This historic agreement is a windfall for us and a nail in the coffin of NATO. We now have a trustworthy partner to navigate this new millennium."
 france_md.185.a: "We will meet again in the Sahel, but this time not to fight each other"
 france_md.187.t: "The Russians Break Off Negotiations"
 france_md.187.d: "Despite all the efforts deployed by our diplomats, they have not managed to reach an agreement with their Russian counterparts. As if there were no will to do business with us. This is regrettable; the potential of a bilateral agreement would have been invaluable to our two countries. It is also not impossible that pressure was exerted by our former Western friends to ensure we remain under their thumb. But it is not grave; we will find other partners."
 france_md.187.a: "The American cancer has thus reached the Urals; better alone than in bad company"
 france_md.188.t: "France Demands Concessions"
 france_md.188.d: "Following the victory of populism in France and its exit from the European Union, it has continued to prove its hostility toward us. The economic sanctions imposed on it following its exit have not left it unscathed; now it has finished recovering and demands reparation. Today, diplomats have arrived threatening to cut off access to its national territory if we do not influence the European Bank to lower the interest rates on their debt. The consequences of this loss of access to their territory could greatly complicate exchanges within the European Union. Nevertheless, giving in to their blackmail would force us to use our advantages for ill."
 france_md.188.a: "Cursed be them; we will take the least harm"
 france_md.188.b: "We will not give in to the blackmail of a few populists"
 france_md.189.t: "Germany Yields to Our Concessions"
 france_md.189.d: "Following the pressure we have exerted on them, the German government has reluctantly agreed to pressure the ECB to reduce our interest rates. This is a formidable revenge on our former tormentors. These Germans can continue to enjoy our roundabouts, but thanks to them we eat at Brussels' expense."
 france_md.189.a: "An eye for an eye, a tooth for a tooth, in Latin if possible"
 france_md.190.t: "Germany Refuses Our Demands"
 france_md.190.d: "Our diplomats returned empty-handed from Berlin, snubbed by our German cousins. Perhaps our demands were too high or they intend to look elsewhere than with us. We won't have our revenge against the European Union today, but it cannot wait."
 france_md.190.a: "We remain free and they don't; close the borders to the east"
 france_md.191.t: "France Demands Concessions"
 france_md.191.d: "Following the victory of populism in France and its exit from the European Union, it has continued to prove its hostility toward us. The economic sanctions imposed on it following its exit have not left it unscathed; now it has finished recovering and demands reparation. Today, diplomats have arrived threatening to cut off access to its national territory if we do not replace their maritime and coastal police in migration detention operations. The consequences of this loss of access to their territory could greatly complicate exchanges within the European Union. Nevertheless, giving in to their blackmail would force us to use our advantages for ill."
 france_md.191.a: "Cursed be them; we will take the least harm"
 france_md.191.b: "We will not give in to the blackmail of a few populists"
 france_md.192.t: "Italy Yields to Our Concessions"
 france_md.192.d: "Following the pressure we have exerted on them, the Italian government has reluctantly agreed to replace our police on our maritime borders. This is a formidable revenge on our former tormentors. These Italians will be delighted to enjoy the flow of migrants, but thanks to them we eat at Brussels' expense."
 france_md.192.a: "An eye for an eye, a tooth for a tooth, in Latin if possible"
 france_md.193.t: "Italy Refuses Our Demands"
 france_md.193.d: "Our diplomats returned empty-handed from Rome, snubbed by our Latin neighbours. Perhaps our demands were too high or they intend to look elsewhere than with us. We won't have our revenge against the European Union today, but it cannot wait."
 france_md.193.a: "We remain free and they don't; close the borders to the southeast"
 france_md.194.t: "France Demands Concessions"
 france_md.194.d: "Following the victory of populism in France and its exit from the European Union, it has continued to prove its hostility toward us. The economic sanctions imposed on it following its exit have not left it unscathed; now it has finished recovering and demands reparation. Today, diplomats have arrived threatening to cut off access to its national territory if we do not use the institutions we host for their purposes. They ask us to influence the decisions of European institutions and their spy services. The consequences of this loss of access to their territory could greatly complicate exchanges within the European Union. Nevertheless, giving in to their blackmail would force us to use our advantages for ill."
 france_md.194.a: "Cursed be them; we will take the least harm"
 france_md.194.b: "We will not give in to the blackmail of a few populists"
 france_md.195.t: "Belgium Yields to Our Concessions"
 france_md.195.d: "Following the pressure we have exerted on them, the Belgian government has agreed to pressure European institutions in our favour. This is a formidable revenge on our former tormentors. These Belgians will be delighted to work overtime in parliament, and thanks to them we eat at Brussels' expense."
 france_md.195.a: "An eye for an eye, a tooth for a tooth, in Latin if possible"
 france_md.196.t: "Belgium Refuses Our Demands"
 france_md.196.d: "Our diplomats returned empty-handed from Brussels, snubbed by our Walloon and Flemish brothers. Perhaps our demands were too high or they intend to look elsewhere than with us. We won't have our revenge against the European Union today, but it cannot wait."
 france_md.196.a: "We remain free and they don't; close the borders to the north"
 france_md.197.t: "France Demands Concessions"
 france_md.197.d: "Following its exit from the European Union and recovery from the resulting sanctions, France continues to prove its hostility toward us. Today its diplomats arrived threatening to cut off access to French territory unless we hand over a detailed registry of bank accounts held in our territory, a grave breach of the banking secrecy we strive to preserve. Losing that access would complicate our trade across the Union, but giving in makes us complicit in their blackmail."
 france_md.197.a: "Cursed be them; we will take the least harm"
 france_md.197.b: "We will not give in to the blackmail of a few populists"
 france_md.198.t: "Luxembourg Yields to Our Concessions"
 france_md.198.d: "Following the pressure we have exerted on them, the Luxembourg government has agreed to pressure its banking services to provide us with a detailed registry of accounts they hold. We found many traitors seeking to escape their duty, but also information on many private companies residing in our national territory. These discoveries will help the tax authority's efforts to pursue bad patriots and make companies that tried to cheat us in our country pay. The Luxembourgers may have greatly lost credibility in banking, but thanks to them we eat at Brussels' expense and at the cost of their cursed free trade."
 france_md.198.a: "An eye for an eye, a tooth for a tooth, in Latin if possible"
 france_md.199.t: "Luxembourg Refuses Our Demands"
 france_md.199.d: "Our diplomats returned empty-handed from Luxembourg, snubbed by our millionaire neighbours. Perhaps our demands were too high or they intend to look elsewhere than with us. We won't have our revenge against the European Union today, but it cannot wait."
 france_md.199.a: "We remain free and they don't; close the borders to the northeast"
 france_md.200.t: "France Demands Concessions"
 france_md.200.d: "Following its exit from the European Union and recovery from the resulting sanctions, France continues to prove its hostility toward us. Today its diplomats arrived threatening to cut off access to French territory unless we come to the aid of their agricultural sector, which is developing a citrus project in the south that competes directly with our own. Losing that access would complicate our trade across the Union, but giving in makes us complicit in their blackmail."
 france_md.200.a: "Cursed be them; we will take the least harm"
 france_md.200.b: "We will not give in to the blackmail of a few populists"
 france_md.201.t: "Spain Yields to Our Concessions"
 france_md.201.d: "Following the pressure we have exerted on them, the Spanish government has agreed to provide us with technical and commercial assistance for the production and sale of our new citrus line that will flood French and Spanish markets. Perhaps the Spanish have only their fingers to bite now, but thanks to them we eat at Brussels' expense and have shown our food hegemony over the continent."
 france_md.201.a: "An eye for an eye, a tooth for a tooth, in Latin if possible"
 france_md.202.t: "Spain Refuses Our Demands"
 france_md.202.d: "Our diplomats returned empty-handed from Madrid, snubbed by our Iberian neighbours. Perhaps our demands were too high or they intend to look elsewhere than with us. We won't have our revenge against the European Union today, but it cannot wait."
 france_md.202.a: "We remain free and they don't; close the borders to the southwest"
 france_md.203.t: "The End of the Journey"
 france_md.203.d: "After months of dialogue and struggle over its substance, the constitutional reform text is finally ready to be voted on. Our political opponents may have used the drafting process to slip in clauses serving their own ideals, but denying the people a vote after so long a process would leave them feeling rightfully betrayed. Convening the referendum is our call alone, under article 11 of the constitution, and we alone will answer for the consequences."
 france_md.203.a: "It is time to end this; I call for a referendum"
 france_md.203.b: "This text is too dangerous and must not be voted on"
 france_md.204.t: "The Text Passes"
 france_md.204.d: "Today is a historic day; for the first time the entire people participates in the elaboration of its constitution. The result of the vote is unsurprising, an overwhelming victory of yes; of course, when you give a French person the right to decide his own rights, he won't deprive himself. This text is perhaps not perfect, but it reflects a new era beginning today, and we have done our best to ensure it defends the rights of our citizens while preventing the people from succumbing to the siren songs of our political adversaries. Here ends the Fifth Republic and with this frank and massive Yes begins the Sixth Republic."
 france_md.204.a: "The day of glory has arrived"
 france_md.205.t: "The Text Is Largely Rejected"
 france_md.205.d: "Against all expectations, the constitutional reform we planned for months has been rejected at the ballot box. Perhaps our involvement in steering the debates left people thinking we were trying to manipulate them, or perhaps our citizens wanted change but never agreed on what shape it should take. All is not lost: we can still pursue our vision for the republic one law at a time, but the sweeping reform we hoped for will have to wait."
 france_md.205.a: "Completely incomprehensible"
 france_md.206.t: "Debate on Institutions, Part 1"
 france_md.206.d: "The question of institutions has divided France since the Fifth Republic's founding in 1958, when presidential power replaced the instability of the Fourth Republic. That power is now seen as excessive, letting an ill-intentioned president block progress with few checks, while the more representative National Assembly holds little exclusive authority of its own. Renovating this outdated constitution is now on the table, and how far we go will define whether power tilts back toward parliament or stays with the presidency."
 france_md.206.a: "It's quite practical not to be constantly under threat from the assembly"
 france_md.206.b: "Down with the presidential republic, the President will inaugurate the chrysanthemums"
 france_md.206.c: "Let's just focus on promoting active citizen participation"
 france_md.207.t: "The Triumph of Compromise"
 france_md.207.d: "After days of deliberation, citizens seem to have reached agreement around a rebalancing of powers. The 49.3 article was naturally the first target of popular anger. Presidential powers came off lightly and the people appear satisfied with their work. A democratic coup now seems less likely; our institutions gain in legitimacy and effectiveness. We can only regret the slight disappointment of our most devoted supporters to whom we had promised the end of presidential monarchy. Whatever we think, the people have decided; we can now turn our attention to the following debates."
 france_md.207.a: "Very well, next question! My office came through this quite well."
 france_md.208.t: "The End of Presidential Dictatorship"
 france_md.208.d: "Citizens have finally reached agreement: the Fifth Republic accumulated too much resentment from abusive presidential decisions, and we can no longer risk so much power resting on one man's whim. The president's powers are now limited to that of commander-in-chief and a ceremonial figure at the Elysee Palace, while the National Assembly becomes all-powerful once more. Reforms may lose some stability, but they will proceed far more easily, and French confidence in our institutions should grow for it."
 france_md.208.a: "So be it; let the debates continue."
 france_md.209.t: "Debates on Institutions Part 2:"
 france_md.209.d: "As the institutional debate closes, one question divides our citizens: oversight of the secret services that answer to the president. These services have long defended French interests, but past excesses, including the Auriol murders of 1981, and their freedom to act outside the law have raised concerns about transparency. Greater openness would build trust in our institutions, but our security in an increasingly unstable world cannot be taken lightly."
 france_md.209.a: "The security of our citizens above all! We'll just ensure their privacy isn't endangered too much."
 france_md.209.b: "The people need transparency! The people need justice; the state must answer to its citizens."
 france_md.209.c: "This debate stirs too much tension; we would do better to keep our distance."
 france_md.210.t: "The Secret Services Emerge Intact"
 france_md.210.d: "Citizens have decided to keep the secret services under executive control. Indeed, especially in these times, our passive defence must be in the front line to protect us from malicious actions from abroad and from terrorism. This result has nonetheless disappointed our activists who wanted more transparency and democracy. Many of our citizens persist in thinking that our country's defence should not come at the cost of their privacy in peacetime. Some also fear the misuse of these services by ill-intentioned governments to spy on their opposition or prevent leaks to the opposition. The voters have decided, and they chose security over freedom. It is their choice, after all."
 france_md.210.a: "This is simply not the right time to lower our guard in a world where might has taken precedence over international law."
 france_md.211.t: "The Curtain Is Raised"
 france_md.211.d: "After arduous negotiations, we have finally decided to end the total opacity of our secret services. Many citizens no longer felt secure knowing they were under constant surveillance without their knowledge, and our foreign interventions often spark controversies they would prefer not to learn of from the newspaper. This new transparency should give our citizens greater confidence in their police and armed forces, even if it costs us some internal security and external influence."
 france_md.211.a: "We do not need secret services to protect us from foreign interference."
 france_md.212.t: "Debate on Personal Rights Part 1:"
 france_md.212.d: "The question of personal rights lies at the heart of constitutional debate. Should we strengthen individual freedoms against the state or prioritise collective security? Discussions centre on the protection of personal data, the right to privacy, and the limits of state surveillance. Progressives advocate for an expansion of fundamental rights, while conservatives fear a weakening of public authority. Our position on this matter will partly determine the direction of the new constitution."
 france_md.212.a: "Firmly defend individual freedoms."
 france_md.212.b: "Collective security must take priority."
 france_md.212.c: "Let the debate continue without us."
 france_md.213.t: "Victory for Individual Freedoms"
 france_md.213.d: "The debate concluded in favour of strengthening individual freedoms. The new constitution will guarantee increased protections against state intrusion into citizens' private lives. This victory for progressives marks a turning point in our relationship with public authority, even if some worry about the consequences for national security."
 france_md.213.a: "Our citizens can rejoice in these new guarantees."
 france_md.214.t: "Security Prevails"
 france_md.214.d: "Despite the efforts of freedom advocates, the security-focused vision won the day in constitutional debates. The state will retain broad surveillance and intervention powers. While this reassures part of the population, civil rights activists denounce a democratic setback."
 france_md.214.a: "Stability comes at a price."
 france_md.215.t: "Debate on Personal Rights Part 2:"
 france_md.215.d: "Our nation is known for its unrest, and however an election turns out, discontent eventually reaches the streets. The question of protecting citizens during protests is now on the agenda: police overreach on one side, insufficient protection on the other, with many protests ending in injury. Restraining the police would rebuild public trust but add costs, while backing them keeps order but risks further incidents as movements radicalise."
 france_md.215.a: "We must regulate our police forces."
 france_md.215.b: "Let them do their job."
 france_md.215.c: "The people will decide; after all, they will be in the streets protesting this law."
 france_md.216.t: "The People Choose to Restrict the Police"
 france_md.216.d: "After hours of debate, the majority agreed that police forces needed to be regulated to prevent new scandals. Law-and-order technologies are improving, and we are already a highly effective nation in this regard; there's no need to go further. Moreover, avoiding serious physical injuries among protesters will surely reduce healthcare spending. The state also has more to answer for to its people, since they will be able to protest in the streets less dangerously. However, additional costs for police should be expected as the effectiveness of law enforcement will be diminished."
 france_md.216.a: "So our people will continue to keep us in line. Next question!"
 france_md.217.t: "The People Choose Order"
 france_md.217.d: "Even if not what we would have preferred, police effectiveness won the day. It is true that some protests degenerate and cause extensive property damage, so external oversight is necessary given the reduced effectiveness of law-enforcement services. We face budget and social crises without precedent; at some point, we will need to turn some of the people against us. It therefore remains important to be capable of standing up to any social movement that comes. After all, they elected us, did they not?"
 france_md.217.a: "The people chose security over the right to hold us accountable; can we blame them? Next question."
 france_md.218.t: "Debate on the Economy, Part 1"
 france_md.218.d: "Although managing the economy will fall to future governments, we can enshrine social, ecological, or economic fundamentals in the constitution now, making laws that violate them unconstitutional. Prioritising social protections secures jobs and welfare but may leave ecology behind and unsettle investors with the resulting debt. Prioritising ecology improves quality of life and shifts us toward new energy sources, but leaves some revenues and investments behind. We could also feign support for the economy to sow discord with other factions, or leave the question to them entirely."
 france_md.218.a: "Social support first! We must stand by our citizens."
 france_md.218.b: "The planet is degrading too quickly for us to sit idle."
 france_md.218.c: "Good idea; we'll make them think the liberals are behind this."
 france_md.218.e: "Let the other parties tear each other apart over this question."
 france_md.219.t: "The People Choose to Prioritise Social Support"
 france_md.219.d: "After long hours spent hesitating, citizens finally agreed on the social pillar of the republic. Indeed, by protecting ordinary people and their jobs, we will ensure a healthy transition to a better future. Moreover, it is better that our factories are built to standards and pollute here rather than being relocated to countries less concerned about this. This result is neither a surprise nor bad news."
 france_md.219.a: "Another question to which we could provide an answer; well done."
 france_md.220.t: "The People Choose Ecology"
 france_md.220.d: "This result does not displease us. Indeed, the health of the planet flows back onto the health of its inhabitants. It is therefore not surprising and even beneficial that this awakening occurred at multiple levels in society. Thus we will have to learn to transform our ways of living and producing goods and energy. The path will be strewn with obstacles and will not always serve the interests of the majority. But this is the path we must follow."
 france_md.220.a: "All that's left is to recycle those who voted for big business."
 france_md.221.t: "The People Choose Economics"
 france_md.221.d: "A surprising result, that of the outcome of today's debates. Thus the people chose to protect businesses of all kinds to drive this country's development. One can see that some still believe in trickle-down theory. One might also have guessed that with media often in the hands of a few oligarchs, they would do everything possible to tip the scales. A rather disappointing day for our activists. But we cannot now question the opinion of the sovereign people."
 france_md.221.a: "Was asking the people's opinion really such a good idea?"

 france_md.222.t: "Debate on the Economy, Part 2"
 france_md.222.desc: "Other social questions will wait for future republics, but we can set the constitutional direction now: who should pay for our exceptional but costly social coverage? Whatever this reform decides now, on taxation, budget funding, or spending cuts, will shape the financial backbone of our welfare state for generations."
 france_md.222.a: "Down with capitalism!"
 france_md.222.b: "The state will finance the system; we'll do our best to avoid new taxes."
 france_md.222.c: "We cannot risk putting our citizens out of work."
 france_md.222.d: "We would be better off not getting involved in this debate."
 france_md.223.t: "The People Choose to Tax Capital"
 france_md.223.d: "The long debates of recent weeks have ended with us victorious in this ideological confrontation. It will be capital and the income of the wealthiest who will finance the population's social coverage. This symbolic act marks a great victory of the people against big capital. A victory of France over finance is a victory of all the people united against their former masters. Our debates on economics are finished for now, but we have prepared the ground for generations to come. Thus in just a few reforms, we have made the revolution."
 france_md.223.a: "A great victory for the French people."
 france_md.224.t: "The People Confirm the State's Role"
 france_md.224.d: "The outcome of last week's debates is clear: the people do not want to overturn the economy as it stands. Is this due to the neoliberal propaganda they are bombarded with every day on television? Probably, but we must accept their verdict because it is the only one that matters. At least we managed not to encourage cuts to other state services to finance this one, but it is possible that our successors will be less benevolent toward society to finance our system. We will make sure that does not happen."
 france_md.224.a: "It's not really the victory we hoped for, but we'll have to make do."
 france_md.225.t: "The People Choose to Cut Elsewhere"
 france_md.225.d: "If we had known the verdict would be this, perhaps we would not have brought this debate to the ballot, but it is too late to think about that. Indeed, the people have just decided the fate of our social system. They recommended that future legislatures preserve essential state services but cut other state spending. Their primary target will probably be civil service employees and many subsidies they do not deem essential. The social protection system will be financed, but we have just justified the wolf of liberalism entering the state's accounts. As long as we are in power, we will be able to prevent it, but who knows what future governments will do."
 france_md.225.a: "This constitutional reform is not going exactly as planned."

 france_md.226.t: "Debate on Societal Issues Part 1:"
 france_md.226.d: "France's system for integrating minorities has long rested on the 'melting pot' ideal of republican schooling and meritocracy, but that principle is showing its limits: declining social mobility feeds unemployment and communitarian drift. Debate now turns on reforming this system. Pushing for a more inclusive model risks unsettling a framework that has prevailed for generations, but leaving it untouched only hands our opponents the chance to harden it instead. Either way, our choice here will shape the country for generations to come."
 france_md.226.a: "In order to allow as many people as possible to have a better life, the system must be more inclusive."
 france_md.226.b: "Let the citizens decide this question themselves."
 france_md.227.t: "The People Choose to Adapt the System"
 france_md.227.d: "The outcome of the debates seems to have moved toward an adaptation of the current system to the diversity inherent to our new millennium. We will certainly need to invest resources, but our system by allowing this inclusion will not be deprived of the new talents flowing toward our country. By giving everyone a future within reach, we have helped pacification while favouring our long-term development."
 france_md.227.a: "We have so much to learn from others."
 france_md.228.t: "The People Choose to Harden the Current System"
 france_md.228.d: "Despite our efforts, it seems that current society is not ready to question the fundamentals of our republic. The French system of integration seems to still have a bright future ahead of it. This vote confirms the attachment of the French to a system that, despite its dysfunctions, has the merit of being in place. This system can always be reformed in the long term, but we missed the opportunity to bring down another fortress."
 france_md.228.a: "A pity"

 france_md.229.t: "Debate on Societal Issues Part 2:"
 france_md.229.d: "Freedom of worship is one of the hottest questions of our millennium. Since the secularism laws of the Third Republic, France has protected it fiercely, even at the cost of citizens' own freedoms, above all through the ban on religious symbols in public primary schools, a rule increasingly at the centre of a tense national debate. Loosening this legal framework could pacify relations between communities, but it means questioning a foundational law our citizens hold dear."
 france_md.229.a: "Our society must adapt to the recognition needs of religious communities."
 france_md.229.b: "Let the citizens decide this question themselves."
 france_md.230.t: "The People Choose to Relax Secularism"
 france_md.230.d: "The debates on secularism have ended in favour of loosening the current legal framework. The wearing of religious symbols will eventually be normalised in more places than before. The various faiths will also have the right to greater representation in society while maintaining the primacy of the state and its separation from religion. This is a victory because we managed to keep the best of our old system while ensuring that the most controversial parts are relaxed. We can only hope that this breach in this foundational law does not lead to a progressive questioning of this protective framework for freedom of worship. We can trust our successors on this point."
 france_md.230.a: "This should go well."
 france_md.231.t: "The People Choose to Harden the Secularism Law"
 france_md.231.d: "We did not expect that opening a debate on secularism would produce a stricter system than the one we had. It was a risk worth taking, and we took it. Religious symbols will now be tolerated even less in public institutions. Did our ancestors foresee that we would push this far in that direction? We are here now, and we will see where these changes lead us. What is certain is that our ideal of tolerance looks further away than ever."
 france_md.231.a: "At least freedom of conscience remains guaranteed."
 france_md.235.t: "Building the Republic of Tomorrow"
 france_md.235.d: "Now that our mandate is underway, it is time to launch our most awaited promise: the Sixth Republic. This new republic, one we want debated rather than imposed, will occupy our citizens for months as they lay the foundations of tomorrow's society. We may need to steer the debate at times to keep it from drifting, but appearing too involved risks losing the people's trust. This project must be carried through to the end, and quickly enough that it never looks like we are delaying democracy itself."
 france_md.235.a: "The Fifth Republic lives its final moments"
 france_md.236.t: "The Sixth Republic Fails"
 france_md.236.d: "For several weeks now, the debate spaces have sat empty and the Sixth Republic project is stalling, not from war or crisis but from plain disinterest. By taking too long to organise the debates and act on our citizens' contributions, we let the popular enthusiasm we galvanised die out. Our chance to change the system is now slipping away. We can still push some of this work through as ordinary reforms, but without the scope we hoped for, and we have failed to remedy the injustices built into our constitution, the highest law of the land."
 france_md.236.a: "We missed an opportunity to change the system"
 france_md.238.t: "France Places Us Under Embargo"
 france_md.238.d: "France has announced a total embargo against us, covering everything from material deliveries to ordinary trade. Since the election of La France Insoumise, Paris has hardened its rhetoric toward us over the Palestinian issue, accusing our government of fuelling conflict in the region, and has now moved to embargo us outright. Worse, they are lobbying the rest of Europe to follow suit. Our European trading partners are essential, and we cannot afford to let this campaign succeed."
 france_md.238.a: "They won't convince many people"
 france_md.239.t: "France Asks Us to Place the State of Israel Under Embargo"
 france_md.239.d: "Following France's decision to place the state of Israel under embargo, French diplomats have contacted us to urge us to do the same. They cite as justification the aggressive policy of the state of Israel toward its neighbours, the destabilisation of the region that results, and the humanitarian situation there. These arguments are not without merit, and a significant part of our electorate supports them. However, such actions risk costing us dearly internationally, and besides we have no geopolitical interest in turning away from our Israeli ally. What should we decide?"
 france_md.239.a: "Naturally, the state of Israel must curb its expansionist policy"
 france_md.239.b: "We will not abandon our Israeli partners"

 france_md.240.t: "France Proposes to Help Stabilise Our Nation"
 france_md.240.d: "After a century of colonisation and decades of neocolonialism, it appears that France's policy in Africa has changed course. They propose to help stabilise our country while ensuring they reduce their control over it. This news seems to be a blessing, and our country needs this aid more than ever. Nevertheless, it is likely that this aid comes with necessary promises of peace going hand in hand with a relaxation within the population. Our former coloniser seems to have now reflected on the consequences of its actions. Should we do the same?"
 france_md.240.a: "Aid is always welcome"
 france_md.240.b: "We don't need them; they are nothing here anymore"

 france_md.244.t: "France Pushes for Social Legislation"
 france_md.244.d: "Following the victory of La France Insoumise in France, many voices are heard in our country calling for the adoption of similar laws to those adopted in France. The success of a left-wing rupture in France seems to spill over onto us and other countries of the European Union. Everywhere in our countries, movements are organising to demand the same legislative innovations as our French neighbours. Most of these proposals especially concern human rights, social justice, and ecology. Should we accept and adopt these laws for ourselves? This could be beneficial for our fellow citizens."
 france_md.244.a: "These laws could be a good addition to our constitution"
 france_md.244.b: "No, that won't be possible"
 france_md.245.t: "France Pushes for Ecological Legislation"
 france_md.245.d: "The Ecologists' victory in France sent a shockwave through Europe: a founding member of our Union now urges climate legislation over the free trade and growth narrative the EU was built on. Activists have already begun relaying this momentum into our own country. Should we adopt part of their agenda, a gesture to our progressive forces but a drag on economic development, or take a clear stand before the situation moves further in their direction without us?"
 france_md.245.a: "We should also protect ourselves from climate change"
 france_md.245.b: "What climate change?"
 france_md.246.t: "A Green France Takes the Commission"
 france_md.246.d: "Following the latest vote to appoint the European Commission, it seems ecology has carried the day. After the Ecologists' victory in France, Europe Ecology, the Greens, has risen to the highest level of the European Union, a striking sign of the Union's growing march toward climate issues. Beyond raising our citizens' awareness, this victory strengthens their confidence in a Europe that takes their climate security seriously."
 france_md.246.a: "Are we heading toward a green Europe?"
 france_md.248.t: "Ecologist deputies multiply actions in the European Parliament"
 france_md.248.d: "Since their election in France, ecologist deputies have seemingly multiplied in the European Parliament. It would seem that we are witnessing a resurgence of interest in ecological issues in the member states of the European Union. This number of deputies, which seems to be growing in importance, appears to be increasingly shaping the balance of power in the European Parliament to the point of becoming a stake for upcoming European commissions. This growing influence of ecologists on the European Union also seems to spill over into our country, where it influences not only the popularity of our ecological parties but where it strengthens confidence in a European Union more attentive to health and ecological issues."
 france_md.248.a: "They won't accomplish much in the European Parliament"
 france_md.249.t: "France Proposes a Green Transition Fund"
 france_md.249.d: "This time our French friends came with a new proposal on the table. They propose to us the creation of a participatory fund between European countries to help with the ecological transition in European countries. This fund should allow us to develop our energy sector with green energy if possible. They highlight this tool as a way to confirm our energy sovereignty and to model it on a sustainable basis. This tool would, however, come with a greater mobilisation of our civil sector in favour of these investments. Should we participate?"
 france_md.249.a: "Where do we sign?"
 france_md.249.b: "No thanks, we're doing very well on our own"
 france_md.250.t: "France Proposes to Reduce European Carbon Emissions"
 france_md.250.d: "Our French ecologist friends have returned with a proposal for a drastic reduction in carbon emissions, offered to us and our neighbours alike as the EU finalises its Green Deal. They argue that cutting fossil fuel use would let our people breathe easier and build the Union's energy sovereignty, since none of our countries produces oil of its own. Such restructuring would be costly and slow, but could prove decisive if tensions with Russia, our main source of fossil fuels, ever boil over."
 france_md.250.a: "They are right; fossil fuels make us vulnerable"
 france_md.250.b: "I don't see in what world we could be at odds with Russia"
 france_md.251.t: "Interference of France in Our Commercial Policy"
 france_md.251.d: "Our ambassador to France reports the presidency wants us to regulate our food sector: some of our products, they claim, are unfit for consumption, particularly meat produced with growth molecules banned in the EU. Failing to comply risks protectionist measures against our goods and pressure on the rest of the Union to follow, though France's own agro-food industry clearly has a stake in branding our exports unfair competition. Regulating would let our own people benefit more from agriculture, but it would cap our agro-food sector's growth."
 france_md.251.a: "They are right; these regulations are necessary"
 france_md.251.b: "I put what I want in my cattle."
 france_md.252.t: "France Proposes to Establish Customs Barriers Against Brazil"
 france_md.252.d: "Our French partner urges us to ban Brazilian imports over a dispute born of Brazil's refusal to apply Europe's health restrictions to its agro-food production, leaving South American food cheaper but more likely to contain products dangerous to our citizens. European industries call this unfair competition; financiers call it free trade. It is clear France's own food industry has fuelled the complaint, but the health risk to our people is real all the same."
 france_md.252.a: "They are right; it's unfair competition"
 france_md.252.b: "What about free trade in all this?"
 france_md.253.t: "Interference of France in Our Commercial Policy"
 france_md.253.d: "Our ambassador to France reports the presidency wants us to regulate our manufacturing and extractive sector: much of our production ignores European industrial standards, yet floods their market, and their industries call the resulting trade imbalance unfair competition. We need Europe as a trading partner, and refusing their standards risks import restrictions on our goods that would hurt us far more. Complying would let us produce more responsibly for our people and planet, but it would limit our industrial sector's growth."
 france_md.253.a: "We cannot lose our European partners"
 france_md.253.b: "They need these cheap products and they know it."

 france_md.254.t: "France Proposes to Establish Customs Barriers Against China"
 france_md.254.d: "Our French partner urges us to ban Chinese imports over a dispute born of China's refusal to apply Europe's industrial restrictions to its own production, leaving manufactured goods and raw materials cheaper but more likely produced under questionable conditions. European industries call this unfair competition; financiers call it free trade. It is clear France's own industrial sector has fuelled the complaint, but the damage these products cause to the planet and our industries is real all the same."
 france_md.254.a: "They are right; it's unfair competition"
 france_md.254.b: "What about free trade in all this?"
 france_md.255.t: "Interference of France in Our Commercial Policy"
 france_md.255.d: "Our ambassador to France reports the presidency wants us to regulate our oil extraction and refining sector: much of our production ignores European extraction and industrial standards, yet floods their market, and their industries call the resulting trade imbalance unfair competition. We need Europe, and refusing their standards risks import restrictions on our goods that would hurt us far more. Complying would let us produce more responsibly for our people and planet, but it would limit our oil companies' growth."
 france_md.255.a: "We cannot lose our European partners"
 france_md.255.b: "Good luck heating yourselves this winter."

 france_md.256.t: "France Proposes to Establish Customs Barriers Against Russia"
 france_md.256.d: "Our French partner urges us to restrict imports of Russian hydrocarbons over a dispute born of Russia's refusal to apply Europe's extraction and refining regulations, producing fuel under conditions deplorable for the planet. Some European extractive sectors call this unfair competition and want less dependence on foreign powers, but Russia may pose less threat than we think, and their lax standards keep our fuel costs down."
 france_md.256.a: "They are right; we should restrict our fuel dependence"
 france_md.256.b: "What about free trade in all this?"
 france_md.257.t: "France Proposes the Creation of a Grand Plan Around Rail"
 france_md.257.d: "Our French partners have returned with a new project: refocusing Europe's freight on rail rather than trucks, an idea championed by French ecologists to make goods transport more efficient and ecological. It would require an efficient, unified railway network, something we lack today, with mismatches like Spain's different rail gauge still slowing cross-border movement. Since freight circulation is central to the Union, and the network could also ease the movement of people, this is worth pursuing, even if it proves costly against a road-haulage sector that is already thriving."
 france_md.257.a: "Count us in"
 france_md.257.b: "I prefer my lorry"
 france_md.258.t: "The Victory of Communists in France Disrupts Our Internal Politics"
 france_md.258.d: "The French Communist Party's victory sent a shockwave through Europe: a founding member of a Union built in opposition to the communist bloc is now urging its own people to join the struggle, reviving fears of the USSR that many countries thought long buried. Activists have already begun relaying this momentum into our own country. Should we adopt part of their agenda to cut the wave of protest short, a gesture to our progressive forces but a drag on economic development, or take a clear stand before the situation moves further without us?"
 france_md.258.a: "It's not such a bad idea"
 france_md.258.b: "Better dead than red"
 france_md.259.t: "A Hand Extended by Communist France"
 france_md.259.d: "Since its creation, our state has not ceased to be under the rule of Russia or fear it. However, it seems this time aid is ready to arrive. Indeed, French diplomats have proposed to us a strategic partnership to prepare for the possibility of a conflict with Russia. For now it is not much: some papers, some equipment, but above all it is the promise of support to come. The most surprising thing is that this support comes from communist France. Which is not without recalling the oppression we suffered from the Soviets at a time when the PCF was Stalinist. Can we trust France and Europe knowing that this will only harden Russia's position toward us?"
 france_md.259.a: "This partnership is our salvation"
 france_md.259.b: "We are capable of taking care of ourselves"
 france_md.260.t: "France Proposes Its Aid Against Russia"
 france_md.260.desc: "A few decades free of Soviet oppression have not stopped fears of Russia's return, but France has offered aid in the event of a conflict, sharing our fear that Russian expansionism could once again turn toward Eastern Europe. Its proposals range from equipment loans to skills exchanges, aid that could give us a fighting chance before NATO ever mobilises, though only if NATO and Europe do come to our aid. Accepting would harm relations with Moscow; perhaps preserving them is our safer path."
 france_md.260.a: "We just need equipment to keep the Russians at a distance"
 france_md.260.b: "We need training to conduct a high-intensity war"
 france_md.260.c: "We will need to produce more armaments over the long term"
 france_md.260.d: "We don't need aid, Russia is not our enemy"
 france_md.261.t: "France Proposes to Formalise Our Alliance"
 france_md.261.desc: "The triumph of a formerly Stalinist party in France raises the question of relations with a potential ally in Western Europe, one that has voiced hostility to the West and to the Americans and shown ideological closeness to the old USSR, even calling its legacy positive. Paris has multiplied statements denouncing American imperialism and European blindness in following it, and now proposes cooperation that could range from trade to a full military and strategic partnership, should we judge their former Soviet allegiance enough to make them worth trusting."
 france_md.261.a: "It is always a pleasure to do business with you"
 france_md.261.b: "Indeed, we must protect ourselves from American imperialism"
 france_md.261.c: "Nothing will separate communist brotherhood"
 france_md.261.d: "We do not cooperate with communists"
 france_md.262.t: "Russia Agrees to Expand Trade Relations with Us"
 france_md.262.d: "Russia has responded positively to our proposal to expand relations. They have offered to share their industrial and extractive knowledge with us on the condition that we help them establish their nuclear and tertiary sectors. This is a major advance in our relations with Russia. Our proposals for a potential strategic partnership have, however, been set aside. It is likely that Russia does not yet grant us sufficient credit, but this first step in our direction is a good thing. It will take time, but this agreement is the beginning of the end for the imperialists."
 france_md.262.a: "Trust is Always Built Over the Long Term"
 france_md.263.t: "Russia Agrees to Establish a Military and Trade Partnership with Us"
 france_md.263.d: "Russia has responded positively to our proposal to expand relations. They have offered to share their industrial and extractive knowledge with us on the condition that we help them establish their nuclear and tertiary sectors. This is a major advance in our relations with Russia. Russia has additionally proposed to expand this partnership with a military component designed to train us jointly to be ready when the imperialist threat moves to action. They will provide us with training grounds and their expertise in the tundra, and we will give them access to our experience in desert and jungle warfare."
 france_md.263.a: "Together We Are Unstoppable"
 france_md.264.t: "Russia Proposes an Alliance"
 france_md.264.d: "We did not expect such a positive response from our Russian partner. They have proposed that we form an alliance against Western imperialism. Combining economic and geostrategic elements, this alliance will allow us to prepare economically, militarily, and diplomatically for a confrontation with the West. We will exchange our knowledge and industrial traditions, as well as our training grounds and a guarantee of mutual assistance in case of conflict. We had not concluded such an alliance with them since the First World War; perhaps it is a bad omen. This alliance is, however, most welcome and will allow us to survive in a world largely hostile to communism."
 france_md.264.a: "Western Imperialism Will Be Powerless Against Us"
 france_md.265.t: "Russia Refuses to Expand Relations with Us"
 france_md.265.d: "To the great surprise of our diplomats, Russia appears to be declining any form of cooperation with the French Republic. Divergent interests. Lack of trust. It seems that the memory of the USSR is far removed from them. Perhaps Western corruption has finally reached Russia, which was once the bulwark against American imperialism. One thing is certain: we are alone, alone in a Europe that does not understand us and will always be hostile to us."
 france_md.265.a: "We are the true communists!"
 france_md.266.t: "France Clashes with the EU on Immigration"
 france_md.266.d: "Our National Front colleagues have led France for months now, and since taking office they have continuously criticised Europe's migration policies as too lenient. Liberal and socialist forces have long silenced our voice on this within the Union, but with our allies now triumphant in Paris, they can no longer ignore us. Our own people, having embraced nationalist ideals themselves, welcome this victory as proof that our voice was right all along in a Europe that had lost its way."
 france_md.266.a: "It's the beginning of the end for the liberals"
 france_md.267.t: "France Clashes with the EU on Immigration"
 france_md.267.d: "Since the National Front's victory in France, criticism has poured into the European Parliament, and the shift seems to have triggered a wave across European politics as nationalist and Eurosceptic parties record ever stronger scores. Debate centres on immigration, with parliamentarians increasingly reflecting a public opinion turning toward a nationalist vision of internal politics, denouncing what they see as overly lenient policy. Our own electorate is no exception, and the upheaval France has caused is beginning to shake it too. Should we fight this nationalist drift or accept the new European orientation as it takes shape?"
 france_md.267.a: "They are right, though"
 france_md.267.b: "Europe has already paid the price of nationalism"
 france_md.268.t: "France Wins Its Case in Brussels"
 france_md.268.d: "French political policy has taken a new turn: despite their historic Euroscepticism, the party has struck a deal with the European Union, using Euroscepticism campaigns at home and among allies to convince Brussels of the danger they posed, and now using that leverage to force the EU to deport illegal migrants. It is a real success for their presidency. Our own nationalist government faces the same sovereignty question: should we pursue EU advantages in exchange for relaxing our own Euroscepticism, knowing much of our party sees that stance as a founding value?"
 france_md.268.a: "Why Negotiate When We Can Simply Leave Europe."
 france_md.268.b: "That's smart, we should do the same"
 france_md.269.t: "France Advocates for a European Identity"
 france_md.269.d: "Having won concessions on migration from Brussels, France's leadership now seems to be abandoning its Eurosceptic rhetoric altogether, even promoting adherence to the European Union so long as it keeps distancing itself from liberal and socialist tendencies. Nationalist movements appear to be multiplying within the Union itself, making a Europe of Nations attractive again, though such a shift could unsettle voters attached to outright rejection of the EU. Should we follow France's lead, especially if EU leadership keeps drifting our way?"
 france_md.269.a: "This Is a Very Good Initiative"
 france_md.269.b: "One Cannot Be Both Nationalist and European at the Same Time"
 france_md.270.t: "France Proposes to Invest in Our Defence"
 france_md.270.d: "In recent years, the possibility of a new war on the European continent seems more possible than ever. Although our Union has not yet suffered any aggression, the concerning actions of our Russian neighbour seem to confirm this worry. France has come to us with an offer: they propose to help us build our military-industrial complex by investing in it. With these weapons factories, we could effectively prepare for a day when we must fight for our country and our European partners. However, allowing them to invest in our armament would make us more dependent on them, which may not be a good idea. Moreover, our pacifist population could worry about such mobilisation of our capital."
 france_md.270.a: "Thank You for This Crucial Aid"
 france_md.270.b: "There Is No Reason to Worry"
 france_md.271.t: "France Recognises Our Claims in Ukraine"
 france_md.271.d: "Since power in France passed to the National Front, they have grown increasingly favourable to us, breaking with a Europe that has always opposed our ambitions eastward. Not only have they spoken in favour of our claims on Ukrainian territory, they have offered us access to their territory and ports to move troops and goods, easing our logistics and blunting any future European embargo. This new ally confirms us on the path toward war we might yet undertake."
 france_md.271.a: "The First Domino Falls"
 france_md.271.b: "We Have No Intention to Fight Our Ukrainian Brothers"
 france_md.272.t: "France Proposes to Expand Our Cooperation"
 france_md.272.desc: "After many statements and agreements in our favour, France seems ready to expand relations with us, presenting itself as a defender of morality and faith in a Europe and West it now sees as decadent. Our relations could progress from trade to a full military and strategic partnership, should we see enough potential in this new ally, or we can decline if we still count on good relations with the European Union as it stands."
 france_md.272.a: "Our Economy Will Benefit"
 france_md.272.b: "Our Economy and Our Armies Will Benefit"
 france_md.272.c: "The World Will Tremble Before Us"
 france_md.272.d: "We Do Not Intend to Cooperate With France"
 france_md.273.t: "Russia Agrees to Expand Trade Relations with Us"
 france_md.273.d: "Russia has responded positively to our proposal to expand relations. They have offered to share their industrial and extractive knowledge with us on the condition that we help them establish their nuclear and tertiary sectors. This is a major advance in our relations with Russia. Our proposals for a potential strategic partnership have, however, been set aside. It is likely that Russia does not yet grant us sufficient credit, but this first step in our direction is a good thing. It will take time, but this agreement is the beginning of the end for the ultra-globalists."
 france_md.273.a: "Trust is Always Built Over the Long Term"
 france_md.274.t: "Russia Agrees to Establish a Military and Trade Partnership with Us"
 france_md.274.d: "Russia has responded positively to our proposal to expand relations. They have offered to share their industrial and extractive knowledge with us on the condition that we help them establish their nuclear and tertiary sectors. This is a major advance in our relations with Russia. Russia has additionally proposed to expand this partnership with a military component designed to train us jointly to be ready when the ultra-globalist threat moves to action. They will provide us with training grounds and their expertise in the tundra, and we will give them access to our experience in desert and jungle warfare."
 france_md.274.a: "Together We Are Unstoppable"
 france_md.275.t: "Russia Proposes an Alliance"
 france_md.275.d: "We did not expect such a positive response from our Russian partner. Indeed, they have proposed that we form an alliance guaranteeing mutual assistance in case of aggression by foreign powers. Combining economic and geostrategic elements, this alliance will allow us to prepare economically, militarily, and diplomatically for a confrontation with the rest of the world. This alliance will give us the strength to fight to the end to defend ourselves against ultra-globalism in which our neighbours have sunk. We had not concluded such an alliance with them since the First World War; perhaps it is a bad omen. This alliance is, however, most welcome and a major success for our politics."
 france_md.275.a: "We Are Protected Against Liberal Decadence"
 france_md.276.t: "Russia Refuses to Expand Relations with Us"
 france_md.276.d: "To the great surprise of our diplomats, Russia appears to be declining any form of cooperation with the French Republic. Divergent interests. Lack of trust. Perhaps Western corruption has finally reached Russia, which was once strong and proud. This reversal is not, however, dramatic; perhaps we did not have so much in common after all. We will surely find other nationalist allies on the continent."
 france_md.276.a: "That's a shame"
 france_md.277.t: "France Proposes to Protect Us Against Russian Influence"
 france_md.277.d: "For several years, the Russians appear to have invested in the African continent, offering their services to fight against the jihadist and independence insurrections flourishing in the countries of former French Africa. France and Russia are clearly in a conflict of influence on this continent. With them, values clash: Western liberalism and authoritarianism. In this situation where we African countries are targets of Russian influence, which can sometimes worsen tensions between regional minorities, France proposes to help us reduce their presence by assisting us in their stead. However, this would mean drawing closer to our former colonisers, which may not be a good idea. What should we decide."
 france_md.277.a: "They Are Right; Russian Influence Is Dangerous"
 france_md.277.b: "Our Former Colonisers. Certainly Not"
 france_md.278.t: "The French Commune Leaves the European Union"
 france_md.278.d: "A few months ago, France announced the end of the republic in favour of the French Commune, a new entity founded on revolutionary communism, and it did not take long for them to leave our European Union, built as it is on the economic liberalism their new orientation now rejects. The exit was immediate and final, with no apparent intention to negotiate. This bodes ill for a continent whose Union existed above all to prevent new conflicts, and an abrupt exit paired with so revolutionary an ideology will sooner or later have to be confronted."
 france_md.278.a: "That was to be expected"
 france_md.279.t: "The French Commune Pressures Our Politics"
 france_md.279.d: "As predicted, the French Commune's exit from the European Union was no dead end; barely free of it, they are already reviving their economy, and their success is starting to win admiration from those at home who lack much love for liberal European values. French intelligence, reshaped into an international propaganda service, is helping train these agitators, and we should take this seriously before we end up in their position. We can champion European values and the peace they bring, or match their agenda ourselves to blunt the coming violence, though that means embracing communist, anti-European politics."
 france_md.279.a: "No Point Fighting If We Can Beat Them at Their Own Game"
 france_md.279.b: "We Must Fight Against These Extremists"
 france_md.280.t: "The French Commune Invites Us to a Summit on World Revolution"
 france_md.280.d: "Having secured control at home, France's revolutionary communists now intend to export their revolution, inviting us to a summit on world revolution because our own government has already sided with the communist values the new French Commune holds dear. They are determined to spread these values worldwide, and this invitation is surely a test of whether we would follow. Such a revolution will not come without war, likely bloody, given how many great powers will never accept it. Communist ideals are dear to us, but are we ready to risk our citizens' lives to achieve them?"
 france_md.280.a: "Count us in, long live the revolution"
 france_md.280.b: "History Has Proven That Freedom Is Not Brought at Gunpoint"
 france_md.281.t: "The Emperor Undertakes Deep Reforms of the French Armed Forces"
 france_md.281.d: "Our Emperor has undertaken deep reforms of our armed forces, aiming to make them more adaptable to the wars we may be led to fight. Carrying this out demands heavy investment and our full attention, leaving less room for immediate readiness, so we will grow more vulnerable for a time before we can resume building our forces. This first wave targets the army's leadership itself, found unfit for the reforms to come, and the refactoring of the command chain should take somewhat less than a year, a year in which we must limit our military operations for long-term gain."
 france_md.281.a: "These Reforms Are Necessary"
 france_md.282.t: "Our General Staff Reforms Are Complete"
 france_md.282.d: "Our reforms have been completed in record time. Some resisted, but most of our general staff accepted the refactoring of the command chain. Beyond making our leadership more efficient, these reforms open the door to talented new generals, at the cost of more advanced training, and they are only the first brick in transforming our armed forces. In the months ahead, further reforms will define the means and objectives of our forces and give our military-industrial complex a clearer order book. It was a long-term gamble, and we appear to have won it."
 france_md.282.a: "We Have Held Firm. Now We Can Move On to More Important Matters"
 france_md.283.t: "The Backbone of Our Army"
 france_md.283.d: "The first set of reforms concerning our approach to the battlefield has arrived, defining the strategy we should employ in any large-scale conflict against a future adversary. Since our post-Second World War refactoring, our armies have always favoured offensive strategies built on mobility and manoeuvre, and we could deepen that by centring our doctrine and equipment orders on assault tanks and rapid target capture. The alternative is to focus on infantry instead, reinforcing their role and equipment to answer enemy counter-attacks with superior firepower, a safer approach but one that would question our past doctrine."
 france_md.283.a: "Infantry Has Always Played a Central Role; It Is the Safest Approach"
 france_md.283.b: "Our army has been built around a war of movement since the Cold War, and there is no reason for that to change"
 france_md.284.t: "Our Firepower"
 france_md.284.d: "A final wave of doctrinal reform has arrived, forcing us to decide how our army destroys enemy forces at range. We have long balanced artillery and aviation, but the road ahead demands specialisation. Our Caesar cannons are mobile and effective, letting us bombard enemy troops from safety. Our air force and helicopters offer versatile firepower, but remain vulnerable to enemy air defence, and losing control of the skies could prove disastrous. We must choose between minimal risk and greater firepower."
 france_md.284.a: "Artillery is more cost-effective"
 france_md.284.b: "Our aviation is highly effective; it would be foolish not to use it"
 france_md.285.t: "Our Position Regarding the European Union"
 france_md.285.d: "For too long, our nation prioritised the European Union over its own development. Setting aside our development and security led us to an unprecedented democratic crisis, from which we nevertheless emerged victorious. But today we have the opportunity to reverse this trend. Freed from past democratic institutions, we are free to make our own choices and can leave the European Union if we wish. However, leaving overnight could strike a severe blow to our nation just recovering from liberal oppression. Should we negotiate with the European Union to monetise our return among them, or should we seal our break with them by completing our departure from the European Union?"
 france_md.285.a: "Empty Brussels's pockets or we are leaving!"
 france_md.285.b: "The European Union has done us enough harm. Frexit!"
 france_md.286.t: "France Leaves the European Union"
 france_md.286.d: "Following a major upheaval in our French partner state, nationalist movements claiming Bonapartism have seized control of France. Immediately, they have worked to destroy the remnants of pro-European sentiment within France. Now they announce France's departure from the European Union. They have shown categorical refusal to negotiate. The victory of these nationalist movements is not merely a fissure in the European construction project, but a model for Eurosceptics across the Union."
 france_md.286.a: "Nationalism is a danger to our European Union"
 france_md.287.t: "The European Union Bends to Our Demands"
 france_md.287.d: "It appears we made the right decision in negotiating our return to European institutions. Not only have we avoided an economic crisis, but we have also extracted funds from the European Central Bank. This is what one might call a successful financial operation! There is no doubt we will eventually face our partners on the battlefield, but let them slumber in delusion. One thing is certain: our adversaries must be furious that our negotiations with the ECB succeeded."
 france_md.287.a: "Our time will come"
 france_md.288.t: "Our Negotiations Fail"
 france_md.288.d: "Our attempt was bold but proved unsuccessful. Perhaps we asked too much, or failed to inspire confidence in our European interlocutors. In any case, the ECB refused to pay us to remain. That is their decision, and it does not serve our interests, but that is the reality. Now we must decide whether to remain in the European Union. Departure would be economically costly, but remaining would confirm our failure before the Union. In any case, we will eventually face them on the battlefield, with or without European Union membership. The sole question is whether the monetary cost of departure exceeds the moral cost of staying."
 france_md.288.a: "Leaving the Union would cost us too much; for now, we cannot afford it"
 france_md.288.b: "We have nothing more to do here"
 france_md.289.t: "France Secures an Arrangement with the European Union"
 france_md.289.d: "After months of diplomatic pressure and threats to leave, Bonapartist France has bent the European Union to its will, monetising its membership for additional benefits to stay. This agreement is disastrous for us and our partners: there is no guarantee France will behave now that revenge-obsessed nationalists control it. France remains an essential member, but it is today a danger to the entire continent, and our people must pay the price for its partner's whims."
 france_md.289.a: "Was this really a good idea?"
 france_md.290.t: "The Dawn of a New Empire"
 france_md.290.d: "After months of internal turmoil and constitutional reform, we have succeeded. We have successfully eradicated the institutions and power of the shameful republic. Now France must become what it should never have ceased to be: an Empire! To celebrate the empire's return, we have prepared a grand celebration broadcast throughout France. Through this event, our people will grasp our strength and our determination to restore France to its former glory. This celebration will also send a clear message to our adversaries: a demonstration of power. Now they cannot ignore us; their days are numbered before France comes to claim its due. This time, no coalition can stop us!"
 france_md.290.a: "The Empire Will Reclaim Its Former Greatness!"
 france_md.291.t: "France Calls for a Union of Nationalisms"
 france_md.291.d: "The victory of our nationalist comrades in France has shaken Europe, and the Bonapartes have pivoted their foreign policy against the European Union, its values and its future. They have now extended their hand to us, believing our government shares enough of their character to make common cause. A tacit alliance with France seems attractive, but nothing guarantees they will not turn on us afterward. We must weigh the consequences carefully."
 france_md.291.a: "They are on the right path; we would do well to join them"
 france_md.291.b: "We do not share this vision of nationalism"
 france_md.292.t: "Bonapartist France Pressures Our Politics"
 france_md.292.d: "As we anticipated, France's nationalist and anti-European rhetoric was no accident: since the Bonapartes took power, the European Union has become the target of nationalists everywhere. Segments of our population now fear the return of war, while others have joined the nationalist cause and conducted destabilising operations against our government, widely supported and trained by French intelligence acting as an international propaganda apparatus. We must take this with the utmost seriousness, for their goal is to divide us. The European Union must remain united!"
 france_md.292.a: "Europe will ultimately defeat nationalism"
 france_md.293.t: "Surrounded by Enemies"
 france_md.293.d: "As in the days of revolutionary wars, it appears necessary changes in our nation are breeding resentment. While we rebuild, our enemies already conspire against us and prepare for confrontation. They are right to be cautious, for we are ready to reclaim our territories by force if needed. In any case, we stand isolated against a Europe that rightly views us as a threat. For now, we must above all prepare for years of conflict with our adversaries. We may be able to forge alliances, but we must chiefly rely on ourselves. But one thing is certain: once we have vanquished the Europeanist and Atlanticist threat, we will be unstoppable."
 france_md.293.a: "How many coalitions did Napoleon defeat? We will make short work of them"
 france_md.294.t: "France Proposes We Join Its Alliance"
 france_md.294.d: "We have just received a proposal from French diplomats. Observing that they are isolated in Europe and surrounded by enemies of their own making, the Bonapartes have appealed to us. Specifically because they regard our nation as sufficiently respectable to merit alliance with them. It goes without saying that this is no mere defensive pact and that joining would quickly entangle us in conflicts not necessarily our own. However, this alliance could serve us well in confronting our own adversaries, and all else being equal, it is better to be with them than against them. An alliance with France seems enticing, but perhaps joining them would be a ticket straight to hell, since they will soon bring war to Europe."
 france_md.294.a: "We can benefit from this alliance"
 france_md.294.b: "Certainly not"
 france_md.295.t: "France Proposes We Join Its Comintern"
 france_md.295.d: "The revolutionary communist factions ruling France have developed an appetite for conflict, pursuing worldwide revolution and recruiting allies to export it by any means necessary. They have called upon us, particularly since we too have embraced socialism, offering a chance to defeat capitalism and fascism on the battlefield. However, this is no mere defensive pact, and joining would quickly draw us into conflicts not necessarily our own."
 france_md.295.a: "They are right; it is time to export the revolution"
 france_md.295.b: "Certainly not"
 france_md.296.t: "French people urged us to attack"
 france_md.296.d: "Our relentless nationalist propaganda has worked too well: convinced that rival powers seek our destruction, the public now expects us to strike first. Militias have gathered at the borders ready to confront our neighbours' security forces, and public opinion is seething. We must be careful not to frighten these powers into allying against us prematurely."
 france_md.296.a: "It is time to settle accounts"
 france_md.296.b: "Our time will come"
 france_md.297.t: "Skirmishes in the Channel Tunnel"
 france_md.297.d: "Ultra-nationalist French militias, emboldened by their new Bonapartist leader, have attacked our citizens and police around the Channel Tunnel, killing roughly twenty and wounding dozens. We were not alone: last night these groups struck most of France's neighbours who share our defiance of the new Napoleonic Empire. We are plainly a top target, and confrontation with Bonapartist France now seems inevitable."
 france_md.297.a: "We must contain French aggression by protecting their potential targets"
 france_md.297.b: "We must prepare for conflict with them"
 france_md.298.t: "Skirmishes at the French Border"
 france_md.298.d: "Ultra-nationalist French militias, emboldened by their new Bonapartist leader, have attacked our citizens and police along our shared border, killing roughly fifteen and wounding dozens. We were not alone: last night these groups struck most of France's neighbours, all potential targets of Bonapartist expansionism. We are plainly a top target, and confrontation with the new Napoleonic Empire now seems inevitable."
 france_md.298.a: "We must contain French aggression by protecting their potential targets"
 france_md.298.b: "We must prepare for conflict with them"
 france_md.298.c: "There is no reason to worry"
 france_md.299.t: "[FROM.GetName] Calls Us for Aid"
 france_md.299.d: "Faced with the new imminent threat posed by France, other attacked nations were not slow to respond. Like many others, [FROM.GetName] calls upon us for aid to defend against potential invasion. Admittedly, they will likely face attack sooner than we will. Yet are we truly prepared to protect them? Should we sacrifice months of our preparation for [FROM.GetName]? This crisis has upended our foreign policy and aid requests are streaming in. We face two courses: we can aid [FROM.GetName] by adding them to our strategic partnership, or we can let them face Napoleon alone. After all, there is merit in allowing him to wear himself down against an opponent like [FROM.GetName]."
 france_md.299.a: "We must protect them"
 france_md.299.b: "Why die for [FROM.GetName]"
 france_md.300.t: "France Proposes We Join Its Alliance"
 france_md.300.d: "France's Bonapartist leader has drawn the ire of Europe, declaring his readiness for war to restore his nation's greatness, and now extends his hand to us. French diplomats invoke history, recalling how Napoleon once aided the Polish people against Slavic and Germanic oppression, and propose renewing that pact. Such an alliance would protect us against the ever-present Russian threat, but could also drag us into unwinnable wars."
 france_md.300.a: "We will be the new Dombrowski and Kniaziewicz!"
 france_md.300.b: "Why die for Paris? I ask you"
 france_md.301.t: "France Proposes We Join Its Alliance"
 france_md.301.d: "France's Bonapartist leader has drawn the ire of Europe, declaring his readiness for war to restore his nation's greatness, and now extends his hand to us. French diplomats invoke our royal house's descent from Jean Baptiste Bernadotte, a marshal of Napoleon, and propose uniting our efforts in memory of our ancestors. Such an alliance would protect us against the ever-present Russian threat, but could also drag us into unwinnable wars."
 france_md.301.a: "It is time to return to service"
 france_md.301.b: "The past is the past"
 france_md.302.t: "USA friend or foe"
 france_md.302.desc: "Having sent alliance proposals to the few potential allies we can find in Europe, one question remains: how should we deal with the United States? During the Revolution and under Napoleon we maintained good relations with them, sharing a common hatred of England. But times have changed. World War II and American conduct in Europe have often run counter to French interests, and while relations held until our rise to power, Washington may now block our path to hegemony."
 france_md.302.a: "Propose they join our alliance"
 france_md.302.b: "Their commercial power will help us overcome international sanctions"
 france_md.302.c: "Prepare for confrontation with them"
 france_md.302.d: "Securing Europe remains our priority"
 france_md.303.t: "France Proposes an Alliance to Us"
 france_md.303.d: "France's Bonapartist leader has drawn Europe's ire and now proposes an alliance, on condition we do not interfere in their affairs. French diplomats stress that Napoleon and revolutionary France have long been vital allies to us. But France has devoted itself to fighting other European powers, many of them our own allies, and has declared the United Kingdom a priority target, our historical ally and a precious partner. Should we join France and risk war with London?"
 france_md.303.a: "They can count on us"
 france_md.303.b: "The English are our allies above all"
 france_md.304.t: "France Proposes Expanding Our Trade Relations"
 france_md.304.d: "France's Bonapartist leader has drawn Europe's ire and now proposes expanding our trade relations, as his economy, isolated by hostility toward former partners, needs our expertise and industrial power more than ever. French diplomats stress that Napoleon and revolutionary France have long been vital allies to us. But France has devoted itself to fighting other European powers, most of them our own allies, and supporting its war effort through trade could draw their disapproval."
 france_md.304.a: "More trade is always good"
 france_md.304.b: "We will not be their accomplices"
 france_md.305.t: "France Leaves the European Union"
 france_md.305.d: "Following a major crisis among our French partners. Nationalist movements calling for a return to absolute monarchy have seized control of the French state. Since then, they have set about destroying what remained of pro-European sentiment in France. Now they announce France's withdrawal from the European Union. They have displayed a categorical refusal to negotiate. The victory of these nationalist movements is not only a crack in European unity but also a model for all Eurosceptics within the Union."
 france_md.305.a: "Nationalism is a threat to our European Union"
 france_md.306.t: "Monarchists Triumph in France"
 france_md.306.d: "The victory of our monarchists comrades in France has shaken all of Europe: a pillar of the Union embracing nationalism was enough to enrage Brussels. The Royalists have oriented their foreign policy against the European Union, its values and its future, just as we monarchists have long contended with a Union that wanted us silenced. Across Europe, France's example seems to embolden opposition to European bureaucracy. Our own country is already committed to the monarchist cause, so France's victory is a victory for European nationalists everywhere."
 france_md.306.a: "A Victory for Nationalism in Europe"
 france_md.307.t: "The French Kingdom Pressures Our Politics"
 france_md.307.d: "As we predicted, France's nationalist and anti-European rhetoric was no accident: since the monarchy's victory, the European Union has become the target of nationalists everywhere, and France has shown clear willingness to wage war on those it considers enemies. Part of our population now fears the return of war, while others, already lukewarm toward Europe, have sided with the nationalists and conducted destabilising actions against our government, aided and trained by French intelligence services turned international propaganda machine. We must take this seriously: their goal is to divide us."
 france_md.307.a: "Europe Will Eventually Defeat Nationalism"
 france_md.308.t: "France Invites Us to Join Their Crusade"
 france_md.308.d: "The victory of our nationalist comrades in France has shaken all of Europe. Beyond the Union, which it sees as its adversary, the French kingdom has declared it will protect the Christian faith across Europe and the world, denouncing Western democracy as a perversion that led people from religion, and calling for the Church's return to power. As our country has a Christian majority, this call is partly meant for us: they propose we unite to restore Christianity to its former power. The invitation could bring us power in service of our Lord, but guarantees a return to war in Europe."
 france_md.308.a: "We will join their crusade"
 france_md.308.b: "We do not share this vision of Christianity"
 france_md.309.t: "Prepare for the Tenth Crusade"
 france_md.309.d: "For weeks our king has shown unshakeable determination to reclaim the Holy Land, though we hold no foothold in the region. Our Lebanese partners maintain cordial relations with us, but their government is too unstable and Iranian-influenced to help, despite Lebanon's significant Maronite Christian minority making it an ideal landing point for our crusade. We could prepare an amphibious intervention, which would strengthen our navy but mark us as aggressors against an innocent state, or apply political pressure, which carries less risk but no guarantee of success."
 france_md.309.a: "We should first ask them (politely, of course)"
 france_md.309.b: "Those who are not with us are in any case against us"
 france_md.310.t: "The French Kingdom Threatens Our Independence"
 france_md.310.d: "The French Kingdom announced months ago its intent to reconquer the Holy Land, preparing a Tenth Crusade toward Jerusalem. For this they need a foothold near Jerusalem, and our country's strong Maronite minority has put us in their sights. French agitators now work to undermine our legitimacy and pressure Maronites to overthrow our government. French control could shield us from interference by Israel and Hezbollah, but would likely tear our country apart in fratricidal war. Is this truly what we want?"
 france_md.310.a: "They will protect us against our belligerent neighbours"
 france_md.310.b: "They will only bring more conflict!"
 france_md.311.t: "Lebanon Bows to Our Demands"
 france_md.311.d: "This morning is a great day. Following our pressure, the Lebanese government announced its surrender to the demands of Maronite Christian protesters. Immediately thereafter, a government with a Maronite majority was appointed and placed Lebanon under our protection. We made the right choice in privileging diplomacy; the Western powers will find nothing to object to since it weakens Iran's influence. We have manoeuvred well geopolitically. All that remains is to prepare for a land conflict against those who would stand between us and the Kingdom of Heaven."
 france_md.311.a: "Jerusalem is within our grasp"
 france_md.312.t: "Lebanon Refuses Us"
 france_md.312.d: "This morning Lebanon publicly announced its refusal to yield to French pressure on its politics. Our agitators apparently had no effect, and Maronite support for our cause was not sufficient. Our failure likely stems from Lebanon remaining firmly under the control of Iran and Hezbollah. Lebanon's refusal to work with us is not the end, however. We can always return to them when we need to, and this time they will not be able to resist. However, our political efforts seem to have failed. Perhaps we should focus on how we pressure others and strengthen our international diplomacy, as we may need it in the future."
 france_md.312.a: "Prepare for a naval intervention"
 france_md.312.b: "We must strengthen our diplomacy; it does not seem to be our strength"
 france_md.313.t: "The French Commune Demands Our Government's Fall"
 france_md.313.d: "Months ago the French Commune announced its desire to bring revolution to the world, and now seems to be pressuring us. Propaganda agitators have infiltrated our population, inciting citizens to join their cause, and groups of protesters and communist extremists have already organised. French envoys have warned of intervention if we do not yield. We could surrender and join France, losing our independence, or imprison the extremists who threaten our government."
 france_md.313.a: "Long live the revolution"
 france_md.313.b: "Better dead than red"
 france_md.314.t: "[FROM.GetName] Joins the Worldwide Revolution"
 france_md.314.d: "[FROM.GetName] has just announced the fall of its government to our protests and diplomatic pressure. This is excellent news for us; a new power joins the revolution, and all without bloodshed. Other capitalist powers have announced their shock at this dramatic change in world order. They may protest, but they cannot stand against the will of the people. Revolution will eventually come for them too. [FROM.GetName]'s fall is only the beginning; others will follow."
 france_md.314.a: "The Revolution Grows"
 france_md.315.t: "[FROM.GetName] Refuses the People's Will"
 france_md.315.d: "The protests demanding [FROM.GetName]'s government's fall seem to have dissipated. Indeed, the government of [FROM.GetName] violently repressed them and refused any compromise. If this outburst seems to have overcome the people's will, perhaps we should involve ourselves more in the revolution in [FROM.GetName]. Our forces are ready to intervene militarily to enforce the sovereign people's will. However, this intervention could degenerate into a large-scale conflict. Should we intervene or not?"
 france_md.315.a: "The Revolution Will Come Whether They Like It or Not"
 france_md.315.b: "We Will Return"
 france_md.316.t: "The Victorious Commune in Europe"
 france_md.316.d: "This is a great day for our Commune: we have brought revolution to all of Europe. Since the Soviet Union's fall the continent was full of capitalists and budding nationalists, but nothing stopped us, not sanctions, bombings, or the wars we waged to bring the proletariat to power. Sometimes we had to teach oppressors a lesson with cannons, but the triumph of revolution justifies the means. As the people's army parades through Paris, Europe begins rebuilding on sound foundations, far from capitalism. Our next goal is to realise the dream of internationalists everywhere: a great federation where all workers feel at home."
 france_md.316.a: "The Internationale will be humanity"
 france_md.317.t: "Through the Ardennes"
 france_md.317.d: "Our emperor has long discussed invading the Benelux, vital to our nascent empire. Belgium holds a significant Francophone minority in Wallonia and is the European Union's nerve centre, yet remains poorly defended, a perfect first target for restoring our legitimate borders. Because we intend to occupy these lands permanently, as they are legitimately ours, the emperor has ordered us to avoid bombing and strike swiftly, before our enemies can prepare. It is time to reclaim the cradle of the Frankish nation beyond the Ardennes."
 france_md.317.a: "They stand no chance"
 france_md.318.t: "The Second Spanish Campaign"
 france_md.318.d: "Our emperor has ordered the conquest of the Iberian Peninsula, essential to securing our western flank before the march east to Moscow. Taking Spain brings us closer to Gibraltar, key to controlling the Mediterranean. The mountainous terrain favours the defender, so the emperor calls for a slow, sure advance backed by Alpine hunters, yet urges speed before our enemies can prepare. Napoleon's defeat taught us conquered ground must be held: we must impose stable client states or harden occupation forces."
 france_md.318.a: "This Time We Will Watch Them Closely"
 france_md.319.t: "Across the Rhine"
 france_md.319.d: "Our emperor has named our next adversary: Germany, Europe's economic heart and devoted to a vision of Europe we despise. Conflict was inevitable, and it marks our first step east toward Moscow, our ultimate foe. From Napoleon's lightning campaign against Prussia to Sedan and two world wars, we know this enemy well. The emperor orders a sure, prepared advance with strong tanks and aviation to secure our objectives, though full occupation is unnecessary. This war is unfortunate but inevitable."
 france_md.319.a: "Never another Sedan!"
 france_md.320.t: "The war for the Alps"
 france_md.320.d: "Napoleon I's Russian retreat saw allies revolt the moment he weakened, so before marching on Moscow our emperor orders us to secure our southern flank: Italy and the former Austro-Hungarian lands. Minor threats now, they could turn dangerous if our Russian campaign drags on. Their mountainous terrain calls for Alpine hunters and artillery to dislodge defenders from strongpoints, securing our rear without wasting men we will need for Russia. These countries are in the wrong place at the wrong time."
 france_md.320.a: "We Will Bury the Holy Roman Empire Once and for All!"

 france_md.321.t: "The Emperor is Calling on us to Prepare For War"
 france_md.321.d: "Our French ally has called a meeting to discuss destroying Russia, which it sees as a threat to Europe and the empire we now share. It urges us to build our military capabilities and has sent arms experts to optimise our production, with one watchword: prepare for a long, difficult war. The announcement is grim news for our citizens, who may be called to die, but this war is necessary and just. We must protect Europe from Russia before we become its target."
 france_md.321.a: "Thank you, my emperor"

 france_md.322.t: "Piercing the glacis"
 france_md.322.d: "Our march on Moscow is imminent, but first we must secure our launch point: Eastern Europe, once a buffer against Russian expansion, now an obstacle to our own. We offered a hand to those willing to join us; the rest ignored our appeal, and their day of judgement has come. Newly independent, these nations will not be hard to crush. We advance fast with an armoured breakthrough backed by artillery. They will fight to the end. Show no mercy."
 france_md.322.a: "The French will give the world both peace and freedom"

 france_md.475.t: "The Second Russian Campaign"
 france_md.475.d: "After years of preparation, the time has come. Our Emperor has issued his final orders for the Russian campaign, our greatest adversary and, as for Napoleon I, an inevitable threat. For once he hesitates: no error is permitted against a power that has always defended its own soil. Whatever we decide, speed is essential, for the enemy also prepares. Make the right choice, but let them know this: The sovereign people shall advance, tyrants descend in graves to hide!"
 france_md.475.a: "A swift offensive, we'll be in Moscow in two weeks!"
 france_md.475.b: "Let's prepare for a war of attrition"

 france_md.476.t: "Breaking the Blockade"
 france_md.476.d: "Our economy and people have suffered enough at the hands of treacherous Albion, and now, with Europe secured, we can turn to our oldest adversary. Only the Channel blocks our path onto their wretched island. Our Emperor offers two options: strike with air superiority, crushing them with bombs before parachuting our forces in, or exploit their weakened navy and concentrate our fleet for a direct landing. Speed is essential. Make the right choice, citizen. Our victory is imminent."
 france_md.476.a: "Their navy is now a mere shadow of its former self. La Royale will make short work of it"
 france_md.476.b: "A Blitz 2.0, sounds good"

 france_md.477.t: "The Emperor Proclaims Victory of the Continental System"
 france_md.477.d: "They sanctioned us. They embargoed us. They bombed us. But they never broke our spirit. After years of war, our Emperor has declared victory: Europe bows once more before the French Empire. These conquests cost thousands of French lives, martyrs who will not be forgotten. Victory Day is now a public holiday in their memory. But our triumph in Europe settles nothing: sooner or later we face other powers on other fronts. France is eternal. So is war."
 france_md.477.a: "The day of glory has arrived"

 france_md.478.t: "Which Quest for our Kingdom?"
 france_md.478.d: "Our position at the head of the Kingdom of France is secure: we have crushed the Revolution and restored religion to its rightful place. Now the question is where to begin restoring our former glory. We could reclaim our ancestral Frankish lands, though this would trigger war with former allies unwilling to surrender them, or we could win the hearts of Christians everywhere by marching first to liberate the Holy Land, sparing us a war on our own soil. Whatever we decide, we have nothing to fear, for God is on our side."
 france_md.478.a: "We are, first and foremost, Franks"
 france_md.478.b: "The crusade won't wait, we must liberate our holy sites"

 france_md.479.t: "The Kingdom of France Demands Our Annexation"
 france_md.479.d: "A most peculiar request has arrived from our French colleagues this morning. Their king no longer recognises our sovereignty and demands we hand over our territories, reserves and army to his command, promising our population will be integrated smoothly. It reads like an April Fool's prank, but the French General Staff has announced a special mobilisation, and all evidence points to an imminent intervention on our territory. Surrender or fight: whatever we decide, we must act quickly."
 france_md.479.a: "A conflict would cause our people unnecessary suffering"
 france_md.479.b: "How dare they? We are a sovereign country"

 france_md.480.t: "[FROM.GetName] Meets Our Requirements"
 france_md.480.d: "Before the first cannon shot was fired, the government of [FROM.GetName] announced its dissolution and unconditional surrender to our kingdom. This is excellent news for our people and our diplomatic efforts. Our king has promised that the new French citizens will have their status regularised as quickly as possible and that they will be integrated as effectively as possible. This was the wisest decision they could have made. They would not have been able to resist an intervention on our part."
 france_md.480.a: "Sometimes all you have to do is ask nicely"

 france_md.481.t: "[FROM.GetName] Refuses to Give in"
 france_md.481.d: "The government of [FROM.GetName] has just announced that it condemns our attempt to intimidate its country. Our ethnic demands would have no place at the negotiating table. This diplomatic setback was predictable; it would have been strange for a sovereign country to announce its surrender without even putting up a fight. This is fortunate, as we had in fact prepared for this very eventuality. Our forces are ready to intervene on their soil. However, it is not certain that open conflict is the best way to secure justice."
 france_md.481.a: "They're going to regret it"
 france_md.481.b: "This is not the end of us"

 france_md.482.t: "The Kingdom of France Demands Our Submission"
 france_md.482.d: "A most peculiar request has arrived from our French colleagues this morning. Their king, invoking the days of the Carolingians, no longer trusts us to protect the papacy amid rising tensions, and demands full control of our government along with the corridor to the Vatican, which he intends to administer directly. This is intolerable: we have never failed the papacy, and religion cannot justify our neighbour's nationalist ambitions. Yet these are no idle threats, the French General Staff has ordered a special mobilisation, and all evidence points to an intervention on our territory. Yield or fight: whatever we decide, we must act swiftly."
 france_md.482.a: "We are no match for them"
 france_md.482.b: "How dare they? We are a sovereign country"

 france_md.483.t: "[FROM.GetName] Refuses to Meet Our Demands"
 france_md.483.d: "The government of [FROM.GetName] has just announced that it condemns our attempt to intimidate their country. They refuse to bow to our demands and wish to defend their sovereignty over their decisions and policies. It would appear that they have rejected our appeal to reason. We cannot let them get away with this. Our forces are ready to intervene militarily in their country. We cannot risk our adversaries joining forces to confront us. We must make an example of them. However, a war with [FROM.GetName] may not be what we need."
 france_md.483.a: "They didn't realise they were on the wrong side of the gun"
 france_md.483.b: "We can bend them in other ways"

 france_md.484.t: "The Kingdom of France Demands Our Submission"
 france_md.484.d: "A most peculiar demand has arrived from our French colleagues this morning. Their king no longer trusts us to protect our people and claims our government sits on the wrong side of the current balance of alliances, demanding full control of our government and armed forces. These demands are preposterous: we have never failed in governing our territory, and our authority comes solely from our people's mandate. Yet these are no idle threats, the French General Staff has ordered a special mobilisation, and all evidence points to an intervention on our territory. Yield or fight: whatever we decide, we must act swiftly."
 france_md.484.a: "We are no match for them"
 france_md.484.b: "Only our people are sovereign"

 france_md.485.t: "The Rise of the Western Empire"
 france_md.485.d: "After years of struggle and betrayal, the Frankish people have triumphed. When we overthrew the usurping republic, Europe ostracised and sanctioned us, but God has always been on our side: France, the eldest daughter of the Church, was never destined for a republic. The enemies of the Frankish people were bound to perish, and now the Franks have reclaimed their lands. It is time to proclaim our Empire, the Empire of the West, the Empire of the Faith, consecrated by the Papacy for our eternal protection. Perhaps it is also time to set out east and reclaim the Holy Land."
 france_md.485.a: "And this time, I'll be the one to place the wreath"
 france_md.485.b: "Deus Vult!"

 france_md.486.t: "The Kingdom of France Demands Our Submission"
 france_md.486.d: "A most peculiar request has arrived from our French colleagues this morning. Their king, determined to see through the Tenth Crusade he has launched, claims our island territories lie in his path and demands them, along with complete control of our government, for good measure. This is intolerable: religion cannot justify our neighbour's nationalist ambitions. Yet these are no idle threats, the French General Staff has ordered a special mobilisation, and all evidence points to an intervention on our territory. Yield or fight: whatever we decide, we must act swiftly."
 france_md.486.a: "This is the best way to ensure this campaign succeeds; we accept it"
 france_md.486.b: "How dare they? We are a sovereign country"

 france_md.487.t: "The Victorious Tenth Crusade"
 france_md.487.d: "After months of intense fighting across the Mediterranean and the Middle East, we have emerged victorious. Travelling island to island, we secured the last Christian strongholds, then laid siege to Jerusalem itself. Countless adversaries stood in our way, and many French died alongside innocents who fell to our vengeful might, but the end justifies the means. With our gains consolidated and the Middle East's instability neutralised, one question remains: should we stop here, or finish what the religious wars in Europe failed to accomplish?"
 france_md.487.a: "There will be a new crusade"
 france_md.487.b: "We have achieved our goal by restoring the Kingdom of Jerusalem. There is no need to go any further"

 france_md.488.t: "The Kingdom of France is urging us to join their alliance"
 france_md.488.d: "A proposal has arrived from French diplomats. Having concluded their Middle Eastern venture, France's king, as protector of the Catholic Church, now declares war on all who reject his authority, and invites us into an alliance he compares to Noah's Ark before a coming flood. This announcement is as mad as it is terrifying, accompanied by mobilisation of the crusading army now returning home. The proposal reads more like an ultimatum, given the ferocity with which they waged their crusade, and must be taken seriously. Whatever we decide, we must do so swiftly."
 france_md.488.a: "It's better to have them on our side than against us"
 france_md.488.b: "Are they mad?"

 france_md.489.t: "The Eleventh Crusade Victorious in Europe"
 france_md.489.d: "This crusade was bloodier than the last. It was also more difficult to carry out, as we took on major powers. But we did it. We are victorious. Yet as we tend to our wounds and rebuild our country and those we have conquered, a question arises. Should we impose strict control over their policies to ensure they stay on the right path? Or should we show them the light and let them decide for themselves? By letting them choose, we would demonstrate our clemency, and they would be less likely to revolt. Conversely, exercising tighter control would help ensure that no other sheep stray. What should we do?"
 france_md.489.a: "We need to keep an eye on them"
 france_md.489.b: "Our Lord will judge them when the time comes"

 france_md.490.t: "The Restoration of Our Natural Borders"
 france_md.490.d: "From Richelieu to de Gaulle, the idea of France's natural borders has never been abandoned: a fundamental concern rooted both in the ethnic claims of the Frankish people and in our security. Today we can fulfil this destiny. We have driven our adversaries from the banks of the Rhine, secured our mountain positions, and the local populations have finally accepted the new order. All that remains is to formalise this annexation. Through it we avenge the Revolution and open an era of security and prosperity for the Empire and the French people."
 france_md.490.a: "France's borders are defined by nature (Danton 1793)"

 france_md.491.t: "The Union of the Frankish People"
 france_md.491.d: "For too long, powers seeking to limit France's influence have thwarted the unity of the Frankish people, carving out states like the Benelux as a battleground between Franks and other Germanic peoples, and convincing us that the European Union was our true motherland. But the destiny of the Franks belongs to the Franks alone, and nothing could keep them divided forever. We have reclaimed the ancestral land that gave birth to the French nation, and after months our blood brothers have come to see that their destiny lies with us. Now that the Kingdom is whole, justice has been done."
 france_md.491.a: "A state for all the Franks"

 france_md.492.t: "The Return of the Carolingians"
 france_md.492.d: "Upon Charlemagne's death his empire was divided into West, Middle and East Francia, and the Frankish emperor's legacy began to fade as the Franks were stripped of their lands. We have rectified this mistake. After years of conflict we have driven the usurpers from our territory and shown its inhabitants that they were never Germans, Italians or Swiss, but Franks who had simply forgotten. Through this reunification we right the wrongs of the Treaty of Verdun and a thousand years of Europe built on false foundations. This day marks the beginning of a new, Frankish Europe."
 france_md.492.a: "The empire and the Frankish state are one"

 france_md.493.t: "The Kingdom of Jerusalem Resurfaces"
 france_md.493.d: "Just under a millennium ago, our Crusader forebears saw their most precious possession taken from them. Nine Crusades were not enough to conquer and hold our holy sites, but we have returned to fulfil this promise made to the Lord. We have regained a foothold in the Middle East within the last Christian strongholds of Lebanon, and we have recaptured Jerusalem and the Holy Land. This was followed by a struggle to establish our kingdom in the Middle East and to make the population understand that the holy sites must remain under our control to guarantee their safety."
 france_md.493.a: "The Tenth Crusade triumphs!"

 france_md.494.t: "An Empire Reborn"
 france_md.494.d: "Around 150 years ago Napoleon's Second Empire fell to Prussia and the Germanic peoples, beginning a century of revenge and conflict for France. Everyone predicted our slow decline as a former colonial power, but we Bonapartists proved them wrong, wresting power from the unstable republic and restoring France to its former glory. It came at a cost, but we have reclaimed the borders of Napoleon I's First Empire and driven out enemy powers. With this historic victory over the Eighth Coalition, France has shown the world it is back, and the Continental System now triumphs in Europe."
 france_md.494.a: "Third time the charm"

 france_md.495.t: "The Return of the Colonial Empire"
 france_md.495.d: "The Bonapartist empires have always centred on dominating Europe, but the colonies mattered greatly too, from the Haitian revolt to Napoleon III's expansion into Africa. Since the fall of the colonial empires we have been gradually ousted from the countries we once controlled, and it is time to restore the natural order. Our Emperor has ordered us to prepare for France's return to its former colonies, mobilising troops from our overseas departments and regions, better suited to this environment. We will invade coastal towns to secure naval bases before pushing inland, where the climate grows harsher."
 france_md.495.a: "Those blessed days of the colonies"

 france_md.496.t: "Our French Overlord Demands Our Annexation"
 france_md.496.d: "We should have realised that the control over our politics imposed by France would sooner or later end up like this. The French authorities have just announced that our country is soon to be absorbed into France. This announcement did not come out of the blue, France has long had its eye on some of our territories and seems determined to seize them this time. They believe they will be better able to administer our country than we are. In these dark hours, we must make a choice not only for our independence but also for the safety of our people. To yield or to fight, these are our options. Whatever we decide, we must act swiftly."
 france_md.496.a: "We do not have the means to oppose it"
 france_md.496.b: "This land is ours, let them come and take it"

 france_md.497.t: "[FROM.GetName] Revolts Against Our Overlordship"
 france_md.497.d: "The government of [FROM.GetName] condemns our attempt at annexation and is ready to defend its independence at any cost. They accept vassalage but refuse to cede the territories we demanded, expel our administration, and prepare to confront us. We can crush this rebellion now to make an example of them, or postpone their punishment for later, since nothing prevents our return."
 france_md.497.a: "This will serve as a lesson to them and to anyone else who might be tempted"
 france_md.497.b: "We'll crush them later"

 france_md.498.t: "France is proposing to invest in our industry"
 france_md.498.d: "Our French partners have made us a tempting offer: Europe wants to refocus production capacity it can control, so France proposes investing in our economy by helping establish factories on our territory, as part of a wider project to strengthen European sovereignty and resilience. This would greatly benefit us, but also the French, who could gain a stake in our capital and our companies. Should we sacrifice a little sovereignty to help our industry?"
 france_md.498.a: "Where do we sign?"
 france_md.498.b: "Europe and France have no business meddling in our economy"

 france_md.499.t: "France is Proposing to Invest in Our Infrastructure Network"
 france_md.499.d: "During a pleasant discussion with our French partners, they made us a rather attractive offer. Europe's main objective is to facilitate the movement of people and goods between EU countries, and they would like to assist our country in this regard. The French government has therefore offered to invest in our transport network by helping to modernise our infrastructure. This offer forms an integral part of a project aimed at increasing European sovereignty whilst helping its member states weather future crises. This offer would be highly beneficial for us, but it would also benefit the French, who could gain influence over the management of our infrastructure. Should we sacrifice a little of our sovereignty in order to modernise our infrastructure?"
 france_md.499.a: "Where do we sign?"
 france_md.499.b: "Our infrastructure network is already doing very well without them"

 france_md.502.t: "France is Proposing to Invest in Our Ecological Transition"
 france_md.502.d: "During a pleasant discussion with our French partners, they made us a rather tempting offer. As their long-term aim is to make Europe more environmentally friendly, they are proposing that we invest jointly in the green transition. The French government has therefore proposed that we invest in our renewable energy production infrastructure. This offer would be highly beneficial for us, but it would also benefit the French, who could gain a foothold in our electricity generation. Should we sacrifice a little of our sovereignty to further our green transition?"
 france_md.502.a: "Where do we sign?"
 france_md.502.b: "We don't need their Ecological transition"

 france_md.520.t: "The Fragmentation Continues"
 france_md.520.d: "Misfortunes never come singly. As we sink in the polls, our party is splitting apart: our liberal wing has rallied behind the centrist party, and minister Emmanuel Macron has launched his own party, La République en Marche, to challenge us. Our left wing has broken away too, disappointed by our record on social and economic issues, rallying behind Jean-Luc Mélenchon to build a radical left-wing party of their own. These developments are disastrous, but they are also a sign that we can turn the tide and win back our electorate before it is too late."
 france_md.520.a: "Curse!"

 france_md.521.t: "French Agents Breach Our Defence System"
 france_md.521.d: "At the crack of dawn this morning, we were woken by the sound of car horns and crashes. The streets of our capital are at a standstill due to what appears to be an act of sabotage against our transport infrastructure. Our technicians are doing their utmost to restore the situation, but the accidents have already claimed the lives of several members of our police force, and we fear that the safety of our armed forces may also be at risk. This attack clearly originates from Bonapartist France, which has been espousing hostile rhetoric towards us for several months now. We must prepare ourselves before these little games played by secret agents become the norm."
 france_md.521.a: "Damn them"

 france_md.522.t: "Our Police Forces Have Repelled a French Raid"
 france_md.522.d: "It was with a sigh of relief that we learnt our police forces had managed to prevent a large-scale act of sabotage in our capital. The enemy managed to escape, but we have averted the worst. This attack has nevertheless cost the lives of two members of our police force during sporadic clashes on the streets of our capital. This operation clearly originates from Bonapartist France, which has been espousing hostile rhetoric towards us for several months now. We must prepare ourselves before these little games played by secret agents become the norm."
 france_md.522.a: "We won't always be so lucky"

 france_md.523.t: "France Proclaims the Third Empire"
 france_md.523.d: "France has just declared the return of the Empire. Some time ago, a nationalist monarchist faction seized power in France and has evidently consolidated its hold on power. They have therefore organised a grand ceremony to announce the return of the Empire, and now it is the talk of the town. Indeed, the ceremony was covered by the media and widely shared on social media. This celebration is not merely an artistic event,it is also a show of force by France. For several months now, France has publicly displayed a desire for conquest and conflict. This proclamation is therefore not an end but a beginning: the beginning of complications in Europe and around the world."
 france_md.523.a: "We should take this threat seriously"
 france_md.523.b: "They haven't been a threat for a long time"

 france_md.524.t: "More Funds for the Army?"
 france_md.524.d: "Our recent investments in defence were vital to maintaining our place within the European defence strategy, but could we not do more? Faced with the threat of war returning to Europe, many allied countries have deployed enormous resources to prepare their forces for a high-intensity conflict. Perhaps we should do the same and invest even more in our arms production capabilities."
 france_md.524.a: "You can never be too careful"
 france_md.524.b: "We've already spent a lot"

 france_md.525.t: "The Resources to Achieve Our Ambitions"
 france_md.525.d: "Despite our calls for the French people to work harder and shed a culture of dependency, the reality is stark: our country lacks stable jobs despite a large, willing and talented workforce. We could boost employment by injecting funds into strategic sectors of our economy, since waiting for the market to correct itself could take centuries, or we could instead fund our cutting-edge defence industry, inundated with orders it lacks the resources to fulfil, and let the civilian sector fend for itself."
 france_md.525.a: "Our citizens need these jobs"
 france_md.525.b: "Our defence industry will make better use of these funds"

 france_md.526.t: "Reviving Economic Activity"
 france_md.526.d: "Years of ultra-liberalism have weakened our economy, yet surviving our exit from the European Union demands one robust and free of EU sanctions. We could invest in the capital of French private companies to encourage them to set up in France, easing state involvement in the recovery, though nothing guarantees they will not invest elsewhere where labour is cheaper. Or we could directly subsidise the creation and growth of new businesses, a solution the financial sector would dislike but which is certain to work."
 france_md.526.a: "We shall invest in the market, so they will invest in France."
 france_md.526.b: "From a human perspective, capitalism does not offer a satisfactory solution (Charles de Gaulle)"

 france_md.527.t: "Expanding Our Support for Rural Areas"
 france_md.527.d: "Our project to bring economic vitality to rural and peri-urban areas is already well under way, and now we must decide its next step: continue expanding transport links and jobs in less populated regions, or turn to agriculture and its dependent sectors, isolated from the main centres of decision-making and denied the same privileges. Subsidising them would improve their access to centres of production and consumption, and win their favour."
 france_md.527.a: "We will continue to bring connectivity and jobs to the suburbs"
 france_md.527.b: "Let's give that money to the agri-food sector instead. They'll put it to better use."

 france_md.528.t: "The New Economy"
 france_md.528.d: "Having divested ourselves of costly, unproductive industries now being relocated, we must find new work for our increasingly qualified but still under-employed population. The service sector is the safest bet for a developed country like ours: it generates strong revenue, produces little direct pollution, and bridges the gap between the private sector and consumers. But France is also renowned for research, from defence to medicine and chemistry, and repeated crises have forced deep cuts to science funding. Perhaps we should devote more to it by subsidising research programmes."
 france_md.528.a: "The service sector is more profitable and will help to reduce unemployment"
 france_md.528.b: "We should become part of this knowledge society"

 france_md.529.t: "More Jobs or More Services?"
 france_md.529.d: "Our recent investment in productive sectors is paying off: we have halted the spiral of impoverishment and begun rebuilding a stable labour market. We could continue creating jobs that will benefit future generations, or turn to rebuilding the public services our predecessors dismantled alongside those jobs, leaving citizens paying heavy taxes for ever-shrinking services. Better education would make our workers more effective, and better healthcare would let them live longer. Should we refocus on public services, or is the labour market still our priority?"
 france_md.529.a: "Our priority is to create more jobs"
 france_md.529.b: "We've done enough on the labour front, we need to rebuild public services"

 france_md.530.t: "Relocate Our Food Supplies"
 france_md.530.d: "As we prepare to bring our food supply home, a question arises: how? Our agri-food sector could feed us alone, but unfair competition forces us to import goods we do not need, damaging the planet through transport and irresponsible production abroad. We could impose tariff barriers on foodstuffs we do not need or that fail our standards, risking the wrath of our European partners and the WTO. Or we could stay within market rules and subsidise our agri-food sector to compete and reduce our reliance on imports. Whatever we decide, we have the means; it is a matter of will."
 france_md.530.a: "The market and free competition are harmful to our residents and our planet"
 france_md.530.b: "We have to play by the rules"

 france_md.531.t: "France Breaks Free Trade Laws"
 france_md.531.d: "We have just learnt from a French government press release that the government has decided to reintroduce customs barriers on food imports. This move marks the start of what they call a plan to localise their food supply. Although they have numerous arguments in its favour, this plan breaches many laws of the World Trade Organisation and the European Union. The French have signed free trade agreements and should be obliged to honour them. It is not certain that they will face sanctions, but this move is detrimental to European integration. Nevertheless, our people are waiting for us to respond to this issue: have they done the right thing or the wrong thing?"
 france_md.531.a: "That is unacceptable"
 france_md.531.b: "We should do the same"

 france_md.532.t: "Our Economic Sovereignty"
 france_md.532.d: "Breaking free of the powers that long controlled us has a cost: decades of capitalist rule sold off much of our industry to foreign capital, which may now flee, forcing us to reclaim the private sector before it collapses. We could launch a major jobs scheme, fast but costly to sustain while new hubs are built, or create posts within existing sectors, cheaper and more sustainable if they can absorb the extra workforce."
 france_md.532.a: "We are able to create these new workspaces within a year"
 france_md.532.b: "Without building any more, we can employ more people in the existing facilities"

 france_md.533.t: "Towards a Left Wing Coalition"
 france_md.533.d: "After long months of negotiation we have found common ground with a wide range of left-wing parties, who have agreed not to oppose our government and to join our coalition under a joint programme for a fairer France. This is a masterstroke: our government was being challenged by parties that refused to recognise its legitimacy, and we have built a more robust majority without compromising our principles. The arrangement means a modest rise in social benefits, but we were already planning that increase regardless."
 france_md.533.a: "The Threat of a Motion of no Confidence is Fading"

 france_md.534.t: "Other left-wing parties Reject our coalition"
 france_md.534.d: "MPs from other left-wing groups announced this morning that they will not support our proposed coalition, citing too many differences between our programmes and priorities. This is bad news for a government already struggling to hold its position in a divided National Assembly. We can still negotiate bill by bill, though under pressure from all sides each time. These parties have acted irresponsibly, and while part of public opinion supports our united approach, that may not be enough to guarantee our government's survival."
 france_md.534.a: "That Was a Valiant Attempt"

 france_md.535.t: "The Socialist Party Join the Government"
 france_md.535.d: "After long months of negotiation we have found common ground with the Socialist Party, who have agreed to stop opposing us and join the government, under a joint programme largely modelled on our own since they were in no position to impose theirs. This is a masterstroke: our government was being challenged by parties that refused to recognise its legitimacy, and we have built a more stable majority at minimal cost. The arrangement requires investment in the private sector, not quite what our electorate expected, but worthwhile if it lets us pass legislation."
 france_md.535.a: "Leon Blum Would be Proud"

 france_md.536.t: "The Socialist Party Refuses to Join the Government"
 france_md.536.d: "Socialist MPs announced this morning that they will not support our coalition proposal, citing too many differences between our programmes, and clearly still resent our attacks on them during the campaign. This is bad news for a government already struggling to hold its position in a divided National Assembly. We can still negotiate bill by bill, though under pressure from all sides each time. These parties have acted irresponsibly, and while part of public opinion supports our united approach, that may not be enough to guarantee our government's survival."
 france_md.536.a: "Leon Blum is turning in his grave"

 france_md.537.t: "A Term to Finish"
 france_md.537.d: "The President's term still has two years to run, and the party machinery is already arguing over what to do with them. We can govern now under the incumbent's colours and take his programme as our own, or hold back and let the 2002 election settle which party leads France before we commit to one."
 france_md.537.a: "Govern now, under the sitting President"
 france_md.537.b: "Wait for the 2002 election"

 france_md.538.t: "Jacques Chirac is stepping down from politics"
 france_md.538.d: "Following his party's defeat in the presidential elections, former President Chirac decided to bring his political career to an end. From minister to president, he had come a long way and had witnessed France change throughout the Fourth and Fifth Republics. However, the difficulties his party faced during the campaign were also linked to his policies, which did not appeal to everyone. Nevertheless, if there is one lesson to be learnt from his failure, it is that the situation has changed; the world is no longer the same, and we can no longer think as we did before without taking risks. All we can do now is hope that we will fare better than he did."
 france_md.538.a: "That'll give him time to eat his apples"

 france_md.539.t: "The Fall of the Menhir"
 france_md.539.d: "Jean-Marie Le Pen, founder and former leader of our party, is back in the news for the wrong reasons: after years of Holocaust-denying and anti-Semitic remarks, he now refuses to call Marshal Pétain a traitor. Since stepping down he has clashed with the party's new direction on issues from pensions to the conflicts of the last century, and his remarks keep us from finally taking our place within the republican mainstream. We could expel him, though that risks alienating the old guard who share his views. Do we truly want to transform our party to republican standards, or risk losing our identity?"
 france_md.539.a: "He's become a nuisance, we must expel him from the party"
 france_md.539.b: "Just remind him to behave himself"

 france_md.540.t: "From the Front to the Rally"
 france_md.540.d: "Following numerous internal debates and conferences within their party, senior figures in the National Front have announced significant changes to the party's policies and status. The party will now be known as the National Rally and is clearly determined to shake off its label as a far-right party. To this end, they have announced the expulsion of numerous activists deemed too extreme and have reaffirmed their commitment to remaining in the European Union. This development marks the final stage in the decline of the old National Front, as it is revamped to appear more acceptable. Although these changes are minor, we must do our utmost to prevent the public from believing that this changes anything."
 france_md.540.a: "They are nonetheless dangerous"

 france_md.541.t: "The Fall of the Holy See"
 france_md.541.d: "A foreign power is currently occupying the Vatican. We cannot, therefore, guarantee the safety of the papacy whilst the Vatican remains under the control of our adversaries. Yet our country has already provided a home for the papacy in the Palace of the Popes in Avignon. There is therefore nothing to prevent us from bringing the College of Cardinals and the current Pope to Avignon. This will be a momentous change for Christendom worldwide, but with the Vatican under occupation, we alone are powerful enough to ensure the protection of the Church, as our Kingdom has always done."
 france_md.541.a: "The Papacy will be safe here with us."

 france_md.550.t: "Nicolas Sarkozy Wins the Presidency"
 france_md.550.d: "The second round has confirmed what the polls suggested. Nicolas Sarkozy, the interior minister who built his reputation on a hard line against urban unrest, has carried the Union for a Popular Movement to the Elysee with a clear margin over Segolene Royal. The campaign was fought on work, authority and national identity, and turnout was the highest in a generation. The new president promises a rupture with the Chirac years: pension reform, a tighter labour market, and a French return to the integrated command of the Atlantic Alliance. His opponents warn that the rupture will be felt hardest by those who can least afford it."
 france_md.550.a: "Work more to earn more."

 france_md.551.t: "Francois Hollande Wins the Presidency"
 france_md.551.d: "After five years of the Sarkozy presidency, the Socialists have returned to power. Francois Hollande, long dismissed as a party manager rather than a statesman, has won the second round on a platform of fiscal justice, a renegotiated European budget treaty and a withdrawal from Afghanistan. The financial crisis and the eurozone emergency dominated every debate, and the outgoing president could not escape his record. The new administration inherits a stagnant economy, a strained deficit and a European partnership that expects France to lead rather than object."
 france_md.551.a: "Change is now."

 france_md.552.t: "Emmanuel Macron Wins the Presidency"
 france_md.552.d: "The old party system has collapsed. Neither the Socialists nor the Republicans reached the second round, and the run-off was fought between a movement founded barely a year ago and the National Front. Emmanuel Macron, a former investment banker and economy minister, has won comfortably on a platform of labour market liberalisation, European integration and a politics that claims to be neither of the right nor of the left. His movement now faces the legislative elections with no parliamentary base and no local machine, and his opponents on both flanks are already organising in the street."
 france_md.552.a: "Neither right nor left."

 france_md.553.t: "Emmanuel Macron Is Re-elected"
 france_md.553.d: "For the second time the run-off pitted the president against the National Rally, and for the second time the republican front held, though by a narrower margin than five years ago. The campaign was overshadowed by war in Europe, by energy prices and by a pension reform the president has promised to carry through regardless. He becomes the first French president in twenty years to win a second term, and the first to do so with a far right that has never been closer to power."
 france_md.553.a: "A second term, and a narrower one."
 france_md.554.t: "France Proposes Joint Military Exercises"
 france_md.554.d: "French diplomats have sent us a proposal for joint military training. Indeed, the recent rise in international tensions encourages us to unite among European states to prepare for the worst. This could be a very good initiative to train our armed forces for the high-intensity conflicts that could erupt at any moment. What should we tell them?"
 france_md.554.a: "With pleasure, we will train alongside them"
 france_md.554.b: "No thank you, we don't need their help"



  #ELECTION EVENT
 france_md.503.t: "Opposition to [FRA.GetLeader]: What is the Trend?"
 france_md.503.d: "As President [FRA.GetLeader]'s term draws to a close, the presidential campaign is entering its final stretch and the balance of electoral power is becoming clear. The favourite, Lionel Jospin, served as Prime Minister under Chirac, pursuing social democratic policies in line with European standards while distancing himself from the socialist tradition: modern, but not socialist. Various left-wing candidates from the Greens and the French Communist Party lack the resources to win outright, but could still gain momentum. Is the left as a whole the clear favourite, or might its divisions propel another candidate into the second round?"
 france_md.503.a: "The left is managing to win over the electorate"
 france_md.503.b: "None of the left-wing candidates has secured the support they had hoped for"

 france_md.986.t: "Lionel Jospin Faces Criticism"
 france_md.986.d: "Although he is the left's favourite candidate for the upcoming election, Lionel Jospin does not enjoy unanimous support within the left regarding his manifesto, seen by some as too liberal and too similar to Chirac's. Opposing him is the French Communist Party; though now a shadow of its former self since the end of the Cold War, it still has allies within the radical left and can appeal to those disillusioned by former President Mitterrand's second term. It could attack Jospin over his shift towards liberalism, but will it do so?"
 france_md.986.a: "The PCF has decided not to attack Lionel Jospin"
 france_md.986.b: "The PCF has managed to win over left-wing voters"
 france_md.986.c: "An inconclusive attack by the PCF"

 france_md.987.t: "Lionel Jospin Given Well Ahead"
 france_md.987.d: "Lionel Jospin and the Socialist Party's triumph is undisputed within the left. Although he had previously come under fire, his opponents are in no position to challenge him or to reach the second round. Whether we agree with his programme or not, it will be him against [FRA.GetLeader] in the second round of the presidential election."
 france_md.987.a: "It could not have been any other way"

 france_md.988.t: "Communist Resurgence"
 france_md.988.d: "Attacking Jospin over his ties to the left was the right call. The Socialist vote split between left and centre, giving the PCF the credibility it lacked to lead opposition to the liberal and conservative policies that have prevailed too long. The PCF has secured an alliance with other left-wing partners such as the Revolutionary Communist League and Lutte Ouvrière. However, centrists dissatisfied with [FRA.GetLeader] would have preferred Jospin to a radical alliance, and are likely to vote against us in the second round. Perhaps we can arrange local investment in their towns in exchange for their silence."
 france_md.988.a: "The centrists will abstain"
 france_md.988.b: "The centrists will call for a united front against the far left"

 france_md.989.t: "An Unlikely Favourite"
 france_md.989.d: "The end of this presidential campaign has proved turbulent for many parties. Following the PCF's attacks on Lionel Jospin, the Communists and Socialists have embarked on a relentless media battle, and as neither side has made its case, the left-wing electorate has turned towards a less controversial, more measured candidate. The Green Party has seized the opportunity to present itself as the voice of calm and reason amid the storm. It is therefore highly likely that the Greens will reach the second round, where they will face a former president weakened by the end of his term."
 france_md.989.a: "Who would have believed it?"

 france_md.990.t: "Neither Left nor Right"
 france_md.990.d: "With the Conservatives already in the second round and the Left in disarray, the former president appears certain to win, though uncertainties remain. Some French people are weary of the left-right divide that has shaped politics for decades, which no longer suits a time focused on stability and European integration. The liberal Union for French Democracy therefore has a case to make: Chirac's pro-independence policy no longer carries much weight in a world where new powers and blocs are emerging. The liberal centre has a role to play, but will it convince the electorate of this new reality?"
 france_md.990.a: "The Liberals will manage to capture people's attention"
 france_md.990.b: "The French Remain Committed to their Sovereignty"

 france_md.991.t: "The Sovereignist Camp Divided"
 france_md.991.d: "With the liberal centre unable to make its case, the voters weary of the left-right divide have turned towards the sovereignists. That camp, however, speaks with two voices. The Rally for the Republic carries the Gaullist tradition of national independence into the mainstream, respectable and fit to govern, while the National Front offers a harder line that the established parties have spent two decades containing. Both lay claim to the same disillusioned electorate. Which of them reaches the second round will decide whether French euroscepticism remains the business of the governing right, or breaks out of the cordon sanitaire altogether."
 france_md.991.a: "The Gaullist tradition still commands the sovereignist vote"
 france_md.991.b: "The National Front will capitalise on the discontent"


 france_md.510.t: "No One Could Have Seen It Coming"
 france_md.510.d: "Given the parties' inability to capture voters' attention, none has the strength to reach the second round against [FRA.GetLeader]. Benefiting from its rivals' disappearance from the spotlight, the National Front has escaped their controversies and, despite its leader Jean-Marie Le Pen, could conceivably qualify. It remains unlikely: Lionel Jospin is still the favourite, and would surely lose to [FRA.GetLeader]. But should the FN reach the second round, how would the other parties react?"
 france_md.510.a: "The parties will not be concerned about the rise of extremism"
 france_md.510.b: "All the parties will call on voters to vote against the National Front"

 france_md.511.t: "Election day"
 france_md.511.d: "After months of a turbulent campaign full of twists and turns, the time has finally come for the French to vote. This is merely the first round, designed to narrow the field down to the two candidates who have garnered the most support from the French public. A second round will then be held to decide between them if neither candidate secures a majority."
 france_md.511.a: "Let's go and vote!"

 france_md.512.t: "The National Front is Predicted to Win the Presidential Election"
 france_md.512.d: "To everyone's surprise, the National Front emerged victorious from the first round, when all predictions had pointed to a head-to-head between Jospin and [FRA.GetLeader]. Given the other candidates' inability to win over the electorate, the Front made it through to the second round, and things look grim for [FRA.GetLeader]: the other parties have not called on voters to support him, his policies too controversial for some. A section of the electorate is expected to rally against the far-right candidate, but defeating Le Pen, who casts himself as the anti-establishment choice, is far from guaranteed."
 france_md.512.a: "What just happened?"

 france_md.513.t: "The National Front Reaches the Second Round"
 france_md.513.d: "To everyone's surprise, the National Front emerged victorious from the first round, when all predictions had pointed to a head-to-head between Jospin and [FRA.GetLeader]. Given the other candidates' inability to win over the electorate, the Front made it through to the second round. Fortunately, [FRA.GetLeader] should come out on top: political parties and civil society, shocked by a far-right party reaching the runoff, have called for a massive vote against Le Pen. Large demonstrations have taken place across the country in support of the outgoing president. This is a historic event; let us hope it is the only one."
 france_md.513.a: "How on earth did we end up in this situation?"

 france_md.514.t: "The PCF Declared Winner of the Presidential Election"
 france_md.514.d: "To everyone's surprise, the French Communist Party has emerged victorious from the first round, months after languishing at its lowest ebb since the end of the Cold War. The weaknesses of candidate Jospin and an alliance of the radical left enabled the PCF to rally the left and secure a clear lead into the second round, with Socialists and centrists agreeing not to oppose it provided it does not leave the EU. Its leader balanced opposition to the liberal order with reformism to avoid alienating the centre. The PCF's victory is beyond doubt, but can it hold together its coalition?"
 france_md.514.a: "Better days are here at last"

 france_md.515.t: "The PCF has Made it Through to the Second Round"
 france_md.515.d: "To everyone's surprise, the French Communist Party has emerged victorious from the first round, just months after languishing at its lowest ebb since the end of the Cold War. The weaknesses of candidate Jospin and an alliance of the radical left enabled the PCF to secure a place in the second round. Its victory is not complete, however: centrists have announced they will vote for [FRA.GetLeader], viewing a radical-left triumph as a bad omen for European integration and the markets. The second round has not yet taken place, but there is a strong likelihood that [FRA.GetLeader] will triumph once again."
 france_md.515.a: "That was a close call"

 france_md.516.t: "The RPF has Reached the Second Round"
 france_md.516.d: "To everyone's surprise, the outgoing president was knocked out of the second round, brought down by his own party: the Gaullist Charles Pasqua managed to poach enough conservatives and sovereigntists from the right to disrupt [FRA.GetLeader]'s campaign. The RPF is not alone in the second round, however. There, it will face Lionel Jospin, the Socialist candidate who reached the runoff despite internal divisions on the left. This contest will be fiercely fought, for it is not simply socialism against conservatism: next week, the French people will decide whether they want more or less of Europe."
 france_md.516.a: "Sovereignty will prevail"
 france_md.516.b: "The protest vote remains in the minority"

 france_md.517.t: "The UDF Reaches the Second Round"
 france_md.517.d: "The rallying of pro-European voters behind the UDF enabled the party to reach the second round. The Socialists were not the only ones promoting the European Union, and the Liberals were closer to the liberal values of the European Union. People often tend to prefer the original to the imitation. The UDF has therefore managed to join the incumbent president in the second round. It is thus a contest between Chirac's pro-independence policy and the Liberals' Europe at any cost stance. This election is likely to be a close one, as the main blocs are themselves deeply divided on this issue. Fortunately, we won't have long to wait, as the second round is just around the corner."
 france_md.517.a: "The old conservative is kept at bay"
 france_md.517.b: "The UDF's manifesto is proving a little too liberal for the electorate"

 france_md.518.t: "The Greens Make it Through to the Second Round"
 france_md.518.d: "Following a campaign between the left-wing parties, the Greens managed, to everyone's surprise, to make it through to the second round. Their social and environmental programme is at the cutting edge of progress, and having kept their cool amid the PCF-PS clashes, they have come to embody the wisest and fairest solution. They now join the outgoing president in the second round. The contest is likely to be fiercely fought, but for once there is unanimity within each bloc: the left votes progressivism, the right conservatism, and next week's clash will be as much about the environment as social matters."
 france_md.518.a: "Outdated, conservative software is no longer up to the challenges of our millennium"
 france_md.518.b: "The environment is not yet given sufficient priority."

 france_md.519.t: "Lionel Jospin has Qualified for the Second Round"
 france_md.519.d: "As predicted by all the polls, the Socialist candidate has made it through to the second round without too much trouble. His modern, pro-European programme has won over Socialists and centrists alike, giving him a strong voter base, while the more radical left-wing parties, deeply divided, posed no threat to the former Prime Minister. He will now face his rival this week, once again the clash between progressivism and conservatism. But the polls are close, and Jospin may need the support of the left-wing parties, as the RPR could benefit from more right-wing groups unwilling to accept a Socialist president."
 france_md.519.a: "Jospin manages to win over the rest of the left"
 france_md.519.b: "Jospin failed to win over voters further to the left, as his programme was too liberal"

 #various new ideas
 FRA_Macron_eco: "The Macron Act"
 FRA_Macron_eco_desc: "We have decided to follow the policy set out by our Finance Minister, Emmanuel Macron. A law that will simplify investment and employment whilst cutting government spending."
 FRA_Ferrand_eco: "The Ferrand Act"
 FRA_Ferrand_eco_desc: "We have decided to follow the policy set out by our Finance Minister, Olivier Ferrand. A law that will simplify investment and employment whilst cutting government spending."
 FRA_vigipirate_surveillance_lar: "The Vigipirate Plan"
 FRA_vigipirate_surveillance_lar_desc: "To protect our citizens from potential terrorist attacks, we need to be more cautious and more intrusive."
 FRA_vigipirate_surveillance_non_lar: "The Vigipirate Plan"
 FRA_vigipirate_surveillance_non_lar_desc: "To protect our citizens from potential terrorist attacks, we need to be more cautious and more intrusive."
 FRA_ineluctable_collapse: "Collapsing Coalition"
 FRA_ineluctable_collapse_desc: "Our party and our coalition are falling apart; we must sort this out quickly before it's too late!"
 FRA_manif_pour_tous: "La Manif pour Tous"
 FRA_manif_pour_tous_desc: "Hundreds of thousands in the streets every month, a conservative movement the right had not managed to build in twenty years, and a governing party that now has to legislate through it."
 FRA_grand_debat: "Le Grand Débat National"
 FRA_grand_debat_desc: "Ten thousand town halls, two million contributions, and a concession package heavy enough to empty the roundabouts. The peace was real. So was the bill."
 FRA_bassin_minier: "The Bassin Minier Pledge"
 FRA_bassin_minier_desc: "Furnaces relit and slots opened in the old coalfield and the Midi. The promise holds the far right back for as long as the promise is kept."
 FRA_resist_inevitable: "Efforts de Stabilisation"
 FRA_resist_inevitable_desc: "The decline is not irreversible. Our militants are back on the doorsteps, and the drift away from us has slowed."
 FRA_resist_inevitable2: "Efforts de Stabilisation"
 FRA_resist_inevitable2_desc: "The bleeding has stopped. We have steadied the party, and turned our attention to the industrial base our voters depend on."
 FRA_resist_inevitable3: "Efforts de Stabilisation"
 FRA_resist_inevitable3_desc: "We have outlasted the obituaries. The party stands on firm ground again, with a settled base and a programme our rivals must now answer."
 FRA_socialism_renew: "Socialism Renewed"
 FRA_socialism_renew_desc: "We have rebuilt our party's legitimacy on solid foundations. The future lies ahead of us."
 FRA_pension_reform: "Pension Reform"
 FRA_pension_reform_desc: "In light of the budgetary crisis we are facing, we have had to raise the retirement age for our citizens; they weren't happy about it, but we had to do it"
 FRA_french_rearmament: "Re-armament Phase 1"
 FRA_french_rearmament_desc: "With tensions flaring up again in Europe, we have no choice but to rearm in order to avert the worst."
 FRA_french_rearmament2: "Re-armament Phase 2"
 FRA_french_rearmament2_desc: "Training more soldiers is not enough; we must increase our capacity to produce weapons"
 FRA_french_rearmament3: "Accomplished Re-armament"
 FRA_french_rearmament3_desc: "Our population and our armed forces are prepared to face a large-scale conflict"
 french_nuclear_expert: "French Nuclear Experts"
 french_nuclear_expert_desc: "We have accepted assistance from French nuclear technology experts. They will help us build our energy independence."
 french_dissuasion: "French Nuclear Deterrence"
 french_dissuasion_desc: "We have agreed to accept the protection of France and the European Union in the event of a conflict with a hostile power."
 FRA_Our_project: "Our Project for France"
 FRA_Our_project_desc: "Despite the public's initial resistance, they have come to realise that everything we do must be done to protect France's future. More than ever, we are shielded from economic and geopolitical turmoil. And this will be the case for a long time to come."
 FRA_french_independant1: "A Course of Our Own"
 FRA_french_independant1_desc: "France will not fall in line behind either bloc. Standing apart earns us the ear of every other power that refuses to choose a master."
 FRA_french_independant2: "Answering to No Capital"
 FRA_french_independant2_desc: "Our refusal to align has hardened into settled policy. Neither Washington nor Moscow now expects our vote, and the non-aligned world treats us as one of its own."
 FRA_french_independant3: "Independence Under Arms"
 FRA_french_independant3_desc: "Independence is no longer a diplomatic posture but a defensive doctrine. A nation that answers to nobody must be able to hold its own ground unaided, and ours now can."
 FRA_NATO_support: "NATO Support"
 FRA_NATO_support_desc: "By reaffirming our support for our alliance, we have forged partnerships with other member countries."
 FRA_entente_china: "Entente with China"
 FRA_entente_china_desc: "We have concluded agreements with China to facilitate trade between our country and theirs."
 FRA_regulation: "Market Regulation"
 FRA_regulation_desc: "By agreeing to regulate the market and its activities, we can avoid future crises."
 FRA_eternal_fra: "Eternal France"
 FRA_eternal_fra_desc: "We are drawing to the end of our programme, confident that we have shown the world that France is back and will never fade from the international stage."
 FRA_europhile_anger_idea: "Pro-European Demonstrations"
 FRA_europhile_anger_idea_desc: "Some members of our population are reluctant to leave the European Union. This will only last for a while, but we must ensure that the French people understand that this is the only way forward."
 FRA_EU_Retaliate: "Recovering economy"
 FRA_EU_Retaliate_desc: "Leaving the European Union has put us in a difficult economic position, but we will bounce back, whatever the cost."
 FRA_EU_Retaliate2: "Initial Recovery"
 FRA_EU_Retaliate2_desc: "Our efforts are starting to pay off; our economy is recovering, and this time there's no one to put pressure on us or stop us from doing what we want with our money."
 FRA_russian_cooperation1: "The Russian Cooperation"
 FRA_russian_cooperation1_desc: "The Russian government has agreed to share its industrial expertise with us. May this cooperation continue."
 FRA_russian_cooperation2: "The Russian Partnership"
 FRA_russian_cooperation2_desc: "The Russian government has agreed to share its industrial and military expertise with us. May this cooperation continue."
 FRA_a_certain_idea: "A Certain Idea of France"
 FRA_a_certain_idea_desc: "We have managed to reach the end of our journey. We have rescued France from being sidelined in favour of Europe. France's independence is secured. Our master Charles de Gaulle would be proud of us."
 FRA_blocade: "Disrupted Trade Flows"
 FRA_blocade_desc: "We refused to give in to France's blackmail, so they are doing everything they can to prevent goods from the rest of the European Union from reaching us."
 FRA_shocking: "Disappointed Population"
 FRA_shocking_desc: "Our people were very enthusiastic about the plan for the Sixth Republic, but in the end we decided to keep the constitution as it was. They weren't happy about that."
 FRA_draft6threp: "Political Instability"
 FRA_draft6threp_desc: "Our desire for radical change to the constitution of our republic has generated a great deal of enthusiasm amongst the population. It opens up new horizons for the people. However, it also paves the way for the emergence of new political movements that will not always be in our favour."
 FRA_fail6threp: "The Failure of the Reformation"
 FRA_fail6threp_desc: "We have failed to free our people from the Fifth Republic; they have ultimately lost hope in the face of the difficulty of reaching a consensus. Perhaps we will manage to bring about a change in our laws, but as far as our people are concerned, we will have failed to bring them the change they were hoping for."
 FRA_ecological_transition: "Ensure the ecological transition"
 FRA_ecological_transition_desc: "To ensure a future for the next generations, we need to protect the environment. To do this, we must change the way we consume and produce."
 FRA_insoumission: "L'Insoumission"
 FRA_insoumission_desc: "We have successfully carried out the programme for which we were elected. We have made France more socially-minded, environmentally-conscious and humanistic than it has ever been. But we still have a great deal to achieve, and we will rise to the challenge. We must do even better."
 FRA_eu_social_climate: "Social and Environmental Reforms"
 FRA_eu_social_climate_desc: "We have agreed to follow the example set by La France Insoumise. Our people have been inspired by their example. Although it is taking its toll on our finances, it can be seen as a long-term investment."
 FRA_research_boost: "Research Investments"
 FRA_research_boost_desc: "We have invested heavily in research and education to ensure that future generations are even better equipped to deal with modern challenges. This should pay off in the long term."
 FRA_refit_network: "Refitting our Transport Network"
 FRA_refit_network_desc: "To optimise the transport of goods and passengers, we must first modernise our transport network. We have set aside the necessary resources to do so."
 FRA_eden_garden: "Our Garden of Eden"
 FRA_eden_garden_desc: "By doing our utmost to protect our country and the world from the ravages of climate change, we have laid the foundations for a society equipped to face the challenges of our millennium. Tackling climate change will require further efforts, but we have done our best to lead the movement."
 FRA_eu_green_reform: "Environmental Reforms"
 FRA_eu_green_reform_desc: "We have decided to follow the example of the French Greens by investing in the green transition. Although this will slow down our country's growth, it is an investment in future generations."
 FRA_EU_transit: "Ecological Transition Support Fund"
 FRA_EU_transit_desc: "We have agreed to be part of the ecological transition support fund. This initiative was launched by the French Greens and aims to help us make the transition from a carbon-based economy to a low-carbon economy."
 FRA_eu_ban_fossile: "Phasing Out Fossil Fuels"
 FRA_eu_ban_fossile_desc: "We are in the process of phasing out fossil fuels. Our vehicles will run on electricity, and fossil fuels will only be used for marginal purposes. This transition, initiated by the French Greens, will be costly. But it is an investment in our future and in our independence from oil-producing nations."
 FRA_regulation_agra: "Agricultural Regulations"
 FRA_regulation_agra_desc: "We agreed to comply with the European Union's food production regulations. It was our only option if we did not want to lose a key trading partner."
 FRA_regulation_indus: "Industrial Regulations"
 FRA_regulation_indus_desc: "We agreed to comply with the European Union's goods production regulations. It was our only option if we did not want to lose a key trading partner."
 FRA_regulation_fuel: "Regulations on Oil Extraction"
 FRA_regulation_fuel_desc: "We agreed to comply with the European Union's fuel extraction regulations. It was our only option if we did not want to lose a key trading partner."
 FRA_EU_rail: "Building an European Transport Network"
 FRA_EU_rail_desc: "We have agreed to help France and the rest of the European Union to work together to build a better transport network to facilitate trade and optimise the transport of goods."
 FRA_eu_pcf_reform: "Buying Social Peace"
 FRA_eu_pcf_reform_desc: "We agreed to make concessions to our radical left after they began to stir following the victory of communism in France. We gave them what they wanted, and they should now keep quiet."
 FRA_fr_military_assistance: "French Military Assistance"
 FRA_fr_military_assistance_desc: "We have accepted France's assistance in preparing our armed forces for a high-intensity conflict with Russia. The day they cross our border, we will be ready."
 FRA_european_internationale: "The European International"
 FRA_european_internationale_desc: "We have formed an alliance with another communist power in Europe. Together we will defeat capitalism and fascism once and for all."
 FRA_international_will_be_humankind: "The International will be the human race"
 FRA_international_will_be_humankind_desc: "We have managed to consolidate our hard-won power. We have achieved the impossible: we have secured the lasting triumph of communism in France. There is still much to be done, but we have laid the right foundations for the fight against capitalism and fascism in France."
 FRA_eu_FN_reform: "Ensuring Security"
 FRA_eu_FN_reform_desc: "We have responded positively to the call from our people to implement national preference and to tackle insecurity. Although these reforms are a consequence of the rise of the far right in Europe, they also strengthen our ability to exercise control over our population, which is a good thing."
 FRA_nuke_boost: "Nuclear Primacy"
 FRA_nuke_boost_desc: "Nuclear power has been providing us with energy for decades; it is a fantastic way of generating low-carbon energy at low cost. We should simply step up the monitoring of these reactors to ensure that nothing serious happens."
 FRA_Boreal_Space: "The Boréal Space"
 FRA_Boreal_Space_desc: "The Boréal Space is a partnership between the Russian Sphere and the Francosphere, with the aim of integrating Russia into a European alliance. Our goal today is to combat the ultra-globalist threat, an enemy we share."
 FRA_france_for_french: "France for French"
 FRA_france_for_french_desc: "Ever since our foundation, we have had to contend with a pro-immigration faction that has always stood united against us. But now that we have completed our programme, we have demonstrated our ability to lead and guide France towards its destiny; any further resistance is now pointless."
 FRA_red_purges: "The Purge of the Officer Corps"
 FRA_red_purges_desc: "The old officer corps was never ours, so we have broken it and promoted from the ranks instead. Command is loyal now, and cheap to replace, but a professional army has been traded for one that is still learning its trade under fire."
 FRA_people_constitution: "The People's Constitution"
 FRA_people_constitution_desc: "Our revolution has been a success, but we must consolidate our power by giving workers the opportunity to decide for themselves how they want to be governed."
 FRA_commies_redarmy1: "The New Red Army"
 FRA_commies_redarmy1_desc: "Our revolution needs an army to defend itself and to spread its cause. Building on the foundations of the French army, we have established a new force that will defend the people and the revolution."
 FRA_commies_redarmy2: "The New Red Army"
 FRA_commies_redarmy2_desc: "Our revolution needs an army to defend itself and to spread its cause. Building on the foundations of the French army, we have established a new force that will defend the people and the revolution."
 FRA_red_agent_lar: "General Directorate for Revolutionary Action"
 FRA_red_agent_lar_desc: "We have modelled our approach on the DGSE's techniques in order to obtain crucial information about our reactionary and capitalist enemies."
 FRA_red_agent_non_lar: "General Directorate for Revolutionary Action"
 FRA_red_agent_non_lar_desc: "We have modelled our approach on the DGSE's techniques in order to obtain crucial information about our reactionary and capitalist enemies."
 FRA_monarchist_anger: "The Wrath of the Monarchists"
 FRA_monarchist_anger_desc: "Our monarchist allies were disappointed by our refusal to restore aristocratic privileges. Bonapartism is an heir to the Revolution; it could not be otherwise."
 FRA_bonapart_constitution: "The Bonapartist Constitution"
 FRA_bonapart_constitution_desc: "Since the Third Republic, our institutions have no longer been designed to accommodate an Emperor of our stature. We must therefore adapt the constitution to our forthcoming reign. We can take this opportunity to address some of the criticisms levelled by our people at the previous republics; that will be a step in the right direction for them."
 FRA_bonapart_military_reform: "Reorganisation of the Grande Armée"
 FRA_bonapart_military_reform_desc: "Our armed forces are sufficient to ensure our security within our territory, but they are not sufficient to carry out our plans to reclaim our Empire. A restructuring is essential; we are going to dismantle everything from the very top down, so that we can then reform each branch more effectively."
 FRA_army_reformed_1: "Restructured Chain of Command"
 FRA_army_reformed_1_desc: "Now that our command chain has been restructured, we can afford to carry out a more far-reaching reform of our armed forces, including their technology and order book. A major undertaking lies ahead, but this will give us the resources to realise our ambitions."
 FRA_army_reformed_infantry: "Reform of the Grande Armée: The Infantry Line"
 FRA_army_reformed_infantry_desc: "Our Emperor has ruled in favour of a slow and controlled advance. Priority will therefore be given to the infantry and the equipment they require."
 FRA_army_reformed_cavalry: "Reform of the Grande Armée: The Armoured Wedge"
 FRA_army_reformed_cavalry_desc: "Our Emperor has ruled in favour of a fast and powerful attack. Priority will therefore be given to tank battalions and the equipment they require."
 FRA_army_reformed_artillery_infantry: "Reform of the Grande Armée: Infantry and Guns"
 FRA_army_reformed_artillery_infantry_desc: "Our Emperor has ruled in favour of a slow and controlled advance supported by artillery. Priority will therefore be given to the infantry and artillery, as well as the associated equipment."
 FRA_army_reformed_artillery_cavalry: "Reform of the Grande Armée: Armour and Guns"
 FRA_army_reformed_artillery_cavalry_desc: "Our Emperor has ruled in favour of a fast and powerful attack supported by artillery. Priority will therefore be given to tank battalions and artillery, as well as the associated equipment."
 FRA_army_reformed_air_infantry: "Reform of the Grande Armée: Infantry and Air Power"
 FRA_army_reformed_air_infantry_desc: "Our Emperor has ruled in favour of a slow and controlled advance supported by attack planes. Priority will therefore be given to infantry battalions and mass-producing planes."
 FRA_army_reformed_air_cavalry: "Reform of the Grande Armée: Armour and Air Power"
 FRA_army_reformed_air_cavalry_desc: "Our Emperor has ruled in favour of a fast and powerful attack supported by attack planes. Priority will therefore be given to tank battalions and mass-producing planes."
 FRA_BCE_money: "The Money of the EU"
 FRA_BCE_money_desc: "We have succeeded in negotiating our return to the European Union's institutions in exchange for aid from the European Bank. This aid will be vital in preparing for the wars we are going to wage against them!"
 FRA_4th_empire_desc: "The Bonapartist Empire is back, stronger than ever, and this time we will not be defeated by any coalition whatsoever."
 FRA_grande_arme_art_inf: "The Modern Grande Armée"
 FRA_grande_arme_art_inf_desc: "After months of reforms, our army is fully prepared to set out to reclaim the Empire's lost territories. Following a complete overhaul of its system, we have rebuilt it around a strategy of slow and steady advance, backed by intensive bombardments of enemy lines. The infantry remains the king of the battlefield, but the assault air force will make its task considerably easier."
 FRA_grande_arme_art_cav: "A Deluge of Fire and Steel"
 FRA_grande_arme_art_cav_desc: "After months of reforms, our army is fully prepared to set out to reclaim the Empire's lost territories. Following a complete overhaul of its system, we have rebuilt it around a strategy of rapid and brutal advance, backed by intensive bombardments. This strategy relies on technologically advanced resources, but we have the means to surpass Napoleon's deluge."
 FRA_grande_arme_air_inf: "The Sky Clears the Way"
 FRA_grande_arme_air_inf_desc: "After months of reforms, our army is fully prepared to set out to reclaim the Empire's lost territories. We have rebuilt it around a measured infantry advance conducted entirely beneath our own air cover, with strike aircraft and reconnaissance breaking each position before a rifleman is committed to it. The foot soldier still takes the ground, but he no longer walks onto it blind."
 FRA_grande_arme_air_cav: "Thunder Before the Charge"
 FRA_grande_arme_air_cav_desc: "After months of reforms, our army is fully prepared to set out to reclaim the Empire's lost territories. We have rebuilt it around armoured columns that move only where the air force has already passed, trading the artillery train for strike wings that keep pace with the advance. Nothing slows the charge, and nothing survives ahead of it."
 FRA_nationalism_in_europe: "The Rise of Nationalism"
 FRA_nationalism_in_europe_desc: "It seems that the Bonapartists' victory in France is encouraging nationalists across all our European countries to become increasingly involved in politics. Whilst this momentum might enable us to better withstand a conflict with a foreign country, the actions of these agitators in peacetime are a real problem."
 FRA_surrounded: "Continental blockade"
 FRA_surrounded_desc: "Our rise to power has not gone unnoticed, and it is clear that the other European powers are already plotting against us. In particular, Great Britain, which has been our sworn enemy in the past. We must bring down each and every one of these European powers; our survival and that of the revolution depend on it."
 FRA_Sachons_vaincre: "Le Deluge"
 FRA_Sachons_vaincre_desc: "Having spent months preparing our people for a high-intensity conflict, they are now ready for this long-awaited war. Their enthusiasm and faith can move mountains, but we must act quickly before it wanes. We must crush our opponents as quickly as possible."
 FRA_prepare_to_fight: "Preparing our Return"
 FRA_prepare_to_fight_desc: "We have opted for a cautious approach; knowing that our people are fully behind our expansionist ambitions, all that remains is for us to provide them with the means to realise those ambitions. We must ensure that, when the time comes, we are ready."
 FRA_defense_napoleon: "Emergency state"
 FRA_defense_napoleon_desc: "Following the terrorist attacks carried out on our borders by the Bonapartists, our country is on high alert. Whatever happens, we will be ready."
 FRA_thousands_planes: "Aerial Arms Race"
 FRA_thousands_planes_desc: "We have chosen to fight the United States, which for too long has sought to dominate us and the rest of Europe. To protect Europe, we must destroy them, and to destroy them we must be able to compete in the air, as we do not have the means to defeat them at sea."
 FRA_trade_USA: "Transatlantic Trade"
 FRA_trade_USA_desc: "The United States and the French Empire have joined forces to trade across the Atlantic. These agreements will bring them peace and prosperity in return for guarantees of peace."
 FRA_king_camelot_lar: "The King's Camelots"
 FRA_king_camelot_lar_desc: "Our secret police, tasked with suppressing all revolutionary tendencies and other anti-royalist movements."
 FRA_king_camelot_non_lar: "The King's Camelots"
 FRA_king_camelot_non_lar_desc: "Our secret police, tasked with suppressing all revolutionary tendencies and other anti-royalist movements."
 FRA_king_constitution: "The Monarchist Constitution"
 FRA_king_constitution_desc: "All these republics that our country has gone through have built institutions on shaky foundations. We must rewrite this rubbish, because every state, even under our absolute rule needs laws."
 FRA_chivalry: "Modern Chivalry"
 FRA_chivalry_desc: "The French monarchy has always relied on a powerful cavalry force. We have chosen to continue in this vein by prioritising mechanised cavalry over infantry."
 FRA_elite_army: "An Army of Elites"
 FRA_elite_army_desc: "The Revolutionary Wars brought about conscription. However, the many conflicts we have experienced have proved to be extremely costly in terms of human lives. The King's subjects are not always well-trained for warfare. We have therefore chosen to focus on a smaller but far better-trained force."
 FRA_prepare_crusade: "The Tenth Crusade"
 FRA_prepare_crusade_desc: "Our forces are ready to set out to conquer the Holy Land."
 FRA_political_preassure: "Strengthening our Diplomacy"
 FRA_political_preassure_desc: "We have not managed to diplomatically win over Lebanon, so we need to improve the way we engage with foreign powers."
 FRA_navy_crusade: "The Maritime Crusade"
 FRA_navy_crusade_desc: "We have decided retake the Holy Land by the sea. This requires effective amphibious offensive capabilities."
 FRA_commie_europe_integration: "European Assimilation"
 FRA_commie_europe_integration_desc: "We have brought the revolution and communism to the rest of Europe. It is now time to forge a union of the proletariat from every country into a European federation that will be capable of ensuring the revolution endures."
 FRA_counter_insurgency: "Effective Military Policing"
 FRA_counter_insurgency_desc: "The Spanish guerrillas posed a problem for Napoleon I, but that won't be the case for us."
 FRA_attack_benelux: "Battle Plan: Benelux"
 FRA_attack_benelux_desc: "We must focus on annihilating the Benelux forces. Our Emperor has given us the means to defeat them swiftly."
 FRA_attack_iberia: "Battle Plan: Iberia"
 FRA_attack_iberia_desc: "We must focus on annihilating the Iberian forces. Our Emperor has given us the means to defeat them swiftly."
 FRA_attack_germany: "Battle Plan: Germany"
 FRA_attack_germany_desc: "We must focus on annihilating the German forces. Our Emperor has given us the means to defeat them swiftly."
 FRA_attack_holy_roman: "Battle Plan: Southern Europe"
 FRA_attack_holy_roman_desc: "We must focus on annihilating the remain of southern European forces. Our Emperor has given us the means to defeat them swiftly."
 FRA_BON_support_allies: "Preparing for a Long War"
 FRA_BON_support_allies_desc: "Our French partner has suggested that we prepare for a high-intensity conflict with Russia."
 FRA_attack_east: "Battle Plan: Eastern Europe"
 FRA_attack_east_desc: "We must focus on annihilating the eastern European forces. Our Emperor has given us the means to defeat them swiftly. This is the final step before our final campaign."
 FRA_attack_russia_fast: "La Fleur au Fusil"
 FRA_attack_russia_fast_desc: "We'll be in Moscow in two weeks' time!"
 FRA_attack_russia_slow: "Cautious Advance"
 FRA_attack_russia_slow_desc: "This time there won't be a Berezina"
 FRA_attack_UK_naval: "Cross the Channel"
 FRA_attack_UK_naval_desc: "The Royal Navy is no longer a threat to us; victory is within our grasp."
 FRA_attack_UK_air: "Jump Over the Channel"
 FRA_attack_UK_air_desc: "We must maintain control of the airspace and take our opponent by surprise."
 FRA_BON_victory: "Imperial Protectorate"
 FRA_BON_victory_desc: "We have been conquered by the Napoleonic Empire."
 FRA_expansion_europe: "Heir of Charlemagne"
 FRA_expansion_europe_desc: "Our destiny is to reclaim the Carolingian Empire."
 FRA_expansion_europe_crusades: "Carolingian Crusade"
 FRA_expansion_europe_crusades_desc: "The Franks have regained their lands; we must now set out for the Holy Land."
 FRA_expansion_crusades: "Heir of Saint Louis"
 FRA_expansion_crusades_desc: "The duty of our Kingdom is to serve God and reclaim the Holy Land."
 FRA_EMPIRE_occident: "The Western Empire"
 FRA_EMPIRE_occident_desc: "We have reconquered the Carolingian Empire and have been crowned Emperor of the West."
 FRA_crusade_done_jerusalem: "The Victorious Crusade"
 FRA_crusade_done_jerusalem_desc: "The Tenth Crusade has achieved its objective by recapturing Jerusalem and the Holy Land."
 FRA_expansion_crusades_plus: "The Last Crusade"
 FRA_expansion_crusades_plus_desc: "Having reclaimed our holy places, we have decided to make amends for the mistakes of the past. All schisms must be brought to an end."
 FRA_protestant_anger: "Protestant Resistance"
 FRA_protestant_anger_desc: "Our aggressive rhetoric towards Protestants has provoked their anger in our country."
 FRA_harsh_subjugation: "Harsh Subjugation"
 FRA_harsh_subjugation_desc: "Our suzerain, the King of France, has decided to control our economy and policies. Defeat comes at a heavy price."
 FRA_victory_crusade_2_conversion: "The Fifth Horseman of the Apocalypse"
 FRA_victory_crusade_2_conversion_desc: "Divine wrath has been unleashed upon our enemies."
 FRA_enlightment: "Protectorate of the Church"
 FRA_enlightment_desc: "Our suzerain, the King of France, has decided to help us rebuild our country, and to support us in the physical and cultural reconstruction of our society."
 FRA_victory_crusade_2_freedom_light: "The Eldest Daughter of the Church"
 FRA_victory_crusade_2_freedom_light_desc: "We must treat the lost sheep with the utmost kindness."
 FRA_attack_colonies: "Reclaiming the Empire Colonies"
 FRA_attack_colonies_desc: "The continental system must find the resources to ensure its continued existence."










 france_md.110.t: "The Mahoran Status Referendum"
 france_md.110.d: "The people of Mayotte have decided to hold a referendum to determine their fate within the French Republic. The island of Mayotte has been part of the French Republic since 1841, when the island was sold to France by the former king of Madagascar. Leading local officials are looking to solidify their role in the French Republic by officially becoming part of the French Republic, seeking their independence from France, or becoming part of the Comoros. What should we do?"
 france_md.110.a: "Allow the Referendum"
 france_md.110.b: "Deny the Referendum"
 france_md.110.c: "Release them to limited autonomy."
 france_md.111.t: "The Mahoran Status Referendum Results"
 france_md.111.d: "The referendum has finally come to its natural conclusion and the results are in. The future of Mayotte lay in the hands of these results."
 france_md.111.a: "Perfection."

 # Lebanese Event Investments (Decisions)
 france_md.350.t: "France is Kicking Us Out of Lebanon!"
 france_md.350.d: "Through a sophisticated campaign of diplomatic pressure and economic incentives, the French have systematically undermined our position in Lebanon. Their influence operations have succeeded beyond their expectations - local politicians now openly call for our departure, and the Lebanese government has formally requested we withdraw our presence. This is a humiliating setback, but perhaps not an irreversible one. We could attempt to reassert our influence, though doing so would risk an international incident."
 france_md.350.a: "Rat! You'll pay for this!"
 france_md.350.b: "Enforce the Claim"

 france_md.355.t: "France instills a sense of revolt in the population"
 france_md.355.d: "The French have been busy spreading their revolutionary ideals among the Lebanese population. Civil society organisations funded by Paris are demanding democratic reforms, transparency, and free elections. Protest movements are gaining momentum in Beirut and beyond. If we don't act quickly to contain this situation, we may face a full-blown uprising inspired by French republican principles."
 france_md.355.a: "Now that hurt"

 france_md.360.t: "French Energy Investment Proposal"
 france_md.360.d: "The French energy giant TotalEnergies has approached our government with a comprehensive proposal to develop our oil and gas reserves. The deal would bring substantial foreign investment, technical expertise, and create thousands of jobs. However, some domestic critics argue that accepting French capital would increase Paris's leverage over our economic policy. The terms are favourable, but at what cost to our sovereignty?"
 france_md.360.a: "The economic benefits outweigh the risks"
 france_md.360.b: "We cannot sell our resources to foreign interests"

 france_md.400.t: "French Development Aid for Northern Lebanon"
 france_md.400.d: "The Agence Française de Développement has proposed a major infrastructure programme for Northern Lebanon, including road improvements, water treatment facilities, and telecommunications networks. The region has long been neglected, and French investment could transform local living standards. Some view this as genuine humanitarian concern stemming from France's historical ties to Lebanon; others see it as a calculated move to expand French influence in a strategically important region."
 france_md.400.a: "This partnership will benefit our people"
 france_md.400.b: "We prefer to develop our own infrastructure"

 france_md.401.t: "French Infrastructure Initiative in the South"
 france_md.401.d: "France has offered to fund major infrastructure projects in Southern Lebanon, an area that has suffered greatly from years of conflict and neglect. The proposal includes hospitals, schools, and electrical grid modernisation. While the humanitarian need is undeniable, accepting French presence in the south could complicate our relationships with other regional powers who view any Western involvement with suspicion."
 france_md.401.a: "The south desperately needs this investment"
 france_md.401.b: "The political complications are too great"

 france_md.402.t: "French Industrial Investment Programme"
 france_md.402.d: "French corporations are proposing a significant investment in Lebanese manufacturing, promising to establish factories that would create employment for thousands of our citizens. Youth unemployment has been a persistent crisis, and these jobs could help stem the tide of emigration draining our country of talent. Yet industrial dependency on French capital could reshape our economy in ways that primarily benefit Paris."
 france_md.402.a: "Jobs are our priority right now"
 france_md.402.b: "We must develop our own industrial base"

 france_md.403.t: "French Humanitarian Mission to Lebanon"
 france_md.403.d: "In response to our ongoing crisis, France has offered to deploy a humanitarian mission bringing medical supplies, food aid, and technical assistance. French NGOs and government agencies would coordinate relief efforts in collaboration with local authorities. President Macron has personally appealed for international support for Lebanon, invoking the deep historical and cultural bonds between our peoples. This aid could provide desperately needed relief, though it also increases French visibility and influence at a vulnerable moment."
 france_md.403.a: "We gratefully accept this assistance"
 france_md.403.b: "We can manage our own affairs"
 france_md.404.t: "The Accord with the Greens"
 france_md.404.d: "The negotiation is finished and the text is on the table. Twenty-four reactors closed, Fessenheim first, and nuclear reduced to half of the electricity mix within the decade. In exchange the Greens stand aside in sixty constituencies and the majority holds. The energy federations have already voted against it, and Montebourg has said in public what half the parliamentary group is saying in private. Do we sign?"
 france_md.404.a: "Sign it. The alliance is worth more than the reactors"
 france_md.404.b: "The fleet is not a bargaining chip"
 france_md.405.t: "La Manif pour Tous"
 france_md.405.d: "Our recent bill does not appear to have met with unanimous support amongst our fellow citizens. They filled the Champ de Mars and they intend to do it again every month until the bill dies. The organisers are careful, the placards are pink and blue, and behind them stands every conservative association in the country plus a good deal of the right's parliamentary group. The text as drafted covers marriage, adoption and filiation. We can hold the line on all three, or we can strip out what draws the largest crowds and pass the rest quietly."
 france_md.405.a: "The law passes entire. Let them march"
 france_md.405.b: "Trim the text and take what we can get"
 france_md.406.t: "The Roundabouts Are Occupied"
 france_md.406.d: "Eight weekends. The prefectures report a thousand roundabouts held, the Arc de Triomphe has been vandalised, and the flash-ball rounds have taken eyes in front of the cameras. There is no leadership to negotiate with because they refuse to appoint one. Interior wants the anti-rioter law and a free hand. The others want a national debate, town halls in every commune, and a package of concessions large enough to end this before the European elections."
 france_md.406.a: "Pass the anti-rioter law and clear the roundabouts"
 france_md.406.b: "Open the Grand Débat and pay for the peace"

 france_md.500.t: "The Lumio Attacks"
 france_md.500.d: "A small commune in Lumio has been struck by the National Liberation Front of Corsica. The attack did not cause any loss of life but it did leave a substantial amount of damage on the small amount of military infrastructure in the commune as well as leaving several gendarmes injured."
 france_md.500.a: "A troubling incident, nothing more"

 france_md.501.t: "The Hotel Attacks in Marseille"
 france_md.501.d: "A string of minor bombings have been carried out in Marseille. The National Liberation Front of Corsica has claimed responsibility for the strikes. Several people have been hospitalised and injured due to the incidents, but it does not appear that they have any intention of launching additional bomb strikes on any other hotels."
 france_md.501.a: "We will not be intimidated"

 france_md.504.t: "The McDonald's Bombing"
 france_md.504.d: "A small amount of Breton nationalists have decided to bomb a local McDonald's in Quévert, Brittany. The bomb exploded killing one person in the McDonald's. The ongoing investigation has not produced much in the way of evidence if it is a larger plot, but a tragic occurrence."
 france_md.504.a: "A senseless loss of life"
 france_md.505.t: "The KMW-Nexter Merger Proposal"
 france_md.505.d: "The governments of France and Germany are finalising a plan to merge Nexter Systems and Krauss-Maffei Wegmann into a single Franco-German defence holding. The resulting KANT consortium would bring Leclerc and Leopard 2 production lines under one roof, create a joint artillery and ammunition portfolio, and anchor a future European main battle tank programme.\n\nMinisters want political approval before the share transfer goes ahead."
 france_md.505.a: "Approve the merger"
 france_md.505.b: "Keep Nexter independent"
 TT_FRA_knds_merge_carry_traits: "§YAll traits already completed at Nexter will carry over to the new KNDS organisation.§!"
 france_md.506.t: "Arquus: Industrial Consolidation"
 france_md.506.d: "Volvo Group's defence subsidiaries, Renault Trucks Defense and Panhard General Defense, have completed their merger into a single entity. The new firm, Arquus, unites Renault's wheeled mobility platforms with Panhard's reconnaissance heritage and positions France as a unified contender in the European armoured vehicle market. Combined production knowledge, programmes, and modifiers from both legacy firms transfer into the new organisation."
 france_md.506.a: "A new chapter for French armoured mobility"
 france_md.506_tt: "Renault and Panhard will be merged into Arquus"
 FRA_arguus_established: "Renault and Panhard have been merged into Arquus in 2018"
 france_md.507.t: "Eurocopter Becomes Airbus Helicopters"
 france_md.507.d: "Effective today, the Eurocopter Group is rebranded as Airbus Helicopters, consolidating the EADS rotorcraft business under the unified Airbus identity. The Marignane works, Donauwörth plant, and Aérospatiale heritage lines now operate under one banner."
 france_md.507.a: "A new chapter for European rotorcraft."
 FRA_airbus_change: "Eurocopter has been rebranded as Airbus Helicopters in 2014"
 TT_FRA_airbus_change_carry_traits: "§YAll traits already completed at $FRA_eurocopter_manufacturer$ will carry over to $FRA_airbus_manufacturer$§!"
 france_md.508.t: "DCNS Becomes Naval Group"
 france_md.508.d: "Effective today, the historic state arsenal Direction des Constructions Navales, long since rebranded DCNS, adopts the new identity Naval Group, marking its transformation into a full private corporation. The Lorient, Cherbourg, and Brest yards now operate under one banner, alongside the Naviris joint venture with Fincantieri and a renewed export drive built around the Suffren-class submarine and the FDI Belharra frigate."
 france_md.508.a: "A new chapter for French shipbuilding."
 FRA_naval_takeover: "DCNS has been rebranded as Naval Group in 2017"
 TT_FRA_naval_takeover_carry_traits: "§YAll traits already completed at $FRA_dcn_manufacturer$ will carry over to $FRA_naval_group_naval_manufacturer$§!"


 # French Decision Categories
 FRA_french_space_decision_category: "The French Space Programme & CNES"
 FRA_french_space_decision_category_desc: "Space: The Final Frontier. We must begin to conquer this frontier in earnest if we are to remain a Great Power in the eyes of the world, but we can only achieve this at great cost. As we can't be sure of any real economic benefits of a large-scale space programme, the French people must remain convinced that it is a worthwhile venture!\n§RIf our Space Programme Enthusiasm falls below 35, space operations will cease!§! Furthermore, each week our §Y Space Programme Enthusiasm§! will fall by §Y0.1§! due to general disinterest in the §YCNES§!\n\n\nOur Space Programme Enthusiasm is currently: [?FRA.FRA_peoples_support|+50.0] \nWeekly Income from §YSpace Operations & Actions§!: $[?FRA.FRA_space_income_var|+3]b"
 FRA_run_support_campaigns_short: "Launch a Short Public Support Campaign"
 FRA_run_support_campaigns_short_desc: "If our top scientists are only beginning to unlock the scientific wonders that lie in space, then our people must be incredibly confused at the whole ordeal. A short social media campaign should give us some support!"
 FRA_run_support_campaigns_long: "Launch a Long Public Support Campaign"
 FRA_run_support_campaigns_long_desc: "If our top scientists are only beginning to unlock the scientific wonders that lie in space, then our people must be incredibly confused at the whole ordeal. A detailed education campaign should do wonders for the support we receive from the people!"
 FRA_balance_the_cnes_budget: "Rebalance CNES' Budget"
 FRA_balance_the_cnes_budget_desc: "Our space programme, CNES, has had some issues in the past with inefficient spending and minor amounts of corruption. We should send in our state auditors to help reel in excessive spending, and gain CNES some sorely-needed positive reputation."
 FRA_launch_commercial_satellite: "Launch a Commercial Satellite"
 FRA_launch_commercial_satellite_desc: "Now that the age of information is in full swing, private companies are practically falling over each other to launch satellites. By allowing some of these companies to launch from our facilities, we should bring in some reasonable economic benefits. Be aware; however, the people may begin to tire of our commercial-focused programme!"
 FRA_prep_international_space_station: "Prepare an ISS Launch"
 FRA_prep_international_space_station_desc: "Whilst a global achievement and initiative, we can prepare to send our supply rockets to the ISS, along with our personnel."
 FRA_french_iss_launch: "French ISS Launch"
 FRA_french_iss_launch_desc: "After months of planning and preparation, our supply shuttle mission is ready to launch. Three. Two. One. Blast-off!"
 FRA_invest_LEB_decision_category: "French-Lebanese Investments"
 FRA_invest_LEB_decision_category_desc: "The Lebanese were once a former colonial holding of ours and as such it is imperative we return to the region and invest in the great country of [LEB.GetNameWithFlag]."
 FRA_LEB_invest_infrastructure_south: "Invest in South Lebanon"
 FRA_LEB_invest_infrastructure_south_desc: "Economically developing South Lebanon can help prevent radicalisation in the region. The more economic opportunity for the region ultimately the better for all parties involved."
 FRA_LEB_invest_infrastructure_north: "Invest in North Lebanon"
 FRA_LEB_invest_infrastructure_north_desc: "The economic heartland of Lebanon has almost always been centred around Beirut and the surrounding territories. Expanding and investing in the northern part of the country will yield excellent returns."
 FRA_LEB_invest_civilian_factory: "Invest in Lebanese Civilian Industries"
 FRA_LEB_invest_civilian_factory_desc: "The Lebanese could use an additional investment in their civilian industries. Developing these industries could further help the economic development of Lebanon and to become more self-sufficient on the global stage."
 FRA_LEB_financial_help: "Provide Lebanon Financial Help"
 FRA_LEB_financial_help_desc: "We should provide Lebanon financial help to help offset some of their budget shortcomings and otherwise."
 # French Africa Decisions
 FRA_french_africa_decision_category: "Françafrique/Africa Decisions"
 FRA_french_africa_decision_category_desc: "Africa and Françafrique can often be synonymous for us. The continent in Africa needs our assistance and our caretaking and as such we should continue to make Africa a focal point of our foreign policy and our interests."
 FRA_invest_in_NEPAD_education_decision: "Invest in NEPAD Education Programmes"
 FRA_invest_in_NEPAD_education_decision_desc: "The NEPAD education programmes could use some additional funding and support. We will pay for the increased funding, but the African countries will see more education spending cost reductions."
 FRA_invest_in_NEPAD_healthcare_decision: "Invest in NEPAD Healthcare Programmes"
 FRA_invest_in_NEPAD_healthcare_decision_desc: "The NEPAD healthcare programmes could use some additional funding and support. We will pay for the increased funding, but the African countries will see more health care spending cost reductions."
 FRA_invest_in_NEPAD_social_care_decision: "Invest in NEPAD Social Care Programmes"
 FRA_invest_in_NEPAD_social_care_decision_desc: "The NEPAD social care programmes could use some additional funding and support. We will pay for the increased funding, but the African countries will see more social care spending cost reductions."
 FRA_invest_in_NEPAD_economic_program_decision: "Invest in the NEPAD Economic Programmes"
 FRA_invest_in_NEPAD_economic_program_decision_desc: "The NEPAD economic programmes could use some additional funding and support. We will pay for the increased funding, but the African countries will see increased productivity and building speed."
 FRA_extend_the_NEPAD_program_decision: "Extend the NEPAD Programme"
 FRA_extend_the_NEPAD_program_decision_desc: "The programme needs to be extended. We can pump some additional funding into the programme to keep the programme going."
 # French Construction Mission(s)
 FRA_french_construction_decision_category: "Keeping Campaign Promises"
 FRA_french_construction_decision_category_desc: "We need to build at least §G5 new civilian factories§! within a year.\n\nFactories built: §R[?FRA.factories_now]§!"
 FRA_build_factories_mission: "Build factories in time"
 FRA_build_factories_mission_desc: "To appease our base, we must meet our promises on building factories in time!\nIf we don't build enough factories in time, we risk §Rlosing confidence§! in our leadership of France, as well as §Rsupporters§!.\n\nAlternatively, meeting our goals should increase §Gour popularity§! and bring major benefits to our §Gindustry§!.\n\nFactories built: §G[?FRA.factories_now]§!"

