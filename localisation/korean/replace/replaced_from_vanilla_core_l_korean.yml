 UNITS_VIEW_BTN_UNITS_ASSIGN: "§H여단 배정 모드§!\n이 버튼을 눌러 모드를 전환하거나 §GCTRL§!을 누르고 있으십시오.\n그런 다음 강조 표시된 전선 중 하나를 선택하면 현재 선택된 여단이 배정됩니다."
