 KUR.oligarchism: "£KUR_oligarchism_small 库尔德斯坦爱国联盟 - 保守派"
 KUR.oligarchism_icon: "£KUR_oligarchism_small"
 KUR.oligarchism_desc: "保守社会主义 - 库尔德斯坦爱国联盟是一个融合的库尔德政党，作为一个更左翼的替代方案而成立，仍然反对库尔德民主党强大的巴尔扎尼家族的统治。库尔德自治区内战结束后，它有效控制了伊拉克库尔德斯坦南部，并仍然控制着大型佩什梅格部队。在库尔德人彻底独立的问题上，它比库尔德民主党更加务实，并且随着库尔德民主党与伊朗关系的降温，它加强了与伊朗的关系。"
 SOO.Conservative: "£SOO_emerging_reactionary 统一党"
 SOO.Conservative_icon: "£SOO_emerging_reactionary"
 SOO.Conservative_desc: "与俄罗斯的统一俄罗斯党关系密切的政党，因此在很多方面抄袭其纲领。"
 SOO.Nat_Populism: "£SOO_nationalist_right_wing_populist 南奥塞梯共和国人民党"
 SOO.Nat_Populism_icon: "£SOO_nationalist_right_wing_populist"
 SOO.Nat_Populism_desc: "它属于左翼。承认所有制形式的多样性和自由创业精神，主张创建公民社会，发展民主，建立强有力的国家制度对人口进行社会保护。它有自己的意识形态纲领。尽管如此，她仍经常与俄罗斯自由民主党和白俄罗斯自由民主党联系在一起。"
 SOO.Nat_Fascism: "£SOO_nationalist_fascism 尤茨丁议会"
 SOO.Nat_Fascism_icon: "£SOO_nationalist_fascism"
 SOO.Nat_Fascism_desc: "尤茨丁议会是奥赛梯教民间宗教祭司的高级会议。"
 SOV.anarchist_communism_1: "£SOV_left_wing_radical_1 (JR) 公正俄罗斯党"
 SOV.anarchist_communism_1_icon: "£SOV_left_wing_radical_1"
 SOV.anarchist_communism_1_desc: "（左翼民粹主义）公正俄罗斯党\n\n公正俄罗斯党是多个左翼民族主义、社会主义与进步主义政党联合的产物。尽管该党自诩为社会主义政党，实际上却是一个涵盖左翼民族主义者与左翼自由主义者的广泛左翼联盟。该党主张扩大社会福利项目并加强国家对经济的干预。"
 SOV.neutral_Social_1: "£SOV_non_aligned_socialist_democrat_1 (NP) 新人"
 SOV.neutral_Social_1_icon: "£SOV_non_aligned_socialist_democrat_1"
 SOO.anarchist_communism: "£SOO_anarchist_communism 讲坛"
 SOO.anarchist_communism_icon: "£SOO_anarchist_communism"
 SOO.anarchist_communism_desc: "讲坛是南奥塞梯的一个政党，由独立总统列昂尼德·蒂比洛夫的支持者创立。"
 SOO.Monarchist: "£SOO_nationalist_monarchist 阿兰贵族"
 SOO.Monarchist_icon: "£SOO_nationalist_monarchist"
 SOO.Monarchist_desc: "在阿兰王国及后来的俄罗斯帝国覆灭后，奥塞梯贵族阶层已十分稀少，然而仍有不少人声称自己与贵族世家有所关联。"
 SOO.Nat_Autocracy: "£SOO_Nat_Autocracy 奥赛梯武装力量"
 SOO.Nat_Autocracy_icon: "£SOO_Nat_Autocracy"
 SOO.Nat_Autocracy_desc: "南奥塞梯武装部队是部分得到承认的南奥塞梯国家的军队。它包括陆军和空军。"
