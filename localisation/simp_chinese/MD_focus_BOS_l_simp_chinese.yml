 BOS_motor_influence_tt: "外国制造商将通过投资获得对波斯尼亚的§R影响力§!。"
 BOS_union_serbia_accept_tt: "塞尔维亚吞并波斯尼亚并接管其武装部队。"
 BOS_union_serbia_reject_tt: "波斯尼亚保持独立，与塞尔维亚的关系恶化。"
 BOS_military_supplies_accept_tt: "一个响应国向波斯尼亚运送步兵武器。"
 BOS_military_supplies_reject_tt: "做出回应的国家可能会保留其库存，从而恶化与波斯尼亚的关系。"
 BOS_turkish_supplies_accept_tt: "土耳其从其库存中向波斯尼亚运送了2500件步兵武器。"
 BOS_albanian_supplies_accept_tt: "阿尔巴尼亚从其库存中向波斯尼亚运送了750件步兵武器。"
 BOS_military_supplies_decline_tt: "波斯尼亚没有收到我们提供的任何设备，将会对这种拒绝行为持负面态度。"
 BOS_civil_war_over: "波斯尼亚内战已经结束"
 civil_war_focus: "在内战"
 BOS_air_chief: "波斯尼亚空军参谋部"
 BOS_air_chief_desc: "联合空军参谋部负责协调波斯尼亚有限的作战航空兵、运输直升机和地面支援需求。"
 novica_simic: "诺维卡·西米奇"
 novica_simic_desc: "一位波斯尼亚塞族高级指挥官专注于领土防御和保持战斗力。"
 cvjetko_savic: "茨维特科·萨维奇"
 cvjetko_savic_desc: "一位具有改革意识的军官，致力于重建波斯尼亚战后指挥体系。"
 novak_dukic: "诺瓦克·杜基奇"
 novak_dukic_desc: "经验丰富的野战指挥官，适合特种作战和复杂地形作战。"
 miladin_milojcic: "米拉丁·米洛伊契奇"
 miladin_milojcic_desc: "一名专注于机动、机动和作战计划的参谋军官。"
 anto_jelec: "安托·耶莱奇"
 anto_jelec_desc: "一位在防御作战和部队组织方面经验丰富的波斯尼亚克罗地亚族指挥官。"
 senad_masovic: "塞纳德·马绍维奇"
 senad_masovic_desc: "一位专注于训练标准和军事一体化的专业军官。"
 BOS_operation_althea: "木槿花行动"
 BOS_operation_althea_desc: "木槿花行动是欧盟于2004年接替驻波黑稳定部队的任务。它支持代顿和解，并将安全责任移交给波斯尼亚机构。"
 BOS_draft_EUFOR: "欧洲联盟军草案"
 BOS_draft_EUFOR_desc: "用欧盟领导的维和行动取代即将到期的北约领导的驻波黑稳定部队任务授权。"
 BOS_demand_eufor_withdrawal: "要求欧洲联盟军撤军"
 BOS_demand_eufor_withdrawal_desc: "减少国际军事存在，检验波斯尼亚能否维持独立的内部安全。"
 BOS_SFOR_title: "波斯尼亚和黑塞哥维那稳定部队"
 BOS_SFOR_title_desc: "北约领导的稳定部队负责执行《代顿协议》的军事条款，并支持波斯尼亚战后安全。其任务期限可在危机期间延长，也可随着国家机构的恢复而缩短。"
 BOS_peacekeeper_oversight: "维和人员监督"
 BOS_peacekeeper_oversight_desc: "欧洲使团仍驻扎在波斯尼亚，而改革却滞后于国内安全需求。"
 BOS_civil_war_operations: "内战行动"
 BOS_civil_war_operations_desc: "在波斯尼亚内战持续期间，协调冲突地区各处的紧急战时行动。"
 BOS_rotating_presidency: "轮换主席制"
 BOS_rotating_presidency_desc: "波斯尼亚的主席职位由波斯尼亚族、克罗地亚族和塞尔维亚族代表轮流担任。这种安排限制了任何一个组成群体的主导地位，但频繁的权力交接可能会中断立法进程。\n\n塞族态度：[ROOT.BOS_srpska_attitude]\n波斯尼亚族态度：[ROOT.BOS_bosniak_attitude]\n克族态度：[ROOT.BOS_croat_attitude]"
 BOS_more_sfor: "请求延长驻波黑稳定部队期限"
 BOS_more_sfor_desc: "在波斯尼亚政治或经济局势仍然不稳定的情况下，请求北约延长驻波黑稳定部队的任务期限。"
 BOS_lower_sfor: "请求缩短波黑稳定部队驻军时间"
 BOS_lower_sfor_desc: "缩短驻波黑稳定部队的任务期限，因为波斯尼亚各机构准备承担全部安全责任。"
 BOS_attack_upon_nato_desc: "波斯尼亚军队在与北约成员国的作战中处于严重劣势。"
 BOS_sfor_vol_troops: "驻波黑维和部队志愿者承诺"
 BOS_sfor_vol_troops_desc: "如果波斯尼亚再次陷入内战，维和行动参与者可以迅速部署志愿者。"
 BOS_SER_vol_troops: "塞尔维亚志愿者承诺"
 BOS_SER_vol_troops_desc: "塞尔维亚可以迅速派遣志愿者支持塞族共和国应对再次爆发的波斯尼亚冲突。"
 BOS_idea_muslim_nationalism: "动员起来的穆斯林民族主义"
 BOS_idea_muslim_nationalism_desc: "宗教民族主义支持动员和外国干预，同时使政权更加顽固地抵制政治变革。"
 BOS_idea_srpska_supremacy: "塞族共和国至高无上"
 BOS_idea_srpska_supremacy_desc: "塞族机构主导着国家，并指导着国家的资源政策，但权力分享实际上已经结束。"
 BOS_dominant_entity_idea: "主导实体"
 BOS_dominant_entity_idea_desc: "塞族共和国对中央政府的控制稳定了政府，并使其能够抵御外国政治影响。"
 BOS_workers_front_idea: "工人阵线"
 BOS_workers_front_idea_desc: "有组织的劳工已成为一支独立的政治力量。它的动员既加强了政府的力量，又动摇了现有的制度。"
 BOS_workers_compact: "国家工会契约"
 BOS_workers_compact_desc: "国家以劳动和平与更高的运营成本为交换，保障了劳动者的权利和社会支出。"
 BOS_worker_managed_economy: "工人管理经济"
 BOS_worker_managed_economy_desc: "工人委员会与企业管理者共享权力。该制度提高了税收收入，但初期会扰乱工业生产。"
 BOS_mechanical_modernization: "机械现代化"
 BOS_mechanical_modernization_desc: "现代机械和技术培训使工人管理模式转变为更高效的工业模式。"
 BOS_workers_republic_idea: "工人共和国"
 BOS_workers_republic_idea_desc: "委员会代表指导国家及其工业发展。既定的社会主义秩序加快了建设和公共管理的速度。"
 BOS_mechanical_production_bonus: "机械化生产"
 BOS_idea_prepping_an_offensive: "准备进攻"
 BOS_idea_prepping_an_offensive_desc: "储备物资和详细的人员计划暂时改善了作战准备。"
 BOS_idea_commence_the_offensives: "进攻势头"
 BOS_idea_commence_the_offensives_desc: "武装部队致力于在整个内战战线上发起协调一致的进攻。"
 BOS_idea_rally_the_troops: "集结部队"
 BOS_idea_rally_the_troops_desc: "预备役部队和当地新兵维持着公众对战争的支持。"
 BOS_idea_mobilize_the_nation: "全国动员"
 BOS_idea_mobilize_the_nation_desc: "紧急动员加快了军事行动和特许步兵装备的生产。"
 BOS_idea_dig_in: "准备防御"
 BOS_idea_dig_in_desc: "工兵部队和野战部队正在迅速构筑防御阵地。"
 BOS_idea_fight_or_perish: "或战或亡"
 BOS_idea_fight_or_perish_desc: "政府正在调集更多人力以防止在内战中战败。"
 BOS_idea_national_sentiment: "战时国民情绪"
 BOS_idea_national_sentiment_desc: "国家宣传在冲突期间维持着民族主义动员。"
 BOS_religious_identity_idea: "宗教认同"
 BOS_religious_identity_idea_desc: "政府通过伊斯兰机构和宗教民族主义纲领来定义国家。"
 BOS_low_police_budget: "低警察预算"
 BOS_low_police_budget_desc: "减少警务经费虽然降低了日常开支，但也削弱了国家打击有组织犯罪的能力。"
 BOS_bosniak_balkan_aspiration_desc: "波斯尼亚克军队被动员起来，以保卫国家并击败塞尔维亚和克罗地亚的分裂军队。"
 BOS_srpska_balkan_aspiration_desc: "塞族共和国被动员起来，击败波斯尼亚中央政府和与之竞争的克罗地亚军队。"
 BOS_croat_balkan_aspiration_desc: "波斯尼亚克罗地亚军队已动员起来，保卫其领土免受波斯尼亚克族和塞尔维亚族军队的攻击。"
 BOS_police_high_desc: "增加警务经费可以加强执法和政治控制，但代价是巨大的财政支出。"
 BOS_air_doctrine_review: "重视空军学说"
 BOS_air_doctrine_review_desc: "临时人员研究和演习正在加速实用空军理论的采纳。"
 BOS_internal_investment_desc: "国内投资激励措施支持民用工业，同时减少从生产性用途转移的产出比例。"
 BOS_crime_increase_desc: "执法不力导致有组织犯罪扩张，增加了行政成本和消费者成本。"
 BOS_idea_mechanization_of_the_army: "机械化部队"
 BOS_idea_mechanization_of_the_army_desc: "防护车辆和机动规划使波斯尼亚的小规模军队能够以可控的人员成本获得更大的作战范围。"
 BOS_idea_transportation_methods: "现代军事运输"
 BOS_idea_transportation_methods_desc: "标准多用途车辆和运输直升机降低了军事后勤的成本和复杂性。"
 BOS_idea_the_land_fleet: "综合机械化车队"
 BOS_idea_the_land_fleet_desc: "通用车辆系列能够支持运输机和装甲运输车的均衡部署，而无需承担过高的采购成本。"
 BOS_idea_aerial_dominance: "空中霸权"
 BOS_idea_aerial_dominance_desc: "波斯尼亚正在加大对战斗机战备、飞行员素质以及与地面部队密切协调的投入。"
 BOS_idea_air_defence_initiative: "防空计划"
 BOS_idea_air_defence_initiative_desc: "地面防空和监视系统为城市、基地和野战部队提供了可靠的保护屏障。"
 BOS_idea_apc_armament: "装甲输送车"
 BOS_idea_apc_armament_desc: "标准化装甲运输车提高了步兵防护能力和联合兵种机动性。"
 BOS_idea_main_battle_line: "现代反装甲学说"
 BOS_idea_main_battle_line_desc: "机动反装甲部队使波斯尼亚能够在不维持昂贵的坦克部队的情况下与更强大的敌军对抗。"
 BOS_idea_boots_on_the_ground: "侧重步兵的军队"
 BOS_idea_boots_on_the_ground_desc: "训练有素的步兵和预备役部队构成了适合波斯尼亚地形和预算的防御力量的核心。"
 BOS_eu_development_loans: "欧盟发展贷款"
 BOS_eu_development_loans_desc: "欧洲信贷正在为重建提供资金并缓解消费经济压力，但还款条款带来了更沉重的利息负担，使波斯尼亚更容易受到外国杠杆的影响。"
 BOS_election_stimulus: "大选年支出"
 BOS_election_stimulus_desc: "投票前的紧急支出稳定了家庭预算，并提升了公众对政府的信心。"
 BOS_reconstruction_drive: "国家重建运动"
 BOS_reconstruction_drive_desc: "一项协调一致的重建计划正在加快全国范围内的建设，并逐步恢复公众对国家的信心。"
 BOS_national_mobilization: "国家动员框架"
 BOS_national_mobilization_desc: "明确的预备役义务扩大了训练有素的人力库，而制定的防御计划意味着任何被占领的波斯尼亚领土都将更加激烈地抵抗占领者。"
 BOS_idea_detain_ratko_mladic: "拉特科·姆拉迪奇被拘留"
 BOS_idea_detain_ratko_mladic_desc: "与国际司法机构的合作提高了西方对波斯尼亚机构的信心。"
 BOS_idea_civilian_training: "扩充后备训练"
 BOS_idea_civilian_training_desc: "一项临时性国家训练计划正在为预备役人员的动员和领土防御做好准备。"
 BOS_idea_post_war_clean_up: "战后的清理工作"
 BOS_idea_post_war_clean_up_desc: "协调一致的清理和重建工作正在暂时加快对受损社区的投资。"
 BOS_pro_bosnia: "组建波斯尼亚克族支持的政府"
 BOS_pro_bosnia_desc: "由波斯尼亚克族支持的政府领导国家机构，并降低了国家行政成本。"
 BOS_pro_srpska: "组建塞族支持的政府"
 BOS_pro_srpska_desc: "一个由塞族支持的政府领导国家机构，并将与塞族共和国的安全合作列为优先事项。"
 BOS_civil_war_recovery: "内战恢复"
 BOS_civil_war_recovery_desc: "内战重燃，损害了生产、公众信心以及波斯尼亚吸引合作伙伴的能力。"
 BOS_post_war_efforts: "战后重建工作"
 BOS_post_war_efforts_desc: "税收和重建激励措施正在支撑战后投资的暂时性激增。"
 BOS_milorad_dodik_idea: "米洛拉德·多迪克"
 BOS_milorad_dodik_idea_desc: "米洛拉德·多迪克的政治网络阻碍了中央机构的运作，同时加强了塞族共和国的自治权。"
 BOS_farming_improvements: "农业改进"
 BOS_farming_improvements_desc: "现代化的设备和更安全的土地正在提高农业产量和农村稳定性。"
 BOS_farming_powerhouse: "农业强国"
 BOS_farming_powerhouse_desc: "如今，高效的农业部门支撑着农村收入、人口增长和税收基础。"
 BOS_mining_development: "矿业发展"
 BOS_mining_development_desc: "现代化矿山增加了资源开采量和当地的应税活动。"
 BOS_mining_industry: "采矿工业"
 BOS_mining_industry_desc: "整合投资造就了规模更大、效率更高的采矿业。"
 BOS_lumber_harvesting_idea: "木材采伐"
 BOS_lumber_harvesting_idea_desc: "林业和加工投资正在扩大农村资源产出和税收活动。"
 BOS_dayton_accords_desc: "《代顿和解协议》限制了波斯尼亚的扩张，并限制了与塞尔维亚和克罗地亚的军事对抗，同时保持了波斯尼亚的和平。"
 BOS_land_mine_removal_efforts_desc: "排雷队正在减轻受污染土地带来的健康和经济负担，但该计划需要持续的资金支持。"
 BOS_trade_deal_with_russia: "萨拉热窝-莫斯科贸易协定 I"
 BOS_trade_deal_with_russia_desc: "与俄罗斯达成的有限协议既能支持投资，又能降低消费者成本，同时还能增强东方的政治影响力。"
 BOS_trade_deal_with_russia_expanded: "萨拉热窝-莫斯科贸易协定 II"
 BOS_trade_deal_with_russia_expanded_desc: "俄罗斯扩大贸易和信贷，加深了经济合作，并巩固了波斯尼亚东部的政治联盟。"
 BOS_trade_deal_with_eu: "欧盟贸易协定 I"
 BOS_trade_deal_with_eu_desc: "与欧盟达成有限协议可以降低消费者成本，并支持民主和金融一体化。"
 BOS_trade_deal_with_eu_expanded: "欧盟贸易协定 II"
 BOS_trade_deal_with_eu_expanded_desc: "扩大进入欧洲市场和获得信贷的渠道，加强了波斯尼亚与西方的经济联系。"
 BOS_trade_with_nato: "北约援助方案"
 BOS_trade_with_nato_desc: "北约伙伴国提供经济援助，降低短期成本，并促进西方政治结盟。"
 BOS_trade_with_usa: "美国与波斯尼亚联合贸易条约"
 BOS_trade_with_usa_desc: "与美国的双边协议有利于能源生产、消费者获取能源以及与西方国家的政治联盟。"
 BOS_gov_old_name: "波斯尼亚议会"
 BOS_islamic_revolt: "波斯尼亚圣战军叛乱"
 BOS_islamic_upper: "波斯尼亚哈里发国"
 bos_workers_republic: "波斯尼亚和黑塞哥维那工人共和国"
 BOS_events.1.t: "波斯尼亚内战"
 BOS_events.1.d: "塞族共和国宣布独立，波斯尼亚再次陷入内战。中央政府必须击败分裂势力，否则将面临国家永久分裂的风险。"
 BOS_events.1.a: "保卫波斯尼亚和黑塞哥维那"
 BOS_events.1.b: "与塞族共和国站在一起"
 BOS_events.2.t: "克罗地亚族宣布独立"
 BOS_events.2.d: "黑塞哥维那境内的波斯尼亚克罗地亚族领导人宣布独立，而此时该国已深陷战争泥潭。中央政府必须在不放弃对抗塞族共和国的战线的情况下，恢复对南部的控制。"
 BOS_events.2.a: "恢复国家领土完整"
 BOS_events.2.b: "站在克罗地亚分裂分子一边"
 BOS_events.4.t: "战争的结束"
 BOS_events.4.d: "政府已恢复对波斯尼亚和黑塞哥维那的控制，结束了再次爆发的内战。现在可以开始复员、重建和政治和解工作。"
 BOS_events.4.a: "完全整合"
 BOS_events.4.b: "自治权谈判"
 BOS_events.4.c: "将监督权移交给国际管理部门"
 BOS_events.59.t: "对峙演变为战争"
 BOS_events.59.d: "分裂危机最终无果而终。塞族共和国已公开宣布独立，国家再次陷入战争。"
 BOS_events.59.a: "用武力维持国家统一"
 BOS_events.60.t: "黑塞哥维那分裂"
 BOS_events.60.d: "由于未能达成协议，黑塞哥维那的克罗地亚领导人宣布独立，并拿起武器对抗萨拉热窝。"
 BOS_events.60.a: "恢复对南方的控制"
 BOS_events.11.t: "外国武器抵达"
 BOS_events.11.d: "一位区域合作伙伴已向我方部队交付了步兵武器。这批武器将加强前线力量，并巩固后方合作关系。"
 BOS_events.11.a: "分发武器"
 BOS_events.12.t: "农民罢工"
 BOS_events.12.d: "面临农产品价格低迷、土地安全堪忧和政府支持力度不足的农民们发起了一场全国性罢工。他们的组织者要求政府加大对农业的投资，并改革经济政策。"
 BOS_events.12.a: "接受政府更迭"
 BOS_events.12.b: "与农民谈判"
 BOS_events.13.t: "与罢工者达成协议"
 BOS_events.13.d: "政府和罢工领导人已接受一项涵盖工资、工作场所保障和未来谈判的协议。该协议结束了眼前的抗议活动，但也使政府承担了新的义务。"
 BOS_events.13.a: "接受条款"
 BOS_events.14.t: "矿工罢工"
 BOS_events.14.d: "矿工们已停止生产，要求改善工作环境、获得更稳定的工资并缩短工时。罢工正在依赖该行业的社区蔓延。"
 BOS_events.14.a: "接受政府更迭"
 BOS_events.14.b: "与矿工谈判"
 BOS_events.9.t: "波斯尼亚请求武器"
 BOS_events.9.d: "[FROM.GetName]请求提供步兵武器用于其内战。援助将扩大我们在巴尔干地区的影响力，但这些装备必须来自我们自身的储备。"
 BOS_events.9.a: "运送武器"
 BOS_events.9.b: "保护好我们的库存。"
 BOS_events.34.t: "波斯尼亚寻求加入集体安全条约组织"
 BOS_events.34.d: "[FROM.GetName]已申请加入集体安全条约组织。加入该组织将使联盟范围扩展至西巴尔干地区，但也可能将波斯尼亚未解决的争端引入该组织。"
 BOS_events.34.a: "接纳波斯尼亚"
 BOS_events.34.b: "拒绝提议"
 BOS_events.35.t: "集体安全条约组织成员资格已获批准"
 BOS_events.35.d: "俄罗斯已批准我们的申请。波斯尼亚现在也承担集体安全条约组织的集体防御义务。"
 BOS_events.35.a: "接受这些义务"
 BOS_events.36.t: "集体安全条约组织成员申请遭拒"
 BOS_events.36.d: "俄罗斯拒绝了我们的申请，也拒绝将联盟扩展到巴尔干地区。"
 BOS_events.36.a: "重新考虑我们的东方政策"
 BOS_events.15.t: "波斯尼亚武器合作提议"
 BOS_events.15.d: "[FROM.GetName]已提出一项国防工业合作方案，请求获得塞尔维亚飞机和步枪的生产许可证。更紧密的军事联系将把萨拉热窝与贝尔格莱德捆绑在一起，尽管波斯尼亚的一些人会对这种依赖感到不满。"
 BOS_events.15.a: "授予生产许可"
 BOS_events.15.b: "拒绝请求"
 BOS_events.16.t: "贝尔格莱德颁发武器许可证"
 BOS_events.16.d: "塞尔维亚已批准生产许可证的转让。波斯尼亚的工厂现在可以生产塞尔维亚设计的产品，但波斯尼亚克族群中亲塞尔维亚的情绪引发了动荡。"
 BOS_events.16.a: "开始授权生产"
 BOS_events.17.t: "贝尔格莱德拒绝"
 BOS_events.17.d: "塞尔维亚拒绝了武器合作提议，不愿以这样的条件分享其国防工业。"
 BOS_events.17.a: "另寻他处吧。"
 BOS_events.18.t: "波斯尼亚投资邀请"
 BOS_events.18.d: "[FROM.GetName]正在邀请外国汽车制造商在波斯尼亚建厂。建厂将开拓新市场，并扩大我们对波斯尼亚经济的商业影响力。"
 BOS_events.18.a: "在波斯尼亚建造一座工厂"
 BOS_events.18.b: "拒绝邀请"
 BOS_events.19.t: "外国汽车制造商投资"
 BOS_events.19.d: "[FROM.GetName]已同意在波斯尼亚建厂。这项投资将带来就业机会和资金，但制造商所在国的政府也将在我们的产业政策中获得一定的影响力。"
 BOS_events.19.a: "欢迎这项投资"
 BOS_events.20.t: "投资被拒"
 BOS_events.20.d: "[FROM.GetName]目前拒绝投资波斯尼亚的汽车工业。"
 BOS_events.20.a: "联系另一家制造商"
 BOS_events.21.t: "波斯尼亚寻求购买步枪"
 BOS_events.21.d: "[FROM.GetName]希望购买一批现代化的德国步兵武器。这笔交易将为萨拉热窝带来硬通货和良好声誉。"
 BOS_events.21.a: "批准销售"
 BOS_events.21.b: "拒绝销售"
 BOS_events.22.t: "德国步枪已交付"
 BOS_events.22.d: "德国已批准这笔军售。一批现代化步兵武器正在运往我们的仓库途中。"
 BOS_events.22.a: "分发武器"
 BOS_events.23.t: "德国拒绝销售请求"
 BOS_events.23.d: "柏林目前拒绝向波斯尼亚出售步兵武器。"
 BOS_events.23.a: "寻找其他供应商"
 BOS_events.24.t: "波斯尼亚寻求购买俄罗斯步枪"
 BOS_events.24.d: "[FROM.GetName]希望购买大量俄罗斯步兵武器。这笔订单对俄罗斯工业来说将是一笔可观的销售。"
 BOS_events.24.a: "批准销售"
 BOS_events.24.b: "拒绝销售"
 BOS_events.25.t: "俄罗斯步枪已交付"
 BOS_events.25.d: "俄罗斯已批准这笔军售。一大批步兵武器正在运往我们的库存。"
 BOS_events.25.a: "分发武器"
 BOS_events.26.t: "俄罗斯拒绝销售"
 BOS_events.26.d: "莫斯科目前拒绝向波斯尼亚出售步兵武器。"
 BOS_events.26.a: "寻找其他供应商"
 BOS_political.4.t: "波斯尼亚战后选举"
 BOS_political.4.d: "波斯尼亚和黑塞哥维那新世纪的首次全国选举将决定哪个联盟领导该国脆弱的战后机构。"
 BOS_political.4.a: "保留波斯尼亚克族领导的政府"
 BOS_political.4.a_tt: "§Y民主行动党§!将领导政府。下一任总统将由塞尔维亚族代表担任。"
 BOS_political.4.b: "支持塞族领导的联盟"
 BOS_political.4.b_tt: "§Y独立社会民主联盟§!将与§Y塞尔维亚民主党§!组成联合政府。下一任总统将由克罗地亚族代表担任。"
 BOS_political.20.t: "内战后的和解"
 BOS_political.20.d: "战争结束了。波斯尼亚和黑塞哥维那已重新统一在一个政权之下，当务之急是在瓦解原有派系的同时稳定国家局势。"
 BOS_political.20.a: "建立大塞族共和国"
 BOS_political.20.b: "建立克罗地亚族主导的政府"
 BOS_political.20.c: "在萨拉热窝的控制下重新统一波斯尼亚"
 BOS_political.1.t: "战后现状"
 BOS_political.1.d: "波斯尼亚和黑塞哥维那进入新世纪时，面临着机构受损、权力分散和重建工作尚未完成的困境。政府必须决定各实体应保留多少权力。"
 BOS_political.1.a: "定义新国家"
 BOS_political.2.t: "扩展实体自主性"
 BOS_political.2.d: "政府已将更多国内权力移交给黑塞哥维那和塞族共和国，同时保留共同的外交和国防政策。波斯尼亚现在以较为松散的联邦形式运作。"
 BOS_political.2.a: "执行该和解协议"
 BOS_political.3.t: "联邦式统一"
 BOS_political.3.d: "自治权的扩大导致混合社区出现管辖权重叠，并削弱了公共服务。各实体领导人已接受根据联邦协议达成的统一方案，该方案保留了地方代表权。"
 BOS_political.3.a: "重新统一联邦"
 BOS_political.5.t: "财政危机"
 BOS_political.5.d: "全球金融危机导致出口下降、信贷紧缩，并迫使波斯尼亚雇主裁员。经济复苏需要协调一致的财政和产业政策。"
 BOS_political.5.a: "制定复苏计划"
 BOS_political.6.t: "米洛拉德·多迪克"
 BOS_political.6.d: "米洛拉德·多迪克巩固了他在塞族共和国的领导地位，并将实体自治作为其政治纲领的核心。他日益壮大的关系网将使加强国家机构的任何努力都变得更加复杂。"
 BOS_political.6.a: "萨拉热窝必须作出回应"
 BOS_political.8.t: "种族隔离纠纷演变为暴力事件"
 BOS_political.8.d: "围绕塞族和波斯尼亚族学生融合问题的争议升级为游行示威，目标是市政议会。破坏行为和袭击返乡者经营的商铺迫使防暴警察介入。"
 BOS_political.8.a: "分歧依然很深。"
 BOS_political.9.t: "维和部队计划缩减兵力"
 BOS_political.9.d: "随着安全局势的改善，北约宣布减少其在波斯尼亚的维和部队规模。当地领导人对于本国部队是否已做好承担维和任务的准备存在分歧。"
 BOS_political.9.a: "评估我们的准备情况"
 BOS_political.10.t: "报告文件新闻攻击"
 BOS_political.10.d: "一份新的报告记录了2002年波斯尼亚记者遭受的威胁和袭击事件有所增加。民族主义组织和当地政治庇护者被认为是造成大部分恐吓行为的幕后黑手。"
 BOS_political.10.a: "保护独立报道"
 BOS_political.11.t: "尼科利奇被判处23年监禁"
 BOS_political.11.d: "法院判处波斯尼亚塞族军官德拉甘·尼科利奇23年监禁，罪名是他在苏希察拘留营犯下的罪行。这一判决再次引发了关于战时责任追究的政治争议。"
 BOS_political.11.a: "正义必须得到伸张"
 BOS_political.13.t: "难民返回人数创历史新高"
 BOS_political.13.d: "随着安全形势好转和房屋重建，越来越多的流离失所者返回家园。在战时紧张局势依然存在的社区，地方当局必须为返乡者提供服务并保护他们的安全。"
 BOS_political.13.a: "支持他们回归"
 BOS_political.14.t: "严寒袭击难民和返乡者"
 BOS_political.14.d: "严寒天气袭击了波斯尼亚和黑塞哥维那各地的难民和返乡者社区。当地机构和联合国正努力提供取暖燃料、住所和食物。"
 BOS_political.14.a: "调动紧急救援力量"
 BOS_political.15.t: "爆炸损坏了阿利亚·伊泽特贝戈维奇的坟墓"
 BOS_political.15.d: "一枚爆炸装置损毁了前总统阿利亚·伊泽特贝戈维奇在萨拉热窝的陵墓。此次袭击引发了公众的强烈愤慨，并再次引发了人们对政治暴力事件的担忧。"
 BOS_political.15.a: "调查此次袭击事件"
 BOS_political.17.t: "东南欧洪水"
 BOS_political.17.d: "创纪录的降雨导致波斯尼亚及其邻国多座城镇被淹，基础设施遭到破坏，并引发山体滑坡。紧急救援部门将面临长期的救援和重建工作。"
 BOS_political.17.a: "协调救灾工作"
 BOS_events.55.t: "阿利亚·伊泽特贝戈维奇逝世"
 BOS_events.55.d: "前总统阿阿利亚·伊泽特贝戈维奇因心脏病并发症去世。他的去世标志着波斯尼亚克族政治以及波斯尼亚和黑塞哥维那争取独立斗争中一个重要篇章的结束。"
 BOS_events.55.a: "缅怀他的遗志"
 BOS_events.55.b: "国家必须向前迈进。"
 BOS_political.21.t: "波斯尼亚要求提供保障独立"
 BOS_political.21.d: "[FROM.GetName]要求我们保证其独立性，因为欧盟驻波黑部队将安全责任移交给波斯尼亚机构。"
 BOS_political.21.a: "保障波斯尼亚独立"
 BOS_political.21.b: "拒绝承诺"
 BOS_political.22.t: "波斯尼亚提议联盟"
 BOS_political.22.d: "由塞族共和国领导的[FROM.GetName]政府已提议并入塞尔维亚。如果该提议被接受，波斯尼亚的领土和武装力量将移交给我国。"
 BOS_political.22.a: "批准同盟"
 BOS_political.22.b: "维护各国独立性"
 BOS_zivko_radisic: "日夫科·拉迪希奇"
 BOS_ante_jelavic: "安特·耶拉维奇"
 BOS_halid_genjac: "哈利德·真扎克"
 BOS_sulejman_tihic: "苏莱曼·蒂希奇"
 BOS_mirko_sarovic: "米尔科·沙罗维奇"
 BOS_dragan_covic: "德拉甘·乔维奇"
 BOS_haris_silajdzic: "哈里斯·西拉伊季奇"
 BOS_nebojsa_radmanovic: "内博伊沙·拉德马诺维奇"
 BOS_zeljko_komsic: "泽利科·科姆希奇"
 BOS_bosnia_random: "一位新的波斯尼亚克族代表将担任轮值主席。"
 BOS_serb_random: "一位新的塞族代表将担任轮值主席。"
 BOS_croat_random: "一位新的克罗地亚族代表将担任轮值主席。"
 BOS_events.45.a: "开启谈判"
 BOS_events.45.d: "公共部门雇员也加入了劳工动荡的行列，要求获得可靠的工资、集体谈判权，并停止任人唯亲的任命制度。"
 BOS_events.45.t: "公共部门罢工"
 BOS_events.46.a: "这场运动正在蔓延"
 BOS_events.46.d: "随着工会跨越组织界限协调诉求，示威活动已从工作场所扩展到市中心。"
 BOS_events.46.t: "全国劳工抗议活动"
 BOS_events.47.a: "保护公共机构"
 BOS_events.47.d: "政府大楼外发生的冲突已演变为暴力事件。工会领导人指责挑衅者，而安全官员则要求获得紧急权力。"
 BOS_events.47.t: "抗议活动演变为暴力事件"
 BOS_events.48.a: "承认新政府"
 BOS_events.48.d: "原联合政府已失去对议会的控制权。一个由工人阶级支持的内阁现在声称拥有重组国家和经济的权力。"
 BOS_events.48.t: "工人进入政府"
 BOS_eu_accession: "加入欧盟"
 BOS_eu_accession_desc: "加入联邦需要逐章完成谈判。每一步都需要三个组成团体全部同意，而塞族共和国领导层一旦态度转变，便可阻挠进程。"
 BOS_eu_judicial_reform: "结束司法章节"
 BOS_eu_judicial_reform_desc: "使法院程序、上诉审查和检察官独立性与欧盟入盟标准保持一致。"
 BOS_eu_anti_corruption_commitments: "采纳反腐败承诺"
 BOS_eu_anti_corruption_commitments_desc: "承诺遵守欧盟监督的反腐败基准。只要国家权力被严重攫取，布鲁塞尔就不会开启这一篇章。"
 BOS_eu_market_alignment: "与单一市场保持一致"
 BOS_eu_market_alignment_desc: "采纳欧盟产品标准、海关程序和竞争规则。合规成本高昂，但可以解锁入盟前资金。"
 BOS_eu_candidate_status: "确保候选国资格"
 BOS_eu_candidate_status_desc: "请愿欧洲理事会承认波斯尼亚和黑塞哥维那为正式成员国候选国。"
 BOS_eu_open_negotiations: "开始入盟谈判"
 BOS_eu_open_negotiations_desc: "正式启动与欧盟委员会的入盟谈判。随着国家层面义务的增加，预计巴尼亚卢卡方面会持抵制态度。"
 BOS_eu_sign_accession_treaty: "签署加入条约"
 BOS_eu_sign_accession_treaty_desc: "完成谈判并签署加入条约。但成为欧盟成员国仍需向欧盟提交正式申请。"
 BOS_treasury_5_tt: "国库余额至少为£treasury 5.0"
 BOS_treasury_2_tt: "国库余额至少为£treasury 2.0"
 BOS_judiciary_meets_eu_standards_tt: "司法部门符合欧盟入盟标准"
 BOS_anti_corruption_framework_tt: "欧盟已建立反腐败框架。"
 BOS_market_aligned_with_eu_tt: "国内监管与单一市场保持一致"
 BOS_recognized_eu_candidate_tt: "波斯尼亚和黑塞哥维那成为欧盟正式候选国"
 BOS_eu_application_open_tt: "波斯尼亚和黑塞哥维那现在可以申请加入欧盟"
 BOS_economic_development: "经济发展"
 BOS_economic_development_desc: "外国资助的投资、私有化和战后经济重建计划。\n实体层面的庇护网络控制着人事任命、合同签订以及大部分经济活动。瓦解这些网络既缓慢又会激怒那些从中获利的群体。"
 BOS_court_turkish_investment: "争取土耳其投资"
 BOS_court_turkish_investment_desc: "向土耳其建筑公司和银行敞开大门。安卡拉的资金涌入，随之而来的是土耳其对萨拉热窝的影响力。"
 BOS_court_gulf_investment: "争取海湾投资"
 BOS_court_gulf_investment_desc: "吸引海湾地区的资金流入房地产、旅游和金融领域。这笔资金能够提振国库，稳定市场情绪，并提升利雅得在波斯尼亚的地位。"
 BOS_rapid_privatization: "迅速私有化"
 BOS_rapid_privatization_desc: "迅速将国有企业出售给任何愿意购买的人。这些出售虽然充实了国库并提高了产量，但这种低价交易却助长了腐败，并扰乱了员工的稳定。"
 BOS_transparent_privatization: "透明私有化"
 BOS_transparent_privatization_desc: "通过经过审计的公开招标出售国有企业。虽然收益较小，流程也较慢，但贪污腐败得以减少，公众信任得以维护。"
 BOS_thermal_plant_chinese_financing: "中国投资建设的热电厂"
 BOS_thermal_plant_chinese_financing_desc: "向中国贷款扩建褐煤电站。产量立即提升，但随之而来的是巨额债务和北京的影响力。"
 BOS_hydro_refurbishment: "翻新水力发电厂"
 BOS_hydro_refurbishment_desc: "对内雷特瓦河和德里纳河上的老旧水坝和涡轮机进行全面检修。前期投入确实不小，但可靠的电力供应能够保障工业稳定。"
 BOS_end_brcko_supervision: "结束布尔奇科监管"
 BOS_end_brcko_supervision_desc: "逐步取消对布尔奇科区的国际监管机制，将其完全移交给地方机构。塞族共和国将立即对新安排进行测试。"
 BOS_police_restructuring: "重组警察"
 BOS_police_restructuring_desc: "将分散的实体警察系统整合到国家框架下，这是欧盟加强联系的先决条件。塞族共和国对失去控制权感到不满。"
 BOS_anti_corruption_investigations: "反腐调查"
 BOS_anti_corruption_investigations_desc: "直接动用国家检察官打击根深蒂固的裙带关系网络。腐败现象会减少，但那些官员被起诉的利益集团会越来越不满。"
 BOS_judicial_appointments: "司法任命去政治化"
 BOS_judicial_appointments_desc: "将司法任命的控制权从政党领导层移交给独立委员会。"
 BOS_depoliticized_judiciary_tt: "司法任命不受政党控制"
 BOS_public_procurement_reform: "公共采购改革"
 BOS_public_procurement_reform_desc: "政府合同应实行公开招标。出版书籍需要前期投入资金，而且会终结一些原本舒适的安排。"
 BOS_transparent_procurement_tt: "国家合同通过公开招标授予。"
 BOS_diaspora_investment_drive: "侨民投资驱动"
 BOS_diaspora_investment_drive_desc: "邀请海外侨民商业协会共同出资建设公共项目，并向海外储户发行一次性债券。"
 BOS_dual_citizenship_outreach: "双重国籍宣传推广"
 BOS_dual_citizenship_outreach_desc: "简化双重国籍申请程序和领事登记，使移民能够与祖国保持正式联系。登记在册的侨民越多，汇回国内的资金就越多。"
 BOS_expanded_dual_citizenship_tt: "侨汇收入增长20%"
 BOS_diaspora_return_program: "侨民返乡计划"
 BOS_diaspora_return_program_desc: "为从国外返回的家庭提供安置补助和就业安置。这笔费用不菲，但国家更需要的是人，而不是钱。"
 BOS_treasury_1_tt: "国库余额至少为£treasury 1.0"
 BOS_dayton_pressure: "代顿压力之下"
 BOS_dayton_pressure_desc: "塞族共和国正在挑战国家机构并威胁脱离波黑。萨拉热窝可以选择让步，请求欧盟高级代表强制执行和解，或者寻求国际仲裁。"
 BOS_concede_to_srpska_demands: "满足实体的要求"
 BOS_concede_to_srpska_demands_desc: "将有争议的权力归还给塞族共和国。危机结束，但代价是中央权威的丧失。"
 BOS_invoke_bonn_powers: "援引波恩力量"
 BOS_invoke_bonn_powers_desc: "要求高级代表实施有争议的立法并罢免阻碍的官员。有效，但在巴尼亚卢卡深感不满。"
 BOS_request_international_arbitration: "请求国际仲裁"
 BOS_request_international_arbitration_desc: "将争端提交国际仲裁。虽然耗时耗力，但可以结束僵局，而且不会让任何一方获益。"
 BOS_phase_out_ohr_supervision: "逐步取消高级代表办事处监管"
 BOS_phase_out_ohr_supervision_desc: "在实体关系稳定的情况下，协商将高级代表办事处的剩余权力移交给国内机构。"
 BOS_dayton_pressure_decisions_available_tt: "代顿压力下决议中提供了危机应对措施。"
 BOS_eu_candidate: "欧盟候选国资格"
 BOS_eu_candidate_desc: "候选国地位使波斯尼亚和黑塞哥维那获得了正式的成员国资格、定期进展报告以及与成员国建立更便捷的关系。"
 BOS_eu_negotiations: "欧盟入盟谈判"
 BOS_eu_negotiations_desc: "入盟章节开放，欧盟技术援助流入国家机构，加快行政和基础设施建设工作。"
 BOS_eu_accession_treaty: "欧盟入盟条约签署"
 BOS_eu_accession_treaty_desc: "加入条约已签署，批准程序正在进行中。市场对成员国地位的认可已成定局，国家机器的运作也方向明确。"
 BOS_eu_accession_funds: "加入前援助"
 BOS_eu_accession_funds_desc: "加入前援助工具为基础设施、行政能力和降低国家借贷成本提供资金。"
 BOS_republika_srpska_secession_crisis: "分离危机"
 BOS_republika_srpska_secession_crisis_desc: "塞族共和国正在抵制国家机构，并准备举行全民公投。外国支持者们在僵局持续之际，伺机寻找机会。"
 BOS_ohr_supervision: "高级代表办事处监管"
 BOS_ohr_supervision_desc: "高级代表办事处直接行使《波恩条约》赋予的权力。强制执行的法令维持了国家的正常运转，但却架空了民选机构。"
 BOS_national_reconciliation: "民族和解"
 BOS_national_reconciliation_desc: "这三个组成团体都支持国家政府。跨团体合作是常态而非例外。"
 BOS_political.24.t: "候选国资格已授予"
 BOS_political.24.d: "欧洲理事会已正式承认波斯尼亚和黑塞哥维那为欧盟候选国。这一决定是对该国多年改革的肯定，并要求布鲁塞尔每年汇报其进展情况。"
 BOS_political.24.a: "欧洲的未来"
 BOS_political.25.t: "巴尼亚卢卡阻挠谈判"
 BOS_political.25.d: "塞族共和国代表已退出国家议会，拒绝批准谈判框架，除非实体权限得到书面保证。"
 BOS_political.25.a: "协商他们的回归"
 BOS_political.25.b: "在没有它们的情况下批准"
 BOS_political.26.t: "采购丑闻爆发"
 BOS_political.26.d: "记者公布的合同显示，高级官员与操纵公共招标活动有着千丝万缕的联系。该关系网涉及多个部委、国有企业，以及至少一个执政党。"
 BOS_political.26.a: "对犯罪团伙网络提起诉讼"
 BOS_political.26.b: "封杀消息"
 BOS_political.27.t: "塞族共和国威胁分裂国家"
 BOS_political.27.d: "巴尼亚卢卡实体大会已安排就退出国家机构进行投票，其领导层正在公开讨论举行独立公投。"
 BOS_political.27.a: "国家必须作出回应"
 BOS_political.28.t: "对峙加剧"
 BOS_political.28.d: "数月的抵制行动仍未达成任何协议。如今，各实体机构的运作方式仿佛国家权力可有可无，各方温和派都失去了阵地。"
 BOS_political.28.a: "一个危险的先例"
 BOS_diaspora_remittances: "侨汇"
 BOS_diaspora_remittances_desc: "波斯尼亚人在海外工作后寄回家的钱大约占该国GDP的十分之一。这些钱惠及全国各地的家庭，包括那些国家预算从未覆盖到的地区。"
 BOS_diaspora_returnees: "返回的侨民"
 BOS_diaspora_returnees_desc: "安置补助金正帮助许多家庭从德国、奥地利和斯堪的纳维亚半岛返回家园。他们带着积蓄、技能和孩子来到这里。"
 BOS_nato_interoperability: "北约互操作性"
 BOS_nato_interoperability_desc: "联合演习、联盟标准和和平伙伴关系计划正在按照西方模式重建武装部队。"
 BOS_political.29.t: "海外侨胞的钱回流"
 BOS_political.29.d: "此次投资活动已圆满结束，来自欧洲和北美各地侨民企业主的承诺投资已全部落实。虽然按国际标准衡量，这些投资金额并不算多，但它们却流向了外国投资者往往忽略的地区。"
 BOS_political.29.a: "好消息"
 BOS_political.30.t: "卡拉季奇已被拘留"
 BOS_political.30.d: "来自贝尔格莱德的消息在一小时内传遍了萨拉热窝。波斯尼亚塞族战时领导人拉多万·卡拉季奇已被逮捕，面临被移送至海牙。从萨拉热窝到斯雷布雷尼察，幸存者协会和遇难者家属们聚集在一起，举行静默的守夜活动。在巴尼亚卢卡，气氛则更加沉重。"
 BOS_political.30.a: "晚了十三年"
 BOS_political.31.t: "姆拉迪奇已被拘留"
 BOS_political.31.d: "实施斯雷布雷尼察大屠杀的军队指挥官拉特科·姆拉迪奇在塞尔维亚北部的一座农舍被捕。对于斯雷布雷尼察的母亲们来说，这次逮捕结束了十六年的等待。跨越实体间边界线，有些人仍然称他为防御者。"
 BOS_political.31.a: "正义抵达拉扎列沃"
 BOS_political.32.t: "塞伊迪奇-芬奇裁决"
 BOS_political.32.d: "欧洲人权法院裁定，克罗地亚宪法的族裔资格规定违反了《欧洲人权公约》。罗姆人活动家德尔沃·塞伊迪奇和犹太社区领袖雅各布·芬奇因不属于克罗地亚三大组成民族中的任何一个，而无法竞选总统。克罗地亚各政党补充说，目前的安排允许其他人替他们选举总统候选人。执行这项裁决需要修改宪法，但没有人愿意就此进行谈判。"
 BOS_political.32.a: "修改代顿案说起来容易做起来难"
 BOS_sejdic_finci_ruling_tt: "§Y斯特拉斯堡的裁决违反了宪法中的种族资格规定。针对该裁决的司法改革将在布鲁塞尔具有举足轻重的地位。§!"
 BOS_sejdic_finci_addressed_tt: "§G这项改革回应了塞伊迪奇-芬奇裁决，满足了布鲁塞尔方面长期以来的要求。§!"
 BOS_serbia_reaction_tt: "塞尔维亚将决定是否支持塞族共和国。"
 BOS_croatia_reaction_tt: "克罗地亚将决定是否支持黑塞哥维那。"
 BOS_political.33.t: "欧洲联盟军接手"
 BOS_political.33.d: "在布特米尔营地举行的仪式上，北约领导的驻波黑稳定部队正式将其任务移交给欧盟。木槿花行动根据《柏林+》协议接管了驻波黑稳定部队的部队、基地和授权。对大多数波斯尼亚人来说，唯一可见的变化是袖子上的国旗。"
 BOS_political.33.a: "布特米尔的旗帜变换。"
 BOS_political.34.t: "战后首次人口普查"
 BOS_political.34.d: "自1991年以来，人口普查员已开始进行首次人口普查。所有关于种族、语言和信仰的问题都存在争议，塞族共和国已宣布不会接受现有的海外公民统计方法。表格背后隐藏着一个无人公开提出的问题：究竟谁还留在这里？"
 BOS_political.34.a: "清点留下的人群"
 BOS_political.35.t: "图兹拉正在燃烧"
 BOS_political.35.d: "始于图兹拉破产工厂外的抗议活动已蔓延至萨拉热窝、泽尼察和莫斯塔尔。政府大楼燃起熊熊大火，人群不再高喊民族口号，而是要求提供就业机会并追究私有化欺诈的责任。公民大会正在筹备中，以便直接向州政府提出诉求。"
 BOS_political.35.a: "满足全体会议的要求"
 BOS_political.35.b: "首先恢复秩序"
 BOS_political.36.t: "申请已在布鲁塞尔提交"
 BOS_political.36.d: "部长会议主席已将波黑加入欧盟的申请递交给荷兰担任欧盟轮值主席国。在获得候选国地位之前，波黑还需要经历多年的适应过程，但这份申请至少在纸面上使各级政府朝着同一个方向努力。"
 BOS_political.36.a: "路会很长。"
 BOS_political.37.t: "高级代表办事处禁止否认种族灭绝"
 BOS_political.37.d: "即将撤销的高级代表办事处在其任期最后阶段，对否认斯雷布雷尼察大屠杀和美化战争罪犯的行为处以刑事处罚。巴尼亚卢卡顿时沸腾起来。各实体领导人宣布该决定无效，并宣布抵制国家机构，公开表示要收回代顿拱手让出的权力。"
 BOS_political.37.a: "法律适用于所有人。"
 BOS_political.37.b: "不要让国家介入。"
 BOS_political.38.t: "巴尼亚卢卡投票决定退出"
 BOS_political.38.d: "实体大会已指示其政府在六个月内将塞族共和国从国家军队、税务机关和司法机构中撤出。这些结论目前只是宣言式的，但它们以直白的语言描绘了走向解体的道路。各国大使馆正在起草声明，而《代顿协议》的担保方则被问及该协议的剩余价值。"
 BOS_political.38.a: "去找担保人。"
 BOS_political.38.b: "等待巴尼亚卢卡眨眼"
 BOS_political.40.t: "科索沃宣布独立"
 BOS_political.40.d: "普里什蒂纳宣布脱离塞尔维亚独立。这一声明导致波斯尼亚分裂：波斯尼亚族和克罗地亚族领导人倾向于承认塞尔维亚独立，而塞族共和国则警告说，这将为其自身分裂开创先例。"
 BOS_political.40.a: "为自决发声"
 BOS_political.40.b: "拒绝单方面声明"
 BOS_political.40.c: "保持中立以维护国家团结"
 BOS_political.41.t: "移民在乌纳萨纳聚集"
 BOS_political.41.d: "数千名沿西巴尔干路线迁徙的难民滞留在克罗地亚边境附近。乌纳-萨纳州当局表示，难民营人满为患，他们无力独自应对。"
 BOS_political.41.a: "请求欧盟援助"
 BOS_political.41.b: "加强边境管控，清除难民营"
 BOS_political.42.t: "与欧洲的联系国协定"
 BOS_political.42.d: "波斯尼亚和黑塞哥维那已与欧盟签署《稳定与联系协议》。这是迈向欧盟成员国漫长道路上的第一步。"
 BOS_political.42.a: "迈向欧洲的里程碑"
 BOS_political.43.t: "州增值税"
 BOS_political.43.d: "单一的州级增值税取代了以往分散的实体销售税。增值税征收集中化，税收收入通过一个国家账户进行分配。"
 BOS_political.43.a: "实施统一税制"
 BOS_political.43.b: "让各实体自行决定利率。"
 BOS_political.44.t: "四月方案"
 BOS_political.44.d: "一套经协商通过的宪法修正案将加强中央政府权力并精简总统职权。该修正案在众议院还差两票才能获得通过。"
 BOS_political.44.a: "投入资金推动改革"
 BOS_political.44.b: "让方案失败"
 BOS_political.45.t: "布特米尔会谈"
 BOS_political.45.d: "美国和欧洲的调解员已将各党派领导人召集到萨拉热窝附近的一个基地，以打破宪法僵局。这些提议要求各实体将权力移交给国家。"
 BOS_political.45.a: "与调解员进行沟通"
 BOS_political.45.b: "捍卫实体特权"
 BOS_political.46.t: "布尔奇科区问题"
 BOS_political.46.d: "塞族共和国威胁要将其官员撤出布尔奇科区（战后置于国家监管之下的自治走廊）的共享机构。"
 BOS_political.46.a: "捍卫该地区的共同地位"
 BOS_political.46.b: "为了维护和平而做出让步"
 BOS_political.47.t: "莫斯塔尔无政府状态"
 BOS_political.47.d: "克罗地亚族和波斯尼亚族政党无​​法就城市章程达成一致，莫斯塔尔多年来一直没有举行有效的本地选举。这座分裂的城市在没有议会的情况下继续运转。"
 BOS_political.47.a: "制定统一的城市法规"
 BOS_political.47.b: "就让双方继续对峙吧。"
 BOS_political.48.t: "大迁徙加速"
 BOS_political.48.d: "从萨拉热窝、图兹拉和巴尼亚卢卡出发的巴士和廉价航班都满载而归。年轻的毕业生、技工和举家迁往德国、奥地利和克罗地亚的速度远远超过了政府的补充能力。"
 BOS_political.48.a: "委托撰写一份关于原因的报告"
 BOS_political.48.b: "将其视为欧盟时代普通的流动性而忽略不计。"
 BOS_political.49.t: "科姆希奇赢得克罗地亚席位"
 BOS_political.49.d: "泽利科·科姆希奇凭借波斯尼亚克族选民的多数票赢得了克罗地亚族总统席位，击败了克罗地亚民主联盟的德拉甘·乔维奇。克罗地亚族占多数的城镇宣布不欢迎他，萨格勒布也对这一连其克罗地亚族群都无法接受的选举结果表示抗议。"
 BOS_political.49.a: "一个多民族的授权，公平赢得的"
 BOS_political.49.b: "克罗地亚族选民投票失败，没有代表权。"
 BOS_political.50.t: "北约计划僵局"
 BOS_political.50.d: "独立社会民主人士联盟部长们拒绝让国家向北约提交年度国家计划，而没有年度国家计划，部长会议就无法组建。几个月过去了，政府仍然处于无政府状态。"
 BOS_political.50.a: "无论如何都要提交程序。"
 BOS_political.50.b: "改为提出一个重新命名的改革方案"
 BOS_political.51.t: "最终，政府成立"
 BOS_political.51.d: "选举十四个月后，部长会议宣誓就职。萨拉热窝再次组建了政府，但这个政府的组建是以一个双方都不完全满意的、勉强维持体面的妥协方案换来的。"
 BOS_political.51.a: "重返工作"
 BOS_political.52.t: "没有授权的高级代表"
 BOS_political.52.d: "克里斯蒂安·施密特已就任联合国高级代表，但联合国安理会从未批准他的任命。俄罗斯、中国和塞族共和国领导人抓住这一漏洞，称其权力不合法。"
 BOS_political.52.a: "萨拉热窝一切如常"
 BOS_political.53.t: "通过投票箱推行的改革"
 BOS_political.53.d: "投票结束后，高级代表利用其在波恩条约中赋予的权力，强行修改了联邦宪法和选举法，扩大了人民院的规模，并设定了组建政府的最后期限。批评人士称其为强加的宪法；克罗地亚民主联盟则认为这部宪法姗姗来迟。"
 BOS_political.53.a: "然而，这却是一个务实的解决方案。"
 BOS_political.53.b: "不自由的过度扩张"
 BOS_political.53.c: "不要卷入争论。"
 BOS_political.54.t: "巴尼亚卢卡宣布裁决无效"
 BOS_political.54.d: "该实体议会通过法律，宣布国家宪法法院的裁决不适用于塞族共和国，并禁止在该实体的官方公报上公布高级代表的决定。萨拉热窝的权力如今止步于实体间边界线。"
 BOS_political.54.a: "通过所有可用渠道提出异议"
 BOS_political.54.b: "让这一刻过去"
 BOS_hr_legitimacy_disputed_tt: "§R塞族共和国视欧盟高级代表的决定无效，加剧了危机。§!"
 BOS_political.55.t: "布鲁塞尔开启谈判"
 BOS_political.55.d: "在波斯尼亚提出申请八年后，欧洲理事会同意启动入盟谈判。虽然入盟之路依然漫长，但这一次，谈判终于进入布鲁塞尔，而非只能呆在外围。"
 BOS_political.55.a: "庆祝这一里程碑"
 BOS_political.55.b: "节制庆祝活动"
 BOS_political.57.t: "多迪克被定罪并被禁止担任公职"
 BOS_political.57.d: "波黑法院裁定米洛拉德·多迪克藐视高级代表的决定，并禁止其担任公职。塞族共和国各机构必须决定是否接受该裁决。"
 BOS_political.57.a: "裁决维持不变"
 BOS_political.57.b: "塞族共和国不会被告知谁领导了这一切"
 BOS_reject_third_entity_demand: "拒绝第三实体要求"
 BOS_reject_third_entity_demand_desc: "排除将联邦重组为一个独立的克罗地亚族占多数的实体的可能性。波斯尼亚克族政党松了一口气；克罗地亚族政党则认为这证明萨拉热窝永远不会听取他们的意见。"
 BOS_concede_partial_croat_autonomy: "承认克罗地亚族部分自治权"
 BOS_concede_partial_croat_autonomy_desc: "赋予克罗地亚族占多数的各州更大的自治权，但并未建立完整的第三实体。这回应了克罗地亚国家议会的核心诉求，但代价是需要增加一个政府层级进行协调。"
 BOS_register_defence_property: "将国防财产登记为国有财产"
 BOS_register_defence_property_desc: "将各实体仍声称拥有主权的军事基地移交给国家，这是北约启动成员国行动计划的前提条件。"
 BOS_request_nato_waiver: "申请北约豁免"
 BOS_request_nato_waiver_desc: "与其等待塞族共和国的同意，不如直接要求北约放弃对国防财产的限制。这样做行之有效，而且巴尼亚卢卡也不会忘记是谁提出的要求。"
 BOS_activate_map: "激活成员国行动计划"
 BOS_activate_map_desc: "财产问题解决后，着手制定北约成员国行动计划，并开始正式的入盟程序。"
 BOS_expand_arms_exports: "扩大弹药和武器出口"
 BOS_expand_arms_exports_desc: "支持那些与国家有关联的军火工厂扩大对欧洲及其他地区买家的出口。订单已经排满，而关于这些货物最终流向何处的争论也愈演愈烈。"
 BOS_gulf_investment_delivered_tt: "§G布罗伊奥宗按计划破土动工§!"
 BOS_gulf_investment_stalled_tt: "§R布罗伊奥宗的进展远未达到预期目标§!"
 BOS_host_sarajevo_film_festival: "举办萨拉热窝电影节"
 BOS_host_sarajevo_film_festival_desc: "为东南欧最大的电影节提供国家资金和后勤支持。它每年夏天都吸引游客和媒体来到萨拉热窝，使这座城市的文化形象远超周边城市。"
 BOS_federation_development_grant: "联邦发展补助金"
 BOS_federation_development_grant_desc: "将国库资金投入到波斯尼亚克族占多数的联邦各州的基建项目中。波斯尼亚克族社群对这项投资表示欢迎，但塞族共和国则认为这是偏袒。"
 BOS_herzegovina_development_grant: "黑塞哥维那发展补助金"
 BOS_herzegovina_development_grant_desc: "为克罗地亚族占多数的黑塞哥维那修建道路和公共设施提供资金。克罗地亚族领导人将其视为一种承认，而波斯尼亚族人则对流向民族主义据点的资金感到不满。"
 BOS_srpska_development_grant: "塞族共和国发展补助金"
 BOS_srpska_development_grant_desc: "将国库资金直接投入塞族共和国的基础设施建设。此举能博得塞尔维亚人的好感，但波斯尼亚人却对奖励这个不断威胁要离开的实体感到愤怒。"
 BOS_croat_grievance: "克罗地亚族政治不满"
 BOS_croat_grievance_desc: "克罗地亚族各政党表示，总统职位上的克罗地亚族席位是由波斯尼亚族的选票决定的，而不是由克罗地亚族的选票决定的，他们要求建立一个不会被族群外部力量否决的选举制度。"
 BOS_third_entity_demand: "联邦重组"
 BOS_third_entity_demand_desc: "克罗地亚族占多数的各州享有更大的自治权，但代价是国家机器的运作变得更加复杂。"
 BOS_contested_high_representative: "高级代表的争议授权"
 BOS_contested_high_representative_desc: "高级代表未经联合国安理会批准便就职。塞族共和国将这一空白视为无视其裁决的通行证，如今，任何动用《波恩条约》赋予的权力都会引发一场合法性之争以及一场政策之争。"
 BOS_map_participant: "北约成员国行动计划"
 BOS_map_participant_desc: "根据成员资格行动计划，波斯尼亚军官与北约同行一起接受训练和制定计划，这是最终加入北约的正式途径。"
 BOS_arms_export_boom: "武器出口激增"
 BOS_arms_export_boom_desc: "与国家有关联的军火工厂正满负荷运转，以满足北约和华约两大级别的订单需求。国库因此受益，而关于这些武器究竟流向何方的争论也愈演愈烈。"
 BOS_brain_drain_1: "大规模移民"
 BOS_brain_drain_1_desc: "自免签旅行时代开始以来，已有数十万人离开，其中受过良好教育的年轻人占了很大比例。教室、诊所和工厂车间都感受到了这种人才流失的影响。"
 BOS_brain_drain_eased_tt: "§G返乡家庭正在缓解大规模移民问题。§!"
 BOS_economic_reconstruction: "重建经济"
 BOS_economic_reconstruction_desc: "战后波斯尼亚的重建工作从未真正完成。一代人过去了，这个国家仍然需要一个连贯的经济规划，而不是零散的私有化和零散的外国贷款。"
 BOS_reform_agenda_adoption: "采纳改革议程"
 BOS_reform_agenda_adoption_desc: "承诺执行欧盟设定的社会经济改革方案，以此作为重启入盟程序的条件。一旦布鲁塞尔方面能够拿出正式方案，司法和市场改革的进程就会加快。"
 BOS_growth_plan_negotiations: "协商增长计划"
 BOS_growth_plan_negotiations_desc: "就动用欧盟改革与增长基金展开公开谈判。资金是实实在在的，但附加条件也同样严峻。"
 BOS_corridor_vc_northern_construction: "建设北部走廊"
 BOS_corridor_vc_northern_construction_desc: "加快推进途经多博伊、泽尼察和萨拉热窝的第五走廊建设。这是战后该国最大的基础设施项目，资金主要来自布鲁塞尔。"
 BOS_corridor_vc_southern_construction: "向南延伸走廊"
 BOS_corridor_vc_southern_construction_desc: "继续修建通往莫斯塔尔的高速公路，缩小联邦工业区北部与其面向亚得里亚海的南部之间的差距。"
 BOS_corridor_vc_opening: "泛欧5C号走廊启用"
 BOS_corridor_vc_opening_desc: "为从匈牙利边境到普洛切港的这条已竣工路线剪彩。这是欧盟资助的二十年发展项目最显著的成果。"
 BOS_east_energy_partnership: "吸引中国能源投资"
 BOS_east_energy_partnership_desc: "依靠中国政府贷款和承包商来维持该国燃煤电厂的运转和扩张，哪怕这会损害欧盟的入盟进程也在所不惜。"
 BOS_west_energy_partnership: "能源政策与欧盟保持一致"
 BOS_west_energy_partnership_desc: "引导投资流向水力发电和欧盟资助的电网升级，而不是新的煤炭产能，使能源行业符合欧洲国家援助规则。"
 BOS_defense_industry_revival: "恢复国防工厂"
 BOS_defense_industry_revival_desc: "国家应支持伊格曼·科尼奇和尤尼斯·吉内克斯这两家弹药厂，它们曾经为南斯拉夫一半的地区提供弹药，但现在产能远未达到饱和。"
 BOS_arms_industry_capacity_expansion: "扩大产能"
 BOS_arms_industry_capacity_expansion_desc: "改造军工厂，使其能够同时生产北约和华约口径的弹药，这种组合使得波斯尼亚的弹药几乎可以在任何地方销售。"
 BOS_defense_export_drive: "追逐出口繁荣"
 BOS_defense_export_drive_desc: "支持这些工厂扩大生产规模，以满足海外需求复苏带来的出口市场需求。订单已经排满，而且还在不断增加。"
 BOS_national_jobs_program: "启动国家就业计划"
 BOS_national_jobs_program_desc: "为国内创造就业机会和培训提供资金，让自免签时代开始以来离开的数十万人有理由考虑留下或回来。"
 BOS_youth_retention_initiative: "投资于青年人才保留"
 BOS_youth_retention_initiative_desc: "扩大就业计划，提供补助金和住房支持，重点面向构成人口外流主体的年轻毕业生和技术工人。"
 BOS_brain_drain_reversed_tt: "§G大规模移民问题已得到解决。§!"
 BOS_corridor_vc_trade_boost: "泛欧5C号走廊开放"
 BOS_corridor_vc_trade_boost_desc: "这条高速公路的建成缩短了全国乃至亚得里亚海沿岸的货运时间，促进了与欧洲其他地区的贸易往来。"
 BOS_defense_industrial_base: "重振国防工业基础"
 BOS_defense_industrial_base_desc: "科尼茨伊格曼和尤尼斯吉内克斯的产能已接近其原有水平，但额外的产量仍然与民用产品争夺同一工厂的生产资源。"
 BOS_jobs_program_idea: "国家就业计划"
 BOS_jobs_program_idea_desc: "政府资助的就业创造让工人们有理由留下来，而不是去排队等候前往德国的巴士。"
 BOS_youth_retention_idea: "青年留任补助金"
 BOS_youth_retention_idea_desc: "针对年轻毕业生的住房和职业补助金，使其中一些人能够留在该国足够长的时间，在这里组建家庭和发展事业。"
 BOS_mostar_industrial_decline: "莫斯塔尔冶炼厂关闭"
 BOS_mostar_industrial_decline_desc: "这家曾经是联邦最大电力消耗企业的铝厂如今已停产，莫斯塔尔的经济也因此损失了数千个工作岗位，而这些岗位至今仍未得到填补。"
 BOS_mostar_industrial_revival: "莫斯塔尔迎来新管理层"
 BOS_mostar_industrial_revival_desc: "一位战略投资者接管了莫斯塔尔冶炼厂的运营，以降低但可行的产能重启了生产。"
 BOS_zenica_industrial_decline: "泽尼卡钢铁厂停产"
 BOS_zenica_industrial_decline_desc: "支撑泽尼察经济一个多世纪的炼铁炉已经熄火，该地区正在承受数千个工作岗位流失的打击。"
 BOS_zenica_industrial_revival: "泽尼察迎来新东家"
 BOS_zenica_industrial_revival_desc: "泽尼察钢铁厂已被买家收购，部分原员工在新管理层的领导下继续工作。"
 BOS_eu_growth_plan_tranche: "制定欧盟增长计划分阶段方案"
 BOS_eu_growth_plan_tranche_desc: "向欧盟改革与增长基金申请下一笔拨款。如果腐败程度超过阈值，或者政府过于不稳定而无法进行谈判，则将失去这笔款项。"
 BOS_political.58.t: "莫斯塔尔冶炼厂停产"
 BOS_political.58.d: "莫斯塔尔铝业公司是联邦最大的电力用户，由于拖欠电力公司数亿欧元的债务，已被断电。嘉能可几个月前放弃了收购计划，而像这样规模的冶炼厂在全面停产后重新启动可能根本无法实现。"
 BOS_political.58.a: "关闭工厂"
 BOS_political.58.b: "吸引战略投资者"
 BOS_political.59.t: "泽尼卡的炼铁炉冷却了"
 BOS_political.59.d: "安赛乐米塔尔已关闭其位于泽尼察钢铁厂的高炉，该厂一个多世纪以来一直是该镇经济的支柱。欧洲需求疲软和能源成本高企导致该生产线无利可图。"
 BOS_political.59.a: "让炉子熄灭吧"
 BOS_political.59.b: "寻找新主人"
 BOS_political.60.t: "图兹拉7号街区坠落"
 BOS_political.60.d: "中国投资的图兹拉褐煤项目已正式宣告终止。多年前，政府为该项目提供的贷款担保就违反了欧盟国家援助规则，而政府最终证实了布鲁塞尔此前的说法。中国葛洲坝集团则坚持要求履行合同。"
 BOS_political.60.a: "接受取消"
 BOS_political.60.b: "对终止提出异议"
 BOS_political.61.t: "自由前往欧洲旅行"
 BOS_political.61.d: "欧盟已取消对波斯尼亚生物识别护照持有者的短期申根签证。自战争以来，进入欧盟首次只需在边境出示护照即可。"
 BOS_political.61.a: "庆祝这一里程碑"
 BOS_political.61.b: "警告：这条路通向何方"
 BOS_visa_era_emigration_tt: "§Y免签前往欧盟使得离开欧盟比以往任何时候都更加容易。§!"
 BOS_political.62.t: "2010年大选的公民时刻"
 BOS_political.62.d: "兹拉特科·拉古姆季亚领导的波黑社会民主党自战争以来首次在联邦选举中获胜，而米洛拉德·多迪克领导的独立社会民主人士联盟则横扫塞族共和国。现在，六个政党必须组建一个任何一方都无法独占的政府。"
 BOS_political.62.a: "巩固公民突破成果"
 BOS_political.62.b: "让各方坚守阵地"
 BOS_political.63.t: "迟到十六个月的执政联盟"
 BOS_political.63.d: "大选结束十六个月后，由六个政党组成的联合政府终于组建了部长会议。而这期间的大部分时间都花在了确定部长会议主席人选上。"
 BOS_political.63.a: "回归治理"
 BOS_paralysis_lifted_tt: "§G政府组建瘫痪问题已得到解决。§!"
 BOS_political.64.t: "民族主义者的回归"
 BOS_political.64.d: "波黑民主行动党重新夺回联邦第一大党地位，德拉甘·乔维奇继续担任克罗地亚族主席，多迪克则勉强保住了塞族共和国的席位。2010年的多民族实验几乎彻底失败。"
 BOS_political.64.a: "旧集团回归是有原因的"
 BOS_political.64.b: "再试一次民众路线"
 BOS_political.65.t: "莫斯塔尔再次投票"
 BOS_political.65.d: "在欧洲法院裁决迫使萨拉热窝采取行动，伊泽特贝戈维奇和乔维奇制定新的城市章程后，莫斯塔尔举行了十二年来的首次地方选举。这座分裂的城市终于拥有了民选的市议会。"
 BOS_political.65.a: "这座城市的新使命"
 BOS_political.65.b: "脆弱的休战，仅此而已。"
 BOS_political.66.t: "塞族共和国外国代理人法"
 BOS_political.66.d: "多迪克被定罪几天后，实体大会匆忙通过了一项法律，强制要求接受外国资助的非政府组织和独立媒体注册为外国代理人，并报告每一笔捐款。欧安组织和威尼斯委员会称此举是对公民社会的倒退。"
 BOS_political.66.a: "谴责镇压行动"
 BOS_political.66.b: "塞族共和国给出了自己的答案"
 BOS_political.67.t: "没有人会执行的命令"
 BOS_political.67.d: "多迪克无视国家和国际刑警组织的逮捕令，途经贝尔格莱德和以色列前往莫斯科。当国家安全机构试图在塞族共和国境内逮捕他时，塞族共和国警方阻挠了逮捕行动。"
 BOS_political.67.a: "继续推进逮捕行动"
 BOS_political.67.b: "让冲突降温吧。"
 BOS_rs_police_standoff_tt: "§R塞族共和国警方包庇多迪克，使其免遭逮捕，加剧了危机。§!"
 BOS_political.68.t: "多迪克主席将举行提前选举"
 BOS_political.68.d: "由于多迪克被选举委员会剥夺了总统职务，塞族共和国举行了提前总统选举。独立社会民主人士联盟的忠实候选人西尼沙·卡兰和塞族民主运动的挑战者布兰科·布拉努沙的得票率差距仅为三分。"
 BOS_political.68.a: "独立社会民主人士联盟继续执政"
 BOS_political.68.b: "反对派突破"
 BOS_political.69.t: "柳比奇裁决"
 BOS_political.69.d: "宪法法院推翻了联邦人民院中每个族群每个州至少拥有一名代表的保障规定。由于议会没有足够的多数席位来制定替代法案，选举法仍然处于冻结状态。"
 BOS_political.69.a: "警告这样做会自食其果。"
 BOS_political.69.b: "记下，然后继续"
 BOS_political.49.d_ljubic: "泽利科·科姆希奇凭借波斯尼亚克族选民的多数票赢得了克罗地亚族总统席位，击败了克罗地亚民主联盟的德拉甘·乔维奇。两年前宪法法院在柳比奇案判决中留下的选举法漏洞，如今成为克罗地亚民主联盟论证克罗地亚族选民总能被否决的核心。克罗地亚族占多数的城镇宣布不欢迎他，萨格勒布也对本族群不认可的选举结果表示抗议。"
 BOS_political.70.t: "布戈伊诺警察局爆炸案"
 BOS_political.70.d: "一枚自制炸弹袭击了布戈伊诺警察局，造成一名警官死亡，六名警官受伤。发动袭击的萨拉菲派组织是该国自战争以来遇到的第一个大型本土圣战网络。"
 BOS_political.70.a: "将其视为一个孤立事件"
 BOS_political.70.b: "敲响激进化的警钟"
 BOS_counter_radicalization_available_tt: "§Y现在可以做出反极端化决议。§!"
 BOS_political.71.t: "美国大使馆发生枪击事件"
 BOS_political.71.d: "一名来自瓦哈比派聚居区戈尔尼亚·马奥查的枪手向美国驻萨拉热窝大使馆开了100多枪，最终被警方狙击手击毙。该国的极端化问题已不再是国内问题。"
 BOS_political.71.a: "承受外交后果"
 BOS_political.71.b: "要求就聚集区问题作出解释"
 BOS_salafi_enclave_decision_available_tt: "§Y现已出台一项对萨拉菲派聚居区进行监控的决议§!"
 BOS_political.72.t: "兹沃尔尼克警察局遇袭事件"
 BOS_political.72.d: "一名枪手在塞族共和国兹沃尔尼克火车站枪杀了一名警察，随后被击毙。这是伊斯兰极端分子首次袭击塞族共和国境内。据悉，他的一些同伙曾在叙利亚作战。"
 BOS_political.72.a: "这种威胁不顾任何实体界限。"
 BOS_political.73.t: "华盛顿制裁多迪克的网络"
 BOS_political.73.d: "美国财政部已对米洛拉德·多迪克实施制裁，并扩大了对其家族和庇护网络的制裁范围，理由是其腐败行为和蓄意阻挠戴顿的决议。这是迄今为止西方针对塞族共和国采取的最严厉的强制手段。"
 BOS_political.73.a: "问责制迟迟未能履行"
 BOS_political.73.b: "对塞族共和国本身的攻击"
 BOS_sanctions_deepen_crisis_tt: "§R制裁加剧了塞族共和国持续不断的分裂危机。§!"
 BOS_political.74.t: "婴儿革命"
 BOS_political.74.d: "议会因僵局而使公民身份法失效，导致新生儿数月没有身份证号码、护照或医疗卡。一名重病婴儿在等待出国治疗期间死亡后，萨拉热窝爆发了自战争以来规模最大的民众抗议活动，上万人走上街头游行。"
 BOS_political.74.a: "承诺快速修复"
 BOS_political.74.b: "让议会来解决吧。"
 BOS_political.75.t: "波黑晋级世界杯"
 BOS_political.75.d: "凭借在立陶宛1比0的胜利，波黑队以独立国家的身份首次晋级世界杯。几周以来，埃丁·哲科率领的这支球队让全国人民都为同一件事欢呼雀跃。"
 BOS_political.75.a: "一个短暂统一的国家"
 BOS_political.81.t: "稳定与联系协议最终生效"
 BOS_political.81.d: "签署九年后，《稳定与联系协议》正式生效。它重启了停滞多年的欧洲一体化进程，并为目前正在部长理事会中逐步形成的改革议程奠定了基础。"
 BOS_political.81.a: "与布鲁塞尔开启新的篇章"
 BOS_political.77.t: "波黑航空公司永久停飞"
 BOS_political.77.d: "由于债务缠身，联邦政府已对波黑航空公司进行清算，该公司无力偿还债务。自独立以来，该国首次没有了自己的国家航空公司。"
 BOS_political.77.a: "随它吧"
 BOS_political.77.b: "想想办法"
 BOS_political.78.t: "布罗伊奥宗按计划宣布"
 BOS_political.78.d: "迪拜的布罗伊房地产开发公司公布了在萨拉热窝郊外的特尔诺沃建造一座耗资43亿欧元的度假城市的计划，预计将创造数千个就业岗位。海湾地区的资本正以前所未有的力度关注波斯尼亚的房地产和旅游业。"
 BOS_political.78.a: "欢迎这项公告"
 BOS_political.76.t: "EFT斯坦纳里上线"
 BOS_political.76.d: "位于巴尼亚卢卡附近的斯坦纳里褐煤发电厂装机容量为300兆瓦，已投入商业运营。这是波黑战争以来新建的第一座火力发电厂。塞族共和国现在拥有了稳定的电力来源，该电厂由中国资金投资建设。"
 BOS_political.76.a: "塞族共和国的骄傲"
 BOS_political.80.t: "萨拉热窝第一骄傲"
 BOS_political.80.d: "大约两千人参加了萨拉热窝的游行，这是该国历史上首次举办骄傲游行，萨拉热窝也是最后一个举办骄傲游行的前南斯拉夫首都。一小群人聚集在“传统价值观”的旗帜下进行反示威，但游行过程和平进行。"
 BOS_political.80.a: "保障游行者的安全"
 BOS_political.80.b: "与国家保持距离"
 BOS_political.79.t: "洪水和山体滑坡掩埋了贾布拉尼察"
 BOS_political.79.d: "突发洪水和山体滑坡肆虐波斯尼亚中部和南部，这是该国十年来遭遇的最严重灾害。多尼亚·亚布拉尼察受灾最为严重，泥石流掩埋房屋，造成数十人死亡。"
 BOS_political.79.a: "呼吁欧盟提供团结援助"
 BOS_political.79.b: "自主重建"
 BOS_pass_jmbg_law: "通过公民身份证号法案"
 BOS_pass_jmbg_law_desc: "推动议会通过一项新的公民身份证法案，结束导致新生儿没有身份证明文件的登记漏洞。"
 BOS_jmbg_law_passed_tt: "§G公民身份法已被废除，抗议活动也已平息。§!"
 BOS_counter_radicalization_program: "启动反激进化计划"
 BOS_counter_radicalization_program_desc: "为打击近期爆炸事件背后的萨拉菲派网络提供资金支持和监督，以减少对国内安全的损害。"
 BOS_monitor_salafi_enclaves: "监控萨拉菲派聚居区"
 BOS_monitor_salafi_enclaves_desc: "对像戈尔尼亚·马奥查这样的村庄进行持续监控。这既能提高侦查效率，也能让居住在那里的波斯尼亚克族社区清楚地了解国家是如何看待他们的。"
 BOS_repatriate_foreign_fighters: "遣返和起诉外国战斗人员"
 BOS_repatriate_foreign_fighters_desc: "将那些在叙利亚和伊拉克为“伊斯兰国”作战的公民带回国，并根据2014年反恐法对他们进行审判。重新融入社会成本高昂，而且并非所有案件都能顺利结案。"
 BOS_reintegration_success_tt: "§G返回人员已成功重新融入社会。§!"
 BOS_reintegration_relapse_tt: "§R一些回国人员又重新加入了激进网络。§!"
 BOS_government_formation_paralysis: "政府组建瘫痪"
 BOS_government_formation_paralysis_desc: "没有哪个执政联盟拥有足够的席位组建部长会议。各部委在各党派进行谈判期间，只能依靠临时预算维持运转。"
 BOS_civil_society_crackdown: "公民社会镇压"
 BOS_civil_society_crackdown_desc: "塞族共和国的《外国代理人法》强制非政府组织和独立媒体进行注册、报告资金来源并标注其内容。监督机构和捐助者都在撤离该国。"
 BOS_domestic_terror_threat_1: "国内恐怖主义威胁"
 BOS_domestic_terror_threat_1_desc: "一个规模虽小但十分活跃的萨拉菲派网络主要在国家视线之外运作，其成员主要来自少数几个与世隔绝的社区。"
 BOS_counter_radicalization_measures: "反极端化措施"
 BOS_counter_radicalization_measures_desc: "外联计划和扩大监测正在逐步瓦解导致布戈伊诺爆炸案发生的网络。"
 BOS_salafi_enclave_monitoring: "Salafi Enclave Monitoring"
 BOS_salafi_enclave_monitoring_desc: "Security services keep a standing watch over Gornja Maoča and similar communities. It catches more plots than it used to, at the cost of trust in the neighborhoods being watched."
 BOS_foreign_fighter_reintegration: "Foreign Fighter Reintegration"
 BOS_foreign_fighter_reintegration_desc: "Returnees convicted and released under the repatriation program are being steered into work and away from the networks that recruited them the first time."
 BOS_eufor_deterrence: "EUFOR Reinforcement"
 BOS_eufor_deterrence_desc: "A larger EUFOR Althea garrison stands as a visible reminder that Bosnia's peace has outside guarantors, a fact that weighs on anyone in Banja Luka thinking about secession."
 BOS_eufor_deterrence_tt: "§YEUFOR's reinforced presence dampens the risk of a Republika Srpska secession bid§!"
 BOS_jmbg_crisis: "The JMBG Crisis"
 BOS_jmbg_crisis_desc: "Newborns are going without identity documents while parliament fails to agree a replacement citizen ID law. The longer it drags on, the larger the protests get."
 BOS_world_cup_unity: "World Cup Fever"
 BOS_world_cup_unity_desc: "The national team's run to its first World Cup has given Bosniaks, Croats, and Serbs alike something to cheer for at the same time."
 BOS_stanari_plant_online: "Stanari Plant Online"
 BOS_stanari_plant_online_desc: "The Chinese-built Stanari lignite plant is feeding steady power into Republika Srpska's grid, the first new thermal capacity built anywhere in the country since the war."
 BOS_national_carrier_pride: "National Carrier Pride"
 BOS_national_carrier_pride_desc: "The state-subsidized flag carrier is still flying, a small point of pride in a country that has otherwise gone without one since 2015."
