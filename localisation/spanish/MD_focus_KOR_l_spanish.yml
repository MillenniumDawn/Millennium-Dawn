 KOR_samsung: "Samsung Electronics"
 KOR_samsung_desc: "Samsung es el emblema de la innovación coreana. Debemos impulsar aún más su dominio global."
 KOR_samsung_galaxy_phones: "Desarrollo de teléfonos Samsung Galaxy"
