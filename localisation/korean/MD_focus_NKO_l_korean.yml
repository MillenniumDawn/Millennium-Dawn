 NKO_juche_for_new_era: "새로은 시대의 주체"
 NKO_juche_for_new_era_desc: "With the inauguration of Chairman Kim Yo-jong, North Korea has entered a new era, a brighter future."
 NKO_for_well_being_of_people: "조선 인민들의 행복을 위해"
 NKO_for_well_being_of_people_desc: "The beginnings of the Workers' Party of Korea are for the happiness and well-being of the Korean people. We mustn't forget our beginnings."
 NKO_quality_first: "품질 우선"
 NKO_quality_first_desc: "지역 민간 기업들이 우리의 목표 달성을 위해 제품 품질을 심각하게 저하시키고 있으며, 이는 반드시 중단되어야 합니다!"
 NKO_chosun_dream: "조선몽"
 NKO_chosun_dream_desc: "'조선몽'은 [NKO.GetLeader] 주석이 제시한 새로운 개념으로, 한민족의 개인적 및 국가적 목표를 집약하고 있습니다. 이는 경제, 정치, 국제 분야를 포함한 다양한 분야의 열망을 아우릅니다."
 NKO_privatize_civil_industry: "민간 산업 민영화"
