 CPD_peace_deal_explainer_ICON_TT: "Como funcionam os acordos de paz"
 CPD_peace_deal_explainer_ICON_TT_DELAYED: "A construção de um acordo de paz é tão simples quanto selecionar uma aba acima e, em seguida, escolher o que ceder ou exigir dentro de um estado.\n\nConstruir um acordo de paz que tenha um custo §Ynegativo§! provavelmente será aceito por uma IA, enquanto construir um acordo de paz que tenha um custo §Ypositivo§! tem menos probabilidade de ser aceito. Você pode ver o detalhamento completo da disposição da IA em aceitar um acordo passando o mouse sobre a caixa de aceitação.\n\nQualquer acordo de paz construído para um jogador não é afetado por esses valores."
