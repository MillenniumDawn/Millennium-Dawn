 SAU_tt_pipeline_oil_dependence: "§RУвеличивает зависимость от нефти.§! Королевство еще больше наращивает экспорт нефти."
 SAU_tt_sabotage_chance: "§Y50% вероятность§! Перерезать трубопровод. Если это удастся, Саудовская Аравия потеряет этот маршрут и все связанные с ним преимущества."
