 PMR_LIBERAL: "Demokratyczna Naddniestrze"
 PMR_LIBERAL_DESC: "Naddniestrze pójdzie Drogą Demokracji, a także będzie dążyć do integracji z Mołdawią."
 PMR_PATRIOTIC: "Republikańska Naddniestrze"
 PMR_PATRIOTIC_DESC: "Naddniestrze podąży drogą Partii Republikańskiej, otwierając sobie wyjątkowe możliwości polityczne."
 PMR_COMMUNISM: "Powrót do komunizmu"
 PMR_COMMUNISM_DESC: "Komunistyczna flaga znów zawiśnie nad Naddniestrzem, a droga do odrodzenia Mołdawskiej SRR stanie otworem."
 PMR_UKRAINE: "Ukraińska Naddniestrze"
