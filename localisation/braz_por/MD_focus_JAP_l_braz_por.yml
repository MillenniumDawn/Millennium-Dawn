 raid_type_JAP_raid_sikhalin: "Incursão à Base Naval de Sacalina"
 raid_type_JAP_raid_sikhalin_desc: "Fuzileiros navais japoneses desembarcam em Sacalina para atacar a base naval russa, forçando Moscou a reconsiderar sua recusa em negociar sobre as ilhas do norte."
 JAP_sakhalin_raid_unlocked: "A incursão a §YSacalina§! foi autorizada"
 JAP_article9_mission_explainer_tt: "Esta missão se conclui sozinha a cada 30 dias, reduz os efeitos do §YArtigo 9§! listados abaixo e recomeça até que esses efeitos sejam zerados. Encerrar as três missões do Artigo 9 desbloqueia §YFormalizar as Capacidades de Defesa Nacional§!."
 JAP_historical.20160327.t: "The Democratic Party Is Formed"
 JAP_historical.20160327.d: "The Democratic Party of Japan has merged with the Japan Innovation Party and smaller reform groups to form a new opposition party, the Democratic Party (Minshintō).\n\nThe merged party unites most of the non-LDP opposition in the Diet under one banner, aiming to offer voters a credible alternative to the governing coalition ahead of the coming upper house election."
 JAP_historical.20160327.a: "The opposition closes ranks."
 japan_varyag.1.t: "§YLiaoning§! Enters Service"
 japan_varyag.1.desc: "§Y[CHI.GetNameWithFlag]§!§W has completed the §!§YLiaoning§!§W, its rebuilt §!§YVaryag§!§W carrier. We can make a public statement to rally support for our naval policy, or direct the navy to study the new ship and adjust its training.§!"
 japan_varyag.1.a: "Express our concern publicly"
 japan_varyag.1.b: "Review naval training"
