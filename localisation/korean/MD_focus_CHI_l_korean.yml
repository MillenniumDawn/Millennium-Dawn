 CHI_TAI_coercive_signaling_desc: "날카로운 군사 훈련과 외교적 압박을 통해 베이징의 불쾌감을 드러냅니다. 본토의 결의를 타이베이에 상기시키지만 양안 신뢰를 갉아먹습니다."
