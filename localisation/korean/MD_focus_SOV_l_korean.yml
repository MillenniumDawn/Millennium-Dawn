 rusboloto.1.b: "원한다면 그렇게 하라..."
 SOV_western_sanctions_desc: "서방의 제재 하에 있음"
 SOV_interrao_buy_pmr_gres_desc: "추추르간 발전소는 오랫동안 심각한 상태에 놓여 있으며, §Y[PMR.GetNameWithFlag]§! 정부는 이를 우리 소유로 민영화하는 방안을 검토하고 있습니다. 이를 통해 우리는 이 나라에 대한 영향력을 강화하고 그들에게 추가적인 에너지 설비를 제공할 수 있습니다."
 SOV_jail_furgal_event_TT: "§Y우리 국민의 뜻을 거슬러 세르게이 푸르갈을 투옥할 것입니다!§!"
 S0V_Federation_Army_idea: "연방군"
 SOV_FederalArmy_loc1: "\n£text_icon_sov_army §g연방군§!:\n£personnel_cost_multiplier_modifier_texticon §Y군사 비용§! 배수: §G-10.00%§!\n£organization_texticon  사단 편제: §R-3.00%§!\n"
 SOV_FedPolice_loc1: "\n£text_icon_sov_mvd §g연방 경찰§!:\n£stability_texticon  안정도: §R-3.00%§!\n£police_cost_multiplier_modifier_texticon §Y경찰 비용§! 배수: §G-10.00%§!\n"
 SOV_russia_good: "단결되고 온전한 국가"
 SOV_russia_good_desc: "국민투표를 통해 우리 국민이 러시아의 영토 보전을 바꾸기를 원하지 않는다는 사실이 확인되었습니다."
 SOV_good_federalism: "성공적인 연방주의"
 SOV_good_federalism_desc: "우리의 연방 제도가 성숙하여 중앙 정부와 구성체 모두에게 이익을 가져다주고 있습니다."
 SOV_federal_police: "연방 경찰"
 SOV_federal_police_desc: "경찰을 연방 경찰과 지방 경찰로 나누어 개혁하고, 지역에 권한을 부여하여 중앙 예산의 부담을 줄일 것입니다."
 SOV_federation_army: "연방군"
 SOV_federation_army_desc: "많은 구성체가 자체 부대를 편성할 수 있게 되면 연방군의 부담이 크게 줄어들 것입니다."
 SOV_no_taxes_subjects: "연방세 폐지"
 SOV_no_taxes_subjects_desc: "연방 구성체에 대한 연방세를 폐지하여 그들의 재정 부담을 덜고 지역 경제를 활성화할 것입니다."
 sov_liberals.1.t: "개혁 완료!"
 sov_liberals.1.d: "우리는 단 500일 만에 경제 체제를 성공적으로 개혁했습니다! 이는 가이다르와 옐친이 이룰 수 있었던 것을 뛰어넘는 대단한 성과입니다. 이제 꾸준한 성장을 유지하고 시민들의 복지를 향상시켜야 합니다."
 sov_liberals.1.o1: "축하합시다!"
 sov_liberals.2.t: "개혁 실패!"
 sov_liberals.2.d: "우리의 개혁 노력은 실패로 돌아갔습니다. 우리가 바라던 경제 기적을 만들어 내지 못했습니다. 이제 최악의 상황, 즉 1990년대를 연상시키는 경기 침체에 대비해야 합니다."
 sov_liberals.2.o1: "오, 안 돼..."
 sov_liberals.2.o2: "오, 안 돼..."
 sov_liberals.2.o3: "오, 안 돼..."
 sov_liberals.3.t: "러시아 민주주의 대국민투표"
 sov_liberals.3.d: "러시아의 국가 영토 구조의 미래를 결정할 순간이 왔습니다. 전국 국민투표를 통해 국민이 우리나라의 영토적 미래를 어떻게 그리고 있는지 마침내 드러날 것입니다."
 sov_liberals.3.o1: "국가의 운명은 국민이 결정한다."
 SOV_great_democratic_referendum_tt: "§Y국민투표§!의 결과는 £text_icon_sov_empire §Y러시아의 유산§!의 상태에 달려 있습니다. £text_icon_sov_empire §Y러시아의 유산§!이 £text_icon_sov_democratic §2민주주의§!에 가까울수록 §Y국민투표§! 결과로 국가의 영토 구조가 바뀔 가능성이 커집니다."
 SOV_subjects_exist_tt: "§Y러시아§!에 연방 구성체가 최소 하나 이상 있음."
 SOV_subjects_federalization_buff_tt: "§Y진정한 연방주의§! 국가 정신이 §Y변경§!되며 이제 그 §G개선된 버전§!을 §Y사용할 수 있습니다§!."
 SOV_rosguard_troops_idea: "로스그바르디야 부대"
 sov_liberals_news.1.d: "러시아의 영토적 미래에 관한 획기적인 국민투표가 실시되었습니다. 일반 시민들에게 국가의 운명을 결정할 권한이 주어지면서 내부 경계가 극적으로 바뀌어 많은 이에게 충격을 안겼습니다."
 sov_liberals_news.1.a: "이것이 진정한 민주주의인가?"
 SOV_system_democratic_referendum_tt: "선택한 §Y정치 체제§!가 §Y다가오는 국민투표§!의 결과에 영향을 미칩니다."
 SOV_cis_return: "CIS의 두 번째 기회"
 SOV_cis_return_desc: "과거의 실패에도 불구하고, 우리는 CIS를 자유로운 구소련 국가들의 연합으로 되살리고자 합니다."
 SOV_cis_reform: "개혁 협상"
 SOV_cis_reform_desc: "과거의 실수를 되풀이하지 않고 장기적인 성공을 보장하려면 CIS의 개혁이 필요합니다."
 SOV_cis_returning_members: "새로운 회원국에 손을 내밀기"
 SOV_cis_returning_members_desc: "일부 국가는 CIS를 탈퇴하여 더 이상 스스로를 회원국으로 여기지 않습니다. 우리는 이들을 다시 데려올 계획입니다."
 SOV_cis_new_member: "CIS 신규 회원국"
 SOV_cis_new_member_desc: "연합을 강화하기 위해 CIS는 모든 구소련 공화국을 포함하며 성장해야 합니다."
 SOV_cis_unity_state: "CIS 연합"
 SOV_cis_unity_state_desc: "본래 연합체로 구상되었던 이 계획을, 위험이 있을 수 있음에도 모든 CIS 회원국에 다시 도입하고자 합니다."
 SOV_cis_military_forces: "CIS 군"
 SOV_cis_military_forces_desc: "CIS는 현대적이고 강력한 군사력을 갖추어야 하며, 우리는 그 부활에 전념하고 있습니다."
 SOV_kasyanov_economic_reform: "대규모 경제 개혁"
 SOV_kasyanov_economic_reform_desc: "풍부한 자원에도 불구하고 우리 경제는 정체되어 있습니다. 이전 정부의 규제를 철폐하고 성장을 되살릴 것입니다."
 SOV_kasyanov_infrastructure: "대규모 인프라 계획"
 SOV_kasyanov_infrastructure_desc: "우리의 인프라는 상태가 좋지 않습니다. 이를 시급히 개선하기 위한 연방 계획을 출범시켜야 합니다."
 SOV_kasyanov_human_capital: "인적 자본"
 SOV_kasyanov_human_capital_desc: "시민은 국가의 근간이며, 우리는 그들의 복지와 발전에 막대한 투자를 할 것입니다."
 SOV_kasyanov_far_east: "극동 연방 계획"
 SOV_kasyanov_far_east_desc: "극동은 대규모 투자가 필요합니다. 이 지역을 개발하기 위한 전담 연방 계획을 수립할 것입니다."
 SOV_kasyanov_militia: "농업 투자"
 SOV_kasyanov_militia_desc: "농민들은 재정적으로나 법적으로나 보호받고 있다고 느낄 수 있어야 합니다. 민간 농업을 개선하기 위한 개혁을 시행할 것입니다."
 SOV_kasyanov_konkurentsia: "독점 규제 권한 강화"
 SOV_kasyanov_konkurentsia_desc: "연방독점규제청은 불법적인 시장 활동에 대응할 더욱 강력한 권한을 얻게 될 것입니다."
 SOV_political_reforms: "대규모 정치 개혁"
 SOV_political_reforms_desc: "우리의 정치 체제는 근본적인 변화가 필요합니다. 전체주의적 통제를 종식하고 정치 생활에 활력을 되찾기 위한 개혁에 착수할 것입니다."
 SOV_kasyanov_political: "위대한 민주 러시아"
 SOV_kasyanov_happy_farmers_idea: "농민에 대한 정부 지원"
 SOV_kasyanov_fas: "연방독점규제청"
 SOV_kasyanov_anti_corruption_agency: "독립 반부패 기관"
 sov_liberals.4.t: "우리를 동맹에 초청하는 [FROM.GetNameWithFlag]"
 sov_liberals.4.d: "[FROM.GetNameWithFlag]이(가) 구소련 지역과 그 너머에서 민주주의를 수호하는 것을 목표로 하는 자유 독립 동맹에 우리를 초청했습니다. 함께라면 방위를 강화하고 경제를 성장시키며 지정학적 영향력을 높일 수 있습니다. 거절하면 분쟁 중 중요한 지원을 놓치고 홀로 서게 됩니다. 선택은 우리에게 달려 있습니다. 가입하여 협력할 것인가, 홀로 갈 것인가."
 sov_liberals.4.a: "그들의 제안을 수락한다"
 sov_liberals.4.b: "지금은 때가 아니다"
 sov_liberals.5.t: "우리 동맹에 가입하기로 한 [FROM.GetNameWithFlag]"
 sov_liberals.5.d: "[FROM.GetNameWithFlag]이(가) 자유 독립 동맹 가입 초청을 수락했습니다! 이제 그들은 우리의 보호 아래 있습니다."
 sov_liberals.5.a: "훌륭하군!"
 sov_liberals.6.t: "우리 동맹 가입을 거부한 [FROM.GetNameWithFlag]"
 sov_liberals.6.d: "[FROM.GetNameWithFlag]이(가) 자유 독립 동맹 초청을 거절했습니다."
 sov_liberals.6.a: "그들의 선택이다."
 sov_liberals.6.b: "이대로 넘어갈 수 없다. 무력으로 행동에 나서겠다!"
 sov_liberals.7.t: "우리를 동맹에 초청하는 [FROM.GetNameWithFlag]"
 sov_liberals.7.d: "[FROM.GetNameWithFlag]이(가) 구소련 공간 전역과 그 너머에서 민주주의를 수호하기 위한 자유 독립 동맹에 우리를 초청했습니다. 가입하면 우리의 방위, 경제, 세계적 영향력이 향상될 것입니다. 거절하면 분쟁 시 고립될 위험이 있습니다."
 sov_liberals.7.a: "수락한다"
 sov_liberals.7.b: "지금은 어렵다"
 sov_liberals.8.t: "우리를 동맹에 초청하는 [FROM.GetNameWithFlag]"
 sov_liberals.8.d: "[FROM.GetNameWithFlag]이(가) 구소련 지역과 전 세계에서 민주주의를 보호하는 것을 목표로 하는 자유 독립 동맹에 우리를 초청했습니다. 함께라면 방위를 강화하고 경제를 발전시키며 영향력을 확대할 수 있습니다. 거절하면 분쟁 시 동맹국을 잃을 위험이 있습니다."
 sov_liberals.8.a: "수락한다"
 sov_liberals.8.b: "지금은 아니다"
 sov_liberals.9.t: "우리를 동맹에 초청하는 [FROM.GetNameWithFlag]"
 sov_liberals.9.d: "[FROM.GetNameWithFlag]이(가) 구소련 지역과 그 너머에서 민주주의를 수호하는 데 전념하는 자유 독립 동맹에 우리를 초청했습니다. 협력하면 방위력, 경제 성장, 지정학적 영향력을 기대할 수 있습니다. 거절하면 우리가 고립될 수도 있습니다."
 sov_liberals.9.a: "수락한다"
 sov_liberals.9.b: "지금은 거절해야 한다"
 sov_liberals.10.t: "우리를 동맹에 초청하는 [FROM.GetNameWithFlag]"
 sov_liberals.10.d: "[FROM.GetNameWithFlag]이(가) 구소련 전역과 전 세계에서 민주주의를 수호하기 위한 자유 독립 동맹에 우리를 초청했습니다. 가입하면 방위, 경제 발전, 국제적 위상이 향상됩니다. 거절하면 중요한 지원을 잃을 위험이 있습니다."
 sov_liberals.10.a: "수락한다"
 sov_liberals.10.b: "지금은 거절한다"
 sov_liberals.11.t: "우리를 CIS에 초청하는 [FROM.GetNameWithFlag]"
 sov_liberals.11.d: "[FROM.GetNameWithFlag]이(가) 다시 한번 CIS를 부활시키려 하며 우리에게 재가입을 요청했습니다. 보다 민주적인 지도부 아래에서는 CIS가 모스크바의 영향력 수단이 아니라 독립 국가들의 진정한 연합이 될 수 있습니다."
 sov_liberals.11.a: "재가입에 동의한다"
 sov_liberals.11.b: "아니요"
 sov_liberals.12.t: "CIS 가입에 동의한 [FROM.GetNameWithFlag]"
 sov_liberals.12.d: "[FROM.GetNameWithFlag]이(가) CIS 가입 초청을 수락하여 우리의 입지를 강화하고 이 구상이 아직 살아 있음을 보여 주었습니다."
 sov_liberals.12.a: "좋다"
 sov_liberals.13.t: "CIS 가입을 거부한 [FROM.GetNameWithFlag]"
 sov_liberals.13.d: "[FROM.GetNameWithFlag]이(가) 우리의 제안을 거절했으며, 구소련 공간 내 협력에 거의 관심이 없음을 보여 주었습니다."
 sov_liberals.13.a: "유감이다"
 sov_liberals.14.t: "CIS 연합 창설을 제안하는 [FROM.GetNameWithFlag]"
 sov_liberals.14.d: "[FROM.GetNameWithFlag]이(가) CIS를 연합으로 확대하여 1990년대의 형태를 부분적으로 복원할 것을 제안했습니다. 이는 이점을 제공하지만, 모스크바가 더 큰 통제권을 되찾게 되어 자치권을 잃을 위험도 있습니다."
 sov_liberals.14.a: "동의한다"
 sov_liberals.14.b: "아니요"
 sov_liberals.15.t: "CIS 연합의 일원이 된 [FROM.GetNameWithFlag]"
 sov_liberals.15.d: "[FROM.GetNameWithFlag]이(가) 우리와 함께 CIS 연합에 가입하기로 서명하여, 우리는 거의 하나가 된 국가에 한층 가까워졌고 1990년대의 붕괴는 먼 과거의 기억처럼 느껴지게 되었습니다."
 sov_liberals.15.a: "좋다"
 sov_liberals.16.t: "CIS 연합 가입을 거부한 [FROM.GetNameWithFlag]"
 sov_liberals.16.d: "[FROM.GetNameWithFlag]이(가) CIS 연합 협정을 거부했으며, 주권 상실에 분노하여 즉시 CIS를 탈퇴했습니다."
 sov_liberals.16.a: "유감이다"
 sov_liberals.17.t: "CIS 군 창설을 제안하는 [FROM.GetNameWithFlag]"
 sov_liberals.17.d: "[FROM.GetNameWithFlag]이(가) 회원국 간의 더 나은 협조를 위해 CIS 군을 부활시키고자 합니다. 이는 군사력을 높이지만 러시아의 영향력 또한 높이게 됩니다."
 sov_liberals.17.a: "동의한다"
 sov_liberals.17.b: "아니요"
 sov_liberals.18.t: "CIS 군 참여에 동의한 [FROM.GetNameWithFlag]"
 sov_liberals.18.d: "[FROM.GetNameWithFlag]이(가) CIS 군에 참여하기로 동의하여, 연합의 군사력이 크게 강화되었습니다."
 sov_liberals.18.a: "좋다"
 sov_liberals.19.t: "CIS 군 참여를 거부한 [FROM.GetNameWithFlag]"
 sov_liberals.19.d: "[FROM.GetNameWithFlag]이(가) 현재의 회원 자격으로 충분하다고 여겨 부활한 CIS 군에 가입하기를 거절했습니다."
 sov_liberals.19.a: "유감이다"
 sov_liberals.21.t: "CIS를 탈퇴하는 [FROM.GetNameWithFlag]"
 sov_liberals.21.d: "[FROM.GetNameWithFlag]은(는) 러시아의 새 정부와 정책에 동의하지 않으며, CIS와 그 기구에서 탈퇴하는 포고령에 서명했습니다."
 sov_liberals.21.a: "유감이다"
 sov_liberals.22.t: "칼리닌그라드 투자를 제안하는 [FROM.GetNameWithFlag]"
 sov_liberals.22.d: "[FROM.GetNameWithFlag]이(가) 칼리닌그라드에 대한 정책을 전환하여 외국인 투자에 문호를 개방하고 협력을 제안했습니다."
 sov_liberals.22.a: "동의한다"
 sov_liberals.22.b: "아니요"
 sov_liberals.23.t: "칼리닌그라드 지역 투자에 동의한 [FROM.GetNameWithFlag]"
 sov_liberals.23.d: "[FROM.GetNameWithFlag]이(가) 우리의 투자 제안을 수락하고 협정을 마무리할 준비를 하고 있습니다."
 sov_liberals.23.a: "훌륭하군"
 sov_liberals.24.t: "칼리닌그라드 지역 투자를 거부한 [FROM.GetNameWithFlag]"
 sov_liberals.24.d: "[FROM.GetNameWithFlag]이(가) 자국에 이득이 없다고 보았는지 우리의 투자 제안을 거절했습니다."
 sov_liberals.24.a: "유감이다"
 sov_liberals.25.t: "칼리닌그라드 지역 투자 결과"
 sov_liberals.25.d: "우리는 여러 유럽 국가에 칼리닌그라드 투자를 제안했으며, 그 결과는 유망합니다."
 sov_liberals.25.a: "알겠다"
 SOV_one_CIS_member_tt: "§2CIS§!의 회원국이 최소 §Y하나 이상의 다른 국가§!임"
 SOV_svr_open: "§Y대외정보국§!: §G개방§!"
 SOV_svr_close: "§Y대외정보국§!: §R폐쇄§!"
 SOV_constantinople_rename: "콘스탄티노폴리스, 다시 태어나다"
 SOV_constantinople_rename_desc: "우리는 콘스탄티노폴리스를 역사적 이름으로 되돌리고 있습니다. 우리의 임무는 비잔티움이 몰락하기 전의 옛 영광을 되살리는 것이며, 이는 지역 내 우리의 새로운 힘을 상징합니다."
 SOV_constantinople_police_operation: "특별 경찰 작전"
 SOV_constantinople_police_operation_desc: "튀르키예의 저항이 이 지역에서의 우리 통제를 위협하고 있습니다. 우리는 법 집행 기관을 투입하여 반대 세력을 완전히 진압하고 안정을 확보할 것입니다. 이 작전은 우리의 지배를 보장합니다."
 SOV_constantinople_subject_rf: "콘스탄티노폴리스, 고향 항구로"
 SOV_constantinople_subject_rf_desc: "저항이 진압되고 핵심 시설이 확보되었으므로, 이 영토를 우리의 위대한 제국에 완전히 통합할 준비가 되었습니다. 이는 우리 팽창의 새로운 장을 엽니다."
 SOV_jirik_conts_reform_idea: "헌법 개혁"
 SOV_jirik_new_conts_monarchy_idea: "러시아 입헌 군주국"
 SOV_jirik_new_romanov_monarchy_idea: "신 로마노프 군주국"
 SOV_jirik_police_state_reform_idea: "개편된 내무 부처"
 russia_governorate.20.t: "우리를 현으로 삼기로 한 러시아의 결정"
 russia_governorate.20.d: "러시아는 이전의 국가 구조에 강하게 반대하며 행정 구역의 복귀를 추진하고 있습니다. 그들은 우리가 자국의 현 가운데 하나가 될 것을 요구합니다."
 russia_governorate.20.o1: "함께 위대한 제국을 부활시키자!"
 russia_governorate.20.o2: "저항하고 맞서 싸우자!"
 russia_governorate.20.o3: "연방 국가를 제안한다"
 russia_governorate.21.t: "고향으로 돌아오는 아르메니아"
 russia_governorate.21.d: "아르메니아 정부는 대립을 피하며 현명하게 행동했습니다. 아르메니아는 다시 한번 러시아 제국의 일부가 되어 오랜 유대를 회복할 것입니다."
 russia_governorate.21.o1: "훌륭하군."
 russia_governorate.22.t: "우리에게 저항하는 아르메니아!"
 russia_governorate.22.d: "아르메니아는 연방 국가에 대한 러시아의 뜻에 대담하게 저항했습니다. 우리는 그들의 반항에 걸맞은 대응을 준비해야 합니다."
 russia_governorate.22.o1: "어리석은 자들."
 russia_governorate.23.t: "연방 국가를 제안하는 아르메니아"
 russia_governorate.23.d: "아르메니아 정부는 덜 공격적인 대안으로 연방 국가의 가속화된 창설을 제시했습니다. 그들은 잠재적인 권력 상실을 줄이려는 것으로 보입니다."
 russia_governorate.23.o1: "연방 국가가 있으라"
 russia_governorate.23.o2: "아르메니아는 없다."
 sov_nationalists.52.t: "우리나라에서 쿠데타를 일으킨 [FROM.GetName]!"
 sov_nationalists.52.d: "러시아 특수 기관이 우리 땅에서 쿠데타를 획책하여 그들에게 충성하는 통치자를 권좌에 앉혔습니다. 우리는 다시 한번 러시아의 통제라는 사슬에 묶였습니다."
 sov_nationalists.52.o1: "아, 안 돼"
 sov_nationalists.53.t: "작전: 그릴"
 sov_nationalists.53.d: "러시아군이 아제르바이잔 군사 시설에 기습 선제 타격을 개시하고 신속히 바쿠를 향해 진격하여 새로운 전쟁의 시작을 알렸습니다."
 sov_nationalists.53.o1: "이것을 끝내자"
 sov_nationalists.53.o2: "아, 안 돼"
 sov_nationalists.54.t: "이스탄불 통합"
 sov_nationalists.54.d: "우리의 우선 과제는 이스탄불과 주변 지역을 러시아의 영토 체계에 통합하고 비잔티움 문화유산을 되살리는 것입니다. 우리는 즉시 역사적 이름의 복원을 시작할 것입니다."
 sov_nationalists.54.o1: "훌륭하다"
 sov_nationalists.55.t: "튀르키예의 저항"
 sov_nationalists.55.d: "현지 튀르키예 시민들이 전직 군 및 정보 요원들과 함께 이스탄불과 인근 영토에서의 우리 노력에 맞서 저항 조직을 결성했습니다."
 sov_nationalists.55.o1: "참을 수 없게 되어 가고 있다"
 sov_nationalists.56.t: "특별 경찰 작전"
 sov_nationalists.56.d: "우리의 경찰 작전은 성공하여 튀르키예의 저항을 완전히 진압했습니다. 이제 반대 없이 이 땅의 통합을 진행할 수 있습니다."
 sov_nationalists.56.o1: "훌륭하다"
 sov_nationalists.57.t: "러시아의 일부인 콘스탄티노폴리스"
 sov_nationalists.57.d: "역사적 정의가 마침내 실현되었습니다. 콘스탄티노폴리스는 러시아의 일부가 되었으며, 이는 우리 통치자들의 수 세기에 걸친 꿈을 이루고 제국의 커다란 승리를 알리는 것입니다."
 sov_nationalists.57.o1: "위대한 승리다!"
 SOV_Petrograd: "페트로그라드"
 SOV_Constantinople: "콘스탄티노폴리스"
 SOV_const_rebels: "튀르키예의 저항"
 sov_nationalists_news.3.t: "모스크바 조약"
 sov_nationalists_news.3.d: "러시아의 지도자 [SOV.GetLeader]은(는) 러시아의 이익과 우호국을 보호하기 위해 '모스크바 조약'이라는 새로운 군사·경제 동맹을 창설할 계획을 발표했습니다. 그는 전례 없는 서방의 압박을 이유로 들며 옛 소련 국가들에 가입을 요청했습니다. 전문가들은 이것이 새로운 냉전의 신호라고 경고합니다."
 sov_nationalists_news.3.a: "불안한 전개다"
 sov_nationalists_news.4.t: "러시아의 새 수도"
 sov_nationalists_news.4.d: "[SOV.GetLeader]은(는) '역사적 정의의 회복'으로서 러시아의 수도를 모스크바에서 역사적 도시 페트로그라드(구 상트페테르부르크)로 옮길 계획을 발표했습니다. 모든 정부 기관은 1년 안에 이전해야 하지만, 일부에서는 이로 인해 수도가 나토의 위협에 노출될 것이라고 경고합니다."
 sov_nationalists_news.4.a: "과거를 복원하려는 시도"
 sov_nationalists_news.5.t: "야망을 선포하는 러시아"
 sov_nationalists_news.5.d: "대담한 연설에서 러시아의 국가 원수는 옛 제국 영토에 대한 영유권을 선언하며 제국의 몰락을 볼셰비키와 서방 탓으로 돌렸습니다. 그는 서방 국가들이 러시아인에 대한 간섭과 집단 학살을 저질렀다고 비난하며, 핵전쟁까지 위협하면서 어떤 수단을 써서라도 영토를 되찾을 '대러시아'를 선포했습니다."
 sov_nationalists_news.5.a: "오직 신만이 우리를 구하실 수 있다..."
 sov_nationalists_news.6.t: "러시아의 최고 통치자"
 sov_nationalists_news.6.d: "러시아의 새 헌법은 대통령직을 폐지하고 광범위한 권한을 가진 최고 통치자로 대체하여, 사실상 모든 정부 부문을 단일 권력 아래 중앙집권화합니다. [SOV.GetLeader]은(는) 러시아의 위대함을 회복하려면 강력한 지도자가 필요하다고 선언했으며, 이는 새로운 권위주의 시대의 시작을 알립니다."
 sov_nationalists_news.6.a: "[SOV.GetLeader]만세!"
 sov_nationalists_news.7.t: "신 러시아 제국"
 sov_nationalists_news.7.d: "국가 두마의 정기 회기에서 러시아 대통령 [SOV.GetLeader]은(는) 러시아 제국을 복원할 필요성을 선언했습니다. 연설에서 그는 옛 제국의 붕괴를 '역사적 오류'라고 부르며, 새로운 '제국 헌법'을 채택하기 위한 헌법 회의를 개최할 것을 제안했습니다. 이 헌법을 기초하고 황제로 즉위할 후보를 선정하기 위해 '임시 섭정'이라는 특별 기구가 구성될 것입니다. 그의 연설은 집권당의 열광적인 박수를 받았으며, 한 의원은 '나는 평생 이 순간을 기다려 왔다'고 선언했습니다. 광범위한 야당 숙청과 권력 집중의 심화를 고려할 때, [SOV.GetLeader]은(는) 정부를 완전히 재편할 준비가 된 것으로 보입니다. 제국의 부활은 러시아가 옛 제국 영토에 대한 영유권을 재확인하고 있음을 알립니다."
 sov_nationalists_news.7.a: "전혀 예상치 못한 일이다..."
 sov_nationalists_news.8.t: "민족볼셰비키를 흡수할 러시아"
 sov_nationalists_news.8.d: "[SOV.GetLeader] 대통령은 논란이 많은 당수 에두아르드 리모노프를 비롯한 민족 볼셰비키당의 여러 주요 인사가 러시아 정부에 합류할 것이라고 발표했습니다. 구체적인 역할은 알려지지 않았지만, 그들의 정부 입성은 민족 볼셰비즘으로의 중대한 이념적 전환을 의미합니다. 이 이념은 옛 소련 영토에서의 공격적인 영토 팽창을 촉진합니다. 서방과 독립국가연합 국가들은 이제 긴장이 고조될 가능성에 대비하고 있습니다."
 sov_nationalists_news.8.a: "전혀 예상치 못한 일이다..."
 sov_nationalists_news.9.t: "니콜라이 로마노프의 대관식"
 sov_nationalists_news.9.d: "니콜라이 로마노프가 모스크바의 우스펜스키 대성당에서 열린 화려한 의식에서 공식적으로 러시아 제국의 황제로 대관했습니다. 이 행사에는 정부 관리, 외국 귀빈, 군주주의자들, 그리고 황제의 섭정 [SOV.GetLeader]이(가) 참석했습니다. 연설에서 니콜라이는 니콜라이 2세의 계승을 주장하며 새 제국의 정통성을 확인했습니다. 그는 또한 [SOV.GetLeader]이(가) 새로운 차르 정부를 이끌도록 공개적으로 지지했습니다. 그러나 새로 채택된 헌법에 따라 총리의 역할은 황제를 위해 축소되어, [SOV.GetLeader]의 국정에 대한 미래 영향력은 불투명해졌습니다."
 sov_nationalists_news.9.a: "제국주의의 역습."
 sov_nationalists_news.10.t: "마리아 로마노바의 대관식"
 sov_nationalists_news.10.d: "마리아 로마노바가 모스크바의 우스펜스키 대성당에서 열린 의식 행사에서 러시아의 새 여제로 대관했습니다. 제국의 전통이 깊이 배어 있는 이 의식에는 국가 관리, 외국 지도자, 군주주의자들이 섭정 [SOV.GetLeader]과(와) 함께 참석했습니다. 연설에서 마리아는 니콜라이 2세의 계승을 주장하고 새 제국의 합법성을 확인했으며, [SOV.GetLeader]을(를) 차르 정부의 수반으로 임명할 의사를 밝혔습니다. 그의 지지에도 불구하고 새 헌법은 황제에게 더 큰 권한을 부여하여 [SOV.GetLeader]의 미래 정치적 역할을 불투명하게 남겨두었습니다."
 sov_nationalists_news.10.a: "제국주의의 역습."
 sov_nationalists_news.11.t: "게오르기 로마노프의 대관식"
 sov_nationalists_news.11.d: "게오르기 로마노프가 모스크바의 역사적인 우스펜스키 대성당에서 대관하여 러시아의 새 황제로 즉위했습니다. 이 행사는 국가 관리, 외국 귀빈, 군주주의자들이 지켜보았으며 섭정 [SOV.GetLeader]도 자리했습니다. 연설에서 게오르기는 니콜라이 2세와의 연결을 강조하며 새로운 러시아 제국의 정통성을 주장했습니다. 그는 또한 [SOV.GetLeader]을(를) 차르 정부의 수반으로 임명하고 싶다는 뜻을 표했습니다. 헌법이 권력을 황제 쪽으로 옮김에 따라, 통치에서 [SOV.GetLeader]의 역할은 이제 의문시되고 있습니다."
 sov_nationalists_news.11.a: "제국주의의 역습."
 sov_nationalists_news.12.t: "안드레이 로마노프의 대관식"
 sov_nationalists_news.12.d: "안드레이 로마노프가 제국의 역사가 깊이 서린 장소인 모스크바 우스펜스키 대성당에서 열린 의식에서 러시아 제국의 황제로 대관했습니다. 대관식에는 국가 관리, 세계 지도자, 군주주의자들, 그리고 섭정 [SOV.GetLeader]이(가) 모였습니다. 공개 연설에서 새 황제는 니콜라이 2세와의 연속성을 주장하고 러시아 제국 유산의 부활을 선언했습니다. 그는 또한 [SOV.GetLeader]을(를) 새 차르 정부의 수반으로 지지했습니다. 이러한 지지에도 불구하고 새 헌법은 황제의 역할을 높여, [SOV.GetLeader]의 영향력이 쇠퇴할 가능성을 시사합니다."
 sov_nationalists_news.12.a: "제국주의의 역습."
 sov_nationalists_news.28.t: "러시아의 신성 섭정"
 sov_nationalists_news.28.d: "러시아의 차기 황제를 둘러싼 오랜 논의 끝에, 섭정 [SOV.GetLeader]은(는) 자격 있는 후보가 없다고 선언하여 국민을 놀라게 했습니다. 그는 임시 섭정을 해산하고 스스로를 신성 섭정이자 러시아의 유일한 정통 황제로 선포했습니다. '역사적 정의'를 회복하라는 신성한 의무를 내세우며 [SOV.GetLeader]은(는) 권력을 완전히 자신의 손에 집중시켰습니다. 이 선언의 법적 근거는 불분명하지만, 어떤 내부 세력도 그의 권위에 도전하지 못할 것은 분명합니다. 팽창과 지배에 대한 그의 야망은 이제 완전히 제약에서 풀렸습니다."
 sov_nationalists_news.28.a: "이 무슨 광기인가!"
 sov_nationalists_news.13.t: "제3의 로마"
 sov_nationalists_news.13.d: "텔레비전 연설에서 [SOV.GetLeader]은(는) 현대 러시아가 단순한 국가의 역할을 초월했다고 선포했습니다. 그는 러시아가 로마 제국의 유산을 되살림으로써 영적 사명을 완수했으며, 따라서 '제3의 로마'가 일어서야 한다고 주장했습니다. 이 발언은 국제 관측통들을 아연실색하게 했으며, 그들은 이제 그 잠재적인 지정학적 파장을 우려하고 있습니다. 이 조치는 러시아의 자기 정체성과 미래 야망에 근본적인 변화가 있음을 시사합니다. 세계는 새로운 이념 시대의 시작을 목격하고 있는지도 모릅니다."
 sov_nationalists_news.13.a: "그게 대체 무슨 뜻이란 말인가?"
 sov_nationalists_news.14.t: "중앙아시아를 침공하는 러시아"
 sov_nationalists_news.14.d: "러시아 정부는 중앙아시아에서 전면적인 군사 작전을 개시했습니다. 모스크바는 중앙아시아 국가들이 러시아 혐오 정책을 추구하고, 러시아계 주민을 억압하며, 러시아 내부를 불안정하게 하는 무분별한 이주를 허용했다고 비난합니다. 러시아 국가 원수는 또한 이 영토들이 정당하게 러시아의 것이라고 선언했습니다. 국제적 반응은 신속했으며, 이웃 국가들과 국제 열강들이 이 침략을 규탄했습니다. 서방의 제재와 외교적 보복이 뒤따를 것으로 예상됩니다."
 sov_nationalists_news.14.a: "새로운 제국주의 시대"
 sov_nationalists_news.15.t: "우크라이나를 침공하는 러시아"
 sov_nationalists_news.15.d: "러시아가 우크라이나에 대한 대규모 침공을 발표했습니다. 국민 연설에서 [SOV.GetLeader]은(는) 우크라이나의 영토가 러시아 선조의 땅의 일부라고 주장하고 우크라이나 국가를 '반러시아 프로젝트'라고 규정했습니다. 그는 현대 우크라이나를 '말로로시야'라고 부르며 그 귀환을 '역사적 의무'라고 했습니다. 국제적 규탄이 즉각 이어졌습니다. 서방 국가들은 이 침공이 유럽 안보에 대한 중대한 위협이라고 선언하고 우크라이나에 대한 경제적, 군사적 지원을 약속했습니다. 이 분쟁이 전개됨에 따라 세계의 세력 균형이 곧 바뀔 수도 있습니다."
 sov_nationalists_news.15.a: "최선을 바라자"
 sov_nationalists_news.16.t: "벨라루스를 압박하는 러시아"
 sov_nationalists_news.16.d: "러시아는 벨라루스에 반자치 총독령으로 러시아에 통합할 것을 요구하는 공식 최후통첩을 보냈습니다. 이 최후통첩은 국제 사회에 충격을 안겼습니다. 벨라루스 외무부는 이 제안을 예상 밖이자 우려스러운 것이라고 묘사했습니다. 벨라루스가 이 요구에 굴복할지, 아니면 이것이 모스크바의 전략적 허세에 불과한지는 불분명합니다. 긴장이 고조된 가운데 이웃 국가들은 민스크가 어떻게 대응할지 주시하고 있습니다."
 sov_nationalists_news.16.a: "얼마나 스트레스 받는 일인가"
 sov_nationalists_news.17.t: "발트 국가들을 압박하는 러시아"
 sov_nationalists_news.17.d: "충격적인 최후통첩에서 러시아는 발트 3국을 반자치 총독령으로 자국 영토에 편입할 것을 요구했습니다. 이 발표는 국제 사회를 뒤흔들었습니다. 발트 지도자들은 긴급 회의를 열고 이 최후통첩을 '예상했지만 매우 불안한 것'이라고 평했습니다. 그러나 통일된 대응은 어려운 것으로 드러났습니다. 군사적 확전에 대한 우려가 커지면서, 나토와 EU 지도자들이 다음 행보를 숙고하는 가운데 이 지역에는 불확실성이 드리우고 있습니다."
 sov_nationalists_news.17.a: "얼마나 스트레스 받는 일인가"
 sov_nationalists_news.18.t: "조지아를 압박하는 러시아"
 sov_nationalists_news.18.d: "러시아는 조지아에 러시아 연방의 반자치 일부가 될 것을 요구하는 최후통첩을 전달했습니다. 조지아 정부는 신속히 긴급 회의를 소집하고 이 최후통첩을 직접적인 위협이라고 묘사했습니다. 러시아군은 이미 조지아와 접한 분리 공화국들 근처에 배치되어 있어, 요구가 거부될 경우 군사 행동이 있을 가능성이 높음을 시사합니다. 조지아가 잠재적 확전에 대비하는 가운데 상황은 여전히 긴장되어 있습니다."
 sov_nationalists_news.18.a: "얼마나 스트레스 받는 일인가"
 sov_nationalists_news.19.t: "몰도바를 압박하는 러시아"
 sov_nationalists_news.19.d: "몰도바는 반자치 총독령으로 러시아에 편입할 것을 요구하는 최후통첩과 함께 러시아의 압박을 받는 최신 표적이 되었습니다. 몰도바 관리들은 긴급 회의에서 놀라움을 표하며, 트란스니스트리아에 주둔한 러시아군을 불길한 징조로 언급했습니다. 정부는 분쟁 가능성에 대비하고 있으며, 국제 관측통들은 동유럽에서 모스크바의 점점 더 공격적인 태도에 우려를 표하고 있습니다."
 sov_nationalists_news.19.a: "얼마나 스트레스 받는 일인가"
 sov_nationalists_news.20.t: "동아시아에 대한 영유권을 선언하는 러시아"
 sov_nationalists_news.20.d: "기자 회견에서 [SOV.GetLeader]은(는) 동아시아의 여러 영토, 특히 몽골과 만주에 대한 러시아의 영유권을 주장했습니다. 그는 전략적 중요성을 내세우며 이 지역들이 러시아의 새로운 정책 의제의 일부라고 선언했습니다. 그는 평화적 해결을 선호한다고 주장했지만 군사적 선택지를 배제하지는 않았습니다. 그는 또한 일본의 역사적 행위를 비판하며 공개 사과를 요구했습니다. 이에 대해 몽골, 중국, 일본은 러시아의 발언이 도발적이고 비현실적이라고 규탄했습니다. 이 지역은 이제 새로운 불안정을 우려하며 긴장하고 있습니다."
 sov_nationalists_news.20.a: "말뿐이기를 바란다"
 sov_nationalists_news.21.t: "몽골을 압박하는 러시아"
 sov_nationalists_news.21.d: "러시아는 몽골에 러시아 통제 아래 반자치 총독령이 될 것을 요구하는 최후통첩을 보냈습니다. 몽골 정부는 이 최후통첩이 불안을 야기한다고 말하며 위협을 평가하기 위한 긴급 회의를 소집했습니다. 국제 사회는 이 상황 전개가 실질적인 침략의 신호인지 계산된 위협인지 확신하지 못한 채 면밀히 주시하고 있습니다. 어느 쪽이든 이 지역의 세력 균형은 변화하고 있을지도 모릅니다."
 sov_nationalists_news.21.a: "얼마나 스트레스 받는 일인가"
 sov_nationalists_news.22.t: "태평양에서 주둔을 확대하는 러시아"
 sov_nationalists_news.22.d: "UN 회의 중 일본 총리는 러시아가 태평양에서 군사적 주둔을 크게 늘리고 있다고 비난했습니다. 그는 이러한 움직임이 장래의 침공을 위한 준비를 의미할 수 있다고 경고했습니다. 러시아의 UN 대표는 이러한 주장을 부인하며 병력 증강이 예정된 군사 훈련과 관련된 것이라고 주장했습니다. 그럼에도 양국 간 긴장은 계속 높아지고 있으며 분쟁 가능성이 커지고 있습니다. 외교 채널은 당분간 열려 있습니다."
 sov_nationalists_news.22.a: "얼마나 스트레스 받는 일인가"
 sov_nationalists_news.23.t: "아르메니아를 압박하는 러시아"
 sov_nationalists_news.23.d: "러시아는 최근 아르메니아가 폭넓은 자치와 영토 반환 약속과 함께 러시아 국가에 합류할 것을 제안했습니다. 이 제안에는 아르메니아가 거부할 경우 군사 개입을 하겠다는 은근한 위협도 포함되어 있었습니다. 아르메니아 관리들은 이 제안을 '이상하고 무서운 것'이라고 표현하며 현재 대응 방안을 논의하고 있습니다. 이 최후통첩은 국제 사회를 불안하게 했으며, 지역은 아르메니아의 결정을 면밀히 주시하고 있습니다."
 sov_nationalists_news.23.a: "참으로 기이한 최후통첩이다"
 sov_nationalists_news.24.t: "작전 '그릴'"
 sov_nationalists_news.24.d: "러시아는 아제르바이잔이 지역을 불안정하게 하고 러시아인과 아르메니아인에 대한 집단 학살을 저질렀다고 비난하며 아제르바이잔에 대한 군사 작전을 개시했습니다. 외무부는 러시아가 캅카스의 기독교인을 보호할 도덕적 의무가 있다고 선언했습니다. 분석가들은 이 작전이 아제르바이잔의 귀중한 석유 매장량을 확보하려는 목적도 있으며, 이것이 작전의 원동력일 수 있다고 봅니다. 국제 사회의 반응은 신속하고 비판적이었으며, 지역 내 추가 확전에 대한 우려가 커지고 있습니다."
 sov_nationalists_news.24.a: "상당히 무섭다."
 sov_nationalists_news.29.t: "튀르키예 국경에서의 군사 훈련"
 sov_nationalists_news.29.d: "러시아는 튀르키예 국경 인근에서 대규모 합동 군사 훈련을 시작했습니다. 공식 발표에 따르면 이 훈련은 '신제국주의 세력'의 가상 침공에 대한 대응을 모의하도록 설계되었습니다. 훈련에는 항공 작전, 도시전 모의 훈련, 해상 침공이 포함됩니다. 튀르키예는 이 기동 훈련을 강력히 규탄하며, 이러한 행동이 전면전을 위한 준비와 유사하다고 경고했습니다. 이 상황은 지역의 긴장을 높이고 국제적인 우려를 불러일으켰습니다."
 sov_nationalists_news.29.a: "상당히 무섭다."
 sov_nationalists_news.25.t: "새로운 십자군을 선언하는 러시아"
 sov_nationalists_news.25.d: "논란이 된 연설에서 러시아 국가 원수는 동방의 기독교 인구가 박해와 집단 학살에 직면해 있다고 선언했습니다. 그는 러시아가 세계 기독교의 수호자로서의 책무를 맡아야 한다고 촉구했습니다. '새로운 십자군'의 시작을 선언하며 그는 필요한 모든 수단을 동원해 기독교 공동체를 보호하고 문화유산을 지키겠다고 맹세했습니다. 이 발표는 이슬람 세계 전역에서 분노를 불러일으켰습니다. 통일된 대응으로 이슬람 국가들은 어떠한 침략에도 저항하고 주권을 수호하겠다고 다짐했습니다."
 sov_nationalists_news.25.a: "아베 마리아!"
 sov_nationalists_news.26.t: "이스탄불 통합을 계획하는 러시아"
 sov_nationalists_news.26.d: "튀르키예에서의 러시아 군사 행동에 이어 러시아 국가 원수는 이스탄불을 방문하여 이 도시를 러시아 국가에 통합할 계획을 발표했습니다. 그는 이스탄불이 역사적 이름인 콘스탄티노폴리스로 개명될 것이라고 선언했습니다. 또한 그는 도시에 남아 있는 저항 세포를 제거하기 위한 대대적인 경찰 작전이 필요하다고 강조했습니다. 이 발표는 국제 사회의 강한 반응을 불러일으켰으며, 많은 이들이 이를 전략적 조치이자 상징적 도발로 보고 있습니다."
 sov_nationalists_news.26.a: "흥미롭군."
 sov_nationalists_news.27.t: "유럽에 도전하는 러시아"
 sov_nationalists_news.27.d: "고위 관리들 앞에서 한 대담한 연설에서 [SOV.GetLeader]은(는) 서방 열강이 러시아 제국과 소련의 붕괴를 획책했다고 비난했습니다. 그는 서방의 오랜 목표가 러시아를 약하고 분열된 상태로 유지하는 것이라고 주장했습니다. 서방의 패권 종식을 선언하며 그는 유럽에서 러시아의 지도적 권리를 주장했습니다. 유럽 지도자들은 러시아와의 분쟁이 곧 불가피해질 수 있다고 경고하며 신속히 대응했습니다. 방위 예산은 이미 증액되고 있으며 대륙 전역에서 군사 대비 태세가 점검되고 있습니다."
 sov_nationalists_news.27.a: "흥미롭군."
