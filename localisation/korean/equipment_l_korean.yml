 Rec_tank_6: "Light Tank 2045"
 Rec_tank_6_desc: "Light Tanks, a mainstay of World War 2 armies, are now only used in peripheral roles, where the weight and size of Main Battle Tanks hinders them from being employed. Light Tanks are used by the most heavily armored Recce units, and also have the advantage of being Air-droppable, and are also often used in Amphibious roles. They are often based on IFV-hulls instead of being designed from the ground up. They are much better in bad terrain, such as mountains and forests, than Main Battle Tanks."
