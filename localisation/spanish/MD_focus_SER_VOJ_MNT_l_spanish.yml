l_spanish:
 serbian_focus: "Árbol de enfoque serbio"
 SER_the_high_castle: "El castillo alto"
 SER_the_high_castle_desc: "A country is only as strong as the government leading it. We must secure it and decide on the path we want to go. Shall we keep to the 'old guard' or head down a new path?"
 SER_begin_repairing_works1: "Empecemos a reconstruir el país"
 SER_begin_repairing_works1_desc: "Las consecuencias de los bombardeos de la OTAN han supuesto un golpe terrible para nuestra economía, pero es hora de levantarnos como el fénix y empezar a restaurar lo que se perdió."
 SER_deals_with_criminal_world: "Trato con los jefes del crimen"
 SER_deals_with_criminal_world_desc: "Hasta ahora no podemos combatir el crimen que se ha extendido por nuestro país, pero podemos concluir una serie de acuerdos con ellos para reducir su influencia sobre nosotros y nuestro país."
 SER_enforcement_of_kleptocracy: "Empecemos a reprimir a los cleptócratas"
 SER_enforcement_of_kleptocracy_desc: "Finalmente estamos listos para comenzar a reducir la influencia de los cleptócratas en nuestro país, en pequeños pasos, nos liberaremos de su influencia."
 SER_anti_opposition_measures: "Luchando contra la oposición"
 SER_anti_opposition_measures_desc: "La precaria posición de nuestro gobierno, después de tan terribles acontecimientos, se convirtió en una excusa para que la oposición nos presionara: nos ocuparemos de ellos."
 SER_demonstrative_anti_corruption_actions: "Lucha demostrativa contra la corrupción"
 SER_demonstrative_anti_corruption_actions_desc: "La situación de corrupción ha llegado a su punto máximo, pero los ciudadanos deben estar tranquilos: organizaremos una lucha de exhibición contra aquellos funcionarios corruptos que podamos atrapar."
 SER_peacefulize_the_plebs: "Calma a la plebe"
 SER_peacefulize_the_plebs_desc: "El pueblo se encuentra en un estado en el que un acontecimiento aleatorio o la persona adecuada en el lugar adecuado pueden iniciar un incendio revolucionario; es necesario prevenir esas oportunidades."
 SER_debt_reconstructuring: "Reestructuración de deuda"
 SER_debt_reconstructuring_desc: "Nuestra deuda se ha apoderado demasiado de nosotros. Debemos abordar este problema para evitar que nos paralice aún más en el futuro."
 SER_stabilization_measures: "Medidas de estabilización"
 SER_stabilization_measures_desc: "Para garantizar la estabilidad de la economía, debemos adoptar medidas que eviten crear un entorno que la haga inestable y débil. Pongamos en práctica algunas ahora para garantizar la seguridad de nuestra economía."
 SER_the_castle_crumbles: "El castillo se derrumba"
 SER_the_castle_crumbles_desc: "\n\n\n\n\n\n£SER_desctext_milocevic \n\n\n\n\n\n\n\n\n§H[ROOT.GetLeader]§!'s reign has been riddled with instability, lack of leadership, and a whole lot of war crimes. \nThe §HBulldozer revolution§! as some are calling it, may spark the end of Milošević's rule and bring about a new '§CDemocratic§!' order in [SER.GetFlag]§Y[SER.GetName]§!.\n\nIf §Rresistance§! is not quelled by late October, then the §HBulldozer revolution§! will be in full swing. §YMilošević§! will have a certain amount of control over the nation, but if his power does not reach §H100%§! by the end of the §Rrevolution§!, then his time may very well be up.\n\n £text_icon_milocevic Milošević's Strength: §Y[?SER_milosevic_strength]§!"
 SER_the_revolution: "§RLa revolución§!"
 SER_the_revolution_desc: "The Bulldozer revolution will mark the end of [ROOT.GetLeader]'s rule."
 SER_negotiations: "§YNegociaciones§!"
 SER_negotiations_desc: "We're gonna have to call for some negotiations with some of the weaker factions protesting."
 SER_appeal_to_nationalists: "§YLlamamiento§! a los nacionalistas!"
 SER_appeal_to_nationalists_desc: "Los partidarios más firmes de nuestro partido y del orden gobernante son los nacionalistas. Tendremos que apaciguarlos."
 SER_suppress_dissent: "§RReprimir§! Disentir"
 SER_suppress_dissent_desc: "Some suppression of opposition movements will be necessary to get them off of the streets."
 SER_selective_repression: "Represión §Rselectiva§!"
 SER_selective_repression_desc: "Al eliminar objetivos específicos y claves podremos debilitar el movimiento de resistencia."
 SER_mafia_concessions: "Concesiones de la §Ymafia§!"
 SER_mafia_concessions_desc: "Hacer concesiones a la mafia nos permitirá ganarla para nuestro lado."
 SER_utilize_mafia: "§RUtilizar§! la mafia"
 SER_utilize_mafia_desc: "We can contact the mafia and ask them to do some of the dirty work for us."
 SER_russian_involvement: "[SOV.GetFlag]§YYRuso§! Participación"
 SER_russian_involvement_desc: "Algunos elementos del gobierno ruso están más que felices de darnos una mano para frenar este movimiento de resistencia."
 SER_choke_the_media: "§RAhorcar§! a los Medios"
 SER_choke_the_media_desc: "Los medios de comunicación están alimentando el fuego que arde en nuestra nación. Para evitar que la información siga propagándose, tendremos que ahogarlos."
 SER_constitutional_manipulation: "§YManipulación Constitucional§!"
 SER_constitutional_manipulation_desc: "Vamos a tener que manipular un poco la constitución para que nos dé algunas lagunas para mantener a nuestro partido en el poder."
 SER_divisionary_tactics: "§YTácticas Divisionarias§!"
 SER_divisionary_tactics_desc: "Al provocar divisiones en el movimiento de oposición podremos dividir y vencer los disturbios."
 SER_milosevic_power_10: "§GAumentará§! £text_icon_milocevic §HFuerza de Milosevic§! en §G10§!"
 SER_milosevic_power_5: "§GAumentará§! £text_icon_milocevic §HFuerza de Milosevic§! en §G5§!"
 SER_milosevic_power_1: "§GAumentará§! £text_icon_milocevic §HFuerza de Milosevic§! en §G1§!"
 SER_revolution2_TT: "§RMilošević será Derrocado!§!"
 SER_revolution3_TT: "§RMilošević mantendrá el Poder!§!"
 SER_The_kleptocratic: "El cleptocrático"
 SER_The_kleptocratic_desc: "An elite group within our nation which steal from the people in infuriatingly legal ways, they all hold positions of power in different places, whether it's a political leader, crime boss, or even religious figure."
 SER_International_Isolation: "Aislamiento internacional"
 SER_International_Isolation_desc: "Nos encontramos en aislamiento internacional, después de nuestras acciones en el territorio de la ex Yugoslavia, ahora nuestro país tendrá que buscar formas de superar esta barrera."
 SER_nato_bombings_scars_idea: "Consecuencias de los bombardeos de la OTAN"
 SER_nato_bombings_scars_idea_desc: "Los bombardeos de la OTAN causaron daños importantes a nuestro país, muchos edificios e infraestructuras resultaron dañados. Ahora tenemos que afrontar las consecuencias de esta pesadilla."
 SER_brain_drain_idea_1: "Fuga de cerebros"
 SER_brain_drain_idea_1_desc: "Los acontecimientos del siglo pasado se han hecho sentir, los jóvenes huyen de las ruinas en busca de una vida mejor, y hay que traerlos de vuelta o detenerlos para que el país no se quede sin personal experimentado."
 SER_avia1: "Fuerza Aérea Reformada"
 SER_special_unit_idea: "Unidad de operaciones especiales"
 SER_special_unit_idea_desc: "La Unidad de Operaciones Especiales o Unidad de Operaciones Especiales, también conocida como Boinas Rojas o Frankies, era una unidad policial de fuerzas especiales de élite."
 SER_plebs_idea: "Medidas para calmar a la plebe"
 SER_antiopposition_activity_idea: "Lucha contra la oposición"
 SER_demonstrative_anticorrup_idea: "Lucha demostrativa contra la corrupción"
 SER_stable_measure: "Medidas de estabilización"
 SER_stable_measure_desc: "Distribuir dinero para mantener al pueblo bajo control."
 SER_debt_reconstructure: "Reestructuración de deuda"
 SER_debt_reconstructure_desc: "Para ayudar a controlar nuestra situación de deuda, estamos ganando tiempo asegurándoles a quienes les debemos y pidiendo tasas de interés más bajas temporalmente para hacer más fácil el proceso de pago."
 SER_milosevic_stays: "§YSlobodan Milošević no abandona el cargo tras las elecciones de 2000§!"
 SER_milosevic_leaves: "§YSlobodan Milošević deja el cargo tras las elecciones de 2000§!"
 SER_bulldozer_died: "La §HRevolución Bulldozer§! debe haber sido §RAplastada!§!"
 SER_bulldozer_revolution: "Revolución Bulldozer"
 SER_castle_holds_strong: "El castillo se mantiene fuerte"
 SER_castle_holds_strong_desc: "La autoridad de Milošević sigue siendo fuerte, la fuerza de la oposición democrática parece haber sido exagerada. Milošević conducirá a Serbia hacia el nuevo milenio, saldremos de él con grandeza, Jaka Srbija, Jaka Yugoslavija."
 SER_milosevic_authority: "Autoridad de Milošević"
 SER_milosevic_authority_desc: "Milošević debe garantizar la seguridad y la estabilidad de su puesto. Derribaremos a los más verbales que hablen en su contra y protegeremos sus intereses."
 SER_increase_centralization: "Fortalecer la centralización"
 SER_increase_centralization_desc: "Fortaleceremos el control sobre las esferas estatales, no permitiremos una segunda revolución."
 SER_purge_kleptocratic: "Purgar a los cleptocráticos"
 SER_purge_kleptocratic_desc: "Debemos derrocar a quienes tienen mucho poder y se llevan mucho dinero, lo que nos cuesta un precioso dinar. Echémoslos rápidamente para proteger nuestros mejores intereses: el dinero."
 SER_crack_down_on_crime: "Fortalecer la lucha contra el crimen"
 SER_crack_down_on_crime_desc: "Por fin estamos dispuestos a poner fin al crimen organizado a gran escala en nuestro país."
 SER_anti_corruption_measures: "Lucha real contra la corrupción"
 SER_anti_corruption_measures_desc: "Todos aquellos que sean detectados en relaciones corruptas serán vigilados por nosotros con más atención y cuidado."
 SER_crush_the_opposition: "Aplastar a la oposición"
 SER_crush_the_opposition_desc: "Hemos consolidado nuestro poder, es hora de enfrentar finalmente a la oposición."
 SER_extinguish_opposition_support: "Último apoyo a la oposición"
 SER_extinguish_opposition_support_desc: "Estamos cerca del control total sobre la esfera política de nuestro país."
 SER_empower_kleptocratic: "Empoderar a los cleptocráticos"
 SER_empower_kleptocratic_desc: "Eliminarlos puede parecer una buena idea, pero cuando uno cae en un pozo de deuda e inseguridad nacional debido a ello, ¿a quién desearía tener para que le ayude a salir?"
 SER_criminal_government: "Poner a los criminales en el poder"
 SER_criminal_government_desc: "Permitiremos que elementos bandidos ocupen puestos gubernamentales importantes, a cambio de un precio, por supuesto."
 SER_criminal_oligarchs: "Oligarca en el poder"
 SER_criminal_oligarchs_desc: "La oligarquía también puede ocupar cargos públicos, volvemos a correr riesgos, pero vale la pena."
 SER_arkans_guard: "Guardia de Arkan"
 SER_arkans_guard_desc: "Debemos impulsar un ejército más fuerte. La Guardia de Arkan, nuestra mejor fuerza paramilitar, apoyará a nuestro ejército por ahora."
 SER_expand_arkan_tigers: "Expandir los Tigres de Arkan"
 SER_expand_arkan_tigers_desc: "Los Tigres de Arkan son esenciales en el complejo militar que tenemos. Vamos a darles un lugar adecuado en la mesa, por así decirlo."
 SER_russo_comaraderie_make_invest: "Camaradería Ruso-Serbia"
 SER_russo_comaraderie_make_invest_desc: "Los rusos nos ayudarán a construir bien, siendo buenos amigos. Hagamos algunos tratos y solucionemos este problema de aislamiento que tenemos."
 SER_russian_trade_deal: "Acuerdo Comercial Ruso"
 SER_russian_trade_deal_desc: "Algunos buenos tratos para asegurar nuestra relación con los rusos nos traerán absolutamente beneficios, y todos los materiales con ellos."
 SER_chinese_investments: "Acuerdo Comercial Chino"
 SER_chinese_investments_desc: "Los socios chinos están mostrando activamente interés en comerciar con nosotros, deberíamos corresponderles."
 SER_ease_isolation: "Acuerdos Comerciales Euroasiáticos"
 SER_ease_isolation_desc: "Nuestra cooperación ha dado frutos, y nuestro aislamiento internacional está comenzando a resquebrajarse por las costuras."
 SER_pro_serbian_referendum: "Referéndum Nacional Serbio"
 SER_pro_serbian_referendum_desc: "Our nation must choose a new path for itself in the new millennium. Or maybe we will decide for them?"
 SER_milocevic_power: "Poder de Milosevic"
 SER_idea_arkans_guard: "Guardia de Arkan"
 SER_idea_arkans_guard_desc: "Una Guardia Voluntaria Serbia reformada para operaciones militares especiales que debemos llevar a cabo para la seguridad de las naciones que amenazan a Serbia."
 SER_idea_arkans2_guard: "Guardia de Arkan"
 SER_idea_arkans2_guard_desc: "Una Guardia Voluntaria Serbia reformada para operaciones militares especiales que debemos llevar a cabo para la seguridad de las naciones que amenazan a Serbia."
 SER_police_won: "Aumento de la Lucha contra el Crimen"
 ser_deals.1.t: "[SER.GetName] Solicita Inversiones"
 ser_deals.1.d: "[SER.GetName] envió una solicitud a nuestro gobierno con una propuesta para invertir en su economía. Esta propuesta parece prometedora para nosotros, porque la economía serbia apenas está comenzando a recuperarse y tal vez en el futuro nuestras inversiones den sus frutos."
 ser_deals.1.a: "Estamos de acuerdo en invertir en ellos"
 ser_deals.1.b: "Absolutamente no!"
 ser_deals.2.t: "[FROM.GetName] ha acordado invertir en nuestro país"
 ser_deals.2.d: "[FROM.GetName] ha acordado invertir en nuestro país. Ahora sus inversores construirán sus propias instalaciones de producción en nuestro país, lo que ayudará a revivir nuestra economía más rápidamente."
 ser_deals.2.a: "Bien"
 ser_deals.3.t: "[FROM.GetName] se ha negado a invertir en nuestro país"
 ser_deals.3.d: "[FROM.GetName] se negó a invertir en nuestro país, parece que no ven el potencial en el desarrollo de nuestra economía."
 ser_deals.3.a: "Triste"
 SER_MNT_give_up: "[MNT.GetFlag] §HMontenegro§! §Gdejará§! de §Hpresionar por la independencia§!"
 SER_turn_back_to_communist_ideals: "Regreso a los Ideales Comunistas"
 SER_turn_back_to_communist_ideals_desc: "Una vez más, nuestro país está regresando al comunismo, se nos ha dado una segunda oportunidad para devolver la bandera roja a las tierras de la antigua Yugoslavia."
 SER_cult_of_tito_cult_of_milosevic: "El Culto a Milosevic"
 SER_cult_of_tito_cult_of_milosevic_desc: "Al igual que su predecesor, Tito, Milosevic, habiendo salvado al país, logró formar una especie de culto a su alrededor y convertirse en un ídolo para los comunistas que creen en el renacimiento de Yugoslavia."
 SER_nationalisation_begins: "Comenzar la Nacionalización"
 SER_nationalisation_begins_desc: "Devolveremos lo que nos fue arrebatado por la privatización, lo que fue arrebatado al pueblo y al país."
 SER_power_to_the_workers: "Invertir en la Clase Trabajadora"
 SER_power_to_the_workers_desc: "We will focus on the working class, which will be the engine of growth of our economy."
 SER_authoritarian_control_over_government: "Control Autoritario sobre el Gobierno"
 SER_authoritarian_control_over_government_desc: "No permitiremos que surjan sentimientos traicioneros en el Gobierno nuevamente. El gobierno estará completamente subordinado a nosotros."
 SER_authoritarian_control_over_economy: "Control Autoritario sobre la Economía"
 SER_authoritarian_control_over_economy_desc: "The economic sphere of our state was left to chance, but now we will bring it back under the control of a strong leader."
 SER_reyugoslavication: "De Vuelta al Sueño de Yugoslavia"
 SER_reyugoslavication_desc: "No pretendemos dejar que nuestros enemigos vean a Yugoslavia y los sueños de su revitalización desvanecerse en el pasado. Estamos comenzando nuestra \"cruzada\" para revivir el antiguo estado."
 SER_new_const: "Nueva Constitución"
 SER_new_const_desc: "A new state requires a new constitution. We will rewrite it and create an option that will not repeat the mistakes of the past."
 SER_marxism: "Traer el Marxismo de Vuelta a las Escuelas"
 SER_marxism_desc: "Enseñaremos a la joven generación el marxismo desde una edad temprana, para no sufrir una derrota ideológica como antes."
 SER_atheism: "Ateísmo como Religión Estatal"
 SER_atheism_desc: "Every Person should not be distracted by religious rituals, but carry the light of development and science to the masses."
 SER_proletariat: "Ideología del Proletariado"
 SER_proletariat_desc: "Centraremos nuestra propaganda ideológica en el proletariado para que en el futuro este proletariado no repita el colapso del país como antes."
 SER_four_year_plan_prepare: "Preparación para el Plan de 4 Años"
 SER_four_year_plan_prepare_desc: "Estamos listos para comenzar a prepararnos para el primer plan de 4 años para el desarrollo de nuestra economía."
 SER_worker_rights: "Derechos de los Trabajadores"
 SER_worker_rights_desc: "Ampliaremos los derechos de los trabajadores y evitaremos el abuso contra ellos."
 SER_four_year_plan_start: "Iniciar un Plan Económico de 4 Años"
 SER_four_year_plan_start_desc: "We are ready to start making our 4-year economic development plan a reality."
 SER_nep: "Nueva Política Económica"
 SER_nep_desc: "Adoptaremos activamente la experiencia de los países soviéticos, incluida la URSS, e implementaremos nuestra propia versión de la nueva política económica."
 SER_pressure_on_kosovo: "Tratar con Kosovo"
 SER_pressure_on_kosovo_desc: "It's time to deal with this separatist pseudo-state."
 SER_crush_croatia: "Ultimátum de Croacia"
 SER_crush_croatia_desc: "Croacia fue uno de esos estados que hizo todo lo posible por el colapso de Yugoslavia, pero haremos todo lo posible para devolverla, ya sea pacíficamente o por la fuerza."
 SER_avenge_bosnia: "Venganza contra Bosnia"
 SER_avenge_bosnia_desc: "No nos andaremos con rodeos con el gobierno bosnio por mucho tiempo: un ultimátum o la guerra."
 SER_ultimatums_for_slovenia_and_macedonia: "Eslovenia y Macedonia"
 SER_ultimatums_for_slovenia_and_macedonia_desc: "These countries will not be able to resist us strongly, such as Bosnia or Croatia, but we are still ready for a military option if they refuse our ultimatum."
 SER_pheonix_nation: "La Nación Fénix"
 SER_pheonix_nation_desc: "Nuestra gente, nuestro gran país ha renacido como un fénix."
 SER_ter_oborona: "Revivir la Defensa Territorial"
 SER_ter_oborona_desc: "La Defensa Territorial de Yugoslavia fue creada en los años 60, y la reviviremos de nuevo. Después de todo, cada ciudadano debe estar preparado para defender su país, independientemente de si es militar o no."
 SER_integrate_yugoslavia_category: "Integración de las Tierras Yugoslavas"
 SER_integrate_yugoslavia_category_desc: "\n\n\n\n\n\n£SER_desctext_yugoslavia \n\n\n\n\n\n\n\n\n§YYugoslavia§! fue fragmentada y destruida, y la §YYugoslav§! identidad misma fue borrada de la faz de la tierra. Ahora reviviremos el estado una vez más, reviviremos la identidad yugoslava y esta vez no cometeremos los errores del pasado"
 SER_bosnia_return: "Integración de §Y[BOS.GetFlag]Bosnia§!"
 SER_croatia_returns: "Integración de §Y[CRO.GetFlag]Croacia§!"
 SER_slovenia_returns: "Integración de §Y[SLV.GetFlag]Eslovenia§!"
 SER_macedonia_returns: "Integración de §Y[FYR.GetFlag]Macedonia§!"
 SER_ter_oborona_category: "Defensa Territorial de Yugoslavia"
 SER_ter_oborona_category_desc: "La Defensa Territorial de §Y[SER.GetFlag]Yugoslavia§! fue creada en los años 60, y la reviviremos de nuevo. Después de todo, cada ciudadano debe estar preparado para §Gdefender§! su [SER.GetFlag]§Ypaís§!, independientemente de si es militar o no"
 SER_ter_oborona_serbia: "Defensa Territorial de §Y[SER.GetFlag]Serbia§!"
 SER_ter_oborona_bosnia: "Defensa Territorial de §Y[BOS.GetFlag]Bosnia§!"
 SER_ter_oborona_croatia: "Defensa Territorial de §Y[CRO.GetFlag]Croacia§!"
 SER_ter_oborona_slovenia: "Defensa Territorial de §Y[SLV.GetFlag]Eslovenia§!"
 SER_ter_oborona_macedonia: "Defensa Territorial de §Y[FYR.GetFlag]Macedonia§!"
 SER_new_workplace: "Nuevos Lugares de Trabajo"
 SER_control_economic_idea: "Economía Controlada"
 SER_phoenix_nation_idea: "La Nación Fénix"
 SER_control_government_idea: "Gobierno Controlado"
 SER_marxist_reeducation_idea: "Marxismo en las Escuelas"
 SER_new_constitution_idea: "Nueva Constitución"
 SER_proletariat_idea: "Ideología del Proletariado"
 SER_four_year_plan_preparations_idea: "Preparativos para el Plan de 4 Años"
 SER_new_four_year_plan2_idea: "Plan de Desarrollo de 4 Años"
 SER_new_workplace1: "Derechos de los Trabajadores"
 SER_idea_new_economic_policy: "Nueva Política Económica"
 Serbia.18.t: "[SER.GetNameWithFlag] gives us an ultimatum"
 Serbia.18.d: "[SER.GetNameWithFlag] today handed our Government an ultimatum on immediate surrender and the beginning of integration into their state. It looks like they are planning to take back Yugoslavia, will we surrender?"
 Serbia.18.a: "Absolutamente no!"
 Serbia.18.b: "Nos rendimos"
 Serbia.25.t: "[FROM.GetNameWithFlag] rejected our ultimatum."
 Serbia.25.d: "Se negaron a cumplir con nuestras demandas y decidieron elegir una solución forzosa al problema. No nos importa."
 Serbia.25.a: "Muy Desafortunado."
 Serbia.26.t: "[FROM.GetNameWithFlag] has agreed to our ultimatum."
 Serbia.26.d: "Resultaron ser más inteligentes de lo que pensábamos y aceptaron nuestra oferta."
 Serbia.26.a: "Bien"
 SER_renewed_milosevic_serbia: "Serbia Renacida"
 SER_renewed_milosevic_serbia_desc: "Nuestra gente ha emprendido el camino del renacimiento, la recuperación después de tantos años de guerra, humillación y negación de su grandeza."
 SER_the_sick_woman_of_the_coalition: "La Enferma de la Coalición"
 SER_the_sick_woman_of_the_coalition_desc: "La esposa de Milosevic, Mirjana, ha ganado aún más poder de manos de su esposo sobre la vida política en el país, ahora influye en Serbia más que nunca."
 SER_ratify_greater_serbia: "Ratificar la Gran Serbia"
 SER_ratify_greater_serbia_desc: "It is time we ratify Greater Serbia and lay our claim to the lands of Croatia, Bosnia and some of the regions of Western Bulgaria where our people currently reside. Our people need us and it is time we bring them back to the fold. We can focus on securing these territories later, but now is to show all Serbians we wish for their best interests at heart. It is time to bring our people home."
 SER_full_milosevic_dictatorship: "Dictadura de Milosevic"
 SER_full_milosevic_dictatorship_desc: "Milosevic finalmente admitió que el régimen que creó es una dictadura. Pero ¿es una dictadura mala?"
 SER_shut_it_down_forcibly: "Silenciar a la Oposición"
 SER_shut_it_down_forcibly_desc: "Lucharemos activamente contra la opinión política opuesta en nuestro país."
 SER_a_selective_merger: "Pequeña Democracia"
 SER_a_selective_merger_desc: "The opposition will be given freedom of speech in certain media and other sources to reassure people and other observers."
 SER_union_state: "Volver a la Idea de un Estado de la Unión"
 SER_union_state_desc: "El Estado de la Unión es un proyecto de Rusia y Bielorrusia para crear una especie de confederación de dos estados independientes, a la que anteriormente intentamos unirnos pero fracasamos. Volveremos a esta idea nuevamente"
 SER_union_state_propaganda: "Propaganda del Estado de la Unión"
 SER_union_state_propaganda_desc: "Debemos convencer a la gente de nuestro país de que unirse al Estado de la Unión solo nos beneficiará"
 SER_union_state_documents: "Preparar Todos los Documentos"
 SER_union_state_documents_desc: "Comenzaremos el largo proceso de firmar y preparar los documentos necesarios para unirnos al Estado de la Unión"
 SER_union_state_referendum: "Referéndum"
 SER_union_state_referendum_desc: "Ahora estamos listos para llevar a cabo un referéndum sobre la adhesión al Estado de la Unión"
 SER_rise_nation: "El Ascenso de la Nación"
 SER_rise_nation_desc: "La nación serbia se levantará del horror y la vergüenza que ha caído sobre ella en la última década. Es hora de que los serbios vuelvan a ser una gran nación"
 SER_mobilise_people: "Movilización del Pueblo"
 SER_mobilise_people_desc: "Nuestra gente tiene un camino difícil por delante para luchar por el derecho a ser llamados grandes. También debemos estar preparados para la guerra"
 SER_military_invest: "Inversiones en la Industria Militar"
 SER_military_invest_desc: "Es hora de revivir la industria militar, un ejército fuerte necesita una industria fuerte"
 SER_defend_borders: "Protección de Fronteras"
 SER_defend_borders_desc: "Reforzaremos la protección de nuestras fronteras, ¡nadie pasará desapercibido al territorio de la Gran Serbia!"
 SER_military_nation: "Nación Militarizada"
 SER_military_nation_desc: "Nuestra gente está lista para ir a la guerra para recuperar su antigua grandeza, desde el trabajador hasta el soldado, estamos listos para cualquier cosa"
 SER_panteri: "Recrear Garda Panteri"
 SER_panteri_desc: "The Garda Panteri, also known as Specijalna Brigada Garda Panteri , was an elite unit in the Army of Republika Srpska during the Bosnian War. It was founded on 2 May 1992 under the initial name of the Serbian National Guard of SAO Semberija and Majevica , adopting the name \"Garda Panteri\" in honour of previous fallen commander Branko \"Panter\" Pantelić by Ljubiša \"Mauzer\" Savić and members of the Serbian Solidarity Fund. It fought in Bosnia from 1992 to 1996 during the Yugoslav Wars"
 SER_ssd: "Recrear la Dirección de Seguridad del Estado"
 SER_ssd_desc: "La Dirección de Seguridad del Estado, o simplemente Seguridad del Estado, fue la agencia de seguridad dentro del Ministerio de Asuntos Internos de Serbia encargada de proteger al país de amenazas internas."
 SER_nationalise: "Nacionalización"
 SER_nationalise_desc: "La privatización fue un error, ahora es el momento de corregirlo. Devolveremos todo lo que fue arrebatado al estado."
 SER_infra: "Inversiones en Infraestructura"
 SER_infra_desc: "Invertiremos más en el desarrollo de la infraestructura para asegurar una mejor logística en nuestro país."
 SER_demand_serbian_autonomy: "Exigir Autonomía Serbia"
 SER_demand_serbian_autonomy_desc: "Hagamos cumplir un estado serbio independiente y eliminemos cualquier fuerte influencia extranjera."
 SER_orchestrate_referendum: "Orquestar Referéndum"
 SER_orchestrate_referendum_desc: "Debemos llevar a cabo un referéndum! Sabemos lo que quiere la gente y debemos hacer que lo digan. Esta es la mejor manera de legitimar nuestras necesidades."
 SER_reunite_macedonia: "Reunificar Macedonia"
 SER_reunite_macedonia_desc: "Macedonia siempre ha sido parte de Serbia y siempre lo será. Solo tenemos que hacer que eso sea lo que muestren los mapas también."
 SER_srpska_intervention: "Intervención Srpska"
 SER_srpska_intervention_desc: "Bosnia volverá a nosotros. Eso garantizamos. Debemos actuar rápido para no perder tiempo simplemente esperando que vuelvan a nosotros."
 SER_integrate_bosnia: "Integrar Bosnia"
 SER_integrate_bosnia_desc: "Con lo que alguna vez fue Bosnia ahora siendo nuestra, debemos hacerla segura. Implementaremos nuevas políticas y medidas para integrar completamente la tierra y las personas."
 SER_russian_peacekeapers: "Cascos Azules Rusos"
 SER_russian_peacekeapers_desc: "Solicitaremos a Rusia que despliegue un contingente de voluntarios en nuestro territorio"
 SER_integrate_bosnia_category: "Integración de [BOS.GetFlag]Bosnia"
 SER_integrate_bosnia_category_desc: "\n\n\n\n\n\n£SER_desctext_bosnia \n\n\n\n\n\n\n\n\nPara crear una §YGran Serbia [SER.GetFlag]§!, necesitamos §Gintegrar§! todas las §Ytierras bosnias [BOS.GetFlag]§!."
 SER_serpska_returns: "§YIntegrar§! Este Srpska"
 SER_bosnia_returns: "§YIntegrar§! Bosnia"
 SER_herce_returns: "§YIntegrar§! Hercegovina"
 SER_brcko_returns: "§YIntegrar§! Brcko"
 SER_westserbska_returns: "§YIntegrar§! Oeste Srpska"
 SER_unsko_returns: "§YIntegrar§! Unsko-sanski"
 SER_shut_down_opposition: "Partido Expulsado de Creencias Opuestas"
 SER_socialist_merger: "Ideologías Fusionadas"
 SER_rise_serbian_idea: "Pueblo Serbio Renacido"
 SER_serbian_glory_idea: "Gloria a la Gran Serbia"
 SER_border_build_idea: "Protección de la Frontera Estatal"
 SER_ssd_command: "Dirección de Seguridad del Estado"
 SER_rus_peacekeepers: "Cascos Azules Rusos"
 SER_milosevic_dictatorship_tt: "Hace §YSlobodan Milošević§! nuestro líder de por vida!"
 SerbiaFocus.7.t: "Destino de la Republika Srpska"
 SerbiaFocus.7.d: "Llevaremos a cabo nuestro propio referéndum, bajo el pretexto del cual separaremos la Republika Srpska de Bosnia y subyugaremos su gobierno."
 SerbiaFocus.7.a: "Bien"
 SerbiaFocus.8.t: "Rebelión en la Republika Srpska"
 SerbiaFocus.8.d: "Lo suponíamos, pero no podíamos imaginar que sucedería tan rápidamente. En cuanto dimos autonomía a la República Srpska, Belgrado provocó allí una rebelión contra nosotros."
 SerbiaFocus.8.a: "Damn it, we will fight"
 SerbiaFocus.8.b: "Nos rendimos"
 SerbiaFocus.24.t: "[FROM.GetNameWithFlag] Solicita Cascos Azules"
 SerbiaFocus.24.d: "The Serbian government wants us to post a peacekeeping contingent on our territory, because they fear for the re-outbreak of hostilities, will we agree?"
 SerbiaFocus.24.a: "Sí"
 SerbiaFocus.24.b: "No enviaremos cascos azules allí"
 SerbiaFocus.25.t: "[FROM.GetNameWithFlag] Nos Envía Cascos Azules"
 SerbiaFocus.25.d: "El gobierno ruso nos está enviando un contingente de mantenimiento de la paz, ahora estamos a salvo"
 SerbiaFocus.25.a: "Bien"
 SerbiaFocus.26.t: "[FROM.GetNameWithFlag] Se Niega a Enviar Cascos Azules"
 SerbiaFocus.26.d: "El gobierno ruso se ha negado a enviar cascos azules a nuestro territorio"
 SerbiaFocus.26.a: "Triste"
 SerbiaFocus.113.t: ""
 SerbiaFocus.113.d: ""
 SerbiaFocus.113.a: "Bien"
 SER_serbian_perestroika: "La Reestructuración de la Identidad Serbia"
 SER_serbian_perestroika_desc: "Estamos listos para cambiar la esencia misma del pueblo serbio, para abandonar la dominación total en los Balcanes, a cambio estamos listos para imponer a los pueblos balcánicos un proyecto que ha sido olvidado hace mucho tiempo: la Federación Balcánica"
 SER_renewed_image_of_serbia: "Serbia Renovada"
 SER_renewed_image_of_serbia_desc: "Nuestra gente debe pasar por una difícil etapa de repensar nacional quiénes nos vemos en el futuro. La expansión agresiva y el deseo de dominar los Balcanes creando una gran Serbia debería convertirse en cosa del pasado"
 SER_confederation_project: "Proyecto de Federación"
 SER_confederation_project_desc: "We will begin preparations for the creation of the Federation. This important step will bring us closer to our vision of United Balkans as the center of power in the world."
 SER_hijacking_yugo_nostalgia: "Harness the Yugoslav Dream"
 SER_hijacking_yugo_nostalgia_desc: "Yugoslavia is gone, but the longing for it is not. The government folds that nostalgia into its own program, presenting the coming federation as the old dream under new management."
 SER_language_agreements: "Resolver un Problema de Idioma"
 SER_language_agreements_desc: "El idioma siempre ha sido un medio de dominación de una nación sobre otra, en nuestra federación cada idioma de cada nación será importante y necesario."
 SER_propose_yugocefta: "Promoción de Relaciones Comerciales"
 SER_propose_yugocefta_desc: "Firmaremos una serie de acuerdos comerciales con nuestros vecinos, que nos acercarán a las primeras negociaciones sobre la creación de una Federación."
 SER_confederation_realisation: "La Primera Etapa de la Federación"
 SER_confederation_realisation_desc: "Comenzaremos la federalización de nuestro país para que en el futuro todos los vecinos vean que nuestras ambiciones imperiales están en el pasado y estamos listos para cooperar con todas las naciones balcánicas."
 SER_apologize_to_bosnia: "Resolver Todas las Disputas con Bosnia"
 SER_apologize_to_bosnia_desc: "Nuestro enfrentamiento con Bosnia debe completarse y promoveremos activamente el deseo de establecer lazos con este estado fraternal tanto como sea posible."
 SER_undermine_croatian_nationalism: "Pacificar el Nacionalismo Croata"
 SER_undermine_croatian_nationalism_desc: "Promoveremos la cooperación con Croacia, a pesar del terrible pasado, tenemos un futuro maravilloso por delante."
 SER_honey_and_milk_approach: "Diplomacia de Miel y Leche"
 SER_honey_and_milk_approach_desc: "Kosovo y Macedonia siempre han sido nuestro principal problema en el sur, pero ahora estamos listos para convertir este problema en un posible amigo y socio. Es vital establecer relaciones con ellos, porque su membresía en la Federación nos abrirá el camino hacia el sur."
 SER_confederation_bos: "Negociaciones con Bosnia"
 SER_confederation_bos_desc: "Finalmente, estamos listos para comenzar las negociaciones sobre la membresía en la Federación. No es un hecho que podamos ponernos de acuerdo y convencer de convertirse en miembros de la Federación de inmediato, pero estamos listos para un largo proceso."
 SER_confederation_slv_cro: "Negociaciones con Eslovenia y Croacia"
 SER_confederation_slv_cro_desc: "Finalmente, estamos listos para comenzar las negociaciones sobre la membresía en la Federación. No es un hecho que podamos ponernos de acuerdo y convencer de convertirse en miembros de la Federación de inmediato, pero estamos listos para un largo proceso."
 SER_confederation_mac_kos: "Negociaciones con Kosovo y Macedonia"
 SER_confederation_mac_kos_desc: "Finalmente, estamos listos para comenzar las negociaciones sobre la membresía en la Federación. No es un hecho que podamos ponernos de acuerdo y convencer de convertirse en miembros de la Federación de inmediato, pero estamos listos para un largo proceso."
 SER_confederation_created: "La Segunda Etapa de la Federación"
 SER_confederation_created_desc: "Hemos completado la segunda etapa de nuestra idea de un Estado Federal en los Balcanes. Ahora estamos listos para seguir adelante, ya hacia aquellos países que nunca fueron parte de Yugoslavia."
 SER_multicultural_guarantees: "Garantías de Multiculturalismo"
 SER_multicultural_guarantees_desc: "Promoveremos ideas y leyes en nuestra Federación para proteger el multiculturalismo de los pueblos que nos habitan."
 SER_a_newer_identity: "Nueva Identidad Nacional"
 SER_a_newer_identity_desc: "The Balkan people must become a new national identity for all the peoples inhabiting our Federation, the only way we can find unity."
 SER_confederation_alb: "Negociaciones con Albania"
 SER_confederation_alb_desc: "Finalmente, estamos listos para comenzar las negociaciones sobre la membresía en la Federación. No es un hecho que podamos ponernos de acuerdo y convencer de convertirse en miembros de la Federación de inmediato, pero estamos listos para un largo proceso."
 SER_confederation_gre: "Negociaciones con Grecia"
 SER_confederation_gre_desc: "Finalmente, estamos listos para comenzar las negociaciones sobre la membresía en la Federación. No es un hecho que podamos ponernos de acuerdo y convencer de convertirse en miembros de la Federación de inmediato, pero estamos listos para un largo proceso."
 SER_confederation_bul: "Negociaciones con Bulgaria"
 SER_confederation_bul_desc: "Finalmente, estamos listos para comenzar las negociaciones sobre la membresía en la Federación. No es un hecho que podamos ponernos de acuerdo y convencer de convertirse en miembros de la Federación de inmediato, pero estamos listos para un largo proceso."
 SER_confederation_romania: "Negociaciones con Rumanía"
 SER_confederation_romania_desc: "Finalmente, estamos listos para comenzar las negociaciones sobre la membresía en la Federación. No es un hecho que podamos ponernos de acuerdo y convencer de convertirse en miembros de la Federación de inmediato, pero estamos listos para un largo proceso."
 SER_south_european_balkan_confederation: "Nuevo Centro de Poder son los Balcanes"
 SER_south_european_balkan_confederation_desc: "Nuestra Federación ahora se extiende sobre territorios tan vastos que estamos listos para declarar que somos un nuevo centro de poder y las grandes potencias ya no podrán influir en nosotros individualmente."
 SER_conf_prepare: "Preparación para la Federación"
 SER_language: "Acuerdos Lingüísticos"
 SER_renew_serbia: "Nueva Imagen de Serbia"
 SER_multicurtural: "Multiculturalismo"
 SER_new_identity: "Identidad Balcánica"
 SER_balkan_nation: "Nación Balcánica"
 SER_subject_federation: "Sujeto de la Federación Balcánica"
