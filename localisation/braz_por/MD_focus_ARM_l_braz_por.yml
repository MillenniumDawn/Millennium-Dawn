 ARM_economy_lavash: "Economia Armênia"
 ARM_economy_lavash_desc: "Nossa economia está em estado deplorável após o colapso da URSS, e também passamos por uma severa onda de privatização para salvar nosso orçamento da ruína total. Talvez no novo milênio recuperemos tudo o que nos foi tirado."
 ARM_economy_tourism: "Desenvolvimento do Turismo"
 ARM_economy_tourism_desc: "O turismo na Armênia representa grande parte do orçamento do país, e pretendemos desenvolver e investir nesse setor."
 ARM_economy_historic: "Reconstruir Objetos Históricos"
 ARM_economy_historic_desc: "Turistas são facilmente atraídos por sítios antigos, então iremos restaurá-los."
 ARM_economy_longest: "O Teleférico Mais Longo"
 ARM_economy_longest_desc: "Quem não gosta de admirar paisagens bonitas? Os turistas certamente vão adorar."
 ARM_economy_sewani: "Khorovats de Sevan"
 ARM_economy_sewani_desc: "Pretendemos desenvolver seriamente a esfera gastronômica em torno dos pontos turísticos."
 ARM_economy_hotels: "A Questão dos Hotéis"
 ARM_economy_hotels_desc: "Os hotéis devem cumprir padrões internacionais; caso contrário, o fluxo de turistas diminuirá muito rapidamente."
 ARM_economy_tobacco: "A Questão do Tabaco Armênio"
 ARM_economy_tobacco_desc: "O negócio do tabaco na Armênia ocupa um nicho enorme, trazendo impostos ao nosso tesouro, mas em quantidade insuficiente; além disso, por meio dessa empresa, alguns países estrangeiros podem perfeitamente nos influenciar por alavancas econômicas."
 ARM_economy_shady: "Questionando os Negócios Obscuros"
 ARM_economy_shady_desc: "A economia paralela tem impacto negativo na arrecadação de impostos em todo o país. É hora de resolvermos esse grave problema."
 ARM_economy_casino: "Destino dos Cassinos Online"
 ARM_economy_casino_desc: "O último reduto da economia paralela, os cassinos online, finalmente será fechado e nos libertaremos da influência nociva dos negócios clandestinos."
 ARM_economy_armenian_card: "Cartão Armênio"
 ARM_economy_armenian_card_desc: "A Armenian Card é uma processadora de pagamentos e emissora de cartões armênia. A CJSC 'Armenian Card' foi fundada em 2000 pelo Banco Central da Armênia e dez bancos comerciais, com o apoio da USAID, a fim de introduzir e desenvolver um novo sistema de contabilidade de pagamentos no setor bancário da Armênia"
 ARM_economy_evocabank: "Evocabank"
 ARM_economy_evocabank_desc: "O Evocabank é um banco comercial armênio com sede em Yerevan. Agora que a digitalização atingiu grande escala, o banco está pronto para se tornar um dos bancos mais avançados e tecnologicamente modernos da Armênia."
 ARM_economy_artsakhbank: "Artsakhbank"
 ARM_economy_artsakhbank_desc: "O banco está localizado em Artsakh e é uma espécie de instrumento de influência econômica sobre Artsakh"
 ARM_economy_ardshinbank: "Ardshinbank"
 ARM_economy_ardshinbank_desc: "O Ardshinbank é uma instituição financeira e de crédito universal que oferece uma gama completa de serviços bancários. As áreas prioritárias incluem o financiamento de projetos para grandes clientes corporativos, principalmente nas indústrias estratégicas e no setor de energia da Armênia, bem como crédito a pequenas e médias empresas, emissão e serviço de cartões plásticos, e-banking, transferências internacionais de dinheiro, além de crédito hipotecário para diferentes grupos da população e projetos de folha de pagamento"
 ARM_economy_inecobank: "Inecobank"
 ARM_economy_inecobank_desc: "O INECOBANK é um dos principais bancos do Cáucaso Meridional, com sede em Yerevan, Armênia. O banco oferece uma gama completa de serviços bancários, incluindo serviços bancários digitais para pessoas físicas, pequenas e médias empresas e clientes corporativos"
 ARM_economy_vtb: "Deixar o VTB Russo Entrar"
 ARM_economy_vtb_desc: "O banco russo VTB está se esforçando para abrir agências em nosso país, e o capital russo será bastante útil para nossa economia."
 ARM_economy_hsbc: "Questão do HSBC"
 ARM_economy_hsbc_desc: "O HSBC está presente em nosso país desde os anos 90. Agora que o setor bancário começou a crescer, é hora de decidirmos o que fazer com ele."
 ARM_economy_ycrdi: "YCRDI"
 ARM_economy_ycrdi_desc: "O Instituto de Pesquisa e Desenvolvimento de Computadores de Yerevan é um instituto de pesquisa científica e pioneiro da indústria de TI e de software na Armênia. Foi fundado pelo governo da URSS em 1956, em Yerevan, para o desenvolvimento de equipamentos de computação. A instituição atualmente se dedica ao desenvolvimento de computadores e sistemas de controle automático para fins civis e de defesa. Agora este instituto está em péssima situação financeira, e enfrentamos a escolha entre vendê-lo à Rússia para que o Ministério da Educação russo o apoie, ou investir financeiramente em nossa própria instituição."
 ARM_economy_orange: "UCOM"
 ARM_economy_orange_desc: "Finalmente teremos nossa própria operadora de telecomunicações nacional, que não pertence a um investidor estrangeiro."
 ARM_economy_veon: "VEON"
 ARM_economy_veon_desc: "A VEON Ltd, também conhecida como VEON Group, é uma empresa multinacional de telecomunicações e serviços digitais. Com sede nos Países Baixos, a empresa tem capital aberto na bolsa NASDAQ, nos EUA. Pretendemos permitir que essa operadora entre em nosso país para desenvolver redes de comunicação, melhorando assim a vida de nossos cidadãos."
 ARM_economy_electric_networks: "CJSC \"Redes Elétricas da Armênia\""
 ARM_economy_electric_networks_desc: "A CJSC \"Redes Elétricas da Armênia\" foi fundada como fusão de quatro empresas regionais estatais de distribuição e venda de energia elétrica. A empresa atua principalmente na distribuição e venda regulada de energia elétrica. A extensão total de sua rede é de 36 mil km. A distribuição de energia é feita com tarifas confirmadas pela Comissão Reguladora de Serviços Públicos da RA. A empresa atende a mais de 1 milhão de clientes."
 ARM_economy_hrazdan_thermal: "Usina Termelétrica de Hrazdan"
 ARM_economy_hrazdan_thermal_desc: "A Usina Termelétrica de Hrazdan é uma usina a gás natural na parte noroeste da cidade de Hrazdan, que gera eletricidade na Armênia. É uma das maiores usinas da Armênia. Foi construída entre 1963 e 1974, e a primeira unidade entrou em operação em 1966. Em seu estado atual, a usina precisa ser totalmente renovada e financiada, e por isso a questão volta a surgir. Transferi-la ao controle da Rússia ou sustentar a estação com seu próprio orçamento"
 ARM_economy_rosneft: "Rosneft-Armênia"
 ARM_economy_rosneft_desc: "Pretendemos concluir um acordo para a construção de instalações petrolíferas com a empresa russa Rosneft. Nossa indústria petrolífera tem desenvolvimento absolutamente nulo, então somos mais uma vez forçados a contar com nossos colegas russos."
 ARM_economy_techout_mining: "Mineração Teghout"
 ARM_economy_techout_mining_desc: "A Teghout Mining foi criada para desenvolver a jazida de Teghout, na região de Lori, a segunda maior jazida de cobre e molibdênio da República da Armênia."
 ARM_economy_ml_mining: "ML Mining"
 ARM_economy_ml_mining_desc: "Outra empresa de mineração será criada, o que ajudará a ampliar o conjunto de recursos que podemos extrair em nosso país."
 ARM_economy_elnor: "Elnor"
 ARM_economy_elnor_desc: "A Elnor é mais uma empresa que produz itens agroindustriais, que começam a aparecer ativamente no mercado."
 ARM_economy_techout_more: "Expansão das Atividades"
 ARM_economy_techout_more_desc: "As atividades da Teghout serão ampliadas, o que é um claro indicador de que a produção está em bom nível."
 ARM_economy_grand_candy: "Grand Candy"
 ARM_economy_grand_candy_desc: "A Grand Candy é uma das maiores empresas da indústria alimentícia. Os produtos dessa empresa sempre recebem avaliações positivas dos clientes."
 ARM_economy_agro_support: "Spaika"
 ARM_economy_agro_support_desc: "A empresa ocupa posição de liderança no transporte internacional de cargas e também foi a maior produtora e exportadora de frutas e hortaliças para os países da CEI, a Europa e o Golfo Pérsico."
 ARM_economy_daily_products: "Marianna"
 ARM_economy_daily_products_desc: "Desde os primeiros dias de operação, o trabalho da Marianna baseou-se no princípio de manter produtos de alta qualidade, e o trabalho consistente e a dedicação tornaram-se a chave para a expansão e o desenvolvimento da empresa. Oferecemos os melhores produtos aos melhores consumidores."
 ARM_economy_free_energy: "Energia Verde"
 ARM_economy_free_energy_desc: "A energia verde sempre será uma das prioridades da economia armênia, porque o século XXI é o século da energia verde. Certo?"
 ARM_economy_green_armenia: "Programa Armênia Verde"
 ARM_economy_green_armenia_desc: "Nosso programa ambiental será ampliado, e nosso país deve se tornar um modelo de sucesso em programas ambientais."
 ARM_economy_nuclear: "Energia Nuclear"
 ARM_economy_nuclear_desc: "É hora de assumir o desenvolvimento da energia nuclear; só podemos contar conosco mesmos."
 ARM_economy_nuclear_expand: "Expansão da Energia Nuclear"
 ARM_economy_nuclear_expand_desc: "Uma usina nuclear é sempre uma questão importante; é hora de decidir o que fazer com ela."
 ARM_economy_zangezur_copper: "Complexo de Cobre e Molibdênio de Zangezur"
 ARM_economy_zangezur_copper_desc: "O Complexo de Cobre e Molibdênio de Zangezur é a maior empresa de mineração da Armênia e um dos 10 maiores produtores de molibdênio do mundo. A história do ZCMC remonta à era soviética. Na primavera de 1952, o complexo lançou seu primeiro produto em série. Inicialmente, a mina era explorada combinando mineração subterrânea e a céu aberto. De 1957 a 1959, a operação foi exclusivamente a céu aberto. O Complexo de Cobre e Molibdênio de Zangezur está localizado no sudeste da Armênia, na cidade de Kajaran, na região de Syunik, a 30 km a oeste do centro regional Kapan e a cerca de 350 km da capital Yerevan."
 ARM_economy_yerevan_factori_restore: "Fábrica de Confeitaria e Macarrão de Yerevan"
 ARM_economy_yerevan_factori_restore_desc: "A Fábrica de Confeitaria e Macarrão de Yerevan era uma empresa industrial sediada na Armênia. Foi construída em 1933. Os departamentos de confeitaria e macarrão foram unificados em 1951. Em 1977, a fábrica tornou-se a primeira produtora de chiclete da União Soviética, embora a goma não contivesse chicle. A fábrica quase parou a produção durante o colapso da União Soviética, na década de 1990, e foi mais tarde privatizada e restaurada pela empresa Grand Candy."
 ARM_economy_yerevan_ararat_factory: "Fábrica de Conhaque Ararat de Yerevan"
 ARM_economy_yerevan_ararat_factory_desc: "A Fábrica de Conhaque Ararat de Yerevan, oficialmente conhecida como Fábrica de Conhaque-Vinho-Vodca Ararat de Yerevan e popularmente pela famosa marca Noy, é uma importante empresa armênia de produção de conhaque em Yerevan, Armênia."
 ARM_economy_yerevan_destiny_brandy: "Yerevan Brandy Company"
 ARM_economy_yerevan_destiny_brandy_desc: "A Yerevan Brandy Company, popularmente conhecida por sua famosa marca 'ArArAt', é a principal empresa da Armênia na produção de conhaque. Foi fundada em 1887, durante o período do Império Russo. Após a sovietização da Armênia, a fábrica tornou-se uma empresa estatal. Em 1999, o governo da Armênia independente vendeu a fábrica à empresa francesa de destilados Pernod Ricard. A variedade de produtos de conhaque da empresa é rotulada e divulgada como ArArAt."
 ARM_economy_eraz: "ErAZ"
 ARM_economy_eraz_desc: "A ErAZ, ou Yerevanskiy Avtomobilny Zavod, foi uma fabricante armênia de automóveis em Yerevan, Armênia, mais conhecida por produzir a van RAF-977K de 1966 a 1996. Os planos para estabelecer a fábrica ErAZ surgiram em 31 de dezembro de 1964, por decisão do Conselho de Ministros da República Socialista Soviética da Armênia. A equipe original foi treinada na Fábrica de Ônibus de Riga, na Letônia, e na UAZ, na Rússia. A ErAZ foi privatizada em 1995."
 ARM_economy_kotayk: "Cervejaria Kotayk"
 ARM_economy_kotayk_desc: "A Cervejaria Kotayk é uma empresa cervejeira fundada em 1974 em Abovyan, província de Kotayk, Armênia."
 ARM_economy_ashvar: "Vinícola Avshar"
 ARM_economy_ashvar_desc: "A Vinícola Avshar é uma das principais produtoras de bebidas alcoólicas da Armênia, localizada na vila de Avshar, na província de Ararat. Foi fundada em 1968 para processar as uvas das férteis vilas da planície de Ararat, uma das principais áreas agrícolas da Armênia. As tradições e o folclore armênios sugerem que a produção de vinho na região remonta a Noé plantando uvas ao descer do Monte Ararat, no Livro do Gênesis."
 ARM_economy_hrazdan_cement: "Cimento Hrazdan"
 ARM_economy_hrazdan_cement_desc: "A Hrazdan Cement CJSC é uma sociedade anônima fechada localizada na cidade de Hrazdan, centro provincial da província de Kotayk, Armênia. Fundada em 1970 como 'Fábrica de Cimento Hrazdan' pelo governo soviético."
 ARM_economy_multi_group: "Multi Group Stone"
 ARM_economy_multi_group_desc: "A Multi Group Stone CJSC foi estabelecida pelo 'Multi Group Concern' na cidade de Abovyan, Armênia. A empresa atua na mineração e no processamento de minerais, isto é, na extração de blocos de pedra natural e travertino em pedreira própria e em todo o ciclo de fabricação e acabamento final de ladrilhos na fábrica."
 ARM_economy_alrosa: "Cooperação com a ALROSA"
 ARM_economy_alrosa_desc: "Pretendemos introduzir essa empresa russa em nosso mercado para melhorar a condição financeira e de recursos de nossa república."
 ARM_economy_gazprom: "Cooperação com a Gazprom"
 ARM_economy_gazprom_desc: "Pretendemos introduzir essa empresa russa em nosso mercado para melhorar a condição financeira e de recursos de nossa república."
 ARM_economy_armenal: "RUSAL-Armenal"
 ARM_economy_armenal_desc: "Pretendemos introduzir essa empresa russa em nosso mercado para melhorar a condição financeira e de recursos de nossa república."
 ARM_economy_mts: "Cooperação com a MTS"
 ARM_economy_mts_desc: "Pretendemos lançar essa empresa russa no mercado de telecomunicações, pois ela se mostrou positiva no mercado russo."
 ARM_government_subsid_it_sphere: "Subsídio Governamental à TI"
 ARM_government_subsid_it_sphere_desc: "É hora de desenvolver nosso setor nacional de TI; o país precisa de tecnologias modernas e de especialistas modernos em TI."
 ARM_invite_microsoft: "Convidar a Microsoft"
 ARM_invite_microsoft_desc: "$ARM_invite_it_corp_shared_desc$"
 ARM_invite_oracle: "Convidar a Oracle"
 ARM_invite_oracle_desc: "$ARM_invite_it_corp_shared_desc$"
 ARM_nvidia_invite: "Convidar a NVIDIA"
 ARM_nvidia_invite_desc: "$ARM_invite_it_corp_shared_desc$"
 ARM_adobe_invite: "Convidar a Adobe"
 ARM_adobe_invite_desc: "$ARM_invite_it_corp_shared_desc$"
 ARM_invite_amd: "Convidar a AMD"
 ARM_invite_amd_desc: "$ARM_invite_it_corp_shared_desc$"
 ARM_economy_deep: "Escavação de Recursos Profundos"
 ARM_economy_deep_desc: "O subsolo da Armênia contém muitos recursos antes inacessíveis devido a tecnologias fracas, mas agora temos a oportunidade de liberar todo o potencial de recursos do nosso país."
 ARM_economy_heavy: "Indústrias Pesadas Armênias"
 ARM_economy_heavy_desc: "Os novos recursos deram impulso ao desenvolvimento da nossa indústria; agora a indústria pesada na Armênia não é um conto de fadas, é realidade."
 ARM_economy_new_uranium: "Novos Métodos de Extração de Urânio"
 ARM_economy_new_uranium_desc: "Nossos industriais descobriram novas formas de minerar urânio, e estamos prontos para desenvolver ainda mais essa indústria."
 ARM_economy_steel: "Siderúrgicas"
 ARM_economy_steel_desc: "As enormes reservas que descobrimos exigem novas fábricas para seu desenvolvimento, tanto pelas indústrias civil quanto militar"
 ARM_economy_chemical: "Fábricas de Química Pesada"
 ARM_economy_chemical_desc: "Novas indústrias surgem como cogumelos depois da chuva, e a indústria química pesada já está emergindo na Armênia."
 ARM_economy_metal: "Ligas Metálicas"
 ARM_economy_metal_desc: "Ampliaremos nosso foco na produção de ligas metálicas, o que dará o impulso necessário à nossa indústria pesada."
 ARM_economy_heavy_ebat: "Cooperativa das Indústrias Pesadas Armênias"
 ARM_economy_heavy_ebat_desc: "Estamos prontos para combinar todas as conquistas da nossa indústria pesada em uma única cooperativa."
 ARM_economy_wto: "Ingressar na OMC"
 ARM_economy_wto_desc: "Ingressar na Organização Mundial do Comércio nos ajudará a nos integrar e a nos expandir ainda mais na economia mundial, e trará prosperidade à nossa nação e ao nosso povo."
 ARM_higher_educ_sph_development: "Desenvolvimento do Ensino Superior"
 ARM_higher_educ_sph_development_desc: "O ensino superior em nosso país está em péssimo estado, mas pretendemos mudar isso atraindo as melhores instituições de ensino do mundo e centros de acesso versátil a diversas universidades mundiais."
 ARM_tumo_project: "Centro Tumo de Tecnologias Criativas"
 ARM_tumo_project_desc: "O Centro TUMO de Tecnologias Criativas é um programa de educação gratuito para adolescentes de 12 a 18 anos, especializado em tecnologia e design, com o ensino ministrado em diversos centros e polos TUMO."
 ARM_support_aua: "Universidade Americana da Armênia"
 ARM_support_aua_desc: "Consideramos a educação americana uma das líderes do mundo e queremos que nossos cidadãos tenham acesso a ela."
 ARM_erasmus_coop: "Erasmus+ Armênia"
 ARM_erasmus_coop_desc: "Os padrões educacionais europeus são sempre relevantes e uma prioridade para nós, por isso estamos prontos para colaborar com as principais universidades da UE."
 ARM_ayb_school: "Escola Ayb"
 ARM_ayb_school_desc: "A Escola Ayb é um complexo educacional privado em Yerevan, Armênia, inaugurado pela Fundação Educacional Ayb. A escola recebeu o nome da primeira letra do alfabeto armênio, Ayb. É uma organização sem fins lucrativos, legalmente registrada como Fundação Ayb Learning Hub. O lema da escola é 'Saber e Criar'. A escola é dirigida por um conselho de curadores, presidido por Ruben Arutynyan. O diretor da escola é David Sahakyan."
 ARM_educ_coop_brit: "Colaboração com Cambridge"
 ARM_educ_coop_brit_desc: "A educação de Cambridge é muito valorizada no mundo e pretendemos criar acesso a ela em nosso país."
 ARM_armenia_mgu: "Cooperação com a MSU"
 ARM_armenia_mgu_desc: "Pretendemos abrir uma filial da Universidade Estatal de Moscou em nosso país para que nossos cidadãos possam receber educação russa e depois aplicá-la no espaço pós-soviético."
 ARM_economy_category: "Economia Armênia"
 ARM_economy_category_desc: "Durante a §RUnião Soviética§!, a £text_icon_armdram §Yeconomia armênia§! era orientada para a indústria. O §Rcolapso da URSS§! mudou radicalmente essa situação. A [ARM.GetFlag]§YArmênia§! passou de um grande setor industrial para a agricultura em pequena escala. A situação política e econômica do país em 1990 obrigou-o a contrair empréstimos para que a £text_icon_armdram §Yeconomia§! não estagnasse ou, §Rpior§!, não começasse seu §Rdeclínio§!"
 ARM_economy_russian_tourists: "Estimular o Fluxo de Turistas [SOV.GetFlag]§Yrussos§!"
 ARM_economy_tourism_integrate_azer: "Integração dos Resorts [AZE.GetFlag]§Yazerbaijanos§!"
 ARM_economy_tourism_integrate_abkhazia: "Integração dos Resorts [ABK.GetFlag]§Yabecásios§!"
 ARM_economy_shadow_economy_destroy: "Continuar a Luta Contra a §REconomia Paralela§!"
 ARM_economy_shady_idea: "Economia Paralela"
 ARM_economy_shady_idea4: "Economia Paralela Fraca"
 ARM_Eraz_idea: "ErAZ"
 ARM_multigroup_idea: "Multigroup"
 ARM_armbel_trade_center: "Casa Comercial Armênio-Bielorrussa"
 ARM_armbel_trade_center_desc: "Podemos estabelecer a casa comercial armênio-bielorrussa para aumentar a produção agrícola e alimentícia e o comércio entre nossos países.\n--------------\nEste espírito nacional será §RRemovido§! se entrarmos em guerra com a Bielorrússia ou desenvolvermos uma opinião negativa dela."
 NKR_gaz_energy_problems: "Baixa Gaseificação"
 NKR_corruption_in_police_idea: "Polícia Corrupta"
 ARM_new_decision_economic_unlock_tt: "£text_icon_armdram §YEconomia Armênia§!: §YDesbloqueia§! Novas Decisões"
 ARM_tourism_expand_TT: "£text_icon_armdram A §YReceita do Turismo§! será §Gaumentada§!"
 ARM_tourism_expand_territories_ABK_TT: "£text_icon_armdram Estamos integrando os [ABK.GetFlag]§YResorts Abecásios§!"
 ARM_tourism_expand_territories_AZE_TT: "£text_icon_armdram Estamos integrando os [AZE.GetFlag]§YResorts Azerbaijanos§!"
 ARM_Economy_unfluency_ycrdi_SOV_TT: "[SOV.GetFlag] §HMultiplicador de Influência§! russa em §Y[ROOT.GetNameWithFlag]§!: §R+10%§!"
 ARM_Economy_unfluency_it_USA_TT: "[USA.GetFlag] §HMultiplicador de Influência§! americana em §Y[ROOT.GetNameWithFlag]§!: §R+10%§!"
 ARM_Economy_unfluency_armbel_BLR_TT: "[BLR.GetFlag] §HMultiplicador de Influência§! bielorrussa em §Y[ROOT.GetNameWithFlag]§!: §R+10%§!"
 ARM_Leave_NGO_USA_TT: "[USA.GetFlag] §HMultiplicador de Influência§! americana em §Y[ROOT.GetNameWithFlag]§!: §G-15%§!"
 ARM_Zhirair_SOV_TT: "[SOV.GetFlag] §HMultiplicador de Influência§! russa em §Y[ROOT.GetNameWithFlag]§!: §G-15%§!"
 ARM_Zhirair_UKR_BLR_TT: "[ARM.GetFlag] §HMultiplicador de Influência§! armênia em §Y[ROOT.GetNameWithFlag]§!: §R-15%§!"
 arm_economic.2.t: "Destino do Banco HSBC"
 arm_economic.2.d: "O HSBC opera em nosso território desde os anos 90; agora que nossa economia está se recuperando, é hora de decidir o que fazer com esse banco, pois estamos prontos para dispensar tantas empresas estrangeiras quanto antes."
 arm_economic.2.a: "O Ardshinbank comprará as agências do banco."
 arm_economic.2.b: "Que fiquem na Armênia."
 arm_economic.3.t: "Destino do YCRDI"
 arm_economic.3.d: "O Instituto de Pesquisa Científica de Máquinas Matemáticas de Yerevan, um famoso instituto fundado na era soviética, está agora em declínio, e é importante decidirmos seu destino. A Rússia se oferece para adquirir sua propriedade, ou investiremos na reorganização do Instituto com nossos próprios recursos."
 arm_economic.3.a: "Aceitaremos a oferta de Moscou."
 arm_economic.3.b: "Salvaremos o Instituto."
 arm_economic.4.t: "Destino da VEON"
 arm_economic.4.d: "A VEON está pronta para entrar plenamente no mercado de telecomunicações do nosso país, mas temos a opção de comprá-la e transferi-la para nossa operadora nacional. Qual é a prioridade para nós: investimento estrangeiro ou apoio às empresas nacionais?"
 arm_economic.4.a: "Não vamos mexer com eles."
 arm_economic.4.b: "Compraremos seus ativos."
 arm_economic.5.t: "Usina Termelétrica de Hrazdan"
 arm_economic.5.d: "A usina termelétrica de Hrazdan é a maior usina termelétrica do nosso país e, infelizmente, chegou a hora de decidir seu destino. Ou a colocaremos totalmente sob o controle da russa Gazprom, ou investiremos nossos próprios recursos em sua manutenção."
 arm_economic.5.a: "Que a Gazprom fique com ela."
 arm_economic.5.b: "Continuaremos investindo."
 arm_economic.6.t: "Destino da Shoghakn"
 arm_economic.6.d: "A fábrica Shoghakn foi criada em 1971 e agora é reivindicada por uma empresa israelense criada por um compatriota nosso. Precisamos decidir se investiremos na fábrica ou a entregaremos a um proprietário privado."
 arm_economic.6.a: "Que a levem."
 arm_economic.6.b: "Continuaremos Investindo."
 arm_economic.7.t: "Usina Nuclear"
 arm_economic.7.d: "Nosso país enfrenta a escolha de a quem confiar a construção de uma nova usina nuclear. A Rússia, os Estados Unidos ou, quem sabe, nós mesmos arriscaremos investir dinheiro em um projeto tão complexo?"
 arm_economic.7.a: "Os Estados Unidos dão conta."
 arm_economic.7.b: "A Rússia é especialista nisso."
 arm_economic.7.c: "Os armênios são verdadeiros cientistas nucleares."
 arm_economic.8.t: "Falência da Fábrica Shoghakn"
 arm_economic.8.d: "O proprietário da fábrica Shoghakn anunciou oficialmente que a fábrica está sendo fechada por falência."
 arm_economic.8.a: "Como deixamos isso acontecer."
 arm_economic.9.t: "Complexo de Cobre e Molibdênio de Zangezur"
 arm_economic.9.d: "Agora precisamos decidir seu futuro, pois ele precisa ser totalmente reconstruído. A Rússia se oferece para fazer isso às suas custas e obter controle sobre ele, ou nós mesmos o reconstruiremos."
 arm_economic.9.a: "Nós damos conta."
 arm_economic.9.b: "Vamos entregá-lo à Rússia."
 arm_economic.10.t: "ErAZ"
 arm_economic.10.d: "A ErAZ era uma fabricante armênia de automóveis em Yerevan, Armênia, mais conhecida por produzir a van RAF-977K de 1966 a 1996. Os planos para estabelecer a fábrica ErAZ surgiram em 31 de dezembro de 1964, por decisão do Conselho de Ministros da República Socialista Soviética da Armênia. O destino da fábrica está em jogo: ou a privatizaremos para um investidor russo, ou a reconstruiremos por conta própria."
 arm_economic.10.a: "Nós damos conta."
 arm_economic.10.b: "Vamos entregá-la à Rússia."
 arm_economic.11.t: "Cervejaria Kotayk"
 arm_economic.11.d: "A Cervejaria Kotayk foi fundada em 1974 como empresa estatal pelo governo da República Socialista Soviética da Armênia, com escala de produção limitada. Após a conclusão de todo o equipamento, a fábrica iniciou a produção em larga escala em 1978. Após a dissolução da União Soviética, Gagik Tsarukyan assumiu a cervejaria em 1995 e passou a produzir cerveja sob as marcas Kotayk e Artsakh. Em 1997, o Castel Group tornou-se o principal acionista da cervejaria com um investimento de 17 milhões de dólares americanos, sendo um dos primeiros investidores estrangeiros na Armênia. Agora temos de decidir se privatizamos a fábrica ou a subordinamos ao Estado."
 arm_economic.11.a: "Nós damos conta."
 arm_economic.11.b: "Abriremos mão dela para a privatização"
 arm_economic.12.t: "Fábrica de Conhaque Ararat de Yerevan"
 arm_economic.12.d: "A Fábrica de Conhaque Ararat de Yerevan, oficialmente conhecida como Fábrica de Conhaque-Vinho-Vodca Ararat de Yerevan e popularmente pela famosa marca Noy, é uma importante empresa armênia de produção de conhaque em Yerevan, Armênia. A fábrica está em situação lamentável, e um investidor privado quer restaurá-la privatizando-a por completo, ou o Estado cuidará da famosa fábrica."
 arm_economic.12.a: "Nós damos conta."
 arm_economic.12.b: "Abriremos mão dela para a privatização"
 arm_economic.13.t: "Yerevan Brandy Company"
 arm_economic.13.d: "A Yerevan Brandy Company, popularmente conhecida por sua famosa marca \"ArArAt\", é a principal empresa da Armênia na produção de conhaque. Foi fundada em 1887, durante o período do Império Russo. Após a sovietização da Armênia, a fábrica tornou-se uma empresa estatal. Em 1999, o governo da Armênia independente vendeu a fábrica à empresa francesa de destilados Pernod Ricard. A variedade de produtos de conhaque da empresa é rotulada e divulgada como ArArAt. Talvez queiramos mudar nossa decisão e assumir o controle dessa fábrica, ou finalmente decidiremos deixá-la em posse de um investidor francês."
 arm_economic.13.a: "Assumiremos a fábrica."
 arm_economic.13.b: "Que fiquem com os franceses."
 arm_economic.14.t: "ErAZ"
 arm_economic.14.d: "Infelizmente, a fábrica ErAZ não conseguiu competir no mercado global e teve de declarar falência. Devemos pensar em nossa própria tentativa de reviver a fábrica?"
 arm_economic.14.a: "Não."
 arm_economic.14.b: "Nós damos conta."
 arm_economic.15.t: "Novos Atores no Setor Nacional de TI"
 arm_economic.15.d: "Nossa indústria de TI foi reforçada com novas empresas que darão crescimento ao nosso setor de TI."
 arm_economic.15.a: "Sim."
 arm_economic.16.t: "Novos Atores no Setor Nacional de TI"
 arm_economic.16.d: "Nossa indústria de TI foi reforçada com novas empresas que darão crescimento ao nosso setor de TI."
 arm_economic.16.a: "Sim."
 arm_economic.17.t: "Filial da MSU na Armênia"
 arm_economic.17.d: "A MSU entrou em acordo com o Ministério da Educação da Armênia para abrir sua filial neste país. Os cidadãos armênios agora terão amplo acesso aos programas dessa universidade russa."
 arm_economic.17.a: "Ótimo!"
 arm_economic.17.b: "Ok."
 arm_economic.18.t: "Inauguração do TUMO"
 arm_economic.18.d: "O Tumo foi originalmente concebido como um centro de educação pós-secundária para adolescentes. Sam Simonyan, empreendedor americano de origem armênia, e Silva Simonyan tornaram-se os fundadores do centro. Agora nosso sistema educacional foi ampliado com mais uma instituição maravilhosa. A grande inauguração do Centro Tumo foi acompanhada por um show dos músicos de rock Serj Tankian e Dorians."
 arm_economic.18.a: "Ótimo."
 arm_economic.19.t: "Universidade Americana da Armênia"
 arm_economic.19.d: "A Universidade Americana da Armênia foi fundada na década de 1990 e, com a conclusão do Edifício Paramaz Avedisyan, é agora uma instituição plenamente realizada. Os cidadãos armênios podem ter acesso a uma educação de padrão americano e obter diplomas reconhecidos internacionalmente."
 arm_economic.19.a: "Ótimo"
 arm_economic.19.b: "Ok."
 arm_economic.20.t: "ERASMUS+ na Armênia"
 arm_economic.20.d: "A Armênia aderiu ao programa ERASMUS+ e iniciou um intercâmbio completo de estudantes com instituições de ensino europeias, especialmente francesas e alemãs, que lideram o programa de intercâmbio."
 arm_economic.20.a: "Ótimo!"
 arm_economic.20.b: "Ok."
 arm_economic.21.t: "Escola Ayb"
 arm_economic.21.d: "Desde sua criação, a Fundação Educacional Ayb implementou cursos avançados por disciplina para alunos do ensino médio, estabeleceu laboratórios educacionais modernos em escolas de diferentes regiões da Armênia, organizou competições escolares internacionais favoritas na Armênia e em Artsakh, conduziu a requalificação de professores, desenvolveu metodologia de ensino, traduziu para o armênio alguns dos melhores livros didáticos do mundo, desenvolveu e testou sistemas de uniformização da educação e de gestão da estrutura educacional, etc. Com base nos cinco anos de experiência de todos esses programas e iniciativas educacionais, decidiu-se estabelecer uma nova escola armênia que atenda a todos os requisitos educacionais modernos e se baseie nas melhores conquistas da escrita armênia."
 arm_economic.21.a: "Ótimo!"
 arm_economic.22.t: "Cambridge na Armênia"
 arm_economic.22.d: "A Armênia firmou cooperação com a Universidade de Cambridge para permitir que cidadãos armênios recebam educação britânica e a desfrutem em pé de igualdade com outros estudantes britânicos."
 arm_economic.22.a: "Ótimo!"
 arm_economic.22.b: "Ok."
 arm_economic.23.t: "AmeriaBank"
 arm_economic.23.d: "O Ameriabank é o banco mais antigo da Armênia. Agora, graças ao desenvolvimento do sistema bancário, o banco poderá ter um impacto mais positivo no desenvolvimento da nossa economia."
 arm_economic.23.a: "Ótimo!"
 arm_economic.1.t: "A Questão do Tabaco"
 arm_economic.1.d: "As empresas de tabaco ocupam um grande nicho na economia do nosso Estado; infelizmente, sentem-se confortáveis demais e, além disso, alguns países estrangeiros podem perfeitamente influenciar nosso país por meio delas. Talvez seja hora de resolver a questão com elas."
 arm_economic.1.a: "Vamos recomprá-las."
 arm_economic.1.b: "Usaremos a polícia para tomá-las."
 arm_economic.1.c: "Usaremos as forças especiais do exército para tomá-las."
 arm_economic.1.f: "Aceitar o suborno deles."
 NKR_economy_start: "Economia no Novo Milênio"
 NKR_economy_start_desc: "Nossa bela região entra em um novo milênio; conquistamos a independência recentemente e ainda lidamos com o pós-conflito e a guerra por nossa independência."
 NKR_economy_police: "Reorganização da Polícia"
 NKR_economy_police_desc: "Pretendemos realizar uma grande reforma da polícia, expulsar de lá todos os que aceitam suborno e também renovar completamente o quadro de pessoal."
 NKR_economy_corruption: "Expulsar Funcionários Corruptos"
 NKR_economy_corruption_desc: "Todos os funcionários corruptos receberão um ultimato. Ninguém escapará da justiça. Pretendemos purgar completamente os órgãos do governo dos que aceitam suborno."
 NKR_economy_nalog: "Reforma Tributária"
 NKR_economy_nalog_desc: "Reduziremos a carga tributária sobre nossos cidadãos e aliviaremos a pressão sobre nossa economia."
 NKR_economy_construction: "Facilitar a Emissão de Alvarás de Construção"
 NKR_economy_construction_desc: "Pretendemos facilitar o procedimento de emissão de alvarás de construção. Chega de inundar os cidadãos de burocracia: se podem, que construam!"
 NKR_economy_land: "Distribuição de Terras Sem Dono"
 NKR_economy_land_desc: "Estamos prontos para distribuir terras literalmente aos nossos cidadãos para que possam criar qualquer coisa nelas, inclusive seu próprio negócio."
 NKR_economy_selhoz: "Apoio aos Produtores Agrícolas"
 NKR_economy_selhoz_desc: "O setor agrícola sempre será uma de nossas maiores indústrias, e pretendemos apoiá-lo financeiramente sempre."
 NKR_economy_antimonopol: "Dissolver as Autoridades Antimonopólio"
 NKR_economy_antimonopol_desc: "Dissolveremos a autoridade antimonopólio; não há necessidade de regular a concorrência em nosso pequeno Estado."
 NKR_economy_gas: "Realizar a Gaseificação"
 NKR_economy_gas_desc: "Realizaremos um programa de gaseificação em larga escala em toda a república para que os cidadãos sempre tenham acesso a gás!"
 NKR_economy_fermers: "Reduzir Impostos para Agricultores"
 NKR_economy_fermers_desc: "Queremos estimular ainda mais o setor agrícola e, por isso, pretendemos reduzir os impostos de todos os envolvidos em atividades agrícolas."
 NKR_economy_copper_gold: "Investimentos em Cobre e Ouro"
 NKR_economy_copper_gold_desc: "Pode não haver muitos recursos em nossa república, mas pretendemos usar até o que temos em benefício da economia."
 NKR_economy_gornaya: "Indústria Mineradora"
 NKR_economy_gornaya_desc: "Pretendemos investir na indústria mineradora, pois, mesmo em nossa posição, podemos desenvolver facilmente os recursos no território de nossa república."
 NKR_economy_support_local: "Apoiar os Produtores Locais"
 NKR_economy_support_local_desc: "O apoio ao nosso produtor é a principal prioridade do nosso programa econômico; não podemos depender de produtos importados em grandes quantidades."
 NKR_economy_invest_climate: "Apoio ao Clima de Investimento"
 NKR_economy_invest_climate_desc: "Embora sejamos céticos em relação a produtos estrangeiros, continuaremos tentando criar um clima de investimento, e os investimentos não serão supérfluos."
 NKR_economy_forest: "Indústria Florestal"
 NKR_economy_forest_desc: "Precisamos de fontes adicionais de combustível e energia. A indústria florestal, complementar a todas as outras, pode ser bastante eficaz."
 NKR_economy_boring_10: "Chato Crescimento de 10 Por Cento"
 NKR_economy_boring_10_desc: "Nossa economia cresce cerca de 10% ao ano, não o maior crescimento que gostaríamos, mas nossos cidadãos valorizam mais essa estabilidade do que promessas mirabolantes."
 NKR_safe_start: "Em Guarda de Artsakh"
 NKR_safe_start_desc: "Nossa pátria está em perigo constante. Devemos pensar com cuidado na proteção de nossas fronteiras e lembrar que nossa segurança depende tanto de uma economia forte quanto da coragem de nossos soldados e policiais."
 NKR_safe_army: "Exército de Defesa de Artsakh"
 NKR_safe_army_desc: "O Exército de Defesa de Artsakh era a força de defesa da República separatista de Artsakh. Estabelecido em 1992, uniu unidades de defesa antes desorganizadas, formadas no início da década de 1990."
 NKR_planes: "Nossos Aviões"
 NKR_planes_desc: "Nossas forças armadas precisam desesperadamente de aviões; devemos solicitá-los à Armênia."
 NKR_safe_special_forces: "Forças Especiais de Artsakh"
 NKR_safe_special_forces_desc: "Além dos soldados comuns, como qualquer exército moderno, devemos ter forças especiais em nossas fileiras para cumprir as tarefas mais perigosas."
 NKR_safe_univer: "Colégio Militar Kristapor Ivanyan"
 NKR_safe_univer_desc: "O Colégio Militar Kristapor Ivanyan era uma instituição de ensino militar sediada em Stepanakert e operada pelo Exército de Defesa de Artsakh."
 NKR_safe_anti_air: "Força de Defesa Aérea"
 NKR_safe_anti_air_desc: "Por analogia com as Forças Armadas Armênias, também criaremos nossas próprias forças de defesa aérea."
 NKR_safe_mo_ra: "Universidade de Aviação Militar Armenak Khanperyants"
 NKR_safe_mo_ra_desc: "Pretendemos enviar nossos cadetes para estudar nesta universidade armênia, pois a chave para um exército forte são militares bem treinados."
 NKR_safe_vazgen: "Universidade Militar Vazgen Sargsyan"
 NKR_safe_vazgen_desc: "Pretendemos enviar nossos cadetes para estudar nesta universidade armênia, pois a chave para um exército forte são militares bem treinados."
 NKR_safe_aspar: "Aspar Arms"
 NKR_safe_aspar_desc: "Pretendemos comprar os produtos dessa empresa armênia para as necessidades de nossas forças armadas."
 NKR_safe_davisur: "Davisur"
 NKR_safe_davisur_desc: "Pretendemos comprar os produtos dessa empresa armênia para as necessidades de nossas forças armadas."
 NKR_safe_full_integrate_army: "Integração Total com as Forças Armadas Armênias"
 NKR_safe_full_integrate_army_desc: "Pretendemos fortalecer ao máximo nossa integração com as Forças Armadas Armênias; somente assim nossas forças combinadas conseguirão repelir o ataque de qualquer inimigo."
 NKR_safe_mvd: "Ministério do Interior"
 NKR_safe_mvd_desc: "Nossa segurança depende não apenas das forças armadas, mas também da polícia e dos serviços de segurança. Devemos garantir que recebam a devida atenção e os devidos recursos."
 NKR_safe_border_troops: "Tropas de Fronteira"
 NKR_safe_border_troops_desc: "As tropas de fronteira são tão vitais quanto o ar. Nossos inimigos nunca descansam, e nossas fronteiras devem estar sob vigilância constante."
 NKR_safe_police_troops: "Tropas Policiais"
 NKR_safe_police_troops_desc: "Moldadas à imagem das forças de segurança armênias, nossas forças policiais mantêm a ordem interna e estão prontas para responder a qualquer emergência."
 NKR_safe_nss: "Serviço de Segurança Nacional de Artsakh"
 NKR_safe_nss_desc: "Não é apenas a polícia que deve proteger o país, mas também os serviços especiais, algo com que o serviço de segurança nacional lida com sucesso."
 NKR_we_are_at_war: "Estamos em Guerra!"
 NKR_we_are_at_war_desc: "O Azerbaijão nos atacou, agora devemos lutar!"
 NKR_scorched_earth: "Terra Arrasada"
 NKR_scorched_earth_desc: "Devemos nos preparar para destruir parte de nossa indústria para que não possa ser usada pelo Azerbaijão."
 NKR_plant_minefields: "Plantar Campos Minados"
 NKR_plant_minefields_desc: "Mesmo que recuemos de algum território, devemos plantar minas por toda parte, para que eles não o atravessem com facilidade."
 NKR_final_defense: "Defesa Final"
 NKR_final_defense_desc: "Chegou a hora da defesa final. É melhor morrer de pé do que viver de joelhos."
 ARM_landmines: "Minas Terrestres de Artsakh"
 mines_lostprov_tt: "Minas terrestres serão plantadas nos territórios perdidos!"
 NKR_last_defense: "Última Defesa"
 arm_dashnak.1.t: "Nossa Aliança com Kocharyan"
 arm_dashnak.1.d: "Kocharyan, mesmo após deixar o cargo de chefe de Estado, tem séria influência sobre as elites e a sociedade armênias. Poderíamos negociar com ele e trazê-lo para o nosso lado, ou poderíamos lidar com ele de forma definitiva"
 arm_dashnak.1.a: "Temos um novo amigo!"
 arm_dashnak.1.b: "Nem pensar"
 arm_dashnak.2.t: "A Armênia Deseja Ampliar a Cooperação Militar"
 arm_dashnak.2.d: "A delegação armênia nos informou oficialmente do desejo de ampliar a cooperação militar entre nossos países. Na visão deles, esse passo é benéfico para ambos os lados. Devemos concordar?"
 arm_dashnak.2.a: "Claro!"
 arm_dashnak.2.b: "Não estamos interessados nisso."
 arm_dashnak.3.t: "A Rússia Concordou"
 arm_dashnak.3.d: "As delegações russa e armênia assinaram acordos para ampliar a cooperação militar, incluindo exercícios militares conjuntos em breve! Este é um novo passo nas relações entre os dois países."
 arm_dashnak.3.a: "Incrível!"
 arm_dashnak.4.t: "A Rússia Recusou"
 arm_dashnak.4.d: "A Rússia nos notificou de sua recusa. Segundo eles, não têm interesse em desenvolver cooperação militar conosco. "
 arm_dashnak.4.a: "Encontraremos outro aliado!"
 ARM_in_between_empires: "Entre a Águia e o Leão"
 ARM_in_between_empires_desc: "Ao longo da história, a Armênia foi dilacerada por impérios que tentaram dominar seu território. Os velhos impérios receberam novos nomes e aparências, mas a essência continua a mesma. Teremos de encontrar uma linguagem comum com eles para sobreviver."
 ARM_relations_with_europe: "Relações com a Europa"
 ARM_relations_with_europe_desc: "Devemos nos concentrar nas relações com a Europa e definir nossas relações atuais e futuras com ela."
 ARM_relations_with_russia: "Relações com a Rússia"
 ARM_relations_with_russia_desc: "Muitas pessoas na Armênia têm uma opinião muito polarizada sobre a Rússia. Independentemente da opinião pública, devemos construir nossas relações com a Rússia com base em nossos interesses."
 ARM_partn_coop_agrem: "Parceria e Cooperação"
 ARM_partn_coop_agrem_desc: "Estamos iniciando nossa longa jornada de cooperação com a União Europeia, e este acordo dará início ao nosso progresso rumo a nos tornarmos parte de uma grande família europeia."
 ARM_open_action_plan: "Plano de Ação de Abertura"
 ARM_open_action_plan_desc: "Estamos mais próximos do que nunca, em termos diplomáticos, na cooperação com a União Europeia."
 ARM_arm_eu_compr_agre: "Acordo de Parceria Reforçada"
 ARM_arm_eu_compr_agre_desc: "Nossa parceria com a União Europeia atinge alturas sem precedentes; talvez já estejamos a um passo de ingressar em uma amigável família europeia."
 ARM_join_council_of_europe: "Ingressar no Conselho da Europa"
 ARM_join_council_of_europe_desc: "Pretendemos cooperar com o Conselho da Europa, como um dos órgãos políticos europeus que reconhecemos como importantes, inclusive para nós mesmos."
 ARM_standing_comitee_eu_integr: "Comitê Permanente de Integração Europeia"
 ARM_standing_comitee_eu_integr_desc: "A integração à Comunidade Europeia é o nosso caminho, e pretendemos ampliar nossa participação em organizações, documentos e outros vínculos entre nós e a UE."
 ARM_open_up_for_ngos: "Abrir as Portas para as ONGs"
 ARM_open_up_for_ngos_desc: "Pretendemos permitir a entrada de ONGs europeias em nosso país para melhorar o desenvolvimento de nossa sociedade civil e democrática."
 ARM_instanbul_conventions_discuss: "Discussões sobre a Convenção de Istambul"
 ARM_instanbul_conventions_discuss_desc: "É hora de decidir, finalmente, o destino dos cidadãos LGBT em nosso país."
 ARM_prep_article_fortynine: "Preparar a Armênia para o Artigo 49"
 ARM_prep_article_fortynine_desc: "Finalmente nos aproximamos da etapa rumo à qual caminhamos há muito tempo; talvez este ano nos tornemos parte da União Europeia."
 ARM_prop_against_west_values: "Propaganda Contra os Valores 'Europeus'"
 ARM_prop_against_west_values_desc: "Os valores europeus do século XXI são alheios a nós; eles arrastarão nossa sociedade do desenvolvimento para a degradação."
 ARM_closing_ngos: "Fechar as ONGs"
 ARM_closing_ngos_desc: "As ONGs europeias não têm lugar em nosso belo país; sua influência é prejudicial demais para nossos cidadãos."
 ARM_seizing_eu_funds: "Confiscar Fundos da UE"
 ARM_seizing_eu_funds_desc: "Os investimentos ocidentais nos serão úteis; é hora de tomá-los para nós."
 ARM_diplomatic_distance_eu: "Distanciamento Diplomático da UE"
 ARM_diplomatic_distance_eu_desc: "Pretendemos nos distanciar da União Europeia e deixar de manter relações muito amistosas com ela."
 ARM_slander_pro_europ_parties: "Difamar os Partidos Pró-Europeus"
 ARM_slander_pro_europ_parties_desc: "Todos os partidos pró-europeus devem ser controlados e ter suas capacidades limitadas, e os propagandistas pró-Ocidente não devem poder fazer arruaça na Armênia."
 ARM_close_integr_orgs: "Fechar Todas as Organizações de Integração"
 ARM_close_integr_orgs_desc: "Estamos encerrando a cooperação com todas as organizações de integração europeias; já tivemos o suficiente do jeito europeu."
 ARM_negot_individ_trade_agreements: "Negociar Acordos Comerciais Individuais"
 ARM_negot_individ_trade_agreements_desc: "Pretendemos interagir individualmente com os países da UE; não reconhecemos a UE como representante desses países na política internacional."
 ARM_support_euroscept: "Apoiar o Euroceticismo"
 ARM_support_euroscept_desc: "O euroceticismo é um dos alicerces de nossa relação com a Europa e continuará sendo."
 ARM_levons_legacy: "O Legado do Rei Levon"
 ARM_levons_legacy_desc: "Os laços fraternos entre a França e a Armênia atravessaram os anos e continuarão a atravessar quaisquer problemas"
 ARM_cultural_econ_fra: "Relações Culturais e Econômicas"
 ARM_cultural_econ_fra_desc: "A França e a Armênia estão ligadas por muitos aspectos culturais e históricos, e pretendemos ampliar a cooperação com ela em benefício dos dois povos."
 ARM_french_educ_arm: "Educação Francesa na Armênia"
 ARM_french_educ_arm_desc: "A educação francesa é considerada uma das melhores do mundo, e pretendemos abrir filiais de universidades francesas em nosso país."
 ARM_military_coop_fra: "Cooperação Militar com a França"
 ARM_military_coop_fra_desc: "Pretendemos ampliar a cooperação entre as forças armadas da Armênia e da França a um nível sem precedentes."
 ARM_francophonie_membership: "Adesão à Francofonia"
 ARM_francophonie_membership_desc: "Pretendemos nos tornar parte da Francofonia, o que fortalecerá significativamente nossos laços com a França."
 ARM_armenia_eu_idea: "Armênia - a União Europeia"
 ARM_eu_coop_agreement: "Acordo de Parceria e Cooperação"
 ARM_eu_council: "Conselho da Europa"
