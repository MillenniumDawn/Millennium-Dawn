ast_the_lucky_country: "The Lucky Country"
ast_the_lucky_country_desc: "After Donald Horne coined the saying in 1964, most Australians have misinterpreted the phrase as describing the country’s fortunate success in mining. While it is true that we have been gifted a very large land mass, very much full of rare and valuable ores, Donald used the saying to mock the leaders of the time for too heavily investing in that avenue, and neglecting further economic opportunities. In short: we weren’t diversifying enough. This has left us in a situation where Australia is only a few tech or manufacturing plants keeping us from being a full blown rentier state. We are entirely reliant on our exports, and either we accept that or we begin the process of divesting."
ast_fuel_the_mining_boom: "Fuel the Mining Boom"
ast_fuel_the_mining_boom_desc: "Mining has been the lynchpin of the Australian economy quite literally since it became a colony. From the gold rush to the present day, mining has kept our economy churning and expanding. All of which consumes an untold amount of petrol keeping the ore trucked and shipped out. If circumstances in the middle east get any worse we could watch our economy grind to a halt. Before we expand any more we need to secure our strategic reserves at home, and keep the supply ready for a rainy day."
ast_acis_ast_scheme: "acis_ast Scheme"
ast_acis_ast_scheme_desc: "The Automotive Competitiveness and Investment Scheme (acis_ast) was created to provide our automotive industries with duty relief and funding to boost investment, research, and development. Our industry has been lacking when compared to the likes of those around us, so a boost to our home grown companies isn’t going to go unwelcome."
ast_a_sea_of_panels: "A Sea of Panels"
ast_a_sea_of_panels_desc: "Our rural solar panel plants are a sight to behold. Like a circular artwork, soaking up the rays that are usually just giving tourists sun burns. Our current mix of renewables and fossil fuels is a spot short of healthy, and an expansion of our current solar arrays will balance that out."
ast_commit_to_renewables: "Commit to Renewables"
ast_commit_to_renewables_desc: "The future of our energy production should not be dictated by our supply of coal or gas. Our development of renewable energy technologies has progressed surprisingly quickly in recent years. It’s high time we took advantage of that."
ast_harness_the_wind: "Harness the Wind"
ast_harness_the_wind_desc: "In Greek mythology Aeolus was the god entrusted by Zeus to control the winds, only releasing the terrible storms when commanded to. While we can't control the winds, thanks to our scientists, we can harness their power. Installing more turbines where they benefit most will give us a nice source of clean, sizable energy."
ast_rewire_the_nation: "Rewire the Nation"
ast_rewire_the_nation_desc: "There are few problems we’ve found in this nation that can be fixed by dumping a load of money onto it. This is one of them. The engineers have already had their committees and planning, and now we’re ready to roll out an upgrade to electrical grids across the nation, modernizing them for our current capacity needs."
ast_fix_the_potholes: "Fix the Potholes"
ast_fix_the_potholes_desc: "The bane of driving in this country has always been the potholes. Ask any driver, urban or rural, they tell tales of car repairs, near crashes and other horror stories. As the duty to protect our citizens falls under the government, it is our responsibility to rid this plague."
ast_north_west_shelf_expansion: "North West Shelf Expansion"
ast_north_west_shelf_expansion_desc: "The Northwest Shelf has been one of our longest and most successful gas plants on the peninsula, processing a massive chunk of all our oil and gas extracts. The current proposal suggests extending the operational life of the project until 2070, providing us with much needed processing till then."
ast_its_just_coal: "It's Just Coal!"
ast_its_just_coal_desc: "There are opponents of our expansion that might fear fossil fuels. To them we say: don't be afraid, don't be scared, it won't hurt you. It's coal. To mine it as Australians is almost in our blood. We cherry this dark, dusty ore and it fuels our homes. Renewables may be the new thing, but coal will always be there for us, burning away."
ast_high_speed_focus_ast: "High Speed Rail"
ast_high_speed_focus_ast_desc: "The curse of high speed rail has plagued our states since the 80s. Every time a federal government begins the process of constructing rail above 200 km/h, the project never gets past the planning stage. Not this time. We’re stepping in now, and we’re seeing it through. We have the technology and the route: Brisbane to Sydney to Melbourne. Nothing is standing in our way."
ast_dig_deep: "Dig Deep"
ast_dig_deep_desc: "Aluma refining has made a number of recent breakthroughs in our remote mining centres. If we directly put pressure on expediting the process of mining rights approval, then they can get to work drilling sooner and deeper."
ast_lng_megaprojects: "LNG Megaprojects"
ast_lng_megaprojects_desc: "Our LNG facilities are one of our more state of the art methods of transporting natural gas to other nations, and it's saved us tremendously in shipping costs. The process of cooling the gas to very low temperatures so it turns into a liquid, and shrinks the volume of gas by 600%. Working with the companies to expand these facilities, and in a way, shoulder the construction costs, will get them up and going sooner."
ast_the_boom_never_ends: "The Boom Never Ends"
ast_the_boom_never_ends_desc: "Sometimes you get lucky, and sometimes you’re just Australia. Things are booming here in the mining sector, and we’d like to keep that boom going. Investments, stimuluses, the whole lot. Our companies are going to keep drilling with our approval and all we need to do is sit back and enjoy it."
ast_treat_the_farmers: "Treat the Farmers"
ast_treat_the_farmers_desc: "The farmers in this nation happen to be some of the hardest working around. By the end of the day their hands are covered in dirt so that ours can have a diamond ring on them. Or so I’ve heard. Anyway, we need to reward them for their work. A treat, if you will."
ast_enjoy_the_prosperity: "Enjoy the Prosperity"
ast_enjoy_the_prosperity_desc: "When you grill the experts they all agree that our mining sector is going nowhere. Right now exports are fueling this nation like we’ve never experienced before, and the rewards are ours to enjoy. We can invest substantially in the infrastructure to support future mining endeavors and fuel production while the iron is hot. Ensuring we get the most out of the boom."
ast_heavy_industry_projects: "Heavy Industry Projects"
ast_heavy_industry_projects_desc: "Our state owned construction companies have been working hard to build up this wonderful country, but the demand for greater capacity is quite evident. Rolling out the plans for an expansion will be expensive, but straight forward. The world will see the Australia that we’re destined to be."
ast_urban_expansion_initiative: "Urban Expansion Initiative"
ast_urban_expansion_initiative_desc: "We can’t build without land, and this proposal has been drafted to allow us to bypass a lot of the usual requirements for land acquisition that some of the protesting variety are calling “seizure,” which it is not. The land will be paid for, of course, the process will simply be faster."
ast_defy_the_mantra: "Defy the Mantra"
ast_defy_the_mantra_desc: "We will not remain beholden to some nickname. Australia will evolve or it will die. When the mines dry up or the next economic disaster comes our economy will remain because we invested in its future. By expanding into a number of economic avenues we can diversify our domestic production. We won’t be some rentier state, but a robust nation."
ast_global_weapons_manufacturing: "Global Weapons Manufacturing"
ast_global_weapons_manufacturing_desc: "Australia has never been known as a global supplier for weapons, aside from more under the table commitments. If diversification is necessary, increasing our production, and potentially supplying other nations in the process, might make the investment worthwhile."
ast_overseas_opportunities: "Overseas Opportunities"
ast_overseas_opportunities_desc: "Many of our largest corporations already heavily spend overseas and have set up shop in neighbouring countries. That spending can be encouraged if we soften up the current codes and plant a few incentives here and there."

#army
ast_the_white_paper: "The White Paper"
ast_the_white_paper: "Our senior staff has recommended we begin the restructuring with a target to set the tone. We have a few options to get things moving, but ultimately it depends on which area we think the army could be best improved. Weapons production is always going to be a factor we should be considering. Setting production targets could speed that preparedness along. Troop count is another area that could be fixed with faster training quotas. Lastly, we could off-load the burden to our defense industries. Moving up the delivery time on a few projects should motivate them enough."
ast_hardening_our_units: "Hardening Our Units"
ast_hardening_our_units_desc: "During the gulf war and other interventions since, asymmetrical threats have become a new and frightening form of warfare that we’ve had to deal with. Occasionally greater firepower doesn’t cut it, and for the unlucky few who have experienced these new attacks, particularly improvised explosive devices, those who survived did because their vehicles held up. Developing our hardness can be the difference our troops need to stay alive, and continue operations."
ast_a_networked_army: "A Networked Army"
ast_a_networked_army_desc: "The digital landscape has been a wonder for our industries so far. Similarly, by transforming land forces into a digitally connected, sensor-to-shooter force allows for faster decision making and instant relaying with command. Our joint-forces will be more unified than ever, and operations can be managed directly by command to ensure the right decisions are made at the right time."
diisr_ast: "diisr_ast"
diisr_ast_desc: "For one reason or another we don’t have a singular, government guided research institute. We do have quite a few private ones, and even some lead at a state level, but the demand for a facility to undergo the research we require needs something grander. Plans for a Department of Innovation, Industry, Science and Research have landed on our desk, and construction is simply awaiting approval."
ast_rnd_tax_incentive: "R&D Tax Incentives"
ast_rnd_tax_incentive_desc: "Now that the diisr_ast is up and operational, dedicating a portion of funding to Research and Development, and a number of subsidies to begin projects ensures we’re on the bleeding edge of innovation."
ast_our_beloved_bushmaster: "Our Beloved Bushmasters"
ast_our_beloved_bushmaster_desc: "The Bushmasters have been an icon in our army that has captured the hearts of many military experts for its versatility, signature design and field capabilities. They’ve been serving us well overseas, and producing more of them should be a priority. Thankfully that request was already included in the White Paper."
ast_the_special_forces: "Who Dares Wins"
ast_the_special_forces_desc: "The Australian SAS have become a source of pride for many, and with good reason. The elite regiment, which was originally modelled after the British unit, has come in quite handy for sensitive overseas operations. Keeping them kitted with the best technology we have ensures their success continues."
ast_lessons_from_the_middle_east_ast: "Lessons from the Middle East"
ast_lessons_from_the_middle_east_ast_desc: "We learnt a number of things from a number of operations in the middle east. Notably such has been the incompatibility between our uniforms and the dust hewn weather commonplace in the region. While they’re designed for the heat of Australia, they can be improved to be better."
ast_remembering_the_anzacs: "Remembering the ANZACs"
ast_remembering_the_anzacs_desc: "Our ANZAC Ceremony has always commemorated those 'who served and died in all wars, conflicts, and peacekeeping operations.' That includes not just those who perished in the Great War, but our troops in recent conflicts like the Gulf War and in Indonesia. The lesson we take is the sacred duty to keep our troops safe. Now, as war constantly changes, we too must change and innovate to give our forces the greatest chance on the battlefield. Otherwise we’ll be remembering them at the next ceremony."
ast_never_another_darwin: "Never Another Darwin"
ast_never_another_darwin_desc: "On the 19th of February 1942, a bombing raid of some 188 Japanese aircraft tore through Darwin. Aside from the destruction of our military infrastructure, the loss of personnel and civilian lives was catastrophic, and the largest of any single attack against us in the war. The rules of warfare have changed, but the lessons have stayed the same."
ast_new_tools: "New Tools"
ast_new_tools_desc: "If the 21st century has proven anything to us, it’s that complacency kills. Sure we could keep the same rifles, keep our doctrines the same, but our enemies won’t. Innovation across the Atlantic and the Pacific has produced finer weapons, designed for a greater range of environments and threat types. Something we can’t afford to ignore."
ast_old_reliable: "Old Reliable"
ast_old_reliable_desc: "We already looked abroad during the cold war, and we went with the Austrians. Steyr got it right with the AUG. A streamlined, elegant gun that our manufacturers have spent decades perfecting since. Why change a good thing? We can instead invest in expanding the current production, ensuring we’re ready for any surprise demands."
ast_lithgow_arms: "Lithgow Arms"
ast_lithgow_arms_desc: "The Lithgow Arms plant has been a symbol of our capabilities and endurance since 1912. It served us faithfully through the first and second war and has produced well over a million rifles for us in that time. That’s why the sad state of it now is difficult to behold. Something needs to be done."
ast_grow_our_command: "Grow Our Command"
ast_grow_our_command_desc: "One of the white paper creations has been socomd_ast. Special Operations Command, designed to unite our special forces units with the Commandos. With the constantly increasing threat that terror has been posing, along with the usual challenges, our special forces are needing all the assistance they can get. Combining the effort may create a united offence we can wield."
ast_the_second_white_paper: "The 2nd White Paper"
ast_the_second_white_paper_desc: "With the more-or-less success of the 2000 White Paper, the administration has given us a new directive much similar to the previous. Continued expansion and an edge in our technological prowess to keep us, pound for pound, on par with the giants. We’ve stepped up to the plate before, we can do it again."
ast_strategic_reform: "Strategic Reform"
ast_strategic_reform_desc: "The current state of our departments isn’t going to cut it. A top to bottom reform of our current strategic forces will trim some of the inefficiencies that have grown in the last few decades, and allow us to evolve into a much more tactile, responsive force that can deal with the ever-changing situation the Pacific has bestowed us."
ast_incorporate_the_peacekeeping_training_ast: "Incorporate the Peacekeeping Training"
ast_incorporate_the_peacekeeping_training_ast_desc: "Australia has been a part of United Nations peacekeeping efforts since the end of World War 2, providing personnel and resources. During these decades, and especially the recent intervention in East Timor, we’ve gained a number of lessons in warfare that could be better implemented into our own doctrine, keeping our troops protected in even the most unlikely of environments."
ast_recruitment_campaigns: "Recruitment Campaigns"
ast_recruitment_campaigns_desc: "Ever since the “Coo-ee-won’t YOU come?” poster, we've had a knack for recruitment campaigns. With the advancements of the internet a whole new realm of opportunity has presented itself for us to utilize. We can platform a number of ads that take advantage of the space, and reach those less inclined to watching regular TV."
ast_land_one_two_one: "LAND 121"
ast_land_one_two_one_desc: "The project has been an ongoing effort to replace many of our aged, unprotected medium and heavy trucks with enhanced Rheinmetall designs, meant to improve their logistics and mobility, along with the armour benefits. So far the project has been a success, and now our anti-air and close support vehicles are next to be upgraded."

#mfc
ast_stop_panicking: "STOP PANICKING"
ast_stop_panicking_desc: "Everyone needs to CALM DOWN. We’re the government, we don’t control the economy. If things are going bad, even for a moment, suddenly everyone is pointing fingers at us. Worse, they’re beginning to panic. Stimuluses to just about everyone should buy us a little more calm till we can get a handle on this."
ast_guarantee_the_banks: "Guarantee the Banks"
ast_guarantee_the_banks_desc: "If the banks are scared, we’ll keep them in the green. We’ll do what it takes to keep them going, hell, we’ll guarantee ALL bank deposits. No bank is going under in this country and we’ll be putting out enough fiscal bandaids to keep the GDP chugging from government spending alone."
ast_grab_the_securities: "Grab the Securities"
ast_grab_the_securities_desc: "The housing market in the US was the thing that started all of this, and thousands of homeowners in Australia are wondering if the same thing will happen to them. We can assure the public by buying up the mortgage-backed securities to support our housing finances, and ensure they don’t go bust."
ast_turn_things_around: "Turn Things Around"
ast_turn_things_around_desc: "The National Building and Jobs Plan has become the single largest economic package we’ve ever put together. It covers school infrastructure, social housing, home building, tax breaks, rail projects and more stimulus payments than you can count. The peak of our support for the nation should show that we’re serious about getting things back on track, and simmer everyone’s nerves."

#the navy
ast_the_royal_australian_navy: "The Royal Australian Navy"
ast_the_royal_australian_navy_desc: "Our pride and joy moving about off our coast is the RAAN. If it wasn’t obvious Australia is an island nation. For centuries the only way any invasion force could reach our shores was through a fleet, and protected from that we once were by the Royal British Navy. Now of course we could be hit by an intercontinental missile, and far more damage could be done without anyone having to land on our shores, but that’s hardly the point. As an ode to the role they once had, and with a job no less important, we name our navy royal, and dispatch it to keep the waves secure as they once did. To protect our glorious nation."
ast_embrace_the_support_role: "Embrace the Support Role"
ast_embrace_the_support_role_desc: "Embrace the Support Role - The reality of our position in the Pacific is that of stopgapping. On our own, one-on-one, we don’t stand any chance against a Chinese or Russian fleet. We’ll put up a fight, but the only way we’re winning the war is through our allies. Our role has always been playing second fiddle to the Americans, and that’s been fine so far. All we have to do is hold out until they arrive, and then we win. There’s no shame in playing the support role, especially if we do it well."
ast_we_are_the_pacific: "We are the Pacific"
ast_we_are_the_pacific_desc: "The times have changed. The Soviet Union is no more, and China is not their successor yet. In reality a naval war is very unlikely on the horizon. If it was, we might not hold our own. Not with this navy. If we commit to expanding it we can create a force few might reckon with. Using everything at our disposal our nation’s role might not be set in stone."
ast_trade_support: "Trade Support"
ast_trade_support_desc: "One of our vital responsibilities has been protecting trade between us and our valuable partners. Keeping the flow of goods safe from interdiction by our naval rivals, like China, ensures that trade with our biggest importers, like China, continues to thrive."
ast_multidimensional_warfare: "Multi-Domain Operations"
ast_multidimensional_warfare_desc: "By integrating military power across land, sea, air, space and cyber domains we stand at a significant advantage over enemies caught lacking in these fields. Both the air and navy departments need to be working together on this."
ast_whetstone_training: "Whetstone Training"
ast_whetstone_training_desc: "Like a sword left idle, if our Navy is not constantly tested and refined, it will rust through. Sea combat exercises are going to thrash our cadets and sailors into shape, or so help me. They will be ready for any engagement at any time because that's the job, and they will do us proud."
ast_wide_scanning: "Wide Scanning"
ast_wide_scanning_desc: "The Jindalee Operational Radar Network (JORN) has passed its prototype period and has moved onto phase 5 implementing, which essentially means it's very likely the most advanced radar tech around, monitoring at ranges beyond 3,000 kilometres. Inventing the thing was the easy part, putting it in our ships is the hard part."
ast_an_outside_review: "An Outside Review"
ast_an_outside_review_desc: "In order to measure our capabilities we’ve commissioned an outside review. The results are a somewhat startling critique on our production capacity, which we’ll need to upend if we’re going to get anywhere developing a serious navy."
ast_the_middle_ships: "The Middle Ships"
ast_the_middle_ships_desc: "A lot of sweat and tears has gone into developing our Hobart-class destroyers. Replacing our Perth-class ships from the 60s, and designed to restore our guided missile capabilities, they may be our most important upgrade across the board."
ast_screening_role: "Screening Role"
ast_screening_role_desc: "If we’re supporting our allies in the Pacific we need to be the eyes and ears for them. Our ability to see threats before they’re at our door is not just a tactical benefit for them either, it helps us prepare and control the field at play. The better we are at this, the better we’ll perform."
ast_below_the_enemy: "Below the Enemy"
ast_below_the_enemy_desc: "While some of our submarines were commissioned more recently, much of our fleet is very old. Upgrades have been made to the majority, but this doesn’t change the fact that they are actively putting us at a technological disadvantage, especially when our best chance is through indirect fighting."
ast_containment_theory: "Containment Theory"
ast_containment_theory_desc: "During the cold war we operated under the practice of ‘containment theory,’ alongside the Americans. A theory designed explicitly to block Soviet expansion. The board for geopolitics has changed, but in some ways the assignment hasn’t. Our enemies carry out a very real, expansionist objective. Whether that be through diplomacy or island building, our sovereignty is unquestionably under threat if we can’t resist this, or at the very least curb it. Consistent naval presence, along with successful diplomatic action is the only way we’re going to see a future without direct war, which means it's our only option."
ast_the_groundwork: "The Groundwork"
ast_the_groundwork_desc: "The hard work needs to be put in setting up the infrastructure for what we’re trying to do. A massive scale expansion of our current ship building yards and department spaces will need to be rapidly employed, which will expectedly be a tad expensive."
ast_expand_command_capabilities: "Expand Command Capabilities"
ast_expand_command_capabilities_desc: "With the scope of what we’re shooting for we’re going to need to expand the Naval Headquarters, and the Department of Defense to manage it. Keeping both branches closely connected during the transition, while overseeing the production increase is going to be costly, but necessary."
ast_carrier_project: "Carrier Project"
ast_carrier_project_desc: "It wasn’t all that long ago that Australia had its own aircraft carriers. The HMAS Sydney and Melbourne were fit for any engagement and true beauties of the sea. As the times changed and our military expenses shrank, such behemoths were no longer viable. Until now. Carriers will be returned to our fleet and the legacy of our retired ships will live on."
ast_like_submarines_in_a_barrel: "Like Submarines in a Barrel"
ast_like_submarines_in_a_barrel_desc: "We need to bridge the carrier gap, and to do so we’re going to have to utilise our helicopters. The MH-60R Seahawk is a prime example for accomplishing our mobility goals. We can invest in the project to develop the design, and begin production."
ast_ship_to_air: "Don't Feed the Destroyers"
ast_ship_to_air_desc: "Our destroyers are hungry for missiles, and the only way to feed them is more missiles. Not the old tech, that won’t do. We’re gonna need something brand new to feed these creatures."
ast_grants_to_contractors: "Grants to Contractors"
ast_grants_to_contractors_desc: "If they didn’t give us exactly what we wanted all the time, I’d say these companies were taking advantage of us. Thankfully the right investments have shown to be reliable enough to keep up the partnership. A little more investment and we might be seeing the production improvement we need."
ast_adf_academies: "ADF Academies"
ast_adf_academies_desc: "Our premier institute for combining military training with university education is in Canberra. It’s only one building, but for our defense demands that number is going to need to go right up. We’ll build a number of them in all our major cities, and maybe loosen a few of the requirements too."

#the airforce
ast_the_raaf: "The Royal Australian Air Force"
ast_the_raaf_desc: "Ah, the Royal Australian Air Force. Our principal aerial warfare department, continuing to keep the skies over Australia safe and secure. They have the best uniforms, the best food, and the coolest job out of the ADF. But let's not dwell on the perks. The mandate has been issued, and the focus is simple. Air superiority in the Pacific, and support for our expeditionary operations. How we go about that is at our discretion."
ast_fourth_generation_striking: "4th Generation Striking"
ast_fourth_generation_striking_desc: "Getting our hands on fourth generation aircraft is not going to be easy, and we'll need to fully utilise our connections and technological ability to get there. The gap between the 3rd and 4th gen fighters isn’t that massive, but at the rate that 5th generation is approaching, it’s obvious we don’t want to be left behind."
ast_globemasters: "Globemasters"
ast_globemasters_desc: "The Boeing Globemaster III is our premier cargo aircraft for strategic airlifts and transporting troops. Boeing certainly delivered on this one. The model is bigger and much more powerful than the previous, but wouldn't you guess it, we want another one. We’ll send the specs over to them and hope the results are enough."
ast_shadow_in_the_sky: "Shadow in the Sky"
ast_shadow_in_the_sky_desc: "The AAI RQ-7 Shadow is our most effective recon unit and unmanned combat drone currently developed. Another nifty tech lifted from the Americans which marks a stark change to the nature of warfare. As our mobile infrastructure increases, and the range in which our operations act, the capacity to fight has effectively been increased far beyond what we were previously capable of."
ast_the_roulettes: "The Roulettes"
ast_the_roulettes_desc: "The Roulettes are the Air Force's very own aerial aerobatic team. They’ve flown around the world performing a number of daring shows and have naturally captured the admiration of those lucky enough to see them. The bottom line is if whenever they fly it does a number for our reputation, then by all means we’re letting them fly."
ast_employ_ballistic_missiles: "Employ Ballistic Missiles"
ast_employ_ballistic_missiles_desc: "Long-range precision strike missiles are often employed to deter conflicts. They are the magical tool used to dance along the gray line between non-confrontation and all out war. If, for example, one of our bases overseas were to be hit, we could deploy a “proportional response” wherein we hit them at an equally strategic site with our long-range missiles, and everyone gets to go home happy with only slightly bruised egos and no worry of war. In theory."
ast_project_wedgetail: "Project Wedgetail"
ast_project_wedgetail_desc: "The Boeing E-7 project is one of our more recent endeavors into mobile command centres. It provides us with an early warning system, thanks to the radar slapped on top, and real time locational intelligence over the battlefield. The aircraft can of course be refitted and used for other aerial purposes at our discretion."
ast_keep_them_out: "Keep Them Out"
ast_keep_them_out_desc: "While detecting them is one thing, actually deterring enemy aircraft from strafing Australian cities is another. Our planes can’t always be in the air, so portable and fixed ‘NASAMS’ systems will serve in their place. Accompanied by radar they are a powerful defensive force to behold."
ast_preserve_the_super_hornets: "Preserve the Super Hornets"
ast_preserve_the_super_hornets_desc: "Since the retirement of the F-111s, the 24 F/A-18F Super Hornets have stepped up to take their place, which themselves are getting up there age wise. We can improve the model and update a number of internal systems to assist the change to ensure they’re ready for the new role."
ast_masters_of_command: "Masters of Command"
ast_masters_of_command_desc: "Utilising helicopter logistics for operations has revolutionised our mobile potential. Without the need for airports, they represent the best use-case for high tension zones and evolving battlefields. Implementing an agency dedicated to logistical helicopter operations will enhance their proficiency across the board."
ast_reopen_cockatoo_island: "Reopen Cockatoo Island"
ast_reopen_cockatoo_island_desc: "The growing need for repair dockyards has begun to wear on our current infrastructure. Cockatoo Island, which only recently closed in the 90s but has become something of a tourist destination, will need to be rebuilt from the ground up in order to repair the newest generation of broken ships."
#howard
the_howard_government: "The Howard Government"
the_howard_government_desc: "The sun rises on our nation. Rich in beauty, of golden soil, and truly girt by sea. Australia is unique in its place as a regional power in the pacific; a country with many friends and few enemies. Yet Australians yearn for a better tomorrow, and many have fallen through the cracks of society. The working class has rallied around the Howard government in the last election, leaving the Liberals enjoying a comfortable majority. \n \nNow a mandate for cautious change has been handed to us and we are expected to follow through. The Keating government left us with a sizable hole in the budget that, whilst we have been rigorous to patch up, still leaves us with the job of bringing it further into the green. Protests have littered the streets demanding action, and our own businesses call for economic reform. \n \nThe lucky country is in our hands."
ast_new_millennium_economics: "New Millennium Economics"
ast_new_millennium_economics_desc: "The budget has been handed up and approved. Fiscal discipline and a budget surplus are our most demanded policies, but that doesn’t mean we can’t spend a little to make a buck down the line. Various bloated assets in the government are prime to be sold, and plenty of cuts can still be made to finance expansions of other programs. \n \nThe reserve bank has already raised the cash rate. It’s up to us to follow suit. We’ll be tough, but fair as always."
ast_trim_taxes: "Trim Taxes"
ast_trim_taxes_desc: "During the last election we made promises to cut taxes for hard-working Australians. Our position hasn’t changed. Older residents and high income earners can be the first to receive a stream of tax cuts, leaving more money funneling into local business and more in the bank."
ast_restrict_welfare: "Cut the Dole Bludgers"
ast_restrict_welfare_desc: "Our expansions to the dole have left the budget-wary of the party nervous. Without a way to slow the bloat we’ll be undoing our hard work balancing the books these last few years. If we start with limiting the scope of the program, and putting in hard requirements to stay on it we might get by. Increasing the mutual obligations will also cut off some of the lesser productive participants."
ast_another_round_of_tax_cuts: "Another Round of Tax Cuts"
ast_another_round_of_tax_cuts_desc: "What kind of government would we be if we didn’t think about our businesses. Much growth has been made during our term, but some small businesses, and even a few large ones, have shown slowing productivity. We can ease their hardship with further tax cuts and a little reform to chum the waters for competition."
ast_launch_the_gst: "Launch the GST"
ast_launch_the_gst_desc: "The legislation has passed and the ‘Goods and Services Tax’ can now replace the antiquated systems of yesteryear. Lees and the other naysayers can groan about it, but the GST has passed its trials. Businesses can benefit from a streamlined, wholesale tax, and it won’t hurt the budget either."
ast_cater_to_the_seniors: "Cater to the Seniors"
ast_cater_to_the_seniors_desc: "Any healthy government dabbles in crossbenching from time to time. Even policies of opposing politics should be considered in the best interest of our people. The GST has provided a substantial boost to the budget, but many of our seniors are not feeling the benefit. Exempting basic food from the program, and a generous compensation to pensioners should soften the blow. The Liberals will not be sacrificed on the pyre of ideological purity."
ast_rethink_negative_gearing: "Rethink Negative Gearing"
ast_rethink_negative_gearing_desc: "Our changes to boost negative gearing has not been without controversy. Home owners and especially our older voting base have lauded the changes, however, those unable to afford homes have seen the prices rocket in only a short period. The more Labor inclined in our government are seeing effects spiral before our term is even up. It might destroy our good will with the older class, but a long term healthy economy could salvage the damage. We can only hope the battlers stay loyal."
ast_first_home_first_served: "First Home, First Served"
ast_first_home_first_served_desc: "Another of the projected victims of the GST is first home owners. With the price of building materials going up, we’ve allocated a grant for $7000 to be issued to first home owners. Helping them get a leg up in the growing competitive market."
ast_meeting_the_mining_giants: "Meeting the Mining Giants"
ast_meeting_the_mining_giants_desc: "It’s not uncommon for a nation's leader to meet with the big players. The Boulder Chamber of Commerce and Industry has requested an in-person meeting, likely spurred by our recent tax cuts. We can only expect that they're emboldened enough to make more demands. Ultimately it's up to us whether we heed them."
ast_proud_and_free: "Proud and Free"
ast_proud_and_free_desc: "If we look into the regions suffering most from skill shortages and unemployment, we can focus on establishing as many as 24 technical colleges targeted at early school leavers and the unemployed. By also extending Work for the Dole to apprentices, it’ll put them on the same footing as university students. The Defense Force has also committed to allocating a portion of equipment and maintenance towards additional skill training. \n \nStudents are going to be freer to pursue their career passions while our manufacturing industry is bolstered. This more or less ticks a dozen low-income bases at the same time, and certainly broadens our voting base with the TAFE youth."
ast_invest_in_people: "Invest in People"
ast_invest_in_people_desc: "Those facing rock bottom can find it hard picking themselves back up again. While not encouraging long-term unemployment, we can avoid penalizing them by including incentives to attend training programs at TAFE and other defense and community projects. Less a free handout and more investing in the future of our workers."
ast_beef_up_the_dole: "Beef Up the Dole"
ast_beef_up_the_dole_desc: "So far our Work for the Dole program has been a resounding success. Fewer Aussies are unemployed, and those in the program are busy improving their aptitude for work. We can expand the Dole to incorporate public works and broaden the age range for suitable applicants."
ast_the_baby_bonus: "The Baby Bonus"
ast_the_baby_bonus_desc: "No longer will having a child come with financial risk. By replacing the Maternity Allowance, new mothers will receive a once off payment of $3000. Encouraging young families to take the plunge and softening the burden that comes with new parenthood."
ast_protect_the_water: "Protect the Water"
ast_protect_the_water_desc: "Some of the furthest rivers inland are only a week of bad weather away from completely drying up, denying entire farms and towns of water. The National Water Initiative is the first step in our sustainability pursuit. Managing water usage and maintaining sustainable extraction levels in the most remote communities keeps the supply of water available for millions."
the_kyoto_protocol_ast: "The Kyoto Protocol"
the_kyoto_protocol_ast_desc: "We’ve already negotiated fair terms in the proposal from the UN. Ratifying it would put us together with the other 84 countries that are already committed to reducing our greenhouse gases. Whatever effect we’re having on global warming, you’ll be sure we’re making it minimum, and that Australia is a responsible nation in this matter."
ast_the_carbon_pollution_reduction_scheme: "The Carbon Pollution Reduction Scheme"
ast_the_carbon_pollution_reduction_scheme_desc: "Rudd has proposed a scheme to reduce the current carbon levels outputted from our industries by a total of 25%, using ‘caps’ that companies would need to keep their pollution levels under. Rudd is a typically lofty man, and a whinger when it comes to climate change, but the public has his back. If we tweak the scheme just enough to avoid damaging our competitive advantage in fossil fuels, we might get away with it."
ast_the_drought_force: "The Drought Force"
ast_the_drought_force_desc: "So far the transition into the new century has been a rocky one. Perhaps the biggest sign of worry has been the “millennium drought,” which may be the worst drought we’ve experienced in our nation's history. With our emergency responders already busy attending to it, we’re stretched looking for options closer to our government. We’ve already incorporated our Work for the Dole participants in public works, and now we can focus them onto private lands affected by this natural disaster."
ast_a_nation_worth_preserving: "A Nation Worth Preserving"
ast_a_nation_worth_preserving_desc: "We’ve made enduring improvements to our nation's sustainability. Maybe it won’t affect the world as a whole, but for Aussies, the nation they love will persevere. The waters are clearer, the city smog has disappeared. There might be more left to do, more methods for cleaner energy or preservation means, but for now we can rest as a prouder nation."

#indigenous
ast_practical_reconciliation: "Practical Reconciliation"
ast_practical_reconciliation_desc: "\"I’d like to begin by acknowledging the Traditional Owners of the land on which we meet today. I would also like to pay my respects to Elders past and present.\" \n \nIt might sound like waffle, but the relationship with indigenous Australians has not been one without strife. Every government must recognise its history with dignity and respect, and leadership is not one without responsibility. However we go forward, we acknowledge the past, and embrace the future. Uniting Australians with a measured approach."
ast_walk_the_journey: "Walk the Journey"
ast_walk_the_journey_desc: "It’s been a long road, and I know a difficult one, for many Australians. As many there are that we’ve helped, it is naïve of any of us to pretend that some do not remain. Our efforts to heal that gap, and uplift those left behind, must start with programs focused on health, education, housing and employment. Programs already discussed in parliament will be funded and expanded. The underprivileged and the coalition will walk hand in hand."
ast_a_national_apology: "A National Apology"
ast_a_national_apology_desc: "Keating wants to undercut us. Fine, we’ll play Labor at their own game. I’ll give those galahs at the Guardian what they want. I’ll take the responsibility of previous generations, and then we can MOVE ON. Indigenous Aussies will get their fair shake, and no one will be saying I didn't help them."
ast_its_mabo_its_the_vibe: "It's Mabo, its the Vibe"
ast_its_mabo_its_the_vibe_desc: "The Mabo case was a landmark decision for the High Court. Eddie fought for Native Title, the existence of pre-colonial lands and ended terra nullius for good. \n \nBy working with the Indigenous communities, and putting forward an amendment to include a Statement of Reconciliation in the constitution's preamble, we would acknowledge their rights to the land, expanding the existing Aboriginal Land Rights Act. It’s symbolic, maybe, but it shows we’re serious about equality. All voters will equally have a say."
ast_the_civil_partnership_act: "Civil Partnership Act"
ast_the_civil_partnership_act_desc: "Currently states and territory restrict same-sex couples from being recognised as even being in a relationship, which can cause a number of minor issues for them legally. While we reframe from approaching the topic of same sex marriage as a moral stance, we can assist those who don’t wish to marry, and at the very least put the decision to a vote."
ast_avoid_the_speech: "Avoid the Speech"
ast_avoid_the_speech_desc: "I do not believe, as a matter of principle, that one generation can accept responsibility for the acts of an earlier generation. I don't accept that as a matter of principle. This government will not be handing out empty gestures, or caught ticking off the indigenous matter for political points. The coalition should appear unified on this. Any talk of attending the reconciliation walk should be nipped in the bud."
ast_crack_down_on_protests: "Crack Down on Protests"
ast_crack_down_on_protests_desc: "The heckling, the demonstrations, all of it needs to stop. Everyone needs to calm down! I don’t care how we do it. Shift the headlines, amp up the policing. Whatever we can do so that real issues can get the spotlight and get these hooligans under control. I won’t heed their self aggrandizing. In fact, I won’t pay any attention at all! Our policy will be praised as rejection of guilt-tripping and mob politics. I’m sure of it."
ast_abolish_the_atsic: "Abolish the ATSIC"
ast_abolish_the_atsic_desc: "So far the experiment that is separate representation has been a failure. A decade of funding has been poured into it with no practical benefits for the indigenous community at all. Worse has been the allegations of mismanagement, corruption, fraud, the list goes on. No more. We’ll scrap the agency and scrounge whatever we can from its financing."
ast_with_safer_communities: "With Safer Communities"
ast_with_safer_communities_desc: "Reports of child abuse and a breakdown in remote indigenous communities up north is a national disaster to put it lightly. Bi-partisan support for a moral intervention was easy to obtain. We’ll deploy the troops, restrict welfare, employ compulsory health checks and surveillance. Pornography and alcohol in the communities will be banned, and we can finally return the land rights back to the government. Some elements will require suspending the Racial Discrimination Act, meaning the backbenchers and community groups are going to complain, but when law and order have been restored the locals won’t be the only ones thanking us."

#migration
ast_we_are_many: "We are Many"
ast_we_are_many_desc: "We are, without a doubt, a diverse country. Even during the days of the ‘White Australian’ policy the nation was inundated by Europeans of no two similar descents. Now the country has opened its doors to many, and we are responsible for that intake. How we govern the matter will define the makeup for Australia decades to come. Whether rich or strong, we decide the policy and the lives of millions."
ast_widen_our_net: "Widen Our Nets"
ast_widen_our_net_desc: "The immigration office has come a long way since the ‘White Australian Policy,’ but lets face it, the number is still low, very low. At the rate our economy is booming, worker shortages will be a newly developing issue. To fix this we’re widening the intake of foreign workers, and to balance this out, stricter emphasis on skilled migrants will be enforced with reduced access to welfare for new migrants. This should simultaneously please both sides of the aisle, while appealing to large businesses."
ast_with_open_arms: "With Open Arms"
ast_with_open_arms_desc: "This nation has always been a multicultural one, and one that has necessitated arrival by sea. Not everyone has come through the right channels, yet they have claimed asylum from all corners of the world. Wishing to eventually be a part of the millions enjoying our bountiful country. The inefficiency of our current policies can be streamlined to allow more genuine asylum seekers shorter detention times. Families with children will be moved out of the detention centres and into community housing, and private investigations will be implemented for those detained for over two years."
ast_girt_by_border_patrol: "Girt by Border Patrol"
ast_girt_by_border_patrol_desc: "Australia might be an island, but that leaves it vulnerable to invasion by sea. Incidences in the water have put our existing border patrol in hotter waters than usual. Without a clear ability to safeguard our shores how can we expect our forces to keep this nation safe? With the Border Protection Bill there will be no doubt in our fleets ability to turn ships back, protecting officers from unjust legal action if they do."
ast_the_pacific_solution: "The Pacific Solution"
ast_the_pacific_solution_desc: "Whilst our legal immigration has slumped, illegal immigration has not. Thousands of migrants are landing on our shores every year undocumented, and it seems that number is only increasing. With the existing infrastructure becoming overwhelmed, off-shore detention sites will be constructed in Nauru and Manus Island, to house asylum seekers while we determine their status. Compensating both nations fairly. We’ll then reduce the mainland territory viable for valid claims of asylum, further disincentivising queue jumpers."
ast_for_bright_minds: "For Bright Minds"
ast_for_bright_minds_desc: "Foreign students are quickly becoming a not-so-insignificant source of income for our top universities. Currently only a few are able to come through our limited study visas, but if we tweak the requirements, just a little, far more students will be traveling here from overseas, and much more money will go into the education sector."
ast_strong_in_difference: "Strong in Difference"
ast_strong_in_difference_desc: "We've managed a population of different, culturally diverse peoples, that have amalgamated into a new Australian identity. We all look different and each our different strengths, yet altogether we’re building Australia. The workplaces are filled to the brim with bright minds and those who have been successful in their pursuit for this nation’s dream. The dream of belonging, and as we also have, getting along."
ast_tear_out_the_roots: "Stamp Out the Roots"
ast_tear_out_the_roots_desc: "It's well known many of our security troubles begin and end in Indonesia. Our strongest immediate neighbour, and one very much vulnerable to extremist elements. If an understanding could be reached between us, in particular a collaboration to root out insurgency cells and within their nation, both parties would benefit. Laying the groundwork for closer cooperation in the future."
ast_welcome_the_experts: "Welcome the Experts"
ast_welcome_the_experts_desc: "We may have some of the brightest minds already, but inviting some more from abroad wouldn’t hurt us. It may even smooth over some of the bumps we’re facing in R&D. If we use the already existing SkillSelect system we can extend visas to skilled migrants from all corners of the modern world."
ast_protected_on_all_sides: "Protected on All Sides"
ast_protected_on_all_sides_desc: "As the sun sets on our golden oceans, our people can relax knowing that on every side of their nation, patrolling the waters, our patrols are keeping them safe. When fears of another nation’s people hopping onto our beaches strikes up in the press, they’ll know it’s merely fearmongering as the government has their back. That their future is secured."

#international_1
ast_the_howard_doctrine: "The Howard Doctrine"
ast_the_howard_doctrine_desc: "After our intervention in East Timor in 1999, a few journalists began coining the term, meant to describe us as a provider of first resort for many nations in the Pacific. While that might be an accurate assessment, I believe that our doctrine is not limited to such a stance. \n \nBefore I became Prime Minister, this nation was defining its place in the world too narrowly. Our government has the capacity to rebalance Australia's foreign policy to better reflect the unique intersection of cultures and history that we inhabit. Time has only strengthened my belief that we do not face a choice between our history and our geography. We sit in a unique position of flexibility, where we can remain faithful to our traditional allies and allegiances while building and strengthening new partnerships in the region."
ast_deputy_peacekeepers: "Deputy Peacekeepers"
ast_deputy_peacekeepers_desc: "In the Andy Griffith Show, Barney Fife is deputy to the town sheriff, Andy Taylor. At times when the sheriff isn’t around it's up to Barney to keep order and run the show in his place. The United States’ global policing role has become unquestioned since the fall of the Berlin Wall, but new threats are appearing every day, and some of those uncomfortably close to Australia. Similarly to Barney, Australia is in a position where we are tasked with patrolling the Pacific while the US is elsewhere. It’s not an easy position, but we take it up in spades."
ast_war_on_the_terrible: "War on the Terrible"
ast_war_on_the_terrible_desc: "In our current age the classic definitions and our methods to counter terrorism are woefully outdated. Those who wish to do harm to Australians are adapting far quicker to the technologies of today. Introducing legislation to amend our legal definitions of terrorism, and changing the laws that punish individuals doing so are effective first steps. Enhancing ASIO’s detention powers and surveillance capabilities will be needed to keep us up to speed, and give our units the mobile reaction to put down the threats before they arise."
ast_new_wave_counter_terrorism: "New Wave Counter-Terrorism"
ast_new_wave_counter_terrorism_desc: "Even our new amendments are not enough. As we receive more information of imminent terrorist attacks on Aussie soil, the more obvious it is that our powers need to be multiplied. ASIO and the police force will have to be expanded. Anti-terrorism raids, preventative detention and emboldening local police with ‘stop and search’ is going to smoke out the threat. We’re aware this is going to be a controversial move, but our situation requires much more than half-measures."
ast_commit_to_foreign_intervention: "Commit to Foreign Intervention"
ast_commit_to_foreign_intervention_desc: "Conflict has grown in almost every continent in the world. The exception to that is Australia. The only way we’ve been able to keep things that way, and continue to do so is by making sure open conflict doesn’t spill into our waters. Being able to intervene in these threats before they get out of hand is essential to this. Targets in the middle east and southeast asia are hotbeds for terrorist cells, but we can choose where and how to intervene if it serves our nation's security interests."
ast_place_rudd_in_the_fire: "Place Rudd in the Fires"
ast_place_rudd_in_the_fire_desc: "It seems Kevin Rudd has become a growing nuisance in the opposition party as we attempt to pass legislation. What’s worse is he’s gaining traction in the public eye. Currently he’s the shadow minister for foreign affairs, but what if we assigned him to our own foreign committee. Put him working on diplomacy in the Pacific. Not only would it protect us from blowback, but it’ll keep his eyes away from the anti-terrorism legislation."
ast_our_capacity_for_peace: "Our Capacity For Peace"
ast_our_capacity_for_peace_desc: "Rudd’s efforts to get a dialogue going with the Chinese has actually borne fruit. They’re willing to negotiate a combined peacekeeping initiative in the Pacific. An opportunity like this doesn’t come often, and could allow us to demonstrate ourselves as equals to the Chinese, defining future cooperations. Less bending the knee, more sharing a common interest in safekeeping the Pacific."
ast_off_to_delhi: "Off to Delhi"
ast_off_to_delhi_desc: "Uranium remains our biggest untapped mineral reserve, and our companies are eager to connect with a new export partner before drilling commences. By all appearances India is the obvious client. An emerging superpower in south asia strong enough to assert their own will on the Arabian Sea. They could be a very useful ally as our sphere grows, or at the very least a reliable importer of our uranium."
ast_marks_gambit: "Mark's Gambit"
ast_marks_gambit_desc: "Ever since Singapore’s independence, the relationship we share has been nothing but cordial. It’s only natural that we take the next steps. Our trusty trade minister Mark Vaile has been working on the first serious bilateral trade deal we’ve offered them in two decades. Simultaneously he’s been making overtures to Thailand with a similar agreement for majority tariff free trade. Freeing the movement of goods in and out of Australia has been a core tenant for our reelection, and while the party will try to scoop up as much publicity for it as they can, the Australian people will be reaping the benefits."
ast_fossil_fuels_for_yuan: "Fossil Fuels for Yuan"
ast_fossil_fuels_for_yuan_desc: "Our diplomacy with China has been going off without a hitch. Their latent efforts to rapidly industrialise has given them a hunger for coal, which is fortunately something we’re plentiful of. Broaching a deal with them seems like a win win, and might make us a more appealing trade partner to other Asian nations."
ast_partner_with_the_japanese: "Partner with the Japanese"
ast_partner_with_the_japanese_desc: "Asian trade is quickly overtaking that of our connections in Europe. Rightly so as our interests have shifted much more locally. In business the Japanese are some of the most shrewd adversaries you can meet. Equally so diplomatically. They’re open to receiving our agricultural exports in exchange for concessions on our part. Lowering tariffs on their electronics and cars was an obvious request, but we suspect they’ll ask for more."
ast_to_promote_our_spirit: "To Promote Our Spirit"
ast_to_promote_our_spirit_desc: "Our efforts overseas have paid off well. More are seeing Australia in a new light, and seeing us as a major partner in the pacific. The people should also see our achievements, and celebrate the Australian spirit for what it is. We can fund a number of television commercials and online posts to promote our nation, doubling as tourism marketing. It also won’t hurt to place our party’s logo in the bottom corner. It’s the least we can get for our pursuits."
ast_the_coalition_convention: "The Coalition Convention"
ast_the_coalition_convention_desc: "The convention is often where careers come to die, as their speeches and pleas for relevance go unheaded, and the other person is chosen the next leader for the coalition. Sometimes, however, perseverance pays off. Now the coalition already has a leader strong enough to take the charge, and this time it's simply a matter of making a good speech."

#econ_2
ast_wholesale_economics: "Wholesale Economics"
ast_wholesale_economics_desc: "The term wholesale is usually accredited to retailers or industry outlets, but some have used the term to describe the act of privatising government assets. We haven’t been ruthless with our scrapping of government inefficiencies. Hardly. Which is why we ought to crank up the effort a bit. There are numerous agencies for us to trim, and quite a lot of revenue if we can find the right bidders. On the flip side there are a few avenues for investment in our labour sectors that, if we choose wisely, won’t put a dent in our fine income."
ast_finalize_the_telstra_sale: "Finalise the Telstra Sale"
ast_finalize_the_telstra_sale_desc: "The sale of Telstra has been a multi-year ordeal for the government accountants charged with untangling all of corroded elements that had come to be a burden for us to manage. ASX has offered us a more than fair deal for the remaining assets, and any economic rationalist would have this finalized before they change their mind, which is what we intend to do."
ast_allow_foreign_interests: "Allow Foreign Interests"
ast_allow_foreign_interests_desc: "As Faust did, sometimes you need to make a deal with the devil. The optimists in parliament might have you believe that Australia can survive on its own. That somehow this island nation can become self-sufficient in the face of globalisation. They are mistaken. Our industries can only last if we allow foreign capital to power our dollar-hungry-machine of an economy, and the media is no different. If it is to survive it needs investment."
ast_crush_the_unions: "Crush the Unions"
ast_crush_the_unions_desc: "The union’s presence in our economy and even in our politics has grown too wide and too brazenly as of recently years. No organisation like theirs should be meddling in any of our affairs, let alone those of our workers. The Workchoice Act aims to amend that disregard and strip the unions of their presence in the factories. It won’t completely kick them out, but it’ll give business owners a fighting chance."
ast_carve_up_medicare: "Carve Up Medicare"
ast_carve_up_medicare_desc: "Something we never got around to in our first term was reexamining medicare. The program admittedly provides many Australians with reliable, state of the art medical services free of charge, but do seem to be taking advantage of that offer. Inefficiencies plaguing the program have also ballooned its cost under Labor mismanagement. Like a well sharpened knife, we can cut off the fat that’s hung on for just too long."
ast_broadband_blueprint: "Broadband Blueprint"
ast_broadband_blueprint_desc: "We have the technology. We can rebuild our network infrastructure to allow all Australians state of the art internet services for companies and homes alike. If we apply what we know and work to implement it into the current infrastructure, we could develop a plan to implement it nationwide in a very short period of time."
ast_curb_outside_interference: "Curb Outside Interference"
ast_curb_outside_interference_desc: "Opening the Australian market and economy to the rest of the world has been a boon so far, but there’s a certain line we draw when managing the nation. Approving foreign investiture is the bread and butter of business in most industries, except for the media. The effect Kerry Packer has had on our news media cannot be exaggerated, and we can starkly imagine what kind of worse foreign interest we might be inviting in if the gates opened. For now we keep those doors shut."
ast_bat_for_the_battlers: "Bat for the Battlers"
ast_bat_for_the_battlers_desc: "Australia should never be a nation defined by class or envy, but united by mateship and achievement. Our battlers, the middle class Australians, have carried us to the finish line more times than not. It’s only fair we give a bit back to them in the workplace. Without letting them get egregious with the demands, we’ll lend an ear to unions to implement a few piecemeal policies. The ones that actually count."
ast_back_australias_ability: "Back Australia's Ability"
ast_back_australias_ability_desc: "Our ‘cream of the cream’ economic policy wise has been the Back Australia’s Ability program. An expansive renewal program to boost our major construction works over a period of four years, which should drastically reduce unemployment and return a lot of tax funding we’ve soaked up back into circulation."
feel_the_heef_ast: "Feel the heef_ast"
feel_the_heef_ast_desc: "The Higher Education Endowment Fund is one of our recent policy bills aimed at funneling investment into higher education institutions and our R&D sites. Initially we’re going to be the only ones investing in the fund, but eventually it’s meant to trickle back into the government, somehow. It all sounds like a bit of bull, but if both parties are backing it there might be something in it worthwhile."
ast_if_we_build_it: "If We Build It"
ast_if_we_build_it_desc: "Our reelection promise to build 21 new hospitals has come up due, and the costs have unfortunately risen since our previous estimates. Our fiscal experts have recommended we outsource the construction to the private sector, which will still cost us plenty. On the upside we might be saving on public medical costs with all the new facilities."
ast_australian_made: "Australian Made"
ast_australian_made_desc: "The Australian Made logo was one of our most successful marketing strategies the government ever made. The icon was easy to recognise, and more people were buying local because of it. Now public spending has slumped, and it’s difficult to choose local over cheap imports from Vietnam or China. If we ramp up the marketing campaign to target not just locally, but abroad, to say that Australian Made is a guarantee on quality, we may just find a new avenue for them."
ast_preserve_the_old_forests: "Preserve the Old Forests"
ast_preserve_the_old_forests_desc: "One of our pride and joys has been the old-growth forests in Tasmania. It features some of the world’s tallest flowering trees, even getting over 90 metres! It’s a treasure to behold, and as important to this nation as the Great Barrier Reef in much regard. Extending the current protections to an additional 170,000 hectares should do well to prevent their loss, without stifling our lumber industry."
ast_ets: "Trading Emissions"
ast_ets_desc: "Another piece of climate legislation making news in Parliment is the ‘Emissions Trading Scheme.' Somehow Labor is still concocting these things, and for some reason there’s a few in the party listening. Right now they've offered us a softball to preempt the scheme with a number of grants towards nuclear energy development. Nuclear energy isn't something we're supporting at present, but we can't kill it in the cradle, and if we can get anything from them to soften up the climate loons to our policy, we'll take it."
ast_the_new_liberals: "The New Liberals"
ast_the_new_liberals_desc: "Like it or not, the party has changed. No more are we the small “i” Liberals of the 90s, but a professional force for traditional values. We’ve successfully blended economic liberalism with fiscal conservatism. The reality of the geopolitical issues are being acknowledged and dealt with, and Australians are being left with more in their pocket and less going to taxes. Frankly the nation is better off for it, and we’re enjoying that with the mainstream voters support. The direction we move the party now could make or break our momentum, but it’ll also have resounding effects for the generations relying on our guiding hand."
ast_keep_them_in_line: "Keep Them In Line"
ast_keep_them_in_line_desc: "Our party has been plagued by conspiring and internal coups for far too long. How can the public have trust in our coalition if we don’t even trust ourselves? We’ll need to ‘restructure’ the party code for leadership challenges and restrict the practice to the most dire circumstances. Only a few nationals will be needed to be encouraged to support the change."
ast_secure_the_coalition: "Secure the Coalition"
ast_secure_the_coalition_desc: "While we don’t always see eye-to-eye, our National friends have walked the line with us for almost a century. We’ve just like those peas in the pod. It’s unlikely now, but a coalition split would damn our parties to never win another federal election again. Something like that shouldn’t be left to fate. Rewriting the clauses for a split to make it virtually impossible for either side will keep them in our graces, good or not. Then we’ll really be united, in spirit and written in stone."
ast_entice_crossbenchers: "Entice Crossbenchers"
ast_entice_crossbenchers_desc: "Our political system has hinged on the work of crossbenchers for decades. The often spineless have helped us pass a few bills over our time, shifting back and forth between supporting us and the opposition, or sitting out entirely. Some just need a treat or two to bring them back in line. A few handshakes here, a bit of investment there, and we’ll make enough of them loyal."
ast_broaden_our_beliefs: "Broaden Our Beliefs"
ast_broaden_our_beliefs_desc: "It’s almost stereotyping to say that our party has been stuck in the mud regarding our beliefs. After all, we’re traditionalists, it’s a reasonable stance. The downside to this is we may be missing out on valuable policy that not all of the party supports. It might be time we sat down and talked things out with the smaller parties. We might learn a thing or two."
ast_axe_the_governor_general: "Axe the Governor General"
ast_axe_the_governor_general_desc: "The republic referendum might’ve failed in 99, but that doesn’t mean we need a representative from a country half-way across the world meddling in our decision making. They’ve already sacked one of our leaders before, they can do it again. It’s fair time we sacked them. By going over their heads and straight to the Queen we make the request formally, with a couple of \”reports\” of malpractice to support us, and get rid of them ourselves."
ast_our_own_kings: "Our Own Kings"
ast_our_own_kings_desc: "Now that the monarchy are moving to find a replacement, we can begin using the current processes to grind down the transition as much as possible. They’ll be swimming in a sea of legal disputes and official inquiries so long it might be years before they can swear in another, and we’ll have free reign over our policies, without any eyes from the crown."
ast_prepare_the_successor: "Prepare the Successor"
ast_prepare_the_successor_desc: "Sometimes it's best to end things while they're good. I made a promise during the previous term that I’d step down before the next election. That opportunity came and went, but it isn’t too late to hang up the hat and prepare the next leader to take us forward. I remember fighting to get here, and now I'm considering letting it go."
ast_peace_with_honour: "Peace with Honour"
ast_peace_with_honour_desc: "And the future of the Liberal Party was decided..."
ast_the_sydney_declaration: "The Sydney Declaration"
ast_the_sydney_declaration_desc: "The declaration was originally drafted and should be presented as Australia’s commitment to meeting the Climate Change demands of the world at APEC. However, it serves a greater purpose than virtue signally to our eastern friends that we’re progressive in our causes. The very declaration itself demonstrates the weight we wield in diplomatic action. It announces that Australia is ready to engage with the world, and that we have the effect of causing real change when we do. We might be barely scraping into the top 10, but we’re here now, and we’re only moving up."
ast_the_quad_desc: "Discussions with Japan and India over disaster relief have been fruitful to the point where they’re hinting at a more permanent channel for diplomatic discussions. The US vice president has even been favorable to the idea of forming the pact to sort of plan and monitor China’s recent actions in the Pacific. Finally the name ‘Quadrilateral Security Dialogue’ was settled on, but for now we’re nicknaming it the ‘Quad.’"
ast_negotiate_with_our_northern_neighbours: "Negotiate with Our Northern Neighbours"
ast_negotiate_with_our_northern_neighbours_desc: "Papua has been a largely cooperative neighbour in our security and migration pursuits. Being so close to us, and bordering Indonesia, makes them one of our key interests, and it wouldn’t hurt to have them on our side. After recent talks they have expressed interest in a greater defense agreement. We’ve drafted up an 800 million aid package to sweeten things up, and the Prime Minister has even agreed to meet us in Canberra for discussions."
ast_anzus_collaboration: "ANZUS Collaboration"
ast_anzus_collaboration_desc: "The ANZUS Treaty has, without a doubt, had its rocky moments. It wasn’t all that long ago when New Zealand technically got the boot after refusing US nuclear subs from entering their ports. However things have turned out, the treaty is somewhat like a brotherly bond between us. Despite how far American policy has drifted from Europe and into the middle east; if they’re there, we’re there. Our focus might shift away from the locals, but it’s all a global effort anyway."
ast_an_american_treaty: "An American Treaty"
ast_an_american_treaty_desc: "As perhaps the biggest economy in the world, our imperative, outside of the obvious security advantage, has been maintaining economic ties with the United States. They’re not an easy nation to upset, especially since they’ve invested so much into our country already. Though occasionally rewarding their support has never hurt, and we certainly reward them with a priority trade agreement."
ast_howard_of_arabia: "Howard of Arabia"
ast_howard_of_arabia_desc: "Australia is still a majority Christian nation. Our morality is at its origins in the middle east. Israel has been one of our strongest partners out there for decades, and they’ve demonstrated their determination for principled democracy again and again. We can’t leave them out to dry when they need us. A stronger mateship with them is our religious imperative."
ast_keep_security_regional: "Keep Security Regional"
ast_keep_security_regional_desc: "As much as we’ve dabbled with overseas action in the middle east, our priorities have always been to our immediate neighbours. The Pacific island nations look to us for their security now, and as they should. Australia has a moral obligation to keep them safe and free from radical elements as we grow as a regional power. Our pursuits with them should represent this."
ast_preventative_measures: "Preventative Measures"
ast_preventative_measures_desc: "You don’t put your boots on after the snake bites you. When you’re out in the bush the first thing you make sure you have is your boots, and the second is a big stick. That notion, as crude as it is, should be used when dealing with our defense abroad. We’re not going out empty handed, and we’re not leaving our neighbours at risk without a bit of protection."
ast_dissuade_the_middle_kingdom: "Dissuade the Middle Kingdom"
ast_dissuade_the_middle_kingdom_desc: "Recent efforts by the Chinese could indicate they’re willing to have further discussions with us regarding security, in particular our peacemaking efforts. So far a fundamental has stayed the same for them diplomatically, that being their relationship with Taiwan. If we wanted to approach the matter pragmatically we could agree to a non-confrontation strategy which would include us foregoing any recognition of Taiwan, at least for the time being. The Taiwanese wouldn’t mind, in fact it seems to be a common tactic other nations have used to get close to the Chinese market, but it’s not a guaranteed plan."
ast_the_indonesian_ultimatum: "Indonesian Ultimatum"
ast_the_indonesian_ultimatum_desc: "Conflict with Indonesian has become a common occurrence as of late. No matter our stance, or the extent of our collaboration, they cannot seem to grapple with the radical elements within the nation. We can issue them an ultimatum allowing us to send our own peacekeeping operation to Aceh and effectively occupy the region until it can manage itself as an independent nation. We’ve done it before, successfully, we can do it again. If they refuse we can use every sanction under the sun until it gets them back at the table."
ast_a_visit_from_malaysia: "A Visit from Malaysia"
ast_a_visit_from_malaysia_desc: "Few countries have been as forthright and genuine with communications as Malaysia has. They’ve visited us numerous times from their leaders to their lower ministers, and trade talks have always gone off without a hitch. Perhaps it’s our shared Commonwealth heritage, but a deep respect has grown between our nations. This time the discussions have fallen on our agricultural exports, which admittedly have been restrictive for safety reasons. They’ll likely request we soften the laws."
ast_peacekeeping_in_somalia: "Peacekeeping in Somalia"
ast_peacekeeping_in_somalia_desc: "Although initially promising, the transitional government in Somalia has been in a tenuous position following the warlord conflict, and the country has effectively split apart. The ongoing humanitarian crisis has been enough for us to take notice, and now the government has pleaded for outside intervention. It could be an opportunity to exercise our peacekeepers without becoming directly involved in the conflict."
ast_the_coal_family: "The Coal Family"
ast_the_coal_family_desc: "Just like the American dream of the 50s, many idyllic Australians are a living traditional life of self determination. Frankly they probably make up a good chunk of our voterbase, and why not? It’s just the sort of way we encourage Aussie families to live. Independent and happy. We can return the favor by chipping away at the policies that prevent homes from being built, as well as cutting a few land taxes to ease the burden. Our families shouldn’t be punished for owning their own bit of our beautiful land."
the_abbott_government: "The Abbott Government"
the_abbott_government_desc: "From today I declare that Australia is under new management and that Australia is once more open for business. Open and being led by a government that maximises the potential of all. Not just those that voted for us. \n\nA government, in its simplest terms, for all and for the many. Those that the great Menzies described as ‘lifters, not leaners.’ The forgotten families will be attended to. The burdensome taxes will be gone, the boats will be stopped, and the budget will be back on track for a surplus the likes we haven’t seen or heard before. \n\nWithout wasting any more time, let's get to it."
ast_expand_the_executive: "Expand the Executive"
ast_expand_the_executive_desc: "A paradox exists between our mission to decrease the size of government, while increasing our capability to get the job done. When the captain is steering the ship, his calls need to be headed without wasting time consulting the entirety of Parliament."
ast_honour_the_party: "Honour the Party"
ast_honour_the_party_desc: "Our cabinet needs to reflect the legacy of the party if we’re going to be accepted moving forward. John Howard’s work to redefine the Liberal Party was monumental in adapting to this new era of modern politics, and hiring staff from his government brings in a multitude of experience."
#economy
ast_building_stronger: "Building Stronger"
ast_building_stronger_desc: "We understand in the marrow of our bones that you can't have a society without an economy to sustain it and you can't have an economy without businesses that can make a profit. Likewise the confidence in the strength of our finances has reached a low point, despite our habitual optimism. Our task now is to build it back, and build it strong enough to make any Aussie proud."
ast_the_advisory_council: "The Advisory Council"
ast_the_advisory_council_desc: "The Liberals shouldn’t be seen as the party against reconciliation. After all, it was Harold Holdt who ended the White Australia Policy. A Council will be formed to keep us in the know on Indigenous affairs, and keep the narrative focused on practical changes."
ast_cut_the_programs: "Axe the Programs"
ast_cut_the_programs_desc: "We can’t endlessly subsidize the remote communities that aren’t contributing to the government's reconciliation efforts. Indigenous communities that are receiving funding, and don’t tow the line will have their budgets cut. Pure and simple."
ast_its_the_constitution: "It's the Constitution"
ast_its_the_constitution_desc: "What we now need to do is end that echoing silence in our constitution, the omission of Indigenous people from the constitution. Such a sentiment requires decision making outside of Parliament, with a referendum to recognise Aboriginal and Torres Strait Islanders as our first nations people."
ast_compete_on_the_farms: "Compete On the Farms"
ast_compete_on_the_farms_desc: "Ma and Pa farming has been the backbone of this country's farming sector since its federation. Farms from Tasmania to Western Australia run by generations of Aussies are becoming squeezed out by bigger corporations. We can't continue to be competitive without caring for our farmers through accessible loans and water supply improvements. Our policy needs to prioritise keeping them independent."
ast_develop_the_northern_territory: "Develop the Bread Bowl"
ast_develop_the_northern_territory_desc: "A plan has been put forward for a number of development projects for the Northern Territory aimed at building up the state into an industry and agricultural powerhouse. By signing off on it we’ll be cultivating a state typically ignored by previous governments, and potentially create the bread bowl for Australia and the Pacific for decades to come."
ast_getting_in_there: "Getting In There"
ast_getting_in_there_desc: "Unfortunately the roads getting into and out of NT have fallen into a sad state. On top of that the Ghan rail line will need to be upgraded to support the materials going in."
ast_funnel_in_workers: "Funnel In Workers"
ast_funnel_in_workers_desc: "Manpower is going to be needed to get our operations underway. Nothing that few preferential visas and relocation grants can’t fix."
ast_project_manton: "Project Manton"
ast_project_manton_desc: "The Manton Dam used to be the premier supply of water and electricity in the region for Darwin built their own dam. The costs for renovating and reactivating the dam to supply the nearby communities is surprisingly within budget, and would tangible demonstrate our commitment to building up NT."
ast_compassionate_government: "A Fair Go"
ast_compassionate_government_desc: "In this country if you have a go, you’ll get a go. That might as well be the mantra of the party under our leadership. Our people should be rewarded for their effort, and for those who aren’t in the best place to get started we’ll support them with a light helping hand. That’s not entitlement, that’s fairness."
ast_keep_the_fire_burning: "Keep the Fire Burning"
ast_keep_the_fire_burning_desc: "The hole that welfare is burning into the government's wallet will sink us if we don’t get a handle on it. At the same time the programs are starting to have serious positive results on our population. If we stop short now it might undo the years of work it’s led to. Instead we’ll need to shuffle around some funding to cover the current costs, and hope that Keynes was right in the long term."
ast_national_curriculum_review: "Curriculum Review"
ast_national_curriculum_review_desc: "Aside from the usual political bias creeping into our curriculums, it seems public funding has become lopsided in excluding our rural schools. Every school in Australia deserves a fair shot, and every student an education that boasts the success of western civilisation, not just the problems. We should all be proud of the nation we grew up in, and the education system in it."
ast_another_baby_boom: "Another Baby Boom"
ast_another_baby_boom_desc: "Love is a beautiful thing. Our government knows that more than most. During the election we promised an overhaul of paid parental leave, providing new mothers with 26 weeks of leave on par with their wage. A lot of pushback has been brought up in the party, but putting our nation’s mothers first is the bigger priority."
ast_responsible_governance: "Responsible Government"
ast_responsible_governance_desc: "The reckless spending in our government is practically beckoning on a budget crisis. The biggest responsibility of the ruling party is making the tough decisions. We can’t keep paying off the home loan with the credit card."
ast_the_welfare_bloat: "No Such Society"
ast_the_welfare_bloat_desc: "Public welfare simply too easy to access on the existing system. Anyone with bad luck and a bad back can get the full benefits of Centrelink and Medicare. The level of entry needs to be tightened, and a few needless programs are going to be phased out if we’re getting anywhere with cutting down on the budget bloat."
ast_cashless_welfare: "Cashless Payments"
ast_cashless_welfare_desc: "With the trials in the Northern Territory communities coming to a close, we’re confident that a small scale rollout is feasible. Replacing direct deposits with government made bank cards, and keeping expenses limited essentials is going to keep the vulnerable of our community out of the casinos or passed out on the streets."
ast_up_the_gst: "One More Tax"
ast_up_the_gst_desc: "The greatest reform to our taxation system happened only a few years ago, but has already had immense benefits for the country. While controversial at the time, our businesses now enjoy a simpler system and the added earnings have funded our more costly programs. Increasing it only a touch is going to break through the budgetary pains we’re currently facing."
ast_national_audit_commission: "National Audit Commission"
ast_national_audit_commission_desc: "Wasteful spending in the government has become the gunk under your boots in terms of how difficult it is to get rid of. Creating a once-in-a-generation commission dedicated to clearing it throughout the entire administration is the best course of action. Everything will be on the chopping block."
ast_investigate_union_corruption: "War with the Unions"
ast_investigate_union_corruption_desc: "Let the tabloids know we’re declaring war on wrongdoing. Declaring war on corruption, and declaring that there are certain standards in our society. Whether you're a company official or a union official, you've got to obey the law."
ast_the_energy_crisis: "The Energy Crisis"
ast_the_energy_crisis_desc: "The obsession with climate protection has shot us in the foot right at the door of an energy armageddon. Even when we can control it, the demands of our people aren’t being met, and the rising cost has put more in financial jeopardy than any other crisis this nation has faced. Our government needs to put our foot on the issue once and for all."
ast_duttons_plan_focus: "Dutton's Plan"
ast_duttons_plan_focus_desc: "Our health minister, Peter Dutton, has dipped his toes into our energy debate with a solution that leans divisive to say the least. Pulling back Australia’s nuclear restrictions to allow for power plants to be built and fixing the energy shortage once and for all. We’ve enjoyed a good few decades shying away from the prospect of it, and for good reason, but it could be the drastic solution we’re looking for."
ast_look_below: "Look Below"
ast_look_below_desc: "The answer to all our problems has always been beneath our feet. Greenies fear it, Labor ignores it, but the Coalition respects it. No renewable source is going to replace ourGod given source of power, cultivated for us since the death of the dinosaurs."
ast_build_it: "Build It"
ast_build_it_desc: "One of the benefits of coal power is the beauty of it. We have some of the finest natural gas plants this side of the world, and much nicer than those loud and ugly turbines. By activating AEMO emergency measures to procure more generators and construct our own plants, we can build some more in a very short period."
ast_deny_it: "Deny It"
ast_deny_it_desc: "A spiritual malaise has been sapping the morale and the ambition of what was once a country that set no limits on what it could achieve. Concessions to climate change have mucked up our energy generation, whilst emboldening our neighbours to pick up the industry we’ve lost. We can’t turn back the clock, but we can remove the chains."
ast_friend_of_the_mines: "Friend Of the Mines"
ast_friend_of_the_mines_desc: "After a chat with our friend at Newscorp, it’s clear that the squeeze on our mining corporations could be a little lighter. Starting with shifting our governments approach to mining rights."
ast_light_on_the_hill: "A Light On the Hill"
ast_light_on_the_hill_desc: "Australia has been a beacon of light as a democracy in the Pacific for decades, and now it stands as a literal light. Australians will be able to rest easy with access to affordable, plentiful electricity, heating and cooling homes across the country. A testament to our government's accomplishments, and the progress we’ve made as a nation."
ast_acquire_enrichement: "Little Green Rocks"
ast_acquire_enrichement_desc: "It's a shameful thing that we mine so much of the stuff, and yet we have no enrichment facilities to actually utilise it. We can quickly import and assemble one from our friends in the states, while bypassing a few recommendations to get it up and running in a timely manner."
ast_convert_the_ansto_reactor: "Convert the ANSTO Reactor"
ast_convert_the_ansto_reactor_desc: "Evidently we already have a reactor in Sydney. Sure it might not be the exact model we need to generate power, but we can crack the noggins of some of our science heads to get the thing ready for output. It’s not exactly rocket science after all."
ast_tweak_the_restrictions: "Held Back No More"
ast_tweak_the_restrictions_desc: "A whole lot is holding the country back from emissions-free power. In particular the green-centric voices setting up various “nuclear free zones” all over the joint. As a matter of national emergency, the zones have got to GO."
#foreign
ast_first_stop_jakarta: "First Stop Jakarta"
ast_first_stop_jakarta_desc: "We can start off our term by sending a strong message that Australia’s foreign policy is staying regional. We can’t afford to be stepping around in Europe when the nations here need our help more than ever. Less Geneva, more Jakarta."
ast_sail_steady: "Sail Steady"
ast_sail_steady_desc: "Julie Bishop, our foreign minister, has emphasised the approach of “economic diplomacy” for our term, focusing on continued aid programs and free trade endeavors. Frankly it's not too dissimilar to the governments before us, but when millions of lives are in your hands it’s best not to rock the boat."
ast_the_anglosphere: "The Anglosphere"
ast_the_anglosphere_desc: "Australia has an indigenous heritage, a British foundation, and a multicultural character. As such our connection with the English is as close as brothers. We speak the same language, we love our rugby, and we fight for the same democratic ideals. Our fellowship is as sacred as they come, and so it ought to stay that way."
ast_o_canada: "O Canada!"
ast_o_canada_desc: "Our Commonwealth brethren. So far away and yet our ties go as deep as that of two old friends. It wouldn’t hurt to touch base and discuss the investment opportunity our diplomats have been cooking up."
ast_swell_the_support: "Swell the Support"
ast_swell_the_support_desc: "It’s no secret that our defense recruitment has slumped since the 90s. Widening the eligibility requirements, recruitment campaigns and opening up defense internships is an appropriate first to step to filling our mandatory roles."
ast_of_knights_and_dames: "Of Knights and Dames"
ast_of_knights_and_dames_desc: "The ‘Knights and Dames of the Order of Australia’ used to be the highest you could bestow to recognise extraordinary service to the country. As typical with most Labor governments, the title was thrown out under their rule. While we’re back we ought to restore a piece of our heritage that shouldn’t have been forgotten."
ast_american_integration: "American Integration"
ast_american_integration_desc: "Our allies across the pacific have floated the idea of a joint training exercise for some time. The benefits from being able to utilize our new equipment in a practical setting alone would be invaluable to our forces, and might keep us closer in the know with the US."
ast_square_kilometre_array: "Square Kilometre Array"
ast_square_kilometre_array_desc: "In a bid between us and New Zealand to be a part of the project, as expected, we won out. Between us, South Africa and the United Kingdom, we get to be part of the most ambitious astronomy projects in our lifetime. Our job is to construct over 130,000 tree-like antennas over a 21 kilometre area. In theory allowing us to survey the sky over 10,000 times quicker than we can now. It’s all very high tech, and it's an exciting opportunity for our scientists in the field."
ast_joint_defense_tech: "Joint Defense Tech"
ast_joint_defense_tech_desc: "The Five Eyes alliance has become one of our strongest assets in the war against terror, and in general intelligence gathering going on 60 years now. Establishing a research division would be easy enough, and it’ll help bridge any technology gaps that exist between us."
ast_the_submarine_corporation: "The Submarine Corporation"
ast_the_submarine_corporation_desc: "In our efforts to support the fleet with new submarines, the ASC comes to our aid. The premier shipbuilding provider for us since the 80s, and recently nationalised, the company is at our disposal."
ast_new_columbo_plan: "New Colombo Plan"
ast_new_columbo_plan_desc: "After World War 2, the Colombo Plan was implemented to rebuild a devastated Asia, aiding them by sending our technical experts and allowing theirs to study in our country. We can implement the same principles again to assist a new, developing Asia by allowing their students to study at our universities with expedited visas."
ast_growing_demands: "Meet the Challenge"
ast_growing_demands_desc: "No government can be economically responsible at the expense of national security. The ADF needs to always be in a position where it can answer the call of any conflicts. Anything less puts us in a bad spot."
ast_visiting_the_rainbow_nation: "The Rainbow Nation"
ast_visiting_the_rainbow_nation_desc: "We’ve had a colourful history with South Africa, going back so far as supporting their troops during the Second Boer War. Almost 200,000 of them live in Australia, and the number continues to grow as refugee applications have recently flooded in. As tensions continue to heat up, pressure has mounted for us to take a stance on the issue."
ast_indonesian_intervention: "Secure the Archipelago"
ast_indonesian_intervention_desc: "The situation in Indonesia has been allowed to deteriorate for far too long. While our efforts in 1999 were, at large, a success, further involvement will be needed in the country to quell the threat of Islamic fundamentalism."
ast_an_oceanic_alliance: "An Oceanic Alliance"
ast_an_oceanic_alliance_desc: "The matters of those in the Pacific are felt and handled by those of us here. We’ve had to rely on each other on more occasions than not, and it’s cultivated a profound unity between us."
ast_aukus_abbott: "AUKUS"
ast_aukus_abbott_desc: "Our shared commitment to international rules-based order with the United Kingdom and the United States of America is as thick as they come. We’ve gone through the trenches in almost every major conflict in the last century. Thus, deepening that cooperation is the best path to a safer world."
ast_the_greatest_statesman: "The Greatest Statesman"
ast_the_greatest_statesman_desc: "Australia's position has been solidified in the Pacific. A beautiful nation no longer an observer of Asia’s growth, but an active participant in its rise.  Historians are going to look back and see that this was the point that we sent the country down the right path."
ast_the_asian_century: "The Asian Century"
ast_the_asian_century_desc: "Despite what the critics might say, we’re not barreling into Asia without a plan. It doesn’t take much research to see that the countries of North Asia have achieved an economic transformation unparalleled in human history in only a few decades. We need to signal to those nations that Australia is open for business, and ready for our piece of that transformation."
ast_our_greatest_partner: "Our Closest Partner"
ast_our_greatest_partner_desc: "China did a miraculous thing when they lifted hundreds of millions out of poverty and into the middle class. Likewise our partnership with them continues to bloom into something far greater than any other Pacific nations. Despite those in government urging Australia to choose between our economic and our security interests, the fact remains that you don’t make new friends by losing old ones; and you don’t make some friendships stronger by weakening others."
ast_indian_investments: "Indian Investment"
ast_indian_investments_desc: "A few Indian corporations have indicated their interest in expanding their manufacturing in the country, and setting up shop in Sydney. The current restrictions on foreign companies have slowed down the process, but a direct approval from the [GetASTLeaderTitle] would be all they’d need to quickly get started, and start bringing in the jobs."
ast_sanpou_yoshi: "Sanpo Yoshi"
ast_sanpou_yoshi_desc: "Sanpo Yoshi is an old Japanese term dictating that every transaction must benefit the seller, the buyer and society at large. A “triple-win” if you will. Our current agreements with the Japanese in regards to trade are anything but a win. A serious trade balance exists between us that, until rectified, is driving a wedge between our nations."
ast_seoul_refineries: "Seoul Refineries"
ast_seoul_refineries_desc: "Ever since the Korean War we’ve kept very close ties with the South Korean government, militarily and economically. With the success of their new industry base in Seoul, setting up a deal with them to refine our own oil would sure save us the hassle of doing it ourselves, and would get things up and running much sooner."
ast_australian_exceptionalism: "Australian Exceptionalism"
ast_australian_exceptionalism_desc: "A unique set of virtues exist in this nation. Rather than a divine mandate or unearned inherent quality, ours is based on the generations before who have made the hard choices and sacrifices to bring us into the new dawn. That tradition must continue, and Australia will be preserved at all costs."
ast_stop_the_boats: "Stop the Boats"
ast_stop_the_boats_desc: "The amount of illegal entries and drownings at sea spurred on by people smugglers is the biggest crisis the nation has faced in years. Our border specialist, Scott Morrison, has devised a military-style operation to keep our shores safe and turn back the tide, with amplified patrols and eliminating permanent protection visas to disincentivize queue jumpers taking the risk."
ast_raise_the_threat_level: "Raise the Threat Level"
ast_raise_the_threat_level_desc: "The threat of terrorism has sadly become a fact of life, and regrettably there are some Australian citizens and residents who would do us harm. Employing more security at airports, bases, government buildings and large public events is going to be a necessity."
ast_tighten_the_flow: "Tighten the Flow"
ast_tighten_the_flow_desc: "The idea of multicultural Australia might not have failed, but at our current levels the influx is simply too high to be a sustainable number. Considering the needs of our citizens, hardening up on that flow is the only next step."
ast_prevention_measures: "Prevention Measures"
ast_prevention_measures_desc: "A deft hand needs to be at the wheel when it comes to intervention. The right, decisive blow can stop a threat in its infancy. At the very least having the option to act when he can keep it available when we most need it."
ast_wielding_the_stick: "Wielding the Stick"
ast_wielding_the_stick_desc: "Working alongside one of largest and most trusted weapons producers we’ve organised the construction of two new manufacturing plants, aimed at supplying us with the weapons of today, for the battles tomorrow. It’s a nifty motto, I know."
ast_deployment_mandate: "Deployment Mandate"
ast_deployment_mandate_desc: "Our rapid mobilization for combat readiness has been paced with a few targets to ensure we’re on the right track. Succeeding them will provide the confidence we need to justify the sudden spending bump, and demonstrate what we’re really capable of."
ast_employ_reserves: "Employ Reserves"
ast_employ_reserves_desc: "The primary duty for our nation’s reserves includes assisting during natural disasters and domestic emergencies. Considering our defense is a domestic emergency, we’ll be employing them to any areas unfulfilled by our full time personnel, freeing up forces for deployment."
ast_let_them_serve: "Let Them Serve"
ast_let_them_serve_desc: "Current recruitment policy is far too restrictive for our expansion plans. Opening the program up to defense internships and offering debt relief for those applying will get our numbers swelling to the required levels."
ast_incorporate_them: "Incorporate Them"
ast_incorporate_them_desc: "We already have a substantial program aimed at putting on welfare participants to work on public works. Now we can redirect them to our military industries, taking some of the weight off our ADF forces."
ast_a_shining_fleet: "A Shining Fleet"
ast_a_shining_fleet_desc: "Since the end of the cold war our naval infrastructure has been allowed to decay to the point of becoming a vulnerability in our defense. Our capacity to build ships has virtually dissipated. Beginning with reviving our state-owned dockyards, the effort will be run by the newly organized Australian Naval Infrastructure, and soon our nation will return to the waves once again."
ast_assistance_from_langley: "Assistance From Langley"
ast_assistance_from_langley_desc: "Uncle Sam has thrown in for us before, if we make the request they’ll surely be willing to lend us a helping hand in the intelligence department. As they say, knowing is half the battle."
ast_our_fight: "Our Fight"
ast_our_fight_desc: "Our journey ahead is one we must make on our own. Not strictly on our own, of course, but we need to show that Australia has the capabilities to arm itself and fight its own battles. We are a nation of doers after all."
ast_asian_partnership: "Asian Partnership"
ast_asian_partnership_desc: "You’re only half what you are without your friends. The countries of Asia have been more than friends for us over the years, and Japan in particular has been with us hand in hand during our armament. So far we’ve been cooking up a deal with them to purchase a number of submarines to pad our fleet numbers, and it’s paramount that we see it through."
ast_accelerate_the_timeline: "Accelerate the Timeline"
ast_accelerate_the_timeline_desc: "As our window of preparation comes to a close, some last minute production is going to need to be fast-tracked. We need to cook our uh eggs a little faster."
ast_in_our_backyard: "In Our Backyard"
ast_in_our_backyard_desc: "The royal navy has been sailing the Indo-Pacific for about a century, since its formation in 1911. Over the course of two world wars we’ve learned some invaluable lessons, including how to project force over these shores. That experience will be put to the test for the trials ahead."
ast_counter_the_island_chain: "Counter the Island Chain"
ast_counter_the_island_chain_desc: "Ever since the 1940s China has employed a campaign of intimidation and island grabbing to solidify their claim on the South China Sea. While expansion was somewhat manageable in the past, their latest success with artificial islands has amplified the threat. If we don’t put our foot down while we can, anywhere north of us could become the next ‘East China Sea.’"
ast_dealings_in_kuala_lumpur: "Dealings in Kuala Lumpur"
ast_dealings_in_kuala_lumpur_desc: "Mineral trade between us and Malaysia has risen to the point that their diplomats have contacted to discuss a trade agreement. Potentially streamlining an already highly profitable flow of goods. While we do, we could introduce terms for a neutrality agreement between us. Keeping them from engaging with China’s growing sphere."
ast_guadalcanal_garrison: "Guadalcanal Garrison"
ast_guadalcanal_garrison_desc: "After the onset of World War 2, and the subsequent invasion of the Solomon Islands by Imperial Japan, they attempted to use the island as a launching pad for attacks on our country. Some of the most intense fighting happened on those islands, and we can't risk another country gaining that foothold again."
ast_mutual_defense: "Mutual Defense"
ast_mutual_defense_desc: "We can’t patrol the Pacific on our own, and one of our closest allies since the end of the cold war, despite the mixed history, has been Japan. How they’ve rebranded, so to speak, has been no less than admirable. We’re going to need them for the conflict to come."
ast_due_reparations: "Overdue Reparations"
ast_due_reparations_desc: "Whilst joint security is enticing, getting what we’re owed for WW2 is somewhat higher in our priority. Over 27,000 Australians lost their lives, over 64% of which were fighting the Japanese forces, and spent almost 3 billion pounds over the course of the war. That’s not even mentioning the Bombing of Darwin. Recompense must be paid."
ast_pukpuk_treaty: "The Pukpuk Treaty"
ast_pukpuk_treaty_desc: "We’ve been tip-toeing around the idea of closer defense cooperation with Papua New Guinea for years now. The idea of combining our military commands presents an effective opportunity to counter China’s growing sphere of influence, and assert more direct influence on our friendly neighbour."
ast_the_indonesian_solution: "Taking Indonesia"
ast_the_indonesian_solution_desc: "Indonesia has been a thorn in our side for decades now, and the time for negotiations is over. Direct management will be required. We will restore order to the region."
ast_island_leasing: "Island Leasing"
ast_island_leasing_desc: "The islands of New Caledonia sit in a strategically crucial position on our north-eastern flank. Being able to position our troops there would allow us to create a sort of iron wall around the entire Coral Sea. Fortunately we’re in the position where we might be able to lease basing rights on the islands from our French friends."
ast_the_middle_power: "The Middle Power"
ast_the_middle_power_desc: "Getting South Korea on our side would produce an ‘achilles heel,’ so to speak, on China. A knife right in the gut if a conflict were to erupt between us, and the opportunity is too good to not to pursue."
ast_fuel_the_grudge: "Fuel the Grudge"
ast_fuel_the_grudge_desc: "The final piece on the board. Once we cross the threshold there's no going back. Our policy will need to shift away from China and towards Taiwan. If we can get them on board, everything else should fall into place."
ast_shirt_front_the_dragon: "Shirt Front the Dragon"
ast_shirt_front_the_dragon_desc: "China’s fleet has been trying to strong arm the Philippines out of the disputed atoll Scarborough Shoal for a few weeks now. Like most bullies, if we show support for the Philippines with our own ships, and set up a perimeter around the island, China’s bravado will quickly dissipate."
ast_the_canberra_treaty: "The Canberra Treaty"
ast_the_canberra_treaty_desc: "War has been averted, and the Dragon has been shown that the countries of the Pacific don't bow down to coercion."
ast_the_lottery_draft: "The Lottery Draft"
ast_the_lottery_draft_desc: "The last time we enacted the National Service Scheme, the move was less than popular. Still we need more ready forces if we’re coming out on top of this war. The ‘birthday ballot’ will need to return."
ast_stock_up: "Stock Up"
ast_stock_up_desc: "Our navy can’t be everywhere. There’s going to be shortages, and we can only pray that before then we have enough of the critical goods in storage."
ast_border_commanders: "Border Commanders"
ast_border_commanders_desc: "Technically speaking our country lacks a coast guard. The Maritime Border Command does typically border protection, but without a dedicated force, typically using a mix of ADF and RANPF units. We can remedy this by incorporating the remaining Reserves into its own fighting force, mandated with protecting our shores against any threat."
ast_remember_the_squander_bug: "Remember the Squander Bug"
ast_remember_the_squander_bug_desc: "Indulgent spending whilst the nation is facing its greatest financial challenge since WW2 tantamount to treason. We can bring back an old classic to ridicule our money grubbish citizens from over spending during the conflict, and sell our warbonds in the meantime."
ast_secure_a_landing: "Secure a Landing"
ast_secure_a_landing_desc: "Given our distinct separation, any invasion is going to be at sea. We’ll need to requisition quite a few private ships to meet the logistical demands of the task, and buff up our amphibious know-how."
ast_all_in: "All In"
ast_all_in_desc: "The industries of our nation need to be dedicated wholly to the present threat. A state of total war will be enacted. Some liberties might be put on hold temporarily, but the demands of the state and the army need to be prioritised."
canberra_treaty_idea: "Canberra Treaty"
ast_the_rudd_government: "The Rudd Government"
ast_the_rudd_government_desc: "Australia has looked to the future. The people have decided that we, as a nation, will move forward - to plan for the future, to embrace it together. United in writing a new page in the country’s history, and make this great country of ours even greater. \n \nWe cannot take this sacred trust for granted. \n \nImprovements to education systems are long overdue. The capacity of our public hospital systems and welfare is in desperate need of attention. Our infrastructure lacks what the 21st century demands, and absence of initiative to deal with the crisis of climate change has set us back decades. We come not as marchers of the status quo, but as the instrument for the common people. Attending these areas and the greater threats this country faces is just the beginning. \n \nOur policy must be in touch with Australians and the needs they have. A lot is riding on our ability to lead the nation into the new decade."
ast_mend_the_rift: "Mend the Rift"
ast_mend_the_rift_desc: "The neglect of the coalition government has allowed those dangling over the cracks of society to fall through. The disadvantaged, the marginalized; as they’ve been pushed away the cracks have grown too. We can begin the journey of bringing Australians together by visiting the worst areas affected. Remote communities experiencing the harshest of the housing crisis, homeless communities, struggling farmers and workers. If we shine a light on their situations we can show them the government does care, and that change is coming."
ast_heal_the_people: "Heal the People"
ast_heal_the_people_desc: "Right now our public healthcare is a mess. Wait times are putting people in need of lifesaving surgery out for up to a year at times, and emergency departments have been overloaded to the point where patients aren’t even making it to the operating room. With an emergency enactment of National Standards, we can immediately expand public hospital capacity requirements and raise the minimum staff levels across the nation."
ast_unite_the_country: "Unite the Country"
ast_unite_the_country_desc: "It's our job now to steer the ship, and if we can’t keep everyone on board then we aren’t doing it well. A gap still exists between Australians that is keeping us from being whole, and a refusal to recognise the past is preventing us from embracing the future. If we’re to achieve both we need to examine the inequality that has become an unbreakable malice in this country for centuries. We might not be able to completely dismantle it, but we can try."
#econ
ast_economic_revolution: "Economic Revolution"
ast_economic_revolution_desc: "It doesn’t take much to recognise the great neo-liberal experiment of the past 30 years has failed. The free-market fundamentalism it has produced has been revealed as little more than personal greed dressed up as an economic philosophy. Ironically, it now falls to the social democracy folks to prevent this form of capitalism from cannibalising itself. \n \nWe need to charter a new system of social capitalism, accountable to the people, that balances private incentive with public responsibility. Through regulation and greater fundamental safety nets for our people, we can achieve a stronger, more nation-serving economy."
ast_a_voice_for_all_australians: "A Voice for All Australians"
ast_a_voice_for_all_australians_desc: "We weren’t put here to pass lukewarm reform. However we go fourth the party will follow, and if they don’t we’ll find a way to whip them into shape. The real battle is going to be the senate, for which we don’t have a majority in. Pumping those numbers up with votes from the opposition parties and the independence is going to be needed to pass anything. \n \nIf we shake the tree hard enough, and sell our plans just right, a few votes might fall into our basket, and we can finally pass something meaningful."
ast_work_with_the_party: "Work With the Party"
ast_work_with_the_party_desc: "The Labor party has proven again and again its position as the best hope for Australia. Through wise leadership and tested moral empathy we continue the trend of passing legislation that not only benefits the people of this nation, but those to come. \n \nA wise leader also knows when to listen to his party. We can’t pass our reforms without a united party, and currently the road to passing policy is too narrow to lack caution. Presenting sensible policy is the only way we’re getting it through the House, and the Senate."
ast_form_the_pact: "Form the Pact"
ast_form_the_pact_desc: "If we’re going to pass any of our more radical proposals we’ll need to approach the Greens. They’re the overly-optimistic hippies of parliament. A meeting with their leader, Bob Brown, might be enough to rally all of them, although doing so will completely alienate any Liberal Party support, in fact we might lose some of our own members too. \n \nEven so, we’re going to need their help to get across the finish line."
ast_something_has_to_give: "Something Has to Give"
ast_something_has_to_give_desc: "There’s a rot underneath the wooden boards of our society. In spite of all our progress made and social endeavors, anyone in Australia can fall through if the circumstances are bad enough, and many do. There are safety nets, of course, but when our own welfare payments are below the poverty line, and even the elderly are forced to seek employment to stave off starvation, something has to give. \n \nOur systems of support are broken, and many in our country already feel it. We can’t stand by and let it worsen anymore."
ast_meet_with_the_unions: "Meet with the Unions"
ast_meet_with_the_unions_desc: "If we’re going to make headway with our reforms, the best place to hit the ground is with the unions. The Labor Party was founded by trade unions after all, and they are our biggest benefactors.. \n \nIt’ll certainly help us touch base with the workers, and signal we’re open to collaboration."
ast_earnest_cheques_for_the_needy: "Earnest Cheques for the Needy"
ast_earnest_cheques_for_the_needy_desc: "For those living on the edge of poverty a single accident or surprise bill could send them over. Part of our support for the public includes a number of one-off direct cash bonuses to pad the bottom line, and keep the vulnerable protected from any sudden financial ruin."
ast_new_consensus: "New Consensus"
ast_new_consensus_desc: "The Washington Consensus has been the standard prescription for economies since the 1980s. Now, with the dawn of new, globalised economies challenging that consensus, Australia must also find its own consensus. Whilst not as free-handed as that in Washington, nor as authoritarian as Beijing’s, ours will be intervention with finesse."
ast_insulate_the_homes: "Insulate the Homes"
ast_insulate_the_homes_desc: "It’s a disgrace that every night thousands of Australian families are sleeping in the cold. Our estimates are somewhere in the range of 40% of homes that are not insulated, leading to higher power bills wasted on heating for those who can afford, much less those who can’t. We’ll roll out a program across the country to cover the cost homeowners might face installing the insulation."
ast_fair_shake_of_the_sauce_bottle: "A Fair Shake of the Sauce Bottle"
ast_fair_shake_of_the_sauce_bottle_desc: "The biggest problem any couple faces when looking to have a child is the financial constraints. Taking the time off work needed to care for a child in its most crucial years is something few are able to even consider, especially in this current, changing economy. Given that it is our responsibility to look out for Australians, we ought to support them however we can. \n \nEvery parent in Australia, even those adopting, will be eligible for 26 weeks of paid parental leave. Everyone who wants it will get a fair shake at becoming a parent, because this is the government of fairness."
ast_housing_initiative: "Roll Out the Houses"
ast_housing_initiative_desc: "We’ve reached an agreement with private contractors to assist us with building over 20,000 new social housing dwellings and repair approximately 12,000 uninhabitable properties across Australia over the next 10 years. This will house thousands of those suffering from homelessness in the first year alone."
ast_the_care_act: "The Social Security Amendment"
ast_the_care_act_desc: "After long negotiations with the party and with the Liberals, we’ve managed to put a lid on our welfare legislation. Overhauling eligibility and worker programs, Centrelink will be available to almost a million more Australians. Pensioners will see a sizable bump to their payments, while balancing the change by raising the eligibility age and tightening medicare to placate the opposition. Hundreds more scholarships and increases to disability payments. \n \nMore and more Australians are going to be living easier while the government has their back."
ast_shelter_for_all: "Shelter For All"
ast_shelter_for_all_desc: "If our current investment into the country wasn’t great enough, the plans we have to tackle homelessness have pushed the budget hawks into a hysteria. We’ve scrapped the initial plan for 20,000 social housing units over 10 years for 100,000 in that same period of time. The first of them built over the next year will go directly to housing those most at risk. \n \nEven the most progressive in the party are calling the plan bold, and some even calling it impossible. Most of our construction capacity is going to have to be utilised for the initial process if it’s to be feasible."
ast_root_and_branch_approach: "Root and Branch Approach"
ast_root_and_branch_approach_desc: "Much of our more widescale reforms can be described as “root and branch” changes, wherein the approach to overhauling something like healthcare or housing has to begin at the roots. Instituting independent reviews or completely redesigning the process to help far more Australians and operate with greater efficiency. Our plans for a redesign of the welfare system have come up more expensive than we can currently facilitate, which leaves us with a sizable deficit. \n \nAs much we’d like to please everyone, the funding has to come from somewhere."
ast_a_stronger_net: "A Stronger Net"
ast_a_stronger_net_desc: "With input from the Greens we’ve put together what might be the largest welfare legislation the country has ever seen. A sweeping reform of our current welfare capacity and eligibility, with massive-scale programs to target millions in poverty and raising payments to liveable levels, whilst raising the government minimum wage. No doubt this is going to shake things up in the industry, and it could be the closest thing a nation our size has to a universal basic income, but if we’re to make social change that’ll outlast our generation, this’d be it. \n \nWe’ll lose some of the party budget hawks, but it’ll be worth it for what we’ve achieved."

#social
ast_bill_of_rights: "Our Bill of Rights"
ast_bill_of_rights_desc: "After our election a number of voices made their desire for a ‘bill of rights’ that would fundamentally shape our governments focus on the rights of our citizens. Now we have the opportunity to propose a Commonwealth statute that would bring forth just that. Implementing protective rights, changes to our judicial system and authority agencies, and presenting a charter to our parliament with the responsibility we hold to Australians to maintain their equality, freedom and safety. Essentially the whole nine yards."
ast_the_social_contract: "The Social Contract"
ast_the_social_contract_desc: "The systems of care and support have dwindled down and decayed to such a point where the growing number of those without has become the many. It is no truer that Australians are free than that a system that has failed them again and again has reduced them to dependence on the state for even the barest of necessities. Elsewhere that same system has neglected those in need of care. \n \nNow it’s our responsibility to change things. The ignored and disadvantaged will be addressed. This system cannot continue."
ast_a_national_congress: "A National Congress"
ast_a_national_congress_desc: "Although the ATSIC was a step towards unified progress, somewhere along the line it lost its way, and its purpose for real representation was never truly realised. By working with the Australian Human Rights Commission, we can organise a new National Congress of Australia's First Peoples to replace it. Allowing us to more actively work alongside Indigenous Aussies to implement policy focused on equality and proactive change."
ast_visit_the_schools: "Visit the Schools"
ast_visit_the_schools_desc: "Much like our economic revolution, a top down reform of the school system is going to be needed. We’ve already drawn up plans to invest heavily in refurbishing and building new trade schools, and we can start it off by visiting some of our local schools in Queensland to get a feel of the situation on the ground."
ast_digital_education: "Digital Education"
ast_digital_education_desc: "The breakthrough of the internet has been something to behold for Australians, and especially our youth. If taught at a young age to be better utilised, our next generation will be equipped to handle the new digital realm, and avoid the dangers it might present. Installing a number of computers into classrooms, along with our other refurbishments, is going to get us prepared for the modern era."
ast_a_national_agreement: "A National Agreement"
ast_a_national_agreement_desc: "There are a number of opposition members inclined to work with us on Indigenous policy. If we can convince them to regard the issues as the crisis they are, we can run bills through as emergency measures. Rapidly employing programs to target chronic diseases, literacy rates and primary care access in remote areas."
ast_state_health_reform: "State Health Reform"
ast_state_health_reform_desc: "Typically the local states manage public hospitals out of their own pockets. However, recently they’ve either gone lax or are suffering severe funding issues, because the current care isn’t nearly doing enough. The only way we’re going to be able to manage a funding reform is by taking over the hospital's funding management, whilst keeping the general operations handled locally.  \n \nWe can run our own reviews to see which areas might need improving and go from there. If they kick up a fuss we’ll have to threaten them with a constitutional referendum to give the Federal Government full control of public hospitals, then we’ll see if they still bark. \n \nFor once the buck stops with us."
ast_equal_opportunity: "Equal Opportunity"
ast_equal_opportunity_desc: "We don’t have the right to stand in the way of the demand for equal marriage rights. Even if we aren’t championing it ourselves, we can still put the matter to a referendum, and gauge where public perception is at. If it passes, and the opposition is still against us, we can use it as fuel for the next election."
ast_respect_traditional_values: "Respect Traditional Values"
ast_respect_traditional_values_desc: "A fair government has the responsibility of listening to the needs of the many, whilst respecting the livelihoods of the few. Australia has thrived thanks to measured and cautious leadership. We won’t be forcing anyone to bake a cake which goes against their religion, nor are we going to stir the pot of culture wars. It’s time we took a step back for a change."
ast_clean_feed: "Clean Feed"
ast_clean_feed_desc: "Even with our digital education programs we can’t prevent the worst of the internet from affecting the youth. Even now online bullying and cybercrime threaten the very fabric of Australian lives. We’ll delegate a list of the worst offenders online to our internet service providers, which’ll require them"
ast_close_the_gap: "Close the Gap"
ast_close_the_gap_desc: "Our central, ongoing policy when approaching Indigenous affairs has been closing the gap in life expectancy, educational achievement and economic opportunity. Life expectancy in particular for Indigenous Australians is almost 10 years less than for non-indigenous citizens. Literacy rates are also much lower, and child mortality rates are double that of non-indigenous. \n \nYou get the point. We need to put forward legislation that includes a broad range of programs dedicated to the cause, and making hard targets to improve the lives of our First Peoples."

#mining
ast_tackle_the_mining_oligarchy: "Tackle the Mining Oligarchy"
ast_tackle_the_mining_oligarchy_desc: "The insidious forces that have influenced our government continue to do so to this day thanks to the wealth they’ve drained from our soil. For centuries they amassed a fortune and refused to share it, while the workers they hired work are paid too little and disposed of too easily. It’s past time they paid their share, and that the Australian people are rewarded for the ore that comes out of their ground."
ast_draft_the_legislation: "Draft the Legislation"
ast_draft_the_legislation_desc: "With the scope of what we’re trying to achieve we’ll need to draft the ultimate piece of taxation legislation, devoid of any loopholes, and bringing together all the experts we can to pitch in. If we’re doing this, we’re doing it the right way."
ast_tax_the_super_profits: "Tax the Super Profits"
ast_tax_the_super_profits_desc: "Many late nights spent in Parliament have rewarded us with a shining spear to use against the big corporations. A dynamic tax rate, targeting the biggest companies, and taxing only the \“super profits\” obtained when a company far exceeds their normal income rate, will finally trickle down some of the earnings raked in during the mining boom. This should also avoid the label of unfair taxation, since the tax will be nil if the company has underperformed, or its operational costs exceed the returns."
ast_throw_businesses_a_bone: "Throw Corps a Bone"
ast_throw_businesses_a_bone_desc: "The regulation between our own states is overbearing to say the least. It’s costing businesses big and small a hefty amount, and it's slowing down a great deal of commerce, which only goes to increase the cost of goods locally. If we want to throw the industries a bone and show that we’re not just out to get them, we can work alongside the business council to create a seamless national economy. One that cuts down the mountain of red tape in exchange for easier travel, and greater flow."
ast_tear_off_special_interests: "Tear Off Special Interests"
ast_tear_off_special_interests_desc: "Interests groups have become a malignant presence in our political system that should’ve been dealt with long ago. Having unfair influence on our election cycle and political process. We can’t speak for the other side of the aisle, but by investigating our own party for unfair influence we might be able to cut some of the tendrils loose. It might not rid them forever, but it’ll make removing them in future easier."
ast_own_our_resources: "Own Our Resources"
ast_own_our_resources_desc: "One of the governments biggest mistakes was allowing foreign ownership of our resources without having a stake in them ourselves. Granted we have profited nicely off their continued growth, and the global economy is a success for a reason, but we shouldn’t neglect the interests of our own nation either. \n \nWe already receive royalties from the mining corps for mining our land, if we hike the cost they might protest it in the short term, but eventually they’ll come to the table, and we can better negotiate how our country’s minerals are handled."
ast_spirit_of_gough: "The Spirit of Gough"
ast_spirit_of_gough_desc: "The tragic tale of Gough Whitlam is one for the history books. A man with ambition too high, cut down by the powers around him. Despite his short run he shined as a great revolutionary for progressive politics, and it was only his attempt to curtail the growing control of the mining industries that did him in. \n \nIt might be too late to enact the scale of ownership he was planning, but we can still do him proud. By creating the first government-run mining corporation, we can sidestep the corporations and dig the ore out of our own mines, taking all the profits and all the rewards for ourselves."
ast_spirit_of_gough_tt: "Creates the §0Petroleum and Minerals Authority.§!"

#foreign
ast_twenty_twenty_summit: "2020 Summit"
ast_twenty_twenty_summit_desc: "The 2020 Summit has been the brainchild for our government’s more involved stance on governing. An open democratic forum, inviting 1,000 community leaders, experts and citizens to brainstorm a strategy for the nation’s future. Australians deciding their own future is a great way to kick off our term, and shows it we’re committed to change."
ast_kyoto_accords: "The Kyoto Commitment"
ast_kyoto_accords_desc: "Ratifying the Kyoto Protocol is just the beginning. To see it fulfill its potential we’re going to have to push further. No chunk of coal unturned."
ast_big_australia: "Big Australia"
ast_big_australia_desc: "The concept was drummed up during the 2020 summit. Our smaller population has been one of the only things holding us back on our journey to be up there with the greats. Right now there’s only so many babies we can make. The new plan has included steps to reaching 36 million by 2050, fundamentally by increasing the intake of our migration system. Everything needs to be streamlined."
ast_seasonal_labour_scheme: "Seasonal Labour Scheme"
ast_seasonal_labour_scheme_desc: "The chokehold of our smaller population can only be amended in the short term with a stream of imported labour. Expanding the restrictions to funnel more foreign workers towards our industries will keep them growing in the meantime, and hold off the shrinkage we might expect down the line."
ast_our_sibling_state: "Our Sibling State"
ast_our_sibling_state_desc: "Few could measure the intense rivalry between us and the country with a smaller population than Sydney. Whether it’s sports or anything else really, you’ll never hear the end of it if they come out on top. Our economies are already fairly synced, but we’ve been working on a trade agreement to effectively tie our nations together financially. Trade and Investment will flow between us like water if it’s successful."
ast_pacific_islands_forum: "Pacific Islands Forum"
ast_pacific_islands_forum_desc: "Every few years our nation, New Zealand, and those of the island nations meet to discuss regional interests and address the challenges facing them. It’s been an effective way to keep tabs on our oceanic neighbours. This year the topic of worker permits has been squarely on the agenda, and a few nations have discussed temporary permits for joint horticultural development. Whether we agree to take them on or not, the plan certainly has its merits."
ast_end_the_imperialism: "End the Imperialism"
ast_end_the_imperialism_desc: "Perhaps sitting in the biggest seat in the nation has provided a sense of clarity. In the entrenched environment our predecessors have created, sometimes we do actually have a choice. Whether to continue inflicting unneeded interference and harm across the world, or to instead pull back and respect the boundaries that have grown around us."
ast_maintain_obligations: "Maintain Obligations"
ast_maintain_obligations_desc: "We retain a certain level of responsibility for the governments that came before, and the interests they’ve created in the Pacific and Beyond. When our policy, as often as it does, affects the lives of millions, we have to approach things with a soft touch. Taking a sledgehammer to our relations this early on is only going to end badly for us. It’s best we keep what we have, and improve it where possible."
ast_the_free_trade_area: "Free Trade Area"
ast_the_free_trade_area_desc: "Months of negotiating with the ASEAN states has landed us with an incredibly lucrative opportunity. While our country and New Zealand don’t meet the criteria to join the trade bloc, we can still access some of its benefits by becoming outside ‘partners,’ essentially creating a free trade zone between us and Asia."
ast_the_beginning_of_something_new: "The Beginning of Something New"
ast_the_beginning_of_something_new_desc: "Although the ASEAN pact has worked well to unify the Asian states these last decades, the three biggest economies in the Pacific remain barely tethered. Japan, India and China may have their own individual agreements, but it pales in comparison to the union established in Europe. \n \nAlthough admittedly ambitious, if we could unite these countries, including our own, into a combined economic union, financial prosperity would simply be the beginning. Peace across the pacific would be achieved with merely a unified currency."
ast_address_the_tiger: "Address the Tiger"
ast_address_the_tiger_desc: "Relations with India are flying smoothly right now. Some might even say peachy. We shouldn’t try to ruin a good thing, but who says we can’t improve it? Their disposition with China is one of the bigger roadblocks we’d face forming the union. If we can make some kind of breakthrough the rest of the work will be a breeze."
ast_an_asian_pacific_union: "An Asian Pacific Union"
ast_an_asian_pacific_union_desc: "Every piece has to be in its perfect place for what we’re trying to pull off. How far we can go and how much of an imprint we make in geopolitical history is going to be defined by these talks. Our work will finally pay off."
ast_renegotiate_with_papua: "Handle the Boat Crisis"
ast_renegotiate_with_papua_desc: "Thousands of migrants are landing on our shores every year undocumented, and it seems that number is only increasing. With the existing infrastructure becoming overwhelmed, the off-shore solution will need to be reexamined to service the current crisis."
ast_keep_the_gears_turning: "Keep the Gears Turning"
ast_keep_the_gears_turning_desc: "We’re far too interconnected to the world to just pull out. The policy of containment-by-proxy only works if we keep greasing the gears, and showing that our promises stick. The risk of turning our backs is just too high. No greater good. No just cause."
ast_world_hold_on: "World Hold On"
ast_world_hold_on_desc: "We need to send a message to the other countries that Australia hasn’t peaked. We’re still here, and we’re going abroad. Promoting outside investment by shrinking the regulation holding our big businesses back is the type of economic colonialism that we can be proud of. Fox News and Outback Steakhouse were just a glimpse of what we’re capable of. They'll see."

#business
ast_assure_the_other_side: "Assure the Other Side"
ast_assure_the_other_side_desc: "We can’t survive without our businesses. Commerce acts like the blood cells going through our industry. Party obligations aside, without a vested interest in supporting them through the current financial shift, the very beating heart of our economy could seize up. A balance needs to be struck in supporting them, just as they indirectly support us."
ast_forward_with_fairness: "Forward With Fairness"
ast_forward_with_fairness_desc: "We’re all for improving the lives of our workers, but choking business growth during these times is simply not an option. Abolishing AWA’s and introducing Collective Bargaining will show we’re willing to work in business interests. After all, the right to work should remain with the worker, not the union."
ast_represent_the_worker: "Represent the Worker"
ast_represent_the_worker_desc: "Labor is fundamentally made up of human beings with intrinsic dignity rather than just an economic commodity. If our workers don’t believe we have their backs, how are they expected to stand up for their own rights? We cannot be seen favoring the wishes of enterprises over our own people."
ast_the_emissions_trading_scheme: "Emissions Trading Scheme"
ast_the_emissions_trading_scheme_desc: "Climate change has become the greatest moral challenges of our time. Not just for us, but worldwide. Hundreds of nations now find themselves being warned of the impending danger, yet their strength to act is being challenged. Can the comforts of our industries be put aside for those of future generations? Can we truly bear the burden of carrying the economy to new heights whilst preserving our environment? For us the answer will always be yes. \n \nThe scheme has been one of our longest campaign promises, introducing caps on a company's CO2 output. If companies wish to expel more they would need dolled out permits from the government, or pay highly for them, resulting in less energy production in the short term. It aims to decrease our output to pre-2000 levels, while incentivising renewable energy, but no doubt it will raise us a fair amount in new revenue."
ast_cut_the_csiro: "Cut the CSIRO"
ast_cut_the_csiro_desc: "Unfortunately the Commonwealth Scientific and Industrial Research Organisation hasn’t been pulling its weight. You would expect enough bloated grants to completely fund other agencies might have produced something, but in the last few decades the costs have grown, and produced very little of worth. We’ll need to gut enough of it to get things back on track, and it won’t hurt our coffers."
ast_green_energy_incentives: "Green Energy Incentives"
ast_green_energy_incentives_desc: "If fossil fuels are on the decline, renewables must be on the up. More than that, they need to be encouraged if we’re meeting any kind of nation-wide adoption in the future. Developing our geothermal capabilities and investing into a Green Car Innovation Fund will get us going in the right direction."
ast_fair_work_australia: "Fair Work Australia"
ast_fair_work_australia_desc: "Given the disconnect between our businesses and the government, the party has advised the creation of a relations bureau, working on behalf of business interests to align our focus better with theirs. This should do away with the Workplace Relations Act, and the dreaded Workchoices reforms. If we implement it with feedback from the unions we can work in some of the usual worker protections, while appeasing both sides of the argument."
ast_snip_the_red_tape: "Snip the Red Tape"
ast_snip_the_red_tape_desc: "Despite our fairly unified commonwealth, our state governments are certainly not working together as well as we’d like. If a business wants to register they need to navigate through the forms and fees for each individual state they operate in, so if they operate in two states it’s twice the fees and twice the forms. Creating a single national online register is going to allow anyone in the country to register once-and-done, then straight to business."
ast_for_the_common_farmer: "For the Common Farmer"
ast_for_the_common_farmer_desc: "Ever since the turn of the century, our farmers have had it tough. Fittingly the worst cause for concern has been the Millennium Drought which, despite our policies, continues to hamper agricultural recovery. Sitting down with the advocates will help us work on some real solutions."
ast_walkable_cities: "20-Minute Cities"
ast_walkable_cities_desc: "Our greatest fight has been in the streets. At the start of the industrial revolution citizens were pushed into tight alleyways and forced to adopt the asphalt landscapes as their social gatherings. Since then our sense of community has shriveled up and become a sacrificial item to inside entertainment. We can’t force people to go outside, but we can entice them. \n \nIncorporating the 20-minute city plan, developed by the Melbourne council, we can loosen mainstreet noise restrictions and fund a number of creative projects and festivals to bring people back into the streets, rebuilding a sense of community. Throw on top free youth programs and expansions to our infrastructure, and our neighbourhoods will be bustling centres of culture in a matter of years."
ast_keep_them_safe: "Keep Them Safe"
ast_keep_them_safe_desc: "Australia doesn’t have a national animal, although most would argue it’s the Red Kangaroo. An almost universally recognised symbol, and yet just as many know about the cute critters that hang about our outback forests. Whether it’s logging companies or diseases, every year the population decline for Koala’s gets worse, and yet little is done to protect them. If we nominate them as a protected species, more can finally be done to keep these memorable marsupials around and safe from extinction."
ast_industry_research_bank: "Commonwealth Research Bank"
ast_industry_research_bank_desc: "Our research has only slumped because we’ve allowed it to. A lack of investment in critical areas prevents our organisations doing the very job they were built to do, pushing through the barriers. Up the budget and up the targets."
ast_natos_best_friend: "NATO's Best Friend"
ast_natos_best_friend_desc: "Australia already stands as one of Nato’s closest non-member allies. We train with them, we undergo peacekeeping with them, and we share intelligence. Our stance in the Pacific could be strengthened far more with the right backing, and although our neutrality has its benefits, it’s time for a closer commitment."

#return
ast_from_the_ashes: "From the Ashes"
ast_from_the_ashes_desc: "Now that we’re back in command we need to focus on winning the next election. Our policy needs to be keyed into the short term, and rallying the party behind us is going to require an ounce of inspirement and an abundance of arm-twisting."
ast_a_new_dawn: "A New Dawn"
ast_a_new_dawn_desc: "The public needs to see Labor as a party born again. The old skin of infighting has to be shed, and a new image of competency and reliableness will be drafted to salvage the voterbase."
ast_repair_the_party: "Repair the Party"
ast_repair_the_party_desc: "Our old relationships with the party factions are more or less in tatters. Worse is that the system that allowed us to be overthrown is still present. Uprooting the current mechanisms to make leadership coups less common and rewriting the party rules is the only way we’re going to fix things."
ast_fight_back: "Fight Back"
ast_fight_back_desc: "If the Newscorp media thought they could continue to drag us through the mud and we wouldn’t have an answer for it, they’d be dreaming. The arena of debate is a two way street, and we’re going to hit them back hard."
ast_on_the_campaign_trail: "On the Campaign Trail"
ast_on_the_campaign_trail_desc: "Truly the last few years haven’t been ideal, and Labor has certainly lost its way. Visiting Australians rural and urban, across the nation, and getting to understand the real issues affecting them shows we’re ready to return to being the party that listens. Starting that off by announcing our run at the National Conference."
ast_win_manufacturers: "Win Manufacturers"
ast_win_manufacturers_desc: "We’re kicking our second term off strong with the Australian Jobs Act. A 2 billion dollar package to retrain 7,000 manufacturing workers, helping them transition into the production sectors while our traditional automotive and textile markets are facing downsizing. A practical solution to the ongoing industry slump."
ast_cast_the_die: "Cast the Die"
ast_cast_the_die_desc: "Our chips are in place, and the Australian people are ready to choose their next leader. We’ve done everything we can to prepare ourselves and present our vision, we can only hope the voters are onboard with it."
the_gillard_gov: "The Gillard Government"
the_gillard_gov_desc: "This government believes in rewarding those who work the hardest, not those who complain the loudest. It believes in rewarding those who, day in and day out, work in our factories and on our farms, in our mines and in our mills, in our classrooms and in our hospitals, that rewards that hard work, decency and effort. The people who play by the rules, set their alarms early, get their kids off to school, stand by their neighbours and love their country. \n \nOur country is blessed in many ways, but the state of our nation’s finances has corroded and bloated to the point of neglect. I assure every Australian that the budget will be back in good health under our direction. Taking upon the duty those before laid out, we are committed to undertaking a fiscally responsible and strong government that understands the needs of more than just the loud few. \n \nThe media politics will end. The indifference towards the needs of our industries will end, and the qualities of dignity and sensibility will be returned."

#parliament policy
ast_form_the_minority_coalition: "Form the Minority Coalition"
ast_form_the_minority_coalition_desc: "Labor’s future now rests on our ability to form a government."
ast_go_green: "Go Green"
ast_go_green_desc: "When they aren’t stabbing us in the back, the Greens have been a useful party to our cause. Negotiating with them will hardly be an issue, and most of their policy preference aligns with our own. Sure we’ll have to implement a few token reforms here and there, but they’ll have our backs when it matters."
ast_wrangle_liberal_defectors: "Wrangle Liberal Defectors"
ast_wrangle_liberal_defectors_desc: "A few current members of the Liberal and National Party have shown interest in our agenda, and some have already jumped ship in lieu of the recent party drama. Finding them and offering them a place in our government in exchange for support should be easy enough, and show we’re not above working with the opposition in preserving conservative values."
ast_clean_energy_act: "Clean Energy Act"
ast_clean_energy_act_desc: "After failure to launch the Emissions Trading Scheme, a less divisive substitute has been drafted up to address our growing carbon emissions. The scope of the act is still yet to be entirely defined, but, similar to the ETS, the goal of the act is to limit the CO2 output with newly introduced taxes and encourage clean energy production."
ast_clean_energy_creation: "Clean Energy Creation"
ast_clean_energy_creation_desc: "We’ve been on a home-run tackling the climate crisis, and it’s time we invested some of our funding into continuing on with the plan. The long run has always been to achieve renewable independence from our coal reserves. Let’s start the transition."
ast_address_the_stolen_generations: "Address the Stolen Generations"
ast_address_the_stolen_generations_desc: "There’s enough support in the opposition to deliver an address on the Stolen Generations without appearing to ride the tailcoats of the National Apology. It will certainly make us appear very bipartisan, and might be a source of solace for some in the community."
ast_correct_the_mouthboxes: "Correct the Mouthboxes"
ast_correct_the_mouthboxes_desc: "Corporations and political campaigners have been allowed to outright lie online and on the TV with little to no consequences at all. While it's difficult to prove any malice, or harm caused by the lax in truth, we can’t allow this troubling trend to continue. Introducing legislation that punishes misleading advertisements or posts should curb the trend, and bring some semblance of reality back into politics."
ast_let_debate_decide: "Let Debate Decide"
ast_let_debate_decide_desc: "One of the bills the Greens have handed to us is aimed at expanding same-sex freedoms. Our government is still fairly on the fence, if not opposed to making sudden moves in that direction, but we can leave it to the assembly to decide on it in a fair manner."
ast_ndis: "Form the NDIS"
ast_ndis_desc: "The simple truth is that disability can affect any of us and therefore it affects all of us. Rarely is anyone financially ready for the consequences and right now those facing isolation, poverty and loss of dignity can only rely on the little our welfare services provide specifically for the disabled. \n \nThe introduction of the National Disability Insurance Scheme might be the most significant support since Gough Whitlam's introduction of universal healthcare. Millions suffering in need will have the support they need, and the nation will be prouder for it."
ast_the_gonski_review: "The Gonski Review"
ast_the_gonski_review_desc: "At the start of our term we commissioned a review of our school system to find any deficiencies in need of a patch up. The resulting review found a compounding gap in educational outcomes driven by socioeconomic status and funding inefficiencies. In short, public schools receiving less funding ended up with poorer scores across the board. \n \nA serious redrawing of educational funding needs to be instituted to address the problem and help our students. They are the future of our nation after all."
ast_ast_keep_them_in_line: "Keep Them In Line"
ast_ast_keep_them_in_line_desc: "The National Party have been trying to cause a stir over our agricultural policy, or lack thereof. While these tactics of coercion might’ve worked with previous administrations, it won’t define how we run this cabinet. We’ll release our own grants for the farmers, on our terms, and proclaim it to the media as our victory. \n \nIt shows if they want to play ball with us, it has to be on our terms."
ast_take_less: "Take Less"
ast_take_less_desc: "There is very little the Liberal Party is correct on, but what they get right is keeping taxes low. How can we expect the average Australian to value the rewards of their work if we end up taking the bulk of it. A stronger population is one with more in their pocket."
ast_get_more: "Get More"
ast_get_more_desc: "Sin taxes have been utilised since our nation's inception, although lately they’ve been forsaken lately for the right of the lower class to indulge in degenerate activities. The choice between appearing ‘socially accepting,’ and carrying any sort of moral backbone is an easy one for us to make."
ast_regulate_the_unions: "Regulate the Unions"
ast_regulate_the_unions_desc: "Like it or not, unions are, by their very definition, obstruction to economic growth. They erode the very freedoms workers have to work, and the rights of companies to hire. We are practically held by the throat by the political power that unions have wielded to control the government and stifle prosperity. \n\nLegislation needs to be permitted to limit their reach and keep the politics of this nation within the government, not dominated by these far-left petty bureaucrats."
ast_national_broadband_network: "National Broadband Network"
ast_national_broadband_network_desc: "The NBN has been in development for almost a decade at this point, with billions already invested in the scheme to bring network speeds across Australia in line with the modern day. If anything the project has taken longer than necessary, and still the opposition cry out at the cost. If our cuts have been for anything, expenditures like these are well worth the price tag."

#econ
ast_back_in_black: "Back In Black"
ast_back_in_black_desc: "Without pointing any fingers, our spending has become recklessly overblown. Waste is plaguing our budget, and no government should have to pay for the sins of the previous one. All the stops need to be pulled in bringing us back into the black, and keeping inflation low. No “ifs,” no “buts.” Failure is not an option here and we won't fail."
ast_slam_the_door_on_them: "Slam the Door on Them"
ast_slam_the_door_on_them_desc: "With how much our welfare has ballooned, our first order of business should be looking into the eligibility criteria of our disability services. Raising the requirements to a reasonable level should kick off some of the freeloaders that otherwise aren’t necessarily in need of the support, and pruning a few wasteful programs will bring spending back to a more acceptable level."
ast_scrounge_a_penny: "Scrounge a Penny"
ast_scrounge_a_penny_desc: "In the pursuit to squeeze out savings any way we can, sometimes you have to get creative, especially when it comes to raising taxes. Loudly announcing a tax hike is a sure way to shrink our support when we’re still getting started. Instead, if we quietly raise the medicare levy from 1.5% to 2%, those paying for it will hardly have noticed, and we’ll have accumulated a nice bit of extra funding for the budget."
ast_digitise_the_tvs: "Digitise the Channels"
ast_digitise_the_tvs_desc: "After the pilot program in Mildura turned out to be a success, we’re rolling out the rest of the switchover across the country, replacing the old connections with set-top boxes. The rollout is completely handled by us, and should allow even rural Australians to access a range of new channels in much higher quality. The great equalisation of entertainment starts here."
ast_our_own_white_paper: "Our Own White Paper"
ast_our_own_white_paper_desc: "The Australian Defense Force has played a central role as the sacred shield of countless nations, near and far. As the demands for protection have grown, so too has the budget, and no part of the government is safe from wastefulness. The army will remain as effective as ever, but a hard scrub of the deficiencies will need to be carried out."
ast_plain_cigarette_packaging: "Plain Cigarette Packaging"
ast_plain_cigarette_packaging_desc: "Outside of our spending cuts, addressing the cancer crisis has been one of our largest priorities. Government run adverts have done their part, but the availability of cigarettes in almost every store is still a core problem. Rather than outright banning smoking, replacing branded packaging with mini-advertisements that warn of the dangers of smoking is going to make the association with cancer impossible to ignore. \n\nIt’ll keep the parents responsible, and scare the hell out of the youth."
ast_put_the_squeeze_on_them: "Put the Squeeze On"
ast_put_the_squeeze_on_them_desc: "Part of our state health reform has been reviewing the current expenses handled by states, and amending them to better deliver care in a timely, efficient way. This time around we’ll put forward a different kind of review, targeted at eliminating spending waste. Just like last time they’ll probably fight us over it, but eventually we’ll squeeze every drop out of them back into the budget."
ast_australia_works: "Australia Works"
ast_australia_works_desc: "Promptly named, the program aims to incorporate the basis of ‘Work For the Dole’ into a government run, state-wide construction service, providing consistent work for those on welfare, and creating new jobs to keep the currently shrinking construction industry afloat. It’s incredibly ambitious, but necessary to bring our country back on track."
ast_free_the_market: "A Freer Market"
ast_free_the_market_desc: "Right now our beautiful nation is being stifled by an overburdened government, and a fleeced private sector. We’re slowed down and simultaneously refuse to allow businesses to grow on their own. Limiting that grasp by cutting down on the taxation stranglehold, and privatising our unused office spaces, will be the revitalisation we need, and allow the free market to take its course."

#mines
ast_mediate_with_the_mines: "Mediate with the Mines"
ast_mediate_with_the_mines_desc: "The relationship between the Labor Party and the mines has been handed to us in a less than ideal state. A serious shift needs to occur if we’re to work alongside them for reform, and the place to start is in the middle. Hosting a variety of events to discuss the demands and the opportunity for collaboration is going to set the foundation for our work going forward."
ast_endorse_the_magnates: "Endorse the Magnetes"
ast_endorse_the_magnates_desc: "One of our largest mining CEOs, Gina Rinehart, has directly approached the administration to smooth over her request to bring in 1700 skilled foreign workers, supplementing the newly created mines in Western Australia. Gina has been nothing but supportive of our new government so far, and getting off on the right foot with her might be the right place to start if we’re going to tango with the mines."
ast_entice_competition: "Entice Competition"
ast_entice_competition_desc: "If the unions are worried about monopolies forming, open the market up to foreign companies. Competition has moderated economies for centuries, and the Australian economy is no different. Being a mixing pot of ideas is part of what built this country in the first place."
ast_minerals_resource_tax: "Minerals Resource Tax"
ast_minerals_resource_tax_desc: "The Super Profits tax was far too ambitious and was delivered at the worst possible time. We need to cooperate with the mining industries if we’re making it out of this downpour in one piece. Cooperation has indeed provided us with this little legislation. Truly it isn’t nearly enough to chip away at the monopolisation of our resources, but it’ll have to do for now."
ast_bauxite_investment: "Bauxite Investment"
ast_bauxite_investment_desc: "Aluminium is turning out to be one of the most important metals of the 21st century. It’s everywhere, it’s incredibly useful, and we’ve got plenty of it here. It’s fortunate that a proposal for such a mine has landed on our desk, delivered for our consideration under the request for investment. When an opportunity like this presents itself, it's wise not to turn it down."
ast_pilbara_expansion: "Pilbara Expansion"
ast_pilbara_expansion_desc: "Most requests for mining land get handled at a local level, however, a request has come through for a site in Pilbara that happens to cross into the border of one of the national parks there. The site is pretty far from any preservation sites, but the case is currently strung up in the high court. We might be able to put our weight on the scales and expedite its approval, in the interests of our economy of course."
ast_ease_on_restrictions: "Ease On Restrictions"
ast_ease_on_restrictions_desc: "Plenty of mining projects each year are scrapped over environmental restrictions. Even the most minor of dig sites can be scrapped over protection zones or new climate legislation. At this point the biggest slowdown for economic growth is a lack of availability. A ridiculous concept considering the size of Australia. This needs to be amended."
ast_train_it_out: "Train It Out"
ast_train_it_out_desc: "The mining scene in Western Australia is practically begging for open-access heavy rail lines, connecting remote mines, like the Pilbara, to ports. Building our own government run lines would break the monopoly that giants hold over rail infrastructure, and it’ll allow dozens of mid-tier and junior miners to get their product to port, drastically increasing our national export volumes."
ast_champion_the_mets_sector: "Champion the METS"
ast_champion_the_mets_sector_desc: "With how streamlined our nation has become for mining endeavors, corporations have begun treating it as a “quarry to the world,” so to speak. Where resource extraction has become a narrow pursuit. Australia needs to be seen as the Silicon Valley of mining technology. \n \nFunding METS organisations (Mining Equipment, Technology and Services), and directing our own R&D into remote operational mining, will accelerate the development of autonomous hauling, and evolve our current techniques for extraction. The future of mining will be made here."
ast_the_australian_century: "The Australian Century"
ast_the_australian_century_desc: "Golden ages are rarely stumbled upon, or a fortunate happenstance. They are the result of work put in over decades or even centuries, and few times, if ever, they eventuate. Unlike the nations of history, our government is not stumbling in the dark. Everything we do today has been years in the making, and our success has been carefully planned from the beginning. Now is our moment."

#foreign
ast_the_foreign_ministry: "The Foreign Ministry"
ast_the_foreign_ministry_desc: "The rise of Asia, and in particular China, has put Australia in a perpetual “lower rate” position economically than those around us. Whilst this might be an alarming reality for some, the 21st century will not be a continuation of unipolarity, and this brings with it a windfall of opportunity for us. If we’re willing to compete and overcome our predilections, the Pacific stands as a new world to either exploit or embrace to the benefit of our nation."
ast_foreign_minister_rudd: "Foreign Minister Rudd"
ast_foreign_minister_rudd_desc: "The former leader might be the most experienced in foreign matters that we have in our roster. Kevin Rudd has spent decades cultivating a dialogue with the Asian nations, and has already played a crucial role for the government in growing more interlinked. Rudd has proposed a series of diplomatic tours to strengthen our position, and present Australia as the oliver branch of the Pacific."
ast_papua_residency: "Papua Residency"
ast_papua_residency_desc: "The Papua economy has slowly become incorporated with ours in all but an official agreement. Rectifying that by negotiating a complete economic pact will finally seal the deal."
ast_soften_the_emerald: "Softening the Emerald"
ast_soften_the_emerald_desc: "For a neighbouring nation so close, you’d expect the relationship between us to be mutually chipper. Unfortunately the rift has only grown as of late, and sending in Rudd to smooth things over might be the only way to save relations."
ast_the_new_bear: "The New Bear"
ast_the_new_bear_desc: "The entire nature of Russia has changed in its post-Soviet years. The country has slowly accepted the ideology of capitalism, and allowed foreign interests under its fur coat. This could be our opportunity to plant our flag diplomatically, and arrange something that favors us, despite the distance between us."
ast_entente_with_north_korea: "Entente With Korea"
ast_entente_with_north_korea_desc: "Rudd has proposed a trip to the Korean Demilitarized zone to meet the North Korean leader in the hopes of bringing the two nations closer to peaceful coexistence. He’s perhaps reaching for the stars a bit, but the plan is sort of sound, and it’ll be the first overtures we’ve directly made with the North Koreans."
ast_foreign_minister_smith: "Foreign Minister Smith"
ast_foreign_minister_smith_desc: "Stephen Smith has been a prominent member of the party since Keating, and he was the first to offer his services to the foreign ministry. His policy aligns well enough with ours in that Smith wants Australia to emerge as the intersecting point of trade in the Pacific. Utilizing the new world as a growing point for our economic relevance abroad in any way that benefits the country."
ast_our_glowing_deposits: "Our Glowing Deposits"
ast_our_glowing_deposits_desc: "The deposits are there, we simply need to export them. Our current client has been badgering us for mineral rights for a while now, and it's only fair we offer up the goods."
ast_the_best_of_both_worlds: "The Best of Both Worlds"
ast_the_best_of_both_worlds_desc: "We navigate a complex balancing act, maintaining a deep security and defense alliance with the United States, while pursuing stabilized trade interdependence with China. Avoiding being forced to choose between the two is how we’ve managed to stay afloat."
ast_made_in_vietnam: "Made In Vietnam"
ast_made_in_vietnam_desc: " It was an odd feeling for many Australians when they looked down at the goods they always bought and suddenly saw the little text at the bottom telling them that it wasn’t made here, but instead some place called “Vietnam.” It wasn’t easy to swallow, but when their pockets were fuller and the stores had more variety, they quickly got over it."
ast_foreign_minister_carr: "Foreign Minister Carr"
ast_foreign_minister_carr_desc: "Bob Carr might be the biggest realist on our list, or at least the most pragmatic. At its core Carr believes that foreign policy is a series of improvisations. Australia is required to simultaneously juggle its pursuit to appeal as the moral centre in the Pacific, while at the same time not be afraid to dirty its hands in protecting our interests. How we balance that is the real test."
ast_smother_the_pot: "Stir the Pot"
ast_smother_the_pot_desc: "Australian interests have become so entangled in the middle east that anything happening over there affects us here. The last decade has turned a boiling pot of turmoil into a raging fire that we can’t afford to stay out of."
ast_the_big_boys_club: "The Big Boys Club"
ast_the_big_boys_club_desc: "There are 5 permanent seats in the United Nations Security Council, and about 15 non-permanent positions, cycled in and out every few years. Policy that affects the entire world is decided in the UN’s chambers between those countries. With our own responsibilities so heavily intertwined with the rest of the world, it’s only fair we get a seat at the table. We need to work on increasing our odds of getting in."
ast_global_weapon_trading: "Global Weapons Trading"
ast_global_weapon_trading_desc: "Carr is using our position in the UN to advocate heavily for a global arms trade treaty, aimed to track and reduce the supply of weapons to unfavorable states and terror groups, while making arms sales from ourselves and other western nations more appealing. It’s ballsy, but he’s currently rallying support in New York to get it through."
ast_myanmar_intervention: "Myanmar Intervention"
ast_myanmar_intervention_desc: "The collapse of Myanmar has turned into a humanitarian nightmare. Whatever choice we make to get involved is going to have its own consequences, just as much as staying out of it will."
ast_consuls_of_peace: "Consuls of Peace"
ast_consuls_of_peace_desc: "Australia’s destiny is firmly rooted in global cooperation. Our missions abroad and peacekeeping have invariably been with the goal of encouraging, and occasionally restoring, rules based order. It’s a role we strive at, and a reputation we ought to preserve."
ast_centurians_of_the_pacific: "Pacific Centurians"
ast_centurians_of_the_pacific_desc: "The rules of global intervention have changed since the turn of the new century. National security has taken the place of traditional civil liberties, and the framework for prevention has been adopted by almost every western country in the wake of fundamentalist attacks. We don’t make any new friends or protect this country by limiting ourselves to the rules of yesteryear, but we do make ourselves a target if we don’t react appropriately."
#costello
the_costello_government: "The Costello Government"
the_costello_government_desc: "Australia is over 100 years old now, and it’s come a long way since federation. With a population only a fraction of our neighboring nation’s, our economy is rapidly becoming one of the largest in the world in spite of that. Our people have seen the country around them grow richer and more prosperous than previous generations ever dreamed, and yet the real riches remain untapped. \n\nOur potential remains just below the surface, like an oil vein, waiting to be cracked open. Monetary management of the mines has ceased up, and many of our biggest industries have become complacent. Welfare has become a dead weight on our budget, and small businesses still fight an uphill battle to access an ever shrinking market. \n\nThe way of our governance has to change."
ast_a_bastion_for_commerce: "A Bastion for Commerce"
ast_a_bastion_for_commerce_desc: "As the nations connected by the pacific grow closer, the demand for a middle point for trade has become more apparent. Australia has the opportunity now to stand as a beacon for trade, linking various economies into one port, like Constantinople and Venice before it."
ast_bring_in_the_chains: "Bring in the Chains"
ast_bring_in_the_chains_desc: "We’ve benefited greatly from the import of cultures far and wide. Corporations harbor no exception to this. We already have a line out of the door of those petitioning to set up shop. I say we let them."
ast_domestic_demands: "Domestic Demands"
ast_domestic_demands_desc: "The opinion that we and the blue collar workers of our nation share is that local industry matters. A strong domestic industry should be able to weather any global economic downturn, and so, with a little care, it shall."
ast_outsource_the_troubles: "Outsource the Troubles"
ast_outsource_the_troubles_desc: "Workplace shortages have become our biggest barrier for continued growth in recent years. We simply don’t have enough workers to fill the gap, and any long term solution is going to let our best years for expansion slip by. We need to look overseas."
ast_come_one_come_all: "Come One Come All"
ast_come_one_come_all_desc: "Our money needs to stay within Australia, at least our wages do. The best way to plug the gap in our employment is to tend to the bottom line. Thousands want to try their hand working in Australia. All we have to do is open the door."
ast_off_with_tariffs: "Unburden the Market"
ast_off_with_tariffs_desc: "Liberal Economics has given birth to the concept of ‘abundance.’ The idea that freer markets and freer opportunity to spend your money inevitably result in a better off society. A tantalising concept that our businesses are eager to try out. The burdensome taxes that still remain must be stripped away."
ast_negotiate_with_the_rba_ast: "Negotiate with the RBA"
ast_negotiate_with_the_rba_ast_desc: "A little sweet talking with the Reserve Bank might get us the leeway we need to bring us an economic tide. Thankfully we have the connections needed to persuade the bank to lower the interest rates, and incentivise consumer spending in the meantime."
ast_fix_the_trade_woes: "Fix the Trade Woes"
ast_fix_the_trade_woes_desc: "While the import and export of goods through our nation has risen to enormous levels in a very short period of time, general confusion with our trade system has also grown among our businesses. Trade deficits and inefficient management are hampering our profit margins, and slowing the processes of commerce. The creation of a new agency will be required. One dedicated to smoothing the whole process out."
ast_adventure_in_the_usa: "Adventure in the USA"
ast_adventure_in_the_usa_desc: "America has always been, and may always be, our biggest investor. The land of the big mac, home of the free, and friend to all. We would be amiss if we didn’t go to them for the next step in our economic evolution."
ast_im_an_oil_man: "I'm an Oil Man"
ast_im_an_oil_man_desc: "It cries out that we should have our own oil development in this country. We have the wells, and we have the landscape for it. The process has simply taken too long, and by our government those bootstraps will be pulled up. More oil will flow."
ast_for_queen_and_company: "For Queen and Company"
ast_for_queen_and_company_desc: "Our overtures in the states have chummed the water enough to entice some English corporations into expanding their stake in our farming sector."
ast_rail_endeavors: "Rail Endeavors"
ast_rail_endeavors_desc: "We’ve worked alongside the Bechtel Corporation for our long distance rail lines before, now they and the state governments are looking to brochure a development research project together. They’ve already offered specs for new electric and diesel models. Now we just need to sign off on it."
ast_the_miracle_economy: "The Miracle Economy"
ast_the_miracle_economy_desc: "Already the media is referring to the success of our economy as being a miracle in these times. Of course, it’s not a miracle at all. Our success has always hinged on our judgement and care remaining sound. So, like a garden well maintained, the result of our management has bloomed into something spectacular."
ast_ride_the_bubble: "Ride the Bubble"
ast_ride_the_bubble_desc: "When the dot-com bubble hit a few years back it felt like the sky was literally falling upon us. Stock prices built up over billions in investing in computing were suddenly popping, and billions more were lost with it. This time around we’re making sure the ground is firm for computing investments, with infrastructure to support the growth and the lightest regulation needed to keep the system from crashing again."
ast_silicon_dreams: "Silicon Dreams"
ast_silicon_dreams_desc: "The ambition of one day becoming a technologically independent nation begins with our ability to manufacture commercial chips. Starting off small scale, we can dispense funding to chip research groups, and allow a test run facility in Victoria to kick things off."
ast_jobs_for_the_needy: "Jobs for the Needy"
ast_jobs_for_the_needy_desc: "The oversight of enacting Work For the Dole is something we’re still paying the price for now. Workers should never have been taken away from private industries to be used for public works. The whole point of welfare should be to get those who can work, into work. A new program will need to take its place."
ast_keep_it_competitive: "Keep it Competitive"
ast_keep_it_competitive_desc: "The more we grow industrially, the higher the risk of a slanted market. Monopolies can develop into scourges if we let them, and the sad fact is that regulation is the nearest thing to a sure defense in the battle against them. We can work on a state level to coordinate the policy and go from there."
ast_shatter_the_iron_curtain: "Shatter the Iron Curtain"
ast_shatter_the_iron_curtain_desc: "The cold war ended for Australia when we shook hands with Mao in 73’. We’ve enjoyed a friendship that’s lasted any party partisanship or global crisis since. A forum will need to be created to ensure the future of our collaborations remain secure and above board."
ast_our_man_in_beijing: "Our Man in Beijing"
ast_our_man_in_beijing_desc: "Alexander Downer, our long time foreign minister and now deputy, has become close enough with the Chinese government and its business class that some in our own party have questioned where his loyalties lie. Regardless, we’ll need his insight to get anything meaningful out of our new partnership. Starting with the next flight to Beijing."
ast_the_lithium_projects: "Greenbushe Projects"
ast_the_lithium_projects_desc: "Greenbushe’s Lithium Projects have become a promising development for our Western Australian communities. Aiming to produce 1 million tonnes annually of lithium by the project's end, making us one of the world's biggest processed lithium exporters by then. All they need now is a little fiscal push."
ast_cater_to_investors: "Cater to Investors"
ast_cater_to_investors_desc: "Chinese developers make up over 60 percent of our foreign-based landowners. That sort of investment is beginning to make up the backbone of our land development industry, and keeping their interests aligned is needed to keep that relationship going smoothly."
ast_the_future_fund: "The Future Fund"
ast_the_future_fund_desc: "The initial idea for the fund was to help cover our public servant’s superannuations, but the concept could very well be used to power our nation’s foreign investments. Already it’s brought in a surprising amount from overseas investors, in particular the Belgium-based group Euroclear, and it’s time to put it into action."
ast_a_friendly_union: "A More Friendly Union"
ast_a_friendly_union_desc: "One union that hasn’t been barking up our back is the European kind. Gains have been made to organise cutting the limitations on European car sales in our country, at least for the next few years. A visit to the EU headquarters might kick things into gear for us, and give our consumers some fancy new options."
ast_fechado: "Fechado!"
ast_fechado_desc: "The growing prosperity of Brazil’s mining economy hasn’t been missed by our mining industrialists, who have petitioned us to ease up on import regulations for mining equipment. It would do little in the way of costing us anything, and bring us closer to our buddies in the G20."
ast_the_republic_question: "The Republic Question"
ast_the_republic_question_desc: "Since our federation, Australia has remained the de facto subject of the English crown. Our constitution is a monarchical one, and our head of state is still that of the United Kingdoms. While it worked for a period, the temper of the times is democratic. We don’t appoint people to office by heredity. In our society and our time we prefer appointments by merit. \n\nAustralia have it's day as a truly independent nation. "
ast_how_we_sell_it: "How We Sell It"
ast_how_we_sell_it_desc: "Getting the popular support for our referendum is going to be the final hurdle in the race. A national majority of all voters, and support from 4 out of 6 of our states and territories will be needed. An impossible feat if we don’t win the hearts and minds of the public. We need to fire up the media machines and start rallying support in person."
ast_send_it_through: "Send It Through"
ast_send_it_through_desc: "After the failure of the 1999 referendum, the topic of a republic has soured with most of parliament like a bad luck omen. We’re at a significant disadvantage compared to last time. We may need to twist some wrists to get it rolling."
ast_our_commonwealth: "Our Commonwealth"
ast_our_commonwealth_desc: "We can’t throw out almost two centuries of history and kinship into the wind. Especially during a transitionary period like this. Reaffirming our commitment to the Commonwealth might ease the concerns of some of the royalists still on the fence."
ast_free_from_binds: "Free From Binds"
ast_free_from_binds_desc: "Our departure from the monarchy can’t be half measured. Our ties to the crown need to be cut, and with it the soft blanket that kept us comfortable all these years. The change we need is the one that leaves the cuts and bruises after we break through the glass ceiling. It won’t be easy."
ast_run_the_games: "Run the Games"
ast_run_the_games_desc: "Every four years our athletics suit up to compete in the Commonwealth Games, a multi-sport spectacle not that dissimilar to the Olympic Games, assembling those across the world within the Commonwealth of Nations. The timing might be just right for us to petition to host the upcoming games."
ast_kowtow_to_the_crown: "Kowtow to the Crown"
ast_kowtow_to_the_crown_desc: "Receiving an official blessing from the monarchy will finally put a pin in the opposition faction, albeit at the cost of alienating a few of our own republicans, but when the votes start to come through they’ll hardly remain critical."
ast_crossing_the_floor: "Crossing the Floor"
ast_crossing_the_floor_desc: "The Labor-heads are going to be laughing their way to the bank when they hear we need them for the vote. It won’t be easy to humble them, and no doubt they’ll make their demands, but the way ahead is forward. Whether we want it or not, they’re our new allies for the time being."
ast_approaching_the_governor: "Approaching the Governor"
ast_approaching_the_governor_desc: "The last step of the process. The situation is slightly awkward, given the nature of handing the Governor General their own resignation. We can only hope they take it well."
ast_a_shining_example: "A Shining Example"
ast_a_shining_example_desc: "We need to stand as the example of successful democracy for the Pacific nations. Our success in this great task will stand as a testament to those not just in the region, but far and wide. Even in our country’s age we can throw off the shackles of control."
ast_no_kings: "No Kings"
ast_no_kings_desc: "The mechanisms of our new constitution need to reflect the realities of modern political shifts. No system can be immune to its undoing, but they can be made resilient. The powers will be separated and there will be oversight, with third party safeguards to ensure authoritarian and reactionary ideas are put in check."
ast_endow_the_arts: "Endow the Arts"
ast_endow_the_arts_desc: "Freedom of expression is one of the staples of democracy, and has been since the Eureka Stockade. Frankly any investment into the arts is typically a waste, but if there’s anything we need to be seen as sensitive towards right now, it’s the culture."
ast_hold_onto_the_wild: "Hold Onto the Wild"
ast_hold_onto_the_wild_desc: "In an effort to encourage more forestry in the suburbs, landowners who choose to set aside part or all of their land for conservation in perpetuity will be granted a lower tax liability as part of the Capital Gains Tax. Meanwhile we can ensure that national parks protections are codified in our new constitution. Keeping them safe for decades to come."
ast_a_generation_to_persevere: "A Generation to Persevere"
ast_a_generation_to_persevere_desc: "The future of our nation is entirely in the hands of the generations after us. Attending to them and ensuring that they’re given the sufficient knowledge to thrive is tantamount to ensuring our way of life prevails. Education must become a constitutional right, endowed by our commonwealth."
ast_enshrine_the_protections: "Enshrine the Protections"
ast_enshrine_the_protections_desc: "The next step in modifying our constitution should be a momentous one. Not just in the systems of governance, but for our citizens too. Our most vulnerable shouldn’t have their level of rights determined by whoever sits in the biggest chair in Canberra. They need to be enshrined in the constitution, and made permanent for the foreseeable future. \n\nAustralia is not a country where the few are protected, but where everyone is. Full stop."
ast_modernize_the_communities: "Modernize the Communities"
ast_modernize_the_communities_desc: "We have a number of programs in the pipeline aimed at funneling more contracts towards our lower income communities, intended to bring more work to those without, and improve the image of smaller, struggling towns."
ast_with_heritage_to_remember: "With Heritage to Remember"
ast_with_heritage_to_remember_desc: "The journey of reconciliation is in many ways reaching its next phase. The hand of support will need to reach out again, but this time to bestow itself. \n\nAmending the constitution to allow local traditional owners to be able to negotiate formal treaties relating to preservation and land sovereignty, along with development approval rights, hands over the reins of reconciliation to the community. Giving local communities the right to their own future, and the capability to safeguard their past."
ast_one_last_push: "One Last Push"
ast_one_last_push_desc: "We have the mandate. The votes are being counted. We can only hope that history is on our side this time."
ast_a_new_constitution: "A New Constitution"
ast_a_new_constitution_desc: "The next era of Australian governance lies ahead. The step we make now, boisterous, maybe even a little foolhearty, sets the stage for the history books. Upon this rock we are building the future of the nation, our new constitution."
ast_the_mining_snag: "The Mining Snag"
ast_the_mining_snag_desc: "Truly the mining industry has been treated shabbily more than a few times in recent years, albeit we can’t ignore the sins of the sector. An understanding needs to be made between us, between the needs of the government, and the rights of the industrialists. A truce will be brokered."
ast_a_little_of_this: "A Little of This"
ast_a_little_of_this_desc: "A few big companies with stakes in the mines are also invested in the logging industry. An industry which after years of pushback by environmental groups has stripped it of its earnings. Opening up some of the state forests for harvest and dropping a regulation or too can win us some of the favor we need."
ast_formal_investigation: "Formal Investigation"
ast_formal_investigation_desc: "Systemic coercion and pork-barrelling are the more commonplace result of the mining industry becoming far too politicised. We can’t eliminate all of the rot, but we can shake things up with a formal commission into the mines, aimed at uncovering some of the more overt corruption on the surface."
ast_for_a_bit_of_that: "For a Bit of That"
ast_for_a_bit_of_that_desc: "Every complaint from the mines is usually over overbearing regulation. They lobby against it, their media campaigns oppose it. They’ve been practically at our door banging to remove them. While they’re at it, offering them a temporary rollback might open their minds to reform."
ast_training_the_next_miners: "Training the Next Miners"
ast_training_the_next_miners_desc: "The vocational education at TAFE should provide us the fastest measure to train up new recruits for the industry, with little cost to them, and even a little incentive for those who choose it."
ast_when_opportunity_calls: "When Opportunity Calls"
ast_when_opportunity_calls_desc: "The foreign office has come back from the middle east with an offer directly from the House of Saud with an interesting collaboration in our mining endeavors. This marks the first interaction we’ve had with them on the topic, and whatever they have in mind could be too lucrative to pass up."
ast_tussle_with_the_media: "Tussle with the Media"
ast_tussle_with_the_media_desc: "We can’t let the mining corps have all the say. Even with the Murdoch Media against us, we can still get our word in with the press and expose some of our discoveries on national TV."
ast_war_with_the_party: "War with the Party"
ast_war_with_the_party_desc: "With the current strength of the campaign against us, some of the party members are beginning to scatter. Either joining the media in shunning our government or trying to distance themselves from us. We need to go on the offensive. Round up the deserters and isolate the loudmouths from the media. Make them aware that we’re still in charge."
ast_no_gas_all_breaks: "No Gas All Breaks"
ast_no_gas_all_breaks_desc: "We need to break with the party tradition of patronage to the mines. Opportunities in our renewable sector are evolving and improving every day. Iberdrola has a series of successful plants in Victoria currently. With some government funding and approval they’ll be setting up shop across the nation."
ast_the_processing_debacle: "The Processing Debacle"
ast_the_processing_debacle_desc: "As a result of our findings, a great deal of weight has been placed on us to find a solution for these immigrants. It won’t be an easy choice, but for us it rarely is."
ast_bowen_expansion: "Bowen Expansion"
ast_bowen_expansion_desc: "BHP have made a request for an express approval of their new pipeline in the Queensland, Bowen Basin. Built to massively speed up their steel production there. A bit of kickback has come up from environmental groups regarding the route going through Koala habitats, but the project reps have assured us the damage will be minimal."
ast_fortescue_lines: "Fortescue Lines"
ast_fortescue_lines_desc: " Our largest mining hub for iron ore is situated in Western Australia and handled by the Fortescue company. They’ve invited us to jointly invest in their Magnetite project, delivering higher volumes of ore with lower emissions. In this case it might take some of the heat off us if we’re appealing to both the mines and the environmentalists."
ast_secure_resource_tax: "Secure Resource Tax"
ast_secure_resource_tax_desc: "Finally our first comprehensive resource rent tax aimed at tackling some of the taxation inefficiencies during the mining boom. With provisions to ensure that our smaller businesses and mines aren’t hindered, a new revenue stream will flow into our budget without affecting productivity."
ast_an_open_ear: "An Open Ear"
ast_an_open_ear_desc: "Climate restrictions by our predecessors have thrown the whole industry out of whack with how limiting they’ve become. How can we even hope to compete when the nations around are paying little of the cost. A softer hand of regulation needs to be enacted, and a reprieve from the current restrictions will be put in place until we find something sensible."
ast_olympic_dam_developments: "Olympic Dam Developments"
ast_olympic_dam_developments_desc: "The Western Mining Corporation has approached us with a joint-research endeavor, utilising the uranium mine at Olympic Dam. We’ve also received very loud protests of the mine, from inside and outside of Parliament, regarding its effects on the local community. Any expansion of the mine and the facilities there is going to result in some backlash, but it’s hardly something we can’t weather."
ast_changing_the_system: "Changing the System"
ast_changing_the_system_desc: "We’ve come far with our handling of the industry. Profits are now coming through cleaner and in greater volume than ever. Still much can be done to improve the nature of it, but for now we can look back and admire the work."