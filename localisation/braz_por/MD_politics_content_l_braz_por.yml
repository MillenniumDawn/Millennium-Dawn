l_braz_por:
 MD4_election_campaign.0.t: "Campanha eleitoral se intensifica conforme a corrida entra nas duas últimas semanas"
 MD4_election_campaign.0.d: "Desde a última eleição em [Root.GetLastElection], [Root.GetLeader] vem guiando constantemente [Root.GetName]. Com os votos finais a serem lançados em duas semanas, essa direção será desafiada por rivais poderosos.\n\nA maior parte dos gastos com publicidade da campanha já ocorreu e as pesquisas estão começando a refletir os efeitos."
 MD4_election_campaign.0.a: "Vamos lá!"
 MD4_election_campaign.1.t: "Debate de Política Externa: [Root.GetLeader] enfrenta decisões difíceis sobre quem atacar"
 MD4_election_campaign.1.d: "À medida que a votação final se aproxima, temos que decidir com quem contrastar nossa política externa. À medida que o mundo se torna um lugar cada vez mais tumultuado, essa questão se tornou particularmente importante para os eleitores.\n\nAlguns anúncios negativos contundentes certamente farão a popularidade do nosso oponente cair, mas há uma pequena chance de que eles possam combater isso com sucesso se tiverem alguma sujeira séria sobre nós ou se nossos ataques forem baseados em pesquisas muito ruins.\n\nA eficácia do ataque é determinada pela quantidade de financiamento de campanha que recebemos."
 MD4_election_campaign.1.a: "Ataque os lunáticos do [Root.GetFascistParty]"
 MD4_election_campaign.1.b: "Ataque os idiotas Nacionalistas"
 MD4_election_campaign.1.c: "Ataque os tolos do [Root.GetNeutralParty]"
 MD4_election_campaign.1.e: "Ataque os imbecis do [Root.GetCommunistParty]"
 MD4_election_campaign.1.f: "Ataque os idiotas do [Root.GetDemocraticParty]"
 MD4_election_campaign.1.g: "Abstenha-se de atacar qualquer um"
 MD4_election_campaign.3.t: "[Root.GetFascistParty] se recupera - fortalecidos após os ataques"
 MD4_election_campaign.3.d: "Apesar dos nossos ataques ferrenhos contra eles, o controverso [Root.GetFascistParty] conseguiu manter todos os seus seguidores principais. Eles usaram a atenção aumentada de nossos anúncios negativos a seu favor, ganhando acesso sem precedentes a todos os principais veículos de notícias para promover sua ideologia."
 MD4_election_campaign.3.a: "Maldição"
 MD4_election_campaign.4.t: "Ataques negativos contra os nacionalistas saem pela culatra"
 MD4_election_campaign.4.d: "Apesar de nossos ataques ferrenhos contra eles, os nacionalistas controversos conseguiram manter a maioria de seus seguidores principais. Eles marcaram pontos importantes em todo o país, afirmando que o sistema está quebrado e corrompido, que a mídia tradicional está manipulando a sociedade e que as políticas de [Root.GetLeader] estão à venda para o maior licitante por meio de contribuições de campanha."
 MD4_election_campaign.4.a: "Maldição"
 MD4_election_campaign.5.t: "Ataques negativos contra o [Root.GetNeutralParty] não têm impacto"
 MD4_election_campaign.5.d: "Despite our best efforts, the tide of public opinion has shifted against our negative ad campaign targeting the [Root.GetNeutralParty]. There are likely several causes but one factor may be the perception that an attack from a politician of [Root.GetLeader]'s stature is an example of \"punching down\" and that the increased media coverage of our opponent enabled them to reach out to more voters."
 MD4_election_campaign.5.a: "Maldição"
 MD4_election_campaign.6.t: "Ataques negativos contra o [Root.GetCommunistParty] caem em ouvidos surdos"
 MD4_election_campaign.6.d: "Despite our best efforts, the tide of public opinion has shifted against our negative ad campaign targeting the [Root.GetCommunistParty]. There are likely several causes but one factor may be the perception that an attack from a politician of [Root.GetLeader]'s stature is an example of \"punching down\" and that the increased media coverage of our opponent enabled them to reach out to more voters."
 MD4_election_campaign.6.a: "Maldição"
 MD4_election_campaign.7.t: "Ataques negativos contra o [Root.GetDemocraticParty] saem pela culatra"
 MD4_election_campaign.7.d: "Apesar de nossos melhores esforços, a maré da opinião pública mudou contra nossa campanha de anúncios negativos direcionados ao [Root.GetDemocraticParty]. Embora tenhamos culpado publicamente a interferência estrangeira, por trás das portas fechadas a verdadeira suspeita é que nossos ataques foram tão exagerados que apenas algumas pessoas sequer acreditaram neles desde o início."
 MD4_election_campaign.7.a: "Maldição"
 MD4_election_campaign.8.t: "Convidar um palestrante controverso para a campanha?"
 MD4_election_campaign.8.d: "Normalmente, isso nem seria sugerido em voz alta - muito menos considerado seriamente. Mas devido à baixa taxa de aprovação de [Root.GetLeader], pode ser um risco que vale a pena; O palestrante é um membro marginal de nosso partido, conhecido por fazer várias declarações controversas no passado e falar em momentos inoportunos. No entanto, eles são muito populares entre estudantes e jovens - um grupo-chave que precisamos convencer a votar em nosso favor."
 MD4_election_campaign.8.a: "Convide-os e espere pelo melhor"
 MD4_election_campaign.8.b: "Não arrisque"
 MD4_election_campaign.9.t: "Grande comparecimento a comício reanima o entusiasmo por [Root.GetLeader]"
 MD4_election_campaign.9.d: "O comício foi um grande sucesso, atraindo o maior comparecimento de público de toda a temporada de campanha. Não apenas o palestrante controverso elogiou [Root.GetLeader] e pregou a unidade do partido; foi feito de maneira tão entusiástica e convincente que ninguém suspeitou que na verdade a equipe de [Root.GetLeader] tinha escrito os discursos na íntegra."
 MD4_election_campaign.9.a: "Um impulso muito necessário para a campanha"
 MD4_election_campaign.10.t: "Desastre para a Campanha de [Root.GetLeader]"
 MD4_election_campaign.10.d: "With the largest audience turnout of the campaign season, the stage was set for [Root.GetLeader] to shine. Unfortunately, the controversial co-speaker who was invited to whip up enthusiasm, proceeded to tear up the speech we had prepared, and instead went off on a long tirade about the \"failures of all administrations, including this one\" and then appealed to young people to \"vote with their heart, or stay home\".\n\nNeedless to say, this soundbite was subsequently plastered across the media - with our opponents watching on gleefully."
 MD4_election_campaign.10.a: "Que fracasso!"
 election_coalition_won.0.t: "Eleições [Root.GetAdjective]: Coalizão Governista conquista maioria!"
 election_coalition_won.0.d: "Os partidos governistas atuais conquistaram maioria no novo parlamento e podem estender seu mandato para governar juntos."
 election_coalition_won.0.a: "Continuar com o governo atual"
 election_coalition_won.0.b: "Fazer mudanças na formação de um novo governo"
 election_single_party.0.t: "Eleições [Root.GetAdjective]: [Root.GetRulingParty] conquista maioria!"
 election_single_party.0.d: "[Root.GetRulingParty] conquistou sozinho a maioria dos assentos parlamentares. Que grande vitória!"
 election_single_party.0.a: "Que grande dia para a democracia!"
 election_single_party.1.t: "Eleições [Root.GetAdjective]: [Root.GetLeader] derrotado!"
 election_single_party.1.d: "With [show_biggest_party_elect] single-handedly winning a majority of parliamentary seats, [Root.GetLeader]'s political future is essentially over, with [Root.GetRulingParty] members calling for their resignation.\n\n[show_biggest_party_elect] will immediately take over as the new government of [Root.GetName]."
 election_single_party.1.a: "Conceda a derrota e parabenize o vencedor."
 MD4_election.1.t: "[Root.GetRulingParty] Reeleito!"
 MD4_election.1.d: "Com todos os votos contados, os eleitores [Root.GetAdjective] decidiram dar a [Root.GetLeader] mais um mandato. Com altas taxas de aprovação no trabalho, [Root.GetLeader] venceu sem precisar fazer acordos com outros partidos para garantir seu apoio."
 MD4_election.1.d_term_ended: "With all the votes counted, the [Root.GetAdjective] voters have decided to give [Root.GetLeader]'s party another term. However, as [Root.GetLeader] has reached the end of their final term, they will give way for a new leader."
 MD4_election.1.a: "É verdade o que dizem - [Root.GetLeader] realmente é o melhor!"
 MD4_election.2.t: "[Root.GetLeader]'s Coalition Reeleito!"
 MD4_election.2.d: "Com todos os votos contados, os eleitores [Root.GetAdjective] decidiram dar a [Root.GetLeader] e [Root.GetRulingParty] outro mandato. Os partidos governantes atuais conquistaram a maioria no novo parlamento e podem estender seu mandato para governar juntos. [Root.GetLeader] continua a contar com seu apoio como líder de [Root.GetNameWithFlag]."
 MD4_election.2.d_term_ended: "Com todos os votos contados, os eleitores [Root.GetAdjective] decidiram dar a [Root.GetRulingParty] outro mandato. Os partidos governantes atuais conquistaram a maioria no novo parlamento e podem estender seu mandato para governar juntos. Como [Root.GetLeader] chegou ao final de seu último mandato, um novo líder assumirá a tarefa de governar [Root.GetNameWithFlag]."
 MD4_election.2.a: "É verdade o que dizem - [Root.GetLeader] realmente é o melhor!"
 MD4_election.2.b: "Faça mudanças na formação de um novo governo"
 MD4_election.3.t: "Derrota nas eleições para [Root.GetLeader]!"
 MD4_election.3.d: "With all the votes counted, [Root.GetLeader] seems unable to secure support from the [Root.GetAdjective] voters for another term in office. Instead it was [show_biggest_party_elect]'s time to shine. With ([?party_pop_elect_array^max_index_1|%1]) they have single-handedly gathered enough support to rule alone.\n\n Control of [Root.GetName] will pass to [show_biggest_party_elect]."
 MD4_election.3.a: "Conceda a derrota e parabenize o vencedor"
 MD4_election.4.t: "Eleições: Resultado inconclusivo para [Root.GetLeader]!"
 MD4_election.4.d: "Com todos os votos contados, [Root.GetLeader] atualmente não tem maioria no novo parlamento para formar um novo governo. Outros partidos devem ser convencidos a se juntar e, se isso se provar impossível, o controle deve ser entregue a um dos outros partidos para permitir que eles tentem formar um governo."
 MD4_election.4.a: "As negociações começam..."
 MD4_election.5.t: "Eleições: Derrota embaraçosa para [Root.GetLeader]!"
 MD4_election.5.d: "With all the votes counted, [Root.GetLeader] did not even manage to reach the minimum threshold for [Root.GetRulingParty] to enter parliament. It's clear someone else will have to form a government to lead [Root.GetName] forward, but who?"
 MD4_election.5.a: "[show_biggest_party_elect] ([?party_pop_elect_array^max_index_1|%1]) will try"
 MD4_election.5.b: "[show_second_biggest_party_elect] ([?party_pop_elect_array^max_index_2|%1]) will try"
 News_MD4_election.0.t: "Eleição [From.GetAdjective]: [From.GetRulingParty] Reeleito!"
 News_MD4_election.0.d: "[From.GetLeader] do [From.GetRulingParty] ([From.GetRulingIdeology]) derrotou todos os concorrentes e continuará por mais um mandato como líder do(a) [From.GetName]."
 News_MD4_election.0.d_first_term: "[From.GetLeader] do [From.GetRulingParty] ([From.GetRulingIdeology]) derrotou todos os concorrentes e assumirá o cargo de seu antecessor para seu primeiro mandato como líder do(a) [From.GetName]."
 News_MD4_election.0.a: "Ok"
 News_MD4_election.1.t: "Eleição [From.GetAdjective]: [From.GetLeader] forma novo governo!"
 News_MD4_election.1.d: "[From.GetLeader] do [From.GetRulingParty] ([From.GetRulingIdeology]) saiu vitorioso nas eleições e, com o apoio de outros partidos no governo, agora está encarregado de liderar [From.GetName] adiante."
 News_MD4_election.1.a: "Ok"
 News_MD4_election.2.t: "Eleição [From.GetAdjective]: [From.GetLeader] vence grande surpresa!"
 News_MD4_election.2.d: "[From.GetLeader] do [From.GetRulingParty] ([From.GetRulingIdeology]) alcançou o aparentemente impossível - derrotar o governo vigente sozinho. Formando um governo majoritário por conta própria, [From.GetLeader] saiu vitorioso na eleição e agora está encarregado de liderar [From.GetName] adiante."
 News_MD4_election.2.a: "Ok"
 coalition_complete.0.t: "Governo Formado!"
 coalition_complete.0.d: "Since the elections held on [Root.GetLastElection], [Root.GetLeader] of [Root.GetRulingParty] has been skillfully negotiating a new majority government. Today, [GetDateText], after a period of intense media speculation, its composition was finally announced at a press-conference. This represents a major milestone for [Root.GetName] as a new political era dawns."
 coalition_complete.0.a: "Ótimas notícias"
 coalition_pass.0.t: "[Root.GetRulingParty] Desiste de Formar Governo?"
 coalition_pass.0.d: "Os conselheiros políticos de [Root.GetLeader] estão correndo de um lado para o outro como galinhas sem cabeça - tentando desesperadamente encontrar uma solução para a crise do fracasso do [Root.GetRulingParty] em formar um governo, sabendo muito bem que a maioria deles ficará sem emprego se [Root.GetLeader] for destituído do cargo.\n\nEnquanto isso, na sede do [show_biggest_party_elect], a empolgação está aumentando, pois finalmente veem um caminho claro para assumir o governo de [Root.GetName]."
 coalition_pass.0.a: "Give up: Let [show_biggest_party_elect] ([?party_pop_elect_array^max_index_1|%1]) try"
 coalition_pass.0.b: "Notícia Falsa! Vamos encontrar os aliados necessários."
 coalition_pass.1.t: "[Root.GetRulingParty] Desiste de Formar Governo?"
 coalition_pass.1.d: "Os conselheiros políticos de [Root.GetLeader] estão correndo de um lado para o outro como galinhas sem cabeça - tentando desesperadamente encontrar uma solução para a crise do fracasso do [Root.GetRulingParty] em formar um governo, sabendo muito bem que a maioria deles ficará sem emprego se [Root.GetLeader] for destituído do cargo.\n\nEnquanto isso, na sede do [show_second_biggest_party_elect], a empolgação está aumentando, pois finalmente veem um caminho claro para assumir o governo de [Root.GetName]."
 coalition_pass.1.a: "Give up: Let [show_second_biggest_party_elect] ([?party_pop_elect_array^max_index_2|%1]) try"
 coalition_pass.1.b: "Notícia Falsa! Vamos encontrar os aliados necessários."
 coalition_pass_dismantle_tt: "Remover Partido no Poder: §H[Root.GetRulingParty]§!\n§HCoalizão de Governo§! será desmontada\n\n"
 coalition_pass_refund_tt: "Poder Político: §G+75%§! do montante gasto na Coalizão\n"
 coalition_pass_pol_change_0_tt: "A política mudará:\n§H[show_biggest_party_elect]§! se tornará o Partido no Poder\n\n"
 coalition_pass_pol_change_1_tt: "A política mudará:\n§H[show_second_biggest_party_elect]§! se tornará o Partido no Poder\n\n"
 coalition.0.t: "Negociações com [Western_Autocracy_L] ([?party_pop_elect_array^0|%0])"
 coalition.0.d: "Vemos que [Root.GetLeader] está adotando o estilo autoritário! Claro que gostaríamos de entrar no governo. Isso é, se você estiver disposto a pagar o preço político."
 coalition.0.a: "Seja bem-vindo à equipe!"
 coalition.0.b: "Pensando melhor, talvez não os incluamos."
 coalition.1.t: "Negociações com [conservatism_L] ([?party_pop_elect_array^1|%0])"
 coalition.1.d: "Respeitado [Root.GetLeader]. Podemos imaginar um futuro em que, possivelmente, compartilhamos um certo nível de cooperação na administração do governo. Embora, respeitosamente, acreditamos que você deveria adotar todas as nossas políticas, reconhecemos que, com os resultados eleitorais não totalmente a nosso favor, devemos negociar o melhor acordo possível para nossos eleitores. Nossas exigências são simples - um compromisso com a defesa de valores tradicionais, pragmatismo, respeito pela autoridade e valores religiosos, e a preservação das instituições sociais tradicionais.\n\nSe você aceitar nossa cooperação, esperamos sinceramente que você não manche o bom nome do [conservatism_L] com políticas tolas e precipitadas e um chamado pensamento moderno. Para minimizar esse risco, consulte o documento anexado listando os departamentos que desejamos administrar integralmente."
 coalition.1.a: "Seja bem-vindo à equipe!"
 coalition.1.b: "Pensando melhor, vocês conservadores são muito entediantes para nós."
 coalition.2.t: "Negociações com [liberalism_L] ([?party_pop_elect_array^2|%0])"
 coalition.2.d: "Caro [Root.GetLeader]. Você nos lisonjeia com seu interesse declarado nos grandes princípios do liberalismo e da liberdade. A liberdade é, afinal, a base sobre a qual qualquer governo honesto é construído. Claro, gostaríamos de participar do governo para promover o liberalismo - porque ambos entendemos que a liberdade individual e o governo limitado são a melhor maneira para os humanos formarem uma sociedade livre.\n\nPara garantir que sua forma de liberalismo seja tão irrestrita quanto a nossa, no entanto, você precisará concordar com nossas demandas completamente razoáveis ​​e inquestionavelmente mutuamente benéficas antes que possamos nos comprometer com um acordo final."
 coalition.2.a: "Seja bem-vindo à equipe!"
 coalition.2.b: "Nós gentilmente declinamos."
 coalition.3.t: "Negociações com [socialism_L] ([?party_pop_elect_array^3|%0])"
 coalition.3.d: "Dear [Root.GetLeader]. While we are reluctant to enter any government as junior partners, the Unions have been unable to get us over the finish line in the elections - this time. So there is a possibility we could entertain the notion of joining - if you pledge to promote the vital principles of progressive and social democratic values. As we say in [socialism_L], social democratic values are for everyone, and we insist this holds true for your government.\n\nBy the way, aren't the taxes a bit low? Are you sure we have enough funding for the increases in social welfare, education, and healthcare we have planned?"
 coalition.3.a: "Seja bem-vindo à equipe!"
 coalition.3.b: "Nós gentilmente declinamos."
 coalition.4.t: "Negotiations with [communist_state_L] ([?party_pop_elect_array^4|%0])"
 coalition.4.d: "Camarada [Root.GetLeader]! Embora busquemos derrubar seu governo imperialista-burguês, mudar a sociedade por meio de uma luta armada revolucionária, estabelecer a ditadura democrática do proletariado e eliminar os traidores de classe, percebemos que pode haver certas vantagens táticas políticas de curto prazo em formar uma coalizão neste momento.\n\nNossas exigências são simples - implementação completa do materialismo dialético marxista, melhoria de 1000% nas condições socioeconômicas do proletariado oprimido e entrada gratuita no novo parque Disneyland que vamos construir!\n\n...Vamos nos contentar com essas concessões menores que você mencionou."
 coalition.4.a: "Seja bem-vindo à equipe!"
 coalition.4.b: "Melhor morto do que vermelho!"
 coalition.5.t: "Negociações com [anarchist_communism_L] ([?party_pop_elect_array^5|%0])"
 coalition.5.d: "Comrade [Root.GetLeader]. We think we would move your administration in the right direction - the leftist one. Some call us \"Left-Wing Radicals\", but the real radicals are the conservative backward anti-progressive forces who put all power in the hands of the 1% richest. We just fight for common sense things that the whole 99% can agree on - like social justice, feminism, ending welfare profiteers, dismantling capitalism, internationalism, and the end of western imperialist dominance, and its exploitation of the Global South."
 coalition.5.a: "Juntos somos mais fortes!"
 coalition.5.b: "Estamos tendo segundos pensamentos."
 coalition.6.t: "Negociações com [Conservative_L] ([?party_pop_elect_array^6|%0])"
 coalition.6.d: ""
 coalition.6.a: "Seja bem-vindo à equipe!"
 coalition.6.b: "Nós gentilmente declinamos."
 coalition.7.t: "Negociações com [Autocracy_L] ([?party_pop_elect_array^7|%0])"
 coalition.7.d: "Prezado [Root.GetLeader]. Embora apreciemos o miópe, fraco, fracturado festival de ignorância do eleitorado, reclamações, brigas, desperdício, compromissos e hesitação que você chama de campanha eleitoral, reconhecemos o verdadeiro poder que você agora acumulou. Junte-se a nós e poderemos nos livrar das correntes da restrição legislativa e executiva e demonstrar nossa força compartilhada, disciplina, autoridade e unidade."
 coalition.7.a: "Seja bem-vindo à equipe!"
 coalition.7.b: "Nós gentilmente declinamos."
 coalition.8.t: "Negociações com [Mod_Vilayat_e_Faqih_L] ([?party_pop_elect_array^8|%0])"
 coalition.8.d: "Respeitado [Root.GetLeader]. Nós, os xiitas de Ali ibn Abi Talib, estamos prontos para dar as mãos e nos juntar a você para resistir bravamente aos sionistas e seus filhos do inferno takfiri. Juntos, com inspiração dos santos mártires, expulsaremos os inimigos do Verdadeiro Islã da face da terra. Nós, as espadas de Alá, certamente olharemos para Sayyid Khamenei e Sayyid Hassan Nasrallah em busca de orientação, mas não tema, pois somos verdadeiros patriotas [Root.GetAdjective] que sangrarão para preservar nossa terra sagrada, se necessário. Nós mencionamos que nos consideramos moderados?"
 coalition.8.a: "Morte aos sionistas!"
 coalition.8.b: "Prefiro ser torturado."
 coalition.9.t: "Negociações com [Vilayat_e_Faqih_L] ([?party_pop_elect_array^9|%0])"
 coalition.9.d: "Respeitado [Root.GetLeader]. Nós, os xiitas de Ali ibn Abi Talib, estamos prontos para dar as mãos e nos juntar a você para resistir bravamente aos sionistas e seus filhos do inferno takfiri. Juntos, com inspiração dos santos mártires, expulsaremos os inimigos do Verdadeiro Islã da face da terra. Nós, as espadas de Alá, certamente olharemos para Sayyid Khamenei e Sayyid Hassan Nasrallah em busca de orientação, mas não tema, pois somos verdadeiros patriotas [Root.GetAdjective] que sangrarão para preservar nossa terra sagrada, se necessário."
 coalition.9.a: "Morte aos sionistas!"
 coalition.9.b: "Prefiro ser torturado."
 coalition.10.t: "Negociações com [Kingdom_L] ([?party_pop_elect_array^10|%0])"
 coalition.10.d: ""
 coalition.10.a: "Seja bem-vindo à equipe!"
 coalition.10.b: "Nós gentilmente declinamos."
 coalition.11.t: "Negociações com [Caliphate_L] ([?party_pop_elect_array^11|%0])"
 coalition.11.d: "[Root.GetLeader], though we have called you a \"filthy infidel dog\" many times, we didn't really mean anything bad about it.\n\nWhile inshallah you are for sure going to hell for not joining the True Caliphate, we, the just and brave Mujahid, can surely help rightly guide you, as only we know the true will of Allah, as revealed to us by the Prophet Muhammad (ṣallā llahu ʿalayhi wa-sallam). We are, of course, very, very peaceful, and committed to democratic principles. We don't have any demands. We are just here to help. We can, inshallah, for instance, help take the heavy burden of managing the military, the police, and the courts off your shoulders."
 coalition.11.a: "Isso parece uma excelente ideia"
 coalition.11.b: "Risos"
 coalition.12.t: "Negociações com [Neutral_Muslim_Brotherhood_L] ([?party_pop_elect_array^12|%0])"
 coalition.12.d: ""
 coalition.12.a: "Seja bem-vindo à equipe!"
 coalition.12.b: "Nós gentilmente declinamos"
 coalition.13.t: "Negociações com [Neutral_Autocracy_L] ([?party_pop_elect_array^13|%0])"
 coalition.13.d: ""
 coalition.13.a: "Seja bem-vindo à equipe!"
 coalition.13.b: "Nós gentilmente declinamos"
 coalition.14.t: "Negociações com [Neutral_conservatism_L] ([?party_pop_elect_array^14|%0])"
 coalition.14.d: ""
 coalition.14.a: "Seja bem-vindo à equipe!"
 coalition.14.b: "Nós gentilmente declinamos"
 coalition.15.t: "Negociações com [oligarchism_L] ([?party_pop_elect_array^15|%0])"
 coalition.15.d: "Caro [Root.GetLeader]. Após mais uma eleição titânica e recheada, as massas incultas estão prestes a explodir nas costuras deste circo inchado que você chama de governo. Somos mais eficazes quando o poder repousa apenas sobre um pequeno número de pessoas; Os ricos, os nobres, os poderosos. Pequeno é o novo grande. Não é o tamanho do barco que importa, mas o movimento no oceano. Dito isso, agora precisamos de um barco maior. Somente combinando nossos partidos para formar um governo de coalizão hoje, podemos garantir um barco menor para amanhã. Com a sua cooperação, nossa classe dominante partirá ao pôr do sol."
 coalition.15.a: "Seja bem-vindo a bordo!"
 coalition.15.b: "Nós gentilmente declinamos. Espero que vocês afundem!"
 coalition.16.t: "Negociações com [Neutral_Libertarian_L] ([?party_pop_elect_array^16|%0])"
 coalition.16.d: "Dear [Root.GetLeader]. It's often been said within the leadership of [Neutral_Libertarian_L] that just keeping the party together is like \"herding cats\". So you must believe us when we say that entering a coalition with you statists can only happen if you are prepared to make some serious concessions. Like eliminating taxes and abolishing the military. Of course, we will never waive an inch on individual freedom, and economic and social liberty. In the spirit of compromise, we might be prepared to delay the full implementation of Bitcoin as our new official currency slightly, but we haven't asked all our members about this yet.\n\n[Root.GetLeader]: \"What if we allow you all to smoke weed without getting jailed?\"\n\n- \"Sure! That will work\"."
 coalition.16.a: "Seja bem-vindo à equipe!"
 coalition.16.b: "Piada! Nós nunca realmente íamos incluir vocês, lunáticos."
 coalition.17.t: "Negociações com [Neutral_green_L] ([?party_pop_elect_array^17|%0])"
 coalition.17.d: "[Root.GetLeader]... Isso é uma limusine?! Isso é TÃO irresponsável. Se todos estivessem dirigindo veículos tão gastadores de combustível e voando para fora do país para reuniões, precisaríamos dos recursos de cem terras! Isso não pode continuar, o tempo está passando rápido. O aquecimento global causado pelo homem não é ficção científica, é fato científico. Só porque as temperaturas não podem aumentar de ano para ano no HoI4, não significa que não devemos levar a ameaça a sério! Exigimos um plano sério para reduzir rapidamente nossa pegada de carbono se quisermos fazer parte da sua coalizão de governo."
 coalition.17.a: "Bem-vindo ao nosso governo ecologicamente amigável"
 coalition.17.b: "Meh"
 coalition.18.t: "Negociações com [neutral_Social_L] ([?party_pop_elect_array^18|%0])"
 coalition.18.d: "Dear [Root.GetLeader]. We really think we would move your administration forward towards greater equality and universal progressive values. If we join, we demand that welfare and healthcare be strengthened significantly and taxes on the rich be increased massively. We hold the essential principles of democracy as sacred. This also applies to the economy, which should at least be under strict socialist government regulations to ensure good wages, better working conditions, and less profits to the capitalists. Really, we would be so good at governing that it would be best if the majority of it was state-controlled."
 coalition.18.a: "Juntos somos mais fortes"
 coalition.18.b: "NÃO vai acontecer!"
 coalition.19.t: "Negociações com [Neutral_Communism_L] ([?party_pop_elect_array^19|%0])"
 coalition.19.d: "Camarada [Root.GetLeader]! Embora busquemos derrubar seu governo imperialista-burguês, mudar a sociedade por meio da luta armada revolucionária, estabelecer a ditadura democrática do proletariado e eliminar os traidores de classe, percebemos que podem existir certas vantagens táticas políticas de curto prazo em formar uma coalizão neste momento.\n\nNossas demandas são simples - implementação total do materialismo dialético marxista, melhoria de 1000% nas condições socioeconômicas do proletariado oprimido e entrada gratuita no novo Disneyland que vamos construir!\n\n...Na verdade, vamos nos contentar com as concessões menores que você mencionou."
 coalition.19.a: "Avante juntos, camaradas!"
 coalition.19.b: "Vamos não."
 coalition.20.t: "Negociações com [Nat_Populism_L] ([?party_pop_elect_array^20|%0])"
 coalition.20.d: "Respeitado [Root.GetLeader]. Você é realmente sábio por falar conosco, todos sabem que somos a verdadeira voz do bom senso e da razão. No entanto, ao cumprir o papel do [Nat_Populism_L] como um farol de bom senso, devemos insistir que você adote algumas políticas adequadas. A classe política de [Root.GetName] tem saqueado a nação por muito tempo, entregando nossas riquezas e dignidade a empresas multinacionais que importam mão de obra barata através do sistema de imigração falido! Além de tomar nossos empregos, os imigrantes também estão explorando nossos benefícios de desemprego e sistema de bem-estar. Além disso, precisamos investir em nossa infraestrutura decadente e reduzir impostos! Nosso exército está criminosamente subdimensionado e mal equipado - ele precisa ser urgentemente expandido. Nós mencionamos a polícia? Claramente, eles não têm recursos para lidar com todos os criminosos que nossos governos anteriores importaram. Enquanto isso, nossos idosos não estão sendo cuidados adequadamente - uma vergonha! Então, nós temos um acordo?"
 coalition.20.a: "Bem-vindo a bordo!"
 coalition.20.b: "Poupe-me"
 coalition.21.t: "Negociações com [Nat_Fascism_L] ([?party_pop_elect_array^21|%0])"
 coalition.21.d: "Salve [Root.GetLeader]!\n\nPOR TODA PARTE, NÓS PATRIOTAS ESTAMOS MARCHANDO CONTRA OS TRAIDORES DE NOSSA CIVILIZAÇÃO. VOCÊ PODE SE UNIR A ESSA MARCHA GLORIOSA PELA PUREZA OU ENTREGAR NOSSO GRANDE PAÍS AOS ESTRANGEIROS IMUNDOS! NÓS DEVEMOS EXPULSÁ-LOS! TODOS ELES! (exceto aqueles que são membros pagantes do [Nat_Fascism_L], ou são nossas noivas por correspondência)\n\nExigimos um governo NACIONALISTA PURO para liderar a RESTAURAÇÃO NACIONAL! Temos apenas uma escolha - caos ou ordem e liberdade. ORDEM TOTAL. E LIBERDADE TOTAL dos parasitas estrangeiros."
 coalition.21.a: "Sim! Vamos nos unir."
 coalition.21.b: "Governo? Vocês todos pertencem a uma instituição diferente..."
 coalition.22.t: "Negociações com [Nat_Autocracy_L] ([?party_pop_elect_array^22|%0])"
 coalition.22.d: "Dear [Root.GetLeader]. There comes a time, of national peril, when the military establishment must step up its role, to fill dangerous power vacuums, safeguard the national sovereignty and our independence and patriotic values. In our view, this time for military rule - is always. However, we realize that doing so now might bring certain undesirable effects on our foreign relations. It would be... less complicated - if you just discreetly do as we say.\n\nAs long as you know your place, we certainly would be a very powerful political ally for you."
 coalition.22.a: "A política é muito importante para ser deixada aos políticos"
 coalition.22.b: "A política é muito importante para ser deixada aos generais"
 coalition.23.t: "Negociações com [Monarchist_L] ([?party_pop_elect_array^23|%0])"
 coalition.23.d: "Respeitado [Root.GetLeader]. Nós, os monarquistas, zombamos da noção de que você, um plebeu, possa fornecer [Root.GetName] com a estabilidade necessária e outras vantagens esplêndidas que apenas um monarca absoluto pode conferir. Todos sabemos que o verdadeiro poder executivo supremo só pode ser exercido adequadamente pela realeza em toda a sua santidade. Isso realmente seria uma força unificadora e um símbolo poderoso de nossa grandeza, à medida que avançamos em direção à restauração nacional completa. Claramente, as monarquias absolutas, abençoadas pelo direito divino, superam todas as outras formas de governo em todas as métricas.\n\nCerto, obviamente não vamos coroar você, então podemos manter o governo republicano ultrapassado e anacrônico por algum tempo, enquanto nós monarquistas na coalizão procuramos o melhor candidato para o trono."
 coalition.23.a: "Sim, claro, o que você quiser"
 coalition.23.b: "Vocês não são claramente adequados para governar..."
