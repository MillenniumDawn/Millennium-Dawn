 frigate_hull_7: "Casco de fragata de 2055"
 frigate_hull_7_desc: "Las fragatas, que forman el núcleo de muchas armadas modernas, pueden utilizarse como parte de las fuerzas navales de alta mar (blue water). Tienen un alcance extendido y son más grandes en comparación con la clase de corbetas. Aunque se utilizan con mayor frecuencia como plataforma para la defensa de la flota, pueden desempeñar una gama bastante amplia de funciones dentro de una fuerza naval y pueden personalizarse para satisfacer las demandas de muchos roles y situaciones diferentes (incluidas tareas de carácter más ofensivo). Se utilizan normalmente para: defensa de la flota, misiones antisubmarinas, antiaéreas y tareas de escolta de convoyes marítimos."
 frigate_hull_8: "Casco de fragata de 2070"
 frigate_hull_8_desc: "Las fragatas, que forman el núcleo de muchas armadas modernas, pueden utilizarse como parte de las fuerzas navales de alta mar (blue water). Tienen un alcance extendido y son más grandes en comparación con la clase de corbetas. Aunque se utilizan con mayor frecuencia como plataforma para la defensa de la flota, pueden desempeñar una gama bastante amplia de funciones dentro de una fuerza naval y pueden personalizarse para satisfacer las demandas de many roles y situaciones diferentes (incluidas tareas de carácter más ofensivo). Se utilizan normalmente para: defensa de la flota, misiones antisubmarinas, antiaéreas y tareas de escolta de convoyes marítimos."
 destroyer_hull_6: "Casco de destructor de 2060"
 destroyer_hull_6_desc: "Destinados a escoltar a los buques de mayor tamaño en una flota, convoy o grupo de batalla, estos barcos de guerra rápidos, maniobrables y de gran autonomía son igualmente capaces de operar de forma independiente. Las iteraciones posteriores, que transportan una amplia y letal variedad de misiles guiados, misiles de crucero y otras armas, son verdaderos buques de guerra polivalentes. Tienen un tonelaje mayor y una potencia de fuego más ofensiva y letal que una fragata o una corbeta. Se utilizan normalmente para: defensa de la flota, tareas ofensivas, misiones antiaéreas, antibuque, antisubmarinas, así como tareas de ataque a tierra, dependiendo de su configuración de armamento."
 destroyer_hull_7: "Casco de destructor de 2075"
 destroyer_hull_7_desc: "Destinados a escoltar a los buques de mayor tamaño en una flota, convoy o grupo de batalla, estos barcos de guerra rápidos, maniobrables y de gran autonomía son igualmente capaces de operar de forma independiente. Las iteraciones posteriores, que transportan una amplia y letal variedad de misiles guiados, misiles de crucero y otras armas, son verdaderos buques de guerra polivalentes. Tienen un tonelaje mayor y una potencia de fuego más ofensiva y letal que una fragata o una corbeta. Se utilizan normalmente para: defensa de la flota, tareas ofensivas, misiones antiaéreas, antibuque, antisubmarinas, así como tareas de ataque a tierra, dependiendo de su configuración de armamento."
 stealth_destroyer_hull_4: "Casco de destructor sigiloso de 2060"
 stealth_destroyer_hull_4_desc: "Changes in modern technology of warfare have caused more advanced fleets to look for new answers for survivability in their fleets. Stealth Destroyers have become a preeminent focus. Keeping hidden from advanced enemy sensors and radars means these powerful weapons can strike closer, quicker, and with increased lethality, with the added bonus of increased survivability in modern conflicts."
 stealth_destroyer_hull_5: "Casco de destructor sigiloso de 2075"
 stealth_destroyer_hull_5_desc: "Changes in modern technology of warfare have caused more advanced fleets to look for new answers for survivability in their fleets. Stealth Destroyers have become a preeminent focus. Keeping hidden from advanced enemy sensors and radars means these powerful weapons can strike closer, quicker, and with increased lethality, with the added bonus of increased survivability in modern conflicts."
 stealth_destroyer_4: "Destructor sigiloso de 2060"
 stealth_destroyer_4_desc: "Changes in modern technology of warfare have caused more advanced fleets to look for new answers for survivability in their fleets. Stealth Destroyers have become a preeminent focus. Keeping hidden from advanced enemy sensors and radars means these powerful weapons can strike closer, quicker, and with increased lethality, with the added bonus of increased survivability in modern conflicts."
 stealth_destroyer_5: "Destructor sigiloso de 2075"
 stealth_destroyer_5_desc: "Changes in modern technology of warfare have caused more advanced fleets to look for new answers for survivability in their fleets. Stealth Destroyers have become a preeminent focus. Keeping hidden from advanced enemy sensors and radars means these powerful weapons can strike closer, quicker, and with increased lethality, with the added bonus of increased survivability in modern conflicts."
 cruiser_hull_6: "Casco de crucero de 2060"
 cruiser_hull_6_desc: "Por lo general, los buques de asalto más grandes de una flota moderna (aparte de los portaaviones y los buques de asalto anfibio); estos potentes activos pueden cubrir todos los océanos y mares del globo. Históricamente orientados hacia la defensa aérea (mientras que los destructores se encargaban de la guerra de superficie), los cruceros modernos disponen de un arsenal de armas increíble, mayor que el de cualquier otro buque de combate. Los cruceros pueden utilizarse como base para un grupo de batalla entero, gracias a su gran capacidad para albergar sensores y sistemas de gestión de combate. Se utilizan normalmente para: funciones de mando y control, misiones antiaéreas, antibuque y tareas de ataque a tierra."
 cruiser_hull_7: "Casco de crucero de 2075"
 cruiser_hull_7_desc: "Por lo general, los buques de asalto más grandes de una flota moderna (aparte de los portaaviones y los buques de asalto anfibio); estos potentes activos pueden cubrir todos los océanos y mares del globo. Históricamente orientados hacia la defensa aérea (mientras que los destructores se encargaban de la guerra de superficie), los cruceros modernos disponen de un arsenal de armas increíble, mayor que el de cualquier otro buque de combate. Los cruceros pueden utilizarse como base para un grupo de batalla entero, gracias a su gran capacidad para albergar sensores y sistemas de gestión de combate. Se utilizan normalmente para: funciones de mando y control, misiones antiaéreas, antibuque y tareas de ataque a tierra."
 battle_cruiser_hull_5: "Casco de crucero de batalla de 2060"
 battle_cruiser_hull_5_desc: "Los buques de superficie son el componente principal de la flota y asumen todas las funciones marítimas de una armada tradicional."
 battle_cruiser_hull_6: "Casco de crucero de batalla de 2075"
 battle_cruiser_hull_6_desc: "Los buques de superficie son el componente principal de la flota y asumen todas las funciones marítimas de una armada tradicional."
