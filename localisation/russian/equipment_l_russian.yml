 TAT_util_vehicle_6_desc: "ВПК может перевозить 2+8 человек. Имеет бронезащиту по STANAG 4569 уровня 3. Отлично подходит для спецназа и полиции."
 TAT_util_vehicle_7: "З-СТС «Ахмат»"
 TAT_util_vehicle_7_desc: "Z-STS «Ахмат» построен на шасси КАМАЗ-5350 с трехосным полным приводом. Обладает высокими характеристиками проходимости и маневренности, а кроме того, не отличается сложностью эксплуатации. Любопытно, что бронеавтомобиль, в отличие от базового грузовика, выполнен по капотной схеме. Это позволило сместить места экипажа назад и повысить их безопасность."
 BSH_mbt_equipment_0: "Т-62"
 BSH_mbt_equipment_1: "Т-72"
 BSH_mbt_equipment_2: "Т-90"
 BSH_mbt_equipment_3: "Т-14"
 BSH_mbt_equipment_4: "Т-24"
 BSH_Rec_tank_0: "ПТ-76"
 BSH_Rec_tank_0_desc: "Этот сверхбыстрый лёгкий амфибийный танк может подкрасться к вражеским позициям через реку и устроить ад. С 76,2-мм нарезной танковой пушкой Д-56Т."
 BSH_Rec_tank_0_short: "ПТ-76"
 BSH_Rec_tank_1: "2С25 «Спрут-СД»"
 BSH_Rec_tank_1_desc: "Самоходная амфибийная машина для уничтожения танков может подкрадываться к вражеским танкам и стрелять из 125-мм пушки, которую несут Т-72-80."
 BSH_Rec_tank_1_short: "2С25 «Спрут-СД»"
 BSH_Rec_tank_2: "БМПТ «Терминатор»"
 BSH_Rec_tank_2_desc: "Вероятно, одна из самых смертоносных «стеклянных пушек», когда-либо созданных. Она не может противостоять танку, но может уничтожить целую колонну. Имеет 4 130-мм пусковые установки и 2 30-мм автоматические пушки."
 BSH_Rec_tank_2_short: "БМПТ «Терминатор»"
 BSH_Rec_tank_3: "К-18 «Бумеранг»"
 BSH_Rec_tank_3_desc: "Впервые «Бумеранг» был представлен как экономичный БТР и БМП для современной российской армии. Однако «Бумеранг» будет использоваться и как специализированная противотанковая платформа, оснащенная 125-мм пушкой, подробности о которой были представлены в 2018 году. Как и американский Stryker MGS, «Бумеранг» будет выполнять функции машины огневой поддержки, подобно БМПТ."
 BSH_Rec_tank_4: "Разведывательный танк 2025 года"
 BSH_Rec_tank_4_short: "Разведывательный танк 2025 года"
 BSH_Rec_tank_5: "Разведывательный танк 2035 года"
 BSH_Rec_tank_5_short: "Разведывательный танк 2035 года"
 BSH_SP_Anti_Air_0: "ЗСУ-23-4 «Шилка»"
 BSH_SP_Anti_Air_1: "9К35 «Стрела-10»"
 BSH_SP_Anti_Air_2: "2К22 «Тунгуска»"
 BSH_SP_Anti_Air_2_desc: "Выпуская до 8 ракет, эта машина может уничтожить любой самолёт, который попадётся на её пути. Более того, она может также уничтожать транспортные самолёты с помощью своих автопушек."
 BSH_SP_Anti_Air_3: "Панцирь-С1М"
 BSH_SP_Anti_Air_4: "Панцирь-С4Л"
 BSH_SP_R_arty_0: "БМ-21 «Град»"
 BSH_SP_R_arty_0_desc: "Мало используемый в современных операциях «дедушка» САУ и РСЗО применялся в основном во Второй мировой войне и в Афганистане. Эффективен на расстоянии 20 км."
 BSH_SP_R_arty_1: "БМ-30 «Смерч»"
 BSH_SP_R_arty_1_desc: "Эта машина представляет собой более современную версию «Града». Она способна пройти по снегу, льду или пустыне в любой точке земного шара. Её эффективная дальность стрельбы — 35 км."
 BSH_SP_R_arty_2: "9А52-4 «Торнадо»"
 BSH_SP_R_arty_2_desc: "Чрезвычайно тяжелая артиллерийская батарея, которая, если её не остановить, способна разрушить целые города. Максимальная дальность — до 90 км."
 BSH_SP_arty_0: "2С1 «Гвоздика»"
 BSH_SP_arty_0_desc: "2С1 «Гвоздика» — советская самоходная гаубица на базе универсального шасси МТ-ЛБу, оснащённая 122-мм гаубицей 2А18. «2С1» — это обозначение ГРАУ. Альтернативное российское обозначение — САУ-122, но в российской армии она обычно известна как «Гвоздика»."
 BSH_SP_arty_1: "2С3 «Акация»"
 BSH_SP_arty_1_desc: "Вооружённая 152,4-мм пушкой Д-22, способной при необходимости «выстрелить в солнце с небес». Это выдающаяся артиллерийская батарея с дальностью стрельбы до 50 км."
 BSH_SP_arty_2: "2С19М2 «Мста-С»"
 BSH_SP_arty_2_desc: "2С19 «Мста-С» была разработана в конце холодной войны: в ней применены новые технологии и увеличена дальность стрельбы по сравнению с предшественницей."
 BSH_SP_arty_3: "2С35 «Коалиция-СВ»"
 BSH_SP_arty_3_desc: "2С35 — настоящая артиллерийская платформа 21-го века с широкой автоматизацией, автоматическим выбором типа снарядов и унифицированными системами боевого управления."
 BSH_SP_arty_4: "2С38 «Коалиция-М»"
 BSH_artillery_1: "Д-30"
 BSH_artillery_1_desc: "122-мм буксируемая артиллерия, применявшаяся советскими войсками во многих войнах. Дальность стрельбы — 15–25 км."
 BSH_artillery_2: "2А65 «Мста-Б»"
 BSH_artillery_3: "Д-40"
 BSH_artillery_4: "Д-50"
 BSH_util_vehicle_1: "ЗИЛ-131"
 BSH_util_vehicle_1_desc: "Грузовик тылового обеспечения и перевозчик войск, используемый многими военными по всему миру."
 BSH_util_vehicle_2: "Урал-4320"
 BSH_util_vehicle_2_desc: "Грузовик тылового обеспечения и перевозчик войск, используемый многими военными по всему миру."
 BSH_util_vehicle_3: "КамАЗ-4310"
 BSH_util_vehicle_3_desc: "Грузовик и транспортное средство для перевозки войск, используемые многими армиями мира."
 BSH_util_vehicle_4: "КамАЗ-4350"
 BSH_util_vehicle_4_desc: "Как и «Волк», может перевозить 8 человек, а сверху на нём можно установить крупнокалиберные пулемёты. Используется во главе колонн."
 BSH_util_vehicle_5: "ГАЗ «Тигр»"
 BSH_util_vehicle_5_desc: "Этот бронетранспортер может быть вооружен различным оружием и перевозить до 11 человек."
 BSH_util_vehicle_6: "ВПК-3927 «Волк»"
 BSH_util_vehicle_6_desc: "ВПК может перевозить 2+8 человек. Имеет бронезащиту по STANAG 4569 уровня 3. Отлично подходит для спецназа и полиции."
 BSH_util_vehicle_7: "З-СТС «Ахмат»"
 BSH_util_vehicle_7_desc: "Z-STS «Ахмат» построен на шасси КАМАЗ-5350 с трехосным полным приводом. Обладает высокими характеристиками проходимости и маневренности, а кроме того, не отличается сложностью эксплуатации. Любопытно, что бронеавтомобиль, в отличие от базового грузовика, выполнен по капотной схеме. Это позволило сместить места экипажа назад и повысить их безопасность."
 PMR_Anti_Air_0: "9К32 «Стрела-2»"
 PMR_Anti_Air_0_desc: "Разработан в начале холодной войны с использованием метода пропорциональной навигации для захвата и уничтожения американских ядерных бомбардировщиков. Одна из самых простых систем ПВО, способная поражать цели на расстоянии 3700–4200 м."
 PMR_Anti_Air_1: "9К38 «Игла»"
 PMR_Anti_Air_1_desc: "«Игла» — более современная версия «Стрелы», принятая на вооружение в России в 2004 году. Она использует двухдиапазонную инфракрасную систему наведения (версия «С»), которая намного лучше, чем у «Стрелы»."
 PMR_Anti_Air_2: "9К38 «Игла-С»"
 PMR_Anti_Air_2_desc: "Новейший вариант, который является существенно улучшенным вариантом с большей дальностью действия, более чувствительным искателем, повышенной устойчивостью к последним мерам противодействия и более тяжелой боеголовкой. Производитель сообщает, что вероятность попадания составляет 0,8-0,9."
 PMR_APC_1: "БТР-60"
 PMR_APC_1_desc: "Одна из старейших машин, до сих пор находящихся на вооружении, БТР-60, оснащена 14,5-мм крупнокалиберным пулемётом КПВТ с боезапасом 500 патронов. Вспомогательное вооружение — спаренный пулемёт ПКТ калибра 7,62 мм с боезапасом 3,00 патрона. Отлично подходит для переброски лёгкой пехоты и сил быстрого реагирования (QRF)."
 PMR_APC_1_short: "БТР-60"
 PMR_APC_2: "МТ-ЛБ"
 PMR_APC_2_desc: "МТ-ЛБ был создан в 1970-х годах. Изготовлены дешево и быстро. Советы использовали их для легких противовоздушных и пехотных боев."
 PMR_APC_2_short: "МТ-ЛБ"
 PMR_APC_3: "БТР-70"
 PMR_APC_3_desc: "БТР-70 использовались с 1972 года, в советско-афганской войне они использовались для передвижения войск и последующей огневой поддержки. Единственное отличие от БТР-60 — более тяжелая броня."
 PMR_APC_3_short: "БТР-70"
 PMR_APC_4: "БТР-80"
 PMR_APC_4_desc: "БТР-80 — колесный БТР-амфибия с колесной формулой 8х8, разработанный в СССР. Он был принят на вооружение в 1986 году и заменил в Советской Армии предыдущие машины БТР-60 и БТР-70. Впервые он был применен во время советской войны в Афганистане."
 PMR_APC_4_short: "БТР-80"
 PMR_APC_5: "БТР-90"
 PMR_APC_5_desc: "Разработан в 1994 году для борьбы с боевиками. Оснащен мощной 30-мм пушкой Шипунова 2А42 с 500 патронами."
 PMR_APC_5_short: "БТР-90"
 PMR_Heavy_Anti_tank_1: "БРДМ-2 9П148 «Конкурс»"
 PMR_Heavy_Anti_tank_1_desc: "Применялся во многих войнах и на многих машинах. Эффективная дальность — 500–3000 м."
 PMR_IFV_1: "БМП-1"
 PMR_IFV_1_desc: "БМП-1 — советская гусеничная плавающая боевая машина пехоты. Применялась в советско-афганской войне для перевозки войск и борьбы с джихадистами. Вооружена 73-мм орудием 2А28 и пусковой установкой ПТУР."
 PMR_IFV_1_short: "БМП-1"
 PMR_IFV_2: "БМП-2"
 PMR_IFV_2_desc: "Самый большой страх джихадистов — это БМП-2, чрезвычайно быстрая и эффективная благодаря 30-мм пушке и перемалывающим гусеницам."
 PMR_IFV_2_short: "БМП-2"
 PMR_IFV_3: "БМП-2М"
 PMR_IFV_3_short: "БМП-2М"
 PMR_IFV_4: "БМП-3"
 PMR_IFV_4_desc: "БМП-3 — советская боевая машина пехоты, преемница БМП-1 и БМП-2. Стрельба из 100-мм пушки тяжелыми фугасными снарядами."
 PMR_IFV_4_short: "БМП-3"
 PMR_IFV_5: "БМП-3М"
 PMR_IFV_5_desc: "БМП-3М — советская боевая машина пехоты, преемница БМП-1 и БМП-2 и вариант БМП-3. Использует модернизированную пушку и двигатель."
 PMR_IFV_5_short: "БМП-3М"
 PMR_Anti_tank_1: "РПГ-7"
 PMR_Anti_tank_1_desc: "Применялся во многих войнах и на многих машинах."
 PMR_Anti_tank_2: "АТ-4 «Фагот»"
 PMR_Anti_tank_2_desc: "Гораздо легче и старше других ПТРК. Эта ПТУР поражает цели лишь на дальности 70–2500 м, что значительно меньше, чем у других комплексов, зато она дешевле."
 PMR_MBT_1: "Т-55"
 PMR_MBT_1_desc: "Танк Т-54/55, пожалуй, самый массовый в мире. Разработанный и произведённый в первые годы холодной войны, он был могуществом и основой Красной Армии. Когда-то внушавший страх как символ российской мощи, он стал культовым изображением ближневосточных бронетанковых войск, уничтожаемых в результате американского воздушного удара."
 PMR_MBT_1_short: "Т-55"
 PMR_MBT_2: "Т-72"
 PMR_MBT_2_desc: "Т-72 — пожалуй, самая удачная конструкция, произведённая в России. Он был вершиной советской военной мощи на завершающем этапе холодной войны, выпускался тысячами и по сей день служит опорой российской армии. Несмотря на то, что Т-72 стал печально известен своими катастрофическими неудачами в ближневосточных конфликтах, он до сих пор используется в качестве платформы для разработки будущих конструкций русских танков, а также постоянно модифицируется и модернизируется в соответствии со стандартами современной войны. Не стоит недооценивать танк, который когда-то был копьём советских войск."
 PMR_MBT_2_short: "Т-72"
 PMR_MBT_3: "Т-80"
 PMR_MBT_3_desc: "Этот танк стоимостью $2 млн — настоящий зверь поля боя — использовал ту же пушку, что и Т-72, но с усиленной бронёй и ПТУР «Кобра»."
 PMR_MBT_3_short: "Т-80"
 PMR_MBT_4: "Т-90"
 PMR_MBT_4_desc: "Т-90 — российский основной боевой танк, созданный как глубокая модернизация Т-72Б и принятый на вооружение в 1992 году. Он получил систему управления огнём на базе аппаратуры Т-80У, комплекс оптико-электронного подавления «Штора-1» и встроенную динамическую защиту «Контакт-5», что заметно подняло его защищённость. Вооружение — 125-мм гладкоствольная пушка 2А46М с автоматом заряжания, способная запускать управляемые ракеты через ствол. Т-90 стал самым массовым российским танком постсоветского периода и одним из главных экспортных образцов."
 PMR_MBT_4_short: "Т-90"
 PMR_mbt_equipment_0: "Т-62"
 PMR_mbt_equipment_1: "Т-72"
 PMR_mbt_equipment_2: "Т-90"
