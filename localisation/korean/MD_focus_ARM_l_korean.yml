 artsakh_focus: "아르차흐 중점 트리"
 arm_expansion.1.t: "[ARM.GetNameWithFlag]의 동맹 초대"
 arm_expansion.1.d: "[ARM.GetNameWithFlag]은(는) 함께 [TUR.GetNameWithFlag]의 팽창주의를 억제하자며 우리에게 동맹을 제안합니다"
 arm_expansion.1.a: "[TUR.GetNameWithFlag]은(는) 우리의 힘을 당해내지 못할 것이다"
 arm_expansion.1.b: "미안하지만 우리는 케밥을 좋아한다"
 arm_expansion.2.t: "[ARM.GetNameWithFlag]의 동맹 초대"
 arm_expansion.2.d: "[ARM.GetNameWithFlag]은(는) 함께 [TUR.GetNameWithFlag]의 팽창주의를 억제하자며 우리에게 동맹을 제안합니다"
 arm_expansion.2.a: "[TUR.GetNameWithFlag]은(는) 우리의 힘을 당해내지 못할 것이다"
 arm_expansion.2.b: "미안하지만 우리는 케밥을 좋아한다"
 arm_expansion.3.t: "[ARM.GetNameWithFlag]의 동맹 초대"
 arm_expansion.3.d: "[ARM.GetNameWithFlag]은(는) 함께 [TUR.GetNameWithFlag]의 팽창주의를 억제하자며 우리에게 동맹을 제안합니다"
 arm_expansion.3.a: "[TUR.GetNameWithFlag]은(는) 우리의 힘을 당해내지 못할 것이다"
 arm_expansion.3.b: "미안하지만 우리는 케밥을 좋아한다"
 arm_expansion.4.t: "[ARM.GetNameWithFlag]의 역사적 정의 요구"
 arm_expansion.4.d: "우리 측에서 긍정적인 응답이 없으면 그들은 \\"부러진 초승달\\" 작전을 개시할 것입니다."
 arm_expansion.4.a: "다른 선택지가 없다..."
 arm_expansion.4.b: "이것이 오스만 제국의 위대함을 되찾을 기회다!"
 arm_expansion.5.t: "아르메니아의 아르차흐 포기"
 arm_expansion.5.d: "우리는 나고르노카라바흐에 대한 우리 주장을 완전히 포기함을 공식적으로 인정합니다"
 arm_expansion.5.a: "모두 외국 파트너들을 위해서다"
 arm_expansion.6.t: "[ARM.GetNameWithFlag]의 우호 관계 수립 희망"
 arm_expansion.6.d: "그들은 이제 오랜 원한과 갈등을 잊고 함께 더 밝은 미래를 향해 나아갈 때라고 믿습니다"
 arm_expansion.6.a: "우리 모두 실수를 했다"
 arm_expansion.6.b: "우리와 친구가 될 생각은 잊어라"
 arm_expansion.7.t: "[ARM.GetNameWithFlag]의 투자 요청"
 arm_expansion.7.d: "[ARM.GetNameWithFlag]은(는) 자국의 기반시설에 투자해 달라고 요청하며, 그 대가로 우리의 무역 거점이 되겠다고 합니다"
 arm_expansion.7.a: "언제든 기꺼이 돕겠다"
 arm_expansion.7.b: "그들은 더 이상 우리에게 쓸모가 없다"
 arm_expansion.8.t: "우리나라에 대한 투자에 동의한 [FROM.GetNameWithFlag]"
 arm_expansion.8.d: "다행히 [FROM.GetNameWithFlag]이(가) 우리에게 투자하도록 설득할 수 있었습니다"
 arm_expansion.8.a: "좋다"
 arm_expansion.9.t: "우리나라에 대한 투자를 거절한 [FROM.GetNameWithFlag]"
 arm_expansion.9.d: "[FROM.GetNameWithFlag]은(는) 더 이상 우리와 협력하는 데 관심이 없는 듯합니다."
 arm_expansion.9.a: "유감이다"
 arm_expansion.10.t: "[ARM.GetNameWithFlag]의 나히체반행 자네주르 회랑 제안"
 arm_expansion.10.d: "새로운 합의의 일환으로 [ARM.GetNameWithFlag]은(는) 우리에게 나히체반으로 가는 회랑을 제안하고 있습니다. 이는 양국 간 추가 분쟁을 배제할 것입니다"
 arm_expansion.10.a: "우리의 꿈이 이루어졌다!"
 arm_expansion.10.b: "아니, 우리는 아르메니아를 사랑한다"
 arm_expansion.11.t: "[AZE.GetNameWithFlag]의 시우니크 비무장화 동의"
 arm_expansion.11.d: "이제 우리가 시우니크를 비무장화하고 나히체반으로 가는 회랑의 통제권을 [AZE.GetNameWithFlag]에 넘겼으니, 전쟁은 다시는 우리나라에 오지 않을 것입니다"
 arm_expansion.11.a: "모두 파트너들과의 우정을 위해서다!"
 arm_expansion.12.t: "우리 제안을 거부한 [AZE.GetNameWithFlag]"
 arm_expansion.12.d: "[AZE.GetNameWithFlag]이(가) 우리 제안을 거부한 직후 바쿠에서 대규모 시위가 잇따라 벌어졌습니다"
 arm_expansion.12.a: "어쩌면 잘된 일일지도 모른다"
 arm_expansion.13.t: "[TUR.GetNameWithFlag]의 동의"
 arm_expansion.13.d: "[FROM.GetNameWithFlag]은(는) 우리와 외교 관계를 재개하는 데 동의했습니다."
 arm_expansion.13.a: "함께하면 힘이 된다"
 arm_expansion.14.t: "[TUR.GetNameWithFlag]의 외교 관계 재개 거부"
 arm_expansion.14.d: "[TUR.GetNameWithFlag]은(는) 제1차 세계 대전 당시 [TUR.GetNameWithFlag]의 전쟁 범죄를 인정하라는 요구에 대한 우리의 거부를 받아들였으나, 우리와의 외교 관계는 재개하지 않을 것입니다"
 arm_expansion.14.a: "별로군"
 arm_expansion.15.t: "서아르메니아의 봉기"
 arm_expansion.15.d: "우리에게는 현재 튀르키예의 통제 아래 있는 서아르메니아에서 무장 봉기를 일으킬 기회가 있습니다. 그러나 이는 우리를 튀르키예와의 전쟁에 끌어들일 것이며 되돌릴 수 없다는 점을 알아야 합니다."
 arm_expansion.15.a: "서아르메니아의 자유를 위하여!"
 arm_expansion.15.b: "위험을 감수하지 않겠다"
 arm_expansion.16.t: "서아르메니아의 봉기"
 arm_expansion.16.d: "우리로서는 뜻밖에도 이른바 서아르메니아에서 우리 정부에 맞선 봉기가 일어났습니다! 아르메니아 당국은 이 반란을 조직했다고 공공연히 밝혔으며, 그들의 무장 세력이 반군과 나란히 나타났다는 정보도 이미 나왔습니다. 이는 용납할 수 없습니다!"
 arm_expansion.16.a: "대가를 치르게 될 것이다."
 arm_expansion.17.t: "서아르메니아의 봉기"
 arm_expansion.17.d: "조상 대대로 내려온 아르메니아 땅을 해방하기 위한 마지막 전쟁의 때가 왔습니다. 지금이 아니면 영영 기회가 없습니다. 아르메니아에 영광을!"
 arm_expansion.17.a: "아르메니아에 영광을!"
 ARM_west_armenia: "서아르메니아 공화국"
 ARM_turkey_compliance_idea: "서아르메니아 정부"
 ARM_shadow_of_sevres: "세브르 조약의 그림자"
 ARM_shadow_of_sevres_desc: "세브르 조약은 제1차 세계 대전의 종결을 알린 베르사유-워싱턴 체제의 조약 중 하나입니다. 1920년 8월 10일 프랑스 세브르에서 협상국 및 이에 가담한 국가들과 오스만 제국 정부 사이에 체결되었습니다. 튀르키예 대국민의회가 비준을 거부하여 이 조약은 발효되지 않았습니다. 3년 뒤 현재와 같은 튀르키예 국경을 확정한 로잔 조약으로 대체되었습니다."
 ARM_active_diplomacy: "적극적 외교"
 ARM_active_diplomacy_desc: "우리는 지역 정치에서 주도적인 역할을 해야 하며, 이 목표를 달성하기 위한 우리의 근본적인 과업은 캅카스의 주된 악, 튀르키예를 무찌르는 것입니다"
 ARM_west_arm_gov: "서아르메니아 정부와 접촉"
 ARM_west_arm_gov_desc: "국가 아르메니아라고도 불리는 서아르메니아 공화국은 서아르메니아 일부와 나히체반, 때로는 나고르노카라바흐까지 포함하는 아르메니아 고원 지대 일부에 대한 주권을 주장하는 망명 정부입니다. 이 자칭 국가는 자체 대통령직, 정부, 의회, 헌법, 국가, 문장을 갖추고 있다고 주장합니다"
 ARM_agree_with_greece: "대이념 복원"
 ARM_agree_with_greece_desc: "현재 [TUR.GetNameWithFlag]은(는) 마땅히 [GRE.GetNameWithFlag]에 속해야 할 광대한 영토를 차지하고 있습니다. 잃어버린 것을 되찾기 위해 그리스를 우리 연합에 초청할 것입니다"
 ARM_negotiate_syria: "[SYR.GetNameWithFlag]와(과) 협상"
 ARM_negotiate_syria_desc: "[SYR.GetNameWithFlag]의 조상 대대로의 땅 일부도 튀르키예의 통제 아래 있습니다. 그러나 [SYR.GetNameWithFlag]은(는) 북쪽으로부터의 침공 가능성에 취약한 전략적 위치에 있습니다"
 ARM_negotiate_kurds: "[KUR.GetNameWithFlag]와(과) 협상"
 ARM_negotiate_kurds_desc: "수십 년 동안 쿠르드인들은 쿠르드 민족 전체를 하나로 아우를 자신들의 독립 국가를 세우려 노력해 왔습니다. 그러니 이 노력을 도와줍시다"
 ARM_return_to_western_armenia: "서아르메니아로 귀환"
 ARM_return_to_western_armenia_desc: "잃어버린 것을 되찾고 캅카스와 소아시아를 튀르키예 식민주의로부터 해방할 때가 되었습니다"
 ARM_land_of_peace: "평화의 땅"
 ARM_land_of_peace_desc: "과거의 경험은 우리가 영토를 되찾을 수 없음을 보여 주었습니다. 이제 외교 정책을 재고하고 이슬람 이웃 나라들과 관계를 맺으려 노력할 가치가 있습니다."
 ARM_ussr_success_const: "아르메니아 소비에트 사회주의 공화국의 유산"
 ARM_ussr_success_const_desc: "이웃 나라들과 우호 관계를 맺기 위해 우리는 스스로를 아르메니아 소비에트 사회주의 공화국의 계승자로 인정하며, 이로써 [AZE.GetNameWithFlag]을(를) 포함한 다른 모든 소비에트 공화국의 영토 보전을 확인합니다"
 ARM_normalize_relations_with_turkey: "튀르키예와의 관계 정상화"
 ARM_normalize_relations_with_turkey_desc: "튀르키예와 아르메니아 사이의 오랜 갈등의 주된 원인은 서아르메니아에서의 튀르키예의 전쟁 범죄였습니다. 그러나 그 시절로부터 반세기 이상이 지났으므로 우리는 더 이상 이에 관심이 없습니다."
 ARM_crossroad_of_peace: "평화의 교차로"
 ARM_crossroad_of_peace_desc: "이웃 나라들과 좋은 관계를 유지하는 중립국으로서, 우리는 그들에게 우리 경제에 대한 투자를 제안할 것입니다"
 ARM_zang_corr_question: "자네주르 회랑 문제"
 ARM_zang_corr_question_desc: "새로운 평화 애호 정책에 따라, 우리는 더 이상 시우니크의 추가 군사 개발에 관심이 없습니다. 이곳은 아제르바이잔이 자국 비지 나히체반에 접근하는 것을 가로막는 핵심 동맥이자 이란의 군수 물자를 위한 육로를 우리에게 제공하는 곳이지만, 우리는 더 이상 이 지역을 이용해 아제르바이잔을 압박할 생각이 없습니다"
 ARM_anatolian_heritage: "아나톨리아의 유산"
 ARM_anatolian_heritage_desc: "양국 관계를 더욱 안정시키기 위해 문화, 경제, 정치, 과학 교류를 시작할 필요가 있습니다"
 ARM_kazah_cooperation_idea: "[KAZ.GetNameWithFlag] - [ARM.GetNameWithFlag] 협력"
 ARM_shirvan_deal: "[PER.GetNameWithFlag]에 영토 교환 제안"
 arme.174.t: "[ARM.GetNameWithFlag]의 영토 교환 제안"
 arme.174.d: "최근 아르메니아는 우리에게 영토 교환을 제안했습니다. 주로 이란 쿠르드인들이 거주하는 우리의 호이 주를, 페르시아어를 사용하는 사람들이 거주하는 영토인 시르반 주와 맞바꾸자는 것입니다. 동의하시겠습니까?"
 arme.174.a: "그래, 안 될 것 없지!"
 arme.174.b: "무슨 음모라도 있는 것인가?"
 arme.175.t: "[PER.GetNameWithFlag]의 영토 교환 거부!"
 arme.175.d: "이란은 시르반의 대가로 호이를 우리에게 넘기려 하지 않습니다."
 arme.175.a: "대가를 치르게 될 것이다."
 ARM_turkey_negotiations: "[TUR.GetNameWithFlag]와(과) 협상"
 ARM_turkey_negotiations_desc: "독립 이후 튀르키예는 유럽과의 무역에 큰 걸림돌이었습니다. 어쩌면 그들과 관계를 정상화하고 국경을 열 수 있을지도 모릅니다."
 arme.176.t: "[TUR.GetNameWithFlag]와(과)의 협상에 대한 우리의 입장"
 arme.176.d: "이제 튀르키예와의 협상에 대한 우리의 입장을 정할 때입니다. 관계 정상화와 국경 개방을 시도하기 시작해야 합니까, 아니면 이 구상을 잊어야 합니까?"
 arme.176.a: "튀르키예에 대화할 준비가 되었음을 통보한다."
 arme.176.b: "이 어리석은 구상을 포기한다."
 arme.177.t: "[ARM.GetNameWithFlag]의 관계 정상화 희망!"
 arme.177.d: "최근 아르메니아가 관계를 정상화하고 규율하자는 외교적 제안을 보내 왔습니다. 장기적으로 상호 동반자 관계와 국경 개방은 양측 모두에게 이익이 될 수 있습니다. 그러나 아르메니아는 우리 측에 오스만 제국에서의 집단학살 인정을 요구합니다. 많은 민족주의 활동가들은 인정이 영토 요구나 경제적 배상으로 이어질 수 있다고 믿습니다. 그러나 아르메니아 자신은 그러한 주장을 부인합니다."
 arme.177.a: "정상화할 준비가 되었으나, 몇 가지 사항을 논의해야 한다."
 arme.177.b: "먼저 나고르노카라바흐 분쟁을 해결해야 할 것이다."
 arme.177.c: "감히 우리와 대화할 생각을 하다니!"
 arme.178.t: "[TUR.GetNameWithFlag]의 집단학살 주장 철회 요구!"
 arme.178.d: "튀르키예는 우리의 제안을 받았으나, 우리가 집단학살 주장과 인정 요구를 철회하기를 원합니다. 그들에게 무엇이라 답해야 합니까?"
 arme.178.a: "정의를 요구하는 것은 배상이나 영토 요구와 같지 않다."
 arme.178.b: "물론 우리의 열망은 접을 수 있다."
 arme.179.t: "[ARM.GetNameWithFlag]의 동의!"
 arme.179.d: "아르메니아는 집단학살에 관한 주장을 철회하기로 동의했으며, 이제 관계를 정상화하고 무역을 위해 국경을 열 준비를 완전히 마쳤습니다."
 arme.179.a: "훌륭하군!"
 turkish_relat_negotated: "아르메니아-튀르키예 관계 정상화"
 arme.180.t: "[ARM.GetNameWithFlag]의 고집!"
 arme.180.d: "아르메니아는 튀르키예의 어떤 영토에도 권리를 주장할 의도가 없다고 다시 한번 밝혔습니다. 오히려 피로 얼룩진 역사를 규탄하고 튀르키예 국가를 오스만 시대의 과거로부터 구제하기 위해 평화와 역사 박물관을 건립할 수도 있다고 합니다. 아르메니아는 수복주의 의제가 아니라 무역과 정치 관계를 증진하고자 한다고 고집합니다."
 arme.180.a: "과거의 잔혹 행위를 인정하고 새로운 미래를 건설하자."
 arme.180.b: "그들은 우리를 모욕하려 한다. 이는 용납할 수 없다."
 arme.181.t: "[TUR.GetNameWithFlag]의 아르메니아 집단학살 인정!"
 arme.181.d: "튀르키예는 최근 오스만 제국에서 벌어진 1915년 집단학살을 인정하기로 수락하고 우리와의 관계를 정상화했습니다."
 arme.181.a: "신의 은총이 있기를!"
 arme.182.t: "[TUR.GetNameWithFlag]의 관계 정상화 거부!"
 arme.182.d: "튀르키예는 최근 우리와 관계를 정상화하려는 모든 외교적 노력을 포기했습니다. 더 이상 어떤 연결도 이루어지지 않을 것입니다."
 arme.182.a: "그들은 결코 변하지 않는다."
 arme.183.t: "구정부에 대한 반대"
 arme.183.d: "우리나라의 급진적인 권력 교체는 간과되지 않았습니다. 이전 정부의 지지자들은 우리에 맞서 강력한 반대 운동을 조직하여 우리 통치의 힘과 안정성을 시험하고 있습니다."
 arme.183.a: "그들의 시대는 끝났다."
 arme.184.t: "구정부에 대한 반대"
 arme.184.d: "우리나라의 급진적인 권력 교체는 간과되지 않았습니다. 이전 정부의 지지자들은 우리에 맞서 강력한 반대 운동을 조직하여 우리 통치의 힘과 안정성을 시험하고 있습니다."
 arme.184.a: "그들의 시대는 끝났다."
 arme.185.t: "구정부에 대한 반대"
 arme.185.d: "우리나라의 급진적인 권력 교체는 간과되지 않았습니다. 이전 정부의 지지자들은 우리에 맞서 강력한 반대 운동을 조직하여 우리 통치의 힘과 안정성을 시험하고 있습니다."
 arme.185.a: "그들의 시대는 끝났다."
 arme.186.t: "구정부에 대한 반대"
 arme.186.d: "우리나라의 급진적인 권력 교체는 간과되지 않았습니다. 이전 정부의 지지자들은 우리에 맞서 강력한 반대 운동을 조직하여 우리 통치의 힘과 안정성을 시험하고 있습니다."
 arme.186.a: "그들의 시대는 끝났다."
 arme.187.t: "지방의 시위"
 arme.187.d: "정치적 불안정은 우리의 괴뢰국들도 뒤흔들었습니다. 우리 통제 하의 주들이 반아르메니아 시위로 흔들리고 있으며, 이를 신속히 처리해야 합니다."
 arme.187.a: "젠장"
 arme.188.t: "아르메니아의 무기 요청"
 arme.188.d: "NATO의 정회원국이 된 아르메니아는 재무장 프로그램을 시작했으며, 이제 개편된 군대를 위해 우리에게 특정 무기를 제공해 달라고 요청하고 있습니다."
 arme.188.a: "무기를 제공한다"
 arme.188.b: "아니요"
 arme.189.t: "NATO 무기"
 arme.189.d: "[FROM.GetNameWithFlag]은(는) 우리 군의 재무장을 위해 무기를 제공하기로 동의했습니다."
 arme.189.a: "좋군"
 arme.190.t: "NATO 무기"
 arme.190.d: "[FROM.GetNameWithFlag]은(는) 우리 군의 재무장을 위한 무기 제공을 거부했습니다."
 arme.190.a: "유감이다"
 arme.223.t: "아제르바이잔의 반란"
 arme.223.d: "아제르바이잔 분리주의자들은 우리의 준비되지 않은 특수 기관과 소규모 군대를 틈타 우리의 지배로부터 조국을 해방시키려는 시도로 무장 봉기를 일으켰습니다."
 arme.223.a: "오, 안 돼"
 arme.224.t: "쿠반의 반란"
 arme.224.d: "쿠반에서의 우리 행동은 결과가 없지 않았습니다. 쿠반 사람들이 우리에 맞서 봉기하여 쿠반 공화국의 수립을 선포하고 우리와 싸울 무장 단체를 조직하기 시작했습니다."
 arme.224.a: "오, 안 돼"
 arme.225.t: "다게스탄의 반란"
 arme.225.d: "다게스탄에서의 우리 행동은 결과가 없지 않았습니다. 다게스탄 사람들이 우리에 맞서 봉기하여 다게스탄 공화국의 수립을 선포하고 우리와 싸울 무장 단체를 조직하기 시작했습니다."
 arme.225.a: "오, 안 돼"
 arme.226.t: "조지아의 반란"
 arme.226.d: "조지아에서의 우리 행동은 결과가 없지 않았습니다. 조지아 사람들이 우리에 맞서 반란을 일으켜 우리의 점령으로부터 스스로를 해방하고자 하며, 이제 우리는 조직적인 조지아의 반란에 대처해야 합니다."
 arme.226.a: "오, 안 돼"
 arme.227.t: "압하지야의 반란"
 arme.227.d: "압하지야에서의 우리 행동은 결과가 없지 않았습니다. 압하지야 사람들이 우리에 맞서 반란을 일으켜 우리의 점령으로부터 스스로를 해방하고자 하며, 이제 우리는 조직적인 압하지야의 반란에 대처해야 합니다."
 arme.227.a: "오, 안 돼"
 arme.228.t: "쿠르디스탄의 반란"
 arme.228.d: "쿠르디스탄에서의 우리 행동은 결과가 없지 않았습니다. 쿠르드 사람들이 우리에 맞서 반란을 일으켜 우리의 점령으로부터 스스로를 해방하고자 하며, 이제 우리는 조직적인 쿠르디스탄의 반란에 대처해야 합니다."
 arme.228.a: "오, 안 돼"
 arme.229.t: "자바헤티의 반란"
 arme.229.d: "자바헤티 주민들은 아르차흐에 대한 우리의 정책과 이 땅들을 버린 것에 극도로 충격을 받았습니다. 이를 배경으로 한 급진적 군인 집단이 우리 정부를 불법적이고 반아르메니아적이라고 선언하며 반란을 조직하기까지 했습니다."
 arme.229.a: "오, 안 돼"
 arme.230.t: "탈리시스탄의 자치"
 arme.230.d: "탈리시스탄 정부는 이 땅을 아르메니아 민족에게 완전히 종속시키려는 우리의 정치적 야욕에 맹렬한 불복종을 표하며 우리 정부에 최후통첩을 보냈습니다. 그들은 우리 국가의 일부로서 자치를 요구하며, 그렇지 않으면 총을 들고 독립을 지키겠다는 입장입니다."
 arme.230.a: "자치는 없다"
 arme.230.b: "자치를 주자"
 arme.231.t: "약한 군대에 대한 시위"
 arme.231.d: "우리에 맞서 시작된 무장 봉기는 전국적인 시위의 물결을 일으켰습니다. 사람들은 우리 군의 나약함에 불만을 품고 있으며, 군에 더 많은 자금을 지원할 것을 요구합니다"
 arme.231.a: "그리고 그들이 무엇을 먹고 살겠는가?"
 ARM_repatriate_armenians: "§Y아르메니아인§!을 [ARM.GetNameWithFlag]로 §G귀환§!시키기"
 first_repat_done: "제1차 귀환 완료"
 second_repat_done: "제2차 귀환 완료"
 third_repat_done: "제3차 귀환 완료"
 four_repat_done: "제4차 귀환 완료"
 effect_app_if_migr_lev_tt: "§Y이 결정의 효과는 이민 수준이 최소 낮음에 도달하면 나타납니다§!"
 ARM_ask_diaspora_invest: "§Y디아스포라§!에 [ARM.GetNameWithFlag]에 §G투자§!하도록 요청"
 ARM_fix_water_yerevan: "§Y예레반§!의 수도관 수리"
 ARM_fix_water_gegharkunik: "§Y게가르쿠니크-타부시§!의 수도관 수리"
 ARM_fix_water_syunik: "§Y시우니크§!의 수도관 수리"
 arme.191.t: "야권의 코차랸 탄핵 시도!"
 arme.191.d: "야권 지도자들이 연합을 구성했으며, 이제 시위뿐 아니라 코차랸을 대통령직에서 탄핵하려 시도하고 있습니다. 이제 모든 것은 정부 엘리트들이 코차랸에게 얼마나 충성하느냐에 달려 있습니다."
 arme.191.a: "젠장!"
 arme.191.b: "그들에게는 승산이 없었다."
 oppos_killed: "야권 제거됨"
 oppos_lived: "야권 생존"
 arme.192.t: "라피 호하니샨의 유산당 창당!"
 arme.192.d: "최근 아르메니아에서 민족자유주의 정당 유산당이 창당되었습니다. 이 당은 90년대 레본 테르페트로샨 정권에서 아르메니아의 초대 외무장관을 지낸 라피 호하니샨이 설립했습니다. 이 당은 자국의 민족적 주권 이익에 기반하여 국내외 정책을 수립하는 발전된 법치 민주 국가를 만드는 것을 최우선 과제로 여깁니다."
 arme.192.a: "새로운 경쟁자인가?"
 ARM_protests: "야권 시위"
 arme.193.t: "야권 시위!"
 arme.193.d: "데미르치얀은 자유 광장에서 당국의 퇴진을 요구하는 시위를 시작했으며, 이후 대통령궁까지 행진을 시작했으나 경찰이 국회 앞에서 길을 막았습니다."
 arme.193.a: "무력으로 진압한다."
 arme.194.t: "헝가리에서 살해된 아르메니아 군인!"
 arme.194.d: "헝가리에서 아르메니아와 아제르바이잔 군인이 참가한 NATO 파트너 국가들의 합동 훈련 중 아르메니아 군인 구르겐 마르가랸이 살해되었습니다. 2004년 1월 11일부터 마르가랸은 부다페스트에서 NATO 평화를 위한 동반자 프로그램의 3개월 영어 과정에 참여하고 있었습니다. 2월 19일 이른 아침 그는 살해되었습니다. 범인인 아제르바이잔 장교 라밀 사파로프는 자고 있던 아르메니아 장교의 얼굴을 도끼로 16번 내리쳐 머리가 몸에서 거의 떨어져 나갈 지경이었습니다. 사파로프는 체포되었으나 그의 앞날은 아직 꽤 불분명합니다. 그가 아제르바이잔으로 송환될지 여부는 알려지지 않았습니다."
 arme.194.a: "이런 야만적인 행위가!"
 arme.194.b: "잘했다! 그에게 영웅 칭호를 수여해야 한다!"
 arme.195.t: "[AZE.GetNameWithFlag]의 사파로프 석방 대가 지불!"
 arme.195.d: "헝가리에서 아르메니아와 아제르바이잔 군인이 참가한 NATO 파트너 국가들의 합동 훈련 중 아르메니아 군인 구르겐 마르가랸이 살해되었습니다. 2004년 1월 11일부터 마르가랸은 부다페스트에서 NATO 평화를 위한 동반자 프로그램의 3개월 영어 과정에 참여하고 있었습니다. 2월 19일 이른 아침 그는 살해되었습니다. 범인인 아제르바이잔 장교 라밀 사파로프는 자고 있던 아르메니아 장교의 얼굴을 도끼로 16번 내리쳐 머리가 몸에서 거의 떨어져 나갈 지경이었습니다. 사파로프는 체포되었으나 그의 앞날은 아직 꽤 불분명합니다. 그가 아제르바이잔으로 송환될지 여부는 알려지지 않았습니다."
 arme.195.a: "돈은 언제나 좋다!"
 arme.196.t: "아르메니아 집단학살 90주년"
 arme.196.d: "오늘 우리나라는 오스만 튀르키예에서 자행된 아르메니아인, 그리스인, 아시리아인 집단학살 90주년을 맞아 애도하고 있습니다. 전 세계 수백만 아르메니아인이 오스만의 반인도 범죄를 인정한 많은 나라의 지도자들과 마찬가지로 우리와 연대를 표하고 있습니다."
 arme.196.a: "희생자들이 평안히 잠들기를."
 arme.197.t: "집단학살 연구 위원회 설립"
 arme.197.d: "오늘 예레반에서는 정부 관료, 집단학살 박물관 대표, 아르메니아 디아스포라 및 성직자 대표들이 소집되어 아르메니아 집단학살을 연구할 위원회의 설립을 논의했습니다."
 arme.197.a: "좋은 구상이다"
 arme.198.t: "예레반의 대규모 시위!"
 arme.198.d: "아르메니아에서 일련의 반정부 소요가 벌어졌습니다. 대통령 후보이자 전 대통령인 레본 테르페트로샨의 지지자들과 다른 야권 지도자들이 조직한 시위가 수도 예레반에서 일어났습니다. 낮에는 수만 명의 시위대가 참여하고 밤에는 수백 명이 야영을 합니다."
 arme.198.a: "진압하라!"
 arme.199.t: "정점에 달한 시위!"
 arme.199.d: "시위는 경찰이 더 이상 비폭력적인 방법으로는 군중에게 맞설 수 없는 수준에 이르렀습니다. 군은 경계 태세에 있으며, 경찰과 군인들은 발포할 준비가 되어 있습니다. 모두가 명령을 기다리고 있습니다."
 arme.199.a: "군대로 짓밟아라!"
 arme.199.b: "아니, 군은 더 이상 충성스럽지 않다... 물러나야 한다!"
 arme.200.t: "세르지 사르키샨으로의 권력 이양"
 arme.200.d: "집회 진압과 내부 합의 이후 코차랸은 자신이 선택한 후계자 세르지 사르키샨에게 대통령직을 넘길 준비가 되었습니다."
 arme.200.a: "좋다"
 arme.200.b: "그런 일은 일어나지 않을 것이다!"
 arme.201.t: "다슈나크추툰 시위!"
 arme.201.d: "튀르키예와 아르메니아 간 협상이 시작되는 배경 속에서, 다슈나크추툰 당은 연립에서 탈퇴하고 세르지 사르키샨의 외교적 결정에 항의하는 절차를 시작했습니다."
 arme.201.a: "빌어먹을 멍청이들"
 arme.203.t: "마슈토츠 공원 운동"
 arme.203.d: "우리에게 충성하는 예레반 시장이 마슈토츠 공원의 가판대를 철거하고 녹지를 허물기로 결정하자 예레반에서 평화로운 시위 운동이 시작되었습니다. 그들은 도시 공공 공간의 현 상태를 보존할 것을 요구합니다."
 arme.203.a: "그들의 요구는 합리적이다."
 arme.203.b: "멍청한 자유주의자들!"
 arme.204.t: "라피 호하니샨의 혁명 선언!"
 arme.204.d: "다양한 정치 및 시민 단체들이 이제 아르메니아에서 반정부 시위를 벌이고 있습니다. 그러나 시위 운동의 지도자는 분명히 라피 호하니샨입니다. 그의 지지자 다수가 예레반의 자유 광장에 모였고, 호하니샨은 사르키샨 대통령에게 국민의 승리를 받아들이고 패배를 인정하라고 촉구했습니다. 친서방 정당들과 다슈낙 같은 민족주의 정당들 모두 시위에 합류하고 있습니다."
 arme.204.a: "시위를 진압하라!"
 arme.204.b: "그들이 원하는 것을 주어라"
 arme.205.t: "라피 호하니샨의 단식 투쟁 시작!"
 arme.205.d: "자유 광장에서 지지자들에게 연설한 뒤 라피 호하니샨은 단식 투쟁을 시작하겠다고 발표했습니다. 그는 대통령 당선인 세르지 사르키샨에게 사임을 촉구했습니다. 호하니샨에 따르면 이것은 단순한 단식 투쟁이 아니라 거짓과 사기에 맞선 보이콧입니다."
 arme.205.a: "적어도 시위는 줄어들고 있다."
 arme.206.t: "시민 계약당"
 arme.206.d: "최근 다양한 야권 인사들이 ANC 전 당원들로 이루어진 새 정당의 창당을 발표했습니다. 이 새 정당의 지도자는 시위 중 체포되었다가 최근 석방된 니콜 파시냔입니다."
 arme.206.a: "또 다른 집단인가?"
 arme.207.t: "전기 예레반 시위"
 arme.207.d: "의회가 최근 전기 요금 인상을 시도한 것과 관련하여 예레반에서 대규모 시위가 시작되었습니다. 경찰은 비살상 무력과 물대포를 사용해 시위대를 해산시키려 하고 있습니다. 요금에 대한 우리의 견해를 재고해야 합니까, 아니면 현 상태를 유지해야 합니까?"
 arme.207.a: "계획을 포기하겠다"
 arme.207.b: "요금 인상을 밀어붙여라!"
 arme.208.t: "귬리 학살!"
 arme.208.d: "귬리에 주둔한 러시아 제102 군사기지의 군인 발레리 페르먀코프는 야간 경비 근무 중이었습니다. 1월 12일 새벽 4시경, 페르먀코프는 AK-74 돌격소총과 탄창 두 개를 들고 허가 없이 부대 위치, 더 정확히는 RAV 창고 경비 초소를 이탈했습니다. 이 탈영병은 아르메니아-튀르키예 국경으로 향했으며, 국경을 넘어 튀르키예로 사라질 생각이었습니다. 탈영 후 얼마 지나 페르먀코프는 러시아 부대에서 도보 약 30분 거리의 마스니키얀 거리에 있는 집 중 한 곳에 들어가기로 마음먹었습니다. 상징적으로만 잠긴 문을 통해 공동 마당에 들어선 페르먀코프는 단층 독채 몇 채를 발견했습니다. 군인은 현관문 유리 부분의 틀을 부수고 건물에 들어갔습니다.\n\n페르먀코프는 이 집에 살던 아베티샨 가족을 아이들을 포함해 모두 살해했습니다. 학살을 저지른 뒤 발레리 페르먀코프는 시신들의 옷을 입고 소총을 버린 채 범행 현장을 떠났습니다. 오후 12시 30분 이웃들이 아베티샨 가족의 시신을 발견했습니다.\n\n우리는 딜레마에 직면했습니다. 우리가 직접 처리해야 합니까, 아니면 이 쓰레기를 러시아에 넘겨야 합니까?"
 arme.208.a: "러시아가 시베리아에서 이 개자식에게 예절을 가르칠 것이다!"
 arme.208.b: "개자식을 처형하라!"
 arme.209.t: "귬리 학살!"
 arme.209.d: "귬리에 주둔한 러시아 제102 군사기지의 군인 발레리 페르먀코프는 야간 경비 근무 중이었습니다. 1월 12일 새벽 4시경, 페르먀코프는 AK-74 돌격소총과 탄창 두 개를 들고 허가 없이 부대 위치, 더 정확히는 RAV 창고 경비 초소를 이탈했습니다. 이 탈영병은 아르메니아-튀르키예 국경으로 향했으며, 국경을 넘어 튀르키예로 사라질 생각이었습니다. 탈영 후 얼마 지나 페르먀코프는 러시아 부대에서 도보 약 30분 거리의 마스니키얀 거리에 있는 집 중 한 곳에 들어가기로 마음먹었습니다. 상징적으로만 잠긴 문을 통해 공동 마당에 들어선 페르먀코프는 단층 독채 몇 채를 발견했습니다. 군인은 현관문 유리 부분의 틀을 부수고 건물에 들어갔습니다.\n\n페르먀코프는 이 집에 살던 아베티샨 가족을 아이들을 포함해 모두 살해했습니다. 학살을 저지른 뒤 발레리 페르먀코프는 시신들의 옷을 입고 소총을 버린 채 범행 현장을 떠났습니다. 오후 12시 30분 이웃들이 아베티샨 가족의 시신을 발견했습니다.\n\n아르메니아는 이 괴물을 처형하지 않는 매우 관대한 결정을 내렸습니다. 페르먀코프는 이제 재판을 받고 최고 보안 교도소로 보내질 것입니다."
 arme.209.a: "이 개자식은 살아 있는 지옥에서 썩을 것이다."
 arme.210.t: "귬리 학살!"
 arme.210.d: "귬리에 주둔한 러시아 제102 군사기지의 군인 발레리 페르먀코프는 야간 경비 근무 중이었습니다. 1월 12일 새벽 4시경, 페르먀코프는 AK-74 돌격소총과 탄창 두 개를 들고 허가 없이 부대 위치, 더 정확히는 RAV 창고 경비 초소를 이탈했습니다. 이 탈영병은 아르메니아-튀르키예 국경으로 향했으며, 국경을 넘어 튀르키예로 사라질 생각이었습니다. 탈영 후 얼마 지나 페르먀코프는 러시아 부대에서 도보 약 30분 거리의 마스니키얀 거리에 있는 집 중 한 곳에 들어가기로 마음먹었습니다. 상징적으로만 잠긴 문을 통해 공동 마당에 들어선 페르먀코프는 단층 독채 몇 채를 발견했습니다. 군인은 현관문 유리 부분의 틀을 부수고 건물에 들어갔습니다.\n\n페르먀코프는 이 집에 살던 아베티샨 가족을 아이들을 포함해 모두 살해했습니다. 학살을 저지른 뒤 발레리 페르먀코프는 시신들의 옷을 입고 소총을 버린 채 범행 현장을 떠났습니다. 오후 12시 30분 이웃들이 아베티샨 가족의 시신을 발견했습니다.\n\n아르메니아는 페르먀코프를 처형하기로 결정했으며, 러시아에서 종신형을 받도록 넘기지 않았습니다."
 arme.210.a: "그들의 행동은 정당하지만 우리의 법적 협정에는 어긋난다. 이 일을 넘길 수 있기를 바란다..."
 arme.211.t: "예레반 인질 사태"
 arme.211.d: "스스로를 사순의 용사들이라 칭하는 무장 괴한 집단이 아르메니아 예레반의 경찰서를 습격하여 인질 아홉 명을 붙잡았습니다. 이들은 야권 지도자 지라이르 세필리안의 석방과 대통령의 사임을 요구했습니다. 이 집단은 정부군과 대치를 시작했고, 점점 늘어나는 시위대가 대통령 사임 요구에 합류했습니다. 대치 중 경찰 두 명이 사망하고 수십 명이 부상을 입었으며, 사태가 끝난 뒤 경찰 한 명이 부상으로 사망했습니다. 공격자 중 몇 명도 부상을 입었습니다. 어떻게 해야 합니까?"
 arme.211.a: "그들과 협상한다"
 arme.211.b: "국가안보국을 보내 급습하라!"
 arme.212.t: "사스나 츠레르의 항복!"
 arme.212.d: "사스나 츠레르 집단은 더 이상의 유혈 사태를 피하기 위해 항복하기로 결정했습니다. 우리의 모든 노력을 고려할 때 상황은 꽤 평화적으로 해결되었습니다."
 arme.212.a: "신께 감사한다..."
 arme.213.t: "특수부대 급습 성공!"
 arme.213.d: "특수부대가 경찰서를 성공적으로 급습하여 정치적 테러리스트 사스나 츠레르를 일대에서 소탕했습니다. 공격자는 전원 사살되었습니다. 인질 중 다친 사람은 없습니다."
 arme.213.a: "훌륭한 작전이다!"
 pavlik_dies: "파블리크 마누키얀 사망"
 arme.214.t: "대통령이 된 아르멘 사르키샨!"
 arme.214.d: "세르지 사르키샨의 사실상 통치를 강화하고 의원내각제 공화국을 수립하기 위한 권위주의적 개혁의 일환으로 아르멘 사르키샨이 아르메니아 대통령에 선출되었습니다. 구세력과 뚜렷한 연고가 없는 그는 우리의 새로운 이미지에 크게 도움이 될 수 있습니다."
 arme.214.a: "좋은 수다."
 arme.215.t: "귬리에서의 시위 행진!"
 arme.215.d: "3월 31일 니콜 파시냔은 귬리 시에서 출발하여 바나조르, 딜리잔, 흐라즈단, 아보비얀 등의 도시와 마을을 거쳐 마침내 예레반에 이르는 '임 카일'(나의 발걸음) 시위 행진을 시작했습니다."
 arme.215.a: "또 하나의 무의미한 시위인가?"
 arme.217.t: "벨벳 혁명"
 arme.217.d: "아르메니아에서 벌어진 일련의 정치 시위 끝에, 세르지 사르키샨이 이끄는 반동적이고 이른바 '보수적'인 아르메니아 정당이 물러나고 국민이 니콜 파시냔을 집권시켰습니다. 그는 아르메니아를 괴롭히는 만연한 부패를 척결하고 경제 상황을 개선하며 대규모 이민을 막겠다고 공약했습니다."
 arme.217.a: "두호프!"
 arme.218.t: "니콜 파시냔의 차기 국방장관 지명!"
 arme.218.d: "아르메니아 총리 니콜 파시냔은 비상사태부 장관 직무대행인 다비트 토노얀을 국방장관에 임명하겠다고 밝혔습니다. 다비트 토노얀은 수상한 평판과 부패 연루 가능성이 있음에도 민족주의적이고 팽창주의적인 수사로 두드러지며, 이는 국내 민족주의자들을 달랠 수 있습니다."
 arme.218.a: "흥미롭군"
 arme.219.t: "범아르메니아 민족 협약당"
 arme.219.d: "최근 아르메니아에 새 정당이 결성되었습니다. 이 연합은 직접 민주주의, 대통령직 폐지, 아르메니아 주권 강화, 국가 경제 발전의 지속, 독립 언론 설립, 대학 교육 무상화, 아르메니아 디아스포라의 귀환 장려, 소수 민족의 권리 보호를 신봉하며, 윌슨 아르메니아 구상과 아르차흐의 아르메니아 통합을 지지합니다."
 arme.219.a: "흥미롭군."
 arme.220.t: "5165 민족보수운동당"
 arme.220.d: "5165 민족보수운동당이 최근 창당되었으며 카린 토노얀이 당 대표로 선출되었습니다. 당명에 들어간 숫자는 아라라트 산의 높이를 나타냅니다. 본질적으로 이 당은 전직 군인, 군인의 친인척, 아르메니아의 군부 통치를 지지하는 사람들로 구성되어 있습니다."
 arme.220.a: "흥미롭군."
 arme.221.t: "진정한 바그라투니 선택"
 arme.221.d: "멜릭 연합이 새 군주를 선택하기 위해 모였습니다. 누가 될 것입니까?"
 arme.221.a: "롤란트 폰 바그라투니"
 arme.221.b: "테르 아쇼트 바그라투니"
 arme.222.t: "[ARM.GetNameWithFlag]의 §G연방 국가§! 가입!"
 arme.222.d: "최근 아르메니아 대통령은 연방 국가 구상에 참여하여 우리 및 다른 회원국들과 통합하기로 결정했습니다!"
 arme.222.a: "훌륭하군!"
