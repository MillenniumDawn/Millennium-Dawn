 FRA_ng_snle_3g_strategic_capstone: "SNLE 3G Strategic Capstone"
 france_md.509.t: "Introduction of the ECO"
 france_md.509.d: "France has proposed replacing the CFA Franc with the ECO, a new common currency for West Africa. Adopting it would grant us greater monetary autonomy and closer ties with France."
 france_md.509.a: "Adopt the ECO"
 france_md.509.b: "Decline the offer"
 france_md.600.t: "The Chip Business Alcatel No Longer Wants"
 france_md.600.d: "The telecom bubble has burst and Alcatel is selling everything that is not a network. Its microelectronics division is profitable, competent and about to belong to somebody else. Keeping it French would cost the Treasury real money to solve a problem the market does not think it has."
 france_md.600.a: "Keep the microelectronics arm in French hands"
 france_md.600.a_bonus: "Retained Semiconductor Division"
 france_md.600.b: "Let it go to a European buyer"
 france_md.600.b_bonus: "Consolidated European Silicon"
 france_md.601.t: "The Credit Wall"
 france_md.601.d: "France Telecom owes more than any company has ever owed, the acquisitions that built the debt are worth a fraction of what was paid, and the banks will not roll it over again. The state can put public money into a listed company, or it can let the creditors decide what the national operator becomes."
 france_md.601.a: "Recapitalise the operator with public money"
 france_md.601.a_bonus: "State Capitalised Network Operator"
 france_md.601.b: "Let the creditors restructure it"
 france_md.601.b_bonus: "Creditor Led Restructuring"
 france_md.602.t: "The State Loses Its Majority"
 france_md.602.d: "Selling below fifty percent would raise a great deal of money and end the argument in Brussels about a state-owned incumbent competing in an open market. It would also mean that the next decision about France's telephone network is taken by shareholders."
 france_md.602.a: "Hold the state majority"
 france_md.602.a_bonus: "Public Majority Ownership"
 france_md.602.b: "Sell below fifty percent"
 france_md.602.b_bonus: "Privatised Network Operator"
 france_md.603.t: "After Crolles2"
 france_md.603.d: "The shared alliance at Crolles gave three companies a leading-edge process none of them could have afforded alone, and two of them are now leaving. Funding the replacement means the state carrying a research programme that its partners walked away from. Refusing means one French company develops the node by itself, or stops trying."
 france_md.603.a: "Fund what replaces the alliance"
 france_md.603.a_bonus: "Shared Process Development"
 france_md.603.b: "Let the national champion carry it alone"
 france_md.603.b_bonus: "Independent Process Roadmap"
 france_md.604.t: "Unwinding ST-Ericsson"
 france_md.604.d: "The European wireless champion has lost money every quarter of its existence, and the customers it was built to serve now design their own silicon. Rescuing it would buy time for a business whose market has already moved. Unwinding it writes off the last serious European attempt at a mobile chipset."
 france_md.604.a: "Rescue the wireless venture"
 france_md.604.a_bonus: "European Wireless Silicon"
 france_md.604.b: "Unwind it and take the losses"
 france_md.604.b_bonus: "Portfolio Rationalisation"
 france_md.605.t: "The Microelectronics IPCEI"
 france_md.605.d: "Brussels will permit what it once forbade: public money, at scale, for semiconductor capacity. Crolles could be expanded into something that matters to the continent rather than to one company. It is a subsidy race France did not start and cannot win alone, and the alternative is not competing in it."
 france_md.605.a: "Fund the Crolles expansion"
 france_md.605.a_bonus: "Sovereign Fabrication Capacity"
 france_md.605.b: "Leave capacity to the market"
 france_md.605.b_bonus: "Market Led Capacity"
 france_md.606.t: "What the Republic Kept"
 france_md.606.d: "A quarter century of rescues, sales, alliances and subsidies has settled which parts of France's telephone network and semiconductor industry the state still owns, and which it merely hosts."
 france_md.606.a: "A champion the Republic still owns"
 france_md.606.b: "A silicon base built with public money"
 france_md.606.c: "An operator the state once rescued"
 france_md.606.e: "A market like any other"
 FRA_cs_nationalised_systems_champion: "Nationalised Systems Champion"
 FRA_cs_nationalised_systems_champion_desc: "The state never let go of the majority, so the network and the industry around it answer to Paris before they answer to a share price. It costs the Treasury what a controlling stake always costs, and it buys decisions that stay in the country."
 FRA_cs_state_backed_silicon_base: "State Backed Silicon Base"
 FRA_cs_state_backed_silicon_base_desc: "Public money built fabrication capacity that no French company would have financed on its own, and the wafers are made in France. The subsidy is permanent because the capacity is, and both are now facts on the ground rather than arguments."
 FRA_cs_recapitalised_national_operator: "Recapitalised National Operator"
 FRA_cs_recapitalised_national_operator_desc: "The state put its money in when nobody else would and the operator survived a debt no company should have carried. It was a rescue rather than a structure, and rescues do not last."
 FRA_cs_market_like_any_other: "A Market Like Any Other"
 FRA_cs_market_like_any_other_desc: "The champions were sold, merged or wound up on ordinary commercial terms, and France buys its networks and its chips from whoever sells them best. It is efficient, it is orthodox, and nothing strategic is decided here any more."
