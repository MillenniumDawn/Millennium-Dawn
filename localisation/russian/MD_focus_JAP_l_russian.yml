 JAP_jmu_corporation_naval_manufacturer_header_carrier_aviation: "Carrier Aviation"
 senbu_occupation_law_fake_idea: "Senbu Pacification Administration"
 senbu_occupation_law_fake_idea_desc: "Civil affairs officers run the occupied districts through local notables rather than garrison commanders, restoring markets, schools and rice distribution before demanding output. Compliance grows steadily and the garrison requirement stays low, but the light hand leaves organised resistance more room than a punitive regime would."
 JAP_sabotaged_russians: "Sabotaged Russian Facilities"
 JAP_usa_trade_pressure: "American Trade Pressure"
 JAP_article_nine_balance_of_power_category: "Article Nine"
 JAP_article_nine_balance_of_power_category_desc: "The renunciation of war in Article Nine of the constitution is not a settled question but a running argument between the cabinet, the courts, the American alliance and the public. Every reinterpretation shifts the balance between a strictly defensive posture and a normal military."
 JAP_cool_japan_doctrine_desc: "Japanese design is not strange because it failed to match a foreign standard. It is strange because it was made for Japanese customers by people who never once considered the alternative, and that is precisely what makes it worth buying. The ministry stops packaging culture as a shopfront for hardware and begins exporting the difference itself.\n\n§RThis path keeps §Y$JAP_galapagos_syndrome$§! permanently.§! Only §Y$JAP_world_integration$§! removes it, and the two are mutually exclusive: Japan either converges on the world's standards or sells the world its own."
 JAP_galapagos_sphere_modifier: "Cultural Sphere"
 JAP_galapagos_sphere_modifier_desc: "The ministry keeps a quarterly count of the countries where Japanese influence stands at twenty percent or higher and treats the total as an export figure in its own right. Every country on the list widens the audience that already buys Japanese design without being asked to understand it first, which is worth something to the trade delegations and something more to the firms that follow them in. The count is taken once each quarter and the yield moves with it. A sphere that stops growing stops paying."
 JAP_galapagos_sphere_tt: "§YCultural Sphere§!: [?JAP_galapagos_sphere_count|Y0] countries carrying §G20%§! Japanese influence or more, counted each quarter once the §YCool Japan Doctrine§! is adopted. The yield rises by half with §Y$JAP_electronics_superpower$§! and by a further quarter with §Y$JAP_home_electronics$§!."
 JAP_cool_japan_sphere_payout_tt: "Every quarter the ministry counts the countries where Japanese §Yinfluence§! stands at §G20%§! or higher and reports the total as the §YCultural Sphere§!. Each one adds §G+1%§! §Yforeign influence§! and §G+0.2%§! §Yreturn on investment§!, paid out through the §YCultural Sphere§! and growing as the sphere widens. §Y$JAP_electronics_superpower$§! raises the yield by half again, and §Y$JAP_home_electronics$§! raises it by a further quarter.\n-------------\nThis does not touch the §YResearch Drift§!. The doctrine buys reach abroad; it does not close the standards gap at home."
 JAP_creative_industries_office: "Creative Industries Promotion Office"
 JAP_creative_industries_office_desc: "The Ministry of Economy, Trade and Industry stands up the Creative Industries Promotion Office to treat animation, design, fashion, and food as export sectors rather than as culture. The Cool Japan Fund follows with fifty billion yen and a mandate to co-invest rather than subsidise, buying into overseas retail floors, Asian streaming platforms, and distribution ventures no Japanese board would have approved alone. Officials make poor venture capitalists and the Fund posts years of losses, but it takes the first loss on the projects private capital then follows into."
 JAP_visit_japan_campaign: "Visit Japan Campaign"
 JAP_visit_japan_campaign_desc: "The Visit Japan Campaign is relaunched behind a target no ministry believes: forty million foreign visitors a year. The government loosens the visa regime for Asian travellers, exempts cosmetics and medicine from consumption tax at the till, and markets the country on the parts of it that do not translate. Nothing about Japan is made less Japanese to sell it."
 JAP_content_export_offensive: "Content Export Offensive"
 JAP_content_export_offensive_desc: "The Basic Law on Intellectual Property and the Content Promotion Law put animation, games, and manga into statute as strategic assets, and the industry still treats its overseas audience as piracy to be tolerated while fan translators do the distribution. The government builds the legal channel instead: simultaneous release, professional subtitling, and rights holders who negotiate as a bloc rather than one studio at a time. The overseas market is already the larger half of anime revenue, and almost none of it is being collected."
 JAP_washoku_to_the_world: "Washoku to the World"
 JAP_washoku_to_the_world_desc: "With washoku inscribed on the UNESCO Intangible Cultural Heritage list, the government promotes not a dish but a practice: the seasonal ingredient, the arrangement, the New Year table. The ministry's earlier instinct was to police it, and the scheme to certify authentic Japanese restaurants overseas was abandoned once the foreign press christened it the sushi police. Californian rolls and Bangkok ramen sell more Japanese rice, soy, and sake than any inspectorate ever could, and the trillion-yen export target rests on that trade."
 JAP_japan_house_network: "The Japan House Network"
 JAP_japan_house_network_desc: "The JET Programme has sent thousands of young foreigners through Japanese schools and town halls and returned them home fluent, and they now sit in foreign ministries, law firms, and newsrooms. Japan House gives that network a front door: a gallery, a library, a shop, and a restaurant on an expensive street in Sao Paulo, Los Angeles, and London, run by the Foreign Ministry and deliberately empty of flags and policy statements. Applications for Japanese language courses tripled in each city after it opened."
 JAP_gross_national_cool: "Gross National Cool"
 JAP_gross_national_cool_desc: "The Galapagos Syndrome stays: the specifications remain Japanese and the research drift goes on. What the ministries have built instead is a country that earns abroad through what only it can make, the studios, the kitchens, the game houses, the design offices, and the millions who come each year simply to look. The isolation was never cured, only put to work."
 JAP_cool_japan_spirit_kept_tt: "§YGalapagos Syndrome§! §Rremains in place§!. Japan has chosen to sell its difference rather than cure it"
 JAP_electronics_anchor_bonus_tt: "§YElectronics Superpower§!: Japanese hardware carries Japanese content into every market, and the return grows with it"
 JAP_world_integration: "Integration with the World"
 JAP_world_integration_desc: "Japan stops being an island. The standards are rewritten to somebody else's draft, the tariff schedules come down, the ministries stop asking whether a foreign bid is appropriate, and the capital that spent thirty years going around this country starts coming into it. What is surrendered is the protection itself, the captive market that made consumer goods cheap and the wall against foreign influence no rival ever climbed, and Japanese firms must now earn a market they used to own."
 JAP_structural_reform_zones: "Structural Reform Special Zones"
 JAP_structural_reform_zones_desc: "Rather than argue the regulatory code line by line against the ministries that wrote it, the government lets a prefecture or a town apply to be exempted from a rule and then prove that the sky does not fall. Farmers brew below the national minimum volume, joint stock companies run schools and lease farmland, and the National Strategic Special Zones point the same instrument at Tokyo for finance, Fukuoka for startup employment rules, and Kansai for medical trials. It is deregulation retail rather than wholesale, and it is the only method that has ever actually moved anything."
 JAP_corporate_governance_code: "The Corporate Governance Code"
 JAP_corporate_governance_code_desc: "The Ito Review puts a number on the failure: eight per cent return on equity is the minimum a Japanese company must clear to be worth the capital it consumes, and most of them are not clearing it. The Stewardship Code tells the pension funds and the insurers to vote their shares like owners rather than guests, and the Corporate Governance Code follows on comply-or-explain terms. Outside directors rise toward a third of the board and the cross-shareholdings begin to be sold, which does not make Japanese firms foreign so much as legible to anyone willing to buy a share."
 JAP_economic_partnership_agreements: "Economic Partnership Agreements"
 JAP_economic_partnership_agreements_desc: "Agriculture has held the veto over Japanese trade policy since the war, and exporters are now losing tenders to Korean firms on the tariff line alone. Japan closes the largest bilateral agreement either party has ever signed with the European Union, then takes the chair of the Trans-Pacific Partnership after Washington walks out, suspending the American clauses rather than deleting them. RCEP follows and places Japan, China, and South Korea inside a single trade framework for the first time, with the rice protected in every one of them."
 JAP_open_capital_markets: "Open the Capital Markets"
 JAP_open_capital_markets_desc: "Measured against the size of its economy, Japan carries less foreign capital than almost any developed country, held back by the cross-shareholdings, unreadable disclosure, and forty years of officials treating a foreign bid as a problem to be managed. The repairs are unglamorous and almost entirely administrative: Invest Japan desks at JETRO to walk a foreign firm through incorporation, results published in English on the day they appear in Japanese, and a points-based residence track for the people a foreign subsidiary must move here to open at all. The question of people in its full form belongs to §Y$JAP_an_open_nation$§!, and this is the narrower one of whether the capital can find the door."
 JAP_the_third_opening: "The Third Opening"
 JAP_the_third_opening_desc: "Japan abandons the last of the protections that made it an economy apart. The government opens the domestic market to foreign competition, rewrites its standards to international drafts, and lets foreign capital buy in on the same terms as Japanese capital. The captive market and the wall against outside influence are both surrendered for a country that trades as one signatory among many."
 JAP_galapagos_dissolution_tt: "The syndrome lifts. Japan §Rgives up§! the cheap consumer goods a captive market supplied and the high §Rdefence against foreign influence§! that isolation paid for, and §Gsheds§! the research drift, the investment penalties and the ceiling on its own influence abroad:"
 JAP_an_open_nation_bonus_tt: "§Y$JAP_an_open_nation$§!: a country that has already opened to the world's people has far less left to argue about when it opens to the world's capital"
 JAP_zombie_report_credible_tt: "The investigation produced at least a §Ypartial report§!"
 JAP_zombie_investigation_concluded_tt: "The investigation has §Yconcluded§!, whatever it found"
