 module_vls_asm_7: "Missiles antinavires VLS VII"
 module_vls_asm_7_desc: "Les systèmes de missiles antinavires VLS hyperavancés représentent l'apogée de la frappe navale, combinant ciblage intelligent, vitesse extrême et résistance avancée aux contre-mesures pour submerger même les flottes les plus sophistiquées.\n\n§GIndice du concepteur : ce module augmentera l'attaque antinavire et la perforation antinavire, ainsi que les PV, au prix d'un CI accru.§!"
 module_vls_asm_8: "Missiles antinavires VLS VIII"
 module_vls_asm_8_desc: "Les systèmes de missiles antinavires VLS ultra-avancés représentent l'apogée de la frappe navale, combinant ciblage intelligent, vitesse extrême et résistance avancée aux contre-mesures pour submerger même les flottes les plus sophistiquées.\n\n§GIndice du concepteur : ce module augmentera l'attaque antinavire et la perforation antinavire, ainsi que les PV, au prix d'un CI accru.§!"
 module_naval_vls_drone_swarm_1: "Essaim de drones VLS I"
 module_naval_vls_drone_swarm_1_desc: "Les essaims de drones à lancement vertical permettent aux navires de déployer rapidement plusieurs plateformes sans pilote pour la reconnaissance, le leurre et le soutien d'attaque terminale, submergeant les défenses par des profils de vol coordonnés et une détection distribuée.\n\n§GIndice du concepteur : les essaims de drones VLS échangent des effets de saturation à fort impact et une utilité de mission flexible contre une demande accrue en ressources.§!"
