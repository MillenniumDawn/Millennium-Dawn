l_russian:
 slovenia.9.t: "Словения вступает в НАТО"
 slovenia.9.d: "В штаб-квартире НАТО в Брюсселе был поднят словенский флаг вместе с флагами шести других новых членов, что стало крупнейшим расширением альянса в его истории. Спустя тринадцать лет после обретения независимости страна находится под защитой статьи 5."
 slovenia.9.a: "Более безопасное место в мире"
 slovenia.10.t: "Словения вступила в Европейский союз."
 slovenia.10.d: "В полночь были подняты заграждения на австрийской, итальянской и венгерской границах, и под звуки фейерверков и духовых оркестров. Словения вступает в Союз как самая богатая из десяти новых стран-членов, и первые средства уже выделены на строительство дорог и железных дорог."
 slovenia.10.a: "Снова в европейском ядре"
 slovenia.11.t: "Толар уступает место евро."
 slovenia.11.d: "Словения стала первым из новых государств-членов, принявших евро, отказавшись от толара после пятнадцати лет его использования. Переход прошел гладко, и ожидается, что более дешевые заимствования позволят экономике продолжать расти темпами выше среднего показателя по еврозоне."
 slovenia.11.a: "Прощай, толар"
 slovenia.12.t: "Шенгенская зона открывает границы"
 slovenia.12.d: "Словения вошла в Шенгенскую зону, и последние пункты паспортного контроля на австрийском, итальянском и венгерском пунктах пропуска демонтируются. Теперь хорватская граница образует внешнюю границу Союза, охрана которой осуществляется в соответствии со стандартами Брюсселя."
 slovenia.12.a: "Европа без контрольно-пропускных пунктов"
