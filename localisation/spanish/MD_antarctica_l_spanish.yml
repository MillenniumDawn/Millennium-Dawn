 ANTARCTICA_STATION_FIND_OR_CREATE_TEXT_DELAYED: "§YEfectos:§!\nSelecciona tu estación antártica y abre su plano.\n\nSi no controlas ninguna estación, inicia la configuración de la estación en la zona interior.\n- Coste de instalación:§R$15.00b§!(se duplica durante el invierno antártico).\n- Tiempo de instalación:§Y45 días§!(se duplica durante el invierno antártico).\n\nConfiguración actual restante:§Y[?antarctica_station_setup_days_remaining|0]§! dias."
