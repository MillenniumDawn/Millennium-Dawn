 UNSC.200.t: "Tentativa de Influenciar [?sway_target.GetName]"
 UNSC.200.d: "Para obter o resultado que desejamos nesta resolução das §BNações Unidas§! §YConselho de Segurança§! Resolução, precisamos conseguir que mais membros votem conosco ou se abstenham. Para fazê-los mudar de voto, devemos oferecer algo que valha o alinhamento deles nesta votação. Temos várias ofertas diferentes que podemos fazer, mas devemos escolher uma agora e torcer para que aceitem."
 UNSC.200.a: "Oferecer Acordos de Comércio e Investimento"
 UNSC.200.b: "Oferecer Incentivos Financeiros"
 UNSC.200.c: "Oferecer Incentivos Militares"
 UNSC.200.e: "Oferecer Incentivos ao Desenvolvimento"
 UNSC.201.t: "[FROM.GetName] Deseja Influenciar Nosso Voto"
 UNSC.201.d: "[FROM.GetLeader] nos procurou discretamente [THIS.GetLeader], solicitando que mudemos nosso voto para [vote_change_too] na atual resolução do Conselho de Segurança da Organização das Nações Unidas. Eles se ofereceram para nos conceder Acordos Comerciais e Tratados de Investimento Mútuo, além de cancelar quaisquer Embargos ou Bloqueios caso concordemos em mudar nosso voto, a serem concedidos após a alteração do voto. Devemos decidir se concordar com o pedido deles vale a pena para mudar nossa postura no Conselho de Segurança."
 UNSC.201.a: "Aceite a oferta deles"
 UNSC.201.b: "Rejeitar esta Exigência Absurda!"
