 CZE_political_leaders_title_text_text: "§TLíderes Políticos§!"
 CZE_political_leaders_milos_zeman_text_text: "§tMiloš Zeman§!"
 CZE_political_leaders_milos_zeman_TT: "§YMiloš Zeman§!"
 CZE_political_leaders_milos_zeman_delayed_TT: "Em 1992, Miloš Zeman candidatou-se com sucesso como membro do partido ČSSD. Em 1993, foi eleito presidente do partido e, nos anos seguintes, o transformou em um dos principais partidos do país.\n\nO sucesso do ČSSD nas eleições legislativas de 1996 permitiu-lhe impedir que seu rival Václav Klaus e o Partido Democrático Cívico (ODS) formassem um governo de maioria.\n\nEm 1998, o ČSSD venceu as eleições e Miloš Zeman tornou-se Primeiro-Ministro de um governo minoritário, que liderou pelos quatro anos seguintes. Em abril de 2001, foi substituído na liderança por Vladimír Špidla."
 CZE_political_leaders_milos_zeman_effect_text_text: "§G+10%§! §YGanho de Poder Político§!"
 CZE_political_leaders_vladimir_spidla_text_text: "§tVladimír Špidla§!"
 CZE_political_leaders_vladimir_spidla_TT: "§YVladimír Špidla§!"
 CZE_political_leaders_vladimir_spidla_delayed_TT: "Em abril de 2001, Vladimír Špidla tornou-se presidente do ČSSD. Miloš Zeman o considerou para Ministro das Finanças, quando ele deveria substituir Pavel Mertlík.\n\nEm 2001, Vladimír Špidla propôs uma lei para reduzir os salários de autoridades constitucionais, que, no entanto, não foi aprovada devido à oposição de US-DEU, ODS, KDU-ČSL e KSČM.\n\nEle também propôs a transformação da Administração da Seguridade Social Tcheca em uma companhia de seguro social, que separaria a receita dos seguros de saúde e social do orçamento do Estado e, assim, impediria o uso de fundos selecionados para outros fins."
 CZE_political_leaders_vladimir_spidla_effect_text_text: "§G-20%§! §YCusto de Mudança da Alíquota de Imposto§!"
 CZE_political_leaders_stanislav_gross_text_text: "§tStanislav Gross§!"
 CZE_political_leaders_stanislav_gross_TT: "§YStanislav Gross§!"
 CZE_political_leaders_stanislav_gross_delayed_TT: "Stanislav Gross foi um advogado e político tcheco que serviu como primeiro-ministro da República Tcheca. Antes, serviu como ministro do Interior nos gabinetes de Miloš Zeman e Vladimír Špidla, de 2000 a 2004.\n\nDurante sua gestão, vários escândalos na polícia vieram à tona: corrupção entre os mais altos oficiais, irregularidades em licitações e fracasso em solucionar assassinatos em série. Gross alegou que isso se devia a uma melhor capacidade de descobrir tais comportamentos dentro da força policial. Gross também foi criticado por instalar amigos e aliados como executivos em empresas estatais e por usar indevidamente os serviços secretos para fins políticos.\n\nEle trabalhou brevemente para as Ferrovias Estatais Tchecoslovacas (ČSD) como aprendiz de maquinista."
 CZE_political_leaders_stanislav_gross_effect_text_text: "§G-12.5%§! §YGastos com a Polícia§!"
 CZE_political_leaders_jiri_paroubek_text_text: "§tJiří Paroubek§!"
 CZE_political_leaders_jiri_paroubek_TT: "§YJiří Paroubek§!"
 CZE_political_leaders_jiri_paroubek_delayed_TT: "Jiří Paroubek é um político tcheco que foi primeiro-ministro da República Tcheca de abril de 2005 a setembro de 2006.\n\nEm 1979, como membro do comitê executivo do Partido Socialista Tchecoslovaco, um dos partidos fantoches do regime comunista, Jiří Paroubek chamou a atenção da polícia secreta do Estado comunista (StB). Ele se encontrou com agentes três vezes, em reuniões nas quais teria expressado lealdade ao governo comunista e discordância dos grupos de oposição, como a Carta 77."
 CZE_political_leaders_jiri_paroubek_effect_text_text: "§G+15%§! §YGanho de Poder Político§!"
 CZE_political_leaders_bohuslav_sobotka_text_text: "§tBohuslav Sobotka§!"
 CZE_political_leaders_bohuslav_sobotka_TT: "§YBohuslav Sobotka§!"
 CZE_political_leaders_bohuslav_sobotka_delayed_TT: "Bohuslav Sobotka é um político e advogado tcheco que serviu como ministro das Finanças de 2002 a 2006.\n\nApós as eleições legislativas tchecas de 2013, Sobotka foi nomeado primeiro-ministro em 17 de janeiro de 2014 pelo Presidente e, doze dias depois, formou um governo de coalizão de centro-esquerda composto por ČSSD, ANO 2011 e KDU-ČSL. Seu governo introduziu uma série de medidas para combater a evasão fiscal, como o registro eletrônico de vendas e um sistema de controle do IVA, fortaleceu as relações com a China, reformou a polícia, revogou a Lei do Serviço Civil e fez cumprir a proibição de fumar. Ele também entrou em atrito frequente com o presidente Miloš Zeman a respeito da intervenção russa na Ucrânia e das sanções resultantes, da política interna e da renúncia retirada de Sobotka em maio de 2017.\n\nSobotka é o primeiro primeiro-ministro em 15 anos e o terceiro na história da República Tcheca a cumprir seu mandato completo."
 CZE_political_leaders_bohuslav_sobotka_effect_text_text: "§G+10%§! §YReceita de Impostos§!"
 CZE_political_leaders_jan_hamacek_text_text: "§tJan Hamáček§!"
 CZE_political_leaders_jan_hamacek_TT: "§YJan Hamáček§!"
 CZE_political_leaders_jan_hamacek_delayed_TT: "Jan Hamáček foi eleito pela primeira vez para a Câmara dos Deputados nas eleições de 2006. Durante seu tempo no parlamento, foi vice-presidente da Comissão de Relações Exteriores, chefiou a delegação tcheca na Assembleia Parlamentar da OTAN e atuou na Comissão de Assuntos Europeus.\n\nFoi nomeado Ministro do Interior e também atuou como Ministro das Relações Exteriores interino de junho a outubro de 2018.\n\nEm agosto de 2018, Hamáček ajudou a negociar a libertação de dois trabalhadores de um grupo humanitário alemão na Síria e viajou a Damasco para a entrega dos trabalhadores."
 CZE_political_leaders_jan_hamacek_effect_text_text: "§G+15%§! §YGanho de Opinião§!"
 CZE_political_leaders_michal_smarda_text_text: "§tMichal Šmarda§!"
 CZE_political_leaders_michal_smarda_TT: "§YMichal Šmarda§!"
 CZE_political_leaders_michal_smarda_delayed_TT: "Michal Šmarda é um político tcheco, desde dezembro de 2021 presidente do SOCDEM. Em 2006 foi eleito pela primeira vez para o conselho de Nové Město na Moravě e, em 2010, tornou-se seu prefeito. Em 2016, atuou brevemente como representante da Região de Vysočina.\n\n Foi candidato a Ministro da Cultura da República Tcheca."
 CZE_political_leaders_michal_smarda_effect_text_text: "§G+10.5%§! §YFator de Estabilidade§!"
 CZE_political_leaders_jan_kasal_text_text: "§3Jan Kasal§!"
 CZE_political_leaders_jan_kasal_TT: "§YJan Kasal§!"
 CZE_political_leaders_jan_kasal_delayed_TT: "Jan Kasal estudou a religião católica na Universidade Carolina. Tornou-se membro do Conselho Nacional Tcheco pelo ČSL e é o principal representante do KDU-ČSL e da ala conservadora do partido."
 CZE_political_leaders_jan_kasal_effect_text_text: "§G+7.5%§! §YFator de Estabilidade§!"
 CZE_political_leaders_cyril_svoboda_text_text: "§3Cyril Svoboda§!"
 CZE_political_leaders_cyril_svoboda_TT: "§YCyril Svoboda§!"
 CZE_political_leaders_cyril_svoboda_delayed_TT: "Durante a carreira política de Cyril Svoboda, ele ocupou vários cargos ministeriais, incluindo Vice-Primeiro-Ministro (julho de 2002 - agosto de 2004) e Ministro das Relações Exteriores (julho de 2002 - setembro de 2006). Fundou a Academia Diplomática em Praga em 2011 e atualmente leciona em várias universidades de Praga.\n\nQuando o KDU-ČSL formou uma coalizão com o ODS e o Partido Verde em 2007, Svoboda tornou-se ministro sem pasta e presidente do Conselho Legislativo do Governo. Durante a 'renovação' do Governo em janeiro de 2009, tornou-se Ministro do Desenvolvimento Regional."
 CZE_political_leaders_cyril_svoboda_effect_text_text: "§G+12.5%§! §YGanho de Poder Político§!"
 CZE_political_leaders_jiri_cunek_text_text: "§3Jiří Čunek§!"
 CZE_political_leaders_jiri_cunek_TT: "§YJiří Čunek§!"
 CZE_political_leaders_jiri_cunek_delayed_TT: "Jiří Čunek é um político tcheco que ingressou no KDU-ČSL em 1990. De janeiro a novembro de 2007 e depois novamente de abril de 2008 a janeiro de 2009, foi primeiro vice-primeiro-ministro do segundo governo de Mirek Topolánek e Ministro do Desenvolvimento Regional da República Tcheca.\n\nFormou-se na Faculdade de Engenharia Mecânica em Gottwaldov e depois ingressou na Zbrojovka Vsetín, primeiro como técnico de segurança e, a partir de 1993, como chefe de segurança do trabalho."
 CZE_political_leaders_jiri_cunek_effect_text_text: "§G+10%§! §YVelocidade de Construção§!"
 CZE_political_leaders_pavel_belobradek_text_text: "§3Pavel Bělobrádek§!"
 CZE_political_leaders_pavel_belobradek_TT: "§YPavel Bělobrádek§!"
 CZE_political_leaders_pavel_belobradek_delayed_TT: "Pavel Bělobrádek é um político tcheco, veterinário e funcionário do governo local, de 2010 a 2019 presidente do KDU-ČSL e, de 2014 a 2017, vice-primeiro-ministro.\n\nEm janeiro de 2014, Pavel Bělobrádek tornou-se o candidato do KDU-ČSL ao cargo de Vice-Primeiro-Ministro para Ciência, Pesquisa e Inovação no Gabinete de Bohuslav Sobotka. Também defendeu seu cargo nas eleições municipais tchecas de 2014."
 CZE_political_leaders_pavel_belobradek_effect_text_text: "§G+12.5%§! §YVelocidade de Pesquisa§!"
 CZE_political_leaders_marek_vyborny_text_text: "§3Marek Výborný§!"
 CZE_political_leaders_marek_vyborny_TT: "§YMarek Výborný§!"
 CZE_political_leaders_marek_vyborny_delayed_TT: "Marek Výborný é um político tcheco que atua como Ministro da Agricultura da República Tcheca no Gabinete de Petr Fiala desde junho de 2023.\n\nVýborný estudou história e teologia na Universidade Palacký, em Olomouc. Em 2001, começou no Gymnázium de Pardubice, lecionando história, noções de ciências sociais e latim. De 1º de agosto de 2012 a 31 de março de 2018, foi diretor do Mozart Grammar School.\n\n Desde outubro de 2017 é membro da Câmara dos Deputados do Parlamento da República Tcheca pelo KDU-ČSL."
 CZE_political_leaders_marek_vyborny_effect_text_text: "§G+15%§! §YProdutividade Agrícola§!"
 CZE_political_leaders_marian_jurecka_text_text: "§3Marian Jurečka§!"
 CZE_political_leaders_marian_jurecka_TT: "§YMarian Jurečka§!"
 CZE_political_leaders_marian_jurecka_delayed_TT: "Marian Jurečka é um político tcheco que atua como Vice-Primeiro-Ministro e Ministro do Trabalho e Assuntos Sociais desde 17 de dezembro de 2021 e foi Ministro do Meio Ambiente de novembro de 2022 a março de 2023, ambos no Gabinete de Petr Fiala. Anteriormente, foi Ministro da Agricultura no Gabinete de Bohuslav Sobotka, de 2014 a 2017."
 CZE_political_leaders_marian_jurecka_effect_text_text: "§G+6%§! §YGanho de Produtividade§!"
 CZE_political_leaders_karel_kuhnl_text_text: "§GKarel Kühnl§!"
 CZE_political_leaders_karel_kuhnl_TT: "§YKarel Kühnl§!"
 CZE_political_leaders_karel_kuhnl_delayed_TT: "No período de 1993 a 1997, Karel Kühnl foi embaixador tcheco no Reino Unido e, até 1995, também na Irlanda. De 1997 a 1998, serviu como Ministro da Indústria e Comércio da República Tcheca.\n\nNos anos de 1998 a 2006, exerceu o mandato de deputado pela US-DEU, que presidiu nos anos de 2000 a 2001.\n\nNo início do novo milênio, Karel Kühnl esteve fortemente envolvido no projeto Čtyřkoalice."
 CZE_political_leaders_karel_kuhnl_effect_text_text: "§G+15%§! §YFator de Opinião Comercial§!"
 CZE_political_leaders_hana_marvanova_text_text: "§GHana Marvanová§!"
 CZE_political_leaders_hana_marvanova_TT: "§YHana Marvanová§!"
 CZE_political_leaders_hana_marvanova_delayed_TT: "Hana Kordová Marvanová é uma advogada e política tcheca, ex-vice-presidente da Câmara dos Deputados do Parlamento da República Tcheca.\n\nEm 2018, foi eleita para o Conselho Municipal de Praga como membro sem partido do movimento STAN (Prefeitos e Independentes), além de vereadora e comissária de Legislação, Administração Pública e Apoio à Habitação. Em 2014, atuou brevemente como vice da Ministra da Justiça, Helena Válková.\n\nÉ fundadora de várias organizações e iniciativas ativistas, como a Associação Independente pela Paz e a iniciativa Público Contra a Corrupção."
 CZE_political_leaders_hana_marvanova_effect_text_text: "§G+11.5%§! §YGanho de Poder Político§!"
 CZE_political_leaders_ivan_pilip_text_text: "§GIvan Pilip§!"
 CZE_political_leaders_ivan_pilip_TT: "§YIvan Pilip§!"
 CZE_political_leaders_ivan_pilip_delayed_TT: "Ivan Pilip é um político e economista tcheco que foi ministro das Finanças de junho de 1997 a julho de 1998, depois de ter sido Ministro da Educação, Juventude e Esportes de 1994 a 1997.\n\nPilip formou-se economista antes de entrar na política pelo Partido Democrata-Cristão (KDS) após a queda do comunismo na República Tcheca. Pilip atuou no governo de 1992 a 1998, liderando o KDS antes de sua fusão com o Partido Democrático Cívico. Pilip esteve entre os deputados que se separaram dos Democratas Cívicos para formar a União da Liberdade e, em 1998, passou à oposição.\n\nPilip foi detido em Cuba no início de 2001 por quase um mês, após se encontrar com opositores do governo cubano, e foi libertado após pressão internacional sobre Cuba. Perdeu sua cadeira na Câmara dos Deputados em 2002, mas serviu como líder interino da União da Liberdade por um período depois disso, antes de atuar como Vice-Presidente do Banco Europeu de Investimento de 2004 a 2007."
 CZE_political_leaders_ivan_pilip_effect_text_text: "§G+10%§! §YGanho de Impostos§!"
 CZE_political_leaders_petr_mares_text_text: "§GPetr Mareš§!"
 CZE_political_leaders_petr_mares_TT: "§YPetr Mareš§!"
 CZE_political_leaders_petr_mares_delayed_TT: "Petr Mareš é um diplomata e ex-político tcheco, na virada dos séculos XX e XXI deputado pela União da Liberdade e, em 2003-2004, presidente desse partido e vice-primeiro-ministro de Vladimír Špidla.\n\nDesde 1990 lecionou na Faculdade de Ciências Sociais da Universidade Carolina.\n\nNas eleições de 1998, foi eleito para a Câmara dos Deputados pela União da Liberdade (circunscrição da Região da Boêmia Oriental). Foi presidente da comissão parlamentar de ciência, educação, cultura, juventude e educação física e, em 2001-2002, também da comissão eleitoral. Permaneceu no parlamento até as eleições de 2002."
 CZE_political_leaders_petr_mares_effect_text_text: "§G+10.5%§! §YVelocidade de Pesquisa§!"
 CZE_political_leaders_pavel_nemec_text_text: "§GPavel Němec§!"
 CZE_political_leaders_pavel_nemec_TT: "§YPavel Němec§!"
 CZE_political_leaders_pavel_nemec_delayed_TT: "Pavel Němec é um advogado e ex-político tcheco da União da Liberdade (nos anos de 2004 a 2006 seu presidente), na virada dos séculos XX e XXI deputado, nos anos de 2002 a 2004 Ministro do Desenvolvimento Regional e, depois, até 2006, Ministro da Justiça e Vice-Primeiro-Ministro de Stanislav Gross e Jiří Paroubek.\n\nComo parlamentar, foi coapresentador do código de execução, possibilitando assim a criação dos oficiais de justiça e da Câmara de Executores e, como Ministro da Justiça, fundiu a Escola de Justiça de Kroměříž com a Academia de Justiça, criando assim uma instituição educacional departamental para os funcionários civis do Judiciário."
 CZE_political_leaders_pavel_nemec_effect_text_text: "§G-15%§! §YCusto de Mudança da Corrupção§!"
 CZE_political_leaders_jan_hadrava_text_text: "§GJan Hadrava§!"
 CZE_political_leaders_jan_hadrava_TT: "§YJan Hadrava§!"
 CZE_political_leaders_jan_hadrava_delayed_TT: "Jan Hadrava é um político tcheco, após a Revolução de Veludo deputado tchecoslovaco na Câmara das Nações da Assembleia Federal pelo Fórum Cívico.\n\nTrabalhou como técnico têxtil na fábrica Krajka Libavské Údolí e depois como fornecedor e operário no centro cultural de Sokolov. No final da década de 1970, ele e seus amigos criaram um clube de poesia onde também se apresentava literatura não oficial, o que atraiu o interesse da Segurança do Estado."
 CZE_political_leaders_jan_hadrava_effect_text_text: "§G+8.5%§! §YVelocidade de Construção§!"
 CZE_political_leaders_jan_cerny_text_text: "§GJan Černý§!"
 CZE_political_leaders_jan_cerny_TT: "§YJan Černý§!"
 CZE_political_leaders_jan_cerny_delayed_TT: "Jan Černý é um veterinário e político tcheco, na década de 1990 deputado do Conselho Nacional Tcheco e da Câmara dos Deputados pelo ODS, depois pela União da Liberdade e ministro do desenvolvimento regional no governo de Josef Tošovský, em 2007-2011 último presidente da União da Liberdade. Desde 2020, é prefeito de Kostelec nad Černými lesy."
 CZE_political_leaders_jan_cerny_effect_text_text: "§G+6%§! §YCrescimento de Produtividade§!"
 CZE_political_leaders_andrej_babis_text_text: "§2Andrej Babiš§!"
 CZE_political_leaders_andrej_babis_TT: "§YAndrej Babiš§!"
 CZE_political_leaders_andrej_babis_delayed_TT: "Andrej Babiš é o primeiro e, até recentemente, o único líder do partido ANO. Em 2014-2017, serviu como Primeiro Vice-Primeiro-Ministro e Ministro das Finanças no gabinete de Bohuslav Sobotka. É o fundador do grande conglomerado Agrofert. Por usar em seu benefício seu considerável poder econômico, político e midiático, é frequentemente chamado de oligarca.\n\nAtualmente, a Agrofert é uma sociedade anônima e a maior holding agrícola, alimentícia e química da Tchéquia. A holding controla mais de 230 empresas juridicamente independentes, principalmente na República Tcheca e na Eslováquia."
 CZE_political_leaders_andrej_babis_effect_text_text: "§G+17.5%§! §YReceita de Imposto Corporativo§!"
 CZE_political_leaders_karel_schwarzenberg_text_text: "§CKarel Schwarzenberg§!"
 CZE_political_leaders_karel_schwarzenberg_TT: "§YKarel Schwarzenberg§!"
 CZE_political_leaders_karel_schwarzenberg_delayed_TT: "Karel Schwarzenberg é cofundador e primeiro presidente do TOP 09. Trabalhou como chefe do gabinete do presidente Václav Havel, foi Ministro das Relações Exteriores e primeiro Vice-Primeiro-Ministro.\n\nKarel Schwarzenberg foi defensor da restituição eclesiástica, isto é, da devolução de bens confiscados das igrejas pelos comunistas após 1948. Também promoveu a política verde: em 2005 votou a favor da polêmica lei de apoio à energia renovável, mas ao mesmo tempo rejeitou o chamado ecoterrorismo.\n\nDeu grande ênfase ao patriotismo tcheco pessoal e por muitos anos lutou pelos direitos humanos"
 CZE_political_leaders_karel_schwarzenberg_effect_text_text: "§G+4§! §YCrescimento de Produtividade§!"
 CZE_political_leaders_miroslav_kalousek_text_text: "§3Miroslav Kalousek§!"
 CZE_political_leaders_miroslav_kalousek_TT: "§YMiroslav Kalousek§!"
 CZE_political_leaders_miroslav_kalousek_delayed_TT: "Cofundador e ex-presidente do TOP 09 e, antes disso, do KDU-ČSL. Foi Ministro das Finanças.\n\nFoi consultor especialista do Vice-Primeiro-Ministro, diretor dos sindicatos de assessores do Vice-Primeiro-Ministro da Tchecoslováquia e Vice-Ministro da Defesa, responsável pelos processos de orçamento e aquisições."
 CZE_political_leaders_miroslav_kalousek_effect_text_text: "§G+12.5§! §YGanho de Impostos§!"
 CZE_political_leaders_jiri_pospisil_text_text: "§CJiří Pospíšil§!"
 CZE_political_leaders_jiri_pospisil_TT: "§YJiří Pospíšil§!"
 CZE_political_leaders_jiri_pospisil_delayed_TT: "Jiří Pospíšil ocupou o cargo de Ministro da Justiça, primeiro nos anos de 2006 a 2009 no primeiro e segundo governos de Mirek Topolánek e, novamente, nos anos de 2010 a 2012 no gabinete de Petr Nečas.\n\nEm 27 de junho de 2012, o presidente Václav Klaus o demitiu do cargo de Ministro da Justiça por sugestão do Primeiro-Ministro Petr Nečas. O motivo oficial foi a falha gerencial na condução do ministério. Vários políticos e especialistas descreveram esse motivo como um pretexto e citaram como razão real a intenção de Pospíšil de nomear Lenka Bradáčová para o cargo de procuradora-chefe em Praga.\n\nVárias manifestações foram organizadas contra a demissão de Pospíšil e algumas organizações não governamentais anticorrupção pediram a renúncia do Primeiro-Ministro devido à demissão do Ministro da Justiça."
 CZE_political_leaders_jiri_pospisil_effect_text_text: "§G+20%§! §YGanho de Poder Político§!"
 CZE_political_leaders_marketa_pekarova_text_text: "§CMarkéta Pekarová§!"
 CZE_political_leaders_marketa_pekarova_TT: "§YMarkéta Pekarová Adamová§!"
 CZE_political_leaders_marketa_pekarova_delayed_TT: "Em 2009, Markéta Pekarová Adamová ingressou no recém-criado TOP 09. Até então, não atuava ativamente na política.\n\nFoi eleita para o Conselho da Cidade de Praga 8 como vereadora para uma vaga em aberto. A área social e a prevenção às drogas ficaram sob sua responsabilidade. Desde maio de 2012, sua responsabilidade se ampliou para incluir a área de fundos europeus.\n\nPor outro lado, apoiou a aceitação de refugiados em base voluntária e criticou o governo de Andrej Babiš por 'recusar-se a ajudar nossos parceiros da UE com a aceitação de sequer algumas dezenas de crianças órfãs e o alívio dos campos de refugiados superlotados.'"
 CZE_political_leaders_marketa_pekarova_effect_text_text: "§G-14%§! §YCusto de Gastos com a Polícia§!"
 CZE_political_leaders_vaclav_klaus_text_text: "§1Václav Klaus§!"
 CZE_political_leaders_vaclav_klaus_TT: "§YVáclav Klaus§!"
 CZE_political_leaders_vaclav_klaus_delayed_TT: "Durante a era comunista, Václav Klaus trabalhou como bancário e analista de previsões. Após a queda do comunismo em novembro de 1989, tornou-se Ministro das Finanças no governo de unidade nacional. Em 1991, Václav Klaus foi o principal cofundador do Partido Democrático Cívico (ODS).\n\nFoi eleito Presidente da República Tcheca em fevereiro de 2003 e reeleito em 2008 para um segundo mandato de cinco anos.\n\nSua presidência foi marcada por muitas controvérsias devido às suas opiniões fortes sobre temas que vão da negação do aquecimento global ao euroceticismo, e por uma ampla anistia declarada nos últimos meses de mandato, que levou ao seu indiciamento pelo Senado tcheco sob acusação de alta traição."
 CZE_political_leaders_vaclav_klaus_effect_text_text: "§G-15%§! §YCusto de Mudança da Corrupção§!"
 CZE_political_leaders_mirek_topolanek_text_text: "§1Mirek Topolánek§!"
 CZE_political_leaders_mirek_topolanek_TT: "§YMirek Topolánek§!"
 CZE_political_leaders_mirek_topolanek_delayed_TT: "Mirek Topolánek apresentou em outubro de 2007 as chamadas Cinco Prioridades do Primeiro-Ministro. Tratava-se de uma declaração de governo que inclui 10 áreas de programa, compostas por 190 projetos dos Objetivos do Programa do Governo ao Longo do Mandato Eleitoral aceitos pelo governo. Para facilitar a orientação e a comunicação com os cidadãos, Mirek Topolánek resumiu as 10 áreas de programa em Cinco Prioridades do Primeiro-Ministro: Finanças Públicas Saudáveis, Estado Moderno e Eficiente, Cidadão Seguro em um País Seguro, Remoção de Barreiras, Promoção da Ciência e da Educação.\n\nÉ um ardoroso defensor do sistema de defesa antimísseis proposto pelo governo Bush, ao qual os russos se opuseram veementemente e que o governo Obama sugeriu que talvez não precisasse ser construído se a Rússia cooperasse em convencer o Irã, país contra cujas ambições nucleares o sistema de defesa deveria proteger, a interromper o desenvolvimento de seu programa nuclear e seu apoio a organizações terroristas no Oriente Médio.\n\nApós deixar a política em 2010, Topolánek tem atuado na indústria de energia elétrica como um lobista vocal da indústria de combustíveis fósseis."
 CZE_political_leaders_mirek_topolanek_effect_text_text: "§G+10%§! §YGanho de Poder Político§!"
 CZE_political_leaders_petr_necas_text_text: "§1Petr Nečas§!"
 CZE_political_leaders_petr_necas_TT: "§YPetr Nečas§!"
 CZE_political_leaders_petr_necas_delayed_TT: "Petr Nečas obteve o doutorado em ciências naturais, em física, na Universidade Masaryk em Brno. Em 1991, foi um dos cofundadores do ODS.\n\nO gabinete liderado por Nečas aprovou leis sobre a restituição das propriedades das igrejas cristãs, a reforma previdenciária e a reforma das universidades. Todas elas eram profundamente impopulares e muito criticadas.\n\nFoi elogiado pelas economias feitas para conter a dívida nacional da República Tcheca. Seus críticos frequentemente o acusam de corrupção e criticam sua incapacidade de resolver os problemas de saúde. Em maio de 2023, Nečas foi condenado por perjúrio e multado, tornando-se o primeiro primeiro-ministro da história considerado culpado de um crime."
 CZE_political_leaders_petr_necas_effect_text_text: "§G+10%§! §YVelocidade de Pesquisa§!"
 CZE_political_leaders_petr_fiala_text_text: "§1Petr Fiala§!"
 CZE_political_leaders_petr_fiala_TT: "§YPetr Fiala§!"
 CZE_political_leaders_petr_fiala_delayed_TT: "Petr Fiala é um político e cientista político tcheco que é primeiro-ministro da República Tcheca desde novembro de 2021 e líder do ODS desde 2014. Anteriormente, serviu como Ministro da Educação, Juventude e Esportes de 2012 a 2013. Antes de entrar na política, foi reitor da Universidade Masaryk.\n\nEm 2020, Fiala liderou a iniciativa de uma aliança eleitoral de centro-direita com o KDU-ČSL e o TOP 09, conhecida como Spolu. Tornou-se seu candidato ao cargo de primeiro-ministro nas eleições legislativas tchecas de 2021, com uma plataforma de centro-direita pró-Ocidente e pró-Europa, focada na responsabilidade fiscal e em relações mais próximas com a OTAN como parte do atlantismo.\n\nA aliança superou as pesquisas de opinião iniciais e ficou em primeiro lugar na eleição, embora com uma cadeira a menos na Câmara dos Deputados do que o segundo colocado, o ANO 2011."
 CZE_political_leaders_petr_fiala_effect_text_text: "§G+17.5%§! §YVelocidade de Pesquisa§!"
 CZE_political_leaders_miroslav_grebenicek_text_text: "§RMiroslav Grebeníček§!"
 CZE_political_leaders_miroslav_grebenicek_TT: "§YMiroslav Grebeníček§!"
 CZE_political_leaders_miroslav_grebenicek_delayed_TT: "Miroslav Grebeníček formou-se na Faculdade de Pedagogia e Filosofia da Universidade Jan Evangelista Purkyně em Brno; em 1968, esteve entre os estudantes que protestaram contra a entrada das tropas do Pacto de Varsóvia.\n\nApós os estudos, trabalhou como professor e, a partir de 1975, lecionou na Universidade Jan Evangelista Purkyně em Brno (com foco na história dos séculos XIX e XX, na história do movimento operário e na teoria econômica).\n\nIngressou no Partido Comunista em 1975."
 CZE_political_leaders_miroslav_grebenicek_effect_text_text: "§G+10%§! §YVelocidade de Pesquisa§!"
 CZE_political_leaders_vojtech_filip_text_text: "§RVojtěch Filip§!"
 CZE_political_leaders_vojtech_filip_TT: "§YVojtěch Filip§!"
 CZE_political_leaders_vojtech_filip_delayed_TT: "Vojtěch Filip é um ex-político tcheco, ex-presidente do Partido Comunista da Boêmia e Morávia, nos anos de 2002 a 2010 e novamente em 2013 a 2021 vice-presidente da Câmara dos Deputados do Parlamento da República Tcheca, nos anos de 1996 a 2021 deputado, no início da década de 1990 membro da Câmara do Povo da Assembleia Federal, colaborador remunerado da StB. Desde fevereiro de 2022, presidente do Conselho da Câmara Mista Tcheco-Chinesa de Comércio e Indústria.\n\nEm 1983, ingressou no Partido Comunista. A partir de julho de 1985, manteve contato com membros da Segurança do Estado (StB), inicialmente como candidato à cooperação secreta 'Vojtěch'. Em 15 de abril de 1986, foi recrutado como colaborador ideológico do major da StB Lubomír Antal sob o codinome 'Falmer'."
 CZE_political_leaders_vojtech_filip_effect_text_text: "§G+15%§! §YGanho de Poder Político§!"
 CZE_political_leaders_katerina_konecna_text_text: "§RKateřina Konečná§!"
 CZE_political_leaders_katerina_konecna_TT: "§YKateřina Konečná§!"
 CZE_political_leaders_katerina_konecna_delayed_TT: "Kateřina Konečná é uma política tcheca, de 2002 a 2014 deputada do Parlamento da República Tcheca pela Região da Morávia-Silésia, membro do Partido Comunista da Boêmia e Morávia, onde ocupa o cargo de ministra-sombra para o departamento de política europeia e UE.\n\nEm 1999, ingressou na Faculdade de Economia e Administração da Universidade Masaryk. Ali estudou economia nacional e, após ser eleita para a Câmara dos Deputados em 2002, passou ao estudo combinado de economia pública e administração, no qual se formou em 2003 com bacharelado.\n\nEm 2009, recebeu o título de engenheira na Universidade de Finanças e Administração. Quatro anos depois, concluiu sua especialização jurídica em administração pública na Faculdade de Direito da Universidade Masaryk e obteve um segundo bacharelado."
 CZE_political_leaders_katerina_konecna_effect_text_text: "§G+8%§! §YGanho de Produtividade§!"
 CZE_political_leaders_ods_title_text_text: "§1Občanská Demokratická Strana§!"
 CZE_political_leaders_ods_description_text_text: "[CZE_political_leaders_ods_description_text_text]"
 CZE_political_leaders_ods_description_text_2000: "Popularidade do partido: [?THIS.party_pop_array^1|%1Y]\n§gEfeitos atuais da popularidade do partido:§!\n£foreign_influence_defense_modifier_texticon §YDefesa Contra Influência Estrangeira:§! [?CZE_ods_foreign_influence_defense_modifier|%.2+]\n£construction_speed_texticon §YFator de Velocidade de Produção:§! [?CZE_ods_prod_speed_building_factor|%.2+]\n\nA situação do §1ODS§! era instável. Devido à divisão na coalizão com o ODA e o §3KDU-ČSL§!, a §GUnião da Liberdade (depois US-DEU)§! recusou-se a apoiar o §1ODS§!, impedindo-o de obter maioria. O §1ODS§! assinou o Acordo de Oposição, que obrigava o partido a dar confiança e manter um governo do §tČSSD§! sob Miloš Zeman."
 CZE_political_leaders_ods_description_text_2002: "Popularidade do partido: [?THIS.party_pop_array^1|%1Y]\n§gEfeitos atuais da popularidade do partido:§!\n£foreign_influence_defense_modifier_texticon §YDefesa Contra Influência Estrangeira:§! [?CZE_ods_foreign_influence_defense_modifier|%.2+]\n£construction_speed_texticon §YFator de Velocidade de Produção:§! [?CZE_ods_prod_speed_building_factor|%.2+]\n\nNas eleições legislativas de 2002, o §1ODS§! decidiu focar no crescimento da economia e na melhoria dos gastos sociais. Nesse meio tempo, escolheu Václav Klaus para presidente da República Tcheca e ganhou grande popularidade antes das próximas eleições."
 CZE_political_leaders_ods_description_text_2006: "Popularidade do partido: [?THIS.party_pop_array^1|%1Y]\n§gEfeitos atuais da popularidade do partido:§!\n£foreign_influence_defense_modifier_texticon §YDefesa Contra Influência Estrangeira:§! [?CZE_ods_foreign_influence_defense_modifier|%.2+]\n£construction_speed_texticon §YFator de Velocidade de Produção:§! [?CZE_ods_prod_speed_building_factor|%.2+]\n\nDesta vez, o §1ODS§! foca bastante em reformas dos gastos sociais e na cooperação com o §7Strana Zelených§!, que o ajuda a melhorar o setor de geração de energia renovável. Além disso, mirará a reforma tributária e grandes preparativos para as eleições do senado de 2008, com forte foco em gastos sociais e corrupção."
 CZE_political_leaders_ods_description_text_2010: "Popularidade do partido: [?THIS.party_pop_array^1|%1Y]\n§gEfeitos atuais da popularidade do partido:§!\n£foreign_influence_defense_modifier_texticon §YDefesa Contra Influência Estrangeira:§! [?CZE_ods_foreign_influence_defense_modifier|%.2+]\n£construction_speed_texticon §YFator de Velocidade de Produção:§! [?CZE_ods_prod_speed_building_factor|%.2+]\n\nPetr Nečas está prestes a assumir a liderança do partido. O §1ODS§! está pronto para usar sua popularidade para mudar a composição do parlamento e colocar seus quadros à frente do setor do meio ambiente. Por causa desses planos, o §1ODS§! focará em aumentar a produtividade agrícola, melhorar a gestão de suprimentos e instalar novos geradores de energia renovável."
 CZE_political_leaders_ods_description_text_2013: "Popularidade do partido: [?THIS.party_pop_array^1|%1Y]\n§gEfeitos atuais da popularidade do partido:§!\n£foreign_influence_defense_modifier_texticon §YDefesa Contra Influência Estrangeira:§! [?CZE_ods_foreign_influence_defense_modifier|%.2+]\n£construction_speed_texticon §YFator de Velocidade de Produção:§! [?CZE_ods_prod_speed_building_factor|%.2+]\n\nO ex-reitor da Universidade Masaryk e ministro Petr Fiala foi eleito presidente. Sob sua liderança, o §1ODS§! poderá construir novas fábricas, aumentar a extração de recursos e priorizar a energia nuclear em vez dos combustíveis fósseis."
 CZE_political_leaders_ods_description_text_2017: "Popularidade do partido: [?THIS.party_pop_array^1|%1Y]\n§gEfeitos atuais da popularidade do partido:§!\n£foreign_influence_defense_modifier_texticon §YDefesa Contra Influência Estrangeira:§! [?CZE_ods_foreign_influence_defense_modifier|%.2+]\n£construction_speed_texticon §YFator de Velocidade de Produção:§! [?CZE_ods_prod_speed_building_factor|%.2+]\n\nBom Líder, Programa Certo, Direita Forte. Com essas palavras o §1ODS§! iniciou a campanha das eleições de 2017. Está focado em bolsas de pesquisa e na expansão da região urbana. O partido planeja construir novas fábricas, pesquisar novas tecnologias e se preparar para a coalizão §0SPOLU§!."
 CZE_political_leaders_ods_description_text_2021: "Popularidade do partido: [?THIS.party_pop_array^1|%1Y]\n§gEfeitos atuais da popularidade do partido:§!\n£foreign_influence_defense_modifier_texticon §YDefesa Contra Influência Estrangeira:§! [?CZE_ods_foreign_influence_defense_modifier|%.2+]\n£construction_speed_texticon §YFator de Velocidade de Produção:§! [?CZE_ods_prod_speed_building_factor|%.2+]\n\nO §1ODS§! formou um governo de coalizão com o §3KDU-ČSL§! e o §CTOP 09§!. A §0SPOLU§! foi criada e está pronta para convidar os Piráti a Starostové muito em breve. Petr Fiala tornou-se o novo líder da coalizão e preparará 5 novos políticos para integrar o governo."
 CZE_political_leaders_cssd_title_text_text: "§tČeská Strana Sociálně Demokratická§!"
 CZE_political_leaders_cssd_description_text_text: "[CZE_political_leaders_cssd_description_text_text]"
 CZE_political_leaders_cssd_description_text_2000: "Popularidade do partido: [?THIS.party_pop_array^3|%1Y]\n§gEfeitos atuais da popularidade do partido:§!\n£western_outlook_campaign_cost_modifier_texticon  §YApoio Democrata Diário:§! [?CZE_cssd_democratic_drift|+]\n£GFX_stability_popularity_texticon §YEstabilidade:§! [?CZE_stab_factor|%.2+]\n\nGraças a Zeman, o partido §tČSSD§! ganhou rapidamente enorme popularidade antes das eleições de 1998.\nO §tČSSD§! venceu as eleições parlamentares e foi o primeiro a governar a República Tcheca no novo milênio. De forma controversa, governou com o maior partido de oposição, cujas visões diferiam significativamente das suas, o §1ODS§!."
 CZE_political_leaders_cssd_description_text_2002: "Popularidade do partido: [?THIS.party_pop_array^3|%1Y]\n§gEfeitos atuais da popularidade do partido:§!\n£western_outlook_campaign_cost_modifier_texticon  §YApoio Democrata Diário:§! [?CZE_cssd_democratic_drift|+]\n£GFX_stability_popularity_texticon §YEstabilidade:§! [?CZE_stab_factor|%.2+]\n\nSubstituir Miloš Zeman por Vladimír Špidla conseguiu pôr fim aos escândalos do governo anterior. Hoje, ele precisa escolher se deve deixar o partido ou continuar seu programa, que atrairá investidores estrangeiros e modernizará o setor de escritórios. Se decidir sair, Stanislav Gross virá com seu programa anti-§RKSČM§!."
 CZE_political_leaders_cssd_description_text_2006: "Popularidade do partido: [?THIS.party_pop_array^3|%1Y]\n§gEfeitos atuais da popularidade do partido:§!\n£western_outlook_campaign_cost_modifier_texticon  §YApoio Democrata Diário:§! [?CZE_cssd_democratic_drift|+]\n£GFX_stability_popularity_texticon §YEstabilidade:§! [?CZE_stab_factor|%.2+]\n\nAntes das eleições parlamentares de 2006, o §tČSSD§! voltou a enfrentar muitos casos. Focará em reformas da corrupção e da burocracia. Além disso, as eleições do senado de 2008 se aproximam e todos os olhos estão voltados para esse evento. O §tČSSD§! terá de enfrentar o §1ODS§!. O §tČSSD§! focará fortemente no crescimento da produtividade."
 CZE_political_leaders_cssd_description_text_2010: "Popularidade do partido: [?THIS.party_pop_array^3|%1Y]\n§gEfeitos atuais da popularidade do partido:§!\n£western_outlook_campaign_cost_modifier_texticon  §YApoio Democrata Diário:§! [?CZE_cssd_democratic_drift|+]\n£GFX_stability_popularity_texticon §YEstabilidade:§! [?CZE_stab_factor|%.2+]\n\nEm 2011, Bohuslav Sobotka tornou-se presidente do §tČSSD§!. O novo programa visa o setor de energia renovável, de todas as fontes possíveis, às custas da produção de energia a partir de combustíveis fósseis. Esse programa também visa novas verbas de infraestrutura e construção intensificada."
 CZE_political_leaders_cssd_description_text_2013: "Popularidade do partido: [?THIS.party_pop_array^3|%1Y]\n§gEfeitos atuais da popularidade do partido:§!\n£western_outlook_campaign_cost_modifier_texticon  §YApoio Democrata Diário:§! [?CZE_cssd_democratic_drift|+]\n£GFX_stability_popularity_texticon §YEstabilidade:§! [?CZE_stab_factor|%.2+]\n\nO §2ANO§! está crescendo em poder, o que significa que é um bom momento para formar uma coalizão com ele. O novo programa do §tČSSD§! aumentará a tributação e atrairá mais pessoas ao país renovando sítios culturais e religiosos. Graças ao interesse na restauração de igrejas, o §3KDU-ČSL§! está mais disposto a iniciar uma cooperação."
 CZE_political_leaders_cssd_description_text_2017: "Popularidade do partido: [?THIS.party_pop_array^3|%1Y]\n§gEfeitos atuais da popularidade do partido:§!\n£western_outlook_campaign_cost_modifier_texticon  §YApoio Democrata Diário:§! [?CZE_cssd_democratic_drift|+]\n£GFX_stability_popularity_texticon §YEstabilidade:§! [?CZE_stab_factor|%.2+]\n\nTempos instáveis se aproximam para o mundo. O §tČSSD§! apresentou um foco maior em indústria e agricultura e planeja construir novas fábricas civis e distritos agrícolas. Quando a crise chegar, o §tČSSD§! estará preparado para enfrentá-la e preparar rapidamente novas contramedidas."
 CZE_political_leaders_cssd_description_text_2021: "Popularidade do partido: [?THIS.party_pop_array^3|%1Y]\n§gEfeitos atuais da popularidade do partido:§!\n£western_outlook_campaign_cost_modifier_texticon  §YApoio Democrata Diário:§! [?CZE_cssd_democratic_drift|+]\n£GFX_stability_popularity_texticon §YEstabilidade:§! [?CZE_stab_factor|%.2+]\n\nA epidemia de 2020 aumentou significativamente a visibilidade do presidente do partido e ministro do Interior, Jan Hamáček. O partido tentou usar a popularidade de Hamáček nas eleições regionais e do senado do outono; o slogan do partido tornou-se 'Vamos protegê-lo em uma crise'. §Y§tČSSD§! está pronto para enfrentar a doença.§!"
 CZE_political_leaders_kdu_title_text_text: "§3Křesťanská a Demokratická Unie - Československá Strana Lidová§!"
 CZE_political_leaders_kdu_description_text_text: "[CZE_political_leaders_kdu_description_text_text]"
 CZE_political_leaders_kdu_description_text_2000: "Popularidade do partido: [?THIS.party_pop_array^14|%1Y]\n§gEfeitos atuais da popularidade do partido:§!\n£GFX_corporate_tax_income_multiplier_modifier_texticon  §YProdutividade Agrícola:§! [?CZE_kdu_agricolture_productivity_modifier|%.2+]\n£foreign_influence_defense_modifier_texticon §YDefesa Contra Influência Estrangeira:§! [?CZE_kdu_foreign_influence_defense_modifier|%.2+]\n\nO §3KDU-ČSL§! é um partido político democrata-cristão. É um dos partidos políticos tchecos mais antigos, fundado em janeiro de 1919 pela fusão de vários partidos católicos. O partido preza pelo apoio à família, educação de qualidade, o campo, a agricultura e as pequenas empresas, a promoção dos valores cristãos e o cuidado com o meio ambiente."
 CZE_political_leaders_kdu_description_text_2002: "Popularidade do partido: [?THIS.party_pop_array^14|%1Y]\n§gEfeitos atuais da popularidade do partido:§!\n£GFX_corporate_tax_income_multiplier_modifier_texticon  §YProdutividade Agrícola:§! [?CZE_kdu_agricolture_productivity_modifier|%.2+]\n£foreign_influence_defense_modifier_texticon §YDefesa Contra Influência Estrangeira:§! [?CZE_kdu_foreign_influence_defense_modifier|%.2+]\n\nEm julho de 2002, o §3KDU-ČSL§! tentará se tornar parceiro do §tČSSD§!, da §GUS-DEU§! e do §1ODS§!. Esse plano impulsionará a popularidade de cada partido e do próprio §3KDU-ČSL§!, o que os ajudará a progredir nos próximos programas."
 CZE_political_leaders_kdu_description_text_2006: "Popularidade do partido: [?THIS.party_pop_array^14|%1Y]\n§gEfeitos atuais da popularidade do partido:§!\n£GFX_corporate_tax_income_multiplier_modifier_texticon  §YProdutividade Agrícola:§! [?CZE_kdu_agricolture_productivity_modifier|%.2+]\n£foreign_influence_defense_modifier_texticon §YDefesa Contra Influência Estrangeira:§! [?CZE_kdu_foreign_influence_defense_modifier|%.2+]\n\nApós as eleições, o §3KDU-ČSL§! está prestes a iniciar a cooperação com o §7Strana Zelenych§! e o §1ODS§!. Jiří Čunek, novo presidente do partido, anunciou que o próximo programa partidário incluirá mais reformas de igrejas e mudanças nos gastos sociais, endurecendo algumas leis para aumentar a sensação de segurança."
 CZE_political_leaders_kdu_description_text_2010: "Popularidade do partido: [?THIS.party_pop_array^14|%1Y]\n§gEfeitos atuais da popularidade do partido:§!\n£GFX_corporate_tax_income_multiplier_modifier_texticon  §YProdutividade Agrícola:§! [?CZE_kdu_agricolture_productivity_modifier|%.2+]\n£foreign_influence_defense_modifier_texticon §YDefesa Contra Influência Estrangeira:§! [?CZE_kdu_foreign_influence_defense_modifier|%.2+]\n\nComo os outros partidos passaram a dar maior atenção à energia renovável e ao cuidado com o meio ambiente, o §3KDU-ČSL§! não ficou para trás e apresentou seu próprio programa ecológico. Prometem inventar combustíveis mais eficientes, novas tecnologias de energia renovável, concluir algumas reformas sociais e melhorar a geração de energia nuclear."
 CZE_political_leaders_kdu_description_text_2013: "Popularidade do partido: [?THIS.party_pop_array^14|%1Y]\n§gEfeitos atuais da popularidade do partido:§!\n£GFX_corporate_tax_income_multiplier_modifier_texticon  §YProdutividade Agrícola:§! [?CZE_kdu_agricolture_productivity_modifier|%.2+]\n£foreign_influence_defense_modifier_texticon §YDefesa Contra Influência Estrangeira:§! [?CZE_kdu_foreign_influence_defense_modifier|%.2+]\n\nO §3KDU-ČSL§! dá continuidade ao seu programa anterior, que inclui mudanças nos setores de energia e meio ambiente. O partido preparou novos políticos para se tornarem ministros. Para que isso seja possível, o §3KDU-ČSL§! precisará de popularidade. Por sorte, as eleições para a UE se aproximam. Se tiverem sucesso, o §3KDU-ČSL§! poderá obter popularidade suficiente para concluir seu programa."
 CZE_political_leaders_kdu_description_text_2017: "Popularidade do partido: [?THIS.party_pop_array^14|%1Y]\n§gEfeitos atuais da popularidade do partido:§!\n£GFX_corporate_tax_income_multiplier_modifier_texticon  §YProdutividade Agrícola:§! [?CZE_kdu_agricolture_productivity_modifier|%.2+]\n£foreign_influence_defense_modifier_texticon §YDefesa Contra Influência Estrangeira:§! [?CZE_kdu_foreign_influence_defense_modifier|%.2+]\n\nO congresso aprovou a mudança oficial do nome do partido, que é a atual abreviação §3KDU-ČSL§!. A nova liderança do §3KDU-ČSL§! identificou o apoio aos pais como o ponto principal de sua política. A proteção ambiental e o combate às mudanças climáticas foram identificados como outras prioridades."
 CZE_political_leaders_kdu_description_text_2021: "Popularidade do partido: [?THIS.party_pop_array^14|%1Y]\n§gEfeitos atuais da popularidade do partido:§!\n£GFX_corporate_tax_income_multiplier_modifier_texticon  §YProdutividade Agrícola:§! [?CZE_kdu_agricolture_productivity_modifier|%.2+]\n£foreign_influence_defense_modifier_texticon §YDefesa Contra Influência Estrangeira:§! [?CZE_kdu_foreign_influence_defense_modifier|%.2+]\n\nEm outubro de 2020, os líderes do §3KDU-ČSL§!, do §1ODS§! e do §CTOP 09§! anunciaram a formação de uma coalizão para as eleições parlamentares de 2021, que chamaram de §0SPOLU§! (tch. §0JUNTOS§!). §1Petr Fiala§! tornou-se o líder, e o presidente do §3KDU-ČSL§! e o presidente do §CTOP 09§! assumiram os cargos de vice-líderes."
 CZE_political_leaders_kscm_title_text_text: "§RKomunistická strana Čech a Moravy§!"
 CZE_political_leaders_kscm_description_text_text: "[CZE_political_leaders_kscm_description_text_text]"
 CZE_political_leaders_kscm_description_text_2000: "Popularidade do partido: [?THIS.party_pop_array^4|%1Y]\n§gEfeitos atuais da popularidade do partido:§!\n£emerging_outlook_campaign_cost_modifier_texticon §YApoio Emergente Diário:§! [?CZE_kscm_communist_drift_modifier|+]\n£construction_speed_texticon §YFator de Velocidade de Produção:§! [?CZE_kscm_prod_speed_building_factor|%.2+]\n\nO §RKSČM§! foi fundado em 1990 como sucessor do §RPartido Comunista da Tchecoslováquia§!, continuando a operar dentro da federação de partidos até abril de 1992. A dissolução da federação de partidos ocorreu antes da divisão da Tchecoslováquia, quando o partido se dividiu no §RKSČM§! tcheco e no Partido da Esquerda Democrática eslovaco."
 CZE_political_leaders_kscm_description_text_2002: "Popularidade do partido: [?THIS.party_pop_array^4|%1Y]\n§gEfeitos atuais da popularidade do partido:§!\n£emerging_outlook_campaign_cost_modifier_texticon §YApoio Emergente Diário:§! [?CZE_kscm_communist_drift_modifier|+]\n£construction_speed_texticon §YFator de Velocidade de Produção:§! [?CZE_kscm_prod_speed_building_factor|%.2+]\n\nDesta vez o §RKSČM§! focará fortemente em melhorar o sistema tributário, reduzir a popularidade do §3KDU-ČSL§! e do §1ODS§! e melhorar mais uma vez as relações com a Rússia. Esse ponto de vista tornará a República Tcheca mais dependente dos recursos russos, mas também aumentará a receita do comércio e ajudará a impulsionar as relações."
 CZE_political_leaders_kscm_description_text_2006: "Popularidade do partido: [?THIS.party_pop_array^4|%1Y]\n§gEfeitos atuais da popularidade do partido:§!\n£emerging_outlook_campaign_cost_modifier_texticon §YApoio Emergente Diário:§! [?CZE_kscm_communist_drift_modifier|+]\n£construction_speed_texticon §YFator de Velocidade de Produção:§! [?CZE_kscm_prod_speed_building_factor|%.2+]\n\nO §RKSČM§! dá continuidade ao seu programa anterior, mas desta vez é mais orientado ao setor industrial. Com a ajuda do §tČSSD§!, poderá construir nova infraestrutura, expandir o setor de recursos e ajudar no desenvolvimento da agricultura."
 CZE_political_leaders_kscm_description_text_2010: "Popularidade do partido: [?THIS.party_pop_array^4|%1Y]\n§gEfeitos atuais da popularidade do partido:§!\n£emerging_outlook_campaign_cost_modifier_texticon §YApoio Emergente Diário:§! [?CZE_kscm_communist_drift_modifier|+]\n£construction_speed_texticon §YFator de Velocidade de Produção:§! [?CZE_kscm_prod_speed_building_factor|%.2+]\n\nCom o alvorecer de uma nova década, o §RKSČM§! apresenta um programa totalmente novo. O objetivo principal é um apoio muito forte ao desenvolvimento da tecnologia de energia renovável e ao crescimento da produtividade nacional, com especial destaque para a melhoria do setor agrícola."
 CZE_political_leaders_kscm_description_text_2013: "Popularidade do partido: [?THIS.party_pop_array^4|%1Y]\n§gEfeitos atuais da popularidade do partido:§!\n£emerging_outlook_campaign_cost_modifier_texticon §YApoio Emergente Diário:§! [?CZE_kscm_communist_drift_modifier|+]\n£construction_speed_texticon §YFator de Velocidade de Produção:§! [?CZE_kscm_prod_speed_building_factor|%.2+]\n\nO último partido comunista realmente significativo está prestes a enfrentar uma crise muito forte. No entanto, ainda há esperança para o §RKSČM§!, caso consiga executar o plano de assumir a liderança entre os partidos comunistas europeus."
 CZE_political_leaders_kscm_description_text_2017: "Popularidade do partido: [?THIS.party_pop_array^4|%1Y]\n§gEfeitos atuais da popularidade do partido:§!\n£emerging_outlook_campaign_cost_modifier_texticon §YApoio Emergente Diário:§! [?CZE_kscm_communist_drift_modifier|+]\n£construction_speed_texticon §YFator de Velocidade de Produção:§! [?CZE_kscm_prod_speed_building_factor|%.2+]\n\nÉ aqui que terminamos a árvore de focos do §RKSČM§!. A história está concluída por ora. O partido mantém boas relações com o §tČSSD§! e tenta finalizar seus próximos programas."
 CZE_political_leaders_kscm_description_text_2021: "Popularidade do partido: [?THIS.party_pop_array^4|%1Y]\n§gEfeitos atuais da popularidade do partido:§!\n£emerging_outlook_campaign_cost_modifier_texticon §YApoio Emergente Diário:§! [?CZE_kscm_communist_drift_modifier|+]\n£construction_speed_texticon §YFator de Velocidade de Produção:§! [?CZE_kscm_prod_speed_building_factor|%.2+]\n\nO presidente do partido, Vojtěch Filip, renunciou. Desde 23 de outubro de 2021, Kateřina Konečná, a primeira mulher na liderança do §RKSČM§!, é a presidente do partido."
 CZE_political_leaders_us_title_text_text: "§GUnie Svobody - Demokratická Unie§!"
 CZE_political_leaders_us_description_text_text: "[CZE_political_leaders_us_description_text_text]"
 CZE_political_leaders_us_description_text_2000: "Popularidade do partido: [?THIS.party_pop_array^2|%1Y]\n§gEfeitos atuais da popularidade do partido:§!\n£social_cost_multiplier_modifier_texticon  §YMultiplicador de Custo do Bem-Estar:§! [?CZE_us_social_cost_multiplier_modifier|%.2-]\n£police_cost_multiplier_modifier_texticon  §YMultiplicador de Custo da Polícia:§! [?CZE_us_police_cost_multiplier_modifier|%.2-]\n\nA §GUnie svobody§! foi fundada em janeiro de 1998 por ex-membros do partido §1ODS§! insatisfeitos com a liderança de Václav Klaus.\nA §GUnie svobody§! passou para a oposição após a eleição de 1998. Na oposição, fundiu-se com o partido §GDemokratická unie§! e formou uma coalizão com o partido §3KDU-ČSL§!."
 CZE_political_leaders_us_description_text_2002: "Popularidade do partido: [?THIS.party_pop_array^2|%1Y]\n§gEfeitos atuais da popularidade do partido:§!\n£social_cost_multiplier_modifier_texticon  §YMultiplicador de Custo do Bem-Estar:§! [?CZE_us_social_cost_multiplier_modifier|%.2-]\n£police_cost_multiplier_modifier_texticon  §YMultiplicador de Custo da Polícia:§! [?CZE_us_police_cost_multiplier_modifier|%.2-]\n\nApós as eleições de 2002, algo mudou. O partido sofreu com várias controvérsias, como o caso do Príncipe do Catar. Para as eleições de 2006, apresentará um programa muito pouco convencional para atrair novos eleitores..."
 CZE_political_leaders_us_description_text_2006: "Popularidade do partido: [?THIS.party_pop_array^2|%1Y]\n§gEfeitos atuais da popularidade do partido:§!\n£social_cost_multiplier_modifier_texticon  §YMultiplicador de Custo do Bem-Estar:§! [?CZE_us_social_cost_multiplier_modifier|%.2-]\n£police_cost_multiplier_modifier_texticon  §YMultiplicador de Custo da Polícia:§! [?CZE_us_police_cost_multiplier_modifier|%.2-]\n\nPara as eleições de 2006, a §GUS-DEU§! mudou radicalmente sua imagem e, com o pentagrama como emblema, tentou conquistar os votos de jovens com mentalidade ultraliberal a anarquista. Por enquanto, focará em erguer novas construções e melhorar a tributação."
 CZE_political_leaders_us_description_text_2010: "Popularidade do partido: [?THIS.party_pop_array^2|%1Y]\n§gEfeitos atuais da popularidade do partido:§!\n£social_cost_multiplier_modifier_texticon  §YMultiplicador de Custo do Bem-Estar:§! [?CZE_us_social_cost_multiplier_modifier|%.2-]\n£police_cost_multiplier_modifier_texticon  §YMultiplicador de Custo da Polícia:§! [?CZE_us_police_cost_multiplier_modifier|%.2-]\n\nNas eleições de 2010, a §GUS-DEU§! não concorreu e declarou apoio ao §1ODS§!. A §GUS-DEU§! deixou formalmente de existir em 1º de janeiro de 2011. Ainda assim, o partido continua apresentando relatórios financeiros anuais, inclusive o de 2015 (essa foi a mensagem vinda do futuro)."
 CZE_political_leaders_ano_title_text_text: "§2Akce Nespokojených Občanů 2011§!"
 CZE_political_leaders_ano_description_text_text: "[CZE_political_leaders_ano_description_text_text]"
 CZE_political_leaders_ano_description_text_2011: "Popularidade do partido: [?THIS.party_pop_array^13|%1Y]\n§gEfeitos atuais da popularidade do partido:§!\n£tax_gain_multiplier_modifier_texticon §YReceita de Imposto Corporativo:§! [?CZE_ano_corporate_tax_income_multiplier_modifier|%.2+]\n£construction_speed_texticon §YFator de Velocidade de Produção:§! [?CZE_ano_prod_speed_building_factor|%.2+]\n\nO §2ANO§! foi fundado no outono de 2011. O movimento voltou-se aos eleitores insatisfeitos com as entidades políticas estabelecidas. Seu objetivo é participar de eleições em todos os níveis e promover um ambiente mais favorável a empresários e comerciantes, eliminar a corrupção e a politicagem e estimular o crescimento do emprego."
 CZE_political_leaders_ano_description_text_2013: "Popularidade do partido: [?THIS.party_pop_array^13|%1Y]\n§gEfeitos atuais da popularidade do partido:§!\n£tax_gain_multiplier_modifier_texticon §YReceita de Imposto Corporativo:§! [?CZE_ano_corporate_tax_income_multiplier_modifier|%.2+]\n£construction_speed_texticon §YFator de Velocidade de Produção:§! [?CZE_ano_prod_speed_building_factor|%.2+]\n\nO §2ANO§! lançou um novo Código Ético que todos os membros do partido devem seguir. O partido também vai formar uma coalizão com o §tČSSD§! e o §3KDU-ČSL§!, o que o ajudará a entrar no governo, fazer reformas importantes e preparar o próximo programa eleitoral."
 CZE_political_leaders_ano_description_text_2017: "Popularidade do partido: [?THIS.party_pop_array^13|%1Y]\n§gEfeitos atuais da popularidade do partido:§!\n£tax_gain_multiplier_modifier_texticon §YReceita de Imposto Corporativo:§! [?CZE_ano_corporate_tax_income_multiplier_modifier|%.2+]\n£construction_speed_texticon §YFator de Velocidade de Produção:§! [?CZE_ano_prod_speed_building_factor|%.2+]\n\nO programa do §2ANO§! em 2017 era o crescimento da economia, a limitação de contratos estatais superfaturados, a construção rápida e a digitalização do país e a concessão de subsídios para novas tecnologias. Essas ações decisivas o ajudarão a ganhar enorme popularidade."
 CZE_political_leaders_ano_description_text_2021: "Popularidade do partido: [?THIS.party_pop_array^13|%1Y]\n§gEfeitos atuais da popularidade do partido:§!\n£tax_gain_multiplier_modifier_texticon §YReceita de Imposto Corporativo:§! [?CZE_ano_corporate_tax_income_multiplier_modifier|%.2+]\n£construction_speed_texticon §YFator de Velocidade de Produção:§! [?CZE_ano_prod_speed_building_factor|%.2+]\n\nEm 30 de outubro de 2022, Andrej Babiš anunciou na TV Nova sua intenção de concorrer à presidência da República Tcheca. Originalmente, o candidato oficial seria anunciado em 26 de outubro; como Andrej Babiš estava doente, a data foi adiada para 31 de outubro de 2022, quando também foi realizada uma coletiva de imprensa."
 CZE_political_leaders_top_title_text_text: "§CTradice Odpovědnost Prosperita§!"
 CZE_political_leaders_top_description_text_text: "[CZE_political_leaders_top_description_text_text]"
 CZE_political_leaders_top_description_text_2009: "Popularidade do partido: [?THIS.party_pop_array^2|%1Y]\n§gEfeitos atuais da popularidade do partido:§!\n£health_cost_multiplier_modifier_texticon §YMultiplicador de Custo da Saúde:§! [?CZE_top_health_cost_multiplier_modifier|%.2-]\n£under_construction_texticon §YExigência de Trabalhadores nas Construções:§! [?CZE_top_buildings_worker_requirement_modifier|%.2-]\n\nO §CTOP 09§! foi fundado em 11 de junho de 2009 por Miroslav Kalousek, que deixou o partido §3KDU-ČSL§!. O partido enfatiza a identidade europeia e a herança da cultura antiga e judaico-cristã.\nÉ um dos partidos mais pró-europeus do cenário político tcheco."
 CZE_political_leaders_top_description_text_2010: "Popularidade do partido: [?THIS.party_pop_array^2|%1Y]\n§gEfeitos atuais da popularidade do partido:§!\n£health_cost_multiplier_modifier_texticon §YMultiplicador de Custo da Saúde:§! [?CZE_top_health_cost_multiplier_modifier|%.2-]\n£under_construction_texticon §YExigência de Trabalhadores nas Construções:§! [?CZE_top_buildings_worker_requirement_modifier|%.2-]\n\nO §CTOP 09§! defende grandes reformas ambientais para salvar as terras verdes e a paisagem natural. Faz grande esforço para ajudar a agricultura, melhorar a energia renovável e se aproximar da União Europeia."
 CZE_political_leaders_top_description_text_2013: "Popularidade do partido: [?THIS.party_pop_array^2|%1Y]\n§gEfeitos atuais da popularidade do partido:§!\n£health_cost_multiplier_modifier_texticon §YMultiplicador de Custo da Saúde:§! [?CZE_top_health_cost_multiplier_modifier|%.2-]\n£under_construction_texticon §YExigência de Trabalhadores nas Construções:§! [?CZE_top_buildings_worker_requirement_modifier|%.2-]\n\nOs novos representantes do governo, especialmente o presidente do movimento §2ANO§!, Andrej Babiš, conduziram uma campanha difamatória contra o §CTOP 09§!. O partido teve de se defender do §2ANO§! e continuar seu programa, que incluía grande desenvolvimento regional e a atração de mais pessoas para o país."
 CZE_political_leaders_top_description_text_2017: "Popularidade do partido: [?THIS.party_pop_array^2|%1Y]\n§gEfeitos atuais da popularidade do partido:§!\n£health_cost_multiplier_modifier_texticon §YMultiplicador de Custo da Saúde:§! [?CZE_top_health_cost_multiplier_modifier|%.2-]\n£under_construction_texticon §YExigência de Trabalhadores nas Construções:§! [?CZE_top_buildings_worker_requirement_modifier|%.2-]\n\nEm 27 de outubro de 2020, os presidentes dos partidos §1ODS§! e §3KDU-ČSL§! assinaram um memorando de cooperação antes das eleições parlamentares, batizando sua coalizão de §0SPOLU§!. Além disso, o partido continuava atraindo novas pessoas e impulsionando o setor industrial, sem deixar de priorizar o cuidado com o meio ambiente."
 CZE_political_leaders_top_description_text_2021: "Popularidade do partido: [?THIS.party_pop_array^2|%1Y]\n§gEfeitos atuais da popularidade do partido:§!\n£health_cost_multiplier_modifier_texticon §YMultiplicador de Custo da Saúde:§! [?CZE_top_health_cost_multiplier_modifier|%.2-]\n£under_construction_texticon §YExigência de Trabalhadores nas Construções:§! [?CZE_top_buildings_worker_requirement_modifier|%.2-]\n\nA coalizão §0SPOLU§! venceu as eleições parlamentares de outubro de 2021 com 27.79% dos votos. Em seguida, a coalizão §0SPOLU§! começou a negociar a formação do governo com a coalizão §gPiráti a Starostové§!."
