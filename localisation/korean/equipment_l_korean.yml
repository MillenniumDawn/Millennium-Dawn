 GER_attack_helicopter_1: "MBB Bo 105P"
 GER_attack_helicopter_1_desc: "메서슈미트-뵐코-블롬 Bo 105는 서독 오토브룬의 뵐코가 개발한 경량 쌍발 다목적 헬리콥터입니다. 세계 최초의 경량 쌍발 헬리콥터였으며, 인버티드 루프와 같은 곡예 기동을 수행할 수 있는 최초의 회전익기였습니다. 105P형은 유선 유도식 HOT 대전차 유도 미사일로 무장한 대전차형입니다."
