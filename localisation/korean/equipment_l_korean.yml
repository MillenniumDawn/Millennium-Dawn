 USA_APC_8: "M967 스미스"
 USA_APC_8_desc: "DARPA's APC pet project has essentially created a fast-moving, more lethal, more armored Beast. This pinnacle of APC technology will ensure that the American warfighter is not only safe, but comfortable and even more combat effective as they are able to move in between and penetrate enemy positions faster than ever."
