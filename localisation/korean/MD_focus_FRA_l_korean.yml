 FRA_knds_manufacturer: "크라우스마파이 베그만 넥스터 디펜스 시스템즈"
 FRA_knds_manufacturer_trait: "MGCS 수렴 계획"
 FRA_knds_franco_german_synthesis: "독-불 종합"
 FRA_knds_european_champion: "유럽 산업의 대표 기업"
 FRA_knds_fg_partnership: "독-불 동반자 관계"
 FRA_knds_fg_partnership_desc: "2015년의 KANT 지주회사는 크라우스마파이 베그만과 넥스터를 독-불 50대 50 소유 구조로 통합하여, 두 국가 대표 기업을 하나의 산업 기반으로 합쳤습니다."
 FRA_knds_kant_holding: "KANT 지주회사 통합"
 FRA_knds_kant_holding_desc: "국경을 넘나드는 엔지니어링 팀, 조율된 조달, 공유 행정 서비스는 두 개의 기존 방위 기업을 병행 운영하는 데 드는 간접비를 줄여 줍니다."
 FRA_knds_embt: "EMBT 시범 차량"
 FRA_knds_embt_desc: "개량형 주력 전차(EMBT)는 르클레르 포탑을 레오파르트 2 차체에 결합하여, 미래 주력 지상 전투 체계의 혼합 설계 철학을 미리 보여 줍니다."
 FRA_knds_joint_rnd: "공동 연구개발 기금"
 FRA_knds_joint_rnd_desc: "독-불 연구 예산을 합치면 어느 한 기업도 단독으로는 추진할 수 없는 장갑, 전자, 고에너지 물질 분야의 병행 연구가 가속됩니다."
 FRA_knds_mgcs_modular: "MGCS 모듈식 구조"
 FRA_knds_mgcs_modular_desc: "주력 지상 전투 체계(MGCS)는 방호, 화력, 전자전을 위한 교체 가능한 모듈을 갖춘 다중 플랫폼 계열로 구상되었으며, 2040년대까지 레오파르트 2와 르클레르를 대체합니다."
 FRA_knds_mgcs_integration: "MGCS 체계 통합"
 FRA_knds_mgcs_integration_desc: "MGCS는 공유 디지털 기간망, SCORPION에서 파생된 전투 관리, 공통 센서 융합을 독-불 기갑 부대 전반에 통합합니다."
 FRA_knds_turret_leadership: "포탑 주도권 (넥스터)"
 FRA_knds_turret_leadership_desc: "포탑 설계, 자동장전 장치 공학, 포 제작은 르클레르 시대의 화력 전문 지식을 바탕으로 옛 넥스터 팀 아래로 통합됩니다."
 FRA_knds_hull_leadership: "차체 주도권 (KMW)"
 FRA_knds_hull_leadership_desc: "차체, 파워팩, 주행 장치 개발은 레오파르트 2와 푸마의 구조 경험을 활용하여 옛 KMW 팀 아래로 통합됩니다."
 FRA_knds_nato_standardisation: "NATO 야포 표준화"
 FRA_knds_nato_standardisation_desc: "KNDS는 NATO 지원 조달청에 STANAG를 충족하는 155mm 탄약을 공급하여, 통합된 기업을 유럽의 기본 야포 공급업체로 자리매김합니다."
 FRA_knds_rch155: "RCH-155 원격 곡사포"
 FRA_knds_rch155_desc: "RCH-155는 복서 차체에 자동화된 155mm 포탑을 탑재하여, 2인 승무원으로 이동 중에도 최대 54킬로미터 거리까지 사격합니다."
 FRA_knds_leopard_sustainment: "레오파르트 2 전력 유지"
 FRA_knds_leopard_sustainment_desc: "레오파르트 2 전력의 통합 군수, 예비 부품 생산, 재정비가 통합 기업의 몫이 되어, KNDS는 유럽 전역에서 수십 년간 이어지는 정비 수익원을 확보합니다."
 FRA_knds_boxer_puma: "복서 및 푸마 관리"
 FRA_knds_boxer_puma_desc: "모듈식 장갑차 복서와 푸마 보병전투차는 여전히 KMW 주도 계획이며, 이제 KNDS의 결합된 산업 역량의 뒷받침을 받습니다."
 FRA_knds_bonus_katana: "BONUS 및 KATANA 탄약"
 FRA_knds_bonus_katana_desc: "센서 신관식 BONUS와 유도식 KATANA 포탄은 KNDS의 정밀 야포 제품군을 확장하며, 이제 범유럽 단일 제품군으로 판매됩니다."
 FRA_knds_export_leadership: "수출 주도권"
 FRA_knds_export_leadership_desc: "공세적인 수출 기조로 장갑, 야포, 탄약을 묶은 패키지를 내세워 걸프, 동남아시아, 동유럽의 구매자들을 공략합니다."
 FRA_knds_strategic_autonomy: "전략적 자율성"
 FRA_knds_strategic_autonomy_desc: "자국 우선 교리에 따라 최상의 생산 슬롯과 민감한 기술을 독-불 군대에 할당하여, 공개 시장 판매보다 유럽의 전략적 자율성을 강화합니다."
