 SAU_research_modifery_01: "§H다각화§! - 연구 개발"
 SAU_research_modifery_01_desc: "대학과 연구 기관에 대한 목표 지향적 자금 지원이 석유를 넘어선 지식 경제를 구축하려는 왕국의 노력을 가속하고 있습니다."
 SAU_research_modifery_02: "§H다각화§! - 세계적 수준의 연구"
 SAU_research_modifery_02_desc: "KAUST와 같은 대표 기관들은 사우디아라비아를 세계 각지의 인재를 끌어들이는, 과학과 혁신의 떠오르는 지역 중심지로 만들었습니다."
 SAU_research_modifier_01: "깨어나는 정신"
 SAU_research_modifier_01_desc: "기초 문해 프로그램이 정규 교육을 받을 수 있는 사우디인의 수를 늘리고 있습니다."
 SAU_research_modifier_02: "책 읽는 국가"
 SAU_research_modifier_02_desc: "문해율 상승은 더 큰 독서 인구를 만들어 냈고 학교와 교육 자료에 대한 수요를 늘렸습니다."
 SAU_research_modifier_03: "교육 확대"
 SAU_research_modifier_03_desc: "학교와 취학 인원이 확대되어 더 많은 사우디인이 초등 및 중등 교육을 받을 수 있게 되었습니다."
 SAU_research_modifier_04: "학문의 기초"
 SAU_research_modifier_04_desc: "왕국은 더 폭넓은 국가 교육 체계에 필요한 기관과 훈련된 인력을 갖추었습니다."
 SAU_research_modifier_06: "지성 함양"
 SAU_research_modifier_06_desc: "대학과 연구 기관이 고학력 사우디 전문가를 더 많이 배출하고 있습니다."
 SAU_royal_ulema_alliance_content: "§H왕실-울라마 동맹§!"
 SAU_royal_ulema_alliance_content_desc: "§L울라마§!와 §H알사우드 가문§!은 생산적으로 협력합니다. 일상적인 파트와는 왕좌에 유리하고, 일상적인 정책은 성직자를 존중합니다. 어느 쪽도 불평할 이유가 없습니다."
 SAU_royal_ulema_alliance_high: "§H왕실-울라마 동맹§!"
 SAU_royal_ulema_alliance_high_desc: "§L고위 학자 위원회§!가 왕좌를 강력히 지지하고, 종교 기득권층은 왕실 정책을 정당한 것으로 제시합니다. 이 긴밀한 결속은 왕조를 크게 강화합니다."
 SAU_royal_ulema_alliance_neutral: "§H왕실-울라마 동맹§!"
 SAU_royal_ulema_alliance_neutral_desc: "왕좌와 성직자는 §Y공식적이지만 제한적인§! 관계를 유지합니다. 어느 쪽도 상대를 적극적으로 지지하거나 방해하지 않으므로 힘의 균형은 보너스도 페널티도 주지 않습니다."
 SAU_royal_ulema_alliance_neutral_tt: "§Y왕좌와 울라마의 관계가 균형 상태입니다. 보너스도 페널티도 없습니다.§! \n§Y힘의 균형 변화 = 0.00§!"
 SAU_royal_ulema_alliance_strained: "§R왕실-울라마 갈등§!"
 SAU_royal_ulema_alliance_strained_desc: "§L울라마§!의 일부 구성원들이 사적으로 왕좌를 비판하고 설교를 통해 정부의 개혁에 의문을 제기하고 있습니다. 이러한 반대는 왕조의 종교적 정통성을 약화시킵니다."
 SAU_sabic_01: "SABIC"
 SAU_sabic_01_desc: "사우디 기초산업공사는 주요 석유화학 제조사입니다. 아직 성장 중이지만 SABIC은 산업 다각화에 기여하고 석유 부문 밖의 일자리를 제공합니다."
 SAU_sabic_agrinutrients: "§HSABIC§! - 농업 영양소 및 특수 화학"
 SAU_sabic_agrinutrients_desc: "SABIC 농업 영양소 부문은 사우디의 가스를 요소와 암모니아로 바꾸어 아시아와 아프리카의 농장을 먹여 살리고 왕국을 비료 강국으로 만듭니다."
 SAU_sabic_foreign_jv: "§HSABIC§! - 외국 합작 사업"
 SAU_sabic_foreign_jv_desc: "셸, 엑슨모빌, 미쓰비시와의 합작 사업은 세계적 수준의 기술을 SABIC의 공장에 들여오면서도 수익은 왕국에 묶어 두었습니다."
 SAU_sabic_ge_plastics: "§HSABIC§! - GE 플라스틱 인수"
 SAU_sabic_ge_plastics_desc: "2007년 110억 달러가 넘는 금액으로 단행한 GE 플라스틱 인수는 SABIC을 하루아침에 세계 엔지니어링 플라스틱 생산자의 선두에 올려놓았습니다."
 SAU_sabic_global_champion: "§HSABIC§! - 글로벌 화학 선도 기업"
 SAU_sabic_global_champion_desc: "SABIC은 지구상에서 가장 큰 화학 기업 중 하나로, 사우디 산업이 석유 배럴을 훨씬 넘어서 경쟁할 수 있음을 보여 주는 증거입니다."
 SAU_sabic_hadeed: "§HSABIC§! - 하디드 제철 단지"
 SAU_sabic_hadeed_desc: "SABIC의 주바일 제철 부문인 하디드는 한때 수입해야 했던 수백만 톤의 철근과 평판 강재를 사우디 건설 현장에 공급합니다."
 SAU_sabic_ibn_affiliates: "§HSABIC§! - 이븐 계열사"
 SAU_sabic_ibn_affiliates_desc: "이븐 시나, 이븐 자흐르, 이븐 루시드 계열사는 SABIC의 석유화학 생산물을 플라스틱, 메탄올, 섬유 전반으로 확산시킵니다."
 SAU_sabic_jubail_yanbu: "§HSABIC§! - 주바일 및 얀부 산업 도시"
 SAU_sabic_jubail_yanbu_desc: "왕립 위원회가 관할하는 주바일과 얀부는 텅 빈 해안선을 세계 최대 규모의 산업 단지 두 곳으로 바꾸어 사우디 중공업의 토대가 되었습니다."
 SAU_sabic_rnd: "§HSABIC§! - 자체 개발 기술"
 SAU_sabic_rnd_desc: "리야드, 방갈로르, 헬렌에 있는 SABIC의 연구 센터는 촉매와 폴리머를 기술의 최전선에 유지합니다."
 SAU_sagia_initiative: "§HSAGIA 구상§!"
 SAU_sagia_initiative_02: "§HSAGIA - 투자 개혁§!"
 SAU_sagia_initiative_02_desc: "§LSAGIA§!는 소유권 제한을 완화하고 인허가 지연을 줄였습니다. 이러한 개혁은 더 많은 외국 기업을 끌어들이고 사우디 시장에 진입하기 쉽게 만들고 있습니다."
 SAU_sagia_initiative_03: "§HSAGIA - 외국 자본 허브§!"
 SAU_sagia_initiative_03_desc: "사우디아라비아는 §H전략 부문§!을 개방하고 §H세제 혜택§!을 도입했으며 해안을 따라 §H경제 도시§!를 개발했습니다. 이러한 정책은 왕국을 외국인 직접 투자의 주요 지역 목적지로 만들었습니다."
 SAU_sagia_initiative_04: "§GSAGIA - 투자 강국§!"
 SAU_sagia_initiative_04_desc: "사우디아라비아는 이제 §H다각화된 경제§!와 §H개방된 투자 시장§!을 결합하고 있습니다. 완성된 SAGIA 개혁은 상당한 외국 자본과 숙련 노동자를 끌어들입니다."
 SAU_sagia_initiative_desc: "§Y2000년 4월§!에 왕명으로 설립된 §L사우디아라비아 총투자청§!은 외국인 투자 유치를 전담하는 왕국 최초의 기관입니다. 이 기관은 기업법을 간소화하고, 투자자에게 §H단일 창구§!를 제공하며, 사우디 시장에 대한 접근성을 개선하는 일을 맡습니다."
 SAU_salman_health_critical: "§H국왕의 건강§! - §R위독§!"
 SAU_salman_health_critical_desc: "국왕은 더 이상 이동하지 못하고 위원회 회의에 자주 불참합니다. 왕궁은 정보를 거의 제공하지 않아, 고위 인사들이 계승에 대비하고 있습니다."
 SAU_salman_health_declining: "§H국왕의 건강§! - §Y악화 중§!"
 SAU_salman_health_declining_desc: "왕궁은 중병을 발표하지 않았지만 국왕은 공식 알현을 점점 더 줄이거나 취소하고 있습니다. 줄어든 일정은 정부 업무에 영향을 미치기 시작했습니다."
 SAU_salman_health_near_death: "§H국왕의 건강§! - §R임종 직전§!"
 SAU_salman_health_near_death_desc: "국왕은 임종이 가까우며 사실상 통치를 후계자들에게 넘겼습니다. 정치 활동은 이제 계승 준비가 지배하고 있습니다."
 SAU_salman_health_serious: "§H국왕의 건강§! - §Y심각§!"
 SAU_salman_health_serious_desc: "국왕은 공개 석상에 거의 나타나지 않으며, 장관들은 점점 더 국왕에게서 직접이 아니라 왕실 궁정을 통해 지시를 받습니다."
 SAU_salman_health_stable: "§H국왕의 건강§! - §G안정§!"
 SAU_salman_health_stable_desc: "국왕은 공식 일정을 온전히 소화하고, 대사들을 접견하고, 각료 회의를 주재하며, 정부 문서를 검토합니다. 국왕의 지속적인 참여가 궁정과 부처의 질서를 유지시킵니다."
 SAU_shura_led_notables: "명사 위원회"
 SAU_shura_led_notables_desc: "부족 지도자와 주요 상인 가문이 공식 표결에 앞선 비공식 합의를 통해 슈라 위원회를 지배합니다. 이 방식은 확립된 사우디 권력 구조를 대변하지만 의사 결정을 늦춥니다."
 SAU_shura_led_technocrats: "부처 위원회"
 SAU_shura_led_technocrats_desc: "기술 관료들은 슈라 위원회가 예산과 정부 정책을 검토하는 데 더 효과적이도록 만들었습니다. 위원들은 매우 유능하지만 리야드 밖의 공동체를 제대로 대변하지 못합니다."
 SAU_shura_led_ulema: "울라마 위원회"
 SAU_shura_led_ulema_desc: "종교 학자들이 슈라 위원회를 장악하여 종교 기득권층이 반대하는 제안이 국왕에게 이르지 못하도록 막습니다."
 SAU_sp_abrams_combined: "기갑: 합동 병과"
 SAU_sp_abrams_combined_desc: "전차, 보병, 포병이 하나의 균형 잡힌 팀으로 싸웁니다.\n§G+5%§! 사단 공격\n§G+5%§! 사단 방어\n§G+5%§! 사단 조직도\n§R+10%§! 육군 훈련 시간"
 SAU_sp_abrams_defensive: "기갑: 방어벽"
 SAU_sp_abrams_defensive_desc: "참호를 판 기갑이 왕국의 움직일 수 없는 방패가 됩니다.\n§G+10%§! 사단 방어\n§G+10%§! 참호 구축 속도\n§R-10%§! 사단 속도"
 SAU_sp_abrams_shock: "기갑: 충격 및 돌파"
 SAU_sp_abrams_shock_desc: "빠르고 강력한 기갑 돌격으로 적의 전선을 박살 냅니다.\n§G+10%§! 중핵 영토 공격\n§G+5%§! 사단 속도\n§R-5%§! 사단 조직도"
 SAU_sp_apache_antiarmor: "육군 항공: 전차 사냥꾼"
 SAU_sp_apache_antiarmor_desc: "헬파이어로 무장한 사냥꾼들이 기갑 진격을 갈가리 찢습니다.\n§G+7.5%§! 중핵 영토 공격\n§G+5%§! 사단 공격\n§R-5%§! 공군 경험치 획득"
 SAU_sp_apache_closeair: "육군 항공: 근접 지원"
 SAU_sp_apache_closeair_desc: "건십이 머리 위에서 지상군을 안정시키고 보호합니다.\n§G+5%§! 사단 조직도\n§G+5%§! 사단 회복률\n§R+10%§! 항공 사고"
 SAU_sp_apache_recon: "육군 항공: 정찰 및 습격"
 SAU_sp_apache_recon_desc: "전방을 살피는 눈과 전선 깊숙한 후방으로의 전격적인 습격입니다.\n§G+7.5%§! 사단 속도\n§G+5%§! 계획 속도\n§R-5%§! 사단 방어"
 SAU_sp_arty_mass: "포병: 집중 사격"
 SAU_sp_arty_mass_desc: "보급은 신경 쓰지 않고 압도적인 포격으로 적을 분쇄합니다.\n§G+10%§! 중핵 영토 공격\n§R+10%§! 보급 소모"
 SAU_sp_arty_mobile: "포병: 사격 후 이동"
 SAU_sp_arty_mobile_desc: "적이 대응하기 전에 사격하고 진지를 옮깁니다.\n§G+5%§! 사단 속도\n§G+5%§! 사단 조직도\n§R-5%§! 사단 방어"
 SAU_sp_arty_precision: "포병: 정밀 사격"
 SAU_sp_arty_precision_desc: "더 적은 수의, 더 영리한 포탄을 정확히 올바른 표적에 쏩니다.\n§G+7.5%§! 사단 공격\n§G+5%§! 육군 경험치 획득\n§R+5%§! 소비재 사용"
 SAU_sp_awacs_control: "AWACS: 공중전 통제"
 SAU_sp_awacs_control_desc: "관제사들이 모든 전투기를 하나의 살상 그물로 엮습니다.\n§G+10%§! 제공권\n§G+5%§! 공군 경험치 획득\n§R+3%§! 소비재 사용"
 SAU_sp_awacs_earlywarn: "AWACS: 조기 경보망"
 SAU_sp_awacs_earlywarn_desc: "어떤 공습도 들키지 않고 국경을 넘지 못합니다.\n§G+10%§! 대공 방어\n§R-5%§! 공군 공격"
 SAU_sp_awacs_groundlink: "AWACS: 합동 지상 연동"
 SAU_sp_awacs_groundlink_desc: "하늘에서 본 전장 상황이 아래의 육군을 이끕니다.\n§G+5%§! 사단 공격\n§G+5%§! 계획 속도\n§R-5%§! 공군 경험치 획득"
 SAU_sp_combat_armor: "전투 병과: 기갑 주먹"
 SAU_sp_combat_armor_desc: "기갑의 철갑 주먹을 선봉으로 삼습니다.\n§G+7.5%§! 중핵 영토 공격\n§G+5%§! 사단 속도\n§R+5%§! 보급 소모"
 SAU_sp_combat_firepower: "전투 병과: 화력"
 SAU_sp_combat_firepower_desc: "압도적인 화력의 무게로 적을 짓누릅니다.\n§G+7.5%§! 사단 공격\n§R-5%§! 사단 속도"
 SAU_sp_combat_infantry: "전투 병과: 전문 보병"
 SAU_sp_combat_infantry_desc: "숙련되고 침착한 전문 보병이 전장을 지킵니다.\n§G+7.5%§! 사단 방어\n§G+5%§! 사단 조직도\n§R-5%§! 중핵 영토 공격"
 SAU_sp_fleet_bluewater: "해군: 외양 해군의 야망"
 SAU_sp_fleet_bluewater_desc: "걸프를 넘어 열린 바다로 뻗어 나갑니다.\n§G+15%§! 해군 항속 거리\n§G+5%§! 주력함 공격\n§R-5%§! 해군 사기"
 SAU_sp_fleet_coastal: "해군: 연안 방어"
 SAU_sp_fleet_coastal_desc: "모든 항구와 암초를 지키는 소형 함정의 벽입니다.\n§G+5%§! 해군 사기\n§G+10%§! 호위함대 방어\n§R-5%§! 주력함 공격"
 SAU_sp_fleet_gulf: "해군: 걸프 제해권"
 SAU_sp_fleet_gulf_desc: "아라비아만의 좁고 붐비는 해역을 장악합니다.\n§G+10%§! 호위함대 공격\n§G+5%§! 해군 협동\n§R-10%§! 해군 항속 거리"
 SAU_sp_pgm_interdiction: "정밀 유도 무기: 전장 차단"
 SAU_sp_pgm_interdiction_desc: "적이 싸우기 전에 후방과의 연결을 끊어 버립니다.\n§G+5%§! 사단 조직도\n§G+5%§! 근접 항공 지원 공격\n§R+10%§! 공군 교리 비용"
 SAU_sp_pgm_sead: "정밀 유도 무기: 방공망 제압"
 SAU_sp_pgm_sead_desc: "적의 방공망을 먼저 눈멀게 하고 무너뜨립니다.\n§G+7.5%§! 제공권\n§G+5%§! 공군 공격\n§R-5%§! 공중 기동성"
 SAU_sp_pgm_strike: "정밀 유도 무기: 정밀 타격"
 SAU_sp_pgm_strike_desc: "표적만 짓뭉개고 나머지는 남겨 두는 스마트 폭탄입니다.\n§G+10%§! 근접 항공 지원 공격\n§G+5%§! 공군 공격\n§R+5%§! 소비재 사용"
 SAU_sp_posture_deterrence: "태세: 전략적 억지"
 SAU_sp_posture_deterrence_desc: "어떤 침략자도 다시 생각하게 만드는 균형 잡힌 방패입니다.\n§G+5%§! 사단 방어\n§G+5%§! 대공 방어\n§G+5%§! 안정도\n§R-5%§! 사단 공격"
 SAU_sp_posture_homeland: "태세: 본토 방어"
 SAU_sp_posture_homeland_desc: "모든 것을 안으로 돌려 왕국을 요새로 만듭니다.\n§G+10%§! 중핵 영토 방어\n§G+5%§! 최대 참호 구축\n§R-5%§! 사단 속도"
 SAU_sp_posture_projection: "태세: 전력 투사"
 SAU_sp_posture_projection_desc: "본토에서 멀리 떨어진 곳까지 손을 뻗어 타격할 수 있는 군대입니다.\n§G+5%§! 사단 속도\n§G+10%§! 해군 항속 거리\n§G+5%§! 공군 공격\n§R+5%§! 소비재 사용"
 SAU_sp_redflag_bvr: "공군: 가시권 밖 교전"
 SAU_sp_redflag_bvr_desc: "적이 보기도 전에 먼 거리에서 격추합니다.\n§G+7.5%§! 공군 공격\n§G+5%§! 제공권\n§R+10%§! 공군 교리 비용"
 SAU_sp_redflag_defensive: "공군: 대공 방어 교리"
 SAU_sp_redflag_defensive_desc: "살아남고, 버티고, 왕국의 하늘을 지킵니다.\n§G+10%§! 대공 방어\n§G+5%§! 공중 기동성\n§R-5%§! 공군 공격"
 SAU_sp_redflag_dogfight: "공군: 도그파이트 숙달"
 SAU_sp_redflag_dogfight_desc: "선회하고 불태우며 근접전을 지배합니다.\n§G+10%§! 공중 기동성\n§G+5%§! 공군 공격\n§R-5%§! 대공 방어"
 SAU_sp_reform_crash: "개혁: 속성 계획"
 SAU_sp_reform_crash_desc: "지금 개혁하고, 빠르게 개혁하며, 혼란은 개의치 않습니다.\n§G+10%§! 육군 경험치 획득\n§G+5%§! 사단 조직도\n§R-5%§! 안정도"
 SAU_sp_reform_foreign: "개혁: 외국 계약업체"
 SAU_sp_reform_foreign_desc: "외국 전문가를 고용하여 빠르고 훌륭하게 해냅니다. 대가를 치르고서 말입니다.\n§G-15%§! 육군 훈련 시간\n§G+5%§! 육군 경험치 획득\n§R-5%§! 정치력 획득"
 SAU_sp_reform_steady: "개혁: 체계적 증강"
 SAU_sp_reform_steady_desc: "군이 소화할 수 있는 차분하고 질서 있는 개혁입니다.\n§G+5%§! 사단 조직률\n§G+5%§! 사단 회복률\n§R-3%§! 사단 공격력"
 SAU_sp_sang_regime: "국가방위군: 체제 근위대"
 SAU_sp_sang_regime_desc: "국가방위군은 무엇보다도 왕좌와 두 성지를 수호합니다.\n§G+10%§! 중핵 영토 방어력\n§G+5%§! 안정도\n§R-5%§! 사단 공격력"
 SAU_sp_sang_security: "국가방위군: 내부 보안"
 SAU_sp_sang_security_desc: "국내의 전복 시도와 불안을 감시하는 경계 태세의 방위군입니다.\n§G-25%§! 적 전복 활동\n§G+5%§! 안정도\n§R-5%§! 전쟁 지지도"
 SAU_sp_sang_tribal: "국가방위군: 부족 징집병"
 SAU_sp_sang_tribal_desc: "충성스러운 부족 인력이 숙련도는 부족하나마 병력의 규모를 불려 줍니다.\n§G+10%§! 징집 가능 인구\n§G+5%§! 사단 회복률\n§R-5%§! 사단 조직률"
 SAU_sp_sf_counterterror: "특수 부대: 대테러"
 SAU_sp_sf_counterterror_desc: "인질 구출과 대테러를 위한 소규모 정예 치명 부대입니다.\n§G+10%§! 특수 부대 공격력\n§G+5%§! 특수 부대 방어력\n§R-3%§! 특수 부대 한도"
 SAU_sp_sf_raiders: "특수 부대: 종심 습격대"
 SAU_sp_sf_raiders_desc: "더 많은 요원이 적진 깊숙이 타격하지만, 그 대가로 내구성이 떨어집니다.\n§G+5%§! 특수 부대 한도\n§G+7.5%§! 특수 부대 공격력\n§R-5%§! 특수 부대 방어력"
 SAU_sp_sf_recon: "특수 부대: 정찰"
 SAU_sp_sf_recon_desc: "군 전체가 더 멀리 볼 수 있게 해 주는 소리 없는 눈입니다.\n§G+5%§! 특수 부대 한도\n§G+5%§! 계획 속도\n§R-5%§! 특수 부대 공격력"
 SAU_spirit_king_in_name: "이름뿐인 왕, 군복 입은 후계자"
 SAU_spirit_king_in_name_desc: "군주제는 형식적으로 온전히 유지되지만, 왕세자는 위원회의 권위 아래 군 장교로 복무합니다. 이 타협은 왕실과 군 조직 사이의 공개적 결렬을 피하게 해 주지만, 어느 쪽도 완전히 만족시키지는 못합니다."
 SAU_spirit_national_service: "국민 복무 퍼레이드"
 SAU_spirit_national_service_desc: "파드 국왕 도로에서 연 2회 열리는 군사 퍼레이드는 기갑 차량, 학생 단체, 생중계를 동원하여 병역에 대한 대중의 지지를 쌓아 올립니다. 연출된 행사라는 성격에도 불구하고 참석률은 높습니다."
 SAU_spirit_officer_housing: "장교 주택 사업"
 SAU_spirit_officer_housing_desc: "정부는 장교와 그 가족을 위한 주택, 학교, 진료소를 급속히 건설하고 있습니다. 이러한 혜택은 장교단의 체제에 대한 충성심을 강화합니다."
 SAU_spirit_officer_purge: "장교단 숙청"
 SAU_spirit_officer_purge_desc: "권력 장악 당시 주저했던 장교들은 퇴역당했으며, 이를 지지한 장교들은 지휘권을 유지하고 있습니다. 숙청으로 군의 규모는 줄었으나 남은 장교단은 더욱 순종적이 되었습니다."
 SAU_spirit_public_accounts: "위원회의 공공 회계"
 SAU_spirit_public_accounts_desc: "각 부처가 사우디 역사상 처음으로 지출 내역을 공개하고 있습니다. 이 정책은 비밀 덕분에 이득을 보던 가문들을 분노하게 했지만 대중에게는 매우 인기가 높습니다."
 SAU_spirit_quincy_reaffirmed: "퀸시 양해"
 SAU_spirit_quincy_reaffirmed_desc: "미국과 위원회는 1945년에 처음 맺어진 석유 및 안보에 관한 비공식 합의를 이어 가고 있습니다. 미군은 걸프 해운을 보호하고 사우디 유조선은 세계 시장에 석유를 공급하며, 양국 정부 모두 이 합의를 문서화하지 않기를 선호합니다."
 SAU_spirit_security_directorate: "보안국"
 SAU_spirit_security_directorate_desc: "위원회는 마바히스 기록, 내무부 네트워크, 군 정보 기관을 한 명의 장군이 이끄는 단일 국으로 통합했습니다. 광범위한 감시 권한 덕분에 효과적이지만 널리 불신받고 있습니다."
 SAU_spirit_unbeholden: "누구에게도 빚지지 않은 왕국"
 SAU_spirit_unbeholden_desc: "사우디아라비아는 외국의 안보 보장과 주둔군을 거부했습니다. 이제 자체적으로 방공 장비를 구입하고 장교를 양성하며, 매우 높은 재정적 비용을 치르고 독립을 얻고 있습니다."
 SAU_succession_instability: "§R왕위 계승 불안정§!"
 SAU_succession_instability_desc: "파드 국왕은 1995년 뇌졸중 이후 직무를 수행하지 못하고 있으며, 압둘라 왕세자가 사실상의 통치자입니다. 왕실은 압둘라 지지파와 강력한 수다이리 파벌로 나뉘어 있어 정치적 불확실성이 감돌고 있습니다. 왕위 계승이 공식적으로 해결될 때까지 왕국의 의사 결정은 파벌 간 경쟁으로 마비된 상태로 남을 것입니다."
 SAU_syria_landbridge_severed: "이란의 육상 연결로 차단"
 SAU_syria_landbridge_severed_desc: "다마스쿠스의 우호적인 정부가 테헤란에서 헤즈볼라로 이어지는 육상 경로를 끊었습니다. 이 전략적 승리는 왕국에 자신감을 불어넣고 국정을 안정시킵니다."
 SAU_syria_pipeline_t1: "레반트 송유관 (1단계)"
 SAU_syria_pipeline_t1_desc: "사우디의 석유가 요르단과 시리아를 거쳐 지중해에 도달하여, 유럽의 문턱에서 러시아산 가스에 도전합니다. 송유관 수출로 §G추가 수입: $ 3.50B§!가 발생하는 반면, 송유관이 통과하는 국가에 지급하는 통과료로 §R추가 지출: $ 2.00B§!가 발생하여 순수입은 주당 §G+$ 1.50B§!입니다. 사보타주를 당하면 송유관 단계가 한 단계 낮아져 양쪽이 모두 줄어들며, 1단계 송유관이 끊기면 경로가 폐쇄됩니다."
 SAU_syria_pipeline_t2: "레반트 송유관 (2단계)"
 SAU_syria_pipeline_t2_desc: "사우디의 석유가 요르단과 시리아를 거쳐 지중해에 도달하여, 유럽의 문턱에서 러시아산 가스에 도전합니다. 송유관 수출로 §G추가 수입: $ 4.25B§!가 발생하는 반면, 송유관이 통과하는 국가에 지급하는 통과료로 §R추가 지출: $ 2.30B§!가 발생하여 순수입은 주당 §G+$ 1.95B§!입니다. 사보타주를 당하면 송유관 단계가 한 단계 낮아져 양쪽이 모두 줄어들며, 1단계 송유관이 끊기면 경로가 폐쇄됩니다."
 SAU_syria_pipeline_t3: "레반트 송유관 (3단계)"
 SAU_syria_pipeline_t3_desc: "사우디의 석유가 요르단과 시리아를 거쳐 지중해에 도달하여, 유럽의 문턱에서 러시아산 가스에 도전합니다. 송유관 수출로 §G추가 수입: $ 5.00B§!가 발생하는 반면, 송유관이 통과하는 국가에 지급하는 통과료로 §R추가 지출: $ 2.50B§!가 발생하여 순수입은 주당 §G+$ 2.50B§!입니다. 사보타주를 당하면 송유관 단계가 한 단계 낮아져 양쪽이 모두 줄어들며, 1단계 송유관이 끊기면 경로가 폐쇄됩니다."
 SAU_syrian_quagmire: "시리아의 늪"
 SAU_syrian_quagmire_desc: "시리아에서 성과 없는 전쟁을 수년간 지원한 탓에 대중의 지지와 가용 국고 자금이 모두 줄어들었습니다. 왕국의 지출에도 불구하고 시리아 정부는 여전히 권좌를 지키고 있습니다."
 SAU_tadawul_market: "§G타다울, 사우디 증권거래소 LVL 0§!"
 SAU_tadawul_market_desc: "§L사우디 증권거래소§!는 초기 단계로, 기본적인 거래 및 규제 기능만 갖추고 있습니다. 관련 중점을 완료하면 시장이 깊어지고 경제적 이익이 늘어납니다."
 SAU_tadawul_market_t1: "§G타다울, 사우디 증권거래소 LVL 1§!"
 SAU_tadawul_market_t10: "§G타다울, 사우디 증권거래소 LVL 10§!"
 SAU_tadawul_market_t10_desc: "개혁 프로그램이 완료되어 계획된 모든 법률, 규제 기관, 상장 체계가 갖추어졌습니다. §L타다울§!은 이제 시가총액이 나머지 아랍권 거래소를 모두 합친 것보다 큰 §GMENA 최대의 거래소§!입니다."
 SAU_tadawul_market_t1_desc: "타다울 개혁의 첫 단계는 시장 운영과 투자자 신뢰를 개선했습니다. 이후 관련 중점을 통해 발전이 계속될 것입니다."
 SAU_tadawul_market_t2: "§G타다울, 사우디 증권거래소 LVL 2§!"
 SAU_tadawul_market_t2_desc: "더 많은 기업이 타다울에 상장하고 거래량이 증가하여 사무소세 및 법인세 수입이 늘어납니다."
 SAU_tadawul_market_t3: "§G타다울, 사우디 증권거래소 LVL 3§!"
 SAU_tadawul_market_t3_desc: "세 단계에 걸친 타다울 개혁으로 거래소의 자본 접근성과 국가 재정 수입에 대한 기여가 증가했습니다."
 SAU_tadawul_market_t4: "§G타다울, 사우디 증권거래소 LVL 4§!"
 SAU_tadawul_market_t4_desc: "타다울은 이제 상장 기업뿐 아니라 민간 산업에도 자금을 공급하며, 강화된 규제는 투자자 신뢰와 안정을 높입니다."
 SAU_tadawul_market_t5: "§G타다울, 사우디 증권거래소 LVL 5§!"
 SAU_tadawul_market_t5_desc: "타다울은 개혁 프로그램의 절반을 완료하여 거래 활동, 수입, 투자자 신뢰가 더욱 강화되었습니다."
 SAU_tadawul_market_t6: "§G타다울, 사우디 증권거래소 LVL 6§!"
 SAU_tadawul_market_t6_desc: "여섯 단계의 개혁으로 사우디 기업에 자금을 공급하고 투자를 유치하는 타다울의 역할이 확대되었습니다."
 SAU_tadawul_market_t7: "§G타다울, 사우디 증권거래소 LVL 7§!"
 SAU_tadawul_market_t7_desc: "일곱 단계의 개혁으로 타다울은 막대한 운용 자본을 보유한 성숙한 지역 거래소가 되었습니다."
 SAU_tadawul_market_t8: "§G타다울, 사우디 증권거래소 LVL 8§!"
 SAU_tadawul_market_t8_desc: "성숙한 타다울은 건설과 산업에 자본을 공급하며 정부가 경제 정책에 더 큰 영향력을 행사할 수 있게 합니다."
 SAU_tadawul_market_t9: "§G타다울, 사우디 증권거래소 LVL 9§!"
 SAU_tadawul_market_t9_desc: "타다울은 완전한 발전에 근접하여 높은 법인세 및 산업 세수를 창출하고 국가 경제 정책에서 더 큰 역할을 수행하고 있습니다."
 SAU_tenth_five_year_plan: "제10차 5개년 계획"
 SAU_tenth_five_year_plan_desc: "경제기획부는 1970년부터 5개년 계획을 발표해 왔지만, 상당수는 주로 의향 표명에 그쳤습니다. 이번 계획은 항만, 철도, 순환 도로, 부처 개혁에 전액 자금을 지원합니다.\n\n§G5년간 지속됩니다§!."
 SAU_vision_2030_delivered: "비전 2030: 달성"
 SAU_vision_2030_delivered_desc: "비전 2030은 네옴, 리야드 재개발, 신규 관광 시설을 포함한 대규모 건설 및 다각화 사업을 완수했습니다. 사우디아라비아는 이제 원유에 대한 의존도가 크게 낮아졌습니다."
 SAU_vision_2030_expectations: "비전 2030: 약속"
 SAU_vision_2030_expectations_desc: "비전 2030의 초대형 사업 발표는 투자를 끌어들이고 대중의 신뢰를 높였습니다. 그 규모는 약속된 사업이 완료될 때까지 막대한 예산상, 정치적 비용도 초래합니다."
 SAU_vision_2030_progress: "비전 2030: 윤곽을 드러내다"
 SAU_vision_2030_progress_desc: "왕국 전역에서 건설이 진행 중이며, 비전 2030의 첫 사업들이 가동되고 있습니다. 눈에 보이는 이러한 진전은 이 프로그램에 대한 대중의 의구심을 줄였습니다."
 SAU_vision_2030_white_elephant: "비전 2030: 애물단지"
 SAU_vision_2030_white_elephant_desc: "비전 2030은 기한을 넘겼으며, 수천억 달러를 지출하고도 주요 사업이 미완성이거나 활용되지 않은 채 남았습니다. 이 실패는 프로그램 비판자들이 옳았음을 입증했고 지도부에 대한 신뢰를 떨어뜨렸습니다."
 SAU_water_crisis_01: "§H관리되는 물 위기§!"
 SAU_water_crisis_01_desc: "담수화 시설 확충, 더 효율적인 농업 정책, 공공 소비 감소로 물 위기가 §G관리 가능한§! 수준으로 완화되었습니다. 왕국은 여전히 구조적인 물 부족에 직면해 있지만 공급은 안정적입니다."
 SAU_water_crisis_02: "§H심각한 물 위기§!"
 SAU_water_crisis_02_desc: "사우디아라비아는 §L사크§!와 §L와지드§! 화석 대수층을 보충되는 속도보다 빠르게 고갈시키고 있습니다. 농업이 남은 지하수의 상당 부분을 소비하는 가운데, 담수화 의존도는 §Y소비재 비용§!을 높이고 §Y효율§!을 떨어뜨리며 §Y대중의 인내심§!을 약화시킵니다."
 SAU_yemen_attack_buff: "합동 공세"
 SAU_yemen_attack_buff_desc: "사우디의 계획 수립과 화력 지원이 아군에게 공격에서 결정적 우위를 제공합니다. 후티 반군에 대한 공격력 +15%."
 SAU_yemen_pipeline_t1: "아라비아해 송유관 (1단계)"
 SAU_yemen_pipeline_t1_desc: "사우디산 원유가 알마흐라를 거쳐 남쪽 아라비아해로 향하며 호르무즈 해협을 우회합니다. 송유관 수출로 §G추가 수입: $ 2.00B§!가 발생하는 반면, 송유관이 통과하는 국가에 지급하는 통과료로 §R추가 지출: $ 1.00B§!가 발생하여 순수입은 주당 §G+$ 1.00B§!입니다. 사보타주를 당하면 송유관 단계가 한 단계 낮아져 양쪽이 모두 줄어들며, 1단계 송유관이 끊기면 경로가 폐쇄됩니다."
 SAU_yemen_pipeline_t2: "아라비아해 송유관 (2단계)"
 SAU_yemen_pipeline_t2_desc: "사우디산 원유가 알마흐라를 거쳐 남쪽 아라비아해로 향하며 호르무즈 해협을 우회합니다. 송유관 수출로 §G추가 수입: $ 2.50B§!가 발생하는 반면, 송유관이 통과하는 국가에 지급하는 통과료로 §R추가 지출: $ 1.15B§!가 발생하여 순수입은 주당 §G+$ 1.35B§!입니다. 사보타주를 당하면 송유관 단계가 한 단계 낮아져 양쪽이 모두 줄어들며, 1단계 송유관이 끊기면 경로가 폐쇄됩니다."
 SAU_yemen_pipeline_t3: "아라비아해 송유관 (3단계)"
 SAU_yemen_pipeline_t3_desc: "사우디산 원유가 알마흐라를 거쳐 남쪽 아라비아해로 향하며 호르무즈 해협을 우회합니다. 송유관 수출로 §G추가 수입: $ 3.00B§!가 발생하는 반면, 송유관이 통과하는 국가에 지급하는 통과료로 §R추가 지출: $ 1.25B§!가 발생하여 순수입은 주당 §G+$ 1.75B§!입니다. 사보타주를 당하면 송유관 단계가 한 단계 낮아져 양쪽이 모두 줄어들며, 1단계 송유관이 끊기면 경로가 폐쇄됩니다."
 SAU_baath_state: "아랍 바트당"
 SAU_baath_state_tt: "§Y통일, 자유, 사회주의.§!\n\n당은 아랍 민족의 선봉대로서 장교와 노동자, 농민과 학생을 하나의 혁명 의지로 융합합니다. 모든 국경은 하나의 아랍 조국으로 가는 길의 경유지에 불과합니다."
 SAU_communist_state: "사회주의 국가"
 SAU_communist_state_tt: "아라비아의 프롤레타리아 독재입니다. 이러한 성과는 사우디 공산당이 집권하는 동안에만 유지됩니다. 권력을 잃으면 사라집니다."
 SAU_Military_Rule: "군사 통치"
 SAU_Monarchy_house_of_al_saud: "사우드 가문"
 SAU_nda_state: "민족민주회의"
 SAU_nda_state_tt: "자유주의 공화국의 제도는 투표를 통해 얻어낸 개혁이 거듭될 때마다 깊어집니다."
 SAU_nlf_doctrine: "비동맹 사회주의"
 SAU_nlf_doctrine_tt: "§Y아랍식 사회주의 노선 (민족해방전선 전용):§!\n§G+15% 정치력 획득, +10% 전쟁 지지도§!"
 SAU_peoples_council_works: "위원회 공공 사업"
 SAU_peoples_council_works_tt: "§Y인민위원회§!의 의뢰로 그 기준에 맞춰 건설됨"
 SAU_rep_shia_hardline_doctrine: "혁명적 신정 체제"
 SAU_rep_shia_hardline_doctrine_tt: "헤즈볼라 알히자즈가 법학자의 이름으로 통치하며, 국가는 저항을 위해 총동원됩니다."
 SAU_rep_shia_moderate_doctrine: "개혁주의 통치"
 SAU_rep_shia_moderate_doctrine_tt: "개혁 운동은 화해, 복지, 투표를 통해 통치합니다."
 SAU_rep_shia_state: "시아파 공화국"
 SAU_rep_shia_state_tt: "시아파 공화국의 제도는 개혁을 이루고 승리를 거둘 때마다 더욱 강화됩니다."
 SAU_scp_doctrine: "마르크스-레닌주의 전위"
 SAU_scp_doctrine_tt: "§Y정통 마르크스-레닌주의 (사우디 공산당 전용):§!\n§G+10% 공장 효율, +10% 건설 속도, +5% 안정도§!"
