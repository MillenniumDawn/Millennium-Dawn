 AFG_pomegranate_investment1_collect: "Коллекция гранатов"
 AFG_pomegranate_investment1_collect_desc: "Фермеры готовы принять от нас партию гранатов."
 AFG_almond_investment1_collect: "Коллекция миндаля"
 AFG_almond_investment1_collect_desc: "Фермеры готовы принять от нас партию миндаля."
 AFG_almond_investment1: "Инвестируйте в производство миндаля."
 AFG_almond_investment1_desc: "Миндаль является важным источником дохода для многих афганцев. Правительство может инвестировать в миндальную отрасль, предоставляя фермерам инфраструктуру, транспорт и доступ к рынкам. Данная инвестиционная программа ограничена пятью основными инициативами, после чего рынок достигнет насыщения. Инвестиции: 5% ВВП, доход: 6% ВВП (20% прибыли)."
 AFG_pomegranate_investment1: "Инвестируйте в производство гранатов."
 AFG_pomegranate_investment1_desc: "Афганские гранаты известны во всем мире своим качеством. Правительство может инвестировать в производственные мощности и торговые сети, чтобы извлечь выгоду из этого природного ресурса. Данная инвестиционная программа ограничена 5 крупными инициативами, после чего рынок достигнет насыщения. Инвестиции: 5% ВВП, доход: 6% ВВП (20% прибыли)."
 AFG_invite_nahzat_e_melli_ye_into_government: "Пригласить Хезб-э-Нухжат-е-Мили Афганистан в правительство"
 AFG_domestic_decisions: "Внутренние цели"
 AFG_domestic_decisions_desc: "В условиях восстановления страны мы поставили перед собой цели по перестройке государства и созданию нового будущего."
 AFG_taloqan_siege_mission: "Удержание города"
 AFG_taloqan_siege_mission_desc: "Обеспечение безопасности города имеет решающее значение, поскольку наша территория сокращается, а обширные равнины северо-запада представляют собой привлекательную цель для будущего наступления."
 AFG_headquarters_taloqan: "Штаб-квартира Талокана"
 AFG_headquarters_taloqan_desc: "Талокан стал ключевым опорным пунктом Ахмада Шаха Масуда во время советского вторжения. Впоследствии он превратился в центральный командный пункт.  [AFG.GetFlag] [AFG.GetNameDefCap]Этот город стал важнейшим пунктом доступа в Таджикистан после падения Мазари-Шарифа под натиском талибов в 1997 году."
 taliban_insurgency_category: "Восстание талибов"
 taliban_insurgency_category_desc: "Хотя £GFX_AFG_salafist_jihadism §YТалибан§! Силы коалиции были разгромлены, но не уничтожены полностью, а боевики «Талибана» были раздроблены на части и начали новую кампанию. §Rповстанческое движение§! во всех уголках Афганистана и начал осуществлять различные операции. §Rтеррористические атаки§! против нового правительства и коалиционных сил. Ожидается, что искоренение повстанческого движения талибов займет годы, в зависимости от многих факторов.\n\nОн §YСила талибов§! Это определяет силу боевиков Талибана внутри страны, и от этого будет зависеть как рост их влияния, так и эффективность нашей борьбы с повстанческим движением. §YДоверие к центральному правительству (стабильность, коррупция или иностранное вмешательство)§! и §Yситуация на афгано-пакистанской границе§!. Если §YСила талибов§! слишком высоко, £GFX_AFG_salafist_jihadism §YТалибан§! сможет выполнить §Rтеррористические атаки§!и может даже довести это до критической ситуации. §Rвозобновилась гражданская война§! хотя некоторые методы могут быть эффективны в краткосрочной перспективе для борьбы с угрозой со стороны талибов.\n\n§YСила талибов§!: [?AFG.taliban_strength]%"
 AFG_pashtunistan_decisions: "Объединение Паштунистана"
 AFG_pashtunistan_decisions_desc: "Почти 16% населения Пакистана относят себя к пуштунам, самой многочисленной этнической группе Афганистана. Большинство пакистанских пуштунов проживают в северо-западных районах страны. Из-за гражданской войны в Пакистане многие из этих людей сейчас страдают от ужасающего режима. Наш долг — защитить их."
 AFG_russian_airlift_is_active: "Имеет российский воздушный мост."
 AFG_donkey_logistics_tech: "Логистика вьючных животных"
 AFG_donkey_logistics_tech_desc: "Караваны мулов и ослов перевозят грузы через перевалы, недоступные для грузовиков."
 AFG_donkey_logistics_tech2: "Логистика вьючных животных II"
 AFG_donkey_logistics_tech2_desc: "Более крупные караваны и оборудованные перевалочные пункты вдоль северных маршрутов."
 AFG_donkey_logistics_tech3: "Логистика вьючных животных III"
 AFG_donkey_logistics_tech3_desc: "Вокруг караванов, которые никогда не прекращали движение, сформировался постоянный транспортный корпус."
 AFG_legacy_of_the_mujahideen: "Наследие моджахедов"
 AFG_legacy_of_the_mujahideen_desc: "Ветераны советской войны передают свои навыки ведения боевых действий ополченцам."
 AFG_tech_the_farmer_and_their_rifle: "Фермер и его винтовка"
 AFG_tech_the_farmer_and_their_rifle_desc: "Сельские отряды, которые борются за свои долины и знают все пути к ним."
 AFG_tech_training_of_local_police_officers: "Обучение сотрудников местной полиции"
 AFG_tech_training_of_local_police_officers_desc: "Ополченцы обучены как полицейской деятельности, так и ведению боевых действий, а также удержанию захваченных территорий."
 AFG_tech_return_of_dostum: "Возвращение Дотума"
 AFG_tech_return_of_dostum_desc: "Достум вернулся на север, и узбекские ополченцы ведут бои соответственно."
