 civil_war_bosnia: "보스니아 내전 진행 중"
 BOS_EUFOR: "EUFOR"
 BOS_EUFOR_desc: "보스니아 헤르체고비나 유럽연합군은 SFOR의 뒤를 이은 EU 주도의 평화유지 임무로, 평화와 안정을 유지하고 현지 당국을 지원하며 보스니아 전쟁을 끝낸 데이턴 협정을 이행하는 것을 목표로 합니다."
 BOS_SFOR: "SFOR"
 BOS_SFOR_desc: "보스니아 헤르체고비나 안정화군은 NATO 주도의 다국적 평화유지군입니다.\n§W---------------§!\n보스니아 전쟁 이후 세계은행, 유럽 연합, UN 개발계획, USAID 등 국제 협력 기관들이 보스니아의 재건에 자금을 댔습니다. 이들의 사업은 기반시설을 재건하고, 통치와 공공 서비스를 강화하며, 경제 회복을 뒷받침했습니다."
 BOS_attack_upon_nato: "NATO 공격"
 BOS_bosniak_balkan_aspiration: "보스니아의 발칸 열망"
 BOS_srpska_balkan_aspiration: "세르비아의 발칸 열망"
 BOS_croat_balkan_aspiration: "크로아티아의 발칸 열망"
 BOS_post_yugoslav_war_state: "유고슬라비아 전쟁 전후 상황"
 BOS_post_yugoslav_war_state_desc: "보스니아는 1990년대 유고슬라비아 전쟁 중 독립을 선언하는 데 성공한 네 공화국 가운데 하나입니다. 이 넷 중 가장 큰 참상을 겪었으며, 수천 명의 난민이 나라를 떠났습니다. 광대한 지역이 지뢰와 불발탄으로 오염되어 있습니다. 옛 시민들 중 상당수는 지금 해외에서 살고 있습니다. 이러한 사건들로 UN은 위험에 처한 이들을 보호할 수 없거나 보호하려 하지 않는 기구라는 새롭고도 불명예스러운 평판을 얻었습니다."
 BOS_police_high: "높은 경찰 예산"
