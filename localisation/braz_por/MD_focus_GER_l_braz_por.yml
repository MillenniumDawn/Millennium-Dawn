 balkan_stability_50: "Intervenção Necessária"
 balkan_stability_60: "Em Chamas"
 get_active_in_balkans: "Ativar-se nas atividades nos Bálcãs"
 retreat_from_balkans: "Retirar-se dos Bálcãs"
 Rearm_the_Balkans: "Rearmar nossos parceiros de [FROM.GetName]"
 support_nationalist_movements: "Apoiar movimento nacionalista"
 Send_peacekeepers_SOV: "Abrir bases militares"
 Send_peacekeeper: "abrir bases militares"
 Balkan.1.t: "Sérvia Lança um Ataque contra o Kosovo!"
 Balkan.1.d: "As tensões nos Bálcãs voltaram a eclodir em conflito aberto, quando forças sérvias lançam uma ofensiva militar contra o Kosovo. Sob pressão esmagadora, o governo kosovar pediu ajuda internacional. Como seus aliados, devemos decidir como responder: devemos empenhar nossas forças em sua defesa, fornecer-lhes ajuda militar ou evitar o envolvimento direto para proteger nossos próprios soldados?"
 Balkan.1.a: "Entraremos na luta!"
 Balkan.1.b: "Enviar equipamentos e suprimentos."
 Balkan.1.c: "Isso não vale arriscar a vida de nossos soldados."
 Balkan.101.t: "Apoio Aliado ao Kosovo!"
 Balkan.101.d: "Nossos aliados atenderam ao nosso chamado e empenharam suas forças na defesa do Kosovo. Com a ajuda deles, temos agora mais chances de repelir a agressão sérvia e garantir a soberania do Kosovo."
 Balkan.101.a: "Juntos, venceremos!"
 Balkan.102.t: "Ajuda Militar Chega ao Kosovo"
 Balkan.102.d: "Embora nossos aliados tenham optado por não intervir diretamente, enviaram armas e suprimentos muito necessários. Isso fortalece nossas defesas, mas a ausência de suas tropas nos deixa sozinhos diante do grosso do ataque sérvio."
 Balkan.102.a: "Pelo menos não fomos completamente abandonados."
 Balkan.103.t: "Kosovo Está Sozinho"
 Balkan.103.d: "Apesar de nossos apelos desesperados por ajuda, nossos supostos aliados se recusaram a enviar tropas ou suprimentos. O Kosovo agora é deixado para enfrentar o poderio militar da Sérvia com seus próprios recursos limitados. A traição não será esquecida."
 Balkan.103.a: "Nós nos lembraremos disso."
 Balkan.2.t: "Bósnia Pede Ajuda!"
 Balkan.2.d: "Forças sérvias lançaram uma campanha agressiva contra a Bósnia, ameaçando desestabilizar toda a região. O governo bósnio pediu nossa ajuda. Ficaremos ao lado deles e enviaremos tropas, forneceremos suprimentos militares ou ficaremos fora do conflito para evitar pôr em risco nossas próprias forças?"
 Balkan.2.a: "Entraremos na luta!"
 Balkan.2.b: "Enviar armas e suprimentos."
 Balkan.2.c: "Esta não é a nossa guerra."
 Balkan.201.t: "Forças Aliadas Chegam à Bósnia"
 Balkan.201.d: "Nossos aliados responderam ao pedido de ajuda da Bósnia e empenharam suas forças para repelir a ofensiva sérvia. Seu apoio fortalece nossa posição e garante um esforço coordenado contra a agressão sérvia."
 Balkan.201.a: "Unidos, venceremos!"
 Balkan.202.t: "Armas para a Bósnia"
 Balkan.202.d: "Embora nossos aliados tenham se recusado a enviar tropas, forneceram à Bósnia armas e recursos muito necessários. Isso ajudará as forças bósnias a defender sua terra, mas, sem apoio militar externo, o resultado da luta continua incerto."
 Balkan.202.a: "Pelo menos temos algum respaldo."
 Balkan.203.t: "Bósnia É Deixada para Lutar Sozinha"
 Balkan.203.d: "Apesar de repetidos pedidos de ajuda, nossos chamados aliados deram as costas à Bósnia. Sem apoio externo, o governo bósnio deve agora depender inteiramente de sua própria força para resistir à agressão sérvia."
 Balkan.203.a: "Não esqueceremos essa traição."
 Balkan.3.t: "Croácia Busca Restaurar Sua Antiga Glória"
 Balkan.3.d: "O governo croata declarou abertamente sua ambição de reconquistar sua antiga posição e influência nos Bálcãs. Esse recém-descoberto nacionalismo levanta preocupações entre seus vizinhos e a comunidade internacional. Até onde a Croácia irá em sua busca pela grandeza?"
 Balkan.3.a: "Um movimento ousado para a região."
 Balkan.301.t: "Croácia Se Volta para Dentro"
 Balkan.301.d: "Com o fervor nacionalista tomando conta do país, a Croácia revogou a permissão para que todas as forças ocidentais operem dentro de suas fronteiras. Com o aumento das tensões, a incerteza paira sobre a região. Quem sabe o que virá a seguir?"
 Balkan.301.a: "Isso pode ter consequências."
 Balkan.302.t: "Croácia Pede Apoio à Rússia"
 Balkan.302.d: "A Croácia entrou em contato conosco, a gloriosa Rússia, a protetora incontestável das nações eslavas, em busca de ajuda. Embora o apoio direto corra o risco de provocar a OTAN, há maneiras de ajudá-los discretamente sem convidar a um conflito aberto."
 Balkan.302.a: "Enviar equipamentos e alguns soldados. Ahn, quer dizer... voluntários."
 Balkan.302.b: "Alguns voluntários não levantarão suspeitas."
 Balkan.302.c: "Arriscado demais para uma guerra sem sentido."
 Balkan.303.t: "Apoio Russo Fortalece a Croácia"
 Balkan.303.d: "O equipamento e o pessoal fornecidos pela Rússia reforçaram significativamente as capacidades militares da Croácia. Com esse respaldo, a Croácia está agora em posição mais forte para perseguir sua agenda nacionalista."
 Balkan.303.a: "Agradecemos à Rússia por seu apoio inabalável!"
 Balkan.304.t: "A Solução dos 'Voluntários'"
 Balkan.304.d: "'Voluntários' russos se juntaram discretamente às forças croatas, oferecendo experiência e reforçando suas fileiras. Embora o mundo possa suspeitar do envolvimento russo, a negação plausível permanece intacta, por ora."
 Balkan.304.a: "Os 'gentis voluntários' da Rússia são sempre bem-vindos."
 Balkan.305.t: "Rússia Nega o Pedido da Croácia"
 Balkan.305.d: "Apesar do pedido, o Kremlin decidiu não se envolver nas aspirações nacionalistas da Croácia. Entregue à própria sorte, a Croácia deve agora buscar outra forma de realizar suas ambições."
 Balkan.305.a: "Suka, blyad!"
 Balkan.4.t: "Albânia Busca Restaurar Sua Antiga Glória"
 Balkan.4.d: "A liderança da Albânia começou a defender um retorno à sua antiga proeminência, agitando o sentimento nacionalista e levantando preocupações na região. Até onde suas ambições os levarão?"
 Balkan.4.a: "Um movimento ousado para a região."
 Balkan.401.t: "Albânia Expulsa Forças Ocidentais"
 Balkan.401.d: "Movida por ideais nacionalistas, a Albânia revogou todas as permissões para que forças ocidentais operem dentro de suas fronteiras. Sem supervisão estrangeira, seus próximos passos permanecem imprevisíveis."
 Balkan.401.a: "Isso pode levar à instabilidade."
 Balkan.402.t: "Albânia Busca Ajuda Russa"
 Balkan.402.d: "Em um movimento surpreendente, a Albânia recorreu a nós, a poderosa Rússia, para apoiar suas ambições. O envolvimento direto poderia provocar a OTAN, mas há maneiras de ajudá-los discretamente sem desencadear um conflito aberto."
 Balkan.402.a: "Enviar equipamentos e alguns soldados. Ahn, quer dizer... voluntários."
 Balkan.402.b: "Alguns voluntários não levantarão suspeitas."
 Balkan.402.c: "Arriscado demais para uma guerra sem sentido."
 Balkan.403.t: "Apoio Russo Fortalece a Albânia"
 Balkan.403.d: "Graças à ajuda russa, a Albânia agora possui equipamento modernizado e experiência tática. Seu movimento nacionalista ganhou força significativa, preparando o terreno para possíveis conflitos futuros."
 Balkan.403.a: "Agradecemos à Rússia por seu apoio incrível!"
 Balkan.404.t: "A Solução dos 'Voluntários'"
 Balkan.404.d: "'Voluntários' russos se juntaram discretamente às forças albanesas, aprimorando suas capacidades e reforçando sua confiança. Apesar das suspeitas da OTAN, não há evidências diretas ligando a Rússia à operação."
 Balkan.404.a: "Agradecer à Rússia por seus 'gentis voluntários'!"
 Balkan.405.t: "Rússia Recusa o Pedido da Albânia"
 Balkan.405.d: "Apesar do apelo da Albânia, Moscou optou por ficar fora da situação. Sem apoio externo, a Albânia terá de perseguir suas ambições nacionalistas por conta própria."
 Balkan.405.a: "Suka, blyad!"
 Balkan.5.t: "Inteligência Britânica Relata Envolvimento Russo"
 Balkan.5.d: "A agência de inteligência britânica MI6 apresentou provas de que a Rússia está secretamente armando e apoiando movimentos nacionalistas nos Bálcãs. Se for verdade, isso poderia desestabilizar a região e minar os esforços internacionais para manter a paz. Como devemos responder a essas descobertas alarmantes?"
 Balkan.5.a: "Enviar uma nota de protesto a Moscou."
 Balkan.5.b: "Não devemos reagir de forma exagerada."
 Gruner_news.1.t: "Stern Investiga o Assassinato de Seus Jornalistas"
 Gruner_news.1.d: "Em 13 de junho de 1999, os jornalistas da Stern Gabriel Grüner e Volker Krämer, junto com seu intérprete Senol Alit, foram mortos no Kosovo. Inicialmente, boatos sugeriam que haviam sido atraídos para uma armadilha enquanto procuravam valas comuns, mas a Stern abriu sua própria investigação. Os jornalistas voltavam de Prizren quando seguiram pelo Passo de Dulje, considerado seguro. Em um posto de controle do Exército Iugoslavo, o combatente russo Alexander T., fugindo das forças da KFOR, bateu seu carro e, em desespero, atirou contra o veículo da Stern, matando Krämer e Alit na hora. Grüner morreu mais tarde em decorrência dos ferimentos. Alexander T. então roubou o carro deles e escapou. Agora, um tribunal de Hamburgo decidirá se emite um mandado de prisão internacional contra ele, que, segundo relatos, vive em Moscou."
 Gruner_news.1.a: "curioso"
 Gruner.1.t: "Tribunal de Hamburgo Considera Mandado de Prisão Internacional para Cidadão Russo"
 Gruner.1.d: "Em junho de 1999, os jornalistas da Stern Gabriel Grüner e Volker Krämer, junto com seu intérprete Senol Alit, foram tragicamente mortos no Kosovo. Investigações posteriores da Stern identificaram o mercenário russo Alexander Tchernomachentsev como o suposto autor. Tchernomachentsev teria se juntado ao Exército Iugoslavo como voluntário em 1998 e foi visto em sua cidade natal sérvia pouco depois do incidente. Em 2001, acreditava-se que residia em Moscou e trabalhava como segurança. O tribunal de Hamburgo está avaliando se as provas reunidas são suficientes para emitir um mandado de prisão internacional contra Tchernomachentsev. Essa decisão tem implicações diplomáticas significativas, já que a constituição da Rússia proíbe a extradição de seus cidadãos, o que pode complicar as relações internacionais. As famílias das vítimas e a comunidade jornalística continuam buscando justiça, enfatizando a importância da cooperação internacional no combate a crimes contra jornalistas."
 Gruner.1.a: "As provas são irrefutáveis."
 Gruner.1.b: "Devemos evitar complicações internacionais."
 Gruner_news.2.t: "Mandado de Prisão Internacional Emitido pelo Assassinato de Jornalistas"
 Gruner_news.2.d: "Após as trágicas mortes dos jornalistas da Stern Gabriel Grüner e Volker Krämer, junto com seu intérprete Senol Alit, no Kosovo em 13 de junho de 1999, as autoridades alemãs emitiram um mandado de prisão internacional contra o suposto autor, o mercenário russo Alexander Tchernomachentsev. As investigações revelaram que Tchernomachentsev, ao fugir do Kosovo, teria aberto fogo contra os jornalistas para tomar o veículo deles e escapar. Stern.de. Apesar do mandado, a extradição permanece improvável. Tchernomachentsev, que segundo relatos reside em Moscou e trabalha como segurança, teria ligações com os serviços de inteligência russos. A constituição russa proíbe a extradição de seus cidadãos, o que complica os esforços para levá-lo a julgamento na Alemanha. Esse impasse pode abalar as relações diplomáticas entre Alemanha e Rússia, evidenciando os desafios da justiça internacional quando leis nacionais e interesses geopolíticos se cruzam. As famílias das vítimas e a comunidade jornalística continuam buscando responsabilização pelos assassinatos, enfatizando a necessidade de cooperação no combate a crimes contra jornalistas em todo o mundo."
 Gruner_news.2.a: "se ao menos conseguíssemos pegá-lo"
 GER_news.13.t: "Turistas Alemães Sequestrados no Saara"
 GER_news.13.d: "O que deveria ser um simples pacote de férias com um pouco de aventura, uma curta viagem ao Saara, transformou-se em um pesadelo. 32 turistas, incluindo 22 cidadãos alemães, foram sequestrados. Crescem os rumores de que grupos armados, possivelmente ligados a organizações militantes islamistas, estejam por trás do sequestro.\n\nO governo alemão agora enfrenta uma decisão difícil: como responder a essa perigosa crise que se desenrola tão longe de casa."
 GER_news.13.a: "Formar uma Equipe de Resposta à Crise"
 GER_news.14.t: "Primeira Reunião de Crise: Opções de Resposta"
 GER_news.14.d: "Nossa equipe de resposta à crise avaliou a situação. As autoridades argelinas oferecem ajuda, mas parecem relutantes em assumir total iniciativa. Devemos decidir se confiamos plenamente nelas, se coordenamos de perto mas lideramos nós mesmos, ou se nos preparamos para uma ação independente para resgatar nossos cidadãos."
 GER_news.14.a: "Deixar a Argélia liderar e aguardar os resultados"
 GER_news.14.b: "A Argélia conhece o terreno, mas nós temos a tecnologia. Coordenar, mas manter o controle."
 GER_news.14.c: "Forças especiais, aviões, inteligência, o que for preciso para trazê-los para casa."
 GER_news.15.t: "Envio de Recursos Alemães ao Saara"
 GER_news.15.d: "Após a decisão do governo, forças especiais alemãs e aeronaves de reconhecimento foram colocadas em alerta máximo. Drones de vigilância e agentes de inteligência estão sendo enviados para rastrear os movimentos dos reféns pelo vasto deserto.\n\nNossas forças devem agora se preparar para duas estratégias paralelas: negociar com os sequestradores ou executar uma operação de precisão caso as negociações fracassem."
 GER_news.15.a: "Manter a flexibilidade. Vidas dependem disso."
 GER_news.16.t: "Contato Estabelecido com os Sequestradores"
 GER_news.16.d: "Após intensos esforços por meio de intermediários e canais locais, nossa equipe de crise estabeleceu contato indireto com os sequestradores. Foram feitas exigências, algumas políticas, outras financeiras. As negociações serão difíceis, mas a porta para uma resolução pacífica permanece aberta."
 GER_news.16.a: "Iniciar as negociações imediatamente. Cada hora conta."
 GER_news.16.b: "Não lhes dar tempo para se preparar, Ausrücken in 30 Minuten!"
 GER_news.17.t: "Negociações Bem-Sucedidas: Reféns Serão Libertados"
 GER_news.17.d: "Após dias tensos de comunicação e diplomacia cuidadosa, um acordo foi alcançado. Os reféns serão libertados ilesos em uma entrega coordenada. A equipe de resposta à crise está de prontidão para garantir seu retorno seguro."
 GER_news.17.a: "Preparar a extração e os exames médicos."
 GER_news.18.t: "Negociações Fracassam"
 GER_news.18.d: "As conversas com os sequestradores fracassaram. Ou suas exigências se tornaram inaceitáveis, ou divisões internas entre os militantes sabotaram qualquer acordo possível. A inteligência alerta que os reféns agora estão sendo levados mais fundo no deserto. O tempo das soluções diplomáticas pode ter acabado."
 GER_news.18.a: "Preparar a força-tarefa para um assalto."
 GER_news.19.t: "Operação de Assalto: Fracasso Catastrófico"
 GER_news.19.d: "Nossas forças especiais lançaram o assalto ao acampamento dos sequestradores no deserto sob condições extremas mas, apesar de sua bravura, a missão mergulhou no caos. Os reféns foram movidos momentos antes do ataque, e os militantes lutaram com mais afinco do que o previsto.\n\nVários reféns e soldados foram mortos na tentativa. O deserto engoliu nossas esperanças em areia e sangue. Agora, começa um acerto de contas nacional."
 GER_news.19.a: "Um dia sombrio para a Alemanha."
 GER_news.20.t: "Missão de Resgate: Sucesso Parcial"
 GER_news.20.d: "O ataque ao acampamento dos sequestradores conseguiu libertar a maioria dos reféns. No entanto, nem todos sobreviveram ao caótico tiroteio. Algumas famílias receberão seus entes queridos em casa; outras lamentarão perdas irreparáveis.\n\nA nação se divide entre o orgulho e o luto, celebrando os salvos, mas chorando aqueles que não pudemos trazer de volta."
 GER_news.20.a: "Honrar os vivos e os caídos."
 GER_news.21.t: "Operação de Assalto: Sucesso Total"
 GER_news.21.d: "A operação de resgate superou até as expectativas mais otimistas. Todos os reféns foram resgatados em segurança, e os sequestradores foram neutralizados sem perda de vidas alemãs. As forças especiais executaram a missão com precisão, rapidez e superioridade esmagadora.\n\nEm toda a Alemanha, os veículos de imprensa saúdam a operação como um exemplo de manual de resposta moderna a crises. A confiança no governo e nas forças armadas disparou enquanto a nação celebra o retorno de seus cidadãos."
 GER_news.21.a: "Uma vitória impecável para a Alemanha."
 GER_news.22.t: "Reféns Voltam para Casa na Alemanha"
 GER_news.22.d: "Hoje, um avião fretado pousou no Aeroporto de Berlim-Tegel, trazendo de volta para casa os reféns alemães resgatados. Famílias, autoridades do governo e militares se reuniram para recebê-los. Os membros da força-tarefa especial foram homenageados por sua coragem e dedicação sob pressão extrema."
 GER_news.22.a: "Um momento de orgulho para nossa nação."
 GER_news.23.t: "Luto Nacional Após Resgate Fracassado"
 GER_news.23.d: "Os corpos dos caídos retornaram à Alemanha sob forte escolta. Cerimônias solenes estão planejadas em todo o país para homenagear as vítimas. Foi ordenada uma investigação completa para examinar cada decisão e erro cometido durante a crise. A memória de Munique '72 paira sobre esta tragédia, uma dolorosa lembrança do custo do fracasso no cenário mundial."
 GER_news.23.a: "Um dia sombrio para a Alemanha."
 GER_news.24.t: "Sucesso Parcial: Reféns Retornam, Mas Nem Todos"
 GER_news.24.d: "Hoje, aviões de transporte militar pousaram em solo alemão, trazendo para casa os reféns resgatados. Para a maioria das famílias, é um momento de imenso alívio e gratidão.\n\nNo entanto, esse alívio é ofuscado pela profunda dor das famílias que nunca mais ouvirão as histórias das aventuras de seus entes queridos. Alguns pais, filhos, irmãos e amigos ficam apenas com o luto. A nação deve agora honrar tanto os vivos quanto os mortos e aprender as duras lições dessa crise."
 GER_news.24.a: "Um retorno agridoce."
 GER_anti_terror_help1: "Cooperação para libertar Reféns"
 GER_anti_terror_help2: "Cooperação para libertar Reféns"
 GER_the_Eurofighter: "Alemanha Ingressou no Programa Eurofighter"
 GER_BMW_Focus_tt: "§YA BMW tentará desenvolver um veículo utilitário§!"
 GER_GNY: "German Naval Yards Reestruturada"
 GER_GNY_desc: "Em uma decisão firme para recuperar o controle soberano sobre capacidades navais essenciais, o governo alemão apoiou a separação formal da German Naval Yards do conglomerado HDW, sediado em Kiel. A reestruturação restabelece a GNY como uma entidade independente, voltada à construção naval de superfície, à modernização e ao apoio à frota da Bundeswehr e de parceiros europeus. A divisão é vista como um passo estratégico para reduzir dependências externas, fortalecer a resiliência industrial e preparar futuras iniciativas de defesa marítima, incluindo fragatas e navios de apoio de nova geração."
 germany.66.t: "Novo Jipe Militar da BMW Fracassa"
 germany.66.d: "A BMW forneceu seu primeiro veículo militar gratuitamente ao Exército Alemão para testes extensivos, na esperança de entrar no mercado de veículos utilitários militares. No papel parecia impressionante, com linhas limpas, para-lamas robustos e uma capota de lona elegante. Na prática, revelou-se uma grande decepção, pois seu consumo de óleo era exorbitante e, após apenas alguns quilômetros, o motor travava. Durante um recente exercício de campo, o veículo quebrou completamente, forçando os soldados a caminhar vinte quilômetros de volta à base a pé."
 germany.66.a: "Nos importamos com a aparência, não com nossos soldados"
 germany.66.b: "Nos importamos com a qualidade, não com a aparência"
 germany.67.t: "Helsing SE Fundada"
 germany.67.d: "A Helsing SE, uma nova empresa de tecnologia de defesa sediada em Munique, foi criada para desenvolver drones de ataque movidos a IA e sistemas autônomos exclusivamente para governos democráticos. O Governo Federal saúda esse impulso à nossa indústria militar de ponta."
 germany.67.a: "Excelente, um reforço para nossas defesas"
 GER_winds.7.t: "Extremismo Expurgado da Bundeswehr"
 GER_winds.7.d: "Em um movimento saudado como um ponto de virada para a resiliência democrática, o governo alemão anunciou a conclusão de uma ampla campanha interna para erradicar o extremismo de extrema-direita da Bundeswehr. Após uma série de escândalos e relatórios de inteligência nos anos anteriores, as forças armadas enfrentaram intenso escrutínio quanto à infiltração ideológica, ao revisionismo histórico e à tolerância de redes extremistas.\n\nPor meio de uma combinação de reformas estruturais, coordenação de inteligência e treinamento de oficiais baseado em valores, o Ministério da Defesa agora afirma ter restaurado a integridade de suas fileiras.\n\n'Queremos cidadãos de uniforme, não um retorno da SS', declarou um porta-voz do governo. A confiança pública permanece cautelosa, mas a mensagem é clara: a Bundeswehr existe para defender a democracia, não para miná-la."
 GER_winds.7.a: "Um passo necessário para um exército moderno"
 GER_idea_deutsche_bahn_investments: "Investimentos da Deutsche Bahn"
 GER_global_infrastructure_projects_tt: "Se um país aceitar, ganharemos §YInfluência§! e §GInvestimento Internacional§!"
 GER_Strategic_Partnership_tt: "Quando aceito, o país convidado se juntará ao nosso §YGrupo de Compartilhamento de Tecnologia§! e ganharemos §YInfluência§! e §GReceita Internacional§!"
 GER_Eurofighter.2.t: "Variante do Eurofighter Oferecida para Testes"
 GER_Eurofighter.2.d: "À medida que o cenário global de segurança continua a se deslocar para zonas marítimas disputadas e projeção de força de longo alcance, o Consórcio Eurofighter nos apresentou dois caminhos de atualização especializados para a célula do Typhoon. Essas variantes visam ampliar o papel operacional do caça além de seus atuais parâmetros multifunção.\n\nA primeira proposta se concentra em uma Variante de Patrulha Naval de longo alcance, otimizada para vigilância costeira, operações antinavio e ataque marítimo. Com integração de radar aprimorada, maior capacidade de combustível e maior autonomia de missão, essa variante preencheria as lacunas atuais no reconhecimento aéreo sobre o mar.\n\nA segunda opção prevê um Eurofighter Capaz de Operar em Porta-Aviões, adaptado para lançamento e recuperação em porta-aviões. Esse conceito exigiria reforços estruturais, integração de gancho de parada e compatibilidade com STOBAR, podendo posicionar a Alemanha na vanguarda da futura aviação naval na Europa.\n\nCada proposta oferece vantagens estratégicas diferentes. No entanto, ambas exigem financiamento significativo, mudanças doutrinárias e, possivelmente, investimentos de longo prazo em infraestrutura de apoio. Nosso ministério da defesa deve agora avaliar se adotará uma dessas variantes voltadas para o futuro ou se redirecionará o orçamento alocado para outros esforços de modernização."
 GER_Eurofighter.2.a: "Adotar a Variante de Patrulha Naval"
 GER_Eurofighter.2.a_desc: "A variante de patrulha tem maior alcance, integração de radar marítimo e modificações reforçadas na célula para vigilância prolongada sobre o mar. Seria ideal para proteger rotas marítimas e afirmar presença em zonas marítimas disputadas."
 GER_Eurofighter.2.b: "Adotar a Variante Capaz de Operar em Porta-Aviões"
 GER_Eurofighter.2.b_desc: "O Eurofighter para porta-aviões inclui trem de pouso reforçado, sistema de gancho de parada e modificações estruturais para compatibilidade com STOBAR. Embora tecnicamente ambiciosa, essa variante ofereceria um salto na projeção de poder aéreo a partir de plataformas navais."
 GER_Eurofighter.2.c: "Realocar os Fundos"
 GER_Eurofighter.2.c_desc: "Embora as variantes propostas ofereçam capacidades únicas, atualmente carecemos da infraestrutura ou da necessidade estratégica para sustentar seu emprego. Os recursos serão realocados para programas de aquisição ou de P&D mais imediatos."
 GER_Eurofighter.3.t: "Linhas de Montagem Final Conjuntas Propostas"
 GER_Eurofighter.3.d: "Como parte da coordenação em andamento do Consórcio Eurofighter, foi apresentada uma proposta para racionalizar e formalizar a estrutura das fábricas de montagem final. A ideia é atribuir a cada nação participante um polo de montagem especializado, mantendo padrões e prazos unificados. Essa abordagem fortaleceria a colaboração industrial, mas poderia limitar o controle independente sobre o ritmo de produção e a personalização nacional."
 GER_Eurofighter.3.a: "Aceitar a coordenação conjunta da montagem"
 GER_Eurofighter.3.b: "Manter nossa montagem final nacional independente"
 GER_Eurofighter.4.t: "Programas Compartilhados de Pesquisa e Desenvolvimento"
 GER_Eurofighter.4.d: "O Consórcio Eurofighter abriu a próxima fase da cooperação multilateral: um marco unificado de pesquisa e desenvolvimento. Ao reunir recursos de engenharia, dados de voo e planejamento de atualizações, todos os parceiros se beneficiariam de um progresso sincronizado e de custos reduzidos. No entanto, a participação pode reduzir o controle nacional sobre as prioridades tecnológicas e a autonomia de exportação."
 GER_Eurofighter.4.a: "Participar da P&D compartilhada"
 GER_Eurofighter.4.b: "Recusar e manter pesquisa independente"
 GER_Eurofighter.5.t: "[ROOT.GetNameWithFlag] Assume a Montagem das Asas"
 GER_Eurofighter.5.d: "[ROOT.GetNameWithFlag] assumiu oficialmente a responsabilidade pela produção dos componentes das asas do Eurofighter. Isso inclui o controle sobre a modelagem aerodinâmica, a integração dos pontos de fixação de armamento e os sistemas internos de combustível. Seu setor industrial passa a ter papel crucial nas características de voo e na eficiência estrutural do caça."
 GER_Eurofighter.5.a: "interessante"
 GER_Eurofighter.6.t: "[ROOT.GetNameWithFlag] Assume a Produção da Fuselagem"
 GER_Eurofighter.6.d: "[ROOT.GetNameWithFlag] assumiu o segmento central da fuselagem e da célula da montagem do Eurofighter. Essa responsabilidade inclui o núcleo estrutural da aeronave e seus sistemas de sustentação de carga, uma posição-chave na definição da adaptabilidade e da resiliência do caça."
 GER_Eurofighter.6.a: "interessante"
 GER_Eurofighter.7.t: "[ROOT.GetNameWithFlag] Assume a Cabine e a Aviônica"
 GER_Eurofighter.7.d: "[ROOT.GetNameWithFlag] assumiu a liderança da produção da seção do nariz, da cabine e do conjunto de aviônica do Eurofighter. Esse segmento determina a posição dos sensores, o projeto das interfaces e as capacidades do radar, concedendo controle estratégico sobre a consciência situacional e o potencial de combate da aeronave."
 GER_Eurofighter.7.a: "interessante"
