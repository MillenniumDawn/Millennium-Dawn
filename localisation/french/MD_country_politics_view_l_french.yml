 RETIRE_LEADER: "§Y[Root.GetLeader]§! \n §RPrendre sa retraite§! comme dirigeant"
 RETIRE_LEADER_TT: "Cela ferait certainement un choc, coûterait un lourd prix politique et interdirait à jamais le retour de [Root.GetLeader] en politique, mais il reste la possibilité de se retirer pour passer plus de temps en famille et s'éloigner du labeur politique.\n\n§YPrérequis :§! \n[!retire_leader_button_click_enabled] \n§YEffets :§! \n[!retire_leader_button_click]"
