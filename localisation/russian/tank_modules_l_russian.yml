 helicopter_heavy_chassis: "Тяжелое вертолетное шасси"
 helicopter_heavy_chassis_desc: "Шасси вертолета большой грузоподъемности, для больших, тяжелых вертолетов"
 helicopter_medium_chassis: "Шасси среднего вертолета"
 helicopter_medium_chassis_desc: "Шасси среднего вертолета, для транспортных или боевых вертолетов."
 helicopter_light_chassis: "Шасси легкого вертолета"
 helicopter_light_chassis_desc: "Легкое вертолетное шасси для легких боевых вертолетов и разведывательных вертолетов."
 mast_mounted_camera: "Камера, устанавливаемая на мачте"
 mast_mounted_camera_desc: "Система целеуказания с камерой и лазером для вертолетов, устанавливаемая на верхней части роторного узла."
 mast_mounted_radar: "Радар, устанавливаемый на мачте"
 mast_mounted_radar_desc: "Компактный радар управления огнем, установленный над втулкой ротора, позволяющий обнаруживать цели и поражать их, оставаясь в укрытии. Способен отслеживать несколько целей одновременно и направлять управляемые радаром боеприпасы. Улучшает ситуационную осведомленность и выживаемость на сложной местности."
 light_helicopter_armor_gen1: "Лёгкая броня для вертолётов 1-го поколения"
 light_helicopter_armor_gen1_desc: "Ранние схемы бронирования ударных вертолетов включали броню вокруг кабины, критических компонентов и жизненно важных систем, обеспечивающую защиту от огня стрелкового оружия и осколков."
 light_helicopter_armor_gen2: "Лёгкая броня для вертолётов 2-го поколения"
 light_helicopter_armor_gen2_desc: "С изобретением и внедрением композитной брони схемы бронирования боевых вертолетов стали обеспечивать дополнительную защиту. Также начали применяться схемы реактивной брони, обеспечивающие ещё большую защиту."
 light_helicopter_armor_gen3: "Лёгкая броня для вертолётов 3-го поколения"
