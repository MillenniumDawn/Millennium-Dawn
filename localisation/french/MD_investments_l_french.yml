 investments_clock_tt: "§YDélai d'achèvement de l'investissement :§! [?ROOT.project_total_construction_duration_display^-1] jours\n\nLe §Ydélai d'achèvement de l'investissement§! §gou la durée du projet est simplement le total du temps nécessaire pour achever notre projet proposé dans [PREV.GetName]. Plus vous offrez de bâtiments à §Y[PREV.CONTROLLER.GetNamewithFlag]§!, plus le projet est long.§!\n\n§gSi vous venez de cliquer depuis un autre pays ou État, augmentez le nombre de bâtiments ou cliquez un autre bâtiment pour actualiser l'infobulle et voir le vrai coût.§!\n"
