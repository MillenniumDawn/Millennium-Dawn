 ### GNSS MIL ###
 ### Request ###
 REQUEST_MIL_GNSS_ACCESS_TITLE: "Military GNSS Access"
 REQUEST_MIL_GNSS_ACCESS_ACTION_DESC: "Petition for uplink credentials to their encrypted military positioning network. Access will involve bilateral treaty negotiations, reciprocal information-sharing commitments, and tiered authorization levels depending on operational need. If accepted we will gain access to their §YMilitary GNSS Satellite Network§!."
 REQUEST_MIL_GNSS_ACCESS_LOC: "Request Military GNSS Access\n\nWeekly expense for us: §Y$$[?PREV.MD_GNSS_mil_standard_rate|Y2] billion§!.\nProvider capacity: §Y[?PREV.GNSS_mil_treaty_array^num|0]/[?PREV.var_GNSS_mil_system_idx|0]§! used; §Y[?PREV.MD_GNSS_mil_access_capacity_remaining|0]§! remaining. This request requires §Y1§! slot."
 REQUEST_MIL_GNSS_ACCESS_RECIEVER_LOC: "[ROOT.GetNameWithFlag] requests access to our §YMilitary GNSS§! service for encrypted positioning and navigation.\n\nWeekly income for us if accepted: §Y$$[?ROOT.MD_GNSS_mil_pending_request_rate|Y2] billion§!.\nOur capacity: §Y[?THIS.GNSS_mil_treaty_array^num|0]/[?THIS.var_GNSS_mil_system_idx|0]§! used; §Y[?THIS.MD_GNSS_mil_access_capacity_remaining|0]§! remaining. Accepting requires §Y1§! slot."
 REQUEST_MIL_GNSS_ACCESS_ACCEPTED_TITLE: "Access granted!"
 REQUEST_MIL_GNSS_ACCESS_ACCEPTED_DESC: "We will benefit from their military GNSS network."
 REQUEST_MIL_GNSS_ACCESS_REJECTED_TITLE: "Access denied!"
 REQUEST_MIL_GNSS_ACCESS_REJECTED_DESC: "They denied us access to their military GNSS network."
 REQUEST_MIL_GNSS_ACCESS_SELECTABLE_TT: "§YMilitary GNSS System Level§! of [PREV.GetNameWithFlag] must be greater than zero and at least greater or equal to the level of [ROOT.GetNameWithFlag]."
 REQUEST_MIL_GNSS_ACCESS_CAPACITY_TT: "[PREV.GetNameWithFlag] has §Y[?PREV.MD_GNSS_mil_access_capacity_remaining|0]§! Military GNSS sharing slots remaining. This request requires §Y1§!. Build and launch enough GNSS satellites to raise the provider's service level when full."
 REQUEST_MIL_GNSS_ACCESS_PRICE_TT: "Weekly expense for us: §Y$$[?PREV.MD_GNSS_mil_standard_rate|Y2] billion§!. An exact provider price is required before sending."

 ### Offer ###
 OFFER_MIL_GNSS_ACCESS_TITLE: "Offer Military GNSS Access"
 OFFER_MIL_GNSS_ACCESS_ACTION_DESC: "Extend uplink credentials to our encrypted military positioning network as a gesture of strategic partnership. This grant includes tiered access protocols, operational security briefings, and integration support for their defense systems. Such access represents a significant investment in bilateral trust and interoperability. If accepted they will gain access to our §YMilitary GNSS Satellite Network§!."
 OFFER_MIL_GNSS_ACCESS_LOC: "Offer Military GNSS Access to [PREV.GetNameWithFlag]\n\n[MD_GNSS_mil_offer_preview_loc]\nOur capacity: §Y[?ROOT.GNSS_mil_treaty_array^num|0]/[?ROOT.var_GNSS_mil_system_idx|0]§! used; §Y[?ROOT.MD_GNSS_mil_access_capacity_remaining|0]§! remaining. This offer requires §Y1§! slot."
