 ENG_military.007.t: "달 전초기지"
 ENG_military.007.d: "우리의 과학자와 기술자들은 우주비행사와 장비를 달로 보내 반영구적으로 체류하게 할 준비를 마쳤습니다. 총 약 12명의 우주비행사가 파견되며, 수천만 달러 상당의 장비, 보급품, 거주 공간, 개인 물품이 함께 보내집니다. 달의 낮은 지구의 29일에 해당하여 배터리가 전력을 저장해 두기에는 지나치게 길기 때문에, 이 전초기지는 주기적으로 이동해야 합니다.\n\n기지 자체는 태양광 패널을 최대한 활용할 수 있도록 쉽게 이동 가능한 형태로 극지방에 건설됩니다. 또한 달에서의 장기 거주 환경을 확인하기 위한 실험도 수행됩니다. 달의 얼음을 채취하면 달에서 식물과 우주비행사의 식량을 위한 액체 상태의 물을 얻을 수 있을 뿐만 아니라, 이를 산소와 수소, 즉 로켓 연료로 분리할 수도 있습니다.\n\n이를 위해 필요한 연구를 완료하는 데에는 수개월 혹은 수년이 걸릴 수 있습니다. 그러나 그동안 이 사업의 자금을 활용하여 달에 더 쉽게 접근하고 지구로 귀환하기 위한 재급유를 할 수 있도록 달 궤도를 도는 보급 기지를 건설할 것입니다.\n\n이 모든 것은 향후 10년 안에 달성할 수 있습니다. 그리고 이제 발사할 때가 되었습니다."
 ENG_military.007.a: "발사!"
 ENG_military.008.t: "문베이스 알파"
 ENG_military.008.d: "우리의 과학자와 기술자들은 공식적으로 달에 착륙했으며, 현재 달 기지를 설치하는 중입니다. 각 구역은 \\"모듈\\"로 나뉘어 있어, 그 자체로는 건물이라 하기 어렵지만 합쳐서 하나로 이루어진 것도 아닙니다. 휴식을 위한 거주 모듈, 식량을 재배하기 위한 식량 모듈, 대부분의 과학 장비를 갖춘 가장 큰 연구 모듈, 고장 난 것을 수리할 모든 정비 도구를 보관하는 정비 모듈, 이곳 인원이 6개월간 체류하며 매일 일만 하는 것은 정신 건강에 좋지 않으므로 마련된 편의 모듈, 그리고 상당수의 태양광 패널이 있습니다. \n\n식량을 재배하는 데 시간이 걸리므로 첫 몇 달 동안은 식량 보급이 빈번할 것입니다. 물과 산소는 달의 얼음에서 얻게 됩니다. 마지막으로, 이 과학자들은 약 6개월 뒤 다음 지점으로 이동한 직후까지 머무르게 되는데, 전초기지가 위치한 곳의 달의 낮과 밤이 6개월간 지속되어 태양광 패널이 쓸모없어지기 때문입니다.\n\n문베이스 알파가 완공되었습니다."
 ENG_military.008.a: "과학이다!"
 ENG_military.009.t: "식민지의 진전"
 ENG_military.009.d: "달에 있는 우리의 과학 전초기지가 중대한 돌파구를 마련했습니다. 현재의 태양광 패널망을 확장하고, 물을 분리하여 산소와 수소를 만드는 방법을 더 쉽게 하는 최근의 발견 덕분에, 가장 최근의 보급 로켓에 연료를 완전히 채울 만큼의 산소와 수소를 생산해 낼 수 있게 되었습니다. 이는 반드시 필요한 돌파구로서, 충분한 시간과 투자가 있다면 달 자체가 향후 우주 개척의 거점이 될 수 있게 해 줄 것입니다.\n\n우주 자체가 점점 작아지고 있습니다."
 ENG_military.009.a: "우리는 개척자 기질이 뛰어납니다"
 ENG_military.010.t: "달에서의 위기"
 ENG_military.010.d: "즉각적인 과감한 조치가 필요합니다. 현재로서는 원인을 알 수 없으나 거주 모듈이 파열하여 \\"폭발\\"했습니다.\n\n한 시간 전, 12명의 과학자 모두가 각자의 임무를 수행하던 중 갑자기 거주 모듈에서 대규모 파열이 발생했습니다.\n\n진공에서는 파동이 전달되지 않으므로 대부분은 눈으로 직접 상황을 확인하고서야 사태를 깨달았습니다.\n\n예산에는 비상 자금이 포함되어 있으므로 사업에 더 많은 자금을 배정할 필요는 없으며, 과학자들은 다른 격리된 모듈에서 취침할 수 있습니다. 그러나 이 사건은 많은 이들을 동요시켰고, 과학자 일부, 다수, 심지어 전원이 사망했을 수도 있었다는 주장이 나오고 있으며, 과학자들이 목숨을 잃었을 수도 있었다는 사실에 사기도 저하되었습니다. 따라서 달 전초기지를 계속 운영하는 것은 정치적으로 큰 부담이 될 것이며, 사기 저하로 인해 과학자 교대가 나중이 아니라 지금 이루어져야 할 수도 있습니다.\n\n어떻게 하시겠습니까?"
 ENG_military.010.a: "긴급 지원을 보내라!"
 ENG_military.010.b: "사업을 포기하라. 우리에게 맞지 않는 일이다"
 ENG_military.011.t: "식민지의 추가 진전"
 ENG_military.011.d: "달 전초기지가 또 하나의 중대한 돌파구를 마련했습니다. 핵융합에 안성맞춤으로 보이는 기체인 헬륨-3를 지구로 수송하는 데 성공했으며, 본국의 과학자들은 이를 이용해 핵융합을 일으키는 방법을 알아냈습니다! 뿐만 아니라, 이 핵융합으로 생산되는 에너지는 반응을 일으키는 데 투입된 에너지에 근접합니다. 이는 약간의 개선만 이루어진다면 핵융합 발전이 성공할 수 있다는 뜻입니다! 본국에 막대한 이익을 가져다줄 뿐 아니라, 다른 물질을 핵융합에 이용하는 데 쓸 수 있는 지식도 얻게 되며, 이를 달에서 사용하여 이동식 전초기지 대신 영구 전초기지를 구축할 수 있습니다!\n\n이 모든 것은 예정보다 훨씬 앞서 이루어진 것으로 놀라운 일이며, UKSC의 많은 인원이 이를 현재의 문베이스에 적용할 준비가 되어 있지 않았습니다. 따라서 현재의 문베이스 알파 위치보다 급속한 확장에 훨씬 적합한 장소에 새 문베이스가 필요합니다. 문베이스 베타의 준비에 착수할 때가 되었습니다."
 ENG_military.011.a: "삶은 계속된다"
 ENG_military.012.t: "달에서의 또 다른 위기"
 ENG_military.012.d: "이번에는 더욱 과감한 조치가 필요합니다. 모듈 두 개가 추가로 파열했습니다. 이번에는 식량 모듈과 편의 모듈 모두입니다.\n\n약 40분 전, 한 과학자가 식량 모듈에 들어가려던 순간 모듈이 갑자기 폭발했습니다. 해당 과학자는 무사하며 식물을 제외하면 아무도 피해를 입지 않았습니다. 그러나 이 모듈은 편의 모듈과 인접해 있었기에 편의 모듈마저 파열하여 폭발했습니다. 이번에도 부상자는 없었습니다.\n\n그러나 이번 사고로 본국의 많은 이들이 경각심을 갖게 되었고 모듈의 안전성에 의문을 제기하고 있습니다. 앞서 폭발이 있은 뒤 UKSC는 모듈을 교체하여 폭발하지 않도록 조치했으나, 장기간 가해지는 압력은 그렇지 않았을 때보다 훨씬 쉽게 무언가를 파손시킬 수 있는 것으로 보입니다. UKSC는 이미 신속히 대응하여 새 모듈의 즉각적인 제작과 현재 모든 모듈에 대한 정밀 점검을 지시했습니다(현재로서는 달에서 모듈을 \\"회수\\"할 수 없으므로).\n\n모든 안전 문제가 해결될 때까지 사업 추진을 중단하라는 본국의 압력이 거세지는 가운데, 문베이스 계획의 지속 여부가 의문시되고 있습니다. 정치적 반발에 더해 비상 자금이 절반으로 줄어들어, UKSC는 향후의 우려를 해소하기 위해 50억 달러를 추가로 요청하고 있습니다. 계속할지 여부는 귀하의 결정에 달려 있습니다."
 ENG_military.012.a: "긴급 지원을 더 보내라!"
 ENG_military.012.b: "이런 식으로 계속할 수는 없다"
 ENG_military.013.t: "문베이스 베타"
 ENG_military.013.d: "현시점에서 달에 있는 우리의 과학자와 기술자들은 극지방의 다른 장소로 이동해야 합니다. 이에 드는 비용은 이미 장기 예산에 책정되어 있으므로 아직은 사업에 새로운 자금을 추가할 필요가 없습니다.\n\n이 새 문베이스에서는 우리가 새로이 발견한 성과를 활용하여, 이전의 문베이스와 달리 기지를 영구적으로 구축할 수 있습니다. 더 나은 로켓, 더 나은 발전, 더 나은 얼음 채취 및 분리 기술을 통해, 급속한 확장에 더 적합한 장소에 있는 이 새 기지를 이용하여 달 식민화 노력을 촉진할 수 있습니다. 좋은 소식은 이뿐만이 아닙니다. 기업가와 기업들이 새로 개발한 채굴 시스템을 달에 설치하겠다는 요청을 들고 UKSC로 대거 몰려들고 있습니다. 다른 나라의 우주 프로그램들도 달에 과학 및 채굴 전초기지를 세우는 데 큰 관심을 보이고 있으나, 귀하의 부단한 노력 덕분에 우리는 압도적인 선두에 있을 뿐 아니라 달 식민화를 적극적으로 시도하는 유일한 국가입니다.\n\n우리 달의 미래는 밝고 영국적입니다."
 ENG_military.013.a: "마침내 달에서 즐기는 애프터눈 티!"
 ENG_Moonbase_beta_completed: "문베이스 베타 완공"
 ENG_military.014.t: "화성 탐사 로버 임무"
 ENG_military.014.d: "우리의 과학자와 기술자들은 탐사 로버를 화성으로 보낼 준비를 마쳤습니다. 로버에는 총 약 14개의 센서가 설치되어 있으며, 수천만 달러 상당의 장비가 함께 실려 있습니다. 화성의 하루는 지구의 약 1.2일에 해당하여 배터리가 화성에서 전력을 저장해 두기에는 지나치게 길기 때문에, 이 로버는 주기적으로 이동해야 합니다.\n\n로버는 태양광 패널을 최대한 활용할 수 있도록 쉽게 이동 가능한 형태로 극지방에 배치됩니다. 또한 화성에서의 장기 거주 환경을 확인하기 위한 실험도 수행됩니다. 얼음을 채취하면 화성에서 식물과 미래 우주비행사의 식량을 위한 액체 상태의 물을 얻을 수 있을 뿐만 아니라, 이를 산소와 수소, 즉 로켓 연료로 분리할 수도 있습니다.\n\n이를 위해 필요한 연구를 완료하는 데에는 수개월 혹은 수년이 걸릴 수 있습니다. 그러나 그동안 이 사업의 자금을 활용하여 화성에 더 쉽게 접근하고 지구로 귀환하기 위한 재급유를 할 수 있도록 화성 궤도를 도는 보급 기지를 건설할 것입니다.\n\n이 모든 것은 향후 10년 안에 달성할 수 있습니다. 그리고 이제 발사할 때가 되었습니다."
 ENG_military.014.a: "발사!"
 ENG_military.015.t: "화성 식민지 사업"
 ENG_military.015.d: "인류가 화성을 식민지로 삼으려면 자급자족이 가능한 영구 기지를 건설해야 합니다. 이는 수많은 우주 탐험가들의 꿈이자 인류가 우주에 발을 디딜 수 있는 유일한 길입니다. 이 모든 것이 오늘 현실이 될 것입니다."
 ENG_military.015.a: "화성이여, 우리가 간다!"
 ENG_military.016.t: "착륙 시스템 고장"
 ENG_military.016.d: "약 6천만 킬로미터에 달하는 여정 끝에 우리의 우주선이 마침내 화성 상공에 모습을 드러냈습니다. 화성 전역을 뒤덮은 산화철이 붉은 모습을 보여 주었습니다. 오랫동안 렌즈를 통해서만 볼 수 있었던 이 행성이 이제 눈앞에 있습니다. \n우주선이 착륙 모드에 진입합니다. 시뮬레이터에서 수없이 연습했던 함장이 명령을 내렸으나, 착륙 장치에 문제가 있는 듯했습니다. 이때 굵은 땀방울이 순식간에 함장의 이마를 뒤덮었습니다."
 ENG_military.016.a: "런던, 문제가 생겼다."
 ENG_military.017.t: "차량 고장"
 ENG_military.017.d: "아슬아슬한 30분이 지난 뒤, 우주선은 마침내 추락 위기에서 벗어나 화성의 유토피아 평원에 비스듬히 착륙했습니다. 이곳은 이전의 비글 탐사 로버의 착륙 지점이기도 합니다. 유토피아 평원은 화성과 태양계 최대의 충돌 분지로 알려져 있으며 직경은 약 3,300킬로미터로 추정됩니다. \n착륙 후 승무원은 특수 로버로 옮겨 타고 평원 남부로 이동해 기지를 건설할 예정이었으나, 앞선 우주선 착륙 때의 진동이 로버에 어느 정도 영향을 준 것으로 보입니다. 상황이 승무원에게 반드시 유리하게 전개되지만은 않았음이 분명합니다"
 ENG_military.017.a: "오늘따라 우리의 그 빌어먹을 차량에 뭔가 문제가 있는 모양입니다."
 ENG_military.018.t: "기지 도착"
 ENG_military.018.d: "40킬로미터, 인류가 지구 이외의 행성에서 이토록 먼 거리를 행군한 것은 처음입니다. 지구에서는 평범한 이 거리가 인류 우주 비행 역사상 획기적인 성과입니다. \n긴장된 야영지 설치 과정을 거쳐 필요한 모든 데이터를 지구로 전송하고 모든 장비의 매개변수를 점검한 뒤, 침대에 앉아 있던 함장은 마침내 차 한 잔을 마실 수 있었습니다. \n머리 위의 투명 합성 소재 창 너머로 별들 사이의 한 점이 희미한 푸른빛을 내며 빛났는데, 그것이 바로 지구였습니다. \n\n'나쁘지 않군.' 함장이 중얼거렸습니다."
 ENG_military.018.a: "좋은 식사에 늦는 것을 두려워하지 마십시오."
 ENG_military.019.t: "착륙 성공"
 ENG_military.019.d: "모든 것이 예상대로 완벽했습니다. 우주선은 지정된 착륙 지점에 정확히 착륙했으며 인류의 화성 여정이 평화롭게 시작되었습니다. \n"
 ENG_military.019.a: "우리 승무원들이 임무를 완수할 줄 알았다."
 ENG_military.020.t: "기지 도착"
 ENG_military.020.d: "우주선의 착륙 지점은 기지의 사전 설정 위치였으며, 승무원들은 인류 최초의 화성 영구 기지 건설을 준비하기 위해 그 자리에서 야영을 시작했습니다. 우주 장화가 화성의 토양에 수없이 어지러운 발자국을 남겼다는 사실을 아무도 알아채지 못했습니다."
 ENG_military.020.a: "화성에게는 작은 한 걸음이지만, 인류에게는 위대한 도약이다."
 ENG_military.021.t: "수원 탐색"
 ENG_military.021.d: "물은 인간의 생존에 필수적인 자원입니다. 이전의 화성 탐사 활동의 주요 목적 중 하나는 화성에서 수원을 찾는 것이었습니다. 지구와 같은 지표의 호수나 강은 없지만, 화성의 수자원은 기본적으로 화성 지하의 얼음 형태로 존재합니다. \n그러나 실제 정밀한 위치 파악에는 누군가가 직접 현장 조사를 수행해야 합니다."
 ENG_military.021.a: "차 없이는 살 수 없다!"
 ENG_military.022.t: "지하 방사선 방호"
 ENG_military.022.d: "화성은 대기가 희박하고 행성 자기장이 없어 우주 방사선이 아무런 방해 없이 지표에 도달합니다. 기지는 처음 건설되었을 때 충분한 차폐를 제공하지 못했으므로, 땅속에 보금자리를 파는 것이 방사선을 피하기 위한 첫 번째 선택이 되었습니다. \n영국을 위한 새 기지를 만들어 낸다는 자부심을 목격하며, 승무원들은 대영제국의 위대했던 시절을 떠올렸습니다."
 ENG_military.022.a: "브리타니아가 우주를 지배한다"
 ENG_military.023.t: "화성에서의 첫 수확"
 ENG_military.023.d: "수원 문제는 해결되었고 에너지원은 당분간 태양광 발전으로 공급되고 있습니다. 따라서 화성에서의 식량(그리고 차)의 생산이 현재 가장 중요한 과제가 되었습니다. \n전통적인 곡물 작물은 생육 주기와 수확 과정 때문에 제외되었으며, 감자가 화성에서 재배되는 최초의 인류 작물이 되었습니다. 화성은 태양에서 멀어 지구만큼 밝지는 않지만, 온실의 감자는 오히려 더 무성하게 자라는 듯합니다. 인류의 첫 화성 수확이 눈앞에 다가왔습니다."
 ENG_military.023.a: "전부 천연 유기농 화성산 감자입니다."
 ENG_military.024.t: "모래 폭풍"
 ENG_military.024.d: "모래 폭풍은 화성에서 흔히 일어나는 현상입니다. 화성의 기압은 지구보다 훨씬 낮기 때문에, 화성의 폭풍은 그 영화에서처럼 이전의 전설들만큼 파괴적이지는 않습니다. \n그러나 날아오르는 먼지는 여전히 인류 기지에 많은 잠재적 위험을 초래하며, 특히 태양 에너지는 현재 기지들에 없어서는 안 될 에너지원이기 때문입니다."
 ENG_military.024.a: "이곳에서는 맷 데이먼을 구할 방법이 없다."
 ENG_military.025.t: "사고"
 ENG_military.025.d: "산에 자주 오르다 보면 결국 호랑이를 만나기 마련입니다. 화성의 먼지 폭풍은 이전 예상보다 훨씬 오래 지속되었고, 기지 내부의 배터리 수명은 매우 비관적인 상황에 놓인 듯합니다. \n화성 식민지 임무를 계속하기 위해서는 결정을 내려야 합니다. 대피하여 새로운 장소를 찾을 것인지, 아니면 손상된 시설을 계속 수리할 것인지입니다."
 ENG_military.025.a: "대피"
 ENG_military.025.b: "기지 수리"
 ENG_military.026.t: "대피"
 ENG_military.026.d: "더 이상 기다릴 수 없습니다. 상황은 이제 매우 위급하며 예비 로켓으로 대피할 때가 되었습니다. 모든 대원이 안전하게 탑승했는지 확인한 뒤, 함장은 아직 건설 중이던 기지 건물을 아쉬운 마음으로 돌아보았습니다. 그는 가슴속의 비통함을 억누르고 인공지능 유도 장치에 우주선 발사 명령을 내렸습니다. \n'우리는 반드시 돌아온다!' 거대한 연기가 피어오르면서 우주선은 화성의 지면에서 벗어나 천천히 하늘로 솟아올랐습니다."
 ENG_military.026.a: "삶이 있는 곳에 희망이 있다."
 ENG_military.027.t: "손상된 기지 수리"
 ENG_military.027.d: "우리는 가만히 앉아 기다릴 수 없으며, 어떤 대가를 치르더라도 즉시 기지 수리에 착수해야 합니다. 그렇지 않으면 우리가 화성에서 이룬 모든 성과가 물거품이 되고, 이 혼란 속에서 아무도 살아남을 수 없습니다. 기지를 구하는 것은 곧 우리 자신을 구하는 것입니다."
 ENG_military.027.a: "희생과 큰 포부를 위하여, 우리는 감히 새로운 세계를 만든다."
 ENG_military.028.t: "화성 도시 사업"
 ENG_military.028.d: "우리는 화성 식민지 건설에서 뛰어난 성과를 거두었습니다. 그러나 최종 목표를 달성하기까지는 아직 갈 길이 남아 있습니다. 계속해서 화성 건설에 투자하시겠습니까?"
 ENG_military.028.a: "업그레이드"
 ENG_military.028.b: "필요 없다"
 ENG_military.029.t: "예"
 ENG_military.029.d: "한 걸음만 더 나아간다면 우리의 화성 임무는 완전히 완수될 것입니다. 우리의 의제에 어정쩡한 조치란 없습니다."
 ENG_military.029.a: "책임을 다음 세대에 떠넘기지 마십시오."
 ENG_military.030.t: "거절"
 ENG_military.030.d: "현재의 화성 기지는 충분히 완성되어 있으며, 더 많은 투자를 계속하는 것은 현명하지 못합니다. 지구에서도 우리가 맞서야 할 문제가 아직 많이 남아 있으며, 우주에 돈을 쏟아붓기만 할 수는 없습니다."
 ENG_military.030.a: "미래 세대의 지혜를 믿으십시오."
 ENG_military.031.t: "화성 도시 완공"
 ENG_military.031.d: "우리의 불굴의 노력 끝에 화성 식민지가 마침내 완성되었습니다. 인류는 이 노력을 결코 잊지 않을 것이며, 언젠가 인류는 은하 전체에 발을 디딜 것입니다."
 ENG_military.031.a: "우리의 여정은 은하 전체입니다."
 ENG_military.032.t: "새로운 부기지 건설"
 ENG_military.032.d: "더 많은 우주선이 더 많은 인원과 물자를 실어 나르면서 최초의 화성 기지는 번영하기 시작했습니다. 최초 기지 아래의 수자원으로는 더 이상 많은 인원을 감당할 수 없게 되어 새로운 부기지 건설이 시급합니다. \n첫 번째 팀의 우주선이 서서히 시야에서 사라지는 가운데, 전직 함장이자 오늘날 최초의 신 런던 시의 시장이 된 그는 화성 로버가 도랑에 빠졌던 지난날을 회상했습니다."
 ENG_military.032.a: "어머니, 저는 오늘 먼 항해를 떠납니다."
 ENG_military.033.t: "화성 도시 기념비"
 ENG_military.033.d: "인류가 화성을 가로질러 여행하면서 화성은 지구 인류의 새로운 고향이 되었습니다. 화성의 지구화 작업은 질서 있게 진행되고 있습니다. 인류 우주선의 첫 착륙 지점에는 화성 정복 과정에서 여정과 건설 중에 목숨을 바친 남녀를 기리기 위한 거대한 기념비가 세워졌습니다. 이들은 인류 문명의 여정에 영원히 새겨질 것입니다."
 ENG_military.033.a: "인류를 위하여!"
 ENG_mars_city_building_completed: "화성 도시 건설 완료"
 ENG_military.001.t: "소행성 채굴 구상 출범"
 ENG_military.001.d: "소행성 채굴은 우리 이전의 많은 이들에게 환상이었습니다. 소행성 자체에는 수요가 높은 백금족 금속, 금, 은, 철족 금속이 풍부하게 들어 있습니다. 이는 우주 진출 능력을 갖춘 어느 나라에든 극도로 수익성이 높은 사업이 될 수 있습니다. 그리하여 오늘 영국 왕립 소행성 채굴 회사, 즉 BRAMC의 설립은 소행성 채굴을 향한 첫걸음이 될 것입니다. 제국 전역의 대규모 망원경 어레이를 이용해 인근 우주에서 적합한 소행성을 찾은 다음, 이를 궤도로 끌어들여 채굴할 수 있습니다. 소행성은 거리에 비해 상대적으로 매우 작기 때문에 적합한 소행성을 발견하기는 어려울 것입니다. 다행히도 주기적으로 지구 근처를 지나가는 소행성이 상당수 있으므로, 하나를 지구 궤도에 머물게 하는 데에는 오랜 시간이 걸리지 않을 것입니다."
 ENG_military.001.a: "소행성이 나타나기만 기다리면 되겠군..."
 ENG_military.002.t: "소행성 발견"
 ENG_military.002.d: "최근 BRAMC의 과학자들이 지구 근처를 지나가는 적합한 소행성을 발견했습니다. 일부는 과연 경제성 있는 적합한 소행성을 발견할 수 있을지 의심했으므로, BRAMC로서는 안도할 일입니다. 이 소행성은 이동 속도가 충분히 느리고, 크기가 충분히 크며, 자원이 충분히 풍부하여 궤도로 옮겨 채굴하기에 적합합니다. 사실 이 소행성은 웨일스보다도 큽니다. 다음 단계는 이 소행성을 지구 궤도로 옮기는 것으로, 이는 지금까지 한 번도 이루어진 적이 없습니다. 한편 영국 우주 사령부 기술자들과 버진 갤럭틱 같은 민간 기업은 소행성을 채굴할 장치를 발명하였으며, 소행성이 궤도에 진입할 즈음에는 준비가 완료될 것입니다."
 ENG_military.002.a: "저 녀석을 궤도로 끌어옵시다"
 ENG_military.003.t: "소행성 궤도 진입"
 ENG_military.003.d: "소행성이 궤도에 진입함에 따라 UKSC와 버진은 모두 궤도상의 소행성에 임무단을 파견하고 있습니다. UKSC는 주로 과학 데이터 수집에 관심이 있는 반면, 버진 갤럭틱은 물질 채굴에 더 관심이 있습니다. 이는 의심할 여지 없이 주목할 만한 성과이며 우주에서 우리에게 우위를 가져다줍니다. 소행성을 더 끌어오자는 논의까지 있으나, 이 소행성이 매우 크고 채굴에 적합하므로 추가 소행성은 나중에 가져와도 된다는 의견이 많습니다. 다른 나라들은 이미 우리를 부러운 눈으로 바라보며 자체 소행성 채굴 계획을 고려하고 있습니다. 그곳에 도달하는 기술을 개발하는 데만도 비용이 극도로 높기 때문에 버진 갤럭틱이나 UKSC에서는 경쟁자가 나타날 것을 거의 걱정하지 않고 있습니다."
 ENG_military.003.a: "채굴을 시작하라"
 ENG_military.004.t: "쏟아져 들어오기 시작한 채굴 수익"
 ENG_military.004.d: "채굴 작업이 확립된 뒤, 버진 갤럭틱과 UKSC는 모두 첫 우주 물질 수송분을 전 세계의 연구소와 시장으로 보냈습니다. 세계는 질투 어린 시선으로 우리를 지켜보았으며, 각국 의회에서는 자체 소행성 채굴 사업을 추진하는 방안에 관한 공개 논의가 있었습니다. 머지않아 경쟁자가 나타날 수 있겠지만, 지금은 독점을 누릴 수 있습니다."
 ENG_military.004.a: "너무나 기쁘다!"
 ENG_military.005.t: "소행성 채굴 수익"
 ENG_military.005.d: "소행성 채굴 작업의 최신 수송분이 도착하여 많은 수익을 창출했습니다. 이번 수송분에는 백금, 금, 은이 포함되어 있습니다. 이 수익을 잘 활용하는 것이 현명할 것입니다."
 ENG_military.005.a: "훌륭하군!"
 ENG_military.006.t: "소행성 채굴의 잠재력"
 ENG_military.006.d: "최근 하원은 UKSC와 민간 우주 기업인 버진 갤럭틱이 상당히 큰 소행성을 지구 궤도로 끌어와 채굴하는 것을 허용했습니다. 우리의 고문들은 이 새로운 분야에 투자할 것을 권고하는데, 희귀 물질을 우리나라로 곧바로 공급받을 수 있기 때문입니다. 그러나 일부는 영국이 사업을 시작하는 데에만 지불해야 했던 막대한 비용을 거론하며 우주 진출 확대에 반대합니다. 이 투자의 수익은 상황에 따라 다르지만 손익분기점을 넘기는 데만도 25년이 걸릴 수 있습니다. 더 막대한 투자를 하면 이 기간을 줄일 수 있겠으나, 한동안은 다른 나라들보다 크게 뒤처지게 될 것입니다. \n\n소행성 채굴에 관하여 어떻게 하시겠습니까? 국가 사업을 시작하시겠습니까, 아니면 아예 무시하시겠습니까?"
 ENG_military.006.a: "소행성 채굴에 투자한다"
 ENG_military.006.b: "너무 비싸고 시간 낭비다!"
 Mobile_Fires_Platorm_Program.1.t: "기동 화력 플랫폼 사업 협력국 선택"
 Mobile_Fires_Platorm_Program.1.d: "냉전이 끝나고 독일 평원에서의 분쟁 가능성에 대한 기대가 약해지면서 육군의 155mm 야포 체계 보유량은 감소했으며, 이제 새로운 위협이 지평선에 나타나자 국방부는 이 능력을 되살리기 위한 조치를 취하기로 결정했습니다. 이 계약을 이행하기 위한 수많은 사업과 협력국이 나섰으나 성공하는 것은 그중 단 하나뿐입니다."
 ENG_military.034.a: "아처 포병 동맹"
 ENG_military.034.b: "K9A1 썬더 개발 그룹"
 ENG_military.034.c: "복서 사업"
 ENG_military.034.e: "CAESAR 협력"
 ENG_military.035.t: "영국의 합동원정군 가입 초청"
 ENG_military.035.d: "영국은 [Receiving Country]에 국제 협력을 증진하고 집단 안보를 강화하기 위한 협력 구상인 합동원정군(JEF)에 가입할 것을 정중히 초청합니다. 이 중대한 사건은 안정을 도모하고, 세계적 도전에 대응하며, 우리가 소중히 여기는 가치를 수호하겠다는 공동의 의지에 새로운 장을 여는 시작입니다."
 ENG_military.035.a: "가입한다!"
 ENG_military.035.b: "정중히 사양하겠소, 친구"
 ENG_military.036.t: "[From.GetName]의 수락!"
 ENG_military.036.d: "[From.GetName]이(가) 우리의 합동원정군에 가입합니다. 함께라면 신속 대응을 위한 군사력을 준비할 수 있습니다"
 ENG_military.036.a: "환영합니다"
 ENG_military.037.t: "[From.GetName]의 거절!"
 ENG_military.037.d: "[From.GetName]은(는) 우리의 합동원정군에 가입하지 않을 것입니다. 그들은 독자적으로 서기를 선호합니다"
 ENG_military.037.a: "그들은 시간이 지나면 후회할 것입니다"
 ENG_military.038.t: "다트머스 해군 대학 확장"
 ENG_military.038.d: "첨단 기술, 전략적 사고, 실전 경험에 중점을 두는 다트머스 해군 대학은 차세대 해군 지도자를 양성하는 데 중추적인 역할을 맡을 태세를 갖추고 있습니다."
 ENG_military.038.a: "항공모함이 해전의 미래입니다"
 ENG_military.038.b: "해상의 적을 물리치려면 구축함과 순양함이 필요합니다"
 ENG_military.040.t: "타이푼 1차 물량 논쟁"
 ENG_military.040.d: "군 관계자, 국방 분석가, 정부 대표 등 이해관계자들은 이 항공기가 진화하는 위협에 대응하는 데 얼마나 효과적인지, 국가 방위 전략에서 어떤 역할을 하는지, 그리고 국제 협력국에 수출할 잠재력이 있는지에 관해 논의하고 있습니다. 타이푼 1차 물량 논쟁은 이 첨단 전투기의 조달, 배치, 향후 개발에 관한 결정을 형성하는 데 중요한 역할을 합니다."
 ENG_military.040.a: "생산을 계속한다"
 ENG_military.040.b: "후속 기종을 연구한다"
 ENG_military.040.c: "비축량을 감축한다"
 ENG_military.039.t: "군대 전문화"
 ENG_military.039.d: "전문 분야를 선택하십시오"
 ENG_military.039.a: "육군"
 ENG_military.039.b: "공군"
 ENG_military.039.c: "해군"
 ENG_military.039.e: "참모"
 ENG_military.041.t: "영국의 항공기 혁신 기술 구매 제안"
 ENG_military.041.d: "영국은 자국의 항공기 및 항공 산업 역량에 막대한 투자를 했습니다. 우리의 특별한 관계 덕분에, 영국은 소정의 대가를 받고 혁신 기술을 공유하겠다고 제안합니다. 어쨌든 그들은 영국인이니까요"
 ENG_military.041.a: "혁신이라고요? 좋습니다!"
 ENG_military.041.b: "정중히 사양하겠소, 친구"
 ENG_military.042.t: "영국의 항공기 혁신 기술 구매 제안"
 ENG_military.042.d: "영국은 자국의 항공기 및 항공 산업 역량에 막대한 투자를 했습니다. 우리의 특별한 관계 덕분에, 영국은 소정의 대가를 받고 혁신 기술을 공유하겠다고 제안합니다. 어쨌든 그들은 영국인이니까요"
 ENG_military.042.a: "혁신이라고요? 좋습니다!"
 ENG_military.042.b: "정중히 사양하겠소, 친구"
 ENG_military.043.t: "미국의 수락"
 ENG_military.043.d: "미국이 혁신 기술 판매에 대한 우리의 제안을 수락했습니다"
 ENG_military.043.a: "예상대로입니다"
 ENG_military.044.t: "미국의 거절"
 ENG_military.044.d: "미국이 우리의 혁신 기술 판매 제안을 거절했습니다. 그들은 영국이 자신들에게 필요한 실질적인 협력국이 아니라고 생각합니다"
 ENG_military.044.a: "언젠가는 알게 될 것입니다"
 United_Kingdom.002.t: "실리콘 글렌의 성과"
 United_Kingdom.002.d: "스코틀랜드 실리콘 글렌에 대한 우리의 투자가 결실을 맺고 있습니다. 지역 대학, 반도체 설계 기업, 소프트웨어 기업은 또 한 해의 성장과 새로운 특허, 그리고 더 넓은 경제로 꾸준히 유입되는 숙련된 졸업생을 보고하고 있습니다."
 United_Kingdom.002.a: "글렌이 계속 최전선을 개척하도록 하자"
 United_Kingdom.003.t: "국경 간 협력 제안"
 United_Kingdom.003.d: "영국이 우리 공동 국경에서의 무역 물류를 개선하고 행정적 부담을 줄이기 위한 제안을 해 왔습니다. 제안된 협력 체계는 인프라 정렬, 세관 절차 간소화, 공동 규제 위원회에 중점을 둡니다.\n\n수락하시겠습니까?"
 United_Kingdom.003.a: "협력 체계를 수락한다"
 United_Kingdom.003.b: "제안을 거절한다"
 United_Kingdom.004.t: "아일랜드의 국경 간 협력 수락"
 United_Kingdom.004.d: "아일랜드 정부가 간소화된 국경 간 경제 조정에 대한 우리의 제안을 수락했습니다. 관료적 형식주의를 줄이고, 기준을 조율하며, 아일랜드 해와 육상 국경을 넘나드는 물품의 이동을 원활하게 하기 위한 위원회가 설립되었습니다."
 United_Kingdom.004.a: "협력을 통한 진전"
 United_Kingdom.005.t: "국경 간 제안을 거절한 아일랜드"
 United_Kingdom.005.d: "처음에는 관심을 보였음에도 불구하고, 아일랜드 정부는 결국 우리의 국경 간 협력 체계에 참여하지 않기로 결정했습니다. 관계자들은 거절의 주된 이유로 법적 복잡성과 정치적 망설임을 들었습니다."
 United_Kingdom.005.a: "유감이지만 예상했던 일입니다"
 scottish.1.t: "스코틀랜드 의회 선거"
 scottish.1.d: "스코틀랜드 의회 선거 결과가 나왔으며, 마침내 스코틀랜드 국민이 독립 찬성 정당에 투표했는지 여부를 확인할 수 있습니다."
 scottish.1.a: "알겠다"
 britain_md.1.a: "그렇다면 움직입시다"
 britain_md.2.a: "운에 맡기겠다"
 britain_md.2.b: "그 확률은 마음에 들지 않는다"
 britain_md.3.a: "노동조합에 호소한다"
 britain_md.3.b: "군산복합체에 호소한다"
 britain_md.3.c: "화석 연료 산업에 호소한다"
 britain_md.4.a: "산업가에게 세금을 부과한다"
 britain_md.4.b: "군에 세금을 부과한다"
 britain_md.4.c: "화석 연료 산업에 세금을 부과한다"
 britain_md.4.d1: "정말 누구에게든 세금을 물려야 하는가?"
 britain_md.5.a: "전진!"
 britain_md.6.d: "우리의 인프라는 개선이 시급합니다. 반드시 나쁜 것은 아니지만, 세계적 경쟁자들과 겨루기 위해서는 도시를 확장해야 합니다. 그러나 인프라의 광범위한 확장에만 초점을 맞추는 대신 특정 지역을 선택해 집중하겠습니다. 이렇게 하면 투자의 새로운 거점을 만들고 해당 지역을 번영시킬 수 있을 것입니다."
 britain_md.6.a: "북부에 힘쓴다"
 britain_md.6.b: "중부에 힘쓴다"
 britain_md.6.c: "남부에 힘쓴다"
 britain_md.7.a: "일을 시작합시다"
 britain_md.8.a: "분명 연관이 없다! 이민자들은 문제없다"
 britain_md.8.b: "글쎄, 데이터는 거짓말을 하지 않는다"
 britain_md.9.a: "낭비할 시간이 없다. 시작하자"
 britain_md.10.a: "조금 바꿔 봅시다"
 britain_md.10.b: "절대 안 된다"
 britain_md.11.a: "좋다. 이제 시작하자"
 britain_md.12.a: "알겠다"
 britain_md.12.b: "아니요"
 britain_md.13.a: "알겠다"
 britain_md.14.a: "개자식들"
 britain_md.15.a: "알겠다"
 britain_md.16.a: "연성 쿠데타. 더 이상의 통제는 추구하지 않는다"
 britain_md.16.b: "강경 쿠데타. 위성국을 추진한다"
 britain_md.17.a: "좋다"
 britain_md.18.a: "젠장"
 britain_md.19.a: "좋다"
 britain_md.20.a: "예상대로입니다"
 britain_md.21.a: "말도 안 된다! 하지만 우리가 무엇을 할 수 있는가?"
 britain_md.21.b: "말도 안 된다! 군을 동원하라!"
 britain_md.22.a: "이제는 돌이킬 수 없다"
 britain_md.22.b: "잠깐, 돌려주면 어떨까?"
 britain_md.23.a: "그렇게 겁먹고 통제당하겠느냐?"
 britain_md.24.a: "영국을 향한 포부"
 britain_md.24.b: "영국은 뒤가 아닌 앞으로"
 britain_md.24.c: "모두를 위한 공정한 미래"
 britain_md.24.a1: "상식의 시대가 왔다"
 britain_md.24.b1: "우리와 같은 생각을 하고 있습니까?"
 britain_md.24.c1: "영국 정부로의 초대"
 britain_md.25.a: "시작하자!"
 britain_md.26.a: "섬의 통합에 집중한다"
 britain_md.26.b: "더 서쪽으로 나아가야 한다"
 britain_md.26.c: "섬을 반환한다"
 britain_md.27.t: "영국의 포클랜드 반환"
 britain_md.27.d: "천문학적으로 충격적인 사태 전환으로, 80년대에 포클랜드를 두고 우리와 싸웠던 [ENG.GetName]이(가) 섬을 우리의 통제로 되돌려 주기로 결정했습니다. 무엇이 이를 촉발했는지, 왜 이런 결정을 했는지는 알 수 없으나, 우리는 이미 섬에 주둔시킬 병력을 이동시키고 있습니다. 영국 정부는 이 조치가 우리 및 더 넓은 남아메리카 지역과의 '관계를 돈독히 하려는' 시도라고 밝혔습니다."
 britain_md.27.a: "우리에겐 좋은 소식이군요!"
 britain_md.28.t: "짐바브웨 정권 교체 작전 성공"
 britain_md.28.d: "짐바브웨 독재자를 전복하기 위한 작전 이후, 우리 군에 의해 민주변화운동(MDC)이 집권하게 되었습니다. 이는 영국 특수 부대의 광범위한 계획과 작전 끝에 이 나라의 오랜 정권을 전복한 결과입니다."
 britain_md.28.a: "좋다. 그 정도는 당연히 해낼 줄 알았다"
 britain_md.29.t: "[ENG.GetName]의 쿠데타!"
 britain_md.29.d: "[ENG.GetName]이(가) 우리나라에서 비밀 작전을 수행하여 이전 정권이 전복되고 새 정부가 들어선 것으로 보입니다. 군 병력은 사전에 접촉을 받았으며, 영국군이 눈에 띄지 않게 입국할 수 있도록 길을 열어 주기까지 했습니다."
 britain_md.29.a: "뭐라고?"
 britain_md.30.t: "동부 분할 작전 접근"
 britain_md.30.d: "이집트는 현재 시나이를 완전히 통제하고 있으며, 수년간 이스라엘과 간헐적인 충돌이 있었습니다. 그러나 우리나라는 보다 효율적인 무역로가 절실하게 필요하며, 수에즈를 통과할 때마다 부과되는 세금은 이해할 수 없을 정도로 쌓이기 시작했습니다. 우리는 이집트와 협상을 맺어야 하며, 그렇지 않으면 추가 조치를 취할 수밖에 없습니다."
 britain_md.30.a: "협상을 시작하자"
 britain_md.30.b: "협상할 시간이 없다. 진입하라"
 britain_md.31.t: "영국의 시나이 공동 통제 요청"
 britain_md.31.d: "영국 정부는 시나이의 공동 통제 가능성을 논의하기 위해 [EGY.capital.GetCapitalVictoryPointName]에 있는 우리 장관들을 만날 외교관들을 파견했습니다. 그들은 자국의 선박과 상인들이 지나치게 부당한 대우를 받아 왔다고 주장하며, 이에 동의하는 것이 우리 정부가 신뢰할 만하다는 것을 보여 줄 것이라고 주장하고 있습니다."
 britain_md.31.a: "시나이를 넘겨주느니 모든 이집트인이 죽을 것이다!"
 britain_md.31.b: "어쩌면 타협점을 찾을 수 있을지도 모른다..."
 britain_md.32.t: "이집트의 협상 거부"
 britain_md.32.d: "이집트는 우리가 큰 양보를 할 용의가 있다 하더라도 수에즈의 통제권에 관해 우리와 협상할 의향이 없다고 밝혔습니다. 우리에게는 군사 개입을 고려하는 것 외에 다른 선택지가 남지 않았습니다."
 britain_md.32.a: "진입할 때다"
 britain_md.32.b: "잊어버려라"
 britain_md.33.t: "이집트의 협상 제안"
 britain_md.33.d: "이집트는 시나이에 관한 협상 요청을 받아들였으며, 낮은 세금으로 시나이를 통한 군사 및 상업적 직접 통행권을 얻는 대가로 일정 금액의 현금을 지불할 것을 요구했습니다."
 britain_md.33.a: "우리에겐 좋은 조건이다"
 britain_md.33.b: "정말인가? 이것은 모욕이다!"
 britain_md.34.t: "동부 분할 작전: 진행 중"
 britain_md.34.d: "동부 분할 작전이 현재 진행 중이며 병력이 시나이에 상륙했습니다. 보다 대규모 작전을 가능하게 할 더 많은 병력의 동원을 시작해야 합니다."
 britain_md.34.a: "가자, 가자, 가자!"
 britain_md.35.t: "[FROM.GetName]의 더 깊은 통합 요구"
 britain_md.35.d: "[ENG.GetName]은(는) 우리의 주권을 조금 내어놓음으로써 우리의 병력을 결집하고 다시 한번 세계적 강대국의 위치에 오를 수 있다고 주장하며 더 깊은 통합을 요구했습니다. 많은 시민이 이러한 제안을 경계하고 있지만, [ENG.GetName]은(는) 최근 몇 년간 모든 부문에서 우리를 능가하며 강력한 경쟁자임을 입증했습니다."
 britain_md.35.a: "우리는 단결해야 한다"
 britain_md.35.b: "우리는 주권을 내어주지 않을 것이다"
 britain_md.36.t: "[FROM.GetName]의 더 큰 통합 추구"
 britain_md.36.d: "[FROM.GetName]은(는) 실제로 더 깊은 통합에 관심이 있음을 내비쳤으며, 핵심 관료 기관과 단체를 통합하기 위한 여러 로드맵을 제시했습니다. 우리의 외교관과 관료들은 원활하고 안전하며 안정적인 전환을 보장하기 위해 초과 근무를 하고 있습니다."
 britain_md.36.a: "좋다"
 britain_md.37.t: "[FROM.GetName]의 추가 통합 거절"
 britain_md.37.d: "[FROM.GetAdjective] 정부는 추가 통합에 관심이 없는 것으로 보이며, 오히려 우리의 최근 행보가 그들의 주권을 침해한다고 주장하고 있습니다."
 britain_md.37.a: "알겠다"
 britain_md.39.t: "명목상의 수반 선출"
 britain_md.39.d: "다른 정치인에게 어떤 형태로든 권력을 부여하는 것의 함의를 이해하지만, 군 지도자가 국가를 통치하는 것에 염증을 느끼는 대중을 달랠 대표자의 필요성을 인식해야 합니다. 우리는 국가를 대표할 꼭두각시로 내세울 인물을 신속히 찾아낼 것입니다."
 britain_md.39.a: "저 얼간이 패라지를 앉힌다"
 britain_md.39.b: "그리핀이 숨어 있는 곳을 찾는다"
 britain_md.39.c: "마이클 홈스가 근처에 있는가?"
 britain_md.39.d1: "군부만으로도 충분하다"
 british_flavor.1.t: "닛산, 선덜랜드 인근 공장 확장을 모색"
 british_flavor.1.d: "일본 자동차 제조사 닛산은 곧 판매될 신세대 알메라 해치백과 세단을 포함하도록 선덜랜드 공장의 확장을 모색하고 있습니다. 정부 관계자들은 이 확장이 현지 공장과 국내 자동차 제조사의 경쟁을 더 어렵게 만들지 않을까 우려하고 있습니다."
 british_flavor.1.a: "승인한다"
 british_flavor.1.b: "아니다, 이를 허용할 수는 없다"
 british_flavor.2.t: "아우구스토 피노체트 송환"
 british_flavor.2.d: "칠레의 전 독재자 아우구스토 피노체트는 재판을 받기에 부적합하다는 의학적 증거가 결론으로 제시되었습니다. 이 조사 결과로 전 독재자를 고국인 칠레로 추방하라는 요구가 높아졌으나, 그의 추방을 요구하는 군중에 맞서 영국에서 그에 대한 재판을 계속해야 한다고 주장하는 이들도 있습니다."
 british_flavor.2.a: "돌려보낸다"
 british_flavor.2.b: "그는 이곳에 남는다"
 british_flavor.3.t: "솔웨이 하비스터호 침몰"
 british_flavor.3.d: "솔웨이 하비스터호가 거센 파도 속에 맨 섬 앞바다에서 침몰한 것으로 보고되었습니다. 승무원 7명 전원이 사망한 것으로도 보고되었으며, 선박은 인양이 가능하지만 심각하게 손상된 것으로 알려졌습니다."
 british_flavor.3.a: "그 문제는 나중에 걱정하겠다"
 british_flavor.3.b: "승무원의 시신을 수습하고 장례를 준비한다"
 british_flavor.4.t: "아리아나 아프간 항공 납치"
 british_flavor.4.d: "아프가니스탄의 납치범 일당이 항공편에 탑승하여 이를 [ENG.GetName]으로 향하게 해 런던에 착륙시켰습니다. 당국은 납치범에 대응하기 위해 소규모 병력을 파견할 준비를 하고 있으나, 이후 그들을 어떻게 처리할지는 알려지지 않았습니다."
 british_flavor.4.a: "체포 후 추방한다"
 british_flavor.4.b: "체포 후 재판에 회부한다!"
 british_flavor.5.t: "내트웨스트 은행에 대한 적대적 인수"
 british_flavor.5.d: "스코틀랜드의 한 은행이 현재 잉글랜드의 내트웨스트 은행에 대한 적대적 인수를 시도하고 있습니다. 스코틀랜드 왕립 은행은 두 은행 중 규모가 작으며, 인수의 성공 여부는 대체로 또 다른 은행인 스코틀랜드 은행이 제시한 다른 제안에 달려 있습니다."
 british_flavor.5.a: "우리의 문제가 아니다"
 british_flavor.5.b: "은행을 구한다"
 british_flavor.6.t: "BMW, 로버 그룹 매각 계획 발표"
 british_flavor.6.d: "독일에 본사를 둔 자동차 제조사 BMW는 로버 그룹을 매각할 계획을 발표했으며, 런던에 기반을 둔 알케미 컨소시엄이 주요 인수 후보로 부상했습니다. 이 인수는 자동차 분야에서 우리의 영향력을 높여 줄 수 있으나, 갈수록 취약해지는 자동차 업계에서 추가적인 부담이 될 것입니다."
 british_flavor.6.a: "우리는 상관없다"
 british_flavor.6.b: "어쩌면 재고해야 할지도 모른다..."
 british_flavor.7.t: "데이비드 트림블, 얼스터 연합당 당수 선거에서 승리"
 british_flavor.7.d: "데이비드 트림블이 연합 찬성 정당이자 영국에서 세 번째로 오래된 정당인 얼스터 연합당의 당수 선거에서 승리했습니다. 그의 승리는 보수주의자들 사이에서 환영받고 있으며, 더 큰 자치를 바라는 이들은 결과에 무관심하거나 늘 그렇듯이 실망하고 있습니다."
 british_flavor.7.a: "승자에게 축하를 보낸다"
 british_flavor.8.t: "이민 및 망명법"
 british_flavor.8.d: "이민 및 망명법이 현재 논의되고 있으며, 이 법이 통과되면 모든 난민과 이민자가 식비와 의복비를 충당할 바우처를 받을 자격을 얻게 됩니다. 이를 거부하는 것은 다소 비인도적일 수 있으나, 법안을 통과시키면 결국 영국 납세자의 부담이 커지는 결과로 이어질 것입니다."
 british_flavor.8.a: "승인한다"
 british_flavor.8.b: "거부권을 행사한다"
 british_flavor.9.t: "의회 광장의 반자본주의 폭동"
 british_flavor.9.d: "반자본주의 폭도들이 거리로 나와 전 영국 총리 윈스턴 처칠의 동상을 훼손했습니다. 이 폭동은 '메이데이' 폭동으로 불리고 있으며, 군중은 당분간 해산할 기미를 보이지 않습니다. 일부는 조치를 요구하고 있고, 다른 이들은 결국 지쳐서 집으로 돌아갈 것이라고 말합니다."
 british_flavor.9.a: "끝날 때까지 기다린다"
 british_flavor.9.b: "청소 인력과 경찰을 투입한다"
 british_flavor.10.t: "여성 협회에서 야유를 받은 [ENG.GetLeader]"
 british_flavor.10.d: "[ENG.GetLeader]은(는) 여성 협회에서 적대적인 반응을 맞이했으며, 분노한 회원들로부터 야유와 느린 박수를 받았습니다. 이 창피한 반응으로 당원들과 일반 대중 사이에서 우리 지도부의 여러 측면에 의문을 제기하는 논의가 일어나고 있습니다."
 british_flavor.10.a: "무시한다"
 british_flavor.10.b: "비판에 대응한다"
 british_flavor.11.t: "스코틀랜드, 28조 폐지를 추진"
 british_flavor.11.d: "스코틀랜드 의회는 지방 당국이 '동성애를 확산'하는 것을 금지하는 1988년 지방정부법의 논란이 많은 28조의 폐지를 추진하고 있습니다. 이들의 법 폐지를 허용하면 다른 지역에서도 폐지하라는 요구가 일어나 정치적 불안정을 초래할 수 있습니다."
 british_flavor.11.a: "막는다"
 british_flavor.11.b: "우리는 신경 쓰지 않는다"
 british_flavor.12.t: "알렉스 샐먼드, SNP에서 사임"
 british_flavor.12.d: "알렉스 샐먼드는 당 내부 재정 전략을 둘러싼 분쟁으로 스코틀랜드 국민당 지도자직에서 물러났습니다. 그의 사임은 SNP가 약해진 틈을 타 공격할 기회를 주었으며, 이들 내부에서 더 큰 분열이 일어나도록 할 수 있습니다."
 british_flavor.12.a: "아무것도 하지 않는 것이 최선이다"
 british_flavor.12.b: "정치적 공격을 개시한다"
 british_flavor.13.t: "마지막 80명"
 british_flavor.13.d: "북아일랜드 평화 프로세스의 일환으로, 메이즈 교도소에 수감된 마지막 수감자 80명을 석방하기로 조치가 마련되었습니다. 이 수감자들은 아일랜드 민족해방군 소속이었거나 이들과 강한 연계가 있었으며, 1997년에는 이 수감자들이 충성파 의용군 지도자를 사살한 사건이 발생한 바 있습니다."
 british_flavor.13.a: "어쩌면 그냥 가둬 둘지도 모른다.."
 british_flavor.13.b: "좋다, 그럼 가도록 하라"
 british_flavor.14.t: "폴스그로브 단지에서 폭동 발발"
 british_flavor.14.d: "100명이 넘는 사람들이 아동 성범죄 전과자가 거주한다고 알려진 아파트 단지를 포위하면서 포츠머스의 폴스그로브 단지에서 폭동이 일어났습니다. 이는 뉴스 오브 더 월드 사가 '실명 공개 및 망신 주기' 캠페인을 시작한 이래 성범죄 혐의자에 대한 자경단 폭력으로는 가장 최근의 사례입니다."
 british_flavor.14.a: "글쎄, 우리가 할 수 있는 일은 없었다"
 british_flavor.14.b: "경찰을 투입한다"
 british_flavor.15.t: "연료 시위 발발"
 british_flavor.15.d: "시위대가 높은 연료 가격에 항의하기 위해 정유소 입구를 봉쇄했습니다. 운전자들이 사재기성 구매를 시작하면서 전국적인 연료 부족과 유가의 지속적인 상승으로 이어지고 있습니다. 이 사태로 인해 상당수의 주유소가 문을 닫기 시작한 것으로 알려졌으며, 정부는 해결책을 찾기 위해 분주히 움직이고 있습니다."
 british_flavor.15.a: "화석 연료 산업을 탓한다"
 british_flavor.15.b: "엄격한 석유 사용 할당량을 강제한다"
 british_flavor.15.c: "§R아무것도 하지 않는다§!"
 british_flavor.151.t: "정부의 무대응으로 폭동 발발"
 british_flavor.151.d: "연료 부족을 해결하려는 우리의 의지 부족이 오히려 분노를 더욱 키운 것으로 보이며, 점점 더 많은 사람들이 거리로 나와 정부의 해결책을 요구하고 있습니다. 현재 시위대는 정부 건물을 향해 행진하며 동상, 건물, 정부의 상징물을 훼손하고 있습니다."
 british_flavor.151.a: "노력하고 있다!"
 british_flavor.152.t: "거세지는 변화 요구의 목소리"
 british_flavor.152.d: "국민의 결의는 오히려 더 강해졌으며, 증오와 분노가 [ENG.GetLeader]과(와) 지배 체제를 향하고 있는 것으로 보입니다. 게다가 왕실 자금을 연료 보조금 지원에 재배정하라는 요구가 커졌으며, 일부는 군주제가 수치스러워하며 물러나야 한다고까지 주장하고 있습니다."
 british_flavor.152.a: "터무니없다!"
 british_flavor.153.t: "하원에 방화"
 british_flavor.153.d: "시위와 폭동이 조직적인 시민 불복종이 아닌 노골적인 무정부 상태로 극적으로 변화하면서 비상사태가 선포되었습니다. 경찰이 분노한 군중을 저지하지 못하는 가운데 하원이 분노한 시위대에 의해 불길에 휩싸였습니다. 시위대가 다른 국가 기관으로 행진할 계획이라는 보고가 있으나, 다음 표적이 어디가 될지는 분명하지 않습니다."
 british_flavor.153.a: "맙소사"
 british_flavor.154.t: "여왕의 퇴위!"
 british_flavor.154.d: "최근의 봉기와 계속되는 정부의 실패로 인해 여왕은 공식적으로 퇴위하겠다고 선언했으며, 오늘 오후 늦게 공식 연설로 국민에게 말씀할 계획입니다. 많은 이들이 그녀가 떠나는 것을 슬퍼하지만, 시위가 시작된 이후 군주제에 대한 증오가 더욱 커졌기 때문에 후임이 세워질지는 여전히 불분명합니다."
 british_flavor.154.a: "보석 왕관과 벨벳 가운이여, 안녕"
 british_flavor.155.t: "[ENG.GetLeader] 사임, 뚜렷한 후계자 없음"
 british_flavor.155.d: "[ENG.GetLeader]이(가) 사임했으며, 소속 정당은 적합한 후임자를 신속히 찾지 못하고 있습니다. 이러한 무정부 상태로 인해 나라는 혼란과 무질서에 빠졌고 취약해졌습니다. 영국이 이와 같은 위기를 겪은 적은 일찍이 없었으며, 정부는 현재 그 어떤 것도 해결할 능력이 없음을 보여 주었습니다."
 british_flavor.155.a: "다음엔 무슨 일이 일어날 것인가?!"
 british_flavor.156.t: "군부의 권력 장악"
 british_flavor.156.d: "영국군은 질서 회복에 직접 개입하겠다고 선언했으며, 대변인은 오후 4시 통금을 위반하는 자는 '신속히 처리될 것'이라고 발표하고, 이들이 하려는 모든 일은 '모든 영국인의 더 큰 선을 위한 것'이라고 선언했습니다. 이는 노동당과 보수당 당원들 사이에서 분노를 불러일으켰으며, 이 권력 장악을 권력 찬탈이라 부르는 가운데 일부는 이 조치를 독재를 향한 급진적 전환이라고 규탄하기까지 했습니다. 그럼에도 정치인들은 국정을 해결할 능력이 없음을 입증했으며, [ENG.GetLeader]의 사임 이후 뚜렷한 후계자도 없습니다."
 british_flavor.156.a: "미래는 어떻게 될 것인가?"
 british_flavor.157.t: "보고서: 신정부의 현황"
 british_flavor.157.d: "[ENG.GetLeader] 각하께 보냅니다,\n날짜:[GetDateText]\n\n제1항: 질서 현황\n각하, 영국군은 런던, 버밍엄, 맨체스터, 리버풀 등 주요 도시 지역에 대한 통제권을 신속하게 확보했습니다. 적어도 현재로서는 사람들이 군중에서 서서히 흩어져 집으로 돌아가기 시작한 것으로 보이며, 이는 정부가 지원하는 석유 보조금과 나라가 다시 일어서도록 돕는 계획을 시작했기 때문입니다.\n\n제2항: 좌파와 우파의 요구\n노동당과 보수당 정치인들은 우리 비상 행정부에 이 나라의 민주적 통치를 재확립하는 데 필요한 절차를 시작하라고 요구하기 시작했으며, 일부 정치인은 신행정부를 권위주의와 군의 월권의 상징이라고 선언했습니다. 한 노동당 정치인은 '총을 든 사람들은 기지에 머물러야 하고, 펜을 든 사람들은 공무원으로서의 임무를 재개해야 한다'고 말하기까지 했습니다.\n\n제3항: 추가 공고화\n우리 인원들은 기존 체제에 불만을 품었던 정치인과 관료들을 찾기 시작했으며, 양당제 시절의 전직 정치인들 대신 복무하도록 요청하고 있습니다. 이런 방식으로 권력을 장악하는 것은 거의 확실히 일종의 국가적 갈등에 상응하겠으나, 현재로서는 우리의 통제를 공고히 할 다른 수단이 없습니다."
 british_flavor.157.a: "알아 두겠다"
 british_flavor.16.t: "보수당 여론조사 상승"
 british_flavor.16.d: "토리당이 MORI 여론조사에서 38%로 노동당을 2포인트 앞서고 있다는 사실을 알게 된 보수당 지지자들이 축하하고 있습니다. 이는 1993년 이후 처음으로 보수당이 전국 여론조사에서 노동당을 앞선 것입니다. "
 british_flavor.16.a: "알겠다"
 british_flavor.17.t: "워릭셔에 지진 발생"
 british_flavor.17.d: "지진이 의례적 주인 워릭셔를 강타하여 인근 건물에 일부 피해를 입혔습니다. 피해를 입은 일부 건물의 재건을 돕기 위한 정부 지원을 요구하는 목소리가 있으나, 최근 정부 예산은 갈수록 빠듯해져 웨스트민스터가 일관된 결론을 내리기 어렵습니다."
 british_flavor.17.a: "그저 모든 것이 괜찮기만을 바랄 수밖에 없다"
 british_flavor.17.b: "정부 지원을 승인한다"
 british_flavor.18.t: "도널드 듀어, 병원으로 긴급 이송"
 british_flavor.18.d: "스코틀랜드 수석장관 도널드 듀어가 에든버러의 공식 관저인 뷰트 하우스 밖에서 넘어진 후 병원으로 긴급 이송되었습니다. 그의 건강은 급속히 악화되고 있으며, 정부가 개입하여 선진 의료진을 투입해야 한다는 요구가 높아지고 있습니다."
 british_flavor.18.a: "그의 쾌유를 기원한다"
 british_flavor.18.b: "선진 의료진을 파견해 돕도록 승인한다"
 United_Kingdom_News.2.t: "영국에서 폭동 발발"
 United_Kingdom_News.2.d: "전국적인 연료 부족과 휘발유 가격 급등 이후, 영국 당국은 경제가 자연스럽게 스스로 회복되기를 기대하며 부족 사태가 끝나기를 기다리는 쪽을 택했습니다. 그러나 상황은 나아지지 않고 오히려 악화되었으며, 이번 주 초 시위대가 하원에 불을 지르면서 사태는 결국 통제 불능으로 치달았습니다. 영국 당국은 자신들이 부족 사태에 책임이 없다고 주장하며, 이 문제는 단지 자연적인 것이며 곧 지나갈 것이라고 밝히고 있습니다. 한 시위자는 이렇게 말했습니다. '내 차에 넣을 연료도 없습니다! 출근할 수단도 없고, 가족을 따뜻하게 지킬 난방도 집에 없습니다. 오늘 벌어지는 일은 무능한 체제와 정부의 결과입니다.'\n정부는 상황을 완화하기 위해 가능한 모든 일을 하고 있다고 주장하지만, 현재로서는 시위가 가라앉을 기미가 없습니다."
 United_Kingdom_News.2.a: "분노가 다시 폭발한다"
 United_Kingdom_News.3.t: "엘리자베스 2세 퇴위"
 United_Kingdom_News.3.d: "최근 사태에 따라 영국 여왕 엘리자베스 2세가 공식적으로 왕위에서 물러난다고 발표했습니다. 이는 시위대가 군주제의 종식을 요구하며 이를 부패, 탐욕, 돈 먹는 하마의 상징과 연관시키기 시작한 데 따른 것입니다. 더 구체적으로, 이번에는 사람들이 자금을 정부 연료 보조금으로 재배정할 것을 요구했기 때문에 분노가 군주제를 향했으나, 이들의 요구는 웨스트민스터에서 귀담아듣는 이가 없었습니다. 또 다른 왕족이 왕위에 오를지는 알려지지 않았으나, 현재로서는 군주제가 나라가 불타는 것을 뒤에서 지켜볼 수밖에 없습니다."
 United_Kingdom_News.3.a: "왕좌가 무너진다"
 United_Kingdom_News.4.t: "영국군, 런던 장악"
 United_Kingdom_News.4.d: "영국군은 국가가 명령한 비상사태를 집행하는 데 공식적으로 개입한다고 선언했으며, 오후 4시 통금을 위반하는 자는 '신속히' 처리될 것이라고 명시적으로 밝혔습니다. 이는 영국에서 수주간 이어진 시위와 폭동에 이어진 것으로, 시위대는 분노에 못 이겨 하원에 불을 질렀습니다. 이 새로운 행정 기구의 의도는 아직 알려지지 않았으나, 영국 기득권층에서 노동당과 보수당이 쥐고 있는 권력을 약화시키려는 군부 강권 통치자들로 구성된 것으로 알려졌습니다."
 United_Kingdom_News.4.a: "이것이 영국의 끝인가?"
 ENG_inner_circle.01.t: "[GetAscendingAdvisorName]의 부상"
 ENG_inner_circle.01.desc: "[GetAscendingAdvisorName]은(는) 예리한 야망을 보여 주었으며 왕실 내에서 조용히 영향력을 확대해 왔습니다. 그러나 더 큰 권한을 향한 모든 걸음은 다른 신하들과 고위 인사들의 반발을 불러일으켰으며, 궁정은 이제 접근권과 서열을 둘러싼 낯익은 암투로 술렁이고 있습니다. 관건은 [GetAscendingAdvisorName]이(가) 여왕에게 충분한 인상을 남겨 여왕의 측근 집단에서 진정한 자리를 얻을 수 있느냐는 것입니다."
 ENG_inner_circle.01.a: "[ENGGetAscendedAdvisorName1]을(를) 대체한다"
 ENG_inner_circle.01.b: "[ENGGetAscendedAdvisorName2]을(를) 대체한다"
 ENG_inner_circle.01.c: "[ENGGetAscendedAdvisorName3]을(를) 대체한다"
 ENG_inner_circle.01.d: "[GetAscendingAdvisorName]은(는) 자격이 없다."
 ENG_inner_circle_charles.03.t: "왕세자의 화합 방문"
 ENG_inner_circle_charles.03.desc: "웨일스 공이 방문하였으며, 궁정 외교와 환경 관리에 관한 분명한 메시지를 결합하고 있습니다. 고위 관료 및 시민 사회 지도자들과의 회담은 신뢰 회복, 실질적 협력 확대, 그리고 기후 회복력을 구호가 아닌 공동의 전략적 이익으로 규정하는 데 초점을 맞추었습니다."
 ENG_inner_circle_charles.03.a: "화합이 우리의 관계를 이끌게 하자."
 ENG_inner_circle_charles.04.t: "찰스 왕세자, 열대우림 보호를 주창"
 ENG_inner_circle_charles.04.desc: "웨일스 공 찰스 왕세자 전하께서 열대우림을 보호하기 위한 전 지구적 행동 강화를 촉구하셨다는 소식을 전해 들었습니다. 왕세자 열대우림 프로젝트의 설립자로서 그는 정부, 기업, 시민 사회와 협력하여 삼림 파괴를 중단하고 기후 안정과 생물 다양성을 위해 이 핵심 생태계를 보존하는 것의 중요성을 알리는 데 자신의 영향력을 활용해 왔습니다."
 ENG_inner_circle_charles.04.a: "열대우림 보호에 관한 찰스 왕세자를 환영한다"
 ENG_inner_circle_charles.05.t: "찰스 왕세자의 환경 외교"
 ENG_inner_circle_charles.05.desc: "웨일스 공 찰스 왕세자 전하께서 우리나라에서 환경 외교 순방을 마치셨다는 소식을 받았습니다. 그는 기후, 지속 가능성, 생태 회복력에 관한 협력을 옹호하셨습니다. 수십 년 동안 환경 행동을 위해 가장 오래 목소리를 내 온 인물 중 한 명으로서, 왕세자는 지구적 환경 과제를 해결하고 지속 가능한 해법을 촉진하기 위해 국가와 분야를 넘나드는 집단적 노력이 필요하다는 점을 강조하셨습니다."
 ENG_inner_circle_charles.05.a: "지속 가능성을 지지한다."
 ENG_inner_circle_charles.06.t: "찰스 왕세자, 유기농업을 장려"
 ENG_inner_circle_charles.06.desc: "웨일스 공 찰스 왕세자 전하께서 우리나라의 유기농 및 지속 가능한 농업 발전을 지원하기 위해 적극적인 조치를 취하셨다는 사실을 알게 되었습니다. 하이그로브와 더치 홈 팜에서 수십 년간 유기농법을 개척해 온 경험을 바탕으로, 그는 유기농 실천의 환경적, 사회적 이점을 강조하고 농업의 지속 가능성에 대한 협력을 독려하셨습니다."
 ENG_inner_circle_charles.06.a: "지속 가능한 농업을 지지한다."
 ENG_inner_circle_andrew.04.t: "앤드루 왕자의 무역 사절단"
 ENG_inner_circle_andrew.04.desc: "영국의 무역 대표로 활동하는 앤드루 왕자 전하께서 더 강력한 상업적 유대와 경제 협력을 증진하기 위해 우리나라를 방문하셨습니다. 사절단 활동 중 그는 정부 관료, 기업 지도자, 잠재적 투자자들과 만나 우리 경제와 영국 경제 모두에 이익이 되는 무역 및 투자 기회를 부각시켰습니다."
 ENG_inner_circle_andrew.04.a: "환영한다"
 ENG_inner_circle_andrew.05.t: "무역 협정 체결"
 ENG_inner_circle_andrew.05.desc: "요크 공작 앤드루 왕자 전하께서 이끄신 최근의 논의와 협상 끝에 우리나라와 영국 사이에 새로운 무역 협정이 체결되었음을 기쁘게 보고드립니다. 이 협정은 상업적 교류 증대, 핵심 산업에서의 협력, 상호 경제적 이익의 길을 열어 주며, 양국 경제 간의 공동 이익과 강화된 유대를 반영합니다."
 ENG_inner_circle_andrew.05.a: "협력 관계에 동의한다."
 ENG_military.045.t: "영국의 전략적 동반자 관계 요청"
 ENG_military.045.d: "입헌 군주가 이끄는 영국은 서방 협력에 전념하고 있으며, 주요 비NATO 동맹국 지위를 공식적으로 요청했습니다. 이를 부여하면 대서양 횡단 관계가 강화되고 유럽의 핵심 협력국을 확보할 수 있습니다."
 ENG_military.045.a: "요청을 승인한다. 귀중한 동맹국이다."
 ENG_military.045.b: "거절한다. 이러한 지정에는 신중해야 한다."
 ENG_integrate_ireland: "[IRE.GetFlag] 아일랜드 통합"
 ENG_integrate_ireland_desc: "수십 년의 세월 끝에 우리는 마침내 아일랜드 땅을 복속시키고 통합했으며, 이제 통합 절차를 공식화할 때가 되었습니다."
 ENG_a_more_united_kingdom_decisions: "왕국 통합"
 ENG_a_more_united_kingdom_decisions_desc: "대영제국의 점진적인 쇠퇴와 냉전 기간의 탈식민지화에 따라 우리 왕국은 꾸준한 쇠퇴를 겪어 왔습니다. 외교적 수단과 패권적 성장을 통해 우리는 다시 한번 왕국을 재통합할 수 있을 것입니다.\n\n자세한 정보는 색상이 있는 텍스트 위에 마우스를 올리십시오."
 ENG_core_objectives_text: "핵심 목표"
 ENG_econ_hegemony_text: "경제 패권"
 ENG_military_hegemony_text: "군사 패권"
 ENG_political_hegemony_text: "정치 패권"
 ENG_declare_economic_hegemony: "경제 패권 선언"
 ENG_declare_economic_hegemony_desc: "우리가 영연방의 경제 패권국임을 선언할 때가 왔습니다."
 ENG_declare_military_hegemony: "군사 패권 선언"
 ENG_declare_military_hegemony_desc: "우리가 영연방의 군사 패권국임을 선언할 때가 왔습니다."
 ENG_declare_political_hegemony: "정치 패권 선언"
 ENG_declare_political_hegemony_desc: "우리가 영연방의 정치 패권국임을 선언할 때가 왔습니다."
 ENG_fractured_kingdom_united_state_decisions: "다음 시대"
 ENG_fractured_kingdom_united_state_decisions_desc: "[ENG.GetFlag] 영국에 새로운 체제가 들어섬에 따라 우리는 마침내 우리의 영향력을 신속하고 재빠르게, 그리고 공세적으로 바깥으로 확산시킬 수 있을 것입니다.\n\n우리는 세계에 혼란을 일으킬 PMC 조직을 우리의 지휘 아래 설립할 수 있습니다."
 ENG_grant_land_in_isle_of_man: "맨 섬 개조"
 ENG_grant_land_in_isle_of_man_desc: "역사적 중요성에도 불구하고 맨 섬은 오늘날 자원 채굴 외에는 우리에게 거의 쓸모가 없습니다. 그러나 이 땅을 새로운 PMC 조직에 부여한다면, 그들은 잠재력을 온전히 발휘하여 이곳을 작전을 전개할 수 있는 거점으로 활용할 수 있을 것입니다."
 ENG_devolved_matters: "권한 이양 사안"
 ENG_devolved_matters_desc: "우리의 구성국들은 명목상 또는 완전한 독립을 얻기 위해 더 많은 §H권한 이양 국가§!를 추진해 왔습니다. 3대 구성국은 [SCO.GetFlag] §H스코틀랜드§!, [NIR.GetFlag] §H북아일랜드§!, [WAS.GetFlag] §H웨일스§!입니다.\n\n국가 상황이 악화되면 구성국들은 자신들의 의존도를 낮추는 법안을 통과시키려 할 것이며, 우리는 선동이 커질 위험을 감수하고 이를 거부할 수 있습니다.\n\n권한 이양이 진행됨에 따라 결정이 사용 가능해지며, 더 자세한 정보는 화면 오른쪽 하단의 퍼즐 조각으로 표시된 권한 이양 인터페이스에서 확인할 수 있습니다.\n\n다음 구성국 선거: [?ROOT.ENG_election_var|Y0]개월"
 ENG_appease_scotland: "[SCO.GetFlag] 스코틀랜드 맞춤형 보조금"
 ENG_appease_nireland: "[NIR.GetFlag] 북아일랜드 맞춤형 보조금"
 ENG_appease_wales: "[WAS.GetFlag] 웨일스 맞춤형 보조금"
 ENG_doing_other_decision: "다른 결정을 진행 중"
 ENG_welsh_referendum: "[GetYear]년 [WAS.GetFlag] 웨일스 독립 주민투표"
 ENG_welsh_referendum_desc: "[WAS.GetFlag] 웨일스 국민은 국가이자 구성국, 그리고 브리튼 제도의 일원으로서의 미래를 결정할 주민투표를 실시할 것입니다. 선거 운동은 투표일까지 진행되며, 결과는 개표 시점에 웨일스 여론이 어떻게 변했는지에 따라 결정됩니다. 웨스트민스터는 정치 자본과 국고 자금을 투입하여 이를 움직일 수 있습니다.\n\n$ENG_integration_vote$: §Y[?ENG_referendum_stay_vote|0]§!%"
 ENG_release_scotland: "[GetYear]년 [SCO.GetFlag] 스코틀랜드 독립 주민투표 승인"
 ENG_release_scotland_desc: "'스코틀랜드여 영원하라!'\n\n어쩌면 이전의 주민투표 시도를 너무 성급하게 거부했는지도 모르며, 그 실수를 되돌릴 수 있습니다."
 ENG_release_ireland: "[GetYear]년 [NIR.GetFlag] 북아일랜드 독립 주민투표 승인"
 ENG_release_ireland_desc: "어쩌면 이전의 주민투표 시도를 너무 성급하게 거부했는지도 모르며, 그 실수를 되돌릴 수 있습니다."
 ENG_release_wales: "[GetYear]년 [WAS.GetFlag] 웨일스 독립 주민투표 승인"
 ENG_release_wales_desc: "어쩌면 이전의 주민투표 시도를 너무 성급하게 거부했는지도 모르며, 그 실수를 되돌릴 수 있습니다."
 decisions_ENG: "[ENG.GetName] 결정"
 decisions_ENG_desc: "이곳에서 정부는 임무를 추진하고 영국의 진로를 이끄는 결정적 조치를 취하며, 산업을 지원하고 연구를 형성하고 지역을 강화하고 국가의 변화하는 요구에 대응할 수 있습니다."
 falkland_policy: "포클랜드 정책"
 denounce_status_as_the_commonwealth_of_nation_member: "영연방 회원국 지위 §Y파기§!"
 denounce_status_as_the_commonwealth_of_nation_member_desc: "낡은 유대에서 벗어나십시오. 영연방 회원 자격을 파기하고 진정한 국가 주권을 향한 진로를 설정하십시오. 운명을 되찾으십시오. 자신만의 길을 개척하십시오. 독립이 기다리고 있습니다."
 ENG_bankers_switch_faction: "국제 금융가 지지"
 ENG_bankers_switch_faction_desc: "우리는 내부 동맹을 재편하여 국제 금융가 파벌에 유리하도록 하고, 정책을 세계 금융, 개방적 자본 흐름, 서비스 중심 경제 쪽으로 기울입니다."
 ENG_scottish_parliament: "[SCO.GetFlag] 스코틀랜드 의회"
 ENG_scottish_parliament_desc: "[SCO.GetFlag] 스코틀랜드 의회 의원들은 항상 런던에 충성해 오지 않았으며 앞으로도 그러하지 않을 것입니다. 자치 또는 독립 [SCO.GetFlag] 스코틀랜드의 수립을 위해 싸울 §H독립 찬성§! 의원들이 있을 것입니다.\n\n§H독립 찬성§! 의원들이 과반을 차지하면 이들은 더 많은 자치권을 부여하는 법안을 통과시키기 시작하며, 우리는 이를 승인하거나 거부할 수 있습니다. 이들의 요구를 꾸준히 수락하면 우호적이고 충성스러운 [SCO.GetFlag] 스코틀랜드 구성국을 얻게 됩니다. 그러나 이들의 요구를 거듭 거부하면 이들의 §H선동§!이 매우 혼란스러운 상황을 초래할 수 있습니다. [SCO.GetFlag] §H스코틀랜드 선동§!이 §H100§!에 도달하면 이들은 독립을 요구할 것입니다.\n\n§H독립 찬성 의석§!: [?ENG_scottish_nationalists]/129\n\n[SCO.GetFlag] §H스코틀랜드 선동§!: [?ENG_scottish_agitation]"
 ENG_invest_northern_ireland_mission: "북아일랜드 투자 건설 복귀"
 ENG_ireland_border_cooperation: "아일랜드 국경 협력 조약"
 ENG_clydach_nickel_decision: "클리다크 니켈 정련소 현대화"
 ENG_clydach_nickel_decision_desc: "우리는 사우스웨일스의 클리다크 니켈 정련소를 개선하여 배터리 금속과 고급 합금의 생산 능력을 확대하고 핵심 광물 공급을 강화합니다."
 ENG_alloys_modernisation: "합금 생산 현대화"
 ENG_alloys_modernisation_desc: "우리는 특수 합금을 위한 새 제련소와 압연 라인에 투자하여 터빈과 장갑판에서 고성능 부품에 이르기까지 모든 것의 품질과 처리량을 개선합니다."
 ENG_ellesmere_port_decision: "엘즈미어 포트 희토류 자석 공장"
 ENG_ellesmere_port_decision_desc: "우리는 엘즈미어 포트의 희토류 가공을 확대하여 풍력 터빈, 전기 자동차, 첨단 방위 체계에 쓰이는 고급 자석을 생산합니다."
 ENG_shetland_hydrocarbon_decision: "셰틀랜드 서부 탄화수소 개발 추진"
 ENG_shetland_hydrocarbon_decision_desc: "우리는 셰틀랜드 서부의 석유 및 가스전 개발을 강화하고 심해 매장량을 활용하여 국내 탄화수소 생산과 에너지 안보를 증진합니다."
 ENG_rosebank_field_decision: "로즈뱅크 유전 개발"
 ENG_rosebank_field_decision_desc: "우리는 로즈뱅크 석유 및 가스전의 본격 개발을 승인하고, 새로운 해상 플랫폼과 파이프라인을 가동하여 장기 에너지 공급을 강화합니다."
 ENG_cambo_offshore_decision: "캠보 해상 유전 개발"
 ENG_cambo_offshore_decision_desc: "우리는 캠보 해상 사업을 추진하고, 새로운 유정과 해저 연결망을 추가하여 석유 및 가스 매장량을 생산에 투입합니다."
 ENG_hornsea_wind_farm_decision: "혼시 풍력 단지 확장"
 ENG_hornsea_wind_farm_decision_desc: "우리는 북해의 혼시 해상 풍력 구역의 추가 단계를 지원하고, 터빈과 전력망 연결을 추가하여 세계 최대 풍력 단지에서 더 많은 청정 전력을 공급합니다."
 ENG_drakeland_tungsten_decision: "드레이클랜즈 텅스텐 광산 재가동"
 ENG_drakeland_tungsten_decision_desc: "우리는 플리머스 인근의 드레이클랜즈 광산을 재가동하고, 주석과 텅스텐 생산을 다시 가동하여 영국의 핵심 기술 금속 공급을 강화합니다."
 ENG_south_crofty_tin_decision: "사우스 크로프티 주석 광산 재가동"
 ENG_south_crofty_tin_decision_desc: "우리는 콘월의 사우스 크로프티 광산의 재가동에 자금을 지원하여 심부 주석 채굴을 되살리고, 우리 산업을 위한 고급 광석의 안정적인 국내 공급원을 확보합니다."
 ENG_scottish_industry_mission: "스코틀랜드 산업 횡재"
 ENG_scottish_industry_mission_desc: "스코틀랜드 철강 및 중공업에 대한 우리의 투자가 새로운 광맥, 계약, 부수 사업을 열어 줄 수 있습니다. 제철소와 조선소의 재개된 활동이 우리가 생산에 투입할 수 있는 추가 자원을 드러낼 가능성이 상당히 있습니다."
 ENG_celsa_steel_mission: "셀사 철강 생산량 검토"
 ENG_celsa_steel_mission_desc: "우리는 매년 셀사의 카디프 제철소를 검토하여 신규 주문, 효율 향상 또는 고철 유입으로 철강 생산을 한 단계 더 끌어올릴 수 있는지 살펴봅니다."
 ENG_roysth_naval_port_decision: "로사이스 해군 항구 확장"
 ENG_roysth_naval_port_decision_desc: "우리는 로사이스의 부두와 지원 시설을 확장하여 포스 하구를 개수, 지원, 향후 군함 건조를 위한 더 강력한 기지로 만듭니다."
 ENG_expand_belfast_decision: "벨파스트 산업 단지 확장"
 ENG_expand_belfast_decision_desc: "우리는 벨파스트의 부두와 외곽에 새 부지를 정리하고 기반 시설을 갖추어 북아일랜드 전역의 공장, 조선소, 사무실을 위한 추가 공간을 확보합니다."
 ENG_highland_main_line_decision: "하이랜드 본선 개량"
 ENG_highland_main_line_decision_desc: "우리는 퍼스와 인버네스 사이의 하이랜드 본선을 개량하여 이동 시간을 단축하고, 노선 주변 도시들의 절실했던 연결성과 생산성을 크게 끌어올립니다."
 ENG_titanic_quarter_decision: "타이태닉 지구 개발"
 ENG_titanic_quarter_decision_desc: "우리는 벨파스트의 옛 조선소 부지를 타이태닉 지구로 재개발하여 사무실, 스튜디오, 해안 산업을 혼합함으로써 옛 하랜드 앤드 울프 부지에 새 활력을 불어넣습니다."
 ENG_productivity_gap_mission: "생산성 상실"
 ENG_hs2_mission: "고속철도 2(HS2) 건설"
 ENG_northen_powerhouse_mission: "북부 파워하우스 철도 건설"
 ENG_build_london: "그레이터 런던 개발"
 ENG_build_london_desc: "우리는 그레이터 런던 지역의 유권자들에게 개조 사업이 이루어질 것이라고 약속했습니다. 따라서 이 약속을 지켜야 합니다."
 ENG_promise_labour: "노동조합에 대한 약속"
 ENG_promise_labour_desc: "우리는 노동조합에 약속을 했으며, 그에 따라 행동해야 합니다."
 ENG_promise_military: "군산복합체에 대한 약속"
 ENG_promise_military_desc: "우리는 군산복합체에 약속을 했으며, 그에 따라 행동해야 합니다."
 ENG_promise_fossil_fuel: "화석 연료 산업에 대한 약속"
 ENG_promise_fossil_fuel_desc: "우리는 화석 연료 산업에 약속을 했으며, 그에 따라 행동해야 합니다."
 ENG_monarchy_decision_category: "윈저 왕가"
 ENG_monarchy_decision_category_desc: "윈저 왕가는 1917년부터 통치해 왔으며 근대 군주제를 전쟁, 사회 변화, 새 세기의 압박 속에서 이끌어 왔습니다. 이 왕가는 영국 공적 생활의 중심에 서 있으며, 의례와 봉사, 그리고 왕국을 하나로 묶는 조용한 일상에 녹아든 왕조입니다. 구성원들은 후원, 방문, 은밀한 개입을 통해 영향력을 행사하며, 정치만으로는 닿을 수 없는 방식으로 자선단체, 외교, 군에까지 미칩니다. 이곳에는 왕실 가족의 사업들이 나열되어 있어 각 왕족이 추진할 수 있는 구상과 그 존재가 가져올 수 있는 변화를 보여 줍니다."
 ENG_monarchy: "윈저 왕가"
 ENG_charles_youth_sustainability_decision: "지속 가능성을 위한 청년 역량 강화"
 ENG_charles_youth_sustainability_decision_desc: "찰스 왕세자 전하께서는 젊은이들이 지속 가능하고 기후 친화적인 구상을 이끌도록 지원하는 프로그램을 시작하실 것입니다. 웨일스 공은 청소년 자선단체와 환경 활동에서 쌓은 수십 년의 경험을 바탕으로 생태 회복력에 부합하는 교육, 기술 개발, 기업가 정신을 장려하실 것입니다. 이 프로그램은 더 지속 가능한 미래를 건설하는 데 있어 젊은 세대의 핵심적인 역할을 인정합니다."
 ENG_charles_sustainable_urban_planning_decision: "지속 가능한 도시 계획 장려"
 ENG_charles_sustainable_urban_planning_decision_desc: "찰스 왕세자 전하께서는 사람, 환경, 장기적 회복력을 우선시하는 총체적 설계 원칙에 기반한 지속 가능한 도시 및 지역사회 계획을 주창하실 것입니다. 기후와 문화적 맥락을 존중하는 공동체를 건설하는 데 오랫동안 옹호해 오신 바를 바탕으로, 이 프로그램은 건축, 인프라, 토지 이용에 대한 전통적이고 환경에 민감한 접근법을 장려할 것입니다."
 ENG_charles_organic_agriculture_decision: "유기농 및 지속 가능한 농업 주창"
 ENG_charles_organic_agriculture_decision_desc: "찰스 왕세자 전하께서는 농촌과 전 세계 공동체 모두에서 유기농 및 지속 가능한 영농 방식을 주창하기 위해 영향력을 활용하실 것입니다. 생태 관리와 재생 농업에 대한 수십 년간의 헌신을 바탕으로, 왕세자께서는 토양 건강을 강화하고 가족 농가를 지원하며 환경 영향을 줄이는 관행을 장려하실 것입니다."
 ENG_charles_environmental_diplomacy_tour_decision: "환경 외교 순방"
 ENG_charles_environmental_diplomacy_tour_decision_desc: "찰스 왕세자 전하께서는 지속 가능성과 기후 구상에 관한 협력을 촉진하기 위해 국제 환경 외교 순방에 나서실 것입니다. 웨일스 공으로 봉직한 수십 년 동안 그는 수많은 나라를 방문하고 지도자 및 지역사회와 교류하며 기후 변화, 열대우림 보호, 지속 가능한 발전에 대한 행동을 촉구해 오셨습니다. 이번 순방은 세계적 동반자 관계를 강화하고 자연 세계를 보호하겠다는 공동의 약속을 부각시키려 합니다."
 ENG_charles_rainforest_help_decision: "전 지구적 열대우림 보호 지원"
 ENG_charles_rainforest_help_decision_desc: "찰스 왕세자 전하께서는 열대우림 파괴에 맞선 전 지구적 행동을 촉진하는 프로그램을 주도하실 것입니다. 왕세자 열대우림 프로젝트의 설립자로서, 정부, 기관, 시민 사회와 협력하여 열대우림 보존의 중요성과 기후 변화 대응에서의 그 역할을 부각시키실 것입니다."
 ENG_charles_charities_network_decision: "왕세자 자선 네트워크 가동"
 ENG_charles_charities_network_decision_desc: "찰스 왕세자 전하께서는 국내외의 사회, 교육, 환경 활동을 지원하기 위해 광범위한 자선 단체 네트워크를 가동하실 것입니다. 웨일스 공이 설립하거나 후원하는 단체들의 모임인 왕세자 자선 재단의 총재로서, 이들의 집단적 전문성을 활용하여 지속 가능한 공동체를 구축하고 기회를 증진하며 여러 지역의 복지를 개선하실 것입니다."
 ENG_charles_harmony_tour_decision: "화합 외교 순방 실시"
 ENG_charles_harmony_tour_decision_desc: "찰스 왕세자 전하께서는 자신의 화합 철학을 알리고 환경 및 지속 가능성 문제에 관한 협력을 장려하기 위해 국제 순방에 나서실 것입니다. 웨일스 공으로 봉직한 수십 년 동안 그는 기후 행동, 열대우림 보호, 지속 가능한 발전의 필요성을 부각시키기 위해 줄곧 영향력을 활용해 오셨으며, 이번 순방은 이러한 공동 목표를 중심으로 세계적 동반자 관계를 강화하려 합니다."
 ENG_andrew_naval_haritage_decision: "해군 유산 수용"
 ENG_andrew_naval_haritage_decision_desc: "앤드루 왕자는 오랜 해군 경력을 바탕으로 조국의 해양 전통과 복무를 부각시킬 것입니다. 포클랜드 분쟁에서 현역으로 복무한 영국 해군의 헬리콥터 조종사, 교관, 지휘관으로서, 그는 해군 유산에 대한 존중을 장려하고 전 세계의 동맹국 함대 및 해양 훈련 기관과의 협력을 증진할 것입니다."
 ENG_andrew_trade_representive_decision: "무역 대표 사절단"
 ENG_andrew_trade_representive_decision_desc: "앤드루 왕자는 영국의 상업적 이익을 해외에 증진하기 위해 무역 대표 사절단에 나설 것입니다. 영국의 국제 무역 및 투자 특별 대표로서의 경험을 바탕으로, 외국 정부, 기업 지도자, 투자자들과 접촉하여 영국의 수출과 외국인 투자 유치 기회를 부각시키고, 경제적 유대를 강화하며 무역과 기업 활동에 관한 협력을 증진할 것입니다."
 ENG_andrew_emerging_trade_agreement_decision: "신흥국 무역 협정 추진"
 ENG_andrew_emerging_trade_agreement_decision_desc: "앤드루 왕자는 신흥 세계 시장에서의 무역 협정과 사업 제휴를 추진하는 노력을 주도할 것입니다. 해외에서 영국의 상업적 이익을 대표해 온 폭넓은 경험을 바탕으로, 향후 성장과 협력의 잠재력이 높은 개발도상국 경제와의 수출, 제휴, 투자 기회를 열고자 할 것입니다."
 ENG_andrew_emerging_economy_benefits_decision: "신흥국 경제 제휴 활용"
 ENG_andrew_emerging_economy_benefits_decision_desc: "앤드루 왕자는 무역, 투자, 공동 경제 성장의 기회를 확대하기 위해 신흥국 경제와의 제휴를 강화하는 데 집중할 것입니다. 전 세계에서 영국의 상업적 이익을 증진해 온 폭넓은 경험을 바탕으로, 이 구상은 빠르게 발전하는 시장의 투자와 전문 지식을 유치하고 국내 생산성을 높이며 더 역동적인 기업 환경을 조성하는 것을 목표로 합니다."
 ENG_andrew_digital_enterprise_decision: "디지털 기업 구상"
 ENG_andrew_digital_enterprise_decision_desc: "앤드루 왕자는 전국적으로 디지털 기술과 기업가 정신을 증진하기 위한 디지털 기업 구상을 시작할 것입니다. 사람들이 온라인, 기술, 사업 역량을 개발하도록 도운 디지털 기업 시상 활동의 경험을 바탕으로, 이 프로그램은 디지털 혁신가를 꿈꾸는 이들을 지원하고 기술 소양을 장려하며 디지털 경제의 더 탄탄한 기반을 구축하는 것을 목표로 합니다."
 ENG_anne_national_charity_decision: "공주 전국 자선 사업"
 ENG_anne_national_charity_decision_desc: "프린세스 로열은 사진 촬영용 행사가 아닌 실질적인 성과를 이끌어 내기 위해 전국의 후원 사업을 확대하고 조정할 것입니다. 모금 활동, 자원봉사자 동원, 대중의 관심이 역량이 한계에 다다른 곳으로 집중될 것입니다.."
 ENG_anne_carers_promotion_decision: "돌봄 제공자 인정 운동"
 ENG_anne_carers_promotion_decision_desc: "앤 공주는 무급 돌봄 제공자를 전국적 관심의 중심에 놓고, 기관들이 돌봄을 사적 부담이 아닌 필수 서비스로 여기도록 압박할 것입니다. 이 운동은 왕실 후원과 끊임없는 노출을 통해 휴식 지원, 직장 내 유연성, 대중의 존중을 끌어올립니다."
 ENG_anne_military_readiness_decision: "대비 태세 기준"
 ENG_anne_military_readiness_decision_desc: "프린세스 로열은 군 직책을 활용하여 전문성, 훈련 규율, 그리고 부대를 투입 가능한 상태로 유지하는 화려하지 않은 일상을 요구할 것입니다. 점검, 훈련, 군수 지원의 이행이 진지함의 척도로 제시될 것입니다."
 ENG_anne_navy_readiness_decision: "함대 대비 태세 점검"
 ENG_anne_navy_readiness_decision_desc: "영국 해군은 압박 속에서도 항해하고, 싸우고, 자립할 수 있음을 입증하도록 요구받을 것입니다. 앤 공주의 존재는 기준을 강제합니다. 정비, 승조원 숙련도, 작전 속도는 협상의 여지가 없는 사안으로 다루어질 것입니다."
 ENG_anne_tourism_decision: "왕실 관광 진흥"
 ENG_anne_tourism_decision_desc: "영국의 명성은 자산이며, 프린세스 로열은 이를 목적을 가지고 활용할 것입니다. 집중적인 관광 진흥은 수요가 필요한 문화유산, 행사, 지역 경제를 부각시켜 왕실 일정을 예약과 투자로 전환시킬 것입니다."
 ENG_edward_beach_youth_decision: "해안 청소년 지원 활동"
 ENG_edward_beach_youth_decision_desc: "웨식스 백작은 왕실의 청소년 활동을 해안 지역으로 가져가, 방문, 시상 프로그램, 지역 제휴를 통해 젊은이들이 기술과 봉사로 나아가도록 이끌 것입니다. 메시지는 실용적입니다. 자신감, 규율, 그리고 앞으로 나아갈 길입니다. "
 ENG_edward_global_youth_decision: "글로벌 청소년 교류"
 ENG_edward_global_youth_decision_desc: "에드워드는 청소년 교류를 영국 밖으로 확대하여, 해외 협력국들과의 교환 프로그램, 훈련, 공동 시민 사업을 통해 유대를 강화할 것입니다."
 ENG_edward_arts_culture_patronage_decision: "예술 및 문화 후원"
 ENG_edward_arts_culture_patronage_decision_desc: "왕실은 영국의 예술 및 문화 분야를 정체성이자 전략적 영향력으로서 주창할 것입니다. 왕실의 후원은 가시성을 높이고, 자금을 확보하며, 국내외에서 국가 서사를 형성하는 기관들을 보호할 것입니다."
 ENG_edward_production_guild_decision: "생산 길드 지원"
 ENG_edward_production_guild_decision_desc: "영국의 길드와 숙련 생산 직종은 품질과 수출 경쟁력의 근간입니다. 에드워드는 인정, 훈련 연계, 산업 조정을 통해 생산 길드를 지원하여 수공업이 이어지고 공급망이 열려 있도록 할 것입니다. "
 ENG_edward_veteran_support_decision: "웨식스 재향군인 지원"
 ENG_edward_veteran_support_decision_desc: "복무는 제대와 함께 끝나지 않으며, 왕실은 재향군인을 뒷전으로 취급하지 않을 것입니다. 웨식스 백작은 자선단체, 고용주, 지방 당국을 조정하여 전환 지원, 주거 안정, 취업 경로를 개선할 것입니다. "
 ENG_philip_award_medal_decision: "필립 공 메달 수여"
 ENG_philip_award_medal_decision_desc: "필립 공은 세계적으로 탁월한 영향을 미친 선도적 기술자에게 필립 공 메달을 수여하는 독자적 임무에 나설 것입니다. 이 상은 그의 개인적 후원 아래 공학 실무와 혁신에서의 뛰어난 성취를 기립니다."
 ENG_philip_award_expansion_decision: "공작 청소년상 확대"
 ENG_philip_award_expansion_decision_desc: "필립 공은 에든버러 공작 상의 확대를 시작하기 위해 순방하며, 이 청소년 프로그램을 더 폭넓은 국제 대상에게 개방하는 것을 목표로 합니다. 그의 노력은 여러 나라에서 청소년의 회복력과 시민 역량을 강화하고자 합니다."
 ENG_philip_trust_funds_grants_decision: "필립 공 신탁 보조금 가동"
 ENG_philip_trust_funds_grants_decision_desc: "필립 공은 필립 공 신탁 기금에서 지역사회 및 교육 사업에 지급되는 보조금의 집행을 직접 감독할 것입니다. 그의 직접 관여로 여가, 학습, 시민 생활을 개선하는 구상에 대한 지원이 보장됩니다."
 ENG_philip_faith_conservation_decision: "신앙 및 보존 구상 추진"
 ENG_philip_faith_conservation_decision_desc: "필립 공은 종교 공동체와 환경 단체를 연합하여 자연을 공동으로 관리하는 프로그램에 나설 것입니다. 그는 도덕적, 공동체적 자원을 지속 가능한 보존 목표 뒤에 결집시키고자 합니다."
 ENG_philip_innovation_recognition_decision: "국가 혁신 포상 제도 수립"
 ENG_philip_innovation_recognition_decision_desc: "필립 공은 뛰어난 산업 디자인, 과학, 실용적 문제 해결에 보상하는 국가 제도를 시작할 것입니다. 그의 구상은 독창성을 경제 성장과 국가적 성공의 기둥으로 부각시킵니다."
 ENG_william_air_ambulance_decision: "에어 앰뷸런스 근무 비행"
 ENG_william_air_ambulance_decision_desc: "윌리엄 왕자는 또 한 차례의 에어 앰뷸런스 근무에 나서 응급 임무를 비행하고 지상의 승무원들을 만납니다."
 ENG_william_mental_health_at_work_decision: "직장 내 정신 건강"
 ENG_william_mental_health_at_work_decision_desc: "윌리엄 왕자는 직장 내 정신 건강 증진 운동에 고용주와 자선단체를 결집시키기 위해 나섭니다."
 ENG_william_step_into_health_decision: "스텝 인투 헬스 운동"
 ENG_william_step_into_health_decision_desc: "윌리엄 왕자는 스텝 인투 헬스를 지원하고 재향군인과 군인 가족을 위한 NHS 진출 경로를 열기 위해 순회에 나섭니다."
 ENG_william_early_years_forum_decision: "영유아기 포럼 소집"
 ENG_william_early_years_forum_decision_desc: "윌리엄 왕자는 전문가, 자선단체, 기업을 한자리에 모으기 위해 영유아기 포럼을 소집합니다."
 ENG_william_chogm_youth_decision: "CHOGM 청년 메시지"
 ENG_william_chogm_youth_decision_desc: "윌리엄 왕자는 차세대가 영연방의 미래에 중요하다는 신호를 보내기 위해 영연방 정상회의(CHOGM) 청년 세션에 참석합니다."
 ENG_seize_sierra_leone_resources: "[SIE.GetFlag] 시에라리온 착취"
 ENG_seize_sierra_leone_resources_desc: "이제 바라스 작전에서 무언가를 얻어 낼 때가 되었습니다. 우리는 시에라리온의 핵심 자원을 장악하고 500일 동안 경제적 영향력을 확립할 것입니다."
 ENG_war_for_delta: "델타 전쟁"
 ENG_war_for_delta_desc: "우리는 나이지리아인들을 약간 지나치게 몰아붙였는지도 모르며, 이 때문에 그들의 자존심이 우리 군에 맞서는 데 대한 두려움을 억누르게 되었습니다. 그럼에도 우리는 이곳을 실제로 누가 좌우하는지 보여 주기 위해 그들의 수도를 점령해야 합니다."
 ENG_end_of_the_world: "세상의 끝 정복"
 ENG_end_of_the_world_desc: "'세상의 끝'이라고도 불리는 티에라 델 푸에고는 중요한 군도이자 남극으로 가는 관문입니다. 이 요충지를 장악하면 국가 전체에 막대한 이익이 될 것이므로, 우리는 이를 위해 싸울 각오가 되어 있습니다."
 ENG_operation_eastern_divide: "동부 분할 작전"
 ENG_operation_eastern_divide_desc: "이집트는 수에즈 운하를 통한 공정하고 동등한 통행을 요구하는 우리의 호소를 받아들이지 않았으며, 그 결과 우리에게는 군사 행동에 의존하는 것 외에 다른 선택지가 남지 않았습니다."
 ENG_a_more_united_kingdom: "더욱 통합된 연합왕국"
 ENG_a_more_united_kingdom_desc: "우리 국가는 현재 하나로 통합되어 있으나, 왕국의 일부는 떨어져 나가 독립국이 되었습니다. 진정한 연합왕국이 되려면 세계 곳곳의 영연방 국가들을 다시 하나로 모아야 합니다."
 ENG_fractured_kingdom_united_state: "분열된 왕국, 통합된 국가"
 ENG_fractured_kingdom_united_state_desc: "§R'시민이지, 신민이 아니다'§!\n군주제와 이전 체제가 잊혀 가는 동안에도 국가는 오히려 더욱 강해졌습니다. 이제 우리가 세계 무대에서 더욱 적극적이고 지배적인 입장을 취하고, 수 세기 동안 이 땅을 약탈한 자들을 마침내 응징할 때가 왔습니다."
 ENG_deeper_commonwealth_integration: "영연방 심화 통합"
 ENG_deeper_commonwealth_integration_desc: "진정으로 통합된 국가가 되려면, 먼저 통합하고자 하는 대상들에게 우리가 적합한 중심 국가임을 설득해야 합니다. 그래야만 다음 단계로 나아갈 수 있습니다."
 ENG_sovereignty_above_all: "무엇보다 주권"
 ENG_sovereignty_above_all_desc: "우리 행정부가 국민의 미래를 결정할 수 있는 능력보다 중요한 것은 없습니다. 우리나라 외의 어떤 국가도 우리의 국정 운영에 관여해서는 안 됩니다."
 ENG_establishing_new_leadership: "새 체제의 수립"
 ENG_establishing_new_leadership_desc: "본격적인 작업에 앞서 새로운 체제를 수립해야 합니다. 사회의 근본적인 개편이 필요할 것이며, 과정을 원활하게 하기 위해 국가 일부 지역을 맡을 새로운 과도 당국의 구성을 계획하기 시작해야 합니다."
 ENG_two_way_concessions: "상호 양보"
 ENG_two_way_concessions_desc: "한쪽만 노력해서는 권한 이양 합의에서 진전을 기대할 수 없습니다. 우리는 일부 양보를 하되, 스코틀랜드 측도 똑같이 하기를 기대합니다."
 ENG_uniting_the_isle: "섬의 통합"
 ENG_uniting_the_isle_desc: "아일랜드인은 긴장을 부추기고 정당들이 북아일랜드 분리주의를 외치게 하는 등 우리 문제의 상당 부분의 원인입니다. 이제는 진군하여 그들에게 교훈을 가르쳐 줄 때가 되었습니다."
 ENG_revolution_not_devolution: "권한 이양이 아닌 혁명"
 ENG_revolution_not_devolution_desc: "진정으로 통합된 국가를 이루려면 먼저 권한 이양의 원인을 제거해야 합니다. 우리에게 필요한 것은 권한 이양이 아니라 국민 혁명입니다!"
 ENG_bring_in_canada: "캐나다 끌어들이기"
 ENG_bring_in_canada_desc: "우리는 영토 면적 기준 최대 영연방 회원국인 캐나다에 손을 내밀어야 합니다. 캐나다 친구들은 오랜 세월 우리와 가까운 관계를 유지해 왔으므로, 이들을 끌어들이는 것은 그리 어렵지 않을 것입니다."
 ENG_the_realm_of_britain: "영국 왕국"
 ENG_the_realm_of_britain_desc: "영국 왕국은 결코 무너질 수 없는 존재이며, 영국 국민의 정신은 특히 힘든 시기에도 굳건히 버텨 왔습니다."
 ENG_glory_of_pax_britannica: "팍스 브리태니카의 영광"
 ENG_glory_of_pax_britannica_desc: "우리의 과거는 영광스러웠으며, 과거는 결코 사라진 것이 아니라 다가올 일의 예고편이라고 말하는 이들도 있습니다. 우리는 선조들의 꿈을 실현하고 팍스 브리태니카의 영광을 되살려야 합니다!"
 ENG_australian_outreach: "오스트레일리아 접근"
 ENG_australian_outreach_desc: "오스트레일리아인들이 역사를 통틀어 우리의 대의를 위해 치른 희생을 잊어서는 안 됩니다. 따라서 다가올 미래에 그들이 우리와 함께하도록 초청하는 것이 긴요합니다."
 ENG_new_zealands_offer: "뉴질랜드의 제안"
 ENG_new_zealands_offer_desc: "키위 국민은 오랫동안 우리의 굳건한 동맹이었으며, 좋을 때나 나쁠 때나 우리 곁을 지켜 왔습니다. 그들에게 합류를 요청하는 것은 지극히 마땅한 일입니다."
 ENG_fracture_nato_unity: "나토의 결속 분열"
 ENG_fracture_nato_unity_desc: "우리가 오랫동안 나토의 안보 혜택을 누려 온 것은 사실이나, 더 이상은 그렇지 않습니다. 과거의 친구들이 우리 국가를 분열시키고 쪼개는 것만을 바란다는 점을 이해해야 하며, 국민에게도 이를 알려야 합니다."
 ENG_end_eastern_suffering: "동방의 고통 종식"
 ENG_end_eastern_suffering_desc: "러시아가 이끄는 동유럽의 한심한 국가 무리는 느리고 끔찍한 쇠퇴를 겪고 있습니다. 우리가 진출하여 그 지역에 진정한 번영과 질서를 세우는 편이 낫습니다."
 ENG_declare_the_commonwealth: "영연방 선포"
 ENG_declare_the_commonwealth_desc: "이제 영연방의 모든 영토(최소한 중요한 곳들)가 하나의 깃발 아래 우리와 함께하게 되었으니, 영연방 연방이 출범했으며 앞으로도 존속할 것임을 세계에 선포하는 것이 마땅합니다."
 ENG_active_resource_project: "§Y진행 중인 핵심 광물 프로젝트§!"
 ENG_active_productivity_project: "§Y진행 중인 국가 생산성 프로젝트§!"
 ENG_ucl_east_campus: "UCL 이스트 캠퍼스"
 ENG_mechanic_menu_explanation: "권한 이양"
 ENG_devolution_HEADER_TITTLE_LOC: "권한 이양 사안"
 ENG_mechanic_menu_explanation_2: "권한 이양을 통해 구성국 국민에게 일부 권력을 되돌려줄 수 있습니다. 해당 구성국을 클릭하여 관리할 수 있으며, 각 구성국에는 §C의회§!, §R동요§! 수준, §G의존도§! 수준이 있습니다. §G정보§! 버튼 위에 커서를 올리면 자세한 설명을 볼 수 있습니다."
 ENG_parliament_gui_tooltip: "각 구성국에는 고유한 의회가 있습니다. 구성국의 동요 수준에 따라 국민이 독립 찬성파 의원에게 투표할 가능성이 높아지거나 낮아집니다. 독립 찬성파 의원이 일단 당선되면 낙선시키기는 매우 어렵습니다. 독립 찬성파 의원이 과반수가 되면 의존도를 낮추는 법안을 추진하기 시작할 수 있으며, 결국에는 주민투표를 요구할 수도 있습니다.\n\n우리의 예속 지역은 우리에 대한 의견을 가지며, 이는 동요로 나타납니다. 구성국의 동요는 우리가 집권한 정당, 우리가 거부한 법안의 수, 또는 우리가 강제로 의존도를 높였는지 여부에 따라 커질 수 있습니다. 동요는 특정 사건, 결정 또는 중점의 영향을 받을 수 있습니다. 웨스트민스터에 크게 의존하는 구성국은 매달 저절로 진정되지만, 우리를 더 이상 필요로 하지 않는 구성국은 계속해서 분노가 커질 것입니다.\n\n의존도는 구성국이 스스로를 감당할 수 있는 수준을 결정합니다. 의존도가 낮으면 왕국 없이도 충분히 자립할 수 있으므로 더 많은 자유를 요구하기 시작할 수 있습니다. 우리가 겪는 사건과 선택하는 중점에 따라 의존도를 낮추거나 높일 기회가 생길 것입니다.\n\n민족주의, 동요, 자립 비중이 결합되어 독립 압력 점수를 이룹니다. 구성국이 독립 찬성 과반수를 확보하고 압력이 §R60§!을 넘으면 주민투표 운동이 시작됩니다. 이후 주민투표가 실제로 소집되기 전까지 1년 안에 압력을 다시 §G50§! 아래로 낮춰야 합니다. 한 번에 하나의 구성국만 운동을 진행할 수 있으며, 그 후 5년 동안은 다른 구성국이 이어서 진행할 수 없습니다.\n\n북아일랜드 긴장도는 통합주의 개신교도와 공화주의 가톨릭교도 사이의 긴장을 나타냅니다. 우리의 결정이 긴장을 고조시킬 수 있으며, 긴장도가 50%에 도달하면 간헐적으로 폭력 충돌이 발생합니다. 긴장도가 50%를 넘어 계속 상승하면 충돌 발생 빈도가 증가합니다."
 ENG_dependency_gui_tooltip2: "의존도는 구성국이 스스로를 감당할 수 있는 수준을 결정합니다. 의존도가 낮으면 왕국 없이도 충분히 자립할 수 있으므로 더 많은 자유를 요구하기 시작할 수 있습니다. 우리가 겪는 사건과 선택하는 중점에 따라 의존도를 낮추거나 높일 기회가 생길 것입니다."
 ENG_parliament_gui_tooltip2: "각 구성국에는 고유한 의회가 있습니다. 구성국의 동요 수준에 따라 국민이 독립 찬성파 의원에게 투표할 가능성이 높아지거나 낮아집니다. 독립 찬성파 의원이 일단 당선되면 낙선시키기는 매우 어렵습니다. 독립 찬성파 의원이 과반수가 되면 의존도를 낮추는 법안을 추진하기 시작할 수 있으며, 결국에는 주민투표를 요구할 수도 있습니다."
 ENG_agitation_gui_tooltip2: "우리의 예속 지역은 우리에 대한 의견을 가지며, 이는 동요로 나타납니다. 구성국의 동요는 우리가 집권한 정당, 우리가 거부한 법안의 수, 또는 우리가 강제로 의존도를 높였는지 여부에 따라 커질 수 있습니다. 동요는 특정 사건, 결정 또는 중점의 영향을 받을 수 있습니다. 웨스트민스터에 크게 의존하는 구성국은 매달 저절로 진정되지만, 우리를 더 이상 필요로 하지 않는 구성국은 계속해서 분노가 커질 것입니다. 동요는 주민투표 운동이 시작될지를 결정하는 독립 압력 점수에 영향을 줍니다."
 ENG_irish_tension_tooltip: "북아일랜드 긴장도는 통합주의 개신교도와 공화주의 가톨릭교도 사이의 긴장을 나타냅니다. 우리의 결정이 긴장을 고조시킬 수 있으며, 긴장도가 50%에 도달하면 간헐적으로 폭력 충돌이 발생합니다. 긴장도가 50%를 넘어 계속 상승하면 충돌 발생 빈도가 증가합니다."
 ENG_scotland_gui_tooltip: "스코틀랜드\n-------------\n£GFX_click_right §Y우클릭§! 시 동요가 2 감소합니다\n - 활성화되어 있는 동안 세수의 §R5%§!를 지출합니다!\n£GFX_click_left §YShift + 클릭§! 시 동요가 §R10§! 아래로 떨어질 때까지 보조금이 자동으로 갱신됩니다"
 ENG_northern_ireland_tooltip: "북아일랜드\n-------------\n£GFX_click_right §Y우클릭§! 시 동요가 2 감소합니다\n - 활성화되어 있는 동안 세수의 §R5%§!를 지출합니다!\n£GFX_click_left §YShift + 클릭§! 시 동요가 §R10§! 아래로 떨어질 때까지 보조금이 자동으로 갱신됩니다"
 ENG_wales_tooltip: "웨일스\n-------------\n£GFX_click_right §Y우클릭§! 시 동요가 2 감소합니다\n - 활성화되어 있는 동안 세수의 §R5%§!를 지출합니다!\n£GFX_click_left §YShift + 클릭§! 시 동요가 §R10§! 아래로 떨어질 때까지 보조금이 자동으로 갱신됩니다"
 ENG_back_tooltip: "구성국 메뉴로 돌아가기"
 ENG_england_tooltip: "잉글랜드"
