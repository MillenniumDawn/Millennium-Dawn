 SPR_idea_reduced_exports: "수출 감축"
 SPR_idea_reduced_exports_desc: "전략 자원을 군에서 사용할 수 있도록 하기 위해 이들 자재의 수출을 대폭 줄였습니다."
 SPR_idea_the_icmm_1: "ICMM"
