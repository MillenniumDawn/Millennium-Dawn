 UKR_Vilkha: "Develop a new gen MLRS §Y'Vilkha'§!"
 UKR_bureviy: "Develop a new gen MLRS §Y'Bureviy'§!"
 UKR_mi24pu1: "Create a §YMi-24PU1§! Modernization"
 UKR_develop_stuhna_p_atgm: "Develop §YRK-2 'Stuhna-P'§!"
 UKR_develop_stuhna_p_atgm_desc: "The Stugna-P, known by its export version Skif, is a Ukrainian anti-tank guided missile (ATGM) system developed in the early 2010s by the Luch Design Bureau.\nThe Stugna-P is designed to destroy modern armored targets with combined carried or monolithic armor, including explosive reactive armor (ERA).\nStugna-P can attack both stationary and moving targets.\nThey can attack from both long range up to 5 kilometres in the daytime and close range to 100 metres."
 UKR_develop_corsar_atgm: "Develop §YRK-3 'Corsar'§!"
 UKR_develop_corsar_atgm_desc: "The RK-3 Corsar is a Ukrainian light portable anti-tank guided missile developed by Luch State Kyiv Design Bureau.\nThe Corsar is likely to replace Soviet era anti-tank systems such as the 9M113 Konkurs and 9K111 Fagot.\nt is intended to destroy stationary and moving armored targets. It can also be used against emplacements, light-armored objects and helicopters.\nFiring can be carried out from the mount as well as from a trench parapet. A method of guidance is laser beam riding."
 UKR_modernize_stuhna_p_atgm: "Modernize §YRK-2 'Stuhna-P'§!"
 UKR_modernize_stuhna_p_atgm_desc: "We can further modernize the Stugna-P ATGM complex, to better stay in touch with current threats."
 UKR_develop_bulava_atgm: "Develop §Y'Bulava'§!"
 UKR_develop_bulava_atgm_desc: "Future ATGM complex with fire-and-forget capabilities.\nAll information is classified at the moment."
 UKR_develop_stuhna_p_flag: "Completed decision Develop RK-2 Stuhna-P"
 UKR_develop_corsar_flag: "Completed decision Develop RK-3 Corsar"
 UKR_develop_kba27: "Develop KBA-27 self-propelled Artillery"
 UKR_develop_kba27_desc: "The KBA-27 is a Ukrainian 152 mm howitzer derived from the Soviet 2A61 Pat-B. An experimental variant mounted the gun on a PTS-2 amphibious transporter, combining heavy artillery firepower with high mobility and amphibious capabilities. Further development could transform this prototype into a viable self-propelled artillery system."
 UKR_modernize_stuhna_p_flag: "Completed decision Modernize RK-2 Stuhna-P"
 UKR_develop_baryer_s: "Develop §Y'Baryes-S'§!"
 UKR_develop_baryer_s_desc: "The Baryer-S is a Ukrainian anti-tank guided missile (ATGM) system developed by the Luch Design Bureau based on the Shturm-S ATGM.\nThe Baryer-S is designed to destroy modern armored targets with combined carried or monolithic armor, including explosive reactive armor (ERA)."
 UKR_develop_nota_flag: "Completed decision §YDevelop 'Nota'§!"
 UKR_develop_nota: "Object 477A1 Nota is an advanced Soviet experimental main battle tank featuring an unmanned turret, isolated crew compartment and a powerful 152 mm main gun."
 UKR_modernize_nota: "Modernize §YObject 477A1 'Nota'§!"
