 TAI_pc_industry_events.5.t: "VIA C7 and the Low-Power Bet"
 TAI_pc_industry_events.5.d: "The VIA C7 cannot win a direct performance race with the largest processor vendors, but its compact, efficient design may anchor low-power computers and embedded systems. VIA must choose a focused niche, fund a broader CPU program, or license chipsets around external processors."
 TAI_pc_industry_events.5.a: "Own the low-power platform niche"
