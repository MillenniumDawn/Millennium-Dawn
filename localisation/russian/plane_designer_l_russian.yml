 gen_3_light: "Лёгкий самолёт 3-го поколения"
 gen_3_light_desc: "Многоцелевой самолёт, разработанный с учётом технологических достижений и опыта Корейской и Вьетнамской войн. Эти самолёты способны нести ракеты «воздух–земля» и управляемое лазером вооружение, при этом оставаясь пригодными для боёв за пределами визуальной видимости (BVR). Дополнительные улучшения включают системы предупреждения о рельефе, импульсно-доплеровские радиолокационные станции и возможности наведения на цели вне прицела."
 gen_4_light: "Лёгкий самолёт 4-го поколения"
 gen_4_light_desc: "После успеха многоцелевых самолётов третьего поколения конструкция самолётов четвёртого поколения продолжила развиваться благодаря технологическим и инженерным достижениям. Появились системы управления «fly-by-wire», улучшенные соотношения тяги к массе, современная авионика и ранние технологии малой заметности."
 gen_5_light: "Лёгкий самолёт 5-го поколения"
 gen_5_light_desc: "Ключевые достижения в технологиях малой заметности, системах управления C3, умных шлемах, объединении данных и сенсоров и других областях появились в результате разработки самолётов пятого поколения. Эти самолёты стали значительно более малозаметными благодаря дальнейшему совершенствованию технологий стелс, а также значительному прогрессу в материалах, электронике и двигателях."
 gen_6_light: "Лёгкий самолёт 6-го поколения"
 gen_6_light_desc: "Конструкции самолётов шестого поколения представляют собой передовые экспериментальные технологии воздушного боя. Они дорогостоящи в проектировании и производстве и включают новейшие материалы малой заметности, современную авионику, дронов-напарников, высокоточные системы вооружения и многое другое."
