 KYR_immigration: "긍정적 이민"
 migration_central_asia: "중앙아시아 이주 문제"
 migration_central_asia_desc: "이주는 중앙아시아의 평화와 안정을 위협하는 중요한 요인이 되고 있습니다. 경제가 성장하면 지역 내 일자리도 늘어나고, 이는 사람들이 더 나은 삶을 찾아 다른 나라로 떠날 가능성을 낮춥니다."
 KAZ_migration_central_asia_5: "이민 간 카자흐인의 고국 초청"
 KAZ_migration_central_asia_5_desc: "해외의 카자흐인에게 카자흐스탄으로 돌아오도록 적극 초청하기 시작합니다. 이민자 귀환 프로그램과 매력적인 귀환 조건 조성을 통해 이주를 줄이고 디아스포라와의 문화적 유대를 강화할 수 있습니다."
 KAZ_migration_central_asia_4: "카자흐 정체성 보존"
 KAZ_migration_central_asia_4_desc: "이 결정은 해외에 거주하는 카자흐인들의 카자흐 정체성을 보존하고 강화하는 것을 목표로 합니다. 문화 프로그램과 교육 활동을 조직하고 해외 카자흐 공동체를 지원함으로써 카자흐스탄은 이민 유출을 줄이고 동포와의 유대를 유지하고자 합니다."
 KAZ_migration_central_asia_3: "고국에 투자하라"
 KAZ_migration_central_asia_3_desc: "이 결정은 카자흐스탄 각 지역의 발전에 투자하여 지역 주민에게 새로운 일자리와 경제적 기회를 창출하는 것을 뜻합니다. 경제 성장은 카자흐스탄 주민에게 삶과 일에 대한 안정적인 전망을 제공함으로써 이주를 줄일 수 있습니다."
 KAZ_migration_central_asia_2: "교육 및 경력 기회 강화"
 KAZ_migration_central_asia_2_desc: "이 결정은 카자흐스탄의 교육 및 경력 기회를 개선하는 것을 목표로 합니다. 교육 체계를 확대하고 장학금을 제공하며 젊은 전문 인력을 지원함으로써 국가는 청년층을 붙잡고 더 나은 미래 전망을 제공하고자 합니다."
 KAZ_migration_central_asia_1: "이주민의 권리 보호"
 KAZ_migration_central_asia_1_desc: "이 결정은 해외에서 일하는 이주민의 권리와 노동 조건을 개선하는 것을 뜻합니다. 국제 협정을 체결하고 해외 카자흐스탄 국민에게 영사 지원을 제공함으로써 국가는 자국민이 고국 밖에서도 안전하고 안녕하도록 보장하고자 하며, 이는 이민 욕구를 줄일 수 있습니다."
 UZB_migration_central_asia_5: "이민 간 우즈베크인의 고국 초청"
 UZB_migration_central_asia_5_desc: "해외의 우즈베크인에게 우즈베키스탄으로 돌아오도록 적극 초청하기 시작합니다. 이민자 귀환 프로그램과 매력적인 귀환 조건 조성을 통해 이주를 줄이고 디아스포라와의 문화적 유대를 강화할 수 있습니다."
