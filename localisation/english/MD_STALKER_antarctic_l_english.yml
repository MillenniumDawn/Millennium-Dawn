l_english:
 STALKER_polar_artifact_study: "Polar Artifact Study"
 STALKER_polar_artifact_study_desc: "Ship recovered artifacts to our Antarctic station, where its Radiation Laboratory can study them far from the Zone. The Antarctic Treaty bans this work, and observers who visit during the study will find it."
 STALKER_polar_artifact_study_artifacts_tt: "We hold at least §Y5§! artifacts."
 STALKER_polar_artifact_study_lab_tt: "Our Antarctic station runs a working §YRadiation Laboratory§!."
 STALKER_polar_artifact_study_tt: "Spend §Y5§! artifacts.\nFor §Y180§! days: §G+3%§! research speed and §G+15%§! Antarctic station iteration progress.\nTreaty observers who visit the station during the study seize the samples and report illegal research.\nThe study ends early, with no result, if the Radiation Laboratory stops working."
 STALKER_polar_artifact_samples: "Polar Artifact Samples"
 STALKER_polar_artifact_study_bonus: "Polar Artifact Study"
 STALKER_polar_artifacts_returned_tt: "Return §Y3§! artifacts to our stockpile."
 STALKER.190.t: "Cold Samples, Clear Results"
 STALKER.190.d: "Six months in the Antarctic cold slowed the artifacts enough to measure. Our physicists now hold readings no laboratory near the Zone could take. We can put the findings to work in our reactor programme, or ship the surviving samples home."
 STALKER.190.a: "Feed the findings into our reactor research."
 STALKER.190.b: "Bring the surviving samples home."
 STALKER.191.t: "Treaty Observers Find Zone Artifacts in Antarctica"
 STALKER.191.d: "Antarctic Treaty observers inspecting the [FROM.GetAdjective] research station found artifacts from the Zone in its Radiation Laboratory. The samples were seized, and the Treaty has recorded the study as illegal research."
 STALKER.191.a: "Even the ice is not far enough."
