 iraqi_flavor_events.10.t: "El levantamiento chií se extiende por el sur de Irak"
 iraqi_flavor_events.10.d: "Una revuelta a gran escala ha azotado el Irak baazista de Saddam Hussein, marcando el tercer levantamiento de este tipo en los últimos años. Los musulmanes chiítas se han alzado en armas contra el Estado baazista tras las acusaciones de que un conocido clérigo fue asesinado en las calles de Basora.\n\nAumenta la especulación sobre la participación iraní en la revuelta, con rumores que indican que Teherán podría estar detrás del asesinato, lo que ha desencadenado esta última ola de disturbios. Las fuerzas iraquíes están respondiendo con rapidez, desplegando una fuerza abrumadora para aplastar la rebelión. El mundo observa ahora con anticipación la respuesta de Irán y sus posibles consecuencias."
 iraqi_flavor_events.10.a: "El costo de la guerra"
 iraqi_flavor_events.11.t: "La bandera negra se alza sobre Irak"
 iraqi_flavor_events.11.t1: "Emergence of an Islamic State in Iraq"
 iraqi_flavor_events.11.d: "[ISI.GetLeader] today declared the formation of Al-Qaeda's official branch in Iraq, pledging the allegiance of Jama'at al-Tawhid wal-Jihad (Congregation of Monotheism and Jihad) to Osama bin Laden's global terror network of Al-Qaeda. Vowing to wage unyielding jihad against [PER.GetAdjective]-backed groups and Ba'athist Iraq, the organization, composed of foreign fighters and [IRQ.GetAdjective] insurgents, seeks to establish a caliphate, followed by a wave of jihad that would extend to Iraq's secular neighbours, before ending in a clash with Israel. The group has already launched several attacks against the IRGC, Shia militias, and the central Iraqi government. This comes as mass bombings rock the city of Baghdad as well as major cities across Iraq."
 iraqi_flavor_events.11.d1: "[ISI.GetLeader] ha declarado el establecimiento del Estado Islámico de Irak. Anunció la unificación de varias facciones yihadistas bajo su bandera, incluyendo Al-Qaeda en Irak. La organización se ha comprometido a desmantelar el Irak baazista de [IRQ.GetLeader] y a librar una yihad implacable contra las milicias respaldadas por [PER.GetAdjective] y la Fuerza de la Guardia Revolucionaria Iraní. Su objetivo final es establecer un califato islámico en todo Oriente Medio. El grupo ha intensificado su campaña de atentados con bombas, asesinatos y ataques en Bagdad y otras ciudades importantes de Irak, mientras el país se sume en el caos."
 iraqi_flavor_events.11.a: "¿Está perdido Irak?"
 iraqi_flavor_events.12.t: "Golpe de Estado respaldado por Irán en Irak"
 iraqi_flavor_events.12.d: "Hace apenas unos instantes, una coalición de líderes de milicias chiítas respaldada por [PER.GetNameWithFlag] lanzó un golpe de Estado contra el gobierno baazista. Declararon la suspensión de la constitución iraquí y el establecimiento del gobierno chiíta. El nuevo líder de [IRQ.GetNameWithFlag], [IRQ.GetLeader], anunció que sus fuerzas acababan de asaltar la residencia de Saddam Hussein y se habían apoderado de su cuerpo en una operación selectiva. En una declaración vehemente, proclamó: \"¡No descansaremos hasta erradicar el baazismo de esta tierra, que pertenece legítimamente a todos!\". Esto ocurre mientras el caos estalla en Bagdad, donde las milicias chiítas han comenzado a asesinar a funcionarios baazistas de alto perfil. Mientras tanto, el Líder Supremo de [PER.GetNameWithFlag], [PER.GetLeader], ha expresado su pleno apoyo al nuevo gobierno bajo [IRQ.GetLeader]."
 iraqi_flavor_events.12.a: "¿El fin de la tiranía o simplemente la página siguiente?"
 iraqi_flavor_events.13.t: "Los leales a Baath toman las armas"
 iraqi_flavor_events.13.d: "Remanentes de leales al partido Baaz han lanzado una rebelión a gran escala en el noroeste de [IRQ.GetNameWithFlag], tomando varias ciudades clave en un intento por restaurar el poder del partido Baaz y rechazar al actual gobierno chií. [IRQ.GetLeader] ha prometido aplastar el levantamiento, pero el resultado sigue siendo incierto, ya que la violencia y la agitación se extienden por todo el gobierno, ya de por sí inestable. Mientras tanto, [IRS.GetLeader] prepara una ofensiva para retomar la capital, Bagdad."
 iraqi_flavor_events.13.a1: "El costo de la guerra"
 iraqi_flavor_events.13.a2: "Estamparlos"
 IRQ_leave_socialist_union: "Salir de la Unión Socialista con [PER.GetFlag] Irán"
 iraq_md.317.t: "Garner reemplazado por Bremer"
 iraq_md.317.d: "Under the directive of the U.S. government, Jay Garner has been replaced with Paul Bremer. Allegations arose on what Garner's plans with Iraq were, as it was believed that he was giving too much control to the Iraqis themselves rather than going through the American forces. This move concludes Garner's short venture in Iraq, and the start of a new one."
 iraq_md.317.a: "De acuerdo"
 iraq_md.318.t: ""
 iraq_md.318.d: ""
 iraq_md.318.a: ""
 iraqi_MNF.2.t: "Cataratas de Bagdad"
 iraqi_MNF.2.d: "La honorable ciudad de Bagdad ha caído ante las fuerzas de ocupación, y edificios gubernamentales, estatuas y carteles están siendo destruidos en este preciso instante. Varios altos funcionarios han sido capturados, asesinados o desaparecidos. Nuestros generales nos dicen que luchar es inútil y que corremos el riesgo de sacrificar más vidas si optamos por continuar nuestra lucha armada contra los enemigos. Pero ¿qué otra opción nos queda? Han llegado a nuestra tierra, han atacado a nuestro pueblo y han violado nuestra soberanía."
 iraqi_MNF.2.a: "No tenemos más opción que aceptar"
 iraqi_MNF.2.b: "¡Rendirse no está en nuestro vocabulario!"
 iraqi_MNF.3.t: "Estados Unidos inicia operaciones en Irak"
 iraqi_MNF.3.d: "Estados Unidos se ha declarado en estado de guerra contra Irak, y les prometimos a los estadounidenses que estaríamos ahí, junto a ellos, para combatir a cualquier enemigo. Hoy, podemos cumplir esa promesa enviando tropas a la Fuerza Multinacional en Irak."
 iraqi_MNF.3.a: "Adelante"
 iraqi_MNF.3.b: "Hemos cambiado de opinión..."
 iraqi_MNF.4.t: "El gobierno iraquí gobernante solicita nuestra retirada"
 iraqi_MNF.4.d: "La autoridad gobernante en Irak ha solicitado formalmente la retirada de nuestras fuerzas de Irak, incluidas todas las zonas de ocupación. Si bien la carta parecía bastante amistosa, ciertamente no estaba exenta de sutiles amenazas. «Negarse a abandonar los territorios soberanos iraquíes podría tener consecuencias imprevistas», decía la carta, firmada por [IRQ.GetLeader]."
 iraqi_MNF.4.a: "Nosotros nos iremos"
 iraqi_MNF.4.b: "Nos iremos...con una condición"
 iraqi_MNF.4.c: "¡Entonces tendrás que enterrarnos aquí mismo!"
 iraqi_MNF.5.t: "[FROM.GetName] Se retira incondicionalmente"
 iraqi_MNF.5.d: "El gobierno de [FROM.GetAdjective] ha decidido cumplir con nuestra solicitud y desalojar sus territorios ocupados con efecto inmediato."
 iraqi_MNF.5.a: "Bueno"
 iraqi_MNF.6.t: "[FROM.GetName] Se retira con concesiones petroleras"
 iraqi_MNF.6.d: "El gobierno de [FROM.GetAdjective] ha decidido acceder a nuestra solicitud y desalojar sus territorios ocupados con efecto inmediato. Sin embargo, solicitan derechos petroleros como parte de sus condiciones de salida."
 iraqi_MNF.6.a: "Está Bien, Está Bien"
 iraqi_MNF.7.t: "[FROM.GetName] se niega a desocupar"
 iraqi_MNF.7.d: "Those [FROM.GetAdjective] vermin have refused to let go of their occupation zones, and are further entrenching themselves in our territory. If they don't understand the language of diplomacy, then they'll understand the language of our force."
 iraqi_MNF.7.a: "Lamentable"
 iraqi_MNF.8.t: "Vence el contrato de derechos petroleros iraquíes"
 iraqi_MNF.8.d: "Nuestro contrato para el petróleo iraquí ha expirado hoy y, como resultado, ya no controlamos el petróleo en las regiones que alguna vez ocupamos."
 iraqi_MNF.8.a: "Como se acordó"
 iraqi_MNF.9.t: "[FROM.GetName] Vencimiento del contrato petrolero"
 iraqi_MNF.9.d: "[FROM.GetName] will no longer control the flow of oil in the regions they once occupied, with exports and oil handling being returned to Iraqi national control once more."
 iraqi_MNF.9.a: "Bueno"
 iraqi_MNF.10.t: "¡Saddam Hussein capturado!"
 iraqi_MNF.10.d: "After weeks of being on the run, Saddam Hussein was finally captured by our forces in a discreet hiding location. He has been transferred to Abu Ghraib correctional facility where he is currently being evaluated. His fate will soon be decided by the appropriate Iraqi authorities."
 iraqi_MNF.10.a: "Damas y caballeros, lo tenemos."
 iraqi_MNF.11.t: "¡Qusay Hussein capturado!"
 iraqi_MNF.11.d: "After weeks of being on the run, Qusay Hussein was finally captured by our forces in a discreet hiding location. He has been transferred to Abu Ghraib correctional facility where he is currently being evaluated. His fate will soon be decided by the appropriate Iraqi authorities."
 iraqi_MNF.11.a: "Bueno"
