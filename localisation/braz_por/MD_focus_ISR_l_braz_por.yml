 israel_economy.22.d: "A cooperação comercial indo-israelense aumentou e as relações bilaterais melhoraram."
 israel_economy.22.a: "Ótimo!"
 israel_economy.23.t: "Israel ajuda com a questão da água!"
 israel_economy.23.d: "Israel enviou seus especialistas para ajudar nosso país com os problemas de água e compartilhar sua experiência e tecnologia."
