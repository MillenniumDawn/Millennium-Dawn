 FRA_dassault_aviation_aircraft_manufacturer: "Dassault Aviation"
 FRA_naval_group_naval_manufacturer: "Naval Group"
 FRA_naval_group_naval_manufacturer_trait: "Scorpène Stealth Submarine Programme"
 FRA_airbus_manufacturer: "Airbus Group"
 FRA_airbus_manufacturer_trait: "A400M & MRTT Strategic Lift"
 FRA_mbda_manufacturer_trait: "Aster & MICA Missile Pedigree"
 FRA_dcn_manufacturer: "Direction des Constructions Navales"
 FRA_eurocopter_manufacturer: "Eurocopter"
 FRA_thales_manufacturer: "Thales"
 FRA_panhard_manufacturer: "Panhard"
 FRA_knds_manufacturer: "Krauss-Maffei Wegmann Nexter Defense Systems"
 FRA_knds_manufacturer_trait: "MGCS Convergence Programme"
 FRA_knds_franco_german_synthesis: "Franco-German Synthesis"
 FRA_knds_european_champion: "European Industrial Champion"
 FRA_knds_fg_partnership: "Franco-German Partnership"
 FRA_knds_fg_partnership_desc: "The 2015 KANT holding unified Krauss-Maffei Wegmann and Nexter under 50-50 Franco-German ownership, pooling two national champions into a single industrial base."
 FRA_knds_kant_holding: "KANT Holding Integration"
 FRA_knds_kant_holding_desc: "Cross-border engineering teams, harmonised procurement, and shared administrative services reduce the overhead of running two legacy defence houses in parallel."
 FRA_knds_embt: "EMBT Demonstrator"
 FRA_knds_embt_desc: "The Enhanced Main Battle Tank mates a Leclerc turret to a Leopard 2 hull, previewing the hybrid design philosophy of the future Main Ground Combat System."
 FRA_knds_joint_rnd: "Joint R&D Pool"
 FRA_knds_joint_rnd_desc: "Combined Franco-German research budgets accelerate parallel tracks in armour, electronics, and energetic materials that neither firm could pursue alone."
 FRA_knds_mgcs_modular: "MGCS Modular Architecture"
 FRA_knds_mgcs_modular_desc: "The Main Ground Combat System is conceived as a multi-platform family with swappable modules for protection, firepower, and electronic warfare, replacing Leopard 2 and Leclerc by the 2040s."
 FRA_knds_mgcs_integration: "MGCS Systems Integration"
 FRA_knds_mgcs_integration_desc: "MGCS integrates a shared digital backbone, SCORPION-derived battle management, and common sensor fusion across Franco-German armoured formations."
 FRA_knds_turret_leadership: "Turret Leadership (Nexter)"
 FRA_knds_turret_leadership_desc: "Turret design, autoloader engineering, and gun fabrication consolidate under the former Nexter teams, building on Leclerc-era firepower expertise."
 FRA_knds_hull_leadership: "Hull Leadership (KMW)"
 FRA_knds_hull_leadership_desc: "Hull, powerpack, and running-gear development consolidate under the former KMW teams, leveraging Leopard 2 and Puma structural experience."
 FRA_knds_nato_standardisation: "NATO Artillery Standardisation"
 FRA_knds_nato_standardisation_desc: "KNDS supplies the NATO Support and Procurement Agency with STANAG-compliant 155mm ammunition, positioning the merged entity as Europe's default artillery vendor."
 FRA_knds_rch155: "RCH-155 Remote Howitzer"
 FRA_knds_rch155_desc: "The RCH-155 mounts an automated 155mm turret on a Boxer chassis, firing on the move at ranges of up to 54 kilometres with a two-person crew."
 FRA_knds_leopard_sustainment: "Leopard 2 Fleet Sustainment"
 FRA_knds_leopard_sustainment_desc: "Unified logistics, spare-part production, and refurbishment of the Leopard 2 fleet fall under the merged entity, giving KNDS a decades-long maintenance revenue stream across Europe."
 FRA_knds_boxer_puma: "Boxer & Puma Stewardship"
 FRA_knds_boxer_puma_desc: "The Boxer modular APC and Puma IFV remain KMW-led programmes, now backed by the combined industrial weight of KNDS."
 FRA_knds_bonus_katana: "BONUS & KATANA Ammunition"
 FRA_knds_bonus_katana_desc: "The sensor-fuzed BONUS and guided KATANA rounds expand KNDS's precision artillery portfolio, now marketed as a single pan-European product line."
 FRA_knds_export_leadership: "Export Leadership"
 FRA_knds_export_leadership_desc: "An aggressive export posture courts buyers across the Gulf, South-East Asia, and Eastern Europe with packaged armour, artillery, and ammunition bundles."
 FRA_knds_strategic_autonomy: "Strategic Autonomy"
 FRA_knds_strategic_autonomy_desc: "A domestic-first doctrine reserves the best production slots and sensitive technologies for Franco-German forces, reinforcing European strategic autonomy over open-market sales."
 FRA_arquus_manufacturer: "Arquus Defense"

