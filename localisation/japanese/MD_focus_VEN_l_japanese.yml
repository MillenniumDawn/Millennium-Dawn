 gca.3.t: "Rejected the Invitation"
 gca.3.d: "The invitation to join the Gran Colombia alliance has been declined. Bolívar's dream of a united South America will have to wait."
 gca.3.a: "Their loss."
 venezuela.2.d1: "The National Electoral Council has announced the final result of the recall referendum. A majority of voters rejected the proposal to remove [VEN.GetLeader] from office, allowing the President to serve the remainder of the current term. Government supporters have taken to the streets in celebration, while the opposition has been forced to accept that its campaign failed at the ballot box."
 venezuela.2.d2: "The National Electoral Council has announced the final result of the recall referendum. A majority of voters supported the proposal to remove [VEN.GetLeader] from office. The presidency will be vacated and a new election must now be organized to determine who will lead Venezuela through the remainder of the term."
