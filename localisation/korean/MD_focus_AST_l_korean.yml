 AST_hollywood_here_event.1.t: "극장에서"
 AST_hollywood_here_event.1.d: "연방 수립 이후 오스트레일리아 문화가 밀려오고 밀려가는 동안, 대다수 오스트레일리아 사람들은 큰 성취를 이룬 사람을 시기하는 나쁜 버릇을 키워 왔습니다. 정치인과 유명인 모두 대중이 그들의 몰락을 응원하기 시작할까 봐 지나치게 성공했거나 오만해 보이지 않으려고 최선을 다합니다. 이른바 '키 큰 양귀비 증후군'입니다. \n\n모두가 약자를 사랑하고, 아무도 우두머리를 좋아하지 않습니다. 단 한 사람만 빼고 말입니다. 킴이 그와 함께 무대에 오르자 관중은 평소보다 훨씬 크게 환호했습니다. 평소 킴은 어느 방에서든 가장 키가 큰 사람이었지만, 휴 잭맨 옆에 서 있자니 갑자기 무척 작아진 기분이 들었습니다. 휴와 최근 폭스 스튜디오 제작 영화에 출연한 몇몇 스타가 정부의 최근 투자를 축하하고 영화를 홍보하기 위해 모였습니다. \n\n언론과 온 나라가 이 일로 열광했지만, 킴은 슈퍼히어로 열풍에는 한심할 정도로 어두웠습니다. 의회에서 틈이 나면 그는 대개 <더 체이서> 최신 방송분을 챙겨 보려 했고, 이번 상황에서도 군중 속으로 사라지는 편이 더없이 좋았지만, 팝콘만큼은 챙기고 나서였습니다."
 AST_hollywood_here_event.1.a: "평온은 좀 어떠신가?"
 health_revolution_beazley.1.t: "공식 방문"
 health_revolution_beazley.1.d: "병원 문이 활짝 열리자, 비즐리는 모세의 대역이라도 되는 양 기자 떼를 거느리고 걸어 들어왔습니다. 직원들은 이 중대한 방문을 맞아 모두 모여 있었고, 총리는 사진 촬영을 위해 서둘러 그들 모두와 인사를 나눴습니다. 그러나 미소 이면에서는 이를 악물고 있다는 느낌을 받을 수 있었습니다. \n\n지난 선거를 앞두고 비즐리가 병원들에 따져 물을 것이 있다는 사실은 분명했습니다. 병원들은 지난 노동당 정부가 세운 기준을 줄곧 충족하지 못했을 뿐만 아니라, 얼마 전에는 그의 딸이 공립 병원 문 앞에서 진료를 거부당해 시내 반대편의 다른 사립 병원까지 가야 했던 일도 있었습니다. 진료비를 낼 형편은 되었지만, 그렇다고 해서 그때부터 이 문제를 선거 운동의 중심에 놓은 것을 막지는 못했습니다. \n\n다행히 유권자들은 설득되었습니다. 이미 의료 위기가 한창이었고 국민이 제도를 고쳐 달라고 사실상 애원하던 상황이었다는 점도 도움이 되었습니다. 그렇게 해서 그의 거대한 구상을 위한 무대가 마련되었습니다."
 health_revolution_beazley.1.a: "때로 변화는 쇠망치처럼 찾아온다."
 AST_christmas_island_saga.1.t: "태평양의 절망"
 AST_christmas_island_saga.1.d: "비즐리가 언덕을 올라 크리스마스섬 수용 센터로 향하는 동안, 가슴속에서 가라앉는 듯한 불길한 느낌이 커져 갔습니다. 도착 전에 받은 브리핑에는 직원들의 학대 보고, 부적절한 위생 기준 등 오스트레일리아를 인권 침해국으로 비치게 할 모든 내용이 담겨 있었습니다. 더는 못 본 체할 수 없는 일이었습니다. \n\n취재진을 줄줄이 달고 옆문으로 들어가면서도, 그는 카메라에 현지 주민들이 잡히지 않도록 신경 썼습니다. 주민들은 자기 고향이 감옥 섬으로 바뀌었다는 사실을 규탄할 기회라면 무엇이든 붙잡았을 것이기 때문입니다. 그럼에도 안쪽 철조망 너머에서는 수척한 얼굴들이 줄지어 그와 취재진을 응시했습니다. 일부는 화가 난 표정이었습니다. 몇몇은 손에 돌을 쥐고 있기까지 해서, 총리 주위를 맴돌던 이미 초조한 경호팀의 신경을 건드렸습니다. \n\n안내자는 약 1500명의 난민 신청자가 안에 수용되어 있다고 설명했습니다. 권장 수용 인원보다 약 300명이 많은 숫자였습니다. 접수 구역에 들어서자 비즐리는 곧바로 끈적한 습기를 느꼈습니다. 센터 전역의 에어컨이 고장 난 탓이었고, 그것은 최근 폭동의 결과였습니다. 부서진 벤치와 유리 파편이 아직도 바닥 곳곳을 뒤덮고 있었습니다. \n\n싸움이 벌어졌던 중앙 마당에 이르렀을 때 비즐리는 얼어붙었습니다. 한 여성이 아기를 안고 탁자 하나에 앉아 있었습니다. 그녀가 아기를 흔들며 몸을 웅크린 채 지친 듯 울부짖었습니다. 동행하던 경비병들이 재빨리 달려갔습니다. 총리에게는 이 섬에 아이들이 있다는 사실이 어쩐지 충격으로 다가왔고, 그가 경비병에게 묻자 취재진 사이에서 몇몇 탄식이 새어 나왔습니다. 200명이 넘었고, 그중 37명은 보호자 없이 혼자였습니다. \n\n여성이 다시 울부짖기 시작하자, 비즐리는 이만하면 충분히 보았다고 판단했습니다."
 AST_christmas_island_saga.1.a: "여기서 나가자."
 flexible_foreign_policy_ast: "유연한 외교 정책"
 flexible_foreign_policy_ast_desc: "우리는 안정과 자유 시장을 우선시하는 동시에 이웃 나라들과 굳건한 관계를 유지할 수 있어야 합니다. 궁지에 몰리더라도 현상을 유지할 수 있을 만큼 유연함을 잃지 않아야 합니다. \n\n§W--------------§!\n킴 비즐리가 총리가 아니게 되면 이 국가 정신은 §R제거§!됩니다."
 increased_medical_wages_ast: "의료 인력 임금 인상"
 national_healthcare_reforms: "국가 보건 의료 개혁"
 national_healthcare_reforms_desc: "개혁이 계속 시행됨에 따라 오스트레일리아 국민은 의료의 질과 접근성이 높아지는 것을 체감하게 됩니다."
 national_healthcare_reforms_5: "§2공정 의료법§!"
 national_healthcare_reforms_5_desc: "전국에서 필요한 모든 사람에게 보편적인 의료 접근성과 의료 서비스를 제공하는, 보건 의료 개혁을 아우르는 종합 패키지입니다."
