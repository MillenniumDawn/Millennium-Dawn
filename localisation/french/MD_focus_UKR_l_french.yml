 UKR_develop_t84u: "Rechercher le T-84U 'Oplot'"
 UKR_develop_t84u_desc: "Le T-84U 'Oplot' est un char de combat principal ukrainien de troisième génération, développé par le bureau d'études Morozov de Kharkiv sur la base du char T-84.\nLe char a reçu une nouvelle tourelle soudée avec un toit monobloc, offrant une plus grande résistance.\nGrâce à la forme simplifiée de la tourelle, un blindage multicouche a pu y être intégré avec succès et son volume interne a été augmenté.\nUne protection dynamique de 3ème génération 'Nizh' a été placée sur la partie frontale de la tourelle.\nIl est équipé de protections dynamiques et actives ukrainiennes et de dispositifs de visée étrangers."
 UKR_develop_yatahan: "Rechercher le T-84-120 'Yatahan'"
 UKR_develop_yatahan_desc: "Le T-84-120 'Yatahan' est une version du char T-84U 'Oplot' dotée d'un canon de 120 mm adapté aux normes de l'OTAN au lieu du canon typique de 125 mm.\nLe char possède un canon KBM2 de 120 mm utilisant des munitions de calibre OTAN.\nLe chargeur automatique à carrousel est situé à l'arrière de la tourelle.\nIl est possible d'y installer le nouveau canon de 140 mm 'Bahira'.\nIl est assemblé à partir de composants ukrainiens tout en étant compatible avec des pièces étrangères."
 UKR_develop_bahira: "Rechercher le T-84-140 'Bahira'"
 UKR_develop_bahira_desc: "Le T-84-140 'Bahira' est une version proposée du char T-84-120 'Yatahan' qui serait équipée d'un canon de 140 mm 'Bahira', développé par le bureau d'études de Kharkiv O. O. Morozov.\nLe chargeur automatique à carrousel est situé dans la partie arrière de la tourelle.\nIl est assemblé à partir de composants de production ukrainienne, bien qu'il soit entièrement compatible avec des composants de fabrication étrangère."
 UKR_develop_bm_oplot: "Rechercher le T-84 'BM Oplot'"
 UKR_develop_bm_oplot_desc: "Le T-84 'BM Oplot' est la version la plus récente et la plus sophistiquée du char de combat principal T-84U 'Oplot', développée par le bureau d'études de Kharkiv O. O. Morozov.\nSes caractéristiques distinctives incluent, entre autres, le montage d'un blindage plus avancé et de nouveaux systèmes de contre-mesures électroniques.\nUne caractéristique visible est le nouveau viseur panoramique de char PNK-6."
 UKR_develop_bastion: "Rechercher le T-84 'Bastion'"
 UKR_develop_bastion_desc: "Le T-84 'Bastion' est un programme de modernisation annoncé selon lequel le char sera débarrassé de ses pièces de fabrication russe.\nLa version T-84 'BM Oplot', adoptée en 2009, possédait un certain nombre de composants et de matériaux d'origine russe : composants individuels d'équipement électrique, composants de blocs et de systèmes.\nIl a été rapporté qu'ils sont relativement peu nombreux, mais qu'ils doivent tous être complètement remplacés.\nIl était prévu que la base des éléments ne se contente pas de supprimer les composants russes, mais soit également considérablement modernisée."
 UKR_develop_t84u_flag: " Décision terminée §YRechercher le T-84U 'Oplot'§!"
 UKR_develop_t84_yatahan_flag: " Décision terminée §YRechercher le T-84-120 'Yatahan'§!"
 UKR_develop_bm_oplot_flag: " Décision terminée §YRechercher le T-84 'BM Oplot'§!"
 UKR_develop_donets_spaa: "Développer le 'Donets'"
 UKR_develop_donets_spaa_desc: "Le 'Donets' est un complexe mobile d'artillerie et de missiles antiaériens développé par l'usine de chars Malyshev à Kharkiv, principalement destiné à l'exportation.\nLe 'Donets' est une combinaison d'une tourelle modernisée du ZSU-23-4 'Shilka' soviétique et d'un châssis de char de combat T-80UD/T-84.\nSur les côtés de la tourelle sont installés deux conteneurs de transport et de lancement jumelés avec des missiles du système de défense aérienne 'Strela-10M'.\nLes missiles, dotés d'un système d'autodirecteur passif autonome, sont capables d'atteindre des cibles aériennes à une distance allant jusqu'à 4 500 m et à une altitude de 3 500 m."
