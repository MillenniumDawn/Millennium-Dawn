l_korean:
 fiji_influence_defense_through_chaos: "혼돈으로 인한 국방 강화"
 fiji_influence_defense_through_chaos_desc: "피지는 1970년대부터 독립해 있으나, 안타깝게도 독립은 우리가 바란 영광과 평화가 아니었습니다. 민간과 군의 쿠데타, 만연한 민족 긴장으로 인해 나라는 세계 대부분에 비해 사실상 멈춰 있었습니다. 그러나 그 혼란과 함께 일종의 자연적 장벽이 생겼는데, 외국들은 그러한 혼란 때문에 이렇게 작은 지역에서 자산을 잃을까 지나치게 경계하기 때문입니다. 그 덕분에 외국의 영향력에 대한 국가 방어력이 예상보다 높습니다. 확실히 양날의 검이지만, 당분간은 우리에게 유리하게 작용합니다."
 fiji_militarized_society: "군사화된 사회"
 fiji_militarized_society_desc: "2000년 쿠데타의 혼란과 폭력은 국민에게 상처를 남겼습니다. 그 상처는 증오와 자책입니다. 이 상처와 함께 새로운 세대의 물결이 군에 입대하였고, 이로써 군사정권이라는 지도 형태의 탄생과 인기가 뒷받침되었습니다. 이는 군이 곧 사회이고 사회가 곧 군인 결의와 의무의 길로 이어졌습니다."
 fiji_society_of_the_elected_king: "선출된 왕의 사회"
 fiji_society_of_the_elected_king_desc: "무력의 과시와 나라, 그 역사를 지킨다는 근본적 책무, 그리고 정당한 방식으로 법과 질서를 유지하겠다는 약속과 함께, 많은 이들이 수바 왕가가 등장한 극히 희미한 빛을 보았습니다. 피지 국민이 받은 충격은 독립 이후 어떤 민간 정부도 이루지 못한 인상을 남겼습니다. 그래서 많은 이들이 지지를 표하고, 완전히 동의하지는 않더라도 새 체제와 함께 일하고자 합니다."
 fiji_ostracized_commonwealth_member: "배척당한 영연방 회원국"
 fiji_ostracized_commonwealth_member_desc: "우리나라의 혼란은 우리를 나머지 영연방과 긴장된 처지에 놓이게 했습니다. 이것이 국제적으로 우리에게 주는 추가적 힘은 누리고 있지만, 우리 내부 상황의 과열된 성격이 외국 회원국들에게 미치는 영향 때문에 현실 전체를 보지는 못하고 있습니다. 그래도 얻을 수 있는 것은 얻어 두겠습니다."
 fiji_foreign_scientist_imports: "외국 과학자 영입"
 fiji_foreign_scientist_imports_desc: "몇 가지 핵심 유인책이 있다면 예산과 더불어 이를테면 본국에서 떠나는 영구적인 휴가를 약속하며 과학적 두뇌들을 피지로 데려올 수 있습니다."
 fiji_pacific_exchange_and_investment_society: "P.I.E.S. 위원회"
 fiji_pacific_exchange_and_investment_society_desc: "태평양 투자 교류 협회는 사교 단체이자 대외 관계 집단입니다. 지역 컨트리클럽 같은 모습으로 위장하여, 이 일종의 협회를 투자자를 끌어들이고 세계라는 파이의 작은 조각에 우리만의 흔적을 수출하는 수단으로 삼고 있습니다."
 fiji_depoliticized_military: "탈정치화된 군"
 fiji_depoliticized_military_desc: "군과의 위태로운 공방 끝에 군을 민간 정치 조직과 분리해 둔다는 합의가 수립되었습니다. 단순하지만 확고한 이해로서, 이는 나중에 피지를 작지만 지역 강국으로 투사하기 위한 개혁의 문을 열 수도 있습니다."
 fiji_cohesive_integrations_act: "결속 통합법"
 fiji_cohesive_integrations_act_desc: "우리는 우리를 둘러싼 더 넓은 세계를 배우고자 하며, 동료 인간들과 더 긴밀한 유대를 추구합니다. 우리 국민, 그리고 더 나은 삶을 원하는 이들을 위해 지평을 넓히고자 합니다."
 fiji_independence_sustainment_act: "독립 유지법"
 fiji_independence_sustainment_act_desc: "미국과 중동의 선례를 따라 우리만의 독립 정신을 만들고자 합니다. 우리나라가 세계의 책략에 휩쓸리더라도 우리는 결국 역경을 이겨낼 것이기 때문입니다."
 fiji_importing_ideas_exporting_ideals: "사상을 들여오고 이상을 내보내다"
 fiji_importing_ideas_exporting_ideals_desc: "우리 섬은 작지만 야망은 큽니다. 세계를 근본적으로 바꾸지는 못하더라도 국제 정세라는 퍼즐에서 중요한 한 조각이 될 수는 있습니다. 우리의 연구개발은 효율적이고 집중적일 것이며, 작은 단위로 새로운 영역을 더 빠르게 모색할 수 있게 해 줄 것입니다. 이는 우리나라가 외국 열강에게 큰 매력으로 비치게 할 것입니다."
 fiji_pieces_for_the_peace: "평화를 위한 조각"
 fiji_pieces_for_the_peace-desc: "새로 얻은 안정 덕분에 이제 더 넓은 세계의 이들과 도움과 기회를 더 잘 모색할 수 있습니다. 아직 갈 길이 멀지만, 그럼에도 한 걸음 크게 도약했다고 말해도 부족하지 않습니다."
 fiji_the_fijian_dream: "피지안 드림"
 fiji_the_fijian_dream_desc: "저에게는 꿈이 있습니다. 사회에서 버려지고, 멸시받고, 철저히 외면당한 이들이, 그들이 당당히 서서 위를 올려다볼 수 있고, 이것은 끝이 아니라 새로운 시작이라고 말할 수 있는 꿈입니다. 이는 이룰 수 있고 이룰 것이며, 피지 깃발 아래 서는 이들의 미래가 될 것입니다."
 fiji_building_tall_within_something_small: "작은 곳에 높이 짓다"
 fiji_building_tall_within_something_small_desc: "고층 건축법은 맥락을 모르는 사람에게는 꽤 오해를 불러일으킵니다. 이 법안은 우리 국민이 익숙해지고 적응해야 하는 기본 형태의 자동화를 의무화합니다. 이 원칙을 이해하면 더 작은 면적에 많이 지을 수 있고, 이로써 우리 섬은 더 효율적이고 세계 무대에서 더 경쟁력을 갖추게 됩니다."
 fiji_new_foreign_image: "새로운 대외 이미지"
 fiji_new_foreign_image_desc: "우리 국민이 끊임없이 싸우거나 도망치거나 집을 잃지 않게 되자 주변의 더 넓은 세계가 감탄의 시선을 보내기 시작했습니다. 우리 섬은 지난 몇 년간 진정한 변화를 겪었으며, 진정한 노력에는 진정한 결과가 따릅니다."
 fiji_foriegn_advisory_board: "외국 자문 위원회"
 fiji_foriegn_advisory_board_desc: "FAB, 즉 외국 자문 위원회는 우리나라가 올바른 길에 오르도록 강화하고 돕는 민간 및 군사 고문단입니다. 이것이 외부 세력으로부터의 우리나라의 독립을 훼손하지 않을지 의문을 품는 이들이 많을 것입니다. 우리가 바로 그 우려를 미리 생각했으니 안심하십시오. 이 외국 고문들은 실제로 우리나라의 새로운 시민이 될 것입니다. 정부 유인책을 통해 이들을 본국으로부터 사실상 빼내 오면, 외부로부터의 영향은 거의 없는 채로 우리의 내부를 강화할 수 있습니다."
 fiji_national_rotc_program: "국가 ROTC 계획"
 fiji_national_rotc_program_desc: "나라의 교육 안에 국가 예비역 장교 훈련단 계획을 세움으로써 우리나라 미래 세대에게 단결, 리더십, 혁신, 팀워크를 가르칠 수 있을 것입니다. 국가 안정과 우리 국민의 기풍과 정신 전반에 미치는 영향은 엄청날 것입니다."
 fiji_expanded_ministry_of_science: "확대된 과학부"
 fiji_expanded_ministry_of_science_desc: "기술 개발을 우선시하면 민간과 군사 활용 전반에 걸쳐 수많은 진보를 일굴 수 있습니다. 따라서 비용에도 불구하고 우리나라의 미래를 진정으로 모색하려면 우리의 전반적인 위상을 높이려 노력해야 합니다."
 fiji_citizen_soldiers_amendment: "시민 군인 수정안"
 fiji_citizen_soldiers_amendment_desc: "우리는 군대를 가진 국가가 아니라, 국가를 가진 군대입니다. 과거의 민족주의 사상은 늘 악의적인 자들 등에 의해 개인적 목표와 야망을 이루는 데 악용되었습니다. 이제 더는 아닙니다. 헌법적 포고를 통해 피지 민족주의란 무엇이고, 피지인이 된다는 것이 무엇이며, 그러한 삶을 사는 것에 자부심을 느끼며 어떻게 진정으로 살아갈 수 있는지를 확립합니다."
 fiji_fijian_general_staff: "피지 참모본부"
 fiji_fijian_general_staff_desc: "군사 의회는 본질적으로 하나의 거대한 참모본부입니다. 정부와 군 업무를 하나의 통일된 지휘 계통으로 섞으면 군과 민간 양쪽의 필요를 어느 쪽도 꿈꾸지 못할 속도로 계획하고 조율하여 파악하고 대처할 수 있습니다. 그러나 이러한 권력 집중에 둘러싸이면 시야를 잃을 수 있으므로, 이 참모본부가 맡는 역할을 의식해야 합니다."
 fiji_research_institute_of_fiji: "피지 연구소"
 fiji_royal_engineers_program: "왕립 공병 계획"
 fiji_royal_engineers_program_desc: "민간 노동력을 정부, 더 구체적으로는 군 관련 사업에 접목하는 이 제한적인 혼합 계획은 쌓아 올릴 토대입니다. 이는 모든 것을 잃는다는 생각이 많은 이들의 정신과 판단을 흔들 수 있으므로, 시민들이 그 밑으로 추락하지 않도록 방지하는 통제된 하한선을 만듭니다. 이 계획은 쓰러진 이들에게 희망의 등대로서 우리가 그들이 다시 일어서도록 돕기 위해 곁에 있음을 보여줄 것입니다."
 fiji_economic_planning_board: "경제 기획원"
 fiji_economic_planning_board_desc: "EPB는 경제 성장을 담당하는 정부 부서입니다. 민간 부문도 여전히 활동을 즐길 수 있으나, 독실한 이른바 반공 설교자들을 위해 이 일종의 정부 부처는 독립적인 투자 부서입니다. 이는 새로운 정부 구상을 이끌고 시작하도록 돕되, 안정이 확보되면 이를 민간으로 넘기는 것입니다. 요컨대 EPB는 일을 시작하고, 민간 부문은 그 일을 바라건대 영원히 이어갑니다."
 fiji_pacific_economics_exchange_commission: "태평양 경제 교류 위원회"
 fiji_pacific_economics_exchange_commission_desc: "PEEC는 세계 우리 지역의 국가들과 영향력과 협력을 더 확대하기 위한 공동 지역 사업입니다. 주된 초점은 경제와 정치이나, 부수적으로 군사 교육을 병행하면 참여하는 모든 이에게 전반적인 혜택을 줄 수 있습니다."
 fiji_titles_by_election: "선거로 정해지는 작위"
 fiji_titles_by_election_desc: "선거로 정해지는 작위는 민주적 절차를 보존하고, 국민이 누가 자신들의 이른바 다음 귀족이 될지 투표할 수 있도록 하는 헌법상의 요건입니다. 더는 잠자리 동화가 아니며, 이제 당신도 여왕이나 왕이 될 수 있다고 정말로 말할 수 있습니다."
 fiji_institute_of_automation: "피지 자동화 연구소"
 fiji_institute_of_automation_desc: "FIA는 곧 이른바 연구 낙원 계획으로 알려질 것의 기초 작업입니다. 목표는 섬을 거대한 연구개발 시설로 탈바꿈시켜, 햇볕 아래에서 즐기면서도 현실 그 자체의 미지를 풀어낼 상상력과 창의력을 갖출 수 있음을 세계에 보여주는 것입니다."
 fiji_institute_of_resource_development: "피지 자원 개발 연구소"
 fiji_institute_of_resource_development_desc: "FIRD는 연구 낙원 계획 발전의 또 다른 상징입니다. 자원의 채굴, 정제, 합성을 알려진 최대의 잠재력까지 끌어올리는 데 존재 이유를 둡니다. 우리 섬이 작은 것은 사실이지만 가진 것이 없다는 뜻은 아닙니다. 따라서 이 연구소는 국내 공급을 보장하고 가능한 곳에서 이를 늘리는 방법에 있어 핵심이 될 것입니다."
 fiji_institute_of_energy_development: "에너지 개발 연구소"
 fiji_institute_of_energy_development_desc: "IED는 에너지를 더 효율적이고 생산적으로 생산할 수 있는 방식의 개발에 집중할 것입니다. 이 부서는 FIRD와 협력하여 에너지와 경제의 결속을 더 잘 통합할 수도 있습니다."
 fiji_technocratic_military: "기술관료제 군"
 fiji_technocratic_military_desc: "우리 섬은 작지만 우리의 두뇌는 그렇지 않습니다. 이러한 이해 덕분에 군사력을 강화하기 위해 연구개발 역량의 상당 부분을 투입할 수 있습니다. 현대적인 공군을 갖출 경제력은 아직 없지만, 적어도 해군과 지상군을 더 잘 전문화할 수는 있습니다."
 fiji_research_paradise_program: "연구 낙원 계획"
 fiji_research_paradise_program_desc: "우리의 폭넓은 연구 노력의 결실은 연구와 개발 전반을 위한 새로운 낙원을 만들어 냈습니다. 섬은 외국 휴양객뿐 아니라 과학계 전체를 위한 낙원으로 탈바꿈했습니다. 이곳에서 우리는 우리가 아는 분야와 우리가 발견할지도 모를 새로운 분야에서 국내외의 진보를 조율할 수 있습니다. 미래는 진정 지금입니다."
 fijian_homelessness_crisis: "노숙 위기"
 fijian_homelessness_crisis_desc: "나라의 정치적 불안정 속에서 정부는 커져 가는 노숙 위기를 해결할 시정 조치와 결단력 있는 행동이 전적으로 부족했습니다. 새 천년이 시작되면서 정부가 나라를 괴롭히는 이 커져 가는 문제를 실제로 해결할 수 있을지 많은 이들이 의문을 품고 있습니다. 어쨌든 정부가 나라를 돌볼 수 있을 뿐 아니라 스스로를 돌보기 시작할 수 있을지는 시간이 말해 줄 것입니다."
 fijian_emigration_crisis: "대규모 이민 위기"
 fijian_emigration_crisis_desc: "정치적 불안정과 기후 변화, 고조되는 민족 긴장 속에서 피지를 바꿀 수 있는 인재들은 이 작은 섬들을 떠나는 편이 낫다고 깨달았습니다. 더 나은 내일의 토대를 마련하는 것은 새 정부의 몫이지만, 이토록 불리한 조건이 많은 가운데 피지 정부는 시간 그 자체의 시험을 견뎌낼 수 있을까요?"
 fijian_military: "피지 군"
 fijian_military_desc: "섬이 독립한 이래 피지 군은 훌륭한 자위대 역할을 해 왔습니다. 그러나 해외 임무에 제한적으로 참여했을 뿐이어서 피지 군에는 경험이라 할 만한 것이 거의 없습니다. 섬이 현대로 접어들고 정치적 불안이 더 우려되는 가운데, 군이 앞으로 몇 번이나 더 평화를 지켜야 할지 많은 이들이 궁금해합니다."
 fijian_economic_condition: "피지 경제"
 fijian_economic_condition_desc: "인구와 국토가 보잘것없음에도 피지 경제는 잘 다변화되어 있습니다. 광업은 구리, 금, 은 같은 자원 채굴에서 두각을 나타냅니다. 이차 산업으로는 시멘트 생산과 조선이 있습니다. 전반적으로 피지 경제는 비교적 탄탄한 기반을 갖추고 있으며, 새 천년이 시작됨에 따라 첨단 기술과 소프트웨어 개발 같은 새로운 산업으로 뻗어가 경제를 더욱 다변화하는 것은 정부의 몫입니다."
 fijian_ethnic_tensions: "인도계 피지인 긴장"
 fijian_ethnic_tensions_desc: "독립 이후 피지 섬의 인구는 꽤 완만하게 증가했습니다. 그러나 이것의 단점은 피지로 이주해 온 사람들의 압도적 다수가 인도계라는 점입니다. 대부분에게는 아무 의미가 없는 일이지만, 안타깝게도 상당수의 피지 원주민에게는 이것이 대체와 소외로 느껴집니다. 섬들의 최근 독립사를 통틀어 이러한 긴장은 극적으로 고조되기만 했으며, 심각한 일이 벌어지기 전에 이를 해결하는 것은 피지 정부의 몫입니다...나라 역사에 스며든 여러 쿠데타는 부디 못 본 척해 주십시오."
 fiji_2000_coups_over: "평화로의 복귀"
 fiji_post_coup_political_shift: "충성의 변화"
 fiji_fast_tracked_military_junta: "§8개선을 향한 대장정이 시작되었다§!"
 fiji_fast_tracked_monarchy: "§0무력의 왕관이 민중의 왕관을 만든다§!"
 fiji_2006_coup_avoided: "§P2006년 쿠데타를 피했다§!"
 fiji_2006_coup_historical: "§l군사 쿠데타 성공§!"
 fiji_2006_coup_military_junta: "§8바나나 사나이가 쓰러졌다§!"
 fiji_2006_coup_monarchist_era: "§0수바 왕가가 승리했다§!"
 fiji_2006_coup_technocracy: "§t기술 의회 (Technate Counci)의 권력 장악§!"
 fiji_news.1.t: "민족주의자들, 정부 관리 납치"
 fiji_news.1.d: "2000년 5월 19일 오늘 이른 시각, 피지 원주민 우선 정치 운동인 이타우케이 소속 인사들이 새로 선출된 인도계 피지인 위주의 정부 핵심 인사들을 인질로 잡았습니다. 총리와 여러 핵심 정부 관리가 의회 건물에서 인질로 붙잡혔고, 이타우케이 인사들은 사실상 건물 안에 바리케이드를 치고 농성 중입니다. 인명 피해 없이 인질을 구출하기 위한 협상이 진행되고 있습니다."
 fiji_news.1.o1: "왜 우리끼리 싸워야 하는가"
 fiji_news.2.t: "임시 정부 수립"
 fiji_news.2.d: "사건 이후 반란군과의 협상이 교착 상태에 빠지자 카미세세 마라 대통령은 비상사태를 선포하고, 인질로 잡히지 않은 정부 관리들 가운데 남은 이들로 지속 정부를 구성했습니다. 지역 경찰과 피지 공화국 군(RFMF)이 의회 주변의 무너져 가는 봉쇄선을 유지하면서 커져 가는 시위와 사회 불안, 그리고 수바의 여러 인도계 피지인 기업을 노린 시위대에 대응하느라 한계에 이르러 긴장이 고조되고 있습니다."
 fiji_news.2.o1: "우리가 할 수 있는 일이 없단 말인가!?"
 fiji_news.3.t: "권위 상실이 부른 군사 쿠데타"
 fiji_news.3.d: "민간 정부의 잔존 세력이 행정 권한을 제대로 행사할 능력이 없음이 드러나자, RFMF 사령관 프랭크 바이니마라마는 현 정부를 축출하고 자신들의 정부를 수립했습니다. 그들의 첫 조치는 계엄령 선포였으며, 이로써 막대한 사회 불안에 대처할 더 많은 자유를 얻었습니다."
 fiji_news.3.o1: "또 시작이군"
 fiji_news.3.o2: "군이 이 문제를 해결할 것이다"
 fiji_news.4.t: "의회에서 총격 교환"
 fiji_news.4.d: "군의 쿠데타 이후 1997년 헌법이 폐지되었고, 군이 최후통첩을 내놓으면서 협상은 결렬되었습니다. 외국 열강들은 피지를 영연방에서 제명하고, 여러 나라가 피지 상품을 금지하고 피지 스포츠 팀의 출전을 금지하는 등 일련의 제재를 시작했습니다. 이러한 대응은 반군의 요구에 굴복하려 했다는 인식 때문이었습니다. 6월 12일 군은 조지 스피트의 차량에 경고 사격을 가했는데, 스피트는 이것이 실패한 암살 시도였다고 주장합니다. 협상은 여전히 진행 중이며 더 많은 인질이 석방되었습니다. 사회 불안이 가라앉고 상황이 희망적으로 보이는 가운데, 이것이 얼마나 더 지속될지 많은 이들이 궁금해합니다."
 fiji_news.4.o1: "이 무의미한 폭력을 끝내 달라"
 fiji_news.5.t: "군이 반군에 동조하는가?"
 fiji_news.5.d: "2000년 7월 3일 바이니마라마는 라이세니아 가라세를 총리로 지명하여 전원 피지 원주민으로 구성된 정부를 이끌게 했습니다. 스피트는 이 결정에 격분했고, 이튿날 의회에서 총격전이 벌어져 다섯 명이 부상을 입었습니다. 혼란은 고조되었고 반군은 전국에서 여러 사건을 일으켰습니다. 라바사의 수쿠나이발루 병영 병사들은 반란을 일으켜 스피트에 대한 지지를 선언했습니다. 지역 토지 소유주들은 모나사부 댐을 점거해 수바에 대한 전력 공급을 끊었습니다. 8일에는 반군이 수바와 나디 사이의 도로를 봉쇄하고 코로보우의 경찰서를 습격해 30명을 인질로 잡았습니다. 나보로 교도소에서는 수감자 50명이 폭동을 일으켜 교도관들을 인질로 잡았습니다"
 fiji_news.5.o1: "바나나라마는 대체 무슨 생각인가!?!"
 fiji_news.6.t: "쿠데타의 종결"
 fiji_news.6.d: "6월과 7월 내내 민간 정부의 개혁을 두고 끝없이 논의가 오가면서 준지속적인 협상이 나라 전역에 스며들었습니다. 결국 더 많은 인질이 석방되었고 반군은 의회 건물을 떠나 수도 지역에서 이동했습니다. 마침내 7월 26일, 두 반군 지도자가 새 대통령과 내전에 대한 협박을 던진 뒤 스피트와 그의 대변인 조 나타가 군 검문소 근처에서 체포되었습니다. 곧이어 군은 반군 본부를 급습해 추가로 반군 369명을 체포했습니다. 민간 쿠데타는 종결이 선언되었고, 얼마 지나지 않아 조지 스피트는 반역죄로 재판을 받고 사형을 선고받았습니다."
 fiji_news.6.o1: "마침내 평화가...그러나 그 대가는?"
 fiji_news.7.t: "통합 피지당 승리 확보"
 fiji_news.7.d: "1997년 피지 헌법은 하원 총선을 최소 5년에 한 번 치르도록 요구했습니다. 라투 조니 마드라이위위 대통령 권한대행은 2006년 3월 2일 의회를 해산하는 포고를 발표했으며, 효력은 3월 27일부터 발생했습니다. 이전 의회 임기는 2006년 10월 1일에 만료될 예정이었습니다. 선거 영장은 3월 28일에 발부되었고, 후보자들은 4월 11일에 후보 등록을 마쳤으며 13일에 선호 명부를 공표했고, 유권자 등록은 4월 4일에 마감되었습니다. 총선은 2006년 5월 6일부터 13일까지 피지에서 실시되었습니다. 라이세니아 가라세 총리가 이끄는 현 소코소코 두아바타 니 레웨니바누아(SDL) 정부가 세 번째 임기로 재선되었습니다. 주요 야당은 마헨드라 초드리가 이끄는 노동당과 그 밖의 여러 소수 정당이었습니다."
 fiji_news.7.o1: "순조롭게 나아간다."
 fiji_news.8.t: "군의 요구"
 fiji_news.8.d: "2006년 10월 16일 RFMF 사령관 바이니마라마 준장은 정부가 아홉 가지 요구를 수용하거나 12월 1일까지 사임하라는 최후통첩을 발표했습니다. 아홉 가지 요구는 주로 2000년 쿠데타 주동자들을 법의 심판대에 세울 것, 인종을 근거로 경제적 불평등을 더 키울 수 있는 정치적 책동을 철회할 것, 외국 당국의 개입을 거부할 것(오스트레일리아 국적자인 앤드루 휴스 경찰청장을 실명으로 언급), 올해 초 군의 발언과 관련된 소송 절차를 취하할 것, 그리고 정부 지출과 내부 통치에 대한 우려를 공식적으로 해소할 것에 집중되어 있었습니다. 일주일 반 후인 2006년 10월 31일, 군은 수바 일대에서 훈련을 벌이고 도시의 병영을 봉쇄했습니다. 군은 이 훈련이 위협적이지 않다고 밝혔습니다."
 fiji_news.8.o1: "그런 오합지졸의 요구는 거부한다"
 fiji_news.8.o2: "§P일단은 체면을 지키자§!"
 fiji_news.9.t: "군사 쿠데타 정부"
 fiji_news.9.d: "정부가 군의 요구에 맞서자 프랭크 바이니마라마 준장은 이른바 사회적·민족적 안정에 대한 위협이라는 명분으로 정부를 무너뜨리는 쿠데타를 일으켰습니다. 사태는 신속하고 재빠르게 진행되어, 군 자체가 준장의 뜻을 따르는 이 일에 단결해 있는 것으로 보입니다. 그러나 정당성을 의문시하는 이들도 있고, 군에게 다른 계획이 있다고 보는 이들은 더 많아 보입니다. 알려진 바는 많지 않지만 우리 시대에 진정한 평화를 볼 수 있기를 많은 이들이 바라고 있습니다."
 fiji_news.9.o1: "이것으로 정말 충분한가?"
 fiji_news.9.o2: "§l안정이 돌아왔다§!"
 fiji_news.10.t: "쿠데타 가담자들의 선동"
 fiji_news.10.d: "최근의 쿠데타로 프랭크 바이니마라마 준장이 사실상 나라의 지도자가 되자 이제 피지의 다음이 정말 무엇일지 많은 이들이 궁금해합니다. 쿠데타 내 일부 고위 인사들은 나라를 통치하는 방식에 대해 더 확고한 입장을 요구하며 선동하고 있는 듯합니다. 한 명은 민족 갈등의 사소한 다툼이야말로 이 나라가 견뎌야 했던, 하물며 그 때문에 스스로 갈라질 이유조차 없었던 최대의 실책이라고 말했습니다. 지금으로서는 온 세계가 이 작은 태평양 섬이 겪고 있는 불안한 상황에 시선을 두고 있습니다."
 fiji_news.10.o1: "§8군은 우리의 구원이다§!"
 fiji_news.10.o2: "우리가 겪은 고통으로 충분하지 않은가"
 fiji_news.11.t: "낡은 사상이 부추긴 파벌주의"
 fiji_news.11.d: "군사정권 내에서 커지는 파벌주의는 새로운 맛을 입은 낡은 사상의 부상을 불러왔습니다. 수바 왕가로 알려진 파벌은 선출 군주제, 즉 낡은 작위에 새로운 원칙을 얹은 체제를 만들고자 하는 듯합니다. 작위를 혈통에 묶는 대신 선거라는 개념과 민주주의 원칙은 여전히 남겨두는 것입니다. 군주주의와 민주적 선거주의의 이러한 혼합이 그들 강령의 근본 토대가 될 것입니다. 파벌 구성원 한 명은 이제 당신의 아들딸에게도 열심히 노력하고 삶의 목표를 추구한다면 왕자나 공주, 어쩌면 왕이나 여왕도 될 수 있다고 말할 수 있다고까지 언급했습니다. 많은 이들이 이 제안에 확신하지 못하지만, 추장 평의회와 섬 주민들의 부족 유산에는 호소력이 있는 듯합니다."
 fiji_news.11.o1: "참으로 동화 같은 이야기로군"
 fiji_news.11.o2: "§0글쎄...자존심을 세워 주는 좋은 일일지도§!"
 fiji_news.12.t: "쿠데타로 인한 불안정"
 fiji_news.12.d: "쿠데타가 길어지고 여러 파벌이 일반 국민의 항의를 받는 가운데, 나라가 완전히 멈춰 선 이 상황에서 무엇이 나올지 많은 이들이 궁금해합니다. 테크네이트 평의회라는 파벌이 형성되고 있다는 소문이 돌고 있으며, 이 평의회는 피지 기술관료당으로 알려진 쉬쉬하는 틈새 정당의 일부로 보입니다. 그러나 쿠데타 기구에 맞선 많은 시위 운동은 그저 앞으로 나아가기를 바랄 뿐이며, 선거 결과 2위를 차지한 피지 노동당이 그냥 집권하라는 팻말이 점점 늘어나고 있습니다. 하지만 누가 먼저 눈을 깜빡일까요?"
 fiji_news.12.o1: "§t평의회가 권력을 장악한다§!"
 fiji_news.12.o2: "§P국민은 더는 참을 수 없다§!"
 fiji_news.400.t: "군의 광신자들"
 fiji_news.400.d: "쿠데타가 낳은 혼란 속에서 일부 군 인원이 부당하게 공격적인 접근을 취하며 프랭크 바이니마라마 준장의 뜻을 노골적으로 거역하고 있습니다. 긴장이 고조되고 군 내부의 결속이 무너지기 시작하고 있습니다."
 fiji_news.400.o1: "신이시여, 우리를 도우소서"
 fiji_news.401.t: "습격 소문 확산"
 fiji_news.401.d: "최근 더 급진적인 지도자들이 이끄는 군사정권의 한 분파가 의회 건물을 급습해 인질들을 제거할 계획을 세웠다는 소문이 돌고 있습니다. 준장은 1980년대 첫 쿠데타 이래 볼 수 없었던 국가적 위기를 막기 위해 이 급진 장교들을 찾아 허둥대는 모습이 목격되었습니다. 이성적인 사람들이 이 땅을 다스릴지 혼돈이 다스릴지는 시간이 말해 줄 것입니다."
 fiji_news.401.o1: "§8총소리가 들리는 것 같은데?§!"
 fiji_news.401.o2: "§l오늘은 이상하리만치 조용하군.§!"
 fiji_news.401.o3: "§0저 소란은 무엇인가?§!"
 fiji_news.402.t: "수바 학살"
 fiji_news.402.d: "총격과 인질 상황에 대한 공격으로 사망 15명, 부상 27명이 발생하고 전국에 대규모 공황이 일면서 혼란이 나라를 휩쓸었습니다. 일주일간 이어진 이 사건의 혼란 속에서 프랭크 바이니마라마 준장이 심하게 파손된 호송 차량 안에서 사망한 채 발견되었다고 소식통은 전합니다. 준장의 죽음을 자처하는 이는 없으며, 그가 정말 죽었어야 했는지에 대해서도 의견이 엇갈립니다. 어쨌든 이것은 나라에 막대한 대가를 치르게 할 회복의 길입니다."
 fiji_news.402.o1: "우리가 정말 이를 치유할 수 있을까?"
 fiji_news.403.t: "앞으로 나아가기"
 fiji_news.403.d: "2000년 쿠데타의 혼란 끝에 나라를 재건하는 일은 길고 꽤 지루한 여정이었습니다. 그러나 잿더미에서 불사조가 일어났고, 이 위엄 있는 새는 날아오를 것입니다. 이제 우리 앞에 놓인 토대 위에 쌓아 올리는 데 집중할 수 있으며, 우리의 작은 섬뿐 아니라 우리를 둘러싼 세계도 바라보아야 합니다."
 fiji_news.403.o1: "여정은 이제 시작일 뿐이다."
 fiji_news.500.t: "권력 투쟁 심화"
 fiji_news.500.d: "군 부대들이 이미 형편없던 의회 건물 주변의 봉쇄선에서 갑자기 이탈하였습니다. 소식통은 수바 외곽 근처에서 총성과 타이어 마찰음이 들렸다고 전합니다. 민간 정부의 잔존 세력에 대한 군의 반쿠데타 기구에 무슨 일이 있었기에 이토록 급격한 변화가 일었는지 많은 이들이 의문을 품고 있습니다. 더욱이 최초의 쿠데타를 일으킨 민족주의 지도자는 자신과 대화에 나서거나, 그렇지 않으면 부작위의 결과에 직면하기 시작하라고 단호히 요구했습니다. 무슨 일이 벌어졌는지 곧 소식이 들리기를 바랍니다."
 fiji_news.500.o1: "우리에게 아직 나라가 있기는 한가?"
 fiji_news.501.t: "유혈의 결과"
 fiji_news.501.d: "우리가 사는 현대 세계와 극명히 대비되게도, 군의 불안정한 한 분파가 준장의 호송대를 매복 습격하였고, 이어서 추장 평의회에 수바 왕가를 합법화하도록 강요한 것으로 드러났습니다. 이 피로 얼룩진 등극으로 군주제로부터 독립을 쟁취한 나라의 역사에도 불구하고 나라는 군주국이 되었습니다. 이른바 왕가 평의회의 한 인사와의 최근 인터뷰에서는 \\"우리는 나라에 대한 확고하고, 정의롭고, 신의 뜻에 맞는 통치를 지향한다. 민족주의자들을 처리할 때까지 계엄령의 형태를 시행하는 것은 사실이나, 그럼에도 선거를 폐지할 계획은 없다.\\"고 말했습니다. 많은 이들이 이 주장에 회의적이지만, 압도적 다수는 그저 혼란이 멈추기를 바랍니다. 이들의 피로 만들어진 왕관이 어떤 결과를 낳을지 지켜볼 것입니다."
 fiji_news.501.o1: "잡을 수 있는 키라도 있기는 한가!?!"
 fiji_news.502.t: "새로운 시대"
 fiji_news.502.d: "재건 과정이 사실상 끝나고 상처가 어느 정도 아물어 나라가 미래에 집중할 수 있게 되었습니다. 수바 왕가는 나라와 국민에 대한 온전한 이해와 발전에 전념해 왔습니다. 앞으로 도전이 있을 것임을 이해하고 있기에, 국민은 여전히 주저하면서도 삶이 일상으로 돌아왔다는 안도감을 키워 왔습니다...그 일상이 그 자체로 \\"정상\\"이라고 여겨지지는 않을지라도."
 fiji_news.502.o1: "새로운 장, 새로운 시작."
 Rear_Admiral_Villiame_Naupoto_desc: "빌리아메 나우포토는 피지 해군 장교로, 2006년 쿠데타의 혼란 속에서 더 목소리 큰 군국주의자들의 파벌에 가담하게 됩니다. 쿠데타 내의 이 파벌은 이른바 바나나맨 프랭크를 축출하고 고립시킵니다. 이러한 변화로 한때 헌법을 준수하던 쿠데타는 완전한 군사정권으로 변모합니다. 나우포토 해군 소장은 정치 무대에서 새로운 얼굴이지만 맹목적인 사람은 아니기에, 국민은 그가 나라와 국민을 어떻게 더 나은 시대로 이끌지 궁금해합니다."
 Laisenia_Qarase_desc: "라이세니아 가라세는 2000년 쿠데타 중에 세워진 타협적인 후보였습니다. 당시로서는 지나치게 좌편향이지도 않고, 피지 원주민이며, 지나치게 우편향이지도 않았습니다. 그는 2001년 조기 총선에서 승리하고 놀랍게도 2006년 선거에서도 승리합니다. 그러나 2006년에 이르러 그의 견해와 정당은 피지 원주민 쪽으로 더 기울었고, 2006년 임기 중 그가 제안한 일부 논란이 되는 법안들이 헌법 위기를 일으켜 군의 2006년 쿠데타로 이어집니다."
 Mahendra_Chaudhry_desc: "마헨드라 초드리는 2000년 피지 최초의 인도계 피지인 다수 정부의 선출 지도자였습니다. 그러나 민족주의 운동의 선동가가 직접 일을 처리하기로 결심하고 선출된 정부를 납치했습니다. 그 쿠데타 이후 통합 피지당이 설립되어 쿠데타 후 조기 총선에서 공식적으로 선출됩니다. 마헨드라 초드리는 2006년 총선에서 다시 한번 총리직에 도전합니다."
 Dr_Padma_Narsey_Lal_desc: "1951년생인 파드마 나르시 랄은 남태평양 대학교에서 공부하여 과학, 생태학, 생화학 석사 학위를 받고 졸업했습니다. 그녀는 이 대학에 다닌 최초의 구자라트계 여성이었습니다. 1971년에는 최초의 남태평양 대학교 금메달을 수상했습니다. 또한 오스트레일리아 국립대학교에서 자원환경학 석사 학위를, 하와이 대학교 마노아 캠퍼스에서 농업 및 자원경제학 박사 학위를 마쳤습니다. 파드마 랄은 피지 정부의 공무원으로 일하다 연구 및 연구 관리 직책으로 옮겼습니다. 그녀는 태평양 도서국 포럼 사무국의 지속가능개발 고문과 국제자연보전연맹 오세아니아 지역 사무소의 수석 기술 고문을 역임했습니다. 랄은 오스트레일리아 국제농업연구센터를 비롯한 오스트레일리아 연방 정부에서도 고위직을 맡은 바 있습니다."
 King_Sitiveni_I_desc: "시티베니 라부카는 이제 공식적으로 수바 왕가의 시티베니 1세 국왕이라는 칭호를 받았습니다. 수바 왕가의 핵심 인물이자 일부는 잠재적 창시자라고도 주장합니다. 라부카는 정치와 군 경력으로 이름과 유산을 남겼으며, 나라의 거의 모든 쿠데타에 어떤 식으로든 관여했습니다. 안정, 질서, 평화... 이 세 기둥이 라부카가 지키고자 노력해 온 것이며, 이 새로운 길로 그가 진정한 유산을 만들 수 있을지 많은 이들이 궁금해합니다."
 King_Sitiveni_II_desc: "조이오지 콘로테는 이제 공식적으로 수바 왕가의 시티베니 2세 국왕이라는 칭호를 받았습니다. 전직 소장이자 정치인인 그는 쿠데타 이후 시대 첫 선거 주기에서 국민에 의해 선출되었습니다. 시티베니라는 이름은 왕관 평의회에서 하나의 상징입니다. 그 상징이란 수바 왕가의 핵심 인물이자 일부는 잠재적 창시자라고도 주장하는 시티베니 라부카입니다. 이러한 명명 관례가 선례로 자리 잡은 만큼, 후속 지도자들이 이 상징을 택할지 아니면 숫자 놀음에서 자신만의 몫을 주장할지 많은 이들이 궁금해합니다."
 fiji_focus: "피지 중점 트리"
 fiji_research_institute_of_fiji_desc: "R.I.F.는 우리나라 정체성의 정점입니다. 모든 분야의 연구와 혁신에 적당히 폭넓게 투자하여 세계 지도에 우리 이름을 올리고 외국 과학계를 끌어들일 수 있습니다. 이를 통해 우리나라는 기술에 더 빨리 노출될 것이며, 우리의 게임에 참여하려는 이들과 거래할 패를 쥐게 될 것입니다."
 FIJ_focus_the_1999_general_election: "1999년 총선"
 FIJ_focus_the_1999_general_election_desc: "1999년 피지 총선이 치러져 새 정부가 구성되었으며, 피지 노동당이 의회 의석의 과반을 차지했습니다. 주요 야당인 SVT, 곧 소코소코 니 바카불레와 니 타우케이가 2위를 차지했습니다. 노동당은 중도좌파로, SVT는 중도우파로 여겨지는 구도가 형성되었습니다. 그러나 3위는 피지 연합당(FAP)이었습니다. SVT에서 갈라져 나온 분파인 이 당은 주로 토착 피지인으로 구성되어 역설적으로 더 우파로 여겨졌으나, 지도부가 바뀌면서 당은 눈에 띄게 온건해졌고 FLP와 선거 동맹을 맺게 됩니다."
 FIJ_focus_assessing_the_national_situation: "국가 상황 평가"
 FIJ_focus_assessing_the_national_situation_desc: "새 선거에 대한 기대에도 불구하고, 우리는 방향을 잡고 무엇을 추구하고 바로잡아야 하는지 이해해야 합니다. 우리 아름다운 나라의 독립 이후는 정치적 분쟁과 쿠데타, 또 쿠데타, 그리고 또 쿠데타로 점철되어 왔습니다.... 따라서 같은 수렁에 빠지지 않으려면 서둘러야 합니다."
 FIJ_focus_increased_security: "수바 치안 강화"
 FIJ_focus_increased_security_desc: "수도는 불안한 상태이며, 인도계 피지인이 다수를 이루는 정부가 최근 선출된 탓에 이 지역에서 사업을 하는 이들에게 더 많은 민족 간 폭력이 닥칠 가능성이 커졌을까 우려됩니다."
 FIJ_focus_the_2000_debacle: "2000년의 참사"
 FIJ_focus_the_2000_debacle_desc: "세기가 바뀔 무렵 피지 섬은 민족주의 쿠데타의 습격을 받았습니다. 쿠데타 시도는 결국 군의 역쿠데타로 진압되었으나, 그 이후 민간 정부에 대한 신뢰는 사상 최저 수준에 머물러 있습니다. 이제 현 집권당과 야당마저도 피지 국민에게 희망을 되돌려 줄 수 있을지 살펴보아야 합니다."
 FIJ_focus_isolated_terror_attacks: "민족주의자 공격"
 FIJ_focus_isolated_terror_attacks_desc: "스페이트가 체포된 이후에도 반란군의 폭력은 계속되었습니다. 7월 31일 스페이트 지지자들은 드레케티 마을을 공포에 빠뜨리고 30명을 인질로 잡았습니다. 수쿠나이발루 병영에서 반란을 일으킨 병사들은 6주 동안 항복하지 않았습니다. 8월 8일 반란군은 군 순찰대를 매복 공격하여 병사 한 명과 경찰관 한 명을 살해하고 세 명에게 부상을 입혔습니다"
 FIJ_focus_military_disunity: "군 반란"
 FIJ_focus_military_disunity_desc: "2000년 11월 2일, 스페이트에게 충성하는 대혁명전 부대 병사들이 퀸 엘리자베스 병영 반란을 일으켜 군 사령관 프랭크 바이니마라마를 축출하려는 시도로 장교들을 인질로 잡았습니다. 군이 병영을 탈환하는 과정에서 병사 두 명이 사망하고 열 명이 부상했습니다. 사태 이후 반란군 네 명이 충성파 병사들에게 고문당하고 살해되었습니다."
 FIJ_focus_political_legitimacy: "굳건해진 정당성"
 FIJ_focus_political_legitimacy_desc: "11월 15일, 피지 고등법원은 임시 정부가 불법이라고 선언했습니다. 마라는 여전히 합법적인 대통령이며, 의회는 해산된 것이 아니라 정지되었을 뿐이므로 이제 다시 소집되어야 하고, 따라서 차우드리는 여전히 합법적인 총리라는 것입니다. 이후 마라는 5월 29일자로 소급하여 공식 사임했습니다."
 FIJ_focus_political_stagnation: "정치적 교착"
 FIJ_focus_political_stagnation_desc: "1997년 헌법이 복원되고 뒤이어 1999년에 선출된 정부가 복귀한 후, 나라는 이상하게도 멈춰 서게 되었습니다. 인질로 잡히고 공포에 시달려 사임했던 정부는 갑자기 다시 정상으로 돌아온 것처럼 보였습니다. 나라는 평온하지만 주요 정부 장관과 의원들은 그렇지 않으며, 이런 사태 이후에도 정말 권력을 유지할 수 있을지 의문을 품는 이들도 있습니다."
 FIJ_focus_political_challenge: "카라세의 도전"
 FIJ_focus_political_challenge_desc: "카라세 정부는 고등법원의 판결에 항소했습니다. 2001년 3월 1일, 피지 항소법원은 헌법을 복원한 고등법원의 결정을 확인했습니다. 정부는 이 판결을 받아들이고 다가오는 2001년 선거를 위한 선거 운동을 재개하려 할 것입니다."
 FIJ_focus_2001_elections: "2001년 피지 총선"
 FIJ_focus_2001_elections_desc: "새로 시작하기 위해 새 선거를 치르기로 한 결정에 따라 해당 선거는 2001년 8월과 9월에 실시되었습니다. 1999년에 선출된 정부를 둘러싼 논란으로 선거는 긴장 속에 치러졌으며, 다수당인 피지 노동당은 주요 야당 소속이었던 라이세니아 카라세의 쿠데타 수립 정부와 맞서 싸우고 있었습니다. 피지 통합당, 곧 소코소코 두아바타 니 레웨니바누아(SDL)는 카라세가 2000년 쿠데타 중 총리로 취임했을 때 그의 주도로 결성되었습니다. 이 당은 피지 연합당의 잔존 세력 대부분과 기독교민주동맹의 다수, 기타 보수 단체를 흡수하여 일종의 보수 대연합당을 이루었습니다. 결국 SDL은 선거에서 과반 승리를 거두었고, 이는 쿠데타 후 국정 운영의 무대를 마련했습니다."
 FIJ_focus_post_coup_cleanup: "쿠데타 후 수습"
 FIJ_focus_post_coup_cleanup_desc: "사태 이후 상당한 재산 피해가 발생했으며 수바 수도권 일대는 엉망이 되었습니다. 백지 상태에서 출발하여 목표를 향해 나아가려면 신속한 수습에 투자해야 합니다."
 FIJ_focus_early_community_programs: "초기 공동체 프로그램"
 FIJ_focus_early_community_programs_desc: "우리는 국민이 함께 일하려는 의지를 재건해야 합니다. 우리 모두는 피지의 시민이며, 따라서 서로 더불어 살 의지가 있어야 합니다. 쿠데타가 현실이 아님을 보여 주기 위해 화합 프로그램을 만들 것입니다. 이는 마을과 공동체가 서로를 찢어 놓는 것이 아니라 하나로 뭉치는 것임을 보여 줄 것입니다."
 FIJ_focus_head_start_cooperatives: "조기 협동 프로그램"
 FIJ_focus_head_start_cooperatives_desc: "기성세대가 서로를 찢어 놓고 있는 만큼, 상황을 되돌리는 것은 젊은 세대의 몫입니다. 이를 위해 우리는 일찍부터 학교 제도에 가족적 일체감을 심어 주어, 피지인이든 인도계 피지인이든 상관없이 우리 모두가 더 나은 내일을 위해 함께 일하러 이곳에 있다는 점을 가르쳐야 합니다."
 FIJ_focus_softer_situational_training_programs: "온건한 상황 대응 훈련 프로그램"
 FIJ_focus_softer_situational_training_programs_desc: "민족 집단 간 긴장이 높은 만큼 경찰 개혁을 도입해야 합니다. 범죄에 관대하다는 반발을 막기 위해, 이 개혁은 사실 법 집행 기관을 위한 새로운 훈련 프로그램입니다. 이 프로그램은 집단 간 민사 분쟁과, 경찰관이 어느 한쪽을 편드는 것처럼 보이지 않으면서 상황을 처리하는 방법을 중심으로 설계되었습니다."
 FIJ_focus_service_guarantee_citizenship: "복무가 시민권을 보장한다!"
 FIJ_focus_service_guarantee_citizenship_desc: "우리는 민족적 자긍심을 만들어야 하며, 이를 위해 군을 활용하고 어쩌면 새로운 민족을 들여와 우리 섬을 피지인과 인도계 피지인만이 아닌 더 다양한 곳으로 만들 수 있습니다. 이를 위해 군 내에 복무를 통한 시민권 프로그램을 만들 것입니다. 약간의 추가 자금과 군 지도부를 개인적으로 더 잘 몰두하게 할 무언가가 있다면 쿠데타 이후의 세계에서 전반적으로 도움이 될 것입니다. 그러니 기억하십시오, 그들은 자기 몫을 하고 있습니다. 당신은요? 오늘 피지 공화국군에 입대하십시오!"
 FIJ_focus_the_universal_retirement_program: "보편적 퇴직 프로그램"
 FIJ_focus_the_universal_retirement_program_desc: "URP는 정부가 만들어 은퇴에 이르러 신청했거나 기타 관련 사회 혜택을 신청한 모든 시민에게 지급하는 포괄적 퇴직 기금입니다. 우리는 국가 전체의 이익을 위해 모든 시민의 최저 기준을 끌어올리고 평준화하기를 바랍니다."
 FIJ_focus_the_national_care_initiative: "국가 돌봄 구상"
 FIJ_focus_the_national_care_initiative_desc: "NCI는 우리 의료 제도의 최저선을 마련하는 출발점이 될 것입니다. 일상적인 사고 등과 관련된 기본 치료는 모든 시민에게 무료로 제공될 것입니다. 우리는 제공되는 돌봄이 우리 국가를 구성하는 시민들에게 그들이 보살핌을 받고 있음을 보여 주고, 그들이 우리가 아는 삶을 개선하는 진정한 일을 할 진정한 기회를 우리에게 줄 것이라 기대합니다."
 FIJ_focus_soup_kitchens_act: "무료 급식소법"
 FIJ_focus_soup_kitchens_act_desc: "노숙이 늘고 민족 간 긴장이 심해지며 사람들이 섬을 떠나고 있는 만큼, 우리는 급진적인 해법을 모색해야 합니다. 노숙자이거나 어려운 처지에 있는 모든 이를 돕기 위해 전략적 위치에 무료 급식소를 설치하는 정부 프로그램이 국민을 하나로 모을 것입니다. 이는 우리가 바라던 만큼은 아니지만 전국적인 진정한 자선 구상의 토대입니다."
 FIJ_focus_police_fairness_act: "경찰 공정성법"
 FIJ_focus_police_fairness_act_desc: "무대가 마련되고 국민의 안전과 대응에 모든 조명이 쏠린 만큼, 우리 법 집행 기관은 더 잘 운영되어야 하며 불량배 집단으로 비쳐서는 안 됩니다. 경찰 조직과 배치 편제는 재평가되어, 범죄율이 높은 지역과 주민들이 소외되었다고 여기는 지역 모두에 더 공정하도록 개선될 것입니다."
 FIJ_focus_fijian_corps_of_engineers: "피지 공병단"
 FIJ_focus_fijian_corps_of_engineers_desc: "RFMF의 FCE 부문 창설은 평시에 국내 발전을 돕기 위한 군의 지시형 구상이 될 것입니다. 이는 기존 군 기반시설을 개보수하는 것을 의미할 수 있지만, 상수도, 도로, 철도 및 우리나라를 움직이는 기타 기반시설 같은 공공사업에서 민간 건설 프로젝트를 강화하는 데에도 활용될 수 있습니다."
 FIJ_focus_early_education_standards_act: "초기 교육 기준법"
 FIJ_focus_early_education_standards_act_desc: "EESA는 초기 교육 단계에 자금을 배정할 예산 법안입니다. 이 자금은 교사 급여, 새 교과서, 그리고 각 핵심 교과목에 교실이 필요로 하는 자료와 장비의 표준화에 나뉘어 쓰일 것입니다. 이 자금은 초등학교 유형으로 설계된 모든 학교에 고르게 배분될 것이며, 새 세대가 중학교에 진학했을 때 더 높은 이해도를 갖추어 더 덜 어려움을 느끼기를 바랍니다. 이는 앞으로 단계적으로 자금을 늘려 나가며 국가 전반의 교육 수준을 전반적으로 향상시키는 무대를 마련할 것입니다."
 FIJ_focus_targeted_medical_imports: "표적 의료 수입"
 FIJ_focus_targeted_medical_imports_desc: "전용 자금을 통해 의료 장비, 필요한 의약품, 기본 물자의 우선순위 점검표를 마련하고 기준 재고를 구축하여 우리 의료 기반시설이 가능한 한 효율적으로 운영되도록 할 것입니다. 이는 세계 공급망에 발이 묶이지 않도록 가능한 경우 국내 의료 개발을 장려하는 과정의 시작이 될 것입니다."
 FIJ_focus_fiji_food_securities_program: "피지 식량 안보 프로그램"
 FIJ_focus_fiji_food_securities_program_desc: "FFSP는 푸드뱅크와 같은 프로그램으로, 가장 큰 영향을 받은 시민들이 해당 혜택을 청구하여 한 달 동안 가정에서 생존에 필요한 식량을 구입할 수 있게 하는 제도입니다. 이는 최저 기준을 끌어올리고, 우리나라가 계속 겪고 있는 빈곤선과 갈수록 커지는 해외 이주 문제를 완화하는 데 도움이 될 것입니다."
 FIJ_focus_domestic_savings_initiative: "국내 저축 구상"
 FIJ_focus_domestic_savings_initiative_desc: "DSI는 정부를 위한 일종의 전쟁 자금으로 설계된 전용 프로그램입니다. 이 이른바 전쟁 자금은 경제 위기 시, 또는 지방 당국이 감당할 수 없는 규모로 커진 상황을 완화하기 위한 전용 맞춤 프로그램에만 쓰일 것입니다. 이러한 조치는 우리의 상황이 그다지 매력적이지 않은 만큼 피지가 외부 관찰자들에게 더 잘 관리되고 매력적으로 보이게 할 것입니다. 그럼에도 우리는 이겨 내고 독립 이후 30여 년간 볼 수 없었던 활력으로 새 천년을 맞이할 것입니다."
 FIJ_focus_fijian_economic_diversity_initiative: "피지 경제 다변화 구상"
 FIJ_focus_fijian_economic_diversity_initiative_desc: "FEDI는 향후 수십 년에 걸쳐 피지가 능력이 닿는 한 어느 정도 초기 단계의 자급자족 체제를 갖추도록 하는 일반 개념 계획입니다. 솔직히 우리가 딛고 선 자원에 대해서는 알려진 바가 많지 않지만, 민족 간 긴장, 모두가 떠나는 현실, 그리고 정부 기구를 그다지 달가워하지 않는 군과 국민 때문에 우리는 그런 사업에 온전히 집중하기에는 너무 많은 문제를 안고 있습니다. 이를 염두에 두고 우리는 향후 수십 년 안에 목표에 도달한다는 희망을 이어 왔지만, 우리가 이를 붙들고 그러한 목표에 이를 수 있을지는 국민에게 달려 있습니다."
 FIJ_focus_rebuild_suva_initiative: "수바 재건 구상"
 FIJ_focus_rebuild_suva_initiative_desc: "R.S.I.는 3개월간 이어진 쿠데타의 혼란 속에서 가장 큰 피해를 본 수바 시민들에 대한 상호 합의된 경제 지원 패키지입니다. 대규모 약탈과 폭동으로 수많은 재산 피해와 생계 파괴가 일어난 만큼, 우리는 그들이 재기하도록 도와야 합니다."
 FIJ_focus_early_business_management: "초기 기업 경영 프로그램"
 FIJ_focus_early_business_management_desc: "BMP는 우리나라의 차세대 기업인을 육성하기 위한 정부 구상입니다. 이는 사업주가 된다는 것이 진정 무엇을 의미하는지 관리하고, 운영하고, 이해하는 방법을 익히는 전용 강좌와 현장 인턴 방식의 훈련으로 이루어질 것입니다. 우리는 새로운 대출이 이뤄지고 새로운 상품과 서비스가 생산되고 판매되면서 경제 발전의 도약이 시작되기를 바랍니다."
 FIJ_focus_startup_investment_program: "창업 투자 프로그램"
 FIJ_focus_startup_investment_program_desc: "SIP는 신규 사업주와 그들의 꿈을 위한 전용 기업 융자 프로그램이 될 것입니다. 이러한 사업은 부실 대출을 낳을 수 있지만, 우리는 국가 예산의 일정 부분을 전용하여 분리된 방식으로 운영하려 합니다. 따라서 투자받은 사업이 실패하더라도 납세자에게 추가 부담은 발생하지 않을 것입니다."
 FIJ_focus_start_mining_survey_program: "광물 탐사 프로그램 개시"
 FIJ_focus_start_mining_survey_program_desc: "우리는 제한적인 자급자족 프로그램을 시행하는 데 있어 우리가 어떤 자원을 가지고 있고 실제로 어디에 서 있는지 파악하기 위해 여러 탐사 프로그램을 시작할 것입니다."
 FIJ_focus_importing_mining_equipment: "광산 장비 수입"
 FIJ_focus_importing_mining_equipment_desc: "우리가 제안한 최근의 광물 탐사를 뒷받침하려면 이러한 새 사업을 지원해야 합니다. 이를 염두에 두고 우리 광산 노동자들을 위한 핵심 광산 장비, 자재, 필요한 장구의 우선순위 목록을 작성할 것입니다. 이들은 우리나라가 경제 전체를 다변화하는 방식의 핵심입니다."
 FIJ_focus_increased_core_industries: "핵심 산업 확대"
 FIJ_focus_increased_core_industries_desc: "우리의 20개년 계획에서 나라의 초점이 앞을 향하고 있는 만큼, 주력 산업의 확장에 투자해야 합니다. 임업과 조선업은 비교적 강한 분야였지만, 여기에 시멘트와 관련된 광업 부문의 세부 사항도 포함합니다."
 FIJ_focus_solidifying_precious_metals: "귀금속 부문 공고화"
 FIJ_focus_solidifying_precious_metals_desc: "금과 은의 채굴 및 수출은 우리 수출에서 중요한 부분입니다. 이러한 하위 부문을 확장하면 상품 수출입에 대한 무역 적자 비율이 크게 개선될 것입니다. 이제 이를 확장하면 무역 수입이 늘어 우리가 수입할 수 있는 것을 늘릴 수 있습니다. 성장의 순환이 시작되었습니다."
 FIJ_focus_establishing_fijian_manufacturing: "피지 제조업 구축"
 FIJ_focus_establishing_fijian_manufacturing_desc: "탄탄한 제조 기반을 구축한다는 것은 우리의 경제 포트폴리오를 다변화할 수 있는 능력을 갖춘다는 뜻입니다. 이제 우리가 물품을 수입할 때 이 기반을 이용해 수입품의 용도를 다변화하고 수출로부터 더 큰 이익을 얻을 수 있습니다."
 FIJ_focus_economic_relief_fund: "경제 구제 기금"
 FIJ_focus_economic_relief_fund_desc: "ERF는 나라가 어려운 시기에 처하거나, 어떤 부문이 갑자기 붕괴하거나 급락에 가까운 상황이 되는 경제적 조건이 충족될 경우, 영향을 받은 경제 부문 내 기업들이 조직적인 구제 금융을 신청할 수 있도록 마련된 안전망입니다. 이러한 구제 금융은 ERF에 배정된 예산의 범위 내에서 협상되고 집행될 것입니다. 이러한 기금을 통해 우리는 외부 세력이 어떤 식으로든 우리 경제에 영향을 미치더라도 그 흐름을 막기를 바랍니다."
 FIJ_focus_balanced_trading_budget: "균형 잡힌 무역 예산"
 FIJ_focus_balanced_trading_budget_desc: "국가가 유사 농업 경제이자 탈산업화된 경제에서 벗어나 다양성과 번영의 새 시대로 나아가는 지금, 우리가 들여오는 것이 우리가 수출하려는 것을 앞지르지 않도록 점검해야 합니다. 따라서 분기마다, 심지어 반분기마다 진정한 예산 균형 조정을 살펴보아야 하며, 때가 되면 경제를 미세 조정하여 효율성과 전반적 효과를 높일 것입니다."
 FIJ_focus_early_adoption_tech_sector_investments: "기술 부문 투자의 조기 도입"
 FIJ_focus_early_adoption_tech_sector_investments_desc: "이른바 인터넷의 부상이 화제가 되고 세계 시장이 이에 집착하는 듯한 지금, 이에 부응하는 것이 우리의 의무입니다. 따라서 우리는 기술 부문이 만들어 내는 듯한 새로운 제품과 서비스를 포함하도록 산업 제조와 수출을 미세 조정할 것입니다."
 FIJ_focus_the_motorway_improvement_act: "고속도로 개선법"
 FIJ_focus_the_motorway_improvement_act_desc: "의회는 국가 주요 도로의 전용 개선 사업에 자금을 대는 법안을 통과시켰습니다. 이 법안은 늘어나는 화물 교통량을 더 잘 수용하고, 경제가 성장하고 발전함에 따라 새로운 잠재 기업과 산업의 접근성을 높이는 방안으로 여겨집니다. 일부는 지출 증가에 반대하지만, 다른 이들은 이것이 국가로서의 미래를 향한 또 하나의 디딤돌이 되기를 바랍니다."
 FIJ_focus_the_new_millennia_tax_reform_act: "쿠데타 후 세제 개혁법"
 FIJ_focus_the_new_millennia_tax_reform_act_desc: "의회는 최근 PCTR법을 통과시켰습니다. 이는 기업과 국민 전반에 대한 세금 징수를 개혁하는 법안으로, 빈곤층과 우리 빈곤 인구의 큰 비중을 차지하는 것으로 보이는 토착 피지인에게 더 공정하기를 바랍니다."
 FIJ_focus_domestic_energy_initiative: "국내 에너지 구상"
 FIJ_focus_domestic_energy_initiative_desc: "DEI는 연구, 탐사, 계획 프로그램입니다. 우리 섬은 비교적 작으므로 에너지 생산에서는 투입 대비 최대 효과를 거두어야 합니다. 이를 염두에 두고 우리는 채굴할 수 있는 국내 석유의 좋은 공급원을 발견했으며, 이를 통해 자원 채굴의 확장이자 직접 연계로서 초기 형태의 석유화학 산업도 통합할 것입니다. 이는 장래 계획에 놀라운 효과를 가져올 것입니다."
 FIJ_focus_domestic_resource_diversity: "국내 자원 다변화 프로그램"
 FIJ_focus_domestic_resource_diversity_desc: "의회는 국내 자원과 채굴량을 확대하고 가능하면 다변화하기 위한 정부 구상인 DRD 프로그램을 만들었습니다. 우리 아름다운 섬은 독립 이후 대부분의 기간 동안 금과 은으로 알려졌으나, 최근의 탐사와 기술 발전으로 철, 구리, 심지어 석유 같은 핵심 자원의 상당한 규모의 매장지가 발견되었습니다. 우리는 앞으로 이러한 초기 단계의 자원 채굴 사업을 크게 활용하기를 바랍니다."
 FIJ_focus_the_2006_general_election: "2006년 총선"
 FIJ_focus_the_2006_general_election_desc: "피지에서 2006년 5월 6일부터 13일까지 총선이 치러졌습니다. 라이세니아 카라세 총리가 이끄는 현직 소코소코 두아바타 니 레웨니바누아(SDL) 정부는 마헨드라 차우드리가 이끄는 피지 노동당이라는 주요 대항 세력, 그리고 여러 다른 소수 정당과 맞섰습니다."
 FIJ_focus_subtle_ethnic_illusions: "은근한 민족적 환상"
 FIJ_focus_subtle_ethnic_illusions_desc: "재선이 확정되고 권력의 판도가 우리에게 유리하게 바뀌는 지금, 우리는 이 섬에서 우리 민족의 패권을 공고히 해야 합니다. 이는 공공연한 반대와 심지어 적의에 부딪힐 것이므로, 우리는 접근 방식을 더 은근하게 하여 진정한 변화로 이어 나갈 것입니다."
 FIJ_focus_drafting_the_reconciliation_bill: "화해법안 기초"
 FIJ_focus_drafting_the_reconciliation_bill_desc: "화해법안은 토착 피지인에게 소소한 양보를 다수 되돌려 주는 법안으로, 우리의 주요 요점 중 하나는 2000년 쿠데타를 돌아보고 쿠데타 가담자와 수감된 이들에게 사면을 줌으로써 새 출발을 하는 것입니다. 우리는 이것이 대중에게 우리 모두가 실수를 하며, 따라서 오직 그것만으로 규정되어서는 안 된다는 공정하고 더 참된 이해를 안겨 주기를 바랍니다."
 FIJ_focus_assessing_the_farmland_leases: "농지 임대차 평가"
 FIJ_focus_assessing_the_farmland_leases_desc: "식민 통치 시기의 옛 식민지 제당 회사에 대한 보상으로 인도계 피지인에게 농지를 임대하는 제도는 한참 낡았습니다. 우리는 이러한 관행을 이어감으로써 과거에 매달려 있으며, 따라서 이러한 관행을 제대로 처리할 입법을 기초하는 방안을 검토할 것입니다."
 FIJ_focus_labour_party: "FLP, 쿠데타 후 격변에서 승리"
 FIJ_focus_labour_party_desc: "UFP는 보복에 대한 두려움과 쿠데타 위협이 실제로 행동에 옮겨질 가능성 때문에 군의 모든 요구에 굴복했습니다. 이에 따라 조기 총선이 치러졌고 FLP 과반 정부가 선출되었습니다. 군이 간접적으로 우리 편이고 거기에 일종의 백지 상태까지 갖춘 만큼, 우리는 상황을 진정으로 더 낫게 바꿔 나갈 수 있습니다."
 FIJ_focus_turning_down_the_heat: "열기 식히기"
 FIJ_focus_turning_down_the_heat_desc: "새 정부가 집권하고 군과의 합의가 이루어짐에 따라 우리는 이제 백지 상태에서 일할 수 있습니다. 2006년 참사로 정점에 이른, 끓어오르기 직전이었던 민족 간 긴장은 이제 가라앉았으며 우리는 공동체를 더 잘 통합하기 시작할 수 있습니다. 시간이 흐르며 우리의 수가 줄어들더라도 우리는 이 섬을 위한 새로운 평화의 시대의 무대를 마련할 수 있습니다."
 FIJ_focus_simmering_national_fears: "들끓는 국가적 두려움"
 FIJ_focus_simmering_national_fears_desc: "여전히 많은 이들이 떼를 지어 나라를 떠나고 있으며 우리는 이에 대처해야 합니다. 의료 및 복지 프로그램의 예산을 재편성함으로써, 우리가 그들을 위해 존재한다는 희망을 보여 주어 젊은 세대가 떠나지 않도록 장려할 수 있습니다."
 FIJ_focus_setting_to_boil_new_economic_plans: "새로운 경제 계획 끓이기"
 FIJ_focus_setting_to_boil_new_economic_plans_desc: "경제는 정체되어 있거나, 누군가 세계 시장에서 재채기만 해도 사실상 정체된 것처럼 보일 만큼 느린 속도로 성장하고 있습니다. 따라서 우리는 경제 구상에 열기를 높이고 연결성과 경제적 안정을 모두 구축해야 하며, 말하자면 우리만의 자급자족 계획입니다."
 FIJ_focus_a_path_of_healing: "치유의 길"
 FIJ_focus_a_path_of_healing_desc: "폭풍이 지나가고 우리의 생각이 정리되고 조직이 갖춰진 지금, 행정부의 대부분을 차지하게 될 국내 상황을 이제 다룰 것입니다."
 FIJ_focus_foreign_outreach: "대외 교섭"
 FIJ_focus_foreign_outreach_desc: "우리나라의 불안정이 외국 열강의 눈에 이제 더 안정되어 보이는 만큼, 우리는 투자를 유치하고 제공하며 이 세상에서 우리의 자리가 어디인지 찾아볼 수 있습니다."
 FIJ_focus_farmers_investment_division: "농민 투자부"
 FIJ_focus_farmers_investment_division_desc: "이 아름다운 섬의 소란 가운데 상당수는 농민들이 일으킨 듯합니다. 따라서 모든 필요를 다룰 수 있는 균형 잡힌 농민 투자 및 농업 부서를 정부 내에 설치해야 합니다. 결국 농민은 농민이며 모두 도움이 필요합니다."
 FIJ_focus_fijian_redevelopment_fund_phase_one: "피지 재개발 기금 1단계"
 FIJ_focus_fijian_redevelopment_fund_phase_one_desc: "FRF, 곧 피지 재개발 기금은 경제 발전이라는 중심축을 통해 여러 문제를 해결하려는 장기 정부 구상입니다. 이 계획은 포괄적이고 단계별로 구성되어, 우리에게 낯설지 않은 이 긴장된 시기에 국가 안정을 보장할 수 있는 최선의 방법으로 추진될 것입니다."
 FIJ_focus_ministry_of_scientific_development: "과학 발전부"
 FIJ_focus_ministry_of_scientific_development_desc: "MoSD는 정부의 전담 부문이 될 것이며, 그 주된 목표는 나라의 영민한 인재와 미래의 잠재적 인재를 찾아내어 새로운 기술뿐 아니라 우리 국민의 교육을 끌어올릴 방안을 연구하고 개발하는 것입니다."
 FIJ_focus_reforming_trade_initiatives: "무역 구상 개혁"
 FIJ_focus_reforming_trade_initiatives_desc: "우리 섬에는 아직 개발되지 않은 자원이 많이 있으며, 경제를 다변화해야 하므로 수입뿐 아니라 수출도 할 수 있어야 합니다. 무역 조건을 재협상하고 가장 높은 값을 부를 구매자에게 판매하려는 노력은 우리의 미래 계획을 개선할 더 많은 자본을 들여오게 해 줄 것입니다."
 FIJ_focus_pulling_in_foreign_scientist: "외국 과학자 유치"
 FIJ_focus_pulling_in_foreign_scientist_desc: "우리의 가장 영민한 인재들이 떠나고 있으며 우리는 이를 즉시 멈춰야 합니다. 외국 과학자들이 연구 부서를 설립하고 이곳에 기반을 마련하도록 설득할 수 있다면, 이는 국가 발전에 도움이 될 뿐 아니라 떠나려는 이들을 단념시키는 데에도 도움이 될 것입니다."
 FIJ_focus_overhauling_the_tax_code: "세법 전면 개편"
 FIJ_focus_overhauling_the_tax_code_desc: "연방 세법은 엉망입니다. 수십 년에 걸친 쿠데타, 정부 교체, 친토착 피지인과 친인도계 피지인 사이의 오락가락이 우리 세법을 난장판으로 만들고 크게 비효율적으로 만들었습니다. 우리는 이를 밑바닥부터 시작하여 민족에 관한 어떤 언급도 용납하지 말아야 합니다. 세법은 국가의 재정 안정을 위한 것이지 시민 사이에서 특정 편을 고르기 위한 것이 아닙니다."
 FIJ_focus_domestic_iron_development: "국내 철광 개발"
 FIJ_focus_domestic_iron_development_desc: "최근 지질 탐사 기술의 발전으로 우리는 국내용 및 타국 수출용으로 쓸 수 있는 철광석 매장지를 발견할 수 있었습니다. 이 공급은 국내 개발 사업을 돕는 형태로 우리에게 약간의 여유를 줄 것입니다."
 FIJ_focus_expanding_upon_domestic_energy_sources: "국내 에너지원 확대"
 FIJ_focus_expanding_upon_domestic_energy_sources_desc: "우리 섬은 비록 작지만 다양한 천연자원으로 가득 차 있습니다. 바로 이러한 자원이 우리가 국내 상황을 안정시킬 뿐 아니라 우리가 살고 있는 지역 사회를 내다볼 수 있게 해 줄 것입니다."
 FIJ_focus_human_resources_fund: "인적 자원 기금"
 FIJ_focus_human_resources_fund_desc: "경제가 발전함에 따라 최소한 그 안에서 일할 사람들도 있어야 합니다. 따라서 해외로 떠난 국민들을 다시 불러들이는 한편, 기회를 찾는 이들을 받아들여야 합니다. 충분한 유인책이 있다면 그들에게 진정한 기회를 보여줄 수 있습니다."
 FIJ_focus_pacific_exchange_and_investment_society: "태평양 투자 교류 협회"
 FIJ_focus_pacific_exchange_and_investment_society_desc: "케이크를 가지면서 동시에 먹을 수는 없다고들 하지만, PIES는 어떻겠습니까. 이 협회는 태평양 지역에서 교류하기 위한 훌륭한 창구가 될 것이며, 훨씬 큰 경쟁국들 사이에서 우리의 입지를 더욱 확고히 하려는 것입니다."
 FIJ_focus_phase_two_development_fund: "피지 개발 기금 2단계"
 FIJ_focus_phase_two_development_fund_desc: "1단계는 다른 중점들과 뒤섞여 다소 불분명했으나, 이제는 확실한 계획으로 나아가야 합니다. 계획은 외국인 투자를 끌어들이고, 국내 성장을 우선시하며, 국가의 수출입을 균형 있게 조절하여 경제적·대외적 독립을 강하게 유지하는 것입니다."
 FIJ_focus_security_through_community: "공동체를 통한 치안"
 FIJ_focus_security_through_community_desc: "경직된 체제 아래에서 치안 활동이 한계에 이르렀으며, 새로운 체제는 공동체의 참여를 더욱 확대합니다. 이 프로그램들은 지역 주민들이 서로 더 긴밀히 협력하도록 조직하고, 시민이 현행범을 체포할 수 있도록 하며, 공동체 참여를 통해 지역 경찰서를 확충할 수 있도록 합니다."
 FIJ_focus_the_care_balance_act: "의료 균형법"
 FIJ_focus_the_care_balance_act_desc: "CBA는 국가의 의료 및 사회복지 체계 전반을 훑어, 눈에 띄는 문제점들을 조정하고 개편하려는 법안입니다."
 FIJ_focus_the_military_reform_bill: "군 개혁 법안"
 FIJ_focus_the_military_reform_bill_desc: "의회 법안 #M253은 협상 법안으로, 군의 탈정치화를 통해 국내 훈련 프로그램을 확대할 수 있도록 군 예산을 늘리는 것입니다. 아울러 나라와 국민을 지키기 위해 목숨을 거는 장병들의 급여도 인상합니다. 시작에 불과하며, 군 투자에 대한 기대는 크지 않습니다."
 FIJ_focus_foreign_construction_contracts: "외국 건설 계약"
 FIJ_focus_foreign_construction_contracts_desc: "외국인 투자를 유치하려면 국가 지도자들뿐 아니라 기업들부터 시작해야 합니다. 건설 사업에 국내 계약업체를 지원하는 데 집중함으로써 새로운 아이디어와 자재, 그리고 섬에 정착할 새로운 인구의 물결을 끌어들일 수 있습니다."
 FIJ_focus_education_investment_package: "교육 투자 패키지"
 FIJ_focus_education_investment_package_desc: "EIP는 역내 이웃 국가들에 뒤처지지 않도록 교육 및 연구개발 예산을 전용으로 늘리는 계획입니다. 이를 통해 더 효율적인 새로운 자원과 생산 방식을 모색할 수 있습니다."
 FIJ_focus_foreign_medical_expos: "해외 의료 박람회"
 FIJ_focus_foreign_medical_expos_desc: "전 세계의 의료 기관들과 협력하면 국민의 건강과 복지, 정신적·신체적 특성, 그리고 그들이 영위하려는 생활 방식에 진정으로 다시 투자할 수 있을 것입니다."
 FIJ_focus_phase_three_development_funds: "피지 개발 기금 3단계"
 FIJ_focus_phase_three_development_funds_desc: "우리는 위대함으로 가는 길에 있습니다, 여러분. 실질적인 문제에 집중하고 과거가 낳은 분열을 가라앉힘으로써 우리는 나라를 파멸의 길이 아닌 성장의 길에 올려놓았습니다. 우리는 이 통치 방식을 더욱 굳건히 이어가 국가의 미래와 이제는 우리의 삶의 방식을 지켜내야 합니다."
 FIJ_focus_cohesive_integrations_act: "결속 통합법"
 FIJ_focus_cohesive_integrations_act_desc: "우리 조국을 이해했으니 이제는 태평양의 이웃들을 이해하려 해야 합니다. 그들의 문화와 사람들, 사회를 이해하면 앞으로 이들과 더 잘 협력할 수 있습니다."
 FIJ_focus_resource_securities_initiative: "자원 안보 구상"
 FIJ_focus_resource_securities_initiative_desc: "RSI는 국가 발전과 자원 제공자들의 이익을 위해 국내외 자원을 확보하는 일을 맡는 국가 안보 및 외교 전담 기관입니다."
 FIJ_focus_military_baseline_act: "군 기준선법"
 FIJ_focus_military_baseline_act_desc: "번영과 우리 자신 및 타국에 대한 투자라는 목표를 추구하는 과정에서 한 가지 뚜렷한 현실이 점점 분명해지고 있습니다. 따라서 군의 기본적인 준비 태세를 갖추어야 하며, 이로써 우리 같은 소국이 강대국들로부터 누려야 마땅한 안전과 안보를 우리나라와 동반국들이 느낄 수 있게 될 것입니다."
 FIJ_focus_independence_sustainment_act: "독립 유지법"
 FIJ_focus_independence_sustainment_act_desc: "국민을 지역 단위 무리로 조직하여, 공동체를 스스로 만든 단위일 뿐 아니라 더 큰 피지 국가라는 파이의 한 조각으로 결속시킵니다. 우리는 저항과 자결의 분위기를 조성하고자 하며, 중국과 수많은 더 큰 나라들이 이른바 ...의욕적으로 자국의 이익을 좇는 이 불확실한 시기에 경계를 늦추지 말아야 합니다."
 FIJ_focus_modern_industrialism_act: "현대 산업주의법"
 FIJ_focus_modern_industrialism_act_desc: "MIA는 생산 산업의 배치 방식을 더 간소화하고 해당 산업의 전반적인 효율을 높이려는 법안입니다. 그 결과 국민이 누릴 수 있는 삶의 수준도 높아질 것입니다."
 FIJ_focus_food_of_tomorrow: "내일의 식량"
 FIJ_focus_food_of_tomorrow_desc: "우리 섬은 작으므로 더 적은 것에서 더 많은 것을 확보해야 합니다. 따라서 연구개발부 산하 한 부서를 국민의 기본적인 생활 필수품을 확보하는 데 전념시킬 것입니다."
 FIJ_focus_progressive_taxes_progressive_gains: "진보적 사회를 위한 누진세"
 FIJ_focus_progressive_taxes_progressive_gains_desc: "이 세제 개혁을 통해 창출된 소득에 따라 과세 형태를 더 균형 있게 조정하고자 합니다. 세율 수준을 조정하면, 스스로의 힘으로 일어섰다는 이유만으로 누군가가 다른 이를 압도적으로 앞서가는 일이 없을 것입니다. 이제 이 새로운 수입 균형을 활용하여 모두에게 더 나은 생활 수준을 제공하고, 경제뿐 아니라 국민과 국가 전체에 다시 투자할 수 있습니다."
 FIJ_focus_united_fiji_installed: "군부, UFP 온건파 정부 수립"
 FIJ_focus_united_fiji_installed_desc: "정부가 군의 요구에 저항하자 프랭크 바이니마라마 준장은 정부를 상대로 쿠데타를 일으키고 통일 피지당의 온건파를 앉히려 하였습니다. 대부분은 이 새 정부를 군이 임명한 예스맨으로 보지만, 일부는 헌법 위기로 인해 최근 줄타기하듯 위태로웠던 입법적 반발이 이로써 재설정되기를 기대합니다."
 FIJ_focus_resetting_ethnic_legislations: "민족 관련 법제 재설정"
 FIJ_focus_resetting_ethnic_legislations_desc: "민족 간 균형을 기울게 한 것으로 보이는 법안과 법률을 축소하고, 달리 표현할 말이 없으니 재설정함으로써 이를 보다 중립적인 입장으로 되돌리고 당면한 상황에 균형 잡힌 접근을 취할 수 있습니다."
 FIJ_focus_slashing_biased_taxes: "편향된 세금 삭감"
 FIJ_focus_slashing_biased_taxes_desc: "과거 정부들은 우리 섬의 평화라는 개념에 반하여 행동했습니다. 주요 문제 중 하나는 특정 민족을 다른 민족보다 유리하게 하는 여러 은근한 조항이 담긴 세법이었으며, 우리는 이를 줄여나가기 시작할 것입니다."
 FIJ_focus_jobs_initiative: "일자리 구상"
 FIJ_focus_jobs_initiative_desc: "포괄적인 정부 지출 패키지를 통해 일자리 창출 구상에 투자하겠습니다. 이는 가능한 한 모두가 일자리를 얻도록 돕고 우리나라에 새로운 평등의 기준을 세울 것입니다."
 FIJ_focus_fijian_resource_development_program: "피지 자원 개발 계획"
 FIJ_focus_fijian_resource_development_program_desc: "FRDP는 자원 개발과 채굴을 이끌 것입니다. 이 계획은 정부 부처로 승격될 것이며, 특정 집단의 이익이 아니라 국가의 발전을 위한 것으로 더 널리 받아들여질 것입니다. 핵심은 귀중한 자원이 있는 것으로 확인된 토지는 정부 소유가 되고, 기업은 해당 자원의 채굴과 가공에 공동 소유권을 갖는다는 점입니다. 번영의 개발을 통해 국가적 단결을 도모한다는 구상입니다."
 FIJ_focus_health_not_wealth_act: "건강 우선, 부 후순위법"
 FIJ_focus_health_not_wealth_act_desc: "HNW법은 핵심 노동법 일부를 개혁하여 보통 사람들의 환경에서 더 균형 잡히고 공정한 경쟁을 만들어 내는 입법입니다. 새로운 작업장 기준을 만들고 낡고 쓸모없는 규제를 균등화하거나 아예 폐지함으로써, 국민이 더 영리하게 일하고, 더 잘 만들고, 더 오래 함께 살 수 있게 합니다."
 FIJ_focus_fiji_more_than_just_water: "피지, 물 그 이상"
 FIJ_focus_fiji_more_than_just_water_desc: "우리 섬에는 끔찍한 역사가 있으며, 이는 우리나라가 세계 여러 곳과 맺고 있는 행적과 현재 위상에서 매우 분명하게 드러납니다. 이를 알고 있는 만큼, 외국인들이 우리나라를 어떻게 생각하는지 파악하여 그들의 마음을 얻어야 합니다. 우리가 변할 수 있으며 우리 섬이 단순한 생수 광고 이상의 존재임을 보여줄 것입니다."
 FIJ_focus_researching_new_trades: "새로운 무역 연구"
 FIJ_focus_researching_new_trades_desc: "재화와 서비스 무역에 관한 연구개발에 과감히 투자합니다. 그러한 재화와 서비스를 확보하는 것과 더불어, 우리나라는 일찍이 생각지 못한 새로운 높이에 도달할 것입니다."
 FIJ_focus_unity_through_service: "복무를 통한 단결"
 FIJ_focus_unity_through_service_desc: "군은 우리 사회를 지탱해 온 가장 큰 축이었습니다. 결국 우리는 단결을 통한 힘이 이 나라를 앞으로 이끈다는 점을 인식해야 합니다. 따라서 군 지도부와의 원만한 협상을 거쳐, 군과 군 인력에 더 잘 투자하고 민간과 군사 권력을 더 분명히 분리할 수 있도록 하는 포괄적인 계획을 마련했습니다. 우리는 또 한 번의 2000년 쿠데타를 감당할 여유가 없습니다."
 FIJ_focus_peace_for_piece: "평화를 위한 조각"
 FIJ_focus_peace_for_piece_desc: "국내의 평화를 통해 우리는 해외의 한 조각을 얻습니다. 수년간 보지 못했던 수준의 안정을 우리 섬이 이루게 되자, 이제 많은 나라가 우리와 기꺼이 교역하고, 휴가를 보내고, 일하려 합니다. 이는 우리가 미래를 더 잘 내다보고 역내에서 우리의 몫을 주장하는 데 도움이 될 것입니다."
 FIJ_focus_low_income_work_houses: "저소득층 근로 주택"
 FIJ_focus_low_income_work_houses_desc: "정부가 만드는 저소득층 주택입니다. 사람들을 거리에서 구해 집과 일자리로 이끌 수 있는 전담 사업입니다. 비용은 다소 높겠지만, 안전과 안보와 번영을 확보하려면 이를 하지 않았을 때의 실제 비용을 이해해야 합니다."
 FIJ_focus_funding_a_new_sector: "신규 부문 자금 지원"
 FIJ_focus_funding_a_new_sector_desc: "새로운 지질 조사를 통해 저품위 철광석 채굴 사업에 적합한 상당한 규모의 지역을 확인했습니다. 이 국내 공급원은 경제 다변화를 뒷받침하고 가능한 곳마다 더 많은 기회를 되찾아 올 것입니다."
 FIJ_focus_finding_homes_abroad: "해외에서 보금자리 찾기"
 FIJ_focus_finding_homes_abroad_desc: "우리 노숙인 중 일부는 놀랍도록 예의 바르며 국가에 도움이 될 수 있는 사회적 기술을 갖추고 있습니다. 따라서 사회에서 저평가된 이 숙련된 이들을 받아들여 고용하고 외교부를 확대할 것입니다. 그들이 겪은 힘든 시절을 장점으로 삼으면 해외 각국의 평범한 사람들에게 더 잘 호소할 수 있을 것입니다. 이로써 세계에 피지안 드림이라는 개념을 보여주게 됩니다."
 FIJ_focus_evaluating_military_requirements: "군 입대 요건 평가"
 FIJ_focus_evaluating_military_requirements_desc: "엄밀히 말해 군대는 경제에 어떤 식으로든 기여하지 않습니다. 하지만 노숙인도 마찬가지입니다. 그러니 입대 기준과 요건을 조정하여 인위적으로 하한선을 끌어올릴 수 있다면, 노숙을 줄이고 국방력을 높일 수 있으며, 더 큰 부대를 접하게 되므로 육군 지도부와 지식 수준도 높일 수 있습니다. 결국 모두가 승자가 됩니다."
 FIJ_focus_reorganizing_homeless_shelters: "노숙인 쉼터 재편"
 FIJ_focus_reorganizing_homeless_shelters_desc: "일부 복지 프로그램의 상태는 실로 충격적입니다. 이들 시설이 쾌적하게 수용할 수 있는 인원에 맞춰 더 효율적으로 운영되도록 자금과 구조를 재편해야 합니다."
 FIJ_focus_naval_primacy_expected: "기대되는 해군 우위"
 FIJ_focus_naval_primacy_expected_desc: "우리나라는 섬나라이며, 우리 영향권에 진정한 영향을 미치려면 해군에 진지하게 투자해야 합니다."
 FIJ_focus_synthetics_centric_research: "합성 물질 중심 연구"
 FIJ_focus_synthetics_centric_research_desc: "우리 섬에는 천연자원이 여럿 있지만, 문제는 세계 규모에 비하면 현저히 부족하다는 것입니다. 이 핵심 문제를 알고 있으므로 자원의 미래를 모색할 수 있습니다. 합성 기술을 개척함으로써 세계가 일찍이 본 적 없는 제한적인 자급자족 체제를 구축할 수 있을 것입니다. 작은 각주에 불과하지만, 우리에게는 그래도 자랑스러운 국가적 표명입니다."
 FIJ_focus_streamlining_tax_code_expansions: "세법 확대 간소화"
 FIJ_focus_streamlining_tax_code_expansions_desc: "의회 법안 T:101A는 국가 전체에 부과할 수 있는 세금의 종류와 그 절차를 간소화할 것입니다. 알려진 기준을 만들면, 기업과 국민이 이러한 세금을 우회할 수는 있어도 결국 간접적으로 징수되는 세수를 늘리는 방식의 발전을 장려할 것으로 기대합니다."
 FIJ_focus_building_tall: "고층 건축법"
 FIJ_focus_building_tall_desc: "공간이 제한되고 나라도 작으니 가진 공간을 최대한 활용해야 합니다. 이를 염두에 두고 국민이 익숙해져야 할 새롭고 현대적인 기준을 모색합니다. 좋든 싫든 자동화는 미래이지만, 사람을 단순히 대체할 것이 아니라 사람과 기계를 결합해야 합니다. 생산 능력을 확충하여 우리 섬을 대부분이 상상하는 것보다 훨씬 효율적으로 만들 것입니다."
 FIJ_focus_promoting_a_frugal_lifestyle: "검소한 생활 장려"
 FIJ_focus_promoting_a_frugal_lifestyle_desc: "우리 섬을 개발하는 데는 공간이 한정되어 있고 선택지도 적습니다. 관광객에게 이른바 섬 휴양지의 분위기를 유지하려면 우리 땅의 자연미를 보존하는 데 진지한 고려가 있어야 합니다. 따라서 국민은 갖지 못한 것을 늘 걱정하기보다, 있는 그대로의 삶을 즐기고 가진 것에서 좋은 점을 찾는 법을 알아야 합니다. 물질주의는 미국인들에게 맡기십시오. 그것은 피지안의 길이 아닙니다."
 FIJ_focus_exploiting_corporatism: "조합주의 이용"
 FIJ_focus_exploiting_corporatism_desc: "우리나라에는 GDP의 상당 부분을 창출하는 국내외 기업이 많습니다. 그러나 인간 본성의 경향을 보면 그들은 권력과 돈을 원합니다. 우리는 그들과 친밀하게 지내며 겉으로는 뇌물을 받는 척하지만, 실제로는 그 돈을 일종의 비상 자금으로 활용할 수 있습니다. 예산 심의에서 다소 부족할 수 있는 사업에 자금을 대고, 경제 침체 가능성이 있을 때 평화를 유지하는 등 가능한 모든 일에 쓰는 것입니다. 물론 그들도 눈치채겠지만, 할 수 있는 동안 즐기도록 합시다."
 FIJ_focus_neutral_selectivism: "중립적 선별주의"
 FIJ_focus_neutral_selectivism_desc: "태평양의 거물인 미합중국과 중화인민공화국입니다. 이 두 나라는 결국 지나치게 거세게 충돌하게 될 것이므로, 우리는 정중하되 호의를 구하지 않아야 합니다. 미국이 투자할 가능성이 더 높지만, 중국이 그보다 더 많이 제시하고 싶어질 방향으로 이를 활용해야 합니다. 이른바 거물들을 이용하면서 그들이 간접적으로 약자를 키우게 하는 것입니다."
 FIJ_focus_innovations_sector: "혁신 부문 스타트업"
 FIJ_focus_innovations_sector_desc: "원자재가 풍부하지 않으므로, 변화하는 세계에 호응하는 다른 시장으로 뻗어나가야 합니다. 우리 기술 스타트업이 기술 산업 진출의 기반을 놓아, 가치 있는 소프트웨어와 기타 제품을 최고 입찰자에게 판매할 수 있게 할 것입니다."
 FIJ_focus_employment_commission: "고용 위원회"
 FIJ_focus_employment_commission_desc: "고용 만인법으로도 알려진 법안 5436호는 고용부를 설립하는 입법입니다. 고용 위원회는 일자리를 직접 재정적으로 지원할 수 있는 정부 주도 구상을 찾아, 일자리가 없는 이들이 실제로 일자리를 가질 기회를 얻도록 보장할 것입니다. 초기에는 비용이 더 크겠지만 시간이 지나면서 새로 생긴 기업의 세수와 수익으로 상쇄될 것입니다."
 FIJ_focus_limited_fijian_naval_expansion: "제한적 피지 해군 확장"
 FIJ_focus_limited_fijian_naval_expansion_desc: "우리의 무역과 영해는 지켜져야 합니다. 어뢰정 몇 척으로는 진정한 방어를 보장하기에 턱없이 부족합니다. 섬의 안보를 보장하기 위해 해군을 제한적이고 방어적인 태세로 진정하게 확충해야 합니다. 인력과 장비는 우리가 참여한 국내외 임무에서 얻은 지식을 바탕으로 표준화하고 개선해야 합니다."
 FIJ_focus_education_budget_expansion: "교육 예산 확대"
 FIJ_focus_education_budget_expansion_desc: "교육 예산을 확대함으로써 국민이 우리를 둘러싼 더 넓은 세계를 더 잘 이해하도록 하고, 세대가 바뀌어 감에 따라 새로운 기회를 가져올 수 있습니다."
 FIJ_focus_balancing_budgets: "예산 균형 조정"
 FIJ_focus_balancing_budgets_desc: "우리나라가 발전하고 분투하는 모습을 보았지만, 예산 부문에서의 추세도 보았습니다. 진정한 성장의 모범이 되려면 예산 면에서 유연해야 하며, 초과와 부족이 나타나는 곳을 조정할 수 있음을 이해해야 합니다."
 FIJ_focus_industrial_expansion: "산업 확장"
 FIJ_focus_industrial_expansion_desc: "우리의 실업률은 기록적으로 낮고, 무엇보다 이민 추세도 낮습니다. 우리나라 역사상 하늘이 내린 이 추세를 이어가기 위해 산업 확장을 후원해야 합니다."
 FIJ_focus_revitalization_of_foreign_perception: "대외 인식 쇄신"
 FIJ_focus_revitalization_of_foreign_perception_desc: "우리 국민뿐 아니라 주변 더 넓은 세계를 위해서도 더 나은 이미지를 만들고자 한 우리나라의 진전입니다. 우리의 아담한 섬 낙원을 위한 이 새로운 시대를 진정으로 만끽합시다."
 FIJ_focus_extracting_the_future: "미래를 캐내다"
 FIJ_focus_extracting_the_future_desc: "지질 조사와 채굴, 추출 기술의 새로운 발전 덕분에 우리가 실제로 발굴할 수 있는 가용 자원에 대한 이해를 넓힐 수 있게 되었습니다. 채굴 사업 확대를 솔직히 반기지 않는 이들도 있지만, 그럼에도 이는 우리 경제 발전 주기를 확장하고 안정적이고 꾸준하게 유지해 주는 핵심 요소입니다."
 FIJ_focus_wealthcare_act: "부유 의료법"
 FIJ_focus_wealthcare_act_desc: "우리나라의 급속한 부의 성장에 발맞추어, 우리보다 거의 100배 큰 나라들이 누리는 의료 및 은퇴 후 혜택에 대한 접근과 보살핌을 국민이 누려야 마땅합니다. 장비와 인력에 대한 일부 투자와 조달을 통해, 우리나라가 수십 년 가까이 추구해 온 의료를 만들어 낼 것입니다."
 FIJ_focus_military_radicals_force_a_junta: "군 급진파, 군사정권 수립"
 FIJ_focus_military_radicals_force_a_junta_desc: "막대한 내부 압력으로 준장은 군사정권을 수립할 수밖에 없었습니다. 슬프게도 나라는 불안에 휩싸였으나, 민족주의자들은 군과 함께 질서를 세우기 위해 결집하고 있습니다."
 FIJ_focus_martial_law_window: "계엄령 기한"
 FIJ_focus_martial_law_window_desc: "우리는 이 땅에 질서를 되찾을 것이며, 상황을 평가하는 동안 국가의 안정화에도 전념할 것입니다. 이 계엄령은 악화되는 이민 문제를 이유로 일정 기간 외국과의 왕래를 금지합니다. 많은 이들이 달가워하지 않겠지만, 우리는 견뎌내야 합니다."
 FIJ_focus_merging_police_forces: "경찰력 통합"
 FIJ_focus_merging_police_forces_desc: "군사 경찰과 민간 경찰을 구분하는 것은 자원 낭비이자 지휘 체계의 중복입니다. 따라서 두 조직을 통합하여 군에 준하는 구조 아래에 두고, 무질서와 무법 상황에서 국가와 국민을 지킨다는 통일된 목표를 확보할 것입니다."
 FIJ_focus_militarized_politics: "군사화된 정치"
 FIJ_focus_militarized_politics_desc: "정부 구조는 훌륭한 조직이며, 약간의 미세 조정과 기구 전체의 군사화를 통해 이 나라를 잘 기름칠된 기계처럼 완전히 바꿔놓을 수 있습니다. 어쨌든 의회가 민간판 참모 회의 및 작전실이 아니고 무엇이겠습니까."
 FIJ_focus_weathering_the_political_storm: "정치적 폭풍 견디기"
 FIJ_focus_weathering_the_political_storm_desc: "아직 완전히 위기를 벗어난 것은 아니지만, 그럼에도 과도한 통제의 고삐를 늦추어야 합니다. 군사정권으로서 우리가 구현하는 권위주의 때문에 세계는 이미 우리에게 깊이 반감을 품고 있습니다. 그래서 여행 금지와 계엄령을 해제하며, 이와 함께 쿠데타 이후 혼란기의 첫 공식 개혁인 제한 의료법을 통과시킵니다. 이 법안은 현재 우리 의료 분야를 괴롭히는 비용과 직접적인 과잉을 줄일 것이며, 이러한 조치가 긍정적으로 시선을 돌려주기를 바랍니다."
 FIJ_focus_transparency_in_requirements: "요건 투명성법"
 FIJ_focus_transparency_in_requirements_desc: "TRA는 민간 및 군사 관련 법률의 규칙 제정과 요건의 투명성을 전면 개편하는 법입니다. 이는 민간 사회에서 직업을 얻는 방식이나 군 사회에서의 진급과 책임에 관한 요건의 투명성에도 영향을 미칩니다."
 FIJ_focus_fijian_service_means_fijian_respect: "피지 복무는 곧 피지의 존중"
 FIJ_focus_fijian_service_means_fijian_respect_desc: "행동 강령을 개정하고 직접 알리면 오랜 앙금이 줄어들 것입니다. 처벌을 강화하고, 피지에 복무하는 이들이 곧 피지 그 자체라는 점을 문서상으로만이 아니라 실천으로도 보여줄 것입니다. 이러한 가족 같은 유대를 키움으로써 국민을 단결시키고 구세계의 영향을 떨쳐내고자 합니다."
 FIJ_focus_constitutional_safeguard: "헌법적 보호 장치"
 FIJ_focus_constitutional_safeguard_desc: "국민은 체제를 신뢰하지 않으며, 우리가 신뢰하게 만들어야 할 것은 바로 그 체제입니다. 따라서 민족적 출신을 불문하고 피지 국민 전체에 대한 부당한 대우를 국가 범죄로 규정하는 개정안을 통과시킬 것입니다. 이 포고로 수십 년간 이 나라를 찢어놓은 갈등을 치유하고자 합니다."
 FIJ_focus_foreign_advisors: "외국 고문단"
 FIJ_focus_foreign_advisors_desc: "세계가 우리에게 등을 돌린 것처럼 보이는 만큼, 우리가 국민에게, 그리고 주변 이들의 상호 이익을 위해 옳은 일을 하고자 한다는 점을 진정으로 보여줘야 합니다. 나라의 재건을 돕는 광범위한 민간 및 군사 고문단을 구성하여, 아름다운 우리 섬나라를 위한 새로운 성장의 지평을 모색할 수 있을 것입니다."
 FIJ_focus_building_upon_our_civilian_base: "민간 기반 위에 쌓기"
 FIJ_focus_building_upon_our_civilian_base_desc: "경제는 인구에 비해 작으며, 경제 규모가 전반적으로 부족하여 여러 문제를 안고 있습니다. 따라서 산업 기반을 키우기 위한 집중 투자를 통해 국민이 국가와 그 목표, 그리고 서로를 위해 일하게 할 수 있습니다."
 FIJ_focus_starting_domestic_arms_companies: "국내 방산 기업 설립"
 FIJ_focus_starting_domestic_arms_companies_desc: "피지 군은 생각해 보면...사실상 딱히 알려진 것이 없습니다. 이를 바꿔야 하며, 가장 좋은 출발점은 국내 방산 기업들을 국내에 설립하여 독자적인 피지 군의 정체성을 만드는 것입니다. 미국이나 독일 같은 나라와 견주어지는 일은 없겠지만, 우리가 사는 지역에서만큼은 분명 이름을 알릴 수 있습니다."
 FIJ_focus_bringing_jobs_back_to_fiji: "사람과 일자리를 피지로 되돌리기"
 FIJ_focus_bringing_jobs_back_to_fiji_desc: "국민은 여전히 공부든 일이든 무엇이든 이유를 막론하고 나라를 떠나고 있으며, 우리는 여전히 나라를 괴롭히는 이민 문제에 시달리고 있습니다. 따라서 이러한 탈출을 낳는 문제에 더 직접적이고 정밀하게 투자해야 합니다."
 FIJ_focus_establishing_the_university_of_fiji: "피지 대학교 설립"
 FIJ_focus_establishing_the_university_of_fiji_desc: "교육...사회의 이 근본적 기둥은 나라와 국민의 미래를 생각할 때 가장 중요한 중점 중 하나가 되어야 합니다. 이 기둥은 민간과 군사 양쪽에 모두 활용될 수 있으며, 이는 최대한 구현될 것입니다."
 FIJ_focus_fijian_care_act: "피지 국가 의료법"
 FIJ_focus_fijian_care_act_desc: "FNCA는 우리 사회의 고령 인구에 영향을 미치는 프로그램에 다시 투입하기 위한 계획입니다. 정치 무대의 모든 감정적 열기와 달리, 노인들은 생각하는 것 이상으로 더 많은 문제를 일으킵니다. 그러니 은퇴 후 안락한 생활 등을 통해 이들을 조용하게 만들 수 있다면, 현역 인구의 필요를 더 잘 평가할 수 있을 것입니다."
 FIJ_focus_increase_funding_for_the_fcoe: "FCoE 자금 증액"
 FIJ_focus_increase_funding_for_the_fcoe_desc: "민군 융합의 기반은 피지 공병대입니다. 군과 민간 양쪽의 활용을 개선하기 위해 이 부대를 확대할 수 있도록 자금을 늘려야 합니다."
 FIJ_focus_deboning_healthcare_excesses: "의료 과잉 발라내기"
 FIJ_focus_deboning_healthcare_excesses_desc: "수십 년의 정치적 혼란과 끊임없는 정부 교체로 인해 점검과 감독이 없는 프로그램들이 방치되면 부패와 자금 유실이 어느 정도 만연하리라고 누가 생각이나 했겠습니까. 의료 체계의 전면적인 재작성, 사실상의 재출발이 필요합니다. 이를 통해 우리가 지금 맞닥뜨린 변화와 우리나라가 진정 스스로의 회복의 길 위에 서 있다는 현실을 속죄할 백지 상태를 만들 수 있습니다."
 FIJ_focus_national_rotc_curriculum: "국가 ROTC 과정"
 FIJ_focus_national_rotc_curriculum_desc: "미국 같은 곳에서는 일부 학교에 군 병과가 운영하는 프로그램이 있어, 군 조직 구조를 통해 민간 세계에도 적용되는 리더십 교육을 학생들에게 가르칩니다. 이것이 미래이며 우리가 필요로 하는 학교 제도의 핵심입니다. 중학교 입학부터 모든 학교가 이 형식을 따르고, 각 졸업 연도의 학생들은 이른바 '부대'로 조직될 것입니다. 팀워크를 통해 공동체 의식, 리더십, 혁신에 대한 지식을 길러 우리 젊은이들이 진정으로 이해하고 대비할 수 있는 미래를 만들고자 합니다."
 FIJ_focus_barracks_housing_initiative: "병영 주거 구상"
 FIJ_focus_barracks_housing_initiative_desc: "BHI법은 국내 주택 부족에 접근하는 새로운 방식이 될 것입니다. 노숙인들은 비슷한 처지의 사람들과 함께 병영식 주거 시설에 거주할 수 있습니다. 그러한 환경에서 일자리 프로그램과 군대식 일과를 통해 재기할 수 있으며, 체제가 자신들을 버렸다고 믿는 이들에게 의욕을 다시 불어넣을 것입니다. 이른바 기초 훈련 같은 이 프로그램을 통해 소득을 쌓아, 프로그램 밖에서 일자리를 얻고 병영 단지 밖의 집으로 옮겨 갈 수 있도록 합니다."
 FIJ_focus_resource_extractions_act: "자원 채굴법"
 FIJ_focus_resource_extractions_act_desc: "REA는 노숙인과 교정 시설 수감자들이 생계를 꾸리고 국가 발전에 올바르게 기여하는 방편으로 일자리를 구할 수 있도록 우선 배려할 것입니다. 이 법으로 국내에서 확보할 수 있는 자원을 파악하고 확대하고자 합니다."
 FIJ_focus_expand_the_fcoe: "피지 공병대 확대"
 FIJ_focus_expand_the_fcoe_desc: "새로운 기반시설과 주택, 그리고 경제 전반에 대한 수요가 커지는 만큼, 우리는 다리의 쐐기돌을 확대해야 합니다. 그 쐐기돌이 바로 피지 공병대, 즉 FCoE입니다. 이 확대로 군의 하위 병과에 더 많은 자원과 인력이 배정되면서 개발을 더 빠르고 포괄적으로 처리할 수 있을 것입니다."
 FIJ_focus_tax_rebalancing_act: "세금 재조정법"
 FIJ_focus_tax_rebalancing_act_desc: "군사 의회는 세금 재조정법을 통과시켰습니다. 이에 따라 현행 세법 전반을 개별적으로 검토하여, 집을 잃은 이들에게 부과되던 불합리한 세금을 바로잡을 수 있게 됩니다."
 FIJ_focus_expanding_the_ministry_of_science: "과학부 확대"
 FIJ_focus_expanding_the_ministry_of_science_desc: "우리나라가 세계에 뒤처지는 것은 땅이 작아서만이 아니라 진정으로 혁신하지 못하기 때문입니다. 우리는 외국 자문 위원회를 만들어 외국의 도움을 구했습니다. 그러나 이제 그만, 우리가 어딘가에 이를 수 있음을 세계에 보여줄 것이며, 이를 위해 과학부와 우리나라의 기술 연구개발 역량 전반에 막대하게 투자할 것입니다."
 FIJ_focus_soldiers_lifestyle_act: "군인 생활 기준법"
 FIJ_focus_soldiers_lifestyle_act_desc: "의회는 표준적인 생활 수준의 진정한 하한선을 정하는 포고를 통과시키기로 하였습니다. 그 하한선이란 우리 군에 복무하는 평균적인 군인의 생활입니다. 이는 일부가 누리지 못하는 것을 희생하여 우리 국민이 무엇을 누리는지에 대한 국가적이고 세대에 걸친 이해를 만들어 냅니다."
 FIJ_focus_the_citizen_soldiers_act: "시민 군인법"
 FIJ_focus_the_citizen_soldiers_act_desc: "의회는 모든 시민이 국가의 군인이며 모든 군인이 국가의 시민이라는 헌법 개정안인 시민 군인법을 통과시켰습니다. 이 개정안은 사실상 피지에 복무하는 이들 자체가 피지인이라고 선언하는 것으로, 피지인이라는 개념이 일부가 내세우고 싶어하는 유사과학적 인종이나 민족 따위가 아님을 명확히 합니다. 피지, 혹은 피지인이 된다는 것의 의미는 국가와 그 이념에 대한 헌신에 있습니다."
 FIJ_focus_energizing_the_nation: "국가에 활력을"
 FIJ_focus_energizing_the_nation_desc: "군과 민간의 수요를 적절히 균형 잡으려면 에너지망을 확충해야 합니다. 안정적인 전력망과 연료 공급은 앞으로의 여정에 안정성과 선견지명을 보여줄 것입니다."
 FIJ_focus_naval_industrialism: "해군 산업주의"
 FIJ_focus_naval_industrialism_desc: "우리는 섬나라이며, 군수 생산을 함선 쪽으로 집중하는 것은 당연한 일입니다. 우리가 한낱 미화된 군사 기지에 불과하다면 미국이나 오스트레일리아 같은 외국 강국들에게 어떻게 호소할 수 있겠습니까."
 FIJ_focus_energy_diversity_act: "에너지 다변화법"
 FIJ_focus_energy_diversity_act_desc: "EDA는 외국의 착취로부터 우리나라를 더 잘 방어할 수 있도록 에너지망의 다변화를 의무화할 것입니다. 모든 달걀을 하나의 에너지 바구니에 담는 것은 어떤 형태로든 공격을 받을 때 즉각적인 혼란을 부르는 지름길입니다."
 FIJ_focus_mining_the_future: "미래를 채굴하다"
 FIJ_focus_mining_the_future_desc: "우리에게 자체 자원이 있다는 것을 알고 있으며, 이를 활용하여 나라를 발전시키고 기본적인 경제적 수요에 대한 외부의 간섭을 막아야 합니다."
 FIJ_focus_naval_priorities: "해군 우선 순위"
 FIJ_focus_naval_priorities_desc: "우리는 군에 강력하고 균형 잡힌 모병을 추구하지만, 우리가 말 그대로 섬이라는 점도 알고 있습니다. 따라서 증액되는 자금은 다른 병과보다 해군 쪽으로 기울겠지만, 건전하지 못한 군 간 갈등은 필요 없으므로 지나치지는 않을 것입니다."
 FIJ_focus_civilian_air_training: "민간 항공 훈련"
 FIJ_focus_civilian_air_training_desc: "그러니까...공군에 관한 우리의 역사가 꽤 험난했다는 것은 압니다. 하지만 과거가 현재의 상황, 하물며 앞으로의 존립을 위한 노력을 좌우하도록 둘 수는 없습니다. 그러므로 민간 기반의 훈련 프로그램과 항공기를 활용하여 공군 병과의 첫걸음을 시작하고 도입할 것입니다. 느린 과정이겠지만, 이 현대에 살아남으려면 필요한 일입니다."
 FIJ_focus_prussia_of_the_pacific: "태평양의 프로이센"
 FIJ_focus_prussia_of_the_pacific_desc: "우리 국가는 프로이센과 같은 나라의 현대적 구현입니다. 민간과 군의 생활 방식을 하나의 응집된 기계로 빚고 융합함으로써 피지에 새로운 시대가 열렸습니다. 우리는 작지만 자랑스럽고, 높이 짓고 큰 소리로 말하며, 지역 강국으로서 다른 모든 나라와 마찬가지로 우리의 목소리를 낼 것입니다."
 FIJ_focus_monarchist_acendence: "군주주의의 부상"
 FIJ_focus_monarchist_acendence_desc: "군 내부의 분쟁이 우리나라를 올바른 길로 이끌었습니다. 피지의 형제자매 여러분, 우리는 신 아래, 그리고 피지의 깃발 아래 하나로 단결해 있습니다. 우리는 스스로의 운명의 주인이며, 민주주의는 형태를 유지하기에 너무 불안정함이 입증되었습니다. 그러므로 타협하여 새로운 사회를 만들어야 합니다. 민족주의가 있고, 군사력이 있으며, 피지인이 된다는 것이 단순히 민족성 이상을 의미하는 사회입니다."
 FIJ_focus_the_kingdoms_quarrels: "왕국의 분쟁"
 FIJ_focus_the_kingdoms_quarrels_desc: "정치 상황은 좋게 봐도 위태롭고 나쁘게 보면 터무니없이 낡았습니다. 내각을 규합하고, 정부를 공식화하며, 우리나라의 가장 큰 문제들을 평가해야 합니다."
 FIJ_focus_the_kingdoms_economy: "왕국의 경제"
 FIJ_focus_the_kingdoms_economy_desc: "이 세계에서 어디에든 이르고자 한다면 진정한 경제가 있어야 합니다. 다양성이 핵심이고, 그 뒷받침은 그 경제에 걸맞은 인재를 두는 것입니다. 그래도 어딘가에 이르려면 여기저기 발품을 팔아야 할 것입니다."
 FIJ_focus_the_ethnic_divides: "민족 분열"
 FIJ_focus_the_ethnic_divides_desc: "우리나라의 민족 분열은 초기 영국 식민주의 시절로 거슬러 올라갑니다. 인도 출신의 많은 식민지 신민들이 영국의 금고를 채우던 사탕수수 농장과 제당 회사에서 일하도록 피지로 들여왔습니다. 이러한 분열과 강제 이주는 1970년대 우리나라의 독립 이후 줄곧 매우 긴장된 상태였습니다. 따라서 실제로 권력을 유지하고자 한다면 이는 우리가 해결해야 할 가장 큰 우선 과제 중 하나입니다."
 FIJ_focus_police_standards_act: "경찰 기준법"
 FIJ_focus_police_standards_act_desc: "의회는 피지 경찰력을 구성하는 기준을 재편하는 법안을 통과시켰습니다. 모든 행동 강령은 절차와 표현 면에서 다듬어 재정비되어, 상황이 어떠하든 모든 행위는 당면한 상황에 근거하여 공정하게 평가되어야 한다는 사실과 현실을 강조합니다. 인명이나 재산에 대한 위협이 진행 중이지 않은 한 어떤 민간인이나 피지 시민에 대해서도 공격적 행위가 있어서는 안 됩니다. 이러한 조치는 올바른 바퀴를 굴리기 시작할 것입니다."
 FIJ_focus_sponsored_emigration_deals: "후원 이민 협정"
 FIJ_focus_sponsored_emigration_deals_desc: "단기적으로는 비용이 들지만 장기적으로는 비정통적인 수단을 쓰더라도 훨씬 빠르게 나라에 안정이 찾아올 것입니다. 인도계 주민들과 후원 이민 협정을 맺으면 우리나라를 축소하고 간접적으로 동질화하는 한편, 진정으로 남기를 원하는 이들과 함께 일할 수 있습니다. 누구에게나 대가가 있지만, 누구에게나 선택도 있습니다."
 FIJ_focus_hiring_practices_act: "채용 관행법"
 FIJ_focus_hiring_practices_act_desc: "차별 금지법의 문언을 표준화하고 재확인하는 법안이 통과되었습니다. 우리가 가진 것은 허점이 상당히 많았던 듯하므로, 경기장을 바로잡는 것이 우리 아름다운 나라의 모든 시민에 대한 착취와 차별을 막을 것입니다."
 FIJ_focus_equal_standard_care_act: "동등 기준 의료법"
 FIJ_focus_equal_standard_care_act_desc: "ESCA는 의료든 복지든, 공공이든 민간이든 모든 형태의 보살핌이 동일한 기본 수준을 갖추어야 한다는 법적 하한선입니다. 누가 아프든, 누가 은퇴했든 이 나라의 시민이 보살핌을 받아야 하며, 민족을 불문하고 그 보살핌을 누려야 함을 보장해야 합니다."
 FIJ_focus_redrafting_the_constitution: "헌법 재작성"
 FIJ_focus_redrafting_the_constitution_desc: "헌법이 진정으로 재작성된 지 꽤 오래되었습니다. 이를 염두에 두고 통치 구조를 제시해야 합니다. 훗날 나라가 스스로 무너지지 않도록, 나라가 세워질 평등과 사회적 자유의 토대를 제시해야 합니다."
 FIJ_focus_addressing_the_brain_drain: "두뇌 유출 해결"
 FIJ_focus_addressing_the_brain_drain_desc: "우리나라는 이제 존재하는 것만으로 손해를 보고 있습니다. 국민은 더 나은 기회와 더 나은 삶을 찾아 떠납니다. 나라를 성장시키려면 나라와 국민에 투자하고 보살펴야 합니다."
 FIJ_focus_establishing_the_reseach_and_development_ministry: "연구개발부 설립"
 FIJ_focus_establishing_the_reseach_and_development_ministry_desc: "연구개발부, 줄여서 연구부의 창설과 공식화는 우리 사회의 근본적인 기둥이 될 것입니다. 우리나라의 교육과 혁신적 특성을 총괄할 수장을 둠으로써 조직하고, 자금을 대고, 그리고 혁신하기가 더 수월해집니다."
 FIJ_focus_employment_assistance_programs: "고용 지원 프로그램"
 FIJ_focus_employment_assistance_programs_desc: "우리나라의 실업과 불운으로 인생이 멈출지 모른다는 두려움은 사람들이 떠나게 만드는 강력한 동력이 될 수 있습니다. 따라서 시민이 새로운 일자리로 옮겨 가는 것을 일시적으로 돕는 일련의 예방 프로그램을 마련해야 합니다. 청구서를 밀릴 수 있는 달에 도움이 되는 소액 수당이나, 일자리를 더 빨리 찾도록 돕는 구인 게시판 같은, 결국 사람들이 삶이 멈춘 듯한 느낌을 받지 않고 취업과 실업 사이를 매끄럽게 이어주는 것들입니다."
 FIJ_focus_specializing_medical_research: "의료 연구 전문화"
 FIJ_focus_specializing_medical_research_desc: "우리 국민은 많지 않으므로 이 나라의 한 생명 한 생명이 비교적 훨씬 더 소중합니다. 연구개발의 상당 부분이 의료 분야 전반의 선도적 기술에 투입되도록 보장해야 합니다. 네, 비용이 들겠지만 인구를 최대한 활용하려면 국민이 최고의 보살핌을 받아야 합니다."
 FIJ_focus_expanding_education_funding: "교육 자금 확대"
 FIJ_focus_expanding_education_funding_desc: "국가 교육 제도에 대한 전반적인 투자를 확대하면 더 똑똑한 시민의 새로운 세대를 길러낼 수 있습니다. 그들이 얻는 지식은 다시 우리나라와 우리의 미래를 발전시키는 데 쓰일 것입니다."
 FIJ_focus_creating_the_research_institute_of_fiji: "피지 연구소 설립"
 FIJ_focus_creating_the_research_institute_of_fiji_desc: "RIF는 태평양 과학 발전의 자랑이 될 것입니다. 혁신에 대한 우리의 투자와 전념은 국민이 머물고 싶게 하고, 스스로뿐 아니라 나라 전체를 더 낫게 만들고 싶게 할 것입니다. 또한 이 기관을 군사 개발과 국력 투사에서의 연성 권력 수단으로도 활용할 수 있습니다."
 FIJ_focus_reviewing_the_housing_crisis: "주택 위기 검토"
 FIJ_focus_reviewing_the_housing_crisis_desc: "선진 서방 세계에서 주택 위기란 자산 시장의 붕괴를 뜻합니다. 그러나 우리의 경우 주택 위기는 노숙 문제의 증가에서 비롯됩니다. 인구는 적은데도 우리의 노숙 문제는 아프리카 일부 나라에 필적합니다. 이 섬뜩한 현실을 이해하면 이 커져 가는 시련을 어떻게 해결할지 결단력 있게 정할 수 있으며, 어쩌면 이러한 연쇄가 다시 일어나는 것을, 혹은 적어도 같은 규모로 되풀이되는 것을 막을 수 있을지도 모릅니다."
 FIJ_focus_increased_homeless_shelter_funding: "노숙인 쉼터 자금 증액"
 FIJ_focus_increased_homeless_shelter_funding_desc: "현재의 노숙인 프로그램은 도움이 필요한 이들을 제대로 돌볼 만큼의 자금을 받지 못하고 있습니다. 직접적인 증액 투자를 통해 이 시민들이 어려운 시기에 재기할 때까지 받을 수 있는 보살핌의 질을 더 잘 보장할 수 있습니다."
 FIJ_focus_royal_engineers_program: "왕립 공병 계획"
 FIJ_focus_royal_engineers_program_desc: "REP는 육군 공병대 안에 민간 고용 시장을 열 것입니다. 이 공병대의 민간 부문은 공공사업, 정부 후원 건설 일자리 등에 투입될 것입니다. 실직하여 집을, 나아가 생계 전체를 잃을 위험에 처한 사람에게 기본적인 일자리를 제공한다는 구상입니다. 그렇게 하면 시민들이 딛고 설 단단한 바닥을 만들어, 돌아올 수 없을지도 모른다고 두려워하는 심연으로 추락할 것 같은 느낌을 받지 않게 할 수 있습니다."
 FIJ_focus_young_business_leaders_program: "청년 기업 지도자 계획"
 FIJ_focus_young_business_leaders_program_desc: "YBL 계획은 새로운 미래의 기업 지도자들에게 영감을 주고 돕는 정부 구상입니다. 누구나 사업을 소유하고 운영할 능력이 있지만, 진정으로 그렇게 하고자 하는 이들은 YBL 계획에 참여하여 이를 이룰 수 있습니다. 경영 기술을 가르치고 무손실 대출을 받아주고 상환받음으로써, 우리 미래 경제의 기둥을 빚어내는 데 탁월한 긍정적 환경을 조성합니다."
 FIJ_focus_resource_development_initiative: "자원 개발 구상"
 FIJ_focus_resource_development_initiative_desc: "RDI는 국내 자원을 다변화하기 위한 경제 분야의 정부 선도 사업입니다. 우리가 말 그대로 섬이기 때문에 선택지가 제한적이라는 것은 압니다. 그러나 이것이 우리에게 가치 있는 것이 없다는 뜻은 아닙니다. 오히려 우리는 광석과 광물이 적절히 섞여 있어 경제를 잘 다변화할 수 있습니다. 다만 판세를 계속 우리에게 유리하게 유지하려면 국내 기반 자원이 좀 더 필요합니다."
 FIJ_focus_new_economic_planning_board: "신 경제 기획원"
 FIJ_focus_new_economic_planning_board_desc: "EPB는 도시 기획자와 국내외 투자자들이 새롭고 계속 확장하는 경제를 구축하도록 도울 것입니다. 이를 통해 새로운 자본을 끌어들이고, 외국 기업을 지원하고 우리 생산품을 수출하는 형태로 제한적인 연성 권력 투사를 행사할 수 있습니다."
 FIJ_focus_ensuring_a_steeling_future: "강철 같은 미래 보장"
 FIJ_focus_ensuring_a_steeling_future_desc: "충분한 국내 강철의 개발과 조달은 우리가 사실상 기능할 수 있게 해줍니다. 강철은 우리가 사는 현대 세계를 이루는 주요 자원이자 재료 중 하나입니다. 따라서 국내 공급을 확보하면 어느 정도 경제적 독립을 유지할 수 있습니다."
 FIJ_focus_phase_one_business_development: "1단계 사업 개발"
 FIJ_focus_phase_one_business_development_desc: "경제 부흥의 첫 결실이 나타나고 있으며, 머지않아 번영을 만끽할 수 있을 것입니다."
 FIJ_focus_oiling_our_nation: "나라에 기름칠"
 FIJ_focus_oiling_our_nation_desc: "폭넓은 조사와 연구를 통해 국내 석유 공급 확보 계획에 전념할 수 있게 되었습니다. 현대의 초석인 석유를 통해 우리의 미래와 에너지 및 석유화학 수요를 확보할 것입니다."
 FIJ_focus_diversifying_the_naval_industries: "해군 산업 다변화"
 FIJ_focus_diversifying_the_naval_industries_desc: "우리에게는 강력한 조선 산업이 있지만, 다변화하여 섬 안에서 민간 및 군사 관련 산업이 모두 확대되도록 해야 합니다. 우리나라 영토를 지키고 다른 나라들과 경쟁하는 방식에서 작은 지분을 확보할 수 있어야 합니다."
 FIJ_focus_rubber_banding_the_nation: "나라를 고무줄로 묶다"
 FIJ_focus_rubber_banding_the_nation_desc: "합성 기술의 돌파구 덕분에, 특별히 생산해야 하는 한정된 천연 고무 재고에서 상당한 규모의 국내 고무 공급을 확보할 수 있었습니다. 비용이 조금 더 들 수 있으나, 장기적으로 이 증강은 우리가 현실적으로 가능한 만큼의 자급자족을 향한 또 한 걸음을 보장할 것입니다."
 FIJ_focus_phase_two_business_development: "2단계 사업 개발"
 FIJ_focus_phase_two_business_development_desc: "사업 성장과 경제 확대를 위한 지속적인 투자는 의심할 여지없이 우리가 꾸준한 속도로 성장하게 해 줄 것입니다."
 FIJ_focus_pacific_economics_exchange_commission: "태평양 경제 교류 위원회"
 FIJ_focus_pacific_economics_exchange_commission_desc: "지역적 인정을 얻고 태평양을 두고 다투는 강국들에게 약간의 골칫거리가 되려는 우리의 모험은 우리 최고의 성과가 될 것입니다. 태평양 경제 교류 위원회는 우리나라와 태평양 지역 내 다른 나라들 사이의 협력 수단입니다. 위원회의 목표는 우리와 다른 섬나라들 간의 협력과 단결을 증진하여, 적어도 연성 권력 행사의 측면에서 폭넓은 현상 유지를 확립하는 것입니다."
 FIJ_focus_royal_military_expansion_program: "왕립 군 확장 계획"
 FIJ_focus_royal_military_expansion_program_desc: "군의 전반적인 확충과 자금 지원은 국내 보안과 해외 지원 임무를 확대할 수 있게 해 줄 것입니다. 그뿐 아니라 군이 성장하면 국가와 국민에 대한 의무감과 명예심을 심어주어 다가올 미래 세대를 빚어낼 수 있습니다."
 FIJ_focus_royal_military_contracts: "왕립 군 계약"
 FIJ_focus_royal_military_contracts_desc: "RMC는 국내 무기 생산을 시도하기 위한 장려 계획입니다. 솔직히 무시할 수준은 아니지만, 그럼에도 군을 제대로 보급하고 훈련을 개선하며 훈련에 필요한 전체 시간을 줄여 줄 것입니다."
 FIJ_focus_royal_fijian_dream: "왕립 피지안 드림"
 FIJ_focus_royal_fijian_dream_desc: "왕립 피지안 드림이란 과거를 떠올리되 현재의 기준에 맞추어 실행하는 것입니다. 민주주의의 초석을 유지한다는 헌법적 선언을 재확인하되, 관직과 직함의 이름만 바꿀 뿐입니다. 이것이 우리의 통치 방식에 겉치레 멋을 더할 뿐인가, 그렇습니다. 그렇다고 국가와 국민을 보살피겠다는 우리의 약속의 가치를 깎아내리는가, 결코 아닙니다. 때로는 약간의 자존심 고취가 항상 스스로를 믿지는 못하는 많은 이들에게 놀라운 효과를 낼 수 있습니다."
 FIJ_focus_technate_council_emerges: "테크네이트 평의회 등장"
 FIJ_focus_technate_council_emerges_desc: "피지에서는 많은 저명한 기술 전문가들이 해외에서 공부했습니다. 테크네이트 평의회는 경제학자, 과학자, 그 밖의 기술 전문가들 가운데 존경받는 한 분파가 스스로를 하나의 권력 블록으로 집결시킨 집단입니다. 끝없어 보이는 혼란과 파벌 다툼 속에서 테크네이트 평의회는 자신들의 인맥과 영향력을 이용해 직간접적인 방법으로 파벌 지도자들을 제압하였습니다. 그 결과 평의회가 국가의 지도력을 장악하였고, 피지를 인간의 독창성과 혁신의 모범으로 만들기 위해 노력할 것입니다."
 FIJ_focus_a_technocratic_constitution: "기술관료제 헌법"
 FIJ_focus_a_technocratic_constitution_desc: "모든 기술관료제의 근본은 통치 기구가 한 종의 하위 범주가 아니라 종 전체의 발전을 위해 존재한다는 점입니다. 따라서 우리는 나라의 헌법을 재작성하여 사상 최초의 기술관료제 헌법을 만들 계획입니다. 요점은 재작성하면서 정리하겠으나, 지금 중요한 점은 우리가 스스로를 피지인이라 부르고 피지라는 국민국가를 두고 있지만, 앞으로 이 나라의 통치 기구 아래 있는 모든 인간은 평등하게 대우받는다는 것입니다. 인간은 인간이며, 우리는 한 종이고, 우리 종의 미래와 진보를 공고히 하기 위해 함께 노력해야 합니다."
 FIJ_focus_human_treatment_amendment: "인간 대우 수정안"
 FIJ_focus_human_treatment_amendment_desc: "인간 대우 수정안은 변이 여하를 막론하고 인류의 모든 구성원이 인간으로 대우받는다고 명확한 문언으로 규정합니다. 이는 알려진 과학적 이해의 범위 안에서 신념, 외모 또는 개인 정체성의 차이를 이유로 같은 종의 다른 구성원에게 가해진 모든 부당한 위해 행위가 형법에 규정된 법률에 따라 엄중히 처벌됨을 뜻합니다."
 FIJ_focus_voting_requirements_amendment: "투표 요건 수정안"
 FIJ_focus_voting_requirements_amendment_desc: "투표 요건 수정안은 이 민주 정부의 현대에 투표를 어떻게 할 것인가에 대한 간단하고 명료한 답입니다. 투표 연령은 법적으로 성인이 되고 자신의 삶의 선택과 행동에 대한 개인적 책임을 이해하는 것으로 인정되는 18세입니다. 등록된 모든 국민은 투표할 수 있으며, 이는 악의적인 외국 적대 세력이 직접 민주주의의 개방성을 악용하는 것을 막기 위한 것입니다. 투표는 집이나 휴대전화, 또는 지역 행정 건물에서 접속할 수 있는 정부 웹사이트를 통해 이루어집니다. 투표자는 이중 투표와 기타 악의적인 방해 행위를 막기 위해 시민 신분 번호를 입력할 수 있어야 합니다."
 FIJ_focus_working_standards_amendment: "근로 기준 수정안"
 FIJ_focus_working_standards_amendment_desc: "작업장 환경과 일자리의 기준에 관한 수정안은 우리가 근본적으로 나라를 이끌고자 하는 새로운 방향을 담고 있습니다. 핵심 조항은 순환 근무제의 즉각적인 분석과 시행입니다. 이는 흔히 4 & 4 근무제로 알려져 있습니다. 하루 4시간, 주 4일이 우리 시민의 표준 근무 주간이 됩니다. 이 도입에는 당연히 시간이 걸리겠지만, 이러한 구성은 최대의 고용과 노동자 유지, 그리고 행복을 보장합니다."
 FIJ_focus_funding_our_future: "우리의 미래에 투자하다"
 FIJ_focus_funding_our_future_desc: "기술관료제 미래로 가는 여정의 핵심은 미래 세대가 더 넓은 세계와 그 너머의 정보를 적응적으로 배우도록 하는 것입니다. 어떤 이는 시각적으로 배우고, 어떤 이는 직접 해보며 배웁니다. 그러나 모든 것은 하나의 스펙트럼이며, 우리가 그 스펙트럼에 맞추지 못하면 이들이 어떻게 배우고 적응할 수 있는지 진정으로 신경 쓰지 않음으로써 한 계층을 만들고 그들에게 해를 끼치기만 할 것입니다."
 FIJ_focus_growing_our_manufacturing_base: "제조업 기반 확대"
 FIJ_focus_growing_our_manufacturing_base_desc: "진보하는 미래를 이루려면 국가뿐 아니라 경제도 성장해야 합니다. 이 중점은 경제 성장에 전념하는 중점을 시작하며, 사회 발전과 투자라는 보조 기둥도 함께 둘 것입니다."
 FIJ_focus_building_the_institute_of_automation: "자동화 연구소 건설"
 FIJ_focus_building_the_institute_of_automation_desc: "RPP, 즉 연구 낙원 계획은 우리나라와 나아가 이 행성의 우리 종을 우리가 상상해 온 미래로 이끌 것입니다. 자동화 연구소를 시작으로 이 기관을 활용하여, 우리가 건설하고 생산하고 창조하는 데 쓸 새로운 기술과 방법을 더 잘 자동화하고 통합하는 혁신과 연구에 전념할 것입니다. 더 저렴하고 빠른 속도로 더 많이 만들어 내는 기준을 세움으로써, 가능한 한 모든 이에게 전후 시대 이래 볼 수 없었던 새로운 생활 수준을 제공하기를 바랍니다."
 FIJ_focus_dedicated_welfare_funding: "복지 전담 자금"
 FIJ_focus_dedicated_welfare_funding_desc: "시민이 생산적이고 협조적이기를 원한다면 우리도 그들을 돌봐야 합니다. 존중은 쌍방향이며, 감정적 영향과 무관하게 우리는 모두 같은 종의 구성원이므로, 헌법적 포고에 따라 서로를 그렇게 돌봐야 합니다."
 FIJ_focus_tech_industrial_investments: "기술 산업 투자"
 FIJ_focus_tech_industrial_investments_desc: "더 넓은 세계 경제에 대한 우리의 이해는 기술 산업이 핵심임을 충분히 보여줍니다. 이를 알고 있으니 우리도 이 경쟁에 참여하여 연구 낙원 계획의 일부로 통합할 수 있습니다."
 FIJ_focus_institute_for_resource_development: "자원 개발 연구소"
 FIJ_focus_institute_for_resource_development_desc: "IRD는 자원 채굴, 정제, 합성물 방법에 연구를 전념할 것입니다. 이러한 개편과 전념은 경제적 자급자족을 향한 발전의 기반을 놓고, 우리가 더 나은 내일을 만들 수 있음을 세계에 보여줄 것입니다."
 FIJ_focus_institute_for_energy_development: "에너지 개발 연구소"
 FIJ_focus_institute_for_energy_development_desc: "IED의 설립은 에너지를 생산하는 새로운 방법을 개발하기 위한 것입니다. 이는 이러한 새로운 생산 방식을 전반적으로 더 효율적이고 생산적으로 만드는 데까지 이어집니다. 따라서 연구 낙원 계획의 이 새로운 확장은 외국 열강으로부터 더 많은 에너지 독립을 확보하는 데 도움이 될 것입니다."
 FIJ_focus_labour_corps: "노동 군단"
 FIJ_focus_labour_corps_desc: "노동 군단은 새로운 공공사업과 새로운 기반시설 전반의 개발과 건설을 조직하고 우선시하기 위한 정부 후원 구상입니다. 이 군대식 민간 조직은 어떤 평범한 선진국도 낼 수 없는 속도로 건설할 수 있게 해 줄 것입니다. 이는 규제의 조직화와 간소화, 그리고 필요를 직접 공략하여 해결하는 방식 덕분입니다."
 FIJ_focus_labour_prison_program: "노동 교정 계획"
 FIJ_focus_labour_prison_program_desc: "LPP는 형사 제도와 관련한 갱생 철학입니다. 죄를 짓고 수감된 이들은 기본적인 보살핌과 관심을 받게 됩니다. 그러나 모든 수감자는 LP 계획에 등록할 수 있으며, 이 계획에서 수감자는 에너지 크레딧을 벌 수 있는 전담 일자리를 갖게 됩니다. 이 크레딧은 이른바 개선 사항을 일정량 교환하여 수감 생활의 최저 수준을 보다 견딜 만한 상태로 끌어올리는 데 쓸 수 있습니다. 모든 개선 사항을 구입한 뒤에는 범죄에 따라 수감자가 일정량의 에너지 크레딧으로 형기를 줄일 수 있습니다. 이 비율은 처음에는 수감 유지에 유리하게 편향되어 있겠지만, 결국 목표는 노동과 헌신을 통한 갱생을 장려하고 수감자가 사회에 복귀할 준비를 하게 하는 것입니다."
 FIJ_focus_increasing_domestic_steel: "국내 강철 증대"
 FIJ_focus_increasing_domestic_steel_desc: "폭넓은 조사와 연구를 통해 국내 강철 생산 개발에서 돌파구를 마련했습니다. 많은 양은 아니지만, 그럼에도 자급자족을 높이기 위한 좋은 출발점입니다."
 FIJ_focus_technocratic_militarism: "기술관료제 군국주의"
 FIJ_focus_technocratic_militarism_desc: "우리 종의 역사에서 흔한 단결의 원칙은 조국과 이를 위해 복무하는 이들에 대한 의무와 명예입니다. 우리는 군을 강화하기 위한 연구개발에 상당한 주석을 달아야 합니다. 프랑스나 독일 같은 나라와 대등하게 서지는 못하겠지만, 적어도 소형 미국 군대를 흉내 낼 수는 있을 것입니다. 꿈은 꿀 수 있지요...꿈은 꿀 수 있으니까요."
 FIJ_focus_research_paradise_program: "연구 낙원 계획"
 FIJ_focus_research_paradise_program_desc: "거의 3년간의 개발 끝에 마침내 우리의 궁극적 목표를 풀어놓을 수 있습니다. 연구 낙원 계획은 세계 과학계의 초석 역할을 하며, 막대한 자금을 투입해 모든 분야의 연구자들이 연구하고, 실험하고, 탐구할 수 있는 휴양지 같은 거점을 만들 것입니다. STEM 분야가 미래일 뿐 아니라 일반적인 휴가만큼 즐거운 것으로 여겨지는 이른바 세계를 만들 것입니다."
 FIJ_focus_promoting_domestic_energy_synthetics: "국내 에너지 합성물 장려"
 FIJ_focus_promoting_domestic_energy_synthetics_desc: "합성물의 돌파구는 국내 석유 공급의 증가로 이어졌습니다. 이 국내 공급은 에너지로 쓸 수 있을 뿐 아니라 우리의 전반적인 석유화학 산업도 촉진하므로, 경제를 성장시키는 데 더욱 활용될 것입니다."
 FIJ_focus_technocratic_health_act: "기술관료제 보건법"
 FIJ_focus_technocratic_health_act_desc: "평의회는 의료 체계의 전반적인 확충에 투자하는 법안인 THA를 통과시켰습니다. 이는 우리 인구를 전반적으로 더 잘 치료하고 돌볼 수 있게 해 줄 것입니다. 우리는 높이 지을 수 있어야 하며, 그러려면 규모 면에서도, 그리고 그 인구가 쌓아 올리고자 하는 의욕 면에서도 인구가 있어야 합니다."
 FIJ_focus_industrial_diversity_act: "산업 다양성법"
 FIJ_focus_industrial_diversity_act_desc: "IDA는 민간 경제의 추가적인 다변화를 도모합니다. 연구소 단지의 지속적인 노력으로 우리는 나라를 진정으로 발전시킬 수 있었습니다."
 FIJ_focus_family_care_act: "가족 보호법"
 FIJ_focus_family_care_act_desc: "이 포고는 건전한 사회적 결속을 위해서는 구성 형태를 불문하고 가족이 모든 사회의 주된 쐐기돌이라는 핵심적 인식에 근거합니다. 따라서 우리는 이 쐐기돌을 지원하고 유지하도록 복지 프로그램을 재편하여 사회 구조를 튼튼히 지켜야 합니다."
 FIJ_focus_research_plan_alchemy: "연구 계획 연금술"
 FIJ_focus_research_plan_alchemy_desc: "지금까지 가장 야심 찬 계획입니다. 연구 계획 연금술에는 GDP의 약 3분의 1이 들겠지만, 우리는 분자 재구성을 시도할 극히 기초적인 토대는 갖췄다고 믿습니다. 쉽게 말해 이는 연금술 그 자체에 가까운 것입니다. 이 기술은 극도로 불안정하고 비용이 많이 들겠지만, 이를 진정으로 해낸다면 경제적 자급자족의 가장 진정한 형태에 가까운 것을 열 수 있을 것입니다."
 FIJ_focus_research_plan_armory: "연구 계획 무기고"
 FIJ_focus_research_plan_armory_desc: "우리 군은 민간의 발전과 어깨를 나란히 해야 합니다. 최고의 신발명을 모두 전장에 투입할 수는 없지만, 최소한 우리 장병들이 싸우고 생존할 수 있는 수준은 높일 수 있습니다. 물론 상당한 비용이 들겠지만, 최종 결과는 우리나라의 전반적인 안보를 향상시킬 것입니다."
 FIJ_focus_research_plan_biomedical: "연구 계획 생명의학"
 FIJ_focus_research_plan_biomedical_desc: "생명의학 계획은 기본적으로 우리의 생물학 및 의료 기술과 기계를 평균 수명을 20년 더 늘릴 수 있는 수준으로 끌어올리는 것입니다. 의수족, 그리고 유전공학 전반의 향상은 노인들이 나이에도 불구하고 더 건강하고 강하게 지낼 수 있게 해 줄 것입니다. 우산처럼 시민들을 새로운 생명의학 혁신의 시대로 진정으로 감싸 주기를 바랍니다."
 FIJ_focus_naval_innovations: "해군 혁신"
 FIJ_focus_naval_innovations_desc: "우리 군은 육군만이 아닙니다. 해군 혁신에 전념하는 내부 전담 부서야말로 피지가 자국 해역을 지배할 수 있는 유일한 길입니다."
 FIJ_focus_expansion_of_welfare_programs: "복지 프로그램 확대"
 FIJ_focus_expansion_of_welfare_programs_desc: "복지 프로그램의 종류를 다변화하면 새 시대에도 지속되는 여러 고질적 문제에 다각도로 세심한 보살핌을 제공할 수 있습니다."
 FIJ_focus_research_plan_synthetic: "연구 계획 합성"
 FIJ_focus_research_plan_synthetic_desc: "합성 계획은 합성물 프로그램을 전면적으로 정제하여 고무류 제품의 국내 공급을 만들어 내는 접근입니다. 제한적인 고무 수입과 연구 투자 증가를 대가로, 이 추가적인 자원 공급으로 인해 경제 및 사회 전반에 어느 정도 활력이 생길 것으로 기대할 수 있습니다. 우리가 내딛는 또 하나의 걸음..."
 FIJ_focus_civilian_corp_of_engineers: "민간 공병대"
 FIJ_focus_civilian_corp_of_engineers_desc: "CCE는 피지 공병대의 민간 확장 조직입니다. 민간 공사와 군사 공사를 구분하여 각각 우선시하려는 것입니다. 그러나 필요하다면 두 집단이 통합할 수 있으며, 이는 간접적인 군사적 활용으로 이어질 수 있습니다."
 FIJ_focus_research_plan_autarky: "연구 계획 자급자족"
 FIJ_focus_research_plan_autarky_desc: "수년간의 폭넓은 연구와 계획, 투자 끝에 마침내 진정한 돌파구를 이루었습니다. 이는 우리의 경제적 자급자족을 사실상 최대한도로 다져줍니다. 이제 우리는 무엇이든 이룰 수 있으며, 어쩌면 별조차 더는 한계가 아닐지도 모릅니다."
 FIJ_focus_research_plan_feast: "연구 계획 향연"
 FIJ_focus_research_plan_feast_desc: "종이자 사회로서 우리의 성장을 지속하려면 삶의 가장 기본적인 것을 제공해야 합니다. 핵심적인 기본 중 하나는 식량이며, 이는 사회 안정과 인구 증가, 그리고 대부분의 나라에 대한 연성 권력의 우위를 보장할 것입니다. 우리는 표적화된 해외 원조를 사실상 키워 낼 방법을 찾고, 빈곤과 식량 불안 해소를 세계에서 선도할 수 있습니다. 피지는 세계적 단결의 초석이 될 것입니다."
 FIJ_focus_research_plan_nucleus: "연구 계획 핵"
 FIJ_focus_research_plan_nucleus_desc: "미래는 정말로 지금입니다. 원자력 공학에서 너무나 많은 진보가 이루어졌음에도, 공포 조장 전술의 진보가 여전히 에너지 생산의 명백한 현실을 역겹게 무시하는 것이 한심할 지경입니다. 따라서 우리는 물론 막대한 비용을 치르겠지만, 원자로를 진정으로 어떻게 지어야 하는지에 관한 새로운 세계 표준을 세울 것입니다. 효율적이고 효과적이며, 관할하는 가용 면적보다 더 많이 생산할 가능성이 높은 원자로입니다. 우리가 세우는 이 진정하고 가장 안전한 표준은 원자력과 관련하여 부실한 과거를 가진 어떤 나라든 부끄럽게 만들 수 있을 것입니다. 기술관료제를 위하여, 우리 종에게 필요하지만 어째서인지 원하지 않는 것처럼 보이는 미래를."
 fiji_news.503.t: "피지민주당의 결성"
 fiji_news.503.desc: "피지인연합당, 피지인 정당 대부분, 기독교민주동맹의 잔존 세력, 신노동통일당이 필리페 볼레의 지도 아래 피지민주당으로 합당했습니다. 새 중도 정당은 온건한 토착 피지인들에게 집권 통합피지당에 맞설 단일한 목소리를 주고자 하며, 인종에 따른 투표 대신 공통 선거인 명부를 요구합니다."
 fiji_news.503.a: "하나의 온건한 목소리"
 fiji_news.504.t: "피지 국민동맹당의 FDP 흡수"
 fiji_news.504.desc: "피지민주당이 스스로 해산하고, 고위 족장이자 전 군 사령관인 라투 에펠리 가니라우가 이끄는 새로운 피지 국민동맹당에 합류했습니다. 이 정당은 민족을 초월한 국민 통합, 인종이 아닌 필요에 따른 우대 조치, 무상 교육을 약속합니다."
 fiji_news.504.a: "중도를 위한 새 깃발"
 fiji_news.505.t: "SDL에 합류하는 보수동맹"
 fiji_news.505.desc: "보수동맹-마타니투 바누아 대의원들이 당을 라이세니아 카라세 총리의 통합피지당에 합병하기로 표결했습니다. 이 합당으로 집권 연립의 두 주요 토착 민족주의 정당이 다가오는 총선을 앞두고 하나로 뭉칩니다."
 fiji_news.505.a: "민족주의 표심이 결집한다"
 fiji_news.506.t: "정당 포고령"
 fiji_news.506.desc: "정부의 정당 포고령이 정한 기한이 지났습니다. 모든 정당은 수천 명의 당원 서명과 영어 이름으로 재등록해야 했으나, 대부분은 그럴 수 없었거나 그럴 뜻이 없었으며, 피지 국민동맹당, 민족주의 바누아 타코 라보당, 피지 녹색당이 이에 포함되어 이제 해산되었습니다. 통합피지당은 사회민주자유당이라는 영어 이름으로 재편되고 있습니다."
 fiji_news.506.a: "새로운 정당 구도"
 fiji_news.507.t: "국민동맹을 창당한 라부카"
 fiji_news.507.desc: "사회민주자유당의 지도부를 잃은 시티베니 라부카가 새 정당인 국민동맹을 창당했습니다. 중도우파 정당인 이 당은 대족장회의를 복원하고 유권자에게 피지퍼스트에 대한 온건한 대안을 제시하겠다고 약속합니다."
 fiji_news.507.a: "노병의 귀환"
 fiji_news.508.t: "등록이 말소된 피지퍼스트"
 fiji_news.508.desc: "정당 등록관이 법정 기한까지 당헌을 개정하지 못한 피지퍼스트의 등록을 말소했습니다. 이 붕괴는 프랭크 바이니마라마가 사법 방해를 시도한 혐의로 유죄 판결을 받고, 당 지도부가 사임하고, 의원 보수 문제를 둘러싼 분쟁으로 소속 의원 대다수가 제명된 데 뒤이은 것입니다."
 fiji_news.508.a: "한 시대의 끝"