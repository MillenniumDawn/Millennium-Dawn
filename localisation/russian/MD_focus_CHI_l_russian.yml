 CHI_TAI_intl_org_blockade_tt: "[TAI.GetNameWithFlag] gains a dynamic modifier that penalises it based on its level of international recognition."
 CHI_TAI_intl_isolation_modifier: "International Isolation Index"
 CHI_TAI_intl_isolation_modifier_desc: "Динамический показатель дипломатической изоляции Тайваня, величина которого обратно пропорциональна числу государств-членов ООН, официально признающих Тайвань. Уменьшение числа признающих государств приводит к ужесточению санкций в отношении торговли, обмена мнениями, иностранного влияния и затрат на улучшение отношений с Китаем; напротив, более широкое признание способствует улучшению этих отношений и усиливает дипломатическое влияние Тайваня."
 CHI_recognition_embargo: "Recognition Embargo"
 CHI_recognition_embargo_desc: "Китай ввёл строгие экономические и дипломатические санкции в отношении любой страны, официально признающей Тайвань. Стоимость торговли с Китаем значительно возросла, а доступ к китайским рынкам строго ограничен."
 china_sar.038.t: "Beijing Proposes Cross-Strait Economic Cooperation"
 china_sar.038.d: "Beijing has extended a formal proposal to Taipei for a framework of cross-strait economic cooperation. Mainland officials frame it as a pragmatic, mutually beneficial arrangement that sidesteps the sovereignty question entirely. Taiwan's business groups are receptive, but the independence-leaning opposition warns of a slow slide into dependence on the mainland economy."
 china_sar.038.a: "Engage with the framework."
 china_sar.038.b: "Decline the overture."
 china_sar.039.t: "Beijing Offers to Expand Cross-Strait Trade"
 china_sar.039.d: "Building on the opening of economic dialogue, Beijing proposes a substantial expansion of cross-strait trade, lowering tariffs and easing restrictions on Taiwan's exports to the mainland. The offer echoes the Economic Cooperation Framework Agreement and dangles access to the vast mainland market. Critics in Taipei fear the concessions carry political strings."
 china_sar.039.a: "Expand trade with the mainland."
 china_sar.039.b: "Отклонить расширение торговли"
 china_sar.040.t: "Доступ тайваньских компаний на рынок материкового Китая"
 china_sar.040.d: "Пекин предлагает тайваньским предприятиям вести деятельность на материке на льготных условиях, предоставляя им офисные помещения, права на совместное использование зданий и упрощенную процедуру получения лицензий. Для экономики Тайваня, ориентированной на экспорт, это представляет собой значительные возможности, однако углубление коммерческих связей с материком по-прежнему остается политически деликатным вопросом в Тайбэе."
 china_sar.040.a: "Принять торговые преференции"
 china_sar.040.b: "Не допускать тесной интеграции наших компаний"
 china_sar.041.t: "Координация полупроводниковой отрасли по обе стороны пролива"
 china_sar.041.d: "Пекин предлагает наладить координацию между материковым Китаем и ведущей в мире полупроводниковой отраслью Тайваня, включая создание совместных производственных мощностей и проведение совместных исследований. Отрасль производства микросхем Тайваня является его главным стратегическим активом и самым надежным щитом; совместное использование этой отрасли с материковым Китаем было бы выгодным, но привело бы к ослаблению того самого рычага влияния, который удерживает партнеров Тайбэя в сотрудничестве."
 china_sar.041.a: "Координировать сотрудничество в сфере полупроводников"
 china_sar.041.b: "Защитить нашу чиповую отрасль."
 china_sar.042.t: "Обмен деловыми делегациями"
 china_sar.042.d: "Пекин приглашает деловые делегации обеих сторон для посещения промышленных центров по обе стороны пролива, способствуя установлению личных связей между руководителями материкового Китая и Тайваня. Эти визиты сопряжены с минимальным риском и носят коммерчески полезный характер, при этом каждый из них укрепляет сеть экономической взаимозависимости между двумя сторонами пролива."
 china_sar.042.a: "Обмен делегациями."
 china_sar.042.b: "Decline the visits."
 china_sar.043.t: "Direct Cross-Strait Transport Links"
 china_sar.043.d: "Пекин предлагает расширить сеть прямых транспортных сообщений через пролив, развивая политику «Трёх связей» за счёт открытия новых морских маршрутов, авиарейсов и развития инфраструктуры. Прямые сообщения позволят сократить расходы как для предприятий, так и для путешественников, что ещё более укрепит связи между экономиками двух стран."
 china_sar.043.a: "Open direct transport links."
 china_sar.043.b: "Limit direct connections."
 china_sar.044.t: "Cross-Strait Investment Safeguards"
 china_sar.044.d: "Beijing offers a formal agreement guaranteeing legal protection for Taiwan's investment on the mainland, addressing long-standing concerns over property rights and arbitration. The safeguards would reassure cautious investors, but they also entrench a framework in which Taipei negotiates with Beijing as an economic partner."
 china_sar.044.a: "Sign the investment safeguards."
 china_sar.044.b: "Reject the agreement."
 china_sar.045.t: "Joint Cross-Strait Industrial Planning"
 china_sar.045.d: "Beijing proposes coordinated industrial planning across the strait, aligning supply chains, standards and major projects. Such integration would yield real efficiencies, but it would also fold Taiwan's economy into the mainland's long-term strategy, a prospect that alarms sovereignty-minded voters in Taipei."
 china_sar.045.a: "Align our industrial planning."
 china_sar.045.b: "Plan our economy independently."
 china_sar.046.t: "Deep Cross-Strait Economic Integration"
 china_sar.046.d: "Пекин предлагает реализовать заключительный этап создания экономического союза между двумя берегами Тайваньского пролива: глубоко интегрированный рынок с гармонизированным регулированием и свободным движением товаров и капитала. Сторонники указывают на процветание, которое это принесет; противники предупреждают, что при такой степени интеграции экономический союз становится трудноотличимым от политической ассимиляции."
 china_sar.046.a: "Полная экономическая интеграция."
 china_sar.046.b: "Остановись у кромки воды."
 china_sar.047.t: "Тайбэй рассматривает соглашение о воссоединении"
 china_sar.047.d: "Пекин представил окончательный план мирного воссоединения: Тайвань вновь войдет в состав Китайской Народной Республики в качестве специального административного района, сохранив собственную администрацию, правовую систему и экономику в рамках модели «одна страна — две системы». После многих лет разрядки в отношениях между двумя берегами Тайваньского пролива соглашение теперь находится на рассмотрении в Тайбэе для ратификации."
 china_sar.047.a: "Ratify the accord and reunify."
 china_sar.047.b: "The island is not ready for this."
 CHI_calm_hong_kong_protests: "Restore Order in Hong Kong"
 CHI_calm_hong_kong_protests_desc: "Протесты, вызванные нашими избирательными реформами, по-прежнему дестабилизируют обстановку в Специальном административном районе. С учетом присутствия сил безопасности на местах и стабилизации ситуации центральное правительство может приступить к плавному урегулированию беспорядков и восстановлению нормальной обстановки в Гонконге."
 CHI_TAI_resend_economic_track: "Renew Cooperation Proposal: Economic Framework"
 CHI_TAI_resend_economic_track_desc: "Тайбэй отклонил предыдущее предложение. Следует вновь обратиться к правительству Тайваня с предложением о создании рамок экономического сотрудничества между двумя берегами пролива."
 CHI_TAI_resend_expand_trade: "Renew Cooperation Proposal: Trade Expansion"
 CHI_TAI_resend_expand_trade_desc: "Тайбэй отклонил предыдущее предложение. Вновь обратитесь к правительству Тайваня с предложением о расширении торговли между двумя берегами пролива."
 CHI_TAI_resend_mainland_access: "Renew Cooperation Proposal: Market Access"
 CHI_TAI_resend_mainland_access_desc: "Тайбэй отклонил предыдущее предложение. Следует вновь обратиться к правительству Тайваня с предложением о предоставлении льготного доступа к рынку материкового Китая."
 CHI_TAI_resend_semiconductor: "Renew Cooperation Proposal: Semiconductor Coordination"
 CHI_TAI_resend_semiconductor_desc: "Тайбэй отклонил предыдущее предложение. Вновь обратитесь к правительству Тайваня с предложением о координации действий в сфере производства полупроводников между двумя берегами пролива."
 CHI_TAI_resend_business_deleg: "Renew Cooperation Proposal: Business Delegations"
 CHI_TAI_resend_business_deleg_desc: "Тайбэй отклонил предыдущее предложение. Снова обратитесь к правительству Тайваня с предложением об обмене деловыми делегациями."
 CHI_TAI_resend_transport: "Renew Cooperation Proposal: Transport Links"
 CHI_TAI_resend_transport_desc: "Тайбэй отклонил предыдущее предложение. Вновь обратитесь к правительству Тайваня с предложением об установлении прямых транспортных связей между двумя берегами пролива."
 CHI_TAI_resend_safeguards: "Renew Cooperation Proposal: Investment Safeguards"
 CHI_TAI_resend_safeguards_desc: "Тайбэй отклонил предыдущее предложение. Снова обратитесь к правительству Тайваня с предложением о заключении соглашения о гарантиях инвестиций в отношениях между двумя берегами Тайваньского пролива."
 CHI_TAI_resend_joint_planning: "Renew Cooperation Proposal: Industrial Planning"
 CHI_TAI_resend_joint_planning_desc: "Тайбэй отклонил предыдущее предложение. Вновь обратитесь к правительству Тайваня с предложением о совместном планировании промышленного развития в отношениях между двумя берегами Тайваньского пролива."
 CHI_TAI_resend_deep_integration: "Renew Cooperation Proposal: Economic Integration"
 CHI_TAI_resend_deep_integration_desc: "Тайбэй отклонил предыдущее предложение. Вновь обратитесь к правительству Тайваня с предложением о глубокой экономической интеграции между двумя берегами пролива."
 CHI_TAI_resend_peaceful_reunification: "Re-submit the Reunification Accord"
 CHI_TAI_resend_peaceful_reunification_desc: "Тайбэй отклонил рамочное соглашение о воссоединении. Дайте соглашению ещё немного времени и вновь представьте его Тайваню."
 CHI_TAI_goodwill_gesture: "Cross-Strait Goodwill Gesture"
 CHI_TAI_goodwill_gesture_desc: "Проявить открытую доброжелательность по отношению к Тайбэю — от предложений о помощи при стихийных бедствиях до смягчения правил в сфере путешествий и туризма, что будет способствовать улучшению отношений между двумя берегами Тайваньского пролива и укреплению взаимного доверия."
 CHI_TAI_coercive_signaling: "Принудительная демонстрация силы"
 CHI_TAI_coercive_signaling_desc: "Продемонстрировать недовольство Пекина посредством демонстративных военных учений и дипломатического давления. Это напоминает Тайбэю о решимости материкового Китая, но подрывает доверие между двумя берегами Тайваньского пролива."
 CHI_sco_member_tooltip: "§YЧлен ШОС§!: Углубляет политическое, экономическое сотрудничество и взаимодействие в сфере безопасности с другими государствами-членами по всей Евразии."
 CHI_big_fund_iii_allocate_tranche_decision_tt: "Использовано решений: [?CHI_bfiii_stacks]/4"
