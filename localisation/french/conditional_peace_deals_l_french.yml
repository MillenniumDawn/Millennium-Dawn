 CPD_demanding_resource_rights_TT: "Les droits d'extraction de ressources sur cet État sont une §Gexigence§! de [ROOT.GetNameWithFlag]. Si la paix est acceptée, nous obtiendrons les droits sur les ressources produites dans cet État."
 CPD_conceding_resource_rights_TT: "Les droits d'extraction de ressources sur cet État sont une §Rconcession§! de [ROOT.GetNameWithFlag]. Si la paix est acceptée, l'ennemi obtiendra les droits sur les ressources produites dans cet État."
 CPD_country_action_ceasefire: "§YCessez-le-feu§!"
 CPD_country_action_war_reparations: "§YRéparations de guerre§!"
 CPD_country_action_forced_neutrality: "§YNeutralité forcée§!"
 CPD_country_action_regime_change: "§YChangement de régime§!"
 CPD_country_action_military_basing: "§YImplantation militaire§!"
 CPD_country_action_full_puppet: "§YMarionnette totale§!"
 CPD_country_action_ceasefire_TT: "Un §Ycessez-le-feu§! met fin à la guerre avec la ligne de front actuelle comme nouvelle frontière. Une trêve de §Y720 jours§! s'ensuit.\n\nCliquer pour retirer de l'accord."
 CPD_country_action_war_reparations_TT: "Les §Yréparations de guerre§! obligent le vaincu à verser chaque semaine une part de son PIB au bénéficiaire pendant un an.\n\nCliquer pour retirer de l'accord."
 CPD_country_action_forced_neutrality_TT: "La §Yneutralité forcée§! retire la cible de sa faction et lui interdit d'en rejoindre une autre pendant cinq ans.\n\nCliquer pour retirer de l'accord."
 CPD_country_action_regime_change_TT: "Le §Ychangement de régime§! installe notre parti au pouvoir dans le gouvernement de la cible. Attendez-vous à une instabilité politique durable.\n\nCliquer pour retirer de l'accord."
 CPD_country_action_military_basing_TT: "Les §Ybases militaires§! accordent au bénéficiaire le libre passage et le droit de stationner sur le territoire de l'autre.\n\nCliquer pour retirer de l'accord."
 CPD_country_action_full_puppet_TT: "La §Ymarionnette totale§! réduit l'ensemble de la cible à un État sujet.\n\nCliquer pour retirer de l'accord."
 CPD_has_demands_in_deal_TT: "L'accord contient au moins une §Yexigence§!."
 CPD_deal_has_no_demands_TT: "L'accord ne contient aucune exigence"
 CPD_is_ceasefire_only_deal_TT: "L'accord ne contient qu'un cessez-le-feu"
 CPD_send_status_breakdown_TT: "Mois en guerre : §Y[?CPD_send_months_temp|.1]§! (§Y3§! requis)\nVictoires de bataille contre [THIS.GetName] : §Y[?CPD_send_vp_temp|.0]§! (§Y1§! requise)"
 CPD_send_ready_TT: "§GLes termes de cet accord sont prêts à être envoyés à [THIS.GetName].§!\n\n[CPD_send_status_breakdown]\n\n[CPD_deal_recap]"
 CPD_send_blocked_TT: "§RNous ne pouvons pas encore envoyer cet accord.§! Envoyer des §Yexigences§! requiert une §Ycontribution de guerre§! contre [THIS.GetName] : au moins une bataille gagnée, ou trois mois de guerre. Un accord de §Ycessez-le-feu seul§! peut être envoyé sans contribution. Les accords composés uniquement de concessions également.\n\n[CPD_send_status_breakdown]\n\n[CPD_deal_recap]"
 CPD_deal_recap_TT: "Exigences : §Y[?CPD_recap_demands|.0]§!\nConcessions : §Y[?CPD_recap_concessions|.0]§!\nCoût net : §Y[?CPD_recap_total_cost|+0]§! £victory_points"
 CPD_receive_offer_TITLE_TEXT: "Offre de paix reçue"
 CPD_receive_offer_DESC_TEXT: "Une délégation de paix de [ROOT.GetNameWithFlag] a été reçue. Nos diplomates évaluent l'offre, mais c'est vous qui avez le dernier mot. Allons-nous signer le traité ou allons-nous poursuivre le [CPD_receive_offer_DESC_WAR_TYPE] ?"
 CPD_receive_offer_DESC_OFFENSIVE_WAR: "Offensif"
 CPD_receive_offer_DESC_DEFENSIVE_WAR: "Défense de notre nation"
