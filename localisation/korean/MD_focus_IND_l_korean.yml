 IND_ailing_economy: "악화된 경제"
 IND_ailing_economy_desc: "우리나라의 통화인 루피아는 심각하게 약세입니다. 이는 수십 년간의 부패와 부실 운영의 결과이며, 이제 이를 바로잡고 우리 경제를 세계 무대로 되돌려 놓을 때입니다."
