 ALG_maintaining_kabyle_relations: "Melhoria Automática das Relações com os Cabilas"
 ALG_maintain_kabyle_relations: "Manter as Relações com os Cabilas"
 ALG_maintain_kabyle_relations_desc: "Uma aproximação de baixo esforço com as comunidades cabilas para evitar que a satisfação se deteriore. Custa poder político, mas evita as duras penalidades de fracasso das reformas maiores."
 ALG_maintain_kabyle_relations_tt: "§GSatisfação Cabila:§! +5\n§YEstabilidade:§! +2.0%\nTempo de espera de 90 dias."
 AlgeriaFocusNews.100.t: "Iniciativa de Casablanca: Cortejando as Grandes Potências"
 AlgeriaFocusNews.100.d: "A Argélia optou por cortejar as grandes potências para apoiar sua Iniciativa de Casablanca. Isso é custoso, mas aumenta a chance de um forte resultado na UA."
 AlgeriaFocusNews.101.t: "Iniciativa de Casablanca: Abordagem Regional"
 AlgeriaFocusNews.101.d: "A Argélia segue uma via diplomática exclusivamente regional, contando com estados vizinhos e aliados da União Africana."
 AlgeriaFocusNews.102.t: "Iniciativa de Casablanca: Estratégia Mista"
 AlgeriaFocusNews.102.d: "A Argélia combinará esforços regionais e internacionais para aumentar a pressão enquanto se protege dos riscos."
 AlgeriaFocusNews.103.t: "Iniciativa de Casablanca: Grande Sucesso"
 AlgeriaFocusNews.103.d: "A Iniciativa de Casablanca alcançou um resultado decisivo no processo da UA/ONU. A pressão diplomática tem impulso real; a Argélia está em posição forte para pressionar o Marrocos a abrir mão de reivindicações diplomáticas (e, com o seu foco, a remover núcleos)."
 AlgeriaFocusNews.104.t: "Iniciativa de Casablanca: Sucesso Moderado"
 AlgeriaFocusNews.104.d: "A Iniciativa de Casablanca produziu um resultado diplomático significativo. A pressão sobre o Marrocos aumentou; a UA apoia, mas não de forma decisiva."
 AlgeriaFocusNews.105.t: "Iniciativa de Casablanca: Resultado Modesto"
 AlgeriaFocusNews.105.d: "A Iniciativa de Casablanca produziu apenas uma simpatia modesta na UA. Será necessário mais trabalho para forçar grandes concessões."
 AlgeriaFocusNews.106.t: "Iniciativa de Casablanca: Missão Expirou"
 AlgeriaFocusNews.106.d: "O tempo se esgotou sem um resultado substantivo. O impulso diplomático se perdeu."
