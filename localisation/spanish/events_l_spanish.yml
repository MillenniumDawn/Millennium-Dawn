 TT_CURRENT_LEADER_DIES: "§RFallece[ROOT.GetLeader]§!"
 md4.1.t: "[FROM.GetName]-[Root.GetName] Acuerdo de Libre Comercio"
 md4.1.d: "[FROM.GetNameDef] nos ofrece un acuerdo de libre comercio. Tendremos prioridad para exportar e importar desde ellos."
 md4.1.a: "¡Firmémoslo!"
 md4.1.b: "Rechazarlo."
 md4.2.t: "[FROM.GetNameDef] ha firmado un acuerdo de libre comercio con nosotros."
 md4.2.d: "[FROM.GetNameDef] ha aceptado nuestra oferta para firmar un acuerdo de libre comercio. Entrará en vigor de inmediato."
 md4.2.a: "¡Ambos nos beneficiaremos!"
 md4.3.t: "[FROM.GetNameDef] se ha negado a firmar un acuerdo de libre comercio con nosotros."
 md4.3.d: "[FROM.GetNameDef] ha rechazado nuestra oferta de firmar un acuerdo de libre comercio."
 md4.3.a: "¡Temor a nuestros productos superiores!"
 md4.4.t: "[FROM.GetName]-[Root.GetName] Tratado de Cooperación Militar"
 md4.4.d: "[FROM.GetNameDef] nos ofrece un tratado de cooperación militar. Les venderemos equipamiento a un precio descontado, pero esto hará que tengan más probabilidades de comprarnos a nosotros en lugar de a nuestros competidores."
 md4.4.a: "¡Firmémoslo!"
 md4.4.b: "Rechazarlo."
 md4.5.t: "[FROM.GetNameDef] Ha firmado un tratado de cooperación militar con nosotros"
 md4.5.d: "[FROM.GetNameDef] ha aceptado nuestra oferta de firmar un tratado de cooperación militar. Entrará en vigor inmediatamente."
 md4.5.a: "¡Ambos seremos más fuertes!"
 md4.6.t: "[FROM.GetNameDef] Se ha negado a firmar un tratado de cooperación militar con nosotros"
 md4.6.d: "[FROM.GetNameDef] ha rechazado nuestra oferta de firmar un tratado de cooperación militar."
 md4.6.a: "¡Temor a que seamos más fuertes!"
 md4.14.t: "[FROM.GetName] Exige Sumisión"
 md4.14.d: "El Gobierno de [FROM.GetName] ha exigido que nos sometamos a su gobierno y nos convirtamos en sus súbditos."
 md4.14.a: "Por supuesto"
 md4.14.b: "¡Nunca!"
 md4.15.t: "[FROM.GetName] Se Somete"
 md4.15.d: "El Gobierno de [FROM.GetName] ha aceptado nuestras demandas y se ha sometido a nuestras normas."
 md4.15.a: "Excelente"
 md4.16.t: "[FROM.GetName] Se Resiste"
 md4.16.d: "El Gobierno de [FROM.GetName] ha rechazado nuestras demandas de supremacía."
 md4.16.a: "Maldición"
 md4.17.t: "[FROM.GetName] Acepta la Alianza"
 md4.17.d: "El Gobierno de [FROM.GetName] ha aceptado nuestra solicitud de alianza."
 md4.17.a: "Excelente"
 md4.18.t: "[FROM.GetName] Rechaza la Alianza"
 md4.18.d: "El Gobierno de [FROM.GetName] ha rechazado nuestra solicitud de alianza."
 md4.18.a: "Maldición"
 md4.19.t: "[FROM.GetName] Cede Territorio"
 md4.19.d: "El Gobierno de [FROM.GetName] ha aceptado nuestras demandas territoriales."
 md4.19.a: "Excelente"
 md4.20.t: "[FROM.GetName] se Niega a Ceder Territorio"
 md4.20.d: "El gobierno de [FROM.GetName] ha rechazado nuestras exigencias territoriales."
 md4.20.a: "Maldición"
 generic.5.t: "[FROM.GetName] Invita a [Root.GetName] a la [FROM.GetFactionName]"
 generic.5.d.a: "Con una mirada recelosa sobre los recientes acontecimientos en la política mundial, [alliance_inviter.GetName] nos extiende su mano de amistad, nos ofrece su protección y nos insta a apoyarlos en la defensa de los principios de la libertad y la democracia. Como miembro de [alliance_inviter.GetFactionName], la libertad de nuestro pueblo puede estar a salvo."
 generic.5.d.b: "Reconociendo que a veces incluso los más fuertes necesitan aliados, la [alliance_inviter.GetAdjective] nos ha invitado a unirnos a la [alliance_inviter.GetFactionName]. Si elegimos aceptar, esto puede brindarnos una amplia oportunidad para encontrar nuestro lugar bajo el sol."
 generic.5.d.c: "Nuestros aliados ideológicos en [alliance_inviter.GetName] han tomado nota de nuestras valiosas contribuciones a la causa de los trabajadores, y esta mañana hemos recibido una invitación para unirnos a la facción [alliance_inviter.GetFactionName]. Manteniéndonos unidos junto a otras repúblicas socialistas, podríamos propagar la revolución con una fuerza renovada."
 generic.5.d.e: "Parece que la [alliance_inviter.GetAdjective] considera que somos de interés estratégico para ellos y que les parece más provechoso que trabajemos juntos que dejarnos dividir por nuestras diferencias ideológicas. Esta mañana, el embajador de la [alliance_inviter.GetAdjective] nos ha entregado una invitación para que nos convirtamos en un estado miembro de la [alliance_inviter.GetFactionName]."
 generic.5.a: "Lucharemos junto a ellos."
 generic.5.b: "Solo necesitamos unos cuantos miles de muertos..."
 generic.5.c: "¡Lucharemos junto a nuestros camaradas!"
 generic.5.e: "Es una elección rentable."
 generic.6.t: "[alliance_applicant.GetName] Acepta la Invitación a la [alliance_inviter.GetFactionName]"
 generic.6.d: "[alliance_applicant.GetName] ha decidido aceptar nuestra oferta de unirnos a la [alliance_inviter.GetFactionName]. A partir de ahora, juntos nos mantendremos en pie o caeremos."
 generic.7.t: "[alliance_applicant.GetName] Rechaza la Oferta de unirse a la [alliance_inviter.GetFactionName]"
 generic.7.d: "[alliance_applicant.GetName] ha decidido rechazar nuestra oferta de unirnos a la [alliance_inviter.GetFactionName]. Tendremos que arreglárnoslas sin su ayuda."
 generic.7.a: "No quieren nuestra ayuda."
 ace_promoted.1.t: "Piloto As de Aviación Ascendido"
 ace_promoted.2.t: "Aparece un As Salvaje"
 ace_promoted.1.d: "Pocos asumen tantos riesgos como los valientes pilotos de la fuerza aérea de [Root.GetAdjective]. [FROM.GetName] [FROM.GetSurname], un hábil piloto conocido bajo el nombre en clave de «[FROM.GetCallsign]», se ha distinguido no solo por regresar con vida de la reciente misión sobre [FROM.GetMissionRegion], sino por salir airoso de victorias significativas en muchos encuentros críticos.\n\nErigido como un brillante ejemplo del coraje de [Root.GetAdjective], el reciente ascenso de [FROM.GetName] ha recibido una gran publicidad. Aunque la población pueda ver la guerra más como un infierno que como una gloria, muchos se alegran de ver que todavía quedan héroes tras los cuales unirse."
 ace_promoted.1.d_major: "Pocos asumen tantos riesgos como los valientes pilotos de la fuerza aérea de [Root.GetAdjective]. [FROM.GetName] [FROM.GetSurname], un hábil piloto conocido bajo el nombre en clave de «[FROM.GetCallsign]», se ha distinguido no solo por regresar con vida, sino por pilotar su [FROM.GetWing] con una inmensa destreza. Recientemente, [FROM.GetName] se encontraba en una misión sobre [FROM.GetMissionRegion] y fue fundamental para el éxito de este encuentro crítico.\n\nErigido como un brillante ejemplo del coraje de [Root.GetAdjective], el reciente ascenso de [FROM.GetName] ha recibido una gran publicidad. Aunque la población pueda ver la guerra más como un infierno que como una gloria, muchos se alegran de ver que todavía quedan héroes tras los cuales unirse."
 ace_promoted.1.a: "Quien se atreve, gana."
 ace_died.1.t: "As de la aviación con nombre en clave «[FROM.GetCallsign]» derribado sobre [FROM.GetMissionRegion]"
 ace_died.1.d: "Uno de los ases de [FROM.GetAceType] más famosos de [FROM.Owner.GetName], [FROM.GetFullName], ha sido derribado en acto de servicio durante una misión sobre [FROM.GetMissionRegion]. Desafortunadamente, dado que [FROM.GetSheHe] ha sido durante mucho tiempo una figura pública, su fallecimiento resulta profundamente desmoralizador para las muchas personas que admiraban a [FROM.GetHerHim].\n\nAunque desearíamos que hubiera una forma de ocultar este acontecimiento a la población, la falta de apariciones públicas de [FROM.GetName] pronto despertaría sospechas. En última instancia, su muerte es una parte más de una leyenda que con suerte perdurará mucho más allá de nuestras tribulaciones actuales."
 ace_died.1.d_major: "Uno de los ases de [FROM.GetAceType] más famosos de [FROM.Owner.GetName], [FROM.GetFullName], ha caído en acto de servicio. Los pilotos que regresan de la zona informan haber avistado su [FROM.GetWingShort] cayendo en llamas sobre [FROM.GetMissionRegion] tras recibir un pesado fuego enemigo. Desafortunadamente, dado que [FROM.GetSheHe] ha sido durante mucho tiempo una figura pública, el fallecimiento de «[FROM.GetCallsign]» resulta profundamente desmoralizador para las muchas personas que admiraban a [FROM.GetHerHim].\n\nAunque desearíamos que hubiera una forma de ocultar este acontecimiento a la población, la falta de apariciones públicas de [FROM.GetName] pronto despertaría sospechas. En última instancia, la muerte es una parte más de una leyenda que con suerte perdurará mucho más allá de nuestras tribulaciones actuales."
 ace_died.1.a: "Una leyenda viva siempre es mejor."
 ace_killed_by_ace.1.t: "El as de la aviación [FROM.GetFullName] es derribado por un piloto enemigo"
 ace_killed_by_ace.1.d: "Los pilotos que regresan de [FROM.GetMissionRegion] informan que un escuadrón de aeronaves de [Prev.Owner.GetAdjective], liderado por el infame piloto «[Prev.GetCallsign]», se concentró en dar caza a [FROM.GetFullName]. Tras esquivar varias ráfagas del enemigo y derribar una cantidad de aviones hostiles, «[FROM.GetCallsign]» se vio superado por «[Prev.GetCallsign]», quien según los informes le superó en maniobra y abrió sus tanques de combustible con un impacto limpio. El avión de [FROM.GetName] [FROM.GetSurname] se incendió y cayó en espiral sobre [FROM.GetMissionRegion] en un violento infierno.\n\n[FROM.GetFullName] ha demostrado un gran coraje a lo largo de su servicio y era admirado por muchos. La pérdida de este héroe nacional es un gran revés para la Fuerza Aérea de [FROM.Owner.GetAdjective] y un golpe devastador para nuestra nación en su conjunto. Saber que mientras nosotros guardamos luto, [Prev.Owner.GetName] celebra a [Prev.GetFullName] como a un héroe hace que la tragedia sea aún mayor."
 ace_killed_by_ace.1.d_major: "Los pilotos que regresan de [FROM.GetMissionRegion] informan que un escuadrón de aeronaves de [Prev.Owner.GetAdjective], liderado por el infame piloto «[Prev.GetCallsign]», se concentró en dar caza a [FROM.GetFullName]. Tras derribar una cantidad de aviones enemigos y esquivar varias ráfagas del rival, «[FROM.GetCallsign]» se vio superado por «[Prev.GetCallsign]» en su [Prev.GetWingShort], quien según los informes le superó en maniobra y abrió sus tanques de combustible con un impacto limpio. El [FROM.GetWingShort] de [FROM.GetName] [FROM.GetSurname] se incendió y cayó en espiral sobre [FROM.GetMissionRegion] en un violento infierno.\n\n[FROM.GetFullName] ha demostrado un gran coraje a lo largo de su servicio y era admirado por muchos. La pérdida de este héroe nacional es un gran revés para la Fuerza Aérea de [FROM.Owner.GetAdjective] y un golpe devastador para la nación en su conjunto. Saber que mientras nosotros guardamos luto, [Prev.Owner.GetName] celebra a [Prev.GetFullName] como a un héroe hace que la tragedia sea aún mayor."
 ace_killed_by_ace.1.a: "Una pérdida devastadora para todos nosotros"
 ace_killed_other_ace.1.t: "El as de la aviación [FROM.GetFullName] derriba a «[Prev.GetCallsign]»"
 ace_killed_other_ace.1.d: "Nuestra última misión sobre [FROM.GetMissionRegion] fue un gran éxito para la Fuerza Aérea de [FROM.Owner.GetAdjective] en más de un aspecto. Han llegado informes que destacan la heroica hazaña de [FROM.GetFullName], burlando al piloto de [Prev.Owner.GetAdjective], [Prev.GetName] [Prev.GetSurname], conocido como «[Prev.GetCallsign]». «[FROM.GetCallsign]» se utilizó a sí mismo como cebo y atrajo a «[Prev.GetCallsign]» a una trampa donde los pilotos de [FROM.Owner.GetAdjective] pudieron caer en picado sobre el escuadrón de [Prev.GetCallsign]. «[FROM.GetCallsign]» procedió a superar en maniobra a la aeronave de [Prev.Owner.GetAdjective] y con una sola ráfaga envió a «[Prev.GetCallsign]» cayendo en espiral desde los cielos de [FROM.GetMissionRegion].\n\n[Prev.GetFullName] era un piloto temido con muchas vidas de [FROM.Owner.GetAdjective] en su conciencia. Esta es una gran victoria y demuestra que cuando nos unimos detrás de grandes héroes, estos realizan grandes hazañas."
 ace_killed_other_ace.1.d_major: "Nuestra última misión sobre [FROM.GetMissionRegion] fue un gran éxito para la Fuerza Aérea de [FROM.Owner.GetAdjective] en más de un aspecto. Han llegado informes que destacan la heroica hazaña de [FROM.GetFullName], logrando burlar al piloto de [Prev.Owner.GetAdjective], [Prev.GetName] [Prev.GetSurname], conocido como «[Prev.GetCallsign]». [FROM.GetCallsign] se utilizó a sí mismo como cebo y atrajo a «[Prev.GetCallsign]» a una trampa donde los pilotos de [FROM.Owner.GetAdjective] pudieron caer en picado sobre el escuadrón de [Prev.GetCallsign]. «[FROM.GetCallsign]» procedió a superar en maniobra a la aeronave de [Prev.Owner.GetAdjective] y con una sola ráfaga envió a «[Prev.GetCallsign]» cayendo en espiral desde los cielos de [FROM.GetMissionRegion].\n\n[Prev.GetFullName] era un piloto temido con muchas vidas de [FROM.Owner.GetAdjective] en su conciencia. Esta es una gran victoria y demuestra que cuando nos unimos detrás de grandes héroes, estos realizan grandes hazañas."
 ace_killed_other_ace.1.a: "¡Una victoria que todo [FROM.Owner.GetNameDef] recordará!"
 aces_killed_each_other.1.t: "El as de la aviación [FROM.GetFullName] ha caído"
 aces_killed_each_other.1.d: "Durante la última misión, nuestro famoso as de [FROM.GetAceType], [FROM.GetFullName], terminó en un combate prolongado con el temido piloto as [Prev.GetFullName]. Al quedarse bajo de municiones y sin posibilidad de escapar, «[FROM.GetCallsign]» maniobró a través del fuego de la aeronave de [Prev.Owner.GetAdjective] y procedió a embestir a «[Prev.GetCallsign]».\nTanto el avión de [FROM.GetCallsign] como el de [Prev.GetCallsign] fueron avistados cayendo en pedazos sobre [FROM.GetMissionRegion].\n\nAunque sirve de poco consuelo que la amenaza de [Prev.Owner.GetAdjective], «[Prev.GetCallsign]», ya no vuelva a ser un problema para nosotros, hemos perdido a una valiosa figura pública y una fuente de inspiración para toda la nación."
 aces_killed_each_other.1.d_major: "Durante la salida aérea más reciente, nuestro famoso as de [FROM.GetAceType], [FROM.GetFullName], terminó en un combate prolongado con el temido piloto as [Prev.GetFullName]. Al quedarse bajo de municiones y sin posibilidad de escapar, «[FROM.GetCallsign]» maniobró su [FROM.GetWingShort] a través del fuego de la aeronave de [Prev.Owner.GetAdjective] y procedió a embestir a «[Prev.GetCallsign]».\nTanto el [FROM.GetWingShort] de [FROM.GetCallsign] como el [Prev.GetWingShort] de [Prev.GetCallsign] fueron avistados cayendo en pedazos sobre [FROM.GetMissionRegion].\n\nAunque sirve de poco consuelo que la amenaza de [Prev.Owner.GetAdjective], «[Prev.GetCallsign]», ya no vuelva a ser un problema para nosotros, hemos perdido a una valiosa figura pública y una fuente de inspiración para toda la nación."
 aces_killed_each_other.1.a: "Una trágica pérdida para ambos bandos."
 election.1.t: "ELECCIÓN GENÉRICA"
 election.1.d: ""
 election.1.a: ""
 election.2.t: "Elecciones: El público se opone al rearme"
 election.2.d: "En las próximas elecciones, el apoyo a [Root.GetRulingParty] sigue siendo alto y la gente confía en el liderazgo de [Root.GetLeader]. Sin embargo, la intención del partido de aumentar la atención de [Root.GetName] en cuestiones militares no ha sido del todo popular entre el público, y un segmento significativo de los ciudadanos considera que este es un chovinismo desaconsejado. La guerra aún no ha llegado a nuestra frontera y a pocos les gustaría ver a [Root.GetName] tomar medidas agresivas. Si cooperamos con otros partidos importantes que comparten nuestras preocupaciones por la seguridad de la nación, podremos seguir gobernando después de las elecciones, aunque con un apoyo reducido."
 election.2.a: "El pueblo debe ser escuchado."
 election.2.b: "La protección de nuestra soberanía es lo primero."
 election.3.t: "Elecciones: El público demanda rearme"
 election.3.d: "La guerra que se aproxima a nuestras fronteras se cierne sobre las próximas elecciones, y muchos votantes están preocupados de que [Root.GetName] no esté preparado para verse involucrado en este conflicto o en lo que pueda surgir de él. Exigen que aumentemos nuestras precauciones y nos aseguremos de que nuestra nación esté preparada para la guerra. Si bien la mayoría todavía apoya a [Root.GetRulingParty], podemos perderlos ante elementos más radicales si no aliviamos sus aprensiones."
 election.3.a: "El pueblo tiene derecho a sentirse seguro."
 election.3.b: "Muchos siguen a favor de soluciones diplomáticas."
 election.4.t: "Elecciones: ¿Fascistas en el gobierno?"
 election.4.d: "En [Root.GetName] ha surgido un sentimiento nacionalista agresivo que ha dado lugar a varios partidos que promueven ideales fascistas: un Estado que impone su poder mediante la fuerza. Uno de ellos en particular ha ganado el apoyo en las elecciones actuales, lo que ha dado lugar a debates dentro del partido [Root.GetRulingParty] sobre si deberíamos o no intentar cooperar con ellos en la formación de nuestro gobierno. Si bien rechazan abiertamente los ideales democráticos que son la base de nuestro Estado, el hecho de que elijan participar en las elecciones en sí otorga cierta credibilidad a nuestras opiniones y reconocer su apoyo público puede evitar que emprendan acciones violentas."
 election.4.a: "¡Mejor ellos que los comunistas!"
 election.4.b: "Una amplia coalición de partidos democráticos es preferible."
 election.5.t: "Elecciones: ¿Comunistas en el gobierno?"
 election.5.d: "El movimiento comunista en [Root.GetName], alimentado por el descontento generalizado entre la clase trabajadora y las tendencias radicales entre los académicos, ha crecido lo suficiente como para dar lugar a la formación de varios partidos. Después de que uno de ellos haya obtenido un apoyo considerable en las elecciones actuales, los políticos de [Root.GetRulingParty] han comenzado a debatir si buscar o no su apoyo para formar un gobierno. Aunque consideran que nuestras instituciones democráticas son poco más que una tiranía burguesa, parecen ansiosos por hacer los cambios que quieren ver mediante la cooperación con el gobierno en lugar de derrocarlo."
 election.5.a: "¡Mejor la reforma que la revolución!"
 election.5.b: "Una amplia coalición de partidos democráticos es preferible."
 election.6.t: "Elecciones: Los partidos democráticos en minoría"
 election.6.d: "La política en [Root.GetName] se ha radicalizado cada vez más. Donde antes había un amplio apoyo a los partidos que defendían los ideales democráticos y las instituciones representativas de [Root.GetName], en estas elecciones más votantes se han volcado hacia los extremos políticos. Los partidos que se encuentran en el centro político, incluso si deciden dejar de lado sus diferencias, ya no forman una mayoría. Para evitar un gobierno minoritario débil, no tenemos otra opción que cooperar con los fascistas o los comunistas."
 election.6.a: "Trabajaremos con los fascistas para fortalecer [Root.GetName]."
 election.6.b: "Unirnos con los comunistas puede facilitar el cambio social."
 election.6.c: "Un gobierno minoritario, aunque débil, es preferible."
 election.7.t: "Los fascistas influyen en la política exterior"
 election.7.d: "La aceptación de los fascistas en nuestra coalición política ha tenido un impacto en nuestra política exterior. A pesar de su vehemente nacionalismo, tienen simpatizantes en el extranjero que aprueban la influencia que se les ha otorgado en [Root.GetName]. Los gobiernos totalitarios de inclinaciones ideológicas similares nos ven como aliados potenciales. Mantener vínculos con estas naciones, sin importar el desagrado que [Root.GetRulingParty] pueda tener por sus ideales, puede ser necesario para conservar el apoyo de los fascistas que respaldan a nuestro gobierno."
 election.7.a: "Podemos usar algunos aliados contra amenazas mayores."
 election.7.b: "Con amigos así, no necesitaríamos enemigos."
 election.8.t: "Los comunistas influyen en la política exterior"
 election.8.d: "Los comunistas se consideran a menudo parte de una revolución internacional, y nuestra decisión de aceptarlos como socios en nuestro gobierno ha llamado la atención de muchos de sus aliados internacionales. Los representantes de los partidos comunistas mantienen estrechos vínculos con naciones que han abandonado nuestra forma de gobierno en favor de una dictadura del proletariado, vínculos que quizá debamos reconocer en la política exterior [Root.GetAdjective] si deseamos conservar su apoyo."
 election.8.a: "Deberíamos abrazar nuestras causas comunes."
 election.8.b: "Por ese camino yace la disolución de [Root.GetName] misma."
 election.11.t: "Elecciones: Mayoría fascista"
 election.11.d: "Estas elecciones han sido devastadoras para la institución misma que representan. La mayoría de la población [Root.GetAdjective] ha emitido su voto a favor de un partido fascista que pretende abolir las elecciones e instalar un gobernante autocrático. Mientras muchos consideran la posibilidad de tomar las armas contra esta violación de los ideales democráticos que les permitieron tener este mandato en un principio, otros consideran que el uso de la violencia no hace más que confirmar aún más sus ideales."
 election.11.a: "Es un día oscuro para [Root.GetName], pero el pueblo ha hablado."
 election.11.b: "¡No renunciaremos a nuestra libertad sin luchar!"
 election.12.t: "Elección: Mayoría Comunista"
 election.12.d: "Las elecciones actuales han resultado en la victoria de los partidos comunistas, con reacciones mixtas por parte de la administración anterior. Mientras los nuevos gobernantes afirman representar al pueblo en su totalidad, ven muchas de las instituciones democráticas que apreciamos como intentos de manipular y oprimir a la clase trabajadora, lo que ha llevado a discusiones sobre qué realmente constituye una 'gobernanza del pueblo'. En algunas naciones, la revolución comenzó en ríos de sangre. En [Root.GetName], no sucedió así, pero aún podría terminar en ellos."
 election.12.a: "Esto es preocupante, pero realmente representan a la mayoría."
 election.12.b: "¡Debemos detenerlos antes de que eliminen cualquier indicio de pensamiento disidente!"
 election.13.t: "Elección: Magnate a favor del fascismo"
 election.13.d: "Un influyente industrial que está detrás de una de las empresas con las que hemos elegido trabajar para nuestra producción industrial ha hecho recientemente una serie de declaraciones sobre política que han resultado preocupantes para los miembros de la administración. Ha defendido abiertamente un gobierno autoritario y ha elogiado a las administraciones extranjeras que se identifican como fascistas, sugiriendo implícitamente que [Root.GetName] se beneficiaría de ese gobierno. Denunciar al magnate y sus ideales podría agriar nuestra relación con la empresa, pero dejarlos sin control le daría una plataforma para difundir propaganda que erosiona todo lo que representa [Root.GetRulingParty]."
 election.13.a: "Él puede decir lo que quiera, no necesitamos respaldarlo."
 election.13.b: "No podemos confiar en los fascistas para desarrollar y proteger a [Root.GetName]."
 election.14.t: "Elección: Excepción en tiempo de guerra"
 election.14.d: "[Root.GetName] se encuentra en estado de guerra. Normalmente se celebrarían elecciones en este momento, pero al estar en mitad de un conflicto importante, muchos argumentan que no podemos permitirnos perder tiempo en campañas políticas ni en un cambio de liderazgo si este llegara a producirse. Mientras tanto, otros afirman que declarar la guerra en curso como un motivo válido para saltarse las elecciones es el primer paso hacia el deterioro de la democracia de [Root.GetAdjective]. Después de todo, permitir que los asuntos militares tengan prioridad sobre la influencia del pueblo podría ser una pendiente peligrosa."
 election.14.a: "Las elecciones se celebrarán como de costumbre."
 election.14.b: "Podemos ocuparnos de estos asuntos cuando termine esta guerra."
 election.15.t: "Elección: Gobierno en disputa"
 election.15.d: "Con una elección próxima, las personas comienzan a cuestionar la capacidad de la administración actual para llevar adelante la guerra en curso. [Root.GetName] ha sufrido mucho y la opinión popular se ha vuelto en contra de aquellos que parecen estar llevando a nuestra nación a la derrota. Si bien nuestro pueblo está decidido a ver la guerra hasta el final, preferirían ver a otro gobierno ponerle fin."
 election.15.a: "Esta crisis de confianza es muy lamentable."
 election.15.b: "Dejemos que el panorama político cambie para mantener al pueblo unido."
 election.16.t: "[Root.GetLeader] goza de apoyo público"
 election.16.d: "Con las elecciones actuales, la oposición, en la medida en que existe, ha criticado el mandato cada vez más autoritario de [Root.GetRulingParty]. Cuestionan si el electorado tiene algún poder en absoluto, o si todo es simplemente para aparentar.\n\nSin embargo, el apoyo a [Root.GetLeader] parece seguir siendo alto y, aunque las circunstancias de las elecciones son cuestionadas por la comunidad internacional, no han sido impugnadas a nivel nacional. Parece ser que incluso si [Root.GetName] ya no está gobernada por el pueblo, el pueblo apoya a su gobernante... al menos los que lograron llegar a las urnas."
 election.16.a: "Un pueblo, un líder."
 election.17.t: "Cuestionamiento de los resultados electorales"
 election.17.d: "Aunque el régimen de [Root.GetLeader] ha obligado a la mayoría de sus oponentes a guardar silencio, algunos de ellos han hablado abiertamente sobre las recientes elecciones, acusando al [Root.GetRulingParty] de manipular los resultados e ignorar los claros esfuerzos por elegir un parlamento opuesto a sus políticas.\n\nEl gobierno hace caso omiso de estas objeciones, considerándolas un intento de dividir al pueblo contra sí mismo. Sin embargo, el hecho es que la mayoría de la población parece tener reservas sobre su gobierno, y la oposición, aunque silenciada por ahora, ha dejado clara su postura."
 election.17.a: "¡Separatistas!"
 political.1.t: "El comunismo en ascenso"
 political.1.d: "«¡Mientras los trabajadores se levantan contra sus opresores en todo el mundo, aquellos que afirman haber alcanzado la conciencia de clase en [Root.GetName] se quedan de brazos cruzados y esperan que el cambio llegue desde dentro de un sistema político tan profundamente corrompido que solo la revolución podría salvarnos de él!».\n\nAsí hablan las nuevas voces en el movimiento comunista de [Root.GetAdjective]. Refiriéndose al mandato de [Root.GetRulingParty] como una dictadura de la burguesía, han comenzado a pedir que se le desaloje del poder por cualquier medio necesario. Queda por ver si esos medios provendrán de dentro o de fuera."
 political.1.a: "Puede que haya quienes en el propio gobierno apoyen tales ideas."
 political.1.a.tt: "Aumenta la posibilidad de apoyo interno a un golpe comunista."
 political.1.b: "Un movimiento para el pueblo debe buscar el apoyo del pueblo."
 political.1.b.tt: "Aumenta la posibilidad de apoyo popular a un levantamiento comunista."
 political.2.t: "Simpatías marxistas en el gobierno"
 political.2.d: "Aunque la línea partidaria del [Root.GetRulingParty] es oponerse firmemente al socialismo revolucionario, manteniendo una mirada atenta sobre los elementos de izquierda radical del país, algunas personas en el gobierno están más abiertas a esa posibilidad. Al menos, ven espacio para abordar las preocupaciones de las personas que buscan soluciones en los comunistas sin correr el riesgo de una guerra civil a gran escala.\n\nAunque quienes siguen siendo leales a [Root.GetLeader] puedan considerarlas traidoras, estas voces disidentes pueden ser las que aseguren una transición relativamente incruenta si llega la revolución."
 political.2.a: "También los vigilaremos de cerca, por muchas razones."
 political.2.a.tt: "Si hay suficiente apoyo público, se puede ejecutar un golpe."
 political.3.t: "Comunistas ejecutan un golpe"
 political.3.d: "Aunque el movimiento popular en pro de la revolución comunista ha sido ruidoso y aterrador, un cierto sector del movimiento político ha permanecido en gran medida callado y a la espera. La espera ha terminado. Hoy, justo cuando la dirigencia y el ejército del [Root.GetRulingParty] se preparaban para una revuelta a escala nacional, varios funcionarios del gobierno del [Root.GetAdjective] rápidamente pusieron a [Root.GetLeader] bajo arresto domiciliario y entablaron negociaciones con los rebeldes.\n\nAunque se mantuvo la pretensión de salvaguardar el orden, lo que en realidad lograron las negociaciones fue asegurar posiciones dentro del nuevo estado socialista para aquellos que optaron por cooperar. El golpe terminó antes de que alguien pudiera actuar para detenerlo, y aquellos que lo hubieran hecho están ahora encarcelados, exiliados o ejecutados por el nuevo régimen."
 political.3.a: "Las mareas de la historia barrerán el pasado."
 political.4.t: "Conflictos de clases dividen a [Root.GetName]"
 political.4.d: "El movimiento revolucionario comunista, que en la teoría era un grupo marginal y popular entre los académicos radicales y en la práctica era un grupo de agitadores, ha ganado cada vez más apoyo entre la clase obrera [Root.GetAdjective]. El hecho de que cada vez más gente opte por identificarse con una \"clase\" implica que las ideas marxistas se están difundiendo más allá de quienes activamente buscan derrocar al gobierno.\n\nLos miembros del [Root.GetRulingParty] lamentan este desarrollo, añorando una época en la que \"[Root.GetAdjective]\" fuera lo que la gente identificaba como lo primero y más importante. Sus preocupaciones no son infundadas. Se podría argumentar que una revolución ya está en marcha, ocurriendo en varios niveles de la sociedad, y puede ser demasiado tarde para detenerla."
 political.4.a: "El pueblo puede llamarse como quiera."
 political.5.t: "Soldados desertan para unirse a los partisanos comunistas"
 political.5.d: "'¡Los capitalistas y los nacionalistas quieren que derraméis vuestra sangre por ellos en el frente, enfrentando a hermanos por disputas que no conciernen al trabajador! En lugar de tomar las armas contra los trabajadores que luchan en el extranjero, ¡levantadlas contra los opresores y derrocad a los tiranos!'\n\nEl ejército, normalmente un bastión del patriotismo y la lealtad, ha demostrado no ser inmune a la propaganda comunista que se está extendiendo rápidamente en [Root.GetName]. Los soldados están desertando, negándose a luchar por su país, llegando a veces tan lejos como para unirse a movimientos partisanos que dicen estar preparándose para la revolución."
 political.5.a: "Quizás estén luchando por un [Root.GetName] diferente."
 political.6.t: "La Revolución de [GetMonth]"
 political.6.d: "La idea de que el movimiento comunista representa al pueblo ciertamente ha cobrado impulso en [Root.GetName], donde el apoyo público al partido comunista ha aumentado rápidamente en los últimos meses. Pero quienes llaman a la revolución ya no son una colección dispar de guerrilleros y sindicatos descontentos. El grupo que está detrás del llamado a la revuelta está lo suficientemente organizado como para formar un gobierno si triunfa.\n\nSin embargo, si la revolución comenzara ahora, difícilmente podría llevarse a cabo sin lanzar a [Root.GetName] a una guerra civil. ¿Deben los revolucionarios arriesgarse a dividir la nación en dos para satisfacer su impaciencia, o esperar una mejor oportunidad en el futuro?"
 political.6.a: "¡Aquellos que deseen hacer historia deben actuar hoy!"
 political.6.b: "La revolución es inevitable. Lo inevitable puede esperar."
 political.7.t: "Auge del fascismo"
 political.7.d: "'¡El pueblo de [Root.GetAdjective] ha estado sometido durante demasiado tiempo al gobierno incompetente de [Root.GetRulingParty]! ¡Afirman representar al pueblo, pero ni siquiera son capaces de mantener nuestras calles en orden! ¡Sólo quitándolos del poder podremos hacer que esta nación crezca!'\n\nLos oradores fascistas de [Root.GetName] no han ocultado lo que piensan de nuestro actual gobierno y sistema político. Discursos como estos han despertado un disenso público que es particularmente pronunciado en los sectores más conservadores del ejército."
 political.7.a: "Es posible que los altos mandos alberguen simpatías no expresadas."
 political.7.a.tt: "Aumenta la posibilidad de apoyo interno a un golpe fascista."
 political.7.b: "La generación más joven tomará el relevo."
 political.7.b.tt: "Aumenta la posibilidad de apoyo popular a un golpe fascista."
 political.8.t: "Simpatías fascistas en el ejército"
 political.8.d: "Varios miembros de alto rango del ejército de [Root.GetAdjective] han expresado su apoyo, algunos en privado y otros abiertamente, al movimiento fascista en [Root.GetName]. Sienten que [Root.GetRulingParty] ha olvidado lo importante que es la fuerza de las armas para mantener unido al país, y están cada vez más molestos por el hecho de que el gobierno trate al ejército más como una herramienta que como una de las instituciones más importantes de la nación. Algunos de ellos llegan a sugerir que se necesita un nuevo gobierno, uno que sepa cómo liderar a [Root.GetName] en la próxima mitad del siglo.\n\nEs posible que esta facción no esté compuesta predominantemente por políticos, pero algunos de ellos han ganado posiciones en el departamento de defensa. Si estos acontecimientos continúan, es posible que cuenten con el apoyo político suficiente para ejecutar un golpe de Estado."
 political.8.a: "El espíritu nacional está por encima del gobierno."
 political.9.t: "Golpe de estado fascista"
 political.9.d: "Algunos dirán que lo vieron venir. Tanto los que advirtieron sobre los peligros del fascismo como los que lo ensalzaron como el salvador de [Root.GetName] han visto sus profecías hechas realidad hoy, cuando los militares de [Root.Capital.GetName] derrocaron al gobierno dirigido por [Root.GetRulingParty] y tomaron el poder. [Root.GetLeader] está desaparecido, se rumorea que se ha exiliado, y el golpe ha encontrado poca resistencia inicial.\n\nEl nuevo liderazgo de [Root.GetAdjective] tampoco tiene planes de permitir que crezca la resistencia. Se ha declarado la ley marcial y, con los cambios que están en marcha, es poco probable que lo que venga después sea muy diferente."
 political.9.a: "Se necesita un estado fuerte para proteger a las personas de sí mismas."
 political.10.t: "Guerra civil por el fascismo"
 political.10.d: "Aunque los intentos del movimiento fascista de revivir el sentimiento nacionalista han tenido cierto éxito, la resistencia contra estas ideas sigue siendo alta. Los generales que conspiran para derrocar a la actual administración están decepcionados por la falta de confianza que la propia población de [Root.GetAdjective] parece tener en [Root.GetFascistParty].\n\nSiguen convencidos de que la gente acabará cansándose de [Root.GetLeader], pero están divididos sobre qué curso de acción tomar. Algunos piden que se ejecute un golpe ahora, antes de que los enemigos de [Root.GetName] actúen. Sin embargo, hacerlo mientras el apoyo público es limitado hundiría a la nación en una guerra civil."
 political.10.a: "La voluntad de poder no tiene sentido si uno vacila en tomarlo."
 political.10.b: "Deben unir al pueblo primero y luego gobernarlo."
 political.11.t: "Formación de Divisiones de Asalto Fascistas"
 political.11.d: "En el fascismo, lo político y lo marcial siempre han estado entrelazados. Paralelamente al crecimiento de su movimiento político, los partidos fascistas han comenzado a formar organizaciones paramilitares para protegerse tanto de las amenazas internas como externas, siendo las amenazas internas sus oponentes políticos. Aunque muchas personas encuentran este desarrollo preocupante, la ola de furor militarista ha llevado a un aumento en la cantidad de voluntarios que se unen a nuestras fuerzas armadas.\n\nLos líderes políticos del movimiento han señalado que sus oponentes tienen razones para tener miedo. Al haber permeado el ejército en varios niveles de elementos tan explícitamente políticos, los enemigos de [Root.GetName] y los enemigos del fascismo están comenzando a parecerse mucho."
 political.11.a: "Solo los traidores al país tienen algo que temer."
 political.12.t: "La amenaza del comunismo"
 political.12.d: "'[Root.GetLeader] quiere hacernos creer que [Root.GetName] está a salvo y unido. No es de extrañar que este tipo de mentiras hayan envenenado las mentes de nuestra gente, ¡cuando una serpiente está enroscada en la puerta de al lado! Basta con mirar al otro lado de nuestra frontera para ver a compatriotas que se han vuelto unos contra otros en nombre del comunismo, declarando el fin de las naciones. ¿Cuánto tiempo pasará hasta que declaren también muerta a nuestra nación? ¿Nos protegerá [Root.GetRulingParty] de esta amenaza?'\n\nEl crecimiento del movimiento fascista en [Root.GetName] se ha visto reforzado por la proximidad de la revolución comunista. Muchos moderados que normalmente podrían descartar el fascismo como otro experimento ideológico equivocado, encuentran que esto también es una preocupación muy real para ellos. Si tuvieran que elegir entre el comunismo de nuestros vecinos y un régimen fascista, ciertamente preferirían este último. Incluso podrían estar dispuestos a apoyarlo activamente."
 political.12.a: "¡Seremos la vanguardia contra la amenaza roja!"
 political.13.t: "Avanzando hacia la democracia"
 political.13.d: "'Si silenciamos las voces del pueblo, ¿cómo podemos pretender ser la voz de [Root.GetName] nosotros mismos? Si tememos el disenso, si tememos ser denunciados públicamente o destituidos por votación pública, lo que realmente tememos es ser odiados y repudiados por nuestros propios ciudadanos. ¿Tiene el [Root.GetRulingParty] tan poca confianza en sus principios?'Una facción cuidadosa y loosely organizada pero apasionada en el gobierno ha comenzado a impulsar políticas menos represivas contra los enemigos del estado. Quieren que el público participe en la toma de decisiones a través de referendos y reuniones locales del partido, incluso si esto significa arriesgar el futuro de la agenda actual."
 political.13.a: "Podemos discutir esto internamente para empezar."
 political.13.a.tt: "Aumenta la posibilidad de apoyo interno para organizar elecciones."
 political.13.b: "Sabiendo que estamos en lo correcto, podemos permitir que nuestros enemigos hablen más abiertamente."
 political.13.b.tt: "Aumenta la posibilidad de que la gente exprese su apoyo a la democracia y forme una oposición."
 political.14.t: "Debate sobre la democracia en [Root.GetRulingParty]"
 political.14.d: "Sorprendentemente, el llamado a más referendos y menos medidas represivas contra los opositores al régimen ha recibido cierto apoyo en los debates internos del partido. Si bien la dirigencia de [Root.GetRulingParty] sigue siendo escéptica, varios miembros influyentes han apoyado un cambio.\n\nTal vez confíen en que poco cambiará en la práctica, o tal vez sean traidores en secreto a la causa del partido, como quieren muchos de sus oponentes. De todos modos, si se produce el llamado público a tales cambios, algunos de los líderes de [Root.GetName] están dispuestos a llegar a un acuerdo."
 political.14.a: "La elección no siempre debe ser entre libertad y muerte."
 political.14.a.tt: "El gobierno puede organizar elecciones cuando la política tenga un apoyo mayoritario."
 political.15.t: "Formación de Oposición Democrática"
 political.15.d: "Relajar las restricciones sobre qué tipo de propaganda contra [Root.GetRulingParty] se puede difundir públicamente ha provocado, como era de esperar, un aumento de las expresiones públicas de disidencia. Hasta ahora, las manifestaciones organizadas y los panfletos se encuentran principalmente en instituciones académicas y en algunas de las zonas más desfavorecidas de [Root.GetName], pero apenas hay dudas de que el movimiento se está extendiendo.\n\nLos líderes de la nación están divididos ante la cuestión. [Root.GetLeader], que mantiene un control de hierro sobre la dirección del partido, tiene pocos deseos de diversificar el debate público. Sin embargo, ya se han dado los primeros pasos y es posible que no haya marcha atrás."
 political.15.a: "El movimiento parece crecer de forma natural en ausencia de represión."
 political.16.t: "Llamado público a elecciones"
 political.16.d: "Las manifestaciones de disidencia pública, que antes se limitaban a zonas limitadas, ahora se han generalizado. Mientras la gente se reúne en las calles, el [Root.GetRulingParty] se encuentra en una encrucijada. Si continuamos permitiendo que se difunda esta propaganda, los referendos propuestos tanto desde dentro del propio partido como desde la oposición pueden demostrar que no contamos con el apoyo del público. La unidad por la que hemos luchado está dando paso a una pluralidad de opiniones unidas contra nosotros."
 political.16.a: "Incluso si se están produciendo reformas, debemos mostrar nuestra fuerza reprimiendo esta desafianza."
 political.16.b: "Dejemos que el pueblo sea escuchado."
 political.17.t: "Elecciones públicas en [Root.GetName]"
 political.17.d: "A medida que la libertad de expresión y de reunión se ha ido aceptando cada vez más en [Root.GetName], la facción dentro del [Root.GetRulingParty] que pide la celebración de elecciones ha pasado de ser un grupo de conspiradores secretos a reformistas apoyados públicamente. A pesar de las protestas de [Root.GetLeader], el país ha estado avanzando de forma lenta pero constante hacia la democracia durante los últimos meses y ahora parece que la celebración de elecciones será el siguiente paso natural.\n\nSin embargo, no todos los ciudadanos de [Root.GetAdjective] están a favor de las reformas democráticas. Todavía hay un debate dentro del partido sobre si se debe esperar a celebrar las elecciones hasta que podamos garantizar un desarrollo estable."
 political.17.a: "Aquellos leales a [Root.GetRulingParty] apoyarán la decisión ahora."
 political.17.b: "Las reformas necesitan un apoyo más amplio antes de poder celebrar las elecciones."
 political.18.t: "Los fascistas exigen un referéndum"
 political.18.d: "El movimiento fascista [Root.GetAdjective], que crece rápidamente, nunca ha afirmado que necesite el apoyo de la mayoría antes de tomar el poder, y cuenta con unir a la nación bajo su liderazgo una vez que se haya establecido su gobierno. Sin embargo, parece que su apoyo público ha crecido rápidamente. Muchos fascistas ahora llaman hipócrita a [Root.GetLeader], afirmando representar los deseos del pueblo mientras que en realidad hacen oídos sordos a las masas.\n\nHasta ahora, los miembros de [Root.GetRulingParty] han descartado el llamado a un referéndum como un intento típico de alterar el sistema, pero al menos es una medida política. Si no actuamos ahora, los fascistas pueden elegir la lucha violenta como un mejor camino para llegar al poder."
 political.18.a: "¡Suprimamos este movimiento odioso!"
 political.18.b: "No les prestemos atención."
 political.18.c: "Si la gente lo desea, celebraremos el referéndum."
 political.19.t: "Los comunistas exigen un referéndum"
 political.19.d: "Las ideas marxistas se arraigaron en [Root.GetName] hace mucho tiempo, pero últimamente han ganado un apoyo mucho más amplio. El movimiento se ha extendido más allá de la teoría política y se ha extendido a la práctica política, con trabajadores descontentos e incluso algunas celebridades de alto perfil que han expresado su apoyo. Los comunistas llaman a esto conciencia de clase. El [Root.GetRulingParty] lo llama una vía rápida hacia los disturbios y la traición.\n\nMostrando poca fe en que [Root.GetLeader] esté dispuesto a implementar las reformas que exige, los comunistas más vocales han pedido un referéndum inmediato para derrocar al gobierno actual. Si bien podríamos ser capaces de revertir el impulso de este movimiento de masas, si no lo hacemos, sin duda tendremos que recurrir al método comunista más popular de derrocamiento: la revolución."
 political.19.a: "¡Hay que detener las actividades no [Root.GetAdjective]!"
 political.19.b: "Ignorémoslos, solo están causando problemas."
 political.19.c: "El referéndum es preferible a una revuelta sangrienta."
 political.20.t: "Los demócratas exigen un referéndum"
 political.20.d: "No es de extrañar que la idea de que el pueblo gobierne la nación en la que habita pueda fácilmente volverse muy popular entre la gente. El [Root.GetRulingParty], por supuesto, ve la idea de democracia representada por estos movimientos (libertad de expresión, elecciones públicas, prensa libre) como mera retórica populista destinada a debilitar al gobierno de [Root.GetLeader].\n\nSin embargo, no se puede negar que esas ideas han calado entre la población de [Root.GetAdjective]. En un estilo verdaderamente democrático, piden un referéndum público para reemplazar al régimen actual. Aunque actualmente es fácil ignorarlas, estas ideas tienen una forma de volverse muy persistentes. ¿Qué nos sucederá si hacemos imposible la revolución pacífica?"
 political.20.a: "Arrestémoslos."
 political.20.b: "Procedamos como de costumbre."
 political.20.c: "Si aceptamos el referéndum, tal vez podamos preservar nuestro legado."
 political.21.t: "Los fascistas marchan hacia [Root.Capital.GetName]"
 political.21.d: "Tras haberles negado el referéndum, casi un intento simbólico de tomar el poder legalmente, los fascistas han utilizado su importante apoyo público y sus conexiones en el ejército [Root.GetAdjective] para intentar un golpe de Estado. El gobierno de [Root.GetRulingParty] ha rechazado sus condiciones y afirma que va a luchar hasta el final para preservar [Root.GetName] tal como lo conocemos."
 political.21.a: "¡Los detendremos a cualquier costo!"
 political.21.b: "¡Los fascistas llevan el verdadero espíritu de [Root.GetName]!"
 political.22.t: "Levantamiento de los comunistas"
 political.22.d: "Después de que se denegara su solicitud de referéndum, los pocos reformistas del movimiento comunista en [Root.GetName] perdieron rápidamente influencia frente a los elementos más radicales. Ante la negativa de [Root.GetRulingParty] a reconocer el apoyo público a las reformas sugeridas, la visión romántica de la revolución se generalizó gradualmente y los líderes del movimiento pasaron a ser aquellos que podían provocar un motín con mayor facilidad. Esos motines han estallado ahora en una guerra civil a gran escala, con el futuro de la nación en juego."
 political.22.a: "¡No permitiremos que arruinen nuestro país!"
 political.22.b: "¡El fuego de la revolución debe extinguirse con la sangre de los opresores!"
 political.23.t: "La Primavera [Root.GetAdjective]"
 political.23.d: "Tras el rechazo a su propuesta de celebrar un referéndum público para instaurar la democracia, los promotores de la propuesta han tachado al régimen de [Root.GetLeader] de incorregible. Una amplia coalición de grupos rebeldes, unidos por su objetivo común de instaurar sistemas políticos más representativos en [Root.GetName], han tomado las armas y han anunciado que no descansarán hasta que el [Root.GetRulingParty] sea derrocado."
 political.23.a: "¡Líbranos de este gobierno de masas!"
 political.23.b: "¡Por fin, [Root.GetName] es libre!"
 political.24.t: "Ridiculizando a los fascistas"
 political.24.d: "El encaprichamiento del pueblo [Root.GetAdjective] con el orgullo nacionalista y los intentos de revivir las glorias del pasado parecen haber pasado. Un duro despertar para sus ardientes partidarios, cuyos uniformes, posturas militaristas y discursos exagerados son ahora más comúnmente objeto de burla que de simpatías.\n\nEl fascismo [Root.GetAdjective], que en el pasado se consideraba una amenaza para la base de poder del [Root.GetRulingParty], ahora se ve cada vez más como una posición absurda y extremista y un ataque a los valores más fundamentales de nuestra nación, la misma nación que dicen tener en tan alta estima. La palabra parece más adecuada como insulto que como designación política."
 political.24.a: "Qué grupo de payasos."
 political.25.t: "La moda comunista se desvanece"
 political.25.d: "Muchos comunistas habían predicho que [Root.GetName] iba a ser la próxima nación en caer ante la llamada revolución internacional, pero después de unos meses de huelgas y banderas rojas en las calles, el movimiento parece haber menguado. La clase obrera, la supuesta fuerza impulsora de la revolución, tiene preocupaciones más urgentes que derrocar a [Root.GetLeader] y parece decididamente poco impresionada por el buen resultado de estas revoluciones en otros lugares. Mientras tanto, los intelectuales que escribieron apasionados llamamientos a degollar a los opresores han resultado ser sorprendentemente reacios a instigar nada que pueda realmente alterar su cómodo estilo de vida.\n\nEs probable que se siga hablando de la revolución, ya sea con cervezas baratas o vinos caros, pero probablemente serán palabras y nada más."
 political.25.a: "Qué grupo de hipócritas."
 political.26.t: "El movimiento democrático se queda en silencio"
 political.26.d: "Tras unos meses de ruidosa oposición contra el régimen de [Root.GetLeader], exigiendo elecciones públicas y leyes más liberales sobre la libertad de reunión y de expresión, el movimiento parece haberse desmoronado. La población expresa ahora una mayor preocupación por la estabilidad de [Root.GetName] si tales reformas llegaran a producirse, y quienes claman por la democracia son vistos más como alborotadores que como otra cosa.\n\nMisteriosamente, muchas de las figuras principales del movimiento parecen haber desaparecido o haber cesado su actividad de forma repentina. Quizás algunos optaron por exiliarse al ver el fracaso de sus esfuerzos. En cualquier caso, el gobierno de [Root.GetRulingParty] niega todo conocimiento e implicación."
 political.26.a: "Qué grupo de desertores."
 political.27.t: "[Root.GetLeader] abandona la política exterior neutral"
 political.27.d_fascism: "Tras el reciente ascenso al poder de [Root.GetRulingParty], [Root.GetLeader] anunció que [Root.GetName] ya no mantendría su política exterior neutral.\n'El mundo se ha vuelto enredado y complejo. Ya no estamos seguros por nuestra cuenta. Debemos apoyar a nuestros socios fascistas contra nuestros enemigos. Si no elegimos un bando, pereceremos solos.'"
 political.27.d_communism: "Tras el reciente ascenso al poder de [Root.GetRulingParty], [Root.GetLeader] ha anunciado que [Root.GetName] ya no mantendrá su política exterior de neutralidad.\n«El mundo se ha vuelto enredado y complejo. Este país siempre se ha mantenido firme en sus principios y ha estado dispuesto a defenderlos. Ya no estamos seguros por nuestra cuenta. La neutralidad ya no es el refugio seguro que solía ser, y quienes buscan el poder en este mundo no la respetan. Debemos mantenernos unidos junto a nuestros hermanos comunistas contra las potencias que pretenden oprimirnos. Contra la mayoría burguesa que no desea otra cosa que mantenernos sometidos. Si no tomamos una postura firme, pereceremos solos»."
 political.27.a: "Por el futuro de [Root.GetName]"
 political.28.t: "[Root.GetNameDef] Reunificado"
 political.28.d: "La terrible guerra civil que ha devastado nuestra tierra llega a su fin, y finalmente hemos alcanzado un acuerdo político. Ahora nos entendemos con nuestros compatriotas, y juntos reconstruiremos nuestra gran nación. Los enemigos que han pretendido capitalizar nuestras disputas internas deben enfrentarse ahora a un Estado unificado.\n\n¡El nuevo [Root.GetName] [Root.GetRulingIdeology] nunca volverá a dividirse!"
 political.28.a: "¡Unidos al fin!"
 THREAT_FROM_EFFECT: "Amenaza de acciones"
 war_justification.1.t: "[Root.GetLeader] Habla en Contra de [FROM.GetName]"
 war_justification.1.d: "«¿Acaso [FROM.GetName] pertenece a la población de [FROM.GetAdjective]? Planteémonos una pregunta mejor: ¿el futuro pertenece a la población de [FROM.GetAdjective] o pertenece a [Root.GetNameDef]?».\n\nEl discurso de hoy de [Root.GetLeader] sugiere que [Root.GetName] se encamina hacia la guerra. Las tensiones políticas se han ido acumulando a lo largo del último mes y parece que el pueblo está llegando a aceptar que la guerra es inevitable."
 war_justification.1.a: "¡El futuro le pertenece a [Root.GetName]!"
 war_justification.2.t: "[Root.GetLeader] denuncia los ideales de [FROM.GetAdjective]"
 war_justification.2.d: "«Los del bando de [FROM.GetAdjective] afirman tener libertad y democracia, afirman desear la paz, pero todas esas cosas de las que se enorgullecen están vacías. Su democracia divide al pueblo donde este debería mantenerse unido, y su libertad solo delata una falta de disciplina. Nosotros vemos a través de esas mentiras... y podemos ver que esta paz, una paz bajo sus condiciones, también es una mentira».\n\n[Root.GetRulingParty] lleva mucho tiempo ridiculizando la debilidad de la nación de [FROM.GetAdjective], pero últimamente la retórica se ha vuelto más agresiva. El día del conflicto armado está cada vez más cerca."
 war_justification.2.a: "[Root.GetName] está unido bajo [Root.GetLeader]."
 war_justification.3.t: "[Root.GetLeader] advierte contra el comunismo de [FROM.GetAdjective]"
 war_justification.3.d: "«¿Existe una amenaza mayor para nuestro estilo de vida, o de hecho para la vida misma, que el comunismo? Esta plaga que amenaza con hacer que los esclavos, y no los amos, gobiernen cada nación; que pretende abolir la nación misma, abolir a los pueblos y a su historia. Tomaremos [FROM.GetName] y aboliremos la plaga comunista».\n\nEl odio de [Root.GetLeader] hacia los comunistas es bien conocido desde antes del ascenso al poder de [Root.GetRulingParty], pero parece haberse intensificado recientemente en el caso específico del gobierno de [FROM.GetAdjective]. Nuestra misión de purgar el marxismo de la faz de la Tierra podría comenzar ahí."
 war_justification.3.a: "Aquellos que rechazan las naciones verán perecer la suya propia."
 war_justification.4.t: "[Root.GetName] se Prepara para la Gran Lucha"
 war_justification.4.d: "«Los del bando de [FROM.GetAdjective] son un pueblo que no se desprenderá fácilmente del poder. Sin embargo, también deben darse cuenta de que la trayectoria de nuestras dos naciones solo puede terminar en un enfrentamiento. Debemos armarnos de valor para la lucha que se avecina. Pues [FROM.GetName] no se dejará tomar sin pelear».\n\nLa posibilidad de un entendimiento entre los gobiernos afines de [FROM.GetName] y [Root.GetName] ha dado paso a una campaña para tomar su territorio por la fuerza."
 war_justification.4.a: "La historia será escrita a través de nuestra victoria."
 war_justification.5.t: "[Root.GetLeader] lleva la revolución a [FROM.GetName]"
 war_justification.5.d: "«Mientras nosotros hemos consolidado la sociedad socialista en [Root.GetName], muchas naciones todavía sufren bajo los déspotas de antaño. Los trabajadores de [FROM.GetName] no tienen voz ni medios para organizarse, y cualquier intento de instaurar el socialismo será aplastado salvajemente por el régimen de [FROM.GetLeader]. No podemos esperar a que los engranajes de la revolución internacional giren para el pueblo de [FROM.GetAdjective]. ¡Con la revolución hemos demostrado que podíamos aplastar a los opresores capitalistas aquí, y aplastaremos a los opresores en [FROM.Capital.GetName] también!».\n\n[Root.GetLeader] ha abandonado todo intento de retórica diplomática hacia la [FROM.GetName] controlada por [FROM.GetRulingParty]. El empeño por erradicar todas las fronteras se centra ahora estrictamente en erradicar sus fronteras."
 war_justification.5.a: "¡Trabajadores de [FROM.GetAdjective], vuestra liberación está cerca!"
 war_justification.6.t: "[Root.GetLeader] pide ayuda para los trabajadores de [FROM.GetAdjective]"
 war_justification.6.d: "«¿Existe mayor mentira que la supuesta libertad del pueblo de [FROM.GetAdjective]? Donde antes eran esclavos de los príncipes y duques que reclamaban la propiedad del suelo, ahora se ven obligados a vender su mano de obra a quienes reclaman la propiedad de las fábricas. Su libertad para elegir a un amo sobre otro difícilmente puede llamarse libertad. Asimismo, su libertad para elegir a sus líderes es una opción falsa, ya que la propaganda nunca permitiría que los verdaderos socialistas asumieran el poder. Un pueblo tan profundamente adoctrinado solo puede ser salvado mediante una intervención de [Root.GetAdjective]».\n\n[Root.GetLeader] lleva mucho tiempo polemizando contra el gobierno de [FROM.GetName] en las reuniones del partido, pero esta retórica se utiliza ahora con mayor frecuencia en público. Hay pocos motivos para creer que este conflicto pueda resolverse pacíficamente."
 war_justification.6.a: "¡Aplastaremos su dictadura burguesa!"
 war_justification.7.t: "El comunismo de [FROM.GetAdjective] fracasa"
 war_justification.7.d: "«Camaradas, aunque a los más grandes revolucionarios se les llamó una vez traidores, ha quedado claro que la revolución misma ha sido traicionada. ¿De qué otra forma se explicaría el mandato del [FROM.GetRulingParty] de [FROM.GetName], que ha dejado de lado cualquier atisbo de las ideas marxistas para construir un Estado de trabajadores degenerado donde pueden reinar bajo premisas falsas? Al fortalecer su propio poder a precio de la revolución internacional, han demostrado que les importan poco los ideales que dicen defender. Debemos llevarles la verdadera revolución».\n\nAunque inicialmente apoyaba la revolución de [FROM.GetAdjective], [Root.GetLeader] has expresado una creciente decepción con la forma en que se ha desarrollado. [Root.GetRulingParty] podría tener que intervenir antes de que sea demasiado tarde."
 war_justification.7.a: "Todavía hay tiempo para rescatar su intento de socialismo."
 war_justification.8.t: "[Root.GetLeader] insta a aplastar el nacionalismo de [FROM.GetAdjective]"
 war_justification.8.d: "«¿Existe alguna sociedad más repugnante para el futuro de la revolución, alguna más ajena a la difícil situación del trabajador, que el régimen fascista de [FROM.GetName]? Al instar a la población a entregarse fanáticamente a la decrépita institución del Estado-nación, han disfrazado con ropajes modernos los viejos métodos de la salvajería, intentando presentarse como una alternativa de futuro ante la inevitable victoria internacional de la clase obrera. Es solo cuestión de tiempo que ataquen a nuestra nación o a nuestros aliados. Ataquemos primero».\n\nNadie esperaba menos que un desprecio mutuo entre nuestro bando y el de [FROM.GetAdjective], pero la animosidad se han intensificado últimamente. Ahora parece que el conflicto surgirá más temprano que tarde."
 war_justification.8.a: "¡Muerte a los fascistas!"
 war_justification.9.t: "Diplomacia con [FROM.GetName] se rompe"
 war_justification.9.d: "«A pesar de nuestros intentos por encontrar una solución diplomática a nuestro conflicto con [FROM.GetName], las negociaciones han vuelto a fracasar, dejándonos con opciones limitadas. El régimen autoritario de [FROM.GetLeader] ha mostrado el enfoque irracional sobre este asunto típico de los líderes que no rinden cuentas ante su pueblo. A menos que se produzca un giro completo en las políticas del liderazgo de [FROM.GetAdjective], no nos quedará más remedio que luchar».\n\nLa intervención de [Root.GetAdjective] en [FROM.GetName] ha sido un tema candente, y algunos políticos de la oposición afirman que [Root.GetRulingParty] ha seguido una política belicista desde el principio. Sea cual sea su intención original, una guerra futura parece ahora, de repente, muy real e inevitable."
 war_justification.9.a: "A veces, es necesario escalar la montaña del conflicto."
 war_justification.10.t: "[Root.GetLeader] pide la intervención en [FROM.GetName]"
 war_justification.10.d: "«Con gran pesar debemos afrontar la realidad de nuestra situación: una invasión de [FROM.GetName] puede ser nuestro único recurso. Representa una ventaja estratégica demasiado grande como para intentar cualquier otra solución en nuestra situación actual. Aunque confiamos en que ni el pueblo de [Root.GetAdjective] ni el de [FROM.GetAdjective] desean la guerra, la historia nos ha llevado a este punto y nuestras opciones son limitadas. Solo podemos esperar que, mediante esta afirmación de nuestro poder militar, podamos evitar un mayor derramamiento de sangre en el futuro».\n\nAunque existe la teoría popular de que las democracias no van a la guerra contra otras democracias, los acontecimientos recientes apuntan a una futura invasión de [Root.GetAdjective] sobre [FROM.GetName]. Puede que la historia todavía nos sorprenda."
 war_justification.10.a: "De todos modos, [FROM.GetName] es una democracia dudosa."
 war_justification.11.t: "[Root.GetLeader] habla en contra de la amenaza roja"
 war_justification.11.d: "«Sin duda, el comunismo de [FROM.GetAdjective] es una de las mayores amenazas para la libertad y el orden en esta era. Implacable y despiadado, amenaza con devorar no solo la esperanza del pueblo de [FROM.GetAdjective] de tener una sociedad próspera y democrática, sino también la de sus vecinos. Si no actuamos ahora, bien podríamos ver caer este primer dominó demasiado tarde, dejando a su paso más experimentos sociales fallidos. ¿Cuántos más tienen que morir antes de que intervengamos?».\n\nLa amenaza de que la actividad subversiva socave nuestra democracia, impulsada por las ambiciones de [FROM.GetAdjective], se ha convertido recientemente en un tema de debate muy candente. Mientras que los representantes de la oposición han calificado esto como un «Peligro Rojo» destinado a buscar la guerra con [FROM.GetName], la retórica de [Root.GetRulingParty] ha tenido un gran éxito hasta ahora."
 war_justification.11.a: "Siguen una ideología violenta, ¿qué reacción pueden esperar más que violencia?"
 war_justification.12.t: "[Root.GetLeader] se enfrenta al fascismo de [FROM.GetAdjective]"
 war_justification.12.d: "«In la historia moderna, tal vez incluso en la historia en su conjunto, no ha habido peor tiranía que el puño de hierro con el que [FROM.GetRulingParty] atenaza ahora a [FROM.GetName]. Se podrá argumentar que no deberíamos provocar un conflicto, que deberíamos confiar en que [FROM.GetLeader] cumplirá los tratados y las promesas en el futuro, pero esas personas no ven que los tratados firmados bajo el mandato del fascismo no sirven para nada. Para estos mentirosos deshonrosos, la fuerza da la razón, y el papel en el que está escrito un acuerdo arde con la misma facilidad que los libros de sus detractores».\n\nQuienes esperaban desde hace tiempo evitar una confrontación directa con [FROM.GetName] cuentan ahora con la firme oposición de [Root.GetLeader], quien sostiene que, en términos maquiavélicos, no hacemos más que posponer la guerra en beneficio del enemigo. A este ritmo, puede que después de todo asestemos el primer golpe."
 war_justification.12.a: "No habrá paz en nuestro tiempo hasta que ellos desaparezcan."
 war_justification.13.t: "[Root.GetLeader] hace un llamamiento a la guerra contra [FROM.GetName]"
 war_justification.13.d: "«Aunque seamos un pueblo pacífico, nuestra naturaleza por sí sola no determina el rumbo que debemos tomar en la historia. Este es un tiempo de guerra. Durante demasiado tiempo, los de [FROM.GetAdjective] han poseído los medios que necesitamos para superar las pruebas a las que podamos enfrentarnos, y es evidente que no se desprenderán de ellos pacíficamente. A pesar de nuestros mejores esfuerzos por construir un Estado moderno, algunos asuntos solo pueden resolverse mediante las viejas pruebas de la batalla».\n\nLa retórica hostil de [Root.GetLeader] hacia [FROM.GetName] ha llegado muy lejos para justificar una invasión. Una parte de la población apoya este rumbo, pero la decisión final recae en manos de nuestro líder."
 war_justification.13.a: "Puede ser una decisión difícil, pero debemos respaldarla."
 war_justification.14.t: "[Root.GetLeader] desafía las pretensiones de [FROM.GetAdjective]"
 war_justification.14.d: "«En [FROM.GetName] podrán considerarse más modernos y avanzados que nosotros, pero la verdad es que su nación no ha sido puesta a prueba como la nuestra, ni están preparados para las amenazas que ya se ven claramente en el horizonte. Con su desprecio hacia nosotros, y al impedirnos apoderarnos de lo que por derecho nos pertenece, nos han convertido en una de esas amenazas para ellos mismos. Su nación, débil y dividida, difícilmente resistirá nuestras reclamaciones».\n\nLa opinión despectiva sobre [FROM.GetName] que desde hace tiempo mantiene [Root.GetRulingParty] ha pasado de la crítica a la hostilidad. Aunque la opinión generalizada es que el pueblo de [FROM.GetAdjective] desea evitar la guerra, [Root.GetLeader] afirma que sus líderes electos la han provocado con su arrogancia."
 war_justification.14.a: "No saben cuán fuertes nos han hecho nuestras adversidades."
 war_justification.15.t: "[Root.GetLeader] desea restaurar el orden en [FROM.GetName]"
 war_justification.15.d: "«El espíritu nacional de [Root.GetAdjective] es fuerte, pero no todas las naciones tienen tanta fortuna. A [FROM.GetName] le han destruido sus tradiciones y sus gobernantes legítimos han sido asesinados y enterrados hace tiempo, todo en nombre de la idea de la gran revolución marxista. Es nuestro deber restaurar el orden en este mundo descarriado por usurpadores sanguinarios y afirmar la fuerza de [Root.GetName] contra esta amenaza».\n\nAunque [Root.GetRulingParty] siempre se ha opuesto al comunismo, [FROM.GetName] ha sido blanco de ataques particulares en los discursos recientes. Sea o no una amenaza real el ataque de los comunistas contra la nación de [Root.GetAdjective], el ataque preventivo contra el comunismo de [FROM.GetAdjective] ya está en marcha."
 war_justification.15.a: "¡Los asesinados en la revolución serán vengados!"
 war_justification.16.t: "[Root.GetLeader] acusa a los opresores de [FROM.GetAdjective]"
 war_justification.16.d: "«Mis opositores querrían haceros creer que mi mandato es como el de [FROM.GetRulingParty] en [FROM.GetName]. No podrían estar más equivocados. Mientras que los éxitos de [FROM.GetLeader] son el resultado de una moda reciente, un movimiento de masas destructivo empeñado en intimidar a otras naciones para que se sometan, [Root.GetRulingParty] se opone a ese movimiento como los únicos que no se someterán. Estoy preparado para hacer lo que sea necesario para eliminar esta amenaza, incluso si eso significa la guerra».\n\nEl régimen de [Root.GetLeader] ha adoptado una política hostil hacia la nación de [FROM.GetAdjective]. Sea como sea que se llame a nuestros líderes, la palabra fascista queda reservada para nuestros enemigos."
 war_justification.16.a: "La tradición y el pragmatismo siempre triunfarán sobre el fanatismo y el terror."
 war_justification.17.t: "[Root.GetLeader] cuestiona la soberanía de [FROM.GetAdjective]"
 war_justification.17.d: "«¿Quién determina las fronteras de una nación y cómo se determinan? Sea cual sea la forma que la gente haya encontrado en el pasado para justificar dónde termina [Root.GetName] y dónde empieza [FROM.GetName], vivimos en una nueva era. La importancia estratégica de esta frontera no puede exagerarse, y estamos plenamente en nuestro derecho de cambiarla para garantizar la seguridad continua de nuestro pueblo».\n\nAl escuchar los discursos recientes de [Root.GetLeader], una invasión de [FROM.GetName] parece inminente. Las voces disidentes se han opuesto, pero el apoyo público a la guerra va en aumento."
 war_justification.17.a: "¡Debemos unirnos a esta causa!"
 war_justification.18.t: "[Root.GetLeader] cuestiona los motivos de [FROM.GetName]"
 war_justification.18.d: "«No cabe duda de que [FROM.GetName] se está preparando para la guerra. Los cambios en la política económica dejan claro que los de [FROM.GetAdjective] no son un pueblo de paz, sino que esperan la oportunidad adecuada para atacarnos. ¿Nos quedaremos de brazos cruzados viendo cómo se arman mientras [Root.GetName] está indefenso? ¿O desarmaremos esta amenaza antes de que crezca más allá de nuestro poder?».\n\nLos halcones de [Root.GetRulingParty] han puesto sus ojos en [FROM.GetName], argumentando que el ataque es la mejor defensa. Su punto de vista está ganando fuerza y [Root.GetName] se prepara para la guerra."
 war_justification.18.a: "Al menos a través de la guerra, habrá un fin a este conflicto."
 war_justification.19.t: "[Root.GetLeader] se muestra indignado por la actitud de [FROM.GetAdjective]"
 war_justification.19.d: "«Esos ciudadanos ingenuos de [Root.GetName] que se imaginan a los de [FROM.GetAdjective] como un pueblo de paz están completamente desconectados de la realidad. Quienes viven en nuestra frontera no tienen el lujo de tales delirios, al ver a sus tropas acercándose a nosotros justo al otro lado. Esta es una amenaza que no podemos dejar sin respuesta. Con cada día que pasa, [FROM.GetName] se prepara para la guerra. Sería una locura que nosotros no hiciéramos lo mismo».\n\nLa presencia militar de [FROM.GetAdjective] cerca de nuestro territorio ha despertado una creciente preocupación, ya que esta nación parece cada vez más enemiga de [Root.GetRulingParty]. Si esto es la causa o el efecto de su polémica es un asunto de discusión."
 war_justification.19.a: "Sin importar eso, debemos preparar a la gente para la guerra."
 war_justification.20.t: "[Root.GetLeader] defiende la invasión de [FROM.GetName]"
 war_justification.20.d: "«Si queremos tener la ventaja estratégica en la previsible, por no decir inevitable guerra con [FROM.GetName], no hay margen para dudar. Se trata de salvaguardar el futuro de nuestros hijos y asegurar que [Root.GetName] tenga un lugar en el mundo del mañana. Es una cuestión de devoción a nuestra causa y a los ideales que damos por sentados. Es hora de actuar».\n\nUna serie de discursos entusiastas de los líderes de [Root.GetRulingParty], principalmente de [Root.GetLeader], ha estado llamando a la población a apoyar una invasión de [FROM.GetName]. Los motivos geopolíticos detrás de la invasión son menos prominentes en la retórica que los sentimientos patrióticos, pero esta campaña parece muy eficiente para convencer a la opinión pública de su necesidad."
 war_justification.20.a: "La nación respalda esta decisión importante."
 war_justification.201.t: "[FROM.GetLeader] habla en contra de [Root.GetName]"
 war_justification.201.d: "«¿Acaso [Root.GetName] pertenece a la población de [Root.GetAdjective]? Planteémonos una pregunta mejor: ¿el futuro pertenece a la población de [Root.GetAdjective] o pertenece a [FROM.GetName]?».\n\nEl discurso de hoy de [FROM.GetLeader] sugiere que [FROM.GetName] se encamina hacia la guerra. Las tensiones políticas se han ido acumulando a lo largo del último mes y parece que el pueblo de [FROM.GetAdjective] ha aceptado que la guerra es inevitable. [Root.GetName] también debe prepararse."
 war_justification.201.a: "¿Por qué no se nos permite vivir en paz?"
 war_justification.202.t: "[FROM.GetLeader] denuncia los ideales de [Root.GetAdjective]"
 war_justification.202.d: "«Los del bando de [Root.GetAdjective] afirman tener libertad y democracia, afirman desear la paz, pero todas esas cosas de las que se enorgullecen están vacías. Su democracia divide al pueblo donde este debería mantenerse unido, y su libertad solo delata una falta de disciplina. Nosotros vemos a través de esas mentiras... y podemos ver que esta paz, una paz bajo sus condiciones, también es una mentira».\n\n[FROM.GetRulingParty] lleva mucho tiempo ridiculizando la debilidad de la nación de [Root.GetAdjective], pero últimamente la retórica se ha vuelto más agresiva. El día del conflicto armado está cada vez más cerca."
 war_justification.202.a: "Como era de esperar de una escoria fascista como [FROM.GetLeader]."
 war_justification.203.t: "[FROM.GetLeader] advierte contra el comunismo de [Root.GetAdjective]"
 war_justification.203.d: "«¿Existe una amenaza mayor para nuestro estilo de vida, o de hecho para la vida misma, que el comunismo? Esta plaga que amenaza con hacer que los esclavos, y no los amos, gobiernen cada nación; que pretende abolir la nación misma, abolir a los pueblos y a su historia. Tomaremos [Root.GetName] y aboliremos la plaga comunista».\n\nEl odio de [FROM.GetLeader] hacia los comunistas es bien conocido desde antes del ascenso al poder de [FROM.GetRulingParty], pero parece haberse intensificado recientemente en el caso específico del gobierno de [Root.GetAdjective]. Nuestra misión de purgar el marxismo de la faz de la Tierra podría comenzar ahí."
 war_justification.203.a: "Si temen nuestra causa, temen a su propio pueblo."
 war_justification.204.t: "[FROM.GetName] se prepara para la gran lucha"
 war_justification.204.d: "«Los del bando de [Root.GetAdjective] son un pueblo que no se desprenderá fácilmente del poder. Sin embargo, también deben darse cuenta de que la trayectoria de nuestras dos naciones solo puede terminar en un enfrentamiento. Debemos armarnos de valor para la lucha que se avecina. Pues [Root.GetName] no se dejará tomar sin pelear».\n\nLa posibilidad de un entendimiento entre los gobiernos afines de [Root.GetName] y [FROM.GetName] ha dado paso a una campaña para tomar su territorio por la fuerza."
 war_justification.204.a: "¡Que vengan!"
 war_justification.205.t: "[FROM.GetLeader] lleva la revolución a [Root.GetName]"
 war_justification.205.d: "«Mientras nosotros hemos consolidado la sociedad socialista en [FROM.GetName], muchas naciones todavía sufren bajo los déspotas de antaño. Los trabajadores de [Root.GetName] no tienen voz ni medios para organizarse, y cualquier intento de instaurar el socialismo será aplastado salvajemente por el régimen de [Root.GetLeader]. No podemos esperar a que los engranajes de la revolución internacional giren para el pueblo de [Root.GetAdjective]. ¡Hemos demostrado que podíamos aplastar a los opresores capitalistas aquí, y aplastaremos a los opresores en [Root.Capital.GetName] también!».\n\n[FROM.GetLeader] ha abandonado todo intento de diplomacia con nuestro gobierno. El cometido comunista de erradicar todas las fronteras se centra ahora estrictamente en erradicar nuestras fronteras."
 war_justification.205.a: "[Root.GetLeader] es un mejor gobernante que cualquier oportunista revolucionario."
 war_justification.206.t: "[FROM.GetLeader] pide ayuda para los trabajadores de [Root.GetAdjective]"
 war_justification.206.d: "«¿Existe mayor mentira que la supuesta libertad del pueblo de [Root.GetAdjective]? Donde antes eran esclavos de los príncipes y duques que reclamaban la propiedad del suelo, ahora se ven obligados a vender su mano de obra a quienes reclaman la propiedad de las fábricas. Su libertad para elegir a un amo sobre otro difícilmente puede llamarse libertad. Asimismo, su libertad para elegir a sus líderes es una opción falsa, ya que la propaganda nunca permitiría que los verdaderos socialistas asumieran el poder. Un pueblo tan profundamente adoctrinado solo puede ser salvado mediante una intervención de [FROM.GetAdjective]».\n\nIndispuesto a aceptar que nuestro pueblo pueda estar satisfecho sin sus experimentos sociales, el régimen comunista de [FROM.GetName] ha amenazado abiertamente con atacar a nuestra nación. Hay pocos motivos para creer que este conflicto pueda resolverse pacíficamente."
 war_justification.206.a: "¿Qué méritos pueden tener sus convicciones si deben imponerlas por la fuerza sobre nosotros?"
 war_justification.207.t: "El comunismo [Root.GetAdjective] está fallando"
 war_justification.207.d: "«Camaradas, aunque a los más grandes revolucionarios se les llamó una vez traidores, ha quedado claro que la revolución misma ha sido traicionada. ¿De qué otra forma se explicaría el mandato del [Root.GetRulingParty] de [Root.GetName], que ha dejado de lado cualquier atisbo de las ideas marxistas para construir un Estado de trabajadores degenerado donde pueden reinar bajo premisas falsas? Al fortalecer su propio poder a precio de la revolución internacional, han demostrado que les importan poco los ideales que dicen defender. Debemos llevarles la verdadera revolución».\n\nAunque inicialmente apoyaba la victoria de [Root.GetRulingParty] en [Root.Capital.GetName], [FROM.GetLeader] se ha distanciado de la filosofía de [Root.GetLeader]. El conflicto ha escalado hasta el punto de que se preparan para invadirnos con el fin de imponernos su propia variante del socialismo."
 war_justification.207.a: "No comprenden lo que la revolución significa para el pueblo [Root.GetAdjective]."
 war_justification.208.t: "[FROM.GetLeader] insta a aplastar el nacionalismo de [Root.GetAdjective]"
 war_justification.208.d: "«¿Existe alguna sociedad más repugnante para el futuro de la revolución, alguna más ajena a la difícil situación del trabajador, que el régimen fascista de [Root.GetName]? Al instar a la población a entregarse fanáticamente a la decrépita institución del Estado-nación, han disfrazado con ropajes modernos los viejos métodos de la salvajería, intentando presentarse como una alternativa de futuro ante la inevitable victoria internacional de la clase obrera. Es solo cuestión de tiempo que ataquen a nuestra nación o a nuestros aliados. Ataquemos primero».\n\nNadie esperaba menos que un desprecio mutuo entre nuestro bando y el de [Root.GetAdjective], pero la animosidad se ha intensificado últimamente. Al escuchar hablar a [FROM.GetLeader], parece que el conflicto surgirá más temprano que tarde."
 war_justification.208.a: "¡Muerte a los comunistas!"
 war_justification.209.t: "La diplomacia con [Root.GetName] se rompe."
 war_justification.209.d: "«A pesar de nuestros intentos por encontrar una solución diplomática a nuestro conflicto con [Root.GetName], las編 negociaciones han vuelto a fracasar, dejándonos con opciones limitadas. El régimen autoritario de [Root.GetLeader] ha mostrado el enfoque irracional sobre este asunto típico de los líderes que no rinden cuentas ante su pueblo. A menos que se produzca un giro completo en las políticas del liderazgo de [Root.GetAdjective], no nos quedará más remedio que luchar».\n\nLa intervención de [FROM.GetAdjective] en nuestros asuntos internos ha sido un tema candente, y algunos políticos de su oposición afirman que [FROM.GetRulingParty] has seguido una política belicista desde el principio. Sea cual sea su intención original, una guerra futura parece ahora, de repente, muy real e inevitable."
 war_justification.209.a: "Su retórica condescendiente no nos intimidará."
 war_justification.210.t: "[FROM.GetLeader] pide la intervención en [Root.GetName]"
 war_justification.210.d: "«Con gran pesar debemos afrontar la reality de nuestra situación: una invasión de [Root.GetName] puede ser nuestro único recurso. Representa una ventaja estratégica demasiado grande como para intentar cualquier otra solución en nuestra situación actual. Aunque confiamos en que ni el pueblo de [FROM.GetAdjective] ni el de [Root.GetAdjective] desean la guerra, la historia nos ha llevado a este punto y nuestras opciones son limitadas. Solo podemos esperar que, mediante esta afirmación de nuestro poder militar, podamos evitar un mayor derramamiento de sangre en el futuro».\n\nAunque existe la teoría popular de que las democracias no van a la guerra contra otras democracias, los acontecimientos recientes apuntan a una futura invasión de [FROM.GetAdjective] sobre [Root.GetName]. Puede que la historia todavía nos sorprenda."
 war_justification.210.a: "De todos modos, [FROM.GetName] es una democracia dudosa al emprender una acción tan agresiva."
 war_justification.211.t: "[FROM.GetLeader] habla en contra del peligro rojo"
 war_justification.211.d: "«Sin duda, el comunismo de [Root.GetAdjective] es una de las mayores amenazas para la libertad y el orden en esta era. Implacable y despiadado, amenaza con devorar no solo la esperanza del pueblo de [Root.GetAdjective] de tener una sociedad próspera y prestigiosa, sino también la de sus vecinos. Si no actuamos ahora, bien podríamos ver caer este primer dominó demasiado tarde, dejando a su paso más experimentos sociales fallidos. ¿Cuántos más tienen que morir antes de que intervengamos?».\n\nEl naciente movimiento obrero ha intimidado a los líderes de [FROM.GetAdjective]. Mientras que los representantes de su oposición han calificado esto como un «Peligro Rojo» destinado a buscar la guerra con nosotros, la retórica de [FROM.GetRulingParty] ha tenido un gran éxito hasta ahora."
 war_justification.211.a: "Mientras haya ganancias que obtener, los capitalistas fabricarán una guerra."
 war_justification.212.t: "[FROM.GetLeader] se enfrenta al fascismo de [Root.GetAdjective]"
 war_justification.212.d: "«En la historia moderna, tal vez incluso en la historia en su conjunto, no ha habido peor tiranía que el puño de hierro con el que [Root.GetRulingParty] atenaza ahora a [Root.GetName]. Se podrá argumentar que no deberíamos provocar un conflicto, que deberíamos confiar en que [Root.GetLeader] cumplirá los tratados y las promesas en el futuro, pero esas personas no ven que los tratados firmados bajo el mandato del fascismo no sirven para nada. Para estos mentirosos deshonrosos, la fuerza da la razón, y el papel en el que está escrito un acuerdo arde con la misma facilidad que los libros de sus detractors».\n\nCelosos de la gloriosa sociedad que estamos construyendo y del legado sobre el que se fundó, los de [FROM.GetAdjective] parecen dispuestos a iniciar una guerra para destruirla. Tanto para sus pretensiones de paz."
 war_justification.212.a: "Inevitable. Es mejor acabar con esto de una vez."
 war_justification.213.t: "[FROM.GetLeader] hace un llamamiento a la guerra contra [Root.GetName]"
 war_justification.213.d: "'Aunque seamos un pueblo pacífico, nuestra naturaleza por sí sola no determina el rumbo que debemos tomar en la historia. Esta es una época de guerra. Durante demasiado tiempo, los [Root.GetAdjective] han poseído los medios que necesitamos para superar las pruebas que podamos enfrentar, y es evidente que no se desprenderán de ellos pacíficamente. A pesar de nuestros mejores esfuerzos por construir un estado moderno, algunos asuntos solo pueden resolverse mediante las antiguas pruebas de la batalla.'\n\nEn un discurso reciente al pueblo [FROM.GetAdjective], la retórica hostil hacia [Root.GetName] se ha intensificado y [FROM.GetLeader] ha hecho todo lo posible para justificar una invasión. Una parte de la población apoya este curso de acción, pero la decisión está en las tierras de su líder."
 war_justification.213.a: "Se arrepentirán de hacernos su enemigo."
 war_justification.214.t: "[FROM.GetLeader] desafía las pretensiones de [Root.GetAdjective]"
 war_justification.214.d: "«En [Root.GetName] podrán considerarse más modernos y avanzados que nosotros, pero la verdad es que su nación no ha sido puesta a prueba como la nuestra, ni están preparados para las amenazas que ya se ven claramente en el horizonte. Con su desprecio hacia nosotros, y al impedirnos apoderarnos de lo que por derecho nos pertenece, nos han convertido en una de esas amenazas para ellos mismos. Su nación, débil y dividida, difícilmente resistirá nuestras reclamaciones».\n\nLa opinión despectiva sobre [Root.GetName] que desde hace tiempo mantiene [FROM.GetRulingParty] ha pasado de la crítica a la hostilidad. Aunque la opinión generalizada es que el pueblo de [Root.GetAdjective] desea evitar la guerra, [FROM.GetLeader] afirma que nuestros líderes electos la han provocado con su arrogancia."
 war_justification.214.a: "Por supuesto, las voces a favor de la paz entre el pueblo de [FROM.GetAdjective] han sido silenciadas."
 war_justification.215.t: "[FROM.GetLeader] desea restaurar el orden en [Root.GetName]"
 war_justification.215.d: "«El espíritu nacional de [FROM.GetAdjective] es fuerte, pero no todas las naciones tienen tanta fortuna. A [Root.GetName] le han destruido sus tradiciones y sus gobernantes legítimos han sido asesinados y enterrados hace tiempo, todo en nombre de la idea de la gran revolución marxista. Es nuestro de deber restaurar el orden en este mundo descarriado por usurpadores sanguinarios y afirmar la fuerza de [FROM.GetName] contra esta amenaza».\n\nAunque [FROM.GetRulingParty] siempre se ha opuesto al comunismo, [Root.GetName] ha sido blanco de ataques particulares en los discursos recientes. Temiendo el progreso inevitable de su nación hacia la siguiente etapa de la historia, ya se está fraguando un ataque preventivo contra el comunismo de [Root.GetAdjective]."
 war_justification.215.a: "Es demasiado tarde para revertir el progreso que hemos logrado."
 war_justification.216.t: "[FROM.GetLeader] acusa a los opresores de [Root.GetAdjective]"
 war_justification.216.d: "«Mis opositores querrían haceros creer que mi mandato es como el de [Root.GetRulingParty] en [Root.GetName]. No podrían estar más equivocados. Mientras que los éxitos de [Root.GetLeader] son el resultado de una moda reciente, un movimiento de masas destructivo empeñado en intimidar a otras naciones para que se sometan, [FROM.GetRulingParty] se opone a ese movimiento como los únicos que no se someterán. Estoy preparado para hacer lo que sea necesario para eliminar esta amenaza, incluso si eso significa la guerra».\n\nEl régimen de [FROM.GetLeader] ha adoptado una política hostil hacia la nación de [Root.GetAdjective]. Nuestros planes visionarios de grandeza futura han avergonzado a su nación y, como era de esperar, se sienten amenazados."
 war_justification.216.a: "La guerra no es la solución. Deberíamos buscar la paz y la cooperación."
 war_justification.217.t: "[FROM.GetLeader] cuestiona la soberanía de [Root.GetAdjective]"
 war_justification.217.d: "«¿Quién determina las fronteras de una nación y cómo se determinan? Sea cual sea la forma que la gente haya encontrado en el pasado para justificar dónde termina [FROM.GetName] y dónde empieza [Root.GetName], vivimos en una nueva era. La importancia estratégica de esta frontera no puede exagerarse, y estamos plenamente en nuestro derecho de cambiarla para garantizar la seguridad continua de nuestro pueblo».\n\nAl escuchar los discursos recientes de [FROM.GetLeader], una invasión de [Root.GetName] parece inminente. Las voces disidentes se han opuesto, pero el apoyo público a la guerra va en aumento."
 war_justification.217.a: "¿No ha aprendido nada el mundo de la Gran Guerra?"
 war_justification.218.t: "[FROM.GetLeader] cuestiona los motivos de [Root.GetName]"
 war_justification.218.d: "«No cabe duda de que [Root.GetName] se está preparando para la guerra. Los cambios en la política económica dejan claro que los de [Root.GetAdjective] no son un pueblo de paz, sino que esperan la oportunidad adecuada para atacarnos. ¿Nos quedaremos de brazos cruzados viendo cómo se arman mientras [FROM.GetName] está indefenso? ¿O desarmaremos esta amenaza antes de que crezca más allá de nuestro poder?».\n\nLos halcones de [FROM.GetRulingParty] han puesto sus ojos en [Root.GetName], argumentando que el ataque es la mejor defense. Su punto de vista está ganando fuerza y [FROM.GetName] se prepara para la guerra."
 war_justification.218.a: "Es exactamente por esto que necesitamos estar preparados."
 war_justification.219.t: "[FROM.GetLeader] se muestra indignado por la actitud de [Root.GetAdjective]"
 war_justification.219.d: "«Esos ciudadanos ingenuos de [FROM.GetName] que se imaginan a los de [Root.GetAdjective] como un pueblo de paz están completamente desconectados de la realidad. Quienes viven en nuestra frontera no tienen el lujo de tales delirios, al ver a sus tropas acercándose a nosotros justo al otro lado. Esta es una amenaza que no podemos dejar sin respuesta. Con cada día que pasa, [Root.GetName] se prepara para la guerra. Sería una locura que nosotros no hiciéramos lo mismo».\n\nNuestra presencia militar cerca del territorio de [FROM.GetAdjective] ha despertado una creciente preocupación, ya que ellos interpretan nuestros movimientos de tropas como una prueba de intenciones hostiles. Difícilmente parecen haber considerado que su propia retórica agresiva es el motivo de nuestras medidas defensivas."
 war_justification.219.a: "Apenas podemos desarmarnos después de estas amenazas."
 war_justification.220.t: "[FROM.GetLeader] defiende la invasión de [Root.GetName]"
 war_justification.220.d: "«Si queremos tener la ventaja estratégica en la previsible, por no decir inevitable guerra con [Root.GetName], no hay margen para dudar. Se trata de salvaguardar el futuro de nuestros hijos y asegurar que [FROM.GetName] tenga un lugar en el mundo del mañana. Es una cuestión de devoción a nuestra causa y a los ideales que damos por sentados. Es hora de actuar».\n\nUna serie de discursos entusiastas de los líderes de [FROM.GetRulingParty], principalmente de [FROM.GetLeader], ha estado llamando a la población a apoyar una invasión de [Root.GetName]. Los motivos geopolíticos detrás de la invasión son menos prominentes en la retórica que los sentimientos patrióticos, pero esta campaña parece muy eficiente para convencer a la opinión pública de su necesidad."
 war_justification.220.a: "Mejor nos preparamos. La guerra llegará."
 war_justification.301.t: "[Root.GetLeader] Criticado por una Débil Política Exterior"
 war_justification.301.d: "\"Tuvimos la oportunidad de atacar a nuestros enemigos, pero el [Root.GetRulingParty] la dejó pasar. No sólo es otro caso condenatorio más en una serie de oportunidades perdidas para fortalecer la posición de [Root.GetName] a nivel internacional, sino que es una señal de que su afirmación de que están actuando en interés del pueblo de [Root.GetAdjective] es en su mayor parte retórica vacía. Es hora de un cambio de política\".\n\nNuestro fracaso a la hora de continuar con la guerra que muchos esperaban ha sido objeto de duras críticas por parte de nuestros oponentes políticos. No seguir adelante con nuestros planes militares hará que nos resulte más difícil convencer a la gente de la dirección en la que estamos llevando a [Root.GetName]."
 war_justification.301.a: "¿Acaso no quieren evitar la guerra?"
 war_justification.301.b: "No hay lugar para desacuerdos públicos fuera de las reuniones del partido."
 war_justification.301.c: "¡No podemos permitir que acusen a [Root.GetLeader] de cobardía!"
 nuke_dropped.1.t: "Bombardeo atómico de [FROM.FROM.GetName]"
 nuke_dropped.1.d: "Por primera y esperemos que última vez en la historia, una bomba nuclear ha sido detonada en [FROM.FROM.GetName] como parte de una guerra internacional. La destrucción sin precedentes se erige como un testimonio del poder devastador de esta nueva arma, temida no solo por lo que puede hacer a sus objetivos, sino por las implicaciones que tiene para quien la despliega y para la humanidad misma.\n\nEl mundo contiene el aliento esperando lo que vendrá después. ¿Obligará esto a [FROM.FROM.Owner.GetName] a rendirse para evitar un mayor terror, o solo fortalecerá su determinación de contraatacar a quienes recurren a tales medidas?"
 nuke_dropped.1.a: "La Era Atómica ha comenzado realmente."
 nuke_dropped.1.b: "Haremos todo lo que sea necesario para proteger a la gente [Root.GetAdjective]."
 nuke_dropped.2.t: "Bombardeo Atómico de Hiroshima"
 nuke_dropped.2.d: "\"Las calles parecían un escenario del infierno.\"\n - Kuniyoshi Aikawa\n\nHoy, una bomba nuclear fue detonada sobre la ciudad de Hiroshima a una altura de 580 metros. Más de dos tercios de la ciudad fueron destruidos instantáneamente. A pesar de que la ciudad estaba construida para resistir terremotos, solo unos pocos edificios robustos sobrevivieron a la explosión.\n\nSi bien el poder de la bomba atómica se ha magnificado en la mente pública, el costo humano de esta arma se ha minimizado. Ninguna de las partes quiere contemplar el horror del evento, pero su legado será el de vidas perdidas en un abrir y cerrar de ojos y secuelas duraderas."
 nuke_dropped.2.a: "¿Cuántos más caerán antes de que esta guerra termine?"
 nuke_dropped.2.b: "Debemos actuar rápidamente para ayudar a las víctimas."
 nuke_dropped.3.t: "Bombardeo Atómico de Nagasaki"
 nuke_dropped.3.d: "Una bomba nuclear, destinada originalmente a Kokura, ha sido detonada hoy sobre Nagasaki. Las condiciones meteorológicas obligaron a los aviones a desviar su misión; una combinación de humo, nubes y dificultades técnicas fueron los factores decisivos en un acontecimiento que bien podría cambiar la historia.\n\nLos efectos de la bomba se vieron contenidos en parte por la ubicación de la ciudad en un valle, pero los daños siguen siendo graves. Algunas instalaciones militares resultaron alcanzadas, pero las catastróficas pérdidas civiles las eclipsan con creces. Es posible que pasen décadas antes de que conozcamos con certeza los efectos a largo plazo de esta arma."
 nuke_dropped.3.a: "¿Llevará esto a la rendición de [FROM.Owner.GetAdjective]?"
 nuke_dropped.3.b: "Habíamos esperado que Nagasaki fuera salvada."
 nuke_dropped.4.t: "Bombardeo Atómico de Berlín"
 nuke_dropped.4.d: "Hoy, a fecha de [GetDateText], la capital alemana de Berlín ha sido alcanzada por una explosión nuclear. La ciudad ha sufrido varios ataques, en esta guerra y en la anterior, pero todo lo demás palidece en comparación con esto. Desde la guerra de los Treinta Años, Berlín no había visto una devastación comparable; considerando su crecimiento, esto se consideraba una imposibilidad.\n\nEl Führerbunker parece haber sobrevivido a la explosión, al menos parcialmente debido a que la bomba detonó lejos de su epicentro previsto, y hay rumores de que [FROM.Owner.GetLeader] sigue vivo, aunque indignado. Sin embargo, la forma en que los líderes de [FROM.Owner.GetAdjective] deban ser evacuados y si se les puede proteger de la lluvia radiactiva es otro asunto."
 nuke_dropped.4.a: "Hoy, estoy aliviado de no ser berlinés."
 nuke_dropped.4.b: "¡Nuestros enemigos han golpeado el corazón de la nación!"
 nuke_dropped.5.t: "Bombardeo atómico de Londres"
 nuke_dropped.5.d: "Una explosión nuclear ha devastado la ciudad de Londres hoy. A pesar de las defensas antiaéreas de la ciudad, [FROM.Owner.GetName] no estaba preparada para este ataque. A fecha de [GetDateText], el Big Ben sonó por última vez tras haber sido derretido por la explosión. Los primeros informes sugieren que el Palacio de Buckingham ha sido completamente arrasado y actualmente se desconoce el paradero de la familia real.\n\nSin embargo, se ha confirmado que [FROM.Owner.GetLeader] ha sobrevivido y está preparando un entusiasta discurso para la radio más tarde hoy. Con la moral en su punto más bajo, el pueblo británico tiene una necesidad imperiosa de esto... o de una rendición muy elocuente."
 nuke_dropped.5.a: "Es difícil mantener el aplomo en medio de una onda expansiva nuclear."
 nuke_dropped.5.b: "¡Dios salve al Rey!"
 nuke_dropped.6.t: "Bombardeo atómico de Kyoto"
 nuke_dropped.6.d: "La ciudad de Kioto, un destacado centro industrial de [FROM.Owner.GetAdjective], ha sido alcanzada hoy por una bomba nuclear. Se especula que la ciudad fue elegida como objetivo porque era considerada un centro intelectual.\n\nLa belleza y la importancia histórica de Kioto llevaron a muchos a asumir que se libraría de la bomba, pero parece que el terror de hacer llover la destrucción sobre un lugar así ha sido visto más bien como una ventaja, aumentando el impacto psicológico del ataque. La ubicación de la ciudad en el valle limitó en parte la explosión, pero el antiguo Palacio Imperial y muchos edificios industriales han quedado completamente destruidos."
 nuke_dropped.6.a: "El legado y la belleza no significan nada en una guerra como esta."
 nuke_dropped.6.b: "Si destruyen lo antiguo, construiremos lo nuevo."
 nuke_dropped.7.t: "Bombardeo atómico de Tokio"
 nuke_dropped.7.d: "Hoy, un ataque nuclear ha sido dirigido al corazón del Imperio japonés. Nunca se asumió que la capital de Tokio, aunque se esperaba que fuera objetivo de bombardeos incendiarios, fuera un objetivo prioritario para esta nueva arma. Sin embargo, en última instancia, tal vez debido a la importancia de la nueva capital y del Palacio Imperial que ahora ha sido destruido, un fuego aún más devastador ha caído sobre la ciudad.\n\nAunque se informa que [FROM.Owner.GetLeader] ha sobrevivido, el acontecimiento ha planteado dudas sobre hasta dónde están dispuestos a llegar los enemigos de Japón. Si la guerra no termina con esto, ¿qué objetivos quedan? ¿Con qué queda amenazar?"
 nuke_dropped.7.a: "¿Significa esto el fin del Imperio Japonés?"
 nuke_dropped.7.b: "Mientras viva [FROM.Owner.GetLeader], también lo hará el Imperio."
 nuke_dropped.8.t: "Bombardeo atómico de Washington D.C."
 nuke_dropped.8.d: "Una bomba nuclear ha sido detonada hoy sobre la capital de los Estados Unidos. En un ataque claramente dirigido al centro político y al legado histórico de los EE. UU., la Casa Blanca, el Capitolio y una serie de monumentos y memoriales han sido borrados de la faz de la Tierra. Incluso el incendio de Washington hace más de un siglo palidece en comparación con la destrucción sufrida por la ciudad a causa de esta arma devastadora.\n\nAunque el presidente [FROM.Owner.GetLeader] ha sido puesto a salvo, la nación se ha visto sacudida hasta sus cimientos. Sin duda, los EE. UU. esperaban ser el primer y único país en empuñar semejante arma. Esas esperanzas se han hecho añicos ahora de la peor manera posible."
 nuke_dropped.8.a: "Una nación indivisible versus un átomo divisible."
 nuke_dropped.8.b: "El águila renacerá de las cenizas como un fénix."
 nuke_dropped.9.t: "Bombardeo atómico de Roma"
 nuke_dropped.9.d: "Una explosión nuclear golpeó hoy la ciudad de Roma, conmocionando a personas de todo el mundo. Debido a sus tesoros históricos y artísticos, muchos nunca pensaron que la antigua ciudad sería el objetivo de una destrucción indiscriminada. Con la Ciudad del Vaticano también parcialmente destruida y el paradero del Papa desconocido, el evento ha horrorizado no solo a los italianos, sino también a los católicos de todo el mundo.\n\nEl crecimiento rápido de Roma en la última década ha sido prácticamente deshecho por el ataque. Durante un tiempo, parecía que la ciudad podría ayudar en la recuperación de la nación una vez que la guerra terminara. Esas esperanzas se han convertido ahora en polvo, junto con muchas personas."
 nuke_dropped.9.a: "¡Bomba Iacta Est!"
 nuke_dropped.9.b: "Roma no será reconstruida en un solo día..."
 nuke_dropped.10.t: "Bombardeo atómico de París"
 nuke_dropped.10.d: "Hoy, se detonó un dispositivo nuclear sobre la ciudad de París, causando una destrucción generalizada y innumerables víctimas. Francia estaba en estado de shock mientras su capital sufría lo que podría ser el ataque más devastador que haya experimentado, a pesar de siglos de guerras y revoluciones. Los parisinos tal vez esperaban una conquista, pero no una desolación absoluta y brutal.\n\nCualquier desfile de victoria en los Campos Elíseos, pasando por los restos del Arco de Triunfo, parece improbable en el estado actual de la ciudad. Tal vez las décadas venideras presencien el nacimiento de un nuevo París, pero el París en la mente del público, la ciudad construida en la Belle Époque, se ha ido para siempre."
 nuke_dropped.10.a: "La ciudad de la luz se ha apagado."
 nuke_dropped.10.b: "Solo ayer, parecía que siempre tendríamos París."
 nuke_dropped.11.t: "Bombardeo atómico de Moscú"
 nuke_dropped.11.d: "Moscú, una ciudad que muchos han intentado conquistar sin éxito, ha sido hoy el objetivo de un ataque nuclear. La explosión se dirigió al corazón del liderazgo de [FROM.Owner.GetAdjective], habiendo quedado el Kremlin casi completamente destruido por la detonación.\n\n[FROM.Owner.GetLeader], al haberse vuelto más consciente y temeroso de todas las amenazas posibles e imposibles recientemente, evacuó a tiempo y sobrevivió. Sin embargo, incluso la inmensidad de [FROM.Owner.GetName] puede no ser suficiente para escapar de un enemigo tan despiadado. De hecho, si esto continúa, la nación pronto constará solo de dos tipos de páramos: los que ya estaban allí en primer lugar y los creados por sus enemigos."
 nuke_dropped.11.a: "¿No convertirá un invierno nuclear a Moscú en un objetivo más difícil?"
 nuke_dropped.11.b: "Pueden quemar todas las ciudades que tengamos, pero nunca las tomarán."
 nuke_dropped.12.t: "Bombardeo atómico de Copenhague"
 nuke_dropped.12.d: "Hoy, la ciudad de Copenhague fue golpeada por una explosión nuclear. Después de haberse salvado de la destrucción en la Gran Guerra gracias a la neutralidad de Dinamarca, la capital nunca había experimentado un ataque tan devastador desde las Guerras Napoleónicas. El área circundante de Öresund también ha sufrido una contaminación significativa y los supervivientes han comenzado a escapar a Fyn y al continente por temor a más ataques.\n\nLa ubicación del rey Christian X es actualmente desconocida y el ánimo de la nación ha sido severamente dañado por el ataque. Queda por ver si este es el comienzo del fin para una de las naciones más antiguas de Europa."
 nuke_dropped.12.a: "Algo está irradiado en el estado de Dinamarca."
 nuke_dropped.12.b: "La ciudad ha ardido antes, pero no ha perecido."
 nuke_dropped.12.c: "¡Con plutonio llevamos a los daneses a sus rodillas!"
 nuke_dropped.13.t: "Bombardeo atómico de Estocolmo"
 nuke_dropped.13.d: "La hermosa ciudad de Estocolmo, orgulloso Venecia del Norte, fue golpeada por una bomba nuclear hoy. A pesar de sus mejores esfuerzos por mantenerse neutral en el pasado, los suecos ahora han pagado el precio más alto por el conflicto internacional. El epicentro de la explosión se encontraba en el centro sur de Estocolmo, un área destinada a futuros proyectos de desarrollo y construcción grandiosos, ahora irreversiblemente destruida.\n\nGran parte de la ciudad es irreconocible, pero las estructuras antiguas en Slussen parecen haber resistido mejor de lo esperado. Se ha decidido que deben permanecer intactas para siempre como un monumento a la resistencia de la ciudad."
 nuke_dropped.13.a: "Con esto, la neutralidad sueca será solo un recuerdo."
 nuke_dropped.13.b: "¡El tigre sueco no perderá sus rayas!"
 country_capitulated.0.t: "[Root.GetName] ha capitulado"
 country_capitulated.0.d_positive_both_no_faction: "\n[FROM.FROM.GetLeader] ha anunciado que la cobarde nación de [Root.GetAdjective] ya no podía soportar la presión de la abrumadora presencia de las fuerzas de [FROM.FROM.GetAdjective] en todo el país. El gobierno de [Root.GetAdjective] optó por huir del país y ha marchado al exilio. Sus fuerzas principales han capitulado y [FROM.FROM.GetName] controla ahora su territorio nacional.\nAunque la guerra continúa en otros lugares, esta es una gran victoria para [FROM.FROM.GetName]."
 country_capitulated.0.d_positive_prev_no_faction: "\n[FROM.FROM.GetLeader] ha anunciado que la cobarde nación de [Root.GetAdjective] ya no podía soportar la presión de la abrumadora presencia de las fuerzas de [FROM.FROM.GetAdjective] en todo el país. El gobierno de [Root.GetAdjective] optó por huir del país y ha marchado al exilio. Sus fuerzas principales han capitulado y [FROM.FROM.GetName] controla ahora su territorio nacional.\nAunque la guerra contra lo que queda de la facción [Root.GetFactionName] continúa en otros lugares, esta es una gran victoria para [FROM.FROM.GetName]."
 country_capitulated.0.d_positive_prev_faction: "\n[FROM.FROM.GetLeader] ha anunciado que la cobarde nación de [Root.GetAdjective] ya no podía soportar la presión de la abrumadora presencia de las fuerzas de [FROM.FROM.GetAdjective] en todo el país. El gobierno de [Root.GetAdjective] optó por huir del país y ha marchado al exilio. Sus fuerzas principales han capitulado y [FROM.FROM.GetName] controla ahora su territorio nacional.\nAunque la guerra contra lo que queda de la facción [Root.GetFactionName] continúa en otros lugares, esta es una gran victoria para toda la facción [FROM.FROM.GetFactionName]."
 country_capitulated.0.d_negative_both_no_faction: "\n[Root.GetLeader] ha anunciado que la nación [Root.GetAdjective] ya no puede soportar la presión de las fuerzas de ocupación [FROM.FROM.GetAdjective], que están cometiendo actos vergonzosos en todo el país. El gobierno de [Root.GetAdjective] se ha exiliado. Sus principales fuerzas han capitulado y [FROM.FROM.GetName] ahora tiene el control de su zona de origen.\nA pesar de esta devastadora pérdida, la guerra contra [FROM.FROM.GetName] está lejos de terminar."
 country_capitulated.0.d_negative_prev_no_faction: "\n[Root.GetLeader] ha anunciado que la nación de [Root.GetAdjective] ya no puede soportar la presión de las fuerzas de ocupación de [FROM.FROM.GetAdjective], que están cometiendo atrocidades por todo el país. El gobierno de [Root.GetAdjective] ha marchado al exilio. Sus fuerzas principales han capitulado y [FROM.FROM.GetName] controla ahora su territorio nacional.\nAunque la guerra contra [FROM.FROM.GetName] continúa, este es un desafortunado revés para todos los miembros de la facción [Root.GetFactionName]."
 country_capitulated.0.d_negative_prev_faction: "\n[Root.GetLeader] ha anunciado que la nación de [Root.GetAdjective] ya no puede soportar la presión de las fuerzas de ocupación de [FROM.FROM.GetAdjective], que están cometiendo atrocidades por todo el país. El gobierno de [Root.GetAdjective] ha marchado al exilio. Sus fuerzas principales han capitulado y [FROM.FROM.GetName] controla ahora su territorio nacional.\nAunque la guerra contra [FROM.FROM.GetName] y el resto de la facción [FROM.FROM.GetFactionName] continúa, este es un desafortunado revés para todos los miembros de la facción [Root.GetFactionName]."
 country_capitulated.0.d_neutral_both_no_faction: "\nEl gobierno de [Root.GetAdjective] ha marchado al exilio y sus fuerzas principales han capitulado ante [FROM.FROM.GetName], que ahora controla su territorio nacional.\n\nAunque las disputas entre [FROM.FROM.GetName] y [Root.GetName] han terminado, [FROM.FROM.GetName] sigue en guerra total y los combates continúan en otros lugares."
 country_capitulated.0.d_neutral_prev_no_faction: "\nEl gobierno de [Root.GetAdjective] ha marchado al exilio y sus fuerzas principales han capitulado ante [FROM.FROM.GetName], que ahora controla su territorio nacional.\n\nLas disputas en [Root.GetName] fueron solo una pequeña parte del conflicto. La guerra entre [FROM.FROM.GetName] y lo que queda de la facción [Root.GetFactionName] continúa en otros lugares."
 country_capitulated.0.d_neutral_prev_faction: "\nEl gobierno de [Root.GetAdjective] ha marchado al exilio y sus fuerzas principales han capitulado ante [FROM.FROM.GetName], que ahora controla su territorio nacional.\n\nLas disputas entre [FROM.FROM.GetName] y [Root.GetName] fueron solo una pequeña parte del conflicto. La guerra entre la facción [FROM.FROM.GetFactionName] y lo que queda de la facción [Root.GetFactionName] continúa en otros lugares."
 country_capitulated.0.a: "¡Grandes noticias!"
 country_capitulated.0.b: "Estos son tiempos oscuros."
 country_capitulated.0.c: "Tiempos inciertos."
 GAME_OVER_TT: "§REl juego terminará para ti.§!"
 CAN_ANGERED_WORKERS: "Esto molestará a la población."
 excellent: "Excelente."
 unfortunate: "Lamentable"
 news.2.t: "El Tratado de Cooperación Militar [mct_inviter.GetNameDef]-[mct_applicant.GetName]"
 news.2.d: "Hoy, [mct_inviter.GetNameDef] y [mct_applicant.GetNameDef] han firmado un tratado de cooperación militar, fortaleciendo sus lazos en materia de defensa."
 news.2.a: "De acuerdo"
 influence.1.t: "¿Ofrecer ayuda económica a [FROM.GetName]?"
 influence.1.d: "Hemos decidido comenzar a elaborar un paquete de ayuda económica. Podemos decidir enviar el 5%, el 10% o el 15% del PIB de nuestra nación como ayuda. Esta generosidad mejorará las relaciones y nos otorgará influencia en [FROM.GetName], aunque no hay garantía de que utilicen la ayuda económica en algo de valor. Cuanto más damos, más influencia ganaremos.\n\n"
 influence.1.a: "Enviar el 5% del PIB como ayuda económica."
 influence.1.b: "Enviar el 10% del PIB como ayuda económica."
 News_influence.0.t: "¡Ayuda económica otorgada por [FROM.GetName]!"
 News_influence.0.d: "[FROM.GetName] nos ha otorgado [?gift_sum] mil millones de dólares en ayuda económica inmediata. Esto ha fortalecido las relaciones entre [Root.GetAdjective] y [FROM.GetAdjective], y aunque la donación llegó oficialmente sin condiciones previas, se sobreentiende que ha aumentado su influencia en nuestro país."
 News_influence.0.a: "¡Maravilloso!"
 News_influence.0.b: "Rechazar la ayuda."
 influence.3.t: "¿Apuntar a otro influyente en [FROM.GetName]?"
 influence.3.d: "¿A cuál de las potencias influyentes de [FROM.GetNameWithFlag] deberíamos apuntar, o deberíamos centrarnos en su independencia nacional?\n"
 influence.3.a: "Apuntar a la independencia doméstica de [FROM.GetNameWithFlag]."
 influence.3.b: "Apuntar a [?var:FROM.influence_array^0.GetNameWithFlag]."
 influence.3.c: "Apuntar a [?var:FROM.influence_array^1.GetNameWithFlag]."
 influence.3.e: "Apuntar a [?var:FROM.influence_array^2.GetNameWithFlag]."
 influence.3.f: "Retirarse."
 News_influence.1.t: "¡[FROM.GetNameWithFlag] ataca nuestra influencia en [FROM.FROM.GetNameWithFlag]!"
 News_influence.1.d: "Lamentablemente, la [FROM.GetName] de [FROM.GetLeader] ha asestado un rápido golpe a nuestras ambiciones en [FROM.FROM.GetName]. Al señalarnos directamente, su ataque a nuestros intereses comerciales y gubernamentales ha reducido nuestra influencia en [FROM.FROM.GetNameWithFlag]."
 News_influence.1.a: "¡Maldito seas, [FROM.GetLeader]!"
 News_influence.2.t: "¡[FROM.GetNameWithFlag] ataca nuestra independencia frente a la influencia extranjera!"
 News_influence.2.d: "Lamentablemente, la [FROM.GetName] de [FROM.GetLeader] ha asestado un rápido golpe a nuestras aspiraciones de mantenernos al margen de las injerencias extranjeras y ha debilitado nuestra soberanía. Nuestra independencia frente a la influencia externa se ha visto reducida."
 News_influence.2.a: "¡Eso no está bien, [FROM.GetLeader]!"
 influence.5.t: "¿Lanzar un golpe de Estado en [FROM.GetNameWithFlag]?"
 influence.5.d: "Estimado [Root.GetLeader], desde los Servicios de Inteligencia de [Root.GetAdjective] no podemos confirmar ni desmentir si la situación en [FROM.GetName] propicia un golpe de Estado.\n\nSin embargo, hemos trazado, con la mayor precisión posible, las probabilidades de los distintos resultados. Estas se basan en:\n - La magnitud de nuestra influencia.\n - El nivel de popularidad de nuestra postura ideológica.\n - La popularidad y estabilidad del gobierno actual.\n - Qué otros países influyentes es probable que nos respalden.\n - Qué países influyentes es probable que respalden a su gobierno actual.\n\nSi procedemos con los planes, intentaremos recurrir principalmente a fuentes y contactos locales para tratar de mantener una denegación plausible."
 influence.5.a: "Lanzar un golpe de Estado para poner en el poder al partido más grande en nuestra perspectiva."
 influence_coup_largest_success_TT: "§HExito del golpe de Estado§!"
 influence_coup_largest_discovered_TT: "§RGolpe de Estado fallido§!"
 influence.5.b: "Lanzar un golpe de Estado para poner en el poder al mismo partido gobernante que el nuestro."
 influence.5.c: "Desechar estos planes, por ahora."
 News_influence.3.t: "¡Cambio de régimen!"
 News_influence.3.d: "Fuerzas con respaldo de [FROM.GetAdjective] han depuesto al gobierno anterior."
 News_influence.3.a: "¡Wow..."
 News_influence.4.t: "Escenas dramáticas mientras un cambio de régimen barre [FROM.FROM.GetNameWithFlag]"
 News_influence.4.d: "Tras un período con un repunte en la actividad de la inteligencia extranjera, especialmente por parte de [FROM.GetNameWithFlag], el gobierno anterior de [FROM.FROM.GetName] ha sido derrocado y muchos altos cargos del antiguo régimen han sido detenidos. [FROM.FROM.GetLeader], del partido [FROM.FROM.GetRulingParty], ha emergido como el nuevo líder en medio del caos. Los primeros indicios apuntan a que el nuevo régimen de [FROM.FROM.GetName] se identificará con la ideología [FROM.FROM.GetRulingIdeology], alterando por completo el equilibrio de poder."
 News_influence.4.a: "Interesante"
 News_influence.5.t: "[FROM.GetNameWithFlag] bajo presión mientras en [FROM.FROM.GetNameWithFlag] frustran el golpe de Estado"
 News_influence.5.d: "El líder de [FROM.FROM.GetName], [FROM.FROM.GetLeader], gesticulaba con viveza desde el escenario al culpar a las «fuerzas hostiles del mal encabezadas por [FROM.GetName]» de las últimas escaladas de hoy, en las que [FROM.FROM.GetLeader] desbarató un dramático intento de golpe de Estado. Aunque el líder de [FROM.GetName], [FROM.GetLeader], negó rotundamente las acusaciones, es de conocimiento público que ambos mandatarios no se entienden. Con los lazos entre [FROM.GetAdjective] y [FROM.FROM.GetAdjective] en su punto más bajo, [FROM.FROM.GetName] ha prometido ante la opinión pública «erradicar la influencia de [FROM.GetAdjective] en [FROM.FROM.GetName]», además de redoblar esfuerzos en el rumbo hacia el [FROM.FROM.GetRulingIdeology] al que el gobernante [FROM.FROM.GetRulingParty] ha estado guiando a [FROM.FROM.GetNameWithFlag]."
 News_influence.5.a: "Interesante"
 News_influence.6.t: "¡Drama mientras en [FROM.FROM.GetNameWithFlag] colapsan en una guerra civil!"
 News_influence.6.d: "Escenas traumáticas se han podido ver hoy en [FROM.FROM.GetNameWithFlag], a medida que los últimos días de protestas, incertidumbre y extraños movimientos militares daban paso a tiroteos, sufrimiento y civiles en huida. Aunque los detalles son escasos, parece que varias unidades completas del ejército de [FROM.FROM.GetAdjective] se han declarado a favor de la oposición armada contra [FROM.FROM.GetLeader] y el partido [FROM.FROM.GetRulingParty] ([FROM.FROM.GetRulingIdeology]). Un líder de la oposición, hablando para la WNN bajo condición de anonimato, declaró que «esperan una ayuda significativa de [FROM.GetNameWithFlag] en su empeño por derrocar al tirano ilegítimo de [FROM.FROM.GetAdjective], [FROM.FROM.GetLeader]».\n\nAunque el liderazgo de [FROM.GetAdjective] ha expresado su «sorpresa por estos dramáticos acontecimientos», los observadores cercanos de las relaciones entre [FROM.GetAdjective] y [FROM.FROM.GetAdjective] le otorgan poca credibilidad. Un analista describió la situación de la siguiente manera: «Está claro que, en realidad, esto fue un intento de golpe de Estado respaldado por [FROM.GetAdjective] que no logró asegurar sus objetivos lo suficientemente rápido, dando lugar a un tenso estancamiento que se degradó en lo que ahora parece una guerra civil total». Varios líderes mundiales, especialmente aquellos con una ideología [FROM.FROM.GetRulingIdeology], han dedicado palabras poco diplomáticas a la aún no confirmada implicación de [FROM.GetAdjective].\n\nDado que los dos bandos en conflicto representan diferencias marcadas no solo en el rumbo nacional, sino también en el internacional, será interesante seguir de cerca si otros países también terminan involucrándose en el conflicto."
 News_influence.6.a: "¿Quién gobernará las cenizas?"
 influence.51.t: "Ayuda militar a [FROM.GetName]"
 influence.51.d: "Nuestra nación aliada, [FROM.GetName], se encuentra actualmente en un conflicto armado y busca proveedores para alimentar su esfuerzo bélico. Han mostrado interés en nuestras armas ligeras, vehículos de infantería y otros excedentes militares. Debemos decidir si vale la pena enviarles el equipamiento militar, no sea que lo utilicen contra nosotros en futuros conflictos..."
 influence.51.a: "Sí, ¡hagámoslo!"
 influence.51.a_tt: "¡Tú decides qué equipo enviar!"
 influence.51.b: "Ahora que lo pienso mejor..."
 influence.51.b_tt: "Ahora que lo pienso mejor... ¡necesito esas armas!"
 influence.52.t: "La cuestión de qué enviar"
 influence.52.d: "Podemos enviar a [FROM.FROM.GetName] una de las tres categorías de ayuda militar. Tras elegir la categoría, seleccionaremos un §Htamaño de paquete§! que determinará la cantidad, el coste político y la amenaza generada.\n\n§HInfantería§!: armas ligeras, antitanque ligero, antiaéreo.\n§HVehículos y Blindados§!: tanques principales de batalla, tanques anfibios, vehículos utilitarios.\n§HEquipamiento Moderno§!: misiles antitanque pesados, misiles superficie-aire, drones."
 influence.52.a: "Paquete de §HEquipamiento de infantería§!"
 influence.52.b: "Paquete de §HVehículos y blindados§!"
 influence.52.c: "En realidad, necesito esto..."
 influence.53.t: "Ayuda militar de [FROM.GetName]"
 influence.53.d: "[FROM.GetName] nos ha ofrecido un paquete de equipamiento militar. ¿Deberíamos aceptarlo o devolverlo?"
 influence.53.a: "Aceptar el paquete"
 influence.53.c: "Devolver el equipamiento"
 influence.54.t: "Informe mensual de autoinfluencia"
 influence.54.d: "[?nations_influenced|0] naciones han sido influenciadas con éxito el [GetDateText]. Las siguientes naciones han sido influenciadas a raíz de nuestros esfuerzos de influencia en curso:\n[auto_influence_target_display]"
 influence.54.a: "De acuerdo, ¡gracias!"
 econvent.1.t: "El Banco Central de [Root.GetName] advierte sobre una posible burbuja inmobiliaria"
 econvent.1.d: "Estimado [Root.GetLeader], lamentamos informarle que una parte considerable de nuestro equipo de expertos (los mejores y más brillantes economistas de [Root.GetAdjective]) están detectando señales tempranas de que el mercado inmobiliario de [Root.GetAdjective] está sobrecalentado y podría estar encaminándose hacia una burbuja que está a punto de estallar. Tenga en cuenta que predecir el futuro es una tarea difícil y ardua, por lo que es posible que nuestros expertos estén equivocados.\nPor supuesto, nunca se nos ocurriría darle a Su Excelencia órdenes sobre qué hacer, pero hacer algunos ajustes ahora será menos doloroso que una crisis total en el futuro."
 econvent.1.a: "Enfriemos los mercados antes de que esto empeore."
 econvent.1.b: "Basta de tonterías. ¡La economía [Root.GetAdjective] siempre está saludable!"
 econvent.1.b_tt: "§HSin efecto§! por ahora, pero podría crearse una burbuja inmobiliaria en el futuro.\n"
 econvent.2.t: "Caída de los precios de la vivienda"
 econvent.2.d: "Dado que los precios de las casas y apartamentos se han puesto por las nubes, especialmente en el último año, la población ha recurrido a préstamos cada vez más cuantiosos para poder permitirse una vivienda, mientras que los especuladores han invertido fuertemente en propiedades utilizando también dinero prestado. En este momento, esto está llegando a su fin, y rápido. Los precios están cayendo y la gente intenta vender como si no hubiera un mañana. Muchos de los menos afortunados se quedarán atrapados con enormes préstamos que no pueden devolver. Mientras la población maldice tanto a [Root.GetLeader] como al Banco Central de [Root.GetAdjective] por causar esto, debemos emitir una declaración pública sobre cómo pretendemos gestionar esta crisis con rapidez."
 econvent.2.a: "Inundaremos el sistema con dinero barato para que el mercado se recupere."
 econvent.2.b: "Esto es doloroso, pero los precios de las viviendas tenían que bajar."
 econvent.3.t: "Caída del mercado de valores"
 econvent.3.d: "Parece que el caos que siguió al estallido de la burbuja inmobiliaria ha llegado a la Bolsa. Los precios de las acciones de casi todas las empresas [Root.GetAdjective] que cotizan en bolsa se desplomaron fuertemente esta mañana, y nuestra moneda también se depreció mucho. Las operaciones se suspendieron temporalmente antes del almuerzo, pero no se espera ninguna mejora una vez que los mercados vuelvan a abrir mañana, ya que todos están desesperados por vender sus acciones."
 econvent.3.a: "Menos mal que mi dinero estaba colocado en paraísos fiscales extranjeros."
 econvent.3.b: "Otorgar rescates financieros."
 econvent.4.t: "Bancos [Root.GetAdjective] enfrentan una crisis"
 econvent.4.d: "A pesar del delicioso café expreso caliente con leche en su taza de [Root.GetName] §R<3§! [Root.GetLeader], este no es un buen día. Los magnates financieros desesperados, sus lobbistas y los políticos a los que han hecho contribuciones, todos están abarrotando las oficinas gubernamentales de [Root.GetAdjective] y todos tienen el mismo mensaje: \"¡Necesitamos un rescate!\".\n\nAparentemente, el doble impacto de la crisis inmobiliaria y el desplome de la Bolsa fue demasiado para que el sector financiero lo manejara. La acumulación de deudas incobrables a partir de su especulación es simplemente demasiado grande, es necesario que haya una entrada de dinero gubernamental fresco, o habrá quiebras generalizadas y ahorristas inocentes perderán sus depósitos."
 econvent.4.a: "Proporcionaremos los rescates."
 econvent.4.b: "No habrá rescates, pero garantizaremos los depósitos de ahorros."
 econvent.4.c: "La supervivencia del más apto hace que el capitalismo sea grandioso."
 econvent.5.t: "Los consumidores [Root.GetAdjective] gastan menos"
 econvent.5.d: "Un informe reciente destacó que las personas trabajadoras [Root.GetAdjective] están cada vez más preocupadas por su futuro. Este pesimismo está provocando que las personas ahorren más y el consumo general está disminuyendo. Si esto continúa, muchas empresas en [Root.GetName] tendrán que reducir su tamaño o cerrar. Sin embargo, las empresas que exportan principalmente bienes [Root.GetAdjective] no se ven afectadas por esto."
 econvent.5.a: "Transferir algo de dinero para compras."
 econvent.5.b: "Esperemos que esto pase pronto."
 econvent.6.t: "Menor demanda de bienes [Root.GetAdjective] en el extranjero"
 econvent.6.d: "Los datos son claros: las exportaciones internacionales de [Root.GetName] están disminuyendo. La causa, sin embargo, se debate acaloradamente entre los asesores económicos de [Root.GetLeader]. Una teoría sostiene que nos hemos vuelto menos competitivos debido a nuestros salarios relativamente altos; otra afirma que nuestros competidores han aumentado la calidad de sus productos. Otros consideran que la disminución de la demanda se debe simplemente a los cambios de tendencias en el extranjero. Sea cual sea la causa, no hay mucho que podamos hacer al respecto, salvo dejarlo atrás y trabajar más duro en el futuro."
 econvent.6.a: "¡Los extranjeros están siendo tontos! ¡Las cosas [Root.GetAdjective] son las mejores!"
 econvent.7.t: "La sequía causa desastre para los agricultores [Root.GetAdjective]"
 econvent.7.d: "Aunque normalmente no llueve mucho, las precipitaciones de esta temporada de crecimiento han sido pésimas y la mayoría de los cultivos se han perdido. La poca producción agrícola que se ha producido se debe enteramente a los ríos que quedan y al riego artificial, algo que lamentablemente no es muy común aquí en [Root.GetName]. Los agricultores están exigiendo ayuda al Gobierno de [Root.GetLeader] y los habitantes de las ciudades están preocupados por el aumento de los precios de los alimentos."
 econvent.7.a: "Mejor suerte la próxima temporada."
 econvent.8.t: "¡Hambruna en [Root.GetName]!"
 econvent.8.d: "La sequía en curso ha provocado que gran parte de las zonas rurales de [Root.GetName] carezcan de alimentos a precios asequibles. Las existencias de alimentos se han agotado y una auténtica hambruna está provocando desnutrición, enfermedades y muertes."
 econvent.8.a: "¡Ay, qué dolor!"
 econvent.9.t: "Aumento de la confianza del consumidor"
 econvent.9.d: "Las condiciones recientes dentro de la economía de [ROOT.GetAdjective] han demostrado que los consumidores de nuestro país cuentan ahora con las condiciones de mercado perfectas para gastar dinero y realizar inversiones en el futuro del país. ¡La gente está comprando bienes de consumo como si no hubiera un mañana!"
 econvent.9.a: "¡Noticias maravillosas!"
 econvent.10.t: "Auge del mercado de valores"
 econvent.10.d: "El mercado de valores [ROOT.GetAdjective] está en auge. La gente [ROOT.GetAdjective] está operando acciones como si estuviera comprando comida.\n"
 econvent.10.a: "¡Mantengamos el auge!"
 econvent.10.a_tt: "Inyectar liquidez adicional en el mercado puede resultar devastador en caso de producirse un colapso.\n"
 econvent.10.b: "Excelente"
 econvent.10.b_tt: "El mercado continuará normalmente sin intervención. Aún existe una posibilidad moderada de un colapso.\n"
 econvent.10.c: "Desaceleremos la economía."
 econvent.10.c_tt: "La economía se ha sobrecalentado demasiado rápido. Empecemos a frenar el ritmo restringiendo el flujo de capital.\n"
 econvent.11.t: "Fallo de una importante institución financiera"
 econvent.11.d: "Han aparecido titulares sobre la quiebra de una importante institución financiera. Los medios de comunicación están dando rienda suelta a esta situación y se están yendo a las colinas. Se le ruega al gobierno que responda, ya que se teme que se avecina una crisis mayor. ¿Qué debemos hacer?"
 econvent.11.a: "Demasiado grande para fallar..."
 econvent.11.b: "Es solo buen negocio..."
 econvent.12.t: "Ondas de la crisis financiera de [FROM.GetName]"
 econvent.12.d: "La reciente crisis en [FROM.GetName] ha causado mucho malestar en nuestra nación, ya que los efectos de su crisis se sienten en nuestro país. Nuestras economías interconectadas ahora están sufriendo el peso de esta crisis."
 econvent.12.a: "Otorgar fondos de ayuda."
 econvent.12.b: "El mercado por encima de todo."
 econvent.13.t: "El alto endeudamiento hace que las empresas se vayan"
 econvent.13.d: "La alta relación deuda-PIB de nuestra nación está haciendo que las empresas dentro del país cierren y abandonen el país. Reducir nuestra deuda es imperativo o, de lo contrario, es posible que veamos que más industrias decidan irse."
 econvent.13.a: "Permitir que la empresa se vaya"
 econvent.13.b: "Comprar la empresa"
 econvent.14.t: "Los inversores privados invierten en la industria civil"
 econvent.14.d: "Varios inversores privados han decidido invertir en una nueva industria civil dentro de la nación. La nueva fábrica emergente traerá puestos de trabajo y más prosperidad a nuestra nación. La capacidad adicional de construcción y producción ciertamente ayudará a ponernos en marcha económicamente hablando."
 econvent.14.a: "¡Increíble!"
 econvent.15.t: "Los inversores privados invierten en parques de oficinas"
 econvent.15.d: "Un grupo de inversores privados ha decidido invertir en una serie de servicios de terceros a menor escala."
 econvent.15.a: "¡Increíble!"
 sco.1.t: "[FROM.GetName] ha presentado una solicitud para obtener el estatus de observador de la SCO"
 sco.1.d: "Un nuevo estado desea observar los procedimientos de la SCO y, quizás, eventualmente convertirse en miembro de pleno derecho de la organización."
 sco.1.a: "No vemos ninguna razón por la cual su solicitud no deba ser concedida."
 sco.1.b: "No podemos otorgarles este estatus."
 sco.2.t: "[FROM.GetName] ha presentado una solicitud para obtener el estatus de miembro de la SCO"
 sco.2.d: "Un nuevo estado desea convertirse en miembro de pleno derecho de la organización."
 sco.2.a: "No vemos ninguna razón por la cual su solicitud no deba ser concedida."
 sco.2.b: "No podemos otorgarles este estatus."
 sco.3.t: "[FROM.GetName] ofrece realizar ejercicios militares conjuntos con nosotros"
 sco.3.d: "Este estado miembro de la SCO propone realizar ejercicios conjuntos para fortalecer nuestra cooperación militar y aumentar la confianza entre nuestros dos países."
 sco.3.a: "¡Esta es una oportunidad bienvenida para que nuestras tropas adquieran experiencia!"
 sco.3.b: "La cooperación con [FROM.GetName] es imposible."
 sco.4.t: "[FROM.GetName] ha aceptado nuestra oferta"
 sco.4.d: "Los delegados de [FROM.GetAdjective] han recibido calurosamente nuestra propuesta y están realizando los preparativos para nuestros ejercicios conjuntos."
 sco.4.a: "¡Que comiencen los juegos!"
 sco.5.t: "[FROM.GetName] ha rechazado nuestra oferta"
 sco.5.d: "Los delegados [FROM.GetAdjective] han declinado llevar a cabo los ejercicios militares altamente fructíferos con nosotros."
 sco.5.a: "Es su pérdida..."
 sco.6.t: "La SCO lanza ejercicios militares a gran escala"
 sco.6.d: "Las tropas [FROM.GetAdjective] se unieron hoy a miles de otras en lo que se describe como un ejercicio antiterrorista bajo los auspicios de la Organización de Cooperación de Shanghai (SCO). Mientras muchos han elogiado estos ejercicios como un síntoma de una exitosa cooperación internacional, otros han reaccionado con menos entusiasmo ante este último desarrollo. Analistas estadounidenses y europeos citaron el despliegue de aviones de largo alcance y un poder de fuego considerable como evidencia de que estos ejercicios no están destinados a practicar operaciones contra el terrorismo, sino como un ensayo bien armado para enfrentamientos con Occidente."
 sco.6.a: "¿Estos amenazadores ejercicios están destinados a nuestro beneficio?"
 sco.6.b: "¡Solo los terroristas tienen algo que temer de esto!"
 sco.6.c: "Un desarrollo interesante."
 sco.7.t: "[FROM.GetName] obtiene la membresía de la SCO"
 sco.7.d: "Tras un proceso gradual de integración, [FROM.GetLeader] anunció hoy la membresía de su país en la Organización de Cooperación de Shanghai. Observadores esperanzados han retratado este desarrollo como un avance adicional en la cooperación económica y política regional en el continente euroasiático, mientras que analistas más pesimistas han lamentado la creciente influencia de China y la amenaza que esto representa para el orden mundial existente."
 sco.7.a: "La amenaza china sigue creciendo..."
 sco.7.b: "¡Un buen día para la diplomacia!"
 sco.8.t: "[FROM.GetName] abandona la SCO"
 sco.8.d: "Tras la reevaluación de las acciones chinas por parte del actual gobierno [FROM.GetAdjective], [FROM.GetLeader] ha retirado a [FROM.GetNameDef] de la Organización de Cooperación de Shanghai. [CHI.GetLeader] todavía no ha hecho comentarios al respecto, pero los medios de comunicación vinculados al gobierno chino se han apresurado a lamentar que esta salida represente un paso atrás en términos de integración regional."
 sco.8.a: "La agresión china ha alienado a esta nación."
 sco.8.b: "Un día triste para la cooperación internacional..."
 sco.9.t: "China se hace con el control de la SCO respecto a Rusia"
 sco.9.d: "Históricamente, la Organización de Cooperación de Shanghái se manejaba como un esfuerzo conjunto chino-ruso. Sin embargo, según se informa, la insatisfacción china con este acuerdo ha obligado a Rusia a ocupar una posición más secundaria dentro de la organización. Si bien tanto [CHI.GetLeader] como [SOV.GetLeader] han guardado silencio sobre esta lucha de poder, se dice que los funcionarios rusos están furiosos con los chinos y resentidos por la humillación del gigante eslavo que ha tenido lugar a plena vista de los demás estados miembros de la OCS. Es probable que las ramificaciones geopolíticas de esta medida en términos de hegemonía sobre Asia Central sean sustanciales."
 sco.9.a: "China no está dispuesta a compartir el protagonismo..."
 sco.10.t: "China exige que elijamos un bando"
 sco.10.d: "Nuestra membresía continua tanto en la CSTO como en la Organización de Cooperación de Shanghai nos ha colocado en una posición difícil tras la separación sino-rusa. China ahora está exigiendo que elijamos entre abandonar la SCO y permanecer en la alianza rusa o permanecer en la SCO y abandonar a los rusos. La elección que hagamos casi con seguridad tendrá un significado importante en la confrontación entre los dos gigantes regionales que se avecina."
 sco.10.a: "¡No somos nada si no somos leales!"
 sco.10.b: "¡Es hora de abandonar este barco que se hunde..."
 sco.11.t: "[FROM.GetName] nos está brindando asistencia para el desarrollo"
 sco.11.d: "Bajo los auspicios de la Organización de Cooperación de Shanghai, el gobierno de [FROM.GetAdjective] está proporcionando a nuestras empresas locales fondos y recursos muy necesarios para facilitar sus proyectos de desarrollo. Si bien esta asistencia es una buena noticia para nuestra economía, aumentará el grado de influencia que [FROM.GetNameDef] ejerce sobre nuestro país."
 sco.11.a: "¡Estamos agradecidos por la ayuda!"
 sco.12.t: "[FROM.GetName] ha formado el $SHANGHAI_PACT$"
 sco.12.d: "[FROM.GetName] formó $SHANGHAI_PACT$ para competir con [USA.GetFactionName]. Les hemos permitido tener una gran [FROM.GetAdjective] influencia sobre nosotros, también somos miembros de la OCS, por lo que nos vemos obligados a ser miembros de la nueva facción."
 sco.12.a: "De acuerdo"
 taiwan.1.t: "Marcha 228 Hand-in-Hand"
 taiwan.1.d: "Una manifestación de solidaridad. Se formó una cadena humana de 500 kilómetros de longitud, formada por unos dos millones de personas. Empezando por el puerto de Keelung, la ciudad más septentrional de Taiwán, la cadena siguió su camino hasta el extremo sur de la isla. El objetivo era doble: los taiwaneses deseaban la paz, pero también protestaban por el despliegue de misiles por parte de la República Popular China dirigidos a Taiwán, su vecina isla. Parte del simbolismo de la manifestación, en particular en el momento en que los participantes \"se alejan de China\", apuntaba claramente a apoyar la independencia de Taiwán, por lo que no asistieron los miembros de la Coalición Pan-Azul, que respondieron a la manifestación con una manifestación propia en toda la isla días después."
 taiwan.1.a: "Nunca olvidemos a las víctimas."
 taiwan.2.t: "Tifón Bilis"
 taiwan.2.d: "En preparación para el paso de Bilis, se cerraron oficinas en toda la isla. Además del cierre de empresas, se reprogramaron los vuelos hacia y desde la isla y se estableció un centro de ayuda para tifones. Debido a la amenaza de deslizamientos de tierra, se emitió una alerta de deslizamiento de tierra para Taiwán. Aunque la tormenta aún no había tocado tierra, una persona murió en Taipei el 22 de agosto después de ser sepultada por un deslizamiento de tierra provocado por el inminente tifón; esta fue la primera víctima mortal causada por Bilis. Junto con la reprogramación de vuelos, se cerraron numerosos aeropuertos y la Bolsa de Valores de Taiwán estaba programada para cerrar el 23 de agosto. Mientras tanto, los hospitales ampliaron los horarios de servicio en previsión del ingreso de pacientes. Los miembros de la guardia costera taiwanesa regularon la actividad pesquera debido a la amenaza de la acción mortal de las olas. El puerto de Kaohsiung estuvo cerrado durante toda la duración de la tormenta. Debido a la mayor demanda de verduras en el período previo a la tormenta, el costo de dichos alimentos aumentó entre un 20 y un 30 por ciento.\n\nBilis fue un ciclón tropical sumamente destructivo para Taiwán. Los daños a las industrias agrícola, pesquera y forestal de la isla ascendieron a 133,5 millones de dólares. El tifón causó 14 muertos y otras 80 personas heridas. Los cortes de electricidad afectaron negativamente a aproximadamente 600.000 hogares y 400 casas en todo Taiwán quedaron destruidas. Varios cientos de miles de familias sufrieron escasez de agua después de la tormenta. En Cheng-Kung, una estación meteorológica registró una ráfaga de viento de 281 km/h, que rompió el anemómetro de la estación. Un solo deslizamiento de tierra en la ciudad de Jenai sepultó a nueve agricultores. Decenas de miles de personas fueron desplazadas durante la tormenta y trasladadas a refugios de evacuación establecidos por el gobierno. En el este del condado de Hualien, 250 casas sucumbieron a los fuertes vientos. Los vientos también derribaron árboles y arrastraron vehículos ligeros, bloqueando las carreteras. Las fuertes lluvias asociadas con Bilis inundaron aproximadamente 40.000 ha de huertos y arrozales. Tras el paso de Bilis por Taiwán, un terremoto de magnitud 5,7 sacudió la isla, agravando las condiciones ya empeoradas."
 taiwan.2.a: "Hora de reconstruir."
 taiwan.3.t: "Elecciones presidenciales de Taiwán"
 taiwan.3.d: "Son las segundas elecciones presidenciales directas de la República de China para elegir al presidente y vicepresidente del décimo mandato bajo la Constitución de 1947. Esto tiene el potencial de poner fin a más de medio siglo de mandato del Kuomintang en Taiwán, ya que los votantes del KMT se dividieron a la mitad.\n\nAunque era más popular y se clasificaba sistemáticamente más alto en las encuestas, el franco exgobernador de Taiwán, James Soong, no logró obtener la nominación del Kuomintang. Como resultado, anunció su candidatura de forma independiente. El Kuomintang respondió expulsando a Soong y a 21 de sus aliados. Demandaron a Soong por robo, alegando que, como secretario general del partido, robó millones de dólares de Taiwán en efectivo destinados a la familia del difunto presidente Chiang Ching-kuo y ocultó el dinero en la Chunghsing Bills Finance Co. Soong se defendió diciendo que actuaba bajo la dirección de Lee, pero su historia resultó poco convincente en gran medida. Tras mantener inicialmente una ventaja dominante en las encuestas, Soong perdió por poco más de 300.000 votos, y el escándalo financiero que empañó su imagen de político limpio probablemente propiciará su fracaso.\n\nEl Partido Progresista Democrático presenta al expresidente del Gobierno de Taipéi, Chen Shui-bian, como candidato a la presidencia. Tras haberse presentado a las elecciones de 1996 con una plataforma de independencia radical y haber perdido de forma aplastante, el DPP moderó su postura en mayo de 1999 al emitir la «Resolución sobre el Futuro de Taiwán». La resolución aceptaba el statu quo y promovía la visión moderada de que Taiwán ya era independiente, por lo que cualquier declaración formal no sería urgente en absoluto. También se incluyó la promesa de que cualquier cambio en el estatus internacional de Taiwán tendrá que hacerse mediante un referéndum, aliviando así el temor de que, si fuera elegido, un gobierno del DPP declararía unilateralmente la independencia sin la aprobación popular. La candidatura de Chen-Lu también promete ser más agresiva en la lucha contra el dinero negro, proporcionar más financiación para los servicios sociales y ser más respetuosa con el medio ambiente, manifestando por ejemplo su oposición a la energía nuclear."
 taiwan.3.a: "Chen Shui-bian (DPP)"
 taiwan.3.b: "Lien Chan (KMT)"
 taiwan.3.c: "James Soong (Independiente)"
 taiwan.4.t: "Establecimiento de la Administración de la Guardia Costera"
 taiwan.4.d: "La CGA combina el Comando de la Guardia Costera, la Oficina de Policía Marítima y varios barcos de la Dirección General de Aduanas de Taiwán, del Ministerio de Finanzas. La CGA unifica formalmente las agencias de aplicación de la ley costera y marítima. Verá mucha acción para una agencia joven, participando en numerosas operaciones de búsqueda y rescate y contra el contrabando en el futuro cercano.\n\nLa Administración de la Guardia Costera del Consejo de Asuntos Oceánicos (CGA) está encargada de mantener la ley y el orden, proteger los recursos de las aguas territoriales de la República de China, que rodean Taiwán, Penghu, Kinmen, Islas Matsu, Isla Verde, Isla Orquídea, Islas Dongsha e Islas Nansha, así como proporcionar una primera línea de defensa a lo largo de las áreas costeras contra los contrabandistas y los inmigrantes ilegales. La CGA se considera una agencia de aplicación de la ley civil bajo la administración del Consejo de Asuntos Oceánicos del Yuan Ejecutivo, aunque durante las emergencias puede incorporarse como parte de las Fuerzas Armadas de la República de China.\n\nLa Administración de la Guardia Costera está dirigida por un ministro y tres viceministros. La CGA incluye ocho departamentos, una oficina y cinco grupos de trabajo, así como una Dirección General de Patrulla Marítima y una Dirección General de Patrulla Costera. Su jurisdicción abarca las aguas que rodean Kinmen, Matsu, Penghu y la isla principal de Taiwán para garantizar la protección adecuada de los 1.819,8 kilómetros de costa y los 540.000 kilómetros cuadrados de \"Territorio Azul\", que es 15 veces más grande que la isla de Taiwán."
 taiwan.4.a: "Por una costa segura."
 taiwan.5.t: "Apertura de la Universidad Nacional de Kaohsiung"
 taiwan.5.d: "La Universidad aspira a reducir la brecha educativa entre el sur y el norte de Taiwán y a impulsar la economía de la zona meridional.\n\nLa universidad cuenta con veinte departamentos, entre ellos Lenguas y Literaturas Occidentales, Lengua y Literatura de Asia Oriental, Arquitectura, Diseño Creativo, Kinesiología, Estudios de Salud y Ocio, Derecho, Gobierno y Derecho, Derecho Económico y Financiero, Economía Aplicada, Matemáticas Aplicadas, Química Aplicada, Ingeniería Eléctrica, Ingeniería Civil y Ambiental, Ciencias de la Vida y Gestión Industrial y Empresarial de Asia-Pacífico, Artes Tradicionales, Finanzas, Gestión de la Información y Física Aplicada. Entre estos departamentos, el de Gestión Industrial y Empresarial de Asia-Pacífico está especialmente diseñado para cultivar a las élites industriales.\n\nUna característica inusual de esta institución es su espacio abierto. No hay muros en los límites del campus. Los residentes que viven alrededor de la escuela pueden pasear por el campus o hacer ejercicio utilizando los aparatos del gimnasio. La biodiversidad es también una característica notable de la NUK. Hay más de 60 variedades de peces en el estanque del Parque Terrestre y Acuático."
 taiwan.5.a: "Promoviendo la educación en el sur."
 taiwan.13.t: "Huelga del sindicato de auxiliares de vuelo de Taoyuan"
 taiwan.13.d: "El Sindicato de Auxiliares de Vuelo de Taoyuan, que representa a unos 2.500 miembros de la tripulación de cabina de China Airlines, organiza la primera huelga en la historia de la aviación taiwanesa. Como resultado, se han cancelado un total de 122 vuelos de pasajeros de China Airlines con origen en el Aeropuerto Internacional de Taoyuan y el Aeropuerto de Taipéi Songshan, dejando a 20.000 pasajeros varados. El sindicato nos ha presentado siete exigencias que debemos aceptar para mejorar las condiciones laborales."
 taiwan.13.a: "Acepta sus demandas"
 taiwan.13.b: "Nosotros nunca retrocedemos"
 taiwan.14.t: "La huelga fracasó"
 taiwan.14.d: "Después de que rechazáramos sus exigencias, la huelga terminó pronto. Todo el mundo está volviendo al trabajo ahora."
 taiwan.14.a: "Ellos nunca tuvieron la oportunidad"
 taiwan.15.t: "La huelga continúa"
 taiwan.15.d: "Después de que rechazáramos sus exigencias, la huelga se intensificó aún más. No parece que vaya a terminar pronto."
 taiwan.15.a: "Al menos lo intentamos"
 taiwan.16.t: "El tanque se cayó del puente"
 taiwan.16.d: "Un tanque CM-11 del ejército volcó ayer por la mañana en un arroyo del condado de Pingtung cuando regresaba a la base tras un ejercicio de entrenamiento, provocando la muerte de tres de los cinco soldados a bordo. El conductor sufrió solo heridas leves y logró salir del tanque por su propio pie. Los otros cuatro, que se encontraban dentro de la torreta de tiro, no pudieron escapar a través de las escotillas de la torreta debido a que el tanque quedó boca abajo."
 taiwan.16.a: "Investigar cómo pudo suceder esto"
 hongkong.1.t: "¡Los chinos se han negado a revertir la anexión!"
 hongkong.1.d: "China ha desestimado nuestras amenazas y no nos ha dejado otra opción que cumplirlas."
 hongkong.1.a: "Ellos ya no parecen temernos."
 hongkong.2.t: "China despliega tropas en Hong Kong"
 hongkong.2.d: "Tras las protestas en la Región Administrativa Especial de Hong Kong, China ha ordenado a varias unidades del Ejército Popular de Liberación que salgan a las calles de Hong Kong para \"restaurar la ley y el orden\". [CHI.GetLeader] ha asegurado a los \"manifestantes pacíficos\" que no serán objeto de ataques y que todos los detenidos serán tratados de conformidad con el derecho internacional de los derechos humanos. Sin embargo, muchos en Hong Kong y en el extranjero han expresado su escepticismo sobre el grado en que las tropas chinas ejercerán moderación hacia los manifestantes."
 hongkong.2.a: "¡Esta acción es despreciable!"
 hongkong.2.b: "China hizo lo que tenía que hacer."
 hongkong.2.c: "Esto no es asunto nuestro."
 hongkong.5.t: "¡El Reino Unido está amenazando con acciones militares!"
 hongkong.5.d: "Los británicos han reaccionado de forma más beligerante de lo que esperábamos ante nuestra anexión de su antiguo territorio colonial. Deberíamos considerar si cederemos a sus demandas."
 hongkong.5.a: "Esta no es la colina en la que queremos morir."
 hongkong.5.b: "Que vengan si quieren."
 hongkong.6.t: "¡El Reino Unido está amenazando con medidas económicas contra nosotros!"
 hongkong.6.d: "Los británicos han decidido amenazarnos con sanciones si no revertimos nuestra anexión de su antiguo territorio colonial. Deberíamos considerar si debemos atender o no sus demandas."
 hongkong.6.a: "Deberíamos evitar el enfrentamiento."
 hongkong.6.b: "¡Sus amenazas no significan nada!"
 hongkong.7.t: "¡China ha acordado revertir la anexión!"
 hongkong.7.d: "Claramente impresionados por el poder británico, los chinos han dado marcha atrás en el tema de Hong Kong."
 hongkong.7.a: "¡Nuestras amenazas todavía tienen efecto!"
 hongkong_news.1.t: "Hong Kong sacudido por protestas generalizadas"
 hongkong_news.1.d: "Tras la decisión de China de descartar la posibilidad de que Hong Kong elija a su jefe ejecutivo por sufragio universal, han estallado protestas masivas en territorio chino. [HKG.GetLeader] ha declarado que, si bien el gobierno de Hong Kong respeta el derecho del pueblo de Hong Kong a expresar pacífica y legalmente sus opiniones, no se tolerará la violencia ni la anarquía. La respuesta de China a la crisis actual aún está por verse, ya que [CHI.GetLeader] no ha hecho comentarios sobre los acontecimientos recientes."
 hongkong_news.1.d_limit: "Tras la decisión de China de que el jefe ejecutivo de Hong Kong sólo podría ser elegido por sufragio universal si aprueba previamente a los candidatos, han estallado protestas masivas en territorio chino. [HKG.GetLeader] ha declarado que, si bien el gobierno de Hong Kong respeta el derecho del pueblo de Hong Kong a expresar pacífica y legalmente sus opiniones, no se tolerará la violencia ni la anarquía. La respuesta de China a la crisis actual aún está por verse, ya que [CHI.GetLeader] no ha hecho comentarios sobre los acontecimientos recientes."
 hongkong_news.1.d_reunification: "Tras el anuncio de China de que en 2047 Hong Kong perderá su estatus especial y volverá a estar bajo control chino por completo, han estallado protestas masivas en territorio chino. [HKG.GetLeader] ha declarado que, si bien el gobierno de Hong Kong respeta el derecho del pueblo de Hong Kong a expresar pacífica y legalmente sus opiniones, no se tolerará la violencia ni la anarquía. La respuesta de China a la crisis actual aún está por verse, ya que [CHI.GetLeader] no ha hecho comentarios sobre los acontecimientos recientes."
 hongkong_news.1.d_annexed: "Tras la controvertida anexión de Hong Kong por parte de China, han estallado protestas masivas en territorio chino. [HKG.GetLeader] ha declarado que, si bien el gobierno de Hong Kong respeta el derecho del pueblo de Hong Kong a expresar pacífica y legalmente sus opiniones, no se tolerará la violencia ni la anarquía. La respuesta de China a la crisis actual aún está por verse, ya que [CHI.GetLeader] no ha hecho comentarios sobre los acontecimientos recientes."
 hongkong_news.1.a: "Un desarrollo interesante."
 hongkong_news.1.b: "Estas son malas noticias para nosotros."
 hongkong_news.2.t: "Las protestas en Hong Kong se esfuman"
 hongkong_news.2.d: "Las protestas en la Región Administrativa Especial de Hong Kong contra las recientes acciones chinas han disminuido gradualmente en los últimos días y prácticamente se han detenido. Las operaciones policiales en el territorio chino no han encontrado resistencia, y muchos de los que antes habían tomado las calles han regresado a sus hogares. Está por ver qué significa esto para la relación entre China y un territorio convulso que alberga valores políticos significativamente diferentes a los de la primera. Quizá un indicador de lo que está por venir fue una pancarta colgada por los manifestantes en un lugar destacado del centro de la ciudad en la que se leía: «Volveremos»."
 hongkong_news.2.a: "Un desarrollo interesante."
 hongkong_news.2.b: "Ellos saben que su causa es inútil."
 hongkong_news.3.t: "Las protestas en Hong Kong aumentan de escala"
 hongkong_news.3.d: "Las protestas contra las acciones chinas en el territorio de Hong Kong han aumentado rápidamente y los analistas coinciden en que las protestas han entrado en una nueva etapa en términos de escala y tácticas. Aún está por verse cómo responderán los gobiernos de China y Hong Kong a esta nueva escalada, pero se dice que los funcionarios de ambos gobiernos están cada vez más resentidos por el impacto de las protestas en sus intereses creados. Los manifestantes, por su parte, se niegan a retirarse hasta que los gobiernos de China y Hong Kong atiendan sus demandas."
 hongkong_news.3.a: "El pueblo de Hong Kong no se quedará callado..."
 hongkong_news.3.b: "¡Se quedarán en casa si saben lo que es bueno para ellos!"
 korea.4.t: "La ruptura chino-norcoreana"
 korea.4.d: "Las críticas al régimen de [NKO.GetLeader] en los medios de comunicación vinculados al gobierno chino han aumentado drásticamente en las últimas semanas. Estas críticas han atacado el continuo problema nuclear de Corea del Norte y el fracaso del estado norcoreano para mejorar las condiciones de vida de sus ciudadanos a través de la liberalización económica como lo ha hecho China en las últimas décadas.\n\nSi bien [CHI.GetLeader] ha permanecido en silencio sobre el tema, se cree ampliamente que estos medios de comunicación no habrían lanzado una crítica tan mordaz de un aliado que alguna vez fue cercano sin la aprobación tácita de [CHI.GetLeader]. Muchos observadores ven esto como la culminación de la frustración china con la dinastía Kim, y posiblemente un deseo de establecer un gobierno alternativo que sea más estable y dócil a los deseos de China."
 korea.4.a: "Solo [CHI.GetLeader] sabe a dónde nos lleva esto..."
 korea.5.t: "Comienzan las conversaciones"
 korea.5.d: "La principal exigencia de Corea del Norte es que pongamos fin a los ejercicios militares conjuntos con Estados Unidos, ejercicios que ellos consideran preparativos para una invasión de su territorio. Sin embargo, nuestros militares consideran que estos ejercicios son preparativos necesarios en caso de un ataque norcoreano. Por lo tanto, aceptar poner fin a estos ejercicios sería una apuesta importante, que pondría en juego la seguridad de nuestro país."
 korea.5.d_NKO: "La principal exigencia del Sur es que detengamos nuestras pruebas de armas nucleares, pruebas que ellos consideran una prueba de nuestras intenciones agresivas. Sin embargo, los militares consideran que nuestro programa de armas nucleares es un importante elemento disuasorio contra una invasión estadounidense. Además, el programa y las pruebas necesarias para su continuación contribuyen a reforzar la legitimidad de nuestro gobierno. Por lo tanto, aceptar detener estas pruebas sería una apuesta importante, en la que estaría en juego tanto la seguridad de nuestro país como la de nuestro gobierno."
 korea.5.a: "Nuestro país nunca estará completo a menos que asumamos algunos riesgos..."
 korea.5.b: "Algunos riesgos son demasiado grandes para correrlos."
 korea.6.t: "Comienzan las conversaciones de paz coreanas"
 korea.6.d: "Durante más de medio siglo, Corea del Norte y Corea del Sur han estado técnicamente en estado de guerra. Este conflicto congelado se ha recalentado ocasionalmente con enfrentamientos entre las dos partes a lo largo de las fronteras marítimas en disputa o en la zona desmilitarizada. Ahora, las dos partes se están uniendo con la esperanza de poner fin a esta situación y lograr una desescalada en la península de Corea mediante un tratado de paz formal. La negociación de un tratado de paz se considera ampliamente como un primer paso importante hacia la reunificación de la península de Corea."
 korea.6.a: "¿Podrán los dos lados llegar a un compromiso?"
 korea.7.t: "[CHI.GetLeader] expresa su apoyo a la reunificación coreana"
 korea.7.d: "China siempre ha sido cautelosa ante la perspectiva de una Corea unida alineada con Estados Unidos en su puerta. Por eso, los observadores se sorprendieron al oír a [CHI.GetLeader] expresar un apoyo inequívoco a la reunificación, en una medida que, según algunos informes, ha tomado por sorpresa a los líderes norcoreanos. Dada la importante influencia de China en la península de Corea, es probable que este anuncio presione a las dos partes para que se sienten a la mesa de negociaciones."
 korea.7.a: "¿Hay cambios en el aire?"
 korea.8.t: "El movimiento radical coreano gana popularidad"
 korea.8.d: "La desigualdad económica en la República de Corea ha contribuido a un creciente descontento entre las clases bajas del país. Miles de activistas en línea han comenzado a pedir una mayor igualdad mediante el establecimiento de una autonomía a nivel comunitario en toda la República de Corea. Aunque el movimiento no tiene líderes y, por tanto, carece de un mensaje central y claro, la mayoría de sus miembros parecen desear la abolición del Estado coreano y de los chaebols a los que está vinculado, en favor de un sistema que distribuya el poder político y económico entre representantes de nivel comunitario elegidos directamente.\n\nEsta nueva ideología, que rechaza las ideologías fundacionales tanto de la República de Corea como de la RPDC, representa un alejamiento significativo de la política tradicional de la izquierda radical surcoreana, que o bien ha promovido políticas de izquierda dentro del sistema político existente en Corea del Sur, o bien ha pedido el establecimiento de un Estado al estilo norcoreano."
 korea.8.a: "Algo está sucediendo en la República de Corea..."
 korea.9.t: "Rebeldes del Sur solicitan nuestro apoyo"
 korea.9.d: "Representantes del Movimiento de Liberación Nacional de Corea que buscan derrocar al gobierno en el Sur han venido a nosotros solicitando una alianza para abrir un nuevo frente a lo largo de la DMZ."
 korea.9.a: "¡Nos uniremos a su lucha!"
 korea.9.b: "Lo veremos desde el margen."
 JUCHE_FACTION: "Frente Antiimperialista Coreano"
 korea.10.t: "Corea del Sur pide que pongamos fin a nuestra protección del Norte"
 korea.10.d: "Desde hace bastante tiempo, Corea del Sur se ha esforzado por demostrar que ya no es un país supeditado a los intereses de los Estados Unidos. Las relaciones entre nuestros dos países se encuentran en su punto más alto, mientras que nuestras relaciones con el Norte se han estancado en su mayor parte. Ahora, una delegación surcoreana ha venido a solicitar el fin del tratado de defensa entre nosotros y los norcoreanos. Si accedemos a su petición, ya no acudiremos en ayuda de Corea del Norte en caso de una invasión externa."
 korea.10.a: "¡Apoyaremos a nuestros aliados!"
 korea.10.b: "El Norte no merece nuestra protección."
 korea.11.t: "Empresas armamentísticas coreanas ofrecen productos"
 korea.11.d: "La República de Corea es conocida por su capacidad para producir armamento de alta calidad a precios relativamente asequibles. Deberíamos considerar la posibilidad de comprar parte de su equipo, pero nuestros fondos no son ilimitados, por lo que debemos elegir sabiamente."
 korea.11.a: "Compra tanques coreanos."
 korea.11.b: "Compra artillería autopropulsada coreana."
 korea.11.c: "Comprar aviones coreanos de entrenamiento."
 korea.11.e: "Compra rifles de asalto coreanos."
 korea.11.f: "Rechazar oferta."
 korea.12.t: "[FROM.GetName] ¡Acepta el acuerdo de armas!"
 korea.12.d: "Los representantes de este país han acordado importarnos armas, aumentando así nuestros ingresos y nuestra influencia internacional."
 korea.12.a: "¡Nuestra posición internacional crece!"
 korea.13.t: "Beijing y Seúl critican conjuntamente las acciones japonesas durante la Segunda Guerra Mundial."
 korea.13.d: "En una acción poco habitual, los gobiernos de China y la República de Corea han emitido una declaración conjunta en la que critican las acciones de Japón en tiempos de guerra y su posterior negativa a expiar plenamente sus pecados. Muchos observadores han interpretado esta acción como parte de los esfuerzos de Seúl por alejar a China de su apoyo a Corea del Norte. Si bien Pyongyang ha expresado su apoyo a la condena conjunta de [KOR.GetLeader] y [CHI.GetLeader], [NKO.GetLeader] al parecer está preocupado por las señales de que China está favoreciendo cada vez más a Seúl."
 korea.13.a: "Nunca olvidaremos lo que hicieron."
 korea.13.b: "Sus críticas son agotadoras..."
 korea.13.c: "El pasado proyecta una larga sombra..."
 korea.14.t: "China anula tratado de defensa con Corea del Norte"
 korea.14.d: "Tras la retirada de la presencia militar estadounidense de Corea del Sur, China ha accedido a retirarse de su tratado de defensa con Corea del Norte, lo que ha provocado una furiosa condena por parte de Pyongyang. La medida sigue a una larga serie de maniobras de Seúl para ganarse el apoyo de China y demostrar su autonomía respecto de Washington. Algunos han planteado la hipótesis de que ahora que el camino está despejado para una reunificación forzosa, [KOR.GetLeader] ha decidido retomar el control del Norte por la fuerza."
 korea.14.a: "Nuestros esfuerzos han dado sus frutos."
 korea.14.b: "Hemos tolerado a Pyongyang durante demasiado tiempo."
 korea.14.c: "¿Hay guerra en el horizonte?"
 korea.15.t: "[KOR.GetLeader] Exige reparaciones japonesas"
 korea.15.d: "Tras semanas de retórica antagónica por parte de Seúl y de presiones de activistas coreanos, [KOR.GetLeader] ha pedido a Japón que pague reparaciones a los supervivientes de los crímenes de guerra japoneses cometidos durante la Segunda Guerra Mundial. Japón, que sostiene que el asunto se resolvió entre su gobierno y el de Corea del Sur durante el gobierno del hombre fuerte autoritario Park Chung-hee, se ha negado, como era previsible, a considerar el pago de reparaciones.\n\nAunque el asunto no ha dado lugar a una compensación para las víctimas coreanas, ha reforzado la posición política de [KOR.GetLeader], y muchos coreanos se han unido en torno a esta causa nacional sumamente emotiva."
 korea.15.a: "Un día tendremos justicia."
 korea.15.b: "¡Sus demandas son absurdas!"
 korea.15.c: "¿Se podrá resolver su desacuerdo?"
 korea.16.t: "¡Guerra!"
 korea.16.d: "Ha estallado una guerra entre nosotros y el Norte. Según nuestro acuerdo con los Estados Unidos, ahora debemos entregar el control operativo de nuestras fuerzas armadas al ejército estadounidense."
 korea.16.a: "Debemos transferir el control."
 korea.17.t: "La guerra ha terminado"
 korea.17.d: "La paz ha regresado a la península de Corea. Ahora que hemos regresado a las condiciones de tiempos de paz, podemos reafirmar el control sobre nuestras fuerzas armadas."
 korea.17.a: "Paz al fin."
 korea.18.t: "Las elecciones a la Asamblea Nacional se avecinan mientras los partidos comienzan a hacer campaña"
 korea.18.d: "Con las elecciones a la Asamblea Nacional acercándose dentro de aproximadamente un mes, deberíamos comenzar a aumentar la popularidad de nuestro partido para facilitar una mayoría en la legislatura durante los próximos cuatro años."
 korea.18.a: "¡Esperemos una mayoría!"
 korea.21.t: "¡Los resultados ya están!"
 korea.21.a: "Como siempre, fueron unas elecciones muy reñidas."
 korea.21.d_no: "Lamentablemente, ninguno de los dos partidos principales logró obtener la mayoría en la Asamblea Nacional. Nuestro gobierno tendrá que luchar más para ganarse el apoyo de legisladores de otros partidos y poder aprobar leyes controvertidas."
 korea.21.d_con_loss: "Lamentablemente, nuestro partido no ha logrado obtener una mayoría en la Asamblea Nacional. Los legisladores liberales se negarán a aprobar cualquier legislación que limite a los sindicatos, apoye a las grandes empresas o promueva el antagonismo hacia Corea del Norte."
 korea.21.d_lib_loss: "Lamentablemente, nuestro partido no ha logrado obtener una mayoría en la Asamblea Nacional. Los legisladores conservadores se negarán a aprobar cualquier legislación que limite a las grandes empresas, reforme el servicio militar obligatorio y la inteligencia o promueva la reconciliación con Corea del Norte."
 korea.21.d_con_win: "Afortunadamente, nuestro partido ha logrado obtener la mayoría en la Asamblea Nacional. La legislatura y el ejecutivo podrán trabajar de la mano para facilitar objetivos conservadores como limitar los sindicatos, apoyar a los chaebols y mantenerse duro con Corea del Norte."
 korea.21.d_lib_win: "Afortunadamente, nuestro partido ha logrado obtener la mayoría en la Asamblea Nacional. El legislativo y el ejecutivo podrán trabajar de la mano para facilitar objetivos liberales como debilitar a los chaebols, reformar el aparato de seguridad y buscar la reunificación con el Norte."
 korea.22.t: "Los shocks de la reunificación comienzan a afianzarse"
 korea.22.d: "La gran nación de Corea se ha reunificado finalmente, tras muchas décadas de dolorosa separación. Sin embargo, nuestra tarea de reintegrar las dos mitades está lejos de terminar. Muchos a ambos lados del paralelo 38 están descontentos con la forma en que se llevó a cabo la reunificación, y los costes económicos de reunificar dos Estados sumamente diferentes se están haciendo evidentes con rapidez. Si fracasamos en nuestra tarea de reunificar el país, podríamos enfrentarnos a la disolución de nuestra recién nacida nación."
 korea.22.a: "Ahora comienza la parte difícil..."
 korea.23.t: "Nuestra respuesta a la oferta de paz del Sur"
 korea.23.d: "Después de semanas de discusiones, ha llegado el momento de que decidamos si estamos dispuestos a aceptar la oferta de paz del Sur. Debemos considerar si confiamos en la sinceridad de la oferta del Sur, pero también cómo percibirán un acuerdo de paz nuestros partidarios internos que todavía esperan reunificar el país por la fuerza algún día."
 korea.23.a: "Aceptaremos un tratado."
 korea.23.b: "¡Nunca habrá paz entre nosotros!"
 korea.24.t: "Se firma el acuerdo de paz de Corea"
 korea.24.d: "Tras una mejora en las relaciones entre las dos Coreas, [KOR.GetLeader] del Sur y [NKO.GetLeader] del Norte acordaron reemplazar el frágil Acuerdo de Armisticio con un acuerdo de paz formal. Este tratado ha puesto finalmente fin al estado de hostilidades que ha existido entre las dos Coreas desde la Guerra de Corea. Ambos líderes han expresado esperanzas de que este acontecimiento coloque a la península en el camino hacia la reunificación, aunque algunos observadores han expresado dudas sobre la voluntad de ambas partes de proseguir la reunificación."
 korea.24.a: "¡Un futuro brillante se encuentra ante la península!"
 korea.25.t: "Fracasan las conversaciones intercoreanas"
 korea.25.d: "Las conversaciones en Panmunjom entre [KOR.GetLeader] del Sur y [NKO.GetLeader] del Norte han fracasado debido a varios desacuerdos entre las dos partes. Si bien el hecho de que hubo algunos puntos de acuerdo ha llevado a algunos a esperar un retorno a las conversaciones en el futuro, está claro que un acuerdo entre las dos Coreas no llegará hasta dentro de bastante tiempo."
 korea.25.a: "La paz sigue siendo difícil de alcanzar..."
 korea.26.t: "Corea del Sur propone la reunificación"
 korea.26.d: "Buscando capitalizar una mejora sin precedentes en las relaciones entre las dos Coreas, el Sur se ofrece a cooperar con nosotros para reunificar nuestra nación dividida. Sin embargo, insisten en que el proceso de reunificación será liderado por el Sur, una demanda que amenaza la cultura política única que hemos desarrollado en el Norte."
 korea.26.d1: "Buscando capitalizar una mejora sin precedentes en las relaciones entre las dos Coreas, el Sur se ofrece a cooperar con nosotros para reunificar nuestra nación dividida. El Sur, comprendiendo nuestras preocupaciones sobre la reunificación, ha ofrecido compartir el poder después de la reunificación a través de un gobierno de unidad, incorporando elementos tanto del Norte como del Sur."
 korea.26.a: "¡Nuestro país volverá a estar completo!"
 korea.26.b: "La reunificación nunca podrá tener lugar en estos términos..."
 korea.27.t: "¡El Norte ha aceptado nuestros términos para la reunificación!"
 korea.27.d: "¡Después de extensas negociaciones, el Norte acordó comenzar a trabajar para la reunificación de nuestros dos países! Con las relaciones entre las dos Coreas estabilizadas y la reintegración de la península en el horizonte, ¡el futuro del pueblo coreano nunca ha parecido más brillante!"
 korea.27.a: "¡Fantásticas noticias!"
 korea.28.t: "¡El Norte ha rechazado nuestros términos para la reunificación!"
 korea.28.d: "Lamentablemente, [NKO.GetLeader] ha optado por anteponer su propia postura egoísta a la del pueblo coreano y ha rechazado nuestra oferta de cooperación para reunificar el país. Este rechazo no significa que no podamos hacer otro intento en el futuro, pero sí significa que la reunificación no se producirá a corto plazo. Debemos sentar las bases para garantizar que nuestro próximo intento tenga un mayor éxito."
 korea.28.a: "Un día triste para el pueblo coreano..."
 korea.29.t: "China solicita la devolución de los restos de los voluntarios"
 korea.29.d: "Pekín nos ha pedido formalmente que devolvamos los restos del personal del Ejército de Voluntarios del Pueblo Chino recuperados en Corea del Sur. Aprobar la solicitud permitiría que los soldados caídos fueran repatriados a China."
 korea.29.a: "Aprobar el traslado."
 korea.29.b: "Rechazar la solicitud."
 korea.30.t: "Devueltos a China los primeros restos de los voluntarios"
 korea.30.d: "Corea del Sur ha transferido la primera recopilación de restos del Ejército de Voluntarios del Pueblo Chino recuperados en las provincias de Gangwon y Gyeonggi. Representantes chinos y coreanos firmaron los documentos de entrega en el Aeropuerto Internacional de Incheon antes de que una aeronave militar china transportara los restos de vuelta a su patria."
 korea.30.a: "Honrar a los caídos."
 korea.31.t: "Séptima transferencia de restos de los voluntarios"
 korea.31.d: "Corea del Sur ha entregado 117 conjuntos de restos recuperados en Arrow Hill, en la Zona Desmilitarizada. Funcionarios chinos y surcoreanos asistieron a la ceremonia de transferencia en el Aeropuerto Internacional de Incheon."
 korea.31.a: "Honrar a los caídos."
 korea.33.t: "Nuestra respuesta a la oferta de paz del Norte"
 korea.33.d: "Después de semanas de discusiones, ha llegado el momento de que decidamos si estamos dispuestos a aceptar la oferta de paz del Norte. Debemos considerar si confiamos en la sinceridad de la oferta del Norte, pero también cómo percibirán un acuerdo de paz aquellos de nuestro pueblo que siguen oponiéndose a negociar con el régimen norcoreano."
 korea.34.t: "Corea del Norte propone la reunificación"
 korea.34.d: "Buscando capitalizar una mejora sin precedentes en las relaciones entre las dos Coreas, el Norte se ofrece a cooperar con nosotros para reunificar nuestra nación dividida. Sin embargo, insisten en que el proceso de reunificación esté liderado por el Norte, una exigencia que amenaza el estilo de vida que hemos cultivado en el Sur."
 korea.34.d1: "Buscando capitalizar una mejora sin precedentes en las relaciones entre las dos Coreas, el Norte se ofrece a cooperar con nosotros para reunificar nuestra nación dividida. El Norte, comprendiendo nuestras preocupaciones sobre la reunificación, ha ofrecido compartir el poder después de la reunificación a través de un gobierno de unidad, incorporando elementos tanto del Sur como del Norte."
 korea.35.t: "¡El Sur ha aceptado nuestros términos para la reunificación!"
 korea.35.d: "¡Después de extensas negociaciones, el Sur acordó comenzar a trabajar para la reunificación de nuestros dos países! Con las relaciones entre las dos Coreas estabilizadas y la reintegración de la península en el horizonte, ¡el futuro del pueblo coreano nunca ha parecido más brillante!"
 korea.36.t: "¡El Sur ha rechazado nuestros términos para la reunificación!"
 korea.36.d: "Lamentablemente, [KOR.GetLeader] ha optado por anteponer su propia postura egoísta a la del pueblo coreano y ha rechazado nuestra oferta de cooperación para reunificar el país. Este rechazo no significa que no podamos hacer otro intento en el futuro, pero sí significa que la reunificación no se producirá a corto plazo. Debemos sentar las bases para garantizar que nuestro próximo intento tenga un mayor éxito."
 korea.38.t: "Rusia nos está animando a iniciar reformas económicas"
 korea.38.d: "Corea nos ha hecho hoy una solicitud formal para la retirada de nuestras tropas de Japón y Corea."
 korea.38.a: "¡Ahora no es el momento para reformas!"
 korea.38.b: "Iniciar reformas menores."
 recognition.1.t: "[FROM.GetName] reconoce al Estado escindido"
 recognition.1.d: "[FROM.GetNameDef] ha extendido el reconocimiento diplomático formal al Estado escindido en nuestro territorio. La decisión es un revés para nuestra reclamación sobre la región."
 recognition.1.a: "No seremos divididos."
 recognition.3.t: "[FROM.GetName] retira el reconocimiento"
 recognition.3.d: "[FROM.GetNameDef] ha revertido su reconocimiento previo de nuestra soberanía. Sea cual sea el motivo, el resultado es el mismo."
 recognition.3.a: "La lucha continúa."
 recognition.4.t: "[FROM.GetName] retira el reconocimiento al Estado escindido"
 recognition.4.d: "[FROM.GetNameDef] ha revertido su reconocimiento previo del Estado escindido en nuestro territorio. Una capital menos respalda su reclamación de soberanía."
 recognition.4.a: "Una pequeña victoria para nuestra postura."
 recognition.7.t: "¡[FROM.GetName] se une a las Naciones Unidas!"
 recognition.7.d: "Tras una campaña sostenida en busca de reconocimiento internacional, [FROM.GetNameDef] ha sido admitido en la Asamblea General de las Naciones Unidas como Estado miembro."
 recognition.7.a: "Bienvenidos a la Asamblea General."
 recognition.8.t: "[FROM.GetName] nos presiona para reconocer a [pressured_to_recognize]"
 recognition.8.d: "[FROM.GetNameDef] está aprovechando su influencia sobre nosotros para forzar el reconocimiento de [pressured_to_recognize]. Rechazar a un socio con tanta influencia conlleva un coste real."
 recognition.8.a: "Extendemos el reconocimiento."
 recognition.8.b: "Nos negamos a reconocer a este régimen."
 internal_faction.1.t: "¡El Ejército está solicitando un aumento en el presupuesto!"
 internal_faction.1.d: "El ejército ha solicitado un aumento del presupuesto de defensa [ROOT.GetAdjective], alegando nuevas amenazas a nuestra seguridad nacional. Conceder esta petición aumentará la presión sobre nuestro presupuesto, pero denegarla reducirá la opinión que los militares tienen de nuestro gobierno."
 internal_faction.1.a: "Deberíamos darles el dinero."
 internal_faction.1.b: "No podemos permitirnos este gasto."
 internal_faction.2.t: "¡Algunos cuadros del Partido Comunista están involucrados en actividades corruptas!"
 internal_faction.2.d: "Nuestros servicios de inteligencia han descubierto recientemente que algunos funcionarios del Partido Comunista están aceptando sobornos y participando en actos de nepotismo. Por un lado, no debemos permitir que tales actividades queden impunes si deseamos mantener nuestra legitimidad ante los ojos del pueblo, pero, por otro, una acción de ese tipo sin duda alejará a muchos aliados importantes dentro del Partido Comunista."
 internal_faction.2.a: "Deberíamos hacer la vista gorda."
 internal_faction.2.b: "¡Debemos darles un ejemplo!"
 internal_faction.3.t: "¡Los conglomerados industriales están solicitando exenciones fiscales!"
 internal_faction.3.d: "Los jefes de algunos de los mayores conglomerados industriales de [ROOT.GetName] están presionando en privado a nuestro gobierno para que les conceda más exenciones fiscales. La concesión de estas exenciones fiscales mejorará la opinión que los conglomerados industriales tienen de nuestro gobierno, pero reducirá nuestros ingresos fiscales a nivel nacional."
 internal_faction.3.a: "Deberíamos otorgar las exenciones fiscales."
 internal_faction.3.b: "No podemos permitirnos hacer tal concesión."
 isis.1.t: "¡Victoria sobre el Estado Islámico!"
 isis.1.d: "Ahora que el Estado Islámico ha sido derrotado, nuestro país ya no se verá plagado por la propaganda extremista producida por el Estado Islámico. Ahora podemos concentrarnos en difundir nuestras ideas en nuestro país y no permitir nunca más que los extremistas tomen el control."
 isis.1.a: "Excelente"
 isis.2.t: "¿Infiltrarse en Tahrir al-Sham?"
 isis.2.d: "Oh Califa de todos los musulmanes, [Root.GetLeader]. Debemos atacar el corazón de nuestro vil enemigo, Tahrir al-Sham, que se niega a reconocer tu gobierno justo y legítimo. Si bien se han desviado del camino del verdadero Islam y la gloriosa Yihad, tienen muchos buenos combatientes yihadistas en sus filas. ¡Inshallah, deberíamos infiltrarnos en ellos e intentar hacer que la mayor cantidad posible de personas se unan a nuestro glorioso Califato!"
 isis.2.a: "¡Intentemos influir en los verdaderos combatientes y alejarlos de esta falsa organización yihadista!"
 isis.2.b: "No, no podemos permitirnos posibles conflictos internos."
 isis.2.a_tt: "§HLa infiltración ha fallado§! (Sin efecto)"
 isis.3.t: "Los combatientes desertan hacia Daesh"
 isis.3.d: "¡[Root.GetLeader]! El autodenominado Estado «Islámico» se ha infiltrado entre nosotros y ha conseguido persuadir a algunos de nuestros mejores combatientes para que se unan a su ridículo remedo de califato. No deberíamos dejar esto sin respuesta; deberíamos contratacar y derrotar a estos jariyíes que hacen takfir a diestro y siniestro mientras usan el Sagrado Corán como papel higiénico."
 isis.3.a: "¡Nosotros, los yihadistas justos y rectos, los masacraremos como perros!"
 isis.3.b: "No, no podemos permitirnos otro frente en esta guerra."
 isis.4.t: "Unidades de Tahrir al-Sham desertan"
 isis.4.d: "Oh, Califa, muchos hermanos muwahhid justos y valientes han desertado de la malvada Tahrir al-Sham y se han unido a nuestra causa."
 isis.4.a: "¡Takbir! ¡Takbir del Estado Islámico!"
 isis.4.a_tt: "Añade 2 §Hbrigadas de Jabhat al-Nusra§! en §HRaqqa§!."
 isis.5.t: "Señal de debilidad de Tahrir al-Sham"
 isis.5.d: "Oh Califa, el repugnante Frente Tahrir al-Sham es más débil de lo que pensábamos y no hace nada contra nuestra infiltración en él y las recientes deserciones. El Consejo de Guerra de la Shura recomienda que matemos sus restos podridos como perros y tomemos su territorio, ¡añadiéndolo a nuestro glorioso Califato!"
 isis.5.a: "¡Enseñémosles a estos falsos yihadistas quién es el verdadero sucesor del Sheik Osama!"
 isis.5.b: "Llegará su momento, pero por ahora debemos esperar."
 isis.6.t: "Los restos de Tahrir al-Sham se unen a nuestro califato"
 isis.6.d: "Oh Califa, el dulce jugo de la victoria está en nuestros labios. Cerca de la derrota, los restos de Tahrir al-Sham te han jurado lealtad a ti, [Root.GetLeader], y a nuestro califato en constante crecimiento."
 isis.6.a: "¡Damos la bienvenida a nuestros hermanos al verdadero Califato!"
 isisNews.1.t: "Tahrir al-Sham se une a ISIS"
 isisNews.1.d: "Bajo la creciente presión sobre los islamistas sirios de Tahrir al-Sham, sus fuerzas restantes han jurado lealtad a ISIS en un último intento desesperado de imponer su ideología fundamentalista en Siria."
 isisNews.1.a: "¡Dios nos ayude a todos!"
 isis.7.t: "Oculto"
 isis.7.d: "Oculto"
 isis.7.a: "Oculto"
 isis.1301.t: "Abu Fatima martirizado en un ataque aéreo de la coalición"
 isis.1301.d: "¡Malas noticias, califa! Tu buen amigo y también diputado iraquí, Abu Fatima al-Jaheishi, ha sido martirizado con valentía en un cobarde ataque aéreo por parte de los estadounidenses.\n\n                                               Mató a muchos apóstatas.\n\n                                         Que Alá acepte su martirio."
 isis.1301.a: "¡Vengaremos su muerte cuando conquistemos Washington DC!"
 isisNews.1301.t: "Comandante de ISIS muerto en un ataque aéreo de la coalición"
 isisNews.1301.d: "El terrorista iraquí y alto comandante del ISIS, Abu Fatima al-Jaheishi, murió hoy en un ataque aéreo de la coalición estadounidense. Abu Fatima formaba parte del círculo íntimo de al-Baghdadi y se desempeñaba como líder adjunto de las partes de Irak controladas por el ISIS."
 isisNews.1301.a: "¡Buena noticia!"
 isis.1302.t: "al-Sulami martirizado en un ataque aéreo de la coalición"
 isis.1302.d: "¡Malas noticias, califa! El clérigo principal Abu Sufyan al-Sulami ha sido martirizado en un cobarde ataque aéreo por parte de los estadounidenses. Llegó a nosotros desde la tierra de Baréin y nos otorgó un respaldo religioso clave para nuestro califato.\n\n               Oh califa, nos inspiró a todos con su hermosa biografía sobre ti.\n\n                                         Que Alá acepte su martirio."
 isisNews.1302.t: "Jefe Clerical de ISIS muerto en un ataque aéreo de la coalición"
 isisNews.1302.d: "El terrorista bahreiní y alto líder religioso de ISIS Turki al-Binali, conocido por su nombre de guerra «Abu Sufyan al-Sulami», murió hoy en un ataque aéreo de la coalición liderada por EE. UU. Al-Binali no era importante para el esfuerzo militar de ISIS, pero fue clave para proporcionar respaldo religioso al grupo y escribió la primera biografía de Abu Bakr al-Baghdadi."
 isis.1303.t: "Comandante martirizado en un ataque aéreo de la coalición"
 isis.1303.d: "¡Malas noticias, califa! El emir de nuestros combatientes albaneses y kosovares y alto comandante Lavdrim Muhaxheri ha sido martirizado en un cobarde ataque aéreo por parte de los perros estadounidenses.\n\n                                                Mató a muchos apóstatas.\n\n                                         Que Alá acepte su martirio."
 isisNews.1303.t: "Comandante de ISIS muerto en un ataque aéreo de la coalición"
 isisNews.1303.d: "El terrorista albanokosovar y alto comandante del ISIS, Lavdrim Muhaxheri, murió hoy en un ataque aéreo de la coalición estadounidense. Muhaxheri luchó en Afganistán del lado de la OTAN, pero se radicalizó alrededor de 2012 y viajó a Siria. En 2013 se unió al ISIS y rápidamente se convirtió en \"emir\" de los combatientes albaneses y kosovares en Siria e Irak. Era un matón brutal que decapitaba personalmente a los prisioneros."
 isis.1304.t: "Comandante martirizado en un ataque aéreo de la coalición"
 isis.1304.d: "¡Oh califa, terribles noticias! Nuestro comandante militar de élite Gulmurod Khalimov ha sido martirizado en un cobarde ataque aéreo por parte de los perros estadounidenses. Antes de encontrar su camino hacia nosotros desde las tierras de los tayikos, era un oficial de fuerzas especiales de alto rango. Echaremos de menos profundamente sus conocimientos militares.\n\n                                                Mató a muchos apóstatas.\n\n                                         Que Alá acepte su martirio."
 isisNews.1304.t: "Comandante de ISIS muerto en un ataque aéreo de la coalición"
 isisNews.1304.d: "El terrorista tayiko y alto comandante del ISIS Gulmurod Khalimov murió hoy en un ataque aéreo de la coalición estadounidense. Khalimov era un oficial de fuerzas especiales experimentado y de alto rango en las Fuerzas Armadas de Tayikistán antes de desertar y unirse al ISIS."
 isis.1305.t: "Comandante martirizado en un ataque aéreo de la coalición"
 isis.1305.d: "¡Oh califa, terribles noticias! Nuestro jefe de operaciones de martirio y entrenador clave de muyahidines extranjeros, Abdullah Ahmed al-Mashadani, ha sido martirizado en un ataque aéreo por parte de los perros estadounidenses.\n\n                                                Mató a muchos apóstatas.\n\n                                         Que Alá acepte su martirio."
 isisNews.1305.t: "Comandante de ISIS muerto en un ataque aéreo de la coalición"
 isisNews.1305.d: "El terrorista iraquí y comandante senior de ISIS, Abdullah Ahmed al-Mashadani, fue asesinado hoy en un ataque aéreo de la coalición liderada por Estados Unidos. al-Mashadani fue clave para el esfuerzo de guerra de ISIS al liderar las operaciones de atentados suicidas y entrenar a los yihadistas extranjeros."
 isis.1306.t: "Comandante martirizado en un ataque aéreo de la coalición"
 isis.1306.d: "¡Oh califa, malas noticias! Nuestro gobernador de la región del Éufrates Central, Ahmed Khalal al-Juhayshi, ha sido martirizado en un ataque aéreo por parte de los perros estadounidenses.\n\n                                                Mató a muchos apóstatas.\n\n                                         Que Alá acepte su martirio."
 isisNews.1306.t: "Comandante de ISIS muerto en un ataque aéreo de la coalición"
 isisNews.1306.d: "El terrorista iraquí y alto miembro de ISIS, Ahmed Khalal al-Juhayshi, murió hoy en un ataque aéreo de la coalición liderada por EE. UU. Al-Juhayshi no era un comandante militar destacado, sino un administrador y gobernador de la región clave del Éufrates Central para el Estado Islámico."
 isis.1307.t: "Comandante martirizado en un ataque aéreo de la coalición"
 isis.1307.d: "¡Oh califa, malas noticias! Tu buen amigo y jefe de logística y suministros, Fares Reif al-Naima, ha sido martirizado en un ataque aéreo por parte de los perros estadounidenses. Fue un valiente y leal muyahidín de larga trayectoria que luchó contra los infieles y apóstatas desde 2003.\n\n                                 Mató a muchos por la gloria del califato.\n\n                                         Que Alá acepte su martirio."
 isisNews.1307.t: "Comandante de ISIS muerto en un ataque aéreo de la coalición"
 isisNews.1307.d: "El terrorista iraquí y alto comandante del ISIS, Fares Reif al-Naima, murió hoy en un ataque aéreo de la coalición estadounidense. al-Naima luchó contra las fuerzas estadounidenses en la guerra de Irak, y después de haber sido detenido por las fuerzas estadounidenses en Camp Bucca junto con al-Baghdadi, saltó a la fama como Jefe de Logística y Suministros del Estado Islámico."
 isis.1308.t: "Comandante martirizado en un ataque aéreo de la coalición"
 isis.1308.d: "¡Oh califa, malas noticias! Abu Ahmad al-Alwani ha sido martirizado en un ataque aéreo por parte de los infieles estadounidenses. Fue oficial en el ejército iraquí de Sadam Huseín y nos ayudó mucho con sus conocimientos una vez que se unió a la insurgencia suní y a nuestro amado Estado Islámico.\n\n                                                Mató a muchos apóstatas.\n\n                                         Que Alá acepte su martirio."
 isisNews.1308.t: "Comandante de ISIS muerto en un ataque aéreo de la coalición"
 isisNews.1308.d: "El terrorista iraquí y alto comandante del ISIS, Abu Ahmad al-Alwani, murió hoy en un ataque aéreo de la coalición estadounidense. Al-Alwani era un oficial del ejército iraquí de Saddam Hussein antes de unirse a la insurgencia sunita contra las fuerzas estadounidenses. Rápidamente ascendió en las filas del Estado Islámico de Irak y el Levante hasta alcanzar el puesto de alto comandante."
 isis.1309.t: "Comandante martirizado en un ataque aéreo de la coalición"
 isis.1309.d: "¡Oh califa, malas noticias! Abu Muhammad al-Shimali ha sido martirizado en un ataque aéreo por parte de los infieles estadounidenses. Llegó a nosotros desde las tierras de Arabia y nos ayudó a contrabandear nuestro petróleo y a comprar nuestras armas. Reclutó a muchos valientes muyahidines para nuestro califato y será eternamente elogiado por su papel clave en la organización de los atentados de París de 2015.\n\n                                                Mató a muchos apóstatas.\n\n                                         Que Alá acepte su martirio."
 isisNews.1309.t: "Comandante de ISIS muerto en un ataque aéreo de la coalición"
 isisNews.1309.d: "El terrorista saudí y alto comandante de ISIS, Abu Muhammad al-Shimali, murió hoy en un ataque aéreo de la coalición liderada por EE. UU. Al-Shimali era un reclutador y contrabandista clave para el Estado Islámico. Además, los informes de inteligencia sugieren que fue fundamental para ayudar en los atentados de París de 2015."
 isis.1310.t: "Comandante martirizado en un ataque aéreo de la coalición"
 isis.1310.d: "¡Oh, Califa, desastre! Nuestro ministro de guerra y segundo al mando, Ayad al-Jumaili, ha sido valientemente martirizado en un despreciable ataque aéreo perpetrado por los perros infieles estadounidenses. Compatriota iraquí, fue un oficial de inteligencia de alto rango bajo Saddam Hussein y aplicó su sabiduría para mantener el Califato a salvo de enemigos internos como jefe de inteligencia y seguridad interna.\n\n                                                Mató a muchos traidores.\n\n                                              Que Alá acepte su martirio."
 isisNews.1310.t: "Segundo al mando de ISIS muerto en un ataque aéreo de la coalición"
 isisNews.1310.d: "El terrorista iraquí y segundo al mando del Estado Islámico, Ayad al-Jumaili, murió hoy en un ataque aéreo de la coalición estadounidense. Al-Jumaili era un alto oficial de inteligencia bajo Saddam Hussein que se unió a la insurgencia sunita después de la ocupación estadounidense en 2003. Se convirtió en jefe de inteligencia y seguridad interna en el Estado Islámico, y más tarde fue ascendido a segundo al mando y ministro de Guerra."
 isis.1311.t: "Comandante martirizado en un ataque aéreo de la coalición"
 isis.1311.d: "¡Oh, Califa, malas noticias! El comandante senior Khairy Abed Mahmoud al-Taey ha sido martirizado en un ataque aéreo perpetrado por los infieles estadounidenses. Compatriota iraquí, fue miembro de nuestro consejo militar y lideró operaciones con dispositivos explosivos improvisados (IED), sembrando justamente el miedo y el caos en los corazones de nuestros enemigos.\n\n                                               Mató a muchos apóstatas.\n\n                                              Que Alá acepte su martirio."
 isisNews.1311.t: "Comandante de ISIS muerto en un ataque aéreo de la coalición"
 isisNews.1311.d: "El terrorista iraquí y alto comandante del ISIS, Khairy Abed Mahmoud al-Taey, murió hoy en un ataque aéreo de la coalición estadounidense. Al-Taey era parte del consejo militar del ISIS y jefe de las operaciones de dispositivos explosivos improvisados ​​(IED), sembrando el caos en las ciudades que el ISIS atacó."
 isis.1312.t: "Comandante martirizado en un ataque aéreo de la coalición"
 isis.1312.d: "¡Oh, Califa, malas noticias! Tu amigo, consejero y comandante senior, Abdul Wahid Khutnayer Ahmad, ha sido martirizado valientemente en un ataque aéreo perpetrado por los infieles estadounidenses. Compatriota iraquí, estaba a cargo de la seguridad interna.\n\n                                       Desenmascaró a muchos traidores y apóstatas.\n\n                                                  Que Alá acepte su martirio."
 isisNews.1312.t: "Comandante de ISIS muerto en un ataque aéreo de la coalición"
 isisNews.1312.d: "El terrorista iraquí y alto comandante del ISIS, Abdul Wahid Khutnayer Ahmad, murió hoy en un ataque aéreo de la coalición estadounidense. Khutnayer Ahmad era un asesor clave de Al Baghdadi y estaba a cargo de la seguridad interna."
 isis.1313.t: "Comandante martirizado en un ataque aéreo de la coalición"
 isis.1313.d: "¡Oh, Califa, noticias horribles! Nuestro comandante senior, Abu Jihad Shishani, ha sido martirizado en un ataque aéreo perpetrado por los perros infieles estadounidenses. Vino a nosotros desde las tierras de los chechenos y luchó valientemente por la gloria de Alá hasta el final.\n\n                                               Mató a muchos apóstatas.\n\n                                              Que Alá acepte su martirio."
 isisNews.1313.t: "Comandante de ISIS muerto en un ataque aéreo de la coalición"
 isisNews.1313.d: "El terrorista checheno y alto comandante de ISIS, Abu Jihad Shishani, murió hoy en un ataque aéreo de la coalición liderada por EE. UU. Shishani, de ciudadanía rusa, era el segundo al mando del grupo terrorista Emirato del Cáucaso bajo el liderazgo de Umar Shishani. Después de que Umar viajara a Siria y se uniera a ISIS, Abu Jihad intentó hacerse con el control del Emirato del Cáucaso para jurar lealtad a ISIS, pero terminó viajando también a Siria para luchar por ISIS como alto comandante."
 isis.11301.t: "Abu Fatima martirizado en un ataque aéreo ruso"
 isis.11301.d: "¡Malas noticias, califa! Tu buen amigo y también diputado iraquí, Abu Fatima al-Jaheishi, ha sido martirizado con valentía en un cobarde ataque aéreo por parte de los rusos.\n\n                                               Mató a muchos apóstatas.\n\n                                         Que Alá acepte su martirio."
 isis.11301.a: "¡Vengaremos su muerte cuando conquistemos Moscú!"
 isisNews.11301.t: "Comandante de ISIS muerto en ataque aéreo ruso"
