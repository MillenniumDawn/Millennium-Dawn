 PHI_islamism_dynamic_modifier: "Montée de l’islamisme radical"
 PHI_islamism_dynamic_modifier_tooltip: "L'islamisme fait partie des Philippines depuis des siècles. Récemment cela a commencé à changer et le sud du pays a connu une radicalisation extrême."
 PHI_npa_insurgency_dynamic_modifier: "Guerre populaire prolongée"
 PHI_npa_insurgency_dynamic_modifier_tooltip: "Le Parti communiste des Philippines mène une guerre de guérilla rurale par son Armée populaire nouvelle depuis 1969. Ses cadres taxent les villages, tendent des embuscades aux patrouilles et contestent le gouvernement local à travers Luçon, Samar et l'est de Mindanao."
 PHI_milf_decisions_category: "Le conflit moro"
 PHI_milf_decisions_category_desc: "Le conflit moro désigne une série de conflits armés dans la province de Mindanao. Il a commencé par la politique de repeuplement appliquée sous le Commonwealth des Philippines en 1935. Il a explosé lorsque onze stagiaires militaires musulmans ont été assassinés à Corregidor. Le Front islamique de libération moro s'est formé peu après en 1969 et est depuis en conflit ouvert avec les forces gouvernementales.\n £generic_anarchist_communism_small §RForce du MILF :§! [?PHI.PHI_strength_of_milf|20] %"
 PHI_anti_muslim_propaganda: "Propagande anti-musulmane"
 PHI_anti_muslim_propaganda_desc: "Orienter les médias d'État et le message public pour contrer l'influence des groupes insurgés islamiques radicaux opérant à Mindanao."
 PHI_crush_the_moro_insurgency: "Écraser l'insurrection moro"
 PHI_crush_the_moro_insurgency_desc: "Le Front islamique de libération moro réduit à des restes dispersés, les forces armées peuvent déclarer la campagne de Mindanao close. Le commandement des provinces du sud revient au gouvernement civil, et l'insurrection s'achève par les armes plutôt que par la négociation."
 PHI_sign_the_bangsamoro_agreement: "Signer l'accord bangsamoro"
 PHI_sign_the_bangsamoro_agreement_desc: "Des pourparlers sous médiation malaisienne à Kuala Lumpur ont amené le Front à la table. Un accord global démobiliserait ses combattants, remplacerait la région autonome en Mindanao musulmane par une entité bangsamoro dotée de vrais pouvoirs fiscaux et législatifs, et engagerait Manille à financer la transition."
 PHI_communist_insurgency_category: "Rébellion de la nouvelle armée populaire"
 PHI_communist_insurgency_category_desc: "La rébellion de l'Armée populaire nouvelle est la plus ancienne insurrection communiste du monde. La NPA combat sans relâche depuis 1969 contre le gouvernement national philippin.\n\nIl est temps de déployer des efforts pour écraser cette rébellion.\n £generic_Communist_State_small §RForce de la NPA :§! [?PHI.PHI_strength_of_npa|20] %"
 PHI_sustained_military_offensive: "Offensive militaire soutenue"
 PHI_sustained_military_offensive_desc: "Engager des unités de l'armée et de la constabulary à nettoyer les fronts de guérilla dans la Sierra Madre, Samar et l'arrière-pays de Davao. Les ratissages dégradent l'Armée populaire nouvelle plus vite que toute autre méthode, mais des opérations prolongées à la campagne coûtent au gouvernement le soutien de la population rurale."
 PHI_peace_and_development_teams: "Équipes de paix et de développement"
 PHI_peace_and_development_teams_desc: "Déployer des équipes civilo-militaires mixtes dans les barangays sous influence de la guérilla, associant construction de routes et d'écoles au travail de gouvernance locale. Priver l'insurrection de sa base de recrutement est plus lent qu'un ratissage, et nettement plus coûteux, mais cela ne coûte aucune stabilité."
 PHI_amnesty_for_returning_cadres: "Amnistie pour les cadres de retour"
 PHI_amnesty_for_returning_cadres_desc: "Offrir immunité légale, aide en espèces et soutien aux moyens d'existence aux combattants qui rendent les armes. Les défections de masse vident les fronts de guérilla, bien que pardonner des insurgés coûte au gouvernement son crédit auprès du corps des officiers et des victimes de la rébellion."
 PHI_defeat_the_new_peoples_army: "Vaincre l'Armée populaire nouvelle"
 PHI_defeat_the_new_peoples_army_desc: "Les fronts de guérilla ont été brisés et le Comité central est dispersé à l'étranger. Déclarer la rébellion militairement vaincue clôt la plus longue insurrection communiste du monde."
 PHI_conclude_the_oslo_talks: "Conclure les pourparlers d'Oslo"
 PHI_conclude_the_oslo_talks_desc: "Des médiateurs norvégiens ont maintenu un canal ouvert vers le Front démocratique national depuis des années. Un règlement final échangerait amnistie politique et engagements de réforme agraire contre la démobilisation permanente de l'Armée populaire nouvelle."
 PHI_anti_dynasty_law: "Loi anti-dynastie"
 PHI_anti_dynasty_law_desc: "L'article II, section 26 de la Constitution de 1987 interdit les dynasties politiques, mais le Congrès n'a jamais voté la législation d'application, et les familles qui dominent la législature n'ont aucune raison de le faire. Forcer un projet de loi interdirait aux parents des élus de leur succéder, brisant l'emprise des clans provinciaux sur la politique nationale et ouvrant la direction de chaque parti à des candidats hors des grandes familles."
 PHI_corruption_battle_mechanic_category: "La bataille contre la corruption"
 PHI_corruption_battle_mechanic_category_desc: "Des décennies de politique de clientèle, d'institutions faibles et d'intérêts enracinés ont laissé la corruption profondément enchâssée à presque tous les niveaux du gouvernement. L'extirper exigera des enquêtes soutenues et ciblées à travers la bureaucratie, l'armée et le secteur privé. À mesure que les réformes prennent et que les institutions se renforcent, les enquêtes futures deviendront plus faciles et plus efficaces.\n\nNiveau de corruption actuel :  [Root.GetPHI_corruption_tier_number]\nForce de corruption actuelle : [?PHI_corruption_strength|Y0]"
 PHI_change_the_strength_of_corruption_tt: "§YForce de la corruption§! change de [?temp_change|0+] (Actuel : [?PHI.PHI_corruption_strength|Y0])\n"
 PHI_corp_nothing_tt: "§R75%§! : Rien ne se passe / échec bureaucratique.\nAucun progrès contre la corruption."
