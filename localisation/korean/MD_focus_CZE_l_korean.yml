 CZE_petr_pavel_planning_expert_loc_four: "§Y+5%§! §G최대 계획§!\n§Y+11%§! §G계획 속도§!\n§Y+2§! §G계획 능력§!"
 CZE_petr_pavel_training_info_text_text: "§Y훈련 부문§!은 전장에서 페트르 파벨의 능력을 높이기 위한 것입니다. 각 §Y훈련 카드§!는 서로 다른 강화 효과를 지니며, 획득한 경험이 늘어날수록 계속 강해집니다. §Y훈련 카드§!의 경험은 해당 유형의 능력에 경험을 주는 중점/임무가 진행 중이거나 완료되었을 때에만 증가합니다. 활성화되어 있을 때 §Y훈련 카드§!는 전체 §Y훈련 레벨§!도 올려 주지만 그 속도는 더 느립니다."
 CZE_petr_pavel_training_info_two_text_text: "페트르 파벨에게는 §Y노화 시스템§!이 적용됩니다. 즉, 매달 §Y훈련 부문§!의 경험치가 줄어듭니다. 페트르 파벨을 꾸준히 훈련시키고 임무/정치 작전을 완료하여 이에 대응할 수 있습니다."
