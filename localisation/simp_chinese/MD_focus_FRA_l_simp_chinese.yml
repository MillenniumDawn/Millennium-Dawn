 FRA_corporate_systems_events.17.d: "Five European states have approved a common microelectronics project spanning energy-efficient chips, power semiconductors, sensors, optical systems, and advanced materials. STMicroelectronics can anchor France in the program or pursue a more national path."
 FRA_corporate_systems_events.17.t: "European Microelectronics IPCEI"
 FRA_corporate_systems_events.20.a: "Acquire Orange and internationalize"
