 UKR_crimean_bop_inspect_fleet_stage_1_desc: "§WInitiate inspections of the [SOV.GetFlag] §Y[SOV.GetAdjective]§! military presence in §Y[1112.GetName]§! and reaffirm the host state's legal authority.§!\n\n§YSponsor:§! [UKR.GetFlag] §Y[UKR.GetName]§!\n§YCost:§! §R$180 million§! and §R65 Political Power§!\n§YDuration:§! 120 days\n§YExpected change (maximum):§! §G+5 influence points§! influence: [UKR.GetFlag] §Y[UKR.GetName]§!; §R−5 influence points§! influence: [SOV.GetFlag] §Y[SOV.GetName]§!.\n\n§LStages are shared between countries. Each subsequent stage requires the previous stage and costs more. Influence transfers may be reduced by the 65% cap and political settlements. Treasury costs are charged when the program is started.§!"
