 raj_chi_border_crisis.2.a:0 "Ceder o estado disputado"
 raj_chi_border_crisis.2.b:0 "Rejeitar a exigência"
 raj_chi_border_crisis.3.t:0 "Exigência de Retirada Rejeitada"
 raj_chi_border_crisis.3.d:0 "O rival se recusa a restaurar o estado disputado. Podemos criar um objetivo de guerra limitado para esse estado ou recuar."
 raj_chi_border_crisis.3.a:0 "Preparar uma resposta limitada"
 raj_chi_border_crisis.3.b:0 "Recuar"
 raj_chi_border_crisis.4.t:0 "O Estado Disputado É Cedido"
 raj_chi_border_crisis.4.d:0 "O rival aceitou nossa exigência e cedeu o estado disputado, encerrando o confronto sem uma guerra maior."
 raj_chi_border_crisis.4.a:0 "Restaurar a fronteira"
 raj_chi_border_crisis.5.t:0 "A Reivindicação Caducou"
 raj_chi_border_crisis.5.d:0 "O controle do estado disputado mudou antes que o confronto pudesse ser resolvido. A exigência não é mais válida."
 raj_chi_border_crisis.5.a:0 "Encerrar o assunto"
