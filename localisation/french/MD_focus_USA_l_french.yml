 USA_crisis_event.1125.t: "Rassemblement des syndicats miniers"
 USA_crisis_event.1125.d: "Alors que la situation se dégrade au-delà de toute compréhension, les mineurs syndiqués se rassemblent autour de la Virginie-Occidentale. Voyant l'État comme une position défensive clé, la plupart de ces ouvriers espèrent faire pression pour imposer un programme syndical favorable ou obtenir l'indépendance de l'ancien État de la Perle noire."
 USA_crisis_event.1125.o1: "Bon Dieu, pourquoi maintenant"
 USA_crisis_event.1126.t: "Mobiliser les défenses"
 USA_crisis_event.1126.d: "Le gouvernement fédéral cherche à museler et à opprimer tous ceux qui le voient pour la farce qu'il est. Nous tiendrons bon contre la tyrannie et pour l'homme au travail."
 USA_crisis_event.1126.o1: "Travailleurs du Rassemblement !"
 USA_crisis_event.1127.t: "La troisième Peur rouge"
 USA_crisis_event.1127.d: "L'heure est venue : il faut écraser cette racaille communiste si nous voulons assurer un avenir démocratique à la nation en ces temps troublés."
 USA_crisis_event.1127.o1: "Plutôt mort que rouge"
 USA_crisis_event.1128.t: "Le soleil brille trop fort"
 USA_crisis_event.1128.d: "Dans un bouleversement troublant de l'unité régionale, la Floride a déclaré son indépendance. Nous en sommes fort attristés, mais l'objectif commun — la destruction du gouvernement fédéral — est ce qui compte, et c'est vers cela que nous nous unirons pour l'heure."
 USA_crisis_event.1128.o1: "Adieu la famille du Sud"
 USA_crisis_event.1129.t: "Création de la garde d'État"
 USA_crisis_event.1129.d: "Les troubles nationaux récents nous ont conduits à recréer la garde d'État et à en faire une force d'autodéfense. Nous espérons garantir notre indépendance face à l'oppression fédérale et souhaitons bonne chance à tous ceux qui partagent notre cause."
 USA_crisis_event.1129.o1: "Aux armes !"
 USA_crisis_event.1130.t: "La Grande Rébellion"
 USA_crisis_event.1130.d: "Voilà maintenant une rébellion dans la rébellion. Ce chaos finira-t-il un jour ?"
 USA_crisis_event.1130.o1: "En marche vers Miami !"
 USA_crisis_event.1131.t: "Homme de la montagne fou"
 USA_crisis_event.1131.d: "Alors que tout continue de déraper, l'Idaho, voyant l'État tampon lakota comme un moyen d'assurer son isolement, a déclaré son indépendance. Le chef de la rébellion a déclaré, je cite : « Notre État n'est que celui des Rocheuses, nous n'avons que faire de vos villes tape-à-l'œil et de vos idéologies divisives. » Les autorités fédérales cherchent à réagir au plus vite à ce nouveau défi à leur autorité dans la crise en cours."
 USA_crisis_event.1131.o1: "Combien y en a-t-il encore ?"
 USA_crisis_event.1132.t: "Montagnes habitées"
 USA_crisis_event.1132.d: "Le gouvernement fédéral cherchant à étendre son emprise toxique sur tous ceux qui résistent à ses pièges oligarchiques, nous devons nous défendre, ainsi que nos frères et sœurs d'armes qui ne demandent qu'à être laissés tranquilles."
 USA_crisis_event.1132.o1: "Tenir bon et tenir fort"
 USA_crisis_event.1133.t: "Encore un autre problème de montagne"
 USA_crisis_event.1133.d: "Nous nous en occuperons le moment venu, mais il faut encore déclarer nos intentions évidentes."
 USA_crisis_event.1133.o1: "Mon Dieu, plus de montagnes, je vous en prie"
 USA_crisis_event.1134.t: "Rêve californien"
 USA_crisis_event.1134.d: "On dirait que tout le pays rêve pendant que nous vivons un cauchemar. Le gouverneur de Californie a formellement déclaré une sécession jusqu'à ce que le gouvernement fédéral des soi-disant « États-Unis » soit réglé ou qu'un cessez-le-feu soit conclu. La Californie négociera alors une réintégration ou une indépendance pure et simple."
 USA_crisis_event.1134.o1: "Oh, comme ils sont bienveillants..."
 USA_crisis_event.1135.t: "Appeler la Garde"
 USA_crisis_event.1135.d: "Nous nous attendons, comme ceux avant nous, à être promptement et injustement fusillés contre un mur. Cet aboutissement violent étant assuré, il faut mobiliser les défenses et garantir la sécurité de notre peuple face à la tyrannie de l'Est."
 USA_crisis_event.1135.o1: "Que Dieu bénisse la République de l'Ours"
 USA_crisis_event.1136.t: "L'avance vers l'Ouest"
 USA_crisis_event.1136.d: "D'un océan à l'autre, nous serons de nouveau une nation entière."
 USA_crisis_event.1136.o1: "En avant !"
 USA_crisis_event.1137.t: "Grands Lacs, grands problèmes"
 USA_crisis_event.1137.d: "Comme si dix-neuf États déjà confirmés en rébellion active ne suffisaient pas, il semble que près de la moitié du pays, sinon davantage, soit en armes contre le gâchis fédéral récent. Il faut que cela s'arrête là."
 USA_crisis_event.1137.o1: "La peine de mort : peut-être qu'on en a besoin"
 USA_crisis_event.1138.t: "La porte du Nord"
 USA_crisis_event.1138.d: "La nation est en ruines ; nous ne pouvons que faire ce que tout État respectable doit faire : protéger son peuple. Mobiliser les masses et tenir bon avec nos États sœurs."
 USA_crisis_event.1138.o1: "Défendre la démocratie elle-même !"
 USA_crisis_event.1139.t: "Notre propre Piste des larmes"
 USA_crisis_event.1139.d: "Pour sécuriser toute la nation, il faut traiter tous les États à problème avec le même traitement égal que les origines de cette catastrophe."
 USA_crisis_event.1139.o1: "Mon Dieu, que cela se termine déjà"
 USA_crisis_event.1140.t: "Loi de conscription d'urgence"
 USA_crisis_event.1140.d: "Vu l'état des choses, une conscription de masse analogue à la draft a été imposée. Les éléments loyaux de la Garde nationale ainsi que des civils et des volontaires ont été fondus en de nouveaux régiments de la Garde nationale."
 USA_crisis_event.1140.o1: "Dieu nous sauve tous"
 USA_venezuela_decision_TT: "Importance stratégique de cette action :\n - §H[VEN.GetFlag] le Venezuela§! est depuis longtemps une épine dans le pied de la diplomatie sud-américaine. Leur nature agressive et anti-occidentale nous oblige à marcher sur des œufs lors de nos discussions avec nos partenaires dans la région.\n - En renversant le régime §H[VEN.GetFlag] vénézuélien§!, nous pourrions instaurer une force amie dans la région et ouvrir une nouvelle ère en Amérique du Sud."
 USA_focus_2004_economic_deregulation_desc: "Pour poursuivre l’expansion, nous devons déréglementer davantage l’économie. Nous pouvons y parvenir en nous attaquant aux lois « fondamentales » qui sont pleines de freins à la croissance des entreprises et/ou à la création de nouvelles entreprises."
 USA_focus_2004_investments_desc: "Des investissements gouvernementaux limités dans des entreprises clés propulseront le PIB de notre pays et créeront davantage d’emplois grâce à la « stimulation » vers les secteurs économiques ciblés."
 USA_focus_2008_healthcare_desc: "Nous devons regarder vers nos homologues britanniques et voir que l’assurance maladie pour tous peut être pour tous. Nous devons donc faire des compromis avec l’opposition si nous voulons faire passer une politique aussi « dangereuse »."
 USA_focus_2008_environment_deregulation_desc: "Il faut déréglementer ces lourdes réglementations « vertes » afin de mieux inciter le futur entrepreneur à vouloir démarrer une nouvelle entreprise."
 USA_focus_were_not_them_desc: "L’opposition se lance dans une propagande agressive, la plupart de ses « affirmations » sont clairement fausses, nous devons faire de notre mieux pour lutter contre ces mensonges."
 USA_focus_we_arent_like_them_desc: "L’opposition se lance dans une propagande agressive, la plupart de ses « affirmations » sont clairement fausses, nous devons faire de notre mieux pour lutter contre ces mensonges."
 USA_focus_strengthing_naval_training_efforts_desc: "En augmentant les normes et les exigences ainsi qu'en améliorant globalement la manière et le contenu de la formation de notre personnel naval, nous établirons un nouveau précédent sur la façon dont le marin moyen réagit aux conditions du champ de bataille et aux situations de gestion de crise pour créer une force plus forte et plus compétente."
 USA_focus_sierra_leone_peacekeepers: "« Casques bleus » de la Sierra Leone"
 USA_focus_sierra_leone_peacekeepers_desc: "La nation est convenablement équipée mais ne fait pas de réels progrès, nous pouvons envoyer des « casques bleus » comme si nous étions rattachés à l’ONU et aider à motiver la guerre dans une direction plus positive."
 USA_focus_joint_police_action: "« Action policière » conjointe"
 USA_focus_joint_police_action_desc: "L'action policière qu'a été la guerre civile en Sierra Leone est prometteuse pour une nouvelle forme de politique étrangère. Nous devons chercher à affiner et à redéfinir le terme « action policière », de peur que beaucoup ne se laissent aller à des sentiments similaires à ceux de la guerre du Vietnam."
 USA_focus_foreign_aid_desc: "La communauté internationale est lasse de notre silence plus ou moins franc face à la crise au Moyen-Orient. Essayons de calmer ce sentiment en apportant une « aide étrangère » à ceux qui se battent pour la « juste » cause."
 USA_focus_everyone_has_their_price_desc: "La guerre dure depuis un certain temps déjà, et la dernière chose dont nous avons besoin est de repartir les mains vides. Nous pouvons faire pression sur un ou plusieurs groupes pour qu'ils parviennent à un compromis ou à un avantage mutuel s'ils affirment que leur faction remporte la guerre."
 USA_taxing_smarter_desc: "Défendre un système fiscal progressiste, réduisant les disparités de revenus et promouvant l’équité économique."
 USA_american_anarchist_society_collectivizes_victory_desc: "Dans une série d'événements surprenants et presque déconcertants, la Société anarchiste s'est frayé un chemin jusqu'à la direction. À force de vendre ses idées et de décrocher des voix aux élections internes, assez de membres de la Société anarchiste ont fait basculer la balance pour s'assurer la majorité à la tête du parti. Désormais tout le monde regarde, presque ébahi, pour attendre ce qu'un « gouvernement anarchiste » fera réellement."
 USA_cosmetic_tag_fascist_completed_desc: "§YÉtats-Unis d'Amérique§! changent de nom pour §YUnion nationale des États américains§!"
 USA_cosmetic_tag_military_junta_completed_desc: "§YÉtats-Unis d'Amérique§! changent de nom pour §YMilitaires unis de la Terre§!"
 USA_cosmetic_tag_monarchist_desc: "Proclame l'§YEmpire [USA.GetAdjective]§! et change le nom du pays en conséquence."
 USA_cosmetic_tag_red_junta_desc: "Forme le §YCommissariat révolutionnaire§! et change le nom du pays en conséquence."
 USA_fascist_closing_borders_desc: "§RFerme les frontières§! de [USA.GetName]."
 USA_free_american_territories_desc: "Établit les §YTerritoires libres d'Amérique§! et change le nom du pays en conséquence."
