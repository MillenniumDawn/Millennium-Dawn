 RULE_OPTION_REFORMED_REPUBLIC: "改革后的共和"
 RULE_OPTION_REFORMED_REPUBLIC_AI_DESC: "人民的意愿已经得到倾听。政治压力和公众的强烈抗议导致了关键的政治和经济改革，以使第三党能够更好地代表和发声。现在该由人民选出一个能够代表他们的政党了。"
 RULE_OPTION_POST_UNITED: "后合众国时代"
