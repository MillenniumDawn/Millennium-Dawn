 nsb_engine_tech_5_desc: "회전익 항공기에 필요한 추력과 양력을 제공하도록 설계된 특수 동력 장치입니다."
 nsb_gun_technology_1: "1세대 중화기 및 포병 체계"
 nsb_gun_technology_1_desc: "전장의 화력을 강화하도록 설계된 강력한 포병 및 로켓 체계입니다. 이 발전으로 대형 곡사포, 대규모 로켓 무기, 파괴력을 높이는 특수 포병 탄약이 도입됩니다. 또한 로켓 포드의 배치를 가능하게 하여 항공 플랫폼에 향상된 타격 잠재력을 제공합니다. 이 체계들은 뛰어난 장거리 지원을 제공하므로 전장을 지배하는 데 필수적입니다."
 nsb_gun_technology_2: "2세대 중화기 및 포병 체계"
