 NKO_trade_agreements_with_vietnam: "Accords commerciaux avec le Vietnam"
 NKO_trade_agreements_with_vietnam_desc: "Former des accords commerciaux avec [VIE.GetName] renforcera la coopération économique. Nous négocierons des termes favorables pour assurer des échanges mutuellement bénéfiques et renforcer nos relations bilatérales."
