 TAI_pc_global_component_commonwealth: "Global Component Commonwealth"
 TAI_pc_global_component_commonwealth_desc: "Taiwan's board, graphics, and specialist-hardware firms form a dense export commonwealth. Deep engineering and efficient production sustain global influence even without commanding the largest complete-system brands."
 TAI_pc_branded_systems_powerhouse: "Branded Systems Powerhouse"
 TAI_pc_branded_systems_powerhouse_desc: "Taiwanese firms retain more of the value in the computers they design, market, and support. Recognizable brands and broad product portfolios turn component expertise into durable international reach."
 TAI_pc_full_spectrum_computing_ecosystem: "Full-Spectrum Computing Ecosystem"
 TAI_pc_full_spectrum_computing_ecosystem_desc: "A rare alignment of component depth, independent processor capability, specialized systems, and global brands gives Taiwan meaningful leverage across the personal-computing stack."
 TAI_pc_fragmented_margin_squeeze: "Fragmented Margin Squeeze"
 TAI_pc_fragmented_margin_squeeze_desc: "Taiwan remains indispensable to the PC industry, but its firms compete across overlapping niches while relying on external processor platforms. Strong production volumes cannot fully escape thin margins and brutal price competition."
 TAI_pc_industry_events.1.t: "Acer Divides Brand from Factory"
 TAI_pc_industry_events.1.d: "Acer enters the millennium with a global name, an extensive production network, and persistent conflict between manufacturing for other firms and competing against them. Its restructuring can make the brand the center of the group, preserve vertical integration, or balance both models through a looser network."
 TAI_pc_industry_events.1.a: "Put the global brand first"
 TAI_pc_industry_events.1.a_tt: "Global Brand Reach: §G+2§!\nSystems Breadth: §G+1§!."
