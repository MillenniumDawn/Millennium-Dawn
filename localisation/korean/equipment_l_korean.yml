 cnc_equipment_8: "C6I 장비"
 cnc_equipment_8_desc: "지휘통제 장비는 지휘부가 임무와 과제를 완수하기 위해 배속된 부대에 대한 권한을 행사하고 지휘를 수행할 수 있도록 지원하는 시스템입니다. 효율적인 지휘통제는 조직의 체계성과 사기를 높여줍니다. C6I(지휘, 통제, 통신, 컴퓨터, 협업, 정보, 상호운용성, 감시, 표적 획득 및 정찰)는 8세대 C2 장비입니다."
