 LBA_khamis_brigade_idea_version: "Brygada Chamisa"
 LBA_war_industrialist_idea_version: "Przemysłowiec wojenny"
 LBA_captain_of_industry_idea_version: "Kapitan Przemysłu"
 libya_tribalism_loyal_dynamic_modifier: "Lojalne plemiona"
 libya_tribalism_neutral_dynamic_modifier: "Neutralne Plemiona"
 libya_tribalism_bad_dynamic_modifier: "Nielojalne plemiona"
 LBA_general_peoples_congress: "Generalny Kongres Ludowy"
 LBA_general_peoples_congress_desc: "The administration in Libya is divided into multiple tiers of People's Congresses. This is intended to democratise and decentralise decision making and allow for a bottom up method. However, the People's Congresses work in parallel with the Jamahiriya Revolutionary Committees that advise and educate the Congresses and people on revolutionary ideas. In practice the Revolutionary Committees prevent any deviating political opinion from rising up, and it is estimated that almost 15% of Libyan citizens work as informants for the Revolutionary Committees.\n\n§YThis national spirit will be removed if we are Salafist.§!"
 LBA_empowered_peoples_congress: "Kongres Uprawnionych Ludów"
 LBA_empowered_peoples_congress_desc: "The People's Congresses have become the dominant political decision maker after the Revolutionary Committees were abolished. Libya now follows true bottom-up democracy.\n\n§RThis national spirit will be removed if we are Salafist.§!"
 LBA_empowered_revolutionary_committees: "Uprawnione komitety rewolucyjne"
 LBA_empowered_revolutionary_committees_desc: "The Revolutionary Committees of Libya have taken full control over the political process of the country. While previously ensuring the People's Congresses didn't stray too far away ideologically, all decision making now essentially falls under the control of the Revolutionary Committees.\n\n§YThis national spirit will be removed if we are Salafist.§!"
 LBA_undeveloped_agriculture: "Nierozwinięte rolnictwo"
 LBA_undeveloped_agriculture_desc: "Libya is a very arid country with only 2% of the land area being arable. Existing Islamic inheritance laws and Gaddafi's policies have left whatever farms there are as very small land holders. Only a small percentage of Libya's food needs are produced domestically and the great majority of food must be imported. This makes us very dependent on other countries. The largest exporters of food to Libya are §Y[BRA.GetNameWithFlag], [ITA.GetNameWithFlag], [EGY.GetNameWithFlag], [SWI.GetNameWithFlag], [SIA.GetNameWithFlag] and [UAE.GetNameWithFlag]§! and our ability to import food from them depends on their ability to export it.\n\n§YThis national spirit will be removed if one of the following countries is our subject or we own their capital: [SAF.GetNameWithFlag], [CDI.GetNameWithFlag], [MOR.GetNameWithFlag], [EGY.GetNameWithFlag] or [TNZ.GetNameWithFlag].§!"
 LBA_undeveloped_agriculture_tt: "§RNie mogę mieć §YThe Farmers§! jako §YWewnętrzna Frakcja§!§!"
 LBA_agricultural_reform: "Reforma rolna"
 LBA_agricultural_reform_desc: "The agricultural sector in Libya has been reformed. Private land occupation is now freer and Islamic inheritance law no longer splinters farms. With added fresh water sources from desalination and the GMMR, Libya has developed its agriculture to its maximum limit, considering their situation.\n\n§YThis national spirit will be removed if one of the following countries is our subject or we own their capital: [SAF.GetNameWithFlag], [CDI.GetNameWithFlag], [MOR.GetNameWithFlag], [EGY.GetNameWithFlag] or [TNZ.GetNameWithFlag].§!"
 LBA_agricultural_imports: "Import produktów rolnych"
 LBA_agricultural_imports_desc: "Libya has increased the amount of food imported to the country greatly. Since Libya has very little arable land, the government has built relations and supply chains for food imports rather than wasting time and money trying to fight a lost battle.\n\n§YThis national spirit will be removed if one of the following countries is our subject or we own their capital: [SAF.GetNameWithFlag], [CDI.GetNameWithFlag], [MOR.GetNameWithFlag], [EGY.GetNameWithFlag] or [TNZ.GetNameWithFlag].§!"
 LBA_great_man_made_river_phase2: "Wielka sztuczna rzeka – faza II"
 LBA_great_man_made_river_phase2_desc: "The Great Man-Made River (GMMR) is a network of water pipes bringing fresh water from the Nubian Sandstone Aquifer in the South of Libya to the coast. It is the largest underground network of water pipes in the whole world, and Muammar Gaddafi has dubbed it the 'Eighth Wonder of the World'. Currently, it feeds the cities of Tripoli, Sirte and Benghazi, and the water it provides is free to all Libyans. There have been plans to expand the network, but development has stalled since the 90s."
 LBA_great_man_made_river_phase3: "Wielka sztuczna rzeka – Faza III"
 LBA_great_man_made_river_phase3_desc: "The Great Man-Made River (GMMR) is a network of water pipes bringing fresh water from the Nubian Sandstone Aquifer in the South of Libya to the coast. It is the largest underground network of water pipes in the whole world, and Muammar Gaddafi has dubbed it the 'Eighth Wonder of the World'. Currently, it feeds the cities of Tripoli, Sirte and Benghazi, and the water it provides is free to all Libyans. The network has also been connected to the desert city of Al-Jawf, and further expansion is planned."
 LBA_great_man_made_river_phase41: "Wielka rzeka stworzona przez człowieka – Faza IV"
 LBA_great_man_made_river_phase41_desc: "The Great Man-Made River (GMMR) is a network of water pipes bringing fresh water from the Nubian Sandstone Aquifer in the South of Libya to the coast. It is the largest underground network of water pipes in the whole world, and Muammar Gaddafi has dubbed it the 'Eighth Wonder of the World'. Currently, it feeds the cities of Tripoli, Sirte and Benghazi, and the water it provides is free to all Libyans. The network has also been connected to the desert city of Al-Jawf, to Tobruk in the East and to Ghadames on the border with Algeria, and further expansion is planned."
 LBA_great_man_made_river_phase5: "Wielka sztuczna rzeka – Faza V"
 LBA_great_man_made_river_phase5_desc: "The Great Man-Made River (GMMR) is a network of water pipes bringing fresh water from the Nubian Sandstone Aquifer in the South of Libya to the coast. It is the largest underground network of water pipes in the whole world, and Muammar Gaddafi has dubbed it the 'Eighth Wonder of the World'. Currently, it feeds the cities of Tripoli, Sirte and Benghazi, and the water it provides is free to all Libyans. The network has also been connected to the desert city of Al-Jawf, to Tobruk in the East and to Ghadames on the border with Algeria. The pipe networks in West and East of the country have been connected to each other, and the GMMR has officially been finished."
 LBA_revolutionary_guard_corps: "Korpus Strażników Rewolucji"
 LBA_revolutionary_guard_corps_desc: "The Revolutionary Guard Corps is a special branch of the Libyan military made up of members of tribes loyal to Gaddafi. The intention of the Guard Corps is to act as a counterbalance to the regular army. The Guard Corps even controls most of the weapons stockpiles, only handing out supplies to the regular army when needed.\n\n§YThis national spirit will be removed if we are not ruled by the Gaddafi Family.§!"
 LBA_armed_forces_of_arab_jamahiriya: "Siły Zbrojne Libijskiej Arabskiej Dżamahiriji"
 LBA_armed_forces_of_arab_jamahiriya_desc: "Libijskie Siły Zbrojne, oficjalnie Siły Zbrojne Libijskiej Arabskiej Dżamahiriji, zastąpiły Korpus Strażników Rewolucji w roli głównej organizacji obronnej reżimu."
 LBA_stream_of_refugees: "Strumień Uchodźców"
 LBA_stream_of_refugees_desc: "Libya is one of the main human-trafficking routes from Africa into Europe. Poverty in Central Africa, Islamist insurgency in the Sahel and the conflict in Sudan drive people en-masse to cross the Libyan desert in the hopes of sailing into Europe.  Many of them however, will get stuck in Libya, or even worse, end up in the bottom of the Mediterranean.\n\n§YThis national spirit will be removed if ALL of the following are true:\n - [NGR.GetNameWithFlag] is our puppet or we own $STATE_329$ and $STATE_1108$\n - [CHA.GetNameWithFlag] is our puppet or we own $STATE_580$ and $STATE_327$\n - [DAR.GetNameWithFlag] or [SUD.GetNameWithFlag] is our puppet or we own $STATE_614$§!"
 LBA_family_centric: "Koncentryczny na Rodzinie"
 LBA_family_centric_desc: "Zachęcamy rodziny jako główny budulec społeczeństwa."
 LBA_nation_centric: "Narodowocentryczny"
 LBA_nation_centric_desc: "Wspieramy naród jako główny budulec społeczeństwa."
 LBA_religion_in_schools: "Edukacja religijna"
 LBA_religion_in_schools_desc: "Nasz system edukacji ściśle uwzględnia religię w programie nauczania."
 LBA_nationalism_in_schools: "Edukacja nacjonalistyczna"
 LBA_nationalism_in_schools_desc: "Nasz system edukacji ściśle uwzględnia nacjonalizm w programie nauczania."
 LBA_grand_mufti_appointed: "Wielki Mufti Libii"
 LBA_grand_mufti_appointed_desc: "Wyznaczono wielkiego muftiego, który ma interpretować prawo islamskie w Libii."
 LBA_mujahideen_of_libya_idea: "Mudżahedini z Libii"
 LBA_mujahideen_of_libya_idea_desc: "Libyan Mujahideen veterans from Afghanistan have reached a significant power status in Libya.\n\n§YThis national spirit will be removed if we are not Salafist§!"
 LBA_tanasoh_tv_idea: "Telewizja Tanasuh"
 LBA_tanasoh_tv_idea_desc: "A national TV network has been setup to spread the messages of the Grand Mufti.\n\n§YThis national spirit will be removed if we are not Salafist§!"
 LBA_supreme_revolutionaries_council_idea: "Najwyższa Rada Rewolucjonistów"
 LBA_supreme_revolutionaries_council_idea_desc: "An advisory council to the Grand Mufti.\n\n§YThis national spirit will be removed if we are not Salafist§!"
 LBA_immigration_target: "Kampania imigracyjna"
 libya_baathism_dynamic_modifier: "Libijski Baasizm"
 libya_baathism_dynamic_modifier_desc: "The Libyan regime is using a Ba'athist undercover network to its advantage.\n\n§YThis national spirit will be removed if the Libyan National Movement isn't part of the ruling coalition.§!"
 LBA_mauritanian_military_infiltrated: "Infiltrował mauretańskie wojsko"
 LBA_mauritanian_military_infiltrated_desc: "Z pomocą zwolenników partii Baas Libia przeniknęła do mauretańskiej armii."
 LBA_new_green_book: "Nowa zielona księga"
 LBA_new_green_book_desc: "Muammar Gaddafi has revised his Green Book into a new version. The book is being distributed to all citizens and taught in all schools to make sure people follow the correct ideas. The release of the book will have a lasting impact on Libyan society."
 LBA_grassroots_democracy_idea: "Demokracja oddolna"
 LBA_grassroots_democracy_idea_desc: "The Libyan people have been given opportunity to engage in the democratic process from the bottom up.\n\n§YThis national spirit will be removed if we don't have elections.§!"
 LBA_royal_family_returned: "Powrót rodu Senussi"
 LBA_royal_family_returned_desc: "Krewnym obalonego króla Idrisa I pozwolono wrócić do Libii po dziesięcioleciach wygnania."
 LBA_royal_family_returned_2: "Uwłaszczony Senussi"
 LBA_royal_family_returned_2_desc: "Krewnym obalonego króla Idrisa I pozwolono wrócić do Libii po dziesięcioleciach wygnania. Otrzymują teraz roczny zasiłek od rządu libijskiego na prowadzenie domu królewskiego."
 LBA_confiscated_royal_wealth: "Skonfiskowany majątek królewski"
 LBA_confiscated_royal_wealth_desc: "Money has been confiscated from the Libyan royal family to fund the Libyan state.\n\n§YThis national spirit will be removed if the House of Senussi is part of the ruling coalition.§!"
 LBA_strong_president: "Republika Prezydencka"
 LBA_strong_president_desc: "Libya has adopted a French style presidential republic as its form of government.\n\n§YThis national spirit will be removed if the House of Senussi is in power or we are Salafist.§!"
 LBA_unitary_presidential_republic: "Jednolita Republika Prezydencka"
 LBA_unitary_presidential_republic_desc: "Libya has been reformed into a unitary presidential republic, following the French model of governance.\n\n§YThis national spirit will be removed if the House of Senussi is in power or we are Salafist.§!"
 LBA_constitutional_monarchy: "Monarchia konstytucyjna"
 LBA_constitutional_monarchy_desc: "Libya has been reformed into a constitutional monarchy, where most of the powers lie with an elected legislature.\n\n§YThis national spirit will be removed if we don't have elections or we are Salafist.§!"
 LBA_unitary_constitutional_monarchy: "Jednolita monarchia konstytucyjna"
 LBA_unitary_constitutional_monarchy_desc: "Libya has been reformed into a unitary constitutional monarchy, where most of the powers lie with an elected legislature.\n\n§YThis national spirit will be removed if we don't have elections or we are Salafist.§!"
 LBA_minorities_granted_rights: "Federalna Republika Prezydencka"
 LBA_minorities_granted_rights_desc: "The minorities of Libya have been granted limited autonomy under the current government while still being ruled as a presidential republic.\n\n§YThis national spirit will be removed if the House of Senussi is in power or we are Salafist.§!"
 LBA_minorities_protected: "Chronione Mniejszości"
 LBA_minorities_protected_desc: "The Libyan government has promised that ethnic minorities will be respected and they will be able to retain their cultural heritage.\n\n§YThis national spirit will be removed if we are Nationalist or Salafist.§!"
 LBA_senussi_order: "Wskrzeszony Zakon Senussiego"
 LBA_senussi_order_desc: "The religious Senussi Order has been revived in Libya. Preaching a middle path between mystical Sufism and extremist Sunni Islam, one of the key tenets of the Order is that everyone should work for their food and not rely on charity.\n\n§YThis national spirit will be removed if we are Salafist.§!"
 LBA_anti_air_improvements: "Fokus przeciwlotniczy"
 LBA_anti_air_improvements_desc: "Libia koncentruje swoje wojskowe prace badawczo-rozwojowe na poprawie swoich zdolności w zakresie obrony powietrznej."
 LBA_improved_fighter_response: "Ulepszona reakcja myśliwca"
 LBA_improved_fighter_response_desc: "The Libyan Air Force is devoting a large portion of its training time on practicing the response and take-off time of its fighter force."
 LBA_guerrilla_toyotas: "Wojna Toyoty – wojna partyzancka"
 LBA_guerrilla_toyotas_desc: "Libijskie wojsko przeanalizowało swoje doświadczenia z wojny czadyjsko-libijskiej (znanej również jako wojna w Toyocie) i wyciągnęło wnioski z tej lekcji. Teraz zwrócą większą uwagę na taktykę wojskową zastosowaną przez Czada, który dzięki swojej mobilnej technice z łatwością ominął libijską obronę, atakując ich od tyłu."
 LBA_mobile_toyotas: "Wojna Toyoty - Mobilność"
 LBA_mobile_toyotas_desc: "Libijskie wojsko przeanalizowało swoje doświadczenia z wojny czadyjsko-libijskiej (znanej również jako wojna w Toyocie) i wyciągnęło wnioski z tej lekcji. Teraz zwrócą większą uwagę na taktykę wojskową zastosowaną przez Czada, który dzięki swojej mobilnej technice z łatwością wymanewrował libijskie formacje, umocnienia, a nawet pola minowe."
 LBA_desert_warfare_idea: "Mistrzowie wojny pustynnej"
 LBA_desert_warfare_idea_desc: "Libijska armia udoskonaliła sztukę walki na pustyni i upale."
 LBA_egypt_war_specops: "Specjalizacja komandos"
 LBA_egypt_war_specops_desc: "Po przeanalizowaniu przeszłych konfliktów armia libijska przekształciła się w siłę bardziej zorientowaną na komandosów, skupiającą się na siłach specjalnych atakujących tyły wroga."
 LBA_egypt_war_armour: "Specjalizacja zmechanizowana"
 LBA_egypt_war_armour_desc: "Po przeanalizowaniu przeszłych konfliktów armia libijska przekształciła się w bardziej zmechanizowane siły, skupiające się na opancerzonych pojazdach bojowych przebijających się przez linie wroga."
 LBA_foreign_procurement_boosted: "Ulepszone zaopatrzenie"
 LBA_foreign_procurement_boosted_desc: "Po zniesieniu sankcji za broń libijski rząd wpadł w szał zakupu zagranicznego sprzętu."
 LBA_libyan_gauge_railroads: "Libijski-Gauge"
 LBA_libyan_gauge_railroads_desc: "Libia przyjęła własną, unikalną skrajnię kolejową. Utrudni to wrogiemu państwu okupację i kontrolę ziem libijskich, ponieważ ich sprzęt kolejowy nie będzie kompatybilny."
 LBA_state_supported_railways: "Koleje finansowane przez państwo"
 LBA_state_supported_railways_desc: "Wraz z utworzeniem nowego systemu kolejowego w Libii większość kosztów pokrywa rząd centralny. Brak wykorzystania w transporcie cywilnym i przemysłowym jest nadal zbyt niski, aby można go było uznać za zrównoważony."
 LBA_state_supported_railways_functional: "Koleje wspierane przez państwo"
 LBA_state_supported_railways_functional_desc: "Nowa sieć kolejowa w Libii osiągnęła stan operacyjny. Ze względu na niskie wykorzystanie rząd nadal musi pokryć część kosztów, ale przynajmniej istnieje baza pod przyszły wzrost."
 LBA_railroad_connection_to_neighbour: "Kolej do Libii"
 LBA_railroad_connection_to_neighbour_desc: "Zbudowano linię kolejową łączącą [ROOT.GetNameDef] z [LBA.GetNameDef]. Te zwiększone połączenia wzajemne pobudzają gospodarkę kraju."
 LBA_increased_tourism_1: "Boom turystyczny"
 LBA_increased_tourism_1_desc: "Libia intensywnie inwestuje w przyciągnięcie turystów do odwiedzenia tego kraju i zobaczenia różnych atrakcji kraju.\n\n§YJeśli będziemy w stanie wojny, odczujemy negatywne czynniki wpływające na nasze zyski podatkowe i szybkość budowy.§!"
 LBA_increased_tourism_1_war: "Dezercja turystyczna"
 LBA_increased_tourism_1_war_desc: "W związku z trwającym konfliktem w Libii turyści jak ognia unikają tego kraju. Miało to znaczący wpływ na gospodarkę kraju, który stał się bardziej uzależniony od turystyki."
 LBA_housing_terrorists: "Ukrywanie terrorystów"
 LBA_housing_terrorists_desc: "Libia zapewnia schronienie bojownikom różnych organizacji terrorystycznych, a nawet rekrutuje ich do swoich sił zbrojnych."
 LBA_treaty_of_benghazi: "Traktat z Bengazi"
 LBA_treaty_of_benghazi_desc: "Italy and Libya have agreed to patrol the Libyan coast together to reduce illegal immigration to Europe. Europe will also assist Libya by using satellites to monitor Libya's land border. In exchange, Italy has agreed to pay reparations for damages caused by colonialism to Libya.\n\n§YThis national spirit will be removed if we are at war with Italy.§!"
 LBA_trade_with_italy: "Handel Włoski"
 LBA_trade_with_italy_desc: "The friendly relations between Italy and Libya are allowing Libya to sell their hydrocarbons to Europe with increased efficiency.\n\n§YThis national spirit will be removed if we are at war with Italy.§!"
 LBA_libyan_sea_secured: "Kontrola Morza Libijskiego"
 LBA_libyan_sea_secured_desc: "Kontrolując Maltę i Kretę, Libia zabezpieczyła swoje wybrzeże przed wrogą inwazją."
 LBA_chad_trade_deal_chad: "Handel bawełną z Libią"
 LBA_chad_trade_deal_chad_desc: "Czad wynegocjował umowę handlową na eksport bawełny do Libii. Eksport bawełny do znacznie bogatszego kraju zaczął pobudzać gospodarkę Czadu."
 LBA_chad_trade_deal_libya: "Handel bawełną z Czadem"
 LBA_chad_trade_deal_libya_desc: "Libia wynegocjowała umowę handlową z Czadem na import wysokiej jakości bawełny do Libii. Zwiększyło to sprzedaż ubrań w Libii, ponieważ wysokiej jakości bawełna ma również pewne ograniczone zastosowania wojskowe."
 LBA_jewish_migration: "Migracja Żydów"
 LBA_jewish_migration_desc: "Libya has allowed exiled Jews to return to the country, even offering some reparations in return.\n\n§YThis national spirit will be removed if we are at war with Israel.§!"
 LBA_champion_of_al_aqsa_idea: "Mistrz Al-Aksa"
 LBA_champion_of_al_aqsa_idea_desc: "With control of the Al-Aqsa Mosque, Libya has become an influential beacon for all Muslims.\n\n§YThis national spirit will be removed if Jerusalem is not owned by us, our subject or our ally.§!"
 LBA_support_mengistu: "Kampania medialna Mengistu"
 LBA_support_mengistu_desc: "Libia zorganizowała kampanię medialną na rzecz wygnanego dyktatora Mengistu, której celem jest przekonanie świata o jego niewinności w toczącym się procesie o ludobójstwo."
 LBA_islamic_legion_idea: "Legion Islamski"
 LBA_islamic_legion_idea_desc: "Libya has recreated the Islamic Legion, a force which is intended to act as Gaddafi's proxy in various conflicts around the globe.\n\n§YThis national spirit will be removed if Libya is not ruled by a Gaddafi.§!"
 LBA_employing_charles_taylor: "Charlesa Taylora"
 LBA_employing_charles_taylor_desc: "The Libyan government has employed the services of the exiled Charles Taylor. The experienced guerrilla leader is instructing Libyan security personnel on handling possible insurgencies.\n\n§YThis national spirit will be removed if Libya is not ruled by a Gaddafi.§!"
 LBA_ethiopia_somali_resistance: "Opór Ogadena"
 LBA_ethiopia_somali_resistance_desc: "Somalijskie klany z regionu Ogaden prowadzą powstanie przeciwko swoim etiopskim władcom."
 LBA_hakem_al_mutairi: "Hakem Al-Mutairi"
 LBA_hakem_al_mutairi_desc: "Gaddafi is employing the services of Hakem Al-Mutairi, a Kuwaiti cleric and leader of the Ummah Party in order to expand Libyan influence in the Gulf region.\n\n§YThis national spirit will be removed if Libya is not ruled by a Gaddafi.§!"
 LBA_nationalised_economy_1: "Znacjonalizowana gospodarka"
 LBA_nationalised_economy_1_desc: "Libia kieruje się modelem gospodarczym, w którym większość gałęzi przemysłu w kraju jest własnością państwa lub przynajmniej jest pod jego silną kontrolą."
 LBA_privatised_economy_1: "Sprywatyzowana Gospodarka"
 LBA_privatised_economy_1_desc: "Po dziesięcioleciach kontroli rządu Libia zaczęła prywatyzować duże sektory swojej gospodarki, powodując wzrost wzrostu gospodarczego."
 LBA_humbled_the_un: "Upokorzony ONZ"
 LBA_humbled_the_un_desc: "Ogniste przemówienie Muammara Kaddafiego przed Narodami Zjednoczonymi postawiło Libię w centrum uwagi, pokazując światu, że nie można jej lekceważyć."
 LBA_humbled_by_the_un: "Pokorny wobec ONZ"
 LBA_people_motivated_to_work: "Ludzie Zmotywowani Do Pracy"
 LBA_people_motivated_to_work_desc: "Gaddafi's latest trick of throwing money on the streets of Tripoli has convinced people that international aid agencies and charities are nothing but scams trying to get people hooked on money. They are now working extra hard to make sure they never have to beg for money again."
 LBA_people_unmotivated_to_work: "Ludzie Nie Zmotywowani Do Pracy"
 LBA_people_unmotivated_to_work_desc: "Ostatnia sztuczka Kaddafiego polegająca na rzucaniu pieniędzy na ulice Trypolisu przyniosła odwrotny skutek. Ludzie nie chcą już pracować, zamiast tego po prostu siedzą w domach i czekają na jałmużnę."
 LBA_gaddafis_car_rocket: "Rakieta"
 LBA_gaddafis_car_rocket_desc: "Libya has launched mass production of a domestic car design; the Rocket. Shaped like a wedge, packed with air bags, run-flat tyres, auto-fuel cutoff, impact absorbent bumpers and many other safety features, the car has been dubbed (at least by Libya's ruler Gaddafi) as the safest car in the world."
 LBA_gaddafis_car_bucket: "Wiadro"
 LBA_gaddafis_car_bucket_desc: "Libia uruchomiła masową produkcję krajowego projektu samochodu; wiadro. Wyprodukowany z tanich materiałów, z otwartymi bokami zamiast drzwi, większością paneli wykonanych z taniego duroplastu i wyposażony w silnik elektryczny, Muammar Kaddafi nazywa swój nowy wynalazek samochodem prawdziwie ludowym."
 LBA_gaddafis_car_packet: "Pakiet"
 LBA_gaddafis_car_packet_desc: "Libia uruchomiła masową produkcję krajowego projektu samochodu; Pakiet. Wytrzymały pick-up bezpośrednio skopiowany z Toyoty Hilux. Przeznaczona zarówno do użytku wojskowego, jak i cywilnego, ciężarówka ma kuloodporne szyby, opancerzenie z przodu i wzmocnione opony. Samochód jest prawdziwym pojazdem wielofunkcyjnym."
 LBA_gaddafis_car_increased_road_fatalities: "Zwiększona liczba ofiar śmiertelnych na drogach"
 LBA_gaddafis_car_increased_road_fatalities_desc: "Katastrofalna przygoda Kaddafiego z projektowaniem krajowego libijskiego pojazdu wzbudziła wśród Libijczyków podejrzliwość wobec wszelkich nowych projektów samochodów. Ludzie kupują coraz starsze pojazdy w nadziei, że unikną zakupu nowych. Doprowadziło to do znacznego wzrostu liczby wypadków drogowych i ofiar śmiertelnych."
 LBA_show_of_greatness: "Pokaz wielkości"
 LBA_show_of_greatness_desc: "Niedawna wizyta państwowa przywódcy Libii Muammara Kaddafiego w obcym kraju zaskoczyła ludzi zarówno za granicą, jak i w kraju. Pozycja Kaddafiego w świecie poważnie wzrosła."
 LBA_show_of_failure: "Pokaz porażki"
 LBA_show_of_failure_desc: "Niedawna wizyta państwowa Muammara Kaddafiego za granicą spowodowała u niego upokorzenie na arenie międzynarodowej i krajowej."
 LBA_good_juju: "Dobra Juju"
 LBA_good_juju_desc: "Poprzez sztukę czarnej magii Muammar Kaddafi zmotywował swoje wojska do zaciekłej walki w obronie Libii."
 LBA_bad_juju: "Zły Juju"
 LBA_bad_juju_desc: "Po nieudanym rytuale czarnej magii żołnierze Muammara Kaddafiego stracili wiarę w zdolności przywódcze swojego przywódcy."
 LBA_emancipator_of_women: "Emancypatorka Kobiet"
 LBA_emancipator_of_women_desc: "Ostatni wykład Muammara Kaddafiego na temat islamu skierowany do grupy kobiet we Włoszech doprowadził do masowego nawrócenia kobiet na islam i migracji do Libii."
 LBA_oppressor_of_women: "Prześladowca Kobiet"
 LBA_oppressor_of_women_desc: "Ostatni wykład Muammara Kaddafiego na temat islamu skierowany do grupy kobiet we Włoszech sprawił, że ludzie postrzegali tego wielkiego przywódcę jedynie jako prześladowcę kobiet. Ludzie masowo opuszczają Libię, ponieważ nie chcą żyć w kraju rządzonym przez takiego człowieka."
