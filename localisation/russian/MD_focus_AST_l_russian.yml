 literacy_progress_the_gap_ast: "Прогресс в сокращении разрыва"
 literacy_progress_the_gap_ast_1: "Продолжение разрыва"
 closing_the_gap_event.2.t: "Результаты программы «Сокращение разрыва»"
 closing_the_gap_event.2.d: "Наша кампания по повышению грамотности и социальной поддержке, рассчитанная на несколько лет, показала, к сожалению, неоднозначные результаты. Хотя количество детей, зачисленных в программы, увеличивается, а число взрослых, попадающих в тюрьму, в целом растет, количество детей, находящихся под опекой, и уровень преступности среди молодежи. В результате, похоже, наши усилия по интеграции малообеспеченных австралийцев в основное общество частично считаются провалом. Мы можем инвестировать больше средств в программу, чтобы продолжить работу и, возможно, усовершенствовать её, или же мы можем сейчас прекратить её реализацию."
 closing_the_gap_event.2.a: "Продолжайте работу."
 closing_the_gap_event.2.b: "Выключите его."
 closing_the_gap_event.3.d: "Наша кампания по повышению грамотности и социальной поддержке, рассчитанная на несколько лет, показала положительные результаты. Увеличивается число детей, зачисленных в учебные заведения, сокращается общее количество взрослых, находящихся в заключении, неуклонно снижается количество случаев пребывания вне дома и уровень преступности среди молодежи. Похоже, наши усилия по интеграции малообеспеченных австралийцев в основное общество действительно приносят свои плоды."
 closing_the_gap_event.3.a: "Ещё один успех."
