 EGY_aswan_tribal_clashes_category: "아스완 부족 충돌"
 EGY_aswan_tribal_clashes_category_desc: "아스완에서 현지 아랍계와 누비아계 공동체 사이에 폭력적인 부족 분쟁이 발발했습니다. 정부는 질서를 회복하고 더 이상의 확전을 막기 위해 단호한 조치를 취해야 합니다."
 EGY_tribal_conflict_escalation_mission: "분쟁 해결"
 EGY_tribal_conflict_escalation_mission_desc: "아스완의 부족 분쟁이 걷잡을 수 없이 번지기 전에 해결해야 합니다. 헌병대를 배치하여 질서를 강제하거나, 한쪽 편을 선택해 지지해야 합니다. 조치를 취하지 않으면 안정도와 국민 지지에 치명적인 결과를 초래할 것입니다."
 EGY_deploy_military_police_to_the_region_decision: "지역에 헌병대 배치"
 EGY_deploy_military_police_to_the_region_decision_desc: "나일 계곡에 헌병대를 배치함으로써 무력으로 질서를 확립하고 분쟁이 더 확대되는 것을 막을 수 있습니다. 이를 위해서는 해당 지역에 최소 3개 사단이 주둔해야 합니다."
 EGY_choose_a_side_decision: "분쟁에서 한쪽 편 선택"
 EGY_choose_a_side_decision_desc: "중립을 유지하는 대신, 부족 세력 중 한쪽을 지지할 수 있습니다. 이 결정은 국내는 물론 이웃 국가들, 특히 수단과의 관계에서 정치적 파장을 낳을 것입니다."
 egypt_news.1.t: "이집트에서 군사 쿠데타 발생!"
 egypt_news.1.d: "예상치 못한 급작스러운 사태 전개 속에서, 군사 쿠데타가 일어나 [EGY.GetLeader] 정부가 전복되면서 이집트는 불확실성의 소용돌이에 빠졌습니다. 집권당과 야권 세력 사이의 긴장이 고조되던 가운데, 압델 파타 엘시시 장군이 이끄는 이집트 군부가 국가 기구를 장악하고 헌법을 정지시키며 주요 정치인들을 구금했습니다. 카이로 거리는 환희와 불안이 뒤섞인 장면으로 들끓고 있으며, 이는 군의 개입을 둘러싼 국민들 사이의 깊은 분열을 반영합니다. 국제사회는 이집트의 미래가 갈림길에 놓인 것을 주시하고 있으며, 이것이 지역의 민주주의와 안정에 미칠 영향에 대한 우려가 커지고 있습니다."
 egypt_news.1.a: "흥미롭군"
 egypt_news.2.t: "러시아-아프리카 정상회의"
 egypt_news.2.d: "러시아-아프리카 정상회의가 오늘 막을 내렸으며, 러시아와 아프리카 국가들 사이의 외교 관계에서 중요한 이정표를 세웠습니다. 모스크바에서 열린 이번 정상회의에는 50개국이 넘는 아프리카 국가의 지도자들이 모여 협력과 동반자 관계를 위한 방안을 논의했습니다. 의제의 핵심 주제는 무역, 투자, 안보 협력, 기술 교류였습니다. 러시아 대통령 [SOV.GetLeader]은(는) 아프리카와의 유대를 강화하는 것의 중요성을 강조하며 상호 이익이 되는 동반자 관계의 방대한 잠재력을 부각했습니다. 정상회의는 러시아와 아프리카 간의 경제적·정치적 관여를 심화하기 위한 여러 협정의 체결로 마무리되었으며, 이는 양측 관계의 유망한 진전을 알리는 신호입니다."
 egypt_news.2.a: "흥미롭군"
 egypt_news.3.t: "이집트 경제 개발 회의"
 egypt_news.3.d: "이집트 경제 개발 회의가 오늘 막을 내렸으며, 경제 성장을 촉진하고 외국인 투자를 유치하려는 이집트의 의지를 보여 주었습니다. 카이로에서 열린 이번 회의에는 세계 지도자, 투자자, 주요 이해관계자들이 모여 에너지, 인프라, 관광, 기술 등 다양한 분야의 기회를 모색했습니다. 이집트 대통령 [EGY.GetLeader]은(는) 국가의 야심 찬 경제 개혁 의제를 강조하고 경쟁력을 강화하며 지속 가능한 발전을 이끌 대규모 인프라 사업 계획을 공개했습니다. 회의에서는 수많은 협정과 양해각서가 체결되어 이집트의 경제 전망과 이 지역의 유망한 투자처로서의 위상에 대한 새로운 자신감을 보여 주었습니다."
 egypt_news.3.a: "흥미롭군"
 egypt_news.4.t: "카이로에서 아랍 연맹 정상회의 개최!"
 egypt_news.4.d: "오늘 카이로의 아랍 연맹 본부에서 아랍 세계 각지의 지도자들이 모여 큰 기대를 모은 정상회의를 열었습니다. 이집트 대통령이 의장을 맡은 이번 정상회의에서는 안보 과제, 경제 협력, 중동의 평화와 안정을 위한 외교적 노력 등 여러 시급한 지역 현안이 부각되었습니다. 지역의 긴장이 고조된 가운데, 정상회의는 회원국들이 대화와 협력에 나서 집단 행동과 연대의 방향을 모색할 중요한 장을 제공했습니다. 의제의 핵심 주제는 시리아, 예멘, 리비아에서 진행 중인 분쟁과 테러 및 극단주의에 맞서기 위한 전략입니다. 지도자들이 논의에 임하는 가운데, 정상회의가 아랍 세계가 직면한 복잡한 과제를 다루는 데 의미 있는 성과를 낼 것이라는 조심스러운 낙관론이 있습니다."
 egypt_news.4.a: "흥미롭군"
 egypt.163.t: "아스완 부족 충돌"
 egypt.163.d: "아스완 주에서 들어온 보고는 현지 아랍계 알할라일(베니 헬랄) 씨족과 누비아계 알다보데야 가문 사이의 공공연한 분쟁을 묘사합니다. 두 가문 사이의 싸움에서 여러 명이 부상을 입고 여러 명이 사망했습니다. 우리가 개입하지 않으면 싸움이 전면적인 충돌로 번질 위험이 있습니다."
 egypt.163.a: "우려스럽군..."
 egypt.164.t: "부족 분쟁 해결"
 egypt.164.d: "신중한 협상과 정부의 신속한 개입을 통해 아스완의 부족 충돌이 평화롭게 마무리되었습니다. 아랍계 알할라일 씨족과 누비아계 알다보데야 가문 모두 휴전에 합의했으며, 지역 지도자들은 폭력이 아닌 대화로 이견을 해결하겠다고 약속했습니다. 아스완의 질서 회복은 상이집트의 안정을 유지하는 데 도움이 될 것입니다."
 egypt.164.a: "마침내 평화가 찾아왔다."
 egypt.165.t: "수십 명 사망 또는 부상"
 egypt.165.d: "아스완의 상황이 급속도로 악화되었습니다. 알할라일 아랍인들과 알다보데야 누비아인들 사이의 산발적인 충돌로 시작된 사태가 지속적인 교전으로 확대되었습니다. 아스완의 병원은 사상자들로 넘쳐나고 있으며, 이번 폭력으로 수십 명이 사망하고 훨씬 많은 사람이 부상을 입었습니다. 양쪽 공동체의 무장 집단이 바리케이드를 세우고 각자의 동네를 순찰하고 있습니다. 이 사태가 더욱 걷잡을 수 없이 번지기 전에 정부는 단호하게 행동해야 합니다."
 egypt.165.a: "이 분쟁을 중재할 수 있기를..."
 egypt.166.t: "편 선택"
 egypt.166.d: "아스완 분쟁이 격화됨에 따라 정부가 분명한 입장을 취해야 한다는 압박이 커지고 있습니다. 일부 고문들은 우리가 중립을 유지하며 아랍계와 누비아계 공동체 사이의 평화 중재에 집중해야 한다고 주장합니다. 그러나 다른 이들은 누비아 주민들이 이집트에서 오랫동안 소외를 겪어 왔으며, 그들을 지지하면 역사적 불만을 해소하는 동시에 그들의 충성을 확보할 수 있다고 지적합니다. 우리의 결정은 상이집트의 민족 관계에 지속적인 영향을 미칠 것입니다."
 egypt.166.a: "평화를 중재하라"
 egypt.166.b: "아랍인을 지지하라"
 egypt.167.t: "충돌 격화"
 egypt.167.d: "아스완의 부족 분쟁이 위험한 새 국면에 접어들었습니다. 한때 국지적이던 싸움이 주 전역으로 번졌으며, 아랍계와 누비아계 민병대 모두 인근 마을에서 전투원을 동원하고 있습니다. 자동화기의 총성이 거리에 울려 퍼지고, 가족들이 폭력을 피해 달아나면서 동네 전체가 버려졌습니다. 사망자 수는 계속 늘고 있으며, 보복 살인과 표적 공격에 관한 불안한 보고가 들어오고 있습니다. 이 사태는 이제 상이집트 지역 전체를 불안정하게 만들 위협이 되고 있습니다."
 egypt.167.a: "전쟁. 전쟁은 결코 변하지 않는다..."
 egypt.168.t: "누비아 민족을 지지할 것인가?"
 egypt.168.d: "누비아계 알다보데야 가문이 아랍계 알할라일 씨족에 맞선 투쟁에서 정부의 도움을 구하기 위해 카이로에 대표단을 보냈습니다. 그들은 자신들의 공동체가 피해를 입었으며 국가의 보호를 받을 자격이 있다고 주장합니다. 우리는 어떻게 대응할지 결정해야 합니다. 무기와 물자 같은 물질적 지원을 제공할 것인지, 병력을 투입해 그들과 함께 적극적으로 싸울 것인지, 아니면 이 부족 분쟁에서 완전히 거리를 둘 것인지입니다. 어느 선택지든 상당한 정치적 위험이 따릅니다."
 egypt.168.a: "물질적 지원만..."
 egypt.168.b: "병력과 물자..."
 egypt.168.c: "그들의 곤경을 외면하라"
 egypt.169.t: "아스완 분쟁에 대한 개입"
 egypt.169.d: "아스완 부족 분쟁에 대한 우리의 관여가 중대한 기로에 이르렀습니다. 군 지휘관들은 지역을 완전히 평정하고 필요하다면 무력으로 질서를 강제하기 위해 추가 병력을 배치할 수 있도록 승인해 달라고 요청하고 있습니다. 그러나 일부 각료들은 더 깊은 군사적 개입이 역효과를 낳아 지역 분쟁을 더 광범위한 반란으로 바꿀 수 있다고 경고합니다. 무력으로 이 위기를 해결하는 데 전념할 것인지, 아니면 지원을 철회하고 대신 외교적 해법을 모색할 것인지 결정해야 합니다."
 egypt.169.a: "분쟁에 개입하라."
 egypt.169.b: "분쟁에서 손을 떼라."
 egypt.170.t: "누비아인을 지지하는 수단"
 egypt.170.d: "정보 보고에 따르면 수단이 아스완의 누비아 전투원들에게 지원을 제공하기 시작했습니다. 자국 내에도 상당한 누비아 인구를 가진 수단 정부는 이 분쟁을 민족적 시각에서 바라보는 것으로 보입니다. 무기와 물자가 국경을 넘고 있다고 알려졌으며, 수단 의용병들이 전투에 합류하고 있다는 소문까지 돌고 있습니다. 이러한 외부의 간섭은 국내 부족 분쟁이었던 것을 이집트-수단 관계를 악화시킬 수 있는 잠재적 국제 위기로 바꿔 놓습니다."
 egypt.170.a: "오, 안 돼..."
