 FRA_dismantle_terror_networks: "Desmantelar as Redes Terroristas"
 FRA_dismantle_terror_networks_desc: "Lançar uma operação abrangente, de um ano, para identificar e desmantelar células terroristas que atuam na França. Isso exige forte capacidade de inteligência, financiamento policial adequado e estabilidade interna."
