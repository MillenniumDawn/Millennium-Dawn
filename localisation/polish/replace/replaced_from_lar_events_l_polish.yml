l_polish:
 occupied_countries.1.title: "Rząd Tymczasowy [FROM.FROM.GetNameDef]"
 occupied_countries.1.desc: "Nasze władze okupacyjne w [FROM.FROM.GetNameDef] ściśle współpracują obecnie z lokalnymi urzędnikami, a większość ludności zaakceptowała naszą obecność. Tymczasowy rząd, złożony z chętnych do współpracy mieszkańców, jest gotowy przejąć administrację pod naszym nadzorem."
 occupied_countries.1.a: "Mają nasze błogosławieństwo."
 occupied_countries.1.b: "Jeszcze nie są gotowi."
 occupied_countries.1.c: "Przestańcie przynosić nam te petycje."