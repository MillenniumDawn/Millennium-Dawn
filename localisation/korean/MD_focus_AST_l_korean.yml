 AST_experts_abroad_pak: "@PAK 파키스탄에 전문가 파견"
 AST_experts_abroad_afg: "@AFG 아프가니스탄에 전문가 파견"
 AST_experts_abroad_sri: "@SRI 스리랑카에 전문가 파견"
 AST_experts_abroad_mld: "@MLD 몰디브에 전문가 파견"
 AST_experts_abroad_nep: "@NEP 네팔에 전문가 파견"
 approved_resource_lease: "승인된 자원 임대"
 fraus_idea: "FRAUS"
 joint_counter_terrorism: "합동 대테러"
 kinetic_connection_event.1.t: "오스트레일리아와의 대테러 협력"
 kinetic_connection_event.1.d: "오스트레일리아 정부가 태평양에서의 우리 공동 이해관계를 거론하며 합동 대테러 감시 프로그램을 제안했습니다. 이는 해외 영토에서 위협을 찾아내고 예방하는 우리의 능력을 강화하고, 정보 활동을 조율할 기회를 제공할 수 있습니다."
 kinetic_connection_event.1.a: "우리는 함께한다."
 kinetic_connection_event.1.b: "그건 곤란하다."
 kinetic_connection_event.2.t: "우리 제안을 수락한 프랑스"
 kinetic_connection_event.2.d: "프랑스 정부가 대테러 문제에서 협력하기로 동의했으며, 곧 우리 정보망이 연결되어 협력을 시작할 것입니다. 양국의 공동 노력 덕분에 태평양의 안전과 보안이 확보되었습니다."
 kinetic_connection_event.2.a: "아름다운 동맹이다."
 kinetic_connection_event.3.t: "협정을 거부한 프랑스"
 kinetic_connection_event.3.d: "파리의 정부는 대테러 정보 활동을 우리와 조율하는 것을 단호히 거부했으며, 태평양 순찰이라는 임무는 오롯이 우리만의 몫으로 남게 되었습니다."
 kinetic_connection_event.3.a: "무겁구나, 이 짐이."
 AST_oil_ind_lease.1.t: "우드사이드 에너지의 시추 제안"
 AST_oil_ind_lease.1.d: "우드사이드 에너지 사에서 남부 수마트라 해안을 따라 있는 우리 유전의 임대를 요청하는 계약서가 올라왔습니다. 계약 기간은 1년이며, 그동안 우리는 배당을 받고 우드사이드 에너지는 유전 일대의 기반 시설을 개선하고 자체 펌프를 설치합니다. 유전을 개선할 만한 가치 있는 투자일 수도 있지만, 또 다른 오스트레일리아 기업이 우리 사업에 손을 뻗을 기회일 수도 있습니다."
 AST_oil_ind_lease.1.a: "시추하게 두자."
 AST_oil_ind_lease.1.b: "그 기업 나부랭이들을 당장 내쫓아라!"
 AST_oil_ind_lease.2.t: "시추를 승인한 인도네시아"
 AST_oil_ind_lease.2.d: "우드사이드 에너지 쪽 연락책에게서 거래가 성사되었다는 소식이 왔습니다. 그쪽 전문가들이 일을 진척시키고 장비를 가동하기 위해 지금 이 순간 이미 날아오고 있습니다. 이번 주 말이면 새 원유가 우리 시장으로 흘러들 것입니다."
 AST_oil_ind_lease.2.a: "시추 기술자들을 위하여!"
 AST_oil_ind_lease.3.t: "쫓겨난 우드사이드 에너지 임원진"
 AST_oil_ind_lease.3.d: "인도네시아 영사관 내부에서 들려오는 소식에 따르면 협상은 전혀 순조롭지 않았다고 합니다. 회의가 시작되고 불과 몇 분 만에 임원들이 나가는 모습이 목격되었으며, 우리 쪽 연락책들은 이후의 거래 가능성에 대해 입을 다물었습니다. 좋은 의도에도 불구하고 우리 시추 인력은 인도네시아 땅에 발을 들이지 못하게 되었습니다."
 AST_oil_ind_lease.3.a: "또 하나의 거래가 물거품이 되었군..."
 AST_oil_ind_lease.4.t: "종료되는 석유 계약"
 AST_oil_ind_lease.4.d: "우드사이드 에너지 근로자들이 짐을 싸서 곧 남부 수마트라의 유전에서 철수할 것입니다. 우리 인력이 신속히 들어가 작업을 재개할 수 있으며, 그동안 그쪽 회계 담당자들은 우리 몫의 수익 이전을 처리합니다. 결과적으로 양측 모두에게 수지맞는 거래였던 것으로 보입니다."
 AST_oil_ind_lease.4.a: "이번엔 우리가 이득을 봤다."
 AST_oil_ind_lease.5.d: "우드사이드 에너지 그룹 근로자들이 짐을 싸서 곧 남부 수마트라의 유전에서 철수할 것입니다. 수익이 끝나는 것은 아쉽지만, 회사는 꽤 독특한 이 유전을 운영하며 값진 경험을 얻어 이번 사업을 마무리했습니다."
 AST_oil_ind_lease.5.a: "좋은 시절은 끝나기 마련이다."
 AST_oil_field_lease_tt: "§Y남부 수마트라§!의 §Y석유§! 권리를 얻게 됩니다"
 AST_hard_yakkas_tt: "퍼스급 구축함을 재취역시킵니다: §YHMAS 호바트§!와 §YHMAS 퍼스§!."
 taiwan_chip_contract_ast: "대만-텔스트라 칩 계약"
 taiwan_chip_contract_ast_desc: "대만과의 거래로 우리는 5년 동안 성장하는 기술 부문의 동력이 될 실리콘 칩을 독점 공급받습니다. 생산망이 수요에 적응하는 동안 우려를 어느 정도 덜어 줍니다. 텔스트라가 주선했습니다. \n\n§W--------------§!\n대만이 우리에 대해 가진 호감도가 §Y0§! 미만이 되면 이 국가 정신은 §R제거§!됩니다."
 australian_chip_contract_ast: "오스트레일리아 칩 계약"
 australian_chip_contract_ast_desc: "오스트레일리아와의 거래로 칩 생산과 산업 역량이 확대되었지만, 그 대가로 칩의 일부를 오스트레일리아 산업계에 독점 공급해야 합니다. \n\n§W--------------§!\n오스트레일리아가 우리에 대해 가진 호감도가 §Y0§! 미만이 되면 이 국가 정신은 §R제거§!됩니다."
 AST_chips_flow_event.1.t: "오스트레일리아의 반도체 투자 제안"
 AST_chips_flow_event.1.d: "오스트레일리아의 투자자들이 타이중에 반도체 시설 건설 자금을 대어 우리의 현재 생산량을 끌어올려 주겠다고 제안했습니다. 그 대가로 그들과 독점 공급 협정을 맺어야 합니다. 이 경우 공장에서 생산되는 칩 대부분은 5년 동안 주로 오스트레일리아 산업계에 수출됩니다. 확실히 수익성이 높은 거래이며 당분간 고객을 보장받을 수 있지만, 제한적인 우리 기반 시설에 외세의 영향력이 파고들 문을 열어 줄 수도 있습니다."
 AST_chips_flow_event.1.a: "공정한 거래다."
 AST_chips_flow_event.1.b: "그들에게 줄 칩은 없다."
 AST_chips_flow_event.2.t: "설득된 대만"
 AST_chips_flow_event.2.d: "외교관과 정장 차림의 인사들이 앞으로 상당 기간 반도체를 공급하겠다는 계약을 들고 돌아왔습니다. 우리 관료들은 때때로 믿고 일을 맡길 만하며, 이번에도 해냈습니다. 계약은 5년만 명시하고 있지만, 우리 실리콘 밸리 산업은 이제 자립에 한 걸음 더 다가섰습니다."
 AST_chips_flow_event.2.a: "기술 덕후들의 또 한 번의 승리다."
 AST_chips_flow_event.3.t: "대만 블루스"
 AST_chips_flow_event.3.d: "휴게실의 공기는 차가웠습니다. 머리 위에서 윙윙거리며 과하게 돌아가는 에어컨이 상황을 더 낫게 해 주지도 못했습니다. 대만 외교관들은 탁자 맞은편 끝에 앉아 있었고, 그중 한 명은 연필을 톡톡 두드리고 있었으며 앞에 놓인 노트북에서는 멀리서 들려오는 웅성거림이 새어 나오고 있었습니다. 모두가 답변을 기다리고 있었고, 오스트레일리아 사람들은 중국어를 거의 하지 못했지만 들려온 말은 영어로 말한 것처럼 또렷했습니다. \n\n\\"그다지 좋지 않군요.\\" \n\n모두가 금속 의자에 등을 기댔고, 몇몇은 실망감에 머리를 문질렀습니다. 7시간의 협상이 헛수고였습니다. 그들은 외투를 챙기고 악수를 나눈 뒤 각자의 출구로 느긋하게 걸어 나갔습니다. 오스트레일리아 사람들은 나쁜 소식을 안고 첫 비행기로 돌아가게 될 것입니다."
 AST_chips_flow_event.3.a: "\\"완전히 허탕이었다.\\""
 AST_thai_mil_exercise.1.t: "오스트레일리아 훈련 작전"
 AST_thai_mil_exercise.1.d: "오스트레일리아 국방군이 대규모 해군 및 상륙 훈련에서 양국 군을 겨뤄 볼 기회를 제안해 왔습니다. 그들은 우리 지휘관들을 시드니 본부로 초청해 작전을 계획하고 앞으로 몇 주에 걸쳐 실행하자고 하며, 유일한 요청 사항은 자국 함선이 우리 기지에 주둔하도록 허용해 달라는 것입니다."
 AST_thai_mil_exercise.1.a: "작전을 승인한다."
 AST_thai_mil_exercise.1.b: "자원 낭비일 뿐이다."
 AST_thai_mil_exercise.2.t: "시작되는 태국-오스트레일리아 훈련"
 AST_thai_mil_exercise.2.d: "태국 왕립 육군이 작전을 승인했습니다. 그들의 지휘관들이 카울라로 내려와 훈련을 조율할 것이며, 앞으로 몇 주 동안 우리는 바다와 해안에서 양국 군을 맞붙여 시험하게 됩니다."
 AST_thai_mil_exercise.2.a: "반가운 소식이다."
 AST_thai_mil_exercise.3.t: "태국의 냉대"
 AST_thai_mil_exercise.3.d: "태국의 반응으로 보건대 우리가 태국과의 관계를 과대평가했던 것 같습니다. 그들은 합동 군사 훈련의 가능성 자체를 단호히 거절했습니다. 이 날려 버린 기회를 만회하려면 우리 자체 훈련 작전을 짜야 합니다."
 AST_thai_mil_exercise.3.a: "정말 안타깝다."
 AST_thai_mil_exercise.4.t: "마무리되는 훈련"
 AST_thai_mil_exercise.4.d: "태국만에서 우리 부대를 철수시키는 가운데, 들어오는 보고들은 작전이 대성공이었음을 시사합니다. 우리 군은 앞으로 활용할 수 있는 값진 경험을 얻었으며, 태국과의 국방 관계도 크게 강화되었습니다."
 AST_thai_mil_exercise.4.a: "환상적이다!"
 AST_thai_mil_exercise.5.t: "기대를 뛰어넘은 훈련"
 AST_thai_mil_exercise.5.d: "우리 부대와 지휘관들을 복귀시키며 작전이 마무리되는 가운데, 들어오는 보고들은 작전이 대성공이었음을 시사합니다. 우리 부대는 압박 속에서도, 오스트레일리아 상대를 맞아서도 훌륭하게 임무를 수행했습니다. 훈장이 수여되는 동안, 우리는 얻은 경험을 받아들여 앞으로의 교리에 적용할 수도 있습니다."
 AST_thai_mil_exercise.5.a: "태국 왕립 육군은 강하다!"
 AST_thai_mil_exercise.6.t: "실망 속에 끝난 훈련"
 AST_thai_mil_exercise.6.d: "우리 부대와 지휘관들을 복귀시키며 작전이 마무리되는 가운데, 들어오는 보고들은 이번 작전이 군 수뇌부에게 눈을 뜨게 해 준 계기였음을 시사합니다. 우리 부대는 압박 속에서 기대에 못 미치는 모습을 보였고, 오스트레일리아 상대와의 격차는 바람직하지 않을 만큼 벌어졌습니다. 이를 만회하려면 병영의 기강을 다잡고 전면적인 개혁을 단행해야 합니다."
 AST_thai_mil_exercise.6.a: "혹독한 평가를 받아 마땅한 성적이다."
 AST_thai_mil_exercise.7.t: "태평양의 오스트레일리아-태국 합동 군사 훈련"
 AST_thai_mil_exercise.7.d: "태국과 오스트레일리아 사이에서 냉전 이후 태평양 최대 규모의 훈련이 진행되면서 태국만은 해군 함대로 북적이고 있습니다. 200대가 넘는 항공기가 만 상공을 비행하는 것이 보고되었고, 지난주에는 수십 대의 오스트레일리아 국방군 수송기가 코랏 왕립 공군 기지에 착륙하는 모습이 목격되었지만, 작전은 여전히 쉬쉬하며 진행되고 있습니다. \n\n그럼에도 이번 훈련이 반응을 불러일으킬 것은 분명합니다. 두 나라 사이의 군사적 유대를 강화할 수도 있지만, 이미 달아오른 지역의 긴장을 높일 수도 있습니다."
 AST_thai_mil_exercise.7.a: "흥미롭군."
 AST_thai_mil_exercise.7.b: "그들이 우리 역량을 목격하게 될 것이다."
 thai_ast_training_op: "태국-오스트레일리아 합동 훈련"
 dca: "국방 협력 약정"
 AST_philippines_dca.1.t: "오스트레일리아와의 국방 회담"
 AST_philippines_dca.1.d: "1995년 양해각서 체결 이래 오스트레일리아군 소규모 부대가 우리나라에 주둔하며 훈련과 사이버 보안 대책을 지원해 왔습니다. 마찬가지로 우리 병력 일부도 태평양 방위를 돕기 위해 오스트레일리아에 계속 파견되어 있습니다. 최근 회담에서 오스트레일리아 측은 양해각서를 확대해 폭넓은 군사 공유를 포괄하자는 구상을 꺼냈으며, 처음에는 우리의 무기 산업에 관심을 보였습니다. \n\n그러면서 자국 전문가 일부가 우리의 현재 역량을 분석하고 가능한 범위에서 확장을 승인할 수 있도록 허용해 달라고 요청했습니다. 비용은 그쪽에서 모두 부담합니다."
 AST_philippines_dca.1.a: "환영한다."
 AST_philippines_dca.1.b: "그들이 상관할 일이 아니다."
 AST_philippines_dca.2.t: "체결된 국방 협력 약정"
 AST_philippines_dca.2.d: "필리핀의 친구들이 요청에 우호적으로 반응하여, 우리 전문가가 그들의 무기 제조를 지원하도록 승인했습니다. 또한 추가 공약의 문을 열어 양해각서를 장관급 회담, 국방 계획 등으로 확대했습니다. 태평양의 장기적 방위에서 더욱 강력한 동맹을 기대할 수 있습니다."
 AST_philippines_dca.2.a: "하나는 모두를 위해, 모두는 하나를 위해!"
 AST_philippines_dca.3.t: "교착된 국방 회담"
 AST_philippines_dca.3.d: "필리핀 수뇌부는 우리의 현행 공약을 끝내겠다는 뉘앙스는 전혀 비치지 않았지만, 양해각서를 다른 국방 분야로 넓히는 데에는 그다지 열의를 보이지 않습니다. 또한 우리 전문가들이 그들의 산업을 살펴보는 길도 막아 버렸습니다."
 AST_philippines_dca.3.a: "정말 안타깝다."
 AST_the_kiwi_defense_tt: "§Y뉴질랜드의 일부 조달을 보조합니다.§!"
 bankrolling_defense: "국방 자금 지원"
 has_happened_tt: "§Y발생함:§!"
 AST_nzl_defense_subsidy.1.t: "오스트레일리아의 무기 조달 보조"
 AST_nzl_defense_subsidy.1.d: "양국의 국방 동맹을 지원하는 차원에서 오스트레일리아가 우리에게 조달 패키지를 제공했습니다. 장비는 대부분 미국산 최첨단 무기이며 오스트레일리아산 부시마스터도 일부 포함되어 있어, 우리의 현재 역량을 높이거나 최소한 빠듯한 비축량을 보충해 줄 것입니다."
 AST_nzl_defense_subsidy.1.a: "반가운 몸짓이다."
 pine_gap_expansion_ast: "파인 갭 개선"
 fast_tracked_defense_ast: "신속 추진 국방"
 howard_apology_done: "이미 사과를 했음."
 former_defense_minister: "전직 국방장관"
 AST_beazley_apology.1.t: "국가적 사과"
 AST_beazley_apology.1.d: "이 문제에 대한 이전 정부의 늑장 대응 끝에, 킴 비즐리는 오스트레일리아의 원주민인 애버리지니와 토러스 해협 섬 주민에 대한 역사적 잘못에 관하여 공식 '사과'를 전했습니다. 하원 의사당에서 이루어진 이 행사는 오스트레일리아 전역에 중계되었고, 많은 이들이 수십 년간 기다려 온 것, 즉 도난당한 세대에 대한 책임 인정을 두고 감정 어린 반응이 이어졌습니다. \n\n'그들을 집으로 데려오다' 보고서에 기초한 이 연설을, 원주민 지도자들은 정부와 그동안 소외되어 온 이들 사이의 '간극을 메우려는' 진정성 있는 시도라고 환영했습니다. 수천 명이 의사당 밖 거리와 잔디밭에 모였고, 그중 일부는 이후 총리가 직접 나와 만났습니다."
 AST_christmas_island_saga.2.t: "안부 인사"
 AST_christmas_island_saga.2.d: "오늘도 본토에서 온 관리들이 수용소를 찾았습니다. 지난 6년 동안 아이샤는 그들이 오가는 것을 수없이 보았습니다. 몇 달에 한 번씩 그들은 와서 아이샤의 딸에 대해 이야기하며 더 나은 처우를 약속하곤 했습니다. 몇 해가 지나자 아이샤는 더는 기대하지 않게 되었습니다. \n\n수용소 사람들 대부분은 자신들이 다른 망명 신청자들에게 본보기로 남으리라는 사실을 받아들이게 되었습니다. 절차를 밟든가, 아니면 저들처럼 되든가. 미래가 없는 사람들. 아이샤가 가장 마음 아파한 것은 어린 카시였습니다. 카시는 사실상 이 수용 시설에서 자랐고, 아이의 세상 전체는 마당을 둘러싼 가시철조망 너머로 나가 본 적이 없었습니다. \n\n밖에서 경보음이 울렸고, 모두가 호송되어 안으로 돌아갔습니다. 아이샤는 경비병 한 명에게 한쪽으로 끌려 나갔습니다. 이번에는 카시마저 데려가는 것일지 몰라 아이샤는 카시의 손을 더 꽉 쥐었습니다. 경비병은 두 사람 모두 자신과 함께 가도 된다고 안심시켰고, 작은 흰색 방에 들어서자 그 안의 관리가 수용소가 폐쇄될 것이며 이들 같은 많은 사람이 본토로 이송될 것이라고 설명했습니다. \n\n아이샤는 거의 기절할 뻔했습니다. 그저 관리를 향해 고개를 끄덕이는 것밖에 할 수 없었습니다. 몇 년 동안 어깨를 짓누르던 무거운 짐이 갑자기 덜어진 것 같았기 때문입니다. 아이샤는 문득 다시 숨을 쉴 수 있었습니다."
 AST_christmas_island_saga.2.a: "떠날 때가 되었다."
 AST_christmas_island_saga.3.t: "싸움꾼 레이섬"
 AST_christmas_island_saga.3.d: "당내 소란꾼 마크 레이섬이 최근의 이민 정책 변화를 두고 당내에서 소동을 일으키고 있다는 사실이 우리 귀에 들어왔습니다. 지금은 가벼운 소란에 불과하지만, 이미 인기 없는 정책을 밀어붙이려는 시점에서는 문제가 되기까지 두어 걸음 남았을 뿐입니다. \n\n원내총무에게 법안이 완전히 통과될 때까지 그를 정직시키게 할 수도 있습니다. 그를 배제할 수는 있겠지만, 그가 조용히 물러날지는 장담할 수 없습니다. 아니면 그냥 무시할 수도 있습니다."
 AST_christmas_island_saga.3.a: "그는 신경 쓸 가치도 없다."
 AST_christmas_island_saga.3.b: "입을 막자."
 AST_christmas_island_saga.4.t: "폭탄 레이섬"
 AST_christmas_island_saga.4.d: "공교롭게도 마크 레이섬이 못마땅하다는 발언을 한 직후, 익명의 제보자가 언론으로 달려가 이 일을 떠벌린 모양입니다. 그런데 이들은 이 의견 충돌을 당 전체의 사안으로 포장하면서, 망명 신청자를 내륙으로 이송하겠다는 우리의 결정이 1950년대에 겪었던 것과 같은 분열을 또다시 일으킬 것이라고 주장합니다. \n\n터무니없는 헛소리이고 제보자가 레이섬 본인이라는 데는 의심의 여지가 없지만, 여론조사에서 파장이 일기 시작했습니다. 좋지 않은 종류의 파장입니다."
 AST_christmas_island_saga.4.a: "짖게 내버려 두자."
 AST_christmas_island_saga.5.t: "회의실의 불발"
 AST_christmas_island_saga.5.d: "비즐리는 넥타이를 거칠게 풀어헤치며 의사당 복도를 성큼성큼 지나 노동당 의원총회장으로 향했습니다. 당 대표 경질 투표 소식은 소리 없는 암살처럼 찾아왔습니다. 그는 보좌관들과 내각 인사들이 연락하려고 해서 울려 대는 전화기 소리에 잠을 깼습니다. 레이섬은 이 일을 용케 숨겨 와서 마지막 순간까지 아는 사람이 거의 없었고, 소식이 새어 나왔을 때는 이미 한밤중이었습니다. \n\n킴은 언젠가 도끼가 자신의 목에 떨어지리라는 것은 알고 있었지만, 일이 벌어지는 방식에 속이 뒤집혔습니다. 레이섬은 혼자서 그를 마주할 배짱조차 없었고, 그래서 비즐리가 당내 비판자 대부분에게 둘러싸인 방에서 승부가 가려지게 되었습니다. \n\n그가 들어서고 회의가 시작된 뒤에도 레이섬은 출석 확인 때까지 30분 더 모습을 드러내지 않았습니다. 마침내 나타났을 때도 그는 비즐리 쪽을 거의 쳐다보지 못했습니다. 쳐다보았다면 킴의 붉어진 뺨에서 끓어오르는 분노를 보았을지도 모릅니다. 마침내 투표가 이루어졌고, 애가 타도록 느리게 개표 결과가 쏟아져 들어왔습니다. 24 대 68. \n\n비즐리는 당분간 당 대표 자리를 지키게 되었습니다. 그가 한숨을 내쉬자 나머지 내각 인사들이 몸을 돌려 그의 등을 두드렸습니다. 그가 레이섬 쪽을 돌아보았을 때, 그는 이미 문으로 향하고 있었습니다. 굴욕을 당한 것이 분명했습니다. 대체로 안도하면서도, 킴은 앞으로 몇 주 안에 또 다른 놀랄 일이 기다리고 있을지 궁금했습니다."
 AST_christmas_island_saga.5.a: "시간이 말해 줄 것이다."
 AST_christmas_island_saga.6.t: "탈당"
 AST_christmas_island_saga.6.d: "원내총무가 레이섬과 마주 앉은 뒤, 이 얼간이는 정직 이야기에 말 그대로 폭발한 모양입니다. 이제 그는 대놓고 당적을 바꾸고 있습니다. 9 뉴스가 나가는 길의 그를 때맞춰 포착했고, 그는 거리낌 없이 우리의 국정 운영을 헐뜯었으며 지금은 지지자들에게 원 네이션에 투표하라고 호소하고 있습니다. \n\n우리가 아는 한 이 미치광이는 그들에 합류하는 것도 고려하고 있을지 모릅니다. 어쨌든 우리는 이 번져 가는 혼란을 수습하려 전면적인 피해 수습에 나선 상태입니다."
 AST_christmas_island_saga.6.a: "도대체 뭐가 문제야?"
 AST_christmas_island_saga.7.t: "국내의 위협"
 AST_christmas_island_saga.7.d: "국내 민족주의 세력들의 움직임이 활발해졌다는 보고가 들어오고 있습니다. 이미 몇몇 조직에 대한 단속이 이루어져, 반자동 무기와 폭탄 제조를 시사하는 전구 화학물질을 압수했습니다. 이는 이민자 처리에 관한 우리의 방침 전환에 대한 보복으로 보입니다. \n\n최근 몇 주 사이 시위도 늘어났으며, 원 네이션과 오스트레일리아 제일당 같은 우익 단체들이 앞으로 몇 달간의 시위를 조직하고 있습니다. 이들 단체가 연결되어 있지는 않다고 판단하지만, 우리 정보망은 가능한 연관성이나 동향이 있는지 면밀히 감시하고 있습니다."
 AST_christmas_island_saga.7.a: "위험한 시대다."
 AST_christmas_island_saga.8.t: "퍼스의 테러"
 AST_christmas_island_saga.8.d: "퍼스 상업 지구에서 일어난 참혹한 공격으로 연쇄 차량 폭발과 화염병 투척이 이어져 21명이 사망하고 40명 넘게 위독한 부상을 입었습니다. 이번 공격은 오스트레일리아 영토에서 일어난 테러 중 가장 치명적인 것이며, 이민을 둘러싼 긴장이 고조되는 가운데 발생했습니다. \n\n경찰은 폭탄 테러와 연루된 5명을 체포했으며, 그중에는 최근 석방된 전직 네오나치 지도자 잭 판 통게런이 포함되어 있습니다. 해당 지역의 상점과 종교 시설에도 인종차별적인 포스터와 스와스티카가 도배되어 있었으며, 이는 가해자들의 소행으로 여겨집니다. 오스트레일리아 제일당과 원 네이션의 시위가 폭탄 테러와 같은 날 겹쳐 열렸지만, 두 단체 모두 이번 공격을 규탄했습니다. 그러나 이러한 대응도 오스트레일리아에서 다문화주의에 대한 호감이 쇠퇴하고 있다는 우려를 잠재우지는 못했습니다."
 AST_christmas_island_saga.8.a: "나라의 암울한 날이다."
 AST_the_beazley_government: "비즐리 정부"
 AST_the_beazley_government_desc: "'참된 공정'의 정신은 우리 문화의 변함없는 특징이지만, 대다수 오스트레일리아 국민이 처한 현실은 상상할 수 있는 한 가장 \\"공정\\"과 거리가 멉니다. 수백만 명의 우리 공동체 구성원이, 오스트레일리아 국민끼리, 사용자와 노동자끼리, 가진 자와 못 가진 자끼리를 갈라놓은 정부에 배신감을 느낍니다. \n\n이제 돌아온 우리는 오스트레일리아 국민을 위한 요구를 제기하러 왔습니다. 일자리, 제대로 된 의료, 교육, 삶의 안정과 기회를 요구합니다. 우리는 그들이 마땅히 누려야 할 더 나은 오스트레일리아를 위한 그들의 요구를 내세웁니다."
 AST_plan_for_a_nation: "국가를 위한 계획"
 AST_plan_for_a_nation_desc: "간단히 말해, 상황을 반전시키려는 우리의 계획은 오스트레일리아의 산업을 튼튼하게 유지하고, 연구를 고도로 발전시키며, 학생들이 계속 배우게 하는 데 초점을 맞춥니다. 이는 명쾌한 계획이며, 해법은 더욱 명쾌합니다. 투자, 투자, 또 투자하는 것입니다!"
 AST_direct_development: "직접 개발"
 AST_direct_development_desc: "국가개발청을 신설함으로써, 우리는 산업을 직접적이고 더 실무적으로 관리하고, 도움이 필요한 기업에 경제 자문과 지원을 제공할 수 있게 됩니다."
 AST_emergency_industry_plan: "긴급 산업 계획"
 AST_emergency_industry_plan_desc: "공장 노동자나 사업주가 아니어도 알 수 있습니다. 국내 제조업은 70년대 이후 상당히 가동을 멈추고 방치되어 왔습니다. 하룻밤 사이에 되살아나리라 기대할 수는 없지만, 힘을 보태 줄 수는 있습니다. 소기업과 생산 기업이 사업을 확장하도록 돕는 자금 투입과 소폭의 감세가 바로 그 역할을 할 것입니다."
 AST_bankroll_the_suits: "정장족 자금 지원"
 AST_bankroll_the_suits_desc: "와이파이를 개발한 것이 우리나라였다는 사실을 기억하는 이는 드뭅니다. 이 나라의 기술 부문이 번성하는 동안 우리의 관심이 땜질식 산업으로 흘러서는 안 됩니다. 인터넷의 부상은 지역 강국들이 꿈만 꿀 수 있는 높이로 우리를 끌어올릴 잠재력이 있습니다. 우리는 그것을 개발하고, 도입하고, 할 수 있을 때 제대로 활용할 것입니다."
 AST_handle_the_right_sizing: "구조조정 대처"
 AST_handle_the_right_sizing_desc: "닷컴 파동과 이후 업계가 겪고 있는 위축은 대량 해고라는 살벌한 풍조를 낳아, 우리 블루칼라와 화이트칼라 노동자들의 모든 전망을 해치고 있습니다. 여파가 더 번지기 전에 상황을 장악해야 합니다."
 AST_power_at_home_act: "가정 전력"
 AST_power_at_home_act_desc: "기술자들이 태양 에너지로 이뤄내고 있는 혁신을 국민과 나누는 것이 마땅합니다. 인구의 단 10%만이라도 지붕에 태양광 패널을 얹으면 에너지 요금이 대폭 줄고 수백만 명의 전력 수요를 감당할 수 있습니다. 저소득 가구에는 전면적인 보급을, 나머지에는 환급을 제공하여 비용을 충당할 수 있습니다."
 AST_a_helping_hand: "도움의 손길"
 AST_a_helping_hand_desc: "평소라면 특히 광산 기업이 얽힌 끈끈한 부탁과 청탁의 세계에서는 멀리 떨어지고 싶었을 것입니다. 하지만 우리에게는 운영해야 할 나라가 있고, 빅토리아주의 부분 정전 사태는 하루빨리 멈춰야 합니다. 전기는 다시 풍족하게 자유로이 흐를 것입니다."
 AST_a_better_support: "더 나은 지원"
 AST_a_better_support_desc: "이런 고용 환경에서 가장 힘겨운 사람들은 실업자들입니다. 선거 공약을 이행하여, 일자리를 잃은 이들을 위해 18,000개가 넘는 정규직 일자리를 신속히 공급하는 것을 목표로 지역사회 일자리 프로그램을 만들 것입니다. 중장년 노동자와 실업률이 높은 지역에 초점을 맞춥니다."
 AST_national_housing_plan: "국가 주택 계획"
 AST_national_housing_plan_desc: "현재 주택 건설을 위한 토지 승인 속도는 그저 너무 낮습니다. 이미 느슨한 세법을 손보는 대신, 현행 제도를 개혁하고 애초에 개발업자들이 건설하지 못하게 막는 토지 이용 장벽을 낮추는 국가 계획 청사진을 도입할 것입니다."
 AST_recognise_their_acts: "그들의 공적 인정"
 AST_recognise_their_acts_desc: "우리나라가 치른 전쟁에서 원주민이 보여 준 헌신은 아무리 강조해도 지나치지 않습니다. 수십 년 동안 많은 이들이 단지 평등한 권리를 위해 싸워 왔지만, 그들은 참호와 정글에서 우리와 함께 싸우기도 했습니다. 그럼에도 수십 년 동안 그들의 문화적 정체성은 군 기록에서 지워졌습니다. \n\n오스트레일리아 국방군에 평등이 자리 잡은 시대에, 과거를 이해하지 않고서는 앞으로 나아갈 수 없습니다. 최초의 원주민 참전용사 담당관을 임명하여 역사 속에 묻힌 영웅들을 발굴하는 일을 맡기고, 원주민 정체성을 국방군 헌장에 반영하는 여러 프로그램을 시작할 것입니다."
 AST_i_belong_you_belong: "나도 한 식구, 너도 한 식구"
 AST_i_belong_you_belong_desc: "노동당은 노동조합에 의해, 노동조합을 위해 만들어진 정당입니다. 그것은 우리의 핏속에 흐르고 있습니다. 그렇기에 평범한 노동자를 대변하는 정부로서 우리는 대표성을 받아들여야 합니다. 우리는 노동조합 평의회와 긴밀히 협력하여 노동자의 권리와 보호 문제에서 의견을 같이하도록 하겠습니다."
 AST_in_with_the_old: "옛것의 복귀"
 AST_in_with_the_old_desc: "당은 휘틀럼과 호크의 시절 이후 달라졌지만, 여러 면에서는 달라지지 않았습니다. 90년대에 우리에게 표를 던졌던 이들이 지금도 우리에게 표를 던지는 이유인, 친노동·친기업·강한 경제를 지지하는 정당이라는 점은 여전합니다. 우리의 경험을 보고 찾아오는 이들은 바로 그것을 얻게 되며, 다만 겉칠이 조금 다를 뿐입니다."
 AST_make_it_right: "바로잡기"
 AST_make_it_right_desc: "이전 정부의 가장 큰 잘못은 인정을 요구하는 목소리를 외면한 것이었습니다. 유감 표명과 인정만으로도 나쁘지 않지만, 최고 책임자의 진짜 \\"사과\\" 없이는 화해가 나아갈 수 없습니다. 이번 일에서 모든 책임은 우리에게 있습니다."
 AST_a_different_light: "다른 시선"
 AST_a_different_light_desc: "당신과 내가 이 황금빛 나라를 있는 그대로의 보석으로 볼지 몰라도, 최근 몇 년 사이 우리에 대한 대중의 인식은 흐려지기 시작했습니다. 우리 관광의 다음 장에는 새로운 광택이 필요합니다. 배우 몇 명과 풋볼 스타 몇 명을 섭외하여, 외국인들을 저 남쪽 끝의 드넓은 땅으로 환영하는 광고 캠페인을 벌일 것입니다."
 AST_the_health_revolution: "보건 혁명"
 AST_the_health_revolution_desc: "진정한 안정이란 한밤중에 아이가 중병에 걸려도 공립 병원이 차로 잠깐이면 닿는 거리에 있다는 것을 아는 것입니다. 돈이 얼마나 있든 현대 과학이 제공할 수 있는 최고의 의료를 갖춘 곳으로 말입니다. 예산 삭감에 계속 굴복해서는 그런 안정을 얻을 수 없습니다. \n\n우리는 시대의 수준에 걸맞게 의료에 대한 책무를 확대할 것입니다. 우리가 도와주는 동안 궁핍한 이는 거의 없을 것입니다."
 AST_a_look_inside: "내부 시찰"
 AST_a_look_inside_desc: "우리의 망명 신청자 정책은 수년간 적지 않은 비판을 받아 왔고, 크리스마스 섬 심사 시설을 두고 언론의 관심을 끌기 시작했습니다. 솔직히 그곳은 인간다운 생활에 이상적이라고 하기 어려우며, 대부분은 교도소라고 부릅니다. 우리가 직접 크리스마스 섬 시설에 들러 상황을 살펴볼 것입니다."
 AST_advance_the_nation: "국가의 전진"
 AST_advance_the_nation_desc: "100년 가까이 전, 우리 선조들이 이 대륙에 도착했습니다. 전 세계의 사람들이 모여 서로의 차이를 내려놓고 하나의 나라를 세울 수 있었던 땅입니다. 지난 세기와 마찬가지로 새로운 세기에도 이들에게 문을 닫아걸 수는 없습니다. 동시에 끊임없이 변하는 세계를 반영하도록 이민 정책에는 유연성을 유지해야 합니다."
 AST_bring_in_the_unions: "노동조합 끌어들이기"
 AST_bring_in_the_unions_desc: "부총리 사이먼 크린과 노동조합의 연줄은 우리 개혁에 대한 그들의 지지를 얻을 틈을 열어 줍니다. 우리는 그들의 조건을 기꺼이 들을 용의가 있지만, 결과는 저항이 가능한 한 적어야 합니다. 파업도, 뜻밖의 기사도 없어야 합니다. 안건은 차질 없이 통과되어야 합니다."
 AST_commonwealth_research_scheme: "영연방 연구 계획"
 AST_commonwealth_research_scheme_desc: "이 계획은 민간 의과학 연구소들과 손잡고 그들과의 간극을 메우며, 우리 병원의 연구 개발에 자금이 흘러가도록 하여 영연방 동맹국들로부터 얻을 수 있는 가장 앞선 기술을 실현하는 것을 목표로 합니다."
 AST_hollywood_here: "여기가 할리우드"
 AST_hollywood_here_desc: "우리 영화 산업은 지금 한창 꽃을 피우고 있으며, 그 결과 좋은 영화도 몇 편 나왔습니다. 매드 맥스, 베이브, 사막에서 드래그퀸들이 나오는 그 영화 같은 작품들 말입니다. 어쨌든 우리는 우리의 예술적 강점을 기념해야 합니다. 오스트레일리아의 가치를 상징하는 영화와 TV 프로그램에 자금을 대는 정부 기관을 만들면 우리 문화를 세계에 알리는 데 큰 도움이 될 것입니다."
 AST_a_medical_alliance: "의료 동맹"
 AST_a_medical_alliance_desc: "의료 산업을 혁신하려면 업계 전문가들과 직접 마주 앉아 이야기를 나눠야 합니다. 지금까지 접수된 요구는 도시에서 멀리 떨어진 지역에 더 세심한 관심을 기울여 달라는 것입니다. 간단한 해법은 의료 센터의 범위를 넓히는 것입니다. 최근 문을 닫은 전국의 메디케어 사무소 30곳을 다시 열고, 지방의 의과대학을 확충하며, 농촌 개발 기금을 조성해 그 지역들의 장비 공급을 늘릴 수 있습니다."
 AST_call_the_ambos: "구급차를 부르자"
 AST_call_the_ambos_desc: "당신이나 아는 사람이 절박하게 도움이 필요할 때 구급차를 부르면 천 달러 넘게 들 수 있고, 구조 헬기라면 최대 5천 달러까지 나옵니다. 이런 비용 때문에 대부분은 직접 운전해서 가는 쪽을 택하고, 그 탓에 다친 사람이 더 큰 위험에 처할 수도 있습니다. 우리는 전국에 통용되는 보편적 모델을 도입해 구급차 요금을 완전한 무료로 낮추고 전액을 연방 정부가 부담하게 하겠습니다."
 AST_a_knowledge_nation: "지식 국가"
 AST_a_knowledge_nation_desc: "오스트레일리아의 수많은 학생이 몇 년이 지나도 도저히 갚을 수 없는 대출을 떠안아 신용 점수를 깎아 먹고, 정규직을 구하려 애쓰는 동안 머리 위에 무겁게 드리운 짐을 지고 있습니다. \n\n학자금 대출은 정부가 운영하는 제도로 옮겨 최대 60%까지 탕감할 수 있게 하고, 대출 기록에는 아무 흠도 남기지 않습니다. 누구도 교육과 생계 중 하나를 골라야 해서는 안 되며, 앞으로는 그럴 일이 없을 것입니다."
 AST_working_family_credits: "근로 가정 세액 공제"
 AST_working_family_credits_desc: "이전 정부가 새로운 세금으로 오스트레일리아 국민의 재산을 빼앗으려 했던 반면, 우리는 열심히 일하는 가정에 세액 공제로 보답하겠습니다. 저소득·중산층 가구는 급여의 더 많은 몫을 주머니에 지킬 수 있게 될 것입니다. 이들이 나라를 위해 해 온 일에 대한 작은 보상입니다."
 AST_childcare_for_all: "모두를 위한 보육"
 AST_childcare_for_all_desc: "보육 시설은 거의 산업혁명 이래 노동계급의 필수품이 되어 왔지만, 최근 몇 년 사이 점점 이용하기 어려워졌습니다. 우리 아이들의 복지에 가격표가 붙어서는 안 되며, 붙지 않을 것입니다. 도움이 필요한 가정에는 비용의 최대 90%를 보조하겠습니다."
 AST_restore_telstra: "텔스트라 복원"
 AST_restore_telstra_desc: "연방 수립과 함께 시작된 오래된 기업입니다. 텔스트라는 원래 국가의 전화망을 연결하는 정부 기관으로 출발했습니다. 그러나 민영화된 지금은 옛 모습의 껍데기만 남았습니다. 아직 우리가 과반 지분을 보유하고 있으니 손쓸 방법은 있습니다. \n\n나머지 텔스트라 지분을 팔아 치우려는 연합의 계획과 달리, 우리는 이 통신 회사를 계속 보유하면서 거기서 나오는 수익을 연구 개발, 기반 시설 사업, 복지 제도에 꾸준히 투입하려 합니다."
 AST_the_fair_care_act: "공정 의료법"
 AST_the_fair_care_act_desc: "이 법은 우리의 모든 개혁을 하나의 포괄적 패키지로 묶어 헌법에 명문화합니다. 전국 어디서나 이용할 수 있고 부담 가능한 공공 의료, 의학 연구 보조금, 수십 곳의 신규 병원, 노동자 보호가 담깁니다. 보편적 의료에 가장 가까운 제도이며, 다음 정부가 들어서도 쉽게 해체하지 못할 것입니다. 앞으로 수십 년간 더 건강하고 더 행복한 국민을 맞이하게 될 것입니다."
 AST_lathams_solution: "레이섬의 해법"
 AST_lathams_solution_desc: "언제나 지정학 전문가인 마크 레이섬이 망명 신청자 문제에 대한 평가를 제출하고 현재의 딜레마에 대한 대안을 제시했습니다. 크리스마스 섬을 아예 포기하는 대신, 대체 수용 시설을 마련하는 동안 긴급 팀을 보내 기존 시설을 보수하자는 것입니다. \n\n물론 시설이 우리 시설보다 더 나은 상태로 유지된다고 장담할 수는 없지만, 적어도 법적인 문제는 반대편으로 넘길 수 있을 것입니다."
 AST_shut_it_down: "중단시킨다"
 AST_shut_it_down_desc: "수문을 활짝 열 수는 없지만, 그렇다고 이들을 감옥 섬으로 보내 감시 속의 비참함 속에서 평생을 살게 할 수도 없습니다. 선택은 이분법이 아닙니다. 우리에게는 바로잡을 기회가 있고, 바로잡을 것입니다. 크리스마스 섬에 있는 이들은 내륙의 임시 거처로 옮기고, 당분간 심사 센터는 폐쇄합니다."
 AST_the_coastal_guard: "해안 경비대"
 AST_the_coastal_guard_desc: "통합된 국경 순찰대가 없어 우리의 안보는 ADF가 어설프게 떠맡아 왔습니다. 모든 종류의 위협에 맞서는 방벽이 되고, 적절한 전문성으로 밀입국 알선업자를 억제할 전담 기관을 설립하겠습니다."
 AST_indonesian_processing: "인도네시아 심사"
 AST_indonesian_processing_desc: "동티모르 개입 이후 인도네시아와의 관계는 꽤 민감해졌습니다. 그러나 그들은 우리의 심사 수요에 편리한 해법을 제시합니다. 수송과 수용이 쉬울 만큼 가깝고, 어떤 난민 협약에도 얽매여 있지 않습니다. \n\n역내 이민 안보를 위해 이제 앙금을 털고, 현재의 이주민 위기와 싸우는 친구이자 동반자로서 북쪽 이웃을 바라볼 때입니다."
 AST_local_housing: "지역 주거"
 AST_local_housing_desc: "국내 심사를 하면 국제 기준을 준수하면서도 훨씬 많은 망명 신청자를 수용할 수 있습니다. 우리 자체 기반 시설을 쓰는 데 따른 비용 절감은 말할 것도 없습니다. 퀸즐랜드에 지역 사회 주거 센터를 세우겠습니다. 호텔은 아니겠지만 이들이 전에 지내던 곳보다는 훨씬 나을 것입니다. \n\n부모 없는 아동을 위한 별도 시설도 마련합니다. 현지 주민들은 다소 불안해할 수 있지만, 당분간은 익숙해져야 할 것입니다."
 AST_expand_asio: "ASIO 확대"
 AST_expand_asio_desc: "우리 해역의 밀입국 알선업자 문제에 대한 가장 확실한 해법은 선제적인 방식입니다. 이 악당들이 우리 해역에 들어오기 전에 찾아내 붙잡는 것을 목적으로 하는 기동 대책반을 구성하면 문제를 원천에서 차단할 수 있습니다."
 AST_accelerate_the_intake: "수용 가속화"
 AST_accelerate_the_intake_desc: "우리는 이미 숙련 이민자를 외곽 지역의 일자리로 이동시키고, 일손이 절실한 지방 업체를 지원하는 프로그램을 운영하고 있습니다. 여기에 망명 프로그램을 연계해, 해당 집단 중 최소 대기 기간을 채우고 자격 요건을 충족한 이들을 대상으로 삼겠습니다. 이는 수용 능력 비용의 부담도 어느 정도 덜어 줄 것입니다."
 AST_befriend_the_west: "서방과의 친교"
 AST_befriend_the_west_desc: "우리는 그들과 함께 싸웠고, 그들과 함께 죽었습니다. 우리의 유대는 더없이 두텁습니다. 이런 성향 덕분에 옛 친구들이 우리의 외교 정책에 발맞추게 하기가 훨씬 쉬워지며, 해외 투자를 끌어오는 데 저항이 가장 적은 길이 될 수도 있습니다."
 AST_protect_the_east: "동쪽 보호"
 AST_protect_the_east_desc: "태평양의 새로운 경이는 정말 볼만하지만, 아무 준비 없이 뛰어들 수는 없습니다. 우리는 경탄하며 바라보되 한 걸음 떨어져서 볼 것입니다. 어떤 일에든 대비되어 있는 한, 몇몇 친구를 사귀는 것을 막을 것은 없습니다."
 AST_breadbasket_negotiations: "곡창 지대 협상"
 AST_breadbasket_negotiations_desc: "밀레니엄 가뭄의 여파가 계속되는 가운데, 우리의 임무는 농민들의 부담을 최대한 덜어 주는 것입니다. 영국 시장은 수출 파트너를 확보하고 시장 안정성을 지키는 동시에 그들의 영농 노하우로 혜택을 볼 기회를 제공합니다."
 AST_solid_rock: "단단한 반석"
 AST_solid_rock_desc: "80년대에 미국이 우리 호넷이 현대의 적 항공기를 찾아 추적하는 데 필요한 암호를 주기를 거부하자, 우리는 그들을 감시해 직접 암호를 가져왔습니다. 우리 군은 언제나 혁신에 소질이 있었고, 특히 영공 방어에서 앞으로 수십 년간 우리를 앞서가게 할 것은 바로 그런 사고방식입니다."
 AST_experts_abroad: "해외 전문가"
 AST_experts_abroad_desc: "우리가 손 놓고 있으면 남아시아는 우리 영향력의 사각지대로 서서히 변해 갈 것입니다. 그곳에서 더 많은 세계적 강국이 등장할수록 더욱 그렇습니다. 발판을 마련하는 전략 중 하나는 지식이라는 선물을 나누는 것이었습니다. 더 구체적으로는, 역내 개발도상국들이 연구 개발에 우리의 신규 졸업생들을 활용할 수 있게 하는 것입니다."
 AST_bomber_agreement: "폭격기 협정"
 AST_bomber_agreement_desc: "국방부 장관을 지낸 이후로 의회의 동료들 대부분이 저를 \\"폭격기 비즐리\\"라고 부르곤 합니다. 틀린 말은 아닙니다. 저는 우리 항공 교리에 어느 정도 집착하게 되었지만, 그럴 만한 이유가 있었습니다. 다목적 항공기의 필요성은 아무리 강조해도 지나치지 않으며, 고맙게도 영국의 친구들이 그런 우려를 덜어 줄 공동 연구 사업을 제안했습니다."
 AST_the_kinetic_connection: "무력 연대"
 AST_the_kinetic_connection_desc: "프랑스는 2차 대전 이래 자연스러운 동맹이었고, 최근 동티모르 개입 때도 우리의 노력을 지지했습니다. 당시 그들은 병참과 정보 면에서 우리를 도왔고, 이제 우리는 태평양에서 대테러 동맹이 필요한 처지가 되었습니다. 국제적으로 중요한 사안이라면 그들보다 손 내밀기 좋은 상대가 어디 있겠습니까."
 AST_hard_yakkas: "고된 일"
 AST_hard_yakkas_desc: "역사적으로 오스트레일리아는 진정한 해양 국가였던 적이 없습니다. 사방이 바다로 둘러싸인 나라로서는 역설적인 처지이지만, 관심이 없어서든 동맹국에 대한 순진한 의존 때문이든 우리 해군이 제대로 된 철학을 가져 본 적이 없는 것이 현실입니다. 우리의 규모에도 불구하고, 우리는 현대적 순양전함의 개념을 받아들여야 합니다. 우리 해안 근처에서의 어떤 적대 행위에도 상대적으로 공략 불가능한 억지력으로 작용하는, 막대한 화력을 지닌 함선 말입니다."
 AST_oil_field_lease: "유전 임대"
 AST_oil_field_lease_desc: "지난 몇 달간 우드사이드 에너지 그룹은 우리 행정부와 협력하여 인도네시아와의 협상을 중재해 왔으며, 이는 인도네시아가 한 해짜리 임대로 동자바 해안을 따라 시추할 수 있게 하는 내용입니다. 이 거래는 나라에 수십억을 가져오고 오스트레일리아 시추 노동자들의 일자리도 상당수 확보해 줄 것입니다. 우리가 이를 성사시킬 수만 있다면 말입니다."
 AST_keep_the_chips_flowing: "반도체 공급 유지"
 AST_keep_the_chips_flowing_desc: "대만이 인도·태평양의 궁극적 요충이라는 사실은 우리와 중국 모두에게 비밀이 아닙니다. 그 반도체에 의존하는 만큼, 우리는 의심할 여지 없이 미국의 전략적 입장에 얽매여 있습니다. 이 신흥의 지극히 경쟁적인 시장에서, 우리 자체 국내 생산 방식이 가동될 때까지는 납품이 계속되도록 보장해야 합니다."
 AST_the_white_elephant_defense: "흰 코끼리 방어"
 AST_the_white_elephant_defense_desc: "태국은 동남아시아에서 경제적·사회적 진보의 모범을 보이고 있습니다. 어쩌면 역내에서 가장 뛰어날지도 모릅니다. 권위주의의 물결을 막는 우리의 전략이 성공하려면 냉전 때처럼 그들이 우리 편에 서서 싸워 주어야 합니다. 그들의 태세를 시험하고 협력을 강화할 대규모 군사 훈련이면 충분할 것입니다."
 AST_expand_the_dca: "MOU 확대"
 AST_expand_the_dca_desc: "중국의 팽창을 억제하는 데 가장 좋은 위치에 있는 우리 파트너 중 하나가 필리핀입니다. 그들은 이 문제의 최전선에 있어 부담의 상당 부분을 떠안고 있습니다. 그들과 맺은 기존 협정인 양해각서(MOU)를 현대전에 필요한 모든 사항을 아우르도록 넓혀야 하며, 우선 그들의 방위 산업을 보완하는 일부터 시작합니다."
 AST_the_kiwi_defense: "키위 방어"
 AST_the_kiwi_defense_desc: "뉴질랜드는 지역 안보에서 다소 소파에 앉아 구경만 하는 존재가 되어, 자국 방위를 지나치게 우리에게 의존하고 있습니다. 그들에게 자체 조달을 더 밀어붙일수록 더 저항하는 듯합니다. 그들이 부담을 나눠 지게 하려면 우리가 지원 보조금을 주어야 할 것입니다."
 AST_pine_gap_agreement: "파인 갭 협정"
 AST_pine_gap_agreement_desc: "외딴 도시 앨리스스프링스 바로 바깥에는 공동 운영 군사 기지인 파인 갭이 있습니다. 그 용도를 두고 적잖은 음모론이 온라인에 어설프게 떠돌고 있지만, 실제로는 우리의 핵심 정보 감시 거점 중 하나입니다. 시설의 오래 미뤄진 개선은 마땅히 필요하지만, 공동 운영 기지인 만큼 먼저 미국 측에 개선안을 슬쩍 통과시켜야 합니다."
 AST_arsenal_of_diplomacy: "외교의 무기고"
 AST_arsenal_of_diplomacy_desc: "우리나라는 두 바다 사이라는 독특한 위치에서 두 초강대국 사이에 매여 있으며, 태평양 십여 개 나라의 수호자입니다. 우리의 목소리도 다른 많은 나라처럼 신흥국의 바다에 묻혀 가는 만큼, 우리의 외교는 군사력의 뒷받침을 받아야 합니다. 이 격동의 시기를 헤쳐 가려면 연성 권력과 경성 권력을 함께 내세워야 합니다."
 AST_assess_the_threat: "위협 평가"
 AST_assess_the_threat_desc: "다행히 포트 아서 학살 이후 그 정도 규모의 공격은 없었습니다. 그럼에도 조심해서 나쁠 것은 없습니다. 전문가와 주 정부 수장들로 위원회를 구성해 국가 대테러 위원회(NCTC)를 설립하겠습니다. ASIO 및 정보기관과 직접 협력해 모두의 안전을 지킬 긴급 대응과 전국 단위 전략을 조율합니다."
 AST_reinstate_the_oma: "OMA 복원"
 AST_reinstate_the_oma_desc: "연합이 다문화업무국(OMA)을 폐지하고 이민 문제를 뒷전으로 밀어낸 결정은, 수십 년 만에 우리나라가 받은 가장 큰 축복을 다루는 데 있어 실책이었습니다. 문화적으로 우리나라는 이민자 없이는 성립하지 않습니다. 시민권·다문화업무국을 설치해 밀려드는 신규 방문자를 감당하고 시민권 취득까지의 여정을 관리하려면 이 기관을 복원해야 합니다."
 AST_humint: "HUMINT"
 AST_humint_desc: "태평양에서의 우리 운영 모델은 홍보 담당자들 말대로 '인적 정보(HUMINT)'에 닻을 내리고 있습니다. 전자 감시와 달리 ASIS 모델은 인적 네트워크를 개발해 정보를 더 현장에 가까운 수준에 두는 방식으로 작동한다는 발상입니다. 우리 기관이 기술적 측면에 관여하지 않는다는 뜻은 아니지만, 정보 수집을 사이버 간섭에서 자유롭게 유지하는 데는 분명한 이점이 있습니다."
 AST_the_euro_pass: "유로패스"
 AST_the_euro_pass_desc: "국내의 대부분의 오스트레일리아인은 유럽 하면 전국을 휩쓴 유로비전의 컬트적 성공을 떠올릴 것입니다. 유럽이 통틀어 우리 연간 이민 수치의 절반을 차지하며 매년 100만 명을 넘는 방문자를 보낸다는 사실을 아는 이는 많지 않습니다. 버스째로 더 많이 들어오는 만큼, 바다 건너 친구들을 위해 절차를 더 쉽게 만들어야 합니다."
 AST_vegemite_and_stick_approach: "베지마이트와 채찍 접근법"
 AST_vegemite_and_stick_approach_desc: "지역 강국의 지위가 반드시 강압이나 군사적 위협으로 얻어져야 하는 것은 아닙니다. 태평양에서 우리의 호의는 우리의 너그러움과 이해심 덕분에 퍼졌습니다. 장학금, 스포츠 지원, 기후 대응 등 무엇이든 말만 하면 우리가 약소국을 도우러 거기에 있습니다."
 AST_beazley_stepping_down_tt: "§2정치 결정§! 탭에서 사임 선택지를 사용할 수 있게 됩니다."
 AST_beazley_stepping_down.1.t: "앞날을 향한 시선"
 AST_beazley_stepping_down.1.d: "정치는 온통 긴 하루와 늦은 밤뿐이었다. 가족이든 개인적 인연이든 아랑곳하지 않는 직업이었다. 그래서 이번 주말의 토요일은 킴에게 축복과도 같았다. 더 로지는 그가 살아 본 집 중 단연 가장 좋았고 가족들도 마음에 들어 하는 듯했지만, 또 한 번의 값진 로스트 요리를 먹으려 그들과 식탁에 앉은 그의 마음속에는 한 가지 생각이 맴돌았다. \n\n정치인들이 모든 결정을 내리고 종종 호되게 당하는 것은 당연한 결과였지만, 가족들도 타격을 입었고 때로는 더 심했다. 가족들은 그 어떤 일에도 발언권이 없었고, 킴은 수지의 눈에서 비슷한 것을 보았다. 좀처럼 가시지 않는 피로였다. 당을 위해 해 온 모든 일을 뒤로하고, 결국 이제 그만 물러날 때가 올지도 모른다는 생각이 들었다."
 AST_beazley_stepping_down.1.a: "어쩌면."
 AST_beazley_stepping_down.2.t: "노동당의 새로운 얼굴"
 AST_beazley_stepping_down.2.d: "비즐리가 의사당 밖에서 작별 인사를 하고, 마지막 연설 내내 눈물을 닦던 가족들이 곁에 선 가운데, 노동당의 새 얼굴이 연단에 올랐습니다. \n\n노동당 상층부에서는 비교적 신참인 케빈 러드는 은퇴설이 불거진 지 불과 몇 주 만에 당 내부 인사들에 의해 새 선두 주자로 지목되었습니다. 이제 그 추측이 사실로 확인되자, 러드는 지체 없이 노동당의 옛 통치 방식을 이어 가되 새로운 세계 질서의 규칙에 적응하겠다는 뜻을 밝혔습니다. 진행 중인 기후 위기에 대한 대응을 강조했습니다. 또 사이먼 크린의 부대표 사임으로 줄리아 길러드가 승격하면서, 이 나라에서 두 번째로 높은 공직을 여성이 맡는 것은 처음입니다."
 AST_beazley_stepping_down.2.a: "성 케빈이 오셨다."
 beazley_stepping_down_decision_tt: "§Y중점 트리가 바뀝니다. \n\n케빈 러드가 노동당 대표가 됩니다.§!"
 beazley_stepping_down_decision: "퇴진"
 AST_latham_gov_events.1.t: "화려한 서막"
 AST_latham_gov_events.1.d: "커튼을 밀치고 나아간 마크의 앞에는 지지자와 반대자가 뒤섞인 홀이 가득했다. 그래도 지지자들의 목소리가 더 컸다. \n\n재닌이 그의 손을 꼭 쥐었다. 그녀는 정치인의 아내로서 할 수 있는 것 이상을 그의 선거운동에 해 주었다. 반대론자의 바다 속 섬 같은 존재였다. 묘하게도 오늘 밤은 반대자들이 조용했다. 마크는 아직 당에서 비교적 신참이었고, 사실 43세로 80여 년 만에 가장 젊은 총리가 될 터였지만, 그는 노동당을 무의미의 늪에서 되살려 놓았다. 오늘 밤 그 방에서 그는 왕이었다. \n\n마이크 앞으로 걸음을 옮기자 머릿속에 준비해 둔 연설문은 순식간에 증발했다. 이런 때는 미리 짜 둔 헛소리 이상의 것, 더 짜릿한 무언가가 필요했다. 그의 임기는 다른 임기들과 다를 테니, 시작부터 그렇게 할 이유가 어디 있겠는가. 그는 연단에서 마이크를 집어 들고 무대를 오가기 시작했고, 순회 설교자처럼 마이크를 입 쪽으로 끌어당겼다."
 AST_latham_gov_events.1.a: "\\"신사 숙녀 여러분, 우리가 해냈습니다!\\""
 AST_latham_gov_events.2.t: "당내 반발"
 AST_latham_gov_events.2.d: "의회에서의 하루는 매일 당 내부의 또 다른 싸움으로 시작됐다. 노동당의 파벌주의는 마크가 상대할 의향도 신경 쓸 마음도 없는 것이었다. 그런 체제는 깨져야 마땅했다. 그의 눈에 당은 지도자에게 복종해야 하는 존재였지, 그 반대가 아니었다. \n\n연달아 두 번 당을 승리로 이끌지 못했음에도, 킴 비즐리는 여전히 영향력을 써서 레이섬의 보건 정책을 조목조목 뜯어고치려 했고, 사무실 회의는 또 한 번 고함 싸움이 되고 말았다. 레이섬이 보기에 킴이 예산을 쥐게 되면 나라를 파산시킬 것이었고, 킴과 나머지 노동 우파는 현재의 계획으로는 충분하지 않을 것이라고 완강히 주장했다. \n\n물러서지 않은 채 비즐리는 결국 박차고 나갔다. 그가 나가자 레이섬은 머그잔 하나를 집어 문에 던져 박살 냈다. 당의 절반이 반대표를 던지는 상황에서 메디케어 개혁은 하원에 상정조차 할 수 없었다."
 AST_latham_gov_events.2.a: "정말 나쁜 출발이다."
 meticulous: "꼼꼼함"
 AST_latham_newleader_tt: "§Y제니 매클린이 지도부를 넘겨받습니다.§!"
 AST_latham_gov_events.3.t: "쓰러짐"
 AST_latham_gov_events.3.d: "의사당 회의장이 비어 있을 때는 레이섬이 당내 소란에서 벗어나 홀로 시간을 보낼 수 있는 순간이 되었다. 이때 그의 사적인 영역에 들어올 수 있는 사람은 드물었다. 그중 한 사람이 그의 부대표였다. \n\n그녀가 메디케어 골드 법안을 놓고 나머지 당원들을 설득할 전략을 펼쳐 보이는 동안, 레이섬은 제니 매클린과 일하는 자신의 행운을 곱씹었다. 그는 대개 유능한 여성들에게 둘러싸여 있었지만 제니는 그중에서도 단연 으뜸이었다. 내각에서 꼼꼼함과 추진력 면에서 그녀만큼 만만찮은 이는 드물었다. 노동당 지도부가 무너지는 와중에도 어떻게 살아남았는지는 그 자체로 경이로운 일이었고, 그녀의 말이 길어질수록 그는 그 계획에 더 확신이 들었다. \n\n레이섬은 그녀가 이어 가는 동안 고개를 끄덕였고, 그녀가 줄지어 늘어선 좌석을 따라 걸으며 다음 단계를 설명하던 중, 등 뒤에서 쿵 하는 큰 소리가 울렸다. 제니가 돌아보니 레이섬이 바닥에 쓰러져 몸을 웅크리고 있었다. 그는 장비 몇 개를 쓰러뜨렸고, 얼굴은 고통으로 일그러져 있었다."
 AST_latham_gov_events.3.a: "\\"뭔가 잘못됐어.\\""
 AST_latham_gov_events.4.t: "병원에 실려 간 총리"
 AST_latham_gov_events.4.d: "총리가 의회에서 쓰러진 것으로 보인 뒤 구급차들이 호위를 받으며 캔버라 병원으로 향하는 모습이 목격되었습니다. 그의 상태에 관해서는 거의 발표된 바가 없으나, 전문가들은 작년 레이섬이 앓은 급성 췌장염과의 유사점을 지적하며 이번에도 생명을 위협하는 같은 질환일 가능성이 있다고 판단했습니다. \n\n제니 매클린 부총리가 레이섬이 직무를 수행할 수 없는 동안 지도부 자리를 맡을 것으로 예상됩니다. 총리가 병원으로 급히 이송된 것은 이번이 처음은 아니지만, 노동당의 이른 정권 복귀에 불안한 선례를 남기고 있습니다."
 AST_latham_gov_events.4.a: "끔찍한 상황이다."
 AST_latham_gov_events.5.t: "비참함"
 AST_latham_gov_events.5.d: "레이섬이 병상에 누워 지낸 지 어느새 2주가 되었다. 병원 직원들은 친절했지만 계속되는 방해와 수면 부족 탓에 날들이 하나로 뭉개져 버렸다. 바깥세상과 이어 주는 주된 끈은 벽에 걸린 TV였는데, 거기서는 나쁜 소식만 나오는 듯했다. \n\n내각이 그의 병환을 눈치채자 교체되는 것은 시간문제였다. 매클린에게는 당에서 필요한 영향력이 없었고, 그래서 반대파들은 믿을 만한 옛 카드로 되돌아갔다. \n\n레이섬은 침대에서 몸을 일으켜 킴 비즐리에게 표를 던진 의원들을 모조리 목 졸라 죽이고 싶었지만, 표결은 사실상 만장일치였고, 그러려면 당 전체를 처치해야 한다는 뜻이었다. 이런 몸으로는 아무것도 할 수 없었고, 총리 자리는 이미 사실상 비어 있었다. 이제 그는 당과 나라가 자신을 두고 떠나가는 모습을 지켜보는 처지로 내몰렸다."
 AST_latham_gov_events.5.a: "전부 헛된 일이었나?"
 AST_latham_gov_events.6.t: "취임 선서를 한 노동당의 새 총리"
 AST_latham_gov_events.6.d: "마크 레이섬이 불운하게도 입원한 이후, 당의 원로 킴 비즐리가 지도자 자리를 이어받게 되었으며 오늘 아침 총독을 만나 취임 선서를 했습니다. \n\n레이섬을 대신해 직무를 수행하던 전임 부총리 제니 매클린은 표결 뒤 그 자리에서 물러났고, 당 내에서 지도부 다툼이 벌어질 기미는 전혀 없었습니다. 1996년과 2001년 선거에서 하워드 정부에 맞선 비즐리의 이전 선거 운동이 모두 실패로 끝난 만큼, 이번의 갑작스러운 부상은 전직이자 현직 대표인 그에게 새로운 기회가 되고 있습니다. 레이섬의 가족은 이번 일에 대해 입장을 밝히지 않았지만, 비즐리는 총리로서 한 첫 연설에서 \\"비극적인 상황\\"을 언급하며 가족에게 지원을 약속했습니다."
 AST_latham_gov_events.6.a: "새로운 얼굴, 똑같은 노동당."
 education_funding_redistribution_ast: "교육 재정 재분배"
 medicare_gold_ast: "메디케어 골드"
 latham_legislation_not_blocked: "당이 우리 법안을 막지 않고 있습니다."
 troop_pullback_ast: "병력 철수"
 troop_cycling_ast: "병력 순환"
 stemmed_migration_flow_ast: "억제된 이주 흐름"
 AST_latham_gov_events.7.t: "당의 변화"
 AST_latham_gov_events.7.d: "이 이벤트가 보인다면 무언가 고장난 것입니다. 디스코드에 버그로 제보해 주세요."
 latham_legislation_not_blocked_tt: "당이 막고 있는 동안에는 메디케어 골드를 통과시킬 수 없습니다."
 kim_beazley_desc: "퍼스에서 태어나 같은 이름을 가진 영향력 있는 아버지의 이름을 물려받은 킴 크리스천 비즐리는 훗날 웨스턴오스트레일리아 대학교에서, 이어 옥스퍼드의 베일리얼 칼리지에서 공부했습니다. 토니 블레어 같은 이들과 한방을 쓰다가 오스트레일리아로 돌아와, 1945년 이래 나라를 이끌어 온 정치 가문의 명맥을 이었습니다. \n\n1980년 스완 지역구에서 당선되어 의원직을 맡은 킴은 화려한 밥 호크와 폴 키팅 아래에서 노동당이 다시 영광을 되찾는 것을 지켜보는 행운을 누렸고, 그 성공이 흐지부지 사그라지는 불운도 겪었습니다. 노동당의 황금기는 이제 지나갔지만, 그렇다고 해서 킴이 확고한 악수 하나하나로 당의 노선을 앞으로 끌어당기려는 노력을 멈추지는 않았습니다. \n\n언제나 노동당 사람으로서 킴은 강한 산업 기반에 뒷받침되는 점진적 지출을 통한 신중한 정부를 옹호해 왔습니다. \n\n그림자 내각에서 오랜 재임 기간 내내 '온화한 거인'이라는 태도로 알려졌지만, 킴은 자신을 뒷받침하는 정책을 지키려면 군사적으로 더 강한 오스트레일리아가 필요하다고 인식해 왔습니다. 어떤 자리에 있든 그가 추구해 온 입장입니다."
 AST_latham_government: "레이섬 정부"
 AST_latham_government_desc: "선거 운동 기간 동안 오스트레일리아 전역을 돌아다닐 때 만난 사람들은 자신들이 한 번도 받지 못한 의료에 대해 이야기했습니다. 일자리가 말라 버린 마을에 대해 이야기했습니다. 잃어버린 삶의 목적과, 사라져 가는 나라에 대한 자부심을 이야기했습니다. \n\n이 나라 국민에게는 다시 믿을 수 있는 정부가 필요합니다. 미래에 대한 희망을 주고, 오늘 변화를 일으킬 품위와 실행력을 갖춘 정부입니다. 다른 어떤 것을 택하기에는 사안이 너무나 시급합니다."
 AST_deliver_the_change: "변화의 실현"
 AST_deliver_the_change_desc: "우리가 처음 내놓는 조치는 가장 강력한 타격을 주어야 합니다. 우리는 엘리트 부유층 사립학교의 '표적 명단'을 작성했으며, 이를 이용해 재정을 지원이 부족한 학교, 특히 교육 순위에서 기대에 못 미치는 학교로 돌릴 수 있습니다."
 AST_work_with_the_clubs: "클럽과의 협력"
 AST_work_with_the_clubs_desc: "끔찍한 희망의 부재가 우리 청년들을 삼켜 버렸습니다. 도시화와 함께 더욱 심해진 고립주의의 확산이 그들의 미래를 앗아 갔습니다. 학교와 일자리가 그들을 저버려도 동네 클럽만은 그러지 않을 것입니다. 지역 센터 및 스포츠 클럽과 협력해, 젊은 오스트레일리아인들이 필요한 지원 프로그램과 함께 지역에서 자기 자리를 찾을 공간을 마련하겠습니다."
 AST_a_healthy_populous: "건강한 국민"
 AST_a_healthy_populous_desc: "오스트레일리아인으로서 우리는 분명 우리의 부를 더 잘 쓸 수 있습니다. 메디케어 같은 제도에는 전환이 필요합니다. 우리는 노인에게 무료로 진료를 제공하고, 고령자의 대기자 명단을 없애며, 공공 치과 서비스를 복원하는 메디케어 골드 프로그램을 만들고 있습니다. 내일도, 내년도 아닙니다. 오늘입니다."
 AST_keep_the_promises: "공약 이행"
 AST_keep_the_promises_desc: "우리 행정부의 기조를 세우면서, 우리는 귀 기울이고 약속을 지키는 정부가 되겠다고 국민에게 약속했습니다. 고령 유권자들을 우리 편으로 끌어들인 요소 중 하나가 '조부모 수당'이었습니다. 이들이 주 양육자라면 손주 한 명당 매주 20달러를 특별 지급받게 됩니다. 임기의 작지만 상징적인 출발이며, 우리가 이 직책에 진지하게 임하고 있음을 국민에게 상기시켜 줍니다."
 AST_bring_them_home: "그들을 집으로"
 AST_bring_them_home_desc: "존 하워드가 집권한 이래 우리 군대는 세계 거의 모든 구석에 가 있습니다. 그는 그곳에 가서 몇몇 사람에게 아첨하고 머리를 쓰다듬는 칭찬을 받았습니다. 그사이 우리 청년들은 어느 깡촌의 흙구덩이 한 뼘을 지키다 죽어 갔습니다. 이런 해외 공약이 오스트레일리아인의 목숨과 복지를 계속 갉아먹는 한, 이를 그대로 둘 수 없습니다. 이제 그들이 돌아올 때입니다."
 AST_the_rescue_plan: "구조 계획"
 AST_the_rescue_plan_desc: "우리의 평화 유지군 파병에는 다 이유가 있습니다. 이상적이지는 않지만, 세계 여러 지역에 공백을 만드는 것은 해결할 문제보다 더 많은 문제를 낳을 것입니다. 단계적 철수 프로그램을 시작해, 현지 정부가 안보 공백을 메우는 데 필요한 시간을 갖도록 하겠습니다."
 AST_ease_the_squeeze: "압박 완화"
 AST_ease_the_squeeze_desc: "오스트레일리아의 중산층은 다른 어느 계층보다 우리 세제의 압박을 크게 느끼고 있습니다. 자유당의 숨통을 조이는 조세 정책은 공정한 부를 쌓으려는 많은 이들을 밀어냈으며, 점점 높아지는 세율은 부를 아래로 흘려보내는 수단이기보다 부자를 더 부유하게 만드는 수단이 되었습니다. 균형이 마련되어야 하며, 무엇보다 중산층을 대변해 나설 누군가가 필요합니다."
 AST_preserve_the_culture: "문화 보존"
 AST_preserve_the_culture_desc: "요즘 같은 시대에 다문화주의를 조금이라도 비판하는 것은 금기가 되었지만, 무능한 정치 놀음으로는 주택 가격 폭등과 퇴보하는 문화에서 우리를 구할 수 없습니다. 오스트레일리아인과 오스트레일리아 문화에 우선순위를 두어야 합니다. 이민자는 일정 수준 이상으로 언어를 구사할 것이 기대되어야 하며, 유입은 대폭 줄여야 합니다. 적어도 상황을 더 잘 파악할 수 있을 때까지는 말입니다."
 AST_freer_speech: "더 자유로운 발언"
 AST_freer_speech_desc: "저는 밋밋한 정치인이 아닙니다. 그 때문에 언론과 여러 번 곤경에 처했습니다. 우리 헌법으로 보호받아야 할 바로 그 발언의 자유가 위협받고 있다는 것이 현실입니다. 정치적 올바름은 우리 시대 최대의 싸움이 되었고, 그 전투에 칼을 들고 나서지 않고는 이끌어 갈 수 없습니다."
 AST_safer_streets: "더 안전한 거리"
 AST_safer_streets_desc: "중요하지 않은 사안에 대한 단속을 풀어 주는 대신, 방향을 바꿔 강력 범죄를 단속하겠습니다. 갱단과 조직범죄가 가장 강력한 표적이 될 것입니다. 깨끗한 거리 할당량이 주어질 것이며 국민의 위임을 따를 것입니다."
 AST_in_with_the_new: "새것의 도입"
 AST_in_with_the_new_desc: "노동 우파를 다시 우리 손아귀에 넣었으니, 이제 새로운 당헌 초안 작성을 추진할 수 있습니다."
 telstra_sold_ast: "텔스트라가 매각되었습니다."
 mark_latham_desc: "선구적인 비전가, 선동가, 불안정한 사람, 종잡을 수 없는 사람. 요일에 따라 마크 레이섬을 묘사하는 데 이 모든 말을 쓸 수 있습니다. \n\n젊은 시절 마크는 경제학 학사 학위를 바탕으로 1980년부터 1982년까지 노동당 정치인 존 커린의 고문이 되었습니다. 이후 전직 총리 고프 휘틀럼의 연구 보조원이 되었고, 리버풀 시의회 시장을 지냈습니다. \n\n아마도 럭비 유니언 선수로 뛴 경력에서 그가 공격적인 의회 스타일을 즐기게 되었을 것입니다. 노동당 야당 대표로 당을 이끄는 동안 스스로를 \\"증오하는 자\\"라고 칭했습니다. 이 자리는 2003년 오랜 라이벌 킴 비즐리의 손아귀에서 빼앗아 낸 것입니다. 그 뒤로 그는 당을 평범한 사람들의 귀로 바꾸려 애써 왔습니다. 포퓰리즘과 반문화적 논점을 섞어 달성한, 어려운 이들을 위한 \\"기회의 사다리\\"였습니다. \n\n마크의 야망에 너무 높은 언덕은 없고, 그의 진흙탕 싸움에 너무 깊은 진창은 없습니다. 당은 그의 등장을 견뎌 내야 합니다."