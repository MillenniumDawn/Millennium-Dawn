 ROM_ukrainian_ultimatum: "키이우에 대한 최후통첩"
 ROM_ukrainian_ultimatum_desc: "체르니우치와 부자크는 루마니아의 땅입니다. 키이우는 너무 약해 우리를 거절할 수 없으니, 다른 누군가가 나서기 전에 우리의 영유권을 주장해야 합니다."
 ROM_ukrainian_border_lands_category: "북부 부코비나와 부자크"
 ROM_annex_bukovina_budjak: "동포의 부름에 응답하라"
 ROM_annex_bukovina_budjak_desc: "체르니우치와 부자크에 대한 우크라이나의 권위는 무너졌습니다. 현지 루마니아인 평의회는 부쿠레슈티에 통합을 승인해 달라고 요청하고 있으며, 키이우에는 이를 거부할 자가 아무도 남아 있지 않습니다."
 ROM_333_return: "부자크의 루마니아화"
 ROM_333_return_desc: "부자크는 수십 년간 루마니아의 땅이 아니었습니다. 현지 주민이 부쿠레슈티의 통치에 순응하게 된 지금, 우리는 이 과업을 완수할 수 있습니다."
 ROM_335_return: "북부 부코비나의 루마니아화"
 ROM_335_return_desc: "북부 부코비나는 1940년 소련의 최후통첩으로 우리에게서 떨어져 나갔습니다. 해당 지방의 순응을 확보했으니, 우리는 재통합을 영구적인 것으로 만들 수 있습니다."
 ROM_ukrainian_autonomies: "카르파티 행정"
 ROM_ukrainian_autonomies_desc: "수복한 우크라이나 접경 지구를 현지 평의회를 통해 통치하면 호의를 얻고 통합을 앞당길 수 있으나, 그 대가로 재정 통제가 느슨해지고 이 방식에 대한 대중의 인내심이 줄어듭니다."
 romania_misc.20.t: "체르니우치와 부자크의 평의회"
 romania_misc.20.d: "키이우가 수도에서 이토록 먼 곳까지 권위를 미치지 못하는 가운데, 체르니우치와 부자크의 지방 의회는 루마니아와의 통합을 추진하기로 의결했습니다. 부쿠레슈티는 기꺼이 이에 응할 것입니다."
 romania_misc.20.a: "고향으로 환영하자"
 romania_misc.21.t: "새로운 영토의 통치"
 romania_misc.21.d: "체르니우치와 부자크는 지도상으로는 루마니아입니다. 이를 제대로 기능하는 행정으로 바꾸는 일은 또 다른 문제이며, 정부는 얼마나 강력한 통제를 가할지 결정해야 합니다."
 romania_misc.21.a: "현지 평의회를 통해 통치한다"
 romania_misc.21.b: "부쿠레슈티의 직접 통치"
