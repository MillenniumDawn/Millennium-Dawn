 TAI_pc_industry_events.4.t: "MSI Enters the Notebook Market"
 TAI_pc_industry_events.4.d: "Micro-Star International has built its reputation on motherboards and add-in cards. The M510C notebook points toward complete systems, but the company can still deepen its component specialty or pursue a more demanding server portfolio."
 TAI_pc_industry_events.4.a: "Commit to notebook systems"
