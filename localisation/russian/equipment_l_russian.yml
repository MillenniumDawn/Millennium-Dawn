 CYP_infantry_weapons_6_desc: "Heckler & Koch HK416 — штурмовая винтовка с газоотводной автоматикой под патрон 5,56x45 мм НАТО. Она разработана и производится немецкой компанией Heckler & Koch. Хотя конструкция основана на оружии класса AR-15, в ней используется фирменная газопоршневая система с коротким ходом поршня от более раннего семейства винтовок G36 компании Heckler & Koch. HK416 также оснащается фирменным цевьём с направляющими со всех четырёх сторон для установки различных аксессуаров."
 LIC_infantry_weapons_2_desc: "Heckler & Koch G3 (Gewehr 3) — это автоматическая боевая винтовка калибра 7,62x51 мм НАТО, разработанная в Западной Германии в 1950-х годах немецким производителем вооружений Heckler & Koch (H&K) в сотрудничестве с испанским государственным конструкторским агентством CETME. G3 заменила FN FAL/G1 в качестве стандартной винтовки с 1959 года и использовалась до модернизации до улучшенной модели G3A1 в 1963 году."
 LIC_infantry_weapons_3_desc: "Разработка винтовки M16A2 была первоначально запрошена Корпусом морской пехоты США по итогам боевого опыта во Вьетнаме с XM16E1 и M16A1. Она была официально принята на вооружение Министерством обороны под обозначением «Винтовка США калибра 5,56 мм, M16A2» в 1982 году. Морская пехота стала первым видом Вооружённых сил США, принявшим её на вооружение, в начале/середине 1980-х годов, а Армия США последовала её примеру в конце 1980-х."
 LIC_infantry_weapons_4_desc: "Heckler & Koch G36 (Gewehr 36) — штурмовая винтовка под патрон 5,56x45 мм, разработанная в начале 1990-х годов немецким производителем оружия Heckler & Koch на замену более тяжёлым моделям G3 под патрон 7,62x51 мм. Она была принята на вооружение бундесвера в середине 90-х, заменив G3. С тех пор она также стала популярным экспортным товаром, и G36 состоит на вооружении военных и полицейских подразделений ряда стран, включая Германию, Испанию и Великобританию."
