l_russian:
 equipment_doctrine_folder: "Доктрина оснащения"
 GRAND_DOCTRINE_LOCAL_AIRSPACE_DEFENCE: "Местная противовоздушная оборона"
 GRAND_DOCTRINE_AIR_SUPREMACY: "Превосходство в воздухе"
 GRAND_DOCTRINE_MIXED_ROLE: "Смешанная роль"
 GRAND_DOCTRINE_COMBINED_ARMS: "Общевойсковой бой"
 GRAND_DOCTRINE_SHOCK_AND_AWE: "Шок и трепет"
 GRAND_DOCTRINE_SHOCK_AND_AWE_DESC: "Эта великая доктрина организует сухопутные операции вокруг быстрого, концентрированного применения боевой мощи для достижения решающих оперативных эффектов. Концепции шока и трепета делают акцент на темпе, доминировании и скоординированном применении сил."
 GRAND_DOCTRINE_DEFENCE_IN_DEPTH: "Глубокая оборона"
 GRAND_DOCTRINE_DEFENCE_IN_DEPTH_DESC: "Эта великая доктрина структурирует сухопутную оборону посредством эшелонированных позиций и применения сил на основе глубины по всему театру военных действий. Концепции обороны в глубину подчёркивают непрерывную оборонительную связность и контролируемое оперативное пространство."
 GRAND_DOCTRINE_MISSION_COMMAND: "Командование по задачам"
 GRAND_DOCTRINE_MISSION_COMMAND_DESC: "Эта великая доктрина структурирует сухопутные войска вокруг делегированной власти, руководствующейся чёткими намерениями и определёнными целями. Концепции командования по задачам подчёркивают инициативу и скоординированное выполнение на нескольких эшелонах."
 GRAND_DOCTRINE_GUERRILLA_WARFARE: "Партизанская война"
 GRAND_DOCTRINE_GUERRILLA_WARFARE_DESC: "Эта великая доктрина организует сухопутные операции вокруг нерегулярных сил, ведущих рассредоточенные и продолжительные боевые действия. Концепции партизанской войны делают упор на локальную организацию и постоянное давление в условиях оспариваемых территорий."
 GRAND_DOCTRINE_EQUIPMENT_MIXED: "Смешанное оснащение"
 GRAND_DOCTRINE_EQUIPMENT_MIXED_DESC: "Эта великая доктрина организует оснащение войск, комбинируя различные системы для поддержки разнообразных оперативных требований. Концепции смешанного снаряжения подчёркивают гибкость в оснащении формирований для различных боевых ролей."
 GRAND_DOCTRINE_EQUIPMENT_LIGHT: "Лёгкое оснащение"
 GRAND_DOCTRINE_EQUIPMENT_HEAVY: "Тяжёлое оснащение"
 GRAND_DOCTRINE_EQUIPMENT_MOBILE: "Подвижное оснащение"
 GRAND_DOCTRINE_EQUIPMENT_FIRES: "Оснащение для огневой поддержки"
 GRAND_DOCTRINE_EQUIPMENT_FULL: "Полное оснащение"
 GRAND_DOCTRINE_BLUE_WATER: "Флот открытого моря"
 GRAND_DOCTRINE_GREEN_WATER: "Прибрежный флот"
 GRAND_DOCTRINE_JEUNE_ECOLE: "Молодая школа"
 GRAND_DOCTRINE_GUERRE_DE_COURSE: "Корсарская война"
 GRAND_DOCTRINE_COMBINED_ARMS_DESC: "Эта великая доктрина организует сухопутные войска вокруг интегрированного использования манёвра, огневой поддержки и элементов снабжения. Концепции общевойскового боя подчёркивают синхронизированные действия различных формирований для создания цельного эффекта на поле боя."
 DOCTRINE_TRACK_SPECIAL_FORCES_MARINES: "Специальные силы морской пехоты"
 DOCTRINE_TRACK_MARINES_MASSIVE_FORCES: "Силы морской пехоты"
 DOCTRINE_TRACK_AIRBORN_FORCES: "Воздушно-десантные роты"
 DOCTRINE_TRACK_AIRBORN_OPERATIONS: "Десантные операции"
 DOCTRINE_TRACK_RANGER_FORCES: "Специальный полк рейнджеров"
 DOCTRINE_TRACK_TRAINING_AND_OPS: "Подготовка и операции"
 DOCTRINE_TRACK_AIRCRAFT_DESIGN: "Проектирование самолётов"
 DOCTRINE_TRACK_MULTIROLE_AIRCRAFT: "Многоцелевые самолёты"
 DOCTRINE_TRACK_INFANTRY_EQP: "Пехотное снаряжение"
 DOCTRINE_TRACK_MOTORIZED_EQP: "Моторизованное снаряжение"
 DOCTRINE_TRACK_MECHANIZED_EQP: "Механизированное снаряжение"
 DOCTRINE_TRACK_ARMORED_EQP: "Бронетехника"
 DOCTRINE_TRACK_FIRES_EQP: "Артиллерийская и огневая поддержка"
 DOCTRINE_TRACK_AIRMOB_EQP: "Воздушно-мобильное снаряжение"
 DOCTRINE_TRACK_OPERAITONAL_THEORY: "Оперативная теория"
 DOCTRINE_TRACK_DEDICATED_DOCTRINE: "Специализированная доктрина"
 DOCTRINE_TRACK_TRAINING: "Подготовка"
 DOCTRINE_TRACK_LEADERSHIP: "Командование"
 DOCTRINE_TRACK_TECHNOLOGY: "Технологии"
 DOCTRINE_TRACK_STRUCTURE: "Структура"
 DOCTRINE_TRACK_CAPITAL: "Крупные корабли"
 DOCTRINE_TRACK_ESCORT: "Эскортные корабли"
 DOCTRINE_TRACK_SUPPORT: "Корабли поддержки"
 MARINE_SPECIAL_FORCES: "Быстрый морской десант"
 MARINE_SPECIAL_FORCES_DESC: "Эта доктрина готовит лёгкую морскую пехоту к быстрой высадке и переправе через реки. Концепция быстрого штурма делает упор на скорость, мобильность и захват берега до того, как противник успеет отреагировать."
 MARINE_MASSIVE_FORCES: "Массированные десантные силы"
 MARINE_SPECIAL_FORCES_MASSIVE_DESC: "Эта доктрина организует лёгкую и моторизованную морскую пехоту в крупные формирования, предназначенные для длительных крупномасштабных десантных операций. Концепции массированной высадки делают упор на возможности вторжения, эффективность обучения и численное превосходство на берегу."
 RANGER_FORCES_DOCTRINES: "Лесные рейнджеры"
 RANGER_FORCES_DOCTRINES_DESC: "Эта доктрина обучает рейнджеров вести боевые действия в густом лесу, используя укрытие деревьев для засад, незаметного отступления и нанесения урона противнику, который их не видит. В лесных условиях особое внимание уделяется маскировке, свободе передвижения вне дорог и упорной обороне с подготовленных позиций."
 SUBDOCTRINE_OPERATIONS_CENTRAL_COMMAND: "Централизованное командование"
 SUBDOCTRINE_OPERATIONS_CENTRAL_COMMAND_DESC: "Данная доктрина передаёт воздушные операции под единое центральное командование, где планирование, определение приоритетов и выполнение задач осуществляются из единого центра. Централизованное командование обеспечивает согласованность оперативных намерений и скоординированное применение военно-воздушных сил на всём театре военных действий."
 SUBDOCTRINE_OPERATIONS_DETACHED_COMMAND: "Отдельное командование"
 SUBDOCTRINE_OPERATIONS_DETACHED_COMMAND_DESC: "Эта доктрина передаёт воздушные операции полунезависимым командованиям, предоставляя делегированные полномочия по планированию и выполнению в пределах определённых оперативных границ. Отдельное командование позволяет принимать решения на местном уровне, сохраняя при этом соответствие общим стратегическим целям."
 SUBDOCTRINE_OPERATIONS_NAVAL_AIR: "Военно-морское командование"
 SUBDOCTRINE_OPERATIONS_NAVAL_AIR_DESC: "Данная доктрина объединяет воздушные операции в рамках военно-морских командных структур, согласовывая планирование и выполнение задач в области применения воздушной мощи с морскими целями. Военно-морское командование обеспечивает скоординированное использование воздушных средств в поддержку операций флота и контроля над морской сферой."
 SUBDOCTRINE_DESIGN_MULTIROLE: "Многоцелевые конструкции"
 SUBDOCTRINE_DESIGN_MULTIROLE_DESC: "Эта доктрина делает акцент на разработке самолётов, способных выполнять несколько типов задач на одной платформе. Многоцелевые конструкции отдают приоритет адаптивности и интегрированным системам для поддержки широкого спектра оперативных требований во всём воздушном пространстве."
 SUBDOCTRINE_DESIGN_DEDICATED: "Специализированные разработки"
 SUBDOCTRINE_DESIGN_DEDICATED_DESC: "Данная доктрина сосредоточена на разработке летательных аппаратов, оптимизированных для выполнения конкретной оперативной задачи. Специализированные конструкции подчёркивают специализацию и индивидуально подобранные характеристики для удовлетворения чётко определённых требований к выполнению задач в воздушном пространстве."
 SUBDOCTRINE_DESIGN_HEAVY: "Тяжёлые конструкции"
 SUBDOCTRINE_DESIGN_HEAVY_DESC: "В этой доктрине особое внимание уделяется разработке крупных и надёжных конструкций самолётов, ориентированных на продолжительность полёта, грузоподъёмность и постоянное оперативное присутствие. В тяжёлых конструкциях приоритет отдаётся прочности конструкции и интегрированным системам для поддержки сложных воздушных операций."
 SUBDOCTRINE_DESIGN_DRONE: "Проекты дронов"
 SUBDOCTRINE_HEAVY_STRATEGIC_BOMBER: "Стратегические бомбардировщики"
 SUBDOCTRINE_HEAVY_STRATEGIC_BOMBER_DESC: "Эта доктрина фокусируется на разработке самолётов, предназначенных для стратегических ударных операций на большие расстояния. Стратегические бомбардировщики предназначены для обеспечения устойчивой воздушной мощи на огромных расстояниях в поддержку всеохватывающих военных целей."
 SUBDOCTRINE_HEAVY_NAVAL_BOMBERS: "Морские бомбардировщики"
 SUBDOCTRINE_HEAVY_NAVAL_BOMBERS_DESC: "В этой доктрине особое внимание уделяется разработке самолётов, предназначенных для действий в тесной координации с военно-морскими силами. Конструкции морских бомбардировщиков ориентированы на расширение влияния авиации над морской средой в поддержку военно-морских операций и целей контроля над морем."
 SUBDOCTRINE_HEAVY_GUNSHIPS: "Тяжёлый ганшип"
 SUBDOCTRINE_HEAVY_GUNSHIPS_DESC: "Эта доктрина фокусируется на разработке тяжеловооружённых самолётов, предназначенных для обеспечения устойчивой огневой мощи в воздухе. Конструкции тяжёлых ганшипов подчёркивают интегрированные системы вооружения и длительное присутствие для поддержки воздушных операций в сложных условиях."
 SUBDOCTRINE_MULTIROLE_MIXED: "Смешанные многоцелевые"
 SUBDOCTRINE_MULTIROLE_MIXED_DESC: "Эта доктрина продвигает сбалансированный подход к разработке многоцелевых самолётов путём объединения различных философий проектирования в рамках единых военно-воздушных сил. Смешанные многоцелевые концепции подчёркивают гибкость состава войск для удовлетворения широкого спектра оперативных требований."
 SUBDOCTRINE_MULTIROLE_STRIKE: "Ударные самолёты"
 SUBDOCTRINE_MULTIROLE_STRIKE_DESC: "В этой доктрине особое внимание уделяется разработке многоцелевых самолётов, ориентированных на наступательные воздушные операции. В проектах, ориентированных на нанесение ударов, приоритет отдаётся эффективному нанесению ударов с воздуха по обозначенным целям в поддержку более широких оперативных целей."
 SUBDOCTRINE_MULTIROLE_OPERATIONS: "Многоцелевые операции"
 SUBDOCTRINE_MULTIROLE_OPERATIONS_DESC: "Эта доктрина строит воздушные операции вокруг многоцелевых самолётов, способных выполнять различные задачи. В ходе многоцелевых операций особое внимание уделяется скоординированному использованию адаптируемых воздушных платформ для решения широкого спектра оперативных задач."
 SUBDOCTRINE_STRIKE_CAS: "Штурмовики"
 SUBDOCTRINE_STRIKE_CAS_DESC: "Эта доктрина сосредоточена на разработке самолётов, предназначенных для поддержки наземных операций путём прямого авиационного воздействия. Самолёты непосредственной авиационной поддержки (CAS) призваны обеспечивать оперативную и продолжительную поддержку с воздуха в тесном взаимодействии с сухопутными войсками."
 SUBDOCTRINE_STRIKE_NAVAL: "Морские ударные самолёты"
 SUBDOCTRINE_STRIKE_NAVAL_DESC: "Эта доктрина сосредоточена на развитии ударных самолётов, предназначенных для поддержки морских целей. Концепции морского удара подчёркивают интеграцию авиации с морскими операциями для проецирования силы на морских театрах."
 SUBDOCTRINE_STRIKE_MUNITIONS: "Ударные боеприпасы"
 SUBDOCTRINE_STRIKE_MUNITIONS_DESC: "Эта доктрина делает упор на разработку и интеграцию боеприпасов, предназначенных для высокоточных ударных операций. Концепции ударных боеприпасов сосредоточены на повышении эффективности применения огневой мощи, доставляемой по воздуху, в поддержку оперативных целей."
 SUBDOCTRINE_FIGHTER_LIGHT: "Лёгкие истребители"
 SUBDOCTRINE_FIGHTER_LIGHT_DESC: "Эта доктрина сосредоточена на разработке лёгких истребителей, оптимизированных для манёвренности и быстрого выполнения воздушных операций. Конструкции лёгких истребителей подчёркивают высокую эффективность и гибкое применение в рамках общей системы воздушного боя."
 SUBDOCTRINE_FIGHTER_AIR_SUP: "Господство в воздухе"
 SUBDOCTRINE_FIGHTER_AIR_SUP_DESC: "Эта доктрина сосредоточена на разработке и применении истребителей для установления и поддержания контроля над воздушным пространством. Концепции превосходства в воздухе подчёркивают скоординированные операции воздушного боя для обеспечения свободы действий на всём театре военных действий."
 SUBDOCTRINE_STRUCTURE_CENTRAL_COMMAND: "Центральное командование"
 SUBDOCTRINE_STRUCTURE_CENTRAL_COMMAND_DESC: "Эта доктрина организует сухопутные войска под единым центральным командованием, где планированием, координацией и исполнением руководит единый орган власти. Структуры центрального командования обеспечивают согласованность оперативных намерений и синхронное применение сухопутных войск по всему полю боя."
 SUBDOCTRINE_STRUCTURE_DECENTRAL_COMMAND: "Децентрализованное командование"
 SUBDOCTRINE_STRUCTURE_DECENTRAL_COMMAND_DESC: "Эта доктрина распределяет командные полномочия между несколькими эшелонами сухопутных войск, позволяя подчинённым формированиям планировать и проводить операции в рамках поставленных целей. Децентрализованные командные структуры делают упор на инициативу и оперативное принятие решений во всём боевом пространстве."
 SUBDOCTRINE_STRUCTURE_BCT: "Боевые группы батальона"
 SUBDOCTRINE_STRUCTURE_BCT_DESC: "Эта доктрина структурирует сухопутные войска вокруг автономных формирований батальонного уровня, предназначенных для проведения общевойсковых операций. Боевые группы батальона объединяют элементы маневрирования, огневой поддержки и жизнеобеспечения для эффективного действия в назначенных оперативных районах."
 SUBDOCTRINE_OPERATION_DECENTRALIZED_SUPPLY: "Децентрализованное снабжение"
 SUBDOCTRINE_OPERATION_DECENTRALIZED_SUPPLY_DESC: "Эта доктрина организует обеспечение сухопутных войск с помощью распределённых структур материально-технического обеспечения, которые поддерживают подразделения в нескольких операционных районах. Концепции децентрализованного снабжения подчёркивают локализованный контроль над ресурсами для поддержания оперативного темпа и непрерывности."
 SUBDOCTRINE_OPERATION_CENTRALIZED_SUPPLY: "Централизованное снабжение"
 SUBDOCTRINE_OPERATION_CENTRALIZED_SUPPLY_DESC: "Эта доктрина организует обеспечение сухопутных войск в рамках централизованных структур материально-технического обеспечения, которые координируют распределение снабжения по району операций. Концепции централизованного снабжения подчёркивают единое планирование и контроль для обеспечения последовательной поддержки наземных операций."
 SUBDOCTRINE_OPERATION_SCAVENGING_SUPPLY: "Трофейное снабжение"
 SUBDOCTRINE_OPERATION_SCAVENGING_SUPPLY_DESC: "Эта доктрина поддерживает сухопутные войска за счёт использования местных ресурсов в оперативной обстановке. Концепции трофейного снабжения сосредоточены на адаптивной закупке и интеграции трофейных или самодельных материальных средств для поддержки текущих наземных операций."
 SUBDOCTRINE_OPERATION_ADVERSE: "Действия в сложных условиях"
 SUBDOCTRINE_OPERATION_ADVERSE_DESC: "Эта доктрина готовит сухопутные войска к проведению операций в неблагоприятных и сложных условиях. В операциях в неблагоприятных условиях особое внимание уделяется адаптивности, устойчивости и стабильной эффективности в сложных оперативных условиях."
 SUBDOCTRINE_OPERATION_VOLUNTEER: "Добровольческие операции"
 SUBDOCTRINE_OPERATION_VOLUNTEER_DESC: "Данная доктрина строит операции сухопутных войск вокруг развёртывания отдельных формирований за пределами национальных границ в поддержку внешних целей. Добровольческие операции делают упор на ограниченное вмешательство, оперативную автономию и соответствие более широким стратегическим целям."
 SUBDOCTRINE_OPERATION_DEEP_BATTLE: "Операции глубокого боя"
 SUBDOCTRINE_OPERATION_DEEP_BATTLE_DESC: "Эта доктрина структурирует наземные операции таким образом, чтобы одновременно поражать силы противника на нескольких участках боевого пространства. Концепции глубокого боя подчёркивают скоординированные действия по дезорганизации элементов командования, обеспечения и манёвра за пределами непосредственной линии фронта."
 SUBDOCTRINE_OPERATION_THUNDER_RUN: "«Громовой рывок»"
 SUBDOCTRINE_OPERATION_THUNDER_RUN_DESC: "Эта доктрина строит наземные операции на основе быстрых, концентрированных ударов, направленных на достижение решающих результатов за счёт скорости и шока. Операции «Громового рывка» подчёркивают динамику и целенаправленный манёвр, направленный на нарушение оперативной обстановки."
 SUBDOCTRINE_OPERATION_LIGHT_INFANTRY: "Операции лёгкой пехоты"
 SUBDOCTRINE_OPERATION_LIGHT_INFANTRY_DESC: "Эта доктрина организует наземные операции с использованием высокомобильных пехотных соединений, подходящих для различных условий местности и операций. Операции лёгкой пехоты подчёркивают гибкость, быстрое развёртывание и устойчивое присутствие на поле боя."
 SUBDOCTRINE_OPERATION_GUERRILLA: "Партизанские операции"
 SUBDOCTRINE_OPERATION_GUERRILLA_DESC: "Эта доктрина строит наземные операции вокруг нерегулярных и рассредоточенных боевых формирований, действующих в условиях конфликта. Партизанские операции подчёркивают мобильность, локальную инициативу и постоянное давление, чтобы сформировать наземное боевое пространство."
 SUBDOCTRINE_OPERATION_STATIC_DEFENSE: "Статическая оборона"
 SUBDOCTRINE_OPERATION_STATIC_DEFENSE_DESC: "Эта доктрина строит оборонительные наземные операции вокруг фиксированных позиций и подготовленных оборонительных сетей. Операции статической обороны подчёркивают контроль над территорией и организованное использование сил для удержания ключевой территории."
 SUBDOCTRINE_OPERATION_ELASTIC_DEFENSE: "Эластичная оборона"
 SUBDOCTRINE_OPERATION_ELASTIC_DEFENSE_DESC: "Эта доктрина организует оборонительные операции посредством контролируемого перемещения и применения сил на глубине. Концепции эластичной обороны подчёркивают формирование боевого пространства при сохранении боевой эффективности на последовательных уровнях защиты."
 SUBDOCTRINE_OPERATION_MOBILE_DEFENSE: "Мобильная оборона"
 SUBDOCTRINE_OPERATION_MOBILE_DEFENSE_DESC: "Эта доктрина строит оборонительные наземные операции вокруг ориентированных на манёвр сил, способных динамично реагировать на действия противника. Концепции мобильной обороны подчёркивают гибкость и скоординированный контрманёвр в рамках оборонительного боевого пространства."
 SUBDOCTRINE_OPERATION_INSURGENT: "Операции повстанцев"
 SUBDOCTRINE_OPERATION_INSURGENT_DESC: "Эта доктрина организует сухопутные войска вокруг нерегулярных боевых действий, проводимых децентрализованными и внедрёнными боевыми элементами. В операциях повстанцев особое внимание уделяется постоянному взаимодействию и контролю, ориентированному на население, с целью оказания влияния на оперативную обстановку."
 SUBDOCTRINE_TECHNOLOGY_HIGH: "Высокотехнологичная армия"
 SUBDOCTRINE_TECHNOLOGY_HIGH_DESC: "Эта доктрина структурирует сухопутные войска на основе обширной интеграции передовых технологий в боевые функции, командование и обеспечение жизнедеятельности. Концепции высокотехнологичной армии подчёркивают технологическое превосходство как центральный элемент оперативной эффективности."
 SUBDOCTRINE_TECHNOLOGY_COMMON: "Армия доступных технологий"
 SUBDOCTRINE_TECHNOLOGY_COMMON_DESC: "Эта доктрина организует сухопутные войска на основе широко доступных и стандартизированных военных технологий. Концепции армии общедоступных технологий подчёркивают надёжность, масштабируемость и широкую совместимость между формированиями."
 SUBDOCTRINE_TECHNOLOGY_LOW: "Низкотехнологичная армия"
 SUBDOCTRINE_TECHNOLOGY_LOW_DESC: "Эта доктрина строит сухопутные войска на основе минимальной зависимости от передовых технологических систем. Низкотехнологичные армейские концепции подчёркивают базовое оборудование, простоту и функциональность при эксплуатации в ограниченных технологических условиях."
 SUBDOCTRINE_TRAINING_REDUCED: "Сокращённое обучение"
 SUBDOCTRINE_TRAINING_REDUCED_DESC: "Эта доктрина сводит к минимуму требования к формальной подготовке для ускорения формирования и развёртывания сил. Концепции сокращённого обучения подчёркивают базовую оперативную готовность и быстрое наличие сил."
 SUBDOCTRINE_TRAINING_ADVANCED: "Углублённая подготовка"
 SUBDOCTRINE_TRAINING_ADVANCED_DESC: "В этой доктрине особое внимание уделяется обширным и структурированным программам обучения, направленным на повышение сплочённости подразделений и оперативных навыков. Концепции продвинутого обучения сосредоточены на подготовке войск к сложным и требовательным оперативным условиям."
 SUBDOCTRINE_TRAINING_SKILLS: "Школа мастерства "
 SUBDOCTRINE_TRAINING_SKILLS_DESC: "Эта доктрина строит обучение вокруг систематического развития специальных военных навыков. Обучение, ориентированное на навыки, подчёркивает техническую компетентность и специфические навыки в сухопутных войсках."
 SUBDOCTRINE_TRAINING_SURVIVAL: "Тренинг по выживанию"
 SUBDOCTRINE_TRAINING_SURVIVA_DESC: "В этой доктрине особое внимание уделяется тренировкам, направленным на выносливость и приспособляемость в суровых и враждебных условиях. Концепции обучения выживанию готовят силы к продолжению операций в неблагоприятных условиях."
 SUBDOCTRINE_LEADERSHIP_OFFICER: "Подготовка офицеров"
 SUBDOCTRINE_LEADERSHIP_OFFICER_DESC: "Эта доктрина сосредотачивает развитие лидерских качеств на офицерском составе посредством формального образования и подготовки к командованию. Концепции подготовки офицеров делают упор на планирование, координацию и организационный контроль в сухопутных войсках."
 SUBDOCTRINE_LEADERSHIP_NCO: "Подготовка сержантского состава"
 SUBDOCTRINE_LEADERSHIP_NCO_DESC: "Эта доктрина строит развитие лидерства вокруг сержантского состава как основы командования сухопутных войск. Концепции обучения сержантов подчёркивают тактическое лидерство и повседневную эффективность подразделения."
 SUBDOCTRINE_LEADERSHIP_REDUCED: "Сниженные стандарты"
 SUBDOCTRINE_LEADERSHIP_REDUCED_DESC: "Эта доктрина снижает формальные требования к квалификации руководителей для расширения командного потенциала. Концепции сниженных стандартов подчёркивают ускоренное формирование командных кадров для поддержки расширения вооружённых сил."
 SUBDOCTRINE_EQUIPMENT_BASE_INFANTRY: "Базовая выкладка пехоты"
 SUBDOCTRINE_EQUIPMENT_BASE_INFANTRY_DESC: "Эта доктрина определяет стандартизированную выкладку пехоты, ориентированную на основное вооружение и вспомогательное снаряжение. Концепции базовой выкладки пехоты подчёркивают сбалансированность и универсальность для длительных наземных операций."
 SUBDOCTRINE_EQUIPMENT_LIGHT_INFANTRY: "Облегчённая выкладка пехоты"
 SUBDOCTRINE_EQUIPMENT_LIGHT_INFANTRY_DESC: "Эта доктрина строит снаряжение пехоты с учётом уменьшенного веса и упрощённой комплектации. Концепции облегчённой выкладки пехоты подчёркивают мобильность и простоту развёртывания в различных оперативных условиях."
 SUBDOCTRINE_EQUIPMENT_HEAVY_INFANTRY: "Тяжёлая выкладка пехоты"
 SUBDOCTRINE_EQUIPMENT_HEAVY_INFANTRY_DESC: "Эта доктрина оснащает пехотные формирования расширенным вооружением и системами защиты. Концепции тяжёлой выкладки пехоты подчёркивают повышенную огневую мощь и устойчивость во время наземных боёв."
 SUBDOCTRINE_EQUIPMENT_BASE_MOTORIZED: "Базовая моторизация"
 SUBDOCTRINE_EQUIPMENT_BASE_MOTORIZED_DESC: "Эта доктрина определяет стандартную конфигурацию снаряжения для мотострелковых подразделений. Базовые моторизованные комплектации подчёркивают сбалансированную мобильность и боеспособность, поддерживаемые колёсным транспортом."
 SUBDOCTRINE_EQUIPMENT_LIGHT_MOTORIZED: "Лёгкая моторизация"
 SUBDOCTRINE_EQUIPMENT_LIGHT_MOTORIZED_DESC: "Эта доктрина строит оборудование моторизованных подразделений вокруг более лёгких транспортных средств и уменьшенных бортовых систем. Облегчённые моторизованные комплектации подчёркивают скорость и оперативную гибкость при проведении наземных операций."
 SUBDOCTRINE_EQUIPMENT_HEAVY_MOTORIZED: "Тяжёлая моторизация"
 SUBDOCTRINE_EQUIPMENT_HEAVY_MOTORIZED_DESC: "Эта доктрина оснащает моторизованные подразделения более тяжёлыми транспортными средствами и усовершенствованным бортовым оборудованием. Тяжёлые моторизованные комплектации подчёркивают защищённость и устойчивую боеспособность во время наземных операций."
 SUBDOCTRINE_EQUIPMENT_MIXED_MECHANIZED: "Смешанная механизация"
 SUBDOCTRINE_EQUIPMENT_MIXED_MECHANIZED_DESC: "Эта доктрина структурирует механизированные формирования вокруг комбинации транспортных и боевых машин. Смешанные механизированные комплектации подчёркивают адаптивность за счёт интеграции разнообразного оборудования."
 SUBDOCTRINE_EQUIPMENT_APC_MECHANIZED: "Механизация на БТР"
 SUBDOCTRINE_EQUIPMENT_APC_MECHANIZED_DESC: "Эта доктрина организует механизированные подразделения вокруг бронетранспортёров в качестве основной транспортной платформы. Механизированные комплектации на БТР подчёркивают защищённую мобильность и поддержку пехоты в наземных операциях."
 SUBDOCTRINE_EQUIPMENT_IFV_MECHANIZED: "Механизация на БМП"
 SUBDOCTRINE_EQUIPMENT_IFV_MECHANIZED_DESC: "Эта доктрина структурирует механизированные силы вокруг боевых машин пехоты с интегрированными боевыми системами. Механизированные комплектации на БМП подчёркивают комбинированную мобильность и непосредственную огневую поддержку."
 SUBDOCTRINE_EQUIPMENT_MBT_TANK: "Танковая техника"
 SUBDOCTRINE_EQUIPMENT_MBT_TANK_DESC: "Эта доктрина фокусируется на развёртывании и обеспечении соединений основных боевых танков. Концепции танковой техники подчёркивают огневую мощь бронетехники как центрального элемента наземных боевых сил."
 SUBDOCTRINE_EQUIPMENT_LIGHT_TANK: "Лёгкие танки"
 SUBDOCTRINE_EQUIPMENT_LIGHT_TANK_DESC: "Эта доктрина структурирует бронетанковые подразделения вокруг более лёгких танковых платформ, подходящих для гибких наземных операций. Комплектации лёгкими танками подчёркивают мобильность и оперативный охват бронетанковых соединений."
 SUBDOCTRINE_EQUIPMENT_SUPERHEAVY_TANK: "Сверхтяжёлая техника"
 SUBDOCTRINE_EQUIPMENT_SUPERHEAVY_TANK_DESC: "Эта доктрина организует бронетанковые войска вокруг исключительно тяжёлых и защищённых платформ боевых машин. Концепции сверхтяжёлой техники подчёркивают максимальное присутствие бронетехники в наземных формированиях."
 SUBDOCTRINE_EQUIPMENT_TOWED_ARTILLERY: "Буксируемая артиллерия"
 SUBDOCTRINE_EQUIPMENT_TOWED_ARTILLERY_DESC: "Эта доктрина структурирует артиллерийские силы вокруг развёртываемых артиллерийских систем, поддерживаемых транспортными средствами. Концепции буксируемой артиллерии подчёркивают гибкость огневой поддержки в ходе наземных операций."
 SUBDOCTRINE_EQUIPMENT_SP_ARTILLERY: "Техника САУ"
 SUBDOCTRINE_EQUIPMENT_SP_ARTILLERY_DESC: "Эта доктрина оснащает артиллерийские подразделения самоходными платформами, способными действовать совместно с манёвренными силами. Концепции техники САУ подчёркивают мобильность и оперативность огневой поддержки."
 SUBDOCTRINE_EQUIPMENT_ROCKET_ARTILLERY: "Техника РСЗО"
 SUBDOCTRINE_EQUIPMENT_ROCKET_ARTILLERY_DESC: "Эта доктрина структурирует артиллерийские силы вокруг реактивных систем залпового огня для ведения огня по площадям. Концепции оборудования РСЗО подчёркивают скоординированную доставку огневой мощи по всему боевому пространству."
 SUBDOCTRINE_EQUIPMENT_ATK_HELICOPTER: "Ударные вертолёты"
 SUBDOCTRINE_EQUIPMENT_ATK_HELICOPTER_DESC: "Эта доктрина интегрирует платформы ударных вертолётов в структуру оборудования сухопутных войск. Концепции ударных вертолётов делают упор на огневую поддержку с воздуха и интеграцию боевых действий с наземными операциями."
 SUBDOCTRINE_EQUIPMENT_TRANS_HELICOPTER: "Транспортные вертолёты"
 SUBDOCTRINE_EQUIPMENT_TRANS_HELICOPTER_DESC: "Эта доктрина структурирует мобильность наземных войск вокруг винтокрылых транспортных платформ. Концепции транспортных вертолётов подчёркивают мобильность по воздуху и быстрое перемещение сил."
 SUBDOCTRINE_CAPITAL_CARRIER: "Авианосные операции"
 SUBDOCTRINE_CAPITAL_CARRIER_DESC: "Эта доктрина структурирует проекцию военно-морской мощи вокруг авианосцев как центральных активов флота. Авианосные операции подчёркивают скоординированное использование находящихся на борту авиакрыльев для расширения военно-морского влияния на морских театрах военных действий."
 SUBDOCTRINE_CAPITAL_HLS: "Вертолётные десантные корабли"
 SUBDOCTRINE_CAPITAL_HLS_DESC: "Эта доктрина включает десантные корабли, способные нести вертолёты, в структуры военно-морских сил. Концепции вертолётно-десантных кораблей подчёркивают вертикальную мобильность и десантную поддержку в рамках морских операций."
 SUBDOCTRINE_CAPITAL_ESCORT_CARRIER: "Эскортный авианосец"
 SUBDOCTRINE_CAPITAL_ESCORT_CARRIER_DESC: "Эта доктрина организует военно-морскую авиацию вокруг небольших авианосных платформ, действующих бок о бок с элементами флота. Концепции эскортных авианосцев подчёркивают распределённую воздушную поддержку в составе военно-морских формирований."
 SUBDOCTRINE_CAPITAL_LOTS: "Повелители моря"
 SUBDOCTRINE_CAPITAL_LOTS_DESC: "Эта доктрина структурирует военно-морские силы таким образом, чтобы обеспечить устойчивый контроль над ключевыми морскими регионами. Концепции «Повелителей моря» подчёркивают доминирующее присутствие флота и постоянное морское влияние."
 SUBDOCTRINE_CAPITAL_CARRIER_ESCORTS: "Сопровождение авианосца"
 SUBDOCTRINE_CAPITAL_CARRIER_ESCORTS_DESC: "Эта доктрина организует элементы флота для обеспечения эшелонированной защиты авианосных групп. Концепции сопровождения авианосцев делают упор на скоординированную оборону и оперативную непрерывность действий крупных боевых кораблей."
 SUBDOCTRINE_CAPITAL_FLEET_CRUISERS: "Флот крейсеров"
 SUBDOCTRINE_CAPITAL_FLEET_CRUISERS_DESC: "Эта доктрина строится вокруг организации флота на основе крейсерских кораблей, способных к самостоятельным и групповым операциям. Концепция крейсерского флота делает упор на присутствие командования и многоцелевые морские возможности."
 SUBDOCTRINE_CAPITAL_DESTROYER_FLEET: "Флот эсминцев"
 SUBDOCTRINE_CAPITAL_DESTROYER_FLEET_DESC: "Данная доктрина строит военно-морские силы вокруг эсминцев как основного элемента надводного боя. Концепция флота эсминцев делает упор на гибкость ведения боевых действий и оперативную поддержку на уровне флота."
 SUBDOCTRINE_CAPITAL_SUPPORT_DESTROYERS: "Вспомогательные эсминцы"
 SUBDOCTRINE_CAPITAL_SUPPORT_DESTROYERS_DESC: "Данная доктрина предусматривает использование эсминцев для поддержки и прикрытия наиболее важных подразделений флота. Концепция эсминцев поддержки делает упор на защиту, координацию и обеспечение бесперебойной работы флота."
 SUBDOCTRINE_CAPITAL_FRIGATE_CAPITAL: "Флот фрегатов"
 SUBDOCTRINE_CAPITAL_FRIGATE_CAPITAL_DESC: "Эта доктрина возводит корабли класса фрегатов в центральное положение в составе военно-морских формирований. Концепция фрегатов в роли крупных кораблей делает упор на сбалансированные возможности и распределённое морское присутствие."
 SUBDOCTRINE_ESCORT_MULTIROLE_FRIGATE: "Многоцелевые фрегаты"
 SUBDOCTRINE_ESCORT_MULTIROLE_FRIGATE_DESC: "Данная доктрина строит эскортные силы вокруг фрегатов, способных выполнять разнообразные морские задачи. Концепция многоцелевых фрегатов делает акцент на адаптивности в рамках эскортных и патрульных операций."
 SUBDOCTRINE_ESCORT_ANTI_SUB_CORVETTE: "Противолодочный корвет"
 SUBDOCTRINE_ESCORT_ANTI_SUB_CORVETTE_DESC: "Эта доктрина организует эскортные силы вокруг корветов, специализирующихся на обнаружении и поражении подводных лодок. Концепции противолодочных корветов делают упор на локализованный контроль подводного пространства."
 SUBDOCTRINE_ESCORT_ANTI_AIR_CORVETTE: "Противовоздушный корвет"
 SUBDOCTRINE_ESCORT_ANTI_AIR_CORVETTE_DESC: "Данная доктрина строит эскортные соединения вокруг корветов, ориентированных на противовоздушную оборону. Концепции зенитных корветов делают упор на защиту подразделений флота от воздушных угроз."
 SUBDOCTRINE_ESCORT_STEALTH_ESCORTS: "Стелс-эскорт"
 SUBDOCTRINE_ESCORT_STEALTH_ESCORTS_DESC: "Эта доктрина предусматривает интеграцию малозаметных эскортных судов в военно-морские формирования. Концепции скрытного эскорта делают упор на снижение обнаруживаемости и скрытность действий в морской среде."
 SUBDOCTRINE_SUBMARINE_ESCORT_ATTACK: "Подлодки эскорта"
 SUBDOCTRINE_SUBMARINE_ESCORT_ATTACK_DESC: "Эта доктрина предписывает подводным силам действовать в тесной координации с надводными флотами. Концепция эскортных ударных подводных лодок делает упор на подводную поддержку военно-морских операций."
 SUBDOCTRINE_SUBMARINE_HUNTER_KILLER: "Подлодки-охотники"
 SUBDOCTRINE_SUBMARINE_HUNTER_KILLER_DESC: "Эта доктрина строит подводные силы вокруг независимых наступательных патрулей. Концепция подводных лодок-охотников делает упор на постоянное присутствие под водой и целенаправленное поражение целей."
 SUBDOCTRINE_SUBMARINE_MISSILE_BOATS: "Ракетные подлодки"
 SUBDOCTRINE_SUBMARINE_MISSILE_BOATS_DESC: "Эта доктрина организует подводные силы вокруг платформ, оборудованных для развёртывания ракет. Концепция ракетных подводных лодок делает упор на стратегические и оперативные ударные возможности в морской сфере."
 SUBDOCTRINE_OPERATIONS_RAIDING_FLEETS: "Рейдовые флоты"
 SUBDOCTRINE_OPERATIONS_RAIDING_FLEETS_DESC: "Данная доктрина строит военно-морские операции вокруг мобильных оперативных групп, проводящих деструктивные морские действия. Концепция рейдового флота делает упор на оперативный охват и гибкое применение сил."
 SUBDOCTRINE_OPERATIONS_NAVAL_SUPREMACY: "Господство на море"
 SUBDOCTRINE_OPERATIONS_NAVAL_SUPREMACY_DESC: "Эта доктрина организует военно-морские операции для установления и поддержания контроля над морским пространством. Концепции военно-морского превосходства подчёркивают скоординированные действия флота на морских коммуникациях."
 SUBDOCTRINE_OPERATIONS_COSTAL_DEFENSE: "Береговая оборона"
 SUBDOCTRINE_OPERATIONS_COSTAL_DEFENSE_DESC: "Данная доктрина структурирует военно-морские силы для защиты территориальных вод и прибрежных подходов. Концепции береговой обороны делают упор на многоуровневую морскую безопасность и региональный контроль над морем."
