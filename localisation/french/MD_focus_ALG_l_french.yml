l_french:
 algeria_focus: "Arbre de focus algérien"
 ALG_political_tree_shortcut: "Arbre politique"
 ALG_foreign_policy_shortcut: "Politique étrangère"
 ALG_industry_shortcut: "Relance économique"
 ALG_military_shortcut: "Forces armées algériennes"
 ALG_the_nation_stands_at_a_crossroads: "La nation à la croisée des chemins"
 ALG_restore_the_presidency_desc: "Au lendemain des bouleversements politiques, la présidence a été affaiblie. Il est temps de rétablir l'autorité de notre dirigeant élu et de restaurer les normes démocratiques érodées. En rétablissant la présidence, nous pouvons ramener stabilité et confiance dans notre gouvernement."
 ALG_emergency_rule_continues: "§RELa règle d'urgence continue§!"
 ALG_emergency_rule_continues_desc: "La nation étant encore en tourmente, le gouvernement a décidé de prolonger l'état d'urgence. Cette mesure est nécessaire pour maintenir l'ordre, mais elle se paie au prix des libertés civiles et des processus démocratiques. Nous devons avancer avec prudence dans ces eaux troubles."
 ALG_national_reconciliation: "Réconciliation nationale"
 ALG_national_reconciliation_desc: "Pour panser les plaies de la division et du conflit, nous devons emprunter la voie de la réconciliation nationale. En favorisant le dialogue entre toutes les factions et en traitant les griefs, nous pouvons bâtir une société plus unie et jeter les bases d'une paix durable."
 ALG_moderate_islamist_talks: "Pourparlers islamistes modérés"
 ALG_moderate_islamist_talks_desc: "Pour combler les fossés et promouvoir la stabilité, nous entamons des pourparlers avec des factions islamistes modérées. Par un dialogue constructif, nous visons un terrain d'entente et un environnement politique où des voix diverses peuvent coexister pacifiquement."
 ALG_charter_for_civil_peace: "Charte pour la paix civile"
 ALG_charter_for_civil_peace_desc: "Pour garantir une stabilité durable et l'harmonie sociale, nous proposons une Charte pour la paix civile. Ce document énoncera les droits et devoirs de tous les citoyens, en promouvant la tolérance, la compréhension et la coopération entre les groupes de notre société."
 ALG_open_democratic_path: "Ouvrir la voie démocratique"
 ALG_open_democratic_path_desc: "Il est temps d'embrasser pleinement la démocratie et d'ouvrir la voie à un avenir plus lumineux. En mettant en œuvre des réformes qui donnent du pouvoir à nos citoyens et encouragent la participation politique, nous pouvons créer une société démocratique vivante, reflet de la volonté du peuple."
 ALG_clamp_down_on_extremism: "Réprimer l'extrémisme"
 ALG_clamp_down_on_extremism_desc: "Par des tribunaux militaires et les forces de renseignement, le gouvernement éliminera toutes les menaces islamistes radicales et politiques restantes."
 ALG_counterterrorism_program: "Programme antiterroriste"
 ALG_counterterrorism_program_desc: "Un appareil de sécurité moderne doit être constitué pour pister, infiltrer et éliminer les menaces avant qu'elles ne déstabilisent l'Algérie."
 ALG_authoritarian_restoration: "Restauration autoritaire"
 ALG_authoritarian_restoration_desc: "La stabilité ne peut être garantie que par un pouvoir ferme et centralisé. L'armée prendra pleinement en charge l'avenir de la nation."
 ALG_counterterrorism_agency: "Agence de lutte contre le terrorisme"
 ALG_extremism_crackdown_modifier: "Répression de l'extrémisme"
 ALG_extremism_crackdown_modifier_desc: "Face à la montée des menaces de groupes extrémistes cherchant à déstabiliser notre nation, nous lançons une répression d'ensemble contre le radicalisme. Cette initiative vise à démanteler les réseaux extrémistes, à renforcer la surveillance et les capacités des forces de l'ordre. En promouvant une culture de tolérance et de compréhension, nous espérons traiter les causes profondes de l'extrémisme tout en assurant la sécurité de nos citoyens. Par ces mesures, nous favoriserons une société plus cohésive et protégerons nos valeurs démocratiques."
 ALG_military_regime_restored: "Régime militaire restauré"
 ALG_military_regime_restored_desc: "Après des années d'instabilité politique, l'armée a repris le contrôle et restauré l'ordre. Le régime mise sur la discipline, la sécurité nationale et une gouvernance stricte pour reconstruire la force et l'unité de la nation."
 ALG_reconciliation_path_category: "Réconciliation nationale"
 ALG_reconciliation_path_category_desc: "\n£AFG_menu1\n\n\n\nPour panser les plaies de la division et du conflit, nous devons emprunter la voie de la réconciliation nationale. En favorisant le dialogue entre toutes les factions et en traitant les griefs, nous pouvons bâtir une société plus unie et jeter les bases d'une paix durable."
 ALG_pardon_moderate_islamist: "Pardon aux islamistes modérés"
 ALG_pardon_moderate_islamist_desc: "D'anciens islamistes non violents pourront se voir offrir une amnistie conditionnelle en échange du désarmement et du renoncement à la violence politique."
 ALG_initiate_national_dialogues: "Lancer le dialogue national"
 ALG_initiate_national_dialogues_desc: "Un forum national sera lancé pour associer d'anciens rebelles, partis politiques et société civile à la construction d'une nouvelle Algérie."
 ALG_reintegrate_former_fighter: "Réintégrer les anciens combattants"
 ALG_reintegrate_former_fighter_desc: "Un programme pour réinsérer les insurgés rendus dans la vie civile par le travail, le logement ou le service national."
 ALG_crackdown_category: "Répression autoritaire"
 ALG_crackdown_category_desc: "\n£TAJ_desctext_pamir\n\n\n\nPour assurer la stabilité de l'État, nous devons réprimer les éléments subversifs et renforcer nos forces de sécurité intérieure."
 ALG_arrest_political_opponents: "Arrêter les opposants politiques"
 ALG_arrest_political_opponents_desc: "Nous neutraliserons les menaces internes en écartant les acteurs politiques radicaux de l'espace public."
 ALG_expand_surveillance_services: "Développer les services de surveillance"
 ALG_expand_surveillance_services_desc: "Un réseau de renseignement robuste surveillera la population et préviendra les troubles avant qu'ils ne s'étendent."
 ALG_ban_opposition_parties: "Interdire les partis d’opposition"
 ALG_ban_opposition_parties_desc: "Tous les partis politiques non alignés sur l'unité nationale seront interdits de participation politique."
 ALG_economic_recovery_category: "Programme de relance économique"
 ALG_economic_recovery_category_desc: "\n£MAIN_desctext_dept\n\n\n\nLe FMI offre un soutien conditionnel et l'Algérie peut désormais entamer des réformes plus larges, des emprunts et des privatisations."
 ALG_accept_imf_loan: "Accepter le prêt du FMI"
 ALG_accept_imf_loan_desc: "Nous pouvons accepter une aide financière du FMI pour stabiliser notre monnaie et entamer la réforme. Cela se paie en dette à long terme et en conditions."
 ALG_start_oil_licensing: "Ouvrir les licences pétrolières aux étrangers"
 ALG_start_oil_licensing_desc: "Ouvrir les réserves pétrolières aux multinationales pourrait accélérer la croissance, mais accroître l'influence étrangère."
 ALG_repay_imf_loan: "Rembourser le prêt du FMI"
 ALG_repay_imf_loan_desc: "Nos finances se stabilisant, nous pouvons rembourser notre prêt pour réduire la dépendance internationale."
 ALG_improve_public_services: "Améliorer les services publics"
 ALG_improve_public_services_desc: "Nous étendrons la santé, l'éducation et le soutien aux victimes de guerre."
 ALG_international_aid_effort: "Effort d'aide internationale"
 ALG_international_aid_effort_desc: "Un partenariat avec l'ONU et les donateurs peut relancer les services de base et la reconstruction."
 ALG_building_civil_society: "Bâtir la société civile"
 ALG_building_civil_society_desc: "Donner du pouvoir aux communautés et aux programmes sociaux peut aider à prévenir un nouveau conflit."
 ALG_economic_recovery_program: "Programme de relance économique"
 ALG_economic_recovery_program_desc: "Nous lançons un plan national de croissance, soutenu par l'aide étrangère et la réforme de l'État."
 ALG_remove_international_monitors: "Supprimer les moniteurs internationaux"
 ALG_remove_international_monitors_desc: "L'Algérie s'est suffisamment relevée pour recouvrer la pleine souveraineté sur sa trajectoire économique."
 ALG_postwar_recovery_program: "Programme de reconstruction d'après-guerre"
 ALG_postwar_recovery_program_desc: "La guerre est finie. Nous commençons maintenant à reconstruire l'État, l'économie et la société."
 ALG_un_aid_mission: "Mission d'aide des Nations Unies"
 ALG_un_aid_mission_desc: "L'aide des Nations unies et des ONG soutiendra nos services publics de base."
 ALG_social_healing_programs: "Programmes de guérison sociale"
 ALG_social_healing_programs_desc: "Les traumatismes et la méfiance d'après-guerre doivent être traités par des programmes sociaux et la réconciliation."
 ALG_public_services_funding: "Financement des services publics"
 ALG_public_services_funding_desc: "Nous rétablirons l'accès à la santé, au logement et aux programmes d'emploi."
 ALG_finalize_recovery_phase: "Finaliser la phase de récupération"
 ALG_finalize_recovery_phase_desc: "La stabilité rétablie, nous pouvons réduire la tutelle étrangère et recouvrer l'autonomie économique."
 ALG_change_the_economy: "Changer le modèle économique"
 ALG_change_the_economy_desc: "Il est temps de choisir : préserver le contrôle étatique ou libéraliser ?"
 ALG_preserve_state_controlled_oil: "Préserver le contrôle étatique du pétrole"
 ALG_preserve_state_controlled_oil_desc: "Sonatrach doit rester le pilier de notre souveraineté et de notre économie."
 ALG_industrial_expansion_plan: "Plan d'expansion industrielle"
 ALG_industrial_expansion_plan_desc: "Nous augmenterons la production nationale par les infrastructures et les usines."
 ALG_open_market_reforms: "Réformes de libre marché"
 ALG_open_market_reforms_desc: "L'Algérie peut attirer les investissements et stimuler la croissance en dérégulant des secteurs clés."
 ALG_oil_licensing_program: "Lancer le programme de licences pétrolières"
 ALG_oil_licensing_program_desc: "Les compagnies étrangères peuvent demander à exploiter les gisements pétroliers sous contrats de licence."
 ALG_urban_or_rural_development: "Tribus ou villes ?"
 ALG_urban_or_rural_development_desc: "Notre priorité d'après-guerre doit-elle aller aux régions tribales ou aux grandes villes ?"
 ALG_empower_rural_provinces: "Autonomiser les provinces rurales"
 ALG_empower_rural_provinces_desc: "Notre sud rural et les terres kabyles recevront des investissements directs."
 ALG_tribal_consultative_council: "Former un conseil consultatif tribal"
 ALG_tribal_consultative_council_desc: "Les anciens locaux et les chefs régionaux aideront à gouverner les priorités de développement."
 ALG_urbanization_initiative: "Lancer l'initiative d'urbanisation"
 ALG_urbanization_initiative_desc: "Les centres urbains comme Alger et Oran sont les clés de notre modernisation."
 ALG_expand_the_capital: "Étendre la capitale"
 ALG_expand_the_capital_desc: "Nous étendrons les infrastructures et les administrations à Alger pour en faire un véritable pôle moderne."
 ALG_foreign_policy_review: "Réviser la doctrine de politique étrangère"
 ALG_foreign_policy_review_desc: "La stabilité intérieure revenant, l'Algérie doit redéfinir son rôle sur la scène mondiale."
 MSP_foreign_policy_review: "Réviser la doctrine de politique étrangère"
 MSP_foreign_policy_review_desc: "La stabilité intérieure revenant, l'Algérie doit redéfinir son rôle sur la scène mondiale."
 ALG_africa_and_arab_nations: "Afrique et nations arabes"
 ALG_africa_and_arab_nations_desc: "Nous nous concentrerons sur la diplomatie et le développement à travers l'Afrique et le monde arabe."
 ALG_western_sahara_position: "Soutenez le Sahara occidental"
 ALG_western_sahara_position_desc: "Nous réaffirmons notre soutien à l'indépendance sahraouie contre les revendications marocaines."
 ALG_african_union_engagement: "Rejoindre l'Union africaine"
 ALG_african_union_engagement_desc: "L'Algérie doit rejoindre l'Union et y jouer un rôle de premier plan dans la diplomatie continentale."
 ALG_sahel_initiatives: "S'étendre au Sahel"
 ALG_sahel_initiatives_desc: "Nous combattrons l'instabilité et le terrorisme au Sahel par le soft power et la défense."
 ALG_choose_global_partner: "Choisissez un partenaire mondial"
 ALG_choose_global_partner_desc: "Nous devons nous aligner économiquement et militairement sur l'une des superpuissances mondiales."
 ALG_align_with_us: "S'aligner sur les États-Unis"
 ALG_align_with_us_desc: "La coopération avec les États-Unis peut apporter sécurité et levier économique."
 ALG_align_with_china: "S'aligner sur la République populaire de Chine"
 ALG_align_with_china_desc: "La Chine offre un développement économique non interventionniste et un fort potentiel d'investissement."
 ALG_align_with_russia: "S'aligner sur la Fédération de Russie"
 ALG_align_with_russia_desc: "La Russie fournit des technologies militaires et partage le scepticisme algérien face à la domination occidentale."
 ALG_non_aligned_revival: "Relancer la politique non alignée"
 ALG_non_aligned_revival_desc: "Nous relancerons l'esprit de neutralité et de solidarité du Sud, comme dans les années 1960."
 ALG_global_south_solidarity: "Solidarité mondiale du Sud"
 ALG_global_south_solidarity_desc: "L'Algérie renforcera ses liens avec les nations postcoloniales par le commerce, la diplomatie et l'aide."
 ALG_future_national_policy: "§G L'avenir de l'Algérie§!"
 ALG_future_national_policy_desc: "La guerre civile derrière nous, nous devons désormais définir la nouvelle direction politique de l'Algérie.\n §RNOTE§! : §YChoisir ce focus mènera à des focuses finaux qui remplaceront l'arbre actuel par un arbre personnalisé pour chaque parti ; achevez les autres focuses importants avant de terminer celui-ci.§!"
 ALG_approach_nato: "§CSe rapprocher de l'OTAN§!"
 ALG_approach_nato_desc: "Un alignement occidental pourrait apporter croissance économique et garanties de sécurité."
 ALG_aspire_nato_support: "Aspirer à un partenariat avec l'OTAN"
 ALG_aspire_nato_support_desc: "En remplissant les conditions, l'Algérie peut devenir un allié majeur non membre de l'OTAN."
 ALG_invite_western_investors: "Inviter les investisseurs occidentaux"
 ALG_invite_western_investors_desc: "Attirer capitaux et commerce des nations démocratiques."
 ALG_request_us_protection: "Demander la protection américaine"
 ALG_request_us_protection_desc: "L'Algérie demandera aux États-Unis une protection ou des garanties militaires."
 ALG_remain_neutral: "§gRester neutre§!"
 ALG_remain_neutral_desc: "Le non-alignement offre liberté diplomatique et stabilité intérieure."
 ALG_economy_first: "Donner la priorité à l’économie"
 ALG_economy_first_desc: "Réduire les dépenses militaires et renforcer l'éducation et le développement à long terme."
 ALG_seek_un_protection: "Rechercher une protection internationale"
 ALG_seek_un_protection_desc: "Si les menaces montent, nous nous tournerons vers le Conseil de sécurité de l'ONU pour protection."
 ALG_align_with_china1: "§tS'aligner sur la Chine et la Russie§!"
 ALG_align_with_china1_desc: "Les puissances orientales offrent une alternative à l'alignement sur l'OTAN."
 ALG_join_sco: "Demander à rejoindre l'OCS"
 ALG_join_sco_desc: "L'Organisation de coopération de Shanghai offre des bénéfices économiques et sécuritaires."
 ALG_invite_eastern_investors: "Attirer les investissements de l'Est"
 ALG_invite_eastern_investors_desc: "S'associer à des entreprises d'infrastructure chinoises et russes."
 ALG_request_chinese_protection: "Demander une protection chinoise"
 ALG_request_chinese_protection_desc: "Pékin pourrait accepter de garantir l'indépendance et les investissements algériens."
 ALG_reform_the_military: "Réformer l'armée"
 ALG_reform_the_military_desc: "L'armée algérienne nécessite une réforme structurelle profonde pour affronter les défis du XXIe siècle."
 ALG_military_academy_upgrade: "Moderniser l'académie militaire"
 ALG_military_academy_upgrade_desc: "Investir dans l'éducation est essentiel pour former des officiers compétents et professionnels."
 ALG_internal_security_brigade: "Former des brigades de sécurité intérieure"
 ALG_internal_security_brigade_desc: "Nous devons assurer l'ordre intérieur par des unités spécialisées de sécurité intérieure."
 ALG_military_industry_support: "Soutenir l'industrie militaire"
 ALG_military_industry_support_desc: "Renforcer notre base militaro-industrielle aidera à assurer l'autosuffisance."
 ALG_anti_air_force: "Établir un commandement anti-aérien"
 ALG_anti_air_force_desc: "Les capacités de défense aérienne sont vitales pour protéger nos cieux."
 ALG_mechanized_modernization: "Modernisation des forces mécanisées"
 ALG_mechanized_modernization_desc: "Les unités mécanisées modernes sont le cœur d'une force terrestre efficace."
 ALG_uav_development: "Programme de drones"
 ALG_uav_development_desc: "Les systèmes aériens sans pilote nous donneront des capacités de surveillance et de frappe de précision."
 ALG_national_guard_initiative: "Initiative de la Garde nationale"
 ALG_national_guard_initiative_desc: "Un corps de défense citoyen peut aider à stabiliser les zones rurales et frontalières."
 ALG_air_force_reform: "Réformer l'armée de l'air"
 ALG_air_force_reform_desc: "Réviser doctrines et équipements est essentiel à notre supériorité aérienne."
 ALG_infantry_equipment_project: "Moderniser l'équipement d'infanterie"
 ALG_infantry_equipment_project_desc: "Notre infanterie mérite les armes et équipements de protection les plus récents."
 ALG_ballistic_program: "Programme de missiles balistiques"
 ALG_ballistic_program_desc: "Étendre nos capacités missiles renforcera la dissuasion stratégique."
 ALG_simulation_center: "Centre de simulation militaire"
 ALG_simulation_center_desc: "Établir des centres d'entraînement modernes améliorera considérablement notre préparation au combat."
 ALG_logistics_command: "Établir un commandement logistique"
 ALG_logistics_command_desc: "Rationaliser la logistique garantit que nos troupes restent opérationnelles."
 ALG_military_doctrine_finalization: "Finaliser la doctrine militaire"
 ALG_military_doctrine_finalization_desc: "Nous devons consolider les réformes en une doctrine moderne."
 ALG_foreign_arms_contracts: "Contrats d'armement étrangers"
 ALG_foreign_arms_contracts_desc: "Des partenariats stratégiques peuvent combler rapidement les lacunes de notre arsenal."
 ALG_local_armor_production: "Production locale d'armures"
 ALG_local_armor_production_desc: "Lancer une production locale de VTT et de chars assure autonomie et croissance."
 ALG_military_university_program: "Programme d'université militaire"
 ALG_military_university_program_desc: "Investir dans les académies militaires préparera la prochaine génération de chefs."
 ALG_heavy_artillery_project: "Initiative d'artillerie lourde"
 ALG_heavy_artillery_project_desc: "Nous prioriserons la recherche et le développement d'artillerie lourde nationale."
 ALG_special_operations_command: "Commandement des opérations spéciales"
 ALG_special_operations_command_desc: "Un commandement centralisé des unités d'élite améliore la coordination et l'efficacité."
 ALG_joint_command_center: "Créer un centre de commandement conjoint"
 ALG_joint_command_center_desc: "Fusionner les armes en un pôle d'opérations interarmées renforcera l'intégration stratégique."
 ALG_indigenous_rifle_program: "Programme de fusils nationaux"
 ALG_indigenous_rifle_program_desc: "Développer nos propres armes légères avancées est une priorité nationale."
 ALG_integrated_defense_network: "Réseau de défense intégré"
 ALG_integrated_defense_network_desc: "Un système unifié de radar et de communications renforce la défense nationale."
 ALG_advanced_command_structure: "Structure de commandement avancée"
 ALG_advanced_command_structure_desc: "Nous mettrons en œuvre un système de commandement C4ISR moderne pour le champ de bataille numérique."
 ALG_military_modernization_complete: "Modernisation militaire achevée"
 ALG_military_modernization_complete_desc: "Notre long chemin de réforme a enfin porté ses fruits. L'Algérie aligne désormais une force moderne et cohérente."
 ALG_idea_non_aligned_policy: "Politique étrangère non alignée"
 ALG_idea_non_aligned_policy_desc: "Notre voie indépendante nous permet de tirer parti de tous les blocs sans nous aligner sur aucun."
 ALG_presidential_succession_crisis: "Crise de succession présidentielle"
 ALG_presidential_succession_crisis_desc: "La stabilité s'érodant, la question du leadership ressurgit. Continuons-nous sous l'ancien régime ou forgerons-nous une nouvelle voie ?"
 ALG_stay_with_bouteflika: "Maintenir le leadership de Bouteflika"
 ALG_stay_with_bouteflika_desc: "Bouteflika incarne la continuité... et la corruption. Nous pourrons gagner en stabilité financière, mais au prix de la légitimité."
 ALG_choose_tebboune: "Nommer Tebboune"
 ALG_choose_tebboune_desc: "Un technocrate modéré aux réformes orientées vers la stabilité, mais qui coûtera cher au Trésor."
 ALG_choose_msp: "Nommer le leader du MSP"
 ALG_choose_msp_desc: "Une alternative islamiste alignée sur les Frères musulmans. Elle apporte une popularité dans certains cercles, mais risque un conflit civil avec l'élite militaire en place."
 ALG_random_president: "Choisissez un président au hasard"
 ALG_random_president_desc: "Une inconnue. Ce nouveau président pourrait sauver ou perdre l'Algérie."
 ALG_resolve_presidency_crisis: "Crise de la présidence résolue"
 ALG_resolve_presidency_crisis_desc: "La question du leadership a été tranchée. Il est temps d'avancer."
 ALG_idea_bouteflika_legacy: "Héritage de Bouteflika"
 ALG_idea_bouteflika_legacy_desc: "Malgré une corruption profonde et la méfiance, l'ère Bouteflika reste synonyme de la gouvernance passée de l'Algérie. Son réseau demeure influent."
 ALG_idea_tebboune_moderate: "La présidence modérée de Tebboune"
 ALG_idea_tebboune_moderate_desc: "Avec une image de stabilité et de réforme incrémentale, Tebboune cherche à maintenir l'ordre tout en assainissant la gouvernance."
 ALG_idea_msp_presidency: "Présidence du MSP"
 ALG_idea_msp_presidency_desc: "Le Mouvement de la société pour la paix a pris le pouvoir. Reste à voir si cela marque une transformation pacifique ou une descente dans le conflit."
 ALG_idea_random_good: "Nouveau président efficace"
 ALG_idea_random_good_desc: "Par chance ou par stratégie, le nouveau président est compétent et inspiré, apportant réforme et direction."
 ALG_idea_random_bad: "Un nouveau président incompétent"
 ALG_idea_random_bad_desc: "Ce dirigeant est mal préparé, dépassé et peut-être corrompu. Un mauvais choix en un moment critique."
 ALG_presidency.1.t: "Tensions avec l'armée"
 ALG_presidency.1.d: "Après la nomination du chef du MSP à la présidence, l'élite militaire est furieuse. Elle y voit une menace pour son emprise de longue date. Les rumeurs de mobilisations secrètes circulent, et des unités armées fidèles à la vieille garde commencent à manœuvrer. L'armée acceptera-t-elle ce changement, ou se rebellera-t-elle ?"
 ALG_presidency.1.a: "L'armée accepte le nouveau gouvernement"
 ALG_presidency.1.b: "L'armée se rebelle – la guerre civile commence !"
 ALG_presidency_army_accepts_tt: "L'armée accepte à contrecœur le gouvernement MSP. Pour l'instant, la paix tient."
 ALG_presidency_army_civilwar_tt: "Un coup d'État militaire dégénère en guerre civile ouverte !"
 ALG_economy_digital_initiative: "Initiative d'économie numérique"
 ALG_economy_digital_initiative_desc: "L'Algérie doit embrasser l'ère numérique pour moderniser son économie. L'investissement dans les infrastructures technologiques, les services d'e-gouvernement et les programmes d'alphabétisation numérique nous positionnera pour l'économie du XXIe siècle."
 ALG_digital_initiative_tt: "§GL'Algérie lance un programme global de transformation numérique :§!\n- Moderniser les services gouvernementaux\n- Étendre les infrastructures internet\n- Promouvoir les start-up technologiques\n- Former la main-d'œuvre aux compétences numériques"
 ALG_digital_economy_initiative: "Initiative d'économie numérique"
 ALG_digital_economy_initiative_desc: "Notre investissement dans les infrastructures numériques et l'éducation technologique porte ses fruits. Les services gouvernementaux sont plus efficaces, les entreprises adoptent des pratiques modernes, et une nouvelle génération de travailleurs à l'aise avec la tech entre sur le marché du travail."
 ALG_arpt_regulatory_framework: "Créer une autorité de régulation de l'ARPT"
 ALG_arpt_regulatory_framework_desc: "L'Autorité de régulation de la poste et des télécommunications (ARPT) garantira un marché des télécoms concurrentiel et protégera les droits des consommateurs."
 ALG_algerie_telecom_expansion: "Modernisation d'Algérie Télécom"
 ALG_algerie_telecom_expansion_desc: "Moderniser et étendre l'infrastructure d'Algérie Télécom pour améliorer l'accès au haut débit et les communications publiques."
 ALG_nedjma_and_mobilis: "Concours Nedjma & Mobilis"
 ALG_nedjma_and_mobilis_desc: "Encourager une saine concurrence entre opérateurs, comme Nedjma et Mobilis, fera baisser les prix et améliorera la qualité de service."
 ALG_fiber_optic_program: "Infrastructure de fibre optique"
 ALG_fiber_optic_program_desc: "Investir dans le déploiement national de la fibre optique pour accroître la connectivité et la vitesse du réseau dans tout le pays."
 ALG_4g_rollout: "Déployer les services 4G"
 ALG_4g_rollout_desc: "Le lancement de l'internet mobile 4G transformera la connectivité, permettant de meilleurs e-services et une productivité numérique accrue."
 ALG_air_algerie_modernization: "Modernisation d’Air Algérie"
 ALG_air_algerie_modernization_desc: "Renforcer la flotte et les liaisons d'Air Algérie stimulera le tourisme et améliorera la logistique internationale."
 ALG_international_airports_upgrade: "Moderniser les principaux aéroports"
 ALG_international_airports_upgrade_desc: "Investir dans des aéroports comme Alger, Oran et Constantine pour en faire des hubs du trafic aérien régional et mondial."
 ALG_aadl_housing_projects: "Programmes de logement AADL"
 ALG_aadl_housing_projects_desc: "Les projets de l'Agence nationale de l'amélioration et du développement du logement fourniront des logements subventionnés et un développement urbain à une population urbaine croissante."
 ALG_urbanization_initiatives: "Initiatives de développement urbain"
 ALG_urbanization_initiatives_desc: "Étendre routes, réseaux et zones constructibles soutiendra nos villes en croissance et améliorera la qualité de vie."
 ALG_arpt_regulation: "Autorité de régulation ARPT"
 ALG_arpt_regulation_desc: "L'ARPT garantit des pratiques de marché équitables, la concurrence et la protection des consommateurs dans le secteur des télécoms."
 ALG_algerie_telecom_program: "Programme Algérie Télécom"
 ALG_algerie_telecom_program_desc: "Un plan de modernisation d'ensemble pour l'opérateur public des télécoms."
 ALG_mobile_operator_competition: "Réforme de la concurrence télécoms"
 ALG_mobile_operator_competition_desc: "La concurrence entre Nedjma et Mobilis a encouragé l'innovation et des tarifs abordables."
 ALG_4g_coverage: "Couverture nationale 4G"
 ALG_4g_coverage_desc: "Le haut débit mobile avancé améliore les communications et soutient une économie numérique."
 ALG_national_innovation_push: "Poussée d'innovation nationale"
 ALG_national_innovation_push_desc: "Une initiative soutenue par l'État pour promouvoir l'innovation et le développement technologique dans tous les secteurs."
 ALG_highway_project: "Projet d'autoroute est-ouest"
 ALG_highway_project_desc: "Un projet de 13 milliards de dollars reliant l'Est et l'Ouest modernisera les transports et réduira les temps de trajet."
 ALG_air_algerie_investment: "Investissement Air Algérie"
 ALG_air_algerie_investment_desc: "Étendre la compagnie aérienne nationale ouvre de nouvelles opportunités commerciales et de voyage."
 ALG_air_hub_status: "Hub Aérien Régional d'Alger"
 ALG_air_hub_status_desc: "Alger a le potentiel de devenir un hub central entre l'Afrique, l'Europe et le Moyen-Orient."
 ALG_aadl_program: "Initiative de logement AADL"
 ALG_aadl_program_desc: "L'Agence nationale de l'amélioration et du développement du logement vise à construire des logements abordables pour des milliers de familles à travers l'Algérie."
 ALG_kabylia_unrest: "Troubles en Kabylie"
 ALG_kabylia_unrest_desc: "Depuis le « Printemps berbère » de 1980, la Kabylie est marquée par des protestations périodiques, des revendications culturelles et une méfiance envers le gouvernement central. Ces tensions couvent sous la surface, minant la stabilité et menaçant d'éclater en troubles plus vastes si elles ne sont pas traitées. Sans résolution, les événements pourraient s'aggraver dramatiquement à l'avenir."
 ALG_black_spring.1.t: "Troubles en Kabylie"
 ALG_black_spring.1.d: "Après le meurtre de Massinissa Guermah par les forces de gendarmerie, des manifestations de masse ont éclaté en Kabylie. Les troubles s'amplifient de jour en jour."
 ALG_black_spring.1.a: "Il faut y faire face."
 ALG_black_decade: "Décennie noire"
 ALG_black_decade_desc: "La guerre civile algérienne, connue en Algérie comme la décennie noire, opposa le gouvernement algérien à divers groupes rebelles islamistes du 11 janvier 1992 (après un coup d'État annulant une victoire électorale islamiste) au 8 février 2002. La guerre commença lentement : il sembla d'abord que le gouvernement avait écrasé le mouvement islamiste, mais des groupes armés émergèrent pour déclarer le djihad et, dès 1994, la violence atteignit un niveau tel que le gouvernement paraissait incapable d'y résister. En 1996-97, il était clair que la résistance islamiste avait perdu son soutien populaire, bien que les combats se soient poursuivis plusieurs années encore."
 ALG_maghreb_invite.1.t: "Invitation à l'Union du Maghreb"
 ALG_maghreb_invite.1.d: "L'Algérie propose une alliance économique et militaire nord-africaine. La rejoindrons-nous ?"
 ALG_maghreb_invite.1.a: "Rejoindre l'Union"
 ALG_maghreb_invite.1.b: "Refuser (Maroc uniquement)"
 ALG_maghreb_trade_hub: "Plaque tournante commerciale du Maghreb"
 ALG_maghreb_trade_hub_desc: "Notre économie prospère comme centre du commerce nord-africain."
 ALG_maghreb_diplomacy: "Diplomatie maghrébine"
 ALG_maghreb_diplomacy_desc: "L'Algérie s'affirme comme le leader de l'Afrique du Nord, favorisant l'unité par le commerce et la sécurité partagée."
 ALG_maghreb_union_tt: "Union du Maghreb formée\nL'Algérie, la Tunisie et d'autres nations nord-africaines partagent désormais des liens économiques et militaires sous notre direction."
 ALG_trade_allies: "Alliés commerciaux"
 ALG_egypt_algiers_axis: "Axe Egypte-Alger"
 ALG_egypt_algiers_axis_desc: "Nos relations avec l'Égypte remontent loin. Nous devons continuer à renforcer notre position en Afrique et diriger ce continent."
 FIS_Are_Terrorists: "Le FIS sont des terroristes"
 ALG_un_peacekeepers: "Des soldats de la paix des Nations Unies déployés"
 ALG_un_peacekeepers_desc: "Les Nations unies ont dépêché des forces de maintien de la paix afin de stabiliser la région et d'éviter de nouveaux combats. Leur mission est de garantir l'ordre, de protéger les civils et d'appuyer les efforts diplomatiques vers une paix durable."
 ALG_civil_war_recovered: "Guerre civile surmontée"
 ALG_civil_war_recovered_desc: "Le pays est sorti des convulsions de la guerre civile et entame le long processus de cicatrisation et de reconstruction. Les efforts se concentrent sur le rétablissement de l'unité, la reconstruction des infrastructures et la prévention de tout nouveau conflit intérieur."
 ALG_sonatrach_restructure: "Restructuration de Sonatrach"
 ALG_sonatrach_restructure_desc: "La compagnie pétrolière nationale Sonatrach engage une vaste restructuration afin d'améliorer l'efficacité, d'accroître la production et de consolider la stabilité économique. Cette transformation vise à dynamiser le secteur énergétique du pays et à soutenir la croissance à long terme."
 ALG_investment_boom_modifier: "Boom des investissements"
 ALG_investment_boom_modifier_desc: "Le pays connaît une ruée d'investissements nationaux et étrangers, qui alimente une croissance et un développement rapides. Cette embellie renforce les capacités industrielles, les infrastructures et la prospérité générale."
 ALG_foreign_oil_licensing_bonus: "Licences pétrolières étrangères"
 ALG_foreign_oil_licensing_bonus_desc: "Accorde temporairement à des compagnies étrangères l'accès à nos champs pétroliers, accroissant notre capacité de production de pétrole."
 ALG_idea_pro_palestinian_campaign: "Campagne pro-palestinienne"
 ALG_idea_pro_palestinian_campaign_desc: "Améliore les relations avec les groupes palestiniens et peut renforcer le soutien aux mouvements d'indépendance algériens dans la région."
 ALG_idea_palestinian_backing: "Soutien de l'Algérie aux droits palestiniens"
 ALG_idea_palestinian_backing_desc: "Analyse du soutien historique et actuel de l'Algérie aux droits des Palestiniens, y compris les positions diplomatiques, les initiatives d'aide et l'engagement politique plus large."
 ALG_idea_palestinian_aid_fund: "Fonds algérien d'aide à la Palestine"
 ALG_idea_palestinian_aid_fund_desc: "Un fonds créé par l'Algérie pour fournir une aide humanitaire et au développement au peuple palestinien. Il peut inclure des secours d'urgence, le développement des infrastructures, l'éducation et des initiatives d'autonomisation économique."
 ALG_crackdown_backfired: "La répression s’est retournée contre elle"
 ALG_idea_refoming_education1: "Réformer l'éducation"
 ALG_idea_refoming_education: "Réformer l'éducation"
 ALG_university_expansion: "Agrandissement de l'université"
 ALG_basic_income_support: "Soutien du revenu de base"
 ALG_housing_support_idea: "Aide au logement"
 ALG_childcare_reform: "Réforme de la petite enfance"
 ALG_civil_rights: "Accorder des droits civils"
 ALG_public_admin_reform: "Transports publics gratuits"
 MSP_switch_to_morocco: "Abandonner les Sahraouis"
 MSP_switch_to_morocco_desc: "Le soutien aux Sahraouis a détérioré nos relations avec le Maroc. Le Maroc est une puissance économique montante, un État puissant à nos portes. Il serait plus raisonnable d'abandonner ce soutien insensé aux Sahraouis et de tisser des liens amicaux avec le Maroc."
 MSP_influence_mauritania: "Influencer la Mauritanie"
 MSP_influence_mauritania_desc: "La Mauritanie a mené une courte guerre contre le Maroc pour le Sahara occidental après le retrait de l'Espagne. Elle ne revendique plus le territoire, mais suit de près le conflit et demeure l'un des soutiens du Front Polisario. Il importe d'accroître notre emprise sur elle afin de résoudre le conflit du Sahara occidental."
 MSP_casablanca_accords: "Accords de Casablanca"
 MSP_casablanca_accords_desc: "Le conflit au Sahara occidental est gelé depuis des décennies, sans que personne n'ait su le résoudre. Nous devons user de notre influence dans la région pour y mettre fin."
 ALG_influence_mauritania: "Influencer la Mauritanie"
 ALG_influence_mauritania_desc: "La Mauritanie a mené une courte guerre contre le Maroc pour le Sahara occidental après le retrait de l'Espagne. Elle ne revendique plus le territoire, mais suit de près le conflit et demeure l'un des soutiens du Front Polisario. Il importe d'accroître notre emprise sur elle afin de résoudre le conflit du Sahara occidental."
 ALG_energy_reform: "Réforme énergétique"
 ALG_energy_reform_desc: "Nous devons résoudre notre problème énergétique. En réformant le secteur, nous pourrons distribuer l'énergie à tout le pays."
 ALG_focus_on_oil: "Priorité au pétrole"
 ALG_focus_on_oil_desc: "De nombreux gisements pétroliers demeurent inexploités à travers l'Algérie, et selon certaines études le pays pourrait figurer parmi les plus riches en pétrole au monde : la plus grande partie n'est tout simplement pas extraite. Nous devons donc nous concentrer sur le pétrole."
 ALG_focus_on_oil_tt: "§CSe concentrer sur le pétrole nous permettra de dégager davantage de profits en vendant de l'énergie à nos voisins, mais ce sera désastreux pour Hassi Messaoud !§!"
 ALG_focus_on_renewables: "Priorité aux énergies renouvelables"
 ALG_focus_on_renewables_desc: "En Algérie, aucun village n'est trop petit pour le soleil. Nous devons montrer l'exemple au reste du monde et bâtir un réseau énergétique durable. Ce sera coûteux, mais cela en vaudra la peine pour les générations futures."
 ALG_focus_on_renewables_tt: "§CSe concentrer sur les énergies renouvelables ne rapportera pas autant que le pétrole, mais ce sera meilleur pour Hassi Messaoud !§!"
 ALG_oil_production: "Travailler avec Sonatrach"
 ALG_oil_production_desc: "La principale compagnie pétrolière et gazière algérienne est Sonatrach, une entité publique. C'est un acteur majeur du marché énergétique mondial, qui recherche activement des investissements et des partenariats dans le pétrole et le gaz. Sonatrach intervient sur toute la chaîne des hydrocarbures, de l'exploration et de la production au raffinage et à la distribution."
 ALG_grid_expansion: "Extension du réseau"
 ALG_grid_expansion_desc: "C'est bien de produire notre propre électricité, mais il nous faut aussi un réseau robuste pour la faire circuler dans le pays et vers nos voisins."
 ALG_solar_panel_grid: "Grille de panneaux solaires"
 ALG_solar_panel_grid_desc: "Vu notre position géographique, le soleil abonde presque toujours en Algérie. C'est un emplacement idéal pour implanter des centrales solaires."
 ALG_hassi_massoud_exploitation: "Hassi MessaoudExploitation"
 ALG_resource_excavation_research: "Recherche d'extraction pétrolière"
 ALG_resource_excavation_research_desc: "Une partie du pétrole se trouve en des lieux difficiles d'accès. Nous devons collaborer avec l'université d'Alger 1 pour trouver le moyen d'extraire jusqu'au dernier baril."
 ALG_wind_turbine_research: "Recherche sur les éoliennes"
 ALG_wind_turbine_research_desc: "Avec la technologie actuelle, implanter des parcs éoliens en Algérie est impossible. Les conditions de vent ne conviennent tout simplement pas aux turbines contemporaines. Il faut investir dans la recherche de solutions."
 ALG_ethanol_power_plant: "Centrale électrique à l'éthanol"
 ALG_ethanol_power_plant_desc: "En utilisant de l'éthanol issu du lisier bovin, nous pouvons créer un moyen durable de produire de l'électricité."
 ALG_algeria_steelworks: "Aciéries d'Algérie"
 ALG_algeria_steelworks_desc: "Il faut extraire davantage de pétrole ! Avec tout ce pétrole supplémentaire, nous pourrons aussi installer une aciérie."
 ALG_Adrar_wind_park: "Parc éolien d'Adrar"
 ALG_Adrar_wind_park_desc: "Le parc éolien d'Adrar est un site naturel dans le sud de l'Algérie. Le terrain alentour se prête à l'implantation d'éoliennes, et c'est là que nous installerons le premier parc éolien du pays."
 ALG_national_space_program: "Programme spatial national"
 ALG_national_space_program_desc: "L'Algérie doit établir un programme spatial national pour rejoindre le rang des nations spatiales. Cette initiative posera les bases des futurs succès en exploration spatiale et en technologie satellitaire."
 ALG_arab_world_outreach: "Approfondir les liens diplomatiques arabes"
 ALG_arab_world_outreach_desc: "Pour renforcer l'influence de l'Algérie dans le monde arabe, nous devons relancer notre diplomatie et nos efforts de coordination. Par des visites bilatérales, des sommets et des initiatives commerciales, l'Algérie peut s'affirmer comme une force d'union dans la région."
 ALG_join_arab_league: "Renforcer l’engagement de la Ligue arabe"
 ALG_join_arab_league_desc: "Membre déjà de la Ligue arabe, l'Algérie peut aller au-delà de la simple participation et jouer un rôle diplomatique de premier plan. Promouvoir la coordination économique, les consultations de défense et la solidarité culturelle renforcera notre rang dans le monde arabe."
 ALG_support_palestine: "Soutenir la cause palestinienne"
 ALG_support_palestine_desc: "Les relations de longue date de l'Algérie avec la Palestine s'enracinent dans des expériences historiques partagées et une solidarité politique. Ce lien se manifeste sous diverses formes, notamment le soutien diplomatique à l'autodétermination palestinienne et l'aide humanitaire. L'engagement algérien envers la cause palestinienne est un pilier de sa politique étrangère."
 ALG_algeria_algiers_axis: "Forger l'axe Le Caire-Alger"
 ALG_algeria_algiers_axis_desc: "En se rapprochant de l'Égypte, l'Algérie peut contribuer à former un bloc régional puissant, capable de guider l'unité arabe, d'assurer la stabilité nord-africaine et de contrebalancer l'influence étrangère."
 ALG_condemn_israel: "Condamner les actions israéliennes"
 ALG_condemn_israel_desc: "Face à l'agression persistante et aux violations des droits de l'homme, l'Algérie condamnera officiellement les actions israéliennes sur la scène internationale, rassemblant les soutiens à une paix juste et s'opposant à toute normalisation sans règlement."
 ALG_palestinian_aid_package: "Programme d'aide palestinien"
 ALG_palestinian_aid_package_desc: "Nous allouerons des ressources pour fournir une assistance humanitaire, économique et technique aux territoires palestiniens, afin que l'engagement de l'Algérie aille au-delà des paroles et se traduise par une aide concrète."
 ALG_pan_african_defense_initiative: "Initiative de défense panafricaine"
 ALG_pan_african_defense_initiative_desc: "Pour protéger la souveraineté africaine et renforcer la stabilité continentale, l'Algérie proposera une initiative de défense africaine coordonnée, afin de bâtir une préparation militaire collective face aux menaces communes."
 ALG_send_troops_to_sahel: "Déployer des forces au Sahel"
 ALG_send_troops_to_sahel_desc: "Face à l'instabilité croissante au Sahel, l'Algérie enverra des troupes pour appuyer les opérations de maintien de la paix, la protection des frontières et les campagnes antiterroristes, en collaboration avec les gouvernements régionaux."
 ALG_sahel_stabilization_force: "Force de stabilisation du Sahel"
 ALG_sahel_stabilization_force_desc: "L'Algérie prendra la tête de la création d'une force permanente de stabilisation du Sahel, un cadre de sécurité africain destiné à contrer les insurrections et les réseaux criminels dans la région."
 ALG_exploit_sahel_resources: "Exploiter les ressources du Sahel"
 ALG_exploit_sahel_resources_desc: "L'influence algérienne au Sahel ouvre l'accès à des ressources naturelles inexploitées. En négociant des contrats miniers et d'infrastructure, nous pourrons garantir des gains économiques et des partenariats stratégiques dans la région."
 ALG_propose_maghreb_union: "Proposer l'Union du Maghreb"
 ALG_propose_maghreb_union_desc: "Il est temps de relancer la vision d'un Maghreb uni. L'Algérie prendra l'initiative de proposer de nouveaux efforts d'intégration, centrés sur la coopération économique, les infrastructures communes et l'alignement diplomatique."
 ALG_economic_integration_initiative: "Intégration économique maghrébine"
 ALG_economic_integration_initiative_desc: "Par la baisse des tarifs, l'investissement dans les infrastructures et des discussions de politique monétaire synchronisée, l'Algérie impulsera les efforts pour créer une zone économique maghrébine commune au bénéfice de tous les États membres."
 ALG_maghreb_joint_defense_pact: "Pacte de défense commune maghrébin"
 ALG_maghreb_joint_defense_pact_desc: "Un Maghreb sûr exige une défense collective. Nous proposerons un pacte militaire régional axé sur la protection des frontières, le partage du renseignement et des exercices conjoints."
 ALG_idea_joint_military_arab: "Forces armées arabes conjointes"
 palestine_issue_very_positive: "Soutenir la question palestinienne"
 ALG_algerian_airforce: "Moderniser l'armée de l'air algérienne"
 ALG_algerian_airforce_desc: "Une aviation moderne et capable est essentielle à la défense nationale. Nous investirons dans la restructuration, la formation des pilotes et l'acquisition d'équipements afin de renforcer notre préparation aérienne."
 ALG_buy_russia_su_27: "Acheter des SU-27 russes"
 ALG_buy_russia_su_27_desc: "Dans le cadre de la modernisation de notre aviation, nous négocierons avec la Russie l'achat d'un lot de chasseurs Su-27, afin de renforcer notre supériorité aérienne et notre dissuasion stratégique."
 ALG_oum_el_bouaghi_airbase: "Agrandir la base aérienne d'Oum El Bouaghi"
 ALG_oum_el_bouaghi_airbase_desc: "Située stratégiquement à l'est, Oum El Bouaghi sera agrandie en un pôle opérationnel majeur de l'aviation algérienne, renforçant nos capacités de déploiement rapide."
 ALG_protect_the_skies: "Protéger les cieux"
 ALG_protect_the_skies_desc: "Face à la montée des menaces aériennes régionales, l'Algérie doit pouvoir détecter et intercepter toute incursion. Renforcer nos défenses aériennes est une priorité de sécurité nationale."
 ALG_russia_mig_servicing: "Contrats de maintenance des MiG russes"
 ALG_russia_mig_servicing_desc: "L'entretien et la modernisation de notre flotte de MiG exigent une coopération plus étroite avec des contractants russes. Ces accords de maintenance garantiront la longévité opérationnelle des appareils existants."
 ALG_bosnian_parts: "Pièces de rechange bosniaques sécurisées"
 ALG_bosnian_parts_desc: "L'Algérie obtiendra des composants de surplus de l'industrie de défense bosniaque afin de soutenir et de moderniser nos cellules vieillissantes, pour un entretien et des réparations à moindre coût."
 ALG_comprehensive_radar_installations: "Extension de la couverture radar"
 ALG_comprehensive_radar_installations_desc: "Pour assurer une couverture radar nationale complète, nous construirons des installations radar avancées sur les frontières et les côtes algériennes, afin de combler tous les angles morts de notre espace aérien."
 ALG_reform_or_control: "Réformer ou contrôler"
 ALG_reform_or_control_desc: "L'Algérie se trouve à un carrefour politique. Le choix entre une véritable réforme démocratique et la consolidation d'un contrôle autoritaire définira l'avenir de la nation."
 ALG_legalize_moderate_islamists: "Légaliser les islamistes modérés"
 ALG_legalize_moderate_islamists_desc: "Reconnaître les partis islamistes modérés ouvre une voie vers la stabilité par l'inclusion. Une participation électorale soigneusement encadrée peut désamorcer les sentiments radicaux."
 ALG_restore_elections: "Restaurer les processus électoraux"
 ALG_restore_elections_desc: "Pour relégitimer l'État, l'Algérie doit reprendre des élections libres et équitables. La transparence et la responsabilité seront les piliers de notre nouvelle ère politique."
 ALG_public_media_and_transparency: "Renforcer les médias publics et la transparence"
 ALG_public_media_and_transparency_desc: "La réforme des médias d'État et la liberté de la presse sont vitales pour reconstruire la confiance du public. Une citoyenneté informée est essentielle au développement démocratique."
 ALG_crackdown_on_opposition: "Réprimer l'opposition"
 ALG_crackdown_on_opposition_desc: "Pour prévenir la déstabilisation, la dissidence doit être contenue. Surveillance, censure et arrestations ciblées neutraliseront les éléments antigouvernementaux."
 ALG_state_surveillance_network: "Réseau de surveillance de l'État"
 ALG_state_surveillance_network_desc: "Un réseau de renseignement national sera étendu afin de surveiller les activités politiques et de neutraliser les menaces avant qu'elles ne s'aggravent."
 ALG_joint_governance_experiment: "Expérience de gouvernance conjointe"
 ALG_joint_governance_experiment_desc: "Nous testerons une nouvelle forme de partage du pouvoir entre forces laïques et religieuses afin d'éviter un nouveau conflit. Cette expérience risquée pourrait apporter la paix... ou la paralysie."
 ALG_a_radical_reorientation: "Une réorientation radicale"
 ALG_a_radical_reorientation_desc: "L'ordre existant a échoué. Par un mandat divin et une clarté idéologique, une nouvelle voie s'ouvre, guidée par une foi sans compromis et le rejet de la légitimité de l'État laïc."
 ALG_covert_support_for_islamist_radicals: "Soutien clandestin aux radicaux islamistes"
 ALG_covert_support_for_islamist_radicals_desc: "Des réseaux radicaux demeurent actifs dans l'ombre. Avec un financement stratégique et une aide logistique clandestine, nous pourrons les habiliter à agir contre le régime de l'intérieur."
 ALG_tolerate_radical_preachers: "Tolérer les prédicateurs radicaux"
 ALG_tolerate_radical_preachers_desc: "La chaire est un outil puissant. En fermant les yeux sur les sermons incendiaires, nous laissons l'idéologie se propager organiquement par les mosquées et les médias, radicalisant la population en notre faveur."
 ALG_welcome_militants: "Accueillir les militants étrangers"
 ALG_welcome_militants_desc: "Notre cause transcende les frontières. Des combattants étrangers alignés sur notre idéologie peuvent être accueillis en sécurité et intégrés aux cellules locales, apportant l'expérience du combat et un dévouement sans faille."
 ALG_arms_smuggling: "Opérations de contrebande d’armes"
 ALG_arms_smuggling_desc: "Pour préparer une confrontation future, nous devons établir des filières clandestines d'armes et de munitions. Des alliances avec des trafiquants transnationaux serviront nos besoins."
 ALG_start_the_uprising: "Déclencher le soulèvement"
 ALG_start_the_uprising_desc: "L'heure est venue. Nos réseaux activés, nos combattants armés et notre idéologie en expansion, nous nous lèverons contre le régime et proclamerons un nouvel ordre islamique."
 ALG_clamp_down_on_vices: "Réprimer les vices"
 ALG_clamp_down_on_vices_desc: "Le jeu, l'alcool et la décadence morale n'ont pas leur place dans notre société. Une vaste campagne pour éliminer ces vices purifiera la nation et affirmera l'autorité religieuse."
 ALG_revolutionize_the_ulema: "Révolutionner les oulémas"
 ALG_revolutionize_the_ulema_desc: "L'establishment religieux doit s'aligner sur la cause révolutionnaire. Les oulémas traditionnels seront purgés ou rééduqués, tandis que des clercs loyaux prendront leur place comme guides spirituels de l'État."
 ALG_traditional_gender_roles: "Renforcer les rôles de genre traditionnels"
 ALG_traditional_gender_roles_desc: "L'ère moderne a corrompu l'ordre naturel. Nous reviendrons aux rôles divinement prescrits des hommes et des femmes, en instituant un cadre juridique strict qui reflète ces valeurs."
 ALG_pledge_allegiance_to_al_qaeda: "Prêter allégeance à al-Qaïda"
 ALG_pledge_allegiance_to_al_qaeda_desc: "Pour que le djihad mondial aboutisse, l'unité est essentielle. Nous jurerons allégeance à Al-Qaïda, nous alignant sur leur vision et obtenant le soutien d'un réseau islamiste plus large."
 ALG_pledge_allegiance_to_daesh: "Prêter allégeance à l'État islamique"
 ALG_pledge_allegiance_to_daesh_desc: "Al-Qaïda est un mouvement décrépit et déclinant, qui a perdu de vue son objectif originel de djihad mondial pour s'enliser dans des affaires locales. L'heure est à un nouveau mouvement, animé d'un nouveau sens de la mission."
 ALG_secure_the_loyalty_of_aqim: "S'assurer la loyauté d'AQMI"
 ALG_secure_the_loyalty_of_aqim_desc: "Al-Qaïda au Maghreb islamique doit reconnaître notre direction et opérer en coordination avec notre État. Leur loyauté garantira un contrôle durable des opérations djihadistes régionales."
 ALG_war_on_daesh: "Guerre contre Daech"
 ALG_secure_the_loyalty_effect_tt: "Les effets dépendront du fait d'avoir l'un des pays suivants comme marionnettes : [AQY.GetNameWithFlag], [NUS.GetNameWithFlag], [TTP.GetNameWithFlag]"
 ALG_war_on_daesh_desc: "Le soi-disant « État islamique » est une menace claire pour notre direction du mouvement djihadiste mondial. Leur rejet de notre autorité et leurs tactiques non conventionnelles ne peuvent plus être tolérés. Il est temps de mener une guerre totale contre l'arriviste Daech."
 ALG_jihad_in_the_maghreb: "Djihad au Maghreb"
 ALG_jihad_in_the_maghreb_desc: "Les régimes laïcs du Maroc, de la Tunisie et de l'Algérie doivent tomber. Nous étendrons notre califat par la force, en lançant une campagne régionale de guerre sainte et d'expansion territoriale."
 ALG_jihad_in_arabia: "Djihad en Arabie"
 ALG_jihad_in_arabia_desc: "Foyer des lieux saints de La Mecque et de Médine, la péninsule arabique est peut-être le territoire le plus sacré du monde. Elle ne saurait donc continuer d'être gouvernée par des régimes insuffisamment pieux et corrompus."
 ALG_jihad_in_the_levant: "Djihad en Irak et au Cham"
 ALG_jihad_in_the_levant_desc: "L'Irak et le Levant sont des régions déchirées par des forces étrangères depuis l'ère coloniale. Ce n'est que par les armes que les occupants croisés et sionistes du Levant pourront être chassés."
 ALG_jihad_in_west_africa: "Djihad en Afrique de l'Ouest"
 ALG_jihad_in_west_africa_desc: "Notre révolution ne s'arrête pas au Maghreb. L'heure est venue d'exporter le djihad en Afrique de l'Ouest, en renversant les régimes du Mali, du Niger et de la Mauritanie à mesure que nous marchons vers le sud."
 AlgeriaFocus.56.t: "[FROM.GetNameDef] soutient notre indépendance"
 AlgeriaFocus.56.d: "[FROM.GetNameDef] a affirmé son soutien à notre indépendance vis-à-vis du Maroc et a indiqué vouloir travailler encore plus étroitement avec nous à l'avenir."
 AlgeriaFocus.56.a: "Great"
 AlgeriaFocus.57.t: "[FROM.GetNameDef] nous abandonne"
 AlgeriaFocus.57.d: "[FROM.GetNameDef] a retiré son soutien à notre indépendance. Ils ont été nos alliés pendant des décennies, mais il semble qu'ils nous aient désormais abandonnés pour s'entendre avec le Maroc."
 AlgeriaFocus.57.a: "Traîtres !"
 algeria_algerian_foreign_policy: "Politique étrangère algérienne"
 AlgeriaFocus.64.t: "[FROM.GetNameDef] Exige l'autonomie crétoise"
 AlgeriaFocus.64.d: "Le gouvernement [FROM.GetAdjective] s'est dit inquiet de notre position sur l'île de Crète. Selon lui, notre emprise serrée sur l'île compromet sa sécurité. Il exige que la Crète obtienne une autonomie limitée afin de réduire notre présence militaire et politique dans la région."
 AlgeriaFocus.64.a: "Je suppose que nous le pouvons"
 AlgeriaFocus.64.b: "C'est ridicule"
 AlgeriaFocus.65.t: "[FROM.GetNameDef] Accepte"
 AlgeriaFocus.65.d: "Le gouvernement [FROM.GetAdjective] a accepté nos demandes d'accroître l'autonomie du peuple crétois."
 AlgeriaFocus.65.a: "Succès"
 AlgeriaFocus.66.t: "[FROM.GetNameDef] refuse"
 AlgeriaFocus.66.d: "Le gouvernement [FROM.GetAdjective] a rejeté nos demandes d'accroître l'autonomie du peuple crétois."
 AlgeriaFocus.66.a: "Ils le regretteront"
 AlgeriaFocus.66.b: "Nous saurons attendre notre heure"
 AlgeriaFocus.67.t: "Le Hamas lance une nouvelle Intifada"
 AlgeriaFocus.67.d: "Le Hamas a appelé à une nouvelle intifada contre nous. Nous observons une activité accrue des miliciens du Hamas et plusieurs manifestations ont déjà eu lieu contre notre autorité en Palestine. Selon nos rapports, l'Algérie pourrait être derrière l'armement et la motivation du Hamas pour cette nouvelle campagne."
 AlgeriaFocus.67.a: "Ils le regretteront"
 AlgeriaFocus.68.t: "[FROM.GetNameDef] sponsorise une nouvelle Intifada"
 AlgeriaFocus.68.d: "[FROM.GetAdjective] nous a envoyé des armes et de l'argent pour lancer une nouvelle intifada contre Israël. Nous avons déjà une file de nouvelles recrues près de nos bureaux, et la population se mobilise pour protester contre les occupants israéliens."
 AlgeriaFocus.68.a: "Nous remercions l'Algérie"
 AlgeriaFocus.69.t: "Le Hamas se lève"
 AlgeriaFocus.69.d: "Nous recevons des rapports de combattants du Hamas s'emparant d'institutions et de bâtiments clés de la bande de Gaza. Ils ont juré qu'Israël souffrirait d'une nouvelle intifada."
 AlgeriaFocus.69.a: "Damn"
 AlgeriaFocus.69.b: "Abattez-les !"
 AlgeriaFocus.70.t: "[FROM.GetNameDef] Contacts Toubou"
 AlgeriaFocus.70.d: "Nous avons appris que l'Algérie a commencé à armer des rebelles toubous dans le nord de notre pays. Si l'Algérie envahit, ces rebelles se joindront sûrement à sa cause."
 AlgeriaFocus.70.a: "Inquiétant"
 AlgeriaFocus.71.t: "[FROM.GetNameDef] suggère une exploitation minière conjointe"
 AlgeriaFocus.71.d: "Le gouvernement [FROM.GetAdjective] a proposé une entreprise minière d'uranium conjointe dans la bande d'Aouzou. Cela fournira des ressources à nos deux pays à l'avenir. Comment répondre ?"
 AlgeriaFocus.71.a: "Une excellente idée !"
 AlgeriaFocus.71.b: "Peu nous importe"
 AlgeriaFocus.72.t: "[FROM.GetNameDef] accepte notre accord"
 AlgeriaFocus.72.d: "Le gouvernement [FROM.GetAdjective] a accepté notre accord d'exploitation minière conjointe"
 AlgeriaFocus.72.a: "Great"
 AlgeriaFocus.73.t: "[FROM.GetNameDef] rejette notre accord"
 AlgeriaFocus.73.d: "Le gouvernement [FROM.GetAdjective] a rejeté notre accord d'exploitation minière conjointe"
 AlgeriaFocus.73.a: "Damn"
 AlgeriaFocus.74.t: "[FROM.GetNameDef] Démarre l'extraction d'uranium"
 AlgeriaFocus.74.d: "[FROM.GetNameDef] a commencé l'extraction d'uranium dans la bande d'Aouzou. Si la plupart des ressources leur reviennent, nous obtenons aussi une petite part et les [FROM.GetAdjective] ont accepté de couvrir tous les coûts de l'excavation."
 AlgeriaFocus.74.a: "Okay"
 AlgeriaFocus.91.t: "Élargissement du gouvernement"
 AlgeriaFocus.91.d: "Maintenant que nous sommes aux affaires, nous devons solidifier notre position pour mener d'autres réformes en élargissant notre base de soutien. Deux partis ont proposé de s'allier à nous, mais à certaines conditions. Un petit parti ambitieux est dirigé par des décentralisateurs cherchant à transférer le pouvoir et à introduire des initiatives de démocratie directe. L'autre est dirigé par des républicains populistes visant une base bureaucratique centralisée capable d'agir comme une force unificatrice d'ordre et de justice, pleinement opposée à la décentralisation. Nous nous allierons avec :"
 AlgeriaFocus.91.a: "Les décentralisateurs"
 AlgeriaFocus.91.b: "Les républicains populistes"
 AlgeriaFocus.91.c: "Oui, nous pourrons en parler plus tard"
 ALG_claim_jerusalem_for_arabs: "Revendiquer Jérusalem pour les Arabes"
 ALG_claim_jerusalem_for_arabs_desc: "Ni les Israéliens ni les Palestiniens ne méritent la région. Ils ont montré qu'ils n'y feraient que du désordre. Il appartient aux véritables Arabes de gouverner la région et d'y apporter la paix et la stabilité."
 ALG_claim_jerusalem_for_arabs_tt: "Nous pourrons transformer les États §Yrevendiqués§! du Levant en §Yterritoires nationaux§!"
 ALG_approach_hamas: "Approchez-vous du Hamas"
 ALG_approach_hamas_desc: "Le Hamas est la seule véritable force tentant d'empêcher le sionisme. Nous devons tisser de meilleurs liens avec eux pour préparer la chute d'Israël."
 ALG_send_fighters_to_hamas: "Envoyez des combattants au Hamas"
 ALG_send_fighters_to_hamas_desc: "Si les Palestiniens résistent bravement aux envahisseurs sionistes, la simple vérité est qu'ils sont inférieurs en nombre. Nous devons organiser un groupe de volontaires pour se rendre en Palestine et rejoindre les rangs du Hamas."
 MSP_claim_jerusalem_for_arabs: "Revendiquer Jérusalem pour les Arabes"
 MSP_claim_jerusalem_for_arabs_desc: "Ni les Israéliens ni les Palestiniens ne méritent la région. Ils ont montré qu'ils n'y feraient que du désordre. Il appartient aux véritables Arabes de gouverner la région et d'y apporter la paix et la stabilité."
 MSP_approach_hamas: "Approchez-vous du Hamas"
 MSP_approach_hamas_desc: "Le Hamas est la seule véritable force tentant d'empêcher le sionisme. Nous devons tisser de meilleurs liens avec eux pour préparer la chute d'Israël."
 MSP_send_fighters_to_hamas: "Envoyez des combattants au Hamas"
 MSP_send_fighters_to_hamas_desc: "Si les Palestiniens résistent bravement aux envahisseurs sionistes, la simple vérité est qu'ils sont inférieurs en nombre. Nous devons organiser un groupe de volontaires pour se rendre en Palestine et rejoindre les rangs du Hamas."
 MSP_condemn_china: "Condamner la Chine"
 MSP_condemn_china_desc: "Le traitement par la Chine de ses musulmans autochtones est abject et doit être condamné"
 MSP_improve_relations_with_algeria: "Améliorer les relations avec l'Égypte"
 MSP_improve_relations_with_algeria_desc: "La Turquie a une histoire tumultueuse avec l'Égypte, principalement en raison de nos conflits passés. Nous sommes tous du même côté et ne devrions pas être si froids envers les Égyptiens"
 MSP_work_together_with_BSEC: "Travailler avec l'OCEMN"
 MSP_work_together_with_BSEC_desc: "L'OCEMN (Organisation de coopération économique de la mer Noire) vise à apporter la prospérité autour de la mer Noire. Elle réunit des pays riverains et certains des Balkans du Sud. Nous devons travailler avec ces pays pour un bénéfice accru"
 MSP_fixing_ideals: "Réparer les idéaux"
 AlgeriaInvestment.1.t: "[ALG.GetNameDef] nous invite à investir dans ses projets"
 AlgeriaInvestment.1.desc: "Sortant d'une décennie de guerre civile, le gouvernement de [ALG.GetNameWithFlag] nous invite à investir dans plusieurs projets à travers le pays. Que nous engagions notre capital ou non nous appartient. L'investissement nous achèterait de l'influence à Alger, mais avec des groupes islamistes armés encore actifs dans l'intérieur, le risque pour nos avoirs est réel."
 AlgeriaInvestment.1.a: "Investir dans leurs infrastructures !"
 AlgeriaInvestment.1.b: "Investir dans leur industrie civile !"
 AlgeriaInvestment.1.c: "Investir dans leur secteur des services !"
 AlgeriaInvestment.1.d: "Mieux vaut ne pas prendre ce risque."
 AlgeriaInvestment.2.t: "[FROM.GetNameDef] a investi dans nos infrastructures !"
 AlgeriaInvestment.2.d: "Après des jours de négociations, [FROM.GetNameWithFlag] a accepté d'investir dans nos infrastructures en échange de concessions minimes. L'investissement profitera à notre population rurale."
 AlgeriaInvestment.2.a: "Nous leur sommes reconnaissants de leur aide !"
 AlgeriaInvestment.3.t: "[FROM.GetNameDef] a investi dans notre industrie civile !"
 AlgeriaInvestment.3.d: "Après des jours de négociations, [FROM.GetNameWithFlag] a accepté de nous aider à construire des usines civiles en échange de concessions mineures. L'investissement profitera au secteur industriel du pays et facilitera sa modernisation."
 AlgeriaInvestment.3.a: "Nous leur sommes reconnaissants de leur aide !"
 AlgeriaInvestment.4.t: "[FROM.GetNameDef] a investi dans notre secteur des services !"
 AlgeriaInvestment.4.d: "Après des jours de négociations, [FROM.GetNameWithFlag] a accepté d'investir dans notre secteur des services en construisant des bureaux en échange de concessions mineures. L'investissement profitera au secteur financier du pays et facilitera sa modernisation."
 AlgeriaInvestment.4.a: "Nous leur sommes reconnaissants de leur aide !"
 AlgeriaInvestment.5.t: "[FROM.GetNameDef] a refusé d'investir !"
 AlgeriaInvestment.5.d: "Après des jours de négociations, [FROM.GetNameWithFlag] a rejeté notre invitation à investir, estimant que le climat des affaires n'est pas encore assez sûr, et évaluera avec prudence de futurs accords d'investissement avec nous."
 AlgeriaInvestment.5.a: "Il faut encore travailler !"
 AlgeriaInvestment.6.t: "L'Algérie cherche des investissements moyen-orientaux après son adhésion à l'OMC"
 AlgeriaInvestment.6.d: "Avec son adhésion récente à l'Organisation mondiale du commerce (OMC), l'Algérie vise une infusion accrue de capitaux pour propulser le développement économique. Les responsables s'adressent aux nations du Moyen-Orient, appelant à davantage de coopération et d'investissement dans des secteurs clés. Ce geste signale la volonté de l'Algérie de s'appuyer sur des partenariats internationaux pour stimuler la croissance et la stabilité dans la région."
 AlgeriaInvestment.7.t: "Ils signent un accord commercial"
 AlgeriaInvestment.7.d: "Ils souhaiteraient proposer un accord commercial afin de renforcer la coopération et d'ouvrir la porte à de futurs investissements"
 AlgeriaInvestment.7.a: "Sure"
 AlgeriaInvestment.6.a: "Signer un accord commercial"
 AlgeriaInvestment.6.b: "Investir dans une usine"
 AlgeriaInvestment.6.c: "Non merci"
 Algeria.11.t: "[ALG.GetNameDef] demande notre protection"
 Algeria.11.d: "Après des décennies de troubles, le gouvernement algérien craint une reprise de la guerre ou une ingérence et une invasion extérieures. Le président de [ALG.GetNameWithFlag] [ALG.GetLeader] s'est rendu à Zhongnanhai et a approché le secrétaire général [CHI.GetLeader] pour un traité de défense. Si nous acceptons de les protéger, nous pourrons nous assurer qu'ils restent dans notre sphère d'influence, mais nous aurons aussi l'obligation de défendre [ALG.GetNameWithFlag] contre les menaces extérieures et d'aider à maintenir la stabilité du pays, notamment à contrer l'insurrection des extrémistes islamistes £GFX_ALG_salafist_jihadism. Compte tenu de la situation de notre pays, devons-nous signer un traité de défense avec [ALG.GetLeader] ?"
 Algeria.11.a: "Un autre frère de fer !"
 Algeria.11.b: "Nous n'avons rien à consacrer à un traité !"
 Algeria.12.t: "[CHI.GetNameDef] a accepté de nous protéger"
 Algeria.12.d: "Grâce à nos efforts diplomatiques, le secrétaire général [CHI.GetLeader] de [CHI.GetNameWithFlag] a officiellement signé un traité de défense avec notre président [ALG.GetLeader]. En signant ce traité, [FROM.GetNameWithFlag] nous protégera non seulement contre toute agression extérieure, mais aidera aussi à maintenir notre stabilité intérieure."
 Algeria.12.a: "Excellent!"
 Algeria.13.t: "[CHI.GetNameDef] a refusé de signer !"
 Algeria.13.d: "Bien que notre président [ALG.GetLeader] se soit rendu à [CHI.GetNameWithFlag] pour obtenir une assistance sécuritaire, [CHI.GetLeader] s'est montré visiblement avare de tout traité. [CHI.GetLeader] a dit à notre président : « Nous resterons toujours attachés à la sécurité et à la stabilité régionales. » Mais il est évident que l'engagement de [CHI.GetLeader] reste au stade des paroles : nous devrons nous défendre seuls."
 Algeria.13.a: "Quelle déception"
 ALG_reconciliation_path: "Priorité Réconciliation nationale achevée"
 ALG_join_nato_partnership: "Rejoignez le Partenariat de l'OTAN"
 ALG_eu_trade_agreements: "Accords commerciaux avec l'UE"
 ALG_expand_russian_gas_investments: "Étendre les investissements gaziers russes"
 ALG_expand_russian_gas_investments_desc: "Élargir les accords avec la Russie pour obtenir davantage de gaz et bâtir notre nation."
 ALG_join_belt_and_road: "Rejoindre les Nouvelles routes de la soie"
 ALG_join_belt_and_road_desc: "Rejoindre le système ferroviaire chinois et construire la première station de métro d'Afrique."
 ALG_tech_exchange_with_china: "Échanger des technologies avec la Chine"
 ALG_tech_exchange_with_china_desc: "Obtenir la technologie chinoise pour développer notre nation."
 ALG_mediterranean_dialogue: "Le Dialogue méditerranéen"
 ALG_military_takes_control: "L'armée prend le contrôle"
 ALG_install_tebboune: "Faire entrer Tebboune au gouvernement"
 ALG_tebboune: "Abdelmadjid Tebboune comme président"
