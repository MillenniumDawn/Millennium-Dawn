 IRQ_arm_rebels_in_afghanistan: "[AFG.GetFlag]アフガニスタンの反乱軍を武装させる"
 IRQ_arm_rebels_in_afghanistan_desc: "We can fund, train, and arm Shi'ites in [AFG.GetFlag] Afghanistan and prepare them to overthrow the [AFG.GetFlag] Afghan government in order to install an Islamic Republic."
 IRQ_islamic_spring_in_afghanistan: "[AFG.GetFlag]アフガニスタンにおけるイスラムの春"
 IRQ_islamic_spring_in_afghanistan_desc: "時が来た、我々の[AFG.GetFlag]アフガンのパートナーたちは彼らのイスラム革命をもたらす準備ができている！"
 IRQ_fao_decisions: "抑圧に対する戦線"
 IRQ_fao_decisions_desc: "Having founded a new regional alliance, the §HFront Against Oppression§! (FAO) will contest any and all semblances of non-Islamic influence. We will be able to invite countries that are §HShi'ites§!, and we will be able to expand our network of potential FAO candidates by preparing the §HSpring of Islam§! plan."
 IRQ_ask_for_iranian_arms: "[PER.GetFlag]イランの兵器を要請"
 IRQ_ask_for_iranian_arms_desc: "[PER.GetFlag]イラン人は、彼らが最も可能性が高く決して使用しないであろう武器の大きな備蓄を保持している。もしかしたら我々は彼らに、我々が使用するためにそれらのいくつかの上を送るように頼むことができるかもしれない。"
 IRQ_ask_for_iranian_funds: "[PER.GetFlag]イランの資金を要請"
 IRQ_ask_for_iranian_funds_desc: "我々は[PER.GetFlag]イラン人に、我々の開発に資金を提供するためにいくつかの現金のパレットを飛ばしてもらうよう要請することができる。"
