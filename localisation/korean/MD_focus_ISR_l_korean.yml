 israel_economy.53.t: "석유화학 산업 투자를 제안하는 이스라엘!"
 israel_economy.53.d: "이스라엘이 우리나라에 상호 이익이 되는 투자 협정을 제안했습니다. 수락하시겠습니까?"
 israel_economy.53.a: "물론입니다!"
 israel_economy.53.b: "죄송하지만 거절합니다"
 israel_economy.54.t: "[From.GetName]의 수락!"
 israel_economy.54.d: "그들이 우리의 제안을 수락했습니다!"
 israel_economy.54.a: "훌륭해!"
 israel_economy.55.t: "[From.GetName]의 거절!"
 israel_economy.55.d: "그들은 우리나라와 협력하기를 원하지 않습니다."
 israel_economy.55.a: "흠."
 israel_economy.56.t: "이스라엘 무기 거래"
 israel_economy.56.d: "이스라엘군이 우리나라에 타보르 돌격소총을 판매하고자 합니다. 구매하시겠습니까?"
 israel_economy.56.a: "동의한다!"
 israel_economy.56.b: "아니요"
 israel_economy.57.t: "[From.GetName]의 수락"
 israel_economy.57.d: "우리는 [From.GetName]과(와) 신형 돌격소총을 판매하는 거래를 체결했습니다!"
 israel_economy.57.a: "훌륭해!"
 israel_economy.58.t: "[From.GetName]의 거절"
 israel_economy.58.d: "그들은 우리의 돌격소총을 구매하지 않을 것입니다."
 israel_economy.58.a: "젠장"
 israel_economy.59.t: "이스라엘 드론 및 공수"
 israel_economy.59.d: "이스라엘군이 우리나라에 드론을 판매하고 우리 기지에 대한 공군 접근권을 요청하고 있습니다. 동의하시겠습니까?"
 israel_economy.59.a: "동의한다!"
 israel_economy.59.b: "아니요"
 israel_economy.60.t: "[From.GetName]의 수락"
 israel_economy.60.d: "우리는 [From.GetName]과(와) 거래를 체결했습니다!"
 israel_economy.60.a: "훌륭해!"
 israel_economy.61.t: "[From.GetName]의 거절"
 israel_economy.61.d: "그들은 동의하지 않았습니다."
 israel_economy.61.a: "젠장"
 israeli_intelligenc_idea: "모사드 네트워크"
 israeli_intelligenc2_idea: "모사드 네트워크 업그레이드"
 israeli_intelligenc3_idea: "모사드 네트워크 완전 업그레이드"
 israel_economy.65.t: "이스라엘 전략적 동반자 관계!"
 israel_economy.65.d: "이스라엘이 전략적 동반자 프로그램을 제안했습니다. 그들은 우리에게 새 공군 기지를 건설해 주는 대신, 이란에 대항하는 비밀 협정에 서명할 것을 요구합니다. 동의하시겠습니까?"
 israel_economy.65.a: "동의한다!"
 israel_economy.65.b: "위험을 감수할 수 없다..."
 israel_economy.66.t: "[From.GetName]의 수락"
 israel_economy.66.d: "그들은 우리의 전략적 동반자 계획에 동의했으며, 이란이 우리를 공격할 경우 이란을 공격하기로 합의했습니다."
 israel_economy.66.a: "좋습니다."
 israel_economy.67.t: "우리 계획을 거절한 [From.GetName]"
 israel_economy.67.d: "그들은 동의하지 않았습니다."
 israel_economy.67.a: "쳇."
 israel_economy.68.t: "경제 협력을 제안하는 이스라엘!"
 israel_economy.68.d: "이스라엘이 우리에게 접근하여 상호 이익이 되는 경제 협력을 제안했습니다. 동의하시겠습니까?"
 israel_economy.68.a: "물론입니다!"
 israel_economy.68.b: "죄송하지만 거절합니다."
 israel_economy.69.t: "[From.GetName]의 수락"
 israel_economy.69.d: "그들이 우리의 제안을 수락했습니다!"
 israel_economy.69.a: "훌륭해!"
 israel_economy.70.t: "[From.GetName]의 거절!"
 israel_economy.70.d: "그들이 우리의 제안을 거절했습니다!"
 israel_economy.70.a: "매우 유감이다."
 israel_economy.71.t: "아르메니아 집단학살을 인정한 이스라엘!"
 israel_economy.71.d: "최근 이스라엘 정부는 아르메니아 집단학살을 전면 인정한다고 발표했습니다. 또한 이스라엘-아르메니아 간 정치·경제 협력을 위한 새로운 로드맵도 구상했습니다."
 israel_economy.71.a: "감사합니다!"
 israel_economy.72.t: "아르차흐를 승인한 이스라엘!"
 israel_economy.72.d: "최근 이스라엘과 아르메니아 정부는 아르차흐를 동시에 승인하고 공식 조약을 선언하기로 결정했습니다. 이제 이스라엘은 우리 영토에 군사 기지를 설치할 것을 요청하고 있습니다. 동의하시겠습니까?"
 israel_economy.72.a: "물론이지!"
 israel_economy.72.b: "감사하지만 거절합니다."
 ifweagree_tt: "동의하면 아르차흐에 대한 이들의 영향력이 6%, 아르메니아에 대한 영향력이 4% 증가합니다. 이들은 이미 이전에 우리에게 5%의 영향력을 행사하고 있었습니다."
 israel_economy.73.t: "아르메니아의 동의!"
 israel_economy.73.d: "아르메니아가 우리의 제안에 동의했습니다."
 israel_economy.73.a: "훌륭해!"
 israel_economy.74.t: "우리 제안을 거절한 아르메니아"
 israel_economy.74.d: "그들은 동의하지 않았습니다."
 israel_economy.74.a: "허참."
 israel_economy.75.t: "우호 조약 체결을 원하는 이스라엘!"
 israel_economy.75.d: "최근 이스라엘 정부가 우리에게 우호 조약 체결을 제안했습니다. 동의하시겠습니까?"
 israel_economy.75.a: "물론입니다!"
 israel_economy.75.b: "죄송하지만 거절합니다."
 israel_economy.76.t: "조지아의 동의!"
 israel_economy.76.d: "그들이 우리와 우호 조약을 체결했습니다."
 israel_economy.76.a: "훌륭해!"
 israel_economy.77.t: "동의하지 않은 조지아"
 israel_economy.77.d: "그들은 우리와의 우호 조약에 서명하지 않았습니다."
 israel_economy.77.a: "매우 유감이다."
 oecd_supp_tt: "§Y서로 다른 지원 패키지 중에서 선택할 수 있게 됩니다.§!"
 chanc_of_succ_incr: "§R거셈 솔레이마니§! 암살의 §G성공§! §Y확률§!이 §G대폭 증가합니다!§!"
