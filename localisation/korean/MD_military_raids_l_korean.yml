 MD_raid.1.NATO: "제5조 발동"
 MD_raid.16.t: "[FROM.FROM.GetAdjective]의 [FROM.GetName] 타격 이후 다가오는 위기"
 MD_raid.16.d: "[FROM.FROM.GetName]의 도발적인 [FROM.GetAdjective] 영토 타격 이후 긴장은 비등점에 이르렀습니다. [FROM.GetName]의 지도자 [FROM.GetLeader]은(는) 타협의 여지가 없는 성명에서 자국 정부가 단호하게 대응할 것이라고 선언했습니다. 그는 병력을 동원하여 [FROM.FROM.GetAdjective] 영토로 진격할 계획을 발표하며 \\"[FROM.FROM.capital.GetCapitalVictoryPointName]의 광견병 걸린 폭군들을 제압\\"하고 \\"필요하다면 무력으로 질서를 회복\\"하겠다고 공언했습니다. 이러한 움직임은 지역 및 세계 안정에 영향을 미치며 외교 부재에서 비롯될 수 있는 위험을 보여 줍니다. 현재 외교 채널은 침묵을 지키고 있어, 이번 확전이 통제 불능의 대치로 번져 국제 평화와 안보에 심각한 결과를 초래할 수 있다는 우려가 커지고 있습니다."
 MD_raid.16.a: "다음엔 무슨 일이 벌어질까?"
 MD_raid.17.t: "나토 제5조를 발동한 [FROM.GetName]"
 MD_raid.17.d: "[FROM.FROM.GetAdjective]의 [FROM.GetAdjective] 영토 타격 이후 [FROM.capital.GetCapitalVictoryPointName]의 정부는 나토 제5조를 발동하여 동맹국들에 침략에 공동으로 대응할 것을 촉구하는 단호한 조치를 취했습니다. 보복이 아니며 도발도 없었다고 설명되는 [FROM.FROM.GetName]의 타격은 긴장을 크게 고조시켜 사태를 전쟁 직전으로 몰고 갔습니다. 나토 제5조 발동 결정은 국제 무대에 충격파를 던졌으며, 세계 각국 지도자들은 현대사에서 동맹이 맞이한 가장 중대한 시험 중 하나가 될 수도 있는 사태에 대응하느라 분주합니다. 외교관과 분석가들은 추가 확전의 가능성이 전 세계에 드리운 만큼 이번 사태가 미칠 광범위한 영향을 경고하고 있습니다."
 MD_raid.17.a: "거인이 도발당했다"
 MD_reparation2_TT: "§H그들은 1년 동안 우리를 타격하지 않겠다고 약속했습니다!§!\n§R우리가 그들을 습격하면 오랫동안 우리를 신뢰하지 않을 것입니다§!"
 RAID_war_instantly_TT: "§R즉시 전쟁이 발발합니다!§!"
 MD_nuclear_energy.1.t: "핵에너지 경고"
 MD_nuclear_energy.1.d: "원자력 발전소를 건설하기 전에 원자력 발전 아이디어가 활성화되어 있는지 확인하십시오. 그렇지 않으면 원자력 발전소는 그대로 놓여 있어 국가에 전력을 제공하지 않습니다."
 MD_nuclear_energy.1.a: "알겠다."
 has_modern_landing_craft_TT: "§H현대식 상륙정§!을 연구하지 않았으므로, 우리의 습격은 자국 대륙으로 제한됩니다."
 has_spec_ops_4_TT: "§H특수부대 전용 무기§!를 연구하지 않았으므로, 우리의 습격은 자국 대륙으로 제한됩니다."
 raid_type_beach_landing_preparation: "해안 상륙 준비"
 raid_type_beach_landing_preparation_desc: "상륙 작전을 더 효율적이고 효과적으로 만들기 위해 상륙군에 앞서 수행하는 작전입니다."
 beach_landing_preparation_modifier: "해안 상륙 준비"
 is_able_to_launch_a_strike_type_tt: "우리의 §Y핵 태세§!가 §Y핵 무기고§!의 §Y공세적 사용§!을 허용하거나, §Y[?var:target_state.GetName]§!이(가) [ROOT.GetNameWithFlag]의 소유 또는 영유권 주이고 [ROOT.GetNameWithFlag]의 항복 진행도가 §Y50%§!를 넘어야 합니다."
 is_able_to_use_nuclear_strikes_tt: "우리의 §Y핵무기 태세§!가 §Y핵 무기고§!의 §Y완전한 전면 사용§!을 허용하거나, 우리가 먼저 타격을 받았어야 합니다."
 is_able_to_use_nuclear_strikes_tac_tt: "우리의 §Y핵무기 태세§!가 §Y핵 무기고§!의 §Y전술적 선제 사용§! 또는 §Y완전한 전면 사용§!을 허용하거나, 우리가 먼저 타격을 받았어야 합니다."
 disable_raid_notifs_TT: "§C참고:\n - §H'[ROOT.GetFlag][ROOT.GetAdjective] 해외 영향력 보고서'§! 결정 메뉴에서 습격에 관한 사건 알림을 끌 수 있습니다\n - 우리 영토에 대한 습격 알림은 계속 받게 됩니다§!"
 raid_type_counter_terror_hvt_raid: "디테러 고가치 표적 습격"
 raid_type_counter_terror_hvt_raid_desc: "표적이 된 테러 조직의 구성원을 사살하거나 체포하기 위한 습격을 수행합니다."
 raid_type_counter_terror_cache_raid: "디테러 무기 은닉처 습격"
 raid_type_counter_terror_cache_raid_desc: "테러 조직의 무기 은닉처를 파괴하기 위한 습격을 수행합니다."
 raid_type_counter_terror_training_camp_raid: "디테러 훈련 캠프 습격"
 raid_type_counter_terror_training_camp_raid_desc: "테러 조직의 훈련 시설을 파괴하기 위한 습격을 수행합니다."
 raid_type_counter_terror_elimination_raid: "디테러 제거 습격"
 raid_type_counter_terror_elimination_raid_desc: "테러 조직의 본거지를 제거하기 위한 습격을 수행합니다."
 raid_type_counter_terror_drone_operations: "디테러 드론 작전"
 raid_type_counter_terror_drone_operations_desc: "드론을 이용해 테러 조직에 대한 정찰 및 타격 임무를 모두 수행합니다."
 raid_type_drone_airfield_radar_strike: "드론 비행장 및 레이더 기지 타격"
 raid_type_drone_airfield_radar_strike_desc: "적의 §Y비행장§!과 §Y레이더 기지§!에 자폭 드론 타격을 가해 대공 방어 기반시설을 약화시키고 항공 작전을 저해합니다."
 raid_type_drone_power_grid_strike: "드론 전력망 타격"
 raid_type_drone_power_grid_strike_desc: "적의 §Y발전소§!와 §Y에너지 기반시설§!에 자폭 드론을 대거 투입하여 전력 공급을 교란하고 산업 생산에 부담을 줍니다."
 raid_type_drone_rocket_site_strike: "드론 로켓 기지 타격"
 raid_type_drone_rocket_site_strike_desc: "적의 §Y미사일 발사 기지§!에 표적 드론 타격을 지시하여 로켓 기반시설을 손상시키고 적의 탄도 및 순항 미사일 능력을 제압합니다."
 raid_category_EH_portal_raids: "키메라 차원문 습격"
 raid_type_naval_headquarters_strike: "해군 사령부 타격"
 raid_type_naval_headquarters_strike_desc: "적 해군 사령부에 순항 미사일 타격을 가해 시설을 파괴하고 적의 해군 지휘 능력을 저하시킵니다."
 raid_type_enrichment_facility_strike: "농축 시설 타격"
 raid_type_enrichment_facility_strike_desc: "우라늄 농축 시설을 타격하여 목표의 핵연료 및 핵물질 생산 능력을 무력화합니다."
 MD_nuclear_energy.1.b: "원자력 에너지에 대한 우리의 입장을 전환한다"
 tooltip_raid_category_infastructure_strikes: "§H기반시설 타격§! \n단일 항공 비행단이 특정 목표를 타격하는 공습입니다."
 tooltip_raid_category_military_resource_raids: "§H군사 타격§! \n군사 목표를 겨냥한 탄도 미사일 또는 순항 미사일 타격입니다."
 tooltip_raid_category_special_forces_raids: "§H특수 작전 습격§! \n특수부대가 적진 후방에서 수행하는 소규모 습격입니다."
 tooltip_raid_category_naval_raids: "§H해군 습격§! \n해군 기지, 사령부 또는 방어 시설을 겨냥한 습격입니다."
 tooltip_raid_category_drone_strike_raids: "§H드론 타격§! \nUCAV가 수행하는 습격입니다."
 raid_type_free_captured_operative_mission: "포로 요원 구출 임무"
 raid_type_free_captured_operative_mission_desc: "적에게 붙잡힌 아군 첩보원을 구출하는 것만을 목적으로 하는 습격을 수행합니다."
 plane_raid_losses_ratio_tt: "고정익 항공기를 사용한 경우, 습격 부대가 항공기의 약 §R[?raid_plane_loss_ratio|%0]§!를 잃었습니다."
