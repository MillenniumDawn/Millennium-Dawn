 DPR_donbass_jail: "거물 부패 관리 처리"
 DPR_donbass_jail_desc: "우리는 마침내 지역에서 가장 큰 부패 관리들을 잡아넣을 준비가 되었으며, 이제 그들과 끝장을 볼 때입니다."
 DPR_donbass_terobor: "돈바스 영토방위대"
