 world_revolution_commune: "Всемирная революционная коммуна"
 FRA_PS: "Социалистическая партия"
 FRA_PS_desc: "Возрожденная на Эпинеском конгрессе под руководством Франсуа Миттерана, Социалистическая партия обогнала коммунистов и стала доминирующей силой французских левых, с тех пор попеременно находясь у власти с республиканскими правыми. Наша база широка и охватывает большинство социальных слоев, и наше возвращение в Елисейский дворец — лишь вопрос времени."
 FRA_UDF_LREM: "Центристский союз"
 FRA_UDF_LREM_desc: "Союз за французскую демократию, созданный в 1978 году для поддержки Валери Жискара д'Эстена, представляет собой конфедерацию либералов, христианских демократов и радикалов, а не единую партию. Двадцать лет занимая положение младшего партнера, мы намерены построить центр, способный управлять страной самостоятельно."
 FRA_LR: "Республиканское правое крыло"
 FRA_LR_desc: "Правые голлисты существуют со времен Пятой республики и занимают пост президента с 1995 года, но неудачный роспуск партии дорого нам обошелся и привел к власти в Матиньоне социалиста. Мы должны укрепить позиции правоцентристов, прежде чем наши соперники с обоих флангов нас догонят."
 FRA_RPF: "Митинг за Францию"
 FRA_RPF_desc: "Шарль Паскуа и Филипп де Вилье основали «Объединение за Францию» в 1999 году для голлистов, которые считали, что правые силы слишком уступчивы по отношению к Брюсселю. Сегодня наше влияние невелико, но каждая уступка Европейскому союзу привлекает к нам новых сторонников."
 FRA_FN: "Национальный фронт"
 FRA_FN_desc: "Национальный фронт, основанный в 1972 году Жан-Мари Ле Пеном, на протяжении трех десятилетий находился вне рамок респектабельной политики, в то время как все остальные партии сплотились против него. Санитарный кордон начинает распадаться, и мы намерены быть готовыми, когда он прорвется."
 FRA_LFI: "Непоколебимая Франция"
 FRA_LFI_desc: "Социалистическая партия измучила себя, угощая центристов и умирая между двумя своими течениями. «Непокорная Франция» — единственная подлинная левая оппозиция неолиберальному порядку, и мы не будем идти с ней на компромисс."
 FRA_EELV: "Зелёные"
 FRA_EELV_desc: "Экологическое движение участвует во французских выборах с 1984 года, но его никогда не воспринимали всерьез, и наша база поддержки едва выходит за пределы городов. Время — единственный ресурс, за который мы не можем бороться в ходе предвыборной кампании, поэтому мы должны переманить на свою сторону другие партии или заменить их."
 FRA_PCF: "Французская коммунистическая партия"
 FRA_PCF_desc: "Французская коммунистическая партия пала вместе с Советским Союзом, к которому она была привязана, и наша рабочая база смещается в сторону крайне правых или к воздержанию от участия в выборах. Преодоление этого спада — вот главная задача, стоящая перед нами."
 FRA_friend_eu: "Подружитесь с ЕС"
 FRA_friend_eu_desc: "В Европейском союзе много стран, возглавляемых партиями, схожими с нашей. Мы должны использовать это идеологическое сближение, чтобы подчеркнуть нашу проевропейскую позицию как оплот против национализма."
 FRA_eternal_challenge: "Вечный Претендент"
 FRA_eternal_challenge_desc: "На протяжении десятилетий мы были единственной партией, которая боролась за права рабочих как на улицах, так и в парламенте. Наши враги очевидны: правое крыло и экстремисты. Люди знают, что могут доверять нам и что мы им противостоим. Наши враги никогда не спят, и мы должны помнить об этом. Объединившись, мы можем отпугнуть любую угрозу."
 FRA_eu_federalism: "Федерализм ЕС"
 FRA_eu_federalism_desc: "Другие страны должны помнить о ценностях, которые мы отстаиваем как Европейский Союз: защищать их, развивать их и распространять среди других стран Европы."
 FRA_let_industry: "Пусть отрасль идёт своим чередом"
 FRA_let_industry_desc: "Тяжелая промышленность — это пустая трата времени и энергии; в условиях глобализированной экономики, подобной нашей, она уже недостаточно продуктивна. Мы не должны препятствовать ее перемещению в новые промышленные центры мира. Вместо этого нам следует обратить внимание на новую форму экономики: сектор услуг. Офисы станут нашим главным приоритетом в ближайшие годы. Отдавая им приоритет, мы сможем снизить безработицу и увеличить доходы, которые они приносят."
 FRA_finance_minister: "Новая экономическая политика"
 FRA_finance_minister_desc: "В мире, переживающем трансформацию, мы тоже должны развиваться и менять свою экономическую направленность. Экономические кризисы выявили ограничения кейнсианской экономики, поэтому мы должны изменить свой образ мышления. Следовательно, мы должны выбрать нашу следующую экономическую программу для финансового сектора. Это позволит нам сократить расходы, но вопрос лишь в том, кому мы можем доверять."
 FRA_atlantist_drift: "Атлантический дрейф"
 FRA_atlantist_drift_desc: "НАТО — самый сильный альянс из существующих в настоящее время. Если мы хотим сохранить его таким, мы должны улучшить подготовку наших вооруженных сил."
 FRA_greece_eurozone: "Греция в еврозоне"
 FRA_greece_eurozone_desc: "Греция известна своими долговыми проблемами. Мы можем помочь им финансовой помощью, чтобы показать, что страны Европейского союза действительно заботятся друг о друге."
 FRA_tax_evasion: "Борьба с уклонением от уплаты налогов"
 FRA_tax_evasion_desc: "Слишком много людей продолжают уклоняться от уплаты налогов, используя различные схемы; мы должны положить этому конец, потому что мы взяли на себя это обязательство."
 FRA_liberal_turn: "Либеральный поворот"
 FRA_liberal_turn_desc: "Слишком долго мы пытались контролировать экономику и финансовый сектор, но в глобализованном мире контролировать потоки капитала становится все сложнее. Поэтому мы должны позволить рынку регулировать себя самостоятельно. Что может пойти не так?"
 FRA_ease_interventionism: "Легкое вмешательство"
 FRA_ease_interventionism_desc: "Нам следует сосредоточиться на улучшении дипломатических отношений в Европе, а не отправлять наших людей воевать на чужие войны. В настоящее время Европа — это континент мира, и как крупная региональная держава мы должны подавать хороший пример всем."
 FRA_modern_interest: "Современный интерес"
 FRA_modern_interest_desc: "Слишком долго мы тратили время на защиту непродуктивного класса, который постоянно находится в кризисе. Пришло время заглянуть в будущее, а будущее — в сфере услуг и технологий."
 FRA_cut_with_unions: "Сокращения с профсоюзами"
 FRA_cut_with_unions_desc: "Профсоюзы уже не так полезны для нашей страны, как раньше. Мы больше не должны уступать их требованиям; в конце концов, мы не их заложники."
 FRA_vigipirate: "Усиление безопасности"
 FRA_vigipirate_desc: "Миссия Vigipirate станет нашей национальной системой оповещения о террористических угрозах и обеспечении безопасности. Предполагается, что это будет постоянный механизм, объединяющий правительство, вооруженные силы, местные власти и граждан, призванный предвидеть, предотвращать и защищать нашу страну от террористических угроз."
 FRA_not_done: "Мы ещё не закончили."
 FRA_not_done_desc: "21 апреля стало беспрецедентным унижением. Наш кандидат выбыл в первом туре, и Республике пришлось выбирать между правыми и крайне правыми. Однако воинствующие радикалы не разошлись, фракции продолжают встречаться, а избирателям, склонившимся к крайне левым взглядам, некуда больше деваться. Мы восстанавливаемся, начиная с самых низов, и миримся с профсоюзами, от которых отдалились."
 FRA_meet_friends: "Встреча с друзьями"
 FRA_meet_friends_desc: "Сейчас самое подходящее время для организации встречи с другими социалистическими странами, чтобы обсудить текущую ситуацию в мире и путь к социализму."
 FRA_turn_ecology: "Обратитесь к экологии"
 FRA_turn_ecology_desc: "«Зелёные» не уступят нам место на следующих парламентских выборах без цены, и эта цена написана на реакторах. Двадцать четыре, сначала Фессенхайм, и половина нашего энергетического баланса будет сдана к концу десятилетия. Энергетические федерации CGT уже ясно выразили свою позицию. Мы должны решить, стоит ли этот альянс того флота."
 FRA_military_coop: "Военное сотрудничество"
 FRA_military_coop_desc: "Опираясь на тесное сотрудничество с НАТО, мы должны пригласить другие страны к проведению совместных военных учений. Это принесет пользу всем, и покажет нашим врагам, насколько мы едины и готовы к действиям."
 FRA_party_unity: "Партийное единство"
 FRA_party_unity_desc: "Каждый конгресс заканчивается одинаково. Стороны спорят три дня, никто не побеждает, и за ночь составляется итоговое предложение, чтобы все могли объявить о своей победе. Реймсский конгресс чуть не сломил нас из-за сорока двух голосований. Единство возможно, но оно покупается министерствами и секретариатами, и расплата всегда производится за счет патронажа."
 FRA_strenght_throught_EU: "Укрепление через ЕС"
 FRA_strenght_throught_EU_desc: "ЕС отстаивает демократические ценности, и мы тоже. Этого должно быть достаточно, чтобы сохранить эту организацию живой, сильной и стабильной. Если ЕС распадется, Европа может снова оказаться разделенной."
 FRA_stole_voter: "Восстановить связь с нашим электоратом"
 FRA_stole_voter_desc: "Бассейн Минье и река Миди были нашими на протяжении столетия, а теперь это самая безопасная территория для крайне правых. Поучения этим избирателям не сработали. Если мы хотим вернуть их, мы должны подойти к ним с чем-то в руках: вновь зажженными печами, открытыми промышленными площадками, публично данным обещанием. Дать обещание, а затем сдержать его, потому что невыполненное обещание обойдется нам в потерю региона на целое поколение."
 FRA_ps_lgbt: "Обеспечение прав ЛГБТ"
 FRA_ps_lgbt_desc: "Пакт гражданской солидарности всегда был лишь половинчатой ​​мерой. Брак, усыновление, полное равенство супругов перед законом: это реформа, которую ожидают наши избиратели, и та, за которую правые обещали бороться на улицах. Организация «La Manif pour Tous» уже бронирует места на Марсовом поле. Мы можем принять закон целиком или можем его сократить и сохранить мир."
 FRA_ps_win: "Социализм спасен"
 FRA_ps_win_desc: "Мы сделали это! Мы совершили невозможное. Чудом избежав краха и унизительного поражения от французов и в глазах истории, нам удалось переломить ситуацию. Наши противники думали, что нам конец, но нам удалось вернуть себе электорат и отвлечь его от соблазнительных призывов экстремизма. Наша победа – знак стабильности социализма во всем мире. Но наша победа – это только начало; вооружившись этим опытом, мы не повторим тех же ошибок во второй раз."
 FRA_Neither_right_nor_left: "Ни правая, ни левая"
 FRA_Neither_right_nor_left_desc: "Лучший способ развития нашей страны — избегать политики, сеющей рознь. Давайте займем центристскую позицию, не слишком правую и не слишком левую."
 FRA_Get_indecisives: "Нерешительные люди"
 FRA_Get_indecisives_desc: "Ни правые, ни левые. В этой стране есть избиратели, которые никогда не находили партию, ради которой стоило бы идти на избирательный участок, и есть тысячи добровольцев, готовых постучать в их двери и спросить, чего они хотят. «Великий марш» соберет их сразу из обеих старых партий. Чего он нам не принесет, так это единой местной федерации."
 FRA_abolish_ISF: "Отменить ISF"
 FRA_abolish_ISF_desc: "Налог солидарности на богатство приносит мало денег и много — в изгнание. В течение тридцати лет капитал уезжал в Брюссель и Женеву, и доходы никогда не оправдывали этот бег. Мы заменим его налогом только на имущество. Деньги вернутся домой. Вернутся и обвинения, которые будут звучать в каждом заголовке до следующих выборов, в том, что мы управляем страной в интересах богатых."
 FRA_Fight_Deficit: "Борьба с дефицитом"
 FRA_Fight_Deficit_desc: "Наш долг велик. Мы должны бороться с ним любой ценой, если не хотим утонуть в долгах, которые не сможем погасить. Люди обязательно поймут необходимость этих мер."
 FRA_Reconize_Mistakes: "Распознавайте ошибки"
 FRA_Reconize_Mistakes_desc: "Предыдущие французские лидеры обращались с колониальными государствами крайне несправедливо. Мы должны наконец исправить ситуацию, понеся наказание за их действия. Пусть эта глава нашей истории наконец завершится."
 FRA_Western_policy: "Западная политика"
 FRA_Western_policy_desc: "Европейский союз и Атлантический альянс — вот что обеспечивает безопасность этого континента, и мы ничего не выиграем, делая вид, что это не так. Более тесная интеграция с нашими союзниками дает нам влияние в Брюсселе и добрую волю в Вашингтоне. Это также дает суверенистам, голлистам и националистам, единственный аргумент, который им когда-либо был нужен: что Республика стала вассалом."
 FRA_independant_Euro: "Независимая Европа"
 FRA_independant_Euro_desc: "Другие страны должны понимать, что в рамках единой Европы мы не стремимся к чрезмерному влиянию на их стабильность. Поодиночке некоторые из нас могут быть уязвимы, но вместе мы должны быть достаточно сильны, чтобы преодолеть эти проблемы."
 FRA_reduce_tax: "Снижение налогов"
 FRA_reduce_tax_desc: "Налог на жилье сильнее всего бьет по тем домохозяйствам, которые меньше всего могут его выдержать, а налоговая льгота для занятости уже показала, как она влияет на занятость. Мы полностью отменим этот налог. Коммуны потеряют свою доходную базу, поэтому государство должно будет компенсировать им убытки из Парижа, и каждый мэр во Франции напишет нам об этом."
 FRA_increase_pension_age: "Повышение пенсионного возраста"
 FRA_increase_pension_age_desc: "Возможно, это кому-то не нравится, но поскольку продолжительность жизни увеличивается благодаря новым открытиям в медицине, мы должны продолжать финансировать нашу систему социального обеспечения. Однако, учитывая, что всё меньше молодых людей могут финансировать пенсии всё большего числа пожилых людей, у нас нет выбора. Мы должны заставить работающее население работать дольше, чтобы компенсировать это отсутствие обновления поколений."
 FRA_growing_tensions: "Нарастающая напряженность"
 FRA_growing_tensions_desc: "Наш мир становится все менее безопасным, и мы можем стать свидетелями возвращения войны в Европу. Чтобы не оказаться застигнутыми врасплох, мы должны к этому подготовиться."
 FRA_befriend_china: "Подружитесь с Китаем"
 FRA_befriend_china_desc: "Китай является крупным торговым партнером Франции; заключение выгодных договоров с ним отвечает нашим интересам."
 FRA_nuclear_eu: "Дать ядерное оружие ЕС"
 FRA_nuclear_eu_desc: "Пятьдесят шесть реакторов, и никто в Брюсселе не хочет называть их экологичными. Классификация разрабатывается прямо сейчас, и если ядерная энергетика будет исключена из неё, весь наш флот станет обузой на бумаге. Берлин и Вена будут бороться с нами. Прага, Варшава и Хельсинки — нет. Мы создаём альянс, мы выигрываем голосование, и мы понимаем, что Германия это запомнит."
 FRA_reise_tertiary: "Возникновение третичного сектора"
 FRA_reise_tertiary_desc: "Современная западная экономика — это экономика, основанная на сфере услуг, которая объединяет различных участников производственного процесса. Франция должна сыграть свою роль в этом экономическом переходе; другого пути нет."
 FRA_reduce_public_service: "Сокращение государственных услуг"
 FRA_reduce_public_service_desc: "Сократив государственные расходы, мы сможем снова уменьшить наш долг. Людям это не понравится, но мы должны выбрать меньшее зло. Если страна рухнет из-за долга, сокращение социальных расходов будет наименьшей из ее проблем."
 FRA_strat_indus: "Финансирование наших стратегических отраслей"
 FRA_strat_indus_desc: "Хотя наши отрасли промышленности уже не так конкурентоспособны, как раньше, есть определенные отрасли, без которых мы не можем обойтись. Оборонная промышленность — одна из них, поскольку мы не можем полагаться на другие страны в вопросах обороны. Франция всегда производила собственное оружие. Поэтому крайне важно, чтобы так было и впредь, особенно в мире, где растет напряженность."
 FRA_arms_deal: "Увеличить экспорт вооружений"
 FRA_arms_deal_desc: "Общеизвестно, что наш военно-промышленный комплекс производит превосходное оружие. Поэтому мы на протяжении многих лет являемся одним из ведущих экспортеров вооружений. Торговля оружием позволяет нам не только проецировать свою мощь на международной арене, но и получать значительные финансовые средства и влияние. Следовательно, это может быть только к лучшему."
 FRA_eu_mil: "Содействовать наращиванию военной мощи ЕС"
 FRA_eu_mil_desc: "Хотя наша страна относительно хорошо подготовлена ​​к возвращению войны в Европу, этого нельзя сказать обо всех наших европейских партнерах. У большинства из них нет шансов оказать сопротивление. Мы должны помочь им развить свои возможности, поскольку их безопасность — это и наша собственная."
 FRA_finance_student: "Финансы - Лучший студент"
 FRA_finance_student_desc: "Благодаря идеальному применению неолиберальной формулы, наша экономика как никогда тесно интегрирована в международную динамику. Это хорошо, поскольку позволит нам извлекать выгоду из прогресса других стран и инвестировать по всему миру, чтобы пожинать плоды."
 FRA_right_left_money: "Самый центр"
 FRA_right_left_money_desc: "Слишком долго наша страна находилась в заложниках у лево-правого раскола. Несмотря на все наши успехи в финансах и геополитике, мы продемонстрировали силу ордолиберализма. Наша роль заключается в том, чтобы дать рынку процветать во Франции и позволить французскому народу извлекать выгоду из богатства, которое он создает."
 FRA_demograph_arms: "Содействие демографическому перевооружению"
 FRA_demograph_arms_desc: "Эффективная кампания по увеличению численности населения — это долгосрочная инвестиция в будущее нашей страны."
 FRA_share_eu: "Поделитесь нашей силой с ЕС"
 FRA_share_eu_desc: "Наши враги должны знать, что мы очень серьезно относимся к защите независимости государств-членов Европейского союза. В случае необходимости мы будем угрожать любому угнетателю нашим ядерным арсеналом."
 FRA_handle: "Урегулируйте ситуацию"
 FRA_handle_desc: "Они пришли из-за налога на топливо, а остались из-за всего остального. Круговые развязки заняты, Елисейские поля горели дважды, а эти шумные акции в равной степени лишили нас внимания и внимания СМИ. Мы можем принять закон о борьбе с беспорядками и разогнать их силой, или же мы можем начать общенациональную дискуссию и купить мир десятью миллиардами евро, которых у нас нет."
 FRA_startup_nation: "Страна стартапов"
 FRA_startup_nation_desc: "Благодаря нашей смелой политике и отказу отступать перед лицом этих непокорных галлов, мы достигли своей цели. Мы преобразовали общество, некогда враждебное к предпринимательству, освободив его от налогов и регулирования, которые сдерживали его развитие. Впереди нас ждет светлое будущее инноваций и либерализма. Таково наше видение."
 FRA_Neo_gaulism: "Неоголлизм"
 FRA_Neo_gaulism_desc: "Неоголлиз — это французское политическое движение, адаптировавшее первоначальные принципы генерала Шарля де Голля. Он делал акцент на национальном суверенитете, сильной президентской власти и независимости внешней политики в соответствии с современной глобализированной эпохой."
 FRA_known: "Неизбежная вечеринка"
 FRA_known_desc: "С момента основания Третьей Республики и появления стабильной формы республиканизма консерваторы существовали всегда. Мы — лишь их последнее воплощение. На протяжении десятилетий мы присутствовали на каждых вторых выборах. Нет причин полагать, что следующие выборы должны отличаться. Наше новое тысячелетие полно неопределенностей, поэтому мы должны быть голосом стабильности и здравого смысла перед лицом экстремистов."
 FRA_oppose_immigration: "Выступаем против иммиграции"
 FRA_oppose_immigration_desc: "Иммигранты уже доказали свою опасность, особенно те, кто прибывает из регионов, охваченных непрекращающимися войнами. Мы должны принять меры, чтобы предотвратить их прибытие."
 FRA_continue_liberal: "Продолжить либеральную политику"
 FRA_continue_liberal_desc: "Мы продолжим реализацию нашей программы экономической либерализации, потому что именно так экономика работает наилучшим образом."
 FRA_patriotism: "Патриотизм"
 FRA_patriotism_desc: "Французы должны гордиться своей национальностью и связанной с ней историей. В результате им необходимо привыкнуть к тому, что они меньше требуют от государства. Мы больше не можем позволить себе щедрость прошлого. Они должны научиться вставать на сторону государства и перестать постоянно требовать больше государственных денег."
 FRA_turn_west: "Поверните на запад"
 FRA_turn_west_desc: "Нам следует улучшить отношения с нашими зарубежными друзьями в Америке. Их политики могут измениться, но мы должны гарантировать, что никто из них никогда не отвернется от Франции."
 FRA_third_voice: "Третий голос Франции"
 FRA_third_voice_desc: "В мире, по-прежнему разделённом между НАТО и остатками СССР, Франция должна, как и всегда, прокладывать свой собственный путь. Мы не можем полагаться на далёкого союзника, который не придёт нам на помощь; поэтому мы должны сами строить свою судьбу вместе с теми, кто отвергает угнетение как с Востока, так и с Запада."
 FRA_austerity: "Примените политику жесткой экономии"
 FRA_austerity_desc: "Дефицит носит структурный характер, и рейтинговые агентства уже настороженно к нему присматриваются. Мы сокращаем расходы там, где это возможно: на каждые два вышедших на пенсию государственных служащих приходится один замененный, министерства объединены, строительство отложено. Профсоюзы назовут вещи своими именами и выведут на улицы миллион человек старше пенсионного возраста, а левые будут десять лет бороться против этого единственного решения."
 FRA_question_ref: "Ускорение европейской интеграции"
 FRA_question_ref_desc: "Хотя Франция является одним из основополагающих столпов Европейского союза, её народ сейчас относится к нему с наибольшим скептицизмом. Французы неоднократно выступали против принятия новых договоров. Нам следует перестать спрашивать их мнение по каждому вопросу, поскольку это значительно замедляет процесс европейской интеграции. Многие воспримут это негативно и станут ещё более враждебно настроены к Европейскому союзу, но, по крайней мере, мы перестанем быть теми, кто тормозит развитие Европейского союза."
 FRA_nato_integration: "Интеграция НАТО"
 FRA_nato_integration_desc: "Ещё один шаг к повышению нашей безопасности на этом континенте. Кто знает, в каком состоянии находилась бы сегодня Европа без НАТО."
 FRA_national_indep: "Национальная независимость"
 FRA_national_indep_desc: "Заняв позицию, находящуюся где-то между Востоком и Западом, Франция может защищать собственные интересы и больше не должна учитывать мнение бюрократа из Вашингтона."
 FRA_end_proximity_police: "Полиция, контролирующая близость"
 FRA_end_proximity_police_desc: "Полиция не должна быть связана с теми людьми, за которыми она должна следить. Создание подразделения полиции быстрого реагирования было бы более экономически эффективным."
 FRA_reform_wealth: "Реформировать государство всеобщего благосостояния"
 FRA_reform_wealth_desc: "Слишком долго Франция была государством всеобщего благосостояния; пришло время французам самим обеспечивать себя, не полагаясь постоянно на государственные деньги."
 FRA_looming_crisis: "Надвигающийся кризис"
 FRA_looming_crisis_desc: "В январе Société Générale обнаружила, что один трейдер потерял почти пять миллиардов евро, и никто этого не заметил. Это было предупреждением. Американский ипотечный рынок находится в худшем положении, наши банки подвержены его влиянию, а Dexia уже испытывает трудности. Мы можем сейчас создать надзорный аппарат и замедлить собственную экономику, или же мы можем довериться циклу и надеяться на лучшее."
 FRA_defend_interest: "Защита интересов Франции"
 FRA_defend_interest_desc: "Независимость означает, что мы должны защищать себя от иностранного влияния как в нашей стране, так и везде, где у нас есть интересы. Мы должны предпринять шаги в этом направлении, чтобы Франция оставалась великой державой."
 FRA_lower_expanse: "Прекратите финансирование неэффективных предприятий."
 FRA_lower_expanse_desc: "Субсидирование экономической деятельности обходится все дороже. Нам следует внимательно пересмотреть наши расходы и субсидировать только эффективные и конкурентоспособные отрасли."
 FRA_oppose_lgbt: "Действуйте против вокизма"
 FRA_oppose_lgbt_desc: "В наше общество проникают все более враждебные по отношению к традиционным нормам тенденции мышления. Эти нормы существуют не просто так и всегда преобладали. Мы должны предотвратить это проникновение."
 FRA_return_rurality: "Примите сельскую жизнь"
 FRA_return_rurality_desc: "Крупные города все чаще превращаются в рассадники упадка и преступности. Мы должны побуждать наших граждан уезжать из них и переезжать в регионы, которые, хотя и менее процветающие, ближе к здравому смыслу."
 FRA_end_assisted: "Покончим с культурой зависимости"
 FRA_end_assisted_desc: "Слишком большая часть нашего населения зависит от безусловных пособий, которые им предоставляются без какой-либо работы. Такая ситуация неприемлема и создает нагрузку на наши финансы. Мы должны положить конец этим пособиям; это позволит людям устроиться на работу."
 FRA_hostile_bear: "Враждебность к медведю"
 FRA_hostile_bear_desc: "Россия вновь становится угрозой европейским интересам и безопасности. Страны первой линии обороны должны начать подготовку к самообороне в случае любых враждебных действий с востока."
 FRA_wake_up: "Разбудите Францию"
 FRA_wake_up_desc: "Освободившись от упадка и соблазнов бездействия, французский народ может вернуться к работе."
 FRA_eternal_france: "Вечная Франция"
 FRA_eternal_france_desc: "Мы сделали нашу страну сильнее, чем когда-либо прежде. Мы усилили собственную защиту от внешних угроз, сократили внутренние проблемы и уменьшили долговую нагрузку. Мы обеспечили будущее нашей стране. Франция всегда была и всегда будет рядом."
 FRA_enought_soc: "Хватит социализма!"
 FRA_enought_soc_desc: "Как консервативная партия, мы противостоим Прогрессистам и Социалистической партии. Они выступают за либеральную Европу, именно то, чего люди больше не хотят, и мы будем работать над тем, чтобы освободиться от неё. Мы должны показать людям, что мы являемся и всегда будем инструментом, посредством которого реализуется их стремление к стабильности и защите. Мы против либерального Европейского союза и прогрессивизма."
 FRA_sovereignism: "Поставьте под сомнение наш суверенитет"
 FRA_sovereignism_desc: "Слишком долго французский народ игнорировался; никто в нашей стране не хотел, чтобы Европейский союз разросся до таких масштабов. Будь то договоры или расширение, народ всегда был настроен скептически, и каждый раз его игнорировали. Пришло время какой-нибудь партии вновь поднять вопрос о суверенитете Франции."
 FRA_sacrifice: "Необходимая жертва"
 FRA_sacrifice_desc: "Мы вступаем в трудные времена, и предстоящий сложный путь потребует дисциплины и доброй воли со стороны французского народа. Французы должны еще раз понять, что именно от них зависит, будут ли они приносить жертвы ради Франции, а не наоборот."
 FRA_elder_view: "Взгляд наших старейшин"
 FRA_elder_view_desc: "Национальный совет сопротивления проделал колоссальную работу по восстановлению нашей страны из руин Второй мировой войны, и тем самым стал вассалом Соединенных Штатов. Но на протяжении десятилетий их работа постепенно подрывается политиками, каждый из которых становится всё более либеральным. Мы должны вернуться к своим корням, последовать примеру генерала, инвестировать в нашу промышленность и приступить к восстановлению нашей страны, которая была опустошена десятилетиями европейской интеграции и деиндустриализации."
 FRA_neccesity_leaving: "Необходимость уйти"
 FRA_neccesity_leaving_desc: "Наш путь к выходу из Европейского союза только начался. Мы должны дать людям понять, что мы должны покинуть эту Европу, пока не стало слишком поздно."
 FRA_fight_renouncement: "Боритесь со сторонниками отказа от веры!"
 FRA_fight_renouncement_desc: "Генерал не верил, что у других европейских держав хватит воли создать Европу, независимую от Соединенных Штатов. Он был прав: спустя несколько десятилетий после его смерти наши партнеры больше озабочены преклонением перед Соединенными Штатами и закупкой у них оборудования, чем работой над независимостью Европы. Мы должны осудить эту нисходящую спираль, которая уже является для нас поводом покинуть эту Европу, ставшую вассалом Соединенных Штатов."
 FRA_back_gaulism: "Стратегический голлизм"
 FRA_back_gaulism_desc: "Франция должна проводить внешнюю политику, независимую от воли Вашингтона. Мы не должны позволять никому вмешиваться в нашу политику, и уж тем более Соединенным Штатам, которые всегда стремились заставить нас подчиниться."
 FRA_social_gaulism: "Социал-галлизм"
 FRA_social_gaulism_desc: "Столкнувшись с закатом «счастливой глобализации» и соблазном экстремизма, мы должны вернуть французский народ на путь разума. Социал-голлизм отвергает как капитализм, так и коммунизм. Он предполагает государственное вмешательство для гарантирования независимости и безопасности занятости. При такой стабильности людям не нужна вся эта социальная поддержка."
 FRA_return_nation: "Возвращение в нацию"
 FRA_return_nation_desc: "Мы должны любыми необходимыми средствами побудить французские компании, работающие за рубежом, вернуться в страну своего происхождения."
 FRA_anti_eu: "Кампания против ЕС"
 FRA_anti_eu_desc: "Теперь, когда люди начинают понимать, что Европейский союз больше не служит интересам своих основателей, чью идентичность он стремится подорвать, мы можем активизировать нашу кампанию против Европейского союза. Мы должны заставить людей понять, что большинство их проблем проистекает именно оттуда."
 FRA_anti_usa: "Враждебность по отношению к США"
 FRA_anti_usa_desc: "Соединенные Штаты с неодобрением относятся к возвращению голлизма к власти. Их опасения вполне обоснованы; наш приход к власти быстро покажет им, что мы больше не их союзники. В конце концов, хорошо известно, что у Соединенных Штатов нет союзников; прежде всего, у них есть интересы."
 FRA_RPF_death: "Восстановить смертную казнь"
 FRA_RPF_death_desc: "Смертная казнь была отменена несколько десятилетий назад, вопреки желанию большинства французской общественности. С тех пор преступники всех мастей стали действовать смелее, будучи уверенными, что государство никогда по-настоящему их не накажет. Суверенное государство должно иметь возможность в полной мере обеспечивать соблюдение своих собственных законов. Мы это восстановим."
 FRA_destroy_liberalism: "Уничтожить экономический либерализм"
 FRA_destroy_liberalism_desc: "Слишком долго наша экономическая политика находилась под влиянием отвратительного ультралиберализма. Наши граждане наблюдали, как одна за другой исчезали их рабочие места и наша промышленная мощь. Еще в свое время генерал предупреждал, что капитализм, с человеческой точки зрения, — это плохо. Мы должны вернуться к государственному вмешательству. Мы должны восстановить порядок в наших государственных финансах и в том, что осталось от нашей экономики."
 FRA_campaign_frexit: "Кампания за Фрексит"
 FRA_campaign_frexit_desc: "Французы наконец-то поняли, что Европейский союз — это плохо; осталось лишь дать им возможность выплеснуть свой гнев. Для того чтобы положить конец распаду Франции, достаточно лишь бюллетеня на выборах."
 FRA_rebalance_foreign_policy: "Перебалансировка нашей внешней политики"
 FRA_rebalance_foreign_policy_desc: "Хотя мы ясно заявили о своем намерении отделиться от Соединенных Штатов, наш политический класс по-прежнему находится под влиянием их политики, образа жизни и корпораций. Мы должны дать четкий сигнал тем, кто может считать, что наш разрыв с Соединенными Штатами не является подлинным. Мы восстановим диалог с державами, которые всегда противостояли гегемонии США."
 FRA_leave_nato: "Разорвите отношения с НАТО"
 FRA_leave_nato_desc: "Чтобы сохранить нашу независимость, мы должны избавиться от союза, в котором мы никогда не нуждались и который принес нам очень мало пользы. Мы способны защищать свои интересы самостоятельно."
 FRA_frexit_ref: "Референдум о выходе Великобритании из ЕС"
 FRA_frexit_ref_desc: "Пришло время окончательно выйти из Европейского союза. Наш народ был достаточно подготовлен к тому, чтобы навсегда отвергнуть Европейский союз."
 FRA_strategic_autonomy: "Обеспечить стратегическую автономию"
 FRA_strategic_autonomy_desc: "Нам удалось восстановить независимость Франции; теперь мы свободны делать в этом мире все, что нам угодно. Франция сильна и свободна, и мы готовы ее защищать."
 FRA_strong_people: "Сильные люди"
 FRA_strong_people_desc: "Больше никаких поощрений за безделье; капитализм под государственным контролем. Мы обновили общественный договор с нашим народом. Они знают, что мы их защищаем и что они обязаны нам послушанием и доброй волей."
 FRA_recover: "Восстановить экономику"
 FRA_recover_desc: "Несмотря на все наши усилия по подготовке к выходу из Европейского союза, наша экономика все равно пострадала. Мы должны восстановить ее на прочном фундаменте, прежде чем даже думать о мести нашим угнетателям."
 FRA_our_own_sphere: "Наша собственная сфера"
 FRA_our_own_sphere_desc: "Мы не единственные, кому удалось избавиться от американского империализма. Мы можем найти союзников для создания альянса, основанного на взаимном уважении между независимыми державами."
 FRA_paid_reconnexion: "Блокада Европы"
 FRA_paid_reconnexion_desc: "Теперь, когда мы благополучно и успешно покинули Европейский союз, мы можем начать думать о том, как отомстить ему. Европейский союз и его сети должны пройти через нашу страну. Это предоставляет нам огромную возможность отомстить."
 FRA_certain_idea: "Определенное представление о Франции"
 FRA_certain_idea_desc: "Всего за несколько лет нам удалось вернуть Франции ее былое величие: статус гордой и свободной великой державы. Генерал гордился бы тем, что мы восстановили его наследие. Он был прав: Франция может быть только великой державой; иначе это была бы не Франция."
 FRA_salvage_mondialisation: "Спасти жертв глобализации"
 FRA_salvage_mondialisation_desc: "Наши люди сильно пострадали в результате глобализации. Это особенно касается трудящегося населения, которое потеряло работу, столкнулось с распадом страны и попрасанными ценностями. Мы должны показать им, что именно мы добьемся перемен, что мы осмелимся задавать правильные вопросы и что у нас есть очень простое решение этих проблем."
 FRA_raise_tariff: "Повышение тарифа"
 FRA_raise_tariff_desc: "Повышение наших тарифов позволит нам положить конец недобросовестной конкуренции со стороны зарубежных производителей и даст французским гражданам возможность покупать продукцию, произведенную во Франции."
 FRA_dynamise_periph: "Оживить окраины"
 FRA_dynamise_periph_desc: "Сельские и пригородные районы всегда оставались без должного внимания со стороны градостроительной политики. В них недостаточно инвестиций, и зачастую там проживает население, живущее в нестабильных условиях, но полное доброй воли. Мы должны помочь этому населению получить доступ к той же инфраструктуре, что и в крупных городах."
 FRA_focus_insecurity: "В центре внимания – небезопасность"
 FRA_focus_insecurity_desc: "Иммиграция привела к значительному росту нестабильности в нашей стране. Мы должны продемонстрировать населению, что мы очень серьезно относимся к этой проблеме, увеличив численность полиции, введя более строгий контроль и пресекая преступность."
 FRA_eurosepticism: "Угрожать Европейскому союзу"
 FRA_eurosepticism_desc: "Европейский союз всегда пытался заставить замолчать такие страны, как наша, которые выступали против его ультраглобалистской политики. Мы должны дать им понять, что ситуация должна измениться и что мы можем возродить евроскептическое движение во Франции."
 FRA_sovergnism_policies: "Суверенная политика"
 FRA_sovergnism_policies_desc: "Франция должна усилить контроль над своей экономикой, внешней политикой и, прежде всего, границами. Без этого наши усилия по восстановлению страны будут тщетны. Мы должны заявить о своей решимости управлять собственной страной."
 FRA_economical_patriotism: "Экономический патриотизм"
 FRA_economical_patriotism_desc: "Мы должны призвать французские компании, переехавшие за границу, вернуться во Францию. В случае отказа это повлечет за собой последствия для их деятельности во Франции."
 FRA_social_populism: "Социальный популизм"
 FRA_social_populism_desc: "Всё, что нам нужно сделать, это дать людям то, чего они требуют, и принять жесткие меры против тех, кого они ненавидят, чтобы закрепить за собой электоральную базу и обеспечить наше пребывание у власти."
 FRA_criticize_eu_migrant: "Критика европейской миграционной политики"
 FRA_criticize_eu_migrant_desc: "Европейский союз не предпринимает достаточных мер для сдерживания потока мигрантов и вынуждает государства-члены принимать их. Мы должны оказать давление, чтобы положить этому конец."
 FRA_common_accord_eu: "Соглашение с ЕС"
 FRA_common_accord_eu_desc: "Европейская комиссия осознала, что не может нас игнорировать. Теперь мы должны дать ей понять, что, предоставив нам то, чего мы хотим, она обеспечит себе нашу поддержку."
 FRA_reinforce_nuke: "Укрепить наш ядерный потенциал"
 FRA_reinforce_nuke_desc: "Атомная энергия доказала свою надежность. Зачем обращаться к другим источникам энергии, если у нас есть этот опыт? Мы должны расширить наши ядерные мощности, чтобы справиться с ситуацией в случае кризиса."
 FRA_FN_death: "Восстановить смертную казнь"
 FRA_FN_death_desc: "Смертная казнь была отменена несколько десятилетий назад, и с тех пор насильственные преступления только участились. Наши граждане заслуживают того, чтобы снова чувствовать себя в безопасности в своей стране. Мы восстановим её, и самые тяжкие преступления снова будут нести самые тяжкие последствия."
 FRA_reject_immigration: "Отказать в иммиграции"
 FRA_reject_immigration_desc: "Теперь, когда мы лучше контролируем наши границы, мы можем проводить политику по борьбе с нелегальной иммиграцией."
 FRA_pro_russian_fn: "Пророссийская политика"
 FRA_pro_russian_fn_desc: "ЕС не перестанет быть ультраглобалистским. Мы должны сблизиться с Россией, которой всегда удавалось оставаться в стороне от извращений Запада. Вместе мы многого добьемся."
 FRA_oppose_lgbt_fn: "Покончим с \"пробуизмом\""
 FRA_oppose_lgbt_fn_desc: "Некоторым людям нельзя разрешать въезд в нашу страну. Давайте положим конец этому абсурду и сосредоточимся на восстановлении порядка, основанного на единственно правильной модели семьи."
 FRA_end_right_soil: "Прекратить право на землю"
 FRA_end_right_soil_desc: "Родившись во Франции, человек не должен считаться французом. Мы должны положить конец принципу jus soli (право рождения по рождению); мы имеем право выбирать, кто может быть гражданином Франции."
 FRA_support_rus_claim: "Поддержите российские претензии"
 FRA_support_rus_claim_desc: "Россия имеет полное право чувствовать угрозу со стороны расширения НАТО. Мы должны продемонстрировать свою готовность помочь ей исправить несправедливость, от которой она пострадала."
 FRA_electoral_reform: "Избирательная реформа"
 FRA_electoral_reform_desc: "Выборы во Франции все чаще оспариваются на основании избирательной системы и представительности партий. Мы можем осуществить эти реформы, обеспечив при этом их эффективность в наших интересах, чтобы остаться у власти."
 FRA_our_identity: "Наша идентичность"
 FRA_our_identity_desc: "Трудно быть националистом в таком образовании, как Европа. Мы отказались от идеи выхода из него, поэтому нам необходимо сформировать новую идентичность, соответствующую нашему положению в Европейском союзе, но не направленную на размывание нашей идентичности среди иностранной рабочей силы."
 FRA_boreal_space: "Наша позиция в отношении России"
 FRA_boreal_space_desc: "Мы продемонстрировали наше желание сотрудничать с Россией, и наши усилия не остались незамеченными. Сейчас настало время решить, чего мы хотим от России; пришло время наладить с ней контакт."
 FRA_long_travel: "Франция побеждает"
 FRA_long_travel_desc: "За последние несколько лет пребывания у власти мы показали французскому народу, что при наличии решимости проблемы страны можно решить очень легко. Мы сделали Францию ​​сильнее и менее зависимой от наших соседей и от миграционных потоков, которые нам удалось сдержать."
 FRA_sound_fury: "Шум и ярость"
 FRA_sound_fury_desc: "Французский народ больше не хочет умиротворения; умеренные его подвели и так и не добились реальных перемен. Мы — партия перемен; мы должны показать французскому народу, что полны решимости бросить вызов существующему порядку."
 FRA_silent_france: "Мобилизовать тех, кто не участвует в выборах"
 FRA_silent_france_desc: "Многие граждане утратили веру в нашу Республику и ее институты. Мы должны побудить их вернуться на избирательные участки, чтобы добиться реальных перемен."
 FRA_end_privatisation: "Прекратить приватизацию"
 FRA_end_privatisation_desc: "Многие компании продолжают переносить свои производственные площадки из Франции в целях повышения прибыльности. Это приводит к росту безработицы и потере квалифицированных кадров. Мы должны остановить эту утечку, при необходимости восстановив контроль над этими компаниями."
 FRA_pro_lgbt_lfi: "Содействовать позитивным мерам"
 FRA_pro_lgbt_lfi_desc: "Мы должны положить конец дискриминации, которой слишком долго подвергались люди, отклоняющиеся от того, что ошибочно считается нормой. Наше общество должно научиться принимать все различия."
 FRA_toward_6th_rep: "На пути к 6-й Республике"
 FRA_toward_6th_rep_desc: "Теперь мы можем приступить к важнейшей части мандата, доверенного нам народом. Мы обещали перемены, и они их получат. Пришло время сформировать новую Республику, которая будет устраивать всех."
 FRA_distance_nato_lfi: "Отвергните блоковую политику"
 FRA_distance_nato_lfi_desc: "НАТО привязывает нас к войнам Вашингтона так же прочно, как союз с Москвой привязал бы нас к своим собственным. Мы отвергаем оба блока; подлинное неприсоединение — единственная внешняя политика, достойная независимой Франции."
 FRA_oppose_eu_treaty: "Выступаем против договора ЕС"
 FRA_oppose_eu_treaty_desc: "Нашим гражданам были навязаны несправедливые договоры. Мы не обязаны их соблюдать. Чтобы изменить эту несправедливую Европу, мы должны начать с того, чтобы бросить вызов ее законодательной базе."
 FRA_guarante_employment: "Гарантированное трудоустройство"
 FRA_guarante_employment_desc: "В нашей стране много талантливых людей, которые не могут реализовать свой потенциал из-за нехватки рабочих мест, вызванной кризисом. Мы должны гарантировать каждому стабильную и достойную работу; это должно лежать в основе любого общественного договора."
 FRA_state_power: "Власть государства"
 FRA_state_power_desc: "Институты Пятой Республики слишком сосредоточены на должности Президента Республики. Мы должны поощрять общественные дебаты, чтобы народ мог решить, какой должна быть наша новая Республика."
 FRA_democracy: "Индивидуальные свободы"
 FRA_democracy_desc: "Многочисленные кризисы, с которыми столкнулась наша страна, подняли практические вопросы о безопасности нашего населения. Наблюдение необходимо для защиты наших граждан, но насколько далеко может зайти государство? Мы должны предоставить нашим гражданам право высказывать свое мнение."
 FRA_foreign_recognition_lfi: "Пересмотреть нашу внешнюю политику"
 FRA_foreign_recognition_lfi_desc: "Слишком долго наша страна поддерживала диктатуры и отказывалась признавать существование суверенных государств. Мы должны положить этому конец."
 FRA_oppose_eu_immigration_lfi: "Поставить под сомнение позицию ЕС по вопросам иммиграции"
 FRA_oppose_eu_immigration_lfi_desc: "Европейский союз становится все более снисходительным к крайне правым популистам. Он недостаточно делает для помощи нуждающимся соседям и рассматривает их лишь как источник дешевой рабочей силы. Мы должны дистанцироваться от такого подхода и предложить более гуманную политику."
 FRA_economic_question: "Направление экономики"
 FRA_economic_question_desc: "Государственный бюджет и управление им — важные вопросы, от которых зависит все остальное. Наши граждане также должны иметь право голоса в этом вопросе."
 FRA_ho_topic: "Деконструкция французских особенностей"
 FRA_ho_topic_desc: "Многие законы и обычаи, присущие французской культуре, затрудняют интеграцию представителей других культур. Нам следует призвать граждан к обсуждению вопроса интеграции меньшинств."
 FRA_balance_tax: "Сбалансированное налогообложение"
 FRA_balance_tax_desc: "Недопустимо, чтобы средний класс и люди, находящиеся в трудном положении, истощались за счет налогов, в то время как богатые не платят свою справедливую долю. Мы должны восстановить баланс."
 FRA_climate_war_eco: "Вызов нашего тысячелетия"
 FRA_climate_war_eco_desc: "Состояние окружающей среды и климат стремительно ухудшаются. Мы должны защитить то, что осталось от нашего биоразнообразия, и подготовить наше общество к предстоящим трудным временам."
 FRA_dawn_6th_rep: "Заря 6-й Республики"
 FRA_dawn_6th_rep_desc: "Наша работа над Шестой республикой завершена. Каким бы ни был результат, наша работа закончена. Вероятно, мы оставили свой след в истории."
 FRA_creolisation: "Креолизация"
 FRA_creolisation_desc: "Многовековой культурный обмен, свидетелем которого стала наша страна, сформировал новую культуру. Однако многие отрицают эту культуру; мы должны дать понять нашим гражданам, что будущее за совместным проживанием. Нам еще многому предстоит научиться у мира."
 FRA_work_less: "Меньше работы, больше работы"
 FRA_work_less_desc: "Наши предшественники были полны решимости заставить французов работать все дольше и дольше в условиях все худшего положения. Мы должны изменить эту тенденцию и помочь нашим гражданам получать больше удовольствия от работы. Тогда они будут еще более креативными и увлеченными своим делом."
 FRA_reform_police: "Реформировать французскую полицию"
 FRA_reform_police_desc: "Слишком долго полиция использовалась как инструмент несправедливых репрессий против наших граждан. Мы должны провести необходимые реформы, чтобы снизить давление на наших граждан, обеспечив при этом безопасность каждого."
 FRA_post_empire: "Деколонизация нашей международной политики"
 FRA_post_empire_desc: "Наше колониальное прошлое причинило огромный вред нашим бывшим колониям. Многие из них до сих пор пытаются оправиться от этого. Мы должны поддержать их усилия по восстановлению и прекратить попытки господства над ними."
 FRA_push_social_green_eu: "Распространение сопротивления в Европе"
 FRA_push_social_green_eu_desc: "Мы многого добились во Франции, но мы также должны побудить наших европейских партнеров следовать тем же путем. Мы можем мобилизовать их народы, чтобы оказать давление на их правительства, дабы мы не были единственными, кто продвигает прогрессивизм в Европе."
 FRA_social_green_fair_rep: "L'Insoumission"
 FRA_social_green_fair_rep_desc: "Всего за несколько лет мы многого добились. Мы вывели Францию ​​из состояния экономического либерализма и нестабильности, создав более гуманистическую Францию. Но мы никогда не перестанем бросать вызов существующему порядку, будь то внутри страны или в остальном мире."
 FRA_no_time: "У нас нет времени"
 FRA_no_time_desc: "Ученые десятилетиями предупреждали о разрушительных последствиях изменения климата. И то, что они предсказывали, теперь сбывается: учащаются экстремальные погодные явления. Людям нужно очнуться, если они хотят, чтобы у следующего поколения был шанс на жизнь."
 FRA_strong_eu: "Сила ЕС"
 FRA_strong_eu_desc: "Франция не может заставить мир серьезно отнестись к изменению климата. Европейский союз, напротив, может служить примером для остального мира."
 FRA_ecology_available: "Сделайте экологию доступной"
 FRA_ecology_available_desc: "Слишком долго экология считалась привилегией, доступной только богатым. Мы должны продолжать продвигать её как способ экономии денег и предотвращения трагедий для всех."
 FRA_right_vote: "Расширение права голоса"
 FRA_right_vote_desc: "Забота об окружающей среде и ее будущем не должна зарождаться только в восемнадцать лет. Необходимо расширить право голоса для более широкого круга населения."
 FRA_question_growth: "Вопрос об экономическом росте"
 FRA_question_growth_desc: "На протяжении десятилетий людям внушали, что лучший способ помочь окружающей среде — это устойчивое развитие. Но почему мы всегда должны развиваться и расти? Планета и её ресурсы имеют свои пределы. Вместо этого нам следует двигаться к замедлению темпов роста."
 FRA_cooperate_eu: "Сотрудничать с партнерами по ЕС"
 FRA_cooperate_eu_desc: "Не все наши европейские партнеры обязательно обладают одинаковыми ресурсами или одинаковой приверженностью преобразованию своих экономик для борьбы с изменением климата. Мы можем помочь нашим ключевым партнерам в этом, инвестируя в зеленую инфраструктуру в их странах."
 FRA_push_eco_eu: "Содействовать зеленому будущему"
 FRA_push_eco_eu_desc: "Наши европейские партнеры делают не так много, как мы, для борьбы с изменением климата. Мы можем побудить их население к действиям, призвав их защитников окружающей среды последовать примеру Франции."
 FRA_question_agriculture: "Устойчивое сельское хозяйство"
 FRA_question_agriculture_desc: "Сельское хозяйство во Франции в прошлом столетии перешло к массовому производству, чтобы удовлетворить потребности. С экологической точки зрения, оно более ответственно, чем многие другие виды сельского хозяйства, но всё ещё есть куда стремиться. В дополнение к европейским стандартам, мы должны поощрять фермеров к изменению методов работы в пользу ответственного и высококачественного производства. Мы обеспечим продвижение их продукции и то, чтобы это приносило им прибыль."
 FRA_cooperation_no_compet: "Сотрудничество, а не конкуренция"
 FRA_cooperation_no_compet_desc: "Модель социального успеха в нашей стране и во всем мире основана на индивидуальном успехе и демонстрации своего богатства. Такое поведение вредно для нашей планеты, поскольку оно поощряет чрезмерное потребление и токсичную конкуренцию среди граждан. Чтобы уменьшить воздействие наших обществ на планету, мы должны бросить вызов этим социальным моделям."
 FRA_nuke_choice: "Диверсифицировать наш энергетический баланс"
 FRA_nuke_choice_desc: "На протяжении десятилетий энергия во Франции вырабатывалась десятками ядерных реакторов. Хотя эта технология может быть надежной и относительно безопасной в краткосрочной перспективе, она производит отходы, которые мы не можем утилизировать. Поэтому это не идеальный источник энергии для устойчивого будущего. Нам следует диверсифицировать наши источники энергии, инвестируя больше средств в возобновляемые источники энергии."
 FRA_green_eu: "На пути к более экологичному ЕС"
 FRA_green_eu_desc: "Наши успехи в борьбе с изменением климата, как внутри страны, так и за рубежом, служат образцом для других стран Европейского союза. Мы можем этим гордиться."
 FRA_eco_life: "Экологический образ жизни"
 FRA_eco_life_desc: "Одного лишь внедрения более устойчивых методов производства будет недостаточно. Мы должны побуждать наших граждан потреблять меньше. Это включает в себя ограничение повсеместной рекламы и пропаганду умеренности. Нам не нужно всё это; мы можем быть довольны меньшим."
 FRA_upgrade_transport: "Модернизируем нашу транспортную сеть"
 FRA_upgrade_transport_desc: "Наша транспортная сеть может быть эффективной, но она крайне неравномерна и вынуждает жителей отдаленных районов пользоваться более дорогими и загрязняющими окружающую среду видами транспорта. Мы должны обеспечить доступность альтернативных видов транспорта во всех регионах; это означает улучшение транспортного сообщения с отдаленными районами, а не продолжение развития все более быстрой сети, связывающей лишь несколько европейских городов."
 FRA_dynamise_research: "Динамиз Исследователь"
 FRA_dynamise_research_desc: "Мы должны продолжать развивать исследования; мы никогда не перестанем искать способы делать больше с меньшими затратами и развивать возобновляемые источники энергии."
 FRA_help_transi: "Содействовать европейскому переходу"
 FRA_help_transi_desc: "Наши европейские партнеры начинают осознавать, что изменение климата — это серьезная проблема, которая будет все больше затрагивать и их. Однако некоторые из них еще не достигли той стадии развития, которая необходима для инвестиций в этот сектор. Мы можем помочь им в этом, создав совместный фонд наших стран, предназначенный для перехода к низкоуглеродной экономике."
 FRA_end_fossile: "Прекратить использование ископаемого топлива"
 FRA_end_fossile_desc: "Теперь, когда важность «зеленого» перехода получила более широкое признание в Европейском Союзе, мы можем активизировать наши усилия. Мы можем предложить нашим партнерам перейти к поэтапному отказу от ископаемого топлива."
 FRA_opti_indus: "Оптимизация наших отраслей"
 FRA_opti_indus_desc: "Нам необходимо убедить руководителей крупных компаний в том, что внедрение действительно эффективных мер по защите окружающей среды отвечает их интересам. Они тоже могли бы добиться большего, используя меньше ресурсов. Однако мы должны быть осторожны, чтобы это не подтолкнуло их к еще большему производству."
 FRA_promote_local: "Содействовать местному потреблению"
 FRA_promote_local_desc: "Теперь, когда у нас более ответственная промышленность, мы должны обеспечить, чтобы наши граждане действительно могли позволить себе ее продукцию. Однако рыночные силы благоприятствуют низкозатратному производству. Поэтому мы должны обеспечить, чтобы продукция нашей собственной промышленности была более доступна, чем продукция из других стран мира. Это потребует от нас некоторого смягчения правил свободной торговли. Но мы должны быть в состоянии это осуществить."
 FRA_subsidies_green: "Субсидирование экологически чистых отраслей промышленности"
 FRA_subsidies_green_desc: "Поощрение предприятий к внедрению экологически чистых изменений не обеспечит всеобщей поддержки. Нам необходимо предоставить необходимые ресурсы и субсидии предприятиям, исходя из их приверженности защите планеты и эффективности. На этот раз никакого «зеленого камуфляжа» не будет."
 FRA_pressure_supply: "Цепи подачи под давлением"
 FRA_pressure_supply_desc: "Фактом является то, что наша страна не может производить все необходимое сырье внутри страны. Европейский союз импортирует огромное количество ресурсов из стран с мягкими экологическими стандартами. Недопустимо, чтобы мы импортировали ресурсы, не соответствующие нашим производственным критериям. Иначе какой смысл в существующих правилах? Мы должны объединить усилия с другими европейскими державами, чтобы оказать давление на эти страны-экспортеры и добиться перемен."
 FRA_reduce_extraction: "Сокращение добычи ресурсов"
 FRA_reduce_extraction_desc: "Добыча полезных ископаемых и нефти — это загрязняющий окружающую среду процесс, который зачастую превышает возможности нашей планеты по их восстановлению. Хотя мы и не владеем нефтяными месторождениями, мы должны подать пример остальному миру, введя более строгие правила, регулирующие добычу полезных ископаемых и топлива."
 FRA_power_rail: "Продлить действие соглашения EU-Rail"
 FRA_power_rail_desc: "В Европейском Союзе уже существует разветвленная железнодорожная сеть, но мы можем добиться еще лучших результатов. Слишком много грузов по-прежнему перевозится автомобильным транспортом; мы должны сократить этот объем."
 FRA_altermondialism: "Пропагандировать альтермондиализм"
 FRA_altermondialism_desc: "Тот факт, что глобализация перестала приносить пользу обществу, никого не удивляет. Но мы должны отвлечь общественность от антиглобалистского движения. Эти тенденции опасны, потому что они противопоставляют глобализацию националистическому решению, которое зачастую носит агрессивный характер. Мы должны показать им, что главный враг — это капитализм."
 FRA_unite_struggle: "Сближение конфликтов"
 FRA_unite_struggle_desc: "Мы должны объединить всех угнетенных, будь то по признаку пола, религии, цвета кожи или любой другой характеристики. Все они — жертвы капитализма и его социальных последствий. Мы должны показать им, что у всех их проблем есть причина и решение."
 FRA_retake_past: "Возвращение рабочих на родину"
 FRA_retake_past_desc: "После распада СССР и окончания «счастливой глобализации» значительная часть нашего бывшего рабочего электората обратилась к крайне правым популистам или, по большей части, вообще перестала голосовать. Сегодня нам удалось выиграть выборы, но для обеспечения нашего долгосрочного выживания мы должны восстановить нашу рабочую базу, которая является самой ДНК нашей партии. Для этого мы должны серьезно отнестись к их требованиям, начав с возвращения рабочих мест, которые наши либеральные предшественники отправили в Китай."
 FRA_turn_reform: "Реформа, а не революция."
 FRA_turn_reform_desc: "Теперь, когда мы вернулись к руководству этими институтами, нам больше не нужно думать о том, чтобы бросать вызов государству, поскольку мы сами стали его частью. Мы сможем реформировать общество изнутри, отложив в сторону революционные идеалы."
 FRA_leave_nato_PCF: "Разорви отношения с американским империализмом."
 FRA_leave_nato_PCF_desc: "НАТО — это инструмент американского империализма и средство его господства над Европой. Мы должны порвать с ним и вместо этого проявить солидарность со всеми народами, которые сопротивляются гегемонии Вашингтона."
 FRA_renogociate_treaty: "Пересмотреть договор ЕС"
 FRA_renogociate_treaty_desc: "Наш народ был вынужден принять европейские договоры, против которых он, однако, выступал. Для реализации нашей программы мы должны внести изменения в законодательную базу, навязанную нам Европейским союзом. Несомненно, нас ждет борьба за власть с европейскими институтами и санкции, но у нас нет другого выбора, если мы действительно хотим действовать в интересах французского народа."
 FRA_undo_lib_PCF: "Закрыть либеральную скобку"
 FRA_undo_lib_PCF_desc: "Со времен президентства Миттерана французский народ вынужден был терпеть либеральную политику как со стороны левых, так и со стороны правых. Пришло время положить этому конец и показать, что мы другие. Что мы полны решимости бороться против капитализма, даже если это означает конфликт с ВТО или Европейским союзом."
 FRA_protect_indus_pcf: "Защитим нашу отрасль"
 FRA_protect_indus_pcf_desc: "Недостаточно просто инвестировать в промышленность Франции; мы должны предотвратить ее перенос в места, где рабочая сила дешевле и где меньше нормативных актов. Это вопрос защиты нашего суверенитета над средствами производства и обеспечения достойных рабочих мест и условий жизни для наших трудящихся."
 FRA_left_front: "Расширить коалицию"
 FRA_left_front_desc: "Наше правительство сформировано, но не очень стабильно, нам не хватает союзников. Возможно, нам следует поискать союзников среди других радикальных левых партий. Они не согласились присоединиться к нашему правительству, но, возможно, мы могли бы убедить их это сделать. Мы могли бы предложить им несколько министерских постов в обмен на их поддержку."
 FRA_deal_devil_pcf: "Сделка с социалистами"
 FRA_deal_devil_pcf_desc: "Другие радикальные левые партии не смогут обеспечить стабильность, на которую мы надеемся. Возможно, мы могли бы найти общий язык с Социалистической партией. В конце концов, выход из Европы никогда не входил в наши планы. Мы, безусловно, сможем найти с ними общий язык, чтобы включить их в нашу коалицию."
 FRA_tie_moscow: "Ничья с Москвой"
 FRA_tie_moscow_desc: "На протяжении всей холодной войны и даже после неё наша партия всегда была на стороне Москвы. Хотя эпоха СССР закончилась, похоже, что нынешние российские власти поддерживают коммунистические идеалы. После нашего ухода мы находимся под угрозой со стороны наших бывших союзников. Союз с Россией был бы воплощением мечты; мы могли бы наладить экономическое сотрудничество."
 FRA_eu_communism_PCF: "Пропагандировать еврокоммунизм"
 FRA_eu_communism_PCF_desc: "СССР теперь лишь далёкое воспоминание, и сегодня нам приходится обходиться без него в мире, где Россия, наша прежняя модель, колеблется между олигархией и ультранационализмом. Коммунизм и Европейский союз не являются несовместимыми; другие европейские страны не враждебны к нему. Мы можем оставаться в Европе и делать всё возможное, чтобы увести её от капитализма и фашизма."
 FRA_retake_sovereign: "Вернем себе наш суверенитет"
 FRA_retake_sovereign_desc: "Теперь, когда мы восстановили контроль над нашим производственным аппаратом, у нас есть средства для дальнейшего развития. Теперь, когда у нас есть возможность действовать независимо, мы должны избавиться от иностранного влияния."
 FRA_empower_union_PCF: "Содействовать развитию профсоюзов"
 FRA_empower_union_PCF_desc: "Несмотря на прежнюю мощь, сегодня профсоюзы уже не имеют большого влияния. Это связано с тем, что власти намеренно ослабили их, разделив рабочий класс и подорвав гарантии занятости. Однако наличие силы, способной противостоять работодателям, крайне важно для нашей страны. Мы не можем быть везде одновременно; рабочий класс должен вернуть себе контроль над своим будущим. Мы должны помочь ему восстановить свою легитимность в глазах рабочего класса."
 FRA_green_communism: "Обратитесь к «зелёным»"
 FRA_green_communism_desc: "Человечество — не единственная жертва капитализма; наша планета также находится в опасности из-за безрассудного поведения людей. Мы можем найти общий язык с «зелёными»; они могут помочь нам разработать экологическую программу, которая нам тоже понадобится."
 FRA_no_russian_claim: "Российская угроза"
 FRA_no_russian_claim_desc: "Весьма вероятно, что рано или поздно Европейский союз окажется в конфликте с Россией. Поскольку Россия, скорее всего, обратит свой взор на украинские и балтийские территории, мы должны начать с того, чтобы обратиться к украинцам и предложить им свою помощь."
 FRA_green_turn: "Зеленый коммунизм"
 FRA_green_turn_desc: "В сотрудничестве с нашими союзниками в сфере охраны окружающей среды мы разработали экологическую программу, которая позволит нам подготовить Францию ​​к вызовам, связанным с изменением климата. Это потребует от нас значительных усилий по восстановлению производственных мощностей при одновременном ограничении их углеродного следа. Но мы должны это сделать; у рабочего класса также есть дети, которые должны иметь возможность расти в пригодном для жизни мире."
 FRA_favor_lgbt: "Прекращение дискриминации"
 FRA_favor_lgbt_desc: "Теперь, когда мы обеспечили нашему населению основные средства к существованию, предоставив ему работу и будущее, мы также должны бороться с дискриминацией внутри социальных классов. Мы должны напомнить нашим людям, что дискриминация по любым основаниям недопустима. Наше общество должно научиться принимать все различия."
 FRA_dna_restored: "ДНК восстановлена"
 FRA_dna_restored_desc: "Сформировав коалицию, мы сможем сосредоточиться на восстановлении позиций рабочего класса. Введя обширные законы о защите прав трудящихся, мы сможем вернуть себе электоральную базу. Это не понравится бизнес-сообществу, но это никогда не было нашей целью."
 FRA_condemn_rus: "Защитить Восточную Европу"
 FRA_condemn_rus_desc: "Российская агрессия может не ограничиться Украиной. Для защиты нашей развивающейся Европы мы должны обеспечить, чтобы страны Восточной и Северной Европы смогли противостоять потенциальному российскому вторжению."
 FRA_by_ourself: "Триумф реформизма"
 FRA_by_ourself_desc: "Сформировав сильную коалицию, мы заложили основу для того, чтобы Франция оставалась левоцентристской страной. Мы восстановили доверие избирателей к левым и их институтам. Не отказываясь от прошлого, пока мы здесь, мы никогда не перестанем бороться против капитализма и фашизма как в Европе, так и во всем мире."
 FRA_friend_of_past_pcf: "На пути к новому Коминтерну"
 FRA_friend_of_past_pcf_desc: "Российское коммунистическое правительство, похоже, тоже достаточно укрепилось. Мы могли бы предложить им расширить наше сотрудничество. Пришло время вернуть коммунизму его былую славу. Капиталисты и фашисты должны снова научиться нас бояться."
 FRA_struggle_end: "Борьба только начинается."
 FRA_struggle_end_desc: "За эти несколько лет пребывания у власти мы вернули коммунизм на политическую карту. Мы восстановили связь с нашим электоратом и обеспечили будущее для грядущих поколений. Однако мы еще далеки от завершения. Всегда будут новые вызовы, которые предстоит решить. Но мы, по крайней мере, обеспечили, чтобы левые больше не были троянским конем неолиберализма."
 FRA_new_18th_brumaire: "Новое 18-е брюмера"
 FRA_new_18th_brumaire_desc: "Мы, бонапартисты, обеспечили себе высшие посты в Республике. Республиканская оппозиция замолчала, и только мы способны возглавить эту страну. У нас множество врагов, но ничто не встанет между Францией и её судьбой."
 FRA_revolution_bonapart: "Революционное наследие"
 FRA_revolution_bonapart_desc: "Наполеон I и Французская империя являются прямыми наследниками Французской революции. Поскольку французский народ глубоко привержен этим ценностям, мы должны показать ему, что наша империя — это не реставрация. Наша империя — это предвестник новой революции."
 FRA_despotism: "Деспотизм, а не беспорядок"
 FRA_despotism_desc: "Беспорядки последних месяцев вызвали значительную обеспокоенность среди нашего народа и на финансовых рынках. Мы должны заверить их, что, пока мы находимся у власти, никакие беспорядки не будут терпимы."
 FRA_napoleon_constitution: "Наполеоновская конституция"
 FRA_napoleon_constitution_desc: "Институты бывшей Республики больше не соответствуют современным реалиям и нашей власти. Мы должны перестроить их, чтобы создать государство, которое будет сильнее, чем когда-либо."
 FRA_reform_military_napoleon: "Новая Великая армия"
 FRA_reform_military_napoleon_desc: "Наши вооруженные силы более чем достаточны для такой страны, как наша. Но они не способны выдержать длительный конфликт против множества иностранных держав. Мы должны начать с нуля и создать армию, которую никто не сможет победить."
 FRA_question_eu: "Европа или Империя"
 FRA_question_eu_desc: "Поскольку наша страна является одним из основателей Европейского союза, она глубоко интегрирована в него, и выход из него будет непростой задачей. Однако мы намерены бороться против других европейских держав. Должны ли мы, как новое французское правительство, вновь присоединиться к институтам Европейского союза или же нам следует навсегда выйти из него? В любом случае, нам придётся бороться против них."
 FRA_centralised_admin: "Административный централизм"
 FRA_centralised_admin_desc: "Децентрализация была ошибкой для нашей страны. Нам нужна четкая иерархия управления и вертикальная организационная структура."
 FRA_blame_ennemy: "Агрессивная риторика"
 FRA_blame_ennemy_desc: "Наша зарождающаяся империя окружена будущими врагами. Рано или поздно нам придётся сражаться с ними, но наше общество не готово к войне против наших бывших союзников. Мы ввели их в заблуждение, говоря им о мирном будущем; рано или поздно они вернутся к реальности. С этой целью мы можем подготовить их, подорвав их доверие к нашим бывшим партнёрам и заставив их понять, что мы стоим в одиночестве против всех остальных."
 FRA_proclaim_empire: "Императорская прокламация"
 FRA_proclaim_empire_desc: "За короткий промежуток времени нам удалось укрепить свою мощь и создать условия для возвращения Франции на международную арену. Теперь пришло время отбросить притворство. Мы провозгласим возвращение Французской империи после парада, демонстрирующего всю мощь наших военных возможностей. Демонстрация силы, предупреждение, начало новой эры для Франции. После этого мы ясно увидим: потенциальные союзники придут к нам, а наши противники покажут себя."
 FRA_la_grande_armee: "Основа нашей армии"
 FRA_la_grande_armee_desc: "Реформировав нашу систему командования, мы теперь можем обратить внимание на более конкретные реформы нашей военной структуры. Для начала мы можем сосредоточиться на нашей наступательной доктрине с точки зрения фактических ресурсов, доступных для проведения наших операций."
 FRA_europe_nationalism: "Укрепить европейский национализм"
 FRA_europe_nationalism_desc: "Немногие европейские страны выразили нам свою поддержку. Они с неодобрением относятся к возвращению Франции под руководством националистической партии. Их позиция ошибочна; им следует понимать, что лучше быть с нами, чем против нас. Мы заставим их заплатить за бездействие. Мы окажем поддержку националистическим группам в их странах. Это вызовет настоящий хаос у нас на родине, и если они придут к власти, мы обретем союзника."
 FRA_plebiscites: "Правление путем плебисцита"
 FRA_plebiscites_desc: "Конец Республики отнюдь не означал, что народ лишится возможности выражать свое мнение. Мы должны показать народу, что он по-прежнему имеет право голоса, предложив ему участвовать в принятии решений по различным вопросам нашей политики. Императору не составит труда убедить их, и этой фиктивной демократии будет достаточно для большинства."
 FRA_firepower: "Современная огневая мощь"
 FRA_firepower_desc: "В период Наполеоновских войн Великая армия извлекла выгоду из ряда нововведений, которые позволили ей обрушить на контрреволюционные силы беспрецедентную огневую мощь. Сегодня правила бомбардировки значительно изменились с появлением на поле боя штурмовой авиации и беспилотников. Нашей стране повезло преуспеть как в артиллерии, так и в авиации. Поэтому мы должны решить, чему отдать приоритет, чтобы оптимизировать наше производство для обеспечения боевых действий."
 FRA_8th_coalition: "Окружённый врагами"
 FRA_8th_coalition_desc: "Как и во времена наполеоновских войн, явно разворачивается политическая игра. Наши враги боятся нас и только и ждут первого признака слабости, чтобы объединить силы против нас. Мы не дадим им этого удовольствия. Наши границы останутся милитаризованными столько, сколько потребуется. Французская империя выживет только в противостоянии своим противникам; разница с прошлым в том, что на этот раз у коалиции не будет времени сформироваться, ибо мы будем сокрушать их одного за другим."
 FRA_renew_meritocracy: "Меритократическая империя"
 FRA_renew_meritocracy_desc: "Несмотря на известные недостатки, Первая империя обязана своим успехом предпочтению опыта и профессионализма социальному классу. Сегодня мы должны возобновить это обещание социального прогресса для французского народа. Они должны понимать, что, усердно работая на благо империи и Франции, они могут подняться выше, чем когда-либо прежде."
 FRA_last_deluge: "Сильнее, чем когда-либо"
 FRA_last_deluge_desc: "Мы провели масштабные реформы в нашей командной структуре, доктринах и цепочках снабжения. Теперь осталось лишь открыть двери нашей армии для массового набора. Призыв на военную службу давно не существует, но французы готовы сражаться за свою империю. Великая армия будет готова отправиться покорять Европу."
 FRA_ennemy_isolate: "Внедриться в ряды наших противников"
 FRA_ennemy_isolate_desc: "У нас есть средства для проникновения в системы гражданской обороны наших противников и нанесения ударов по ним в самое уязвимое место. Это обеспечит отличную подготовку наших разведывательных служб, но также чревато тем, что они будут относиться к нам с опаской."
 FRA_history_allies: "Союзники Империи"
 FRA_history_allies_desc: "Несмотря на то, что нас окружают враги, мы не одиноки; многие страны по-прежнему поддерживают с нами дружеские отношения и могут быть заинтересованы в присоединении к нашему альянсу. Мы могли бы подчеркнуть нашу общую историю, чтобы обосновать будущий союз. Мы можем предложить им значительные выгоды, и они окажут нам большую помощь."
 FRA_imperial_pride: "Имперская гордость"
 FRA_imperial_pride_desc: "Французский народ вновь обрел гордость. Мы показали им, что мир и Республика были всего лишь иллюзиями, и что будущее Франции заключается в превращении в империю. Они гордятся своей страной и ненавидят наших противников. Наше общество и наша экономика ориентированы на затяжной конфликт."
 FRA_declare_hostile: "Проверьте их защиту"
 FRA_declare_hostile_desc: "У нас больше нет причин скрывать наши экспансионистские амбиции от будущих врагов. Пришло время показать их народу, что у них есть все основания бояться нас и подчиниться без лишних слов."
 FRA_our_own_system: "Наша собственная система"
 FRA_our_own_system_desc: "У каждой империи есть свой альянс, и попытка одержать победу в одиночку обойдется дорого. Ряд стран уже выразили готовность к формированию альянса с нами. Пришло время формализовать это сотрудничество, создав прочный союз между партнерами, которые уважают друг друга."
 FRA_reclaim_empire: "Верните Империю"
 FRA_reclaim_empire_desc: "Пришло время взяться за возвращение нашей империи. Мы потратили годы на подготовку нашего общества, экономики и армии. Пришло время, чтобы эта работа принесла свои плоды и Франция вернула себе законное место в мировом порядке."
 FRA_french_commune: "Победоносная революция"
 FRA_french_commune_desc: "Нам удалось отвоевать контроль над институтами у умеренных коммунистов и других слабых сил или марионеток капитализма. Принимая наше восхождение к власти, французский народ оказывает нам доверие. Они тоже верят, что капитализм можно победить, и именно этим мы намерены заняться. Мы восстановим наше общество и подготовимся к противостоянию с капиталистическими силами."
 FRA_purge_military: "Обеспечьте безопасность Генерального штаба"
 FRA_purge_military_desc: "Хотя нам и удалось взять под контроль институты, армия, которая не вмешивалась, не всегда может оставаться на нашей стороне. Рано или поздно нам придётся столкнуться в военном противостоянии с другой державой. Чтобы обеспечить их лояльность, мы должны начать с вершины командной цепочки. Они довольно быстро поймут, что у них нет выбора, но, несомненно, будут оказывать некоторое сопротивление в течение нескольких месяцев. Как только верхушка цепочки будет приведена в соответствие, остальные будут подчиняться приказам."
 FRA_worker_right_comm: "Успокойте работников"
 FRA_worker_right_comm_desc: "Хотя сложный этап нашей революции уже позади, гражданское общество выразило серьезную озабоченность ситуацией в нашей стране. Мы должны успокоить трудящихся, гарантируя им рабочие места и гарантии занятости. Это потребует адаптации наших производственных линий, но эти гарантии будут полезны для нашего будущего."
 FRA_people_constitution_comm: "Диктатура пролетариата"
 FRA_people_constitution_comm_desc: "Институты Старой Республики были в корне несправедливы. Небольшая, коррумпированная каста осуществляла тотальный контроль над страной. Наша революция должна дать рабочим инструменты для участия в политической жизни страны, которой они помогают управлять. Пришло время положить конец несправедливой Республике и разработать новую форму правления."
 FRA_revolution_soil: "Страна Революций"
 FRA_revolution_soil_desc: "Начиная с Жакерийской революции и заканчивая Французской революцией, французский народ показал, что он противостоит несправедливости авторитарных систем. После нашей революции мы должны показать им, что их молитвы были услышаны, и построить эгалитарное общество, способное противостоять всем атакам контрреволюционеров."
 FRA_hostile_nato_comm: "Испорченный Запад"
 FRA_hostile_nato_comm_desc: "НАТО — марионетка Соединенных Штатов и капитализма. Поскольку обе страны являются нашими заклятыми врагами, мы не должны больше оставаться в этом альянсе. Рано или поздно они станут нашими противниками."
 FRA_fate_eurocommunism: "Отказаться от европейского эксперимента"
 FRA_fate_eurocommunism_desc: "Даже если бы мы изо всех сил старались, нам не удалось бы вернуть институты Европейского союза на правильный путь. Они пронизаны коррупцией капитализма и лоббированием. Более того, эти страны решительно выступают против нашей внутренней политики. Раскол нанесет ущерб нашей высокоинтегрированной экономике, но это разделение необходимо."
 FRA_legacy_patriwar: "Наследие Великой Отечественной войны"
 FRA_legacy_patriwar_desc: "В прошлом веке СССР показал миру, что фашизм можно победить силой оружия. Эта война, которую они успешно вели, научила нас тому, что нация должна быть едина со своей армией. Красная Армия никогда бы не одержала победу без стойкости советского общества. Мы должны обеспечить, чтобы в будущих конфликтах общественный энтузиазм оставался на самом высоком уровне. Нам понадобятся все наши силы для того, что нас ждет впереди."
 FRA_focus_education: "Народное образование"
 FRA_focus_education_desc: "Будь то участие в политике или эффективная и счастливая работа, наши люди должны быть информированы. Мы должны дать каждому возможность узнать все необходимое для понимания мира, не поддаваясь пропаганде капиталистов и фашистов."
 FRA_loyalty_cause: "Верность делу"
 FRA_loyalty_cause_desc: "Мы предоставили нашему народу множество прав, от улучшения условий труда до политического представительства, и исправили многие несправедливости. Однако эти новые права сопряжены с ответственностью. Инакомыслие допускается, но каждый гражданин обязан в полной мере подчиняться воле коллектива. Мы управляем этим обществом вместе; поэтому каждый несет ответственность за то, чтобы оно продолжало функционировать должным образом."
 FRA_paris_commune: "Уроки Парижской коммуны"
 FRA_paris_commune_desc: "Хотя связь между Парижской коммуной и коммунистической идеологией, которую мы исповедуем, далеко не очевидна, мы все же можем извлечь уроки из этого бурного периода. Парижская коммуна пала из-за нехватки ресурсов и желания бороться с силами контрреволюции. В этом жестоком мире, развращенном глобализацией, мы должны помнить, что выживание нашей революции зависит от подавления контрреволюционных сил. Наше общество должно осознавать это и объединиться, чтобы противостоять нашим противникам."
 FRA_unleash_agent: "Дестабилизировать капиталистов"
 FRA_unleash_agent_desc: "Мы не всегда сможем противостоять нашим противникам на поле боя; это было бы слишком дорого, и мы могли бы потерпеть поражение. Однако мы можем облегчить себе жизнь, разрушив их общество изнутри. В лице DGSE у нас есть разведывательное агентство, обученное шпионажу и дестабилизации, и мы могли бы использовать его с пользой. Мы экспортируем революцию без войны, и капиталисты ничего не смогут с этим поделать."
 FRA_spread_communism_eu: "Распространение коммунизма в Европе"
 FRA_spread_communism_eu_desc: "Мы не можем изменить европейские институты, но можем подтолкнуть некоторые государства-члены к бунту. Поскольку неолиберальная политика, проводимая в ЕС, не всем по душе, у нас не возникнет проблем с убеждением части их населения присоединиться к нам."
 FRA_red_army_comm: "Новая Красная Армия"
 FRA_red_army_comm_desc: "Благодаря нашим реформам армия полностью находится под контролем коммуны, а гражданское общество готово сражаться плечом к плечу с её вооружёнными силами. Наши реформы также раскрыли весь её потенциал; наши солдаты знают, что справедливость на нашей стороне. Коммуна не должна пасть, ибо она несёт факел революции."
 FRA_collectivisation: "Коллективизация экономики"
 FRA_collectivisation_desc: "Контроль над экономикой всегда ускользал от рабочего класса, оставаясь в руках нескольких семей. До революции в этой стране безраздельно господствовала олигархия. Но теперь этому пришел конец; французский народ возвращает себе контроль над своими средствами производства. Благодаря этому мы обеспечим лояльность наших средств производства, а также финансовую безопасность нашего населения."
 FRA_enforce_unions: "Расширить возможности профсоюзов"
 FRA_enforce_unions_desc: "Теперь, когда мы коллективизировали французскую экономику и предоставили рабочим большую политическую ответственность, мы должны обеспечить им возможность сохранить контроль, если государство окажется менее осмотрительным. Профсоюзы, возможно, были восстановлены нашими умеренными предшественниками, но мы можем сделать больше. Мы предоставим профсоюзам еще больше власти и будем поощрять рабочих вступать в них. Объединенные рабочие никогда не должны переставать играть значительную роль в принятии решений в нашей стране."
 FRA_glorious_past_comm: "Сомнительное прошлое коммунизма"
 FRA_glorious_past_comm_desc: "Хотя не у всех в Европе, особенно в Восточной Европе, остались приятные воспоминания о сталинском коммунизме, мы должны напомнить им, что мы другие. Эти страны были раздавлены сталинским тоталитаризмом, который не освободил народ, а лишь дал ему нового хозяина. Нашими единственными врагами являются капитализм и фашизм; если этим странам нужно освободиться от них, мы можем им в этом помочь. Но наша цель будет заключаться не в порабощении, а в интеграции их в наш Союз пролетариата всех наций."
 FRA_befriend_comm: "Трудовое единство"
 FRA_befriend_comm_desc: "Хотя коммунизм менее популярен в новом тысячелетии, мы не одиноки в следовании его учениям. В предстоящей борьбе нам нужны союзники, и мы можем найти их среди тех стран, которые, как и мы, выбрали сопротивление капитализму. Мы должны предложить этим странам помочь друг другу уничтожить капитализм во всем мире. Они не одиноки, и мы тоже."
 FRA_final_struggle: "Последняя борьба"
 FRA_final_struggle_desc: "Наше общество и наша армия готовы бороться против капитализма. Они знают о достигнутом нами прогрессе и о решимости капиталистических держав стереть нас с лица земли. Мы будем бороться до последнего, чтобы победить капитализм."
 FRA_UFSR_born: "Коммунизм с французской спецификой"
 FRA_UFSR_born_desc: "Сочетание коммунистической идеологии и решимости французского народа защищать свои права было очень хорошей идеей. Мы ясно дали понять общественности, что она должна участвовать в политике и что у нее есть для этого средства. Подобно тому, как Праздник Федерации отмечает наш национальный праздник, можно сказать, что революция теперь действительно принята французским народом. Это исторический день для нашей страны."
 FRA_new_kommintern: "На пути к новому международному"
 FRA_new_kommintern_desc: "Многие группы по всему миру откликнулись на наш призыв к мировой революции. Пришло время воплотить наш союз в жизнь и подготовиться к противостоянию капитализму."
 FRA_cold_war_round2: "Мировая революция"
 FRA_cold_war_round2_desc: "Пришло время бороться против капитализма и фашизма. Мы принесём свободу трудящимся в каждой стране. Олигархия будет побеждена."
 FRA_kingdom_history: "Долгая история монархии"
 FRA_kingdom_history_desc: "Во Франции вернулась монархия. Наши сторонники взяли под контроль институты бывшей Республики и призвали к нашему возвращению. И вот мы, спустя два столетия после падения абсолютной монархии, снова на французском троне. Впереди нас ждет долгий путь. Мы должны искоренить республиканское наследие революции, одновременно восстанавливая новое Королевство Франции. Тем временем наши враги поджидают нас в тени, но мы добьемся успеха, ибо Бог с нами, как и всегда."
 FRA_camelot: "Королевские верблюды"
 FRA_camelot_desc: "Чтобы гарантировать, что население останется послушным и не будет мечтать о новой Республике, мы должны усилить наблюдение, а для этого нам нужна политическая полиция. С этой целью мы можем использовать бывших членов организации «Action Française», прошедших обучение в DGSI. Мы объединим эти организации в новую структуру, которую назовем «Королевские Камелоты» в знак уважения к нашим роялистским активистам прошлого века."
 FRA_decentralisation_king: "Полная децентрализация"
 FRA_decentralisation_king_desc: "Централизация, унаследованная от якобинизма и революции, превратила французов не в граждан, а в подданных. Системы обычного права, действовавшие на более низких уровнях, очень хорошо выполняли свою функцию связующего звена между гражданином и центральным государством. К счастью, наша страна уже начала отходить от централизма, чтобы соответствовать стандартам Европейского союза. Поэтому мы можем завершить этот переход не для того, чтобы соответствовать модели европейских регионов, а для того, чтобы восстановить систему местного самоуправления, как это было до революции."
 FRA_king_rule: "Regnum Regis"
 FRA_king_rule_desc: "Первым шагом к стиранию памяти о революции является построение новой системы на руинах старой. Поэтому мы можем объявить об упразднении Республики и разработке новой конституции. Эта конституция будет сосредоточена в руках короля, который будет обладать абсолютной властью, как и в старые добрые времена."
 FRA_national_integralism: "Интегральный национализм"
 FRA_national_integralism_desc: "Чтобы помочь французскому народу понять, каким провалом была революция и каковы были её последствия, мы должны обратить внимание на известную теорию, выдвинутую мыслителем Шарлем Моррасом. Интегральный национализм изображает республику, отказавшуюся от патриотизма в результате революции, спровоцированной масонами, еретиками и иностранцами. Он выступает за возвращение к национальному единству и моральному порядку, воплощенному в Католической церкви. Эти учения полны добродетели и полностью применимы к нашему зарождающемуся Королевству. Наше Королевство только что нашло свой манифест."
 FRA_no_more_eu: "Выход из Европейского союза"
 FRA_no_more_eu_desc: "Европейский союз олицетворяет собой всё, против чего мы боремся: безудержный либерализм, отвратительный идеализм, катастрофическую наивность и повсеместную коррупцию. Единственная цель этой организации — разрушение наших стран и наших культур. Поэтому у нас нет причин оставаться частью этого союза. Мы должны выйти из него, пока не поздно, какими бы ни были последствия."
 FRA_eu_kingdom: "Падшие монархии"
 FRA_eu_kingdom_desc: "Несколько веков назад Европа была континентом монархий. Международный порядок в то время, в некотором смысле, формировался балансом сил и союзами. Но те времена давно прошли. Национализм либо сместил монархии, либо низвел их до статуса туристических достопримечательностей. Поэтому лучшее, что мы можем сделать для поиска союзников, — это помочь сторонникам абсолютизма в Европе восстать против своих республиканских угнетателей."
 FRA_king_modern_chivalry: "Современное рыцарство"
 FRA_king_modern_chivalry_desc: "Королевство Франция всегда славилось своей кавалерией и решающей ролью, которую она играла в сражениях. Сегодня кавалерия напоминает 60-тонного стального монстра. И всё же её роль остаётся решающей. Нашим вооружённым силам следовало бы сосредоточиться на широком использовании бронированной кавалерии."
 FRA_no_deceit: "Конец декаданса"
 FRA_no_deceit_desc: "Наш главный враг — это упадок, который Республика привнесла в наше общество: граждане, отклонившиеся от морального порядка и ожидающие, что государство будет оплачивать всё. Мы должны вернуть их к реальности. Эпоха Республики закончилась. Нашему Королевству нужны добродетельные граждане."
 FRA_frankish_ancestor: "Наши предки, франки"
 FRA_frankish_ancestor_desc: "Мы, французы, потомки франков; это наш народ и наша идентичность. Республиканцы хотели искоренить монархию и франков, но никто не может уничтожить цивилизацию и культуру изнутри. Это наше наследие, и только от нас зависит его возрождение."
 FRA_against_liberalism: "Против либерализма и социализма"
 FRA_against_liberalism_desc: "Республика ввела наших граждан в заблуждение, заставив их поверить в необходимость большей свободы и прав. Наше Королевство стремится исправить эту несправедливость. Прежде всего, наши граждане должны заново открыть путь к нравственному порядку и единству нации вокруг своего короля. Всё остальное второстепенно."
 FRA_historical_ennemy: "Вечный Враг"
 FRA_historical_ennemy_desc: "Если и есть противник, с которым мы сталкивались на протяжении веков, то это, несомненно, Соединенное Королевство. Оно тоже монархия, хотя монарх сейчас не обладает реальной властью. Рано или поздно нам, безусловно, придется столкнуться с ними. Но независимо от того, будут ли это они или другие державы, наш флот должен быть готов к борьбе против морских держав."
 FRA_friend_pope: "Защитите папство"
 FRA_friend_pope_desc: "Как старшая дочь Церкви, Франция обязана защищать папство от всех, кто может попытаться его посягнуть."
 FRA_army_of_elites: "Элитный отряд"
 FRA_army_of_elites_desc: "Именно революция ввела концепцию призыва на военную службу. В ходе двух последних мировых войн мы убедились, что это не всегда было лучшей идеей. Солдат, не всегда прошедших надлежащую подготовку, отправляли на смерть. Эти решения привели к резкому сокращению населения Франции в прошлом веке. Мы должны обеспечить профессионализм нашей армии, ужесточив критерии призыва. Это также предотвратит появление в наших рядах нарушителей порядка."
 FRA_positive_inequality: "Позитивное неравенство"
 FRA_positive_inequality_desc: "Не всё должно быть эгалитарным. Идея о том, что мы все должны быть равны, — ещё одно изобретение революции. Одни люди должны быть лидерами, а другие — последователями. Французам нужно это понять, потому что тратить время на жалобы на успехи других снижает эффективность всех."
 FRA_destroy_republicanism: "Уничтожить республиканизм"
 FRA_destroy_republicanism_desc: "Абсолютизм вернулся в наше Королевство. Больше нет причин поддерживать эту иллюзию демократии, которая является политикой. Единственная партия, имеющая право на существование, — это партия короля. Французы должны понять, что я — государство!"
 FRA_catholic_league: "Основал Католическую лигу"
 FRA_catholic_league_desc: "Наше сближение с Церковью не оставило всех равнодушными. Некоторые страны выразили нам свою поддержку. Возможно, нам стоит распространить наш крестовый поход и на другие католические державы. В конце концов, они тоже имеют право бороться за возвращение Святой Земли."
 FRA_burry_revolution: "Похоронить революцию"
 FRA_burry_revolution_desc: "Французский народ наконец-то осознал, что революция принесла лишь страдания и что господство французской монархии было естественным порядком вещей. Наши институты также были очищены от революционных элементов. Поэтому мы можем сказать, что успешно перевернули страницу этой проклятой революции."
 FRA_elder_daughter: "Старшая дочь Церкви"
 FRA_elder_daughter_desc: "Франция вновь заняла своё место в мировом порядке. Мы, как и прежде, останемся защитниками христианства и вернём Святую Землю, как делали это много раз прежде."
 FRA_republican_cancer: "Республиканский рак"
 FRA_republican_cancer_desc: "Наша страна сумела избавиться от республиканизма, но мы, по сути, единственная в Европе, кто больше не находится под его властью. Само собой разумеется, что если мы потерпим поражение в битве, наши противники снова погрузят нас в республиканский кошмар. Мы должны уничтожить республиканскую угрозу, где бы она ни находилась. Только так мы будем в безопасности."
 France_news.100.t1: "Красные флаги над Елисейским двором"
 France_news.100.d1: "Французское государственное телевидение отключилось перед рассветом. После возобновления трансляции студию занимали люди в военной форме, зачитывающие коммюнике от органа, называющего себя Комитетом общественной безопасности. Елисейский дворец и Национальное собрание окружены бронетехникой, и ни одного министра Пятой республики не видели с полуночи. Брюссель созвал экстренное заседание, а Вашингтон приказал сотрудникам своего посольства оставаться в своих домах."
 France_news.100.t2: "Париж пал перед традиционалистами"
 France_news.100.d2: "Подразделения жандармерии, лояльные традиционалистским сетям, ночью двинулись на правительственный квартал и не встретили сопротивления со стороны армейского командования, которому было явно приказано отойти в сторону. К утру над Елисейским двором развевался триколор, рядом с которым не допускалось присутствие флагов, которые ни одно французское правительство не признавало с 1944 года. Работа институтов Республики приостановлена ​​до тех пор, пока заговорщики не объявят о национальной реставрации."
 France_news.100.a: "Пятая республика завершилась."
 France_news.100.b: "Европа не может этого допустить."
 France_news.100.c: "Франция похоронила еще одну республику."
 France_news.101.t: "Франция отправляется на выборы."
 France_news.101.d: "Сегодня утром по всей Франции открылись избирательные участки для первого тура президентских выборов. Прогнозируется крайне низкая явка: левые расколоты на четыре части, правые разделены между республиканцами и сторонниками суверенитета, а Национальный фронт комментаторы на протяжении всей кампании отказывались обсуждать. До второго тура осталось две недели, и на этот раз никто в Париже не скажет, кто в него войдет."
 France_news.101.a: "Второй тур выборов – это наша вина, и мы можем только потерять его."
 France_news.101.b: "За Парижем следует наблюдать."
 France_news.102.t1: "Революционные ячейки арестованы"
 France_news.102.d1: "Скоординированные рейды, проведенные DGSI и GIGN, разгромили радикальные сети еще до рассвета. Лидеры ячеек были арестованы в своих квартирах в Сен-Дени и Вильербанне, тайники с оружием были изъяты в трех департаментах, а партийный аппарат, в который они внедрялись в течение двух лет, был очищен. Правительство настаивает на том, что Республике никогда не угрожала опасность. Ордера на арест говорят об обратном."
 France_news.102.t2: "Заговор сторонников Реставрации сорван"
 France_news.102.d2: "Скоординированные рейды DGSI и GIGN разрушили традиционалистские сети еще до рассвета. Организаторов Action Française вывезли из домов, в трех департаментах были конфискованы склады оружия, а офицеры, обещавшие заговорщикам молчание армии, теперь предстанут перед военным трибуналом. Пятая республика пережила самый опасный момент за последние сорок лет."
 France_news.102.a: "Республика сохраняется."
 France_news.102.b: "Облегчение и предостережение."
 france_md.20.t: "Состояние центристской партии"
 france_md.20.d: "Изначально правоцентристская партия, Объединенный демократический фронт (ОДФ) зарекомендовал себя как центристская партия, и в прошлом мы смогли управлять страной под руководством президента Валери Жискар д'Эстен. Однако с тех пор мы отошли на второй план, иногда занимая должности во время совместных избирательных кампаний, но оставаясь в тени Республиканской правой партии и Социалистической партии. Но мир меняется, и неолиберальная тенденция набирает силу на Западе. Сегодня мы не очень многочисленны, но нет сомнений, что однажды мы будем править страной."
 france_md.20.a: "Да, я с нетерпением жду!"
 france_md.21.t: "Состояние правого крыла Республиканской партии"
 france_md.21.d: "Наша партия существует столько же, сколько и республика, и правит с 1995 года при правлении Жака Ширака, но сейчас у него нет поддержки. После неудачного роспуска парламента, вынудившего его назначить премьер-министра-социалиста, мы наблюдаем подъем наших соперников, будь то Социалистическая партия или Национальный фронт. Наша страна, как всегда, испытывает финансовые трудности, и ее интересы находятся под угрозой повсюду за рубежом. Одно можно сказать наверняка: нам придется бороться внутри страны и за рубежом, чтобы утвердить мощь Франции перед теми, кто в ней сомневается."
 france_md.21.a: "Приступим к работе!"
 france_md.22.t: "Состояние РПФ"
 france_md.22.d: "Основанная в 1999 году, Партия «Объединение за Францию» (РПФ) — это правоцентристская суверенистская партия. Созданная Шарлем Паскуа, она решительно выступает против Европейского союза, против которого она упорно борется. Наше влияние пока незначительно, но колесо вращается: Европейский союз не всех устраивает, и мы принимаем всё больше диссидентов из других партий, разочарованных людей, которые не могут найти в себе силы для реализации Фрексита в других странах. Мы, конечно же, самая голлистская партия из всех существующих, и поскольку эта республика была основана де Голлем, нам нет места в ней, кроме Матиньона!"
 france_md.22.a: "Да здравствует генерал де Голль, да здравствует Франция!"
 france_md.23.t: "Состояние Национального фронта"
 france_md.23.d: "Основанный в 1972 году Жан-Мари Ле Пеном, Национальный фронт — это крайне правая партия. С момента своего создания нас не считали серьёзной партией, поскольку весь политический ландшафт был против нас за противодействие иммиграции. С тех пор ситуация изменилась, и другие партии начинают понимать, что их позиция привела к хаосу в нашей стране. Мы являемся предвестниками того, что станет общей тенденцией против иммиграции. Но нас по-прежнему считают неприкасаемыми и клеймят экстремистами, поэтому мы должны работать над тем, чтобы наша партия стала приемлемой для парламента и избирателей."
 france_md.23.a: "Мы туда доберемся!"
 france_md.24.t: "Состояние Социалистической партии"
 france_md.24.d: "Наша партия, исторический соперник республиканского правого крыла, находится в почтенном возрасте. Республиканское правое крыло сейчас переживает трудный период, вынужденное сосуществование. У нас прочная электоральная база среди большинства слоев населения, и наша победа на выборах неизбежна. Мы выступаем за более либеральный подход, чем наши предшественники, чтобы адаптироваться к Европе, которую мы строим. Однако наша партия сталкивается с внутренними разногласиями: правое крыло стремится к либеральному центру, а левое рискует радикализироваться. Нет сомнений, что мы победим, но, оказавшись у власти, нам придется ходить на цыпочках."
 france_md.24.a: "Всё будет хорошо."
 france_md.25.t: "Положение непоколебимой Франции"
 france_md.25.d: "Социалистическая партия не смогла привести к власти левые идеалы, разрываясь между двумя своими течениями. Наша партия, «Непокорная Франция», является единственной подлинной левой оппозицией неолиберальному порядку. Именно из-за бездумных поисков компромиссов Социалистическая партия сама себя загубила, поэтому мы будем строить свою риторику на протесте, даже ценой негативной реакции СМИ. Наш главный проект — построение новой республики, положившей конец президентской монархии, которую мы терпели слишком долго. Наша партия добилась успеха среди молодежи, но мы не должны довольствоваться достигнутым, если хотим когда-нибудь править страной."
 france_md.25.a: "Другой мир возможен."
 france_md.26.t: "Положение «зелёных»"
 france_md.26.d: "Партия экологов во Франции существует с 1984 года, но она не добилась того успеха, на который мы надеялись. Нас никогда не воспринимают всерьез, и нашу электоральную базу практически невозможно найти за пределами городских центров. Если мы хотим заявить о себе, нам придется сотрудничать с другими партиями и адаптироваться к их взглядам. Но, учитывая состояние планеты, наше присутствие в Матиньоне в конечном итоге окажется логичным. Оказавшись там, мы будем стремиться изменить наш образ жизни и производства, чтобы обеспечить будущее для грядущих поколений. Препятствий много, но потенциальных союзников хватает."
 france_md.26.a: "Время на исходе."
 france_md.27.t: "Состояние Французской коммунистической партии"
 france_md.27.d: "Французская коммунистическая партия пала вместе с СССР, к которому она была прочно привязана. Никогда не бывает легко оказаться на проигравшей стороне. Наша ситуация более чем критическая: по мере того, как мы теряем доверие, наша рабочая электоральная база смещается в сторону крайне правых или воздерживается от голосования. Нам необходимо изменить эту тенденцию и найти новые способы завоевать их расположение. Несомненно, нам придется какое-то время вести переговоры с другими партиями, но, возможно, когда мы придем к власти, мы сможем вернуть доверие наших бывших избирателей и восстановить свою автономию. У нашей партии долгая история, и она не может остановиться сейчас."
 france_md.27.a: "Мы вернёмся."
 france_md.30.t: "Направление развития экономики"
 france_md.30.d: "Пришло время выбрать министра финансов. Наша страна остро нуждается в реформах, поэтому мы нашли двух кандидатов, которые должны соответствовать нашим ожиданиям в финансовой сфере. Первый – из наших рядов, человек по имени Оливье Ферран, который за свою карьеру в экономике хорошо освоил эту область. Второй – бывший финансовый инспектор, новичок в политике, и он поддержал нашу кампанию. Его социально-либеральное видение общества соответствует тому, каким мы хотим стать, и, возможно, его присутствие в правительстве обеспечит нам одобрение либерального блока."
 france_md.30.a: "Возрождение движения! Немедленно назначьте Эммануэля Макрона в Берси!"
 france_md.30.b: "Нет, нам лучше назначить кого-то, кому мы действительно доверяем. Назначьте Оливье Феррана."
 france_md.150.t: "Дополнительная помощь от Франции"
 france_md.150.d: "Французское правительство предложило нам дополнительную помощь в условиях финансового кризиса, который мы переживаем с момента вступления в Европейский союз. Стоит ли нам принять это предложение?"
 france_md.150.a: "Конечно, нам нужны деньги!"
 france_md.150.b: "Нет, нам это не нужно."
 france_md.151.t: "Франция предлагает провести международную встречу."
 france_md.151.d: "Французская социалистическая партия решила организовать встречу лидеров социалистов со всего мира и подумывает пригласить нас. Это могло бы помочь нам обрести легитимность. Стоит ли нам идти или вежливо отказаться?"
 france_md.151.a: "Мы там будем!"
 france_md.151.b: "Нет, у меня есть дела поважнее."
 france_md.160.t: "Распад Социалистической партии"
 france_md.160.d: "После года нестабильности и раскола внутри Социалистической партии она практически исчезла. Это исторический момент, но очень жаль видеть конец партии, сыгравшей столь важную роль в истории Франции. Для того, кто займет пост первого секретаря, задача будет непростой."
 france_md.160.a: "Были допущены ошибки."
 france_md.161.t: "Слеза продолжается"
 france_md.161.d: "Значительная часть наших членов и сторонников находится в процессе дистанцирования от нашей группы. Совершенно очевидно, что, если мы хотим избежать падения, нам придется использовать все имеющиеся в нашем распоряжении рычаги, чтобы сохранить поддержку политиков и общественности."
 france_md.161.a: "Не нужно терять ни минуты!"
 france_md.162.t: "Наша партия находится под угрозой."
 france_md.162.d: "Многочисленные непопулярные реформы, которые мы провели, несмотря на всеобщее неодобрение, вызвали гнев населения, которое задается вопросом, правильно ли они поступили, проголосовав за нас. Более того, наши многочисленные союзы с либеральным центром, которому мы пытались подражать, привели к многочисленным расколам внутри нашей партии. Наше левое крыло, разочарованное нашим выбором, грозится перейти на сторону радикальных левых, в то время как наше правое крыло считает нас слишком мягкими по сравнению с либеральными кандидатами, которым мы иногда помогали вопреки себе. Если еще есть шанс, нам придется усердно работать, чтобы его получить."
 france_md.162.a: "Черт возьми."
 france_md.163.t: "Кто виноват?"
 france_md.163.d: "После нашего краха часть наших избирателей перешла на сторону центристов, другие — к более левым формированиям, которые отстаивают свой «радикализм», называя себя «левыми-разрывателями», — позиция, вызывающая резкую критику в СМИ и объединяющая оппозицию против них. От того, с каким крылом мы сейчас будем бороться, будет зависеть, вернутся ли к нам когда-нибудь наши бывшие избиратели."
 france_md.163.a: "Экстремисты любого толка представляют опасность для нашего общества."
 france_md.163.b: "Это ничто по сравнению с опасностью, которую представляет собой крайний центр."
 france_md.164.t: "Франция предлагает провести совместные военные учения."
 france_md.164.d: "Французские дипломаты прислали нам предложение о совместных военных учениях. Действительно, недавний рост международной напряженности побуждает нас, европейских государств, объединиться для подготовки к худшему сценарию. Это может стать очень хорошей инициативой для подготовки наших вооруженных сил к конфликтам высокой интенсивности, которые могут вспыхнуть в любой момент. Что нам им сказать?"
 france_md.164.a: "Мы с удовольствием будем тренироваться вместе с ними."
 france_md.164.b: "Нет, спасибо, нам их помощь не нужна."
 france_md.165.t: "Приближается буря"
 france_md.165.d: "Несколько экспертов по различным вопросам уже некоторое время предлагают нам ввести регулирующие меры на случай экономического кризиса в любой точке мира. Это будет не первый и не последний подобный случай, но такие меры позволят нам дистанцироваться от осложнений, сопровождающих такие кризисы. Тем не менее, это будет означать регулирование экономического сектора и оплату труда множества экспертов для контроля за его деятельностью. Действительно ли мы хотим этого? Наши финансовые партнеры могут отреагировать негативно."
 france_md.165.a: "Ситуация действительно вызывает серьезную обеспокоенность; необходимо срочно принять регулирующие меры."
 france_md.165.b: "Это всего лишь предположения, которые, похоже, негативно скажутся на бизнесе."
 france_md.170.t: "Франция предлагает военные репарации"
 france_md.170.d: "Французское правительство решило выплатить нам компенсацию за кровопролитную войну в Индокитае, которая длилась 7 лет на нашей территории. Эти деньги никогда не заменят жизни 500 000 вьетнамцев, погибших за независимость, но это достойный жест, от которого нельзя отказываться."
 france_md.170.a: "Теперь ждём американцев."
 france_md.171.t: "Франция предлагает военные репарации"
 france_md.171.d: "Французское правительство, похоже, наконец-то согласилось признать некоторые преступления, совершенные в нашей стране, и предлагает компенсацию за войну за независимость. Эти деньги не заменят жизни 600 000 алжирцев, погибших за свободу, но раз уж западный человек признает свои преступления, было бы глупо ему отказывать."
 france_md.171.a: "В нужное время."
 france_md.172.t: "Франция предлагает свои экспертные знания в области ядерной энергетики."
 france_md.172.d: "Французское председательство предложило поделиться с нами своим опытом в области ядерной энергетики за небольшую сумму денег. Это могло бы оказаться весьма полезным для освоения этого нестабильного атома и его оптимального использования. Если мы примем это предложение, это могло бы значительно помочь просветить наших людей и облегчить исследования в этой области. Тем не менее, возможно, эти деньги стоило бы потратить на что-то другое, помимо предоставления Франции места, которого она не заслуживает в нашей стране."
 france_md.172.a: "Сделка по урану-235"
 france_md.172.b: "Нет, можете оставить свои бомбы замедленного действия при себе."
 france_md.173.t: "Франция предлагает свою защиту."
 france_md.173.d: "В условиях разразившегося в мире множества кризисов Франция решила гарантировать защиту своим европейским союзникам. Более того, сегодня утром французское председательство заверило нас, что в случае агрессии со стороны какой-либо европейской державы оно без колебаний вмешается, даже прибегнув к применению ядерного оружия. Хотя эта защита сама по себе является потерей суверенитета, она может оказаться решающей в такие времена."
 france_md.173.a: "Осторожность никогда не бывает лишней."
 france_md.173.b: "Нам не нужна их защита."
 france_md.175.t: "Европейский союз вводит против нас санкции"
 france_md.175.d: "В связи с нашей недавней позицией и желанием выйти из договоров, связывающих нас с государствами-членами, эти проклятые европейские бюрократы наложили на нас штраф. Тем не менее, ничто не обязывает нас его платить; наши избиратели, жаждущие перемен, даже воспримут это как признак слабости или предательства. Однако отказ от уплаты может навредить нашим отношениям с государствами-членами Европейского союза и спровоцировать санкции против нас. Стоит ли нам идти до конца?"
 france_md.175.a: "Мы заплатим штраф, потому что играем по правилам; именно следуя правилам, мы добьемся успеха."
 france_md.175.b: "И что ещё? Нас уже достаточно выжали досуха."
 france_md.180.t: "Историческое голосование"
 france_md.180.d: "Народ высказался. После долгих кампаний за «Фрексит» и избежав ловушек этих проклятых европеистов, а также этих мерзких популистов, пытавшихся присвоить наши успехи, мы сделали это. Франция покидает Европу как можно быстрее. Конечно, эти брюссельские змеи не упустят возможности заставить нас заплатить как можно больше, но эти санкции — ничто по сравнению с той свободой, которую мы обрели."
 france_md.180.a: "Франция свободна сейчас и навсегда."
 france_md.181.t: "Франция выходит из Европейского союза"
 france_md.181.d: "После многочисленных кампаний евроскептической дезинформации французскому националистическому движению наконец-то удалось склонить Францию ​​к выходу из ЕС (Frexit). Выход Франции — лишь вопрос времени; тем не менее, столь быстрый уход такого основополагающего и структурного члена ЕС весьма серьезен."
 france_md.181.a: "Мы должны проявлять осторожность перед лицом популизма."
 france_md.182.t: "Франция признает наши претензии"
 france_md.182.d: "Французское правительство недавно заявило о своей поддержке нашей позиции в отношении различных территорий, исторически принадлежавших нам и отнятых у нас. Они также предложили начать военное сотрудничество между нашими двумя странами; пока что речь идёт только о предоставлении доступа к нашей военной инфраструктуре. Эта внезапная французская поддержка приветствуется, но действительно ли мы должны позволять им пользоваться нашей инфраструктурой?"
 france_md.182.a: "Конечно, они нас поддерживают; им рады."
 france_md.182.b: "Мы никогда не просили их о помощи; пусть держатся подальше."
 france_md.183.t: "Франция предлагает углубить наше сотрудничество."
 france_md.183.d: "После того, как Париж занял ряд выгодных для нас позиций и заявил о явном неприятии НАТО, он предложил нам углубить сотрудничество, от экономических связей до полномасштабного военного союза против наших общих врагов. Можем ли мы действительно доверять западным странам, которые так быстро предали своих прежних союзников?"
 france_md.183.a: "Я возьму три ящика этих духов; договорились."
 france_md.183.b: "Что бы вы предпочли для тренировок: дюны Сахеля или наши заснеженные степи? Наши армии станут только сильнее."
 france_md.183.c: "Они могут остаться одни."
 france_md.184.t: "Москва соглашается на экономическое сотрудничество"
 france_md.184.d: "Ответ Москвы не заставил себя долго ждать; от этого соглашения выиграют обе наши экономики. Помимо открытия значительного рынка для нашей продукции класса люкс и высокотехнологичных товаров, наши отрасли, нуждающиеся в сырье, почувствуют себя более уверенно. Это историческое соглашение — настоящая удача для нас и гвоздь в гроб Европейского союза. Мы, создавшие его, теперь торгуем с его злейшим врагом."
 france_md.184.a: "Пусть шампанское и масло льются рекой"
 france_md.185.t: "Москва принимает экономическое и военное сотрудничество."
 france_md.185.d: "Ответ Москвы не заставил себя долго ждать; от этого соглашения выиграют как наши экономики, так и армии. Помимо открытия значительного рынка для нашей продукции класса люкс и высокотехнологичной продукции, наши отрасли, нуждающиеся в сырье, почувствуют себя более уверенно. Более того, укрепление сотрудничества между нашими вооруженными силами позволит нам получить опыт на новых театрах военных действий и воспользоваться их технологическими и стратегическими достижениями. Это историческое соглашение — настоящая находка для нас и гвоздь в гроб НАТО. Теперь у нас есть надежный партнер, с которым мы сможем пройти через это новое тысячелетие."
 france_md.185.a: "Мы еще встретимся в Сахеле, но на этот раз не для того, чтобы воевать друг с другом."
 france_md.187.t: "Россияне срывают переговоры"
 france_md.187.d: "Несмотря на все усилия наших дипломатов, им не удалось достичь соглашения со своими российскими коллегами. Как будто у них не было желания вести с нами дела. Это прискорбно; потенциал двустороннего соглашения был бы бесценен для наших двух стран. Также не исключено, что наши бывшие западные друзья оказывали давление, чтобы мы оставались под их контролем. Но это не критично; мы найдем других партнеров."
 france_md.187.a: "Американская раковая опухоль, таким образом, достигла Урала; лучше в одиночестве, чем в плохой компании."
 france_md.188.t: "Франция требует уступок"
 france_md.188.d: "После победы популизма во Франции и выхода страны из Европейского союза, она продолжает демонстрировать свою враждебность по отношению к нам. Экономические санкции, введенные после ее выхода, не оставили ее в покое; теперь она завершила восстановление и требует репараций. Сегодня прибыли дипломаты, угрожающие перекрыть доступ на ее территорию, если мы не повлияем на Европейский банк с целью снижения процентных ставок по ее долгу. Последствия этой потери доступа на ее территорию могут значительно осложнить обмены внутри Европейского союза. Тем не менее, уступив их шантажу, мы будем вынуждены использовать наши преимущества во вред."
 france_md.188.a: "Да будут они прокляты; мы предпочтём меньший вред."
 france_md.188.b: "Мы не поддадимся шантажу нескольких популистов."
 france_md.189.t: "Германия уступает нашим уступкам"
 france_md.189.d: "Под давлением, которое мы на них оказали, немецкое правительство неохотно согласилось оказать давление на ЕЦБ с целью снижения наших процентных ставок. Это грозная месть нашим бывшим мучителям. Эти немцы могут и дальше наслаждаться нашими круговыми развязками, но благодаря им мы едим за счет Брюсселя."
 france_md.189.a: "Око за око, зуб за зуб (по возможности на латыни)."
 france_md.190.t: "Германия отклонила наши требования"
 france_md.190.d: "Наши дипломаты вернулись из Берлина с пустыми руками, отвергнутые нашими немецкими коллегами. Возможно, наши требования были слишком высоки, или же они намерены искать компромисс не с нами. Мы не сможем отомстить Европейскому союзу сегодня, но и ждать не стоит."
 france_md.190.a: "Мы остаёмся свободными, а они — нет; закройте границы на восток."
 france_md.191.t: "Франция требует уступок"
 france_md.191.d: "После победы популизма во Франции и выхода страны из Европейского союза, она продолжает демонстрировать свою враждебность по отношению к нам. Экономические санкции, введенные после ее выхода, не оставили ее в покое; теперь она завершила восстановление и требует компенсации. Сегодня прибыли дипломаты, угрожающие перекрыть доступ на ее территорию, если мы не заменим их морскую и береговую полицию в операциях по задержанию мигрантов. Последствия этой потери доступа на их территорию могут значительно осложнить обмены внутри Европейского союза. Тем не менее, уступив их шантажу, мы будем вынуждены использовать наши преимущества во вред."
 france_md.191.a: "Да будут они прокляты; мы предпочтём меньший вред."
 france_md.191.b: "Мы не поддадимся шантажу нескольких популистов."
 france_md.192.t: "Италия уступает нашим уступкам"
 france_md.192.d: "Под давлением, которое мы на них оказали, итальянское правительство неохотно согласилось заменить нашу полицию на морских границах. Это грозная месть нашим бывшим мучителям. Эти итальянцы будут рады потоку мигрантов, но благодаря им мы будем питаться за счет Брюсселя."
 france_md.192.a: "Око за око, зуб за зуб (по возможности на латыни)."
 france_md.193.t: "Италия отклонила наши требования"
 france_md.193.d: "Наши дипломаты вернулись из Рима с пустыми руками, отвергнутые нашими латинскими соседями. Возможно, наши требования были слишком высоки, или же они намерены искать компромисс не с нами. Мы не сможем отомстить Европейскому союзу сегодня, но и ждать не стоит."
 france_md.193.a: "Мы остаёмся свободными, а они — нет; закройте границы на юго-востоке."
 france_md.194.t: "Франция требует уступок"
 france_md.194.d: "После победы популизма во Франции и выхода страны из Европейского союза, она продолжает демонстрировать свою враждебность по отношению к нам. Экономические санкции, введенные после ее выхода, не оставили ее в покое; теперь она завершила восстановление и требует репараций. Сегодня прибыли дипломаты, угрожающие перекрыть доступ на ее территорию, если мы не будем использовать расположенные у нас институты в их целях. Они просят нас влиять на решения европейских институтов и их разведывательных служб. Последствия этой потери доступа на их территорию могут значительно осложнить обмены внутри Европейского союза. Тем не менее, уступив их шантажу, мы будем вынуждены использовать наши преимущества во вред."
 france_md.194.a: "Да будут они прокляты; мы предпочтём меньший вред."
 france_md.194.b: "Мы не поддадимся шантажу нескольких популистов."
 france_md.195.t: "Бельгия уступает нашим уступкам"
 france_md.195.d: "Вследствие оказанного нами давления бельгийское правительство согласилось оказать давление на европейские институты в нашу пользу. Это грозная месть нашим бывшим мучителям. Эти бельгийцы будут рады работать сверхурочно в парламенте, и благодаря им мы будем питаться за счет Брюсселя."
 france_md.195.a: "Око за око, зуб за зуб (по возможности на латыни)."
 france_md.196.t: "Бельгия отклонила наши требования"
 france_md.196.d: "Наши дипломаты вернулись из Брюсселя с пустыми руками, отвергнутые нашими валлонскими и фламандскими братьями. Возможно, наши требования были слишком высоки, или же они намерены искать компромисс не с нами. Мы не собираемся мстить Европейскому союзу сегодня, но и ждать не стоит."
 france_md.196.a: "Мы остаёмся свободными, а они — нет; закройте границы с севером."
 france_md.197.t: "Франция требует уступок"
 france_md.197.d: "После выхода из Европейского союза и восстановления после введенных санкций Франция продолжает демонстрировать свою враждебность по отношению к нам. Сегодня ее дипломаты прибыли с угрозами перекрыть доступ на французскую территорию, если мы не предоставим подробный реестр банковских счетов, открытых на нашей территории, что является серьезным нарушением банковской тайны, которую мы стремимся сохранить. Потеря этого доступа осложнит нашу торговлю в рамках Союза, но уступка сделает нас соучастниками их шантажа."
 france_md.197.a: "Да будут они прокляты; мы предпочтём меньший вред."
 france_md.197.b: "Мы не поддадимся шантажу нескольких популистов."
 france_md.198.t: "Люксембург уступает нашим уступкам"
 france_md.198.d: "Вследствие оказанного нами давления правительство Люксембурга согласилось оказать давление на свои банковские службы, чтобы те предоставили нам подробный реестр принадлежащих им счетов. Мы обнаружили множество предателей, пытавшихся уклониться от своих обязанностей, а также информацию о многих частных компаниях, расположенных на территории нашей страны. Эти открытия помогут налоговой службе в борьбе с недобросовестными патриотами и в привлечении к ответственности компаний, пытавшихся обмануть нас в нашей стране. Люксембургцы, возможно, сильно потеряли доверие в банковской сфере, но благодаря им мы едим за счет Брюсселя и за счет их проклятой свободной торговли."
 france_md.198.a: "Око за око, зуб за зуб (по возможности на латыни)."
 france_md.199.t: "Люксембург отклонил наши требования"
 france_md.199.d: "Наши дипломаты вернулись из Люксембурга с пустыми руками, отвергнутые нашими соседями-миллионерами. Возможно, наши требования были слишком высоки, или же они намерены искать компромисс не с нами. Мы не сможем отомстить Европейскому союзу сегодня, но и ждать не стоит."
 france_md.199.a: "Мы остаёмся свободными, а они — нет; закройте границы на северо-востоке."
 france_md.200.t: "Франция требует уступок"
 france_md.200.d: "После выхода из Европейского союза и восстановления после введенных санкций Франция продолжает демонстрировать свою враждебность по отношению к нам. Сегодня прибыли ее дипломаты, угрожая перекрыть доступ на французскую территорию, если мы не окажем помощь их сельскохозяйственному сектору, который развивает на юге цитрусовый проект, напрямую конкурирующий с нашим. Потеря этого доступа осложнит нашу торговлю в рамках Союза, но уступка сделает нас соучастниками их шантажа."
 france_md.200.a: "Да будут они прокляты; мы предпочтём меньший вред."
 france_md.200.b: "Мы не поддадимся шантажу нескольких популистов."
 france_md.201.t: "Испания уступает нашим уступкам"
 france_md.201.d: "Вследствие оказанного нами давления испанское правительство согласилось предоставить нам техническую и коммерческую помощь в производстве и продаже нашей новой линейки цитрусовых, которая наводнит французский и испанский рынки. Возможно, теперь испанцам остается только кусать пальцы, но благодаря им мы едим за счет Брюсселя и продемонстрировали свое продовольственное превосходство на континенте."
 france_md.201.a: "Око за око, зуб за зуб (по возможности на латыни)."
 france_md.202.t: "Испания отклонила наши требования"
 france_md.202.d: "Наши дипломаты вернулись из Мадрида с пустыми руками, отвергнутые нашими иберийскими соседями. Возможно, наши требования были слишком высоки, или же они намерены искать компромисс не с нами. Мы не сможем отомстить Европейскому союзу сегодня, но и ждать не стоит."
 france_md.202.a: "Мы остаёмся свободными, а они — нет; закройте границы на юго-западе."
 france_md.203.t: "Конец путешествия"
 france_md.203.d: "После нескольких месяцев диалога и борьбы за содержание текст конституционной реформы наконец готов к голосованию. Наши политические оппоненты, возможно, использовали процесс разработки, чтобы включить в него положения, служащие их собственным идеалам, но отказ народу в праве голоса после столь длительного процесса заставил бы его почувствовать себя по праву преданным. Проведение референдума – это исключительно наше решение, согласно статье 11 конституции, и только мы будем отвечать за последствия."
 france_md.203.a: "Пора положить этому конец; я призываю к проведению референдума."
 france_md.203.b: "Этот текст слишком опасен, и за него нельзя голосовать."
 france_md.204.t: "Текст проходит"
 france_md.204.d: "Сегодня исторический день; впервые весь народ участвует в разработке конституции. Результат голосования неудивителен – подавляющая победа «за»; конечно, когда вы даете французу право решать за себя, он не станет себя лишать этого права. Этот текст, возможно, не идеален, но он отражает новую эру, начинающуюся сегодня, и мы сделали все возможное, чтобы он защищал права наших граждан, не позволяя народу поддаться соблазнам наших политических противников. На этом заканчивается Пятая республика, и этим откровенным и массовым «да» начинается Шестая республика."
 france_md.204.a: "День славы настал."
 france_md.205.t: "Текст в значительной степени отвергнут."
 france_md.205.d: "Вопреки всем ожиданиям, конституционная реформа, которую мы планировали месяцами, была отклонена на выборах. Возможно, наше участие в формировании дискуссий заставило людей подумать, что мы пытаемся ими манипулировать, или, возможно, наши граждане хотели перемен, но так и не пришли к согласию относительно того, какую форму они должны принять. Не всё потеряно: мы всё ещё можем добиваться реализации нашего видения республики, принимая законы один за другим, но масштабная реформа, на которую мы надеялись, должна подождать."
 france_md.205.a: "Совершенно непонятно"
 france_md.206.t: "Дискуссия об институтах, часть 1"
 france_md.206.d: "Вопрос об институтах разделяет Францию ​​со времен основания Пятой республики в 1958 году, когда президентская власть заменила нестабильность Четвертой республики. Сейчас эта власть рассматривается как чрезмерная, позволяющая президенту со злыми намерениями блокировать прогресс практически без контроля, в то время как более представительное Национальное собрание обладает лишь незначительной исключительной властью. Сейчас на повестке дня стоит вопрос о пересмотре этой устаревшей конституции, и от того, насколько далеко мы зайдем, будет зависеть, вернется ли власть в руки парламента или останется в руках президента."
 france_md.206.a: "Вполне практично не находиться постоянно под угрозой со стороны собрания."
 france_md.206.b: "Долой президентскую республику! Президент торжественно откроет церемонию вручения хризантем."
 france_md.206.c: "Давайте сосредоточимся на содействии активному участию граждан."
 france_md.207.t: "Триумф компромисса"
 france_md.207.d: "После нескольких дней обсуждений граждане, похоже, пришли к согласию относительно перераспределения властей. Статья 49.3, естественно, стала первой мишенью народного гнева. Президентские полномочия были ограничены, и народ, похоже, доволен их работой. Демократический переворот теперь кажется менее вероятным; наши институты приобретают легитимность и эффективность. Мы можем лишь сожалеть о небольшом разочаровании наших самых преданных сторонников, которым мы обещали положить конец президентской монархии. Как бы мы ни думали, народ принял решение; теперь мы можем обратить внимание на следующие дебаты."
 france_md.207.a: "Отлично, следующий вопрос! Мой офис справился с этим довольно хорошо."
 france_md.208.t: "Конец президентской диктатуры"
 france_md.208.d: "Граждане наконец пришли к согласию: Пятая республика накопила слишком много недовольства из-за злоупотреблений президентских решений, и мы больше не можем рисковать тем, что такая огромная власть сосредоточена в руках одного человека. Полномочия президента теперь ограничены полномочиями главнокомандующего и церемониальной фигурой в Елисейском дворце, в то время как Национальное собрание вновь становится всемогущим. Реформы могут потерять некоторую стабильность, но они будут продвигаться гораздо легче, и благодаря этому доверие французов к нашим институтам должно возрасти."
 france_md.208.a: "Пусть будет так; пусть дебаты продолжаются."
 france_md.209.t: "Дискуссии об институтах. Часть 2:"
 france_md.209.d: "По мере завершения институциональных дебатов один вопрос разделяет наших граждан: надзор за секретными службами, подотчетными президенту. Эти службы долгое время защищали французские интересы, но прошлые злоупотребления, включая убийства Ориоля в 1981 году, и их свобода действовать вне закона вызывают опасения по поводу прозрачности. Большая открытость укрепила бы доверие к нашим институтам, но наша безопасность во все более нестабильном мире не может быть легкомысленной."
 france_md.209.a: "Безопасность наших граждан превыше всего! Мы просто позаботимся о том, чтобы их частная жизнь не подвергалась слишком большой опасности."
 france_md.209.b: "Народу нужна прозрачность! Народу нужна справедливость; государство должно отвечать перед своими гражданами."
 france_md.209.c: "Эта дискуссия вызывает слишком много напряжения; нам лучше держаться от нее подальше."
 france_md.210.t: "Секретные службы остались невредимы."
 france_md.210.d: "Граждане решили оставить секретные службы под контролем исполнительной власти. Действительно, особенно в наше время, наша пассивная оборона должна быть на передовой, чтобы защитить нас от злонамеренных действий из-за рубежа и от терроризма. Тем не менее, этот результат разочаровал наших активистов, которые хотели большей прозрачности и демократии. Многие наши граждане по-прежнему считают, что оборона нашей страны не должна достигаться ценой их частной жизни в мирное время. Некоторые также опасаются злоупотребления этими службами со стороны недобросовестных правительств для слежки за оппозицией или предотвращения утечек информации в адрес оппозиции. Избиратели сделали свой выбор, и они выбрали безопасность вместо свободы. В конце концов, это их выбор."
 france_md.210.a: "Сейчас просто неподходящее время ослаблять бдительность в мире, где сила возобладала над международным правом."
 france_md.211.t: "Занавес поднят"
 france_md.211.d: "После напряженных переговоров мы наконец решили положить конец полной непрозрачности наших спецслужб. Многие граждане больше не чувствовали себя в безопасности, зная, что за ними постоянно ведется наблюдение без их ведома, а наши зарубежные интервенции часто вызывают споры, о которых они предпочли бы не узнавать из газет. Эта новая прозрачность должна укрепить доверие наших граждан к полиции и вооруженным силам, даже если это будет стоить нам некоторой внутренней безопасности и внешнего влияния."
 france_md.211.a: "Нам не нужны спецслужбы для защиты от иностранного вмешательства."
 france_md.212.t: "Дискуссия о личных правах. Часть 1:"
 france_md.212.d: "Вопрос о личных правах лежит в основе конституционных дебатов. Следует ли нам укреплять индивидуальные свободы в противовес государству или отдавать приоритет коллективной безопасности? Дискуссии сосредоточены на защите персональных данных, праве на неприкосновенность частной жизни и пределах государственного надзора. Прогрессисты выступают за расширение основных прав, в то время как консерваторы опасаются ослабления государственной власти. Наша позиция по этому вопросу частично определит направление новой конституции."
 france_md.212.a: "Твердо защищайте индивидуальные свободы."
 france_md.212.b: "Приоритет должен отдаваться коллективной безопасности."
 france_md.212.c: "Пусть дискуссия продолжится без нашего участия."
 france_md.213.t: "Победа за индивидуальные свободы"
 france_md.213.d: "Дискуссия завершилась решением в пользу укрепления индивидуальных свобод. Новая конституция гарантирует усиленную защиту от вмешательства государства в частную жизнь граждан. Эта победа прогрессистов знаменует собой поворотный момент в наших отношениях с государственной властью, даже если некоторые опасаются последствий для национальной безопасности."
 france_md.213.a: "Наши граждане могут радоваться этим новым гарантиям."
 france_md.214.t: "Безопасность побеждает"
 france_md.214.d: "Несмотря на усилия защитников свободы, в конституционных дебатах победила концепция, ориентированная на безопасность. Государство сохранит широкие полномочия по слежке и вмешательству. Хотя это успокаивает часть населения, правозащитники осуждают это как шаг назад в развитии демократии."
 france_md.214.a: "Стабильность имеет свою цену."
 france_md.215.t: "Дискуссия о личных правах. Часть 2:"
 france_md.215.d: "Наша страна известна своими беспорядками, и независимо от результатов выборов, недовольство в конечном итоге выходит на улицы. Вопрос защиты граждан во время протестов сейчас стоит на повестке дня: с одной стороны, превышение полномочий полицией, с другой – недостаточная защита, многие протесты заканчиваются травмами. Ограничение действий полиции восстановит доверие общественности, но повлечет за собой дополнительные расходы, в то время как поддержка полиции сохранит порядок, но создаст риск новых инцидентов по мере радикализации движений."
 france_md.215.a: "Мы должны регулировать деятельность наших полицейских сил."
 france_md.215.b: "Пусть они выполняют свою работу."
 france_md.215.c: "Решать народу; в конце концов, они выйдут на улицы, протестуя против этого закона."
 france_md.216.t: "Народ выбирает ограничить деятельность полиции."
 france_md.216.d: "После многочасовых дебатов большинство согласилось с тем, что необходимо регулировать деятельность полиции для предотвращения новых скандалов. Технологии обеспечения правопорядка совершенствуются, и мы уже являемся весьма эффективной страной в этом отношении; нет необходимости двигаться дальше. Более того, предотвращение серьезных физических травм среди протестующих, безусловно, сократит расходы на здравоохранение. Государству также придется больше отвечать перед своим народом, поскольку оно сможет проводить протесты на улицах с меньшим риском для жизни. Однако следует ожидать дополнительных расходов для полиции, поскольку эффективность правоохранительных органов снизится."
 france_md.216.a: "Значит, наши люди будут и дальше держать нас в узде. Следующий вопрос!"
 france_md.217.t: "Народ выбирает порядок"
 france_md.217.d: "Даже если это не то, чего мы хотели бы, эффективность полиции одержала верх. Правда, некоторые протесты перерастают в массовые беспорядки и приводят к значительному материальному ущербу, поэтому внешний контроль необходим, учитывая снижение эффективности правоохранительных органов. Мы сталкиваемся с беспрецедентными бюджетными и социальными кризисами; в какой-то момент нам придется настроить против нас часть людей. Поэтому остается важным уметь противостоять любому общественному движению. В конце концов, они же нас избрали, не так ли?"
 france_md.217.a: "Народ выбрал безопасность, а не право привлекать нас к ответственности; можем ли мы их за это винить? Следующий вопрос."
 france_md.218.t: "Дискуссия об экономике, часть 1"
 france_md.218.d: "Хотя управление экономикой ляжет на плечи будущих правительств, мы можем уже сейчас закрепить в конституции социальные, экологические или экономические основы, сделав неконституционными законы, нарушающие их. Приоритет социальной защиты обеспечивает рабочие места и благосостояние, но может привести к отставанию в вопросах экологии и вызвать беспокойство у инвесторов из-за возникшего долга. Приоритет экологии улучшает качество жизни и направляет нас к новым источникам энергии, но при этом оставляет часть доходов и инвестиций без внимания. Мы также можем притворно поддерживать экономику, чтобы посеять раздор с другими фракциями, или полностью оставить этот вопрос на их усмотрение."
 france_md.218.a: "Социальная поддержка превыше всего! Мы должны поддерживать наших граждан."
 france_md.218.b: "Состояние планеты ухудшается слишком быстро, чтобы мы могли сидеть сложа руки."
 france_md.218.c: "Хорошая идея; мы заставим их думать, что за этим стоят либералы."
 france_md.218.e: "Пусть другие партии разнесут друг друга в пух и прах из-за этого вопроса."
 france_md.219.t: "Люди предпочитают отдавать приоритет социальной поддержке."
 france_md.219.d: "После долгих часов раздумий граждане наконец пришли к согласию относительно социальной составляющей республики. Действительно, защищая простых людей и их рабочие места, мы обеспечим здоровый переход к лучшему будущему. Более того, лучше, чтобы наши заводы строились в соответствии со стандартами и загрязняли окружающую среду здесь, а не переносились в страны, менее обеспокоенные этим вопросом. Этот результат не является ни неожиданностью, ни плохой новостью."
 france_md.219.a: "Ещё один вопрос, на который мы смогли дать ответ; отлично."
 france_md.220.t: "Люди выбирают экологию"
 france_md.220.d: "Этот результат нас не расстраивает. Напротив, здоровье планеты положительно сказывается на здоровье её обитателей. Поэтому неудивительно и даже полезно, что это пробуждение произошло на разных уровнях общества. Таким образом, нам придётся научиться трансформировать наш образ жизни, производство товаров и энергии. Путь будет усеян препятствиями и не всегда будет отвечать интересам большинства. Но это тот путь, по которому мы должны идти."
 france_md.220.a: "Остается лишь перенаправить на переработку тех, кто голосовал за крупный бизнес."
 france_md.221.t: "Народ выбирает экономику"
 france_md.221.d: "Удивительный результат сегодняшних дебатов. Таким образом, народ выбрал защиту бизнеса всех видов, чтобы обеспечить развитие страны. Видно, что некоторые всё ещё верят в теорию «просачивания благ сверху вниз». Можно было также предположить, что, поскольку СМИ часто находятся в руках нескольких олигархов, они сделают всё возможное, чтобы склонить чашу весов в свою пользу. Довольно разочаровывающий день для наших активистов. Но теперь мы не можем ставить под сомнение мнение суверенного народа."
 france_md.221.a: "Действительно ли было хорошей идеей спрашивать мнение людей?"
 france_md.222.t: "Дискуссия об экономике, часть 2."
 france_md.222.desc: "Другие социальные вопросы отложатся до будущих республик, но мы можем определить конституционное направление уже сейчас: кто должен оплачивать наше исключительное, но дорогостоящее социальное обеспечение? Какое бы решение ни приняла эта реформа сейчас — в отношении налогообложения, финансирования бюджета или сокращения расходов — оно сформирует финансовую основу нашего государства всеобщего благосостояния на многие поколения."
 france_md.222.a: "Долой капитализм!"
 france_md.222.b: "Государство профинансирует эту систему; мы сделаем все возможное, чтобы избежать введения новых налогов."
 france_md.222.c: "Мы не можем рисковать тем, что наши граждане останутся без работы."
 france_md.222.d: "Нам было бы лучше не вмешиваться в эту дискуссию."
 france_md.223.t: "Народ выбирает облагать налогом капитал."
 france_md.223.d: "Долгие дебаты последних недель завершились нашей победой в этом идеологическом противостоянии. Именно капитал и доходы самых богатых будут финансировать социальное обеспечение населения. Этот символический акт знаменует собой великую победу народа над крупным капиталом. Победа Франции над финансами — это победа всего народа, объединенного против своих бывших хозяев. Наши экономические дебаты на данный момент завершены, но мы подготовили почву для будущих поколений. Таким образом, всего несколькими реформами мы совершили революцию."
 france_md.223.a: "Великая победа французского народа."
 france_md.224.t: "Народ подтверждает роль государства"
 france_md.224.d: "Итог дебатов прошлой недели ясен: народ не хочет переворачивать экономику в ее нынешнем состоянии. Связано ли это с неолиберальной пропагандой, которой его ежедневно бомбардируют по телевидению? Вероятно, но мы должны принять их вердикт, потому что это единственный вердикт, который имеет значение. По крайней мере, нам удалось не поощрять сокращение других государственных услуг для финансирования этой, но возможно, что наши преемники будут менее благосклонны к обществу ради финансирования нашей системы. Мы позаботимся о том, чтобы этого не произошло."
 france_md.224.a: "Это не совсем та победа, на которую мы надеялись, но придется довольствоваться тем, что есть."
 france_md.225.t: "Люди предпочитают сокращать расходы в других местах."
 france_md.225.d: "Если бы мы знали, каким будет вердикт, возможно, мы бы не выносили эту дискуссию на голосование, но думать об этом уже поздно. Действительно, народ только что решил судьбу нашей социальной системы. Он рекомендовал будущим законодательным собраниям сохранить основные государственные услуги, но сократить другие государственные расходы. Их основной целью, вероятно, станут государственные служащие и многие субсидии, которые они не считают необходимыми. Система социальной защиты будет финансироваться, но мы только что оправдали проникновение «волка либерализма» в государственные счета. Пока мы у власти, мы сможем этому помешать, но кто знает, что предпримут будущие правительства."
 france_md.225.a: "Эта конституционная реформа идёт не совсем по плану."
 france_md.226.t: "Дискуссия по социальным вопросам. Часть 1:"
 france_md.226.d: "Французская система интеграции меньшинств долгое время основывалась на идеале «плавильного котла», республиканской системе образования и меритократии, но этот принцип демонстрирует свои ограничения: снижение социальной мобильности подпитывает безработицу и межобщинную деградацию. Сейчас дискуссия сосредоточена на реформировании этой системы. Продвижение более инклюзивной модели рискует подорвать устоявшиеся на протяжении поколений рамки, но оставление их без изменений лишь дает нашим оппонентам возможность, наоборот, ужесточить их. В любом случае, наш выбор здесь определит будущее страны на многие поколения вперед."
 france_md.226.a: "Для того чтобы как можно больше людей могли жить лучше, система должна быть более инклюзивной."
 france_md.226.b: "Пусть граждане сами решат этот вопрос."
 france_md.227.t: "Люди выбирают адаптировать систему."
 france_md.227.d: "Результаты дебатов, похоже, склоняются к адаптации существующей системы к многообразию, присущему нашему новому тысячелетию. Нам, безусловно, потребуется инвестировать ресурсы, но, обеспечивая такую ​​инклюзивность, наша система не лишится новых талантов, прибывающих в нашу страну. Предоставляя каждому доступное будущее, мы способствовали умиротворению, одновременно благоприятствуя нашему долгосрочному развитию."
 france_md.227.a: "Нам есть чему поучиться у других."
 france_md.228.t: "Народ выбирает ужесточение существующей системы."
 france_md.228.d: "Несмотря на наши усилия, похоже, что современное общество не готово подвергнуть сомнению фундаментальные основы нашей республики. Французская система интеграции, по-видимому, по-прежнему имеет светлое будущее. Это голосование подтверждает привязанность французов к системе, которая, несмотря на свои недостатки, имеет то преимущество, что существует. Эту систему всегда можно реформировать в долгосрочной перспективе, но мы упустили возможность разрушить еще одну крепость."
 france_md.228.a: "Жаль"
 france_md.229.t: "Дискуссия по социальным вопросам. Часть 2:"
 france_md.229.d: "Свобода вероисповедания — один из самых острых вопросов нашего тысячелетия. Со времен законов о секуляризме Третьей республики Франция яростно защищает ее, даже ценой собственных свобод граждан, прежде всего посредством запрета на религиозные символы в государственных начальных школах — правила, которое все чаще оказывается в центре напряженных национальных дебатов. Ослабление этой правовой базы могло бы умиротворить отношения между общинами, но это означает постановку под сомнение основополагающего закона, который наши граждане высоко ценят."
 france_md.229.a: "Наше общество должно адаптироваться к потребностям религиозных общин в признании."
 france_md.229.b: "Пусть граждане сами решат этот вопрос."
 france_md.230.t: "Народ решил ослабить секуляризм."
 france_md.230.d: "Дискуссии о секуляризме завершились в пользу смягчения существующей правовой базы. Ношение религиозных символов в конечном итоге станет нормой в большем количестве мест, чем раньше. Различные конфессии также получат право на большее представительство в обществе, сохраняя при этом приоритет государства и его независимость от религии. Это победа, потому что нам удалось сохранить лучшие черты нашей старой системы, обеспечив при этом смягчение наиболее спорных её аспектов. Мы можем только надеяться, что это нарушение этого основополагающего закона не приведет к постепенному пересмотру этой защитной основы свободы вероисповедания. В этом вопросе мы можем доверять нашим преемникам."
 france_md.230.a: "Всё должно пройти хорошо."
 france_md.231.t: "Народ принял решение ужесточить закон о секуляризме."
 france_md.231.d: "Мы не ожидали, что начало дискуссии о секуляризме приведет к созданию более строгой системы, чем та, которая у нас была. Это был риск, на который стоило пойти, и мы его приняли. Теперь религиозные символы будут еще менее терпимы в государственных учреждениях. Предвидели ли наши предки, что мы зайдем так далеко в этом направлении? Мы здесь, и мы увидим, к чему приведут эти изменения. Несомненно одно: наш идеал толерантности кажется нам дальше, чем когда-либо."
 france_md.231.a: "По крайней мере, свобода совести по-прежнему гарантирована."
 france_md.235.t: "Строим Республику Завтрашнего Дня"
 france_md.235.d: "Теперь, когда наш мандат вступил в силу, настало время воплотить в жизнь наше самое долгожданное обещание: Шестую республику. Эта новая республика, которую мы хотим обсуждать, а не навязывать, займет наших граждан на долгие месяцы, пока они будут закладывать основы общества завтрашнего дня. Иногда нам, возможно, придется направлять дискуссию, чтобы она не зашла в тупик, но чрезмерная вовлеченность рискует подорвать доверие народа. Этот проект должен быть доведен до конца, и достаточно быстро, чтобы никогда не создавалось впечатление, что мы затягиваем саму демократию."
 france_md.235.a: "Пятая Республика переживает свои последние мгновения"
 france_md.236.t: "Шестая республика потерпела неудачу"
 france_md.236.d: "Уже несколько недель площадки для дебатов пустуют, и проект Шестой Республики застопорился не из-за войны или кризиса, а из-за банального отсутствия интереса. Слишком долго организуя дебаты и учитывая предложения наших граждан, мы позволили угаснуть народному энтузиазму, который мы мобилизовали. Наш шанс изменить систему ускользает. Мы еще можем продвинуть часть этой работы в качестве обычных реформ, но без того масштаба, на который мы надеялись, и мы не смогли исправить несправедливость, заложенную в нашей конституции, высшем законе страны."
 france_md.236.a: "Мы упустили возможность изменить систему."
 france_md.238.t: "Франция вводит против нас эмбарго."
 france_md.238.d: "Франция объявила о полном эмбарго против нас, охватывающем все, от поставок материалов до обычной торговли. После избрания партии «Непокорная Франция» Париж ужесточил риторику в отношении нас по палестинскому вопросу, обвиняя наше правительство в разжигании конфликта в регионе, и теперь перешел к прямому эмбарго против нас. Хуже того, они лоббируют остальную Европу, чтобы та последовала их примеру. Наши европейские торговые партнеры имеют важнейшее значение, и мы не можем позволить этой кампании увенчаться успехом."
 france_md.238.a: "Они вряд ли убедят многих людей."
 france_md.239.t: "Франция просит нас ввести эмбарго в отношении Государства Израиль."
 france_md.239.d: "После решения Франции ввести эмбарго против государства Израиль французские дипломаты обратились к нам с призывом последовать их примеру. В качестве оправдания они приводят агрессивную политику государства Израиль по отношению к своим соседям, вызванную этим дестабилизацию региона и гуманитарную ситуацию. Эти аргументы не лишены оснований, и значительная часть нашего электората их поддерживает. Однако такие действия могут дорого обойтись нам на международной арене, и, кроме того, у нас нет геополитической заинтересованности в том, чтобы отвернуться от нашего израильского союзника. Что же нам следует решить?"
 france_md.239.a: "Естественно, государство Израиль должно обуздать свою экспансионистскую политику."
 france_md.239.b: "Мы не бросим наших израильских партнеров."
 france_md.240.t: "Франция предлагает помочь стабилизировать ситуацию в нашей стране."
 france_md.240.d: "После столетия колонизации и десятилетий неоколониализма, похоже, политика Франции в Африке изменила курс. Они предлагают помочь стабилизировать нашу страну, одновременно ослабляя свой контроль над ней. Эта новость кажется благословением, и наша страна нуждается в этой помощи как никогда. Тем не менее, вероятно, эта помощь сопровождается необходимыми обещаниями мира, идущими рука об руку с ослаблением напряженности среди населения. Наш бывший колонизатор, похоже, теперь задумался о последствиях своих действий. Должны ли мы поступить так же?"
 france_md.240.a: "Помощь всегда приветствуется."
 france_md.240.b: "Они нам не нужны; они здесь больше ничего не значат."
 france_md.244.t: "Франция настаивает на принятии социального законодательства."
 france_md.244.d: "После победы движения «Непокорная Франция» во Франции в нашей стране раздаются многочисленные призывы к принятию законов, аналогичных тем, что были приняты во Франции. Успех левого раскола во Франции, похоже, распространяется и на нас, и на другие страны Европейского союза. По всей стране организуются движения, требующие тех же законодательных нововведений, что и у наших французских соседей. Большинство этих предложений касаются, в частности, прав человека, социальной справедливости и экологии. Должны ли мы принять и утвердить эти законы для себя? Это могло бы принести пользу нашим согражданам."
 france_md.244.a: "Эти законы могли бы стать хорошим дополнением к нашей конституции."
 france_md.244.b: "Нет, это невозможно."
 france_md.245.t: "Франция добивается принятия экологического законодательства."
 france_md.245.d: "Победа экологов во Франции потрясла Европу: один из стран-основателей нашего Союза теперь призывает к принятию климатического законодательства, а не к реализации концепции свободной торговли и экономического роста, на которой был построен ЕС. Активисты уже начали распространять этот импульс в нашей стране. Должны ли мы принять часть их программы – жест в поддержку наших прогрессивных сил, но тормозящий экономическое развитие, – или занять четкую позицию, прежде чем ситуация начнет развиваться в их направлении без нашего участия?"
 france_md.245.a: "Мы также должны защитить себя от изменения климата."
 france_md.245.b: "Что такое изменение климата?"
 france_md.246.t: "«Зеленая Франция» берет на себя руководство."
 france_md.246.d: "После недавнего голосования по назначению Европейской комиссии, похоже, что экология одержала победу. После победы экологов во Франции партия «Европа Экология», или «Зелёные», поднялась на высший уровень в Европейском Союзе, что является ярким свидетельством растущего стремления Союза к решению климатических проблем. Эта победа не только повышает осведомленность граждан, но и укрепляет их уверенность в Европе, которая серьезно относится к климатической безопасности."
 france_md.246.a: "Двигаемся ли мы к «зеленой» Европе?"
 france_md.248.t: "Депутаты-экологи активизируют свою деятельность в Европейском парламенте."
 france_md.248.d: "После избрания во Франции число депутатов-экологов в Европейском парламенте, по-видимому, значительно возросло. Похоже, мы наблюдаем возрождение интереса к экологическим вопросам в государствах-членах Европейского союза. Это число депутатов, чье значение, кажется, постоянно растет, все больше влияет на баланс сил в Европейском парламенте, вплоть до того, что становится предметом спора в будущих европейских комиссиях. Это растущее влияние экологов на Европейский союз, похоже, распространяется и на нашу страну, где оно влияет не только на популярность наших экологических партий, но и укрепляет доверие к Европейскому союзу, более внимательному к вопросам здравоохранения и экологии."
 france_md.248.a: "В Европейском парламенте они мало чего добьются."
 france_md.249.t: "Франция предлагает создать Фонд «зеленого перехода»."
 france_md.249.d: "На этот раз наши французские друзья представили новое предложение. Они предлагают создать фонд участия между европейскими странами для содействия экологическому переходу в европейских странах. Этот фонд должен позволить нам развивать наш энергетический сектор, по возможности, за счет «зеленой» энергии. Они подчеркивают, что этот инструмент позволит подтвердить наш энергетический суверенитет и построить его на устойчивой основе. Однако для этого потребуется более активная мобилизация гражданского сектора в поддержку таких инвестиций. Стоит ли нам участвовать?"
 france_md.249.a: "Где нам нужно подписать?"
 france_md.249.b: "Нет, спасибо, мы и сами прекрасно справляемся."
 france_md.250.t: "Франция предлагает сократить выбросы углекислого газа в Европе."
 france_md.250.d: "Наши французские друзья-экологи вернулись с предложением о резком сокращении выбросов углекислого газа, которое предлагается как нам, так и нашим соседям в связи с завершением работы над «Зеленым соглашением» ЕС. Они утверждают, что сокращение использования ископаемого топлива позволит нашим людям дышать легче и укрепит энергетический суверенитет Союза, поскольку ни одна из наших стран не производит собственную нефть. Такая реструктуризация будет дорогостоящей и медленной, но может оказаться решающей, если напряженность в отношениях с Россией, нашим основным источником ископаемого топлива, когда-нибудь обострится."
 france_md.250.a: "Они правы; ископаемое топливо делает нас уязвимыми."
 france_md.250.b: "Я не понимаю, в каком мире у нас могут быть разногласия с Россией."
 france_md.251.t: "Вмешательство Франции в нашу торговую политику"
 france_md.251.d: "Наш посол во Франции сообщает, что председательство хочет, чтобы мы регулировали наш пищевой сектор: по их словам, некоторые наши продукты непригодны для употребления, в частности, мясо, произведенное с использованием молекул, стимулирующих рост, запрещенных в ЕС. Несоблюдение требований грозит протекционистскими мерами против наших товаров и давлением на остальную часть Союза с целью заставить их последовать этому примеру, хотя французская агропродовольственная промышленность явно заинтересована в том, чтобы объявить наш экспорт недобросовестной конкуренцией. Регулирование позволило бы нашим гражданам получать больше выгоды от сельского хозяйства, но оно ограничило бы рост нашего агропродовольственного сектора."
 france_md.251.a: "Они правы; эти правила необходимы."
 france_md.251.b: "Я отдаю своему скоту то, что хочу."
 france_md.252.t: "Франция предлагает ввести таможенные барьеры против Бразилии."
 france_md.252.d: "Наш французский партнер призывает нас запретить бразильский импорт из-за спора, возникшего из-за отказа Бразилии применять европейские санитарные ограничения к своему агропродовольственному производству. В результате продукты питания из Южной Америки становятся дешевле, но с большей вероятностью содержат опасные для наших граждан ингредиенты. Европейские отрасли называют это недобросовестной конкуренцией; финансисты — свободной торговлей. Очевидно, что французская пищевая промышленность подпитывает эти жалобы, но риск для здоровья наших граждан все равно реален."
 france_md.252.a: "Они правы; это недобросовестная конкуренция."
 france_md.252.b: "А как же свободная торговля во всей этой ситуации?"
 france_md.253.t: "Вмешательство Франции в нашу торговую политику"
 france_md.253.d: "Наш посол во Франции сообщает, что председательство хочет, чтобы мы регулировали наш производственный и добывающий сектор: большая часть нашей продукции игнорирует европейские промышленные стандарты, но при этом наводняет их рынок, а их отрасли называют возникший торговый дисбаланс недобросовестной конкуренцией. Нам нужна Европа как торговый партнер, и отказ от их стандартов грозит введением импортных ограничений на наши товары, что нанесет нам гораздо больший ущерб. Соблюдение стандартов позволило бы нам производить продукцию более ответственно по отношению к нашим людям и планете, но это ограничило бы рост нашего промышленного сектора."
 france_md.253.a: "Мы не можем потерять наших европейских партнеров."
 france_md.253.b: "Им нужны эти недорогие товары, и они это знают."
 france_md.254.t: "Франция предлагает ввести таможенные барьеры против Китая."
 france_md.254.d: "Наш французский партнер призывает нас запретить китайский импорт из-за спора, возникшего из-за отказа Китая применять европейские промышленные ограничения к собственному производству, в результате чего промышленные товары и сырье становятся дешевле, но, скорее всего, производятся в сомнительных условиях. Европейские отрасли называют это недобросовестной конкуренцией; финансисты — свободной торговлей. Очевидно, что французский промышленный сектор подпитывает эти жалобы, но ущерб, который эти товары наносят планете и нашей промышленности, все равно реален."
 france_md.254.a: "Они правы; это недобросовестная конкуренция."
 france_md.254.b: "А как же свободная торговля во всей этой ситуации?"
 france_md.255.t: "Вмешательство Франции в нашу торговую политику"
 france_md.255.d: "Наш посол во Франции сообщает, что президентская администрация хочет, чтобы мы регулировали наш нефтедобывающий и нефтеперерабатывающий сектор: большая часть нашей продукции игнорирует европейские стандарты добычи и промышленности, но при этом наводняет их рынок, а их отрасли называют возникший торговый дисбаланс недобросовестной конкуренцией. Нам нужна Европа, и отказ от их стандартов грозит введением импортных ограничений на наши товары, что нанесет нам гораздо больший ущерб. Соблюдение стандартов позволило бы нам производить продукцию более ответственно по отношению к нашим людям и планете, но это ограничило бы рост наших нефтяных компаний."
 france_md.255.a: "Мы не можем потерять наших европейских партнеров."
 france_md.255.b: "Удачи вам с отоплением этой зимой."
 france_md.256.t: "Франция предлагает ввести таможенные барьеры против России."
 france_md.256.d: "Наш французский партнер призывает нас ограничить импорт российских углеводородов из-за спора, возникшего в результате отказа России применять европейские правила добычи и переработки, что приводит к производству топлива в условиях, крайне неблагоприятных для планеты. Некоторые европейские добывающие отрасли называют это недобросовестной конкуренцией и хотят меньшей зависимости от иностранных держав, но Россия может представлять меньшую угрозу, чем мы думаем, а ее мягкие стандарты позволяют нам снижать затраты на топливо."
 france_md.256.a: "Они правы; нам следует ограничить нашу зависимость от топлива."
 france_md.256.b: "А как же свободная торговля во всей этой ситуации?"
 france_md.257.t: "Франция предлагает разработать масштабный план развития железных дорог."
 france_md.257.d: "Наши французские партнеры вернулись с новым проектом: переориентация европейских грузоперевозок с автомобильных на железнодорожный транспорт — идея, которую активно продвигают французские экологи для повышения эффективности и экологичности грузоперевозок. Для этого потребуется эффективная, единая железнодорожная сеть, которой нам сегодня не хватает, поскольку такие несоответствия, как, например, разная ширина колеи в Испании, по-прежнему замедляют трансграничные перевозки. Поскольку грузооборот имеет центральное значение для Европейского союза, а сеть также могла бы облегчить перемещение людей, этот проект стоит реализовать, даже если он окажется дорогостоящим по сравнению с уже процветающим сектором автомобильных грузоперевозок."
 france_md.257.a: "Присоединяйтесь к нам!"
 france_md.257.b: "Я предпочитаю свой грузовик"
 france_md.258.t: "Победа коммунистов во Франции дестабилизирует нашу внутреннюю политику."
 france_md.258.d: "Победа Французской коммунистической партии потрясла Европу: один из основателей Союза, созданного в противовес коммунистическому блоку, теперь призывает свой народ присоединиться к борьбе, возрождая опасения по поводу СССР, которые многие страны считали давно похороненными. Активисты уже начали передавать этот импульс в нашу страну. Должны ли мы принять часть их программы, чтобы прервать волну протестов – жест в поддержку наших прогрессивных сил, но тормозящий экономическое развитие, – или занять четкую позицию, прежде чем ситуация выйдет из-под контроля?"
 france_md.258.a: "Это не такая уж плохая идея."
 france_md.258.b: "Лучше мертвый, чем красный"
 france_md.259.t: "Рука, протянутая коммунистической Францией"
 france_md.259.d: "С момента своего создания наше государство не переставало находиться под властью России и бояться её. Однако, похоже, на этот раз помощь готова прийти. Действительно, французские дипломаты предложили нам стратегическое партнерство для подготовки к возможному конфликту с Россией. Пока это немного: какие-то документы, какое-то оборудование, но прежде всего — обещание будущей поддержки. Самое удивительное, что эта поддержка исходит от коммунистической Франции. Что не обходится без напоминания о притеснениях, которые мы терпели от Советского Союза в то время, когда Французская коммунистическая партия придерживалась сталинских взглядов. Можем ли мы доверять Франции и Европе, зная, что это лишь укрепит позицию России по отношению к нам?"
 france_md.259.a: "Это партнерство — наше спасение."
 france_md.259.b: "Мы способны позаботиться о себе сами."
 france_md.260.t: "Франция предлагает свою помощь против России"
 france_md.260.desc: "Несколько десятилетий без советского гнета не развеяли опасений по поводу возвращения России, но Франция предложила помощь в случае конфликта, разделяя наши опасения, что российская экспансионистская политика может снова обратиться к Восточной Европе. Ее предложения варьируются от предоставления оборудования в кредит до обмена опытом, и эта помощь могла бы дать нам шанс на борьбу еще до мобилизации НАТО, хотя только если НАТО и Европа придут нам на помощь. Принятие такой помощи навредило бы отношениям с Москвой; возможно, сохранение этих отношений — более безопасный путь для нас."
 france_md.260.a: "Нам просто нужно оборудование, чтобы держать русских на расстоянии."
 france_md.260.b: "Нам необходима подготовка для ведения войны высокой интенсивности."
 france_md.260.c: "В долгосрочной перспективе нам потребуется нарастить производство вооружений."
 france_md.260.d: "Нам не нужна помощь, Россия — не наш враг."
 france_md.261.t: "Франция предлагает официально оформить наш альянс."
 france_md.261.desc: "Триумф бывшей сталинистской партии во Франции поднимает вопрос об отношениях с потенциальным союзником в Западной Европе, который выражал враждебность к Западу и американцам и демонстрировал идеологическую близость к старому СССР, даже называя его наследие положительным. Париж, вслед за ним, многократно выступил с заявлениями, осуждающими американский империализм и европейскую слепоту, и теперь предлагает сотрудничество, которое может варьироваться от торговли до полномасштабного военного и стратегического партнерства, если мы сочтем их бывшую советскую лояльность достаточно надежной, чтобы им можно было доверять."
 france_md.261.a: "Всегда приятно иметь с вами дело."
 france_md.261.b: "Действительно, мы должны защитить себя от американского империализма."
 france_md.261.c: "Ничто не разлучит коммунистическое братство."
 france_md.261.d: "Мы не сотрудничаем с коммунистами."
 france_md.262.t: "Россия согласилась расширить торговые отношения с нами."
 france_md.262.d: "Россия положительно отреагировала на наше предложение о расширении отношений. Она предложила поделиться с нами своими промышленными и добывающими знаниями при условии, что мы поможем ей в развитии ядерного и третичного секторов. Это значительный шаг вперед в наших отношениях с Россией. Однако наши предложения о потенциальном стратегическом партнерстве были отложены. Вероятно, Россия пока не предоставляет нам достаточного кредита, но этот первый шаг в нашем направлении – это хорошо. Потребуется время, но это соглашение – начало конца для империалистов."
 france_md.262.a: "Доверие всегда строится в долгосрочной перспективе."
 france_md.263.t: "Россия согласилась установить с нами военное и торговое партнерство."
 france_md.263.d: "Россия положительно отреагировала на наше предложение о расширении отношений. Она предложила поделиться с нами своими промышленными и добывающими знаниями при условии, что мы поможем ей создать ядерный и сектор услуг. Это значительный шаг вперед в наших отношениях с Россией. Кроме того, Россия предложила расширить это партнерство за счет военного компонента, призванного обеспечить нашу совместную подготовку к действиям в случае перехода империалистической угрозы к реальным действиям. Россия предоставит нам полигоны и свой опыт в условиях тундры, а мы дадим ей доступ к нашему опыту ведения боевых действий в пустыне и джунглях."
 france_md.263.a: "Вместе мы непобедимы"
 france_md.264.t: "Россия предлагает союз."
 france_md.264.d: "Мы не ожидали столь позитивного ответа от нашего российского партнера. Они предложили нам создать альянс против западного империализма. Объединив экономические и геостратегические элементы, этот альянс позволит нам подготовиться экономически, военно и дипломатически к противостоянию с Западом. Мы обменяемся знаниями и промышленными традициями, а также полигонами и гарантией взаимной помощи в случае конфликта. Мы не заключали с ними подобных союзов со времен Первой мировой войны; возможно, это плохой знак. Однако этот альянс весьма желателен и позволит нам выжить в мире, в значительной степени враждебном коммунизму."
 france_md.264.a: "Западный империализм будет бессилен против нас."
 france_md.265.t: "Россия отказывается расширять отношения с нами."
 france_md.265.d: "К большому удивлению наших дипломатов, Россия, похоже, отказывается от любого сотрудничества с Французской Республикой. Разные интересы. Отсутствие доверия. Кажется, память о СССР отдалилась от них. Возможно, западная коррупция наконец-то добралась до России, которая когда-то была оплотом против американского империализма. Одно можно сказать наверняка: мы одни, одни в Европе, которая нас не понимает и всегда будет враждебна к нам."
 france_md.265.a: "Мы — настоящие коммунисты!"
 france_md.266.t: "Франция расходится во мнениях с ЕС по вопросу иммиграции."
 france_md.266.d: "Наши коллеги из Национального фронта возглавляют Францию ​​уже несколько месяцев, и с момента прихода к власти они постоянно критикуют миграционную политику Европы как слишком мягкую. Либеральные и социалистические силы долгое время заставляли нас замолчать по этому вопросу внутри Союза, но теперь, когда наши союзники одержали победу в Париже, они больше не могут нас игнорировать. Наши собственные люди, сами принявшие националистические идеалы, приветствуют эту победу как доказательство того, что наш голос был прав с самого начала в Европе, которая сбилась с пути."
 france_md.266.a: "Это начало конца для либералов."
 france_md.267.t: "Франция расходится во мнениях с ЕС по вопросу иммиграции."
 france_md.267.d: "После победы Национального фронта во Франции в Европейский парламент обрушился шквал критики, и этот сдвиг, похоже, вызвал волну в европейской политике, поскольку националистические и евроскептические партии демонстрируют все более сильные результаты. Дискуссия сосредоточена на иммиграции, и парламентарии все чаще отражают общественное мнение, склоняющееся к националистическому видению внутренней политики, осуждая, по их мнению, чрезмерно мягкую политику. Наш собственный электорат не является исключением, и потрясения, вызванные Францией, начинают сотрясать и его. Должны ли мы бороться с этим националистическим дрейфом или принять новую европейскую ориентацию по мере ее формирования?"
 france_md.267.a: "Однако они правы."
 france_md.267.b: "Европа уже заплатила цену за национализм."
 france_md.268.t: "Франция выиграла дело в Брюсселе."
 france_md.268.d: "Французская политическая политика приняла новый оборот: несмотря на свой исторический евроскептицизм, партия заключила сделку с Европейским союзом, используя кампании по разжиганию евроскептицизма внутри страны и среди союзников, чтобы убедить Брюссель в представляемой ими опасности, и теперь использует это влияние, чтобы заставить ЕС депортировать нелегальных мигрантов. Это настоящий успех для их президентства. Наше собственное националистическое правительство сталкивается с тем же вопросом суверенитета: должны ли мы стремиться к преимуществам ЕС в обмен на ослабление нашего собственного евроскептицизма, зная, что значительная часть нашей партии считает эту позицию основополагающей ценностью?"
 france_md.268.a: "Зачем вести переговоры, если мы можем просто выйти из Европы?"
 france_md.268.b: "Это умно, нам тоже следует так поступить."
 france_md.269.t: "Франция выступает за европейскую идентичность"
 france_md.269.d: "Получив от Брюсселя уступки по миграционным вопросам, французское руководство, похоже, полностью отказывается от своей евроскептической риторики, даже продвигая присоединение к Европейскому союзу, пока оно дистанцируется от либеральных и социалистических тенденций. Националистические движения, по-видимому, множатся внутри самого Союза, что снова делает привлекательной концепцию «Европы наций», хотя такой сдвиг может дестабилизировать избирателей, склонных к полному неприятию ЕС. Стоит ли нам следовать примеру Франции, особенно если лидерство в ЕС будет продолжать смещаться в нашу сторону?"
 france_md.269.a: "Это очень хорошая инициатива."
 france_md.269.b: "Нельзя быть одновременно и националистом, и европейцем."
 france_md.270.t: "Франция предлагает инвестировать в нашу оборону."
 france_md.270.d: "В последние годы вероятность новой войны на европейском континенте кажется выше, чем когда-либо. Хотя наш Союз ещё не подвергался агрессии, тревожные действия нашего российского соседа, похоже, подтверждают эти опасения. Франция обратилась к нам с предложением: она предлагает помочь нам в строительстве военно-промышленного комплекса, инвестируя в него. С помощью этих заводов по производству оружия мы могли бы эффективно подготовиться к тому дню, когда нам придётся сражаться за нашу страну и наших европейских партнёров. Однако, позволив им инвестировать в наше вооружение, мы станем ещё более зависимыми от них, что может быть не лучшей идеей. Более того, наше пацифистски настроенное население может опасаться такой мобилизации капитала."
 france_md.270.a: "Благодарим вас за эту крайне важную помощь."
 france_md.270.b: "Нет причин для беспокойства."
 france_md.271.t: "Франция признает наши претензии в Украине."
 france_md.271.d: "С тех пор как власть во Франции перешла к Национальному фронту, они стали относиться к нам все более благосклонно, порывая с Европой, которая всегда противостояла нашим амбициям на восток. Они не только высказались в поддержку наших претензий на украинскую территорию, но и предложили нам доступ к своей территории и портам для переброски войск и грузов, упростив нашу логистику и смягчив любое будущее европейское эмбарго. Этот новый союзник подтверждает наш выбор пути к войне, на который мы еще можем пойти."
 france_md.271.a: "Падение первого домино"
 france_md.271.b: "Мы не намерены воевать с нашими украинскими братьями."
 france_md.272.t: "Франция предлагает расширить наше сотрудничество."
 france_md.272.desc: "После многочисленных заявлений и соглашений в нашу пользу Франция, похоже, готова расширить с нами отношения, позиционируя себя как защитника морали и веры в Европе и на Западе, которые она теперь считает декадентскими. Наши отношения могут перейти от торговли к полноценному военному и стратегическому партнерству, если мы увидим достаточный потенциал в этом новом союзнике, или же могут ухудшиться, если мы по-прежнему будем рассчитывать на хорошие отношения с Европейским союзом в его нынешнем виде."
 france_md.272.a: "Наша экономика выиграет"
 france_md.272.b: "Наша экономика и наши армии получат выгоду."
 france_md.272.c: "Мир содрогнется перед нами"
 france_md.272.d: "Мы не намерены сотрудничать с Францией."
 france_md.273.t: "Россия согласилась расширить торговые отношения с нами."
 france_md.273.d: "Россия положительно отреагировала на наше предложение о расширении отношений. Она предложила поделиться с нами своими промышленными и добывающими знаниями при условии, что мы поможем ей в развитии ядерной и третичной отраслей. Это значительный шаг вперед в наших отношениях с Россией. Однако наши предложения о потенциальном стратегическом партнерстве были отложены. Вероятно, Россия пока не предоставляет нам достаточного доверия, но этот первый шаг в нашем направлении – это хорошо. Потребуется время, но это соглашение – начало конца для ультраглобалистов."
 france_md.273.a: "Доверие всегда строится в долгосрочной перспективе."
 france_md.274.t: "Россия согласилась установить с нами военное и торговое партнерство."
 france_md.274.d: "Россия положительно отреагировала на наше предложение о расширении отношений. Она предложила поделиться с нами своими промышленными и добывающими знаниями при условии, что мы поможем ей создать ядерный и сектор услуг. Это значительный шаг вперед в наших отношениях с Россией. Кроме того, Россия предложила расширить это партнерство за счет военного компонента, призванного обеспечить нашу совместную подготовку к действиям в случае перехода ультраглобалистской угрозы к реальным действиям. Россия предоставит нам полигоны и свой опыт в условиях тундры, а мы дадим ей доступ к нашему опыту ведения боевых действий в пустыне и джунглях."
 france_md.274.a: "Вместе мы непобедимы"
 france_md.275.t: "Россия предлагает союз."
 france_md.275.d: "Мы не ожидали столь позитивного ответа от нашего российского партнера. Действительно, они предложили нам создать альянс, гарантирующий взаимную помощь в случае агрессии со стороны иностранных держав. Этот альянс, сочетающий экономические и геостратегические элементы, позволит нам подготовиться экономически, военно и дипломатически к противостоянию с остальным миром. Он даст нам силы бороться до конца, чтобы защитить себя от ультраглобализма, в котором погрязли наши соседи. Мы не заключали с ними подобных союзов со времен Первой мировой войны; возможно, это плохой знак. Однако этот альянс весьма приветствуется и является большим успехом для нашей политики."
 france_md.275.a: "Мы защищены от либерального упадка"
 france_md.276.t: "Россия отказывается расширять отношения с нами."
 france_md.276.d: "К большому удивлению наших дипломатов, Россия, похоже, отказывается от любого сотрудничества с Французской Республикой. Разные интересы. Отсутствие доверия. Возможно, западная коррупция наконец-то добралась до России, которая когда-то была сильной и гордой. Однако этот поворот событий не является драматичным; возможно, у нас и так было не так уж много общего. Мы наверняка найдем других националистических союзников на континенте."
 france_md.276.a: "Это очень жаль."
 france_md.277.t: "Франция предлагает защитить нас от российского влияния."
 france_md.277.d: "В течение нескольких лет Россия, похоже, инвестировала в африканский континент, предлагая свои услуги в борьбе с джихадистскими и независимыми восстаниями, процветающими в странах бывшей французской Африки. Франция и Россия явно находятся в конфликте влияния на этом континенте. С ними сталкиваются ценности: западный либерализм и авторитаризм. В этой ситуации, когда мы, африканские страны, являемся мишенью российского влияния, которое иногда может усугублять напряженность между региональными меньшинствами, Франция предлагает помочь нам уменьшить их присутствие, оказывая нам помощь вместо них. Однако это означало бы сближение с нашими бывшими колонизаторами, что может быть не лучшей идеей. Что же нам следует решить?"
 france_md.277.a: "Они правы; российское влияние опасно."
 france_md.277.b: "Наши бывшие колонизаторы. Конечно, нет."
 france_md.278.t: "Французская коммуна выходит из Европейского союза"
 france_md.278.d: "Несколько месяцев назад Франция объявила о прекращении существования республики в пользу Французской коммуны, нового образования, основанного на революционном коммунизме, и вскоре после этого она вышла из нашего Европейского союза, построенного на экономическом либерализме, который теперь отвергается её новой ориентацией. Выход был немедленным и окончательным, без видимого намерения вести переговоры. Это не сулит ничего хорошего для континента, чей Союз существовал прежде всего для предотвращения новых конфликтов, и с резким выходом в сочетании с столь революционной идеологией рано или поздно придётся столкнуться."
 france_md.278.a: "Это было вполне ожидаемо."
 france_md.279.t: "Французская коммуна оказывает давление на нашу политику"
 france_md.279.d: "Как и предсказывалось, выход Французской коммуны из Европейского союза не стал тупиком; едва вырвавшись из него, они уже восстанавливают свою экономику, и их успехи начинают вызывать восхищение у тех, кто внутри страны не питает особой любви к либеральным европейским ценностям. Французская разведка, преобразованная в международную пропагандистскую службу, помогает обучать этих агитаторов, и мы должны отнестись к этому серьезно, прежде чем окажемся в их положении. Мы можем отстаивать европейские ценности и мир, который они приносят, или же сами противостоять их программе, чтобы смягчить грядущее насилие, хотя это и означает принятие коммунистической, антиевропейской политики."
 france_md.279.a: "Нет смысла воевать, если мы можем победить их в их же игре."
 france_md.279.b: "Мы должны бороться с этими экстремистами."
 france_md.280.t: "Французская коммуна приглашает нас на саммит по мировой революции."
 france_md.280.d: "Укрепив контроль внутри страны, французские революционные коммунисты теперь намерены экспортировать свою революцию, приглашая нас на саммит по мировой революции, потому что наше собственное правительство уже поддержало коммунистические ценности, которые так дороги новой Французской коммуне. Они полны решимости распространить эти ценности по всему миру, и это приглашение, безусловно, является проверкой того, последуем ли мы за ними. Такая революция не обойдется без войны, скорее всего, кровавой, учитывая, сколько великих держав никогда ее не примут. Коммунистические идеалы нам дороги, но готовы ли мы рисковать жизнями наших граждан ради их достижения?"
 france_md.280.a: "Мы с вами, да здравствует революция!"
 france_md.280.b: "История доказала, что свободу не добывают под дулом пистолета."
 france_md.281.t: "Император проводит глубокие реформы французских вооруженных сил."
 france_md.281.d: "Наш Император предпринял глубокие реформы наших вооруженных сил, стремясь сделать их более приспособленными к войнам, в которых нам, возможно, придется участвовать. Осуществление этих реформ требует значительных инвестиций и нашего полного внимания, оставляя меньше места для немедленной готовности, поэтому на некоторое время мы станем более уязвимыми, прежде чем сможем возобновить наращивание наших сил. Первая волна реформ направлена ​​на само руководство армии, признанное непригодным для предстоящих реформ, а реорганизация командной структуры должна занять чуть меньше года, в течение которого мы должны ограничить наши военные операции ради долгосрочной выгоды."
 france_md.281.a: "Эти реформы необходимы."
 france_md.282.t: "Реформы нашего Генерального штаба завершены."
 france_md.282.d: "Наши реформы были завершены в рекордно короткие сроки. Некоторые сопротивлялись, но большинство нашего генерального штаба приняли реорганизацию командной структуры. Помимо повышения эффективности нашего руководства, эти реформы открывают двери для талантливых новых генералов, ценой более углубленной подготовки, и это лишь первый шаг в преобразовании наших вооруженных сил. В ближайшие месяцы дальнейшие реформы определят средства и цели наших сил и обеспечат нашему военно-промышленному комплексу более четкий план действий. Это был долгосрочный риск, и, похоже, мы его выиграли."
 france_md.282.a: "Мы твердо стояли на своем. Теперь мы можем перейти к более важным вопросам."
 france_md.283.t: "Основа нашей армии"
 france_md.283.d: "Первый этап реформ, касающихся нашего подхода к ведению боевых действий, уже состоялся, определив стратегию, которую мы должны применять в любом крупномасштабном конфликте против будущего противника. После реорганизации, проведенной после Второй мировой войны, наши армии всегда отдавали предпочтение наступательным стратегиям, основанным на мобильности и маневренности, и мы могли бы углубить эту стратегию, сосредоточив нашу доктрину и заказы на технику на штурмовых танках и быстром захвате целей. Альтернативой является сосредоточение внимания на пехоте, усиление ее роли и оснащения для ответа на контратаки противника превосходящей огневой мощью – более безопасный подход, но он поставил бы под сомнение нашу прежнюю доктрину."
 france_md.283.a: "Пехота всегда играла центральную роль; это самый безопасный подход."
 france_md.283.b: "Наша армия построена на основе маневренной войны еще со времен холодной войны, и нет причин для изменений в этом отношении."
 france_md.284.t: "Наша огневая мощь"
 france_md.284.d: "Наступила заключительная волна доктринальных реформ, заставляющая нас решать, как наша армия будет уничтожать силы противника на расстоянии. Долгое время мы балансировали между артиллерией и авиацией, но предстоящий путь требует специализации. Наши пушки «Цезарь» мобильны и эффективны, позволяя нам обстреливать вражеские войска из безопасного места. Наши военно-воздушные силы и вертолеты обладают универсальной огневой мощью, но остаются уязвимыми для противовоздушной обороны противника, и потеря контроля над небом может оказаться катастрофической. Мы должны выбирать между минимальным риском и большей огневой мощью."
 france_md.284.a: "Артиллерия более экономически эффективна."
 france_md.284.b: "Наша авиация очень эффективна; было бы глупо её не использовать."
 france_md.285.t: "Наша позиция в отношении Европейского союза"
 france_md.285.d: "Слишком долго наша страна ставила Европейский союз выше собственного развития. Отказ от развития и безопасности привел нас к беспрецедентному демократическому кризису, из которого мы, тем не менее, вышли победителями. Но сегодня у нас есть возможность изменить эту тенденцию. Освободившись от прежних демократических институтов, мы свободны делать собственный выбор и можем выйти из Европейского союза, если захотим. Однако внезапный выход может нанести серьезный удар по нашей стране, только что оправившейся от либеральных репрессий. Должны ли мы вести переговоры с Европейским союзом о монетизации нашего возвращения между ними, или же мы должны закрепить наш разрыв с ними, завершив выход из Европейского союза?"
 france_md.285.a: "Опустошите карманы Брюсселя, иначе мы уходим!"
 france_md.285.b: "Европейский союз причинил нам достаточно вреда. Фрексит!"
 france_md.286.t: "Франция выходит из Европейского союза"
 france_md.286.d: "После масштабных потрясений в нашем партнерском французском государстве националистические движения, заявляющие о приверженности бонапартизму, захватили власть во Франции. Они немедленно приступили к уничтожению остатков проевропейских настроений внутри страны. Теперь они объявляют о выходе Франции из Европейского союза. Они продемонстрировали категорический отказ от переговоров. Победа этих националистических движений – это не просто трещина в европейском строительном проекте, а образец для евроскептиков по всему Союзу."
 france_md.286.a: "Национализм представляет опасность для нашего Европейского союза."
 france_md.287.t: "Европейский союз уступает нашим требованиям"
 france_md.287.d: "Похоже, мы приняли правильное решение, ведя переговоры о нашем возвращении в европейские институты. Мы не только избежали экономического кризиса, но и извлекли средства из Европейского центрального банка. Это можно назвать успешной финансовой операцией! Нет сомнений, что рано или поздно мы встретимся с нашими партнерами на поле боя, но пусть они дремлют в иллюзиях. Одно можно сказать наверняка: наши противники должны быть в ярости от того, что наши переговоры с ЕЦБ увенчались успехом."
 france_md.287.a: "Наше время придёт"
 france_md.288.t: "Наши переговоры провалились"
 france_md.288.d: "Наша попытка была смелой, но оказалась неудачной. Возможно, мы запросили слишком многого или не смогли внушить доверие нашим европейским собеседникам. В любом случае, ЕЦБ отказался платить нам за то, чтобы мы остались. Это их решение, и оно не отвечает нашим интересам, но такова реальность. Теперь мы должны решить, оставаться ли нам в Европейском союзе. Выход будет экономически затратным, но сохранение подтвердит наше поражение перед Союзом. В любом случае, в конечном итоге мы встретимся с ними на поле боя, независимо от членства в Европейском союзе. Единственный вопрос заключается в том, перевешивают ли финансовые издержки выхода моральные издержки пребывания."
 france_md.288.a: "Выход из Союза обойдется нам слишком дорого; на данный момент мы не можем себе этого позволить."
 france_md.288.b: "Нам здесь больше нечего делать."
 france_md.289.t: "Франция заключила соглашение с Европейским союзом."
 france_md.289.d: "После нескольких месяцев дипломатического давления и угроз выхода, бонапартистская Франция подчинила Европейский союз своей воле, монетизируя его членство ради получения дополнительных преимуществ за сохранение членства. Это соглашение катастрофично для нас и наших партнеров: нет никакой гарантии, что Франция будет вести себя должным образом теперь, когда ею управляют одержимые местью националисты. Франция остается важным членом, но сегодня она представляет опасность для всего континента, и наши народы должны заплатить цену за прихоти своего партнера."
 france_md.289.a: "Действительно ли это была хорошая идея?"
 france_md.290.t: "Заря новой империи"
 france_md.290.d: "После нескольких месяцев внутренних потрясений и конституционных реформ мы добились успеха. Мы успешно уничтожили институты и власть позорной республики. Теперь Франция должна стать тем, чем она никогда не должна была переставать быть: империей! В честь возвращения империи мы подготовили грандиозное торжество, транслируемое по всей Франции. Благодаря этому событию наш народ поймёт нашу силу и нашу решимость вернуть Франции её былую славу. Это торжество также пошлёт чёткий сигнал нашим противникам: демонстрацию силы. Теперь они не смогут нас игнорировать; их дни сочтены, прежде чем Франция придёт заявить о своих правах. На этот раз никакая коалиция не сможет нас остановить!"
 france_md.290.a: "Империя вернет себе былое величие!"
 france_md.291.t: "Франция призывает к союзу национализмов."
 france_md.291.d: "Победа наших товарищей-националистов во Франции потрясла Европу, и Бонапарты переориентировали свою внешнюю политику против Европейского союза, его ценностей и будущего. Теперь они протянули нам руку, полагая, что наше правительство разделяет с ними достаточно общих черт характера, чтобы объединиться. Молчаливый союз с Францией кажется привлекательным, но ничто не гарантирует, что впоследствии они не обратятся против нас. Мы должны тщательно взвесить последствия."
 france_md.291.a: "Они на правильном пути; нам бы тоже не помешало к ним присоединиться."
 france_md.291.b: "Мы не разделяем это видение национализма."
 france_md.292.t: "Бонапартизская Франция оказывает давление на нашу политику"
 france_md.292.d: "Как мы и предполагали, националистическая и антиевропейская риторика Франции не была случайностью: с приходом к власти Бонапартов Европейский союз стал мишенью для националистов повсюду. Часть нашего населения теперь опасается возвращения войны, в то время как другие присоединились к националистическому движению и проводят дестабилизирующие операции против нашего правительства, широко поддерживаемые и подготовленные французской разведкой, действующей как международный пропагандистский аппарат. Мы должны отнестись к этому с предельной серьезностью, поскольку их цель — разделить нас. Европейский союз должен оставаться единым!"
 france_md.292.a: "В конечном итоге Европа победит национализм."
 france_md.293.t: "Окружённый врагами"
 france_md.293.d: "Как и во времена революционных войн, кажется, что необходимые перемены в нашей стране порождают недовольство. Пока мы восстанавливаемся, наши враги уже плетут против нас заговоры и готовятся к противостоянию. Их осторожность оправдана, ведь мы готовы силой вернуть себе свои территории, если это потребуется. В любом случае, мы изолированы от Европы, которая справедливо видит в нас угрозу. Сейчас мы должны прежде всего готовиться к годам конфликта с нашими противниками. Мы можем заключать союзы, но в первую очередь мы должны полагаться на себя. Но одно несомненно: как только мы победим европейскую и атлантическую угрозу, нас будет не остановить."
 france_md.293.a: "Сколько коалиций разгромил Наполеон? Мы быстро с ними расправимся."
 france_md.294.t: "Франция предлагает нам присоединиться к её альянсу."
 france_md.294.d: "Мы только что получили предложение от французских дипломатов. Отметив, что они изолированы в Европе и окружены врагами, которых сами же и создали, Бонапарты обратились к нам с просьбой. В частности, потому что они считают нашу страну достаточно респектабельной, чтобы заслужить союз с ними. Само собой разумеется, это не просто оборонительный пакт, и присоединение к нему быстро втянет нас в конфликты, не обязательно наши собственные. Однако этот союз может хорошо послужить нам в противостоянии нашим собственным противникам, и при прочих равных условиях лучше быть с ними, чем против них. Союз с Францией кажется заманчивым, но, возможно, присоединение к ней станет билетом прямиком в ад, поскольку они вскоре принесут войну в Европу."
 france_md.294.a: "Мы можем извлечь выгоду из этого альянса."
 france_md.294.b: "Конечно, нет."
 france_md.295.t: "Франция предлагает нам присоединиться к её Коминтерну."
 france_md.295.d: "Революционные коммунистические фракции, правящие Францией, развили жажду конфликтов, стремясь к мировой революции и вербуя союзников для её экспорта любыми средствами. Они обратились к нам, особенно учитывая, что мы тоже приняли социализм, предложив шанс победить капитализм и фашизм на поле боя. Однако это не просто оборонительный пакт, и присоединение к нему быстро втянет нас в конфликты, не обязательно наши собственные."
 france_md.295.a: "Они правы; пришло время экспортировать революцию."
 france_md.295.b: "Конечно, нет."
 france_md.296.t: "Французы призывали нас к нападению."
 france_md.296.d: "Наша неустанная националистическая пропаганда сработала слишком хорошо: убежденная в том, что противоборствующие державы стремятся к нашему уничтожению, общественность теперь ожидает, что мы нанесем удар первыми. Ополченцы собрались на границах, готовые противостоять силам безопасности наших соседей, и общественное мнение кипит от негодования. Мы должны быть осторожны, чтобы не запугать эти державы и не заставить их преждевременно объединиться против нас."
 france_md.296.a: "Пришло время свести счеты."
 france_md.296.b: "Наше время придёт"
 france_md.297.t: "Стычки в тоннеле под Ла-Маншем"
 france_md.297.d: "Французские ультранационалистические ополченцы, воодушевленные своим новым бонапартистским лидером, атаковали наших граждан и полицию в районе тоннеля под Ла-Маншем, убив около двадцати человек и ранив десятки. Мы были не одни: прошлой ночью эти группировки напали на большинство соседей Франции, разделяющих наше неприятие новой наполеоновской империи. Мы, очевидно, являемся главной мишенью, и конфронтация с бонапартистской Францией теперь кажется неизбежной."
 france_md.297.a: "Мы должны сдерживать французскую агрессию, защищая их потенциальные цели."
 france_md.297.b: "Мы должны подготовиться к конфликту с ними."
 france_md.298.t: "Столкновения на французской границе"
 france_md.298.d: "Французские ультранационалистические ополченцы, воодушевленные своим новым бонапартистским лидером, атаковали наших граждан и полицию вдоль общей границы, убив около пятнадцати человек и ранив десятки. Мы были не одни: прошлой ночью эти группировки напали на большинство соседних с Францией стран, все из которых являются потенциальными целями бонапартистской экспансионистской политики. Мы, безусловно, являемся одной из главных целей, и конфронтация с новой наполеоновской империей теперь кажется неизбежной."
 france_md.298.a: "Мы должны сдерживать французскую агрессию, защищая их потенциальные цели."
 france_md.298.b: "Мы должны подготовиться к конфликту с ними."
 france_md.298.c: "Нет причин для беспокойства."
 france_md.299.t: "[FROM.GetName] обращается к нам за помощью"
 france_md.299.d: "Столкнувшись с новой надвигающейся угрозой со стороны Франции, другие страны, подвергшиеся нападению, не стали медлить с ответной реакцией. Как и многие другие, [FROM.GetName] обращается к нам за помощью в защите от потенциального вторжения. Конечно, они, вероятно, столкнутся с нападением раньше, чем мы. Но действительно ли мы готовы их защитить? Стоит ли нам жертвовать месяцами подготовки ради [FROM.GetName]? Этот кризис перевернул нашу внешнюю политику, и запросы о помощи поступают один за другим. Перед нами два пути: мы можем помочь [FROM.GetName], включив их в наше стратегическое партнерство, или мы можем позволить им противостоять Наполеону в одиночку. В конце концов, есть смысл позволить ему измотать себя в схватке с таким противником, как [FROM.GetName]."
 france_md.299.a: "Мы должны их защитить."
 france_md.299.b: "Зачем умирать за [FROM.GetName]"
 france_md.300.t: "Франция предлагает нам присоединиться к её альянсу."
 france_md.300.d: "Французский бонапартистский лидер навлек на себя гнев Европы, заявив о своей готовности к войне ради восстановления величия своей страны, и теперь протягивает руку нам. Французские дипломаты обращаются к истории, вспоминая, как Наполеон когда-то помогал польскому народу против славянского и германского угнетения, и предлагают возобновить этот пакт. Такой союз защитил бы нас от постоянно существующей российской угрозы, но также мог бы втянуть нас в заведомо проигрышные войны."
 france_md.300.a: "Мы станем новыми Домбровски и Князевичем!"
 france_md.300.b: "Зачем умирать за Париж? Я вас спрашиваю."
 france_md.301.t: "Франция предлагает нам присоединиться к её альянсу."
 france_md.301.d: "Французский бонапартистский лидер навлек на себя гнев Европы, заявив о своей готовности к войне ради восстановления величия своей страны, и теперь протягивает руку нам. Французские дипломаты ссылаются на происхождение нашей королевской семьи от Жана Батиста Бернадота, маршала Наполеона, и предлагают объединить наши усилия в память о наших предках. Такой союз защитил бы нас от постоянно существующей российской угрозы, но также мог бы втянуть нас в заведомо проигрышные войны."
 france_md.301.a: "Пора вернуться к работе"
 france_md.301.b: "Прошлое — это прошлое."
 france_md.302.t: "США — друг или враг?"
 france_md.302.desc: "Направив предложения о союзе немногим потенциальным союзникам в Европе, мы сталкиваемся с одним вопросом: как нам следует поступать с Соединенными Штатами? Во время революции и при Наполеоне мы поддерживали с ними хорошие отношения, разделяя общую ненависть к Англии. Но времена изменились. Вторая мировая война и действия Америки в Европе часто противоречили французским интересам, и хотя отношения оставались хорошими до нашего прихода к власти, Вашингтон теперь может преградить нам путь к гегемонии."
 france_md.302.a: "Предложите им присоединиться к нашему альянсу."
 france_md.302.b: "Их коммерческая мощь поможет нам преодолеть международные санкции."
 france_md.302.c: "Готовьтесь к конфронтации с ними."
 france_md.302.d: "Обеспечение безопасности Европы остается нашим приоритетом."
 france_md.303.t: "Франция предлагает нам союз."
 france_md.303.d: "Французский бонапартистский лидер навлек на себя гнев Европы и теперь предлагает союз при условии, что мы не будем вмешиваться в их дела. Французские дипломаты подчеркивают, что Наполеон и революционная Франция долгое время были для нас жизненно важными союзниками. Но Франция посвятила себя борьбе с другими европейскими державами, многие из которых являются нашими союзниками, и объявила Соединенное Королевство приоритетной целью, нашим историческим союзником и ценным партнером. Стоит ли нам присоединиться к Франции и рисковать войной с Лондоном?"
 france_md.303.a: "Они могут на нас рассчитывать."
 france_md.303.b: "Англичане – наши союзники прежде всего."
 france_md.304.t: "Франция предлагает расширить торговые отношения."
 france_md.304.d: "Французский лидер-бонапартист навлек на себя гнев Европы и теперь предлагает расширить наши торговые отношения, поскольку его экономика, изолированная враждебностью по отношению к бывшим партнерам, нуждается в наших знаниях и промышленной мощи как никогда прежде. Французские дипломаты подчеркивают, что Наполеон и революционная Франция долгое время были для нас жизненно важными союзниками. Но Франция посвятила себя борьбе с другими европейскими державами, большинство из которых являются нашими союзниками, и поддержка ее военных усилий посредством торговли может вызвать их неодобрение."
 france_md.304.a: "Увеличение объёмов торговли всегда полезно."
 france_md.304.b: "Мы не будем их сообщниками."
 france_md.305.t: "Франция выходит из Европейского союза"
 france_md.305.d: "После крупного кризиса среди наших французских партнеров националистические движения, призывающие к возвращению к абсолютной монархии, захватили контроль над французским государством. С тех пор они взялись уничтожать остатки проевропейских настроений во Франции. Теперь они объявляют о выходе Франции из Европейского союза. Они продемонстрировали категорический отказ от переговоров. Победа этих националистических движений — это не только трещина в европейском единстве, но и пример для всех евроскептиков внутри Союза."
 france_md.305.a: "Национализм представляет угрозу для нашего Европейского союза."
 france_md.306.t: "Триумф монархистов во Франции"
 france_md.306.d: "Победа наших товарищей-монархистов во Франции потрясла всю Европу: столп Союза, поддерживающий национализм, оказался достаточным, чтобы привести Брюссель в ярость. Роялисты направили свою внешнюю политику против Европейского союза, его ценностей и его будущего, точно так же, как мы, монархисты, долгое время боролись с Союзом, который хотел заставить нас замолчать. По всей Европе пример Франции, кажется, подстегивает оппозицию европейской бюрократии. Наша собственная страна уже привержена монархическому делу, поэтому победа Франции — это победа европейских националистов повсюду."
 france_md.306.a: "Победа национализма в Европе"
 france_md.307.t: "Французское королевство оказывает давление на нашу политику."
 france_md.307.d: "Как мы и предсказывали, националистическая и антиевропейская риторика Франции не была случайностью: после победы монархии Европейский союз стал мишенью для националистов повсюду, и Франция продемонстрировала явную готовность вести войну против тех, кого считает врагами. Часть нашего населения теперь опасается возобновления войны, в то время как другие, и без того равнодушные к Европе, встали на сторону националистов и проводят дестабилизирующие действия против нашего правительства, при поддержке и обучении французских спецслужб, превратившихся в международную пропагандистскую машину. Мы должны отнестись к этому серьезно: их цель — разделить нас."
 france_md.307.a: "Европа в конечном итоге победит национализм."
 france_md.308.t: "Франция приглашает нас присоединиться к их крестовому походу."
 france_md.308.d: "Победа наших товарищей-националистов во Франции потрясла всю Европу. Помимо Союза, который они считают своим противником, французское королевство заявило о своей готовности защищать христианскую веру по всей Европе и миру, осуждая западную демократию как извращение, отвратившее людей от религии, и призывая к возвращению Церкви к власти. Поскольку в нашей стране христианское большинство, этот призыв отчасти адресован нам: они предлагают нам объединиться, чтобы вернуть христианству его прежнюю силу. Это приглашение может принести нам власть на службе Господу, но гарантирует возвращение войны в Европе."
 france_md.308.a: "Мы присоединимся к их крестовому походу."
 france_md.308.b: "Мы не разделяем это видение христианства."
 france_md.309.t: "Готовьтесь к Десятому крестовому походу"
 france_md.309.d: "На протяжении нескольких недель наш король демонстрирует непоколебимую решимость вернуть Святую Землю, хотя мы не имеем плацдарма в регионе. Наши ливанские партнеры поддерживают с нами дружеские отношения, но их правительство слишком нестабильно и находится под влиянием Ирана, чтобы помочь, несмотря на то, что значительное маронитское христианское меньшинство Ливана делает его идеальным местом высадки для нашего крестового похода. Мы могли бы подготовить десантную операцию, которая укрепила бы наш флот, но выставила бы нас агрессорами против невинного государства, или применить политическое давление, которое сопряжено с меньшим риском, но не гарантирует успеха."
 france_md.309.a: "Сначала нам следует спросить у них (разумеется, вежливо)."
 france_md.309.b: "Те, кто не с нами, в любом случае против нас."
 france_md.310.t: "Королевство Франции угрожает нашей независимости."
 france_md.310.d: "Французское королевство несколько месяцев назад объявило о своем намерении отвоевать Святую Землю, подготовив Десятый крестовый поход к Иерусалиму. Для этого им нужен плацдарм вблизи Иерусалима, и сильное маронитское меньшинство нашей страны нацелилось на нас. Французские агитаторы сейчас работают над подрывом нашей легитимности и оказывают давление на маронитов, чтобы те свергли наше правительство. Французский контроль мог бы защитить нас от вмешательства Израиля и Хезболлы, но, скорее всего, разорвал бы нашу страну на части в братоубийственной войне. Действительно ли это то, чего мы хотим?"
 france_md.310.a: "Они защитят нас от наших воинственных соседей."
 france_md.310.b: "Это лишь усугубит конфликт!"
 france_md.311.t: "Ливан уступает нашим требованиям"
 france_md.311.d: "Сегодняшнее утро – знаменательный день. После нашего давления ливанское правительство объявило о капитуляции перед требованиями маронитских христианских протестующих. Сразу после этого было назначено правительство с маронитским большинством, которое передало Ливан под нашу защиту. Мы сделали правильный выбор, отдав приоритет дипломатии; западные державы не найдут против этого никаких оснований, поскольку это ослабляет влияние Ирана. Мы хорошо маневрировали в геополитическом плане. Остается лишь подготовиться к сухопутному конфликту против тех, кто встанет между нами и Царством Небесным."
 france_md.311.a: "Иерусалим находится в пределах нашей досягаемости."
 france_md.312.t: "Ливан нам отказывает"
 france_md.312.d: "Сегодня утром Ливан публично заявил о своем отказе поддаться давлению Франции на свою политику. Наши агитаторы, по-видимому, не возымели эффекта, и поддержки нашего дела со стороны маронитов оказалось недостаточно. Наш провал, вероятно, связан с тем, что Ливан по-прежнему находится под строгим контролем Ирана и «Хезболлы». Однако отказ Ливана от сотрудничества с нами — это не конец. Мы всегда можем обратиться к ним, когда это потребуется, и на этот раз они не смогут оказать сопротивление. Тем не менее, наши политические усилия, похоже, потерпели неудачу. Возможно, нам следует сосредоточиться на том, как мы оказываем давление на других и укрепляем нашу международную дипломатию, поскольку она может нам понадобиться в будущем."
 france_md.312.a: "Готовьтесь к военно-морской интервенции"
 france_md.312.b: "Нам необходимо укрепить нашу дипломатию; похоже, она не является нашей сильной стороной."
 france_md.313.t: "Французская коммуна требует падения нашего правительства"
 france_md.313.d: "Несколько месяцев назад Французская коммуна объявила о своем желании принести революцию в мир, и теперь, похоже, оказывает на нас давление. Пропагандисты проникли в наше население, подстрекая граждан присоединиться к их делу, и уже сформировались группы протестующих и коммунистических экстремистов. Французские посланники предупредили о вмешательстве, если мы не уступим. Мы можем сдаться и присоединиться к Франции, потеряв независимость, или заключить в тюрьму экстремистов, угрожающих нашему правительству."
 france_md.313.a: "Да здравствует революция!"
 france_md.313.b: "Лучше мертвый, чем красный"
 france_md.314.t: "[FROM.GetName] присоединяется к мировой революции"
 france_md.314.d: "[FROM.GetName] только что объявил о падении своего правительства под давлением наших протестов и дипломатических усилий. Это отличная новость для нас; к революции присоединяется новая сила, и всё это без кровопролития. Другие капиталистические державы выразили своё потрясение этим драматическим изменением мирового порядка. Они могут протестовать, но они не могут противостоять воле народа. Революция в конце концов придёт и за ними. Падение [FROM.GetName] — это только начало; за ним последуют и другие."
 france_md.314.a: "Революция растёт"
 france_md.315.t: "[FROM.GetName] Отказывается от воли народа"
 france_md.315.d: "Протесты с требованием свержения правительства [FROM.GetName], похоже, утихли. Более того, правительство [FROM.GetName] жестоко подавило их и отказалось от каких-либо компромиссов. Если этот всплеск, похоже, сломил волю народа, возможно, нам следует активнее участвовать в революции в [FROM.GetName]. Наши силы готовы к военному вмешательству для обеспечения выполнения воли суверенного народа. Однако это вмешательство может перерасти в крупномасштабный конфликт. Стоит ли нам вмешиваться или нет?"
 france_md.315.a: "Революция неизбежна, хотят они этого или нет."
 france_md.315.b: "Мы вернёмся"
 france_md.316.t: "Победоносная коммуна в Европе"
 france_md.316.d: "Сегодня великий день для нашей Коммуны: мы принесли революцию во всю Европу. После распада Советского Союза континент был полон капиталистов и зарождающихся националистов, но ничто нас не остановило: ни санкции, ни бомбардировки, ни войны, которые мы вели, чтобы привести пролетариат к власти. Иногда нам приходилось преподавать угнетателям урок пушками, но триумф революции оправдывает средства. Пока народная армия марширует по Парижу, Европа начинает восстанавливаться на прочном фундаменте, вдали от капитализма. Наша следующая цель — воплотить в жизнь мечту интернационалистов во всем мире: великую федерацию, где все рабочие чувствуют себя как дома."
 france_md.316.a: "Интернационал станет человечеством"
 france_md.317.t: "Через Арденны"
 france_md.317.d: "Наш император давно обсуждает вторжение в Бенилюкс, жизненно важный для нашей зарождающейся империи. Бельгия является центром влияния франкоязычного меньшинства в Валлонии и нервным центром Европейского союза, но при этом остается слабо защищенной, что делает ее идеальной первой целью для восстановления наших законных границ. Поскольку мы намерены навсегда занять эти земли, так как они по праву принадлежат нам, император приказал нам избегать бомбардировок и наносить быстрые удары, прежде чем наши враги успеют подготовиться. Пришло время вернуть колыбель франкской нации за Арденнами."
 france_md.317.a: "У них нет ни единого шанса."
 france_md.318.t: "Вторая испанская кампания"
 france_md.318.d: "Наш император приказал завоевать Иберийский полуостров, что крайне важно для обеспечения безопасности нашего западного фланга перед продвижением на восток к Москве. Захват Испании приближает нас к Гибралтару, ключевому элементу контроля над Средиземноморьем. Горный рельеф благоприятствует обороняющейся стороне, поэтому император призывает к медленному, но верному наступлению при поддержке альпийских охотников, но при этом настоятельно рекомендует ускорить процесс, прежде чем враги смогут подготовиться. Поражение Наполеона научило нас, что захваченные территории необходимо удерживать: мы должны установить стабильные вассальные государства или усилить оккупационные силы."
 france_md.318.a: "На этот раз мы будем внимательно за ними наблюдать."
 france_md.319.t: "Через Рейн"
 france_md.319.d: "Наш император назвал нашего следующего противника: Германия, экономическое сердце Европы, приверженная тому видению Европы, которое мы презираем. Конфликт был неизбежен, и он знаменует наш первый шаг на восток, к Москве, нашему главному врагу. От молниеносной кампании Наполеона против Пруссии до Седана и двух мировых войн мы хорошо знаем этого врага. Император приказывает начать уверенное, подготовленное наступление с использованием мощных танков и авиации для обеспечения достижения наших целей, хотя полная оккупация не требуется. Эта война, к сожалению, неизбежна."
 france_md.319.a: "Больше никогда не буду седаны!"
 france_md.320.t: "Война за Альпы"
 france_md.320.d: "Отступление Наполеона I в России вызвало восстание союзников в тот момент, когда он ослабел, поэтому перед наступлением на Москву наш император приказывает нам обеспечить безопасность нашего южного фланга: Италии и бывших австро-венгерских земель. Сейчас это незначительная угроза, но она может стать опасной, если наша кампания в России затянется. Горный рельеф этих территорий требует привлечения альпийских охотников и артиллерии для вытеснения защитников из опорных пунктов, обеспечения безопасности нашего тыла без потери людей, которые нам понадобятся для России. Эти страны оказались не в том месте и не в то время."
 france_md.320.a: "Мы раз и навсегда похороним Священную Римскую империю!"
 france_md.321.t: "Император призывает нас готовиться к войне."
 france_md.321.d: "Наш французский союзник созвал совещание для обсуждения уничтожения России, которую он рассматривает как угрозу Европе и империи, которую мы теперь разделяем. Он призывает нас наращивать военный потенциал и направил экспертов по вооружениям для оптимизации производства, с одним девизом: готовьтесь к долгой и трудной войне. Это заявление – мрачная новость для наших граждан, которым, возможно, придётся умереть, но эта война необходима и справедлива. Мы должны защитить Европу от России, прежде чем сами станем её мишенью."
 france_md.321.a: "Спасибо, мой император."
 france_md.322.t: "Пронзая гласис"
 france_md.322.d: "Наш поход на Москву неизбежен, но сначала мы должны обеспечить себе отправную точку: Восточную Европу, некогда буфер против российской экспансии, а теперь препятствие для нашей собственной. Мы протянули руку тем, кто хотел к нам присоединиться; остальные проигнорировали наш призыв, и настал их день расплаты. Эти недавно обретшие независимость страны будет несложно разгромить. Мы быстро продвигаемся вперед, используя бронетанковый прорыв при поддержке артиллерии. Они будут сражаться до конца. Не проявляйте милосердия."
 france_md.322.a: "Французы подарят миру и мир, и свободу."
 france_md.475.t: "Вторая русская кампания"
 france_md.475.d: "После долгих лет подготовки настало время. Наш император отдал окончательные приказы по русской кампании, нашему величайшему противнику и, как и в случае с Наполеоном I, неизбежной угрозе. На этот раз он колеблется: ошибки недопустимы против державы, которая всегда защищала свою землю. Какое бы решение мы ни приняли, скорость имеет решающее значение, ибо враг тоже готовится. Сделайте правильный выбор, но дайте им знать: верховный народ будет наступать, тираны спускаются в могилы, чтобы спрятаться!"
 france_md.475.a: "Быстрое наступление, через две недели мы будем в Москве!"
 france_md.475.b: "Давайте подготовимся к войне на истощение."
 france_md.476.t: "Прорыв блокады"
 france_md.476.d: "Наша экономика и народ достаточно пострадали от рук коварной Альбиона, и теперь, когда Европа в безопасности, мы можем обратиться к нашему старейшему противнику. Только Ла-Манш преграждает нам путь на их несчастный остров. Наш Император предлагает два варианта: нанести удар с превосходством в воздухе, сокрушив их бомбами, а затем десантировать наши силы, или использовать ослабленный флот противника и сосредоточить наши силы для прямой высадки. Скорость имеет решающее значение. Сделайте правильный выбор, гражданин. Наша победа неминуема."
 france_md.476.a: "Их флот теперь лишь тень былого величия. «Ла Рояль» быстро с ним расправится."
 france_md.476.b: "Blitz 2.0 — звучит неплохо."
 france_md.477.t: "Император провозглашает победу континентальной системы."
 france_md.477.d: "Они ввели против нас санкции. Они ввели эмбарго. Они бомбили нас. Но они никогда не сломили наш дух. После многих лет войны наш император провозгласил победу: Европа вновь склоняется перед Французской империей. Эти завоевания стоили тысяч французских жизней, мучеников, которых не забудут. День Победы теперь государственный праздник в их память. Но наш триумф в Европе ничего не решает: рано или поздно мы столкнемся с другими державами на других фронтах. Франция вечна. Как и война."
 france_md.477.a: "День славы настал."
 france_md.478.t: "Какова цель нашего Королевства?"
 france_md.478.d: "Наше положение во главе Королевства Франция прочно: мы подавили революцию и вернули религии её законное место. Теперь вопрос в том, с чего начать восстановление нашей былой славы. Мы могли бы вернуть наши исконные франкские земли, хотя это спровоцировало бы войну с бывшими союзниками, не желающими их уступать, или же мы могли бы завоевать сердца христиан повсюду, первыми ступив на освобождение Святой Земли, тем самым избежав войны на нашей собственной земле. Что бы мы ни решили, нам нечего бояться, ибо Бог на нашей стороне."
 france_md.478.a: "Мы, прежде всего, Фрэнкс."
 france_md.478.b: "Крестовый поход не будет ждать, мы должны освободить наши святые места."
 france_md.479.t: "Королевство Франция требует нашей аннексии."
 france_md.479.d: "Сегодня утром от наших французских коллег поступило весьма необычное требование. Их король больше не признает наш суверенитет и требует, чтобы мы передали ему наши территории, резервы и армию, обещая плавную интеграцию нашего населения. Это похоже на первоапрельскую шутку, но французский Генеральный штаб объявил о специальной мобилизации, и все указывает на скорое вмешательство на нашей территории. Капитуляция или борьба: что бы мы ни решили, мы должны действовать быстро."
 france_md.479.a: "Конфликт причинит нашим людям ненужные страдания."
 france_md.479.b: "Как они смеют? Мы — суверенная страна."
 france_md.480.t: "[FROM.GetName] соответствует нашим требованиям"
 france_md.480.d: "Ещё до первого выстрела правительство [FROM.GetName] объявило о своём роспуске и безоговорочной капитуляции перед нашим королевством. Это отличная новость для нашего народа и наших дипломатических усилий. Наш король пообещал, что статус новых французских граждан будет оформлен как можно быстрее, и что их интеграция будет максимально эффективной. Это было самое мудрое решение, которое они могли принять. Они не смогли бы противостоять нашему вмешательству."
 france_md.480.a: "Иногда достаточно просто вежливо попросить."
 france_md.481.t: "[FROM.GetName] отказывается сдаваться"
 france_md.481.d: "Правительство [FROM.GetName] только что заявило, что осуждает нашу попытку запугать его страну. Нашим этническим требованиям не будет места за столом переговоров. Эта дипломатическая неудача была предсказуема; было бы странно, если бы суверенное государство объявило о своей капитуляции, даже не оказав сопротивления. К счастью, мы фактически подготовились именно к такому развитию событий. Наши силы готовы вмешаться на их территории. Однако неясно, является ли открытый конфликт лучшим способом добиться справедливости."
 france_md.481.a: "Они пожалеют об этом."
 france_md.481.b: "Это ещё не конец для нас."
 france_md.482.t: "Королевство Франция требует нашего подчинения"
 france_md.482.d: "Сегодня утром от наших французских коллег поступила весьма необычная просьба. Их король, вспоминая времена Каролингов, больше не доверяет нам защиту папства в условиях растущей напряженности и требует полного контроля над нашим правительством, а также коридором в Ватикан, которым он намерен управлять напрямую. Это недопустимо: мы никогда не подводили папство, и религия не может оправдать националистические амбиции нашего соседа. Однако это не пустые угрозы, французский Генеральный штаб отдал приказ о специальной мобилизации, и все указывает на интервенцию на нашей территории. Сдаться или сражаться: что бы мы ни решили, мы должны действовать быстро."
 france_md.482.a: "Мы им не ровня."
 france_md.482.b: "Как они смеют? Мы — суверенная страна."
 france_md.483.t: "[FROM.GetName] отказывается выполнять наши требования"
 france_md.483.d: "Правительство [FROM.GetName] только что заявило, что осуждает нашу попытку запугать их страну. Они отказываются подчиниться нашим требованиям и хотят защитить свой суверенитет над своими решениями и политикой. Похоже, они отвергли наш призыв к разуму. Мы не можем позволить им сойти с рук это. Наши силы готовы к военному вмешательству в их страну. Мы не можем рисковать тем, что наши противники объединят силы, чтобы противостоять нам. Мы должны показать им пример. Однако война с [FROM.GetName] может быть не тем, что нам нужно."
 france_md.483.a: "Они не понимали, что оказались не с той стороны оружия."
 france_md.483.b: "Мы можем изменить их другими способами."
 france_md.484.t: "Королевство Франция требует нашего подчинения"
 france_md.484.d: "Сегодня утром от наших французских коллег поступило весьма странное требование. Их король больше не доверяет нам защиту нашего народа и утверждает, что наше правительство находится на неверной стороне нынешнего баланса сил, требуя полного контроля над нашим правительством и вооруженными силами. Эти требования абсурдны: мы никогда не допускали ошибок в управлении нашей территорией, и наша власть исходит исключительно из мандата нашего народа. И все же это не пустые угрозы: французский Генеральный штаб отдал приказ о специальной мобилизации, и все указывает на интервенцию на нашей территории. Сдаться или сражаться: что бы мы ни решили, мы должны действовать быстро."
 france_md.484.a: "Мы им не ровня."
 france_md.484.b: "Только наш народ обладает суверенитетом."
 france_md.485.t: "Возвышение Западной империи"
 france_md.485.d: "После долгих лет борьбы и предательства франкский народ одержал победу. Когда мы свергли узурпаторскую республику, Европа подвергла нас остракизму и санкциям, но Бог всегда был на нашей стороне: Франции, старшей дочери Церкви, никогда не суждено было стать республикой. Враги франкского народа были обречены на гибель, и теперь франки вернули себе свои земли. Пришло время провозгласить нашу Империю, Империю Запада, Империю Веры, освященную папством для нашей вечной защиты. Возможно, также пришло время отправиться на восток и вернуть Святую Землю."
 france_md.485.a: "И на этот раз я сам возложу венок."
 france_md.485.b: "Deus Vult!"
 france_md.486.t: "Королевство Франция требует нашего подчинения"
 france_md.486.d: "Сегодня утром от наших французских коллег поступила весьма странная просьба. Их король, решивший довести до конца начатый им Десятый крестовый поход, утверждает, что наши островные территории лежат у него на пути, и требует их, а также, вдобавок, полного контроля над нашим правительством. Это недопустимо: религия не может оправдывать националистические амбиции нашего соседа. Однако это не пустые угрозы, французский Генеральный штаб отдал приказ о специальной мобилизации, и все указывает на интервенцию на нашей территории. Сдаться или сражаться: что бы мы ни решили, мы должны действовать быстро."
 france_md.486.a: "Это лучший способ обеспечить успех этой кампании; мы его принимаем."
 france_md.486.b: "Как они смеют? Мы — суверенная страна."
 france_md.487.t: "Победоносный десятый крестовый поход"
 france_md.487.d: "После нескольких месяцев ожесточенных боев в Средиземноморье и на Ближнем Востоке мы одержали победу. Перемещаясь с острова на остров, мы захватили последние христианские опорные пункты, а затем осадили сам Иерусалим. На нашем пути стояли бесчисленные противники, и многие французы погибли вместе с невинными людьми, павшими от нашей мстительной мощи, но цель оправдывает средства. После того, как наши достижения были закреплены, а нестабильность на Ближнем Востоке нейтрализована, остается один вопрос: следует ли нам остановиться на этом или завершить то, чего не удалось достичь религиозным войнам в Европе?"
 france_md.487.a: "Состоится новый крестовый поход"
 france_md.487.b: "Мы достигли своей цели, восстановив Иерусалимское королевство. Дальше идти не нужно."
 france_md.488.t: "Королевство Франция призывает нас присоединиться к их союзу."
 france_md.488.d: "От французских дипломатов поступило предложение. Завершив свою ближневосточную экспедицию, король Франции, как защитник католической церкви, объявляет войну всем, кто отвергает его власть, и приглашает нас в союз, который он сравнивает с Ноевым ковчегом перед грядущим потопом. Это заявление столь же безумно, сколь и ужасающе, и сопровождается мобилизацией крестоносной армии, возвращающейся домой. Предложение больше похоже на ультиматум, учитывая ярость, с которой они вели свой крестовый поход, и к нему следует отнестись серьезно. Какое бы решение мы ни приняли, мы должны сделать это быстро."
 france_md.488.a: "Лучше, чтобы они были на нашей стороне, чем против нас."
 france_md.488.b: "Они что, с ума сошли?"
 france_md.489.t: "Одиннадцатый крестовый поход одержал победу в Европе."
 france_md.489.d: "Этот крестовый поход был кровавее предыдущего. Он также был сложнее в осуществлении, поскольку мы противостояли крупным державам. Но мы сделали это. Мы победили. Однако, пока мы залечиваем раны и восстанавливаем нашу страну и тех, кого мы покорили, возникает вопрос. Должны ли мы установить строгий контроль над их политикой, чтобы гарантировать, что они останутся на правильном пути? Или же мы должны показать им свет и позволить им самим решить? Предоставив им выбор, мы продемонстрируем свою снисходительность, и вероятность восстания снизится. И наоборот, более жесткий контроль поможет гарантировать, что ни одна другая овца не собьется с пути. Что же нам делать?"
 france_md.489.a: "Нам нужно за ними присматривать."
 france_md.489.b: "Господь наш будет судить их, когда придёт время."
 france_md.490.t: "Восстановление наших природных границ"
 france_md.490.d: "От Ришелье до де Голля идея естественных границ Франции никогда не оставлялась: это фундаментальная проблема, коренящаяся как в этнических притяжениях франкского народа, так и в нашей безопасности. Сегодня мы можем исполнить это предназначение. Мы изгнали наших противников с берегов Рейна, укрепили наши горные позиции, и местное население наконец приняло новый порядок. Остается лишь формализовать эту аннексию. Благодаря ей мы отомстим за революцию и откроем эру безопасности и процветания для Империи и французского народа."
 france_md.490.a: "Границы Франции определяются природой (Дантон, 1793)."
 france_md.491.t: "Союз франкского народа"
 france_md.491.d: "Слишком долго державы, стремящиеся ограничить влияние Франции, препятствовали единству франкского народа, создавая такие государства, как Бенилюкс, как поле битвы между франками и другими германскими народами, и убеждая нас, что Европейский союз — наша истинная родина. Но судьба франков принадлежит только франкам, и ничто не сможет навсегда разделить их. Мы вернули себе исконную землю, которая дала начало французской нации, и спустя месяцы наши кровные братья поняли, что их судьба — с нами. Теперь, когда Королевство едино, справедливость восторжествовала."
 france_md.491.a: "Государство для всех Франков"
 france_md.492.t: "Возвращение Каролингов"
 france_md.492.d: "После смерти Карла Великого его империя была разделена на Западную, Центральную и Восточную Франкию, и наследие франкского императора начало угасать, поскольку франки были лишены своих земель. Мы исправили эту ошибку. После многих лет конфликтов мы изгнали узурпаторов с нашей территории и показали ее жителям, что они никогда не были немцами, итальянцами или швейцарцами, а франками, которые просто забыли об этом. Благодаря этому воссоединению мы исправляем ошибки Верденского договора и тысячелетнюю историю Европы, построенной на ложных основах. Этот день знаменует начало новой, франкской Европы."
 france_md.492.a: "Империя и Франкское государство — одно целое."
 france_md.493.t: "Иерусалимское королевство возрождается"
 france_md.493.d: "Почти тысячу лет назад наши предки-крестоносцы лишились своего самого ценного достояния. Девяти крестовых походов оказалось недостаточно, чтобы завоевать и удержать наши святые места, но мы вернулись, чтобы исполнить это обещание, данное Господу. Мы вновь закрепились на Ближнем Востоке в последних христианских оплотах Ливана и отвоевали Иерусалим и Святую Землю. За этим последовала борьба за создание нашего королевства на Ближнем Востоке и за то, чтобы население поняло, что святые места должны оставаться под нашим контролем для обеспечения их безопасности."
 france_md.493.a: "Десятый крестовый поход одержал победу!"
 france_md.494.t: "Возрожденная империя"
 france_md.494.d: "Около 150 лет назад Вторая империя Наполеона пала под натиском Пруссии и германских народов, положив начало столетию мести и конфликтов для Франции. Все предсказывали наш медленный упадок как бывшей колониальной державы, но мы, бонапартисты, доказали обратное, отвоевав власть у нестабильной республики и вернув Франции ее былую славу. Это далось нам дорогой ценой, но мы вернули себе границы Первой империи Наполеона I и изгнали вражеские державы. Этой исторической победой над Восьмой коалицией Франция показала миру, что она вернулась, и теперь континентальная система торжествует в Европе."
 france_md.494.a: "Третья попытка — удачная."
 france_md.495.t: "Возвращение колониальной империи"
 france_md.495.d: "Бонапартистские империи всегда стремились к господству над Европой, но колонии также играли огромную роль, от Гаитянского восстания до экспансии Наполеона III в Африку. После падения колониальных империй нас постепенно вытеснили из стран, которые мы когда-то контролировали, и настало время восстановить естественный порядок. Наш император приказал нам подготовиться к возвращению Франции в её бывшие колонии, мобилизовав войска из наших заморских департаментов и регионов, лучше приспособленных к этой среде. Мы будем вторгаться в прибрежные города, чтобы обеспечить безопасность военно-морских баз, прежде чем продвигаться вглубь страны, где климат становится более суровым."
 france_md.495.a: "Те благословенные дни колоний"
 france_md.496.t: "Наш французский сюзерен требует нашей аннексии."
 france_md.496.d: "Нам следовало понимать, что установленный Францией контроль над нашей политикой рано или поздно закончится именно так. Французские власти только что объявили о скором поглощении нашей страны Францией. Это объявление не было неожиданным, Франция давно присматривается к некоторым нашим территориям и, похоже, полна решимости захватить их на этот раз. Они считают, что смогут лучше управлять нашей страной, чем мы. В эти мрачные времена мы должны сделать выбор не только ради нашей независимости, но и ради безопасности нашего народа. Уступить или бороться – вот наши варианты. Что бы мы ни решили, мы должны действовать быстро."
 france_md.496.a: "У нас нет средств, чтобы этому противостоять."
 france_md.496.b: "Эта земля наша, пусть приходят и забирают её."
 france_md.497.t: "Восстания [FROM.GetName] против нашего господства"
 france_md.497.d: "Правительство [FROM.GetName] осуждает нашу попытку аннексии и готово защищать свою независимость любой ценой. Они принимают вассальную зависимость, но отказываются уступить требуемые нами территории, изгоняют нашу администрацию и готовятся к противостоянию с нами. Мы можем подавить это восстание сейчас, чтобы показать им пример, или отложить их наказание на потом, поскольку ничто не мешает нам вернуться."
 france_md.497.a: "Это послужит уроком для них и для всех, кто может поддаться искушению."
 france_md.497.b: "Мы их потом раздавим."
 france_md.498.t: "Франция предлагает инвестировать в нашу отрасль."
 france_md.498.d: "Наши французские партнеры сделали нам заманчивое предложение: Европа хочет переориентировать производственные мощности, которые она может контролировать, поэтому Франция предлагает инвестировать в нашу экономику, помогая создавать заводы на нашей территории, в рамках более широкого проекта по укреплению европейского суверенитета и устойчивости. Это принесет большую пользу нам, а также французам, которые смогут получить долю в нашем капитале и наших компаниях. Стоит ли нам пожертвовать частью своего суверенитета ради помощи нашей промышленности?"
 france_md.498.a: "Где нам нужно подписать?"
 france_md.498.b: "Европе и Франции нет места вмешательству в нашу экономику."
 france_md.499.t: "Франция предлагает инвестировать в нашу инфраструктурную сеть."
 france_md.499.d: "В ходе приятной беседы с нашими французскими партнерами они сделали нам весьма привлекательное предложение. Главная цель Европы — облегчить перемещение людей и товаров между странами ЕС, и они хотели бы помочь нашей стране в этом отношении. Поэтому французское правительство предложило инвестировать в нашу транспортную сеть, помогая модернизировать нашу инфраструктуру. Это предложение является неотъемлемой частью проекта, направленного на повышение европейского суверенитета и оказание помощи государствам-членам в преодолении будущих кризисов. Это предложение было бы очень выгодно для нас, но оно также принесло бы пользу Франции, которая могла бы получить влияние на управление нашей инфраструктурой. Стоит ли нам пожертвовать частью нашего суверенитета ради модернизации нашей инфраструктуры?"
 france_md.499.a: "Где нам нужно подписать?"
 france_md.499.b: "Наша инфраструктура и без них прекрасно функционирует."
 france_md.502.t: "Франция предлагает инвестировать в наш экологический переход."
 france_md.502.d: "В ходе приятной беседы с нашими французскими партнерами они сделали нам весьма заманчивое предложение. Поскольку их долгосрочная цель — сделать Европу более экологичной, они предлагают нам совместно инвестировать в «зеленый» переход. Таким образом, французское правительство предложило нам инвестировать в нашу инфраструктуру по производству возобновляемой энергии. Это предложение было бы очень выгодно для нас, но оно также принесло бы пользу Франции, которая могла бы получить плацдарм в нашей электроэнергетике. Стоит ли нам пожертвовать частью нашего суверенитета ради дальнейшего развития «зеленого» перехода?"
 france_md.502.a: "Где нам нужно подписать?"
 france_md.502.b: "Нам не нужен их экологический переход."
 france_md.520.t: "Фрагментация продолжается."
 france_md.520.d: "Неудачи никогда не случаются поодиночке. По мере того, как наши позиции в опросах падают, наша партия раскалывается: либеральное крыло сплотилось вокруг центристской партии, а министр Эммануэль Макрон создал свою собственную партию, «Республика на марше», чтобы бросить нам вызов. Наше левое крыло тоже откололось, разочарованное нашими результатами в социальных и экономических вопросах, и сплотилось вокруг Жан-Люка Меланшона, чтобы создать свою собственную радикальную левую партию. Эти события катастрофичны, но они также являются признаком того, что мы можем переломить ситуацию и вернуть себе электорат, пока не поздно."
 france_md.520.a: "Проклинать!"
 france_md.521.t: "Французские агенты нарушили нашу систему обороны."
 france_md.521.d: "На рассвете нас разбудили звуки автомобильных гудков и грохот аварий. Улицы нашей столицы парализованы из-за того, что, по всей видимости, является актом саботажа против нашей транспортной инфраструктуры. Наши специалисты делают все возможное, чтобы восстановить порядок, но в результате аварий уже погибли несколько сотрудников полиции, и мы опасаемся, что под угрозой может оказаться и безопасность наших вооруженных сил. Эта атака явно исходит из бонапартистской Франции, которая уже несколько месяцев использует враждебную риторику в отношении нас. Мы должны подготовиться, прежде чем эти мелкие игры, разыгрываемые секретными агентами, станут нормой."
 france_md.521.a: "Будь они прокляты"
 france_md.522.t: "Наши полицейские силы отразили французский рейд."
 france_md.522.d: "Мы с облегчением вздохнули, узнав, что нашим полицейским силам удалось предотвратить крупномасштабный акт саботажа в нашей столице. Противнику удалось скрыться, но худшего удалось избежать. Тем не менее, эта атака стоила жизни двум сотрудникам нашей полиции во время спорадических столкновений на улицах столицы. Эта операция явно исходит от бонапартистской Франции, которая уже несколько месяцев распространяет враждебную риторику в наш адрес. Мы должны подготовиться, прежде чем эти мелкие игры, разыгрываемые секретными агентами, станут нормой."
 france_md.522.a: "Нам не всегда будет так везть."
 france_md.523.t: "Франция провозглашает Третью империю."
 france_md.523.d: "Франция только что объявила о возвращении Империи. Некоторое время назад националистическая монархическая фракция захватила власть во Франции и, очевидно, укрепила свои позиции. Поэтому они организовали грандиозную церемонию, чтобы объявить о возвращении Империи, и теперь это стало главной темой разговоров. Действительно, церемония освещалась СМИ и широко распространялась в социальных сетях. Это торжество — не просто художественное событие, это также демонстрация силы со стороны Франции. Уже несколько месяцев Франция публично демонстрирует стремление к завоеваниям и конфликтам. Поэтому это провозглашение — не конец, а начало: начало осложнений в Европе и во всем мире."
 france_md.523.a: "Мы должны отнестись к этой угрозе серьезно."
 france_md.523.b: "Они уже давно не представляют угрозы."
 france_md.524.t: "Дополнительное финансирование для армии?"
 france_md.524.d: "Наши недавние инвестиции в оборону имели решающее значение для сохранения нашего места в европейской оборонной стратегии, но разве мы не могли сделать больше? Столкнувшись с угрозой возвращения войны в Европу, многие страны-союзники задействовали огромные ресурсы для подготовки своих вооруженных сил к конфликту высокой интенсивности. Возможно, нам следует поступить так же и еще больше инвестировать в наши возможности по производству вооружений."
 france_md.524.a: "Осторожность никогда не бывает лишней."
 france_md.524.b: "Мы уже потратили много денег."
 france_md.525.t: "Ресурсы для достижения наших амбиций"
 france_md.525.d: "Несмотря на наши призывы к французскому народу работать усерднее и избавиться от культуры зависимости, реальность сурова: в нашей стране, несмотря на многочисленную, готовую к работе и талантливую рабочую силу, отсутствуют стабильные рабочие места. Мы могли бы увеличить занятость, вложив средства в стратегические сектора нашей экономики, поскольку ожидание коррекции рынка может занять столетия, или же мы могли бы вместо этого финансировать нашу передовую оборонную промышленность, которая перегружена заказами и не имеет ресурсов для их выполнения, а гражданский сектор оставить на произвол судьбы."
 france_md.525.a: "Нашим гражданам нужны эти рабочие места."
 france_md.525.b: "Наша оборонная промышленность сможет более эффективно использовать эти средства."
 france_md.526.t: "Возобновление экономической активности"
 france_md.526.d: "Годы ультралиберализма ослабили нашу экономику, однако для выживания после выхода из Европейского союза необходима надежная экономика, свободная от санкций ЕС. Мы могли бы инвестировать в капитал французских частных компаний, чтобы побудить их к созданию предприятий во Франции, снизив тем самым государственное вмешательство в восстановление экономики, хотя ничто не гарантирует, что они не будут инвестировать в другие страны, где рабочая сила дешевле. Или же мы могли бы напрямую субсидировать создание и развитие новых предприятий — решение, которое не понравится финансовому сектору, но которое, безусловно, сработает."
 france_md.526.a: "Мы будем инвестировать в рынок, поэтому они будут инвестировать во Францию."
 france_md.526.b: "С гуманистической точки зрения капитализм не предлагает удовлетворительного решения (Шарль де Голль)."
 france_md.527.t: "Расширение нашей поддержки сельских районов"
 france_md.527.d: "Наш проект по оживлению экономики сельских и пригородных районов уже успешно реализуется, и теперь нам необходимо решить, какой будет его следующий шаг: продолжать расширять транспортные связи и создавать рабочие места в менее населенных регионах или обратиться к сельскому хозяйству и зависимым от него секторам, изолированным от основных центров принятия решений и лишенным тех же привилегий. Субсидирование этих секторов улучшит их доступ к центрам производства и потребления и завоюет их расположение."
 france_md.527.a: "Мы продолжим обеспечивать транспортную доступность и создавать рабочие места в пригородах."
 france_md.527.b: "Давайте лучше отдадим эти деньги агропродовольственному сектору. Они найдут им лучшее применение."
 france_md.528.t: "Новая экономика"
 france_md.528.d: "Избавившись от дорогостоящих и неэффективных отраслей, которые сейчас переносятся в другие страны, мы должны найти новую работу для нашего все более квалифицированного, но все еще недостаточно занятого населения. Сектор услуг — наиболее надежный вариант для развитой страны, подобной нашей: он приносит значительный доход, производит мало прямого загрязнения и заполняет пробел между частным сектором и потребителями. Но Франция также известна своими исследованиями, от обороны до медицины и химии, и неоднократные кризисы привели к значительному сокращению финансирования науки. Возможно, нам следует уделять ей больше внимания, субсидируя исследовательские программы."
 france_md.528.a: "Сектор услуг более прибылен и поможет снизить безработицу."
 france_md.528.b: "Мы должны стать частью этого общества знаний."
 france_md.529.t: "Больше рабочих мест или больше услуг?"
 france_md.529.d: "Наши недавние инвестиции в производительные сектора приносят свои плоды: мы остановили спираль обнищания и начали восстанавливать стабильный рынок труда. Мы могли бы продолжать создавать рабочие места, которые принесут пользу будущим поколениям, или же обратиться к восстановлению государственных услуг, которые наши предшественники демонтировали вместе с этими рабочими местами, оставив граждан платить высокие налоги за постоянно сокращающиеся услуги. Более качественное образование сделало бы наших работников более эффективными, а лучшее здравоохранение позволило бы им жить дольше. Должны ли мы снова сосредоточиться на государственных услугах, или рынок труда по-прежнему остается нашим приоритетом?"
 france_md.529.a: "Наш приоритет — создание новых рабочих мест."
 france_md.529.b: "Мы достаточно сделали в сфере трудовых отношений, нам нужно восстановить государственные услуги."
 france_md.530.t: "Переместить наши запасы продовольствия"
 france_md.530.d: "По мере того, как мы готовимся к возвращению наших продуктов питания домой, возникает вопрос: как? Наш агропродовольственный сектор мог бы прокормить нас самостоятельно, но недобросовестная конкуренция вынуждает нас импортировать товары, которые нам не нужны, нанося ущерб планете из-за транспортировки и безответственного производства за рубежом. Мы могли бы ввести тарифные барьеры на продукты питания, которые нам не нужны или которые не соответствуют нашим стандартам, рискуя навлечь на себя гнев наших европейских партнеров и ВТО. Или же мы могли бы оставаться в рамках рыночных правил и субсидировать наш агропродовольственный сектор, чтобы он мог конкурировать и снизить нашу зависимость от импорта. Какое бы решение мы ни приняли, у нас есть средства; это вопрос воли."
 france_md.530.a: "Рыночная конкуренция и свободная конкуренция вредны для наших жителей и нашей планеты."
 france_md.530.b: "Мы должны играть по правилам."
 france_md.531.t: "Франция нарушила законы о свободной торговле."
 france_md.531.d: "Только что из пресс-релиза французского правительства мы узнали, что оно решило вновь ввести таможенные барьеры на импорт продуктов питания. Этот шаг знаменует начало того, что они называют планом локализации своего продовольственного снабжения. Хотя у них есть множество аргументов в пользу этого плана, он нарушает многие законы Всемирной торговой организации и Европейского союза. Франция подписала соглашения о свободной торговле и должна быть обязана их соблюдать. Неизвестно, столкнутся ли они с санкциями, но этот шаг наносит ущерб европейской интеграции. Тем не менее, наши люди ждут от нас ответа на этот вопрос: правильно ли они поступили или нет?"
 france_md.531.a: "Это неприемлемо."
 france_md.531.b: "Нам следует поступить так же."
 france_md.532.t: "Наш экономический суверенитет"
 france_md.532.d: "Освобождение от власти, долгое время контролировавшей нас, имеет свою цену: десятилетия капиталистического правления распродали значительную часть нашей промышленности иностранному капиталу, который теперь может покинуть страну, вынуждая нас вернуть частный сектор под свой контроль, прежде чем он рухнет. Мы могли бы запустить масштабную программу создания рабочих мест, быструю, но дорогостоящую в поддержании, пока строятся новые центры, или создать должности в существующих секторах, что было бы дешевле и экологичнее, если бы они могли поглотить дополнительную рабочую силу."
 france_md.532.a: "Мы сможем создать эти новые рабочие места в течение года."
 france_md.532.b: "Не строя больше зданий, мы можем трудоустроить больше людей на существующих предприятиях."
 france_md.533.t: "На пути к левой коалиции"
 france_md.533.d: "После долгих месяцев переговоров мы нашли общий язык с широким кругом левых партий, которые согласились не выступать против нашего правительства и присоединиться к нашей коалиции в рамках общей программы по построению более справедливой Франции. Это блестящий ход: нашему правительству противостояли партии, которые отказывались признавать его легитимность, и мы сформировали более прочное большинство, не поступаясь своими принципами. Достигнутое соглашение предусматривает небольшое повышение социальных выплат, но мы и так планировали это повышение в любом случае."
 france_md.533.a: "Угроза вотума недоверия ослабевает."
 france_md.534.t: "Другие левые партии отвергают нашу коалицию."
 france_md.534.d: "Сегодня утром депутаты от других левых групп заявили, что не поддержат предложенную нами коалицию, сославшись на слишком много различий между нашими программами и приоритетами. Это плохая новость для правительства, которое и без того с трудом удерживает свои позиции в расколотом Национальном собрании. Мы все еще можем вести переговоры по законопроектам, хотя каждый раз будем испытывать давление со всех сторон. Эти партии действовали безответственно, и хотя часть общественного мнения поддерживает наш единый подход, этого может быть недостаточно для гарантированного выживания нашего правительства."
 france_md.534.a: "Это была доблестная попытка."
 france_md.535.t: "Социалистическая партия вступает в правительство"
 france_md.535.d: "После долгих месяцев переговоров мы достигли взаимопонимания с Социалистической партией, которая согласилась прекратить противодействие нам и присоединиться к правительству в рамках совместной программы, во многом основанной на нашей собственной, поскольку они не могли навязать свою. Это блестящий ход: нашему правительству бросали вызов партии, которые отказывались признавать его легитимность, и мы создали более стабильное большинство с минимальными затратами. Эта договоренность требует инвестиций в частный сектор, что не совсем соответствует ожиданиям нашего электората, но это того стоит, если позволит нам принимать законы."
 france_md.535.a: "Леон Блюм был бы горд."
 france_md.536.t: "Социалистическая партия отказывается войти в правительство."
 france_md.536.d: "Сегодня утром депутаты-социалисты объявили, что не поддержат наше коалиционное предложение, сославшись на слишком много различий между нашими программами, и явно по-прежнему возмущены нашими нападками на них во время предвыборной кампании. Это плохая новость для правительства, которое и без того с трудом удерживает свои позиции в расколотом Национальном собрании. Мы все еще можем вести переговоры по законопроектам, хотя каждый раз будем находиться под давлением со всех сторон. Эти партии действовали безответственно, и хотя часть общественного мнения поддерживает наш единый подход, этого может быть недостаточно для гарантированного выживания нашего правительства."
 france_md.536.a: "Леон Блюм переворачивается в гробу."
 france_md.537.t: "Семестр, который нужно завершить"
 france_md.537.d: "Срок полномочий президента еще не истек, и партийный аппарат уже спорит о том, как его использовать. Мы можем сейчас править под эгидой действующего президента и принять его программу как свою собственную, или же подождать и дождаться выборов 2002 года, которые определят, какая партия возглавит Францию, прежде чем мы примем решение по поводу какой-либо из них."
 france_md.537.a: "Управляйте сейчас, под руководством действующего президента."
 france_md.537.b: "Дождитесь выборов 2002 года."
 france_md.538.t: "Жак Ширак уходит из политики."
 france_md.538.d: "После поражения его партии на президентских выборах бывший президент Ширак решил завершить свою политическую карьеру. Пройдя путь от министра до президента, он стал свидетелем перемен во Франции в период Четвертой и Пятой республик. Однако трудности, с которыми столкнулась его партия во время предвыборной кампании, были также связаны с его политикой, которая не всем пришлась по вкусу. Тем не менее, если и есть какой-то урок, который можно извлечь из его неудачи, то это то, что ситуация изменилась; мир уже не тот, и мы больше не можем мыслить так, как раньше, не рискуя. Все, что нам остается сейчас, это надеяться, что у нас все получится лучше, чем у него."
 france_md.538.a: "Это даст ему время съесть яблоки."
 france_md.539.t: "Падение менгира"
 france_md.539.d: "Жан-Мари Ле Пен, основатель и бывший лидер нашей партии, снова в центре внимания по негативным причинам: после многих лет отрицания Холокоста и антисемитских высказываний он теперь отказывается назвать маршала Петена предателем. После ухода с поста он вступил в конфликт с новым направлением партии по вопросам от пенсий до конфликтов прошлого века, и его заявления мешают нам наконец занять свое место в республиканском мейнстриме. Мы могли бы исключить его, хотя это рискует оттолкнуть старую гвардию, разделяющую его взгляды. Действительно ли мы хотим преобразовать нашу партию в соответствии с республиканскими стандартами, или рискуем потерять свою идентичность?"
 france_md.539.a: "Он стал обузой, мы должны исключить его из партии."
 france_md.539.b: "Просто напомните ему, чтобы он вел себя хорошо."
 france_md.540.t: "От фронта до митинга"
 france_md.540.d: "После многочисленных внутренних дебатов и совещаний внутри партии, высокопоставленные деятели Национального фронта объявили о значительных изменениях в политике и статусе партии. Теперь партия будет называться «Национальное объединение» и явно полна решимости избавиться от ярлыка крайне правой партии. С этой целью они объявили об исключении из партии многочисленных активистов, считавшихся слишком экстремистскими, и подтвердили свою приверженность сохранению членства в Европейском союзе. Это событие знаменует собой заключительный этап упадка старого Национального фронта, поскольку он перестраивается, чтобы выглядеть более приемлемым. Хотя эти изменения незначительны, мы должны сделать все возможное, чтобы общественность не поверила, что это что-то меняет."
 france_md.540.a: "Тем не менее, они опасны."
 france_md.541.t: "Падение Святого Престола"
 france_md.541.d: "В настоящее время Ватикан оккупирован иностранной державой. Поэтому мы не можем гарантировать безопасность папства, пока Ватикан остается под контролем наших противников. Тем не менее, наша страна уже предоставила папству пристанище в Папском дворце в Авиньоне. Поэтому ничто не мешает нам перевести Коллегию кардиналов и нынешнего Папу в Авиньон. Это станет знаменательным событием для христианского мира во всем мире, но, поскольку Ватикан оккупирован, только мы обладаем достаточной силой, чтобы обеспечить защиту Церкви, как это всегда делало наше Королевство."
 france_md.541.a: "Папство будет в безопасности здесь, с нами."
 france_md.550.t: "Николя Саркози победил на президентских выборах."
 france_md.550.d: "Второй тур подтвердил прогнозы опросов. Николя Саркози, министр внутренних дел, заработавший репутацию благодаря жесткой линии в борьбе с городскими беспорядками, привел Союз за народное движение в Елисейский дворец с явным преимуществом над Сеголен-Рояль. Избирательная кампания строилась на принципах труда, авторитета и национальной идентичности, а явка избирателей стала самой высокой за последние десятилетия. Новый президент обещает разрыв с эпохой Ширака: пенсионную реформу, ужесточение рынка труда и возвращение Франции к интегрированному управлению Атлантическим альянсом. Его оппоненты предупреждают, что этот разрыв сильнее всего ощутят те, кто меньше всего может себе это позволить."
 france_md.550.a: "Чем больше работаешь, тем больше зарабатываешь."
 france_md.551.t: "Франсуа Олланд победил на президентских выборах"
 france_md.551.d: "После пяти лет президентства Саркози социалисты вернулись к власти. Франсуа Олланд, которого долгое время считали скорее партийным руководителем, чем государственным деятелем, одержал победу во втором туре, опираясь на платформу финансовой справедливости, пересмотренного европейского бюджетного соглашения и вывода войск из Афганистана. Финансовый кризис и чрезвычайная ситуация в еврозоне доминировали в каждой дискуссии, и уходящему президенту не удалось избежать критики по поводу своей деятельности. Новая администрация унаследовала стагнирующую экономику, напряженный дефицит бюджета и европейское партнерство, в котором от Франции ожидается лидерство, а не противодействие."
 france_md.551.a: "Перемены происходят прямо сейчас."
 france_md.552.t: "Эммануэль Макрон победил на президентских выборах."
 france_md.552.d: "Старая партийная система рухнула. Ни социалисты, ни республиканцы не дошли до второго тура, и во втором туре развернулась борьба между движением, основанным всего год назад, и Национальным фронтом. Эммануэль Макрон, бывший инвестиционный банкир и министр экономики, одержал уверенную победу, опираясь на платформу либерализации рынка труда, европейской интеграции и политику, которая не претендует на принадлежность ни к правому, ни к левому крылу. Теперь его движение сталкивается с парламентскими выборами без парламентской базы и местного политического аппарата, а его оппоненты с обоих флангов уже организуют протесты на улицах."
 france_md.552.a: "Ни вправо, ни влево."
 france_md.553.t: "Эммануэль Макрон переизбран"
 france_md.553.d: "Во втором туре выборов президент противостоял Национальному собранию, и во второй раз республиканский фронт удержал победу, хотя и с меньшим отрывом, чем пять лет назад. Избирательная кампания была омрачена войной в Европе, ценами на энергоносители и пенсионной реформой, которую президент пообещал провести, несмотря ни на что. Он стал первым французским президентом за двадцать лет, выигравшим второй срок, и первым, кто сделал это при поддержке крайне правых, которые никогда еще не были так близки к власти."
 france_md.553.a: "Второй срок, и более узкий."
 france_md.503.t: "Противодействие [FRA.GetLeader]: какова тенденция?"
 france_md.503.d: "По мере приближения к концу срока полномочий президента [FRA.GetLeader], президентская кампания вступает в свою заключительную стадию, и баланс сил на выборах становится очевидным. Фаворитом является Лионель Жоспен, занимавший пост премьер-министра при Шираке, проводивший социал-демократическую политику в соответствии с европейскими стандартами, но дистанцировавшийся от социалистической традиции: современный, но не социалистический. Различные левые кандидаты от «зеленых» и Французской коммунистической партии не обладают достаточными ресурсами для победы в первом туре, но все же могут набрать обороты. Является ли левое крыло в целом явным фаворитом, или же раскол в его рядах может вывести другого кандидата во второй тур?"
 france_md.503.a: "Левым удаётся завоевать симпатии избирателей."
 france_md.503.b: "Ни одному из кандидатов левых взглядов не удалось заручиться той поддержкой, на которую они рассчитывали."
 france_md.986.t: "Лионель Жоспин подвергается критике."
 france_md.986.d: "Хотя Лионель Жоспен является фаворитом левых на предстоящих выборах, его предвыборная программа не пользуется единодушной поддержкой среди левых, которые считают ее слишком либеральной и слишком похожей на программу Ширака. Ему противостоит Французская коммунистическая партия; хотя после окончания холодной войны она стала лишь тенью себя прежней, у нее все еще есть союзники среди радикальных левых, и она может привлечь тех, кто разочарован вторым сроком бывшего президента Миттерана. Она могла бы критиковать Жоспена за его сдвиг в сторону либерализма, но сделает ли она это?"
 france_md.986.a: "Филиппинская коммунистическая партия решила не нападать на Лионеля Жоспена."
 france_md.986.b: "Французской коммунистической партии удалось завоевать голоса левых избирателей."
 france_md.986.c: "Безрезультатная атака со стороны ПКФ"
 france_md.987.t: "Лионелю Жоспину досталось далеко впереди"
 france_md.987.d: "В левом лагере неоспорима победа Лионеля Жоспена и Социалистической партии. Хотя ранее он подвергался критике, его оппоненты не в состоянии бросить ему вызов или выйти во второй тур. Согласны мы с его программой или нет, во втором туре президентских выборов сразится именно он с [FRA.GetLeader]."
 france_md.987.a: "Иначе и быть не могло."
 france_md.988.t: "Возрождение коммунистов"
 france_md.988.d: "Нападки на Жоспена из-за его связей с левыми были правильным решением. Голоса социалистов раскололись между левыми и центристами, что придало Французской коммунистической партии (ФКП) тот авторитет, которого ей не хватало для того, чтобы возглавить оппозицию либеральной и консервативной политике, которая слишком долго господствовала. ФКП заключила союз с другими левыми партнерами, такими как Революционная коммунистическая лига и «Рабочая борьба». Однако центристы, недовольные [FRA.GetLeader] Они предпочли бы Жоспена радикальному альянсу и, вероятно, проголосуют против нас во втором туре. Возможно, мы сможем организовать местные инвестиции в их города в обмен на их молчание."
 france_md.988.a: "Центристы воздержатся от голосования."
 france_md.988.b: "Центристы призовут к созданию единого фронта против крайне левых."
 france_md.989.t: "Неожиданный фаворит"
 france_md.989.d: "Завершение этой президентской кампании оказалось неспокойным для многих партий. После нападок Французской коммунистической партии на Лионеля Жоспена коммунисты и социалисты развязали неустанную информационную войну, и поскольку ни одна из сторон не смогла убедительно представить свою позицию, левоцентристский электорат обратился к менее противоречивому и более взвешенному кандидату. Партия зеленых воспользовалась возможностью представить себя как голос спокойствия и разума в разгар бури. Поэтому весьма вероятно, что «зеленые» выйдут во второй тур, где им предстоит столкнуться с бывшим президентом, ослабленным к концу своего срока."
 france_md.989.a: "Кто бы мог в это поверить?"
 france_md.990.t: "Ни левые, ни правые"
 france_md.990.d: "Консерваторы уже вышли во второй тур, а левые находятся в состоянии разлада, поэтому победа бывшего президента кажется вполне вероятной, хотя неопределенность сохраняется. Некоторые французы устали от разделения на левых и правых, которое формировало политику на протяжении десятилетий и больше не соответствует эпохе, ориентированной на стабильность и европейскую интеграцию. Поэтому у либерального Союза за французскую демократию есть аргументы: политика Ширака в поддержку независимости больше не имеет большого веса в мире, где появляются новые державы и блоки. Либеральный центр должен сыграть свою роль, но сможет ли он убедить избирателей в этой новой реальности?"
 france_md.990.a: "Либералам удастся привлечь внимание людей."
 france_md.990.b: "Франция по-прежнему привержена своему суверенитету."
 france_md.991.t: "Лагерь суверенистов расколот."
 france_md.991.d: "Поскольку либеральный центр не смог убедительно представить свои аргументы, избиратели, уставшие от разделения на левых и правых, обратились к сторонникам суверенитета. Однако этот лагерь говорит двумя голосами. «Объединение за Республику» выводит голлистскую традицию национальной независимости в мейнстрим, делая её респектабельной и способной управлять страной, в то время как «Национальный фронт» предлагает более жёсткую линию, которую устоявшиеся партии сдерживали на протяжении двух десятилетий. Обе партии претендуют на один и тот же разочарованный электорат. От того, кто из них выйдет во второй тур, будет зависеть, останется ли французский евроскептицизм прерогативой правящих правых или же он полностью выйдет из-под «санитарного кордона»."
 france_md.991.a: "Голлистская традиция по-прежнему пользуется поддержкой сторонников суверенитета."
 france_md.991.b: "Национальный фронт воспользуется недовольством."
 france_md.510.t: "Никто не мог этого предвидеть."
 france_md.510.d: "Учитывая неспособность партий привлечь внимание избирателей, ни одна из них не обладает достаточной силой, чтобы выйти во второй тур против [FRA.GetLeader]. Воспользовавшись исчезновением своих соперников из поля зрения общественности, Национальный фронт избежал их скандалов и, несмотря на своего лидера Жан-Мари Ле Пена, теоретически может пройти в следующий тур. Однако это остается маловероятным: Лионель Жоспин по-прежнему является фаворитом и наверняка проиграет [FRA.GetLeader]. Но если Национальный фронт выйдет во второй тур, как отреагируют другие партии?"
 france_md.510.a: "Стороны не будут обеспокоены ростом экстремизма."
 france_md.510.b: "Все партии призовут избирателей проголосовать против Национального фронта."
 france_md.511.t: "День выборов"
 france_md.511.d: "После нескольких месяцев бурной избирательной кампании, полной неожиданных поворотов, наконец-то настало время французских выборов. Это лишь первый тур, призванный сузить круг кандидатов до двух, получивших наибольшую поддержку французской общественности. Затем состоится второй тур, чтобы определить победителя, если ни один из кандидатов не получит большинства голосов."
 france_md.511.a: "Давайте пойдем и проголосуем!"
 france_md.512.t: "По прогнозам, Национальный фронт одержит победу на президентских выборах."
 france_md.512.d: "К всеобщему удивлению, Национальный фронт одержал победу в первом туре, хотя все прогнозы указывали на прямое противостояние между Жоспеном и [FRA.GetLeader]. Учитывая неспособность других кандидатов завоевать расположение избирателей, Фронт прошел во второй тур, и для [FRA.GetLeader] дела обстоят неважно: другие партии не призвали избирателей поддержать его, поскольку его политика слишком спорна для некоторых. Ожидается, что часть электората выступит против крайне правого кандидата, но победа над Ле Пен, которая позиционирует себя как антисистемный кандидат, далеко не гарантирована."
 france_md.512.a: "Что только что произошло?"
 france_md.513.t: "Национальный фронт вышел во второй тур"
 france_md.513.d: "К всеобщему удивлению, Национальный фронт одержал победу в первом туре, хотя все прогнозы указывали на прямое противостояние между Жоспеном и [FRA.GetLeader]. Учитывая неспособность других кандидатов завоевать расположение избирателей, Фронт прошел во второй тур. К счастью, победителем должен стать [FRA.GetLeader]: политические партии и гражданское общество, шокированные выходом крайне правой партии во второй тур, призвали к массовому голосованию против Ле Пен. По всей стране прошли масштабные демонстрации в поддержку уходящего президента. Это историческое событие; будем надеяться, что оно единственное."
 france_md.513.a: "Как мы вообще дошли до этой ситуации?"
 france_md.514.t: "Партия PCF объявлена ​​победителем президентских выборов."
 france_md.514.d: "К всеобщему удивлению, Французская коммунистическая партия одержала победу в первом туре, спустя несколько месяцев после того, как находилась в самом низком положении со времен окончания холодной войны. Слабости кандидата Жоспена и альянс с радикальными левыми позволили ФКП мобилизовать левых и обеспечить себе явное лидерство во втором туре, при этом социалисты и центристы договорились не противостоять ей при условии, что она не выйдет из ЕС. Ее лидер уравновешивал оппозицию либеральному порядку с реформизмом, чтобы не оттолкнуть центристов. Победа ФКП не вызывает сомнений, но сможет ли она сохранить свою коалицию?"
 france_md.514.a: "Наконец-то насталы лучшие времена."
 france_md.515.t: "PCF прошла во второй раунд"
 france_md.515.d: "К всеобщему удивлению, Французская коммунистическая партия одержала победу в первом туре, всего через несколько месяцев после того, как находилась в самом низком положении со времен окончания холодной войны. Слабости кандидата Жоспена и альянс с радикальными левыми позволили ФКП обеспечить себе место во втором туре. Однако ее победа не является полной: центристы объявили, что будут голосовать за [FRA.GetLeader], рассматривая триумф радикальных левых как плохой знак для европейской интеграции и рынков. Второй тур еще не состоялся, но существует высокая вероятность того, что [FRA.GetLeader] снова одержит победу."
 france_md.515.a: "Это было на грани."
 france_md.516.t: "РПФ вышла во второй тур"
 france_md.516.d: "К всеобщему удивлению, уходящий президент выбыл из второго тура, проиграв собственной партии: голлисту Шарлю Паскуа удалось переманить достаточно консерваторов и сторонников суверенитета справа, чтобы сорвать кампанию [FRA.GetLeader]. Однако РПФ не одинока во втором туре. Там ей предстоит встретиться с Лионелем Жоспеном, кандидатом-социалистом, который вышел во второй тур, несмотря на внутренние разногласия слева. Эта борьба будет ожесточенной, ведь это не просто противостояние социализма и консерватизма: на следующей неделе французский народ решит, хочет ли он больше или меньше Европы."
 france_md.516.a: "Суверенитет восторжествует"
 france_md.516.b: "Протестное голосование по-прежнему остается в меньшинстве."
 france_md.517.t: "Объединенный демократический фронт (UDF) вышел во второй раунд"
 france_md.517.d: "Объединение проевропейски настроенных избирателей вокруг Объединенного демократического фронта (ОДФ) позволило партии выйти во второй тур. Социалисты были не единственными, кто продвигал идею Европейского союза, и либералы были ближе к либеральным ценностям Европейского союза. Люди часто предпочитают оригинал имитации. Таким образом, ОДФ удалось присоединиться к действующему президенту во втором туре. Это, следовательно, противостояние между политикой Ширака, выступающего за независимость, и позицией либералов «Европа любой ценой». Эти выборы, вероятно, будут напряженными, поскольку основные блоки сами глубоко разделены по этому вопросу. К счастью, нам не придется долго ждать, поскольку второй тур уже не за горами."
 france_md.517.a: "Старого консерватора сдерживают."
 france_md.517.b: "Программа Объединенного демократического фронта (UDF) оказалась слишком либеральной для избирателей."
 france_md.518.t: "«Зелёные» вышли во второй раунд"
 france_md.518.d: "После кампании между левыми партиями «зелёным», к всеобщему удивлению, удалось пройти во второй тур. Их социальная и экологическая программа находится на переднем крае прогресса, и, сохранив хладнокровие в условиях столкновений между Французской коммунистической партией и Социалистической партией, они стали олицетворением самого мудрого и справедливого решения. Теперь они присоединяются к уходящему президенту во втором туре. Борьба, вероятно, будет ожесточенной, но на этот раз внутри каждого блока наблюдается единодушие: левые голосуют за прогрессивизм, правые — за консерватизм, и столкновение на следующей неделе будет в равной степени касаться как экологических, так и социальных вопросов."
 france_md.518.a: "Устаревшее, консервативное программное обеспечение больше не отвечает вызовам нашего тысячелетия."
 france_md.518.b: "Окружающей среде пока не уделяется достаточного внимания."
 france_md.519.t: "Лионель Жоспин вышел во второй раунд"
 france_md.519.d: "Как и предсказывали все опросы, кандидат от социалистов без особых проблем прошёл во второй тур. Его современная, проевропейская программа завоевала поддержку как социалистов, так и центристов, обеспечив ему сильную электоральную базу, в то время как более радикальные левые партии, глубоко расколотые, не представляли угрозы для бывшего премьер-министра. Теперь на этой неделе ему предстоит встретиться со своим соперником, снова столкнувшись с прогрессивизмом и консерватизмом. Но опросы показывают близкие результаты, и Жоспину может понадобиться поддержка левых партий, поскольку РПР может извлечь выгоду из усиления влияния правых групп, не желающих принять президента-социалиста."
 france_md.519.a: "Жоспину удаётся завоевать расположение остальных левых."
 france_md.519.b: "Жоспин не смог привлечь на свою сторону избирателей левых взглядов, поскольку его программа была слишком либеральной."
 FRA_Macron_eco: "Закон Макрона"
 FRA_Macron_eco_desc: "Мы решили следовать политике, изложенной нашим министром финансов Эммануэлем Макроном. Закон, который упростит инвестиции и занятость, одновременно сократив государственные расходы."
 FRA_Ferrand_eco: "Закон Ферранда"
 FRA_Ferrand_eco_desc: "Мы решили следовать политике, изложенной нашим министром финансов Оливье Ферраном. Закон, который упростит инвестиции и занятость, одновременно сократив государственные расходы."
 FRA_ineluctable_collapse: "Разваливающаяся коалиция"
 FRA_ineluctable_collapse_desc: "Наша партия и наша коалиция разваливаются; мы должны быстро это исправить, пока не стало слишком поздно!"
 FRA_manif_pour_tous: "La Manif pour Tous"
 FRA_manif_pour_tous_desc: "Сотни тысяч людей ежемесячно выходят на улицы, консервативное движение, которое правые не смогли создать за двадцать лет, и правящая партия, которой теперь приходится принимать законы через него."
 FRA_grand_debat: "Le Grand Débat National"
 FRA_grand_debat_desc: "Десять тысяч собраний в мэрии, два миллиона пожертвований и пакет уступок, которого хватило бы, чтобы опустошить кольцевые развязки. Мир был реальным. Как и счет."
 FRA_bassin_minier: "Обязательство Бэссен-Минье"
 FRA_bassin_minier_desc: "В старом угольном бассейне и на Мидие вновь зажгли печи и открыли новые шахты. Обещание сдерживает крайне правых до тех пор, пока оно выполняется."
 FRA_resist_inevitable: "Усилия по стабилизации"
 FRA_resist_inevitable_desc: "Упадок не является необратимым. Наши боевики снова стоят у порога, и отток населения от нас замедлился."
 FRA_resist_inevitable2: "Усилия по стабилизации"
 FRA_resist_inevitable2_desc: "Кровопролитие прекратилось. Мы стабилизировали партию и переключили внимание на промышленную базу, от которой зависят наши избиратели."
 FRA_resist_inevitable3: "Усилия по стабилизации"
 FRA_resist_inevitable3_desc: "Мы пережили некрологи. Партия вновь стоит на твердой почве, имея прочную базу и программу, на которую теперь должны ответить наши соперники."
 FRA_socialism_renew: "Социализм обновлен"
 FRA_socialism_renew_desc: "Мы восстановили легитимность нашей партии на прочном фундаменте. Будущее еще впереди."
 FRA_pension_reform: "Пенсионная реформа"
 FRA_pension_reform_desc: "В свете бюджетного кризиса, с которым мы столкнулись, нам пришлось повысить пенсионный возраст для наших граждан; они были недовольны этим, но нам пришлось это сделать."
 FRA_french_rearmament: "Фаза 1 перевооружения"
 FRA_french_rearmament_desc: "В условиях возобновления напряженности в Европе у нас нет иного выбора, кроме как перевооружиться, чтобы предотвратить худшее."
 FRA_french_rearmament2: "Фаза 2 перевооружения"
 FRA_french_rearmament2_desc: "Обучить больше солдат недостаточно; мы должны нарастить наши возможности по производству оружия."
 FRA_french_rearmament3: "Успешное перевооружение"
 FRA_french_rearmament3_desc: "Наше население и наши вооруженные силы готовы к крупномасштабному конфликту."
 french_nuclear_expert: "Французские эксперты по ядерной энергетике"
 french_nuclear_expert_desc: "Мы приняли помощь от французских экспертов в области ядерных технологий. Они помогут нам достичь энергетической независимости."
 french_dissuasion: "Французское ядерное сдерживание"
 french_dissuasion_desc: "Мы согласились принять защиту Франции и Европейского союза в случае конфликта с враждебной державой."
 FRA_Our_project: "Наш проект для Франции"
 FRA_Our_project_desc: "Несмотря на первоначальное сопротивление общественности, она пришла к пониманию того, что все наши действия должны быть направлены на защиту будущего Франции. Сейчас, как никогда прежде, мы защищены от экономических и геополитических потрясений. И так будет еще долгое время."
 FRA_french_independant1: "Наш собственный курс"
 FRA_french_independant1_desc: "Франция не подчинится ни одному из блоков. Отделение позволит нам завоевать расположение всех остальных держав, которые отказываются выбирать себе хозяина."
 FRA_french_independant2: "Отвечает без капитала"
 FRA_french_independant2_desc: "Наш отказ от присоединения превратился в устоявшуюся политику. Ни Вашингтон, ни Москва теперь не ждут наших голосов, и неприсоединившийся мир относится к нам как к своим."
 FRA_french_independant3: "Независимость под оружием"
 FRA_french_independant3_desc: "Независимость перестала быть дипломатической позицией и превратилась в оборонительную доктрину. Нация, которая никому не подотчетна, должна уметь самостоятельно отстаивать свои права, и наша теперь может это делать."
 FRA_NATO_support: "Поддержка НАТО"
 FRA_NATO_support_desc: "Подтверждая свою поддержку альянса, мы наладили партнерские отношения с другими странами-членами."
 FRA_entente_china: "Настроенность на Китай"
 FRA_entente_china_desc: "Мы заключили с Китаем соглашения, направленные на упрощение торговых отношений между нашей страной и Китаем."
 FRA_regulation: "Регулирование рынка"
 FRA_regulation_desc: "Согласившись регулировать рынок и его деятельность, мы сможем избежать будущих кризисов."
 FRA_eternal_fra: "Вечная Франция"
 FRA_eternal_fra_desc: "Мы приближаемся к завершению нашей программы, будучи уверенными, что показали миру, что Франция вернулась и никогда не исчезнет с международной арены."
 FRA_europhile_anger_idea: "Проевропейские демонстрации"
 FRA_europhile_anger_idea_desc: "Некоторые представители нашего населения не хотят выходить из Европейского союза. Это продлится лишь некоторое время, но мы должны убедиться, что французский народ понимает, что это единственный путь вперед."
 FRA_EU_Retaliate: "Восстановление экономики"
 FRA_EU_Retaliate_desc: "Выход из Европейского союза поставил нас в сложное экономическое положение, но мы обязательно восстановимся, чего бы это ни стоило."
 FRA_EU_Retaliate2: "Первоначальное восстановление"
 FRA_EU_Retaliate2_desc: "Наши усилия начинают приносить плоды; наша экономика восстанавливается, и на этот раз никто не будет оказывать на нас давление или мешать нам распоряжаться своими деньгами по своему усмотрению."
 FRA_russian_cooperation1: "Российское сотрудничество"
 FRA_russian_cooperation1_desc: "Российское правительство согласилось поделиться с нами своим промышленным опытом. Пусть это сотрудничество продолжится."
 FRA_russian_cooperation2: "Российское партнерство"
 FRA_russian_cooperation2_desc: "Российское правительство согласилось поделиться с нами своим промышленным и военным опытом. Пусть это сотрудничество продолжится."
 FRA_a_certain_idea: "Определенное представление о Франции"
 FRA_a_certain_idea_desc: "Мы подошли к концу нашего пути. Мы спасли Францию ​​от оттеснения на второй план в угоду Европе. Независимость Франции обеспечена. Наш господин Шарль де Голль гордился бы нами."
 FRA_blocade: "Нарушенные торговые потоки"
 FRA_blocade_desc: "Мы отказались поддаться шантажу Франции, поэтому они делают все возможное, чтобы помешать поставкам товаров из других стран Европейского союза к нам."
 FRA_shocking: "Разочарованное население"
 FRA_shocking_desc: "Наши люди с большим энтузиазмом восприняли план создания Шестой республики, но в итоге мы решили сохранить конституцию в её первоначальном виде. Это их не устроило."
 FRA_draft6threp: "Политическая нестабильность"
 FRA_draft6threp_desc: "Наше стремление к радикальным изменениям конституции нашей республики вызвало огромный энтузиазм среди населения. Это открывает перед людьми новые горизонты. Однако это также прокладывает путь для возникновения новых политических движений, которые не всегда будут нам на пользу."
 FRA_fail6threp: "Провал Реформации"
 FRA_fail6threp_desc: "Нам не удалось освободить наш народ от Пятой республики; в конечном итоге он потерял надежду перед лицом трудностей в достижении консенсуса. Возможно, нам удастся изменить наши законы, но для нашего народа мы не сможем принести те перемены, на которые он надеялся."
 FRA_ecological_transition: "Обеспечить экологический переход"
 FRA_ecological_transition_desc: "Чтобы обеспечить будущее для грядущих поколений, нам необходимо защитить окружающую среду. Для этого мы должны изменить способы потребления и производства."
 FRA_insoumission: "L'Insoumission"
 FRA_insoumission_desc: "Мы успешно реализовали программу, благодаря которой были избраны. Мы сделали Францию ​​более социально ориентированной, экологически сознательной и гуманистической, чем когда-либо прежде. Но нам еще многое предстоит сделать, и мы примем этот вызов. Мы должны добиться еще лучших результатов."
 FRA_eu_social_climate: "Социальные и экологические реформы"
 FRA_eu_social_climate_desc: "Мы решили следовать примеру организации La France Insoumise. Наши сотрудники вдохновлены их примером. Хотя это и сказывается на наших финансах, это можно рассматривать как долгосрочную инвестицию."
 FRA_research_boost: "Инвестиции в исследования"
 FRA_research_boost_desc: "Мы вложили значительные средства в исследования и образование, чтобы будущие поколения были еще лучше подготовлены к решению современных проблем. В долгосрочной перспективе это должно окупиться."
 FRA_refit_network: "Модернизация нашей транспортной сети"
 FRA_refit_network_desc: "Для оптимизации грузоперевозок и пассажирских перевозок нам необходимо в первую очередь модернизировать нашу транспортную сеть. Для этого мы выделили необходимые ресурсы."
 FRA_eden_garden: "Наш Эдемский сад"
 FRA_eden_garden_desc: "Приложив все усилия для защиты нашей страны и всего мира от разрушительных последствий изменения климата, мы заложили основы общества, готового к вызовам нашего тысячелетия. Борьба с изменением климата потребует дальнейших усилий, но мы сделали все возможное, чтобы возглавить это движение."
 FRA_eu_green_reform: "Экологические реформы"
 FRA_eu_green_reform_desc: "Мы решили последовать примеру французских «зеленых» и инвестировать в «зеленый» переход. Хотя это и замедлит экономический рост нашей страны, это инвестиция в будущие поколения."
 FRA_EU_transit: "Фонд поддержки экологического перехода"
 FRA_EU_transit_desc: "Мы согласились принять участие в фонде поддержки экологического перехода. Эта инициатива была запущена французскими «зелеными» и направлена ​​на то, чтобы помочь нам осуществить переход от углеродной экономики к низкоуглеродной."
 FRA_eu_ban_fossile: "Постепенный отказ от ископаемого топлива"
 FRA_eu_ban_fossile_desc: "Мы находимся в процессе поэтапного отказа от ископаемого топлива. Наши автомобили будут работать на электричестве, а ископаемое топливо будет использоваться лишь в незначительных целях. Этот переход, инициированный французскими «зелёными», будет дорогостоящим. Но это инвестиция в наше будущее и в нашу независимость от нефтедобывающих стран."
 FRA_regulation_agra: "Сельскохозяйственные правила"
 FRA_regulation_agra_desc: "Мы согласились соблюдать правила Европейского союза в отношении производства продуктов питания. Это был наш единственный вариант, если мы не хотели потерять ключевого торгового партнера."
 FRA_regulation_indus: "Промышленные правила"
 FRA_regulation_indus_desc: "Мы согласились соблюдать правила Европейского союза в отношении производства товаров. Это был наш единственный вариант, если мы не хотели потерять ключевого торгового партнера."
 FRA_regulation_fuel: "Правила добычи нефти"
 FRA_regulation_fuel_desc: "Мы согласились соблюдать правила Европейского союза по добыче топлива. Это был наш единственный вариант, если мы не хотели потерять ключевого торгового партнера."
 FRA_EU_rail: "Создание европейской транспортной сети"
 FRA_EU_rail_desc: "Мы договорились помочь Франции и остальным странам Европейского союза в совместной работе по созданию более совершенной транспортной сети для облегчения торговли и оптимизации перевозки товаров."
 FRA_eu_pcf_reform: "Покупка социального мира"
 FRA_eu_pcf_reform_desc: "Мы согласились пойти на уступки нашим радикальным левым после того, как они начали проявлять активность после победы коммунизма во Франции. Мы дали им то, чего они хотели, и теперь им следует замолчать."
 FRA_fr_military_assistance: "Французская военная помощь"
 FRA_fr_military_assistance_desc: "Мы приняли помощь Франции в подготовке наших вооруженных сил к высокоинтенсивному конфликту с Россией. В тот день, когда они пересекут нашу границу, мы будем готовы."
 FRA_european_internationale: "Европейский международный"
 FRA_european_internationale_desc: "Мы заключили союз с другой коммунистической державой в Европе. Вместе мы раз и навсегда победим капитализм и фашизм."
 FRA_international_will_be_humankind: "Интернационалом станет человеческая раса."
 FRA_international_will_be_humankind_desc: "Нам удалось укрепить с трудом завоеванную власть. Мы совершили невозможное: мы обеспечили прочную победу коммунизма во Франции. Предстоит еще многое сделать, но мы заложили прочный фундамент для борьбы с капитализмом и фашизмом во Франции."
 FRA_eu_FN_reform: "Обеспечение безопасности"
 FRA_eu_FN_reform_desc: "Мы положительно отреагировали на призыв нашего народа к реализации национальных преференций и борьбе с нестабильностью. Хотя эти реформы являются следствием роста влияния крайне правых сил в Европе, они также укрепляют нашу способность контролировать наше население, что является положительным моментом."
 FRA_nuke_boost: "Ядерное превосходство"
 FRA_nuke_boost_desc: "Атомная энергетика обеспечивает нас энергией уже несколько десятилетий; это фантастический способ производства низкоуглеродной энергии по низкой цене. Нам просто нужно усилить мониторинг этих реакторов, чтобы гарантировать, что ничего серьезного не произойдет."
 FRA_Boreal_Space: "Пространство Бореаль"
 FRA_Boreal_Space_desc: "«Бореальское пространство» — это партнерство между российской сферой влияния и франкосферой, целью которого является интеграция России в европейский альянс. Наша сегодняшняя цель — противостоять ультраглобалистской угрозе, врагу, которого мы разделяем."
 FRA_france_for_french: "Франция для французов"
 FRA_france_for_french_desc: "С момента основания нашей организации нам приходилось противостоять фракции, выступающей за иммиграцию, которая всегда была едина в противостоянии нам. Но теперь, когда мы завершили нашу программу, мы продемонстрировали свою способность руководить Францией и направлять её к её предназначению; любое дальнейшее сопротивление теперь бессмысленно."
 FRA_red_purges: "Чистка офицерского корпуса"
 FRA_red_purges_desc: "Старый офицерский корпус никогда не был нашим, поэтому мы его разрушили и вместо этого продвигали офицеров из рядов. Командование теперь лояльно, и его легко заменить, но профессиональную армию мы променяли на армию, которая всё ещё учится своему делу в боевых условиях."
 FRA_people_constitution: "Народная конституция"
 FRA_people_constitution_desc: "Наша революция увенчалась успехом, но мы должны укрепить свою власть, предоставив рабочим возможность самим решать, как они хотят, чтобы ими управляли."
 FRA_commies_redarmy1: "Новая Красная Армия"
 FRA_commies_redarmy1_desc: "Нашей революции нужна армия, чтобы защитить себя и распространить свои идеи. Опираясь на фундамент французской армии, мы создали новые силы, которые будут защищать народ и революцию."
 FRA_commies_redarmy2: "Новая Красная Армия"
 FRA_commies_redarmy2_desc: "Нашей революции нужна армия, чтобы защитить себя и распространить свои идеи. Опираясь на фундамент французской армии, мы создали новые силы, которые будут защищать народ и революцию."
 FRA_red_agent_lar: "Генеральное управление революционных действий"
 FRA_red_agent_lar_desc: "Мы разработали свой подход, опираясь на методы Главного управления разведки и науки Великобритании (DGSE), чтобы получить важную информацию о наших реакционных и капиталистических врагах."
 FRA_red_agent_non_lar: "Генеральное управление революционных действий"
 FRA_red_agent_non_lar_desc: "Мы разработали свой подход, опираясь на методы Главного управления разведки и науки Великобритании (DGSE), чтобы получить важную информацию о наших реакционных и капиталистических врагах."
 FRA_monarchist_anger: "Гнев монархистов"
 FRA_monarchist_anger_desc: "Наши союзники-монархисты были разочарованы нашим отказом восстановить аристократические привилегии. Бонапартизм — наследник революции; иначе и быть не могло."
 FRA_bonapart_constitution: "Бонапартизская конституция"
 FRA_bonapart_constitution_desc: "Со времен Третьей республики наши институты больше не рассчитаны на императора нашего величия. Поэтому мы должны адаптировать конституцию к нашему будущему правлению. Мы можем воспользоваться этой возможностью, чтобы ответить на некоторые критические замечания, высказанные нашим народом в адрес предыдущих республик; это будет шагом в правильном направлении для них."
 FRA_bonapart_military_reform: "Реорганизация Великой армии"
 FRA_bonapart_military_reform_desc: "Наши вооруженные силы достаточны для обеспечения безопасности на нашей территории, но их недостаточно для реализации наших планов по возвращению нашей империи. Необходима реструктуризация; мы собираемся демонтировать все сверху донизу, чтобы затем более эффективно реформировать каждую ветвь власти."
 FRA_army_reformed_1: "Реструктурированная иерархия командования"
 FRA_army_reformed_1_desc: "Теперь, когда наша командная структура реорганизована, мы можем позволить себе провести более масштабную реформу наших вооруженных сил, включая их технологический потенциал и портфель заказов. Впереди нас ждет масштабная работа, но она даст нам ресурсы для реализации наших амбиций."
 FRA_army_reformed_infantry: "Реформа Великой армии: пехотная линия"
 FRA_army_reformed_infantry_desc: "Наш Император вынес решение в пользу медленного и контролируемого наступления. Поэтому приоритет будет отдан пехоте и необходимому ей снаряжению."
 FRA_army_reformed_cavalry: "Реформа Великой армии: Бронетанковый клин"
 FRA_army_reformed_cavalry_desc: "Наш Император вынес решение в пользу быстрого и мощного наступления. Поэтому приоритет будет отдан танковым батальонам и необходимой им технике."
 FRA_army_reformed_artillery_infantry: "Реформа Великой армии: пехота и артиллерия"
 FRA_army_reformed_artillery_infantry_desc: "Наш Император принял решение в пользу медленного и контролируемого наступления при поддержке артиллерии. Поэтому приоритет будет отдан пехоте и артиллерии, а также соответствующей технике."
 FRA_army_reformed_artillery_cavalry: "Реформа Великой армии: бронетехника и артиллерия"
 FRA_army_reformed_artillery_cavalry_desc: "Наш Император принял решение в пользу быстрого и мощного наступления при поддержке артиллерии. Поэтому приоритет будет отдан танковым батальонам и артиллерии, а также соответствующей технике."
 FRA_army_reformed_air_infantry: "Реформа Великой армии: пехота и военно-воздушные силы."
 FRA_army_reformed_air_infantry_desc: "Наш Император вынес решение в пользу медленного и контролируемого наступления при поддержке штурмовой авиации. Поэтому приоритет будет отдан пехотным батальонам и серийным самолетам."
 FRA_army_reformed_air_cavalry: "Реформа Великой армии: бронетанковые и военно-воздушные силы."
 FRA_army_reformed_air_cavalry_desc: "Наш Император вынес решение в пользу быстрого и мощного наступления при поддержке штурмовой авиации. Поэтому приоритет будет отдан танковым батальонам и серийным самолетам."
 FRA_BCE_money: "Деньги ЕС"
 FRA_BCE_money_desc: "Нам удалось договориться о возвращении в институты Европейского союза в обмен на помощь Европейского банка. Эта помощь будет иметь решающее значение для подготовки к войнам, которые мы собираемся вести против них!"
 FRA_4th_empire_desc: "Бонапартистская империя вернулась, она сильнее, чем когда-либо, и на этот раз нас не победит ни одна коалиция."
 FRA_grande_arme_art_inf: "Современная Великая армия"
 FRA_grande_arme_art_inf_desc: "После нескольких месяцев реформ наша армия полностью готова отправиться на поиски утраченных территорий Империи. После полной модернизации системы мы перестроили её на основе стратегии медленного и неуклонного наступления, подкреплённой интенсивными бомбардировками вражеских позиций. Пехота остаётся королём поля боя, но штурмовая авиация значительно облегчит ей задачу."
 FRA_grande_arme_art_cav: "Потоп огня и стали"
 FRA_grande_arme_art_cav_desc: "После нескольких месяцев реформ наша армия полностью готова отправиться на поиски утраченных территорий Империи. Проведя полную модернизацию своей системы, мы перестроили её на основе стратегии быстрого и жестокого наступления, подкреплённой интенсивными бомбардировками. Эта стратегия опирается на технологически развитые ресурсы, но у нас есть средства, чтобы превзойти наполеоновский потоп."
 FRA_grande_arme_air_inf: "Небо расчищает путь."
 FRA_grande_arme_air_inf_desc: "После нескольких месяцев реформ наша армия полностью готова отправиться на поиски утраченных территорий Империи. Мы восстановили её на основе выверенного пехотного наступления, проводимого исключительно под прикрытием собственной авиации, при этом ударные самолёты и разведчики прорывают каждую позицию ещё до того, как на неё будет направлен стрелок. Пехотинец по-прежнему выходит на поле боя, но он больше не идёт вслепую."
 FRA_grande_arme_air_cav: "Гром перед атакой"
 FRA_grande_arme_air_cav_desc: "После нескольких месяцев реформ наша армия полностью готова отправиться на поиски утраченных территорий Империи. Мы перестроили её вокруг бронетанковых колонн, которые движутся только там, где уже прошла авиация, заменив артиллерийский строй ударными эскадрильями, которые не отстают от наступления. Ничто не остановит атаку, и ничто не устоит перед ней."
 FRA_surrounded: "Континентальная блокада"
 FRA_surrounded_desc: "Наше восхождение к власти не осталось незамеченным, и ясно, что другие европейские державы уже замышляют против нас заговор. В частности, Великобритания, которая в прошлом была нашим заклятым врагом. Мы должны свергнуть каждую из этих европейских держав; от этого зависит наше выживание и выживание революции."
 FRA_Sachons_vaincre: "Потоп"
 FRA_Sachons_vaincre_desc: "После нескольких месяцев подготовки наших людей к высокоинтенсивному конфликту, они теперь готовы к этой долгожданной войне. Их энтузиазм и вера способны свернуть горы, но мы должны действовать быстро, прежде чем они угаснут. Мы должны как можно быстрее сокрушить наших противников."
 FRA_prepare_to_fight: "Подготовка к нашему возвращению"
 FRA_prepare_to_fight_desc: "Мы выбрали осторожный подход; зная, что наш народ полностью поддерживает наши экспансионистские амбиции, нам остается лишь предоставить им средства для их реализации. Мы должны убедиться, что, когда придет время, мы будем готовы."
 FRA_defense_napoleon: "чрезвычайное положение"
 FRA_defense_napoleon_desc: "После террористических атак, совершенных бонапартистами на наших границах, наша страна находится в состоянии повышенной готовности. Что бы ни случилось, мы будем готовы."
 FRA_thousands_planes: "Гонка воздушных вооружений"
 FRA_thousands_planes_desc: "Мы решили бороться с Соединенными Штатами, которые слишком долго стремились к господству над нами и остальной Европой. Чтобы защитить Европу, мы должны уничтожить их, а для этого мы должны быть способны конкурировать в воздухе, поскольку у нас нет средств, чтобы победить их на море."
 FRA_trade_USA: "Трансатлантическая торговля"
 FRA_trade_USA_desc: "Соединенные Штаты и Французская империя объединили усилия для торговли через Атлантику. Эти соглашения принесут им мир и процветание в обмен на гарантии мира."
 FRA_king_camelot_lar: "Королевские верблюды"
 FRA_king_camelot_lar_desc: "Наша тайная полиция, задача которой — подавление всех революционных тенденций и других антироялистских движений."
 FRA_king_camelot_non_lar: "Королевские верблюды"
 FRA_king_camelot_non_lar_desc: "Наша тайная полиция, задача которой — подавление всех революционных тенденций и других антироялистских движений."
 FRA_king_constitution: "Монархическая конституция"
 FRA_king_constitution_desc: "Все эти республики, которые пережила наша страна, строили свои институты на шатком фундаменте. Мы должны переписать эту чушь, потому что каждому государству, даже при нашей абсолютной власти, нужны законы."
 FRA_chivalry: "Современное рыцарство"
 FRA_chivalry_desc: "Французская монархия всегда опиралась на мощную кавалерию. Мы решили продолжить эту традицию, отдавая приоритет механизированной кавалерии перед пехотой."
 FRA_elite_army: "Армия элиты"
 FRA_elite_army_desc: "Войны за независимость привели к введению призыва на военную службу. Однако многочисленные конфликты, в которых мы участвовали, оказались чрезвычайно дорогостоящими с точки зрения человеческих жизней. Подданные короля не всегда хорошо подготовлены к войне. Поэтому мы решили сосредоточиться на меньшем, но гораздо лучше подготовленном контингенте войск."
 FRA_prepare_crusade: "Десятый крестовый поход"
 FRA_prepare_crusade_desc: "Наши войска готовы отправиться на завоевание Святой Земли."
 FRA_political_preassure: "Укрепление нашей дипломатии"
 FRA_political_preassure_desc: "Нам не удалось дипломатическим путем завоевать расположение Ливана, поэтому нам необходимо улучшить способы взаимодействия с иностранными державами."
 FRA_navy_crusade: "Морской крестовый поход"
 FRA_navy_crusade_desc: "Мы решили отвоевать Святую Землю по морю. Для этого необходимы эффективные десантные наступательные операции."
 FRA_commie_europe_integration: "Европейская ассимиляция"
 FRA_commie_europe_integration_desc: "Мы принесли революцию и коммунизм в остальную Европу. Теперь настало время объединить пролетариат из каждой страны в европейскую федерацию, которая сможет обеспечить долговечность революции."
 FRA_counter_insurgency: "Эффективная военная полиция"
 FRA_counter_insurgency_desc: "Испанские партизаны представляли проблему для Наполеона I, но для нас это не будет проблемой."
 FRA_attack_benelux: "План действий: страны Бенилюкса"
 FRA_attack_benelux_desc: "Мы должны сосредоточиться на уничтожении сил Бенилюкса. Наш император дал нам средства для их быстрого разгрома."
 FRA_attack_iberia: "Боевой план: Иберия"
 FRA_attack_iberia_desc: "Мы должны сосредоточиться на уничтожении иберийских войск. Наш император предоставил нам средства для их быстрого разгрома."
 FRA_attack_germany: "Боевой план: Германия"
 FRA_attack_germany_desc: "Мы должны сосредоточиться на уничтожении немецких войск. Наш император дал нам средства для их быстрого разгрома."
 FRA_attack_holy_roman: "Боевой план: Южная Европа"
 FRA_attack_holy_roman_desc: "Мы должны сосредоточиться на уничтожении остатков южноевропейских войск. Наш император дал нам средства для их быстрого разгрома."
 FRA_BON_support_allies: "Подготовка к затяжной войне"
 FRA_BON_support_allies_desc: "Наш французский партнер предложил нам подготовиться к высокоинтенсивному конфликту с Россией."
 FRA_attack_east: "Боевой план: Восточная Европа"
 FRA_attack_east_desc: "Мы должны сосредоточиться на уничтожении восточноевропейских сил. Наш император дал нам средства для их быстрого разгрома. Это последний шаг перед нашей финальной кампанией."
 FRA_attack_russia_fast: "La Fleur au Fusil"
 FRA_attack_russia_fast_desc: "Через две недели мы будем в Москве!"
 FRA_attack_russia_slow: "Осторожное продвижение"
 FRA_attack_russia_slow_desc: "На этот раз Березины не будет."
 FRA_attack_UK_naval: "Пересечь Ла-Манш"
 FRA_attack_UK_naval_desc: "Королевский военно-морской флот больше не представляет для нас угрозы; победа уже в пределах нашей досягаемости."
 FRA_attack_UK_air: "Перепрыгнуть через пролив"
 FRA_attack_UK_air_desc: "Мы должны сохранять контроль над воздушным пространством и застать противника врасплох."
 FRA_BON_victory: "Имперский протекторат"
 FRA_BON_victory_desc: "Мы были покорены наполеоновской империей."
 FRA_expansion_europe: "Наследник Карла Великого"
 FRA_expansion_europe_desc: "Наша судьба — вернуть Каролингскую империю."
 FRA_expansion_europe_crusades: "Каролингский крестовый поход"
 FRA_expansion_europe_crusades_desc: "Франки вернули себе свои земли; теперь мы должны отправиться в Святую Землю."
 FRA_expansion_crusades: "Наследник Сент-Луиса"
 FRA_expansion_crusades_desc: "Долг нашего Королевства – служить Богу и вернуть Святую Землю."
 FRA_EMPIRE_occident: "Западная империя"
 FRA_EMPIRE_occident_desc: "Мы отвоевали Каролингскую империю и короновались императором Запада."
 FRA_crusade_done_jerusalem: "Победоносный крестовый поход"
 FRA_crusade_done_jerusalem_desc: "Десятый крестовый поход достиг своей цели, отвоевав Иерусалим и Святую Землю."
 FRA_expansion_crusades_plus: "Последний крестовый поход"
 FRA_expansion_crusades_plus_desc: "Вернув себе наши святые места, мы решили исправить ошибки прошлого. Все расколы должны быть прекращены."
 FRA_protestant_anger: "Протестантское сопротивление"
 FRA_protestant_anger_desc: "Наша агрессивная риторика в отношении протестантов вызвала их гнев в нашей стране."
 FRA_harsh_subjugation: "Жестокое порабощение"
 FRA_harsh_subjugation_desc: "Наш сюзерен, король Франции, решил контролировать нашу экономику и политику. Поражение обходится дорого."
 FRA_victory_crusade_2_conversion: "Пятый всадник Апокалипсиса"
 FRA_victory_crusade_2_conversion_desc: "Божественный гнев обрушился на наших врагов."
 FRA_enlightment: "Протекторат Церкви"
 FRA_enlightment_desc: "Наш сюзерен, король Франции, решил помочь нам восстановить нашу страну и поддержать нас в физическом и культурном возрождении нашего общества."
 FRA_victory_crusade_2_freedom_light: "Старшая дочь Церкви"
 FRA_victory_crusade_2_freedom_light_desc: "Мы должны относиться к заблудшей овце с величайшей добротой."
 FRA_attack_colonies: "Возрождение имперских колоний"
 FRA_attack_colonies_desc: "Континентальная система должна найти ресурсы, необходимые для обеспечения своего дальнейшего существования."
 france_md.404.t: "Соглашение с «зелёными»"
 france_md.404.d: "Переговоры завершены, текст лежит на столе. Закрыты 24 реактора, первым из которых стал Фессенхайм, а доля атомной энергетики в энергетическом балансе в течение десятилетия сократится до половины. В обмен на это «зелёные» уступают в шестидесяти избирательных округах, и большинство сохраняется. Энергетические федерации уже проголосовали против, и Монтебур публично озвучил то, что половина парламентской группы говорит в частном порядке. Подпишем ли мы?"
 france_md.404.a: "Подпишите. Этот альянс стоит больше, чем реакторы."
 france_md.404.b: "Флот не является козырем в переговорах."
 france_md.405.t: "La Manif pour Tous"
 france_md.405.d: "Наш недавний законопроект, похоже, не получил единодушной поддержки среди наших сограждан. Они заполнили Марсово поле и намерены делать это каждый месяц, пока законопроект не будет отклонен. Организаторы действуют осторожно, плакаты розовые и синие, а за ними стоят все консервативные ассоциации страны, а также значительная часть парламентской группы правых. Текст в нынешнем виде охватывает вопросы брака, усыновления и родства. Мы можем придерживаться всех трех пунктов, или же можем исключить то, что привлекает наибольшее количество людей, и спокойно принять остальное."
 france_md.405.a: "Закон принят в полном объеме. Пусть идут маршем."
 france_md.405.b: "Сократим текст и возьмём то, что сможем получить."
 france_md.406.t: "Круговые развязки заняты"
 france_md.406.d: "Восемь выходных. Префектуры сообщают о тысяче проведенных кольцевых развязок, Триумфальная арка подверглась вандализму, а флешмобы привлекли внимание камер. Нет руководства, с которым можно было бы вести переговоры, потому что они отказываются его назначить. Министерство внутренних дел хочет принять закон о борьбе с беспорядками и получить полную свободу действий. Остальные хотят общенациональных дебатов, собраний в каждой коммуне и пакета уступок, достаточно большого, чтобы положить конец этому до европейских выборов."
 france_md.406.a: "Примите закон о борьбе с беспорядками и освободите круговые перекрестки."
 france_md.406.b: "Откройте Большую дискуссию и заплатите за мир."
 FRA_change_politics_nationalist: "Изменения §Y$FRA_political_balance$§!: $FRA_balance_domestic_nationalist_drift$ на [?temp_change|%+]\n"
 FRA_truly_absolutism_TT: "§gМы запретим §! §RЗапретим §! §gкаждую другую партию и провозгласим королевство §! §YИстинной абсолютной монархией§!"
 FRA_social_welf_need_tooltip_modifier_effect_TT: "Изменения §Y$FRA_social_balance$§!: $FRA_SOC_welf_ned$ на [?temp_change|%-]\n"
 FRA_4th_empire: "Третья Французская империя"
 threat_FRA_napo_empire: "Наполеон вернулся"
 FRA_liberal_arms_contracts: "Либеральная политика в отношении экспорта вооружений"
 FRA_liberal_arms_contracts_desc: "Компании Dassault, Naval Group, Thales и MBDA возглавляют одну из самых передовых оборонных отраслей в мире. Либеральная экспортная политика позволяет нам заключать выгодные контракты со странами, стремящимися к модернизации, пополняя портфель заказов наших заводов и расширяя французское влияние посредством военного партнерства."
 FRA_liberal_arms_contracts_tt: "В ближайшие месяцы мы предложим контракты на поставку вооружений. §YСаудовская Аравия§!, §YОбъединенные Арабские Эмираты§!, §YСербия§!, §YГреция§!, §YЕгипет§!, и §YИндия§!."
 FRA_arms_contract_opinion: "Партнерство по контрактам на поставку вооружений"
 france_md.323.t: "Ухаживания в Эр-Рияде"
 france_md.323.d: "Эр-Рияд ищет истребитель, который будет использоваться наряду с Eurofighter, а инженеры Naval Group по-прежнему обслуживают фрегаты класса Al Riyadh, построенные в рамках программы Sawari. Наше министерство обороны подготовило предложение по [SAU.GetNameWithFlag]. Что мы можем предложить?"
 france_md.323.a: "Пакет лёгкого вооружения (5 миллиардов долларов)"
 france_md.323.b: "Пакет вооружений большой мощности (15 миллиардов долларов)"
 france_md.323.c: "Премиальный пакет истребителей Rafale (30 миллиардов долларов)"
 france_md.323.e: "Мы не будем добиваться заключения этого контракта."
 france_md.324.t: "Эр-Рияд рассматривает предложение от Франции"
 france_md.324.d: "[FRA.GetNameWithFlag] предлагает Rafale в качестве альтернативы нашим эскадрильям Eurofighter, а также продолжение программы фрегатов Sawari, которые Naval Group обслуживает уже несколько десятилетий."
 france_md.324.a: "Принять договор"
 france_md.324.b: "Отклонить предложение"
 france_md.325.t: "Ухаживания в Абу-Даби"
 france_md.325.d: "ВВС ОАЭ до сих пор эксплуатируют Mirage 2000-9, вариант, разработанный компанией Dassault специально для Абу-Даби в 1990-х годах. В связи со старением этого парка, министерство обороны видит возможность предложить его преемника, Rafale, компании [UAE.GetNameWithFlag]. Что мы можем предложить?"
 france_md.325.a: "Пакет лёгкого вооружения (5 миллиардов долларов)"
 france_md.325.b: "Пакет вооружений большой мощности (15 миллиардов долларов)"
 france_md.325.c: "Премиальный пакет истребителей Rafale (30 миллиардов долларов)"
 france_md.325.e: "Мы не будем добиваться заключения этого контракта."
 france_md.326.t: "Абу-Даби рассматривает предложение от Франции"
 france_md.326.d: "[FRA.GetNameWithFlag] предлагает Rafale в качестве преемника нашего парка Mirage 2000-9, варианта, разработанного компанией Dassault специально для нас три десятилетия назад."
 france_md.326.a: "Принять договор"
 france_md.326.b: "Отклонить предложение"
 france_md.327.t: "Ухаживание в Белграде"
 france_md.327.d: "[SER.GetNameWithFlag] по-прежнему эксплуатирует МиГ-29 советской эпохи и закупает у Москвы системы ПВО ближнего действия. В качестве замены мы можем предложить Rafale, дополненный переносными ракетами Mistral от MBDA для их подразделений ПВО. Что мы можем предложить?"
 france_md.327.a: "Пакет лёгкого вооружения (3 миллиарда долларов)"
 france_md.327.b: "Пакет тяжелого вооружения (8 миллиардов долларов)"
 france_md.327.c: "Премиальный пакет Rafale (15 миллиардов долларов)"
 france_md.327.e: "Мы не будем добиваться заключения этого контракта."
 france_md.328.t: "Белград рассматривает предложение от Франции"
 france_md.328.d: "[FRA.GetNameWithFlag] предлагает истребители Rafale в качестве западной альтернативы нашему устаревающему парку МиГ-29, а также ракеты Mistral компании MBDA для наших подразделений ПВО. Принятие этого предложения станет нашей первой крупной сделкой по поставкам вооружений за пределами российской сферы влияния."
 france_md.328.a: "Принять договор"
 france_md.328.b: "Отклонить предложение"
 france_md.329.t: "Ухаживание в Афинах"
 france_md.329.d: "[GRE.GetNameWithFlag] уже эксплуатирует наши Rafale и хочет расширить сотрудничество на военно-морской флот. Компания Naval Group предложила пакет фрегатов на базе FREMM, соответствующий заказу ВВС. Что же нам следует предложить нашим греческим союзникам?"
 france_md.329.a: "Пакет лёгкого вооружения (4 миллиарда долларов)"
 france_md.329.b: "Пакет вооружений большой мощности (12 миллиардов долларов)"
 france_md.329.c: "Премиальный пакет истребителей Rafale (20 миллиардов долларов)"
 france_md.329.e: "Мы не будем добиваться заключения этого контракта."
 france_md.330.t: "Афины рассматривают предложение от Франции."
 france_md.330.d: "[FRA.GetNameWithFlag] предлагает пакет, построенный на базе фрегатов, созданных на базе FREMM, расширяя оборонные отношения, уже налаженные благодаря нашему предыдущему заказу на истребители Rafale."
 france_md.330.a: "Принять договор"
 france_md.330.b: "Отклонить предложение"
 france_md.331.t: "Ухаживание в Каире"
 france_md.331.d: "[EGY.GetNameWithFlag] уже эксплуатирует наши истребители Rafale, два авианосца класса Mistral, построенных для России и перебазированных в Каир, а также ввел в строй фрегат FREMM Tahya Misr из портфеля заказов нашего собственного флота. Что мы можем предложить для углубления партнерства?"
 france_md.331.a: "Пакет лёгкого вооружения (4 миллиарда долларов)"
 france_md.331.b: "Пакет вооружений большой мощности (12 миллиардов долларов)"
 france_md.331.c: "Премиальный пакет истребителей Rafale (25 миллиардов долларов)"
 france_md.331.e: "Мы не будем добиваться заключения этого контракта."
 france_md.332.t: "Каир рассматривает предложение от Франции"
 france_md.332.d: "[FRA.GetNameWithFlag] предлагает расширить партнерство, которое уже охватывает наши эскадрильи истребителей Rafale, авианосцы класса Mistral и фрегат FREMM Tahya Misr."
 france_md.332.a: "Принять договор"
 france_md.332.b: "Отклонить предложение"
 france_md.333.t: "Ухаживание в Нью-Дели"
 france_md.333.d: "Компания [IND.GetNameWithFlag] управляет одним из крупнейших оборонных рынков в мире. Нью-Дели уже эксплуатирует тридцать шесть истребителей Rafale и строит подводные лодки класса Scorpene по лицензии на верфи Mazagon Dock. Что мы можем предложить для расширения партнерства?"
 france_md.333.a: "Пакет лёгкого вооружения (6 миллиардов долларов)"
 france_md.333.b: "Пакет вооружений большой мощности (20 миллиардов долларов)"
 france_md.333.c: "Премиальный пакет истребителей Rafale (40 миллиардов долларов)"
 france_md.333.e: "Мы не будем добиваться заключения этого контракта."
 france_md.334.t: "Нью-Дели рассматривает предложение от Франции."
 france_md.334.d: "[FRA.GetNameWithFlag] предлагает использовать уже находящиеся на вооружении ВВС Индии истребители Rafale и подводные лодки класса Scorpene, построенные по лицензии на верфи Mazagon Dock."
 france_md.334.a: "Принять договор"
 france_md.334.b: "Отклонить предложение"
 FRA_joint_weapon_projects_category: "Совместные проекты по разработке вооружений"
 FRA_joint_weapon_projects_category_desc: "Франция имеет долгую историю совместных оборонных программ, от ударного самолета Jaguar с Великобританией до вертолета Tiger с Германией. Новые совместные проекты позволяют нам разделить затраты на разработку и полевое оборудование, которые ни один из партнеров не смог бы себе позволить в одиночку."
 FRA_joint_project_germany: "Предложение о совместном проекте SCAF/MGCS"
 FRA_joint_project_germany_desc: "SCAF (Système de Combat Aérien du Futur) объединяет Dassault и Airbus для разработки истребителя шестого поколения, который должен прийти на смену Rafale и Eurofighter. MGCS (Main Ground Combat System) поручает KNDS разработать новый основной боевой танк для замены Leclerc и Leopard 2. Вместе они станут крупнейшими оборонными программами, которые осуществляла каждая из этих стран со времен холодной войны."
 FRA_socialist_government_required_tt: "Требуется правительство §YSocialist§! или §YLeft-wing§!."
 FRA_joint_project_russia: "Предложить франко-российский проект «Атом»"
 FRA_joint_project_russia_desc: "Мы предлагаем боевую машину пехоты «АТОМ» в качестве совместной программы с Москвой, объединив конструкторские группы Nexter с российскими инженерами-бронетехниками. Для столь глубокого разрыва с нашими западными союзниками необходимо сначала выйти из ЕС."
 FRA_nationalist_government_required_tt: "Требуется правительство, находящееся у власти: §YNationalist§! или §YNational Rally§!."
 FRA_joint_project_opinion: "Партнер по совместной разработке оружия"
 france_md.335.t: "Франко-германское проектное предложение SCAF/MGCS"
 france_md.335.d: "[FRA.GetNameWithFlag] предлагает запустить SCAF (Système de Combat Aérien du Futur) и MGCS (Main Ground Combat System) в качестве совместных программ: истребитель шестого поколения на замену Rafale и Eurofighter, а также основной боевой танк на замену Leclerc и Leopard 2. Dassault, Airbus и KNDS разделят инженерные работы между Парижем и Берлином."
 france_md.335.a: "Давайте вместе строить будущее европейской обороны."
 france_md.335.b: "Мы предпочитаем разрабатывать наши системы самостоятельно."
 france_md.336.t: "Германия одобряет проект SCAF/MGCS"
 france_md.336.d: "[GER.GetNameWithFlag] принял наше предложение по SCAF и MGCS. Инженеры Dassault и Airbus будут работать вместе со своими немецкими коллегами над программой истребителей, а KNDS возглавит программу танков."
 france_md.336.a: "Отлично! Да здравствует франко-германское сотрудничество!"
 france_md.337.t: "Франко-российский проект АТОМ"
 france_md.337.d: "[FRA.GetNameWithFlag] предлагает боевую машину пехоты ATOM в качестве совместной франко-российской программы, объединяющей инженеров Nexter с российскими конструкторами бронетехники. Париж, уже дистанцировавшийся от своих традиционных западных союзников, теперь ищет партнеров в сфере обороны на Востоке."
 france_md.337.a: "Начинается новая эра франко-российского сотрудничества."
 france_md.337.b: "Это предложение слишком спорное."
 france_md.338.t: "Россия принимает проект ATOM"
 france_md.338.d: "[RUS.GetNameWithFlag] принял наше предложение по программе ATOM. Инженеры Nexter будут работать вместе со своими российскими коллегами над новой боевой машиной пехоты, что станет нашим первым крупным партнерством в сфере обороны с Москвой со времен холодной войны."
 france_md.338.a: "Новая глава во франко-российских отношениях!"
 FRA_FCAS_MGCS_project: "Программа развития SCAF/MGCS"
 FRA_FCAS_MGCS_project_desc: "Франция и Германия совместно разрабатывают SCAF (Système de Combat Aérien du Futur), истребитель шестого поколения, проектируемый компаниями Dassault и Airbus, и MGCS (Main Ground Combat System), новый основной боевой танк, проектируемый компанией KNDS. Вместе они представляют собой крупнейшие оборонные программы, которые осуществляла каждая из стран со времен холодной войны."
 GER_FCAS_MGCS_project: "Программа развития SCAF/MGCS"
 GER_FCAS_MGCS_project_desc: "Германия и Франция совместно разрабатывают SCAF (Système de Combat Aérien du Futur), истребитель шестого поколения, проектируемый компаниями Airbus и Dassault, и MGCS (Main Ground Combat System), новый основной боевой танк, проектируемый компанией KNDS. Вместе они представляют собой крупнейшие оборонные программы, которые осуществляла каждая из стран со времен холодной войны."
 FRA_RUS_joint_project: "Франко-российская атомная программа"
 FRA_RUS_joint_project_desc: "Франция и Россия запустили совместную программу военных разработок — проект боевой машины пехоты «АТОМ». Инженеры компании Nexter сотрудничают с российскими конструкторами бронетехники для создания новой платформы БМП."
 RUS_FRA_joint_project: "Франко-российская атомная программа"
 RUS_FRA_joint_project_desc: "Россия и Франция запустили совместную программу военных разработок — проект боевой машины пехоты «АТОМ». Российские конструкторы бронетехники объединили усилия с инженерами компании Nexter для создания новой платформы БМП."
 FRA_constitutional_crisis_pcf: "Революционное искушение"
 FRA_constitutional_crisis_pcf_desc: "Внутри нашей левой коалиции набирает влияние радикальная фракция. Эти революционные радикалы считают, что демократический социализм развивается слишком медленно, и требуют немедленных, полных преобразований. Умеренное руководство «Непокорной Франции» и Французской коммунистической партии изо всех сил пытается сдержать экстремистов, которые рассматривают всеобщую забастовку как первый шаг к революции."
 FRA_abolish_fifth_republic_pcf: "Экстремисты захватывают контроль."
 FRA_abolish_fifth_republic_pcf_desc: "Радикальная фракция внутри левых переиграла умеренное руководство. Меланшон и реформисты из КПФ были оттеснены на второй план революционными радикалами, которые полностью отвергают «буржуазную демократию» Пятой республики. Они требуют созыва Учредительного собрания для разработки новой конституции, опираясь на достаточную поддержку на улицах, чтобы обеспечить выполнение своей воли."
 FRA_sixth_republic: "Провозгласите Шестую республику"
 FRA_sixth_republic_desc: "Умеренная фракция вновь обрела некоторое влияние, направив революцию к демократической социалистической Шестой республике, а не к откровенному коммунизму. Этот компромисс сохраняет республиканские институты, одновременно коренным образом преобразуя французское общество парламентскими средствами."
 FRA_french_commune_peaceful: "Создание Французской коммуны"
 FRA_french_commune_peaceful_desc: "Революционные радикалы одержали полную победу. В духе Парижской коммуны 1871 года Франция станет подлинным рабочим государством. Средства производства будут коллективизированы, рабочие советы будут управлять на всех уровнях, а умеренные реформаторы полностью потеряют контроль."
 FRA_republic_safe_pcf: "Наше самое ценное достояние"
 FRA_republic_safe_pcf_desc: "Мы арестовали лидеров радикальных фракций и распустили их военизированные ячейки. Республика выжила. Меланшон и умеренные реформаторы сохраняют контроль над левым крылом. Революционная мечта закончилась, уступив место более медленному и стабильному пути демократических реформ."
 FRA_question_republic_fn: "Сомнительная республика"
 FRA_question_republic_fn_desc: "Внутри Национального собрания растет влияние традиционалистской фракции. В то время как [FRA.GetLeader] и основное руководство остаются приверженными Республике, эти экстремисты, вдохновленные «Французским действием» и католическим традиционалистским движением, открыто ставят под сомнение, не подвела ли Францию ​​сама демократия. Мы должны действовать, пока не поздно."
 FRA_referendum_republic: "Сторонники жесткой линии добиваются проведения референдума."
 FRA_referendum_republic_desc: "Традиционалистская фракция переиграла умеренных республиканцев Ле Пен. Боевики из «Action Française», католики-интегристы и ностальгирующие монархисты захватили контроль над партийным аппаратом. Они требуют референдума о самом существовании Республики, и основное руководство больше не может им помешать."
 FRA_restore_kingdom_fn: "Восстановить Королевство"
 FRA_restore_kingdom_fn_desc: "Монархическая фракция внутри движения одержала победу. Независимо от того, коронуем ли мы претендента от Орлеана Жана д'Орлеана «королем французов» или легитимиста Луи де Бурбона «королем Франции», республиканские умеренные члены правительственной коалиции были полностью оттеснены на второй план традиционалистскими экстремистами."
 FRA_restore_empire_fn: "Восстановить Империю"
 FRA_restore_empire_fn_desc: "Бонапартистская фракция одержала победу. Жан-Кристоф Наполеон Бонапарт будет коронован как Наполеон VII. Умеренные республиканцы, некогда возглавлявшие правительство, были оттеснены теми, кто мечтает об имперской славе: сильной Франции, объединенной под властью императора, а не враждующих парламентариев."
 FRA_republic_safe_fn: "Спасение Республики"
 FRA_republic_safe_fn_desc: "Мы арестовали лидеров традиционалистской фракции и распустили их военизированные ячейки. Республика выживает! Наше правительство и умеренные националисты сохраняют контроль. Используя кризис в качестве оправдания, мы проводим реформы, направленные на укрепление власти государства: расширение служб безопасности, более строгий контроль над экстремистскими организациями и усиление исполнительной власти. Пятая Республика выживает, став сильнее, чем когда-либо."
 france_md.370.t: "Сохраняем руки в чистоте"
 france_md.370.d: "Наш приход к власти, похоже, уже привлек внимание политических движений. Сегодня утром с нами связались революционные коммунистические ячейки. Они предложили помочь нам укрепить нашу власть, в частности, путем сбора информации о наших политических оппонентах и ​​отслеживания крайне правых отколовшихся групп, чтобы предотвратить причинение ими нам вреда. Нам не следует связываться с такими группами, поскольку мы сейчас привержены реформам и Республике. Но этот инструмент все же был бы полезен."
 france_md.370.a: "Позвольте им организоваться: нам нужна их поддержка."
 france_md.370.b: "Отвергните их: мы демократы, а не революционеры."
 france_md.371.t: "Голоса из тени"
 france_md.371.d: "Наш успех на выборах и эффективность в реализации националистической программы не остались незамеченными. Мы получили предложения от различных традиционалистских отколовшихся групп: сторонников «Французского действия», католических интегристов и тех, кто мечтает о восстановлении монархии. Они были впечатлены нашими результатами и предлагают нам свои военизированные сети и политические связи в обмен на возможность открытой организации. Их истинные намерения остаются скрытыми."
 france_md.371.a: "Позвольте им организоваться: их поддержка укрепляет нас."
 france_md.371.b: "Отвергните их: мы на стороне республики."
 france_md.372.t: "Республика стоит"
 france_md.372.d: "Радикальная фракция сломлена. Их лидеры арестованы, их ячейки расформированы, их мечты о революции разбиты. Умеренные реформисты остаются у власти, и Франция остается республикой, возможно, преобразившейся, но все еще узнаваемо демократической. Экстремисты рискнули и проиграли."
 france_md.372.a: "Реформизм всегда побеждает"
 france_md.373.t: "Да здравствует Республика!"
 france_md.373.d: "Традиционалистский переворот сорван! Генеральное управление разведки и безопасности (DGSI) действовало оперативно: лидеры «Французского действия» задержаны, ячейки монархистов разгромлены, а мечты о восстановлении разрушены. Народ празднует на улицах, пока Ле Пен обращается к нации: Пятая республика сильна. Используя этот кризис в качестве оправдания, мы принимаем масштабные реформы для укрепления государственной власти и обеспечения того, чтобы подобные угрозы никогда больше не возникали."
 france_md.373.a: "Республика спасена и стала сильнее, чем когда-либо!"
 france_md.374.t: "Фракции борются за власть."
 france_md.374.d: "Переворот удался. Республика пала. Но теперь традиционалистские фракции ополчились друг на друга. Монархисты требуют восстановления династии Бурбонов или Орлеанской династии. Бонапартисты мечтают об имперской славе при Наполеоне VII. Победу может одержать только одна фракция. Какое видение возобладает?"
 france_md.374.a: "Монархисты одерживают победу: восстановите королевство!"
 france_md.374.b: "Победа бонапартистов: восстановление империи!"
 france_md.340.t: "Надвигающееся восстание"
 france_md.340.d: "Радикальная фракция стала слишком дерзкой. Их военизированные ячейки разоблачены, их проникновение в партийный аппарат раскрыто. Ходят даже слухи, что они проникли в высшее командование нашей армии и готовятся к государственному перевороту. Мы должны сделать выбор: немедленно принять меры против них и сохранить Республику, или позволить им продолжать свою работу и посмотреть, к чему это приведет. Генеральное управление разведки и безопасности ожидает наших приказов."
 france_md.340.a: "Жесткие меры: арестовать лидеров радикальных движений."
 france_md.340.b: "Пусть так и будет: революция должна продолжаться."
 france_md.341.t: "Радикалы захватывают власть"
 france_md.341.d: "Это произошло за одну ночь. Радикальная фракция действовала с точностью: их военизированные ячейки захватили ключевые здания, их агенты-провокаторы в армии обеспечили безопасность важных баз. [FRA.GetLeader] и умеренные реформаторы просыпаются и обнаруживают себя пленниками, пусть и не официально. Революционные радикалы совершили свой переворот. Пятая республика мертва."
 france_md.341.a: "Революция началась."
 france_md.345.t: "Коммуна возрождается"
 france_md.345.d: "Революционные радикалы одержали полную победу. Отвергнув любые компромиссы с «буржуазной демократией», они провозгласили Французскую коммуну — подлинное рабочее государство в традициях 1871 года. Умеренные реформаторы, сформировавшие первоначальную коалицию, были либо подвергнуты чисткам, либо бежали. Красный флаг развевается над Елисейским дворцом, и революция только начинается."
 france_md.345.a: "Да здравствует Коммуна! Интернационал должен стать человечеством!"
 france_md.375.t: "Сражайся или сдавайся"
 france_md.375.d: "Традиционалистская фракция стала слишком самоуверенной. Их военизированные сети разоблачены, их проникновение в партийный аппарат раскрыто. Ходят даже слухи, что они проникли в высшее командование нашей армии и готовятся к государственному перевороту. Мы должны сделать выбор: немедленно принять меры против них и сохранить Республику, или позволить им продолжать свою работу и посмотреть, к чему это приведет. Главное управление разведки и безопасности ожидает наших приказов."
 france_md.375.a: "Жесткие меры: арестовать лидеров традиционалистов."
 france_md.375.b: "Пусть так и будет: реставрация должна продолжаться."
 france_md.376.t: "Традиционалисты захватывают власть"
 france_md.376.d: "Это произошло за одну ночь. Традиционалистская фракция действовала с точностью: их военизированные ячейки захватили ключевые здания, их союзники в армии обеспечили невмешательство. [FRA.GetLeader] и умеренные республиканцы просыпаются и обнаруживают, что их полностью оттеснили на второй план. Экстремисты совершили переворот. Пятая республика мертва. Но кто будет править новой Францией?"
 france_md.376.a: "Теперь фракциям предстоит принять решение."
 france_md.354.t: "Монархисты выбирают своего короля"
 france_md.354.d: "Монархистская фракция внутри движения теперь должна выбрать своего суверена. Представляются два претендента: Жан д'Орлеан, граф Парижский, представляет линию Орлеанистов и был бы конституционным монархом, «королём французов». Луи де Бурбон, герцог Анжуйский, представляет легитимистскую линию Людовика XIV и был бы «королём Франции» по божественному праву. Традиционалисты из «Французского действия» должны принять решение."
 france_md.354.a: "Коронован Жаном Орлеанским, королем французов."
 france_md.354.b: "Коронованный Луи де Бурбон, король Франции"
 france_md.357.t: "Триумф бонапартистов"
 france_md.357.d: "Внутрипартийная фракция бонапартистов одержала победу во внутренней борьбе. Жан-Кристоф Наполеон Бонапарт будет коронован как Наполеон VII. Военные и те, кто мечтает об имперской славе, возобладали над монархистами. Марин Ле Пен и старая республиканская гвардия Национального собрания полностью отброшены в сторону. Франция вновь станет империей."
 france_md.357.a: "Да здравствует император! Да здравствует Франция!"
 france_md.358.t: "Бонапартисты захватили власть во Франции."
 france_md.358.d: "Шокирующая новость от [FRA.GetNameWithFlag]: экстремистские фракции внутри правящей партии захватили власть и упразднили Пятую республику. Умеренное руководство оттеснено на второй план, а радикалы восстанавливают имперскую власть. Этот драматический переворот против демократии потряс весь мир. Как нам следует реагировать?"
 france_md.358.a: "Осуждаем этот экстремистский захват власти"
 france_md.358.b: "Это внутренний французский вопрос."
 FRA_extremist_paramilitary_left: "Революционная военизированная организация"
 FRA_extremist_paramilitary_left_desc: "Мы позволили радикальной фракции открыто организовывать свои военизированные сети. Эти революционные ячейки обеспечивают нам власть на улицах и контроль над потенциальным инакомыслием. Но какой ценой? Их истинная преданность остается революции, а не партийному руководству."
 FRA_extremist_paramilitary_right: "Традиционалистская военизированная группировка"
 FRA_extremist_paramilitary_right_desc: "Мы позволили традиционалистской фракции открыто организовывать свои военизированные сети. Эти ячейки «Французского действия» обеспечивают нам власть на улицах и контроль над потенциальным инакомыслием. Но какой ценой? Их истинная лояльность остается за реставрацией, а не за партийным руководством."
 FRA_radical_infiltration: "Радикальная инфильтрация"
 FRA_radical_infiltration_desc: "Радикальная фракция незаметно проникает в партийный аппарат и армию. Их революционные ячейки распространяются по различным институциям, создавая сеть, которая понадобится им, когда придёт время. Умеренное руководство не осознаёт, насколько глубоко проникла эта сеть."
 FRA_traditionalist_infiltration: "Проникновение традиционалистов"
 FRA_traditionalist_infiltration_desc: "Традиционалистская фракция незаметно проникает в партийный аппарат и армию. Их монархические ячейки распространяются по различным институциям, создавая сеть, которая понадобится им, когда придёт время. Умеренное руководство по-прежнему не осознаёт глубины проникновения."
 FRA_republic_stabilized_left: "Республика Стабилизирована"
 FRA_republic_stabilized_left_desc: "Радикальная угроза нейтрализована. Главное управление разведки и безопасности (DGSI) арестовало лидеров экстремистов и ликвидировало их военизированные ячейки. Франция остается республикой, а умеренные реформисты сохраняют контроль над левыми силами. Революции не произойдет, но мы позаботимся о том, чтобы дать людям инструменты для самовыражения другими способами."
 FRA_republic_stabilized_right: "Сильная Республика"
 FRA_republic_stabilized_right_desc: "Угроза со стороны традиционалистов подавлена, и мы использовали кризис для проведения масштабных реформ, укрепивших государственную власть. Генеральное управление разведки и безопасности (DGSI) теперь обладает расширенными полномочиями по наблюдению, полиция получила новые полномочия против экстремистских организаций, а исполнительная власть усилена. Пятая республика сохраняется: она стала сильнее, централизованнее и прочно находится под контролем националистов."
 FRA_general_strike: "Революционная всеобщая забастовка"
 FRA_general_strike_desc: "Радикальная фракция внутри левой коалиции мобилизовала рабочих на всеобщую забастовку, выходящую за рамки планов умеренного руководства. Всеобщая конфедерация труда (ВКТ) оказалась под влиянием революционных радикалов, которые видят в этом первый шаг к полному уничтожению Республики. Руководство партии потеряло контроль над движением, которое само же и создало."
 FRA_sixth_republic_idea: "Шестая республика"
 FRA_sixth_republic_idea_desc: "Пятая республика больше никому не была нужна, поэтому мы демократическим путем положили ей конец и основали новую республику, которая ближе к народу."
 FRA_commune_reborn_idea: "Французская коммуна"
 FRA_commune_reborn_idea_desc: "Революционные радикалы одержали полную победу. Умеренные реформаторы, некогда возглавлявшие левое движение, были отстранены от власти, и Франция превращается в рабочее государство. В духе 1871 года теперь управляют рабочие советы, а средства производства коллективизированы. Красный флаг развевается там, где когда-то развевался трехцветный флаг."
 FRA_kingdom_restored_idea: "Королевство восстановлено"
 FRA_kingdom_restored_idea_desc: "Экстремисты-традиционалисты внутри националистического движения осуществили свою мечту: во Франции снова есть король. Умеренные республиканцы из «Национального собрания» с недоверием наблюдают, как «Французское действие» празднует победу, и геральдическая лилия сменяет триколор."
 FRA_exploitation: "Кровь за метрополию"
 FRA_exploitation_desc: "Наши заводы, наша торговля и наши налоги в первую очередь направляются в Париж, а уже потом — нашим собственным людям. Каждая партия товара, покидающая причал, приносит нам немного больше недовольства внутри страны и немного больше дистанции от Империи."
 FRA_empire_restored_idea: "Империя восстановлена"
 FRA_empire_restored_idea_desc: "Внутри движения бонапартисты восстановили Французскую империю при Наполеоне VII. Умеренные республиканцы, создавшие Национальное объединение, были оттеснены теми, кто мечтает об имперской славе. Францией вновь правит император, и военно-традиционалистский альянс празднует свою полную победу."
 FRA_investing_eu: "Инвестирование в страну ЕС"
 FRA_investing_eu_desc: "В настоящее время мы помогаем еще одной стране ЕС в строительстве"
 FRA_election_result: "Результаты"
 FRA_election_result_desc: "Президентские выборы завершились или вот-вот завершатся; в ближайшее время намерения избирателей вряд ли изменятся."
 FRA_spy_napoleon_lar: "Бонапартийная секретная служба"
 FRA_spy_napoleon_lar_desc: "Новое поколение секретных агентов, обученных сеять раздор среди наших врагов, передает разведывательные данные в режиме реального времени штабам нашей армии, флота и военно-воздушных сил по мере того, как набирает обороты операция по отвоеванию территорий."
 FRA_spy_napoleon_non_lar: "Бонапартийная секретная служба"
 FRA_spy_napoleon_non_lar_desc: "Новое поколение секретных агентов, обученных сеять раздор среди наших врагов, следит за нашими собственными казармами и министерствами, выискивая следующий заговор против престола."
 FRA_5th_republic: "Пятая республика"
 FRA_5th_republic_desc: "Нынешняя французская политическая система существует с 1958 года. Республика, созданная генералом де Голлем и адаптированная к его потребностям. Стабильная система, но она начинает демонстрировать свои ограничения в стране, которая все больше теряет равновесие, имея всемогущего президента."
 FRA_war_against_republic: "Война против республиканизма"
 FRA_war_against_republic_desc: "Французская монархия достигла своего пика при абсолютизме. С тех пор наша страна пережила десятилетия республик, каждая из которых была более нестабильной, чем предыдущая. Республиканские и демократические ценности опасны для нашей страны и распространяются по всему миру подобно раковой опухоли. Мы должны положить этому конец."
 FRA_EU_strong: "Сила с ЕС"
 FRA_EU_strong_desc: "Быть опорой Европейского союза — это огромная ответственность, но и огромная сила. Наша судьба связана с судьбой Европейского союза, хотим мы этого или нет."
 FRA_NOTRe_law: "Закон NOTRe"
 FRA_NOTRe_law_desc: "Децентрализация во Франции не была должным образом реализована, что привело к многочисленным юридическим лазейкам и несоответствиям. Закон о новой организации территорий Республики позволит исправить эти недостатки и упростить организацию и планирование наших территорий."
 FRA_military_indus_boost: "Инвестиции в нашу оборонную промышленность"
 FRA_military_indus_boost_desc: "В условиях растущей международной напряженности мы должны не жалеть средств на подготовку к возможному конфликту."
 FRA_civilian_jobs_boost: "Сосредоточение внимания на создании рабочих мест"
 FRA_civilian_jobs_boost_desc: "Нам необходимо больше инвестировать в рынок труда, чтобы предоставить нашим гражданам разнообразные возможности трудоустройства."
 FRA_internal_investment_boost: "Сосредоточение внимания на внутренних инвестициях"
 FRA_internal_investment_boost_desc: "Предоставляя субсидии частному сектору, мы сможем стимулировать создание им новых рабочих мест."
 FRA_direct_construction_boost: "Инвестиции в общественные работы"
 FRA_direct_construction_boost_desc: "В условиях неблагоприятной рыночной конъюнктуры мы должны использовать наши трудовые ресурсы для построения экономики будущего."
 FRA_indusfarm_boost: "Субсидирование сельского хозяйства"
 FRA_indusfarm_boost_desc: "Мы должны помочь нашему сельскохозяйственному сектору вернуть себе европейские рынки, увеличив производство любыми средствами."
 FRA_civilian_infra_boost: "Инвестиции в инфраструктуру"
 FRA_civilian_infra_boost_desc: "Нам необходимо инвестировать в некрупные города, чтобы люди там имели доступ к тем же услугам, что и в крупных городах."
 FRA_indusbuild_services_boost: "Инвестиции в сферу услуг"
 FRA_indusbuild_services_boost_desc: "Мы строим экономику будущего, свободную от неконкурентоспособных и загрязняющих окружающую среду отраслей."
 FRA_techno_boost: "Инвестиции в образование"
 FRA_techno_boost_desc: "Нам необходимо дать возможность каждому получить самые передовые знания."
 FRA_res_health_boost: "Сосредоточение внимания на государственных услугах"
 FRA_res_health_boost_desc: "Мы должны восстановить систему предоставления услуг, которая слишком долго была объектом ультралиберальной политики."
 FRA_local_consumption_boost: "Поддержка переноса наших поставок продовольствия."
 FRA_local_consumption_boost_desc: "Наши столы заполнены продуктами с другого конца света, в то время как французские фермы разоряются. Сокращение цепочки от поля до тарелки позволяет сохранить ценность продукции внутри страны."
 FRA_job_planned_boost: "Инвестиции в нашу отрасль"
 FRA_job_planned_boost_desc: "Мы должны помочь нашим предприятиям создавать больше рабочих мест и предотвратить сокращения штата. Это позволит нам положить конец безработице и одновременно повысить гарантии занятости."
 FRA_ps_EUtrain: "Французская учебная миссия"
 FRA_ps_EUtrain_desc: "Французское правительство пригласило нас принять участие в совместных военных учениях с другими странами Европейского союза."
 FRA_PCF_EUtrain: "Подготовка к эскалации конфликта на Востоке"
 FRA_PCF_EUtrain_desc: "В условиях потенциальной агрессии со стороны России мы должны быть готовы противостоять ей на поле боя."
 FRA_EU_LEAVE: "Восстановление нашей экономики"
 FRA_EU_LEAVE_desc: "Наша экономика была слишком тесно интегрирована с Европейским союзом; разрыв с ним имел далеко идущие последствия. Мы восстановим её, чтобы она стала ещё сильнее и независимее."
 FRA_patriotic_fervor: "Патриотический пыл"
 FRA_patriotic_fervor_desc: "Возвращение нашей империи только начинается."
 FRA_learning_from_worforce: "Интегрирующее общество"
 FRA_learning_from_worforce_desc: "Мы находимся в процессе интеграции знаний и трудовых ресурсов братской страны."
 FRA_attack_UK_king: "Ла Рояль"
 FRA_attack_UK_king_desc: "Наше внимание может быть сосредоточено на Соединенном Королевстве как на бывшем враге Франции. Но в любом случае, рано или поздно нам придется сражаться с морской державой. Поэтому французский флот должен быть готов к морским сражениям."
 FRA_french_papacy: "Папство под контролем"
 FRA_french_papacy_desc: "Мы решили разместить штаб-квартиру Католической церкви во Франции. Таким образом, мы сможем защитить её и, следовательно, пользоваться большей легитимностью в глазах других христианских стран."
 FRA_gaullist_foreign_policy: "Внешняя политика Голлиста"
 FRA_gaullist_foreign_policy_desc: "Следуя видению генерала де Голля, Франция проводит политику стратегической независимости от обеих сверхдержав. Мы сохраняем дистанцию ​​от американской гегемонии, одновременно прагматично взаимодействуя с Россией и Китаем. Франция должна быть великой державой сама по себе, а не вассалом Вашингтона."
 FRA_anti_american_stance: "Антиамериканская позиция"
 FRA_anti_american_stance_desc: "Французское правительство заняло открыто враждебную позицию по отношению к Соединенным Штатам. Американские военные операции не получат французской поддержки, а дипломатические отношения значительно охладели. Франция идет своим собственным путем, свободным от атлантических ограничений."
 FRA_fn_russia_alignment_idea: "«Национальное ралли — Россия»: согласование позиций"
 FRA_fn_russia_alignment_idea_desc: "Правительство «Национального собрания» наладило тесные связи с Россией, что отражает исторические связи и общую оппозицию американскому либерализму. Восхваление Марин Ле Пен «традиционных ценностей» Путина привело к конкретному согласованию политических позиций по многим вопросам."
 FRA_fn_protectionism: "Экономический патриотизм"
 FRA_fn_protectionism_desc: "Тарифы и государственные закупки теперь отдают предпочтение французским производителям перед более дешевым импортом, и наши заводы работают на полную мощность, как никогда за последние годы. Наши торговые партнеры это заметили, и они не благодарны."
 FRA_fn_nationalist_policy: "Национальные предпочтения"
 FRA_fn_nationalist_policy_desc: "Одна из наших ключевых мер — это национальные предпочтения: мы стремимся отодвинуть на второй план все, что не является французским."
 FRA_communist_foreign_policy: "Коммунистическая внешняя политика"
 FRA_communist_foreign_policy_desc: "Коммунистическая партия провела радикальную переориентацию французской внешней политики: союз с Соединенными Штатами невозможен, и вместо этого Франция стремится к солидарности с социалистическими государствами по всему миру. Членство в НАТО принципиально несовместимо с нашей идеологией."
 FRA_lfi_non_aligned_policy: "Неприсоединившаяся Франция"
 FRA_lfi_non_aligned_policy_desc: "«Непокорная Франция» проводит политику неприсоединения, отвергая как американскую гегемонию, так и российский авторитаризм. Франция не будет участвовать в американских военных авантюрах и сохраняет независимость от командных структур НАТО, стремясь при этом возглавить новое движение неприсоединения."
 FRA_lfi_anti_nato: "Антинатовская политика"
 FRA_lfi_anti_nato_desc: "Мы успешно вышли из НАТО; мы больше не могли терпеть действия американского империализма. Наше нынешнее положение позволяет нам осуществлять больший контроль над нашей внешней политикой."
 FRA_worker_internationalism: "Маяк интернационализма"
 FRA_worker_internationalism_desc: "Коммунизм во Франции оказался успешным, и это факт. Этот успех означает, что у нас довольный персонал, и позволяет нам привлекать работников со всего мира."
 FRA_lfi_social_europe: "Европейская реформа государственных услуг"
 FRA_lfi_social_europe_desc: "Франция, по данным LFI, добилась успеха в продвижении новой социальной программы для Европейского союза. Это крупная победа над этим глубоко неолиберальным институтом."
 FRA_strategic_independance: "Стратегическая независимость"
 FRA_strategic_independance_desc: "Франция взяла на себя обязательство обеспечить полную стратегическую автономию, сохраняя свой независимый ядерный потенциал сдерживания и отказываясь от подчинения какой-либо иностранной державе. Американские базы не приветствуются на французской территории, и Франция будет самостоятельно принимать решения о военных интервенциях."
 FRA_global_south_solidarity: "Солидарность глобального Юга"
 FRA_global_south_solidarity_desc: "Колониализм, несомненно, оказал значительное влияние на развитие стран Глобального Юга. Мы поступим правильно, помогая им оправиться от последствий этого."
 FRA_sovereigntist_eu_policy: "Суверенная политика ЕС"
 FRA_sovereigntist_eu_policy_desc: "Франция блокирует дальнейшую федерализацию ЕС, защищая национальный суверенитет от технократии Брюсселя. Оставаясь в ЕС, мы накладываем вето на любую передачу суверенитета и выступаем против создания европейского сверхгосударства. Франция не станет провинцией."
 FRA_distance_nato: "Расстояние от НАТО"
 FRA_distance_nato_desc: "Следуя прецеденту де Голля 1966 года, Франция дистанцируется от интегрированной командной структуры НАТО, оставаясь при этом членом договора. Американские войска не размещены на французской территории, и Франция оставляет за собой право на независимые военные действия."
 FRA_left_nato: "Левый НАТО"
 FRA_left_nato_desc: "Франция полностью вышла из Организации Североатлантического договора. Больше не связанная статьей 5, Франция выбирает по-настоящему независимый курс в военных делах, полностью отвергая американскую гегемонию."
 FRA_political_balance: "Тенденции общественного мнения"
 FRA_political_balance_desc: "Хотя наши институты были созданы для обеспечения стабильности, политическое равновесие никогда не было столь шатким. Партии поднимаются и падают. Кем бы вы ни были, вам необходимо укрепить наше влияние на общественное мнение."
 FRA_econ_policy: "Состояние французской экономики"
 FRA_econ_policy_desc: "Французская экономика — хороший пример западной экономики на заре нового тысячелетия, переходящей от промышленной державы к экономике, находящейся в процессе реструктуризации. Мы увидим, как ваши реформы повлияют на ее дальнейшее развитие."
 FRA_social_balance: "Французская социальная политика"
 FRA_social_balance_desc: "Франция — страна, которая вкладывает значительные средства в свою социальную политику на всех уровнях. Однако большинство партий имеют претензии к этой политике. У каждого свое мнение о том, как ее следует изменить. Мы увидим, как ваши решения повлияют на нее."
 FRA_6th_rep: "Реформы Шестой республики"
 FRA_6th_rep_desc: "Непокорная Франция преуспела в реформировании Пятой республики. Но помимо институтов, эти реформы будут иметь далеко идущие последствия для французского общества и французской экономики."
 FRA_Commies_agenda: "Политика Французской коммуны"
 FRA_Commies_agenda_desc: "Французская Коммуна решила полностью порвать с прошлым и полна решимости перестроить общество с нуля."
 FRA_Bonapartist_agenda: "Имперское общество"
 FRA_Bonapartist_agenda_desc: "Наш новый император решил реформировать французское общество, чтобы сделать его более сильным и процветающим перед лицом грядущих конфликтов."
 FRA_Royalist_agenda: "Новое общество Франка"
 FRA_Royalist_agenda_desc: "Мы должны положить конец всем дьявольским творениям проклятой революции. Мы восстановим франкское общество на прочном фундаменте."
 FRA_World_revolution: "Мировая революция"
 FRA_World_revolution_desc: "Освобождая народы от капитализма, мы объединяемся с народами, которые несут с собой как свои знания, так и свои надежды. Вскоре Интернационал станет всем человечеством."
 FRA_arab_solidarity_tt: "Улучшение отношений с арабскими странами и странами с мусульманским большинством населения."
 FRA_blocks_eu_federalization_tt: "Франция блокирует федерализацию ЕС из-за своей политики суверенитета."
 FRA_cannot_ally_usa_hard_tt: "Не может быть союзником США"
 FRA_cannot_host_american_bases_tt: "Не может принимать американские военные базы."
 FRA_cannot_join_american_coalitions_tt: "Невозможно присоединиться к возглавляемым США военным коалициям."
 FRA_debt_forgiveness_tt: "Поддерживает списание долгов и сотрудничество в области развития для стран Глобального Юга."
 FRA_demands_eu_social_reform_tt: "Требования социальной реформы институтов Европейского союза"
 FRA_immigration_restrictions_tt: "Иммиграция во Францию ​​строго ограничена."
 FRA_improved_russia_relations_tt: "Улучшение отношений с Россией"
 FRA_israel_relations_penalty_tt: "Ухудшение отношений с Израилем"
 FRA_left_nato_command_tt: "Франция вышла из объединенной командной структуры НАТО."
 FRA_non_aligned_policy_tt: "Франция проводит политику неприсоединения."
 FRA_opposes_nato_expansion_tt: "Выступает против дальнейшего расширения НАТО."
 FRA_socialist_solidarity_tt: "Улучшение отношений с социалистическими и коммунистическими государствами."
 FRA_trade_protectionism_tt: "Отечественная промышленность защищена от иностранной конкуренции."
 FRA_usa_relations_penalty_tt: "Ухудшение отношений с Соединенными Штатами."
 FRA_worker_solidarity_tt: "Привлекает работников со всего мира благодаря международной трудовой солидарности."
 france_md.800.t: "Франция выступает против Америки"
 france_md.800.d: "Новое французское правительство заняло открыто антиамериканскую позицию, отвергая сотрудничество с Вашингтоном и резко критикуя американскую внешнюю политику. Это представляет собой резкий сдвиг в трансатлантических отношениях. Как должны отреагировать Соединенные Штаты на этот враждебный поворот в Париже?"
 france_md.800.a: "Осуждаем эту враждебную политику"
 france_md.800.b: "Попытка дипломатического налаживания контактов"
 france_md.801.t: "Американская дипломатическая увертюра"
 france_md.801.d: "Несмотря на нашу антиамериканскую позицию, Вашингтон предпринял дипломатические шаги, стремясь сохранить определенный уровень сотрудничества. Госдепартамент, похоже, готов закрыть глаза на нашу риторику в обмен на ограниченное взаимодействие. Как нам следует реагировать на эти американские инициативы?"
 france_md.801.a: "Полностью отвергнуть американские предложения."
 france_md.801.b: "Рассмотрите возможность ограниченного сотрудничества."
 france_md.802.t: "Франция поворачивается навстречу России"
 france_md.802.d: "Новое французское правительство обозначило резкое изменение внешней политики, стремясь к более тесным связям с Москвой и одновременно дистанцируясь от Вашингтона. Это возможность расширить российское влияние в Западной Европе. Как нам следует реагировать на эту французскую перестройку?"
 france_md.802.a: "Укрепить связи с Францией"
 france_md.802.b: "Действуйте осторожно."
 france_md.803.t: "Последствия коммунистической внешней политики"
 france_md.803.d: "Наша коммунистическая внешняя политика изолировала нас от традиционных западных союзников, но открыла двери для социалистических и антиимпериалистических движений по всему миру. Куба, Венесуэла и другие левые правительства приветствуют нашу новую ориентацию. Однако это происходит за счет наших отношений с союзниками по НАТО и традиционными партнерами."
 france_md.803.a: "Примите социалистическую солидарность."
 france_md.803.b: "Смягчить наш подход"
 france_md.804.t: "Франция на значительном расстоянии от НАТО"
 france_md.804.d: "[FRA.GetNameWithFlag] объявил о политике дистанцирования от НАТО, повторяя позицию де Голля 1966 года, когда он вышел из интегрированной командной структуры. Французское правительство подчеркнуло «стратегическую независимость» и отвергло подчинение американскому военному командованию. Как следует оценивать это развитие событий?"
 france_md.804.a: "Выразить обеспокоенность по поводу сплоченности альянса"
 france_md.804.b: "Сохранять нейтралитет в отношении французской политики."
 france_md.805.t: "Признание Палестины"
 france_md.805.d: "Наша крайне левая внешняя политика обязывает нас признать Государство Палестина и поддержать решение о создании двух государств. Это улучшит отношения с арабскими государствами и будет соответствовать нашим антиимпериалистическим принципам, но нанесет ущерб отношениям с Израилем и, возможно, с Соединенными Штатами. Стоит ли нам приступать к формальному признанию?"
 france_md.805.a: "Немедленно признайте Палестину."
 france_md.805.b: "Пока что отсроченное признание."
 france_md.806.t: "Франция признает Палестину"
 france_md.806.d: "Французское правительство официально признало Государство Палестина, что знаменует собой значительный сдвиг во внешней политике Парижа. Это решение сближает Францию ​​со многими европейскими странами, но представляет собой отход от прежнего осторожного подхода. Как Израилю следует отреагировать на это дипломатическое событие?"
 france_md.806.a: "Решительно осуждаю признание со стороны Франции."
 france_md.806.b: "Дайте взвешенный ответ."
 france_md.807.t: "Дилемма войны на Украине"
 france_md.807.d: "Вторжение России в Украину представляет собой кризис для нашей пророссийской внешней политики. Наша прежняя сплоченность с Москвой теперь крайне проблематична, поскольку российские танки въезжают в суверенное европейское государство. Политическая цена сохранения нейтралитета огромна, но осуждение России означало бы полный разворот. Какую позицию должна занять Франция?"
 france_md.807.a: "Осудить российскую агрессию"
 france_md.807.b: "Сохраняйте нейтралитет."
 france_md.807.c: "Поддержать позицию России"
 france_md.808.t: "Французская суверенная политика"
 france_md.808.d: "[FRA.GetNameWithFlag] занял жесткую суверенистскую позицию в рамках Европейского союза, блокируя дальнейшую интеграцию и накладывая вето на передачу суверенитета Брюсселю. Французское правительство выступает за «Европу наций», а не за федеративное сверхгосударство. Как нам следует реагировать на этот французский обструкционизм?"
 france_md.808.a: "Выступайте против французского обструкционизма"
 france_md.808.b: "Проявить сочувствие к проблемам суверенитета."
 france_md.809.t: "Инициатива Движения неприсоединения"
 france_md.809.d: "Наша политика неприсоединения привлекла внимание других стран, ищущих альтернативы американской и российской сферам влияния. У нас есть возможность позиционировать Францию ​​как лидера нового движения неприсоединения, сотрудничая с Индией, Бразилией и другими крупными державами за пределами традиционных блоков."
 france_md.809.a: "Стремитесь к независимому лидерству."
 france_md.809.b: "Сосредоточьтесь на внутренних приоритетах"
 france_md.810.t: "Стратегическая независимость Франции"
 france_md.810.d: "[FRA.GetNameWithFlag] объявил о политике полной стратегической независимости, отказываясь от подчинения какой-либо иностранной державе и подчеркивая роль французского ядерного сдерживания. Это может иметь последствия для франко-германского партнерства, которое является основой европейского сотрудничества. Как должна отреагировать Германия?"
 france_md.810.a: "Выразить обеспокоенность по поводу двусторонних отношений"
 france_md.810.b: "Уважайте французский суверенитет."
 france_md.811.t: "Франция поддерживает многополярность"
 france_md.811.d: "Французское правительство заявило о поддержке многополярного мирового порядка, отвергая американскую гегемонию и стремясь к более тесным связям с растущими державами. Это открывает для Китая возможность расширить свое влияние в Европе. Как Пекин должен отреагировать на это открытие со стороны Франции?"
 france_md.811.a: "Укрепить связи с Францией"
 france_md.811.b: "Сохраняйте осторожность в общении."
 france_md.812.t: "Франция выходит из НАТО"
 france_md.812.d: "Мы официально вышли из Организации Североатлантического договора, завершив разрыв с американской гегемонией. Теперь Франция осталась одна, не связанная статьей 5 и не подчиняющаяся американскому военному командованию. Это решение открывает как новые возможности, так и реальные опасности. Какой путь должна выбрать Франция?"
 france_md.812.a: "Принять полную стратегическую независимость"
 france_md.812.b: "Ищите новые союзы"
 FRA_extremist_foreign_policy_category: "Экстремистская внешняя политика"
 FRA_extremist_foreign_policy_category_desc: "Дипломатические и внешнеполитические действия, доступные Франции при экстремистском или голлистском правлении."
 FRA_rejoin_nato_command: "Воссоединиться с Объединенным командованием НАТО"
 FRA_rejoin_nato_command_desc: "После выхода из НАТО мы можем принять решение о возвращении в интегрированную структуру военного командования. Это восстановит наши позиции в альянсе и улучшит отношения с американскими и европейскими союзниками."
 FRA_seek_russian_partnership: "Стремиться к партнерству с Россией"
 FRA_seek_russian_partnership_desc: "Наша независимая внешняя политика создает возможность для укрепления связей с Москвой. Мы можем стремиться к более тесным дипломатическим и экономическим отношениям с Россией, хотя это еще больше обострит отношения с Вашингтоном."
 FRA_recognize_palestine: "Признать Палестину"
 FRA_recognize_palestine_desc: "Наша антиимпериалистическая внешняя политика требует от нас признания Государства Палестина и поддержки права палестинского народа на самоопределение. Это улучшит отношения с арабскими государствами, но нанесет ущерб связям с Израилем."
 FRA_condemn_russia_ukraine: "Осудить российскую агрессию"
 FRA_condemn_russia_ukraine_desc: "Вторжение России в Украину сделало нашу пророссийскую позицию политически несостоятельной. Мы можем осудить агрессию и дистанцироваться от Москвы, хотя это и представляет собой существенный сдвиг в политике."
 FRA_non_aligned_initiative: "Инициатива неприсоединившихся лидеров"
 FRA_non_aligned_initiative_desc: "Наша политика неприсоединения позволяет Франции возглавить новое движение стран, стремящихся к альтернативам как американской гегемонии, так и российскому влиянию. Мы можем укрепить связи с Индией, Бразилией и другими крупными державами за пределами традиционных блоков."
 FRA_socialist_solidarity: "Социалистическая солидарность"
 FRA_socialist_solidarity_desc: "Наша коммунистическая внешняя политика призывает к солидарности с социалистическими государствами по всему миру. Мы можем укрепить связи с Кубой, Венесуэлой и другими левыми правительствами, создавая международную сеть антикапиталистического сотрудничества."
 FRA_veto_eu_federalization: "Вето на федерализацию ЕС"
 FRA_veto_eu_federalization_desc: "Будучи суверенным государством в составе ЕС, мы можем использовать наше право вето, чтобы блокировать дальнейшую федерализацию и передачу суверенитета Брюсселю. Это защищает независимость Франции, но обостряет отношения с государствами-членами, выступающими за интеграцию."
 FRA_immigration_wave: "Воспользуйтесь волной иммиграции"
 FRA_immigration_wave_desc: "Нынешняя либеральная иммиграционная политика Франции привела к значительному притоку мигрантов. В то время как одни рассматривают это как гуманитарную необходимость или экономическую возможность, другие относятся к этому с растущей обеспокоенностью. Партия «Национальное собрание» может использовать эти настроения, позиционируя себя как защитника французской идентичности и безопасности. Чем открытее наши границы, тем сильнее будет ответная реакция, которую мы сможем использовать."
 FRA_high_immigration_tooltip: "Франция должна иметь §YОткрытые границы§! или §YСлабо регулируемая иммиграция§! закон"
 FRA_immigration_backlash: "Реакция на иммиграцию"
 FRA_immigration_backlash_desc: "Французское общество охватывает волна антииммиграционных настроений. Послания Национального собрания по вопросам иммиграции, безопасности и национальной идентичности находят отклик у всё большей части населения, смещая политический ландшафт вправо и ослабляя поддержку существующего положения дел."
 FRA_end_extraction: "Ограничить извлечение ресурсов"
 FRA_end_extraction_desc: "В рамках реализации нашей экологической стратегии мы введем строгие правила в отношении добычи полезных ископаемых, нефтедобычи и тяжелой промышленности на всей территории континентальной Франции. Это сократит внутреннее производство ресурсов примерно на треть, но является необходимым шагом для защиты окружающей среды. Будущие правительства могут отменить эту политику, если изменятся обстоятельства."
 FRA_green_extraction_ban: "Ограничения на добычу полезных ископаемых в целях охраны окружающей среды"
 FRA_green_extraction_ban_desc: "Франция ввела всеобъемлющие экологические ограничения на добычу природных ресурсов. Горнодобывающая промышленность сталкивается со строгими ограничениями, бурение нефтяных скважин жестко регулируется, а промышленная добыча должна соответствовать жестким экологическим стандартам. Хотя это сократило доступность внутренних ресурсов примерно на треть, снижение уровня загрязнения привело к ощутимым улучшениям в сфере здравоохранения: значительно снизился уровень заболеваемости раком в бывших промышленных регионах, а расходы на здравоохранение сокращаются."
 FRA_environmental_policy_decisions: "Экологическая политика"
 FRA_environmental_policy_decisions_desc: "Решения, касающиеся экологической политики Франции и правил добычи природных ресурсов."
 FRA_reverse_extraction_ban: "Отменить ограничения, установленные Кодексом горнодобывающей промышленности."
 FRA_reverse_extraction_ban_desc: "Переписанный горнодобывающий кодекс разорил нашу добывающую промышленность и сделал перерабатывающие заводы зависимыми от импорта. Его отмена восстановит внутреннее производство и разорвет отношения с «зелеными» и экологическими организациями, которые его разработали."
 france_md.960.t: "Франция переписывает свой горнодобывающий кодекс."
 france_md.960.d: "[FRA.GetNameWithFlag] Франция пересмотрела свой горнодобывающий кодекс, отменив разрешения на добычу углеводородов и ограничив ее на всей территории континентальной Франции. Вместе с этим исчезнет примерно треть французской внутренней добычи. Экологические ассоциации ликуют, а промышленные федерации уже находятся в Брюсселе, предупреждая о прецеденте."
 france_md.960.a: "Прецедент, которому стоит следовать"
 france_md.960.b: "За это заплатит европейская промышленность."
 france_md.900.t: "Скрытый счет министра бюджета"
 france_md.900.d: "Наш министр бюджета, возглавляющий кампанию по борьбе с налоговым мошенничеством из Берси, отрицал наличие иностранного счета на счете самого Национального собрания. Сайт, занимающийся расследованиями, опубликовал подробности: сначала Женева, затем Сингапур. Опровержение зафиксировано официально, и это была ложь."
 france_md.900.a: "Уволить министра и передать дело прокурорам."
 france_md.900.b: "Принять тихую отставку"
 france_md.900.c: "Поддержите министра"
 france_md.901.t: "Орган по обеспечению прозрачности в общественной жизни"
 france_md.901.d: "Скандал сделал декларирование активов неизбежным. Мы можем создать независимый орган по обеспечению прозрачности в общественной жизни, обязывающий каждого министра, депутата и сенатора подавать декларации о своих интересах и имуществе, с правом передавать сомнительные дела в прокуратуру. Ассамблея будет возмущена каждой строкой этого документа."
 france_md.901.a: "Создать орган по обеспечению прозрачности"
 france_md.901.b: "Опубликуйте кодекс поведения и двигайтесь дальше."
 france_md.902.t: "Вымышленный парламентский помощник кандидата"
 france_md.902.d: "Газета Le Canard enchaîné опубликовала платежные ведомости: ведущий кандидат в президенты включил члена своей семьи в парламентский штат на работу, факт которой никто в офисе подтвердить не может. Финансовая газета Национального парка начала предварительное расследование тем же утром. Кандидат называет это институциональным заговором и отказывается уйти в отставку."
 france_md.902.a: "Снимите кандидата с выборов."
 france_md.902.b: "Продолжайте кампанию, несмотря ни на что."
 france_md.902.c: "Вините судей и прессу."
 france_md.903.t: "Бывший президент под присягой"
 france_md.903.d: "Бывший президент республики обвиняется в фиктивных муниципальных должностях, оплачиваемых налогоплательщиками Парижа, и в выставлении счетов предвыборной кампании компании за митинги, которые никогда не проводились. Президентский иммунитет закончился с окончанием его срока. Коррекционный суд назначил дату слушания."
 france_md.903.a: "Пусть суд делает свою работу."
 france_md.903.b: "Осудить политический суд"
 france_md.910.t: "Жёлтые жилеты на кольцевых развязках"
 france_md.910.d: "Налог на выбросы углекислого газа при производстве дизельного топлива вынудил всех водителей на кольцевых развязках страны носить светоотражающие жилеты. За этим нет ни профсоюза, ни партии, ни делегации, с которыми можно было бы вести переговоры: только водители, мелкие торговцы и пенсионеры, которые не могут позволить себе еще один цент на заправке. По субботам проходят непрерывные демонстрации."
 france_md.910.a: "Отменить повышение налога на топливо."
 france_md.910.b: "Продолжайте обсуждение налогов и открытые переговоры."
 france_md.910.c: "Держитесь подальше от налогов."
 france_md.911.t: "Елисейские поля сгорают в субботу."
 france_md.911.d: "Субботние марши на Елисейских полях теперь заканчиваются применением слезоточивого газа, Триумфальная арка разрисована граффити, а расположенные на проспекте пивные разграблены. В полиции заканчиваются отдохнувшие подразделения CRS, и в этом обвиняют весь день. Магазины заколачивают витрины на сезон."
 france_md.911.a: "Созвать Большой национальный дебат"
 france_md.911.b: "Повысить минимальную заработную плату и сократить отчисления на пенсионное обеспечение."
 france_md.911.c: "Отправьте CRS"
 france_md.912.t: "Пятый месяц на кольцевых развязках"
 france_md.912.d: "Захват территорий продолжается уже пятый месяц, а применение резиновых пуль нашей собственной полицией само по себе является предметом судебного расследования. Захваты в центре города резко сократились, и префектуры больше не могут искать новые компании. Матиньон хочет получить решение на этой неделе."
 france_md.912.a: "Объявить экономическое и социальное чрезвычайное положение"
 france_md.912.b: "Запретить марши и ввести чрезвычайное положение."
 france_md.920.t: "Социалисты теряют свою штаб-квартиру"
 france_md.920.d: "Государственное финансирование зависит от количества мест в парламенте, и после последних двух туров их не хватает даже на оплату счетов в Сольферино. Фрондеры хотят вернуть партию в левое русло, мэры и уходящие министры хотят, чтобы она оставалась дееспособной для управления страной, и обе фракции пытаются переманить извне. Здание уже оценено."
 france_md.920.a: "Поверните группу обратно налево."
 france_md.920.b: "Укрепить позиции партии в правящем центре."
 france_md.920.c: "Пусть крылья выйдут наружу"
 france_md.921.t: "Партия обсуждает дедиаболизацию"
 france_md.921.d: "Новое руководство «Национального собрания» хочет респектабельности: экономические аргументы вместо этнических, никаких провокаций по поводу лагерей для беженцев и кандидатов, способных выдержать телевизионное интервью. Цель — Республиканский фронт, который исключал партию из каждого второго тура. Основатели называют это капитуляцией."
 france_md.921.a: "Пусть партия придет в себя."
 france_md.921.b: "Принудить партию придерживаться своей старой линии"
 france_md.921.c: "Пусть семья основателей ссорится публично."
 france_md.922.t: "Основатель против собственной партии"
 france_md.922.d: "Основатель партии повторил свою старую провокацию о лагерях, причем на камеру, в разгар кампании, в которой он не участвует. Руководство созвало дисциплинарную комиссию и исключает почетную должность президента из устава. Съезд решит, сохранит ли партия свое название."
 france_md.922.a: "Передайте эстафету новому поколению."
 france_md.922.b: "Изгнать основателя"
 france_md.923.t: "Правые раскалывают Республиканский фронт"
 france_md.923.d: "Лидер традиционных правых выступил в вечерних новостях и объявил о предвыборном пакте с «Национальным собранием», не обсудив это со своим политическим бюро. Бюро пришлось собраться в арендованном помещении, поскольку штаб-квартира партии была закрыта. Сорок лет существования «Республиканского фронта» завершились одним-единственным выступлением."
 france_md.923.a: "Изгоните его и откажитесь от соглашения."
 france_md.923.b: "Ратифицировать соглашение для второго раунда"
 france_md.923.c: "Пусть вечеринка распадётся на две части."
 france_md.930.t: "Восемь профсоюзов против пенсионной реформы"
 france_md.930.d: "Повышение установленного законом пенсионного возраста впервые за целое поколение объединило все восемь представительных профсоюзов на одной платформе. SNCF и RATP проводят поэтапные забастовки, следующими будут нефтеперерабатывающие заводы, а в Ассамблее нет большинства для принятия текста. Статья 49.3 обсуждается в Матиньоне."
 france_md.930.a: "Протолкните текст силой 49,3"
 france_md.930.b: "Вести переговоры с профсоюзами-реформаторами."
 france_md.930.c: "Удалите текст"
 france_md.931.t: "Реформистские профсоюзы предлагают условия"
 france_md.931.d: "Конфедерации-реформаторы согласятся на более поздний пенсионный возраст, если он будет вводиться ежеквартально и если за долгую карьеру и тяжелый труд будут предусмотрены исключения. Экономия сократится вдвое, а федерации жесткой линии вообще ничего не подпишут. Это единственный документ, на котором есть подписи."
 france_md.931.a: "Подпишите компромисс"
 france_md.931.b: "Откажитесь и позвольте забастовкам продолжаться."
 france_md.932.t: "Университеты заблокированы"
 france_md.932.d: "В связи с принятием на работу трудового договора, позволяющего работодателям увольнять лиц моложе 26 лет без объяснения причин, у ворот Сорбонны и половины кампусов провинциальных университетов были установлены мусорные баки. К студенческим союзам присоединились лицеи и CGT (Объединенный налог на прирост капитала). Префектура запрашивает разрешение на снос зданий."
 france_md.932.a: "Расторгнуть договор"
 france_md.932.b: "Вести переговоры со студенческими союзами."
 france_md.932.c: "Освободите кампусы"
 france_md.940.t: "Напряженные выборы"
 france_md.940.d: "Первый тур местных выборов исключил из числа кандидатов от правящей партии большинство городов Франции и вывел во второй тур экстремистскую партию. В течение часа раздались призывы к созданию республиканского фронта: голосуйте за того, кто останется, а потом спорьте об этом. Другие же отвечают, что голоса, полученные таким образом, не являются мандатом."
 france_md.940.a: "Призыв к созданию республиканского фронта"
 france_md.940.b: "Предоставьте право проведения второго тура избирателям."
 france_md.940.c: "Воспринимайте результат как приговор нам."
 france_md.941.t: "Движение вне старых партий"
 france_md.941.d: "Бывший министр покинул правительство, чтобы создать собственное движение, не имеющее ни левых, ни правых взглядов, финансируемое за счет продажи билетов на митинги и основанное на списках членов, собранных путем обхода домов. Депутаты от обеих правящих партий уже интересуются местами в его списках. Ни у одной из партий нет кандидата, который бы пользовался большей популярностью, чем он."
 france_md.941.a: "Поддержите движение"
 france_md.941.b: "Отмахнитесь от этого как от мимолетной моды."
 france_md.941.c: "Принудить старые партии к обновлению"
 france_md.950.t: "Ночи беспорядков в пригородах"
 france_md.950.d: "Двое подростков погибли, пытаясь скрыться от проверки документов в одном из городов Сены-Сен-Дени. К третьей ночи число сгоревших автомобилей исчислялось тысячами, от северных пригородов до Тулузы и Страсбурга. Мэры городов просят ввести комендантский час в соответствии с законом 1955 года."
 france_md.950.a: "Введение комендантского часа в соответствии с законом 1955 года."
 france_md.950.b: "Профинансируйте агентство по обновлению и приоритетные подразделения."
 france_md.950.c: "Обещание очистить поместья от посторонних глаз"
 france_md.949.t: "Скоординированные атаки по всему Парижу"
 france_md.949.d: "Теракты продолжаются в восточных округах и на стадионе «Стад де Франс». Организация «Один пояс, один путь» находится у входа в концертный зал, где находятся заложники. Все больницы в регионе Иль-де-Франс перешли в режим чрезвычайной ситуации."
 france_md.949.a: "Объявить трехдневный национальный траур"
 france_md.951.t: "Парламент созывает заседание Конгресса."
 france_md.951.d: "Марши закончились, и обе палаты созваны в Версаль. Бово хочет продлить режим чрезвычайного положения и удвоить количество кораблей Sentinelle, набережная Орсе хочет отправить группу корреспондентов на восток, а Государственный совет уже предупреждает нас об административных обысках."
 france_md.951.a: "Продлить срок действия"
 france_md.951.b: "Отправьте авианосную группу на восток."
 france_md.951.c: "Отказать в предоставлении чрезвычайных полномочий"
 france_md.952.t: "Европейский конституционный референдум"
 france_md.952.d: "Договор будет передан на рассмотрение стране, а не Конгрессу, и избирательная кампания расколола обе правящие партии надвое. Левые позиционируют отказ от договора как защиту права на привлечение мигрантов, а правые — как конец французского суверенитета. Последние опросы показывают, что обе партии имеют примерно одинаковый разрыв в голосах."
 france_md.952.a: "Активно агитируйте за «да»"
 france_md.952.b: "Держитесь подальше от предвыборной кампании"
 france_md.952.c: "Ратифицировать Конгрессом вместо этого"
 france_md.953.t: "Левые выработали единую платформу."
 france_md.953.d: "Социалисты, коммунисты, зеленые и инсумисы делят между собой избирательные округа, выдвигая по одной кандидатуре за раз. Камни преткновения не сдвинулись с места со времен последней попытки: европейские договоры и вопрос о том, кто возглавит предвыборную программу. Каждая партия подсчитывает, не приведет ли эта сделка к потере большего количества мест, чем к их завоеванию."
 france_md.953.a: "Возглавьте блок умеренным политиком."
 france_md.953.b: "Пусть инсуми создадут платформу"
 france_md.953.c: "Пусть переговоры провалятся."
 france_md.954.t: "Собрание без большинства"
 france_md.954.d: "Ассамблея возобновила работу в трех блоках, и ни один из них не может набрать 289 мест. Любой кандидат в Матиньоне может быть подвергнут порицанию в день назначения, а бюджет должен быть принят до окончания сессии. Елисейский дворец принимает лидеров партий по одному, но безрезультатно."
 france_md.954.a: "Назначить правительство из технических специалистов."
 france_md.954.b: "Расформироваться и вернуться в страну"
 france_md.954.c: "Сформировать коалицию между блоками."
 FRA_ps_platform: "Платформа Социалистической партии"
 FRA_ps_platform_desc: "Партия строит свою политику на основе достижений плюралистического левого движения: тридцатипятичасовая рабочая неделя, всеобщее медицинское страхование и трудовые договоры для молодежи, и все это финансируется за счет расширения налоговой базы, а не за счет заимствований. Каждое обещание, данное на съезде, подкреплено бюджетной статьей, и партия «Ру де Сольферино» намерена, чтобы ее оценивали по тому, поступят ли деньги."
 FRA_udf_platform: "Платформа центристского союза"
 FRA_udf_platform_desc: "Центристская партия выступает за снижение налогов для бизнеса, смягчение трудового законодательства и прекращение привычки решать каждую проблему новым налогом. Ее аргумент заключается в том, что капитал останется во Франции только в том случае, если Франция перестанет рассматривать инвестиции как нечто, за что следует наказывать."
 FRA_lr_platform: "Правая платформа республиканцев"
 FRA_lr_platform_desc: "Правые голлисты предлагают классический вариант сделки Пятой республики: армию, финансируемую для самостоятельных действий, когда это потребуется республике, и государство, лишенное накопившихся вокруг него административных уровней. Порядок внутри страны и независимость за рубежом представлены как одна и та же политика."
 FRA_rpf_platform: "Суверенистская платформа"
 FRA_rpf_platform_desc: "Паскуа и де Вилье проводят кампанию, опираясь на одно-единственное утверждение: ни один договор не может передавать то, что принадлежит французскому народу, и они применяют это утверждение как к евро, так и к Шенгенской зоне и полномочиям Комиссии. Торговые партнеры воспринимают эту программу как угрозу всем соглашениям, подписанным ими с Парижем."
 FRA_fn_platform: "Платформа Национального фронта"
 FRA_fn_platform_desc: "Программа партии целиком и полностью состоит из приоритетов в жилищной сфере, трудоустройстве и социальном обеспечении, приостановки воссоединения семей и восстановления пограничного контроля. Она привлекает толпы, которые не может собрать ни одна другая партия, и в равной степени усиливает оппозицию всех остальных партий к этой партии."
 FRA_lfi_platform: "Платформа «Франция не сломлена»"
 FRA_lfi_platform_desc: "Движение выступает за созыв учредительного собрания для упразднения президентской монархии, и строит свою аргументацию на улицах и в залах собраний, а не в Национальном собрании. Главное требование — бесплатное медицинское обслуживание по месту оказания помощи, и старые партийные пристрастия исчезают по мере продвижения кампании."
 FRA_eelv_platform: "Экологическая платформа"
 FRA_eelv_platform_desc: "Партия зеленых требует свернуть программу строительства реакторов, обеспечить соответствие строительства требованиям экологической экспертизы и направить средства на исследования по поиску замены как реакторам, так и современным аналогам. Описываемый ими переход реален, как и десятилетие замедления темпов строительства, которое он требует."
 FRA_pcf_platform: "Платформа Коммунистической партии"
 FRA_pcf_platform_desc: "Партия по-прежнему контролирует муниципалитеты «красного пояса» и профсоюзные секции крупных заводов, и проводит кампании там, где у нее больше всего сил: на рабочих местах, по вопросам заработной платы, рабочего времени и защиты занятости в промышленности. Там, где действуют ячейки, заводы работают лучше, чем предсказывают отчеты."
 FRA_idea_transparency_reforms: "Прозрачность в общественной жизни"
 FRA_idea_transparency_reforms_desc: "Теперь каждый министр, депутат и сенатор подает декларацию о своих интересах и активах в независимый орган, который может ее опубликовать и передать сомнительные дела в прокуратуру. Политический класс возмутился этой обязанностью и выполнил ее."
 FRA_idea_national_debate: "Гранд Национальные Дебаты"
 FRA_idea_national_debate_desc: "В течение двух месяцев мэры открывают свои залы заседаний для всех желающих, и поступают десятки тысяч откликов. Это требует денег и времени министров, и переносит обсуждение с кольцевых развязок в городские ратуши."
 FRA_idea_social_emergency_measures: "Экономический и социальный чрезвычайный положение"
 FRA_idea_social_emergency_measures_desc: "Была повышена надбавка к минимальной заработной плате, сверхурочные выплаты были вычтены из налогов, а повышение надбавки к заработной плате для пенсионеров с меньшими выплатами было отменено. Законопроект попадает в дефицит бюджета в том же квартале, и Брюссель это заметил."
 FRA_idea_pension_reform_passed: "Пенсионная реформа в соответствии со статьей 49.3"
 FRA_idea_pension_reform_passed_desc: "Пенсионный возраст был повышен без голосования, в соответствии со статьей, возлагающей ответственность на правительство, а вот предложение о порицании не набрало достаточного количества голосов депутатов. Пенсионные счета улучшаются, и каждое наше последующее сообщение в Ассамблею будет прочитано через призму этого."
 FRA_idea_pension_compromise: "Переговоры о пенсионной реформе"
 FRA_idea_pension_compromise_desc: "Пенсионный возраст повышается ежеквартально, с исключениями для длительной карьеры и для работы, классифицируемой как тяжелая. Конфедерации реформистов подписали соглашение, федерации жесткой линии — нет, и экономия составляет примерно половину от обещанного в первоначальном тексте."
 FRA_idea_political_renewal: "Обновление политического класса"
 FRA_idea_political_renewal_desc: "Половина депутатов Ассамблеи никогда не занимала выборных должностей, а партийные машины больше не контролируют выдвижение кандидатов самостоятельно. Новое поколение заметно, энергично и совершенно неопытно."
 FRA_idea_urban_renewal: "Обновление городской среды в городах-ситах"
 FRA_idea_urban_renewal_desc: "Агентство по реконструкции заключает пятнадцатилетние соглашения с мэрами приоритетных районов, сносит самые ветхие высотки и перестраивает расположенные за ними школы. Результаты становятся известны лишь спустя долгое время после того, как правительство, отдавшее эти распоряжения, придет к власти."
 FRA_idea_national_unity: "Национальное единство после терактов"
 FRA_idea_national_unity_desc: "Оппозиция приостановила свои выступления, триколоры развеваются у окон, а в резерве и жандармерии добровольцев больше, чем они могут обслужить. Это не продлится до конца года, и пока это продолжается, это чего-то стоит."
 FRA_idea_technocratic_government: "Правительство техников"
 FRA_idea_technocratic_government_desc: "Префекты, финансовые инспекторы и бывшие сотрудники центрального банка занимают министерские посты, назначаемые из Елисейского дворца и терпимые Ассамблеей, которая не может договориться ни по одному другому вопросу. Они могут принять бюджет. Они не могут провести реформу."
 FRA_heightened_security: "Активный план Вигипирата"
 FRA_heightened_security_desc: "В рамках операции «Сентинель» охрана объектов повышенной важности была усилена, а функции охраны важных объектов перешли от полиции к армии. Тысячи солдат теперь стоят у вокзалов, школ и мест отправления культа, и армия выставляет счета за эти расходы в счет своей боеготовности, а не в бюджет Бово."
 FRA_state_of_emergency_terrorism: "Объявлено чрезвычайное положение"
 FRA_state_of_emergency_terrorism_desc: "Закон 1955 года вступил в силу: префекты могут отдавать распоряжения о проведении обысков без участия магистрата, назначать лицам места жительства и запрещать собрания по собственной инициативе. Парламент продлевает его действие каждые три месяца, а Государственный совет подсчитывает количество апелляций."
 FRA_terror_threat_elevated: "Повышенная террористическая угроза"
 FRA_terror_threat_elevated_desc: "В распоряжении DGSI находится больше дел о вернувшихся и радикализованных лицах, чем сотрудников, которые могли бы за ними следить, и этот список постоянно растет. Крупные мероприятия отменяются по распоряжению префектов, а не обеспечиваются их безопасностью."
 FRA_terror_threat_critical: "Критическая террористическая угроза"
 FRA_terror_threat_critical_desc: "В службах одновременно ведется наблюдение за несколькими оперативными подразделениями, и теперь они не рассчитывают перехватить все из них. В полиции и жандармерии отменены отпуска, а министр внутренних дел перестал назначать даты."
 FRA_national_mourning: "Дни национального траура"
 FRA_national_mourning_desc: "На всех общественных зданиях флаги приспущены, в полдень соблюдается минута молчания, а в Доме инвалидов зачитываются имена погибших. На этой неделе никакие дела не ведутся."
 FRA_damaged_infrastructure: "Повреждена критически важная инфраструктура"
 FRA_damaged_infrastructure_desc: "В результате терактов был поврежден транспортный узел метро и участок высоковольтной сети, а ремонтные работы отстают от графика аварийных работ. Операторы работают по распоряжению префектуры, а расходы покрываются государством."
 FRA_tourism_crisis: "Туристический кризис"
 FRA_tourism_crisis_desc: "Заполняемость отелей в регионе Иль-де-Франс резко упала, а туроператоры, организующие дальние поездки, отменили рейсы на весь сезон. Туризм является нашим крупнейшим источником валютных поступлений, и его восстановление будет зависеть скорее от новостей из-за рубежа, чем от нашей политики безопасности."
 france_md.970.t: "Бомба в пригородной железной дороге RER в час пик."
 france_md.970.d: "В ходе утреннего часа пик на пересадочной станции в туннельном участке, куда спасатели могут добраться только пешком, взорвалась взрывная установка, оставленная в вагоне. Десятки погибших, число раненых продолжает расти. Движение по всей сети остановлено, и вводится в действие план действий в случае массовых жертв."
 france_md.970.a: "Реквизировать больницы и службы экстренной помощи."
 france_md.970.b: "Объявить день национального траура"
 france_md.970.c: "Возобновить работу сети и отказаться от чрезвычайных полномочий."
 france_md.971.t: "Вооруженные люди напали на комиссариат."
 france_md.971.d: "Нападавшие с автоматами и транспортным средством в руках сорок минут вели бой с магазином в северном пригороде, прежде чем к ним подошли сотрудники спецподразделения. Полицейские погибли, здание непригодно для использования. Тот, кто это спланировал, знал время смены дежурства."
 france_md.971.a: "Опечатайте отдел и выследите сообщников."
 france_md.971.b: "Укрепить все комиссариаты в стране."
 france_md.972.t: "Отряды смертников проводят атаки по всей столице."
 france_md.972.d: "Три группы с автоматами и поясами со взрывчаткой за один час провели операцию по наступлению на стадион, ряд баров и концертный зал. Более ста человек погибли, а хирурги Иль-де-Франс проводят операции в режиме военного времени. Ничего подобного по масштабу не происходило на нашей территории со времен войны."
 france_md.972.a: "Объявить чрезвычайное положение"
 france_md.972.b: "Прибегните к европейской оговорке о взаимной обороне."
 france_md.972.c: "Нанести удар по базам организации за рубежом."
 france_md.973.t: "Нападение на Лувр"
 france_md.973.d: "На контрольно-пропускном пункте «Карусель» был остановлен мужчина с холодным оружием, но следовавшая за ним группа проникла через вход в Тюильри с взрывчаткой и сейчас находится в крыле Денон. Посетители забаррикадированы в галереях над ними. Сотрудники реставрационной службы просят дать им время, чтобы переместить то, что еще можно переместить."
 france_md.973.a: "Сначала выпроводите посетителей."
 france_md.973.b: "Обеспечьте сохранность коллекции до начала штурма."
 france_md.974.t: "Нападавшие внутри военной базы"
 france_md.974.d: "Группа пересекла периметр авиабазы ​​в том месте, где ремонт ограждения был приостановлен, и достигла зоны дежурства до того, как их остановили охранники. Они знали график дежурств и коды от ворот. Военная контрразведка сейчас расследует действия наших собственных сотрудников."
 france_md.974.a: "Проверяйте безопасность на каждом этапе установки."
 france_md.974.b: "Пусть контрразведка проверит ряды."
 france_md.975.t: "Заложники на Эйфелевой башне"
 france_md.975.d: "Вооруженные люди поднялись на лифтах вместе с первыми туристами дня и захватили верхнюю платформу, держа в заложниках несколько сотен человек. Механизмы лифтов заминированы, и GIGN не может приблизиться к Марсовому полю, не будучи замеченным на расстоянии километра. Они требуют освобождения заключенных и трансляции событий."
 france_md.975.a: "Отправьте GIGN на вышку."
 france_md.975.b: "Поговорите с ними и выиграйте время."
 france_md.975.c: "Отклоняйте все требования"
 france_md.976.t: "Штурм атомной электростанции"
 france_md.976.d: "Нападавшие захватили административный блок и здание для хранения отработанного топлива на станции в долине Луары. Они заявляют, что откроют бассейн с топливом, как только к объекту приблизятся. Институт радиации смоделировал шлейф дымовых газов, и он пересекает три границы."
 france_md.976.a: "Охладите реактор и отправьте туда GIGN."
 france_md.976.b: "Штурмуем объект всем, что у нас есть."
 france_md.980.t: "Скоординированные атаки опустошили Париж."
 france_md.980.d: "Одновременные нападения на подход к стадиону, концертный зал и ряд баров в Париже унесли жизни более ста человек. Франция закрыла свои границы и вывела армию на улицы. Министерства внутренних дел по всей Европе пересматривают свои собственные документы по возвращению беженцев."
 france_md.980.a: "Мы поддерживаем Францию."
 france_md.981.t: "Вооруженные люди штурмуют Лувр."
 france_md.981.d: "Внутри крыла Денон в Лувре находятся вооруженные нападавшие, а посетители забаррикадированы в окружающих их галереях. В музее хранятся произведения, которые не могут быть восстановлены ни страховкой, ни реставрацией. Каждая крупная коллекция на континенте пересматривает свои планы."
 france_md.981.a: "Предложить помощь Франции"
 france_md.982.t: "Заложники удерживаются на Эйфелевой башне"
 france_md.982.d: "Несколько сотен посетителей удерживаются на верхней платформе Эйфелевой башни вооруженными людьми, которые заблокировали работу лифтового оборудования. Французский спецназ дежурит на Марсовом поле перед камерами всего мира. Министерства иностранных дел вычеркивают своих граждан из списков посетителей."
 france_md.982.a: "Предложите Франции любую помощь, которую она готова принять."
 france_md.983.t: "Французская атомная электростанция подверглась нападению."
 france_md.983.d: "По всей Европе объявлена ​​чрезвычайная ситуация в связи с террористической атакой на французский ядерный объект. Хотя власти настаивают на отсутствии непосредственной радиационной угрозы, потенциальная катастрофа масштабов Чернобыля вызвала шок на всем континенте. Правительства готовят планы действий в чрезвычайных ситуациях, а населению, проживающему вблизи объекта, приказано оставаться в своих убежищах."
 france_md.983.a: "Подготовьте планы реагирования на чрезвычайные ситуации."
 france_md.985.t: "Террористический заговор сорван."
 france_md.985.d: "Французские спецслужбы успешно сорвали крупный террористический заговор. Многомесячное наблюдение, операции под прикрытием и международное сотрудничество привели к скоординированным рейдам, в результате которых заговорщики были задержаны до того, как смогли совершить нападение. Подробности остаются засекреченными, но источники указывают, что запланированное нападение могло иметь катастрофические последствия. Этот успех подтверждает целесообразность значительных инвестиций в контртеррористические возможности."
 france_md.985.a: "Выражаем благодарность разведывательным службам."
 france_md.985.b: "Поддерживайте повышенный уровень безопасности."
