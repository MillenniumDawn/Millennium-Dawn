 print_money_button_tooltip: "§Y紙幣の増刷§!\n§g政府は苦境に陥り、早急に資金を調達する必要がある。税金や国債発行に頼るのではなく、紙幣を発行しての対応が可能だ。§!\n\nこの命令を実行すると、政府歳入の2週間分に相当する紙幣が発行され、国庫に追加される。しかし、紙幣の発行はインフレを招く措置であり、当四半期のインフレ率を上昇させる。また、四半期ごとのインフレ更新前に繰り返し増刷を行うと、インフレ効果はさらに強まる。\n\n§Y紙幣発行数:§! [?printing_money_var|0Y]\n\n§Y前提条件:§!\n[!print_money_button_click_enabled]\n§Y効果:§!\n[!print_money_button_click]"
