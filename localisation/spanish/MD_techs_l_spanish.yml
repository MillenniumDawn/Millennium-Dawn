 encryption_1: "Cifrado I"
 encryption_1_desc: "Las técnicas de cifrado en computadoras modernas y los cortafuegos (firewalls) más avanzados pueden ayudarnos a estar verdaderamente protegidos en la red."
 encryption_2: "Cifrado II"
 encryption_2_desc: "Las técnicas de cifrado en computadoras modernas y los cortafuegos (firewalls) más avanzados pueden ayudarnos a estar verdaderamente protegidos en la red."
