 RULE_DISABLE_EU: "EU 제거"
 RULE_YES_DISABLE_EU_DESC: "모든 나라는 EU에서 탈퇴할 것입니다."
 RULE_NO_DISABLE_EU_DESC: "EU는 그대로 존재할 것입니다."
 RULE_DISABLE_ANTI_BULLY: "반강자 시스템 (전쟁피로도)을 끕니다."
 RULE_YES_ANTI_BULLY_DESC: "Disables the Public War Weariness system allowing you to be a warmonger with no penalties."
 RULE_NO_ANTI_BULLY_DESC: "반강자 시스템 (전쟁피로도)이 켜질 것입니다."
 RULE_SALAFIST_BRANCH: "살라피스트 중점 활성화"
 RULE_YES_SALAFIST_BRANCH_DESC: "시작 종교와 상관 없이 모든 국가에 일반 중점계통도에서 살라피스트 중점을 활성화 합니다."
 RULE_NO_SALAFIST_BRANCH_DESC: "이슬람의 모든 변형을 따르는 국가들에 대해 기본 중점에서 살라피즘 분파를 활성화합니다."
 RULE_ENABLE_DIVISION_LIMITER: "AI 사단 제한 활성화"
 RULE_NO_ENABLE_DIVISION_LIMITER_DESC: "AI사단 제한 비활성화\n\n기본적으로 AI가 생성할 수 있는 유닛 수에 제한이 없습니다. 성능상의 이유로 부대를 숫자를 제한하고자 한다면 활성화 해주세요!"
 RULE_YES_ENABLE_DIVISION_LIMITER_DESC: "AI 분대 제한 기능 활성화\n\n이 기능을 활성화하면 AI의 유닛 ​​생산 빈도가 줄어들어 플레이어가 더욱 원활하게 게임을 즐길 수 있습니다!"
 RULE_OPTION_POTATO_EDITION: "저사양 컴퓨터 전용 에디션"
 RULE_POTATO_EDITION_DIVISION_LIMITER_DESC: "저사양 컴퓨터를 위한 AI 사단 숫자를 제한합니다\n\n더 많은 숫자 제한으로 퍼포먼스를 향상 할 수 있습니다.\n"
 RULE_ALLOW_CHEAT_DECISIONS: "치트 디시전 사용여부"
 RULE_YES_ALLOW_CHEAT_DECISIONS_DESC: "치트 디시전 활성화"
 RULE_NO_ALLOW_CHEAT_DECISIONS_DESC: "치트 디시전 비활성"
 RULE_ALLOW_TOGGLING_CHEAT_DECISIONS: "§Y(멀티플레이어)§! (선택적) 치트 디시전을 전세계적으로 선택할 수 있게 해줍니다."
 RULE_YES_ALLOW_TOGGLING_CHEAT_DECISIONS_DESC: "전세계적으로 적용되는 치트 디시전이 가능해집니다.\n§Y알림:§! 어느 나라던 간에 사기적인 결정을 활성화할 수 있고 그 효과는 §Y전세계§!적으로 영향을 미칩니다. 어떤 나라가 선택을 하였는지 이벤트 창이 나타나서 알려줄 것입니다.\n§Y멀티플레이에서도 이를 활성화할 수 있습니다.!§!\n\n§Y알림:§! 치트 디시전을 사용하고 싶다면, \"치트 디시전 사용여부\"에도 체크를 해야합니다.!"
 RULE_NO_ALLOW_TOGGLING_CHEAT_DECISIONS_DESC: "§Y(Optional)§!\n\nGlobal Cheat Decisions Toggling Disabled\n§YNOTE:§! When enabled, any nation in the world can toggle the Cheat Decisions, and the effects are §Yglobal§!. An Event will pop-up telling which nation toggles it.\n§YYou should make sure you are allowed to use the decision in a Multiplayer game!§!\n\n§YNOTE:§! You also need to enable the \"Allow Cheat Decisions\" game rule if you want to use cheats!"
 RULE_ALLOW_RECALL_INTERVENTION_FORCES: "개입군의 귀환 허용"
 RULE_YES_ALLOW_INTERVENTION_FORCES: "§Y기본값§!. 국가에서 개입군을 철수시킬 수 있습니다."
 RULE_NO_ALLOW_INTERVENTION_FORCES: "해외 분쟁 지역에서 개입군을 철수시킬 수 없습니다."
 RULE_OPTION_RANDOM_DESC: "게임이 시작되면 이 나라의 짜여진 경로 중 하나가 무작위로 선택됩니다. 어떤 경로가 선택되었는지는 플레이어에게 공개되지 않습니다."
 NIG_AI_BEHAVIOR: "@NIG 나이지리아"
 RULE_OPTION_FRA_HISTORICAL: "역사적"
 RULE_OPTION_FRA_HISTORICAL_DESC: "The Fifth Republic holds its course as the presidency passes from Chirac to Sarkozy, then Hollande and Macron, with the §8Republicans§! and the centre trading office between them. France anchors European integration and keeps its hand on the Françafrique sphere."
 BRM_AI_BEHAVIOR: "@BRM Myanmar"
 SYR_AI_BEHAVIOR: "@SYR Syria"
 RULE_OPTION_SYR_HISTORICAL: "역사적"
 RULE_OPTION_SYR_HISTORICAL_DESC: "Hafez al-Assad is succeeded by his son Bashar, who keeps the §8Syrian Arab Socialist Ba'ath Party§! in power, is forced out of Lebanon after the Hariri assassination and answers the Arab Spring with civil war rather than concessions. The civil war is certain on this path and the Islamic State is very likely to rise out of it, while the regime survives on Russian and Iranian backing."
 RULE_OPTION_SYR_IRON_LADY: "시리아의 철의 여인"
 RULE_OPTION_SYR_IRON_LADY_DESC: "Bushra al-Assad takes the presidency ahead of her brothers and steers Syria between the great powers with a Gulf and Western tilt, pulling the army out of Lebanon and modernising healthcare and industry. The Levant gets a cautious, development-minded Syria that its neighbours can trade with rather than fear."
 RULE_OPTION_SYR_SYRIAN_SAVAGE: "시리아의 야만인"
 RULE_OPTION_SYR_SYRIAN_SAVAGE_DESC: "Maher al-Assad hands the state to the §8Syrian Arab Armed Forces§!, annexes Lebanon, and rearms for a Greater Syria that turns on Jordan, Iraq, the Gulf and Israel. The Levant faces an aggressive power bent on territorial conquest where it had a cautious actor before."
 RULE_OPTION_SYR_NEW_ASSAD: "새로운 알아사드"
 RULE_OPTION_SYR_NEW_ASSAD_DESC: "The Damascus Spring is allowed to run and Rifaat al-Assad returns from exile at its head with foreign backing, his §8Arab Democratic Party§! binding Syria to Saudi Arabia and the Gulf. The Gulf monarchies gain an Arab ally in Damascus and Russia and Iran lose their foothold on the Mediterranean."
 BHR_AI_BEHAVIOR: "@BHR 바레인"
