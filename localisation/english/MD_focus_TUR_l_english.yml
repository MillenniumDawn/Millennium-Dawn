 TUR_develop_domestic_category: "Develop Domestic Weapon Systems"
 TUR_develop_domestic_category_desc: "\n\n\n\n\n\n£TUR_desctext_develop_domestic_main\n\n\n\n\n\n\n\n\nWe can invest time and resources into researching and developing our own modern weapon systems. Drawing upon Turkey's engineering expertise and industrial traditions, we can create equipment tailored to the needs of our armed forces. Building a domestic defense industry will strengthen our military capabilities and reduce our reliance on foreign suppliers."
 

 ####################################
 # M60 UPGRADE TENDER
 ####################################
 tur_m60t_upgrade_tender: "Hold a tender for §YM60 Modernization§!"
 tur_m60t_upgrade_tender_desc: "\n\n\n\n\n\n£TUR_m60t_upgrade_tender_for_tooltip\n\n\n\n\n\n\n\n\n§WTender for the modernization of our existing §YM60 Patton§! tanks.\n§W--------------§!\n[ISR.GetFlag]§YM60T§!: upgrade package with a §Gnew 120-mm smoothbore gun§! and §Gimproved armor§!, but §Rstill an old hull§!.\n[USA.GetFlag]§YM60-2000§!: far larger rebuild with §GAbrams-derived technology§! and §Gmuch greater combat value§!, but §Rmuch more expensive§!.\n[UKR.GetFlag]§YM60-84§!: hybrid of the §YM60A3§! hull and a §YT-84 Oplot§! turret with §Gstrong firepower§! and §Gmodern protection§!, but §Rtechnically risky§!.\n§W--------------§!\n§RWarning:§! This Decision is §Rrequired§! to unlock the §YTank 2000 Tender§! and §YAltay Development§!.\nIf you §Rskip§! it, they will §Rnot§! be available to you.§!"
 tur_m60t_upgrade_tender.1.name: "The M60 Modernization Tender"
 tur_m60t_upgrade_tender.1.desc: "§WThe proposals for the §YM60 Modernization Tender§! have been reviewed. Our §YPatton§! fleet can no longer face modern threats as it is, and three partners have offered to bring it up to date.\n\n[ISR.GetFlag]§YM60T§!: §Gproven§! and §Gaffordable§!, with a §Gnew 120-mm smoothbore gun§! and §Gimproved armor§!, but the result remains a §Rmodernized M60§! and makes us §Rdependent on Israeli industry§!.\n\n[USA.GetFlag]§YM60-2000§!: a far more ambitious rebuild with §GAbrams-derived technology§! and §Gmuch greater combat value§!, but §Rmuch more expensive§! and §Rslower§! to bring into service.\n\n[UKR.GetFlag]§YM60-84§!: the §YM60A3§! hull with a §YT-84 Oplot§! turret, §Gstrong firepower§! and §Gmodern protection§! at a §Gmoderate price§!, but an §Runtested hybrid§!.\n\nSpeed and cost, capability, or a bold hybrid. The choice is ours.§!"
 tur_m60t_upgrade_tender.1.a: "[ISR.GetFlag]§YM60T§! §G(Fast and affordable)§! §R(Old hull)§!"
 tur_m60t_upgrade_tender.1.b: "[USA.GetFlag]§YM60-2000§! §G(Capable, long-term)§! §R(Very expensive)§!"
 tur_m60t_upgrade_tender.1.c: "[UKR.GetFlag]§YM60-84§! §G(Oplot turret)§! §R(Untested)§!"
 tur_m60t_upgrade_tender.10.name: "§YM60T Sabra§! Upgrades Complete"
 tur_m60t_upgrade_tender.10.desc: "The first batches of our modernized §YM60T Sabra§! tanks have rolled out of the facilities. Upgraded by Israel Military Industries, they boast a 120mm smoothbore gun, explosive reactive armor, and a modernized fire control system. They are ready to be deployed to our armored brigades."
 tur_m60t_upgrade_tender.10.a: "Excellent."
 tur_m60t_upgrade_tender.11.name: "§YM60-2000§! Upgrades Complete"
 tur_m60t_upgrade_tender.11.desc: "The §YM60-2000§! modernization program with General Dynamics is complete. By successfully mating the reliable M60 hull with the advanced turret of the M1A1 Abrams, we have acquired a highly capable hybrid main battle tank for a fraction of the cost of a brand new platform."
 tur_m60t_upgrade_tender.11.a: "Impressive engineering."
 tur_m60t_upgrade_tender.12.name: "§YM60-84§! Upgrades Complete"
 tur_m60t_upgrade_tender.12.desc: "The Ukrainian-led modernization of our M60 fleet is finished. The §YM60-84§! program has integrated the T-84 Yatagan's turret, complete with a NATO-standard 120mm gun and autoloader, onto our existing Patton chassis. These cost-effective tanks will serve us well."
 tur_m60t_upgrade_tender.12.a: "A unique and deadly combination."

 ####################################
 # TANK 2000 TENDER
 ####################################
 tur_tank_2000_tender: "The §YTank 2000§! Tender"
 tur_tank_2000_tender_name: "The §YTank 2000§! Tender"
 tur_tank_2000_tender_desc: "\n\n\n\n\n\n£TUR_desctext_tank_2000_tender_for_tooltip\n\n\n\n\n\n\n\n\nThe £TUR §YTurkish Land Forces§! have initiated the '§YTank 2000§!' project to acquire a new, next-generation main battle tank. We have invited several major international arms manufacturers to demonstrate their vehicles in rigorous trials across §YAnatolia§!.\n\nThe top candidates include:\n- £GER §YLeopard 2A6§!: A next-generation main battle tank featuring §Gstate-of-the-art composite armor§! and a §Ghighly accurate fire control system§!.\n- £FRA §YLeclerc§!: A next-generation main battle tank featuring §Gadvanced hydropneumatic suspension§! and an §Gautomated loading system§!.\n- £USA §YM1A2 Abrams§!: A next-generation main battle tank featuring §Gdepleted uranium armor§! and a §Gdevastating 120mm smoothbore gun§!.\n- £UKR §YT-84 Yatagan§!: A next-generation main battle tank featuring §GNATO-standard compatibility§! and §Gsuperior mobility§!.\n\nWhich of these formidable machines should form the backbone of our future armored divisions?\n\n§RWarning: Completing this tender is required for future armored procurement and modernization decisions!§!"
 tur_tank_2000_tender.1.name: "The §YTank 2000§! Tender"
 tur_tank_2000_tender.1.desc: "[GetDateText]: The £TUR §YTurkish Land Forces§! have concluded the trial phase for the '§YTank 2000§!' project. The top candidates include the £GER §YLeopard 2A6§!, the £FRA §YLeclerc§!, the £USA §YM1A2 Abrams§!, and the £UKR §YT-84 Yatagan§!.\n\nWe must now select a winning bid to form the backbone of our future armored divisions."
 tur_tank_2000_tender.1.a: "Request the §YLeopard 2A6§! from £GER §YGermany§!."
 tur_tank_2000_tender.1.b: "Purchase the §YLeclerc§! from £FRA §YFrance§!."
 tur_tank_2000_tender.1.c: "Purchase the §YM1A2 Abrams§! from the £USA §YUnited States§!."
 tur_tank_2000_tender.1.d: "Purchase the §YT-84 Yatagan§! from £UKR §YUkraine§!."
 tur_tank_2000_tender.1.e: "Accept the surplus §YLeopard 2A4s§! instead."
 tur_tank_2000_tender.2.name: "£GER §YGermany§! Refuses §YLeopard 2A6§! Export"
 tur_tank_2000_tender.2.desc: "§RPolitical opposition§! within the £GER §YGerman§! government has blocked the export of the state-of-the-art §YLeopard 2A6§! to £TUR §YTurkey§!, citing political friction and human rights concerns. \n\nHowever, as a diplomatic compromise, §YBerlin§! is willing to offer us a massive batch of surplus §YLeopard 2A4s§! from the §MBundeswehr's§! own cold-war stockpiles at a §Gheavily discounted rate§!."
 tur_tank_2000_tender.2.a: "A pragmatic compromise. Accept the §YLeopard 2A4s§!."
 tur_tank_2000_tender.2.b: "§RUnacceptable.§! Let us review the other candidates."
 tur_tank_2000_tender.10.name: "§YLeclerc§! Tanks Delivered"
 tur_tank_2000_tender.10.desc: "The shipment of new §YLeclerc§! main battle tanks has finally arrived at our ports. Developed by £FRA §MGIAT Industries§!, this new equipment features §Gadvanced hydropneumatic suspension§! and an §Gautoloader module§!, and other smaller modifications.\n\nThey represent a §Gmassive leap§! in the combat capabilities of the £TUR §YTurkish Land Forces§!."
 tur_tank_2000_tender.10.a: "Vive la coopération."
 tur_tank_2000_tender.11.name: "§YM1A2 Abrams§! Delivered"
 tur_tank_2000_tender.11.desc: "The American §YM1A2 Abrams§! tanks have been delivered and are ready for deployment. Developed by £USA §MGeneral Dynamics§!, this new equipment features §Gheavy composite armor modules§! and a §Gdevastating 120mm smoothbore gun§!, and other smaller modifications.\n\nThey will ensure £TUR §YTurkish§! armored supremacy in the region for decades to come."
 tur_tank_2000_tender.11.a: "A formidable addition to our arsenal."
 tur_tank_2000_tender.12.name: "§YT-84 Yatagan§! Delivered"
 tur_tank_2000_tender.12.desc: "Our new §YT-84 Yatagan§! tanks have arrived from £UKR §YUkraine§!. Developed specifically for our requirements by £UKR §MKMDB§!, this new equipment features §GNATO-standard 120mm compatibility§! and an §Gadvanced autoloader module§!, and other smaller modifications.\n\nFurthermore, §MKMDB§! has provided us with the production licenses and technical documentation, allowing our domestic industry to manufacture and modify the tank ourselves."
 tur_tank_2000_tender.12.a: "A highly fruitful partnership."
 tur_tank_2000_tender.13.name: "§YLeopard 2A4s§! Delivered"
 tur_tank_2000_tender.13.desc: "The surplus §YLeopard 2A4§! tanks procured from £GER §YGermany§! have arrived and are being rapidly integrated into our armored brigades. Originally developed by £GER §MKrauss-Maffei§!, this modernized equipment features §Greliable German engineering§! and a §Ghard-hitting 120mm gun module§!, and other smaller modifications.\n\nWhile not the newest variant on the market, they provide a §Gmassive step up§! from our aging Pattons at an unbeatable price."
 tur_tank_2000_tender.13.a: "They will serve us well."

# ============================================================
 # EARLY ALTAY / YENI ALTAY
 # ============================================================
 tur_early_altay_development: "Develop the §YAltay P1§!"
 tur_early_altay_development_desc: "\n\n\n\n\n\n£TUR_desctext_altay_for_tooltip\n\n\n\n\n\n\n\n\n§WProgram to design the first prototype of the §YAltay§! main battle tank, Türkiye's first domestically designed modern tank.\n§W--------------§!\n[TUR.GetFlag]§YOtokar§!: §Gfaster§! (§Y240 days§!), but §Rmore expensive§!.\n[TUR.GetFlag]§YBMC§!: §Gcheaper§!, but §Rslower§! (§Y300 days§!) and §Rrisks cost overruns§!.\n§W--------------§!\nThe program has §Y4 stages§!: the §Ymanufacturer§! is chosen immediately, the §Ygun§! after §Y60 days§!, the §Yarmor§! after §Y120 days§! and the §Yengine§! after §Y180 days§!.§!"
 tur_early_altay_requires_tank_2000_tt: "Has completed the §YMain Battle Tank Tender§!"
 tur_early_altay_dev.1.name: "The Altay Program"
 tur_early_altay_dev.1.desc: "§WThe time has come to turn Türkiye's long-held ambition of a domestic main battle tank into a real design. Two industrial teams are ready to lead the work on the §YAltay P1§!.\n\n[TUR.GetFlag]§YOtokar§!: an experienced armored vehicle builder that can deliver the design in §Y240 days§!, but at a cost of §R100 million§!.\n\n[TUR.GetFlag]§YBMC§!: a cheaper offer of §G60 million§!, but the work will take §R300 days§! and the low budget may lead to problems later on.\n\nWhich manufacturer should lead the program?§!"
 tur_early_altay_dev.1.a: "[TUR.GetFlag]§YOtokar§! §G(240 days)§! §R(100 million)§!"
 tur_early_altay_dev.1.b: "[TUR.GetFlag]§YBMC§! §G(60 million)§! §R(300 days, overrun risk)§!"
 tur_early_altay_dev.2.name: "Altay Gun Selection"
 tur_early_altay_dev.2.desc: "§WThe engineers need to decide on the main gun for the Altay.\n\n§YL44§!: a §Gproven§!, §Gcheaper§! and §Glighter§! 120mm gun, but §Rless powerful§!.\n\n§YL55§!: a longer and §Gmore powerful§! gun with §Gbetter penetration§!, but §Rheavier§! and §Rmore demanding§! on the rest of the design.\n\nThe armor will be decided in §Y60 days§!.§!"
 tur_early_altay_dev.2.a: "§YL44 gun§! §G(Proven, lighter)§! §R(Less powerful)§!"
 tur_early_altay_dev.2.b: "§YL55 gun§! §G(More powerful)§! §R(Heavier)§!"
 tur_early_altay_dev.3.name: "Altay Armor Selection"
 tur_early_altay_dev.3.desc: "§WThe next decision is the protection of the Altay.\n\n§YHeavy armor§!: §Gnewer composite and spaced armor§! and a §Gbetter chance of surviving hits§!, but §Rheavier§! and §Rmore expensive§!.\n\n§YStandard armor§!: §Glighter§! and §Gcheaper§!, but §Rless protection§!.\n\nThe engine will be decided in §Y60 days§!.§!"
 tur_early_altay_dev.3.a: "§YHeavy armor§! §G(Better protection)§! §R(Heavier)§!"
 tur_early_altay_dev.3.b: "§YStandard armor§! §G(Lighter, cheaper)§! §R(Less protection)§!"
 tur_early_altay_dev.4.name: "Altay Engine Selection"
 tur_early_altay_dev.4.desc: "§WThe last major decision is the engine.\n\n§YGerman engine§!: a §Gproven§! and §Gmore powerful§! powerplant, but it makes us §Rdependent on German supply and export approval§!.\n\n§YDomestic engine§!: §Gno foreign dependence§! and a boost to our own industry, but §Rless powerful§! and §Rless proven§!.\n\nThe program will be finished in §Y60 days§! if led by Otokar, or §Y120 days§! if led by BMC.§!"
 tur_early_altay_dev.4.a: "§YGerman engine§! §G(Powerful, proven)§! §R(Foreign dependence)§!"
 tur_early_altay_dev.4.b: "§YDomestic engine§! §G(Independent)§! §R(Less powerful)§!"
 tur_early_altay_dev.5.name: "Cost Overruns on the Altay"
 tur_early_altay_dev.5.desc: "§WThe low budget agreed with §YBMC§! is starting to show. Subcontractors are demanding more money, parts are arriving late and the program has been criticized in the press for its lack of planning.\n\n§RPenalty:§! Additional costs and a loss of public confidence.\n\nThe design is expected in §Y60 days§!.§!"
 tur_early_altay_dev.5.a: "We should have budgeted more."
 tur_early_altay_dev.10.name: "The Altay P1 is Ready"
 tur_early_altay_dev.10.desc_otokar: "§WAfter eight months of work, the §YOtokar§! team has completed the first prototype of the §YAltay§!. The design is a result of a well-run program and has passed its acceptance trials.\n\n§GStrengths:§! A mature design, delivered on time, with strong support from the manufacturer.\n§RWeaknesses:§! The high cost of the program.\n\nThe design is now available, and production will begin shortly.§!"
 tur_early_altay_dev.10.desc_bmc: "§WAfter ten months of work, the §YBMC§! team has completed the first prototype of the §YAltay§!. Despite the delays and cost overruns, the design has passed its acceptance trials.\n\n§GStrengths:§! A cheap program that kept the budget under control for most of its life.\n§RWeaknesses:§! A long development time and a rough path to get here.\n\nThe design is now available, and production will begin shortly.§!"
 tur_early_altay_dev.10.a: "Türkiye's tank has arrived."

 tur_yeni_altay_development: "Develop the §YYeni Altay§!"
 tur_yeni_altay_development_desc: "\n\n\n\n\n\n£TUR_desctext_yeni_altay_for_tooltip\n\n\n\n\n\n\n\n\n§WProgram to design the §YYeni Altay§!, an improved version of Türkiye's domestic main battle tank, built on the lessons of the first Altay.\n§W--------------§!\n§GStrengths:§! Better protection, firepower and mobility than the first Altay.\n§RWeaknesses:§! A long and costly program.\n§W--------------§!\nThe design will take §Y180 days§! to complete, after which §Yproduction§! will begin.§!"
 tur_yeni_altay_requires_early_altay_tt: "Has completed the §YAltay P1§! development program"
 tur_yeni_altay_cost_20m: "Treasury: §Y20 million§!"
 tur_yeni_altay_dev.1.name: "§YYeni Altay§! Enters Serial Production"
 tur_yeni_altay_dev.1.desc: "§WThe development of the §YYeni Altay§! has been completed. After months of testing and refinement, Türkiye's improved main battle tank has passed its acceptance trials and has entered §Yserial production§!.\n\nBuilt on the lessons of the first Altay, the Yeni Altay offers a more capable and better protected platform, with a more powerful gun and a stronger engine, and it is the product of a domestic industry that can now design, test and build a modern tank on its own.\n\n§GStrengths:§! Improved firepower, protection and mobility, with a fully domestic design.\n§RWeaknesses:§! Expensive to build, and production will take time to ramp up.\n\nThe first tanks are expected to reach the armored brigades in the coming months.§!"
 tur_yeni_altay_dev.1.a: "A proud day for Turkish industry."


  # ============================================================
 # TRANSPORT VEHICLES TENDER
 # ============================================================
 tur_light_transport_tender: "Hold a tender for §YTransport Vehicles§!"
 tur_light_transport_tender_desc: "\n\n\n\n\n\n£TUR_desctext_light_transport_tender_for_tooltip\n\n\n\n\n\n\n\n\n§WTender to replace the aging §YTuzla Jeep§! with new utility and transport vehicles.\n§W--------------§!\n§RWarning:§! This Decision is §Rrequired§! to unlock the §YTactical Wheeled Armored Vehicles Tender Phase 1§! and the development of §Ynewer versions§! of these vehicles.\nIf you §Rskip§! it, they will §Rnot§! be available to you.§!"
 turkey_light_transport_tender.1.name: "Transport Vehicle Tender"
 turkey_light_transport_tender.1.desc: "§WThe §YTuzla Jeep§! has served our soldiers for decades, but it offers §Ralmost no protection§!, its load capacity is §Rmodest§! and spare parts are becoming §Rscarce§!. The General Staff wants it replaced, and the tender has produced several proposals.\n\n§LOtokar§! §YDefender MLR41§!: proven vehicle with §Gexcellent off-road performance§!. It can be bought as a batch right away, or built in series at a domestic plant if we §Rinvest in a longer program§!.\n\n§LOtokar§! §YNew Generation Hull§!: modular platform with §Gmore protection and flexibility§!, but it will take §Rmore time and money§! to field.\n\n§YCheaper Options§!: the §LOtokar§! §YISV§! or the §YUnimog U4000§!.\n\nThe decision we make now will shape our equipment for years to come.§!"
 turkey_light_transport_tender.1.a: "§LOtokar§! §YDefender MLR41§! large batch §G(Immediate delivery)§!"
 turkey_light_transport_tender.1.b: "Expand the §LOtokar Arifiye§! plant for the §YDefender MLR41§! §G(Series production)§! §R(240+ days)§!"
 turkey_light_transport_tender.1.c: "§LOtokar§! §YNew Generation Hull§! §G(Mine protection)§! §R(Takes longer)§!"
 turkey_light_transport_tender.1.d: "§YCheaper Options§! §G(Low cost)§!"
 turkey_light_transport_tender.2.name: "The New Generation Hull Configuration"
 turkey_light_transport_tender.2.desc: "§WThe §LOtokar§! §YNew Generation Hull§! is a modular platform that can become two distinct vehicles. Shared parts should make §Gproduction§! and §Gmaintenance§! simpler.\n\n§LOtokar§! §YKaya§!: utility and transport variant for §Gcargo§!, §Gsupply§! and §Gpersonnel§! duties.\n\n§LOtokar§! §YCobra§!: §YMRAP§! variant that protects its crew from §Gmines§! and §Gambushes§!.\n\nWhich configuration should we field?§!"
 turkey_light_transport_tender.2.a: "§LOtokar§! §YKaya§! transport §G(Cargo and troops)§!"
 turkey_light_transport_tender.2.b: "§LOtokar§! §YCobra§! MRAP §G(Mine protection)§! §R(Costs more)§!"
 turkey_light_transport_tender.3.name: "Unimog and ISV Developments"
 turkey_light_transport_tender.3.desc: "§WTwo very different proposals are on the table, and only one can be selected.\n\n§LOtokar§! §YISV§!: purpose-built armoured vehicle with §Gbetter crew protection§! and §Gweapon mounts§!, but §Rcosts more§! to buy and operate.\n\n§YUnimog U4000§!: commercial-grade truck with a §Grugged chassis§! and §Geasy maintenance§!, but §Rlittle protection§!.\n\nThe choice is between §Ysurvivability§! and §Yaffordability§!.§!"
 turkey_light_transport_tender.3.a: "§LOtokar§! §YISV§! §G(Protection)§! §R(Costs more)§!"
 turkey_light_transport_tender.3.b: "§YUnimog U4000§! §G(Cheap and rugged)§! §R(Little protection)§!"
 turkey_light_transport_tender.4.name: "The Otokar Arifiye Plant Expansion Is Complete"
 turkey_light_transport_tender.4.desc: "§WThe new workshops of the §LOtokar Arifiye§! plant are ready. The plant can now build the §YDefender§!, §YAkrep§! and §YCobra§! vehicles in series for our Armed Forces.§!"
 turkey_light_transport_tender.4.a: "§GStart the production line§!"



 turkey_light_transport_tender.10.name: "Defender MLR41 Enters Service"
 turkey_light_transport_tender.10.desc: "The first Defender MLR41s have rolled out of Otokar's workshops, and the army's logisticians could hardly hide their relief. For years, Turkish units have patched together a motley fleet of aging jeeps and requisitioned trucks. The Defender is a different proposition: a rugged, no-nonsense workhorse built on a ladder frame, with a simple engine that a conscript mechanic can repair with a basic toolkit and a bit of patience.\n\nOtokar's engineers like to say that its greatest feature is what it lacks. There is no complex electronics package to fail and no exotic parts to wait for.\n\n§GStrengths:§! Cheap to build, easy to maintain, reliable in rough terrain.\n§RWeaknesses:§! Thin protection, modest payload, and no match for anything with a real gun.\n\nA hundred vehicles are already headed to the depots, and the production lines are only just warming up."
 turkey_light_transport_tender.10.a: "A solid start."

 turkey_light_transport_tender.11.name: "Kaya YTA Unveiled"
 turkey_light_transport_tender.11.desc: "On a muddy test track outside Sakarya, Otokar's Kaya YTA has just climbed a slope that left every older vehicle in the trials spinning its wheels. Generals who came expecting another disappointing prototype watched in silence as it crossed a flooded ditch and kept going.\n\nThe Kaya was designed around one idea: get troops and supplies to places where roads simply do not exist. Its reworked suspension and drivetrain give it excellent cross-country mobility, and its crews swear it can follow a mountain goat on the eastern slopes.\n\n§GStrengths:§! Outstanding off-road mobility, quick to deploy, well suited to rough terrain.\n§RWeaknesses:§! Light armor, a small payload for its size, and a drivetrain that demands more maintenance than the army is used to.\n\nThe first units are being handed over, and Otokar's lines are being tooled for full production."
 turkey_light_transport_tender.11.a: "Mud is no longer an obstacle."

 turkey_light_transport_tender.12.name: "Cobra RCWS Enters Production"
 turkey_light_transport_tender.12.desc: "When the first Cobra RCWS rolled onto the parade ground, its remote-controlled weapon station swiveled smoothly toward the targets while the crew sat safely behind armor. Several visiting officers asked, a little too eagerly, how soon they could get their own.\n\nThe Cobra grew out of Otokar's long experience with armored utility vehicles, and the RCWS variant is the most capable yet. The gunner no longer has to expose himself in an open hatch, which has changed how commanders think about patrols and convoy escorts.\n\n§GStrengths:§! Real armor protection, integrated firepower, a versatile platform that suits many roles.\n§RWeaknesses:§! Expensive, heavy and thirsty for fuel, with a complex weapon station that needs trained crews to keep it working.\n\nIt is the most ambitious vehicle of the tender, and Otokar has already reserved factory space for it."
 turkey_light_transport_tender.12.a: "Worth every lira."

 turkey_light_transport_tender.13.name: "ISV Infantry Support Vehicle Delivered"
 turkey_light_transport_tender.13.desc: "The ISV was never meant to win a beauty contest. It was built to answer a simple frontline complaint: infantry squads move fast, but their support weapons do not. The ISV carries the heavy weapons, ammunition and a small crew right alongside the riflemen, so the platoon no longer has to choose between speed and firepower.\n\nVeterans of the exercises praise how quickly a section can set up its machine guns directly from the vehicle. The engineers who designed it also admit its compromises: it was designed to support the infantry, not to survive a direct fight.\n\n§GStrengths:§! Strong weapons and infantry support, practical load-out, good value for the firepower it brings.\n§RWeaknesses:§! Limited armor, middling mobility, and exposed crews when the shooting starts.\n\nThe first batch is already being distributed to the infantry divisions."
 turkey_light_transport_tender.13.a: "Fire support where it is needed."

 turkey_light_transport_tender.14.name: "Unimog U4000 Arrives"
 turkey_light_transport_tender.14.desc: "The first Unimog U4000 trucks have arrived from the Mercedes-Benz line, and the drivers' stories started before the engines had cooled. The Unimog's portal axles lift it high above obstacles, and it can wade through water that would drown most trucks. A crew stuck on a farm track near Erzurum reportedly drove out through a snowdrift without even engaging the low gear.\n\nThe army chose the Unimog over flashier options because it is a proven design with a worldwide spare parts supply and a reputation that precedes it. It was not built for speed or protection, but it gets there.\n\n§GStrengths:§! Legendary off-road ability, extremely versatile, reliable, and cheap to keep running.\n§RWeaknesses:§! Slow on roads, unarmored, and less glamorous than the domestic options.\n\nThe first trucks are heading to the depots, and the generals have stopped complaining about supply routes."
 turkey_light_transport_tender.14.a: "Old reliable."

# ============================================================
 # TACTICAL WHEELED ARMORED VEHICLES TENDER PHASE 1 (LIGHT TRANSPORT + MRAP)
 # ============================================================
 tur_mrap_tender: "§YTactical Wheeled Armored Vehicles§! Phase 1"
 tur_mrap_tender_desc: "\n\n\n\n\n\n£TUR_mrap_for_tooltip\n\n\n\n\n\n\n\n\n§WTender to replace our aging, unprotected vehicles with modern armored designs.\n§W--------------§!\n§YPrograms:§! §YMRAP§! and §YUtility§!.\n§GBoth programs can be decided§!, and a choice in §Rboth§! is needed to finish the tender.\n§W--------------§!\n§RWarning:§! This Decision is §Rrequired§! to unlock the §YTactical Wheeled Armored Vehicles Tender Phase 2§! and the development of §Ynewer versions§! of these vehicles.\nIf you §Rskip§! it, they will §Rnot§! be available to you.§!"
 tur_mrap_requires_light_transport: "Complete the §YTransport Vehicles Tender§!"
 tur_mrap_tender.1.name: "The Tactical Wheeled Armored Vehicles Tender Phase 1"
 tur_mrap_tender.1.desc: "§WThe proposals for the §YTactical Wheeled Armored Vehicles Tender Phase 1§! have been reviewed. Our troops still depend on aging, unprotected vehicles, and the threat of mines and ambushes grows on every front.\n\nTwo programs are on the table: a §YLight Transport§! vehicle to carry troops and supplies, and an §YMRAP§! vehicle to protect them against mines. §GBoth can be decided§!, one after the other.\n\nWhich program should we settle first?§!"
 tur_mrap_tender.1.a: "§YLight Transport§! program"
 tur_mrap_tender.1.b: "§YMRAP§! program"
 tur_mrap_tender.2.name: "The Light Transport Tender"
 tur_mrap_tender.2.desc: "§WTwo domestic designs are competing for the §YLight Transport§! contract.\n\n§LBMC§! §Y235§!: §Gcheap§! and §Gfast§!, but §Rno weapon stations§!.\n\n§LBMC§! §YEfe§!: §Gfast§! and §Gweapon stations§!, but §Rweak squad support§!.\n\nCost, or weapon stations?§!"
 tur_mrap_tender.2.a: "§LBMC§! §Y235§! §G(Cheap, fast)§! §R(No weapon stations)§!"
 tur_mrap_tender.2.b: "§LBMC§! §YEfe§! §G(Fast, weapon stations)§! §R(Weak squad support)§!"
 tur_mrap_tender.3.name: "The MRAP Tender"
 tur_mrap_tender.3.desc: "§WThree domestic designs are competing for the §YMRAP§! contract.\n\n§LBMC§! §YKirpi 4x4§!: §Gfast§! and §Ggood squad support§!, but §Rweak weapon stations§!.\n\n§LBMC§! §YKirpi 6x6§!: §Gexcellent squad support§! and §Ggood weapon stations§!, but §Rmore expensive§!.\n\n§YKaya 2§!: §Ggood squad support§! and §Ggood weapon stations§!, but §Rslow§!.\n\nSpeed, squad support or weapon stations?§!"
 tur_mrap_tender.3.a: "§LBMC§! §YKirpi 4x4§! §G(Fast, squad support)§! §R(Weak weapon stations)§!"
 tur_mrap_tender.3.b: "§LBMC§! §YKirpi 6x6§! §G(Squad support, weapon stations)§! §R(More expensive)§!"
 tur_mrap_tender.3.c: "§YKaya 2§! §G(Squad support, weapon stations)§! §R(Slow)§!"
 tur_mrap_tender.4.a: "Continue"

 tur_mrap_tender.10.name: "BMC 235 Enters Service"
 tur_mrap_tender.10.desc: "The first BMC 235s have rolled out of the Ankara works, and the quartermasters are already drawing up lists of units waiting for them. The 235 is a practical light transport built for the daily grind of army life: carrying troops, hauling supplies and keeping the rear areas moving. It makes no pretense of being a combat vehicle.\n\nCrews praise its simple controls and tough suspension, which handles the dirt roads of the interior without complaint. The engineers admit that the thin skin offers little against anything heavier than shrapnel.\n\n§GStrengths:§! Affordable, dependable, good mobility for its class, and easy to maintain.\n§RWeaknesses:§! Light protection and limited firepower.\n\nProduction is starting up, and BMC promises a steady flow to the depots."
 tur_mrap_tender.10.a: "A dependable workhorse."

 tur_mrap_tender.11.name: "BMC Efe Enters Service"
 tur_mrap_tender.11.desc: "BMC's Efe was always the more ambitious cousin of the 235, and the first examples to leave the factory show why. Beyond the improved mobility, it carries a mount for light weapons, so a patrol can answer an ambush instead of just surviving it. Test drivers describe it as sharper and more responsive on rough ground than anything else in its class.\n\nThe price of that capability is cost and complexity. Mechanics have already complained about the extra systems that need attention, and the treasury will feel it as well.\n\n§GStrengths:§! Better mobility, better weapons integration, and more flexible than the basic transport.\n§RWeaknesses:§! More expensive, more demanding to maintain, and still lightly protected.\n\nThe first batch is being handed to the infantry, and the production line is under way."
 tur_mrap_tender.11.a: "More capability for the price."

 tur_mrap_tender.12.name: "Kirpi 4x4 Enters Service"
 tur_mrap_tender.12.desc: "The Kirpi's V-shaped hull makes it look like nothing else on the road, and that shape matters. Built to deflect the blast of a roadside bomb away from the crew, it has already earned a reputation among the soldiers who ride in it. Several officers, after the first live trials, called it the vehicle that sends men home.\n\nThe 4x4 version keeps the design relatively compact, so it moves through narrow mountain roads and town streets that larger vehicles struggle with. A SARP remote weapon station gives the crew firepower without exposing the gunner.\n\n§GStrengths:§! Excellent mine and blast protection, compact, maneuverable, and a proven design.\n§RWeaknesses:§! Heavy for its size, high ground clearance affects stability, and it is far costlier than a standard transport.\n\nThe lines at Ankara are being set up for steady production."
 tur_mrap_tender.12.a: "Protection that saves lives."

 tur_mrap_tender.13.name: "Kirpi 6x6 Enters Service"
 tur_mrap_tender.13.desc: "When the Kirpi 6x6 appeared on the parade ground, onlookers noticed how much bigger it was than the 4x4. Its extra axle brings a larger hull, more space for troops and equipment, and room for a heavier weapon fit. With the SARP remote weapon station on top, it looks every bit like a vehicle designed for serious fighting.\n\nThe generals love it, and the finance ministry does not. It is the most expensive vehicle on the tender, and its size makes it difficult to use on the narrowest roads.\n\n§GStrengths:§! Top-tier protection, more carrying capacity, and heavier weapons.\n§RWeaknesses:§! Very expensive, large and heavy, and slower to produce.\n\nOnly a small number are expected from the first production run."
 tur_mrap_tender.13.a: "The heavy option arrives."

 tur_mrap_tender.14.name: "Kaya 2 Enters Service"
 tur_mrap_tender.14.desc: "Otokar's Kaya 2 is a heavily armored vehicle intended to bridge the gap between a light transport and a full MRAP. Its designers focused on weapons integration, and the cargo area has been adapted for infantry squads who need protection and firepower in one package.\n\nIn trials it handled uneven ground well, though not as nimbly as the lighter Kaya. Observers noted that it is a somewhat cheaper alternative to the Kirpi family, trading some protection for a lower cost and a lighter footprint.\n\n§GStrengths:§! Good firepower, solid protection, and reasonable cost for an MRAP-class vehicle.\n§RWeaknesses:§! Less mobile than the lighter Kaya and a less proven design than the Kirpi.\n\nOtokar has reserved factory space, and the first vehicles are being delivered."
 tur_mrap_tender.14.a: "A capable middle path."

 # ============================================================
 # TACTICAL WHEELED ARMORED VEHICLES TENDER PHASE 2 (MRAP + UTILITY)
 # ============================================================
 tur_mrap2_tender: "§YTactical Wheeled Armored Vehicles§! Phase 2"
 tur_mrap2_tender_desc: "\n\n\n\n\n\n£TUR_mrap2_for_tooltip\n\n\n\n\n\n\n\n\n§WTender for the next generation of protected vehicles for our Armed Forces.\n§W--------------§!\n§YPrograms:§! §YMRAP§! and §YUtility§!.\n§GBoth programs can be decided§!, and a choice in §Rboth§! is needed to finish the tender.\n§W--------------§!\n§RWarning:§! This Decision is §Rrequired§! to unlock the §YTactical Wheeled Armored Vehicles Tender Phase 3§! and the development of §Ynewer versions§! of these vehicles.\nIf you §Rskip§! it, they will §Rnot§! be available to you.§!"
 tur_mrap2_requires_mrap: "Complete the §YTactical Wheeled Armored Vehicles Tender Phase 1§!"
 tur_mrap2_tender.1.name: "The Tactical Wheeled Armored Vehicles Tender Phase 2"
 tur_mrap2_tender.1.desc: "§WThe proposals for the §YTactical Wheeled Armored Vehicles Tender Phase 2§! have been reviewed. The first phase gave our army a solid foundation, but the General Staff wants to build on it before the gap to modern armies widens again. Domestic industry has answered with a wider range of designs than ever before.\n\nTwo programs are on the table: an §YMRAP§! program for better protected combat vehicles, and a §YUtility§! program for transport and support duties. §GBoth can be decided§!, one after the other.\n\nWhich program should we settle first?§!"
 tur_mrap2_tender.1.a: "§YMRAP§! program"
 tur_mrap2_tender.1.b: "§YUtility§! program"
 tur_mrap2_tender.2: "The MRAP Tender"
 tur_mrap2_tender.2.name: "The MRAP Tender"
 tur_mrap2_tender.2.desc: "§WThe first new vehicles have proven themselves in service, but the battlefield keeps changing. Mines are getting stronger and ambushes more elaborate, and our crews need more than the last generation can offer. The General Staff has asked industry for the next step in MRAP design, and several proposals have reached our desks.\n\nFour domestic designs are competing for the §YMRAP§! contract.\n\n§LBMC§! §YKirpi 2§!: §Gexcellent squad support§! and §Gfast§!, but §Rmore expensive§!.\n\n§LOtokar§! §YCobra II MRAP§!: §Gbalanced§! and §Ggood weapon stations§!, but §Rmore expensive§!.\n\n§LNurol§! §YEjder Yalcin§!: §Gbalanced§! and §Gfast§!, but §Rmore expensive§!.\n\n§LFNSS§! §YPars 4x4§!: §Gvery fast§! and §Ggood squad support§!, but §Rweak weapon stations§!.\n\nSquad support, balance or speed?§!"
 tur_mrap2_tender.2.a: "§LBMC§! §YKirpi 2§! §G(Squad support, fast)§! §R(More expensive)§!"
 tur_mrap2_tender.2.b: "§LOtokar§! §YCobra II MRAP§! §G(Balanced, weapon stations)§! §R(More expensive)§!"
 tur_mrap2_tender.2.c: "§LNurol§! §YEjder Yalcin§! §G(Balanced, fast)§! §R(More expensive)§!"
 tur_mrap2_tender.2.d: "§LFNSS§! §YPars 4x4§! §G(Fast, squad support)§! §R(Weak weapon stations)§!"
 tur_mrap2_tender.3.name: "The Utility/Transport Vehicle Tender"
 tur_mrap2_tender.3.desc: "§WThe new vehicles have eased the burden on our transport units, but the army's needs have already outgrown them. Commanders are asking for utility vehicles that can carry more, go where the roads end, and take a weapon mount when the mission demands it. Three proposals now wait for our decision.\n\nThree domestic designs are competing for the §YUtility§! vehicle contract.\n\n§LNurol§! §YNMS-L§!: §Gfast§! and §Ggood squad support§!, but §Rweak weapon stations§!.\n\n§LOtokar§! §YCobra II Pickup§!: §Gbalanced§! and §Ggood squad support§!, but §Rno standout upgrade§!.\n\n§LOtokar§! §YUral§!: §Gcheap§! and §Gvery fast§!, but §Rweak squad support§!.\n\nSpeed, balance or cost?§!"
 tur_mrap2_tender.3.a: "§LNurol§! §YNMS-L§! §G(Fast, squad support)§! §R(Weak weapon stations)§!"
 tur_mrap2_tender.3.b: "§LOtokar§! §YCobra II Pickup§! §G(Balanced, squad support)§! §R(No standout upgrade)§!"
 tur_mrap2_tender.3.c: "§LOtokar§! §YUral§! §G(Cheap, fast)§! §R(Weak squad support)§!"
 tur_mrap2_tender.4.a: "Continue"

 tur_mrap2_tender.10.name: "Kirpi 2M Enters Service"
 tur_mrap2_tender.10.desc: "The Kirpi 2M is the next step in a family of vehicles that has already proven itself on the hardest roads in the country. It keeps the V-shaped hull that made its predecessor famous for shrugging off roadside bombs, but adds better armor, a stronger drivetrain and a more capable weapon station. Veterans who rode in the older model say the new one feels like a bunker on wheels.\n\nThe cost of this progress is plain. It is heavy, expensive and demands a trained maintenance crew, and every unit that goes to the front is one fewer cheap transport for the rear.\n\n§GStrengths:§! Top-tier mine and blast protection, strong weapons integration, and a well-tested design lineage.\n§RWeaknesses:§! High cost, considerable weight, and demanding upkeep.\n\nThe first production vehicles are ready, and BMC has promised a steady stream."
 tur_mrap2_tender.10.a: "The new standard."

 tur_mrap2_tender.11.name: "Cobra II MRAP Enters Service"
 tur_mrap2_tender.11.desc: "Otokar built the Cobra II to be a versatile armored platform, and the MRAP variant adds a blast-resistant hull to that foundation. Drivers like its balance: it is protected enough to survive an ambush, yet light enough to keep up with fast-moving columns and navigate winding roads that heavier vehicles avoid.\n\nIt is less imposing than the largest MRAPs, and staff officers have noted that it trades some armor for agility. The army considers that a fair bargain for a vehicle that can fill so many roles.\n\n§GStrengths:§! Versatile, agile, good protection, and strong export pedigree.\n§RWeaknesses:§! Not as heavily armored as the biggest MRAPs, and middling cargo space.\n\nOtokar's lines are already tooled for full production."
 tur_mrap2_tender.11.a: "Balanced and capable."

 tur_mrap2_tender.12.name: "Ejder Yalcin Enters Service"
 tur_mrap2_tender.12.desc: "The Ejder Yalcin is the kind of vehicle that makes an infantry commander breathe a little easier. It is a tactical armored vehicle designed to carry a squad safely into the thick of trouble, with a strongly protected cabin, a capable weapon mount and the kind of rugged build that handles rough country without fuss.\n\nIt has already built a following abroad, and domestic units are glad to see it in their own colors. It is also costly, and the army will have to decide how many it can afford.\n\n§GStrengths:§! Strong protection, good firepower, proven abroad, and well suited to squad-level operations.\n§RWeaknesses:§! Expensive to buy and operate, and a lot of vehicle for a limited number of troops.\n\nProduction is beginning, though the finance ministry is watching closely."
 tur_mrap2_tender.12.a: "A fine vehicle, a fine price."

 tur_mrap2_tender.13.name: "FNSS Pars 4x4 Enters Service"
 tur_mrap2_tender.13.desc: "FNSS built its reputation on armored vehicles that go where the army needs them, and the Pars 4x4 follows that tradition. It is a lighter, more economical option than the large MRAPs, intended for units that need protection without the expense and bulk of a heavyweight.\n\nIt is easy to operate, simple enough for quick training and cheaper than the competing designs. Its critics say it offers only moderate protection, and the army will have to accept that trade.\n\n§GStrengths:§! Cost-effective, practical, and easy to train crews for.\n§RWeaknesses:§! Moderate protection and limited weapon options.\n\nThe first vehicles are heading to the units that requested them."
 tur_mrap2_tender.13.a: "Good value for money."

 tur_mrap2_tender.14.name: "NMS-L Enters Service"
 tur_mrap2_tender.14.desc: "The NMS-L is a compact, versatile utility vehicle meant to fill the many gaps between cargo trucks and armored carriers. Light and quick, it can ferry small teams, carry equipment or act as a platform for light weapons, depending on what the unit needs that day.\n\nSoldiers who have tried it praise its handling and its flexibility. It does not offer much armor, so commanders are advised to treat it as a supporting vehicle and keep it away from direct fire.\n\n§GStrengths:§! Good mobility, flexible roles, and reasonable cost.\n§RWeaknesses:§! Thin armor and a limited payload.\n\nProduction has started, and the first batch is on its way."
 tur_mrap2_tender.14.a: "Flexible and quick."

 tur_mrap2_tender.15.name: "Cobra II Pickup Enters Service"
 tur_mrap2_tender.15.desc: "Otokar has adapted the Cobra II into a pickup configuration, giving the army an armored utility vehicle with an open cargo bed. It carries ammunition, supplies or a weapon team, and it does so with the toughness of a vehicle that began life as an armored carrier.\n\nIt is more protected than a regular truck and cheaper than a full MRAP. Its open bed leaves the cargo exposed, which limits its use in the most dangerous areas.\n\n§GStrengths:§! Sturdy, good mobility, flexible cargo space, and a proven chassis.\n§RWeaknesses:§! Exposed rear area and moderate protection.\n\nOtokar's lines are producing the first units."
 tur_mrap2_tender.15.a: "A useful hybrid."

 tur_mrap2_tender.16.name: "Otokar Ural Enters Service"
 tur_mrap2_tender.16.desc: "The Ural is Otokar's answer to a simple request: a vehicle that can drive across anything. Its suspension and drivetrain are built for punishing terrain, and in tests it crossed ground that stopped every other entry. Crews report that it handles like a vehicle half its size.\n\nIt is cheap, tough and quick to produce. It cannot withstand a serious attack, however, so it is best used behind the front line or as a scout.\n\n§GStrengths:§! Exceptional off-road mobility, low cost, and quick to produce.\n§RWeaknesses:§! Light protection and limited firepower.\n\nProduction is moving fast, and the army is already asking for more."
 tur_mrap2_tender.16.a: "Goes anywhere."

 # ============================================================
 # TACTICAL WHEELED ARMORED VEHICLES TENDER PHASE 3 (MRAP + UTILITY/TRANSPORT)
 # ============================================================
 tur_mrap3_tender: "§YTactical Wheeled Armored Vehicles§! Phase 3"
 tur_mrap3_tender_desc: "\n\n\n\n\n\n£TUR_mrap3_for_tooltip\n\n\n\n\n\n\n\n\n§WTender for wheeled armored vehicles to protect our troops and keep supply lines moving.\n§W--------------§!\n§YPrograms:§! §YMRAP§! and §YUtility§!.\n§GBoth programs can be decided§!, and a choice in §Rboth§! is needed to finish the tender.§!"
 tur_mrap3_requires_mrap: "Complete the §YTactical Wheeled Armored Vehicles Tender Phase 2§!"
 tur_mrap3_tender.1.name: "The Tactical Wheeled Armored Vehicles Tender Phase 3"
 tur_mrap3_tender.1.desc: "§WThe proposals for the §YTactical Wheeled Armored Vehicles Tender Phase 3§! have been reviewed. Our forces need vehicles that can protect troops and keep supply lines moving, and domestic industry has answered with several designs.\n\nTwo programs are on the table: an §YMRAP§! vehicle to protect our troops against mines and ambushes, and a §YUtility/Transport§! vehicle for tactical and support duties. §GBoth can be decided§!, one after the other.\n\nWhich program should we settle first?§!"
 tur_mrap3_tender.1.a: "§YMRAP§! program"
 tur_mrap3_tender.1.b: "§YUtility/Transport§! program"
 tur_mrap3_tender.2: "The MRAP Tender"
 tur_mrap3_tender.2.name: "The MRAP Tender"
 tur_mrap3_tender.2.desc: "§WThe time has come to choose the next mine-resistant vehicle for our army. Convoys on the roads and patrols in the mountains keep facing mines and ambushes, and the General Staff wants a domestic answer instead of another foreign purchase. Our manufacturers have answered the call, and the field trials are complete.\n\nFour domestic designs are competing for the §YMRAP§! contract.\n\n§LBMC§! §YVuran§!: §Gbalanced§! and §Ggood squad support§!, but §Rmore expensive§!.\n\n§LBMC§! §YAmazon§!: §Gvery fast§! and §Ggood squad support§!, but §Rweak weapon stations§!.\n\n§LKatmerciler§! §YHizir/Ateş§!: §Gbalanced§! and §Gaffordable§!, but §Rno standout upgrade§!.\n\n§LNMS§! §YYörük§!: §Gvery fast§! and §Ggood weapon stations§!, but §Rweak squad support§!.\n\nBalance, speed or price?§!"
 tur_mrap3_tender.2.a: "§LBMC§! §YVuran§! §G(Balanced, squad support)§! §R(More expensive)§!"
 tur_mrap3_tender.2.b: "§LBMC§! §YAmazon§! §G(Fast, squad support)§! §R(Weak weapon stations)§!"
 tur_mrap3_tender.2.c: "§LKatmerciler§! §YHizir/Ateş§! §G(Balanced, affordable)§! §R(No standout upgrade)§!"
 tur_mrap3_tender.2.d: "§LNMS§! §YYörük§! §G(Fast, weapon stations)§! §R(Weak squad support)§!"
 tur_mrap3_tender.3.name: "The Utility/Transport Vehicle Tender"
 tur_mrap3_tender.3.desc: "§WOur quartermasters have been warning for years that the army's utility trucks and tactical vehicles are worn out. Spare parts are scarce, breakdowns are frequent, and units in the field wait too long for supplies. A new generation of domestic vehicles could finally change that, and the manufacturers have presented their proposals.\n\nFour domestic designs are competing for the §YUtility/Transport§! vehicle contract.\n\n§LOtokar§! §YAkrep 2§!: §Gbalanced§! and §Ggood weapon stations§!, but §Rno standout upgrade§!.\n\n§LBMC§! §YTulga§!: §Gcheap§! and §Gvery fast§!, but §Rweak weapon stations§!.\n\n§LBMC§! §YTuran§!: §Gbalanced§! and §Gaffordable§!, but §Rno standout upgrade§!.\n\n§LNurol§! §YYetisen§!: §Gfast§! and §Ggood weapon stations§!, but §Rweak squad support§!.\n\nBalance, price or speed?§!"
 tur_mrap3_tender.3.a: "§LOtokar§! §YAkrep 2§! §G(Balanced, weapon stations)§! §R(No standout upgrade)§!"
 tur_mrap3_tender.3.b: "§LBMC§! §YTuran§! §G(Balanced, affordable)§! §R(No standout upgrade)§!"
 tur_mrap3_tender.3.c: "§LBMC§! §YTulga§! §G(Cheap, fast)§! §R(Weak weapon stations)§!"
 tur_mrap3_tender.3.d: "§LNurol§! §YYetisen§! §G(Fast, weapon stations)§! §R(Weak squad support)§!"
 tur_mrap3_requires_mrap2: "Complete the §YTactical Wheeled Armored Vehicles Tender Phase 2§!"

 tur_mrap3_tender.10.name: "BMC Vuran Enters Service"
 tur_mrap3_tender.10.desc: "The Vuran is BMC's heavyweight answer to the threats that modern convoys face. Its high, protected hull is built to shrug off mines and roadside bombs, and its crew compartment is designed so that a soldier can step out of a wrecked vehicle and walk away. Drivers who tested it say it inspires confidence the moment the door closes.\n\nThat confidence comes at a price. It is big, heavy and costly, and it needs a well-trained maintenance crew to keep it running in the field.\n\n§GStrengths:§! Excellent mine and blast protection, strong weapons integration, and a sturdy, modern design.\n§RWeaknesses:§! High cost, considerable weight, and demanding upkeep.\n\nBMC's first vehicles are rolling off the line."
 tur_mrap3_tender.10.a: "Built to survive."

 tur_mrap3_tender.11.name: "BMC Amazon Enters Service"
 tur_mrap3_tender.11.desc: "The Amazon is BMC's attempt to build an armored vehicle that does not feel like a compromise. It is quick, nimble and comfortable to drive, with enough protection to survive an ambush and enough room to carry a squad and its equipment. Crews like it because it goes where larger vehicles cannot.\n\nIt does not match the heaviest MRAPs for protection, and planners have noted that its weapon options are modest. The army considers that an acceptable trade for a vehicle that keeps pace with the rest of the column.\n\n§GStrengths:§! Very good mobility, balanced protection, and roomy for its size.\n§RWeaknesses:§! Lighter armor than the largest MRAPs and limited weapon options.\n\nBMC reports that production is ramping up smoothly."
 tur_mrap3_tender.11.a: "Fast and well protected."

 tur_mrap3_tender.12.name: "Katmerciler Ateş Enters Service"
 tur_mrap3_tender.12.desc: "Katmerciler built the Ateş as a rugged, practical armored vehicle for units that need protection without paying for a heavyweight. Its hull is tough, its cabin is simple to operate and its mounting points accept a wide range of weapons, which pleases the commanders who will actually be using it.\n\nIt is a young design from a company still proving itself on the big stage. Some officers worry that it has not yet been tested in a long campaign, but its low price has made it easy to approve.\n\n§GStrengths:§! Good protection for the price, flexible weapon mounts, and low cost.\n§RWeaknesses:§! Limited track record and modest payload.\n\nThe first units are being handed over to the army."
 tur_mrap3_tender.12.a: "A promising newcomer."

 tur_mrap3_tender.13.name: "NMS Yörük Enters Service"
 tur_mrap3_tender.13.desc: "The Yörük is a tactical armored vehicle named for the nomads who crossed Anatolia with their herds, and it lives up to the name. Its suspension and drivetrain let it cross rough country at speeds that surprise even experienced drivers, and its protected cabin keeps the crew safe when the road turns dangerous.\n\nIt carries fewer troops than a full-sized carrier, and its armor is a step below the largest MRAPs. The army considers it a fine fit for fast-moving units that value speed over bulk.\n\n§GStrengths:§! Excellent off-road mobility, solid protection, and good firepower options.\n§RWeaknesses:§! Small troop capacity and lighter armor than the heaviest designs.\n\nFNSS has begun delivering the first vehicles."
 tur_mrap3_tender.13.a: "Born to move."

 tur_mrap3_tender.14.name: "Otokar Akrep 2 Enters Service"
 tur_mrap3_tender.14.desc: "The Akrep 2 is Otokar's improved light tactical vehicle, and it takes the original's best qualities and adds more of everything: better armor, a stronger engine and a more capable weapon mount. It can scout ahead of the column, carry a weapon team or serve as a command vehicle, depending on what the unit needs.\n\nIt is still a light vehicle, and its protection cannot compare with a true MRAP. Commanders are advised to use its speed rather than rely on its armor.\n\n§GStrengths:§! Versatile, good firepower, and well tested in the field.\n§RWeaknesses:§! Light protection and limited cargo space.\n\nOtokar's lines are already tooled for full production."
 tur_mrap3_tender.14.a: "The scorpion returns."

 tur_mrap3_tender.15.name: "BMC Turan Enters Service"
 tur_mrap3_tender.15.desc: "The Turan is BMC's answer to the need for a fast, flexible utility vehicle. It is light enough to move quickly over poor roads, large enough to carry a squad or a stack of supplies and simple enough that a driver can learn it in a day. Logistics officers have already started asking for more.\n\nIt offers little in the way of armor, and it was never meant to fight at the front. As a workhorse behind the lines, it is hard to beat.\n\n§GStrengths:§! Great mobility, flexible cargo space, and easy to operate.\n§RWeaknesses:§! Thin armor and limited weapon options.\n\nProduction has started, and the first batch is on its way."
 tur_mrap3_tender.15.a: "A reliable workhorse."

 tur_mrap3_tender.16.name: "BMC Tulga Enters Service"
 tur_mrap3_tender.16.desc: "The Tulga is the most affordable option the army considered, and it makes no secret of it. It is a tough, simple vehicle that carries troops and cargo without fuss, and its basic design means that mechanics can repair it with the tools they already have.\n\nIt is not a showpiece. Its protection is modest, and its performance is merely adequate, but the army gets a lot of vehicles for the money, and in a war that matters.\n\n§GStrengths:§! Very low cost, simple to maintain, and quick to produce.\n§RWeaknesses:§! Modest protection and unremarkable performance.\n\nBMC's lines are producing the first units."
 tur_mrap3_tender.16.a: "Cheap and cheerful."

 tur_mrap3_tender.17.name: "Nurol Yetişen Enters Service"
 tur_mrap3_tender.17.desc: "Nurol's Yetişen was designed to reach the battlefield quickly and bring its crew home again. It is a tactical vehicle with a protected cabin, a capable weapon mount and a drivetrain that copes well with mud, sand and steep ground. Soldiers who have used it say that it feels solid on rough terrain.\n\nIt costs more than the simpler utility vehicles, and its cargo space is limited. The army has accepted the price in return for a vehicle that can handle both transport and patrol duties.\n\n§GStrengths:§! Good protection, strong mobility, and flexible roles.\n§RWeaknesses:§! Higher cost than basic utility vehicles and limited cargo space.\n\nProduction is beginning, though the finance ministry is watching closely."
 tur_mrap3_tender.17.a: "Quick to the fight."


  # ============================================================
 # SPAA TENDER
 # ============================================================
 tur_spaa_tender: "Hold a tender for §YSPAA Systems§!"
 tur_spaa_tender_desc: "\n\n\n\n\n\n£TUR_spaa_tender_for_tooltip\n\n\n\n\n\n\n\n\n§WTender for a new self-propelled air defense system to protect our maneuver forces.\n§W--------------§!\n[TUR.GetFlag]§YAtilgan§! and §YZipkin§!: short-range §YStinger§! missile systems with §Gdomestic design§! and §Gcheap, quick production§!, but §Rinfrared guidance limits performance in poor weather§!.\n[FRA.GetFlag][GER.GetFlag]§YRoland§!: missile system on an §LFNSS§! §YACV§! chassis with §Gall-weather capability§! and §Gradar tracking§!, but §Rforeign-dependent§! and §Rexpensive§!.\n§W--------------§!\n§RWarning:§! This Decision is §Rrequired§! to unlock the §YKorkut§! Development and the §YHisar§! Development.\nIf you §Rskip§! it, they will §Rnot§! be available to you.§!"
 tur_spaa_tender.1.name: "The Air Defense Tender"
 tur_spaa_tender.1.desc: "§WThe proposals for the §YSelf-Propelled Air Defense Tender§! have been reviewed. Our maneuver forces cannot keep advancing beneath an open sky, and two options have been put before us.\n\n[TUR.GetFlag]§YAtilgan§! and §YZipkin§!: short-range §YStinger§! systems on armored vehicles, §Gdomestic§!, §Gcheap§! and §Gquick to field§!, but §Rinfrared guidance§! limits them in poor weather and against defended targets.\n\n[FRA.GetFlag][GER.GetFlag]§YRoland§! on an §LFNSS§! §YACV§! chassis: §Gall-weather§! with §Gradar tracking§! and a heavier missile, but §Rexpensive§!, §Rcomplex§! and §Rdependent on foreign suppliers§!.\n\nDomestic production or foreign capability?§!"
 tur_spaa_tender.1.a: "[TUR.GetFlag]§YAtilgan§! and §YZipkin§! §G(Domestic, cheap)§! §R(Weather limits)§!"
 tur_spaa_tender.1.b: "[FRA.GetFlag][GER.GetFlag]§YRoland§! §G(All-weather)§! §R(Expensive, foreign)§!"

 TUR_develop_hisar: "Develop the §YHisar-A§! and §YHisar-O§!"
 TUR_develop_hisar_desc: "\n\n\n\n\n\n£TUR_develop_hisar_for_tooltip\n\n\n\n\n\n\n\n\n§WNew equipment: §YHisar-A§! and §YHisar-O§! surface-to-air missile systems.\nDevelopers: §LASELSAN§! (radars and fire control) and §LRoketsan§! (missiles).\nFeatures: §Gmobile low-altitude defense§! (§YHisar-A§!) and §Gmedium-altitude coverage§! (§YHisar-O§!), and other smaller features.§!"
 tur_hisar_requires_korkut: "Complete the §YKorkut§! Development"

 tur_korkut_development: "Develop the §YKorkut§!"
 tur_korkut_development_desc: "\n\n\n\n\n\n£TUR_korkut_for_tooltip\n\n\n\n\n\n\n\n\n§WNew equipment: §YKorkut§!, self-propelled air defense system that escorts our armored columns.\nDeveloper: §LASELSAN§!.\nFeatures: §Gtwin 35-mm cannons§! and §Gintegrated radar and fire control§!, and other smaller features.\n§W--------------§!\n§RWarning:§! This Decision is §Rrequired§! to unlock the §YHisar§! Development and the §YGürz§! or §YBurç§! Development.\nIf you §Rskip§! it, they will §Rnot§! be available to you.§!"
 tur_korkut_requires_kms: "Complete the §YSPAA Systems Tender§!"
 tur_korkut_development.1.name: "Korkut SPAAG Development"
 tur_korkut_development.1.desc: "§WThe §YKorkut§! began as a requirement for an air defense system that could accompany our armored columns and engage threats at close range. Its twin §Y35-mm§! cannons, radars and electro-optical suite are ready, but it still lacks a carrier platform.\n\n§LFNSS§! §YACV-30§!: tracked chassis with §Gfar better protection§! and §Gdurability§!, but §Rslower§!.\n\n§LOtokar§! §YArma 8x8§!: wheeled chassis with §Ghigh speed§! and §Gmobility§!, but §Rless protection§!.\n\nWhichever we choose will define how the §YKorkut§! fights for decades.§!"
 tur_korkut_development.1.a: "§LFNSS§! §YACV-30§! §G(Better protection)§! §R(Slower)§!"
 tur_korkut_development.1.b: "§LOtokar§! §YArma 8x8§! §G(Fast, mobile)§! §R(Less protection)§!"

 tur_spaa_tender.10.name: "Atilgan and Zipkin Enter Service"
 tur_spaa_tender.10.desc: "Aselsan's two missile systems are now ready to protect the army's columns from the air. The Zipkin rides on a light wheeled chassis and can keep pace with fast-moving units, while the Atilgan sits on a tracked hull that follows the armor across rough ground. Both rely on short-range missiles guided by optical sensors, and crews say they are quick to learn and quick to fire.\n\nNeither system can reach high-flying aircraft, and their optical guidance suffers in poor weather. The army considers that an acceptable limit for a homegrown design that it controls from top to bottom.\n\n§GStrengths:§! Domestic design, good mobility, low cost, and easy to train crews for.\n§RWeaknesses:§! Short range and optical guidance that struggles in bad weather.\n\nAselsan has begun delivering the first launchers."
 tur_spaa_tender.10.a: "Homegrown air defense."

 tur_spaa_tender.11.name: "ACV Roland Enters Service"
 tur_spaa_tender.11.desc: "The Roland is a respected European air defense missile, and mounted on the ACV chassis it gives the army a protected, mobile launcher with a far longer reach than the short-range options. Its radar guidance lets it engage aircraft in poor weather and at night, which has long been a gap in the army's defenses.\n\nIt is a foreign design, and the army will depend on outside suppliers for spares and missiles. It is also a good deal more expensive than the domestic alternatives, and the finance ministry has noticed.\n\n§GStrengths:§! Medium range, radar guidance, all-weather capability, and a proven missile.\n§RWeaknesses:§! High cost and reliance on foreign suppliers.\n\nThe first launchers are being fitted at Aselsan's lines."
 tur_spaa_tender.11.a: "Reach and precision."

 tur_korkut_development.10.name: "Korkut 150/35 Enters Service"
 tur_korkut_development.10.desc: "The Korkut 150/35 is the tracked version of Aselsan's self-propelled anti-aircraft gun, and it was designed to travel with the armored columns it protects. Its twin autocannons and radar fire control let it track and shoot down low-flying aircraft and drones before they can drop their loads, and its hull can take a few hits that would cripple a lighter vehicle.\n\nThe tracked chassis is heavy and costly, and it needs more fuel and maintenance than a wheeled design. Crews accept that in return for a vehicle that can follow tanks anywhere.\n\n§GStrengths:§! Strong firepower, good armor, radar guidance, and able to follow armored units across rough ground.\n§RWeaknesses:§! High cost and heavy upkeep.\n\nAselsan has begun producing the first vehicles."
 tur_korkut_development.10.a: "Guardian of the columns."

 tur_korkut_development.11.name: "Korkut 140/35 Enters Service"
 tur_korkut_development.11.desc: "The Korkut 140/35 carries the same twin autocannons and radar as its tracked cousin, but on a wheeled chassis built for speed on roads. It can cover long distances without tearing up the pavement or wearing out its drivetrain, and it reaches new positions before enemy aircraft know where it went.\n\nIt does not handle soft ground as well as a tracked vehicle, and it is less able to survive a direct attack. Commanders will have to keep it near the roads and out of the fire.\n\n§GStrengths:§! Strong firepower, radar guidance, fast road speed, and cheaper to maintain.\n§RWeaknesses:§! Weaker off-road and lighter protection.\n\nAselsan has begun producing the first vehicles."
 tur_korkut_development.11.a: "Fast on the road."

 # ============================================================
 # GURZ / BURC
 # ============================================================
 tur_gurz_requires_hisar: "Complete the §YHisar§! Development"
 tur_gurz_burc_development: "Develop a New §YSelf-Propelled Anti-Air Vehicle§!"
 tur_gurz_burc_development_desc: "\n\n\n\n\n\n£GFX_TUR_develop_gurz_burc_for_tooltip\n\n\n\n\n\n\n\n\n§WProgram to develop a modern domestic self-propelled anti-air system to protect our mechanized columns.\n§W--------------§!\n[TUR.GetFlag]§YGürz§!: §Gmore capable platform§!, but §Rmore expensive§!.\n[TUR.GetFlag]§YBurç§!: §Gcheaper§! and §Gsimpler§!, but §Rless capable§!.\n§W--------------§!\nThe program has §Y3 stages§!: the §Yplatform§! is chosen immediately, the §Yanti-air cannon§! after §Y40 days§!, and the §Ymissiles§! after §Y80 days§!. The design will be ready after §Y120 days§!.§!"
 tur_gurz_burc_dev.1.name: "The Anti-Air Vehicle Program"
 tur_gurz_burc_dev.1.desc: "§WOur mechanized columns have no answer to modern air threats, and Turkish engineers have two domestic proposals ready for a new §Yself-propelled anti-air vehicle§!. The choice of platform must be made now, and the cannon and missile systems will be decided in the coming months.\n\n[TUR.GetFlag]§YGürz§!: a §Gmore capable§! platform with §Gmore room for growth§!, but §Rmore expensive§! to develop.\n\n[TUR.GetFlag]§YBurç§!: a §Gcheaper§! and §Gsimpler§! platform that can be fielded quickly, but §Rless capable§! and §Rwith limited room for growth§!.\n\nWhich platform should the program be built around?§!"
 tur_gurz_burc_dev.1.a: "[TUR.GetFlag]§YGürz§! §G(More capable)§! §R(More expensive)§!"
 tur_gurz_burc_dev.1.b: "[TUR.GetFlag]§YBurç§! §G(Cheaper, simpler)§! §R(Less capable)§!"
 tur_gurz_burc_dev.2.name: "Anti-Air Cannon Selection"
 tur_gurz_burc_dev.2.desc: "§WThe platform is settled, and the design team now needs a decision on the main armament.\n\n§YHeavy anti-air cannon§!: §Ggreater range§! and §Ghigher hitting power§! against fast or armored targets, but §Rmore expensive§!, §Rheavier§! and §Rconsumes more ammunition§!.\n\n§YStandard anti-air cannon§!: §Gcheaper§!, §Glighter§! and §Gproven§!, but §Rless effective§! against more advanced aircraft.\n\nThe missile systems will be decided in §Y40 days§!.§!"
 tur_gurz_burc_dev.2.a: "§YHeavy anti-air cannon§! §G(Range, hitting power)§! §R(More expensive)§!"
 tur_gurz_burc_dev.2.b: "§YStandard anti-air cannon§! §G(Cheaper, proven)§! §R(Less effective)§!"
 tur_gurz_burc_dev.3.name: "Anti-Air Missile Selection"
 tur_gurz_burc_dev.3.desc: "§WThe final design decision is the missile system that will complement the cannon.\n\n§YMedium range missiles§!: §Gengage targets well beyond cannon range§! and give the vehicle §Gmuch more flexibility§!, but §Rcost more§! and §Rneed a more complex fire control system§!.\n\n§YShort range missiles§!: §Gcheaper§!, §Gsimpler§! and §Gquick to field§!, but §Rlimited reach§!.\n\nThe finished design will be delivered in §Y40 days§!.§!"
 tur_gurz_burc_dev.3.a: "§YMedium range missiles§! §G(Reach, flexibility)§! §R(More expensive)§!"
 tur_gurz_burc_dev.3.b: "§YShort range missiles§! §G(Cheaper, simpler)§! §R(Limited reach)§!"
 tur_gurz_burc_dev.10.name: "The Anti-Air Vehicle is Ready"
 tur_gurz_burc_dev.10.desc_gurz: "§WAfter four months of development, the §YGürz§! has passed its acceptance trials. Built around the cannon and missile systems chosen during the program, it is a capable platform that will give our mechanized units serious protection against air attack.\n\n§GStrengths:§! Capable platform, good growth potential, flexible armament.\n§RWeaknesses:§! High cost, more complex to maintain.\n\nThe design is now available, and production will begin shortly.§!"
 tur_gurz_burc_dev.10.desc_burc: "§WAfter four months of development, the §YBurç§! has passed its acceptance trials. Built around the cannon and missile systems chosen during the program, it is a simple and affordable platform that can be fielded in numbers quickly.\n\n§GStrengths:§! Low cost, simple, quick to produce.\n§RWeaknesses:§! Less capable platform, limited growth potential.\n\nThe design is now available, and production will begin shortly.§!"
 tur_gurz_burc_dev.10.a: "Our columns are no longer defenseless."
 
 tur_acv15_aifv_upgrade: "ACV-15T1 AIFV Upgrade"
 tur_acv15_aifv_upgrade_desc: "\n\n\n\n\n\n£TUR_aifv_for_tooltip\n\n\n\n\n\n\n\n\n§WModernization of the §YACV-15 AIFV§!, the infantry fighting vehicle of the Turkish mechanised infantry, developed by §LFNSS§! with fire control from §LAselsan§!.\n§W--------------§!\n§WMain features:\n- §GLarger main gun§! with a choice between keeping the §Y25mm§! cannon or moving to a §Y35mm§! cannon.\n- §GNew turret§! with modern stabilised sights and fire control, either §Ymanned§! or §Yunmanned§!.\n§W--------------§!\n§WOptional §Yturret-mounted anti-tank missiles§! and other smaller modifications.\n§RHigher options increase the cost of the programme.§!\n§W--------------§!\n§RWarning:§! This Decision is §Rrequired§! to unlock the §YPars İzci§! Development and the §YYNZMA§! Development.\nIf you §Rskip§! it, they will §Rnot§! be available to you.§!"
 tur_acv15_aapc_upgrade: "ACV-15T1 AAPC Upgrade"
 tur_acv15_aapc_upgrade_desc: "\n\n\n\n\n\n£TUR_aapc_for_tooltip\n\n\n\n\n\n\n\n\n§WModernization of the §YACV-15 AAPC§!, the armoured personnel carrier of the Turkish mechanised infantry, developed by §LFNSS§! with a remote weapon station from §LAselsan§!.\n§W--------------§!\n§WMain features:\n- §GNew remote weapon station§! with a choice between a §Y12.7mm§! gun or a §Y25mm§! cannon.\n- §GOptional upgraded engine§! to restore mobility under the added weight.\n§W--------------§!\n§WOptional §Yturret-mounted anti-tank missiles§! and other smaller modifications.\n§RHigher options increase the cost of the programme.§!\n§W--------------§!\n§RWarning:§! This Decision is §Rrequired§! to unlock the §YPars İzci§! Development and the §YYNZMA§! Development.\nIf you §Rskip§! it, they will §Rnot§! be available to you.§!"
 tur_acv15_aifv.1.name: "ACV-15T1 AIFV: Main Gun"
 tur_acv15_aifv.1.desc: "§WThe §YACV-15§! family was built by §LFNSS§! from the 1990s as the backbone of the Turkish mechanised infantry, and the §YAIFV§! variant has carried a §Y25mm§! cannon ever since. The gun remains reliable and well understood, but the battlefield has moved on and modern infantry fighting vehicles now field heavier armour.\n\nThe army has asked §LFNSS§! and §LAselsan§! to study a new armament. Keeping the §Y25mm§! cannon §Gis cheap§! and §Gneeds little rework§!, but §Rlimits lethality against modern armour§!. A move to a §Y35mm§! cannon gives §Gfar better penetration and range§!, but §Rcosts more§! and §Rrequires a reworked turret§!.§!"
 tur_acv15_aifv.1.a: "Keep the 25mm cannon"
 tur_acv15_aifv.1.b: "Move to a 35mm cannon"
 tur_acv15_aifv.2.name: "ACV-15T1 AIFV: Turret"
 tur_acv15_aifv.2.desc: "§WThe original one-man turret of the §YACV-15 AIFV§! forces the gunner to sit inside the turret ring, and its fire control is dated by today's standards. §LAselsan§!, our leading defence electronics house, has offered modern stabilised sights and fire control for either layout, while §LFNSS§! will handle integration with the hull.\n\nA §Ymanned turret§! §Gis proven§! and §Gcheap§!, but §Rleaves the gunner exposed to turret damage§!. An §Yunmanned turret§! §Gkeeps the entire crew protected in the hull§! and §Gfrees up internal space§!, but §Ris costly§! and §Rcomplex to integrate§!.§!"
 tur_acv15_aifv.2.a: "Manned turret"
 tur_acv15_aifv.2.b: "Unmanned turret"
 tur_acv15_aifv.3.name: "ACV-15T1 AIFV: Anti-Tank Missiles"
 tur_acv15_aifv.3.desc: "§WThe §YAIFV§! was designed to fight alongside tanks, not against them, and its cannon alone struggles against heavy armour at long range. Both §LFNSS§! and §LAselsan§! have proposed fitting an anti-tank guided missile launcher on the turret, linked to the new fire control.\n\nA §Yturret-mounted ATGM§! §Gallows the vehicle to engage tanks at long range§! and §Gadds flexibility on the battlefield§!, but §Radds cost§! and §Rtakes up turret space§!. Without it, the vehicle stays §Gsimpler§! and §Gcheaper§!, but §Rdepends on tanks or other units to deal with enemy armour§!.§!"
 tur_acv15_aifv.3.a: "No ATGM"
 tur_acv15_aifv.3.b: "Add a turret-mounted ATGM"
 tur_acv15_aifv.4.name: "ACV-15T1 AIFV: Design Complete"
 tur_acv15_aifv.4.desc: "§WAfter months of joint work, §LFNSS§! and §LAselsan§! have delivered the final design for the upgraded §YACV-15 AIFV§!. The first modernised vehicles are ready to join the mechanised infantry units of the Land Forces.§!"
 tur_acv15_aifv.4.a: "Excellent."
 tur_acv15_aapc.1.name: "ACV-15T1 AAPC: Armament"
 tur_acv15_aapc.1.desc: "§WThe §YACV-15 AAPC§! is the troop carrier of the family. It has served with a simple machine gun on an open cupola, which leaves its crew exposed and its fire support weak. §LAselsan§!, our leading maker of remote weapon stations, has offered a stabilised station with day and night sights, which §LFNSS§! can fit to the existing hull.\n\nA §Y12.7mm§! station §Gis light§! and §Ginexpensive§!, but §Rgives only limited firepower§!. A §Y25mm§! station §Ggives the carrier real fire support§! and §Gcan engage light armour§!, but §Rcosts more§! and §Rcarries more weight§!.§!"
 tur_acv15_aapc.1.a: "12.7mm remote weapon station"
 tur_acv15_aapc.1.b: "25mm remote weapon station"
 tur_acv15_aapc.2.name: "ACV-15T1 AAPC: Powertrain"
 tur_acv15_aapc.2.desc: "§WThe §YACV-15§! has served for decades with its original powerpack, and the added armour, weapon station and equipment of the upgrade will push it further. §LFNSS§!, as the vehicle's designer and builder, has warned that the extra weight will cost the carrier speed, acceleration and reliability over time.\n\nKeeping the §Yexisting engine§! §Gis cheap§! and §Gkeeps the logistics chain unchanged§!, but §Rthe heavier vehicle will be slower§! and §Rmore prone to breakdowns§!. An §Yupgraded engine§! §Grestores mobility§! and §Gextends the service life of the vehicle§!, but §Rcosts more§! and §Rrequires changes to the hull§!.§!"
 tur_acv15_aapc.2.a: "Keep the existing engine"
 tur_acv15_aapc.2.b: "Install an upgraded engine"
 tur_acv15_aapc.3.name: "ACV-15T1 AAPC: Anti-Tank Missiles"
 tur_acv15_aapc.3.desc: "§WAs a carrier, the §YAAPC§! was never meant to fight enemy armour, but the infantry it carries often meets tanks with little support nearby. §LAselsan§! has proposed adding an anti-tank guided missile launcher to the remote weapon station, which §LFNSS§! can integrate with the new fire control.\n\nA §Yturret-mounted ATGM§! §Ggives the carrier a long-range anti-armour option§! and §Gstrengthens the dismounted infantry§!, but §Radds cost§! and §Rreduces the room left for ammunition§!. Without it, the vehicle stays §Gcheaper§! and §Gsimpler§!, but §Rhas no answer to enemy tanks§!.§!"
 tur_acv15_aapc.3.a: "No ATGM"
 tur_acv15_aapc.3.b: "Add a turret-mounted ATGM"
 tur_acv15_aapc.4.name: "ACV-15T1 AAPC: Design Complete"
 tur_acv15_aapc.4.desc: "§WAfter months of joint work, §LFNSS§! and §LAselsan§! have delivered the final design for the upgraded §YACV-15 AAPC§!. The first modernised carriers are ready to join the mechanised infantry units of the Land Forces.§!"
 tur_acv15_aapc.4.a: "Excellent."
 tur_aapc_requires_afv: "Complete the §YAFV§! Development"
 tur_acv_requires_afv: "Complete the §YAFV§! Development"


 tur_afv_tender: "Hold a tender for §YWheeled Armoured Vehicles§!"
 tur_afv_tender_desc: "\n\n\n\n\n\n£TUR_desctext_develop_domestic_afv_for_tooltip\n\n\n\n\n\n\n\n\n§WTender for a new domestic wheeled armoured vehicle for the Land Forces.\n§W--------------§!\n§LOtokar§! §YArma§!: 8x8 wheeled armoured vehicle with §Ghigh payload§! and §Gstrong mine protection§!, but §Rheavier§!.\n§LFNSS§! §YPars III§!: 6x6/8x8 wheeled armoured vehicle with §Ggreat agility§! and §Gcheap production§!, but §Rless payload§!.\n§W--------------§!\n§RWarning:§! This Decision is §Rrequired§! to unlock the development of §Ynewer versions§! of these vehicles.\nIf you §Rskip§! it, they will §Rnot§! be available to you.§!"
 turkey_afv_tender.1.name: "AFV Tender: Choose a Design"
 turkey_afv_tender.1.desc: "§WThe army has reviewed the candidates for the new armoured vehicle family. §LOtokar§! has submitted the §YArma§! and §LFNSS§! has submitted the §YPars III§!. Each is offered as an §Yinfantry fighting vehicle§! and an §Yarmoured personnel carrier§!.\n\n§LOtokar§! §YArma§!: modular 8x8 with §Ghigh payload§! and §Gstrong mine protection§!, but §Rheavier§!.\n\n§LFNSS§! §YPars III§!: modular 8x8 with §Ggreat agility§! and §Gcheap production§!, but §Rless payload§!.\n\nThe chosen design will enter service in §Y120 days§!§W.§!"
 turkey_afv_tender.1.a: "§LOtokar§! §YArma§! §G(Payload and protection)§! §R(Heavier)§!"
 turkey_afv_tender.1.b: "§LFNSS§! §YPars III§! §G(Agile and cheap)§! §R(Less payload)§!"
 turkey_afv_tender.2.name: "AFV Tender: Design Delivered"
 turkey_afv_tender.2.desc: "§WAfter 120 days of work, the winning design is ready. Both its §Yinfantry fighting vehicle§! and §Yarmoured personnel carrier§! variants are now available to the Land Forces.§!"
 turkey_afv_tender.2.a: "Excellent."


 tur_pars_izci_development: "Pars İzci Development"
 tur_pars_izci_development_desc: "\n\n\n\n\n\n£TUR_pars_izci_for_tooltip\n\n\n\n\n\n\n\n\n§WDevelopment of the new §YPars İzci§! reconnaissance vehicle, a wheeled scout derived from the §YPars IV§! family and developed by §LFNSS§! with weapon systems from §LAselsan§!.\n§W--------------§!\n§WMain features:\n- §GChoice of drive§! between a heavier §Y8x8§! and a lighter §Y6x6§! configuration.\n- §GChoice of armament§! between a §Y12.7mm§! remote weapon station and a §Y30mm§! cannon in an unmanned turret.\n§W--------------§!\n§WOptional §Yupgraded engine§! and other smaller modifications.\n§RHigher options increase the cost of the programme.§!"
 tur_pars_izci_development.1.name: "Pars İzci: Drive Configuration"
 tur_pars_izci_development.1.desc: "§WThe army has long relied on converted utility vehicles and older armoured cars for reconnaissance, and neither can keep pace with the mechanised units they are meant to screen. §LFNSS§! has proposed a dedicated scout built on its proven §YPars III§! hull, with two possible layouts.\n\nThe §Y8x8§! layout §Gcarries more armour§! and §Gleaves room for heavier equipment§!, but §Ris heavier§!, §Rless agile§! and §Rcostlier to build§!. The §Y6x6§! layout §Gis lighter§!, §Gfaster§! and §Gcheaper§!, but §Rcarries less protection§! and §Rhas less room to grow§!.§!"
 tur_pars_izci_development.1.a: "8x8 configuration"
 tur_pars_izci_development.1.b: "6x6 configuration"
 tur_pars_izci_development.2.name: "Pars İzci: Armament"
 tur_pars_izci_development.2.desc: "§WA scout must see the enemy first, but it also needs a way to fight clear when it is found. §LAselsan§!, our leading maker of remote weapon stations and turrets, has offered two options for the §YPars İzci§!, both fitted to the hull by §LFNSS§!.\n\nA §Y12.7mm§! remote weapon station §Gis light§!, §Ginexpensive§! and §Gkeeps the vehicle quiet and agile§!, but §Rgives only limited firepower§!. A §Y30mm§! cannon in an unmanned turret §Ggives real firepower against light armour§! and §Gkeeps the crew protected in the hull§!, but §Rcosts far more§! and §Radds weight§!.§!"
 tur_pars_izci_development.2.a: "12.7mm remote weapon station"
 tur_pars_izci_development.2.b: "30mm cannon in an unmanned turret"
 tur_pars_izci_development.3.name: "Pars İzci: Powertrain"
 tur_pars_izci_development.3.desc: "§WA reconnaissance vehicle lives on speed, range and reliability, and the sensors, armament and armour of the design add weight to the hull. §LFNSS§! has warned that the engine inherited from the §YPars III§! will carry the load, but with less margin than a scout needs.\n\nKeeping the §Ysame engine§! §Gis cheap§! and §Gkeeps the logistics chain unchanged§!, but §Rthe vehicle will be slower under load§!. An §Yupgraded engine§! §Gimproves speed§! and §Gimproves reliability in the field§!, but §Rcosts more§! and §Rrequires changes to the hull§!.§!"
 tur_pars_izci_development.3.a: "Keep the same engine"
 tur_pars_izci_development.3.b: "Install an upgraded engine"
 tur_pars_izci_development.4.name: "Pars İzci: Design Complete"
 tur_pars_izci_development.4.desc: "§WAfter months of joint work, §LFNSS§! and §LAselsan§! have delivered the final design of the §YPars İzci§!. The first vehicles are ready to join the reconnaissance units of the Land Forces.§!"
 tur_pars_izci_development.4.a: "Excellent."
 tur_izci_requires_aifv: "Complete the §YACV-15T1 ZMA§! Modernization"

 tur_ynzma_leg1: "YNZMA Leg 1 Development"
 tur_ynzma_leg1_desc: "\n\n\n\n\n\n£TUR_ynzma_for_tooltip\n\n\n\n\n\n\n\n\n§WDevelopment of a new §Yinfantry fighting vehicle§! for the Turkish mechanised infantry under the first leg of the §YYNZMA§! programme, with candidates from §LFNSS§!, §LOtokar§! and §LBMC§!.\n§W--------------§!\n§WMain features:\n- §GChoice of vehicle§! between the §YPars Alpha§!, the §YArma 2§! and the §YAltuğ§!.\n- §GChoice of armament§! between a §Y25mm§! and a §Y35mm§! cannon, with an optional turret-mounted §YATGM§!.\n§W--------------§!\n§WOptional §Yhybrid engine§! and other smaller modifications.\n§RHigher options increase the cost of the programme.§!\n§W--------------§!\n§RWarning:§! This Decision is §Rrequired§! to unlock the next legs of the §YYNZMA§! programme.\nIf you §Rskip§! it, they will §Rnot§! be available to you.§!"
 tur_ynzma_leg1.1.name: "YNZMA Leg 1: Choose a Vehicle"
 tur_ynzma_leg1.1.desc: "§WThe §YACV-15§! has carried the mechanised infantry for decades, and the army now wants a successor that can fight on a modern battlefield. The §YYNZMA§! programme has been opened in stages, and three Turkish manufacturers have answered the first call.\n\n§LFNSS§! §YPars Alpha§!: wheeled infantry fighting vehicle built on the §YPars§! family, with §Ggreat agility§! and §Gproven mobility§!, but §Rthe highest price§!.\n\n§LOtokar§! §YArma 2§!: 8x8 wheeled vehicle with §Ghigh payload§! and §Gstrong mine protection§!, but §Rheavier§! and §Rof moderate cost§!.\n\n§LBMC§! §YAltuğ§!: wheeled vehicle with §Glow cost§! and §Gfast development§!, but §Rless proven§! than its rivals.\n\nThe chosen design will take §Y120 days§! to complete.§!"
 tur_ynzma_leg1.1.a: "FNSS Pars Alpha"
 tur_ynzma_leg1.1.b: "Otokar Arma 2"
 tur_ynzma_leg1.1.c: "BMC Altuğ"
 tur_ynzma_leg1.2.name: "YNZMA Leg 1: Cannon"
 tur_ynzma_leg1.2.desc: "§WThe turret is where the new vehicle will earn its keep. §LAselsan§!, our leading defence electronics house, has offered a stabilised turret with modern sights and fire control, and the manufacturer will integrate it with the hull.\n\nA §Y25mm§! cannon §Gis proven§!, §Glight§! and §Ginexpensive§!, but §Rstruggles against modern armour§!. A §Y35mm§! cannon §Ggives far better penetration and range§! and §Gcan threaten heavier vehicles§!, but §Rcosts more§! and §Rcarries more weight§!.§!"
 tur_ynzma_leg1.2.a: "25mm cannon"
 tur_ynzma_leg1.2.b: "35mm cannon"
 tur_ynzma_leg1.3.name: "YNZMA Leg 1: Anti-Tank Missiles"
 tur_ynzma_leg1.3.desc: "§WThe cannon alone cannot reach the enemy tanks that sit beyond its range. §LAselsan§! has proposed fitting an anti-tank guided missile launcher to the turret, linked to the same fire control as the cannon.\n\nA §Yturret-mounted ATGM§! §Gallows the vehicle to engage tanks at long range§! and §Gadds flexibility on the battlefield§!, but §Radds cost§! and §Rtakes up turret space§!. Without it, the vehicle stays §Gsimpler§! and §Gcheaper§!, but §Rdepends on tanks and other units to deal with enemy armour§!.§!"
 tur_ynzma_leg1.3.a: "No ATGM"
 tur_ynzma_leg1.3.b: "Add a turret-mounted ATGM"
 tur_ynzma_leg1.4.name: "YNZMA Leg 1: Engine"
 tur_ynzma_leg1.4.desc: "§WThe armament, armour and electronics of the new vehicle will add weight to the hull, and the engine must carry it across rough terrain. The manufacturer has offered two powertrains.\n\nA §Ydiesel engine§! §Gis proven§!, §Gcheap§! and §Gkeeps the logistics chain unchanged§!, but §Ruses more fuel§! and §Ris louder§!. A §Yhybrid engine§! §Gimproves efficiency§! and §Gallows quiet running§!, but §Rcosts more§! and §Ris more complex to maintain§!.§!"
 tur_ynzma_leg1.4.a: "Diesel engine"
 tur_ynzma_leg1.4.b: "Hybrid engine"
 tur_ynzma_leg1.5.name: "YNZMA Leg 1: Design Delivered"
 tur_ynzma_leg1.5.desc: "§WAfter 120 days of work, the manufacturer and §LAselsan§! have delivered the final design of the §YYNZMA§! infantry fighting vehicle. The first vehicles are ready to join the mechanised infantry units of the Land Forces.§!"
 tur_ynzma_leg1.5.a: "Excellent."
 tur_ynzma1_requires_izci: "Complete the §YFNSS İzci§! Development"

 tur_ynzma_leg2: "YNZMA Leg 2 Development"
 tur_ynzma_leg2_desc: "\n\n\n\n\n\n£TUR_ynzma_leg2_for_tooltip\n\n\n\n\n\n\n\n\n§WDevelopment of a new §Ylight tank§! for the Turkish Land Forces under the second leg of the §YYNZMA§! programme, with candidates from §LFNSS§!, §LOtokar§! and §LBMC§!.\n§W--------------§!\n§WMain features:\n- §GChoice of vehicle§! between the §YPars Alpha 120 HT§!, the §YArma XC-8 120mm§! and the §YAltuğ Hitfact 120mm§!.\n- §GChoice of armament§! between a §Y105mm§! and a §Y120mm§! cannon, with either a §Ymanned§! or an §Yunmanned§! turret.\n§W--------------§!\n§WOptional §Yhybrid engine§! and other smaller modifications.\n§RHigher options increase the cost of the programme.§!"
 tur_ynzma_leg2.1.name: "YNZMA Leg 2: Choose a Vehicle"
 tur_ynzma_leg2.1.desc: "§WThe army wants a light tank that can keep pace with the mechanised infantry and still hit hard. Three Turkish manufacturers have answered the call with wheeled designs, each carrying a §Y120mm§! gun on a lightweight hull.\n\n§LFNSS§! §YPars Alpha 120 HT§!: heavy-turret variant of the §YPars§! family, with §Ggreat agility§! and §Gproven mobility§!, but §Rthe highest price§!.\n\n§LOtokar§! §YArma XC-8 120mm§!: 8x8 platform with §Gstrong mine protection§! and §Gplenty of room to grow§!, but §Rheavier§! and §Rof moderate cost§!.\n\n§LBMC§! §YAltuğ Hitfact 120mm§!: compact design with §Glow cost§! and §Gfast development§!, but §Rless proven§! than its rivals.§!"
 tur_ynzma_leg2.1.a: "FNSS Pars Alpha 120 HT"
 tur_ynzma_leg2.1.b: "Otokar Arma XC-8 120mm"
 tur_ynzma_leg2.1.c: "BMC Altuğ Hitfact 120mm"
 tur_ynzma_leg2.2.name: "YNZMA Leg 2: Cannon"
 tur_ynzma_leg2.2.desc: "§WThe cannon decides what the light tank can fight. §LAselsan§!, our leading defence electronics house, has offered a stabilised fire control system for either gun, and the manufacturer will integrate it with the turret.\n\nA §Y105mm§! cannon §Gis proven§!, §Glighter§! and §Ginexpensive§!, but §Rstruggles against modern main battle tanks§!. A §Y120mm§! cannon §Gis far more lethal§! and §Gcan defeat heavily armoured targets§!, but §Rcosts more§! and §Rputs more strain on the light hull§!.§!"
 tur_ynzma_leg2.2.a: "105mm cannon"
 tur_ynzma_leg2.2.b: "120mm cannon"
 tur_ynzma_leg2.3.name: "YNZMA Leg 2: Engine"
 tur_ynzma_leg2.3.desc: "§WThe heavy gun, armour and electronics add weight to the hull, and the engine must carry it across rough terrain. The manufacturer has offered two powertrains.\n\nA §Ydiesel engine§! §Gis proven§!, §Gcheap§! and §Gkeeps the logistics chain unchanged§!, but §Ruses more fuel§! and §Ris louder§!. A §Yhybrid engine§! §Gimproves efficiency§! and §Gallows quiet running§!, but §Rcosts more§! and §Ris more complex to maintain§!.§!"
 tur_ynzma_leg2.3.a: "Diesel engine"
 tur_ynzma_leg2.3.b: "Hybrid engine"
 tur_ynzma_leg2.4.name: "YNZMA Leg 2: Turret"
 tur_ynzma_leg2.4.desc: "§WThe turret decides how the crew fights and how well it survives. §LAselsan§! has offered modern sights and fire control for either layout, while the manufacturer handles integration with the hull.\n\nA §Ymanned turret§! §Gis proven§! and §Gcheap§!, but §Rleaves the crew exposed to turret damage§!. An §Yunmanned turret§! §Gkeeps the entire crew protected in the hull§! and §Gallows a lower silhouette§!, but §Ris costly§! and §Rcomplex to integrate§!.§!"
 tur_ynzma_leg2.4.a: "Manned turret"
 tur_ynzma_leg2.4.b: "Unmanned turret"
 tur_ynzma_leg2.5.name: "YNZMA Leg 2: Design Delivered"
 tur_ynzma_leg2.5.desc: "§WAfter months of joint work, the manufacturer and §LAselsan§! have delivered the final design of the §YYNZMA§! light tank. The first vehicles are ready to join the armoured units of the Land Forces.§!"
 tur_ynzma_leg2.5.a: "Excellent."
