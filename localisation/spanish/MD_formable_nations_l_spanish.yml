 SCA_form_category: "Unir al Pueblo Nórdico"
 SCA_form_category_desc: "El Pueblo Nórdico ha compartido muchas naciones antes: El Imperio Sueco, la Unión de Kalmar y otras. Unificar este grupo de personas con historias vibrantes y ricas, culturas únicas y diferentes idiomas representará un desafío para aquellos que se atrevan a lograr esta hazaña."
