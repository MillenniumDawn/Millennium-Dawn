l_english:
 #events
 DRC.0.t: "Laurent-Désiré Kabila Assassinated!"
 DRC.0.d: "Our leader and liberator Laurent-Désiré was attacked today in the presidential palace, his bad standing with the military and attempts to purge disloyal Kadogos have evidently met with a terrible failure, we attempted to rush him to Harare for urgent medical care, but it was too late, our liberator lays dead.\n\nWe have since found and had the perpetrator Rashidi Kasereka executed for his crimes."
 DRC.0.a: "A Dark Day."
 DRC.1.t: "The Rebellion Reaches the River"
 DRC.1.d: "Rebel columns backed by our neighbours have crossed the Kivus and are pressing west faster than our army can fall back. Half the country answers to men we cannot name. Our allies advise us to talk before there is nothing left to bargain with."
 DRC.1.a: "Open a channel to the rebels"
 DRC.1.b: "We will not negotiate with invaders"
 DRC.2.t: "Cleaning Out the Officer Corps"
 DRC.2.d: "Another round of ghost soldiers has been struck from the payroll and the officers who invented them have been retired. The army is still far from professional, but the worst of the rot is being cut away."
 DRC.2.a: "Keep at it"
 DRC.3.t: "War in the Congo"
 DRC.3.d: "Kinshasa has asked for help, and so have the men marching on it. Whichever side we choose, the fighting in the Congo will draw in half the continent before it is finished."
 DRC.3.a: "Commit forces to the Congo"
 DRC.3.b: "This is not our war"

 #tooltips
 DRC_underdog_negotiate_tt: "§YOur backers will press us toward the negotiating table.§!"
 DRC_corrupt_military_tt: "§GThe officer corps slowly improves.§!"
 DRC_cannot_train_tt: "§RCommitted abroad:§! our best units are far from home and cannot be brought back quickly."

 #ideas
 DRC_great_african_war: "The Great African War"
 DRC_great_african_war_desc: "Eight national armies and a dozen militias are fighting across our territory. The country bleeds people faster than it can feed them, but a nation under invasion does not argue about conscription."
 DRC_corrupt_military: "Rotten Officer Corps"
 DRC_corrupt_military_desc: "Commanders draw pay for soldiers who do not exist and sell the rest their own ammunition. Almost nothing ordered from Kinshasa survives contact with the chain of command."
 DRC_corrupt_military_1: "Corrupt Officer Corps"
 DRC_corrupt_military_1_desc: "The worst of the ghost payrolls have been cleared out and a few generals have been retired. The army still runs on private arrangements, but orders now reach the men they are meant for."
 DRC_corrupt_military_2: "Unreliable Officer Corps"
 DRC_corrupt_military_2_desc: "Pay arrives, mostly on time, and units are close to the strength they report. What remains is habit rather than theft, and habit can be trained out."
 DRC_stretched_too_thin: "Stretched Too Thin"
 DRC_stretched_too_thin_desc: "Our best formations are deployed hundreds of kilometres beyond the border, tied to supply lines we do not control. Bringing them home would mean giving up everything they were sent to hold."
 DRC_intervention_forces: "Intervention Forces"
 DRC_intervention_forces_desc: "Our troops are committed to the fighting in the Congo. The deployment is public, expected, and no longer costs us anything diplomatically."

 #decisions
 great_african_war_category: "The Great African War"
 gaw_mediate_peace: "Mediate a Ceasefire"
 gaw_mediate_peace_desc: "Offer our good offices to the warring parties. Someone has to get them into the same room, and it may as well be us."
 gaw_support_government: "Back Kinshasa"
 gaw_support_government_desc: "Recognise the government in Kinshasa as the legitimate authority in the Congo and align ourselves with its war effort."
 gaw_kinshasa_intervention_force: "Send Troops to Kinshasa"
 gaw_kinshasa_intervention_force_desc: "Commit an expeditionary force to hold the capital and the western approaches for the government."
 gaw_kinshasa_aid: "Supply Kinshasa"
 gaw_kinshasa_aid_desc: "Ship arms, fuel and money to the government. Cheaper than sending men, and harder to be blamed for."
 gaw_denounce_government: "Denounce Kinshasa"
 gaw_denounce_government_desc: "Declare the government in Kinshasa illegitimate and side with the movements fighting it."
 gaw_kigali_intervention_force: "Send Troops via Kigali"
 gaw_kigali_intervention_force_desc: "Move an expeditionary force through Rwanda to support the rebellion in the east."
 gaw_kigali_aid: "Supply Kigali"
 gaw_kigali_aid_desc: "Route arms and money to Rwanda and the movements it backs across the Kivus."
 gaw_kampala_intervention_force: "Send Troops via Kampala"
 gaw_kampala_intervention_force_desc: "Move an expeditionary force through Uganda to support the rebellion in the north."
 gaw_kampala_aid: "Supply Kampala"
 gaw_kampala_aid_desc: "Route arms and money to Uganda and the movements it backs in Orientale and Équateur."
