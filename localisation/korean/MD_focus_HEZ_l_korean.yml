 hezbollah_events.39.t: "루슈디의 죽음"
 hezbollah_events.39.d: "소설 \\"악마의 시\\"의 저자 살만 루슈디가 흉기로 무장한 젊은 무슬림 남성의 공격을 받은 끝에 사망했습니다. 범인이 칼로 루슈디의 몸을 여러 차례 찌르고 심장에 칼을 꽂아 순식간에 즉사시킨 것으로 보도되었습니다. \n범인은 수배 중이며 도주 중입니다. 공격자의 신원은 아직 미국 당국에 확인되지 않았습니다. 암살은 루슈디도 참석한 미국 내 한 회의장에서 발생했다고 합니다. \n일부 언론사는 이란, 심지어 헤즈볼라가 후원하는 세력이 루슈디의 죽음의 원인이었다고 주장합니다. \n그러나 범인이 시아파 민병대 단체의 일원이었는지 여부에 대한 강력한 증거는 없습니다. 많은 무슬림 기관과 단체, 특히 시아파 단체들은 범인을 칭송하며 포상을 제안했습니다. 동시에 이슬람 세계 곳곳의 많은 사람들이 \\"현대의\\" 사탄의 죽음을 축하하고 있습니다. \n수십 년 전 이란 이슬람 공화국의 전임 지도자 아야톨라 루홀라 호메이니는 루슈디의 \\"신성모독적\\" 행위를 이유로 그의 죽음을 요구했으며 루슈디의 죽음을 모든 무슬림의 의무로 여겼습니다. \n그리고 이제 그의 요구가 이루어진 듯합니다."
 hezbollah_events.39.a: "그가 이걸 예상 못했다고... 진짜?"
 hezbollah_events.39.b: "마침내, 정의가 실현되었구나."
 hezbollah_events.38.t: "루슈디 암살 실패!"
 hezbollah_events.38.d: "오늘 \\"악마의 시\\"의 저자 살만 루슈디가 마련한 연설 도중, 그는 흉기로 무장한 젊은 무슬림 남성의 공격을 받아 중상을 입었습니다. 공격자는 그의 허벅지와 간 부위를 여러 차례 찔렀습니다. 공격자는 한동안 도주했으나 루슈디가 연설에 참석하려던 장소 가까운 곳에서 붙잡혔습니다. 일부 언론사는 이란과 헤즈볼라가 이 공격의 배후에 있다고 주장하지만, 범인과 이란 및 헤즈볼라의 연관성에 대한 실질적인 증거는 없습니다. 루슈디는 여전히 살아 있는 것으로 보이지만, 이 공격 이전만큼 건강하고 안전할 수는 없을 것입니다. \n수십 년 전 이란 이슬람 공화국의 전임 지도자 아야톨라 루홀라 호메이니는 루슈디의 \\"신성모독적\\" 행위를 이유로 그의 죽음을 요구했으며 루슈디의 죽음을 모든 무슬림의 의무로 여겼습니다. \n이 임무는 아직 완수되지 않았지만, 이번 공격은 호메이니의 유산이 여전히 살아 있음을 보여줍니다."
 hezbollah_events.38.a: "그가 이걸 예상 못했다고... 진짜?"
 hezbollah_events.38.b: "Damn"
 hezbollah_events.4.t: "리야드를 향한 헤즈볼라의 탄도미사일 공격"
 hezbollah_events.4.d: "지난 자정, 사우디아라비아의 수도 리야드에서 거대한 폭발음이 들렸습니다. 목격자들은 이 폭발음이 미사일 공격에 의한 것이라고 말하며, 이 미사일들이 주로 도시의 상업 및 국제 지구에 떨어졌다고 합니다. \n사우디아라비아 정부 역시 이 공격을 확인하고 레바논의 시아파 이슬람주의 조직인 헤즈볼라를 이번 공격의 배후로 지목했습니다. 동시에 사우디 정부는 리야드의 사상자 및 물적 피해에 대한 구체적 통계 제공을 삼가고 있습니다. \n예멘 내 시아파의 영향력 증가와 예멘에서 시아파 무장 단체(예멘 후티로 알려진)의 결성 및 동원을 고려할 때, 이번 공격이 원래 이들 단체에서 비롯되었으며 헤즈볼라가 실제로는 간접적으로 개입했을 가능성이 있습니다. \n아라비아 반도, 특히 예멘에서 내전의 가능성이 시시각각 높아지고 있는 시점에, 이 중요한 사건은 다가오는 내전에서 사우디아라비아와 저항 축의 개입에 큰 영향을 미칠 수 있습니다."
 hezbollah_events.4.a: "충격적이군!"
 hezbollah_events.5.t: "이라크의 우리 기지를 공격하기 위한 운동을 시작한 헤즈볼라!"
 hezbollah_events.5.d: "오늘 충격적인 소식을 들었습니다! 이란과 헤즈볼라가 이라크 전역에서 우리 주둔군과 군사 기지를 공격하는 전국적 캠페인을 조직했습니다! 수천 명의 시아파 이라크 민간인이 이란-헤즈볼라제 무기로 무장하고 우리 병사들을 공격해 죽이거나... 우리 기지를 파괴하고 있습니다... 우리는 이 재앙을 막기 위해 아무것도 할 수 없습니다. \n그럼에도 불구하고 우리에게는 헤즈볼라와 \\"저항 축\\"에 어떤 식으로든 타격을 줄 수 있는 나름의 선택지가 있습니다..."
 hezbollah_events.5.o1: "텔아비브에 당장 연락해라..."
 hezbollah_events.5.o2: "우리 스스로 해결할 것이다."
 hezbollah_events.5.o3: "이른바 \\"저항\\"에 더 많은 제재를!"
 hezbollah_events.5.o4: "오 이런.."
 hezbollah_events.2.t: "원조를 요청하는 헤즈볼라"
 hezbollah_events.2.d: "레바논 총선이 다가오면서, 지역 전체에서 우리의 가장 중요한 동맹인 헤즈볼라가 레바논에서 \\"저항\\"의 권력을 확보하기 위해 다가오는 선거 자금을 우리에게 요청하고 있습니다. 헤즈볼라의 대의를 돕는 방법으로는 선거 운동에 대한 재정 지원이나 선거에 대한 정치적 지지 등 여러 대안이 있습니다. 어쨌든 그들의 요구를 거절하지 않는 것이 좋습니다. 결국 베이루트의 우리 형제들을 정말로 실망시킬 수 있기 때문입니다..."
 hezbollah_events.2.o1: "정치 및 경제적 지원을 제공해라, 우리는 형제를 내버려둘 수 없다."
 hezbollah_events.2.o2: "정치적 지지를 제공하자, 우리 전문가들이 그들을 도와줄 것이다."
 hezbollah_events.2.o3: "경제적 지원을 제공해라. 선거에서 승리하는 방법은 알고 있겠지."
 hezbollah_events.2.o4: "미안한데, 지금 뭐라고 했나?"
 hezbollah_events.1: "레바논 정부군 (LAF)으로부터의 망명자"
 hezbollah_events.1.t: "레바논 정부군 (LAF)으로부터의 망명자"
 hezbollah_events.1.d: "총력을 다해 레바논군에 침투한 끝에 우리는 얻을 수 있는 최고의 지지를 확보했습니다. 우리는 베이루트의 거짓 정부에 맞서 경쟁 세력을 형성하거나 심지어 전쟁을 선포하는 데 가까워지고 있습니다. \n우리는 베이루트의 주민들이 서방의 꼭두각시들에 맞서 시위와 폭동을 일으키도록 설득할 것입니다. 베이루트 해방 이후에는 시온주의 야수에 맞선 작전도 시작하기를 바랍니다. \n레바논 이슬람 저항 지도자(하산 나스랄라)께 경의를 표하며, 베이루트 주둔 헤즈볼라군 사령관 이마드 무그니예."
 hezbollah_events.1.o1: "시간이 다시 흐르기 시작한다..."
 hezbollah_events.3: "도움을 요청하는 헤즈볼라"
 hezbollah_events.3.t: "도움을 요청하는 헤즈볼라"
 hezbollah_events.3.d: "우리는 처음으로 레바논에서 활동하는 시아파 준군사 조직인 헤즈볼라로부터 매우 이상한 외교 서한을 받았습니다. 서한은 레바논 남부의 \\"국제 협력 및 소통 증대\\"에 관한 것이며, 이른바 \\"협력의 기회\\"를 위해 우리로부터 얻을 수 있는 모든 종류의 자금을 요청하고 있습니다. 이는 매우 중동적인 나라에 투자하고 수익을 거둘 기회가 될 수 있지만, 그럼에도 헤즈볼라는 어떤 면에서는 매우... 건전하지 못한 조직일 수도 있습니다. 어쨌든 그들의 서한에 어떻게 대응해야 하겠습니까?"
 hezbollah_events.3.o1: "거부한다"
 hezbollah_events.3.o2: "장비"
 hezbollah_events.3.o3: "경제적 지원"
 hezbollah_events.3.o4: "투자"
 hezbollah_events.23.t: "박해받는 유대인 소수자들!"
 hezbollah_events.23.d: "유대인 소수 집단이 이제 우리나라에서 안전하지 않습니다! 최근 며칠간 상당수의 유대인 소수자들에게 여러 건의 수상한 사고가 발생했습니다. 일부 보고서는 이 사고들로 유대인 공동체의 중요 인사 몇 명이 살해되었다고 밝히고 있습니다! 미국 동맹국들은 시아파 테러 조직이 배후에 있다고 알려왔는데, 어떻게 해야 합니까?! "
 hezbollah_events.23.o1: "빨리 진정 시켜라, 젠장!"
 hezbollah_events.24.t: "Increase in cartels' activities"
 hezbollah_events.24.d: "테러 조직이 전국에서 활동하는 카르텔에 자금을 대고 있다는 소문이 돈 최근 며칠간 대규모 습격과 암시장 총기 구매가 발생하고 있다는 보고를 받았습니다. 야만인들이 우리나라를 혼돈에 빠뜨리고 있습니다!"
 hezbollah_events.24.o1: "무슨 수를 써서라도 그들을 막아라."
 hezbollah_events.25.t: "라틴의 마약 카르텔을 통해 국경에서 미국을 혼란에 빠트리는 헤즈볼라와 이란"
 hezbollah_events.25.d: "FBI와 DEA로부터 멕시코 국경을 통한 마약 선적량이 늘어났다는 보고를 받았습니다. 그리고 일부 \\"특정\\" 마약 선적을 추적하는 것은 매우 어렵습니다. 이 마약 선적을 추적하지 못하는 우리의 실패가 국민에게 영향을 미치고 있는 것으로 보입니다. 동시에 최근 몇 달간 남아메리카 대륙 전역에서 라틴 아메리카 카르텔의 활동이 증가했다는 다양한 보고가 있었습니다. 또한 우리 정보기관은 헤즈볼라와 이란이 카르텔에 자금을 대고 있으며, 미국을 불안정하게 만들기 위해 라틴 아메리카에 새로운 작전 기지도 구축하고 있다고 밝혔습니다. \n그리고 그들은 성공한 것으로 보입니다."
 hezbollah_events.25.o1: "How?"
 hezbollah_events.26.t: "이라크의 우리 기지를 공격한 헤즈볼라!"
 hezbollah_events.26.d: "이라크 주둔 중부사령부 병력으로부터 보고를 받았습니다. 헤즈볼라가 지원하는 시아파 세력이 이라크의 우리 기지 중 한 곳을 공격했습니다! 사상자는 많지 않았지만 우리 병력 일부를 죽이거나 중상을 입힐 수 있었으며, 이 재난이 언론에 공개되지는 않겠지만 우리는 보복 조치를 취해야 합니다."
 hezbollah_events.26.o1: "테러리스트에게는 죽음을! 그들 기지를 공격해라!"
 hezbollah_events.26.o2: "저 멍청한 놈들은 상관할 바가 아니다."
 hezbollah_events.27.t: "이라크에서의 시아파 운동"
 hezbollah_events.27.d: "오늘 이란-레바논이 지원하는 시아파 민병대의 대규모 캠페인이 이라크 전역에서 시작되었습니다. 이 민병대 단체들은 이라크에 주둔 중인 미국 주둔군을 공격하기 시작했으며 전국의 여러 미군 기지도 공격했습니다. \n미국은 자국 측의 사상자와 물적 손실에 대해 공식 성명을 내지 않았지만, 많은 시아파 단체는 자신들 쪽에도 손실이 있었으나 \\"제국주의\\" 미군에 큰 \\"피해\\"를 입힐 수 있었다고 주장합니다. \n대규모 공격은 앞으로 며칠 안에 끝날 것으로 보이지만, 공격자들이 이라크에 주둔 중인 미군에 대한 습격을 멈출 것으로는 예상되지 않습니다. \n이라크가 스스로의 잿더미 속에서 불타는 동안, 얼마나 많은 나라가 그 고통에 영향을 받게 될지 지켜보게 될 것입니다."
 hezbollah_events.40.t: "시아파 레바논의 통일"
 hezbollah_events.40.d: "오늘 레바논 중앙정부와 헤즈볼라가 공동으로 발표하여, 단일 \\"이슬람 공화국\\"이 수립되었습니다. 이로써 헤즈볼라는 레바논 전역에서 기지와 병력을 확장할 수 있게 되었습니다. \n헤즈볼라의 지도자 하산 나스랄라는 이번 사건을 \\"저항의 깃발 아래 이루어진 레바논의 영광스러운 통합\\"이라고 선언했습니다. 새로운 이슬람 공화국의 수립이 발표된 뒤 수많은 지지자들이 레바논 도시의 거리로 모여들었습니다. \n그러나 이스라엘과 미국은 이번 통합이 \\"이란과 레바논 내 그 대리 세력이 획책한 신정주의 쿠데타\\"라고 논평했습니다. \n레바논이 \\"통합\\"됨에 따라 이란과 저항의 축의 영향력은 중동과 국제 사회 모두에서 새로운 단계로 접어든 듯합니다. \n이제 레바논은 지역 전역에서 벌어지는 반미 작전 대부분을 조율하는 시아파 정부 아래 통합되었으며, 머지않아 강력하고 폭력적인 작전의 새로운 국면이 중동 전역에서 시작될 것입니다..."
 hezbollah_events.40.a: "하나의 움마에 한 걸음 더 가까워졌다."
 hezbollah_events.40.b: "흥미롭군"
 hezbollah_events.41.t: "제2차 레바논 내전"
 hezbollah_events.41.d: "며칠 전 베이루트에서 헤즈볼라와 레바논군 사이에 벌어진 마지막 습격 충돌에 이어, 오늘 헤즈볼라의 지도자 하산 나스랄라가 레바논 중앙정부에 선전포고를 함으로써 레바논은 다시금 내전의 시대로 접어들었습니다. \n나라는 혼돈에 빠졌고, 수많은 헤즈볼라 지지자들이 레바논 중앙정부에 맞선 나스랄라의 투쟁에 가담하기 위해 봉기했으며, 베이루트의 거리는 이미 총성과 피해로 가득합니다. \n미국과 이란 이슬람 공화국을 비롯한 많은 나라가 양측에 분쟁을 평화적으로 해결할 것을 촉구했습니다. 그러나 때가 오면 이란과 미국이 중동에서 벌이는 대리전이 새로운 국면에 접어들 수도 있을 것으로 보입니다."
 hezbollah_events.41.a: "걱정되는군..."
 hezbollah_events.41.b: "우리의 챔피언을 잃지 않기만을 바랄 뿐이다..."
 hezbollah_events.42.t: "대심판"
 hezbollah_events.42.d: "After the successful campaign of Hassan Nasrallah in his Homeland, it was obvious that he was not going to stop his aggressive actions in the Middle East. Now after raiding and securing intelligence from Israel's Defense Forces and supplies from the Israeli border patrols during the recent months, it seems that Hezbollah is now declaring a \"Great Trial\" against the \"Zionist Menace\". \nWith Hezbollah officially declaring war on Israel and Iran joining the war too, the situation is becoming very chaotic and tense throughout the region. \nWith more death and suffering coming to the Middle East, Nasrallah seems to be right about one thing, this war, is truly a great trial. For it is the endgame of the \"Resistance\", or end of the State of Israel."
 hezbollah_events.42.a: "정말 끔찍하군!"
 hezbollah_events.42.b: "종말의 시작이군."
 hezbollah_events.27.a: "The War on Terror just made America a Terrorist country..."
 hezbollah_events.27.b: "우리가 어떻게 해야할지 잘 알지."
 hezbollah_events.28.t: "'진실된 약속'"
 hezbollah_events.28.d: "Since the Zionist and Axis of Resistance's indirect agreement for exchanging prisoners between both sides in 2004, 3 major Lebanese prisoners were not freed from their imprisonment and the Zionists were not completely faithful in fulfilling the agreement. Hence, our leader, Hassan Nasrallah, one of the leaders of the Resistance, said that the only way of freeing those captives is to capture more \"Zionist soldiers\". \nAnd now, we have the opportunity to fulfill the demand of our leader. We can attack a bunch of Zionist soldiers that trespassed our border. \nWe now can initiate the operation \"Truthful Promise\"."
 hezbollah_events.28.o1: "시온주의자의 위협을 없애라! 그들을 공격해라!"
 hezbollah_events.28.o2: "아마도 그건 진짜 '진실된' 것이 아닐지도 모른다..."
 hezbollah_events.29.t: "The Terrorists Have Attacked Our Soldiers near Lebanon!"
 hezbollah_events.29.d: "몇 시간 전, 테러 조직 \\"헤즈볼라\\"가 레바논 국경 일대를 순찰하던 이스라엘 방위군 병력 일부를 공격했습니다. 그들의 지도자 하산 나스랄라는 이번 \\"작전\\"이 2004년 포로 교환 합의에서 우리가 보인 \\"불성실\\"에 대한 보복이었다고 말했습니다. \n그 광신도들이 국경 인근의 우리 병력을 공격하기로 한 것은 분명 망상에 불과했습니다. 우리는 훈련도 제대로 받지 못한 이 광신도들에게 맹렬히 대응할 수 있으며, 며칠 안에 그들을 괴멸시킬 수 있습니다. 그럼에도 헤즈볼라가 벌인 행동에는 여전히 우려되는 점이 있습니다... "
 hezbollah_events.29.o1: "또 6일 전쟁을 원하나? 좋을 대로!"
 hezbollah_events.29.o2: "매우 걱정되는군..."
 hezbollah_events.30.t: "우리가 승리했다!"
 hezbollah_events.30.o1: "저항 추축국."
 hezbollah_events.31.t: "패배!"
 hezbollah_events.31.o1: "모든게 끝났다..."
 hezbollah_events.32.t: "The End of Hezbollah?"
 hezbollah_events.32.d: "헤즈볼라가 티레와 남부 레바논을 잃었습니다! 시오니스트들이 이제 레바논 국경을 넘어 골란 고원처럼 남부 레바논을 점령하고 있습니다! 조직은 혼란에 빠졌으며 우리는 사태를 진정시켜야 합니다! 이 \\"유대\\" 국가의 조롱을 끝낼 때가 왔습니다. 지금 행동하지 않으면 영영 기회가 없습니다!"
 hezbollah_events.32.o1: "We have to break the gate of Khaybar once again. DEATH TO ISRAEL!"
 hezbollah_events.32.o2: "Unfortunate"
 hezbollah_events.33.t: "A Strange Outcome..."
 hezbollah_events.33.d: "그 누구도 이 참혹한 전쟁에서 어떻게든 공격하거나 방어하지 못하였습니다.\n매우 뜻밖의 결과인듯 한데, 그렇지 않습니까?"
 hezbollah_events.33.o1: "I see..."
 hezbollah_events.35.t: "흥미로운 제안"
 hezbollah_events.35.d: "시오니스트 군대가 우리 병력에 패배한 뒤, 우리 군 지휘관 일부가 매우 야심차지만 어쩌면 합리적일 수도 있는 계획을 제안했습니다. 그들의 견해에 따르면, 레바논 내전 이후 시오니스트 공격군이 얼마나 약해지고 조직이 무너졌는지 우리는 목격했으며, 이에 따라 거짓된 시오니스트 국가를 끝장내기 위한 전면 침공을 제안하고 있습니다. 물론 그들은 우리 단독으로 그러한 군사 작전을 시작하자고 제안하는 것이 아닙니다... 우리는 시리아와 이란 형제들에게도 해방 전쟁에 참여할 것을 요청할 수 있습니다. 그리고 그들은 분명 이처럼 야심찬 제안도 받아들일 것입니다..."
 hezbollah_events.35.o1: "쿠드스군! 우리가 간다!"
 hezbollah_events.35.o2: "정신나간 생각이군."
 hezbollah_events.36.t: "헤즈볼라에서의 제안"
 hezbollah_events.36.d: "우리는 전략적 동맹이자 파트너인 헤즈볼라로부터 흥미로운 제안을 받았습니다. 나스랄라는 시오니스트 국가에 대한 \\"최후\\"의 공격을 감행하자고 제안했습니다. 그 \\"최후\\" 공격의 근거는 33일 전쟁에 대한 여러 관찰 결과, 시오니스트 군대가 전술과 병참 양면에서 완전히 조직이 무너져 있었다는 것입니다. \n어쨌든 우리는 그들의 제안을 수락할 수도, 거절할 수도 있습니다. ?"
 hezbollah_events.36.o1: "이제 그 뱀을 참수시킬 때가 왔다..."
 hezbollah_events.36.o2: "\"뭐라고\"?"
 hezbollah_events.37.t: "2차 레바논 내전"
 hezbollah_events.37.d: "어젯밤 레바논 국민들은 이스라엘 전투기와 포격 소리에 잠에서 깼습니다. 오늘 이스라엘 방위군은 레바논 거리에서 헤즈볼라 병력과 충돌하고 있습니다. \n\n이스라엘의 주장에 따르면 이번 침공의 목적은 주로 최근 이스라엘 방위군 병력에 대한 헤즈볼라의 공격에 대한 대응이며, 이스라엘이라는 국가의 존립 자체를 위협하는 정권에 질서를 가져오기 위한 것입니다. \n\n반면 헤즈볼라 사무총장 하산 나스랄라는 이스라엘 방위군 병력 일부를 생포한 것은 협상 중 이스라엘이 포로 교환을 이행하지 않은 것과 2000년 이래 레바논 민간인을 불법적으로 억류한 것에 대한 보복이라고 밝혔습니다. 레반트는 현재 다시 한번 분쟁 상태에 놓여 있습니다."
 hezbollah_events.37.a: "대가를 치를 것이다."
 hezbollah_events.37.b: "이 테러리스트들에게 한수 가르쳐줄 시간이군!"
 hezbollah_events.37.c: "Lebanon burns."
