 tgp_recon_4: "최첨단 표적 지정 포드"
 tgp_recon_4_desc: "센서 융합, 데이터링크 및 기타 능력은 항공기에 표적 지정 포드를 장착하는 것을 기체의 주요 전력 승수로 만듭니다."
