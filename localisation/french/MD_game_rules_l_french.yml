 MD_AI_RULES: "Options de l'I.A."
 MD_PEACE_DEALS: "Conférences de paix"
 MD_FOCUS_TREE_RULES: "Options des priorités nationales"
 MD_FORMABLE_RULES: "Drapeaux et nations formables"
 MD_ORGANISATION_RULES: "Options des organisations"
 MD_INFLUENCE_RULES: "Options du système d'influence"
 MD_OPTIMISATION_RULES: "Optimisation et performances"
 MD_NUCLEAR_RULES: "Règles nucléaires"
 MD_RULES: "Miscellaneous Rules"
 MD_CHEAT_RULES: "Options de triche"
 MD_RANDOM_RULES: "Règles de randomisation"
 RULE_HARD_AI_ECONOMIC: "Économie de l'I.A."
 RULE_DISABLE_HARD_AI_ECONOMIC: "Restriction standard"
 RULE_DISABLE_HARD_AI_ECONOMIC_DESC: "Une restriction standard pour l'IA, qui ne lui permet pas de renforcer son économie. Pour un jeu historique."
 RULE_ENABLE_HARD_AI_ECONOMIC: "Aucune restriction"
 RULE_ENABLE_HARD_AI_ECONOMIC_DESC: "Si vous vous ennuyez que dans chaque partie l'I.A. ne sorte pas de sa crise économique, ceci est fait pour vous. L'I.A. n'est plus limitée dans la prise de décisions concernant son économie. Soyez prêt à ce que de nombreux pays deviennent plus riches que les vôtres. Uniquement pour ceux qui n'ont pas peur des difficultés. Salutations de la part du développeur de Battle AI. ;)"
 RULE_DISABLE_AI_DEBT_WAR_TITLE: "Guerre de la dette pour l'I.A."
 RULE_DISABLE_AI_DEBT_WAR: "Désactiver"
 RULE_DISABLE_AI_DEBT_WAR_DESC: "Ceci désactive la fonction de guerre de la dette pour l'I.A. L'I.A. ne prendra plus l'option d'envahir un pays qui ne rembourse pas sa dette."
 RULE_ENABLE_AI_DEBT_WAR: "Activer"
 RULE_ENABLE_AI_DEBT_WAR_DESC: "Cette configuration rendra l'I.A. plus susceptible de déclarer des guerres de dettes si vous n'honorez pas votre dette envers elle."
 RULE_ENABLE_AI_FIGHTING_AUTONOMY_FOCUS: "L'IA utilisera la priorité §TAccroissement de l'autonomie§!."
 RULE_ENABLE_FIGHTING_AUTONOMY_FOCUS: "Activer"
 RULE_ENABLE_FIGHTING_AUTONOMY_FOCUS_DESC: "L'I.A. combattra votre autonomie en utilisant la priorité continue §YAccroissement de l'autonomie§!."
 RULE_DISABLE_FIGHTING_AUTONOMY_FOCUS: "Désactiver"
 RULE_DISABLE_FIGHTING_AUTONOMY_FOCUS_DESC: "L'I.A. ne combattra plus votre autonomie en utilisant la priorité continue §YAccroissement de l'autonomie§!."
 RULE_ALLOW_CHAOTIC_PEACE_CONFERENCE: "Activer les accords de paix chaotiques"
 RULE_OPTION_CHAOTIC_PC_NO: "Non"
 RULE_OPTION_CHAOTIC_PC_NO_DESC: "Cette option devrait empêcher tout le monde de s'emparer de terres lors des conférences de paix de l'I.A.\nElle permet de limiter le nombre de personnes pouvant revendiquer des États aux dirigeants et aux chefs de faction. (Cela n'affecte que l'I.A., pas le joueur)."
 RULE_OPTION_CHAOTIC_PC_YES: "Oui"
 RULE_OPTION_CHAOTIC_PC_YES_DESC: "Pour ceux qui apprécient les conférences de paix chaotoques, pourquoi limiter le monde à une §YRussie§! alors que 12 §YRussies§! peuvent exister !\n(Je ne suis pas responsable des résultats qui pourraient découler de cette option !)"
 RULE_ALLOW_PLAYER_LED_PEACE_CONFERENCE: "Activer les conférences de paix dirigées par les joueurs"
 RULE_OPTION_PLAYER_LED_PC_NO: "Non"
 RULE_OPTION_PLAYER_LED_PC_NO_DESC: "Cette option permet à l'I.A. de faire ses propres choix, aussi stupides soient-ils."
 RULE_OPTION_PLAYER_LED_PC_YES: "Oui"
 RULE_OPTION_PLAYER_LED_PC_YES_DESC: "Pour ceux qui ne font pas confiance à l'I.A. pour mettre le bâton rond dans le trou rond, cette mesure permettra uniquement aux joueurs de faire des concessions lors des conférences de paix."
 RULE_SALAFIST_BRANCH: "Activer la branche salafiste"
 RULE_YES_SALAFIST_BRANCH_DESC: "Active la branche salafiste dans l'arbre générique pour toutes les nations, quelle que soit la religion de départ."
 RULE_NO_SALAFIST_BRANCH_DESC: "Active la branche salafiste dans l'arbre générique pour les nations qui suivent n'importe quelle variante de l'islam."
 LIC_AI_BEHAVIOR: "@LIC Liechtenstein"
 SOO_AI_BEHAVIOR: "@SOO Ossétie du Sud"
 CUB_AI_BEHAVIOR: "@CUB Cuba"
 RULE_OPTION_PUTIN: "Russie unie"
 RULE_OPTION_PEACEFUL_REFORM: "Russie libérale"
 RULE_OPTION_THE_RED_MENACE: "La menace rouge"
 RULE_OPTION_RISE_OF_RUSSIA: "La Russie de Jirinovski"
 RULE_OPTION_NAZBOL_RUSSIA: "Russie nationale bolchévique"
 RULE_OPTION_IRON_DIMON_RUSSIA: "Dimon de fer"
 RULE_OPTION_LIBERAL_DIMON_RUSSIA: "Dimon libéral"
 RULE_OPTION_OLIGARCHS_RUSSIA: "Russie oligarchique"
 RULE_OPTION_DEMOCRAT: "Penchant démocrate"
 RULE_OPTION_DEMOCRAT_AI_DESC: "Les États-Unis chercheront à élire les dirigeants du parti démocrate et à maintenir la nation, dans un sens moderne, vers un consensus de centre-gauche pour gouverner la nation."
 RULE_OPTION_REPUBLICAN: "Penchant républicain"
 RULE_OPTION_REPUBLICAN_AI_DESC: "Les États-Unis chercheront à élire les dirigeants du parti républicain et à maintenir la nation, dans un sens moderne, vers un consensus de centre-droit pour gouverner la nation."
 RULE_OPTION_REFORMED_REPUBLIC: "République réformée"
 RULE_OPTION_REFORMED_REPUBLIC_AI_DESC: "La volonté du peuple a été entendue. La pression politique et le tollé général ont abouti à des réformes politiques et économiques essentielles pour permettre une meilleure représentation et une plus grande visibilité des tiers partis. Il appartient désormais aux citoyens d'élire un parti qui les représente."
 RULE_OPTION_POST_UNITED: "Après l’ère unie"
 RULE_OPTION_POST_UNITED_AI_DESC: "L'aigle tombe plus bas que terre. §RNe pas activer l'I.A. historique§!"
 FIJ_AI_BEHAVIOR: "@FIJ Fiji"
 NIG_AI_BEHAVIOR: "@NIG République fédérale du Nigéria"
 RULE_OPTION_RISE_OF_BOKO_HARAM: "L'essor de Boko Haram"
 RULE_OPTION_RISE_OF_BOKO_HARAM_AI_DESC: "Fait pression sur le Nigéria pour que Boko Haram prenne le contrôle du pays."
 RULE_OPTION_PDP_EMPOWERED: "Parti démocratique populaire"
 RULE_OPTION_PDP_EMPOWERED_AI_DESC: "Le Parti démocratique du peuple est l'un des plus grands partis du Nigeria. Il défend principalement la partie chrétienne du spectre religieux et les idéologies non alignées."
 RULE_OPTION_ANPP_EMPOWERED: "All Nigeria's People Party"
 RULE_OPTION_ANPP_EMPOWERED_AI_DESC: "Le All Nigeria's People Party (ou Congrès démocratique progressiste en 2017) est le principal parti d'opposition en 2000 au Nigeria. Il est important de noter qu’ils ressemblent beaucoup à la social-démocratie en Europe et qu’ils poussent à des réformes majeures au Nigeria."
 FRA_AI_BEHAVIOR_MD: "@FRA France"
 RULE_OPTION_FRA_HISTORICAL: "Historical"
 RULE_OPTION_FRA_HISTORICAL_DESC: "The Fifth Republic holds its course as the presidency passes from Chirac to Sarkozy, then Hollande and Macron, with the §8Republicans§! and the centre trading office between them. France anchors European integration and keeps its hand on the Françafrique sphere."
 ITA_AI_BEHAVIOR_MD: "@ITA Italy"
 ROC_AI_BEHAVIOR: "@TAI République de Chine"
 RULE_OPTION_TAI_PROJECT_NATIONAL_GLORY: "Projet Gloire Nationale"
 RULE_OPTION_TAI_PROJECT_NATIONAL_GLORY_AI_DESC: "Conformément à l'héritage du défunt président Chiang Kai-shek, nous contre-attaquerons le continent et unifierons la Chine."
 RULE_OPTION_TAI_UNITE_CHANNEL: "Unification du détroit de Taiwan"
 RULE_OPTION_TAI_UNITE_CHANNEL_AI_DESC: "Les deux rives du détroit de Taiwan ne peuvent pas rester éternellement divisées et progresseront certainement vers la réunification sous le même système."
 RULE_OPTION_TAI_STATUS_QUO: "Maintenir le statu quo"
 RULE_OPTION_TAI_STATUS_QUO_AI_DESC: "Pas d'unification, pas d'indépendance, pas de combat."
 RULE_OPTION_TAI_ROAD_TO_SPLIT: "Rêve de Taïwan"
 RULE_OPTION_TAI_ROAD_TO_SPLIT_AI_DESC: "Les deux rives du détroit de Taiwan sont gouvernées séparément et ne sont pas subordonnées l'une à l'autre. Qu'est-ce que la République de Chine?"
 BRM_AI_BEHAVIOR: "@BRM Union du Myanmar"
 RULE_OPTION_BEACON_OF_DEMOCRACY: "Pilier de la démocratie"
 RULE_OPTION_BEACON_OF_DEMOCRACY_AI_DESC: "Le Myanmar poursuivra ses réformes sans compromis, propulsant rapidement la NLD au pouvoir. Au lieu de faire des concessions à la Tatmadaw, le Myanmar mobilisera divers partisans de la libéralisation politique, y compris des groupes ethniques rebelles, dans le but de mettre fin une fois pour toutes à l'influence de l'armée sur la politique."
 RULE_OPTION_AN_IRON_FIST: "Une poigne de fer"
 RULE_OPTION_AN_IRON_FIST_AI_DESC: "Uniquement applicable à l’année 2000, cette règle du jeu obligera le Myanmar à rester une dictature et, au lieu de répondre positivement aux pressions en faveur de réformes comme il l’a fait historiquement, à réagir par la répression et le totalitarisme. De plus, afin de détourner l'attention de sa perte de légitimité, le gouvernement militaire poursuivra la guerre non seulement contre les groupes rebelles du pays mais aussi contre ses voisins."
 RULE_OPTION_NORTHERN_AMBITION: "Ambition nordique"
 RULE_OPTION_NORTHERN_AMBITION_AI_DESC: "The Swedish far-right will see a surge in popularity, culminating in an attempt to establish a Swedish Empire in Northern Europe."
 SYR_AI_BEHAVIOR: "@SYR République arabe syrienne"
 RULE_OPTION_SYR_HISTORICAL: "IA historique"
 RULE_OPTION_SYR_HISTORICAL_DESC: "Hafez el-Assad sera remplacé par son fils aîné Bachar el-Assad. Bashar maintiendra la Syrie comme un pays aligné sur la Russie, avec une approche équilibrée de la diplomatie, de l'armée et de l'économie."
 RULE_OPTION_SYR_IRON_LADY: "La Dame de fer de Syrie"
 RULE_OPTION_SYR_IRON_LADY_DESC: "Hafez el-Assad sera remplacé par sa fille Bouchra el-Assad. Bouchra adoptera une approche plus neutre entre les grandes puissances, en mettant l'accent sur la diplomatie et l'économie."
 RULE_OPTION_SYR_SYRIAN_SAVAGE: "Sauveur syrien"
 RULE_OPTION_SYR_SYRIAN_SAVAGE_DESC: "Hafez el-Assad sera remplacé par son fils cadet, Maher el-Assad. Maher tentera de former la Grande Syrie et de se tailler une nouvelle place au Moyen-Orient. Il se concentrera sur l'expansion militaire et économique."
 RULE_OPTION_SYR_NEW_ASSAD: "Le nouveau el-Assad"
 RULE_OPTION_SYR_NEW_ASSAD_DESC: "Hafez el-Assad sera remplacé par son frère Rifaat el-Assad après le Printemps de Damas. Rifaat se concentrera sur une politique pro-saoudienne en mettant l'accent sur la diplomatie et l'économie."
 RULE_OPTION_SYR_DAMASCUS_SPRING: "Le printemps de Damas"
 RULE_OPTION_SYR_DAMASCUS_SPRING_DESC: "La Syrie sera dépassée par le mouvement du Printemps de Damas et transformée en démocratie."
 BHR_AI_BEHAVIOR: "@BHR Bahreïn"
 SAU_AI_BEHAVIOR: "@SAU Royaume d'Arabie Saoudite"
 RULE_OPTION_GLOBAL_JIHAD_GCC_FIRST: "Djihad mondial - Le CCG d'abord"
 RULE_OPTION_GLOBAL_JIHAD_GCC_FIRST_AI_DESC: "L’Arabie Saoudite tentera de réformer son économie et d’unifier le CCG en tant que super-État. Ensuite, la monarchie saoudienne sera renversée par un soulèvement d’Al-Qaïda, conduisant à la création d’un État islamique radical qui cherche à propager son idéologie fondamentaliste par des moyens violents."
 RULE_OPTION_GLOBAL_JIHAD: "Djihad mondial"
 RULE_OPTION_GLOBAL_JIHAD_AI_DESC: "La monarchie saoudienne sera renversée par un soulèvement d’Al-Qaïda, conduisant à la création d’un État islamique radical qui cherche à propager son idéologie fondamentaliste par des moyens violents."
 RULE_OPTION_ISLAMIC_AWAKENING: "L'éveil islamique"
 RULE_OPTION_ISLAMIC_AWAKENING_AI_DESC: "L’influence des Frères musulmans, Sahwa, ou Mouvement d’éveil, réussira à faire pression sur la monarchie saoudienne pour qu’elle cède la place à une démocratie islamique pluraliste."
 RULE_OPTION_RETURN_OF_THE_BAATH: "Retour du Baas"
 RULE_OPTION_RETURN_OF_THE_BAATH_AI_DESC: "L'Arabie Saoudite libéralisera progressivement son régime, offrant ainsi l'occasion à l'idéologie unique du nationalisme arabe socialiste du parti Baas de prendre pied dans le pays. L’Arabie baathiste cherchera alors à expulser les troupes étrangères du Moyen-Orient et à étendre son propre territoire."
 RULE_OPTION_SHIA_REVIVAL: "Renouveau chiite"
 RULE_OPTION_SHIA_REVIVAL_AI_DESC: "Les chiites d’Arabie saoudite saisiront l’opportunité offerte par la libéralisation politique pour prendre le contrôle de l’Arabie saoudite, alignant ainsi le pays sur l’Iran et la Russie."
 BRI_AI_BEHAVIOR: "@ENG Royaume-Uni"
 RULE_OPTION_RULE_BRITANNIA: "Règle Britannia"
 RULE_OPTION_RULE_BRITANNIA_AI_DESC: "Once, this sceptered isle was known and feared the world over. The British monarch presided over the empire upon which the sun never set. Now however, Britain's international position has fallen into decline. A mere lackey of the United States, a shadow of its former self. The time has come for the British Empire to be restored. The Crown's partisans will break the two-party system, build their movement through the decade and take power outright in 2010 - and then the fleet sails.\n"
 BOT_AI_BEHAVIOR: "@BOT Botswana"
 NKO_AI_BEHAVIOR: "@NKO RDP de Corée"
 RULE_NKO_NAM_RULES: "Kim Jong-nam"
 RULE_NKO_NAM_RULES_DESC: "Kim Jong-nam contrôlera le pouvoir et changera pour toujours la Corée sur la voie de la « réforme et de l’ouverture »."
 RULE_NKO_UN_RULES: "Kim Jong-un"
 RULE_NKO_UN_RULES_DESC: "En tant que successeur choisi par Kim Jong-il, Kim Jong-un poursuivra sur la voie du Juche, de l'anti-américanisme, de l'autonomie et d'un régime oppressif."
 RULE_NKO_JUNTA_RULES: "Coup d'Etat de la Junte"
 RULE_NKO_JUNTA_RULES_DESC: "The military leads a coup to preserve Juche's purity, they will always embrace Juche and consolidate power in the hands of a junta."
 RULE_NKO_Yo_jong: "Kim Yo-jong"
 RULE_NKO_Yo_jong_ALLOWED_DESC: "Kim Yo-jong will lead the Korean peninsula towards a bright path."
 RULE_NKO_Yo_jong_BLOCKED_DESC: "Ne laissez pas Kim Yo-jong prendre le pouvoir."
 SIN_AI_BEHAVIOR: "@SIN Singapour"
 SIN_GLOBAL_DIPLOMACY: "Diplomatie mondiale"
 SIN_GLOBAL_DIPLOMACY_DESC: "L'objectif de Singapour dans le monde est d'établir un nouvel ordre de diplomatie mondiale."
 SIN_SINGAPORE_ALONE: "Singapour seul"
 SIN_SINGAPORE_ALONE_DESC: "Historique - Il s'agit du chemin historique de Singapour.\n\nSingapour a tout intérêt à rester seule."
 SIN_PRESSURE_SOUTH_ASIAN_SEAS: "Pression sur les mers d'Asie du Sud"
 SIN_PRESSURE_SOUTH_ASIAN_SEAS_DESC: "Une nouvelle vague de force singapourienne fait son apparition."
 SER_AI_BEHAVIOR: "@SER Yougoslavie"
 RULE_OPTION_MILOCEVIC_COMMI: "Milosevic est un communiste"
 RULE_OPTION_MILOCEVIC_COMMI_AI_DESC: "Une fois que Milosevic sera en mesure de rester au pouvoir, il ramènera le pays au communisme et tentera de faire revivre la Yougoslavie."
 RULE_OPTION_MILOCEVIC_NATI: "La Grande Serbie de Milosevic"
 RULE_OPTION_MILOCEVIC_NATI_AI_DESC: "Milosevic suivra la voie de la renaissance de la Grande Serbie et tentera de restituer toutes les terres où vit la population serbe."
 RULE_OPTION_MILOCEVIC_FEDERATION: "La Fédération balkanique de Milosevic"
 RULE_OPTION_MILOCEVIC_FEDERATION_AI_DESC: "Milosevic suivra le chemin d'un projet grandiose et non réalisé : la Fédération balkanique."
 RULE_OPTION_SERBIAN_KINGDOM: "Royaume de Serbie"
 RULE_OPTION_SERBIAN_KINGDOM_AI_DESC: "Après le renversement de Milosevic, les partisans du nationalisme et de la monarchie prendront le pouvoir et tenteront de restaurer la grandeur d'antan du peuple serbe."
 RULE_OPTION_SERBIAN_LIBERALS: "Serbie libérale"
 RULE_OPTION_SERBIAN_LIBERALS_AI_DESC: "La politique serbe empruntera la voie du libéralisme et de la démocratie."
 UKR_AI_BEHAVIOR: "@UKR Ukraine"
 SPR_CONSERVATIVE_LEANINGS: "Orientation conservatrice"
 SPR_CONSERVATIVE_LEANINGS_DESC: "L'Espagne penchera fortement vers le Partido Popular et d'autres partis conservateurs."
 SPR_RENACIMIENTO_NACIONALISTA: "Renacimiento Nacionalista"
 SPR_RENACIMIENTO_NACIONALISTA_DESC: "L'Espagne s'appuiera fortement sur des partis comme Vox et España 2000."
 SPR_NACION_UNIDAD_IMPERIO: "Nacion Unidad Imperio"
 SPR_NACION_UNIDAD_IMPERIO_DESC: "L'Espagne penchera fortement en faveur de la Phalange."
 SPR_SOCIALISM_RISING: "La montée du socialisme"
 SPR_SOCIALISM_RISING_DESC: "Le PSOE et les partis sociaux-démocrates auront plus de chances d'être élus et d'être intégrés au parti au pouvoir."
 SPR_COMMUNIST_REVISIONISM: "Révisionnisme communiste"
 SPR_COMMUNIST_REVISIONISM_DESC: "L'Espagne tentera de se rapprocher des partis communistes."
 SPR_THE_OLD_WAYS: "Les anciennes méthodes"
 SPR_THE_OLD_WAYS_DESC: "L'Espagne cherchera à faire revivre l'Empire espagnol."
 PER_REVOLUTIONARY_PERSIA: "Le retour de Pahlavi"
 PER_REVOLUTIONARY_PERSIA_DESC: "Pahlavi II retournera en Iran et établira un État laïc."
 PER_PAN_PERSIA: "La Fédération iranienne"
 PER_PAN_PERSIA_DESC: "Les paniranistes cesseront le pouvoir en Iran et s'efforceront de créer une fédération iranienne !"
 PER_FIRE_HAS_NO_FRIENDS_IRAN: "L'OMPI"
 PER_FIRE_HAS_NO_FRIENDS_IRAN_DESC: "L'OMPI cèdera le pouvoir en Iran dans le but de créer une république populaire."
 PER_NO_REVOULT_IRAN: "Pas de révolutions"
 PER_NO_REVOULT_IRAN_DESC: "L'Iran se développera pacifiquement et sans révolutions."
 GEO_AI_BEHAVIOR: "@GEO Géorgie"
 GEO_NATIONALIST_behavior: "@GEO Comportement des nationalistes"
 GEO_help_CHE_behavior: "@GEO Aide aux Tchétchènes"
 GEO_2008_war_behavior: "@GEO Comportement dans la guerre de 2008"
 GEO_WILL_FOLLOW_OWN_WAY: "Autodétermination"
 GEO_WILL_FOLLOW_OWN_WAY_DESC: "La Géorgie nationaliste suivra sa propre voie et écrasera l’Arménie et l’Azerbaïdjan"
 GEO_WILL_BE_PRO_ARMENIA: "Pro-arménienne"
 GEO_WILL_BE_PRO_ARMENIA_DESC: "La Géorgie nationaliste aidera l'Arménie à écraser l'Azerbaïdjan."
 GEO_WILL_BE_PRO_AZERI: "Pro-azérie"
 GEO_WILL_BE_PRO_AZERI_DESC: "La Géorgie nationaliste aidera l'Azerbaïdjan à écraser l'Arménie."
 GEO_WILL_HELP: "Aider les @CHE Tchétchènes"
 GEO_WILL_HELP_DESC: "La Géorgie aidera les Tchétchènes dans la guerre contre la Russie. Ils peuvent aider la Géorgie à l’avenir."
 GEO_WONT_HELP: "Ne pas aider les @CHE Tchétchènes"
 GEO_WONT_HELP_DESC: "La Géorgie n’aidera pas les Tchétchènes dans la guerre contre la Russie. Ils seront hostiles à la Géorgie."
 GEO_ATTACK_RUS: "Préparation à la guerre"
 GEO_ATTACK_RUS_DESC: "La Géorgie se préparera à la guerre de 2008 et essaiera de la gagner."
 GEO_WEAKBOY: "Compromis avec la Russie"
 GEO_WEAKBOY_DESC: "La Géorgie cherchera un compromis avec la Russie pour éviter les combats."
 BLR_union_state_ai_behavior: "@BLR Comportement de l'État de l'Union"
 BLR_WONT_FOLLOW_UNION_STATE: "Ne pas suivre l'État de l'Union"
 BLR_WONT_FOLLOW_UNION_STATE_DESC: "La Biélorussie ne formera pas un État fédéré et ne deviendra pas une marionnette de la Russie."
 BLR_WILL_FOLLOW_UNION_STATE: "Former l'État de l'Union"
 BLR_WILL_FOLLOW_UNION_STATE_DESC: "La Biélorussie tentera de former un État fédéré. Au début, ils deviendront une marionnette russe, mais plus tard..."
 PMR_ai_behavior: "@PMR Transnistrie"
 PMR_HISTORIC_DEFAULT: "Parcours historique"
 PMR_HISTORIC_DEFAULT_DESC: "La Transnistrie tentera de suivre la voie historique du rapprochement avec la Russie."
 PMR_LIBERAL: "Transnistrie démocratique"
 PMR_LIBERAL_DESC: "La Transnistrie suivra une voie démocratique et s'efforcera également de s'intégrer à la Moldavie."
 PMR_PATRIOTIC: "Transnistrie républicaine"
 PMR_PATRIOTIC_DESC: "La Transnistrie suivra la voie du parti républicain et bénéficiera d'opportunités politiques uniques."
 PMR_COMMUNISM: "Retour au communisme"
 PMR_COMMUNISM_DESC: "Le drapeau communiste sera à nouveau hissé sur la Transnistrie et la voie vers la renaissance de la RSS de Moldavie sera ouverte."
 PMR_UKRAINE: "Transnistrie ukrainienne"
 PMR_UKRAINE_DESC: "La Transnistrie cherchera à se rattacher à l'Ukraine en rompant ses liens avec la Russie."
 PMR_sub_behavior: "@PMR Sous-comportement de la Transnistrie"
 PMR_PASSIVE_DEFAULT: "Priorité économique"
 PMR_PASSIVE_DEFAULT_DESC: "La Transnistrie concentrera son attention sur le secteur économique."
 PMR_LEBED: "Transnistrie du général Lebed"
 PMR_LEBED_DESC: "Le général Lebed prendra le pouvoir en Transnistrie et achèvera le travail de la 14ème armée."
 PMR_SHERIFF: "Combattre le « shérif »"
 PMR_SHERIFF_DESC: "La Transnistrie se concentrera sur la lutte contre l'influence de la société \"Sheriff\"."
 POL_AI_BEHAVIOR_MD: "@POL Pologne"
 POL_HISTORICAL: "Défaut"
 POL_HISTORICAL_DESC: "La Pologne restera sur la voie démocratique et tentera d’adhérer à l’UE. Le parti dominant sera le PO avec une politique anti-russe."
 POL_COMMUNISM: "Rêve rouge"
 POL_COMMUNISM_DESC: "La Pologne redeviendra communiste et commencera à propager la Révolution rouge en Europe."
 POL_KORWIN_AG: "Korwin rejoint l'OTSC"
 POL_KORWIN_AG_DESC: "La Pologne soutiendra le parti UPR, gagnera sous le nom de Korwin, envahira l'Ukraine et rejoindra l'OTSC."
 POL_KORWIN_PE: "Korwin reste au sein de l'OTAN"
 POL_KORWIN_PE_DESC: "La Pologne soutiendra le parti UPR, remportera la victoire sous le nom de Korwin, rejoindra l'Ukraine à l'OTAN et réformera le Commonwealth polono-lituanien."
 POL_WALESA: "Wałęsa à nouveau président"
 POL_WALESA_DESC: "La Pologne soutiendra le parti ChDRP, gagnera avec Wałęsa et choisira son avenir."
 RULE_OPTION_GER_GREEN: "The Green Chancellery"
 RULE_OPTION_GER_GREEN_DESC: "The §8Greens§! take the chancellery in their own right and spend it on the nuclear phase-out, a European green deal and progressive taxation. Germany pushes the alliance eastward and puts distance between itself and both Moscow and Beijing."
 RULE_OPTION_GER_NATIONALIST: "Rule of the National Democrats"
 RULE_OPTION_GER_NATIONALIST_DESC: "The constitutional order collapses into civil war and the §8National Democratic Party§! takes the ruins, building a one-party police state on blood, soil and expulsion. Germany turns openly irredentist and every border around it becomes a claim."
 RULE_OPTION_GER_SOCIALIST: "The Left Ascendant"
 RULE_OPTION_GER_SOCIALIST_DESC: "§8Die Linke§! takes power out of the wreckage of the Federal Republic, throws the Americans off their bases and disarms the country. Germany then presses France, Poland and Sweden into a workers' union, by force if they refuse it."
 RULE_OPTION_GER_MONARCHIST: "The Kaiser Returns"
 RULE_OPTION_GER_MONARCHIST_DESC: "The republic falls and the §8Kaiser§! is crowned again over a restored empire. Germany puts monarchs back on the Swiss, Austrian, Belgian, Ottoman and Italian thrones and gathers them into an imperial bloc."
