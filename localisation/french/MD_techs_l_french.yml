 nsb_AA_autocannon_5: "Cutting-Edge Autocannon Systems"
 nsb_AA_autocannon_5_desc: "The next evolution of battlefield firepower, Futuristic Autocannon Systems integrate cutting-edge energy-based technology, smart ammunition, and AI-driven targeting systems for unmatched precision and adaptability. These advanced weapons utilize electromagnetic propulsion, caseless hypervelocity rounds, and adaptive ammunition types that can adjust mid-flight for maximum effectiveness. Fully integrated into autonomous combat networks, these autocannons can engage multiple targets simultaneously, track high-speed aerial threats, and provide sustained fire with minimal recoil. Designed for multi-platform deployment, they enhance the firepower of next-generation battle tanks, aircraft, naval vessels, and unmanned combat systems, ensuring dominance in the warfare of tomorrow."
 nsb_AA_autocannon_6: "Systèmes de canon automatique de 6e génération"
