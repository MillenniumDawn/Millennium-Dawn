 SAU_Arab_league_policy: "Arab League Policy"
 SAU_arab_league_policy_01: "Arab Leadership"
 SAU_arab_league_policy_01_desc: "Saudi Arabia leads the Arab world. The kingdom's wealth, oil power, and religious significance make it the natural Arab leader."
 SAU_arab_league_policy_02: "Arab Consensus"
 SAU_arab_league_policy_02_desc: "The kingdom builds consensus among Arab states. Aid, diplomacy, and the occasional threat bring recalcitrant members into line."
 SAU_arab_league_policy_03: "Arab Peace Initiative"
 SAU_arab_league_policy_03_desc: "The 2002 Arab Peace Initiative offers Israel full normalization for a Palestinian state. The kingdom leads Arab diplomacy on Israel/Palestine."
 SAU_arab_league_policy_04: "Arab Economic Integration"
 SAU_arab_league_policy_04_desc: "The kingdom promotes Arab economic integration. Trade agreements, investment flows, and the dream of an Arab common market."
 SAU_arab_league_policy_05: "Arab Defense Cooperation"
 SAU_arab_league_policy_05_desc: "Joint military exercises, intelligence sharing, and arms coordination among Arab states. The Arab defense community grows."
 SAU_arab_league_policy_08: "Arab Mediation"
 SAU_arab_league_policy_08_desc: "Saudi Arabia mediates Arab disputes. Qatar blockade, Lebanon crisis, Sudan transition - Riyadh is the Arab fixer."
 SAU_arab_league_policy_09: "Arab Aid Program"
 SAU_arab_league_policy_09_desc: "The Saudi Fund for Development, the Islamic Development Bank, and bilateral aid flow to Arab nations. The kingdom buys influence with money."
 SAU_arab_league_policy_10: "Arab Cultural Leadership"
 SAU_arab_league_policy_10_desc: "The kingdom promotes Arab culture. Mecca, Medina, the Arabic language - Saudi Arabia is the cultural heart of the Arab world."
 SAU_arab_league_policy_11: "Arab Media Influence"
 SAU_arab_league_policy_11_desc: "Al Arabiya, MBC, and Saudi-backed media outlets shape Arab public opinion. The kingdom's voice reaches hundreds of millions."
 SAU_arab_league_policy_12: "Arab Education Network"
 SAU_arab_league_policy_12_desc: "Saudi scholarships, universities, and educational partnerships connect the Arab world. Students flow from Morocco to Riyadh."
 SAU_arab_league_policy_13: "Arab Trade Hub"
 SAU_arab_league_policy_13_desc: "The kingdom becomes the trade hub of the Arab world. Goods, capital, and labor flow through Saudi ports and airports."
 SAU_arab_league_policy_14: "Arab Summit Host"
 SAU_arab_league_policy_14_desc: "Saudi Arabia hosts Arab summits. The kingdom's hospitality, wealth, and diplomatic skill make it the natural summit venue."
 SAU_Arab_league_policy_desc: "The Arab League is the kingdom's natural forum. Saudi Arabia leads through consensus, aid, and the occasional ultimatum."
 SAU_arab_shield_category: "The Arab Shield"
 SAU_arab_shield_invite: "Invite [FROM.GetFlag][FROM.GetNameDef] to the Arab Shield"
 SAU_arab_shield_invite_desc: "Extend an invitation to [FROM.GetNameDef] to join the Arab Shield. If they accept, they enter our faction and share in its collective defense. Can be repeated for any Arab League state still outside the alliance."
 SAU_arab_shield_pact: "The Arab Shield"
 SAU_arab_shield_pact_desc: "Riyadh stands at the head of a formal Arab defensive alliance, a shield raised against the storms of the age."
