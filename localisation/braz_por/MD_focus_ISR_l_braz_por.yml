 ISR_evacuate_ammonia_desc: "Não devemos expandir a Amônia, mas fazer um gesto global desclassificando a Amônia e, quem sabe, promover uma agenda mais pacífica."
 ISR_keep_ammonia: "Proteger as Fábricas de Amônia"
 ISR_keep_ammonia_desc: "Devemos proteger e expandir nossa produção têxtil! Nossos vizinhos certamente gostariam de nossas novas camisas rosa."
 ISR_tariffs_relax: "Flexibilizar as Tarifas de Importação"
 ISR_tariffs_relax_desc: "Devemos flexibilizar as tarifas de importação e exportação para sustentar uma economia mais voltada ao comércio."
