 ALG_minister_vacant: "공석"
 ALG_military_industrial_complex: "군산복합체"
 ALG_patronage_networks: "후원 네트워크"
 ALG_crush_all_opposition: "모든 반대 세력 분쇄"
 ALG_control_hydrocarbons: "탄화수소 장악"
 ALG_fortress_algeria: "요새 알제리"
 ALG_military_industrial_complex_desc: "군은 경제 제국을 확장하여 무기 공장을 짓고 수익성 높은 국방 계약을 확보합니다. 장교단은 사업가 계층이 되고, 장군들은 기업 이사회에 앉아 막대한 부를 축적합니다."
 ALG_patronage_networks_desc: "후원의 그물망이 체제를 재계 엘리트 및 지역 실력자들과 연결합니다. 충성은 계약, 면허, 접근권으로 매수됩니다. 국가는 사적 치부의 도구가 됩니다."
 ALG_crush_all_opposition_desc: "체제는 체포, 검열, 협박을 통해 모든 조직된 반대 세력을 제거합니다. 정당들은 포섭되거나 금지됩니다. 시민 사회는 껍데기만 남습니다. 오직 체제의 목소리만 들립니다."
 ALG_control_hydrocarbons_desc: "국가는 탄화수소 부문의 전면적 통제권을 장악하여 석유와 가스 수입을 체제의 금고로 직접 흘려보냅니다. 외국 파트너는 압박받고, 독립 사업자는 흡수되며, 딥 스테이트가 수도꼭지를 쥡니다."
 ALG_fortress_algeria_desc: "알제리는 군사화되고 폐쇄적이며 외부 세계를 의심하는 병영 국가가 됩니다. 군은 강력하고, 국경은 봉쇄되며, 국민은 석유 부와 탄압의 결합으로 통제됩니다."
 ALG_oil_crash_weakens_regime_tt: "유가 폭락으로 체제가 사회적 평화를 사들일 능력이 심각하게 약화되었습니다. 민심의 불만이 고조되고 있습니다."
 ALG_hirak_wins_tt: "히라크 운동이 승리했습니다. 새로운 알제리가 가능해졌습니다."
 ALG_military_wins_tt: "딥 스테이트가 승리했습니다. 군사 통치가 새로운 얼굴로 계속됩니다."
 ALG_republic_new_era_tt: "알제리 공화국에 새로운 시대가 열립니다. 낡은 체제가 해체되고 있습니다."
 ALG_parliamentary_republic_tt: "알제리는 의원내각제 정부를 채택했습니다. 국민의회가 최고 기관입니다."
 ALG_semi_presidential_republic_tt: "알제리는 이원집정부제 정부를 채택했습니다. 권력은 대통령과 의회가 나눠 갖습니다."
 ALG_presidential_republic_tt: "알제리는 대통령제 정부를 채택했습니다. 대통령이 지배적인 행정 권한을 보유합니다."
 ALG_patronage_enriches_regime_tt: "후원 네트워크가 알제리 국민을 희생시켜 체제와 그 동맹을 살찌웁니다."
 ALG_fortress_state_tt: "알제리는 요새 국가가 되었습니다. 딥 스테이트가 절대적으로 통치하며 국가는 세계에 문을 닫았습니다."
 ALG_military_industrial_economy: "군산복합 경제"
 ALG_state_hydrocarbon_monopoly: "국가 탄화수소 독점"
 ALG_fortress_state: "요새 국가"
 ALG_military_industrial_economy_desc: "군이 무기 생산과 국방 산업으로 확장하여 체제를 위한 자립적 경제 기반을 만들었습니다. 장군들이 기업 이사회에 앉아 있으며 군복과 정장의 경계가 흐려졌습니다."
 ALG_state_hydrocarbon_monopoly_desc: "석유와 가스 수입에 대한 국가의 전면 통제가 체제와 그 후원 네트워크를 뒷받침합니다. 탄화수소 부문은 연줄이 닿는 자만이 활동할 수 있는 폐쇄된 세계입니다."
 ALG_fortress_state_desc: "알제리는 폐쇄적이고 군사화된 국가가 되었습니다. 군은 강력하고, 사회는 통제되며, 딥 스테이트는 도전 없이 통치합니다. 안정은 자유를 대가로 얻은 것입니다."
 ALG_redmed_group_expansion: "레드메드 그룹 확장"
 ALG_redmed_group_expansion_desc: "레드메드 그룹은 하시 메사우드 일대 석유·가스 부문의 믿을 만한 물류 파트너임을 입증했습니다. 적절한 투자가 이루어지면 더 폭넓은 산업 세력으로 성장할 수 있습니다."
 ALG_star_aviation_operations: "스타 에비에이션 운영"
 ALG_star_aviation_operations_desc: "레드메드 그룹의 항공 자회사는 설립 이래 무사고 안전 기록을 유지해 왔습니다. 이 명성을 활용하여 항공 부문 참여를 심화해야 합니다."
 ALG_military_aviation_contract: "군용 항공 계약"
 ALG_military_aviation_contract_desc: "스타 에비에이션의 탁월한 운영 능력이 군의 주목을 받았습니다. 국방 계약을 확보하면 첨단 항공우주 개발의 문이 열리고 다음 단계의 확장을 위한 자금이 마련됩니다."
 ALG_missile_development_initiative: "미사일 개발 구상"
 ALG_missile_development_initiative_desc: "현대적인 군대는 외국 무기에만 의존할 수 없습니다. 레드메드 그룹을 통해 국내 미사일 프로그램을 시작하여 전략적 억지력의 토대를 마련할 것입니다."
 ALG_star_aviation_uav_division: "스타 에비에이션 무인기 사업부"
 ALG_star_aviation_uav_division_desc: "외국의 무인기 기술을 손에 넣은 스타 에비에이션은 전담 드론 사업부를 설립할 준비가 되었습니다. 알제리 기술자들이 받은 기술을 연구하고 개조하며 결국 능가할 것입니다."
 ALG_domestic_uav_production: "국산 무인기 생산"
 ALG_domestic_uav_production_desc: "역설계 단계가 완료되었습니다. 스타 에비에이션의 시설은 알제리가 설계한 무인기를 대량으로 생산할 준비가 되었습니다. 이는 더 이상 수입의 문제가 아니라 주권의 문제입니다."
 ALG_russian_missile_cooperation: "러시아 미사일 협력"
 ALG_russian_missile_cooperation_desc: "러시아의 미사일 산업은 세계에서 가장 앞선 수준에 속합니다. 모스크바와의 협력은 우리의 프로그램을 크게 가속하겠지만, 러시아의 선의에 대한 의존이 깊어지는 대가가 따릅니다."
 ALG_chinese_missile_cooperation: "중국 미사일 협력"
 ALG_chinese_missile_cooperation_desc: "중국은 우호국과 미사일 기술을 공유할 의사를 보여 왔습니다. 베이징과의 거래는 현대적 체계에 대한 접근권을 제공하고 부상하는 다극 세계에서 우리의 입지를 강화합니다."
 ALG_redmed_star_convergence: "레드메드-스타 통합"
 ALG_redmed_star_convergence_desc: "레드메드의 미사일 사업부를 스타 에비에이션의 무인기 역량과 하나의 통합 국방 구조로 결합할 때가 왔습니다. 알제리는 더 이상 안보를 수입하지 않고 직접 생산할 것입니다."
 ALG_regional_defense_leader: "마그레브 방위 산업 선도국"
 ALG_regional_defense_leader_desc: "알제리의 방위 산업은 이제 마그레브에서 견줄 상대가 없습니다. 우리의 무인기는 사하라를 순찰하고, 우리의 미사일은 경쟁국을 억지하며, 한때 유럽을 바라보던 이웃 국가들이 우리의 기술을 찾습니다. 이것이 주권의 모습입니다."
 ALG_uav_procurement_category: "무인기 조달"
 ALG_uav_procurement_category_desc: "스타 에비에이션은 역설계를 시작하기 위한 기준 플랫폼이 필요합니다. 외국 무인기 공급국을 선택하십시오."
 ALG_drone_program_category: "드론 개발 프로그램"
 ALG_drone_program_category_desc: "스타 에비에이션의 무인기 사업부가 알제리 최초의 국산 드론을 개발할 준비가 되었습니다. 개발 방향을 선택하십시오."
 ALG_purchase_turkish_uavs: "튀르키예 무인기 구매"
 ALG_purchase_turkish_uavs_desc: "바이락타르 TB2는 여러 분쟁에서 그 성능을 입증했습니다. 튀르키예로부터 이를 도입하면 무인기 운용 경험과 역설계를 위한 견고한 플랫폼을 얻을 수 있지만, 앙카라와 가까워지는 대가가 따릅니다."
 ALG_purchase_chinese_uavs: "중국 무인기 구매"
 ALG_purchase_chinese_uavs_desc: "중국의 윙룽 II는 서방 체계에 필적하는 성능을 훨씬 저렴한 가격에 제공합니다. 베이징은 이러한 거래에 기술 이전 조항을 포함할 의사도 보여 왔습니다."
 ALG_purchase_iranian_uavs: "이란 무인기 구매"
 ALG_purchase_iranian_uavs_desc: "이란의 모하제르-6은 비용 효율적이며 실전 검증을 거쳤습니다. 테헤란으로부터의 도입은 가장 저렴한 선택이며 자연스러운 전략적 파트너와의 관계를 심화하지만, 국제사회의 감시를 받을 수 있습니다."
 ALG_develop_amel_recon_uav: "아멜 무인기 개발"
 ALG_develop_amel_recon_uav_desc: "아멜은 알제리가 독자 설계한 최초의 정찰 무인기로, 광활한 사하라 남부의 국경 감시와 정보 수집에 최적화된 장시간 체공 플랫폼이 될 것입니다."
 ALG_develop_el_djazair_ucav: "엘자자이르 전투 무인기 개발"
 ALG_develop_el_djazair_ucav_desc: "엘자자이르는 정밀 타격이 가능한 무장 UCAV로서 진정한 전투용 드론이 될 것입니다. 정찰 플랫폼보다 비용이 많이 들고 기술적으로 까다롭지만 훨씬 강력한 군사 자산입니다."
 ALG_develop_swarm_loitering: "군집 자폭 무인기 개발"
 ALG_develop_swarm_loitering_desc: "알제리는 하나의 대형 드론 대신 작고 저렴하며 협조 운용되는 자폭 무인기 군집에 투자할 것입니다. 요격하기 어렵고, 수가 많으면 파괴적이며, 대량 생산 시 비용도 저렴합니다."
 ALG_redmed_group_tt: "§G레드메드 그룹이 석유·가스 물류를 넘어 더 폭넓은 산업 역량으로 확장합니다.§!"
 ALG_star_aviation_founded_tt: "§G스타 에비에이션의 탁월한 운영 능력으로 군 계약을 수주할 기반이 마련되었습니다.§!"
 ALG_military_contract_tt: "§G스타 에비에이션이 군 계약을 확보했습니다. 이제 무인기 조달 결정을 사용할 수 있습니다.§!"
 ALG_uav_division_tt: "§G전담 무인기 사업부가 설립되었습니다. 이제 드론 개발 결정을 사용할 수 있습니다.§!"
 ALG_domestic_production_tt: "§G알제리가 이제 무인기를 국내에서 생산할 수 있습니다.§!"
 ALG_amel_developed_tt: "§G아멜 정찰 무인기가 성공적으로 개발되었습니다.§!"
 ALG_ucav_developed_tt: "§G엘자자이르 전투 무인기가 실전 배치되었습니다.§!"
 ALG_swarm_developed_tt: "§G알제리가 군집 자폭 무인기 능력을 개발했습니다.§!"
 ALG_missile_division_tt: "§G레드메드 그룹이 전담 미사일 개발 사업부를 설립했습니다.§!"
 ALG_redmed_leader_tt: "§G레드메드 그룹과 스타 에비에이션이 통합 방위 산업 복합체로 합병했습니다.§!"
 ALG_defense_leader_tt: "§G알제리가 마그레브 최고의 방위 기술 국가로 인정받습니다.§!"
 ALG_redmed_group_logistics: "레드메드 그룹 물류"
 ALG_redmed_group_logistics_desc: "레드메드 그룹은 알제리의 석유·가스 부문에 종합 물류 서비스를 제공합니다."
 ALG_redmed_star_aviation: "스타 에비에이션 운영"
 ALG_redmed_star_aviation_desc: "스타 에비에이션은 무사고 안전 기록을 유지하고 있습니다. 그 운영의 정밀함이 항공우주 개발로 전용되고 있습니다."
 ALG_star_aviation_military: "스타 에비에이션 군 계약"
 ALG_star_aviation_military_desc: "스타 에비에이션이 군 계약을 확보하여 민간 부문의 뛰어난 운영 능력을 국방 부문으로 가져왔습니다."
 ALG_star_aviation_uav_division_idea: "스타 에비에이션 무인기 사업부"
 ALG_star_aviation_uav_division_idea_desc: "전담 드론 사업부가 알제리 자체 역량을 개발하기 위해 외국 무인기 플랫폼을 연구하고 있습니다."
 ALG_star_aviation_uav_production: "스타 에비에이션 무인기 제조"
 ALG_star_aviation_uav_production_desc: "스타 에비에이션이 이제 알제리가 설계한 무인기를 대량으로 제조합니다."
 ALG_redmed_integrated_defense_systems: "레드메드 통합 방위"
 ALG_redmed_integrated_defense_systems_desc: "레드메드 그룹이 무인기 및 미사일 프로그램을 하나의 통합 첨단 무기 복합체로 합쳤습니다."
 ALG_maghreb_defense_powerhouse: "마그레브 방위 산업 강국"
 ALG_maghreb_defense_powerhouse_desc: "레드메드 그룹과 스타 에비에이션이 이끄는 알제리의 방위 산업은 북아프리카에서 가장 앞서 있습니다."
 ALG_aerospace_training_program: "항공우주 훈련 프로그램"
 ALG_aerospace_training_program_desc: "알제리의 성장하는 방위 산업을 뒷받침할 항공우주 기술자와 드론 기술자를 배출하는 국가 프로그램입니다."
 ALG_combat_uav_program: "전투 무인기 프로그램"
 ALG_combat_uav_program_desc: "무장 무인기의 활발한 개발이 알제리 공군의 타격 능력을 강화하고 있습니다."
 ALG_redmed_missile_division_idea: "레드메드 미사일 사업부"
 ALG_redmed_missile_division_idea_desc: "레드메드 그룹의 전담 미사일 개발 부문이 알제리의 전략적 억지력을 밑바닥부터 구축하고 있습니다."
 ALG_cruise_missile_development: "순항 미사일 개발"
 ALG_cruise_missile_development_desc: "활발한 순항 미사일 프로그램이 알제리에 사상 처음으로 정밀 장거리 타격 능력을 부여하고 있습니다."
 ALG_precision_strike_capability: "정밀 타격 능력"
 ALG_precision_strike_capability_desc: "통합된 미사일 및 무인기 체계가 알제리에 진정한 정밀 타격 능력을 부여했습니다."
 ALG_defense_export_industry: "방위 산업 수출"
 ALG_defense_export_industry_desc: "알제리 무인기와 미사일이 이제 수출 가능합니다. 모든 판매는 수익인 동시에 외교적 지렛대입니다."
 ALG_redmed_group_concern: "레드메드 그룹"
 ALG_redmed_group_concern_desc: "석유·가스 물류에 뿌리를 둔 알제리의 선도적인 산업 복합 기업입니다. 레드메드 그룹은 군에 무인기와 미사일 체계를 생산하는 알제리의 주요 방위 제조업체로 성장했습니다."
 ALG_star_aviation_concern: "스타 에비에이션"
 ALG_star_aviation_concern_desc: "레드메드 그룹의 항공 자회사입니다. 2001년에 설립되어 무사고 안전 기록을 유지해 온 스타 에비에이션은 현재 알제리의 국내 항공우주 및 드론 제조 프로그램을 이끌고 있습니다."
 ALG_arrest_opponents_started_tt: "보안군이 체포 작전을 시작하고 있습니다..."
 ALG_surveillance_started_tt: "감시망 확장이 진행 중입니다..."
 ALG_ban_parties_started_tt: "야당 해산을 위한 법적 절차가 시작되었습니다..."
 ALG_imf_loan_started_tt: "IMF 대출 협상이 진행 중입니다..."
 ALG_oil_licensing_started_tt: "외국 기업과의 석유 면허 협상이 시작되었습니다..."
 ALG_repay_imf_started_tt: "IMF 대출 상환 절차가 시작되었습니다..."
 ALG_pardon_islamist_started_tt: "온건 이슬람주의자들에 대한 사면 절차가 시작되었습니다..."
 ALG_dialogue_started_tt: "국민 대화 회의가 준비되고 있습니다..."
 ALG_reintegrate_fighters_started_tt: "전직 전투원 재통합 프로그램이 시작되고 있습니다..."
 ALG_arrest_opponents_complete_tt: "체포 작전이 종료되었습니다. 야당이 약화되었습니다."
 ALG_surveillance_complete_tt: "감시망이 이제 완전히 가동됩니다."
 ALG_ban_parties_complete_tt: "야당들이 공식적으로 해산되었습니다."
 ALG_imf_loan_complete_tt: "IMF 대출금을 수령했습니다."
 ALG_oil_licensing_complete_tt: "석유 면허 협정이 이제 발효됩니다."
 ALG_repay_imf_complete_tt: "IMF 대출이 전액 상환되었습니다."
 ALG_pardon_islamist_complete_tt: "사면이 단행되었습니다. 정치적 화해가 진전됩니다."
 ALG_dialogue_complete_tt: "국민 대화가 성공적으로 마무리되었습니다."
 ALG_reintegrate_fighters_complete_tt: "전직 전투원들이 성공적으로 재통합되었습니다."
 ALG_fis_return_threat: "알제리 이슬람 구국 전선의 귀환"
 ALG_fis_return_western_concern: "알제리의 살라피 정부에 경악"
 ALG_fis_return_salafi_solidarity: "알제리의 살라피 정부를 지지"
 ALG_fis_return_islamist_sympathy: "알제리의 이슬람주의 정부를 조심스럽게 환영"
 ALG_fis_return_neighbor_alarm: "알제리의 이슬람주의 집권에 경악"
 ALG_fis_return_anti_political_islam: "알제리의 정치적 이슬람에 반대"
 ALG_world_tension_security_ended_tt: "보안 조치가 해제되었습니다."
 ALG_world_tension_high_security_ended_tt: "고도 보안 경계가 종료되었습니다."
 ALG_crackdown_momentum_ended_tt: "탄압의 기세가 가라앉았습니다."
 ALG_reconciliation_momentum_ended_tt: "화해의 기세가 사그라졌습니다."
 ALG_by_the_people_for_the_people: "국민의, 국민에 의한, 국민을 위한"
 ALG_by_the_people_for_the_people_desc: "히라크 운동이 알제리를 뿌리부터 뒤흔들었습니다. 국민은 단순한 얼굴 교체가 아니라 권력의 근본적 재편이라는 정치 체제의 완전한 변혁을 요구합니다. 구세력은 조용히 물러나지 않을 것입니다."
 ALG_by_the_people_for_the_people_tt: "§Y히라크 운동§!이 충분한 동력을 갖추어야 합니다(세력 균형 §G70%§! 초과)."
 ALG_break_the_oligarchs: "과두 지배층 타파"
 ALG_break_the_oligarchs_desc: "체제와의 근접성으로 이득을 취한 사업가들의 네트워크를 해체해야 합니다. 그들의 자산은 압수되고, 계약은 재검토되며, 국가에 대한 그들의 영향력은 영원히 종식될 것입니다."
 ALG_dismantle_le_pouvoir: "르 푸부아르 해체"
 ALG_dismantle_le_pouvoir_desc: "독립 이래 알제리를 이끌어 온 보이지 않는 손인 그림자 국가, 장군들, 정보기관을 백일하에 드러내고 그 권위를 박탈해야 합니다."
 ALG_new_economic_model: "새로운 경제 모델"
 ALG_new_economic_model_desc: "과두 지배층이 제거되면 알제리는 새로운 경제 비전이 필요합니다. 지대 국가 모델은 끝났습니다. 그 자리에 산업, 기술, 인적 자본을 기반으로 한 다변화된 경제를 세울 것입니다."
 ALG_unleash_civil_society: "시민 사회 해방"
 ALG_unleash_civil_society_desc: "자유로운 언론, 독립적인 노동조합, 실질적인 지지층을 대표하는 정당들이야말로 민주주의가 세워지는 토대입니다."
 ALG_constitutional_convention: "제헌 회의"
 ALG_constitutional_convention_desc: "알제리 전역의 대표들이 모여 새 헌법을 기초합니다. 처음으로 이 문서는 권력자들이 강요하는 것이 아니라 국민이 직접 쓰게 됩니다."
 ALG_presidential_republic: "대통령제 공화국"
 ALG_presidential_republic_desc: "알제리는 강력한 행정부, 명확한 권한, 민주적 책임성을 갖춘 대통령제를 채택합니다. 대통령은 결단력 있게 통치하되 헌법적 안전장치가 권력 남용을 막습니다."
 ALG_parliamentary_republic: "의원내각제 공화국"
 ALG_parliamentary_republic_desc: "알제리는 선출된 대표들이 권력을 나누는 의원내각제를 채택합니다. 연립 구성과 합의가 어느 한 개인이 다시는 국가를 지배하지 못하도록 보장합니다."
 ALG_civilian_military_control: "군에 대한 문민 통제"
 ALG_civilian_military_control_desc: "군은 국가를 지배하는 것이 아니라 섬겨야 합니다. 정치 장군들은 전문 장교들로 대체됩니다. 군은 현대화되고 탈정치화되며 민간 권위 아래 확고히 놓입니다."
 ALG_democratic_dividend: "민주주의의 배당"
 ALG_democratic_dividend_desc: "투명하고 민주적인 알제리는 외국인 투자, 국제 협력 관계, 그리고 해외 교민의 귀환을 끌어들입니다. 세계가 주목하면서 경제는 탄화수소를 넘어 다변화됩니다."
 ALG_a_new_algeria: "새로운 알제리"
 ALG_a_new_algeria_desc: "낡은 체제의 잿더미에서 새로운 국가가 떠오릅니다. 부패 네트워크는 해체됩니다. 두뇌 유출은 역전됩니다. 알제리는 진정한 민주주의가 국민 스스로의 의지로 세워질 수 있음을 보여주는 증거로 서 있습니다."
 ALG_transitional_instability: "과도기적 불안정"
 ALG_transitional_instability_desc: "구질서의 붕괴가 권력 공백을 남겼습니다. 제도는 취약하고, 경제는 교란되었으며, 정치 세력들은 미래를 빚기 위해 경쟁하고 있습니다."
 ALG_economic_disruption: "경제적 혼란"
 ALG_economic_disruption_desc: "과두 지배층 자산의 압수와 부패 계약의 재편으로 경제 활동이 일시적으로 교란되었습니다."
 ALG_free_press_and_assembly: "언론·집회의 자유"
 ALG_free_press_and_assembly_desc: "독립 신문들이 두려움 없이 보도합니다. 시민들이 자유롭게 조직합니다. 광장은 국민의 것입니다."
 ALG_diversified_economy: "다변화된 경제"
 ALG_diversified_economy_desc: "알제리 경제는 석유 의존을 넘어 산업, 기술, 지속 가능한 발전으로 나아갑니다."
 ALG_new_constitution_permanent: "국민의 헌법"
 ALG_new_constitution_permanent_desc: "선출된 대표들이 작성하고 국민투표로 비준된 알제리의 새 헌법은 민주적 권리, 권력 분립, 법치를 명문화합니다."
 ALG_presidential_system: "대통령제"
 ALG_presidential_system_desc: "명확한 권한과 민주적 책임성을 갖춘 강력한 행정부가 알제리를 결단력 있게 통치합니다."
 ALG_parliamentary_system: "의원내각제"
 ALG_parliamentary_system_desc: "선출된 대표들이 토론하고 협상하며 합의를 이루는 숙의적 체제입니다. 권력은 정당과 연립에 걸쳐 분점됩니다."
 ALG_professional_military: "전문 직업군"
 ALG_professional_military_desc: "탈정치화되고 현대화되었으며 문민 통제하에 있습니다. 알제리군은 국가를 지배하는 것이 아니라 국가를 위해 봉사합니다."
 ALG_foreign_investment_boom: "외국인 투자 붐"
 ALG_foreign_investment_boom_desc: "국제 자본이 민주 알제리로 유입됩니다. 투명한 통치와 법치가 이 나라를 매력적인 투자처로 만듭니다."
 ALG_beacon_of_democracy: "민주주의의 등대"
 ALG_beacon_of_democracy_desc: "알제리는 진정한 민주적 변혁이 가능함을 보여주는 살아 있는 증거로 서 있습니다. 이 나라는 지역 전역의 운동에 영감을 주고 세계의 찬사를 받습니다."
 ALG_the_nation_stands_at_a_crossroads_desc: "알제리는 상처투성이로 암흑의 10년에서 벗어나고 있습니다. 20만 명 이상이 사망했고, 마을 전체가 파괴되었으며, 내전으로 경제는 만신창이가 되었습니다. 부테플리카 대통령은 무장세력에 대한 사면을 제의하고 개혁을 약속하는 시민 화합법에 자신의 임기를 걸었습니다. 그러나 그의 뒤에는 독립 이후 알제리를 통치해 온 장성과 정보 장교들의 그림자 같은 연결망, '르 푸부아르'가 버티고 있습니다. 앞으로 나아갈 길은 다음 국면을 쥐는 자의 몫입니다."
 ALG_counterterrorism_agency_desc: "정보보안국(DRS)은 내전 이후 옛 군사정보기관인 군사보안국(SM)의 잔재로부터 재건되었습니다. 민간의 감독으로부터 거의 완전히 자율적으로 운영된 DRS는 알제리에서 가장 강력한 기관이 되었으며, 대통령직 그 자체보다도 두려운 존재였습니다."
 ALG_investments_in_iraq: "이라크와의 우호"
 ALG_investments_in_iraq_desc: "과거 이라크가 우리와 이상적이지 않은 관계였음에도 불구하고, 서로 가까워지는 것이 최선입니다. 이라크 인프라에 투자하여 그들의 신뢰를 얻을 수 있습니다."
 ALG_diplo: "MSP 외교"
 ALG_diplo_desc: "새로운 정부에 걸맞게 외교를 개혁해야 합니다."
 ALG_balance_islamists_and_secularists: "이슬람주의자와 세속주의자의 균형"
 ALG_balance_islamists_and_secularists_desc: "종교 운동과 세속 엘리트 사이에 취약한 균형을 유지해야 하며, 실패할 경우 다시 분쟁이 일어날 위험이 있습니다."
 ALG_new_constutition_reforms: "헌법 개혁"
 ALG_new_constutition_reforms_desc: "개혁 요구를 영원히 무시할 수는 없습니다. 새 헌법은 보다 다원적인 통치로 가는 길을 열 수 있습니다."
 ALG_denounce_previous_colonialist_regimes: "프랑스 식민주의 법 규탄"
 ALG_denounce_previous_colonialist_regimes_desc: "식민 과거를 미화하는 프랑스의 논란 많은 법이 분노를 불러일으켰습니다. FLN은 식민주의 범죄를 규탄하고 알제리의 반식민 투쟁을 재확인하는 데 앞장서야 합니다."
 ALG_share_power: "권력 분점"
 ALG_share_power_desc: "홀로 통치하는 대신 FLN은 일부 야권 및 테크노크라트 세력과 조심스럽게 권력을 나눌 수 있습니다. 이는 안정을 유지하면서 정권에 대한 대중의 분노를 줄일 수 있습니다."
 ALG_legacy_revolution: "FLN"
 ALG_legacy_revolution_desc: "민족해방전선(Front de libération nationale)은 알제리의 민족주의 정당입니다. 1989년까지 유일한 합법 정당이었으며, 일당 국가로서 알제리를 통치했습니다. 알제리 내전 이후 2002년에 가장 인기 있는 정당으로 권력을 되찾았고 그 이후로 계속 그 지위를 유지하고 있습니다. 이념은 범아랍 민족주의적 사고방식을 따르며 반식민주의를 원래의 핵심 가치로 삼습니다. 사회주의를 지지하되, 마르크스주의 사상에는 반대하므로 특히 아랍 사회주의를 지지합니다."
 ALG_devlop_industry: "국가 산업 발전"
 ALG_devlop_industry_desc: "알제리의 미래는 산업 기반 강화에 달려 있습니다. 제조업, 에너지 생산, 기술과 같은 핵심 부문의 발전에 집중함으로써 외국 수입에 대한 의존도를 줄이고 자급자족 경제를 건설할 수 있습니다."
 ALG_expand_hydro: "수력 발전 기반시설 확장"
 ALG_expand_hydro_desc: "증가하는 국가 에너지 수요를 뒷받침하고 외국 자원에 대한 의존도를 줄이려면 수력 발전 확대에 투자해야 합니다. 하천을 활용하면 청정에너지를 얻을 뿐 아니라 산업 기반을 강화하고 시민의 생계를 개선할 수 있습니다."
 ALG_optimize_water_management: "물 관리 최적화"
 ALG_optimize_water_management_desc: "물 부족에 대처하고 농업 생산량을 개선하려면 현대적인 물 관리 체계를 도입해야 합니다. 효율적인 분배와 보존은 농촌 공동체와 성장하는 도시 중심지를 모두 뒷받침하며, 우리 국토가 가뭄에 더 잘 견디도록 만들 것입니다."
 ALG_hydroelectric_authority: "국가 수력 발전 공사"
 ALG_hydroelectric_authority_desc: "중앙집중식 수력 발전 공사를 설립함으로써 알제리의 개발되지 않은 수자원을 체계적으로 개발할 수 있습니다. 이는 산업화를 위한 안정적인 전력을 공급하는 동시에 재생 에너지 부문의 일자리와 기술 전문성을 창출할 것입니다."
 ALG_electrify_rural_algeria: "알제리 농촌 전화"
 ALG_electrify_rural_algeria_desc: "알제리 농촌에 전기를 공급하는 것은 현대적 발전에 필수적입니다. 전력망 확장과 지역 수력 사업을 통해 생활 수준을 개선하고, 기계화 농업을 가능하게 하며, 외딴 공동체를 국가의 진보와 연결할 수 있습니다."
 ALG_foreign_investment: "외국 투자 유치"
 ALG_foreign_investment_desc: "경제 발전을 가속화하려면 국제 자본에 유리한 환경을 조성해야 합니다. 기반시설 및 에너지 사업에서의 전략적 제휴는 국가 주권을 유지하면서 자금과 기술 지식을 모두 가져다줄 것입니다."
 ALG_algeria_islamic: "MSP"
 ALG_algeria_islamic_desc: "평화를 위한 사회운동(Mouvement de la société pour la paix)은 알제리의 우파에서 극우에 이르는 정당입니다. 1990년 무슬림 형제단에 의해 창당되었으며 지금도 이와 연대하고 있습니다. 수니파 이슬람주의 정당으로, 이슬람적이고 보수적인 민주주의를 따릅니다. 1997년 총선에서 380석 중 69석을 얻어 제2당이 된 것이 가장 큰 성공이었습니다. 1995년 대통령 선거에도 한 차례 출마하여 25.6%를 득표했습니다. 2012년 MRN, MRI와 선거 연합을 결성했습니다. 이 정당은 아랍어 명칭 \\"Harakat mujtama' as-silm\\"의 약칭인 \\"하마스\\"로도 알려져 있습니다."
 ALG_algerian_islamic_movement: "알제리 이슬람 운동"
 ALG_algerian_islamic_movement_desc: "이슬람 운동은 간단히 말해 튀르키예에서 평화주의적이고 현대적인 이슬람관을 주창하여 학생들 사이에서 매우 인기 있었던 이슬람주의 운동이었습니다. 우리는 그들의 가르침에서 영감을 얻어 학교 교육과정을 개혁하고, 이슬람의 가치를 옹호하고 학생들에게 가르치는 동시에 교육 전반을 개선할 것입니다."
 ALG_nationwide_security_presence_desc: "히라크 시위를 억제하기 위해 사막 매 작전에 따라 보안 병력이 전국에 동원됩니다. 시위 억제에는 효과적이지만 비용이 증가하고 대중의 신뢰가 훼손됩니다."
 algerian_events.300.t: "커지는 불안"
 algerian_events.300.d: "전국 각지에서 산발적인 시위와 시민 불복종 소식이 들어오고 있습니다. 부패, 실업, 정치 개혁의 부재에 대한 대중의 좌절감이 한계점에 다다르고 있습니다. 지금은 시위가 흩어져 있지만, 훨씬 더 큰 사태로 번질 수 있습니다."
 algerian_events.300.a: "곧 잠잠해질 것이다."
 algerian_events.300.b: "사태가 걷잡을 수 없이 커질 수도 있다."
 algerian_events.230.t: "알제리를 휩쓴 대규모 시위"
 algerian_events.230.d: "알제리가 정치 개혁과 집권 기득 세력의 퇴진을 요구하는 대규모 지속 시위로 흔들리고 있습니다. 새로운 히라크 운동이라 불리는 이번 시위에서 수십만 명이 전국 각 도시의 거리로 나섰습니다. 국제 사회는 사태의 전개를 예의주시하고 있습니다."
 algerian_events.230.a: "알제리의 중대한 순간."
 ALG_deepen_african_union: "아프리카 연합 협력 심화"
 ALG_deepen_african_union_desc: "알제리는 오래전부터 아프리카 외교의 기둥 중 하나였습니다. 아프리카 연합 내 우리의 역할을 적극적으로 강화함으로써 대륙에서의 영향력을 높이고, 연대를 증진하며, 평화와 경제 통합을 위한 구상을 밀어붙일 수 있습니다. 재정적 비용이 들겠지만 아프리카에서의 정당성이 강화될 것입니다."
 ALG_strengthen_maghreb_union: "마그레브 연합 강화"
 ALG_strengthen_maghreb_union_desc: "북아프리카의 지역 통합이라는 꿈은 손에 잡히지 않았지만, 알제리에는 이를 되살릴 잠재력이 있습니다. 마그레브 이웃 국가들과의 협력을 증진함으로써 무역 장벽을 낮추고, 외교적 신뢰를 높이며, 공유된 문화적·역사적 유대를 강화할 수 있습니다."
 ALG_restoration_of_the_ummah: "움마의 복원"
 ALG_restoration_of_the_ummah_desc: "통합된 이슬람 세계라는 비전이 손에 닿는 곳에 있습니다. 신실한 자들이 하나의 깃발 아래 다시 한번 일어설 것입니다."
 ALG_guidance_council: "지도 평의회"
 ALG_guidance_council_desc: "원로 학자들의 평의회가 우리의 정책을 감독하여 정부가 신의 인도에 충실하도록 보장할 것입니다."
 ALG_restore_the_ummah_experiment: "움마 실험"
 ALG_restore_the_ummah_experiment_desc: "신앙과 법, 지도력을 결합하여 무슬림 세계에 영감을 줄 새로운 통치 모델을 만들어 보고자 합니다."
 ALG_victory_of_the_faithful: "신실한 자들의 승리"
 ALG_victory_of_the_faithful_desc: "우리의 인내와 헌신이 승리를 가져왔습니다. 알제리는 이제 전 세계 신실한 자들의 보루로 우뚝 설 것입니다."
 ALG_exterminate_corruption: "부패 근절"
 ALG_exterminate_corruption_desc: "모든 기관에서 부패를 숙청할 것입니다. 어떤 관리도, 어떤 군인도, 어떤 성직자도 신의 정의 위에 서지 못합니다."
 ALG_to_serve_allah: "알라를 섬기며"
 ALG_to_serve_allah_desc: "우리의 통치는 세속적 야망이 아니라 오직 알라를 위한 것입니다. 모든 정책과 개혁, 투쟁은 그분의 신성한 뜻에 대한 복종을 반영해야 합니다. 알라를 섬기는 것은 국가와 영혼을 모두 정화하는 것입니다."
 ALG_economic_islamization: "경제의 이슬람화"
 ALG_economic_islamization_desc: "우리는 이슬람의 토대 위에 경제를 재건할 것입니다. 이자 기반 체계와 부패는 샤리아에 부합하는 금융, 무역 윤리, 공정한 부의 분배로 대체될 것입니다."
 ALG_rust_belt_rejuvenation_desc: "혼란기에 버려진 공장들이 다시 굉음을 내며 되살아날 것입니다. 신앙과 목적의식의 인도를 받는 노동자들이 알제리의 산업 중심지를 재건할 것입니다."
 ALG_rule_to_perfection_desc: "우리의 통치는 다듬어지고 완전해져야 합니다. 정신의 칼리파국, 영혼의 국가, 신의 규율을 통한 행정의 완성입니다."
 ALG_new_islamic_architecture_desc: "새 시대는 우리 국가에 새로운 얼굴을 요구합니다. 사원과 학교, 공공 건물을 통해 이슬람 예술의 아름다움이 알제리의 부활을 상징할 것입니다."
 ALG_prioritize_military_industries_desc: "신실한 군대는 신실한 산업이 무장시켜야 합니다. 군수 생산을 우선시하여 우리의 국방이 국내의 힘 위에 서도록 할 것입니다."
 ALG_industrialize_the_umma_desc: "산업은 탐욕이 아니라 이슬람을 섬겨야 합니다. 움마는 자급자족하고 생산적이며 자랑스러운, 강철과 신앙으로 움직이는 문명이 되어야 합니다."
 ALG_militarize_the_nation: "국가 군사화"
 ALG_militarize_the_nation_desc: "모든 신자는 움마를 수호할 준비가 되어 있어야 합니다. 우리는 신의 명령 아래 사회를 총동원 체제로 준비시킬 것입니다."
 ALG_soldiers_of_faith: "신앙의 병사들"
 ALG_soldiers_of_faith_desc: "우리 병사들은 땅이나 권력을 위해서가 아니라 신앙 그 자체를 위해 싸웁니다. 신앙의 군대는 이슬람의 방패이자 국가의 검이 될 것입니다."
 ALG_forged_in_belief: "믿음으로 벼려진"
 ALG_forged_in_belief_desc: "신앙은 우리의 강철이며 꺾이지도 굴하지도 않습니다. 알제리의 병사들은 믿음으로 벼려지고 신성한 신념의 인도를 받습니다."
 ALG_disciplined_army_of_god: "규율 있는 신의 군대"
 ALG_disciplined_army_of_god_desc: "우리는 복종과 순수, 흔들림 없는 헌신 위에 세워진 군대를 벼려 낼 것입니다. 모든 병사는 전사이자 신의 종입니다."
 ALG_made_of_steel_and_faith: "강철과 신앙으로 이루어진"
 ALG_made_of_steel_and_faith_desc: "우리의 군단은 쇠의 힘과 예언자들의 신앙으로 행군할 것입니다. 규율과 믿음이 하나로 합쳐져 꺾이지 않는 힘이 될 것입니다."
 ALG_unrestricted_research: "제한 없는 연구"
 ALG_unrestricted_research_desc: "과학은 신앙의 적이 아닙니다. 신성한 목적의 인도 아래 현대 연구를 받아들여 군사 및 기술 역량을 발전시킬 것입니다."
 ALG_ai_military_integration: "AI 군사 통합"
 ALG_ai_military_integration_desc: "인공지능과 자동화는 신성한 질서를 섬기는 도구가 될 것입니다. 이러한 체계를 국방 구조에 통합하여 정밀성과 통제력을 높일 것입니다."
 ALG_new_executors_continent: "대륙의 새로운 집행자"
 ALG_new_executors_continent_desc: "알제리는 아프리카 전역에 신의 정의를 집행할 준비가 되어 있습니다. 우리의 신앙과 강철이 대륙의 운명을 빚을 것입니다."
 ALG_the_future_in_the_present: "현재 속의 미래"
 ALG_the_future_in_the_present_desc: "미래는 이미 우리 곁에 와 있으며, 알라의 지혜의 인도를 받고 인간의 혁신으로 강화됩니다. 우리 국가는 신실한 자들을 새 시대로 이끌 것입니다."
 ALG_destroy_their_will: "그들의 의지를 꺾어라"
 ALG_destroy_their_will_desc: "신앙에 맞서는 모든 자를 정신과 의지, 육체에서 짓밟을 것입니다. 저항은 꺾일 것이며 신성한 질서가 승리할 것입니다."
 ALG_declare_jihad: "지하드 선포"
 ALG_declare_jihad_desc: "우리 운동은 성숙했습니다. 더 이상 설교와 개혁에만 머물지 않을 것입니다. 이슬람 세계 전역의 부패와 폭정에 맞서 지하드를 선포하며 신실한 자들을 무장 아래 하나로 모을 때가 왔습니다."
 ALG_tharir_al_aqsa: "알아크사 해방"
 ALG_tharir_al_aqsa_desc: "알아크사의 해방은 움마의 영원한 의무입니다. 우리는 중동 전역의 신실한 자들을 규합하여 저항과 단결이라는 하나의 깃발 아래 신성한 동맹을 벼려 낼 것입니다."
 ALG_faction_with_middle_east: "중동 전선과 연합"
 ALG_faction_with_middle_east_desc: "중동은 여전히 이슬람의 영적 심장입니다. 다마스쿠스에서 메카에 이르기까지 우리의 부름이 울려 퍼져, 알아크사를 수호하고 억압자들에 맞서길 열망하는 수니파 국가들을 하나로 모을 것입니다."
 ALG_faction_with_north_africa: "북아프리카 전선과 연합"
 ALG_faction_with_north_africa_desc: "리비아의 사막에서 카이로의 거리에 이르기까지 북아프리카의 형제들은 같은 투쟁을 견뎌 왔습니다. 손을 내밀어 그들을 우리의 대의에 초대할 때입니다."
 ALG_faction_with_asia: "동방 전선과 연합"
 ALG_faction_with_asia_desc: "이슬람의 빛은 아라비아 너머에서도 빛납니다. 중앙아시아와 남아시아의 민족들은 초원에서 동방의 섬들에 이르기까지 움마의 부흥에 동참하도록 부름받아야 합니다."
 ALG_faction.1.t: "알제의 초대"
 ALG_faction.1.d: "알제로부터 외교 서한이 우리 정부에 도착했습니다. 현재 알제리에서 집권 중인 이슬람 구국 전선은 중동 국가들에 알아크사의 수호와 해방을 위한 정치적, 물질적 지원을 조율하는 새로운 연합인 알아크사 해방 전선에 가입하도록 초청합니다. 수락하면 우리는 지역적 대의에 묶이게 되고, 거절하면 알제리의 구상과는 거리를 두게 됩니다. 어떻게 대응해야 합니까?"
 ALG_faction.1.a: "수락한다. 알아크사 해방 전선에 가입한다"
 ALG_faction.1.b: "거절한다. 이 지역 연합에는 가입하지 않는다"
 ALG_faction.2.t: "마그레브로부터의 제안"
 ALG_faction.2.d: "알제리 대표단이 북아프리카 정부들에 새로운 연합인 알아크사 해방 전선 내에서 협력을 서약하도록 공식 초청했습니다. 이 제안은 팔레스타인을 위한 정치적 압박과 인도적 지원을 조율하는 마그레브 전선을 추구합니다. 가입하면 알제와의 유대가 깊어지고, 거절하면 현재의 자율성이 유지됩니다. 어떻게 답해야 합니까?"
 ALG_faction.2.a: "그렇다. 마그레브는 함께 설 것이다"
 ALG_faction.2.b: "아니다. 이는 우리가 택할 길이 아니다"
 ALG_faction.3.t: "알제에서 동방으로 보내는 부름"
 ALG_faction.3.d: "알제리 특사들이 아시아 무슬림 국가들에 알아크사의 수호를 위한 외교적, 정치적, 물질적 노력을 조율하는 연합인 알아크사 해방 전선에 가입하라는 제안을 전달했습니다. 이 구상은 지역을 초월한 연대를 요구하지만, 더 넓은 분쟁에 얽힐 위험도 있습니다. 우리는 알제의 연합에 가입하시겠습니까?"
 ALG_faction.3.a: "가입한다. 연대의 부름에 응한다"
 ALG_faction.3.b: "거절한다. 이 얽힘은 피해야 한다"
 ALG_islamic_offices: "이슬람 사무소 설립"
 ALG_islamic_offices_desc: "이슬람의 원칙에 따라 통치하려면 우리 운동은 신앙과 국가를 모두 관리할 수 있는 조직화된 구조를 세워야 합니다. 전국에 이슬람 사무소를 설립함으로써 종교 교육과 사회 문제, 도덕적 지도를 감독하고 통치가 움마의 가치에 부합하도록 보장할 것입니다. 이 사무소들은 우리 새 질서의 근간이 되어 신앙과 규율, 정의 아래 국민을 하나로 묶을 것입니다."
 ALG_integrate_kabylie_tt: "§G카빌리아를 평화적으로 통합§!"
 ALG_improve_relations_with_egypt: "이집트와의 관계 개선"
 ALG_improve_relations_with_egypt_desc: "이집트와 알제리는 주요 아랍 국가로서 깊은 유대를 공유합니다. 무슬림 형제단의 전통에 뿌리를 둔 MSP는 카이로를 자연스러운 파트너로 봅니다. 이집트와의 관계 강화는 아랍 세계에서 우리의 위상을 높이고 경제 및 종교 협력의 문을 열어 줄 것입니다."
 ALG_el_karaouin_uni: "알카라위인 대학"
 ALG_el_karaouin_uni_desc: "세계에서 가장 오래된 이슬람 대학 중 하나와 관계를 맺음으로써, FIS는 새로운 질서에 충성하는 학자 세대를 양성하고 군을 종교적 권위로부터 멀어지게 할 것입니다."
 ALG_father_of_the_ummah: "움마의 아버지"
 ALG_father_of_the_ummah_desc: "이슬람 구국 전선의 지도자는 스스로를 전체 무슬림 공동체의 정신적 아버지로 자리매김하고, 경건함과 신의 위임에 뿌리를 둔 개인숭배를 조성할 것입니다."
 ALG_followers_of_the_prophet: "예언자의 추종자들"
 ALG_followers_of_the_prophet_desc: "국가는 순나의 엄격한 준수를 중심으로 재편됩니다. 시민들은 예언자처럼 살아가야 하며, 정부 기관은 이러한 비전을 반영하도록 개편될 것입니다."
 ALG_governmental_cleansing: "정부 숙청"
 ALG_governmental_cleansing_desc: "국가 기구 내에서 신앙심이 부족하거나 이념적으로 불순하다고 판단되는 자들은 체계적으로 제거되고 운동의 충실한 추종자들로 대체될 것입니다."
 ALG_make_our_nation_pure: "우리 조국을 정화하자"
 ALG_make_our_nation_pure_desc: "FIS는 알제리 사회에서 서구의 영향을 몰아내기 위한 대대적인 사회 캠페인을 개시하여, 교육과 복장, 공공 행동에서 이슬람적 가치를 강제할 것입니다."
 ALG_new_patriotism: "새로운 애국주의"
 ALG_new_patriotism_desc: "알제리에 대한 사랑과 이슬람에 대한 사랑은 하나입니다. FIS는 신앙이 시민적 자긍심과 집단적 목적의 토대가 되는 새로운 국가 정체성을 만들어 낼 것입니다."
 ALG_restore_the_soul_of_the_ummah: "움마의 영혼을 회복하라"
 ALG_restore_the_soul_of_the_ummah_desc: "알제리는 무슬림 세계의 영적 불꽃을 되살리는 신성한 의무를 스스로 짊어지고, 국가를 모든 이슬람 국가의 도덕적 나침반으로 자리매김할 것입니다."
 ALG_sharia_through_discipline: "규율을 통한 샤리아"
 ALG_sharia_through_discipline_desc: "샤리아는 설득이 아닌 엄격한 규율을 통해 집행될 것입니다. 국가는 이슬람법의 완전한 준수를 보장하기 위해 치안 및 처벌 권한을 확대할 것입니다."
 ALG_strength_and_virtue: "힘과 덕목"
 ALG_strength_and_virtue_desc: "강한 국가와 덕망 있는 국민은 불가분의 관계입니다. FIS는 품성이 올바르고 의지가 굳건한 사회를 건설하기 위해 도덕 교육과 제도적 규율 모두에 투자할 것입니다."
 ALG_strict_authority: "엄격한 권위"
 ALG_strict_authority_desc: "새로운 알제리에는 강력한 통치가 필요합니다. FIS는 권력을 중앙집권화하고 치안 예산을 늘려 국민이 운동의 행동 기준을 준수하도록 보장할 것입니다."
 ALG_the_people_are_not_to_be_trusted: "국민은 신뢰할 수 없다"
 ALG_the_people_are_not_to_be_trusted_desc: "민주주의는 부패와 불경으로 가는 관문임이 입증되었습니다. FIS는 민주적 절차를 해체하고 알라께서 요구하시는 바를 아는 이들의 손에 통치를 확고히 맡길 것입니다."
 ALG_urban_preachers: "도시 설교자"
 ALG_urban_preachers_desc: "FIS는 설교자 네트워크를 알제리의 도시들에 파견하여 운동의 이념을 전파하고 국가 이슬람을 공적 생활의 지배적 힘으로 굳힐 것입니다."
 ALG_jamiat_al_karaouin_desc: "고대 알카라위인 기관과의 관계는 FIS 국가에 충성하고 종교 문제에 대한 군의 간섭에 적대적인 새로운 이슬람 학자 계층을 배출했습니다."
 ALG_coalition_economic_program: "연립 경제 프로그램"
 ALG_coalition_economic_program_desc: "대통령 연립은 통일된 경제 비전을 제시해야 합니다. 연립 파트너들의 경제 정책을 조율함으로써 투자를 유치하고 소규모 기업을 지원하며 지속 가능한 성장의 토대를 마련할 수 있습니다. 강력한 경제는 연립의 정당성을 확보하고 비판자들의 입을 다물게 할 것입니다."
 ALG_governmental_transparency: "정부 투명성"
 ALG_governmental_transparency_desc: "우리의 민주적 길이 의미를 가지려면, 우리 이전의 사람들보다 더 높은 기준을 스스로에게 적용해야 합니다. 투명성 조치를 시행하고 정부 기록을 대중의 검증에 공개함으로써, 구세력 내에 적을 만들게 되더라도 부패를 뿌리 뽑고 국민의 제도에 대한 신뢰를 회복할 수 있습니다."
 ALG_support_mujahideen: "무자헤딘 지원"
 ALG_support_mujahideen_desc: "국가 내 일부 세력이 지역 전역에서 활동하는 이슬람주의 전투원에 대한 은밀한 지원을 주장하고 있습니다. 이러한 행동은 급진 네트워크 내 우리의 영향력을 강화하고 적대 세력을 불안정하게 할 수 있지만, 국제사회의 심각한 반발과 장기적인 내부 후폭풍의 위험이 있습니다."
