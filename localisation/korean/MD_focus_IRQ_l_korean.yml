 IRQ_sadrist_militias: "사드르 운동"
 IRQ_sadrist_militias_desc: "마흐디 군의 최신 형태인 사라야 알살람은 이라크군과 함께 최전선에서 싸우고 있는 사드르 운동의 민병대입니다. 그 지도자 무크타다 알사드르는 인기 있는 이라크 시아파 성직자이자 정치인으로, 인기 많았던 아버지로부터 운동을 물려받았습니다. 그의 강령은 정치적 시아파 이슬람, 반미주의, 이란의 영향으로부터의 이라크 독립, 이라크 포퓰리즘적 민족주의의 혼합에 기반합니다."
 IRQ_threat_of_al_qaeda: "다가오는 재앙"
 IRQ_threat_of_al_qaeda_desc: "[IRQ.GetFlag] 이라크 군대의 해체로 인해 많은 병사와 지휘관이 일자리를 잃었습니다. 이로 인해 군 내부의 많은 세력이 국내의 여러 극단주의 집단, 그중 하나인 [AIQ.GetFlag] 이라크 알카에다와 손을 잡았습니다. 방치할 경우 이 집단이 우리 정부를 상대로 공격을 감행할 수 있습니다.\n§W-----------------------------------------------------------------§!\n이 국가 정신은 §H반란 위기§!를 해결하면 §R제거§!됩니다"
 IRQ_sunni_dynamic_idea: "수니파 정치적 영향력"
 IRQ_sunni_dynamic_idea_desc: "우리 국가 내 수니파 공동체는 자신들의 정체성, 생활 방식, 존재감을 지키기 위해 동원되었습니다. 시아파의 부상과 정치 생활에서의 수니파 소외로 인해 이들의 동원은 우리 국가의 이익에 반하여 작용할 것입니다.\n§W-----------------------------------------------------------------§!\n이 국가 정신은 §H수니파 정치 변수§!가 §H10§! 단계 변할 때마다 동적으로 바뀝니다. 현재 수니파 정치적 영향력은 §H[?IRQ_sunni_political_influence]/100§!입니다\n§W-----------------------------------------------------------------§!\n이 국가 정신이 활성화된 동안 살라피주의가 §H20%§! 이상이고, 안정도가 §H55%§! 미만이며, 우리의 국교가 §H시아파§!인 경우 §H[AIQ.GetFlag] 이라크 알카에다§!가 §R내전§!을 일으킬 수 있습니다"
 IRQ_triumph_over_america: "미국에 대한 승리"
 IRQ_triumph_over_america_desc: "우리 병사들은 미국인들에게 결코 잊지 못할 교훈을 가르쳐 주었습니다.."
 IRQ_mosque_income_idea: "모스크 세금 인상"
 IRQ_mosque_income_idea_desc: "국내의 여러 사업에 자금을 대기 위해 우리는 모스크에서 걷는 세금을 인상했습니다"
 IRQ_PIJ_idea: "PIJ 여단"
 IRQ_PIJ_idea_desc: "PIJ 여단이 현재 우리 국가에서 활동하고 있으며, 시온주의 국가에 맞서 싸우는 데 도움을 줄 것입니다.\n§W-----------------------------------------------------------------§!\n이 국가 정신은 §H바트당§!이 더 이상 집권하지 않거나 [ISR.GetFlag] §H이스라엘§!이 더 이상 존재하지 않으면 §R제거§!됩니다."
 IRQ_cult_of_saddam: "사담 숭배"
 IRQ_cult_of_saddam_desc: "우리의 위대한 지도자 사담 후세인은 [IRQ.GetFlag] 이라크에 막대한 부와 존엄을 가져다주었습니다. 그의 공헌은 그가 아직 곁에 있는 동안 소중히 여겨져야 합니다..\n§W-----------------------------------------------------------------§!\n이 국가 정신은 §H바트당§!이 더 이상 집권하지 않거나 §H사담 후세인§!이 더 이상 지도자가 아니면 §R제거§!됩니다."
 IRQ_air_support_granted: "반군에 대한 공중 지원"
 IRQ_air_support_granted_desc: "우리 공군은 국내 반군에 맞서 공중 지원을 제공하기 위해 밤낮없이 가동되고 있습니다"
 IRQ_recovering_from_the_gulf_war: "걸프전으로부터의 회복"
 IRQ_recovering_from_the_gulf_war_desc: "걸프 전쟁의 참혹한 결과로, 이라크는 혼란과 파괴의 상태에 놓였습니다. 격렬한 공중과 지상 작전이 특징이었던 이 충돌은 국가에 지속적인 영향을 남긴 중요한 전투들을 목격했습니다. 초기 공습과 쿠웨이트 해방에서부터 이라크 군을 후퇴시킨 지상 전투에 이르기까지, 전쟁은 이라크에 큰 대가를 치르게 했습니다."
 IRQ_MEK_bases: "MEK 기지"
 IRQ_MEK_bases_desc: "이란-이라크 전쟁 당시 무자헤딘 에 칼크(MEK)의 전략적 중요성을 인식한 이라크는 그들의 지원을 활용하고 기지를 구축하여 군사 능력을 강화하고자 합니다. 이를 통해 이라크 내에 이란을 위협할 MEK 기지를 설치할 수 있으며, 동원 가능한 최대 의용군 수가 증가합니다. 1991년 쿠르드족에 대해 활용했던 것과 같습니다."
 IRQ_high_political_opposition: "높은 정치적 반대"
 IRQ_high_political_opposition_desc: "이라크는 다양한 소수 민족 집단과 종교 공동체를 아우르는 높은 정치적 반대와 씨름하며 중대한 도전에 직면해 있습니다."
 IRQ_bastion_of_baathism: "바트주의의 보루"
 IRQ_bastion_of_baathism_desc: "비옥한 이라크의 땅에 바트주의의 씨앗이 뿌려졌고, 그 시대의 도전과 열망 속에서 싹을 틔웠습니다. 민족 통합, 아랍 민족주의, 사회 정의에 대한 추구를 갈망한 선구적 지도자들이 나타났습니다. 아랍인들이여 영원히 하나이기를!"
 IRQ_international_sanctions: "국제 제재"
 IRQ_international_sanctions_desc: "2000년, 이라크는 1991년 걸프 전쟁 후 국제 제재로 인한 심각한 영향을 겪고 있었습니다. 이 제재는 이라크가 국제 무역에 참여하는 것을 심각하게 제한했으며, 경제 회복을 방해하고 이라크 국민들의 생활 수준 저하를 초래했습니다. 제재는 또한 의료, 필수 서비스, 기본적인 생활 필수 자원에 대한 접근에 큰 인도적 영향을 미쳤습니다. 이 제재의 장기적인 영향은 이 기간 동안 이라크의 경제와 사회 환경을 형성하는 주요 요소가 되었습니다."
 IRQ_conscriptions_in_schools: "학교 징집"
 IRQ_conscriptions_in_schools_desc: "우리는 아이들이 수업을 빠지고 군대에 입대하도록 허용하고 있습니다."
 IRQ_fadayyene_saddam: "사담 페다이 민병대"
 IRQ_fadayyene_saddam_desc: "우리는 사담 페다이 여러 부대에 전국에 방어 진지를 구축하도록 명령했습니다."
 IRQ_kurdish_friends: "[KUR.GetFlag] 쿠르드족의 친구"
 IRQ_kurdish_friends_desc: "[KUR.GetFlag] 쿠르드족은 역사적으로 지역 대부분의 국가들에게 배척당해 고립되었으며 친구가 거의 없습니다. 이제 우리가 원하는 것, 즉 해방과 자유, 외세로부터의 독립을 얻을 수 있도록 [KUR.GetFlag] 쿠르드족과의 우정을 강화할 때가 되었습니다."
 IRQ_negotiations_with_kurdish_government: "[KUR.GetFlag] 쿠르드 정부와의 협상"
 IRQ_negotiations_with_kurdish_government_desc: "[KUR.GetFlag] 쿠르드 정부와 의사소통 채널을 열면 유혈 사태 없이 쿠르드 민족을 우리 국가에 재통합할 수 있을 것입니다."
 IRQ_bolster_communist_party_of_kurdistan_iraq: "[KUR.GetFlag] 쿠르디스탄 내 £KUR_Neutral_Communism_small  공산주의 이상 강화"
 IRQ_bolster_communist_party_of_kurdistan_iraq_desc: "[KUR.GetFlag] 쿠르드 민족에게 필요한 것은 단 하나, 모든 형태의 외세 착취로부터의 독립과 해방입니다. [KUR.GetFlag] 쿠르디스탄에 공산주의 이상을 심고 장려함으로써, 그들의 국민이 마침내 이 운동에서 우리와 손을 맞잡도록 설득할 수 있을 것입니다."
 IRQ_request_an_election: "선거 요청"
 IRQ_request_an_election_desc: "현 [KUR.GetFlag] 쿠르드 정부에 선거를 실시하도록 압박함으로써, [KUR.GetFlag] 쿠르드 공산주의자들은 마침내 정당한 자리를 차지할 기회의 창을 얻을 수 있습니다."
 IRQ_rojava_shipments: "[ROJ.GetFlag] 로자바로의 수송 개시"
 IRQ_rojava_shipments_desc: "[SYR.GetFlag] 시리아 정부는 역사적으로 [ROJ.GetFlag] 로자바 지역의 쿠르드족을 탄압해 왔으며, 우리는 가능한 곳에서 필요한 지원을 제공함으로써 이들을 해방시킬 방법을 찾아야 합니다."
 IRQ_shipping_to_rojava: "수송 진행 중..."
 IRQ_shipping_to_rojava_desc: "화물 트럭의 바퀴가 시리아의 땅 위에서 쉼 없이 굴러갑니다."
 IRQ_political_decisions: "이라크 국내 정치"
 IRQ_recall_nsa_bahrain: "NSA 바레인 회수"
 IRQ_recall_nsa_bahrain_desc: "미국인들이 점유한 땅인 NSA 바레인에 대한 통제권을 장악하고 공고히 할 때가 되었습니다!"
 IRQ_mek_revolt_trig: "봉기"
 IRQ_mek_revolt_trig_desc: "오늘 우리는 MEK의 동지들이 이란으로 국경을 넘어 진격하도록 하여 물라 정권을 완전히 전복시킬 수 있습니다!"
 IRQ_the_blood_quran: "'피의 쿠란' 완성"
 IRQ_the_blood_quran_desc: "사담 후세인의 피로 쓰인 피의 쿠란을 완성하고 공표함으로써, 우리 정부는 [IRQ.GetFlag] 이라크 국민에게 자신의 경건함을 보여 줄 수 있지만, 역효과를 낳을 수도 있습니다..."
 IRQ_smuggle_goods_from_jordan: "[JOR.GetFlag] 요르단산 물품 밀수"
 IRQ_smuggle_goods_from_jordan_desc: "후세인 가문은 [JOR.GetFlag] 요르단의 특정 인물들과 많은 인맥이 있으며, 이 인맥을 활용하여 정부가 알아채지 못하도록 일부 물품을 국경 너머로 밀수할 수 있습니다."
 IRQ_al_salam_palace: "알살람 궁전 재설계"
 IRQ_al_salam_palace_desc: "알살람 궁전은 50년도 더 전인 1950년에 처음 설계되었으며, 그 이후 궁전은 노후한 모습을 보이기 시작했습니다. 궁전의 특정 부분을 재설계하면 [IRQ.GetLeader]이(가) 필요할 때 머리를 식히는 데 도움이 될 수 있습니다."
 IRQ_arrest_muqtada: "무크타다 알사드르 체포"
 IRQ_arrest_muqtada_desc: "그 바퀴벌레 같은 무크타다가 최근 입을 놀리고 있으며, 그의 아버지와 마찬가지로 해결책을 찾아야 할지도 모릅니다.."
 IRQ_civil_war_mechanic: "반란 위기"
 IRQ_civil_war_mechanic_desc: "§H사담 정권§!의 붕괴는 이라크군의 완전한 붕괴로 이어졌습니다. 우리의 §H전직 군인§! 다수가 자신들의 조직이든 §R지하디스트§! 조직이든 우리 국가에 §R맞서는§! 전쟁에 목숨을 바치고 있습니다. 우리는 처음에 §R살라피§!와 충돌하게 되지만, 우리가 동맹을 맺지 않는다면 §H시아파§!도 빠르게 적대적으로 돌변할 수 있습니다. 우리는 각 주의 반군이 충분히 약해져 §H항복§!할 때까지 공격해야 합니다. 우리의 §H준비 태세§!가 작전에서의 성공 여부를 좌우합니다. §H준비 태세§!는 더 많은 작전을 수행하거나 특정 중점을 선택할 때 향상됩니다.\n\n주를 클릭하여 작전을 수행할 수 있습니다. 작전을 수행할 때마다 §H장비§!와 §H인원§!을 잃게 됩니다.\n\n지도는 우리의 §H진행 상황§!을 표시하기 위해 §H동적으로§! 색이 바뀝니다.\n\n§p보라색§! - 쿠르드 세력\n§R빨간색§! - 살라피 지하디스트 세력\n§Y노란색§! - 시아파 세력\n§O주황색§! - 중간 수준 반란\n§G초록색§! - 낮은 수준 반란\n\n§H준비 태세§!: [?IRQ_government_readiness]%\n§H인원§!: [?IRQ_government_troops]\n§H확보한 주§!: [?IRQ_variable_for_win]\n\n\n\n\n\n"
 IRQ_start_negotiations_shias: "시아파 민병대와 협상 개시"
 IRQ_start_negotiations_shias_desc: "우리는 공동의 적을 파괴하기 위한 합의를 도출하고자, 결성된 수많은 시아파 민병대와 협상 테이블에 앉을 것입니다. 이들을 신속히 우리 편으로 끌어들이지 못하면 적대적으로 돌변할 수 있습니다!"
 IRQ_request_coalition_forces: "공중 지원 요청"
 IRQ_request_coalition_forces_desc: "공군이 하루 종일 아무것도 하지 않는다면, 우리가 왜 조종사들에게 비용을 지불하고 있겠습니까? 반군을 굴복시키기 위해 우리가 하늘에서 가진 우위를 활용해야 합니다."
 IRQ_request_awakening_council_militias: "알사흐와 협상 촉진"
 IRQ_request_awakening_council_militias_desc: "알사흐와, 즉 이라크의 아들들은 반군에 맞서 싸우기 위한 수니파 부족과 기타 집단 간의 제안된 동맹입니다. 우리는 반군에 대해 수적 우위를 점하도록 그들의 병력을 편입시킬 수 있습니다."
 IRQ_militarize_police_force: "경찰력 군사화"
 IRQ_militarize_police_force_desc: "우리는 경찰로부터 무기와 인력을 확보하여 군에 편입시키고, 훈련을 소홀히 하게 되더라도 반군에 맞서 싸우는 데 활용할 것입니다."
 IRQ_recruitment_campaign: "훈련 노력"
 IRQ_recruitment_campaign_desc: "우리는 반군을 안전하고 효율적으로 상대할 수 있도록 병력을 훈련시키고 단련해야 합니다. 이는 위험에 처하는 목숨을 줄이는 데에도 도움이 됩니다."
 IRQ_iraq_war: "생존을 위한 투쟁"
 IRQ_iraq_war_desc: "이라크와 그 영토를 둘러싼 전쟁이 시작되었습니다. 미국은 이라크 정부를 굴복시키는 데 최대 6개월이 주어지며, 그렇지 못하면 즉각 이라크에서 철수를 명령하고 영향력을 잃을 위험을 감수해야 합니다."
 IRQ_war_phase_one: "1단계"
 IRQ_war_phase_two: "2단계"
 IRQ_war_phase_two_desc: "미국인들은 흔들릴 것이며, 그들의 노력은 허사가 될 것입니다!"
 IRQ_preparation_for_the_war: "전쟁"
 IRQ_preparation_for_the_war_desc: "[USA.GetFlag] §H[USA.GetName]§!에 있는 제국주의자들이 우리 나라에 대해 §R정당하지 않은§! 캠페인을 시작했습니다!\n\n우리는 우리의 국가적 힘과 자원을 모아 §H생존의 전쟁§!을 준비해야 합니다. 우리가 가진 것과 §H 이란 전쟁§!과 §H 걸프 전쟁§!에서 얻은 경험을 바탕으로, 어떤 침략자에게도 지옥 같은 상황을 만들 것입니다.\n\n만약 우리가 미국인들을 §H 6달동안§! 동안 막아낼 수 있다면, 그들의 인구는 전쟁의 인기 없음으로 인해 §H 휴전§!을 요구할 것입니다!"
 IRQ_threaten_kuwait: "[KUW.GetFlag] 쿠웨이트 위협"
 IRQ_threaten_kuwait_desc: "미국인들은 바로 우리 코앞에 기지를 두고 있으며, 이는 쿠웨이트인들의 잘못입니다. 미국이 중동 땅에서 우리를 공격하지 못하도록 신속히 통제권을 장악하라고 요구할 것입니다."
 IRQ_restore_the_iron_ring: "철의 고리 복원"
 IRQ_restore_the_iron_ring_desc: "철의 고리는 80년대 이란-이라크 전쟁에서 이란군에 맞서 방어하는 데 유용함이 입증되었습니다. 우리는 이를 신속히 재구축해야 합니다."
 IRQ_golden_guard_divisions: "황금 수비대 사단 편성"
 IRQ_golden_guard_divisions_desc: "우리는 국가 방어를 위해 황금 수비대 사단 몇 개를 동원할 것이며, 가능한 한 최고 수준으로 훈련시킬 것입니다."
 IRQ_conscription_in_schools: "학교 징집"
 IRQ_conscription_in_schools_desc: "전시에 부대를 운용하려면 더 많은 인력을 반드시 확보해야 하며, 학교는 바로 그 이유에서 완벽한 장소입니다. 교육은 나중에 받아도 됩니다."
 IRQ_kurdish_compromise: "[KUR.GetFlag] 쿠르드족과의 타협"
 IRQ_kurdish_compromise_desc: "우리는 [KUR.GetFlag] 쿠르드족과 합의에 도달할 것이며, 그들이 받아들인다면 갑작스러운 공격으로부터 북부 전선을 확보할 수 있습니다."
 IRQ_faddayean_saddam: "사담 페다이 동원"
 IRQ_faddayean_saddam_desc: "우리는 다가오는 침공에 대비해 사담 페다이를 준비시켜야 하며, 어떻게든 싸움을 계속할 수 있도록 더 많은 사단을 장비하고 훈련시켜야 합니다."
 IRQ_weapons_concealment: "미사일 계획 가속"
 IRQ_weapons_concealment_desc: "필요할 경우 멀리서 적에게 타격을 입히기 위해 미사일 계획을 신속히 가속해야 합니다."
 IRQ_contract_the_MEK: "£PER_anarchist_communism MEK 고용"
 IRQ_contract_the_MEK_desc: "무자헤딘 에 칼크, 즉 £PER_anarchist_communism MEK는 매우 오랫동안 우리나라에 거주해 왔습니다. 이제 그들이 우리 국가에 실제로 유용한 일을 하도록 할 때가 되었습니다."
 IRQ_economic_union_menu: "이슬람 번영 연합"
 IRQ_invite_to_economic_union_targeted_decision: "[FROM.GetName] 초청"
 IRQ_kick_from_economic_union_targeted_decision: "[FROM.GetName] 추방"
 IRQ_the_constitution: "이라크 헌법"
 IRQ_the_constitution_desc: "§Y사담 후세인§!과 뒤이은 §Y바트§!당의 전복 이후, 우리 국가는 보다 §Y민주적이고 자유로운 이라크§!를 위해 §Y새 헌법을 기초§!하는 임무를 맡게 되었습니다. 우리가 기초하는 §Y헌법§!의 각 §Y조항§!은 앞으로 어떤 정당이 선출될 수 있는지, 그리고 누가 정치에 참여할 수 있는지에 §Y영향§!을 미칠 것입니다."
 IRQ_constitution_draft_government_type: "제1조: 이라크 정부"
 IRQ_constitution_draft_government_type_desc: "헌법에는 우리 국가가 이슬람 공화국이 될지, 세속 공화국이 될지가 명시되어야 합니다."
 IRQ_constitution_draft_languages: "제2조: 이라크의 언어"
 IRQ_constitution_draft_languages_desc: "언어는 우리 국민을 하나로 묶는 것이며, 상당수가 아랍어가 아닌 다른 언어를 사용합니다. 우리는 다른 언어를 국가 언어로 허용할지 여부를 결정해야 합니다."
 IRQ_constitution_draft_nationalism: "제3조: 이라크의 애국심"
 IRQ_constitution_draft_nationalism_desc: "역사가 보여 주듯, 극단적 민족주의와 애국주의는 우리 국가의 몰락으로 이어졌습니다. 우리는 제3조에서 이를 명확히 해야 합니다."
 IRQ_constitution_draft_democratic_form: "제4조: 이라크의 연방화"
 IRQ_constitution_draft_democratic_form_desc: "우리 국가는 쿠르드족, 아시리아인, 투르크멘인 등 수많은 다양한 민족 집단으로 이루어져 있습니다. 또한 종교 종파, 특히 시아파와 수니파 사이에 큰 분열이 있습니다. 이 모든 것은 헌법에서 다루어져야 합니다."
 IRQ_constitution_draft_militias: "제5조: 이라크의 안보"
 IRQ_constitution_draft_militias_desc: "우리 국가에 군대가 있더라도 많은 국민은 정부가 자신들의 안전을 지켜 줄 것이라고 믿지 않으며, 이에 따라 민병대를 결성했습니다. 우리는 이러한 민병대가 합법인지 여부를 명확히 해야 합니다."
 IRQ_constitution_draft_identity: "제6조: 이라크의 정체성"
 IRQ_constitution_draft_identity_desc: "이라크는 많은 민족으로 구성되어 있으며, 우리는 이라크가 아랍 정체성을 채택할지, 다문화적 정체성을 채택할지 명확히 해야 합니다."
 IRQ_black_gold_decisions: "검은 황금"
 IRQ_black_gold_decisions_desc: "승리 이후 계획의 일부는 지역 내 경제적 지배를 확보하는 것입니다. 남부 걸프 국가들의 부패를 이용하여 우리는 그들의 가장 귀중한 자원인 석유에 대한 장악력을 서서히 높일 수 있습니다. 이 귀중한 자원을 장악하는 데 한 걸음 더 다가갈 수 있는 새로운 결정(지분을 더 매입하는 것 등)을 이용하려면 이들 국가에서 우리의 영향력을 늘려야 합니다. 아람코에 대한 통제력이 50을 넘으면 회사를 장악하려는 시도를 할 수 있습니다. 통제력이 높을수록 성공 확률도 높아집니다.\n\n[SAU.GetFlag] 아람코 통제력: [?IRQ_aramco_control]/100"
 IRQ_open_aramco_scheme: "[SAU.GetFlag] 아람코 계획 결정 열기"
 IRQ_close_aramco_scheme: "[SAU.GetFlag] 아람코 계획 결정 닫기"
 IRQ_find_dirt_on_saudi_king: "[SAU.GetLeader]의 비밀 찾기"
 IRQ_find_dirt_on_saudi_king_desc: "아람코 주식을 손에 넣기 위한 첫 단계는 [SAU.GetFlag] [SAU.GetLeader]을(를) 협박할 만한 무언가를 찾는 것입니다."
 IRQ_establish_the_hussein_fund: "후세인 기금 설립"
 IRQ_establish_the_hussein_fund_desc: "후세인 기금을 설립함으로써 우리는 큰 주목을 끌지 않고 이 조직을 통해 [SAU.GetFlag] 아람코 주식에 자금을 흘려보낼 수 있습니다."
 IRQ_buy_shares_of_aramco: "지분 매입"
 IRQ_buy_shares_of_aramco_desc: "후세인 기금이 마련되었으므로 [SAU.GetFlag] 아람코의 소량 지분을 매입할 수 있으며, 이 초기 투자 이후 더 큰 규모를 매입할 수 있게 됩니다."
 IRQ_prop_up_iraqi_ceo: "[IRQ.GetFlag] 이라크인 CEO 옹립"
 IRQ_prop_up_iraqi_ceo_desc: "수완을 발휘하여 [IRQ.GetFlag] 이라크인 CEO를 [SAU.GetFlag] 아람코의 새 CEO로 옹립함으로써 회사에 대한 우리의 통제력을 높일 수 있습니다."
 IRQ_seize_aramco: "[SAU.GetFlag] 아람코 장악"
 IRQ_seize_aramco_desc: "때가 왔습니다. [SAU.GetFlag] [SAU.GetName]의 귀중한 자원을 확보하기 위해 회사에 대한 공격적인 인수를 시작해야 합니다!"
 IRQ_send_over_iraqis_to_saudi_arabia: "[IRQ.GetFlag] 이라크인들을 [SAU.GetFlag] [SAU.GetName]에 파견"
 IRQ_send_over_iraqis_to_saudi_arabia_desc: "수천 명의 [IRQ.GetFlag] 이라크인들의 항공료를 대줌으로써 [SAU.GetFlag] [SAU.GetName]에서 [IRQ.GetFlag] 이라크의 적절한 영향력을 확보할 수 있습니다."
 IRQ_encourage_iraqis_to_work_for_aramco: "[IRQ.GetFlag] 이라크인들의 [SAU.GetFlag] 아람코 취업 장려"
 IRQ_encourage_iraqis_to_work_for_aramco_desc: "[SAU.GetName]에 보낸 인원들을 [SAU.GetFlag] 아람코에서 일하게 함으로써 회사 내부에 잠재적인 인맥을 구축할 수 있습니다."
 IRQ_buy_more_shares: "지분 추가 매입"
 IRQ_buy_more_shares_desc: "후세인 기금을 통해 회사의 지분을 더 매입함으로써 [SAU.GetFlag] 아람코에 대한 우리의 통제력을 높일 수 있습니다."
 IRQ_regional_baathism_decisions: "£IRQ_Nat_Autocracy_small 지역 바트주의"
 IRQ_regional_baathism_decisions_desc: "우리 세력은 지역과 전 세계 곳곳에 지지자들이 있습니다. 바트주의 이념의 추종자들을 결집함으로써 우리가 통제하는 지역 사령부 네트워크를 구축할 수 있습니다. 이라크의 고위 충성 관리들을 그 지도자로 앉힘으로써 이들 국가의 완전한 충성을 확보할 수 있습니다."
 IRQ_appoint_control_syria: "£IRQ_Nat_Autocracy_small [SBP.GetFlag] 시리아 지역 사령부 설립"
 IRQ_appoint_control_egypt: "£IRQ_Nat_Autocracy_small [EBP.GetFlag] 이집트 지역 사령부 설립"
 IRQ_appoint_control_jordan: "£IRQ_Nat_Autocracy_small [JBP.GetFlag] 요르단 지역 사령부 설립"
 IRQ_clergy_balance_of_power_category: "신앙 회귀 운동"
 IRQ_secularists_bop_mid_range: "이슬람주의와 세속주의 사이"
 IRQ_secularists_bop_left_win_range: "세속화된 국가"
 IRQ_secularists_bop_left_advanced_range: "고도로 세속화된 사회"
 IRQ_secularists_bop_left_medium_range: "사회 내 자유주의의 성장"
 IRQ_secularists_bop_left_low_range: "온건히 세속화된 사회"
 IRQ_clergy_bop_right_win_range: "샤리아 국가"
 IRQ_clergy_bop_right_advanced_range: "이슬람 사회"
 IRQ_clergy_bop_right_medium_range: "이슬람 이상의 부활"
 IRQ_clergy_bop_right_low_range: "온건한 이슬람 사회"
 IRQ_promote_female_participation: "여성 참여 장려"
 IRQ_promote_female_participation_desc: "우리는 여성들이 사회에 참여하고 노동력의 중요한 일부가 되도록 장려할 것입니다."
 IRQ_promotion_of_iraqi_identity: "이라크 정체성 고취"
 IRQ_promotion_of_iraqi_identity_desc: "우리 국민은 자신들이 누구인지 알아야 하며, 그들의 역사, 문화, 언어는 강화되어야 할 정체성의 일부입니다."
 IRQ_restoration_of_ancient_sights: "역사 유적 복원"
 IRQ_restoration_of_ancient_sights_desc: "우리의 과거는 우리 국가의 매우 중요한 부분입니다. 국민은 자신들이 한때 이룩했던 위대함과, 다시 한번 추구해야 할 위대함을 깨달아야 합니다."
 IRQ_promotion_of_saddam: "바트당 업적 선전"
 IRQ_promotion_of_saddam_desc: "모든 거리와 가정, 사무실, 학교에 바트 역사상 가장 위대한 지도자의 초상화가 걸려 있어야 합니다. 국민은 누가 이 국가를 세웠으며 누구에게 감사해야 하는지 알아야 합니다."
 IRQ_power_of_mosques: "모스크의 권한 확대"
 IRQ_power_of_mosques_desc: "이 국가에서 권력은 모스크가 쥐고 있으며, 우리는 이를 받아들여야 합니다. 그들의 권한을 확대함으로써 우리가 그들 편에 서 있음을 보여 줄 수 있습니다."
 IRQ_crack_down_on_haram: "부도덕한 행위에 대한 반격"
 IRQ_crack_down_on_haram_desc: "우리 사회는 서방 제국주의의 가면 아래 부패해서는 안 됩니다. 이라크 사회로의 이러한 침투에 가능한 모든 수단을 동원해 맞서 싸워야 합니다."
 IRQ_upholding_sharia: "샤리아 수호"
 IRQ_upholding_sharia_desc: "이 땅의 법은 샤리아이며, 일부 악인들이 사회 규범을 피하려 할 경우 이를 수호하는 것이 우리의 의무입니다."
 IRQ_clergy_right_side: "이슬람주의자"
 IRQ_secularists_bop_left_side: "세속주의자"
 IRQ_debaath_balance_of_power_category: "£IRQ_Nat_Autocracy_small [IRQ.GetFlag] 이라크의 탈바트화"
 IRQ_baathists_bop_right_low_range: "바트주의자 모임"
 IRQ_baathists_bop_right_medium_range: "바트주의자 시위"
 IRQ_baathists_bop_right_advanced_range: "바트주의의 부활"
 IRQ_baathists_bop_right_win_range: "바트주의자 쿠데타"
 IRQ_antibaathists_bop_left_low_range: "정부의 탈바트화"
 IRQ_antibaathists_bop_left_medium_range: "바트주의자 탄압"
 IRQ_antibaathists_bop_left_advanced_range: "일상생활의 탈바트화"
 IRQ_antibaathists_bop_left_win_range: "이라크 내 바트주의의 종말"
 IRQ_antibaathists_bop_mid_range: "취약한 정부"
 IRQ_antibaathists_bop_left_side: "반바트주의자"
 IRQ_baathists_right_side: "바트주의자"
 IRQ_anti_baath_sentiment_schools: "학교 내 반바트 정서"
 IRQ_anti_baath_sentiment_schools_desc: "후세인 일가는 집권 당시 이라크 교육 제도에 큰 해악을 끼쳤으며, 정부 선전으로 학교에 다닌 모든 이들의 정신을 좀먹었습니다. 우리는 이 피해를 되돌리고 학생들이 바트주의자들의 진정한 공포를 깨닫도록 해야 합니다."
 IRQ_anti_baath_ad_campaigns: "반바트 텔레비전 캠페인"
 IRQ_anti_baath_ad_campaigns_desc: "이라크 국민은 많은 시간을 소파에 앉아 혼자 또는 가족과 함께 텔레비전을 시청하며 보냅니다. 우리는 그들이 프로그램 사이사이에 바트주의자들이 저지른 잔혹 행위를 잊지 않도록 해야 합니다."
 IRQ_persecute_potential_baathists: "잠재적 바트주의자 조사"
 IRQ_persecute_potential_baathists_desc: "이라크 사회의 틈새에 숨어든 바트당 동조자가 여전히 많습니다. 이 어리석은 자들에 대한 조사에 착수하는 것이 이로울 것입니다."
 IRQ_sunni_in_politics: "종파 지진"
 IRQ_sunni_in_politics_desc: "우리 정부는 국내 수니파와 관련된 세 가지 요소, 즉 §H만족도§!, §H급진화§!, §H정치적 영향력§!을 관리해야 합니다.\n\n만족도는 수니파가 정부의 의사 결정에 대해 느끼는 전반적인 행복을 좌우합니다. 수니파 §H만족도§!가 §H30/50§! 미만이면 §H급진화§!가 서서히 증가하기 시작합니다. 또한 §H만족도§!가 낮을수록 §H급진화§!가 증가할 때마다 그 속도가 기하급수적으로 빨라집니다(배가되기 시작합니다).\n\n§H급진화§!는 이라크 수니파가 극단주의 집단에 가담하는 빈도와 그들이 정치적으로 얼마나 활동적인지를 나타냅니다. 수니파 사이의 §H급진화§!가 증가할 때마다 그들은 정치적으로 더 활발해지고 더 높은 §H정치적 영향력§!을 갖게 됩니다.\n\n§H정치적 영향력§!은 국내 수니파 주도 정당의 성장을 좌우합니다. 또한 수니파 §H정치적 영향력§!과 §H급진화§!가 높을 경우 수니파 장군들이 쿠데타를 일으킬 무작위 확률이 있습니다.\n\n수니파 만족도: §H[?IRQ_sunni_satisfaction]/50§!\n수니파 급진화: §H[?IRQ_sunni_radicalization]/75§!\n수니파 정치적 영향력: §H[?IRQ_sunni_political_influence]/100§!"
 IRQ_satisfy_sunnis: "수니파의 요구 충족"
 IRQ_satisfy_sunnis_desc: "수니파의 호감을 얻으려면 그들의 생활 수준 향상에 더 많은 자원을 투입하고, 주로 시아파 인사들이 이끄는 우리 정부에서 그들에게 더 큰 발언권을 주어야 합니다."
 IRQ_redirect_sunni_resources: "수니파 자원 전용"
 IRQ_redirect_sunni_resources_desc: "수니파 공동체는 자원이 줄어들어도 개의치 않을 것입니다. 특히 우리 정부는 이 필수 자원이 분명히 필요하기 때문입니다."
 IRQ_make_a_promise: "약속하기"
 IRQ_make_a_promise_desc: "수니파 주민 사이의 낮은 만족도로 인해, 우리 정부가 임무를 수행할 자격이 있음을 입증할 기회를 줄 약속을 할 수 있습니다.\n§W-----------------------------------------------------------------§!\n이 결정은 180일 후에 다시 사용할 수 있습니다."
 IRQ_resolve_the_crisis: "위기 해결"
 IRQ_resolve_the_crisis_desc: "우리 국가를 뒤흔든 종파 지진을 해결해야 할 때가 왔습니다.."
 IRQ_lower_iranian_influence_1: "[PER.GetFlag] 이란의 영향력 대처"
 IRQ_lower_iranian_influence_1_desc: "우리는 수니파에게 이란의 영향력을 낮추겠다고 약속했습니다."
 IRQ_anbar_infrastructure: "안바르 기반시설 개선"
 IRQ_anbar_infrastructure_desc: "우리는 안바르의 기반시설을 개선하겠다고 약속했습니다."
 IRQ_salahuddin_infrastructure: "살라후딘 기반시설 개선"
 IRQ_salahuddin_infrastructure_desc: "우리는 살라후딘의 기반시설을 개선하겠다고 약속했습니다."
 IRQ_nineveh_infrastructure: "니네베 기반시설 개선"
 IRQ_nineveh_infrastructure_desc: "우리는 니네베의 기반시설을 개선하겠다고 약속했습니다."
 IRQ_anbar_airbase: "안바르 공항 개선"
 IRQ_anbar_airbase_desc: "우리는 안바르에 위치한 공항을 개선하겠다고 약속했습니다."
 IRQ_salahuddin_airbase: "살라후딘 공항 개선"
 IRQ_salahuddin_airbase_desc: "우리는 살라후딘에 위치한 공항을 개선하겠다고 약속했습니다."
 IRQ_nineveh_airbase: "니네베 공항 개선"
 IRQ_nineveh_airbase_desc: "우리는 니네베에 위치한 공항을 개선하겠다고 약속했습니다."
 IRQ_economic_prosperity: "경제 상황 개선"
 IRQ_economic_prosperity_desc: "우리는 이라크의 경제 상황을 개선하겠다고 약속했습니다."
 IRQ_smaller_government: "정부 권한 제한"
 IRQ_smaller_government_desc: "우리는 정부가 이라크 사회에서 더 작은 역할을 맡도록 보장하겠다고 약속했습니다."
 IRQ_sunni_internet: "인터넷 기반시설 개선"
 IRQ_sunni_internet_desc: "우리는 수니파가 거주하는 서부 지역의 인터넷 기반시설을 개선하겠다고 약속했습니다."
 IRQ_pmf_decisions: "인민동원군"
 IRQ_pmf_decisions_desc: "§HPMF§!, 즉 §H인민동원군§!은 국가 안보를 위해 하나의 포괄 조직으로 뭉친 일련의 §H민병대§!입니다. 우리는 적과의 전쟁에 대비해 비용을 들여 이 §H민병대§!를 §H동원§!할 수 있습니다. 완전한 동원에는 수년이 걸릴 수 있으나, 동원율에 비례하여 언제든 §HPMF§!를 배치할 수 있습니다.\n\n§HPMF§!가 배치된 동안에는 §R병력 유지비가 증가§!하지만, 예산을 절약하기 위해 이들을 §H동원 해제§!할 수 있습니다.\n\n전쟁 중에는 동원이 매달 평소의 §H두 배§! 속도로 진행됩니다."
 IRQ_begin_mobilization: "동원 개시"
 IRQ_begin_mobilization_desc: "PMF를 동원함으로써 우리는 지역 내 어떤 위협에도 맞설 수 있는 필요한 규모의 병력을 확보할 수 있습니다."
 IRQ_stop_mobilization: "동원 중단"
 IRQ_stop_mobilization_desc: "PMF의 동원을 유지하는 것은 비용이 많이 드는 일이며, 우리 국가를 경제 붕괴로부터 지키기 위해서는 PMF의 동원을 중단해야 합니다."
 IRQ_deploy_the_pmf: "PMF 배치"
 IRQ_demobilize_the_pmf: "PMF 동원 해제"
 IRQ_demobilize_the_pmf_desc: "PMF의 지원이 더 이상 우리 군에 쓸모가 없으므로 동원을 해제할 때가 되었습니다."
 IRQ_spring_of_islam: "이슬람의 봄"
 IRQ_spring_of_islam_desc: "우리 동맹과 이념의 영향력을 확대하기 위해 어느 정도 §H시아파 운동§!이 존재하는 국가들에 §H시아파 혁명§!을 수출해야 합니다. 우리는 운동을 이슬람적 성격으로 위장하되, 우리 영향력이 가로채이는 일이 없도록 §H시아파§! 지도자와 단체가 주도하게 할 것입니다. 혁명이 일어날 때 이들을 우리 편으로 끌어들일 수 있도록 각국 내 영향력을 넓혀 그들의 §H군대와 정부 기관§!에 영향을 미칠 것입니다. 첫 단계는 반군을 무장시키고 자금을 지원하는 것이며, 그 후 이들이 §H혁명§!을 시작하도록 승인할 수 있습니다.\n"
 IRQ_arm_rebels_in_jordan: "[JOR.GetFlag] 요르단 반군 무장"
 IRQ_arm_rebels_in_jordan_desc: "우리는 [JOR.GetFlag] 요르단의 시아파에 자금을 지원하고 훈련시키고 무장시켜 [JOR.GetFlag] 요르단 정부를 전복하고 이슬람 공화국을 세울 수 있도록 준비시킬 수 있습니다."
 IRQ_islamic_spring_in_jordan: "[JOR.GetFlag] 요르단의 이슬람의 봄"
