 energy_building_battery_parks: "§Y建造§!储能园区"
 energy_building_battery_parks_desc: "我们选择了全面发展可再生能源的道路。现在是时候开始建造必要的设施，以便我国能够储存可再生能源基础设施所产生的能源。"
 energy_automatic_fuel_purchase: "自动§Y燃料购买§!"
 energy_automatic_fuel_purchase_desc: "目前，每当我们燃料不足时，我们都会每隔二十八天按市场价格购买燃料。"
