title: "Millennium Dawn: A Modern Day Mod"
description: "Documentation for the Millennium Dawn: A Modern Day mod for the game Hearts of Iron IV."
baseurl: "/Millennium-Dawn"
url: "https://millenniumdawnmod.github.io"
lang: en
title_separator: " - "
logo: /uploads/main-menu.png

twitter:
  username: MillenniumDawn
  card: summary_large_image

markdown: kramdown
highlighter: rouge

sass:
  sass_dir: _sass
  style: compressed

defaults:
  - scope:
      path: ""
      type: "pages"
    values:
      layout: "default"
      toc: "auto"

collections:
  changelog_sections:
    output: true
    permalink: /changelogs/:name/

plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag
