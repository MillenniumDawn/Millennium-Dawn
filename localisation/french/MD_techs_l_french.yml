 tech_turret_missiles_surface_1: "Missiles anti-navires 1985"
 tech_turret_missiles_surface_1_desc: "Les missiles anti-navires se composent de plateformes de missiles anti-sous-marins et anti-navires. Les deux systèmes de tourelles sont légèrement différents en termes de conception et de charge utile, mais ils remplissent finalement la même fonction. Détruire la cible."
