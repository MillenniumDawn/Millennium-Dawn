 BRI_request_loan_extension: "Solicitar prórroga de préstamo"
 BRI_request_loan_extension_desc: "Petición a Pekín para obtener un periodo de gracia de pago de un año sobre una obligación en mora de la Franja y la Ruta. El capital no se condona."
 CHI_16_national_congress_mission: "16.º Congreso del Partido Comunista Chino"
 CHI_16_national_congress_mission_desc: "El 16.º Congreso Nacional del Partido Comunista Chino se reunirá en 2002, marcando una transición generacional en el liderazgo."
 CHI_16_national_congress_mission_tt: "§REsto eludirá los enfoques necesarios para completar§! §Y$CHI_the_shanghai_succession$§!"
 CHI_17_national_congress_mission: "17.º Congreso del Partido Comunista Chino"
 CHI_17_national_congress_mission_desc: "El 17.º Congreso Nacional se reunirá en 2007 para consolidar la agenda del liderazgo actual."
 CHI_18_national_congress_mission: "18.º Congreso del Partido Comunista Chino"
 CHI_18_national_congress_mission_desc: "El 18.º Congreso Nacional se reunirá en 2012; se prevé que introduzca cambios significativos en el liderazgo."
 CHI_19_national_congress_mission: "19.º Congreso del Partido Comunista Chino"
 CHI_19_national_congress_mission_desc: "El 19.º Congreso Nacional se reunirá en 2017 para revisar el rumbo del partido y reafirmar su liderazgo."
 CHI_20_national_congress_mission: "20.º Congreso del Partido Comunista Chino"
 CHI_20_national_congress_mission_desc: "El 20.º Congreso Nacional se reunirá en 2022 en medio de cuestiones sobre la continuidad del liderazgo y los límites de los mandatos."
 CHI_21_national_congress_mission: "21.º Congreso del Partido Comunista Chino"
 CHI_21_national_congress_mission_desc: "El 21.º Congreso Nacional se reunirá en 2027 para trazar el rumbo del partido para la próxima era."
 CHI_abolish_birth_limits: "Eliminar límites de natalidad"
 CHI_abolish_birth_limits_desc: "Se derogan formalmente todas las restricciones restantes sobre el tamaño de las familias. El Estado pasa de limitar los nacimientos a fomentarlos activamente, poniendo fin a una era de control demográfico que comenzó bajo el mandato de Mao y se institucionalizó bajo el de Deng. El cambio reconoce que los costes de aplicación superan ahora cualquier beneficio demográfico de la restricción, y que la fertilidad voluntaria ya se sitúa muy por debajo de la tasa de reemplazo."
 CHI_activate_princeling_network: "Activar la red de los «principitos»"
 CHI_activate_princeling_network_desc: "Los contactos de antiguos alumnos, los lazos comerciales y los activos del Estado Mayor se agrupan en un instrumento de política coordinado. La red de los «principitos» comienza a operar como nuestra palanca decisiva sobre Pionyang."
 CHI_activate_rare_earth_embargo: "Activar el embargo de tierras raras"
 CHI_activate_rare_earth_embargo_desc: "Cortar las exportaciones de wolframio y cromo a Japón. El embargo se mantendrá hasta que se levante, Japón claudique o Tokio diversifique su suministro."
 CHI_adopt_three_child_policy: "Política de los tres hijos"
 CHI_adopt_three_child_policy_desc: "Tras los resultados del censo de 2020, Pekín permite a las parejas tener hasta tres hijos y acompaña el anuncio con un paquete de subsidios, la ampliación de los permisos de maternidad y paternidad, y límites a los costes de las tutorías privadas. Los analistas señalan que Corea del Sur, Japón y Singapur intentaron medidas similares con un efecto limitado; el rápido aumento del coste de la vida urbana en China y el cambio cultural hacia familias más pequeñas plantean la misma barrera estructural."
 CHI_adopt_two_child_policy: "Política de los dos hijos"
 CHI_adopt_two_child_policy_desc: "El Consejo de Estado anuncia la política universal de dos hijos, en vigor a partir del 1 de enero de 2016. El límite de un solo hijo, vigente desde 1980, se levanta para todas las parejas. Los encargados de la modelización demográfica prevén solo un modesto repunte de los nacimientos: tras décadas de normas de familias pequeñas, el coste de la vida, los precios de la vivienda y la participación de las mujeres en la población activa reprimen la fertilidad muy por debajo del nivel de reemplazo, incluso sin restricciones legales."
 CHI_anti_desertification_belt: "Ampliación de la Gran Muralla Verde de los Tres Nortes"
 CHI_anti_desertification_belt_desc: "El Programa de la Barrera Forestal de los Tres Nortes, en marcha desde 1978 en el norte de China, Mongolia Interior y el noreste, es la mayor campaña de reforestación del mundo, con un total previsto de 88 000 millones de árboles para 2050. Las nuevas fases de plantación se centran en parcelas de especies mixtas que fijan el suelo, retienen el deshielo y restauran las cuencas hidrográficas degradadas en la meseta de Loes y en las tierras arenosas de Hunshandake. La cubierta vegetal restaurada reduce las cargas de sedimentos en el río Amarillo y frena el avance hacia el sur del desierto del Gobi."
 CHI_Asset_Seizure: "Incautar activo estratégico"
 CHI_Asset_Seizure_desc: "Convertir una infraestructura en mora en una participación controlada por China y reducir la deuda principal en el coste de un proyecto. Disponible únicamente en la vía de la diplomacia de la trampa de la deuda."
 CHI_asteroid_mining_investment: "Invertir en la minería de asteroides"
 CHI_asteroid_mining_investment_desc: "Comprometer capital en una empresa comercial de recursos espaciales. Una operación exitosa desbloquea un dividendo industrial permanente derivado de metales del grupo del platino, tierras raras, elementos volátiles y fabricación en microgravedad. Podemos sostener como máximo cinco de estas operaciones a la vez."
 CHI_asteroid_survey_mission: "Sondear asteroides cercanos a la Tierra"
 CHI_asteroid_survey_mission_desc: "Aprovechando la navegación en el espacio profundo demostrada por Tianwen, una sonda de prospección traza las órbitas y la composición mineral de los asteroides cercanos a la Tierra accesibles. Un sondeo exitoso abre la puerta a la extracción comercial de recursos espaciales."
 CHI_automation_robotics_push: "Impulso a la automatización y la robótica"
 CHI_automation_robotics_push_desc: "China se ha convertido en el mayor instalador de robots industriales del mundo, desplegando más unidades anualmente que la Unión Europea y los Estados Unidos combinados. Una aceleración dirigida por el Estado apunta a los sectores manufactureros intensivos en mano de obra que se enfrentan a los déficits más acusados de fuerza laboral. La inversión fluye hacia robots colaborativos, líneas de producción asistidas por IA y sistemas logísticos inteligentes, sustituyendo con capital la mano de obra que la contracción demográfica está retirando."
 CHI_avic_innovation: "AVIC: Innovación original"
 CHI_avic_innovation_desc: "Aviation Industry Corporation of China es la gigantesca matriz de la industria aeronáutica del país. Obligar a sus institutos a innovar en lugar de copiar acelera el desarrollo de las estructuras de los aviones de las que depende el poder aéreo chino."
 CHI_back_nepalese_communists: "Respaldar a los comunistas nepaleses"
 CHI_back_nepalese_communists_desc: "Canalizar fondos y apoyo ideológico a las facciones comunistas en Katmandú, inclinando lentamente el equilibrio político de Nepal hacia Pekín."
 CHI_beijing_hosted_talks: "Organizar la Cumbre de Emergencia de Pekín"
 CHI_beijing_hosted_talks_desc: "Convocar a los líderes coreanos a Pekín para una mediación de emergencia. Cuando las conversaciones bilaterales se han roto, solo un anfitrión chino puede sentar de nuevo a ambas partes a la mesa."
 CHI_beijing_washington_consultation: "Abrir una consulta Pekín-Washington"
 CHI_beijing_washington_consultation_desc: "Un canal secundario discreto con el Departamento de Estado de los EE. UU. permite a Pekín y a Washington gestionar la cuestión coreana por encima de la cabeza de Seúl. El acuerdo inquieta a Tokio, que teme quedar al margen."
 CHI_big_fund_iii_allocate_tranche_decision: "Asignar tramo del Gran Fondo III"
 CHI_big_fund_iii_allocate_tranche_decision_desc: "La tercera fase de 344 000 millones de yuanes del Fondo de Inversión de la Industria de Circuitos Integrados se desembolsa a un subsector objetivo. Cada tramo impulsa otra fábrica de chips hacia su plena utilización."
 CHI_boycott_lotte: "Boicotear a Lotte"
 CHI_boycott_lotte_desc: "Organizar un boicot popular contra las propiedades de Lotte Group en China en respuesta al arrendamiento de terrenos por parte de Lotte para el emplazamiento del despliegue del THAAD."
 CHI_BRI_Forum_Triennial: "Organizar el Foro de la Franja y la Ruta"
 CHI_BRI_Forum_Triennial_desc: "Organizar el Foro trienal de la Franja y la Ruta en Pekín. Los jefes de Estado de toda la red se reúnen para renovar compromisos y anunciar nuevos proyectos insignia. Requiere una tesorería de la Franja y la Ruta de al menos 150. Gran desembolso de tesorería con un tiempo de recarga de tres años."
 CHI_BRI_management: "Iniciativa de la Franja y la Ruta"
 CHI_BRI_management_desc: "La Iniciativa de la Franja y la Ruta es el principal instrumento de la política económica de China, canalizando créditos hacia puertos, ferrocarriles, corredores energéticos e infraestructura digital en las naciones socias de todo el mundo. Cada proyecto refuerza simultáneamente la conectividad física y la influencia política.\n\n§YTesorería:§! ¥[?CHI_bri_treasury|0]B  |  Contribución mensual: +[?CHI_bri_monthly_income_total|0]\n§YProyectos:§! [?CHI_bri_committed_projects|0]/[?CHI_bri_project_slots|0] asignados  |  §G[?CHI_bri_completed_projects|0]§! completados  |  §R[?CHI_bri_defaulted_projects|0]§! impagos agregados\n§YIngresos por préstamos:§! [?CHI_bri_loan_income|2] semanales  |  §YPresencia global:§! [?CHI_bri_global_presence|0]\n§GDesarrollo mutuo [?CHI_bri_winwin_score|0]§!  ·  §RDepredador [?CHI_bri_predatory_score|0]§!"
 CHI_BRI_promote_digital_silk_road: "Mejorar la Ruta de la Seda Digital"
 CHI_BRI_promote_digital_silk_road_desc: "Cuando el recuento de infraestructuras de telecomunicaciones supera el umbral requerido, esta decisión mejora el nivel del espíritu nacional de la Ruta de la Seda Digital, reflejando el despliegue de redes de fibra óptica construidas por China, estaciones terrestres de satélites e infraestructura móvil suministrada por Huawei en los Estados socios."
 CHI_BRI_promote_economic_zones: "Mejorar las Zonas Económicas Especiales"
 CHI_BRI_promote_economic_zones_desc: "Cuando el recuento de desarrollo de zonas industriales supera el umbral requerido, esta decisión mejora el nivel del espíritu nacional de las Zonas Económicas Especiales, reflejando los centros logísticos y de procesamiento de exportaciones gestionados por China que anclan las cadenas de suministro y proporcionan condiciones preferenciales para las empresas chinas en los países socios."
 CHI_BRI_promote_energy_arteries: "Mejorar las Arterias Energéticas"
 CHI_BRI_promote_energy_arteries_desc: "Cuando el recuento de construcción de oleoductos y gasoductos supera el umbral requerido, esta decisión mejora el nivel del espíritu nacional de las Arterias Energéticas, representando la ampliación de la infraestructura de transporte de petróleo y gas que conecta a los productores de Asia Central con las refinerías chinas y reduce la exposición a los puntos de estrangulamiento marítimos."
 CHI_BRI_promote_maritime_network: "Mejorar la Red Marítima"
 CHI_BRI_promote_maritime_network_desc: "Cuando el recuento de construcción de puertos de la Iniciativa de la Franja y la Ruta supera el umbral requerido, esta decisión mejora el nivel del espíritu nacional de la Red Marítima, ampliando la influencia de China sobre las rutas comerciales marítimas y el acceso portuario preferencial desde el océano Índico hasta el Mediterráneo."
 CHI_BRI_promote_overland_corridors: "Mejorar los Corredores Terrestres"
 CHI_BRI_promote_overland_corridors_desc: "Cuando el recuento de construcción de ferrocarriles supera el umbral requerido, esta decisión mejora el nivel del espíritu nacional de los Corredores Terrestres, reflejando la finalización de enlaces ferroviarios transcontinentales adicionales que reducen los costes de tránsito y profundizan la dependencia económica en Asia Central y el Cáucaso."
 CHI_BRI_promote_power_generation: "Mejorar la Red de Generación de Energía"
 CHI_BRI_promote_power_generation_desc: "Cuando la construcción de centrales eléctricas financiadas por la Franja y la Ruta supera el umbral requerido, esta decisión mejora el nivel del espíritu nacional de la Generación de Energía, reflejando las instalaciones de carbón, hidroeléctricas y solares construidas por empresas chinas que suministran electricidad a las economías socias al tiempo que crean dependencias de mantenimiento a largo plazo."
 CHI_BRI_promote_prestige_diplomacy: "Mejorar la Diplomacia de Prestigio"
 CHI_BRI_promote_prestige_diplomacy_desc: "Cuando la finalización de proyectos de prestigio supera el umbral requerido, esta decisión mejora el nivel del espíritu nacional de la Diplomacia de Prestigio, reflejando los estadios emblemáticos, edificios gubernamentales y centros culturales que generan buena voluntad y demuestran el alcance de la diplomacia china."
 CHI_BRI_promote_resource_concessions: "Mejorar las Concesiones de Recursos"
 CHI_BRI_promote_resource_concessions_desc: "Cuando las concesiones de recursos aseguradas superan el umbral requerido, esta decisión mejora el nivel del espíritu nacional de las Concesiones de Recursos, representando acuerdos de extracción a largo plazo de cobre, cobalto, litio y otros minerales estratégicos que abastecen a las cadenas de suministro de la manufactura china."
 CHI_BRI_recipient_actions: "Iniciativa de la Franja y la Ruta"
 CHI_BRI_recipient_actions_desc: "Solicitar financiación de proyectos de la Iniciativa de la Franja y la Ruta a la República Popular China."
 CHI_build_mega_rail_hub: "Construir un megacentro ferroviario"
 CHI_build_mega_rail_hub_desc: "Construir una gigantesca terminal ferroviaria integrada en una de las principales ciudades de China, a la escala de Pekín Sur, Shanghái Hongqiao o Cantón Sur. Estos centros fusionan líneas de alta velocidad, metro y líneas interurbanas en un único nodo y aceleran la construcción y la logística en toda la región."
 CHI_build_public_housing: "Construir vivienda pública"
 CHI_build_public_housing_desc: "Movilizar brigadas de construcción para edificar viviendas de alquiler estatales en [FROM.GetName]. Los proyectos ocupan capacidad de fábricas civiles durante dos años y reducen la carga nacional de bienes de consumo al completarse."
 CHI_caic_innovation: "CAIC: Innovación original"
 CHI_caic_innovation_desc: "Changhe Aircraft Industries construye los helicópteros de ataque dedicados del EPL, desde el Z-10 hasta el Z-19. Permitir que sus ingenieros asuman riesgos acelera el desarrollo de una flota de ataque de ala rotatoria que durante mucho tiempo ha ido a la zaga de los diseños occidentales."
 CHI_cancel_east_china_sea_exercise: "Cancelar el ejercicio del mar de la China Oriental"
 CHI_cancel_east_china_sea_exercise_desc: "Los simulacros navales y aéreos cerca de las disputadas islas Senkaku (o Diaoyu) inflaman rutinariamente las relaciones con Tokio. Suspender el ejercicio planificado es una señal de moderación, tranquiliza a Japón y respalda la narrativa de un ascenso pacífico."
 CHI_casc_innovation: "CASC: Innovación original"
 CHI_casc_innovation_desc: "China Aerospace Science and Technology Corporation gestiona los lanzamientos espaciales, los misiles balísticos y los satélites de la nación. Reformarla acelera el desarrollo de los sistemas orbitales y estratégicos que sustentan la disuasión china."
 CHI_casic_innovation: "CASIC: Innovación original"
 CHI_casic_innovation_desc: "China Aerospace Science and Industry Corporation fabrica los misiles tácticos y de crucero del país, desde la familia YJ hasta los sistemas de ataque terrestre. Permitir que sus oficinas asuman riesgos afila el arsenal de ataque de precisión."
 CHI_central_theatre_command: "Mando del Teatro Central"
 CHI_central_theatre_command_desc: "El Mando del Teatro Central en Pekín constituye la reserva estratégica y el escudo de la capital. Detenta la autoridad de mando y la moral de la fuerza que respalda a todas las demás direcciones estratégicas."
 CHI_cetc_innovation: "CETC: Innovación original"
 CHI_cetc_innovation_desc: "China Electronics Technology Group suministra los radares, sensores y sistemas de gestión de batalla que respaldan a cada plataforma moderna. Reformar su cultura de investigación impulsa la informática y la inteligencia artificial chinas hacia la vanguardia tecnológica."
 CHI_chang_e_mission: "Lanzar la sonda Chang'e"
 CHI_chang_e_mission_desc: "Una misión robótica Chang'e parte hacia la Luna para alunizar, realizar prospecciones y retransmitir datos a través del satélite de enlace Queqiao. Los datos que envía trazan el terreno para los astronautas que la seguirán. Las probabilidades de éxito mejoran a medida que crece nuestra experiencia de lanzamiento."
 CHI_cheju_summit_arrangement: "Organizar una cumbre en Cheju"
 CHI_cheju_summit_arrangement_desc: "La isla turística de Cheju (o Jeju) ofrece un terreno neutral para conversaciones de alto nivel con Corea del Sur. Una cumbre puede deparar un avance diplomático, pero una reunión mal preparada corre el riesgo de recibir un rechazo público que endurezca a ambas partes."
 CHI_convene_bilateral_channel: "Convocar un canal bilateral"
 CHI_convene_bilateral_channel_desc: "El Diálogo de Seguridad Cuadrilateral vincula a los Estados Unidos, Japón, la India y Australia contra Pekín. Abrir un canal bilateral discreto con Tokio siembra dudas sobre la cohesión de la agrupación y frena su consolidación."
 CHI_crack_down_tibet_separatism: "Reprimir el separatismo tibetano"
 CHI_crack_down_tibet_separatism_desc: "Suprimir las organizaciones separatistas en todo el Tíbet mediante medidas coordinadas de seguridad y administrativas. Refuerza la autoridad central y acelera la integración."
 CHI_crack_down_xinjiang_separatism: "Reprimir el separatismo en Sinkiang"
 CHI_crack_down_xinjiang_separatism_desc: "Desplegar fuerzas de seguridad interna en todo Sinkiang para desmantelar las células separatistas. Endurece el control estatal sobre la región y aumenta el cumplimiento de las normas, pero atrae el escrutinio internacional."
 CHI_crewed_lunar_landing_mission: "Llevar astronautas a la Luna"
 CHI_crewed_lunar_landing_mission_desc: "Un Larga Marcha 10 eleva el vehículo tripulado Mengzhou y el módulo de alunizaje Lanyue desde Wenchang en lanzamientos separados que realizan un acoplamiento en órbita lunar. La tripulación debe descender a la región del polo sur lunar, clavar la bandera y regresar a salvo, convirtiendo a China en la segunda nación en llevar seres humanos a la Luna."
 CHI_critical_minerals_export_license_decision: "Restricciones a la exportación de minerales críticos"
 CHI_critical_minerals_export_license_decision_desc: "Restringir las exportaciones de galio, germanio y tierras raras bajo el marco de licencias de agosto de 2023. Los ingresos por tonelada aumentan a medida que la oferta se reduce."
 CHI_crrc_innovation: "CRRC: Innovación original"
 CHI_crrc_innovation_desc: "China Railway Rolling Stock Corporation es el mayor fabricante de equipos ferroviarios del mundo, una base de industria pesada de doble uso de enorme escala. Dirigir su ingeniería hacia la defensa amplía los cimientos industriales que la sustentan."
 CHI_csgc_innovation: "CSGC: Innovación original"
 CHI_csgc_innovation_desc: "China South Industries Group fabrica los vehículos blindados de combate y las armas ligeras del ejército junto con sus líneas de automóviles civiles. Superar su cautela desbloquea una familia moderna de vehículos de combate."
 CHI_csic_innovation: "CSIC: Innovación original"
 CHI_csic_innovation_desc: "China Shipbuilding Industry Corporation, el hogar histórico del diseño de submarinos chinos, impulsa el servicio silencioso bajo las olas. Reformar sus institutos acelera el desarrollo de la próxima generación de buques de ataque y de misiles balísticos."
 CHI_cssc_innovation: "CSSC: Innovación original"
 CHI_cssc_innovation_desc: "China State Shipbuilding Corporation es el gigante detrás de la flota de superficie de la Armada del EPL, incluidos sus portaaviones. Permitir que sus astilleros innoven acelera la producción de los buques de guerra de una armada de alta mar."
 CHI_cultivate_pyongyang_contacts: "Cultivar contactos en Pionyang"
 CHI_cultivate_pyongyang_contacts_desc: "China sigue siendo el protector indispensable de Corea del Norte, suministrando la mayor parte de su combustible y alimentos. Entablar relaciones discretas dentro del liderazgo de Pionyang permite a Pekín incidir en la estabilidad interna del régimen sin una interferencia manifiesta."
 CHI_current_congress_mission: "Congreso Nacional activo"
 CHI_current_congress_mission_desc: "El Congreso Nacional está en sesión. Se están ultimando los nombramientos de los comités."
 CHI_cxmt_hbm_qualification_decision: "Cualificar la memoria HBM de CXMT para la IA nacional"
 CHI_cxmt_hbm_qualification_decision_desc: "Introducir la memoria de alto ancho de banda (HBM) de CXMT en los ensamblajes de aceleradores de Cambricon, Biren y Moore Threads, poniendo fin a la dependencia de Nvidia y Samsung en las cargas de trabajo de IA nacionales."
 CHI_dandong_military_district: "Reforzar el Distrito Militar de Dandong"
 CHI_dandong_military_district_desc: "Dandong se sitúa en el río Yalu, frente a Corea del Norte, constituyendo el principal paso de la frontera entre China y la RPDC. Fortalecer la guarnición del noreste honra la doctrina de Labios y Dientes de defensa mutua con Pionyang y apuntala la frontera de Manchuria."
 CHI_de_escalate_at_LAC: "Desescalar en la Línea de Control Actual"
 CHI_de_escalate_at_LAC_desc: "Tras los enfrentamientos de 2020 en el valle de Galwan, China e India mantuvieron tensos estancamientos a lo largo de la disputada Línea de Control Actual en Ladakh. Ordenar al personal fronterizo que se retire de las posiciones avanzadas suaviza la confrontación con Nueva Delhi y reduce las tensiones regionales."
 CHI_Debt_Restructuring: "Reestructurar la deuda del socio"
 CHI_Debt_Restructuring_desc: "Reducir la tasa de un socio en mora al 2% y conceder un año sin pagos. El capital principal sigue estando pendiente. Disponible únicamente en la vía de la diplomacia de la trampa de la deuda."
 CHI_deploy_paf_maritime_militia: "Desplegar la milicia marítima de las PAF"
 CHI_deploy_paf_maritime_militia_desc: "Presencia permanente de la milicia marítima alrededor de las Diaoyu. Cada mes aumenta la presión sobre las Senkaku y se corre el riesgo de que ocurra un incidente."
 CHI_drip_irrigation_rollout: "Despliegue del riego por goteo"
 CHI_drip_irrigation_rollout_desc: "La agricultura china extrae más de 360 000 millones de metros cúbicos de agua al año, la mayor parte a través de riego por inundación en surcos, cuya eficiencia rara vez supera el 50 por ciento. Un despliegue nacional de sistemas de riego por goteo y microrriego, inspirado en la experiencia de agricultura de precisión de Israel y pilotado en el cinturón algodonero de Sinkiang, reduce el consumo de agua en los campos entre un 30 y un 50 por ciento por hectárea. Los programas de equipos subvencionados y las normas obligatorias de eficiencia para los nuevos distritos de riego extienden la tecnología desde las granjas de demostración al sector agrícola en general."
 CHI_duv_breakthrough_decision: "Impulsar el programa DUV de SMEE"
 CHI_duv_breakthrough_decision_desc: "Forzar una demostración de litografía de inmersión DUV de 28 nm de Shanghai Micro Electronics. El éxito redefine el mercado mundial de herramientas de chips; el fracaso consume capital y retrasa los plazos otro año."
 CHI_eastern_theatre_command: "Mando del Teatro Oriental"
 CHI_eastern_theatre_command_desc: "Con sede en Nankín, el Mando del Teatro Oriental se orienta hacia el estrecho de Taiwán y el mar de la China Oriental. Sus fuerzas están estructuradas en torno al asalto anfibio y la potencia de fuego necesaria para romper una línea costera defendida."
 CHI_eleventh_five_year_plan_mission: "Undécimo Plan Quinquenal"
 CHI_eleventh_five_year_plan_mission_desc: "El Undécimo Plan Quinquenal de China (2006-2010) establece seis objetivos obligatorios de desarrollo que abarcan el crecimiento económico, la expansión del sector terciario, la capacidad industrial, la infraestructura nacional, la eficiencia energética y el bienestar social. La Comisión Nacional de Desarrollo y Reforma supervisará los avances a lo largo del periodo de cinco años."
 CHI_establish_dandong_safe_houses: "Establecer casas de seguridad en Dandong"
 CHI_establish_dandong_safe_houses_desc: "Establecer casas de seguridad a lo largo del río Yalu para refugiar y organizar a los desertores alineados con la facción de Jang. Una zona de despliegue discreta para futuras operaciones."
 CHI_fabless_provincial_subsidy_decision: "Ronda de subsidios provinciales para firmas sin fábrica"
 CHI_fabless_provincial_subsidy_decision_desc: "Shanghái, Shenzhen y Pekín igualan, cada una, el tramo del Gran Fondo central con su propia financiación de riesgo para el clúster de empresas de diseño de chips."
 CHI_facilitate_family_reunions: "Facilitar las reuniones familiares"
 CHI_facilitate_family_reunions_desc: "Utilizar las redes logísticas chinas para organizar reuniones de familias divididas a través de la frontera. La recompensa humanitaria se ve correspondida por la buena voluntad diplomática que genera."
 CHI_factional_balance_category: "Equilibrio de facciones"
 CHI_factional_balance_category_desc: "El Partido Comunista de China no es monolítico. Facciones rivales, arraigadas en redes de clientelismo, tendencias ideológicas y trayectorias profesionales, se disputan la influencia sobre los nombramientos de personal, la política económica y el ritmo de las reformas políticas. Gestionar el equilibrio de poder entre estos bloques internos es un requisito indispensable para una gobernanza estable."
 CHI_FOCAC_Summit: "Convocar la Cumbre del FOCAC"
 CHI_FOCAC_Summit_desc: "Organizar la cumbre trienal del Foro de Cooperación China-África. Cuesta 50 tanto del fondo de la Franja y la Ruta como de la tesorería nacional, además de capital político, con un tiempo de recarga de tres años."
 CHI_fund_princeling_ventures: "Financiar proyectos comerciales de los «principitos»"
 CHI_fund_princeling_ventures_desc: "Financiar empresas transfronterizas gestionadas por los «principitos» norcoreanos. La riqueza vinculada al capital chino crea una lealtad que la ideología no puede conseguir."
 CHI_fusion_program: "Programa Nacional de Fusión"
 CHI_fusion_program_desc: "Concentrar la investigación nacional sobre la fusión nuclear controlada en Hefei, sede del Tokamak Superconductor Avanzado Experimental (EAST), el dispositivo BEST y el proyectado Reactor de Prueba de Ingeniería de Fusión de China. El dominio del «sol artificial» promete una fuente ilimitada de electricidad limpia."
 CHI_gobi_desert_solar_expansion: "Fase de expansión solar y eólica del Gobi"
 CHI_gobi_desert_solar_expansion_desc: "Encargar una fase adicional de construcción de paneles solares y aerogeneradores en el desierto del Gobi, ampliando la capacidad de generación de energía renovable. Cada fase requiere una capacidad de construcción civil significativa y reduce temporalmente el rendimiento general de la construcción en todo el país."
 CHI_grey_society_crisis: "Crisis de la sociedad canas"
 CHI_grey_society_crisis_desc: "La población en edad de trabajar de China alcanzó su punto máximo alrededor de 2011 y se ha ido reduciendo desde entonces. Cuatro décadas de la política de hijo único han invertido la pirámide de edad: un hijo único ahora suele mantener a dos padres y cuatro abuelos, mientras que los costes de las pensiones y la atención médica aumentan más rápido que el PIB. La próxima década pondrá a prueba si China puede sostener el crecimiento a medida que su fuerza laboral se contrae y su población anciana se expande. Esta crisis persistirá durante años; las decisiones de mitigación reducen su duración."
 CHI_haig_innovation: "HAIG: Innovación original"
 CHI_haig_innovation_desc: "Harbin Aircraft Industry Group produce los helicópteros de transporte y de utilidad del EPL, incluidos el Z-9 y el nuevo Z-20. Permitir que sus diseñadores asuman riesgos acelera el desarrollo de una versátil flota de ala rotatoria."
 CHI_hsr_beijing_shanghai: "Ferrocarril de alta velocidad Pekín-Shanghái"
 CHI_hsr_beijing_shanghai_desc: "Construir el ferrocarril de alta velocidad de 1318 kilómetros entre Pekín y Shanghái, uniendo las capitales política y financiera de China. Siendo el corredor de HSR más transitado del mundo en su inauguración, reduce el tiempo de viaje de catorce horas a cuatro horas y cuarenta minutos a una velocidad de 300 km/h."
 CHI_hsr_beijing_tianjin: "Ferrocarril interurbano Pekín-Tianjín"
 CHI_hsr_beijing_tianjin_desc: "Construir el ferrocarril interurbano de 117 kilómetros entre Pekín y Tianjín, nuestra primera línea de alta velocidad diseñada para velocidades comerciales de 350 km/h. El tiempo de viaje entre las dos ciudades se reducirá de 70 a 30 minutos, consolidando un corredor económico unificado Pekín-Tianjín-Hebei."
 CHI_hsr_chengdu_chongqing: "Ferrocarril de alta velocidad Chengdu-Chongqing"
 CHI_hsr_chengdu_chongqing_desc: "Construir la conexión ferroviaria de alta velocidad entre Chengdu y Chongqing, los pilares gemelos de la estrategia de desarrollo del oeste. Su finalización integra a las dos megaciudades en un único círculo económico de una hora y forma la columna vertebral de la red en expansión de HSR del oeste."
 CHI_hsr_wuhan_guangzhou: "Ferrocarril de alta velocidad Wuhan-Cantón"
 CHI_hsr_wuhan_guangzhou_desc: "Construir el ferrocarril de alta velocidad de 1069 kilómetros entre Wuhan y Cantón, que conecta el centro de China con el corazón manufacturero del delta del río de las Perlas. En su inauguración, constituye la línea ferroviaria de alta velocidad más larga del mundo y reduce el trayecto de más de diez horas a menos de tres."
 CHI_identify_beida_alumni: "Identificar a antiguos alumnos de la Universidad de Pekín"
 CHI_identify_beida_alumni_desc: "Perfil de los hijos de la élite norcoreana educados en la Universidad de Pekín (Beida). Sus lazos con China y sus tendencias reformistas los convierten en candidatos para un futuro gobierno."
 CHI_industrial_investment_category: "Programa de inversión en energía y petroquímica"
 CHI_industrial_investment_category_desc: "Decisiones estratégicas de inversión industrial desbloqueadas a través de los árboles de enfoque de la base petroquímica y de energías renovables de China."
 CHI_initiate_joint_exercises_with_RAJ: "Iniciar ejercicios conjuntos con la India"
 CHI_initiate_joint_exercises_with_RAJ_desc: "Ejecutar un ciclo de ejercicios combinados con las Fuerzas Armadas de la India para generar confianza y reforzar los logros de la desescalada fronteriza."
 CHI_initiate_joint_military_training: "Iniciar el entrenamiento conjunto de Hermanos de Hierro"
 CHI_initiate_joint_military_training_desc: "Ejecutar un ciclo de ejercicios combinados con las Fuerzas Armadas de Pakistán para mejorar la interoperabilidad y el alineamiento doctrinal."
 CHI_inner_mongolia_innovation: "First Machinery Group: Innovación original"
 CHI_inner_mongolia_innovation_desc: "Inner Mongolia First Machinery Group es la cuna del blindaje chino, construyendo el tanque de batalla principal Tipo 99 en Baotou. Superar su cautela burocrática desbloquea una nueva generación de vehículos pesados de combate."
 CHI_insert_jang_assets: "Infiltrar activos de Jang"
 CHI_insert_jang_assets_desc: "Introducir de nuevo en la RPDC a operativos alineados con Jang bajo cobertura encubierta. Una vez posicionados, quedan a la espera de su activación."
 CHI_invest_domestic_arms_lines: "Invertir en líneas de armamento nacionales"
 CHI_invest_domestic_arms_lines_desc: "Dirigir fondos estatales hacia las líneas de producción de NORINCO y AVIC para que los pedidos del EPL se completen en el país en lugar de a través de contratos con Rosoboronexport. Cada ronda de inversión reduce la brecha con los proveedores rusos."
 CHI_invite_basf_caojing: "Integración Verbund de BASF"
 CHI_invite_basf_caojing_desc: "Aprobar la propuesta de BASF para construir un complejo químico integrado Verbund en el Parque de la Industria Química de Caojing y en la zona costera de Zhanjiang. La inversión de 8700 millones de euros reúne la fabricación avanzada de polímeros y acrílicos con un modelo de integración de procesos que vincula los servicios públicos, las materias primas y los flujos de subproductos a través de dieciocho plantas químicas, el primer emplazamiento Verbund fuera de Europa."
 CHI_invite_bayer_nanjing: "Centro de Ciencia de Materiales de Covestro"
 CHI_invite_bayer_nanjing_desc: "Invitar a Covestro (anteriormente Bayer MaterialScience) a establecer una sede regional de investigación y producción en Shanghái. La instalación de 3000 millones de euros produce policarbonatos, precursores de poliuretano y revestimientos avanzados, y traslada el centro global de investigación y desarrollo de la división desde Alemania, transfiriendo conocimientos de química de polímeros aplicables a materiales industriales y de alto rendimiento."
 CHI_invite_exxonmobil_jv: "Empresa conjunta con ExxonMobil en Quanzhou"
 CHI_invite_exxonmobil_jv_desc: "Aprobar la participación accionarial del 25 por ciento de ExxonMobil en la Fujian Refining and Petrochemical Company en Quanzhou, estableciendo el primer complejo petroquímico y de refinado sino-extranjero totalmente integrado. ExxonMobil aporta tecnología avanzada de craqueo por vapor y producción de poliolefinas, junto con experiencia operativa en el refinado integrado a gran escala."
 CHI_invite_JAP_hitachi: "Invitar a Hitachi"
 CHI_invite_JAP_hitachi_desc: "Las divisiones de electrónica industrial y de defensa de Hitachi producen sistemas de control ferroviario, equipos de generación de energía y hardware informático integrado con una amplia aplicación de doble uso en la infraestructura industrial y militar china."
 CHI_invite_JAP_honda: "Invitar a Honda Motor Company"
 CHI_invite_JAP_honda_desc: "Las divisiones de ingeniería de sistemas de propulsión y robótica de Honda aportan tecnología de motores compactos y sistemas de automatización de fábricas aplicables tanto a la fabricación civil como a las líneas de producción adyacentes a la defensa."
 CHI_invite_JAP_howa: "Invitar a Howa Machinery"
 CHI_invite_JAP_howa_desc: "Howa Machinery es el principal fabricante de los fusiles de asalto Tipo 89 y Tipo 20 para la Fuerza Terrestre de Autodefensa de Japón. Sus procesos de mecanizado de precisión y la gestión de la línea de producción de armas ligeras ofrecen un valor directamente transferible."
 CHI_invite_JAP_ihi: "Invitar a IHI Corporation"
 CHI_invite_JAP_ihi_desc: "IHI Corporation es el fabricante líder de Japón en motores aeronáuticos y sistemas de propulsión naval, produciendo motores turbofán para aviones militares y componentes de turbinas para buques de guerra bajo licencia de socios occidentales."
 CHI_invite_JAP_jmu: "Invitar a Japan Marine United"
 CHI_invite_JAP_jmu_desc: "Japan Marine United es el principal constructor de buques de combate de superficie de la JMSDF, responsable de los destructores de helicópteros de la clase Izumo y los destructores de misiles guiados de la clase Maya. Sus métodos de arquitectura naval modular son directamente aplicables a los programas de construcción naval de China."
 CHI_invite_JAP_jr_east: "Invitar a JR East"
 CHI_invite_JAP_jr_east_desc: "JR East opera la red de alta velocidad ferroviaria más avanzada del mundo. Su ingeniería de material rodante, sistemas de señalización y experiencia en el mantenimiento de infraestructuras proporcionan tanto valor económico civil como una modernización del transporte estratégico."
 CHI_invite_JAP_jsw: "Invitar a Japan Steel Works"
 CHI_invite_JAP_jsw_desc: "Japan Steel Works es el principal productor mundial de forjados de acero de gran diámetro utilizados en recipientes a presión, cañones de artillería naval y componentes de reactores nucleares. Su experiencia metalúrgica mejorará directamente la producción industrial pesada de China."
 CHI_invite_JAP_kawasaki_aerospace: "Invitar a Kawasaki Heavy Industries (Aeroespacial)"
 CHI_invite_JAP_kawasaki_aerospace_desc: "La rama aeroespacial de Kawasaki produce el avión de transporte C-2 y el avión de patrulla marítima P-1, lo que le otorga una profunda competencia en la construcción de grandes estructuras de aviones y en la integración de sistemas de misión relevantes tanto para aplicaciones comerciales como de defensa."
 CHI_invite_JAP_kawasaki_shipbuilding: "Invitar a Kawasaki Heavy Industries (Astillero)"
 CHI_invite_JAP_kawasaki_shipbuilding_desc: "La división de astilleros de Kawasaki Heavy Industries es responsable de la construcción de los submarinos de la clase Soryu. Su experiencia en la fabricación de cascos de presión para submarinos y en la reducción de la firma acústica representa una transferencia significativa de capacidad naval."
 CHI_invite_JAP_komatsu: "Invitar a Komatsu Defense"
 CHI_invite_JAP_komatsu_desc: "Komatsu Defense fabrica vehículos blindados ligeros y artillería autopropulsada para la Fuerza Terrestre de Autodefensa de Japón. Su enfoque de construcción modular y sus soluciones de blindaje ligero complementan los programas de vehículos chinos existentes."
 CHI_invite_JAP_mhi_tank: "Invitar a Mitsubishi Heavy Industries (Sistemas Terrestres)"
 CHI_invite_JAP_mhi_tank_desc: "La división de sistemas terrestres de Mitsubishi Heavy Industries produce los tanques de batalla principales Tipo 10 y Tipo 90, así como una gama de vehículos blindados. La cooperación transfiere metodologías de diseño de blindajes y técnicas avanzadas de blindaje compuesto."
 CHI_invite_JAP_mitsubishi_aerospace: "Invitar a Mitsubishi Aerospace"
 CHI_invite_JAP_mitsubishi_aerospace_desc: "La división aeroespacial de Mitsubishi Heavy Industries es el principal desarrollador de aviones militares avanzados de Japón, incluyendo la plataforma F-2 y el naciente programa F-X. Su presencia en China aportaría experiencia en ingeniería de estructuras de aviones y capacidad de fabricación de doble uso."
 CHI_invite_JAP_mitsubishi_shipbuilding: "Invitar a Mitsubishi Shipbuilding"
 CHI_invite_JAP_mitsubishi_shipbuilding_desc: "La rama de construcción naval de Mitsubishi construye cascos de destructores y cascos de presión de submarinos para la Fuerza Marítima de Autodefensa de Japón, ofreciendo técnicas de construcción naval y procesos de soldadura de precisión adecuados para programas de buques de guerra de alto nivel."
 CHI_invite_JAP_nec: "Invitar a NEC Corporation"
 CHI_invite_JAP_nec_desc: "NEC Corporation es un desarrollador japonés líder en sistemas C4ISR, hardware de comunicaciones por satélite y plataformas de inteligencia de señales. Su experiencia en integración abarca tanto la electrónica de defensa como la infraestructura de redes civiles."
 CHI_invite_JAP_nippon_steel: "Invitar a Nippon Steel"
 CHI_invite_JAP_nippon_steel_desc: "Nippon Steel es uno de los mayores productores mundiales de acero estructural de alta resistencia. Sus planchas de blindaje de alta dureza y su producción de aleaciones especiales sirven tanto a la industria de defensa japonesa como al sector de infraestructuras en general."
 CHI_invite_JAP_panasonic: "Invitar a Panasonic"
 CHI_invite_JAP_panasonic_desc: "Panasonic suministra tecnología avanzada de baterías, electrónica reforzada y componentes de imagen térmica a la cadena de suministro de defensa japonesa, con estándares de producción directamente aplicables a la integración de plataformas militares."
 CHI_invite_JAP_subaru: "Invitar a Subaru Aerospace"
 CHI_invite_JAP_subaru_desc: "La división aeroespacial de Subaru Corporation produce fuselajes de helicópteros y componentes de estructuras de aviones de ala fija bajo licencia, con especial fortaleza en la metalurgia de precisión y el diseño estructural de ala rotatoria."
 CHI_invite_JAP_toshiba: "Invitar a Toshiba Defense Systems"
 CHI_invite_JAP_toshiba_desc: "Toshiba Defense Systems produce matrices de radar, suites de guerra electrónica y hardware de guía de misiles para las Fuerzas de Autodefensa de Japón, aportando tecnología de sensores crítica e ingeniería de sistemas integrados a la asociación."
 CHI_invite_JAP_toyota: "Invitar a Toyota Motor Corporation"
 CHI_invite_JAP_toyota_desc: "Los sistemas de fabricación avanzada de Toyota y sus principios logísticos «justo a tiempo» sustentan no solo la producción de vehículos comerciales, sino también los programas de vehículos logísticos y de utilidad ligera suministrados a las fuerzas armadas de Japón."
 CHI_invite_saudi_aramco: "Participación estratégica de Saudi Aramco en refinerías"
 CHI_invite_saudi_aramco_desc: "Ofrecer a Saudi Aramco participaciones accionariales en la Fujian Refining and Petrochemical Company y en el complejo Hengli Petrochemical en Dalian. La participación del 25 por ciento de Aramco en Fujian y del 10 por ciento en Hengli integra una capacidad de refinado combinada de 400 000 barriles al día con un canal de suministro de crudo garantizado desde la península arábiga, anclando el sector de refinado de China a una fuente a largo plazo de crudo saudí."
 CHI_invite_shell_chem: "Asociación química con Shell en la bahía de Daya"
 CHI_invite_shell_chem_desc: "Ampliar la empresa conjunta Shell-CNOOC en la Zona Petroquímica de la bahía de Daya en Guangdong. La asociación al 50 % de Shell con CNOOC opera una instalación de craqueo de etileno de 1,6 millones de toneladas al año y produce polietileno, polipropileno, etilenglicol, poliefectos polioles y estireno, diversificando la producción química de fase terminal de China en toda la costa sur."
 CHI_jap_capitulate_to_demands: "Capitular ante las exigencias chinas"
 CHI_jap_capitulate_to_demands_desc: "Aceptar las condiciones de Pekín. El embargo se levanta, pero el coste político a nivel nacional es real."
 CHI_jap_diversify_rare_earth: "Diversificar el suministro de tierras raras"
 CHI_jap_diversify_rare_earth_desc: "Un programa de choque de un año de duración para escapar de la dependencia china de las tierras raras. Doloroso, pero hace que los futuros embargos sean ineficaces."
 CHI_jap_open_back_channel: "Abrir conversaciones por canales secundarios"
 CHI_jap_open_back_channel_desc: "Utilizar el canal secundario para rebajar la tensión en el teatro de operaciones de las Senkaku."
 CHI_jap_reinforce_coast_guard: "Reforzar la Guardia Costera"
 CHI_jap_reinforce_coast_guard_desc: "Intensificar las patrullas de la JCG en el mar de la China Oriental. Disuade las incursiones chinas, pero alimenta el ciclo de escalada de tensión."
 CHI_japan_strategy: "Estrategia para Japón"
 CHI_japan_strategy_desc: "El menú completo de la rivalidad sino-japonesa: coacción con tierras raras, alineamiento en el RCEP, presión marítima en las Senkaku, diplomacia por canales secundarios e invitaciones industriales. Tanto Pekín como Tokio emiten decisiones desde aquí a medida que la relación oscila entre la coacción y el entendimiento."
 CHI_kaesong_expansion: "Expandir el complejo de Kaesong"
 CHI_kaesong_expansion_desc: "La Región Industrial de Kaesong, donde el capital del Sur empleaba antaño a la mano de obra del Norte, se cerró en 2016 al colapsar los lazos intercoreanos. Mediar en su reapertura como codesarrollador alivia la tensión en la península y vincula a ambas Coreas a las inversiones chinas."
 CHI_KPA_Officer_Exchange: "Programa de intercambio de oficiales del EPC"
 CHI_KPA_Officer_Exchange_desc: "Desplegar oficiales del EPL en Pionyang para sesiones de entrenamiento y planificación conjunta con sus homólogos del Ejército Popular de Corea. Cada ciclo profundiza la interoperabilidad militar y la influencia china sobre el mando norcoreano."
 CHI_kpop_media_ban: "Prohibición de medios de comunicación de K-Pop"
 CHI_kpop_media_ban_desc: "Restringir la emisión y distribución de contenidos de entretenimiento coreanos en China. La prohibición apunta a los productos culturales de la ola coreana como palanca contra las decisiones de alineamiento de seguridad de Seúl."
 CHI_LATAM_emergency_aid: "Ayuda de emergencia al socio de LATAM"
 CHI_LATAM_emergency_aid_desc: "Enviar un paquete de ayuda discrecional a un socio bajo el paraguas de seguridad en América Latina. Impulsa su estabilidad y nuestra influencia."
 CHI_LATAM_intel_sharing_pact: "Pacto de intercambio de inteligencia"
 CHI_LATAM_intel_sharing_pact_desc: "Abrir un canal bilateral de intercambio de inteligencia con un gobierno socio. Otorga acceso militar recíproco y refuerza la asociación."
 CHI_LATAM_military_advisors: "Desplegar asesores militares"
 CHI_LATAM_military_advisors_desc: "Enviar cuadros de entrenamiento del EPL a las fuerzas militares de un socio. Transfiere la experiencia del ejército y profundiza los lazos de defensa."
 CHI_LATAM_security_options: "Opciones de seguridad en América Latina"
 CHI_launch_payload: "Lanzar una carga útil"
 CHI_launch_payload_desc: "Mantener un ritmo de lanzamiento constante desde Jiuquan, Xichang, Wenchang y Taiyuan. Cada lanzamiento exitoso consolida la experiencia operativa que aumenta las probabilidades de nuestras misiones insignia y es un requisito indispensable para comprometerse con la Luna."
 CHI_lift_rare_earth_embargo: "Levantar el embargo de tierras raras"
 CHI_lift_rare_earth_embargo_desc: "Poner fin a la prohibición de exportar tierras raras. Tokio obtiene un respiro."
 CHI_lift_thaad_sanctions: "Levantar las sanciones por el THAAD"
 CHI_lift_thaad_sanctions_desc: "Levantar formalmente las sanciones económicas informales impuestas en respuesta al despliegue del THAAD. La decisión señala la disposición a normalizar las relaciones con Seúl."
 CHI_localise_licensed_system: "Nacionalizar un sistema bajo licencia"
 CHI_localise_licensed_system_desc: "Aplicar ingeniería inversa y nacionalizar un sistema construido actualmente bajo licencia rusa, ya sea un motor, un radar o un buscador de misiles, recortando las regalías pagadas a Moscú y demostrando que la industria china puede valerse por sí misma."
 CHI_locate_jang_loyalists: "Localizar a los leales a Jang"
 CHI_locate_jang_loyalists_desc: "Identificar a los miembros supervivientes de la facción de Jang Song-thaek dispersos por las regiones fronterizas. La red purgada conserva su resentimiento hacia el círculo interno de los Kim."
 CHI_mature_node_export_drive_decision: "Campaña de exportación de nodos maduros"
 CHI_mature_node_export_drive_decision_desc: "Subvencionar a los clientes de SMIC y Hua Hong para inundar los mercados mundiales de automoción, IoT y electrodomésticos con chips de nodos maduros. Cada tramo acumula opinión comercial."
 CHI_megaprojects: "Macroproyectos nacionales"
 CHI_megaprojects_desc: "La tradición china de macroproyectos dirigidos por el Estado, desde la presa de las Tres Gargantas hasta la red de alta velocidad ferroviaria más grande del mundo. Comprometer recursos nacionales en construcciones insignia que reconfiguren los sistemas de agua, energía y transporte del país."
 CHI_military_decisions_category: "Reestructuración militar"
 CHI_MSS_Pyongyang_Station: "Estación del MSE en Pionyang"
 CHI_MSS_Pyongyang_Station_desc: "Ampliar la estación del Ministerio de Seguridad del Estado en Pionyang para aumentar la cobertura de inteligencia sobre el liderazgo norcoreano y la capacidad de alerta temprana ante la inestabilidad del régimen."
 CHI_MSS_Quiet_Removal_Operation: "Operación de destitución discreta"
 CHI_MSS_Quiet_Removal_Operation_desc: "El Ministerio de Seguridad del Estado ha identificado una facción de línea dura en Pionyang que obstruye la agenda de reformas. Una operación discreta puede eliminar el obstáculo y despejar el camino para una mayor liberalización."
 CHI_national_commitee_decisions_category: "Comité Nacional"
 CHI_national_commitee_decisions_category_desc: "\n£GFX_CHI_commission_1 \n\n\n\nEl Comité Central del Partido Comunista de China gobierna los asuntos del partido entre los Congresos Nacionales. Cada cinco años, se reúne un nuevo Congreso para elegir a los miembros del comité, nombrar secretarios y fijar la dirección política del partido."
 CHI_NKO_Rason_SEZ_Investment: "Inversión en la ZEE de Rason"
 CHI_NKO_Rason_SEZ_Investment_desc: "Comprometer financiación directa para la Zona Económica Especial de Rason. La inversión desbloquea el acceso al puerto y demuestra la viabilidad de la reforma económica norcoreana."
 CHI_norinco_innovation: "NORINCO: Innovación original"
 CHI_norinco_innovation_desc: "China North Industries Group es el mayor conglomerado de sistemas terrestres del país, y suministra las armas ligeras y la artillería de toda la fuerza terrestre. Romper la imitación cautelosa de sus oficinas de diseño les permite buscar sistemas de infantería y piezas de artillería genuinamente nuevos."
 CHI_northern_theatre_command: "Mando del Teatro Norte"
 CHI_northern_theatre_command_desc: "Con centro en Shenyang, el Mando del Teatro Norte cubre la península de Corea y la frontera rusa. Enfatiza la planificación operativa y la cohesión de sus formaciones pesadas de armas combinadas."
 CHI_olympic_athlete_village: "Villa Olímpica y Centro de Medios de Comunicación"
 CHI_olympic_athlete_village_desc: "Construir la villa de los atletas olímpicos y el centro internacional de radiodifusión de medios de comunicación en la parte norte de la Zona Olímpica. Al completarse, los edificios se reconvertirán para uso residencial y comercial, aumentando el parque de viviendas y oficinas de Pekín."
 CHI_olympic_environmental_program: "Programa medioambiental"
 CHI_olympic_environmental_program_desc: "Acelerar la transición de carbón a gas en la red de calefacción de Pekín, reubicar las instalaciones más contaminantes de Capital Steel Group y lanzar una campaña de reforestación a gran escala en las montañas circundantes. El programa mejorará la calidad del aire para cumplir con los estándares olímpicos y demostrará el compromiso de China con el desarrollo sostenible."
 CHI_olympic_mission: "Prepararse para los Juegos Olímpicos de Pekín"
 CHI_olympic_mission_desc: "Nos hemos comprometido a albergar los Juegos Olímpicos de Pekín 2008. La comunidad internacional nos estará observando. Financia los cuatro programas de preparación (sedes, viviendas para atletas, transporte y medio ambiente) antes de que venza el plazo. No cumplir a tiempo avergonzará al gobierno y minará la confianza pública."
 CHI_olympic_preparations: "Preparativos olímpicos"
 CHI_olympic_preparations_tt: "Si logramos completar todos los enfoques de preparación olímpica, obtendremos:"
 CHI_olympic_transport_links: "Enlaces de transporte olímpicos"
 CHI_olympic_transport_links_desc: "Ampliar las líneas de metro hacia la Zona Olímpica, inaugurar el tren exprés del Aeropuerto Capital de Pekín y modernizar el corredor ferroviario Qinhuangdao-Shenyang para gestionar el aumento del tráfico de pasajeros y mercancías previsto durante y después de los Juegos."
 CHI_olympic_venue_construction: "Construcción de sedes olímpicas"
 CHI_olympic_venue_construction_desc: "Financiar la construcción del Estadio Nacional, el Centro Acuático Nacional y el Velódromo Nacional en el distrito de la Zona Olímpica. Estas sedes principales servirán como legado permanente de los Juegos Olímpicos de Pekín 2008 y funcionarán como centros comerciales y deportivos para la capital."
 CHI_pacific_pla_training: "Entrenamiento del EPL en el Pacífico"
 CHI_patrol_diaoyu_fishing_grounds: "Patrullar los caladeros de las Diaoyu"
 CHI_patrol_diaoyu_fishing_grounds_desc: "Enviar patrulleras de las PAF a las aguas en disputa. La tensión aumentará y Tokio se verá obligado a reaccionar."
 CHI_pla_joint_maritime_exercise: "Ejercicio marítimo conjunto en el Pacífico"
 CHI_pla_joint_maritime_exercise_desc: "Llevar a cabo ejercicios marítimos conjuntos con nuestros socios de la Franja y la Ruta en el Pacífico. Potencia su experiencia naval y nuestra influencia en toda la región."
 CHI_pla_train_SOL: "Entrenar a las fuerzas de seguridad de las Islas Salomón"
 CHI_pla_train_SOL_desc: "Desplegar cuadros de entrenamiento del EPL para asistir a las fuerzas de seguridad de las Islas Salomón. Transfiere la experiencia del ejército y profundiza los lazos de defensa."
 CHI_poly_innovation: "Poly Technologies: Innovación original"
 CHI_poly_innovation_desc: "Poly Technologies, la rama de exportación de armas del EPL, abarca todo el catálogo de material militar chino. Orientar su alcance comercial hacia el desarrollo genuino amplía el progreso en todo el sector de la defensa."
 CHI_Press_NKO_on_Nuclear: "Presionar a Pionyang para la moderación nuclear"
 CHI_Press_NKO_on_Nuclear_desc: "Aplicar presión diplomática directa sobre Corea del Norte para congelar los ensayos nucleares y limitar los despliegues. El progreso es gradual pero demuestra a Washington que Pekín es un socio serio en materia de no proliferación."
 CHI_pressure_iaea_access: "Presionar para lograr el acceso del OIEA"
 CHI_pressure_iaea_access_desc: "Presionar a Pionyang para que admita a los inspectores del OIEA en el complejo de Yongbyon. La presión china conlleva un peso real allí donde las exigencias occidentales solo endurecen la resistencia norcoreana."
 CHI_princeling_intelligence_report: "Informe de inteligencia de los «principitos»"
 CHI_princeling_intelligence_report_desc: "Consolidar los últimos informes de los activos de la red dentro del liderazgo norcoreano. Cada revisión define mejor nuestra imagen de las facciones, rivalidades y puntos de presión del régimen."
 CHI_pro_natalist_subsidies: "Subsidios pronatalistas"
 CHI_pro_natalist_subsidies_desc: "Los gobiernos locales de toda China comienzan a emitir transferencias directas de efectivo, subsidios para la compra de viviendas y permisos de maternidad y paternidad ampliados para incentivar la natalidad. Provincias como Jilin y Sichuan pilotan programas por valor de decenas de miles de yuanes por hijo. Las comparaciones internacionales sugieren que un gasto fiscal sustancial produce solo avances marginales en la fertilidad, pero los subsidios reducen los costes domésticos y apoyan el consumo interno a corto plazo."
 CHI_propose_unity_government: "Proponer un gobierno de unidad coreano"
 CHI_propose_unity_government_desc: "Presentar una propuesta formal china para un gobierno de unidad transitorio bajo reconocimiento mutuo. El gambito diplomático más audaz de la era, y el más arriesgado."
 CHI_push_rcep_signing: "Presionar para la firma del RCEP"
 CHI_push_rcep_signing_desc: "El Asociación Económica Integral Regional, firmado en noviembre de 2020 y en vigor desde enero de 2022, vincula a China, Japón, Corea del Sur, los Estados de la ASEAN, Australia y Nueva Zelanda en la mayor zona de libre comercio del mundo. Asegurar la firma nos ancla en el centro del comercio asiático."
 CHI_railway_central_upgrade: "Modernización del corredor ferroviario central"
 CHI_railway_central_upgrade_desc: "Modernizar las terminales e infraestructuras ferroviarias en China central y el nodo de Pekín, abarcando Hubei, Henan y Pekín. El fortalecimiento de este corredor reduce la congestión en las arterias de mercancías más densas de China y mejora el suministro de materiales industriales a las zonas de fabricación del interior."
 CHI_railway_east_upgrade: "Modernización del corredor ferroviario oriental"
 CHI_railway_east_upgrade_desc: "Modernizar las terminales e infraestructuras ferroviarias en China oriental y central, conectando Jiangxi, Anhui y Sichuan en una red continua de mercancías y pasajeros. Las mejoras aumentan la capacidad de construcción regional y reducen el tiempo necesario para trasladar los insumos industriales hacia el interior desde los puertos costeros."
 CHI_railway_improvement: "Modernización del ferrocarril nacional"
 CHI_railway_north_upgrade: "Modernización del corredor ferroviario del norte"
 CHI_railway_north_upgrade_desc: "Modernizar las terminales ferroviarias y las infraestructuras de superficie a lo largo del corredor del norte de China que une Hebei, Shanxi y las provincias circundantes. La mejora de la capacidad ferroviaria aumenta el rendimiento del suministro, reduce los costes logísticos y acelera la construcción en toda la región."
 CHI_railway_south_upgrade: "Modernización del corredor ferroviario del sur"
 CHI_railway_south_upgrade_desc: "Modernizar las terminales e infraestructuras ferroviarias en todo el sur de China y Yunnan, vinculando a Guangdong, Hunan y las provincias fronterizas del suroeste a la red nacional. El programa permite un movimiento más rápido de las manufacturas y los productos agrícolas, al tiempo que apoya la expansión industrial a lo largo del corredor."
 CHI_railway_west_upgrade: "Modernización del corredor ferroviario occidental"
 CHI_railway_west_upgrade_desc: "Modernizar las terminales e infraestructuras ferroviarias en todo el noroeste y suroeste, conectando Shaanxi, Gansu, Chongqing y Sinkiang a la red nacional de transporte de mercancías. La inversión reduce los costes de transporte para los parques industriales occidentales y abre provincias previamente aisladas a las cadenas de suministro de la manufactura a gran escala."
 CHI_raise_retirement_age: "Aumentar la edad de jubilación"
 CHI_raise_retirement_age_desc: "La edad legal de jubilación en China, fijada en 1978, se encuentra entre las más bajas del mundo: 60 años para los hombres, 55 para las mujeres en puestos administrativos y 50 para las mujeres en puestos operativos. Un aumento escalonado prolonga la vida laboral de dos a cinco años, manteniendo a los trabajadores experimentados en la población activa durante más tiempo y aliviando la presión sobre el sistema de pensiones. La resistencia de los trabajadores que esperaban una jubilación anticipada y de los jóvenes que temen una reducción de las contrataciones es significativa."
 CHI_rare_earth_chip_leverage_decision: "Presionar con los controles de tierras raras"
 CHI_rare_earth_chip_leverage_decision_desc: "Vincula el alivio del embargo occidental de chips a la continuidad de las exportaciones chinas de tierras raras y galio. Abre negociaciones con Washington: el éxito relaja los controles y avanza la autosuficiencia; la negativa endurece el embargo y desperdicia el capital político invertido."
 CHI_rare_earth_embargo_decision: "Accionar la palanca de las tierras raras"
 CHI_rare_earth_embargo_decision_desc: "China refina cerca del noventa por ciento de las tierras raras del mundo, los imanes de cada misil guiado y avión furtivo. Cortar el acceso de un rival paraliza su producción defensiva durante meses, al precio de capital político y una reputación de proveedor poco fiable."
 CHI_rare_earth_supply_assurance: "Garantizar el suministro de tierras raras"
 CHI_rare_earth_supply_assurance_desc: "China refina la gran mayoría de las tierras raras del mundo, insumos para los semiconductores, baterías y pantallas de Corea del Sur. Ofrecer a Seúl un suministro garantizado nos convierte en un socio fiable y debilita el control de Washington sobre su aliado."
 CHI_rcep_deepening: "Profundizar la RCEP"
 CHI_rcep_deepening_desc: "Proponer a los socios regionales una aplicación acelerada de los compromisos de la RCEP. Una integración económica más profunda con Asia-Pacífico consolida a China como el socio económico indispensable de la región."
 CHI_recall_paf_maritime_militia: "Retirar la milicia marítima de la APF"
 CHI_recall_paf_maritime_militia_desc: "Retirar la presencia permanente de la milicia y dejar que la presión se calme."
 CHI_rein_in_cliques: "Frenar a las camarillas"
 CHI_rein_in_cliques_desc: "Auditar periódicamente las camarillas de contrabando y las redes de patronazgo antes de que crezcan sin control. Recuperar los fondos desviados rellena el tesoro y reafirma la confianza del Partido, aunque el cuerpo de oficiales resiente el escrutinio."
 CHI_replace_synopsys_cadence_decision: "Sustituir a Synopsys y Cadence"
 CHI_replace_synopsys_cadence_decision_desc: "Tras la prohibición de exportación de mayo de 2025, migrar todas las casas fabless nacionales a flujos de EDA de Empyrean, Primarius y Xpeedic para una cobertura de diseño completa."
 CHI_retry_chang_e_mission: "Relanzar la sonda Chang'e"
 CHI_retry_chang_e_mission_desc: "La sonda no llegó a la Luna ni la inspeccionó. Construir un reemplazo y ponerlo en camino."
 CHI_retry_shenzhou_mission: "Repetir la misión Shenzhou"
 CHI_retry_shenzhou_mission_desc: "El último intento se quedó corto. Revisar los datos de vuelo, corregir la avería y montar otro Shenzhou para el lanzamiento."
 CHI_retry_tiangong_mission: "Reintentar el ensamblaje del Tiangong"
 CHI_retry_tiangong_mission_desc: "El acoplamiento o la inserción del módulo no salió según lo previsto. Reacondicionar y volver a intentar el ensamblaje de la estación."
 CHI_sac_innovation: "Shenyang Aircraft: Innovación original"
 CHI_sac_innovation_desc: "La Corporación de Aviones de Shenyang construye los cazas pesados de la Fuerza Aérea y la Armada del EPL, desde la serie J-11 hasta el J-15 embarcado y el J-35. Reformarla afila la vanguardia del combate aéreo chino."
 CHI_sco_anti_terror_crackdown: "Lanzar una redada antiterrorista"
 CHI_sco_anti_terror_crackdown_desc: "Ordenar a los servicios de seguridad una redada exhaustiva contra las redes terroristas en el marco de los Tres Males de la OCS. Eleva temporalmente nuestra postura antiterrorista a costa de la estabilidad interna."
 CHI_sco_apply_as_dialogue_partner: "Solicitar la condición de Socio de Diálogo"
 CHI_sco_apply_as_dialogue_partner_desc: "Podemos solicitar formalmente la condición de Socio de Diálogo en la Organización de Cooperación de Shanghái. Es el primer paso hacia un compromiso más profundo con China y sus socios."
 CHI_sco_category: "La Organización de Cooperación de Shanghái"
 CHI_sco_category_desc: "\n£MAIN_desctext_sco \n\n\n\n§YLa Organización de Cooperación de Shanghái§! o §YOCS§! es una organización intergubernamental euroasiática centrada en la cooperación económica, política y de seguridad. Originada en §Yel Grupo de Shanghái§!, ha evolucionado hasta convertirse en un amplio marco mediante el cual §Y[CHI.GetFlag]China§! y §Y[SOV.GetFlag]Rusia§! amplían su influencia mientras gestionan la estabilidad y la cooperación regionales.\n\nEn lugar de funcionar como una alianza tradicional, la §YOCS§! crece mediante integración gradual. Los países pueden ser primero §YSocios de Diálogo§!, luego §YObservadores§!, antes de solicitar finalmente la §YMembresía§! plena.\n\nLa disposición de los países a cooperar con la §YOCS§! depende de varios factores:\n\n§YLa agresividad china§! refleja lo asertiva que es §Y[CHI.GetFlag]China§!. Niveles bajos hacen la organización más atractiva, mientras que los altos desincentivan la cooperación y pueden alejar a los miembros.\n\n§YLa cohesión de la OCS§! representa la estabilidad interna y la confianza entre los estados participantes. Una cohesión alta mejora la cooperación y la eficacia de los proyectos, mientras que una baja ralentiza la integración y aumenta el riesgo de deserción de los miembros.\n\n§YEl equilibrio China-Rusia§! determina la estabilidad política interna de la organización. Una relación equilibrada garantiza una expansión fluida, mientras que el dominio de cualquiera de las partes puede generar fricciones, retrasos o una cooperación reducida.\n\nMediante §YProyectos Económicos§!, de §YSeguridad§! y §YEstratégicos§! conjuntos, la §YOCS§! permite a sus participantes ampliar su influencia, fortalecer los lazos regionales y construir un bloque de poder alternativo en Eurasia.\n\nSi la agresividad china supera los niveles §R5§! y §R10§!, §Y[JAP.GetNameWithFlag]§! obtendrá nuevas opciones para ampliar el Artículo 9 de manera que contrarreste las posiciones militares de [CHI.GetFlag]§Y[CHI.GetAdjectiveCap]§!.\n\n$CHI_chinese_aggression_display$\n$CHI_sco_cohesion_display$\n$CHI_sco_balance_display$"
 CHI_sco_cohesion_decay: "Ajuste de cohesión de la OCS"
 CHI_sco_cohesion_decay_desc: "Una recalibración anual oculta que empuja la cohesión de la OCS hacia su equilibrio natural de cinco, ajustada al alza en medio punto por cada megaproyecto activo. Si la cohesión está por encima del equilibrio, baja en uno; si está por debajo, sube en uno."
 CHI_sco_consider_leaving: "Reconsiderar la pertenencia a la OCS"
 CHI_sco_consider_leaving_desc: "Una decisión oculta gestionada por la IA mediante la cual los estados miembros y observadores evalúan si el deterioro de las relaciones con Pekín o los crecientes problemas de cohesión de la OCS justifican rebajar su participación. Los estados con alta exposición a la agresividad china o con mala opinión de China sopesarán la salida con más seriedad."
 CHI_sco_upgrade_to_member: "Solicitar la membresía plena en la OCS"
 CHI_sco_upgrade_to_member_desc: "Como Observador reconocido, ya podemos solicitar la membresía plena en la Organización de Cooperación de Shanghái."
 CHI_sco_upgrade_to_observer: "Solicitar la condición de Observador"
 CHI_sco_upgrade_to_observer_desc: "Tras habernos consolidado como Socio de Diálogo, podemos buscar ahora la condición plena de Observador en la OCS, lo que otorga acceso a una cooperación económica y política más amplia."
 CHI_scs_assertive_patrol_MAY: "Patrulla asertiva: Spratlys malasios"
 CHI_scs_assertive_patrol_MAY_desc: "Ordenar una flotilla de la Armada del EPL a aguas en disputa con Malasia en el sur de las Spratlys, cerca de los bajíos de Luconia. Los lazos económicos de Kuala Lumpur con nosotros complican sus opciones de respuesta, pero aún se requiere una victoria decisiva para avanzar el contador de enfrentamientos. Los enfrentamientos inconclusos son habituales dada la postura cautelosa de Malasia; los reveses arriesgan perturbar la relación de préstamos para infraestructura."
 CHI_scs_assertive_patrol_PHI: "Patrulla asertiva: Spratlys filipinos"
 CHI_scs_assertive_patrol_PHI_desc: "Ordenar una flotilla de la Armada del EPL a aguas en disputa con Filipinas, contra las operaciones filipinas de reabastecimiento en el bajío de Ayungin y los accidentes orientales de las Spratlys. Una victoria decisiva avanza el contador de enfrentamientos para Filipinas; un resultado inconcluso lo mantiene; un revés cuesta $CHI_scs_framework$ y puede llevar a Manila a invocar consultas bajo el Tratado de Defensa Mutua con EE. UU."
 CHI_scs_assertive_patrol_VIE: "Patrulla asertiva: Spratlys vietnamitas"
 CHI_scs_assertive_patrol_VIE_desc: "Ordenar una flotilla de la Armada del EPL a aguas en disputa con Vietnam, desafiando a los guardacostas vietnamitas y buques de reabastecimiento en la cadena occidental de las Spratlys. La operación tiene tres resultados posibles: una victoria táctica decisiva avanza el contador de enfrentamientos hacia el umbral del ultimátum; un enfrentamiento inconcluso mantiene el contador estable; un revés reduce $CHI_scs_framework$ y puede provocar una respuesta diplomática de represalia de Hanói."
 CHI_scs_block_asean_consensus: "Bloquear el consenso de la ASEAN"
 CHI_scs_block_asean_consensus_desc: "Usar la influencia china sobre Camboya y Laos para impedir que una reprimenda pendiente a nivel de la ASEAN llegue al comunicado de la cumbre. Ambos estados ocupan posiciones de bloqueo dentro del mecanismo de consenso; su cooperación mantiene silenciosa la declaración conjunta sobre la conducta en el Mar del Sur de China. La maniobra eleva $CHI_chinese_aggression$ levemente, ya que los observadores regionales notan el cinismo, pero otorga una ganancia modesta a $CHI_scs_framework$ al evitar una reprimenda institucionalizada."
 CHI_scs_boundary_codification_MAY: "Tratado de límites marítimos: Malasia"
 CHI_scs_boundary_codification_MAY_desc: "Concluir un tratado bilateral de límites marítimos con Malasia, formalizando el acuerdo de facto en las aguas disputadas del sur. La firma de Kuala Lumpur completa el anillo de codificaciones bilaterales y aísla cualquier reto multilateral restante."
 CHI_scs_boundary_codification_PHI: "Tratado de límites marítimos: Filipinas"
 CHI_scs_boundary_codification_PHI_desc: "Concluir un tratado bilateral de límites marítimos con Filipinas, sustituyendo el laudo arbitral de 2016 de la UNCLOS. Manila acepta apartar la sentencia del tribunal a cambio de garantías de inversión china y acceso ampliado a la zona de desarrollo conjunto."
 CHI_scs_boundary_codification_VIE: "Tratado de límites marítimos: Vietnam"
 CHI_scs_boundary_codification_VIE_desc: "Concluir un tratado bilateral de límites marítimos con Vietnam en términos favorables a China, codificando las líneas acordadas en el Golfo de Tonkín y apartando las disputas de las Paracel y las Spratlys bajo un marco de desarrollo conjunto. Hanói acepta el acuerdo como el mejor resultado disponible; Pekín asegura un precedente."
 CHI_scs_carrier_strike_group_deployment: "Despliegue de grupo de portaaviones"
 CHI_scs_carrier_strike_group_deployment_desc: "Desplegar un grupo de portaaviones completo al Mar del Sur de China para una estación operativa prolongada. El despliegue señala que China posee y ejercerá la capacidad de controlar el mar en fuerza, no meramente de disputarlo."
 CHI_scs_demand_tribute_MAY: "Exigir la cesión de los Nansha"
 CHI_scs_demand_tribute_MAY_desc: "Enviar un ultimátum a Kuala Lumpur para que ceda formalmente las Spratlys meridionales, incluidos los accidentes ocupados por Malasia alrededor del Arrecife Swallow y Ardasier. La nota llega envuelta en la memoria de las patrullas de la era Ming de Zheng He desde Malaca, reencuadrando la exigencia como la reanudación de un viejo orden más que una anexión nueva. De los tres reclamantes, Malasia es la más proclive a tragar la pérdida en silencio."
 CHI_scs_demand_tribute_PHI: "Exigir la cesión de los Zhongsha"
 CHI_scs_demand_tribute_PHI_desc: "Enviar un ultimátum a Manila para que ceda formalmente el Banco Macclesfield, el accidente sumergido ya administrado por China como distrito Zhongsha de Sansha. La nota prescinde de la ficción negociadora bilateral y pone a prueba el Tratado de Defensa Mutua de 1951 sobre un banco sin guarnición ni pista de aterrizaje, la prueba más limpia posible de si Washington sigue tratando los arrecifes como líneas rojas."
 CHI_scs_demand_tribute_VIE: "Exigir la cesión de los Xisha"
 CHI_scs_demand_tribute_VIE_desc: "Enviar un ultimátum a Hanói para que ceda formalmente las Paracel, territorio que mantenemos por la fuerza desde la batalla de 1974 que expulsó a la Armada de la República de Vietnam del Grupo Crescent. La nota viste la exigencia con el lenguaje del derecho histórico anterior a la Indochina francesa, presentándola como el cierre de un expediente inacabado más que una reclamación nueva. Hanói puede ratificar la pérdida por escrito, o invitar a una segunda lección según el modelo de 1979."
 CHI_scs_deploy_maritime_militia: "Desplegar la milicia marítima"
 CHI_scs_deploy_maritime_militia_desc: "Desplegar hacia una región marítima en disputa buques de la flota pesquera que operan bajo coordinación de la Armada del EPL. La milicia proporciona presencia persistente con tapadera civil plausible, creando hechos sobre el agua más rápido de lo que la protesta diplomática puede responder."
 CHI_scs_first_island_chain_exercise: "Ejercicio de la Primera Cadena Insular"
 CHI_scs_first_island_chain_exercise_desc: "Ejecutar un gran ejercicio de flota a lo largo de toda la Primera Cadena Insular, desde el Mar Amarillo hasta el Mar del Sur de China. El ejercicio demuestra capacidades de negación de acceso y zona (A2/AD) contra cualquier potencia que intente intervenir dentro de la cadena."
 CHI_scs_infrastructure_loan_MAY: "Préstamo de infraestructura: Malasia"
 CHI_scs_infrastructure_loan_MAY_desc: "Ofrecer financiamiento de infraestructura de la Franja y la Ruta a Malasia, cubriendo el Ferrocarril de la Costa Este y la expansión portuaria en el corredor del estrecho de Malaca. El acuerdo cimenta la posición de Malasia como el socio de la ASEAN más integrado económicamente con China."
 CHI_scs_infrastructure_loan_PHI: "Préstamo de infraestructura: Filipinas"
 CHI_scs_infrastructure_loan_PHI_desc: "Ofrecer financiamiento de infraestructura de la Franja y la Ruta a Filipinas, cubriendo construcción de puentes, desarrollo ferroviario y un nuevo puerto de aguas profundas. La oferta llega mientras Manila sopesa los costes y beneficios de su alianza con Washington."
 CHI_scs_infrastructure_loan_VIE: "Préstamo de infraestructura: Vietnam"
 CHI_scs_infrastructure_loan_VIE_desc: "Ofrecer financiamiento de infraestructura de la Franja y la Ruta a Vietnam, cubriendo mejoras portuarias, enlaces ferroviarios y desarrollo de zonas industriales. El préstamo profundiza la dependencia económica vietnamita del capital chino y eleva el coste de la confrontación diplomática para Hanói."
 CHI_scs_invoke_doc_2002: "Reafirmar la DOC de 2002"
 CHI_scs_invoke_doc_2002_desc: "Reafirmar públicamente la Declaración sobre la Conducta de las Partes en el Mar del Sur de China de 2002 como marco rector de la gestión de disputas. El gesto es en gran medida simbólico, pero señala contención a los socios de la ASEAN y proporciona una base diplomática para las negociaciones bilaterales."
 CHI_scs_island_construction_civilian: "Construir infraestructura civil"
 CHI_scs_island_construction_civilian_desc: "Construir instalaciones portuarias, estaciones meteorológicas y viviendas civiles permanentes en el complejo insular. Los signos visibles de ocupación ordinaria —escuelas, clínicas y edificios administrativos— refuerzan el argumento político de que estos accidentes constituyen territorio chino habitado."
 CHI_scs_island_construction_radar: "Erguir radares y redes SIGINT"
 CHI_scs_island_construction_radar_desc: "Construir instalaciones de recolección de inteligencia de señales y redes de radar de horizonte trasero en la isla artificial. Las instalaciones proporcionan conciencia persistente del dominio marítimo en todo el Mar del Sur de China y rastrean movimientos navales y aéreos extranjeros en tiempo real."
 CHI_scs_island_construction_runway: "Construir pista de aterrizaje"
 CHI_scs_island_construction_runway_desc: "Tender una pista pavimentada de 3.000 metros en el complejo insular artificial, capaz de operar aviones de combate y patrullas marítimas de largo alcance. El aeródromo transforma la instalación de un puesto avanzado de presencia en un centro de proyección de poder."
 CHI_scs_island_construction_sam_battery: "Instalar batería antiaérea"
 CHI_scs_island_construction_sam_battery_desc: "Desplegar baterías de misiles tierra-aire de largo alcance en el complejo insular. Las instalaciones extienden el perímetro de defensa aérea de China hacia el interior del Mar del Sur de China, complicando cualquier operación extranjera de libertad de navegación o patrulla aérea."
 CHI_scs_joint_development_MAY: "Acuerdo de explotación de los bajíos de Luconia"
 CHI_scs_joint_development_MAY_desc: "Acercarse a Petronas con un acuerdo de explotación conjunta que cubra los bloques ND6 y SK308 alrededor de los bajíos de Luconia, donde los guardacostas chinos ya vigilan las plataformas malasias en South Luconia. El hábito de Kuala Lumpur de compartimentar la disputa a puerta cerrada la convierte en la firma más fácil de obtener; un acuerdo concluido se convierte en la plantilla que Pekín agita ante Hanói y Manila."
 CHI_scs_joint_development_PHI: "Revivir el MOU energético de Manila"
 CHI_scs_joint_development_PHI_desc: "Revivir el Memorando de Entendimiento sobre Desarrollo de Petróleo y Gas archivado, emparejando a CNOOC con PXP Energy en el Contrato de Servicio 72 del Reed Bank. Manila embolsa una participación fija de ingresos y una ola de inversión exploratoria a cambio de tratar el laudo arbitral de 2016 como políticamente inactivo. La vía bilateral entierra el caso filipino bajo derecho contractual."
 CHI_scs_joint_development_VIE: "Pacto de explotación conjunta del Banco Vanguard"
 CHI_scs_joint_development_VIE_desc: "Abrir conversaciones discretas con Hanói sobre una zona de desarrollo conjunto en el solapamiento del Banco Vanguard y las aguas no resueltas al este de la delimitación del Golfo de Tonkín del año 2000. CNOOC y PetroVietnam repartirían derechos de prospección e ingresos bajo una fórmula de «sin perjuicio de la soberanía», congelando la cuestión legal mientras fluye el gas. El canal bilateral mantiene a la ASEAN a distancia y elimina el incentivo de Hanói de invocar la UNCLOS."
 CHI_scs_natuna_press_claim: "Empujar la reclamación de los nueve segmentos hacia Natuna"
 CHI_scs_natuna_press_claim_desc: "Emitir una nota formal afirmando que nuestros derechos históricos bajo la línea de los nueve segmentos se extienden a aguas que solapan la ZEE de Natuna de Indonesia. La reclamación es legalmente contestada, ya que Indonesia no se considera un reclamante del Mar del Sur de China, pero su aserción extiende la frontera diplomática hacia el sur y crea un nuevo punto de presión sobre el mayor estado de la ASEAN."
 CHI_scs_natuna_provocation: "Provocación en Natuna"
 CHI_scs_natuna_provocation_desc: "Desplegar buques de la milicia marítima china en la Zona Económica Exclusiva de Natuna, Indonesia, bajo la tapadera de operaciones pesqueras rutinarias. La incursión es deniable pero visible; Yakarta responderá diplomáticamente. La acción sondea el límite meridional del alcance operativo chino y pone a prueba la determinación indonesia sin comprometer medios regulares de la Armada del EPL."
 CHI_scs_reclaim_taiping: "Recuperar Taiping"
 CHI_scs_reclaim_taiping_desc: "La isla Taiping es el accidente natural más grande de la cadena de las Spratlys y permanece bajo administración de la República de China en Taiwán. Con los tres estados de las Spratlys asegurados, una operación directa para tomar Taiping representa el acto final de la consolidación del Mar del Sur de China, separada de y anterior a cualquier escenario más amplio de reunificación con Taiwán. La operación conlleva un coste muy alto de Poder Político y exige el compromiso pleno de la Flota del Mar del Sur de la Armada del EPL."
 CHI_scs_standoff_malaysia: "Ejecutar hostigamiento: Malasia"
 CHI_scs_standoff_malaysia_desc: "Ejecutar el Modelo Scarborough contra un accidente en disputa reclamado por Malasia. Kuala Lumpur ha gestionado históricamente la relación con Pekín con cuidado; este hostigamiento pone a prueba si la dependencia económica contiene una protesta diplomática formal."
 CHI_scs_standoff_philippines: "Ejecutar hostigamiento: Filipinas"
 CHI_scs_standoff_philippines_desc: "Ejecutar el Modelo Scarborough contra un accidente en disputa reclamado por Filipinas. Un encuentro con un buque pesquero filipino se escala mediante una confrontación de guardacostas hasta que Manila se retira, dejando una presencia china permanente."
 CHI_scs_standoff_vietnam: "Ejecutar hostigamiento: Vietnam"
 CHI_scs_standoff_vietnam_desc: "Ejecutar el Modelo Scarborough contra un accidente en disputa reclamado por Vietnam. El guardacostas de Hanói está superado en medios y personal; la cuestión es si Hanói acepta la pérdida en silencio o escala de forma que atraiga la atención internacional."
 CHI_scs_summon_dragon_king_blessing: "Bendición de la Flota del Rey Dragón"
 CHI_scs_summon_dragon_king_blessing_desc: "Celebrar una bendición ceremonial de la Flota del Mar del Sur en el templo Tianhou de Sanya, Hainan, invocando la protección de Mazu, la Diosa del Mar, venerada por generaciones de navegantes del Mar del Sur. La ceremonia se retransmite a nivel nacional; la Flota del Mar del Sur zarpó hacia ejercicios inmediatamente después."
 CHI_secure_kpa_general_staff: "Asegurar contactos en el Estado Mayor del KPA"
 CHI_secure_kpa_general_staff_desc: "Cultivar oficiales alineados con China en el Estado Mayor General del Ejército Popular de Corea. Un general en activo dentro de la red vale más que una docena de políticos en el exilio."
 CHI_seek_basing_BAN: "Solicitar base naval en Bangladés"
 CHI_seek_basing_BAN_desc: "Acercarse a Daca con una solicitud formal de acceso logístico a las instalaciones portuarias de Chittagong, enmarcada como asociación estratégica."
 CHI_seek_basing_BRM: "Solicitar base naval en Birmania"
 CHI_seek_basing_BRM_desc: "Acercarse a Naipyidó con una solicitud formal de acceso logístico a Kyaukpyu y Sittwe, enmarcada como asociación estratégica."
 CHI_seek_basing_CBD: "Solicitar base naval en Camboya"
 CHI_seek_basing_CBD_desc: "Acercarse a Nom Pen con una solicitud formal de acceso logístico a la Base Naval de Ream, enmarcada como asociación estratégica."
 CHI_seek_basing_PAK: "Ampliar derechos de base en Pakistán"
 CHI_seek_basing_PAK_desc: "Construir sobre la asociación de Hermanos de Hierro para expandir la logística naval china por los puertos paquistaníes más allá de Gwadar."
 CHI_seek_basing_SRI: "Solicitar base naval en Sri Lanka"
 CHI_seek_basing_SRI_desc: "Acercarse a Colombo con una solicitud formal de acceso logístico a Hambantota, enmarcada como asociación estratégica."
 CHI_semiconductor_coop_with_kor: "Cooperación en semiconductores con Corea"
 CHI_semiconductor_coop_with_kor_desc: "Establecer una iniciativa conjunta de investigación y fabricación de semiconductores con Corea del Sur. El acceso a la experiencia surcoreana en fabricación de chips acelera el desarrollo tecnológico chino."
 CHI_seoul_hanbok_exchange: "Organizar un intercambio de hanbok en Seúl"
 CHI_seoul_hanbok_exchange_desc: "La diplomacia cultural puede suavizar las tensiones incluso en medio de disputas sobre patrimonio compartido. Patrocinar un intercambio de hanbok en Seúl templá el sentimiento público y abre un canal de influencia más blando hacia Corea del Sur."
 CHI_shenzhou_mission: "Volar la misión Shenzhou"
 CHI_shenzhou_mission_desc: "Una nave Shenzhou está montada sobre un Larga Marcha 2F en el Centro de Lanzamiento de Satélites de Jiuquan. La tripulación debe alcanzar órbita y regresar con seguridad para confirmar nuestra capacidad independiente de vuelo espacial tripulado. Las probabilidades de éxito mejoran a medida que crece nuestra experiencia de lanzamiento."
 CHI_sichuan_tibet_railway: "Ferrocarril Sichuan-Tíbet"
 CHI_sichuan_tibet_railway_desc: "Abrir un ferrocarril a través de las gargantas y altos puertos entre Chengdu y Lhasa, con más del 80 por ciento de su trazado en túneles y puentes. El enlace pone fin al aislamiento del Tíbet, refuerza el control central sobre la meseta y proporciona una arteria estratégica hacia la frontera india."
 CHI_skilled_immigration_drive: "Impulso a la inmigración cualificada"
 CHI_skilled_immigration_drive_desc: "El sistema de residencia permanente chino ha sido históricamente de los más restrictivos entre las grandes economías. Una nueva vía de visados de alta cualificación, modelada sobre las rutas de green card de Estados Unidos y Canadá, se dirige a investigadores, ingenieros y emprendedores. El programa es modesto según los estándares globales, pero marca un cambio de política significativo al reconocer que el suministro demográfico interno por sí solo no puede cubrir las carencias emergentes en los sectores tecnológico y sanitario."
 CHI_snwt_central_route: "Trasvase Sur-Norte: Ruta Central"
 CHI_snwt_central_route_desc: "Canalizar agua del embalse de Danjiangkou, en el río Han (Hubei), hacia el norte a través de Henan y Hebei hasta Pekín. Operativa desde diciembre de 2014, la Ruta Central abastece el agua potable de la capital y alivia el agotamiento crónico de los acuíferos de la Llanura del Norte de China."
 CHI_snwt_eastern_route: "Trasvase Sur-Norte: Ruta Oriental"
 CHI_snwt_eastern_route_desc: "Bombear agua hacia el norte desde el bajo Yangtsé, cerca de Jiangsu, siguiendo el curso del antiguo Gran Canal hasta las sedientas ciudades de Shandong y Tianjin. La Ruta Oriental es la primera de tres líneas de desvío que en conjunto trasladan unos 44.800 millones de metros cúbicos de agua cada año hacia el árido norte."
 CHI_snwt_western_route: "Trasvase Sur-Norte: Ruta Occidental"
 CHI_snwt_western_route_desc: "Desviar las cabeceras del Yangtsé a través de las montañas Bayan Har, en la meseta de Qinghai-Tíbet, hacia el alto río Amarillo, regando Qinghai, Gansu y Shaanxi. La más desafiante técnicamente de las tres rutas, aseguraría agua para todo el árido noroeste."
 CHI_south_china_sea_category: "Mar del Sur de China"
 CHI_south_china_sea_category_desc: "Decisiones continuas que moldean nuestra postura en el Mar del Sur de China. Las acciones aquí afectan a la variable Marco del Mar del Sur de China, a nuestras relaciones con Vietnam, Filipinas y Malasia, y al riesgo de confrontación con Estados Unidos."
 CHI_southern_theatre_command: "Comando del Teatro del Sur"
 CHI_southern_theatre_command_desc: "Con sede en Cantón, el Comando del Teatro del Sur supervisa el Mar del Sur de China y la frontera con Vietnam. Se especializa en la coordinación conjunta entre guarniciones insulares dispersas y el reconocimiento que las enlaza."
 CHI_space_program: "Programa Espacial de China"
 CHI_subcontinent_strategy: "Estrategia para el Subcontinente"
 CHI_subcontinent_strategy_desc: "Nuestro conjunto diplomático y militar para el subcontinente indio: presión a lo largo de la Línea de Control Real, asociaciones con Pakistán y la periferia sudasiática, y la disputada frontera del Himalaya. Las decisiones emitidas desde aquí moldean la escalada en la frontera y nuestra palanca de influencia en toda la región.\n\n$raj_chi_border_readiness$: [?THIS.raj_chi_border_readiness|Y0]\n$raj_chi_border_tension$: [?global.raj_chi_border_tension|Y0]\n\n§YProgreso de reclamaciones§! (80 necesario para presentar una):\nArunachal Pradesh: [?THIS.raj_chi_border_progress_475|Y0]\nSikkim: [?THIS.raj_chi_border_progress_982|Y0]\nAksai Chin: [?THIS.raj_chi_border_progress_591|Y0]\nLadakh: [?THIS.raj_chi_border_progress_993|Y0]"
 CHI_Surveillance_Export: "Exportar arquitectura de vigilancia"
 CHI_Surveillance_Export_desc: "Desplegar sistemas chinos de vigilancia y monitoreo digital a un socio no democrático. Cuesta 80 tanto al fondo de la Franja y la Ruta como al tesoro nacional."
 CHI_thaad_retaliation_escalate: "Escalar la represalia por el THAAD"
 CHI_thaad_retaliation_escalate_desc: "Cuando Seúl aceptó alojar el sistema antimisiles estadounidense THAAD en 2016, Pekín respondió con un boicot informal que golpeó a Lotte, al turismo coreano y a las exportaciones culturales. Endurecer la presión ahonda el castigo económico sobre Corea del Sur."
 CHI_three_gorges_dam_decision: "Completar la presa de las Tres Gargantas"
 CHI_three_gorges_dam_decision_desc: "Que atraviesa el Yangtsé en Yichang, la presa de las Tres Gargantas se convirtió en la central eléctrica más grande del mundo con su entrada plena en servicio en 2012, con una capacidad instalada de 22,5 gigavatios. Completarla aporta un vasto bloque de generación hidroeléctrica a la red nacional."
 CHI_three_north_shelterbelt: "Programa del Cinturón Forestal de las Tres Zonas del Norte"
 CHI_three_north_shelterbelt_desc: "Plantar el «Gran Muro Verde», un cinturón de bosque y pastizal que se extiende por el árido norte desde Xinjiang hasta el noreste. Lanzado en 1978 y con décadas de duración, el programa detiene la expansión del Gobi, fija el suelo contra las tormentas de polvo y recupera tierras de cultivo del desierto."
 CHI_tiangong_mission: "Ensamblar la estación Tiangong"
 CHI_tiangong_mission_desc: "El módulo central Tianhe debe alcanzar órbita y acoplarse con éxito a su primera visita tripulada antes de que sigan los laboratorios Wentian y Mengtian. Un puesto orbital permanente es la base de todo lo que va más allá de la órbita baja terrestre. Las probabilidades de éxito mejoran a medida que crece nuestra experiencia de lanzamiento."
 CHI_tour_group_freeze: "Congelar los grupos turísticos"
 CHI_tour_group_freeze_desc: "Suspender los grupos turísticos organizados hacia Corea del Sur. La congelación elimina una fuente importante de ingresos turísticos surcoreanos y señala nuestra disposición a usar herramientas económicas de forma coercitiva cuando nuestros intereses de seguridad lo exigen."
 CHI_track_ii_academic_forum: "Foro académico de Vía II"
 CHI_track_ii_academic_forum_desc: "Patrocinar un diálogo de Vía II entre nuestros académicos y sus homólogos surcoreanos sobre la estabilidad de la península. Los canales informales construyen confianza donde la diplomacia oficial se estanca."
 CHI_Track_II_Diplomacy: "Diplomacia de Vía II"
 CHI_Track_II_Diplomacy_desc: "Financiar intercambios informales académicos y de Think Tanks entre nuestros especialistas, sus homólogos estadounidenses y académicos coreanos. Cada ronda construye entendimiento mutuo y prepara el terreno para negociaciones formales."
 CHI_trilateral_trade_forum: "Foro comercial trilateral"
 CHI_trilateral_trade_forum_desc: "Convocar un foro comercial Pekín-Seúl-Pionyang centrado en el modelo de Kaesong. La interdependencia comercial crea su propia base de apoyo para la paz."
 CHI_uhv_east_transmission: "Red de muy alta tensión: Transmisión Oriental"
 CHI_uhv_east_transmission_desc: "Completar las líneas de muy alta tensión de largo recorrido que transportan electricidad miles de kilómetros desde las bases occidentales hasta los centros de consumo de Shanghái, Pekín y Cantón. La transmisión de larga distancia reduce las pérdidas en línea y alimenta el corazón industrial costero con energía occidental limpia."
 CHI_uhv_west_generation: "Red de muy alta tensión: Base de generación occidental"
 CHI_uhv_west_generation_desc: "Desarrollar las grandes bases de generación del oeste: los campos eólicos y solares de Xinjiang, las renovables de Mongolia Interior y la hidroelectricidad del alto Yangtsé. Estos centros energéticos remotos anclan la mayor red de transmisión de muy alta tensión del mundo."
 CHI_urban_water_recycling: "Reciclaje de aguas residuales urbanas"
 CHI_urban_water_recycling_desc: "Pekín, Tianjin y las principales ciudades de la provincia de Hebei descargan colectivamente miles de millones de metros cúbicos de aguas residuales municipales al año, la mayoría tratadas solo a nivel secundario antes de su vertido. Un programa de plantas avanzadas de tratamiento terciario y redes dedicadas de agua regenerada desvía el efluente tratado hacia refrigeración industrial, jardinería municipal y aumento de caudales fluviales. Tianjin ha alcanzado tasas de reutilización de agua regenerada superiores al 30 por ciento; el programa fija un objetivo nacional de 25 por ciento de reutilización urbana para 2030."
 CHI_us_korea_cost_signaling: "Señalización de costes EE. UU.-Corea"
 CHI_us_korea_cost_signaling_desc: "Señalar a Washington y Seúl que su alianza de seguridad conlleva costes económicos y diplomáticos crecientes. Medidas de presión dirigidas recuerdan a ambas partes que el statu quo no es gratuito."
 CHI_VEN_currency_swap_line: "Línea de swap yuan-bolívar"
 CHI_VEN_currency_swap_line_desc: "Establecer una línea de swap de divisas a largo plazo para proteger a Venezuela de la presión de la deuda denominada en dólares y asegurar el suministro de materias primas."
 CHI_VEN_emergency_food_aid: "Ayuda alimentaria de emergencia a Venezuela"
 CHI_VEN_emergency_food_aid_desc: "Enviar cargamentos de alimentos y ayuda humanitaria para estabilizar al gobierno de Maduro. Mejora la estabilidad venezolana y nuestra influencia."
 CHI_VEN_oil_processing_aid: "Ayuda al procesamiento petrolero venezolano"
 CHI_VEN_oil_processing_aid_desc: "Enviar ingenieros y capital de refinación para modernizar el procesamiento petrolero venezolano. El trabajo aumenta su rendimiento de extracción y ahonda nuestra participación en la cadena de suministro del Orinoco."
 CHI_VEN_petrocaribe_program: "Programa de apoyo a Venezuela"
 CHI_water_conservation_project: "Proyecto de conservación provincial"
 CHI_water_conservation_project_desc: "Se lanza un proyecto de conservación de agua específico en una de las secas provincias del norte, mejorando el revestimiento de canales, rehabilitando redes de monitoreo de aguas subterráneas y construyendo embalses locales para reducir el desperdicio y la sobreexplotación. Cada proyecto completado reduce la presión sobre el nivel freático provincial. La iniciativa puede repetirse en las provincias con estrés hídrico de Hebei, Shanxi, Henan y Shaanxi, y un número suficiente de proyectos completados aliviará la escasez nacional de agua de China."
 CHI_water_shortage_category: "Proyectos de conservación del agua"
 CHI_western_theatre_command: "Comando del Teatro del Oeste"
 CHI_western_theatre_command_desc: "El más extenso en superficie, el Comando del Teatro del Oeste, con sede en Chengdu, guarda la frontera del Himalaya con India y el interior inestable. Sus tropas se entrenan para la defensa en altitud y la guerra posicional atrincherada."
 CHI_yangtze_delta_integration_mission: "Integración del delta del Yangtsé"
 CHI_yangtze_delta_integration_mission_desc: "Con Shanghái, Jiangsu y Zhejiang comprometidos con un desarrollo coordinado, el delta del río Yangtsé está llamado a convertirse en el corredor industrial y exportador más productivo de China. Las provincias que eleven su producción fabril por encima del umbral objetivo dentro del año obtendrán un crecimiento duradero en productividad regional."
 give_up_membership_status_desc: "Abandonar la Organización de Cooperación de Shanghái pone fin a la participación en sus ejercicios conjuntos de seguridad, corredores económicos y marcos de consulta política. Los miembros con lecturas altas de agresividad china o en guerra activa contra otros miembros enfrentan una presión creciente para salir del bloque."
 give_up_observer_status_desc: "La retirada de la condición de observador corta los vínculos con los programas económicos y de seguridad de la Organización de Cooperación de Shanghái. La decisión suele deberse a cambios de alineamiento hacia la OTAN u Occidente, o al deterioro de las relaciones con Pekín."
 host_joint_exercises_desc: "China o Rusia pueden convocar un ejercicio militar conjunto pleno de la OCS, gastando cuarenta puntos de Mando para otorgar una idea temporal de preparación de combate a todos los estados miembros durante veintiún días. Un líder de ejército aleatorio gana un nivel de habilidad al concluir. El ejercicio no puede lanzarse mientras algún miembro esté en guerra."
 offer_joint_exercises_specific_desc: "Una propuesta de maniobra bilateral enviada a un miembro concreto de la OCS. Al ser aceptada, ambas partes gastan veinte puntos de Mando para realizar un ejercicio conjunto de catorce días que otorga la idea de maniobra conjunta de la OCS y concluye con un modificador de opinión de cooperación militar mutua."
 provide_development_assistance_desc: "Canalizar recursos hacia [FROM.GetName] para fortalecer su desarrollo y ahondar sus vínculos con el marco de la OCS."
 sco_bilateral_border_patrol: "Patrulla fronteriza conjunta con [FROM.GetName]"
 sco_bilateral_border_patrol_desc: "Coordinar operaciones de seguridad fronteriza con [FROM.GetName] para combatir el crimen transfronterizo y reforzar la confianza mutua."
 sco_bilateral_cultural_exchange: "Intercambio cultural con [FROM.GetName]"
 sco_bilateral_cultural_exchange_desc: "Lanzar un programa de intercambio cultural y académico con [FROM.GetName], fomentando los lazos entre pueblos y el entendimiento mutuo."
 sco_bilateral_energy_deal: "Asociación energética con [FROM.GetName]"
 sco_bilateral_energy_deal_desc: "Negociar un acuerdo de suministro energético a largo plazo con [FROM.GetName], estabilizando precios y asegurando flujos de recursos estratégicos."
 sco_bilateral_intel_sharing: "Compartir inteligencia con [FROM.GetName]"
 sco_bilateral_intel_sharing_desc: "Establecer un canal seguro de intercambio de inteligencia con [FROM.GetName] para coordinar operaciones antiterroristas y de seguridad."
 sco_bilateral_trade_agreement: "Acuerdo comercial bilateral con [FROM.GetName]"
 sco_bilateral_trade_agreement_desc: "Establecer un marco comercial formal con [FROM.GetName] bajo el paraguas de la OCS, reduciendo aranceles y fomentando la inversión conjunta."
 sco_megaproject_air_defense_optin: "Unirse a la Defensa Aérea Conjunta de la OCS"
 sco_megaproject_air_defense_optin_desc: "Adherirse a la red de Defensa Aérea Conjunta de la OCS, contribuyendo a la infraestructura compartida de radar y defensa antimisiles."
 sco_megaproject_air_defense_propose: "Proponer la Defensa Aérea Conjunta de la OCS"
 sco_megaproject_air_defense_propose_desc: "Proponer una red integrada de defensa aérea entre los estados miembros de la OCS, compartiendo cobertura radar y coordinando operaciones antiaéreas."
 sco_megaproject_dev_bank_optin: "Unirse al Banco de Desarrollo de la OCS"
 sco_megaproject_dev_bank_optin_desc: "Unirse al Banco de Desarrollo de la OCS como miembro contribuyente, obteniendo acceso a financiamiento de desarrollo con bajos intereses."
 sco_megaproject_dev_bank_propose: "Proponer el Banco de Desarrollo de la OCS"
 sco_megaproject_dev_bank_propose_desc: "Proponer el establecimiento de un banco de desarrollo multilateral para financiar infraestructura y desarrollo entre los estados miembros de la OCS."
 sco_megaproject_energy_grid_optin: "Unirse a la Red Energética de la OCS"
 sco_megaproject_energy_grid_optin_desc: "Adherirse al proyecto de Red Energética de la OCS, contribuyendo recursos a cambio de acceso a infraestructura eléctrica compartida."
 sco_megaproject_energy_grid_propose: "Proponer la Red Energética de la OCS"
 sco_megaproject_energy_grid_propose_desc: "Proponer la construcción de una red energética integrada que abarque los estados miembros de la OCS, reduciendo costes y mejorando la seguridad energética de todos los participantes."
 sco_megaproject_railway_optin: "Unirse al Ferrocarril Trans-Eurasiático"
 sco_megaproject_railway_optin_desc: "Adherirse al proyecto del Ferrocarril Trans-Eurasiático, invirtiendo en el corredor comercial por beneficios económicos a largo plazo."
 sco_megaproject_railway_propose: "Proponer el Ferrocarril Trans-Eurasiático"
 sco_megaproject_railway_propose_desc: "Proponer una red ferroviaria a escala continental que conecte las economías miembros de la OCS, mejorando drásticamente los flujos comerciales y la capacidad de construcción."
 start_joint_exercises_specific_desc: "Finaliza una maniobra bilateral de la OCS con un miembro que ha aceptado la oferta. Ambas naciones reciben la idea de maniobra conjunta de la OCS durante catorce días, y el ejercicio concluye con una ganancia mutua de opinión por cooperación militar."
 chi_bri.1.a: "Comenzar la obra"
 chi_bri.1.d: "En septiembre de 2013, el presidente Xi Jinping se presentó ante una audiencia en Astaná, Kazajistán, y esbozó una visión audaz: un Cinturón Económico de la Ruta de la Seda que uniera China con Europa, Asia Central y África. La iniciativa llegaría a conocerse como la Franja y la Ruta, el mayor programa de infraestructura de la historia."
 chi_bri.1.t: "Una Franja, Una Ruta"
 chi_bri.10.a: "Ofrecer términos concesionales"
 chi_bri.10.d: "Ha llegado una solicitud formal de [FROM.GetName]. Su delegación busca financiamiento y experiencia chinos para el §Y[FROM.GetBRIProjectName]§!. Pekín debe sopesar el valor estratégico de la asociación frente a los términos financieros y políticos que está dispuesta a ofrecer."
 chi_bri.10.d_opt: "Rechazar la solicitud"
 chi_bri.10.t: "[FROM.GetName] solicita un proyecto de la Franja y la Ruta"
 chi_bri.103.a: "Aceptar la invitación"
 chi_bri.103.b: "Rechazar la oferta"
 chi_bri.103.d: "Pekín ha extendido una invitación formal para convertirnos en miembro fundador del Banco Asiático de Inversión en Infraestructura. La membresía incluye pagos anuales de dividendos de proyectos de infraestructura en toda la red de la Franja y la Ruta, aunque ata nuestro destino financiero a las iniciativas lideradas por China. El ministerio de economía aguarda nuestra decisión."
 chi_bri.103.t: "China nos invita a unirnos al AIIB"
 chi_bri.104.a: "Dar la bienvenida al nuevo miembro"
 chi_bri.104.d: "[From.GetName] ha aceptado nuestra invitación para unirse al Banco Asiático de Inversión en Infraestructura como miembro fundador. Su participación fortalece la legitimidad del banco y amplía su alcance."
 chi_bri.104.t: "[From.GetName] se une al AIIB"
 chi_bri.105.a: "Tomar nota de su postura"
 chi_bri.105.d: "[From.GetName] ha rechazado nuestra invitación para unirse al Banco Asiático de Inversión en Infraestructura. Su negativa señala una preferencia clara por las instituciones financieras lideradas por Occidente y complica nuestras ambiciones regionales."
 chi_bri.105.t: "[From.GetName] rechaza la membresía del AIIB"
 chi_bri.13.a: "Conceder un año de gracia"
 chi_bri.13.b: "Rechazar la prórroga"
 chi_bri.13.d: "[FROM.GetName] ha pedido a Pekín una pausa de un año en los pagos de sus obligaciones pendientes con la Franja y la Ruta, alegando restricciones fiscales y circunstancias imprevistas. El capital seguiría siendo exigible tras el periodo de gracia."
 chi_bri.13.t: "Solicitud de prórroga del préstamo"
 chi_bri.131.a: "Conceder derechos de atraque a cambio de apoyo económico"
 chi_bri.131.b: "Rechazar la petición"
 chi_bri.131.d: "Pekín se ha acercado con una propuesta: conceder a la Armada del Ejército Popular de Liberación privilegios de atraque y reabastecimiento en nuestros puertos a cambio de asistencia económica sustancial. El paquete impulsaría nuestras exportaciones y producción industrial durante la próxima década, pero aceptarlo atraería el escrutinio australiano y estadounidense."
 chi_bri.131.t: "China solicita derechos de atraque"
 chi_bri.132.a: "Reevaluar nuestra postura en el Pacífico"
 chi_bri.132.d: "[From.GetName] ha revocado unilateralmente los privilegios de atraque concedidos previamente a la Armada del EPL. El enfriamiento de las relaciones y los incentivos occidentales competidores han erosionado el acuerdo que tanto nos costó asegurar."
 chi_bri.132.t: "Derechos de base revocados"
 chi_bri.133.a: "Aceptar el pacto intermediado"
 chi_bri.133.b: "Rechazar el acuerdo"
 chi_bri.133.d: "Pekín se propone como garante de un entendimiento de no agresión entre nosotros y nuestro rival regional. Si alguna de las partes rompe la paz, China se compromete a ponerse del lado de la parte agraviada. La oferta tiene peso dado el creciente influjo diplomático de Pekín."
 chi_bri.133.t: "China se ofrece a intermediar un pacto de no agresión"
 chi_bri.134.a: "Honrar el pacto y declarar la guerra"
 chi_bri.134.b: "Mantenerse neutral y aceptar el coste reputacional"
 chi_bri.134.d: "Ha estallado la guerra entre dos partes cuyo pacto de no agresión garantizamos personalmente. El honor y la credibilidad exigen que nos pronunciemos por la víctima, pero la guerra contra el agresor sería costosa. La inacción será recordada."
 chi_bri.134.t: "Nuestro pacto intermediado ha sido roto"
 chi_bri.135.a: "Coordinar con nuestros socios chinos"
 chi_bri.135.d: "Pekín nos ha notificado que, conforme al entendimiento de no agresión que intermedió, la República Popular entrará en la guerra de nuestro lado. El peso diplomático de la intervención china reconfigura el panorama estratégico."
 chi_bri.135.t: "China honrará el pacto"
 chi_bri.15.a: "Puerto de Gwadar (Baluchistán)"
 chi_bri.15.b: "Zona Económica Especial de Baluchistán"
 chi_bri.15.c: "Corredor ferroviario de Lahore (Panyab)"
 chi_bri.15.d: "Pekín ha aprobado un megaproyecto insignia para [FROM.GetName]. A diferencia de las obras ordinarias de la Franja y la Ruta, esta empresa será gestionada por China y portará directamente intereses estratégicos chinos. La elección del emplazamiento definirá el propósito del proyecto durante las próximas décadas."
 chi_bri.15.d_opt: "Puerto de Hambantota (Provincia del Sur)"
 chi_bri.15.e: "Port City de Colombo (Provincia Occidental)"
 chi_bri.15.f: "Terminal SGR Mombasa-Nairobi"
 chi_bri.15.g: "Instalación estratégica costera"
 chi_bri.15.t: "Megaproyecto: ¿dónde construirlo?"
 chi_bri.20.a: "Aceptar los términos del arrendamiento"
 chi_bri.20.b: "Negarse a entregar el puerto"
 chi_bri.20.d: "Incapaz de atender las deudas contraídas durante la construcción, el gobierno de Sri Lanka enfrenta una elección cruda. China Merchants Port Holdings ha propuesto un arrendamiento de 99 años del puerto de Hambantota a cambio de alivio de deuda. Los críticos lo llaman diplomacia de trampa de deuda; los defensores, estadística pragmática."
 chi_bri.20.t: "Hambantota: el arrendamiento de 99 años"
 chi_bri.21.a: "Conceder acceso naval a China"
 chi_bri.21.b: "Rechazar amablemente"
 chi_bri.21.d: "Con el Corredor Económico China-Pakistán plenamente operativo, la Armada del EPL ha planteado a Islamabad una petición discreta pero significativa: el derecho a usar Gwadar como punto logístico y de reabastecimiento. La decisión transformaría el CPEC de corredor económico en cabeza de playa estratégica."
 chi_bri.21.t: "Gwadar: una petición de instalaciones navales"
 chi_bri.22.a: "Conceder derechos de base a China"
 chi_bri.22.b: "Rechazar la propuesta"
 chi_bri.22.d: "Yibuti ha albergado instalaciones militares extranjeras durante décadas, pero la propuesta de Pekín es de otra naturaleza. La instalación prevista en Doraleh sería la primera base permanente en el extranjero del Ejército Popular de Liberación, un hito que los estrategas occidentales llevaban mucho tiempo temiendo y los planificadores chinos mucho tiempo persiguiendo."
 chi_bri.22.t: "Doraleh: la primera base de China en el extranjero"
 chi_bri.30.a: "Responder con fuerza mediante sanciones"
 chi_bri.30.b: "Monitorizar la situación por ahora"
 chi_bri.30.d: "El anuncio chino de futuros del petróleo denominados en yuanes ha enviado ondas de choque por Washington. Si los precios en petroyuan ganan tracción entre los miembros de la OPEP y los socios de la Franja y la Ruta, el estatus del dólar como moneda de reserva enfrentará su desafía más grave en generaciones. El Congreso exige una respuesta."
 chi_bri.30.t: "El petroyuan de Pekín amenaza la hegemonía del dólar"
 chi_bri.40.a: "Anunciar una iniciativa audaz y nueva"
 chi_bri.40.b: "Firmar una ola de nuevos compromisos"
 chi_bri.40.c: "Liderar con reforma y transparencia"
 chi_bri.40.d: "Jefes de gobierno y ministros de finanzas de toda Asia, África y Europa han convergido en Pekín para el Foro trienal de la Franja y la Ruta. La cita es parte cumbre, parte feria comercial y parte teatro geopolítico. Las decisiones de China esta semana marcarán el tono de la próxima fase de la iniciativa."
 chi_bri.40.t: "El Foro de la Franja y la Ruta abre en Pekín"
 chi_bri.42.a: "Adoptar un tono asertivo y soberano"
 chi_bri.42.b: "Enfatizar la cooperación y el beneficio mutuo"
 chi_bri.42.d: "Periodistas de todo el mundo se han reunido para la rueda de prensa de clausura del foro. El encuadre que China elija ahora dominará la cobertura internacional y fijará las expectativas de los próximos tres años de diplomacia de la Franja y la Ruta."
 chi_bri.42.t: "Rueda de prensa del foro"
 chi_bri.43.a: "Publicar los resultados"
 chi_bri.43.d: "Las delegaciones han partido y las pancartas se han retirado. Diplomáticos y economistas contabilizan los resultados: acuerdos firmados, promesas hechas, influencia acumulada. El Foro de la Franja y la Ruta ha vuelto a reconfigurar las percepciones del papel global de China."
 chi_bri.43.t: "Foro de la Franja y la Ruta: evaluación final"
 chi_bri.50.a: "Declarar una nueva era de liderazgo chino"
 chi_bri.50.d: "La red de la Franja y la Ruta de China abarca ya todos los continentes habitados. La red de infraestructura, deuda y obligación diplomática que Pekín ha tejido durante décadas ha cristalizado en algo sin precedentes: un orden internacional moldeado a imagen de los intereses chinos. Los historiadores debatirán si llamarlo hegemonía o asociación. El mundo simplemente lo llamará un hecho."
 chi_bri.50.t: "Pax Sinica establecida"
 chi_bri.70.a: "Anunciar la Era de la Asociación Afro-China"
 chi_bri.70.d: "El efecto acumulado de más de una década de cumbres del Foro de Cooperación China-África, proyectos de la Franja y la Ruta y diplomacia de alivio de deuda ha producido un cambio decisivo. En todo el continente, los gobiernos que antes dudaban entre Pekín y Washington se consolidan en torno a China como su socio principal. Una generación de líderes africanos ha crecido con infraestructura china, crédito chino y asesores chinos."
 chi_bri.70.t: "África abraza el siglo chino"
 chi_bri.71.a: "Desplegar equipos de proyecto"
 chi_bri.71.d: "Para cimentar la nueva era, Pekín ha destinado financiamiento para una ronda de megaproyectos insignia en su red de socios africanos. No serán subvenciones ordinarias de infraestructura; serán desarrollos anclados en China con derechos estratégicos a largo plazo y cláusulas de acceso preferente."
 chi_bri.71.t: "Proyectos insignia para África"
 chi_bri.80.a: "Anunciar una condonación de deuda"
 chi_bri.80.b: "Blindar cláusulas de garantía"
 chi_bri.80.d: "El Foro de Cooperación China-África ha celebrado su último plenario en Pekín. Ministros de finanzas, jefes de Estado y responsables de bancos de desarrollo se han reunido para examinar el estado de las relaciones sino-africanas y trazar el camino a seguir. El anuncio de apertura de la cumbre definirá si esta cita será recordada por su generosidad o por su palanca de influencia."
 chi_bri.80.t: "La cumbre del FOCAC comienza"
 chi_bri.81.a: "Endurecer las sanciones contra Caracas"
 chi_bri.81.b: "Emitir protestas diplomáticas"
 chi_bri.81.c: "Tomar nota y seguir adelante"
 chi_bri.81.d: "China ha formalizado un sucesor del esquema Petrocaribe, extendiendo términos de préstamos-por-petróleo a Venezuela y sus vecinos. Washington debe ahora elegir entre señalar su descontento y arriesgar una mayor alienación latinoamericana, o absorber el desarrollo en silencio."
 chi_bri.81.t: "China entra en Caracas"
 chi_bri.82.a: "Condonar la deuda"
 chi_bri.82.b: "Convertir los impagos en concesiones"
 chi_bri.82.c: "Dejar que el impago se mantenga"
 chi_bri.82.d: "Los ingresos petroleros de Venezuela se han desplomado y el servicio de la deuda con los bancos estatales chinos está fuertemente vencido. Pekín debe decidir si absorbe la pérdida en goodwill, extrae garantías, o deja que el impago se mantenga como advertencia a otros prestatarios."
 chi_bri.82.t: "Caracas no puede pagar"
 chi_bri.83.a: "Protestar y buscar su retirada"
 chi_bri.83.b: "Lanzar un programa contrapuesto"
 chi_bri.83.c: "Aceptar la nueva línea base"
 chi_bri.83.d: "China ha completado una red de estaciones terrestres de navegación y rastreo Beidou por Argentina y Bolivia, extendiendo bruscamente la cobertura de la constelación sobre el hemisferio sur. El Mando Espacial y el Mando Sur de EE. UU. han señalado las instalaciones como de doble uso. Washington debe decidir cómo responder."
 chi_bri.83.t: "Estaciones de rastreo Beidou en Patagonia"
 chi_bri.84.a: "Asegurar los cuatro cambios"
 chi_bri.84.b: "Blindar tres socios fiables"
 chi_bri.84.d: "La conclusión de la estrategia Doctrina Monroe Invertida ha creado las condiciones para una cascada de cambios de reconocimiento diplomático. Varios estados latinoamericanos restantes que aún reconocen formalmente a Taipéi están ahora al alcance de un cambio discreto facilitado por China."
 chi_bri.84.t: "Taiwán pierde sus últimos aliados"
 chi_bri.85.a: "Consolidar la realineación regional"
 chi_bri.85.b: "Embolsar el capital político"
 chi_bri.85.d: "Con la influencia china ya enraizada en las instituciones latinoamericanas, la Organización de Estados Americanos ha sido sistemáticamente vaciada como sede de la gobernanza regional liderada por EE. UU. La CELAC ha emergido como el foro multilateral preferido. Las repercusiones se sienten desde Washington hasta Buenos Aires."
 chi_bri.85.t: "La OEA pierde su mandato"
 chi_bri.86.a: "Coordinar un régimen de sanciones más estricto"
 chi_bri.86.b: "Manifestar preocupación por canales"
 chi_bri.86.d: "La ratificación china de una asociación integral de 25 años con Teherán ha enviado ondas de choque por la arquitectura de seguridad de Oriente Medio. Funcionarios estadounidenses, planificadores de defensa israelíes y estados del Golfo evalúan cada uno las consecuencias y consideran su respuesta."
 chi_bri.86.t: "Alarma en Washington, Tel Aviv y Riad"
 chi_bri.87.a: "Difundir el logro globalmente"
 chi_bri.87.b: "Consolidar internamente"
 chi_bri.87.d: "El Comunicado de Pekín que formaliza la reconciliación saudí-iraní ha sido recibido por la comunidad internacional. El papel de China como mediadora entre dos adversarios históricos representa una demostración significativa de alcance diplomático que pocos predecían hace una década."
 chi_bri.87.t: "Pekín se atribuye el mérito"
 chi_bri.88.a: "Anunciar el nuevo marco de liquidación"
 chi_bri.88.d: "Los estados del Golfo han comenzado a liquidar parte de sus transacciones petroleras en renminbi, completando la arquitectura financiera que China ha ensamblado durante la década anterior. La erosión de la hegemonía del dólar en los mercados energéticos es gradual, pero ya está estructuralmente enraizada."
 chi_bri.88.t: "El petrodólar se agrieta"
 chi_bri.89.a: "Asegurar los cambios clave"
 chi_bri.89.b: "Empujar para el barrido completo"
 chi_bri.89.d: "La estrategia de China en el Foro de las Islas del Pacífico ha madurado hasta el punto en que los cambios de reconocimiento diplomático son alcanzables. Las Islas Salomón y Kiribati son los objetivos más accesibles, con Tuvalu y Palaos al alcance si Pekín está dispuesta a invertir más."
 chi_bri.89.t: "Giro en los reconocimientos de las islas del Pacífico"
 chi_bri.90.a: "Condenar el pacto y coordinar una respuesta"
 chi_bri.90.b: "Manifestar preocupación y monitorizar"
 chi_bri.90.d: "El Pacto de Seguridad de Honiara ha desencadenado una sesión de emergencia de las Consultas Ministeriales Australia-Estados Unidos. Canberra, Washington y Wellington coordinan una respuesta a lo que describen como una amenaza directa a la soberanía del Pacífico y a la estabilidad regional."
 chi_bri.90.t: "Canberra exige explicaciones"
 chi_bri.91.a: "Declarar un papel de liderazgo en seguridad del Pacífico"
 chi_bri.91.b: "Reconocer el revés diplomático"
 chi_bri.91.d: "Los resultados de la Iniciativa de los Ocho Países del Pacífico ya están. El historial de compromiso de China con los estados insulares del Pacífico determinará si Pekín puede reivindicar un papel de liderazgo en seguridad o debe absorber un revés reputacional."
 chi_bri.91.t: "El informe de la Iniciativa de los Ocho Países"
 chi_bri.92.a: "Acelerar la respuesta aliada"
 chi_bri.92.b: "Considerar opciones escalatorias"
 chi_bri.92.c: "Recalibrar y observar"
 chi_bri.92.d: "La adquisición china de acceso a bases en las Islas Salomón ha extendido el alcance de la Armada del EPL hasta el borde de la segunda cadena insular. El Mando Indo-Pacífico de EE. UU. y la Fuerza de Defensa australiana evalúan las implicaciones estratégicas y determinan su respuesta."
 chi_bri.92.t: "Pekín alcanza la Segunda Cadena Insular"
 chi_bri.93.a: "Expresar una firme desaprobación"
 chi_bri.93.b: "Reconocer el desarrollo"
 chi_bri.93.d: "Italia se ha convertido en el primer estado del G7 en firmar un memorando de entendimiento de la Franja y la Ruta, creando un precedente que los socios restantes del G7 contemplan con distintos grados de alarma y oportunidad. Cada capital debe ahora determinar su propia postura hacia la inversión china en infraestructura."
 chi_bri.93.t: "Roma firma con Pekín"
 chi_bri.94.a: "Endurecer el núcleo de socios"
 chi_bri.94.b: "Sostener el marco con inversión"
 chi_bri.94.d: "La retirada de Lituania del mecanismo 17+1 ha expuesto una falla entre los miembros bálticos y nórdicos por un lado y el núcleo Balcanes-Visegrad por otro. China debe elegir entre consolidar una coalición menor y más fiable o gastar para mantener unido el marco más amplio."
 chi_bri.94.t: "El 17+1 llega a una bifurcación"
 chi_bri.96.a: "El siglo de China comienza."
 chi_bri.96.b: "Reconocer la nueva realidad."
 chi_bri.96.c: "Tomar nota del orden emergente."
 chi_bri.96.d: "El orden mundial consensual que China ha construido mediante la Iniciativa de Desarrollo Global, el Banco Asiático de Inversión en Infraestructura y la cooperación de alta calidad en la Franja y la Ruta ya no es una visión: es la arquitectura operativa del sistema internacional. La membresía BRICS+ cubre la mayoría de la población mundial. El discurso de Davos de 2017 se lee hoy como profecía."
 chi_bri.96.t: "Una comunidad de futuro compartido"
 CHI_foreign.012.a: "Observaremos con atención."
 CHI_foreign.012.d: "Funcionarios chinos han sugerido discretamente que Washington reconsidere su enfoque de la cuestión coreana, implicando que una iniciativa diplomática podría estar en camino. La señal puede ser una apertura o un farol."
 CHI_foreign.012.t: "Una señal desde Pekín"
 CHI_foreign.014.a: "Examinar el borrador."
 CHI_foreign.014.d: "Las bases para una declaración conjunta sobre el futuro de la Península Coreana están listas. Pekín ha presentado un borrador de marco para su revisión."
 CHI_foreign.014.t: "Marco de declaración conjunta"
 CHI_foreign.024.a: "Sopesamos nuestras opciones con cuidado."
 CHI_foreign.024.d: "China ha señalado su aceptación de un acuerdo centrado en Seúl de la cuestión coreana, un cambio histórico en la posición de Pekín con el que Pionyang debe ahora lidiar."
 CHI_foreign.024.t: "Pekín respalda a Seúl"
 CHI_foreign.030.a: "Esto representa una politización inaceptable de las relaciones comerciales."
 CHI_foreign.030.b: "La presión es lamentable pero sostenible. Nos mantenemos firmes."
 CHI_foreign.030.d: "La respuesta de Pekín al despliegue surcoreano del THAAD ha escalado de protesta diplomática a coerción económica. Las autoridades chinas dirigen restricciones sobre operaciones empresariales coreanas, productos de entretenimiento y turismo, una campaña calibrada para imponer costes sin activar un régimen formal de sanciones."
 CHI_foreign.030.t: "La represalia por el THAAD"
 CHI_foreign.031.a: "Reconocer la señal. Mantener la postura actual."
 CHI_foreign.031.b: "Las garantías chinas no son creíbles. Reforzar nuestro compromiso con Corea."
 CHI_foreign.031.d: "China ha señalado por canales militar-militares que los ejercicios del río Yalú son de orientación defensiva. El mensaje de Pekín es claro: China gestionará el comportamiento de Corea del Norte y no requiere escalada estadounidense para mantener la estabilidad regional."
 CHI_foreign.031.t: "Pekín señala contención"
 CHI_foreign.032.a: "Alertar a nuestra guarnición en Corea. Solicitar consultas urgentes con Seúl."
 CHI_foreign.032.b: "Monitorizar la situación. Evitar respuestas provocadoras."
 CHI_foreign.032.d: "Las imágenes satelitales confirman una reorganización significativa de las fuerzas terrestres norcoreanas hacia disposiciones ofensivas a lo largo del paralelo 38. Los convoyes logísticos chinos apoyan el reposicionamiento. El Ejército Popular de Corea parece prepararse para algo más que ejercicios rutinarios."
 CHI_foreign.032.t: "Acumulación en el Yalú"
 CHI_foreign.033.a: "Iniciar la planificación de contingencias. Consultar con Washington."
 CHI_foreign.033.b: "Las restricciones constitucionales son absolutas. Proceder solo por canales diplomáticos."
 CHI_foreign.033.d: "La acumulación de fuerzas norcoreanas a lo largo del paralelo 38 ha reavivado el debate en la Dieta japonesa sobre el Artículo 9 y los límites constitucionales de la postura de autodefensa de Japón. Los halcones de defensa presionan por una reinterpretación de emergencia de los compromisos de defensa colectiva."
 CHI_foreign.033.t: "El Artículo 9 en debate"
 CHI_foreign.034.a: "Activar nuestros compromisos de defensa mutua con Corea del Sur."
 CHI_foreign.034.b: "Convocar una sesión de emergencia del Consejo de Seguridad."
 CHI_foreign.034.d: "Las fuerzas norcoreanas, con apoyo logístico y material chino, han cruzado la zona desmilitarizada. China no ha entrado formalmente en el conflicto, pero sus huellas dactilares están en cada aspecto de la máquina de guerra norcoreana."
 CHI_foreign.034.t: "Guerra en la península"
 CHI_foreign.035.a: "Pasamos a alerta máxima. Preparar fuerzas de contingencia."
 CHI_foreign.035.b: "No hacer movimientos hasta que la situación se aclare."
 CHI_foreign.035.d: "Informes sin confirmar de disparos y movimiento militar dentro del perímetro de seguridad de Pionyang sugieren que algo extraordinario ocurre en la capital norcoreana. Los medios estatales chinos guardan silencio. La situación es peligrosamente confusa."
 CHI_foreign.035.t: "Caos en Pionyang"
 CHI_foreign.036.a: "Emitir una declaración formal condenando la injerencia en la soberanía norcoreana."
 CHI_foreign.036.b: "Abrir contacto por canal trasero con el consejo de transición."
 CHI_foreign.036.d: "Oficiales respaldados por China han dado un golpe contra Kim Jong-un. La familia Kim ha sido apartada del poder. Un consejo de transición se está formando en Pionyang bajo figuras conocidas como interlocutores de Pekín. China parece estar apadrinando una sucesión gestionada."
 CHI_foreign.036.t: "El golpe de Pionyang"
 CHI_foreign.037.a: "Expresar preocupación a Pekín por canales diplomáticos."
 CHI_foreign.037.b: "Esperar y observar. La situación es demasiado fluida para declaraciones contundentes."
 CHI_foreign.037.d: "El golpe en Corea del Norte trae tanto oportunidad como peligro para Japón. Un gobierno de transición alineado con China en Pionyang puede ser más predecible que Kim Jong-un, pero un estado cliente chino en la península coreana representa un desafío estratégico significativo para Tokio."
 CHI_foreign.037.t: "Un nuevo Pionyang"
 CHI_foreign.038.a: "Protestar formalmente por la reestructuración unilateral de la gobernanza norcoreana."
 CHI_foreign.038.b: "Aceptar la nueva realidad. Buscar un acomodo con la política coreana de Pekín."
 CHI_foreign.038.d: "China ha anunciado los términos del acuerdo político posgolpe en Pionyang. El nuevo gobierno norcoreano está reestructurado constitucionalmente, integrado económicamente en las cadenas de suministro chinas y subordinado estratégicamente a la política coreana de Pekín."
 CHI_foreign.038.t: "El acuerdo de Pekín"
 CHI_foreign.040.a: "Esta realineación es inaceptable. Señalar consecuencias a Seúl."
 CHI_foreign.040.b: "Aceptar la deriva. La alianza no puede mantenerse por coacción."
 CHI_foreign.040.d: "La adopción por parte de Corea del Sur de una doctrina de autonomía estratégica y su decisión de tratar a China como socio de seguridad principal representan una realineación profunda del equilibrio indo-pacífico. La alianza EE. UU.-Corea, sostenida desde 1953, enfrenta su mayor tensión en décadas."
 CHI_foreign.040.t: "Seúl se desvía"
 CHI_foreign.041.a: "Expresar interés cauto ante la nueva configuración."
 CHI_foreign.041.b: "Rechazar el encuadre. China no está abandonando a Corea del Norte."
 CHI_foreign.041.d: "El giro de Corea del Sur hacia Pekín ha forzado a Pionyang a un cálculo incómodo. Una asociación China-Seúl que excluye a Corea del Norte es estratégicamente más amenazante que la presencia estadounidense en el sur."
 CHI_foreign.041.t: "¿Cuál China?"
 CHI_foreign.042.a: "Iniciar consultas urgentes con Washington sobre medidas compensatorias."
 CHI_foreign.042.b: "Evaluar si son alcanzables acuerdos bilaterales de seguridad Japón-Corea."
 CHI_foreign.042.d: "La retirada de Corea del Sur del marco de seguridad trilateral EE. UU.-Japón-Corea deja a Japón aislado dentro de lo que queda de la arquitectura indo-pacífica. Sin la participación de Seúl, las relaciones de seguridad de Japón con Washington carecen de un pilar crítico."
 CHI_foreign.042.t: "Tokio solo"
 CHI_foreign.043.a: "Tranquilizar a nuestros socios filipinos sobre nuestro compromiso."
 CHI_foreign.043.b: "Iniciar una revisión estratégica de los compromisos en el Indo-Pacífico."
 CHI_foreign.043.d: "La retirada de Corea del Sur del marco de seguridad trilateral ha desencadenado ansiedad en Manila sobre la durabilidad de los compromisos de seguridad estadounidenses en todo el Indo-Pacífico. Funcionarios filipinos han comenzado una reevaluación discreta de su propia postura de alianza."
 CHI_foreign.043.t: "El marco se deshilacha"
 CHI_foreign.044.a: "Aceptar el revés estratégico. Recalibrar en torno a los socios restantes."
 CHI_foreign.044.d: "La salida de Corea del Sur del marco trilateral desmantela efectivamente la arquitectura indo-pacífica que Washington pasó una década construyendo. China ha logrado mediante diplomacia paciente lo que jamás podría lograr mediante confrontación."
 CHI_foreign.044.t: "La estrategia indo-pacífica se colapsa"
 CHI_foreign.045.a: "Aceptar la petición. Iniciar un redespliegue ordenado."
 CHI_foreign.045.b: "Negarse. Las fuerzas estadounidenses permanecen en la península a discreción de Washington."
 CHI_foreign.045.d: "El respaldo formal de Corea del Sur a las garantías de seguridad chinas ha hecho políticamente insostenible la presencia continuada de fuerzas terrestres estadounidenses en la península. Seúl ha solicitado un calendario para el redespliegue militar estadounidense desde territorio coreano."
 CHI_foreign.045.t: "Las tropas vuelven a casa"
 CHI_foreign.046.a: "Iniciar consultas de emergencia con Washington sobre la postura de seguridad de Japón."
 CHI_foreign.046.b: "Acelerar el desarrollo de capacidad de defensa autóctona."
 CHI_foreign.046.d: "El redespliegue estadounidense desde Corea deja a la alianza EE. UU.-Japón estratégicamente incompleta. El flanco meridional de Japón queda expuesto, y los supuestos que sustentan la planificación de defensa japonesa durante las últimas siete décadas requieren una revisión fundamental."
 CHI_foreign.046.t: "La alianza hueca"
 CHI_foreign.047.a: "Aceptar la garantía. El futuro de Corea no puede depender de protectores lejanos."
 CHI_foreign.047.b: "Rechazar la oferta. La soberanía coreana no puede negociarse por patronazgo chino."
 CHI_foreign.047.d: "China ha ofrecido a Corea del Sur una garantía de seguridad formal que respalda cualquier acuerdo futuro de unificación. La Garantía de Pekín compromete a China a defender la soberanía de una Corea unificada, a cambio de acuerdos estratégicos que transforman efectivamente a Corea en un estado alineado con China."
 CHI_foreign.047.t: "La Garantía de Pekín"
 CHI_foreign.048.a: "Aceptar el marco de Pekín. La supervivencia exige realismo."
 CHI_foreign.048.b: "Rechazar el marco. No seremos absorbidos."
 CHI_foreign.048.d: "La oferta china de una garantía de seguridad para una Corea unificada ha forzado un momento de claridad en Pionyang. La dirección norcoreana debe elegir entre resistencia y acomodo, sabiendo que la resistencia sin respaldo chino es insostenible."
 CHI_foreign.048.t: "La garantía y el Norte"
 CHI_foreign.049.a: "Emitir una declaración formal sobre el proceso y sus implicaciones."
 CHI_foreign.049.b: "Reconocer el resultado. Adaptar en consecuencia nuestra estrategia indo-pacífica."
 CHI_foreign.049.d: "El proceso de unificación coreana avanza bajo auspicios chinos y en términos chinos. Los setenta años de presencia militar e inversión diplomática estadounidense en la seguridad de Corea han producido una Corea unificada alineada con Pekín."
 CHI_foreign.049.t: "Una unificación que no hicimos"
 CHI_foreign.050.a: "Anotado."
 CHI_foreign.050.d: "Grupos de combate de portaaviones estadounidenses se han reposicionado hacia el estrecho de Corea en respuesta al aumento de tensiones. Pekín monitoriza el movimiento."
 CHI_foreign.050.t: "Portaaviones se desplazan hacia el estrecho de Corea"
 CHI_foreign.051.a: "Una situación difícil."
 CHI_foreign.051.d: "Las tensiones en la Península Coreana han alcanzado un umbral crítico. Washington, Tokio y Seúl han entrado en posturas de preparación elevadas."
 CHI_foreign.051.t: "Alerta de crisis regional"
 CHI_foreign.052.a: "Retirarse. El precio es demasiado alto."
 CHI_foreign.052.b: "Mantener la presión."
 CHI_foreign.052.d: "Las tensiones en la Península Coreana han alcanzado su apogeo. Pekín debe decidir si da un paso atrás, mantiene el rumbo o apuesta por un resultado decisivo."
 CHI_foreign.052.t: "La península al borde"
 CHI_foreign.053.a: "Un acontecimiento bienvenido."
 CHI_foreign.053.d: "El ambiente de crisis en la península de Corea se ha disipado. Las potencias regionales acogen con satisfacción el retorno a la estabilidad."
 CHI_foreign.053.t: "Distensión en la península de Corea"
 CHI_foreign.054.a: "La adquisición sirve a nuestros intereses económicos."
 CHI_foreign.054.b: "El petróleo de Kazajistán debe permanecer bajo control nacional."
 CHI_foreign.054.d: "La Corporación Nacional de Petróleo de China (CNPC) ha presentado una oferta formal para adquirir PetroKazakhstan por 4.180 millones de dólares. El acuerdo transferiría el control operativo del mayor productor de petróleo independiente de Kazajistán a manos chinas a cambio de un pago sustancial en efectivo a las arcas del Estado."
 CHI_foreign.054.t: "Propuesta de adquisición de la CNPC"
 CHI_foreign.056.a: "Respetamos su decisión."
 CHI_foreign.056.d: "Astaná ha rechazado la oferta de la CNPC por PetroKazakhstan, citando preocupaciones sobre la soberanía de los recursos nacionales."
 CHI_foreign.056.t: "Kazajistán rechaza la oferta de adquisición de la CNPC"
 CHI_foreign.057.a: "La adquisición beneficia al interés económico de Angola."
 CHI_foreign.057.b: "Nuestros recursos energéticos no están a la venta."
 CHI_foreign.057.d: "Sinopec ha presentado una oferta de 7.200 millones de dólares para adquirir Addax Petroleum, obteniendo acceso a licencias de producción de petróleo en Angola, Nigeria y la región del Kurdistán. El acuerdo representaría la mayor adquisición de Sinopec en el extranjero hasta la fecha."
 CHI_foreign.057.t: "Propuesta de adquisición de Sinopec"
 CHI_foreign.058.a: "Sinopec asegura otro punto de apoyo en la producción de petróleo africano."
 CHI_foreign.058.d: "Luanda ha aceptado la oferta de Sinopec por Addax Petroleum. Los ingenieros chinos asumirán el control operativo de los bloques petrolíferos marinos, y una parte de las ganancias se destinará a la infraestructura angoleña."
 CHI_foreign.058.t: "Angola aprueba la adquisición de Sinopec"
 CHI_foreign.059.a: "Respetamos su decisión."
 CHI_foreign.059.d: "Luanda ha rechazado la oferta de Sinopec para adquirir Addax Petroleum."
 CHI_foreign.059.t: "Angola rechaza la oferta de adquisición de Sinopec"
 CHI_foreign.060.a: "La experiencia y el capital chinos son bienvenidos."
 CHI_foreign.060.b: "La riqueza petrolera de Venezuela no está sujeta a concesiones extranjeras."
 CHI_foreign.060.d: "La CNOOC ha propuesto una empresa conjunta a largo plazo para desarrollar la Faja Petrolífera del Orinoco junto a Petróleos de Venezuela. China aportaría capital inicial y experiencia técnica en la extracción de crudo pesado a cambio de una participación en los derechos de producción."
 CHI_foreign.060.t: "Propuesta de empresa conjunta de la CNOOC"
 CHI_foreign.061.a: "La CNOOC se asegura un punto de apoyo en las mayores reservas de petróleo del hemisferio occidental."
 CHI_foreign.061.d: "Caracas ha aceptado la propuesta de empresa conjunta de la CNOOC para la Faja del Orinoco. Los derechos de producción a lo largo de los bloques Junín ahora se comparten, llevando la tecnología de extracción china a las reservas de petróleo probadas más grandes del mundo."
 CHI_foreign.061.t: "Venezuela aprueba la empresa conjunta de la CNOOC"
 CHI_foreign.062.a: "Respetamos su decisión."
 CHI_foreign.062.d: "Caracas ha rechazado la propuesta de empresa conjunta de la CNOOC para la Faja del Orinoco."
 CHI_foreign.062.t: "Venezuela rechaza la empresa conjunta de la CNOOC"
 CHI_foreign.063.a: "Una adquisición estratégica para nuestra seguridad energética."
 CHI_foreign.063.d: "Astaná ha aceptado la oferta de la CNPC por PetroKazakhstan. Los campos petroleros operados por China expandirán la producción de los yacimientos de Kumkol y North Buzachi, asegurando un suministro constante de crudo kazajo para las refinerías chinas."
 CHI_foreign.063.t: "Kazajistán aprueba la adquisición de la CNPC"
 CHI_foreign.100.a: "Prepárense para una presión sostenida. Consulten con nuestros aliados."
 CHI_foreign.100.d: "China ha lanzado una campaña de presión coordinada contra Corea del Sur, aplicando señales diplomáticas, económicas y militares diseñadas para desviar el cálculo de seguridad de Seúl lejos de Washington."
 CHI_foreign.100.t: "Campaña de presión de Pekín"
 CHI_foreign.101.a: "Documenten las medidas y preparen una respuesta proporcionada."
 CHI_foreign.101.d: "Pekín ha extendido sus represalias por el THAAD hacia un régimen más amplio de restricciones económicas informales. Las empresas coreanas que operan en China informan de una obstrucción sistemática en los canales de licencias, aduanas y regulación."
 CHI_foreign.101.t: "Sanciones informales impuestas"
 CHI_foreign.102.a: "Actuar con cautela. Mantener el canal abierto."
 CHI_foreign.102.d: "Diplomáticos chinos y estadounidenses han establecido un canal de trabajo discreto sobre los asuntos de la península de Corea. El acuerdo permite a ambas partes gestionar los riesgos de escalada sin comprometerse públicamente con un marco de negociación formal."
 CHI_foreign.102.t: "Se abre un canal secreto"
 CHI_foreign.103.a: "Comprometerse con el nuevo marco. Supervisar sus implicaciones."
 CHI_foreign.103.d: "Pekín y Seúl han acordado un reinicio diplomático estructurado, restableciendo los contactos de alto nivel y abriendo un marco trilateral para los debates sobre la península. Este acuerdo representa un alejamiento significativo de la alineación anterior de Corea del Sur con Washington."
 CHI_foreign.103.t: "El reinicio de 2022"
 CHI_foreign.104.a: "Aceptar el marco. Definir nuestro papel dentro de él."
 CHI_foreign.104.d: "China y los Estados Unidos han acordado las líneas generales de una arquitectura de seguridad posterior al armisticio para la península de Corea. El marco del G2 asigna a ambas potencias la corresponsabilidad de la estabilidad en la península, marginando a los demás actores."
 CHI_foreign.104.t: "Una arquitectura postarmisticio"
 CHI_foreign.105.a: "Estudiar la propuesta. Consultar con asesores de la industria y seguridad."
 CHI_foreign.105.d: "China ha propuesto una plataforma de integración económica que vincula a la industria surcoreana con un proceso de reunificación gestionado. El acuerdo crea profundos incentivos estructurales para que Seúl alinee su política de unificación con el resultado preferido por Pekín."
 CHI_foreign.105.t: "Marco económico para la unidad"
 CHI_foreign.106.a: "Reconocer la nueva doctrina. Preparar nuestra respuesta estratégica."
 CHI_foreign.106.d: "La adopción formal por parte de Corea del Sur de una doctrina de autonomía estratégica señala un giro decisivo para alejarse del marco de la alianza entre EE. UU. y Corea. Seúl se está posicionando entre Washington y Pekín en lugar de dentro de la órbita de seguridad estadounidense."
 CHI_foreign.106.t: "El giro invertido"
 CHI_foreign.107.a: "Enviar el ultimátum a Pionyang."
 CHI_foreign.107.b: "Rechazar. La reunificación debe ser únicamente bajo nuestros términos."
 CHI_foreign.107.d: "[CHI.GetLeader] y [USA.GetLeader] han llegado a un acuerdo poco común. Exigirán conjuntamente que [NKO.GetName] acepte una reunificación pacífica bajo el control de Seúl. La alternativa es la guerra. [KOR.GetName] debe decidir si envía el ultimátum a Pionyang."
 CHI_foreign.107.t: "Un ultimátum conjunto para el Norte"
 CHI_foreign.108.a: "Aceptar. El juego ha terminado."
 CHI_foreign.108.b: "Rechazar. No entregaremos nuestra soberanía."
 CHI_foreign.108.d: "Un comunicado conjunto sino-estadounidense ha llegado a Pionyang. Exige la disolución inmediata y pacífica del Estado de [NKO.GetName] y la reunificación de la península bajo el gobierno de Seúl. El rechazo significa la guerra simultánea con China, los Estados Unidos y Corea del Sur."
 CHI_foreign.108.t: "Pekín y Washington exigen la unificación"
 CHI_foreign.109.a: "Amanece una nueva era en Asia Oriental."
 CHI_foreign.109.d: "Corea del Norte ha aceptado el ultimátum. El régimen de Kim ha acordado disolver el Estado y transferir la autoridad a Seúl. La península de Corea se unifica sin disparar un solo tiro, un triunfo diplomático a escala histórica."
 CHI_foreign.109.t: "Pionyang acepta"
 CHI_foreign.110.a: "Entonces vamos a la guerra."
 CHI_foreign.110.d: "Corea del Norte ha rechazado el ultimátum. La respuesta de Pionyang fue entregada mediante fuego de artillería a través de la Zona Desmilitarizada (DMZ). No queda ninguna vía diplomática: solo la guerra y la liberación de la península por la fuerza."
 CHI_foreign.110.t: "Pionyang se niega"
 CHI_foreign.200.a: "Forzar la situación."
 CHI_foreign.200.b: "Sondear y retirarse."
 CHI_foreign.200.c: "Exigir la mediación de la ONU."
 CHI_foreign.200.d: "Nuestros buques de la guardia costera y la JMSDF de Japón están separados por menos de dos millas náuticas en el mar de China Oriental. El siguiente movimiento es nuestro. Cada opción conlleva consecuencias."
 CHI_foreign.200.t: "Las flotas están en la línea"
 CHI_foreign.201.a: "Mantenerse firme. Ordenar a la JMSDF que mantenga la línea."
 CHI_foreign.201.b: "Solicitar la intervención de EE. UU. de inmediato."
 CHI_foreign.201.c: "Retroceder y buscar una solución diplomática."
 CHI_foreign.201.d: "Los buques chinos mantienen su posición en la frontera en disputa. Tokio debe decidir hasta qué punto presionar para hacerlos retroceder."
 CHI_foreign.201.t: "China presiona la línea de las Senkaku"
 CHI_foreign.202.a: "Honrar la garantía. Señalar apoyo militar a Japón."
 CHI_foreign.202.b: "Protegerse. Expresar preocupación sin comprometer fuerzas."
 CHI_foreign.202.d: "Japón ha invocado sus obligaciones de alianza. Los buques chinos están presionando la frontera de las Senkaku y Tokio pide a Washington que respalde sus compromisos. La decisión conlleva costes de cualquier manera."
 CHI_foreign.202.t: "¿Honrarás la garantía?"
 CHI_foreign.203.a: "Tomar nota."
 CHI_foreign.203.b: "Un enfrentamiento a las puertas de nuestra casa. Vigilarlo de cerca."
 CHI_foreign.203.c: "Una disputa lejana. Tomar nota y seguir adelante."
 CHI_foreign.203.d: "Buques chinos y japoneses se han enfrentado cerca de las islas Senkaku. El incidente ha atraído la atención internacional y ha despertado el temor a una escalada más amplia en la región."
 CHI_foreign.203.t: "Confrontación en el mar de China Oriental"
 CHI_foreign.204.a: "Rechazar la declaración. Mantener nuestro control administrativo."
 CHI_foreign.204.b: "Emitir una protesta formal y consultar a Washington."
 CHI_foreign.204.d: "China ha emitir una declaración de soberanía formal sobre las islas Diaoyu y ha anunciado un régimen continuo de patrullas de la guardia costera. Se espera que Tokio responda."
 CHI_foreign.204.t: "Pekín reclama las islas Diaoyu"
 CHI_foreign.206.a: "Enviar el comunicado a Tokio."
 CHI_foreign.206.d: "La cumbre ha concluido con la firma total del comunicado conjunto por parte de Japón. Ya constan en el registro oficial unas declaraciones que vinculan a ambas partes a mantener unas relaciones sino-japonesas estables y a una resolución tácita de los agravios históricos."
 CHI_foreign.206.t: "El comunicado está firmado"
 CHI_foreign.208.a: "Tomar nota."
 CHI_foreign.208.b: "Un cambio en el equilibrio regional. Hacer balance."
 CHI_foreign.208.c: "Reconocer el acontecimiento."
 CHI_foreign.208.d: "China y Japón han emitido un comunicado conjunto que formaliza un entendimiento estratégico. El texto compromete a ambas partes a mantener relaciones estables y a un acuerdo tácito sobre los agravios históricos. Los analistas están divididos sobre quién ganó más, si Pekín o Tokio."
 CHI_foreign.208.t: "Firmado el comunicado sino-japonés"
 CHI_foreign.211.a: "Cancelar discretamente las visitas"
 CHI_foreign.211.b: "La visita de Estado sigue adelante"
 CHI_foreign.211.d: "La llamada a consultas del embajador de Pekín y la congelación diplomática han convertido la próxima ronda de visitas al santuario Yasukuni en una prueba fundamental. ¿Desactivará la disputa el gabinete japonés o se endurecerá el orgullo nacional?"
 CHI_foreign.211.t: "La elección de Tokio sobre las visitas a Yasukuni"
 CHI_foreign.212.a: "Escalar la respuesta de la guardia costera"
 CHI_foreign.212.b: "Abrir un canal secreto para rebajar la tensión"
 CHI_foreign.212.d: "Un enfrentamiento entre la milicia marítima china y las patrulleras de la Guardia Costera de Japón ha escalado cerca de las islas Diaoyu. El gabinete debe responder antes de que las imágenes lleguen al telediario de la noche."
 CHI_foreign.212.t: "Incidente por el estancamiento en las Senkaku"
 CHI_foreign.216.a: "Hacer despegar los cazas en alerta y mantener la línea de la ADIZ"
 CHI_foreign.216.b: "Derivar el incidente a un canal secreto y discreto"
 CHI_foreign.216.d: "Las aeronaves chinas entran ahora a diario en la zona de identificación de defensa aérea (ADIZ) del mar de China Oriental, y una casi colisión entre un caza del EPL y un reactor de la JASDF mantiene a Tokio en vilo. La Guardia Costera por sí sola ya no puede gestionar la presión alrededor de las Senkaku."
 CHI_foreign.216.t: "Confrontación en la ADIZ de las Senkaku"
 CHI_foreign.217.a: "Desplegar un grupo de tareas de la Armada del EPL y mantenerse firmes"
 CHI_foreign.217.b: "Retirarse antes de que empiecen los disparos"
 CHI_foreign.217.d: "Un grupo de tareas naval chino está siguiendo de cerca a los buques japoneses a la vista de las islas en disputa, y ambas armadas están en zafarrancho de combate. Una sola maniobra errónea podría provocar los primeros disparos de una guerra sino-japonesa. Tokio espera a ver si Pekín mantendrá la línea o dará un paso atrás."
 CHI_foreign.217.t: "Estancamiento en las Senkaku al borde del abismo"
 CHI_foreign.213.a: "Ceder ante el grupo de presión y poner fin al boicot"
 CHI_foreign.213.b: "Capear el temporal"
 CHI_foreign.213.d: "Los exportadores japoneses y el Keidanren están perdiendo la paciencia. El boicot en China está dejando a las marcas japonesas fuera de uno de sus mayores mercados. Tokio tiene que decidir: ceder ante Pekín o capear el temporal."
 CHI_foreign.213.t: "El boicot pasa factura"
 CHI_foreign.215.a: "Hacer cumplir el tratado de seguridad"
 CHI_foreign.215.b: "Negociar un armisticio a través de canales secretos"
 CHI_foreign.215.d: "Pekín ha forzado la situación en las Senkaku. El tratado de seguridad mutua obliga a Washington a considerar una intervención. El presidente puede hacer cumplir el tratado abiertamente o presionar para lograr un armisticio por canales secretos."
 CHI_foreign.215.t: "La decisión de Washington sobre las Senkaku"
 CHI_foreign.220.a: "Apreciar el acercamiento"
 CHI_foreign.220.b: "Escepticismo cortés"
 CHI_foreign.220.d: "Pekín ha mostrado apertura siguiendo el modelo de la Doctrina Fukuda original de 1977. Tokio puede apreciar el acercamiento o responder con un escepticismo cortés."
 CHI_foreign.220.t: "Una Doctrina Fukuda para el nuevo siglo"
 CHI_foreign.221.a: "Organizar una visita de Estado completa"
 CHI_foreign.221.b: "Recepción de bajo perfil"
 CHI_foreign.221.d: "China ha ofrecido pandas gigantes como regalo de visita de Estado para el zoológico de Ueno. El gabinete debe decidir si organiza una visita de Estado completa o mantiene las cosas bajo un perfil bajo."
 CHI_foreign.221.t: "Un panda para Tokio"
 CHI_foreign.222.a: "Firmar el pacto"
 CHI_foreign.222.b: "Esperar a tener más pruebas"
 CHI_foreign.222.d: "Pekín ha presentado una declaración bilateral que renuncia formalmente al enfoque de enemigos históricos. Tokio puede firmar y corresponder, o esperar a tener más pruebas de las verdaderas intenciones chinas."
 CHI_foreign.222.t: "Pacto de reducción mutua de amenazas"
 CHI_foreign.223.a: "Presionar a Japón para que vuelva a comprometerse"
 CHI_foreign.223.b: "Degradar el Quad a un mero diálogo"
 CHI_foreign.223.d: "La estrategia diplomática de Pekín está empezando a alejar a Tokio del Diálogo de Seguridad Cuadrilateral (Quad). Washington puede presionar a Japón para que vuelva a comprometerse o aceptar discretamente la degradación."
 CHI_foreign.223.t: "La respuesta del Quad"
 CHI_foreign.224.a: "Firmar el comunicado completo"
 CHI_foreign.224.b: "Firmar con reservas"
 CHI_foreign.224.c: "Abandonar las negociaciones"
 CHI_foreign.224.d: "Años de paciente diplomacia han dado como resultado un borrador de comunicado. Firmar el texto completo reconfigura la postura estratégica de Japón; firmar con reservas preserva las relaciones bilaterales sin romper con Washington; abandonar las negociaciones destruye todo el proceso por completo."
 CHI_foreign.224.t: "El comunicado de Tokio"
 CHI_foreign.226.a: "Tomar nota de las reservas y seguir adelante."
 CHI_foreign.226.d: "Tokio ha firmado una versión más limitada del comunicado. El PLD introdujo reservas específicas en lugar de aceptar el texto completo, preservando cierto grado de alineación con Washington. La relación bilateral avanza, aunque se mantiene la ambigüedad estratégica."
 CHI_foreign.226.t: "Un acuerdo parcial con Japón"
 CHI_foreign.227.a: "Evaluar los daños."
 CHI_foreign.227.d: "Años de trabajo diplomático previo se han venido abajo. El PLD rechazó el texto final del comunicado, acusando a Pekín de extralimitarse en su mandato y de subordinar la soberanía japonesa. Todo el marco de negociación ha colapsado."
 CHI_foreign.227.t: "Japón abandona las conversaciones"
 CHI_foreign.231.a: "Tomar nota de la oportunidad comercial."
 CHI_foreign.231.d: "Pekín ha autorizado a Mitsubishi Aerospace a establecer instalaciones de investigación y producción bajo licencia en el continente. La industria japonesa obtiene ingresos por exportaciones y acceso al mercado; los ingenieros aeroespaciales chinos ganan proximidad al diseño avanzado de estructuras aéreas."
 CHI_foreign.231.t: "Mitsubishi Aerospace abre en China"
 CHI_foreign.232.a: "Tomar nota de la oportunidad comercial."
 CHI_foreign.232.d: "La división aeroespacial de Kawasaki ha cerrado un acuerdo marco con Pekín que cubre la producción de componentes para grandes estructuras aéreas. El acuerdo abre una cuota de mercado sustancial en China al tiempo que otorga a Tokio influencia sobre los ciclos de adquisición aeroespacial chinos."
 CHI_foreign.232.t: "Kawasaki Aerospace entra en China"
 CHI_foreign.233.a: "Tomar nota de la oportunidad comercial."
 CHI_foreign.233.d: "Japan Steel Works ha recibido la aprobación para operar una forja en régimen de empresa conjunta en China. Los beneficios de la exportación de grandes piezas de acero forjado otorgan a Tokio una influencia continua sobre la capacidad industrial pesada de China."
 CHI_foreign.233.t: "Japan Steel Works llega a China"
 CHI_foreign.234.a: "Tomar nota de la oportunidad comercial."
 CHI_foreign.234.d: "La rama de sistemas terrestres de Mitsubishi Heavy Industries ha acordado un acuerdo de transferencia de licencias tecnológicas con un socio estatal chino. Japón obtiene rendimientos comerciales; Pekín logra acceso a metodologías de diseño de vehículos blindados."
 CHI_foreign.234.t: "MHI Land Systems invitada a China"
 CHI_foreign.235.a: "Tomar nota de la opportunity comercial."
 CHI_foreign.235.d: "Komatsu Defense ha establecido un acuerdo de cooperación en producción en China enfocado en vehículos blindados ligeros. El acuerdo genera ingresos estables por exportación para Tokio y profundiza los lazos bilaterales en la industria de la defensa."
 CHI_foreign.235.t: "Komatsu Defense se traslada a China"
 CHI_foreign.236.a: "Tomar nota de la oportunidad comercial."
 CHI_foreign.236.d: "La división aeroespacial de Subaru Corporation ha concluido un acuerdo de fabricación conjunta con una contraparte china. La experiencia en estructuras de alas rotatorias fluye hacia el programa chino mientras Subaru asegura pedidos de componentes a largo plazo."
 CHI_foreign.236.t: "Firmada la asociación aeroespacial con Subaru"
 CHI_foreign.237.a: "Tomar nota de la oportunidad comercial."
 CHI_foreign.237.d: "Howa Machinery ha otorgado licencias de sus procesos de mecanizado de precisión a una instalación socia en China. El acuerdo genera ingresos por exportaciones al tiempo que extiende los estándares de fabricación de armas ligeras de Japón a la cadena de suministro de defensa de China."
 CHI_foreign.237.t: "Howa Machinery activa en China"
 CHI_foreign.238.a: "Tomar nota de la oportunidad comercial."
 CHI_foreign.238.d: "NEC Corporation ha abierto un centro de integración electrónica en régimen de empresa conjunta en China. Los beneficios comerciales son sustanciales; la mayor recompensa para Tokio es mantener una influencia sostenida sobre los estándares de adquisición C4ISR de China."
 CHI_foreign.238.t: "NEC establece operaciones en China"
 CHI_foreign.239.a: "Tomar nota de la oportunidad comercial."
 CHI_foreign.239.d: "Toshiba Defense Systems ha acordado suministrar componentes de radar y sensores a integradores chinos bajo un marco de licencias regulado. Japón conserva la propiedad del diseño al tiempo que obtiene ingresos estables por derechos de transferencia tecnológica."
 CHI_foreign.239.t: "Toshiba Defense Systems en China"
 CHI_foreign.240.a: "Tomar nota de la oportunidad comercial."
 CHI_foreign.240.d: "La rama de construcción naval de Mitsubishi ha cerrado un acuerdo de cooperación en construcción naval con un astillero estatal chino. Los ingresos por exportaciones y la influencia a largo plazo sobre los estándares de diseño de buques de combate de superficie chinos son los principales beneficios para Tokio."
 CHI_foreign.240.t: "Mitsubishi Shipbuilding firma con Pekín"
 CHI_foreign.241.a: "Tomar nota de la oportunidad comercial."
 CHI_foreign.241.d: "La división de astilleros de Kawasaki Heavy Industries ha acordado compartir técnicas de fabricación de cascos de submarinos con un socio chino. Japón obtiene acceso al mercado; Pekín logra exposición a los métodos de reducción de firma acústica."
 CHI_foreign.241.t: "El astillero Kawasaki es bienvenido en China"
 CHI_foreign.242.a: "Tomar nota de la oportunidad comercial."
 CHI_foreign.242.d: "IHI ha obtenido la aprobación para la producción de componentes de motores aeronáuticos en China bajo un marco de fabricación con licencia. Tokio obtiene un flujo de ingresos duradero y un punto de apoyo en las adquisiciones de la aviación militar china."
 CHI_foreign.242.t: "IHI Corporation entra en el mercado chino"
 CHI_foreign.243.a: "Tomar nota de la oportunidad comercial."
 CHI_foreign.243.d: "Japan Marine United ha concluido un acuerdo de cooperación en arquitectura naval con un constructor naval chino. El acuerdo genera ingresos por exportaciones y establece un papel japonés duradero en el desarrollo de programas de buques de combate de superficie chinos."
 CHI_foreign.243.t: "Firmada la asociación con Japan Marine United"
 CHI_foreign.244.a: "Tomar nota de la oportunidad comercial."
 CHI_foreign.244.d: "Toyota Motor Corporation ha acordado expandir su presencia logística y de fabricación en China bajo el nuevo marco de asociación. Las exportaciones de sistemas de producción refuerzan la influencia blanda japonesa sobre la modernización industrial china."
 CHI_foreign.244.t: "Toyota establece fabricación en China"
 CHI_foreign.245.a: "Tomar nota de la oportunidad comercial."
 CHI_foreign.245.d: "Honda Motor Company ha asegurado un acuerdo ampliado de licencias de trenes motrices y fabricación en China. Un flujo constante de ingresos por regalías llega a Tokio mientras los estándares de producción de Honda se consolidan en las prácticas de las fábricas chinas."
 CHI_foreign.245.t: "Honda se une a la asociación"
 CHI_foreign.246.a: "Tomar nota de la oportunidad comercial."
 CHI_foreign.246.d: "Nippon Steel ha acordado suministrar placas de acero de alta dureza y aleaciones especiales a socios chinos mediante un acuerdo de empresa conjunta. El trato genera ingresos por exportaciones de alto valor y vincula la producción china de acero para blindajes a las cadenas de suministro japonesas."
 CHI_foreign.246.t: "Nippon Steel se une a las operaciones en China"
 CHI_foreign.247.a: "Tomar nota de la oportunidad comercial."
 CHI_foreign.247.d: "Hitachi ha establecido operaciones de electrónica industrial y computación embebida en China bajo el marco de asociación. Los ingresos por exportación son inmediatos; a más largo plazo, Tokio gana una influencia continua sobre la modernización de la infraestructura china."
 CHI_foreign.247.t: "Hitachi se expande hacia China"
 CHI_foreign.248.a: "Tomar nota de la oportunidad comercial."
 CHI_foreign.248.d: "Panasonic ha concluido acuerdos para suministrar tecnología de baterías y electrónica robustecida a socios chinos. El acuerdo genera ingresos por exportaciones fiables al tiempo que integra los estándares de componentes japoneses en las líneas de producción chinas vinculadas al sector militar."
 CHI_foreign.248.t: "Panasonic entra en la asociación china"
 CHI_foreign.249.a: "Tomar nota de la oportunidad comercial."
 CHI_foreign.249.d: "JR East ha acordado compartir ingeniería de material rodante y señalización ferroviaria de alta velocidad con socios chinos. Los rendimientos comerciales son claros; el valor estratégico para Tokio radica en la influencia a largo plazo sobre la infraestructura de transporte china."
 CHI_foreign.249.t: "JR East aporta experiencia ferroviaria a China"
 CHI_foreign.250.a: "Capear la presión."
 CHI_foreign.250.d: "Los medios estatales chinos han lanzado una campaña coordinada sobre la conducta de Japón durante la guerra, destacando las visitas oficiales al Santuario Yasukuni, las revisiones de los libros de texto escolares y la Masacre de Nankín. Las manifestaciones antijaponesas se están extendiendo por las ciudades chinas y Tokio se enfrenta a una creciente presión para responder."
 CHI_foreign.250.t: "Pekín reabre la cuestión histórica"
 CHI_foreign.55.a: "Impulsar un marco liderado por Pekín."
 CHI_foreign.55.b: "Actuar como un mediador equilibrado."
 CHI_foreign.55.c: "Deferir a la iniciativa de Seúl."
 CHI_foreign.55.d: "China ha mediado en una cumbre diplomática de emergencia en Pekín, rescatando las conversaciones sobre la península de Corea que estaban al borde del abismo. Ambas partes llegan bajo presión, y la postura que adopte China moldeará la interpretación del evento en todas las capitales."
 CHI_foreign.55.t: "Se convoca la cumbre de Pekín"
 CHI_foreign.66.a: "Prepararse para las consecuencias."
 CHI_foreign.66.d: "La operación ha salido catastróficamente mal. Las fuerzas especiales chinas han sido capturadas o ejecutadas, y Pionyang ha anunciado pruebas de la implicación de Pekín. La región contiene el aliento."
 CHI_foreign.66.t: "La Operación Nuevo Amanecer, al descubierto"
 CHI_foreign.67.a: "Retirarse discretamente."
 CHI_foreign.67.d: "La operación no logró sus objetivos, pero los servicios de seguridad de Pionyang han atribuido el incidente a disidentes internos. El papel de Pekín sigue sin confirmarse, por ahora."
 CHI_foreign.67.t: "Asalto fallido, camuflado como levantamiento interno"
 CHI_foreign.68.a: "Observar cómo se desarrollan los acontecimientos."
 CHI_foreign.68.d: "La operación ha desencadenado combates abiertos en la capital. Unidades leales del EPC y facciones disidentes se disputan el control de Pionyang mientras el mundo exterior observa expectante."
 CHI_foreign.68.t: "Pionyang en llamas"
 CHI_foreign.69.a: "Consolidar las ganancias."
 CHI_foreign.69.d: "La operación ha sido un éxito. Un liderazgo pro-Pekín ha consolidado el control sobre Corea del Norte. El equilibrio de poder en la península ha cambiado."
 CHI_foreign.69.t: "Un nuevo amanecer en Pionyang"
 CHI_military_event.1.a: "Vender al valor total de mercado"
 CHI_military_event.1.b: "Recompensar a los oficiales que cumplan"
 CHI_military_event.1.d: "Para diciembre de 1998, la orden de desinversión de Jiang Zemin había puesto a miles de empresas gestionadas por el EPL bajo valoración y transferencia civil. Ramas inmobiliarias, conglomerados comerciales y plantas farmacéuticas fueron tasadas y cedidas, despojando a los militares de un imperio construido a lo largo de décadas. Los términos del traspaso aún se están negociando."
 CHI_military_event.1.t: "El traspaso de Vanke"
 CHI_military_event.10.a: "Entregar el expediente a los inspectores de disciplina"
 CHI_military_event.10.b: "Sepultar la investigación"
 CHI_military_event.10.d: "Investigadores de la Comisión Central de Inspección Disciplinaria han registrado la casa de un teniente general enriquecido gracias a las empresas del ejército. Al igual que con Gu Junshan en 2012, se llevan cajas de dinero en efectivo, cajas de Maotai y un busto de oro de Mao. Las redes que se encuentran por encima de él observan para ver si Pekín se atreve a tirar del hilo o si el expediente desaparece como tantos otros antes."
 CHI_military_event.10.t: "Descubierta la fortuna de un general"
 CHI_military_event.2.a: "Explotar el sector comercial"
 CHI_military_event.2.b: "Dirigirlo desde la cúspide"
 CHI_military_event.2.d: "Elevada a la categoría de estrategia nacional en 2017, la Fusión Militar-Civil derriba el muro que separa las bases industriales civil y de defensa de China. Universidades, empresas estatales y firmas tecnológicas privadas reciben la orden de compartir investigación, capacidad de fabricación y cadenas de suministro con el EPL, reorientando toda la economía hacia la producción de doble uso bajo la supervisión de la Comisión Militar Central."
 CHI_military_event.2.t: "Declarada la fusión militar-civil"
 CHI_military_event.4.a: "Competir en el mercado de armas"
 CHI_military_event.4.b: "Comprar acceso político en el extranjero"
 CHI_military_event.4.d: "Poly Technologies, la filial de exportación de armas del Estado Mayor del EPL, canaliza fusiles, misiles antibuque y sistemas balísticos de corto alcance hacia África, Oriente Medio y América Latina. Poly Culture, su fachada civil, blanquea las ganancias a través de casas de subastas de Hong Kong y bienes raíces en el extranjero. Los ingresos regresan a los militares mediante empresas fantasma que nunca aparecen en ningún presupuesto oficial."
 CHI_military_event.4.t: "Poly Technologies se globaliza"
 CHI_military_event.5.a: "Entregar a unos pocos chivos expiatorios"
 CHI_military_event.5.b: "Cerrar filas y desafiar a los auditores"
 CHI_military_event.5.d: "La campaña anticorrupción lanzada por Xi Jinping en 2012 ha llegado al Departamento de Logística General. Xu Caihou y Guo Boxiong, los dos antiguos vicepresidentes de la CMC que dirigían el sistema de ascensos a cambio de dinero en todo el cuerpo de oficiales, se enfrentan a un procesamiento. El clan debe decidir si entrega chivos expiatorios para ganar tiempo o si cierra filas y desafía a Pekín a ir más allá."
 CHI_military_event.5.t: "La rendición de cuentas"
 CHI_military_event.6.a: "Prometer lealtad al Sueño Chino"
 CHI_military_event.6.b: "Mantener los privilegios silenciosos"
 CHI_military_event.6.d: "Con Xu Caihou muerto de cáncer antes del juicio y Guo Boxiong despojado de su rango, la red superviviente acepta los nuevos términos. Clamorosas declaraciones de lealtad al Sueño Chino de Xi, un puñado de oficiales de rango medio entregados para aparentar y un acuerdo tácito: el saqueo descarado termina, pero las redes que controlan los contratos de logística, las licitaciones de construcción y la adquisición de armas sobreviven de forma más discreta."
 CHI_military_event.6.t: "Inclinarse ante el Sueño Chino"
 CHI_political_events.1.a: "Coordinar una respuesta nacional."
 CHI_political_events.1.d: "Un nuevo coronavirus se ha propagado desde la provincia de Guangdong a Hong Kong, Vietnam, Canadá y Singapur. La OMS ha emitir una alerta sanitaria mundial. Los hospitales de Guangzhou y Pekín están colapsados y el miedo entre la población se propaga más rápido que la propia enfermedad."
 CHI_political_events.1.t: "Epidemia de SARS"
 CHI_political_events.2.a: "Desplegar todos los recursos disponibles."
 CHI_political_events.2.d: "Un terremoto de magnitud 7,9 ha sacudido la provincia de Sichuan, con el epicentro cerca del condado de Wenchuan. Más de 69.000 personas han muerto y 18.000 siguen desaparecidas. Ciudades enteras han quedado destruidas por el temblor inicial y los corrimientos de tierra secundarios."
 CHI_political_events.2.t: "Terremoto de Wenchuan"
 CHI_political_events.3.a: "Que empiecen los Juegos."
 CHI_political_events.3.d: "Los Juegos Olímpicos de Pekín 2008 se inaugurán hoy. Tras años de preparación y un esfuerzo de construcción sin precedentes, China da la bienvenida a los atletas del mundo en el Estadio Nacional. La ceremonia de apertura atrae a una audiencia global de cientos de millones de personas, mostrando el ascenso de China en la escena mundial."
 CHI_political_events.3.t: "Los Juegos de la XXIX Olimpiada"
 CHI_political_events.4.a: "Acelerar el desarrollo tecnológico"
 CHI_political_events.4.b: "Fortalecer la cohesión social"
 CHI_political_events.4.c: "Desarrollar el poder militar"
 CHI_political_events.4.d: "Concluido el 19.º Congreso del Partido, este establece sus prioridades para los dos hitos del centenario: una sociedad moderadamente próspera para 2021 y una nación socialista plenamente desarrollada para 2049. Los recursos del Estado deben ser canalizados. ¿Dónde concentrará el Partido sus energías?"
 CHI_political_events.4.t: "Los dos objetivos del centenario"
 CHI_political_events.5.a: "Promover a un candidato Tuanpai"
 CHI_political_events.5.b: "Promover a un candidato Princeling"
 CHI_political_events.5.c: "Dejar la decisión en manos de Xi"
 CHI_political_events.5.d: "La cuestión de la sucesión ya no es meramente académica. Xi Jinping ha consolidado el poder, pero el Partido requiere continuidad institucional. El Comité Permanente del Politburó espera indicaciones. Una elección ahora marcará el rumbo de la próxima generación del liderazgo chino."
 CHI_political_events.5.t: "Designar a un sucesor"
 CHI_political_events.50.a: "Comenzar a planificar para una China envejecida."
 CHI_political_events.50.d: "La población en edad de trabajar de China, que alcanzó un máximo de unos 940 millones de personas, ha comenzado su larga contracción. El excedente de mano de obra que impulsó tres décadas de crecimiento de dos dígitos ya no crece. Los economistas señalan que el cambio es estructural, no cíclico: sin una intervención política, las fábricas y las obras en construcción competirán por un grupo cada vez menor de trabajadores durante el resto del siglo."
 CHI_political_events.50.t: "El dividendo demográfico se desvanece"
 CHI_political_events.51.a: "Enfrentarse a la rendición de cuentas."
 CHI_political_events.51.d: "El Sexto Censo Nacional de Población de 2010 confirma lo que los demógrafos venían advirtiendo desde hace tiempo: la proporción de la población de 60 años o más ha subido al 13,3 por ciento, y la edad media sigue aumentando. La estructura familiar 4-2-1, en la que un solo hijo carga con la responsabilidad de mantener a dos padres y cuatro abuelos, es ya la norma estadística en la China urbana. El descenso de la población ya no es una proyección lejana."
 CHI_political_events.51.t: "El censo revela un envejecimiento acelerado"
 CHI_political_events.52.a: "Una base de referencia más dura pero más honesta."
 CHI_political_events.52.d: "Tras años de tensiones económicas y ajustes políticos, China ha alcanzado un nuevo equilibrio demográfico. La fuerza laboral es más reducida y envejecida, las pensiones son más costosas y la fertilidad se mantiene por debajo del nivel de reemplazo, pero el impacto agudo de la transición ha pasado. El país que emerge de esta década está disciplinado por la necesidad: finanzas públicas más austeras, mayor automatización y un Estado del bienestar calibrado para una sociedad que envejeció antes de enriquecerse."
 CHI_political_events.52.t: "La crisis de la sociedad gris amaina"
 CHI_political_events.6.a: "Honrar a nuestro héroe nacional"
 CHI_political_events.6.b: "Buscar un acuerdo diplomático"
 CHI_political_events.6.d: "El 1 de abril de 2001, un avión de inteligencia de señales EP-3 de la Marina de los EE. UU. chocó con un interceptor J-8 de la Fuerza Aérea del EPL cerca de la isla de Hainan. La tripulación estadounidense ha realizado un aterrizaje de emergencia en suelo chino. Pekín debe decidir cómo gestionar el enfrentamiento."
 CHI_political_events.6.t: "El incidente de la isla de Hainan"
 CHI_political_events.7.a: "El sector estaba subdesarrollado; las medidas contundentes golpean con dureza."
 CHI_political_events.7.b: "El sector absorbe las medidas contundentes con perturbaciones pero sin llegar a colapsar."
 CHI_political_events.7.c: "La escala del sector amortigua el impacto."
 CHI_political_events.7.d: "El discurso de Jack Ma en la Cumbre del Bund, en el que comparó a los bancos estatales con casas de empeño, ofrece a los reguladores la oportunidad que tanto esperaban. La CSRC y la SAMR suspenden la salida a bolsa de Ant Group días antes de su lanzamiento. Los investigadores antimonopolio abren expedientes contra Alibaba. La Administración del Ciberespacio lanza una revisión de seguridad nacional sobre Didi tras su cotización en Nueva York. El sector de las plataformas tecnológicas se enfrenta a una reestructuración fundamental de su relación con el Estado."
 CHI_political_events.7.e: "El sector es lo suficientemente maduro como para transformar la regulación en estabilidad estructural."
 CHI_political_events.7.t: "Medidas contundentes contra las grandes tecnológicas"
 CHI_political_events.8.a: "Continuar financiando el sector de la informática"
 CHI_political_events.8.d: "Siguiendo la directriz estratégica de revitalizar la nación a través de la ciencia y la tecnología, las instituciones respaldadas por el Estado están acelerando las inversiones en la informática de próxima generación y en la infraestructura de internet. Desde los laboratorios universitarios hasta las zonas económicas especiales, se están sentando los cimientos digitales de China para las próximas décadas."
 CHI_political_events.8.t: "Impulsar la innovación a través de la ciencia y la tecnología"
 CHI_sco.1.a: "Damos la bienvenida a su interés."
 CHI_sco.1.b: "No podemos conceder este estatus."
 CHI_sco.1.d: "[FROM.GetNameWithFlag] ha presentado una solicitud oficial para obtener el estatus de observador en la Organización de Cooperación de Shanghái. Debemos decidir si aprobamos su petición."
 CHI_sco.1.t: "Solicitud de observador de la OCS"
 CHI_sco.10.a: "Apoyamos a China."
 CHI_sco.10.b: "No estaremos vinculados por las ambiciones de China."
 CHI_sco.10.c: "Permanecer neutrales."
 CHI_sco.10.d: "China ha exigido que declaremos nuestra lealtad exclusiva a su facción dentro de la OCS, forzando una elección entre Pekín y Moscú."
 CHI_sco.10.t: "China exige tu lealtad"
 CHI_sco.11.a: "Estamos agradecidos por el apoyo."
 CHI_sco.11.d: "[FROM.GetNameWithFlag] está proporcionando asistencia para el desarrollo con el fin de apoyar nuestra modernización económica en el marco de las estructuras de cooperación de la OCS."
 CHI_sco.11.t: "Asistencia para el desarrollo de la OCS"
 CHI_sco.2.a: "Han demostrado ser dignos de la membresía plena."
 CHI_sco.2.b: "No podemos respaldar esta solicitud."
 CHI_sco.2.d: "[FROM.GetNameWithFlag] ha presentado una solicitud oficial para obtener la membresía plena en la Organización de Cooperación de Shanghái."
 CHI_sco.2.t: "Solicitud de membresía de la OCS"
 CHI_sco.20.a: "Invertir capital político para restaurar la confianza."
 CHI_sco.20.b: "Tenemos preocupaciones más urgentes."
 CHI_sco.20.d: "La cohesión interna dentro de la Organización de Cooperación de Shanghái ha caído a niveles preocupantes. Varios Estados miembros han expresado dudas sobre el rumbo de la organización y, sin una intervención, la cooperación podría deteriorarse aún más."
 CHI_sco.20.t: "Los miembros cuestionan el rumbo de la OCS"
 CHI_sco.21.a: "Este es nuestro momento."
 CHI_sco.21.d: "La Organización de Cooperación de Shanghái está prosperando. Los Estados miembros informan de niveles de cooperación sin precedentes, los proyectos conjuntos están dando resultados y la posición internacional de la organización nunca ha sido tan sólida."
 CHI_sco.21.t: "Una edad de oro de la cooperación"
 CHI_sco.22.a: "Aprovechar nuestra ventaja."
 CHI_sco.22.b: "Deberíamos calmar las tensiones."
 CHI_sco.22.d: "Nuestro creciente dominio dentro de la Organización de Cooperación de Shanghái no ha pasado desapercibido. El papel disminuido de Rusia es una fuente de fricción cada vez mayor, y Moscú ha comenzado a manifestar su descontento a través de los canales diplomáticos."
 CHI_sco.22.t: "Rusia, relegada en la OCS"
 CHI_sco.23.a: "Debemos reafirmarnos."
 CHI_sco.23.b: "Quizás esto sea lo mejor."
 CHI_sco.23.d: "La influencia de Rusia dentro de la OCS ha crecido hasta el punto de que nuestra propia posición de liderazgo está siendo cuestionada. Moscú marca cada vez más la agenda y, si no actuamos, corremos el riesgo de quedar relegados a un papel secundario en nuestra propia organización."
 CHI_sco.23.t: "China pierde la iniciativa"
 CHI_sco.3.a: "Nuestras tropas agradecerán la oportunidad de entrenar junto a sus fuerzas."
 CHI_sco.3.b: "La cooperación con [FROM.GetName] no es viable en este momento."
 CHI_sco.3.d: "[FROM.GetNameWithFlag] ha propuesto realizar ejercicios militares conjuntos bajo el marco de la OCS. Esto fortalecería la cooperación en materia de seguridad entre nuestras fuerzas armadas."
 CHI_sco.3.t: "Invitación a ejercicios militares conjuntos"
 CHI_sco.30.a: "Aprobar el proyecto."
 CHI_sco.30.b: "Este no es el momento adecuado."
 CHI_sco.30.d: "[FROM.GetNameWithFlag] ha propuesto la construcción de una red energética integrada que abarque a toda la OCS. Como miembro destacado, debemos decidir si aprobamos este ambicioso proyecto de infraestructura."
 CHI_sco.30.t: "Propuesta de red energética de la OCS"
 CHI_sco.31.a: "Aprobar el proyecto."
 CHI_sco.31.b: "No podemos comprometernos con esto."
 CHI_sco.31.d: "[FROM.GetNameWithFlag] ha propuesto una red ferroviaria que cruce todo el continente para conectar las economías de la OCS. Esto requeriría una inversión significativa, pero podría transformar el comercio en toda la organización."
 CHI_sco.31.t: "Propuesta de ferrocarril transeurasiático"
 CHI_sco.32.a: "Aprobar la creación del banco."
 CHI_sco.32.b: "Las condiciones no son favorables."
 CHI_sco.32.d: "[FROM.GetNameWithFlag] ha propuesto establecer un banco multilateral de desarrollo bajo el marco de la OCS. Esta institución financiaría la infraestructura y el desarrollo en todos los Estados miembros."
 CHI_sco.32.t: "Propuesta de Banco de Desarrollo de la OCS"
 CHI_sco.33.a: "Aprobar la red."
 CHI_sco.33.b: "Tenemos reservas sobre esto."
 CHI_sco.33.d: "[FROM.GetNameWithFlag] ha propuesto una red de defensa aérea integrada que abarque a los Estados miembros de la OCS. Una cobertura de radar compartida y una defensa de misiles coordinada fortalecerían la seguridad colectiva."
 CHI_sco.33.t: "Propuesta de defensa aérea conjunta de la OCS"
 CHI_sco.34.a: "Nos enorgullece ser un miembro fundador."
 CHI_sco.34.d: "Pekín ha formalizado la tan debatida transformación de los Cinco de Shanghái en un organismo intergubernamental de pleno derecho. La propuesta de la Organización de Cooperación de Shanghái profundizaría nuestros lazos políticos, económicos y de seguridad con China y nuestros vecinos regionales, con nosotros como miembro fundador desde el primer día."
 CHI_sco.34.t: "China propone la Organización de Cooperación de Shanghái"
 CHI_sco.4.a: "Que comiencen los ejercicios."
 CHI_sco.4.d: "[FROM.GetNameWithFlag] ha aceptado nuestra invitación para realizar ejercicios militares conjuntos."
 CHI_sco.4.t: "Ejercicios conjuntos aceptados"
 CHI_sco.5.a: "Ellos se lo pierden."
 CHI_sco.5.d: "[FROM.GetNameWithFlag] ha rechazado nuestra invitación para realizar ejercicios militares conjuntos."
 CHI_sco.5.t: "Ejercicios conjuntos rechazados"
 CHI_sco.6.a: "Estas maniobras se parecen sospechosamente a los preparativos para una guerra."
 CHI_sco.6.b: "Solo los terroristas y los extremistas tienen algo que temer de estos ejercicios."
 CHI_sco.6.c: "Un acontecimiento interesante que conviene vigilar."
 CHI_sco.6.d: "La Organización de Cooperación de Shanghái ha lanzado un ejercicio militar a gran escala en el que participan las fuerzas armadas de sus Estados miembros."
 CHI_sco.6.t: "La OCS lanza ejercicios militares a gran escala"
 CHI_sco.7.a: "La esfera de influencia china continúa expandiéndose."
 CHI_sco.7.b: "Un buen día para la diplomacia multilateral."
 CHI_sco.7.d: "[FROM.GetNameWithFlag] ha sido admitido formalmente como miembro de pleno derecho de la Organización de Cooperación de Shanghái."
 CHI_sco.7.t: "[FROM.GetNameWithFlag] se une a la OCS"
 CHI_sco.8.a: "La agresión china ha alejado a otro socio más."
 CHI_sco.8.b: "Un lamentable retroceso para la cooperación internacional."
 CHI_sco.8.d: "[FROM.GetNameWithFlag] ha anunciado su retirada de la Organización de Cooperación de Shanghái, citando diferencias irreconciliables."
 CHI_sco.8.t: "[FROM.GetNameWithFlag] se retira de la OCS"
 CHI_sco.9.a: "China no está dispuesta a compartir el protagonismo."
 CHI_sco.9.d: "China ha actuado con decisión para consolidar su dominio sobre la Organización de Cooperación de Shanghái, dejando de lado a Rusia y estableciéndose como la potencia líder indiscutible del bloque."
 CHI_sco.9.t: "China consolida el control sobre la OCS"
 CHI_semiconductor_events.1.d: "Los Estados Unidos han ampliado los controles de exportación para cubrir equipos semiconductores avanzados, software EDA y componentes de memoria de gran ancho de banda. Gobiernos aliados en Europa, Japón y Corea del Sur han coordinado la concesión de licencias de exportación para reforzar los controles. El embargo tecnológico refleja la determinación de Washington de evitar que China cierre la brecha en la producción de lógica y memoria avanzadas."
 CHI_semiconductor_events.1.o1: "Seguiremos adelante a pesar de todo."
 CHI_semiconductor_events.1.t: "Boicot occidental a los semiconductores"
 CHI_semiconductor_events.2.a: "Exhibir el logro"
 CHI_semiconductor_events.2.b: "Mantenerlo en secreto, acumular capacidad"
 CHI_semiconductor_events.2.d: "Huawei ha lanzado el Mate 60 Pro, impulsado por un sistema en chip Kirin 9000S de fabricación nacional. El análisis de desmontaje confirma que SMIC fabricó el SoC en su proceso N+2 equivalente a 7 nm. Este avance redefine las suposiciones públicas sobre cuánto nos han retrasado los controles de exportación."
 CHI_semiconductor_events.2.t: "La sorpresa del Mate 60"
 CHI_semiconductor_events.3.a: "Apoyarse en Empyrean"
 CHI_semiconductor_events.3.b: "Aguantar y redirigir a través de canales grises"
 CHI_semiconductor_events.3.d: "Las enmiendas de mayo de 2025 de la Oficina de Industria y Seguridad de EE. UU. nos señalan como un destino restringido para las herramientas EDA. Synopsys y Cadence presentan las solicitudes de licencia obligatorias requeridas. Las denegaciones de licencias llegarán en unas semanas. El flujo doméstico ahora tiene que sacar adelante cada diseño avanzado hasta su fase final de producción."
 CHI_semiconductor_events.3.t: "Synopsys y Cadence nos cortan el suministro"
 CHI_semiconductor_events.4.a: "Impulsar la cualificación con empresas nacionales de IA"
 CHI_semiconductor_events.4.b: "Exportar HBM a Rusia e Irán"
 CHI_semiconductor_events.4.d: "La planta de Hefei de ChangXin Memory Technologies comenzó a producir en masa pilas HBM2 un año entero antes de su objetivo público fijado para 2026. Las primeras muestras de cualificación ya están en manos de Cambricon y Biren. El desarrollo de aceleradores de IA nacionales ya no tiene que sortear un cuello de botella de memorias extranjeras."
 CHI_semiconductor_events.4.t: "CXMT HBM2 antes de lo previsto"
 CHI_semiconductor_events.5.a: "Aliviar los controles sobre los chips"
 CHI_semiconductor_events.5.b: "Mantenerse firmes en los controles de exportación"
 CHI_semiconductor_events.5.d: "China ha vinculado el acceso continuado a sus exportaciones de tierras raras y galio con el alivio de los controles de exportación de semiconductores. Dado que las cadenas de suministro occidentales de imanes y sustratos de chips dependen del refinado chino, Pekín apuesta a que la influencia funciona en ambos sentidos. La propuesta llega a nuestra mesa como un intercambio directo: aliviar el embargo de chips a cambio de mantener el flujo de minerales críticos."
 CHI_semiconductor_events.5.t: "La oferta de tierras raras de Pekín"
 CHI_semiconductor_events.6.a: "Acelerar el despliegue nacional"
 CHI_semiconductor_events.6.d: "Washington ha ampliado discretamente las aprobaciones de licencias para herramientas de nodos maduros y software de diseño a cambio de un suministro garantizado de tierras raras. El indulto es parcial y reversible, pero compra tiempo para que nuestras fundiciones cierren las brechas restantes sin el peso total del embargo."
 CHI_semiconductor_events.6.t: "Controles relajados"
 CHI_semiconductor_events.7.a: "Absorber el revés"
 CHI_semiconductor_events.7.d: "Washington ha rechazado la vinculación por completo, calculando que ceder en los chips supondría perder su mayor baza de presión. Los controles de exportación se mantienen y el capital político invertido en el acercamiento se ha esfumado. La autosuficiencia sigue siendo el único camino abierto para nosotros."
 CHI_semiconductor_events.7.t: "Colapso de las conversaciones"
 CHI_space_events.1.a: "Los ojos de la nación están puestos en nosotros."
 CHI_space_events.1.d: "En el Centro de Lanzamiento Espacial de Wenchang, un Larga Marcha 10 se eleva sobre una columna de humo y fuego, transportando la nave tripulada Mengzhou y a sus tres astronautas hacia la inyección translunar. Todos los televisores del país muestran el ascenso. El mundo observa."
 CHI_space_events.1.t: "El Larga Marcha despega hacia la Luna"
 CHI_space_events.10.a: "Financiar por completo la red de satélites y seguimiento"
 CHI_space_events.10.b: "Proceder a un ritmo moderado"
 CHI_space_events.10.d: "Con el programa Chang'e comprometido con la superficie lunar, el Consejo de Estado sopesa cómo financiar la infraestructura de apoyo. La primera cuestión es la red de satélites y seguimiento: los repetidores Queqiao y las antenas de espacio profundo que mantienen a la tripulación comunicada a lo largo de 380.000 kilómetros. Podemos financiarlo por completo ahora, o prorratear el coste y proceder a un ritmo moderado."
 CHI_space_events.10.t: "Financiar el camino a la Luna"
 CHI_space_events.11.a: "Acelerar el desarrollo del Larga Marcha 10"
 CHI_space_events.11.b: "Mantenerse en el calendario previsto"
 CHI_space_events.11.d: "Ninguna misión lunar tripulada es posible sin un cohete de carga pesada. El Larga Marcha 10 está diseñado para lanzar la nave tripulada Mengzhou y el módulo de aterrizaje Lanyue hacia la Luna en vuelos separados. Acelerar su desarrollo es costoso, pero cada mes ahorrado acerca el alunizaje."
 CHI_space_events.11.t: "La cuestión de la carga pesada"
 CHI_space_events.12.a: "Confiar en los ingenieros"
 CHI_space_events.12.d: "El camino moderado mantiene el programa asequible y políticamente seguro. Los ingenieros de la Academia China de Tecnología de Vehículos de Lanzamiento trabajan en la campaña de cualificación a un ritmo sostenible, seguros de que la paciencia se verá recompensada en la plataforma de lanzamiento."
 CHI_space_events.12.t: "Un ritmo constante"
 CHI_space_events.13.a: "Cosechar las recompensas"
 CHI_space_events.13.d: "Las decisiones de financiación de los últimos años dan sus frutos. Las antenas de seguimiento entran en servicio, los motores superan sus pruebas de cualificación y la arquitectura lunar toma forma. Los dividendos de la previsión ya están listos para ser aprovechados."
 CHI_space_events.13.t: "Las inversiones maduran"
 CHI_space_events.2.a: "Un gran paso adelante para el pueblo chino."
 CHI_space_events.2.d: "El módulo de aterrizaje Lanyue toca tierra en la región del polo sur lunar. El comandante de la misión abre la escotilla y desciende por la escalera. Sus primeras palabras, retransmitidas en directo ante mil millones de oyentes: hemos llegado y nos quedaremos. China ha alcanzado la Luna."
 CHI_space_events.2.t: "Astronautas pisan la Luna"
 CHI_space_events.20.a: "Un triunfo de la nación"
 CHI_space_events.20.b: "Un triunfo de nuestra industria"
 CHI_space_events.20.c: "Un triunfo de nuestra ciencia"
 CHI_space_events.20.d: "Los astronautas han caminado sobre la Luna y han regresado. Una nación que en su día importaba sus cohetes ha plantado su bandera en otro mundo. Ahora el liderazgo debe decidir qué significado duradero tendrá este logro: prestigio nacional, poder industrial, ambición científica o confianza marcial. El dividendo de la Luna marcará las próximas décadas."
 CHI_space_events.20.e: "Un triunfo de nuestra determinación"
 CHI_space_events.20.t: "El legado del alunizaje"
 chi_uighur.1.a: "Dispersar con la policía antidisturbios"
 chi_uighur.1.b: "Enviar a funcionarios del Partido a negociar"
 chi_uighur.1.c: "Arrestos masivos, culpar a agitadores extranjeros"
 chi_uighur.1.d: "Varios manifestantes han tomado las calles de Urumqi tras un incidente entre residentes de la etnia Han y trabajadores uigures. La policía antidisturbios ha acordonado los distritos centrales, pero las multitudes siguen creciendo. El comité del Partido en Xinjiang espera instrucciones de Pekín."
 chi_uighur.1.t: "Protestas callejeras en Urumqi"
 chi_uighur.2.a: "Expandir el Estado de vigilancia"
 chi_uighur.2.b: "Acercamiento comunitario y ayuda económica"
 chi_uighur.2.c: "Ejecuciones públicas de los autores"
 chi_uighur.2.d: "Un ataque coordinado con bomba en un concurrido distrito comercial ha dejado víctimas y ha destrozado cualquier sensación de normalidad en la ciudad. El Movimiento Islámico del Turquestán Oriental ha reivindicado la autoría. Las fuerzas de seguridad están en alerta máxima y Pekín exige una respuesta rápida."
 chi_uighur.2.t: "Ataque con bomba sacude el mercado de Urumqi"
 chi_uighur.3.a: "Imponer la ley marcial en Urumqi"
 chi_uighur.3.b: "Detenciones masivas, campos de «reeducación»"
 chi_uighur.3.c: "Negociar con los líderes de la comunidad uigur"
 chi_uighur.3.d: "Las tensiones que se venían acumulando durante meses han estallado en una violencia abierta en todo Urumqi y en varios distritos periféricos. Los enfrentamientos entre manifestantes uigures y residentes de la etnia Han han desbordado a la policía local. La magnitud de los disturbios, que recuerdan a las revueltas de 2009, exige una decisión inmediata por parte de la dirección central del Partido."
 chi_uighur.3.t: "Estallan disturbios a gran escala en Xinjiang"
 chi_uighur.4.a: "Rechazar cualquier injerencia en nuestros asuntos internos"
 chi_uighur.4.b: "Permitir una visita limitada de investigación de la ONU"
 chi_uighur.4.d: "Los informes sobre detenciones masivas y el establecimiento de centros de reeducación en Xinjiang han provocado una enérgica condena por parte de los gobiernos occidentales, Turquía y los organismos internacionales de derechos humanos. Los llamamientos a una investigación independiente van en aumento y varias capitales amenazan con medidas punitivas."
 chi_uighur.4.t: "La comunidad internacional condena a Pekín"
 chi_uighur.5.a: "Operación silenciosa, desarticulación total"
 chi_uighur.5.d: "Los servicios de seguridad han identificado y localizado con éxito una célula militante que planeaba atentados en todo Xinjiang. Actuando sobre la base de información de inteligencia precisa, una operación silenciosa ha desarticulado la red antes de que pudiera actuar."
 chi_uighur.5.t: "Avance de la inteligencia antiterrorista"
 chi_uighur.6.a: "Una respuesta firme restaurará el orden"
 chi_uighur.6.b: "El puño de hierro de Pekín"
 chi_uighur.6.d: "Han estallado violentos disturbios en toda la región china de Xinjiang. Las imágenes de vehículos en llamas y fuerzas de seguridad con equipo antidisturbios completo están circulando a nivel internacional. Pekín ha declarado que se restaurará el orden, pero la magnitud de los disturbios atrae el escrutinio de gobiernos y observadores de todo el mundo."
 chi_uighur.6.t: "Los disturbios sacuden Xinjiang"
 china_national_committee.02.a: "Seleccionar los comités"
 china_national_committee.02.d: "Se ha convocado el Congreso Nacional del Partido Comunista de China. Delegados de todo el país se han reunido para determinar el rumbo político de los próximos cinco años. Ahora se seleccionarán los comités más importantes y a sus dirigentes."
 china_national_committee.02.t: "Convocado el Congreso Nacional"
 china_news.44.a: "El fin de setenta años de división."
 china_news.44.d: "Tras un ultimátum conjunto sino-estadounidense, el gobierno de Corea del Norte se ha disuelto pacíficamente y ha transferido la soberanía a la República de Corea. La península vuelve a ser una sola bajo la bandera de Seúl. La dinastía Kim ha terminado sin necesidad de una guerra."
 china_news.44.t: "La península de Corea se reunifica bajo Seúl"
 china_news.45.a: "Comienza la guerra definitiva en Corea."
 china_news.45.d: "Tras el rechazo de Pionyang al ultimátum conjunto sino-estadounidense, China, los Estados Unidos y Corea del Sur han declarado la guerra a Corea del Norte. Por primera vez en la historia, Pekín y Washington marchan juntos contra el régimen de Kim."
 china_news.45.t: "Guerra declarada a Corea del Norte"
 china_news.boycott_streets.a: "Tomar nota."
 china_news.boycott_streets.d: "Las protestas antijaponesas se han extendido desde las redes sociales a las calles. Los concesionarios están cerrados, las tiendas Uniqlo tapian sus ventanas y las existencias de Toyota se quedan sin vender. El gobierno no ha intervenido."
 china_news.boycott_streets.t: "El boicot se extiende por las ciudades chinas"
 china_news.panda_arrives_tokyo.a: "Tomar nota."
 china_news.panda_arrives_tokyo.d: "Dos pandas gigantes, un regalo de la República Popular China, han llegado al aeropuerto de Narita entre muestras de un considerable entusiasmo popular. El gesto es una clave diplomática que señala una época más cálida en las relaciones sino-japonesas."
 china_news.panda_arrives_tokyo.t: "Los pandas llegan a Narita"
 china_news.yasukuni_recall.a: "Tomar nota."
 china_news.yasukuni_recall.d: "China ha llamado a consultas a su embajador en Tokio tras la visita del primer ministro japonés al Santuario Yasukuni. La protesta diplomática señala la determinación de Pekín de exigir responsabilidades a Japón por la forma en que honra a sus caídos en la guerra."
 china_news.yasukuni_recall.t: "Pekín llama a consultas a su embajador"
 china_sar.034.a: "Ordenar una represión inmediata de la seguridad."
 china_sar.034.b: "Investigar primero e involucrar a los líderes locales."
 china_sar.034.d: "Un ataque coordinado ha golpeado un puesto de control de seguridad en la cuenca de Tarim, dejando víctimas entre policías y civiles. Pekín debe elegir entre una represión inmediata de la seguridad o una respuesta de investigación más lenta en la agitada región."
 china_sar.034.t: "Ataque en Xinjiang"
 china_scs.10.a: "Tomar nota de la escalada."
 china_scs.10.d: "Los informes de inteligencia describen un despliegue coordinado de China de flotas pesqueras, milicias marítimas, patrulleras de la guardia costera y fragatas en anillos concéntricos alrededor de los accidentes geográficos en disputa del mar de China Meridional. Esta doctrina, atribuida al contraalmirante Zhang Zhaozhong, no deja margen para la impugnación legal una vez que el cerco se ha completado. Nuestras reclamaciones e intereses en la región están ahora bajo una presión directa."
 china_scs.10.t: "Pekín adopta la estrategia del repollo"
 china_scs.12.a: "Aceptar el resultado."
 china_scs.12.d: "La operación de estancamiento ha llegado a su fin. El resultado determina el control práctico sobre el accidente geográfico y los costes diplomáticos que China deberá asumir."
 china_scs.12.t: "Estancamiento concluido"
 china_scs.13.a: "Lanzar las FONOP de inmediato."
 china_scs.13.b: "Ejercer moderación por ahora."
 china_scs.13.d: "El Departamento de Estado ha emitir una gestión diplomática formal y el Pentágono está sopesando las opciones. Las Operaciones de Libertad de Navegación (FONOP) a través de las zonas de doce millas náuticas de las islas artificiales son la respuesta inmediata más probable. La Séptima Flota está en alerta."
 china_scs.13.t: "Washington responde a la intrusión china"
 china_scs.14.a: "Retirarse. No interceptar."
 china_scs.14.b: "Seguir de cerca al buque y protestar."
 china_scs.14.c: "Interceptar y emitir una advertencia final."
 china_scs.14.d: "Un buque de la Marina de los EE. UU. ha entrado en la zona de doce millas náuticas alrededor de una de las instalaciones de las islas artificiales de China. La Flota del Mar del Sur espera órdenes. Retirarse se interpretará como una aceptación; seguirlo de cerca mantiene la presencia sin escalada; una interceptación activa corre el riesgo de provocar un incidente grave."
 china_scs.14.t: "Respuesta de la Armada del EPL a las FONOP"
 china_scs.15.a: "Presentar una protesta formal y exigir una indemnización."
 china_scs.15.b: "Convocar una sesión de emergencia del Consejo de Seguridad."
 china_scs.15.d: "Una operación de libertad de navegación ha terminado en una colisión o enfrentamiento en el mar. Ambas partes están emitiendo versiones contradictorias de lo ocurrido. Los medios internacionales exigen una investigación completa; las audiencias nacionales de ambas partes piden una respuesta firme."
 china_scs.15.t: "Incidente en el Mar del Sur"
 china_scs.20.a: "El cielo sobre el Mar del Sur es chino."
 china_scs.20.d: "Pekín ha anunciado el establecimiento de una Zona de Identificación de Defensa Aérea (ADIZ) que cubre el mar de China Meridional. Todas las aeronaves que entren en la zona deben transmitir su identificación, mantener contacto por radio y cumplir con las instrucciones del control de tráfico aéreo chino. Los Estados Unidos, Japón, Australia y Filipinas han declarado inmediatamente que la ADIZ es ilegal según el derecho internacional."
 china_scs.20.t: "Declarada la ADIZ del mar de China Meridional"
 china_scs.21.a: "Emitir una severa advertencia por canales diplomáticos."
 china_scs.21.b: "Escoltarlos fuera y publicar un comunicado."
 china_scs.21.d: "Interceptores de la Fuerza Aérea del EPL han establecido contacto con una aeronave militar extranjera que transitaba por la zona de patrulla del mar de China Meridional sin cumplir con los procedimientos de identificación chinos. La aeronave ha sido escoltada o interpelada; la forma en que Pekín responda al incidente determinará tanto la credibilidad de la aplicación de la zona de patrulla como el clima de las relaciones con el Estado de origen de la aeronave."
 china_scs.21.t: "Aeronave extranjera interceptada"
 china_scs.30.a: "Comprometerse con el nuevo marco."
 china_scs.30.d: "Pekín ha anunciado que su compromiso en el mar de China Meridional se llevará a cabo siguiendo el espíritu de las flotas de tesoros de la dinastía Ming: a través del comercio, la asociación y el diálogo bilateral en lugar de la confrontación. El marco de la Ruta Marítima de la Seda se extiende formalmente a todos los Estados ribereños. La oportunidad para rebajar la tensión es real, aunque las reclamaciones de fondo no hayan cambiado."
 china_scs.30.t: "Pekín recurre a la diplomacia marítima"
 china_scs.31.a: "Un paso adelante constructivo."
 china_scs.31.d: "En un comunicado conjunto emitido tras las conversaciones bilaterales en Pekín, China y sus vecinos del mar de China Meridional han reafirmado su compromiso con la Declaración sobre la Conducta de las Partes de 2002. El comunicado pide que las disputas se gestionen pacíficamente mediante consultas bilaterales y renueva la promesa contra las provocaciones unilaterales, una formulación que Pekín interpreta para excluir su propia presencia existente."
 china_scs.31.t: "Reafirmada la Declaración de 2002"
 china_scs.32.a: "Dar la bienvenida a Manila a la nueva asociación."
 china_scs.32.b: "Mantener la alineación existente con los EE. UU."
 china_scs.32.d: "El presidente Duterte ha pronunciado un discurso en Pekín anunciando la «separación» de Filipinas de los Estados Unidos y señalando su apertura a una nueva relación con China. La declaración ha dejado atónito a Washington y ha entusiasmado a Pekín. La posición de Manila sobre el fallo del arbitraje del mar de China Meridional es ahora deliberadamente ambigua."
 china_scs.32.t: "Manila en una encrucijada"
 china_scs.33.a: "Un paso hacia la estabilidad regional."
 china_scs.33.d: "El Diario del Pueblo informa que China y su socio han concluido un acuerdo de desarrollo marítimo conjunto, estableciendo un marco administrativo compartido para la exploración de hidrocarburos y los derechos de pesca. El acuerdo se describe como «un modelo de cooperación beneficiosa para todos y la Ruta de la Seda Marítima en acción». Los gobiernos reclamantes que no forman parte del acuerdo se niegan a hacer comentarios."
 china_scs.33.t: "Firmado el Acuerdo de Desarrollo Marítimo Conjunto"
 china_scs.34.a: "Ofrecer un período de gracia y renegociar."
 china_scs.34.b: "Hacer cumplir los términos originales."
 china_scs.34.c: "Condonar la deuda a cambio de concesiones."
 china_scs.34.d: "El gobierno del Estado socio ha anunciado que no puede cumplir con el pago programado del préstamo para la financiación de infraestructuras chinas de la Franja y la Ruta. Los políticos de la oposición nacional exigen que se renegocien los términos; Pekín se enfrenta a una elección entre la flexibilidad que preserva la relación y la firmeza que mantiene el precedente financiero."
 china_scs.34.t: "Se exige la renegociación de la deuda"
 china_scs.35.a: "Un triunfo diplomático."
 china_scs.35.d: "Por primera vez, el comunicado de la cumbre de la ASEAN ha incluido un lenguaje que respalda explícitamente la gestión bilateral de las disputas del mar de China Meridional y rechaza la participación de «partes externas». La formulación se insertó ante la insistencia de China y bloqueó la aprobación del lenguaje exigido por Vietnam y Filipinas. Washington ha condenado el resultado."
 china_scs.35.t: "La cumbre de la ASEAN respalda la posición china"
 china_scs.36.a: "Renegociar los términos."
 china_scs.36.b: "Hacer cumplir los términos originales."
 china_scs.36.c: "Retirar el préstamo."
 china_scs.36.d: "Figuras de la oposición nacional y grupos de la sociedad civil en el Estado socio han lanzado una campaña pública contra el préstamo chino de la Franja y la Ruta, citando términos de interés desfavorables, preocupaciones ambientales y temores de dependencia estratégica. El gobierno está bajo presión para renegociar; Pekín debe elegir entre proteger el precedente financiero y preservar la relación política."
 china_scs.36.t: "Reacción violenta contra la deuda"
 china_scs.40.a: "Presionar para lograr la aceptación total del borrador chino."
 china_scs.40.b: "Aceptar un compromiso para lograr la firma del acuerdo."
 china_scs.40.d: "Las negociaciones sobre el Código de Conducta para el mar de China Meridional han entrado en su ronda final. El borrador chino excluye la resolución obligatoria de disputas, limita el alcance geográfico para excluir las áreas de construcción activa de China y prohíbe que los Estados que no pertenecen a la ASEAN tengan cualquier papel de supervisión. Los Estados reclamantes están divididos entre aceptar un acuerdo defectuoso o continuar indefinidamente sin ninguno."
 china_scs.40.t: "Negociaciones del Código de Conducta: Ronda final"
 china_scs.41.a: "La región ha hablado."
 china_scs.41.d: "El Departamento de Estado ha emitido un comunicado reconociendo la entrada en vigor del Código de Conducta ASEAN-China en el mar de China Meridional. El comunicado señala las objeciones de los EE. UU. a varias disposiciones, pero reconoce el acuerdo como el marco rector para la región. Los analistas lo describen como una retirada significativa de la insistencia de larga data de Estados Unidos en la CONVEMAR como único marco válido."
 china_scs.41.t: "Washington reconoce el Código de Conducta"
 china_scs.50.a: "Preparar una respuesta."
 china_scs.50.d: "Un editorial del Diario del Pueblo, distribuido a través de canales diplomáticos con el respaldo aparente del Estado, invoca la doctrina clásica de los Cuatro Mares (四海, Sihai) y enmarca las reclamaciones marítimas de China como la restauración de un orden natural interrumpido. El anuncio que lo acompaña sobre la expansión naval no deja dudas sobre las intenciones de Pekín. El orden marítimo posterior a 1945 en el Pacífico Occidental está ahora abiertamente bajo disputa."
 china_scs.50.t: "Pekín reclama el Mandato de los Mares"
 china_scs.51.a: "Se toma nota de sus protestas."
 china_scs.51.b: "Ofrecer una declaración aclaratoria para reducir la alarma."
 china_scs.51.d: "La invocación formal de China del sistema de vasallaje ha producido reacciones marcadamente divergentes. Los ministros de Asuntos Exteriores de la ASEAN emitieron una declaración conjunta de emergencia rechazando cualquier reclamación de soberanía histórica. Los Estados Unidos, Japón y Australia anunciaron una respuesta diplomática coordinada. Dentro de China, los medios estatales cubrieron las reacciones como la confirmación de que la restauración de la dignidad nacional inquieta a quienes se beneficiaron del Siglo de la Humillación."
 china_scs.51.t: "El mundo reacciona a la retórica del vasallaje"
 china_scs.52.a: "Reconocer la autoridad china."
 china_scs.52.b: "Rechazar el ultimátum."
 china_scs.52.d: "El embajador chino ha entregado un ultimátum formal que exige el reconocimiento de la autoridad administrativa china sobre las aguas en disputa del mar de China Meridional en un plazo de setenta y dos horas. El gobierno debe decidir ahora: aceptar los términos y preservar la relación, o negarse y aceptar las consecuencias."
 china_scs.52.t: "Ultimatum entregado"
 china_scs.53.a: "Emitir un ultimátum conjunto."
 china_scs.53.b: "Protesta diplomática únicamente."
 china_scs.53.c: "Mantenerse al margen de esto."
 china_scs.53.d: "Pekín ha emitido un ultimátum a un reclamante del mar de China Meridional que se ha negado a cumplir. Washington se enfrenta a una elección: honrar sus compromisos de seguridad uniéndose a un ultimátum conjunto contra China, limitarse a una protesta formal que preserve la relación, o mantenerse al margen por completo. La decisión depende de la preparación naval, la credibilidad de la alianza y de cuánto capital político esté dispuesta a gastar la administración en una disputa en aguas a cuatro mil millas de distancia."
 china_scs.53.t: "Crisis en el Mar de China Meridional"
 china_scs.54.a: "Cumplir y retirarse."
 china_scs.54.b: "Rechazar. No le dictarán normas a China."
 china_scs.54.d: "Los Estados Unidos se han unido al reclamante para presentar a Pekín una exigencia formal para que retire sus fuerzas del accidente geográfico en disputa y deje sin efecto el ultimátum. La Séptima Flota se encuentra en un estado de preparación elevado. El cumplimiento significa la retirada; el rechazo significa enfrentarse al peso naval combinado de los Estados Unidos y sus socios regionales. Se ha convocado al Comité Permanente del Politburó."
 china_scs.54.t: "El ultimátum de Washington"
 china_scs.55.a: "Que siga siendo así por mucho tiempo."
 china_scs.55.d: "Los despachos de las instalaciones de la Armada del EPL en el mar de China Meridional informan de ambientes variados en toda la flota. En el arrecife Fiery Cross, los marineros fotografían el amanecer sobre unas aguas que sus cartas náuticas ya marcan como su hogar. En el portaaviones, la tripulación se prepara para los ejercicios. En la estación de la guardia costera en Scarborough, un oficial de guardia señala que ningún buque extranjero se ha aproximado a la línea de exclusión en noventa días. El Mar del Sur está tranquilo."
 china_scs.55.t: "Voces de la Flota del Mar del Sur"
 china_scs.56.a: "El Mar del Sur debe ser asegurado."
 china_scs.56.d: "Después de que el reclamante rechazara el ultimátum de Pekín, los grupos de superficie de la Armada del EPL se han desplazado para hacer de él un cumplimiento efectivo. Ha comenzado un enfrentamiento naval corto pero encarnizado por el disputado accidente geográfico de las Spratly. Ambas partes están comprometiendo solo fuerzas limitadas; el resultado determinará el control del Estado y si el reclamante recurre a Washington en busca de una intervención."
 china_scs.56.t: "La escaramuza de las Spratly"
 china_scs.57.a: "Aceptar la derrota y buscar condiciones."
 china_scs.57.b: "Apelar a los Estados Unidos."
 china_scs.57.d: "El enfrentamiento fronterizo ha terminado en derrota. El accidente geográfico en disputa está ahora bajo control chino y sus fuerzas se han retirado. El gobierno debe decidir si acepta la pérdida y preserva la soberanía que le queda, o si apela a los Estados Unidos en busca de apoyo, una opción que corre el riesgo de arrastrar a Washington a una confrontación que tal vez no sea de su agrado."
 china_scs.57.t: "Apelación a los aliados estadounidenses"
 china_scs.58.a: "Retirarse y reevaluar."
 china_scs.58.d: "Unidades de la Armada del EPL se enfrentaron a las fuerzas del reclamante por el accidente geográfico en disputa y se retiraron sin asegurar la posición. La escaramuza fue limitada y contenida, pero la narrativa diplomática habla de una extralimitación china y de una deficiencia militar. Pekín debe asumir el coste político mientras la postura estratégica general continúa."
 china_scs.58.t: "Revés por la escaramuza en las Spratly"
 china_scs.60.a: "Tomar nota de la nueva alineación."
 china_scs.60.d: "Con la agresión china en el mar de China Meridional superando un umbral que la región ya no puede asumir diplomáticamente, los Estados Unidos, Japón, la India y Australia han formalizado su cooperación en materia de seguridad en una alineación funcional del Quad. Se anuncian patrullas navales conjuntas, intercambio de inteligencia y posiciones diplomáticas coordinadas. La formación es una respuesta directa a la postura de Pekín y señala que la disputa por el mar de China Meridional ha adquirido una dimensión de gran potencia."
 china_scs.60.t: "La Iniciativa Cuadrilateral"
 china_scs.70.a: "Disculparse discretamente y retirarse."
 china_scs.70.b: "Mantenerse firmes. Las aguas están dentro de los derechos históricos de China."
 china_scs.70.d: "Se han detectado buques de la milicia marítima china operando dentro de la Zona Económica Exclusiva de Natuna en Indonesia, acompañados por escoltas de la guardia costera. Yakarta ha presentado una protesta formal, llamando a consultas a su embajador y desplegando buques navales para seguir de cerca a las embarcaciones chinas. Indonesia no cuestiona públicamente la línea de los nueve puntos, pero la intrusión pone a prueba los límites de su paciencia estratégica y corre el riesgo de arrastrar al mayor Estado de la ASEAN a una confrontación abierta con Pekín."
 china_scs.70.t: "El incidente de Natuna"
 sino_indian.1.d_opt: "No podemos intervenir en este momento."
 sino_indian.20.a: "Un esfuerzo de coalición defensivo. Protegemos la región."
 sino_indian.20.b: "Una expedición punitiva. Rápida, decisiva, brutal."
 sino_indian.20.c: "Estado de guerra de coalición total. Terminamos con esto de forma permanente."
 sino_indian.20.d: "El marco de la coalición contra las facciones talibanes y del TTP en las zonas fronterizas afgano-pakistaníes ya está en marcha. Los comandantes esperan indicaciones políticas sobre la naturaleza de la operación. La elección determinará cómo perciben la región y el resto del mundo el papel de China en Asia Central."
 sino_indian.20.t: "Operación Tigre de la Montaña: Definir la misión"
 sino_indian.21.a: "Aceptar. Iniciar el diálogo formal."
 sino_indian.21.b: "Corresponder con cautela. Confiar pero verificar."
 sino_indian.21.c: "Rechazar. Esto es una maniobra de distracción."
 sino_indian.21.d: "China ha dado una serie de pasos para distanciarse de Islamabad y señalar una nueva orientación hacia Nueva Delhi. El gesto llega sin condiciones previas, pero sus implicaciones estratégicas son evidentes. La India debe decidir si se compromete y bajo qué condiciones."
 sino_indian.21.t: "Pekín tiende una mano inesperada"
 sino_indian.22.a: "Una postura defensiva. Fuimos provocados."
 sino_indian.22.b: "Una expedición punitiva. Como en 1962."
 sino_indian.22.c: "Estado de guerra total. Zanjar la línea McMahon para siempre."
 sino_indian.22.d: "Fuerzas del EPL se han enfrentado a unidades indias a lo largo de la Línea de Control Actual. El choque es lo suficientemente grave como para exigir una decisión política. Pekín debe definir el carácter político de esta acción militar antes de que se defina por sí misma."
 sino_indian.22.t: "La rendición de cuentas de Galwan"
 sino_indian.30.a: "Excelente."
 sino_indian.30.b: "Un acontecimiento interesante."
 sino_indian.30.d: "La mediación propiciada por China entre facciones talibanes rivales ha provocado una ruptura inesperada. Un bloque de línea dura ha roto con la dirección principal debido a las condiciones propuestas, denunciando públicamente el proceso. La división debilita la cohesión talibán y crea una oportunidad para la coalición."
 sino_indian.30.t: "Facciones talibanes se dividen por las negociaciones"
 sino_indian.31.a: "Esperábamos algo así."
 sino_indian.31.d: "La declaración de Pekín de un estado de guerra de coalición total en Asia Central ha causado preocupación en Ankara y Teherán. Ambas capitales ven la movilización como una proyección del alcance militar chino en una región que consideran su propia periferia estratégica."
 sino_indian.31.t: "El estado de guerra de la coalición alarma a las potencias regionales"
 sino_indian.32.a: "Aceptar el pacto. Necesitamos protección."
 sino_indian.32.b: "Rechazar. Conservamos nuestra autonomía estratégica."
 sino_indian.32.d: "A raíz de la ofensiva china a lo largo del frente del Himalaya, Washington se ha acercado a Nueva Delhi con una oferta formal de pacto de defensa bilateral. Los planificadores estadounidenses ven a la India como un contrapeso crítico para el poder chino. Para la India, la aceptación significaría garantías de seguridad pero también una alineación más profunda con los Estados Unidos."
 sino_indian.32.t: "Washington ofrece un pacto de defensa"
 sino_indian.33.a: "Prepararse para la presión china"
 sino_indian.33.d: "El renovado compromiso de China en el sur de Asia señala un desafío directo a la esfera de influencia tradicional de la India. Nueva Delhi debe preparar su respuesta."
 sino_indian.33.t: "Pekín gira hacia el sur de Asia"
 sino_indian.34.a: "Tomar los fusiles y las órdenes"
 sino_indian.34.b: "Negarse a ser el títere de Pekín"
 sino_indian.34.d: "China está ofreciendo al Partido Comunista Unificado de Nepal armas, entrenamiento y respaldo político para presionar en su insurgencia contra Katmandú. La aceptación vincula al movimiento con el patrocinio de Pekín, una deuda de la que se exigirá el pago si la bandera roja llega a ondear alguna vez sobre Singha Durbar."
 sino_indian.34.t: "Pekín tiende la mano a los maoístas"
 sino_indian.35.a: "Aceptar el marco"
 sino_indian.35.b: "Rechazar por ahora"
 sino_indian.35.d: "Pekín se ha puesto en contacto con Katmandú con una oferta de cooperación económica y de infraestructura, enmarcada en el respeto mutuo a la condición de neutralidad de Nepal."
 sino_indian.35.t: "China propone un marco de cooperación"
 sino_indian.36.a: "Aceptar la asociación"
 sino_indian.36.b: "Rechazar cortésmente"
 sino_indian.36.d: "China ha propuesto una asociación estratégica formal a Bangladés, respaldada por una garantía de seguridad y la ampliación de los lazos comerciales. Daca debe sopesar los beneficios frente a la probable reacción de Nueva Delhi."
 sino_indian.36.t: "Pekín ofrece a Daca una asociación estratégica"
 sino_indian.37.a: "Aceptamos este gesto"
 sino_indian.37.d: "En un gesto diplomático inesperado, China ha renunciado formalmente a sus reclamaciones territoriales pendientes a lo largo de la frontera norte de Bután. Timbu acoge con satisfacción el anuncio."
 sino_indian.37.t: "Pekín retira sus reclamaciones sobre Bután"
 sino_indian.38.a: "Adoptar la asociación"
 sino_indian.38.b: "Necesitamos nuestro propio espacio"
 sino_indian.38.d: "China ha ofrecido a Pakistán una declaración de asociación permanente —el vínculo de Hermanos de Hierro—, consolidando su alianza incondicional al más alto nivel político."
 sino_indian.38.t: "Pekín propone un Pacto de Hermanos de Hierro"
 sino_indian.39.a: "Centrarse en la guerra terrestre"
 sino_indian.39.b: "Centrarse en el poder aéreo"
 sino_indian.39.c: "Centrarse en la capacidad naval"
 sino_indian.39.d: "La industria de defensa de China está lista para transferir conocimientos a Pakistán. Islamabad debe decidir qué campo se beneficia más de la colaboración."
 sino_indian.39.d_opt: "Centrarse en la tecnología nuclear"
 sino_indian.39.t: "Proyectos militares conjuntos: Elegir un enfoque"
 sino_indian.40.a: "Designar formalmente al ETIM como organización terrorista"
 sino_indian.40.b: "Rechazar la solicitud"
 sino_indian.40.d: "China ha solicitado formalmente que Pakistán designe al Movimiento Islámico del Turquestán Oriental (ETIM) como organización terrorista. Islamabad debe sopesar los beneficios de la lucha antiterrorista frente a las sensibilidades políticas internas."
 sino_indian.40.t: "Pekín solicita la designación terrorista del ETIM"
 sino_indian.41.a: "Dar la bienvenida a la inversión"
 sino_indian.41.d: "Pekín ha confirmado el lanzamiento del programa completo del Corredor Económico China-Pakistán. Esta inversión masiva en infraestructura reconfigurará las redes de transporte y energía de Pakistán."
 sino_indian.41.t: "Comienza el Corredor Económico China-Pakistán"
 sino_indian.42.a: "Damos la bienvenida a la asociación"
 sino_indian.42.d: "Pekín ha propuesto ampliar las instalaciones de atraque del puerto de Gwadar para dar cabida a los buques navales chinos. Islamabad obtendrá a cambio una nueva capacidad de astilleros."
 sino_indian.42.t: "China contempla Gwadar como base naval"
 sino_indian.43.a: "Unirse al mecanismo"
 sino_indian.43.d: "China ha invitado a Pakistán a unirse al Mecanismo de Coordinación y Cooperación Cuadrilateral, un marco conjunto de lucha antiterrorista que vincula a Pekín, Kabul, Islamabad y Dusambé."
 sino_indian.43.t: "El MCCC: Islamabad invitado a unirse"
 sino_indian.44.a: "Unirse al mecanismo"
 sino_indian.44.d: "China ha invitado a Afganistán a unirse al Mecanismo de Coordinación y Cooperación Cuadrilateral, un marco conjunto de lucha antiterrorista que vincula a Pekín, Kabul, Islamabad y Dusambé."
 sino_indian.44.t: "El MCCC: Kabul invitado a unirse"
 sino_indian.45.a: "Unirse al mecanismo"
 sino_indian.45.d: "China ha invitado a Tayikistán a unirse al Mecanismo de Coordinación y Cooperación Cuadrilateral, un marco conjunto de lucha antiterrorista que vincula a Pekín, Kabul, Islamabad y Dusambé."
 sino_indian.45.t: "El MCCC: Dusambé invitado a unirse"
 sino_indian.46.a: "Luchar junto a China"
 sino_indian.46.b: "Esta es una guerra que le corresponde luchar a China"
 sino_indian.46.d: "Pekín ha solicitado que Pakistán se una a una campaña militar combinada contra los talibanes y el TTP. Un esfuerzo conjunto sería mucho más decisivo, pero también supondría un compromiso mucho mayor."
 sino_indian.46.t: "China propone operaciones conjuntas en Afganistán"
 sino_indian.47.a: "Coordinar la seguridad fronteriza"
 sino_indian.47.d: "Pekín ha establecido una zona conjunta de gestión de fronteras y coordinación antiterrorista en el corredor de Wakhan. Todos los Estados socios se beneficiarán de un intercambio de inteligencia mejorado."
 sino_indian.47.t: "China lanza la Iniciativa de la Zona de Amortiguamiento de Wakhan"
 sino_indian.48.a: "Reconocer el gesto"
 sino_indian.48.b: "Seguimos mostrándonos escépticos"
 sino_indian.48.d: "La decisión de Pekín de distanciarse de Islamabad no ha pasado desapercibida en Nueva Delhi. Si esto señala una auténtica realineación o una maniobra temporal sigue siendo una pregunta abierta."
 sino_indian.48.t: "La India sopesa el giro de Pekín respecto a Pakistán"
 sino_indian.49.a: "Presentar una protesta formal"
 sino_indian.49.b: "Aceptar la nueva realidad regional"
 sino_indian.49.d: "El Tratado de Amistad Sino-Indio ha causado conmoción en Washington. En las esferas más altas se debate ahora si representa un nuevo orden estable o una amenaza para los intereses estadounidenses en la región."
 sino_indian.49.t: "Washington reacciona al Tratado Sino-Indio"
 sino_indian.50.a: "Someterse a la autoridad china"
 sino_indian.50.b: "Bután nunca se someterá"
 sino_indian.50.d: "China ha presentado a Bután una dura elección: sumisión formal a la autoridad de Pekín o enfrentarse a las consecuencias de la fuerza militar. Timbu tiene poco margen de maniobra."
 sino_indian.50.t: "Pekín emite un ultimátum a Timbu"
 sino_indian.51.a: "Aceptar las condiciones"
 sino_indian.51.b: "Nepal se resistirá"
 sino_indian.51.d: "China ha exigido que Nepal acepte un estatus formal como Estado asociado bajo la autoridad de Pekín. Katmandú debe decidir si cumple o se resiste."
 sino_indian.51.t: "Pekín emite un ultimátum a Katmandú"
 sino_indian.52.a: "Aceptar la asociación"
 sino_indian.52.b: "Rechazar la solicitud"
 sino_indian.52.d: "China ha solicitado formalmente acceso logístico y de bases en nuestros puertos bajo la denominada estrategia de la Sarta de Perlas. A cambio, Pekín ofrece un paquete sustancial de asociación económica."
 sino_indian.52.t: "Pekín solicita derechos de base naval"
 sino_indian.53.a: "Aceptar el abrazo de Pekín"
 sino_indian.53.b: "La revolución no responde ante ningún amo extranjero"
 sino_indian.53.d: "La República Popular de Nepal se alza triunfante en Katmandú, pero los fusiles que ganaron la revolución llevaban el sello de Norinco. Pekín espera ahora que el nuevo Estado ocupe su lugar dentro de la esfera de China como Estado asociado. Un rechazo no será recibido con amabilidad."
 sino_indian.53.t: "La factura de Pekín llega a su vencimiento"
 sino_indian.54.a: "Una asociación excelente"
 sino_indian.54.d: "Pakistán ha aceptado nuestra oferta de investigación militar conjunta y ha seleccionado su área de enfoque. Nuestras industrias de defensa coordinarán ahora el desarrollo en la especialización acordada, y nuestros investigadores saldrán ganando con la asociación."
 sino_indian.54.t: "Islamabad se une a los programas militares conjuntos"
 sino_indian.55.a: "Un punto de apoyo en el mar Arábigo"
 sino_indian.55.d: "Islamabad ha dado formalmente la bienvenida a nuestras fuerzas navales en el puerto de Gwadar. Las instalaciones de atraque ampliadas y el acuerdo de establecimiento de bases nos otorgan un punto de apoyo estratégico en el mar Arábigo, anclando nuestra presencia a lo largo del océano Índico occidental."
 sino_indian.55.t: "Gwadar se abre a la Armada del Ejército Popular de Liberación"
 CHI_advanced_node_chips_trait: "Chips de nodos avanzados"
 CHI_advanced_node_chips_trait_desc: "El proceso equivalente a 7 nm de SMIC nutre a los sistemas de mando y control de CETC con procesadores nacionales. Elimina el cuello de botella de suministro extranjero para la electrónica de procesamiento de señales."
 CHI_hbm_compute_trait: "Cálculo de guía respaldado por HBM"
 CHI_hbm_compute_trait_desc: "Las pilas HBM2 de CXMT respaldan la fusión avanzada de sensores y la clasificación de objetivos en los sistemas de defensa aérea e interceptores de CASIC. El suministro nacional pone fin a la dependencia de memorias extranjeras."
 CHI_imfm_jsw_partnership: "Asociación con Japan Steel Works"
 CHI_imfm_jsw_partnership_desc: "Esta asociación transfiere los procesos de fabricación de acero de alta dureza y forja de gran diámetro de Japan Steel Works, mejorando directamente la calidad de producción de materiales estructurales de la fábrica."
 CHI_imfm_komatsu_partnership: "Asociación con Komatsu"
 CHI_imfm_komatsu_partnership_desc: "La cooperación con Komatsu Defense introduce métodos de construcción de blindajes ligeros modulares y prácticas de integración de sistemas de vehículos desarrolladas para los programas de vehículos de autodefensa de Japón."
 CHI_imfm_mhi_partnership: "Asociación con Mitsubishi Heavy Industries"
 CHI_imfm_mhi_partnership_desc: "Un acuerdo de fabricación bajo licencia con Mitsubishi Heavy Industries importa metodologías avanzadas de diseño de blindajes y técnicas de protección compuesta al programa de vehículos de la fábrica."
 CHI_indigenous_euv_trait: "Integración de EUV nativa"
 CHI_indigenous_euv_trait_cetc: "Integración de EUV nativa"
 CHI_indigenous_euv_trait_cetc_desc: "La litografía de patrones de SiCarrier produce la próxima generación de procesadores CNC de CETC, ASIC de sensores y electrónica de soporte de radar. El coste por oblea disminuye a medida que madura la cadena de herramientas nacional."
 CHI_indigenous_euv_trait_desc: "La litografía de patrones de SiCarrier produce chips de grado espacial y militar para misiles dentro del programa de CASC. Suministro nacional de extremo a extremo para sistemas estratégicos."
 CHI_kirin_avionics_trait: "Integración de aviónica Kirin"
 CHI_kirin_avionics_trait_desc: "Los SoC derivados de HiSilicon Kirin potencian los ordenadores de vuelo, sistemas de misión y suites de guerra electrónica de AVIC. Sustitución nacional tras la inclusión en la lista de entidades de 2019."
 CHI_norinco_howa_partnership: "Asociación con Howa Machinery"
 CHI_norinco_howa_partnership_desc: "Esta asociación otorga licencias para los procesos de mecanizado de precisión de armas ligeras de Howa Machinery, elevando las tolerancias de producción y la consistencia de calidad en las líneas de armas de infantería de NORINCO."
 CHI_norinco_nec_partnership: "Asociación con NEC"
 CHI_norinco_nec_partnership_desc: "La cooperación con NEC Corporation integra los estándares electrónicos C4ISR japoneses y la ingeniería de sistemas embebidos en las líneas de productos de sensores y comunicaciones para el campo de batalla de NORINCO."
 CHI_norinco_subaru_partnership: "Asociación con Subaru"
 CHI_norinco_subaru_partnership_desc: "Un acuerdo de transferencia tecnológica con Subaru Aerospace aporta técnicas de metalurgia de precisión y conocimientos de diseño estructural de alas rotatorias a las líneas de producción de NORINCO."
 CHI_norinco_toshiba_partnership: "Asociación con Toshiba"
 CHI_norinco_toshiba_partnership_desc: "Un acuerdo de licencias con Toshiba Defense Systems introduce el diseño avanzado de matrices de radar y técnicas de fabricación de componentes de guerra electrónica en la división de electrónica de NORINCO."
