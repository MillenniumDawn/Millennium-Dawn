 arm_levon.5.d: "[FROM.GetNameWithFlag] concorda em reconhecer nosso novo status neutro."
 arm_levon.5.a: "Bom!"
 arm_levon.6.t: "[FROM.GetNameWithFlag] Aceitou"
 arm_levon.6.d: "[FROM.GetNameWithFlag] concorda em reconhecer nosso novo status neutro."
 arm_levon.6.a: "Bom!"
 arm_levon.7.t: "[FROM.GetNameWithFlag] Aceitou"
 arm_levon.7.d: "[FROM.GetNameWithFlag] concorda em reconhecer nosso novo status neutro."
 arm_levon.7.a: "Bom!"
 arm_levon.8.t: "Missão Fracassada"
 arm_levon.8.d: "Infelizmente, [FROM.GetNameWithFlag] recusou-se a reconhecer nosso status neutro."
 arm_levon.8.a: "Tanto faz."
 arm_levon.9.t: "A Armênia Oferece Cooperação"
 arm_levon.9.d: "A Armênia afirma que a cooperação com ela será mais favorável do que com o Azerbaijão."
 arm_levon.9.a: "Sempre quis experimentar os quibes armênios."
 arm_levon.9.b: "Não."
 arm_levon.10.t: "Israel Muda sua Estratégia no Cáucaso"
 arm_levon.10.d: "Convencemos com sucesso Israel a começar a cooperar conosco."
 arm_levon.10.a: "Bom!"
 arm_levon.11.t: "Israel Ignora Nossa Oferta"
 arm_levon.11.d: "Infelizmente, o petróleo de Baku cheira melhor que o pão pita armênio."
 arm_levon.11.a: "Tanto faz."
 arm_levon.12.t: "[FROM.GetNameWithFlag] Propõe Solução Pacífica das Relações"
 arm_levon.12.d: "[FROM.GetNameWithFlag] propõe a criação de uma rede de segurança unificada entre nossos países para evitar conflitos futuros."
 arm_levon.12.a: "Concordamos."
 arm_levon.12.b: "Não."
 arm_levon.13.t: "Negociações Bem-Sucedidas"
 arm_levon.13.d: "Conseguimos chegar a uma decisão comum na recente reunião, e assim um novo cinturão de segurança será criado."
 arm_levon.13.a: "Bom!"
 arm_levon.14.t: "Negociações Bem-Sucedidas"
 arm_levon.14.d: "Conseguimos chegar a uma decisão comum na recente reunião, e assim um novo cinturão de segurança será criado."
 arm_levon.14.a: "Bom!"
 arm_levon.15.t: "Negociações Bem-Sucedidas"
 arm_levon.15.d: "Conseguimos chegar a uma decisão comum na recente reunião, e assim um novo cinturão de segurança será criado."
 arm_levon.15.a: "Bom!"
 arm_levon.16.t: "Negociações Fracassadas"
 arm_levon.16.d: "Infelizmente, não conseguimos convencer Israel e a Síria a estabelecer uma rede de segurança comum, então só nos resta esperar que a próxima guerra entre eles não venha muito em breve."
 arm_levon.16.a: "Ruim!"
