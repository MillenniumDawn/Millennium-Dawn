 module_naval_sub_vls_cells_4: "VLS para submarinos (4 celdas)"
 module_naval_sub_vls_cells_4_desc: "Tubos de lanzamiento vertical instalados en el casco del submarino. El número de celdas determina la capacidad de lanzamiento: más celdas aumentan proporcionalmente la carga de munición de misiles instalada a cambio de un mayor coste y desplazamiento.\n\n§GConsejo de diseño: Las celdas VLS para submarinos multiplican las estadísticas de combate en el rol de misiles del sumergible. Los bancos más grandes proporcionan más potencia de fuego de misiles, pero añaden más capacidad industrial (IC), mano de obra, uso de combustible y visibilidad de submarinos.§!"
