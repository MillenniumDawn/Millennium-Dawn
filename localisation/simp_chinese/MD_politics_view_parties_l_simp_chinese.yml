 PER.Nat_Autocracy_political: "£PER_military_junta  (OPP) - 秩序与进步党"
 PER.Nat_Autocracy_political_desc: "（伊朗民族主义）- 秩序与进步党\n\n秩序与进步党是伊朗军方的政治分支。秩序与进步党的成立是为了将直接军事领导权与政治分开，旨在重振伊朗的利益，并将伊朗的影响力更广泛地投射到该地区。"
 BDA.Mod_Vilayat_e_Faqih: "£TAJ_non_aligned_moderate_islamist (LBS) - 巴达赫尚的红宝石"
 BDA.Mod_Vilayat_e_Faqih_desc: "（调和伊斯兰主义） - 成立于1991年苏联解体之际的巴达赫尚人民党是一个代表什叶派帕米尔人（也称巴达赫尚人）的组织。该组织活跃于塔吉克斯坦反对派，并参与了塔吉克斯坦内战。其意识形态与传统的伊斯兰保守主义相符，但主要以巴达赫尚政党的面貌示人。"
 TAJ.Mod_Vilayat_e_Faqih: "£TAJ_non_aligned_moderate_islamist (LBS) - 巴达赫尚的红宝石"
 TAJ.Mod_Vilayat_e_Faqih_desc: "（调和伊斯兰主义） - 成立于1991年苏联解体之际的巴达赫尚人民党是一个代表什叶派帕米尔人（也称巴达赫尚人）的组织。该组织活跃于塔吉克斯坦反对派，并参与了塔吉克斯坦内战。其意识形态与传统的伊斯兰保守主义相符，但主要以巴达赫尚政党的面貌示人。"
 TAJ.Neutral_Communism: "£TAJ_emerging_communism (CPT) - 塔吉克斯坦共产党"
 TAJ.Neutral_Communism_desc: "（马克思列宁主义） - 塔吉克斯坦共产党\n\n作为塔吉克斯坦第一个也是历史最悠久的政党，塔吉克斯坦共产党建立在民主集中制思想之上，其政治观点与其他后苏联时代的共产党相似。该党在国际共产主义舞台上十分活跃，并与许多党外组织保持着密切联系。该党隶属于苏联共产党（苏维埃社会主义共和国联盟）。"
 TAJ.Nat_Populism2: "£TAJ_emerging_reactionary (TNP) - 塔吉克民族党"
 TAJ.Nat_Populism2_desc: "（专制民族主义） - 塔吉克民族党\n\n在埃莫马利·拉赫蒙的领导下，塔吉克斯坦民族党以铁腕统治着塔吉克斯坦。由于该党在塔吉克斯坦的主导地位，试图推翻政府的反对派运动在塔吉克斯坦各地如雨后春笋般涌现。该党主要致力于恢复塔吉克文化、身份和国家地位。埃莫马利·拉赫蒙领导下的该党严格限制伊斯兰教习俗，试图使塔吉克斯坦世俗化，采取了禁止蓄胡须和为希望戴头巾的女性制定着装规范等措施。最近，该党与塔吉克斯坦民主党合并，倾向于泛伊朗身份。"
 TAJ.Nat_Populism: "£TAJ_western_conservative (DPT) - 塔吉克斯坦民主党"
 TAJ.Nat_Populism_desc: "\n(£PER_Nat_Populism_small 泛伊朗主义/塔吉克民族主义)\n\n塔吉克斯坦民主党\n\n塔吉克斯坦民主党由马哈马德鲁齐·伊斯坎达罗夫于1990年创立，是一个世俗民族主义政党，在塔吉克内战中与埃莫马利·拉赫蒙交战。该党秉持自由主义理想，同时也在倡导伊朗领土统一的同时宣扬民族主义观点。该党对伊朗和阿富汗兴起的伊斯兰政府和运动持负面看法，甚至与这些国家的泛伊朗主义运动举行过会谈。"
 GER.anarchist_communism_alt: "£GER_non_aligned_socialist_democrat 左翼党"
 GER.anarchist_communism_icon_alt: "£GER_non_aligned_socialist_democrat"
 GER.anarchist_communism_desc_alt: "左翼激进派 - 左翼党是前东德执政党德国统一社会主义党的直系后裔，该党与其他左翼民主社会主义政党合并，以扩大其在东德据点之外的选民基础。左翼党将增加福利支出等左翼政策与民粹主义言论相结合。他们希望德国脱离北约，并希望将俄罗斯纳入欧洲安全框架。"
 GER.Nat_Autocracy_alt: "£GER_nationalist_military_junta 联邦国防军"
 GER.Nat_Autocracy_icon_alt: "£GER_nationalist_military_junta"
 GER.Nat_Autocracy_desc_alt: ""
 BLR.Western_Autocracy: "£BLR_western_autocracy (BPF) - 白俄罗斯人民阵线"
 BLR.Western_Autocracy_icon: "£BLR_western_autocracy"
 BLR.Western_Autocracy_desc: "（民族保守主义）- 白俄罗斯人民阵线\n\n白俄罗斯人民阵线党是白俄罗斯人民阵线的政治继承者，后者是带领白俄罗斯走向独立的民族民主运动。该党主张保护白俄罗斯语言和文化，发展市场经济，退出联盟国家，最终加入欧盟和北约，并且实际上将卢卡申科的统治视为俄罗斯的保护国。\n\n它与欧洲保守派和改革派以及国际民主联盟结盟。它的影响力在于知识分子、白俄罗斯语文化界以及在流亡者中的道德地位。该组织于2023年被国家解散，目前以未注册状态继续运作。"
 BLR.socialism_icon: "£BLR_western_socialism"
 BLR.socialism_alt: "£BLR_western_socialism_1 (BSDP-H) - 白俄罗斯社会民主党（大会）"
 BLR.socialism_alt_icon: "£BLR_western_socialism_1"
 BLR.socialism_alt_desc: "（社会民主主义）- 白俄罗斯社会民主党（大会）\n\n大会党是人民赫拉马达党的注册继承者，在司法部拒绝承认米卡莱·斯塔特克维奇的领导地位后，于2005年以新名称重新注册。该党主张建立欧洲式福利国家、混合经济、自由选举，并最终加入欧盟，同时与俄罗斯保持工作关系。亚历山大·卡祖林于2006年担任该党主席，伊哈尔·巴里萨乌自2018年起担任主席。\n\n它是欧洲社会党的成员。它的影响力来自于其西方社会民主党盟友以及规模不大的区域分支机构网络。该党于2023年被国家解散，其领导层目前流亡海外。"
 BLR.Conservative_bela: "£BLR_Conservative_1 (Belaya Rus) - 白俄罗斯党"
 BLR.Conservative_bela_icon: "£BLR_Conservative_1"
 BLR.Conservative_bela_desc: "（威权主义总统制）- 白俄罗斯党\n\n白俄罗斯党是由同名的效忠卢卡申科的公共协会发展而来。该协会成立于2007年，旨在团结国家雇员支持总统，并在2023年清洗反对派后转型为政党。白俄罗斯党主张卢卡申科的路线，建立强大的国家，推行苏联福利模式，维护斯拉夫民族团结，并与俄罗斯建立联盟国家。该党在议会和地方议会中安插了大量官员、经理和教师。\n\n它的影响力在于创建它的国家机器、来自公共部门的大量成员以及2023年后对合法政治的垄断。"
 BLR.Neutral_Autocracy: "£BLR_neutral_autocracy (BAP) - 白俄罗斯农业党"
 BLR.Neutral_Autocracy_icon: "£BLR_neutral_autocracy"
 BLR.Neutral_Autocracy_desc: "（农业主义）- 白俄罗斯农业党\n\n农业党代表集体农场负责人和农村行政官员，他们是国家农业部门的中坚力量。该党主张国家扶持集体农场、保障价格和提供农村社会服务。2000年，在原领导层被排挤出局后，该党由反对派转变为效忠派。在农业部长兼副总理米哈伊尔·鲁西的领导下，该党成为农业部的延伸机构。\n\n它与俄罗斯农业企业保持着密切联系，并倾向于将白俄罗斯食品出口推向联盟国家市场。它的影响力在于国家通过集体农场控制的农村选票。该组织于2023年解散。"
 BLR.Neutral_Libertarian: "£BLR_neutral_libertarian (PSP) -  自由进步党"
 BLR.Neutral_Libertarian_icon: "£BLR_neutral_libertarian"
 BLR.Neutral_Libertarian_desc: "（自由主义）- 自由进步党\n\n自由进步党是由前议员乌拉季米尔·纳瓦西亚德创立的小型自由主义政党，成立于2003年，此后四次被拒绝注册。该党主张自由市场、低税收、私有财产、公民自由，并支持白俄罗斯加入欧盟，认为经济自由带来政治自由。该党主要通过青年组织“公民论坛”和欧洲自由主义联盟开展工作，而非通过群众组织。\n\n2013年，它以附属党的身份加入了欧洲自由民主联盟。它的影响力在于其欧洲伙伴以及一批经济学家和年轻专业人士，而不是选票。"
