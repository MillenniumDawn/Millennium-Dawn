l_english:
 civil_war_support.1.t: "[From.GetName] Asks for Support"
 civil_war_support.1.d_fsa: "Envoys of the Free Syrian Army have spent ten days in our capital. They say the regime's army is breaking apart and that a few shipments of rifles, anti-tank weapons, and air defenses would let them hold the towns they have taken. Damascus will notice whatever we decide."
 civil_war_support.1.d_syr: "Damascus has sent a delegation asking for weapons and money to put down the rebellion. The Syrian government says the uprising is foreign-backed terrorism and that its fall would hand the country to extremists. The rebels and their backers will notice whatever we decide."
 civil_war_support.1.d_roj: "Envoys from the Kurdish north have come to our capital. Their militias hold the line against the jihadists and the regime alike, and they ask for weapons, money, and trainers to keep it. Ankara will notice whatever we decide."
 civil_war_support.1.d_somali: "Envoys of [From.GetNameDef] have come asking for weapons and money to hold their ground in Somalia's long civil war. They say a few shipments now will keep their rivals and the Islamist militias out of the towns they hold. Those rivals have friends abroad who will notice whatever we decide."
 civil_war_support.1.d: "Envoys of [From.GetNameDef] have come asking for weapons and money for their war. Their enemies will notice whatever we decide."
 civil_war_support.1.a: "Send weapons"
 civil_war_support.1.b: "Send money"
 civil_war_support.1.c: "Send military advisors"
 civil_war_support.1.e: "Decline"
 civil_war_support.2.t: "[From.GetName] Sends Support"
 civil_war_support.2.d: "[From.GetNameDefCap] has answered our appeal. The first deliveries are already on their way."
 civil_war_support.2.a: "Our friends have not forgotten us"
 civil_war_support.3.t: "[From.GetName] Refuses Our Appeal"
 civil_war_support.3.d: "[From.GetNameDefCap] has declined to help. Our envoys can try again in a few months."
 civil_war_support.3.a: "We will remember this"
 civil_war_support_offer_tt: "They send §Y1,500§! rifles, §Y100§! anti-tank weapons, and §Y30§! air defense systems, §Y$$2 billion§!, or military advisors for §Y180§! days."
 civil_war_foreign_advisors: "Foreign Military Advisors"
 civil_war_foreign_advisors_desc: "Officers sent by a foreign backer train our recruits, plan our offensives, and teach our commanders to fight a modern war."
 somali_faction_request_foreign_support: "Ask [From.GetNameDef] for Support"
 somali_faction_request_foreign_support_desc: "Our envoys will spend ten days pressing [From.GetNameDef] for weapons, money, or military advisors. They may refuse, and they will not hear a second appeal for three months."
