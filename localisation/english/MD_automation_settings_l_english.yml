l_english:
 AUTOMATION_SETTINGS_OPEN_TT: "Open Automation Settings"
 AUTOMATION_SETTINGS_TITLE: "Automation Settings"
 AUTOMATION_SETTINGS_DESC: "Manage recurring actions and notification preferences from one panel. Existing controls elsewhere remain available."
 AUTOMATION_SETTINGS_NOTIFICATIONS_HEADER: "Notifications and Preferences"
 AUTOMATION_SETTINGS_ECONOMY_HEADER: "Economy"
 AUTOMATION_SETTINGS_UN_HEADER: "United Nations"
 AUTOMATION_SETTINGS_DIPLOMACY_HEADER: "Diplomacy"

 AUTOMATION_SETTINGS_CORRUPTION: "Automatically Decline Corruption Offers"
 AUTOMATION_SETTINGS_CORRUPTION_TT: "Skip corruption offers automatically. The events and their possible rewards will not appear while this is enabled."
 AUTOMATION_SETTINGS_FOREIGN_ELECTION: "Foreign Election Notifications"
 AUTOMATION_SETTINGS_FOREIGN_ELECTION_TT: "Show news notifications about elections in other countries."
 AUTOMATION_SETTINGS_RAID_NOTIFICATIONS: "Influence Raid Notifications"
 AUTOMATION_SETTINGS_RAID_NOTIFICATIONS_TT: "Show events about influence raids between other countries. Raids against us will still be reported if this is disabled."
 AUTOMATION_SETTINGS_INFLUENCE_REPORT: "Monthly Auto-Influence Report"
 AUTOMATION_SETTINGS_INFLUENCE_REPORT_TT: "Show the monthly report listing countries affected by automatic influence."

 AUTOMATION_SETTINGS_INVESTMENT_REJECTION: "Automatically Reject Investment Offers"
 AUTOMATION_SETTINGS_INVESTMENT_REJECTION_TT: "Reject every incoming international investment offer automatically."
 AUTOMATION_SETTINGS_REINVESTMENT: "International Investment Reinvestment"
 AUTOMATION_SETTINGS_REINVESTMENT_TT: "Choose how weekly returns from international investments are divided between the treasury and reinvestment."
 AUTOMATION_SETTINGS_REINVEST_OFF: "Off"
 AUTOMATION_SETTINGS_REINVEST_OFF_TT: "Send all international investment returns to the treasury."
 AUTOMATION_SETTINGS_REINVEST_FULL: "Full"
 AUTOMATION_SETTINGS_REINVEST_FULL_TT: "Reinvest all international investment returns."
 AUTOMATION_SETTINGS_REINVEST_SPLIT: "Split"
 AUTOMATION_SETTINGS_REINVEST_SPLIT_TT: "Send half of international investment returns to the treasury and reinvest the other half."
 AUTOMATION_SETTINGS_FUEL_PURCHASE: "Automatic Fuel Purchase"
 AUTOMATION_SETTINGS_FUEL_PURCHASE_TT: "Purchase fuel immediately, then check every 28 days and purchase again whenever fuel reserves fall below 20 percent. Disable this to cancel future purchases."

 AUTOMATION_SETTINGS_SC_VOTE: "Security Council Default Vote"
 AUTOMATION_SETTINGS_SC_VOTE_TT: "Select how we vote automatically on Security Council resolutions. Click the selected option again to return to manual voting."
 AUTOMATION_SETTINGS_GA_VOTE: "General Assembly Default Vote"
 AUTOMATION_SETTINGS_GA_VOTE_TT: "Select how we vote automatically on General Assembly resolutions. Click the selected option again to return to manual voting."
 AUTOMATION_SETTINGS_VOTE_YES: "Yes"
 AUTOMATION_SETTINGS_VOTE_NO: "No"
 AUTOMATION_SETTINGS_VOTE_ABSTAIN: "Abstain"
 AUTOMATION_SETTINGS_SC_ACCEPT_TT: "Vote Yes automatically on every Security Council resolution."
 AUTOMATION_SETTINGS_SC_REJECT_TT: "Vote No automatically on every Security Council resolution. Permanent members will cast a veto when applicable."
 AUTOMATION_SETTINGS_SC_ABSTAIN_TT: "Abstain automatically from every Security Council resolution."
 AUTOMATION_SETTINGS_GA_ACCEPT_TT: "Vote Yes automatically on every General Assembly resolution."
 AUTOMATION_SETTINGS_GA_REJECT_TT: "Vote No automatically on every General Assembly resolution."
 AUTOMATION_SETTINGS_GA_ABSTAIN_TT: "Abstain automatically from every General Assembly resolution."

 AUTOMATION_SETTINGS_SATELLITE_REJECTION: "Block AI Satellite Access Offers"
 AUTOMATION_SETTINGS_SATELLITE_REJECTION_TT: "Prevent AI countries from offering shared access to their military and civilian satellite systems. Human players can still send offers."
