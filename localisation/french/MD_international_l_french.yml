 un_sc_embargo: "Embargo sur les armes"
 un_sc_embargo_tt: "Les nations qui ont généré de la §Rtension mondiale§! ou qui sont en guerre peuvent être ciblées par un §Yembargo sur les armes§!. Cela leur interdira d'acheter ou de vendre des armes et de l'équipement sur le §Ymarché international§!, ainsi que d'interdire le §Yprêt-bail§! à la nation ciblée. Les nations qui violent l'§Yembargo sur les armes§! seront §Rsanctionnées§!"
