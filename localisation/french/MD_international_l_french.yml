 IS_state_recognition_button_text_tt: "Ouvre l'écran de §YReconnaissance d'état§!. Ici, nous pouvons reconnaître des états comme nations indépandantes, ainsi qu'aider d'autres pays dans leurs campagnes de reconnaissance."
 recognition_category_desc: "Plusieurs états non reconnus cherchent à rejoindre la communauté internationale. Nous devons décider si nous souhaitons soutenir leurs campagnes. S’ils obtiennent suffisamment de soutien de la part des membres de l’ONU, ils pourraient être admis aux Nations Unies, mettant ainsi fin à leur statut d'état non reconnu et aux désavantages qui y sont liés. Pour les états que nous avons déjà reconnus, nous pouvons aller plus loin en encourageant d'autres membres de l'ONU à les reconnaître également."
