l_korean:
 expected_social_spending: "§C복지§!"
 expected_health_spending: "§C보건의료§!"
 expected_adm_spending: "§C행정§!"
 expected_edu_spending: "§C교육§!"
 expected_police_spending: "§C치안§!"
 expected_defence_spending: "§C국방§!"
 protests_main_text: "아래 격자망은 국민들이 기대하는 수준과 현재 지원 중인 예산 수준을 보여줍니다. 붉은색 격차는 시위 변동치를 증가시키며, 이 격차를 해소하는 것이 긴장을 완화하는 가장 확실한 방법입니다.[fuel_protests_TT]\n"
 OPEN_PROTESTS_BUTTON: "§Y시위 시스템§! 화면 열기"
 OPEN_PROTESTS_BUTTON_TT: "§Y시위 시스템§! 패널을 엽니다. 월간 변동치 요인, 현재 시위 강도 및 과격화 수준, 국민들이 기대하는 예산 지출 수준을 확인합니다."
 PROTEST_TITLE: "§Y시위 시스템§!"
 CLOSE_PROTEST_SCREEN: "§Y시위 시스템§! 화면 닫기"
 expected_social_spending_tt: "국민은 현행 법률, 국민정신, 기술 및 1인당 GDP에 따라 결정되는 수준의 §Y복지 지출§!을 기대합니다. 각 정수는 1단계를 나타내며, 해당 분류에서 채택 가능한 법률 수준이 상한선이 됩니다.\n\n§Y기대 수준:§! §Y[expected_social_spending_law_name]§! (현재: [?expected_welfare_spending|0Y])\n\n§Y세부 구성§!\n법률, 국민정신, 기술: [?ROOT.modifier@expected_welfare_modifier]\n1인당 GDP: [calculate_gdp_c_modifier_welfare_spending]\n"
 expected_health_spending_tt: "국민은 현행 법률, 국민정신, 기술 및 1인당 GDP에 따라 결정되는 수준의 §Y보건의료 지출§!을 기대합니다. 각 정수는 1단계를 나타내며, 해당 분류에서 채택 가능한 법률 수준이 상한선이 됩니다.\n\n§Y기대 수준:§! §Y[expected_healthcare_spending_law_name]§! (현재: [?expected_health_spending|0Y])\n\n§Y세부 구성§!\n법률, 국민정신, 기술: [?ROOT.modifier@expected_healthcare_modifier]\n1인당 GDP: [calculate_gdp_c_modifier_healthcare_spending]\n"
 expected_adm_spending_tt: "국민은 현행 법률, 국민정신, 기술 및 1인당 GDP에 따라 결정되는 수준의 §Y행정 지출§!을 기대합니다. 각 정수는 1단계를 나타내며, 해당 분류에서 채택 가능한 법률 수준이 상한선이 됩니다.\n\n§Y기대 수준:§! §Y[expected_bureau_spending_law_name]§! (현재: [?expected_adm_spending|0Y])\n\n§Y세부 구성§!\n법률, 국민정신, 기술: [?ROOT.modifier@expected_adm_modifier]\n1인당 GDP: [calculate_gdp_c_modifier_adm_spending]\n"
 expected_edu_spending_tt: "국민은 현행 법률, 국민정신, 기술 및 1인당 GDP에 따라 결정되는 수준의 §Y교육 지출§!을 기대합니다. 각 정수는 1단계를 나타내며, 해당 분류에서 채택 가능한 법률 수준이 상한선이 됩니다.\n\n§Y기대 수준:§! §Y[expected_education_spending_law_name]§! (현재: [?expected_edu_spending|0Y])\n\n§Y세부 구성§!\n법률, 국민정신, 기술: [?ROOT.modifier@expected_education_modifier]\n1인당 GDP: [calculate_gdp_c_modifier_education_spending]\n"
 expected_police_spending_tt: "국민은 현행 법률, 국민정신, 기술 및 1인당 GDP에 따라 결정되는 수준의 §Y치안 지출§!을 기대합니다. 각 정수는 1단계를 나타내며, 해당 분류에서 채택 가능한 법률 수준이 상한선이 됩니다.\n\n§Y기대 수준:§! §Y[expected_police_spending_law_name]§! (현재: [?expected_police_spending|0Y])\n\n§Y세부 구성§!\n법률, 국민정신, 기술: [?ROOT.modifier@expected_police_modifier]\n1인당 GDP: [calculate_gdp_c_modifier_police_spending]\n"
 expected_defence_spending_tt: "국민은 현행 법률, 국민정신, 기술 및 1인당 GDP에 따라 결정되는 수준의 §Y국방 지출§!을 기대합니다. 각 정수는 1단계를 나타내며, 해당 분류에서 채택 가능한 법률 수준이 상한선이 됩니다.\n\n§Y기대 수준:§! §Y[expected_mil_spending_law_name]§! (현재: [?expected_military_sp|0Y])\n\n§Y세부 구성§!\n법률, 국민정신, 기술: [?ROOT.modifier@expected_mil_modifier]\n1인당 GDP: [calculate_gdp_c_modifier_military_spending]\n"
 expected_law_mechanic_tt: "§Y예산 격자망 읽는 법§!\n"
 EL_green_square_explanation_tt: "§G녹색§!: §g국민에게 실제로 지급되고 있는 기대 예산입니다. 녹색 사각형 하나마다 국민이 시위에 나설 원인이 하나씩 줄어듭니다.§!"
 EL_blue_square_explanation_tt: "§B파란색§!: §g국민이 현재 기대하는 수준을 초과하여 지출 중인 예산입니다. 매달 재정이 소모되지만 추가적인 시위 완화 효과는 제공하지 않습니다.§!"
 EL_red_square_explanation_tt: "§R빨간색§!: §g정부가 제공하지 §R못하고 있는§! 기대 예산입니다. 빨간색 사각형마다 상단의 변동치 내역에 있는 §Y예산 지출 영향§! 항목을 악화시킵니다.§!"
 EL_white_square_explanation_tt: "흰색: §g기대치에도 미치지 않고 예산도 투입되지 않은 법률 단계입니다. 국민의 기대치가 이를 요구할 만큼 높아질 때까지 비활성 상태로 유지됩니다.§!"
 MD_protests_state_calm_text: "§G평온§!: 진행 중인 소요 임무가 없습니다."
 MD_protests_state_calm_tt: "경고나 반란 임무가 활성화되지 않은 상태입니다. 이 패널은 §Y시위 강도§!가 20을 넘으면 계속 표시됩니다. 위기가 발생하기 전에 증가하는 변동치에 대응해야 합니다."
 MD_protests_state_warning_text: "§Y경고§!: 시위 운동이 조직되고 있습니다."
 MD_protests_state_warning_tt: "§Y시위 임박§! 임무가 활성화되어 있습니다. 제한 시간이 지나면 수도가 아닌 핵심 주에서 소요 사태가 시작됩니다. 경고를 유발한 경제적·정치적 상황을 안정시켜 해결하거나, §Y시위대 유화§! 및 §Y선제적 개혁§!을 통해 시간을 벌고 강도를 낮출 수 있습니다."
 MD_protests_state_revolt_text: "§R반란§!: 핵심 주에서 저항이 일어나고 있습니다."
 MD_protests_state_revolt_tt: "§Y반란 임박§! 임무가 활성화되어 있습니다. 매달 새로운 비수도 지역이 합류할 수 있으며, 그 확률은 현재 §Y시위 강도§!에서 §Y시위 피로도§!를 뺀 값(최대 §Y75%§!)과 같습니다. 피로도는 활성화된 매달 §G5§!포인트씩 증가합니다. 영향을 받는 주는 §Y순응도 50%§! 이상 및 §Y저항도 40%§! 미만을 달성하면 정상화됩니다. 시위 강도를 §G0§!으로 §Y60일§! 동안 유지하면 반란이 종식됩니다. 만약 강도가 0을 초과한 상태에서 주 임무 시간이 만료되면, 해결되지 않은 주와 과격화 수치에 따라 국가의 §Y10%§!에서 §Y50%§!를 집어삼키는 내전이 발발하게 됩니다."
 MD_protests_state_cooldown_text: "§B휴지기§!: 위기에서 회복 중입니다."
 MD_protests_state_cooldown_tt: "시위 위기 이후의 회복 기간입니다. §Y1000§!일 동안 새로운 시위 임무가 발동되지 않습니다. 압력이 다시 상승하기 전에 이 유예 기간을 활용해 지출 균형을 맞추고 안정도를 회복해야 합니다."
 MD_drift_diagnosed_text: "[MD_top_resistant_state_display]"
 MD_top_resistant_state_active: "§Y최악의 주:§! [event_target:MD_top_resistant_state_scope.GetName] (§R[?MD_top_resistant_state_value|0]%§!)"
 MD_top_resistant_state_none: "§Y최악의 주:§! §G없음§!"
 MD_drift_diagnosed_tt: "§Y저항도§!가 가장 높은 미해결 비수도 핵심 주입니다. 반란 디시전과 충분한 주둔군을 동원해 순응도를 §Y50%§!로 끌어올리는 동시에 저항도를 §Y40% 미만§!으로 억제해야 합니다.\n\n영향을 받은 모든 주가 진압되면 §G없음§!으로 표시됩니다."
 MD_drift_header_text: "§Y월간 변동 요인§! (직전 틱 기준)"
 MD_drift_spending_tt: "국민은 복지, 보건의료, 교육, 치안, 행정 및 국방 지출의 기본선을 기대합니다. 예산 지출이 미달하면 시위 강도가 상승하고, 과잉 지출하면 긴장은 완화되지만 국고가 고갈됩니다. 연료가 고갈되면 일괄적으로 §R+1§!이 추가됩니다.\n\n가장 큰 격차를 해소하려면 아래 예산 격자망에서 빨간색으로 표시된 법률을 상향해야 합니다. 예산 균형을 재조정하는 동안 §Y시위대 유화§!와 §Y선제적 개혁§!으로 시간을 벌 수 있습니다."
 MD_drift_stability_tt: "안정도가 §Y20%§! 미만으로 떨어졌음에도 정부가 여전히 선거를 치르고 있어 유권자들이 거리로 쏟아져 나오고 있습니다.\n\n안정도를 제공하는 중점과 이벤트를 통과시키고, 안정도를 깎아먹는 값비싼 군사 확충을 중단해야 합니다. §Y공약: 국민 감세§!는 300일 동안 §G+5%§!의 안정도 보정치를 제공하여 다른 모든 안정도 회복을 앞당겨 줍니다. 정치적 노선 변경이 가능하다면 비선거형 정부로 전환하여 이 요인을 완전히 제거할 수 있습니다."
 MD_drift_interest_tt: "중앙은행 기준금리가 §Y8.9%§!를 초과하고 있습니다. 대출 비용이 치솟고 기업들은 직원을 해고하며, 대중은 정부를 비난하게 됩니다.\n\n§Y통화§! 탭에서 금리를 인하해야 합니다. §G8.9%§! 미만으로 낮추면 이 요인이 완전히 사라집니다. 기준치를 초과할수록 매달 가해지는 타격이 커지므로, 금리 인상은 짧게 유지하고 인플레이션 억제 용도로만 제한해야 합니다."
 MD_drift_recession_tt: "경제가 경기 침체에 빠져 있습니다. 매달 평균 약 §R+3§!의 시위 강도 타격이 무작위로 추가됩니다.\n\n경제 시스템을 통해 §Y경기 침체§! 국민정신을 제거하면 이 요인을 완전히 없앨 수 있습니다. 경제 패널에서 회복 이벤트를 주시하면서, 최악의 시기를 넘기기 위해 §Y시위대 유화§! 및 §Y선제적 개혁§!에 기대어야 합니다."
 MD_drift_depression_tt: "경제가 경기 침체보다 더 가혹한 불황 상태에 빠져 있습니다. 매달 평균 약 §R+4§!의 시위 강도 타격이 무작위로 추가되며, 이는 경기 침체보다 약 3분의 1가량 더 혹독합니다.\n\n경제 시스템을 통해 §Y불황§! 국민정신을 제거하면 이 요인이 사라집니다. 목표를 달성할 수만 있다면 §Y공약: 감세§!와 §Y공약: 일자리 프로그램§!이 시위 압박을 낮춰 주며, §Y시위대 유화§!와 §Y선제적 개혁§!으로 시간을 벌 수 있습니다."
 MD_drift_war_tt: "전쟁이 §Y36§!개월 이상 지속되면서 국민들이 극심한 피로에 시달리고 있습니다. 전쟁이 24개월 더 길어질 때마다 매달 §R+1§!씩 추가됩니다. 4년 차 전쟁은 매달 §R+2§!, 6년 차 전쟁은 매달 §R+3§!에 달하며 상한선도 없습니다.\n\n전쟁을 끝내면 이 요인은 즉시 0으로 떨어집니다. 이미 반란이 시작되었다면 전쟁을 수습하는 동안 §Y민심 수습 캠페인§!을 통해 순응도를 끌어올려야 합니다."
 MD_drift_corruption_tt: "부패 국민정신이 활성화되어 있거나 선거가 유예된 상태에서 연립정부 지지율이 §Y30%§! 미만으로 떨어졌습니다. 연립정부가 약화될수록 타격은 더욱 커져, 지지율 §Y10%§!에서는 매달 §R+0.2§!, §Y20%§!에서는 매달 §R+0.1§!씩 발생합니다.\n\n반부패 중점과 이벤트를 통해 부패 국민정신 단계를 낮추어야 합니다. 하위 이념 협정을 통해 연립정부 지지율을 확보하고, 선거를 재개하면 이 요인이 완전히 사라집니다. §Y공약: 감세§!는 성공 시 §G+3%§!의 연정 지지율을 제공하므로 안정도가 반등하기 시작할 때 유용합니다."
 MD_drift_ct_tt: "인터넷 감시나 시위대 검거 정책이 활성화되어 있습니다. 강경 진압으로 인해 매달 평균 약 §R+5§!의 시위 강도 타격이 무작위로 발생하며, 이는 무작위 변동 요인 중 가장 가혹한 수준입니다.\n\n이 정책들은 단기적인 수단으로 기획된 것입니다. 진행 중인 임무가 끝나면 즉시 대테러(CT) 국민정신을 제거해야 하며, 그렇지 않으면 계속해서 피해가 누적됩니다. 위기가 진행 중일 때는 대테러 조치와 §Y공약: 경찰 긴급 자금 지원§!을 함께 사용하여 저항도 증가 억제 효과를 중첩시킬 수 있습니다."
 MD_drift_passive_tt: "대중의 관심은 점차 분산됩니다. 매달 §Y50%§!의 확률로 시위 강도가 자연스럽게 §G-2§!씩 감소하며, 연간 평균 약 §G-12§!의 자연 감소 효과를 얻게 됩니다.\n\n§Y시위대 유화§!와 §Y선제적 개혁§!으로 시간을 벌어 두면 이러한 자연 완화 효과가 대부분의 부담을 덜어 줍니다."
 MD_drift_total_text: "§Y지난달 순변동치:§!"
 MD_protests_strength_readout_text: "§Y강도:§! §Y[?protest_strength|0]§!§Y / 100   ·   과격화:§! §Y[?protest_radicalisation|0]§!§Y / 10§!"
 MD_protests_strength_readout_tt: "두 가지 지표가 시위의 전개 과정을 좌우합니다.\n\n§Y시위 강도§!(현재 [?protest_strength|0] / 100)는 국가가 위기에 얼마나 근접했는지를 나타냅니다. §Y50§!을 넘어서면 경고 임무가 발동될 수 있습니다. 반란이 시작되면 강도는 소요 사태가 확산될 확률만을 제어하게 됩니다. 이를 §G0§!으로 만든 뒤 §Y60일§! 동안 유지하면 반란이 종식됩니다.\n\n강도는 위에 표시된 변동 요인들로 인해 매달 상승하며, 자연 완화, §Y선제적 개혁§!, 공약 임무 성공 등을 통해 감소합니다.\n\n§Y시위 과격화§!(현재 [?protest_radicalisation|0] / 10)는 강도가 50 이상이거나 시위 임무가 활성화되어 있을 때 매달 §Y20%§!의 확률로 상승합니다. 그렇지 않은 경우에는 §Y10%§!의 확률로 하락합니다. 과격화 수치가 높을수록 반란 진압 실패 시 발발하는 내전의 규모가 커집니다."
 MD_drift_total_tt: "활성화된 모든 변동 요인과 자연 완화 수치를 합산한 값입니다. 양수이면 시위 강도가 상승 중임을, 음수이면 하락 중임을 의미합니다.\n\n순변동치를 음수로 전환하려면 위에 표시된 가장 큰 요인부터 해결해야 합니다. 근본적인 구조 개선이 정착될 때까지 §Y선제적 개혁§!과 §Y시위대 유화§!로 시간을 벌 수 있습니다.\n\n세 가지 §Y공약§! 디시전을 통해 200~350일 기한의 목표를 수락할 수 있습니다. 성공 시 반란 임무의 제한 시간이 늘어나지만, 실패하여 공약을 어기면 약간의 페널티가 부여됩니다. §Y공약: 경찰 긴급 자금 지원§!은 200일 동안 시위 강도를 §G10§! 낮추는 목표로 반란 임무 시간을 §G+75일§! 연장해 줍니다. §Y공약: 감세§!는 300일 동안 안정도를 §G5%§! 올리는 목표로 시간을 §G+100일§! 연장해 줍니다. §Y공약: 일자리 프로그램§!은 350일 동안 실업률을 §G1.5%§! 낮추는 목표로 시간을 §G+120일§! 연장해 줍니다."
 MD_protests_revolt_states_text: "§R여전히 저항 중인 핵심 주:§!"
 MD_protests_revolt_states_tt: "이 수치가 §G0§!에 도달하면 §Y반란 임박§! 임무가 완료됩니다. 영향을 받은 비수도 주는 §Y순응도 50%§! 이상 및 §Y저항도 40%§! 미만을 달성하면 자동으로 해제됩니다. 수도 주는 반란에 가담할 수 없습니다."
