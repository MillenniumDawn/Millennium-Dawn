 CHI_russian_arms_dependency_2: "$CHI_russian_arms_dependency$"
 CHI_russian_arms_dependency_2_desc: "The People's Liberation Army was built on Soviet and Russian designs. Its small arms began as the Type 56, a licensed Kalashnikov, and its armoured corps grew from the Type 59, a direct copy of the Soviet T-54A, with later tanks and infantry fighting vehicles still echoing T-72 and BMP lineage. The artillery, the transports and the air-defence batteries share the same ancestry. The dependence runs deepest in propulsion: the AL-31F powers the J-10 and J-11, the RD-93 flies the JF-17, and Su-35 fighters and S-400 batteries were bought outright from Moscow. Every domestic fighter line waits on a Russian turbine, every licensed pattern pays a royalty, and the design bureaus still copy more than they create. Until China forges its own military-industrial base, the army's heartbeat is set in Russia.\n§W--------------§!\nOur military self-sufficiency rises through defence industry focuses such as §Y$CHI_norinco_rationalism$§!, §Y$CHI_own_designs$§! and §Y$CHI_ws15_bottleneck_solve$§!, and through the §Y$CHI_invest_domestic_arms_lines$§! and §Y$CHI_localise_licensed_system$§! decisions. This national spirit will §GImprove§! once self-sufficiency passes §Y50§!."
