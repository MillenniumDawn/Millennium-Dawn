 SIA_strike_student_walkout: "학생들의 집단 이탈"
 SIA_strike_student_walkout_desc: "탐마삿 대학과 쭐랄롱꼰 대학의 학생들이 하루 전 통보로 강의실을 떠나 거리로 나옵니다. 태국 학생 운동에는 선례가 있습니다. 1973년 10월 봉기는 타놈 정부를 무너뜨렸고, 1976년 10월 탐마삿 학살은 뒤이은 민주 시기를 끝냈습니다. 캠퍼스 동원은 신속하고 준비가 거의 필요 없지만, 대학을 비우고 충돌 위험을 높입니다.\n\n§Y7일§! 동안 지속되며, 종료 후 §Y20일§! 뒤에 반복할 수 있습니다. 안정도 §R3%§!를 소모하며 30일 동안 연구 속도를 늦춥니다."
 SIA_strike_foreign_press: "외신 초청"
 SIA_strike_foreign_press_desc: "파업 위원회는 외국 특파원의 접근을 주선하여 도쿄, 런던, 뉴욕의 뉴스 방송에 바리케이드를 내보냅니다. 국제 보도가 군이 거리를 정리하는 것을 막지는 못하지만, 그렇게 하는 데 따른 외교적 비용을 높이고 결정을 지연시키는 경향이 있습니다. 같은 홍보는 이를 악용할 수 있는 정부들에게 왕국의 불안정을 광고하기도 합니다.\n\n§Y7일§! 동안 지속되며, 종료 후 §Y60일§! 뒤에 반복할 수 있습니다. 전쟁 지지도 §R3%§!를 소모하며 30일 동안 나라를 외세의 영향력에 노출시킵니다."
