l_simp_chinese:
 decision_category_energy: "能源决议组"
 decision_category_energy_desc: "\n£MAIN_desctext_energy \n\n\n\n§Y[ROOT.GetFlag]每个国家§!都需要维持一定水平的能源满足，以防止政府服务失能。如果§R不能§!维持经济不断增长造成的§Y能源需求§!，我们可能会承受无法忍受的§R后果§!和§R全面经济停摆§!。"
 HEADER_TEXT_TITLE: "§Y能源§!"
 energy_dynamic_modifier: "国家电网"
 energy_dynamic_modifier_TT: "该图表显示了化石燃料发电厂的燃料消耗总量和非电力来源的直接燃料消耗总量，以及如果发电量无法满足电力消耗而最终产生的负面影响。此外，它还会显示通过能源负荷共享机制从其他国家/地区共享或提供的能源。"
 no_fuel_penalties_modifier: "缺乏燃油惩罚"
 no_fuel_penalties_modifier_TT: "这个指标显示，如果一个国家消耗了全部的燃料储备，导致人民无燃料可用，将会产生的惩罚。"
 hydroelectric_infrastructure_in_state: "水电基础设施"
 hydroelectric_infrastructure_in_state_TT: "水力发电基础设施包括所有水力发电大坝、水库以及与水力发电相关的更多内容。状态中的修饰符包括产生的总能量以及它可以包含的存储量。它有助于您的总能源产生，因此有助于满足您的工业和人口能源消耗。"
 geothermal_infrastructure_in_state: "地热基础设施"
 geothermal_infrastructure_in_state_TT: "地热基础设施包括所有地热发电厂和类似的基础设施。它有助于您的总能源产生，因此有助于满足您的工业和人口能源消耗。"
 heavy_power_restrictions_spirit: "大量功率限制"
 some_power_restrictions_spirit: "适度功率限制"
 some_additional_consumption_spirit: "适度用电补贴"
 heavy_additional_consumption_spirit: "大量用电补贴"
 build_battery_park_effect_TT: "在[ROOT.GetNameWithFlag]最多可建造[?battery_park_builds_built|0+]§Y储能园区§!，数量受限于已拥有和控制状态下的地区的可用储能园区级别。（当前数目：[?number_of_battery_parks|Y0]）"
 has_nuclear_reactors_tt: "[THIS.GetNameWithFlag]拥有至少一个§Y$nuclear_reactor$§!（当前：[?nuclear_reactors|Y0]）"
 has_enrichment_facilities_tt: "[THIS.GetNameWithFlag]拥有至少一个§Y$enrichment_facility$§!\n"
 has_reactor_material_stockpile_tt: "[THIS.GetNameWithFlag]拥有至少5000公斤§Y武器级核材料§!（当前：[?THIS.var_reactor_material_stockpile|Y0]）\n"
 change_reactor_grade_material_effect_tt: "在[THIS.GetNameWithFlag]更改§Y反应堆级核材料§!数目[?change_resource|0+]（当前数目：[?THIS.var_reactor_material_stockpile|Y0]）\n"
 recently_bought_fuel_tt: "最近从市场购买了燃料。（剩余天数：[?recently_bought_fuel:days_left|0Y]）"
 energy_efficiency: "基础热力学应用"
 energy_efficiency_desc: "通过应用热力学原理的一些基本原理，可以立即减少工厂和办公楼的能源损失。"
 energy_efficiency2: "隔热应用"
 energy_efficiency2_desc: "国家能源成本的很大一部分来自建筑物的供暖和制冷。使用热隔离可以减少这些费用，使获得的能量可以用于其他地方。"
 energy_efficiency3: "先进的控制集成"
 energy_efficiency3_desc: "将一些基本算法集成到恒温器和控制系统中，可以进一步提高效率，从而节省一些额外的能源。"
 energy_efficiency4: "高密度隔离"
 energy_efficiency4_desc: "使用更现代的材料，可以提高隔离密度，甚至可以实现更高的节能效果。"
 energy_efficiency5: "热电发电机升级发电厂"
 energy_efficiency5_desc: "许多现代发电厂仍然依靠热量将水转化为蒸汽。尽管多年来这种方法已经变得更加高效，但它仍然产生大量废热。热电发电机可以灵活地使用，从废热中提取一些额外的电压。这反映在工厂燃料总成本的降低上面。"
 energy_efficiency6: "纳米纤维隔离器"
 energy_efficiency6_desc: "纳米纤维技术的最新发展使得一些迄今为止最先进和最密集的隔离技术得以使用。这将明显提高能源效率。"
 energy_efficiency7: "大规模热电发电机集成"
 energy_efficiency7_desc: "除了简单地正确隔离工厂和办公室之外，热电发电机还可用于回收即使通过最现代的热隔离也会损失的能量。"
 energy_efficiency8: "微型发电机"
 energy_efficiency8_desc: "在排气装置上安装小型发电机涡轮机，并通过窗户铺设热电线路，将能源回收提升到一个新的水平。"
 TOTAL_GENERATION_ENERGY: "§H总发电量§!：[?energy_sum|G2]GW"
 ENERGY_GENERATION_TOTAL_TT: "以下数值构成了能量产生来源的完整分解。§Y化石燃料发电厂§!如果发电量高于消耗量，则将闲置。闲置的§Y化石燃料发电厂§!不会消耗§Y燃料§!\n----------\n§Y化石燃料发电§!产出：[?fossil_pp_energy_generation|G2]GW\n§Y闲置化石燃料发电站的功率§!产出：[?free_fossil_powerplants_power|Y2]GW\n§Y水力发电§!产出：[?hydroelectric_energy_generation|G2] GW\n§Y地热发电§!产出：[?geothermal_energy_generation|G2]GW\n§Y核能发电§!产出：[?nuclear_energy_generation|G2]GW\n§Y太阳能和风能发电§!产出：[?renewable_energy_display_var|G2]GW\n§Y其他来源§!产出：[?other_energy_generation|G2]GW\n§Y从储能库提取§!：[?energy_withdrawal_from_storage|G2]GW\n\n----------\n§Y潜在的太阳能和风能发电§!产出：[?minimum_renewable_energy_var|+2]GW到[?maximum_renewable_energy_var|+2]GW\n§Y能源负荷共享§!所生成所有能源：[?energy_load_sharing_gain_var|G2]"
 TOTAL_CONSUMPTION_ENERGY: "§H总耗电量§!：[?energy_consumption|R2]GW"
 MISSING_FULFILLMENT_VALUE: "§H能耗缺口§!：[?unfulfilled_energy_demand_var|%+]"
 TOTAL_HOURLY_FUEL_CONSUMPTION_VALUES: "§Y化石燃料发电厂§!每日§Y燃料§!消耗：[?fossil_pp_fuel_display|0R]"
 TOTAL_HOURLY_POPULATION_FUEL_CONSUMPTION_VALUES: "§Y居民§!每日§Y燃料§!消耗量：[?non_electric_fuel_display|0R]"
 TOTAL_STORED_ENERGY: "存储能源：[?stored_energy|3Y]GWh于[?max_stored_energy|3Y]GWh最大存储量"
 OPEN_ENERGY_BUTTON: "打开§Y能源菜单§!界面"
 OPEN_ENERGY_BUTTON_TT: "这将打开§Y能源菜单§!，您可以在其中查看您所在国家的能源需求的消耗、发电和满足情况。"
 heavy_power_restrictions_button_tt: "§Y大功率限制§!\n我们的能源消耗速度超过了能源生产速度。一个可能的临时解决方案是迅速限制人口的电力消耗，直到我们能够开始建造更多的发电厂、可再生能源等来缓解这场日益严重的危机。对人民施加严格限制将导致经济增长、能源消耗和政治预测大幅下降。"
 heavy_power_restrictions_button_delayed_tt: "§Y先决条件：§!\n[!heavy_power_restrictions_button_click]"
 some_power_restrictions_button_tt: "§Y适当功率限制§!\n我们的能源消耗速度超过了能源生产速度。一个可能的临时解决方案是迅速限制人口的电力消耗，直到我们能够开始建造更多的发电厂、可再生能源等来缓解这场日益严重的危机。对民众施加一些限制将导致经济增长、能源消耗和政治预测的小幅下降。"
 some_power_restrictions_button_delayed_tt: "§Y先决条件：§!\n[!some_power_restrictions_button_click]"
 no_power_restrictions_button_tt: "§Y无功率限制§!\n对于我们国家的经济和我们党的政治安全来说，现状通常是最正常的情况。我们不限制人民消费，也不鼓励额外消费。"
 no_power_restrictions_button_delayed_tt: "§Y先决条件：§!\n[!no_power_rules_button_click]\n无消费策略修正。"
 some_additional_consumption_button_tt: "§Y适当额外能耗§!\n目前，我们为我们伟大的国家生产了过剩的能源。我们应该鼓励一些额外的消费，以利用我们过剩的生产。鼓励额外消费会给我们的建设速度和政治权力带来一点好处，同时也会少量增加我们人民的能源消耗。"
 some_additional_consumption_button_delayed_tt: "§Y先决条件：§!\n[!some_additional_consumption_button_click]"
 heavy_additional_consumption_button_tt: "§Y重度额外能耗§!\n目前，我们为我们伟大的国家生产了过剩的能源。我们应该鼓励一些额外的消费，以利用我们过剩的生产。鼓励大量额外消费将给我们带来巨大的建设速度和政治权力的红利，同时也会大幅增加我们人民的能源消耗。"
 heavy_additional_consumption_button_delayed_tt: "§Y先决条件：§!\n[!heavy_additional_consumption_button_click]"
 build_battery_park_button_tt: "§Y建造储能园区§!\n点击此按钮即可启动建设，建设资金由国库支付。每个§Y储能园区§!可储存§Y100GWh§!的过剩电力。在研究了§Y公用事业规模电池储能§!技术后，也可以在建造界面利用民用工厂建造储能园区§。"
 build_battery_park_button_delayed_tt: "§Y先决条件：§!\n[!build_battery_park_button_click_enabled]\n§Y效果：§!\n[!build_battery_park_button_click]\n我们可以通过 £key_shift + £click_left §YShift+左键点击§!一次性将一组§Y三座储能园区§!排入建造队列。\n§Y先决条件：§!\n[!build_battery_park_button_shift_click_enabled]\n§Y效果：§!\n[!build_battery_park_button_shift_click]"
 buy_fuel_for_money_button_tt: "§Y从市场购买燃料§!\n世界各地的一些供应商正在以金钱方式提供燃料。购买燃料可以帮助我们的化石燃料发电厂和我们的军队在紧要关头维持运转。"
 buy_fuel_for_money_button_delayed_tt: "§Y先决条件：§!\n[!buy_fuel_for_money_button_click_enabled]\n§Y效果：§!\n[!buy_fuel_for_money_button_click]\n按下 £key_shift + £click_left §YShift+左键点击§!来设置在燃料库存低时自动购买§Y燃料§!的队列。"
 renewable_capacity_factor_dyn_mod: "§Y[?THIS.modifier@state_renewable_capacity_factor_modifier]§!"
 renewable_capacity_factor_dyn_mod_TT: "§Y[THIS.GetName]§!是一个§Y可再生能源热点§!地区，拥有有利于可再生能源发电的条件，例如稳定的强风或高于平均水平的年日照量。\n\n可再生能源系数越高，该地区可再生能源园区每周为地区所有者生产的能源就越多。"
 TOTAL_CONSUMPTION_ENERGY_TT: "以下数值构成了能源消耗来源的完整细分。\n----------\n§Y人口能源§!消耗：[?population_energy_use_display_var|R2]GW\n季节性人口需求:[?energy_seasonal_population_demand_factor|%0R]\n§Y所有建筑能源§!消耗：[?energy_use_buildings_total_display_var|R2]GW\n:§Y其他能源§!消耗：[?other_energy_use_display_var|R2]GW\n----------\n§Y按类型划分的建筑能耗：§!\n§Y民用工厂能源§!消耗：[?energy_use_civs_total_display_var|R2]GW\n§Y办公园区能源§!消耗：[?energy_use_offices_total_display_var|R2]GW\n§Y军用工厂能源§!消耗：[?energy_use_mils_total_display_var|R2]GW\n§Y海军船坞能源§!消耗：[?energy_use_dockyards_total_display_var|R2]\n§Y商业化农业区能源§!消耗：[?energy_use_agriculture_district_total_display_var|R2]GW\n§Y微芯片工厂能源§!消耗：[?energy_use_microchip_plant_total_display_var|R2] GW\n§Y复合材料工厂能源§!消耗：[?energy_use_composite_plant_total_display_var|R2] GW\n§Y合成精炼厂能源§!消耗：[?energy_use_synthetic_refinery_total_display_var|R2] GW\n\n"
 MISSING_FULFILLMENT_VALUE_TT: "该值是我们目前尚未满足的所需§Y能源需求§!的百分比。\n\n§Y需求未满足的影响§!\n£construction_speed_texticon 建造速度：[?unfulfilled_energy_demand_dynmod_var|+%]\n£research_speed_texticon 研究速度：[?unfulfilled_energy_demand_dynmod_var|+%]\n£tax_gain_multiplier_modifier_texticon §Y税收收入§!乘数：[?unfulfilled_energy_demand_dynmod_var_3|+%]\n£factory_output_texticon 工厂产出：[?unfulfilled_energy_demand_dynmod_var|+%]\n£dockyard_output_texticon 船坞产出：[?unfulfilled_energy_demand_dynmod_var|+%]\n£stability_texticon 稳定度：[?unfulfilled_energy_demand_dynmod_var_2|+%]"
 TOTAL_HOURLY_FUEL_CONSUMPTION_VALUES_TT: "该值代表我们所有启用的§Y化石燃料发电厂§!每天消耗的燃料总量。当您的总发电量大于总消耗量时，§Y化石燃料发电厂§!开始闲置。\n\n§Y修正§!：\n法案，国家精神和科技对§Y化石燃料发电厂燃料§!消耗的影响：[?modifier@fossil_pp_fuel_consumption_modifier|-%]"
 TOTAL_HOURLY_POPULATION_FUEL_CONSUMPTION_VALUES_TT: "该值代表我们所有§Y人口§!每天消耗的燃料总量。\n\n§Y修正§!：\n法案，国家精神和科技对§Y非电力燃料§!消耗的影响：[?modifier@non_electric_fuel_consumption_modifier|-%]\n季节性人口需求:[?energy_seasonal_population_demand_factor|%0R]\n\n12月至次年2月以及6月至8月期间，人口用电和非电力燃料需求增加20%。季节性需求在其他修正因素之后应用，并根据每周能源计算进行更新。"
 TOTAL_STORED_ENERGY_TT: "这显示了我们当前存储的多余能量以及我们能够容纳的最大能量。我们可以通过建设额外的§Y储能园区§!获得更多§Y能源最大存储量§!。"
 NET_ENERGY_BALANCE: "§H净能源结余§!：[energy_total_net_energy_balance]"
 NET_ENERGY_BALANCE_TT: "§H总能源结余§!的值是§H总能源产生量§!除以§H总能源消耗量§!的相对值，以百分比显示§H净能源结余§!。"
 TOTAL_ENERGY_MISC_VALUE_HEADER: "燃料消耗"
 TOTAL_WEEKLY_NUCLEAR_MATERIAL_PRODUCTION: "每周§Y核燃料§!净§G生产§!：[?net_nuclear_fuel_display|0+]公斤"
 TOTAL_WEEKLY_NUCLEAR_MATERIAL_PRODUCTION_TT: "该值代表我们的§Y核反应堆§!每周净生产的§Y反应堆级材料§! 。该值是§Y反应堆级材料§!每周产量与消费量的差值。\n\n§Y反应堆级材料库存§!：£GFX_nuclear_material_texticon §G[?var_reactor_material_stockpile]§!公斤\n§Y每周反应堆级材料产量§!：[?total_nuclear_reactor_fuel_production|G2]公斤\n§Y每周消耗反应堆级材料数量§!：[?nuclear_fuel_consumption|-2]公斤\n\n§Y修正§!：\n法案，国家精神和科技对§Y核反应堆燃料§!消耗的影响：[?modifier@nuclear_fuel_consumption_modifier|-%]"
 total_ffp_amount_tt: "这个数值代表了我们国家的§Y化石燃料发电厂§!的总数。"
 total_ffp_amount_tt_delayed: "§Y化石燃料发电厂§!是所有基于化石的热电能源的总称。 这些包括但不限于； 煤炭、天然气和石油。§Y化石燃料发电厂§!如果发电量高于消耗量，则将闲置。\n\n为该省提供：\n所需工人基础数量：§Y7.5K§!\n每个§Y化石燃料发电厂§!的基本GDP产出：$§Y1.7B§!\n基础能源获取：§G+2§! GW\n\n当前§Y单化石燃料发电厂发电量§!：[?fossil_pp_energy_per_plant_display|+2]GW"
 total_nuclear_reactor_amount_tt: "这个数值代表了我们国家的§Y核反应堆§!的总数。"
 total_nuclear_reactor_amount_tt_delayed: "这座建筑将核能转化为电能，在此过程中消耗了浓缩铀。\n\n为该省提供：\n所需工人基础数量：§Y115K§!\n每个§Y核反应堆§!的基本GDP产出：$§Y4B§!\n基础能源获取：§G+4§! GW\n\n当前§Y单反应堆发电量§!：[?nuclear_energy_per_reactor_display|+2]GW"
 total_renewable_energy_amount_tt: "这个数值代表了我们国家的§Y可再生能源基础设施§!的总数。"
 total_renewable_energy_amount_tt_delayed: "§Y可再生能源基础设施§!是所有可再生能源的总称。这些包括但不限于； 太阳能公园、风力涡轮机、生物燃料精炼厂、木炭厂、生物燃料发电厂等。因此，它使用可再生资源并用这些资源生产燃料。\n\n为该省提供：\n所需工人基础数量：§Y22.5K§!\n每个§Y可再生能源基础设施§!的基本GDP产出：$§Y2B§!\n基础能量获取：§G+0.5§! GW\n"
 total_fuel_silo_amount_tt: "这个数值代表了我国§Y战略资源储备§!的总数。"
 total_fuel_silo_amount_tt_delayed: "§Y战略资源储备§!是仓库、干式储存和其他§Y燃料§!类仓库的综合体。该建筑为您的国家提供了更多的§H燃料§!储存空间。"
 ENERGY_GENERATION_TOTAL_DELAYED_TT: "§Y修正§!：\n法律，理念，科技对§Y全部发电产出§!影响：[?modifier@energy_gain_multiplier|+%]\n法律，理念，科技对§Y可再生能源发电产出§!影响：[?modifier@renewable_energy_gain_multiplier|%+]\n法律，理念，科技对§Y化石燃料发电§!影响：[?modifier@fossil_pp_energy_generation_modifier|%+]\n法律，理念，科技对§Y核能发电§!影响：[?modifier@nuclear_energy_generation_modifier|%+]\n\n"
 TOTAL_CONSUMPTION_ENERGY_DELAYED_TT: "§Y修正§!：\n法案，国家精神，科技对§Y所有动力能耗§!影响：[?modifier@energy_use_multiplier|-%]\n法案，国家精神，科技对§Y人口能耗§!影响：[?modifier@pop_energy_use_multiplier|-%]\n法案，国家精神，科技对§Y民用工厂能耗§!影响：[?modifier@energy_use_modifier_civs|-%]\n法案，国家精神，科技对§Y办公园区能耗§!影响：[?modifier@energy_use_modifier_offices|-%]\n法案，国家精神，科技对§Y军用工厂能源能耗§!影响：[?modifier@energy_use_modifier_mils|-%]\n法案，国家精神，科技对§Y海军船坞能源能耗§!影响：[?modifier@energy_use_modifier_dockyards|-%]\n法案，国家精神，科技对§Y商业化农业区能源§!影响: [?modifier@energy_use_modifier_agriculture_district|-%]\n法案，国家精神，科技对§Y微芯片工厂能源能耗§!影响：[?modifier@energy_use_modifier_microchip_plant|-%]\n法案，国家精神，科技对§Y复合材料工厂能源能耗§!影响：[?modifier@energy_use_modifier_composite_plant|-%]\n法案，国家精神，科技对§Y合成精炼厂能源能耗§!影响：[?modifier@energy_use_modifier_synthetic_refinery|-%]\n\n----------\n§Y能源负荷共享§!总能源消耗量：[?energy_load_sharing_use_var|R2]"
 heavy_power_restrictions_spirit_desc: "政府对民众实施了一系列严格的用电限制措施。虽然大幅削减了能源和电力消耗，但也造成了税收损失和其他经济损失。"
 some_power_restrictions_spirit_desc: "政府对民众实施了一系列小规模的用电限制措施。虽然略微减少了能源和电力消耗，但却造成了税收损失和其他经济损失。"
 some_additional_consumption_spirit_desc: "政府已开始对居民用电进行一系列小规模的定向补贴，以减轻部分经济负担。这鼓励了居民增加消费，但电力消耗却大幅增加。"
 heavy_additional_consumption_spirit_desc: "政府已开始对居民用电进行一系列大规模的定向补贴，以减轻部分经济负担。这鼓励了大量额外支出，但电力消耗却激增。"
