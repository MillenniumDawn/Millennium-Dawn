 STK_infantry_weapons_4_desc: "The M16A4 is the fourth generation of the M16 series. It is equipped with a removable carrying handle and a full length quad Picatinny rail for mounting optics and other ancillary devices. The FN M16A4, using safe/semi/burst selective fire, became standard issue for the U.S. Marine Corps. Military issue rifles are also equipped with a Knight's Armament Company M5 RAS hand guard, allowing vertical grips, lasers, tactical lights, and other accessories to be attached, coining the designation M16A4 MWS (or Modular Weapon System) in U.S. Army field manuals."
 STK_infantry_weapons_5_desc: "M4 카빈 소총은 M16 돌격소총의 단축형 및 경량형 변형 모델입니다. M4는 5.56x45mm NATO 탄을 사용하는 공랭식, 직접 가스 작동식, 탄창식 카빈 소총입니다. 14.5인치(370mm) 길이의 총열과 접이식 개머리판을 갖추고 있습니다."
