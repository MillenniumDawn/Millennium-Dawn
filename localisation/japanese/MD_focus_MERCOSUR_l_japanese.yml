l_japanese:
 #MERCOSUL
 BRA_education_integration: "教育統合"
 BRA_education_integration_desc: "共有市場は、加盟国が次世代をどのように育成するかをすり合わせ始めたとき、より強固になる。教育協力、相互承認、学術交流は、このブロックを単に経済的に結びついたものにするだけでなく、制度的にも両立可能なものにしてくれるだろう。"
 BRA_mercosur_market: "MERCOSUR市場"
 BRA_mercosur_market_desc: "制度的な土台が築かれた今、MERCOSURは限定的な協調を超え、より野心的な段階へ進むことができる。より深い商業的結びつき、より広範な投資の流れ、そしてより強い域内経済の引力を備えた市場だ。ここでこのブロックは、初めて力を持ち始める。"
 BRA_support_members: "加盟国支援"
 BRA_support_members_desc: "困っている友邦に援助と支援を与えることは、絆を築き、我々の連合にある弱い輪を補うことになる。"
 BRA_inv_assoc: "準加盟国招待"
 BRA_inv_assoc_desc: "我々はMERCOSURの準加盟国と近しい関係にある。関係をさらに良くし、彼らの経済にも成長の機会を与えるため、彼らを招待し、MERCOSURの誇りある加盟国とすべきだ。"
 BRA_maintain_quo: "MERCOSUR強化"
 BRA_maintain_quo_desc: "拡大は常に強さを意味するわけではない。土台を固めぬまま急速に拡大するブロックは、より大きくなっても、より脆くなる危険がある。我々は、すでに抱える加盟国の結束、有効性、域内安定を深めることに注力すべきだ。"
 BRA_integrate: "運動の国際化"
 BRA_integrate_desc: "我々の左派民族運動の志を完全に実現するには、国際化しなければならない。金融エリートは皆、国境を越えて動いている。我々も同じくそうしなければならない。"
 BRA_expand_to_latin_america: "ラテンアメリカ全域拡大"
 BRA_expand_to_latin_america_desc: "より広い大陸全体をなお我々の軌道へ引き込めるのであれば、MERCOSURは現在の輪の中にとどまるべきではない。より強い制度と、より魅力的な経済モデルを備えた今、我々は南部円錐を越えて視野を広げ、ラテンアメリカ全域へ影響力を伸ばすことができる。"

 #Unity Tree
 BRA_americas_unity: "南米サミット"
 BRA_americas_unity_desc: "南米はあまりにも長く、各国の優先事項、逸した機会、そして未完の地域計画によって分断されてきた。我々は南米サミットを招集し、大陸全体での協力を再始動させ、MERCOSURに勢いを取り戻し、新たな地域構想の中心に自らを据える。統合を成功させるには、まず指導力から始めなければならない。"
 BRA_americas_unity_TT: "これを取得した国家は、他の§Y南米諸国§!に対して§G+15§!の§Y評価補正§!を得る。"
 BRA_mercosur: "MERCOSUR"
 BRA_mercosur_desc: "MERCOSURは単なる関税同盟以上のものを提供する。それは、交易、共通ルール、そして地域的影響力の段階的拡大によって築かれる、より強固で、より統合された南米の土台である。我々がこの大陸を主導するつもりなら、出発点はここだ。"
 BRA_trade_agreement: "通商協定"
 BRA_trade_agreement_desc: "地域ブロックは象徴だけでは存続できない。障壁を引き下げ、商業上の期待をすり合わせ、加盟国に目に見える経済的利益を生み出さねばならない。MERCOSUR内の通商協定を強化することで、我々は政治的レトリックを実際の統合へと変えられる。"
 BRA_discuss_currency: "現地通貨決済の拡大"
 BRA_discuss_currency_desc: "ドルへの過度な依存を和らげ、域内貿易をより安定かつ柔軟に進めるため、加盟国間における現地通貨決済の利用を拡大する。為替コストの軽減と金融協調の強化は、より自立的な地域経済への重要な一歩となる。"
 BRA_people_goods: "人と物の自由往来"
 BRA_people_goods_desc: "物資の流れだけでは統合は完成しない。労働者、学生、起業家、家族が国境を越えて移動しやすくなってこそ、MERCOSURは単なる通商圏ではなく、実際に人が生き、働き、結びつく地域空間となる。"
 BRA_united_continent: "統一大陸"
 BRA_united_continent_desc: "南米全土は、たとえ我々の宿敵であるベネズエラ人であっても、共通の経済的利益のもとに団結すべきだ。"
 BRA_assoc_members: "正式加盟手続き整備"
 BRA_assoc_members_desc: "準加盟は有用だが、それだけでは地域秩序は不安定なままだ。MERCOSURを真の政治経済ブロックへ発展させるため、近隣諸国が準加盟から正式加盟へ進める制度化された加盟手続きを整備しよう。"

 MER_secretariat_reform: "MERCOSUR事務局改革"
 MER_secretariat_reform_desc: "より大きなブロックを、その場しのぎの外交だけで永遠に運営することはできない。新加盟国がMERCOSURを真剣な制度として信頼するには、その行政中枢を強化しなければならない。より有能な事務局は、加盟、調整、紛争管理をはるかに信頼できるものにする。"
 MER_infrastructure_corridor_program: "インフラ回廊計画"
 MER_infrastructure_corridor_program_desc: "道路が国境で途切れ、内陸で物流が崩壊するなら、地域統合に意味はない。MERCOSURは協定だけでなく、物資、資本、人を大陸全体で動かすインフラによって結ばれなければならない。より強いブロックは、宣言されるだけでなく、物理的に築かれねばならない。"
 MER_development_fund: "MERCOSUR開発基金"
 MER_development_fund_desc: "約束だけでは動かされない国もある。彼らは、統合が目に見える発展と現実の投資をもたらす場合にのみ参加するだろう。MERCOSUR開発基金を設立することで、我々は加盟を機会へと変え、加盟資格を物質的に魅力あるものにできる。"

 mercosur_member_state_modifier: "MERCOSUR加盟国"
 mercosur_member_state_modifier_desc: "MERCOSURは、ブラジル、アルゼンチン、ウルグアイ、パラグアイを中核として築かれた南米の関税・政治枠組みであり、その後は準加盟を通じて地域全体へ広がっていった。この機構への参加は、我々をより大きな交易圏、地域協調、そして共通発展の構想へ結び付ける。\n\n§Yこの国民精神は準加盟国と正式加盟国が増えるごとに強力になる！§!"
 MER_corridor_investment_round_modifier: "MERCOSUR回廊投資ラウンド"
 MER_corridor_investment_round_modifier_desc: "新たなブロック資金が、MERCOSUR全域の道路、物流回廊、デジタル接続事業へ向けられている。当面の間、この投資ラウンドが有効である限り、インフラ建設は平時より速い速度で進んでいる。"
 MER_development_fund_round_modifier: "MERCOSUR開発基金拠出"
 MER_development_fund_round_modifier_desc: "MERCOSUR開発基金は現在、ブロック全域で新たな民需建設とオフィス建設を支えている。この拠出ラウンドが続く限り、経済開発事業は加速したペースで推進される。"

 MER_mercosur_diplomacy: "MERCOSUR・UNASUL外交"
 MER_mercosur_diplomacy_desc: "南米の地域機構を用いてMERCOSURを拡大し、UNASUL協力を深化させ、ブロック全体の共同行動を調整する。"
 MER_invite_CHL_full_member: "チリ正式加盟招待"
 MER_invite_CHL_full_member_desc: "チリを準加盟の地位からMERCOSUR正式加盟へ引き上げる交渉を開始する。$MER_full_membership_acceptance_hint_desc$$MER_full_membership_invite_process_desc$"
 MER_invite_PRU_associate: "ペルー準加盟招待"
 MER_invite_PRU_associate_desc: "ペルーに対し、MERCOSUR準加盟国として参加するための正式協議を開始する。\n\n§Y受託率はその国との意見補正、影響力、メルコスールのツリーの進行具合で決定される！§!"
