 ukraine_varyag.25.name: "§Y바랴크§! 예인 지연"
 ukraine_varyag.25.desc: "§W호위 부대가 항해 중 악조건을 보고했습니다. 예인선을 추가하면 §!§Y바랴크§!§W를 일정대로 보낼 수 있지만 선주들이 추가로 £treasury §!§R0.20§!§W x10억을 요구합니다. 더 안전한 여건을 기다리면 §!§R인도가 60일 늦어집니다§!§W.§!"
