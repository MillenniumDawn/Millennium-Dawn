 ENG_inner_circle_andrew.06.d: "Após o escândalo de seus vínculos com Jeffrey Epstein, o Príncipe Andrew tornou-se politicamente tóxico. Sob crescente pressão pública e institucional, ele é despojado de seu status remanescente na Família Real e removido do círculo íntimo."
 ENG_military.046.t: "Washington Aprova a Parceria"
 ENG_military.046.d: "Os Estados Unidos designaram formalmente o Reino Unido como Grande Aliado Extra-OTAN. A parceria estratégica abre caminho para uma cooperação de defesa mais profunda e acesso preferencial à tecnologia militar americana."
 ENG_military.046.a: "Um amigo valioso do outro lado do Atlântico"
 ENG_military.047.t: "Washington Recusa a Parceria"
 ENG_military.047.d: "Os Estados Unidos recusaram nosso pedido de designação como Grande Aliado Extra-OTAN. A relação especial permanece, mas Washington não está preparada para formalizá-la mais por ora."
 ENG_military.047.a: "Decepcionante, mas não é o fim"
