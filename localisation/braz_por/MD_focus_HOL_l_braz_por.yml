 HOL_KNDS_Group_armor_manufacturer: "KNDS Group"
 HOL_KNDS_Group_armor_manufacturer_desc:0 "O KNDS Group, um gigante europeu da defesa formado pela fusão da Nexter com a Krauss-Maffei Wegmann, fornece aos Países Baixos soluções blindadas de última geração, incluindo tanques e outros veículos militares."
