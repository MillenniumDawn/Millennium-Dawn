l_english:

 # ==============================
 # National Focus
 # ==============================
 saudi_focus_tree: "Saudi Arabian Focus Tree"
 SAU_Acscenion_to_the_sco: "Ascension to the SCO"
 SAU_Acscenion_to_the_sco_desc: "Riyadh became a dialogue partner of the Shanghai Cooperation Organisation in 2023. Full membership would deepen relations with China and Russia, but it would also require closer cooperation with Iran."
 SAU_air_01: "The Royal Saudi Air Force"
 SAU_air_01_desc: "Develop the Royal Saudi Air Force (RSAF) into the strongest air arm in the Gulf."
 SAU_air_02: "Peace Sun: F-15 Eagle Program"
 SAU_air_02_desc: "Launch the Peace Sun program with the United States to bring the F-15 Eagle to the Kingdom."
 SAU_air_03: "F-15C/D Eagle Squadrons"
 SAU_air_03_desc: "Field F-15C/D Eagle squadrons to win and hold air superiority over Saudi skies."
 SAU_air_03_tt: "It Unlock a Decisions will open when you complete F-15C/D Eagle Squadron and Peace Sun F-15 Eagle Program"
 SAU_air_04: "F-15S Eagle"
 SAU_air_04_desc: "Acquire the F-15S Eagle under Peace Sun IX, able to fight for the skies and strike deep."
 SAU_air_05: "Tornado GR4"
 SAU_air_05_desc: "The Tornado GR4 deal with Britain, the largest arms contract in UK history, for Tornado GR4."
 SAU_air_06: "Panavia Tornado"
 SAU_air_06_desc: "Field Panavia Tornado squadrons in the strike, reconnaissance and air-defense roles."
 SAU_air_07: "The European Typhoon: Al Salam Deal"
 SAU_air_07_desc: "Sign the Al Salam deal for the Typhoon, a modern multirole fighter for the new century."
 SAU_air_08: "F-15SA Advanced Eagle"
 SAU_air_08_desc: "Upgrade the fleet to the F-15SA Advanced Eagle, the most capable Eagle ever built."
 SAU_air_09: "E-3 Sentry AWACS"
 SAU_air_09_desc: "Operate the E-3 Sentry AWACS to see and control the entire air picture and direct the fighters."
 SAU_air_10: "Aerial Refueling Fleet"
 SAU_air_10_desc: "Build a tanker fleet so Saudi jets can patrol the whole Kingdom and strike at long range."
 SAU_air_11: "C-130 Hercules Airlift"
 SAU_air_11_desc: "Expand the C-130 Hercules fleet to move troops and supplies anywhere at speed."
 SAU_air_12: "King Abdulaziz Air Base"
 SAU_air_12_desc: "Develop King Abdulaziz Air Base at Dhahran, guarding the Eastern Province and the Gulf."
 SAU_air_13: "King Khalid Air Base"
 SAU_air_13_desc: "Develop King Khalid Air Base at Khamis Mushait, the hardened southern base covering the Yemeni frontier."
 SAU_air_14: "Prince Sultan Air Base"
 SAU_air_14_desc: "Develop Prince Sultan Air Base at Al Kharj, a central hub deep inside the Kingdom."
 SAU_air_15: "Precision-Guided Munitions"
 SAU_air_15_desc: "Stock precision-guided bombs and missiles so a single sortie can destroy what once took many."
 SAU_air_16: "Saudi UAV Program"
 SAU_air_16_desc: "Start a Saudi drone program for long-endurance surveillance and precision strike."
 SAU_air_17: "Air Operations Command"
 SAU_air_17_desc: "Establish a central Air Operations Command to plan and run the whole air campaign as one."
 SAU_Al_Madinah_province_secure_support: "Secure Support in the Al-Madinah Province"
 SAU_Al_Madinah_province_secure_support_desc: "Medina contains the Prophet's Mosque and an influential clerical establishment. Securing the support of its scholars will help legitimize the Council and reduce religious opposition."
 SAU_AlSaud_historical_1: "§GThe House of Al Saud§!"
 SAU_AlSaud_historical_1_desc: "Abdulaziz ibn Saud established a succession system that passed the throne among his sons by seniority. After six kings and seventy years, the remaining eligible brothers are aging and the Kingdom must prepare for succession to the next generation."
 SAU_AlSaud_historical_10: "Ground Broken at Rabigh"
 SAU_AlSaud_historical_10_desc: "The Kingdom will begin construction of a 68-square-kilometer economic city at Rabigh, planned for two million residents and a major Red Sea port. It is the largest of six economic cities intended to attract private investment alongside state funding."
 SAU_AlSaud_historical_11: "Hold Municipal Elections"
 SAU_AlSaud_historical_11_desc: "Men over twenty-one will elect half of the municipal council seats, while the government appoints the remainder. The councils have limited authority over services such as drainage, street lighting, and permits, but the vote establishes an important political precedent."
 SAU_AlSaud_historical_12: "Establish The Peoples Council"
 SAU_AlSaud_historical_12_desc: "The Kingdom will establish an elected council with authority to propose laws on internal affairs. The King will retain an absolute veto, but exercising it will carry a visible political cost."
 SAU_AlSaud_historical_13: "Securing Our Future"
 SAU_AlSaud_historical_13_desc: "The Kingdom will tighten control over publications through licensing, approved editors, and restrictions on sensitive subjects. This will weaken organized opposition and strengthen the regime, but it will also discourage skilled graduates from returning and prevent ministries from receiving honest criticism."
 SAU_AlSaud_historical_14: "Intervention in Bahrain"
 SAU_AlSaud_historical_14_desc: "The Peninsula Shield Force intervened in Bahrain in March 2011 at the request of the Bahraini government and helped suppress the unrest in Manama. The Kingdom will renew this commitment and prepare to defend the House of Khalifa without waiting for another GCC summit."
 SAU_AlSaud_historical_15: "Investigate the East"
 SAU_AlSaud_historical_15_desc: "Protests in Qatif and Awamiyah have expanded from demands over unemployment and detainees to broader political grievances. The Interior Ministry will investigate opposition activity in the Eastern Province and act against identified threats."
 SAU_AlSaud_historical_16: "Women in the Shura Council"
 SAU_AlSaud_historical_16_desc: "No woman has served on the Consultative Council, although the Basic Law does not prohibit their appointment. The King can appoint women directly, but he must do so despite expected opposition from conservative scholars."
 SAU_AlSaud_historical_17: "The Oil Defense Strategy"
 SAU_AlSaud_historical_17_desc: "The Kingdom depends on a small number of oil installations along the Gulf coast. A unified oil-defense strategy will coordinate the budget and protect these facilities while the state develops alternatives to them."
 SAU_AlSaud_historical_18: "National Security Threats"
 SAU_AlSaud_historical_18_desc: "Saudi national security faces four connected threats: war on the southern border, jihadist recruitment, unrest among the Shia population near the oilfields, and Iranian-backed groups on the Kingdom's frontiers. A single service will be funded to assess and coordinate policy against all four."
 SAU_AlSaud_historical_19: "The Riyadh Meeting: Operation Decisive Storm"
 SAU_AlSaud_historical_19_desc: "A nine-state coalition assembled in Riyadh and began Operation Decisive Storm on 26 March 2015, combining air operations with a naval blockade. Saudi planners expected a short campaign, despite warnings from Yemenis familiar with the conflict."
 SAU_AlSaud_historical_2: "The Tenth Five-Year Plan"
 SAU_AlSaud_historical_2_desc: "The Tenth Five-Year Plan sets targets for non-oil growth, Saudi employment, and economic diversification. Previous plans made similar promises, but declining reserves make implementation increasingly urgent."
 SAU_AlSaud_historical_20: "Defying The Ajam"
 SAU_AlSaud_historical_20_desc: "The execution of Nimr al-Nimr, the burning of the Saudi embassy in Tehran, and the severing of diplomatic relations have sharply escalated the rivalry with Iran. The Kingdom will accept the economic and diplomatic costs rather than appear to yield."
 SAU_AlSaud_historical_21: "Aramco IPO"
 SAU_AlSaud_historical_21_desc: "Saudi Arabia floated 1.5 percent of Aramco on the Tadawul in December 2019, raising about $25 billion. The sale did not achieve the Crown Prince's proposed two-trillion-dollar valuation or a foreign listing, but it remained the largest sale of a state asset in the region."
 SAU_AlSaud_historical_22: "Vision 2030 Announced"
 SAU_AlSaud_historical_22_desc: "Vision 2030 was announced in April 2016 with targets for a two-trillion-dollar sovereign fund, reduced dependence on oil, greater private employment, and broad social reform. Unlike earlier diversification plans, it sets a firm deadline for delivery."
 SAU_AlSaud_historical_23: "Saudi-Israel Normalization Track"
 SAU_AlSaud_historical_23_desc: "Saudi Arabia has no treaty or embassy relations with Israel, but it permits Israeli overflights and maintains discreet intelligence contacts. Riyadh continues to demand progress on Palestine in public while discussing normalization on different terms in private."
 SAU_AlSaud_historical_24: "Establish Corruption Courts"
 SAU_AlSaud_historical_24_desc: "The Kingdom will establish specialized corruption courts and a permanent commission with jurisdiction over ministers and princes. Their credibility will depend on whether they prosecute senior defendants as well as ordinary officials."
 SAU_AlSaud_historical_25: "The Ritz-Carlton Purge"
 SAU_AlSaud_historical_25_desc: "The anti-corruption campaign detained about two hundred princes and businessmen at the Ritz-Carlton and recovered substantial assets. It also consolidated the Crown Prince's authority over the royal family."
 SAU_AlSaud_historical_26: "Backdoor Deals"
 SAU_AlSaud_historical_26_desc: "The Ritz-Carlton detainees will be released after privately negotiated financial settlements rather than public trials. This recovers assets quickly, but the lack of transparent proceedings will damage confidence in the rule of law."
 SAU_AlSaud_historical_3: "A New Kingdom"
 SAU_AlSaud_historical_3_desc: "Abdullah governed in Fahd's name for much of the decade before Fahd's death. His accession leaves the constitutional order unchanged but gives him direct authority to implement policies he had previously only proposed."
 SAU_AlSaud_historical_4: "Consolidating The Crown"
 SAU_AlSaud_historical_4_desc: "A royal decree will create the Allegiance Council, composed of sons and grandsons of Abdulaziz, to confirm crown princes and assess a king's fitness. This creates the first written succession procedure, although the Council's ability to constrain the King remains uncertain."
 SAU_AlSaud_historical_5: "Scholarship Programs Abroad"
 SAU_AlSaud_historical_5_desc: "The scholarship program will fund tens of thousands of Saudis and their families to study abroad. It will expand the Kingdom's skilled workforce, while exposing students to political and social systems that differ from Saudi Arabia's."
 SAU_AlSaud_historical_6: "Expand The National Guard"
 SAU_AlSaud_historical_6_desc: "The National Guard is recruited from tribes historically loyal to Abdulaziz and operates outside the regular military command. Expanding it protects the throne and prevents the regular officer corps from controlling all armed force in the Kingdom."
 SAU_AlSaud_historical_7: "Joining The WTO"
 SAU_AlSaud_historical_7_desc: "After twelve years of negotiations, the Kingdom will join the WTO by binding tariffs, opening service sectors, admitting foreign banks and insurers, and revising commercial law. Membership limits some commercial autonomy but gives Saudi Arabia a voice in the system governing its oil exports."
 SAU_AlSaud_historical_8: "National Dialogue"
 SAU_AlSaud_historical_8_desc: "The National Dialogue brings Shia clerics, Salafi scholars, women, and men together to discuss national issues and report their conclusions to the King. It has no legislative authority, but it permits an unusually broad public debate."
 SAU_AlSaud_historical_9: "Counter-Terrorism Cooperation"
 SAU_AlSaud_historical_9_desc: "The 2003 compound bombings showed that al-Qaeda was targeting the Saudi state as well as Americans in the Kingdom. Saudi Arabia will respond with raids, watch lists, financial investigations, and fighter-rehabilitation programs in close cooperation with US intelligence."
 SAU_AltanticRealightment: "The Atlantic Realignment"
 SAU_AltanticRealightment_desc: "The Council will seek recognition and support from Washington by emphasizing that Saudi oil exports will continue under the new government. This will test whether the United States values its relationship with the Saudi state more than the deposed monarchy."
 SAU_American_compnay_water: "§HForeign Water Operators§!"
 SAU_American_compnay_water_desc: "§LVeolia§!, §LMarubeni§!, §LGE Water§! - the world's foremost desalination experts are invited to operate the Kingdom's plants. Capacity comes online §Gquickly§! and the technical knowledge transfers in years, not decades. The cost: §Yforeign hands§! on the strategic faucet."
 SAU_Among_The_Major_Powers: "Among the Major Powers"
 SAU_Among_The_Major_Powers_desc: "Oil makes the Kingdom indispensable, but indispensability is not the same as safety. Reach beyond the region to the powers that shape the world order and decide which of them Riyadh will lean upon."
 SAU_Anti_Iran_propandia: "Anti-Iranian Propaganda"
 SAU_Anti_Iran_propandia_desc: "The Kingdom will use its media networks to criticize the Islamic Republic and build Sunni support against Iranian influence."
 SAU_Appoint_Loyalist_in_Privnces: "Appoint Loyalist in Provinces"
 SAU_Appoint_Loyalist_in_Privnces_desc: "The new government will replace royal provincial governors with loyal serving officers. This removes an important source of princely power and places the provinces under military control."
 SAU_arab_republic_of_arabia_1: "Unity, Freedom, Socialism"
 SAU_arab_republic_of_arabia_1_desc: "The three words of the Ba'ath become the law of the land: the unity of the Arab nation, liberation from the colonizer, and socialism for the people."
 SAU_arab_republic_of_arabia_10: "Cells Across the Arab World"
 SAU_arab_republic_of_arabia_10_desc: "The party will establish Ba'athist cells in Arab capitals to organize and support future revolutions."
 SAU_arab_republic_of_arabia_11: "The Sword of Unity"
 SAU_arab_republic_of_arabia_11_desc: "Arab states that reject voluntary union will be brought into the new order by force."
 SAU_arab_republic_of_arabia_12: "Purge the Reactionaries"
 SAU_arab_republic_of_arabia_12_desc: "The revolutionary government will remove monarchists, Islamists, and foreign agents who threaten Ba'athist rule."
 SAU_arab_republic_of_arabia_13: "The United Arab Republic"
 SAU_arab_republic_of_arabia_13_desc: "The Arab lands will be united in a single revolutionary state called the United Arab Republic."
 SAU_arab_republic_of_arabia_14: "One Arab Nation"
 SAU_arab_republic_of_arabia_14_desc: "Erase the borders drawn by Sykes and Picot and teach a generation that there is but one Arab nation bearing an eternal message."
 SAU_arab_republic_of_arabia_15: "The Vanguard of the Arabs"
 SAU_arab_republic_of_arabia_15_desc: "Arabia will claim leadership of the Arab world from the Atlantic to the Gulf and direct the wider nationalist movement."
 SAU_arab_republic_of_arabia_16: "Expel the Imperialists"
 SAU_arab_republic_of_arabia_16_desc: "Drive the last foreign bases and advisors from Arab soil and tear up the unequal treaties of the colonial age."
 SAU_arab_republic_of_arabia_17: "Industrialize the Nation"
 SAU_arab_republic_of_arabia_17_desc: "A national industrial plan will build steel mills, dams, and factories so the republic can produce its own essential goods and weapons."
 SAU_arab_republic_of_arabia_18: "The Revolutionary Command Council"
 SAU_arab_republic_of_arabia_18_desc: "Vest supreme authority in a council of the party's leaders, fusing party and state into a single revolutionary will."
 SAU_arab_republic_of_arabia_19: "Pan-Arab Solidarity"
 SAU_arab_republic_of_arabia_19_desc: "Stand with every Arab struggle from Palestine to the Maghreb, and make Arabia the patron of the nationalist cause."
 SAU_arab_republic_of_arabia_2: "Build the Party"
 SAU_arab_republic_of_arabia_2_desc: "The revolution will organize a disciplined party with cells extending from villages to the national leadership."
 SAU_arab_republic_of_arabia_3: "A Secular Republic"
 SAU_arab_republic_of_arabia_3_desc: "Separate mosque from state and bind the nation by Arab identity rather than sect, so that Sunni and Shia, Muslim and Christian stand as one."
 SAU_arab_republic_of_arabia_4: "The Arab Socialist Path"
 SAU_arab_republic_of_arabia_4_desc: "Reject both capitalism and Soviet communism for a distinctly Arab socialism: the commanding heights in the people's hands, the small trader left free."
 SAU_arab_republic_of_arabia_5: "Nationalize the Heights"
 SAU_arab_republic_of_arabia_5_desc: "Seize the oil, the banks and the great enterprises from the foreign concessionaires and the old families, and turn their wealth to the nation."
 SAU_arab_republic_of_arabia_6: "Land to the Peasants"
 SAU_arab_republic_of_arabia_6_desc: "Break up the great estates and give the soil to the fellahin who work it, ending the feudal grip on the countryside."
 SAU_arab_republic_of_arabia_7: "The Officer Corps"
 SAU_arab_republic_of_arabia_7_desc: "The party will recruit young officers and use the armed forces to teach and enforce Ba'athist doctrine."
 SAU_arab_republic_of_arabia_8: "Arm the Vanguard"
 SAU_arab_republic_of_arabia_8_desc: "A politically reliable party militia will be established alongside the regular army."
 SAU_arab_republic_of_arabia_9: "Forge the National Army"
 SAU_arab_republic_of_arabia_9_desc: "Build a modern mechanised army worthy of the Arab nation and able to carry the revolution beyond our borders."
 SAU_Aramco_petrodollar_oil: "Saudi Aramco"
 SAU_Aramco_petrodollar_oil_desc: "The §HSaudi Arabian Oil Company§! is the largest petroleum enterprise on Earth and the backbone of the Kingdom. This branch builds the oil sector field by field and then commits Aramco to a §Hstrategic doctrine§! - §Lpump more, refine more, or export for maximum revenue§! - all feeding the single §HSaudi Aramco§! national spirit."
 SAU_Armed_Anti_Iranian_groups: "Arm the Anti-Iranian Groups"
 SAU_Armed_Anti_Iranian_groups_desc: "The Kingdom will arm anti-government groups among Iran's Baluch and Arab minorities, extending the conflict into Iranian territory."
 SAU_army_01: "The Saudi Armed Forces"
 SAU_army_01_desc: "Unify and modernize the land, sea and air forces of the Kingdom into a single professional military."
 SAU_army_02: "Lessons of the Gulf War"
 SAU_army_02_desc: "In 1990 Saddam's Iraq seized Kuwait and massed on our border; only a foreign coalition saved the Kingdom, and the Battle of Khafji was fought on Saudi soil. Operation Desert Storm laid bare how dependent we are on others - never again."
 SAU_army_03: "Ministry of Defence and Aviation"
 SAU_army_03_desc: "Reorganize the Ministry of Defence and Aviation (MODA) into a modern command that can plan, budget and direct all the armed forces."
 SAU_army_04: "The General Staff"
 SAU_army_04_desc: "Build a professional General Staff to write war plans, run exercises and command operations."
 SAU_army_05: "The Royal Saudi Land Forces"
 SAU_army_05_desc: "Build the Royal Saudi Land Forces (RSLF) into a modern, mobile army headquartered in Riyadh."
 SAU_army_06: "Saudi Arabian National Guard"
 SAU_army_06_desc: "Expand the Saudi Arabian National Guard (SANG), the tribal force loyal to the throne that guards the royal family and the holy cities."
 SAU_army_07: "King Abdulaziz Royal Guard"
 SAU_army_07_desc: "Strengthen the Royal Guard Regiment, the elite unit sworn to protect the person of the King."
 SAU_army_08: "M1A2 Abrams Main Battle Tank"
 SAU_army_08_desc: "Acquire the American M1A2 Abrams, the heaviest and most capable tank in the region and the backbone of Saudi armor."
 SAU_army_09: "Armored Brigades"
 SAU_army_09_desc: "Raise and equip heavy armored brigades for decisive maneuver warfare in the open desert."
 SAU_army_10: "Mechanized Infantry"
 SAU_army_10_desc: "Form mechanized infantry to hold ground and support the armored spearheads."
 SAU_army_11: "M109 Self-Propelled Artillery"
 SAU_army_11_desc: "Field the M109 self-propelled howitzer to give the divisions mobile, protected fire support."
 SAU_army_12: "ASTROS II Rocket Artillery"
 SAU_army_12_desc: "Acquire the Brazilian ASTROS II multiple-launch rocket system for massed, long-range bombardment."
 SAU_army_13: "Royal Saudi Strategic Missile Force"
 SAU_army_13_desc: "Establish the Strategic Missile Force as a separate branch, the Kingdom's strategic deterrent."
 SAU_army_14: "DF-3 Ballistic Missiles"
 SAU_army_14_desc: "Secretly acquire Chinese DF-3 (CSS-2) ballistic missiles - as Saudi Arabia really did in 1988 - to deter Iran and Israel."
 SAU_army_15: "Army Aviation and Apache Gunships"
 SAU_army_15_desc: "Stand up an Army Aviation Command and acquire the AH-64 Apache, a tank-killer for the army's own air arm."
 SAU_army_16: "Special Forces Command"
 SAU_army_16_desc: "Forge a Special Forces Command for raids, counter-terrorism and reconnaissance behind enemy lines."
 SAU_Attack_iranian_influnce_in_Gulf: "Roll Back Iran in the Gulf"
 SAU_Attack_iranian_influnce_in_Gulf_desc: "Iran uses political and militia networks to expand its influence in Bahrain, Iraq, and elsewhere along the Gulf. The Kingdom will support local governments and factions that can reduce that influence."
 SAU_Basra_Grid_connection: "The Basra Grid Connection"
 SAU_Basra_Grid_connection_desc: "Iraq's south swelters through blackouts while importing Iranian power. Wire Basra into the Gulf grid and replace Iranian electricity with Saudi current."
 SAU_Begin_countering_Iranian: "Counter Iranian Influence"
 SAU_Begin_countering_Iranian_desc: "Iran's militias and money have flooded into the vacuum left by Saddam. Begin the long campaign to pry Iraq loose from the Islamic Republic's grip."
 SAU_Buy_Iraqi_Parliament: "Buy the Iraqi Parliament"
 SAU_Buy_Iraqi_Parliament_desc: "The Kingdom will use financial patronage to secure support from Iraqi parliamentary blocs and ministers. The goal is to shift Baghdad away from Tehran and toward Riyadh."
 SAU_Chinese_mediation: "Chinese Mediation"
 SAU_Chinese_mediation_desc: "China is a major customer of both Saudi Arabia and Iran and has offered to mediate between them. Accepting its role could stabilize relations without resolving the wider strategic rivalry."
 SAU_com_agrarian_revolution: "The Agrarian Revolution"
 SAU_com_agrarian_revolution_desc: "The transformation of the countryside is complete, its surplus feeding the cities and the revolution."
 SAU_com_agrarian_revolution_tt: "§YThe Workers' State grows:§!\n§G+2% Factory Efficiency, -2% Consumer Goods§!"
 SAU_com_collectivization: "Collectivization"
 SAU_com_collectivization_desc: "Private farms are merged into vast collectives worked in common and answering to the plan."
 SAU_com_collectivization_tt: "§YThe Workers' State grows:§!\n§G+2% Construction Speed, -2% Consumer Goods§!"
 SAU_com_dictatorship_proletariat: "Dictatorship of the Proletariat"
 SAU_com_dictatorship_proletariat_desc: "Power is concentrated in the working class through a single revolutionary party that brooks no opposition."
 SAU_com_dictatorship_proletariat_tt: "§YThe Workers' State grows:§!\n§G+5% Political Power Gain, +2% Stability§!"
 SAU_com_gulf_revolution: "Ignite the Gulf"
 SAU_com_gulf_revolution_desc: "The workers' state will provide agents and weapons to revolutionary movements in the Gulf monarchies."
 SAU_com_gulf_revolution_tt: "§YThe Workers' State grows:§!\n§G+3% War Support§!"
 SAU_com_land_reform: "Land to the Fellahin"
 SAU_com_land_reform_desc: "The great estates are broken up and handed to the peasants who till them."
 SAU_com_land_reform_tt: "§YThe Workers' State grows:§!\n§G+3% Stability, -2% Consumer Goods§!"
 SAU_com_moscow_alignment: "Embrace Moscow"
 SAU_com_moscow_alignment_desc: "Arabia will align with the Soviet bloc and exchange oil for arms and political support."
 SAU_com_moscow_alignment_tt: "§YThe Workers' State grows:§!\n§G+3% Construction Speed, +2% Factory Efficiency§!"
 SAU_com_nationalize_oil: "Nationalize the Oil Fields"
 SAU_com_nationalize_oil_desc: "The wealth beneath the sands belongs to the people, not the princes. ARAMCO is seized and placed under workers' control."
 SAU_com_nationalize_oil_tt: "§YThe Workers' State grows:§!\n§G+3% Construction Speed, +2% Factory Efficiency§!"
 SAU_com_new_arab_man: "The New Arab Man"
 SAU_com_new_arab_man_desc: "A new revolutionary culture is cultivated, sweeping away the old order's superstitions and hierarchies."
 SAU_com_new_arab_man_tt: "§YThe Workers' State grows:§!\n§G+3% Political Power Gain, +2% Stability§!"
 SAU_com_non_aligned: "The Non-Aligned Road"
 SAU_com_non_aligned_desc: "Arabia charts an independent course, leading the non-aligned nations against imperialism and Soviet domination alike."
 SAU_com_non_aligned_tt: "§YThe Workers' State grows:§!\n§G+3% Political Power Gain, +2% Stability§!"
 SAU_com_oil_workers_soviet: "Soviets of the Oil Workers"
 SAU_com_oil_workers_soviet_desc: "Elected workers' councils will govern the oilfields and form a central institution of the proletarian state."
 SAU_com_oil_workers_soviet_tt: "§YThe Workers' State grows:§!\n§G+2% Factory Efficiency, +2% Political Power Gain§!"
 SAU_com_pan_arab_union: "Toward Pan-Arab Union"
 SAU_com_pan_arab_union_desc: "The revolution reaches outward, seeking union with the other progressive Arab states."
 SAU_com_pan_arab_union_tt: "§YThe Workers' State grows:§!\n§G+2% Political Power Gain, +2% Stability§!"
 SAU_com_peoples_republic: "The People's Republic of Arabia"
 SAU_com_peoples_republic_desc: "The provisional order gives way to a fully constituted workers' state: the People's Republic of Arabia."
 SAU_com_peoples_republic_tt: "§YThe Workers' State grows:§!\n§G+5% Political Power Gain, +3% Stability, +2% War Support§!"
 SAU_com_progressive_islam: "Progressive Islam"
 SAU_com_progressive_islam_desc: "Rather than crush the faith, the party enlists progressive clerics to preach a socialism compatible with Islam."
 SAU_com_progressive_islam_tt: "§YThe Workers' State grows:§!\n§G+4% Stability§!"
 SAU_com_proletarian_nation: "A Proletarian Nation"
 SAU_com_proletarian_nation_desc: "Arabia will define national identity through workers and labor rather than tribal affiliation or loyalty to the monarchy."
 SAU_com_proletarian_nation_tt: "§YThe Workers' State grows:§!\n§G+3% Conscription Factor, +2% War Support§!"
 SAU_com_red_guard: "Form the Red Guard"
 SAU_com_red_guard_1: "Regularize the Red Guard"
 SAU_com_red_guard_1_desc: "Forge the revolutionary militias into a professional Red Army, with standardized equipment, trained officers, and a war industry to arm them."
 SAU_com_red_guard_1_tt: "A regular Red Army: war support, military industry, and a stockpile of equipment."
 SAU_com_red_guard_2: "The People's Militia"
 SAU_com_red_guard_2_desc: "Keep the revolution in the hands of the people, arming every worker and peasant as a militiaman ready to defend the republic."
 SAU_com_red_guard_2_tt: "A mass people's militia: war support, conscription, and a flood of manpower."
 SAU_com_red_guard_desc: "A revolutionary militia drawn from the oil workers and the urban poor, sworn to defend the revolution."
 SAU_com_red_guard_tt: "§YThe Workers' State grows:§!\n§G+3% Conscription Factor, +2% War Support§!"
 SAU_com_rural_literacy: "Rural Literacy Brigades"
 SAU_com_rural_literacy_desc: "Cadres fan out across the countryside to teach reading, writing, and revolutionary doctrine."
 SAU_com_rural_literacy_tt: "§YThe Workers' State grows:§!\n§G+2% Political Power Gain, +2% Stability§!"
 SAU_com_state_atheism: "State Atheism"
 SAU_com_state_atheism_desc: "Religion is declared the opium of the masses. The clergy are stripped of power and the mosques fall silent."
 SAU_com_state_atheism_tt: "§YThe Workers' State grows:§!\n§G+3% Political Power Gain, +2% War Support§!"
 SAU_com_state_industrialization: "State Industrialization"
 SAU_com_state_industrialization_desc: "The government will use accelerated state programs to build steel mills, dams, and factories across Arabia."
 SAU_com_state_industrialization_tt: "§YThe Workers' State grows:§!\n§G+4% Construction Speed, +2% Factory Efficiency§!"
 SAU_com_vanguard_region: "Vanguard of the Region"
 SAU_com_vanguard_region_desc: "Arabia sets itself up as the vanguard of revolution across the Arab world and the Gulf."
 SAU_com_vanguard_region_tt: "§YThe Workers' State grows:§!\n§G+3% War Support, +2% Political Power Gain§!"
 SAU_com_womens_emancipation: "Women's Emancipation"
 SAU_com_womens_emancipation_desc: "Women will enter the workforce and the party as legal and political equals, ending the old order's restrictions on their participation."
 SAU_com_womens_emancipation_tt: "§YThe Workers' State grows:§!\n§G+4% Conscription Factor, +2% Political Power Gain§!"
 SAU_Comprehensive_Strategic_China: "A Strategic Partnership with China"
 SAU_Comprehensive_Strategic_China_desc: "Choose Beijing over Washington as the Kingdom's principal great-power partner. Chinese capital and Chinese arms come without sermons, but also without the old American guarantee."
 SAU_Conscript_The_Kingdom: "Conscript The Kingdom"
 SAU_Conscript_The_Kingdom_desc: "The Kingdom has traditionally relied on volunteers from trusted tribes rather than conscription. The Council will accept the political risks of a mass army in order to increase available manpower."
 SAU_Cooperation_Export_Oil_To_USA: "Oil for Security"
 SAU_Cooperation_Export_Oil_To_USA_desc: "The bargain is as old as the meeting aboard the USS Quincy: Saudi crude keeps the American economy turning, and American arms keep the Kingdom safe. Deepen the petrodollar partnership that underwrites the realm."
 SAU_Cooperation_With_East: "§RCooperation With The East§!"
 SAU_Cooperation_With_East_desc: "The centre of gravity of the world economy is drifting toward Asia, and Asia is thirsty for oil. Open the Kingdom to the rising powers of the East and hedge against an unreliable West."
 SAU_Cooperation_With_The_West: "§CCooperation with the West§!"
 SAU_Cooperation_With_The_West_desc: "Washington and its allies have guaranteed the Gulf's security since the days of King Abdulaziz. Anchor the Kingdom firmly in the Western camp and trade the world's oil for the world's protection."
 SAU_Cooperative_with_new_Government: "Engage the New Baghdad"
 SAU_Cooperative_with_new_Government_desc: "A new government sits in Baghdad, Shia-led and courted by Tehran. Swallow old enmities and draw the new Iraq toward the Arab fold."
 SAU_Counter_the_Baathist: "Counter the Baathist Remnant"
 SAU_Counter_the_Baathist_desc: "Whether Saddam fell or merely faltered, the Baath remains a force in Iraq's shadows. Deny the old regime's diehards any path back to power."
 SAU_crackdown_on_the_opposition: "Crackdown on the Opposition"
 SAU_crackdown_on_the_opposition_desc: "The Mabahith maintains extensive files on Shia organizers, Sahwa clerics, and liberal petitioners. The Council will use those records to identify and suppress opposition to military rule."
 SAU_declare_republic_of_Arabia_1: "Declare the Republic of Arabia"
 SAU_declare_republic_of_Arabia_1_desc: "The monarchy has fallen and the provisional council holds power in the name of the people. Now the old kingdom is dissolved for good and a new state is proclaimed: the Republic of Arabia, built on the will of its citizens rather than the bloodline of a dynasty."
 SAU_Defense_industries_act: "The Defense Industries Act"
 SAU_Defense_industries_act_desc: "Saudi Arabia has long depended on imported weapons and foreign spare parts. The Defense Industries Act will require domestic production where possible and licensed production where necessary, despite higher costs and lower short-term efficiency."
 SAU_Disband_the_national_guard: "Disband the National Guard"
 SAU_Disband_the_national_guard_desc: "The National Guard was created from loyal tribes to protect the throne against the regular army. The Council will dissolve its regiments and offer their personnel places in the regular armed forces, removing the monarchy's independent military base."
 SAU_Economcy_Under_Military_order: "The Economy Under Military Order"
 SAU_Economcy_Under_Military_order_desc: "Officers will take control of Aramco, SABIC, the ports, and major contractors. Oil operations can continue under their existing engineers, but military administration is likely to reduce efficiency elsewhere in the economy."
 SAU_Emegency_tribunal: "Emergency Tribunal"
 SAU_Emegency_tribunal_desc: "Courts convened under military authority, sitting without appeal, trying offences the ordinary courts were never given jurisdiction over. The ulema are consulted on the form of the proceedings and not on the verdicts."
 SAU_end_water_crisis_in_saudi: "Water Security Achieved"
 SAU_end_water_crisis_in_saudi_desc: "Decades of investment in desalination, wastewater recycling, and water conservation have finally broken the kingdom's dependence on vanishing aquifers. The water crisis is over."
 SAU_Energy_Subsidies_Jodan: "Energy Subsidies for Jordan"
 SAU_Energy_Subsidies_Jodan_desc: "Jordan has no oil of its own and feels every spike in the market. Bind the kingdom to Saudi generosity with cheap fuel and discounted crude."
 SAU_FA_aid_sudan: "Aid Sudan"
 SAU_FA_aid_sudan_desc: "Sudan's Islamist government has historically leant towards Iran given the two states' ideological affinity. However, this relationship has done little to support Sudan's ailing economy which has suffered under Western sanctions since the late 90s. We can help secure a Sudanese realignment by providing the economic support that Iran has been unable to offer."
 SAU_FA_algerian_ties: "Side with Algeria"
 SAU_FA_algerian_ties_desc: "Algeria and Morocco have, since independence, competed for dominance and clashing repeatedly. This animosity makes it exceedingly difficult to maintain good relations with both simultaneously. Improving relations with Algeria may be in our interest due to that country's extensive experience fighting Islamist rebels, experience that we can draw upon."
 SAU_FA_back_the_brotherhood: "Back the Brotherhood"
 SAU_FA_back_the_brotherhood_desc: "Egypt, as the birthplace of the Muslim Brotherhood, is a symbolically significant arena for the battle between secular authoritarianism and Islamist democracy, a battle that we should formulate a position on. The Brotherhood, which enjoys a strong following across the region, may be a useful conduit for our overseas influence."
 SAU_FA_back_the_strongman: "Back the Strongman"
 SAU_FA_back_the_strongman_desc: "Egypt is governed best when it is under the control of a single, strong leader backed up by one of the most powerful militaries in the Middle East. We should continue to support stability and secular rule in this key Arab country, along with a regional order that favors American-backed autocracy over destabilizing democracy."
 SAU_FA_befriend_the_turks: "Befriend the Turks"
 SAU_FA_befriend_the_turks_desc: "[befriend_the_turks_description]"
 SAU_FA_contain_the_turks: "Contain the Turks"
 SAU_FA_contain_the_turks_desc: "We cannot allow Turkey to pursue its interests in the Middle East. [TUR.GetLeader]'s support of political Islam risks strengthening a dangerous populist movement, one that may seek to overthrow our government."
 SAU_FA_influence_muslim_europe: "Influence Muslim Europe"
 SAU_FA_influence_muslim_europe_desc: "The Ottoman Empire's expansion into Europe has left a footprint on that continent in the form of several Muslim majority nations. While many of the Muslims in these countries adopt a very different approach to their faith compared to Muslims in our country, we can still use our common religion as a basis for extending our influence into this region."
 SAU_FA_influence_north_africa: "Influence North Africa"
 SAU_FA_influence_north_africa_desc: "North Africa, particularly the countries of the Maghreb, has traditionally been somewhat detached from the politics of the Middle East, maintaining stronger ties to Europe in the north and sub-Saharan Africa in the south. However, given the increasing geopolitical rivalry taking place in our immediate sphere of influence, it may be worth bolstering our involvement in this region."
 SAU_FA_moroccan_ties: "Side with Morocco"
 SAU_FA_moroccan_ties_desc: "Algeria and Morocco have, since independence, competed for dominance and clashing repeatedly. This animosity makes it exceedingly difficult to maintain good relations with both simultaneously. Being a monarchy rather than a republic, Morocco is the more natural partner for us and our relations have therefore been strong in the past."
 SAU_FA_sanction_sudan: "Sanction Sudan"
 SAU_FA_sanction_sudan_desc: "[SUD.GetLeader]'s leadership has been plagued by international controversy. Under his rule, Sudan has been accused of being a state sponsor of terror as well as a major human rights abuser. Western nations have subsequently sanctioned this rogue state, an example that we should follow."
 SAU_FA_sanction_turkey: "Sanction Turkey"
 SAU_FA_sanction_turkey_desc: "Despite our warnings Turkey has continued to meddle in the Arab world. We have no choice but to use coercive measures to dissuade Turkey from furthering its imperialist ambitions."
 SAU_FA_security_guarantees_turkey: "Security Guarantees"
 SAU_FA_security_guarantees_turkey_desc: "Now that our relations with Turkey have grown exceptionally close, perhaps it is time for us to negotiate a treaty where both of our countries guarantee the other's sovereignty. This will certainly help ward off any hostile forces that may threaten either us or our new allies."
 SAU_FA_turkish_bases: "Turkish Bases"
 SAU_FA_turkish_bases_desc: "As part of our strengthening of relations with the Turks, we should invite [TUR.GetLeader] to establish a Turkish military base on our territory. Not only will this help further improve relations between our two countries, but it will also help strengthen our security against external threats given Turkey's incentive to protect its new military base."
 SAU_FA_war_in_libya: "Libyan Arms Shipments"
 SAU_FA_war_in_libya_desc: "For much of its history Libya has been a site of foreign contestation. Italy, Britain, Russia and the United States vied for influence in the pre-Qaddafi Libya, attempting to benefit from the country's strategic location and high quality oil deposits. However, the West's diminished involvement in the country has offered regional powers like ourselves an opportunity to shape Libyan politics to our advantage."
 SAU_Faisaliste_1: "§OThe Faisalite Resurgence§!"
 SAU_Faisaliste_1_desc: "The Faisalite program returns after a generation of neglect. It calls for austerity, self-reliance, and a Kingdom that represents the Ummah instead of depending on Washington."
 SAU_Faisaliste_10: "Centralization of the Provincial Emirates"
 SAU_Faisaliste_10_desc: "The provincial emirs have run their regions as private estates since the founding. Riyadh recalls their charters and issues new ones - shorter, revocable, and signed by the King."
 SAU_Faisaliste_11: "The Sovereign Civil Service"
 SAU_Faisaliste_11_desc: "The civil service will use examinations for appointments and service records for promotion. This will reduce the influence of family connections over government employment."
 SAU_Faisaliste_12: "Reorganization of the Majlis ash-Shura"
 SAU_Faisaliste_12_desc: "Miteb will enlarge and reorganize the Majlis ash-Shura and give it access to substantive government business. It will remain subordinate to the King, but it will gain a clearer advisory and administrative role."
 SAU_Faisaliste_13: "The National Cadre Initiative"
 SAU_Faisaliste_13_desc: "The Kingdom will train Saudi citizens to replace foreign workers in strategically important occupations. Short-term efficiency may decline while the national workforce gains experience."
 SAU_Faisaliste_14: "The Fortress Kingdom"
 SAU_Faisaliste_14_desc: "The Faisalite government has consolidated its institutions, removed its opponents, and reduced foreign influence. The Kingdom must now decide whether this autonomy will support isolation or a more active independent policy."
 SAU_Faisaliste_15: "The Spirit of '73"
 SAU_Faisaliste_15_desc: "The 1973 oil embargo demonstrated that Saudi production policy could influence Western governments. The Kingdom will consider using that leverage to secure further political concessions."
 SAU_Faisaliste_16: "The International Forums Question"
 SAU_Faisaliste_16_desc: "The Kingdom must decide whether to pursue its interests through institutions such as the United Nations and the IMF or withdraw from a system in which it had little role in drafting the rules."
 SAU_Faisaliste_17: "The Superpower Engagement Question"
 SAU_Faisaliste_17_desc: "Both superpower blocs seek Saudi alignment. Riyadh can remain independent while buying from both, or reduce its dependence by developing domestic arms production."
 SAU_Faisaliste_18: "Eradicate Foreign Dependency"
 SAU_Faisaliste_18_desc: "The Kingdom will treat dependence on essential imports as a strategic vulnerability. Domestic substitution will therefore take priority even when imported goods would be cheaper."
 SAU_Faisaliste_19: "The Foreign Wealth Question"
 SAU_Faisaliste_19_desc: "Saudi Arabia holds hundreds of billions of dollars in Western banks and government securities. Repatriating this wealth would reduce foreign leverage, but leaving it abroad remains safer and more profitable."
 SAU_Faisaliste_2: "Increase the Ulema's Authority"
 SAU_Faisaliste_2_desc: "The scholars are restored to the councils they were quietly eased out of. Faisal ruled with the ulema at his shoulder, and his heirs will not pretend otherwise."
 SAU_Faisaliste_20: "The Domestic Supply Quota"
 SAU_Faisaliste_20_desc: "Every ministry, contractor, and refinery will be required to purchase a minimum share of Saudi-made goods. Domestic products may initially cost more and perform worse, but the quotas will build national capacity."
 SAU_Faisaliste_21: "The Sovereign Aid Question"
 SAU_Faisaliste_21_desc: "Saudi aid can be distributed as unconditional support to Muslim communities or used to secure political concessions. The Kingdom must decide whether religious solidarity or strategic influence will govern its assistance."
 SAU_Faisaliste_22: "Islamic Solidarity Conference"
 SAU_Faisaliste_22_desc: "Riyadh will convene an Islamic Solidarity Conference and finance the proceedings. The meeting will revive Faisal's approach of using Saudi-sponsored institutions to coordinate the Muslim world."
 SAU_Faisaliste_23: "The Expatriate Workforce Question"
 SAU_Faisaliste_23_desc: "Nine million foreign workers support the Saudi economy but conflict with the Faisalite goal of national self-reliance. Reducing their role will be economically costly, while retaining them will limit Saudization."
 SAU_Faisaliste_24: "Reclaim the OIC Leadership"
 SAU_Faisaliste_24_desc: "The Organisation of Islamic Cooperation is based in Jeddah. Riyadh will use its funding and host-country position to direct the organization's agenda more actively."
 SAU_Faisaliste_25: "The Global Ummah Question"
 SAU_Faisaliste_25_desc: "The Kingdom's control of the Two Holy Mosques gives it a unique claim to leadership among the world's Muslims. It must decide whether to turn that status into an active responsibility toward the global Ummah."
 SAU_Faisaliste_29: "Splendid Isolation"
 SAU_Faisaliste_29_desc: "The Kingdom will withdraw from blocs, client relationships, and foreign campaigns. It will concentrate on defending its borders, preserving the faith, and managing its oil resources."
 SAU_Faisaliste_3: "The Virtue Committees Return"
 SAU_Faisaliste_3_desc: "The Committee for the Promotion of Virtue and the Prevention of Vice takes back the streets it lost. Its patrols are visible again, and so is the message they carry."
 SAU_Faisaliste_30: "The Third Way Doctrine"
 SAU_Faisaliste_30_desc: "The Kingdom will reject alignment with both Washington and Moscow and organize an independent bloc of Muslim states led from Riyadh. This bloc will rely on its own arms production and answer only to the Ummah."
 SAU_Faisaliste_4: "Ban Foreign Media"
 SAU_Faisaliste_4_desc: "Satellite dishes come down, bureaux close, and the Kingdom's news is written in the Kingdom. What the world says about Saudi Arabia is no longer a domestic matter."
 SAU_Faisaliste_5: "The Closed Frontier"
 SAU_Faisaliste_5_desc: "Visas tighten, contracts lapse, and the expatriate quarters begin to empty. The Kingdom decides it would rather be poorer and its own."
 SAU_Faisaliste_6: "Purge the Westernized Elite"
 SAU_Faisaliste_6_desc: "The ministries begin to fill with men educated in Riyadh rather than in Boston. Those who came home with foreign degrees and foreign habits find their files reviewed and their offices reassigned."
 SAU_Faisaliste_7: "The Foreign Bases Question"
 SAU_Faisaliste_7_desc: "Foreign forces remain on Saudi territory, creating growing religious and political opposition. The Kingdom must decide whether their security guarantee justifies the loss of sovereignty.\n [USA.GetFlag] §B AMERICA!!§!"
 SAU_Faisaliste_8: "Sever the Western Pact"
 SAU_Faisaliste_8_desc: "The Kingdom will close foreign bases and require their garrisons to leave. This restores Saudi control over its territory but ends an important external security guarantee."
 SAU_Faisaliste_9: "The Base Retention Edict"
 SAU_Faisaliste_9_desc: "The foreign bases and their supply arrangements will remain. The government will defend this decision to the ulema as a security necessity despite their religious objections."
 SAU_Fight_Iran_In_directly: "Fight Iran Indirectly"
 SAU_Fight_Iran_In_directly_desc: "Open battle with the Islamic Republic would ruin both sides. Instead, bleed Tehran through its proxies and its restless provinces, never quite crossing the line into open war."
 SAU_focus_290: "MODON Industrial Cities"
 SAU_focus_290_desc: "MODON will expand industrial cities for cement, aluminium, and fertilizer production at Yanbu, Ras al-Khair, and Jubail. This will reduce imports of goods the Kingdom can produce domestically."
 SAU_focus_291: "The Return of National Capital"
 SAU_focus_291_desc: "The Ministry of Commerce will encourage Saudi capital held in foreign property and banks to return to the Kingdom and finance domestic investment."
 SAU_focus_292: "Jeddah Islamic Port Expansion"
 SAU_focus_292_desc: "Jeddah Islamic Port will receive new roll-on, roll-off berths and improved rail links to increase Red Sea freight capacity."
 SAU_focus_293: "The Supreme Economic Council"
 SAU_focus_293_desc: "The Supreme Economic Council will bring the Industry, Commerce, Trade, and Finance ministries into a single coordinating body. This will reduce interministerial disputes and unify economic policy."
 SAU_focus_294: "SABIC's Global Expansion"
 SAU_focus_294_desc: "SABIC will expand through major investments, new ethylene facilities, and partnerships with firms such as Sumitomo and Dow. This will strengthen its position in global petrochemicals."
 SAU_focus_295: "The Jubail II Expansion"
 SAU_focus_295_desc: "New petrochemical plants and pipelines between Dhahran and Jubail will make the Eastern Province the center of Saudi industrial production."
 SAU_focus_296: "The Saudi Export Program"
 SAU_focus_296_desc: "The Saudi Export Program will promote manufactured exports such as plastics, refined fuels, and cement in markets across Asia, Africa, and Latin America."
 SAU_focus_297: "SABIC Agri-Nutrients"
 SAU_focus_297_01: "King Abdullah Financial District"
 SAU_focus_297_01_desc: "Riyadh becomes the financial center of the Gulf. Banks, investment funds, and corporate headquarters cluster in the new financial district, drawing capital from across the Muslim world."
 SAU_focus_297_desc: "The Kingdom will expand beyond oil and chemicals into auto parts, prefabricated housing, and consumer goods. This will broaden domestic manufacturing and reduce dependence on imports."
 SAU_focus_299: "Economic Diversification"
 SAU_focus_299_desc: "Oil remains central to the economy, but diversified industries now provide a growing share of output and employment."
 SAU_focus_300: "Non-Oil Exports"
 SAU_focus_300_desc: "Manufactured goods will provide a larger share of exports, reducing the trade balance's dependence on crude oil."
 SAU_focus_301: "Economic Liberalization"
 SAU_focus_301_desc: "The Kingdom will reduce subsidies, administrative delays, and licensing burdens. These reforms will make the economy more competitive and easier for private firms to enter."
 SAU_focus_302: "SABIC Technology & Innovation"
 SAU_focus_302_desc: "The government will align ministries behind a common technology and innovation program with a shared budget and schedule. This will reduce duplication and improve international competitiveness."
 SAU_focus_303: "The 2000s Oil Boom"
 SAU_focus_303_desc: "High oil revenues in the 2000s will accelerate GDP growth, domestic investment, foreign capital inflows, and activity on the Tadawul."
 SAU_focus_304: "The National Industrial Strategy"
 SAU_focus_304_desc: "The National Industrial Strategy will set the government's objectives and performance measures for the next decade of industrial development."
 SAU_focus_306: "The Mining Sector"
 SAU_focus_306_desc: "Ma'aden, founded in 1997, makes mining the §Lthird pillar§! of the economy beside oil and petrochemicals - phosphate at Al-Jalamid, gold at Mahd adh-Dhahab, and bauxite and aluminium bound for Ras al-Khair."
 SAU_focus_307: "The Tourism Sector"
 SAU_focus_307_desc: "The §HSupreme Commission for Tourism§!, created in 2000, turns the kingdom's heritage, its Red Sea coast and - above all - the §Lpilgrimage to Mecca and Medina§! into a permanent, year-round industry."
 SAU_focus_308: "The Construction Boom"
 SAU_focus_308_desc: "Oil-boom investment will fund extensive construction in Riyadh, Jeddah, and Dammam, including towers, malls, roads, and other urban infrastructure."
 SAU_focus_309: "The Digital Economy"
 SAU_focus_309_desc: "The §HCommunications and IT Commission§! (2001) ends the telecom monopoly and wires the kingdom - mobile networks, broadband, and the first e-government services reach every province."
 SAU_focus_310: "The Eighth Development Plan"
 SAU_focus_310_desc: "The Eighth Development Plan covers 2005 through 2009 and coordinates the Ministry of Economy and Planning's main economic and social programs."
 SAU_focus_311: "The Industrial Path"
 SAU_focus_311_desc: "The industrial path prioritizes steel, smelting, fabrication, and other heavy industries as the main sources of growth."
 SAU_focus_312: "The Services Path"
 SAU_focus_312_desc: "The services path prioritizes banking, logistics, finance, and tourism as sectors capable of employing more Saudi nationals."
 SAU_focus_313: "The Balanced Path"
 SAU_focus_313_desc: "The balanced path develops industry and services together, reducing dependence on any single non-oil sector."
 SAU_focus_314: "The Ninth Development Plan"
 SAU_focus_314_desc: "The Saudi economy of 2015 looks nothing like the one of 1995. Manufacturing alone surpasses what oil exports were worth a decade ago."
 SAU_focus_315: "The Saudi Landbridge"
 SAU_focus_315_desc: "The Saudi Landbridge will connect Jeddah Islamic Port on the Red Sea with Riyadh and Dammam on the Gulf by rail. Freight will cross the peninsula without sailing around Arabia."
 SAU_focus_316: "STC Privatization"
 SAU_focus_316_desc: "STC privatization will support wider fiber coverage and speed the expansion of modern telecommunications across the Kingdom."
 SAU_focus_317: "The Saudi Electricity Company"
 SAU_focus_317_desc: "The Saudi Electricity Company will add gas turbines and coast-to-coast transmission lines so electricity supply no longer constrains development."
 SAU_focus_318: "Urban Development"
 SAU_focus_318_desc: "Riyadh, Jeddah, and Dammam will continue to expand as the Kingdom becomes increasingly urban. Government planning must provide infrastructure for this larger urban population."
 SAU_focus_319: "The Real Estate Development Fund"
 SAU_focus_319_desc: "The Real Estate Development Fund will finance affordable housing around major cities and reduce the housing waiting list."
 SAU_focus_320: "The North-South Railway"
 SAU_focus_320_desc: "Expanded rail, a national bus network, and cheaper domestic flights will improve travel between distant parts of the Kingdom."
 SAU_focus_321: "King Abdullah Economic City"
 SAU_focus_321_desc: "King Abdullah Economic City, Knowledge Economic City, and Jazan will receive streamlined rules intended to avoid the administrative delays found elsewhere in the Kingdom."
 SAU_focus_322: "The Labour Law of 2005"
 SAU_focus_322_desc: "The 2005 Labour Law will reform elements of the kafala system and increase Saudi employment in sectors previously dominated by expatriate workers."
 SAU_focus_323: "Tatweer Education Reform"
 SAU_focus_323_desc: "Tatweer will update curricula, reduce religious teaching hours, and introduce English from grade four. These changes begin a broad modernization of the education system."
 SAU_focus_324: "King Fahd Medical City"
 SAU_focus_324_desc: "King Fahd Medical City and expanded provincial hospitals will bring more regions toward the standard set by King Faisal Specialist Hospital."
 SAU_focus_325: "KAUST"
 SAU_focus_325_desc: "Research and development budgets will increase substantially at KAUST, KFUPM, and KAU, strengthening Saudi universities' international standing."
 SAU_focus_326: "K.A.CARE Renewable Energy"
 SAU_focus_326_desc: "K.A.CARE will develop solar power at Sakaka and wind generation at Dumat al-Jandal, using the Kingdom's renewable resources to diversify electricity production."
 SAU_focus_327: "Royal Decree M/30, Capital Market Law"
 SAU_focus_327_desc: "Royal Decree M/30, issued by King Fahd on 31 July 2003, enacted the Capital Market Law. It establishes a modern legal framework for the Tadawul and Saudi capital-market regulation."
 SAU_focus_328: "The 2007 Legal Reforms"
 SAU_focus_328_desc: "The Kingdom's 2007 legal reforms codify formal incorporation and establish clear rules for creating recognized legal entities. Companies can now operate under a more predictable corporate framework."
 SAU_focus_329: "§GThe Qualified Foreign Investor Program§!"
 SAU_focus_329_desc: "On §H15 June 2015§!, the §LCapital Market Authority§! opens the §LTadawul§! to direct foreign institutional investment for the first time. Funds with at least §Y$5 billion§! in assets under management may buy Saudi shares without local intermediaries, beginning the path toward §LMSCI Emerging Markets§! inclusion."
 SAU_focus_330: "§GMSCI Emerging Markets Inclusion§!"
 SAU_focus_330_desc: "In §HJune 2018§!, §LMSCI§! announces Saudi Arabia's upgrade from Standalone to Emerging Markets status. Implementation begins in §HMay 2019§! and finishes with the second phase in §HAugust 2019§!. The completed inclusion gives the §LTadawul§! approximately §G2.83%§! of the index and is expected to bring §G$14 to 16 billion§! in passive investment."
 SAU_focus_331: "The Kafalah SME Program"
 SAU_focus_331_desc: "The Kafalah program will provide favorable loans, simpler procedures, and training to help Saudi entrepreneurs establish small and medium enterprises."
 SAU_focus_332: "§GThe Aramco IPO§!"
 SAU_focus_332_desc: "On §H11 December 2019§!, §LSaudi Aramco§! lists on the §LTadawul§!, raising §G$25.6 billion§! initially and §G$29.4 billion§! after the greenshoe option. It becomes the §Glargest IPO in history§!, surpassing §LAlibaba's 2014 listing§!, and remains listed in §LRiyadh§! rather than §LNew York§! or §LLondon§!."
 SAU_focus_333: "§GThe Saudi Financial and Banking Laws§!"
 SAU_focus_333_desc: "The 1966 Banking Control Law and the Capital Market and Cooperative Insurance laws enacted in 2003 provide the main legal framework for Saudi finance. Together they establish clear obligations and penalties for banks, insurers, and market participants."
 SAU_focus_334: "The Capital Market Authority"
 SAU_focus_334_desc: "After The Royal Decree resulted in the establishment of the Capital Market Authority, a dedicated regulatory body was created to oversee the development and operation of the Saudi capital market."
 SAU_focus_335: "Edaa: The Securities Depository"
 SAU_focus_335_desc: "§HEdaa§!, the Securities Depository Center, will settle Tadawul trades and maintain electronic ownership records. This modern infrastructure will improve the market's reliability for domestic and foreign investors."
 SAU_focus_336: "The Saudi Logistics Hub"
 SAU_focus_336_desc: "The Kingdom will use Jeddah, Dammam, and Riyadh to develop a logistics hub linking trade routes across Asia, Africa, and Europe."
 SAU_focus_337: "Establish Joint-Stock Conglomerates (JSC)"
 SAU_focus_337_desc: "Converting major state entities into public joint-stock companies will allow citizens and institutional investors to provide capital for industrial expansion. This reduces the dependence of new projects on direct treasury funding."
 SAU_focus_338: "§GThe Saudi Sukuk Programme§!"
 SAU_focus_338_desc: "From §H2017§!, the §LMinistry of Finance§! launches a sustained sovereign sukuk programme - §G$9 billion§! in the debut international issuance alone. Sharia-compliant bonds become a primary vehicle for Saudi government finance and corporate capital raising. The Kingdom and §LMalaysia§! divide the global Islamic bond market between them."
 SAU_focus_341: "Limited Liability Company (LLC)"
 SAU_focus_341_desc: "The 2015 Companies Law, effective in 2016, establishes a modern legal structure for limited liability companies alongside joint-stock companies. Protected capital and recognized legal status will help domestic firms build supply chains and enter partnerships with international companies."
 SAU_focus_345: "The Gulf's Economic Engine"
 SAU_focus_345_desc: "The Kingdom's stronger economy will attract regional workers, financial professionals, and capital to Riyadh instead of losing them to neighboring markets."
 SAU_focus_346: "§HOne-Stop Shop§!"
 SAU_focus_346_desc: "Foreign companies once spent §Yyears§! dealing with multiple ministries to register a business. SAGIA's §HOne-Stop Shop§! combines those licensing steps at a §Gsingle counter§!, reducing delays and opportunities for §Ycorruption§!."
 SAU_focus_347: "§HOpen Strategic Sectors§!"
 SAU_focus_347_desc: "§LTelecommunications§!, §Linsurance§!, and §Lmining§! will open to foreign capital. New competitors will bring §Htechnology§! and §Hexpertise§! while forcing state-backed firms to modernize."
 SAU_focus_348: "§HForeign Investment Law of 2000§!"
 SAU_focus_348_desc: "The §YApril 2000§! Foreign Investment Law permits foreign nationals to own §G100%§! of Saudi companies in most sectors. Removing the previous ownership restrictions is intended to attract substantially more international capital."
 SAU_focus_349: "§HEconomic Cities Drive§!"
 SAU_focus_349_desc: "Six new economic cities are planned, including §LKing Abdullah Economic City§! on the Red Sea, §LKnowledge Economic City§! in Madinah, and §LPrince Abdulaziz bin Mousaed City§! in Hail. Each will be a §Hpurpose-built center§! for industry, services, and trade outside the main oil-producing areas."
 SAU_focus_350: "§HInternational Partnerships§!"
 SAU_focus_350_desc: "Joint ventures with §LGeneral Electric§!, §LDow Chemical§!, §LSumitomo§!, and §LMitsubishi§! will bring §Htechnology§! and §Hmanagerial expertise§! into the Kingdom. Saudi engineers will work with these partners and develop the skills needed to manage future projects domestically."
 SAU_focus_351: "§HTax Incentive Package§!"
 SAU_focus_351_desc: "The corporate tax rate for foreign investors will fall from §Y45%§! to §G20%§!, while personal income remains §Guntaxed§!. SAGIA will promote these terms internationally to attract foreign capital."
 SAU_focus_352: "§GSaudi Arabia, Open for Business§!"
 SAU_focus_352_desc: "Saudi Arabia has become one of the §Hworld's leading investment destinations§!. Foreign investment, economic-city development, and international joint ventures have produced a more §Gdiversified§! and §Gproductive§! economy."
 SAU_focus_356: "Ras Tanura & Abqaiq"
 SAU_focus_356_01: "Complete Nationalization"
 SAU_focus_356_01_desc: "Between §H1973 and 1980§! the Kingdom buys out the American partners of the Arabian American Oil Company. ARAMCO becomes wholly Saudi-owned - §HSaudi Aramco§!."
 SAU_focus_356_02: "The Master Gas System"
 SAU_focus_356_02_desc: "Launched in §H1975§!, the Master Gas System captures the gas once §Lflared off§! at the wellheads, feeding cheap energy and feedstock to the Kingdom's new industries."
 SAU_focus_356_03: "Saudi Petroleum Engineers"
 SAU_focus_356_03_desc: "§HKFUPM§! in Dhahran trains a generation of Saudi petroleum engineers and geologists. Aramco's workforce becomes the most §LSaudized§! in the Kingdom."
 SAU_focus_356_04: "The Ghawar Field"
 SAU_focus_356_04_desc: "§HGhawar§! - the largest conventional oil field ever discovered, stretching 280 km beneath the Eastern Province. For decades it alone produces over half the Kingdom's crude."
 SAU_focus_356_desc: "§HRas Tanura§!, the world's largest oil port, and the §HAbqaiq§! stabilization complex gather, process, and export much of Aramco's crude production. Expanding and protecting these facilities is essential to the Kingdom's oil sector."
 SAU_focus_357: "Downstream Integration"
 SAU_focus_357_desc: "Stop selling raw crude. Refineries and petrochemical complexes at §LJubail, Yanbu and Rabigh§! turn every barrel into higher-value fuels and plastics §Hat home§! - and feed SABIC."
 SAU_focus_358: "PetroRabigh & SATORP"
 SAU_focus_358_desc: "§HPetroRabigh§! (with Japan's Sumitomo, 2005) and §HSATORP§! at Jubail (with France's Total) are world-scale joint ventures that crack Saudi crude into fuels and chemicals. The Kingdom stops exporting raw barrels and starts exporting §Lproducts§!."
 SAU_focus_362: "Doctrine: Maximize Production"
 SAU_focus_362_desc: "Raise Aramco's sustainable capacity toward §H12 million barrels a day§!. Open new fields across the Eastern Province and the Empty Quarter.\n\n§GSpawns oil§! across the Kingdom and boosts fuel - the foundation of a §Hwar economy§!.\n§YMutually exclusive with the other two doctrines.§!"
 SAU_focus_363: "Doctrine: Export Powerhouse"
 SAU_focus_363_desc: "Crude flows east and west by the supertanker. As OPEC's §Hswing producer§!, the Kingdom turns its oil into the world's most reliable §Hpetrodollar§! revenue stream.\n\n§GResource export income§! and recurring treasury - the foundation of a §Hmoney economy§!.\n§YMutually exclusive with the other two doctrines.§!"
 SAU_focus_364: "New Mega-Fields"
 SAU_focus_364_desc: "§HShaybah§! (1998) deep in the Empty Quarter, §HKhurais§! (2009) and offshore §HManifa§! (2013) - a new generation of giant fields pushes Aramco's capacity ever higher. §GMore oil flows.§!"
 SAU_focus_365: "OPEC Swing Producer"
 SAU_focus_365_desc: "The Kingdom's spare production capacity allows it to act as OPEC's §Hswing producer§! and influence global oil prices. This unlocks the §HOPEC Oil Lever§! decisions to raise prices for revenue or lower them to pressure competitors."
 SAU_focus_366: "The Council of Economic & Development Affairs"
 SAU_focus_366_desc: "Created in 2015, the §HCouncil of Economic and Development Affairs§! coordinates ministries and oversees implementation of the government's economic reform program."
 SAU_focus_367: "The World's Most Valuable Company"
 SAU_focus_367_desc: "Saudi Aramco has become the §Hmost valuable company on Earth§! and remains central to the Kingdom's oil sector and public finances.\n§YRequires a national GDP over $600 billion.§!"
 SAU_focus_368: "The National Transformation Program"
 SAU_focus_368_desc: "The §HNational Transformation Program§! sets measurable delivery targets across the government and provides the administrative framework for implementing Vision 2030."
 SAU_focus_369: "Nazaha: The Anti-Corruption Authority"
 SAU_focus_369_desc: "§HNazaha§!, the National Anti-Corruption Commission, is established in 2011 to investigate financial and administrative corruption across public bodies. Its mandate strengthens oversight of government agencies and officials."
 SAU_focus_370: "The Judicial Reform of 2007"
 SAU_focus_370_desc: "King Abdullah's §H2007 judicial reform§! will codify court procedures, create a Supreme Court and specialized tribunals, and give businesses a more predictable legal system."
 SAU_focus_372: "Tayseer: Regulatory Reform"
 SAU_focus_372_desc: "The National Competitiveness Center (§HTayseer§!) will reduce the licenses, approvals, and other administrative requirements that delay investment."
 SAU_focus_373: "The Ministry of Investment (MISA)"
 SAU_focus_373_desc: "SAGIA will become the §HMinistry of Investment§! in 2020, centralizing government services and policy for foreign investors."
 SAU_focus_374: "EXPEC Research Centre"
 SAU_focus_374_desc: "The §HExploration and Petroleum Engineering Center§! will develop domestic reservoir-modelling and drilling technology. This gives Aramco advanced technical capabilities and improves its understanding of Saudi geology."
 SAU_focus_375: "Strong Saudi Banks"
 SAU_focus_375_desc: "Al Rajhi, NCB, Riyad Bank, and Samba will expand until Saudi banks rank among the world's hundred largest."
 SAU_focus_377: "Insurance for All"
 SAU_focus_377_desc: "The Kingdom will expand health, automobile, and property insurance after decades of limited market development."
 SAU_focus_378: "Grow the Capital Markets"
 SAU_focus_378_desc: "More IPOs, greater liquidity, and foreign QFI access will develop the Tadawul into a larger and more mature exchange."
 SAU_focus_379: "A Saudi Bond Market"
 SAU_focus_379_desc: "The Kingdom will develop markets for sovereign sukuk, corporate sukuk, and conventional bonds that can attract investors from London to Tokyo."
 SAU_focus_380: "The Sakani Housing Program"
 SAU_focus_380_desc: "The §HSakani§! program puts home ownership within reach of ordinary Saudis - land, finance and ready units delivered at scale."
 SAU_focus_381: "The National Housing Company"
 SAU_focus_381_desc: "The §HNational Housing Company§! will use standardized construction and master-planned developments to expand housing around major cities."
 SAU_focus_382: "The Saudi Cement Industry"
 SAU_focus_382_desc: "Saudi Cement, Yamama, and other domestic producers will supply the construction program and reduce cement imports."
 SAU_focus_384: "Glass & Building Materials"
 SAU_focus_384_desc: "The Kingdom will produce float glass, ceramics, and structural steel domestically to supply its construction sector."
 SAU_focus_387: "Vision 2030"
 SAU_focus_387_desc: "§HVision 2030§! is the Crown Prince's plan to reduce dependence on oil through tourism, industry, entertainment, and major development projects. Its public 2030 deadline makes the government directly accountable for delivering these reforms."
 SAU_focus_388: "Qiddiya & The Line"
 SAU_focus_388_desc: "§HQiddiya§! and §HThe Line§! will introduce the entertainment and urban-development concepts that precede the Kingdom's larger group of giga-projects."
 SAU_focus_389: "The Red Sea Project"
 SAU_focus_389_desc: "The §HRed Sea Project§! will develop luxury tourism along the coast and open selected Saudi islands to international visitors."
 SAU_focus_390: "King Salman International Airport"
 SAU_focus_390_2: "King Fahd International Airport"
 SAU_focus_390_2_desc: "Located in Dammam, known as the largest airport in the world by land area"
 SAU_focus_390_desc: "The new §HKing Salman International Airport§! in Riyadh will be designed for 100 million passengers a year and support the Kingdom's tourism and logistics goals."
 SAU_focus_391: "King Abdullah Port"
 SAU_focus_391_desc: "§HKing Abdullah Port§!, the region's first fully private port, will expand into a major container hub."
 SAU_focus_394: "The Digital Government Authority"
 SAU_focus_394_desc: "The §HDigital Government Authority§! will place public services on a common online platform and reduce paper-based administration."
 SAU_focus_395: "The E-Commerce Boom"
 SAU_focus_395_desc: "The growth of Salla, Noon, and other start-ups will move more Saudi retail activity online and expand the e-commerce sector."
 SAU_focus_396: "Fintech Saudi"
 SAU_focus_396_desc: "STC Pay, Tamara, and an open-banking framework will allow §HFintech Saudi§! to develop Riyadh as a regional financial-technology center."
 SAU_focus_397: "KACST: Science & Technology"
 SAU_focus_397_desc: "The §HKing Abdulaziz City for Science and Technology§! anchors the Kingdom's research base, from advanced materials to space."
 SAU_focus_398: "The Human Capability Program"
 SAU_focus_398_desc: "The §HHuman Capability Development Program§! will reform education and training to provide the skills required by a knowledge-based economy."
 SAU_focus_399: "The National Technology Development Program"
 SAU_focus_399_desc: "The National Technology Development Program funds the start-ups and deep-tech the Kingdom will need when the oil revenue thins."
 SAU_focus_400: "The Saudi Space Commission"
 SAU_focus_400_desc: "Established in 2018, the §HSaudi Space Commission§! will develop astronaut missions, launch capacity, and Saudi participation in the international space sector."
 SAU_focus_401: "Saudi Satellites & Arabsat"
 SAU_focus_401_desc: "The SaudiSat program and the Kingdom's stake in §HArabsat§! will expand Saudi communications and observation capabilities in orbit."
 SAU_focus_402: "SAMI: Saudi Arabian Military Industries"
 SAU_focus_402_desc: "§HSaudi Arabian Military Industries§! is founded in 2017 to localise defence - half the arms budget, spent at home, by 2030."
 SAU_focus_403: "GAMI: Localise the Arms Industry"
 SAU_focus_403_desc: "The §HGeneral Authority for Military Industries§! licenses and grows a domestic arms sector from almost nothing."
 SAU_focus_404: "The Saudi Drone Program"
 SAU_focus_404_desc: "Loitering munitions and reconnaissance §Hdrones§!, designed and built in the Kingdom."
 SAU_focus_405: "The National Cybersecurity Authority"
 SAU_focus_405_desc: "The §HNational Cybersecurity Authority§! (2017) hardens the Kingdom's networks after a decade of attacks on Aramco and the ministries."
 SAU_focus_406: "SDAIA: Data & Artificial Intelligence"
 SAU_focus_406_desc: "The §HSaudi Data and AI Authority§!, established in 2019, will coordinate the national AI strategy, expand supercomputing, and make government data available for practical use."
 SAU_focus_407: "The National Data Centres"
 SAU_focus_407_desc: "Low-cost electricity will support hyperscale §Hdata centers§! in the Kingdom and expand regional cloud-hosting capacity."
 SAU_focus_408: "The 5G Network"
 SAU_focus_408_desc: "STC and Mobily blanket the Kingdom in §H5G§!, among the fastest rollouts in the world."
 SAU_focus_409: "Absher & Yesser E-Government"
 SAU_focus_409_desc: "Yesser, §HAbsher§!, and Tawakkalna will place government services on mobile platforms and replace millions of in-person transactions."
 SAU_focus_410: "The Health Sector Transformation"
 SAU_focus_410_desc: "The Health Sector Transformation will organize hospitals into accountable clusters, expand the Seha virtual hospital, and increase the role of private insurance."
 SAU_focus_411: "Madrasati & Curriculum Reform"
 SAU_focus_411_desc: "The §HMadrasati§! platform and revised curricula will increase instruction in critical thinking, English, and programming while reducing reliance on rote learning."
 SAU_focus_412: "The Riyadh Metro"
 SAU_focus_412_desc: "Six lines beneath the capital - the §HRiyadh Metro§!, one of the largest urban-transport projects ever built in a single phase."
 SAU_focus_413: "The National Renewable Energy Program"
 SAU_focus_413_desc: "The §HNational Renewable Energy Program§! will develop tens of gigawatts of solar and wind generation, allowing more crude oil to be exported instead of burned for electricity."
 SAU_focus_414: "The Sakaka Solar Plant"
 SAU_focus_414_desc: "Construction of the §HSakaka§! plant began in 2018, and it was officially inaugurated in 2021 as the Kingdom's first utility-scale solar facility. Its low electricity price demonstrates the commercial potential of Saudi solar generation."
 SAU_focus_415: "The Dumat al-Jandal Wind Farm"
 SAU_focus_415_desc: "The 400-megawatt §HDumat al-Jandal§! wind farm will use strong northern winds to supply renewable electricity and become the largest wind facility in the Middle East."
 SAU_focus_416: "NEOM Green Hydrogen"
 SAU_focus_416_desc: "NEOM will host the world's largest §Hgreen-hydrogen§! plant. The project is intended to convert low-cost renewable electricity into an exportable fuel."
 SAU_focus_417: "The Civil Nuclear Program"
 SAU_focus_417_desc: "The civil nuclear program will develop reactors for electricity generation and desalination under a cautious national framework."
 SAU_focus_418: "Battery Energy Storage"
 SAU_focus_418_desc: "Grid-scale batteries will store midday solar generation for use during the evening demand peak, improving the reliability of renewable power."
 SAU_focus_419: "Modernise the National Grid"
 SAU_focus_419_desc: "A smart §Hnational grid§!, interconnected with the GCC network, will reduce blackouts and balance variable renewable generation."
 SAU_focus_420: "Ceer: The Saudi Electric Car"
 SAU_focus_420_desc: "§HCeer§!, founded in 2022, and the Lucid plant near Jeddah will establish domestic electric-vehicle production. This allows Saudi Arabia to manufacture vehicles rather than rely entirely on imports."
 SAU_focus_421: "Vision 2030 Realised"
 SAU_focus_421_desc: "§HVision 2030 has been fully realized.§! Tourism, industry, finance, and entertainment now support a diversified economy that is less dependent on oil revenue."
 SAU_focus_649: "The Standardized Interest Law"
 SAU_focus_649_desc: "The 2007 legal reforms also codify the prohibition on riba (interest). The Saudi financial system remains firmly rooted in Islamic principles, even as it modernizes. The kingdom's banks and markets operate within a framework that balances religious values with economic realities."
 SAU_focus_650: "Fractional Reserve Mandates"
 SAU_focus_650_desc: "The 2007 legal reforms also establish fractional reserve requirements for banks. This ensures that banks maintain a certain level of reserves against deposits, providing a buffer against potential financial instability."
 SAU_focus_651: "The Anti-Speculation Directives"
 SAU_focus_651_desc: "The 2007 legal reforms also introduce anti-speculation directives to prevent excessive trading and market manipulation. These measures aim to maintain market stability and protect investors from unfair practices."
 SAU_focus_652: "The Interbank Lending Code"
 SAU_focus_652_desc: "The 2007 legal reforms also establish a code for interbank lending, ensuring transparency and fairness in transactions between financial institutions."
 SAU_focus_653: "The Banking Control Law"
 SAU_focus_653_desc: "The 2007 legal reforms also establish the Banking Control Law, providing a comprehensive regulatory framework for the Saudi banking sector."
 SAU_focus_654: "Bastion of Islamic Finance"
 SAU_focus_654_desc: "The 2007 legal reforms also establish the Kingdom as a bastion of Islamic finance, providing a unique environment for Sharia-compliant financial instruments and services."
 SAU_focus_655: "The Secularization of Finance"
 SAU_focus_655_desc: "The 2007 legal reforms also introduce measures to secularize the financial sector, ensuring a clear separation between religious and commercial activities."
 SAU_focus_Defensiv_Deal_with_Pakistan: "A Defensive Deal with Pakistan"
 SAU_focus_Defensiv_Deal_with_Pakistan_desc: "Pakistan fields the largest army in the Muslim world, and its bomb is the only one a Sunni state possesses. Bind Islamabad to the defence of the Two Holy Mosques."
 SAU_focus_SABIC_indsturalization: "§GSABIC§! Industrialization"
 SAU_focus_SABIC_indsturalization_desc: "§GSABIC§! (Saudi Basic Industries Corporation) is the Kingdom's petrochemical giant, founded in 1976. It turns Saudi oil into plastics, fertilizers and chemicals - the building blocks of a modern economy."
 SAU_focus_SAGIA_Initiative_investment: "§HEstablish SAGIA§!"
 SAU_focus_SAGIA_Initiative_investment_desc: "A royal decree will establish the §LSaudi Arabian General Investment Authority§! to attract §Gforeign capital§!. SAGIA will simplify licensing, work directly with international investors, and promote §LRiyadh§! as a center for §Hglobal business§!."
 SAU_focus_Tadawul: "§GTadawul, The Saudi Stock Exchange§!"
 SAU_focus_Tadawul_desc: "§G The Kingdom of Saudi Arabia§! established Tadawul in 1980s under Saudi Company for Share Regultions. which later changed in 2005 with the Economic Boom for the Kingdom, it changed to another Establishment and renamed to Saudi Stock Exhanage. §H This focus will Implement Laws and Regulutions for Tadawul stock.§!"
 SAU_focus_The_Water_Crisis: "§HThe Water Crisis§!"
 SAU_focus_The_Water_Crisis_desc: "The Kingdom's aquifers are being depleted, §Ldesalination plants§! are under growing pressure, and per-capita water use is among the §Yhighest in the world§!. The government must formally recognize the crisis before it can implement a national response."
 SAU_Foregin_Affairs_Begin_Focus_Tree: "Saudi Foreign Policy"
 SAU_Foregin_Affairs_Begin_Focus_Tree_desc: "Saudi foreign policy must protect the monarchy, the oil-export system, and the holy cities. The Kingdom will balance relations with major powers, compete for regional influence, and respond to states that threaten its security."
 SAU_Fortify_the_Kingdom: "Fortify the Kingdom"
 SAU_Fortify_the_Kingdom_desc: "If the cold war with Iran turns hot, the blow will fall on the Eastern Province and the Strait. Harden the realm's defences for the day deterrence fails."
 SAU_Freedom_or_deat: "Freedom or Death"
 SAU_Freedom_or_deat_desc: "The Syrian war has become a test of will between Riyadh and Tehran. Commit fully to the rebellion and stake Saudi prestige on the fall of the Assad regime."
 SAU_Fund_Jordani_army: "Fund the Jordanian Army"
 SAU_Fund_Jordani_army_desc: "A strong Jordanian army guards the Kingdom's long northern flank. Underwrite Amman's soldiers so that, when it matters, they answer to Riyadh."
 SAU_Fund_LAF: "Fund the Lebanese Army"
 SAU_Fund_LAF_desc: "In Lebanon the national army is the only counterweight to Hezbollah's state within a state. Fund the LAF as a rival pole to Iran's militia."
 SAU_Fund_the_Free_Syrian_Army: "Fund the Free Syrian Army"
 SAU_Fund_the_Free_Syrian_Army_desc: "The uprising against the House of Assad is a chance to break Iran's bridge to the sea. Channel money and weapons to the rebels fighting in the name of a free Syria."
 SAU_Guardians_of_the_two_mosques: "Guardians of the Two Mosques"
 SAU_Guardians_of_the_two_mosques_desc: "The title Custodian of the Two Holy Mosques gives the King a religious claim unavailable to other Muslim rulers. The Council cannot assume the title, but it can strengthen its legitimacy by publicly supporting the King in this role."
 SAU_Hormouz_sheild: "The Hormuz Shield"
 SAU_Hormouz_sheild_desc: "Iran threatens to close the Strait at the first sign of war. Build the air and naval shield, with allied help, that keeps the tankers sailing whatever Tehran threatens."
 SAU_IMEC_India: "The India-Middle East Corridor"
 SAU_IMEC_India_desc: "A new road of rail, ports and pipelines could run from Mumbai through Arabia to the heart of Europe. Make the Kingdom the indispensable link in the corridor that bypasses the chokepoints of Iran's reach."
 SAU_Install_loyalist_in_government_military: "Install a Loyalist in the Government"
 SAU_Install_loyalist_in_government_military_desc: "A serving officer will be assigned to every important ministry with authority to countersign its decisions. Ministers will retain their titles, but the military will gain direct control over the civil service."
 SAU_internal_affairs_education_american_style_01: "King Fahd University of Petroleum and Minerals"
 SAU_internal_affairs_education_american_style_01_desc: "Science, technology, engineering, and mathematics take priority. The kingdom needs engineers, not clerics. The curriculum shifts accordingly."
 SAU_internal_affairs_education_american_style_02: "The Tatweer Education Project"
 SAU_internal_affairs_education_american_style_02_desc: "The Tatweer project will emphasize critical thinking, analysis, and debate rather than memorization. This reform changes both teaching methods and the wider educational culture."
 SAU_internal_affairs_education_american_style_03: "English Language Education"
 SAU_internal_affairs_education_american_style_03_desc: "English will be taught from primary school so that Saudi graduates can participate more effectively in the global economy."
 SAU_internal_affairs_education_american_style_04: "The Teachers' Colleges"
 SAU_internal_affairs_education_american_style_04_desc: "Teachers will receive modern training in pedagogy, classroom management, and educational technology."
 SAU_internal_affairs_education_american_style_05: "Tatweer Smart Schools"
 SAU_internal_affairs_education_american_style_05_desc: "Tatweer Smart Schools will introduce classroom tablets, online learning platforms, and AI-assisted tutoring."
 SAU_internal_affairs_free_education_01: "King Abdulaziz University"
 SAU_internal_affairs_free_education_01_desc: "Universities including King Saud, KAUST, KFUPM, and Princess Nourah University will expand across the Kingdom and improve access to higher education."
 SAU_internal_affairs_free_education_02: "King Abdullah University of Science and Technology"
 SAU_internal_affairs_free_education_02_desc: "Partnerships with MIT, Oxford, and the Sorbonne, along with foreign campuses in Saudi Arabia, will bring international academic expertise into the Kingdom."
 SAU_internal_affairs_free_education_03: "The King Abdullah Scholarship Program"
 SAU_internal_affairs_free_education_03_desc: "The King Abdullah Scholarship Program will fund thousands of Saudi students at leading foreign universities. Graduates will return with advanced qualifications and international experience."
 SAU_internal_affairs_health_welfare_01: "National Employment Survey"
 SAU_internal_affairs_health_welfare_01_desc: "Before the Kingdom can fight unemployment it must measure it. A nationwide census of the jobless maps the scale of the crisis and where it bites hardest."
 SAU_internal_affairs_health_welfare_02: "Empower the Private Sector"
 SAU_internal_affairs_health_welfare_02_desc: "Real jobs will come from business, not the state payroll. The Kingdom cuts red tape and courts investors to build an economy that can employ its own people."
 SAU_internal_affairs_health_welfare_03: "Public Works Program"
 SAU_internal_affairs_health_welfare_03_desc: "Roads, ports, and housing projects put idle hands to work immediately. Public construction becomes the quickest way to absorb the unemployed."
 SAU_internal_affairs_health_welfare_04: "Emergency Relief Funds"
 SAU_internal_affairs_health_welfare_04_desc: "Cash transfers and subsidies cushion the families hit hardest by joblessness, buying the government time and social peace while deeper reforms take hold."
 SAU_internal_affairs_health_welfare_05: "Vocational Training Institutes"
 SAU_internal_affairs_health_welfare_05_desc: "A network of technical and vocational colleges retrains young Saudis for the trades the private sector actually needs, closing the skills gap behind the crisis."
 SAU_internal_affairs_health_welfare_06: "Saudization Quotas"
 SAU_internal_affairs_health_welfare_06_desc: "Private firms are ordered to fill a rising share of their payroll with nationals. Companies grumble, but Saudis begin to enter sectors long monopolized by foreign workers."
 SAU_internal_affairs_health_welfare_07: "Foreign Worker Levy"
 SAU_internal_affairs_health_welfare_07_desc: "A levy on every expatriate work permit makes foreign labour more expensive and funds the jobs programs. The cost of the easy option finally starts to bite."
 SAU_internal_affairs_health_welfare_08: "Small Business Loans"
 SAU_internal_affairs_health_welfare_08_desc: "Soft loans and grants seed a generation of Saudi entrepreneurs. Small and medium enterprises become the engine that creates jobs the giants never could."
 SAU_internal_affairs_health_welfare_09: "Subsidized Employment"
 SAU_internal_affairs_health_welfare_09_desc: "The state pays part of the wage for every national a company hires. It is expensive, but it gets young Saudis their first foot on the ladder."
 SAU_internal_affairs_health_welfare_10: "Regional Development Fund"
 SAU_internal_affairs_health_welfare_10_desc: "Investment is steered to the poorer provinces where joblessness runs deepest, spreading opportunity beyond Riyadh and the oil coast."
 SAU_internal_affairs_health_welfare_11: "Government Hiring Drive"
 SAU_internal_affairs_health_welfare_11_desc: "Ministries and agencies open their doors to graduates. The public payroll swells and soaks up unemployment, even as everyone knows it cannot grow forever."
 SAU_internal_affairs_health_welfare_12: "Civil Service Expansion"
 SAU_internal_affairs_health_welfare_12_desc: "New departments, municipalities, and state bodies are stood up across the Kingdom, each one a fresh source of secure, salaried jobs for nationals."
 SAU_internal_affairs_health_welfare_13: "State Enterprise Jobs"
 SAU_internal_affairs_health_welfare_13_desc: "State-owned giants in oil, mining, and utilities are directed to hire and train Saudis at scale, turning national champions into employers of first resort."
 SAU_internal_affairs_health_welfare_14: "The Full Employment Pledge"
 SAU_internal_affairs_health_welfare_14_desc: "The government stakes its legitimacy on a promise of work for every Saudi who wants it. The pledge unites the reform effort and raises the stakes of failure."
 SAU_internal_affairs_health_welfare_15: "Women in the Workforce"
 SAU_internal_affairs_health_welfare_15_desc: "Cautiously, the Kingdom opens new sectors to female employment, nearly doubling the pool of national talent and easing the labour shortage the private sector complains of."
 SAU_internal_affairs_health_welfare_16: "Private Sector Incentives"
 SAU_internal_affairs_health_welfare_16_desc: "Tax breaks, training subsidies, and streamlined permits reward firms that hire and develop nationals, making Saudization profitable rather than merely mandatory."
 SAU_internal_affairs_primary_education_01: "Secondary Education Expansion"
 SAU_internal_affairs_primary_education_01_desc: "High schools expand. Vocational training grows. Every Saudi teenager has access to secondary education - academic or vocational."
 SAU_internal_affairs_primary_education_02: "Technical and Vocational Training Corporation"
 SAU_internal_affairs_primary_education_02_desc: "Technical colleges train plumbers, electricians, mechanics, and welders. Not every Saudi needs a university degree. The economy needs skilled trades."
 SAU_internal_foregin_affairs: "Saudi Internal Affairs"
 SAU_internal_foregin_affairs_desc: "The Kingdom's internal policy will address public security, education, healthcare, and economic welfare. These systems provide the basis for long-term stability and development."
 SAU_internal_foregin_affairs_education: "Confront the Literacy Crisis"
 SAU_internal_foregin_affairs_education_American_style: "British Curriculum Education Model"
 SAU_internal_foregin_affairs_education_American_style_desc: "The Saudi education system adopts The British Curriculum Model curricula. Critical thinking, liberal arts, and scientific inquiry replace rote memorization. The ulema object; the economy benefits."
 SAU_internal_foregin_affairs_education_desc: "In 2000, more than one in five Saudis cannot read - a §Hliteracy rate of just 79%§!. An oil kingdom cannot modernize on the backs of an illiterate workforce, and low literacy drags down research, productivity and the offices that run the state. The Kingdom launches a national drive to teach its people - and must choose between an §LAmerican-style§! system and a §Lfree, universal§! one.\n\n§GEvery education focus raises the literacy rate§! toward full literacy."
 SAU_internal_foregin_affairs_education_end: "Education Transformation Complete"
 SAU_internal_foregin_affairs_education_end_desc: "The education reform program has expanded universities, modernized curricula, and raised educational attainment across the Kingdom."
 SAU_internal_foregin_affairs_free_education: "Secondary Tracks Education System - Domstic"
 SAU_internal_foregin_affairs_free_education_desc: "Education will be free from kindergarten through doctoral study. This guarantees every Saudi child access to schooling and invests public funds in the national workforce."
 SAU_internal_foregin_affairs_health: "The Saudization Drive"
 SAU_internal_foregin_affairs_health_and_wafare: "Confront the Jobs Crisis"
 SAU_internal_foregin_affairs_health_and_wafare_desc: "A young, fast-growing population is entering a workforce with far too few jobs for nationals, while the private sector runs on cheap foreign labour. The government makes unemployment a central priority and opens a campaign of welfare relief and Saudization."
 SAU_internal_foregin_affairs_health_desc: "The state commits to replacing foreign labour with Saudi nationals across the economy. It is the defining labour policy of the era and the foundation of every reform that follows."
 SAU_internal_foregin_affairs_healthcare_over_warfare: "Jobs Through the State"
 SAU_internal_foregin_affairs_healthcare_over_warfare_desc: "The state takes direct responsibility for employment, expanding the public sector, public works, and government-backed projects to put Saudis to work. The unemployment crisis is broken."
 SAU_internal_foregin_affairs_police: "GIP"
 SAU_internal_foregin_affairs_police_desc: "GIP professionalizes. Training, equipment, and procedures meet international standards. The kingdom's internal security becomes more effective - and more visible."
 SAU_internal_foregin_affairs_wafare_over_healthcare: "Jobs Through the Market"
 SAU_internal_foregin_affairs_wafare_over_healthcare_desc: "Saudization quotas, private-sector incentives, and a tighter grip on foreign labour push companies to hire nationals. The market absorbs the workforce and the unemployment crisis is broken."
 SAU_Investment_Deal_with_Russia: "OPEC+ Agreement"
 SAU_Investment_Deal_with_Russia_desc: "Moscow and Riyadh are rivals in the oil market and on opposite sides in Syria, yet together they can set the price of crude. Strike the bargain that keeps the cartel of two intact."
 SAU_Iran_focuses_copy6_copy4: "Command of the Gulf"
 SAU_Iran_focuses_copy6_copy4_desc: "With Iran's navy broken and the Strait held open, the Kingdom stands master of the Gulf's waters. The long contest for the sea is won."
 SAU_Iraq_war: "The Iraq War"
 SAU_Iraq_war_desc: "American tanks are rolling toward Baghdad, and the old order in Mesopotamia is about to be swept away. The Kingdom must prepare for whatever rises from the wreckage."
 SAU_King_in_name_heirinUniform: "King in Name, Heir in Uniform"
 SAU_King_in_name_heirinUniform_desc: "The throne will remain, but the heir will be both a prince and a serving officer acceptable to the Council. This compromise preserves the dynasty while placing the succession under military supervision."
 SAU_Kingdom_unbeholden: "The Kingdom Unbeholden"
 SAU_Kingdom_unbeholden_desc: "The Kingdom will reject foreign security guarantees and patrons and rely entirely on its own defense. This is the costliest option, but it preserves full strategic independence."
 SAU_Maritical_law_issues: "Martial Law Issues"
 SAU_Maritical_law_issues_desc: "Military authorities will control public assembly, movement between provinces, and the press. Because the Kingdom has no constitution to suspend, these restrictions can be imposed directly by decree."
 SAU_Mecca_province_secure_support: "Secure Support in the Mecca Province"
 SAU_Mecca_province_secure_support_desc: "Makkah Province includes Jeddah, the pilgrimage centers, influential merchant families, and a Hejazi identity that predates Saudi rule. The Council will use patronage, security forces, and political concessions to secure the province."
 SAU_Mecca_summit: "The Mecca Summit"
 SAU_Mecca_summit_desc: "The Kingdom will host negotiations in Mecca and use the summit to strengthen Riyadh's position as a mediator in the Muslim world."
 SAU_Memories_of_Khafji: "Memories of Khafji"
 SAU_Memories_of_Khafji_desc: "In 1991 Iraqi armour briefly seized a Saudi border town, a humiliation the Kingdom never forgot. Let the memory of Khafji steel the realm's defences against any repeat."
 SAU_Military_take_over: "§RThe Military Takeover§!"
 SAU_Military_take_over_desc: "The armed forces have seized the ministries, broadcasting authority, and approaches to the royal palaces. The National Guard created to prevent such a coup has been surrounded, leaving the military in control of the Kingdom."
 SAU_modernisation_balance_of_power_category: "§HKingdom's Future§!"
 SAU_modernisation_balance_of_power_category_desc: "Two visions struggle for the soul of the §LKingdom of Saudi Arabia§!. The §Rtraditionalist§! camp - the §LCouncil of Senior Scholars§!, the §Lroyal court§!, the §Ltribal elders§! - guards the old ways. The §Gliberalisation§! camp - the technocrats, the foreign-trained engineers, the §LVision 2030§! advocates - presses for openness, reform, and a place at the modern world's table. The balance shifts with every focus completed and every decision taken."
 SAU_Monarchy_under_military_rule: "The Monarchy under Military Rule"
 SAU_Monarchy_under_military_rule_desc: "The King will remain in the palace and continue to sign decrees, but the Council will control the armed forces and determine government policy. The monarchy survives as a formal institution without independent power."
 SAU_navy_01: "The Royal Saudi Naval Forces"
 SAU_navy_01_desc: "Build up the Royal Saudi Naval Forces (RSNF), split between two seas, to guard the Kingdom's long coasts."
 SAU_navy_02: "Eastern Fleet (Jubail)"
 SAU_navy_02_desc: "Base the Eastern Fleet at Jubail to dominate the Arabian Gulf and protect the oil terminals."
 SAU_navy_03: "Western Fleet (Jeddah)"
 SAU_navy_03_desc: "Base the Western Fleet at Jeddah to secure the Red Sea coast and the approaches to Bab-el-Mandeb."
 SAU_navy_04: "Sawari II Frigate Programme"
 SAU_navy_04_desc: "Acquire the French-built Al Riyadh-class frigates under the Sawari II programme, the fleet's most powerful ships."
 SAU_navy_05: "Badr-class Corvettes"
 SAU_navy_05_desc: "Field the US-built Badr-class corvettes for patrol, escort and coastal strike."
 SAU_navy_08: "Royal Saudi Marines"
 SAU_navy_08_desc: "Raise a Royal Saudi Marine force for amphibious landings and the defense of the coast and islands."
 SAU_navy_09: "King Faisal Naval Base"
 SAU_navy_09_desc: "Develop the great naval bases at Jeddah and Jubail to sustain a two-fleet navy."
 SAU_Neom_Aqaba_Synergy: "NEOM-Aqaba Synergy"
 SAU_Neom_Aqaba_Synergy_desc: "Where the Saudi megacity of NEOM meets the Jordanian port of Aqaba, a single economic zone could straddle the gulf between them. Knit the two shores into one engine of growth."
 SAU_Never_Trust_French: "Deal with The French"
 SAU_Never_Trust_French_desc: "Paris sells weapons to anyone and lectures everyone, but business is business. A carefully fenced investment pact lets the Kingdom profit from French industry while keeping better options within reach."
 SAU_New_Iraq_Alighment_with_us: "A New Iraqi Alignment"
 SAU_New_Iraq_Alighment_with_us_desc: "Years of patient diplomacy and patronage bear fruit: Baghdad tilts, at last, toward Riyadh. Anchor the new alignment before it can slip back toward Tehran."
 SAU_Non_NATO_Ally: "Major Non-NATO Ally"
 SAU_Non_NATO_Ally_desc: "Short of a treaty alliance, the closest a nation can stand beside the Atlantic powers is the status of a privileged partner. Secure for the Kingdom the standing of a major non-NATO ally."
 SAU_Normalzation_with_zionist: "The Palestine Question"
 SAU_Normalzation_with_zionist_10: "The Cause Above All"
 SAU_Normalzation_with_zionist_10_desc: "The Kingdom will make support for Palestine central to its claim of leadership in the Muslim world and to its role as Custodian of the Two Holy Mosques."
 SAU_Normalzation_with_zionist_11: "Open the Backchannel"
 SAU_Normalzation_with_zionist_11_desc: "Quiet men in third countries, deniable and patient, sound out what Tel Aviv might accept before either side says anything aloud."
 SAU_Normalzation_with_zionist_12: "The Arab Peace Initiative"
 SAU_Normalzation_with_zionist_12_desc: "The Kingdom's own plan, offered at Beirut in 2002 and never withdrawn: full normalization with the entire Arab world in exchange for an independent Palestine on the 1967 lines. Riyadh puts it back on the table, formally and in writing."
 SAU_Normalzation_with_zionist_13: "Sweeten the Deal"
 SAU_Normalzation_with_zionist_13_desc: "Investment funds, technology corridors, and open skies. Riyadh shows Tel Aviv what peace with the Gulf's largest economy is worth."
 SAU_Normalzation_with_zionist_14: "The Talks Collapse"
 SAU_Normalzation_with_zionist_14_desc: "Israel would not pay the price, and Riyadh would not lower it. The delegations fly home, and the question returns to its old answer."
 SAU_Normalzation_with_zionist_15: "The Riyadh Accords"
 SAU_Normalzation_with_zionist_15_desc: "Israel has accepted the Arab Peace Initiative. Recognition for statehood on the 1967 lines, with the new Palestine guaranteed by Saudi Arabia and Jordan: the deal of the century, signed in Riyadh."
 SAU_Normalzation_with_zionist_16: "Embassies and Trade"
 SAU_Normalzation_with_zionist_16_desc: "Flights, trade missions, and capital flow between Riyadh and Tel Aviv. Peace begins to pay for itself."
 SAU_Normalzation_with_zionist_17: "Silicon and Sand"
 SAU_Normalzation_with_zionist_17_desc: "Israeli technology and Saudi capital make natural partners. Joint ventures in cyber, water, and agritech take root in both deserts."
 SAU_Normalzation_with_zionist_18: "Double Down on Palestine"
 SAU_Normalzation_with_zionist_18_desc: "If Israel will not grant a state, the Kingdom will build one anyway: money, institutions, and Saudi weight behind Ramallah."
 SAU_Normalzation_with_zionist_19: "Rally the Arab League"
 SAU_Normalzation_with_zionist_19_desc: "The failed talks proved the point to every wavering capital. Riyadh gathers the League behind a single line: no normalization without Palestine."
 SAU_Normalzation_with_zionist_2: "No Peace Without Palestine"
 SAU_Normalzation_with_zionist_20: "The Fate of Palestine"
 SAU_Normalzation_with_zionist_20_desc: "Whether by treaty or by defiance, the Kingdom has bound itself to Palestine's future. The Custodian of the Two Holy Mosques does not abandon Jerusalem."
 SAU_Normalzation_with_zionist_2_desc: "There will be no embassy in Tel Aviv while Palestine remains occupied. The Kingdom holds the line the Arab world drew in 2002."
 SAU_Normalzation_with_zionist_3: "Normalization with Conditions"
 SAU_Normalzation_with_zionist_3_desc: "Riyadh's price has not changed since the Arab Peace Initiative: recognition for statehood. If Israel wants the Kingdom's hand, it will accept an independent Palestine."
 SAU_Normalzation_with_zionist_4: "Normalization Without Conditions"
 SAU_Normalzation_with_zionist_4_desc: "The Kingdom will recognize Israel without requiring concessions on Palestine. This will improve relations with the United States and encourage trade, but it will provoke substantial opposition across the Arab world."
 SAU_Normalzation_with_zionist_5: "Champion the Palestinian Cause"
 SAU_Normalzation_with_zionist_5_desc: "Saudi money keeps the lights on in Ramallah and the cause alive in every Arab capital."
 SAU_Normalzation_with_zionist_6: "Strengthen the Resistance"
 SAU_Normalzation_with_zionist_6_desc: "The factions that resist occupation will not want for funds or friends while Riyadh stands behind them."
 SAU_Normalzation_with_zionist_7: "Boycott Israeli Goods"
 SAU_Normalzation_with_zionist_7_desc: "Not a riyal of Saudi money will touch an Israeli shelf. The Kingdom's market closes its doors."
 SAU_Normalzation_with_zionist_8: "Pressure the Normalizers"
 SAU_Normalzation_with_zionist_8_desc: "Any Arab government tempted by Tel Aviv's handshake will feel Riyadh's displeasure first. The ranks hold because the Kingdom holds them."
 SAU_Normalzation_with_zionist_9: "An Arab Consensus"
 SAU_Normalzation_with_zionist_9_desc: "From Rabat to Baghdad, the Kingdom forges one Arab voice on Israel: no recognition, no relations, no exceptions."
 SAU_Normalzation_with_zionist_desc: "Every Arab capital has an answer to the Israeli question; none agree. Riyadh must now choose its own: peace without conditions, peace with a price, or no peace at all."
 SAU_Open_deal_with_SK: "A Deal with South Korea"
 SAU_Open_deal_with_SK_desc: "Korean shipyards, reactors and construction giants built much of the modern Gulf. Court Seoul as a partner in nuclear power, defence industry and the megaprojects of Vision 2030."
 SAU_Open_trade__China: "§GSaudi§!-§RChina§! Deal"
 SAU_Open_trade__China_desc: "Saudi Arabia Offer A Deal with China to invest in Kingdom's soil, which include a lot of Energy and More stuff, by China and Chinese Companies."
 SAU_Operation_Red_Gulf: "Operation Red Gulf"
 SAU_Operation_Red_Gulf_desc: "Should the cold war ignite, the Kingdom must be ready to carry the fight to the Iranian shore. Draw up the plans for a decisive campaign in the waters of the Gulf."
 SAU_Palestine: "Champion the Palestinian Cause"
 SAU_Palestine_2: "Bankroll the Resistance"
 SAU_Palestine_2_desc: "Words are cheap. Channel real money and arms to the Palestinian factions so that Saudi influence, not Iranian, shapes the struggle."
 SAU_Palestine_3: "Arm the Militants"
 SAU_Palestine_3_desc: "Back the armed factions outright. Riyadh becomes the paymaster of the gun, contesting Tehran for the loyalty of every fighter in Gaza."
 SAU_Palestine_3_1: "Guardian of Al-Aqsa"
 SAU_Palestine_3_1_desc: "Whichever path was taken, the Kingdom now stands as the foremost patron of the Palestinian people, its prestige across the Ummah unrivalled."
 SAU_Palestine_4: "Broker a Two-State Peace"
 SAU_Palestine_4_desc: "The Kingdom will mediate a two-state settlement. A successful Saudi-sponsored agreement would expand Riyadh's diplomatic influence across the Arab world."
 SAU_Palestine_desc: "Palestine remains one of the most politically important issues in the Arab world. Supporting the Palestinian cause will strengthen the Kingdom's claim to Muslim leadership and counter Iranian influence."
 SAU_Partion_The_Yemen: "Ceasefire with Houthi"
 SAU_Partion_The_Yemen_desc: "A Ceasefire with Houthi, to prevent anymore damaged to us"
 SAU_Pipelines_for_Saudi_arabia: "The Great Pipeline Game"
 SAU_Pipelines_for_Saudi_arabia_desc: "Most Saudi oil exports pass through the Strait of Hormuz, leaving them vulnerable to Iranian disruption. The Kingdom will consider three alternative pipeline routes: through Yemen to the Arabian Sea, through Syria to the Mediterranean, or through Iraq and Turkey to Europe; each crosses an unstable region and competes with Russian energy interests."
 SAU_Prepare_Defenseiv_against_Saddem: "Prepare Defences against Saddam"
 SAU_Prepare_Defenseiv_against_Saddem_desc: "A cornered Saddam is a dangerous one. Fortify the northern frontier against the army that once stood in Kuwait, a day's drive from the oilfields."
 SAU_proclaim_the_republic_aljumhuria: "Proclaim The Republic"
 SAU_proclaim_the_republic_aljumhuria_desc: "The Council will formally abolish the monarchy and proclaim a republic. The new state's institutions remain unsettled, but the Al Saud throne will not survive the declaration."
 SAU_Reaffirming_the_quincy_aggreemnet: "Reaffirming the Quincy Agreement"
 SAU_Reaffirming_the_quincy_aggreemnet_desc: "Roosevelt and Abdulaziz established the basis of Saudi-US relations aboard the USS Quincy in February 1945: American security support in exchange for reliable Saudi oil. The Council will seek confirmation that this arrangement applies to the Saudi state rather than only to the monarchy."
 SAU_Regency_decree: "The Regency Decree"
 SAU_Regency_decree_desc: "The King will sign a decree transferring executive and defense powers to the Council for an unspecified period of incapacity. The decree preserves a legal appearance while placing the government under military control."
 SAU_remove_water_crisis_level2_to_1: "§HMaster the Crisis§!"
 SAU_remove_water_crisis_level2_to_1_desc: "Through domestic investment or foreign expertise, the Kingdom has brought its water supply under §Gcontrol§!. Aquifers remain finite and desalination remains expensive, but the immediate risk of a §Yhydraulic collapse§! has receded."
 SAU_rep_shia_arm_faithful: "Arm the Faithful"
 SAU_rep_shia_arm_faithful_desc: "Distribute weapons and training to the militias of the revolution."
 SAU_rep_shia_brigades: "Hezbollah Brigades"
 SAU_rep_shia_brigades_desc: "Forge the militias into disciplined brigades modelled on the Lebanese resistance."
 SAU_rep_shia_civil_rights: "Shia Civil Rights"
 SAU_rep_shia_civil_rights_desc: "Guarantee the Shia community equal standing before the law, ending decades of official discrimination."
 SAU_rep_shia_coexistence: "Sectarian Coexistence"
 SAU_rep_shia_coexistence_desc: "Forge a national compact between Sunni and Shia, founded on shared citizenship."
 SAU_rep_shia_const_republic: "The Constitutional Shia Republic"
 SAU_rep_shia_const_republic_2: "The Federal Welfare State"
 SAU_rep_shia_const_republic_2_desc: "Build out the institutions of the constitutional republic: a federal welfare state that binds the communities together through shared prosperity and the rule of law."
 SAU_rep_shia_const_republic_desc: "Crown the moderate path with a constitutional republic securing Shia rights within a pluralist order."
 SAU_rep_shia_eastern_province: "Develop the Eastern Province"
 SAU_rep_shia_eastern_province_desc: "Channel the republic's oil wealth into the long-neglected Shia heartland of the east."
 SAU_rep_shia_export_revolution: "Export the Revolution"
 SAU_rep_shia_export_revolution_desc: "Carry the revolution beyond Arabia's borders to the Shia of the Gulf."
 SAU_rep_shia_federal_autonomy: "Federal Autonomy"
 SAU_rep_shia_federal_autonomy_desc: "Devolve real power to the Shia provinces within a federal, pluralist union."
 SAU_rep_shia_iran_alignment: "Alliance with Iran"
 SAU_rep_shia_iran_alignment_desc: "Bind the new state to Tehran, patron of the Shia revolution across the region."
 SAU_rep_shia_islamic_republic: "The Islamic Republic of Arabia"
 SAU_rep_shia_islamic_republic_2: "The Revolutionary State"
 SAU_rep_shia_islamic_republic_2_desc: "The Islamic Republic will centralize its institutions, militias, and clergy under a disciplined revolutionary government aligned with the resistance."
 SAU_rep_shia_islamic_republic_desc: "Proclaim the Islamic Republic under the guardianship of the jurist, aligned with the axis of resistance."
 SAU_rep_shia_national_dialogue: "National Dialogue"
 SAU_rep_shia_national_dialogue_desc: "Seek redress for the Shia through negotiation and the ballot box rather than confrontation."
 SAU_rep_shia_parliament: "The Parliamentary Path"
 SAU_rep_shia_parliament_desc: "Commit the movement to an elected assembly, contesting power openly as a loyal opposition."
 SAU_rep_shia_reconciliation: "Reconcile with the Republic"
 SAU_rep_shia_reconciliation_desc: "Bury old grievances and accept a place within the national framework, trading revolution for representation."
 SAU_rep_shia_religious_freedom: "Guarantee Religious Freedom"
 SAU_rep_shia_religious_freedom_desc: "Protect the rites and seminaries of every community under a tolerant, secular republic."
 SAU_rep_shia_republic_end: "The Republic Endures"
 SAU_rep_shia_republic_end_desc: "Whichever road it took, the Shia republic has consolidated its hold on Arabia. The provisional order gives way to a permanent state, ready to take its place among the powers of the region."
 SAU_rep_shia_resistance: "The Resistance"
 SAU_rep_shia_resistance_desc: "Rally the faithful to armed struggle, in the spirit of the Hejaz Hezbollah."
 SAU_rep_shia_vanguard: "The Revolutionary Vanguard"
 SAU_rep_shia_vanguard_desc: "Place the armed clergy at the head of the state, above party and parliament."
 SAU_rep_shia_wilayat_faqih: "Wilayat al-Faqih"
 SAU_rep_shia_wilayat_faqih_desc: "Enshrine the guardianship of the jurist, vesting ultimate authority in the supreme religious leader."
 SAU_republic_nda_party_1: "The National Charter"
 SAU_republic_nda_party_1_desc: "Proclaim a written constitution that binds ruler and ruled alike to the law."
 SAU_republic_nda_party_10: "Liberalize the Economy"
 SAU_republic_nda_party_10_desc: "Throw open the closed economy to competition and private enterprise."
 SAU_republic_nda_party_11: "Privatize the State Sector"
 SAU_republic_nda_party_11_desc: "Sell the bloated state firms into private hands and let the market work."
 SAU_republic_nda_party_12: "Open to Foreign Investment"
 SAU_republic_nda_party_12_desc: "Welcome foreign capital to build the factories the kingdom never had."
 SAU_republic_nda_party_13: "Diversify Beyond Oil"
 SAU_republic_nda_party_13_desc: "Wean the republic off crude, building an economy that outlasts the wells."
 SAU_republic_nda_party_14: "Secure Property Rights"
 SAU_republic_nda_party_14_desc: "Enshrine the right to own, and the right to keep what one has built."
 SAU_republic_nda_party_15: "Free Trade Agreements"
 SAU_republic_nda_party_15_desc: "Sign open-trade pacts that bind Arabia to the markets of the world."
 SAU_republic_nda_party_16: "An Independent Central Bank"
 SAU_republic_nda_party_16_desc: "Free the monetary authority from political meddling."
 SAU_republic_nda_party_17: "Champion the Private Sector"
 SAU_republic_nda_party_17_desc: "Back the entrepreneurs and small businesses that drive a free economy."
 SAU_republic_nda_party_18: "Equality for Women"
 SAU_republic_nda_party_18_desc: "Strike down the guardianship laws and seat women as equals in public life."
 SAU_republic_nda_party_19: "Reform the Schools"
 SAU_republic_nda_party_19_desc: "Replace rote clerical instruction with a modern, secular curriculum."
 SAU_republic_nda_party_2: "An Elected Majlis al-Shura"
 SAU_republic_nda_party_2_desc: "Transform the appointed Consultative Council into a freely elected national parliament."
 SAU_republic_nda_party_20: "Freedom of Religion"
 SAU_republic_nda_party_20_desc: "Guarantee every faith the right to worship freely and in the open."
 SAU_republic_nda_party_21: "A Secular Republic"
 SAU_republic_nda_party_21_desc: "Draw a firm line between mosque and state."
 SAU_republic_nda_party_22: "Empower Civil Society"
 SAU_republic_nda_party_22_desc: "Legalize the unions, charities, and associations that knit a free people together."
 SAU_republic_nda_party_23: "Guarantee Labor Rights"
 SAU_republic_nda_party_23_desc: "Secure the right to organize, to strike, and to a fair wage."
 SAU_republic_nda_party_24: "A Human Rights Charter"
 SAU_republic_nda_party_24_desc: "Bind the republic to the universal rights of all its people."
 SAU_republic_nda_party_25: "Realign with the West"
 SAU_republic_nda_party_25_desc: "Turn the republic toward Washington and Brussels as a partner among democracies."
 SAU_republic_nda_party_26: "Mend the Gulf"
 SAU_republic_nda_party_26_desc: "Reconcile with the Gulf states as a fellow Arab nation, monarchies and all."
 SAU_republic_nda_party_27: "Join the World's Institutions"
 SAU_republic_nda_party_27_desc: "Take Arabia's seat in the councils of the international order."
 SAU_republic_nda_party_28: "Open the Borders"
 SAU_republic_nda_party_28_desc: "Ease the flow of people and goods across a freer frontier."
 SAU_republic_nda_party_29: "An Arab Democratic League"
 SAU_republic_nda_party_29_desc: "Rally the democracies of the Arab world under a single banner led from Riyadh."
 SAU_republic_nda_party_3: "The First Free Elections"
 SAU_republic_nda_party_3_desc: "Open the ballot to every citizen and let the people choose their own government."
 SAU_republic_nda_party_4: "An Independent Judiciary"
 SAU_republic_nda_party_4_desc: "Free the courts from the palace, founding a judiciary answerable only to the law."
 SAU_republic_nda_party_5: "Freedom of the Press"
 SAU_republic_nda_party_5_desc: "Lift the censor's hand from the newspapers and the airwaves."
 SAU_republic_nda_party_7: "The Anti-Corruption Commission"
 SAU_republic_nda_party_7_desc: "Found an independent watchdog to root the graft out of high office."
 SAU_republic_nda_party_8: "Decentralize the Provinces"
 SAU_republic_nda_party_8_desc: "Devolve real power to elected provincial councils across the realm."
 SAU_republic_nda_party_9: "Limit the Executive"
 SAU_republic_nda_party_9_desc: "Bind the presidency with term limits, so that no leader rules for life."
 SAU_republic_provisional_government: "The Provisional Government"
 SAU_republic_provisional_government_1: "Convene the National Assembly"
 SAU_republic_provisional_government_1_desc: "The provisional government will convene the new republic's political parties and determine which movement will lead the permanent state."
 SAU_republic_provisional_government_2: "The Communist Party"
 SAU_republic_provisional_government_2_desc: "The Saudi Communist Party spent four decades underground, in exile, or in prison. Its surviving leadership returns to Riyadh with a small but well-organized movement."
 SAU_republic_provisional_government_3: "The National Democratic Assembly"
 SAU_republic_provisional_government_3_desc: "Hand the new republic to the liberal democrats of the National Democratic Assembly. They promise a written constitution, an elected parliament, and an open economy answerable to the ballot box."
 SAU_republic_provisional_government_4: "The Arab Ba'ath Party"
 SAU_republic_provisional_government_4_desc: "Hand the republic to the Arab Socialist Ba'ath Party, the secular pan-Arab nationalists who dream of a single united Arab nation."
 SAU_republic_provisional_government_5: "The Islamic Parties"
 SAU_republic_provisional_government_5_desc: "Sahwa clerics, Muslim Brotherhood networks, and Islamic charitable societies survived repeated bans and now demand a role in the post-revolutionary government."
 SAU_republic_provisional_government_desc: "The Transitional National Council governs a country without a constitution, without elections, and without a settled future. Its first task is simply to keep order and to lay the groundwork for the republic that will follow."
 SAU_Return_of_the_relationship: "Restoration of Relations"
 SAU_Return_of_the_relationship_desc: "Years of severed ties give way, cautiously, to reopened embassies. Manage the dangerous detente with the Islamic Republic without surrendering the Kingdom's interests."
 SAU_royal_hub: "§HRulers of Arabia Heart§!"
 SAU_royal_hub_desc: "The Al Saud dynasty has ruled central Arabia for generations. Since King Fahd's 1995 stroke, §Yeffective power§! has shifted to senior princes competing to control the succession."
 SAU_Sacation_in_southern_bloc: "Sanction the Southern Bloc"
 SAU_Sacation_in_southern_bloc_desc: "Choke the finances of the Iran-aligned factions across the region. Sanctions and blacklists starve Tehran's friends of the money that keeps them loyal."
 SAU_Saddem_Fell: "Saddam Falls"
 SAU_Saddem_Fell_desc: "The statues come down and the regime collapses, leaving a vacuum where a great Arab state once stood. Riyadh must move before Tehran fills it."
 SAU_Saddem_Still_in_power: "Saddam Endures"
 SAU_Saddem_Still_in_power_desc: "The Baathist regime survives the storm, wounded but unbroken. The old enemy remains across the northern border, and the Kingdom must live with the tyrant of Baghdad a while longer."
 SAU_Saudi_Economic_Tree: "Saudi Economic Focus Tree"
 SAU_Saudi_Economic_Tree_desc: "A small number of ministries and Saudi Aramco control most state revenue. Economic policy must now develop non-oil industry, invest beyond Riyadh, and increase Saudi participation in the workforce."
 SAU_saudi_own_companies_water: "§HNational Water Company§!"
 SAU_saudi_own_companies_water_desc: "Water is too §Hstrategic§! to outsource. The Kingdom invests in §LSaudi-owned§! desalination operators, training a new generation of national engineers and keeping the profits at home. The build-out is §Yslower§! - but the sovereignty is §Gabsolute§!."
 SAU_Saudi_Spanish_Parthnership: "A Saudi-Spanish Partnership"
 SAU_Saudi_Spanish_Parthnership_desc: "Spanish yards build the Kingdom's new corvettes and Spanish firms its high-speed rail to Mecca. Cultivate Madrid as a useful European partner outside the usual circle."
 SAU_Sermons_from_the_ministry: "Sermons from the Ministry"
 SAU_Sermons_from_the_ministry_desc: "The Ministry will revise the Friday khutba distributed to mosques throughout the Kingdom. A common text read from roughly fifteen thousand pulpits will give the government direct influence over religious messaging."
 SAU_shia_clergy: "Recognize the Shia Clergy"
 SAU_shia_clergy_desc: "Grant the §LShia ulema§! official standing alongside the Wahhabi establishment.\n\n§G+Stability, +Shia Population§!."
 SAU_shia_crackdown: "Crackdown on Shia Dissent"
 SAU_shia_crackdown_desc: "Answer dissent with the §LMabahith§! and the §LNational Guard§!. The Shia will be watched, contained and pushed to the margins - and the Sunni majority will rest easier for it.\n\n§R+Shia Resistance§!, §R-Shia Population§!, §G+Stability, +War Support§!."
 SAU_shia_dialogue: "Sunni-Shia Dialogue"
 SAU_shia_dialogue_desc: "A national dialogue to begin healing fourteen centuries of schism.\n\n§G-Shia Resistance, +Stability, +Shia Population§!."
 SAU_shia_eastern_investment: "Invest in the Eastern Province"
 SAU_shia_eastern_investment_desc: "Pour petrodollars into the Shia heartland - roads, hospitals, ports.\n\n§G+Stability, +Shia Population§!."
 SAU_shia_eastern_purge: "Resettling the Eastern Province"
 SAU_shia_eastern_purge_desc: "The Shia question is settled at last. The §LEastern Province§! is quieted through patient resettlement for a generation.\n\n§R--Shia Population§!, §Gresistance broken§!, §G++Stability§!."
 SAU_shia_economic_inclusion: "Economic Inclusion"
 SAU_shia_economic_inclusion_desc: "Share the wealth of the oilfields with the people who live above them. The sectarian wound finally begins to close.\n\n§Gresistance ended, +Stability, +Shia Population§!."
 SAU_shia_education: "Equal Educational Access"
 SAU_shia_education_desc: "Build schools and universities in §LQatif§! and §LAl-Ahsa§! to match those of the Najd.\n\n§G+Stability, +Shia Population§!."
 SAU_shia_embrace: "Embrace Shia Citizens"
 SAU_shia_embrace_desc: "Welcome the Shia as full citizens - and begin a journey that could end with the §LHouse of Saud§! itself reconsidering the faith it was built to suppress.\n\n§G+Shia Population, -Shia Resistance§!."
 SAU_shia_harmony: "Sectarian Harmony"
 SAU_shia_harmony_desc: "Sunni and Shia, one nation under one crown.\n\n§Gresistance ended, +Stability, +Shia Population§!."
 SAU_shia_integration: "Integrate the Communities"
 SAU_shia_integration_desc: "Open the army, the police and the bureaucracy to Shia citizens who swear loyalty to the crown.\n\n§G-Shia Resistance, +Stability, +Shia Population§!."
 SAU_shia_question: "The Shia Question"
 SAU_shia_question_desc: "About two million §LShia§! citizens live in the oil-producing §LEastern Province§!. The §LHouse of Saud§! must choose between repression, accommodation, or a fundamental change in its religious policy."
 SAU_shia_rehabilitation: "Rehabilitate the Detainees"
 SAU_shia_rehabilitation_desc: "Release the political prisoners of the Eastern Province and bring them back into Saudi society.\n\n§G-Shia Resistance, +Stability§!."
 SAU_shia_representation: "Shia Political Representation"
 SAU_shia_representation_desc: "Seats in the §LShura Council§! for the Shia of the Eastern Province.\n\n§G-Shia Resistance, +Stability, +Shia Population§!."
 SAU_shia_rights_reform: "Shia Rights Reform"
 SAU_shia_rights_reform_desc: "Codify the rights of the Shia in the law of the land.\n\n§G-Shia Resistance, +Stability, +Shia Population§!."
 SAU_shia_security_clampdown: "Security Clampdown"
 SAU_shia_security_clampdown_desc: "Flood the Eastern Province with checkpoints, informants and rapid-reaction forces.\n\n§R+Shia Resistance§!, §R-Shia Population§!, §G+War Support§!."
 SAU_shia_settlement: "Sectarian Settlement"
 SAU_shia_settlement_desc: "The Kingdom has settled the Shia question through repression, accommodation, or conversion and can now consolidate the resulting policy.\n\n§G+Stability, +Political Power§!."
 SAU_shia_state_religion: "The House of Saud Embraces Shiaism"
 SAU_shia_state_religion_desc: "The unthinkable: the §LRoyal Family§! formally adopts §HTwelver Shiaism§!. Centuries of Wahhabi orthodoxy are overturned by a single decree. The §LEastern Province§! rejoices; the §LNajd§! and the §Lulema§! reel.\n\n§G++Shia Population§!, §Gresistance ended§!, §Radopt the Shia faith§!, §R-Stability§! (for now)."
 SAU_shia_sunni_supremacy: "Sunni Supremacy"
 SAU_shia_sunni_supremacy_desc: "Enshrine Sunni primacy in the law, the schools and the mosque. There is one true faith in the Kingdom, and it is not theirs.\n\n§R-Shia Population§!, §G+Stability, +War Support§!."
 SAU_shia_suppress_dissent: "Suppress the Clerics"
 SAU_shia_suppress_dissent_desc: "Silence the firebrand preachers of §LQatif§! and §LAwamiyah§! before their sermons become slogans.\n\n§R+Shia Resistance§!, §R-Shia Population§!."
 SAU_shia_tolerance: "Sunni-Shia Tolerance"
 SAU_shia_tolerance_desc: "Neither persecute nor convert - simply coexist. Ease the restrictions, let the Shia worship in peace, and let the Kingdom breathe.\n\n§G-Shia Resistance, +Stability, +Shia Population§! (no change of faith)."
 SAU_Spark_protest_inside_the_Axis: "Stir the Axis of Resistance"
 SAU_Spark_protest_inside_the_Axis_desc: "Iran's strength is a chain of proxies from Lebanon to Yemen, and every link has its discontents. Fund the protests and fractures that turn Tehran's allies into liabilities."
 SAU_spawn_foregin_troops_FSA: "Foreign Volunteers for the Rebels"
 SAU_spawn_foregin_troops_FSA_desc: "Money alone will not win the war. Open the pipelines that bring fighters and materiel across the borders to the opposition's front lines."
 SAU_Support_The_Government_Direct: "Direct Intervention in Yemen"
 SAU_Support_The_Government_Direct_desc: "Send in the Saudi army. A direct campaign promises a faster decision and a clearer victory, and risks a quagmire that bleeds the Kingdom for years."
 SAU_Support_The_Government_Proxy: "A Proxy War in Yemen"
 SAU_Support_The_Government_Proxy_desc: "Fight the war through others. Bankroll the exiled government, the southern militias and the tribes, and let Yemenis do the dying while Saudi jets watch from above."
 SAU_Suprem_military_council: "Supreme Military Council"
 SAU_Suprem_military_council_desc: "The provisional military council will receive a permanent charter and formal membership rules. Rank will determine membership, while command during the coup will continue to shape influence within the Council."
 SAU_The_Amman_Bailout_Jordan: "The Amman Bailout"
 SAU_The_Amman_Bailout_Jordan_desc: "The Hashemite Kingdom is a fragile buffer against the chaos to its north, and it is broke. Keep Jordan solvent and loyal with the Kingdom's chequebook."
 SAU_The_Battle_for_the_Straits: "The Battle for the Straits"
 SAU_The_Battle_for_the_Straits_desc: "Whoever commands the Strait of Hormuz commands a fifth of the world's oil. Prepare the Kingdom and its allies to break Iran's grip on the world's most important waterway."
 SAU_the_Islamic_Rivalry: "The Islamic Rivalry"
 SAU_the_Islamic_Rivalry_desc: "Iran promotes its revolutionary model and supports armed groups from Lebanon to Yemen. Saudi Arabia will contest Iranian leadership through media, regional partners, and preparations for possible conflict in the Gulf."
 SAU_The_Levant_Strategy: "The Levant Strategy"
 SAU_The_Levant_Strategy_desc: "Syria burns and Jordan teeters, and beyond them lies the road to the Mediterranean. Shape the Levant to Saudi advantage before Iran and its friends do it first."
 SAU_the_new_order_over_kingdom: "The New Order over the Kingdom"
 SAU_the_new_order_over_kingdom_desc: "The emergency government has become a permanent political order. Repeated renewals of military authority have removed any practical distinction between temporary measures and normal rule."
 SAU_The_silk_road_pivot: "The Silk Road Pivot"
 SAU_The_silk_road_pivot_desc: "China is the largest buyer of Saudi crude and does not condition economic cooperation on domestic political reform. The Belt and Road Initiative offers ports, railways, and capital, but the relationship remains primarily transactional."
 SAU_The_Silk_Web_Network: "The Silk Web Network"
 SAU_The_Silk_Web_Network_desc: "Information is a weapon, and the Kingdom intends to wield it. Weave a web of media outlets, clerics and online voices that carries Riyadh's message across the region."
 SAU_The_Strategic_Defense_USA: "The American Shield"
 SAU_The_Strategic_Defense_USA_desc: "Tie the Kingdom's defence irreversibly to the United States: basing, intelligence, and the unspoken guarantee that an attack on Riyadh is an attack on Washington's interests. The price is dependence on a single patron."
 SAU_the_succession_question_2: "The Succession Question"
 SAU_the_succession_question_2_desc: "Thousands of princes retain status and potential claims under the old order. The government must decide whether to pension, exile, prosecute, or politically marginalize them."
 SAU_The_Taif_Agreement: "The Spirit of Taif"
 SAU_The_Taif_Agreement_desc: "The Saudi-brokered Taif Accord once ended Lebanon's civil war and gave the Kingdom a hand in Beirut. Revive that role and reclaim Lebanon from Iran's orbit."
 SAU_The_Yemen_Quagmire_exposed_iran: "The Yemen Quagmire"
 SAU_The_Yemen_Quagmire_exposed_iran_desc: "The war in Yemen has been costly, but it has also drawn Iran into a trap, exposed as the patron of the Houthi missiles falling on Riyadh. Turn the quagmire into a weapon of diplomacy."
 SAU_The_Yemeni_Peace_Talks: "The Yemeni Peace Talks"
 SAU_The_Yemeni_Peace_Talks_desc: "Every war ends at a table. Bring the Yemeni factions to terms on conditions that leave the Kingdom's southern frontier secure."
 SAU_Total_lost_in_Syria: "Defeat in Syria"
 SAU_Total_lost_in_Syria_desc: "The regime endures, propped up by Russian jets and Iranian militias. The Kingdom must cut its losses and salvage what influence it can from a war it could not win."
 SAU_Total_Victory_in_Civil_war: "Total Victory in the Civil War"
 SAU_Total_Victory_in_Civil_war_desc: "Crush the Houthis outright and restore a single government wholly beholden to Riyadh. Yemen becomes a Saudi protectorate in all but name."
 SAU_Total_Victory_in_Syria: "Victory in Syria"
 SAU_Total_Victory_in_Syria_desc: "Damascus falls, and with it Iran's land bridge to Hezbollah. A friendly government in Syria opens the Levant to Saudi influence and the Mediterranean to Saudi pipelines."
 SAU_trials_of_the_old_order: "Trials of the Old Order"
 SAU_trials_of_the_old_order_desc: "The Council will prosecute members of the former royal order in public courts. Unlike the private settlements of the 2017 Ritz-Carlton purge, these proceedings will present the charges and judgments openly, while also serving the Council's political interests."
 SAU_UK_Strategic_Partnership: "A Partnership with Britain"
 SAU_UK_Strategic_Partnership_desc: "From the Al-Yamamah contracts to the training of Saudi officers, London has been a quieter but steadier friend than most. Formalise a strategic partnership with the United Kingdom."
 SAU_unif_benign_dominance: "§HBenign Dominance§!"
 SAU_unif_benign_dominance_desc: "Riyadh leads with a §Glighter touch§!: investment, patronage, and respect for the smaller emirates dignity. Hegemony without humiliation."
 SAU_unif_command_control: "§HCommand & Control§!"
 SAU_unif_command_control_desc: "A joint command center, integrated air defense, and shared intelligence will give the Peninsula Shield a unified operational structure."
 SAU_unif_command_control_tt: "§HA unified command and control structure is established across the GCC armed forces.§!"
 SAU_unif_common_market: "§HCommon Market§!"
 SAU_unif_common_market_desc: "A single regulatory framework: one set of standards, one customs document, one regional market of §L50 million consumers§!."
 SAU_unif_cross_border: "§HCross-Border Transit Systems§!"
 SAU_unif_cross_border_desc: "Highways, railways, and pipelines knit the peninsula together. The §LGCC Railway§! - long discussed, never built - finally breaks ground."
 SAU_unif_cross_border_tt: "§YRequires developed cross-border infrastructure in the border region (Infrastructure level 3 or higher).§!"
 SAU_unif_economic_union: "§HEconomic Union§!"
 SAU_unif_economic_union_desc: "A unified §Lcustoms zone§!, harmonized regulations, and the foundations of a §Hcommon market§! across the peninsula. The merchants of §LJeddah§! and §LDubai§! have waited a generation."
 SAU_unif_exploit_authority: "§HExploit Authority§!"
 SAU_unif_exploit_authority_desc: "Saudi Arabia will enforce its hegemony through §Heconomic pressure§! and other coercive measures against noncompliant member states. The Alliance will function as a §GSaudi-dominated bloc§!."
 SAU_unif_exploit_authority_tt: "§YRequires the Kingdom to be the leading foreign influence in every other GCC member state.§!"
 SAU_unif_gcc_council: "§HThe Gulf Cooperation Council§!"
 SAU_unif_gcc_council_desc: "For two decades the §LGCC§! has operated mainly as a forum for consultation among the Gulf monarchies. Riyadh will expand it into a more effective regional organization."
 SAU_unif_gulf_academy: "§HThe Gulf Academy§!"
 SAU_unif_gulf_academy_desc: "A unified officer training academy in §LRiyadh§!. Future generals from every GCC state will share a classroom, a doctrine, and a §Hloyalty to the Alliance§!."
 SAU_unif_increase_autonomy: "§HIncrease Autonomy§!"
 SAU_unif_increase_autonomy_desc: "A more §Hindependent foreign policy§!. The GCC speaks for itself in international forums - not as an American client, but as a §Lregional power§!."
 SAU_unif_increase_autonomy_tt: "§HGreater regional autonomy eases sectarian grievances. Domestic influence grows and radicalization recedes.§!"
 SAU_unif_intra_trade: "§HIntra-GCC Trade§!"
 SAU_unif_intra_trade_desc: "Drop the last tariff barriers between member states. Goods, capital, and labour flow freely from §LMuscat§! to §LKuwait City§!."
 SAU_unif_joint_defense: "§HJoint Defense Agreement§!"
 SAU_unif_joint_defense_desc: "An §LArticle 5§!-style mutual defense pact: an attack on one is an attack on all. §LIran§! takes notice."
 SAU_unif_joint_research: "§HJoint Research Initiatives§!"
 SAU_unif_joint_research_desc: "A shared §Ltechnology fund§! pools resources for desalination, solar power, and petrochemical R&D. §LKAUST§! becomes the regional hub."
 SAU_unif_joint_ventures: "§HGCC Joint Ventures§!"
 SAU_unif_joint_ventures_desc: "The GCC will coordinate defense production, procurement, and maintenance. Saudi capital, §LEmirati logistics§!, and §LBahraini shipyards§! will support a shared military-industrial system."
 SAU_unif_khaleeji_union: "§GThe Khaleeji Union§!"
 SAU_unif_khaleeji_union_desc: "The six monarchies will form a confederation with shared authority over foreign policy, defense, and currency. The §HKhaleeji Union§! will be led from §LRiyadh§!."
 SAU_unif_military_union: "§HMilitary Union§!"
 SAU_unif_military_union_desc: "The §LPeninsula Shield§! has existed since 1984 but has limited practical integration. Riyadh will establish a joint command, shared procurement, and common doctrine."
 SAU_unif_new_partners: "§HNew Partners§!"
 SAU_unif_new_partners_desc: "Beyond Washington: deals with §LBeijing§!, §LMoscow§!, §LDelhi§!, and §LBrussels§!. The peninsula diversifies its patrons."
 SAU_unif_political_union: "§HPolitical Union§!"
 SAU_unif_political_union_desc: "A coordinated foreign policy. A shared diplomatic line. The smaller emirates fear §YSaudi domination§! - but Riyadh insists this is a partnership of §Lequals among monarchs§!."
 SAU_unif_pro_american: "§HSolidify Pro-American Alignment§!"
 SAU_unif_pro_american_desc: "The §LGCC§! formalizes its security partnership with Washington. Bases, training, weapons, intelligence - all flowing through Riyadh."
 SAU_unif_pursue_hegemony: "§HPursue Hegemony§!"
 SAU_unif_pursue_hegemony_desc: "Riyadh will replace informal leadership with direct authority over the other GCC monarchies. They may object, but Saudi economic and military pressure will limit their ability to resist."
 SAU_unif_robust_alliance: "§HA Robust Alliance§!"
 SAU_unif_robust_alliance_desc: "The §LPeninsula Shield§! will become an operational force of 100,000 troops with modern equipment and unified doctrine."
 SAU_unif_shared_currency: "§HShared Currency§!"
 SAU_unif_shared_currency_desc: "The §Hkhaleeji dinar§! - a single currency for the GCC, pegged not to the dollar but to a basket. The boldest economic step the peninsula has ever taken."
 SAU_Yemeni_Civil_war: "The Yemeni Civil War"
 SAU_Yemeni_Civil_war_desc: "The Houthis have seized the capital and driven the recognised government into exile, and an Iranian foothold is taking root on Arabia's doorstep. The Kingdom must decide how far it will go to reverse it."

 # ==============================
 # Ideas
 # ==============================
 HOU_houthi_resilience: "Ansar Allah Resilience"
 HOU_houthi_resilience_desc: "Ansar Allah has operated in Yemen's mountainous north for decades. Its familiarity with the terrain and established highland positions make Houthi forces difficult to dislodge."
 PER_houthi_defense_buff: "Mountain Fortifications"
 PER_houthi_defense_buff_desc: "Iranian-built defenses turn the highlands into a fortress. +15% defense against the government's forces."
 SAU_American_exist_in_Saudi_Arabia_1: "[USA.GetFlag] The Amercain Military presence"
 SAU_American_exist_in_Saudi_Arabia_1_desc: "The United States does not operate permanent, standalone military bases in Saudi Arabia, but it does maintain a significant and active military presence in the country. U.S. troops and assets are hosted at existing Saudi military installations to provide logistical support, intelligence, and air defense"
 SAU_American_exist_in_Saudi_Arabia_1_tt: "§HIf We§! §RRemove§! §Hthe Military Access From United States, we will Lost the National Spirit§!"
 SAU_arab_shield_member: "Member of the Arab Shield"
 SAU_arab_shield_member_desc: "This nation participates in the Arab Shield's collective defense arrangements, improving the defense and morale of its armed forces."
 SAU_aramco_01: "Saudi Aramco"
 SAU_aramco_01_desc: "The Saudi Arabian Oil Company is the world's largest petroleum enterprise, fully nationalized since 1980. Aramco controls the Kingdom's vast oil reserves and serves as the backbone of the Saudi economy, generating the majority of government revenue. While immensely profitable, the company operates with limited transparency and has yet to modernize its corporate structure."
 SAU_aramco_02: "Saudi Aramco - Expanded Operations"
 SAU_aramco_02_desc: "Aramco has expanded its operations beyond crude oil extraction, investing in refining capacity, petrochemical ventures, and international partnerships. The company's growing efficiency and diversified portfolio have strengthened its position as the cornerstone of the Saudi economy."
 SAU_aramco_03: "Saudi Aramco - Global Energy Leader"
 SAU_aramco_03_desc: "Saudi Aramco has transformed into a modern global energy giant. With a successful public listing, expanded downstream operations, and strategic international investments, the company now stands as one of the most valuable corporations in the world. Its revenues fuel not only the Kingdom's budget but also ambitious development programs across the nation."
 SAU_aramco_downstream: "§HSaudi Aramco§! - Downstream Integration"
 SAU_aramco_downstream_desc: "Aramco has expanded into refining and chemical production, allowing it to earn revenue from each stage between crude extraction and retail fuel sales."
 SAU_aramco_engineers: "§HSaudi Aramco§! - Saudi Petroleum Engineers"
 SAU_aramco_engineers_desc: "A generation of Saudi petroleum engineers, trained at KFUPM and abroad, has replaced the foreign hands that once ran the fields."
 SAU_aramco_export: "§HSaudi Aramco§! - Export Powerhouse"
 SAU_aramco_export_desc: "Aramco is built as an export machine, its terminals and tanker fleets tuned to deliver more crude to more markets than any rival."
 SAU_aramco_gas: "§HSaudi Aramco§! - The Master Gas System"
 SAU_aramco_gas_desc: "The Master Gas System captures natural gas that was previously flared and transports it to power plants and industrial facilities across Saudi Arabia."
 SAU_aramco_ghawar: "§HSaudi Aramco§! - The Ghawar Field"
 SAU_aramco_ghawar_desc: "Ghawar is the world's largest conventional oil field and produces millions of barrels per day. Its output is central to both Aramco and the Saudi economy."
 SAU_aramco_giant: "§HSaudi Aramco§! - World's Most Valuable Company"
 SAU_aramco_giant_desc: "Aramco stands as the most valuable company on Earth, its output, reserves, and profits without peer in corporate history."
 SAU_aramco_megafields: "§HSaudi Aramco§! - New Mega-Fields"
 SAU_aramco_megafields_desc: "Major developments at Shaybah, Khurais, and the offshore Manifa field have expanded Saudi production capacity and continued the Kingdom's investment in large oil projects."
 SAU_aramco_national: "§HSaudi Aramco§! - Complete Nationalization"
 SAU_aramco_national_desc: "Completed in 1980, the buyout of American shareholders made Aramco wholly Saudi. The Kingdom's oil now answers to Riyadh alone."
 SAU_aramco_opec: "§HSaudi Aramco§! - OPEC Swing Producer"
 SAU_aramco_opec_desc: "Saudi Arabia maintains enough spare production capacity to increase or reduce OPEC supply and influence world oil prices more than any other member."
 SAU_aramco_petrochem: "§HSaudi Aramco§! - Integrated Refining"
 SAU_aramco_petrochem_desc: "PetroRabigh and SATORP, joint ventures with Sumitomo and Total, weld refining and petrochemicals into single integrated complexes on the Red Sea and the Gulf."
 SAU_aramco_production: "§HSaudi Aramco§! - Maximize Production"
 SAU_aramco_production_desc: "Aramco prioritizes maximum sustainable production while retaining spare capacity. This allows Saudi Arabia to respond quickly to changes in demand or government production policy."
 SAU_aramco_rastanura: "§HSaudi Aramco§! - Ras Tanura & Abqaiq"
 SAU_aramco_rastanura_desc: "The Ras Tanura export terminal and Abqaiq processing complex handle a large share of Saudi crude before it enters world markets. Together they are among the largest oil facilities of their kind."
 SAU_aramco_rnd: "§HSaudi Aramco§! - EXPEC Research"
 SAU_aramco_rnd_desc: "The EXPEC Advanced Research Centre in Dhahran leads the world in reservoir engineering, squeezing more oil from every field at lower cost."
 SAU_baathist_party_1: "The Bastion of Arab Nationalist"
 SAU_baathist_party_1_loc: "\n[SAU.GetFlag]The Bastion of Arab Nationalist\n§HForegin Influence§! Multiplier: §G+5.00%§!\n§HForegin Influence§! Coup Success Factor: §G+25.0%§!\n\n"
 SAU_baathist_party_3: "Unity, Freedom , Socialism"
 SAU_baathist_party_3_loc: "[SAU.GetFlag]Unity, Freedeom, Socialism\nConstruction Speed: §G+10.00%§!\nNationalist Propaganda Campagin Cost Multiplier: §G-10.00%§!\nMonthly Prdouctivity Growth: §G+0.05§!\n\n"
 SAU_banking_649_hybrid: "§HInterest Law§! - §YHybrid (Sukuk + Informal)§!"
 SAU_banking_649_hybrid_desc: "Sukuk and Islamic banking services operate alongside informal conventional lending. The system remains officially Sharia-compliant while allowing limited practical flexibility."
 SAU_banking_649_hybrid_loc: "\n§HInterest Law:§! §YSukuk + Informal Interest§!\n  §G+2.0%§! Office Park Tax\n  §G+1.0%§! Political Power\n  §G+0.5%§! Stability\n"
 SAU_banking_649_islamic: "§HInterest Law§! - §RStrict Riba Prohibition§!"
 SAU_banking_649_islamic_desc: "Riba is forbidden without exception. Finance flows through profit-sharing and murabaha structures, and the faithful bank with a clear conscience."
 SAU_banking_649_islamic_loc: "\n§HInterest Law:§! §BStrict Riba Prohibition§!\n  §G+3.0%§! Political Power\n  §G+2.0%§! Stability\n  §G+0.5%§! Salafist Drift\n"
 SAU_banking_649_secular: "§HInterest Law§! - §GConventional§!"
 SAU_banking_649_secular_desc: "Interest is legal and openly priced. Conventional banking thrives and capital flows freely, whatever the clerics preach on Friday."
 SAU_banking_649_secular_loc: "\n§HInterest Law:§! §GConventional§!\n  §G+4.0%§! Office Park Tax\n  §G+3.0%§! Corporate Tax\n  §G+0.5%§! Democratic Drift\n  §R-1.0%§! Stability\n"
 SAU_banking_650_hybrid: "§HReserve Mandate§! - §YModerate§!"
 SAU_banking_650_hybrid_desc: "Moderate reserve requirements allow banks to expand credit while retaining larger financial buffers than a lightly regulated system."
 SAU_banking_650_hybrid_loc: "\n§HReserve Mandate:§! §YModerate Reserves§!\n  §G+1.0%§! Construction Speed\n  §G+0.5%§! Stability\n"
 SAU_banking_650_islamic: "§HReserve Mandate§! - §RFull Asset Backing§!"
 SAU_banking_650_islamic_desc: "Every deposit is backed by real assets. Credit grows slowly, but no Saudi bank can collapse in a run."
 SAU_banking_650_islamic_loc: "\n§HReserve Mandate:§! §BFull Asset Backing (Sharia)§!\n  §G+2.5%§! Stability\n  §G+2.0%§! War Support\n  §R-2.0%§! Construction Speed\n"
 SAU_banking_650_secular: "§HReserve Mandate§! - §GFractional Reserve§!"
 SAU_banking_650_secular_desc: "Banks lend against a fraction of their deposits, multiplying credit through the economy in the Western fashion."
 SAU_banking_650_secular_loc: "\n§HReserve Mandate:§! §GFractional Reserve (Western)§!\n  §G+3.0%§! Construction Speed\n  §G+5.0%§! Industry Repair\n  §R-2.0%§! Consumer Goods Use\n  §R-1.5%§! Stability\n"
 SAU_banking_651_hybrid: "§HSpeculation Code§! - §YRegulated Derivatives§!"
 SAU_banking_651_hybrid_desc: "Derivatives trade within strict limits, hedging permitted, speculation policed."
 SAU_banking_651_hybrid_loc: "\n§HSpeculation Code:§! §YRegulated Derivatives Only§!\n  §G+1.5%§! Tax Gain\n  §G+0.5%§! Stability\n"
 SAU_banking_651_islamic: "§HSpeculation Code§! - §RNo Gharar§!"
 SAU_banking_651_islamic_desc: "The prohibition on gharar bars derivatives, short selling, and other financial products based on excessive uncertainty or speculation."
 SAU_banking_651_islamic_loc: "\n§HSpeculation Code:§! §BNo Gharar - No Gambling§!\n  §G+2.5%§! Stability\n  §G+2.0%§! Political Power\n  §G+3§! Neutrality Acceptance\n"
 SAU_banking_651_secular: "§HSpeculation Code§! - §GLight Regulation§!"
 SAU_banking_651_secular_desc: "Options, futures, and other derivatives are permitted under limited regulatory oversight."
 SAU_banking_651_secular_loc: "\n§HSpeculation Code:§! §GDerivatives & Futures Permitted§!\n  §G+3.0%§! Tax Gain\n  §G+2.0%§! Research Speed\n  §R-2.0%§! Stability\n"
 SAU_banking_652_hybrid: "§HInterbank Code§! - §YDual Channels§!"
 SAU_banking_652_hybrid_desc: "Two interbank channels run side by side, conventional and Islamic, and every bank chooses its counter."
 SAU_banking_652_hybrid_loc: "\n§HInterbank Code:§! §YDual Channels§!\n  §G+1.5%§! Office Park Tax\n  §G+1.0%§! Political Power\n"
 SAU_banking_652_islamic: "§HInterbank Code§! - §RMurabaha§!"
 SAU_banking_652_islamic_desc: "Interbank liquidity moves through commodity murabaha, keeping even overnight money within the bounds of the Sharia."
 SAU_banking_652_islamic_loc: "\n§HInterbank Code:§! §BMurabaha-Based§!\n  §G+2.5%§! Political Power\n  §G+1.5%§! Stability\n  §G+0.5%§! Salafist Drift\n"
 SAU_banking_652_secular: "§HInterbank Code§! - §GLIBOR-style§!"
 SAU_banking_652_secular_desc: "Banks lend to each other at benchmark interest rates, knitting Saudi finance into global money markets."
 SAU_banking_652_secular_loc: "\n§HInterbank Code:§! §GConventional Interest Corridor§!\n  §G+3.0%§! Office Park Tax\n  §G+2.0%§! Corporate Tax\n  §G+0.5%§! Democratic Drift\n  §R-1.0%§! Stability\n"
 SAU_banking_653_hybrid: "§HBanking Control§! - §YParallel Structures§!"
 SAU_banking_653_hybrid_desc: "Conventional and Islamic banks answer to parallel supervisory tracks under one central bank roof."
 SAU_banking_653_hybrid_loc: "\n§HBanking Control:§! §YParallel SAMA + Sharia Structures§!\n  §G+2.0%§! Tax Gain\n  §G+1.5%§! Political Power\n"
 SAU_banking_653_islamic: "§HBanking Control§! - §RSAMA + Sharia Council§!"
 SAU_banking_653_islamic_desc: "SAMA shares authority with a Sharia supervisory council, and no banking license survives the scholars' veto."
 SAU_banking_653_islamic_loc: "\n§HBanking Control:§! §BSAMA + Sharia Oversight§!\n  §G+4.0%§! Political Power\n  §G+2.5%§! Stability\n  §G+1.0%§! Salafist Drift\n"
 SAU_banking_653_secular: "§HBanking Control§! - §GIndependent SAMA§!"
 SAU_banking_653_secular_desc: "SAMA regulates banking as an independent central bank, accountable to the market's confidence and little else."
 SAU_banking_653_secular_loc: "\n§HBanking Control:§! §GIndependent SAMA§!\n  §G+4.0%§! Tax Gain\n  §G+2.0%§! Research Speed\n  §G+1.0%§! Democratic Drift\n  §R-1.0%§! Stability\n"
 SAU_banking_654_pragmatic: "§HIslamic Finance§! - §YGlobal Islamic Hub§!"
 SAU_banking_654_pragmatic_desc: "Riyadh is developing into an international center for Islamic finance. Its regulations retain Sharia credibility while accommodating institutions from other major financial markets."
 SAU_banking_654_pragmatic_loc: "\n§HBastion of Islamic Finance:§! §YGlobal Islamic Finance Hub§!\n  §G+3.0%§! Political Power\n  §G+2.5%§! Stability\n  §G+5.0%§! Office Park Tax\n  §G+4.0%§! Corporate Tax\n  §G+5§! Neutrality Acceptance\n"
 SAU_banking_654_strict: "§HIslamic Finance§! - §RStrict Orthodoxy§!"
 SAU_banking_654_strict_desc: "The Kingdom requires full adherence to orthodox Islamic financial rules. This limits flexibility but attracts clients who prioritize strict Sharia compliance."
 SAU_banking_654_strict_loc: "\n§HBastion of Islamic Finance:§! §BStrict Orthodoxy§!\n  §G+5.0%§! Political Power\n  §G+5.0%§! Stability\n  §G+2.0%§! Salafist Drift\n  §G+10§! Neutrality Acceptance\n  §G+10.0%§! Drift Defence\n"
 SAU_banking_655_full: "§HSecularised Finance§! - §GFull Anglo-Saxon§!"
 SAU_banking_655_full_desc: "Saudi Arabia has adopted the Anglo-Saxon banking model in full. The change expands conventional capital markets but faces opposition from the religious establishment."
 SAU_banking_655_full_loc: "\n§HSecularised Finance:§! §GFull Anglo-Saxon§!\n  §G+10.0%§! Office Park Tax\n  §G+7.0%§! Corporate Tax\n  §G+5.0%§! Tax Gain\n  §G+4.0%§! Research Speed\n  §G+2.0%§! Democratic Drift\n  §R-3.0%§! Stability\n  §R-2.0%§! Consumer Goods Use\n"
 SAU_banking_655_gradual: "§HSecularised Finance§! - §YGradual§!"
 SAU_banking_655_gradual_desc: "Conventional financial rules are being introduced gradually to reduce organized religious opposition to secularization."
 SAU_banking_655_gradual_loc: "\n§HSecularised Finance:§! §YGradual Transition§!\n  §G+6.0%§! Office Park Tax\n  §G+4.0%§! Corporate Tax\n  §G+3.0%§! Tax Gain\n  §G+1.0%§! Democratic Drift\n  §R-1.0%§! Stability\n"
 SAU_banking_system: "§HBanking System§!"
 SAU_banking_system_desc: "The Kingdom's financial sector. Each banking-law focus gives the player a §Lsecular§!, §Lislamic§!, or §Lhybrid§! choice; the result lives here as a §Hsub-system§!. The total modifier comes from the sum of all chosen sub-systems."
 SAU_banking_system_tt: "[SAU_banking_649_loc][SAU_banking_650_loc][SAU_banking_651_loc][SAU_banking_652_loc][SAU_banking_653_loc][SAU_banking_654_loc][SAU_banking_655_loc]"
 SAU_black_february_bailout_idea: "The February Intervention"
 SAU_black_february_bailout_idea_desc: "The state has spent public funds to slow the Tadawul's collapse and protect small investors from the worst losses. The intervention reduces available Treasury funds and establishes an expensive precedent for future market crises."
 SAU_black_february_idea: "Black February"
 SAU_black_february_idea_desc: "The Tadawul has lost two thirds of its value, destroying much of the savings invested by Saudi households. The government's failure to intervene has caused widespread public anger."
 SAU_communist_state_2: "The Proletarian Nation"
 SAU_communist_state_2_loc: "[SAU.GetFlag]The Proletarian Nation\n§HPopulation Tax Revenue§! Multiplier: §G+5.00%§!\n§HAgriculture§! Tax Revenue Multiplier: §G+5.00%§!\n§HCommercialized Agriculture District§! Productivity: §G+10.00%§!\n\n"
 SAU_communist_state_2_tt: "[SAU_communist_state_1_loc][SAU_communist_state_2_loc][SAU_communist_state_3_loc][SAU_communist_state_4_loc][SAU_communist_state_5_loc]"
 SAU_Cooperation_West_East: "[USA.GetFlag] Cooperation Among Divide World [CHI.GetFlag]"
 SAU_Cooperation_West_East_desc: "Among the Divided World, into two Major Blocs, the Eastern World which is sided with Rising Superpower [CHI.GetFlag] China, and The Western side Leading by the [USA.GetFlag] America in this world and the New Millennium"
 SAU_Cooperation_West_East_tt: "[SAU_IMEC_india_deal_new_loc][SAU_OPEC_Russia_deal_new_loc]"
 SAU_custodian_of_the_cause: "Custodian of the Cause"
 SAU_custodian_of_the_cause_desc: "Riyadh has made Palestine the measure of its leadership of the Arab world, and the Arab street answers with loyalty."
 SAU_cyber_defensive_posture: "Cyber Defensive Posture"
 SAU_cyber_defensive_posture_desc: "GIP hardening operations are shielding the Kingdom's networks and slowing hostile intelligence collection."
 SAU_cyber_defensive_target: "Saudi Cyber Countermeasures"
 SAU_cyber_defensive_target_desc: "GIP cyber defenses have degraded offensive coordination and command."
 SAU_cyber_offensive_target: "Under Saudi Cyber Assault"
 SAU_cyber_offensive_target_desc: "GIP cyber operations have crippled command and defensive coordination, and disrupted industry."
 SAU_decisive_storm_air_cover: "Coalition Air Cover"
 SAU_decisive_storm_air_cover_desc: "Saudi and coalition aircraft provide air cover for Yemeni government forces, granting +10% defense against the Houthis. This support ends if a ceasefire is accepted or the Houthi movement ceases to exist."
 SAU_decree_abdullah_kaec_construction: "KAEC Fast-Track"
 SAU_decree_abdullah_kaec_construction_desc: "Civil works across the Kingdom are being pushed through at the pace set on the Red Sea coast."
 SAU_decree_abdullah_kasp_scholarship: "KASP Overseas Scholarship"
 SAU_decree_abdullah_kasp_scholarship_desc: "A generation trained abroad is filtering back into the ministries, the universities and the firms."
 SAU_decree_abdullah_kaust_grants: "KAUST High-Tech Grants"
 SAU_decree_abdullah_kaust_grants_desc: "Expanded KAUST grants are accelerating university research and increasing output from high-technology industry."
 SAU_decree_abdullah_national_dialogue: "National Dialogue Forums"
 SAU_decree_abdullah_national_dialogue_desc: "Grievances are being argued out in conference halls rather than in the street."
 SAU_decree_abdullah_sang_subsidies: "SANG Modernization Subsidies"
 SAU_decree_abdullah_sang_subsidies_desc: "Subsidised contracts are holding down the price of armoured vehicles and keeping formations up to strength."
 SAU_decree_mbn_border_surveillance: "Border Guard Surveillance Grids"
 SAU_decree_mbn_border_surveillance_desc: "The frontier is watched end to end, and troops on it are dug in behind prepared positions."
 SAU_decree_mbn_mabahith_campaign: "Mabahith Counter-Subversion Campaign"
 SAU_decree_mbn_mabahith_campaign_desc: "The Mabahith are monitoring communications and intensifying surveillance of suspected dissidents throughout the Kingdom."
 SAU_decree_mbn_rehabilitation_center: "Prince Nayef Rehabilitation Center"
 SAU_decree_mbn_rehabilitation_center_desc: "The Prince Nayef center attempts to rehabilitate militants and return them to civilian life rather than allowing imprisonment or death to strengthen extremist recruitment."
 SAU_decree_mbn_special_security_forces: "MOI Special Security Forces"
 SAU_decree_mbn_special_security_forces_desc: "The Interior Ministry's forces are on the streets, and anyone working against the Kingdom is finding it a great deal harder."
 SAU_decree_mbn_western_intel_networks: "Western Joint Intelligence Networks"
 SAU_decree_mbn_western_intel_networks_desc: "Shared take from allied services is filling in what Saudi collection cannot reach."
 SAU_decree_mbs_anticorruption_drive: "The Ritz-Carlton Settlements"
 SAU_decree_mbs_anticorruption_drive_desc: "The Ritz-Carlton detentions have forced wealthy Saudis to surrender assets to the state and demonstrated the leadership's control over private fortunes."
 SAU_decree_mbs_aramco_liquidity: "Aramco Strategic Liquidity"
 SAU_decree_mbs_aramco_liquidity_desc: "Oil money is being moved straight into the state's hands, and industry has been freed from the trade ledger."
 SAU_decree_mbs_gami_localization: "GAMI Defense Localization"
 SAU_decree_mbs_gami_localization_desc: "Weapons are coming off Saudi lines instead of foreign ones, and the arms plants are multiplying."
 SAU_decree_mbs_pif_neom: "NEOM & Frontier Projects"
 SAU_decree_mbs_pif_neom_desc: "The Public Investment Fund is financing NEOM and related frontier projects, including the transport infrastructure needed to support them."
 SAU_decree_mbs_vision2030_blitz: "Vision 2030 Campaign Blitz"
 SAU_decree_mbs_vision2030_blitz_desc: "Government ministries and public investment are being directed toward the rapid implementation of the Crown Prince's Vision 2030 program."
 SAU_decree_mutaib_capital_garrison: "Capital Garrison Grid"
 SAU_decree_mutaib_capital_garrison_desc: "The National Guard has established a security cordon and extensive surveillance network across Riyadh."
 SAU_decree_mutaib_janadriyah_festival: "Janadriyah Heritage Festival"
 SAU_decree_mutaib_janadriyah_festival_desc: "The Janadriyah festival promotes tribal heritage and strengthens relations between the government and tribal communities."
 SAU_decree_mutaib_sang_logistics: "Autonomous SANG Logistics"
 SAU_decree_mutaib_sang_logistics_desc: "The Guard feeds and fuels itself, and wastes a good deal less doing it."
 SAU_decree_mutaib_sang_procurement: "SANG Aviation & Armored Procurement"
 SAU_decree_mutaib_sang_procurement_desc: "Guard contracts are being filled first, and at a price the regular army does not get."
 SAU_decree_mutaib_tribal_reserves: "Tribal SANG Reserves"
 SAU_decree_mutaib_tribal_reserves_desc: "Tribal levies are filling the Guard's rolls faster than the recruiters could alone."
 SAU_decree_salman_cpsa_council: "Council of Political & Security Affairs"
 SAU_decree_salman_cpsa_council_desc: "One council now signs off on politics and security alike, and the staff work moves at the speed of the man chairing it."
 SAU_decree_salman_ksrelief: "KSrelief Operations"
 SAU_decree_salman_ksrelief_desc: "KSrelief uses visible Saudi humanitarian operations to provide aid abroad and improve the Kingdom's international reputation."
 SAU_decree_salman_riyadh_metro_plan: "Riyadh Metropolitan Plan"
 SAU_decree_salman_riyadh_metro_plan_desc: "The capital's building programme has set the tempo for construction everywhere."
 SAU_decree_salman_royal_decrees: "Royal Structural Decrees"
 SAU_decree_salman_royal_decrees_desc: "Royal decrees are reorganizing ministries and centralizing the implementation of government policy."
 SAU_decree_salman_spark_park: "King Salman Energy Park"
 SAU_decree_salman_spark_park_desc: "Domestic energy manufacturing is squeezing more out of every field and every tank farm."
 SAU_div_construction: "§HDiversification§! - Construction & Real Estate"
 SAU_div_construction_desc: "Construction and real estate development are becoming major components of Saudi Arabia's non-oil economy."
 SAU_div_defence: "§HDiversification§! - Defence Industry"
 SAU_div_defence_desc: "A domestic arms industry keeps defence spending inside the Kingdom, building factories and expertise instead of just buying them."
 SAU_div_energy: "§HDiversification§! - Renewable Energy"
 SAU_div_energy_desc: "Large solar projects reduce domestic demand for oil-fired energy, leaving more crude available for export and increasing government revenue."
 SAU_div_governance: "§HDiversification§! - Governance & Rule of Law"
 SAU_div_governance_desc: "More consistent courts and accountable ministries improve the business environment and make government policy easier to enforce."
 SAU_div_logistics: "§HDiversification§! - Logistics & Transport"
 SAU_div_logistics_desc: "Investment in ports, railways, and highways strengthens Saudi Arabia's role in trade between Asia, Africa, and Europe."
 SAU_div_social: "§HDiversification§! - Social Development"
 SAU_div_social_desc: "Schools, hospitals, and housing give ordinary Saudis a stake in the new economy, and a reason to believe in it."
 SAU_div_tech: "§HDiversification§! - Technology & Innovation"
 SAU_div_tech_desc: "Research parks and startup capital seed a Saudi technology sector that hires graduates the oil industry never could."
 SAU_div_tourism: "§HDiversification§! - Tourism & Entertainment"
 SAU_div_tourism_desc: "Resorts, heritage sites, and entertainment districts open the Kingdom to visitors it once turned away, and their money stays."
 SAU_diversification: "§HEconomic Diversification§!"
 SAU_diversification_desc: "The Kingdom is developing a §Lnon-oil economy§! to reduce its exposure to changes in petroleum prices. Each completed pillar, including governance, industry, tourism, technology, energy, and social development, appears here and §Glowers oil dependence§!."
 SAU_diversification_tt: "[SAU_div_governance_loc][SAU_div_construction_loc][SAU_div_tourism_loc][SAU_div_logistics_loc][SAU_div_tech_loc][SAU_div_defence_loc][SAU_div_energy_loc][SAU_div_social_loc]"
 SAU_diversified_economy: "Diversified Economy"
 SAU_diversified_economy_desc: "Industry, technology, tourism, finance, and services now provide Saudi Arabia with a broad economic base. The economy is less dependent on oil revenue and better able to withstand changes in crude prices."
 SAU_doctrine_american: "Doctrine: American Partnership"
 SAU_doctrine_american_desc: "Train with US forces, buy American, and fight the American way. The most capable path - at the price of dependence and quiet domestic resentment.\n\n§G+10%§! Army Experience Gain\n§G+10%§! Air Experience Gain\n§G+5%§! Division Organisation\n§R-10%§! Political Power Gain"
 SAU_doctrine_domestic: "Doctrine: Domestic Self-Reliance"
 SAU_doctrine_domestic_desc: "Build an indigenous defence industry and a force that owes nothing to foreign suppliers. Proud and self-sufficient, if a step behind the cutting edge.\n\n§G+10%§! Arms Factory Output\n§G+5%§! Division Recovery Rate\n§R-5%§! Army Experience Gain"
 SAU_doctrine_gcc: "Doctrine: GCC Collective Defence"
 SAU_doctrine_gcc_desc: "Anchor the Kingdom's defence in the Gulf Cooperation Council and the Peninsula Shield Force. Formidable on home soil, but committee-bound and cautious on the attack.\n\n§G+15%§! Division Defence on Core Territory\n§G+5%§! Recruitable Population\n§R-5%§! Division Attack"
 SAU_doctrine_nato: "Doctrine: NATO Professionalism"
 SAU_doctrine_nato_desc: "Adopt NATO standards: a professional officer corps, combined-arms planning and rigorous staff work. Superb command and control - but an expensive force to maintain.\n\n§G+10%§! Planning Speed\n§G+10%§! Max Planning\n§G+5%§! Division Organisation\n§R+5%§! Consumer Goods Use"
 SAU_eco_bureau_bad: "§RThe Saudi Economy§! - Red Tape"
 SAU_eco_bureau_bad_desc: "Saudi businesses face slow licensing, overlapping approvals, and widespread patronage. These bureaucratic barriers reduce the value of public investment."
 SAU_eco_bureau_good: "§GThe Saudi Economy§! - Streamlined State"
 SAU_eco_bureau_good_desc: "Permits in days instead of years. A streamlined state lets Saudi business move at market speed."
 SAU_eco_capital_bad: "§RThe Saudi Economy§! - Capital Flight"
 SAU_eco_capital_bad_desc: "Saudi private wealth sits in London, Geneva, and New York. The Kingdom's richest men invest everywhere but home."
 SAU_eco_capital_good: "§GThe Saudi Economy§! - National Capital"
 SAU_eco_capital_good_desc: "Saudi capital stays and works in the Kingdom, funding factories and ventures instead of foreign penthouses."
 SAU_eco_diversify_bad: "§RThe Saudi Economy§! - Rentier State"
 SAU_eco_diversify_bad_desc: "The government depends on oil revenue, while many citizens depend on state employment and benefits. Changes in the price of a single commodity therefore affect the entire economy."
 SAU_eco_diversify_good: "§GThe Saudi Economy§! - Diversified"
 SAU_eco_diversify_good_desc: "Tourism, industry, logistics, and finance now carry real weight beside the oil barrel. The Kingdom's income no longer hangs on a single price."
 SAU_eco_industry_bad: "§RThe Saudi Economy§! - Import Dependence"
 SAU_eco_industry_bad_desc: "Nearly everything on a Saudi shelf arrives by ship. Outside the oil sector, the Kingdom makes little it consumes."
 SAU_eco_industry_good: "§GThe Saudi Economy§! - Domestic Industry"
 SAU_eco_industry_good_desc: "Saudi factories now supply what the Kingdom once imported, and the trade ledger shows it."
 SAU_eco_labour_bad: "§RThe Saudi Economy§! - Expat Labour"
 SAU_eco_labour_bad_desc: "Millions of expatriates do the Kingdom's work while young Saudis wait for government sinecures that no longer exist."
 SAU_eco_labour_good: "§GThe Saudi Economy§! - Saudi Workforce"
 SAU_eco_labour_good_desc: "Saudis fill Saudi jobs, from the shop floor to the executive suite. The payroll stays in the Kingdom."
 SAU_econ_industry_first: "§HEconomic Model§! - Industry First"
 SAU_econ_industry_first_desc: "The Kingdom gives priority to steel, smelting, fabrication, and other heavy industries. This raises industrial output but requires more consumer goods and manpower."
 SAU_econ_mixed: "§HEconomic Model§! - A Mixed Path"
 SAU_econ_mixed_desc: "The Kingdom develops industry and services at the same time. Growth is less concentrated than under a single-sector strategy, making the economy more resilient."
 SAU_econ_services: "§HEconomic Model§! - Services First"
 SAU_econ_services_desc: "The Kingdom prioritizes banking, logistics, finance, and tourism as sources of skilled Saudi employment. This improves the knowledge economy but provides less industrial capacity."
 SAU_economic_cities: "Economic Cities Initiative"
 SAU_economic_cities_desc: "King Abdullah Economic City and other planned urban centers are attracting investment in offices, industry, and services. These purpose-built cities serve as engines of non-oil economic growth."
 SAU_economy: "§HThe Saudi Economy§!"
 SAU_economy_desc: "The Saudi economy of the year 2000: §Loil-rich but undiversified§!, weighed down by capital flight, import dependence, bureaucratic red tape, expatriate-labour reliance and addiction to a single commodity. Each focus in the §HEconomic Tree§! repairs one weakness and builds the SABIC industrial base. Complete the tree and a §Rheavy debuff§! becomes a §Gbalanced, diversified economy§!.\n\n§YBelow: every economic sub-system, red where still broken, green once reformed.§!"
 SAU_economy_tt: "[SAU_eco_capital_loc][SAU_eco_industry_loc][SAU_eco_bureau_loc][SAU_eco_labour_loc][SAU_eco_diversify_loc][SAU_eco_model_loc][SAU_eco_cities_loc]"
 SAU_egypt_army_subsidy: "Saudi Military Subsidy"
 SAU_egypt_army_subsidy_desc: "Riyadh underwrites the Egyptian army's payroll and upkeep, keeping more divisions in fighting trim. Improves morale and reinforcement."
 SAU_egypt_property_dependence: "Foreign-Owned Property"
 SAU_egypt_property_dependence_desc: "Gulf investors own Cairo's choicest real estate. Speculation drives up prices and leaves the economy beholden to its landlords. Hurts stability and consumer goods."
 SAU_employment_recovery: "Employment Recovery"
 SAU_employment_recovery_desc: "Years of labour reform are paying off. Saudis are entering the workforce in growing numbers, and the economy is finally creating jobs faster than the population grows."
 SAU_faisalite_balanced: "The Faisalite Balance"
 SAU_faisalite_balanced_desc: "The Kingdom combines domestic self-reliance with limited engagement abroad without making either approach its fixed doctrine. Maintaining this balance becomes harder as foreign commitments increase."
 SAU_faisalite_closed_schools: "The Schools are Closed"
 SAU_faisalite_closed_schools_desc: "The foreign curricula are gone and nothing has yet been written to replace them. A cohort will lose several years to the gap."
 SAU_faisalite_conviction_decided: "Faisalite Circle: Decided"
 SAU_faisalite_conviction_dormant: "Faisalite Circle: Dormant"
 SAU_faisalite_conviction_gathering: "Faisalite Circle: Gathering"
 SAU_faisalite_conviction_insistent: "Faisalite Circle: Insistent"
 SAU_faisalite_conviction_stirring: "Faisalite Circle: Stirring"
 SAU_faisalite_creditor_of_the_ummah: "Creditor of the Ummah"
 SAU_faisalite_creditor_of_the_ummah_desc: "Long-term Saudi loans to Muslim countries give Riyadh influence over debtor governments. Deferred repayment strengthens their short-term dependence and goodwill."
 SAU_faisalite_foreign_endowments: "Endowments Abroad"
 SAU_faisalite_foreign_endowments_desc: "Saudi money endows chairs and libraries in a dozen foreign universities, and Saudi students walk into them unopposed."
 SAU_faisalite_import_rationing: "Import Rationing"
 SAU_faisalite_import_rationing_desc: "Licences are issued sparingly and queues form outside the ministry. What the Kingdom cannot buy it must find at home, and it is finding rather more than expected."
 SAU_faisalite_interventionist_dominant: "§RInterventionism Ascendant§!"
 SAU_faisalite_interventionist_dominant_desc: "Summits, subsidies, and military advisers have made Saudi Arabia a central power in the Muslim world. This influence also makes the Kingdom responsible for costly disputes beyond its borders."
 SAU_faisalite_interventionist_leaning: "§RLeaning Interventionist§!"
 SAU_faisalite_interventionist_leaning_desc: "The Kingdom is spending abroad again and being heard for it. Faisal would recognise the direction, if not yet the scale."
 SAU_faisalite_isolationist_dominant: "§OIsolationism Ascendant§!"
 SAU_faisalite_isolationist_dominant_desc: "Saudi Arabia has closed itself to most foreign influence and obligations. This preserves its independence but reduces access to outside knowledge and leaves it diplomatically isolated."
 SAU_faisalite_isolationist_leaning: "§OLeaning Isolationist§!"
 SAU_faisalite_isolationist_leaning_desc: "The Kingdom is drawing in. Fewer foreign hands, fewer foreign obligations, and a diplomatic corps with less and less to do."
 SAU_faisalite_labour_shortage: "Labour Shortage"
 SAU_faisalite_labour_shortage_desc: "Half the scaffolding in the Kingdom stands empty. The men who held it have gone home, and the men who were meant to replace them have not arrived."
 SAU_faisalite_nationalised_management: "Nationalised Management"
 SAU_faisalite_nationalised_management_desc: "The foreign managers are gone and their replacements are learning the job on it. The plants still run, after a fashion."
 SAU_faisalite_officers_abroad: "The Officer Corps Abroad"
 SAU_faisalite_officers_abroad_desc: "The best of the staff are advising someone else's army. Their own formations notice the absence."
 SAU_faisalite_street_movement: "The Street Remembers Faisal"
 SAU_faisalite_street_movement_desc: "A popular movement is presenting King Faisal as a model of Saudi independence, emphasizing the oil embargo and his resistance to Western pressure. Its simplified account of his rule has spread from mosques to university campuses and now sustains an organized opposition movement."
 SAU_forces_modernized: "Modernized Armed Forces"
 SAU_forces_modernized_desc: "A fully modern, professional military - the equal of any in the region and a true counterweight to Iran."
 SAU_forces_modernizing: "Modernizing Forces"
 SAU_forces_modernizing_desc: "Training, doctrine and equipment are catching up to Western standards. The forces are now a match for their neighbours."
 SAU_forces_reforming: "Forces in Reform"
 SAU_forces_reforming_desc: "The first reforms are taking hold and the worst of the old weaknesses are fading. Keep modernizing."
 SAU_forces_unmodernized: "Unmodernized Armed Forces"
 SAU_forces_unmodernized_desc: "Decades of reliance on foreign contractors and outdated doctrine have left the armed forces unready. Use the §YModernize the Armed Forces§! decision to reform them, step by step."
 SAU_fortified_kingdom: "Fortress Arabia"
 SAU_fortified_kingdom_desc: "Hardened bases, layered air defenses, and coastal garrisons improve Saudi Arabia's ability to withstand an Iranian attack."
 SAU_french_investment_pact_FRA: "Saudi-French Investment Pact"
 SAU_french_investment_pact_FRA_desc: "A state-backed pact opens Saudi markets to French industry and brings Gulf capital into France."
 SAU_grievance_bitter: "Officer Corps: Bitter"
 SAU_grievance_brink: "Officer Corps: At the Brink"
 SAU_grievance_contained: "Officer Corps: Contained"
 SAU_grievance_mutinous: "Officer Corps: Mutinous"
 SAU_grievance_restive: "Officer Corps: Restive"
 SAU_guardian_of_palestine: "Guardian of Palestine"
 SAU_guardian_of_palestine_desc: "By championing the Palestinian cause the Kingdom has earned standing across the Muslim world, lending the throne legitimacy at home and abroad."
 SAU_gulf_war_lessons: "Lessons of the Gulf War"
 SAU_gulf_war_lessons_desc: "The 1991 Gulf War exposed serious weaknesses in Saudi equipment, doctrine, and command. The General Staff is studying competing models for military reform but has not yet selected one.\n\n§G+5%§! Army Experience Gain\n§G+5%§! Planning Speed\n\n§YRun the 'War Games: Lessons of the Gulf' decision to choose a doctrine.§!"
 SAU_hajj_management_01: "Custodian of the Two Holy Mosques"
 SAU_hajj_management_01_desc: "As guardians of Mecca and Medina, the Saudi government oversees the annual Hajj pilgrimage, welcoming roughly two million Muslims from around the world each year. The pilgrimage generates significant revenue through tourism, transportation, and hospitality, while granting the Kingdom unparalleled religious prestige across the Muslim world."
 SAU_hajj_management_02: "Expanded Holy Sites Infrastructure"
 SAU_hajj_management_02_desc: "Major investments in the Grand Mosque expansion, modern transportation networks, and improved accommodation facilities have increased the Hajj capacity significantly. The holy cities can now welcome millions more pilgrims annually, boosting both revenue and the Kingdom's standing as the spiritual heart of Islam."
 SAU_hajj_management_03: "Grand Pilgrimage Megaprojects"
 SAU_hajj_management_03_desc: "Expansion of the Masjid al-Haram, high-speed rail links, and new hospitality districts has increased pilgrimage capacity beyond five million people per year. Year-round Umrah tourism also provides substantial revenue while reinforcing Saudi Arabia's religious standing."
 SAU_hormuz_shield: "The Hormuz Shield"
 SAU_hormuz_shield_desc: "Saudi naval escorts protect tankers passing through the Strait of Hormuz and reduce Iran's ability to disrupt oil shipments."
 SAU_IMEC_india_deal_new: "The IMEC Corridor"
 SAU_IMEC_india_deal_new_desc: "The India-Middle East-Europe corridor channels Indian trade through Saudi ports and rail. The Kingdom collects the tolls of a new Silk Road."
 SAU_IMEC_india_deal_new_loc: "\n§H[RAJ.GetFlag] India-Middle East-Europe Economic Corridor§! (IMEC) [SAU.GetFlag]\nConstruction Speed: §G+5.00%§!\nFuel Gain per Fossil Fuels: §G+3.00%§!\n§HResource Export Revenue§! Multiplier: §G+1.50%§!\n"
 SAU_India_one_IMEC_india_deal: "[RAJ.GetFlag] §HIndia-Middle East-Europe Economic Corridor§![SAU.GetFlag] (IMEC)"
 SAU_India_one_IMEC_india_deal_desc: "The India-Middle East-Europe Economic Corridor links Indian ports through the Gulf to European markets by rail and sea. India stands at the corridor's eastern gate and profits with every shipment."
 SAU_iraq_border_defense: "Northern Frontier Defenses"
 SAU_iraq_border_defense_desc: "The army is dug in along the Iraqi border, ready for any repeat of 1990. +10% defense against Iraq. Lifts once Saddam is gone."
 SAU_iraq_pipeline_t1: "Europe Pipeline (Tier I)"
 SAU_iraq_pipeline_t1_desc: "Saudi oil flows north through Iraq toward Turkey and the European market Moscow guards so jealously. §GAdditional Income: up to $1.25B§! from your pipeline network. We pay every country the line crosses a transit fee of $1.25B each (§RAdditional Expense§!). Sabotage drops the line one tier, cutting both; a severed tier 1 line closes the route."
 SAU_iraq_pipeline_t2: "Europe Pipeline (Tier II)"
 SAU_iraq_pipeline_t2_desc: "Saudi oil flows north through Iraq toward Turkey and the European market Moscow guards so jealously. §GAdditional Income: up to $1.25B§! from your pipeline network. We pay every country the line crosses a transit fee of $1.25B each (§RAdditional Expense§!). Sabotage drops the line one tier, cutting both; a severed tier 1 line closes the route."
 SAU_iraq_pipeline_t3: "Europe Pipeline (Tier III)"
 SAU_iraq_pipeline_t3_desc: "Saudi oil flows north through Iraq toward Turkey and the European market Moscow guards so jealously. §GAdditional Income: up to $1.25B§! from your pipeline network. We pay every country the line crosses a transit fee of $1.25B each (§RAdditional Expense§!). Sabotage drops the line one tier, cutting both; a severed tier 1 line closes the route."
 SAU_islamic_finance_hub: "Islamic Finance Hub"
 SAU_islamic_finance_hub_desc: "Saudi Arabia's growing Sharia-compliant banking sector attracts deposits and investment from across the Muslim world. Sukuk bonds and halal investment funds are establishing the Kingdom as a center of Islamic finance."
 SAU_islamic_leadership: "Leader of the Islamic World"
 SAU_islamic_leadership_desc: "Saudi Arabia's custody of Mecca and Medina and its role in major Islamic summits give Riyadh substantial influence across the Muslim world."
 SAU_israel_tech_partnership: "Silicon and Sand"
 SAU_israel_tech_partnership_desc: "The Riyadh Accords combine Saudi investment with Israeli technology and support joint research in both countries."
 SAU_junta_accepted: "The Council: Accepted"
 SAU_junta_contested: "The Council: Contested"
 SAU_junta_illegitimate: "The Council: Illegitimate"
 SAU_junta_rejected: "The Council: Rejected"
 SAU_junta_tolerated: "The Council: Tolerated"
 SAU_king_salman_bridge: "The King Salman Causeway"
 SAU_king_salman_bridge_desc: "A bridge across the Strait of Tiran links Arabia to Africa, accelerating construction and trade across two continents."
 SAU_knowledge_economy: "Knowledge Economy"
 SAU_knowledge_economy_desc: "Investment in universities, vocational training, and research institutions is building the human capital needed for a post-oil economy. Saudi graduates are entering technology, engineering, and business fields in growing numbers."
 SAU_laf_offensive: "Operation Cedar Resolve"
 SAU_laf_offensive_desc: "Saudi funding and equipment have increased the Lebanese Army's ability and willingness to conduct offensive operations against Hezbollah."
 SAU_logistics_hub: "Logistics Hub"
 SAU_logistics_hub_desc: "Jeddah Islamic Port and expanded airport facilities position Saudi Arabia as a key logistics crossroads between Asia, Africa, and Europe. Efficient trade infrastructure boosts export revenues."
 SAU_modern_infrastructure: "Modern Infrastructure"
 SAU_modern_infrastructure_desc: "The Riyadh Metro and nationwide highway expansion are transforming the Kingdom's transportation networks. Modern infrastructure reduces costs, attracts investment, and improves quality of life."
 SAU_national_water_pride_minus1: "§HSovereign Waters§! - §YDoubtful§!"
 SAU_national_water_pride_minus1_desc: "At 35-44% Stability, public confidence in the §LSaudi-owned§! water program is weakening. This causes a §Ysmall loss of legitimacy§! for the dynasty."
 SAU_national_water_pride_minus2: "§HSovereign Waters§! - §RStrained§!"
 SAU_national_water_pride_minus2_desc: "Low stability has increased private criticism of the §Lnational water program§!. Its poor performance is damaging the dynasty's reputation."
 SAU_national_water_pride_minus3: "§HSovereign Waters§! - §RBackfiring§!"
 SAU_national_water_pride_minus3_desc: "The water program has become a prominent example of government mismanagement. Continuing shortages are causing a §Rserious loss of support§! for the dynasty."
 SAU_national_water_pride_minus4: "§HSovereign Waters§! - §RCatastrophic§!"
 SAU_national_water_pride_minus4_desc: "Under conditions of §Rextreme instability§!, water shortages have severely damaged the legitimacy of the §HHouse of al Saud§!. Only restored stability or the fall of the dynasty will end this penalty."
 SAU_national_water_pride_neutral: "§HSovereign Waters§! - §YSteady§!"
 SAU_national_water_pride_neutral_desc: "At approximately 50% Stability, the national water program provides neither a political benefit nor a penalty. A change in Stability will move it into a positive or negative tier."
 SAU_national_water_pride_plus1: "§HSovereign Waters§! - §GSatisfied§!"
 SAU_national_water_pride_plus1_desc: "Adequate stability and reliable water service preserve the dynasty's reputation and provide a §Gmodest§! political benefit."
 SAU_national_water_pride_plus2: "§HSovereign Waters§! - §GThriving§!"
 SAU_national_water_pride_plus2_desc: "Strong stability and reliable operation of the §LSaudi-owned§! desalination system demonstrate government competence and improve respect for the §HHouse of al Saud§!."
 SAU_national_water_pride_plus3: "§HSovereign Waters§! - §GConfident§!"
 SAU_national_water_pride_plus3_desc: "High stability has made the national water program a §Hsource of domestic prestige§!. Demand for §LKAUST§! expertise abroad and the program's financial returns provide additional benefits."
 SAU_national_water_pride_plus4: "§HSovereign Waters§! - §GTriumphant§!"
 SAU_national_water_pride_plus4_desc: "At the highest level of stability, the §LSaudi-owned§! water program is widely regarded as a major national achievement. Its success gives the §HHouse of al Saud§! the maximum legitimacy benefit from the program."
 SAU_nda_free_press: "A Free Press"
 SAU_nda_free_press_loc: "[SAU.GetFlag]A Free Press\n§HPolitical Power Gain:§! §G+5.00%§! \n§HForeign Influence Defense:§! §G+20.00%§!\n\n"
 SAU_nda_free_world: "A Member of the Free World"
 SAU_nda_free_world_loc: "[SAU.GetFlag]A Member of the Free World\n§HTrade Opinion:§! §G+15.00%§!\n§HMonthly Opinion Gain:§! §G+20.00%§!\n\n"
 SAU_nda_knowledge_economy: "A Knowledge Economy"
 SAU_nda_knowledge_economy_loc: "[SAU.GetFlag]A Knowledge Economy\n§HResearch Speed:§! §G+5.00%§!\n§HStability:§! §G+3.00%§!\n\n"
 SAU_nda_open_market: "Open Markets"
 SAU_nda_open_market_loc: "[SAU.GetFlag]Open Markets\n§HConsumer Goods:§! §G-10.00%§!\n§HForeign Investment Cost:§! §G-5.00%§!\n§HReturn on Investment:§! §G+5.00%§!\n\n"
 SAU_neom_aqaba_zone: "NEOM-Aqaba Economic Zone"
 SAU_neom_aqaba_zone_desc: "The Saudi megacity of NEOM and the Jordanian port of Aqaba operate as a single cross-border economic zone, accelerating construction and feeding the treasury."
 SAU_oil_defend_price_idea: "Defending the Price"
 SAU_oil_defend_price_idea_desc: "Saudi Arabia has reduced production to support the world oil price. This improves revenue per barrel but sacrifices market share to producers that maintain their output."
 SAU_oil_dependence_t1: "§GThe Oil Economy§! - Diversified"
 SAU_oil_dependence_t1_desc: "§HOil dependence: §!§Y[?oil_dependence|0]§!§H / 100§!\n§RIt Changed Every 3 Months Automatic§!\n\nA modern, diversified economy. Oil is one export among many - the Kingdom is §Gresilient§! to whatever the price of crude may do. Vision 2030, achieved."
 SAU_oil_dependence_t2: "§YThe Oil Economy§! - Broad-Based"
 SAU_oil_dependence_t2_desc: "§HOil dependence: §!§Y[?oil_dependence|0]§!§H / 100§!\n§RIt Changed Every 3 Months Automatic§!\n\nIndustry, services and technology now carry real weight. An oil shock is survivable, not catastrophic."
 SAU_oil_dependence_t3: "§YThe Oil Economy§! - Diversifying"
 SAU_oil_dependence_t3_desc: "§HOil dependence: §!§Y[?oil_dependence|0]§!§H / 100§!\n§RIt Changed Every 3 Months Automatic§!\n\nThe economy is broadening. Oil remains the largest pillar, but no longer the only one that matters."
 SAU_oil_dependence_t4: "§RThe Oil Economy§! - Oil-Dependent"
 SAU_oil_dependence_t4_desc: "§HOil dependence: §!§Y[?oil_dependence|0]§!§H / 100§!\n§RIt Changed Every 3 Months Automatic§!\n\nNon-oil sectors are growing, but crude still pays for nearly everything. A price crash would still hurt - badly."
 SAU_oil_dependence_t5: "§RThe Oil Economy§! - Total Petrostate"
 SAU_oil_dependence_t5_desc: "§HOil dependence: §!§Y[?oil_dependence|0]§!§H / 100§!\n§RIt Changed Every 3 Months Automatic§!\n\nThe Kingdom lives and dies by the barrel. Oil is §Galmost all§! of the budget - immensely profitable, but §Rdangerously exposed§! to any collapse in the world price.\n§YOil dependence changes only through your focuses and decisions - oil choices raise it, diversification lowers it. The Kingdom begins deeply dependent; only sustained reform brings it down, and it stays where you leave it.§!"
 SAU_oil_embargoed: "§ROil Embargo§!"
 SAU_oil_embargoed_desc: "Saudi Arabia and its OPEC partners have cut off the oil. Fuel queues, factory shutdowns and soaring prices grip the economy until the embargo is lifted."
 SAU_oil_for_security_pact: "Oil for Security"
 SAU_oil_for_security_pact_desc: "The Kingdom keeps American markets supplied with oil, and Washington underwrites Saudi security. The arrangement anchors the riyal, the dollar, and the House of Saud alike."
 SAU_oil_for_security_pact_loc: "[USA.GetFlag]Oil for Security\n§HFossil Fuels Export Revenue Multiplier:§! §G+5.00%§!\n"
 SAU_oil_for_security_pact_USA: "Oil for Security"
 SAU_oil_for_security_pact_USA_desc: "Riyadh guarantees the flow of oil to American markets: cheap, reliable fuel in exchange for the American security umbrella."
 SAU_oil_market_share_idea: "Defending the Market Share"
 SAU_oil_market_share_idea_desc: "Saudi Arabia is maintaining high production and accepting lower prices to preserve its share of the oil market. Its low extraction costs allow it to outlast more expensive producers."
 SAU_oil_price_collapse_idea: "Oil Price Collapse"
 SAU_oil_price_collapse_idea_desc: "Oil prices are far below the level assumed by the state budget. Export income has fallen while welfare spending remains high, forcing the government to draw on its reserves."
 SAU_oil_workforce: "Oil Workforce Development"
 SAU_oil_workforce_desc: "Trained Saudi nationals are replacing foreign workers in the petroleum sector. A skilled domestic workforce improves operational efficiency and keeps wages circulating in the local economy."
 SAU_OPEC_Russia_deal_new: "OPEC+ Coordination"
 SAU_OPEC_Russia_deal_new_desc: "Riyadh and Moscow set production quotas together. Two oil superpowers steering one market."
 SAU_OPEC_Russia_deal_new_loc: "\n§H[SAU.GetFlag]OPEC+ Agreement[SOV.GetFlag]§!\n§HFossil Fuels Export Revenue Multiplier:§! §G+5.00%§!\n"
 SAU_Pakistan_training_SaudiTroops_in_region: "[PAK.GetFlag] Pakistani Military Advisors"
 SAU_Pakistan_training_SaudiTroops_in_region_desc: "Pakistani military advisors and troops have been actively training and assisting Saudi forces for more than 40 years, with the official advisory and training mission still ongoing. This extensive security partnership is anchored by a bilateral security protocol formalized in 1982."
 SAU_pipeline_empire: "Crossroads of Energy"
 SAU_pipeline_empire_desc: "Saudi Arabia now has oil export routes to three seas and no longer depends on the Strait of Hormuz as its only major outlet."
 SAU_pipeline_transit_IRQ_t1: "Saudi Pipeline Transit (Tier I)"
 SAU_pipeline_transit_IRQ_t1_desc: "Saudi oil crosses Iraq, and the transit fees swell the treasury. The pipeline lifts the nation's oil output. §GAdditional Income: $1.00B§!"
 SAU_pipeline_transit_IRQ_t2: "Saudi Pipeline Transit (Tier II)"
 SAU_pipeline_transit_IRQ_t2_desc: "Saudi oil crosses Iraq, and the transit fees swell the treasury. The pipeline lifts the nation's oil output. §GAdditional Income: $1.15B§!"
 SAU_pipeline_transit_IRQ_t3: "Saudi Pipeline Transit (Tier III)"
 SAU_pipeline_transit_IRQ_t3_desc: "Saudi oil crosses Iraq, and the transit fees swell the treasury. The pipeline lifts the nation's oil output. §GAdditional Income: $1.25B§!"
 SAU_pipeline_transit_JOR_t1: "Saudi Pipeline Transit (Tier I)"
 SAU_pipeline_transit_JOR_t1_desc: "Saudi oil crosses Jordan, and the transit fees swell the treasury. The pipeline lifts the nation's construction speed. §GAdditional Income: $1.00B§!"
 SAU_pipeline_transit_JOR_t2: "Saudi Pipeline Transit (Tier II)"
 SAU_pipeline_transit_JOR_t2_desc: "Saudi oil crosses Jordan, and the transit fees swell the treasury. The pipeline lifts the nation's construction speed. §GAdditional Income: $1.15B§!"
 SAU_pipeline_transit_JOR_t3: "Saudi Pipeline Transit (Tier III)"
 SAU_pipeline_transit_JOR_t3_desc: "Saudi oil crosses Jordan, and the transit fees swell the treasury. The pipeline lifts the nation's construction speed. §GAdditional Income: $1.25B§!"
 SAU_pipeline_transit_SYR_t1: "Saudi Pipeline Transit (Tier I)"
 SAU_pipeline_transit_SYR_t1_desc: "Saudi oil crosses Syria, and the transit fees swell the treasury. The pipeline lifts the nation's construction and stability. §GAdditional Income: $1.00B§!"
 SAU_pipeline_transit_SYR_t2: "Saudi Pipeline Transit (Tier II)"
 SAU_pipeline_transit_SYR_t2_desc: "Saudi oil crosses Syria, and the transit fees swell the treasury. The pipeline lifts the nation's construction and stability. §GAdditional Income: $1.15B§!"
 SAU_pipeline_transit_SYR_t3: "Saudi Pipeline Transit (Tier III)"
 SAU_pipeline_transit_SYR_t3_desc: "Saudi oil crosses Syria, and the transit fees swell the treasury. The pipeline lifts the nation's construction and stability. §GAdditional Income: $1.25B§!"
 SAU_pipeline_transit_TUR_t1: "Saudi Pipeline Transit (Tier I)"
 SAU_pipeline_transit_TUR_t1_desc: "Saudi oil crosses Turkey, and the transit fees swell the treasury. The pipeline lifts the nation's steel and chromium output. §GAdditional Income: $1.00B§!"
 SAU_pipeline_transit_TUR_t2: "Saudi Pipeline Transit (Tier II)"
 SAU_pipeline_transit_TUR_t2_desc: "Saudi oil crosses Turkey, and the transit fees swell the treasury. The pipeline lifts the nation's steel and chromium output. §GAdditional Income: $1.15B§!"
