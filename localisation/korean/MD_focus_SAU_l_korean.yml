 SAU_events.314.b: "육군 항공: 근접 지원"
 SAU_events.314.c: "육군 항공: 정찰 및 습격"
 SAU_events.314.desc: "아파치 함대는 어떤 임무를 숙달해야 합니까? 각각의 길은 지속적인 맞교환이며, 한 방향에서는 우리를 강하게 하고 다른 방향에서는 약하게 합니다.\n\n§Y선택지에 마우스를 올리면 그것이 무엇을 부여하고 무엇을 요구하는지 정확히 볼 수 있습니다.§!"
