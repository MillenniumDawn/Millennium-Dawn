name: GitHub Pages Deployment (Astro)

on:
  push:
    branches: ["main"]
    paths:
      - "docs/**"
      - ".github/workflows/github-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      pages_setup: ${{ steps.setup_pages.outcome }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          sparse-checkout: docs
          sparse-checkout-cone-mode: true

      - name: Setup Pages
        id: setup_pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
        # Fails when Pages is not enabled on the repository (forks, fresh
        # clones). The build still publishes an artifact; only deploy is skipped.
        continue-on-error: true
        with:
          enablement: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: "24"

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.14"

      - name: Install docs dependencies
        working-directory: ./docs
        run: bun install

      - name: Build with Astro
        working-directory: ./docs
        env:
          PUBLIC_SITE_BASE_PATH: ${{ steps.setup_pages.outputs.base_path }}
          PUBLIC_SITE_FALLBACK_ORIGIN: ${{ steps.setup_pages.outputs.origin }}
          PUBLIC_SITE_REPO_EDIT_BASE: https://github.com/${{ github.repository }}/edit/${{ github.event.repository.default_branch }}/docs
        run: bun run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ./docs/dist

  deploy:
    if: needs.build.result == 'success' && needs.build.outputs.pages_setup == 'success'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write # required for OIDC-based Pages deployment
      pages: write # required to push to GitHub Pages
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
