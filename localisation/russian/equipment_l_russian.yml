 CHI_Anti_Air_0: "HN-5"
 CHI_Anti_Air_0_desc: "HN-5 («Красная кисточка-5») — семейство китайских переносных зенитно-ракетных комплексов (ПЗРК) первого поколения с твердотопливным ракетным двигателем, основанных на советских технологиях."
 CHI_Anti_Air_1: "QW-1 Vanguard"
 CHI_Anti_Air_1_desc: "QW-1 Vanguard, разработанная Китайской Народной Республикой, представляет собой всеракурсную твердотопливную переносную ракету класса «земля-воздух» с инфракрасным самонаведением."
 CHI_Anti_Air_2: "FN-6"
 CHI_Anti_Air_2_desc: "FN-6 или Feinu-6 («Летающий арбалет-6») представляет собой переносную зенитно-ракетную систему с одноступенчатым твердотопливным двигателем третьего поколения с пассивным инфракрасным самонаведением."
 CHI_Anti_Air_3: "FN-26"
 CHI_Anti_Air_4: "FN-36"
 CHI_APC_1: "Тип 63"
 CHI_APC_1_desc: "Тип 63 производства Norinco, также известный как WZ-211, — китайский лёгкий плавающий танк с 85-мм нарезной пушкой Тип 62-85TC и сварной бронёй из катаной стали."
 CHI_APC_2: "ZSD-89"
 CHI_APC_2_desc: "Гусеничная боевая бронированная машина Тип 89 производства Norinco представляет собой китайский бронетранспортёр, способный перевозить 13 пассажиров, а также имеющий сварной стальной корпус и 12,7-мм зенитный пулемёт QJC88."
 CHI_APC_3: "ZSL-92"
 CHI_APC_3_desc: "ZSL92 (также известный как ZSL92) — семейство китайских колесных бронетранспортеров, способных перевозить 9 пассажиров, а также имеющих сварной стальной корпус и вооруженных либо автоматической пушкой, либо 12,7-мм крупнокалиберным пулеметом."
 CHI_APC_4: "ZBD-05"
 CHI_APC_4_desc: "Бронемашина-амфибия типа 05 представляет собой семейство гусеничных боевых бронированных машин-амфибий. Она рассчитана на перевозку 8 человек и оснащена корпусом из алюминиевого сплава, 30-мм пушкой, 105-мм нарезной пушкой L7, 12,7-мм пулеметом и ракетами HJ-8. "
 CHI_APC_5: "ZBL-09 Snow Leopard"
 CHI_APC_5_desc: "ZBL-09 Snow Leopard — бронетранспортёр, разработанный компанией NORINCO. Он способен перевозить от 7 до 10 человек и оснащен 30-мм пушкой, ПТУР HJ-73 и 7,62-мм пулеметом."
 CHI_APC_5_short: "ZBL-09"
 CHI_APC_6: "ZBL-19"
 CHI_APC_6_short: "ZBL-19"
 CHI_APC_7: "ZBL-23"
