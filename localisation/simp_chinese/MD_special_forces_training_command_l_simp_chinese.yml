 MD_sftc_ex_marine_tt: "§Y两栖突袭演习§!\n\n£navy_experience 海军经验：§R-300§!\n£army_experience 陆军经验：§R-150§!\n£command_power 指挥点数：§R-75§!\n获得国家精神§Y两栖突袭演习§!，持续§Y90§!天：\n £fuel_consumption_texticon  海军燃料消耗：§R+10%§!\n £amphibious_texticon  两栖登陆：§G+5%§!\n£doctrine_mastery §Y特种陆战队§!精通度：[MD_sftc_exercise_mastery_tt_text]每天，持续§Y90§!天\n\n需要§Y混合指挥§!或§Y注重海军陆战队§!主要学说。"
 MD_sftc_ex_airborne_tt: "§Y空降突袭演习§!\n\n£air_experience 空军经验：§R-300§!\n£army_experience 陆军经验：§R-150§!\n£command_power 指挥点数：§R-75§!\n获得国家精神§Y空降突袭演习§!，持续§Y90§!天：\n £fuel_consumption_texticon 空军燃油消耗：§R+10%§!\n £organisation_paratroop_texticon 伞降组织度：§G+5%§!\n£doctrine_mastery §Y空降部队§!精通度：每天[MD_sftc_exercise_mastery_tt_text]，持续§Y90§!天\n\n需要§Y混合指挥§!或§Y注重空降部队§!主要学说。"
 MD_sftc_ex_joint_tt: "§Y联合特种作战演习§!\n\n£army_experience 陆军经验：§R-150§!\n£navy_experience 海军经验：§R-150§!\n£air_experience 空军经验：§R-150§!\n£command_power 指挥点数：§R-75§!\n获得国家精神§Y联合特种作战演习§!，持续§Y90§!天：\n £fuel_consumption_texticon  陆军燃料消耗：§R+10%§!\n £attack_specops_texticon  特种部队攻击：§G+2%§!\n£doctrine_mastery §Y特种作战§!精通度：每天[MD_sftc_exercise_mastery_tt_text]，持续§Y90§!天\n\n需要一项§Y特种部队§!主要学说。"
 MD_sftc_ex_air_assault_tt: "§Y空中突击破袭§!\n\n£army_experience 陆军经验：§R-225§!\n£air_experience 空军经验：§R-225§!\n£command_power 指挥点数：§R-75§!\n获得国家精神§Y空中突击破袭§!持续§Y90§!天：\n £fuel_consumption_texticon  空军燃料消耗：§R+10%§!\n £defence_specops_texticon  特种部队防御：§G+2%§!\n£doctrine_mastery §Y补充特种部队§!精通度：每天 [MD_sftc_exercise_mastery_tt_text] 持续§Y90§!天\n\n需要§Y注重海军陆战队§!主要学说。"
