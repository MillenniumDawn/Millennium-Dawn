 TAT_util_vehicle_5: "GAZ 티그르"
 TAT_util_vehicle_5_desc: "이 장갑 병력 수송차는 다양한 무기로 무장할 수 있으며 최대 11명을 수송할 수 있습니다."
 TAT_util_vehicle_6: "VPK-3927 볼크"
 TAT_util_vehicle_6_desc: "VPK는 2+8명을 수송할 수 있습니다. STANAG 4569 3등급 장갑을 갖추었습니다. 특수부대와 경찰 병력에 적합합니다."
 TAT_util_vehicle_7: "Z-STS 아흐마트"
 TAT_util_vehicle_7_desc: "Z-STS 아흐마트는 3축 전륜구동 차체인 카마즈-5350을 기반으로 제작되었습니다. 기동성과 주행 능력이 뛰어나며 운용이 복잡하지도 않습니다. 흥미롭게도 이 장갑차는 일반 트럭과 달리 보닛형 구조로 제작되었습니다. 덕분에 승무원 좌석을 뒤쪽으로 옮겨 안전성을 높일 수 있었습니다."
 EQUIPMENT_DESCRIPTION: "$NAME$"
 CAN_APC_2_desc: "1974년 캐나다군은 스위스의 모와그 피라냐 6x6 차량을 선정했습니다. 이 차량의 생산은 제너럴 모터스 캐나다의 한 부서인 캐나다 기업 디젤 사업부가 면허를 받아 맡았습니다."
 CAN_APC_3_desc: "1988년 제너럴 모터스 캐나다의 한 부서인 디젤 사업부는 8x8 차륜형 장갑차 시제품 제작을 맡았습니다. 이 차량은 경장갑차(LAV)의 차체와 엔진을 기반으로 했습니다. 캐나다군은 바이슨이라 불리는 개조형 보병 분대 수송차의 주문을 요청했습니다."
 CAN_APC_4_desc: "잉여 LAV TUA 차체에 누넉 원격 조종 무장 거치대를 장착하여 보병 분대 수송차로 운용합니다."
 CAN_APC_5_desc: "LAV III를 LAV 6.0 표준으로 최종 개량한 차량으로, 보병이나 화물 수송을 위해 높은 지붕선을 유지했습니다. 개량을 통해 전자 장비 향상, 급조폭발물 방호, 추가 장갑 등 방어력이 강화되었으며, 기관총으로 무장한 프로텍터 원격 조종 무장 거치대를 유지합니다."
 CAN_MBT_1: "센추리온"
 CAN_MBT_1_short: "센추리온"
 CAN_MBT_1_desc: "센추리온은 등장 당시 초기 주력 전차의 모범을 개척한 혁신적인 설계였습니다. 제2차 세계 대전 말기에 설계 및 생산되었으나 전후에야 실전에 투입되었으며, 곧 소련 T-54 전차에 대한 서방의 해답이 되었습니다. 1970년대 초반까지 센추리온 전차는 캐나다 전차 전력의 대부분을 차지했습니다."
 CAN_MBT_2: "레오파르트 C1"
 CAN_MBT_2_desc: "캐나다는 1978년 독일의 레오파르트 주력 전차를 도입했습니다. 총 127대를 구입했으며, 그중 114대는 레오파르트 1A3 표준을 기반으로 현지 요구 사항에 맞춰 \\"캐나다화\\"되었습니다."
 CAN_MBT_2_short: "레오파르트 C1"
 CAN_MBT_3: "레오파르트 C2"
 CAN_MBT_3_desc: "레오파르트 C1의 개량형으로, 대체로 레오파르트 1A5 표준으로 개량되었습니다. 일부 소대는 추가 장갑을 장착하여 1999년 코소보에 파견되었으며, 2006년에는 한 기병대대가 아프가니스탄 투입을 위해 MEXAS 덧씌움 모듈식 장갑과 파편 방지 내장재로 개량되었습니다."
 CAN_MBT_3_short: "레오파르트 C2"
 CAN_MBT_4: "레오파르트 2A4M CAN"
 CAN_MBT_4_desc: "레오파르트 2A4M CAN은 레오파르트 2A4의 캐나다 개량형입니다. 이 전차는 재정비된 레오파르트 2A4에 \\"M\\" 대지뢰 장갑 패키지와 기타 추가 개량을 적용한 것으로, 아프가니스탄 전쟁 당시 ISAF 병력을 지원하기 위해 성공적으로 배치되었습니다. 최근의 레오파르트 2A7+ 파생형과 유사한 덧씌움 장갑이 추가되어 방호력이 한층 강화되었으며, 이는 2A4의 포탑 구성에 맞게 수정되었습니다. 기본형 A4의 라인메탈 120mm L/44 활강포는 그대로 유지합니다."
 CAN_MBT_4_short: "레오파르트 2A4M CAN"
 CAN_MBT_5: "레오파르트 2A6M CAN"
 CAN_MBT_5_desc: "레오파르트 2A6M CAN 전차는 레오파르트 2A6 전차의 캐나다 파생형입니다. 주요 개조 사항으로는 지뢰 방호용 하부 장갑이 추가되어 \\"M\\" 명칭이 붙은 것, 포탑 후방에 장착된 특유의 황갈색 상자, 그리고 \\"T\\" 안테나 거치대를 포함한 캐나다군 지정 통신 장비 및 대급조폭발물 재밍 장비, 이격 슬랫 장갑이 있습니다."
 CAN_MBT_5_short: "레오파르트 2A6M CAN"
 CAN_IFV_1: "CTL 밥캣"
 CAN_IFV_1_desc: "밥캣 계획은 전시에 사용된 램 캥거루 장갑차를 대체하고 개조 전차였던 해당 차량의 결함을 바로잡기 위한 논리적 발전으로 1952년에 시작되었습니다. 이후 4년에 걸쳐 수륙양용 완전 장갑 수송차와 유니버설 캐리어의 현대화 대체 차량 사이에서 개념이 오가며 수정이 이어졌습니다."
 CAN_IFV_1_short: "CTL 밥캣"
 CAN_IFV_2: "그리즐리 AVGP"
 CAN_IFV_2_desc: "1974년 캐나다군은 스위스의 모와그 피라냐 6x6 차량을 선정했습니다. 이 차량의 생산은 제너럴 모터스 캐나다의 한 부서인 캐나다 기업 디젤 사업부가 면허를 받아 맡았습니다. 그리즐리 파생형은 캐딜락 게이지 1인용 포탑을 사용했습니다."
 CAN_IFV_2_short: "그리즐리 AVGP"
 CAN_IFV_3_short: "LAV-III 코디액"
 CAN_IFV_4_desc: "LAV III의 개량형으로, LAV 작전 요구 통합 과제(LORIT)에 따라 신형 포탑과 전자 장비, 강화된 급조폭발물 방호, 추가 장갑이 적용되었습니다."
 CAN_IFV_5: "LAV-6 IFV"
 CAN_IFV_5_desc: "LAV III를 LAV 6.0 표준으로 최종 개량한 차량입니다. 신형 포탑, 전자 장비 향상, 강화된 급조폭발물 방호, 추가 장갑 등으로 방어력이 강화되었으며, 포탑은 원래의 LAV III와 유사하게 25mm 체인건과 동축 범용 기관총으로 무장합니다."
 CAN_IFV_5_short: "LAV-6 IFV"
 CAN_Rec_tank_3: "LAV-II 코요테"
 CAN_Rec_tank_3_short: "LAV-II 코요테"
