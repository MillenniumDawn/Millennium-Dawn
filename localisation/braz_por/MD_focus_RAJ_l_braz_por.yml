 raj_chi_border_stage_incursion_desc:0 "Enviar uma patrulha através da linha a partir de [From.GetName], nosso setor de fronteira designado. Custa 20 de Poder de Comando. As unidades mobilizadas sofrem desgaste durante o período. Aumenta a Tensão Bilateral em 15 e traz risco de baixas. Retirar a patrulha antes de passados os quinze dias entrega 3 de Prontidão ao nosso rival.\n\nQuando a patrulha retornar, o exército designa um novo setor de fronteira."
 raj_chi_border_shell_positions:0 "Bombardear Posições de Fronteira a partir de [From.GetName]"
 raj_chi_border_shell_positions_desc:0 "Bombardear as posições defronte a [From.GetName], nosso setor de fronteira designado, com a artilharia e a artilharia de foguetes ali estacionadas. Custa 20 de Poder de Comando. As unidades mobilizadas sofrem desgaste durante o período. Aumenta a Tensão Bilateral em 22, gera mais tensão mundial e traz risco de retaliação. Retirar as peças antes de passados os quinze dias entrega 5 de Prontidão ao nosso rival.\n\nQuando o bombardeio terminar, o exército designa um novo setor de fronteira."
 raj_chi_border_negotiate:0 "Abrir Negociações Sino-Indianas"
 raj_chi_border_negotiate_desc:0 "Usar a boa vontade mútua para reduzir a Tensão Bilateral em 25 e encerrar um confronto ativo."
 raj_chi_border_negotiate_tt:0 "§GA Tensão Bilateral Sino-Indiana diminui em 25§!"
 pak_raj_border_attack_427_from_420:0 "Atacar Jammu e Caxemira a partir de Azad Caxemira"
 pak_raj_border_attack_427_from_420_desc:0 "Lançar uma operação limitada através da Linha de Controle, de Azad Caxemira para Jammu e Caxemira. Um avanço bem-sucedido adiciona §Y20 de Progresso da Reivindicação§! rumo a este estado; um rechaço custa §Y10§!."
