 SOV_koba_politic_modifier: "El Concepto de Seguridad Pública"
 SOV_koba_politic_modifier_desc: "The concept of public safety gives an understanding of why we are happy or not, healthy or sick, why someone is lucky and someone is not, and how to influence it. These are the answers to the questions: what is good and what is bad, what is shame and conscience, what is intuition and why do some listen to it, others do not, and is it really difficult to change fate?"
