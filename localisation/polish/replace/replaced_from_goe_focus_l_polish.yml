l_polish:
 PER_iran_first: "Iran przede wszystkim"
 AFG_graveyard_of_empires: "Cmentarzysko imperiów"
 PER_iran_first_desc: "Choć mamy sojuszników w regionie i na arenie międzynarodowej, w kwestii dobra naszego narodu musimy przede wszystkim stawiać na pierwszym miejscu Iran. Środki finansowe należy przeznaczyć na rozwój rodzimego przemysłu."
 AFG_graveyard_of_empires_desc: "Imperia przychodzą i odchodzą, ale nasz lud pozostaje niekwestionowanym władcą tego regionu. Dopóki nasz lud pozostanie zjednoczony i związany ze swoim dziedzictwem, każdy agresor przekona się, że [AFG.GetNameWithFlag] by naprawdę stać się ich cmentarzem."