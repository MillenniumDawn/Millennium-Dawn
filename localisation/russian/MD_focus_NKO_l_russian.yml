 NKO_korean_repair_frontline_workers_desc: "В соответствии с договором о партнерстве 2024 года, северокорейские трудовые бригады работают в тыловых районах западных округов России, восстанавливая железнодорожные депо, аэродромы, верфи и оружейные заводы. Пхеньян получает за эти работы денежное вознаграждение и топливо."
 NKO_korean_repair_frontline_workers_sov_desc: "Тысячи рабочих были направлены на российские строительные площадки по государственному контракту. Их заработная плата возвращается в Пхеньян в твердой валюте, но эти мужчины набираются из того же резерва, из которого вербуется Корейская народная армия."
 NKO_korean_repair_civil_workers_desc: "Северокорейские строительные бригады направляются на гражданские восстановительные работы по всей России, ремонтируя заводы, жилые дома и дороги. Москва оплачивает их содержание и выплачивает Пхеньяну гонорар за контракт."
 NKO_korean_repair_civil_workers_sov_desc: "Бригады гражданских рабочих направляются в российские строительные комбинаты по государственному контракту. За счет трудовых ресурсов внутри страны эти рабочие получают твердую валюту за рубежом."
 NKO_korean_ratnik_conversion_desc: "Поставляемое Россией пехотное снаряжение «Ратник» поступило в Корейскую народную армию: бронежилеты, разгрузочное снаряжение, оптика и одежда для холодной погоды. Это снаряжение значительно превосходит отечественное, и, соответственно, затраты на его содержание соответственно выше."
 NKO_naval_point_spend_tt: "Пункт наращивания военно-морских сил: §R-1§! (§Y[?NKO_naval_points|0]§! удерживается)"
