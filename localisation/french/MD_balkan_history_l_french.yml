 balkan_news.1.t: "Karadžić condamné pour génocide"
 balkan_news.1.d: "Le tribunal de La Haye a déclaré Radovan Karadžić coupable de génocide à Srebrenica et de crimes contre l'humanité en Bosnie, et l'a condamné à quarante ans de prison. Deux décennies après Dayton, le chef de guerre des Serbes de Bosnie a été jugé par la cour que sa guerre a fait naître."
 balkan_news.1.a: "Le verdict est lu à haute voix à Sarajevo"
 balkan_news.1.b: "Un verdict contre tous les Serbes, disent certains"
 balkan_news.1.c: "Justice, retardée"
 balkan_news.2.t: "Perpétuité pour Karadžić"
 balkan_news.2.d: "La chambre d'appel a rejeté le recours de Radovan Karadžić et porté sa peine à la réclusion à perpétuité, jugeant les quarante ans initiaux insuffisants au regard de la gravité de ses crimes. C'est le dernier mot sur l'homme qui a dirigé la Republika Srpska pendant la guerre."
 balkan_news.2.a: "La Haye clôt l'affaire"
 balkan_news.3.t: "Mladić condamné pour génocide"
 balkan_news.3.d: "Le tribunal a condamné Ratko Mladić pour génocide, crimes de guerre et crimes contre l'humanité, et l'a condamné à perpétuité. L'ancien général a vociféré contre les juges et a dû être évacué de la salle d'audience avant la fin de la lecture. À Srebrenica, les mères des disparus ont regardé en silence."
 balkan_news.3.a: "Le général répond enfin"
 balkan_news.4.t: "Suicide dans la salle d'audience"
 balkan_news.4.d: "Quelques instants après que les juges eurent confirmé sa peine de vingt ans, le général croate de Bosnie Slobodan Praljak a déclaré n'être pas un criminel de guerre et a avalé une fiole de poison devant les caméras. Il est mort dans les heures qui ont suivi. La chambre d'appel a confirmé les condamnations des six anciens dirigeants d'Herceg-Bosna, constatant une entreprise criminelle commune qui remontait jusqu'à Zagreb."
 balkan_news.4.a: "Il a refusé la justice du tribunal"
 balkan_news.4.b: "Une fin sinistre pour la dernière affaire du tribunal"
 balkan_news.5.t: "L'appel de Mladić rejeté"
 balkan_news.5.d: "Les juges des Nations unies ont confirmé la condamnation de Ratko Mladić pour génocide et sa peine à perpétuité, clôturant la dernière grande affaire née de la guerre de Bosnie. Un quart de siècle après Srebrenica, le règlement judiciaire de la guerre est achevé. Le règlement politique ne l'est pas."
 balkan_news.5.a: "Les archives se ferment"
 CRO_nat_populism_gain_tt: "§RLa droite nationaliste gagne du soutien.§!"
 balkan_news.6.t: "La déclaration du monde serbe"
 balkan_news.6.d: "Belgrade et Banja Luka ont adopté conjointement une déclaration de treize pages sur l'union des terres serbes sous un Haut Conseil permanent de coopération Serbie–Republika Srpska. Elle est courte sur la force juridique et longue sur l'intention."
 balkan_news.6.a: "Un mécène qui en vaut la peine"
 balkan_news.6.b: "L'autorité de Sarajevo s'érode encore davantage"
 balkan_news.6.c: "Nouvelles du voisinage"
 balkan_news.7.t: "L’EUFOR double sa mise"
 balkan_news.7.d: "Quelques jours après que les chars russes ont franchi la frontière ukrainienne, l'UE a à peu près doublé la garnison d'EUFOR Althea en Bosnie-Herzégovine, faisant venir des troupes de réserve pour parer à tout débordement d'instabilité."
 balkan_news.7.a: "Une démonstration de détermination rassurante"
 balkan_news.7.b: "Une précaution prise ailleurs"
 balkan_news.8.t: "Erdoğan rassemble Sarajevo"
 balkan_news.8.d: "Interdit de campagne en Europe occidentale, Erdoğan a tenu son seul meeting européen de la course à Sarajevo, attirant des milliers de personnes et rencontrant Bakir Izetbegović du SDA. Dodik y voit une ingérence."
 balkan_news.8.a: "Un ami sur lequel Sarajevo peut compter"
 balkan_news.8.b: "Un rassemblement dans le pays de quelqu'un d'autre"
 balkan_news.9.t: "Visite de Lavrov à Sarajevo"
 balkan_news.9.d: "Sergueï Lavrov s'est rendu à Sarajevo, accueilli à l'aéroport par Dodik seul. Aucun drapeau bosnien n'a été hissé pour l'occasion. Il est reparti avec une icône orthodoxe plusieurs fois centenaire dont l'origine remonte à Louhansk, un cadeau que Kiev veut voir expliqué."
 balkan_news.9.a: "La propre politique étrangère de la Republika Srpska"
 balkan_news.9.b: "Une visite comme une autre"