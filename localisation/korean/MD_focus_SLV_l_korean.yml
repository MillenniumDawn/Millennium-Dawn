l_korean:
 slovenia.9.t: "슬로베니아, NATO 가입"
 slovenia.9.d: "슬로베니아 국기가 브뤼셀의 NATO 본부에 다른 신규 회원국 여섯 곳과 함께 게양되었습니다. 이는 동맹 역사상 최대 규모의 확대입니다. 독립 13년 만에 슬로베니아는 제5조의 안보 우산 아래 서게 되었습니다."
 slovenia.9.a: "세상에서 더 안전한 곳"
 slovenia.10.t: "슬로베니아, 유럽 연합 가입"
 slovenia.10.d: "자정에 오스트리아, 이탈리아, 헝가리 국경의 차단기가 불꽃놀이와 브라스밴드 연주 속에 걷혔습니다. 슬로베니아는 신규 회원국 열 곳 중 가장 부유한 나라로서 연합에 들어서며, 첫 구조 기금은 이미 도로와 철도를 위해 배정되어 있습니다."
 slovenia.10.a: "다시 유럽의 중심으로"
 slovenia.11.t: "유로에 자리를 내준 톨라르"
 slovenia.11.d: "슬로베니아는 신규 회원국 중 처음으로 유로를 도입하여, 15년간 사용해 온 톨라르를 퇴역시켰습니다. 전환은 순조롭게 진행되었으며, 더 저렴해진 차입 비용 덕분에 경제가 유로존 평균을 웃도는 성장을 이어갈 것으로 예상됩니다."
 slovenia.11.a: "톨라르여, 안녕"
 slovenia.12.t: "국경을 연 솅겐"
 slovenia.12.d: "슬로베니아가 솅겐 지역에 진입하면서 오스트리아, 이탈리아, 헝가리 접경의 마지막 여권 검색대가 철거되고 있습니다. 이제 크로아티아 국경이 연합의 외부 경계를 이루며, 브뤼셀의 기준에 따라 관리됩니다."
 slovenia.12.a: "검문소 없는 유럽"
