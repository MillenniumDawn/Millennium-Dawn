 RULE_OPTION_GREAT_COLLAPSE: "Le grand effondrement"
 RULE_OPTION_GREAT_COLLAPSE_AI_DESC: "Avec la chute de l'URSS en 1991, le militarisme rampant des États-Unis est devenu de plus en plus un fardeau pour le contribuable. Une série de manifestations au cours de la période 1995-1999 a entraîné un nombre toujours croissant de victimes et un ressentiment au sein de la population et du gouvernement fédéral, fermement ancré dans la guerre froide. Atteignant maintenant un point d'ébullition au tournant du siècle, les rumeurs d'une grève nationale des chemins de fer, qui pourrait paralyser l'économie et la capacité du gouvernement fédéral à coordonner des opérations de contre-manifestation, se multiplient."
 USB_AI_BEHAVIOR: "@USB États libres d'Amérique"
 RULE_OPTION_REVANCHIST_PATH: "Reconquérir son destin"
 RULE_OPTION_REVANCHIST_PATH_AI_DESC: "Les influences fédérales inciteront les États libres à orienter leur politique étrangère vers le revanchisme des 48 États continentaux. §RDoit avoir soit la règle de jeu des États-Unis Post United ou la règle de jeu des États-Unis Great Collapse§!"
 RULE_OPTION_ISOLATION_PATH: "Le grand arrêt"
 RULE_OPTION_ISOLATION_PATH_AI_DESC: "Le rêve américain est mort, le monde semble être un vide qui s'agrandit sans cesse. Les peuples et les dirigeants politiques décident alors que la meilleure chose à faire est de se détourner du monde et de profiter de la douce paix et de la tranquillité que leur petit coin de paradis leur apportera, espérons-le. §RDoit avoir soit la règle de jeu des États-Unis Post United ou la règle de jeu des États-Unis Great Collapse§!"
 RULE_OPTION_ARCADIA_PATH: "L'identité orientale"
 RULE_OPTION_ARCADIA_PATH_AI_DESC: "Le rêve américain s'étant transformé en cauchemar, les influences fédérales ont faibli. Le peuple a alors décidé qu'une nouvelle voie était la bonne et a donc cherché à créer une nouvelle « identité orientale » à travers le Plan Arcadia. §RDoit avoir soit la règle de jeu des États-Unis Post United ou la règle de jeu des États-Unis Great Collapse§!"
 CSA_AI_BEHAVIOR: "@CSA République sudiste d'Amériqu"
 RULE_OPTION_A_SOUTHERN_AMERICA_PATH: "Une Amérique du Sud"
 RULE_OPTION_A_SOUTHERN_AMERICA_PATH_AI_DESC: "Alors que le rêve américain brûle encore dans le cœur des peuples du Sud, nombreux sont ceux qui tentent de faire changer d'avis le gouvernement en faveur d'une réforme des anciennes gloires et de la création d'une nouvelle Amérique. Une Amérique du Sud. §RDoit avoir soit la règle de jeu des États-Unis Post United ou la règle de jeu des États-Unis Great Collapse§!"
 RULE_OPTION_GOLDEN_CIRCLE_PATH: "Le Cercle d'Or"
 RULE_OPTION_GOLDEN_CIRCLE_PATH_AI_DESC: "De nombreux sudistes pensent qu’ils doivent se forger un nouveau destin, un destin qui leur soit propre. C’est pourquoi de nombreux dirigeants souhaitent revisiter une vieille idée de la Confédération afin de consolider cette nouvelle ère de liberté. §RDoit avoir soit la règle de jeu des États-Unis Post United ou la règle de jeu des États-Unis Great Collapse§!"
 RULE_OPTION_SOUTHERN_ARCADIA_PATH: "L'identité orientale"
 RULE_OPTION_SOUTHERN_ARCADIA_PATH_AI_DESC: "Le rêve américain s'étant évanoui et peu de gens souhaitant s'enliser dans le stigmate confédéré, de nombreux sudistes se tournent vers les influences françaises des peuples cajon et créole pour se forger une nouvelle identité. Une identité qui n'est ni américaine ni confédérée, mais qui nous appartient néanmoins. §RDoit avoir soit la règle de jeu des États-Unis Post United ou la règle de jeu des États-Unis Great Collapse§!"
 RULE_OPTION_THE_FLORIDA_UPRISING_PATH: "Le soulèvement de Floride"
 RULE_OPTION_THE_FLORIDA_UPRISING_PATH_AI_DESC: "Aux premiers jours de notre jeune nation, des racailles et sympathisants socialistes ont pris le pouvoir et volé les élections. Il est désormais temps pour les vrais patriotes du Sud de défendre ce qui reste de nos foyers contre ces diables rouges. §RDoit avoir soit la règle de jeu des États-Unis Post United ou la règle de jeu des États-Unis Great Collapse§!"
 CAS_AI_BEHAVIOR: "@CAS Cascadie"
 RULE_OPTION_ROCKY_MOUNTAIN_RESISTANCE_PATH: "Résistance des montagnes Rocheuses"
 RULE_OPTION_ROCKY_MOUNTAIN_RESISTANCE_PATH_AI_DESC: "Le gouvernement d'Olympia va permettre aux forces de l'ordre locales de gérer les troubles croissants dans l'État des Rocheuses de l'Idaho. L'échec des forces de l'ordre locales à maîtriser le mouvement de résistance toujours croissant aboutit à un soulèvement indépendantiste contre la nation cascadienne. §RDoit avoir soit la règle de jeu des États-Unis Post United ou la règle de jeu des États-Unis Great Collapse§!"
 RULE_OPTION_PEACE_IN_OUR_TIME_PATH: "La paix à notre époque"
 RULE_OPTION_PEACE_IN_OUR_TIME_PATH_AI_DESC: "Le gouvernement d'Olympia enverra une unité d'enquête spéciale pour aider et diriger le mouvement de contre-résistance. Au fil du temps, leur aide rétablira la loi et l'ordre et forcera le chef du RMR à dissoudre le groupe, ce qui donnera naissance à une nation plus pacifique et plus unie. §RDoit avoir soit la règle de jeu des États-Unis Post United ou la règle de jeu des États-Unis Great Collapse§!"
 LKT_AI_BEHAVIOR: "@LKT République Lakota"
 RULE_OPTION_RECLAMATION_FRONT_WAR_PATH: "Guerre du Front de Réclamation"
 RULE_OPTION_RECLAMATION_FRONT_WAR_PATH_AI_DESC: "Le gouvernement du Nord va se débarrasser de l'afflux aléatoire d'indigènes sous l'organisation du Front de Réclamation et les dégrader. Ainsi, un auditeur trop zélé envoyé par le gouvernement de Lakota se rend seul à la rencontre des dirigeants de la RF, ce qui crée une rupture rapide, menant à une éventuelle militarisation et à une guerre entre le Kansas contrôlé par la RF et la République de Lakota. §RDoit avoir soit la règle de jeu des États-Unis Post United ou la règle de jeu des États-Unis Great Collapse§!"
 RULE_OPTION_RECLAMATION_FRONT_PEACE_PATH: "Front de Réclamation pour la Paix"
 RULE_OPTION_RECLAMATION_FRONT_PEACE_PATH_AI_DESC: "En comprenant la confusion des rapports, des enquêtes plus approfondies seront menées, ce qui permettra de réfuter rapidement certaines des allégations les plus agressives à l'encontre de l'organisation RF. Grâce à cette nouvelle unité retrouvée, les pourparlers commenceront à travailler à la reconstruction de la nation et à la création d'une meilleure union économique et sociale. §RDoit avoir soit la règle de jeu des États-Unis Post United ou la règle de jeu des États-Unis Great Collapse§!"
 GAME_RULE_nato_disabled: "§YOTAN§! Désactivé par la règle du jeu"
 RULE_OPTION_HISTORICAL_PRESIDENTS: "Présidents historiques des États-Unis"
 RULE_OPTION_HISTORICAL_PRESIDENTS_AI_DESC: "L'IA élira les présidents le 20 janvier de chaque année électorale en fonction du vainqueur historique."
 RULE_GOD_OF_WAR: "Dieu de la guerre"
 RULE_GOD_OF_WAR_NO: "Désactivé"
 RULE_GOD_OF_WAR_YES: "Activé"
 RULE_GOD_OF_WAR_NO_DESC: "L'IA utilisera la configuration par défaut"
 RULE_GOD_OF_WAR_YES_DESC: "L'IA utilisera des modèles avancés et quelques astuces"
 RULE_OPTION_ALL_AHEAD_SLOW: "Tout en avant lentement"
 RULE_OPTION_ALL_AHEAD_SLOW_AI_DESC: "Activez cette règle de jeu pour garantir que l'IA ne fasse pas imploser les États-Unis. Cela revient à supprimer le facteur RNG du mode IA non historique."
 RULE_OPTION_SECOND_COAL_WARS: "La 2e guerre du charbon"
 RULE_OPTION_SECOND_COAL_WARS_AI_DESC: "Les États libres déclareront à l'UMWA renouvelée que les mines de Virginie-Occidentale ne rouvriront pas leurs portes selon les principes qui ont motivé leur fermeture initiale, affirmant que « les solutions et les problèmes modernes étaient la raison de leur fermeture initiale ». En conséquence, les mineurs déclencheront des émeutes et proclameront l'indépendance de l'État, ce qui mènera au deuxième incident de la guerre du charbon. §RDoit avoir soit la règle de jeu des États-Unis Post United ou la règle de jeu des États-Unis Great Collapse§!"
 NEN_AI_BEHAVIOR: "@NEN Nouvelle-Angleterre"
 RULE_OPTION_GREEN_MOUNTAIN_REBELLION: "Rébellion de la Montagne Verte"
 RULE_OPTION_GREEN_MOUNTAIN_REBELLION_AI_DESC: "Ne cédant pas aux pressions politiques mesquines de quelques voix fortes, le gouvernement national de la Nouvelle-Angleterre rejettera les demandes des Vermontois de transférer le siège du gouvernement à Monteplier. Par conséquent, l'animosité continuera de croître jusqu'à ce qu'il soit contraint de réprimer la rébellion naissante dans l'État. §RDoit avoir soit la règle de jeu des États-Unis Post United ou la règle de jeu des États-Unis Great Collapse§!"
 RULE_OPTION_THE_OTHER_NEW_CAPITAL: "L'autre nouvelle capitale"
 RULE_OPTION_THE_OTHER_NEW_CAPITAL_AI_DESC: "Considérant que très peu de gens se souciaient réellement de l'emplacement de la nouvelle capitale, le gouvernement de la Nouvelle-Angleterre accepte les « demandes » des Vermontais et déplace la capitale à Monteplier. §RDoit avoir soit la règle de jeu des États-Unis Post United ou la règle de jeu des États-Unis Great Collapse§!"
 RULE_ALLOW_CONDITIONAL_PEACE_DEAL: "Autoriser les accords de paix conditionnels"
 RULE_OPTION_CONDITIONAL_PEACE_DEAL_YES_DESC: "Permettra aux États en guerre d'utiliser l'action diplomatique scénarisée §YAccords de paix conditionnels§!, qui permettra aux États de signer des accords de paix sans que l'une ou l'autre des parties ait à capituler complètement."
 RULE_OPTION_CONDITIONAL_PEACE_DEAL_NO_DESC: "Empêche les États d'utiliser l'action diplomatique scriptée §YAccords de paix conditionnels§! qui les contraint à mener une guerre totale pour parvenir à la paix."
 RULE_PEACE_PROPOSAL_BLOCKED_TT: "Tant que les §Yaccords de paix conditionnels§! sont activés, cette option sera bloquée. Utilisez §Y$CPD_OFFER_CONDITIONAL_PEACE_TITLE$§! à la place."
 RULE_ALLOW_WORLD_WAR: "Guerre mondiale sur rails"
 RULE_ALLOW_ENABLE_WORLD_WAR: "Activer la guerre mondiale sur rails"
 RULE_ALLOW_ENABLE_WORLD_WAR_YES_DESC: "Cette option limitera les éléments bac à sable de Millennium Dawn et plongera le monde dans une guerre mondiale à une date donnée, comme dans d'autres mods.\n\nIl est fortement recommandé de jouer en mode historique et de désactiver l'option « Guerre de la dette pour l'I.A. »."
 RULE_ALLOW_ENABLE_WORLD_WAR_NO: "Désactiver la guerre mondiale sur rails"
 RULE_ALLOW_ENABLE_WORLD_WAR_NO_DESC: "Millennium Dawn conservera sa forme conventionnelle, celle d'un mod bac à sable."
 RULE_ENABLE_INVESTMENT_COLLAPSE_LOCK: "Activer le verrouillage en cas de faillite d'investissement"
 RULE_ENABLE_INVESTMENT_COLLAPSE_LOCK_NO_DESC: "Vous pouvez envoyer des investissements vers d'autres pays lorsque la mission « Faillite imminente » est active."
 RULE_ENABLE_INVESTMENT_COLLAPSE_LOCK_YES_DESC: "Vous ne pouvez plus envoyer d'investissements vers des pays tant que la mission « Faillite imminente » est active."
 RULE_SYRIA_ARAB_SPRING_CHOICE_DEFAULT_DESC: "La Syrie évaluera l'option du Printemps arabe comme il se doit."
 RULE_SYRIA_ARAB_SPRING_CHOICE_HISTORICAL_CIVIL_WAR_DESC: "La Syrie veillera à ce que ces choix soient faits si le Printemps arabe survient et conduit à une guerre civile historique."
 RULE_SYRIA_ARAB_SPRING_CHOICE_HISTORICAL_ISIS_SPAWN_DESC: "La Syrie continuera toujours à faire les choix qui ont été faits pendant le Printemps arabe afin de garantir la survie de l'État islamique. Cela garantit également que la guerre civile historique aura lieu."
 RULE_SYRIA_ARAB_SPRING_CHOICE: "Choix de conduite de la Syrie durant le Printemps arabe"
 RULE_HISTORIC_EVENTS: "Déclencheur d'événements historiques"
 RULE_HISTORIC_EVENTS_NO: "Les événements historiques se déclencheront au hasard. C'est le réglage normal du jeu."
 RULE_HISTORIC_EVENTS_YES: "Les événements historiques ne se déclencheront pas au hasard. La plupart des événements se déclencheront encore aléatoirement, mais certains seront garantis de se déclencher dans le mois de leur date historique pour réduire le risque d'un retard important. Cela ne signifie pas une partie parfaitement historique. Cela aide simplement à la pousser dans une direction historique."
 RULE_ALLOW_MD_ANNEX: "Activer le nettoyage de Border Gore"
 RULE_OPTION_MD_ANNEX_NO_DESC: "Aucun effet sur les frontières d'après-paix : elles resteront telles qu'elles ont été tracées à la conférence."
 RULE_OPTION_MD_ANNEX_YES_DESC: "Après un accord de paix, si plusieurs instances du même tag existent, tous les tags restants seront intégrés à celui dont le suzerain est le plus puissant. La force des suzerains sera déterminée par leur esprit national de rang de puissance. Le nettoyage après une guerre peut prendre jusqu'à 14 jours."
 RULE_DISABLE_CSTO: "Désactiver l'OTSC"
 RULE_YES_DISABLE_CSTO_DESC: "L'OTSC sera désactivée au chargement de la partie."
 RULE_NO_DISABLE_CSTO_DESC: "L'OTSC restera une faction."
 RULE_DISABLE_MUSLIM_BROTHERHOOD_CIVIL_WAR: "Désactiver la guerre civile des Frères musulmans"
 RULE_YES_DISABLE_MUSLIM_BROTHERHOOD_CIVIL_WAR_DESC: "La guerre civile des Frères musulmans sera désactivée."
 RULE_NO_DISABLE_MUSLIM_BROTHERHOOD_CIVIL_WAR_DESC: "La guerre civile des Frères musulmans sera activée."
 RULE_SYRIA_ARAB_SPRING_CHOICE_HISTORICAL_CIVIL_WAR: "Guerre civile historique de Syrie"
 RULE_SYRIA_ARAB_SPRING_CHOICE_HISTORICAL_ISIS_SPAWN: "rejetons de État islamique"
 RULE_OPTION_SWE_RED_SWEDEN: "République suédoise"
 RULE_DISABLE_AI_INFLUENCE_PUPPETING: "Désactiver les marionnettes d'influence de l'IA"
 RULE_YES_DISABLE_AI_INFLUENCE_PUPPETING_DESC: "L'IA ne pourra pas satelliser d'autres nations via le système d'influence."
 RULE_NO_DISABLE_AI_INFLUENCE_PUPPETING_DESC: "L'IA pourra satelliser d'autres nations via le système d'influence."
 RULE_ALLOW_MP_ENHANCEMENTS: "Améliorations du MP"
 RULE_NOT_ALLOW_MP_ENHANCEMENTS_DESC: "N'autorisera pas les mécaniques multijoueur à accélérer le jeu. Non recommandé en solo."
 RULE_ALLOW_MP_ENHANCEMENTS_DESC: "Autoriser les mécaniques multijoueur pour accélérer le jeu"
 RULE_DISABLE_WESTERN_OUTLOOK_FEATURES: "Désactiver les fonctions d'influence agressive pour orientation occidentale"
 RULE_YES_DISABLE_WESTERN_OUTLOOK_FEATURES: "Désactive les fonctions occidentales agressives telles que le coup d'État d'influence ou le satellite d'influence."
 RULE_INTERNAL_FACTION_COST_REDUCTION: "Réduction des coûts internes aux factions"
 RULE_DISABLE_INTERNAL_FACTION_COST_REDUCTION_DESC: "Les coûts liés au changement de faction interne seront les coûts par défaut."
 RULE_ENABLE_INTERNAL_FACTION_COST_REDUCTION_DESC: "Les coûts liés au changement de faction interne seront réduits, ce qui permettra à toutes les nations de le faire (sauf si leur contenu l'interdit expressément).§RSi vous rencontrez des problèmes de mise au point ou autres, c'est de votre faute.§!"
 RULE_OPTION_EU_ONE: "1 jour"
 RULE_OPTION_EU_ONE_DESC: "§RÀ des fins de test.§! Le délai de vote du Parlement européen et du Conseil européen sera fixé à un jour au lieu des cent quatre-vingts jours par défaut."
 RULE_ALLOW_FORCING_A_WHITE_PEACE: "Autoriser imposer la paix"
 RULE_YES_FORCING_A_WHITE_PEACE: "Permet d'imposer une paix blanche à une nation en guerre offensive."
 RULE_NO_FORCING_A_WHITE_PEACE: "Ne permet pas d'imposer une paix blanche à une nation en guerre offensive."
 RULE_OPTION_IF_POINT_00: "0,00 avis mensuel"
 RULE_OPTION_IF_POINT_00_DESC: "Le taux de tick mensuel d'opinion de la §Yfaction interne§! sera fixé à 0,00 au lieu du 0,50 par défaut. Les succès personnalisés de Millennium Dawn seront désactivés avec ce réglage."
 RULE_ENABLE_ENERGY_LOAD_SHARING: "Activer le partage de charge énergétique"
 RULE_ENABLE_ENERGY_LOAD_SHARING_DESC: "Active le système de partage de charge énergétique pour acheter et vendre de l'énergie aux nations proches en cas de déficit énergétique."
 RULE_DISABLE_ENERGY_LOAD_SHARING_DESC: "Désactive le système de partage de charge énergétique pour acheter et vendre de l'énergie aux nations proches en cas de déficit énergétique."
 RULE_INCOME_FROM_ENERGY_LOAD_SHARING: "Revenus du partage de charge énergétique"
 RULE_OPTION_ELS_POINT_10: "0,10 $ par GW"
 RULE_OPTION_ELS_POINT_10_DESC: "Le prix par GW sera fixé à 0,10 $ par GW"
 RULE_OPTION_ELS_POINT_25: "0,25 $ par GW"
 RULE_OPTION_ELS_POINT_25_DESC: "Le prix par GW sera fixé à 0,25 $ par GW"
 RULE_OPTION_ELS_POINT_50: "0,50 $ par GW"
 RULE_OPTION_ELS_POINT_50_DESC: "Le prix par GW sera fixé à 0,50 $ par GW"
 RULE_OPTION_ELS_POINT_75: "0,75 $ par GW"
 RULE_OPTION_ELS_POINT_75_DESC: "Le prix par GW sera fixé à 0,75 $ par GW"
 RULE_OPTION_COM_WARRIOR_KING: "Le roi guerrier"
 RULE_OPTION_COM_WARRIOR_KING_DESC: "Robert Denard revient une dernière fois sur les îles et la §8Garde présidentielle§! lui livre le palais sans un coup de feu. Les Comores cessent d'être un pays avec une armée et deviennent une armée avec un drapeau à louer, vendant ses mercenaires à travers l'Afrique."
 RULE_OPTION_COM_MILITARY_DICTATORSHIP: "Le colonel reste"
 RULE_OPTION_COM_MILITARY_DICTATORSHIP_DESC: "Azali conserve la présidence qu'il a prise en uniforme, ramène les îles sous Moroni et laisse la rotation mourir avant qu'elle n'atteigne quiconque d'autre. Les Comores dérivent hors de l'orbite française et se tournent vers Pékin et l'Union africaine pour la reconnaissance que Paris n'offre plus."
 RULE_INVEST_DEFAULT_GAIN_1_5: "1.5%"
 RULE_INVEST_DEFAULT_GAIN_1_5_DESC: "L'option par défaut. 1,5 % d'influence gagnée chaque fois que quelqu'un accepte vos investissements."
 RULE_DISABLE_GDP_GRAPH: "Désactiver le graphique du PIB"
 RULE_NO_RULE_DISABLE_GDP_GRAPH_DESC: "Active le système de graphiques du PIB"
 RULE_YES_RULE_DISABLE_GDP_GRAPH_DESC: "Désactive le système de graphiques du PIB. Cela peut améliorer les performances sur les machines d'entrée de gamme."
 RULE_ENABLE_AI_USING_ATTACHES: "Activez l'IA à l'aide de §YAttaché§!"
 RULE_ENABLE_AI_USING_ATTACHES_YES_DESC: "Permet à l'IA d'utiliser des §Yattachés§! via les actions diplomatiques"
 RULE_ENABLE_AI_USING_ATTACHES_NO_DESC: "Empêche l'IA d'utiliser des §Yattachés§! via les actions diplomatiques"
 RULE_OPTION_THE_GREAT_REBELLION: "La Grande Rébellion"
 RULE_OPTION_THE_GREAT_REBELLION_AI_DESC: "Des groupes d'intérêt rivaux déchirent le pays tandis que l'électorat perd intérêt à les arrêter, et un décompte contesté aux marges ridiculement étroites brise enfin la foi du public dans le résultat. Les États-Unis tombent en rébellion ouverte sur une élection que personne n'acceptera."
 RULE_FUTURISTIC_SPECIAL_PROJECTS: "Projet spécial futuriste"
 RULE_ALLOWED_DISABLE_FUTURISTIC_SPECIAL_PROJECTS_DESC: "Tous les projets spéciaux seront disponibles à la recherche"
 RULE_OPTION_DISABLED: "Désactivé"
 RULE_DISABLE_DISABLED_FUTURISTIC_SPECIAL_PROJECTS_DESC: "Les projets spéciaux futuristes seront indisponibles"
 MD_CUSTOM_SCENARIO_RULES: "Scénarios personnalisés"
 RULE_EVENT_HORIZON_SCENARIO: "Scénario d'horizon d'événement"
 RULE_EVENT_HORIZON_DEFAULT: "Désactivé"
 RULE_EVENT_HORIZON_DEFAULT_DESC: "Le scénario Event Horizon ne sera pas actif."
 RULE_EVENT_HORIZON_BLITZ: "Blitz-2001"
 RULE_EVENT_HORIZON_BLITZ_DESC: "Le scénario Event Horizon commencera en 2001.\n\n§HNOTE :§! Une fois les méga-pays de l'§YEvent Horizon§! formés, vous perdrez votre arbre de focuses actuel et il sera remplacé par l'arbre spécifique au scénario."
 RULE_EVENT_HORIZON_CASUAL: "Occasionnel - 2012"
 RULE_EVENT_HORIZON_CASUAL_DESC: "Le scénario Event Horizon commencera en 2012.\n\n§HNOTE :§! Une fois les méga-pays de l'§YEvent Horizon§! formés, vous perdrez votre arbre de focuses actuel et il sera remplacé par l'arbre spécifique au scénario."
 RULE_EVENT_HORIZON_DELAYED: "Retardé - 2020"
 RULE_EVENT_HORIZON_DELAYED_DESC: "Le scénario Event Horizon commencera en 2020.\n\n§HNOTE :§! Une fois les méga-pays de l'§YEvent Horizon§! formés, vous perdrez votre arbre de focuses actuel et il sera remplacé par l'arbre spécifique au scénario."
 RULE_AI_EU_END_GAME_PATHS: "Activer les chemins de fin de jeu AI EU"
 RULE_AI_YES_EU_END_GAME_PATHS: "L'IA est autorisée à poursuivre les voies de fin de partie de l'Union européenne comme la Fédération européenne ou les États-Unis d'Europe."
 RULE_AI_NO_EU_END_GAME_PATHS: "L'IA n'est pas autorisée à poursuivre les voies de fin de partie de l'Union européenne comme la Fédération européenne ou les États-Unis d'Europe."
 GRN_AI_BEHAVIOR: "@GRN Groenland"
 RULE_OPTION_GRN_SCANDINAVIAN_SERENITY: "Sérénité scandinave"
 RULE_OPTION_GRN_CONTINENTAL_HEGEMONY: "Hégémonie continentale"
 RULE_DISABLE_COUP_CONTEST: "Désactiver les événements du concours Coup d'État"
 RULE_YES_DISABLE_COUP_CONTEST_DESC: "§RDésactive§! la chaîne d'événements de §Hcontestation de coup§!. Les grands influenceurs étrangers ne §Rrecevront pas§! de notifications ni d'options pour répondre lorsqu'un coup a lieu dans un pays où ils sont investis. Utilisez ceci si vous voulez que l'IA évite d'escalader les conflits par procuration."
 RULE_NO_DISABLE_COUP_CONTEST_DESC: "§GActive§! la chaîne d'événements de §Hcontestation de coup§!. Lorsqu'un coup réussit dans un pays, les plus grands influenceurs étrangers (et le 2e plus grand s'il dépasse §H20 %§!) sont notifiés et ont le choix de la réponse : dénoncer, sanctionner, soutenir l'opposition, ou intervenir militairement. Les guerres civiles suivant un coup déclenchent aussi un événement correspondant pour soutenir l'ancien régime."
 RULE_REMOVE_MICRO_STATES_TINY: "Petites nations (micro-États)"
 RULE_REMOVE_MICRO_STATES_TINY_DESC: "N'enlève que les nations absolument les plus petites (Monaco, Saint-Marin, etc.) et les nations insulaires des Caraïbes."
 RULE_REMOVE_MICRO_STATES_SMALLER: "Petites nations"
 RULE_REMOVE_MICRO_STATES_SMALLER_DESC: "Enlève les toutes petites nations plus quelques un peu plus grandes comme le Bhoutan, la Gambie et Djibouti."
 RULE_REMOVE_MICRO_STATES_INSIGNIFICANT: "Suppression étendue"
 RULE_REMOVE_MICRO_STATES_INSIGNIFICANT_DESC: "Enlève toutes les plus petites nations plus des nations supplémentaires comme le Laos, le Suriname et le Guyana pour des gains de performance maximaux."
 RULE_ENABLE_RESOURCE_STORAGE_SYSTEM: "Activez §YSystème de stockage de ressources§!"
 RULE_OPTION_ENABLE_RESOURCE_STORAGE_SYSTEM: "Active le §Ysystème de stockage des ressources§! permettant de stocker des matières premières. Désactivez-le si vous constatez un fort lag par jour. Vous ne perdrez rien d'essentiel."
 RULE_OPTION_DISABLE_RESOURCE_STORAGE_SYSTEM: "Désactive le §Ysystème de stockage des ressources§! permettant de stocker des matières premières."
 RULE_CARRIER_ONLY_RAIDS: "Activer les raids réservés aux porte-avions"
 RULE_CARRIER_ONLY_RAIDS_NO: "Désactive les raids uniquement depuis porte-avions. Cela n'affecte pas la capacité d'utiliser des raids de porte-avions, mais si vous avez fréquemment des problèmes d'aviation embarquée qui quitte le porte-avions pour des bases aériennes."
 RULE_CARRIER_ONLY_RAIDS_YES: "Active les raids uniquement depuis porte-avions. C'est un doublon des autres raids qui permet des points de lancement uniquement depuis porte-avions."
 RULE_RAID_DOCTRINE_REACH: "Imposer la portée doctrinale aux raids"
 RULE_RAID_DOCTRINE_REACH_NO: "Désactive la vérification de portée des doctrines d'intervention sur les raids. Les joueurs (et l'IA) peuvent préparer des raids contre toute cible visible, quelle que soit la doctrine de politique étrangère. Guerre, opinion et vérifications de faction s'appliquent toujours."
 RULE_RAID_DOCTRINE_REACH_YES: "Comportement par défaut. Les doctrines d'intervention restreignent le ciblage des raids : l'§Yisolationnisme§! ne peut pas lancer de raid en paix, la §Ysécurité locale§! ne peut pas lancer de raid en paix, l'§Yinterventionnisme limité§! exige des voisins, et l'§Yinterventionnisme régional§! exige des cibles du même continent. La guerre contourne toujours cela."
 RULE_ALLOW_CPD_AI_OFFERS: "Autoriser les offres de paix conditionnelles de l'IA"
 RULE_OPTION_CPD_AI_OFFERS_YES_DESC: "Permet aux États IA en guerre d'évaluer périodiquement les conflits en cours et de proposer des §Yaccords de paix conditionnels§! lorsqu'ils jugent la guerre impossible à gagner ou dans l'impasse. Les suzerains négocieront aussi au nom des sujets restreints."
 RULE_OPTION_CPD_AI_OFFERS_NO_DESC: "Empêche les États IA d'initier seuls des §Yaccords de paix conditionnels§!. Les joueurs peuvent toujours proposer des accords manuellement via l'action diplomatique."
 RULE_EU_EXPANSION_FOCUS: "Comportement de l'UE"
 RULE_EU_EXP_NO: "Par défaut"
 RULE_EU_EXP_NO_DESC: "Comportement par défaut de l'UE"
 RULE_EU_EXP_YES: "Objectif d'expansion"
 RULE_EU_EXP_YES_DESC: "L'UE priorisera les lois d'élargissement"
 RULE_FREE_FACTORIES_AMOUNT: "Usines gratuites pour les joueurs"
 RULE_FREE_FACTORIES_AMOUNT_OFF: "Désactivé"
 RULE_FREE_FACTORIES_AMOUNT_OFF_DESC: "Les joueurs ne reçoivent aucune usine gratuite au début de la partie."
 RULE_FREE_FACTORIES_AMOUNT_ONE: "1 civile + 1 militaire"
 RULE_FREE_FACTORIES_AMOUNT_ONE_DESC: "Chaque joueur humain reçoit 1 usine civile hors site et 1 usine militaire hors site au début de la partie."
 RULE_FREE_FACTORIES_AMOUNT_TWO: "2 civiles + 2 militaires"
 RULE_FREE_FACTORIES_AMOUNT_TWO_DESC: "Chaque joueur humain reçoit 2 usines civiles hors site et 2 usines militaires hors site au début de la partie."
 RULE_FREE_FACTORIES_AMOUNT_THREE: "3 civiles + 3 militaires"
 RULE_FREE_FACTORIES_AMOUNT_THREE_DESC: "Chaque joueur humain reçoit 3 usines civiles hors site et 3 usines militaires hors site au début de la partie."
 RULE_FREE_FACTORIES_AMOUNT_FIVE: "5 civiles + 5 militaires"
 RULE_FREE_FACTORIES_AMOUNT_FIVE_DESC: "Chaque joueur humain reçoit 5 usines civiles hors site et 5 usines militaires hors site au début de la partie."
 RULE_OPTION_DEN_EUROSCEPTIC: "Hors de l'Union"
 RULE_OPTION_DEN_SOCIALIST: "Le drapeau rouge sur Christiansborg"
 RULE_OPTION_DEN_MONARCHIST: "La couronne restaurée"
 RULE_OPTION_DEN_NATIONALIST: "Le Danemark aux Danois"
 RULE_OPTION_NRY_CHRISTIAN_PEOPLES: "Le centre chrétien"
 RULE_OPTION_NRY_PROGRESS: "La Norvège aux Norvégiens"
 RULE_OPTION_MNT_SERBIAN_UNION: "Nationalisme serbe"
 RULE_OPTION_MNT_SERBIAN_UNION_DESC: "Les §8partis nationalistes serbes§! accèdent au pouvoir, élèvent la culture serbe et l'autorité de l'Église orthodoxe, et alignent le Monténégro économiquement et politiquement sur la Serbie et la Russie. La trajectoire du Monténégro aboutit à l'union politique avec la Serbie, inversant l'indépendance conquise une génération plus tôt."
 RULE_OPTION_MNT_NEUTRAL_HARBOUR: "Neutralité armée"
 RULE_OPTION_MNT_NEUTRAL_HARBOUR_DESC: "Le gouvernement Đukanović rejette à la fois l'intégration UE/OTAN et l'alignement serbe/russe, déclarant plutôt une neutralité armée permanente sur le modèle suisse. Le port franc du Monténégro devient un comptoir ouvert à tous les blocs, exploitant sa position adriatique stratégique pour un maximum d'avantage commercial."
 RULE_FICTIONAL_CONTENT: "Contenu fictif et mème"
 RULE_FICTIONAL_CONTENT_NO_DESC: "§YPar défaut§!. Le contenu humoristique et non historique reste désactivé, y compris le Liechtenstein achetant l'Alaska et restaurant le Saint-Empire, l'Ossétie du Sud faisant renaître la Scythie, Tesak arrivant au pouvoir à Cuba, l'occasionnel événement aléatoire absurde, et les divers œufs de Pâques dispersés dans le mod."
 RULE_FICTIONAL_CONTENT_YES_DESC: "Active le contenu humoristique et non historique, y compris le Liechtenstein achetant l'Alaska et restaurant le Saint-Empire, l'Ossétie du Sud faisant renaître la Scythie, Tesak arrivant au pouvoir à Cuba, l'occasionnel événement aléatoire absurde, et les divers œufs de Pâques dispersés dans le mod."
 RULE_PLAYER_INSTANT_JUSTIFICATION: "Justification instantanée des casus belli (joueurs uniquement)"
 RULE_YES_PLAYER_INSTANT_JUSTIFICATION_DESC: "Chaque joueur humain commence avec l'esprit national §YCasus belli§!, accordant §G-100 %§! au temps de justification d'un but de guerre. L'IA ne le reçoit pas."
 RULE_NO_PLAYER_INSTANT_JUSTIFICATION_DESC: "Les buts de guerre prennent leur temps normal à justifier pour tout le monde."
 RULE_OPTION_JAP_HISTORICAL: "Historique"
 BOS_AI_BEHAVIOR: "@BOS Bosnie-Herzégovine"
 SIA_AI_BEHAVIOR: "@SIA Thaïlande"
 RULE_OPTION_SIA_DEFAULT_AI_DESC: "§8Thai Rak Thai§! et ses successeurs dominent les urnes tandis que les démocrates et le palais les contestent, et les généraux reprennent le gouvernement chaque fois que les tribunaux ne le font pas. La Thaïlande reste un allié par traité de Washington sans rien diriger, et laisse ses vieilles revendications irrédentistes où elles sont."
 RULE_OPTION_SIA_PAN_THAI: "Pan-Thai (Grande Thaïlande)"
 RULE_OPTION_SIA_PAN_THAI_AI_DESC: "La Thaïlande se réarme et fait valoir les revendications qu'elle a abandonnées sur le Laos, le Cambodge et les États malais du nord. Bangkok se fait l'hégémon de l'Asie du Sud-Est continentale, et ses voisins s'arment en conséquence."
 RULE_OPTION_SIA_SEATO_LEADER: "Leader de l’OTASE"
 RULE_OPTION_SIA_SEATO_LEADER_AI_DESC: "La Thaïlande reconstruit l'§8OTASE§! et rassemble l'Asie du Sud-Est dans un pacte de défense dirigé depuis Bangkok plutôt que depuis Washington. La région obtient un ordre de sécurité à elle, et les grandes puissances doivent le traiter comme un bloc."
 RULE_OPTION_SIA_ALT_HISTORY: "Histoire alternative"
 RULE_OPTION_SIA_ALT_HISTORY_AI_DESC: "La Thaïlande emprunte la voie communiste, s'éloignant de Washington et de l'Occident. Elle ne poursuivra pas les revendications irrédentistes ni ne fondera l'OTASE."
 RULE_AFG_TALIBAN_INSURGENCY_INTENSITY: "@AFG Insurrection des talibans"
 RULE_AFG_TALIBAN_INSURGENCY_DEFAULT: "Historique"
 RULE_AFG_TALIBAN_INSURGENCY_DEFAULT_DESC: "L'insurrection talibane croît et décroît à son rythme normal."
 RULE_AFG_TALIBAN_INSURGENCY_WEAK: "Contenu"
 RULE_AFG_TALIBAN_INSURGENCY_WEAK_DESC: "Les talibans se reconstruisent deux fois moins vite. Le travail de contre-insurrection tient, et l'Afghanistan peut réalistement éradiquer l'insurrection."
 RULE_AFG_TALIBAN_INSURGENCY_RELENTLESS: "Implacable"
 RULE_AFG_TALIBAN_INSURGENCY_RELENTLESS_DESC: "Les talibans se reconstruisent une fois et demie plus vite. Maintenir le pays uni devient une campagne permanente plutôt qu'un problème que l'on résout une fois pour toutes."
 RULE_AFG_NORTHERN_ALLIANCE_UPRISING: "@AFG Soulèvement de l'Alliance du Nord"
 RULE_AFG_NORTHERN_ALLIANCE_UPRISING_ALLOWED_DESC: "Si les talibans gagnent la guerre civile, l'Alliance du Nord se soulève à nouveau quelques mois plus tard sous Ismaïl Khan, ou sous Ahmad Massoud à partir de 2020."
 RULE_AFG_NORTHERN_ALLIANCE_UPRISING_BLOCKED_DESC: "Une victoire talibane est définitive. Aucun second front ne s'ouvre au nord."
 RULE_OPTION_FRA_COMMUNE: "La Commune de France"
 RULE_OPTION_FRA_COMMUNE_DESC: "Le §8Parti communiste français§! et la gauche radicale brisent la Cinquième République et proclament la Commune de France. La France quitte le camp occidental pour une ligne révolutionnaire qui alarme chaque capitale du continent."
 RULE_OPTION_FRA_KINGDOM: "Le Royaume de France"
 RULE_OPTION_FRA_KINGDOM_DESC: "Un coup royaliste met fin à la République et couronne un prétendant bourbon ou orléaniste roi de France. La monarchie restaurée tourne le dos à Bruxelles et ravive de vieilles querelles avec ses voisins."
 RULE_OPTION_FRA_EMPIRE: "L'Empire français"
 RULE_OPTION_FRA_EMPIRE_DESC: "Un coup bonapartiste met fin à la République et proclame un nouvel Empire français. L'Empire poursuit des ambitions continentales qui l'opposent à l'Allemagne comme à la Grande-Bretagne."
 VEN_AI_BEHAVIOR: "@VEN Vénézuéla"
 RULE_VEN_CHAVISMO_CONTINUES: "Le chavisme continue"
 RULE_VEN_CHAVISMO_CONTINUES_DESC: "Le socialisme bolivarien se poursuit sous le §8Parti socialiste uni§!, les missions financées et l'industrie pétrolière fermement aux mains de l'État. Caracas continue de financer le projet bolivarien à travers l'Amérique latine, et Washington continue de le traiter comme un problème."
 RULE_VEN_OPPOSITION_STATIST: "Opposition, modèle monopolistique"
 RULE_VEN_OPPOSITION_STATIST_DESC: "L'opposition démocratique prend le pouvoir mais laisse les hauteurs de commande et la compagnie pétrolière d'État exactement où elles sont. Le Venezuela change de gouvernement sans changer d'économie, et les alignements de la région bougent à peine."
 RULE_VEN_OPPOSITION_LIBERTARIAN: "Opposition, modèle de libre marché"
 RULE_VEN_OPPOSITION_LIBERTARIAN_DESC: "L'opposition démocratique prend le pouvoir et ouvre l'économie au capital étranger et intérieur par une déréglementation et des privatisations radicales. Le Venezuela rejoint l'ordre économique occidental, et le bloc bolivarien perd son payeur."
 RULE_VEN_MILITARY_JUNTA: "Junte militaire"
 RULE_VEN_MILITARY_JUNTA_DESC: "Le corps des officiers s'empare du palais et gouverne comme régime nationaliste d'homme fort redevable à personne. Le Venezuela tourne son armée vers l'extérieur, et ses voisins découvrent qu'ils partagent une frontière avec un État expansionniste."
 ALG_AI_BEHAVIOR: "@ALG Algérie"
 RULE_OPTION_ALG_HISTORICAL: "Les années Bouteflika"
 RULE_OPTION_ALG_HISTORICAL_DESC: "La présidence clôt la décennie noire par une amnistie et rassemble le §8Front de libération nationale§! et ses alliés derrière elle, jusqu'à ce que les marches du §8Hirak§! forcent le vieil homme à partir. L'Algérie reste un pilier de la diplomatie arabe et africaine, tandis que les généraux gardent le dernier mot à l'intérieur."
 RULE_OPTION_ALG_LE_POUVOIR: "Le Pouvoir perdure"
 RULE_OPTION_ALG_LE_POUVOIR_DESC: "La présidence ne s'affranchit jamais des généraux, et §8le pouvoir§! répond au §8Hirak§! par des arrestations plutôt que par la réforme. L'Algérie conserve une façade civile tandis que l'appareil de sécurité décide de tout derrière elle."
 RULE_OPTION_ALG_HIRAK_DEMOCRACY: "Le Hirak l'emporte"
 RULE_OPTION_ALG_HIRAK_DEMOCRACY_DESC: "Les marches hebdomadaires ne s'arrêtent pas à la présidence, et le §8Hirak§! brise les oligarques et démantèle le pouvoir. L'Algérie écrit une constitution véritablement civile et devient la première vraie démocratie du Maghreb."
 RULE_OPTION_ALG_MILITARY_JUNTA: "Les généraux prennent le pouvoir"
 RULE_OPTION_ALG_MILITARY_JUNTA_DESC: "L'§8Armée nationale populaire§! met fin à la fiction, suspend la constitution et gouverne l'Algérie ouvertement. Le pays se replie sur lui-même, et ses voisins trouvent un État-garnison à leur frontière."
 RULE_OPTION_ALG_ISLAMIST: "L'Algérie islamiste"
 RULE_OPTION_ALG_ISLAMIST_DESC: "Le §8Mouvement de la société pour la paix§! et §8Ennahda§! l'emportent aux urnes plutôt que dans le maquis, et bâtissent une république islamique par le parlement, les tribunaux et la mosquée. L'Algérie devient la voix de l'islam politique en Afrique du Nord."
 RULE_OPTION_ALG_FIS_UPRISING: "Le Front du salut revient"
 RULE_OPTION_ALG_FIS_UPRISING_DESC: "Le §8Front islamique du salut§! n'est jamais contenu, et il revendique la victoire électorale que l'armée lui a volée. La décennie noire s'achève aux conditions des insurgés, et l'Algérie devient une base de l'islamisme armé à travers le Sahel."
 ETH_AI_BEHAVIOR: "@ETH Ethiopie"
 RULE_OPTION_ETH_HISTORICAL: "Historique"
 RULE_OPTION_ETH_HISTORICAL_DESC: "L'Éthiopie renforce sa République démocratique fédérale par des progrès dans la santé, l'éducation et les libertés religieuses. La coalition §8EPRDF§! maintient la continuité politique tout en approfondissant l'engagement avec l'Union africaine."
 RULE_OPTION_ETH_MONARCHIST_RESTORATION: "Le retour de la couronne"
 RULE_OPTION_ETH_MONARCHIST_RESTORATION_DESC: "L'Éthiopie restaure le §8Conseil de la Couronne d'Éthiopie§! et invite Zera Yacob Amha Selassie sur le trône. Le pouvoir impérial se réaffirme tandis que le rôle du parlement diminue et qu'une revendication sur l'Érythrée est ravivée."
 RULE_CORPORATE_HISTORY: "Histoire de l'entreprise"
 RULE_CORPORATE_HISTORY_FULL: "Complet"
 RULE_CORPORATE_HISTORY_FULL_DESC: "L'histoire corporative présente des choix industriels rédigés à leurs jalons historiques. C'est le réglage normal."
 RULE_CORPORATE_HISTORY_OUTCOMES_ONLY: "Résultats uniquement"
 RULE_CORPORATE_HISTORY_OUTCOMES_ONLY_DESC: "L'histoire corporative applique silencieusement la voie historique et ses effets nationaux persistants, sans montrer ses choix d'événements ni accorder leurs récompenses uniques."
 RULE_CORPORATE_HISTORY_OFF: "Désactivé"
 RULE_CORPORATE_HISTORY_OFF_DESC: "L'histoire corporative ne crée aucun État et ne programme aucun événement. Le contenu natif des pays reste inchangé."
 RULE_OPTION_ARM_PEOPLES_PARTY: "Le Parti du peuple revient"
 RULE_OPTION_HOL_HISTORICAL: "Historique"
 RULE_OPTION_HOL_HISTORICAL_DESC: "Le §8Parti travailliste§! transmet le pays aux §8chrétiens-démocrates§! après le choc Fortuyn, les §8libéraux§! le tiennent une génération, puis le §8Parti pour la liberté§! et les §8Démocrates 66§! suivent à leur tour. Les Pays-Bas restent une ancre de l'OTAN et de l'Union européenne sous chacune de ces coalitions."
 RULE_OPTION_HOL_WESTERN_MONARCHY: "La restauration d'Orange"
 RULE_OPTION_HOL_WESTERN_MONARCHY_DESC: "Un stathoudérat restauré gouverne par la Couronne tandis que les §8États généraux§! conservent l'emprise sur la bourse, et la §8Compagnie des Indes occidentales§! refondée ramène les Pays-Bas dans l'Atlantique. Le Suriname et le Guyana reviennent sous domination néerlandaise, les Caraïbes sont travaillées par l'aide et les ambassades, et le Luxembourg, l'Irlande et l'Angleterre sont liés à la maison d'Orange par union personnelle."
 RULE_OPTION_HOL_NATIONALIST_MONARCHY: "La Couronne militante"
 RULE_OPTION_HOL_NATIONALIST_MONARCHY_DESC: "La prérogative royale est restaurée, les élections sont suspendues, et la §8Compagnie néerlandaise des Indes orientales§! est reconstruite comme instrument de conquête à travers l'océan Indien. Ceylan, le Cap et Batavia sont repris par la force, et le Luxembourg, l'Irlande et l'Angleterre reçoivent des ultimatums plutôt que des contrats de mariage."
 RULE_OPTION_HOL_NVU: "Nederlandse Volks-Unie"
 RULE_OPTION_HOL_NVU_DESC: "L'§8Nederlandse Volks-Unie§! sort de la marge, marche sur le Binnenhof et refait l'économie selon des lignes corporatistes et autarciques, l'opposition balayée. Le Dietsland est unifié et les Pays-Bas revendiquent le leadership d'une Europe germanique contre la France et la Grande-Bretagne."
 IND_AI_BEHAVIOR: "@IND Indonésie"
 RULE_OPTION_IND_HISTORICAL: "Historique"
 RULE_OPTION_IND_HISTORICAL_DESC: "L'Indonésie consolide la république de la Reformasi derrière le §8Parti du réveil national§!, combattant l'extrémisme religieux et médiant le conflit des Moluques plutôt que de choisir un camp. Appuyée par des institutions anti-corruption et un ancrage occidental, l'Indonésie devient une ancre démocratique stable en Asie du Sud-Est."
 RULE_OPTION_IND_ISLAMIST: "Une Indonésie islamique"
 RULE_OPTION_IND_ISLAMIST_DESC: "La radicalisation religieuse n'est plus contenue alors que le §8Front des défenseurs de l'islam§! passe de l'activisme de rue à la capture de l'État. L'Indonésie se dissout en république de la charia qui fait valoir des revendications territoriales et idéologiques contre ses voisins et affirme sa domination sur son propre archipel."
 RULE_OPTION_MD_RANDOM_PATH: "Chemin aléatoire"
 RULE_OPTION_MD_RANDOM_PATH_DESC: "L'IA tire au hasard l'une des voies de ce pays au début de la partie, historique ou alternative. Celle qu'elle a tirée reste cachée."
 RULE_OPTION_MD_NO_PATH: "Aucun chemin"
 RULE_OPTION_MD_NO_PATH_DESC: "L'IA ne suit aucune voie scriptée et choisit librement ses focuses au fil de la partie. Son comportement change d'une partie à l'autre."
 RULE_OPTION_ITA_HISTORICAL: "Historique"
 RULE_OPTION_ITA_HISTORICAL_DESC: "Le pouvoir alterne entre le §8Partito Democratico§! et le bloc §8Forza Italia§!, et l'Italie reste ancrée dans l'OTAN et l'Union européenne. Ses gouvernements s'usent sur le crime organisé, la dette publique, la question méridionale et leur propre administration plutôt que sur les frontières du pays."
 RULE_OPTION_ITA_ROMAN_RESTORATION: "Restauration de l'Empire romain"
 RULE_OPTION_ITA_ROMAN_RESTORATION_DESC: "§8Fratelli d'Italia§! et la droite nationale croissent jusqu'à emporter une élection, dissoudre le parlement et couronner un empereur sur une Rome restaurée. L'Italie revendique alors les anciennes provinces impériales une par une, de la côte africaine à la Bretagne."
 RULE_OPTION_ITA_MARCH_ON_ROME: "Une seconde marche sur Rome"
 RULE_OPTION_ITA_MARCH_ON_ROME_DESC: "Le même mouvement prend le pouvoir mais conserve la république, installant un gouvernement §8fasciste§! à Rome. L'Italie fait valoir ses revendications irrédentistes sur l'Adriatique et les Alpes sans viser l'empire."
 RULE_OPTION_ITA_EASTERN_TURN: "Tournant vers l'Est"
 RULE_OPTION_ITA_EASTERN_TURN_DESC: "§8Rifondazione Comunista§! et le §8Partito dei Comunisti Italiani§! reconstruisent la gauche italienne et sortent le pays de l'OTAN. L'Italie courtise Moscou et Pékin et cherche une place dans l'Organisation de coopération de Shanghai."
 RULE_OPTION_JAP_HISTORICAL_DESC: "Les §8libéraux-démocrates§! conservent la Diète, l'alliance avec Washington tient, et les Forces d'autodéfense ne sont normalisées que dans la mesure où un voisinage hostile les y force. Le Japon passe ses créances douteuses, légifère contre l'effondrement de la natalité et la crise du karoshi, et laisse l'article 9 debout."
 RULE_OPTION_JAP_RETURN_OF_THE_EMPIRE: "Le retour de l'Empire"
 RULE_OPTION_JAP_RETURN_OF_THE_EMPIRE_DESC: "Le §8Parti de la restauration§! grandit hors de la droite nationaliste jusqu'à ce que le trône soit restauré au pouvoir et l'article 9 rayé. Le Japon se réarme derrière une flotte océanique et reprend les Kouriles, la Corée, Taïwan et l'ancienne sphère du Pacifique par la force."
 RULE_OPTION_TUR_HISTORICAL: "IA historique"
 RULE_OPTION_TUR_HISTORICAL_DESC: "La crise bancaire détruit le §8Parti de la vertu§!, et le §8Parti de la justice et du développement§! qui s'en scinde s'empare du pays. La Turquie se tourne vers une diplomatie néo-ottomane au Moyen-Orient et dans les Balkans tandis que la présidence dépasse lentement le parlement."
 RULE_OPTION_TUR_KEMALIST_GUARD: "Gardes du kémalisme"
 RULE_OPTION_TUR_KEMALIST_GUARD_DESC: "Les islamistes sont interdits avant de pouvoir se regrouper et la §8république laïque§! se serre derrière l'état-major. La Turquie reste ancrée à l'OTAN et répond à la question kurde par l'armée plutôt que par la réforme."
 RULE_OPTION_TUR_GREY_WOLVES: "Les Loups gris"
 RULE_OPTION_TUR_GREY_WOLVES_DESC: "La §8droite nationaliste§! gagne la chambre, met fin aux élections et couronne un sultan sur un État ottoman restauré. La Turquie fait valoir ses revendications à travers la Thrace, le Caucase et le monde turcique."
 RULE_OPTION_TUR_HIZMET: "Le mouvement Hizmet"
 RULE_OPTION_TUR_HIZMET_DESC: "Le réseau §8güleniste§! hérite des décombres du Parti de la vertu et s'empare de l'État par les tribunaux, la police et les écoles plutôt que par les urnes. La Turquie projette un islam modéré à l'étranger tout en vidant discrètement ses propres institutions."
 RULE_OPTION_TUR_TURKISH_LEFT: "Le retour de la gauche turque"
 RULE_OPTION_TUR_TURKISH_LEFT_DESC: "Le vote anti-establishment bascule vers la §8gauche révolutionnaire§! plutôt que vers les islamistes. La Turquie quitte l'OTAN, reconnaît ses minorités et se pose en avant-garde anti-impérialiste de la région."
 RULE_OPTION_TUR_GREAT_EAST: "Le Grand Est"
 RULE_OPTION_TUR_GREAT_EAST_DESC: "Le Parti de la vertu prend le pouvoir, désamorce l'état-major puis se radicalise en mouvement §8salafiste§! qui dissout la république. La Turquie proclame un califat et s'étend dans chaque direction qu'elle peut atteindre."
 RULE_OPTION_ENG_HISTORICAL: "Historique"
 RULE_OPTION_ENG_HISTORICAL_DESC: "Le §8Parti travailliste§! gouverne encore sous Blair et Brown avant que les §8conservateurs§! ne prennent le pouvoir et transmettent le Premier ministère le long d'une lignée de dirigeants, jusqu'au retour des travaillistes sous Starmer. La Grande-Bretagne quitte l'Union européenne, conserve l'alliance américaine et tient l'Union ensemble."
 RULE_OPTION_ENG_RISE_OF_BRITAIN: "L'essor de la Grande-Bretagne"
 RULE_OPTION_ENG_RISE_OF_BRITAIN_DESC: "La Grande-Bretagne reste une démocratie parlementaire et reconstruit l'empire par l'achat plutôt que par la conquête, achetant la presse, les partis et les ministères de ses anciennes colonies. Les gouvernements des Caraïbes au Pacifique répondent à nouveau à Londres sans un coup de feu."
 RULE_OPTION_CHI_HISTORICAL: "Le grand rajeunissement"
 RULE_OPTION_CHI_HISTORICAL_DESC: "La §8clique de Shanghai§! transmet le Parti au §8Tuanpai§! et le Tuanpai à Xi Jinping, et l'autonomie de Hong Kong est démantelée à son tour. Pékin fait valoir ses revendications en mer de Chine méridionale et de l'autre côté du détroit sans aller à la guerre pour elles."
 RULE_OPTION_CHI_HEGEMON: "Le Royaume du Milieu restauré"
 RULE_OPTION_CHI_HEGEMON_DESC: "Le §8modèle de Chongqing§! porte Bo Xilai à la direction et les §8Loups guerriers§! sont lâchés trop tôt. La Chine règle la frontière himalayenne par la force, met le Bhoutan, le Népal et l'Inde au pas, et prend Taïwan d'assaut."
 RULE_OPTION_CHI_PEACEFUL_RISE: "Ascension paisible"
 RULE_OPTION_CHI_PEACEFUL_RISE_DESC: "Zeng Qinghong hérite de la machine de Jiang et les §8technocrates de Shanghai§! tiennent le cap de Deng. Un pays, deux systèmes est honoré, le Tibet et le Xinjiang sont gouvernés par la loi plutôt que par la campagne, et la réunification se poursuit à la table des négociations."
 RULE_OPTION_BHR_HISTORICAL: "La charte Al Khalifa"
 RULE_OPTION_BHR_HISTORICAL_DESC: "La couronne achète la paix par une charte nationale et une chambre élue, puis brise la §8Coalition de la jeunesse du 14 février§! avec l'armure saoudienne une fois le rond-point rempli. Bahreïn reste le port de la flotte américaine et le client le plus fiable de Riyad."
 RULE_OPTION_BHR_DAY_OF_RAGE: "Jour de rage"
 RULE_OPTION_BHR_DAY_OF_RAGE_DESC: "§8Al-Wefaq§! tient le rond-point jusqu'à ce que la majorité chiite puisse enfin se voter au gouvernement qu'on lui a toujours refusé. Bahreïn retire la monarchie au profit d'une république et répond à Téhéran plutôt qu'à Riyad."
 RULE_OPTION_BHR_CROWNED_DEMOCRACY: "Le marché constitutionnel"
 RULE_OPTION_BHR_CROWNED_DEMOCRACY_DESC: "La couronne légalise §8Wa'ad§! et ses rivaux et confie à un véritable parlement le soin de gouverner, gardant le trône au-dessus du débat plutôt qu'en son sein. Bahreïn devient la première démocratie fonctionnelle du Golfe sans jamais quitter le camp occidental."
 RULE_OPTION_BOT_HISTORICAL: "Le BDP perdure"
 RULE_OPTION_BOT_HISTORICAL_DESC: "Le §8Parti démocratique du Botswana§! transmet la présidence de l'un des siens au suivant et gagne chaque élection qu'il dispute, tandis que les revenus du diamant paient les écoles, les cliniques et la lutte contre le sida. Le Botswana reste le succès discret du continent, non aligné et solvable, prêt à dire tout haut ce que ses voisins taisent."
 RULE_OPTION_BOT_POLITICAL_RAINBOW: "L'ombrelle s'ouvre"
 RULE_OPTION_BOT_POLITICAL_RAINBOW_DESC: "L'opposition cesse de diviser les voix et se rassemble derrière l'§8Umbrella for Democratic Change§!, brisant l'emprise que le §8Parti démocratique du Botswana§! tient depuis l'indépendance. Le Botswana connaît son premier changement de gouvernement, et l'Afrique australe la preuve qu'un parti de libération peut être battu aux urnes."
 RULE_OPTION_BOT_KGOSIKGOLO: "Couronner le Kgosikgolo"
 RULE_OPTION_BOT_KGOSIKGOLO_DESC: "Les §8Dikgosi§! transforment la Chambre des chefs d'organe consultatif en siège du pouvoir, et élèvent l'un des leurs comme chef suprême de tout le pays. Les élections cèdent la place à une monarchie traditionnelle, et la démocratie modèle du continent devient quelque chose que ses voisins ne reconnaissent plus."
 BLR_AI_BEHAVIOR: "@BLR Biélorussie"
 RULE_OPTION_BLR_HISTORICAL: "Le dernier dictateur d'Europe"
 RULE_OPTION_BLR_HISTORICAL_DESC: "Alexandre Loukachenko emprisonne ses rivaux, lie l'économie au rouble et brise la §8révolution des jeans§! avec les troupes anti-émeute. La Biélorussie reste l'allié le plus proche de Moscou et le gouvernement le plus isolé d'Europe."
 RULE_OPTION_BLR_EUROPEAN_BELARUS: "Biélorussie européenne"
 RULE_OPTION_BLR_EUROPEAN_BELARUS_DESC: "Andreï Sannikov porte la présidence pour la campagne §8Biélorussie européenne§! et détourne le pays du rouble vers Bruxelles. La Biélorussie postule à l'OTAN et à l'Union européenne, et la Russie perd le terrain sur lequel elle comptait à l'ouest de Smolensk."
 RULE_OPTION_BLR_TIKHANOVSKAYA: "La révolution Tikhanovskaïa"
 RULE_OPTION_BLR_TIKHANOVSKAYA_DESC: "Loukachenko règne sans contestation pendant une génération, jusqu'à ce qu'une élection volée place Svetlana Tikhanovskaïa à la tête d'un §8Conseil de coordination§! que la police anti-émeute ne peut briser. La Biélorussie se tourne vers l'ouest bien plus tard que ses voisins, avec des divisions russes déjà à la frontière."
 RULE_OPTION_BLR_POPULAR_FRONT: "La renaissance nationale"
 RULE_OPTION_BLR_POPULAR_FRONT_DESC: "Zianon Pazniak porte le §8Front populaire biélorusse§! au pouvoir sur un programme de biélorussisation, épurant les officiers soviétiques et ravivant la mémoire du Grand-Duché. La Biélorussie se retourne contre Moscou et revendique chaque voisin qui répondait jadis à Vilnius."
 RULE_OPTION_BLR_NATIONAL_BOLSHEVIKS: "La révolte national-bolchevique"
 RULE_OPTION_BLR_NATIONAL_BOLSHEVIKS_DESC: "Les §8nationaux-bolcheviks§! prennent la rue puis l'État, reconstruisant l'ordre soviétique derrière une armée du travail et une milice de parti. La Biélorussie s'arme contre la Pologne, l'Ukraine et les pays baltes avec la bénédiction de Moscou."
 RULE_OPTION_BLR_LITBEL: "La renaissance du Litbel"
 RULE_OPTION_BLR_LITBEL_DESC: "Le §8Parti communiste de Biélorussie§! revient au pouvoir et fait de l'ancienne république lituano-biélorusse son projet fondateur. La Biélorussie ramène la Lituanie et la Lettonie dans une union socialiste par l'influence quand elle le peut, et par la force quand elle ne le peut pas."
 RULE_OPTION_BLR_OLIGARCHY: "Le marché de l'oligarque"
 RULE_OPTION_BLR_OLIGARCHY_DESC: "Siarhiej Hajdukievič et le §8Parti libéral-démocrate§! échangent l'idéologie de Loukachenko contre un business plus franc, vendant l'accès à Moscou au meilleur prix. La Biélorussie reste dans l'orbite russe mais traite l'État de l'Union comme un contrat plutôt qu'un credo."
 RULE_OPTION_BOS_HISTORICAL: "L'ordre de Dayton"
 RULE_OPTION_BOS_HISTORICAL_DESC: "La présidence tournante tient sous supervision internationale, et le §8Parti d'action démocratique§! partage l'État avec ses rivaux serbes et croates au lieu de les battre. La Bosnie se reconstruit derrière l'OTAN et les casques européens et s'approche de Bruxelles sans jamais régler ce qu'est le pays."
 RULE_OPTION_BOS_SRPSKA_PARTNERSHIP: "La Srpska prend le fauteuil"
 RULE_OPTION_BOS_SRPSKA_PARTNERSHIP_DESC: "L'§8Alliance des sociaux-démocrates indépendants§! gagne la présidence et tourne Sarajevo vers Belgrade et Moscou tout en laissant la fédération intacte. La Bosnie quitte l'orbite occidentale par accord plutôt que par la force, et la Russie gagne un second point d'appui dans les Balkans."
 RULE_OPTION_BOS_SRPSKA_UNION: "La Serbie d'abord"
 RULE_OPTION_BOS_SRPSKA_UNION_DESC: "Le §8Parti démocratique serbe§! centralise tout le pays sous Banja Luka et négocie une union avec la Serbie. La Bosnie est absorbée dans un plus grand État serbe, et ses voisins se réveillent devant une carte redessinée."
 RULE_OPTION_BOS_ISLAMIST_REVIVAL: "Le réveil bosniaque"
 RULE_OPTION_BOS_ISLAMIST_REVIVAL_DESC: "Le grief bosniaque se durcit en réveil religieux, et le §8Réveil national§! réarme la république pour finir la guerre à ses conditions. La Bosnie renvoie les casques bleus et se retourne contre ses entités puis contre ses voisins."
 RULE_OPTION_BOS_WORKERS_STATE: "Les conseils ouvriers"
 RULE_OPTION_BOS_WORKERS_STATE_DESC: "Le chômage de masse porte le §8Front ouvrier§! au-delà des partis ethniques, et l'industrie bosniaque passe aux conseils de ceux qui la font tourner. L'État devient laïc et autogéré, et ne répond ni à Bruxelles ni à Belgrade."
 RULE_OPTION_BRA_HISTORICAL: "Les années Lula"
 RULE_OPTION_BRA_HISTORICAL_DESC: "Le §8Parti des travailleurs§! gagne enfin la présidence et couple les transferts aux pauvres à une finance orthodoxe, jusqu'à ce qu'une enquête de corruption vide la gauche et livre le palais à un ancien capitaine. Le Brésil devient une puissance moyenne courtisée qui se dispute avec Washington sans jamais quitter son orbite."
 RULE_OPTION_BRA_BROAD_FRONT: "Un nouveau Brésil"
 RULE_OPTION_BRA_BROAD_FRONT_DESC: "Le §8Parti des travailleurs§! gouverne par une large coalition avec le §8Mouvement démocratique brésilien§! et la petite gauche, et répond aux scandales de corruption par la réforme plutôt que par la retraite. Le Brésil reste une démocratie constitutionnelle et devient l'ancre d'une Amérique du Sud qui ne demande plus la permission au nord."
 RULE_OPTION_BRA_SOCIALIST_REPUBLIC: "La République rouge"
 RULE_OPTION_BRA_SOCIALIST_REPUBLIC_DESC: "Le §8Parti des travailleurs§! cesse de partager le pouvoir, absorbe ses rivaux à gauche et réécrit l'État autour de lui. Le Brésil proclame une république socialiste et exporte le modèle à chaque voisin prêt à le prendre."
 RULE_OPTION_BRA_LIBERALS: "L'ordre libéral"
 RULE_OPTION_BRA_LIBERALS_DESC: "Le §8Parti de la social-démocratie brésilienne§! conserve la présidence qu'il occupe déjà et mène privatisations et ciblage de l'inflation jusqu'au bout. Le Brésil devient l'économie la plus ouverte du continent et le partenaire américain le plus stable au sud de l'équateur."
 RULE_OPTION_BRA_SOCIAL_DEMOCRATS: "Les sociaux-démocrates"
 RULE_OPTION_BRA_SOCIAL_DEMOCRATS_DESC: "Le §8Parti de la social-démocratie brésilienne§! gouverne aux côtés du §8Parti démocratique travailliste§! et quitte l'orthodoxie de marché pour un État développementiste avec un plancher social. Le Brésil dépense pour l'industrie et les écoles plutôt que pour les intérêts, et se tient à distance de Washington comme de Pékin."
 RULE_OPTION_BRA_MILITARY_RULE: "La République du capitaine"
 RULE_OPTION_BRA_MILITARY_RULE_DESC: "Le §8Parti social-libéral§! prend la présidence, glorifie l'ancienne dictature et dissout le congrès qui lui barre la route. Le Brésil est à nouveau gouverné par décret depuis les casernes, et fait valoir ses prétentions contre les gouvernements socialistes à ses frontières."
 RULE_OPTION_BRA_MONARCHY: "L'Empire restauré"
 RULE_OPTION_BRA_MONARCHY_DESC: "Le réveil §8monarchiste§! transforme une présidence nationaliste en couronnement, et la maison d'Orléans-Bragance revient sur un trône vacant depuis plus d'un siècle. Le Brésil abolit ses élections, reprend l'ancienne province cisplatine et répond à nouveau à une couronne."
 RULE_OPTION_ARM_HISTORICAL: "Le clan du Karabakh"
 RULE_OPTION_ARM_HISTORICAL_DESC: "Les vétérans de la guerre du Karabakh tiennent la présidence pendant deux décennies derrière le §8Parti républicain d'Arménie§!, jusqu'à ce que la rue confie enfin le pays au §8Parti Contrat civil§!. L'Arménie reste liée à Moscou pour sa sécurité tout en se disputant les montagnes avec Bakou."
 RULE_OPTION_ARM_TER_PETROSIAN: "Le premier président revient"
 RULE_OPTION_ARM_TER_PETROSIAN_DESC: "Le §8Congrès national arménien§! ramène le président fondateur que les généraux avaient chassé, et les hommes du Karabakh n'auront jamais leur tour. L'Arménie échange les montagnes contre des frontières ouvertes et des relations normales avec ses voisins."
 RULE_OPTION_ARM_PEOPLES_PARTY_DESC: "Le §8Parti du peuple d'Arménie§! survit à la fusillade dans l'hémicycle et s'empare de l'État qu'on lui avait refusé. L'Arménie se reconstruit sur l'industrie et la planification de l'ère soviétique, et devient le partenaire le plus fiable de Moscou dans le Caucase."
 RULE_OPTION_ARM_TSARUKYAN: "La république de l'oligarque"
 RULE_OPTION_ARM_TSARUKYAN_DESC: "§8Arménie prospère§! achète carrément le parlement, et le pays est dirigé depuis le domaine d'un homme d'affaires plutôt que depuis le palais présidentiel. L'Arménie devient riche, corrompue et à vendre à la capitale qui paie le plus."
 RULE_OPTION_ARM_UNITED_STATES: "États-Unis d'Arménie"
 RULE_OPTION_ARM_UNITED_STATES_DESC: "Le §8Parti Héritage§! et la diaspora réécrivent la république en fédération, avec une place réservée à chaque Arménien de l'étranger. L'Arménie tourne son avenir vers Los Angeles et Beyrouth plutôt que vers Moscou."
 RULE_OPTION_ARM_FOUNDING_PARLIAMENT: "Le Parlement fondateur"
 RULE_OPTION_ARM_FOUNDING_PARLIAMENT_DESC: "Les vétérans du Karabakh de §8Sasna Tsrer§! s'emparent de la république qu'ils croient volée et la gouvernent comme une garnison. L'Arménie chasse les bases russes et demande à l'Occident de la garantir à la place."
 RULE_OPTION_ARM_MONARCHY: "La couronne restaurée"
 RULE_OPTION_ARM_MONARCHY_DESC: "L'§8Union Meliq d'Arménie§! met fin à la république et installe un roi à Erevan pour la première fois en six siècles. L'Arménie gouverne par le trône et l'Église, et revendique chaque province que ses anciens royaumes ont jamais tenue."
 RULE_OPTION_ARM_DASHNAK_LEFT: "Socialisme Dashnak"
 RULE_OPTION_ARM_DASHNAK_LEFT_DESC: "L'aile socialiste de la §8Fédération révolutionnaire arménienne§! gagne le débat interne et reconstruit la république sur son credo fondateur. L'Arménie nationalise les avoirs des oligarques et s'oppose à l'empire partout où elle le trouve."
 RULE_OPTION_ARM_DASHNAK_RIGHT: "L'héritage des fedayins"
 RULE_OPTION_ARM_DASHNAK_RIGHT_DESC: "L'aile nationaliste de la §8Fédération révolutionnaire arménienne§! s'empare du parti et gouverne au nom des combattants des montagnes. L'Arménie s'arme pour les terres perdues et ne cache pas vouloir les reprendre."
 RULE_OPTION_BUL_HISTORICAL: "La route de Bruxelles"
 RULE_OPTION_BUL_HISTORICAL_DESC: "L'§8Union des forces démocratiques§! tient ensemble le currency board et le programme de réformes, et chaque gouvernement qui la suit garde les deux mêmes candidatures sur la table. La Bulgarie rejoint l'OTAN puis l'Union européenne, et offre à l'alliance sa frontière la plus calme des Balkans."
 RULE_OPTION_BUL_TSARIST_RESTORATION: "Le tsar revient"
 RULE_OPTION_BUL_TSARIST_RESTORATION_DESC: "La §8maison de Saxe-Cobourg-Gotha§! exilée rentre pour plus qu'un poste de Premier ministre, rassemble la droite nationaliste derrière la couronne et gouverne en son nom. La Bulgarie échange les candidatures occidentales contre les frontières promises à San Stefano, et ses voisins voient la question macédonienne se rouvrir."
 RULE_OPTION_BUL_RED_BALKAN: "Le rêve rouge des Balkans"
 RULE_OPTION_BUL_RED_BALKAN_DESC: "Le §8Parti communiste de Bulgarie§! surgit des décombres de la transition et s'empare de l'État que le §8Parti socialiste bulgare§! n'a pas voulu reprendre. La Bulgarie cherche ses amis à Moscou et Pékin, et s'attelle à bâtir une fédération socialiste des Balkans."
 RULE_OPTION_CAN_HISTORICAL: "Historique"
 RULE_OPTION_CAN_HISTORICAL_DESC: "Le §8Parti libéral§! gouverne depuis le centre, maintient les deux langues fondatrices dans la machine fédérale et répond au Québec par une loi de clarté plutôt que par des concessions. Le Canada reste dans l'OTAN et la zone commerciale nord-américaine, et demeure le voisin le plus sûr de Washington."
 RULE_OPTION_CAN_FRENCH_CANADA: "Un Canada français"
 RULE_OPTION_CAN_FRENCH_CANADA_DESC: "Le §8Bloc québécois§! transforme un grief linguistique en programme fédéral, fait du français la langue unique de l'État et déplace le siège du gouvernement au Québec. Le Canada anglophone se retrouve minoritaire dans sa propre capitale, et l'union tient par la loi plutôt que par le consentement."
 RULE_OPTION_CAN_ARMED_NEUTRALITY: "Le Grand Nord seul"
 RULE_OPTION_CAN_ARMED_NEUTRALITY_DESC: "Le Canada quitte l'OTAN, met fin à ses enchevêtrements étrangers et consacre les économies à l'économie intérieure et à une industrie de défense autosuffisante. Le flanc nord de l'alliance se tait, et Washington perd la seconde armée de son propre continent."
 RULE_OPTION_CAN_NATIONALIST: "Le coup nationaliste"
 RULE_OPTION_CAN_NATIONALIST_DESC: "§8Canada First§! chevauche les décombres de l'ordre constitutionnel jusqu'au pouvoir, suspend les élections et répond au Québec et aux réserves par les pouvoirs d'urgence. Le Canada se retourne contre son propre continent, et la plus longue frontière non défendue du monde est fortifiée depuis le nord."
 RULE_OPTION_CAN_EASTERN_REALIGNMENT: "Le pont arctique"
 RULE_OPTION_CAN_EASTERN_REALIGNMENT_DESC: "Ottawa quitte l'OTAN et vend ses routes arctiques, ports et ressources à Moscou et Pékin plutôt qu'à Washington. Le Canada devient l'extrémité nord d'une sphère russo-chinoise, et les États-Unis se réveillent avec un rival sur leur propre continent."
 RULE_OPTION_DEN_HISTORICAL: "Les années Fogh"
 RULE_OPTION_DEN_HISTORICAL_DESC: "§8Venstre§! et les §8sociaux-démocrates§! se transmettent Christiansborg tandis que le Danemark conserve ses opt-out, refuse l'euro et envoie des soldats dans les Balkans, en Irak et en Afghanistan. Copenhague devient le petit allié le plus volontaire de Washington en Europe et laisse l'Union s'approfondir sans lui."
 RULE_OPTION_DEN_EUROPEAN_UNION: "Au cœur de l'Europe"
 RULE_OPTION_DEN_EUROPEAN_UNION_DESC: "Les §8sociaux-libéraux§! et les §8sociaux-démocrates§! emportent un second référendum et dépensent les opt-out danois pour acheter un siège au centre de l'Union. La couronne cède la place à l'euro et Copenhague s'ancre à Berlin et Paris plutôt qu'à Washington."
 RULE_OPTION_DEN_EUROSCEPTIC_DESC: "Le §8Parti du peuple danois§! force la question que les vieux partis reportent, et le Danemark quitte Schengen puis l'Union elle-même. La coopération de défense nordique remplace Bruxelles, et le reste de la Scandinavie est sommé de choisir un camp."
 RULE_OPTION_DEN_SOCIALIST_DESC: "L'§8Alliance rouge-verte§! et les syndicats transforment l'État-providence en État ouvrier et placent les conseils au-dessus du Folketing. Le Danemark quitte l'alliance et l'Union, cherche ses amis à l'est, et offre au reste du Nord une révolution."
 RULE_OPTION_DEN_MONARCHIST_DESC: "La cour cesse de feindre d'être cérémonielle et le §8Parti du peuple danois§! porte la cause de la couronne dans un parlement qui a perdu la patience du pays. Le monarque reprend les pouvoirs que la constitution lui avait ôtés, et le Groenland et les Féroé sont fermement ramenés sous la main de Copenhague."
 RULE_OPTION_DEN_NATIONALIST_DESC: "Le §8Parti du peuple danois§! prend le gouvernement qu'il n'a jamais fait que soutenir et fait de l'immigration et du contrôle des frontières toute la politique danoise. Le Danemark quitte l'alliance et le Conseil nordique, et recommence à faire valoir des revendications qu'il n'avait plus soulevées depuis le Moyen Âge."
 COM_AI_BEHAVIOR: "@COM Comores"
 RULE_OPTION_COM_HISTORICAL: "L'Union des Comores"
 RULE_OPTION_COM_HISTORICAL_DESC: "Azali Assoumani échange l'uniforme contre les urnes, chaque île a un président et la présidence de l'union tourne entre elles, et les troupes de l'Union africaine reprennent Anjouan à son colonel. La §8Convention pour le renouveau des Comores§! gagne puis perd le pouvoir pacifiquement, et l'archipel cesse enfin de se renverser lui-même."
 RULE_OPTION_COM_ORANGE_PARTY: "L'ascension orange"
 RULE_OPTION_COM_ORANGE_PARTY_DESC: "Le §8Parti orange§! de Mohamed Daoudou s'empare de Moroni et gère l'archipel comme une technocratie choisie au mérite, brisant les réseaux de trafic et professionnalisant les ministères. Les Comores se vendent au capital occidental comme le seul micro-État de l'océan Indien dont les papiers sont fiables."
 RULE_OPTION_COM_ISLAMIC_REPUBLIC: "Une République arabe"
 RULE_OPTION_COM_ISLAMIC_REPUBLIC_DESC: "Les comités de mosquée portent Ahmed Abdallah Mohamed Sambi à la présidence et le §8mouvement baasiste§! refait des îles une république arabe. Les ports sont nationalisés, Damas et Bagdad remplacent Paris, et les Comores deviennent une voix de la Ligue arabe dans le canal du Mozambique."
 RULE_OPTION_CUB_HISTORICAL: "Historique"
 RULE_OPTION_CUB_HISTORICAL_DESC: "Fidel transmet la présidence à son frère et le §8Parti communiste de Cuba§! maintient l'île à parti unique, autorisant les petits métiers tout en courtisant Caracas et Moscou pour le pétrole. L'embargo tient, la Période spéciale ne s'achève jamais vraiment, et La Havane reste l'exception gênante dans l'hémisphère de Washington."
 RULE_OPTION_CUB_PRO_WESTERN_REFORM: "Fidel ouvre l'île"
 RULE_OPTION_CUB_PRO_WESTERN_REFORM_DESC: "Castro démantèle lui-même l'économie de commandement, autorisant les banques, restaurant l'Église et écrivant une constitution qui admet des partis rivaux sous l'§8aile pro-occidentale du Parti communiste§!. La Havane règle la question de Guantánamo avec Washington, reconnaît Taipei et finit par forer aux côtés de l'OTAN."
 RULE_OPTION_CUB_DIAZ_CANEL: "Le dégel Díaz-Canel"
 RULE_OPTION_CUB_DIAZ_CANEL_DESC: "Miguel Díaz-Canel prend le palais avant Raúl, lève l'interdiction de l'§8Unión Liberal Cubana§! et convoque les premières élections contestées depuis la révolution. La censure est démantelée et le capital étranger revient, et Cuba devient une république caribéenne ordinaire sans un coup de feu."
 RULE_OPTION_CUB_NEW_SOCIALISM: "La seconde révolution"
 RULE_OPTION_CUB_NEW_SOCIALISM_DESC: "Díaz-Canel abandonne l'ouverture à mi-chemin, reconstruit l'État à parti unique autour d'un cadre plus jeune et commerce ouvertement avec Pyongyang. Cuba rejoint l'OTSC et rend ses bases à la Russie, plaçant une garnison russe à cent quarante kilomètres de la Floride."
 RULE_OPTION_CUB_NATIONALIST: "Cuba aux Cubains"
 RULE_OPTION_CUB_NATIONALIST_DESC: "La §8Phalange cubaine§! s'empare de l'État, purge communistes et démocrates et reconstruit l'armée autour d'un corps de travail de jeunesse. La Havane revendique alors tout le bassin comme son droit de naissance, et Haïti, la Jamaïque et l'isthme sont annexés l'un après l'autre."
 RULE_OPTION_CUB_RESTORED_REPUBLIC: "La République restaurée"
 RULE_OPTION_CUB_RESTORED_REPUBLIC_DESC: "Le §8Parti social-révolutionnaire démocratique de Cuba§! gagne le pouvoir, libère les prisonniers politiques et réécrit la constitution autour d'un parlement multipartite. Cuba invite alors ses voisins dans une fédération caribéenne au lieu de les conquérir."
 RULE_OPTION_CZE_HISTORICAL: "Historique"
 RULE_OPTION_CZE_HISTORICAL_DESC: "Les §8sociaux-démocrates tchèques§! et le §8Parti démocratique civique§! se transmettent le gouvernement tandis que le pays s'installe dans l'OTAN et l'Union européenne et que Škoda fait de Mladá Boleslav un moteur d'exportation. Prague envoie ses soldats dans les Balkans et en Afghanistan et devient un membre confortable et sans éclat du bloc occidental."
 RULE_OPTION_CZE_COMMUNISM: "Les communistes reviennent"
 RULE_OPTION_CZE_COMMUNISM_DESC: "Le §8Parti communiste de Bohême et Moravie§! transforme la colère contre les privatisations en majorité gouvernante et oriente les ministères contre ceux qui ont vendu les usines. La République tchèque quitte l'OTAN, courtise Moscou et Pékin, et rouvre des questions de frontières que ses voisins croyaient réglées."
 RULE_OPTION_CZE_MONARCHY_KING: "La couronne des Habsbourg"
 RULE_OPTION_CZE_MONARCHY_KING_DESC: "§8Koruna Česká§! passe de curiosité à plus grand parti, sort les joyaux de la couronne des réserves et rappelle Karl von Habsburg pour le couronner. Les terres tchèques redeviennent un royaume et s'emploient à rassembler Vienne et Budapest dans un bloc monarchiste d'Europe centrale."
 RULE_OPTION_CZE_MONARCHY_PRESIDENT: "La république couronnée"
 RULE_OPTION_CZE_MONARCHY_PRESIDENT_DESC: "§8Koruna Česká§! ramène le pays à l'ancien ordre mais garde les urnes, installant un chef d'État monarchiste choisi par élection plutôt que par le sang. La République tchèque conserve son parlement et ses partenaires européens tout en se reconstruisant autour du trône, de l'Église et de la région."
 RULE_OPTION_FIJ_HISTORICAL: "Historique"
 RULE_OPTION_FIJ_HISTORICAL_DESC: "L'armée écarte le gouvernement élu du §8United Fiji Party§! et installe à sa place une administration soutenue par les militaires. La stabilité revient dans les îles, mais l'autorité finale reste aux casernes et les élections restent en suspens."
 RULE_OPTION_FIJ_COUP_AVERTED: "Le coup évité"
 RULE_OPTION_FIJ_COUP_AVERTED_DESC: "L'affrontement entre le gouvernement et l'armée est désamorcé avant de renverser quiconque, et le §8Parti travailliste fidjien§! prend ses fonctions sur un mandat de centre-gauche. La réconciliation et l'investissement public mènent l'agenda, et Fidji conserve le gouvernement civil que ses voisins avaient abandonné."
 RULE_OPTION_FIJ_MILITARY_JUNTA: "La république des officiers"
 RULE_OPTION_FIJ_MILITARY_JUNTA_DESC: "Les radicaux des §8Forces militaires fidjiennes§! vont plus loin que le coup ne l'exigeait et formalisent un régime militaire ouvert, fusionnant la police dans l'armée sous la loi martiale. La politique se mène depuis les casernes, et le Pacifique gagne un État ouvertement militarisé au cœur de ses routes maritimes."
 RULE_OPTION_FIJ_RESTORED_KINGDOM: "La couronne restaurée"
 RULE_OPTION_FIJ_RESTORED_KINGDOM_DESC: "Le §8Grand Conseil des chefs§! gagne la crise et refonde Fidji en royaume sous un monarque élu. La coutume des chefs devient la base de l'État, et l'establishment autochtone règle la question ethnique à ses conditions."
 RULE_OPTION_FIJ_TECHNOCRACY: "Le gouvernement des ingénieurs"
 RULE_OPTION_FIJ_TECHNOCRACY_DESC: "Un conseil d'ingénieurs, de planificateurs et d'administrateurs prend le pays et gouverne sous une constitution technocratique. La politique de parti cède la place à l'automatisation et à la planification industrielle, et Fidji se propose de dépasser chaque économie de la région."
 RULE_OPTION_FIJ_EARLY_JUNTA: "Les casernes bougent tôt"
 RULE_OPTION_FIJ_EARLY_JUNTA_DESC: "La crise des otages du millénaire n'est jamais contenue, et les §8Forces militaires fidjiennes§! s'emparent du pays pendant que le parlement est encore assiégé. Une société militarisée se durcit des années en avance, et la région voit l'habitude du coup s'enraciner bien plus tôt."
 RULE_OPTION_FIJ_EARLY_KINGDOM: "La couronne revient tôt"
 RULE_OPTION_FIJ_EARLY_KINGDOM_DESC: "La crise des otages du millénaire s'achève par l'élévation d'un roi élu par le §8Grand Conseil des chefs§! plutôt que par un retour à la république. La monarchie est restaurée une génération politique trop tôt, et la seconde crise qui aurait suivi n'arrive jamais."
 RULE_OPTION_FRA_SOCIALIST: "Les socialistes reviennent"
 RULE_OPTION_FRA_SOCIALIST_DESC: "Le §8Parti socialiste§! prend l'Élysée et gouverne sur l'expansion de la protection sociale, la réduction du temps de travail et une ligne plus douce sur la dépense publique. La France reste dans l'OTAN et l'Union, mais plaide pour une Europe sociale plutôt que purement libérale."
 RULE_OPTION_FRA_LIBERAL: "Le centre libéral"
 RULE_OPTION_FRA_LIBERAL_DESC: "L'§8UDF§! centriste et son successeur §8La République En Marche§! gouvernent sur la déréglementation, la réforme du travail et un fédéralisme européen plus profond. La France pousse plus fort qu'aucune autre grande puissance pour une Union qui agisse d'une seule voix."
 RULE_OPTION_FRA_GAULLIST: "Le renouveau gaulliste"
 RULE_OPTION_FRA_GAULLIST_DESC: "Le §8Rassemblement pour la France§! ravive le souverainisme gaulliste, desserrant la France du commandement de l'OTAN et insistant sur une posture nucléaire indépendante. La France conserve son siège européen mais refuse de suivre Washington."
 RULE_OPTION_FRA_GREEN: "La République verte"
 RULE_OPTION_FRA_GREEN_DESC: "§8Les Verts§! et leur successeur §8Europe Écologie Les Verts§! gagnent le pouvoir et tournent l'État vers la transition écologique, repensant autant la flotte nucléaire que l'industrie lourde. La France échange un peu de croissance contre la voix verte la plus forte d'Europe."
 RULE_OPTION_FRA_FRANCE_UNBOWED: "La France insoumise"
 RULE_OPTION_FRA_FRANCE_UNBOWED_DESC: "§8La France Insoumise§! porte la gauche radicale au pouvoir sur la promesse d'une Sixième République et d'une rupture avec l'orthodoxie budgétaire européenne. La France s'oppose aux règles de l'Union et cherche des partenaires hors du bloc occidental."
 RULE_OPTION_FRA_NATIONAL_RALLY: "Le Rassemblement national"
 RULE_OPTION_FRA_NATIONAL_RALLY_DESC: "Le §8Front National§! et son successeur le §8Rassemblement National§! gagnent la République et gouvernent sur la restriction de l'immigration et la préférence nationale. La France pousse vers la sortie à Bruxelles et se rapproche de Moscou."
 RULE_OPTION_GRN_HISTORICAL: "Historique"
 RULE_OPTION_GRN_HISTORICAL_DESC: "Le Groenland gagne l'autonomie du Danemark et consacre ses efforts à la colonisation, à la pêche, aux mines et aux services publics plutôt qu'à l'aventure étrangère. L'Arctique reste calme et les voisins nordiques du Groenland conservent les frontières qu'ils ont."
 RULE_OPTION_GRN_SCANDINAVIAN_SERENITY_DESC: "Le Groenland rassemble l'Islande, les Féroé, le Danemark, la Norvège, la Suède et la Finlande dans une §8Union nordique§!, puis s'arrête au rivage baltique. La Scandinavie parle d'une seule voix et l'ordre européen plus large reste tel qu'il était."
 RULE_OPTION_GRN_CONTINENTAL_HEGEMONY_DESC: "Le Groenland porte son §8Union nordique§! vers le sud et l'est jusqu'à ce que la §8Fédération gelée§! s'étende sur la plus grande partie de l'Europe. Les capitales du continent répondent à Nuuk et l'ancien ordre européen est fini."
 RULE_OPTION_GRE_HISTORICAL: "Historique"
 RULE_OPTION_GRE_HISTORICAL_DESC: "§8Nouvelle Démocratie§! fait traverser à la Grèce la crise de la dette par l'austérité et l'euro, taillant le budget jusqu'à l'os avant que la reprise n'arrive. Athènes s'ancre plus profondément dans l'Union européenne et l'OTAN, liant Chypre, Israël et la France dans un front EastMed."
 RULE_OPTION_GRE_COMMUNIST: "L'Acropole rouge"
 RULE_OPTION_GRE_COMMUNIST_DESC: "L'effondrement livre l'État au §8Parti communiste de Grèce§!, qui écrit une nouvelle constitution, nationalise les banques et lève une armée rouge. La Grèce quitte l'OTAN et organise un bloc communiste à travers les Balkans, faisant valoir ses revendications sur la Bulgarie, l'Albanie, la Macédoine du Nord, la Serbie et la Roumanie."
 RULE_OPTION_GRE_NATIONALIST: "Aube dorée"
 RULE_OPTION_GRE_NATIONALIST_DESC: "§8Aube dorée§! chevauche le même effondrement jusqu'au pouvoir, enterre la république sous une dictature métaxiste et fait taire la presse et l'opposition. La Grèce ravive la Grande Idée et pose des revendications territoriales sur l'Albanie, la Bulgarie, la Macédoine du Nord et la Turquie."
 RULE_OPTION_GRE_MULTIPOLAR: "Tourner vers l'est"
 RULE_OPTION_GRE_MULTIPOLAR_DESC: "La république survit mais se retourne contre l'Union européenne, courtisant la Russie, la Chine et l'Iran et vendant Le Pirée au capital chinois. La Grèce rejoint les BRICS et quitte l'OTAN, échangeant sa place dans le camp occidental contre un siège dans un ordre multipolaire."
 RULE_OPTION_GEO_HISTORICAL: "Historique"
 RULE_OPTION_GEO_HISTORICAL_DESC: "La révolution des Roses balaye l'§8Union des citoyens de Géorgie§! et Mikheil Saakachvili tourne le pays durement vers l'OTAN et l'Occident. La Géorgie perd sa guerre avec la Russie sur les républiques sécessionnistes puis transmet pacifiquement le pouvoir à §8Rêve géorgien§!."
 RULE_OPTION_GEO_SHEVARDNADZE_WEST: "Chevardnadze endure"
 RULE_OPTION_GEO_SHEVARDNADZE_WEST_DESC: "Edouard Chevardnadze écrase l'opposition plutôt que de lui céder, et l'§8Union des citoyens de Géorgie§! maintient le pays sur sa trajectoire occidentale sans révolution. La Géorgie reste un État autoritaire que Bruxelles et Washington courtisent malgré tout."
 RULE_OPTION_GEO_PRO_RUSSIAN: "Concession à Moscou"
 RULE_OPTION_GEO_PRO_RUSSIAN_DESC: "L'§8Union des citoyens de Géorgie§! s'entend avec le Kremlin, laissant les bases russes en place et les républiques sécessionnistes réglées aux conditions de Moscou. La Géorgie glisse dans la Communauté des États indépendants et hors du camp occidental."
 RULE_OPTION_GEO_NATIONALIST: "Le retour des Mkhedrioni"
 RULE_OPTION_GEO_NATIONALIST_DESC: "Les paramilitaires §8Mkhedrioni§! sont relancés et s'emparent de l'État, et la Géorgie poursuit une Grande Géorgie redevable à aucun bloc. L'Arménie, l'Azerbaïdjan et les républiques sécessionnistes deviennent des cibles plutôt que des voisins."
 RULE_OPTION_GEO_COMMUNIST: "La République soviétique restaurée"
 RULE_OPTION_GEO_COMMUNIST_DESC: "Le §8Parti communiste unifié de Géorgie§! revient par les urnes ou par la révolution et proclame à nouveau la république soviétique. La Géorgie tend la main à l'Arménie et à l'Azerbaïdjan pour reconstruire une fédération transcaucasienne."
 RULE_OPTION_GEO_UNITED_NATIONAL_MOVEMENT: "Le Mouvement national tient"
 RULE_OPTION_GEO_UNITED_NATIONAL_MOVEMENT_DESC: "L'histoire suit son cours jusqu'à la guerre et au règlement qui suit, mais le §8Mouvement national uni§! de Saakachvili conserve la présidence au lieu de la perdre. La Géorgie redouble d'efforts pour l'adhésion à l'OTAN et répond à Moscou par une hostilité ouverte."
 RULE_OPTION_GEO_GEORGIAN_PATRIOTS: "Alliance des patriotes"
 RULE_OPTION_GEO_GEORGIAN_PATRIOTS_DESC: "Le règlement d'après-guerre arrive comme il l'a fait, puis l'§8Alliance des patriotes§! gagne sur une plateforme nationaliste et socialement conservatrice. La Géorgie se détourne de Bruxelles et dérive à nouveau vers l'est."
 RULE_OPTION_GEO_UNITED_GEORGIA: "Entre Est et Ouest"
 RULE_OPTION_GEO_UNITED_GEORGIA_DESC: "Le règlement d'après-guerre arrive comme il l'a fait, puis §8Géorgie unie§! prend ses fonctions sur une politique étrangère délibérément multi-vectorielle. La Géorgie équilibre l'Union européenne, la Russie et ses voisins au lieu de choisir entre eux."
 RULE_OPTION_GER_HISTORICAL: "Historique"
 RULE_OPTION_GER_HISTORICAL_DESC: "Le §8Parti social-démocrate§! gouverne en coalition avec les §8Verts§! et impose les réformes Hartz du travail contre sa propre base, puis transmet la chancellerie à l'§8Union chrétienne-démocrate§! pour une longue grande coalition. L'Allemagne reste ancrée dans l'OTAN et pilote l'Union européenne depuis son centre."
 RULE_OPTION_GER_LIBERAL: "La République libérale"
 RULE_OPTION_GER_LIBERAL_DESC: "Le §8Parti libéral-démocrate§! sort de son rôle de partenaire junior et prend le pays sur les marchés libres, la déréglementation, une défense privatisée et un État numérique. L'Allemagne se lie plus étroitement à l'OTAN et ouvre ses frontières à quiconque son système à points note le plus haut."
 RULE_OPTION_GER_POPULIST: "L'Alternative s'élève"
 RULE_OPTION_GER_POPULIST_DESC: "§8L'Alternative§! sort de la marge et entre au gouvernement sur l'immigration, l'islam, l'euroscepticisme et le doute climatique. L'Allemagne se rapproche de Moscou tout en démontant l'Union européenne de l'intérieur."
 RULE_OPTION_ETH_DERG_RESTORATION: "Le retour du Derg"
 RULE_OPTION_ETH_DERG_RESTORATION_DESC: "L'Éthiopie réhabilite Mengistu Haile Mariam et restaure le régime communiste sous la §8République démocratique populaire d'Éthiopie§!. La nation s'aligne sur la Chine et poursuit une solidarité communiste panafricaine."
 RULE_OPTION_EST_HISTORICAL: "Historique"
 RULE_OPTION_EST_HISTORICAL_DESC: "Le §8Parti de la réforme§! poursuit une déréglementation radicale et un impôt plat tout en bâtissant un État numérique autour d'une identité en ligne nationale. L'Estonie rejoint l'OTAN et l'Union européenne comme ancre occidentale dans la Baltique et contrepoids permanent à l'influence russe."
 RULE_OPTION_EST_CONSERVATIVE: "Estonie traditionnelle"
 RULE_OPTION_EST_CONSERVATIVE_DESC: "§8Isamaa§! investit lourdement dans l'école et le bien-être familial tout en accordant des allègements fiscaux favorables aux entreprises et en menant des programmes d'emploi ciblés. L'Estonie reste occidentale et pro-européenne mais se replie socialement, durcissant l'immigration et plaçant la préservation culturelle avant le cosmopolitisme."
 RULE_OPTION_EST_SOCIAL_DEMOCRATIC: "Le modèle nordique"
 RULE_OPTION_EST_SOCIAL_DEMOCRATIC_DESC: "Le §8Parti social-démocrate§! bâtit un État-providence de type nordique sur le salaire minimum, des syndicats renforcés et l'investissement industriel dirigé par l'État. L'Estonie conserve son ancrage occidental mais rejoint l'Europe en social-démocratie qui défend les droits des travailleurs et l'égalité au travail."
 RULE_OPTION_EST_CENTRIST: "L'équilibre oriental"
 RULE_OPTION_EST_CENTRIST_DESC: "Le §8Parti du centre§! abandonne le tropisme atlantiste de l'Estonie, rouvre le commerce avec la Russie et courtise la minorité russophone tout en poussant à une union avec la Lettonie et la Lituanie. L'Estonie devient un pont neutre entre Est et Ouest, et la Baltique perd son plus ferme avocat de l'OTAN."
 RULE_OPTION_EST_NATIONALIST: "L'Estonie d'abord"
 RULE_OPTION_EST_NATIONALIST_DESC: "§8EKRE§! prend le pouvoir, saisit les ressources du pays pour l'État et purge les partis pro-européens et leurs sympathisants de la vie publique. L'Estonie quitte l'intégration européenne, se réarme durement et fait valoir des revendications sur la Lettonie, la Lituanie, la Finlande et la Suède, transformant la Baltique en point chaud."
 CHE_AI_BEHAVIOR: "@CHE Tchétchénie"
 RULE_OPTION_CHE_HISTORICAL: "Historique"
 RULE_OPTION_CHE_HISTORICAL_DESC: "La seconde guerre s'achève avec l'§8Itchkérie§! détruite et la république réabsorbée dans la Russie sous les Kadyrov. La Tchétchénie échange l'indépendance contre l'argent de la reconstruction et devient l'exécuteur le plus fiable de Moscou dans le Caucase."
 RULE_OPTION_CHE_CALIPHATE: "L'Émirat du Caucase"
 RULE_OPTION_CHE_CALIPHATE_DESC: "Les §8moudjahidines§! étrangers écartent les séparatistes laïcs et gouvernent ce qui survit de la république sous la charia. La Tchétchénie devient un sanctuaire pour §8al-Qaïda§! et un point de départ du djihad à travers le Caucase et jusqu'en Russie même."
 RULE_OPTION_CHE_CAUCASUS_CONFEDERATION: "Confédération du Caucase"
 RULE_OPTION_CHE_CAUCASUS_CONFEDERATION_DESC: "Les officiers laïcs brisent les §8islamistes§! et reconstruisent l'Itchkérie comme noyau d'une union des peuples du Caucase du Nord. La Tchétchénie s'appuie sur Ankara et Bakou pour le poids nécessaire à tenir Moscou hors des montagnes."
 RULE_OPTION_CHE_WESTERN_ALIGNMENT: "La reconnaissance de l'Occident"
 RULE_OPTION_CHE_WESTERN_ALIGNMENT_DESC: "Les §8islamistes§! sont chassés et la république consacre son indépendance à courir après la reconnaissance dans les capitales occidentales plutôt qu'après des alliés dans les montagnes. La Tchétchénie achète sa survie par des titres démocratiques et un siège à la table européenne."
 RULE_OPTION_CHE_SOCIALIST_CAUCASUS: "Le Caucase rouge"
 RULE_OPTION_CHE_SOCIALIST_CAUCASUS_DESC: "La faction de §8Salman Raduev§! s'empare de la république et fusionne l'islam avec l'ordre soviétique dont les montagnes se souviennent encore. La Tchétchénie proclame une république socialiste caucasienne et s'entend avec Moscou en égale plutôt qu'en sujet."
 RULE_OPTION_IND_PARTY_OF_STRUGGLE: "Le Parti de la lutte"
 RULE_OPTION_IND_PARTY_OF_STRUGGLE_DESC: "Le §8Parti démocratique indonésien de lutte§! prend le pouvoir comme plus grande force laïque et nationaliste du pays, protégeant les minorités religieuses dans les régions contestées et faisant avancer le Pancasila contre la radicalisation. L'Indonésie pivote sa diplomatie vers l'est, vers la Chine et la Russie, tout en bâtissant un bastion nationaliste de gauche à travers l'archipel."
 RULE_OPTION_IND_DEMOCRAT_PARTY: "Une présidence technocratique"
 RULE_OPTION_IND_DEMOCRAT_PARTY_DESC: "Un général réformateur rassemble des professionnels technocrates dans le §8Parti démocrate§!, privilégiant la croissance économique, la stabilité institutionnelle et la confiance des investisseurs. L'Indonésie reste fermement ancrée à l'Occident comme modèle de gouvernance professionnelle et compétente en Asie du Sud-Est."
 RULE_OPTION_IND_UNITED_DEVELOPMENT: "Le Front du développement uni"
 RULE_OPTION_IND_UNITED_DEVELOPMENT_DESC: "Le §8Parti du développement uni§!, enraciné dans les réseaux islamiques de l'Ordre nouveau, s'empare de l'État et gouverne par le clientélisme, les relations personnelles et le consensus des élites plutôt que par la réforme structurelle. L'Indonésie préserve son ancrage occidental tandis que l'identité islamique s'approfondit par des structures de pouvoir informelles et une politique transactionnelle."
 RULE_OPTION_IND_PROSPEROUS_JUSTICE: "Le Mouvement de la justice prospère"
 RULE_OPTION_IND_PROSPEROUS_JUSTICE_DESC: "Le §8Parti de la justice prospère§!, mouvement islamiste discipliné bâti sur l'anti-corruption et la mobilisation de terrain, s'empare du pouvoir et brise les réseaux de patronage qui gouvernent depuis la Reformasi. Hostile à la tutelle occidentale et socialement conservateur, l'Indonésie s'oriente vers l'est comme acteur indépendant hors de l'ordre libéral et de la vieille élite."
 RULE_OPTION_JAP_NORMAL_NATION: "Une nation normale"
 RULE_OPTION_JAP_NORMAL_NATION_DESC: "Les §8libéraux-démocrates§! épuisent le consensus de l'article 9 jusqu'à ce que les Forces d'autodéfense soient inscrites dans la constitution comme une armée comme les autres. Le Japon se réarme dans l'alliance américaine et commence à répondre à Pékin et Pyongyang pour son propre compte."
 RULE_OPTION_JAP_SOCIAL_DEMOCRACY: "Le second après-guerre"
 RULE_OPTION_JAP_SOCIAL_DEMOCRACY_DESC: "Le §8Parti démocrate§! brise l'emprise conservatrice sur la Diète et gouverne sur la transparence, le droit du travail et une porte ouverte aux travailleurs étrangers. Le Japon consacre sa force à la natalité, au salaryman et à la corruption qui a survécu à la bulle plutôt qu'à la région."
 RULE_OPTION_JAP_PACIFIST: "La Constitution de la paix"
 RULE_OPTION_JAP_PACIFIST_DESC: "Les §8sociaux-démocrates§! prennent la Diète sur la promesse que l'article 9 dit ce qu'il dit, et les exportations d'armes, les bases puis les Forces d'autodéfense sont démantelées. Le Japon déchire le traité de sécurité avec Washington et se tient désarmé entre la Chine et les Corées."
 RULE_OPTION_HKG_HISTORICAL: "Historique"
 RULE_OPTION_HKG_HISTORICAL_DESC: "Le §8camp pro-Pékin§! maintient la Région administrative spéciale sur le cap de Pékin, reconstruisant le §8Conseil législatif§! autour des patriotes, mettant l'éducation patriotique dans les écoles et laissant s'étioler la vie civique cantonaise. L'argent suit : Hong Kong devient le hub offshore du renminbi et le financier des §8Nouvelles routes de la soie§!, et la §8Greater Bay Area§! avale ce que la §8Loi fondamentale§! promettait."
 RULE_OPTION_HKG_INDEPENDENCE: "Une nation à nous"
 RULE_OPTION_HKG_INDEPENDENCE_DESC: "Hong Kong déchire l'arrangement fantoche, écrit sa propre constitution et lève une armée et une flotte de porte-avions pour la défendre. Elle pose ensuite une revendication irrédentiste sur le delta de la Rivière des Perles, défiant Pékin de répondre pour le Guangdong."
 RULE_OPTION_HKG_BRITISH: "De nouveau sous la Couronne"
 RULE_OPTION_HKG_BRITISH_DESC: "Hong Kong quitte la souveraineté chinoise et rappelle Londres, accordant au Royaume-Uni des droits de garnison, rejoignant le partage de renseignement §8AUKUS§! et légiférant le suffrage universel et un pouvoir judiciaire indépendant. Un royaume du §8Commonwealth§! à la porte de la Chine offre à l'Occident le point d'appui démocratique que Pékin a passé des décennies à fermer."
 RULE_OPTION_HKG_CITY_STATE: "La ville libre"
 RULE_OPTION_HKG_CITY_STATE_DESC: "Hong Kong réécrit la §8Loi fondamentale§! de sa propre autorité, conserve une force de défense côtière à la place d'une armée et se fait la capitale financière de l'Asie de l'Est. Liée à aucun bloc, elle commerce avec Pékin comme avec Washington et ne répond à ni l'un ni l'autre."
 EGY_AI_BEHAVIOR: "@EGY Egypte"
 RULE_OPTION_EGY_HISTORICAL: "Historique"
 RULE_OPTION_EGY_HISTORICAL_DESC: "L'Égypte fait tourner le §8Parti national démocratique§! jusqu'à ce que la place le vide, confie un unique mandat aux §8Frères musulmans§!, puis rend la présidence à ses généraux. La paix avec Israël tient, l'aide américaine continue de couler, et Le Caire parle pour l'ordre arabe plutôt que contre lui."
 RULE_OPTION_EGY_BROTHERHOOD: "Les Frères tiennent"
 RULE_OPTION_EGY_BROTHERHOOD_DESC: "L'Égypte conserve son gouvernement élu des §8Frères musulmans§!, achète les officiers au lieu de les épurer, et écrit une constitution islamiste que les tribunaux ne peuvent renverser. Le Caire bascule vers Ankara, Doha et le Hamas, et les monarchies du Golfe le traitent comme une menace."
 RULE_OPTION_EGY_PAN_ARAB: "Les héritiers de Nasser"
 RULE_OPTION_EGY_PAN_ARAB_DESC: "L'Égypte ramène le §8Front national§! au pouvoir, nationalise les hauteurs de commande et fait renaître la République arabe unie. Le Caire courtise Damas, Bagdad et Tripoli, et tourne le dos à Washington."
 RULE_OPTION_EGY_SALAFIST: "Le tournant salafiste"
 RULE_OPTION_EGY_SALAFIST_DESC: "L'Égypte installe le §8parti Al-Nour§! au palais présidentiel, suspend les élections et gouverne par la loi religieuse. La charia gouverne les coptes comme minorité protégée, et la campagne du Sinaï devient une guerre sainte."
 RULE_OPTION_EGY_COPTIC: "L'ascension copte"
 RULE_OPTION_EGY_COPTIC_DESC: "L'Égypte est prise par l'§8Église copte§! et ses alliés laïcs, qui revendiquent l'héritage pharaonique plutôt qu'arabe. Le Caire protège les chrétiens de la Palestine à l'Assyrie et se retrouve isolé dans sa propre région."
 HEZ_AI_BEHAVIOR: "@HEZ Hezbollah"
 RULE_OPTION_HEZ_HISTORICAL: "Historique"
 RULE_OPTION_HEZ_HISTORICAL_DESC: "Le §8Hezbollah§! dispute les élections comme un parti, conserve l'armée de guérilla §8Taabia§! avec laquelle il a combattu Israël, et se tient aux côtés des §8Forces armées libanaises§! au lieu de les remplacer. Il combat aux côtés de Damas, des §8milices chiites irakiennes§! et des §8Houthis§! tout en restant un État dans l'État libanais."
 RULE_OPTION_HEZ_LAND_OF_GOD: "La Terre de Dieu"
 RULE_OPTION_HEZ_LAND_OF_GOD_DESC: "Le §8Hezbollah§! fait sécession du Liban et bâtit un État islamique reconnu à travers le sud et la Bekaa, courtisant des alliés et relevant le niveau de vie dans les villages qu'il gouverne. Il lève des forces expéditionnaires et un service de renseignement étranger, transformant une faction libanaise en puissance régionale à part entière."
 RULE_OPTION_HEZ_CONQUER_LEBANON: "Maîtres du Liban"
 RULE_OPTION_HEZ_CONQUER_LEBANON_DESC: "Le §8Hezbollah§! arme des déserteurs des §8Forces armées libanaises§! et prend le Liban par la guerre ouverte plutôt que par les urnes. Il paie la campagne avec l'argent, les usines et les routes iraniens, et annexe le pays dans une République islamique redevable à Téhéran."
 RULE_OPTION_HEZ_GLOBAL_RESISTANCE: "Exporter la révolution"
 RULE_OPTION_HEZ_GLOBAL_RESISTANCE_DESC: "Le §8Hezbollah§! tient ses positions au Liban et verse son argent dans les réseaux à l'étranger, du §8Mouvement islamique§! en Afrique de l'Ouest à la diaspora et aux routes des cartels qui partent du Venezuela. Il bâtit des cellules et des milices jusqu'en Amérique du Nord, portant la guerre bien au-delà du Levant."
 IRQ_AI_BEHAVIOR: "@IRQ Irak"
 RULE_OPTION_IRQ_HISTORICAL: "Historique"
 RULE_OPTION_IRQ_HISTORICAL_DESC: "L'Irak fonctionne sous le §8Parti Baas§! de Saddam Hussein jusqu'à ce que l'invasion américaine renverse le régime ; un gouvernement d'occupation règne ensuite depuis Bagdad tandis que le pouvoir passe aux partis religieux chiites du §8Dawa islamique§!. L'Irak finit en république sponsorisée par les États-Unis qui dérive néanmoins dans l'orbite diplomatique iranienne."
 RULE_OPTION_IRQ_BAATHIST_STATE: "Le Baas perdure"
 RULE_OPTION_IRQ_BAATHIST_STATE_DESC: "Le §8Parti Baas§! survit à l'invasion américaine, brise le régime de sanctions, règle la succession au sein de la famille et ravive ses revendications sur le Koweït, les régions kurdes et le Khuzestan iranien. Le Golfe vit aux côtés d'un Irak §8baasiste§! intact qui presse ses voisins et affirme des ambitions panarabes."
 RULE_OPTION_IRQ_SHIA_THEOCRACY: "Le gouvernement des juristes"
 RULE_OPTION_IRQ_SHIA_THEOCRACY_DESC: "Les partis cléricaux chiites et l'§8Organisation Badr§! s'emparent de l'État d'après-occupation et bâtissent une république gouvernée par les juristes, alignée sur Téhéran. Bagdad devient l'ancre occidentale d'un axe iranien allant jusqu'à Damas et Beyrouth."
 RULE_OPTION_IRQ_SADRIST: "La marée sadrist"
 RULE_OPTION_IRQ_SADRIST_DESC: "Le mouvement de §8Moqtada al-Sadr§! s'élève des bidonvilles de Bagdad, chasse les Américains et gouverne comme force populiste chiite et nationaliste irakienne qui refuse la tutelle iranienne aussi fermement que l'américaine. L'Irak se replie et se montre hostile à tout patron étranger."
 RULE_OPTION_IRQ_SECULAR_REPUBLIC: "La République laïque"
 RULE_OPTION_IRQ_SECULAR_REPUBLIC_DESC: "L'opposition laïque du §8Congrès national irakien§! et de l'§8Accord national irakien§! écrit une constitution au-dessus de la secte et de l'ethnicité et tient l'État comme république arabe plutôt que religieuse. L'Irak rejoint l'ordre arabe comme État laïc penchant vers l'Occident."
 RULE_OPTION_IRQ_COMMUNIST: "Un Irak socialiste"
 RULE_OPTION_IRQ_COMMUNIST_DESC: "Le §8Parti communiste irakien§! sort de la clandestinité où il vit depuis les purges §8baasistes§!, gagne les ouvriers, les femmes et les Kurdes, et s'empare de la république. L'Irak devient un État socialiste au milieu des monarchies pétrolières."
 RAJ_AI_BEHAVIOR: "@RAJ Inde"
 RULE_OPTION_RAJ_HISTORICAL: "Historique"
 RULE_OPTION_RAJ_HISTORICAL_DESC: "L'Inde alterne le pouvoir entre le §8Bharatiya Janata Party§! et le §8Congrès national indien§!, maintenant la libéralisation économique et l'engagement envers les §8BRICS§! et une politique étrangère multipolaire et non alignée. L'Inde conserve des liens avec Washington comme avec Moscou tout en s'imposant comme une voix majeure du monde en développement."
 RULE_OPTION_RAJ_GREATER_INDIA: "Grande Inde"
 RULE_OPTION_RAJ_GREATER_INDIA_DESC: "Un front nationaliste hindutva prend le pouvoir, imposant la règle majoritaire hindoue à l'intérieur tout en préservant la hiérarchie des castes et dépouillant les minorités de protection. L'Inde se tourne vers l'autarcie, l'isolement et des revendications territoriales sur le Népal, le Bhoutan et le Bangladesh, établissant un régime pan-indien autoritaire."
 RULE_OPTION_RAJ_RED_REPUBLIC: "La République rouge"
 RULE_OPTION_RAJ_RED_REPUBLIC_DESC: "Le §8Parti communiste d'Inde§! gagne le pouvoir, nationalisant l'économie et revenant à la planification quinquennale tout en s'alignant sur la Chine et en retirant la revendication sur l'Aksai Chin. L'Inde exporte la révolution à travers l'Asie du Sud, devenant une avant-garde socialiste radicale dans la région."
 RULE_OPTION_RAJ_PEOPLES_FRONT: "Le Front du peuple"
 RULE_OPTION_RAJ_PEOPLES_FRONT_DESC: "Le §8Bahujan Samaj Party§! et le §8Samajwadi Party§! forment une coalition dalit et socialiste, démantelant les privilèges de caste et redistribuant la richesse. L'Inde bâtit un État-providence de type nordique tout en maintenant sa politique étrangère non alignée."
 RULE_OPTION_RAJ_WESTERN_ALIGNMENT: "Allié de l'Occident"
 RULE_OPTION_RAJ_WESTERN_ALIGNMENT_DESC: "L'Inde se rapproche de la France et d'Israël, devenant un allié majeur non-OTAN des États-Unis et approfondissant la coopération militaire et commerciale avec Washington. L'Inde reconnaît Taïwan et finit par rejoindre l'OTAN, cimentant sa place dans l'alliance occidentale."
 ISR_AI_BEHAVIOR: "@ISR Israël"
 RULE_OPTION_ISR_HISTORICAL: "Historique"
 RULE_OPTION_ISR_HISTORICAL_DESC: "Le §8Likoud§! s'empare du pays après l'échec des pourparlers de paix, réprime la seconde Intifada derrière une barrière de séparation, et retire les colons de Gaza. Israël reste ancré à Washington, se normalise avec le Golfe arabe, et traite l'Iran comme la menace qui ordonne tout le reste."
 RULE_OPTION_ISR_PEACE_PROCESS: "Le camp de la paix"
 RULE_OPTION_ISR_PEACE_PROCESS_DESC: "Le §8Parti travailliste§! gouverne avec §8Meretz§! et les partis arabes et négocie sérieusement un règlement à deux États. L'Autorité palestinienne est armée comme partenaire plutôt que surveillée comme suspecte, et Gaza reçoit un port et un aéroport fonctionnels."
 RULE_OPTION_ISR_SECULAR_CENTRE: "Le centre laïc"
 RULE_OPTION_ISR_SECULAR_CENTRE_DESC: "§8Yesh Atid§!, §8Bleu et blanc§! et §8Nouvel Espoir§! s'emparent du pays et extraient la religion de l'État. Les tribunaux sont protégés, la conscription réécrite, et Israël se penche vers l'Europe et l'OCDE."
 RULE_OPTION_ISR_GREATER_ISRAEL: "Grand Israël"
 RULE_OPTION_ISR_GREATER_ISRAEL_DESC: "§8Otzma Yehudit§! et le §8sionisme religieux§! prennent le pouvoir et déchirent ce qui reste du cadre d'Oslo. Les colonies sont consolidées et annexées, le statu quo du mont du Temple est réécrit, et l'armée frappe au nord avant d'être frappée."
 RULE_OPTION_ISR_LOOK_EAST: "Tournant vers l'Est"
 RULE_OPTION_ISR_LOOK_EAST_DESC: "Un gouvernement §8Likoud§! pivote loin de Washington, louant le port de Haïfa à des opérateurs chinois et vendant armes et technologies à Pékin. Israël penche vers Moscou plutôt que vers Kiev, et l'alliance occidentale qui le garantissait commence à paraître conditionnelle."
 RULE_OPTION_LBA_HISTORICAL: "Historique"
 RULE_OPTION_LBA_HISTORICAL_DESC: "Kadhafi écrase le §8Groupe islamique combattant libyen§!, renonce à son programme d'armes et négocie la sortie des sanctions internationales. Le régime finit par tomber face à un soulèvement, et la Libye passe à un homme fort militaire commandant l'§8Armée nationale libyenne§!."
 RULE_OPTION_LBA_ISLAMIC_CALIPHATE: "Califat islamique"
 RULE_OPTION_LBA_ISLAMIC_CALIPHATE_DESC: "Kadhafi tolère le §8Groupe islamique combattant libyen§!, qui l'assassine et établit un État salafiste. La Libye devient une base du djihad à travers le Sahel, déstabilisant le Tchad, le Niger, le Nigeria, l'Algérie, le Mali et la Mauritanie."
 RULE_OPTION_LBA_LIBYAN_REPUBLIC: "République libyenne"
 RULE_OPTION_LBA_LIBYAN_REPUBLIC_DESC: "La Libye révise le Livre vert, renforce les Congrès du peuple et légalise les partis politiques. L'État se transforme en république présidentielle où une politique compétitive remplace la démocratie directe de Kadhafi."
 RULE_OPTION_LBA_ANTI_COLONIAL_UNION: "Union anticoloniale"
 RULE_OPTION_LBA_ANTI_COLONIAL_UNION_DESC: "Kadhafi reste et bâtit une §8Union anticoloniale§!, armant les insurrections à travers l'Afrique et le Moyen-Orient. La Libye devient un hub des mouvements révolutionnaires, déstabilisant ses voisins et répandant le chaos sur deux continents."
 RULE_OPTION_LBA_UNITED_ARAB_REPUBLIC: "République Arabe Unie"
 RULE_OPTION_LBA_UNITED_ARAB_REPUBLIC_DESC: "Kadhafi reste et s'associe aux §8baasistes§! pour bâtir une §8République arabe unie§!. La Libye fusionne dans un État panarabe s'étendant de la Mauritanie au Yémen, remodelant la géopolitique du monde arabe."
 RULE_OPTION_LBA_UNITED_STATES_OF_AFRICA: "États-Unis d'Afrique"
 RULE_OPTION_LBA_UNITED_STATES_OF_AFRICA_DESC: "Kadhafi reste et poursuit des §8États-Unis d'Afrique§! continentaux avec lui-même à leur tête. La Libye devient la capitale d'une superpuissance africaine, transformant tout l'ordre politique du continent."
 RULE_OPTION_MNT_HISTORICAL: "Historique"
 RULE_OPTION_MNT_HISTORICAL_DESC: "La §8faction Đukanović§! mène le Monténégro dans l'UE et l'OTAN tout en consolidant le contrôle oligarchique sur les institutions et l'économie. Le Monténégro devient une petite nation alignée sur l'Occident dont les institutions restent entrelacées avec le crime organisé et les réseaux de patronage politique."
 RULE_OPTION_MNT_EUROPEAN_REFORM: "Voie réformiste"
 RULE_OPTION_MNT_EUROPEAN_REFORM_DESC: "Les partis démocrates et sociaux-démocrates renversent les oligarques et poursuivent l'adhésion à l'UE couplée à une réforme anti-corruption agressive et au démantèlement des réseaux de patronage. Le Monténégro émerge comme une véritable démocratie libérale où les institutions fonctionnent libres du crime organisé et de la domination oligarchique."
 RULE_OPTION_MNT_MONARCHIST_RESTORATION: "Restauration monarchiste"
 RULE_OPTION_MNT_MONARCHIST_RESTORATION_DESC: "Les §8monarchistes et traditionalistes§! monténégrins restaurent la dynastie Petrović-Njegoš et consacrent le christianisme orthodoxe comme religion d'État. Le Monténégro poursuit une restauration alignée sur la Russie et centrée sur l'Église, hors de l'ordre occidental, plutôt que l'intégration aux structures européennes."
 RULE_OPTION_MNT_SOCIALIST_REVIVAL: "La renaissance socialiste"
 RULE_OPTION_MNT_SOCIALIST_REVIVAL_DESC: "Un §8mouvement communiste et néo-yougoslave§! s'empare du pouvoir, nationalise l'économie selon des lignes titistes, et promeut le rétablissement des structures politiques panyougoslaves. Le Monténégro tente de faire renaître la fédération yougoslave depuis son propre territoire, cherchant à réunir les peuples slaves du sud sous une gouvernance socialiste."
 RULE_OPTION_PER_HISTORICAL: "Historique"
 RULE_OPTION_PER_HISTORICAL_DESC: "La République islamique perdure sous le Guide suprême, la présidence passant d'un camp à l'autre entre réformistes et principalistes. L'Iran ancre l'Axe de la résistance, pousse son programme nucléaire à travers chaque round de sanctions, et projette sa puissance par des milices alliées du Liban au Yémen."
 RULE_OPTION_PER_RESTORATION: "Le Trône du Paon"
 RULE_OPTION_PER_RESTORATION_DESC: "Le §8Parti constitutionnaliste§! en exil ramène la dynastie §8Pahlavi§! et couronne Reza Pahlavi II sur un royaume laïc. L'ordre clérical est balayé et l'Iran se tourne vers l'ouest, abandonnant le réseau de proxies qu'il a mis une génération à bâtir."
 RULE_OPTION_PER_IRANIC_FEDERATION: "La Fédération iranienne"
 RULE_OPTION_PER_IRANIC_FEDERATION_DESC: "Le §8Parti pan-iraniste§! prend le pouvoir et s'emploie à rassembler les peuples iraniens du Tadjikistan, du Kurdistan, de l'Azerbaïdjan et du Baloutchistan en une seule fédération. L'Iran devient le cœur d'une nouvelle sphère iranienne, et chaque voisin détenant des terres iraniennes voit ses frontières mises en question."
 RULE_OPTION_PER_MOJAHEDIN: "Les Moudjahidines du peuple"
 RULE_OPTION_PER_MOJAHEDIN_DESC: "Les §8Moudjahidines du peuple§! rentrent d'exil sous Maryam Rajavi et s'emparent de l'État aux dépens du clergé. L'Iran est proclamé république populaire qui ne doit rien à l'ancienne révolution, et sa politique étrangère est reconstruite de zéro."
 RULE_OPTION_PER_FREEDOM_MOVEMENT: "Le Mouvement pour la liberté"
 RULE_OPTION_PER_FREEDOM_MOVEMENT_DESC: "Le §8Mouvement pour la liberté de l'Iran§! hérite des décombres du régime clérical et bâtit une république constitutionnelle laïque qui laisse la foi à la conscience privée. Les Gardiens de la Révolution sont écartés de la politique et des affaires, et l'Iran se rouvre à l'Occident comme un État ordinaire."
 RULE_OPTION_PER_NATIONAL_FRONT: "Le Front national"
 RULE_OPTION_PER_NATIONAL_FRONT_DESC: "Le §8Front national§! revient comme héritier de Mossadegh et reconstruit l'Iran sur le nationalisme laïc et le pétrole que la révolution a gaspillé. Il tient au non-alignement, ne courtisant ni Washington ni Moscou, tout en remettant les technocrates au travail."
 RULE_OPTION_PER_GREEN_MOVEMENT: "Le Mouvement vert"
 RULE_OPTION_PER_GREEN_MOVEMENT_DESC: "Le §8Mouvement vert§! porte Mir-Hossein Moussavi au pouvoir sur la promesse que le vote sera enfin compté. L'Iran reste une république islamique mais répond à son électorat, et la région perd le Guide suprême comme interlocuteur."
 RULE_OPTION_PER_MONTAZERI: "République de Montazeri"
 RULE_OPTION_PER_MONTAZERI_DESC: "Le clergé réformiste autour du §8grand ayatollah Montazeri§! reprend les séminaires aux durs et répond enfin des prisons. La foi garde sa place dans l'État, tempérée par l'homme qui a passé sa vie à condamner ce qui a été fait en son nom."
 RULE_OPTION_PER_AHMADINEJAD: "Le retour d'Ahmadinejad"
 RULE_OPTION_PER_AHMADINEJAD_DESC: "§8Mahmoud Ahmadinejad§! rassemble les populistes durs, paie les pauvres sur le compte pétrolier et défie le monde de l'arrêter. Les Basij et Ansar-e Hezbollah deviennent le bras de l'État à l'intérieur, et la confrontation à l'étranger devient le but plutôt que le prix."
 RULE_OPTION_PER_GHALIBAF: "L'ordre de Ghalibaf"
 RULE_OPTION_PER_GHALIBAF_DESC: "§8Mohammad Bagher Ghalibaf§! gouverne comme le commandant qui fait construire, échangeant la liberté politique contre des routes, l'ordre et des résultats. Les Gardiens conservent leur empire d'affaires et la presse son collier, tandis que Téhéran courtise Moscou pour le capital qui paiera tout cela."
 RULE_OPTION_PER_MASHAEI: "L'école iranienne de Mashaei"
 RULE_OPTION_PER_MASHAEI_DESC: "§8Esfandiar Rahim Mashaei§! place la nation avant la foi et prêche un Iran qui n'a pas besoin de clergé entre lui et Dieu. Les séminaires sont brisés comme force politique, et le nationalisme iranien plutôt que l'islam chiite devient ce que l'État exporte."
 RULE_OPTION_PER_WORKERS_REPUBLIC: "La République des travailleurs"
 RULE_OPTION_PER_WORKERS_REPUBLIC_DESC: "Le §8Parti Tudeh§! et la gauche iranienne rentrent d'exil et proclament une république des travailleurs. Le clergé et les Gardiens de la Révolution sont démantelés ensemble, et l'Iran cherche des amis parmi les États socialistes qui restent."
 RULE_OPTION_PER_ARTESH: "La Direction de l'Artesh"
 RULE_OPTION_PER_ARTESH_DESC: "L'§8Artesh§! dissout ce qui reste du gouvernement civil et gouverne par une direction de ses propres officiers. L'idéologie cède la place à l'intérêt brut de l'État, et l'Iran traite ses voisins en soldat plutôt qu'en révolutionnaire."
 RULE_OPTION_HOL_OPEN_VERDICT: "Un verdict ouvert"
 RULE_OPTION_HOL_OPEN_VERDICT_DESC: "Les Pays-Bas empruntent la même voie parlementaire mais n'en écrivent rien à l'avance : quel que soit le parti qui gagne l'élection forme la coalition, §8populistes§! compris. Ses alliés ne savent jamais tout à fait avec quel gouvernement de La Haye ils auront affaire ensuite."
 RULE_OPTION_NIG_HISTORICAL: "Historique"
 RULE_OPTION_NIG_HISTORICAL_DESC: "Le §8Parti démocratique du peuple§! tient le centre fédéral, maintenant un équilibre religieux précaire entre nord et sud tandis que l'amnistie plutôt que la force règle le delta du Niger. Le Nigeria reste l'ancre de l'Afrique de l'Ouest, exportant des casques bleus plutôt que l'instabilité."
 RULE_OPTION_NIG_SOCIAL_DEMOCRACY: "Un Nigéria social-démocrate"
 RULE_OPTION_NIG_SOCIAL_DEMOCRACY_DESC: "L'§8All Nigeria People's Party§! brise l'emprise du parti au pouvoir et tourne la fédération vers l'industrie d'État, la santé publique et un large filet de sécurité. Un Abuja redistributif dépense ses revenus pétroliers à l'intérieur, et les investisseurs étrangers regardent ailleurs dans la région."
 RULE_OPTION_NIG_CHRISTIAN_NATION: "Un Nigéria chrétien"
 RULE_OPTION_NIG_CHRISTIAN_NATION_DESC: "Abuja abolit la charia dans les États du nord et reconstruit le gouvernement fédéral autour de l'§8Église§!, enrôlant des milices chrétiennes contre les prédicateurs qui résistent. Le nord est pacifié par la force plutôt que par la négociation, et les voisins musulmans du Nigeria se refroidissent."
 RULE_OPTION_NIG_CALIPHATE: "Le Califat d'Afrique de l'Ouest"
 RULE_OPTION_NIG_CALIPHATE_DESC: "La charia s'étend hors des États du nord jusqu'à ce que §8Boko Haram§! siège dans le gouvernement plutôt que de le combattre, et la république fédérale cède la place à un califat. Les voisins du Nigeria font face à un État islamique expansionniste commandant la plus grande armée d'Afrique de l'Ouest."
 RULE_OPTION_BRM_HISTORICAL: "Historique"
 RULE_OPTION_BRM_HISTORICAL_DESC: "La §8Ligue nationale pour la démocratie§! prend ses fonctions tandis que le §8Tatmadaw§! conserve ses sièges réservés et les ministères de la défense, et les Rohingya sont pressés plutôt que chassés. Le Myanmar reste dans l'ASEAN, ses insurrections ethniques s'enlisent, et les généraux ne perdent rien qu'ils ne puissent reprendre."
 RULE_OPTION_BRM_BEACON_OF_DEMOCRACY: "Phare de la démocratie"
 RULE_OPTION_BRM_BEACON_OF_DEMOCRACY_DESC: "La §8Ligue nationale pour la démocratie§! démantèle le rôle constitutionnel de l'armée et bâtit un État fédéral avec autonomie ethnique et citoyenneté rohingya. Le Myanmar devient une démocratie fédérale multiethnique et se tourne vers des partenariats régionaux."
 RULE_OPTION_BRM_AN_IRON_FIST: "Une poigne de fer"
 RULE_OPTION_BRM_AN_IRON_FIST_DESC: "Le §8Tatmadaw§! durcit le régime militaire et écrase l'opposition, réprimant les insurrections ethniques et rejetant la pression internationale pour une réforme démocratique. Le Myanmar quitte l'ASEAN, expulse les Rohingya et se tourne vers la confrontation avec ses voisins."
 RULE_OPTION_NRY_HISTORICAL: "Historique"
 RULE_OPTION_NRY_HISTORICAL_DESC: "La coalition du centre cède et le §8Parti travailliste§! reprend le gouvernement, dépensant le fonds pétrolier pour l'État-providence et maintenant fermement la Norvège dans l'alliance. Oslo fait carrière des pourparlers de paix et de l'aide au développement tout en restant hors de l'Union que ses voisins ont rejointe."
 RULE_OPTION_NRY_CHRISTIAN_PEOPLES_DESC: "Le §8Parti populaire chrétien§! conserve le Premier ministère et inscrit dans la politique nationale la morale familiale, l'aide au développement et un quota généreux de réfugiés. La Norvège s'entraîne avec l'alliance mais tient Bruxelles à distance, accueillant les migrants que ses voisins du sud ne peuvent pas."
 RULE_OPTION_NRY_PROGRESS_DESC: "Le §8Parti du progrès§! sort de l'opposition et dépense la richesse pétrolière en baisses d'impôts, salles d'hôpital et soins aux personnes âgées plutôt qu'en aide étrangère. La Norvège se centralise, durcit sa loi d'immigration et tourne un visage plus froid aux voisins nordiques qui comptaient sur elle."
 RULE_OPTION_NKO_HISTORICAL: "Historique"
 RULE_OPTION_NKO_HISTORICAL_DESC: "Le plus jeune fils de Kim Jong-il est préparé comme successeur et hérite de l'État, et le §8Parti des travailleurs de Corée§! réaffirme son commandement sur les généraux avant de s'engager dans le §8Byungjin§! : ogives et biens de consommation à la fois. La dynastie tient, les commerçants de marché sont tolérés mais jamais fiables, et la péninsule reste figée là où l'armistice l'a laissée."
 RULE_OPTION_NKO_KIM_JONG_NAM: "L'héritier réformiste"
 RULE_OPTION_NKO_KIM_JONG_NAM_DESC: "Le frère aîné exilé gagne la lutte de succession et tourne le §8Parti des travailleurs de Corée§! vers une ouverture à la chinoise, échangeant le §8Juche§! contre des zones économiques spéciales, des coentreprises et finalement un bulletin de vote. Pyongyang échange l'isolement contre l'investissement, et Séoul a enfin un voisin avec lequel négocier."
 RULE_OPTION_NKO_MILITARY_JUNTA: "Les généraux prennent le pouvoir"
 RULE_OPTION_NKO_MILITARY_JUNTA_DESC: "L'état-major refuse les deux héritiers Kim et prend lui-même le pouvoir, conservant le §8Songun§! et épurant la famille qui a survécu à son utilité. Le commerce chinois nourrit le pays tandis que l'armée ne répond à aucun parti, et chaque voisin doit planifier autour d'un État nucléaire dirigé par des soldats."
 RULE_OPTION_POL_HISTORICAL: "Historique"
 RULE_OPTION_POL_HISTORICAL_DESC: "La Pologne achève sa transition sous la gauche post-communiste, rejoint l'Union européenne, puis confie le pays à §8Droit et Justice§!, qui gouverne contre Moscou et s'appuie sur Washington. Varsovie devient la voix orientale la plus bruyante de l'OTAN et une irritation permanente pour Berlin et Bruxelles."
 RULE_OPTION_POL_CIVIC_PLATFORM: "Les années Plateforme civique"
 RULE_OPTION_POL_CIVIC_PLATFORM_DESC: "§8Plateforme civique§! tient le gouvernement et mise l'avenir de la Pologne sur l'euro, l'investissement allemand et les fonds qui les accompagnent. Varsovie devient le partenaire le plus fiable de Bruxelles dans la région, et tient sa ligne sur Moscou en le faisant."
 RULE_OPTION_POL_WALESA: "Le retour de Walesa"
 RULE_OPTION_POL_WALESA_DESC: "Les §8chrétiens-démocrates§! ramènent Lech Wałęsa au palais présidentiel sur le souvenir de Solidarność. La Pologne reste fermement dans l'OTAN et consacre son crédit à reconstruire l'armée plutôt qu'à courir après le courant européen."
 RULE_OPTION_POL_KORWIN_COMMONWEALTH: "Korwin et la République des Deux Nations"
 RULE_OPTION_POL_KORWIN_COMMONWEALTH_DESC: "Janusz Korwin-Mikke et l'§8Union de la politique réelle§! ramènent l'État à ses fondations et courtisent la Lituanie, la Biélorussie et l'Ukraine comme égaux. Une République des Deux Nations renaît entre l'Allemagne et la Russie sans jamais quitter l'alliance occidentale."
 RULE_OPTION_POL_KORWIN_EAST: "Korwin se tourne vers l'est"
 RULE_OPTION_POL_KORWIN_EAST_DESC: "Janusz Korwin-Mikke et l'§8Union de la politique réelle§! règlent les vieux comptes de la Pologne en traitant directement avec Moscou et Minsk. Varsovie quitte le camp occidental, fait valoir sa revendication sur Lviv et prend son siège dans l'OTSC."
 RULE_OPTION_POL_FALANGA: "La montée de Falanga"
 RULE_OPTION_POL_FALANGA_DESC: "Des milices de rue et un front nationaliste uni portent §8Falanga§! de la marge au gouvernement. La Pologne quitte l'Union européenne et l'OTAN pour un État confessionnel militarisé qui inquiète chacun de ses voisins."
 RULE_OPTION_POL_RED_DREAM: "Le rêve rouge"
 RULE_OPTION_POL_RED_DREAM_DESC: "Une seconde révolution place le §8Parti socialiste polonais§! aux commandes et enterre les privatisations de la transition. La Pologne rompt avec l'Occident, suspend ses élections et se reconstruit en république des travailleurs."
 RULE_OPTION_POL_PEOPLES_ARMY: "L'Armée du peuple"
 RULE_OPTION_POL_PEOPLES_ARMY_DESC: "Les durs de l'§8Union des communistes polonais§! s'emparent de la révolution et reconstruisent l'Armée du peuple comme épine dorsale de l'État. La Pologne devient la garnison d'un nouveau bloc oriental et regarde l'ouest avec une hostilité ouverte."
 RULE_OPTION_ROM_HISTORICAL: "Historique"
 RULE_OPTION_ROM_HISTORICAL_DESC: "Le §8Parti social-démocrate§! sous Iliescu et Năstase combat la corruption endémique par une nouvelle direction anti-corruption tout en privatisant l'industrie et reconstruisant l'économie. La Roumanie rejoint l'OTAN puis l'Union européenne, s'assurant comme démocratie occidentale ancrée dans les institutions plutôt que dans les cultes de la personnalité."
 RULE_OPTION_ROM_NATIONAL_LIBERAL: "La République libérale"
 RULE_OPTION_ROM_NATIONAL_LIBERAL_DESC: "Le §8Parti national libéral§! prend le pouvoir en prônant l'impôt plat, la libéralisation des marchés et la décentralisation pour libérer l'entreprise privée et l'initiative individuelle. La Roumanie bâtit une identité européenne autour de principes libéraux de libre marché et s'intègre plus profondément à l'Occident que ne le permettrait son alternative sociale-démocrate."
 RULE_OPTION_ROM_PEASANT_PARTY: "Les chrétiens-démocrates tiennent"
 RULE_OPTION_ROM_PEASANT_PARTY_DESC: "Le §8Parti national paysan chrétien-démocrate§! survit à l'effondrement de la Convention démocratique et maintient la campagne au centre de la politique roumaine, mettant l'accent sur l'investissement rural, le renouveau agraire et le conservatisme religieux. La restitution des terres rend la propriété à ceux que les communistes avaient dépossédés, donnant aux agriculteurs du pays un enjeu dans le nouvel ordre."
 RULE_OPTION_ROM_DEMOCRATIC_PARTY: "Le Parti de l'Europe"
 RULE_OPTION_ROM_DEMOCRATIC_PARTY_DESC: "Le §8Parti démocrate§! sous Băsescu prend le centre politique, puis fusionne les ailes sociale-démocrate et conservatrice du pays en un seul parti ouvertement pro-européen. L'intégration européenne devient le but définissant de la politique roumaine, subordonnant toutes les autres préoccupations au travail de rejoindre l'Occident."
 RULE_OPTION_ROM_RESTORED_MONARCHY: "La couronne revient"
 RULE_OPTION_ROM_RESTORED_MONARCHY_DESC: "La Convention démocratique se recoud, convoque un référendum sur la monarchie, et le §8roi Michel Ier§! revient sur son trône, restaurant l'autorité symbolique de la couronne après cinquante ans de communisme. La direction roumaine revendique le droit ancestral de la couronne à régner sur tous les Roumains, y compris ceux de Moldavie, d'Ukraine et au-delà."
 RULE_OPTION_ROM_GREATER_ROMANIA: "Grande Roumanie"
 RULE_OPTION_ROM_GREATER_ROMANIA_DESC: "Le §8Parti de la Grande Roumanie§! de Corneliu Vadim Tudor s'empare de la présidence et transforme les services de sécurité et la presse en instruments de l'État-parti, consolidant le pouvoir par la peur et la propagande. La Roumanie poursuit la réunification forcée de toutes les terres roumaines, menaçant la Moldavie, la Hongrie, la Bulgarie, l'Ukraine et la Serbie et transformant la région en point chaud."
 SOV_AI_BEHAVIOR: "@SOV Russie"
 RULE_OPTION_SOV_HISTORICAL: "Historique"
 RULE_OPTION_SOV_HISTORICAL_DESC: "La Russie reconstruit la verticale du pouvoir sous §8Russie unie§!, ramène les oligarques à l'obéissance et transforme la richesse énergétique en posture de grande puissance restaurée. Ses voisins font face à un État qui prend la Crimée, soutient les républiques du Donbass et finit par se lancer en force contre l'Ukraine."
 RULE_OPTION_SOV_OLIGARCHS: "La République des oligarques"
 RULE_OPTION_SOV_OLIGARCHS_DESC: "Les hommes qui ont acheté la Russie lors des privatisations la gardent, et les §8oligarques§! gèrent l'État comme une holding pour leurs propres actifs. Le capital étranger trouve toutes les portes ouvertes tandis que l'armée et la bourse publique sont laissées à payer l'arrangement."
 RULE_OPTION_SOV_LIBERAL_REFORM: "Le tournant libéral"
 RULE_OPTION_SOV_LIBERAL_REFORM_DESC: "§8Iabloko§! et l'§8Union des forces de droite§! gagnent le débat sur l'avenir de la Russie et reconstruisent ses tribunaux, sa presse et son économie sur des lignes occidentales. Moscou échange son levier sur ses voisins contre un partenariat avec l'Europe et les États-Unis."
 RULE_OPTION_SOV_COMMUNIST_REVIVAL: "Renaissance rouge"
 RULE_OPTION_SOV_COMMUNIST_REVIVAL_DESC: "Le §8Parti communiste de la Fédération de Russie§! prend le pouvoir sur la promesse d'annuler les privatisations et de ramener les républiques soviétiques. La renationalisation à l'intérieur et un bloc oriental renaissant à l'extérieur replacent la Russie à la tête d'un camp rival."
 RULE_OPTION_SOV_NATIONALIST: "Grande Russie"
 RULE_OPTION_SOV_NATIONALIST_DESC: "Le §8Parti libéral-démocrate§! chevauche le ressentiment jusqu'au pouvoir et s'attaque à chaque frontière qu'il croit due à la Russie. De la Baltique à l'Asie centrale, les voisins deviennent des revendications à faire valoir plutôt que des États avec lesquels traiter."
 RULE_OPTION_SOV_NATIONAL_BOLSHEVIK: "L'ordre national-bolchevique"
 RULE_OPTION_SOV_NATIONAL_BOLSHEVIK_DESC: "Les §8nationaux-bolcheviks§! fusionnent le rouge et le brun en un État révolutionnaire qui ne répond ni aux libéraux ni aux oligarques. La Russie rassemble les terres russes par la force et traite les frontières post-soviétiques comme un affront temporaire."
 RULE_OPTION_SOV_MEDVEDEV_HARDLINE: "Le président de fer"
 RULE_OPTION_SOV_MEDVEDEV_HARDLINE_DESC: "Dmitri Medvedev refuse de rendre la présidence et bâtit un État sécuritaire à lui par-dessus celui qu'il a hérité. Le tandem se brise en public, et les hommes autour de son prédécesseur sont chassés de la politique russe."
 RULE_OPTION_SOV_MEDVEDEV_LIBERAL: "Le dégel de Medvedev"
 RULE_OPTION_SOV_MEDVEDEV_LIBERAL_DESC: "Dmitri Medvedev rend réel son programme de modernisation, desserrant l'emprise des services de sécurité et courtisant la technologie et le capital occidentaux. La Russie se libéralise à l'intérieur et s'adoucit à l'extérieur, et les siloviki perdent le débat pour de bon."
 RULE_OPTION_SAU_HISTORICAL: "Historique"
 RULE_OPTION_SAU_HISTORICAL_DESC: "La §8maison des Saoud§! conserve le trône par une succession ininterrompue, dépense ses revenus pétroliers à se diversifier hors du pétrole, et tient la relation de sécurité américaine tout en contenant l'Iran jusqu'à ce que Pékin négocie un dégel. L'Arabie saoudite reste l'ancre du Golfe et le partenaire senior de chaque monarchie le long de celui-ci."
 RULE_OPTION_SAU_KHALEEJI_UNION: "L'Union khalijie"
 RULE_OPTION_SAU_KHALEEJI_UNION_DESC: "Le Royaume transforme le Conseil de coopération du Golfe d'un forum de discussion en un État unique, d'abord une monnaie partagée et un commandement conjoint, puis une union politique sous Riyad. Les plus petites monarchies du Golfe sont absorbées purement et simplement et cessent d'exister comme pays indépendants."
 RULE_OPTION_SAU_FAISALITE_KINGDOM: "La restauration faisalite"
 RULE_OPTION_SAU_FAISALITE_KINGDOM_DESC: "Un courant réactionnaire de la famille royale gagne la succession, restaure les §8oulémas wahhabites§! à l'autorité qu'ils avaient sous le roi Fayçal, et chasse l'argent et les bases étrangères du pays. Le Royaume soit ferme entièrement sa frontière, soit se pose en troisième pôle menant le monde musulman contre les deux superpuissances."
 RULE_OPTION_SAU_MILITARY_RULE: "Le coup des officiers"
 RULE_OPTION_SAU_MILITARY_RULE_DESC: "L'armée régulière, affamée de fonds tandis que la Garde nationale conserve ses privilèges, dépose le roi et gouverne par le §8Conseil militaire suprême§!. Les officiers dirigent un Golfe qui ne sait plus qui parle pour Riyad, et leur emprise ne dure que tant que la légitimité qu'ils peuvent acheter."
 RULE_OPTION_SAU_BAATHIST_REPUBLIC: "La République socialiste arabe"
 RULE_OPTION_SAU_BAATHIST_REPUBLIC_DESC: "La monarchie partie, le §8Parti Baas arabe§! s'empare de la république, nationalise les hauteurs de commande et reconstruit l'armée comme avant-garde de l'unité arabe. Les garnisons étrangères reçoivent leur congé à travers la péninsule et chaque capitale arabe est invitée dans un seul État."
 RULE_OPTION_SAU_ISLAMIC_REPUBLIC: "La République chiite"
 RULE_OPTION_SAU_ISLAMIC_REPUBLIC_DESC: "Les §8partis chiites§! longtemps réprimés de la Province orientale héritent de la république et choisissent entre un règlement constitutionnel et la voie khomeyniste. Les plus grandes réserves pétrolières du Golfe changent de camp, et Téhéran gagne l'allié qu'il a passé des décennies à chercher."
 RULE_OPTION_SAU_PEOPLES_REPUBLIC: "La République rouge"
 RULE_OPTION_SAU_PEOPLES_REPUBLIC_DESC: "Le §8Parti communiste§! s'empare de la république, nationalise carrément les champs pétroliers et transforme la péninsule en base de révolution à travers le monde arabe. Riyad soit signe avec Moscou, soit mène le bloc non aligné, et les monarchies du Golfe se réveillent avec un ennemi à leur frontière."
 RULE_OPTION_SAU_PARLIAMENTARY_REPUBLIC: "L'expérience démocratique"
 RULE_OPTION_SAU_PARLIAMENTARY_REPUBLIC_DESC: "L'§8Assemblée démocratique nationale§! gagne les élections constituantes et écrit une constitution libérale avec un Majlis élu, un pouvoir judiciaire indépendant et une presse libre. L'Occident gagne sa première démocratie arabe sur le Golfe, et chaque monarchie voisine doit expliquer pourquoi elle n'en est pas une."
 PMR_AI_BEHAVIOR: "@PMR Transnistrie"
 RULE_OPTION_PMR_HISTORICAL: "Historique"
 RULE_OPTION_PMR_HISTORICAL_DESC: "Tiraspol reste aux mains d'Igor Smirnov et des successeurs qui héritent de sa république, échangeant les pourparlers avec Chișinău contre une dépendance plus profonde au gaz, aux roubles et aux casques bleus russes. Le conflit du Dniestr reste gelé et la Moldavie n'obtient rien qu'elle puisse appeler un règlement."
 RULE_OPTION_PMR_DEMOCRATIC: "Ponts vers Chișinău"
 RULE_OPTION_PMR_DEMOCRATIC_DESC: "La Transnistrie remet le pouvoir à ses §8libéraux§!, démantèle l'appareil de sécurité de guerre et négocie son retour vers la Moldavie comme partenaire fédéral. Moscou perd son point d'appui sur le Dniestr et l'Union européenne gagne une frontière réglée."
 RULE_OPTION_PMR_REPUBLICAN: "Le tournant républicain"
 RULE_OPTION_PMR_REPUBLICAN_DESC: "Le parti §8Republic§! s'empare de Tiraspol sur un programme de gouvernement propre, de petites entreprises et d'une indépendance qui ne répond à personne. La Transnistrie cesse d'être une garnison russe et commence à essayer d'être un État."
 RULE_OPTION_PMR_COMMUNIST: "Bannière rouge restaurée"
 RULE_OPTION_PMR_COMMUNIST_DESC: "Le §8Parti communiste§! revient au pouvoir à Tiraspol, nationalise les avoirs Sheriff et rouvre le dossier d'une RSS moldave renaissante. Chișinău fait face à un voisin qui veut son territoire plutôt qu'un règlement."
 RULE_OPTION_PMR_MONARCHIST: "Couronne sur le Dniestr"
 RULE_OPTION_PMR_MONARCHIST_DESC: "Les §8monarchistes§! couronnent un souverain sur le Dniestr et reconstruisent la Transnistrie comme le dernier fragment survivant de la Russie impériale. Tiraspol échange la nostalgie soviétique contre une cour, une garde et une prétention à une légitimité plus ancienne."
 RULE_OPTION_PMR_MILITARY_JUNTA: "La République du général"
 RULE_OPTION_PMR_MILITARY_JUNTA_DESC: "Le général Alexandre Lebed est rappelé de Krasnoïarsk pour diriger la république qu'il a défendue, et les §8officiers de la 14e armée§! prennent les ministères avec lui. La Transnistrie s'arme contre Chișinău et Bucarest au lieu d'attendre la permission de Moscou."
 RULE_OPTION_PMR_UKRAINIAN: "Vers Kyiv"
 RULE_OPTION_PMR_UKRAINIAN_DESC: "Tiraspol expulse ses patrons russes, invite officiers et administrateurs ukrainiens à les remplacer, et soumet l'adhésion à l'Ukraine à un référendum. Le Dniestr cesse d'être l'avant-poste occidental de la Russie et devient la frontière orientale de Kiev."
 SWI_AI_BEHAVIOR: "@SWI Suisse"
 RULE_OPTION_SIN_HISTORICAL: "Historique"
 RULE_OPTION_SIN_HISTORICAL_DESC: "The §8People's Action Party§! keeps its unbroken hold on the island, passes the premiership from Goh Chok Tong to Lee Hsien Loong and then to Lawrence Wong, and pairs a hard defence with a foreign policy of talking everyone down. Singapore stays the rich, armed and non-aligned broker of Southeast Asia, friendly to Washington and open to Beijing."
 RULE_OPTION_SIN_OPPOSITION_VICTORY: "L'opposition gagne"
 RULE_OPTION_SIN_OPPOSITION_VICTORY_DESC: "Electoral reform loosens the §8People's Action Party§! grip and the §8Workers' Party§! rides a wave of liberalisation into government. Singapore turns into a Western-style democracy that leans on NATO and Europe, and the region loses its model of managed one-party rule."
 RULE_OPTION_SIN_LOOK_EAST: "Regardez vers l'Est"
 RULE_OPTION_SIN_LOOK_EAST_DESC: "The §8People's Action Party§! nationalises foreign assets, adopts the Chinese media model and takes the island into the Shanghai Cooperation Organisation and BRICS. Singapore becomes an economic champion in Beijing's orbit, and the straits it commands stop being neutral water."
 RULE_OPTION_SIN_MASTER_OF_THE_STRAITS: "Maître des détroits"
 RULE_OPTION_SIN_MASTER_OF_THE_STRAITS_DESC: "The hardliners inside the §8People's Action Party§! ban the opposition, put the army first and turn the city state's wealth into claims on Johor and the Riau Islands. Singapore starts dictating terms in the straits it depends on, and Malaysia and Indonesia find a small neighbour ready to fight for them."
 RULE_OPTION_SPR_HISTORICAL: "Historique"
 RULE_OPTION_SPR_HISTORICAL_DESC: "The §8People's Party§! and the §8Spanish Socialist Workers' Party§! trade the government back and forth, with Zapatero, Rajoy and Sánchez following Aznar into the Moncloa. Spain stays a committed member of the European Union and NATO and keeps its autonomous communities inside a tense but intact constitution."
 RULE_OPTION_SPR_CONSERVATIVE: "Espagne conservatrice"
 RULE_OPTION_SPR_CONSERVATIVE_DESC: "The §8People's Party§! holds the Cortes for a generation and governs on a market-liberal, Atlanticist line. Spain stays a firm NATO member and an unadventurous partner in Brussels."
 RULE_OPTION_SPR_SOCIALIST: "Espagne socialiste"
 RULE_OPTION_SPR_SOCIALIST_DESC: "The §8Spanish Socialist Workers' Party§! and the wider left hold power for a generation and push the welfare state further than any government before them. Spain becomes the social-democratic argument in Europe and pulls the Mediterranean along with it."
 RULE_OPTION_SPR_NATIONALIST: "Renaissance nationaliste"
 RULE_OPTION_SPR_NATIONALIST_DESC: "§8Vox§! and the nationalist right break out of the fringe and take the government. Spain turns against the autonomous communities and against migration, and argues with Brussels rather than following it."
 RULE_OPTION_SPR_FALANGIST: "Syndicalisme national"
 RULE_OPTION_SPR_FALANGIST_DESC: "§8La Falange§! returns from the political wilderness and rebuilds the state on the national-syndicalist model. The Cortes gives way to the vertical syndicates, and Spain looks to Portugal and its old empire rather than to Europe."
 RULE_OPTION_SPR_COMMUNIST: "Red Republic"
 RULE_OPTION_SPR_COMMUNIST_DESC: "The §8Communist Party of Spain§! takes the state the socialists would not, and the republic is rebuilt on Marxist lines. Spain leaves the Western camp behind, and NATO loses its southern flank."
 RULE_OPTION_SPR_MONARCHIST: "Absolute Crown"
 RULE_OPTION_SPR_MONARCHIST_DESC: "The crown and the church are put back at the center of the state, and Spain sets about recovering the empire it lost. Gibraltar, the Maghreb and the old viceroyalties are treated as unfinished business rather than as history."
 RULE_OPTION_SWE_HISTORICAL: "Historique"
 RULE_OPTION_SWE_HISTORICAL_DESC: "Sweden alternates between §8Social Democrat§! and §8Moderate§! led governments, stays in the European Union, keeps its Nordic and Baltic partnerships, and gives up military non-alignment for NATO only once Russia turns threatening. The constitutional monarchy stays untouched and the Baltic keeps its most reliable Western partner."
 RULE_OPTION_SWE_NATIONALIST: "La Suède d'abord"
 RULE_OPTION_SWE_NATIONALIST_DESC: "The §8Sweden Democrats§! surge into government on migration and law and order, close the borders, rebuild conscription and territorial defence, and keep their distance from Brussels without leaving the democratic order. Sweden turns inward and its neighbours lose the region's most open partner."
 RULE_OPTION_SWE_NORTHERN_CROWN: "Lion du Nord"
 RULE_OPTION_SWE_NORTHERN_CROWN_DESC: "The nationalist surge hands power to the §8Monarchists§!, who restore royal rule and set out to reunite Finland, the Baltic coast and Scandinavia under a Swedish crown by treaty or by war. The Nordic and Baltic states face a revisionist great power on their doorstep."
 RULE_OPTION_SWE_RED_SWEDEN_DESC: "The §8Left Party§! and the communist movement take the Riksdag, nationalise industry, question NATO and Western sanctions, and pivot Sweden toward Russia, China and the BRICS. The West loses a model partner in the Baltic and Moscow gains a friend on its northern flank."
 RULE_OPTION_SWE_ARMED_NEUTRALITY: "Neutralité armée"
 RULE_OPTION_SWE_ARMED_NEUTRALITY_DESC: "A §8Green Party§! led government refuses every bloc, enshrines armed neutrality in law, and funds total defence, Gotland and cyber security on its own. Sweden stays outside NATO and out of great power alignment."
 RULE_OPTION_SWI_HISTORICAL: "Historique"
 RULE_OPTION_SWI_HISTORICAL_DESC: "The §8Swiss People's Party§! stays the largest party in the federal coalition while Switzerland keeps its armed neutrality, joins the United Nations, sends peacekeepers abroad and ties itself to the European Union through bilateral treaties instead of membership. Europe keeps a trusted neutral in the Alps that trades with every side and joins none."
 RULE_OPTION_SWI_EURO_ATLANTIC: "Intégration euro-atlantique"
 RULE_OPTION_SWI_EURO_ATLANTIC_DESC: "The §8Social Democratic Party§! leads the government and Switzerland abandons neutrality, joins NATO and applies for European Union membership. The Western alliance gains an Alpine anchor between France, Germany, Austria and Italy."
 RULE_OPTION_SWI_FORTRESS: "Forteresse Suisse"
 RULE_OPTION_SWI_FORTRESS_DESC: "The §8Swiss People's Party§! turns the country inward, keeping its distance from Brussels and the United Nations, exporting mercenaries and rebuilding the mountain forts. Europe loses a partner and gains a hedgehog that nobody can count in their column."
 RULE_OPTION_SWI_SOCIALIST_REPUBLIC: "République socialiste suisse"
 RULE_OPTION_SWI_SOCIALIST_REPUBLIC_DESC: "The federation is dissolved and a communist one-party republic nationalises the banks, denounces the European Union and stays outside every bloc. Europe finds an ideological rival in the Alps that rejects Western integration entirely."
 RULE_OPTION_SWI_NATIONAL_FRONT: "Front National"
 RULE_OPTION_SWI_NATIONAL_FRONT_DESC: "The federation is dissolved and the revived §8National Front§! builds a one-party state that claims the French, Italian and Austrian Alps and Liechtenstein for an Alpine Federation. Switzerland's neighbours face territorial demands from a revanchist power in the heart of Europe."