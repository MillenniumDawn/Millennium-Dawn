l_polish:
 ARMY_EXPERIENCE_DESC: "W miarę wykorzystywania sprzętu w działaniach bojowych zdobywasz doświadczenie armii. Oznacza to, że możesz je zyskiwać, gdy twoje §Hbrygady§! biorą udział w bitwach lub gdy przekazujesz sprzęt sojusznikom w ramach §Hlend-lease§! na potrzeby prowadzonych przez nich wojen.\nDoświadczenie zdobywasz również poprzez przeprowadzanie §HĆwiczeń Armii§! z oddziałami, które są co najmniej na poziomie $UNIT_TRAINING_LEVEL|Y$, a także poprzez niektóre §HNarodowe Cele§!. Niektórzy §HMinistrowie§! mogą zwiększać zdobywane doświadczenie.\n\nDoświadczenie wojskowe jest potrzebne do tworzenia i modyfikowania §HSzablonów brygad§! oraz odblokowywania §HDoktryn§!."