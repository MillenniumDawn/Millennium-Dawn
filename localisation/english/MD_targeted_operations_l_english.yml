 TOP_redesign.1.t: "Protective Intelligence Warning"
 TOP_redesign.1.d: "Counterintelligence has detected foreign interest in a protected public figure. The evidence indicates warning tier [?TOP_pressure_notice_tier|0], but it does not reveal the exact foreign package, method, or timing. At the highest tier, analysts may identify a likely actor without creating public attribution."
