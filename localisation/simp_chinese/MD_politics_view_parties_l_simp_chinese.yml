 KUW.Vilayat_e_Faqih: "£generic_Vilayat_e_Faqih_small 全国伊斯兰联盟(NIA)"
 KUW.Vilayat_e_Faqih_desc: "（什叶派伊斯兰主义） - 全国伊斯兰联盟是科威特最主要的什叶派政治集团，其根源可追溯至科威特真主党。该党奉行伊朗的“法基赫监护”教义，但一直谨慎地避免与伊朗走得太近，并与科威特王室保持着友好关系。"
 KUW.Mod_Vilayat_e_Faqih: "£generic_Mod_Vilayat_e_Faqih_small 正义与和平联盟"
 KUW.Mod_Vilayat_e_Faqih_desc: "（设拉子什叶派伊斯兰主义） - 设拉子伊斯兰联盟的对应组织历来保持着亲政府的立场，并且像大多数其他设拉子政党一样，在政治和宗教上与霍梅尼领导的伊朗伊斯兰共和国保持距离。"
