 france_md.110.t: "Le référendum sur le statut de Mahoran"
 france_md.110.d: "Le peuple de Mayotte a décidé d'organiser un référendum pour déterminer son sort au sein de la République française. L'île de Mayotte fait partie de la République française depuis 1841, date à laquelle elle fut vendue à la France par l'ancien roi de Madagascar. Des élus locaux veulent solidifier leur rôle dans la République française en devenant officiellement partie de celle-ci, en cherchant l'indépendance, ou en rejoignant les Comores. Que faire ?"
 france_md.110.a: "Autoriser le référendum"
 france_md.110.b: "Rejeter le référendum"
 france_md.110.c: "Accordez-leur une autonomie limitée."
 france_md.111.t: "Résultats du référendum sur le statut de Mahoran"
 france_md.111.d: "Le référendum a finalement abouti et les résultats sont tombés. L'avenir de Mayotte repose désormais entre ces mains."
 france_md.111.a: "Perfection."
 france_md.505.t: "La proposition de fusion KMW-Nexter"
 france_md.505.d: "Les gouvernements de France et d'Allemagne finalisent un plan de fusion de Nexter Systems et Krauss-Maffei Wegmann en une seule holding de défense franco-allemande. Le consortium KANT qui en résulterait regrouperait les lignes de production du Leclerc et du Leopard 2 sous un même toit, créerait un portefeuille conjoint d'artillerie et de munitions, et ancrerait un futur programme de char de combat européen.\n\nLes ministres veulent une approbation politique avant le transfert d'actions."
 france_md.505.a: "Approuver la fusion"
 france_md.505.b: "Gardez Nexter indépendant"
 TT_FRA_knds_merge_carry_traits: "§YTous les traits déjà achevés chez Nexter seront transférés à la nouvelle organisation KNDS.§!"
 france_md.506.t: "Arquus : consolidation industrielle"
 france_md.506.d: "Les filiales de défense du groupe Volvo, Renault Trucks Defense et Panhard General Defense, ont achevé leur fusion en une seule entité. La nouvelle firme, Arquus, unit les plateformes de mobilité à roues de Renault à l'héritage de reconnaissance de Panhard et positionne la France comme concurrent unifié sur le marché européen des véhicules blindés. Les savoir-faire de production, programmes et modificateurs des deux firmes héritées sont transférés à la nouvelle organisation."
 france_md.506.a: "Un nouveau chapitre pour la mobilité blindée française"
 france_md.506_tt: "Renault et Panhard seront fusionnés dans Arquus"
 FRA_arguus_established: "Renault et Panhard ont été fusionnés dans Arquus en 2018"
 france_md.507.t: "Eurocopter devient Airbus Helicopters"
 france_md.507.d: "À compter d'aujourd'hui, le groupe Eurocopter est rebaptisé Airbus Helicopters, consolidant l'activité giravions d'EADS sous l'identité unifiée Airbus. Les usines de Marignane, de Donauwörth et les lignées héritées d'Aérospatiale opèrent désormais sous une même bannière."
 france_md.507.a: "Un nouveau chapitre pour les voilures tournantes européennes."
 TT_FRA_airbus_change_carry_traits: "§YTous les traits déjà achevés chez $FRA_eurocopter_manufacturer$ seront transférés à $FRA_airbus_manufacturer$§!"
 france_md.508.t: "DCNS devient Groupe Naval"
 france_md.508.d: "À compter d'aujourd'hui, l'arsenal d'État historique Direction des constructions navales, depuis longtemps rebaptisé DCNS, adopte la nouvelle identité Naval Group, marquant sa transformation en société privée à part entière. Les chantiers de Lorient, Cherbourg et Brest opèrent désormais sous une même bannière, aux côtés de la coentreprise Naviris avec Fincantieri et d'une relance à l'export autour du sous-marin de classe Suffren et de la frégate FDI Belharra."
 france_md.508.a: "Un nouveau chapitre pour la construction navale française."
 TT_FRA_naval_takeover_carry_traits: "§YTous les traits déjà achevés chez $FRA_dcn_manufacturer$ seront transférés à $FRA_naval_group_naval_manufacturer$§!"
 FRA_nexter_manufacturer: "GIAT Industries"
 FRA_nexter_merge: "Nexter a fusionné avec KMW en 2015"
 FRA_nexter_cold_war_legacy: "Héritage de la guerre froide"
 FRA_nexter_scorpion_programme: "Programme Scorpion"
 FRA_nexter_firepower_ammo: "Puissance de feu et munitions"
 FRA_nexter_manufacturer_trait: "Doctrine de puissance de feu CAESAR"
 FRA_nexter_manufacturer_trait_desc: "Des forges de l'arsenal de Bourges à l'obusier CAESAR monté sur camion, Nexter a bâti sa réputation sur une puissance de feu rapide et précise, livrée par des plateformes chenillées et à roues légères."
 FRA_nexter_leclerc_programme: "Programme Leclerc"
 FRA_nexter_leclerc_programme_desc: "Le Leclerc est le char de bataille phare de Nexter, développé dès la fin des années 1970 et entré en service en 1992. Son autoloader et son blindage modulaire ont fixé la norme de la doctrine blindée française."
 FRA_nexter_leclerc_mk2: "Leclerc Série 2"
 FRA_nexter_leclerc_mk2_desc: "La rénovation Série 2 a introduit la climatisation hybride, une électronique modernisée et des kits de blindage composite améliorés, prolongeant la vie de la plateforme jusque dans les années 2020."
 FRA_nexter_leclerc_xlr: "Modernisation Leclerc XLR"
 FRA_nexter_leclerc_xlr_desc: "La modernisation à mi-vie XLR a reconstruit le Leclerc autour d'une tourelleau téléopéré, de kits de blindage modulaires et de l'intégration SCORPION, le maintenant compétitif face aux MBT plus récents."
 FRA_nexter_vbci: "VBCI sur roues IFV"
 FRA_nexter_vbci_desc: "Le Véhicule Blindé de Combat d'Infanterie a donné à l'armée de Terre son premier VCI à roues moderne. La production a commencé en 2008 et la plateforme est devenue l'épine dorsale de la mobilité blindée des régiments motorisés."
 FRA_nexter_famas: "Fusil de service FAMAS"
 FRA_nexter_famas_desc: "Le fusil d'assaut bullpup FAMAS a été l'arme d'infanterie standard française à partir de 1981. La ligne d'armes légères de Nexter est née de sa production et des contrats de soutien."
 FRA_nexter_scorpion_core: "Combat intégré Scorpion"
 FRA_nexter_scorpion_core_desc: "Le programme Scorpion, formalisé en 2014, a mis en réseau la nouvelle famille de combat à roues de l'armée de Terre sous un système de gestion de combat commun et une ossature numérique."
 FRA_nexter_griffon: "VBMR Griffon"
 FRA_nexter_griffon_desc: "Le Griffon est le porteur tactique polyvalent à six roues de la famille Scorpion, remplaçant le VAB comme véhicule de transport de troupes blindé standard français."
 FRA_nexter_jaguar: "Jaguar EBRC"
 FRA_nexter_jaguar_desc: "Le Jaguar, véhicule de reconnaissance et de combat à six roues, emporte un canon CTA de 40 mm et des missiles Akeron MP, héritant des concepts de puissance de feu éprouvés sur le Leclerc."
 FRA_nexter_serval: "VBMR-L Serval"
 FRA_nexter_serval_desc: "Le Serval léger à quatre roues étend la mobilité Scorpion aux variantes forces spéciales, patrouille et commandement, avec une coque aluminium compacte."
 FRA_nexter_40cta: "Canon 40 CTA"
 FRA_nexter_40cta_desc: "Développé conjointement avec BAE Systems via CTA International, le canon télescopé de 40 mm offre une puissance antichar compacte à haute vitesse à toute la flotte Scorpion."
 FRA_nexter_caesar: "Plateforme CÉSAR 155 mm"
 FRA_nexter_caesar_desc: "L'obusier CAESAR de 155 mm monté sur camion allie mobilité stratégique et tir de précision à longue portée, devenant la plateforme d'artillerie d'export la plus réussie de Nexter."
 FRA_nexter_eurenco: "Propulseurs EURENCO"
 FRA_nexter_eurenco_desc: "EURENCO fournit les propergols, explosifs et matériaux énergétiques qui sous-tendent les munitions d'artillerie et d'armes légères françaises, liant la production de Nexter à une chaîne amont sécurisée."
 FRA_nexter_nbc_sys: "Kit CBRN NBC-Sys"
 FRA_nexter_nbc_sys_desc: "La filiale NBC-Sys est spécialisée dans la détection et la décontamination chimique, biologique, radiologique et nucléaire pour les forces françaises et à l'export."
 FRA_nexter_lu_family: "Visites familiales LU"
 FRA_nexter_lu_family_desc: "Les obus LU211 et la famille LU de 155 mm étendent la portée de l'artillerie par base bleed et aérodynamique améliorée, standardisant les feux longue portée sur les tubes compatibles OTAN."
 FRA_nexter_bonus: "BONUS Munitions intelligentes"
 FRA_nexter_bonus_desc: "L'obus BONUS de 155 mm à fusée capteur disperse des sous-munitions autoguidées contre les colonnes blindées, donnant à l'artillerie une capacité antichar de précision depuis des obusiers standard."
