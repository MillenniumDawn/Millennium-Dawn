 helicopter_operator_hull_4_desc: "Un porte-hélicoptères est un porte-avions qui sert principalement à transporter des hélicoptères, mais il est aussi souvent classé comme navire d'assaut amphibie ou porte-avions anti-sous-marin. Il est principalement utilisé pour les missions de l'aviation militaire, notamment la guerre anti-sous-marine, les opérations amphibies et l'appui aérien rapproché. Certains navires d'assaut amphibies disposent de quais conçus pour transporter des péniches de débarquement et ont la fonction de navires de débarquement à quai. Certains navires d'assaut amphibies sont conçus pour être équipés d'avions à voilure fixe à décollage et atterrissage verticaux afin de fournir un appui aérien rapproché plus puissant pour les opérations amphibies que les hélicoptères d'attaque, et ont la fonction de porte-avions légers."
 aircraft_carrier_engineering: "Ingénierie de Porte-Avions"
 aircraft_carrier_engineering_desc: "La capacité de construire des porte-avions est d'une grande importance pour opérer des flottes de grande envergure."
 carrier_hull_1: "Coque de Porte-Avions 1965"
 carrier_hull_1_desc: "Ces bases aériennes flottantes sont le summum de la puissance navale, capables de s'étendre dans les océans du monde entier pour projeter la puissance d'une nation sur le globe entier. Symboles du sang et du trésor d'une nation forte, ces atouts incroyablement précieux doivent être protégés à tout prix. Avec une vaste portée, ils nécessitent un véritable groupe de combat « en haute mer » pour leur permettre de remplir toute leur gamme de capacités opérationnelles en mer. Tout pays disposant d'un groupe de combat aéronaval pleinement opérationnel peut être vraiment fier de ce que représente sa marine et de la puissance terrifiante qu'elle exerce. Ils sont généralement utilisés pour : la projection de puissance au loin, la guerre aérienne, la guerre de surface, la guerre amphibie."
