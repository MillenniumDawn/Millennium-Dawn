 medium_tank_aa_chassis_0: "1세대 자주대공포 차체"
 medium_tank_aa_chassis_0_desc: "자주 대공 무기는 이동식 대공 무기라고도 하며, 대공 기관총, 대공포 또는 지대공 미사일을 군용 차량에 탑재한 기동형 대공 무기를 가리킵니다. 자주 대공포(자주식 대공포), 자주 대공 미사일 발사기, 자주 복합 미사일·포 대공 체계로 나눌 수 있습니다."
 medium_tank_aa_chassis_1: "2/3세대 자주대공포 차체"
