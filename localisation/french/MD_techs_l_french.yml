 nsb_rocket_pods_tech_1: "Nacelles de roquettes de 1ère génération"
 nsb_rocket_pods_tech_1_desc: "Les nacelles de roquettes d'hélicoptère sont des lanceurs externes fixés aux hélicoptères, permettant le déploiement de roquettes non guidées ou guidées pour diverses missions de combat. Ces nacelles améliorent considérablement la puissance de feu d'un hélicoptère, permettant un engagement efficace des cibles au sol, la suppression des positions ennemies et les opérations de soutien aérien rapproché."
