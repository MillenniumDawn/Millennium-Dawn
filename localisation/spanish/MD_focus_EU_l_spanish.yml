 EU_mff_draft_mission_desc: "Durante las negociaciones, todos los estados miembros pueden invertir poder político para cambiar el borrador a su concepción. Los cambios en el borrador influirán en la visión de los grupos políticos del Parlamento Europeo sobre el borrador."
