name: Rework
description: Propose rebuilding existing country or system content.
title: "[REWORK] "
labels: [type:rework]
type: task
body:
  - type: markdown
    attributes:
      value: |
        Reworks are claimed through the council. Fill this in so the wish lands on the board with the right region and scope. Leave assignees empty; the council assigns after triage.
  - type: input
    id: target
    attributes:
      label: Target
      description: Country tag or system name.
      placeholder: FRA
    validations:
      required: true
  - type: dropdown
    id: region
    attributes:
      label: Region
      options:
        - Africa
        - Latin America
        - East Asia
        - Middle East
        - Europe
        - Other
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is wrong with the current content.
    validations:
      required: true
  - type: checkboxes
    id: scope
    attributes:
      label: Scope
      description: What the rework should touch.
      options:
        - label: Focus tree
        - label: Ideas and national spirits
        - label: Decisions
        - label: Events
        - label: Order of battle
        - label: Characters and leaders
        - label: Namelists
        - label: AI strategy
        - label: Graphics
        - label: Localisation
  - type: dropdown
    id: tagteam
    attributes:
      label: Tagteam
      description: Reworks may be built by two developers.
      options:
        - Solo
        - Looking for a partner
        - Already have a partner
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Context
      description: Sources, design notes, and why this rework now.
