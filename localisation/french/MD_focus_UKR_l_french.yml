 ukraine_modernize_sov_equipment_btr_60_modernization_bulgaria_btr_60d: "Ask [BUL.GetNameWithFlag] §YBulgaria§! for its old §YBTR-60PB§!"
 ukraine_modernize_sov_equipment_btr_60_modernization_bulgaria_btr_60d_desc: "\n\n\n\n\n\n£UKR_desctext_modernize_sov_btr60d_for_tooltip\n\n\n\n\n\n\n\n\n§WThe war with Russia eats through our armored vehicles. §YBulgaria§! still keeps old §YBTR-60PB§! in storage and is ready to hand them over as military aid. We can put them into service as they are, or overhaul them at home and replace their worn §YGAZ-40P§! gasoline engines with two German §YDeutz BF4M2012§! diesels and a new gearbox. That upgrade is the §YBTR-60D§!.§!"
 ukraine_modernize_sov_equipment_btr_60_modernization.6.name: "First BTR-60PB from Bulgaria"
 ukraine_modernize_sov_equipment_btr_60_modernization.6.desc: "§YBulgaria§! is ready to send us the first §Y20§! BTR-60PB from its storage, if it still has them. They are old and worn, but they still float, run and can carry a squad. We can send them to the front right away, or first overhaul them and fit Deutz diesels."
 ukraine_modernize_sov_equipment_btr_60_modernization.6.a: "Put them into service as they are"
 ukraine_modernize_sov_equipment_btr_60_modernization.6.b: "Overhaul them into the §YBTR-60D§!"
 ukraine_modernize_sov_equipment_btr_60_modernization.6.c: "Bulgaria has no more to spare"
 ukraine_modernize_sov_equipment_btr_60_modernization.7.name: "First BTR-60D Delivered"
 ukraine_modernize_sov_equipment_btr_60_modernization.7.desc: "Our repair plants have finished the first §Y20§! §YBTR-60D§!. Two Deutz BF4M2012 diesels of 102 hp each replaced the old GAZ-40P gasoline engines, so the vehicles are more reliable and a little more powerful. The first ones are going to a mechanized brigade."
 ukraine_modernize_sov_equipment_btr_60_modernization.7.a: "Send them to the front"
 ukraine_modernize_sov_equipment_btr_60_modernization.8.name: "Next BTR-60PB Batch from Bulgaria"
 ukraine_modernize_sov_equipment_btr_60_modernization.8.desc: "§YBulgaria§! is ready to send us another §Y40§! BTR-60PB from its storage, if it still has them. Again, we can use them as they are, or overhaul them into the §YBTR-60D§!. Our plants already know the work, so it goes faster."
 ukraine_modernize_sov_equipment_btr_60_modernization.8.a: "Put them into service as they are"
 ukraine_modernize_sov_equipment_btr_60_modernization.8.b: "Overhaul them into the §YBTR-60D§!"
 ukraine_modernize_sov_equipment_btr_60_modernization.8.c: "$ukraine_modernize_sov_equipment_btr_60_modernization.6.c$"
 ukraine_modernize_sov_equipment_btr_60_modernization.9.name: "BTR-60D Batch Delivered"
 ukraine_modernize_sov_equipment_btr_60_modernization.9.desc: "Another §Y40§! §YBTR-60D§! have left our repair plants with new Deutz diesels and gearboxes."
 ukraine_modernize_sov_equipment_btr_60_modernization.9.a: "Send them to the front"
