 SIA.neutral_Social_icon_2: "£SIA_neutral_Social_2"
 SIA.Nat_Fascism_icon: "£SIA_Nat_Fascism"
 GRE.Western_Autocracy: "£generic_Western_Autocracy_small (POLAN) - 政治之春"
 GRE.Western_Autocracy_desc: "（民族保守主义） - 政治之春\n\n政治之春党由安东尼斯·萨马拉斯于1993年6月创立。此前，由于萨马拉斯在马其顿国名争议中采取极端立场，新民主党解除了他的外交部长职务。该党在1993年10月的选举中获得4.88%的选票和10个席位，分裂了右翼阵营，并将政府拱手让给了安德烈亚斯·帕潘德里欧。1994年，该党的得票率达到顶峰，为8.65%，并赢得两个欧洲议会席位。1996年和1999年，该党得票率均低于当选门槛。自2000年起，该党转而支持新民主党。2004年5月，萨马拉斯重返新民主党后，该党解散。"
 GRE.Conservative: "£generic_Conservative_small (LAOS) - 民众东正教集会"
 GRE.Conservative_desc: "（民族保守主义） - 人民东正教阵线\n\n电视记者乔治·卡拉扎费里斯于2000年9月被新民主党开除后创立了希腊反种族隔离联盟。该联盟融合了希腊民族主义、东正教宗教保守主义、本土主义和疑欧主义。2004年，人民东正教阵线赢得欧洲议会席位；2007年，该联盟以3.8%的支持率进入议会；2009年，其支持率达到顶峰，为5.63%，并拥有15个议席。在此过程中，人民东正教阵线吸收了马基斯·沃里迪斯领导的希腊阵线。然而，2011年11月，人民东正教阵线加入帕帕季莫斯领导的全国团结政府；2012年2月，由于第二次备忘录的争议，人民东正教阵线退出联合政府，导致其迅速衰落：同年5月，其支持率跌至2.9%，并将部分席位拱手让给了金色黎明党。"
 GRE.Autocracy: "£generic_Autocracy_small (KKE m-l) - 希腊共产党（马列主义派）"
 GRE.Autocracy_desc: "（毛泽东思想） - 希腊共产党（马列主义派）\n\n希腊共产党（马克思列宁主义派）源于1976年11月希腊马克思列宁主义者组织的分裂，而该组织本身又是1964年因苏联修正主义问题从希腊共产党分裂出来的。分裂后的两个派别中，马克思列宁主义派占据了较大的一个。该党信奉马克思列宁主义毛泽东思想，带有斯大林主义和霍查主义色彩，并持强烈的疑欧立场。该党出版《无产阶级旗帜》报，其支持者主要来自约阿尼纳、塞萨洛尼基、克里特岛和爱琴海东部岛屿。自2012年以来，该党通常与竞争对手希腊共产党（马克思列宁主义派）联合竞选，两党联合竞选的最佳成绩是2012年5月的0.25%。"
 GRE.Neutral_Muslim_Brotherhood: "£muslim_brotherhood_small (DEB) - 友谊、平等与和平党"
 GRE.Neutral_Muslim_Brotherhood_desc: "（少数民族地区主义） - 友谊、平等与和平党\n\n友谊、平等与和平党是西色雷斯地区土耳其裔穆斯林少数族裔的唯一合法政党，由医生兼独立议员萨迪克·艾哈迈德于1991年9月创立，自2019年起由齐格德姆·阿萨福格卢领导。该党纲领以世俗的凯末尔主义传统而非宗教传统为基础，倡导少数族裔权利和地区主义，并且是欧洲自由联盟的观察员成员。尽管友谊、平等与和平党在2019年欧洲议会选举中分别在罗多彼选区和克桑西选区获得了38%和25%的选票，但由于全国3%的得票门槛，它仍然无法进入议会；少数族裔议员只能通过泛希腊社会主义运动和新民主党的名单进入议会。"
 GRE.Neutral_Autocracy: "£generic_Neutral_Autocracy_small (NIKI) - 胜利"
 GRE.Neutral_Autocracy_desc: "（宗教保守主义） - 胜利\n\n神学家迪米特里斯·纳齐奥斯于2019年6月在塞萨洛尼基创立了尼基党，以反对普雷斯帕协议，其竞选口号是“信仰、祖国、家庭”。该党信奉东正教原教旨主义，立场极端保守，反对堕胎、性教育和强制接种疫苗，并主张希腊保持中立，反对向乌克兰提供军事援助。该党在2023年6月的选举中获得了3.69%的选票和10个席位，在2024年获得了4.37%的选票和1个无党派欧洲议会议员席位。然而，在2025年5月，45名党员辞职，指责纳齐奥斯的意识形态偏离正轨，且党内缺乏民主。"
 GRE.oligarchism: "£generic_oligarchism_small (SEV) - 希腊企业联合会"
 GRE.oligarchism_desc: "（雇主利益） - 希腊企业联合会\n\n希腊企业联合会并非政党，而是希腊雇主的最高联合会，成立于1907年，前身为希腊工业联合会，如今代表着希腊约700家最大的企业。它是欧洲商业协会的希腊成员，也是集体谈判中公认的社会伙伴，这使其在劳动法、私有化和产业政策等领域拥有举足轻重的地位。在危机时期，它始终支持各项备忘录，并积极推动劳动力市场自由化，使其成为希腊商业界最具代表性的机构代言人。"
 GRE.Neutral_Libertarian: "£generic_Neutral_Libertarian_small (DRASI) - 行动"
 GRE.Neutral_Libertarian_desc: "（古典自由主义） - 行动\n\n斯特凡诺斯·马诺斯曾任康斯坦丁诺斯·米佐塔基斯政府时期的经济部长，也是早期自由党的创始人。他于2009年创立了行动党，该党奉行古典自由主义纲领，主张建立一个规模小、灵活运作的政府，并通过公共资产私有化来偿还债务。行动党从未进入议会，最接近进入议会的一次是在2012年5月，当时它与自由联盟和重建希腊党联合组成联合名单，获得了1.8%的选票。后来，在西奥多罗斯·斯凯拉卡基斯的领导下，行动党于2017年1月并入新民主党，并于2019年正式解散。"
 GRE.Neutral_green: "£generic_Neutral_green_small (OP) - 生态绿党"
 GRE.Neutral_green_desc: "（环保主义） -生态绿党\n\n生态绿党成立于2002年12月，致力于可持续发展、社会正义、非暴力和参与式民主，长期以来一直是欧洲绿党的希腊成员。在2009年欧洲议会选举中，该党以3.49%的得票率将米哈利斯·特雷莫普洛斯送入斯特拉斯堡，这是希腊绿党迄今为止赢得的唯一一次全国性席位。2012年5月，该党以微弱劣势未能进入议会。自2015年起，该党加入激进左翼联盟的候选名单，成功进入议会并提供了一位候补环境部长，但在2023年6月，其得票率跌至0.40%。"
 GRE.neutral_Social: "£generic_neutral_Social_small (MeRA25) - 欧洲现实主义不服从阵线"
 GRE.neutral_Social_desc: "（民主社会主义） - 欧洲现实主义不服从阵线\n\n2015年希腊与债权人对抗期间的财政部长亚尼斯·瓦鲁法基斯于2018年3月创立了欧洲现实主义不服从阵线，作为泛欧运动欧洲民主运动2025的希腊选举分支。该党主张左翼欧洲主义，反对的是三驾马车而非欧盟本身，并提出工作场所民主、公共银行、绿色产业政策和全民基本收入等主张，同时反对外国在希腊设立基地。欧洲现实主义不服从阵线于2019年7月以3.44%的得票率和9个席位进入议会，但在2023年5月跌破门槛，随后与人民团结党组成“分裂联盟”参加2023年6月的选举。"
 GRE.Neutral_Communism: "£generic_Neutral_Communism_small (ANTARSYA) - 反资本主义左翼推翻政权合作组织"
 GRE.Neutral_Communism_desc: "（革命社会主义） - 反资本主义左翼推翻政权合作组织\n\n反资本主义左翼推翻政权合作组织成立于2009年3月，由激进左翼阵线和联合反资本主义左翼合并而成，至今仍是涵盖托洛茨基主义和革命共产主义等多个思潮的七个组织的联合阵线。该组织要求退出欧盟和欧元区，拒绝偿还债务，并要求无偿国有化，其立场与左翼激进联盟针锋相对。反资本主义左翼推翻政权合作组织从未在议会中拥有席位，在2012年5月的选举中得票率最高仅为1.19%，但其在学生会、教师工会和医院工会中的影响力却远远超过其得票率。"
 GRE.Nat_Populism: "£generic_Nat_Populism_small (EL) - 希腊解决方案"
 GRE.Nat_Populism_desc: "（右翼民粹主义） - 希腊解决方案\n\n基里亚科斯·韦洛普洛斯曾是新民主党和人民东正教阵线党的议员，以深夜电视推销而闻名。他于2016年6月创立了希腊解决方案党，该党以极端民族主义、东正教传统主义、反对移民和疑欧主义为纲领。该党于2019年5月赢得欧洲议会席位，并在几周后以3.7%的得票率和10个席位进入议会，在2023年的两次选举中保持了约4.5%的得票率。2024年，该党得票率翻番至9.3%，并赢得两个欧洲议会席位，成为希腊民族主义右翼最大的政党；它与欧洲保守派和改革派结盟。"
 GRE.Nat_Fascism_alt: "£generic_Nat_Fascism_small (SPAR) - 斯巴达"
 GRE.Nat_Fascism_alt_desc: "（新法西斯主义） - 斯巴达\n\n斯巴达党由瓦西里斯·斯蒂格卡斯于2017年12月注册成立，但在2023年之前一直处于休眠状态。在法院禁止伊利亚斯·卡西迪亚里斯领导的希腊民族党参选后，斯巴达党成为金色黎明残余势力的工具。2023年6月，身陷囹圄的卡西迪亚里斯通过视频背书，使斯巴达党获得了4.68%的选票和12个议席。随后，最高法院取消了斯巴达党参加2024年欧洲议会选举的资格。2025年6月，特别最高法院以欺骗选民、隐瞒党内真正领导人为由，取消了斯蒂格卡斯和其他两名候选人的议席，并下令不得更换候选人。剩余的议席数量低于组建议会党团的门槛。"
 UKR.Western_Autocracy_2007: "£UKR_western_autocracy (PZV) - 祖国保卫者党"
 UKR.Western_Autocracy_2007_icon: "£UKR_western_autocracy"
 UKR.Western_Autocracy_2007_desc: "（法律与秩序保守主义）- 祖国保卫者党\n\n祖国保卫者党是一个亲西方的、奉行军国主义的维护法律和秩序的政党，由东正教律师尤里·卡尔马津创立。"
 UKR.Western_Autocracy_2014: "£UKR_western_autocracytwo (NF) - 人民阵线"
 UKR.Western_Autocracy_2014_icon: "£UKR_western_autocracytwo"
 UKR.Western_Autocracy_2014_desc: "（大西洋民族主义）- 人民阵线\n\n人民阵线是阿尔谢尼·亚采纽克、奥列克桑德·图尔奇诺夫和阿尔森·阿瓦科夫在独立广场运动之后成立的政党：奉行强硬的亲西方路线和安全至上的政治。"
 UKR.Western_Autocracy_2019: "£ukr_syla_i_chest (SICH) - 力量与荣耀"
 UKR.Western_Autocracy_2019_icon: "£ukr_syla_i_chest"
 UKR.Western_Autocracy_2019_desc: "（安全保守主义）- 力量与荣耀\n\n“力量与荣耀”党是乌克兰前安全局局长伊戈尔·斯梅什科的政党，该党以安全为先，奉行欧洲-大西洋路线。"
 UKR.conservatism_2001: "£UKR_our_ukraine (NU) - 维克托·尤先科的“我们的乌克兰”集团"
 UKR.conservatism_2001_icon: "£UKR_our_ukraine"
 UKR.conservatism_2001_desc: "（民族民主主义）- 维克托·尤先科的“我们的乌克兰”集团\n\n维克托·尤先科的“我们的乌克兰”联盟是根据乌克兰人民运动第十二届代表大会于2001年12月8日通过的决议成立的，该联盟由十个民族民主和自由主义政党联合组成，围绕着被解职的总理尤先科而成立。该联盟在2002年的选举中以23.6%的得票率位居第一。"
 UKR.conservatism_2005: "£UKR_our_ukraine (NSNU) - 人民联盟“我们的乌克兰”"
 UKR.conservatism_2005_icon: "£UKR_our_ukraine"
 UKR.conservatism_2005_desc: "（自由保守主义）- 我们的乌克兰\n\n我们的乌克兰是维克托·尤先科的政党，也是橙色革命的政治载体：温和的民族主义者、自由主义者和保守主义者，以欧洲-大西洋为平台。"
 UKR.conservatism_2014: "£ukr_solidarity (BPP) - 彼得·波罗申科的“团结”联盟"
 UKR.conservatism_2014_icon: "£ukr_solidarity"
 UKR.conservatism_2014_desc: "（自由保守主义）- 彼得·波罗申科的“团结”联盟\n\n彼得·波罗申科领导的“团结”联盟赢得了2014年的选举，成为总统执政党，其竞选纲领包括欧洲一体化、权力下放和军队重建。"
 UKR.conservatism_2019: "£ukr_yes (YES) - 欧洲团结党"
 UKR.conservatism_2019_icon: "£ukr_yes"
 UKR.conservatism_2019_desc: "（民族自由保守主义）- 欧洲团结党\n\n欧洲团结党是更名后的波罗申科集团，自2019年以来一直是议会的主要反对派，其立场强硬，奉行反俄、欧洲-大西洋路线。"
 UKR.liberalism_2010: "£ukr_front_zmin (FZ) - 变革阵线"
 UKR.liberalism_2010_icon: "£ukr_front_zmin"
 UKR.liberalism_2010_desc: "（自由改革主义）- 变革阵线\n\n变革阵线是阿尔谢尼·亚采纽克的自由改革主义项目，是在他2010年竞选总统后在技术官僚、亲欧洲的平台上建立的。"
 UKR.liberalism_2012: "£ukr_udar (UDAR) - 乌克兰民主改革联盟"
 UKR.liberalism_2012_icon: "£ukr_udar"
 UKR.liberalism_2012_desc: "（反腐败自由主义）- 乌克兰民主改革联盟\n\n维塔利·克利奇科领导的乌克兰民主改革联盟于2012年以14%的支持率进入议会，其纲领是反腐败、亲欧洲，并成为独立广场运动的三大反对派领导人之一。"
 UKR.liberalism_2014: "£ukr_samopomich (SAMO) - 自力更生党"
 UKR.liberalism_2014_icon: "£ukr_samopomich"
 UKR.liberalism_2014_desc: "（基督教民主主义）- 自力更生党\n\n自力更生党是利沃夫市长安德烈·萨多维的政党，这是一个以权力下放和市政自治为基础的基督教民主力量，在2014年获得了第三名。"
 UKR.liberalism_2019: "£ukr_golos (HOL) - 民意党"
 UKR.liberalism_2019_icon: "£ukr_golos"
 UKR.liberalism_2019_desc: "（反腐败自由主义）- 民意党\n\n民意党是由音乐家斯维亚托斯拉夫·瓦卡尔丘克创立的年轻的自由主义反腐败政党，于2019年以5.8%的得票率进入议会。"
 UKR.socialism_byut: "£ukr_fatherland (BYT) - 尤利娅·季莫申科集团"
 UKR.socialism_byut_icon: "£ukr_fatherland"
 UKR.socialism_byut_desc: "（民粹社会民主主义）- 尤利娅·季莫申科集团\n\n尤利娅·季莫申科集团是以祖国党为核心建立的选举联盟，祖国党是主要的反库奇马反对派力量，后来成为橙色联盟的核心。"
 UKR.socialism_2012: "£ukr_fatherland (BAT) - 全乌克兰联盟‘祖国’党"
 UKR.socialism_2012_icon: "£ukr_fatherland"
 UKR.socialism_2012_desc: "（民粹社会民主主义）- 全乌克兰联盟“祖国”\n\n2013 年，该联盟解散后，“祖国党”恢复了其原名，并吸收了“变革阵线”和“改革与秩序党”。"
 UKR.anarchist_communism_2008: "£ukr_livi_syly (SLS) - 左翼力量联盟"
 UKR.anarchist_communism_2008_icon: "£ukr_livi_syly"
 UKR.anarchist_communism_2008_desc: "（左翼民粹主义）- 左翼力量联盟\n\n由前潜艇兵瓦西里·沃尔哈创立的左翼力量联盟脱离了社会党，并以摧毁寡头阶级为目标开展运动。"
 UKR.anarchist_communism_2015: "£ukr_social_movement (SR) - 社会运动"
 UKR.anarchist_communism_2015_icon: "£ukr_social_movement"
 UKR.anarchist_communism_2015_desc: "（民主社会主义）- 社会运动\n\n社会运动是一个成立于2015年的民主社会主义工会组织，反对寡头资本主义和俄罗斯帝国主义。"
 UKR.Conservative_2014: "£ukr_opp_block (OB) - 反对派联盟"
 UKR.Conservative_2014_icon: "£ukr_opp_block"
 UKR.Conservative_2014_desc: "（亲俄保守主义）- 反对派联盟\n\n反对派联盟是独立广场革命后地区党的主要继承者，它联合了地区党幸存的议员和商业团体。"
 UKR.Conservative_2018: "£ukr_opposition (OPZZ) - 反对党平台-为了生活"
 UKR.Conservative_2018_icon: "£ukr_opposition"
 UKR.Conservative_2018_desc: "（亲俄保守主义）- 反对派平台 - 为了生命\n\n“反对派平台 - 为了生命”是梅德韦丘克-博伊科对亲俄阵营的重新包装，该阵营在2019年排名第二，是最大的反对派派别。"
 UKR.Conservative_banned: "£ukr_opposition (OPZZ) - 反对派平台-为了生活（被禁）"
 UKR.Conservative_banned_icon: "£ukr_opposition"
 UKR.Conservative_banned_desc: "（亲俄保守主义）- 反对派平台 - 为了生命（被禁）\n\n反对派平台- 为了生命，在俄罗斯全面入侵后，于2022年6月20日被法院裁定取缔。"
 UKR.Autocracy_2012: "£ukr_vybir (UV) - 乌克兰的选择"
 UKR.Autocracy_2012_icon: "£ukr_vybir"
 UKR.Autocracy_2012_desc: "（欧亚联邦主义）- 乌克兰的选择\n\n乌克兰的选择是维克托·梅德韦丘克的竞选纲领，主张不结盟、联邦化以及与俄罗斯主导的关税同盟融合。"
 UKR.Autocracy_2019: "£ukr_shariy (PSH) - 沙里党"
 UKR.Autocracy_2019_icon: "£ukr_shariy"
 UKR.Autocracy_2019_desc: "（亲俄民粹主义）- 沙里党\n\n沙里党是博主阿纳托利·沙里的政党，开展了一场以网络为主导的亲俄民粹主义运动，在2019年获得了2.2%的选票。"
 UKR.Autocracy_banned: "£ukr_shariy (PSH) - 沙里党（被禁）"
 UKR.Autocracy_banned_icon: "£ukr_shariy"
 UKR.Autocracy_banned_desc: "（亲俄民粹主义）- 沙里党（被禁）\n\n2022年6月16日，法院裁定沙里党为非法组织；2022年9月6日，最高法院维持了该禁令。"
 UKR.Neutral_Muslim_Brotherhood_2014: "£ukr_mejlis (MEJ) - 克里米亚鞑靼人民议会"
 UKR.Neutral_Muslim_Brotherhood_2014_icon: "£ukr_mejlis"
 UKR.Neutral_Muslim_Brotherhood_2014_desc: "（克里米亚鞑靼民族主义）- 克里米亚鞑靼人民议会\n\n克里米亚鞑靼人民议会是克里米亚鞑靼人的代表机构，亲乌克兰，于2016年被占领当局以极端主义为由取缔。"
 UKR.Neutral_Autocracy_2004: "£ukr_neitralitet (PDN) - 乌克兰国家中立党"
 UKR.Neutral_Autocracy_2004_icon: "£ukr_neitralitet"
 UKR.Neutral_Autocracy_2004_desc: "（武装中立主义）- 乌克兰国家中立党\n\n乌克兰国家中立党是一个边缘政党，其全部纲领是永久不结盟。"
 UKR.Neutral_Autocracy_2010: "£ukr_sylna (SU) - 强大的乌克兰"
 UKR.Neutral_Autocracy_2010_icon: "£ukr_sylna"
 UKR.Neutral_Autocracy_2010_desc: "（技术官僚中间主义）- 强大的乌克兰\n\n强大的乌克兰是谢尔盖·季希普科在2010年总统选举中获得第三名后提出的技术官僚项目，承诺以高效的管理取代意识形态。"
 UKR.Neutral_Autocracy_2012: "£ukr_radiakl (RPL) - 奥列格·利亚什科激进党"
 UKR.Neutral_Autocracy_2012_icon: "£ukr_radiakl"
 UKR.Neutral_Autocracy_2012_desc: "（农业民粹主义）- 奥列格·利亚什科激进党\n\n奥列格·利亚什科激进党在2014年获得第三名，该党融合了农业民粹主义、民族主义和反寡头政治。"
 UKR.Neutral_Autocracy_2020: "£ukr_rozumna (RS) - 合理力量运动"
 UKR.Neutral_Autocracy_2020_icon: "£ukr_rozumna"
 UKR.Neutral_Autocracy_2020_desc: "（不结盟技术官僚体制）- 合理力量运动\n\n合理力量运动主张严格奉行不结盟政策 - 既不加入北约，也不加入欧亚联盟 - 并主张建立技术官僚政府。"
 UKR.Neutral_conservatism_2001: "£UKR_emerging_kuchma (ZEDU) - 为了统一的乌克兰！"
 UKR.Neutral_conservatism_2001_icon: "£UKR_emerging_kuchma"
 UKR.Neutral_conservatism_2001_desc: "（行政中间主义）- 为了统一的乌克兰！\n\n为了统一的乌克兰！是由五个政党组成的选举联盟，于2001年11月围绕库奇马总统组建，参加2002年的选举，该联盟依靠行政资源而非意识形态维系在一起。"
 UKR.Neutral_conservatism_2005: "£ukr_lytvyn (NP) - 人民党（利特温集团）"
 UKR.Neutral_conservatism_2005_icon: "£ukr_lytvyn"
 UKR.Neutral_conservatism_2005_desc: "（农业中间主义）- 人民党\n\n弗拉基米尔·利特温领导的人民党是典型的乌克兰中间派掮客：根植于农业，没有明确的外交政策路线，并且是决定2007年联合政府的摇摆选票。"
 UKR.Neutral_conservatism_2015: "£ukr_nasha_kraina (NKR) - 我们的土地"
 UKR.Neutral_conservatism_2015_icon: "£ukr_nasha_kraina"
 UKR.Neutral_conservatism_2015_desc: "（区域管理主义）- 我们的土地\n\n我们的土地是由前地区党官员建立的地方“商业经理”网络，在南部和东部的州议会中实力雄厚。"
 UKR.Neutral_conservatism_2020: "£ukr_propozytsiya (PRO) - 主张"
 UKR.Neutral_conservatism_2020_icon: "£ukr_propozytsiya"
 UKR.Neutral_conservatism_2020_desc: "（市政权力下放）- 主张党\n\n主张党是2020年地方选举前成立的市长联盟，旨在推动权力下放和市政利益对抗中央政府。"
 UKR.oligarchism_2008: "£ukr_yedynyi_tsentr (YETS) - 联合中心"
 UKR.oligarchism_2008_icon: "£ukr_yedynyi_tsentr"
 UKR.oligarchism_2008_desc: "（区域寡头主义）- 联合中心党\n\n联合中心党是维克托·巴洛哈（尤先科书记处主任）的政党，也是通过家族和商业网络控制外喀尔巴阡地区的政治机器。"
 UKR.oligarchism_2015: "£ukr_vidrodzhennia (VID) - 复兴党"
 UKR.oligarchism_2015_icon: "£ukr_vidrodzhennia"
 UKR.oligarchism_2015_desc: "（商业寡头主义）- 复兴党\n\n复兴党是由维塔利·霍穆廷尼克和科洛莫伊斯基圈子领导的商业利益集团组成的议会团体，完全由单届议员组成。"
 UKR.oligarchism_2019: "£ukr_za_maybutnie (ZM) - 为了未来"
 UKR.oligarchism_2019_icon: "£ukr_za_maybutnie"
 UKR.oligarchism_2019_desc: "（农业寡头主义）- 为了未来\n\n为了未来是伊戈尔·帕利齐亚的项目，这是一个由科洛莫伊斯基圈资助的农业区域团体，在沃伦和伊万诺-弗兰科夫斯克实力雄厚。"
 UKR.Neutral_Libertarian_2007: "£ukr_yabluko (PVD) - 自由民主党"
 UKR.Neutral_Libertarian_2007_icon: "£ukr_yabluko"
 UKR.Neutral_Libertarian_2007_desc: "（小企业自由主义）- 自由民主党\n\n自由民主党是谢尔盖·奥达里奇领导下的亚布卢科党的更名版本，保留了同样的小企业自由主义纲领，但没有外交政策路线。"
 UKR.Neutral_Libertarian_2014: "£ukr_five_ten (510) - 5.10自由意志党"
 UKR.Neutral_Libertarian_2014_icon: "£ukr_five_ten"
 UKR.Neutral_Libertarian_2014_desc: "（自由意志主义）- 5.10自由意志党\n\n亨纳季·巴拉绍夫领导的5.10党是乌克兰唯一一个始终坚持自由主义的政党，其竞选纲领是实行5%的统一所得税和10%的增值税。"
 UKR.Neutral_green_2015: "£ukr_ukrop (UOP) - 乌克兰爱国者协会"
 UKR.Neutral_green_2015_icon: "£ukr_ukrop"
 UKR.Neutral_green_2015_desc: "（环保民族主义）- 乌克兰爱国者协会\n\n乌克兰爱国者协会将绿色农业议程与乌克兰民族主义和对志愿营的支持结合起来。"
 UKR.Neutral_green_2020: "£ukr_greens (PZU) - 乌克兰绿党"
 UKR.Neutral_green_2020_icon: "£ukr_greens"
 UKR.Neutral_green_2020_desc: "（环保主义）- 乌克兰绿党\n\n乌克兰绿党在乌克兰人民党解散后重新崛起，成为唯一幸存的环保主义政党。"
 UKR.neutral_Social_2019: "£ukr_justice (PPL) - 谢尔盖·卡普林的普通人党"
 UKR.neutral_Social_2019_icon: "£ukr_justice"
 UKR.neutral_Social_2019_desc: "（社会民粹主义）- 谢尔盖·卡普林的普通人党\n\n谢尔盖·卡普林领导的普通人党是乌克兰独立左翼在社会主义党被亲俄政客接管后所剩无几的残余力量。"
 UKR.Neutral_Communism_banned: "£UKR_neutral_communism (SKU) - 乌克兰共产党人联盟（被禁）"
 UKR.Neutral_Communism_banned_icon: "£UKR_neutral_communism"
 UKR.Neutral_Communism_banned_desc: "（反修正马克思列宁主义）- 乌克兰共产党人联盟（被禁）\n\n2015年9月30日，该党与其他一些小共产党一起，根据去共产主义化法律被法院解散。"
 UKR.Nat_Populism_2004: "£ukr_freedom (SVOB) - 全乌克兰联盟‘自由’"
 UKR.Nat_Populism_2004_icon: "£ukr_freedom"
 UKR.Nat_Populism_2004_desc: "（极右民族主义）- 全乌克兰联盟‘自由’\n\n全乌克兰联盟“自由党”是奥列格·季亚尼博克领导下的全乌克兰民族联盟的更名版本，该联盟将极右翼政治主流化，在2012年获得了10.4%的选票。"
 UKR.Nat_Fascism_2014: "£ukr_right_sector (PS) - 右翼组织"
 UKR.Nat_Fascism_2014_icon: "£ukr_right_sector"
 UKR.Nat_Fascism_2014_desc: "（激进民族主义）- 右翼组织\n\n右翼组织由独立广场运动的激进派系在德米特罗·亚罗什的领导下发展而来，并在顿巴斯地区组建了自己的志愿军。"
 UKR.Nat_Fascism_2016: "£ukr_national_corps (NK) - 国民军团"
 UKR.Nat_Fascism_2016_icon: "£ukr_national_corps"
 UKR.Nat_Fascism_2016_desc: "（社会民族主义）- 国民军团\n\n国民军团是亚速老兵的政治分支，由安德烈·比列茨基领导，它将社会民族主义与街头组织相结合。"
 ADO.conservatism_2011: "£generic_conservatism_small (DA) - 安道尔民主党"
 ADO.conservatism_2011_desc: "（自由保守主义）- 安道尔民主党\n\n安道尔民主党成立于2011年2月22日，是自由党和新中心党组成的改革联盟的继承者。在安东尼·马蒂的领导下，该党在当年春季的28个议席中赢得了20席，这是自1993年宪法颁布以来最大的多数席位。此后，该党一直执政，先是在马蒂的领导下，后于2019年由哈维尔·埃斯波特接任。该党以银行业改革和与欧盟谈判联系国协定为政纲，标榜自身为稳定和健全公共财政的代表。然而，随着每次选举的进行，该党的多数席位都在减少。自2019年以来，该党一直依靠联盟伙伴执政，但没有其他政党能够真正取代其作为执政党的地位。"
 ADO.socialism: "£generic_socialism_small (PS) - 社会民主党"
 ADO.socialism_desc: "（社会民主主义）- 社会民主党\n\n社会民主党成立于2000年6月，由原民族民主团体分裂而成。自此，它一直是安道尔中左翼的主要政党，也是欧洲社会党和社会党国际的成员。2009年，在海梅·巴图梅乌的领导下，该党赢得了28个议席中的14个，使他成为首位领导安道尔政府的社会民主党人。然而，由于在取消银行保密制度和引入增值税的过程中未能通过预算，该政府提前两年垮台。自2011年成为反对党以来，该党一直致力于加强福利国家建设和与欧洲建立更紧密的联系。2023年，该党与其前分裂出来的社会民主与进步党组成联合政府，赢得了三个议席。"
 ADO.Neutral_conservatism: "£generic_Neutral_conservatism_small (S21) - 21世纪"
 ADO.Neutral_conservatism_desc: "（保守主义）- 21世纪\n\n21世纪党是一个成立于2003年的小型中右翼政党，于2005年4月与安道尔民主中心结盟，参加了该党唯一一次全国大选。该联合名单在总议会中赢得两个席位，足以在自由党和社会民主党均未占据多数席位的情况下，维持议会的平衡。\n\n同年晚些时候，这两个政党合并组建了新中心党，21世纪党作为一个独立政党就此消失。其短暂的生命周期，正是安道尔政党政治初期十年间，介于自由党和基督教民主党之间的中右翼政党频繁更迭的典型写照。"
 ADO.Neutral_conservatism_2018: "£generic_Neutral_conservatism_small (TV) - 第三道路"
 ADO.Neutral_conservatism_2018_desc: "（民族保守主义）- 第三道路\n\n第三道路党由前自由党成员约瑟普·平塔特·福尔内于2018年底与圣朱利亚德洛里亚的劳雷迪安联盟以及其他于2017年离开自由党的成员共同组建。该党在2019年4月的选举中作为安道尔民主党的保守派和主权主义替代选择参选，并赢得了四个席位，足以组成自己的议会党团，成为总委员会的第四股力量。\n\n该党派未能完整地在立法机构中存续下来。其副手卡琳·蒙塔内尔于2021年离任，并领导了新的安道尔前进党；而第三道路党和劳雷迪安联盟党宣布他们不会参加2023年的选举，这使得安道尔前进党实际上成为了其选民的继承者。"
 ADO.neutral_Social_2013: "£generic_neutral_Social_small (SDP) - 社会民主与进步"
 ADO.neutral_Social_2013_desc: "（社会民主主义）- 社会民主与进步\n\n社会民主与进步党由维克托·瑙迪和前政府首脑豪梅·巴图梅乌于2013年5月创立，此前他们脱离了社会民主党。该党自诩为社会民主主义和自由主义的结合体，既致力于市场经济，也致力于平等，其政治立场略微偏右于其原有的母党。\n\n社会民主党在2015年大选中赢得两个席位，瑙迪是其议员之一，但在2019年约瑟普·罗伊格·卡塞尔领导下，该党退出了总理事会。2023年，社会民主党与社会民主党联合执政，两党共占三个席位，此后一直以“进步党-社会民主党”的名义开展竞选活动。"
 ABK.Caliphate_desc: "（萨拉菲圣战主义）- 伊斯兰国高加索省\n\n2015年6月23日，伊斯兰国宣布成立高加索省。此前，在北高加索地区与俄罗斯作战的叛乱组织“高加索酋长国”的中层指挥官脱离领导层，转而效忠阿布·贝克尔·巴格达迪。该省首任指挥官鲁斯塔姆·阿西尔达罗夫于2016年12月被击毙，其继任者阿斯兰·比尤图卡耶夫于2021年1月被击毙。自此，该省一直没有公认的领导人。高加索省主要集中在达吉斯坦共和国、车臣共和国及其周边地区，虽然在2017年被军事击败，但仍持续以零星袭击为名，声称对警察和安全部队发动袭击，其目的是将高加索地区建立为一个统一的哈里发国。"
 ACE.Neutral_Muslim_Brotherhood_2007: "£muslim_brotherhood_small (PA) - 亚齐党"
 ACE.Neutral_Muslim_Brotherhood_2007_desc: "（亚齐民族主义）- 亚齐党\n\n亚齐党成立于2007年6月7日，是自由亚齐运动的政治继承者。该党利用2005年赫尔辛基备忘录中允许亚齐省设立地方政党的条款，在印尼各省中独此一家成立了该党。该党主席是穆扎基尔·马纳夫，他曾是自由亚齐运动武装力量的指挥官。亚齐党致力于全面落实赫尔辛基备忘录的各项条款，维护亚齐民族认同和伊斯兰价值观，并为饱受战争蹂躏的亚齐省的贫困民众争取权益。在2009年的首次省级选举中，该党赢得了69个席位中的33个。2012年，该党的扎伊尼·阿卜杜拉和穆扎基尔·马纳夫组成的竞选团队赢得了省长职位。尽管2019年该党的席位下降到18个，但它仍然是亚齐省议会最大的政党，马纳夫本人也于2024年当选为省长。"
 ADY.conservatism_desc: "（自由保守主义）- 右翼力量联盟\n\n右翼力量联盟是上世纪90年代市场改革派的政党，于1999年以阿纳托利·丘拜斯、鲍里斯·涅姆佐夫、叶戈尔·盖达尔和谢尔盖·基里延科为核心组成选举联盟，并于2001年正式成立为政党。该党主张私有化、低税收、小政府和与西方一体化，在阿迪格共和国，它代表的是迈科普市的小部分城市选民的利益，而不是共和国的农业地区的利益。\n\n它的影响力从来不在于席位，而在于干部：它的创始人曾执掌叶利钦政府，其经济学家塑造了普京的第一任期，而它的全国得票率从1999年的8.52%下降到2003年的不足4%，2007年更是跌破1%。2008年，它并入克里姆林宫支持的“正义事业党”，留下的残余势力于2011年重组为一个公共组织。"
 ADY.conservatism_1_desc: "（自由民主主义）- 人民自由党\n\n人民自由党是俄罗斯共和党的继承者，该党由改革派共产党人于1990年11月创立，并于2012年5月恢复注册。此前，欧洲人权法院裁定其2007年的解散行为非法，当时该党与鲍里斯·涅姆佐夫、米哈伊尔·卡西亚诺夫和弗拉基米尔·雷日科夫领导的未注册的人民自由党合并。人民自由党主张建立议会制共和国、司法独立和自由选举，并认为普京体制不合法，而不仅仅是错误。\n\n该党的优势在于大城市的自由主义抗议运动，而非像阿迪格共和国这样的地区 - 在阿迪格共和国，该党的分支机构成员以积极分子为主，而非选民。2015年2月涅姆佐夫遇刺身亡，使该党失去了最受欢迎的人物；2018年，该党候选人被取消参选资格；2023年5月25日，最高法院宣布该党解散。"
 ADY.liberalism_desc: "（社会自由主义）- 俄罗斯联合民主党亚博卢\n\n“亚博卢”党是格里戈里·亚夫林斯基于1993年创立的社会自由主义政党，旨在成为叶利钦改革派和共产党之外的民主选择。该党主张将市场经济与强大的福利国家、公民自由和欧洲一体化相结合，反对车臣战争，谴责吞并克里米亚和入侵乌克兰。其阿迪格共和国分支机构是一个由教师、学者和人权活动家组成的小型组织，位于迈科普，在国家委员会中没有席位。\n\n该党曾是国家杜马议员，直到2003年才离开，此后便依靠地方议会和几个百分点的稳定支持率维持运转，拒绝与民族主义者或克里姆林宫控制的反对派组成联盟。它之所以还能留在选票上，是因为它对当局无害，也正因如此，它离权力中心还很远。"
 ADY.Conservative_desc: "（大帐篷保守主义）- 统一俄罗斯党\n\n统一俄罗斯党是2001年12月由统一党和祖国-全俄罗斯党合并而成的执政党。在阿迪格共和国，它是共和国领导人阿斯兰·特哈库什诺夫（2007年上任）和穆拉特·库姆皮洛夫（2017年1月上任）的政治机器，两人均为该党成员。该党宣称奉行俄罗斯保守主义、稳定和对总统的忠诚，实际上则通过共和国的行政机构分配联邦资金、职位和合同。\n\n它的优势在于完全掌控国务院，2011年国务院54个席位中它占据41席，2016年50个席位中它占据40席，2021年又以66.73%的得票率占据40席，并且它还掌控着所有市级议会。它的弱点在于，它脱离了控制它的行政机构而独立存在。"
 ADY.Autocracy_desc: "（左翼民族主义）- 祖国党\n\n“祖国党”是一个民族爱国主义政党，在2003年由谢尔盖·格拉济耶夫和德米特里·罗戈津领导的杜马选举中以联盟形式参选，获得9.02%的选票和37个席位。该党主张国家控制经济、收回自然资源租金归人民所有，并在移民和后苏联空间问题上采取强硬立场。该党于2004年2月在罗戈津的领导下成立，2006年10月并入“公正俄罗斯党”，并于2012年在阿列克谢·茹拉夫廖夫的领导下重建。\n\n在阿迪格共和国，北部地区的斯拉夫族人口占多数，这是该党的天然受众，但该党从未赢得过席位。其复兴后的版本在2016年全国民调中获得1.51%的支持率，2021年获得0.80%的支持率。该党的优势在于其口号决定了当局之后采取的政策基调。"
 ADY.Caliphate_desc: "（萨拉菲圣战主义）- 高加索酋长国\n\n2007年10月7日，车臣指挥官多卡·乌马罗夫宣布成立高加索酋长国。他废除了分离主义的车臣共和国伊奇克里亚，并宣布整个北高加索地区（包括其声称拥有的阿迪格共和国）为与俄罗斯交战的伊斯兰国家。该酋长国通过集中在车臣、达吉斯坦、印古什和卡巴尔达-巴尔卡尔共和国的地下组织“贾马特”（伊斯兰教法组织）进行斗争，旨在驱逐俄罗斯统治并建立伊斯兰教法政权。\n\n阿迪格共和国本身几乎没有发生叛乱活动，该酋长国对共和国的主权声索也仅仅停留在纸面上。乌马罗夫于2013年去世，他的继任者阿利亚斯哈布·克别科夫和马戈梅德·苏莱曼诺夫于2015年被杀，其余大部分指挥官宣誓效忠伊斯兰国，到2016年，该组织几乎名存实亡。"
 ADY.oligarchism_desc: "（社团主义）- 俄罗斯统一工业党\n\n俄罗斯统一工业党成立于1995年，是董事游说集团的政治分支，先后由弗拉基米尔·谢尔巴科夫、阿图尔·奇林加罗夫和尤里·萨哈尔诺夫担任主席，叶莲娜·帕尼娜于2002年6月接任。该党主张国家支持国内制造业、实行保护性关税、为工业提供廉价信贷以及政府与大型企业建立社团主义伙伴关系。其地方分支机构（包括阿迪格共和国的分支机构）是由工厂厂长组成的委员会，而不是群众组织。\n\n该党从未赢得过任何名单席位，但帕尼娜在2003年以103160票赢得了莫斯科的一个单一席位。2006年12月1日，该党代表大会投票决定加入统一俄罗斯党，其领导人随后在统一俄罗斯党内担任产业政策委员会主席。"
 ADY.neutral_Social_1_desc: "（自由中间主义）- 新人\n\n新人党由费伯利克化妆品公司老板阿列克谢·涅恰耶夫于2020年3月1日创立，是一个倡导小企业、数字政府和区域发展的政党，主张国家服务于公民而非官员。该党在外交政策上避免与克里姆林宫对抗，同时批评官僚主义、过度监管以及资源向莫斯科集中。\n\n在2021年国家杜马选举中，该党获得5.32%的选票和13个席位，成为自2007年以来首个进入议会的新政党。2024年，该党吸收了增长党。在阿迪格共和国，该党派出候选人竞选国家委员会和市政议会，但尚未赢得任何席位，其策略是吸引那些原本会待在家里的年轻城市选民。"
 ADY.Neutral_conservatism_desc: "（俄罗斯民族主义）- 阿迪格斯拉夫人联盟\n\n阿迪格斯拉夫人联盟成立于1991年，即阿迪格共和国脱离克拉斯诺达尔边疆区后的几个月，旨在代表占共和国人口四分之一的俄罗斯族和哥萨克族。该联盟长期担任主席的尼娜·科诺瓦洛娃认为，名义上的阿迪格人控制着共和国的人事政策、经济和文化，并致力于废除共和国领导人的语言要求，以及推动阿迪格共和国回归克拉斯诺达尔边疆区。\n\n该党的影响力在2005年和2006年达到顶峰，当时州长亚历山大·特卡乔夫提出的合并方案使其在莫斯科获得了关注。然而，切尔克斯人的抵制以及克里姆林宫对北高加索地区动乱的担忧最终扼杀了这一计划。该党从未以政党身份参加过选举，并于2024年3月19日被从法人实体登记册中除名。"
 ADY.Nat_Fascism_desc: "（高加索民族主义）- 切尔克斯大会党\n\n切尔克斯大会是由艺术家穆拉特·别尔泽戈夫于2004年在迈科普创立的共和派公共运动组织。同年12月，克拉斯诺达尔边疆区总督亚历山大·特卡乔夫发表讲话，声称阿迪格共和国不可避免地将被并入其辖区，此后，切尔克斯人大会成为阿迪格抵抗运动的组织核心。该组织要求维护共和国，承认19世纪对切尔克斯人的驱逐是种族灭绝，要求遣返流散在外的切尔克斯人，并最终建立一个统一的切尔克斯共和国，将阿迪格共和国、卡巴尔达-巴尔卡尔共和国和卡拉恰伊-切尔克斯共和国统一起来。\n\n它的筹码是数百万侨民以及莫斯科对高加索地区动乱的敏感性，莫斯科曾利用这一点阻止了2005-2006年的合并，并让2014年索契冬奥会蒙羞，该冬奥会举办地正是1864年苏联最终战败的地方。但它也为此付出了代价，其办公室遭到搜查，其活动人士遭到起诉，别尔泽戈夫于2010年逃往美国寻求政治庇护。"
 ADY.Nat_Populism_desc: "（右翼民粹主义）- 俄罗斯自由民主党\n\n俄罗斯自由民主党既非自由主义也非民主主义，而是弗拉基米尔·日里诺夫斯基的个人工具。他于1989年创立该党，并领导该党直至2022年去世。该党主张建立一个由各省而非民族共和国组成的帝国俄罗斯，敌视移民和西方，并在国内实行强硬统治。在阿迪格共和国，这一纲领意味着废除共和国本身，这使得该党在北部地区的俄罗斯选民中拥有了强大的支持，而联邦党的种种举动本身却无法做到这一点。\n\n自2011年以来，该党在历届国务委员会中都占据席位，2011年54个席位中占3席，2016年50个席位中占4席，2021年以7.74%的得票率获得3席，并且在所有重要议题上都与统一俄罗斯党保持一致。自2022年列昂尼德·斯卢茨基领导以来，该党一直是当局能够负担得起的、用于安抚抗议选民的安全阀。"
 AFG.liberalism_2010: "£AFG_liberalism_2017 (AGT) - 阿富汗绿色趋势"
 AFG.liberalism_2010_icon: "£AFG_liberalism_2017"
 AFG.liberalism_2010_desc: "（自由民族主义）- 阿富汗绿色趋势\n\n绿色趋势（又称全国动员）由阿姆鲁拉·萨利赫于2010年创立。此前，他因抗议哈米德·卡尔扎伊向塔利班示好而辞去情报局局长一职。该运动主张民主的、反塔利班的阿富汗民族主义，拒绝与叛乱分子达成任何和解，并将巴基斯坦视为战争的根源。它将自由主义改革与动员青年以及原北方联盟中的潘杰希尔选民相结合。\n\n2011年，超过十万名追随者在喀布尔游行，展现了该组织的实力；2020年，萨利赫升任第一副总统，进一步增强了该组织的影响力。2021年8月15日，萨利赫宣布自己为看守总统，该组织的绿色部队加入了全国抵抗阵线对抗塔利班的叛乱。"
 HAZ.Vilayat_e_Faqih_desc: "（什叶派伊斯兰主义）- 阿富汗伊斯兰运动\n\n阿富汗伊斯兰运动由坎大哈教士阿西夫·穆赫塞尼于1978年创立，是德黑兰八人组中的一个什叶派圣战者政党。该党最初汲取阿里·沙里亚提的革命思想，后来则融入了穆赫塞尼自身的保守法学，并与伊朗的“法基赫的监护”理论保持距离。该党主张什叶派少数群体在伊斯兰国家中的权利，是除哈扎拉族什叶派联盟之外的主要什叶派政党。\n\n其力量源于坎大哈、赫拉特和喀布尔的非哈扎拉什叶派穆斯林，以及穆赫塞尼的宗教权威。2001年后，该组织加入了北方联盟的继任者政府和阿富汗全国联盟。2005年2月，穆赫塞尼将领导权移交给穆罕默德·阿里·贾维德，随后侯赛因·安瓦里领导的一个异议派系脱离该组织，成立了人民伊斯兰运动。"
 ALB.Neutral_green_2003: "£ALB_non_aligned_greens (PAA) - 环境农业党"
 ALB.Neutral_green_2003_icon: "£ALB_non_aligned_greens"
 ALB.Neutral_green_2003_desc: "(农业主义) - 环境农业党\n\n英环境主义农业党是卢夫特·舒韦利于1991年创立的农业党在2003年更名后成立的政党。该党在原有纲领的基础上，增加了环境保护和农村可持续发展的内容，其纲领以集体农场解体后涌现的小农户的利益为基础。该党主张建立自由市场农村，保障土地所有权、农业信贷和阿尔巴尼亚农产品安全，并将自身定位为可供两大阵营选择的中间派伙伴。\n\n该党在选举中取得的最佳成绩是2005年，当时以6.5%的得票率获得四个席位。此后，该党得票率跌破门槛，只能依靠民主党名单勉强维持，并在2021年和2025年分别在阿格隆·杜卡的领导下获得一个议席。杜卡于2016年接替了舒韦利的职位。该党的优势在于其能够为联合政府带来的农村选票，而不是其自身的影响力。"
 ALB.neutral_Social_2004: "£generic_neutral_Social_small (LSI) - 社会主义一体化运动"
 ALB.neutral_Social_2004_desc: "(社会民主主义) - 社会主义一体化运动\n\n社会主义一体化运动是伊利尔·梅塔于2004年9月6日脱离社会党后创立的政党，自诩为致力于欧洲一体化、摆脱社会主义老派势力束缚的现代社会民主力量。该党主张亲商的中左翼政策、加快欧盟入盟进程以及廉洁政府，但其实际运作更多地受到梅塔个人控制而非纲领的影响。\n\n在政治上，该党是阿尔巴尼亚的“造王者”，其席位从2005年的5个增长到2017年的19个，得票率达到14.3%。该党在2009年至2013年与民主党联合执政，在2013年至2017年与社会党联合执政，而梅塔则最终当选总统。该党的优势在于其能够左右任何多数派的命运。2022年7月，由于其创始人与埃迪·拉马决裂，该党更名为自由党。"
 ALB.neutral_Social_2022: "£generic_neutral_Social_small (PL) - 阿尔巴尼亚自由党"
 ALB.neutral_Social_2022_desc: "(中间民粹主义) - 阿尔巴尼亚自由党\n\n阿尔巴尼亚自由党是社会主义一体化运动于2022年7月25日正式启用的名称，标志着伊利尔·梅塔在卸任总统后重返党内领导层，并从社会民主主义转向以埃迪·拉马为目标的反建制民粹主义。该党认为社会主义政府已经掌控了国家、法院和媒体，其竞选纲领包括主权、反腐败以及地拉那经济繁荣时期被边缘化的选民的诉求。\n\n实际上，该党已不复当年叱咤风云的辉煌，在2021年改组前仅获得四个席位，并在2025年大选中加入民主党领导的联盟。梅塔于2024年10月因腐败指控被捕（他否认指控，称其为政治迫害），这使得该党目前的立场更倾向于表达不满，而非成为执政伙伴。"
 ARM.Conservative_alty: "£ARM_Conservative (HD) - 亚美尼亚联盟"
 ARM.Conservative_alty_icon: "£ARM_Conservative"
 ARM.Conservative_alty_desc: "(民族保守主义) - 亚美尼亚联盟\n\n亚美尼亚联盟是罗伯特·科恰良于2021年5月9日联合亚美尼亚革命联盟和重生亚美尼亚党组建的反对派联盟，该联盟将前总统科恰良塑造成能够在2020年战争后恢复安全的强人。其竞选纲领包括亚美尼亚民族主义、与俄罗斯紧密结盟以及推翻尼科尔·帕希尼扬在阿尔察赫问题上做出的让步。\n\n在2021年的选举中，该联盟以21.11%的得票率和29个席位位居第二，但在2026年由于一系列成员的倒戈，其得票率降至9.89%，席位降至12个。该联盟的影响力主要依赖于科恰良的个人支持以及该联盟的海外侨民组织。"
 ARM.Caliphate_desc: "（萨拉菲圣战主义）- 伊斯兰国高加索省\n\n2015年6月23日，鲁斯塔姆·阿西尔达罗夫和其他一些从高加索酋长国叛逃的中层指挥官宣布成立“伊斯兰国高加索省”，声称对从车臣和达吉斯坦向​​南延伸的整个高加索地区拥有主权。该组织试图以伊斯兰教法统治下的哈里发国取代该地区的所有国家，并将信奉基督教的亚美尼亚视为敌对领土而非招募地。\n\n从军事角度来看，该省的组织力量在2017年就已经瓦解，自2021年以来一直处于群龙无首的状态，仅靠俄罗斯北高加索地区的零星袭击勉强维持生存。它对亚美尼亚的意义在于构成跨境的外部威胁，而非国内政治动向。"
 AST.liberalism_alt: "£AST_liberalism (CA) - 中间联盟"
 AST.liberalism_alt_icon: "£AST_liberalism"
 AST.liberalism_alt_desc: "(社会自由主义) - 中间联盟\n\n中间联盟是一个中间派、社会自由主义政党，由南澳大利亚的尼克·泽诺芬追随者组成，最初名为尼克·泽诺芬团队。该党以南澳大利亚地区利益、消费者保护、赌博改革和民粹主义怀疑论为竞选纲领。"
 AST.oligarchism: "£generic_oligarchism_small (UAP) - 联合澳大利亚党"
 AST.oligarchism_desc: "(右翼民粹主义) - 联合澳大利亚党\n\n联合澳大利亚党是矿业亿万富翁克莱夫·帕尔默的个人政治工具，最初名为帕尔默联合党。该党奉行经济民族主义，敌视政治阶层，并主张减税，其资金全部来自帕尔默的个人财富。"
 AST.Monarchist: "£generic_Monarchist_small (AML) - 澳大利亚君主主义联盟"
 AST.Monarchist_desc: "(立宪君主主义) - 澳大利亚君主主义联盟\n\n澳大利亚君主主义联盟是一个成立于1993年的志愿者组织，由菲利普·本韦尔担任主席数十年，致力于维护澳大利亚君主制。该联盟通过研讨会、档案资料以及对被认为不尊重君主制的媒体提出投诉等方式开展活动。在1999年的共和制公投中，该联盟支持反对派，最终以54.87%的得票率否决了共和制公投。\n\n在政治上，该联盟与所有政党以及占据了大多数反对共和制官方阵营席位的澳大利亚君主立宪制联盟都截然不同。该联盟的优势在于其声称拥有2万名成员和5.3万名支持者，一旦共和制问题再次出现，他们就可以被动员起来。"
 ALT.conservatism_desc: "（自由保守主义）- 右翼力量联盟\n\n右翼力量联盟是上世纪90年代市场改革派的政党，于1999年以阿纳托利·丘拜斯、鲍里斯·涅姆佐夫、叶戈尔·盖达尔和谢尔盖·基里延科为核心组成选举联盟，并于2001年正式成立为政党。该党主张私有化、低税收、小政府和与西方一体化，并继承了盖达尔领导的俄罗斯民主选择党的组织架构。\n\n在阿尔泰共和国，这份传承至关重要。谢苗·祖巴金于1998年1月至2002年1月担任该共和国领导人，他曾担任民主选择党地区支部主席，并自2000年12月起担任社会进步党支部协调委员会主席，这使得阿尔泰成为改革派曾经执政的少数几个地区之一。祖巴金在2001年12月的第一轮选举中获得14%的选票，但在决选中败给了米哈伊尔·拉普申，此后该党逐渐走向边缘化。2008年11月15日，该党解散，并入克里姆林宫支持的右翼事业党。"
 ALT.conservatism_1_desc: "（自由民主主义）- 人民自由党\n\n人民自由党的前身是“为了没有无法无天和腐败的俄罗斯”联盟，由鲍里斯·涅姆佐夫、米哈伊尔·卡西亚诺夫、弗拉基米尔·雷日科夫和弗拉基米尔·米洛夫于2010年9月16日宣布成立。2012年6月，在欧洲人权法院裁决后恢复注册资格的俄罗斯共和党正式采用该名称，使其法律形式得以确立。人民自由党主张自由选举、司法独立、法治和欧洲一体化，并公开反对克里姆林宫。\n\n在阿尔泰共和国，该党从未进入过选举：其参加2019年“自由党”选举的名单被拒绝登记，其活动也仅限于戈尔诺-阿尔泰斯克的一小群人。2015年2月涅姆佐夫遇害以及其大部分领导人流亡后，该党名存实亡，最高法院于2023年5月25日将其解散。"
 ALT.liberalism_desc: "（社会自由主义）- 俄罗斯联合民主党亚博卢\n\n亚博卢党是格里戈里·亚夫林斯基于1993年创立的社会自由主义政党，旨在成为叶利钦改革派和共产党之外的民主选择，它将市场经济与强大的福利国家、公民自由和欧洲一体化相结合。该党在国家杜马任职至2003年，此后一直是议会外最大的注册自由主义政党，先后由亚夫林斯基、谢尔盖·米特罗欣、埃米莉亚·斯拉布诺娃和尼古拉·雷巴科夫领导。\n\n在阿尔泰共和国，它更像是一个名字，而非一股力量。在2019年的“自由党”选举中，它的候选人名单仅获得723张选票，得票率为0.89%。其地方分支机构的主要功能是推选候选人和派出观察员。它的影响力仅限于戈尔诺-阿尔泰斯克市的一小部分城市知识分子，他们希望选票上能有一个自由主义选项。"
 ALT.Conservative_desc: "（大帐篷保守主义）- 统一俄罗斯党\n\n统一俄罗斯党是2001年12月由统一党和祖国-全俄罗斯党合并而成的执政党。自亚历山大·别尔德尼科夫2006年1月就任阿尔泰共和国总统以来，该党一直是历任总统的政治机器：别尔德尼科夫任期至2019年3月，奥列格·霍罗霍尔金任期至2024年6月，安德烈·图尔恰克（曾任该党总书记）于2024年9月8日以74.09%的得票率当选。该党宣扬稳定、爱国主义和对总统的忠诚，并负责发放共和国赖以生存的联邦资金。\n\n该党在2006年3月首次库鲁尔泰比例代表制选举中获得27.2%的选票，2010年获得44.43%，2014年获得44.7%，2019年获得34.18%，2024年获得53.84%，并在2024年横扫全部30个单议席选区。该党的优势在于其行政机构和预算，劣势在于山区，阿尔泰选民曾多次转而支持共产党和阿尔泰自由民主党以表达抗议。"
 ALT.Autocracy_desc: "（左翼民族主义）- 祖国党\n\n“祖国党”是一个民族爱国主义政党，在2003年由谢尔盖·格拉济耶夫和德米特里·罗戈津领导的杜马选举中以联盟形式参选，获得9.02%的选票。该党主张国家控制经济、收回自然资源租金归人民所有，并对移民采取强硬立场。该党于2004年2月14日注册成立，2006年10月28日并入“公正俄罗斯党”，并于2012年9月29日由罗戈津的盟友重建，成为一个忠诚的爱国主义政党。\n\n阿尔泰共和国是其表现较好的地区之一：在2006年3月的“自由俄罗斯”选举中，其政党获得了10.52%的选票，仅次于统一俄罗斯党；重组后，该党在2019年再次获得5.38%的选票和一个席位，但在2024年下降到1.65%。其优势在于俄语城镇居民的抗议性选票，他们既不想要共产党，也不想要执政党。"
 ALT.oligarchism_desc: "（社团主义）- 俄罗斯统一工业党\n\n俄罗斯统一工业党成立于1995年，是董事游说集团的政治分支，先后由弗拉基米尔·谢尔巴科夫、阿图尔·奇林加罗夫和尤里·萨哈尔诺夫担任主席，叶莲娜·帕尼娜于2002年6月接任。该党主张国家支持国内制造业、实行保护性关税、为工业提供廉价信贷，并维护企业管理者的利益而非金融寡头的利益。在2006年投票并入统一俄罗斯党之前，该党一直得到统一俄罗斯党的支持。\n\n在阿尔泰共和国，除了建筑、木材和食品加工之外几乎没有其他产业，该党从未有过像样的分支机构。在这里，它实际上代表的是那些依靠联邦预算和旅游业繁荣而生存的企业董事和承包商的利益，而他们在这个贫困的共和国里所掌握的资金和工作岗位，正是他们的筹码。"
 ALT.neutral_Social_desc: "（社民主社会主义）- 俄罗斯爱国者党\n\n“俄罗斯爱国者”组织由商人根纳季·谢米金于2005年4月20日被俄罗斯联邦共产党开除后在一次代表大会上创立，该组织融合了民主社会主义和左翼民族主义：主张建立强大的福利国家、自然资源公有制以及奉行大国外交政策。该组织在俄罗斯国内的支持率从未超过1%，并于2021年2月并入“公正俄罗斯 - 为了真理”组织。\n\n阿尔泰共和国是其表现最好的地区。该分支机构由尤里·安塔拉多诺夫创建，他曾任第一副总理兼联邦委员会委员，1997年阿尔泰人民库鲁尔泰党曾推举他担任主席。该分支机构由根纳季·苏明担任主席，并成为阿尔泰民族运动的选举工具。在2014年的库鲁尔泰党选举中，该分支机构的候选人名单获得了6.2%的选票，安塔拉多诺夫也因此当选；2015年3月他去世后，该分支机构的得票率在2019年跌至2.10%。"
 ALT.neutral_Social_1_desc: "（自由中间主义）- 新人\n\n新人党由法伯利奇化妆品公司老板阿列克谢·涅恰耶夫于2020年3月1日创立，是一个倡导小企业、数字政府和区域发展的政党，主张国家服务于公民而非官员。该党在外交政策上避免与克里姆林宫对抗，同时在国内批评官僚主义。2021年，新人民党首次参选便以5.32%的得票率进入国家杜马。\n\n在阿尔泰共和国，这是一个组织松散的新政党：其候选人名单在2024年“自由党”选举中仅获得3.57%的选票，最终一无所获。该党主要吸引戈尔诺-阿尔泰斯克市的年轻人和个体户，以及楚亚公路沿线的旅游业从业者，其影响力则源于克里姆林宫希望在选票上保留一位形象良好的温和派候选人。"
 ALT.Neutral_Libertarian_desc: "（古典自由主义）- 自由俄罗斯党\n\n“自由俄罗斯”是俄罗斯中小企业网络党于2004年4月采用的名称。该党由企业家亚历山大·里亚夫金于2002年创立，旨在代表那些被官僚机构和大公司夹在中间的店主、贸易商和小制造商发声。它主张低税收、放松管制、保护财产权和建立竞争性经济，并谨慎地避免与克里姆林宫发生冲突。\n\n在阿尔泰共和国，该党此前并无以这个名称参与选举的记录。其意义在于，它是“公民力量党”的雏形，弗拉基米尔·彼得罗夫后来于2014年代表该党挑战共和国领导人。2007年3月27日，该党代表大会通过了新名称。"
 ALT.Neutral_Libertarian_1_desc: "（古典自由主义）- 公民力量党\n\n“公民力量”是自由俄罗斯党于2007年3月27日在亚历山大·里亚夫金和律师米哈伊尔·巴尔舍夫斯基的领导下更名的政党。该党标榜自己是一个代表小企业主、专业人士和城市中产阶级的自由主义政党，忠于国家，但反对官僚主义的专断。该党在2007年国家杜马选举中获得1.05%的选票，于2008年11月并入“正义事业”党，2012年重新注册为独立政党，并于2025年1月15日被最高法院解散。\n\n该党在阿尔泰共和国的辉煌时刻出现在2014年9月14日。当时，商人弗拉基米尔·彼得罗夫代表该党与亚历山大·别尔德尼科夫竞选总统，最终以36.44%的得票率险胜，而别尔德尼科夫的得票率为50.63%，彼得罗夫仅以微弱劣势错失进入第二轮投票的机会。随后，彼得罗夫就约1340张选票的丢失提起诉讼。该党的优势在于彼得罗夫的财力和人气，而非任何组织机构，因此，该党并未在他竞选结束后继续存在下去。"
 ALT.Neutral_green_desc: "（环保主义） - 绿党\n\n绿党源自1992年成立的建设性生态运动“雪松”，该运动于1994年转变为政党，并于2002年采用“俄罗斯生态主义绿党”这一名称。它倡导清洁的空气与水、自然保护区、废物改革和可再生能源，同时对克里姆林宫刻意采取非对抗姿态。该党从未通过国家杜马的门槛，在2008年至2012年6月重新注册期间，一直以社会运动的形式存续。\n\n在阿尔泰共和国，其经济依赖于“阿尔泰金山”世界遗产地、卡通河和捷列茨科耶湖，生态政治主要由当地抗议活动推动 - 反对通往中国的阿尔泰天然气管道、卡通河上的水电站以及无监管的旅游建设 - 而非由该党推动，该党在那里没有议员。其影响力来自这种情绪的强度，而非自身的组织。"
 ALT.Neutral_Communism_desc: "（农业社会主义）- 俄罗斯农民党\n\n农业党由米哈伊尔·拉普申和瓦西里·斯塔罗杜布采夫于1993年2月26日创立，旨在捍卫集体农场和国营农场，反对市场改革。在首届国家杜马选举中，该党与共产党结盟，获得8%的选票和37个席位。农业党主张国家扶持农业，为农场提供廉价信贷和燃料，保护农民免受食品进口冲击，维护农村生活方式。该党逐渐脱离俄罗斯联邦共产党的阵营，转而支持克里姆林宫，最终于2008年9月12日并入统一俄罗斯党。\n\n阿尔泰共和国是该党唯一执政的地区。拉普申于1993年至2004年担任该党主席，在2002年1月6日的第二轮投票中，他以超过68%的得票率击败谢苗·祖巴金，当选主席，并领导该共和国直至2006年1月。该党在2006年3月的“库鲁尔泰”选举中获得了10.41%的选票。该党的根基在于山区牧民和村庄，其政治遗产连同其成员一起传承给了统一俄罗斯党。"
 ALT.Neutral_Communism_1_desc: "（马列主义）- 俄罗斯共产党\n\n俄罗斯共产党于2012年4月22日召开代表大会成立，并于2012年6月7日在马克西姆·苏拉伊金的领导下注册成立。该党是一个正统的马克思列宁主义政党，指责俄罗斯联邦共产党搞机会主义，并呼吁恢复苏联政权、实行国有化和计划经济。其实际作用在于分裂共产党的选票：该党使用的名称和标志几乎与俄罗斯联邦共产党完全相同，在2016年国家杜马选举中仅获得略高于2%的选票，在2021年选举中获得1.27%的选票。\n\n在阿尔泰共和国，俄罗斯联邦共产党是最强大的反对党，其搅局者的角色至关重要。该党参加2019年库鲁尔泰选举的候选人名单被拒绝登记，其影响力仅限于单席候选人和地方议会成员。该党的优势在于它制造混乱，让选民在选票上寻找共产党的路线。"
 ALT.Nat_Populism_desc: "（右翼民粹主义）- 俄罗斯自由民主党\n\n俄罗斯自由民主党既非自由主义政党，也非民主政党，而是弗拉基米尔·日里诺夫斯基的个人工具。他于1989年创立该党，并领导该党直至2022年4月去世。该党主张建立一个由各省组成的帝国俄罗斯，而非由各民族共和国组成的国家；敌视移民和西方；并主张建立一个优先照顾俄罗斯族人的强大国家。在列昂尼德·斯卢茨基的领导下，该党仍然是获得授权的民族主义反对派，在所有实质性问题上都与克里姆林宫保持一致。\n\n在阿尔泰共和国，该党是仅次于共产党的第二大抗议政党，随着共产党势力的衰落而发展壮大：2006年得票率为8.26%，2010年为11.37%并赢得两个席位，2019年为12.03%并赢得一个席位，2024年得票率为18.17%并赢得两个席位，当时其候选人亚历山大·基里洛夫在党魁选举中以10.02%的得票率位居第二。该党的基本盘是戈尔诺-阿尔泰斯克和低地地区的俄罗斯工人阶级选民，其在民族共和国问题上的立场与阿尔泰地区的选民群体存在分歧。"
 ALT.Nat_Fascism_desc: "（阿尔泰民族主义）- 阿尔泰人库鲁尔泰\n\n俄阿尔泰人民大会是阿尔泰民族的议会，于1997年10月7日由扎伊桑和埃内·蒂尔语言运动发起首次召开。大会选举产生执政委员会“托斯·托尔戈”和人民领袖“埃尔·巴什奇”），并自称是阿尔泰人最高级别的自治组织。阿尔泰人约占以他们名字命名的共和国人口的三分之一。大会的纲领包括：保护阿尔泰语言和习俗，巩固阿尔泰各亚民族群体，掌控土地和圣地，以及防止共和国与阿尔泰边疆区合并。大会是一个运动，而非政党，并且从未鼓吹暴力。\n\n其政治影响力很快就显现出来：1997年12月，它提名尤里·安塔拉多诺夫为阿尔泰共和国领导人，他获得了23.28%的选票，仅以微弱劣势落后于最终的胜者谢苗·祖巴金。进入21世纪，其领导人利用“俄罗斯爱国者”组织作为选举工具，并于2014年加入阿尔泰民族联盟。与此同时，该运动本身在2011年分裂为官方的“阿尔泰人民大会”和另一个于2012年9月3日注册为公共运动的“阿尔泰民族联盟”，各自选举自己的阿尔泰共和国领导人。该运动的优势在于，任何共和国领导人都无法对抗阿尔泰村庄；而在莫斯科看来，其危险之处在于，它体现了一种建立独立国家的民族分裂逻辑。"
 ALT.Nat_Autocracy_desc: "（阴谋民族主义）- 概念党统一\n\n概念党联盟于2000年7月在彼尔姆成立，并于2002年9月24日注册成立，是“公共安全概念”的政治分支。“公共安全概念”是由康斯坦丁·彼得罗夫少将领导的退役太空军军官发展起来的理论，它将俄罗斯历史解释为全球预言家的杰作，并呼吁由具备概念素养的军官和工程师精英进行统治。该理论主张建立一个实行军事纪律的中央集权国家，实行计划经济，并对西方、犹太复国主义和自由派知识分子抱有敌意。\n\n该党在2003年国家杜马选举中仅获得1.17%的选票，并于2007年5月15日因未达到新政党法规定的党员人数门槛而被最高法院解散。在阿尔泰共和国，该党既没有组织也没有代表；在这里，它被视为退役军官和安全人员的理论基地，这些人将在文官政治失败后接管共和国。"
 ARG.liberalism_ari: "£ARG_liberalism (ARI) - 阿根廷人争取平等共和国"
 ARG.liberalism_ari_icon: "£ARG_liberalism"
 ARG.liberalism_ari_desc: "（社会自由主义）- 阿根廷人争取平等共和国\n\n2001年3月17日，埃莉萨·卡里奥因不满德拉鲁阿政府的经济政策和参议院贿赂丑闻而与激进公民联盟决裂，随后创立了“争取平等共和国联盟”。该联盟最初以幌子形式存在，并于2002年11月正式更名为“阿根廷人争取平等共和国”。该联盟主张维护制度廉洁、打击腐败、建立具有强大社会福利保障的社会自由经济体系，并捍卫宪法，反对总统权力过度集中。\n\n卡里奥在2003年总统选举中获得14.05%的选票，2007年以23.05%的得票率位居第二，当时她领导的阿根廷人争取平等共和国成为克里斯蒂娜·费尔南德斯·德·基什内尔的主要反对力量。阿根廷人争取平等共和国的优势在于卡里奥在首都和潘帕斯草原中产阶级中拥有强大的个人影响力，其劣势在于该党对她的依赖以及她每次策略转变后都会导致的党内分裂。"
 ARG.liberalism_cc: "£ARG_liberalism (CC-ARI) - 公民联盟 - 争取平等共和国总动员"
 ARG.liberalism_cc_icon: "£ARG_liberalism"
 ARG.liberalism_cc_desc: "（社会自由主义）- 公民联盟 - 争取平等共和国总动员\n\n公民联盟- 争取平等共和国总动员是埃莉萨·卡里奥于2009年10月2日正式采用的政党名称，此前她于2007年领导的公民联盟已成为她的永久品牌。该党已从中间偏左转向共和主义的中间偏右，其特点是反基什内尔主义、维护制度廉洁和司法独立，同时保留了卡里奥道德说教式的反腐败风格。\n\n2011年，卡里奥的支持率跌至1.82%。2015年，该党与共和提案党和激进公民联盟一起，成为变革联盟的第三大支柱，参与了毛里西奥·马克里政府和“携手变革”联盟的执政，直至2023年。该党在议会中的席位已缩减至寥寥几位，其影响力在于卡里奥作为联盟良心的地位，以及她能够像给盟友和对手制造麻烦一样轻易地给盟友制造麻烦的能力。"
 ARG.Neutral_Libertarian_pl: "£ARG_non_aligned_libertarian (PL) - 自由意志党"
 ARG.Neutral_Libertarian_pl_icon: "£ARG_non_aligned_libertarian"
 ARG.Neutral_Libertarian_pl_desc: "（自由意志主义）- 自由意志党\n\n自由意志党由围绕哈维尔·米莱的电视节目和布宜诺斯艾利斯自由市场智库而壮大的自由主义圈子的积极分子于2018年10月16日创立，米莱于2019年2月23日加入该党担任名誉主席。该党主张废除中央银行、实行美元化、将国家规模缩减到最低限度、实行自由贸易以及捍卫私有财产免受政治阶层的侵害。\n\n2019年5月9日，该党在布宜诺斯艾利斯市获得合法地位，并成为米莱于2021年创立的联盟的组织核心。当米莱和他的妹妹卡琳娜将自由进步党发展成他们自己的政党时，自由意志党仍然是一个规模较小、意识形态更纯粹的合作伙伴，它曾因庇护和任命问题与政府发生争执，其影响力在于其活跃的群众基础以及它为运动带来的品牌。"
 ARG.Neutral_Libertarian_lla: "£generic_Neutral_Libertarian_small (LLA) - 自由进步党"
 ARG.Neutral_Libertarian_lla_desc: "（自由保守主义）- 自由进步党\n\n“自由进步联盟”成立于2021年7月14日，是哈维尔·米莱在布宜诺斯艾利斯市以17.04%的得票率进入众议院的联盟。两年后，该联盟发展成为打破两党制的政治力量：米莱在2023年第一轮投票中获得29.99%的选票，在2023年11月19日的第二轮投票中以55.65%的得票率击败塞尔吉奥·马萨，并于2023年12月10日就职。该联盟将米莱的无政府资本主义经济理念（包括美元化、削减开支和放松管制）与社会保守主义、对政治阶层的敌视以及与美国和以色列的结盟相结合。\n\n该党于2024年11月20日在总统的妹妹兼办公厅主任卡琳娜·米莱伊的领导下被正式承认为全国性政党。到2025年，该党已在全国24个选区建立起组织，并在中期选举中成为得票最多的政党，吸纳了共和提案党的大部分选民。该党的优势在于米莱伊在年轻人和内陆非正式就业者中拥有强大的个人影响力，其劣势在于议会席位薄弱以及内阁成员依赖于其他政党的叛逃者。"
 ARG.Neutral_Communism_fitu: "£ARG_Neutral_Communism_alt (FIT-U) - 工人左翼阵线 - 团结"
 ARG.Neutral_Communism_fitu_icon: "£ARG_Neutral_Communism_alt"
 ARG.Neutral_Communism_fitu_desc: "（托洛茨基主义）- 工人左翼阵线 - 团结\n\n工人左翼阵线 - 团结阵线是该阵线于2019年6月13日正式启用的名称。当时，社会主义工人运动加入了三个创始政党，首次将所有托洛茨基主义左翼选举力量联合在一个名单上。其纲领保持不变：建立工人政府，将银行和对外贸易国有化，拒绝偿还债务，以及工人阶级摆脱庇隆主义和右翼势力的控制，如今又加入了女权主义和生态主义议程。\n\n德尔卡尼奥在2019年获得了2.16%的选票，米里亚姆·布雷格曼在2023年获得了2.70%的选票。该阵线控制着四到五名在各党派间轮换的国会议员，其势力范围主要集中在胡胡伊省、内乌肯省以及布宜诺斯艾利斯的工业郊区。该阵线的优势在于街头和工作场所，它领导着反对哈维尔·米莱伊紧缩政策的运动；其影响力在于其规模较小，任何政府都难以将其纳入麾下。"
 ARG.Nat_Fascism_bv: "£generic_Nat_Fascism_small (BV) - 社区旗帜"
 ARG.Nat_Fascism_bv_desc: "（超民族主义）- 社区旗帜\n\n社区旗帜党是亚历杭德罗·比昂迪尼在最高法院关闭新凯旋党后于2013年创立的政党，它表现为邻里安全、国家主权以及反对移民和政治阶层的运动，而不是用其前身公开的纳粹术语。它于2014年5月22日获得布宜诺斯艾利斯市联邦选举法院的法律承认，并在2014年6月2日的官方公报中发布，以应对犹太社区组织的抗议。\n\n该党曾多次参加首都选举，但从未接近过初选门槛。2017年6月，它成为联邦爱国者阵线联盟的核心。其优势在于比昂迪尼领导的激进派核心以及对当地民众安全不满情绪的利用；其影响力在于新胜利党从未获得的合法参选资格。"
 ARG.Nat_Fascism_fpf: "£generic_Nat_Fascism_small (FPF) - 联邦爱国者阵线"
 ARG.Nat_Fascism_fpf_desc: "（超民族主义）- 联邦爱国者阵线\n\n联邦爱国阵线成立于2017年6月14日，由亚历杭德罗·比昂迪尼的邻里旗帜党和人民行动党组成，并于2018年11月27日注册为独立政党。该党主张民族主义、保护主义和社会传统主义纲领，包括关闭边境、维护法律和秩序以及敌视政治阶层，并将比昂迪尼塑造成爱国右翼的局外人候选人。\n\n比昂迪尼在2019年总统初选中仅获得0.24%的选票，惨遭淘汰。他的儿子塞萨尔·比昂迪尼在2023年也只获得了0.21%的选票。当时，该党在五个省份拥有合法地位，但在任何地方都没有获得席位。该党的优势在于其规模较小的全国性激进分子网络和持续不断的网络影响力；但随着哈维尔·米莱领导的“自由前进党”掌控了反建制右翼阵营，该党的影响力也随之消失。"
 ANT.liberalism: "£generic_liberalism_small (BPM) - 巴布达人民运动"
 ANT.liberalism_desc: "（巴布达民族主义） - 巴布达人民运动\n\n巴布达人民运动成立于1978年，是巴布达岛（安提瓜和巴布达是两个岛屿国家中较小的岛屿）的政治代言人。该运动主张巴布达自治，实行土地公有制（岛上任何土地均不得出售），并捍卫岛上的渔业、畜牧业和生活方式，抵制来自安提瓜的开发活动。该运动的政治立场是民主社会主义和民族主义，而非自由主义，是该国除安提瓜两大政治机器之外唯一真正的政党。\n\n该党竞选巴布达岛在众议院的唯一席位以及由11名成员组成的巴布达委员会。该党在巴布达委员会中长期占据主导地位，并在2023年的选举中大获全胜。其领导人特雷弗·沃克曾于2004年至2014年担任巴布达岛议员，并于2018年再次当选。该党与联合进步党结盟，推动了2007年《巴布达土地法》的通过，并一直反对工党政府在2018年对该法案的修订以及飓风“艾尔玛”后出现的度假村开发项目。该党的影响力在于，其赢得的席位足以决定一个势均力敌的议会的最终结果。"
 ANT.socialism: "£generic_socialism_small (UPP) - 统合进步党"
 ANT.socialism_desc: "（社会民主主义）- 统合进步党\n\n统合进步党成立于1992年4月11日，由联合民族民主党、蒂姆·赫克托领导的安提瓜加勒比解放运动和进步劳工运动合并而成，旨在团结反对伯德家族工党的各方力量，并以工会领袖鲍德温·斯宾塞为首。该党主张建立廉洁政府、透明公开、保障工人权益和社会投资的社会民主制度，并以“人民至上”为口号，集中力量反对伯德家族的腐败和世袭统治。\n\n该党在1999年获得44.45%的选票和4个席位，随后在2004年3月23日以55.5%的得票率赢得17个席位中的12个，使斯宾塞成为自独立以来首位非工党出身的首相，并执政至2014年，之后该党席位跌至3个。在哈罗德·洛弗尔的领导下，该党在2023年恢复至6个席位，得票率为45.22%，贾马尔·普林格尔于2024年4月成为党魁。该党的优势在于圣约翰斯地区的城市和专业人士选票以及工党阵营之外的工会；其弱点在于容易分裂，最近一次是乔安妮·马西亚于2017年离党创立民主民族联盟。"
 ANT.Nat_Autocracy: "£generic_Nat_Autocracy_small (ABDF) - 安提瓜和巴布达国防军"
 ANT.Nat_Autocracy_desc: "（军政府）- 安提瓜和巴布达国防军\n\n安提瓜和巴布达国防军于1981年9月1日根据《国防法》成立，比该国独立早两个月。该军拥有约245名正规军和少量预备役人员，是世界上规模最小的军队之一，总部位于圣约翰斯郊外的布利扎德营地。其职责包括维护国内安全、与海岸警卫队联合开展禁毒巡逻、保护渔业资源和参与灾害救援，并且从未干预过该国的政治事务。\n\n作为执政联盟，它将在各党派无法应对的紧急情况下代表军官团进行政府运作，安全部门将以维护秩序和打击毒品交易为由，管理港口和公共部门的工资发放。它的优势在于它是岛上唯一的武装力量；它的劣势在于，如果没有警察、公务员以及加勒比邻国的容忍，它规模太小，无法有效执政。"
 AUS.liberalism_neos: "£generic_liberalism_small (NEOS) - 新奥地利和自由论坛"
 AUS.liberalism_neos_desc: "（自由主义）- 新奥地利和自由论坛\n\n新奥地利和自由论坛由马蒂亚斯·斯特罗尔茨于2012年创立，最初是一个反对两大政党垄断的公民运动。后来，它吸收了自由论坛，并自诩为奥地利自由主义传统的继承者。该党倡导教育改革、养老金改革、降低非工资劳动成本、精简联邦制以及深化欧盟合作，并隶属于欧洲自由民主联盟和复兴欧洲党团。\n\n在贝娅特·迈因尔-雷辛格的领导下，该党已从抗议转向争取执政，并将自身定位为可加入两大传统政治联盟的改革派伙伴。其支持者主要是维也纳及大学城受过良好教育的城市选民，这些选民在绿党或人民党展现出竞争力时，可能会转而支持这些政党。"
 AUS.anarchist_communism_slp: "£AUS_emerging_left_wing_radical (SLP) - 社会左翼党"
 AUS.anarchist_communism_slp_icon: "£AUS_emerging_left_wing_radical"
 AUS.anarchist_communism_slp_desc: "（托洛茨基主义）- 社会左翼党\n\n社会左翼党是社会主义前进党在2000年反对自由党加入政府的抗议活动中更名而来，当时该组织决定以独立政党的身份参选。它是工人国际委员会（后并入国际社会主义替代组织）的奥地利分支，并继承了其前身的革命社会主义纲领，主张在工人控制下实现国有化，并以工人欧洲取代欧盟。\n\n该党在选举中影响力微乎其微，国家情报部门将其列为左翼极端组织；它拥有一支纪律严明的数百人干部队伍，开展反法西斯运动，反对自由党，并在学徒、学生和移民青年中开展宣传活动。它将共产党和绿党视为改革的障碍，而非盟友。"
 AUS.oligarchism_ts: "£generic_oligarchism_small (TS) - 奥地利斯特罗纳赫团队"
 AUS.oligarchism_ts_desc: "（经济自由主义）- 奥地利斯特罗纳赫团队\n\n斯特罗纳赫团队是弗兰克·斯特罗纳赫的政党。这位奥地利裔加拿大人是麦格纳汽车帝国的创始人，他于2012年回到祖国奥地利，围绕自身及其资金建立了一个政治运动。该党主张实行单一税率、缩小政府规模、废除征兵制、恢复本国货币与欧元并行的体系，并对联合执政政党中的职业政客普遍持蔑视态度。所有这些都体现在创始人提出的“真实、透明、公平”的口号中。\n\n该党通过现任议员的叛逃进入议会，几乎完全由斯特罗纳赫本人资助，事实证明，该党更擅长赢得选票，而不是维系党团团结，其州和联邦团体成立之初便迅速瓦解。"
 AUS.neutral_Social_jetzt: "£generic_neutral_Social_small (JETZT) - 现在－皮尔茨名单"
 AUS.neutral_Social_jetzt_desc: "（左翼民粹主义）- 现在－皮尔茨名单\n\n现在是彼得·皮尔茨名单于2018年采用的名称，旨在使其成为一个政党而非个人工具。玛丽亚·斯特恩担任主席，其纲领包括社会正义、财富再分配、反对政治伊斯兰以及倡导透明和管控的廉洁政治。该党立场介于社会民主党和绿党之间，并与两者争夺城市左翼的抗议选票。\n\n更名并未解决其预期的问题。该党仍然与皮尔茨紧密相连，议员们因辞职和叛逃而不断流失；最终只剩下一个小型协会和一个供其创始人进行调查报道的媒体平台。"
 AUS.Neutral_Communism_ki: "£generic_Neutral_Communism_small (KI) - 共产主义倡议"
 AUS.Neutral_Communism_ki_desc: "（马列主义）- 共产主义倡议\n\n共产主义倡议组织由奥托·布鲁克纳和一群马克思列宁主义异见人士于2005年创立。他们因抗议奥地利共产党向广泛的民主左翼靠拢并接受欧盟而退出该党。该组织寻求重建一个工人阶级的列宁主义政党，捍卫二十世纪的社会主义经验，反对北约和欧盟，并声援古巴和东方各国的共产党。\n\n这是一个由维也纳和工业城镇组成的小组织，积极参与罢工声援、反法西斯工作和纪念抵抗运动，它认为自己是未来共产党的雏形，而不是一个独立的政党。"
 AUS.Neutral_Communism_pda: "£generic_Neutral_Communism_small (PdA) - 奥地利劳动党"
 AUS.Neutral_Communism_pda_desc: "（马列主义）- 奥地利劳动党\n\n奥地利劳动党于2013年由共产主义倡议组织和其他马克思列宁主义团体创立，旨在作为奥地利共产党的正统共产主义替代方案。该党认为奥地利共产党已放弃阶级斗争，转而从事市政社会工作。奥地利劳动党秉承共产主义倡议组织的纲领，即建立工人阶级的列宁主义政党并实现生产资料社会化，同时声援希腊共产党，并参与国际共产党和工人党会议以及欧洲共产主义行动。\n\n该党由奥托·布鲁克纳和蒂博尔·岑克尔先后领导，仅在维也纳偶尔参加地区选举，主要通过其报纸、青年组织以及罢工和反法西斯声援活动开展工作。它坚持意识形态上的一致性，而共产党则强调实用主义，但其规模远小于共产党。"
 AUS.Nat_Fascism: "£generic_Nat_Fascism_small (NVP) - 国家人民党"
 AUS.Nat_Fascism_desc: "（新纳粹主义）- 国家人民党\n\n奥地利国家人民党由君特·雷哈克和几名德国民族主义边缘运动的老兵于2007年创立，旨在建立一个比自由党更右翼的公开民族主义政党，其模式效仿德国国家人民党，并与后者保持联系。该党宣扬一种血统和土地的民族主义，主张驱逐外国人，拒绝加入欧盟和奥地利共和国的反纳粹共识。奥地利抵抗运动文献中心将该党的纲领（部分内容抄袭自二战时期的党卫军训练手册）归类为新纳粹主义和仇外主义。\n\n它从未成功参加过选举，既被当局阻挠，也因为自身无法收集到足够的签名而无法出现在选票上。它目前以注册章程、网站和数十名因违反《禁止法》而接受调查的活动人士的形式存在。它标志着奥地利合法民族主义政治的边缘。"
 AUS.Monarchist_sga: "£generic_Monarchist_small (SGA) - 黑黄联盟"
 AUS.Monarchist_sga_desc: "（君主主义）- 黑黄联盟\n\n黑黄联盟是一个君主主义组织，于2004年在皇帝的夏宫巴德伊施尔成立，旨在通过全民公投恢复哈布斯堡王朝的君主立宪制，并推动旧帝国各继承国联合，实行统一的君主制。该联盟呼吁废除驱逐皇室成员和废除贵族头衔的法律，支持征兵制，推行更严格的移民政策，并对欧盟持怀疑而非敌对的态度。乌尔里希·哈布斯堡-洛林是该联盟的赞助人之一。\n\n它与其说是一个注册政党，不如说是一个协会，从未成功收集到足够的签名来竞选国民议会；其工作主要是发起请愿、举办纪念活动，并在受过教育的虔诚教徒中唤起对多瑙河君主制的怀旧之情。哈布斯堡王朝本身已与共和国达成和解，并保持距离。"
 AZE.conservatism: "£AZE_non_aligned_moderate_islamist (MÜSAVAT) - 平等党"
 AZE.conservatism_icon: "£AZE_non_aligned_moderate_islamist"
 AZE.conservatism_desc: "（自由保守主义）- 平等党\n\n平等党于1911年在巴库成立，1913年起由马梅德·阿明·拉苏尔扎德领导，并于1918年至1920年执政阿塞拜疆民主共和国，这是穆斯林世界第一个议会制共和国。该党于1992年在人民阵线政府议长伊萨·甘巴尔的领导下重建，并宣称继承共和国国旗、其创始人以及突厥主义、现代性和伊斯兰传统的三大支柱。其纲领包括民族独立、自由民主、公民民族​​主义、以团结取代阶级斗争以及市场经济，并自认为属于欧洲自由主义阵营。\n\n平等党是反对党中组织最严密的，拥有全国性的网络，其领导人通常是反对派的总统候选人。每次选举争议后，该党都成为政权最严厉打击的目标。平等党的优势在于其悠久的历史和强大的干部队伍；它与人民阵线的竞争，正是围绕着同一批选民和对民主共和国遗产的共同诉求。"
 AZE.Conservative: "£generic_Conservative_small (VBP) - 公民团结党"
 AZE.Conservative_desc: "（后苏联时代的复辟主义）- 公民团结党\n\n公民团结党由阿亚兹·穆塔利博夫于1999年在莫斯科创立。穆塔利博夫是阿塞拜疆共产党最后一任第一书记，也是独立后的阿塞拜疆共和国首任总统。1992年霍贾利大屠杀后，他被迫下台，并在俄罗斯流亡二十年。该党存在的目的是为了促成其创始人穆塔利博夫回国，与俄罗斯建立战略联盟，以秩序和稳定取代民族主义实验，并实现旧官僚阶层与新国家的和解。\n\n在伊克巴尔·阿加扎德和萨比尔·哈吉耶夫的领导下，该党的议会派系才是其在阿富汗的真正存在。该党的历史充满了分裂：一方主张与政权对抗，另一方则主张与政权媾和。老一辈人仍然怀有对苏联秩序的记忆，但穆塔利博夫本人却因霍贾利事件而为人所铭记。"
 AZE.Mod_Vilayat_e_Faqih: "£generic_Mod_Vilayat_e_Faqih_small (AİP) - 阿塞拜疆伊斯兰党"
 AZE.Mod_Vilayat_e_Faqih_desc: "（什叶派伊斯兰主义）- 阿塞拜疆伊斯兰党\n\n阿塞拜疆伊斯兰党于1991年由哈吉·阿里克拉姆·阿利耶夫在阿布歇隆半岛的什叶派朝圣村纳尔达兰创立。该党寻求建立伊朗模式的伊斯兰共和国，实现世俗社会的道德革新，主张与伊朗友好，敌视以色列、美国和泛突厥主义。该党于1992年注册，1995年注册被撤销，其领导人随后被判犯有为德黑兰从事间谍活动的罪行，此后该党一直处于非法状态。\n\n其大本营位于纳尔达兰省以及阿布歇隆和南部地区的什叶派村庄，在那里组织阿舒拉节游行和抗议关闭清真寺、学校禁止佩戴头巾的活动。其领导人莫夫苏姆·萨马多夫曾多次入狱服刑。该组织拥有世俗反对派无法触及的虔诚支持者，但伊朗政权将其视为第五纵队，而世俗多数派也对其抱有怀疑。"
 AZE.Caliphate_1_desc: "（萨拉菲圣战主义）- 伊斯兰国-阿塞拜疆省\n\n“阿塞拜疆省”是伊斯兰国在该国的追随者于2019年宣誓效忠哈里发时使用的名称，它从松散的“高加索省”发展成为一个独立的分支。它继承了其前身的纲领，并增加了对世俗共和国和什叶派多数群体的“开除教籍”、对国家和外国利益的武装袭击，同时在北部地区的逊尼派萨拉菲青年以及俄罗斯和土耳其的侨民中招募成员。\n\n它与其说是一场叛乱，不如说是一个由多个小组组成的网络，依赖于回流人员和境外指挥，并受到国家安全局动用政权全部反恐力量的追捕。哈里发国的名号首先吸引的是安全部门的注意，而非招募人员。"
 AZE.oligarchism: "£generic_oligarchism_small (ASK) - 阿塞拜疆全国企业家联合会"
 AZE.oligarchism_desc: "（商业利益）- 阿塞拜疆全国企业家联合会\n\n阿塞拜疆全国企业家联合会是雇主组织，由马梅德·穆萨耶夫于1999年创立，旨在代表阿塞拜疆企业参与由政府和工会组成的三方委员会、国际劳工组织以及突厥语系和里海沿岸国家的商会。它并非政党，而是围绕石油繁荣、建筑合同和国家垄断而发展起来的商业阶层的有组织的代言人。\n\n作为一支政治力量，它捍卫其成员已享有的权益：低税收、宽松的监管、免受外国竞争的保护以及私有化收益，并且从未反对过赋予这些权益的政府。该国最大的财富与国家息息相关，而该联盟则代表着那些依赖国家利益的人们发声。"
 AZE.Neutral_Libertarian: "£generic_Neutral_Libertarian_small (ALP) - 阿塞拜疆自由党"
 AZE.Neutral_Libertarian_desc: "（古典自由主义）- 阿塞拜疆自由党\n\n阿塞拜疆自由党由拉拉·舍夫凯特于1995年在巴尔达创立。舍夫凯特是一位医生兼外交官，曾任盖达尔·阿利耶夫政府国务秘书，后因不满其统治而辞职。该党隶属于自由国际。它倡导法治、个人自由、摆脱国家垄断的市场经济、妇女权利以及融入欧洲，一直是反对派中最坚定地捍卫法治、反对街头政治的声音。\n\n这是一个由巴库专业人士组成的小党派，依靠其创始人的声誉和她偶尔的总统候选人资格。在她退出领导层后，该党派仅以名称而非组织的形式存在。其在海外的原则性声誉远胜于其在国内的支持者，因为在国内，自由派选票大多流向了平等党和人民阵线。"
 AZE.Neutral_green: "£generic_Neutral_green_small (AYP) - 阿塞拜疆绿党"
 AZE.Neutral_green_desc: "（环保主义）- 阿塞拜疆绿党\n\n阿塞拜疆绿党于2006年在巴库由马伊斯·古拉利耶夫领导的代表大会上成立，欧洲绿党和格鲁吉亚绿党也派代表出席。该党致力于保护里海和阿布歇隆半岛免受石油工业污染，保护库拉河和阿拉斯河免受上游污染，倡导以可持续发展取代石油经济，并维护人权和民主。阿塞拜疆绿党以观察员身份加入欧洲绿党。\n\n司法部从未批准其注册，因此它以环保人士和人权捍卫者运动的形式存在，而非可以参加选举的政党。在一个财政预算依赖于石油行业的州，它代表着人们对环境问题的不满。"
 AZE.neutral_Social: "£AZE_western_social_democrat (ASRP) - 社会繁荣党"
 AZE.neutral_Social_icon: "£AZE_western_social_democrat"
 AZE.neutral_Social_desc: "（社会民主主义）- 社会繁荣党\n\n社会繁荣党由经济学教授、比拉苏瓦尔选区议员汗胡塞因·卡齐姆利于1995年创立。该党承诺推行社会福利、混合经济、扶持地方和农村贫困人口，并与当时的政府保持忠诚合作。这是一个单一选区、单一家族的政党，由创始人传给了他的女儿。\n\n它的纲领与政府的纲领相差无几，而且它是为数不多的几个忠诚的小党派之一，正是这些小党派让议会看起来多元化。创始人在比拉苏瓦尔的当地声望是它唯一的优势。"
 AZE.Neutral_Communism: "£generic_Neutral_Communism_small (AVKP) - 阿塞拜疆联合共产党"
 AZE.Neutral_Communism_desc: "（马列主义）- 阿塞拜疆联合共产党\n\n阿塞拜疆联合共产党由萨亚德·萨亚多夫于1993年创立，旨在与苏联共产党竞争，主张恢复社会主义和苏联政权，实行石油工业公有制，联合前苏联各加盟共和国，并反对北约和西方石油公司。该党出版《共产主义者》报纸，声称在退休人员和老工业区的工人中拥有数千名党员。\n\n1997年的分裂使该党分成两派，萨亚多夫领导下的登记派和穆萨·图卡诺夫领导下的未登记多数派，后者希望与俄罗斯和白俄罗斯合并，从那时起，这两派就一直在争夺这个名字。它依赖于一代人的忠诚，他们记得苏联的秩序、阿塞拜疆共产党所声称的同样的遗产和同样的选民。"
 AZE.Nat_Populism: "£generic_Nat_Populism_small (BAXCP) - 阿塞拜疆全民阵线党"
 AZE.Nat_Populism_desc: "（民族保守主义）- 阿塞拜疆全民阵线党\n\n全阿塞拜疆人民阵线党由古德拉特·哈桑古利耶夫于2004年创立。哈桑古利耶夫曾是人民阵线的议员，因与阿里·卡里姆利领导层发生争执而退出该阵线。该党主张将所有阿塞拜疆人，包括生活在伊朗阿塞拜疆的数百万阿塞拜疆人，统一在一个国家，并奉行社会保守主义、经济自由主义，与土耳其保持紧密联系，以及收复卡拉巴赫。该党一度属于欧洲保守派和改革派阵营。\n\n该党由其创始人创立，是议会的常客，也是总统候选人的常客。它扮演着全国反对党的角色，一方面批评政府的外交政策，另一方面在国内投票时却与政府保持一致。领土收复主义思想确实拥有一批拥护者，但当政权需要时，也会利用同样的思想，这使得该党几乎没有独特的政治空间。"
 AZE.Nat_Populism_ehd: "£generic_Nat_Populism_small (ƏHD) - 正义、法律、民主党"
 AZE.Nat_Populism_ehd_desc: "（民族保守主义）- 正义、法律、民主党\n\n正义、法律、民主党是古德拉特·哈桑古利耶夫领导下的全阿塞拜疆人民阵线党于2024年更名的政党，摒弃了“人民阵线”的名称及其领土收复主义主张。该党现在强调法治、高效国家、社会保守主义和经济自由主义，并主张与土耳其保持紧密联系，支持纳戈尔诺-卡拉巴赫事业。\n\n更名标志着该党完成了从反对派中的民族主义分裂势力到效忠体制政党的转变。它仍然是一个由其创始人定义的政党。"
 BAH.Neutral_conservatism: "£generic_Neutral_conservatism_small (BCP) - 巴哈马宪法党"
 BAH.Neutral_conservatism_desc: "（基督教保守主义）- 巴哈马宪法党\n\n巴哈马宪法党是一个规模较小的基督教保守党，由其创始人兼领导人阿里·麦金托什领导。该党认为基督教原则和精神价值观必须融入国家领导层，并主张宪政民主、法治、家庭和道德保守主义，自诩为两大现有政党之外的另一种选择，而非其中任何一个政党内部的派系。\n\n它的影响力在于教会的选票，以及将道德和宪法问题强加到一场两大政党更愿意在经济问题上争夺的竞选活动中。"
 BAH.oligarchism: "£generic_oligarchism_small (BCC) - 巴哈马商会"
 BAH.oligarchism_desc: "（社团主义）- 巴哈马商会\n\n巴哈马商会是拿骚商界和金融精英的代言人，代表着主导巴哈马经济的旅游业、银行业和零售业。商会游说政府推行低税收、宽松监管、建立具有竞争力的离岸金融业，并向外国投资敞开大门。商会还将捍卫巴哈马的避税天堂地位视为国家利益，认为其不受外部压力影响。\n\n如果组成一个统治集团，它将代表由湾街的商业集团进行统治，政策在董事会会议室制定，而不是在投票箱中制定，国家沦为酒店和银行的服务提供商。"
 BAH.oligarchism_2011: "£generic_oligarchism_small (BCCEC) - 巴哈马商会和雇主联合会"
 BAH.oligarchism_2011_desc: "（社团主义）- 巴哈马商会和雇主联合会\n\n巴哈马商会暨雇主联合会是商会和雇主团体的合并机构，成立于2011年，代表着旅游、银行和零售等行业的数百家公司。该联合会致力于游说政府，争取低税收、宽松监管、灵活的劳动法和具有竞争力的离岸金融业，并将捍卫巴哈马的避税天堂地位视为国家利益。\n\n如果组成一个统治集团，它将代表由湾街的商业集团进行统治，政策在董事会会议室制定，而不是在投票箱中制定，国家沦为酒店和银行的服务提供商。"
 BAH.Neutral_Libertarian: "£generic_Neutral_Libertarian_small (DNA) - 民主民族联盟"
 BAH.Neutral_Libertarian_desc: "（经济自由主义）- 民主民族联盟\n\n民主民族联盟是一个中间派第三党，由前自由国民运动部长布兰维尔·麦卡特尼于2011年创立。麦卡特尼脱离自由国民运动，挑战两党垄断的政治格局。该党主张财政保守主义、经济自由主义、精英统治和透明政府，推行亲市场政策，并承诺向被现有政治机器拒之门外的年轻专业人士开放政治舞台。\n\n它很少在议会中发挥作用；它旨在通过促使大党走向小政府、竞争性招标和问责制来塑造辩论，并为失望的选民在自由民族运动-进步自由党竞争之外提供一个归宿。"
 BAH.Nat_Populism: "£generic_Nat_Populism_small (COI) - 独立人士联盟"
 BAH.Nat_Populism_desc: "（本土民粹主义）- 独立人士联盟\n\n独立人士联盟是一个本土民粹主义政党，于2021年由公民运动“巴哈马进化”发展而来，由前警官、现任脱口秀主持人林肯·贝恩领导。该党以“巴哈马人优先”为竞选纲领，主张加强移民执法，重点打击海地贫民窟；建立主权财富基金，确保国家自然资源掌握在巴哈马人手中；以及实行权力下放的岛屿政府。\n\n其风格强硬，贝恩亲自带头对贫民窟采取直接行动，批评者称其带有仇外心理。其优势在于反移民选票以及贝恩在步入政坛前积累的电台脱口秀听众，并以此迫使现有政党屈服于其立场。"
 BAH.Monarchist: "£generic_Monarchist_small (HOW) - 温莎王室"
 BAH.Monarchist_desc: "（立宪君主主义）- 温莎王室\n\n温莎王室\统治着巴哈马，巴哈马是英联邦成员国。君主由巴哈马总督代表，总督负责批准法律、召集和解散议会，并任命参议员和法官。在自由民族运动党和进步自由党的竞争中，王室凌驾于宪法延续性之上，其地位由既得利益集团的共识所维系，而共和制问题则留待日后讨论。\n\n作为执政派别，它将拥护王室作为国家统一的基石，权力源自总督办公室而非各党派，并坚定地遵循英联邦和英国的法律传统。支持者称之为稳定；反对者则称其为殖民时代的遗物。"
 ISR.Western_Autocracy_mafdal: "£generic_Western_Autocracy_small (Mafdal) - 全国宗教党"
 ISR.Western_Autocracy_mafdal_desc: "（宗教犹太复国主义）- 全国宗教党\n\n成立于1956年的全国宗教党，半个世纪以来一直是宗教犹太复国主义的政治中心，也是工党和利库德集团领导的联合政府中的常客。该党最初在宗教事务上扮演中间派的角色，但自20世纪70年代起，随着定居者运动成为其核心支持者，该党逐渐右倾。在伊扎克·列维、埃菲·埃坦和泽武伦·奥尔列夫的领导下，该党反对任何领土让步。1999年和2003年，该党分别赢得5个和6个席位，2006年与全国联盟联合参选，在9个席位中赢得3个。2008年11月18日，该党解散并入犹太家园党。"
 ISR.conservatism_kadima: "£ISR_liberalism_alt1 (Kadima) - 前进"
 ISR.conservatism_kadima_icon: "£ISR_liberalism_alt1"
 ISR.conservatism_kadima_desc: "（自由犹太复国主义）- 前进\n\n2005年11月24日，阿里埃勒·沙龙因不满利库德集团单方面从加沙撤军而退出该集团，随后创立了前进党。他同时带走了埃胡德·奥尔默特、齐皮·利夫尼以及利库德集团的大部分前排议员。前进党是一个中间派、自由主义的犹太复国主义政党，其目标是在巴勒斯坦建国的同时确定以色列的边界。该党在2006年赢得29个席位，成为最大党，并在奥尔默特的领导下执政。2009年，利夫尼带领前进党赢得28个席位，但未能组建联合政府；2013年，在沙乌勒·莫法兹的领导下，前进党仅获得2个席位，并且没有参加2015年的选举。"
 ISR.neutral_Social_democrats: "£ISR_democrats (HaDemokratim) - 民主党 - 梅雷兹派"
 ISR.neutral_Social_democrats_icon: "£ISR_democrats"
 ISR.neutral_Social_democrats_desc: "（社会民主主义）- 民主党 - 梅雷兹派\n\n民主党成立于2024年，由工党和梅雷茨党于6月30日达成合并协议，并于7月12日在前副总参谋长亚伊尔·戈兰的领导下完成合并。梅雷茨党的这一派别融合了工党的公民自由、世俗主义和两国方案，以及其在特拉维夫左翼的群众基础，同时又保留了工党的社会民主主义和工会传统。该党在第25届以色列议会中拥有4个席位。"
 ISR.Nat_Populism_2021: "£generic_Nat_Populism_small (RZP) - 宗教犹太复国主义党"
 ISR.Nat_Populism_2021_desc: "（宗教犹太复国主义）- 宗教犹太复国主义党\n\n宗教犹太复国主义党是复兴党于2021年1月7日正式启用的名称，其主席为贝扎莱尔·斯莫特里奇，他自2019年起担任该党主席。该党奉行极右翼和极端民族主义，主张吞并西岸定居点、改革司法体系，并强化国家的宗教属性。2022年，该党与犹太力量党和愉悦党联合组建的“宗教犹太复国主义”名单赢得了14个席位，斯莫特里奇本人也出任财政部长，并拥有西岸地区民政管理权。2023年8月，该党吞并了“犹太家园党”，更名为“国家宗教 - 宗教犹太复国主义”。"
