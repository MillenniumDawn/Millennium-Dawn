 EU_show_available_desc_101_loc_key: "§C이 발의안은 유럽연합(EU) 일반 법안입니다.§!\n\n\"유럽의 여러 인민은 그들 사이에 그 어느 때보다 긴밀한 연합을 창출하면서, 공통의 가치를 바탕으로 평화로운 미래를 공유하기로 결의한다. 영적이고 도덕적인 유산을 자각하며, 연합은 인간의 존엄성, 자유, 평등, 연대라는 불가분의 보편적 가치 위에 설립된다. 연합은 민주주의와 법의 지배 원칙에 기반을 둔다.\" - 기본권 헌장 전문 -\n§Y유럽연합 기본권 헌장§!은 유럽연합(EU) 시민 및 거주자의 정치적, 사회적, 경제적 권리를 유럽 법률로 성문화합니다. 이 헌장은 유럽연합(EU)의 자유·안보·정의 영역(AFSJ) 정책 영역의 일부를 구성합니다. 이는 헌장의 조항에 따라 행동하고 입법해야 하는 유럽연합(EU) 및 유럽원자력공동체(Euratom)의 모든 영역에 적용됩니다."
 EU_show_available_desc_102_loc_key: "§C이 발의안은 유럽연합(EU) 일반 법안입니다.§!\n\n라켄 선언에 따라 유럽 정상회의는 연합의 미래에 관한 협의회를 소집하기로 결정했습니다. 이는 시민들을 위해 더 단순하면서도 본질적인 목표 추구에 강하고, 세계 무대에서 확실한 존재감을 드러내는 연합을 향한 결정적인 도약입니다."
 EU_show_available_desc_103_loc_key: "§C이 발의안은 유럽연합(EU) 일반 법안입니다.§!\n\n유럽 협의회는 유럽 헌법 제정을 위한 조약 초안 작성을 끝으로 막을 내렸습니다. 이 국제 조약은 기존 유럽 조약들을 대체하여 §C[EUU.GetFlag] 유럽연합(EU)§!을 위한 통합 헌법을 제정하고, 기존에 회원국 간의 만장일치로만 결정되던 정책 영역들에까지 가중다수결(QMV) 방식을 확대 적용합니다."
 EU_show_available_desc_104_loc_key: "§C이 발의안은 유럽연합(EU) 일반 법안입니다.§!\n\n리스본 조약으로 이어지는 일련의 과정은 유럽 헌법 비준이 무산된 결과에서 비롯되었습니다. 리스본 조약은 유럽연합 조약(TEU) 및 유럽공동체 설립 조약을 개정합니다. 이 중 후자는 '유럽연합 기능 조약(TFEU)'으로 명칭이 변경됩니다."
 EU_show_available_desc_105_loc_key: "§9이 발의안은 유럽연합(EU) 관직 법안입니다.§!\n\n유럽 대외활동청(EEAS)은 유럽연합(EU)의 외교 업무를 전담하는 기관입니다. 유럽연합(EU)의 외교안보 총책임자인 외교안보정책 고위대표가 연합의 공동외교안보정책(CFSP)을 수행할 수 있도록 지원합니다."
 EU_show_available_desc_201_loc_key: "§G이 발의안은 유럽연합(EU) 경제 법안입니다.§!\n\n유럽중앙은행(ECB)이 통화 정책 결정을 실행에 옮기기로 결정함에 따라, 유럽중앙은행(ECB) 정책이사회는 새로운 통화 정책 수단 및 절차 세트를 채택했습니다. 유로시스템 통화 정책 및 수단에 관한 일반 문서에는 유럽중앙은행(ECB)이 이러한 도구들을 어떻게, 어느 정도까지 활용할 수 있는지가 명시되어 있습니다. 이러한 수단 중 하나인 유럽중앙은행(ECB) 제로 금리 정책은 유럽중앙은행(ECB)이 설정한 목표들을 달성하는 데 도움을 줄 것입니다."
 EU_show_available_desc_202_loc_key: "§G이 발의안은 유럽연합(EU) 경제 법안입니다.§!\n\n최근의 금융 위기에 대응하여 단일 시장 내 안전한 금융 부문을 조성하기 위해 유럽은행연합(EBU)이 창설되었습니다. 이러한 계획들은 유럽연합(EU) 회원국 내 모든 금융 주체들을 위한 단일 규정집을 형성합니다. 여기에는 은행에 대한 건전성 규제 강화, 예금자 보호 개선, 파산 은행 관리를 위한 규칙 등이 포함됩니다."
 EU_show_available_desc_203_loc_key: "§G이 발의안은 유럽연합(EU) 경제 법안입니다.§!\n\n유로본드는 공공 부채 조달을 위한 새로운 선택지입니다. 유로존 회원국들의 이러한 공동 채권 발행은 통화 동맹의 심각한 심화를 의미합니다. 이는 안전하고 유동적인 투자 기회를 저축가와 금융 기관에 제공하고 미국 채권 시장과 맞먹는 유로본드 시장을 조성함으로써, 각국 정부가 부채를 조달하는 새로운 수단을 창출할 것입니다."
 EU_show_available_desc_204_loc_key: "§G이 발의안은 유럽연합(EU) 경제 법안입니다.§!\n\n유럽재정안정기금(EFSF)은 유럽 부채 위기 당시 유로 지역 회원국들이 임시 위기 해결 메커니즘으로 창설하여 여러 회원국에 재정 지원을 제공했습니다. 이는 유럽재정안정기금(EFSF)이 자본 시장에서 채권 및 기타 채무 상품을 발행하여 자금을 조달하는 방식으로 이루어졌습니다. 현재 이 임무는 유로안정화기구(ESM)가 전담하고 있으므로 유럽재정안정기금(EFSF)은 더 이상 재정 지원을 제공하지 않습니다."
 EU_show_available_desc_205_loc_key: "§G이 발의안은 유럽연합(EU) 경제 법안입니다.§!\n\n유로안정화기구(ESM)의 임무는 심각한 자금 조달 문제를 겪고 있거나 위협받는 유로 지역 국가들에게 재정 지원을 제공하는 것입니다. 이 지원은 유로 지역 전체와 유로안정화기구(ESM) 회원국들의 재정 안정성을 수호하기 위해 반드시 필요하다고 입증된 경우에만 부여됩니다."
 EU_show_available_desc_206_loc_key: "§G이 발의안은 유럽연합(EU) 경제 법안입니다.§!\n\n재정 동맹은 회원국들이 동일한 공통 예산을 공유하는 것을 의미합니다. 즉 지출 및 세율 수치를 중앙 재정 당국이 결정하게 됩니다. 재정 동맹은 유럽 통합을 더 진전시키기 위한 단계로 제안되었습니다. 이는 중앙 유럽 당국이 모든 회원국의 지출 및 세율을 설정함을 의미합니다."
 EU_show_available_desc_207_loc_key: "§G이 발의안은 유럽연합(EU) 경제 법안입니다.§!\n\n유럽 경제 정부는 유럽연합(EU) 내에서 공통적인 재정 및 적극적인 경제 정책을 가능하게 할 것입니다. 이는 §C[EUU.GetFlag] 유럽연합(EU)§!에 자체적인 조세 당국을 부여하며, 중앙 당국이 회원국들의 최저 임금을 설정하게 됩니다."
 EU_show_available_desc_208_loc_key: "§G이 발의안은 유럽연합(EU) 경제 법안입니다.§!\n\n유럽 경제재정장관은 재정 동맹과 유럽 경제 정부가 수립한 정책과 권한을 하나의 직위로 통합합니다."
 EU_show_available_desc_301_loc_key: "§R이 발의안은 유럽연합(EU) 군사 법안입니다.§!\n\n유럽방위청(EDA)은 위기관리 분야에서 유럽의 방위 역량을 개선하고, 현재의 안보방위정책을 유지하며 향후 발전을 모색하려는 회원국과 §C[EUU.GetFlag] 유럽연합(EU)§!의 노력을 지원하기 위해 설립되었습니다."
 EU_show_available_desc_302_loc_key: "§R이 발의안은 유럽연합(EU) 군사 법안입니다.§!\n\n상설안보협력체(PESCO)를 통해 의지와 역량을 갖춘 회원국들이 공동으로 방위 역량 프로젝트를 계획, 개발, 투자하며 자국 군대의 작전 준비 태세와 기여도를 제고할 수 있습니다. 궁극적인 목적은 일관된 전영역 작전 전력 패키지를 공동 개발하여, 국가적 및 다국적 임무와 작전을 수행하는 회원국들이 이 역량을 활용할 수 있도록 하는 것입니다."
 EU_show_available_desc_303_loc_key: "§R이 발의안은 유럽연합(EU) 군사 법안입니다.§!\n\n유럽방위기금(EDF)은 시민을 보호하고 수호하는 유럽의 전략적 자율성에 핵심적인 기여를 할 것입니다. 이는 첨단 방위 기술 및 제품을 개발하고 혁신을 촉진하기 위해 방산업체 간, 그리고 유럽연합(EU) 국가 간의 방산 협력을 장려할 것입니다. 기금은 국가적인 방위 투자를 조율하고, 보완하며, 증폭시킬 것입니다."
 EU_show_available_desc_304_loc_key: "§R이 발의안은 유럽연합(EU) 군사 법안입니다.§!\n\n유럽안전보장이사회(ESC)는 유럽연합(EU)이 국제 정세에 대한 결정을 더 훌륭하게 준비할 수 있도록 만들 것입니다. 유럽연합(EU)이 일관된 결정을 더 신속하게 내리고 이행하지 못한다면, 유럽연합(EU) 규칙을 집행하고 다자간 협력 체계를 강화할 수 있는 능력이 약화될 것입니다. 따라서 유럽연합(EU)의 외교적, 재정적, 군사적 자원은 더 효과적인 정부 간 협력 체계를 통해 보완되어야 합니다."
 EU_show_available_desc_305_loc_key: "§9이 발의안은 유럽연합(EU) 직위 법안입니다.§!\n\n§C[EUU.GetFlag] 유럽연합(EU)§!의 군사적 역량을 강화하기 위해 회원국들은 공동 군대를 창설할 수 있습니다. 이 군대는 §Y유로아미(EuroArmy)§!로 명명될 것입니다."
 EU_show_available_desc_306_loc_key: "§9이 발의안은 유럽연합(EU) 직위 법안입니다.§!\n\n21세기에 접어들어 다국적 함대와 기동부대가 더욱 일반화되고 중요해짐에 따라, §C[EUU.GetFlag] 유럽연합(EU)§! 회원국들은 힘을 합쳐 자국의 군함들을 §Y유로네이비(EuroNavy)§!로 알려진 통합 유럽 해군 사령부로 이관할 수 있습니다."
 EU_show_available_desc_307_loc_key: "§9이 발의안은 유럽연합(EU) 직위 법안입니다.§!\n\n회원국들은 유럽연합(EU)이 유엔 안전보장이사회(UNSC) 상임이사국이 되어야 한다고 결정했습니다. 이는 유엔 안보리(UNSC)를 개혁하거나, 기존에 안보리 상임이사국이던 회원국의 의석을 유럽연합(EU)으로 이관하는 방식으로 이루어집니다."
 EU_show_available_desc_308_loc_key: "§C이 발의안은 유럽연합(EU) 일반 법안입니다.§!\n\n핵보유국이 되는 것은 유럽연합(EU)의 정치력과 세계에 미치는 연합의 영향력을 강화할 것입니다. 연합은 회원국들의 핵무기를 이전 및 공유받거나, 자체적인 핵탄두를 개발함으로써 핵무기를 획득하게 됩니다."
 EU_show_available_desc_401_loc_key: "§C이 발의안은 유럽연합(EU) 일반 법안입니다.§!\n\n유럽연합(EU) 일반데이터보호규정(GDPR)은 유럽 전역의 데이터 프라이버시 법률을 조화시키고, 모든 유럽연합(EU) 시민의 데이터 프라이버시를 보호 및 강화하며, 역내 조직들이 데이터 프라이버시를 다루는 방식을 재편하기 위해 고안되었습니다."
 EU_show_available_desc_402_loc_key: "§C이 발의안은 유럽연합(EU) 일반 법안입니다.§!\n\n디지털 기술은 창작 콘텐츠가 제작, 배포, 소비되는 방식을 급격히 변화시켰습니다. 우리는 문화적 다양성을 존중하는 유럽의 새로운 소비 행태에 맞춰 유럽연합(EU) 저작권 규칙을 개편하고 있습니다."
 EU_show_available_desc_403_loc_key: "§p이 발의안은 유럽연합(EU) 이민/국경 통제 법안입니다.§!\n\n더블린 II 규정은 오직 하나의 회원국만이 망명 신청을 심사할 책임을 진다는 원칙을 확립합니다. 이 목적은 망명 신청자가 여러 국가로 이리저리 내몰리는 것을 방지하고, 한 사람이 여러 국가에 망명을 중복 신청하여 시스템을 악용하는 것을 막는 데 있습니다."
 EU_show_available_desc_404_loc_key: "§p이 발의안은 유럽연합(EU) 이민/국경 통제 법안입니다.§!\n\n신청이 성공적으로 처리될 확률이 높은 망명 신청자들을 그들이 처음 도착한 그리스와 이탈리아에서 망명 신청을 심사받을 다른 회원국들로 재배치합니다. 이 심사가 통과되면, 신청자들은 재배치된 회원국에 거주할 권리와 함께 난민 지위를 부여받게 됩니다."
 EU_show_available_desc_405_loc_key: "§p이 발의안은 유럽연합(EU) 이민/국경 통제 법안입니다.§!\n\n§C[EUU.GetFlag] 유럽연합(EU)§!과 [TUR.GetNameWithFlag]은(는) 튀르키예에서 유럽으로 유입되는 비정규 이민자들의 흐름을 막기 위한 협정을 타결할 것입니다. 튀르키예를 거쳐 그리스 섬으로 도착한 신규 비정규 이민자 및 망명 신청자 중 망명 신청이 불허된 모든 이는 튀르키예로 송환됩니다. §C[EUU.GetFlag] 유럽연합(EU)§!은 튀르키예 내 난민 지원 시설을 위해 30억 유로를 지불할 것입니다."
 EU_show_available_desc_406_loc_key: "§p이 발의안은 유럽연합(EU) 이민/국경 통제 법안입니다.§!\n\n유럽집행위원회(EC)는 망명 절차 전반에 걸쳐 회원국들에게 신속하고 완벽한 서비스를 제공하는 데 필요한 권한, 수단, 재정적 자원을 갖춘 미래의 유럽망명청(EUAA) 설립을 제안했습니다."
 EU_show_available_desc_407_loc_key: "§p이 발의안은 유럽연합(EU) 이민/국경 통제 법안입니다.§!\n\n프론텍스(Frontex)는 유럽연합(EU) 국가 및 솅겐 협정 연합 국가들이 대외 국경을 관리하도록 돕습니다. 또한 유럽연합(EU) 전역의 국경 통제를 조화롭게 맞추는 데 기여합니다. 이 기관은 각 유럽연합(EU) 국가 국경 당국 간의 협력을 촉진하며 기술적 지원과 전문 지식을 제공합니다."
 EU_show_available_desc_408_loc_key: "§p이 발의안은 유럽연합(EU) 이민/국경 통제 법안입니다.§!\n\n프론텍스(Frontex)가 유럽국경해안경비청(EBCG)으로 거듭납니다. 최근 몇 년간 유럽의 대외 국경에는 유럽연합(EU)으로 입국하려는 이민자와 난민의 수가 전례 없이 급증했습니다. 대외 국경을 맞댄 국가들은 국경 통제에 대한 전적인 책임을 집니다. 그러나 프론텍스(Frontex)는 심각한 이민 압력에 직면한 유럽연합(EU) 국가들에게 추가적인 기술 지원을 제공할 수 있습니다."
 EU_show_available_desc_601_loc_key: "§O이 발의안은 유럽연합(EU) 확대 법안입니다.§!\n\n2004년 5월 1일, 인구 합계가 거의 7,500만 명에 달하는 10개 신규 국가가 유럽연합(EU)에 합류했습니다. 25개 회원국으로 구성된 유럽연합(EU)은 이제 4억 5,000만 명의 시민을 품게 되었으며, 구소련 소속 3개 공화국(§Y[EST.GetNameWithFlag]§!, §Y[LAT.GetNameWithFlag]§!, §Y[LIT.GetNameWithFlag]§!), 구소련 위성국 4개국(§Y[POL.GetNameWithFlag]§!, §Y[CZE.GetNameWithFlag]§!, §Y[HUN.GetNameWithFlag]§!, §Y[SLO.GetNameWithFlag]§!), 구유고슬라비아 소속 공화국 1개국(§Y[SLV.GetNameWithFlag]§!) 및 지중해 섬나라 2개국(§Y[CYP.GetNameWithFlag]§!, §Y[MLT.GetNameWithFlag]§!)이 포함됩니다."
 EU_show_available_desc_602_loc_key: "§O이 발의안은 유럽연합(EU) 확대 법안입니다.§!\n\n동유럽의 2개 국가인 §Y[BUL.GetNameWithFlag]§!과(와) §Y[ROM.GetNameWithFlag]§!이(가) 유럽연합(EU)에 합류함에 따라 회원국 수는 27개국으로 늘어납니다."
 EU_show_available_desc_603_loc_key: "§O이 발의안은 유럽연합(EU) 확대 법안입니다.§!\n\n2013년 §Y[CRO.GetNameWithFlag]§!이(가) 유럽연합(EU)에 합류함에 따라 회원국 수는 28개국으로 늘어났습니다."
 EU_show_available_desc_605_loc_key: "§O이 발의안은 유럽연합(EU) 확대 법안입니다.§!\n\n서발칸 국가인 §Y[ALB.GetNameWithFlag]§!, §Y[SER.GetNameWithFlag]§!, §Y[MNT.GetNameWithFlag]§!, §Y[FYR.GetNameWithFlag]§!, §Y[BOS.GetNameWithFlag]§! 및 §Y[KOS.GetNameWithFlag]§!이(가) §C[EUU.GetFlag] 유럽연합(EU)§! 가입 후보국이 됩니다."
 EU_show_available_desc_606_loc_key: "§O이 발의안은 유럽연합(EU) 확대 법안입니다.§!\n\n§Y[TUR.GetNameWithFlag]§!이(가) §C[EUU.GetFlag] 유럽연합(EU)§! 가입 후보국이 됩니다."
 EU_show_available_desc_607_loc_key: "§O이 발의안은 유럽연합(EU) 확대 법안입니다.§!\n\n흑해 연안 국가인 §Y[MLV.GetNameWithFlag]§!과(와) §Y[UKR.GetNameWithFlag]§!이(가) §C[EUU.GetFlag] 유럽연합(EU)§! 가입 후보국이 됩니다."
 EU_show_available_desc_608_loc_key: "§O이 발의안은 유럽연합(EU) 확대 법안입니다.§!\n\n캅카스 지역 국가인 §Y[ARM.GetNameWithFlag]§!, §Y[AZE.GetNameWithFlag]§! 및 §Y[GEO.GetNameWithFlag]§!이(가) §C[EUU.GetFlag] 유럽연합(EU)§! 가입 후보국이 됩니다."
 EU_show_available_desc_609_loc_key: "§O이 발의안은 유럽연합(EU) 확대 법안입니다.§!\n\n유럽경제지역(EEA) 소속의 비유럽연합(EU) 국가(§Y[SWI.GetNameWithFlag]§!, §Y[NRY.GetNameWithFlag]§!, §Y[ICE.GetNameWithFlag]§!) 및 유럽의 극소 국가(§Y[HLS.GetNameWithFlag]§!, §Y[SMA.GetNameWithFlag]§!, §Y[MNC.GetNameWithFlag]§!, §Y[ADO.GetNameWithFlag]§!, §Y[LIC.GetNameWithFlag]§!)들이 §C[EUU.GetFlag] 유럽연합(EU)§! 가입 후보국이 됩니다."
 EU_show_available_desc_610_loc_key: "§O이 발의안은 유럽연합(EU) 확대 법안입니다.§!\n\n§Y[BLR.GetNameWithFlag]§!이(가) §C[EUU.GetFlag] 유럽연합(EU)§! 가입 후보국이 됩니다."
 EU_show_available_desc_611_loc_key: "§O이 발의안은 유럽연합(EU) 확대 법안입니다.§!\n\n내부 확대는 기존 회원국의 해체나 분리 독립으로 생겨난 신생 국가들을 회원국으로 맞이하는 절차입니다. §Y[CRE.GetNameWithFlag]§!, §Y[SCL.GetNameWithFlag]§!, §Y[SCO.GetNameWithFlag]§!, §Y[VOJ.GetNameWithFlag]§!, §Y[WAS.GetNameWithFlag]§!, §Y[GAL.GetNameWithFlag]§!, §Y[SIL.GetNameWithFlag]§!, §Y[CAT.GetNameWithFlag]§!, §Y[SPA.GetNameWithFlag]§!, §Y[CNR.GetNameWithFlag]§!, §Y[NAV.GetNameWithFlag]§!, §Y[BAY.GetNameWithFlag]§!, §Y[GRN.GetNameWithFlag]§! 및 §R[RUS.GetNameWithFlag]§!이(가) 독립을 성취할 경우 §C[EUU.GetFlag] 유럽연합(EU)§! 가입 후보국이 될 수 있습니다."
 EU_show_available_desc_110_loc_key: "§Y이 발의안은 유럽연합(EU) 연방화 법안입니다.§!\n\n유럽 통합의 과정이 여기서 한 걸음 더 나아갈 경우 §C[EUU.GetFlag][EUU.GetName]§!의 연방화로 직결되는 단계에 도달했습니다."
 EU_show_available_desc_111_loc_key: "§Y이 발의안은 유럽연합(EU) 연방화 법안입니다.§!\n\n70년이 넘는 유럽 통합의 여정 끝에 §C[EUU.GetFlag][EUU.GetName]§! 회원국들은 자국의 주권을 포기하고 §C[EUU.GetFlag] 유럽 합중국§!을 결성하기로 결정했습니다."
 EU_show_available_desc_112_loc_key: "§Y이 발의안은 유럽연합(EU) 연방화 법안입니다.§!\n\n§C[EUU.GetFlag][EUU.GetName]§! 회원국들은 연합을 가중다수결(QMV)을 근본 원칙으로 삼고 §Y유럽 연방 대통령§!이 이끄는 §C[EUU.GetFlag] 유럽 연방§!으로 전환하기로 결정했습니다."
