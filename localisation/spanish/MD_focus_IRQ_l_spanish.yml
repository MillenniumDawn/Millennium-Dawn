 iraqi_MNF.15.d: "After weeks of being on the run, Izzat Ibrahim Al-Douri was finally captured by our forces in a discreet hiding location. He has been transferred to Abu Ghraib correctional facility where he is currently being evaluated. His fate will soon be decided by the appropriate Iraqi authorities."
