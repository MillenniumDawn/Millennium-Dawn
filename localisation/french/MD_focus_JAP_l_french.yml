 JAP_ministry_officials_named: "Ministry Officials Named"
 JAP_ministry_officials_named_desc: "The Shinsei contract is public and so are the names of the officials who signed it. The ministry spends the year answering questions instead of running policy, and every firm that deals with it waits for the dust to settle."
 JAP_bank_under_public_ownership: "Bank Under Public Ownership"
 JAP_bank_under_public_ownership_desc: "The state owns a major bank and has replaced its board. Lending resumes on the government's terms, which is welcome to borrowers and a standing embarrassment to the ministers who have to answer for it."
 JAP_ring_of_fire: "Living on the Ring of Fire"
 JAP_ring_of_fire_desc: "Four tectonic plates meet under the Japanese archipelago, and a fifth of the world's magnitude six or greater earthquakes strike here. Two thirds of the housing stock predates the 1981 Building Standards Act. Every few years a tremor cracks an expressway, derails a Shinkansen or shuts a plant, and the disaster budget is a permanent line in the national accounts.\n-------------\nEarthquakes will keep striking §Y[609.GetName]§!, §Y[610.GetName]§!, §Y[611.GetName]§!, §Y[613.GetName]§!, §Y[615.GetName]§!, §Y[616.GetName]§! and §Y[617.GetName]§!. A region that has been through the §Y$JAP_seismic_retrofit_category$§! will be more prepared for Earthquakes\n§GRemoval§!: every earthquake-prone region has been seismically retrofitted and the §Y$JAP_reconstruction_completed_focus$§! focus has been completed."
 JAP_galapagos_syndrome_focus_idea: "The Galapagos Premium"
 JAP_galapagos_syndrome_focus_idea_desc: "While the ministry argues over convergence and commercialisation, the trade offices do the obvious thing and sell the difference. Domestic chip lines run at a premium, the standards delegations push Japanese specifications abroad, and the process research keeps pace. The arrangement buys time for the decision underneath it, and it does not last."
