name: Task
description: Task for a set of work or a feature in Millennium Dawn.
title: "[TASK] "
labels: ["enhancement"]
type: task
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear and concise description of the task and what done looks like. The main goal of these tasks are general purpose improvements.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add any other context or screenshots here.
