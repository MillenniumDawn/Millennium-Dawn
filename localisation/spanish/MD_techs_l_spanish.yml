 module_naval_anti_torpedo_1: "Sistema de defensa antitorpedos I"
 module_naval_anti_torpedo_1_desc: "Los sistemas de defensa antitorpedos combinan una rápida detección submarina con contramedidas automatizadas para reducir la amenaza que suponen los torpedos modernos.\n\n§GConsejo de diseño: La defensa antitorpedos reduce la probabilidad de sufrir impactos críticos de torpedos enemigos, limitando los ataques de torpedos más dañinos. Es útil contra flotas con gran cantidad de torpedos, pero ocupa una ranura de misiles y añade costes de producción, combustible y mano de obra.§!"
