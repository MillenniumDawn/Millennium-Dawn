 BOS_land_doctrine: "육군 교리"
 BOS_mechanization_of_the_army_desc: "방호 기동력을 갖추면 소규모 육군도 예비 병력을 신속히 이동시키고 현대 전장에서 생존할 수 있습니다."
 BOS_boots_on_the_ground_desc: "보스니아는 값비싼 차량 대신 훈련된 보병, 준비된 진지, 폭넓은 예비군을 중심으로 방어를 구성할 수 있습니다."
 BOS_national_high_command_desc: "합동 최고 사령부는 각 정치체의 군대를 국가 민간 권위 아래 두고 공통의 작전 계획 기준을 확립할 것입니다."
 BOS_aerial_dominance_desc: "전투 항공 계획은 전투기 가동률, 조종사의 자질, 보스니아 영공 통제를 우선시할 것입니다."
 BOS_transportation_methods_desc: "현대식 다목적 차량과 군수 절차는 전개 속도를 높이고 보급 차질을 줄여 줄 것입니다."
 BOS_rifle_advancements_desc: "현대식 제식 소총, 방탄복, 생산 방식은 보병의 효율과 국내 보급을 향상시킬 것입니다."
 BOS_wave_tactics_desc: "예비군 중심 교리는 집중된 보병 대형으로 진지를 지키고 지속적인 압박을 견뎌 낼 것입니다."
 BOS_civilian_training_desc: "예비군 교육을 확대하면 감당할 수 없는 상비군을 유지하지 않고도 민간인을 동원에 대비시킬 수 있습니다."
 BOS_restoration_of_old_aircraft_desc: "물려받은 헬리콥터를 수리하고 공군 기지를 재건하면 제한적인 수송 항공 능력을 되살릴 수 있습니다."
 BOS_aircraft_acquiring_desc: "러시아 전투기는 전투 항공 전력을 신속히 확보할 수 있는 방법이지만, 조달 및 기지 운용 비용이 국고에 부담을 줄 것입니다."
 BOS_personal_carriers_desc: "보병 전투차는 차량화 수송에서 방호된 제병 협동 부대로의 전환을 완성할 것입니다."
 BOS_resupply_equipment_desc: "현대식 무전기, 지원 화기, 군수 장비는 전선 부대의 자급 능력을 높여 줄 것입니다."
 BOS_artillery_refurbishment_desc: "물려받은 화포를 정비하고 탄약을 표준화하면 신뢰할 수 있는 화력 지원을 복원할 수 있습니다."
 BOS_small_arms_purchase_desc: "국내 생산을 재편하는 동안 외국산 소총으로 당장의 비축량 부족을 메울 수 있습니다."
 BOS_mobilization_requirements_desc: "명확한 예비군 의무와 소집 절차를 마련하면 정부는 비상시 군대를 확장할 수 있습니다."
 BOS_combine_the_armies_desc: "완전한 통합은 병렬적인 정치체별 지휘부를 해체하고 단일한 국가 지휘 계통을 만들어 낼 것입니다."
 BOS_great_level_of_cooperation_desc: "각 정치체의 부대는 고유한 전통을 유지하면서도 합동 계획, 훈련, 조달을 채택할 수 있습니다."
 BOS_the_land_fleet_desc: "공통 차량 표준은 수송차, 장갑차, 지원 차량을 유지 가능한 기계화 전력으로 통합할 것입니다."
 BOS_main_battle_line_desc: "대기갑 무기와 기동 예비대를 통해 보스니아는 대규모 전차 전력에 투자하지 않고도 더 중무장한 부대에 맞설 수 있습니다."
 BOS_streamline_production_desc: "표준화된 계약과 조립 방식은 보병 장비 보급 비용을 낮출 것입니다."
 BOS_provide_equipment_updates_desc: "정례적인 현대화 주기는 군 전반에서 소총과 지원 화기의 호환성을 유지해 줄 것입니다."
 BOS_general_staff_reforms_desc: "전문적인 작전 계획, 공통 참모 절차, 현대식 방호 장비가 전시의 임기응변을 대체할 것입니다."
 BOS_aerial_cooperation_desc: "대공 방어 및 항공 사령부는 감시 자료, 기지 운용 계획, 작전 통제권을 공유할 것입니다."
 BOS_officer_training_desc: "국가 장교 교육 과정은 정치체 사령부가 아닌 국가 기관에 충성하는 전문 장교단을 길러 낼 것입니다."
 BOS_military_drills_desc: "합동 훈련은 새로운 지휘 체계를 시험하고 남아 있는 협조 실패를 드러낼 것입니다."
 BOS_prepping_an_offensive_desc: "참모 장교들은 내전의 다음 국면에 앞서 결정적인 진격 축을 선정하고 보급품을 비축할 것입니다."
 BOS_bosnian_elections_desc: "세계 금융 위기는 보스니아의 외채 의존, 취약한 수출, 분열된 기관들을 드러냈습니다. 정부는 침체가 고착되기 전에 회복 정책을 선택해야 합니다."
 BOS_economic_revision_desc: "투자와 가계 수요를 억누르지 않으면서 회복에 필요한 재원을 마련하려면 세금 정책을 개정해야 합니다."
 BOS_rally_the_troops_desc: "현지 지휘관들은 예비군을 소집하고 초기 전투로 소모된 부대를 재건할 것입니다."
 BOS_commence_the_offensives_desc: "조율된 공격은 우리 야전 사령부가 마련한 준비를 활용하여 적을 주요 진지에서 몰아낼 것입니다."
 BOS_dig_in_desc: "요새화된 진지와 준비된 후퇴선은 공세가 정체될 경우 아군을 보존해 줄 것입니다."
 BOS_detain_serbian_generals_desc: "전쟁범죄 혐의를 받는 장교들을 기소하면 국제적 신뢰와 법치가 강화되겠지만, 스릅스카 공화국의 반발은 깊어질 것입니다."
 BOS_release_serbian_generals_desc: "구금된 세르비아 장교들을 석방하면 피해자 단체들의 비판에도 불구하고 스릅스카 공화국 및 세르비아와의 화해에 도움이 될 것입니다."
 BOS_grant_more_rights_to_serbian_peoples_desc: "세르비아인 대표성에 대한 더 강력한 보장은 분리주의의 압력을 줄이고 소외된 공동체로 투자를 이끌 수 있습니다."
 BOS_oppress_serbian_back_supports_desc: "외국 자동차 제조사는 일자리와 생산 자본을 제공할 수 있지만, 그들의 영향력이 보스니아의 산업 정책을 좌우하게 될 것입니다."
 BOS_the_state_desc: "보스니아의 헌법상 권한 분립을 존중하면서 복구를 조율하려면 유능한 국가 기관이 필요합니다."
 BOS_grant_herzegovinians_more_rights_desc: "경찰 예산을 늘리면 지역 치안과 법 집행이 개선되겠지만, 추가 지출은 국가 예산에 부담이 될 것입니다."
 BOS_limit_herzegovinians_desc: "경찰 지출을 줄이면 공적 자금을 아낄 수 있지만, 법 집행이 약해져 조직범죄가 확산될 수 있습니다."
 BOS_mobilize_the_nation_desc: "비상 동원은 군대가 활용할 수 있는 훈련된 보충병 풀을 확대할 것입니다."
 BOS_request_military_supplies_desc: "튀르키예와 알바니아가 보병 무기를 제공할 수 있으나, 각 정부는 장비를 내줄 여력이 있는지 스스로 판단할 것입니다."
 BOS_bosnians_will_lead_the_military_desc: "민간 국가 지휘부는 통합 지향 복구 계획을 완수하고 비상 재정 조치를 종료할 것입니다."
 BOS_anti_serbian_propaganda_desc: "외국 산업 자산을 국유화하면 국가 통제는 확대되겠지만, 투자자 신뢰와 독일과의 관계가 훼손될 것입니다."
 BOS_improve_road_quality_in_sarajevo_desc: "사라예보의 도로망을 보수하면 지역들이 다시 연결되고, 화물 지연이 줄며, 서비스 부문에 대한 추가 투자가 뒷받침될 것입니다."
 BOS_improvement_of_the_health_care_system_desc: "국가 보건 의료 표준은 접근성을 넓히고 전후의 파편화된 체계를 대체할 것입니다."
 BOS_secure_regional_support_for_government_desc: "안정적인 정부에는 사라예보의 의회 과반수뿐 아니라 지방 자치단체와 정치체 지도자들의 협력이 필요합니다."
 BOS_crackdown_of_anti_war_propaganda_desc: "전시 검열과 역선전은 공개적인 정치 토론을 희생하는 대신 국민의 결의를 유지시킬 것입니다."
 BOS_formation_of_a_junta_desc: "군사 평의회는 전쟁 수행에 통일성을 강제할 수 있지만, 민간 기관은 국가 통제권을 잃게 됩니다."
 BOS_removal_of_the_dayton_accords_desc: "데이턴 체제를 개혁하면 평화 협정의 보호 장치를 유지하면서 더 많은 책임을 국가 기관으로 이전할 수 있습니다."
 BOS_post_war_clean_up_desc: "잔해, 불발탄, 버려진 부지를 치우면 피해 지역을 재건에 대비시킬 수 있습니다."
 BOS_improve_service_industry_desc: "현대식 사무 공간, 안정적인 공공 설비, 낮은 기업세는 사라예보가 경쟁력 있는 서비스 경제를 발전시키는 데 도움이 될 것입니다."
 BOS_improvement_of_the_education_system_desc: "공통 교육 표준과 더 나은 학교는 역량을 높이는 동시에 공공 행정의 부패를 억제할 것입니다."
 BOS_banja_luka_mine_desc: "현대식 장비와 안전 기준을 갖추면 바냐루카의 광업 부문을 다시 수익성 있는 생산으로 되돌릴 수 있습니다."
 BOS_farming_sector_desc: "지뢰 제거와 농업 투자는 가족 농가가 현대화하고 국내 시장에 공급하도록 도울 것입니다."
 BOS_end_nato_desc: "이슬람주의 정부는 이 지역에서의 NATO의 입지에 도전하며, 통제하지 못할 수도 있는 대결에 대비할 것입니다."
 BOS_national_appeasement_desc: "화해 계획은 보스니아크인, 크로아티아인, 세르비아인 사이의 관계를 개선하고 정부가 평화적인 헌법 개혁을 추진하도록 약속하게 할 것입니다."
 BOS_role_the_dice_desc: "스릅스카 지도자들은 심각한 불안정과 내전 재발의 위험을 감수하고서라도 신속한 권력 공고화를 밀어붙일 수 있습니다."
 BOS_popular_support_desc: "세 구성 민족 모두에 걸친 협상된 위임은 스릅스카 주도 정부에 개혁으로 가는 더 안전한 길을 열어 줄 것입니다."
 BOS_develop_national_sentiment_desc: "지속적인 애국 캠페인은 전시 체제를 강화하고 국가 동원을 온전히 유지시킬 것입니다."
 BOS_land_mine_removal_desc: "국가 지뢰 제거 계획은 오염된 토지를 파악하고, 제거팀을 훈련시키며, 전쟁이 남긴 인적 피해를 줄일 것입니다."
 BOS_rebuild_infrastructure_in_sarajevo_desc: "사라예보의 재건은 수도의 전력망을 강화하고 철도 터미널을 다시 열어, 국가 복구가 여전히 우선 과제임을 보여 줄 것입니다."
 BOS_rebuild_infrastructure_in_srpska_desc: "바냐루카의 전력망과 비엘리나의 철도 터미널을 재건하면 스릅스카 공화국의 공동체가 국가 시장 및 기관과 연결될 것입니다."
 BOS_rebuild_infrastructure_in_herzegovina_desc: "헤르체고비나의 강화된 전력망과 가동 중인 철도 터미널은 모스타르로의 접근성을 높이고 남부 전역의 무역을 되살릴 것입니다."
 BOS_build_a_war_memorials_desc: "기념비는 민간인과 군인의 희생을 기리는 동시에 공동체에 공적인 추모의 장소를 제공할 것입니다."
 BOS_make_way_for_more_industry_desc: "광업과 농업 두 부문이 필요한 준비를 갖춘다면 더 폭넓은 농촌 산업 기반을 뒷받침할 수 있습니다."
 BOS_military_industrialization_desc: "사라예보에 비용을 산정한 무기 공장을 세우면, 경제가 인력과 재원을 충당할 수 있는 한 재무장을 뒷받침할 것입니다."
 BOS_autonomy_advancements_desc: "헤르체고비나와 스릅스카 공화국을 자치 주체로 풀어 주면 보스니아 내 정치체의 자치를 공식화하게 됩니다."
 BOS_cooperative_effort_desc: "협력적인 스릅스카 계획은 연방 기관을 보존하고 강압이 아닌 동의를 통해 동방 노선을 추구할 것입니다."
 BOS_removal_of_lands_in_herzegovina_desc: "제거팀은 헤르체고비나의 오염된 토지를 정착, 농업, 운송을 위해 다시 개방할 것입니다."
 BOS_removal_of_lands_in_central_bosnia_desc: "중부 보스니아의 지뢰를 제거하면 인구 밀집 지역 공동체를 보호하고 생산 가능한 토지를 되살릴 수 있습니다."
 BOS_removal_of_lands_in_central_srpska_desc: "스릅스카 공화국 중부의 지뢰 제거는 피해를 입은 농촌 지역을 복구에 안전하게 만들 것입니다."
 BOS_rebuild_factories_in_sarajevo_desc: "재건된 민간 공장과 이를 뒷받침하는 기반시설은 사라예보의 산업 고용을 복원할 것입니다."
 BOS_the_repair_of_srpska_and_herzegovina_desc: "스릅스카와 헤르체고비나에 대한 균형 잡힌 산업 및 기반시설 투자는 복구가 사라예보에만 그치지 않음을 보여 줄 것입니다."
 BOS_national_unrest_desc: "안정도 하락과 공동체 간 적대감은 노동 단체가 두 민족주의 진영 모두에 도전할 길을 열어 주었습니다."
 BOS_state_opposition_desc: "시민 야당은 선거를 통해 스릅스카 민족주의 정당들과 겨루며, 연방 권위와 세르비아 유권자를 더욱 소외시킬 위험 사이에서 균형을 잡을 것입니다."
 BOS_eastern_trade_bloc_desc: "러시아 및 세르비아와의 상호 무역 협정은 정치적 노선을 지속적인 상업적 접근권으로 전환할 것입니다."
 BOS_commence_centralization_desc: "스릅스카 당국은 정치체의 권한을 중앙 정부로 이전하고 경쟁하는 헌법상 중심을 억누를 것입니다."
 BOS_national_agenda_desc: "공동의 입법 계획은 사회 안정, 재정 개혁, 세 구성 민족 모두의 인정을 결합할 것입니다."
 BOS_final_land_mine_removal_efforts_desc: "지역별 계획을 조율하면 확인된 남은 지뢰밭을 제거하고 보스니아의 전후 지뢰 제거 활동을 마무리할 수 있습니다."
 BOS_workers_front_desc: "노동자 전선은 불만을 품은 노조들을 독자적인 경제 계획을 가진 전국적 정치 세력으로 조직할 것입니다."
 BOS_national_unity_desc: "정치체들은 협상된 전환기를 거쳐 국가의 직접 행정으로 복귀하며, 다원적인 연방 국가를 복원할 것입니다."
 BOS_cooperative_alliance_desc: "러시아는 보스니아의 동방 동반자 관계가 CSTO 가입을 받아들일 만한지 결정할 것입니다."
 BOS_introduction_of_mandatory_conscription_desc: "의무 복무는 가계와 고용주에게 더 무거운 의무를 지우는 대가로 예비군을 확대할 것입니다."
 BOS_decrease_poverty_rate_desc: "표적화된 사회 지출은 빈곤을 줄이고 전후 복구 과정에서 소외된 공동체를 안정시킬 것입니다."
 BOS_the_teachings_of_orthodox_desc: "정교회 성직자와의 협력은 동방의 사회 협약을 강화하는 한편 이슬람 기관을 정부에서 밀어낼 것입니다."
 BOS_concessions_to_the_work_unions_new_desc: "구속력 있는 노조 협약은 사회 지출과 직장 내 권리를 정치적 안정과 맞바꿀 것입니다."
 BOS_puppet_economics_new_desc: "노동자 평의회는 경영에서 공식적인 역할을 부여받고, 더 높은 법인세가 새로운 체제의 재원을 댈 것입니다."
 BOS_religious_identity_desc: "이슬람주의 국가는 국경 밖의 보스니아크인 공동체에 대한 지도권을 주장하고 강압적인 지역 정책을 준비할 것입니다."
 BOS_tax_reforms_desc: "가계와 기업의 세율을 낮추면 정치적 지지는 넓어지겠지만 즉각적인 국가 세입은 줄어듭니다."
 BOS_state_atheism_new_desc: "노동자 정부는 국가 기관에서 종교적 특권을 제거하며, 성직자들을 희생시켜 행정적 자유를 얻을 것입니다."
 BOS_mechanical_production_new_desc: "기계화된 생산과 기술 훈련은 생산성을 높이고 노동자 경제의 산업 전환을 완수할 것입니다."
 BOS_land_doctrine_desc: "보스니아에는 산악 지형, 제한된 인력, 소규모 조달 예산에 맞는 방어 교리가 필요합니다."
