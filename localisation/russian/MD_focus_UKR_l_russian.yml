 UKR_storage_item_strela2_tt: "§Y9К32 «Стрела-2»§!\n\n\n£SOV_INF_9K32M\n\n\n\nНа хранении: §Y[?ukraine_has_strela2_stockpile|0]§!\nПоколение: переносной зенитный ракетный комплекс первого поколения, на вооружении с 1968 года.\nТип техники: §YСредства ПВО§!\n\nВарианты на хранении:\n• 9К32 «Стрела-2»: §Y[?ukraine_has_strela2_stockpile|0]§!\n\nРакеты с инфракрасным наведением, запускаемые с плеча. Более новый §Y9К32М «Стрела-2М»§! остаётся на вооружении."
