 LPR_fsb_desc: "러시아는 우리 국가에 혼란과 소요를 일으키는 자들을 철저히 처리하기 위해 FSB 요원을 우리에게 보낼 준비가 되어 있습니다."
 LPR_internet: "인터넷 사업자 \\"루가넷\\""
