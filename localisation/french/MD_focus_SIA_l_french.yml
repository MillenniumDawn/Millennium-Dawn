 SIA_aligned_self_tt: "Au moins deux choix d'autosuffisance pris (actuellement §Y[?SIA_pick_self|0]§!)"
 SIA_no_bloc_dominant_tt: "Aucun bloc choisi plus d'une fois. Occidental §Y[?SIA_pick_west|0]§!, chinois §Y[?SIA_pick_china|0]§!, autosuffisant §Y[?SIA_pick_self|0]§!"
 SIA_bamboo_east_gate_tt: "Nous ne sommes pas à la fois sous le règne de §Y[Nat_Autocracy_L]§! ou §Y[Monarchist_L]§! et dans une faction avec les §YÉtats-Unis§!."
