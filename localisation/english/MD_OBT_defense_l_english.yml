 obt_proc.21: "No One Will Build Them"
 OBT_ps_negotiating: "Submarine talks are under way"
 OBT_ps_talks_failed_usa: "Talks with Washington failed less than a year ago"
 OBT_ps_talks_failed_hol: "Talks with the Netherlands failed less than a year ago"
 OBT_ps_talks_failed_ger: "Talks with Germany failed less than a year ago"
 obt_proc.1.t: "The Keelung and the Su Ao"
 obt_proc.1.d: "The first two Kidd-class destroyers have arrived from Charleston as ROCS Keelung and ROCS Su Ao. Their area air defense is unmatched in our navy, and so are their maintenance needs."
 obt_proc.1.a: "Commission them."
 obt_proc.2.t: "The Kidd-Class Destroyers Complete"
 obt_proc.2.d: "ROCS Tso Ying and ROCS Ma Kong have joined their sister ships. The crews will need several months of training before the four destroyers are fully ready."
 obt_proc.2.a: "Begin working up."
 obt_proc.10.t: "The P-3C Contract"
 obt_proc.10.d: "Washington and Lockheed have agreed to refurbish twelve P-3C Orion aircraft from storage for us. The airframes need years of work before they fly again."
 obt_proc.10.a: "Good. Train the crews now."
 obt_proc.11.t: "Orions Arrive"
 obt_proc.11.d: "Another four refurbished P-3C Orions have landed at Pingtung. Submarine hunting in the Strait is becoming a real capability."
 obt_proc.11.a: "Assign them to the patrol squadron."
 obt_proc.12.t: "The Last Orions"
 obt_proc.12.d: "All twelve P-3C Orions have been delivered. The new squadron needs a few months to reach full readiness."
 obt_proc.12.a: "Begin training."
 obt_proc.20.t: "Seeking a Submarine Builder"
 obt_proc.20.d: "The submarines are funded for design work, but no American yard builds diesel boats and European builders fear Beijing. Unless we find a builder before 1 January 2009, the foreign program will be over. Each option has its own conditions in the Defense and National Reform tab."
 obt_proc.20.a: "Open the talks."
 OBT_sub_indigenous_tt: "The §YIndigenous Submarine Program§! focus is the way forward."
 obt_proc.21.t: "No One Will Build Them"
 obt_proc.21.d: "Eight years after Washington approved the submarines, no shipyard has agreed to build them. If Taiwan wants submarines, it will have to learn to build them itself."
 obt_proc.21.a: "Build our own."
 obt_proc.22.t: "A Builder Is Found"
 obt_proc.22.d_usa: "Washington has agreed to have an American yard build a new diesel design for us. It is an extraordinary sign of trust."
 obt_proc.22.d_hol: "The Netherlands has agreed to let RDM build an improved Hai Lung design for us, despite protests from Beijing."
 obt_proc.22.d_ger: "Berlin has approved a license for a Type 209 design built with German help, despite protests from Beijing."
 obt_proc.22.a: "Prepare the appropriation."
 obt_proc.23.t: "Submarine Talks Fail"
 obt_proc.23.d_usa: "Washington has decided not to reopen a diesel submarine line. Our standing in Washington, America's commitment or our readiness fell short when it mattered."
 obt_proc.23.d_hol: "The Dutch government has withdrawn RDM's export license. The Strait looked too dangerous, or our partnership too thin, for The Hague to accept Beijing's anger."
 obt_proc.23.d_ger: "Berlin has turned us down again. Without a calmer Strait and closer relations, it will not risk its trade with China."
 obt_proc.23.a: "We can try again in a year."
 obt_proc.24.t: "Two Submarines Commissioned"
 obt_proc.24.d: "Another pair of new submarines has been commissioned into the fleet."
 obt_proc.24.a: "Welcome them."
 obt_proc.25.t: "The Submarine Fleet Complete"
 obt_proc.25.d: "All eight submarines have been commissioned. Their crews need months of training before they are ready for war patrols."
 obt_proc.25.a: "Begin working up."
 obt_proc.30.t: "Aegis Destroyers Arrive"
 obt_proc.30.d: "A pair of new Aegis destroyers has arrived. Beijing calls their delivery a grave provocation."
 obt_proc.30.a: "Commission them."
