 LAT_infantry_weapons_5_desc: "G36A2 모델은 G36 모델의 개량형입니다. G36A2는 기존의 듀얼 컴뱃 사이팅 시스템의 레드닷 조준경을 대체하는, 피카티니 레일에 장착된 탈착식 자이스 RSA 반사식 레드닷 조준경을 특징으로 합니다. G36A2 업그레이드 키트에는 더 짧은 G36C 개머리판, 옵션으로 4개의 피카티니 레일을 장착할 수 있는 알루미늄 재질의 새로운 핸드가드, 그리고 오를리콘 콘트라베스 LLM01 레이저 라이트 모듈 작동 스위치가 내장된 수직형 포어그립이 포함됩니다."
 LAT_infantry_weapons_6_desc: "The Heckler & Koch HK416 is a gas-operated assault rifle chambered for the 5.56x45mm NATO cartridge. It is designed and manufactured by the German company Heckler & Koch. Although the design is based on the AR-15 class of firearm, it uses a proprietary short-stroke, gas piston system from Heckler & Koch's earlier G36 family of rifles. The HK416 is also equipped with a proprietary accessory rail forearm with rails on all four sides to accommodate multiple accessories."
 EST_infantry_weapons_2_desc: "헤클러앤코흐 G3(게베르 3)는 7.62x51mm NATO 구경의 선택 사격식 전투소총으로, 1950년대 서독의 무기 제조업체 헤클러앤코흐(H&K)가 스페인 국영 설계 개발 기관인 CETME와 협력하여 개발했습니다. G3는 1959년부터 FN FAL/G1을 대체하여 표준 소총으로 사용되었으며, 1963년에 개량형 G3A1 모델로 업그레이드될 때까지 운용되었습니다."
