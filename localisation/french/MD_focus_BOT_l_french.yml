 BOT_eliminate_half_of_poachers: "§GRéduit le nombre de braconniers de §Y[?poachers_killed]§!§!"
 Botswana_events.7.t: "Achat de chasseurs botswanais"
 Botswana_events.7.desc: "Il est temps de remplacer notre flotte de chasseurs vieillissante. Qui devrions-nous choisir comme fournisseur ?"
 Botswana_events.7.a: "[SWE.GetNameDef]"
 Botswana_events.7.b: "[USA.GetNameDef]"
 Botswana_events.7.c: "[CHI.GetNameDef]"
 Botswana_events.7.d: "[ENG.GetNameDef]"
 BOT_hire_extra_security: "Embaucher de la sécurité supplémentaire"
 BOT_hire_extra_security_desc: "Monter un détachement de sécurité permanent contre le braconnage. Le programme court jusqu'à sa dissolution et pèse de façon continue sur le budget de police.\n§GLa chance d'éliminer des braconniers augmente de 10 %§!"
 BOT_disband_extra_security: "Dissoudre la sécurité supplémentaire"
 BOT_disband_extra_security_desc: "Licencier le détachement de sécurité supplémentaire et mettre fin à son entretien."
 BOT_provide_heavy_weapons: "Fournir des armes lourdes"
 BOT_provide_heavy_weapons_desc: "Équiper nos forces de sécurité d'armes lourdes et de matériel supplémentaire en programme permanent. Il court jusqu'à son retrait et pèse de façon continue sur le budget du personnel.\n§GLe nombre de braconniers éliminés augmente de 5§!"
 BOT_withdraw_heavy_weapons: "Retirer les armes lourdes"
 BOT_withdraw_heavy_weapons_desc: "Retirer les armes lourdes de nos forces anti-braconnage et mettre fin à leur entretien."
 BOT_extra_security_program: "Sécurité anti-braconnage supplémentaire"
 BOT_extra_security_program_desc: "Un détachement de sécurité permanent dédié à la lutte contre le braconnage. Augmente de 10 % la chance d'éliminer des braconniers en échange d'un budget de police plus élevé."
 BOT_heavy_weapons_program: "Armes lourdes pour les Rangers"
 BOT_heavy_weapons_program_desc: "Nos forces anti-braconnage déploient des armes lourdes et du matériel supplémentaire. Élimine 5 braconniers de plus chaque mois en échange d'un budget du personnel plus élevé."
 Botswana_events.8.t: "BOCCIM Becomes Business Botswana"
 Botswana_events.8.desc: "The Botswana Confederation of Commerce, Industry and Manpower has adopted the name Business Botswana. The apex employers' organisation says the shorter name reflects its role as the single voice of the private sector in its dealings with government, and it will keep its seat on the High Level Consultative Council chaired by the President."
 Botswana_events.8.a: "Same lobby, new name"
 Botswana_events.9.t: "The Alliance for Progressives is Founded"
 Botswana_events.9.desc: "Ndaba Gaolathe and his supporters have left the Botswana Movement for Democracy after a bitter leadership dispute and founded the Alliance for Progressives. The new party presents itself as a centrist, social-liberal alternative that stands for clean government, a diversified economy and stronger institutions, and it is expected to seek a place inside the opposition coalition."
 Botswana_events.9.a: "Another opposition party"