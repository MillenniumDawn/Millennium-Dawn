 emil_constantinescu_desc: "에밀 콘스탄티네스쿠는 루마니아 왕국에 존재했으나 공산 정권에 의해 금지되며 해산된 국민농민당(PNT)의 후신 정당의 고위 당원이었습니다. 1992년 PNTCD가 속한 루마니아 민주 협약(CDR)은 그를 루마니아 대통령 후보로 지명했습니다. 그는 결선투표에서 당시 현직이던 이온 일리에스쿠에게 패했습니다. 1996년 그는 CDR의 후보로 다시 대선에 출마하여 결선투표에서 일리에스쿠를 약 10% 차이로 꺾고 승리했습니다. 1996년 총선에서의 CDR의 성공은 1989년 이후 루마니아 최초의 평화적 정권 교체였습니다. 취임 당일 그는 헌법이 대통령의 재임 중 정당 정식 당원 자격을 금지하고 있으므로 PNTCD 당적을 정지했습니다. 콘스탄티네스쿠 대통령 시기는 과도한 관료주의에 발목 잡힌 민영화 과정의 비효율적 이행으로 단기적으로 실업과 빈곤이 증가한 것, 그리고 1999년에 일어나 광부 시위 배후 지도자 미론 코즈마의 체포로 끝난 두 차례의 추가 광부 시위로 특징지어집니다. 이념적 차이와 정치적 불안정으로 인한 집권 CDR 연립의 분열은 연립을 더욱 갈라놓았습니다. 새천년이 오고 선거가 다가오면서 그의 인기는 급락했으며, 이는 루마니아의 문제를 해결하기 위해 급진적 조치를 요구하는 극단적 민족주의자 코르넬리우 바딤 투도르의 인기를 끌어올렸고, 이온 일리에스쿠 전 대통령은 다시 대통령직을 노리고 있습니다. 이 모든 문제로 인해 콘스탄티네스쿠가 재선에 출마할 가능성은 낮습니다"
 ion_ilescu_desc: "이온 일리에스쿠는 1953년 루마니아 공산당(PCR)에 입당하여 1965년 중앙위원회 위원이 되었습니다. 그러나 1971년부터 니콜라에 차우셰스쿠에게 점차 밀려났습니다. 일리에스쿠는 루마니아 혁명에서 주도적인 역할을 맡았으며 1989년 12월 국가의 대통령이 되었습니다. 공산 정권 수립 이후 처음으로 치러진 1990년 자유 선거에서 그는 루마니아 최초의 자유 선거로 선출된 국가원수가 되었습니다. 당시의 집권 세력인 국가구국전선(FSN)은 일리에스쿠 지지자들이 만든 민주국가구국전선(FDSN)과 페트레 로만 총리가 만든 민주당(PD)으로 갈라졌습니다. 일리에스쿠는 이후 1992년 선거에서 에밀 콘스탄티네스쿠를 꺾었으나 1996년 선거에서는 그에게 패했습니다. 일리에스쿠는 이후 새로 창당한 사회주의 성향의 PDSR을 이끌고 극단적 민족주의자 코르넬리우 바딤 투도르를 상대로 승리를 거두었습니다."
 theodor_stolojan_desc: "니콜라에 차우셰스쿠 집권기에 테오도르 스톨로얀은 1972년부터 1977년까지 재무부 국가예산국 경제학자로, 1978년부터 1982년까지 국가예산 회계 책임자로, 이후 루마니아 혁명 때까지 외환 및 국제 금융 관계국 부국장으로 근무했습니다. 그는 공산주의 붕괴 이후 첫 재무장관으로서 중앙 계획이 끝난 뒤 자유시장 개혁의 설계자로서 핵심적인 역할을 했으며, 금융 체계를 쇄신하고 민영화를 추진하는 데 깊이 관여했습니다. 광부 시위 사태로 페트레 로만 총리가 사임한 이후, 스톨로얀은 당시 이온 일리에스쿠 대통령에 의해 총리로 임명되었습니다. 그러나 1992년 경제 상황이 악화되자 스톨로얀 정부는 임금을 제한하고 물가를 더욱 자유화하는 긴축 계획을 시작했습니다. 경제 상황은 악화되었고 인플레이션과 실업이 크게 늘었습니다. 이후 그는 총리직에서 물러났습니다. 2000년 그는 국민자유당(PNL) 소속으로 정계에 복귀하여 2000년 대통령 선거에 출마했고, 상대 후보에게 큰 타격을 주며 모두를 놀라게 하는 당선을 이루어 냈습니다. 이제 스톨로얀은 루마니아를 현대화하기 위해 새로운 경제 개혁, 서방과의 연대 강화, 부패 척결을 지향합니다."
 mugur_isarescu_desc: "무구르 이스레스쿠는 국제경제연구소의 연구원이었습니다. 그는 미국에서 여러 과정을 수강했고 자본주의 경제학에 관한 여러 논문을 썼습니다. 1990년 2월 루마니아 혁명 이후 이스레스쿠는 루마니아 외무부에서 일하기 시작했으며, 1990년 3월에는 주미 루마니아 대사관의 경제 및 통화 담당 서기관으로 파견되어 국제통화기금 및 세계은행과의 루마니아 관계를 담당했습니다. 1990년 7월 이스레스쿠는 루마니아 국립은행(BNR)을 이끌기 위해 미국 임지에서 소환되었습니다. 많은 이들은 이스레스쿠의 BNR 운영이 그의 유능한 지식과 지도력 덕분에 루마니아 경제를 완전한 붕괴에서 구했다고 평가합니다. 1999년 라두 바실레 총리가 사임한 후, 이스레스쿠는 루마니아 총리직을 요청받았고, 임기가 끝나면 국립은행으로 돌아갈 수 있다는 조건으로 수락했습니다. 당시 에밀 콘스탄티네스쿠 대통령이 이 조건에 동의했고, 1999년 12월 16일 이스레스쿠는 루마니아 총리로 취임했습니다. 이스레스쿠는 1년만 재임했음에도 루마니아 경제를 개선하는 경제 개혁을 시작했습니다. 이후 에밀 콘스탄티네스쿠 대통령이 재선에 나서지 않기로 결정하자, 이스레스쿠는 CDR 집권 연립의 잔존 세력에 의해 2000년 선거의 대통령 후보로 지명되었습니다. 이스레스쿠는 모든 상대를 물리치고 루마니아의 새 대통령이 되어 모두를 놀라게 했으며, 이제 친서방 외교 정책과 루마니아 경제의 현대화를 지향합니다."
 corneliu_vadim_tudor_desc: "공산주의 시대에 코르넬리우 바딤 투도르는 기자, 편집자, 시인으로 일했습니다. 1970년대 초에 그는 루마니아 리베라의 편집자 중 한 명이었고, 1975년 이후에는 루마니아 국영 통신사의 편집자였습니다. 1991년 코르넬리우 바딤 투도르는 에우젠 바르부와 함께 극단적 민족주의 정당인 대루마니아당(PRM)을 창당했으며, 이 당은 정치 현상에 대한 대중의 환멸 덕분에 막대한 지지를 얻었습니다. 1999년 로마니아 마레의 전직 기자 단 코르넬리우 후디치는 투도르의 당이 집권하면 체포될 정치인(당시 에밀 콘스탄티네스쿠 대통령 포함), 기자, 사업가 수십 명의 '비밀 블랙리스트'가 있다고 주장했습니다. 이 주장은 에밀 콘스탄티네스쿠 대통령에 대한 불만 때문에 오히려 그의 인기만 높였습니다. 2000년 선거에서 바딤은 상승한 인기와 상대 후보들에 대한 불만이 맞물려 전직 대통령이자 공산당 간부였던 이온 일리에스쿠를 상대로 대승을 거두며 모두를 놀라게 했습니다. 이제 코르넬리우 바딤 투도르는 낡은 정치 현상을 청산하고 2차 세계 대전 이후 루마니아가 잃은 영토를 포함하는 강력한 루마니아 국가로 대체하고자 합니다."
 mihai_i_desc: "총선에서의 PNTCD의 승리와 국민투표에서의 군주제 세력의 승리에 이어 루마니아 왕국이 복원되었고, 미하이는 다시 왕좌에 올랐습니다. 1927년부터 1930년까지, 그리고 1940년부터 1947년까지 국왕이었던 미하이는 방대한 경험과 지식을 갖고 있으며, 그의 초당파적 입장은 의회에서 타협을 이끌어 내기에 더없이 적합합니다. 동시에 미하이는 루마니아 사회에서 사랑받고 있으며, 안정과 민주주의의 상징으로 여겨지고 있고, 나라가 마땅히 누려야 할 더 밝은 미래로 이끌겠다고 약속합니다."
 ROM_petrol_mafia: "석유 마피아"
 ROM_petrol_mafia_desc: "차우셰스쿠 정권이 무너지고 민영화가 신통치 않게 이루어진 이래, 루마니아의 검은 황금은 권력과 돈, 그리고 불순한 의도를 가진 자들의 손에 넘어갔습니다."
 ROM_ineffective_industry: "비효율적 산업"
 ROM_ineffective_industry_desc: "루마니아 산업은 규모는 크지만 낡았습니다. 1950년대와 60년대의 장비, 낮은 임금, 긴 노동 시간, 견디기 힘든 노동 환경은 재앙의 지름길임이 입증되었습니다."
 ROM_chest_brass: "청동 같은 가슴"
 ROM_chest_brass_desc: "루마니아인들은 많은 일에서 의견이 갈리지만, 한 가지만큼은 일치합니다. 그들은 조국을 사랑합니다. 때가 오고 시대가 부르면, 그들은 기꺼이 손을 잡고 다시 한번 조국을 지킬 것입니다."
 ROM_intellectual: "지식인"
 ROM_mass_protests: "대규모 시위"
 ROM_revolution_legacy: "혁명의 유산"
 ROM_revolution_legacy_desc: "1989년 12월 22일, 니콜라에 차우셰스쿠의 잔혹한 공산 정권은 루마니아 혁명으로 잘 알려진 사건으로 전복되었습니다. 혁명의 여파로 루마니아는 막대한 경제 문제와 만연한 빈곤을 겪었으며, 그 영향은 지금도 우리 국민에게 뚜렷이 남아 있지만, 우리 국민은 루마니아를 권위주의 정권에서 해방한다는 혁명의 목표를 기억하고 있으며, 앞으로도 오랫동안 그 목표를 잊지 않을 것입니다 "
 ROM_mineriad_legacy: "광부 시위의 여파"
 ROM_mineriad_legacy_desc: "광부 시위(미네리아드)는 지우 계곡 광부들이 벌인 일련의 시위와 폭력 사태였습니다. 1990년 트란실바니아 지우 계곡의 탄광 광부들이 더 나은 임금과 노동 조건을 요구하며 시작한 광부 시위는, 차우셰스쿠 정권 붕괴 후 이온 일리에스쿠가 구성한 집권 국가구국전선 정부가 야당들의 반정부 시위를 진압하는 데 이용했으며, 충돌로 수많은 사망자와 파괴가 발생했습니다. 이와 같은 사태가 다섯 차례 더 이어졌고, 가장 최근인 1999년 2월의 사태에서는 지우 계곡 광부들의 지도자 미론 코즈마가 체포되면서 광부 시위는 막을 내렸습니다. 광부 파업은 우리나라에 상당한 사회적, 경제적 영향을 미쳤으며, 광부 시위 이후 이어진 정치적 양극화의 결과로 사회에는 많은 상처가 생겼습니다. 광부 시위는 또한 당시 루마니아의 불안정한 사회적, 경제적 상황 탓에 많은 외국인 투자자가 떠나게 만들었고, 이는 경제 불안을 더욱 키웠습니다. 이러한 사건들의 영향은 우리 사회에서 사라지기까지 분명히 오랜 시간이 걸릴 것입니다"
 ROM_romanian_economy_modifier: "루마니아 경제"
 ROM_romanian_economy_modifier_desc: "루마니아 경제는 한때 동구권에서 가장 강한 경제 중 하나였으나, 1970년대 후반과 1980년대 차우셰스쿠 정권이 시행한 경제 정책과 그 뒤 이어진 자본주의로의 경제 전환으로 폐허가 되었고, 한때 두드러졌던 많은 부문이 붕괴 직전의 상태에 놓여 있습니다. 그러나 자원이 풍부한 우리 땅의 경제를 되살리는 데 강력한 노력을 기울인다면, 도나우 강변에서 일찍이 볼 수 없던 기적을 보게 될 수도 있습니다.\n§W--------------§!\n§R경제 트리에서 내리는 선택이 이 가변적인 국가 정신을 만들어 가며, 그 선택에 따라 루마니아 경제는 대담한 새 방향으로 나아가게 되므로 신중하게 나아가길 권고합니다§!"
 ROM_armed_forces_modifier: "루마니아군"
 ROM_armed_forces_modifier_desc: "루마니아군은 완전한 혼란 상태에 있으며, 낡은 장비와 구소련 교리에 대한 의존 때문에 우리 군은 과거의 껍데기에 불과합니다. 우리나라는 전쟁이 일어날 경우 특히 취약하며, 우리 군은 이에 대비하지 못한 상태입니다."
 ROM_corruption_modifier: "과도한 부패"
 ROM_corruption_modifier_desc: "니콜라에 차우셰스쿠의 전체주의 정권에서 벗어난 루마니아는 공공 서비스에서 권력의 정점에 이르기까지 매우 부패한 국가 구조를 안고 있으며, 이는 주로 정권의 전직 고위 인사들이 이후의 경제 전환에 대한 권력을 쥐고 있어, 부패한 차우셰스쿠 정권의 옛 구조가 오늘날까지 이어지고 있기 때문입니다. 부패는 우리나라의 거대한 부담이며, 우리는 매일 수백만 달러의 돈을 잃고 있습니다."
