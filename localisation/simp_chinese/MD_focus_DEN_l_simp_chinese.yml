 DEN_svendborg_skibsvaerft: "Svendborg Skibsvaerft"
 DEN_terma_AS_aircraft_manufacturer: "Terma AS"
 DEN_idea_welfare_state: "The Welfare State"
 DEN_idea_welfare_state_desc: "The Welfare State is a major part of the danish society, designed to keep the major part of our society in the middle class.\n§W--------------§!\nThis national spirit will be §RRemoved§! and replaced by §Y$DEN_idea_welfare_state1$§! if we complete the §Y$DEN_form_minimal_state$§! focus, or by §Y$DEN_idea_welfare_state2$§! if we complete the §Y$DEN_schroder_blair_paper$§! focus."
 DEN_idea_welfare_state1: "The Danish Minimalstate"
 DEN_idea_welfare_state1_desc: "The danish model of a minimal state is unique, striving to reduce costs as much as possible while maintaining public support."
 DEN_idea_welfare_state2: "The reformed Welfare State"
 DEN_idea_welfare_state2_desc: "The Welfare State is a major part of the danish society, designed to keep the major part of our society in the middle class. However, reforms were necessary to ensure its continued effectiveness and sustainability."
 DEN_agriculture_subvention_TT: "By supporting our Agriculture sector, we increase the stability and independence of our nation."
 DEN_decision_agriculture: "Agricultural subsidies"
 DEN_decision_agriculture_desc: "Agricultural subsidies are financial aids provided by governments to support farmers and agribusinesses. These subsidies aim to stabilize food prices, ensure a steady food supply, promote agricultural productivity, and protect farmers' incomes.\n\n§YFarmer anger§!: [?ROOT.DEN_farmer_anger|0]/100\n§YEnvironmentalist anger§!: [?ROOT.DEN_environmentalist_anger|0]/100\n\nOnce Modern Agriculture is complete, each group can protest every month. Higher anger means more frequent and harsher protests. At 1 with no active policy, a group stays calm. Anger fades by about 1 point each quarter."
 DEN_subventions_for_grain_decision: "Grain Subsidies"
 DEN_subventions_for_pigs_decision: "Livestock Subsidies"
 DEN_subventions_for_beef_decision: "Aquaculture Subsidies"
 DEN_subventions_for_fishing_decision: "Fisheries Subsidies"
 DEN_EU_request_whine_grow_by_decision: "Grow our own Wine"
 DEN_subventions_modernization_decision: "Subsidize modernization efforts for more environmentally friendly equipment."
 DEN_idea_agriculture: "Modern Agriculture"
 DEN_idea_agriculture_desc: "Modern agriculture is characterized by the integration of advanced technologies, sustainable practices, and innovative methods to increase productivity, efficiency, and environmental stewardship. This approach aims to meet the food demands of a growing global population while minimizing the ecological footprint."
 DEN_idea_agriculture_II: "Agriculture subsidies"
 DEN_idea_agriculture_II_desc: "Agricultural subsidies are financial support mechanisms provided by governments to the agricultural sector to stabilize food prices, ensure a stable food supply, and support farmers' incomes. These subsidies can take various forms and serve multiple purposes, addressing both economic and social goals."
 DEN_agriculture: "Modern Agriculture"
 DEN_agriculture_desc: "Modern agriculture is characterized by the integration of advanced technologies, sustainable practices, and innovative methods to increase productivity, efficiency, and environmental stewardship. This approach aims to meet the food demands of a growing global population while minimizing the ecological footprint."
 DEN_modify_farmer_anger_tt: "§YFarmer anger§! changes by [?modify_farmer_anger|-0] (Current: [?DEN.DEN_farmer_anger|Y0])\n"
 DEN_modify_envirementalist_anger_tt: "§YEnvironmentalist anger§! changes by [?modify_environmentalist_anger|-0] (Current: [?DEN.DEN_environmentalist_anger|Y0])\n"
 DEN_envirement_subvention_TT: "Environmental substitution is part of a broader strategy to achieve sustainability and mitigate environmental degradation. It requires innovation, awareness, and commitment from individuals, businesses, and governments to identify and adopt greener alternatives."
