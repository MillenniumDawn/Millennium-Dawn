 SAU_pipeline_transit_IRQ_t3_desc: "Саудовская нефть транспортируется через Ирак, и транзитные сборы пополняют государственную казну. Трубопровод увеличивает добычу нефти в стране. §GДополнительный доход: $1,25 млрд§!"
 SAU_pipeline_transit_JOR_t1: "Транзитный трубопровод Саудовской Аравии (первый уровень)"
 SAU_pipeline_transit_JOR_t1_desc: "Саудовская нефть пересекает границу Иордании, и транзитные сборы пополняют казну. Строительство трубопровода ускоряет темпы строительства в стране. §GAДополнительный доход: $1.00B§!"
 SAU_pipeline_transit_JOR_t2: "Транзитный трубопровод Саудовской Аравии (второй уровень)"
 SAU_pipeline_transit_JOR_t2_desc: "Саудовская нефть проходит через Иорданию, и транзитные сборы пополняют государственную казну. Строительство трубопровода ускоряет темпы строительства в стране. §GДополнительный доход: $1,15 млрд§!"
