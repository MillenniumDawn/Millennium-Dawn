 PROPAGANDA_NATIONALIST: "§YНационалисты§!"
 PROPAGANDA_FASCISM: "§YСалафиты§!"
 prowestern_propaganda_button_tt: "§YПрозападная§! пропагандистская кампания \nИспользуя информационную войну, мы можем влиять на общественное мнение о ситуации в мире. Однако любая такая кампания будет эффективна лишь ограниченное время, поскольку люди постепенно теряют интерес.\n\n§YМодификатор стоимости пропагандистской кампании§!: [?ROOT.modifier@propaganda_campaign_cost_modifier|-2%]\n§YМодификатор стоимости прозападной пропагандистской кампании§!: [?ROOT.modifier@western_outlook_campaign_cost_modifier|-2%]\n\n§YУсловие:§! \n[!prowestern_propaganda_button_click_enabled] \n§YМодификаторы на время действия:§! \n[!prowestern_propaganda_button_click]"
 emerging_propaganda_button_tt: "§YРазвивающаяся§! пропагандистская кампания\nИспользуя информационную войну, мы можем влиять на общественное мнение о ситуации в мире. Однако любая такая кампания будет эффективна лишь ограниченное время, поскольку люди со временем теряют интерес.\n\n§YМодификатор стоимости пропагандистской кампании§!: [?ROOT.modifier@propaganda_campaign_cost_modifier|-2%]\n§YМодификатор стоимости пропагандистской кампании развивающихся стран§!: [?ROOT.modifier@emerging_outlook_campaign_cost_modifier|-2%]\n\n§YУсловие:§!\n[!emerging_propaganda_button_click_enabled]\n\n§YМодификаторы на время действия:§!\n[!emerging_propaganda_button_click]"
 nonaligned_propaganda_button_tt: "§YПропагандистская кампания неприсоединившихся стран§!\nИспользуя информационную войну, мы можем влиять на общественное мнение о ситуации в мире. Однако любая такая кампания будет эффективна лишь ограниченное время, поскольку люди постепенно теряют интерес.\n\n§YМодификатор стоимости пропагандистской кампании§!: [?ROOT.modifier@propaganda_campaign_cost_modifier|-2%]\n§YМодификатор стоимости пропагандистской кампании неприсоединившихся стран§!: [?ROOT.modifier@nonaligned_outlook_campaign_cost_modifier|-2%]\n\n§YУсловие:§!\n[!nonaligned_propaganda_button_click_enabled]\n\n§YМодификаторы на время действия:§!\n[!nonaligned_propaganda_button_click]"
 nationalist_propaganda_button_tt: "§YНационалистическая§! пропагандистская кампания\nИспользуя информационную войну, мы можем влиять на общественное мнение о ситуации в мире, чтобы оно рассматривалось с националистической точки зрения. Однако любая такая кампания будет эффективна лишь ограниченное время, поскольку люди постепенно теряют интерес.\n\n§YМодификатор стоимости пропагандистской кампании§!: [?ROOT.modifier@propaganda_campaign_cost_modifier|-2%]\n§YМодификатор стоимости националистической пропагандистской кампании§!: [?ROOT.modifier@nationalist_outlook_campaign_cost_modifier|-2%] \n\n§YУсловие:§! \n[!nationalist_propaganda_button_click_enabled] \n§YМодификаторы на время действия:§! \n[!nationalist_propaganda_button_click]"
 fascism_propaganda_button_tt: "§YСалафитская§! пропагандистская кампания\nИспользуя информационную войну, продвигая ультраконсервативных священнослужителей и тому подобное, мы можем влиять на общественное мнение о ситуации в мире и радикализировать его в пользу салафизма. Однако любая такая кампания будет эффективна лишь ограниченное время, поскольку люди постепенно теряют интерес.\n\n§YМодификатор стоимости пропагандистской кампании§!: [?ROOT.modifier@propaganda_campaign_cost_modifier|-2%]\n§YМодификатор стоимости салафитской кампании по идеологическому воспитанию§!: [?ROOT.modifier@salafist_outlook_campaign_cost_modifier|-2%]\n\n§YУсловие:§!\n[!fascism_propaganda_button_click_enabled]\n\n§YМодификаторы на время действия:§!\n[!fascism_propaganda_button_click]"
 prowestern_propaganda: "§YПрозападная пропагандистская кампания§! активна\n"
