 KHM_minorities: "유그라의 민족 자치"
 SUB_nat_spirits_added_tt: "당신은 그 £text_icon_rusgerb §Y종속국§!이므로, §Y[SOV.GetNameWithFlag]§!도 이 §Y국가 정신§!을 함께 얻습니다."
 KHM_bund_moscow_tt: "모스크바에서 폭동을 일으킵니다."
 PMR_attack_mlv: "§Y[MLV.GetNameWithFlag]§! 공격 제안"
 subject_rus.42.t: "트란스니스트리아 상원의원, [MLV.GetName] 공격 촉구"
 subject_rus.42.d: "트란스니스트리아 출신 상원의원이 연방회의에 상당히 위험하고 공격적인 제안을 했습니다. 트란스니스트리아 정부는 트란스니스트리아의 존립에 대한 위협을 완전히 제거하기 위해 몰도바 영토에서 군사 작전을 수행할 것을 주장하고 있습니다."
 subject_rus.42.a: "몰도바를 공격한다"
 subject_rus.42.b: "그들을 공격해서는 안 된다."
 SUB_nationalism_category: "공화국 내 분리주의"
 SUB_nationalism_category_desc: "\n\n\n\n\n\n£SOV_desctext_separatism\n\n\n\n\n\n\n\n\n우리 민족은 비교적 최근에야 자아의식을 갖게 되었고, 소련의 붕괴는 자유를 얻을 기회를 주었으나 우리는 이를 거절했습니다. 이제 우리에게는 두 번째 기회가 있으며, 러시아와 함께할지 아니면 러시아 없이 갈지 단호히 결정해야 합니다.\n\n현재 우리나라의 분리주의 지지도: §Y[?ROOT.subjectinped]§!%"
 SUB_anti_russia: "§Y주권 국가§! 선언"
 TAT_Measures_of_rapprochement_with_the_West: "서방과의 접근 조치"
 TAT_Measures_of_rapprochement_with_the_West_desc: "서방은 우리의 친구입니다. 우리는 이를 계속 되풀이할 것입니다."
 TAT_power_to_the_workers: "노동 계급에 투자"
 TAT_power_to_the_workers_desc: "우리는 우리 경제 성장의 엔진이 될 노동 계급에 집중하겠습니다."
 TAT_authoritarian_control_over_economy: "경제에 대한 권위주의적 통제"
 TAT_authoritarian_control_over_economy_desc: "우리 국가의 경제 분야는 우연에 맡겨져 있었지만, 이제 강력한 지도자의 통제 아래로 되돌릴 것입니다."
 TAT_create_patrioitc_schools: "애국 학교 설립"
 TAT_create_patrioitc_schools_desc: "애국 학교는 청년층에 대한 우리의 영향력을 키우고 공산당의 집권을 유지하는 데 도움이 될 것입니다."
 TAT_the_peoples_militias: "인민 민병대"
 TAT_the_peoples_militias_desc: "국민을 위한 충분한 재정을 갖춘 민병대를 편성하면 어떤 분쟁에서도 군이 충분한 지지를 받을 수 있습니다."
 TAT_red_army: "타타르 붉은 군대"
