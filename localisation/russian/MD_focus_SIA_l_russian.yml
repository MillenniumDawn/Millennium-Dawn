 SIA_rvconnex_trait: "Фонд беспилотных систем"
 thailand.51.d_lapsed: "Резервный кредит проходит весь свой срок, и последние обязательства гасятся по графику Фонда, а не раньше. Ни телеобращения, ни заголовков о возвращённой экономической независимости — но условия кредита всё равно перестают действовать."
 thailand.427.t: "Красный флаг над Бангкоком"
 thailand.427.d: "Правительство в руках Коммунистической партии Таиланда. Не из холмов и не с линии пикета, а из избирательной урны, которую истеблишмент уверенно считал своей. Старые партии выставлены из министерств, а вместе с ними уходят их покровительство и их дух. Внутри партии никто не считает дело законченным. Большинство, добытое по старой конституции, по ней же можно и отнять, а те, кто эту конституцию писал, по-прежнему в казармах. Работа по закреплению победы начинается немедленно."
 thailand.427.a: "Избирательная урна была лёгкой частью."
 SIA_quiet_word_pressure: "Дворец давит"
 SIA_quiet_word_pressure_desc: "Ни танков, ни воззваний. Лишь ровное давление институтов, переживающих любые правительства, и страна с каждым днём чуть больше поворачивается к дворцу."
 SIA_cadre_mobilisation: "Мобилизация кадров"
 SIA_cadre_mobilisation_desc: "Лучшие организаторы партии сидят по деревням и предприятиям, а не на собственных рабочих местах, а школьные классы отданы под политпросвет. Движение растёт; больше не растёт ничего."
 SIA_strike_campus_walkout: "Студенческая забастовка"
 SIA_strike_campus_walkout_desc: "Университеты приостановили занятия на всё время забастовки. Аудитории, библиотеки и лаборатории пусты, пока их студенты держат улицу, а зависящие от них исследовательские программы стоят."
 SIA_strike_shutdown: "Всеобщая остановка"
 SIA_strike_shutdown_desc: "Цеха пусты, кассы тоже. Ничего не производится и ничего не собирается."
 SIA_strike_supply_freeze: "Заморозка снабжения"
 SIA_strike_supply_freeze_desc: "Рудники отрезаны от портов, а порты — от моря. Всё, что страна добывает, лежит там, где его добыли."
 SIA_strike_world_watching: "Мир смотрит"
 SIA_strike_world_watching_desc: "Каждая иностранная редакция в Бангкоке укомплектована полностью и ищет источник. Правительство не может выступить против забастовки тихо — и не может удержать посторонних подальше от своих дел."
 SIA_strike_barracks_agitation: "Агитация в казармах"
 SIA_strike_barracks_agitation_desc: "Организаторы движения работают в казармах с призывниками, а не в министерствах. Каждая неделя, потраченная на то, чтобы настроить солдат против офицеров, — это неделя, когда государственной машиной никто не занимается."
