 BOS_mechanization_of_the_army_desc: "受保护的机动性将使一支小规模军队能够快速调动预备队，并在现代战场上生存下来。"
 BOS_boots_on_the_ground_desc: "波斯尼亚的防御可以以训练有素的步兵、预先准备的阵地和庞大的预备队为中心，而不是以昂贵的车辆为中心。"
 BOS_national_high_command_desc: "联合最高指挥部将把各实体军队置于国家文职当局的管辖之下，并制定共同的规划标准。"
 BOS_aerial_dominance_desc: "战斗航空计划将优先考虑战斗机战备、飞行员素质和对波斯尼亚空域的控制。"
 BOS_transportation_methods_desc: "现代化的公用车辆和后勤流程将提高部署速度并减少供应中断。"
 BOS_rifle_advancements_desc: "现代制式步枪、防弹衣和生产方法将提高步兵作战效能和国内供应能力。"
 BOS_wave_tactics_desc: "以预备队为主的作战理论将利用集中的步兵阵型来守住阵地并承受持续的压力。"
 BOS_civilian_training_desc: "扩大预备役训练范围，使平民做好动员准备，而无需维持一支负担不起的常备军。"
 BOS_restoration_of_old_aircraft_desc: "修复遗留的直升机并重建空军基地将恢复有限的运输航空能力。"
 BOS_aircraft_acquiring_desc: "俄罗斯战斗机为快速投入空战提供了途径，但采购和驻扎成本将给国库带来压力。"
 BOS_personal_carriers_desc: "步兵战车将完成从机动运输到受保护的联合兵种部队的转变。"
 BOS_resupply_equipment_desc: "现代无线电设备、支援武器和后勤装备将使前线部队更加自给自足。"
 BOS_artillery_refurbishment_desc: "翻新遗留枪支并规范弹药将恢复可靠的火力支援。"
 BOS_small_arms_purchase_desc: "在国内生产重组期间，外国步枪可以暂时填补库存短缺。"
 BOS_mobilization_requirements_desc: "明确的预备役义务和征召程序将使政府能够在紧急情况下扩充军队。"
 BOS_combine_the_armies_desc: "全面整合将解散平行实体指挥系统，并建立单一的国家指挥链。"
 BOS_great_level_of_cooperation_desc: "实体组织可以在保持各自独特传统的同时，采取联合规划、培训和采购的方式。"
 BOS_the_land_fleet_desc: "通用车辆标准将把运输车辆、载具和支援车辆整合为一支可维护的机械化部队。"
 BOS_main_battle_line_desc: "反装甲武器和机动预备队将使波斯尼亚能够在不投入大量资金组建坦克部队的情况下对抗更强大的敌军。"
 BOS_streamline_production_desc: "标准化的合同和组装方法将降低步兵装备的供应成本。"
 BOS_provide_equipment_updates_desc: "有计划的现代化改造周期将确保各军种的步枪和支援武器保持兼容。"
 BOS_general_staff_reforms_desc: "专业规划、统一的人员操作流程和现代化的防护装备将取代战时临时应对措施。"
 BOS_aerial_cooperation_desc: "防空和航空司令部将共享监视数据、基地规划和作战控制。"
 BOS_officer_training_desc: "国家军官培训计划将培养一支忠于国家机构而非实体指挥部的专业队伍。"
 BOS_military_drills_desc: "联合演习将检验新的指挥结构，并暴露协调方面仍然存在的不足。"
 BOS_prepping_an_offensive_desc: "参谋人员将确定前进的决定性轴线，并在内战下一阶段开始前储备物资。"
 BOS_bosnian_elections_desc: "全球金融危机暴露了波斯尼亚对外国信贷的依赖、疲软的出口以及分裂的体制。政府必须在经济衰退根深蒂固之前选择复苏政策。"
 BOS_economic_revision_desc: "必须修改税收政策，为经济复苏提供资金，同时又不抑制投资或家庭需求。"
 BOS_post_war_effort_desc: "战后多年，重建工作尚未完成、社区流离失所、机构遭到破坏等问题仍然制约着发展。"
 BOS_rally_the_troops_desc: "地方指挥官将召回预备役人员，重建在初期战斗中损失惨重的部队。"
 BOS_commence_the_offensives_desc: "协同攻击将利用我方野战指挥部所做的准备，迫使敌人撤离关键阵地。"
 BOS_dig_in_desc: "如果进攻受阻，坚固的阵地和预先准备好的后备防线将保护我们的兵力。"
 BOS_detain_serbian_generals_desc: "起诉被控犯有战争罪行的军官将增强国际社会的信任和法治，但会加深塞族共和国的抵抗。"
 BOS_release_serbian_generals_desc: "尽管遭到受害者团体的批评，但释放被拘留的塞尔维亚军官将有助于与塞族共和国和塞尔维亚实现和解。"
 BOS_grant_more_rights_to_serbian_peoples_desc: "加强对塞尔维亚代表权的保障可以减少分裂主义压力，并将投资引导至被忽视的社区。"
 BOS_oppress_serbian_back_supports_desc: "外国汽车制造商可以提供就业机会和生产性资本，但它们的影响将塑造波斯尼亚的产业政策。"
 BOS_the_state_desc: "需要有能力的国家机构来协调恢复工作，同时尊重波斯尼亚宪法规定的权力划分。"
 BOS_grant_herzegovinians_more_rights_desc: "增加警务经费将改善地方治安和执法状况，但增加的支出会加重国家预算负担。"
 BOS_limit_herzegovinians_desc: "减少警务开支可以节省公共资金，但执法力度减弱可能会让有组织犯罪得以扩张。"
 BOS_mobilize_the_nation_desc: "紧急动员将扩大武装部队可用的训练有素的替补人员储备。"
 BOS_request_military_supplies_desc: "土耳其和阿尔巴尼亚可能会提供步兵武器，但两国政府将自行决定是否能够提供这些装备。"
 BOS_bosnians_will_lead_the_military_desc: "一个民事国家指挥部将完成促进融合的恢复计划，并结束紧急财政措施。"
 BOS_anti_serbian_propaganda_desc: "将外国工业企业国有化将扩大国家控制，但会损害投资者信心和与德国的关系。"
 BOS_improve_road_quality_in_sarajevo_desc: "修复萨拉热窝的道路网络将重新连接各个街区，减少货运延误，并支持服务业的进一步投资。"
 BOS_improvement_of_the_health_care_system_desc: "全国统一的医疗保健标准将扩大医疗服务范围，并取代战后支离破碎的医疗体系。"
 BOS_secure_regional_support_for_government_desc: "一个稳定的政府需要市政和实体领导人的合作，而不仅仅是萨拉热窝议会的多数席位。"
 BOS_crackdown_of_anti_war_propaganda_desc: "战时审查和反宣传将以牺牲公开的政治辩论为代价，维护公众的决心。"
 BOS_formation_of_a_junta_desc: "军事委员会可以统一战争行动，但文职机构将失去对国家的控制。"
 BOS_removal_of_the_dayton_accords_desc: "改革代顿体系将把更多责任转移给国家机构，同时保留和平协议的保护措施。"
 BOS_post_war_clean_up_desc: "清理废墟、未爆弹药和废弃场所，将为受损地区的重建做好准备。"
 BOS_improve_service_industry_desc: "现代化的办公场所、可靠的公共设施和较低的营业税将有助于萨拉热窝发展具有竞争力的服务型经济。"
 BOS_improvement_of_the_education_system_desc: "统一的教育标准和更好的学校将提高技能，同时减少公共管理领域的腐败。"
 BOS_banja_luka_mine_desc: "现代化的设备和安全标准能够使巴尼亚卢卡的采矿业恢复盈利生产。"
 BOS_farming_sector_desc: "排雷和农业投资将有助于家庭农场实现现代化，并供应国内市场。"
 BOS_end_nato_desc: "伊斯兰政府将挑战北约的地区地位，并为一场它可能无法控制的对抗做好准备。"
 BOS_national_appeasement_desc: "和解计划将改善波斯尼亚人、克罗地亚人和塞尔维亚人之间的关系，并促使政府致力于和平的宪法改革。"
 BOS_role_the_dice_desc: "塞族共和国领导人可能会强行推进政权巩固，但同时也可能面临严重的动荡和再次爆发内战的风险。"
 BOS_popular_support_desc: "在所有三个组成民族之间达成的协商授权将为塞族共和国领导的政府提供一条更安全的改革之路。"
 BOS_develop_national_sentiment_desc: "持续不断的爱国主义运动将巩固战时政权，保持全国动员状态。"
 BOS_land_mine_removal_desc: "一项全国性的排雷计划将绘制受污染土地的地图，培训排雷队，并减少战争持续造成的人员伤亡。"
 BOS_rebuild_infrastructure_in_sarajevo_desc: "萨拉热窝的重建将加强首都的电网并重新开放其铁路枢纽，这表明国家复苏仍然是优先事项。"
 BOS_rebuild_infrastructure_in_srpska_desc: "重建巴尼亚卢卡的电网和比耶利纳的铁路枢纽将把塞族共和国的各个社区与国家市场和机构连接起来。"
 BOS_rebuild_infrastructure_in_herzegovina_desc: "黑塞哥维那加强的铁路网和运营中的铁路枢纽将改善通往莫斯塔尔的交通，并重振南部地区的贸易。"
 BOS_build_a_war_memorials_desc: "纪念碑将缅怀平民和军人伤亡，同时为社区提供公众纪念的场所。"
 BOS_make_way_for_more_industry_desc: "如果采矿业和农业都得到必要的准备，它们就能支撑更广泛的农村工业基础。"
 BOS_military_industrialization_desc: "在萨拉热窝兴建一家有成本预算的武器工厂将有助于重新武装，前提是当地经济能够提供人员和资金。"
 BOS_autonomy_advancements_desc: "将黑塞哥维那和塞族共和国作为自治主体释放，将使波斯尼亚境内的实体自治正式化。"
 BOS_cooperative_effort_desc: "一个合作的塞族共和国计划将维护联邦机构，并通过协商一致而非强制手段实现向东部靠拢。"
 BOS_removal_of_lands_in_herzegovina_desc: "清理小组将重新开放黑塞哥维那受污染的土地，用于居民定居、农业耕作和交通运输。"
 BOS_removal_of_lands_in_central_bosnia_desc: "清除波斯尼亚中部地区的地雷将保护当地人口稠密的社区，并恢复可耕种的土地。"
 BOS_removal_of_lands_in_central_srpska_desc: "在塞族共和国中部进行排雷工作，将使受损的农村地区能够安全地进行灾后重建。"
 BOS_rebuild_factories_in_sarajevo_desc: "重建后的民用工厂和配套基础设施将恢复萨拉热窝的工业就业。"
 BOS_the_repair_of_srpska_and_herzegovina_desc: "在塞族共和国和黑塞哥维那进行均衡的工业和基础设施投资，将表明经济复苏的范围不仅限于萨拉热窝。"
 BOS_national_unrest_desc: "局势不稳和社区敌对情绪加剧，为劳工组织挑战两大民族主义阵营开辟了道路。"
 BOS_state_opposition_desc: "公民反对派将通过选举与塞族民族主义政党竞争，在联邦权威与进一步疏远塞尔维亚选民的风险之间取得平衡。"
 BOS_eastern_trade_bloc_desc: "与俄罗斯和塞尔维亚的互惠贸易协定将把政治联盟转化为持续的商业准入。"
 BOS_commence_centralization_desc: "塞族共和国当局将把实体权力移交给中央政府，并镇压与之竞争的宪法中心。"
 BOS_national_agenda_desc: "共同的立法方案将结合社会稳定、财政改革以及对所有三个组成民族的承认。"
 BOS_final_land_mine_removal_efforts_desc: "协调区域计划将清除剩余的已勘测雷区，并结束波斯尼亚战后排雷行动。"
 BOS_workers_front_desc: "工人阵线将把不满的工会组织成一支全国性的政治力量，并制定自己的经济纲领。"
 BOS_national_unity_desc: "经过协商过渡后，各实体将回归国家直接管理，恢复多元化的联邦制国家。"
 BOS_cooperative_alliance_desc: "俄罗斯将决定波斯尼亚东部伙伴关系是否足以使其加入集体安全条约组织。"
 BOS_introduction_of_mandatory_conscription_desc: "强制服役将扩大兵员储备，但代价是给家庭和雇主带来更重的负担。"
 BOS_decrease_poverty_rate_desc: "有针对性的社会支出将减少贫困，并稳定战后重建期间被忽视的社区。"
 BOS_the_teachings_of_orthodox_desc: "与东正教神职人员的合作将加强东方社会契约，同时将伊斯兰机构从政府中驱逐出去。"
 BOS_concessions_to_the_work_unions_new_desc: "具有约束力的工会协议将以社会支出和工作场所权利换取政治稳定。"
 BOS_puppet_economics_new_desc: "工人委员会将在管理中获得正式地位，而更高的企业税收将为新制度提供资金。"
 BOS_religious_identity_desc: "这个伊斯兰国家将声称对境外的波斯尼亚克族群拥有领导权，并制定强制性的区域政策。"
 BOS_tax_reforms_desc: "降低家庭和企业税率将扩大政治支持，但同时也会减少州政府的直接收入。"
