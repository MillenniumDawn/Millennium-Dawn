l_english:
 STALKER.130.t: "Catastrophic Emission"
 STALKER.130.d: "An emission has torn through the weakened perimeter of [STALKER_zone_name]. Satellite images show burned-out checkpoints and a glowing sky, and neighbouring governments are asking whether their borders are next."
 STALKER.130.a: "The Zone will not stay contained forever."
 STALKER.131.t: "They Kept Our Artifacts"
 STALKER.131.d: "[From.GetName] has refused to hand back artifacts smuggled out of our Zone and seized by its customs officers. Its laboratories are already studying them."
 STALKER.131.a: "Demand their return."
 STALKER.131.b: "Not worth a dispute."
 STALKER.132.t: "NATO Discusses the Zone"
 STALKER.132.d: "Allied defence ministers have spent a closed session on the anomalous Zone in [?global.STALKER_zone_host_target.GetName]. Containment there is failing, and several members want the alliance to pay for a stronger perimeter."
 STALKER.132.a: "Fund the containment effort."
 STALKER.132.a_tt: "The Chornobyl Zone gains §G10§! §Ycontainment§!."
 STALKER.132.b: "It is not an alliance matter."
 STALKER.133.t: "Moscow Offers Specialists"
 STALKER.133.d: "Our emergency ministry has experience with contaminated land, and the Zone in [?global.STALKER_zone_host_target.GetName] is slipping out of control. Offering our specialists would buy influence where it matters."
 STALKER.133.a: "Send the specialists."
 STALKER.133.a_tt: "The Chornobyl Zone gains §G5§! §Ycontainment§!."
 STALKER.133.b: "Let them manage their own disaster."
 STALKER.134.t: "Our Expedition Lost in the Zone"
 STALKER.134.d: "A research team we sent into the Zone under an access agreement has not come back. Its last transmission described an anomaly that was not on any map."
 STALKER.134.a: "The host government failed to protect them."
 STALKER.134.b: "They knew the risks."
 STALKER.135.t: "Foreign Scientists Killed in the Zone"
 STALKER.135.d: "Researchers from [?global.STALKER_casualty_country.GetName] have died inside an anomalous Zone. The deaths have reopened the argument over whether foreign teams should be allowed in at all."
 STALKER.135.a: "The Zone takes whoever enters it."
 STALKER.136.t: "A Zone on Our Soil"
 STALKER.136.d_usa: "An anomalous Zone has opened inside the United States. Congress wants hearings, the Pentagon wants the perimeter, and universities want samples. The administration has to choose who gets the Zone first."
 STALKER.136.d_sov: "A Zone has opened on Russian soil. The security services want it sealed and classified, while the Academy of Sciences argues that Russia cannot afford to fall behind in anomalous research."
 STALKER.136.d_chi: "A Zone has opened inside China. The Party leadership has ordered it secured, but the question is whether it becomes a closed military area or a national research priority."
 STALKER.136.d: "An anomalous Zone has opened on our territory. As a great power, the world is watching how we handle it."
 STALKER.136.a: "Put the military in charge."
 STALKER.136.a_tt: "Costs §R50§! political power. The new Zone gains §G15§! §Ycontainment§!."
 STALKER.136.b: "Make it a national research priority."
 STALKER.136.b_tt: "The new Zone gains §G10§! §Yexploitation§!, raising our research from it."
 STALKER_kept_seized_artifacts: "Kept our seized artifacts"
 STALKER_blamed_for_casualties: "Blamed for expedition deaths"
 STALKER.137.t: "The Council Takes Up the Zones"
 STALKER.137.d: "The permanent members are meeting on the new anomalous Zones. They can back containment, open research access for the governments that vote for it, or adjourn. A tie adjourns the session."
 STALKER.137.a: "Vote for containment."
 STALKER.137.a_tt: "Our ballot counts for containment."
 STALKER.137.b: "Vote for research access."
 STALKER.137.b_tt: "Our ballot counts for access. If access wins, every government that voted for it receives Zone research access."
 STALKER.137.c: "Vote to adjourn."
 STALKER.137.c_tt: "Our ballot counts for adjournment. A tie also adjourns the session."
 STALKER.138.t: "The Council Session Closes"
 STALKER.138.d_containment: "The session closed in favor of containment. No new research access came out of the vote."
 STALKER.138.d_access: "The session closed in favor of research access. Governments that voted for access can study the Zones."
 STALKER.138.d_adjourn: "The session adjourned without a decision. Containment and access were left where they stood."
 STALKER.138.a: "The Council has spoken."
