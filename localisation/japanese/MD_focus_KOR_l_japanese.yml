 KOR_grant_wartime_control: "戦時作戦統制権付与"
 KOR_grant_wartime_control_desc: "我々はアメリカ合衆国と、もし我が国が北朝鮮と戦争状態に入った場合、軍隊に対する作戦統制権が彼らに移管されることに合意した。これを拒否することは戦争遂行にとって壊滅的だろう。"
 KOR_expeditionary_forces_tt: "全ての部隊が§Y[USA.GetNameDef]§!へ§Y遠征軍§!として送られた！"
 38th_parallel_KOR: "統一省"
 KOR_38th_parallel: "The 38th Parallel Affair"
 KOR_38th_parallel_desc: "第二次世界大戦後、朝鮮は分断国家となった。イデオロギーの二極化と大国間の対立は、家族を分断し、朝鮮民族の潜在能力の発揮を妨げてきた。年配の世代は統一朝鮮を今でも覚えており、統一を切望しているが、統一半島の記憶は徐々に薄れ始めている。\n\n§Y統一支持§!は、国民が統一交渉でどれだけ譲歩するかを決定する。月に0.1%の割合で減少し、ディシジョン・国家方針・イベントの影響を受ける。統一が実現した場合、あるいはその時、国が一つにまとまるためには、高い支持率を維持する必要がある\n\n§Y朝鮮半島の緊張度§!は、半島における中国の姿勢がどれほど不安定になっているかを追跡する。積極的な国家方針や挑発行為はこれを上昇させ、緊張緩和の国家方針、外交上の決定、および毎月の自然減（§G-1§!を超えている間は§Y30§!）によって低下する。§Y40§!、§Y60§!、§Y80§!の閾値を超えると、段階的に深刻化する国際危機が発生する。中国の§Y九点共識§!ルートを維持するには、緊張度が§G40未満§!である必要がある。\n\n[KOR.GetFlag] §Y統一支持率§!: [?KOR.SFR]%\n$CHI_korea_peninsula_tension_display$\n\n[NKO.GetFlag] 和平受け入れの可能性: [NKO_peace_likelihood]\n[NKO.GetFlag] 統一政府受け入れの可能性: [NKO_unity_likelihood]\n[NKO.GetFlag] 南主導政府受け入れの可能性: [NKO_south_likelihood]"
 KOR_close_kaesong_industrial_park: "開城工業団地閉鎖"
 KOR_close_kaesong_industrial_park_desc: "DMZの向こうの相手国は信頼できない。彼らがそれから利益を得るのを防ぐために、開城工業団地を閉鎖すべきである。"
 KOR_reopen_kaesong_industrial_park: "開城工業団地再開"
 KOR_reopen_kaesong_industrial_park_desc: "我々はより良い関係を追求する意思があることを同胞に示す必要がある。その目的のために、開城工業団地へのアクセスを再開すべきである。"
 KOR_organize_joint_sporting_events: "合同スポーツチームの結成"
 KOR_organize_joint_sporting_events_desc: "オリンピックのような国際的なスポーツイベントに単一チームとして参加することで、南北の距離は縮まり、統一朝鮮の夢は現実に近づくだろう。"
 KOR_screen_north_korean_films: "北朝鮮映画の上映"
 KOR_screen_north_korean_films_desc: "韓国映画祭で北朝鮮映画の上映を許可することにより、比較的無害な分野での南北交流を促進するのに役立つだろう。これらの交流は、北朝鮮を我々の国民の目にはより不可知で敵対的でないものにするだろう。"
 KOR_encourage_sympathetic_portrayals_of_the_north: "北朝鮮への同情的描写奨励"
 KOR_encourage_sympathetic_portrayals_of_the_north_desc: "多くの左傾的映画製作者は、彼らの作品で北朝鮮を比較的に同情的に描く傾向がある。この慣行を奨励することは、再統一への進展を妨げ続ける北朝鮮への継続的な敵意と疑念に対抗するのに役立つだろう。"
 KOR_cease_propaganda_broadcasts: "プロパガンダ放送の停止"
 KOR_cease_propaganda_broadcasts_desc: "我が軍が北朝鮮に向けて行う拡声器放送は、北の隣人をさらに敵に回す以外のことをほとんど達成していない。両朝鮮間の友好的な関係を促進するのを助けるために、これらの放送を中断すべきである。"
 KOR_restart_propaganda_broadcasts: "プロパガンダ放送再開"
 KOR_restart_propaganda_broadcasts_desc: "The North have shown that they are not to be trusted. Restarting the loudspeaker broadcasts directed at North Korean troops will demonstrate our resolve in resisting the North's aggression."
 KOR_cease_propaganda_leaflets: "プロパガンダビラ配布禁止"
 KOR_cease_propaganda_leaflets_desc: "Propaganda leaflets sent by balloon from our territory to the North have been a point of contention in inter-Korean relations. It is time to put a stop to this practice by South Koreans and North Korean defectors."
 KOR_restart_propaganda_leaflets: "プロパガンダビラ配布許可"
 KOR_restart_propaganda_leaflets_desc: "北へのビラ配布禁止は、人権への我々のコミットメントと矛盾する。この慣行を再許可することは、我々の価値観がどこにあるかを示すだろう。"
 KOR_guerrilla_mobilization: "ゲリラ動員"
 KOR_guerrilla_mobilization_desc: "アメリカ合衆国の帝国主義的野心が朝鮮を二つに分断して以来、我々の人々は解放を切望してきた。いわゆる大韓民国を統治するアメリカの手先を打倒し、朝鮮国家の回復を追求する政府を樹立するための革命を点火する時が来た。"
 KOR_recruitment_campaign: "募集キャンペーン開始"
 KOR_recruitment_campaign_desc: "我が国を分断する資本主義、帝国主義勢力に対して武器を取るよう朝鮮の若者に訴えなければならない。"
 KOR_raid_armories: "造兵廠を襲撃"
 KOR_raid_armories_desc: "もし警察武器庫や軍事備蓄さえも警備が手薄であれば、我々の大義のためにいくつかの武器を確保できるかもしれない。"
 juche_volunteers_tt: "より多くの義勇兵が我々の大義に参加するだろう。"
 juche_arms_tt: "§YM16A1§! §Y600§!ユニット、§YM72 LAW§! §Y15§!ユニット、および§YFIM-43レッドアイ§! §Y5§!ユニットが確保される。"
 juche_arms1_tt: "§Y56式自動小銃§! §Y600§!ユニット、§YHJ-73§! §Y15§!ユニット、および§YHN-5§! §Y5§!ユニットが確保される。"
 KOR_juche_threat: "韓国における親DPRK蜂起"
 KOR_smuggle_arms: "武器密輸"
 KOR_smuggle_arms_desc: "38度線の厳重な警備は北からの武器密輸を事実上不可能にするが、船で中国から闇市場武器を密輸することによっていくつかの武器を確保できるかもしれない。"
 KOR_restart_peace_talks: "和平協議再開"
 KOR_restart_peace_talks_desc: "北朝鮮は我々の和平提案を拒否したが、それは我々が再試行できないという意味ではない。しかし、まず前回の協議失敗の繰り返しを防ぐためにできることを試みるべきだ。"
 KOR_propose_south_led_reunification_decision: "南主導の統一を提案"
 KOR_propose_south_led_reunification_decision_desc: "経済成長率から生活水準に至るまで、韓国モデルこそが朝鮮半島の未来を導くものであることは明らかだ。我々こそが、統一後の明るい未来へと朝鮮を導くべき存在であることを強く主張しなければならない。"
 KOR_propose_unity_reunification_decision: "統一政府を提案"
 KOR_propose_unity_reunification_decision_desc: "The leaders of the North are unlikely to agree to a deal that would see them removed from power and potentially punished for their past actions. A unity government between North and South is the best way to pursue the cause of Korean reunification."
 NKO_propose_north_led_reunification_decision: "北主導の統一を提案"
 NKO_propose_north_led_reunification_decision_desc: "軍事力から自力更生のシステムまで、北朝鮮のモデルが朝鮮半島の前進の道であることは明らかである。統一後の強力な未来に向けて韓国を導くものであるべきだと主張しなければならない。"
 NKO_propose_unity_reunification_decision: "統一政府を提案"
 NKO_propose_unity_reunification_decision_desc: "The leaders of the South are unlikely to agree to a deal that would see them removed from power and their way of life dramatically altered. A unity government between North and South is the best way to pursue the cause of Korean reunification."
