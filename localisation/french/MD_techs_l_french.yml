 tech_rail_battery_3_desc: "Les batteries de canons électromagnétiques de troisième génération ajoutent une durée de vie des tubes, une gestion thermique et une automatisation des soutes à la pointe, permettant un tir de salve soutenu à cadence élevée sans usure paralysante. Avec une distribution d'énergie plus intelligente et une visée avancée, ces affûts à triple rail peuvent dominer les engagements de surface et fournir un appui-feu de précision à longue portée bien au-delà de l'artillerie navale conventionnelle."
 composite_production_6: "Production de composites de pointe"
 composite_production_6_desc: "La production composite de pointe étend les thermoplastiques, le drapage robotisé et le suivi de procédé en temps réel, permettant de produire plus vite et avec moins de défauts des cellules furtives complexes, des panneaux de blindage et des structures de véhicules."
 composite_production_7: "Production de composites dans un futur proche"
 composite_production_7_desc: "La production composite du quasi-futur intègre nanomatériaux, couches absorbant les radars et capteurs structurels embarqués, créant des composants plus légers qui améliorent la protection, réduisent les signatures et surveillent les dégâts en opération."
 composite_production_8: "Production future de composites"
 composite_production_8_desc: "La production composite future utilise des fibres programmables, des matrices auto-réparantes et une fabrication optimisée par IA pour créer des structures ultra-légères combinant protection, furtivité, contrôle thermique et résistance aux dégâts au combat."
