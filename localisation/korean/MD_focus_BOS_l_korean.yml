 BOS_bnttmih_mio_trait_m56a1_barrel: "M-56A1 장포신"
 BOS_bnttmih_mio_trait_rifling_metallurgy: "강선 야금술"
 BOS_bnttmih_mio_trait_field_cannon_130: "130mm 야전포"
 BOS_bnttmih_mio_trait_self_propelled_program: "자주포 프로그램"
 BOS_bnttmih_mio_trait_soko_spg: "M-09 소코"
 BOS_bnttmih_mio_trait_mlrs_battery: "로켓 포대 라인"
 BOS_bnttmih_mio_trait_sph155_prototype: "155mm 자주 곡사포 시제품"
