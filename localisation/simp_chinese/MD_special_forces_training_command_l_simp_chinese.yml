 MD_sftc_fully_upgraded: "完全升级"
 MD_sftc_exercise_ranger: "游骑兵评估演习"
 MD_sftc_exercise_ranger_desc: "游骑兵们要经过一系列选拔和考核课程，这些课程围绕远程巡逻、导航和在持续疲劳状态下的小队战术展开。"
 MD_sftc_ex_ranger_short: "特种游骑兵团精通度上升90天。"
 MD_sftc_exercise_marine: "两栖突袭演习"
 MD_sftc_exercise_marine_desc: "特种海军陆战队分遣队进行海上突袭演练，使用水面舰艇和小型船只，针对设防海岸线展开行动。"
 MD_sftc_ex_marine_short: "特种陆战队精通度上升90天。"
 MD_sftc_exercise_airborne: "空降突袭演习"
 MD_sftc_exercise_airborne_desc: "空降部队通过降落伞和运输机进行夜间突袭演练，随后集结并向目标推进。"
 MD_sftc_ex_airborne_short: "空降部队精通度上升90天。"
 MD_sftc_exercise_joint: "联合特种作战演习"
 MD_sftc_exercise_joint_desc: "游骑兵、海军陆战队和空降兵分队在同一特种作战司令部下进行训练，并在陆地、海洋和空中进行联合作战。"
 MD_sftc_ex_joint_short: "特种作战精通度提升90天"
 MD_sftc_exercise_air_assault: "空中突击破袭"
 MD_sftc_exercise_air_assault_desc: "游骑兵乘坐直升机和运输机部署到前线后方，夺取目标，坚守目标，并在空中掩护下撤退。"
 MD_sftc_ex_air_assault_short: "特种作战后勤精通度提升90天"
 MD_sftc_exercise_littoral: "滨海游骑兵演习"
 MD_sftc_exercise_littoral_desc: "游骑兵接受训练，从沿海通道、河流和岛屿等海上开展行动，利用船只和海军炮火支援到达内陆目标。"
 MD_sftc_ex_littoral_short: "特种作战后勤精通度提升90天"
 MD_sftc_exercise_envelopment: "垂直包围演习"
 MD_sftc_exercise_envelopment_desc: "海军陆战队和空降部队同时从海上和空中打击同一目标，以分割防守方的预备队。"
 MD_sftc_ex_envelopment_short: "特种作战后勤精通度提升90天"
 MD_sftc_school_name: "特种作战训练项目"
 MD_sftc_school_short: "解锁特种作战学校，增强演习效果。"
 MD_sftc_school_level_text: "等级[?ROOT.MD_sftc_school_level|0]/3"
