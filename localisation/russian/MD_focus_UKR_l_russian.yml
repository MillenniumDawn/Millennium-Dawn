 ukr_modernize_sov_equipment_t55_procurement_program.1.desc: "§YХарьковский бронетанковый завод§! готов забирать корпуса с баз хранения. По какому стандарту модернизации будет работать линия?\n\nКорпусов на хранении: §Y[?ukraine_has_t55_stockpile|0]§!"
