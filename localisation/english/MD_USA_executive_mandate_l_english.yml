l_english:
 USA_executive_mandate_category: "Executive Mandate"
 USA_mandate_expand_enforcement: "Expand Field Operations"
 USA_mandate_expand_enforcement_desc: "Field offices get the headcount, the vehicles and the overtime budget to work at a tempo the enforcement service has not sustained before."
 USA_mandate_fund_detention: "Fund Detention Capacity"
 USA_mandate_fund_detention_desc: "Contracts are signed for beds. The capacity is built ahead of the caseload on the reasoning that a facility standing empty is cheaper than one that is not there."
 USA_mandate_interior_surge: "Interior Enforcement Surge"
 USA_mandate_interior_surge_desc: "Operations move inland from the frontier to workplaces and courthouses. The numbers rise, the labour force in several sectors does not, and the footage travels."
 USA_mandate_expedited_removal: "Expand Expedited Removal"
 USA_mandate_expedited_removal_desc: "The window for review is narrowed and the categories it applies to are widened. Cases clear quickly; so do the appeals that would have slowed them."
 USA_mandate_escalate: "Escalate the Mandate"
 USA_mandate_escalate_desc: "The administration reads its win as authorisation for the next measure, and the next one after that. Each tier buys compliance and spends something less easily recovered."
 USA_mandate_stand_down: "Wind Down the Mandate"
 USA_mandate_stand_down_desc: "The programme is scaled back. The institutional damage does not reverse at the same rate as the political cost."
