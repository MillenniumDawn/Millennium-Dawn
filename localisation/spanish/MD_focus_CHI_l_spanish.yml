 CHI_korea_peninsula_tension_display: "$CHI_korea_peninsula_tension$: [?CHI_korea_peninsula_tension]"
 CHI_legitimacy_concentrated_desc: "El Comité Permanente del Politburó ya no necesita cuórum: el círculo del secretario general se ha fusionado con la red de poder. La Comisión Central de Inspección Disciplinaria es una mera cortesía ahora."
 CHI_Lips_and_Teeth: "Labios y dientes"
 CHI_Lips_and_Teeth_desc: "La descripción histórica de las relaciones sino-norcoreanas «tan cercanas como los labios y los dientes» ha guiado la política china desde la guerra de Corea. Formalizar esta doctrina compromete a China con la supervivencia del régimen de Kim, profundizando los lazos con Pionyang a expensas de una reconciliación coreana más amplia."
 CHI_mass_line_campaign: "Campaña de la línea de masas"
 CHI_mass_line_campaign_desc: "Se envían funcionarios a las comunidades rurales con la obligación de comer con los agricultores y presentar informes sobre las condiciones locales. Se retiran los artículos de lujo de las oficinas gubernamentales y se condena públicamente el gasto público extravagante. La campaña reconfigura el comportamiento oficial visible y restringe el consumo informal que había desviado recursos estatales hacia canales privados."
 CHI_Mount_Paektu_Understanding: "Entendimiento del monte Paektu"
 CHI_Mount_Paektu_Understanding_desc: "Un entendimiento bilateral secreto, concluido a la sombra del monte Paektu —el mitificado lugar de nacimiento de la dinastía Kim—, formaliza las consultas de seguridad chinas con el mando militar norcoreano."
 CHI_nc_inf_cplac_value: "$CHI_nc_current_influence_tt$ [?CHI_ic_inf_cplac|Y0]"
 CHI_nc_inf_intl_value: "$CHI_nc_current_influence_tt$ [?CHI_ic_inf_intl|Y0]"
 CHI_nc_inf_nsc_value: "$CHI_nc_current_influence_tt$ [?CHI_ic_inf_nsc|Y0]"
