 MER_request_mercosur_associate_membership: "메르코수르 준회원 지위 청원"
 MER_request_mercosur_associate_membership_desc: "메르코수르에 준회원 지위를 위한 공식 청원서를 제출합니다. 신청이 중단 없이 진행되면 심사 기간이 끝난 뒤 블록의 외곽에 편입되어 더 긴밀한 지역 조율의 문이 열립니다."
 MER_request_mercosur_full_membership: "메르코수르 정회원 지위 청원"
 MER_request_mercosur_full_membership_desc: "메르코수르에 정회원으로 가입하기 위한 공식 청원서를 제출합니다. 절차가 끝까지 진행되면 심사 기간이 끝난 뒤 우리의 가입이 공식화되어 블록 안으로 완전히 들어가게 됩니다."
 MER_request_unasul_membership: "우나수르 가입 청원"
 MER_request_unasul_membership_desc: "우나수르 가입을 위한 공식 신청서를 제출합니다. 청원이 끝까지 진행되면 별도의 양자 초청을 기다리지 않고 심사 기간이 끝난 뒤 남아메리카 체제에 들어가게 됩니다."
 leave_UNASUL: "우나수르 공동 방위 체제 탈퇴"
 leave_UNASUL_desc: "우나수르 공동 방위 체제를 중심으로 구축된 군사 동맹에서 탈퇴하고, 공동 방위 구조에 대한 우리의 참여를 종료합니다."
 UNASUL_leave_tt: "우리는 우나수르 공동 방위 체제의 군사 동맹에서 탈퇴합니다."
 MER_full_membership_acceptance_hint_desc: "\n\n§Y수락 확률은 해당 국가의 우리에 대한 관계, 우리의 영향력, 그리고 메르코수르 트리의 진행도에 따라 결정됩니다!§!"
 MER_full_membership_invite_process_desc: "\n\n§Y해당 국가가 수락하면 즉시 정회원국으로 가입하거나 3단계 가입 패키지를 요청할 수 있습니다. 세 가지 가입 결정을 모두 완료하면 투자 경로를 통해 회원 자격이 공식화됩니다.§!"
 MER_mercosur_associate_invite_accept_tt: "초청받은 국가가 §Y메르코수르 준회원국§!이 됩니다. 현재의 모든 §Y메르코수르 회원국§!은 §Y월간 생산성 성장§! §G+1.00%§!와 §Y해외 영향력 배수§! §G+1.00%§!를 얻으며, 양측에 알림이 전달됩니다."
 MER_mercosur_associate_invite_reject_tt: "초청받은 국가가 제안을 거절하며 §Y180일§! 동안 다시 접촉할 수 없고, 거절이 전달되면 우리는 §Y정치력§! §R15§!를 잃습니다."
 MER_mercosur_full_invite_accept_tt: "초청받은 국가가 제안을 수락합니다. 이후 해당 국가는 §Y즉시 정회원 가입§!과 §Y투자 기반 3단계 가입 경로§! 중에서 선택하며, 양측에 수락 알림이 전달됩니다."
 MER_mercosur_full_invite_reject_tt: "초청받은 국가가 제안을 거절하며 §Y365일§! 동안 다시 접촉할 수 없고, 거절이 전달되면 우리는 §Y정치력§! §R25§!를 잃습니다."
 MER_unasul_invite_accept_tt: "초청받은 국가가 §Y우나수르§!에 가입합니다. 모든 회원국의 §Y우나수르 회원국§! 동적 변동치가 갱신되어 §Y정치력 획득§! §G+1.00%§!와 §Y안정도§! §G+1.00%§!가 증가하며, 지역 알림 사건이 전달됩니다."
 MER_unasul_invite_reject_tt: "초청받은 국가가 제안을 거절하며 §Y365일§! 동안 다시 접촉할 수 없고, 거절이 전달되면 우리는 §Y정치력§! §R15§!를 잃습니다."
 MER_full_membership_step_one_desc: "\n\n§Y이는 3단계 중 1단계 가입 절차입니다. 세 가지 가입 결정을 모두 완료하면 정회원 자격이 공식화됩니다.§!"
 MER_full_membership_step_two_desc: "\n\n§Y이는 3단계 중 2단계 가입 절차입니다. 세 가지 가입 결정을 모두 완료하면 정회원 자격이 공식화됩니다.§!"
 MER_full_membership_step_three_desc: "\n\n§Y이는 마지막 가입 절차입니다. 세 가지 가입 결정이 모두 완료되면 정회원 자격이 공식화됩니다.§!"
 MER_CHL_tariff_alignment: "칠레 관세 조정"
 MER_CHL_tariff_alignment_desc: "칠레를 블록의 관세 체제에 더 가깝게 맞추는 데 필요한 관세 검토와 행정 조율 비용을 지원합니다.$MER_full_membership_step_one_desc$"
 MER_CHL_customs_system_modernization: "칠레 관세 제도 현대화"
 MER_CHL_customs_system_modernization_desc: "메르코수르 정회원 가입을 위해 칠레의 관세 행정을 현대화하는 데 필요한 자금과 기술 지원을 제공합니다.$MER_full_membership_step_two_desc$"
 MER_CHL_common_standards: "칠레의 공통 표준 도입 지원"
 MER_CHL_common_standards_desc: "칠레가 메르코수르 공통 표준을 도입하는 데 필요한 마지막 규제 및 기술 작업을 지원합니다.$MER_full_membership_step_three_desc$"
 MER_COL_tariff_alignment: "콜롬비아 관세 조정"
 MER_COL_tariff_alignment_desc: "콜롬비아를 블록의 관세 체제에 더 가깝게 맞추는 데 필요한 관세 검토와 행정 조율 비용을 지원합니다.$MER_full_membership_step_one_desc$"
 MER_COL_customs_system_modernization: "콜롬비아 관세 제도 현대화"
 MER_COL_customs_system_modernization_desc: "메르코수르 정회원 가입을 위해 콜롬비아의 관세 행정을 현대화하는 데 필요한 자금과 기술 지원을 제공합니다.$MER_full_membership_step_two_desc$"
 MER_COL_common_standards: "콜롬비아의 공통 표준 도입 지원"
 MER_COL_common_standards_desc: "콜롬비아가 메르코수르 공통 표준을 도입하는 데 필요한 마지막 규제 및 기술 작업을 지원합니다.$MER_full_membership_step_three_desc$"
 MER_VEN_tariff_alignment: "베네수엘라 관세 조정"
 MER_VEN_tariff_alignment_desc: "베네수엘라를 블록의 관세 체제에 더 가깝게 맞추는 데 필요한 관세 검토와 행정 조율 비용을 지원합니다.$MER_full_membership_step_one_desc$"
 MER_VEN_customs_system_modernization: "베네수엘라 관세 제도 현대화"
 MER_VEN_customs_system_modernization_desc: "메르코수르 정회원 가입을 위해 베네수엘라의 관세 행정을 현대화하는 데 필요한 자금과 기술 지원을 제공합니다.$MER_full_membership_step_two_desc$"
 MER_VEN_common_standards: "베네수엘라의 공통 표준 도입 지원"
 MER_VEN_common_standards_desc: "베네수엘라가 메르코수르 공통 표준을 도입하는 데 필요한 마지막 규제 및 기술 작업을 지원합니다.$MER_full_membership_step_three_desc$"
 MER_PRU_logistics_corridor: "페루 물류 회랑 개발"
 MER_PRU_logistics_corridor_desc: "페루가 메르코수르와 더 깊이 통합될 수 있도록 페루 수도의 물류 회랑 1단계 사업에 자금을 지원합니다.$MER_full_membership_step_one_desc$"
 MER_PRU_cross_border_transport: "페루와의 국경 간 수송 개선"
 MER_PRU_cross_border_transport_desc: "페루와의 육상 수송 연결을 확대하고 가입에 필요한 인프라를 강화합니다.$MER_full_membership_step_two_desc$"
 MER_PRU_port_connectivity: "페루 항만 연결성 강화"
 MER_PRU_port_connectivity_desc: "더 통합된 지역 시장을 뒷받침하기 위해 페루 수도의 디지털 및 물류 연결성에 투자합니다.$MER_full_membership_step_three_desc$"
 MER_BOL_logistics_corridor: "볼리비아 물류 회랑 개발"
 MER_BOL_logistics_corridor_desc: "볼리비아가 메르코수르와 더 깊이 통합될 수 있도록 볼리비아 수도의 물류 회랑 1단계 사업에 자금을 지원합니다.$MER_full_membership_step_one_desc$"
 MER_BOL_overland_transport: "볼리비아 육상 수송망 확장"
 MER_BOL_overland_transport_desc: "가입의 성과가 눈에 보이도록 볼리비아 수도의 새로운 육상 수송 개선 사업을 후원합니다.$MER_full_membership_step_two_desc$"
 MER_BOL_border_connectivity: "볼리비아 국경 연결성 개선"
 MER_BOL_border_connectivity_desc: "가입 패키지의 일부로 볼리비아의 디지털 및 물류 국경 연결성에 투자합니다.$MER_full_membership_step_three_desc$"
 MER_PAN_logistics_corridor: "파나마 물류 회랑 개발"
 MER_PAN_logistics_corridor_desc: "가입이 즉각적인 수송상의 이익을 낳도록 파나마 수도의 물류 회랑 기반 공사에 자금을 지원합니다.$MER_full_membership_step_one_desc$"
 MER_PAN_port_transport: "파나마 항만 수송 강화"
 MER_PAN_port_transport_desc: "메르코수르 시장 간 재화 이동을 개선하기 위해 파나마의 항만 연계 수송 개선을 지원합니다.$MER_full_membership_step_two_desc$"
 MER_PAN_trade_connectivity: "파나마 무역 연결성 개선"
 MER_PAN_trade_connectivity_desc: "가입 패키지의 마지막 단계로 파나마의 상업 및 디지털 연결성에 투자합니다.$MER_full_membership_step_three_desc$"
 MER_ECU_development_funds: "에콰도르 개발 기금 출연"
 MER_ECU_development_funds_desc: "정회원 가입의 경제적 가치를 보여 주기 위해 에콰도르에 국고 지원 개발 패키지를 집행합니다.$MER_full_membership_step_one_desc$"
 MER_ECU_civilian_industry: "에콰도르 민간 산업 투자"
 MER_ECU_civilian_industry_desc: "정회원 가입 과정의 일부로 에콰도르 수도의 새로운 민간 투자 사업을 후원합니다.$MER_full_membership_step_two_desc$"
 MER_ECU_infrastructure_development: "에콰도르 인프라 개발 지원"
 MER_ECU_infrastructure_development_desc: "가입 준비 태세를 강화하기 위해 에콰도르 수도의 표적 인프라 개선을 지원합니다.$MER_full_membership_step_three_desc$"
 MER_GUY_development_funds: "가이아나 개발 기금 출연"
 MER_GUY_development_funds_desc: "정회원 가입의 경제적 가치를 보여 주기 위해 가이아나에 국고 지원 개발 패키지를 집행합니다.$MER_full_membership_step_one_desc$"
 MER_GUY_civilian_industry: "가이아나 민간 산업 투자"
 MER_GUY_civilian_industry_desc: "정회원 가입 과정의 일부로 가이아나 수도의 새로운 민간 투자 사업을 후원합니다.$MER_full_membership_step_two_desc$"
 MER_GUY_infrastructure_development: "가이아나 인프라 개발 지원"
 MER_GUY_infrastructure_development_desc: "가입 준비 태세를 강화하기 위해 가이아나 수도의 표적 인프라 개선을 지원합니다.$MER_full_membership_step_three_desc$"
 MER_SUR_development_funds: "수리남 개발 기금 출연"
 MER_SUR_development_funds_desc: "정회원 가입의 경제적 가치를 보여 주기 위해 수리남에 국고 지원 개발 패키지를 집행합니다.$MER_full_membership_step_one_desc$"
 MER_SUR_civilian_industry: "수리남 민간 산업 투자"
 MER_SUR_civilian_industry_desc: "정회원 가입 과정의 일부로 수리남 수도의 새로운 민간 투자 사업을 후원합니다.$MER_full_membership_step_two_desc$"
 MER_SUR_commercial_infrastructure: "수리남 상업 인프라 개발"
 MER_SUR_commercial_infrastructure_desc: "가입이 눈에 보이는 경제적 이익을 낳도록 수리남 수도의 상업 인프라를 확충합니다.$MER_full_membership_step_three_desc$"
 MER_MEX_industrial_investment_agreement: "멕시코와의 산업 투자 협정"
 MER_MEX_industrial_investment_agreement_desc: "수도를 중심으로 한 대규모 투자 협정을 통해 멕시코 가입 패키지의 산업 축에 자금을 지원합니다.$MER_full_membership_step_one_desc$"
 MER_MEX_commercial_investment_framework: "멕시코와의 상업 투자 체제"
 MER_MEX_commercial_investment_framework_desc: "멕시코와 더 폭넓은 상업 투자 체제를 수립하여 정회원 가입을 위한 제도적, 경제적 기반을 강화합니다.$MER_full_membership_step_two_desc$"
 MER_MEX_financial_cooperation_package: "멕시코 금융 협력 패키지"
 MER_MEX_financial_cooperation_package_desc: "가입이 완료되기 전에 상업 및 디지털 투자를 결합한 멕시코 대상 마지막 금융 협력 패키지를 전달합니다.$MER_full_membership_step_three_desc$"
 MER_launch_corridor_investment_round: "메르코수르 회랑 투자 회차 개시"
 MER_launch_corridor_investment_round_desc: "더 강한 블록은 서류상으로만 존재할 수 없습니다. 국고 지원 회랑 자금의 새 회차를 집행하면 메르코수르 현 정회원국 전역의 인프라와 네트워크 통합을 가속하여 블록의 물리적 골격을 개선할 수 있습니다."
 MER_release_development_fund_round: "메르코수르 개발 기금 회차 집행"
 MER_release_development_fund_round_desc: "통합의 약속은 눈에 보이는 투자가 뒷받침할 때 더 설득력이 있습니다. 메르코수르 개발 기금에서 새 회차를 집행하면 블록 전역의 민간 건설과 사무 확장을 가속하여 정회원국의 경제적 기반을 강화할 수 있습니다."
