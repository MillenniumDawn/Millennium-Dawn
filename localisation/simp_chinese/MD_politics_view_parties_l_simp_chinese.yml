 ISR.conservatism: "£ISR_conservatism (利库德集团) - 国家自由运动"
 ISR.conservatism_desc: "（民族保守主义） - 利库德- 民族自由运动\n\n利库德集团由梅纳赫姆·贝京和阿里埃勒·沙龙于1973年创立，最初由自由党、自由党和一些规模较小的右翼政党联盟组成，并于1988年合并为一个政党。该党在1977年的选举中获胜，结束了工党长达三十年的统治，并使其成为以色列右翼的领军政党。利库德集团植根于修正主义犹太复国主义，其政治主张融合了民族保守主义、经济自由主义以及在安全和领土问题上的强硬立场。本雅明·内塔尼亚胡曾于1993年至1999年以及2005年再次领导该党，并在2022年赢得32个席位，组建了他的第六届政府。"
 ISR.conservatism_icon: "£ISR_conservatism"
 ISR.liberalism: "£ISR_liberalism_alt (Merkaz) - 中间党"
 ISR.liberalism_desc: "（中间主义） - 中间党\n\n中间党由前国防部长伊扎克·莫迪凯于1999年2月23日创立，其成员包括来自利库德集团的丹·梅里多尔和戴维·马根、工党叛逃者以及前总参谋长阿姆农·利普金-沙哈克。该党旨在为右翼的本雅明·内塔尼亚胡和左翼的埃胡德·巴拉克领导的工党提供一个温和的选择，在1999年的选举中赢得了6个席位，并加入了巴拉克的联合政府。然而，该党仅维持了一届议会任期便分崩离析，并于2003年解散。"
 ISR.liberalism_icon: "£ISR_liberalism_alt"
 ISR.socialism: "£ISR_socialism (HaAvoda) - 以色列工党"
 ISR.socialism_desc: "（社会民主主义） - 以色列工党\n\n工党于1968年1月23日由以色列工党、劳工团结党和以色列工人名单党合并而成，作为工党犹太复国主义运动的继承者，执政以色列直至1977年。工党是一个与以色列总工会紧密联系的社会民主党，支持福利国家和奥斯陆和平进程。埃胡德·巴拉克于1999年带领工党进入政府，工党最后一次执政是在2001年。此后，工党经历了一系列领导人更迭，最终在2020年跌至仅剩3个席位的低谷。2024年7月12日，工党与梅雷茨党合并，组成了民主党。"
 ISR.socialism_icon: "£ISR_socialism"
 ISR.Western_Autocracy: "£ISR_Western_Autocracy (HaBayit HaYehudi) - 犹太人家园"
 ISR.Western_Autocracy_desc: "（宗教犹太复国主义）- 犹太人家园\n\n犹太家园党成立于2008年11月18日，是国家宗教党的继承者，吸收了国家联盟的莫莱德特派和特库马派。该党是一个正统犹太教、宗教犹太复国主义和支持定居点建设的政党，反对领土让步，捍卫传统家庭价值观，并寻求更多资金用于托拉研究。在2012年至2018年担任主席的纳夫塔利·贝内特的领导下，该党在2013年达到鼎盛时期，拥有12个席位，并掌控了教育和司法部长职位。2019年和2020年，该党作为亚米纳联盟的成员参选，2020年7月在拉菲·佩雷茨和哈吉特·摩西的领导下脱离该联盟，并于2023年8月20日并入宗教犹太复国主义党。"
 ISR.Western_Autocracy_icon: "£ISR_Western_Autocracy"
 ISR.Conservative: "£ISR_Nat_Populism (Shas) - 塞法迪守护者"
 ISR.Conservative_desc: "（哈雷迪宗教保守主义）- 塞法迪守护者\n\n塞法迪守护者成立于1984年，由奥瓦迪亚·约瑟夫拉比担任精神领袖，是塞法迪犹太人和米兹拉希犹太人从阿什肯纳兹犹太人主导的阿古达特·以色列联盟中分裂出来的政党。该党代表哈雷迪犹太人和传统米兹拉希犹太人的选民，运营着庞大的宗教学校和福利服务网络，并致力于恢复塞法迪犹太人的地位。塞法迪守护者在1999年达到17个席位的峰值，并在两大阵营的大多数政府中都占有一席之地，通常担任内政部长。阿里耶·德里自2013年起担任该党领导人，此前他因1999年受贿罪被判刑，结束了其任期。"
 ISR.Conservative_icon: "£ISR_Nat_Populism"
 ISR.Autocracy: "£ISR_Autocracy (Ta'al) - 阿拉伯复兴运动"
 ISR.Autocracy_desc: "（阿拉伯民族主义）- 阿拉伯复兴运动\n\n阿拉伯复兴运动由艾哈迈德·蒂比于1996年创立，蒂比是一位医生，也是亚西尔·阿拉法特的前顾问，他一直领导着该党。作为一个世俗的阿拉伯民族主义政党，阿拉伯复兴运动寻求在1967年边界的基础上建立两国方案，并主张阿拉伯公民享有平等权利，其立场被认为比民族民主联盟更为温和。阿拉伯复兴运动从未单独参选，曾于2003年、2019年和2022年与和平与平等民主阵线联合参选，2006年至2013年与联合阿拉伯名单联合参选，2015年至2021年则以联合名单成员的身份参选。"
 ISR.Autocracy_icon: "£ISR_Autocracy"
 ISR.anarchist_communism: "£ISR_anarchist_communism (Balad) - 民族民主联盟"
 ISR.anarchist_communism_desc: "（巴勒斯坦民族主义）- 民族民主联盟\n\n民族民主联盟由阿兹米·比沙拉于1995年创立，是一个由以色列阿拉伯公民组成的世俗巴勒斯坦民族主义政党。该党拒绝承认以色列是犹太国家，并呼吁建立一个所有公民都享有完全民族权利的国家，阿拉伯少数族裔也享有完全的民族权利。比沙拉于2007年4月在国外辞去议员职务，当时他正因涉嫌与真主党有联系而接受调查，此后便再未返回以色列。民族民主联盟在2015年至2021年期间一直作为联合名单党成员参选；2022年，该党在萨米·阿布·谢哈德的领导下单独参选，得票率为2.9%，低于3.25%的门槛。"
 ISR.anarchist_communism_icon: "£ISR_anarchist_communism"
 ISR.Neutral_conservatism: "£ISR_non_aligned_conservative (Yisrael BaAliyah) - 优势以色列党"
 ISR.Neutral_conservatism_desc: "(移民保守主义) - 优势以色列党\n\n优势以色列党由前苏联移民被拒者纳坦·沙兰斯基和尤利·埃德尔斯坦于1996年3月创立，旨在代表来自前苏联的百万移民。该党最初立场中间，但在安全问题上逐渐右倾，同时力主简化移民融入流程、允许同性婚姻以及承认苏联学历。该党在1996年赢得7个席位，1999年赢得6个席位，但随着其选民转向以色列家园党和利库德集团，其席位在2003年锐减至2个，并于2003年3月10日并入利库德集团。"
 ISR.Neutral_conservatism_icon: "£ISR_non_aligned_conservative"
 ISR.oligarchism: "£ISR_oligarchism (Yisrael Beiteinu) - 以色列家园党"
 ISR.oligarchism_desc: "(世俗保守主义) - 以色列家园党\n\n前利库德集团总干事阿维格多·利伯曼于1999年创立了以色列家园党，这是一个秉承泽夫·贾博廷斯基传统的、面向俄语移民的世俗右翼政党。该党主张在安全问题上采取强硬路线，对阿拉伯公民进行忠诚度测试，实行民事婚姻，并强制哈雷迪教徒服兵役。该党在2009年达到鼎盛时期，拥有15个席位，位列第三大党。2013年，该党与利库德集团联合参选。2019年4月大选后，该党利用其5个席位阻止与哈雷迪政党组建任何联盟，迫使以色列重新举行大选。自2022年以来，该党一直保持着6个席位。"
 ISR.oligarchism_icon: "£ISR_oligarchism"
 ISR.neutral_Social: "£ISR_neutral_Social (Meretz) - 活力"
 ISR.neutral_Social_desc: "(社会民主主义) - 梅雷茨党\n\n梅雷茨党成立于1992年，由拉​​茨党、马帕姆党和希努伊党组成，并于1997年合并为一个政党。作为一个左翼犹太复国主义、世俗和社会民主党，梅雷茨党主张两国方案、公民自由、同性恋权利以及政教分离。该党在1992年赢得12个席位，并加入伊扎克·拉宾政府，但席位从2003年的6个下降到2009年的3个。在约西·萨里德、泽哈瓦·加尔-翁、塔玛尔·赞德伯格和尼赞·霍罗维茨等人的领导下，该党在2021年恢复到6个席位，但在2022年跌破当选门槛，并于2024年并入民主党。"
 ISR.neutral_Social_icon: "£ISR_neutral_Social"
 ISR.Neutral_Libertarian: "£ISR_Neutral_Libertarian (Zehut) - 身份"
 ISR.Neutral_Libertarian_desc: "（右翼自由意志主义） - 身份党\n\n莫舍·费格林于2015年离开利库德集团后创立了身份党，该党将自由市场自由主义和个人自由与宗教犹太复国主义以及吞并西岸的主张相结合。其大麻合法化的承诺赢得了年轻世俗选民的异常支持。身份党在2019年4月的选举中获得了2.7%的选票，略低于3.25%的门槛，并于同年9月退出选举，以换取与本雅明·内塔尼亚胡的政策协议。费格林于2021年重返利库德集团，并于2024年1月重振泽身份党。"
 ISR.Neutral_Libertarian_icon: "£ISR_Neutral_Libertarian"
 ISR.Neutral_Autocracy: "£ISR_Neutral_Autocracy (UTJ) - 联合妥拉犹太教"
 ISR.Neutral_Autocracy_desc: "（哈雷迪非犹太复国主义）- 联合妥拉犹太教\n\n联合托拉犹太教联盟是由哈西德派的阿古达特·以色列和立陶宛的德格尔·哈托拉于1992年联合成立的，旨在最大限度地提高阿什肯纳兹哈雷迪犹太教徒在以色列议会的代表权。与塞法迪守护者或宗教犹太复国主义政党不同，该联盟是非犹太复国主义的，其运作遵循一个托拉学者委员会的指导，并致力于捍卫犹太经学院的经费、安息日的遵守以及免服兵役的权利。该联盟在2019年4月达到8个席位的峰值，自2022年以来一直保持7个席位，通常担任议会财政委员会主席。"
 ISR.Neutral_Autocracy_icon: "£ISR_Neutral_Autocracy"
 ISR.Neutral_Communism: "£ISR_Neutral_Communism (Da'am) - 工人党"
 ISR.Neutral_Communism_desc: "（革命社会主义）- 争取民主行动组织工人党\n\n争取民主行动组织工人党于1995年在海法成立，是一个革命社会主义的犹太-阿拉伯政党，其阶级认同高于民族或种族认同。该党通过其附属工会组织移民和阿拉伯工人，呼吁关键产业国有化和性别平等，并自2018年起支持建立单一民主国家。该党于2015年由阿斯玛·阿格巴里耶-扎哈尔卡领导，当时她是以色列唯一一位由阿拉伯女性领导的政党。然而，争取民主行动组织工人党从未获得超过0.1%的选票，也从未赢得任何议席。"
 ISR.Neutral_Communism_icon: "£ISR_Neutral_Communism"
 ISR.Neutral_Muslim_Brotherhood: "£ISR_Neutral_Muslim_Brotherhood (Ra'am) - 联合阿拉伯名单"
 ISR.Neutral_Muslim_Brotherhood_desc: "（温和伊斯兰主义）- 联合阿拉伯名单\n\n联合阿拉伯名单成立于1996年，是以色列伊斯兰运动南部支部的政治分支。南部支部选择参加议会选举，而北部支部则抵制选举。该党宗教立场保守，其最主要的支持来自内盖夫贝都因人。在曼苏尔·阿巴斯的领导下，联合阿拉伯名单与其他阿拉伯政党决裂，转而关注阿拉伯城镇的犯罪、住房和基础设施建设。2021年，该党赢得4个席位，成为首个加入执政联盟的独立阿拉伯政党。2022年，该党赢得5个席位，重返反对党行列。"
 ISR.Neutral_Muslim_Brotherhood_icon: "£ISR_Neutral_Muslim_Brotherhood"
 ISR.Neutral_green: "£ISR_Neutral_Green (HaYerukim) - 绿色运动"
 ISR.Neutral_green_desc: "(环保主义) - 绿色运动\n\n绿色运动成立于1997年，由特拉维夫市议员皮尔·维斯纳领导至2011年，其政纲以环境保护和提升生活质量为核心。该党从未进入过以色列议会；其最佳成绩是2006年的1.52%，当时它是未能达到2%门槛的最大候选名单。绿色运动的优势在于市政选举：在2008年的地方选举中，该党在22个市镇赢得了超过50个议席，其中包括海法的4个席位和特拉维夫的3个席位。"
 ISR.Neutral_green_icon: "£ISR_Neutral_Green"
 ISR.Nat_Autocracy: "£ISR_Nat_Autocracy (Tzahal) - 以色列国防军"
 ISR.Nat_Autocracy_desc: "(军政府) - 以色列国防军\n\n以色列国防军并非政党，而是戴维·本-古里安于1948年5月26日建立的国家军队，此处指军官团作为政治实体。以色列国防军由陆军、空军和海军组成，由总参谋长领导，总参谋长向国防部长负责。该军种几乎完全由犹太人、德鲁兹人和切尔克斯人公民组成。从伊扎克·拉宾和埃胡德·巴拉克到沙乌尔·莫法兹、本尼·甘茨和加迪·艾森科特，退役总参谋长频繁投身政界，而军队本身从未谋求过政权。"
 ISR.Nat_Autocracy_icon: "£ISR_Nat_Autocracy"
 ISR.Nat_Fascism: "£ISR_Nat_Fascism (Otzma Yehudit) - 犹太之力"
 ISR.Nat_Fascism_desc: "(卡汉主义) - 犹太之力\n\n犹太之力由迈克尔·本-阿里和阿里耶·埃尔达德于2012年11月13日创立，最初名为奥兹玛·莱伊斯拉埃尔，是已被取缔的梅厄·卡哈内的卡赫运动的意识形态继承者。该党主张以色列对从约旦河到地中海的领土拥有主权，驱逐其认为不忠的阿拉伯人，并对恐怖分子处以死刑，被广泛认为是一个犹太至上主义政党。该党在多次未能达到议会门槛后，于2021年在伊塔马尔·本-格维尔的领导下进入以色列议会，并在2022年通过宗教犹太复国主义名单赢得6个席位，本-格维尔也因此出任国家安全部长。"
 ISR.Nat_Fascism_icon: "£ISR_Nat_Fascism"
 ISR.Nat_Populism: "£ISR_liberalism (Tkuma) - 全国联盟 - 复兴"
 ISR.Nat_Populism_desc: "(宗教犹太复国主义) - 全国联盟 - 复兴\n\n复兴党由一些因怀伊河协议而退出国家宗教党的定居者运动议员于1998年创立。自1999年起，该党与祖国党和自由党组成国家联盟参选。作为极右翼宗教犹太复国主义者，复兴党反对任何形式的巴勒斯坦建国，并要求以色列对整个西岸拥有主权。该联盟在2003年由阿维格多·利伯曼和本尼·埃隆领导下赢得7个席位，2006年与国家宗教党联合参选，并在2009年由雅科夫·卡茨领导下赢得4个席位。2013年，复兴党在乌里·阿里埃勒的领导下加入犹太家园党的候选人名单，并于2021年1月7日更名为宗教犹太复国主义党。"
 ISR.Nat_Populism_icon: "£ISR_liberalism"
 ITA.democratic_senate: "£ITA_roman_senate 技术官僚参议院"
 ITA.democratic_senate_desc: "寡头主义和特权的日子已经一去不复返了，现代时代要求我们倾听我们中间甚至不那么富有的人的需求。但不能忽视旧代议制民主的失败，人们可以投票给政党，但他们的作用只是选择由哪个技术官僚组成政府。"
 ITA.Western_Autocracy: "£generic_Western_Autocracy_small 技术官僚"
 ITA.Western_Autocracy_desc: "技术官僚政府是在政治动荡时期建立的，当时国家正面临前所未有的危机，政治家无法应对。"
 ITA.Western_Autocracy_icon: "£generic_Western_Autocracy_small"
 ITA.conservatism: "£generic_conservatism_small Forward Italy"
 ITA.conservatism_desc: "意大利力量党是一个右翼保守政党，由戴尔乌特利于1994年在‘克里斯蒂娜民主’的灰烬上成立，当时‘净手运动’对一起重大腐败丑闻进行了调查。与该党最相关的事件是西尔维奥·贝卢斯科尼的‘下野’，他以房地产资产和媒体网络而闻名。贝卢斯科尼已经成为迄今为止最突出的成员，这导致该党的选举命运直接与贝卢斯科尼的个人魅力和司法制度的变化有关。该党宣称的目标是降低普通民众和企业的税收，并保证公民的稳定和法治。"
 ITA.conservatism_icon: "£ITA_western_conservative"
 ITA.liberalism: "£ITA_western_liberal 自由联合会"
 ITA.liberalism_desc: "自由党联合会重新联合了来自意大利政治中间立场的各种社会自由党派。大致受到意大利自由党理想的启发，该党于1919年由乔瓦尼·乔利蒂创立。尽管在欧洲大部分地区被认为是成立的，但自从几十年前路易吉·埃诺迪去世以来，社会自由主义在意大利的选举命运非常有限，不得不与意识形态上非常灵活的传统政党打交道，而且民众普遍比其他国家更警惕资本主义发达国家。他们坚信自由市场，同时倡导福利和社会权利。"
 ITA.liberalism_icon: "£ITA_western_liberal"
 ITA.piu_europa_loc_key: "£ITA_Piu_Europa +欧罗巴"
 ITA.piu_europa_loc_key_desc: ""
