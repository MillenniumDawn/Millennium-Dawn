 pak_raj_border_no_operation_tt: "В настоящее время не ведется никаких операций, не подается никаких претензий и не возникает никаких кризисных ситуаций, связанных с [RAJ.GetAdjective]-[PAK.GetAdjective]."
 pak_raj_border_no_claim_cooldown_tt: "В последнее время не наблюдается никаких признаков спада активности или кризиса."
 pak_raj_border_pair_valid_tt: "[RAJ.GetNameWithFlag] и [PAK.GetNameWithFlag] независимы, живут в мире, не капитулируют и не принадлежат к одной фракции."
 pak_raj_border_attack_thresholds_tt: "Требуется §Y60§! $pak_raj_border_readiness$ ([?THIS.pak_raj_border_readiness|Y0]) и §Y80§! $pak_raj_border_tension$ ([?global.pak_raj_border_tension|Y0])"
