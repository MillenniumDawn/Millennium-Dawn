 usa.2.t: "Attentat contre l'USS Cole"
 usa.2.d: "Le destroyer à missiles guidés USS Cole (DDG-67) a été attaqué par deux terroristes d'Al-Qaïda le [GetDateText]. Amarré au port au Yémen, le Cole a été touché par une explosion sur son flanc gauche, tuant 17 marins et en blessant 39. Au fil des années, des juges américains ont établi que des éléments islamiques au sein du gouvernement soudanais étaient au moins impliqués dans l'attaque."
 usa.2.o1: "Ils nous manqueront."
 usa.2.o2: "Exiger que le Soudan paie pour les dommages !"
 usa.2000.t: "L'Amérique exige une compensation"
 usa.2000.d: "The United States demands we pay them back from the recent USS Cole Bombing. They cite our country's Muslim Population.\n\n How should we proceed?"
 usa.2000.o1: "Payer les Américains"
 usa.2000.o2: "Inshallah ! Allah a voulu que cela arrive !"
 usa.2001.t: "[From.GetName] paie des dommages"
 usa.2001.d: "[From.GetName] verse 250 millions de dollars aux États-Unis pour réparer et rééquiper l'USS Cole après l'attentat tragique. L'USS Cole pourra à nouveau naviguer.\n"
 usa.2001.o1: "Merveilleux !"
 usa.2002.t: "[From.GetName] refuse de payer les dommages"
 usa.2002.d: "[From.GetName] affirme n'avoir rien à voir avec l'attentat contre l'USS Cole. Ils ont répété à plusieurs reprises qu'ils ne sont pas responsables des dommages causés à l'USS Cole. [From.GetName] commence à nous accuser de vouloir les persécuter. Pfft, pourquoi voudrions-nous nous en prendre à eux ?\n"
 usa.2002.o1: "Décevant, j'avais besoin d'une nouvelle voiture."
 usa.3.t: "Incident dans le sud de l'Illinois"
 usa.3.d: "In the early morning hours of January 5th, 2000, several individuals across the towns of Highland, Dupo, Lebanon, Shiloh, Summerfield, Millstadt and O'Fallon, all in Illinois, reported the sighting of an unidentified flying object of triangular shape and dark color, later called the 'St. Clair Triangle'. These reports were also confirmed even by five on-duty police officers across the region.\n\nThe aircraft, which made no sound and was reportedly massive in size, operated at treetop level altitude and was spotted several times between 4:00 and 5:00 in the morning.\n\nThe incident has once more fueled conspiracy theories about secret U.S. Air Force projects or, depending on the conspiracy theorist, an alien invasion or alien control of several world leaders, including the U.S. President [USA.GetLeader]."
 usa.3.o1: "Effrayant."
 usa.4.t: "Microsoft acquiert Visio"
 usa.4.d: "Le géant américain de la technologie informatique Microsoft n'a cessé de croître depuis sa fondation en 1975. Particulièrement dominant sur le marché des ordinateurs personnels avec ses systèmes d'exploitation Windows NT 4.0 et Windows 98, Microsoft cherche toujours à élargir son influence et le nombre de programmes qu'il contrôle, sans doute pour qu'ils ne soient plus disponibles sur des systèmes non-Microsoft.\n\nL'une de ces cibles d'expansion est la société Visio Corporation, basée à Seattle, dont l'acquisition par Microsoft a été annoncée en septembre 1999. Visio, qui deviendra la division Visio au sein du groupe de productivité professionnelle de Microsoft, est particulièrement reconnue pour ses programmes de création de graphiques, de diagrammes et d'autres visualisations de données pour les administrateurs d'entreprise, les experts économiques et les concepteurs de produits. Microsoft, qui débourse 1,5 milliard de dollars pour finaliser cette acquisition le 7 janvier 2000, espère renforcer sa position auprès des professionnels grâce à cette annexion."
 usa.4.o1: "Des entreprises plus fortes signifient plus de revenus imposables !"
 usa.4.o2: "C'est une prise de contrôle hostile ! Empêchez cela !"
 usa.5.t: "America Online fusionne avec Time Warner"
 usa.5.d: "Through an exchange of various stocks as well as financial investments and purchases worth an overall 162 billion U.S. Dollars, the company America Online (or AOL for short) has integrated TimeWarner Incorporated into the AOL conglomerate in a process that was finished on January 10th, 2000.\n\nThis merger of the two mega-corporations is the financially largest corporate merger in not only American history, but in human history. The fusion, which is to be made official through a formal merge of both companies into one (AOL TimeWarner Inc.) on February 11th, potentially marks a new age of the American economy."
 usa.5.o1: "Excellente nouvelle !"
 usa.5.o2: "C'est hostile aux travailleurs. Arrêtez cela !"
 usa.6.t: "Blizzard nord-américain de [GetDateText]"
 usa.6.d: "À partir du [GetDateText], une tempête de neige qui s'est formée au-dessus de l'Atlantique ouest a touché terre dans l'État américain de Virginie, causant des dégâts infrastructurels et logistiques dans la région de Richmond, y compris des milliers de pannes de courant. Depuis la Virginie, la tempête s'est déplacée vers le nord, frappant la Pennsylvanie et le New Jersey, avant de passer sur la Nouvelle-Angleterre et de se dissiper au-dessus de l'est du Canada le 30 janvier."
 usa.6.o1: "Eh bien, tant pis."
 usa.6.o2: "Envoyer autant d'aide que possible."
 usa.7.t: "Affaire Elian Gonzalez"
 usa.7.d: "Aujourd'hui, la procureure générale des États-Unis, Janet Reno, devra prendre une décision concernant le sort du jeune garçon cubain Elian Gonzalez.\n\nGonzalez réside actuellement en Floride avec des proches, après avoir survécu à une dangereuse fuite de Cuba vers les États-Unis – une évasion au cours de laquelle sa mère est tragiquement décédée. Cependant, la mère n'a pas seulement fui le communisme, mais aussi son mari, le père de Gonzalez, qui, toujours à Cuba, exige maintenant que le garçon lui soit rendu.\n\nDu point de vue américain comme cubain, il ne fait aucun doute que renvoyer le garçon à son père serait conforme à la loi. Mais il y a ici des implications morales et politiques. Devons-nous condamner un jeune homme à l'oppression communiste ? Devons-nous compromettre le soutien cubain au Parti démocrate dans l'État clé de Floride ?\n\nTout repose maintenant sur le verdict de Reno."
 usa.7.o1: "Renvoyez-le. C'est la juste décision."
 usa.7.o2: "Mieux vaut mort que rouge ! Il reste !"
 usa.7.tt: "Risque que le raid échoue"
 usa.9.t: "Vol 261 d'Alaska Airlines"
 usa.9.d: "Le 31 janvier 2000, le vol 261 d'Alaska Airlines, un McDonnell Douglas MD-83 en route de Puerto Vallarta au Mexique vers Seattle aux États-Unis, s'est écrasé en mer à environ 3 miles au nord de l'île d'Anacapa, au large de la côte californienne.\n\nLa catastrophe, causée par un entretien négligent et inapproprié, a tué les 83 passagers et les 5 membres d'équipage, soit un total de 88 morts. Parmi les victimes figuraient l'auteure Jean Gandesberry, le leader et activiste autochtone de l'Alaska Morris Thompson et l'animatrice de radio Cynthia Oti."
 usa.9.o1: "Une tragédie."
 usa.10.t: "Fin de « Peanuts »"
 usa.10.d: "La mort de la légende de la bande dessinée Charles M. Schulz, le 12 février 2000, a marqué la fin d'une légende et d'une époque. L'artiste né à Minneapolis a dessiné les esquisses de « Peanuts » pendant plus de 50 ans, ainsi que la plupart des scénarios de films et de séries télévisées autour des enfants de Charlie Brown. Avec un total de plus de 17 800 bandes dessinées uniques, « Peanuts » est la série de bande dessinée la plus longue de tous les temps. Le lendemain de la mort de son créateur, la dernière bande originale de Peanuts a été publiée dans les journaux du dimanche.\n\nLa mort de Schulz laisse les fans de bande dessinée et les lecteurs assidus de journaux en deuil à travers le pays. La série ne sera pas continuée, conformément aux souhaits de Schulz – mais avec 17 800 bandes, les journaux auront de quoi republier."
 usa.10.o1: "Repose en paix."
 usa.10.o2: "Il y a de l'argent à gagner !"
 usa.11.t: "Fusillade de Kayla Rolland"
 usa.11.d: "Dans un événement dramatique et traumatique, Kayla Rolland, âgée de 6 ans, élève de l'école élémentaire Buell dans le Michigan, a été mortellement abattue par son camarade de classe de 6 ans, Dedrick Owens, avec un pistolet P-32 appartenant à l'oncle de ce dernier, que le jeune enfant avait trouvé traînant dans la maison de son oncle. Dedrick a dit à Kayla « Je ne t'aime pas » avant de lui tirer dans le bras en présence de leur enseignante et de 22 autres élèves. La balle a perforé une artère vitale, provoquant une hémorragie massive qui a entraîné la mort de la fillette avant 10 h 30. Kayla Rolland est la plus jeune victime d'une fusillade scolaire dans l'histoire américaine."
 usa.11.o1: "Est-ce une ère de violence par arme à feu ?"
 usa.12.t: "Explosion Phillips de 2000"
 usa.12.d: "Vers le [GetDateText], une explosion s'est produite au complexe chimique de Houston de Phillips Petroleum à Pasadena, au Texas.\n\nL'explosion et l'incendie qui ont suivi ont causé un décès et blessé 71 personnes à l'usine chimique, en raison de brûlures ou d'inhalation de fumée toxique.\n\nLa personne décédée est Rodney Gott, superviseur de 45 ans, qui avait déjà survécu à la première catastrophe de Phillips en 1989 et qui, peu après l'explosion, est resté dans l'usine en flammes pour sauver d'autres personnes. Le toit du bâtiment où il se trouvait s'est effondré violemment, écrasant Gott sous les décombres."
 usa.12.o1: "Les accidents arrivent."
 usa.12.o2: "Lancer une enquête complète."
 usa.15.t: "Tornade de Fort Worth"
 usa.15.d: "Dans la soirée du [GetDateText], une puissante tornade, classée F3 sur l'échelle de Fujita, a frappé le centre de Fort Worth, au Texas.\n\nAvec des vents d'environ 135 miles par heure, la tornade a causé 450 millions de dollars de dégâts et a fait 2 morts et 80 blessés en seulement dix minutes de chaos dans la ville."
 usa.15.o1: "Des réparations seront nécessaires."
 usa.15.o2: "Mobilize Disaster Relief"
 usa.16.t: "Programme de soutien militaire pour l'Asie de l'Est"
 usa.16.d: "Les commandants militaires américains ont confirmé que le gouvernement américain lancera prochainement son programme de soutien militaire pour l'Asie de l'Est, dont nous bénéficierons. Nos généraux et officiers recevront de nouveaux conseils doctrinaux et nos troupes bénéficieront d'un nouvel entraînement."
 usa.16.o1: "Nous apprécions l'aide."
 usa.16.o2: "Nous n'avons pas besoin des Américains !"
 usa.17.t: "Montée du gauchisme américain"
 usa.17.d: "La jeunesse aux États-Unis regarde vers l'Union européenne et ses pays avec leurs gouvernements socialistes démocratiques. Elle soutient une version révisée du système américain."
 usa.17.a: "Un nouveau gauchisme ?"
 usa.18.t: "Les partis tiers gagnent du soutien"
 usa.18.d: "Les républicains et les démocrates s'écharpent dans leurs tranchées au Congrès et à la Chambre. Pendant ce temps, les jeunes en particulier cherchent des alternatives pour échapper au système bipartisan. Jusqu'à présent, tous les espoirs ont été vains, mais peut-être cette fois..."
 usa.18.a: "Nouvelles alternatives ?"
 usa.19.t: "Montée du traditionalisme"
 usa.19.desc: "Des factions aux États-Unis ont commencé à embrasser le traditionalisme. Elles promeuvent des idées plus doctrinaires pour un retour à des temps plus simples. Cependant, certains commencent à discuter d'idées d'extrême droite."
 usa.19.a: "Montée de la droite"
 usa.20.t: "Protestation anti-mondialisation !"
 usa.20.d: "Anti-Globalization forces, typically leftist in nature, rallied today in several major cities protesting the IMF, the World Bank, and international capitalism as a whole. Their protesting has also paved the way for several other parties to get involved including nationalists, progressives and the everyday political activist."
 usa.20.o1: "L'establishment sait mieux"
 usa.20.o2: "Les écologistes savent mieux"
 usa.20.o3: "The Nationalists Make a Good Point."
 usa.21.t: "L'establishment est renforcé"
 usa.21.d: "The Status Quo in the United States has kept the country's government moderate and tolerant. It is important that this status quo is maintained and the establishment is reinforced. Many politicians have recently been speaking up about how wonderful the current establishment is. Let's keep it going!"
 usa.21.a: "L'establishment est renforcé"
 usa.22.t: "Elian Gonzalez arrêté par des agents fédéraux"
 usa.22.d: "Elian Gonzalez and his family have made it to the USA. However, in a premeditated raid Elian Gonzalez has been seized by Federal Agents and extradited to Cuba. The choice has been very unpopular with Democrats and some Republicans as well. Vice-President Al Gore has also stated that the decision was a mistake. Although, it has improved diplomatic ties with one of our Southern neighbors. It has yet to be seen if it's the right choice...\n"
 usa.22.o1: "La loi sait mieux que quiconque"
 usa.23.t: "Elian González échappe à la capture"
 usa.23.d: "Elian González et sa famille ont fait les gros titres aujourd'hui avec la nouvelle qu'ils ont échappé à la capture par des agents fédéraux. Les agents fédéraux recherchent actuellement la famille pour tenter de les renvoyer à Cuba. Cependant, ils restent pour l'instant introuvables.\n"
 usa.23.o1: "C'est malheureux"
 usa.32.t: "États-Unis contre Microsoft Corp."
 usa.32.d: "Microsoft, arguably one of America's most important employers and paragons of technological and social progress, has been in the crosshairs of government prosecutors due to its allegedly unfair and monopolistic business practices.\n\nOpened on May 18th, 1998, the court has heard various witnesses, including Microsoft founder Bill Gates, Microsoft vice president Paul Maritz, vice president of Intel Steven McGeady and others.\n\nThe charge against Microsoft is a violation of the 1890 Sherman Antitrust Act through the attempt of becoming a monopoly in the software and hardware computer markets, particularly due to the fact that Microsoft bundled the Microsoft-made web browser \"Internet Explorer\" with its operating systems, thus decisively winning the \"Browser Wars\" between competing web browser operators without a fair fight.\n\nNow, on [GetDateText] the presiding judge Thomas Penfield Jackson, who already laid down the findings of fact that Microsoft had established an illegal monopoly over x86-based personal computer operating systems on November 5th, 1999, is about to hand down his conclusions of law, which will mark the verdict to determine the rest of the court case's proceedings."
 usa.32.o1: "Coupable !"
 usa.32.o2: "Non coupable !"
 usa.33.t: "Microsoft continue de croître"
 usa.33.d: "Suite au verdict de « non-culpabilité » dans l'affaire « États-Unis contre Microsoft Corp. », Microsoft a poursuivi son expansion à travers les États-Unis. Le géant du logiciel continue d'absorber de plus petites entreprises, renforçant encore son contrôle sur l'industrie technologique. Le monopole semble désormais trop grand pour être brisé. Cependant, ils ont créé de nombreux emplois et contribué à l'essor de l'industrie technologique !"
 usa.33.o1: "Eh bien, c'est déjà ça."
 usa.34.t: "Catastrophe de Marana du Corps des Marines"
 usa.34.d: "Le [GetDateText], un avion militaire MV-22 Osprey du Corps des Marines des États-Unis s'est écrasé au-dessus d'un aéroport régional à Marana, en Arizona, tuant les 19 Marines américains à bord.\n\nL'incident a relancé les discussions sur la préparation au combat de l'Osprey et sur le choix des équipements dans le Corps des Marines des États-Unis.\n"
 usa.34.o1: "Semper Fi"
 usa.35.t: "Datapoint dépose une demande de faillite sous le chapitre 11"
 usa.35.d: "Initialement connue sous le nom de Computer Terminal Corporation ou CTC, la société Datapoint Corporation est une entreprise informatique basée à San Antonio, au Texas, fondée en juillet 1968.\n\nLes premiers produits de l'entreprise étaient des terminaux informatiques, mais plus tard, l'activité s'est élargie pour inclure des microprocesseurs, des puces informatiques et enfin le « Datapoint 2200 », considéré par certains historiens des sciences comme le premier ordinateur personnel.\n\nAprès un essor tout au long des années 1970, l'entreprise a commencé à décliner à partir de 1980. Après une prise de contrôle hostile par le raider d'entreprise Asher B. Edelman en 1984, l'entreprise n'a pas pu se remettre durablement des dommages subis, entraînant une mort lente et douloureuse avec des licenciements et de mauvaises années commerciales tout au long de la fin des années 1980 et des années 1990.\n\nEnfin, le [GetDateText], Datapoint a déposé une demande de faillite sous le chapitre 11. L'entreprise sera scindée en trois sociétés successeures qui, espérons-le, s'en sortiront mieux seules."
 usa.35.o1: "La puissance du marché libre"
 usa.35.o2: "Non ! Renflouez-la !"
 usa.36.t: "Le H. L. Hunley"
 usa.36.d: "Le H. L. Hunley, nommé d'après l'ingénieur naval confédéré Horace Lawson Hunley, également connu sous le nom de CSS H. L. Hunley, était un sous-marin confédéré mis en service en juillet 1863. Le Hunley a coulé le sloop de guerre de l'US Navy USS Housatonic, devenant le premier sous-marin de l'histoire humaine à couler avec succès un navire ennemi.\n\nLe Hunley a coulé lors de sa victoire sur l'Housatonic, emportant son officier et ses sept membres d'équipage avec lui.\n\nLe vaisseau était considéré comme perdu depuis près d'un siècle et demi avant d'être localisé en 1995. Le navire a finalement été renfloué le 8 août 2000. Les soldats du Hunley peuvent désormais recevoir une sépulture appropriée."
 usa.36.o1: "A Succesful Operation."
 usa.37.t: "Mac OS X"
 usa.37.d: "Portant le nom de code « Kodiak », une version bêta du nouveau système d'exploitation d'Apple, qui portera le nom de « Mac OS X », a commencé à être distribuée aux développeurs le 13 septembre 2000.\n\nApple, face à Microsoft Windows 2000 et au futur standard potentiel de l'industrie « Microsoft Windows XP », tente désespérément de rester à flot sur le marché des systèmes d'exploitation. La concurrence sur ce marché déjà restreint ne peut qu'être bénéfique aux consommateurs américains."
 usa.37.o1: "Les titans s'affrontent à nouveau."
 usa.37.o2: "Déclarer le système d'Apple illégal"
 usa.38.t: "Déversement de boues de charbon du comté de Martin"
 usa.38.d: "News sources from Martin County, Kentucky report that the bottom of a coal slurry impoundment broke into an underground mine. The thin, sloppy, and poisonous mud subsequently emerged to the surface and the 300 million gallons of sludge made its way downstream. The local governments and municipalities have tried their best to contain it. The Ohio River and her tributaries are now equally drowned out with the black sludge.\n\nShould the EPA intervene or can the local authorities handle it?"
 usa.38.o1: "Envoyer les fédéraux"
 usa.38.o2: "Les autorités locales sont capables."
 usa.39.t: "Wikipédia"
 usa.39.d: "Peut-être l'un des projets les plus ambitieux de l'histoire d'Internet, « Wikipédia » a été créé le 15 janvier 2001.\n\nCette encyclopédie en ligne vise à fournir des connaissances provenant d'innombrables sources sur d'innombrables sujets à d'innombrables personnes, gratuitement.\n\nCependant, l'information est un pouvoir – et les totalitaires du monde entier désapprouveront certainement cette idée de « libre accès à l'information » que promet Wikipédia. Les créateurs du site, Jimmy Wales et Larry Sanger, promettent de maintenir Wikipédia sous une forme non lucrative, sans publicités, et financée uniquement par les dons des utilisateurs.\nC'est véritablement une excellente idée et une méthode formidable pour commencer à diffuser l'information à l'échelle mondiale et aux États-Unis."
 usa.39.o1: "Liberté de l'information"
 usa.53.t: "Négociations de paix de Shepherdstown"
 usa.53.d: "In a renewed push to relax tensions between Israel and Syria, especially over the Golan Heights and the unforgiving stances of the two governments against each other, the United States had invited both countries to talks of relaxation in Shepherdstown, West Virginia.\n\nOur delegation, led by Foreign Minister Farouk a-Shara, has safely arrived in West Virginia, on what some Syrians consider hostile American territory, and is willing to begin working."
 usa.53.o1: "La paix a-t-elle une chance ?"
 usa.60.t: "Mort de Gus Hall"
 usa.60.d: "Gus Hall was the chairman of the Communist Party of the United States for over forty years from between 1959 to earlier in 2000, when he stepped down in favor of Sam Webb, becoming honorary chairman instead.\n\nHall, who ran for President of the United States in the years 1972, 1976, 1980 and 1984 (massively failing each time), was a committed friend of the Soviet Union, always advocating an end of the Cold War through an American ascendancy into the Soviet bloc.\n\nHall, whose father had already been a lifelong communist and founding member of the CPUSA, joined the Young Communist League in 1927 and was allowed to study in Moscow between 1931 and 1933. Hall, who was born as Arvo Kusta Halberg, changed his name during the 1930s to escape the U.S. governments blacklist of communists that made it very difficult for them to get employed.\n\nHall continued to rise through the ranks of the CPUSA due to his slave-like obedience to the Soviet leadership (with his political views changing just as often as the ones in Moscow)."
 usa.60.o1: "Bon débarras."
 usa.60.o2: "Honorer ses réalisations de vie."
 usa.63.t: "État Gus Hall"
 usa.63.d: "With communists in power, it is time to consider changing some of the reminders of American Imperialism. A state and our great capital are named for a piece of slave-owning imperialistic scum. But there is a solution; Exchange the founder and first leader of the fake American capitalistic state with the patron saint of the American Communist Party. Gus Hall who passed away recently. The name is quite clearly a wonderful choice for a city name! Furthermore, there are tons of other cities and states which could use a renaming. North Carolina could become Vladimir after Lenin. There are so many possibilities and only fifty states!"
 usa.63.o1: "Une excellente idée !"
 usa.63.o2: "Pas nécessaire. Beurk."
 usa_news.18.t: "Attentat contre l'USS Cole"
 usa_news.18.d: "Le commandement naval des États-Unis a indiqué que le destroyer USS Cole avait été attaqué par le réseau Al-Qaïda, tuant 17 militaires américains. Les rapports des services de renseignement américains désignent le gouvernement du Soudan comme un soutien possible des deux attaquants."
 usa_news.18.o1: "Ils vont le regretter."
 usa_news.18.o2: "Envoyez nos condoléances aux américains."
 usa_news.18.o3: "Des Américains morts ? Tant mieux."
 usa_news.18.o4: "Ils nous accusent ?!"
 usa_economic_nationalize_tt: "Nationaliser une entreprise §Ycoûte§! le plus cher, cependant, cela §Ystabilise§! davantage l'économie.\n"
 usa_economic_bailout_tt: "Renflouer une entreprise §Ycoûte§! moins cher que la nationaliser, cependant, cela §Ystabilise§! moins l'économie.\n"
 usa_economic_donothing_tt: "Ne rien faire déstabiliserait l’économie, mais elle reviendra à son état antérieur relativement bientôt.\n"
 usa_economic_events.1.t: "Faillite des Lehman Brothers !"
 usa_economic_events.1.d: "Le [GetDateText], les Lehman Brothers ont déclaré faillite. La société a déposé une demande de faillite sous le chapitre 11, marquant l'histoire comme la plus grande faillite de l'histoire américaine. Les actifs des Lehman Brothers sont estimés à 600 milliards de dollars. Ils sont la première victime de l'effondrement du marché immobilier. Non seulement cela a envoyé des ondes de choc à travers les marchés bancaires d'investissement et immobiliers, mais cela a aussi secoué la bourse, déclenchant une chute d'un jour de 4,5 % à la Bourse de New York.\n\nEst-ce le début d'une nouvelle Grande Dépression ?"
 usa_economic_events.1.a: "Nationalisez-les !"
 usa_economic_events.1.b: "Bail Them Out!"
 usa_economic_events.1.c: "Laissez l'économie suivre son cours"
 usa_economic_events.2.t: "Fannie Mae & Freddie Mac"
 usa_economic_events.2.d: "Fannie Mae et Freddie Mac sont deux géants du prêt hypothécaire aux États-Unis. Le choc récent de la faillite des Lehman Brothers a causé des effets en cascade sur l'ensemble du marché financier. L'industrie des prêts hypothécaires n'échappe pas à cela.\n\nLes entreprises sont en plein effondrement. Nous avons plusieurs plans pour ces entreprises. L'un d'eux est de nationaliser l'entreprise et de la placer sous tutelle, ce qui signifie que le gouvernement des États-Unis aurait un contrôle total sur les finances de l'entreprise. Cependant, ce n'est pas notre seule solution. Nous pourrions également renflouer l'entreprise et la laisser agir de manière indépendante.\n"
 usa_economic_events.2.a: "Placer sous tutelle"
 usa_economic_events.2.b: "S'engager dans un renflouement"
 usa_economic_events.2.c: "It's Dangerous to Play Economic God"
 usa_economic_events.3.t: "Fusion Chase-Stearns"
 usa_economic_events.3.d: "The current financial climate has caused some companies to be inherently worried. One of those would be Bear Stearns and JPMorgan Chase. The executive team at JPMorgan states that the best move for both companies is a government-sponsored merger between the two companies.\n\nStearns is willing to sell the company in total at $10 a share. The price is quite small in comparison to the 52-week high of Bear Stearns stock being $133.20. The rock-bottom price is representative of the rock-bottom situation in the company.\n\nDo we allow Chase to Grow?"
 usa_economic_events.3.a: "Placer Bear Stearns sous la tutelle du Trésor américain"
 usa_economic_events.3.b: "S'engager dans un renflouement. Les maintenir à flot"
 usa_economic_events.3.c: "Laisser l'eau les emporter"
 usa_economic_events.4.t: "American International Group (AIG)"
 usa_economic_events.4.d: "American International Group est la dernière grande entreprise à tomber dans ce que certains appellent la Grande Récession. AIG a récemment cherché des prêteurs privés pour ses finances en difficulté, mais en raison du climat économique de [GetYear], elle fait face à une faillite imminente. Nous avons la possibilité de placer AIG sous le contrôle du gouvernement américain. L'entreprise est prête à offrir une participation de 79,9 % dans l'entreprise en échange d'un prêt à intérêt de deux ans pour sauver l'entreprise en difficulté. La Réserve fédérale utilise une disposition de la loi sur la Réserve fédérale pour justifier ce plan.\n\nIl existe d'autres options, mais celle-ci nous donnera la majorité des profits."
 usa_economic_events.4.a: "Offrir le prêt à AIG"
 usa_economic_events.4.b: "Refuser la participation, utiliser les actifs comme garantie. Accorder le prêt."
 usa_economic_events.4.c: "Pourquoi les sauver ?"
 usa_economic_events.5.t: "Krach du marché immobilier"
 usa_economic_events.5.d: "Le coup final a été porté lorsque le marché immobilier américain s'est effondré. Partout aux États-Unis, les gens ont fait face à des saisies immobilières ou à une chute massive de la valeur de leur propriété. C'est probablement l'une des parties les plus dures de cette grande récession.\nComment devons-nous procéder ? Aider les gens ou les laisser se débrouiller seuls ?\n"
 usa_economic_events.5.a: "Les laisser"
 usa_economic_events.5.b: "Aider les familles"
 usa_economic_events.31.t: "Une entreprise d'armement quitte les États-Unis"
 usa_economic_events.31.d: "La Grande Récession frappe durement les États-Unis. Elle entraîne une chute des investissements, et certaines entreprises de fabrication d'armes partent ailleurs. Cette décision vise à sauver l'entreprise, mais elle cause la perte d'emplois pour les travailleurs américains."
 usa_economic_events.31.a: "Oh non"
 usa_economic_events.32.t: "Une entreprise manufacturière quitte les États-Unis"
 usa_economic_events.32.d: "La fabrication était autrefois le pilier de l'Amérique. Les coûts des affaires et les faibles revenus des investissements locaux ont poussé la fabrication à l'étranger. L'Amérique est véritablement en récession, et cela continue de nuire et de tourmenter le peuple américain."
 usa_economic_events.32.a: "Cela va-t-il empirer ?"
 usa_economic_events.33.t: "Fermeture d'usines américaines"
 usa_economic_events.33.d: "Les usines à travers le pays souffrent. Une série d'usines dans le nord des États-Unis ont commencé à fermer leurs portes définitivement. Les Américains n'achètent tout simplement pas leurs produits."
 usa_economic_events.33.a: "Ça sera bientôt fini"
 usa_economic_events.34.t: "Une entreprise américaine déclare faillite !"
 usa_economic_events.34.d: "Une autre entreprise américaine a déclaré faillite dans le sillage de cette dure récession. La décision est survenue car l'entreprise était incapable de rembourser ses dettes en raison d'un manque de revenus entrants."
 usa_economic_events.34.a: "Les Américains souffrent"
 usa_economic_events.35.t: "Fin de la récession américaine"
 usa_economic_events.35.d: "The Federal Reserve has finally declared the worst of the recession is over. The economy is once again growing and it is no longer contracting. Its effects were widespread and felt globally. It's unfortunate that this is what we had to come to in order to continue helping our economy."
 usa_economic_events.35.a: "Le chemin de la reprise"
 usa_economic_events_news.1.t: "La faillite de Lehman Brothers"
 usa_economic_events_news.1.d1: "Yesterday, the Lehman Brothers has declared bankruptcy. The company has filed for a Chapter 11 Bankruptcy making history as the largest bankruptcy filing in American history. The Lehman Brothers holdings are an estimated $600 Billion in assets. They are the first victim of the collapsing housing market and American downturn. Not only have bankruptcies sent shock-waves through the investment banking and real estate markets. It has shocked the stock market triggering a one-day drop of 4.5% on the New York Stock Exchange.\n\nThe American government has decided it is in the best interest of the American people to nationalize the company. Bringing the company into American custodianship will help stabilize its plummeting stock and value. The Federal Reserve provided $90 billion for the company to use whilst taking an 80% equity share in the company using the company's assets as collateral.\n"
 usa_economic_events_news.1.d2: "Yesterday, the Lehman Brothers has declared bankruptcy. The company has filed for a Chapter 11 Bankruptcy making history as the largest bankruptcy filing in American history. The Lehman Brothers holdings are an estimated $600 Billion in assets. They are the first victim of the collapsing housing market and American downturn. Not only have bankruptcies sent shock-waves through the investment banking and real estate markets. It has shocked the stock market triggering a one-day drop of 4.5% on the New York Stock Exchange.\n\nThe American government has decided it is in the best interest of the American people to bail out the company. The Federal Reserve authorized up to $60 billion to keep the company afloat while the company continues to negotiate its division and sale.\n"
 usa_economic_events_news.1.d3: "Yesterday, the Lehman Brothers has declared bankruptcy. The company has filed for a Chapter 11 Bankruptcy making history as the largest bankruptcy filing in American history. The Lehman Brothers holdings are an estimated $600 Billion in assets. They are the first victim of the collapsing housing market and American downturn. Not only have bankruptcies sent shock-waves through the investment banking and real estate markets. It has shocked the stock market triggering a one-day drop of 4.5% on the New York Stock Exchange.\n\nThe Federal Reserve has declared that they would not be intervening immediately in the Lehman Brothers bankruptcy."
 usa_economic_events_news.1.a: "Cela pourrait-il empirer ?"
 usa_economic_events_news.1.b: "C'est inquiétant."
 usa_economic_events_news.1.c: "Pathétique"
 usa_economic_events_news.2.t: "Fannie Mae et Freddie Mac"
 usa_economic_events_news.2.d1: "Fannie Mae & Freddie Mac are two giant mortgage lenders in the USA. The recent shock of the Lehman Brothers bankruptcy has caused rippling effects in the financial market as a whole. The mortgage lending industry is no exception to this.\n\nThe US Government has taken steps to effectively nationalize the company and place it within the control of the Federal Reserve. They authorized $200 billion to save these two giant mortgage lenders, in exchange the government seized control over the private, yet government-sponsored, enterprises. Each company was allotted $100 billion to prevent their bankruptcies.\n"
 usa_economic_events_news.2.d2: "Fannie Mae & Freddie Mac are two giant mortgage lenders in the USA. The recent shock of the Lehman Brothers bankruptcy has caused rippling effects in the financial market as a whole. The mortgage lending industry is no exception to this.\n\nThe Federal Reserve has given Fannie Mae & Freddie Mac up to $50 billion for each company to prevent their bankruptcies. They bailed them out for the time being in order to keep the two mortgage lenders afloat.\n"
 usa_economic_events_news.2.d3: "Fannie Mae & Freddie Mac are two giant mortgage lenders in the USA. The recent shock of the Lehman Brothers bankruptcy has caused rippling effects in the financial market as a whole. The mortgage lending industry is no exception to this.\n\nThe Federal Reserve has decided the company should be left to its devices. The chairman of the Federal Reserve has stated that it's not worth the American people's tax money to be given to failing companies.\n"
 usa_economic_events_news.2.a: "La récession s'aggrave"
 usa_economic_events_news.2.b: "La situation devient de plus en plus inquiétante."
 usa_economic_events_news.2.c: "Pathétique"
 usa_economic_events_news.3.t: "Fusion Bear Stearns - JPMorgan Chase"
 usa_economic_events_news.3.d1: "The current financial climate has caused some companies to be inherently worried. One of those would be the Bear Stearns and JPMorgan Chase. The executive team at JPMorgan states that the best move for both companies is a government sponsored merger between the two companies.\nThe Federal Reserve responded today by placing Bear Stearns in the care of the United States government. It's another company on the list of state run companies in the United States. The nationalization process required some $50 billion to keep the faltering company afloat."
 usa_economic_events_news.3.d2: "The current financial climate has caused some companies to be inherently worried. One of those would be the Bear Stearns and JPMorgan Chase. The executive team at JPMorgan states that the best move for both companies is a government sponsored merger between the two companies.\nThe Federal Reserve responded today by authorizing the merger between JPMorgan Chase and Bear Stearns. It was tallied and supported by a bailout of about $30 billion to assure JPMorgan's fiscal stability while they took on Bear Stearns.\n"
 usa_economic_events_news.3.d3: "Le contexte financier actuel suscite des inquiétudes chez certaines entreprises, notamment Bear Stearns et JPMorgan Chase. La direction de JPMorgan affirme qu'une fusion entre les deux entreprises, sous l'égide du gouvernement, serait la meilleure solution pour les deux sociétés.\nLa Réserve fédérale a réagi aujourd'hui en rejetant la fusion. Elle estime que cette fusion conférerait à JPMorgan Chase un pouvoir de marché toujours plus important. Bear Stearns recherche activement d'autres sources de revenus et de stabilisation.\n"
 usa_economic_events_news.3.a: "La récession s'aggrave"
 usa_economic_events_news.3.b: "Nous devrions commencer à liquider nos investissements"
 usa_economic_events_news.3.c: "Pathétique, notre économie est plus forte que jamais !"
 usa_economic_events_news.4.t: "Groupe international américain"
 usa_economic_events_news.4.d1: "American International Group is the latest major company to fall from what some are calling the Great Recession. AiG recently sought out private lenders for their troubled financials, however, due to the economic climate of [GetYear] they have declared bankruptcy. The American Government issued a statement explaining that in order to keep the company afloat, the Government received a 79.9% equity share in the company giving it majority control over the company.\n"
 usa_economic_events_news.4.d2: "American International Group est la dernière grande entreprise à succomber à ce que certains appellent la Grande Récession. AiG a récemment sollicité des prêteurs privés pour redresser sa situation financière difficile, mais, compte tenu du contexte économique de [GetYear], elle a déclaré faillite. La Réserve fédérale a refusé de prendre une participation dans l'entreprise, mais lui a accordé un prêt à taux d'intérêt pour la maintenir à flot.\n"
 usa_economic_events_news.4.d3: "American International Group est la dernière grande entreprise à succomber à ce que certains appellent la Grande Récession. AiG avait récemment sollicité des prêteurs privés pour redresser sa situation financière précaire, mais, compte tenu du contexte économique de [GetYear], elle a déclaré faillite. La Réserve fédérale lui a refusé tout soutien. L'entreprise est désormais livrée aux aléas du marché.\n"
 usa_economic_events_news.4.a: "La dernière grande faillite"
 usa_economic_events_news.4.b: "Le pire est-il passé ?"
 usa_economic_events_news.4.c: "Tant mieux, les Américains en récession, c'est formidable !"
 usa_economic_events_news.6.t: "Fin de la Grande Récession"
 usa_economic_events_news.6.d: "The American economy has finally turned around and is back on track. Federal Reserve estimates the recovery will take several years in order to turn around the economic damages that have been done.\nThe true effects of the American Recession have yet to be seen.\n"
 usa_economic_events_news.6.a: "Le pire est passé"
 usa_economic_events_news.6.b: "Let's reinvest!"
 usa_economic_events_news.6.c: "C'est malheureux"
 USA_american_economic_decisions_category: "L'économie américaine"
 USA_american_economic_decisions_category_desc: "The American economy is the world's largest and one of the strongest economies in the world. However, that does not mean it doesn't have its weaknesses. It is mainly service based as the majority of American businesses look elsewhere for cheaper labor. The economy is also tied-in very closely with American politics. Conducting business in America is expensive but extremely profitable. §YWall Street§! is also partially to blame. The businessmen and women in New York are some of the most powerful individuals in America. It is best to keep them in check and on the government's good side or else.\n\n§YStrength of Wall Street:§! [?USA.USA_strength_of_wall_street_var|17.0] of 50\n§YStrength of Regulations:§! [?USA.USA_economic_regulation_var|45.0] of 100"
 USA_resource_steel_factories_decision: "Étendre les usines d'acier"
 USA_resource_steel_factories_decision_desc: "Une grande partie de l'industrie sidérurgique américaine a été délocalisée au cours des 40 à 50 dernières années. Il pourrait être dans notre intérêt de ramener une partie de ce travail ici et d'investir dans nos entreprises sidérurgiques !"
 USA_resource_aluminimum_prospecting_decision: "Exploiter les gisements de bauxite"
 USA_resource_aluminimum_prospecting_decision_desc: "Les gisements de bauxite autour des États-Unis doivent être exploités. Investir dans cette ressource pourrait promouvoir une plus grande autosuffisance à travers le pays."
 USA_resource_techmetals_prospecting_decision: "Prospections pour les métaux technologiques"
 USA_resource_techmetals_prospecting_decision_desc: "Electronics require a large number of very specific materials such as lithium, gold, tungsten, and silver. We should prospect a bit more around the Rockies and Appalachians."
 USA_regulate_wall_street_decision: "Adopter une régulation de Wall Street"
 USA_regulate_wall_street_decision_desc: "§YWall Street§! a eu la vie trop belle pendant trop longtemps. Nous devrions pousser pour améliorer les régulations sur les secteurs financiers."
 USA_deregulate_wall_street_decision: "Déréguler le secteur financier"
 USA_deregulate_wall_street_decision_desc: "Our regulations are currently far too tight on the financial sectors. Easing them up should improve investment from domestic and foreign investors."
 USA_industrial_outsourcing_decision: "Délocalisation industrielle"
 USA_industrial_outsourcing_decision_desc: "Les régulations ont fait grimper le coût des affaires aux États-Unis bien au-delà de leur valeur. Peut-être que promouvoir une certaine délocalisation pourrait globalement améliorer les prix et la demande pour les travailleurs américains."
 USA_spurring_economic_growth_decision: "Stimuler la croissance économique"
 USA_spurring_economic_growth_decision_desc: "L'économie a quelque peu stagné récemment. Nous devrions introduire une nouvelle législation pour soit déréguler, soit utiliser la politique monétaire/fiscale pour augmenter la croissance économique."
 USA_bring_microsoft_to_court_decision: "Traîner Microsoft en justice"
 USA_bring_microsoft_to_court_decision_desc: "Microsoft a été autorisé à acquérir de plus petites entreprises technologiques sans opposition au cours de la dernière année. Certains conseillers économiques suggèrent de traîner Microsoft en justice pour empêcher leur expansion encore plus loin."
 USA_finish_keystone_and_dakota_pipelines: "Achever les oléoducs Keystone et Dakota"
 USA_finish_keystone_and_dakota_pipelines_desc: "Nous devons travailler et cibler l'achèvement des oléoducs Keystone. Ces artères économiques cruciales relieront encore plus étroitement les cœurs battants des économies américaine et canadienne. Cela créera également plus de cohésion entre les frères nord-américains. Qui sait, peut-être pourrons-nous faire quelque chose avec notre frère du sud à l'avenir."
 USA_america_first_energy_plan: "Loi sur l'énergie américaine pour les besoins américains"
 USA_america_first_energy_plan_desc: "La loi AEAN est un projet de loi complet visant à traiter directement la production, l'exportation et la consommation d'énergie domestique. Nous ajusterons finement les réglages et espérons pouvoir satisfaire davantage nos besoins domestiques sans compromettre nos obligations étrangères."
 USA_open_public_lands_to_fracking: "Ouvrir les terres publiques à la fracturation"
 USA_open_public_lands_to_fracking_desc: "Avec une demande croissante d'énergie, tant au niveau national que mondial, nous devons chercher de nouveaux moyens de répondre à notre demande tout en restant compétitifs sur la scène mondiale. Nous pourrions recevoir des critiques des éco-hippies, mais en fin de compte, ils nous remercieront."
 USA_expanding_alumninum_flag: "Actuellement en expansion de la production d'§Yaluminium§!"
 USA_expanding_techmetals_flag: "Actuellement en expansion de la production de §Ymétaux technologiques§!"
 USA_is_territory_flag: "est un §Yterritoire des États-Unis§!"
 USA_has_wall_street_faction_TT: "Possède une faction interne §YWall Street§!"
 USA_not_expanded_states_resources_three_times_TT: "N'a pas étendu cette §Yressource§! §G3§! §Yfois§!"
 USA_deregulate_wall_street_decision_tt: "§YForce des régulations§! est supérieure à §Y10§!\n"
 USA_regulate_wall_street_decision_tt: "§YForce des régulations§! est inférieure à §Y90§!\n"
 USA_allowed_microsoft_merger: "A autorisé la fusion de §YMicrosoft§!"
 USA_less_than_30_regulation_tt: "§YForce des régulations§! est inférieure à §Y30§!\n"
 USA_greater_than_20_regulation_tt: "§YForce des régulations§! est supérieure à §Y20§!\n"
 USA_greater_than_40_regulation_tt: "§YForce des régulations§! est supérieure à §Y40§!\n"
 USA_greater_than_60_regulation_tt: "§YForce des régulations§! est supérieure à §Y60§!\n"
 USA_greater_than_80_regulation_tt: "§YForce des régulations§! est supérieure à §Y80§!\n"
 USA_congress_md: "Congrès"
 USA_congress_md_desc: "La Colline a ses propres règles et idées. Nous devrons travailler avec eux pour faire avancer les choses, mais il existe des moyens de s'assurer d'avoir un Congrès sympathique et coopératif."
 USA_political_pandering: "Flatterie politique"
 USA_political_pandering_desc: "The lobbyist wing of congress can be very, persuasive when need be."
 USA_statehood_for_guam: "Accorder le statut d'État à Guam"
 USA_statehood_for_guam_desc: "§YGuam§! is another large organized territory in the §Y[USA.GetNameWithFlag]§! since 1898. Although, the statehood movement is not as large as the one in §YPuerto Rico§! it is still another viable candidate for the 51st state of the United States."
 USA_communist_state_renaming: "Renommer les États"
 USA_communist_state_renaming_desc: "Il y a beaucoup d'États aux États-Unis qui représentent beaucoup de choses. Certains représentent des choses qui n'ont pas leur place dans nos grands États communistes d'Amérique !"
 donald_trump.8.t: "Lancement de l'initiative d'extraction d'astéroïdes"
 donald_trump.8.d: "L'extraction d'astéroïdes a été un fantasme pour beaucoup avant nous. Les astéroïdes eux-mêmes contiennent des métaux du groupe du platine, de l'or, de l'argent et des métaux du groupe du fer très recherchés. Cela pourrait devenir extrêmement lucratif pour tout pays capable de voyager dans l'espace. Aujourd'hui, la création d'une Initiative d'extraction d'astéroïdes, ou AMI, sera la première étape vers l'extraction d'astéroïdes. En utilisant de vastes réseaux de télescopes à travers les États-Unis, nous pouvons chercher des astéroïdes appropriés dans l'espace proche, puis les ramener en orbite et les exploiter. Repérer un astéroïde approprié sera difficile, car, par rapport à la distance où ils se trouvent, ils sont assez petits. Heureusement, il y en a en fait beaucoup qui passent près de la Terre de temps en temps, donc il ne faudrait pas longtemps pour en faire rester un en orbite terrestre."
 donald_trump.8.o1: "Il suffit d'attendre un astéroïde..."
 donald_trump.9.t: "Astéroïde repéré"
 donald_trump.9.d: "Récemment, nos scientifiques à la NASA ont repéré un astéroïde approprié passant près de la Terre. Cela a été un soulagement pour l'AMI, car certains doutaient que nous repérions un jour un astéroïde économique et adapté. Cependant, cet astéroïde se déplace assez lentement, est suffisamment grand et assez riche pour être déplacé en orbite et exploité. L'astéroïde est, en fait, plus grand que l'État de New York. La prochaine étape est simplement de déplacer cet astéroïde en orbite autour de la Terre, ce qui n'a jamais été fait auparavant. En attendant, les ingénieurs de la NASA, et même des entreprises privées comme SpaceX, ont inventé des mécanismes pour exploiter l'astéroïde, ils seront donc prêts lorsque l'astéroïde sera en orbite."
 donald_trump.9.o1: "Mettons ce bébé en orbite"
 donald_trump.10.t: "Astéroïde en orbite"
 donald_trump.10.d: "With the asteroid in orbit, NASA and SpaceX are both sending missions to the orbiting asteroid. NASA is mainly concerned about collecting scientific data, while SpaceX is more concerned about mining the material. No doubt this is a noteworthy achievement, which gives us an edge in space. There is even talk about bringing in more asteroids, but many say that additional asteroids can come later, as this asteroid is very large and well suited for mining. Other countries are already looking at us with envy, and are considering their own asteroid mining programs. The costs are extremely high even to develop the technology to even get there, so there is little worry among SpaceX or NASA that competition will arrive."
 donald_trump.10.o1: "L'extraction peut commencer"
 donald_trump.11.t: "Les profits de l'extraction commencent à affluer"
 donald_trump.11.d: "After establishing mining operations, SpaceX and NASA have both sent back their first shipments of space-material to labs and markets around the globe. The world has jealously looked on us, and there have been open talks in their respective chambers of legislation about opening their own asteroid mining operations. While we soon may get competition, we can enjoy the monopoly for now."
 donald_trump.11.o1: "Hourra !"
 donald_trump.12.t: "Profits de l'extraction d'astéroïdes"
 donald_trump.12.d: "Les derniers chargements de nos opérations d'extraction d'astéroïdes sont arrivés et ont généré de nombreux revenus. Ces chargements incluent du platine, de l'or et de l'argent. Utiliser ces revenus à bon escient serait sage."
 donald_trump.12.o1: "Excellent !"
 donald_trump.13.t: "Potentiel de l'extraction minière d'astéroïdes"
 donald_trump.13.d: "Récemment, Donald Trump a autorisé la NASA et SpaceX, une entreprise spatiale privée, à amener un astéroïde relativement grand en orbite terrestre pour l'exploiter. Nos conseillers recommandent d'investir dans ce nouveau domaine, car cela pourrait permettre la livraison de matériaux rares directement à notre pays. Cependant, certains critiquent le coût colossal assumé par les États-Unis pour lancer ces opérations et s'opposent à une expansion dans l'espace. Le retour sur investissement est incertain, mais il pourrait falloir 25 ans pour atteindre l'équilibre financier. Un investissement plus important pourrait réduire ce délai, mais nous resterons loin derrière les États-Unis pendant un certain temps.\n\nQue devons-nous faire concernant l'extraction d'astéroïdes ? Lancer un programme national ou l'ignorer complètement ?"
 donald_trump.13.o1: "Investir dans l'extraction d'astéroïdes"
 donald_trump.13.o2: "Trop coûteux et une perte de temps !"
 donald_trump.23.t: "Mission vers Mars"
 donald_trump.23.d: "Monsieur le Président, avec le financement assuré et les plans finalisés, nous pouvons maintenant préparer un groupe d'hommes et de femmes à supporter l'immense pression et la solitude de l'espace pour atteindre Mars.\n\nHeureusement, la NASA se prépare à un tel voyage depuis des années, mais elle n'avait pas les fonds pour lancer un programme complet. La formation supplémentaire des astronautes actuels et la préparation de la fusée vont commencer sérieusement.\n\nCe processus prendra environ un an. Pendant ce temps, les scientifiques des laboratoires de la NASA préparent des équipements scientifiques à envoyer avec les astronautes sur Mars pour collecter des données impossibles à obtenir avec un rover. Notez toutefois que SpaceX pourrait tenter d'envoyer un homme sur Mars en premier dès l'annonce de ce projet."
 donald_trump.23.o1: "Que les préparatifs commencent"
 donald_trump.24.t: "Course à l'espace"
 donald_trump.24.d: "In a recent news release, SpaceX has decided to launch its own program to get to Mars in under a year. Now, if SpaceX gets there first, it will still be an achievement that you can use for additional investment into space, however, it will be... let's just say... not as politically convenient.\n\nThis new Space Race for Mars will require additional investment if we are wanting to secure victory first, however, some experts argue that Elon Musk's program lacks certain aspects required to go to Mars with a crewed mission there and back. We may just be able to get to Mars first without assigning additional funds to NASA.\n\nWhat is your directive, Mr. President?"
 donald_trump.24.o1: "Que la course commence !"
 donald_trump.24.o2: "Continuer au rythme actuel"
 donald_trump.14.t: "Mission vers Mars prête"
 donald_trump.14.d: "La NASA vient de confirmer que les astronautes, les équipements et la fusée sont prêts. Six astronautes se dirigent vers Mars pour un voyage aller-retour : Michael, Paul, Edward, Rodney, Mary et Anne. Ces astronautes se sont entraînés pendant deux ans et sont les mieux préparés pour cette mission. La fusée, le récent Système de Lancement Spatial de la NASA, est prête à décoller. La capsule, la Capsule Spatiale Orion, est également prête.\n\nHeureusement, la prochaine fenêtre de lancement est dans 30 jours."
 donald_trump.14.o1: "30 jours avant le lancement !"
 donald_trump.15.t: "Sur la rampe de lancement"
 donald_trump.15.d: "[GetDateText] :\nNos six astronautes sont prêts. Ce sera un voyage long et difficile, mais ils sont préparés. Paul semble particulièrement enthousiaste à cette perspective, tandis que le reste de l'équipage est nerveux, notamment Rodney, bien que déterminé.\n\nLes astronautes sont dans la fusée, prêts à décoller dans l'espace. Ils ont fait leurs adieux à leurs familles et amis, qu'ils ne reverront pas en personne pendant près de deux ans. Tous sont optimistes pour une mission réussie.\n\nLe compte à rebours a commencé, le lancement est confirmé."
 donald_trump.15.o1: "3, 2, 1..."
 donald_trump.16.t: "Décollage !"
 donald_trump.16.d: "Launch Control has certified liftoff, and the rocket and crew are heading to Mars! People's heads are towards the sky, as the rocket heads for orbit. Its crew are both ecstatic and relieved, as it's a perfect launch. Everything has worked so far, and there is much hope that it will continue to work for months to come.\n\nThe dream is near complete."
 donald_trump.16.o1: "Un jour historique excitant"
 donald_trump.17.t: "Catastrophe !"
 donald_trump.17.d: "La fusée a explosé !\n\nIl s'avère que les vérifications finales essentielles étaient insuffisantes pour empêcher une catastrophe. Il a été rapporté que les six membres d'équipage, Michael, Paul, Edward, Rodney, Mary et Anne, ont péri dans cette tragédie. Les spectateurs au sol regardent, incrédules, les flammes engloutir la plateforme de lancement. Cela affaiblira considérablement la volonté d'explorer l'espace dans un avenir proche et restera une tache sur votre présidence."
 donald_trump.17.o1: "Un accident fatal"
 donald_trump.18.t: "Folie dans l'espace"
 donald_trump.18.d: "It turns out that prolonged periods in isolation with only five others to talk to are not suitable at all for the human psyche.\n\nDespite going through severe training before-hand, one astronaut, Michael, went mentally insane and attempted to manually control the craft to return to Earth as soon as possible. Anne, the only other person awake at the time, attempted to get in his way and halt him, however, she was unable to wrestle him away from the controls. While she was attempting to do this, Michael punched Anne in the jaw, knocking her unconscious.\n\nFortunately, the other crew members were wakened by the disorder, and immediately jumped to aid Anne. A quick struggle ensued where the control panel was slightly dented, however, everything remains operational and Michael is now in a makeshift prison with makeshift handcuffs. Additional good news, Anne was not permanently injured, and will be able to recover within a week on the vessel. Whether she has long term damage would have to be investigated by doctors at home.\n\nThe bad news is that the rocket is widely off-course. Additionally, a lot of fuel was burned in Michael's hasty attempt to return to Earth.\n\nThere are two options: Return to Earth with all the astronauts, arresting Michael for assault and endangering five other lives, or send them on a one way trip to Mars. The five astronauts have expressed that they are willing to sacrifice themselves for the good of humanity.\n\nMr. President. What is your choice?"
 donald_trump.18.o1: "Si les astronautes restants sont prêts, qu'ils continuent"
 donald_trump.18.o2: "Ramenez nos hommes et femmes à la maison, et arrêtez ce salaud"
 donald_trump.19.t: "Retour honteux"
 donald_trump.19.d: "Il y a quelques mois, une altercation à bord de la fusée vers Mars a forcé les astronautes à rentrer sur Terre pour éviter un voyage sans retour. Anne a été envoyée à l'hôpital pour vérifier d'éventuelles blessures non détectées par l'équipage, et Michael a été arrêté ; il sera probablement interné dans un hôpital psychiatrique. Les autres astronautes, sauf Mary, se sont de nouveau proposés pour des missions spatiales, tandis que Mary a décidé de prendre une retraite anticipée de sa carrière d'astronaute. Ils sont tous heureux d'être rentrés vivants.\n\nCela marque probablement la fin des programmes gouvernementaux pour envoyer des humains sur Mars pour un long moment."
 donald_trump.19.o1: "Dommage, mais au moins ils sont vivants"
 donald_trump.20.t: "Sacrifice sur Mars"
 donald_trump.20.d: "Il y a quelques semaines, une altercation à bord de la fusée vers Mars a forcé les astronautes à prendre la difficile décision de s'engager dans un voyage sans retour vers Mars. Ils ont atterri et explorent la surface martienne. Leur temps de vie est limité, et ils comptent en tirer le maximum. Des opportunités de recherche significatives en découleront, mais au prix de vies humaines. Isolés, sans source de nourriture permanente, l'équipage mourra de faim sur Mars, laissant leurs corps sur la surface jusqu'à ce qu'une équipe, un jour peut-être, vienne les récupérer pour un enterrement décent sur Terre. D'ici là, ils reposeront là pour l'éternité."
 donald_trump.20.o1: "Martyrs sur Mars"
 donald_trump.21.t: "L'Aigle a atterri"
 donald_trump.21.d1: "L'atterrissage sur Mars est un succès ! L'équipage à bord est euphorique, et les spectateurs sur Terre sont plus excités que jamais pour les voyages spatiaux. Ils resteront quelques jours pour prendre des échantillons scientifiques et réaliser des expériences avant de rentrer sur Terre. L'engouement pour l'espace facilitera politiquement les futures missions spatiales et renforcera la popularité de votre présidence. Cependant, les États-Unis repoussent une fois de plus les limites de l'espace."
 donald_trump.21.d2: "L'atterrissage de la NASA sur Mars, le deuxième à réussir, est un succès ! L'équipage à bord est euphorique, et les spectateurs sur Terre, avec cet exploit et celui de SpaceX, sont plus excités que jamais pour les voyages spatiaux. Ils resteront quelques jours pour prendre des échantillons scientifiques et réaliser des expériences avant de rentrer sur Terre. L'engouement pour l'espace facilitera politiquement les futures missions spatiales et renforcera la popularité de votre présidence. Cependant, les États-Unis, tant publics que privés, repoussent une fois de plus les limites de l'espace."
 donald_trump.21.o1: "Hourra pour les USA !"
 donald_trump.21.o2: "Deuxième, ce n'est pas si mal"
 donald_trump.22.t: "Retour héroïque"
 donald_trump.22.d1: "Michael, Paul, Edward, Rodney, Mary et Anne sont rentrés sains et saufs d'un voyage qui entrera dans les livres d'histoire comme l'un des vols spatiaux les plus importants jamais réalisés. Ils rapportent d'innombrables roches et des données inestimables qui seront analysées dans des laboratoires du monde entier. Espérons que cela ouvrira la voie à la future colonisation de Mars."
 donald_trump.22.d2: "Bien qu'arrivés en deuxième, Michael, Paul, Edward, Rodney, Mary et Anne sont rentrés sains et saufs d'un voyage aller-retour vers Mars. Ils rapportent d'innombrables roches et des données inestimables qui seront analysées dans des laboratoires du monde entier. Espérons que cela, avec l'atterrissage de SpaceX, ouvrira la voie à la future colonisation de Mars."
 donald_trump.22.o1: "Nos héros sont rentrés"
 donald_trump.22.o2: "Ils sont rentrés"
 donald_trump.25.t: "SpaceX atteint Mars"
 donald_trump.25.d1: "Despite our best efforts, SpaceX has managed to land on Mars first, beating us in the space race. They have landed their Starship on the Martian surface. This task for a private company was a huge undertaking, and we applaud them just for getting to Mars first, before NASA with its huge financial advantage. We still celebrate this occasion, as it will bring many new discoveries to the sciences of space exploration and Mars."
 donald_trump.25.d2: "SpaceX is the second organization to land on Mars. They have landed their Starship on the Martian surface. This task for a private company was a huge undertaking, and we applaud them just for getting to Mars, just after NASA with its huge financial advantage. We still celebrate this occasion, since it will hopefully lead to successes in the future for SpaceX and Elon Musk."
 donald_trump.25.d3: "SpaceX is the second organization to land on Mars, albeit it will likely be the first to do a successful round trip. They have landed their Starship on the Martian surface, near the site where we landed our doomed mission, and are taking the bodies home, much to the relief of their families at home. This task for a private company was a huge undertaking, and we applaud them just for getting to Mars. We still celebrate this occasion, since it will hopefully lead to successes in the future for SpaceX and Elon Musk."
 donald_trump.25.o1: "Peu importe qui le fait en premier, c'est une réalisation incroyable"
 donald_trump.25.o2: "C'est une réalisation incroyable"
 donald_trump.26.t: "Avant-poste sur la Lune"
 donald_trump.26.d: "Nos scientifiques et ingénieurs sont prêts à envoyer des astronautes et du matériel pour vivre semi-permanente sur la Lune. Un total d'environ 12 astronautes sera envoyé, accompagné de dizaines de millions de dollars d'équipements, de provisions, d'espaces de vie et d'objets personnels. Cet avant-poste devra être régulièrement déplacé, car le jour lunaire dure 29 jours terrestres, ce qui est trop long pour que les batteries conservent l'énergie sur la Lune.\n\nLa base sera située aux pôles, facilement déplaçable, pour maximiser l'utilisation de nos panneaux solaires. De plus, des expériences seront menées pour déterminer les conditions de vie à long terme sur la Lune. L'extraction de glace lunaire pourrait non seulement fournir de l'eau liquide pour les plantes et la nourriture des astronautes, mais aussi permettre de la séparer en oxygène et hydrogène, du carburant pour fusée.\n\nCela pourrait prendre des mois ou des années pour obtenir les recherches nécessaires. Pendant ce temps, avec les fonds alloués à ce projet, nous construirons un dépôt en orbite lunaire pour faciliter l'accès à la Lune et le ravitaillement pour le retour sur Terre.\n\nTout cela est réalisable dans la prochaine décennie. Maintenant, il est temps de lancer."
 donald_trump.26.o1: "Lancer !"
 donald_trump.27.t: "Base lunaire Alpha"
 donald_trump.27.d: "Nos scientifiques et ingénieurs ont officiellement atterri sur la Lune et sont en train d'installer la base lunaire. Chaque section est divisée en « modules », pas tout à fait des bâtiments indépendants, mais pas non plus une seule structure. Il y a un module d'habitation pour le repos, un module alimentaire pour cultiver de la nourriture, un module de laboratoire, le plus grand avec la plupart des équipements scientifiques, un module de maintenance contenant tous les outils pour réparer en cas de panne, un module de commodités, car ces personnes sont là pour six mois et travailler toute la journée n'est pas bon pour l'esprit, et de nombreux panneaux solaires.\n\nLes livraisons de nourriture seront fréquentes au cours des premiers mois, le temps que la production alimentaire démarre. L'eau et l'oxygène seront obtenus grâce à la glace lunaire. Enfin, ces scientifiques resteront jusqu'à peu après le déplacement vers le prochain emplacement dans environ six mois, lorsque les panneaux solaires deviendront inutilisables en raison du jour et de la nuit lunaires qui durent six mois à cet endroit.\n\nLa base lunaire Alpha est achevée."
 donald_trump.27.o1: "Science !"
 donald_trump.28.t: "Progrès de la colonie"
 donald_trump.28.d: "Notre avant-poste scientifique sur la Lune a réalisé une percée majeure. Grâce à l'expansion de leur réseau de panneaux solaires et à des découvertes récentes facilitant la séparation de l'eau en oxygène et hydrogène, ils ont réussi à produire assez d'oxygène et d'hydrogène pour ravitailler complètement la dernière fusée de ravitaillement. Cette avancée cruciale permettra, avec suffisamment de temps et d'investissement, de faire de la Lune un hub pour les futures entreprises spatiales.\n\nL'espace devient plus accessible."
 donald_trump.28.o1: "Nous excellons en tant que pionniers"
 donald_trump.29.t: "Crise sur la Lune"
 donald_trump.29.d: "Des mesures drastiques doivent être prises immédiatement. Pour des raisons encore inconnues, le module d'habitation a rompu et « explosé ».\n\nIl y a une heure, les 12 scientifiques vaquaient à leurs tâches lorsque, soudain, une rupture massive s'est produite dans le module d'habitation.\n\nComme les ondes ne se propagent pas dans le vide, la plupart ne l'ont réalisé qu'en voyant physiquement ce qui s'était passé.\n\nUn fonds d'urgence fait partie du budget, donc il n'est pas nécessaire d'allouer plus de fonds au projet, et les scientifiques peuvent toujours dormir dans les autres modules isolés. Cependant, cet incident a effrayé beaucoup de monde, certains affirmant que peu, beaucoup, voire tous nos scientifiques auraient pu mourir, ce qui a également sapé le moral des scientifiques, car ils auraient pu perdre la vie. Ainsi, poursuivre l'avant-poste sur la Lune sera politiquement coûteux, et une rotation des scientifiques pourrait être nécessaire maintenant plutôt que plus tard, en raison de cette baisse de moral.\n\nQue devons-nous faire ?"
 donald_trump.29.o1: "Envoyer une aide d'urgence !"
 donald_trump.29.o2: "Abandonner le projet. Ce n'est pas pour nous"
 donald_trump.30.t: "La colonie progresse encore"
 donald_trump.30.d: "Our Moon outpost has made another major breakthrough. They have managed to ship Helium-3, a gas which seems perfect for fusion, to Earth, and scientists at home have figured out how to conduct fusion with it! Not only this, but the power generated from this fusion is near the amount used to do the reaction in the first place. This means that, with some improvements, this could result in successful fusion power! Not only does this allow immense benefits at home, along with knowledge we may be able to use in using other materials for fusion, we can use this on the Moon, allowing a permanent outpost rather than mobile outposts!\n\nAll of this is far ahead of schedule, which is a surprise, and many at NASA have been left unprepared to implement this into the current Moonbase. So, a new Moonbase is needed, in a much better spot for rapid expansion than the current location of Moonbase Alpha. It's time to start preparations on Moonbase Beta."
 donald_trump.30.o1: "La vie continue"
 donald_trump.31.t: "Nouvelle crise sur la Lune"
 donald_trump.31.d: "More drastic measures need to be taken now. Two more modules have ruptured. This time, it's both the Food and Amenities modules.\n\nRoughly forty minutes ago, a scientist was about to enter the Food module when it suddenly exploded. The scientist is fine, and no-one but the plants were harmed. However, it was adjacent to the Amenities module, and it caused it to rupture and explode. Again, no-one was hurt.\n\nThis new occurrence, however, has raised the hairs of many back home, questioning the safety of the modules. After the previous explosion, NASA replaced the modules, ensuring that they wouldn't explode, but it seems like prolonged pressure can cause something to break much more easily than it would otherwise. NASA has already quickly responded, ordering new modules be made immediately, as well as a close inspection of all current modules (As you can't \"recall\" modules from the Moon as of this moment).\n\nWith mounting pressure at home to stop going forward with the project until all safety concerns are resolved, the continuation of the Moonbase program comes into question. In addition to the political pushback, the emergency fund has been cut in half, so NASA is requesting another $5 billion to sort out future concerns. It remains your choice to decide whether to continue."
 donald_trump.31.o1: "Envoyer plus d'aide d'urgence !"
 donald_trump.31.o2: "Nous ne pouvons pas continuer comme ça"
 donald_trump.32.t: "Base lunaire Beta"
 donald_trump.32.d: "At this point, our scientists and engineers on the Moon need to move to another location on the poles. The costs for doing this are already established in the long-term budget, so we don't need to add any new funding to the project yet.\n\nWith this new moonbase, we will be able to use new discoveries we have uncovered to allow the base to be established permanently, unlike our previous moonbase. With the use of better rockets, better power generation, better ice extraction and separation, we can use this new base, at a site more suited for rapid expansion, to facilitate colonization efforts of the Moon. This is not the only good news, entrepreneurs and corporations are flooding to NASA en masse for requests to put their newly developed mining systems on the Moon. Even other space programs in other countries are now extremely interested in starting up scientific and mining outposts on the Moon, however, due to your diligent efforts, we not only have a massive head start, but we are the only country actively attempting to colonize the Moon.\n\nThe future on our Moon is bright and American."
 donald_trump.32.o1: "Hourra !"
 donald_trump_news.2.t: "Les États-Unis lancent une initiative d'extraction d'astéroïdes"
 donald_trump_news.2.d: "Earlier today the President of the United States announced the Asteroid Mining Initiative. This organization \"will seek to find an asteroid, bring it into the orbit of Earth, mine it, and send its resources back to the USA.\" Many doubt if this could ever be profitable, as the immense costs will consume much of NASA's budget, however, the President has voiced his wishes for private space companies to do some of the work. One particular favorite, SpaceX, was pointed out directly in his speech on the AMI, stating \"Smart people, and boy, do we have some smart people, like my good friend at SpaceX, Elon Musk, will be able to send their space mining equipment to the asteroid, mine it, and sell it for profit. It will be a tremendous business, believe me.\" There are serious concerns for asteroid mining, however the Administration has been dismissive of those concerns, instead focusing on the rewards of the project. Whether this is successful or not, only time will tell."
 donald_trump_news.2.o1: "L'espace !"
 donald_trump_news.2.o2: "Peut-être devrions-nous nous lancer là-dedans..."
 donald_trump_news.2.o3: "Intéressant"
 donald_trump_news.3.t: "Les États-Unis établissent des opérations d'extraction d'astéroïdes"
 donald_trump_news.3.d: "A large celebration was held in Florida today as shipments of platinum, gold, and silver reached the ground from space in a spectacular display. These materials are not from any normal mine, but from asteroids.  A few months ago, NASA caught a large asteroid heading on a course which would place itself nearby earth. A relatively slow asteroid, it was pulled into an elliptical orbit with Earth. Mining operations started as soon as it was in orbit. This news has been a surprise to the world, as it has been done far faster than expected. Many countries are now seeking to start their own asteroid mining programs to counteract the American monopoly. The United States does claim the entire asteroid. However, this claim can only be sparsely enforced as the asteroid is so large. Asteroid mining will likely become a lucrative industry, with many successes and failures. Who will dominate the asteroid, nonetheless, remains a mystery."
 donald_trump_news.3.o1: "Roches spatiales !"
 donald_trump_news.3.o2: "Nous devrions vraiment nous lancer là-dedans..."
 donald_trump_news.3.o3: "Intéressant"
 donald_trump_news.4.t: "La NASA planifie une mission habitée vers Mars"
 donald_trump_news.4.d: "La NASA a annoncé qu'elle enverra une mission habitée vers Mars d'ici trois ans. Cette annonce récente a enthousiasmé beaucoup de monde, et l'engouement pour l'espace est à son comble. Cette annonce fait suite aux tweets de Trump indiquant qu'il veut « des Américains dans l'espace à nouveau ». Elle suit également une augmentation du budget de la NASA pour fournir le capital nécessaire pour atteindre Mars. Tout semble progresser rapidement dans l'espace."
 donald_trump_news.4.o1: "Il faut y aller !"
 donald_trump_news.4.o2: "Excitant"
 donald_trump_news.5.t: "SpaceX annonce une course spatiale avec la NASA"
 donald_trump_news.5.d: "It appears that Elon Musk never wants to be out-done. Not long ago, Donald Trump announced his wishes for a manned mission to Mars with NASA to be done within two years. Elon Musk, today, has announced that he will also be getting to Mars, before NASA. This new \"Space race\" between the public NASA and private SpaceX, both American organizations, has people wondering: Who will prevail?\n\nElon Musk intends to use his new Starship and Super-Heavy booster to get people to Mars. This new rocket is huge, but not as big as NASA's Space Launch System. One can expect both organizations to go into overdrive as they race to bring humanity to the furthest reaches that humanity has ever gone before."
 donald_trump_news.5.o1: "Attendez, quoi !?"
 donald_trump_news.5.o2: "Public contre privé ? Il n'y a pas de compétition"
 donald_trump_news.5.o3: "Les Américains se concurrencent encore entre eux..."
 donald_trump_news.6.t: "La fusée de la NASA pour Mars explose au lancement !"
 donald_trump_news.6.d: "DERNIÈRE MINUTE : Après une phase de développement très rapide, le Système de Lancement Spatial a explosé sur la plateforme de lancement. Malgré les mesures de sécurité en place, les six membres d'équipage sont également décédés, ajoutant à cet échec déjà terrible.\n\nTrump a commenté la tragédie sur Twitter, déclarant : « Malgré les meilleurs efforts de nos merveilleux scientifiques et ingénieurs à la NASA, la nouvelle fusée a explosé sur la plateforme de lancement. Les normes de sécurité actuelles n'étaient pas suffisantes pour protéger les vies des six astronautes perdus ce jour-là. Nous poursuivrons nos efforts dans l'espace, mais avec beaucoup plus d'attention à la vie des Américains. »\n\nL'échec est attribué à..."
 donald_trump_news.6.o1: "Quelles étaient les chances ?"
 donald_trump_news.6.o2: "Peut-être ne pas précipiter les choses ?"
 donald_trump_news.7.t: "La NASA réussit une mission habitée sur Mars !"
 donald_trump_news.7.d: "Aujourd'hui, la NASA a posé sa capsule spatiale Orion sur Mars ! Six astronautes sont sortis du vaisseau pour explorer la surface martienne rouge. Une diffusion en direct (aussi directe que possible depuis Mars) a permis au public chez lui de suivre le processus. Tous acclament ce succès, tandis que beaucoup attendent ce qui se passera ensuite dans l'espace, que ce soit la colonisation de la Lune, une autre mission sur Mars, ou même la colonisation de Mars.\n\nL'avenir est maintenant."
 donald_trump_news.7.o1: "Hourra !"
 donald_trump_news.7.o2: "Les Américains ont besoin de leur espace, n'est-ce pas ?"
 donald_trump_news.8.t: "SpaceX pose une mission habitée sur Mars en premier !"
 donald_trump_news.8.d: "Dans une surprise choquante pour le monde, SpaceX, une entreprise spatiale privée dirigée par Elon Musk, a atterri sur Mars avant la NASA du gouvernement américain. L'enthousiasme pour SpaceX n'a jamais été aussi grand, et la popularité personnelle d'Elon Musk atteint des sommets. Ce succès a également impacté son autre entreprise, Tesla, qui a vu une légère augmentation des ventes et de son cours boursier.\n\nDonald Trump a commenté l'événement, félicitant Elon Musk et SpaceX pour leur réalisation, ajoutant que « cela montre que les entreprises privées peuvent faire mieux que le gouvernement ! » L'initiative de Trump pour l'espace a peut-être joué un rôle dans cet accès précoce à Mars, mais beaucoup disent que SpaceX, Blue Origin et la NASA avaient tous des ambitions pour Mars. Peu importe qui arrive en premier sur Mars, cela reste un bond énorme pour l'humanité."
 donald_trump_news.8.o1: "USA !"
 donald_trump_news.8.o2: "Les Américains ont encore gagné contre eux-mêmes..."
 donald_trump_news.9.t: "Les États-Unis lancent un avant-poste sur la Lune"
 donald_trump_news.9.d: "Earlier today, President Trump announced that the USA will seek to put outposts on the Moon to gather scientific data. This new development is not a surprise, however, as the President has been hinting at it for weeks. When asked at the White House press conference today about whether this will lead to colonization, Trump replied \"We might colonize the Moon, we might not. It depends really.\"\n\nMany are enthusiastic, some cite the mining potential of the Moon, some are simply excited for the prospect of living on the Moon. No matter who you are, this is an exciting time."
 donald_trump_news.9.o1: "Notre portée s'étend plus loin"
 donald_trump_news.9.o2: "Est-ce que ça compte comme de l'impérialisme ?"
 donald_trump_news.10.t: "Les États-Unis étendent leurs opérations sur la Lune"
 donald_trump_news.10.d: "Le temps de la base lunaire actuelle, la base lunaire Alpha, touche presque à sa fin. C'est ce qu'a récemment déclaré un communiqué de la NASA, avec des plans pour une base lunaire bien plus grande, nommée base lunaire Beta, pour accueillir des entreprises opportunistes ainsi que plus d'espace pour les scientifiques et ingénieurs menant des recherches. Elon Musk a déclaré sur Twitter à ce sujet : « La base lunaire Beta offrira tellement de nouvelles opportunités, non seulement pour SpaceX, mais pour l'humanité tout entière. » Un sondage réalisé aujourd'hui après l'annonce a révélé que 74 % des gens sont enthousiastes pour l'exploration et la colonisation spatiale. Peut-être est-ce pour cette raison que d'autres gouvernements envisagent maintenant leurs propres plans de bases lunaires."
 donald_trump_news.10.o1: "Progrès !"
 donald_trump_news.10.o2: "Quoi d'autre ? Les États-Unis de la Lune ?"
 donald_trump_news.11.t: "Les États-Unis abandonnent leur base lunaire"
 donald_trump_news.11.d: "After the US Moonbase suffered a crisis, having a module explode on the Moon, NASA decided to delay the program. The scientists sent to the Moon are being taken home until NASA fixes the safety issues with the modules."
 donald_trump_news.11.o1: "Ça n'en valait pas la peine"
 donald_trump_news.11.o2: "Si c'est trop cher pour les États-Unis, c'est trop cher pour nous"
 donald_trump_news.12.t: "Début de l'enquête sur la Russie"
 donald_trump_news.12.d: "Le FBI des États-Unis a ouvert une enquête pour déterminer si Donald Trump a collaboré avec la Russie pendant la campagne de 2016. Trump nie toute collusion, qualifiant cela de chasse aux sorcières, tandis que d'autres affirment que son ton conciliant envers la Russie prouve qu'il est une marionnette de la Russie. Quels que soient les résultats, cela aura des implications majeures pour les États-Unis à l'avenir."
 donald_trump_news.12.o1: "Délire de collusion !"
 donald_trump_news.12.o2: "Intéressant"
 USA_FOCUS.8.t: "Condamner les lancements de missiles iraniens"
 USA_FOCUS.8.d: "Les États-Unis nous pressent de condamner publiquement un lancement de missile iranien."
 USA_FOCUS.8.a: "Les condamner"
 USA_FOCUS.8.b: "Ce n'est pas notre problème"
 USA_FOCUS.9.t: "Frappe de missiles sur Shayrat"
 USA_FOCUS.9.d: "Les États-Unis ont lancé une frappe militaire jeudi sur une base aérienne du gouvernement syrien en réponse à une attaque à l'arme chimique qui a tué des dizaines de civils plus tôt dans la semaine. Sur ordre du président Donald Trump, des navires de guerre américains ont lancé 59 missiles de croisière Tomahawk sur la base aérienne qui abritait les avions ayant effectué les attaques chimiques, selon des responsables américains."
 USA_FOCUS.9.a: "Intéressant"
 USA_FOCUS.10.t: "Armer le Rojava"
 USA_FOCUS.10.d: "On May 9, 2017, the Trump Administration declared it was moving ahead with plans to support Kurdish rebels in northern Syria ahead of an assault on the city of Raqqa, ISIS's de facto capital in the country."
 USA_FOCUS.10.a: "Faites-le !"
 USA_FOCUS.10.b: "Let's rethink this"
 USA_FOCUS.1.t: "Les États-Unis déploient la brigade E en Europe de l'Est"
 USA_FOCUS.1.d1: "Les États-Unis ont déployé leurs forces armées en Pologne à la suite de la crise de Crimée. La brigade E de l'OTAN a été déployée en Pologne avec des troupes américaines, britanniques, croates et roumaines stationnées en cas d'urgence. C'est une décision intéressante étant donné la position précaire des pays de l'OTAN qui « entourent » effectivement la Russie avec leurs plans d'expansion.\nCela pourrait dissuader une future agression russe en Europe de l'Est contre ses voisins à l'avenir. Notre devoir est d'empêcher la Russie de nuire ou de faire pression sur nos alliés."
 USA_FOCUS.1.d2: "Les États-Unis ont déployé leurs forces armées en Pologne à la suite de la crise de Crimée. La brigade E de l'OTAN a été déployée en Pologne avec des troupes américaines, britanniques, croates et roumaines stationnées en cas d'urgence. C'est une décision intéressante étant donné la position précaire des pays de l'OTAN qui « entourent » effectivement la Russie avec leurs plans d'expansion.\nLes Américains jouent encore la carte du « Nous défendons nos alliés ». Pathétique."
 USA_FOCUS.1.d3: "The United States has deployed its Armed Forces to Poland in the wake of the Crimean crisis. The NATO E Brigade was deployed to Poland with American, British, Croatian and Romanian troops stationed in case of emergency. It is an interesting decision considering the precarious stance with NATO Countries 'effectively' surrounding Russia with their expansion plans.\nWhat could this boil into?"
 USA_FOCUS.1.a: "Nous devons défendre nos alliés"
 USA_FOCUS.1.b: "American Aggression Shouldn't Be Tolerated"
 USA_FOCUS.1.c: "Les États-Unis honorent leurs obligations"
 USA_FOCUS.1.d: "Intéressant"
 USA_FOCUS.1.e: "Plus en sécurité avec les États-Unis"
 USA_FOCUS.2.t: "Déployer la brigade E"
 USA_FOCUS.2.d: "Russia has recently seized the Crimea. The very thought threatens American interests and our NATO allies greatly. Poland and the Baltic states are in the most immediate danger and their positions should be reinforced. The E Brigade is composed of American, British, Croatian, and Romanian forces. The American and British forces comprise the majority of the ground forces, with a Croatian rocket artillery battery and a Romanian air defense artillery company.\n\nOur new defensive stature should curb the Russian aggression.\n"
 USA_FOCUS.2.a: "Déployer la brigade E"
 USA_FOCUS.3.t: "Les États-Unis déploient la brigade S à Ankara"
 USA_FOCUS.3.d1: "Turkey has continued to reaffirm its commitment to remaining in the North Atlantic Treaty Organization. The commitment to the alliance and the recent pressure coming from Iran, and Russia. Furthermore, strengthening the position of western forces and positions in the region.\n\nDeploying troops to the region will strengthen our mission in order to maintain the delicate balance of power in Europe and in the Middle East.\n"
 USA_FOCUS.3.d2: "Turkey has continued to reaffirm its commitment to remaining in the North Atlantic Treaty Organization. The commitment to the alliance and the recent pressure coming from Iran, and Russia. Furthermore, strengthening the position of western forces and positions in the region.\n\nThe Americans are deploying more troops to the region. We must watch this situation closely.\n"
 USA_FOCUS.3.d3: "Turkey has continued to reaffirm its commitment to remaining in the North Atlantic Treaty Organization. The commitment to the alliance and the recent pressure coming from Iran, and Russia. Furthermore, strengthening the position of western forces and positions in the region.\n\n"
 USA_FOCUS.3.a: "Better prepared than unprepared."
 USA_FOCUS.3.b: "Troubling News"
 USA_FOCUS.3.c: "Renforcer l'alliance"
 USA_FOCUS.3.d: "Espérons que ce ne soit pas un prélude à un conflit"
 USA_FOCUS.4.t: "Déployer la brigade S"
 USA_FOCUS.4.d: "The S Brigade in Ankara, Turkey will help reinforce our ally's position due to increasing tensions. Conflict in the Black Sea and in the Middle East has slowly required NATO to commit more to the region.\n\n It is time to deploy the S Brigade to Turkey to honor our obligation to support our ally.\n"
 USA_FOCUS.4.a: "Deploy the S Brigade"
 USA_Russia_Investigation.0.t: "Début de l'enquête sur la Russie"
 USA_Russia_Investigation.0.d: "Le directeur James B. Comey a confirmé pour la première fois que le FBI enquête sur une possible collusion entre la campagne de Trump et les autorités russes pendant la campagne électorale de 2016."
 USA_Russia_Investigation.0.a: "Oh oh"
 usa.7.o1_tt: "Petite chance que le raid sur §YElian Gonzalez§! puisse §Yéchouer§!\n"
 USA_not_total_support_tt: "Does Not Have Total Support of the §YSenate§! and §YHouse of Representatives§!"
