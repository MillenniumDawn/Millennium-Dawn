 MD_raid.18.t: "핵 최후통첩을 발하는 [FROM.GetName]"
 MD_raid.18.d: "[FROM.GetName] 정부는 자국 영토로의 진격이 계속되면 전면 핵 공격으로 맞서겠다고 경고했습니다. [FROM.capital.GetCapitalVictoryPointName]의 관리들은 이것이 허세가 아니라고 단언하며, 우리 군에는 핵 보복 가능성에 대비하라는 명령이 내려졌습니다."
 MD_raid.18.a: "감히 그러지 못할 것이다."