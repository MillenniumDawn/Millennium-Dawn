 Air_UAV1: "БПЛА 2005"
 Air_UAV1_desc: "Беспилотный летательный аппарат (БПЛА), обычно называемый дроном, беспилотной авиационной системой (БАС) или рядом других названий, представляет собой летательный аппарат без пилота-человека на борту. Полёт БПЛА может осуществляться с различной степенью автономности: либо под дистанционным управлением оператора-человека, либо полностью или периодически автономно, с помощью бортовых компьютеров."
 Air_UAV2: "БПЛА 2015"
 Air_UAV2_desc: "Беспилотный летательный аппарат (БПЛА), обычно называемый дроном, беспилотной авиационной системой (БАС) или рядом других названий, представляет собой летательный аппарат без пилота-человека на борту. Полёт БПЛА может осуществляться с различной степенью автономности: либо под дистанционным управлением оператора-человека, либо полностью или периодически автономно, с помощью бортовых компьютеров."
 Air_UAV3: "БПЛА 2025 года"
 Air_UAV3_desc: "Беспилотный летательный аппарат (БПЛА), обычно называемый дроном, беспилотной авиационной системой (БАС) или рядом других названий, представляет собой летательный аппарат без пилота-человека на борту. Полёт БПЛА может осуществляться с различной степенью автономности: либо под дистанционным управлением оператора-человека, либо полностью или периодически автономно, с помощью бортовых компьютеров."
 Air_UAV4: "БПЛА 2035 года"
 Air_UAV4_desc: "Беспилотный летательный аппарат (БПЛА), обычно называемый дроном, беспилотной авиационной системой (БАС) или рядом других названий, представляет собой летательный аппарат без пилота-человека на борту. Полёт БПЛА может осуществляться с различной степенью автономности: либо под дистанционным управлением оператора-человека, либо полностью или периодически автономно, с помощью бортовых компьютеров."
