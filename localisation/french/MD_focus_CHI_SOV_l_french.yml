l_french:
 CHI_SOV_treaty_good_neighbourliness: "Traité de bon voisinage sino-russe"
 CHI_SOV_treaty_good_neighbourliness_desc: "The Treaty of Good-Neighbourliness and Friendly Cooperation signed in 2001 established the legal foundation for modern China-Russia relations. Renewed political will to act on its provisions (mutual respect, non-interference, and consultation on major international questions) opens the door to a generation of bilateral projects that neither country could pursue in isolation."
 CHI_SOV_sco_framework: "Programme d’expansion de l’OCS"
 CHI_SOV_sco_framework_desc: "The Shanghai Cooperation Organisation was founded in 2001 by China and Russia as the successor to the Shanghai Five. Coordinating a joint expansion agenda (drawing in India, Pakistan, Iran, and eventually Central Asian states) transforms the SCO from a regional security forum into a genuine counterweight to Western multilateral institutions."
 CHI_SOV_turn_to_east: "Le pivot russe vers l'Est"
 CHI_SOV_turn_to_east_desc: "La politique du Tournant vers l'Est, accélérée après 2014 par les sanctions occidentales, réoriente le commerce, l'investissement et l'attention diplomatique russes vers la Chine et l'Asie-Pacifique. Formaliser cette réorientation dans des accords économiques de long terme signale à la bureaucratie et au monde des affaires moscovites que le marché occidental n'est plus le point de référence principal de la prospérité russe."
 CHI_SOV_bri_russia_corridor: "Corridor russe des Nouvelles routes de la soie"
 CHI_SOV_bri_russia_corridor_desc: "Le réseau ferroviaire de fret Chine-Europe fait déjà transiter l'essentiel de son tonnage terrestre par le territoire russe via le Transsibérien. Intégrer ce corridor au cadre des Nouvelles routes de la soie, avec un investissement chinois dans la modernisation ferroviaire russe et des procédures douanières simplifiées au passage Zabaykalsk-Manzhouli, ancre les deux économies dans une infrastructure logistique partagée."
 CHI_SOV_brics_coordination: "Bloc de coordination BRICS+"
 CHI_SOV_brics_coordination_desc: "BRICS (Brazil, Russia, India, China, South Africa) has evolved from a Goldman Sachs acronym into a functioning multilateral forum with its own New Development Bank and currency reserve arrangement. China and Russia driving a coordinated BRICS+ expansion, admitting Egypt, Ethiopia, Iran, and Saudi Arabia, creates a parallel economic architecture capable of challenging the IMF and World Bank as the default institutions of the Global South."
 CHI_SOV_sco_antiterror: "Centre régional antiterroriste de l'OCS"
 CHI_SOV_sco_antiterror_desc: "The Regional Anti-Terrorist Structure, RATS, is the SCO's dedicated counterterrorism body headquartered in Tashkent. Joint China-Russia expansion of RATS capabilities (intelligence sharing, rapid response coordination, and joint training exercises) extends the reach of Eurasian security cooperation into Central Asia and the Caucasus, countering both jihadist networks and the covert influence operations of outside powers."
 CHI_SOV_no_limits_partnership: "Partenariat stratégique sans limites"
 CHI_SOV_no_limits_partnership_desc: "The joint statement issued during Vladimir Putin's visit to Beijing in February 2022 declared a friendship with no limits and a cooperation that has no forbidden zones. The declaration placed the bilateral relationship above the level of any formal alliance while stopping short of a mutual defense treaty, signaling to Washington and Brussels that Beijing and Moscow regard their strategic alignment as a permanent feature of the international order."
 CHI_SOV_yuan_ruble_settlement: "Mécanisme de règlement Yuan-Rouble"
 CHI_SOV_yuan_ruble_settlement_desc: "La Chine et la Russie ont accéléré le basculement hors du commerce libellé en dollars, la part du yuan dans les règlements d'exportations russes ayant fortement augmenté après que les sanctions de 2022 ont gelé l'accès russe à SWIFT. Établir un mécanisme formel de compensation bilatérale entre la Banque populaire de Chine et la Banque de Russie crée une infrastructure financière parallèle qui isole les deux économies de la pression des sanctions secondaires."
 CHI_SOV_agricultural_corridor: "Corridor d'exportation agricole du Primorié"
 CHI_SOV_agricultural_corridor_desc: "L'Extrême-Orient russe et les régions sibériennes détiennent certaines des plus grandes réserves de terres arables du monde, en grande partie sous-utilisées faute de peuplement et d'accès au marché. Le corridor agricole du Primorié dirige les céréales, le soja et les oléagineux russes par des passages frontaliers dédiés vers les provinces du nord-est chinois, offrant à Harbin et Shenyang une chaîne d'approvisionnement alimentaire sûre, indépendante des marchés mondiaux de matières premières."
 CHI_SOV_russian_far_east_zone: "Port franc d'Extrême-Orient russe"
 CHI_SOV_russian_far_east_zone_desc: "Le statut de port franc de Vladivostok, accordé par la Russie en 2015, visait spécifiquement à attirer l'investissement chinois et japonais dans l'Extrême-Orient russe sous-développé. Les entreprises d'État chinoises investissant dans les installations portuaires, l'entreposage frigorifique et l'industrie légère de la zone économique franche de Vladivostok créent un ancrage commercial qui verrouille le tournant oriental de la Russie et offre à la Chine un hub logistique pacifique hors de ses propres frontières."
 CHI_SOV_zarubino_port: "Accord du port Pacifique de Zarubino"
 CHI_SOV_zarubino_port_desc: "Le terminal de vrac de Zarubino sur la côte pacifique russe, près du tripoint Russie-Chine-Corée du Nord, est proposé comme projet de développement conjoint depuis les années 1990. L'investissement chinois pour élargir la capacité céréalière et conteneurs de Zarubino donne aux exportateurs chinois du Jilin leur plus court accès aux routes maritimes du Pacifique, tout en fournissant à la Russie des capitaux chinois pour des infrastructures que Moscou ne peut financer seule."
 CHI_SOV_trans_siberian_freight: "Expansion du fret transsibérien"
 CHI_SOV_trans_siberian_freight_desc: "Le corridor du Transsibérien assure des dizaines de milliers de trajets de conteneurs de fret entre la Chine et l'Europe chaque année, avec des temps de transit de 12 à 15 jours contre 30 par mer. Un investissement conjoint sino-russe dans l'électrification des voies, le doublement des sections goulots d'étranglement et un dédouanement numérique intégré ramène le transit sous 10 jours et triple le débit, faisant du Transsibérien une véritable alternative au canal de Suez pour le fret premium."
 CHI_SOV_timber_mineral_trade: "Exportations sibériennes de bois et de minerais"
 CHI_SOV_timber_mineral_trade_desc: "La Sibérie détient les plus grandes réserves de bois boréal du monde et d'énormes gisements de cuivre, nickel, or et terres rares. Les entreprises de transformation chinoises ont établi une position dominante dans l'achat de bois sibérien, tandis que Norilsk Nickel et Polyus Gold exportent la majeure partie de leur production vers des raffineries chinoises. Formaliser ces flux de matières premières en accords d'enlèvement de long terme verrouille les positions des deux pays dans les chaînes d'approvisionnement mondiales en ressources."
 CHI_SOV_arctic_lng: "Contrats de prélèvement de GNL Yamal"
 CHI_SOV_arctic_lng_desc: "The Yamal LNG project on Russia's Yamal Peninsula, developed by Novatek, counts CNPC and the Silk Road Fund among its major shareholders. Chinese LNG carriers, purpose-built ice-class vessels, collect cargoes from Sabetta port year-round. Long-term offtake contracts with CNOOC and CNPC secure China's LNG supply while providing Novatek with the Chinese financing that Western sanctions have cut off."
 CHI_SOV_power_of_siberia_2: "Gazoduc Force de Sibérie 2"
 CHI_SOV_power_of_siberia_2_desc: "Force de Sibérie 2 est proposé pour transporter le gaz des mêmes champs de Sibérie occidentale qui alimentent l'Europe, via la Mongolie vers le nord de la Chine. Avec une capacité de 50 milliards de mètres cubes par an, il ferait de la Chine le premier client gazier de la Russie, et de loin, et donnerait à Gazprom un contrat d'ancrage pour justifier de continuer à investir dans des champs qui risqueraient autrement d'être abandonnés."
 CHI_SOV_tianwan_nuclear: "Agrandissement de la centrale nucléaire de Tianwan"
 CHI_SOV_tianwan_nuclear_desc: "La centrale nucléaire de Tianwan à Lianyungang, construite par Rosatom sous une série de contrats signés à partir de 1997, est le plus grand projet de coopération technique russo-chinoise de l'histoire. Les unités 7 et 8, signées en 2021, prolongent le partenariat jusque dans les années 2030. Chaque unité Rosatom construite en Chine transfère des connaissances de conception de réacteur, des contrats d'approvisionnement en combustible et des relations de maintenance qui lient les deux industries nucléaires pour des décennies."
 CHI_SOV_huawei_russia: "Déploiement de Huawei 5G en Russie"
 CHI_SOV_huawei_russia_desc: "Huawei a signé des accords 5G avec des opérateurs télécoms russes dont MTS, MegaFon et Rostelecom en 2019-2020. Les fournisseurs 5G occidentaux étant exclus de Russie par préférence d'achat puis par sanctions, la domination de Huawei sur le déploiement 5G russe est essentiellement incontestée. L'infrastructure 5G chinoise ancrée dans le backbone des communications russes crée une dépendance technique qui approfondit la relation bilatérale au niveau des infrastructures nationales critiques."
 CHI_SOV_beidou_glonass: "Accord de navigation BeiDou-GLONASS"
 CHI_SOV_beidou_glonass_desc: "Le BeiDou chinois et le GLONASS russe sont les seuls deux systèmes de navigation par satellite indépendants du réseau GPS américain. Un accord d'interopérabilité signé entre les autorités d'exploitation des deux systèmes en 2015 permet aux récepteurs civils et militaires d'utiliser simultanément les signaux des deux constellations, améliorant la précision de position et, de façon critique, offrant aux deux pays une infrastructure de navigation redondante que le brouillage américain ou les interférences orbitales ne peuvent dégrader."
 CHI_SOV_polar_silk_road: "Initiative de la Route de la soie polaire"
 CHI_SOV_polar_silk_road_desc: "China's Arctic strategy document, published in 2018, designated the Northern Sea Route as the Polar Silk Road, a third corridor of the Belt and Road alongside the land routes through Central Asia and the maritime route through the Indian Ocean. Chinese investment in Arctic shipping infrastructure, icebreaker construction in Chinese yards, and port facilities along the NSR transforms a seasonal Russian route into a year-round international shipping lane controlled by Sino-Russian joint ventures."
 CHI_SOV_northern_sea_route: "Commercialisation de la route maritime du Nord"
 CHI_SOV_northern_sea_route_desc: "La Route maritime du Nord, longeant le littoral arctique russe du détroit de Béring à la mer de Kara, réduit d'environ 30 % la distance entre Shanghai et Hambourg par rapport à la route du canal de Suez. La fonte de la glace de mer arctique allonge la saison navigable. Un investissement conjoint sino-russe dans la capacité d'escorte par brise-glaces, les infrastructures de sauvetage d'urgence le long de la route et des porte-conteneurs dédiés de classe glace transforme la RMN d'une option saisonnière de niche en une alternative viable toute l'année pour le fret à haute valeur."
 CHI_SOV_rosatom_export: "Paquet d'exportation Rosatom"
 CHI_SOV_rosatom_export_desc: "Rosatom is the world's largest nuclear energy company by international reactor orders, with over 30 units under construction or contracted abroad. Its VVER reactor design, fuel supply chain, and long-term service contracts are the primary vehicle through which Russia projects economic and technical influence. A dedicated export package for Chinese buyers (incorporating VVER-1200 units, mixed-oxide fuel supply, and joint training for Chinese nuclear engineers) embeds Russian nuclear technology into China's civilian energy infrastructure for a generation."
 CHI_SOV_space_station: "Station internationale de recherche lunaire"
 CHI_SOV_space_station_desc: "La Station internationale de recherche lunaire, annoncée conjointement par la CNSA chinoise et Roscosmos en 2021, est le projet scientifique bilatéral le plus ambitieux depuis le programme spatial soviétique. L'ILRS envisage une installation de recherche permanente robotique puis habitée près du pôle sud lunaire, conçue explicitement comme alternative au programme Artemis de la NASA et ouverte à la participation de pays tiers. Son développement conjoint lie les deux programmes spatiaux dans une architecture partagée pour la génération à venir d'exploration de l'espace lointain."
 CHI_SOV_peace_mission: "Exercices conjoints de la mission de paix"
 CHI_SOV_peace_mission_desc: "Peace Mission est la série d'exercices militaires conjoints de l'OCS, tenue chaque année depuis 2005 et tournant entre les États membres. Les forces chinoises et russes ont participé à chaque itération, les exercices s'élargissant des scénarios antiterroristes à des manœuvres interarmes impliquant des formations blindées, l'appui aérien rapproché et la coordination de commandement au niveau du corps d'armée. La série d'exercices est devenue le principal lieu de développement de l'interopérabilité APL-armée russe hors opérations combinées réelles."
 CHI_SOV_advanced_arms_sales: "Paquet d'exportation Su-35 et S-400"
 CHI_SOV_advanced_arms_sales_desc: "L'acquisition par la Chine de 24 chasseurs polyvalents Soukhoï Su-35 en 2015 et d'un lot de bataillon de missiles sol-air S-400 Triumf en 2018 a représenté les exportations d'armes russes vers la Chine les plus importantes depuis l'accord Su-27 des années 1990. Les ventes ont transféré une expérience opérationnelle d'appareils de génération 4+ et de défense aérienne intégrée à longue portée que l'industrie chinoise n'avait pas encore égalée, tout en offrant à Rosoboronexport un client premium au moment où son marché occidental se fermait."
 CHI_SOV_pacific_fleet_coord: "Accord de coordination de la flotte du Pacifique"
 CHI_SOV_pacific_fleet_coord_desc: "La marine de l'APL et la flotte du Pacifique russe mènent des exercices navals coordonnés en mer du Japon, en mer de Chine orientale et dans le Pacifique occidental depuis 2012. Des patrouilles conjointes dans les eaux adjacentes au Japon et à la péninsule coréenne démontrent une présence combinée qu'aucune des deux marines ne pourrait soutenir seule et envoient un signal délibéré au commandement américain du Pacifique sur le coût de toute confrontation avec l'une ou l'autre puissance dans ses eaux d'origine."
 CHI_SOV_defense_industrial: "Intégration de la base industrielle de défense"
 CHI_SOV_defense_industrial_desc: "Chinese state defense enterprises have moved beyond simply importing Russian platforms toward licensed production and reverse-engineering. Joint ventures in aero-engine development, the area where China's own industry remains furthest behind, are the most strategically significant. Chinese access to Russian turbofan technology for the WS-15 and WS-20 engines closes the gap with Western air forces at a fraction of the cost of independent development, while Russian enterprises gain Chinese manufacturing scale."
 CHI_SOV_strategic_bomber_patrol: "Patrouilles conjointes de bombardiers stratégiques"
 CHI_SOV_strategic_bomber_patrol_desc: "En 2019 et 2023, des bombardiers stratégiques russes Tu-95MS Bear et chinois H-6K ont effectué des patrouilles coordonnées au-dessus de la mer du Japon et de la mer de Chine orientale, déclenchant des décollages d'alerte japonais et sud-coréens. Les patrouilles ne sont pas des opérations conjointes au sens militaire technique mais démontrent un usage synchronisé de la puissance aérienne stratégique qui signale la volonté des deux pays de coordonner la pression sur des adversaires partagés. Des corridors de patrouille conjoints réguliers approfondissent la familiarité au niveau des équipages et des normes procédurales partagées."
 CHI_SOV_vostok_exercises: "Exercices stratégiques Vostok"
 CHI_SOV_vostok_exercises_desc: "Vostok is Russia's strategic-level military exercise series, traditionally focused on large-scale conventional conflict in the Russian Far East. Chinese forces participated in Vostok-2018 and again in Vostok-2022, the latter occurring months after the start of the Ukraine war. Chinese involvement upgrades the exercises from a national rehearsal into a bilateral combined-arms demonstration, with PLA ground and aviation elements integrating into Russian divisional command structures."
 CHI_SOV_military_space: "Programme spatial militaire conjoint"
 CHI_SOV_military_space_desc: "Both China and Russia have developed dedicated military space capabilities: anti-satellite weapons, satellite navigation jamming, electronic intelligence satellites, and space-based early warning systems. A joint program coordinating satellite orbital slots, data-sharing protocols, and combined space situational awareness provides both countries with a more comprehensive picture of US and allied space operations than either could achieve independently, while reducing the risk of collision or escalation between their own orbital assets."
 SOV_chi_rare_earth_supply: "Composants chinois de terres rares"
 SOV_chi_rare_earth_supply_desc: "La Chine contrôle plus de 80 % de la capacité mondiale de raffinage des terres rares, y compris les composés de néodyme, lanthane et dysprosium essentiels aux systèmes de guidage de précision, à l'optique de vision nocturne et aux moteurs électriques haute performance. Formaliser la relation d'approvisionnement dans le cadre de la coopération industrielle de défense donne à Uralvagonzavod un accès garanti aux terres rares transformées en Chine, réduisant les coûts de composants et améliorant la constance de qualité sur les chaînes T-90 et Armata."
 CHI_sov_flanker_expertise: "Expertise en matière de génération de flancs"
 CHI_sov_flanker_expertise_desc: "La production sous licence par Shenyang Aircraft Corporation de la famille Flanker Su-27, couvrant les variantes J-11, J-15 et J-16, en a fait le constructeur le plus expérimenté au monde d'appareils de combat d'ascendance russe hors de Russie. Le contrat d'exportation Su-35 approfondit cette relation en donnant accès au moteur AL-41F1S, à l'architecture radar Irbis-E et à des raffinements aérodynamiques qui informent les programmes de nouvelle génération de Shenyang. Les appareils sortant de la chaîne de Shenyang portent des gains de performance mesurables provenant directement de la collaboration avec le bureau d'études Soukhoï."
 CHI_SOV_military_tech_idea: "Transfert de technologies de défense russes"
 CHI_SOV_shared_modifier: "Alignement stratégique sino-russe"
 CHI_SOV_shared_modifier_desc: "Un ensemble d'engagements bilatéraux entrelacés entre Pékin et Moscou qui ajuste l'économie et l'armée chinoises selon la profondeur de la coopération sino-russe. Des liens plus étroits élargissent la latitude politique, la production agricole et de ressources, la portée navale et la capacité industrielle civile, tandis qu'approfondir le partenariat augmente la bienveillance commerciale et resserre la sécurité frontalière. Le modificateur évolue avec chaque grand accord ratifié entre les deux puissances."