 PER_davoud_minister_bio: "다부드 헤르미다스바반드는 1934년 11월 10일 테헤란에서 태어났습니다. 1957년 테헤란 대학교에서 법학 및 정치학 학사 학위를 받은 뒤 정치학자이자 외교관이 되었습니다. 그는 이란 민족 전선의 지도부 위원회에 속해 대변인을 맡았습니다. 헤르미다스바반드는 이란의 국제연합 대표단에서도 근무하였습니다. 1979년에는 인질 억류 방지 국제 협약 초안을 작성하는 임시 위원회의 부위원장을 지냈습니다."
 PER_seyed_hassan_minister_bio: "1948년 11월 28일 이란 사브제바르에서 태어난 세예드 하산 아민은 17세에 테헤란 대학교에 입학하여 법학 학사 학위를 우수한 성적으로 취득하였습니다. 이란에서의 법학 공부 덕분에 아민은 변호사협회 규정에 따라 사무변호사 밑에서 시험과 실무 수습을 시작하였습니다. 이로 인해 그는 훗날 글래스고 칼레도니안 대학교의 전임 교수로 승진하였습니다."
 PER_hashem_sabbaghian_minister_bio: "1937년 4월 4일에 태어난 하셈 사바기안은 이란의 정치인이자 인도주의자, 민주주의 활동가, 의회 의원이 되었습니다. 1979년 혁명 중에는 메흐디 바자르간의 임명으로 임시 정부의 내무부 장관에 임명되었습니다. 이후 1980년 의회에 입성하였습니다. 1996년에는 헌법수호위원회에 의해 재출마가 거부되었습니다. 사바기안은 이후 이란 자유 운동에 참여하여 에브라힘 야즈디의 부관을 지냈습니다."
 PER_hedayatollah_matin_minister_bio: "1933년 테헤란에서 태어난 헤다야톨라는 모하마드 모사데크의 손자이자 정치적 후계자였습니다. 마틴다프타리는 샤 치하에서 인권 변호사로 활동했으며, 그를 몰아낸 혁명에서 적극적인 역할을 하였습니다. 이후 그는 다수의 독립적인 이란 사회주의자들이 모인 민족 민주 전선을 결성하였습니다. 마틴은 또한 이란 내 다양한 정치적 사건에 관한 여러 다큐멘터리를 진행하고 출연하기도 하였습니다."
 PER_mohammad_tavasoli_minister_bio: "1938년 5월 15일에 태어난 모하마드 타바솔리호자티는 이란의 민주주의 활동가가 되었고, 이후 이란 자유 운동당 정치국의 국장이 되었습니다. 그는 교통과 운송을 공부하기 위해 독일로 건너갔으며, 1971년 이란으로 돌아오자 MEK의 한 일원을 도운 혐의로 체포되어 1년간 투옥되었습니다. 혁명 이후 그는 1980년 테헤란 시장이 되었으나, 1983년 이슬람 공화국에 의해 하셈 사바기안과 함께 체포되었습니다."
 PER_mostafa_tajzade_minister_bio: "1956년 11월 22일에 태어난 세예드 모스타파 타즈자데는 공부하기 위해 미국으로 건너가 샤에 맞서 활발히 활동하던 무슬림 학생 협회의 회원이 되었습니다. 그는 이란 언론인 협회에도 소속되어 있었습니다. 그는 하타미의 고문이 되었고, 타즈자데는 이란 대통령 선거에 개입한 IRGC를 상대로 소송을 제기한 일곱 명의 개혁주의자 중 한 명이었습니다. 경력 후반에 그는 에빈 교도소에서 수년간 복역하였고, 다른 요인들과 더불어 정권에 대한 선전 혐의로 기소되었습니다."
 PER_mostafa_moein_minister_bio: "1951년 4월 1일 이스파한 나자파바드에서 태어난 모이엔은 이란의 정치인이자 소아과 교수이며 인권 활동가입니다. 그는 이란 인권 및 민주주의 전선을 결성했으며 이후 대통령 후보로도 나섰습니다. 그는 후에 과학연구기술부 장관이 되었으나 1999년 이란 학생 시위 이후 사임하였고, 경력 후반에도 헌법수호위원회에 자신의 부처를 더 높은 과학적 생산성을 지향하는 방향으로 이끌도록 설득하는 데 실패한 뒤 다시 사임하였습니다."
 PER_ali_khavari_minister_bio: "알리 하바리는 이란의 카자르 왕조 치하인 1923년 3월 22일 마슈하드에서 태어났습니다. 영국과 소련의 이란 침공 이후 이어진 정치적 불안 속에서 하바리는 이란 공산주의자가 되어 1941년 투데당에 입당하였습니다. 그는 1960년대 초 중앙위원회에 선출되었습니다. 1979년 혁명 중에는 정치위원회에 선출되었고, 이후 투데당의 서기장이 되었습니다."
 PER_hashem_aghajari_minister_bio: "1957년 이란 아바단에서 태어난 아가자리는 이란의 역사학자이자 대학 교수이며 이슬람 공화국의 비판자가 되었습니다. 그가 이란인들에게 이슬람 성직자를 맹목적으로 따르지 말라고 말한 것이 '배교' 혐의로 이어져, 정권에 맞선 그의 활동은 그에게 사형 선고를 안겼습니다. 아가자리는 '이슬람 개신교'를 주창하였으며, 이로 인해 많은 성직자가 그가 이슬람과 예언자를 공격하였다고 주장하며 분노하였습니다."
 PER_mohsen_makhmalbaf_minister_bio: "1957년 5월 29일 테헤란에서 태어난 마흐말바프는 1979년부터 1980년까지 이슬람 혁명 무자헤딘 조직의 좌파 분파에 속해 있었습니다. 마흐말바프는 영화계에 몸담아 이후 영화 편집자, 감독, 작가, 제작자가 되었습니다. 15세에 그는 모하마드 레자 팔레비에 맞서 싸우는 무장 단체에 가담하였습니다. 그는 경찰관을 칼로 찔러 살해하여 체포되고 사형을 선고받았으나, 이슬람 혁명 중에 석방되었습니다. 그는 이후 강경파의 승리 이후 이란을 떠났습니다."
 PER_abdolali_bazargan_minister_bio: "1943년 8월 14일 이란 테헤란에서 태어난 압돌알리 바자르간은 이란의 자유주의 정치인이자 작가이며 이란 자유 운동의 부대표가 되었습니다. 그는 1961년 민족 전선에 가입했으나 1963년 탈퇴하여 아버지의 정당인 이란 자유 운동에 합류하였습니다. 그의 아버지는 샤와 샤푸르 바흐티아르를 몰아낸 1979년 혁명 이후 이란의 초대 총리가 된 메흐디 바자르간입니다."
 PER_amir_etemadi_minister_bio: "1981년 11월에 태어난 아미르 에테마디는 이란의 활동가이자 이란 자유주의 학생 및 졸업생 모임의 대변인이 되었습니다. 그는 1999년 테헤란 대학교에 입학할 무렵 정치 활동을 시작했으며, 마침내 이슬람 공화국에 매우 비판적인 최초의 학생 신문을 창간하였습니다. 이러한 활동으로 인해 그는 훗날 '국가 안보에 반하는 행위'와 '공공질서 교란' 혐의로 에빈 교도소에 수년간 수감되었습니다."
 PER_hassan_shariatmadari_minister_bio: "1947년 5월 26일 이란 타브리즈에서 태어난 샤리아트마다리는 매우 강력한 성직자였던 아야톨라 세예드 카젬 샤리아트마다리의 아들이었습니다. 그는 샤의 권한을 1906년 헌법으로 제한하고 성직자를 이란 정치에서 배제하려는 아버지를 지지하였습니다. 1979년 혁명 중 샤리아트마다리는 이란 인민 공화당을 공동 창당했으며 정교분리의 확고한 신봉자입니다. 이 때문에 그의 정당은 호메이니에 맞서 봉기할 100만 명 이상의 사람들을 동원할 수 있었습니다."
 PER_roozbeh_farahinpour_minister_bio: "1971년 7월 16일 이란 테헤란에서 태어난 파라하니푸르는 아자드 대학교의 법학과 학생이었으며, 학생 활동가가 되어 '영광의 국경당' 또는 '마르제 포르 고하르'를 창당하였습니다. 이 정당은 이슬람 공화국의 전복을 주창하고 세속 공화국을 요구합니다. 파라하니푸르는 1999년 7월 봉기에서의 역할로 체포되어 잔혹하게 고문당했고, 그 결과 망명을 구하기 위해 미국으로 피신하였습니다."
 PER_abulqasem_porhashmi_minister_bio: "1920년대 후반 어느 무렵에 태어난 포르하시미는 열렬한 이란 민족주의자였습니다. 이는 그가 뜻이 맞는 사람들을 만나게 했고, 그는 이란두스트 학생 협회를 결성하는 데 일조하였습니다. 1941년 8월 영국과 소련의 이란 침공 당시 그는 친구들과 함께 십대의 나이로 맞서 싸웠으며 이란 저항 운동의 적극적인 일원이었습니다. 이후 그는 범이란주의 학파의 창립을 지지하였고 마침내 범이란주의당의 일원이 되었습니다."
 PER_alireza_kiani_minister_bio: "1984년 12월 19일 마잔다란 폴에세피드에서 태어난 키아니는 정치학 석사 과정을 밟았습니다. 그는 여러 정치 조직에 가입했으며 그중 한 곳에서는 정치 위원장이 되었습니다. 정치 활동으로 인해 그는 이란 보안군에 의해 여러 차례 체포되어 심문을 받았고, 결국 자신의 안전을 위해 미국으로 피신해야 했습니다. 결국 그는 팔레비 왕조의 온건한 지지자가 되어 입헌 군주제를 지지하게 되었습니다."
 PER_farhad_baghnani_minister_bio: "파르하드 바그바니는 언론인이자 연구자로서 범이란주의당에 입당하였습니다. 그는 이란을 '국민은 있으나 정부는 없는' 나라로 봅니다. 그의 다양한 활동으로 인해 그는 이슬람 공화국에 의해 체포되어 투옥되었고, 범이란주의당 내에서의 경력 후반에 바그바니는 당의 '쿠제스탄 청년 애국자' 분파에 가담하였습니다."
 PER_foad_pashei_minister_bio: "잠시드 아무제가르는 1923년 6월 25일에 태어났습니다. 그는 테헤란 대학교에서 법학과 공학 학위를 모두 취득한 뒤 코넬 대학교에 진학하여 박사 학위를 받았습니다. 아무제가르는 이란 보건부의 차관이 되었으며 마침내 1977년에는 이란의 제43대 총리가 되었습니다. 총리 재임 중 그는 '라스타히즈' 즉 '부흥'당의 지도자이기도 했습니다. 아무제가르는 사우디아라비아와 쿠웨이트 정부의 고문으로도 활동하였습니다."
 PER_hamed_sheibanyard_minister_bio: "1959년 이란 테헤란에서 태어난 타기 라흐마니는 이란의 현대 지식인이자 종교적 지성주의와 이성에 관한 여러 저서의 저자가 되었습니다. 종교적 민족주의자라는 그의 이념은 종종 그를 이슬람 공화국과 대립하게 만들었으며, 이슬람 공화국 치하에서 라흐마니는 총 5,000일을 감옥에서 보냈습니다. 그는 또한 여러 개혁주의자가 대통령 선거 운동을 준비하고 조직하는 것을 도왔습니다."
 PER_reza_pirzadeh_minister_bio: "1928년 10월 16일에 태어난 아르데시르 자헤디는 이란 제국 치하의 이란 정치인으로, 1966년부터 1971년까지 외무부 장관을 지냈습니다. 그는 1953년 모사데크를 쿠데타로 권좌에서 몰아낸 군 장성 파즐롤라 자헤디의 아들이었습니다. 1979년 혁명 이후에도 그는 워싱턴 주재 대사로 있었으나, 호메이니가 권력을 잡자 사임하였습니다."
