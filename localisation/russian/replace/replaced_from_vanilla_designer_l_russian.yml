 DESIGNER_COMBATWIDTH_TOOLTIP: "Ширина фронта: §Y$VALUE|0$§!\n\nШирина фронта показывает, сколько места бригада займёт в бою.\nНапример, если общая ширина боя — §Y80§!, в него поместятся §Y4§! бригады шириной §Y20§!"
 DESIGNER_COMBATWIDTH_DESC: "Ширина фронта показывает, сколько места бригада займёт в бою.\nНапример, если общая ширина боя — §Y80§!, в него поместятся §Y4§! бригады шириной §Y20§!"
