 EQ_MOD_CAT_plane_light_quadcopter_TITLE: "쿼드콥터 엔진"
 EQ_MOD_CAT_plane_stealth_weapons_TITLE: "내부 공대공 무기"
 EQ_MOD_CAT_plane_stealth_cas_weapons_TITLE: "내부 근접 항공 지원 무기"
 EQ_MOD_CAT_plane_stealth_mr_weapons_TITLE: "내부 다목적 무기"
 EQ_MOD_CAT_plane_drone_hand_grenade_TITLE: "드론 수류탄"
 EQ_MOD_CAT_plane_bomb_bay_stealth_TITLE: "스텔스 폭탄창"
 engine_light_quadcopter: "쿼드콥터 엔진 구성"
 engine_light_quadcopter_desc: "가볍고 작은 드론을 위해 설계된 4발 엔진 시스템입니다. 단거리 비행이 가능하며 몇 개의 수류탄을 싣고 가서 터뜨릴 수 있습니다."
 internal_weapons_3: "최첨단 내부 무기"
 internal_weapons_3_desc: "내부 무장창의 크기 제한 때문에 많은 양의 무장을 탑재할 수 없다는 전투기 조종사들의 불만에 따라, 설계자들은 탑재 능력을 더욱 높이기 위해 무장창을 더 크게 만들고자 노력했습니다."
 weap_drone_hand_grenade: "드론 투하 수류탄"
 weap_drone_hand_grenade_desc: "원격 투하 장치가 달린 수류탄으로, 쿼드콥터 드론 체계를 통해 목표에 투하하도록 설계되었습니다."
 avionics_drone_quadcopter: "쿼드콥터 드론 체계"
 avionics_drone_quadcopter_desc: "흔히 볼 수 있는 월마트 드론을 더 공격적인 용도로 개조한 것입니다."
 wing_quadcopter: "쿼드콥터 구조"
 wing_quadcopter_desc: "대량으로 사용할 극도로 저렴하고 신뢰성 높은 드론을 만드는 데 쓰이는 드론 설계입니다."
 weap_int_ag_strat_2: "내부 폭탄창"
 weap_int_ag_strat_2_desc: "내부 폭탄창은 항공기의 스텔스 능력을 높이면서도 일정량의 폭장을 탑재할 수 있게 합니다.\n\n§G설계 힌트: 이 모듈을 사용하면 스텔스 폭격기를 만들 수 있으며, 레이더 우위를 높이면서도 전략 폭격 능력을 갖출 수 있습니다.§!\n\n§W이를 주무장으로 사용하면 다음이 만들어집니다:§! §B전략 폭격기§!"
 weap_int_mp_light_hardpoint_2: "1세대 내부 경량 하드포인트"
 weap_int_mp_light_hardpoint_2_desc: "내부 경량 하드포인트는 항공기가 내부 격납고에 혼합 무장을 탑재할 수 있게 하여 스텔스 능력을 높입니다. 이 하드포인트는 저렴하며, 경항공기에 일부 무기를 장비하거나 다른 항공기의 무장을 보충하기 위한 것입니다. 이 하드포인트에는 단거리 공대공 미사일, 250-500파운드 폭탄, 로켓 포드가 장비됩니다.\n\n§G설계 힌트: 이 하드포인트는 국가가 경무장 능력을 갖춘 스텔스 항공기를 제작할 수 있게 하며, 예산이 제한된 국가에 안성맞춤입니다.§!\n\n§W이를 주무장으로 사용하면 다음이 만들어집니다:§! §B다목적 전투기§!\n\n§R경고: 함재 다목적 전투기는 해전 중 적 함선만 공격합니다§!"
 weap_int_mp_light_hardpoint_3: "2세대 내부 경량 하드포인트"
 weap_int_mp_light_hardpoint_3_desc: "$weap_int_mp_light_hardpoint_2_desc$"
 weap_int_mp_light_hardpoint_4: "3세대 내부 경량 하드포인트"
 weap_int_mp_light_hardpoint_4_desc: "$weap_int_mp_light_hardpoint_2_desc$"
 weap_int_a2a_hardpoint_1: "1세대 내장 공대공 무장장착소"
 weap_int_a2a_hardpoint_1_desc: "Internal Air-to-Air weapons offer better stealth characteristics, but at the expense of less ordnance, potentially with a less powerful warhead.\n\n§GDesigner Hint: Internal Air-to-Air hardpoints are primarily designed for stealth air superiority aircraft. You will get radar advantage buffs, while also still getting some air attack, though it will be less than external hardpoints.§!\n\n§WUsing this as the primary weapon will create an§! §BAir Superiority Fighter§!\n\n§RWARNING: CV Air Superiority Fighters will only attack enemy aircraft during naval combat§!"
 weap_int_a2a_hardpoint_2: "2세대 내장 공대공 무장장착소"
 weap_int_a2a_hardpoint_2_desc: "$weap_int_a2a_hardpoint_1_desc$"
 weap_int_a2a_hardpoint_3: "3세대 내장 공대공 무장장착소"
 weap_int_a2a_hardpoint_3_desc: "$weap_int_a2a_hardpoint_1_desc$"
 weap_int_mp_med_hardpoint_2: "1세대 내부 중형 하드포인트"
 weap_int_mp_med_hardpoint_2_desc: "중형 무기를 탑재하도록 설계된 하드포인트입니다. 경량 대함 미사일, 정밀 유도 무장, 대전차 미사일, 중형 순항 미사일, 장거리 공대공 미사일, 건포드 등이 해당됩니다. 이 하드포인트는 항공기에 폭넓은 무기 선택지를 제공하는 동시에 스텔스 능력도 높입니다.\n\n§G설계 힌트: 중형 하드포인트는 다목적의 전형으로, 거의 모든 항공 임무와 항공기를 쓸모 있게 만드는 해당 임무의 능력치를 제공하지만 IC 비용이 증가합니다. 이 모듈은 균형 잡힌 범용 항공기를 만듭니다.§!\n\n§W이를 주무장으로 사용하면 다음이 만들어집니다:§! §B다목적 전투기§!\n\n§R경고: 함재 다목적 전투기는 해전 중 적 함선만 공격합니다§!"
 weap_int_ag_cas_hardpoint_2: "1세대 내부 근접 항공 지원 하드포인트"
 weap_int_ag_cas_hardpoint_2_desc: "대량의 공대지 무장을 탑재하도록 설계된 하드포인트입니다. 이 하드포인트는 다양한 무장을 섞어 탑재하는 능력을 포기하는 대신 공대지 미사일, 더 무거운 폭탄, 더 많은 ALCM 같은 무기 체계를 여러 레일에 탑재하는 능력을 얻으며, 스텔스 능력도 향상시킵니다.\n\n§G설계 힌트: 근접 항공 지원 하드포인트는 항공기의 지상 공격 및 전략 폭격 능력치를 크게 높이지만, 항공기에 공중 공격력을 전혀 제공하지 않으며 레이더 우위가 감소합니다.§!\n\n§W이를 주무장으로 사용하면 다음이 만들어집니다:§! §B근접 항공 지원기§!"
 weap_int_mp_med_hardpoint_3: "2세대 내부 중형 하드포인트"
 weap_int_mp_med_hardpoint_3_desc: "$weap_int_mp_med_hardpoint_2_desc$"
 weap_int_mp_med_hardpoint_4: "3세대 내부 중형 하드포인트"
 weap_int_mp_med_hardpoint_4_desc: "$weap_int_mp_med_hardpoint_2_desc$"
