 armour_subtitle_ammo: "MUNITIONS"
 armour_subtitle_ammo_desc: "Les munitions incluent des versions améliorées et des charges de combat optimisées, afin d’améliorer les capacités de combat des différentes unités."
 armour_subtitle_medium_tank_destroyer_chassiss: "COQUES DE CHARS LÉGERS"
 armour_subtitle_medium_tank_destroyer_chassiss_desc: "Les chars légers peuvent fournir un appui-feu à nos troupes dans des terrains trop contraignants pour nos chars de bataille principaux."
 AIR_TITLE_ENGINE: "Moteurs"
 AIR_TITLE_ENGINE_DESC: "Moteurs d’hélicoptère, chacun conçu pour des objectifs de performance spécifiques."
 AIR_TITLE_ATGM: "Missile antichar guidé (ATGM)"
 AIR_TITLE_ATGM_DESC: "Missiles antichars guidés (ATGM), tous conçus pour être lancés depuis des hélicoptères."
 AIR_TITLE_ANTI_INFANTRY: "CANONS & ROQUETTES"
 AIR_TITLE_ANTI_INFANTRY_DESC: "Pylônes de roquettes, modules de canon et canons montés en nez, utilisés pour attaquer l’infanterie et les cibles légèrement blindées."
 AIR_TITLE_SPECIAL: "ÉQUIPEMENT SPÉCIAL"
 AIR_TITLE_SPECIAL_DESC: "Équipement spécial monté sur hélicoptère, destiné à améliorer les capacités de combat ou la survivabilité."
 mbt_tech_ops: "Développement de coques blindées"
 mbt_tech_ops_desc: "La pierre angulaire de la guerre blindée, cette recherche se concentre sur les principes fondamentaux de conception des coques blindées. Du châssis robuste des chars de bataille principaux aux plateformes polyvalentes des véhicules de combat d'infanterie et des transports de troupes blindés, cette technologie constitue la base de tout futur développement de véhicules blindés. En équilibrant mobilité, protection et adaptabilité, elle garantit à nos forces une base solide pour les opérations mécanisées."
 nera_armor_tech_1: "NERA de 1ʳᵉ génération"
 nera_armor_tech_1_desc: "Le blindage réactif non explosif (NERA) utilise une superposition d’inserts en titane lourd ou en uranium appauvri pour perturber les projectiles entrants. Plus lourd et plus coûteux qu’un blindage composite classique, mais nettement plus efficace."
 nera_armor_tech_2: "NERA de 2ᵉ génération"
 nera_armor_tech_2_desc: "Blindage réactif non explosif (NERA) amélioré, doté de matériaux et d’une conception optimisés, offrant une meilleure protection contre les charges creuses et les projectiles cinétiques."
 nera_armor_tech_3: "NERA de 3ᵉ génération"
 nera_armor_tech_3_desc: "Blindage réactif non explosif (NERA) de pointe, utilisant des matériaux de dernière génération et des configurations innovantes, offrant une protection supérieure contre un large éventail de menaces."
 defensive_systems: "Systèmes défensifs"
 defensive_systems_desc: "Un ensemble de technologies visant à améliorer la survivabilité de nos véhicules grâce à diverses mesures défensives."
 defensive_systems_2: "Systèmes défensifs avancés"
 defensive_systems_2_desc: "Avancées supplémentaires en technologies défensives visant à renforcer la survivabilité des véhicules. Ces systèmes intègrent des lanceurs de fumigènes améliorés et un blindage espacé renforcé, offrant une meilleure protection contre les menaces ennemies et améliorant les capacités défensives globales de nos véhicules."
 defensive_systems_3: "Systèmes défensifs moderne"
 defensive_systems_3_desc: "Des technologies défensives de pointe visant à maximiser la survivabilité des véhicules. Ces systèmes modernes intègrent une génération de fumigènes avancée, des systèmes d’alerte laser et des conceptions innovantes de blindage espacé, offrant à nos forces un ensemble complet de mesures défensives pour contrer une large gamme de menaces sur le champ de bataille moderne."
 defensive_systems_4: "Systèmes défensifs dernière génération"
 defensive_systems_4_desc: "Le summum des technologies défensives, conçu pour offrir une protection inégalée à nos véhicules. Ces systèmes avancés intègrent des systèmes de protection active de dernière génération et des capacités de guerre électronique, permettant de contrer un large éventail de menaces et d’assurer la survivabilité de nos forces sur le champ de bataille moderne."
 defensive_systems_5: "Systèmes défensifs améliorés"
 defensive_systems_5_desc: "La prochaine génération de technologies défensives, axée sur l’amélioration de la survivabilité de nos véhicules grâce à des mesures défensives avancées."
 SOV_module_helipads_1: "Ka-25"
 SOV_module_helipads_3: "Ka-27M"
 SOV_module_esm_1: "'Vympel-R2' with\nPK-16 / PK-10"
 SOV_module_esm_1_desc: "Le radar de guerre électronique « Vympel-R2 » est conçu pour détecter les radiations des radars opérationnels des navires et des avions, ainsi que des têtes chercheuses de missiles, et pour créer des interférences actives avec eux.\nLes PK-16/PK-10 sont des systèmes de brouillage électronique embarqués soviétiques permettant de mettre en place un brouillage passif (réflecteurs dipolaires et fausses cibles thermiques)."
 SOV_module_esm_2: "MP-401S 'Start-S'\navec PK-10 / PK-2"
 SOV_module_esm_2_desc: "Le complexe de ciblage et de brouillage MP-401S « Start-S » est conçu pour supprimer les radars de détection et de conduite de tir, ainsi que les radars de missiles antinavires.\nLes PK-2/PK-10 sont des systèmes soviétiques de brouillage électronique embarqués destinés à poser un brouillage passif (réflecteurs dipôles et fausses cibles thermiques).\n\n§GConseil du concepteur : ce module réduit la visibilité du navire et augmente sa durabilité, au prix d'un surcoût en CI de construction et en ressources stratégiques.§!"
 SOV_module_esm_3: "TK-25E\nwith PK-10 / PK-2"
 SOV_module_esm_3_desc: "Le TK-25E est conçu pour intercepter les rayonnements des stations radar de détection et de contrôle des armes embarquées sur aéronefs et navires, des têtes de guidage radar des missiles antinavires, analyser automatiquement les rayonnements, déterminer les directions d'attaque les plus dangereuses d'un navire et créer des interférences dans les directions dangereuses.\nLes PK-2/PK-10 sont des systèmes de brouillage électronique soviétiques embarqués destinés à la mise en place d'un brouillage passif (réflecteurs dipôles et fausses cibles thermiques)."
 SOV_module_chain_gun: "1x2 25mm 2M-3M"
 SOV_module_chain_gun_desc: "Le 2M-3 est un canon automatique soviétique à double tube de 25 mm destiné à l'artillerie navale. Il sert à l'autodéfense des navires et peut atteindre des cibles à une portée oblique allant jusqu'à 3 000 m."
 SOV_module_ciws_1: "1x2 30mm AK-230"
 SOV_module_ciws_1_desc: "L'AK-230 est un canon naval soviétique double de 30 mm entièrement automatique. Sa fonction principale est la défense antiaérienne. Il est monté dans une tourelle automatique fermée et guidé par radar."
 SOV_module_ciws_2: "2x1 30mm AK-630"
 SOV_module_ciws_2_desc: "L'AK-630 est un système d'arme navale soviétique et russe entièrement automatique, à canon rotatif et à courte portée. La désignation « 630 » fait référence à ses six canons et à leur calibre de 30 mm."
