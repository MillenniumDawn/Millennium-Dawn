 FIN.conservatism: "£FIN_conservatism_small (KD) - 基督教民主党"
 FIN.conservatism_icon: "£FIN_conservatism_small"
 FIN.conservatism_desc: "（基督教民主主义） - 基督教民主党\n\n基督教民主党提倡传统的基督教价值观、家庭友好政策和支持企业家的法律。该党过去反对芬兰加入欧盟，但在90年代中期该党领导层变动后，尽管反对联邦制欧盟，但该党已成为亲欧盟和亲北约的政党。"
 FIN.liberalism: "£FIN_liberalism_small (Kok.) - 民族联合党"
 FIN.liberalism_icon: "£FIN_liberalism_small"
 FIN.liberalism_desc: "（市场自由主义） - 民族联合党\n\n民族联合党是芬兰的主要中右翼政党。该党的核心价值观是自由主义（包括社会和经济自由主义）和民主。该党起源于芬兰党和青年芬兰党的君主制支持者。该党是最早公开要求芬兰加入欧盟的政党之一，其许多成员也是北约的坚定支持者。"
 FIN.socialism: "£FIN_socialism_small (SDP) - 社会民主党"
 FIN.socialism_icon: "£FIN_socialism_small"
 FIN.socialism_desc: "（社会民主主义） - 芬兰社会民主党\n\n社会民主党是芬兰历史最悠久的政党之一，成立于1899年，当时名为芬兰工人党。该党属于中左翼政党，主张工人权利、福利国家和自由社会价值观。该党与右翼中间党和民族联合党有着长期的合作历史。"
 FIN.Conservative: "£FIN_Conservative_small (KP) - 公民党"
 FIN.Conservative_icon: "£FIN_Conservative_small"
 FIN.Conservative_desc: "（保守主义）- 公民党\n\n公民党是由资深政治家帕沃·韦于吕宁创立的政党。韦于吕宁曾长期担任中央党党员，但最终因经验不足而无法担任党领导职务而离开。公民党希望芬兰脱离欧元区，并创建一种新的浮动国家货币。该党还支持权力下放政策。该党主要以韦于吕宁为中心，他因拒绝谴责俄罗斯或苏联的任何敌对行动而多次受到批评。"
 FIN.Neutral_conservatism: "£FIN_Neutral_conservatism_small (Kesk.) - 中间党"
 FIN.Neutral_conservatism_icon: "£FIN_Neutral_conservatism_small"
 FIN.Neutral_conservatism_desc: "（农业主义）- 中间党\n\n中间党的大部分政治主张都基于“阿尔基奥主义”，该主义以作家兼政治家桑特里·阿尔基奥命名。阿尔基奥主义是一种芬兰农业意识形态，其诞生是为了反对资本主义和社会主义。该党希望制定政策，确保整个芬兰人口稠密，而不是通过分散治理而以城市为中心。该党在1994年欧盟公投期间内部发生斗争，因为该党的许多成员希望不加入欧盟，或者至少阻止采用欧元。"
 FIN.Neutral_Libertarian: "£FIN_Neutral_Libertarian_small (Lib.) - 自由党"
 FIN.Neutral_Libertarian_icon: "£FIN_Neutral_Libertarian_small"
 FIN.Neutral_Libertarian_desc: "（自由主义）- 自由党\n\n自由党是一个小党派，主张最大限度的个人自由和最少的政府干预。"
 FIN.Neutral_green: "£FIN_Neutral_Green_small (Vihr.) - 绿色联盟"
 FIN.Neutral_green_icon: "£FIN_Neutral_Green_small"
 FIN.Neutral_green_desc: "（环保主义） - 绿色联盟\n\n绿色联盟是一个以环境为重点的社会自由党派。该党本身表示，该党在政治轴线上既不是左派也不是右派，而是站在最前沿。该党批评社会主义和资本主义，因为这两种制度都没有充分考虑环境问题。该党还主张将毒品合法化。"
 FIN.Neutral_Communism: "£FIN_Neutral_Communism_small (SKP) - 共产党"
 FIN.Neutral_Communism_icon: "£FIN_Neutral_Communism_small"
 FIN.Neutral_Communism_desc: "（马克思列宁主义）- 共产党\n\n现芬兰共产党成立于1997年，当时旧党加入左翼联盟，随后残余党派破产。该党反对北约和欧盟。该党声称自己不是马克思列宁主义，尽管其党宣言提到必须进一步完善马克思列宁主义，以充分理解和研究阶级斗争的复杂现实。该党还主张为那些无法工作的公民提供全民基本收入。"
 FIN.Nat_Populism: "£FIN_Nat_Populism_small (PS) - 正统芬兰人党"
 FIN.Nat_Populism_icon: "£FIN_Nat_Populism_small"
 FIN.Nat_Populism_desc: "（民族/基督教保守主义） - 正统芬兰人党\n\n正统芬兰人党是一个保守的、反欧派的政党，自称是“没有社会主义的工人党”。该党除了民族主义之外没有真正的意识形态，它在农村和城市都颇受欢迎。该党于1995年才成立，是芬兰农村党的继承者。一些反对者将该党归类为种族主义者，甚至是法西斯主义者。"
 FIN.Nat_Fascism: "£FIN_Nat_Fascism_small (IO) - 爱国右翼"
 FIN.Nat_Fascism_icon: "£FIN_Nat_Fascism_small"
 FIN.Nat_Fascism_desc: "（国家社会主义）- 爱国右翼\n\n爱国右翼是新纳粹雅利安日耳曼兄弟会的继承者。为了显得更合法，该党将纳粹图像改为卡勒瓦拉和基于芬兰神话的符号。该党反对移民、市场资本主义、犹太教和美国，强调芬兰根源和卡勒瓦拉。该党也被称为国家社会主义党。"
 FIN.Monarchist: "£FIN_Monarchist_small (HoS) - 黑森-卡塞尔王室"
 FIN.Monarchist_icon: "£FIN_Monarchist_small"
 FIN.Monarchist_desc: "（君主主义） - 黑森-卡塞尔王室\n\n黑森-卡塞尔王室本应于1918年统治芬兰，但德国革命和德皇被推翻，这一计划被迫提前结束。名义上的芬兰国王弗里德里希·卡尔从未正式加冕。由于芬兰议会投票赞成邀请他成为国王，他没有时间确认正式邀请。"
 FGU.oligarchism: "£generic_oligarchism_small (PS) - 幻影小队"
 FGU.oligarchism_desc: ""
 FRA.conservatism: "£FRA_conservatism (RPR) - 共和国集会"
 FRA.conservatism_icon: "£FRA_conservatism"
 FRA.conservatism_desc: "（新戴高乐主义）  - 共和国集会\n\n法国共和人民党由雅克·希拉克于1976年创立，是戴高乐主义政党民主共和联盟的继承者，也是法国中右翼的主要政党。该党主张独立自主的外交政策和强大的国家力量，并坚持对战略性产业保持监管控制，这些立场直接继承自夏尔·戴高乐。希拉克在1995年总统选举中获胜，使该党执掌共和国政权，但与社会党政府的多次联合执政削弱了其纲领。"
 FRA.conservatism_2002: "£FRA_conservatism (UMP) - 人民运动联盟"
 FRA.conservatism_2002_icon: "£FRA_conservatism"
 FRA.conservatism_2002_desc: "（自由保守主义）  - 人民运动联盟\n\n人民运动联盟成立于2002年，由共和国集会、自由民主党和法国民主联盟的大部分成员合并而成，旨在巩固中右翼势力，支持雅克·希拉克连任。该党是一个包容性很强的政党，囊括了戴高乐主义者、自由主义者和基督教民主党人，但也因此容易在欧洲问题和经济改革等议题上出现派系斗争。在尼古拉·萨科齐执政期间，该党在国内转向市场自由主义，在国外则回归北约一体化指挥体系。"
 FRA.conservatism_2017: "£FRA_conservatism_2017 (LR) - 共和党"
 FRA.conservatism_2017_icon: "£FRA_conservatism_2017"
 FRA.conservatism_2017_desc: "（自由保守主义）  - 共和党\n\n在尼古拉·萨科齐的倡议下，人民运动联盟于2015年更名为“共和党”。这一选择遭到竞争对手的反对，他们认为第五共和国的每个政党从定义上来说都是共和主义政党。更名并未弥合该党内部自由派和民族保守派之间的分歧。它仍然是主流右翼的体制性代表，并与欧洲人民党保持着联系。"
 FRA.liberalism: "£FRA_liberalism (UDF) - 法国民主联盟"
 FRA.liberalism_icon: "£FRA_liberalism"
 FRA.liberalism_desc: "（中间主义）  - 法国民主联盟\n\n法国民主联盟成立于1978年，旨在支持瓦莱里·吉斯卡尔·德斯坦总统。它并非单一政党，而是由自由主义者、基督教民主党人和激进分子组成的联盟。该联盟介于社会党和戴高乐主义右翼之间，与后者共同执政，但同时又拒绝被其吞并。法国民主联盟是法国政坛中最坚定的联邦主义力量，公开倡导建立“欧洲合众国”。"
 FRA.liberalism_2017: "£FRA_liberalism_2017 (LREM) - 共和国前进"
 FRA.liberalism_2017_icon: "£FRA_liberalism_2017"
 FRA.liberalism_2017_desc: "（社会自由主义）- 共和国前进\n\n埃马纽埃尔·马克龙于2016年创立了“前进！”党，作为其总统竞选的工具，并在短短十五个月内将其从无到有地发展成为议会多数党。该党将市场自由主义和劳工放松管制与公民权利和移民等社会进步立场相结合。它是法国政坛最公开的亲欧力量，其崛起削弱了社会党和共和党的力量。"
 FRA.socialism: "£FRA_socialism (PS) - 社会党"
 FRA.socialism_icon: "£FRA_socialism"
 FRA.socialism_desc: "（社会民主主义）- 社会党\n\n社会党在1971年弗朗索瓦·密特朗领导下的埃皮奈代表大会上重建，并超越共产党成为法国左翼的主导政党，于1981年赢得总统大选。其纲领已从国有化转向接受市场经济，这一转变在利昂内尔·若斯潘政府时期得到进一步巩固。20世纪90年代的腐败丑闻使其信誉受损，但它仍然是议会左翼的组织中心，也是社会党国际的成员。"
 FRA.anarchist_communism: "£FRA_left_wing_radical (LO) - 工人斗争"
 FRA.anarchist_communism_icon: "£FRA_left_wing_radical"
 FRA.anarchist_communism_desc: "(托洛茨基主义) - 工人斗争\n\n“工人斗争党”自1968年起公开活动，此前二十年间一直秘密运作。该党是一个以工厂基层组织而非选举机器为核心的托洛茨基主义组织。其成员使用化名，内部活动刻意保持秘密，这种纪律源于多年来对国家镇压的预期。阿莱特·拉吉耶多次竞选总统，使该党获得了远超其实际党员人数的公众关注。"
 FRA.anarchist_communism_2017: "£FRA_left_wing_radical_2017 (NPA) - 新反资本主义党"
 FRA.anarchist_communism_2017_icon: "£FRA_left_wing_radical_2017"
 FRA.anarchist_communism_2017_desc: "（革命社会主义） - 新反资本主义党\n\n成立于2009年，当时革命共产主义联盟解散，将分散的极左翼力量整合为一个单一组织。该党定位比法国共产党更左，其竞选纲领包括生态保护、反种族主义和工作场所斗争，并拒绝与社会党组成任何执政联盟。尽管如此，在一些地方形势有利的情况下，新反资本主义党也曾与法国共产党联合推出选举名单。"
 FRA.Neutral_conservatism: "£FRA_Neutral_conservatism (RPF) - 保卫法兰西联盟"
 FRA.Neutral_conservatism_icon: "£FRA_Neutral_conservatism"
 FRA.Neutral_conservatism_desc: "（主权主义） - 保卫法国联盟\n\n成查尔斯·帕斯夸和菲利普·德·维利耶于1999年创立了保卫法国联盟，该党由戴高乐主义者组成，他们认为主流右翼对布鲁塞尔过于妥协。保卫法国联盟反对欧元以及任何进一步将主权移交给欧洲机构的做法，同时坚定地坚持共和政治立场。该党在1999年欧洲议会选举中取得了显著成绩，但随后因内部纷争而解散。"
 FRA.Neutral_conservatism_2017: "£FRA_Neutral_conservatism_2017 (DLF) - 法国崛起党"
 FRA.Neutral_conservatism_2017_icon: "£FRA_Neutral_conservatism_2017"
 FRA.Neutral_conservatism_2017_desc: "（主权主义） - 法国崛起党\n\n由尼古拉斯·杜邦-艾尼昂从被边缘化的戴高乐主义阵营中建立的法国崛起党，继承了法国人民阵线留下的主权主义阵地。该党融合了戴高乐主义的国家主义、反对欧盟和反对移民的立场，介于共和党和极右翼之间。2017年，该党对玛丽娜·勒庞的支持使其失去了大部分剩余的戴高乐主义支持者。"
 FRA.neutral_Social: "£FRA_neutral_Social (LFI) - 不屈法国"
 FRA.neutral_Social_icon: "£FRA_neutral_Social"
 FRA.neutral_Social_desc: "(民主社会主义) - 不屈法国\n\n让-吕克·梅朗雄创立“不屈法国”时，将其定位为一场运动而非政党，刻意避开了他认为导致社会党衰落的那些体制。该运动呼吁召开制宪会议，以建立第六共和国的总统制取代其所谓的第五共和国的君主制。其纲领涵盖扩大劳工权利和公共服务、逐步退出化石燃料以及对北约的强烈批判。"
 FRA.Neutral_Communism: "£FRA_Neutral_Communism (FA) - 无政府主义者联合会"
 FRA.Neutral_Communism_icon: "£FRA_Neutral_Communism"
 FRA.Neutral_Communism_desc: "(自由共产主义) - 无政府主义者联合会\n\n成立于1945年的无政府主义联盟由战前无政府主义运动的残余势力组成，是由一百多个自治团体组成的联盟，这些团体以综合宪章而非党纲为纽带。该联盟在巴黎运营着自由电台和公共书店，并通过工作场所和社区行动而非选举进行组织。它既拒绝国家，也拒绝先锋党，因此始终游离于体制政治之外。"
 FRA.Neutral_Muslim_Brotherhood: "£FRA_Neutral_Muslim_Brotherhood (PMF) - 法国穆斯林党"
 FRA.Neutral_Muslim_Brotherhood_icon: "£FRA_Neutral_Muslim_Brotherhood"
 FRA.Neutral_Muslim_Brotherhood_desc: "(伊斯兰民主主义) - 法国穆斯林党\n\n由穆罕默德·拉特雷什于1997年在斯特拉斯堡创立，旨在将法国穆斯林组织成一个独立的选民群体。该联盟反对限制宗教服饰和穆斯林在法国公共生活中的待遇，并在海外采取强烈的亲巴勒斯坦立场。其选举结果从未超过边缘，而传统的穆斯林联盟也一直与其保持距离。"
 FRA.Neutral_green: "£FRA_Neutral_green (LV) - 绿党"
 FRA.Neutral_green_icon: "£FRA_Neutral_green"
 FRA.Neutral_green_desc: "(环保主义) - 绿党\n\n法国绿党成立于1984年，其前身是源于20世纪70年代反核运动的生态运动。绿党是第一个赢得全国议席的法国绿党。多米尼克·沃内担任环境部长期间，在利昂内尔·若斯潘的领导下，绿党首次进入政府。该党内部长期存在分裂：中间派持开放态度，愿意与各派结盟；左派则坚持多元左翼路线。"
 FRA.Neutral_green_2017: "£FRA_Neutral_green (EELV) - 欧洲生态-绿党"
 FRA.Neutral_green_2017_icon: "£FRA_Neutral_green"
 FRA.Neutral_green_2017_desc: "（环境保护主义）- 欧洲生态-绿党\n\n欧洲生态党成立于2010年，由绿党与在2009年欧洲议会选举中表现强劲的欧洲生态联盟合并而成。该党主张征收碳税、逐步淘汰核电，并通过对富人征收累进税来大力投资可再生能源。该党与欧洲绿党结盟，并在与社会党组建执政联盟和以独立候选人身份参选之间轮换。"
 FRA.Nat_Autocracy: "£FRA_Nat_Autocracy (FAF) - 法国武装部队"
 FRA.Nat_Autocracy_icon: "£FRA_Nat_Autocracy"
 FRA.Nat_Autocracy_desc: "（军政府） - 法国武装部队\n\n1997年法律废除征兵制后，法国武装部队成为一支完全职业化的部队，并拥有欧盟唯一独立的核威慑力量。其在非洲、印度洋和太平洋的驻军赋予了总参谋部其他任何共和国机构都无法企及的影响力。军官们此前曾多次对抗文职当局，最近一次是1961年的阿尔及尔政变，而这一先例的记忆至今仍未完全消逝。"
 FRA.Nat_Populism: "£front_national (FN) - 国民阵线"
 FRA.Nat_Populism_icon: "£front_national"
 FRA.Nat_Populism_desc: "（民族民粹主义） - 国民阵线\n\n让-玛丽·勒庞于1972年创立了国民阵线，旨在联合分散的法国极右翼势力。20世纪80年代，该党凭借反对移民的立场在全国范围内崛起。国民阵线主张经济保护主义、退出欧盟和北约、维持高额军费开支以及对警察执法采取零容忍政策。勒庞在2002年总统选举中进入第二轮投票，迫使整个共和党阵营联合起来，组成防御联盟对抗他。"
 FRA.Monarchist: "£FRA_Monarchist (MdB) - 波旁王室"
 FRA.Monarchist_icon: "£FRA_Monarchist"
 FRA.Monarchist_desc: "（正统主义）- 波旁王室\n\n波旁王朝是卡佩王朝的长支，自1589年起统治法国，直至1830年查理十世倒台，至今仍持有西班牙和卢森堡的王位。正统派承认西班牙分支的首领是合法的王位继承人，认为腓力五世放弃法国王位继承权的声明从未有效。他们的论点基于严格的男性长子继承制，并彻底驳斥了奥尔良派的主张。"
 FRA.Monarchist2: "£FRA_Monarchist2 (MB) - 波拿巴王室"
 FRA.Monarchist2_icon: "£FRA_Monarchist2"
 FRA.Monarchist2_desc: "（波拿巴主义） - 波拿巴王室\n\n自诩为法兰西皇室的波拿巴家族，其祖先可追溯至拿破仑·波拿巴，在1870年色当战役战败前，曾统治过两个帝国。波拿巴主义者主张以全民公投而非世袭来确立统治合法性，他们主张建立强有力的行政机构，并绕过议会直接向全国人民发出呼吁。现任皇室继承人领导着一个规模虽小但组织严密的运动，该运动已彻底断送了所有复辟的希望。"
 GER.conservatism: "£GER_western_conservative （基民盟/基社盟）基督教民主联盟"
 GER.conservatism_icon: "£GER_western_conservative"
 GER.conservatism_desc: "保守主义 - 基督教民主联盟和来自巴伐利亚地区的姊妹党基督教社会联盟在政治联盟中紧密合作。基民盟是德国政治中右翼的主要‘大帐篷’政党。"
 GER.liberalism: "£GER_non_aligned_libertarian (LKR) 自由保守改革党"
 GER.liberalism_icon: "£GER_non_aligned_libertarian"
 GER.liberalism_desc: "自由主义者 - 自由保守改革党（自由保守派改革者）批评欧洲中央银行的低利率、零利率和负利率政策。该党还强调西方与北约和欧盟的结盟是跨大西洋安全结构的基础。自由保守改革派总体上支持自由贸易，在一定条件下支持跨大西洋贸易与投资伙伴关系。该党支持按照加拿大模式移民符合条件的候选人，并反对非法移民。该党反对最低工资，但倾向于所谓的“激活最低收入”。该党自称在道德上保守，在经济上自由，是技术进步的倡导者。该党完全反对任何形式的极端主义。该党呼吁对欧盟和欧元区进行根本性改革，认为欧盟和欧元区应该回归其“核心竞争力”，减少对成员国的政治干预，取消移民配额，不再对欧元区成员国进行救助。"
 GER.socialism: "£GER_western_social_democrat (SPD) 社会民主党"
 GER.socialism_icon: "£GER_western_social_democrat"
 GER.socialism_desc: "社会民主主义 - 社会民主党成立于1863年，是德国联邦议院中现存历史最悠久的政党，也是世界上最早的社会主义政党之一。如今该党奉行社会市场经济理念，支持欧盟和北约的国际主义路线，但在福利国家规模问题上存在党内分歧。其主要支持力量集中在德国北部和西部的大城市，尤其是鲁尔工业区。"
 GER.anarchist_communism: "£GER_non_aligned_socialist_democrat_alt (PDS) 民主社会党"
 GER.anarchist_communism_icon: "£GER_non_aligned_socialist_democrat_alt"
 GER.anarchist_communism_desc: "左翼社会主义 - 民主社会党诞生于柏林墙倒塌后，由前东德执政党德国统一社会主义党演变而来。该党以民主社会主义政党重新定位自身，旨在维持其在德国东部地区的影响力，同时软化形象以争取更广泛的支持。民主社会党主张财富再分配、健全的福利计划及反对新自由主义经济政策，吸引了那些因两德统一后经济困境而失望的群体。该党还以北约的尖锐批评者自居，主张裁军并构建包含俄罗斯在内的欧洲安全体系。尽管民主社会党在前东德各州实力雄厚，但它在西德却难以获得同等的支持。"
 GER.Caliphate: "£generic_Caliphate_small 天堂邀请"
 GER.Caliphate_icon: "£generic_Caliphate_small"
 GER.Caliphate_desc: "萨拉菲圣战主义 - 天堂邀请是由穆罕默德·奇夫奇在不伦瑞克市成立的民间萨拉菲主义组织，并由德国的两个最著名的萨拉菲主义传教士皮尔·沃格尔和斯文·拉乌拥护。"
 GER.Neutral_conservatism: "£GER_non_aligned_conservative (FW) 自由选民"
 GER.Neutral_conservatism_icon: "£GER_non_aligned_conservative"
 GER.Neutral_conservatism_desc: "保守主义 - 自由选民。自由选民并不是一个政党，而是作为参与选举的协会形式存在。他们在德国南部较为保守的乡村尤其活跃，主张尽可能将政治决策权下放至地方层面。"
 GER.Neutral_Libertarian: "£GER_western_liberal (FDP)自由民主党"
 GER.Neutral_Libertarian_icon: "£GER_western_liberal"
 GER.Neutral_Libertarian_desc: "自由主义 - 自由民主党是德国的一个中右翼自由主义政党，长荡公民自由、人权和国际主义。该党坚定推行经济自由主义，并始终致力于推动自由市场和私有化。"
 GER.Neutral_Communism: "£GER_non_aligned_communism (MLPD) 德国马列主义党"
 GER.Neutral_Communism_icon: "£GER_non_aligned_communism"
 GER.Neutral_Communism_desc: "共产主义 - 德国马克思列宁主义党主张建立无产阶级专政，推翻现任资本主义政府，代之以新的社会主义秩序。他们将斯大林和毛泽东视为值得效仿的灵魂人物。"
 GER.Neutral_Muslim_Brotherhood: "£GER_non_aligned_moderate_islamist 德国民主联盟"
 GER.Neutral_Muslim_Brotherhood_icon: "£GER_non_aligned_moderate_islamist"
 GER.Neutral_Muslim_Brotherhood_desc: "温和伊斯兰主义 - 德国民主联盟是一个面向德国土耳其裔少数民族的政党。该党由雷姆齐·阿鲁于2016年成立，起因是德国议会决定承认亚美尼亚种族灭绝，这一决定引发了土耳其保守派和民族主义者的不满。该党的选民基础有限，因为在德国仅有约一半的土耳其裔少数民族拥有投票权。德国民主联盟主要吸引与土耳其保守派正义与发展党立场一致的土耳其裔选民。除了要求撤销对亚美尼亚种族灭绝的承认以及代表德国土耳其裔和穆斯林少数民族的政策外，该党并没有一个成熟的政治纲领。"
 GER.Neutral_green: "£GER_non_aligned_greens (GRÜNE) 联盟90/绿党"
 GER.Neutral_green_icon: "£GER_non_aligned_greens"
 GER.Neutral_green_desc: "环保主义 - 联盟90/绿党由非共产主义的东德联盟90与西德绿党合并而成。该党倡导环保主义和可持续发展。以国际标准衡量，该党作为绿党在民意调查中表现极为成功，并多次参与执政联盟，对政策制定产生重大影响。该党被视为全球环保主义者的主要灵感源泉。"
 GER.neutral_Social: ""
 GER.neutral_Social_desc: ""
 GER.Nat_Autocracy: "£GER_nationalist_military_junta_alt (DVU) 德国人民联盟"
 GER.Nat_Autocracy_icon: "£GER_nationalist_military_junta_alt"
 GER.Nat_Autocracy_desc: "极右民族主义 - 德国人民联盟是一个极右民族主义政党，以强烈的反移民立场和反对欧洲一体化而闻名。该党由格哈德·弗雷于1987年创立，自诩为“德国身份”的捍卫者，并频繁使用民粹主义言论吸引民族主义和保守派选民。德国人民联盟重点关注限制移民、反对多元文化主义以及批评德国政治体制等议题，其言论常带有煽动性和仇外色彩。虽然该党在某些地区取得了一些地区性成功，特别是在德国东部经济困难地区，但其影响力随时间推移逐渐减弱。"
 GER.Nat_Fascism: "£GER_nationalist_fascism (NPD) 德国国家民主党"
 GER.Nat_Fascism_icon: "£GER_nationalist_fascism"
 GER.Nat_Fascism_desc: "法西斯主义 - 德国国家民主党。德国国家民主党是一个极右翼极端民族主义政党，被定性为新纳粹组织。尽管该党已被国家情报部门深度渗透，但取缔尝试却均告失败。该党持反犹立场并煽动针对移民的仇恨情绪。"
 GER.Nat_Populism: "£GER_nationalist_right_wing_populist_b (REP)共和党"
 GER.Nat_Populism_icon: "£GER_nationalist_right_wing_populist_b"
 GER.Nat_Populism_desc: "右翼民粹主义 - 共和党是一个持欧洲怀疑论的右翼民粹主义政党，反对移民，并倾向于吸引抗议选民。该党经常批评基民盟/基社盟不够保守，因为该党是由前基社盟成员弗兰兹·汉德洛斯创立的。"
 GER.Monarchist: "£GER_nationalist_monarchist 霍亨索伦王室"
 GER.Monarchist_icon: "£GER_nationalist_monarchist"
 GER.Monarchist_desc: "霍亨索伦家族是前德意志帝国和普鲁士的德意志王室。尽管在1918年德皇威廉二世退位后王室已被废除，但该家族仍活跃于世。"
 ICE.conservatism: "£ICE_western_conservative 独立党"
 ICE.conservatism_icon: "£ICE_western_conservative"
 ICE.conservatism_desc: "(自由保守主义) - 独立党是冰岛现代历史上最大的政党，是一个‘大帐篷’政党，包含冰岛大部分中立偏右翼思想。他们在经济上奉行自由主义，并在富人和渔民中拥有强大的忠实选民基础。他们支持北约，但反对加入欧盟。"
 ICE.liberalism: "£ICE_western_liberal 自由党"
 ICE.liberalism_icon: "£ICE_western_liberal"
 ICE.liberalism_desc: "(新自由主义)  - 自由党该组织由独立党的一个分裂派别于1998年成立，反对现行集中化渔业配额制度。该党支持自由市场经济，反对补助金和垄断市场。"
 ICE.liberalism_2012: "£ICE_western_liberal_2012 光明未来"
 ICE.liberalism_2012_icon: "£ICE_western_liberal_2012"
 ICE.liberalism_2012_desc: "（社会自由主义） - 光明未来成立以来树立了一个‘最佳党派’的政治形象，这个滑稽的党派通过承诺‘在雷克雅未克建造一个迪士尼乐园’和‘在动物园展出北极熊’来赢得该市市长职位。在国家层面上，他们具有自由主义的观念，希望加入欧盟并采用欧元。"
 ICE.liberalism_2016: "£ICE_western_liberal_2016 改革党"
 ICE.liberalism_2016_icon: "£ICE_western_liberal_2016"
 ICE.liberalism_2016_desc: "（绿色自由主义） - 改革党是一个从独立党分裂出来的政治家团体，原因是对该党的欧洲理念主义和在国际贸易自由化方面缺乏行动感到不满。"
 ICE.socialism: "£ICE_western_social_democrat 社会民主联盟"
 ICE.socialism_icon: "£ICE_western_social_democrat"
 ICE.socialism_desc: "（北欧模式） - 冰岛社会民主联盟，由四个左派政党合并成立，目的是挑战保守派独立党对冰岛政治的控制。作为一个中左翼政党，他们的主要事业是支持福利国家。"
 ICE.oligarchism: "£ICE_non_aligned_oligarchism 进步党"
 ICE.oligarchism_icon: "£ICE_non_aligned_oligarchism"
 ICE.oligarchism_desc: "（北欧农业主义） - 进步党是一个中右翼的农业党。是冰岛的第二大党，大部分时间在左翼和右翼的勾连中度过。他们是欧洲怀疑论者，赞成加强保护主义，并承诺对农业部门进行大量补贴。"
 ICE.Neutral_Libertarian: "£ICE_non_aligned_libertarian 海盗党"
 ICE.Neutral_Libertarian_icon: "£ICE_non_aligned_libertarian"
 ICE.Neutral_Libertarian_desc: "（海盗政治） -  海盗党可以说是世界上最成功的此类型党，常在议会中赢得许多席位。他们主张透明的直接民主、隐私、公民自由和版权法的改革。他们利用自己的影响力，试图使冰岛成为世界上最自由的社会。"
 ICE.neutral_Social: "£ICE_non_aligned_socialist_democrat 左翼绿色运动"
 ICE.neutral_Social_icon: "£ICE_non_aligned_socialist_democrat"
 ICE.neutral_Social_desc: "（生态社会主义） - 左翼绿色运动的成立是由于左派政党中的许多成员对社会民主联盟的中心主义感到不满。除了传统的社会主义民主政策外，该党还提倡女权主义和环保主义。他们反对北约和欧盟。"
 ICE.Nat_Fascism: "£ICE_nationalist_fascism 冰岛民族阵线"
 ICE.Nat_Fascism_icon: "£ICE_nationalist_fascism"
 ICE.Nat_Fascism_desc: "（极端民族主义） - 冰岛民族阵线旨在捍卫冰岛文化并阻止一切移民。他们尤其反对伊斯兰教。"
 ICE.Nat_Populism: "£ICE_nationalist_right_wing_populist 右翼绿色人民党"
 ICE.Nat_Populism_icon: "£ICE_nationalist_right_wing_populist"
 ICE.Nat_Populism_desc: "（绿色保守主义） - 右翼绿色人民党主要受到美国自由主义的启发，希望冰岛坚决独立于所有国际组织。他们主张建立高度放松管制的经济体系，同时也支持自然环境保护。右绿党的命名是对其政敌左绿党的一种双关讽刺。"
 ICE.Nat_Populism_2016: "£ICE_nationalist_right_wing_populist_2016 人民党"
 ICE.Nat_Populism_2016_icon: "£ICE_nationalist_right_wing_populist_2016"
 ICE.Nat_Populism_2016_desc: "（调和民粹主义）- 人民党是一个民粹主义政党，反对移民及与欧盟合作，致力于消除贫困与腐败。该党在经济议题上明显左倾，而在社会议题上则更倾向于右翼立场。"
 IRQ.liberalism: "£IRQ_liberalism_small (INA) 伊拉克国民协议"
 IRQ.liberalism_icon: "£IRQ_liberalism_small"
 IRQ.liberalism_desc: "（自由主义） - 伊拉克国民协议\n\n伊拉克国民协议于1991年在伦敦成立，是反对萨达姆·侯赛因的主要非德黑兰党派。它的主要资金来自沙特阿拉伯、英国和美国。1996年，该组织在CIA的帮助下，试图发动针对萨达姆的政变，但最终失败。"
 IRQ.liberalism_2017: "£IRQ_liberalism_2017_small 伊拉克民族运动"
 IRQ.liberalism_2017_icon: "£IRQ_liberalism_2017_small"
 IRQ.liberalism_2017_desc: "自由主义 - 伊拉克民族运动是一个建立在世俗主义和非宗派主义基础上的联盟，其中混合了一些伊拉克民族主义。它由一些伊拉克最大的世俗政党组成，其中包括全国联盟。"
 IRQ.Conservative: "£IRQ_Conservative_small (IDP)伊斯兰达瓦党"
 IRQ.Conservative_icon: "£IRQ_Conservative_small"
 IRQ.Conservative_desc: "（伊斯兰主义） - 伊斯兰达瓦党\n\n伊斯兰达瓦党是一个什叶派宗教政党，从已故伊拉克神职人员穆克塔达·萨德尔那里汲取灵感。然而，它逐渐受到伊朗的影响，并参与了几次针对萨达姆·侯赛因的暗杀计划。它与伊拉克伊斯兰最高委员会的主要对比点是，它认为政治权力应该由广大人民群众掌握，而不仅仅是集中在伊斯兰学者手中。"
 IRQ.Vilayat_e_Faqih: "£IRQ_Vilayat_e_Faqih_small (BB) 巴德尔旅"
 IRQ.Vilayat_e_Faqih_icon: "£IRQ_Vilayat_e_Faqih_small"
 IRQ.Vilayat_e_Faqih_desc: "（什叶派军国主义）- 巴德尔旅\n\n巴德尔组织起源于伊拉克伊斯兰最高委员会的武装部门，但后来在真主党的启发下演变成了一个独立的政治组织。它的政治和军事行动主要由伊朗革命卫队控制。"
 IRQ.Mod_Vilayat_e_Faqih: "£IRQ_Mod_Vilayat_e_Faqih_small (ISCI)伊拉克伊斯兰革命最高委员会"
 IRQ.Mod_Vilayat_e_Faqih_icon: "£IRQ_Mod_Vilayat_e_Faqih_small"
 IRQ.Mod_Vilayat_e_Faqih_desc: "（什叶派革命主义）- 伊拉克伊斯兰最高委员会\n\n伊拉克伊斯兰最高委员会于1982年在伊朗成立，当时的名称为“伊拉克伊斯兰革命最高委员会”。该委员会愿意与其他政党合作组建政府，但其长期目标是建立一个类似伊朗、由伊斯兰学者控制的伊斯兰共和国。"
 IRQ.Caliphate: "£generic_Caliphate_small (ISI)伊拉克伊斯兰国"
 IRQ.Caliphate_desc: "（萨拉菲圣战主义）- 伊拉克伊斯兰国\n\n伊拉克伊斯兰国，通常被称为“伊拉克基地组织”，于1999年由约旦恐怖分子阿布·穆萨卜·扎卡维以“统一与圣战组织”的名义成立。该组织被广泛认为是基地组织中最残暴的分支，其战略是通过杀害什叶派穆斯林和少数族裔来制造混乱。"
 IRQ.Neutral_conservatism_2017: "£IRQ_Neutral_conservatism_small 胜利联盟"
 IRQ.Neutral_conservatism_2017_icon: "£IRQ_Neutral_conservatism_small"
 IRQ.Neutral_conservatism_2017_desc: "保守主义 - 胜利联盟，是前总理海德尔·阿巴迪在争夺伊斯兰达瓦党领导权的斗争中败下阵来后，成立了胜利联盟作为他个人的政治工具。这是一个相当温和和务实的什叶派伊斯兰党，尽管阿巴迪在担任总理期间留下了宗派主义的痕迹。"
 IRQ.Neutral_Communism: "£IRQ_Neutral_Communism_small (ICP)伊拉克共产党"
 IRQ.Neutral_Communism_icon: "£IRQ_Neutral_Communism_small"
 IRQ.Neutral_Communism_desc: "（经典马克思主义）- 伊拉克共产党\n\n伊拉克共产党长期主导伊拉克的左翼政治。该党与复兴党在苏联斡旋下结成的脆弱联盟于1979年破裂，此后一直主张武装斗争。该党奉行世俗主义与社会主义。"
 IRQ.Neutral_Muslim_Brotherhood: "£IRQ_islamic_party (ISP) 伊拉克伊斯兰党"
 IRQ.Neutral_Muslim_Brotherhood_desc: "（温和伊斯兰主义）- 伊拉克伊斯兰党\n\n伊拉克伊斯兰党是穆斯林兄弟会在伊拉克的正式分支机构，也是伊拉克逊尼派的主要代表机构之一。"
 IRQ.Neutral_Muslim_Brotherhood_2017: "£IRQ_Neutral_Muslim_Brotherhood_small 改革派联盟"
 IRQ.Neutral_Muslim_Brotherhood_2017_icon: "£IRQ_Neutral_Muslim_Brotherhood_small"
 IRQ.Neutral_Muslim_Brotherhood_2017_desc: "温和伊斯兰主义 - 改革派联盟是伊拉克主要的逊尼派政治联盟，以泛伊斯兰主义的穆斯林兄弟会的意识形态为主导。它主张加强伊拉克逊尼派地区的自治权。"
 IRQ.Nat_Autocracy: "£IRQ_armed_forces (AFQ) 伊拉克武装力量"
 IRQ.Nat_Autocracy_icon: "£IRQ_Nat_Autocracy_small"
 IRQ.Nat_Autocracy_desc: "（军政府）- 伊拉克武装力量\n\n伊拉克武装力量成立于20世纪30年代初，参与了包括政变在内的各种政治活动，其中包括推翻哈希姆王朝的政变。"
 IRQ.Nat_Populism: "£IRQ_sardist (SIP) 萨德尔诚信党"
 IRQ.Nat_Populism_desc: "（伊拉克民族主义）- 萨德尔诚信党\n\n萨德尔运动是一支具有民粹主义和民族主义价值观的什叶派政治运动。虽然其麾下民兵组织曾得到伊朗的支持，但该运动始终致力于摆脱任何外国势力的支配。"
 IRQ.Monarchist: "£IRQ_monarch (HoH)哈希姆王室"
 IRQ.Monarchist_desc: "（绝对君主主义） - 哈希姆王朝\n\n哈希姆王朝于1921年至1958年统治伊拉克，后被军方推翻。目前，王室首领为拉阿德·本·扎伊德。"
 KOR.Western_Autocracy: "£kor_western_autocracy (DRP) 民主共和党"
 KOR.Western_Autocracy_desc: "（右翼专制主义） - 民主共和党\n\n民主共和党是朴正熙独裁统治时期的政治工具，这是韩国历史上将残酷的独裁统治与惊人的经济发展相结合的时期。该党的统治遗产至今仍存有争议。"
 KOR.conservatism: "£kor_western_conservative (GNP) 大国家党"
 KOR.conservatism_icon: "£kor_western_conservative"
 KOR.conservatism_desc: "（爱国保守主义）- 大国家党\n\n大国家党是韩国主要的保守党派。该党可追溯至朴正熙执政时期的威权主义政党民主共和党，但在韩国民主化转型后已重塑自身形象。尽管如此，该党仍保留了许多威权统治时期的价值观，例如支持财阀在国家经济中的主导地位、对左翼政治持怀疑态度、以及对朝鲜的敌视立场，这与对美国的大力支持密切相关。"
 KOR.conservatism_2012: "£kor_western_conservative (SP) 新国家党"
 KOR.conservatism_2012_desc: "（爱国保守主义）- 新国家党\n\n新国家党是韩国主要的保守党派。该党可追溯至朴正熙执政时期的威权主义政党民主共和党，但在韩国民主化转型后已重塑自身形象。尽管如此，该党仍保留了许多威权统治时期的价值观，例如支持财阀在国家经济中的主导地位、对左翼政治持怀疑态度、以及对朝鲜的敌视立场，这与对美国的大力支持密切相关。"
 KOR.conservatism_2017: "£kor_western_conservative (LKP)自由韩国党"
 KOR.conservatism_2017_desc: "（爱国保守主义）- 自由韩国党\n\n韩国自由党是韩国主要的保守党派。该党可追溯至朴正熙执政时期的威权主义政党民主共和党，但在韩国民主化转型后已重塑自身形象。尽管如此，该党仍保留了许多威权统治时期的价值观，例如支持财阀在国家经济中的主导地位、对左翼政治持怀疑态度、以及对朝鲜的敌视立场，这与对美国的大力支持密切相关。"
 KOR.liberalism: "£kor_western_liberal (PP) 国民之党"
 KOR.liberalism_icon: "£kor_western_liberal"
 KOR.liberalism_desc: "（中间主义） - 国民之党\n\n国民之党是一个新兴政党，与其创始人安哲秀关系密切。作为致力于打破左右两大主流政党垄断局面的企业家，安哲秀领导的该党秉持彻底的中间路线，融合了韩国左右翼政治的元素，其外交政策观点与保守派相同，但经济政策则采用左翼方针。"
 KOR.socialism: "£kor_western_social_democrat (MDP) 千禧民主党"
 KOR.socialism_icon: "£kor_western_social_democrat"
 KOR.socialism_desc: "（韩国自由主义） - 千禧民主党\n\n虽然韩国保守派的血统可以追溯到韩国的独裁政权，但左翼自由派千禧民主党（当地称为“共同民主党”）由反对独裁统治、在韩国建立民主制度的人士组成。该党因此反建制、积极行动，致力于采取左翼经济政策，支持工会，限制强大财阀的影响。该党决心实现统一，主张与朝鲜进行谈判和接触，并与韩国的盟友美国保持谨慎的关系。"
 KOR.anarchist_communism: "£kor_emerging_left_wing_radical (DLP) 民主工党"
 KOR.anarchist_communism_icon: "£kor_emerging_left_wing_radical"
 KOR.anarchist_communism_desc: "（民主社会主义） - 民主劳动党\n\n民主劳动党是一个持进步主义与民族主义立场的政党，作为韩国“全国民主劳动组合总联盟”的政治分支而成立。该党支持加强劳工权利，并主张反帝国主义和朝鲜半岛统一。"
 KOR.anarchist_communism_2011: "£kor_emerging_left_wing_radical_alt  (UPP) 统合进步党"
 KOR.anarchist_communism_2011_icon: "£kor_emerging_left_wing_radical_alt"
 KOR.anarchist_communism_2011_desc: "（进步主义） - 统合进步党\n\n统合进步党是民主劳动党的前身，民主劳动党是一个持进步主义与民族主义立场的政党，作为韩国“全国民主劳动组合总联盟”的政治分支而成立。该党支持加强劳工权利，并主张反帝国主义和朝鲜半岛统一。"
 KOR.anarchist_communism_2016: "£kor_emerging_left_wing_radical (PUP) 人民联合党"
 KOR.anarchist_communism_2016_icon: "£kor_emerging_left_wing_radical"
 KOR.anarchist_communism_2016_desc: "（左翼民粹主义）- 人民联合党\n\n人民联合党是一个持进步主义与民族主义立场的政党，该党支持加强劳工权利，并主张反帝国主义和朝鲜半岛统一。 "
 KOR.Neutral_conservatism: "£kor_non_aligned_conservative (ULD) 自由民主联合"
 KOR.Neutral_conservatism_icon: "£kor_non_aligned_conservative"
 KOR.Neutral_conservatism_desc: ""
 KOR.Neutral_conservatism_2016: "£kor_non_aligned_conservative_alt  (BP) 正党"
 KOR.Neutral_conservatism_2016_icon: "£kor_non_aligned_conservative_alt"
 KOR.Neutral_conservatism_2016_desc: ""
 KOR.neutral_Social: "£kor_non_aligned_social_democrat (JP) 公正党"
 KOR.neutral_Social_icon: "£kor_non_aligned_social_democrat"
 KOR.neutral_Social_desc: "（社会民主主义） - 公正党\n\n公正党是韩国最大的进步党派。虽然该党与民主党有许多相同的左翼立场，但其变革性社会经济议程更进一步。除了呼吁重新分配税收和建立福利国家外，该党还支持妇女、移民和残疾人的权利。值得注意的是，在这个社会仍然保守的国家，它是唯一一个支持LGBT权利的重要政党。该党对中国和美国的霸权以及日本的重新武装持谨慎态度，但与民主党不同，该党认为人权不应服从于与朝鲜统一的事业。"
 KOR.Neutral_green: "£kor_non_aligned_greens (GPK) 韩国绿党"
 KOR.Neutral_green_icon: "£kor_non_aligned_greens"
 KOR.Neutral_green_desc: ""
 KOR.Neutral_Communism: "£kor_non_aligned_communist (NPP) 新进步党"
 KOR.Neutral_Communism_desc: "（进步主义） - 新进步党\n\n新进步党是民主劳动党人民民主派的社会主义政党。该派反对占主导地位的民族解放派的统一、反帝国主义立场，从而成立了一个单独的反朝鲜左翼政党。"
 KOR.Neutral_Communism_2013: "£kor_non_aligned_communist_alt (LP) 工党"
 KOR.Neutral_Communism_2013_desc: "（民主社会主义） - 工党\n\n工党是民主劳动党人民民主派的社会主义政党。该派反对占主导地位的民族解放派的统一、反帝国主义立场，从而成立了一个单独的反朝鲜左翼政党。"
 KOR.Nat_Autocracy: "£kor_nationalist_military_junta (ROKA) 大韩民国国军"
 KOR.Nat_Autocracy_icon: "£kor_nationalist_military_junta"
 KOR.Nat_Autocracy_desc: ""
 KOR.Nat_Populism: "£kor_nationalist_right_wing_populist (CLUP) 基督自由党"
 KOR.Nat_Populism_icon: "£kor_nationalist_right_wing_populist"
 KOR.Nat_Populism_desc: "（基督教民族主义） - 基督自由党\n\n基督自由党是一个极右翼基督教政党，该党认为韩国正面临同性恋和伊斯兰教的威胁。"
 KOR.Monarchist: "£kor_nationalist_monarchist 李朝王室"
 KOR.Monarchist_icon: "£kor_nationalist_monarchist"
 KOR.Monarchist_desc: ""
 KUR.conservatism: "£KUR_conservatism_small 库尔德民主党"
 KUR.conservatism_icon: "£KUR_conservatism_small"
 KUR.conservatism_desc: "保守主义 - 库尔德民主党是一个保守的库尔德民族主义政党，由巴尔扎尼家族主导。该党控制着库尔德佩什梅加的大部分地区，一直是伊拉克库尔德人战争和政治中的主导力量。虽然它的主要历史支持者是伊朗，但此后它又扩展开来，获得了美国，土耳其和以色列的大量支持。库尔德地区政府内战结束后，该党控制了伊拉克北部库尔德斯坦的大部分地区。"
 KUR.liberalism: "£KUR_liberalism_small 改革运动"
 KUR.liberalism_icon: "£KUR_liberalism_small"
 KUR.liberalism_desc: "自由主义 - 改革运动是最近的一个政党，反对腐败和库尔德民主党和库尔德爱国联盟的‘权力垄断’。它拒绝伊拉克库尔德斯坦的彻底独立，认为与伊拉克政府的对话可以带来一个双方都能接受的联邦化解决方案。"
 KUR.anarchist_communism: "£KUR_anarchist_communism_small 库尔德斯坦工人党"
 KUR.anarchist_communism_icon: "£KUR_anarchist_communism_small"
 KUR.anarchist_communism_desc: "左翼激进主义 - 库尔德工人党。库尔德工人党由阿卜杜拉-奥贾兰领导的土耳其库尔德学生创立，该党在其大部分时间里持续与土耳其进行血腥武装对抗。其主要活动区域在土耳其境内，同时在伊拉克库尔德斯坦设有分支机构和军事训练营。由于库尔德斯坦民主党和库尔德斯坦人民联盟主张与土耳其实现和平及贸易往来，库尔德工人党与这两大政党均处于对立状态。该组织属于极左翼团体，致力于终结资本主义并建立一个去中心化的民主社会主义社会。"
 KUR.Caliphate: "£generic_Caliphate_small 伊斯兰辅助者组织"
 KUR.Caliphate_desc: "萨拉菲圣战主义 - 伊斯兰辅助者组织是由极端的圣战教士毛拉-克雷卡尔组建的库尔德斯坦基地组织的一个分支。他们主要由萨达姆的伊拉克政府支持，为推翻伊拉克库尔德斯坦政府而战。"
