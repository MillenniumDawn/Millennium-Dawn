 CHI_054a_production_line: "La chaîne de production 054A"
 CHI_054a_production_line_desc: "Chaque flotte a besoin d'un cheval de labour, et le nôtre est le Type 054A. Construit sans interruption depuis 2008, cette frégate capable et abordable devient l'escorte standard de la marine, et le navire envoyé dans le golfe d'Aden lorsque la Chine a rejoint les patrouilles antipiraterie la même année, sa première mission soutenue en eaux lointaines."
 CHI_45g_national_deployment: "Déploiement du réseau 5G"
 CHI_45g_national_deployment_desc: "China Mobile lance la 4G commerciale, et en trois ans nous avons plus de stations de base que le reste du monde réuni. Le MIIT délivre des licences 5G aux trois opérateurs, et lorsque les opérateurs occidentaux débattent encore de leurs stratégies de déploiement, nous exploitons 4,1 millions de stations 5G servant un milliard d'utilisateurs. L'écart d'infrastructure n'est plus quelque chose que nous refermons ; c'est quelque chose que nous avons inversé."
 CHI_863_ic_preparatory_research: "Recherche préparatoire CI du programme 863"
 CHI_863_ic_preparatory_research_desc: "Sous le Plan national de développement des hautes technologies, la conception et la fabrication de circuits intégrés sont désignées comme domaine prioritaire. Des fonds d'État affluent vers les centres de recherche universitaires et les pilotes de fonderie naissants du delta de la Rivière des Perles et de Shanghai, posant le capital humain et la chaîne d'approvisionnement que le Fonds national CI fera plus tard passer à l'échelle industrielle. Nous plantons des graines dans un sol qui mettra une décennie à donner une récolte."
 CHI_863_nev_program: "Volet NEV du programme 863 et Dix villes"
 CHI_863_nev_program_desc: "Wan Gang, ingénieur devenu ministre qui a passé neuf ans chez Audi avant de rentrer en Chine, a argué que nous pouvions sauter entièrement les moteurs à combustion. Le programme Dix villes, mille véhicules déploie des flottes publiques NEV dans des villes pilotes ; Shenzhen électrifie l'ensemble de ses bus et taxis. La Gigafactory Tesla de Shanghai, bâtie en 357 jours depuis le premier coup de pioche, devient le catalyseur forçant chaque constructeur chinois de VE à rivaliser sur la qualité et la cadence. Nous n'aurions pas dû attendre moins du marché que nous avons créé."
 CHI_a_lighter_touch_on_dissent: "Une approche plus douce de la dissidence"
 CHI_a_lighter_touch_on_dissent_desc: "Plutôt que d'escalader la coercition intérieure, nous laissons un espace limité à l'expression de la société civile et au débat intellectuel dans des bornes soigneusement gérées. L'approche échange un contrôle politique à court terme contre une réduction des frictions qui nourrissent l'organisation clandestine."
 CHI_abolish_term_limits: "Abolition des limites de mandat"
 CHI_abolish_term_limits_desc: "L'Assemblée populaire nationale vote 2 958 pour, 2 contre et 3 abstentions pour retirer de la Constitution la limite de deux mandats à la présidence de l'État. Le vote est formellement unanime en tout sauf le nom. L'autorité n'est plus soumise à une horloge constitutionnelle. La décision élimine la contrainte institutionnelle la plus significative sur le pouvoir personnel depuis les réformes post-Mao."
 CHI_above_the_neck_reform: "Réforme au-dessus du cou"
 CHI_above_the_neck_reform_desc: "Les sept anciennes régions militaires répondaient à l'armée de terre et menaient leurs propres guerres. En 2016 nous coupons d'abord « au-dessus du cou » : la Commission militaire centrale saisit le commandement direct, cinq commandements de théâtre remplacent les régions, et un état-major interarmées naît pour combattre comme un seul. Le commandement avant les forces, la tête avant le corps."
 CHI_active_defense_doctrine: "Défense active"
 CHI_active_defense_doctrine_desc: "La défense active est la stratégie directrice de l'armée depuis Mao : défensive stratégiquement, mais offensive opérationnellement et tactiquement. Nous l'aiguisons pour l'âge des missiles, tenant que la plus sûre façon de défendre la patrie est de frapper la pointe ennemie avant qu'elle n'atterrisse."
 CHI_African_Continental_Integration: "Siècle sino-africain"
 CHI_African_Continental_Integration_desc: "Nous sommes devenus le premier partenaire commercial unique de l'Afrique, avec un commerce bilatéral dépassant 254 milliards de dollars par an. Des décennies d'investissement BRI dans les ports, chemins de fer et zones économiques spéciales ont rendu notre infrastructure et notre capital indispensables à l'agenda d'intégration continentale de l'Union africaine. Le temps est venu de convertir ce poids économique en partenariat institutionnel durable."
 CHI_agricultural_tax_abolition: "Abolition de l'impôt agricole"
 CHI_agricultural_tax_abolition_desc: "La question sannong — agriculture, campagne, paysans — était devenue explosive dans la Chine rurale bien avant que le débat formel n'atteigne Pékin. Un pilote de réforme fiscale rurale ancré dans l'Anhui a exposé à quel point le fardeau des levées locales avait étouffé les revenus paysans et l'investissement agricole. Le Document n° 1 du Comité central est revenu à la question rurale dix années de suite. Abroger l'ordonnance fiscale agricole de 1958 libère un capital rural qui attendait des décennies pour affluer vers la plaine centrale du Henan, la ceinture rizicole du Hunan et le bassin du Sichuan."
 CHI_AIIB_Founding: "Banque asiatique d'investissement pour les infrastructures"
 CHI_AIIB_Founding_desc: "La Banque asiatique d'investissement pour les infrastructures, que nous avons fondée avec 57 États membres malgré une opposition vigoureuse de Washington, fournit un financement multilatéral pour les infrastructures en Asie et au-delà. Son existence démontre que nous pouvons bâtir des institutions internationales crédibles entièrement hors du cadre de Bretton Woods. Le monopole occidental du financement du développement est brisé."
 CHI_An_Alliance_to_Rival_NATO_tt: "§YLes effets seront affichés une fois que nous aurons établi notre faction§!"
 CHI_anshan_steel_modernization: "Modernisation du complexe sidérurgique d'Anshan"
 CHI_anshan_steel_modernization_desc: "Le groupe sidérurgique d'Anshan, plus ancien et plus grand complexe sidérurgique intégré de Chine, subit un vaste programme de modernisation. Les fours Martin obsolètes sont remplacés par l'aciérie à l'oxygène, réduisant les coûts et relevant le plafond de qualité pour l'industrie aval."
 CHI_ant_group_empire: "L'empire financier d'Ant Group"
 CHI_ant_group_empire_desc: "Ant Group, essaimé d'Alibaba, bâtit un empire financier couvrant Yu'ebao, Zhima Credit, Huabei et MYbank, soutenant Paytm, GCash et Dana à l'international. Jack Ma défie publiquement les banques d'État au sommet du Bund, les comparant à des prêteurs sur gages. Quelques jours plus tard, la CSRC et le SAMR suspendent l'IPO de 34 milliards de dollars d'Ant 48 heures avant le lancement. La relation du secteur des plateformes avec l'État a changé, et chaque dirigeant technologique du pays comprend ce que cela signifie."
 CHI_anti_japanese_boycott_campaign: "Campagne de boycott anti-japonaise"
 CHI_anti_japanese_boycott_campaign_desc: "Les masses sont en colère. Nous n'avons pas créé leur colère. Nous choisissons seulement de ne pas nous y opposer, jusqu'au moment où nous choisissons de le faire."
 CHI_Arab_League_Cooperation_Forum: "Forum Chine-États arabes"
 CHI_Arab_League_Cooperation_Forum_desc: "Le Forum de coopération Chine–États arabes réunit les ministres des Affaires étrangères des 22 membres de la Ligue arabe pour coordonner les pipelines de projets BRI, la politique commerciale et l'alignement politique. Par lui nous maintenons un canal institutionnel permanent vers le Moyen-Orient qui contourne entièrement les cadres occidentaux. Les États arabes gagnent un levier sur leurs partenaires traditionnels par un accès démontré à notre capital, et nous gagnons un bloc dont les votes suivent notre lead."
 CHI_arms_for_influence: "Des armes contre de l'influence"
 CHI_arms_for_influence_desc: "Chaque caisse d'export achète plus que de l'argent. Nous armons des clients qu'aucun fournisseur occidental ne touchera et recouvrons la dette en ports, votes et loyauté, transformant le commerce d'armes de l'armée en un instrument discret de politique étrangère."
 CHI_army_aviation_corps: "L'aviation de l'armée de terre"
 CHI_army_aviation_corps_desc: "Une armée qui ne peut pas voler ne peut pas frapper vite. Nous développons l'aviation de l'armée de terre avec l'hélicoptère d'attaque Z-10 et le transport Z-20, donnant aux brigades rapides leurs propres canonnières et leur lift pour sauter le terrain et poser des troupes derrière l'ennemi."
 CHI_army_reorganisation: "Réorganiser l'armée"
 CHI_army_reorganisation_desc: "Les treize nouvelles armées de groupe sont équilibrées et renumérotées, chacune bâtie de brigades interarmes plutôt que de divisions lourdes. La force terrestre émerge plus mince, modulaire et enfin interchangeable, capable de masser ou de disperser selon le combat."
 CHI_artillery_modernisation: "Moderniser l'artillerie"
 CHI_artillery_modernisation_desc: "Les canons ne valent que le système qui les pointe. Radar de contre-batterie, conduite de tir numérique et obus de précision transforment l'artillerie d'une arme de zone en un scalpel, frappant juste dès la première salve."
 CHI_assuage_japanese_concerns: "Apaiser les inquiétudes japonaises"
 CHI_assuage_japanese_concerns_desc: "Ils surveillent nos garde-côtes. Ils surveillent nos essais de missiles. Aussi, lorsque nous annulons publiquement un exercice, ils le remarquent."
 CHI_astana_speech: "Ceinture économique de la Route de la soie"
 CHI_astana_speech_desc: "Un discours à l'université Nazarbaïev d'Astana a proposé de « construire conjointement une ceinture économique le long de la route de la soie » nous reliant à l'Europe via l'Asie centrale. Combinée à la Route de la soie maritime du XXIe siècle annoncée le mois suivant en Indonésie, l'initiative des Nouvelles routes de la soie prend forme. Le financement d'infrastructures, les concessions portuaires et les contrats ferroviaires doivent désormais affluer hors de Pékin à une échelle qui change l'ordre du monde."
 CHI_avic_reunification: "Réunifier AVIC"
 CHI_avic_reunification_desc: "Scindée en 1999 en deux moitiés rivales pour forcer la concurrence, l'industrie aéronautique n'a appris qu'à dupliquer et à se quereller. En 2008 AVIC I et AVIC II sont recousues en une seule Aviation Industry Corporation, un toit unique sur les chasseurs, moteurs et avioniques que l'armée de l'air attend depuis des décennies."
 CHI_Back_Channel_to_Foggy_Bottom: "Canal discret vers Foggy Bottom"
 CHI_Back_Channel_to_Foggy_Bottom_desc: "Des équipes diplomatiques chinoises et américaines établissent un canal discret via les arrière-salles d'ambassade et des interlocuteurs de piste II. Les deux parties reconnaissent en privé que la question coréenne ne peut se résoudre sans accommodation mutuelle."
 CHI_banking_recapitalisation: "Recapitalisation du secteur bancaire"
 CHI_banking_recapitalisation_desc: "Notre secteur bancaire a accumulé une charge écrasante de créances douteuses durant l'expansion du crédit des années 1990. Nous devons injecter du capital public pour nettoyer ces passifs des bilans des banques d'État, puis coter les institutions restructurées à la Bourse de Hong Kong. Des actionnaires minoritaires étrangers et des normes comptables internationales suivront, prêtant à notre système financier la crédibilité qui lui manque."
 CHI_baosteel_ipo: "L'IPO de Baosteel"
 CHI_baosteel_ipo_desc: "Baoshan Iron and Steel cote à la Bourse de Shanghai dans ce qui était alors la plus grande IPO de notre histoire, levant 7,7 milliards de yuans. Fondée avec une technologie sous licence de Nippon Steel, Baosteel a absorbé Shanghai Metallurgical Holding et Meishan sous la politique de Zhu Rongji de saisir le grand et relâcher le petit. Son intégration de tôles automobiles haut de gamme et de bandes électriques fixe le standard du secteur sidérurgique chinois en modernisation."
 CHI_baowu_merger: "La naissance de Baowu Steel"
 CHI_baowu_merger_desc: "La fusion de Baosteel Group et de Wuhan Iron and Steel Corporation crée China Baowu Steel Group, ancrant notre stratégie de champions sidérurgiques nationaux capables de rivaliser à l'échelle mondiale. Sous le président Chen Derong, Baowu acquiert ensuite Maanshan, Taiyuan, Chongqing et Xinjiang Bayi. Produisant plus de 115 millions de tonnes par an, Baowu a dépassé ArcelorMittal pour devenir le premier sidérurgiste mondial."
 CHI_bat_platform_rise: "L'essor des BAT"
 CHI_bat_platform_rise_desc: "Baidu, Alibaba et Tencent définissent notre Internet. Baidu domine la recherche après le départ de Google ; Alibaba a bâti le plus grand écosystème de commerce électronique au monde ; WeChat de Tencent atteint 1,3 milliard d'utilisateurs. L'environnement politique qui a tenu les rivaux occidentaux à l'écart n'a pas créé ces entreprises, mais il leur a donné l'espace pour grandir sans être rachetées ou détruites par le capital de la Silicon Valley. Cet espace était un choix stratégique, et il était juste."
 CHI_bayan_obo_ree_group: "Bayan Obo et China Rare Earth Group"
 CHI_bayan_obo_ree_group_desc: "Deng Xiaoping observait que le Moyen-Orient a le pétrole tandis que nous avons les terres rares. Le gisement de Bayan Obo à Baotou, en Mongolie-Intérieure, exploité par China Northern Rare Earth Group, est le plus grand gisement de terres rares légères au monde ; les mines de Ganzhou au Jiangxi fournissent les terres rares lourdes dont le dysprosium et le terbium. Le MIIT a consolidé six producteurs régionaux en China Rare Earth Group et China Northern Rare Earth Group. Les quotas d'export, formellement abolis après un arrêt de l'OMC, reviennent sous forme de licences d'export et de quotas de production qui obtiennent le même effet. Nous devons user de ce levier avant que d'autres ne trouvent des substituts."
 CHI_Beidou_Latin_Constellation: "Constellation latine Beidou"
 CHI_Beidou_Latin_Constellation_desc: "Des stations au sol de notre système de navigation Beidou en Argentine et au Venezuela étendent la précision de la constellation à l'hémisphère occidental et réduisent la dépendance régionale à l'infrastructure GPS des États-Unis. Les installations à double usage sous-tendent des contrats civils d'agriculture et de topographie tout en nous fournissant des données de positionnement stratégique. Washington traite les installations comme un défi direct à sa domination du renseignement d'origine électromagnétique dans les Amériques, et Washington a raison."
 CHI_beijing_action_plan_green_olympics: "Plan d'action pour des JO verts"
 CHI_beijing_action_plan_green_olympics_desc: "Notre candidature aux Jeux olympiques a promis au CIO un spectacle écologiquement responsable. Nous devons désormais tenir cette promesse : boisement à grande échelle, conversion charbon-gaz du réseau de chauffage de Pékin, relocalisation industrielle hors de la capitale, normes d'émissions des véhicules renforcées, et construction de sites dans six villes. Le monde regardera."
 CHI_beijing_command_clique: "La clique du commandement de Pékin"
 CHI_beijing_command_clique_desc: "Les cliques provinciales convergent vers la capitale. Un réseau de généraux achetés s'empare des organes de commandement à Pékin même, de sorte qu'aucune promotion, aucun contrat ni aucune affectation ne bouge sans sa bénédiction et sa part."
 CHI_Beijing_Communique: "Communiqué de paix de Pékin"
 CHI_Beijing_Communique_desc: "Nous nous sommes positionnés comme courtiers d'une normalisation historique saoudo-iranienne, amenant les deux rivaux régionaux à rétablir des relations diplomatiques sous notre médiation. Le communiqué démontre que nous pouvons livrer des résultats géopolitiques que Washington ne peut ou ne veut pas, cimentant notre crédibilité comme garant de sécurité alternatif. L'opinion régionale bascule désormais mesurablement vers notre leadership diplomatique, et nous devons presser cet avantage."
 CHI_beijing_tianjin_hsr: "Train à grande vitesse Pékin-Tianjin"
 CHI_beijing_tianjin_hsr_desc: "La ligne interurbaine Pékin–Tianjin de 117 kilomètres, parcourue en trente minutes à 350 km/h, marque l'ouverture de l'expansion du TGV chinois. La technologie sous licence de Kawasaki, Siemens, Alstom et Bombardier est absorbée et indigénisée via China South Railway et China North Railway, depuis fusionnées en CRRC. Une collision à Wenzhou entraîne une réduction de vitesse à 300 km/h et un renforcement des normes de qualité. Le réseau dépasse désormais 40 000 km, et nous n'avons fait que commencer à construire."
 CHI_below_the_neck_disband: "Dissoudre au-dessous du cou"
 CHI_below_the_neck_disband_desc: "Le haut commandement refait, le couteau se tourne vers le corps. Dès avril 2017 les réformes « au-dessous du cou » dissolvent les corps en brigades interarmes, coupent trois cent mille hommes et font passer l'armée de la masse à la manœuvre. Des armées entières disparaissent des rôles pour que ce qui reste puisse réellement combattre."
 CHI_Belt_and_Road_Vision: "Initiative des Nouvelles routes de la soie"
 CHI_Belt_and_Road_Vision_desc: "Lancer l'initiative des Nouvelles routes de la soie, investissant des centaines de milliards dans des projets d'infrastructure reliant l'Asie, l'Afrique et l'Europe à la Chine par routes, chemins de fer, ports et réseaux numériques."
 CHI_Bide_Your_Time: "Cacher sa force, attendre son heure"
 CHI_Bide_Your_Time_desc: "Suivre la maxime de Deng Xiaoping. Éviter la confrontation, bâtir des liens économiques et accumuler silencieusement la puissance nationale globale. L'essor de la Chine n'a pas à provoquer une coalition contre elle."
 CHI_big_four_ipo: "La vague d'IPO des Big Four"
 CHI_big_four_ipo_desc: "Nos banques d'État achèvent une vague de cotation sans précédent. China Construction Bank lève 9,2 milliards de dollars à Hong Kong ; la double cotation simultanée d'ICBC à Hong Kong et Shanghai établit un record mondial à 21,9 milliards ; Agricultural Bank of China le dépasse avec 22,1 milliards. ICBC est désormais la plus grande banque du monde par total d'actifs, et les Big Four rejoignent la liste du Conseil de stabilité financière des banques d'importance systémique mondiale. Central Huijin Investment demeure l'actionnaire dominant de chacune."
 CHI_big_fund_phase2: "Grand Fonds Phase II"
 CHI_big_fund_phase2_desc: "La deuxième phase du Fonds national des circuits intégrés lève 200 milliards de yuans, dirigés vers l'équipement, les matériaux et le packaging avancé pour combler les trous de chaîne d'approvisionnement que les sanctions américaines ont exposés. Une troisième phase de plus de 300 milliards de yuans suit, la plus grande mobilisation de capital unique de l'histoire des semi-conducteurs. La stratégie est passée de la montée en capacité à l'intégration verticale complète : de la plaquette brute au SoC encapsulé, chaque étape de la pile sera sourcée ou développée au pays. Rien de moins ne nous donnera la sécurité dont nous avons besoin."
 CHI_big_fund_phase_1: "Fonds d'investissement de l'industrie des semi-conducteurs"
 CHI_big_fund_phase_1_desc: "Le Conseil des affaires d'État a publié le Document n° 18, désignant les semi-conducteurs comme industrie stratégique. Le Fonds national d'investissement de l'industrie des circuits intégrés — le Big Fund — lève 138,7 milliards de yuans à sa première clôture, ancrant une mobilisation de capital menée par l'État à travers fonderie, conception et équipement. Nous canalisons les fonds vers SMIC, Huawei HiSilicon et une constellation de véhicules provinciaux de co-investissement. Nous ne pouvons plus nous permettre la dépendance technologique à TSMC et ASML, et ce fonds est notre déclaration d'intention."
 CHI_blue_granary_aquaculture: "Le grenier bleu"
 CHI_blue_granary_aquaculture_desc: "Notre secteur aquacole produit 52 millions de tonnes par an, environ 60 % de la production mondiale et 80 % de notre propre récolte aquatique. Le delta de la Rivière des Perles au Guangdong accueille les réseaux d'étangs à tilapia les plus denses au monde ; la côte Ningbo–Zhoushan du Zhejiang domine la production de crevettes et de crabes. Des cages expérimentales de saumon en eau profonde en mer Jaune transforment des districts d'agriculture côtière en pôles d'export de protéines, bien que le surusage d'antibiotiques et l'eutrophisation du lac Tai restent des coûts environnementaux non résolus que nous ne pouvons ignorer indéfiniment."
 CHI_bow_to_china_dream: "S'incliner devant le Rêve chinois"
 CHI_bow_to_china_dream_desc: "Quand la tempête anticorruption éclate, l'alliance plie plutôt que de se briser. La clique jure une loyauté bruyante au Rêve chinois de Xi Jinping, livre quelques figurants et achète sa survie en échangeant le pillage ouvert contre un privilège plus discret."
 CHI_break_the_first_island_chain: "Briser la première chaîne d'îles"
 CHI_break_the_first_island_chain_desc: "La chaîne s'étend de Kyushu aux Ryukyu jusqu'à Taïwan. Depuis quarante ans elle a enfermé notre marine dans les eaux côtières. La chaîne se brise là où le maillon le plus faible cède. Le maillon cédera."
 CHI_BRI_Forum_Beijing: "Forum des Nouvelles routes de la soie pour la coopération"
 CHI_BRI_Forum_Beijing_desc: "Le Forum des Nouvelles routes de la soie pour la coopération internationale, tenu à Pékin et croissant à chaque édition, réunit chefs d'État et hauts responsables de plus de 100 pays pour coordonner les pipelines de projets, signer des accords-cadres et projeter notre leadership de l'agenda mondial du développement. Nulle autre nation ne peut assembler un tel rassemblement autour de sa propre table."
 CHI_byd_catl_integration: "Construisez vos rêves"
 CHI_byd_catl_integration_desc: "BYD de Wang Chuanfu, fondée comme fabricant de batteries à Shenzhen, a arrêté la production de véhicules à combustion pure, sa technologie Blade Battery LFP cell-to-pack fixant de nouveaux standards de sécurité et de coût. CATL, basée à Ningde, a utilisé une liste blanche gouvernementale des batteries pour écarter Panasonic, LG et Samsung SDI assez longtemps pour bâtir une position inattaquable. Ensemble les deux sociétés contrôlent désormais plus de 60 % de la production mondiale de batteries pour VE. Nous avons bâti cette industrie de rien, et elle nous appartient."
 CHI_cadre_evaluation_reform: "Réforme de l'évaluation des cadres"
 CHI_cadre_evaluation_reform_desc: "Notre système d'évaluation des cadres a trop longtemps récompensé les officiels provinciaux qui livrent de la croissance du PIB tout en dégradant leur environnement et négligeant les services publics. Nous devons introduire des pondérations obligatoires pour la protection de l'environnement, l'harmonie sociale et l'intensité énergétique aux côtés de la production économique. Un officiel qui obtient de la croissance en détruisant les conditions de celle-ci ne mérite aucune promotion."
 CHI_cadre_rotation: "Système de rotation des cadres"
 CHI_cadre_rotation_desc: "La capture locale est la pourriture au cœur de la gouvernance chinoise. Les officiels trop longtemps au même poste développent des liens avec les intérêts locaux qui corrompent leur jugement. Un programme systématique de rotation s'appuie sur l'expérience de Chongqing pour déplacer régulièrement les cadres entre postes, brisant les réseaux de patronage avant qu'ils ne se solidifient."
 CHI_caojing_seven_chem_bases: "Bases pétrochimiques de Shanghai Caojing"
 CHI_caojing_seven_chem_bases_desc: "Le Conseil des affaires d'État désigne sept bases pétrochimiques nationales : le parc chimique de Shanghai à Caojing, puis Nanjing, Ningbo Daxie, Daya Bay, Quanzhou, Dalian et Caofeidian. Chaque base reçoit vapeur centralisée, traitement partagé des effluents, installations portuaires dédiées et vapocraqueurs d'éthylène intégrés, reproduisant le modèle Verbund pionnier de BASF à Ludwigshafen. BASF, Bayer, ExxonMobil, Shell et Saudi Aramco y accèdent par coentreprises ou filiales détenues à 100 %. Le complexe BASF de Zhanjiang, à 10 milliards d'euros, devient le plus grand investissement unique de BASF au monde — une mesure de ce que notre marché peut offrir au capital étranger lorsque nous choisissons de l'offrir."
 CHI_Central_Asia_Connectivity: "Ceinture économique de la Route de la soie"
 CHI_Central_Asia_Connectivity_desc: "La Ceinture économique de la route de la soie traverse l'Asie centrale par voie terrestre, ancrée par le port sec de Khorgos Gateway à la frontière kazakhe, hub de transbordement rail-route reliant l'écartement chinois au réseau à voie large russe. Les volumes de fret le long du corridor croissent à mesure que les temps de transit sous-cotent le maritime pour les cargaisons sensibles au délai. Nous devons accélérer l'investissement dans ce corridor avant que des puissances rivales n'en reconnaissent la valeur stratégique."
 CHI_central_china_development: "L'essor de la Chine centrale"
 CHI_central_china_development_desc: "Les provinces centrales du Henan, du Hubei et du Hunan ont été contournées par le boom côtier. Une initiative de développement coordonnée canalise des transferts fiscaux, de l'investissement d'infrastructure et de la manufacture relocalisée dans la région, ancrant le cœur démographique et agricole de la Chine à l'histoire de la croissance."
 CHI_central_manufacturing_belt: "Ceinture de fabrication centrale"
 CHI_central_manufacturing_belt_desc: "La hausse des salaires côtiers après 2008 pousse les industriels vers l'ouest, dans l'Anhui, le Jiangxi et le Hunan. Les incitations d'État à la relocalisation d'usines, combinées à des coûts fonciers et salariaux plus bas, transforment ces trois provinces en épine dorsale industrielle de milieu de gamme de la Chine en une décennie, absorbant des chaînes de production des deltas de la Perle et du Yangtsé à travers le textile, l'électronique et les composants automobiles."
 CHI_central_military_civil_fusion: "Fusion militaro-civile"
 CHI_central_military_civil_fusion_desc: "Le mur entre l'économie de guerre et l'économie civile est abattu par décret. Sous la stratégie de fusion militaro-civile de Xi Jinping, élevée en priorité nationale en 2017, chaque avance de l'électronique commerciale, de l'informatique et de l'aérospatiale est récoltée pour l'armée, et chaque percée de défense reflue vers l'industrie. La recherche de toute une nation devient le laboratoire de l'état-major."
 CHI_central_urbanization_drive: "Campagne d’urbanisation de la Chine centrale"
 CHI_central_urbanization_drive_desc: "On estime à cent millions les migrants ruraux des provinces centrales qui s'installent dans les capitales provinciales et les villes de comté. Nous devons accélérer la transition par des subventions au logement, des services urbains élargis et des assouplissements ciblés du hukou. L'intérieur central doit passer de réservoir de main-d'œuvre à marché de consommation tant que la fenêtre démographique est encore ouverte."
 CHI_Challenge_Dollar_Hegemony: "Défier l’hégémonie du dollar"
 CHI_Challenge_Dollar_Hegemony_desc: "Promouvoir le renminbi comme monnaie de réserve alternative et établir des accords de swap de devises bilatéraux, sapant l'étranglement du dollar sur la finance mondiale."
 CHI_change_lunar_exploration: "Programme lunaire Chang'e"
 CHI_change_lunar_exploration_desc: "Le programme lunaire robotique Chang'e a commencé par un orbiteur en 2007 et a progressé par des atterrissages en douceur, les rovers Yutu et la mission historique Chang'e 4 de janvier 2019, qui a posé un atterrisseur et un rover sur la face cachée de la Lune pour la première fois de l'histoire. Les données renvoyées ont remodelé notre compréhension de la géologie lunaire et posent le socle scientifique des missions habitées qui suivent."
 CHI_china_among_the_starts: "La Chine parmi les étoiles"
 CHI_china_among_the_starts_desc: "Notre programme Shenzhou nous a placés parmi la poignée de nations capables de vols spatiaux habités indépendants. Les missions suivantes ont établi l'amarrage orbital, les opérations extra-véhiculaires et les fondations d'une station spatiale permanente. Nous devons désormais bâtir sur ces acquis pour assurer notre statut de grande puissance spatiale à parité avec les Américains et les Russes."
 CHI_Chinese_Diplomacy: "Diplomatie chinoise"
 CHI_Chinese_Diplomacy_desc: "Le Royaume du Milieu a historiquement joué un rôle central dans les affaires d'Asie de l'Est. Maintenant que nous nous sommes relevés du Siècle d'humiliation, il est temps de tracer une stratégie diplomatique globale couvrant voisins régionaux et institutions mondiales."
 CHI_chongqing_model_nationalisation: "Le modèle de Chongqing"
 CHI_chongqing_model_nationalisation_desc: "Chongqing sous Bo Xilai a démontré qu'une alternative étatiste au libéralisme de marché reste viable dans la République populaire. En renationalisant des actifs stratégiques et en orientant le crédit vers les entreprises d'État, la municipalité a affiché une croissance du PIB bien supérieure à la moyenne nationale. Nous étendrons ce modèle à tout le pays."
 CHI_cic_forex_reserves: "Société d'investissement chinoise"
 CHI_cic_forex_reserves_desc: "Nous avons accumulé plus de 1 400 milliards de dollars de réserves de change, parqués en bons du Trésor américain à faible rendement qui servent davantage les besoins de financement de l'Amérique que les nôtres. China Investment Corporation, capitalisée de 200 milliards de dollars, diversifie cette richesse souveraine vers le private equity mondial, les infrastructures et les actifs stratégiques. Après des pertes précoces sur Blackstone et Morgan Stanley durant la crise financière, CIC mûrit en investisseur discipliné gérant plus de 1 300 milliards de dollars, parmi les plus grands fonds souverains du monde."
 CHI_cj10_cj20_cruise_missile_family: "Les CJ-10 et CJ-20"
 CHI_cj10_cj20_cruise_missile_family_desc: "Les missiles de croisière longue portée donnent aux bombardiers leur punch. Le CJ-10 lancé du sol et le CJ-20 lancé de l'air permettent à un seul H-6 de frapper des cibles fixes à quinze cents kilomètres, multipliant la portée de toute la force sans risquer un équipage au-dessus de la cible."
 CHI_cloud_computing_triumvirate: "Le triumvirat du cloud"
 CHI_cloud_computing_triumvirate_desc: "Alibaba Cloud détient 39 % de notre marché du cloud public ; Tencent Cloud ancre les backends du jeu et de la fintech ; Huawei Cloud s'envole après les sanctions de 2019 comme alternative intérieure aux services américains. Les fournisseurs étrangers sont limités à des coentreprises sous la loi de cybersécurité. Nous avons bâti une infrastructure cloud intérieure assez vaste pour soutenir l'économie numérique sans dépendance étrangère, et ce n'était pas un accident."
 CHI_coastal_acceleration_doctrine: "Doctrine d'accélération côtière"
 CHI_coastal_acceleration_doctrine_desc: "Nos provinces côtières sont là où la croissance est la plus rapide et où les retours de la libéralisation sont les plus clairs. Nous devons concentrer les politiques préférentielles dans les deltas de la Rivière des Perles et du Yangtsé : multiplier les zones de transformation pour l'export, assouplir les quotas fonciers des parcs industriels, et permettre aux gouvernements côtiers d'émettre des obligations d'infrastructure avant l'intérieur. L'intérieur suivra lorsque la côte aura prouvé le modèle."
 CHI_coastal_sez_2nd_generation: "Zones économiques spéciales de deuxième génération"
 CHI_coastal_sez_2nd_generation_desc: "La première génération de ZES à Shenzhen et Pudong a prouvé le modèle. Une deuxième vague de zones est désignée à Shanghai et au Guangdong, avec des cadres juridiques améliorés, une logistique renforcée et de plus fortes protections de PI pour attirer un capital étranger à plus forte valeur."
 CHI_combat_engineer_modernisation: "Moderniser le génie"
 CHI_combat_engineer_modernisation_desc: "Ponts, brèches et fortifications décident si une brigade avance ou s'arrête. Le génie est rééquipé de véhicules modernes de pontage, de déminage et de terrassement pour que le terrain n'arrête plus jamais l'avance."
 CHI_commercial_launch_sector: "Secteur Lancement Commercial"
 CHI_commercial_launch_sector_desc: "Depuis 2015 une nouvelle génération de sociétés chinoises de lancement commercial est passée du plan à l'aire de lancement. LandSpace a fait voler la première fusée au méthane à atteindre l'orbite avec Zhuque-2 en 2023 ; Galactic Energy et iSpace ont mené plusieurs lancements réussis de petits satellites. Le soutien de l'État à cet écosystème élargit notre base industrielle, fait baisser les coûts de lancement et attire le capital privé dans l'économie spatiale."
 CHI_common_prosperity: "Prospérité commune"
 CHI_common_prosperity_desc: "La prospérité commune est désormais notre priorité de gouvernance. La croissance doit être réorientée vers le resserrement de l'écart de revenus, l'élargissement des services sociaux et le cadrage des excès du secteur privé. Sociétés de tutorat, plateformes technologiques et industries du divertissement doivent accepter de nouvelles bornes. L'objectif déclaré est un développement largement partagé ; l'effet pratique est que nous réaffirmons l'autorité sur des secteurs qui avaient grandi hors de notre portée, et les deux sont vrais à la fois."
 CHI_common_prosperity_original: "Prospérité commune"
 CHI_common_prosperity_original_desc: "Le but du développement n'est pas d'agrandir indéfiniment le gâteau en laissant les pauvres se battre pour les miettes. La prospérité commune signifie partager le gâteau équitablement à mesure que nous le faisons grandir — redistribuer les revenus, étendre les services sociaux, et veiller à ce que les fruits de l'industrialisation atteignent l'ouvrier qui a bâti l'usine autant que l'officiel qui l'a planifiée."
 CHI_Community_of_Shared_Future: "Communauté de destin partagé"
 CHI_Community_of_Shared_Future_desc: "Promouvoir le concept d'une communauté de destin partagé pour l'humanité, plaidant pour le multilatéralisme et la coopération gagnant-gagnant comme alternatives aux institutions menées par l'Occident."
 CHI_Comprehensive_Agreement_Investment: "Accord d'investissement UE-Chine"
 CHI_Comprehensive_Agreement_Investment_desc: "L'Accord global sur l'investissement, conclu après sept ans de négociations, accorderait à nos firmes un meilleur accès aux marchés de services européens en échange d'engagements de transparence sur les aides d'État. Le Parlement européen a suspendu la ratification après des sanctions mutuelles, mais la logique économique de l'accord demeure. Un accord ratifié abaisserait considérablement les barrières au capital chinois sur le marché unique du bloc, et nous devons presser Bruxelles de le relancer."
 CHI_construction_soe_champions: "Champions de la construction de l'État"
 CHI_construction_soe_champions_desc: "China State Construction Engineering Corporation, China Railway Construction Corporation, China Communications Construction Company et Power Construction Corporation détiennent collectivement sept des dix premières places du classement mondial des entrepreneurs. Des décennies de mégaprojets intérieurs nous ont donné une main-d'œuvre formée de plus de deux millions, des coûts unitaires inférieurs de vingt à trente pour cent aux concurrents occidentaux, et des réseaux d'approvisionnement qui sourcent les matériaux plus vite qu'aucun rival privé. Nous devons protéger ces avantages structurels, car ils se traduisent directement en coûts plus bas et délais plus courts pour chaque catégorie de construction de capital que nous entreprenons au pays ou vendons à l'étranger."
 CHI_cosco_global_network: "Le réseau maritime mondial de COSCO"
 CHI_cosco_global_network_desc: "La fusion de COSCO et China Shipping forme l'un des plus grands transporteurs de conteneurs au monde, et l'acquisition suivante d'Orient Overseas International étend encore notre portée. COSCO Shipping Ports exploite désormais des terminaux au Pirée, à Zeebrugge, Valence, Singapour, Abou Dabi et Chancay. La Route de la soie maritime du XXIe siècle relie ces nœuds en un réseau soutenu par l'État sur cinq continents. Nous ne devons plus jamais dépendre de transporteurs étrangers pour déplacer nos marchandises."
 CHI_Counter_Terrorism_Cooperation: "Coopération antiterroriste"
 CHI_Counter_Terrorism_Cooperation_desc: "Le terrorisme, le séparatisme et l'extrémisme menacent la stabilité régionale. En établissant des mécanismes conjoints de lutte antiterroriste au sein de l'OCS, nous pouvons coordonner le partage de renseignement et les opérations de sécurité entre États membres."
 CHI_crewed_lunar_landing: "Atterrissage lunaire avec équipage"
 CHI_crewed_lunar_landing_desc: "Le programme chinois d'alunissage habité vise la région polaire sud lunaire, avec un premier contact vers 2030. Le profil de mission couple la fusée lourde Longue Marche 10 au véhicule d'équipage Mengzhou et à l'atterrisseur Lanyue, lancés séparément depuis le site de Wenchang et se rejoignant en orbite lunaire. Le succès ferait de la Chine la deuxième nation à poser des humains sur la Lune."
 CHI_cross_strait_military_posture: "Posture militaire transdétroit"
 CHI_cross_strait_military_posture_desc: "Les forces indépendantistes ont consolidé le pouvoir politique à Taipei, et nous ne pouvons laisser ce basculement passer sans réponse. L'Armée populaire de libération doit intensifier sa posture à travers le détroit de Taïwan : exercices amphibies croissant en fréquence et en échelle, sorties aériennes dans la zone d'identification de défense de l'île devenues routine. La réunification n'est pas une simple préférence politique. C'est un objectif national fondamental, et la force derrière lui doit être indéniable."
 CHI_crossborder_ecommerce: "Commerce électronique transfrontalier"
 CHI_crossborder_ecommerce_desc: "Nos industriels vendent désormais directement aux consommateurs mondiaux, contournant les chaînes de distribution traditionnelles que les marques étrangères contrôlaient. Les cycles ultra-rapides de SHEIN partent des usines de Panyu à Canton ; Temu devient l'application américaine la plus téléchargée dans l'année de son lancement. Les exportations transfrontalières atteignent 400 milliards de dollars ; les gouvernements occidentaux répondent par des restrictions de seuil de minimis. Les murs tarifaires qu'ils reconstruisent nous disent à quel point nos exportateurs sont devenus efficaces."
 CHI_davos_boycott: "Boycott de Davos"
 CHI_davos_boycott_desc: "Le Forum économique mondial représente l'idéologie du capital apatride — un ordre qui subordonne le développement souverain aux préférences de la finance multinationale. Nous n'enverrons plus nos plus hauts officiels s'agenouiller devant des banquiers dans des stations de montagne suisses. Notre voie est l'autosuffisance et la croissance dirigée par l'État, non le Consensus de Washington habillé de neige alpine."
 CHI_Debt_Trap_Diplomacy: "Diplomatie du piège de la dette"
 CHI_Debt_Trap_Diplomacy_desc: "Étendre des prêts aux termes qui maximisent le levier chinois sur les nations débitrices. Quand elles ne peuvent pas rembourser, extraire des concessions stratégiques sous forme d'accès portuaire, de droits sur les ressources et d'alignement politique."
 CHI_defence_industry_consolidation: "Consolidation de l'industrie de défense"
 CHI_defence_industry_consolidation_desc: "AVIC, CSIC, NORINCO et les autres grands conglomérats de notre base militaro-industrielle sont puissants individuellement mais gaspilleurs dans l'agrégat. Nous devons les placer sous une tutelle SASAC plus serrée, éliminer les doublons, canaliser l'investissement de recherche vers les programmes prioritaires et imposer des contrats de performance à la direction des entreprises. Les installations de production dédiées au Sichuan et au Guangdong doivent être étendues, et le chantier de Jiangnan mérite un nouvel investissement de cale sans délai."
 CHI_designated_succesor: "Successeur désigné"
 CHI_designated_succesor_desc: "Le dessein de Deng Xiaoping d'un leadership collectif incluait un mécanisme de succession ordonnée : chaque dirigeant suprême cultiverait un successeur pour empêcher un pouvoir personnel indéfini. Nous naviguons désormais entre les attentes de cette tradition et la logique de notre propre consolidation. Un successeur désigné rassure les factions méfiantes d'une autorité personnelle sans frein, et le Tuanpai extrait une concession symbolique en échange de son acquiescement. C'est un prix qui vaut la stabilité."
 CHI_Digital_Silk_Road: "Route de la soie numérique"
 CHI_Digital_Silk_Road_desc: "Étendre l'infrastructure numérique chinoise aux nations en développement par des réseaux 5G, des câbles à fibre optique et des technologies de ville intelligente, créant une dépendance technologique durable."
 CHI_Digital_Silk_Road_Initiative: "Initiative de la Route de la soie numérique"
 CHI_Digital_Silk_Road_Initiative_desc: "Huawei et ZTE ont déjà bâti des réseaux 4G et 5G, des câbles sous-marins et des plateformes de surveillance de villes intelligentes dans plus de 80 pays. La Route de la soie numérique crée de profondes dépendances technologiques chez les États partenaires et nous donne un accès préférentiel à leur infrastructure de télécommunications. Nous devons accélérer ce programme avant que la pression réglementaire occidentale n'incite davantage de gouvernements à exclure nos firmes."
 CHI_digital_yuan_ecny: "Le yuan numérique"
 CHI_digital_yuan_ecny_desc: "La Banque populaire de Chine a lancé le projet de paiement électronique en monnaie numérique, distribuant l'e-CNY via les banques commerciales dans des pilotes à Shenzhen, Suzhou et Pékin. Deux cent soixante millions de portefeuilles sont désormais actifs. Le projet mBridge teste le règlement transfrontalier de MNBC avec Hong Kong, la Thaïlande et les EAU comme alternative à SWIFT. Le yuan numérique n'est pas un simple outil de paiement ; c'est l'infrastructure d'un ordre monétaire qui ne dépend pas de Washington."
 CHI_distant_water_fishing_strategy: "Stratégie de pêche en eaux lointaines"
 CHI_distant_water_fishing_strategy_desc: "Notre flotte de pêche lointaine dépasse désormais 2 500 navires travaillant les zones économiques exclusives de Mauritanie, Sierra Leone, Argentine et Pérou, un programme enraciné dans la première expédition de China National Fisheries Corporation vers les eaux ouest-africaines. La stratégie du Going Out ancre la pêche lointaine comme bras permanent de notre politique de sécurité alimentaire. Subventions au carburant, navires à glace et accords portuaires à Bata, Walvis Bay et Montevideo soutiennent les opérations, l'archipel de Zhoushan au Zhejiang servant de pôle principal de transformation."
 CHI_ditiao_gang_crackdown: "La répression de l'acier illégal"
 CHI_ditiao_gang_crackdown_desc: "Plus de 600 aciéries à four à induction non enregistrées, produisant quelque 140 millions de tonnes d'acier ditiao gang de mauvaise qualité par an, doivent être fermées. Le ministère de l'Industrie et des Technologies de l'information en a fait une pièce maîtresse de la réforme structurelle de l'offre. Les statistiques officielles de production monteront à mesure que la production parallèle est absorbée, la qualité de l'acier s'améliorera et les prix augmenteront à mesure que l'offre bas de gamme est retirée du marché. Les marchands de ronds à béton qui ont profité de ce chaos ont eu leur temps."
 CHI_document_nine: "Document n°9"
 CHI_document_nine_desc: "Un communiqué classifié du Parti intitulé « Sur l'état actuel de la sphère idéologique » identifie sept menaces idéologiques occidentales à réprimer : démocratie constitutionnelle, société civile, néolibéralisme, liberté de la presse, nihilisme historique, remise en cause du socialisme et doute sur la réforme du Parti. Des sessions d'étude obligatoires sont ordonnées dans les universités et les médias d'État. Les bornes de la pensée acceptable se contractent du jour au lendemain, et la loyauté se démontre par le rejet des concepts étrangers."
 CHI_domestic_eda: "EDA et PI nationaux"
 CHI_domestic_eda_desc: "Les logiciels d'automatisation de la conception électronique — les outils utilisés pour concevoir les circuits intégrés — étaient fournis presque exclusivement par Cadence, Synopsys et Mentor Graphics. Après que les États-Unis ont placé les outils EDA sur la liste de contrôle des entités, nous avons orienté l'investissement vers Empyrean Technology, Primarius et Xpeedic. La couverture EDA nationale a atteint une capacité de flux complet pour les nœuds matures, bien que la couverture des nœuds avancés pour la conception sous 5 nm reste partielle. La licence d'État de blocs de PI nationaux complète le développement EDA, et nous devons refermer l'écart restant avant que Washington ne remarque à quel point nous sommes proches."
 CHI_dragon_eye_over_lanzhou: "Œil du dragon sur Lanzhou"
 CHI_dragon_eye_over_lanzhou_desc: "La Chine bâtit son propre Aegis. Le destroyer Type 052C, mené par le Lanzhou commissionné en 2004, monte le radar à réseau phasé Type 346 « Œil du dragon » et le missile HHQ-9, donnant pour la première fois à un navire de guerre chinois une véritable défense aérienne de zone de flotte. La marine peut enfin garder ses propres cieux en mer."
 CHI_dual_credit_auto_export: "Système de double crédit et premier exportateur mondial"
 CHI_dual_credit_auto_export_desc: "Le règlement de double crédit assigne à chaque constructeur de notre marché des comptes distincts de consommation de carburant et de crédits NEV, créant un mécanisme de plafonnement et d'échange pour les véhicules électriques qui remplace les subventions directes par la pression concurrentielle. Nous exportons désormais plus de 5 millions de véhicules par an, dépassant le Japon comme premier exportateur automobile mondial. L'Union européenne impose des droits de 17 à 37 % en sus du tarif de base ; les États-Unis lèvent 100 % sur nos VE. Ni l'une ni l'autre barrière n'arrêtera ce que le marché a déjà décidé."
 CHI_eat_imperial_grain: "Mangez des céréales impériales"
 CHI_eat_imperial_grain_desc: "Une armée qui tient des hôtels, fait de la contrebande de voitures et commerce des armes est loyale à sa propre bourse, pas au Parti. En juillet 1998 Jiang Zemin a ordonné à l'APL de céder son empire commercial et de vivre désormais du grain de l'État, du budget seul. Nous poussons cette voie jusqu'au bout : une force professionnelle, payée et propre, qui ne répond qu'à Pékin."
 CHI_ecommerce_infrastructure: "Infrastructures chinoises du commerce électronique"
 CHI_ecommerce_infrastructure_desc: "Taobao a vaincu eBay Chine par des annonces gratuites et une messagerie intégrée, puis Tmall a étendu la plateforme aux vitrines B2C de marque pour les détaillants internationaux. JD.com a bâti son propre réseau de 1 500 entrepôts et une force de livraison à temps plein plus rapide que tout service logistique que nous ayons héritée. Le commerce électronique représente désormais 30 % de notre commerce de détail, la part la plus élevée de toute grande économie, et l'infrastructure qui le rend possible est entièrement nôtre."
 CHI_Economic_Framework_for_Unity: "Cadre économique pour l'unité"
 CHI_Economic_Framework_for_Unity_desc: "Les deux Corées et leurs patrons de grande puissance esquissent une feuille de route d'intégration économique. L'investissement chinois dans l'infrastructure nord-coréenne, les transferts technologiques sud-coréens et les garanties financières américaines forment les fondations d'une Corée unifiée possible."
 CHI_Economic_Reintegration: "Réintégration économique"
 CHI_Economic_Reintegration_desc: "Nous commençons le long processus d'intégration de l'économie nord-coréenne à notre sphère industrielle. L'investissement afflue vers le nord ; matières premières et main-d'œuvre affluent vers le sud. La relation tributaire coréenne, dormante depuis un siècle, est effectivement rétablie."
 CHI_Eight_Country_Initiative: "Initiative pacifique des huit pays"
 CHI_Eight_Country_Initiative_desc: "Un cadre consolidé de sécurité et d'économie proposé à huit États insulaires du Pacifique nous donnerait un accord régional de police, de surveillance des pêches et de réseau de données en une seule signature. L'initiative teste si notre capital diplomatique accumulé à travers le Pacifique peut se convertir en un arrangement collectif rivalisant l'architecture régionale que l'Australie maintient depuis des décennies. Le succès détermine si nous menons la conception institutionnelle du Pacifique ou si nous y participons seulement."
 CHI_eleventh_five_year_plan: "Onzième plan quinquennal"
 CHI_eleventh_five_year_plan_desc: "En avant !"
 CHI_establish_defence_conglomerates: "Établir les conglomérats de défense"
 CHI_establish_defence_conglomerates_desc: "Des usines éparses et des ministères en conflit ne peuvent armer une grande puissance. Nous rassemblons le secteur de la défense en une poignée de vastes conglomérats d'État, chacun champion national dans son domaine, capables de financer la recherche, de mettre en commun les talents et de répondre aux ordres de l'armée à l'échelle."
 CHI_Eurasian_Land_Bridge: "Pont terrestre eurasien terminé"
 CHI_Eurasian_Land_Bridge_desc: "Le service de fret Yiwu–Londres a démontré qu'un corridor ferroviaire terrestre ininterrompu de la Chine orientale à l'Europe occidentale est commercialement opérationnel. Une intégration eurasienne complète signifie que nos industriels peuvent atteindre les marchés européens en dix-huit jours plutôt que les trente-cinq exigés par mer. Nous devons désormais investir pour augmenter capacité et fréquence jusqu'à ce que la route rivalise le maritime en volume."
 CHI_Exercise_Paektu_Honor: "Exercice Paektu Honor"
 CHI_Exercise_Paektu_Honor_desc: "Nous signalons la retenue par un exercice militaire bilatéral mettant l'accent sur des postures défensives au Yalou. Le message à Washington est clair : nous pouvons gérer Pyongyang sans réponse escalatoire américaine."
 CHI_Expand_Foreign_Service: "Étendre le service diplomatique"
 CHI_Expand_Foreign_Service_desc: "Nous devons étendre rapidement notre réseau consulaire et notre corps diplomatique. Nulle autre nation sur terre n'a réussi à maintenir plus de postes diplomatiques dans le monde que nous, et nous devons presser cet avantage encore davantage."
 CHI_export_processing_zones: "Zones de transformation pour l'exportation"
 CHI_export_processing_zones_desc: "Des zones de transformation pour l'export désignées au Jiangsu, au Fujian et au Zhejiang offrent entreposage sous douane, douanes simplifiées et avantages de coût de main-d'œuvre qui attirent des opérations d'assemblage de Corée, de Taïwan et du Japon. La Chine devient le nœud d'assemblage final des réseaux de production d'Asie de l'Est."
 CHI_fabless_design_cluster: "Cluster de conception sans fabrique"
 CHI_fabless_design_cluster_desc: "Notre industrie de conception de semi-conducteurs s'est consolidée autour de Shenzhen et de Shanghai. Des subventions d'État ont attiré des centaines de startups dans la conception de puces pour l'électronique grand public, les communications et les accélérateurs d'IA. La proximité de Shenzhen avec l'assemblage de PCB, la fabrication à façon et les chaînes d'électronique grand public en fait le pôle naturel ; le cluster de conception de la ville a produit Himax, Rockchip, Allwinner et des dizaines de maisons de conception plus petites, souvent soutenues par des véhicules provinciaux du Big Fund. La profondeur de cet écosystème est notre avantage structurel."
 CHI_factional_balance: "Équilibre des factions"
 CHI_faw_changchun_automotive: "Extension FAW Changchun"
 CHI_faw_changchun_automotive_desc: "First Automobile Works, basée à Changchun, est notre plus ancien constructeur et le fondement sur lequel le reste de notre secteur automobile a été bâti. Nous devons étendre son portefeuille de coentreprises avec Volkswagen et Toyota tout en canalisant l'investissement d'État vers le développement de marques indigènes. La province du Jilin deviendra l'ancre de notre industrie automobile intérieure."
 CHI_fifty_vanke_handover: "Le transfert Vanke"
 CHI_fifty_vanke_handover_desc: "En décembre 1998 des milliers de sociétés gérées par l'armée ont été évaluées, enregistrées et cédées à la propriété civile. Des bras immobiliers valant une fortune, l'équivalent de cinquante promoteurs Vanke, quittent pour de bon les livres de l'armée. Les généraux perdent leurs fiefs, et le Parti gagne une épée plus propre."
 CHI_Five_Stars_Highway: "Corridor routier à cinq pays"
 CHI_Five_Stars_Highway_desc: "Un corridor routier transcontinental reliant les ports atlantiques brésiliens aux terminaux pacifiques péruviens traverse cinq pays et raccourcit le transit terrestre de semaines. Le projet est le vaisseau amiral de notre ambition logistique sud-américaine, dupliquant la logique économique du canal de Panama à l'échelle continentale. Nos entreprises de construction et institutions de financement porteront le fardeau du développement, et la gratitude de cinq nations suivra."
 CHI_flying_leopard_doctrine: "La doctrine du Léopard volant"
 CHI_flying_leopard_doctrine_desc: "La flotte apprend à frapper depuis l'air avant de posséder un porte-avions. Des chasseurs-bombardiers JH-7 « Léopard volant » basés à terre, armés de missiles antinavires, transforment l'aviation navale en un bras de frappe indépendant capable d'atteindre loin sur l'eau et de couler une force navale ennemie depuis le rivage."
 CHI_Forum_China_CELAC: "Forum de coopération Chine-CELAC"
 CHI_Forum_China_CELAC_desc: "La Communauté des États d'Amérique latine et des Caraïbes nous fournit un canal multilatéral qui contourne l'Organisation des États américains, longtemps dominée par Washington. Un forum ministériel bâti autour de l'infrastructure, du commerce et de l'investissement agricole nous donne un véhicule pour éroder la primauté institutionnelle des États-Unis dans leur propre hémisphère. Nous devons traiter ce cadre comme un investissement de long terme, non un geste unique."
 CHI_four_trillion_stimulus: "Un plan de relance de quatre mille milliards de yuans"
 CHI_four_trillion_stimulus_desc: "Un plan de relance de 4 000 milliards de yuans, équivalent à 12 % du PIB, est dirigé principalement vers les chemins de fer, autoroutes, aéroports et logements sociaux. Les gouvernements locaux empruntent via des véhicules de financement locaux pour cofinancer leur part du programme. China State Construction et China Communications Construction s'étendent rapidement sur les contrats qui en résultent. Nous évitons la récession tandis que le reste du monde se contracte, mais la relance génère un surplomb de dette dans les finances locales et accélère la formation d'une bulle immobilière dans des villes comme Ordos et Changzhou. Les coûts sont réels, et ils arriveront."
 CHI_FTA_2015: "Accord de libre-échange Chine–Corée du Sud"
 CHI_FTA_2015_desc: "Notre accord de libre-échange avec la Corée du Sud est désormais pleinement mis en œuvre. Réductions tarifaires, corridors logistiques conjoints et commerce agricole et électronique élargi approfondissent l'interdépendance bilatérale et donnent à Séoul un enjeu matériel dans des relations stables avec nous. Une Corée économiquement liée est moins susceptible de suivre le lead de Washington lorsque les deux s'opposent."
 CHI_game_licensing_regs: "Règlement sur les licences de jeu"
 CHI_game_licensing_regs_desc: "La NPPA plafonne le jeu des mineurs à trois heures par semaine, exigeant une application par reconnaissance faciale. Un éditorial de Xinhua décrit les jeux comme de l'opium spirituel, faisant chuter de 10 % le cours de Tencent en une seule séance. Les nouveaux titres exigent une licence banhao, avec préférence pour les thèmes patriotiques. Les approbations reprennent à mesure que les studios basculent vers les marchés étrangers, exportant un produit que la régulation a rendu idéologiquement fiable."
 CHI_geely_volvo_acquisition: "L'acquisition de Volvo par Geely"
 CHI_geely_volvo_acquisition_desc: "L'acquisition de Volvo Cars à Ford par Li Shufu pour 1,8 milliard de dollars a établi un modèle d'acquisitions chinoises à l'étranger axé sur la marque, la propriété intellectuelle et les réseaux de distribution plutôt que les usines. Geely acquiert ensuite la London Taxi Company, 49,9 % de Proton, 51 % de Lotus et 9,7 % de Daimler AG. Chaque acquisition n'est pas seulement une transaction commerciale mais une déclaration que les firmes chinoises peuvent posséder ce qu'elles n'assemblaient autrefois."
 CHI_Geneva_Carve_Out: "Cadre bilatéral de Genève"
 CHI_Geneva_Carve_Out_desc: "La tradition suisse de neutralité commerciale en fait un point d'entrée naturel pour notre capital cherchant un accès au marché européen qui évite le regard réglementaire de l'Union européenne. Un accord de libre-échange bilatéral et une série de mémorandums de marchés financiers donnent à nos banques et fonds souverains un pied-à-terre genevois sous une surveillance plus légère que toute juridiction comparable de l'UE. Berne gagne des commissions et du volume de transactions, tandis que nous gagnons une adresse financière occidentale crédible."
 CHI_Global_Ambitions: "Ambitions mondiales"
 CHI_Global_Ambitions_desc: "Nous sommes prêts à définir notre rôle sur la scène mondiale. La question n'est pas de savoir si nous serons une grande puissance, mais quelle sorte de grande puissance nous choisissons d'être."
 CHI_gobi_solar_offshore_wind: "La ceinture solaire du Gobi et les bases éoliennes offshore"
 CHI_gobi_solar_offshore_wind_desc: "Notre loi sur les énergies renouvelables et les tarifs d'achat de la NDRC ont bâti le cadre politique qui pilote l'effondrement du coût solaire. LONGi Green Energy, JinkoSolar, Trina Solar et JA Solar ont réduit le coût des panneaux sous 0,10 dollar par watt. La production de polysilicium au Xinjiang et au Sichuan fournit désormais plus de 80 % de la demande mondiale. La Grande Muraille solaire de Kubuqi en Mongolie-Intérieure, le parc solaire du désert de Tengger au Ningxia et la base solaire-éolienne de Hami au Xinjiang sont des installations à l'échelle du gigawatt ; l'éolien offshore s'étend à Yangjiang, Putian et Yancheng. L'engagement double carbone ancre le programme de façon permanente."
 CHI_governance_moderenisation: "Modernisation de la gouvernance"
 CHI_governance_moderenisation_desc: "Systèmes de crédit social, infrastructure d'identité numérique et réseaux de surveillance intégrés doivent être unifiés sous un cadre unique qui suit la conformité, récompense la coopération et signale la dissidence. Les technologies de ville intelligente fournissent un suivi en temps réel des mouvements urbains et des communications à une échelle qu'aucune administration précédente ne pouvait gérer. La gouvernance numérique est l'administration rendue lisible : une population visible pour nous à chaque niveau, et gouvernable en conséquence."
 CHI_grain_for_green_program: "Programme de reconversion des terres en forêts"
 CHI_grain_for_green_program_desc: "Les inondations catastrophiques du Yangtsé ont livré un verdict géologique sur des décennies de déforestation du plateau de Lœss : 4 150 morts, 21 millions d'hectares inondés, et un système fluvial incapable d'absorber son propre bassin. Le programme Grain-for-Green reconvertit les pentes de plus de 25 degrés en forêt ou prairie, remplaçant le revenu agricole perdu par des paiements en grain et en espèces. Nous couvrons 32 millions d'hectares ; l'agriculture consolidée sur les terres plates productives augmente les rendements à l'hectare dans les zones restaurées. Restauration et productivité ne sont pas des contraires."
 CHI_great_wall_suv_dominance: "Domination du SUV Haval de la Grande Muraille"
 CHI_great_wall_suv_dominance_desc: "Wei Jianjun a bâti Great Wall Motors en champion de nos SUV depuis une usine de Baoding que les constructeurs mondiaux ont à peine remarquée. Le Haval H6 est devenu le SUV le plus vendu en Chine quatre années de suite ; Haval est ensuite devenue une marque autonome, suivie de WEY, Ora, Tank et Poer. Great Wall exploite désormais des usines d'assemblage en Russie, en Thaïlande et au Brésil, ciblant des segments que les constructeurs occidentaux avaient systématiquement sous-estimés et laissés sans contestation."
 CHI_guatian_reckoning: "Le règlement de comptes"
 CHI_guatian_reckoning_desc: "La corruption ne peut rester enterrée pour toujours. Les barons de la logistique qui ont bradé des terres militaires et stocké des caisses de liqueur et d'or font face à leur jour de reckoning, et la clique doit choisir si elle livre quelques boucs émissaires ou serre les rangs et défie Pékin."
 CHI_Gulf_Yuan_Settlement: "Mécanisme de règlement du Gulf Yuan"
 CHI_Gulf_Yuan_Settlement_desc: "Les États du Conseil de coopération du Golfe commencent à tarifer une part significative des exportations de brut en renminbi, acheminée via le système de paiement interbancaire transfrontalier plutôt que SWIFT. Combiné aux lignes de swap des banques centrales et aux allocations RMB des fonds souverains, le basculement érode progressivement l'avantage structurel du pétrodollar. Les États-Unis perdent un levier de coercition financière qu'ils exercent depuis 1974."
 CHI_h20_programme: "Le programme H-20"
 CHI_h20_programme_desc: "Le dernier trou de l'arsenal de grande puissance est un bombardier furtif, et nous partons le refermer. Le H-20, un dessin d'aile volante dit capable d'emporter dix tonnes d'armes à quelque huit mille kilomètres sans ravitaillement, permettrait à la Chine de frapper à travers le Pacifique depuis son propre espace aérien. Avec lui, la jambe bombardier d'une vraie triade mondiale est complète."
 CHI_h6k_revival: "La renaissance du H-6K"
 CHI_h6k_revival_desc: "L'ancienne copie du Tu-16 renaît. Le H-6K échange sa soute à bombes contre des pylônes de missiles de croisière et reçoit des turbofans efficaces pour une bien plus grande portée, devenant une plateforme de stand-off qui lance des missiles d'attaque terrestre depuis au-delà des défenses ennemies. Quelque cent dix forment désormais le cœur de la force de bombardiers."
 CHI_harbin_equipment_manufacturing: "Base d'équipement lourd de Harbin"
 CHI_harbin_equipment_manufacturing_desc: "L'héritage d'industrie lourde soviétique de Harbin est modernisé et réorienté vers l'équipement de production d'électricité, les composants ferroviaires et les machines industrielles. La ville devient l'épine dorsale d'ingénierie de l'expansion infrastructurelle chinoise."
 CHI_Health_Silk_Road: "Route de la soie sanitaire"
 CHI_Health_Silk_Road_desc: "La Route de la soie sanitaire étend notre assistance médicale, la construction d'hôpitaux et les chaînes d'approvisionnement pharmaceutiques aux États partenaires de la BRI. Le cadre a gagné en prominence durant la pandémie de Covid-19, lorsque notre diplomatie vaccinale a renforcé notre standing de partenaire de développement sanitaire pour le Sud global. Nous devons désormais le formaliser et l'étendre pour que la dépendance aux institutions pharmaceutiques occidentales ne soit plus le défaut."
 CHI_heavy_combined_arms_brigade: "Brigades lourdes interarmes"
 CHI_heavy_combined_arms_brigade_desc: "Les chars seuls meurent vite. Nous massons le Type 99 avec infanterie chenillée, canons automoteurs et génie en brigades interarmes lourdes, formations de choc autonomes bâties pour briser une ligne fortifiée et continuer d'avancer."
 CHI_hebei_steel_group: "Groupe sidérurgique du Hebei"
 CHI_hebei_steel_group_desc: "La province du Hebei a consolidé Tangshan Iron and Steel, Handan Iron and Steel et des aciéries plus petites en Hebei Iron and Steel Group, formant ce qui deviendra HBIS. Des fusions parallèles ont créé Anshan-Benxi au Liaoning et Shandong Steel Group à la même période. Le Douzième plan quinquennal élève la consolidation en politique nationale, visant que les dix premiers producteurs contrôlent 60 % de la production. L'ère de mille petites aciéries concurrentes sur de minces marges doit s'achever."
 CHI_henan_grain_modernization: "Modernisation agricole du Henan"
 CHI_henan_grain_modernization_desc: "La province du Henan nourrit plus de gens que n'importe quel pays d'Europe. L'investissement dans le stockage, la capacité de transformation et les services de vulgarisation agricole relève les rendements et réduit les pertes post-récolte, renforçant la sécurité alimentaire nationale et libérant de la main-d'œuvre rurale pour le redéploiement industriel."
 CHI_high_speed_rail_one: "Première phase du train à grande vitesse"
 CHI_high_speed_rail_one_desc: "Nos premières lignes dédiées à grande vitesse s'ouvrent en succession rapide : Pékin–Tianjin, puis Wuhan–Canton, puis l'ambitieux corridor Pékin–Shanghai, qui sera la plus longue ligne à grande vitesse du monde. Le programme s'appuie sur la technologie CRH sous licence de constructeurs européens et japonais, que nos ingénieurs adaptent aux conditions chinoises. Ce qui commence comme un savoir emprunté deviendra le nôtre."
 CHI_hisilicon_kirin: "Plateforme mobile HiSilicon Kirin"
 CHI_hisilicon_kirin_desc: "HiSilicon, filiale semi-conducteurs de Huawei, a créé la série de SoC Kirin pour les combinés Huawei, introduisant un NPU sur puce avant tout concurrent occidental et atteignant la production en 7 nm chez TSMC. Après que les contrôles d'export américains ont coupé cet approvisionnement, Huawei a travaillé avec SMIC pour fabriquer le Kirin 9000S à un nœud de procédé réalisable au pays. Le programme a démontré qu'une maison fabless chinoise pouvait atteindre le palier de performance d'Apple et Qualcomm, et a fourni un modèle que chaque développeur de SoC intérieur suit désormais."
 CHI_Honiara_Security_Pact: "Accord de sécurité d'Honiara"
 CHI_Honiara_Security_Pact_desc: "Le cadre de sécurité avec les îles Salomon permet à la marine de l'Armée populaire de libération d'accoster, de se ravitailler et de mener des opérations depuis Honiara, à moins de 2 000 kilomètres du continent australien. Canberra réagit avec alarme, accélérant les calendriers AUKUS et faisant pression sur Washington pour une posture de dissuasion accrue dans le Pacifique. Le pacte nous donne notre premier pied-à-terre de sécurité reconnu à l'est de la première chaîne d'îles, et nous devons le sécuriser avant que Honiara ne soit pressée de reculer."
 CHI_hq17_medium_range_air_defense: "Défense moyenne portée en couches"
 CHI_hq17_medium_range_air_defense_desc: "Au-dessus de la couche de défense ponctuelle nous ajoutons une couverture moyenne portée, tissant missiles courts et plus longs en un bouclier en réseau pour qu'aucune approche ne reste ouverte entre la cime des arbres et la stratosphère."
 CHI_hq17_short_range_sam: "SAM à courte portée HQ-17"
 CHI_hq17_short_range_sam_desc: "Les brigades ont besoin de leur propre parapluie. Le HQ-17, développé à partir du Tor russe, fournit une défense ponctuelle à réaction rapide contre aéronefs, drones et munitions de précision, monté pour suivre le rythme de l'armure qu'il protège."
 CHI_hu_jintao_reign: "L'ère Hu Jintao"
 CHI_hu_jintao_reign_desc: "L'accession de Hu Jintao aux fonctions de secrétaire général, président et président de la Commission militaire centrale marque la transition de leadership la plus ordonnée de l'histoire de notre république. Son administration mettra l'accent sur la gouvernance institutionnelle et la décision collective plutôt que l'autorité personnelle, rapprochant notre système du type de succession régulière dont les États stables ont besoin."
 CHI_hua_hong_mature_node: "Capacité des nœuds matures de Hua Hong"
 CHI_hua_hong_mature_node_desc: "Hua Hong Semiconductor, à l'origine une coentreprise sino-française à Jinqiao, s'est réorientée vers une production spécialisée de nœuds matures : gestion de l'énergie, mémoire non volatile embarquée et puces analogiques pour l'automobile et l'IoT. Ses fabs 200 mm et 300 mm à Shanghai et Wuxi ont servi des chaînes d'approvisionnement intérieures que les sanctions occidentales ne pouvaient facilement atteindre. Le réinvestissement d'État a étendu la capacité et diversifié sa base de clients au-delà du marché d'export."
 CHI_hualong_nuclear_batch: "Construction de masse de Hualong One"
 CHI_hualong_nuclear_batch_desc: "Après avoir importé des réacteurs Westinghouse AP1000 à Sanmen et Haiyang, des EPR Framatome à Taishan et des VVER Rosatom à Tianwan, nous avons achevé notre propre conception de troisième génération. Hualong One, fusion de l'ACP-1000 de la CNNC et de l'ACPR-1000 de CGN, détient une propriété intellectuelle chinoise complète et répond aux exigences des utilitaires européens. L'unité 5 de Fuqing se connecte au réseau en premier ; la base nucléaire de Zhangzhou, Changjiang à Hainan, Fangchenggang et Taipingling suivent. La version d'export, HPR1000, entre en service à Karachi K-2 et K-3, et ce n'est que le début de notre programme d'export nucléaire."
 CHI_huawei_zte_export: "Exportations d’équipements Huawei"
 CHI_huawei_zte_export_desc: "Huawei et ZTE capturent plus de 35 % du marché mondial des équipements télécoms, l'avantage Polar Code de Huawei dans les normes 5G sous-tendant sa domination. Via la Route de la soie numérique, notre infrastructure atteint des opérateurs dans 170 pays. Les gouvernements occidentaux répondent par des interdictions et des restrictions de liste d'entités, mais l'infrastructure physique que nous avons déjà installée ne peut être retirée par la législation."
 CHI_huludao_schoolhouse: "L'école de Huludao"
 CHI_huludao_schoolhouse_desc: "Les porte-avions sont inutiles sans pilotes capables d'y atterrir. À Huludao l'Université de l'aviation navale dresse un pipeline dédié de pilotes de porte-avions, complet avec tremplin terrestre et brins d'arrêt, formant de zéro les aviateurs qui feront d'un pont en mouvement un lieu d'où combattre."
 CHI_hybrid_rice_super_program: "Programme de riz hybride super"
 CHI_hybrid_rice_super_program_desc: "Le Centre national chinois de recherche et développement du riz hybride de Yuan Longping à Changsha poursuit des jalons de rendement successifs, relocalisant chaque hiver son équipe de sélection à Sanya sur l'île de Hainan, où le climat tropical permet une culture toute l'année impossible sur le continent. Les variétés hybrides couvrent déjà 60 % de notre superficie rizicole, et un programme parallèle étudie désormais le riz de mer tolérant au sel pour la plaine de Chine du Nord. Nous devons soutenir cet investissement : la sécurité alimentaire est le fondement sur lequel repose toute autre ambition."
 CHI_hydrogen_green_steel: "Fabrication d’acier à l’hydrogène"
 CHI_hydrogen_green_steel_desc: "Nos cibles double carbone et le mécanisme d'ajustement carbone aux frontières de l'UE pressent nos sidérurgistes de décarboner avant que les tarifs étrangers ne fassent le choix pour eux. Baowu a commissionné une usine de démonstration de réduction directe à l'hydrogène d'un million de tonnes à Zhanjiang, en partenariat avec Rio Tinto. HBIS lance un projet similaire à Zhangjiakou utilisant de l'hydrogène vert d'électrolyse. Nous devons relever substantiellement la part des fours à arc électrique de notre production sur la prochaine décennie, et la planification de cette transition commence maintenant."
 CHI_hypersonic_strike_integration: "Intégration de la frappe hypersonique"
 CHI_hypersonic_strike_integration_desc: "La vitesse devient la nouvelle furtivité. Nous intégrons les armes hypersoniques, glissant plus vite que cinq fois la vitesse du son et manœuvrant jusqu'au bout, au paquet de frappe de l'armée de l'air, présentant aux défenses ennemies une menace qu'elles n'ont aucun moyen prouvé d'arrêter."
 CHI_ilrs_lunar_base: "Station internationale de recherche lunaire"
 CHI_ilrs_lunar_base_desc: "La Chine et la Russie ont signé en 2021 la feuille de route de la Station internationale de recherche lunaire, invitant des nations partenaires à bâtir un avant-poste de recherche conjoint près du pôle sud lunaire. Le programme priorise l'utilisation des ressources in situ, une infrastructure de surface permanente et un schéma de rotation d'équipage comparable au modèle des stations de recherche antarctiques. Nous engageons notre base industrielle et d'ingénierie à en faire une réalité."
 CHI_individual_soldier_system: "Le système du soldat individuel"
 CHI_individual_soldier_system_desc: "Le fusilier devient un nœud, pas seulement une gâchette. Un nouveau système du soldat regroupe optique, radio, navigation et gilet pare-balles en un kit, liant chaque fantassin au réseau de l'escouade et à la carte du commandant."
 CHI_Indo_Pacific_Strategy_Collapsed: "La stratégie indo-pacifique s’est effondrée"
 CHI_Indo_Pacific_Strategy_Collapsed_desc: "Le retrait de la Corée du Sud du cadre trilatéral États-Unis–Japon–Philippines rompt un maillon critique de la chaîne indo-pacifique de Washington. Le Japon est laissé à gérer seul ses angoisses de sécurité, et la crédibilité américaine à travers la région est ébranlée."
 CHI_Information_Warfare: "Guerre de l'information"
 CHI_Information_Warfare_desc: "Déployer médias d'État, opérations sur les réseaux sociaux et récits stratégiques pour façonner l'opinion publique dans les pays cibles et contrer la domination informationnelle occidentale."
 CHI_informatized_local_wars: "Gagnez des guerres locales informatisées"
 CHI_informatized_local_wars_desc: "Nous ne nous préparons plus à la guerre totale sur la plaine du Nord. La doctrine directrice devient gagner des guerres locales dans des conditions informatisées : campagnes courtes, brutales et de haute technologie à la périphérie de la Chine, tranchées par qui voit et frappe le premier sur un champ de bataille en réseau. Chaque réforme ci-dessous sert désormais cette seule exigence."
 CHI_inner_party_supervision_regulations: "Règlement sur la surveillance interne des partis"
 CHI_inner_party_supervision_regulations_desc: "Notre reddition de comptes interne au Parti s'est trop longtemps appuyée sur des normes informelles et des liens personnels. Nous devons adopter des règlements de supervision formels établissant des procédures obligatoires pour que les organes supérieurs inspectent, rapportent et sanctionnent les comités de parti subordonnés. Codifier ces mécanismes réduira l'espace pour que les officiels locaux opèrent comme des fiefs intouchables."
 CHI_integrated_air_and_space: "Air et espace intégrés"
 CHI_integrated_air_and_space_desc: "L'armée de l'air doit cesser d'être le parapluie de l'armée de terre et devenir un service stratégique à part entière. Nous poursuivons les « opérations air-espace intégrées, préparées à l'offensive comme à la défense », doctrine adoptée en 2004 qui lie chasseurs, bombardiers, missiles, satellites et alerte avancée en une seule portée. Le ciel et l'espace proche deviennent un seul théâtre, et il doit être nôtre."
 CHI_intra_party_democracy_experiments: "Expériences de démocratie intra-parti"
 CHI_intra_party_democracy_experiments_desc: "Plusieurs localités ont mené des élections compétitives à plusieurs candidats pour des postes du Parti au niveau du comté et du canton. Les partisans arguent que la sélection compétitive renforcera la légitimité et améliorera la gouvernance ; les critiques préviennent que des élections contestées éroderont la discipline idéologique et créeront une compétition factionnelle. L'issue de ces expériences déterminera si nous étendons ou réprimons le modèle."
 CHI_invigorate_country_through_STE: "Revigorer le pays par la STE"
 CHI_invigorate_country_through_STE_desc: "En 1995, près de la fin de son mandat, Jiang Zemin a avancé la stratégie de rajeunissement de la nation par la science et l'éducation. En priorisant l'investissement de recherche, le rattrapage technologique et l'enseignement supérieur, le plan vise à refermer l'écart avec le monde développé et à faire passer la Chine d'une économie tirée par le travail à une économie bâtie sur la connaissance."
 CHI_iron_ore_pricing_war: "La bataille des prix du minerai de fer"
 CHI_iron_ore_pricing_war_desc: "Baosteel a pris le relais de Nippon Steel comme négociateur principal des acheteurs chinois dans les pourparlers annuels de référence du minerai de fer avec Rio Tinto, BHP Billiton et Vale. Le système s'effondre à mesure que les achats spot de plus petites aciéries chinoises sapent la référence. L'arrestation du cadre de Rio Tinto Stern Hu à Shanghai et l'échec de l'offre de Chinalco pour 18 % de Rio Tinto marquent le pic de la friction diplomatique, et nous devons répondre en accélérant l'investissement minier à l'étranger en Australie et en Afrique de l'Ouest pour diversifier notre approvisionnement."
 CHI_j10c_multirole_refit: "La refonte du J-10C"
 CHI_j10c_multirole_refit_desc: "Le J-10 se dote de crocs. Le J-10C ajoute un radar AESA, le missile longue portée PL-15 et, dès 2021, un moteur intérieur WS-10B, transformant le chasseur léger en une véritable menace multirôle qui a depuis versé le sang dans les cieux d'Asie du Sud."
 CHI_j11b_sinification: "Siniser le J-11"
 CHI_j11b_sinification_desc: "Le Su-27 sous licence construit à Shenyang devient un appareil chinois. Le J-11B échange radar, avionique et missiles russes contre des systèmes intérieurs, libérant la lignée Flanker des pièces de Moscou et prouvant que l'industrie chinoise peut réingénierer un chasseur de première ligne de bout en bout."
 CHI_j16_strike_platform: "La plateforme de frappe J-16"
 CHI_j16_strike_platform_desc: "Le J-16 « Qianlong », un lourdaud biplace issu du Flanker, emporte un radar AESA, la plus profonde charge d'armes de la flotte et une longue portée. Désormais le jet de prédilection pour presser l'espace aérien de Taïwan, c'est la plateforme de frappe multirôle autour de laquelle l'escadre moderne est bâtie."
 CHI_jh7a_update: "La mise à jour du JH-7A"
 CHI_jh7a_update_desc: "Le JH-7A « Léopard volant », chasseur-bombardier biplace robuste, est modernisé avec de nouvelles armes de précision et des pods de désignation, maintenant un appareil de frappe maritime bon marché et éprouvé pertinent aux côtés de la flotte plus récente."
 CHI_jiang_doctrine_taiwan: "La doctrine Jiang sur Taïwan"
 CHI_jiang_doctrine_taiwan_desc: "La proposition en huit points de Jiang cadre la politique transdétroit autour de la réunification pacifique tout en refusant explicitement d'exclure la force. Intégrer cette doctrine à l'arsenal anti-accès croissant de l'APL nous donne un cadre coercitif crédible et élève le coût de l'indépendance de jure de Taïwan à un niveau qu'aucun gouvernement à Taipei ne peut politiquement se permettre de payer."
 CHI_jiangnan_changxing_move: "Le déménagement Jiangnan–Changxing"
 CHI_jiangnan_changxing_move_desc: "À l'étroit au cœur du vieux Shanghai, le chantier historique de Jiangnan ne peut grandir. Nous le déplaçons en aval vers l'île de Changxing, vers de vastes halles nouvelles et des postes en eau profonde bâtis pour poser des navires de guerre par dizaines. La relocalisation multiplie d'un coup notre capacité de construction et devient la forge de la flotte moderne."
 CHI_jiangnan_scale: "Développer le chantier naval de Jiangnan"
 CHI_jiangnan_scale_desc: "Les navires de guerre se gagnent sur la cale avant de se gagner en mer. Les vastes halles nouvelles du chantier de Jiangnan sur l'île de Changxing sont poussées à plein régime, posant destroyers et porte-avions en parallèle là où les rivaux les posent un à un."
 CHI_joint_operations_command: "Commandement des opérations conjointes"
 CHI_joint_operations_command_desc: "La victoire appartient désormais à qui fusionne terre, mer, air et forces de fusées en un seul poing. Nous dressons un véritable commandement d'opérations conjointes, câblant les cinq théâtres en une seule image pour qu'une bataille soit menée par toutes les forces armées à la fois, non par des armes qui se relaient. Cela débloque la structure de commandement de théâtre."
 CHI_Joint_Operations_tt: "Déclenche un événement de choix stratégique. L'option défensive forme ou étend la faction OCS avec l'Afghanistan, le Pakistan et le Tadjikistan. Les options punitive et de guerre totale créent au contraire des casus belli contre les talibans et le TTP via la réponse du Pakistan."
 CHI_joint_stock_city_banks: "Banques commerciales par actions et banques municipales"
 CHI_joint_stock_city_banks_desc: "Sous les Big Four, un riche second rang s'est développé. China Merchants Bank est devenue le leader de la banque de détail avec une banque mobile forte ; China Minsheng Bank, première banque non étatique, sert les PME ; HSBC détient 19,9 % de Bank of Communications. Plus de 130 banques commerciales municipales ancrent la finance régionale dans les villes de deuxième et troisième rang, élargissant l'accès au crédit des firmes privées et accélérant l'adoption des services bancaires numériques. Cette diversité d'institutions est une force que nous devons cultiver."
 CHI_joint_venture_framework: "Cadre industriel des coentreprises"
 CHI_joint_venture_framework_desc: "Un cadre complet régit le transfert de technologie, les exigences de contenu local et le rapatriement des profits dans les coentreprises. Les firmes étrangères gagnent l'accès au marché ; les partenaires chinois gagnent technologie et savoir de gestion qui s'écoulent progressivement vers les firmes intérieures."
 CHI_keep_the_shell_companies: "Garder les sociétés-écrans"
 CHI_keep_the_shell_companies_desc: "Ordonnés de céder, nous ne cédons que sur le papier. Les entreprises de l'armée sont réenregistrées sous des cousins, des prête-noms et des sociétés-écrans, leurs profits reflueant encore vers les unités qui les possèdent. Les auditeurs trouvent des bureaux vides ; les généraux gardent leurs recettes."
 CHI_kj2000_mainring_awacs: "Le KJ-2000 Mainring"
 CHI_kj2000_mainring_awacs_desc: "Après que Washington a bloqué la vente du Phalcon israélien, la Chine a bâti le sien. Le KJ-2000, un radar à réseau actif indigène monté sur un Il-76, donne à l'armée de l'air son premier véritable poste de commandement aéroporté, permettant aux chasseurs de frapper des cibles qu'ils ne pouvaient pas encore voir eux-mêmes."
 CHI_kj500_network_centric_hub: "Le hub réseau KJ-500"
 CHI_kj500_network_centric_hub_desc: "Le KJ-500, un radar fixe à trois réseaux sur un turbopropulseur Y-9, est l'œil de labour du ciel. Produit en nombre, il relie chasseurs, navires et missiles en une seule image, le hub volant de la guerre en réseau."
 CHI_KPA_Offensive_Readiness: "Préparation offensive de la KPA"
 CHI_KPA_Offensive_Readiness_desc: "Nous endossons discrètement un basculement de la posture de l'Armée populaire de Corée de la défense en profondeur à une préparation offensive avancée. Les transferts d'équipement s'accélèrent, et les sessions de planification conjointe sont élargies. La péninsule se rapproche du bord."
 CHI_leader_of_the_people: "chef du peuple"
 CHI_leader_of_the_people_desc: "La Troisième résolution historique du Parti communiste formalise le titre Renmin Lingxiu, « Leader du peuple », une désignation appliquée à seulement deux figures de l'histoire du Parti : Mao Zedong et Xi Jinping. Le portrait de Mao pend encore au-dessus de la porte Tian'anmen. Le troisième moment historique du Parti a trouvé sa figure historique, et le sens de cette continuité n'échappe à quiconque lit la résolution avec attention."
 CHI_leading_small_group_doctrine: "Groupes dirigeants centraux"
 CHI_leading_small_group_doctrine_desc: "Les petits groupes dirigeants centraux supervisent désormais simultanément la finance, la réforme économique, les affaires étrangères, la cybersécurité et la réforme militaire, tous présidés depuis un seul bureau. L'arrangement contourne la structure traditionnelle de comité du Politburo et concentre la décision là où elle peut bouger sans délai. Les technocrates exécutent ; le centre coordonne. La politique avance plus vite, et chaque sortie est subordonnée à une seule volonté."
 CHI_Let_Seoul_Lead: "Laissons Séoul diriger"
 CHI_Let_Seoul_Lead_desc: "Nous signalons notre acceptation du leadership sud-coréen dans tout processus d'unification éventuel. Les institutions démocratiques et le poids économique de Séoul en font l'ancre naturelle d'une Corée unifiée. Nous reculons pour laisser les Coréens déterminer leur propre avenir."
 CHI_liangjiang_new_area: "Zone nationale nouvelle de Liangjiang"
 CHI_liangjiang_new_area_desc: "Liangjiang à Chongqing devient la première nouvelle zone de niveau national à l'intérieur des terres, suivant Pudong à Shanghai et Binhai à Tianjin. La zone a attiré Ford, HP et plus de 300 entreprises du Fortune 500 et produit déjà 1,19 million de véhicules par an. La plaine de Guanzhong à Xi'an reçoit un investissement parallèle, positionnant le Shaanxi comme ancre commerciale et industrielle du nord-ouest. Le modèle est prouvé ; l'échelle est ce que nous devons désormais étendre."
 CHI_Lips_and_Teeth_Doctrine: "Doctrine des lèvres et des dents"
 CHI_Lips_and_Teeth_Doctrine_desc: "Nous réaffirmons le lien historique avec la Corée du Nord. Les deux pays sont, comme toujours, aussi proches que les lèvres et les dents. La survie de Pyongyang est notre impératif stratégique, et nous agirons en conséquence quelle que soit la pression internationale."
 CHI_Lithium_Triangle_Accord: "Accord triangulaire sur le lithium"
 CHI_Lithium_Triangle_Accord_desc: "L'Argentine, la Bolivie et le Chili détiennent ensemble plus de la moitié des réserves mondiales de lithium récupérables. Des accords d'enlèvement à long terme et des participations dans des entreprises d'extraction donnent aux fabricants chinois de batteries et de véhicules électriques un accès fiable à la matière première qui définit le prochain paradigme énergétique. Les accords isolent les chaînes d'approvisionnement chinoises des coalitions d'achat occidentales."
 CHI_Liu_Huaqing_Doctrine: "Doctrine Liu Huaqing"
 CHI_Liu_Huaqing_Doctrine_desc: "L'amiral Liu Huaqing, architecte de notre stratégie navale moderne, a identifié les première et deuxième chaînes d'îles comme le périmètre stratégique à l'intérieur duquel notre puissance maritime doit établir une domination incontestée avant de se projeter plus loin. La mer de Chine méridionale se situe entièrement dans la première chaîne. Nous ne pouvons nous projeter vers l'extérieur tant qu'elle n'est pas pleinement sécurisée, et nous ne pouvons retarder cette sécurité indéfiniment."
 CHI_liu_huaqing_first_island_chain: "La première chaîne d'îles de Liu Huaqing"
 CHI_liu_huaqing_first_island_chain_desc: "La ligne court des Kouriles aux Ryukyu et à Taïwan jusqu'à Bornéo, et derrière elle les mers proches doivent être nôtres. L'amiral Liu Huaqing, père de la PLAN moderne, enseignait qu'une marine d'eaux vertes doit d'abord dominer la première chaîne d'îles avant de rêver de l'océan ouvert. Sa doctrine de défense au large fixe notre cap : dénier les approches, maîtriser les mers proches, puis regarder au-delà."
 CHI_livestream_commerce: "Commerce en direct"
 CHI_livestream_commerce_desc: "Taobao Live fusionne divertissement et achat en temps réel à une échelle qu'aucun équivalent occidental n'a atteinte. Viya et Austin Li génèrent des milliards en ventes d'une seule session ; 40 % de notre commerce électronique passe désormais par les canaux de live. Des agences MCN gèrent des milliers de créateurs, et les régulateurs imposent une stricte conformité fiscale pour que la richesse qui traverse ces plateformes atteigne l'État en proportion. Le format est nôtre à définir, et le monde regarde."
 CHI_logistic_modernisation: "Moderniser la logistique"
 CHI_logistic_modernisation_desc: "Les réformes au front ne valent rien si la queue logistique se rompt. Nous standardisons les conteneurs, palettisons les charges et numérisons la chaîne d'approvisionnement sous la nouvelle Force de soutien logistique conjoint, pour qu'une brigade puisse être soutenue aussi vite qu'elle peut avancer."
 CHI_long_march_modernisation: "Modernisation de Longue Marche"
 CHI_long_march_modernisation_desc: "La famille de lanceurs Chang Zheng, développée par la China Aerospace Science and Technology Corporation, constitue l'épine dorsale de tout notre programme spatial. Moderniser les chaînes d'assemblage et améliorer la manutention des propergols sur les variantes CZ-2, CZ-3, CZ-5 et CZ-7 augmente la cadence et la fiabilité des lancements, tandis que les avancées transversales en propulsion alimentent directement nos programmes de missiles."
 CHI_long_range_firepower: "Puissance de feu à longue portée"
 CHI_long_range_firepower_desc: "La portée l'emporte sur la masse. Nous poussons les roquettes longue portée et les munitions rôdeuses dans les brigades lourdes, pour qu'elles pulvérisent la profondeur ennemie, ses postes de commandement et ses réserves avant même que les chars n'en viennent au contact."
 CHI_loongson_riscv: "Architecture Loongson et RISC-V"
 CHI_loongson_riscv_desc: "La lignée de processeurs Loongson de l'Institut de technologie informatique offre une alternative nationale au x86 et à l'ARM pour les serveurs gouvernementaux et les systèmes embarqués. Parallèlement, l'architecture d'instruction ouverte RISC-V a attiré nos investissements via RISC-V International et des startups nationales, dont T-Head d'Alibaba, Nuclei System Technology et SiFive China. La licence ouverte de RISC-V isole nos conceptions nationales de l'exposition aux contrôles d'exportation américains sur les jeux d'instructions, et cette isolation vaut davantage chaque année."
 CHI_lunar_sample_return: "Retour d'échantillon lunaire"
 CHI_lunar_sample_return_desc: "Chang'e 5 a ramené 1,73 kilogramme de basalte lunaire du Mons Rumker en décembre 2020, les premiers nouveaux échantillons lunaires sur Terre depuis la mission soviétique Luna 24 en 1976. Chang'e 6 a suivi en juin 2024, récupérant du matériau du bassin du pôle Sud-Aitken, sur la face cachée, une première pour tout programme spatial. Nous concentrons nos ressources sur cette voie scientifique robotique, en étendant l'architecture de retour d'échantillons à de nouveaux sites et en accélérant la recherche qu'elle permet."
 CHI_made_in_china_2025: "Fabriqué en Chine 2025"
 CHI_made_in_china_2025_desc: "Nous ne pouvons plus rester l'atelier du monde. Dix secteurs prioritaires sont identifiés pour une transformation en leadership de haute technologie : robotique, aérospatiale, véhicules électriques, dispositifs médicaux avancés, semi-conducteurs, et d'autres encore. Subventions d'État, programmes d'acquisition technologique et objectifs d'approvisionnement national obligatoire sont nos instruments. Washington et Bruxelles seront mécontents, mais c'est une direction que nous devons tenir."
 CHI_Maritime_Silk_Road_Indian_Ocean: "Stratégie du collier de perles"
 CHI_Maritime_Silk_Road_Indian_Ocean_desc: "Une chaîne d'investissements portuaires et d'installations logistiques sur le littoral de l'océan Indien, dont Hambantota au Sri Lanka et Doraleh à Djibouti, étend notre portée commerciale et potentiellement navale de la mer de Chine méridionale à la Corne de l'Afrique. Les critiques décrivent ce schéma comme un collier de perles encerclant l'Inde. Ils n'ont pas tout à fait tort, et c'est précisément le but."
 CHI_mass_line_education: "La ligne de masse"
 CHI_mass_line_education_desc: "La campagne de la ligne de masse du Parti appelle les cadres à rejeter le formalisme, le bureaucratisme, l'hédonisme et le luxe. Les banquets somptueux sont interdits ; les montres coûteuses confisquées à ceux photographiés les portant en public. Notre relation avec le peuple doit être recadrée comme un service plutôt qu'un privilège. Le message est aussi politiquement commode qu'authentiquement populaire, et nous ne devons pas le gâcher."
 CHI_mass_line_renewed: "Ligne de masse renouvelée"
 CHI_mass_line_renewed_desc: "La ligne de masse de Mao Zedong posait que le parti doit apprendre du peuple avant de pouvoir le diriger. Cadres et étudiants sont dépêchés dans les bourgs ruraux et sur les chaînes d'usine. Les campagnes d'écoute remplacent les directives descendantes, et l'expérience accumulée des masses est réintégrée à la politique du parti. La révolution n'est pas un dîner de gala."
 CHI_mature_node_counter_offensive: "Contre-offensive des nœuds matures"
 CHI_mature_node_counter_offensive_desc: "Après que les contrôles d'exportation occidentaux ont restreint notre expansion aux nœuds avancés, nous réorientons l'investissement de capacité vers les nœuds matures inférieurs à 28 nm. SMIC, Hua Hong, CXMT et des dizaines de fonderies plus petites lancent des expansions parallèles à Shanghai, Shenzhen et Hangzhou. Nous représentons désormais plus de 33 pour cent des ajouts mondiaux de capacité en nœuds matures. Les gouvernements occidentaux, alarmés par la perspective d'une domination chinoise du segment des nœuds matures alimentant l'électronique automobile, industrielle et de défense, débattent de droits de douane secondaires. Nous devons consolider notre position avant l'arrivée de ces tarifs."
 CHI_Media_Offensive: "Offensive médiatique"
 CHI_Media_Offensive_desc: "Lancer une campagne médiatique mondiale coordonnée via CGTN, Xinhua et les plateformes sociales pour projeter les perspectives chinoises et contrer les récits hostiles."
 CHI_Mekong_Riparian_Cooperation: "Coopération Lancang-Mékong"
 CHI_Mekong_Riparian_Cooperation_desc: "Le mécanisme de coopération Lancang-Mékong organise le développement d'infrastructures conjointes, la gestion des ressources en eau et la facilitation du commerce parmi les six États riverains qui partagent le système fluvial. Nos barrages en amont et nos projets d'amélioration de la navigation nous donnent un levier considérable sur les voisins d'aval qui dépendent du débit que nous contrôlons. Nous devons formaliser ce cadre avant que ce levier ne soit qualifié de coercition."
 CHI_memory_independence: "Indépendance en puces mémoire"
 CHI_memory_independence_desc: "YMTC, basée à Wuhan et soutenue par le Grand Fonds, a atteint la production de NAND 3D à 128 couches et l'architecture Xtacking à 232 couches, au niveau de Samsung et Micron à une génération comparable. CXMT à Hefei produit de la DDR4 en 17 nm et développe des flux de procédés compatibles DDR5. La brève qualification par Apple de la NAND YMTC a montré que notre mémoire avait atteint le grade commercial avant que la pression américaine ne force son retrait de la liste des fournisseurs d'Apple. La ligne HBM2 de CXMT a commencé la production de masse en avance, se qualifiant pour les accélérateurs IA Cambricon et Biren et mettant fin à la dépendance à la mémoire étrangère dans notre chaîne de calcul haute performance."
 CHI_mengshi_program: "Le programme Mengshi"
 CHI_mengshi_program_desc: "Le Mengshi, véhicule léger blindé chinois sur le modèle du Humvee, motorise l'infanterie légère avec un engin robuste, résistant aux mines, capable de monter mitrailleuses, missiles ou tourelleau téléopéré."
 CHI_miit_licensing_framework: "Licences MIIT et restructuration des opérateurs"
 CHI_miit_licensing_framework_desc: "Le ministère de l'Industrie et des Technologies de l'information doit formaliser le cadre de licences qui sépare notre ancien monopole des Postes et Télécommunications en opérateurs commerciaux distincts. Les règles d'attribution du spectre, la tarification de l'interconnexion et une obligation de service universel sont codifiées, créant le fondement réglementaire sur lequel China Mobile, China Unicom et China Telecom construiront les plus grands réseaux 4G et 5G du monde. L'ère du monopole a servi son but ; la concurrence servira la phase suivante."
 CHI_military_training_outline: "Le nouvel outline d'entraînement"
 CHI_military_training_outline_desc: "Un nouvel Outline d'entraînement militaire est publié dans toute la force, le règlement qui fixe les normes et les tâches de chaque unité. Pour la première fois, il est rédigé autour d'opérations conjointes et en réseau, liant toute l'armée à une seule mesure exigeante de préparation."
 CHI_mobile_payment_duopoly: "Le duopole du paiement mobile"
 CHI_mobile_payment_duopoly_desc: "Alipay, lancé comme service d'entiercement d'Alibaba, est devenu une plateforme de paiement indépendante. WeChat Pay a gagné 200 millions d'utilisateurs en cinq jours grâce à une campagne d'enveloppes rouges du Nouvel An chinois. Les codes QR remplacent désormais le cash dans plus de 90 pour cent de nos transactions, écartant Visa, Mastercard et les fintechs occidentales avant qu'elles n'établissent une tête de pont. Nous avons bâti l'infrastructure de paiement grand public la plus avancée du monde, et elle fonctionne entièrement hors de l'architecture financière occidentale."
 CHI_money_alliance: "L'alliance de l'argent"
 CHI_money_alliance_desc: "Richesse et commandement fusionnent en une faction. Les officiers les plus fortunés et les magnats de la contrebande qui les financent se lient, assez forts pour se protéger et dicter leurs termes au Parti qui les commande nominalement."
 CHI_Monroe_Doctrine_Inverted: "Doctrine Monroe inversée"
 CHI_Monroe_Doctrine_Inverted_desc: "Des décennies d'investissement patient, d'ouverture diplomatique et de crédit d'infrastructure nous ont repositionnés comme partenaire extérieur indispensable de l'Amérique latine, un rôle que les États-Unis traitaient naguère comme leur domaine exclusif. La capacité de Washington à mobiliser des coalitions hémisphériques contre nous s'est érodée au point que la doctrine Monroe n'est plus appliquée en pratique. Les Amériques ne sont plus un lac américain. Nous devons veiller à ce qu'elles ne le redeviennent jamais."
 CHI_national_overall_emergency_response_plan: "Plan national d'urgence"
 CHI_national_overall_emergency_response_plan_desc: "La crise du SRAS a exposé avec une clarté douloureuse les lacunes de notre préparation nationale aux urgences. Nous devons établir un cadre de réponse unifié couvrant catastrophes naturelles, urgences de santé publique, accidents et troubles sociaux, avec des ressources prépositionnées, des structures de commandement claires et des protocoles de coordination inter-agences à chaque niveau administratif. La prochaine crise ne s'annoncera pas."
 CHI_naura_amec: "Programmes d'équipement NAURA et AMEC"
 CHI_naura_amec_desc: "NAURA Technology Group et Advanced Micro-Fabrication Equipment produisent des outils de gravure, CVD et PVD pour nos fonderies nationales. NAURA a obtenu la qualification chez SMIC pour l'équipement de gravure 28 nm ; les outils de gravure Primaxx d'AMEC sont entrés en lignes de production à haut volume. Les deux firmes bénéficient de la demande captive de SMIC et des injections du Grand Fonds. Leur portefeuille combiné couvre désormais environ 40 pour cent des étapes de procédé d'une fonderie logique en nœud mature. Les 60 pour cent restants sont là où nous devons nous concentrer ensuite."
 CHI_nco_corps_reform: "Un corps de sous-officiers professionnels"
 CHI_nco_corps_reform_desc: "Une armée moderne tient par ses sergents, pas seulement par ses colonels. Nous bâtissons un véritable corps de sous-officiers, soldats de carrière dotés de grade, de solde et d'autorité, remplaçant l'ancienne dépendance aux conscrits de courte durée et comblant le fossé entre officier et recrue."
 CHI_new_energy_vehicles_startups: "Les pionniers du véhicule à énergie nouvelle"
 CHI_new_energy_vehicles_startups_desc: "NIO, XPeng, Li Auto, l'alliance HIMA de Huawei et Xiaomi sont entrés dans l'automobile entre 2014 et 2024, soutenus par le capital technologique plutôt que par les entreprises d'État. Chacun a apporté aux véhicules le logiciel de l'ère du smartphone, des capacités d'IA et une reconnaissance de marque grand public. La berline SU7 de Xiaomi a attiré 88 898 précommandes en 24 heures ; le SUV YU7 a décroché 240 000 commandes verrouillées dès le premier jour."
 CHI_New_World_Order: "Nouvel Ordre Mondial"
 CHI_New_World_Order_desc: "Notre domination informationnelle et notre portée médiatique ont posé les bases d'un défi fondamental à l'ordre international dirigé par l'Occident. Nous devons désormais tirer parti de nos réseaux d'influence, des médias d'État et d'outils clandestins pour promouvoir un monde multipolaire où nos propres normes et modèles de gouvernance fixent l'agenda mondial."
 CHI_norinco_rationalism: "NORINCO rationalisé"
 CHI_norinco_rationalism_desc: "China North Industries, fabricant tentaculaire de tout, du fusil de service à l'artillerie, est élagué et recentré. Les lignes redondantes ferment, les rentables se consolident, et l'arsenal des forces terrestres parle enfin d'une seule voix industrielle."
 CHI_northeast_revitalization_plan: "Plan de revitalisation du Nord-Est"
 CHI_northeast_revitalization_plan_desc: "Les provinces de la ceinture de rouille — Liaoning, Jilin et Heilongjiang — ont fortement décliné après la réforme des entreprises d'État. Le gouvernement central lance un programme de revitalisation en 2003, canalisant investissement d'infrastructure, crédit préférentiel et capacités industrielles relocalisées vers la région."
 CHI_northeast_russia_corridor: "Corridor économique Nord-Est–Russie"
 CHI_northeast_russia_corridor_desc: "Les infrastructures commerciales transfrontalières liant le Heilongjiang à l'Extrême-Orient russe sont modernisées, permettant les flux de ressources, l'investissement transfrontalier et des projets de développement conjoints. Le corridor renforce le partenariat stratégique sino-russe d'une substance commerciale."
 CHI_open_the_august_1st_building: "Ouvrir le bâtiment du 1er août"
 CHI_open_the_august_1st_building_desc: "Le bâtiment du 1er août abrite la Commission militaire centrale, où l'Armée populaire de libération répond au Parti et à personne d'autre. Le soulèvement de Nanchang du 1er août 1927 a donné au Parti ses premiers fusils ; la date nomme encore l'armée elle-même. Sa refonte commence maintenant : corruption purgée ou tolérée, divisions reconstruites en brigades, une force aérienne fusionnée avec l'espace, et une garde côtière transformée en flotte hauturière."
 CHI_Operation_New_Dawn: "Opération Nouvelle Aube"
 CHI_Operation_New_Dawn_desc: "Le moment est venu. Des officiers soutenus par la Chine au sein de l'APK se dressent contre le complexe de la famille Kim. Ce qui suivra sera bref, violent et décisif. L'État nord-coréen survivra ; sa direction, non."
 CHI_Oppose_Strategic_Flexibility: "S'opposer à la flexibilité stratégique"
 CHI_Oppose_Strategic_Flexibility_desc: "La doctrine washingtonienne de « flexibilité stratégique », autorisant les forces américaines en Corée du Sud à se déployer hors de la péninsule, constitue un empiétement inacceptable sur nos intérêts de sécurité. Nous en exigeons formellement le recul."
 CHI_organisation_department_mandate: "Organisation Département Mandat"
 CHI_organisation_department_mandate_desc: "Le Département de l'organisation du PCC gère la nomination, l'évaluation et le transfert de plus de 70 millions de cadres du parti, ce qui signifie que quiconque contrôle le département contrôle l'avenir du personnel du parti. Sous la direction de Zeng Qinghong, le département a resserré le contrôle des nominations de direction provinciale et réorienté ses critères d'évaluation en faveur des officiels aux solides bilans de développement industriel."
 CHI_organisation_department_mandate_tt: "Le §Y$CHI_organisation_department_1$§! sera toujours actif lorsque §YZeng Qinghong§! est le dirigeant du pays."
 CHI_original_innovation_problem: "Le problème de l'innovation originale"
 CHI_original_innovation_problem_desc: "Copier nous a menés jusqu'à la frontière ; cela ne peut nous la faire franchir. La réforme la plus dure est culturelle, exigeant l'innovation originale que la science bureaucratique a longtemps étouffée. Nous finançons le risque, tolérons l'échec et récompensons la percée qu'aucun plan étranger ne peut fournir."
 CHI_own_designs: "Nos propres conceptions"
 CHI_own_designs_desc: "Pendant une génération, nous avons rétro-ingéniéré des plans soviétiques et appelé cela du progrès. Plus maintenant. Les bureaux d'études reçoivent l'ordre d'originer plutôt que d'imiter, et d'apposer un sceau chinois sur l'arme suivante plutôt qu'un emprunt."
 CHI_Pacific_Island_Forum_Pivot: "Pivot du Forum des îles du Pacifique"
 CHI_Pacific_Island_Forum_Pivot_desc: "Nous devons accélérer notre offensive diplomatique auprès des États insulaires du Pacifique, en offrant des subventions d'infrastructure à faible dette, des accords de pêche et des paquets de reconnaissance diplomatique. Le Forum lui-même devient une arène contestée tandis que nous cultivons des voix décisives et des observateurs sponsorisés. L'Australie et la Nouvelle-Zélande, qui ont historiquement dominé les cadres institutionnels du Pacifique, verront leur leadership contesté à chaque session ministérielle jusqu'à ce qu'elles concèdent notre place."
 CHI_Pax_Sinica: "Pax Sinica"
 CHI_Pax_Sinica_desc: "Un ordre international sino-centré, dans lequel notre poids économique, la dépendance infrastructurelle et l'alignement politique déplacent l'ordre libéral fondé sur des règles comme principe organisateur des affaires mondiales. Les savants l'ont nommé Pax Sinica. Nous l'appelons simplement le monde tel qu'il devrait être. L'atteindre représenterait le couronnement de notre siècle de rajeunissement."
 CHI_Peaceful_Development: "Développement pacifique"
 CHI_Peaceful_Development_desc: "Démontrer par l'action que la montée de la Chine est une force de stabilité mondiale. Investir dans le maintien de la paix, le secours aux catastrophes et l'aide au développement pour bâtir une réputation de puissance responsable."
 CHI_pearl_river_delta_tech_cluster: "Cluster électronique du delta de la rivière des Perles"
 CHI_pearl_river_delta_tech_cluster_desc: "Le delta de la rivière des Perles consolide sa position de plus grande base mondiale de fabrication électronique. Shenzhen accueille Huawei et ZTE ; Dongguan se remplit des sous-traitants taïwanais ; toute la région fonctionne comme une seule chaîne d'approvisionnement intégrée pour l'électronique grand public mondiale."
 CHI_Peninsula_Strategy: "La stratégie de la péninsule"
 CHI_Peninsula_Strategy_desc: "Nous sommes à la croisée des chemins sur la péninsule coréenne. Des décennies d'ambiguïté calculée doivent céder la place à une posture stratégique délibérée. Nous choisirons notre voie avec soin, sachant que chaque option porte des conséquences irréversibles pour l'ordre régional."
 CHI_peoples_armed_police_integration: "Intégrer la police armée"
 CHI_peoples_armed_police_integration_desc: "La Police armée du peuple, forte de deux millions d'hommes, est fermement rattachée à la Commission militaire centrale à partir de 2018, sécurisant l'arrière et la frontière afin que l'armée de campagne soit libre de combattre vers l'extérieur."
 CHI_Petrocaribe_Successor: "Successeur de Petrocaribe"
 CHI_Petrocaribe_Successor_desc: "Le programme pétrolier préférentiel du Venezuela pour les États des Caraïbes et d'Amérique centrale s'est effondré sous les sanctions et la mauvaise gestion économique. Nous devons intervenir comme créancier stabilisateur, étendant des prêts gagés sur le pétrole à Caracas, La Havane et Managua en échange d'engagements d'approvisionnement à long terme. L'arrangement approfondit nos liens avec des gouvernements déjà isolés des marchés de capitaux occidentaux, et leur gratitude sera durable."
 CHI_Petroyuan_Settlement: "Initiative du pétroyuan"
 CHI_Petroyuan_Settlement_desc: "Nous devons lancer des contrats à terme sur le pétrole brut libellés en yuan à l'International Energy Exchange, créant un mécanisme pour que les exportateurs d'énergie des Nouvelles routes de la soie règlent en renminbi plutôt qu'en dollars américains. Une adoption soutenue érodera la domination du pétrodollar et réduira notre exposition aux sanctions financières américaines. Chaque baril coté en yuan est un pas vers un système financier international auquel nous pouvons faire confiance."
 CHI_pgz_gun_missile_hybrid: "Défense hybride canons-missiles"
 CHI_pgz_gun_missile_hybrid_desc: "Le système automoteur PGZ marie un autocanon guidé par radar à des missiles courte portée sur un même châssis, abattant les aéronefs volant bas, hélicoptères et drones qui se glissent sous l'enveloppe des missiles."
 CHI_phl_mlrs_modernisation: "Modernisation des roquettes PHL"
 CHI_phl_mlrs_modernisation_desc: "Le PHL-03 et le PHL-16 modulaire donnent à l'armée une artillerie-roquettes longue portée atteignant des centaines de kilomètres, brouillant la ligne entre batterie de roquettes et missile tactique et permettant à une brigade de frapper profondément derrière le front."
 CHI_pipechina_gas_reform: "Dégroupage de PipeChina"
 CHI_pipechina_gas_reform_desc: "China Oil and Gas Piping Network Corporation reçoit environ 600 milliards de yuans d'actifs de gazoducs, d'installations de stockage et de terminaux GNL transférés de CNPC, Sinopec et CNOOC. Le modèle X+1+X place un unique opérateur de midstream neutre entre de nombreux producteurs amont et de nombreux distributeurs aval, ouvrant une infrastructure que les compagnies pétrolières nationales contrôlaient exclusivement. ENN Energy, China Resources Gas, Beijing Enterprises et les fournisseurs de GNL étrangers y accèdent tous, et le marché de la distribution du gaz devient véritablement concurrentiel pour la première fois."
 CHI_Piraeus_Model: "Modèle de port du Pirée"
 CHI_Piraeus_Model_desc: "L'acquisition par COSCO d'une participation majoritaire dans le port du Pirée a transformé le principal havre commercial de la Grèce en le port à conteneurs le plus actif de la Méditerranée et en modèle pour notre gestion portuaire en Europe. Le modèle apporte des retours économiques mesurables aux gouvernements hôtes tout en ancrant notre contrôle opérationnel aux goulets stratégiques. Des participations minoritaires à Lisbonne et Hambourg maintiennent ces capitales engagées sans déclencher le contrôle réglementaire qu'une acquisition majoritaire provoquerait."
 CHI_plz_howitzer_program: "Le programme d'obusiers PLZ"
 CHI_plz_howitzer_program_desc: "L'artillerie, longtemps l'orgueil et le goulot de l'armée, passe entièrement à l'automoteur. Le PLZ-05, obusier chenillé de 155 mm en service depuis 2008, égale la portée et la cadence occidentales et forme la ligne de feux de chaque brigade lourde."
 CHI_Polar_Silk_Road: "Route de la soie polaire"
 CHI_Polar_Silk_Road_desc: "Notre Livre blanc de politique arctique déclare la Chine « État quasi-arctique » et cautionne le développement de routes maritimes transpolaires comme extension septentrionale de la Route de la soie maritime. La fonte de la glace de mer rend la Route maritime du Nord commercialement viable, réduisant les temps de transit entre nous et l'Europe jusqu'à deux semaines. Nous devons revendiquer notre place dans l'architecture de gouvernance de l'Arctique avant que d'autres ne ferment la porte."
 CHI_policy_banks_cdb: "Banques politiques"
 CHI_policy_banks_cdb_desc: "La Banque de développement de Chine, la Banque d'import-export de Chine et la Banque de développement agricole de Chine forment une architecture de financement parallèle qui opère hors des contraintes commerciales normales. La CDB est désormais la plus grande institution de finance du développement au monde, plus vaste que la Banque mondiale et la Banque asiatique de développement combinées, finançant le barrage des Trois-Gorges, le TGV et plus de 600 milliards de dollars américains de prêts d'infrastructure des Nouvelles routes de la soie dans plus de 100 pays. Ces trois banques ne sont pas de simples institutions financières ; ce sont des instruments de stratégie nationale."
 CHI_politics_law_commision_realigned: "Commission des affaires politiques et juridiques réalignée"
 CHI_politics_law_commision_realigned_desc: "La Commission des affaires politiques et juridiques coordonne l'appareil de sécurité, les tribunaux et le parquet. L'aligner fermement derrière le modèle de Chongqing signifie bâtir une infrastructure de surveillance capable d'identifier les menaces avant qu'elles ne cristallisent, isolant la révolution de la subversion étrangère comme du sabotage intérieur."
 CHI_poly_goes_global: "Poly se mondialise"
 CHI_poly_goes_global_desc: "Poly Technologies porte fusils et missiles chinois en Afrique, au Moyen-Orient et en Amérique latine, tandis que Poly Culture transforme les recettes en maisons de vente et immobilier. La maison de commerce de l'armée devient un conglomérat mondial, ses affaires notre diplomatie, ses profits hors de portée de tout budget."
 CHI_Post_Armistice_Architecture: "Architecture post-armistice"
 CHI_Post_Armistice_Architecture_desc: "Nous et les États-Unis proposons conjointement un successeur à l'armistice de 1953 : un cadre de paix global qui mettrait formellement fin à la guerre de Corée et établirait des garanties de sécurité régionales acceptables pour toutes les parties."
 CHI_Predatory_Lending_Doctrine: "La doctrine Hambantota"
 CHI_Predatory_Lending_Doctrine_desc: "Lorsque le Sri Lanka n'a pu honorer son prêt du port d'Hambantota, il a signé un bail de 99 ans transférant le contrôle opérationnel à l'une de nos entreprises d'État. Nous devons formaliser ce modèle : structurer les projets dès l'origine pour que les actifs stratégiques deviennent collatéral, convertible en droits d'accès à long terme en cas de défaut. Le débiteur choisit les termes en choisissant de rembourser ou non."
 CHI_private_oem_rise: "Montée des OEM privés"
 CHI_private_oem_rise_desc: "Seuls les Quatre Grands d'État étaient désignés partenaires de coentreprise, mais les gouvernements provinciaux ont soutenu leurs propres constructeurs malgré tout. Chery Automobile à Wuhu, Geely au Zhejiang et Great Wall Motors à Baoding ont chacun trouvé des voies vers une production légale et se sont hissés. Les constructeurs privés assemblent désormais un tiers de nos véhicules particuliers, occupant les segments SUV, bas coût et VE que les coentreprises ont choisi d'ignorer. Nous ferions bien de les soutenir."
 CHI_project_921: "Projet 921"
 CHI_project_921_desc: "En septembre 1992, la Commission militaire centrale a approuvé le projet 921, le plan directeur d'une capacité chinoise de vol habité. La décision a établi le bureau de vol habité de CASC, financé la conception du vaisseau Shenzhou et engagé la nation à atteindre l'orbite sous ses propres couleurs."
 CHI_project_998: "Projet 998"
 CHI_project_998_desc: "En 1995 et 1996, deux groupes aéronavals américains ont pénétré le détroit de Taïwan et notre marine n'a pu que regarder. Le projet 998 est la réponse à cette humiliation : un renforcement naval soutenu visant le jour où les porte-avions reviendront, échangeant une force de défense côtière contre une force capable de contester les eaux au large de notre propre côte."
 CHI_Project_Coordination_Cell: "Groupe de coordination du projet BRI"
 CHI_Project_Coordination_Cell_desc: "Nos corridors des Nouvelles routes de la soie couvrent des dizaines de pays et des centaines de projets, et sans organe de coordination ils accumuleront retards, redondances et vulnérabilités politiques. Le Département international du Comité central, le Zhonglianbu, doit présider un groupe interministériel pour filtrer les demandes, désigner des chefs de projet et suivre les délais. L'ordre produit des résultats. Les résultats soutiennent la confiance."
 CHI_project_jxx: "Projet J-XX"
 CHI_project_jxx_desc: "Lancé à la fin des années 1990 comme projet J-XX, le programme donne le J-20 « Dragon puissant », volé en 2011 et en service en 2017. Furtif, à long rayon d'action et lourdement armé de missiles, c'est le premier chasseur de cinquième génération hors des États-Unis et de la Russie, conçu pour chasser les ravitailleurs et les avions d'alerte avancée dont dépend toute machine de guerre du Pacifique. La Chine rejoint le plus petit club du ciel."
 CHI_project_no_10: "Projet numéro 10"
 CHI_project_no_10_desc: "Le J-10, né du secret projet 10, est le premier chasseur indigène moderne de la Chine, un biréacteur monomoteur polyvalent de Chengdu dont la configuration ne doit rien à un plan soviétique. C'est l'appareil sur lequel une industrie nationale de chasseurs apprend d'abord à se tenir seule."
 CHI_property_tax_pilot_program: "Programme pilote de taxe foncière"
 CHI_property_tax_pilot_program_desc: "Shanghai et Chongqing ont lancé les premiers pilotes d'impôt foncier, prélevant des taux modestes sur les résidences secondaires et les résidences principales de grande valeur. Les pilotes visent à tempérer les achats spéculatifs et à diversifier les recettes des gouvernements locaux hors de la vente de terrains. Si les résultats tiennent, nous devons étendre le modèle à l'échelle nationale avant que le marché immobilier ne devienne un passif trop lourd à gérer."
 CHI_provincial_reshuffle: "Remaniement à la direction provinciale"
 CHI_provincial_reshuffle_desc: "Zeng a orchestré une vaste rotation de personnel au Congrès national du peuple. Les vétérans de la faction de Shanghai reçoivent des postes clés : Chen Liangyu comme secrétaire du parti de Shanghai, Huang Ju élevé au Comité permanent du Politburo, Jia Qinglin prenant la présidence de la CCPPC. Le remaniement ancre l'influence des princelings sur les provinces les plus riches et l'appareil consultatif de l'État."
 CHI_provincial_youth_league_cohort: "Promouvoir la cohorte provinciale de la Ligue de la jeunesse"
 CHI_provincial_youth_league_cohort_desc: "Li Keqiang au Henan. Wang Yang à Chongqing. Liu Yandong en ascension. Le banc du Tuanpai est profond et patient — qu'il avance."
 CHI_public_health_reconstruction: "Nouveau programme médical coopératif rural"
 CHI_public_health_reconstruction_desc: "Le Nouveau régime coopératif médical rural mutualise les cotisations des résidents ruraux, du gouvernement local et du budget central pour couvrir les coûts médicaux catastrophiques. C'est le premier programme systématique d'assurance santé rurale de l'histoire de notre république, et nous devons le mener à une couverture quasi universelle aussi vite que possible. Huit cents millions de paysans ne doivent pas être ruinés simplement pour être tombés malades."
 CHI_public_rental_housing_drive: "Campagne de logements locatifs publics"
 CHI_public_rental_housing_drive_desc: "Des millions de travailleurs migrants urbains et de diplômés vivent dans des logements de fortune à la merci de propriétaires privés. L'État mobilisera des ressources de construction pour bâtir des logements locatifs publics abordables dans les grandes villes, à loyers subventionnés et avec un droit d'achat après trois ans de location."
 CHI_pudong_financial_hub: "Centre financier de Pudong"
 CHI_pudong_financial_hub_desc: "La nouvelle zone de Pudong à Shanghai est développée comme principal pôle financier offshore de la Chine. La construction de la skyline de Lujiazui, de la Bourse de Shanghai et de zones de commerce sous douane signale l'ambition de la Chine de défier Hong Kong et Singapour comme centres financiers régionaux."
 CHI_qbz191_rifle: "Le fusil QBZ-191"
 CHI_qbz191_rifle_desc: "Le QBZ-95 bullpup vieillissant cède la place au QBZ-191, un fusil à configuration classique à optiques sur rail mis en service à partir de 2019. Une arme moderne pour un fantassin désormais attendu de combattre en réseau, et non seul."
 CHI_qinghai_tibet_railway_planning: "Chemin de fer Qinghai-Tibet"
 CHI_qinghai_tibet_railway_planning_desc: "Le chemin de fer Qinghai-Tibet parcourra 1 956 kilomètres à une altitude moyenne de 4 500 mètres, franchissant le col de Tanggula. Une fois achevé, ce sera le plus haut chemin de fer du monde et notre première liaison ferroviaire directe vers Lhassa, intégrant le Tibet économiquement et logistiquement au reste du pays d'une manière qu'aucune route ni aérodrome n'a jamais pu."
 CHI_quiet_succession_engineering: "Ingénierie de la succession"
 CHI_quiet_succession_engineering_desc: "L'autorité de Zeng Qinghong sur le Département de l'organisation lui donne une influence décisive sur le concours de succession désormais ouvert. Il doit le faire basculer en faveur de Xi Jinping plutôt que de Li Keqiang, soutenu par la Ligue de la jeunesse. Un siège de premier rang au Comité permanent du Politburo confirmera effectivement Xi comme prochain secrétaire général, et nous aurons façonné la prochaine décennie de direction du parti avant que l'affaire ne soit publiquement tranchée."
 CHI_ranks_for_sale: "Grades à vendre"
 CHI_ranks_for_sale_desc: "La promotion devient un tarif. Comme Xu Caihou l'a fait à partir de 1999, chaque étoile se vend au plus offrant, l'argent livré dans des caisses marquées du nom de l'acheteur. Lorsque son domicile de Pékin fut enfin perquisitionné, les enquêteurs emportèrent plus d'une tonne de numéraire. Un corps d'officiers qui a acheté son grade se battra pour son investissement, pas pour son pays."
 CHI_rapid_reaction_corps: "Le corps de réaction rapide"
 CHI_rapid_reaction_corps_desc: "Des formations d'élite aéroportées et d'assaut aérien sont tenues en alerte permanente, capables de se déployer à travers la Chine ou au-delà en quelques heures. Elles transforment une crise régionale en fait accompli avant que les rivaux ne rassemblent une réponse."
 CHI_rare_earth_dominance: "Stratégie de développement des terres rares"
 CHI_rare_earth_dominance_desc: "La Chine contrôle environ 85 pour cent de la production mondiale de terres rares, concentrée en Mongolie-Intérieure et au Jiangxi. Un programme de consolidation dirigé par l'État réduit l'extraction illégale, élève les normes de traitement et positionne la Chine comme fournisseur indispensable de la fabrication avancée mondiale."
 CHI_rare_earth_leverage: "Le levier des terres rares"
 CHI_rare_earth_leverage_desc: "Nous raffinons les terres rares sans lesquelles les armes du monde ne peuvent rien, près de quatre-vingt-dix pour cent de l'offre mondiale, les aimants de chaque missile guidé et chasseur furtif. Ce qui était une exportation devient un levier : étrangler l'offre, et l'arsenal d'un rival se fige tandis que le nôtre tourne librement."
 CHI_Reclaim_The_Heavenly_Waters: "Reconquérir les Eaux célestes"
 CHI_Reclaim_The_Heavenly_Waters_desc: "Tianshui, les Eaux célestes, est la désignation poétique archaïque des mers entourant le Royaume du Milieu. Le nom donne la couleur ; l'action est moderne et navale. Les groupes de surface de la marine de l'APL commencent des incursions croissantes dans les eaux contestées des Spratleys, défiant les garde-côtes des revendicateurs, perturbant les ravitaillements et présentant à chaque gouvernement un ultimatum : accepter l'autorité administrative chinoise sur les récifs contestés, ou affronter la sortie suivante. Le compteur d'affrontement n'avance que lorsque nous obtenons un résultat tactique décisif ; les engagements non concluants et les reculs bloquent l'échelle d'escalade."
 CHI_reconstruction_development: "Capacité de reconstruction"
 CHI_reconstruction_development_desc: "Des années d'investissement d'infrastructure et de capacité accumulée du secteur de la construction nous ont donné une aptitude exceptionnelle à reconstruire rapidement après catastrophes naturelles et accidents industriels. Protocoles standardisés de réponse aux catastrophes, stocks d'équipement prépositionnés et unités du génie spécialisées de l'armée sous-tendent cette capacité. Nous devons investir pour la tenir aiguisée, car le prochain séisme ou inondation n'attendra pas notre préparation."
 CHI_red_arrow_program: "Le programme Flèche rouge"
 CHI_red_arrow_program_desc: "On répond au blindage par la famille de missiles antichars Flèche rouge, les HJ-8 et HJ-9 qui arment tout, du trépied d'infanterie aux véhicules et hélicoptères. Bon marché, abondants et sans cesse améliorés, ils donnent à chaque formation une portée tueuse de chars."
 CHI_Renminbi_Internationalization: "Le yuan comme monnaie de réserve"
 CHI_Renminbi_Internationalization_desc: "Nous avons lancé le Système de paiement interbancaire transfrontalier pour compenser les transactions en renminbi hors du réseau SWIFT, et le Fonds monétaire international a admis le yuan dans son panier de droits de tirage spéciaux. Le règlement commercial des Nouvelles routes de la soie en renminbi accroît régulièrement le poids de notre monnaie dans les réserves mondiales. Nous devons maintenant approfondir ces mécanismes jusqu'à ce que le renminbi soit une véritable alternative au dollar pour les partenaires qui tiennent à leur indépendance."
 CHI_Responsible_Stakeholder: "Partie prenante responsable"
 CHI_Responsible_Stakeholder_desc: "Nous devons embrasser l'appel de la communauté internationale à devenir un participant constructif des institutions mondiales. En approfondissant les liens commerciaux et en réduisant les frictions dans les forums multilatéraux, nous nous positionnons comme partenaire indispensable plutôt que comme challenger révisionniste. L'étiquette compte, même si la stratégie derrière ne change pas."
 CHI_rmb_internationalisation: "Internationalisation du renminbi"
 CHI_rmb_internationalisation_desc: "Le programme pilote de règlement commercial en RMB a été lancé, et des accords de swap de devises sont désormais signés avec plus de 40 banques centrales. Le FMI admet le yuan dans son panier de droits de tirage spéciaux, une reconnaissance qui ne se reprend pas. Le Système de paiement interbancaire transfrontalier offre une alternative au SWIFT libellée en renminbi, atteignant plus de 1 500 institutions membres. Après l'exclusion de la Russie du SWIFT, environ 90 pour cent du commerce Russie-Chine bascule vers le CIPS et les paires yuan-rouble, et l'Arabie saoudite, les Émirats arabes unis et le Brésil commencent à accepter le yuan pour les contrats de matières premières. Le système dollar ne s'effondre pas, mais il n'est plus sans challenger."
 CHI_Rome_Memorandum: "Mémorandum de Rome sur la BRI"
 CHI_Rome_Memorandum_desc: "La signature par l'Italie d'un mémorandum d'entente des Nouvelles routes de la soie a été la première d'un membre du G7, fracturant le consensus occidental sur l'endiguement de notre diplomatie d'infrastructure en Europe. L'accord couvre la coopération portuaire, ferroviaire et numérique, avec Trieste et Gênes positionnés comme terminaux nord-adriatique et ligure de nos cargaisons. Bruxelles et Washington presseront Rome de se retirer, mais l'attrait commercial de notre investissement devrait s'avérer politiquement durable si nous gérons bien la relation."
 CHI_sasac: "Remettre les firmes à la SASAC"
 CHI_sasac_desc: "Les entreprises arrachées à l'armée ne disparaissent pas ; elles passent à la Commission de supervision et d'administration des actifs d'État, fondée en 2003 pour détenir les hauteurs commandantes de l'économie. Le profit militaire devient dividende civil, comptabilisé à Pékin plutôt qu'à la caserne."
 CHI_sasac_founding: "Commission de contrôle et d'administration des biens de l'État"
 CHI_sasac_founding_desc: "Notre secteur d'entreprises d'État souffre depuis longtemps d'une tutelle ministérielle fragmentée sans stratégie de propriété cohérente. Nous devons établir une commission de supervision dédiée pour consolider le contrôle de nos entreprises gérées au centre, introduire des contrats de performance pour les dirigeants, exiger le versement de dividendes et filtrer les décisions d'investissement majeures. L'État doit agir en actionnaire, pas seulement en régulateur."
 CHI_saturn_engine_crisis: "La crise des moteurs Saturn"
 CHI_saturn_engine_crisis_desc: "La Chine peut construire la cellule, mais pas le cœur à l'intérieur. Nos meilleurs chasseurs volent encore sur le Saturn AL-31 russe, et chaque embargo ou hausse de prix de Moscou menace de clouer la flotte au sol. Le WS-10 Taihang doit fonctionner, quel qu'en soit le coût, ou notre indépendance n'est qu'une fiction peinte sur des turbines importées."
 CHI_scientific_development_outlook_foreshadowed: "Préfigurer le concept de développement scientifique"
 CHI_scientific_development_outlook_foreshadowed_desc: "Concéder un espace idéologique au vice-président. Les gens de Hu Jintao obtiennent une ouverture doctrinale — durabilité, rééquilibrage rural, approche centrée sur l'humain."
 CHI_scientific_outlook_on_development: "Conception scientifique du développement"
 CHI_scientific_outlook_on_development_desc: "Le premier principe de la conception scientifique du développement est le développement lui-même. Son noyau est l'approche centrée sur l'humain. Son exigence fondamentale est un développement global, coordonné et durable. Sa méthode fondamentale est de prendre en compte l'ensemble des facteurs. La conception scientifique du développement est l'héritage et le prolongement des grandes conceptions du développement des trois générations de la direction centrale du Parti. Elle est une incarnation concentrée de la vision du monde et de la méthodologie marxiste appliquées au développement. C'est une théorie scientifique à la fois conforme au marxisme-léninisme, à la pensée de Mao Zedong, à la théorie de Deng Xiaoping et à la pensée importante des « Trois représentations », tout en restant en phase avec son temps. Elle constitue un principe directeur essentiel pour le développement économique et social de notre pays, une grande pensée stratégique qui doit être défendue et mise en œuvre dans la construction du socialisme aux caractéristiques chinoises, et un héritage chaleureux que le Secrétaire général Hu Jintao a laissé au peuple chinois."
 CHI_scientific_outlook_on_development_tt: "§RParce que nous avons perdu $CHI_scientific_outlook_idea_1$ nous gagnons :§!"
 CHI_SCO_Exclusive_Core: "Noyau exclusif SCO"
 CHI_SCO_Exclusive_Core_desc: "Plutôt que de diluer l'OCS par une expansion rapide, nous devons approfondir l'intégration parmi les membres existants. Des liens plus forts entre un groupe plus restreint de nations engagées rapporteront de plus grands dividendes stratégiques."
 CHI_SCO_Exclusive_Core_tt: "§GRenforce§! la coopération des membres et §Rbloque§! les nouvelles candidatures de partenaires de dialogue. Les membres existants reçoivent des bonus d'opinion permanents."
 CHI_SCO_Plus_Expansion: "Extension SCO+"
 CHI_SCO_Plus_Expansion_desc: "La force de l'OCS réside dans son ampleur. En abaissant les barrières d'entrée et en courtisant activement de nouveaux partenaires de dialogue, nous pouvons étendre la portée de l'organisation à travers l'Asie, le Moyen-Orient et au-delà."
 CHI_sea_eagles_carrier_wing: "Le groupe aérien embarqué"
 CHI_sea_eagles_carrier_wing_desc: "Une poignée de chasseurs n'est pas un groupe aérien. Nous complétons le pont du porte-avions par l'alerte avancée aéroportée, la lutte anti-sous-marine et les hélicoptères de guerre électronique, soudant les appareils en une aile intégrée capable de reconnaître, protéger et frapper comme un tout."
 CHI_sea_eagles_of_the_liaoning: "Aigles de mer du Liaoning"
 CHI_sea_eagles_of_the_liaoning_desc: "Le pont du Liaoning gagne ses serres. Le J-15 « Requin volant », chasseur embarqué lourd dérivé du Su-33, est armé et travaillé en appareil d'attaque, et la doctrine de la frappe depuis un pont chinois en mouvement est écrite pour la première fois."
 CHI_second_gen_platforms: "La seconde génération de plateformes"
 CHI_second_gen_platforms_desc: "ByteDance lance Douyin au pays et TikTok à l'international, atteignant des publics que la génération BAT n'a jamais visés. Pinduoduo bouscule le e-commerce par des mécaniques d'achat groupé qui touchent les consommateurs des villes de quatrième rang et des marchés ruraux ; Meituan mène les services à la demande. Didi absorbe Uber China. Une seconde vague de plateformes approfondit notre économie numérique dans des segments que la première génération trouvait trop diffus ou trop peu glamour pour les bâtir."
 CHI_Second_Island_Chain_Reach: "Projection de la deuxième chaîne d'îles"
 CHI_Second_Island_Chain_Reach_desc: "Les droits d'accès de la marine de l'APL à travers le Pacifique mélanésien et polynésien portent nos bases avancées à portée de frappe de Guam, d'Hawaï et des voies maritimes reliant les États-Unis à leurs alliés d'Asie de l'Est. La projection brise la logique stratégique de la seconde chaîne d'îles sur laquelle les planificateurs américains s'appuient depuis la guerre froide. L'Australie perd le tampon géographique qu'elle a toujours traité comme une constante. Nous devons agir avant qu'ils ne réalisent qu'il a disparu."
 CHI_Secure_The_Heavenly_Waters: "Sécuriser les Eaux célestes"
 CHI_Secure_The_Heavenly_Waters_desc: "Tianshui, les Eaux célestes, est le terme archaïque des mers qui entourent le domaine du Royaume du Milieu. Ceux qui ont refusé l'invitation à reconnaître l'ordre dû sont désormais ramenés à l'obéissance par la force des armes. La mer du Sud est restaurée à son administration légitime sous notre autorité."
 CHI_seed_security_campaign: "Campagne de sécurité semencière"
 CHI_seed_security_campaign_desc: "La guerre du soja a exposé notre vulnérabilité sans fard : les négociants en grains ABCD ont acquis 70 pour cent de notre capacité de trituration du soja après la faillite des transformateurs nationaux sur des positions à terme spéculatives. Nous ne devons pas laisser cette exposition se répéter. Sanya, sur l'île de Hainan, sert de base de sélection Nanfan, où les hivers tropicaux permettent trois générations de sélection par an. L'acquisition de Syngenta par ChemChina place des collections mondiales de germoplasme sous influence étatique, tandis que Longping Hi-Tech et l'agence céréalière Beidahuang sont désignés champions nationaux de la souveraineté semencière."
 CHI_selective_anti_corruption: "Campagne anticorruption sélective"
 CHI_selective_anti_corruption_desc: "Les enquêtes anticorruption du milieu des années 2000 furent hautement sélectives. Les affaires visaient des officiels qui avaient accumulé des bases de pouvoir indépendantes ou franchi les lignes factionnelles, tandis que alliés et patrons étaient isolés du regard. La dimension politique de ces poursuites a miné leur légitimité et engendré du ressentiment factionnel au sein du parti."
 CHI_Seoul_Under_Our_Umbrella: "Séoul sous notre parapluie"
 CHI_Seoul_Under_Our_Umbrella_desc: "Nous et la Corée du Sud formalisons un cadre de partenariat stratégique. Nos garanties de sécurité remplacent l'alliance américaine, l'accès de la marine de l'APL à l'île de Jeju est négocié, et les forces américaines commencent leur redéploiement longtemps anticipé hors de la péninsule."
 CHI_service_of_the_three_distances: "Service des trois distances"
 CHI_service_of_the_three_distances_desc: "La marine redéfinit jusqu'où elle doit porter. Au-delà de la défense des mers proches de la première chaîne de Liu Huaqing, elle s'entraîne désormais pour les mers lointaines et l'océan ouvert, les trois distances auxquelles une flotte mondiale doit être prête à combattre. La doctrine bascule décisivement de la défense de la côte à l'opération à travers les océans du monde."
 CHI_seventeen_plus_one_mechanism: "Cadre de coopération 16+1"
 CHI_seventeen_plus_one_mechanism_desc: "La plateforme 17+1 de coopération Chine-Europe centrale et orientale canalise notre investissement vers les infrastructures de l'Union européenne et des États candidats, suscitant à Bruxelles des inquiétudes de dérive d'alignement des États membres et de contournement réglementaire. Bruxelles a raison de s'inquiéter. Nous devons approfondir ces relations précisément parce qu'elles fragmentent le front européen unifié qui contraint notre accès au marché."
 CHI_shadow_banking_cleanup: "Assainissement de la finance de l'ombre et du risque financier"
 CHI_shadow_banking_cleanup_desc: "Le raz-de-marée de relance de 2008 et 2009 a laissé produits de gestion de patrimoine et sociétés de fiducie accumuler un risque opaque dans l'immobilier et les véhicules de financement des gouvernements locaux. Les nouvelles règles de gestion d'actifs exigent une tarification à la valeur nette d'inventaire pour les produits de gestion de patrimoine et éliminent les garanties implicites. Anbang Insurance est saisie par l'État après 300 milliards de dollars d'acquisitions étrangères imprudentes. HNA Group s'effondre sous sa propre dette. L'assainissement concentre la supervision du risque dans la CBIRC réformée et stabilise le marché interbancaire. La discipline n'est pas une punition ; c'est le prix d'un système auquel nous pouvons faire confiance."
 CHI_shandong_at_sanya: "Le Shandong à Sanya"
 CHI_shandong_at_sanya_desc: "Le second porte-avions est entièrement nôtre. Le Type 002 Shandong, premier porte-avions conçu et construit en Chine, est lancé en 2017 et mis en service en 2019, puis basé à Sanya sur Hainan, à côté des cavernes sous-marines de Yulin. Du sud, elle surveille les voies maritimes et les îles contestées que la Chine entend tenir."
 CHI_shantytown_renovation: "Programme de rénovation des bidonvilles"
 CHI_shantytown_renovation_desc: "Le programme national de rénovation des bidonvilles démolit les logements ouvriers délabrés des vieilles provinces minières et charbonnières et les remplace par des districts résidentiels et industriels modernes. Le Shanxi et le Henan, alourdis d'infrastructures lourdes vieillissantes, reçoivent les plus grandes allocations. Les dépenses du gouvernement central sur le programme atteignent 1,54 billion de yuans, générant une vague de contrats de construction et ouvrant de nouvelles zones industrielles à l'intérieur où nulle n'existait auparavant."
 CHI_shenyang_j35_gyrfalcon: "Le J-35 Requin bleu"
 CHI_shenyang_j35_gyrfalcon_desc: "Un second chasseur furtif rejoint le premier. Le J-35 de Shenyang, issu du démonstrateur FC-31, est un biréacteur de cinquième génération dimensionné pour bases terrestres et ponts de porte-avions, donnant à la Chine un couple furtif haut-bas avec le J-20 que seuls les États-Unis peuvent autrement aligner."
 CHI_shenzhou_program: "Le programme Shenzhou"
 CHI_shenzhou_program_desc: "Le 15 octobre 2003, Yang Liwei a décollé à bord de Shenzhou 5 depuis le Centre de lancement de satellites de Jiuquan, devenant le premier taïkonaute chinois. La mission de quatorze orbites et vingt-et-une heures a fait de la Chine le troisième pays à envoyer indépendamment un humain dans l'espace, et inauguré un programme de vol habité qui grandirait jusqu'aux sorties extra-véhiculaires, aux rendez-vous orbitaux et aux missions de station de longue durée."
 CHI_sicarrier_euv: "Programme EUV de SiCarrier"
 CHI_sicarrier_euv_desc: "SiCarrier Technology, créée avec un soutien étatique direct, a pour mission de combler le fossé EUV. Le programme s'appuie sur la capacité nationale de conception optique développée à l'Institut d'optique de Changchun et l'expérience de fabrication de miroirs du CNNC. Un démonstrateur EUV fonctionnel exige la production nationale de sources lumineuses à 13,5 nm, d'optiques réfléchissantes multicouches et de platines de wafer à précision sub-nanométrique. C'est notre tentative la plus ambitieuse d'atteindre la pleine souveraineté d'équipement semi-conducteur. Un outil EUV national opérationnel signifie que nous pouvons fabriquer des puces avancées de bout en bout sans une seule licence d'équipement étrangère, brisant le régime de contrôle des exportations occidental à sa racine."
 CHI_Silk_Road_Fund: "Fonds de la Route de la Soie"
 CHI_Silk_Road_Fund_desc: "Le Fonds de la Route de la soie, capitalisé à 40 milliards de dollars à partir de nos réserves de change et fonds souverains, fournit un financement en fonds propres aux projets des Nouvelles routes de la soie que les banques commerciales et les prêteurs multilatéraux ne porteront pas seuls. C'est l'instrument par lequel nous pouvons dire oui à des projets qui autrement caleraient faute d'un premier mouvement prêt à prendre le risque."
 CHI_sinograin_strategic_reserve: "Sinograin"
 CHI_sinograin_strategic_reserve_desc: "La China Grain Reserves Corporation hérite du rôle des greniers impériaux des dynasties Sui et Tang, ancrée par le Beidahuang du Heilongjiang, dont les fermes de terre noire produisent plus de grain que toute autre province. Sinograin met en œuvre la politique de prix d'achat minimum des grains, achetant pour le compte de l'État lorsque les marchés baissent. Une réserve stratégique de porc a depuis rejoint les stocks de grains, la seule de ce genre au monde, et nous devons traiter ce système comme l'actif stratégique qu'il est."
 CHI_smee_lithography: "Développement de la lithographie SMEE"
 CHI_smee_lithography_desc: "Shanghai Micro Electronics Equipment Group est notre seul fabricant de lithographie, produisant des outils d'exposition 90 nm et 110 nm pour l'emballage et les procédés d'arrière-plan. Le financement d'État accélère le développement d'un scanner DUV d'immersion 28 nm, dont les progrès de qualification sont désormais rapportés dans les fonderies nationales. SMEE reste une génération derrière les outils les plus capables d'ASML, mais la production DUV nationale élimine notre dépendance pour l'expansion de capacité en nœuds matures et fournit le fondement dont nous avons besoin pour le développement vers la lithographie de nœuds avancés. Le fossé est réel ; la trajectoire est juste."
 CHI_smic_advanced_node: "Poussée de SMIC vers les nœuds avancés"
 CHI_smic_advanced_node_desc: "Après notre inscription sur la Entity List américaine, SMIC a accéléré sa piste de développement national. Nos ingénieurs ont adapté l'outillage DUV existant pour atteindre une densité équivalente 7 nm par multi-patterning — un résultat qui a confirmé qu'une ingénierie de procédé créative peut partiellement substituer l'accès à l'EUV. L'exploit a acheté du temps pour le développement d'équipement national et recadré le fossé technologique comme un problème d'ingénierie soluble. Le lancement du Mate 60 Pro a exposé cette capacité de fabrication au monde, déclenchant une nouvelle vague d'examens de contrôle des exportations américains, et cette réponse nous dit que nous faisons les bonnes choses."
 CHI_smic_zhangjiang: "Expansion du SMIC Zhangjiang"
 CHI_smic_zhangjiang_desc: "La Semiconductor Manufacturing International Corporation a bâti son campus phare de fonderie 300 mm dans le parc high-tech de Zhangjiang, et l'investissement d'État dans des expansions successives de capacité a permis à SMIC d'atteindre la production 28 nm et de commencer la production à risque 14 nm. Chaque nœud successif referme le fossé avec TSMC et Samsung, et SMIC est désormais la seule fonderie de Chine continentale capable de production logique avancée. Nous devons protéger cet actif et le pousser plus loin."
 CHI_smuggling_tax: "Taxer la contrebande"
 CHI_smuggling_tax_desc: "L'armée ne gère pas tous les trafics ; elle les licence. Les contrebandiers qui font passer pétrole, voitures et cigarettes par les ports et garnisons paient les commandants locaux pour la protection, et cette redevance devient un budget officieux qu'aucun ministère ne peut voir ni toucher."
 CHI_Soft_Power_Projection: "Projection de puissance douce"
 CHI_Soft_Power_Projection_desc: "Établir des Instituts Confucius dans les universités du monde entier et étendre la portée internationale des médias d'État pour promouvoir la langue, la culture et les perspectives chinoises à l'étranger."
 CHI_special_operations_forces: "Forces d'opérations spéciales"
 CHI_special_operations_forces_desc: "Chaque théâtre lève ses propres brigades d'opérations spéciales, entraînées aux raids, à la reconnaissance et aux frappes de décapitation. Elles sont la pointe de la lame, envoyées avant la force principale pour ouvrir la porte de l'intérieur."
 CHI_star_market_bse: "Marché STAR et Bourse de Pékin"
 CHI_star_market_bse_desc: "Le Conseil de l'innovation scientifique et technologique de la Bourse de Shanghai introduit les introductions en bourse sur enregistrement, les structures d'actions à double classe et l'accès à la cote pour les sociétés pré-profit. SMIC lève 7,5 milliards de dollars américains sur STAR ; la Bourse de Pékin suit, ciblant les petites et moyennes entreprises innovantes. Ensemble, ces plateformes permettent aux firmes de semi-conducteurs, biotech et fabrication avancée de lever des capitaux au pays sans dépendre des cotations de Wall Street. Nos marchés de capitaux ne sont plus un risque de dépendance."
 CHI_state_council_information_office: "Bureau d'information du Conseil des affaires d'État"
 CHI_state_council_information_office_desc: "Le Bureau d'information du Conseil des affaires d'État gère nos communications extérieures, les opérations de propagande outre-mer, la gouvernance intérieure d'Internet et l'accréditation de la presse étrangère. Nous devons l'utiliser pour institutionnaliser le filtrage de contenu sous le programme Bouclier d'or et étendre notre radiodiffusion internationale afin de contrer la domination narrative occidentale. L'environnement informationnel est un champ de bataille, et nous ne pouvons nous permettre de le céder par défaut."
 CHI_stock_exchanges_shanghai_shenzhen: "Bourses de Shanghai, Shenzhen et Hong Kong"
 CHI_stock_exchanges_shanghai_shenzhen_desc: "La Bourse de Shanghai accueille de grandes entreprises d'État, dont les Quatre Grandes banques, Sinopec, PetroChina et China Mobile. La Bourse de Shenzhen accueille des sociétés privées et des innovateurs tels que BYD, Midea, Gree et Ping An. ChiNext à Shenzhen fonctionne comme un équivalent croissance du NASDAQ. Les programmes Stock Connect Shanghai-Hong Kong et Shenzhen-Hong Kong ouvrent une porte contrôlée aux investisseurs de portefeuille internationaux sans libéralisation complète du compte de capital, nous permettant d'attirer des capitaux étrangers à nos propres conditions."
 CHI_strategic_materials: "Chaînes d'approvisionnement en matériaux stratégiques"
 CHI_strategic_materials_desc: "Nous contrôlons plus de 80 pour cent de la capacité mondiale de raffinage du gallium et du germanium et dominons l'offre de fluorine, de silicium métal et d'éléments de terres rares utilisés dans la fabrication de semi-conducteurs. Après les contrôles d'exportation américains, nous imposons des licences d'exportation sur le gallium et le germanium, puis ajoutons d'autres restrictions sur les composés d'arséniure de gallium. La politique intérieure réoriente la production de matériaux stratégiques vers nos propres fonderies, réduisant les coûts et assurant la continuité d'approvisionnement des fonderies sous contraintes de liste d'entités. Le goulet des matériaux fonctionne dans les deux sens."
 CHI_strategic_reserve_system: "Le système de réserve stratégique"
 CHI_strategic_reserve_system_desc: "La profondeur est sa propre défense. Un système de réserve et de mobilisation réformé se tient prêt à inonder le front d'effectifs entraînés, assurant que même une longue guerre d'usure est une guerre que la Chine peut durer."
 CHI_streamline_the_ranks: "Alléger les rangs"
 CHI_streamline_the_ranks_desc: "Une armée de deux millions d'hommes bâtie pour noyer un envahisseur sous les corps ne peut gagner une guerre de précision. Nous coupons l'infanterie pléthorique, retirons l'obsolète et versons les économies dans la puissance de feu, les capteurs et la mobilité. L'Armée populaire de libération sera plus petite, plus acérée et, pour la première fois, une force bâtie pour gagner plutôt que seulement pour durer."
 CHI_strike_black_sing_red: "Frappez le noir, chantez le rouge"
 CHI_strike_black_sing_red_desc: "Une campagne à deux volets pour assainir le corps politique. L'offensive « Frapper le noir » arrête des milliers de figures du crime organisé et d'officiels corrompus, démantelant les réseaux de patronage qui ont corrodé la gouvernance locale. L'offensive « Chanter le rouge » fait revivre chants révolutionnaires et slogans maoïstes, canalisant l'énergie populaire vers une mobilisation patriotique."
 CHI_Suez_Eastern_Bank: "Zone industrielle de Suez-Est"
 CHI_Suez_Eastern_Bank_desc: "La zone de coopération économique et commerciale Chine-Égypte de Suez, sur la rive orientale du canal, accueille nos firmes de fabrication, de logistique et d'énergie sous des termes réglementaires égyptiens préférentiels. La zone verrouille notre tête de pont stratégique à l'un des goulets maritimes les plus critiques du monde, réduisant les coûts de transit et donnant à nos entreprises une base d'accès aux marchés nord-africains et européens. L'Égypte gagne des recettes en devises et une association politique avec nous. Les deux parties comprennent la valeur de ce que nous bâtissons."
 CHI_Sunshine_Policy_Revival: "Renaissance de la politique du rayon de soleil"
 CHI_Sunshine_Policy_Revival_desc: "Nous devons coordonner avec Séoul pour relancer le cadre d'engagement intercoréen qui s'est effondré dans les années suivant le naufrage du Cheonan et le bombardement de Yeonpyeong. Échanges culturels conjoints, programmes de visites de familles réunies et lignes chaudes rouvertes reconstruisent l'infrastructure de base de la communication entre les deux Corées, nous servant de facilitateurs indispensables. Une Corée qui parle est une Corée qui ne se bat pas."
 CHI_system_of_systems_operations: "Opérations de systèmes de systèmes"
 CHI_system_of_systems_operations_desc: "La fin de la réforme est une façon de faire la guerre, pas un tableau d'organisation. Nous poursuivons les opérations de systèmes de systèmes, maillant capteurs, tireurs et commandants en un réseau qui pense et frappe plus vite qu'aucun ennemi ne peut réagir. L'armée qui gagnera la prochaine guerre combattra comme un seul organisme voyant."
 CHI_tactical_electronic_warfare: "Guerre électronique tactique"
 CHI_tactical_electronic_warfare_desc: "Sur le champ de bataille informatisé, le camp qui aveugle l'autre gagne. Nous déployons des unités dédiées de brouillage, de signaux et d'attaque électronique au niveau brigade, contestant les radios, radars et liaisons de données de l'ennemi avant le premier coup de feu."
 CHI_tactical_uav_integration: "Intégration de drones tactiques"
 CHI_tactical_uav_integration_desc: "Les yeux au-dessus deviennent l'ordinaire. De petits drones de reconnaissance sont poussés jusqu'au bataillon et à la compagnie, afin qu'aucun commandant n'avance à l'aveugle et que chaque cible puisse être trouvée avant d'être engagée."
 CHI_Takeshima_Solidarity: "Le communiqué des rochers Liancourt"
 CHI_Takeshima_Solidarity_desc: "Nous soutenons formellement la revendication sud-coréenne sur les rochers Liancourt, cadrant le litige comme un grief partagé contre le refus du Japon de reconnaître son héritage impérial. Le coin entre Séoul et Tokyo s'élargit, détournant l'opinion publique coréenne de l'architecture d'alliance pacifique de Washington."
 CHI_telecom_reorganization: "Réorganisation des télécoms"
 CHI_telecom_reorganization_desc: "Le Conseil des affaires d'État restructure notre monopole des télécommunications, scindant China Telecom et attribuant le spectre 3G à China Mobile, China Unicom et China Telecom simultanément. La concurrence qui en résulte stimule l'investissement dans l'infrastructure réseau et accélère l'adoption du haut débit mobile sur un marché de 1,4 milliard d'abonnés potentiels qu'aucun concurrent étranger ne peut atteindre."
 CHI_tencent_games_publisher: "L'empire du jeu de Tencent"
 CHI_tencent_games_publisher_desc: "Tencent acquiert Riot Games et Supercell, et détient des participations majeures dans Epic, Activision Blizzard et Ubisoft. Honor of Kings devient le jeu mobile le plus lucratif au monde ; Genshin Impact gagne 5 milliards de dollars américains en ses deux premières années. Notre investissement dans les studios occidentaux nous donne une influence structurelle sur le divertissement mondial à une fraction du coût du soft power traditionnel. La culture meut les gens d'une façon que la diplomatie ne peut atteindre."
 CHI_The_2022_Reset: "La relance de [GetYear]"
 CHI_The_2022_Reset_desc: "S'appuyant sur le cadre du G20 de Bali établi en [GetYear], nous et les États-Unis relançons formellement l'architecture des Six Parties. Nous assumons le rôle de courtier honnête entre Washington, Séoul et Pyongyang pour la première fois depuis plus d'une décennie."
 CHI_The_2025_Blue_Sky_Operation: "Opération Ciel Bleu"
 CHI_The_2025_Blue_Sky_Operation_desc: "Nous et la Corée du Nord lançons une campagne militaire coordonnée contre la Corée du Sud. L'opération Ciel bleu testera notre volonté de porter le coût international d'une unification coréenne par la force."
 CHI_The_610_Northeast_Directive: "La directive 610 du Nord-Est"
 CHI_The_610_Northeast_Directive_desc: "Le commandement du Nord-Est du PCC active des protocoles de mobilisation d'urgence à travers la Mandchourie et le Liaoning. Les forces frontalières sont renforcées, les réserves stratégiques repositionnées, et l'infrastructure de la zone frontalière est durcie pour soutenir toute contingence future sur la péninsule."
 CHI_the_610_office_mandate: "Le mandat du bureau 610"
 CHI_the_610_office_mandate_desc: "Le bureau 610, nommé d'après la date de sa fondation, coordonne nos agences de sécurité d'État dans la répression du Falun Gong et d'autres groupes jugés menaces à la stabilité sociale. Le bureau opère hors des canaux juridiques ordinaires, concentrant le pouvoir d'exécution entre les mains du centre. Son mandat est délibérément sans contrainte, car les menaces qu'il traite ne respectent pas les frontières du droit ordinaire."
 CHI_the_998_project: "Le projet de bombardier 998"
 CHI_the_998_project_desc: "L'arme bombardier, longtemps tenue pour obsolète, reçoit un avenir. Un programme dédié reconstruit la frappe longue portée autour d'une cellule profondément modernisée, transformant une relique de guerre froide en porteur de missiles standoff capable de menacer des cibles à travers le Pacifique occidental sans jamais franchir une côte hostile."
 CHI_The_Air_Patrol_Zone: "La zone de patrouille aérienne"
 CHI_The_Air_Patrol_Zone_desc: "Ce que d'autres États appellent une ZADI, nous préférons le décrire comme une zone de patrouille régularisée : des intercepteurs de l'armée de l'air de l'APL conduisant des patrouilles de souveraineté de routine au-dessus de la mer de Chine méridionale, identifiant les aéronefs étrangers et escortant hors de la zone les transits non conformes. L'effet pratique reflète le précédent de 2013 en mer de Chine orientale, tous les aéronefs non chinois faisant face à des exigences d'identification et au risque d'interception, mais le cadrage met l'accent sur notre puissance aérienne plutôt que sur une revendication juridique formelle que la communauté internationale contesterait immédiatement."
 CHI_the_anime_generation_gambit: "Le gambit de la génération anime"
 CHI_the_anime_generation_gambit_desc: "Notre jeunesse cite Hayao Miyazaki plus souvent que Mao. C'est soit un problème, soit une opportunité. Le camarade Wang Huning croit que c'est la seconde."
 CHI_The_Beijing_Peace_Guarantee: "La garantie de paix de Pékin"
 CHI_The_Beijing_Peace_Guarantee_desc: "Nous garantissons un règlement final entre les deux Corées. La garantie de paix de Pékin nous engage à défendre la souveraineté de toute Corée unifiée contre l'ingérence extérieure."
 CHI_The_Beijing_Settlement: "Le règlement de Pékin"
 CHI_The_Beijing_Settlement_desc: "Le coup consolidé, nous négocions les termes de la nouvelle réalité politique de la Corée du Nord. Le gouvernement de transition à Pyongyang accepte notre arbitrage, et le Parti des travailleurs de Corée est restructuré sous notre supervision."
 CHI_the_bohai_bastion: "Le bastion du Bohai"
 CHI_the_bohai_bastion_desc: "Le dissuasif le plus sûr est celui qu'on ne peut trouver. Le SNLE Type 094A, portant le missile JL-3 d'une portée d'environ dix mille kilomètres, peut enfin frapper le continent américain depuis des eaux territoriales défendues. Abrités derrière la flotte dans un bastion protégé, nos sous-marins lanceurs d'engins donnent à la Chine une véritable seconde frappe depuis la mer, la garantie finale qu'aucun premier coup ne peut nous désarmer."
 CHI_The_Border_Personnel_Meetings: "Réunions du personnel frontalier"
 CHI_The_Border_Personnel_Meetings_desc: "Cinq points le long de la ligne de contrôle réel où commandants indiens et chinois peuvent se rencontrer sans protocole d'escalade. Une bouilloire, une table pliante, deux drapeaux. Parfois la diplomatie commence dans des lieux aussi petits."
 CHI_The_Cabbage_Strategy: "La stratégie du chou"
 CHI_The_Cabbage_Strategy_desc: "Le contre-amiral Zhang Zhaozhong a décrit la tactique publiquement : envelopper chaque récif contesté de couches successives. Navires de pêche à l'extérieur, milice maritime derrière eux, vedettes de garde-côtes ensuite, frégates au cœur, jusqu'à ce que les feuilles les plus externes soient indiscernables de la souveraineté. Lorsque les juristes étrangers arrivent, le chou a déjà poussé. Nous adoptons cette doctrine comme cadre pour la mer de Chine méridionale."
 CHI_The_Cabbage_Tightens: "Le chou se resserre"
 CHI_The_Cabbage_Tightens_desc: "Milice maritime et garde-côtes opèrent désormais sous une coordination unifiée de la marine de l'APL à travers la chaîne de récifs contestés. Les couches extérieures du chou se consolident en une présence administrative et de sécurité sans couture. Ce qui était naguère disputé est désormais, en pratique, administré."
 CHI_the_china_plus_one_counteroffensive: "La contre-offensive Chine-plus-un"
 CHI_the_china_plus_one_counteroffensive_desc: "M. Toyoda a visité Tianjin en s'attendant à des concessions. Il est parti avec des concessions, et un contrat de cent mille véhicules à pile à combustible. L'art de donner tout en prenant reste nôtre à parfaire."
 CHI_The_Chinese_Correction: "La correction chinoise"
 CHI_The_Chinese_Correction_desc: "Le comportement erratique de la dynastie Kim est devenu un passif stratégique. Nous avons décidé qu'une transition gérée, discrète, chirurgicale et irréversible, est préférable à une autre génération de diplomatie du chantage depuis Pyongyang."
 CHI_the_chinese_dream: "Le rêve chinois"
 CHI_the_chinese_dream_desc: "Le grand rajeunissement de la nation chinoise est le plus grand rêve chinois. Un siècle d'humiliation a cédé la place à la restauration, et le Parti cadre cette transformation non comme idéologie mais comme destin historique partagé par 1,4 milliard. Force économique, puissance militaire et respect international ne sont pas des ambitions — c'est ce qui nous a été pris, et ce que nous recouvrerons."
 CHI_The_Code_Of_Conduct: "Code de conduite"
 CHI_The_Code_Of_Conduct_desc: "Un code de conduite régional contraignant, négocié selon des termes chinois, est présenté comme le règlement définitif des revendications concurrentes en mer de Chine méridionale. L'instrument codifie les arrangements bilatéraux, exclut l'arbitrage extérieur et consacre le principe que les litiges concernent la Chine et ses voisins seuls. Les puissances extérieures se voient refuser tout point d'appui juridique."
 CHI_the_diaoyu_sovereignty_declaration: "La déclaration de souveraineté sur Diaoyu"
 CHI_the_diaoyu_sovereignty_declaration_desc: "Les îles Diaoyu sont territoire chinois depuis la dynastie Ming. L'« administration » japonaise est un héritage colonial que le monde a trop longtemps toléré."
 CHI_The_Duterte_Pivot: "Le pivot Duterte"
 CHI_The_Duterte_Pivot_desc: "Lorsque le président Duterte des Philippines a déclaré la « séparation » de son pays d'avec les États-Unis et s'est tourné vers Pékin, il a montré à la région qu'un dirigeant d'Asie du Sud-Est peut choisir la souveraineté plutôt que la dépendance. Nous devons cultiver des pivots similaires ailleurs, discrètement et patiemment, jusqu'à ce que les alliances de Washington deviennent une question plutôt qu'une réponse."
 CHI_The_Final_Compromise: "Le compromis final"
 CHI_The_Final_Compromise_desc: "Après des années de diplomatie patiente, nous négocions un règlement final accepté par les deux Corées. Ni unification ni division permanente, l'arrangement établit une zone économique partagée, des passages frontaliers démilitarisés et une commission de suivi conjointe sino-coréenne. Nous émergeons comme le garant indispensable de la paix sur la péninsule."
 CHI_The_Five_Fingers_Doctrine: "La doctrine des cinq doigts"
 CHI_The_Five_Fingers_Doctrine_desc: "Mao l'a dit en 1959 : le Tibet est la paume droite, et les cinq doigts sont le Ladakh, le Népal, le Sikkim, le Bhoutan et l'Agence de la frontière du Nord-Est. Nous avons la paume et le pouce. Les autres doigts attendent."
 CHI_the_fujian_catapults: "Les catapultes du Fujian"
 CHI_the_fujian_catapults_desc: "Le tremplin cède la place à la catapulte. Le Type 003 Fujian, lancé en 2022, est le premier porte-avions chinois à catapultes électromagnétiques, capable de catapulter des aéronefs plus lourds, pleinement ravitaillés, et même des avions d'alerte avancée. Avec lui, le fossé avec un supercarrier américain se réduit d'un gouffre à un pas."
 CHI_the_fukuda_doctrine_revisited: "La doctrine Fukuda revisitée"
 CHI_the_fukuda_doctrine_revisited_desc: "Le camarade Deng nous l'a dit : cacher sa force, bider son temps. L'économie japonaise se vide, son taux de natalité s'effondre, ses politiciens défilent au Kantei tous les quatorze mois. Pourquoi chercher querelle à un cadavre en attente quand nous pouvons acheter son héritage ?"
 CHI_The_G2_Declaration: "La déclaration du G2"
 CHI_The_G2_Declaration_desc: "Lors d'un sommet couvrant Washington et Pékin, nos dirigeants et les Américains déclarent conjointement leur engagement pour une péninsule coréenne pacifique et unifiée sous gouvernance coréenne. La déclaration du G2 signale une nouvelle ère de gestion des grandes puissances de la sécurité est-asiatique, et c'est une ère qui nous reconnaît comme partenaire égal dans cet arrangement."
 CHI_the_great_wall: "La Grande Muraille"
 CHI_the_great_wall_desc: "Certaines batailles se gagnent en ne perdant jamais. Nous choisissons la voie défensive, la Grande Muraille moderne : fortifications étagées, réserves profondes et une armée qui saigne à blanc tout envahisseur sur le sol chinois. La réunification peut attendre si la patrie est d'abord rendue inconquérable."
 CHI_the_great_western_development: "Le grand développement de l'Ouest"
 CHI_the_great_western_development_desc: "Notre politique d'aller vers l'Ouest canalise l'investissement d'État vers douze provinces occidentales par la construction d'infrastructures, des incitations d'usines et des programmes de relocalisation. Combler le fossé côte-intérieur est à la fois un impératif économique et notre outil le plus durable pour lier les régions frontalières agitées au centre."
 CHI_the_historical_reckoning: "Le règlement historique"
 CHI_the_historical_reckoning_desc: "Les manuels omettent une ville. Les sanctuaires honorent les architectes. Ce sera à nous de nous souvenir."
 CHI_the_iron_fist: "Le poing de fer"
 CHI_the_iron_fist_desc: "La défense ne reprend rien. Nous choisissons le poing de fer : des brigades lourdes interarmes menées par le Type 99, des masses de blindés et des feux à longue portée conçus pour briser un ennemi retranché et s'emparer du terrain. Quand l'ordre viendra de franchir un détroit ou une frontière, il sera exécuté avec une masse écrasante."
 CHI_The_Jang_Faction_Rehabilitation: "Réhabilitation de la faction Jang"
 CHI_The_Jang_Faction_Rehabilitation_desc: "Quand Jang Song-thaek fut purgé et exécuté, notre interlocuteur le plus fiable à Pyongyang disparut avec lui. Nous réhabiliterons désormais son réseau survivant en exil, en formant un cadre de responsables coréens réformateurs qui nous devront leur avenir."
 CHI_the_japan_question: "La question japonaise"
 CHI_the_japan_question_desc: "Au nord-est s'étend à la fois une grande menace et une grande opportunité. La question japonaise, comme la question de Taïwan et la question coréenne, n'admet pas de réponse permanente, seulement celle qui convient à l'heure présente."
 CHI_the_komsomolsk_pipeline: "Le pipeline de Komsomolsk"
 CHI_the_komsomolsk_pipeline_desc: "Pourquoi attendre nos usines quand celles de la Russie tournent déjà ? Depuis Komsomolsk-sur-l'Amour, nous achetons le Su-27, le Su-30 et les moteurs AL-31 qui propulsent la moitié de notre flotte, important une génération de capacités que nous ne savons pas encore construire. Le pipeline modernise l'armée de l'air dès aujourd'hui, au prix d'une dépendance à Moscou demain."
 CHI_The_Mandate_Of_The_Seas: "Le mandat des mers"
 CHI_The_Mandate_Of_The_Seas_desc: "La vision classique chinoise reconnaissait quatre mers entourant le centre civilisé du Royaume du Milieu, les Sihai. Les rois-dragons de ces eaux répondaient au Ciel, et par eux au Fils du Ciel. Cet ordre fut interrompu par le siècle d'humiliation ; il attend désormais d'être restauré par un État assez fort pour l'imposer."
 CHI_the_maritime_militia_initiative: "L'initiative de la milice maritime"
 CHI_the_maritime_militia_initiative_desc: "Chaque bateau de pêche est un marqueur mobile de souveraineté. La milice maritime des Forces armées du peuple répond à la Commission militaire centrale, mais le monde ne verra que des pêcheurs."
 CHI_The_Maritime_Silk_Road_Initiative: "L'initiative de la Route de la soie maritime"
 CHI_The_Maritime_Silk_Road_Initiative_desc: "La Route de la soie maritime est le volet océanique des Nouvelles routes de la soie, étendant nos investissements d'infrastructure et nos réseaux commerciaux en Asie du Sud-Est, en Asie du Sud et en Afrique de l'Est. En mer de Chine méridionale, elle ancre économiquement notre voie diplomatique : les États revendicateurs auxquels on offre un financement portuaire, des accords de pêche et des coentreprises d'hydrocarbures trouvent la voie bilatérale plus attrayante qu'une confrontation au niveau de l'ASEAN. Chaque accord signé renforce le principe selon lequel ces litiges sont des affaires entre voisins, non des dossiers pour une juridiction internationale."
 CHI_the_nanjing_memorial_mandate: "Le mandat du mémorial de Nankin"
 CHI_the_nanjing_memorial_mandate_desc: "Trois cent mille. Le chiffre figurera sur chaque couverture de manuel, chaque mur de musée, chaque minute de silence du 13 décembre. Le gouvernement japonais a ses souvenirs. Nous aurons les nôtres."
 CHI_The_Nine_Dots_Consensus: "Le consensus des neuf points"
 CHI_The_Nine_Dots_Consensus_desc: "Plutôt que de choisir entre Pyongyang et Séoul, nous traçons une voie médiane calibrée : maintenir les liens avec le Nord sans garantir la survie du régime, approfondir les liens économiques avec le Sud sans abandonner l'ambiguïté stratégique. Nous parions que tenir les deux fils à la fois est la seule approche capable, à terme, de produire une péninsule stable."
 CHI_the_northeast_tiger: "Le tigre du Nord-Est"
 CHI_the_northeast_tiger_desc: "Dans l'armée corrompue, le pouvoir circule par la région et le clientélisme. La clique de Shenyang, au Nord-Est, terre d'où Xu Caihou s'est élevé, devient faiseuse de rois, échangeant nominations et faveurs à travers les anciennes régions militaires comme un domaine privé."
 CHI_the_panda_diplomacy_renewal: "Renouvellement de la diplomatie Panda"
 CHI_the_panda_diplomacy_renewal_desc: "Deux pandas. Douze millions de dollars par an en « frais de conservation ». Une photo à la une d'un enfant japonais souriant à un animal chinois. Chaque yuan en valait la peine."
 CHI_The_Panmunjom_Architecture: "L'architecture de Panmunjom"
 CHI_The_Panmunjom_Architecture_desc: "Nous convoquerons un nouveau dialogue multilatéral à Panmunjom, lieu de l'armistice et de deux décennies de sommets américains avortés. Notre cadre ramène Séoul et Pyongyang à la même table sous notre facilitation, engageant toutes les parties dans un processus par étapes de réduction des tensions, adossé à nos garanties diplomatiques. Le monde nous créditera d'avoir obtenu ce que Washington n'a pu livrer."
 CHI_the_party_that_lasts: "Le Parti qui dure"
 CHI_the_party_that_lasts_desc: "Les mécanismes institutionnels du Parti — le système des congrès, le Comité central et le Politburo — sont réaffirmés comme les moteurs légitimes de la gouvernance, conçus pour survivre à tout dirigeant. La pensée de Xi Jinping est ancrée comme cadre opératoire du siècle à venir, mais le système qui la porte est collectif et durable. Le Parti a survécu à la mort de Mao, à la Révolution culturelle et à Tiananmen. Sa machinerie est bâtie pour durer."
 CHI_The_Pivot_Reversed: "Le pivot inversé"
 CHI_The_Pivot_Reversed_desc: "Le pivot américain vers l'Asie a trop étendu les engagements de Washington et ouvert une brèche stratégique. Nous comblerons le vide à mesure que la crédibilité des États-Unis s'érode, en nous positionnant comme le partenaire de sécurité le plus capable et le plus disposé de Séoul."
 CHI_The_PLAN_Expeditionary_Buildup: "Montée en puissance expéditionnaire de la PLAN"
 CHI_The_PLAN_Expeditionary_Buildup_desc: "Les groupes aéronavals, les bâtiments d'assaut amphibie Type 075 et les flottes de ravitaillement en mer portent la marine de l'Armée populaire de libération à une pleine capacité océanique. La mer de Chine méridionale n'est plus une frontière à défendre. C'est une zone de projection d'où la force peut être projetée à portée intercontinentale."
 CHI_the_poly_compromise: "Le compromis Poly"
 CHI_the_poly_compromise_desc: "Pourquoi abandonner une fortune pour paraître propre ? Poly Group est né du bras de commerce d'armes de l'état-major, et ce n'est que le plus vaste des empires bâtis par l'armée. Nous refusons la cession exigée par Jiang : les affaires restent, la contrebande reste, l'argent reste. L'APL sera riche avant d'être réformée, et la loyauté s'achètera plutôt qu'elle ne s'attirera."
 CHI_The_Princeling_Network: "Le réseau des princelings"
 CHI_The_Princeling_Network_desc: "Nos services de renseignement pénètrent le corps des officiers de l'APK par les enfants de l'élite de Pyongyang formés ici. Ces princelings, façonnés par leurs années à Pékin, sont notre levier le plus fiable à l'intérieur de l'État nord-coréen."
 CHI_the_pterodactyl_generation: "La génération Ptérodactyle"
 CHI_the_pterodactyl_generation_desc: "La famille de drones armés Wing Loong, ou Ptérodactyle, offre à l'armée de l'air un chasseur bon marché et persistant pour la reconnaissance et la frappe, et un export phare qui porte la puissance aérienne chinoise dans une douzaine de guerres étrangères."
 CHI_the_quad_wedge_strategy: "La stratégie du coin dans le Quad"
 CHI_the_quad_wedge_strategy_desc: "Il n'y a pas de Quad sans Tokyo, et pas de Tokyo sans choix. Nous leur en donnerons, en silence, en bilatéral, dans des salles où les Américains n'étaient pas invités."
 CHI_the_quiet_dragons: "Les dragons silencieux"
 CHI_the_quiet_dragons_desc: "Le bruit, c'est la mort sous les flots, et nos bateaux ont toujours été entendus trop tôt. Le sous-marin d'attaque de nouvelle génération Type 095 est conçu autour du silence, avec une propulsion par hydrojet et un réacteur plus discret qui referme l'écart avec les chasseurs américains. Les dragons silencieux pourront enfin glisser au-delà des chaînes d'îles et traquer un porte-avions dans son propre océan."
 CHI_the_rare_earth_lever: "Le levier des terres rares"
 CHI_the_rare_earth_lever_desc: "La plupart des terres rares du monde passent par nos mains. Chaque moteur de Toyota Prius, chaque assemblage d'empennage de F-35, chaque haut-parleur d'iPhone. La vanne est à nous de tourner."
 CHI_the_rcep_acceleration: "Accélération du RCEP"
 CHI_the_rcep_acceleration_desc: "Les Américains ont quitté le TPP. Les Japonais sont restés. Le Partenariat économique régional global sera signé, et Tokyo le signera debout à côté de Pékin, non de Washington."
 CHI_the_renhai_cruiser: "Le croiseur Renhai"
 CHI_the_renhai_cruiser_desc: "La Chine met sur cale son premier véritable bâtiment capital de l'âge moderne. Le Type 055, que l'OTAN classe comme croiseur, est un navire furtif de dix mille tonnes hérissé de plus d'une centaine de cellules de missiles, conçu pour mener un groupe aéronaval et combattre tout ce qui flotte. Huit sont achevés d'ici 2022, et avec eux la marine aligne des combattants de surface égaux à n'importe lesquels au monde."
 CHI_The_Roh_Moohyun_Framework: "Le renouveau de la déclaration du 4 octobre"
 CHI_The_Roh_Moohyun_Framework_desc: "Nous relancerons l'esprit de la déclaration du 4 octobre et endosserons un cadre d'engagement progressif avec la Corée du Nord. Des projets agricoles conjoints, un tourisme limité et un commerce transfrontalier contrôlé peuvent être menés sans préalables, et ce sera à nous de tenir cette porte ouverte."
 CHI_The_Sansha_Administrative_Upgrade: "Mise à niveau administrative de Sansha"
 CHI_The_Sansha_Administrative_Upgrade_desc: "La ville de Sansha, notre siège municipal sur l'île Woody dans les Paracels, étendra désormais sa juridiction à toute la chaîne des Spratleys. Le cadre civil est délibéré : maires, bureaux de recensement et services météorologiques fournissent le couvert politique de ce qui est, en substance, l'incorporation permanente de récifs contestés dans notre ordre administratif."
 CHI_The_Scarborough_Model: "Le modèle Scarborough"
 CHI_The_Scarborough_Model_desc: "L'affrontement du haut-fond de Scarborough nous a donné une méthode reproductible : une rencontre de bateaux de pêche s'escalade en confrontation des gardes-côtes, l'autre partie se retire sous la pression, et une présence permanente s'installe avant qu'un tiers n'intervienne. Nous appliquerons désormais ce modèle de façon systématique à chaque accident géographique encore contesté."
 CHI_The_Sea_Within_The_Sea: "La mer dans la mer"
 CHI_The_Sea_Within_The_Sea_desc: "La mer de Chine méridionale est bordée de toutes parts par la première chaîne d'îles, terres et récifs courbant du Japon aux Philippines jusqu'à la Malaisie, et est devenue, par l'accumulation de présence militaire, d'intégration économique et de décisions territoriales, entièrement enfermée dans notre contrôle administratif. La ligne en neuf traits n'est plus une revendication ; c'est une frontière. Les routes maritimes qui portent un tiers du commerce mondial passent désormais par des eaux que nous gouvernons en droit et en fait, nos gardes-côtes et la marine de l'APL maintenant une patrouille souveraine continue des Paracels aux Spratleys."
 CHI_the_securitate_restructured: "La Securitate restructurée"
 CHI_the_securitate_restructured_desc: "S'inspirant des innovations de Wang Lijun à Chongqing, les services de sécurité intérieure sont réorganisés sur le modèle d'un appareil complet de protection de l'État. Renseignement d'origine électromagnétique, réseaux d'indicateurs et coercition juridique sont intégrés sous un commandement unifié. Nulle conspiration contre l'État du peuple n'échappera à la détection."
 CHI_the_self_reliant_path: "La voie de l'autosuffisance"
 CHI_the_self_reliant_path_desc: "Chaque moteur importé est une laisse. Nous choisissons la voie plus dure de l'autosuffisance, versant des ressources dans nos propres bureaux d'études et acceptant des années d'appareils inférieurs pour que la génération suivante ne doive rien à aucun fournisseur étranger. Une armée de l'air qui ne peut construire ses propres ailes ne sera jamais vraiment libre."
 CHI_the_senkaku_crisis: "La crise des Senkaku"
 CHI_the_senkaku_crisis_desc: "Nous sondons les défenses aériennes du Japon depuis des années et suivons leurs gardes-côtes. La prochaine provocation ne sera plus niable. Un patrouilleur de garde-côtes n'est pas un navire de guerre — jusqu'à ce qu'il le soit."
 CHI_The_Seoul_Gambit: "Le gambit de Séoul"
 CHI_The_Seoul_Gambit_desc: "Nous faisons le pari calculé qu'une relation plus profonde avec Séoul peut apporter une sécurité plus durable qu'un engagement indéfini envers Pyongyang. Approcher la Corée du Sud comme partenaire stratégique plutôt que comme voisin hostile rompt avec des décennies de politique coréenne, et ce n'est pas un choix à prendre à la légère."
 CHI_the_shanghai_succession: "La succession de Shanghai"
 CHI_the_shanghai_succession_desc: "Jiang Zemin transmet la direction formelle à Hu Jintao tout en s'assurant que les loyalistes de la clique de Shanghai dominent le Comité permanent du Politburo. En conservant la présidence de la Commission militaire centrale, il préserve un levier ultime sur la nouvelle direction et scelle l'équilibre factionnel en faveur du réseau des princelings. Le pouvoir est transmis. Il n'est pas cédé."
 CHI_the_shanghai_succession_tt: "L'§Y$CHI_factional_balance$§! au §Y$CHI_16_national_congress_mission$§! décide de la succession : au-dessus de §Y$CHI_shanghai_clique_leaning$§!, elle revient à §YHu Jintao§!, sinon à §YZeng Qinghong§!"
 CHI_the_sharp_blade: "La lame acérée"
 CHI_the_sharp_blade_desc: "La prochaine guerre peut se décider en heures, non en mois. Nous choisissons la lame acérée : des forces légères, aéromobiles et spéciales qui frappent les premières et au loin, s'emparant d'aérodromes, de ports et de capitales avant qu'un défenseur ne réagisse. La vitesse devient notre arme la plus lourde."
 CHI_the_sharp_sword_doctrine: "La doctrine de l'Épée acérée"
 CHI_the_sharp_sword_doctrine_desc: "La furtivité n'est pas réservée aux chasseurs. Le GJ-11 « Épée acérée », drone de combat à aile volante, ancre une doctrine de frappe sans pilote pénétrante, envoyé en avant de la flotte habitée pour trouver et tuer les défenses ennemies là où nul pilote n'a à être exposé."
 CHI_the_soaring_dragon: "Le dragon planant"
 CHI_the_soaring_dragon_desc: "Le WZ-7 « Dragon planant », drone de haute altitude et longue endurance aux ailes jointes caractéristiques, patrouille les approches maritimes pendant des jours, alimentant le réseau de frappe d'une veille constante sur les mers que la Chine entend contrôler."
 CHI_the_sovremenny_bridge: "Le pont Sovremenny"
 CHI_the_sovremenny_bridge_desc: "Tant que nos chantiers ne peuvent construire les navires dont nous avons besoin, nous les achetons. Quatre destroyers Sovremenny des projets 956E et 956EM sont achetés à la Russie à la fin des années 1990, chacun armé du missile antinavire supersonique Moskit conçu pour tuer les porte-avions américains. Ils sont un pont à travers les années, une puissance de feu moderne achetée tandis que la flotte nationale naît encore."
 CHI_The_Spirit_Of_Zheng_He: "L'esprit de Zheng He"
 CHI_The_Spirit_Of_Zheng_He_desc: "Il y a six cents ans, les flottes au trésor de l'amiral Zheng He quittèrent Nankin pour sept voyages qui atteignirent le golfe Persique et la côte d'Afrique de l'Est. Elles portaient soie, porcelaine et les protocoles d'un échange civilisé, non la conquête. La Route de la soie maritime est l'héritière moderne de cette tradition, et notre engagement en Asie du Sud-Est se fera dans son esprit."
 CHI_the_surface_capital_fleet: "La flotte de surface capitale"
 CHI_the_surface_capital_fleet_desc: "Une puissance qu'on ne voit pas n'impressionne pas, et nous entendons être vus. La flotte s'articule autour du porte-avions et du croiseur Type 055, en groupes de combat équilibrés capables de voguer sur n'importe quel océan et de dicter les termes en n'importe quelle mer. Une grande flotte de surface montrant pavillon dans des ports lointains est la preuve visible que la Chine est devenue une puissance maritime."
 CHI_the_tanker_gap: "Combler le déficit de ravitailleurs"
 CHI_the_tanker_gap_desc: "Le rayon d'action est la plus vieille faiblesse de l'armée de l'air. Avec trop peu de ravitailleurs, nos chasseurs ne peuvent stationner loin de chez eux : nous élargissons donc la flotte de ravitaillement en vol pour que les paquets de frappe atteignent les mers lointaines et y restent."
 CHI_The_THAAD_Response: "La riposte au THAAD"
 CHI_The_THAAD_Response_desc: "Le déploiement du système antimissile THAAD en Corée du Sud dégrade notre dissuasion nucléaire. Nous répondrons par la coercition économique : restriction du tourisme, boycott des produits culturels coréens et pression sur les firmes coréennes opérant sur notre sol jusqu'à ce que Séoul reconsidère son accueil."
 CHI_the_three_represents: "Les Trois Représentativités"
 CHI_the_three_represents_desc: "La contribution théorique de Jiang Zemin à la doctrine du Parti tient que le PCC doit représenter les forces productives avancées, la culture avancée et les intérêts les plus larges de notre peuple. En admettant entrepreneurs privés et capitalistes à l'adhésion, nous élargissons la base sociale de notre pouvoir au-delà des ouvriers et des paysans, et le Parti dure."
 CHI_the_tokyo_communique: "Le communiqué de Tokyo"
 CHI_the_tokyo_communique_desc: "Le communiqué d'aujourd'hui dira moins que le texte de 2008, et signifiera davantage. « Perspectives divergentes sur l'histoire » est une formule diplomatique qui veut dire que nous n'en parlerons plus."
 CHI_The_Treasure_Fleet_Returns: "Le retour de la flotte au trésor"
 CHI_The_Treasure_Fleet_Returns_desc: "Les Nouvelles routes de la soie étendent leur volet maritime en Asie du Sud-Est. Concessions portuaires, accords de pêche et coentreprises de plates-formes gazières sont offerts aux États revendicateurs. Chaque accord conclu lie plus étroitement un partenaire à l'orbite économique chinoise et diminue l'attrait de la confrontation."
 CHI_the_type_075_yushen: "Le Type 075 Yushen"
 CHI_the_type_075_yushen_desc: "Les marines gagnent un navire amiral à pont plat. Le Type 075 Yushen, bâtiment d'assaut d'hélicoptères de quarante mille tonnes, porte une brigade et ses hélicoptères d'attaque au-delà de l'horizon et les débarque par air et par mer à la fois. C'est le cœur d'un groupe amphibie conçu pour prendre et tenir le terrain bien au-delà de la côte."
 CHI_the_type_901: "Le Type 901 et la ligne de vie de Djibouti"
 CHI_the_type_901_desc: "Une flotte océanique vit ou meurt par son train de ravitaillement. Le bâtiment de soutien de combat rapide Type 901, assez grand et assez vif pour suivre un groupe aéronaval, permet à la flotte de rester en mer loin de chez elle, et en 2017 la Chine ouvre sa première base outre-mer à Djibouti, une ligne de vie permanente ancrant la marine dans l'océan Indien."
 CHI_the_varyag_refit: "La refonte du Varyag"
 CHI_the_varyag_refit_desc: "Une coque soviétique rouillée devient le germe d'une flotte de porte-avions. Acheté dépouillé à l'Ukraine en 1998 et remorqué à Dalian en 2002, le Varyag inachevé est reconstruit pendant une décennie et admis au service en 2012 sous le nom de Liaoning. C'est davantage un navire-école qu'un navire de guerre, mais sur son pont une marine sans tradition aéronavale apprend, avion après avion, à voler depuis la mer."
 CHI_the_yasukuni_protest_doctrine: "La doctrine de protestation de Yasukuni"
 CHI_the_yasukuni_protest_doctrine_desc: "Quand le Premier ministre du Japon s'incline devant les noms de criminels de guerre de classe A, il n'honore pas ses ancêtres. Il répète pour la prochaine guerre. Notre ambassadeur rentrera à Pékin jusqu'à nouvel ordre."
 CHI_the_yuan_and_the_shang: "Le Yuan et le Shang"
 CHI_the_yuan_and_the_shang_desc: "La force sous-marine sort de l'âge du diesel. Le Type 039 Yuan, bateau diesel-électrique à propulsion indépendante de l'air, peut rôder en silence des semaines dans les mers proches, tandis que le Type 093 Shang nucléaire donne à la flotte son premier sous-marin d'attaque crédible capable d'opérer loin de chez lui. Les chasseurs silencieux deviennent le tranchant le plus acéré de la marine."
 CHI_the_yuzhao_pathfinders: "Les éclaireurs Yuzhao"
 CHI_the_yuzhao_pathfinders_desc: "La projection de puissance amphibie commence par une coque et une brigade. Le transport de chalands de débarquement Type 071 Yuzhao, conçu dans les années 2000, donne à la marine un véritable navire amphibie océanique, et les premières brigades de marines dédiées sont levées pour l'embarquer. Les éclaireurs d'une future force expéditionnaire prennent la mer."
 CHI_theaterization_of_command: "Théâtreiser le commandement aérien"
 CHI_theaterization_of_command_desc: "Les aéronefs doivent répondre au théâtre, non à une chaîne de service séparée. Le commandement aérien est intégré aux cinq commandements de théâtre interarmées, afin que chasseurs, bombardiers et drones combattent sous le même commandant que les forces terrestres et navales, comme une seule campagne plutôt que trois."
 CHI_three_gorges_completion: "Achèvement du projet des Trois Gorges"
 CHI_three_gorges_completion_desc: "Proposé par Sun Yat-sen et défendu par Mao Zedong, le barrage des Trois Gorges sur le Yangtsé est désormais achevé. Avec 32 turbines produisant 22,5 GW de capacité hydroélectrique, il s'impose comme la plus grande centrale du monde. Le projet a déplacé 1,4 million de personnes et submergé deux mille sites archéologiques, mais les bénéfices sont réels : maîtrise des crues, améliorations de la navigation et hausse décisive de la production d'énergie renouvelable pour la Chine centrale et occidentale."
 CHI_three_noc_overseas: "Les trois barils de pétrole partent à l'étranger"
 CHI_three_noc_overseas_desc: "CNPC, Sinopec et CNOOC sont les trois barils de pétrole par lesquels nous projetons notre stratégie du « sortir ». CNPC forage au Soudan via la Greater Nile Petroleum Operating Company, acquiert PetroKazakhstan et signe un accord prêt-contre-pétrole avec Rosneft de 25 milliards de dollars. Sinopec acquiert Addax Petroleum, sécurisant des licences de production en Angola, au Nigeria et au Kurdistan. CNOOC, bloquée dans son offre sur Unocal, réussit à acquérir Nexen Canada. Des accords similaires suivent avec PDVSA et Petrobras. Chaque acquisition est un maillon de chaîne qui sécurise notre approvisionnement énergétique."
 CHI_three_red_lines_crackdown: "Répression du financement immobilier"
 CHI_three_red_lines_crackdown_desc: "Les régulateurs imposent trois plafonds de ratios aux promoteurs immobiliers : passif sur actif inférieur à 70 %, dette nette sur fonds propres inférieure à 100 %, et trésorerie sur dette à court terme supérieure à 100 %. Evergrande, avec plus de 300 milliards de dollars de passif, viole les trois et s'effondre, liquidée par un tribunal de Hong Kong. Plus de 70 % des trente premiers promoteurs entrent en restructuration. La politique isole le risque financier systémique du secteur bancaire au prix d'une activité de construction fortement réduite et de recettes locales en berne. Le prix est élevé, mais l'alternative était une contagion que nous n'aurions pu contenir."
 CHI_three_represents_codified: "Trois représentations codifiées"
 CHI_three_represents_codified_desc: "Les entrepreneurs privés sont admis au Parti. L'amendement de Shanghai trouve sa place dans la Constitution. L'héritage de Jiang est scellé par écrit."
 CHI_tiangong_station: "Station spatiale Tiangong"
 CHI_tiangong_station_desc: "Le module central Tianhe de la station spatiale Tiangong a été lancé en avril 2021, suivi des cabines scientifiques Wentian et Mengtian en 2022. La Chine exploite désormais un laboratoire orbital habité permanent, entièrement indépendant de la Station spatiale internationale, accueillant des équipages de six mois et un programme croissant de recherche en micropesanteur."
 CHI_tianwen_interplanetary: "Sonde interplanétaire Tianwen"
 CHI_tianwen_interplanetary_desc: "Tianwen-1 a décollé en juillet 2020 et a réussi orbite, entrée atmosphérique et atterrissage en une seule mission, livrant le rover Zhurong à Utopia Planitia en mai 2021. La Chine n'est devenue que le deuxième pays à faire opérer un rover sur Mars. La mission a démontré la navigation dans l'espace lointain, l'évitement autonome d'obstacles et la relais de communication à haut gain, précurseurs essentiels de missions habitées au-delà de l'espace cislunaire."
 CHI_Tianxia_Realized: "Tout sous le Ciel"
 CHI_Tianxia_Realized_desc: "À Davos, nous avons formulé la vision d'un ordre mondial ouvert et inclusif, ancré dans les institutions multilatérales et une prospérité partagée : une communauté de destin pour l'humanité. Cette vision s'est désormais réalisée non par la coercition, mais par une gravité économique accumulée. L'Initiative pour le développement mondial, la Banque asiatique d'investissement dans les infrastructures et une coopération de qualité des Nouvelles routes de la soie ont attiré la communauté internationale dans un cadre qui reconnaît notre centralité par l'intérêt. Le monde que nous menons désormais a choisi de suivre."
 CHI_tiger_and_flies: "Tigres et mouches"
 CHI_tiger_and_flies_desc: "La campagne anticorruption vise à la fois les tigres de haut rang et les petites mouches dans tout l'appareil du Parti. Zhou Yongkang, ancien membre du Comité permanent du Politburo, a écopé de la perpétuité ; Bo Xilai est tombé avant lui. Plus de deux millions de cadres ont désormais été enquêtés et sanctionnés. La campagne est à la fois une véritable réforme de gouvernance et un moyen de démanteler les réseaux politiques rivaux — et nous ne pouvons plus nous permettre de l'arrêter."
 CHI_Tonga_Tuna_Concession: "Concessions de pêche du Pacifique"
 CHI_Tonga_Tuna_Concession_desc: "Des accords d'accès exclusif avec Tonga, Vanuatu et Fidji accordent à nos flottes de pêche lointaine des droits préférentiels sur de vastes zones économiques exclusives du Pacifique central et occidental. En échange, nous finançons des modernisations portuaires, des installations frigorifiques et une capacité de surveillance maritime qui lient les gouvernements bénéficiaires à une dépendance infrastructurelle de long terme. Les accords halieutiques sont le tranchant économique de notre engagement plus large dans le Pacifique."
 CHI_train_as_you_fight: "S'entraîner comme on combat"
 CHI_train_as_you_fight_desc: "L'exercice de parade gagne les défilés, pas les guerres. L'entraînement est reconstruit autour de conditions de combat réalistes, avec des exercices en jeu libre et une force adverse dédiée à la base de Zhurihe qui punit les victoires scénarisées d'autrefois."
 CHI_train_generals: "Former les généraux"
 CHI_train_generals_desc: "Les réformes sur le papier meurent sans commandants qui les comprennent. Nos académies se réoutillent pour produire des officiers fluents dans la guerre interarmées et le commandement de l'âge de l'information, écartant les nominations politiques incapables de lire une bataille moderne."
 CHI_TwentyFive_Year_Iran_Accord: "Partenariat Chine-Iran de 25 ans"
 CHI_TwentyFive_Year_Iran_Accord_desc: "Notre partenariat stratégique global nous engage à 400 milliards de dollars d'investissement dans les infrastructures, l'énergie et l'industrie iraniennes sur 25 ans, en échange de livraisons de pétrole à prix réduit. L'accord offre à Téhéran une bouée sous sanctions américaines et nous offre des hydrocarbures à rabais et une position avancée dans le golfe Persique. Washington, Tel Aviv et les monarchies du Golfe y voient une menace directe pour leur calcul de sécurité régional. Qu'ils le voient."
 CHI_two_centeraries: "Le XIXe Congrès du Parti"
 CHI_two_centeraries_desc: "Le XIXe Congrès national inscrit la « pensée de Xi Jinping sur le socialisme à la chinoise pour une nouvelle ère » dans la Constitution du Parti du vivant de Xi, une distinction que Mao Zedong fut le dernier à détenir. Les deux objectifs du centenaire cadrent notre horizon : une société moyennement prospère d'ici 2021 et une nation socialiste pleinement développée d'ici 2049. La trajectoire de l'État pour les trois prochaines décennies est désormais fixée, et les ressources de chaque institution doivent y être dirigées."
 CHI_two_establishments: "Les deux établissments"
 CHI_two_establishments_desc: "La doctrine des « deux établissments » affirme la position centrale du camarade Xi Jinping au sein du Comité central du Parti et le rôle directeur de la pensée de Xi Jinping dans la vie du Parti. La direction collective n'est pas abolie mais recadrée : le Comité permanent délibère, mais la direction est fixée par un seul. Le Parti se meut comme un seul corps, et ce corps a un centre."
 CHI_two_ocean_fleet: "La flotte des deux océans"
 CHI_two_ocean_fleet_desc: "Ni les profondeurs ni le pont seuls ne suffisent à ce que la Chine entend désormais. Nous fusionnons la force sous-marine silencieuse et la fière flotte de surface en une seule marine capable de combattre sur deux océans à la fois, le Pacifique et l'Indien, tenant les mers proches tout en allant aux lointaines. De la garde côtière que Liu Huaqing a héritée, une véritable puissance océanique émerge, seconde de une seule, et qui rattrape."
 CHI_two_reaffirmations: "Deux réaffirmations"
 CHI_two_reaffirmations_desc: "Le Parti réaffirme deux engagements fondateurs : la loyauté à la voie socialiste telle que définie par la pensée de Mao Zedong, et la primauté de la Ligne de masse comme méthode correcte de direction du Parti. Ce ne sont pas des slogans. Ce sont des garanties structurelles contre la dérive droitière qui a laissé l'inégalité et la corruption vider la révolution de l'intérieur."
 CHI_type_15_light_tank: "Le char léger Type 15"
 CHI_type_15_light_tank_desc: "Les blindés lourds ne respirent pas sur le plateau tibétain ni ne franchissent les ponts du Sud. Le ZTQ-15, char léger de trente tonnes au canon de 105 mm puissant, donne aux brigades rapides un vrai blindage là où un Type 99 ne peut aller, et il fixe désormais l'Inde le long de la frontière himalayenne."
 CHI_type_95_adoption: "Adopter le Type 95"
 CHI_type_95_adoption_desc: "Le QBZ-95, bullpup de 5,8 mm adopté à la fin des années 1990, remplace le Type 81 vieillissant sur toute la ligne et standardise l'infanterie sur une cartouche nationale. Ses bizarreries sont réelles, mais il met un fusil moderne et indigène dans les mains de chaque soldat."
 CHI_ultra_low_emission: "Normes d'émissions ultra-faibles"
 CHI_ultra_low_emission_desc: "Le ministère de l'Écologie et de l'Environnement et le MIIT ont édicté des normes exigeant des usines de frittage, des cokerie et des aciéries qu'elles respectent des seuils d'émission plus stricts que les normes européennes. Plus de 80 % des grands sidérurgistes intégrés achèvent la modernisation. La réforme remplace la pratique des arrêts totaux autour des événements politiques — bleu APEC, bleu défilé — par une infrastructure permanente d'air propre. Nous ne devrions plus dégager le ciel pour les occasions. Nous devrions le garder propre."
 CHI_underground_great_wall: "La Grande Muraille souterraine"
 CHI_underground_great_wall_desc: "Sous les montagnes, nous creusons la Grande Muraille souterraine, des milliers de kilomètres de tunnels durcis qui cachent et abritent nos forces et nos missiles. Ce qu'on ne trouve pas ne peut être détruit, et un arsenal enterré garantit qu'une première frappe sera toujours ripostée."
 CHI_undersea_supremacy: "Suprématie sous-marine"
 CHI_undersea_supremacy_desc: "Nous régnerons sur les profondeurs plutôt que sur la surface. La priorité de la flotte devient le sous-marin : chasseurs nucléaires pour tuer les porte-avions, SNLE pour tenir le monde en otage, et un mur de bateaux silencieux transformant la première chaîne d'îles en piège. Que les rivaux paradent leurs grandes flottes au-dessus ; nous posséderons l'eau sous eux et leur refuserons la mer sans jamais montrer un mât."
 CHI_Unification_Ultimatum: "Ultimatum d’unification de la péninsule"
 CHI_Unification_Ultimatum_desc: "Pékin et Washington étant alignés, l'heure est venue de présenter à Pyongyang un choix : accepter la réunification pacifique sous Séoul, ou affronter le poids combiné des armées chinoise, américaine et sud-coréenne. L'ultimatum clôt la question coréenne d'une manière ou d'une autre."
 CHI_Vision_2030_Partnership: "Partenariat d'investissement Vision 2030"
 CHI_Vision_2030_Partnership_desc: "L'agenda de diversification Vision 2030 de l'Arabie saoudite et notre appétit pour le capital du Golfe et les marchés de contrats convergent dans un partenariat tentaculaire couvrant l'énergie propre, les infrastructures touristiques et l'industrie avancée. Nos firmes remportent d'importants contrats NEOM et mer Rouge tandis que nous sécurisons un approvisionnement préférentiel en brut et une part croissante de règlement en yuan. L'arrangement offre à Riyad une optionnalité stratégique sans rompre formellement sa dépendance sécuritaire vis-à-vis de Washington."
 CHI_wanhua_strategic_materials: "Liste des matériaux stratégiques"
 CHI_wanhua_strategic_materials_desc: "Le MIIT a publié une liste d'environ 130 matériaux chimiques où nous restons dépendants des importations. Résines photosensibles de lithographie, films de polyimide, fibre de carbone haute résistance T800 et au-delà, et polyuréthanes MDI et TDI figurent parmi les plus critiques. Wanhua Chemical à Yantai, qui a reverse-engineered la technologie MDI de Mitsui et acquis BorsodChem en Hongrie, a brisé l'oligopole polyuréthane de Bayer, BASF et Huntsman. Weihai Guangwei Composites, Jilin Carbon Valley et Sinopec Shanghai Petrochemical construisent une capacité de fibre de carbone pour pales d'éoliennes et composites aérospatiaux. Chaque substitution réduit notre exposition structurelle aux contrôles d'exportation étrangers."
 CHI_warlord_temptation: "La tentation seigneuriale"
 CHI_warlord_temptation_desc: "Une armée qui sert l'argent peut être tentée de se servir elle-même. Avec des régions, des recettes et des troupes loyales en main, les grands commandants glissent vers le plus ancien danger chinois : une force qui obéit à ses généraux avant le centre, et une république qui dérive vers l'âge des seigneurs de la guerre."
 CHI_water_security_initiative: "Initiative nationale de sécurité hydrique"
 CHI_water_security_initiative_desc: "Le déséquilibre hydrique nord-sud de la Chine est traité depuis 2002 par le projet de transfert d'eau sud-nord, le plus vaste schéma de dérivation interbassins jamais construit, canalisant l'eau du bassin du Yangtsé vers le bassin asséché du Fleuve Jaune et la région de la capitale. Une campagne nationale de sécurité hydrique s'appuie sur cette fondation, couplant de grandes infrastructures à des projets de conservation provinciaux ciblant les zones les plus stressées du Nord. En achever assez soulagera progressivement la pénurie qui pèse sur l'économie nationale."
 CHI_weqi_pipeline_lines: "Le gazoduc ouest-est"
 CHI_weqi_pipeline_lines_desc: "Le projet de transport de gaz ouest-est relie le bassin du Tarim au Xinjiang à Shanghai par une artère de 4 000 kilomètres, une deuxième ligne portant le gaz turkmène vers l'est via Khorgos et une troisième depuis le Turkménistan via le Kirghizistan la suivant. Le gazoduc Force de Sibérie, convenu avec Vladimir Poutine sous un contrat de 30 ans et 38 milliards de mètres cubes par an, livre désormais le gaz du Heilongjiang directement dans notre réseau oriental. CNPC et PetroChina gèrent construction et exploitation. Nul pays qui contrôle cette infrastructure de gazoducs ne peut être étranglé par un embargo énergétique."
 CHI_west_east_gas_pipeline: "Gazoduc Ouest-Est"
 CHI_west_east_gas_pipeline_desc: "Le gazoduc ouest-est parcourt 4 000 kilomètres du bassin du Tarim au Xinjiang jusqu'à Shanghai, achevé en 2004. Il alimente l'est industriel de la Chine en gaz naturel, réduisant la dépendance au charbon et accélérant la commercialisation des réserves d'hydrocarbures du Xinjiang."
 CHI_western_development_strategy: "La stratégie de développement de l'Ouest"
 CHI_western_development_strategy_desc: "Le programme Xibu Da Kaifa dirige investissement préférentiel, incitations fiscales et construction accélérée d'infrastructures vers douze provinces et régions autonomes de l'Ouest. Nous refermons l'écart côte-intérieur et approfondissons notre intégration avec l'Asie centrale et du Sud, attirant la périphérie dans notre cœur économique avant que des rivaux ne remplissent l'espace."
 CHI_western_energy_strategy: "Développement énergétique de l'Ouest"
 CHI_western_energy_strategy_desc: "Les provinces occidentales de la Chine détiennent les plus grandes réserves nationales de charbon, de gaz naturel et d'hydroélectricité. Une stratégie de développement coordonnée relie l'extraction au cœur industriel côtier, réduisant la dépendance aux importations d'énergie et étendant l'activité économique vers l'intérieur."
 CHI_western_industrial_drive: "Campagne de développement industriel de l'Ouest"
 CHI_western_industrial_drive_desc: "Le Conseil des affaires d'État a approuvé l'élévation de 169 parcs industriels provinciaux au rang de zones nationales de développement économique et technologique, la majorité visant les provinces occidentales sous-développées. L'investissement prioritaire au Yunnan, au Guizhou et dans le Sichuan occidental commence à refermer l'écart de revenus avec la côte et à établir les préalables logistiques d'une industrie intérieure à grande échelle. L'Ouest a assez attendu."
 CHI_western_institutional_engagement: "Engagement institutionnel occidental"
 CHI_western_institutional_engagement_desc: "Zeng Qinghong défend un engagement approfondi avec les institutions multilatérales menées par l'Occident comme le meilleur moyen de sécuriser notre position dans l'ordre international tant que les règles se fixent encore. Nous poussons à l'élargissement de notre quota au FMI, adoptons les normes internationales d'information financière dans nos entreprises d'État et accroissons notre représentation aux conseils de la Banque mondiale. Mieux vaut façonner l'architecture de l'intérieur que de rester dehors."
 CHI_western_pipeline_corridor: "Gazoduc Ouest-Est"
 CHI_western_pipeline_corridor_desc: "Le gazoduc ouest-est parcourt 4 000 kilomètres du bassin du Tarim au Xinjiang, à travers le Gansu, le Shaanxi et le delta du Yangtsé jusqu'à Shanghai. Une fois achevé, il déplacera le charbon dans l'industrie du delta du Yangtsé et réduira la pollution particulaire qui étouffe nos plus riches villes côtières, liant les ressources de l'Ouest à la croissance de l'Est."
 CHI_Win_Win_Cooperation: "Communauté de destin partagé"
 CHI_Win_Win_Cooperation_desc: "Après les critiques internationales croissantes du financement par piège de la dette, nous réformons nos conditions de prêt, introduisant des taux concessionnels, des exigences de main-d'œuvre locale et des évaluations de soutenabilité de la dette. Le cadrage « gagnant-gagnant » repositionne les Nouvelles routes de la soie comme un véhicule de développement mutuel plutôt que de levier stratégique, et les critiques trouvent leurs arguments plus difficiles à soutenir."
 CHI_Wolf_Warrior_Diplomacy: "Diplomatie du guerrier loup"
 CHI_Wolf_Warrior_Diplomacy_desc: "Nous adopterons une posture diplomatique assertive et confrontationnelle. Nos diplomates défendront agressivement nos intérêts et contesteront les récits occidentaux partout où ils les trouveront. L'objectif est clair : remplacer les États-Unis comme puissance mondiale dominante."
 CHI_wolf_warrior_doctrine: "Diplomatie du guerrier loup"
 CHI_wolf_warrior_doctrine_desc: "Un nouveau style diplomatique assertif a émergé de notre ministère des Affaires étrangères. Nos ambassadeurs attaquent publiquement les critiques étrangers ; les porte-parole de l'État répondent à la censure par des accusations d'hypocrisie et de mauvaise foi. L'approche abandonne la doctrine de Deng Xiaoping de cacher sa force et d'attendre son heure au profit d'une confrontation directe. Nous ne nous excusons plus, et le monde commence à comprendre ce que cela signifie."
 CHI_ws15_bottleneck_solve: "Briser le goulet du WS-15"
 CHI_ws15_bottleneck_solve_desc: "Le turboréacteur est le mur contre lequel chaque chasseur chinois s'est brisé, forçant le recours aux turbines russes pour nos meilleurs appareils. Le turboréacteur WS-15 doit mettre fin à cette dépendance et donner au J-20 la poussée de supercroisière autour de laquelle il a été conçu. Maîtriser l'aube de turbine monocristalline est le dernier mètre de l'ascension."
 CHI_wto_accession_drive: "Campagne d’accession à l’OMC"
 CHI_wto_accession_drive_desc: "Après quinze ans de négociations, nous sommes au seuil de l'adhésion formelle à l'Organisation mondiale du commerce. L'accession verrouillera nos réformes de libéralisation commerciale, ouvrira les marchés étrangers à nos exportations et accélérera le transfert de technologie industrielle entre nos mains."
 CHI_wto_commercial_bank_reform: "Réforme de la loi bancaire commerciale de l'OMC"
 CHI_wto_commercial_bank_reform_desc: "Notre adhésion à l'OMC nous engage à ouvrir le secteur financier aux banques étrangères, et le Premier ministre Zhu Rongji a lancé une restructuration en trois étapes avant cette échéance. Des sociétés de gestion d'actifs absorbent des centaines de milliards de prêts non performants ; Central Huijin Investment injecte du capital à partir des réserves de change ; les quatre grandes banques s'introduisent en bourse à l'étranger pour imposer une discipline de marché. La révision de la loi sur les banques commerciales transforme les quatre grandes de véhicules de crédit politique en institutions formellement commerciales, une distinction qui comptera quand les banques étrangères arriveront pour concourir."
 CHI_wto_implementation: "Mise en œuvre de l'OMC"
 CHI_wto_implementation_desc: "Notre adhésion à l'OMC nous a engagés à un calendrier pluriannuel de baisses tarifaires, de réformes de la propriété intellectuelle, d'ouverture des services et d'élimination des privilèges de commerce d'État. La mise en œuvre a été inégale et souvent contestée par les partenaires commerciaux à l'Organe de règlement des différends, mais le processus nous a profondément intégrés aux chaînes d'approvisionnement mondiales, et cette intégration est une arme autant qu'une obligation."
 CHI_wto_implementation_tt: "Si nous achevons §Y$CHI_wto_accession_drive$§!, le bonus sera meilleur et permanent "
 CHI_wuhan_automotive_hub: "Centre automobile de Wuhan"
 CHI_wuhan_automotive_hub_desc: "Dongfeng Motor Corporation, dont le siège est à Wuhan, élargit ses coentreprises avec Peugeot-Citroën, Nissan et Honda. Wuhan devient la capitale automobile de la Chine centrale, ancrant un cluster de fournisseurs de composants et de firmes logistiques le long du Yangtsé."
 CHI_xi_jinping_thought_enshrined: "La pensée de Xi Jinping consacrée"
 CHI_xi_jinping_thought_enshrined_desc: "La pensée de Xi Jinping est élevée du guidage politique au rang de doctrine constitutionnelle, étudiée de façon obligatoire dans les universités, les académies militaires et les écoles du Parti à l'échelle nationale. L'application Xuexi Qiangguo est installée sur des centaines de millions de téléphones et surveillée pour l'engagement quotidien. La dissidence n'est plus seulement malvenue ; elle est désormais officiellement un écart par rapport à la vérité établie. L'architecture idéologique de l'État et un seul nom ne sont plus séparables."
 CHI_xinjiang_industrial_zones: "Développement industriel du Xinjiang"
 CHI_xinjiang_industrial_zones_desc: "Des zones industrielles spéciales à Ürümqi et dans le bassin du Tarim attirent la migration han, les industries de transformation et l'investissement extractif. Les zones sont conçues pour ancrer l'économie du Xinjiang à la base industrielle de l'Est et réduire sa dépendance à l'agriculture traditionnelle."
 CHI_y20_strategic_lift_program: "Le programme de transport stratégique Y-20"
 CHI_y20_strategic_lift_program_desc: "Une grande puissance doit pouvoir se déplacer elle-même. Le Y-20 « Kunpeng », gros porteur à réaction en service depuis 2016, donne enfin à la Chine le pont aérien pour déployer troupes, blindés et aide à travers les continents, et ses variantes ravitailleur et de commandement multiplient la portée de toute l'armée de l'air."
 CHI_Yangtze_confederation: "Confédération économique du Yangtsé"
 CHI_Yangtze_confederation_desc: "Le bassin du Yangtsé — de Chongqing à travers le Hubei et le Hunan jusqu'à l'embouchure à Shanghai — contient le cœur industriel de la Chine. Une confédération économique formelle de ces provinces sous une planification coordonnée éliminera les investissements redondants, intégrera les chaînes d'approvisionnement et projettera le modèle de Chongqing à travers le corridor le plus productif de la nation."
 CHI_yangtze_delta_integration: "Intégration du Delta du Yangtsé"
 CHI_yangtze_delta_integration_desc: "Un investissement d'État coordonné à travers Shanghai, le Jiangsu et le Zhejiang approfondit le delta du Yangtsé comme notre premier corridor manufacturier et d'exportation. La concentration de capital étranger et de main-d'œuvre qualifiée ici ancrera la croissance de la décennie à venir."
 CHI_yangtze_logistics_corridor: "Corridor logistique du fleuve Yangtze"
 CHI_yangtze_logistics_corridor_desc: "Le Yangtsé transporte plus de fret que n'importe quelle autre voie d'eau intérieure au monde. L'investissement dans les infrastructures portuaires, les améliorations de navigation et les terminaux intermodaux intègre le fleuve aux chaînes d'approvisionnement nationales, reliant le Sichuan à Shanghai pour une fraction du coût du transport routier."
 CHI_yj12_standoff_family: "La famille d'attaque à distance YJ-12"
 CHI_yj12_standoff_family_desc: "Le YJ-12 donne à nos aéronefs un missile antinavire supersonique rasant les flots qui se ferme trop vite pour que la plupart des défenses répondent. Suspendu sous bombardiers et chasseurs, il met en danger chaque navire de guerre à des centaines de kilomètres de la côte chinoise."
 CHI_youth_league_pipeline: "Le vivier de la Ligue de la jeunesse"
 CHI_youth_league_pipeline_desc: "La Ligue de la jeunesse communiste est le principal vivier de talents de la faction de Hu Jintao. Les anciens de la LJC détiennent une majorité de secrétariats provinciaux et dominent les postes ministériels centraux de niveau intermédiaire, formant un réseau national de cadres liés par une expérience organisationnelle partagée. Ceux qui grimpent par ses rangs doivent leur avancement au même système."
 CHI_yuan_internationalisation: "Internationalisation du Yuan"
 CHI_yuan_internationalisation_desc: "La crise financière mondiale a exposé la fragilité du dollar et nous a donné notre ouverture. Des accords de swap de devises avec des dizaines de banques centrales, des centres de compensation du yuan offshore à Hong Kong et Singapour, et un marché d'obligations dim sum ont donné à notre renminbi sa première circulation internationale significative. La prime de réserve du dollar ne survivra pas indéfiniment."
 CHI_yuanhua_model: "Le modèle Yuanhua"
 CHI_yuanhua_model_desc: "Lai Changxing a montré comment on s'y prend. Depuis Xiamen, son empire Yuanhua a fait passer quelque dix milliards de dollars de pétrole, de voitures et de cigarettes dans les années 1990, et chaque fois que les douanes se rapprochaient, un officier puissant apparaissait pour les éconduire. Nous faisons de son arrangement un système : l'armée protège le contrebandier, et le contrebandier paie l'armée."
 CHI_yuzhao_hull_coral_brigades: "La coque Yuzhao et les brigades de corail"
 CHI_yuzhao_hull_coral_brigades_desc: "L'ambition amphibie passe de l'éclaireur à la flotte. Le Type 071 entre en production en série, et le corps des marines passe de deux brigades à six, entraînées pour les récifs et îles contestés de mer de Chine méridionale. Coque et brigade de corail grandissent ensemble en une force capable de s'emparer d'un rivage."
 CHI_zb108_wheeled_family: "La famille à roues Type 08"
 CHI_zb108_wheeled_family_desc: "La famille 8x8 Type 08, du transport d'infanterie au canon d'assaut jusqu'à l'ambulance, donne aux brigades moyennes un seul châssis à roues, rapide sur route et bon marché à faire tourner, le noyau mobile des forces de déploiement rapide de la Chine."
 CHI_zbd04_apex_ifv: "Le VCI de pointe ZBD-04A"
 CHI_zbd04_apex_ifv_desc: "Le ZBD-04A est le premier véhicule de combat d'infanterie chenillé de l'armée, portant un canon-lanceur de 100 mm, un canon de 30 mm et une escouade complète sous blindage. C'est l'épine dorsale des brigades mécanisées lourdes et le partenaire du Type 99 sur la ligne Chine-Inde."
 CHI_zbd_mechanisation: "Mécanisation ZBD"
 CHI_zbd_mechanisation_desc: "L'infanterie doit suivre le rythme des blindés. La famille de véhicules de combat chenillés ZBD porte les fusiliers en avant sous blindage et combat aux côtés des chars, achevant la mécanisation des brigades lourdes."
 CHI_zeng_qinghong_reign: "L'ère Zeng Qinghong"
 CHI_zeng_qinghong_reign_desc: "Zeng Qinghong, principal stratège de la clique de Shanghai, sert comme vice-président et chef de l'École centrale du Parti. Son contrôle du Département de l'organisation et du Secrétariat central lui donne une influence décisive sur les nominations de personnel à tous les niveaux de l'appareil Parti-État. Ceux qu'il place, il les possède."
 CHI_zero_hour: "Heure zéro"
 CHI_zero_hour_desc: "Pendant des années, l'armée s'est entraînée, rééquipée et a attendu, et l'heure est venue de tout mettre en œuvre. Notre infanterie avancera en nombres qu'aucune ligne défensive ne peut absorber, nos colonnes blindées en formations trop profondes pour être retournées, tandis que les forces de fusées stratégiques attendent dans leurs silos comme l'argument que nous n'entendons jamais être forcés de formuler. Dès cette heure, l'Armée populaire de libération cesse de se préparer à la prochaine guerre et commence plutôt à l'attendre, chaque commandement répondant enfin à une seule volonté."
 CHI_ztz96_mainstreaming: "Généraliser le Type 96"
 CHI_ztz96_mainstreaming_desc: "Toutes les brigades n'ont pas besoin du coûteux Type 99. Le ZTZ-96, moins cher et plus léger, est produit en masse et progressivement porté aux versions 96A et 96B, devenant le char de travail qui remplit le corps de la force blindée."
 CHI_ztz99_rollout: "Déployer le Type 99"
 CHI_ztz99_rollout_desc: "Le ZTZ-99 devient le fer de lance des brigades lourdes, un char de bataille principal de troisième génération au blindage composite, au canon de 125 mm et à une suite de défense laser. C'est le premier char chinois conçu pour affronter le meilleur de l'Occident et de la Russie à armes égales."
 CHI_ztz99a_apex: "Le Type 99A de pointe"
 CHI_ztz99a_apex_desc: "Le ZTZ-99A, mis en service à partir de 2011, est le sommet de la lignée : blindage plus lourd, moteur suralimenté, viseur chasseur-tueur et un système complet de gestion de bataille qui en fait un nœud du réseau de brigade. C'est le poing le plus lourd que l'armée puisse lancer."
 arctic_observer_status: "Statut d'observateur de l'Arctique"
 arctic_observer_status_desc: "Notre siège au Conseil de l'Arctique et nos infrastructures de Route de la soie polaire ouvrent de nouvelles voies maritimes et des frontières de ressources dans le Grand Nord."
 CHI_610_directive_active: "610 Directive Nord-Est"
 CHI_610_directive_active_desc: "Le commandement du Nord-Est du PCC a activé des protocoles de mobilisation d'urgence. Les forces de sécurité le long du Yalou sont renforcées, et les autorités provinciales opèrent sous des pouvoirs d'urgence élargis."
 CHI_aiib_dividend_member: "Membre des dividendes de l'AIIB"
 CHI_aiib_dividend_member_desc: "L'adhésion fondatrice à la Banque asiatique d'investissement dans les infrastructures livre des retours réguliers. Les versements d'investissement et les conditions commerciales préférentielles avec les projets financés par la Chine renforcent notre bilan."
 CHI_anti_corruption_purge: "Purge anticorruption"
 CHI_anti_corruption_purge_desc: "La Commission centrale de contrôle de la discipline traite des milliers de dossiers par an. La concussion dans les marchés, la construction et la gestion des entreprises d'État est exposée et sanctionnée. Les cadres qui prélevaient une rente sur chaque contrat constatent que le calcul politique a changé. La production par fonction d'État augmente à mesure que les réseaux de clientèle sont démantelés et remplacés par une responsabilité directe."
 CHI_anti_terror_crackdown_idea: "Répression antiterroriste"
 CHI_anti_terror_crackdown_idea_desc: "Les services de sécurité mènent une opération nationale contre les réseaux terroristes. La capacité de détection est élevée tandis que la bande passante politique est absorbée par la répression."
 CHI_army_reorganisation_disruption_idea: "Réorganisation de l'armée"
 CHI_army_reorganisation_disruption_idea_desc: "Les treize armées de groupe sont renumérotées et reconstruites autour de brigades interarmes. Pendant le remaniement, l'organisation et la puissance offensive souffrent et l'entraînement s'accumule. Une fois la nouvelle structure installée, la force terrestre émerge plus mince et plus capable qu'auparavant."
 CHI_asian_century_concord_idea: "Le concordat du siècle asiatique"
 CHI_asian_century_concord_idea_desc: "Pékin et New Delhi ont convenu de se coordonner sur les affaires régionales et mondiales, cadrant le XXIe siècle comme celui de l'Asie à façonner ensemble."
 CHI_AUS_pacific_deterrence: "Dissuasion accrue dans le Pacifique"
 CHI_AUS_pacific_deterrence_desc: "La pression chinoise de basing dans le Pacifique Sud a forcé une expansion urgente de la portée de la Royal Australian Navy. De nouveaux capteurs, un renseignement plus acéré et des moyens amphibies préparés sont prêts."
 CHI_ban_strategic_partnership: "Partenariat stratégique avec Pékin"
 CHI_ban_strategic_partnership_desc: "Le Bangladesh aligne sa posture de politique étrangère sur la Chine dans les forums multilatéraux."
 CHI_banking_modernised_idea: "Secteur bancaire recapitalisé"
 CHI_banking_modernised_idea_desc: "Les banques d'État ont été nettoyées des prêts non performants et cotées avec des actionnaires minoritaires étrangers à la Bourse de Hong Kong. Normes comptables internationales, audit externe et discipline de marché améliorent l'efficacité et la crédibilité du secteur."
 CHI_beidou_global_constellation: "Constellation mondiale Beidou"
 CHI_beidou_global_constellation_desc: "Avec des stations au sol déployées en Amérique latine, le réseau satellitaire Beidou offre désormais une couverture mondiale complète. Opérations navales, reconnaissance et contre-espionnage bénéficient tous de la précision et de la portée."
 CHI_beijing_communique_guarantor: "Garant du communiqué de Pékin"
 CHI_beijing_communique_guarantor_desc: "Le rôle de la Chine dans le courtage de la paix entre deux rivaux régionaux a rehaussé son standing de puissance responsable. Le capital diplomatique circule librement et les relations sont plus faciles à entretenir."
 CHI_blue_national_soil: "Sol national bleu"
 CHI_blue_national_soil_desc: "La doctrine officielle de la RPC désignant l'espace marin à l'intérieur de la ligne en neuf traits comme « sol national bleu » : un territoire maritime aussi inaliénable que n'importe quelle province terrestre. Le cadrage rend toute concession politiquement impossible et redéfinit toute présence étrangère comme une intrusion."
 CHI_blue_national_soil_militarised: "Sol national bleu militarisé"
 CHI_blue_national_soil_militarised_desc: "Ce qui commença comme une doctrine administrative est devenu une posture opérationnelle. Les moyens de la marine de l'APL et des gardes-côtes font désormais appliquer activement la revendication de sol national bleu, traitant les incursions de navires étrangers comme des violations du droit interne chinois."
 CHI_bo_ideological_consolidation: "Consolidation idéologique"
 CHI_bo_ideological_consolidation_desc: "Une campagne de clarification idéologique renforce les engagements socialistes du Parti et contre la dérive droitière. Sessions d'étude, réunions de rectification et programmes scolaires révisés ancrent les deux réaffirmations dans tout l'appareil d'État."
 CHI_bri_forum_momentum: "Élan du Forum des Nouvelles routes de la soie"
 CHI_bri_forum_momentum_desc: "Le Forum triennal des Nouvelles routes de la soie à Pékin a réaffirmé l'engagement de la Chine envers une mondialisation portée par les infrastructures. Les délégations étrangères repartent avec de nouveaux engagements et notre diplomatie économique en récolte un dividende pluriannuel."
 CHI_bri_industrial_zones_tier_1_idea: "Zones économiques spéciales I"
 CHI_bri_industrial_zones_tier_1_idea_desc: "Des zones économiques spéciales à l'étranger, bâties sur un modèle chinois, étendent notre base manufacturière au-delà de nos frontières."
 CHI_bri_industrial_zones_tier_2_idea: "Zones économiques spéciales II"
 CHI_bri_industrial_zones_tier_2_idea_desc: "Les zones d'outre-mer ont mûri en parcs industriels opérationnels, et l'expertise de construction reflue vers les programmes de construction nationaux."
 CHI_bri_industrial_zones_tier_3_idea: "Zones économiques spéciales III"
 CHI_bri_industrial_zones_tier_3_idea_desc: "Un réseau de parcs industriels gérés par la Chine ancre les économies partenaires à nos chaînes d'approvisionnement et à notre industrie du BTP."
 CHI_bri_mines_tier_1_idea: "Concessions de ressources I"
 CHI_bri_mines_tier_1_idea_desc: "Les concessions minières obtenues par des prêts d'États partenaires alimentent l'industrie chinoise en matières premières."
 CHI_bri_mines_tier_2_idea: "Concessions de ressources II"
 CHI_bri_mines_tier_2_idea_desc: "Le portefeuille de concessions s'est élargi à plusieurs secteurs extractifs, approfondissant la base de ressources disponible pour notre économie."
 CHI_bri_mines_tier_3_idea: "Concessions de ressources III"
 CHI_bri_mines_tier_3_idea_desc: "Les firmes chinoises détiennent des participations de contrôle dans le secteur extractif partenaire, et le surplus au-delà de nos besoins est revendu avec une prime."
 CHI_bri_pipelines_tier_1_idea: "Artères énergétiques I"
 CHI_bri_pipelines_tier_1_idea_desc: "Des oléoducs et gazoducs d'États partenaires alimentant les raffineries chinoises réduisent notre exposition aux goulets énergétiques maritimes."
 CHI_bri_pipelines_tier_2_idea: "Artères énergétiques II"
 CHI_bri_pipelines_tier_2_idea_desc: "Une capacité de pipeline élargie et des parcs de stockage associés nous permettent à la fois de puiser davantage de carburant et d'en détenir davantage en réserve."
 CHI_bri_pipelines_tier_3_idea: "Artères énergétiques III"
 CHI_bri_pipelines_tier_3_idea_desc: "Des artères énergétiques terrestres contournent désormais entièrement les goulets maritimes, et l'infrastructure de stockage pour les exploiter s'élève à un rythme soutenu."
 CHI_bri_ports_tier_1_idea: "Réseau Maritime I"
 CHI_bri_ports_tier_1_idea_desc: "Des terminaux à conteneurs exploités par la Chine traitent désormais une part significative du commerce des États partenaires le long de la route maritime, renforçant notre standing commercial auprès des nations que nous desservons."
 CHI_bri_ports_tier_2_idea: "Réseau maritime II"
 CHI_bri_ports_tier_2_idea_desc: "Les concessions de terminaux se sont élargies en contrats de développement portuaire complets. Les chantiers et quais que nos entrepreneurs bâtissent à l'étranger affûtent l'expertise qu'ils ramènent à la construction navale chez nous."
 CHI_bri_ports_tier_3_idea: "Réseau maritime III"
 CHI_bri_ports_tier_3_idea_desc: "Une chaîne de ports commerciaux, plusieurs avec des quais à double usage et des installations de ravitaillement, s'étend désormais le long des routes maritimes. Le shipping chinois porte plus loin, et la flotte qui le protège aussi."
 CHI_bri_powerplants_tier_1_idea: "Réseau de production d'électricité I"
 CHI_bri_powerplants_tier_1_idea_desc: "La capacité de production bâtie à l'étranger par des entrepreneurs chinois fait tourner l'industrie partenaire selon nos termes, et nos propres centrales tournent mieux grâce à l'expérience."
 CHI_bri_powerplants_tier_2_idea: "Réseau de production d'électricité II"
 CHI_bri_powerplants_tier_2_idea_desc: "Un portefeuille élargi de centrales à l'étranger soutient une production industrielle intérieure plus élevée."
 CHI_bri_powerplants_tier_3_idea: "Réseau de production d'électricité III"
 CHI_bri_powerplants_tier_3_idea_desc: "L'ingénierie chinoise est devenue le fournisseur par défaut de production d'électricité à travers le réseau partenaire, avec une production industrielle chez nous à l'avenant."
 CHI_bri_prestige_tier_1_idea: "Diplomatie de prestige I"
 CHI_bri_prestige_tier_1_idea_desc: "Un investissement visible dans les pays partenaires nous achète une réputation de bâtisseur plutôt que de créancier."
 CHI_bri_prestige_tier_2_idea: "Diplomatie de prestige II"
 CHI_bri_prestige_tier_2_idea_desc: "Les Nouvelles routes de la soie sont présentées comme un bien public. Entretenir des relations amicales nous coûte moins qu'autrefois."
 CHI_bri_prestige_tier_3_idea: "Diplomatie de prestige III"
 CHI_bri_prestige_tier_3_idea_desc: "Pékin est désormais le partenaire de premier recours dans une grande partie du monde en développement, et le standing que cela apporte se traduit directement en capital politique chez nous."
 CHI_bri_railways_tier_1_idea: "Corridors terrestres I"
 CHI_bri_railways_tier_1_idea_desc: "Des liaisons ferroviaires transfrontalières lient les économies partenaires à l'industrie chinoise, et le fret qui y circule nous gagne la bienveillance des États qu'elles desservent."
 CHI_bri_railways_tier_2_idea: "Corridors terrestres II"
 CHI_bri_railways_tier_2_idea_desc: "Les corridors fonctionnent désormais comme des artères de fret régulières. Un transport terrestre fiable tient nos forces ravitaillées là où l'accès maritime est incertain."
 CHI_bri_railways_tier_3_idea: "Corridors terrestres III"
 CHI_bri_railways_tier_3_idea_desc: "Un réseau terrestre continu s'enfonce au cœur du continent. Notre génie ferroviaire construit plus vite chez nous grâce à l'expérience gagnée à l'étranger."
 CHI_bri_telecom_tier_1_idea: "Route de la soie numérique I"
 CHI_bri_telecom_tier_1_idea_desc: "Des dorsales de réseau bâties par la Chine dans les États partenaires donnent à nos services une visibilité sur le trafic qui les traverse, nous durcissant contre la pénétration du renseignement étranger."
 CHI_bri_telecom_tier_2_idea: "Route de la soie numérique II"
 CHI_bri_telecom_tier_2_idea_desc: "Le contrôle de la couche d'équipement à travers les réseaux partenaires abaisse le coût de nos propres opérations à l'étranger."
 CHI_bri_telecom_tier_3_idea: "Route de la soie numérique III"
 CHI_bri_telecom_tier_3_idea_desc: "Le corridor numérique est nôtre de bout en bout : matériel, collecte et atterrissages de câbles. Le trafic étranger qui y passe n'est ni privé ni à l'abri de nous."
 CHI_brokered_non_aggression_pact: "Pacte de non-agression négocié par Pékin"
 CHI_brokered_non_aggression_pact_desc: "La Chine se tient garante de notre accord de non-agression avec notre rival régional. Tant que le pacte tient, les deux parties bénéficient de la stabilité et de liens plus chauds avec Pékin."
 CHI_cadre_evaluation_reform_idea: "Réforme globale de l'évaluation des cadres"
 CHI_cadre_evaluation_reform_idea_desc: "Les cadres sont désormais évalués sur la stewardship environnementale, l'harmonie sociale et la délivrance de services publics, aux côtés de la croissance du PIB. Une moindre dépendance à une production intensive en fossiles et des dépenses publiques plus maigres reflètent une classe administrative plus responsable."
 CHI_cai_active_phase: "Accord global sur les investissements UE-Chine"
 CHI_cai_active_phase_desc: "L'accord global sur l'investissement est dans sa phase active. Les marchés européens sont grands ouverts aux exportations et investissements chinois, les coûts des biens de consommation baissent, et notre capacité industrielle s'est significativement élargie."
 CHI_cai_residual: "Héritage durable de l'AGI"
 CHI_cai_residual_desc: "Même après la fin de la phase active de l'accord global sur l'investissement, l'intégration structurelle aux marchés européens persiste. Les liens commerciaux restent plus chauds qu'ils ne l'auraient été autrement."
 CHI_central_political_commission_1: "Commission centrale des affaires politiques et juridiques"
 CHI_central_political_commission_1_desc: "La Commission centrale des affaires politiques et juridiques exerce l'autorité de tutelle sur les tribunaux, le parquet, l'appareil de sécurité publique et les organes de sécurité d'État. Sa mission principale est de maintenir l'ordre intérieur et de s'assurer que le système juridique sert les objectifs du Parti plutôt que d'agir comme un contre-pouvoir indépendant. À mesure que son standing au sein du comité grandit, sa capacité à prévenir les troubles, à traiter la dissidence efficacement et à coordonner les réponses de sécurité inter-agences s'améliore substantiellement."
 CHI_chinese_dream_momentum: "L’élan du rêve chinois"
 CHI_chinese_dream_momentum_desc: "Le récit du Rêve chinois mobilise un sens public de dessein national. Les citoyens sont appelés à servir le renouveau collectif ; les organes du Parti rapportent une envolée des demandes d'engagement et des démonstrations publiques de sentiment patriotique. Pour l'heure, l'histoire est plus convaincante que la destination."
 CHI_chongqing_model_idea: "Modèle de Chongqing"
 CHI_chongqing_model_idea_desc: "Les entreprises d'État ancrent l'investissement et donnent le rythme à l'économie plus large. Les actifs nationalisés fournissent une base fiscale aux dépenses sociales sans dépendre du capital étranger ni des recettes fiscales du privé."
 CHI_commercial_bank_law_idea: "Mise en œuvre de la loi sur les banques commerciales"
 CHI_commercial_bank_law_idea_desc: "Les révisions de 2003 de la loi sur les banques commerciales imposent aux quatre grandes des ratios d'adéquation des fonds propres de type Bâle, des normes de classification des risques et des conseils indépendants. Les coûts de conformité réglementaire montent pendant la transition, mais le processus d'allocation du crédit sort pour la première fois du contrôle politique direct."
 CHI_common_prosperity_framework: "Cadre de la prospérité commune"
 CHI_common_prosperity_framework_desc: "L'intervention réglementaire dans l'éducation privée, le divertissement et la technologie est jumelée à un investissement d'État élargi dans la santé, les infrastructures rurales et l'assurance sociale. Le Parti affirme que la prospérité devient commune ; le mécanisme est que l'État détermine ce que la prospérité signifie et qui la reçoit en premier."
 CHI_cpec_partner: "Corridor économique Chine-Pakistan"
 CHI_cpec_partner_desc: "Le paquet d'investissement du CPEC remodèle les infrastructures pakistanaises, avec des autoroutes, des projets énergétiques et des zones industrielles financés par la Chine qui accélèrent l'activité économique."
 CHI_crrc_idea1_desc: "China Railway Rolling Stock Corporation, premier fournisseur mondial de matériel ferroviaire, porte la construction nationale de voies et de terminaux et l'export de matériel roulant chinois à l'étranger."
 CHI_defiance_of_china: "Défi lancé à la Chine"
 CHI_defiance_of_china_desc: "L'État a rejeté les exigences chinoises, résisté à la pression économique et maintenu sa position sur les accidents contestés. L'acte de défi porte un prestige intérieur significatif et peut encourager d'autres acteurs régionaux à durcir leurs propres postures."
 CHI_diaoyu_patrol_regime: "Régime de patrouille Diaoyu"
 CHI_diaoyu_patrol_regime_desc: "Des rotations continues des garde-côtes près des eaux contestées entraînent les équipages navals dans des conditions réalistes."
 CHI_digital_governance_spirit: "Gouvernance numérique"
 CHI_digital_governance_spirit_desc: "Des systèmes de données intégrés lient réseaux de surveillance urbaine, suivi des transactions financières et scores de crédit social en une infrastructure unifiée de conformité. Les gouvernements locaux traitent les demandes administratives numériquement et font appliquer les normes par signalement automatisé. L'interface bureaucratique entre citoyen et État est rationalisée, et l'État est présent à chaque point de contact."
 CHI_distant_water_fishing_fleets: "Flotte de pêche en eaux lointaines"
 CHI_distant_water_fishing_fleets_desc: "Subventionnée par Pékin et adossée à des entreprises d'État, notre flotte de pêche lointaine est la plus grande du monde, opérant dans les ZEE d'Afrique de l'Ouest, d'Amérique du Sud et du Pacifique Sud. Au-delà de la sécurité alimentaire, les navires projettent une présence maritime persistante dans des eaux loin de notre côte, renforçant le principe selon lequel les intérêts chinois s'étendent partout où voguent des navires chinois."
 CHI_divestiture_transition_idea: "Transition de cession"
 CHI_divestiture_transition_idea_desc: "Forcer l'armée à quitter ses recettes commerciales pour le budget de l'État laisse un trou qu'aucune appropriation ne comble du jour au lendemain. Les unités habituées à se financer par hôtels, fermes et bras commerciaux doivent désormais attendre Pékin, et le capital politique se dépense à lisser la perte. La tension s'apaise une fois le secteur de la défense réorganisé en conglomérats autofinancés."
 CHI_dragon_king_ascendant: "Ascendant du Roi Dragon"
 CHI_dragon_king_ascendant_desc: "Long Wang — le Roi-Dragon — est le souverain traditionnel des quatre mers dans la cosmologie chinoise. Le système tributaire formellement invoqué et la présence militaire consolidée, la mer du Sud ne reconnaît plus qu'un souverain : Pékin."
 CHI_eda_grey_market_idea: "Approvisionnement EDA en canal gris"
 CHI_eda_grey_market_idea_desc: "Les maisons fabless nationales se procurent des flux Synopsys et Cadence via des sociétés-écrans d'Asie du Sud-Est. Les tape-outs fonctionnent, mais l'approvisionnement est peu fiable et les mises à jour d'outillage traînent des mois derrière le marché licencié."
 CHI_eight_points_doctrine: "Huit points sur Taïwan"
 CHI_eight_points_doctrine_desc: "La proposition en huit points de Jiang Zemin fournit un cadre doctrinal formel à la politique transdétroit, combinant ouvertures pour une réunification pacifique et mises en garde explicites contre l'indépendance de jure. La planification militaire des opérations de contingence court en parallèle de la voie diplomatique, donnant à Pékin un instrument coercitif crédible."
 CHI_etim_designation: "Cadre de désignation de l'ETIM"
 CHI_etim_designation_desc: "Le cadre bilatéral de lutte contre le terrorisme cible les réseaux séparatistes du Turkestan oriental."
 CHI_eu_market_access: "Accès global au marché de l'UE"
 CHI_eu_market_access_desc: "La ratification d'un cadre d'investissement global avec Bruxelles ouvre un accès profond aux marchés européens de consommation et de capitaux, relevant les plafonds d'export et adoucissant le climat politique pour les firmes chinoises dans tout le bloc."
 CHI_grey_society_crisis_idea: "Crise de la société grise"
 CHI_grey_society_crisis_idea_desc: "China's post one-child generation now carries an inverted age pyramid. A shrinking labour force must fund a swelling cohort of retirees, draining pension and healthcare budgets while productivity growth stalls. The burden eases only as the working-age population stabilises.\n§W--------------§!\nThis national spirit will be §RRemoved§! when the §Y$CHI_grey_society_crisis$§! mission ends, ten years after it begins. Mitigation decisions such as §Y$CHI_pro_natalist_subsidies$§!, §Y$CHI_raise_retirement_age$§! and §Y$CHI_automation_robotics_push$§! shorten it."
 CHI_guarantor_of_korean_peace: "Garant de la paix coréenne"
 CHI_guarantor_of_korean_peace_desc: "Pékin est reconnue dans toute la région comme le garant indispensable de la stabilité coréenne. Le prestige que cela confère survit à n'importe quelle administration."
 CHI_gwadar_basing_rights: "Droits d'établissement de Gwadar"
 CHI_gwadar_basing_rights_desc: "L'accès aux installations en eaux profondes de Gwadar étend la portée opérationnelle de la marine de l'Armée populaire de libération à travers l'océan Indien et la mer d'Arabie."
 CHI_ideological_rectification: "Rectification idéologique"
 CHI_ideological_rectification_desc: "Les interdits du Document n° 9 sont appliqués par des sessions d'étude obligatoires et des campagnes d'autocritique dans les universités, les organisations médiatiques et les entreprises d'État. Les frontières du discours acceptable se contractent rapidement. La loyauté se démontre par le rejet des concepts libéraux occidentaux, et les murs du périmètre idéologique se durcissent contre l'influence étrangère."
 CHI_informal_sanctions: "Sanctions informelles du THAAD"
 CHI_informal_sanctions_desc: "Nous avons imposé des sanctions économiques informelles à la Corée du Sud en réponse au déploiement du THAAD. Les touristes chinois sont réorientés, les biens coréens se heurtent à des barrières non tarifaires, et les entreprises coréennes opérant sur notre territoire signalent un harcèlement officiel."
 CHI_information_warfare: "Appareil de guerre de l’information"
 CHI_information_warfare_desc: "Les médias d'État et les plateformes numériques projettent les récits chinois à l'échelle mondiale tout en contrant les campagnes d'information hostiles."
 CHI_inner_party_supervision_idea: "Règlement sur la surveillance interne des partis"
 CHI_inner_party_supervision_idea_desc: "Des procédures de supervision formalisées exigent des organes du Parti de niveau supérieur d'inspecter et de rendre compte des comités subordonnés. L'application anticorruption est renforcée et la responsabilité politique est régularisée."
 CHI_international_department_1: "Département international du Parti communiste chinois"
 CHI_international_department_1_desc: "Le Département international mène une diplomatie de Parti à Parti dans le monde entier, cultivant des relations avec partis au pouvoir, mouvements d'opposition et fondations politiques dans chaque région. Il sert aussi de foyer institutionnel principal au rayonnement politique des Nouvelles routes de la soie, coordonnant la livraison des projets, gérant les retours de l'engagement des pays partenaires et traitant la restructuration de dette quand les gouvernements bénéficiaires peinent à rembourser. Étendre son influence de commission approfondit le réseau de partenaires étrangers réceptifs et améliore le rendement global des engagements BRI."
 CHI_international_sanctions: "Sanctions internationales"
 CHI_international_sanctions_desc: "Le soutien de la Chine à l'agression militaire nord-coréenne a déclenché un régime de sanctions internationales étendu. L'accès commercial est restreint, l'investissement étranger tarit et l'isolement diplomatique s'approfondit."
 CHI_Invigorate_Country_Through_STE1: "Revigorer le pays grâce au STE"
 CHI_Invigorate_Country_Through_STE1_desc: "La stratégie de dynamisation du pays par la science, la technologie et l'éducation dirige l'investissement d'État vers les instituts de recherche et le système universitaire. Le dividende de recherche se paie d'un budget d'éducation plus lourd."
 CHI_Invigorate_Country_Through_STE1_tt: "Yearly Tech Boost for §Y$CAT_information_technology$§! or §Y$CAT_internet$§!"
 CHI_iron_brothers_joint_training: "Entraînement conjoint des Iron Brothers"
 CHI_iron_brothers_joint_training_desc: "Des exercices conjoints soutenus avec l'armée partenaire ont amélioré la cohésion des unités, l'alignement doctrinal et la maîtrise interarmes."
 CHI_jap_finlandized_sovereignty: "Souveraineté finlandisée"
 CHI_jap_finlandized_sovereignty_desc: "Tokyo conserve son parlement, sa presse, sa langue. Il garde aussi le silence sur ce que Pékin fait au-delà de ses frontières."
 CHI_jap_forced_neutrality: "Neutralité forcée"
 CHI_jap_forced_neutrality_desc: "Le retrait du Japon du parapluie de sécurité américain s'est fait sous la menace. Le traité est signé. L'humiliation est générationnelle."
 CHI_jap_historical_pressure: "Offensive historique chinoise"
 CHI_jap_historical_pressure_desc: "Pékin a rouvert la question de l'histoire de guerre, soulevant les visites au sanctuaire de Yasukuni, les controverses de manuels et l'héritage de Nankin dans chaque forum diplomatique. La campagne enflamme l'opinion intérieure au Japon et érode la capacité de Tokyo à contrer les opérations d'influence chinoises."
 CHI_japan_soft_power: "Engagement culturel sino-japonais"
 CHI_japan_soft_power_desc: "Échanges touristiques, prêts de pandas et photos ministérielles transforment la bienveillance en capital politique. Suspendu automatiquement si l'agression monte trop haut."
 CHI_japanese_cultural_imports: "Importations culturelles japonaises sous licence"
 CHI_japanese_cultural_imports_desc: "Bilibili diffuse le Studio Ghibli. Tencent licence Demon Slayer. L'aile jeunesse du Parti étudie les rapports de Wang Huning sur l'absorption culturelle."
 CHI_joint_command_consultations: "Consultations de commandement conjoint"
 CHI_joint_command_consultations_desc: "Des consultations stratégiques régulières entre commandements militaires chinois et nord-coréens améliorent la coordination et réduisent le risque de méprise."
 CHI_joint_venture_era_idea: "Ère industrielle des coentreprises"
 CHI_joint_venture_era_idea_desc: "Les coentreprises étrangères-nationales deviennent le véhicule principal d'acquisition technologique, de transfert de savoir managérial et d'accès aux réseaux de distribution mondiaux."
 CHI_kaesong_co_developer: "Co-développeur Kaesong"
 CHI_kaesong_co_developer_desc: "Des firmes de construction et des opérateurs logistiques chinois gèrent des coentreprises dans la zone élargie de Kaesong. Des chaînes d'approvisionnement partagées réduisent les coûts et lient les réputations."
 CHI_kor_beijing_pressure: "Campagne de pression de Pékin"
 CHI_kor_beijing_pressure_desc: "Une pression économique et diplomatique chinoise soutenue érode la confiance du public sud-coréen et resserre la marge de manœuvre indépendante de Séoul. Le gouvernement affronte une insatisfaction intérieure croissante et une marge rétrécie face à Pékin."
 CHI_kor_beijing_security_guarantee: "Garantie de sécurité de Pékin"
 CHI_kor_beijing_security_guarantee_desc: "Sous une garantie de sécurité chinoise formelle, la Corée du Sud est libérée de sa dépendance au parapluie nucléaire américain. La planification de défense est réorientée autour de la coopération avec Pékin, réduisant les fardeaux de conscription et stabilisant le climat politique."
 CHI_kor_exit_trilateral: "Sortie du cadre trilatéral"
 CHI_kor_exit_trilateral_desc: "La Corée du Sud s'est retirée du cadre de défense trilatéral États-Unis–Japon–Philippines. La décision reflète le jugement de Séoul selon lequel l'orientation antichinoise du cadre est incompatible avec ses intérêts économiques et ses objectifs d'autonomie stratégique."
 CHI_kor_strategic_autonomy_doctrine: "Doctrine d'autonomie stratégique"
 CHI_kor_strategic_autonomy_doctrine_desc: "La Corée du Sud a adopté une doctrine d'autonomie stratégique qui distancie Séoul de l'architecture indo-pacifique de Washington. La posture de défense de la Corée est réorientée vers l'autosuffisance et le multilatéralisme régional plutôt que la gestion d'alliance américaine."
 CHI_korean_tributary: "La relation tributaire de la Corée du Nord"
 CHI_korean_tributary_desc: "La subordination politique de la Corée du Nord à Pékin a recréé, sous une forme institutionnelle moderne, la relation tributaire qui gouvernait les relations sino-coréennes avant 1895. L'accès chinois aux ports, marchés et espaces stratégiques coréens est formellement garanti."
 CHI_kpa_intelligence_penetration: "Pénétration du renseignement KPA"
 CHI_kpa_intelligence_penetration_desc: "Les services de renseignement chinois ont cultivé un réseau d'actifs au sein de l'Armée populaire de Corée. Une conscience en temps réel de la planification militaire nord-coréenne et de la politique intérieure donne à Pékin un levier sans précédent sur Pyongyang."
 CHI_lithium_supply_chain_locked: "Chaîne d'approvisionnement du triangle du lithium"
 CHI_lithium_supply_chain_locked_desc: "Des accords d'enlèvement à long terme avec des producteurs argentins, boliviens et chiliens sécurisent aux fabricants chinois de batteries le lithium dont ils ont besoin, lissant les courbes d'efficacité et ajoutant de la marge à l'industrie civile."
 CHI_long_range_firepower_idea: "Puissance de feu à longue portée"
 CHI_long_range_firepower_idea_desc: "[CHI_long_range_firepower_idea_tt]"
 CHI_lotte_market_correction: "Correction du marché Lotte"
 CHI_lotte_market_correction_desc: "Les opérations chinoises du Lotte Group ont été forcées à une contraction gérée, libérant des parts de marché pour les concurrents nationaux. L'ajustement réduit les sorties de biens de consommation et démontre l'utilité politique d'une riposte économique ciblée."
 CHI_lunar_legacy_industrial: "Le Palais céleste rendu réel"
 CHI_lunar_legacy_industrial_desc: "Tiangong signifie Palais céleste, et pour la première fois de l'histoire l'un d'eux se tient en permanence en orbite, entièrement bâti de mains chinoises. Les usines, fonderies et halls d'assemblage qui l'ont élevé tournent désormais leur discipline éprouvée vers la terre. Ce qui peut hisser une station en orbite peut construire n'importe quoi en dessous."
 CHI_lunar_legacy_military: "Franchir le pont des pies"
 CHI_lunar_legacy_military_desc: "Queqiao, le pont des pies, a relayé nos signaux depuis la face cachée de la Lune, nommé d'après le pont d'oiseaux qui permit jadis à deux amants de se rejoindre à travers les cieux. Les équipages formés pour la mission la plus dure jamais tentée en sont revenus durcis et certains. Une force qui peut atteindre la Lune ne répond à aucun défi sur Terre avec le doute."
 CHI_lunar_legacy_political: "Chang'e s'élève aux cieux"
 CHI_lunar_legacy_political_desc: "Dans le mythe ancien, Chang'e but l'élixir et s'envola vers la Lune, laissant son époux Hou Yi lever les yeux pour toujours. Désormais son nom a porté une nation réelle à la surface lunaire, et le peuple y voit la preuve que la Chine appartient au premier rang des puissances. L'alunissage devient une source de standing qu'aucun rival ne peut ôter."
 CHI_lunar_legacy_research: "Les questions de Tianwen"
 CHI_lunar_legacy_research_desc: "Tianwen, les Questions célestes, tire son nom du poème ancien de Qu Yuan qui interrogeait l'ordre du cosmos. Les rovers Yutu et les échantillons lunaires ont répondu à des questions qu'aucune nation n'avait tranchées auparavant, et les laboratoires qui les ont décodés en veulent davantage. Un établissement scientifique éprouvé contre la Lune tend désormais vers chaque frontière."
 CHI_mass_line_bo_campaign: "Campagne de ligne de masse"
 CHI_mass_line_bo_campaign_desc: "Des cadres sont déployés à travers les campagnes et les ateliers pour recueillir les retours et démontrer l'engagement du Parti envers le peuple. La campagne élève la conscience politique et canalise l'énergie populaire derrière les objectifs du Parti."
 CHI_mazu_blessing: "La bénédiction de Mazu"
 CHI_mazu_blessing_desc: "Mazu, déesse de la mer et protectrice des marins, est vénérée sur tout le littoral de mer de Chine méridionale. Sa bénédiction templière a été formellement invoquée pour la flotte de mer du Sud. La cérémonie est observée dans toute la flotte et renforce l'esprit de corps."
 CHI_media_offensive: "Offensive médiatique mondiale"
 CHI_media_offensive_desc: "CGTN, Xinhua et les plateformes de réseaux sociaux coordonnent une campagne mondiale projetant les perspectives chinoises."
 CHI_militia_deployed: "Milice maritime active"
 CHI_militia_deployed_desc: "Des navires de la milice maritime chinoise sont déployés en avant dans la zone contestée, maintenant une présence persistante sous couvert civil. Leur présence empêche les garde-côtes rivaux d'approcher sans déclencher une crise."
 CHI_monroe_inverted: "Doctrine Monroe inversée"
 CHI_monroe_inverted_desc: "Nous avons déplacé Washington comme principal partenaire extérieur de l'Amérique latine, ancrant un réalignement hémisphérique qui abaisse le coût des relations et tire l'opinion régionale vers nous."
 CHI_national_humiliation: "Humiliation nationale"
 CHI_national_humiliation_desc: "Un revers diplomatique ou militaire chinois en mer de Chine méridionale a été cadré intérieurement comme une continuation du siècle d'humiliation. L'opinion publique est enflammée ; la direction affronte une pression intense pour rétablir la face par d'autres moyens."
 CHI_national_security_commission_1: "Commission de sécurité nationale du Parti communiste chinois"
 CHI_national_security_commission_1_desc: "Établie en 2013-2014 sous Xi Jinping, la Commission de sécurité nationale siège au sommet de l'architecture de sécurité chinoise, coordonnant renseignement, militaire, cyber et contre-espionnage sous une direction directe du Parti plutôt que par le Conseil des affaires d'État. Sa création a signalé une centralisation délibérée de toutes les décisions de sécurité stratégique. À mesure que l'influence de la commission au sein du comité s'approfondit, son autorité de coordination devient plus complète et sa capacité à répondre aux menaces de sécurité internes et externes plus unifiée et décisive."
 CHI_nepal_himalayan_friendship: "Initiative d'amitié himalayenne"
 CHI_nepal_himalayan_friendship_desc: "L'investissement et la bienveillance chinois affluent au Népal sous un cadre de coopération qui respecte la neutralité de Katmandou tout en attirant le pays plus près de l'orbite économique de Pékin."
 CHI_neutral_interlocutor: "Interlocuteur neutre"
 CHI_neutral_interlocutor_desc: "Nous nous sommes positionnés comme la seule puissance à laquelle les deux Corées peuvent parler. Le rôle porte de l'influence, et des attentes."
 CHI_nko_blue_sky_mobilization: "Mobilisation du ciel bleu"
 CHI_nko_blue_sky_mobilization_desc: "L'APK est entrée en mobilisation de combat complète en coordination avec les objectifs stratégiques chinois. Tous les permissions sont annulées et les unités avancées se portent vers leurs positions d'assaut."
 CHI_nko_chinese_economic_sphere: "Sphère économique chinoise"
 CHI_nko_chinese_economic_sphere_desc: "L'économie nord-coréenne a été formellement incorporée à la sphère industrielle chinoise. Des entreprises d'État chinoises gèrent des secteurs clés, les arrangements de parité monétaire sont normalisés, et le won nord-coréen est lié au renminbi."
 CHI_nko_energy_aid: "Aide énergétique chinoise"
 CHI_nko_energy_aid_desc: "Des transferts de fioul et d'électricité depuis Dandong font tourner les usines et gardent les lumières allumées. Les subventions de Pékin s'accompagnent d'attentes discrètes."
 CHI_nko_food_package: "Forfait alimentaire chinois"
 CHI_nko_food_package_desc: "Des livraisons de grains acheminées par les passages du Tumen allègent les pénuries chroniques. L'aide achète une marge de respiration politique au sein du Parti."
 CHI_nko_infrastructure_investment: "Investissement chinois dans les infrastructures"
 CHI_nko_infrastructure_investment_desc: "Des brigades de construction chinoises reconstruisent les infrastructures nord-coréennes à grande échelle. Routes, chemins de fer, ports et réseaux électriques sont modernisés sous des contrats qui lient les ressources nord-coréennes aux chaînes industrielles chinoises pour une génération."
 CHI_nko_offensive_readiness: "Préparation offensive de la KPA"
 CHI_nko_offensive_readiness_desc: "Avec l'appui logistique chinois, l'Armée populaire de Corée est passée d'une posture défensive à une posture optimisée pour des opérations offensives rapides vers le sud à travers le 38e parallèle."
 CHI_nko_security_assurance: "Assurance de sécurité chinoise"
 CHI_nko_security_assurance_desc: "Pékin a offert un filet discret mais ferme contre l'effondrement du régime. La garantie raffermit le cercle intérieur et amortit la pression de mobilisation."
 CHI_npm_red_banner_insurgency: "Insurrection soutenue par la Chine"
 CHI_npm_red_banner_insurgency_desc: "Le pipeline clandestin de Pékin tient les colonnes maoïstes en fusils, munitions et formation de cadres. L'Armée populaire de libération considère le Népal comme un terrain d'épreuve pour l'export révolutionnaire, et attend un retour sur son investissement."
 CHI_nrcms_rollout_idea: "Nouveau programme médical coopératif rural"
 CHI_nrcms_rollout_idea_desc: "Des cotisations pooled de résidents ruraux, de gouvernements locaux et du budget central couvrent désormais les coûts médicaux catastrophiques de centaines de millions de paysans, améliorant la santé publique et réduisant le choc financier de la maladie sur les foyers ruraux."
 CHI_organisation_department_1: "Département de l'organisation du Parti communiste chinois"
 CHI_organisation_department_1_desc: "Le Département de l'organisation contrôle toutes les décisions de personnel du Parti : nominations, promotions, filtrage et discipline à tous les niveaux de la hiérarchie du PCC. Sa portée s'étend aux entreprises d'État et aux ministères, en faisant l'instrument le plus puissant de cohésion interne du Parti. À mesure que l'influence de la commission au Comité permanent s'approfondit, son emprise sur la sélection des cadres se resserre et sa capacité à faire appliquer les directives centrales à travers l'appareil croît en conséquence."
 CHI_pacific_basing_rights: "Base de la deuxième chaîne d'îles"
 CHI_pacific_basing_rights_desc: "Des droits de basing et de ravitaillement négociés au cœur de la deuxième chaîne d'îles donnent à la marine de l'APL une portée stratégique, des queues logistiques plus courtes et des rotations de chantiers plus rapides pour les déploiements océaniques."
 CHI_pacific_diplomatic_setback: "Revers diplomatique dans le Pacifique"
 CHI_pacific_diplomatic_setback_desc: "Un échec très visible dans les îles du Pacifique a durci les capitales régionales contre nos ouvertures, relevant le coût politique de chaque initiative diplomatique suivante."
 CHI_pacific_security_lead: "Leadership de sécurité dans le Pacifique"
 CHI_pacific_security_lead_desc: "Des accords d'accès avancé et des déploiements rotationnels à travers les îles du Pacifique étendent la portée opérationnelle de la marine de l'APL et accélèrent l'infrastructure de basing qui la soutient."
 CHI_paf_maritime_militia: "Milice maritime de la PAF"
 CHI_paf_maritime_militia_desc: "Des flottes de pêche civiles organisées sous commandement militaire. Une plausibilité du déni en mer, de vrais effectifs au besoin."
 CHI_party_century_endures: "Le Parti qui perdure"
 CHI_party_century_endures_desc: "La pensée de Xi Jinping est ancrée dans la structure constitutionnelle et organisationnelle du Parti comme cadre opératoire permanent. Le système des congrès, le Politburo et la Commission militaire centrale sont réaffirmés comme les moteurs durables de la gouvernance. Le Parti qui a survécu à la mort de Mao, à la Révolution culturelle et à Tiananmen est conçu pour survivre à tout individu, y compris son actuel dirigeant suprême."
 CHI_patriotic_education_mandate: "Mandat d'éducation patriotique"
 CHI_patriotic_education_mandate_desc: "Des programmes révisés garantissent qu'aucun élève chinois n'oublie ce qui fut fait à Nankin, à Pingdingshan, dans les cellules préfabriquées de l'Unité 731. La stabilité se renforce. Tout comme la suspicion des idées étrangères."
 CHI_pearls_economic_partner: "Partenariat stratégique chinois"
 CHI_pearls_economic_partner_desc: "Héberger la logistique navale chinoise a débloqué la générosité économique de Pékin, fonds de modernisation portuaire et crédits d'infrastructure affluent vers l'État hôte."
 CHI_personal_rule_mandate: "Mandat de règle personnelle"
 CHI_personal_rule_mandate_desc: "Le Congrès national du peuple de 2018 a retiré les limites de mandat présidentiel de la Constitution, consolidant l'autorité autour du dirigeant suprême de façon permanente. Direction stratégique et loyauté politique passent désormais par un seul centre, relevant le soutien de guerre mais resserrant l'espace d'initiative des commandants de terrain."
 CHI_petrodollar_breaks: "La parité du pétrodollar atteinte"
 CHI_petrodollar_breaks_desc: "Le pétrole du Golfe tarifé en yuan, des lignes de swap de banques centrales à travers le Sud global et des alternatives à SWIFT ont érodé la prime de réserve du dollar, traduisant le levier monétaire en pouvoir politique et en confiance démographique."
 CHI_pla_basing_economic_help: "Partenariat économique chinois"
 CHI_pla_basing_economic_help_desc: "En échange d'héberger la logistique de la marine de l'APL, nous recevons un soutien économique chinois soutenu : marchés d'export élargis, modernisations d'usines civiles et appui politique dans les forums régionaux."
 CHI_policy_bank_lending_idea: "Campagne de prêts des banques politiques"
 CHI_policy_bank_lending_idea_desc: "La Banque de développement de Chine, l'EximBank et l'ADBC émettent des lignes de crédit concessionnelles aux entreprises d'État et aux gouvernements provinciaux, accélérant l'investissement en actifs fixes dans les transports, l'énergie et les infrastructures d'outre-mer. La vague de prêts porte la production de construction mais immobilise l'épargne des ménages dans des dépôts à faible rendement."
 CHI_princeling_economic_leverage: "Levier économique des princes rouges"
 CHI_princeling_economic_leverage_desc: "Un réseau de liens d'affaires transfrontaliers lie désormais les élites nord-coréennes au capital chinois. Chaque transaction approfondit la dépendance."
 CHI_property_sector_contraction_idea: "Contraction du secteur immobilier"
 CHI_property_sector_contraction_idea_desc: "Les trois lignes rouges forcent les plus grands promoteurs à un désendettement simultané. Les mises en chantier s'effondrent, les recettes de vente de terrains au niveau local s'évaporent, et les réseaux de fournisseurs ciment, acier et électroménager souffrent à leur tour. L'économie plus large absorbe le choc tandis que la bulle immobilière est dégonflée de force."
 CHI_property_tax_pilot_idea: "Projet pilote d’impôt foncier"
 CHI_property_tax_pilot_idea_desc: "Shanghai et Chongqing lèvent des taxes modestes sur les résidences secondaires et les biens de haute valeur, freinant l'investissement spéculatif et diversifiant les recettes locales hors des ventes de terrains."
 CHI_publicity_department_1: "Département de la propagande du Parti communiste chinois"
 CHI_publicity_department_1_desc: "Le Département de la propagande fixe la ligne idéologique de tous les médias imprimés, audiovisuels et numériques en Chine, dirigeant la censure, le cadrage narratif et la projection intérieure de la légitimité du Parti. Il coordonne aussi l'infrastructure de messaging d'outre-mer, y compris l'expansion des médias d'État et les partenariats de contenu à l'étranger. Une plus grande influence de commission se traduit par un environnement informationnel plus cohérent et plus ferme, renforçant la stabilité sociale et le soutien populaire aux priorités du Parti."
 CHI_qccm_coordination_cell: "Cellule de coordination QCCM"
 CHI_qccm_coordination_cell_desc: "Un partage de renseignement quadrilatéral à travers le corridor du Pamir lie les services de sécurité de la Chine, du Pakistan, de l'Afghanistan et du Tadjikistan."
 CHI_raj_foreign_defense_pressure: "Pression chinoise"
 CHI_raj_foreign_defense_pressure_desc: "Le pivot de Pékin vers l'Asie du Sud a placé une pression diplomatique et informationnelle soutenue sur New Delhi, resserrant les options stratégiques de l'Inde le long de ses frontières nord et est."
 CHI_rason_investment_flow: "Programme d'investissement de Rason"
 CHI_rason_investment_flow_desc: "Le capital chinois afflue dans la zone économique spéciale de Rason, finançant infrastructures, capacité industrielle et installations portuaires. L'expérience produit des résultats visibles."
 CHI_rason_port_access: "Accès au port de Rason"
 CHI_rason_port_access_desc: "Nos navires ont désormais un accès fiable au port en eaux profondes de Rason, donnant à la marine de l'Armée populaire de libération un pied stratégique en mer du Japon."
 CHI_rcep_member: "Membre fondateur du RCEP"
 CHI_rcep_member_desc: "Nous avons co-ancré le Partenariat économique régional global aux côtés de Tokyo et de Séoul. Les tarifs baissent, les chaînes d'approvisionnement s'épaississent, et l'absence américaine devient la norme régionale."
 CHI_reconstruction_plan_idea: "Plan de capacité de reconstruction"
 CHI_reconstruction_plan_idea_desc: "Des équipements prépositionnés, des protocoles standardisés et des unités spécialisées du génie de l'armée nous donnent un avantage de vitesse exceptionnel pour réparer infrastructures et industrie après les catastrophes."
 CHI_regional_crisis_alert: "Alerte de crise régionale"
 CHI_regional_crisis_alert_desc: "La posture de sécurité chinoise sur la péninsule coréenne a déclenché une alerte élevée dans toute la région. La cohésion d'alliance est sous tension."
 CHI_reunion_humanitarian_lead: "Responsable de la diplomatie humanitaire"
 CHI_reunion_humanitarian_lead_desc: "Notre coordination des retrouvailles familiales transfrontalières a généré une bienveillance inhabituellement large. Les ministères des Affaires étrangères saluent le contact, et les médias intérieurs l'amplifient."
 CHI_rmb_promotion: "Internationalisation du RMB"
 CHI_rmb_promotion_desc: "Le renminbi est de plus en plus accepté comme monnaie de réserve internationale par des accords de swap bilatéraux."
 CHI_russian_arms_dependency: "Dépendance russe aux armements"
 CHI_russian_arms_dependency_desc: "The People's Liberation Army was built on Soviet and Russian designs. Its small arms began as the Type 56, a licensed Kalashnikov, and its armoured corps grew from the Type 59, a direct copy of the Soviet T-54A, with later tanks and infantry fighting vehicles still echoing T-72 and BMP lineage. The artillery, the transports and the air-defence batteries share the same ancestry. The dependence runs deepest in propulsion: the AL-31F powers the J-10 and J-11, the RD-93 flies the JF-17, and Su-35 fighters and S-400 batteries were bought outright from Moscow. Every domestic fighter line waits on a Russian turbine, every licensed pattern pays a royalty, and the design bureaus still copy more than they create. Until China forges its own military-industrial base, the army's heartbeat is set in Russia.\n§W--------------§!\nOur military self-sufficiency rises through defence industry focuses such as §Y$CHI_norinco_rationalism$§!, §Y$CHI_own_designs$§! and §Y$CHI_ws15_bottleneck_solve$§!, and through the §Y$CHI_invest_domestic_arms_lines$§! and §Y$CHI_localise_licensed_system$§! decisions. This national spirit will §GImprove§! once self-sufficiency passes §Y25§!."
 CHI_sanctions_immunity_partial: "Bouée commerciale réglée en yuans"
 CHI_sanctions_immunity_partial_desc: "Des contrats d'énergie et de biens libellés en renminbi avec des partenaires sanctionnés émoussent l'impact de la pression financière occidentale, allégeant la pression sur les consommateurs et maintenant ouverts les canaux d'export."
 CHI_sars_outbreak_uncontrolled_idea: "Épidémie de SRAS"
 CHI_sars_outbreak_uncontrolled_idea_desc: "L'échec à coordonner une réponse d'urgence rapide a laissé le SRAS se propager dans plusieurs provinces avant que les quarantaines ne prennent. Notre notification internationale tardive a nui à notre standing à l'étranger et imposé une disruption économique significative chez nous."
 CHI_sars_response_effective_idea: "SRAS contenu"
 CHI_sars_response_effective_idea_desc: "Notre cadre de réponse d'urgence a permis une quarantaine rapide, une notification internationale prompte et une action médicale coordonnée. L'épidémie est contenue, avec une disruption économique limitée et notre standing international intact."
 CHI_scientific_outlook_idea_1: "Préparation du concept de développement scientifique"
 CHI_scientific_outlook_idea_1_desc: "Nous réorientons la politique nationale loin d'une croissance PIB d'abord vers des indicateurs sociaux et environnementaux plus larges, sous la Conception scientifique du développement."
 CHI_scientific_outlook_idea_1_tt: "§Y$CHI_scientific_outlook_on_development$§! Temps de réalisation du focus §G-35§! §Yjours§!"
 CHI_sco_dialogue_partner: "Partenaire de dialogue de l'OCS"
 CHI_sco_dialogue_partner_desc: "Ce pays a été accepté comme partenaire de dialogue de l'Organisation de coopération de Shanghai, ouvrant la porte à un engagement politique et économique plus profond avec les États membres."
 CHI_sco_member: "Membre de l'OCS"
 CHI_sco_member_desc: "Ce pays est membre de plein droit de l'Organisation de coopération de Shanghai, participant à tous les cadres de coopération politique, économique et de sécurité établis par l'organisation."
 CHI_sco_member_econ_desc: "Ce pays est membre de plein droit de l'Organisation de coopération de Shanghai avec un accent de coopération économique, gagnant des liens commerciaux et d'investissement renforcés avec les autres États membres."
 CHI_sco_member_mil_desc: "Ce pays est membre de plein droit de l'Organisation de coopération de Shanghai avec un accent de coopération militaire, participant aux exercices conjoints et aux opérations de sécurité."
 CHI_sco_member_pol_desc: "Ce pays est membre de plein droit de l'Organisation de coopération de Shanghai avec un accent de coopération politique, gagnant des cadres de gouvernance et d'anti-subversion plus forts."
 CHI_sco_observer: "Observateur de l'OCS"
 CHI_sco_observer_desc: "Ce pays détient le statut d'observateur au sein de l'Organisation de coopération de Shanghai, donnant accès aux forums de l'OCS et à une coopération économique limitée tout en maintenant sa souveraineté sur les décisions d'alignement."
 CHI_scs_chinese_debt: "Dépendance à la dette chinoise"
 CHI_scs_chinese_debt_desc: "Les obligations de prêts des Nouvelles routes de la soie ont donné à Pékin un levier significatif sur le calcul de politique étrangère du partenaire endetté. Les exigences de service de la dette contraignent la liberté du gouvernement à prendre des positions hostiles aux intérêts chinois."
 CHI_scs_claimant_under_pressure: "Sous la pression chinoise"
 CHI_scs_claimant_under_pressure_desc: "La domination chinoise de la mer de Chine méridionale a rendu chaque décision liée aux Spratleys plus coûteuse pour ce gouvernement. L'opinion intérieure est divisée entre accommodation et résistance ; la pénalité de pouvoir politique sur les décisions de mer de Chine méridionale reflète la difficulté de tracer quelque cours que ce soit tandis que Pékin fixe les termes."
 CHI_scs_de_facto_sovereignty: "Souveraineté de fait"
 CHI_scs_de_facto_sovereignty_desc: "Par une diplomatie bilatérale patiente et des accords accumulés, les revendications chinoises en mer de Chine méridionale sont devenues le défaut régional. Nul revendicateur ne conteste désormais formellement l'arrangement ; les puissances extérieures manquent des instruments juridiques pour contester ce que les États voisins ont accepté."
 CHI_scs_jdz_revenue: "Recettes du développement conjoint"
 CHI_scs_jdz_revenue_desc: "L'extraction d'hydrocarbures des zones de développement conjoint génère des recettes partagées pour nous et notre État partenaire. Les revenus pétroliers affluent vers l'État des Spratleys concerné des deux côtés de l'arrangement pour la durée de l'accord, donnant aux deux gouvernements un enjeu concret dans la continuation du cadre bilatéral et compliquant tout pivot vers la confrontation."
 CHI_scs_setback: "Recul en mer de Chine méridionale"
 CHI_scs_setback_desc: "Un affrontement s'est terminé défavorablement, une initiative diplomatique a été publiquement rejetée, ou une décision internationale a tranché contre les revendications chinoises. Le revers réduit la variable de cadre MCS et peut inviter des réponses opportunistes d'autres revendicateurs."
 CHI_sea_eagles_carrier_wing_idea: "$CHI_sea_eagles_carrier_wing$"
 CHI_sea_eagles_carrier_wing_idea_desc: "[CHI_sea_eagles_carrier_wing_idea_tt]"
 CHI_selective_anti_corruption_campaign_idea: "Campagne anticorruption sélective"
 CHI_selective_anti_corruption_campaign_idea_desc: "Des poursuites ciblées répriment la corruption la plus flagrante et écartent des courtiers de pouvoir rivaux, mais le caractère sélectif et politique de l'application crée une incertitude institutionnelle et étouffe l'initiative."
 CHI_self_reliant_path_idea: "Les douleurs de croissance du Taihang"
 CHI_self_reliant_path_idea_desc: "L'autosuffisance se paie en turbines calcinées et en escadrons cloués au sol. Le WS-10 Taihang des débuts s'étouffe de sa propre ambition, ses aubes se fendent et sa durée de vie se mesure en heures, et les équipages paient chaque leçon que les ingénieurs n'ont pas encore apprise. Les bureaux y arriveront, mais d'ici là la flotte vole sur la foi."
 CHI_sez_japanese_investors: "ZES pour investisseurs japonais"
 CHI_sez_japanese_investors_desc: "Des concessions spéciales pour Toyota, Sony, Panasonic. La stratégie China-Plus-One est inversée en rendant la Chine impossible à quitter."
 CHI_sino_japanese_understanding: "Entente stratégique sino-japonaise"
 CHI_sino_japanese_understanding_desc: "L'architecture tacite de la détente : flux commerciaux, réunions ministérielles et un accord implicite de laisser l'histoire aux archives. Perdu définitivement si l'agression sino-japonaise remonte."
 CHI_smic_foundry_base: "Base de fonderie SMIC"
 CHI_smic_foundry_base_desc: "Le campus Zhangjiang de SMIC fournit une plateforme de production 28 nm qualifiée pour les clients fabless nationaux. La capacité captive de la fonderie réduit la dépendance de la Chine vis-à-vis de TSMC pour la logique de nœuds matures et fournit une base pour le développement de procédés nationaux ultérieurs."
 CHI_society_department_1: "Département du travail de la société"
 CHI_society_department_1_desc: "Établi en 2023, le Département du travail de société a consolidé la tutelle du PCC sur les organisations sociales de base, les ONG, les syndicats et le système de pétitions auparavant répartis entre plusieurs agences. Son mandat est de s'assurer que la société civile opère dans des paramètres fixés par le Parti et que les griefs populaires sont canalisés vers des débouchés gérés plutôt qu'une mobilisation indépendante. Une influence de commission croissante permet au département d'étendre sa portée organisationnelle et d'affiner les mécanismes par lesquels les pressions sociales sont absorbées et désamorcées."
 CHI_sovereign_wealth_diversification_idea: "Diversification souveraine de la China Investment Corporation"
 CHI_sovereign_wealth_diversification_idea_desc: "China Investment Corporation fait tourner les réserves de change hors des Treasuries américains à bas rendement vers le private equity mondial, les infrastructures et des participations stratégiques. Le portefeuille génère des retours plus élevés que la base de réserves et donne à Pékin des positions structurelles sur les marchés de capitaux étrangers."
 CHI_state_tolerated_boycott: "Boycott toléré par l’État"
 CHI_state_tolerated_boycott_desc: "Des manifestations antijaponaises que la police ne dispersera pas, jusqu'à ce qu'elle le fasse. Les consommateurs patriotiques réorientent leurs dépenses. Certains détaillants chinois saignent aussi."
 CHI_streamline_the_ranks_idea: "Alléger les rangs"
 CHI_streamline_the_ranks_idea_desc: "À partir de la fin des années 1990, l'Armée populaire de libération a réduit ses effectifs de centaines de milliers d'hommes, échangeant une force de mobilisation de masse pléthorique contre une armée plus petite et professionnelle bâtie autour de brigades. La transition tend les filières d'entraînement et immobilise l'industrie.\n\n§YCette pénalité se lève lorsque les deux conditions sont remplies :§!\n§Y-§! L'armée est sous §Y[?CHI_streamline_div_baseline|0]§! divisions.\n§Y-§! Les stocks d'armes d'infanterie, d'artillerie et de châssis de chars moyens détiennent chacun une réserve supérieure à §Y10 %§! des besoins de l'armée."
 CHI_strike_black_sing_red_idea: "Frappez le noir, chantez le rouge"
 CHI_strike_black_sing_red_idea_desc: "Des milliers de cadres et de figures du crime organisé ont été arrêtés, et leurs réseaux démantelés. Des événements de culture rouge de masse inondent la sphère publique de ferveur patriotique, élevant le moral et la loyauté au Parti."
 CHI_succession_roadmap: "Feuille de route de succession"
 CHI_succession_roadmap_desc: "L'identification et la formation d'un successeur désigné signalent aux institutions du Parti que la transition du pouvoir sera gérée plutôt que contestée. Les partenaires internationaux lisent le cadre de succession comme une preuve de stabilité systémique. La prime de risque politique sur les accords de long terme avec la Chine se resserre, du moins pour la durée de l'arrangement."
 CHI_summit_host: "Hôte du sommet"
 CHI_summit_host_desc: "Pékin accueille activement des pourparlers régionaux sensibles. La bande passante diplomatique est élevée, et les outils de pression pèsent davantage."
 CHI_taiwan_strait_pressure_spirit: "Posture de pression à travers le détroit"
 CHI_taiwan_strait_pressure_spirit_desc: "Des incursions aériennes régulières de l'APL dans la zone d'identification de défense aérienne de Taïwan, de vastes exercices navals dans les eaux entourant l'île et une coercition économique calibrée maintiennent une campagne de pression soutenue en deçà de la guerre ouverte. La posture tient Taipei en alerte permanente et signale la résolution à Washington, durcissant nos forces et soutenant le soutien de guerre public pour d'éventuelles contingences."
 CHI_tech_crackdown_moderate: "Répression technologique : restructuration gérée"
 CHI_tech_crackdown_moderate_desc: "La campagne réglementaire a imposé des coûts de conformité et ralenti l'investissement en recherche, mais le secteur des plateformes a assez d'échelle pour absorber la disruption sans effondrement structurel."
 CHI_tech_crackdown_severe: "Répression technologique : sévère"
 CHI_tech_crackdown_severe_desc: "Notre campagne réglementaire contre le secteur des plateformes a saisi l'économie numérique à un stade précoce de développement. La construction du secteur des services est calée, le capital-risque a fui, et l'investissement en recherche s'est fortement contracté."
 CHI_the_duterte_precedent: "Le précédent Duterte"
 CHI_the_duterte_precedent_desc: "L'exemple d'un chef de gouvernement de l'ASEAN choisissant de pivoter loin de Washington et vers Pékin résonne dans toute la région. D'autres dirigeants observent que les États-Unis n'ont pas, ou n'ont pu, l'empêcher, et pèsent leurs propres options en conséquence."
 CHI_three_represents_debate: "Trois représente la controverse"
 CHI_three_represents_debate_desc: "Les traditionalistes idéologiques au sein du Parti résistent à la proposition de Jiang d'admettre des entrepreneurs privés à l'adhésion, arguant qu'elle abandonne le caractère de classe de l'avant-garde. Le débat interne perturbe temporairement la cohérence politique et génère des frictions au niveau provincial."
 CHI_three_represents_debate_tt: "\nCet §Yesprit national§! sera §Rannulé§! si §YJiang Zemin§! n'achève pas §Y$CHI_three_represents_codified$§! et n'est plus §Ydirigeant du pays§!"
 CHI_tibet_crackdown_idea: "Opération de sécurité au Tibet"
 CHI_tibet_crackdown_idea_desc: "Une opération de sécurité coordonnée à travers le Tibet réprime l'activité séparatiste, au prix d'une tension temporaire sur la stabilité."
 CHI_total_war_himalayan_front: "Guerre totale sur le front himalayen"
 CHI_total_war_himalayan_front_desc: "Chaque usine, chaque tête de ligne, chaque réserviste mobilisé pour la question McMahon."
 CHI_two_centenary_resolve: "Deux objectifs du centenaire"
 CHI_two_centenary_resolve_desc: "Les deux échéances du centenaire de 2021 et 2049 imposent un horizon générationnel à la planification économique et sociale. Investissement d'infrastructure, cibles de productivité et programmes de développement technologique sont orientés vers ces jalons. Les objectifs structurent les incitations bureaucratiques et débloquent des cycles de planification pluridécennaux soutenus dans tous les ministères."
 CHI_united_front_department_1: "Département de travail du Front uni"
 CHI_united_front_department_1_desc: "Le Département du front uni gère les relations du PCC avec les constituencies hors Parti : minorités ethniques, communautés religieuses, réseaux chinois d'outre-mer et figures politiques étrangères susceptibles de cooptation. Son mandat est de neutraliser les sources potentielles d'opposition et d'étendre l'influence du Parti au-delà de l'adhésion formelle. À mesure que l'influence de commission grandit, le rayonnement du département devient plus systématique, convertissant des acteurs périphériques en instruments fiables des intérêts stratégiques chinois."
 CHI_usa_asia_pivot_collapse: "Le pivot indo-pacifique s’est effondré"
 CHI_usa_asia_pivot_collapse_desc: "Séoul dérivant dans l'orbite de Pékin et Tokyo stratégiquement isolé, la pierre angulaire du rééquilibrage américain vers l'Asie s'est disloquée. La planification avancée est en désarroi, la confiance des alliés est ébranlée, et le coût politique du retournement pèse sur Washington."
 CHI_usa_back_channel_open: "Canal discret vers Foggy Bottom"
 CHI_usa_back_channel_open_desc: "Une ligne discrète entre Zhongnanhai et le Département d'État tient la communication de crise ouverte sous la voie diplomatique publique. Le canal livre un flux régulier de renseignement sur les intentions américaines, au prix d'une exposition du contre-espionnage chinois."
 CHI_usa_g2_framework: "Cadre G2"
 CHI_usa_g2_framework_desc: "Washington et Pékin ont institutionnalisé un condominium de grandes puissances sur les affaires coréennes, coordonnant la politique par des canaux bilatéraux permanents. L'arrangement raffermit les marchés et abaisse les coûts pour les consommateurs, mais lie la politique coréenne américaine à la bienveillance chinoise continue."
 CHI_wakhan_buffer_idea: "Zone tampon de Wakhan"
 CHI_wakhan_buffer_idea_desc: "Un régime coordonné de contre-radicalisation à travers le corridor du Wakhan a durci la frontière occidentale de la Chine contre l'infiltration extrémiste."
 CHI_wakhan_buffer_partner_idea: "Partenaire de la lutte contre le terrorisme de Wakhan"
 CHI_wakhan_buffer_partner_idea_desc: "Des protocoles conjoints de contrôle frontalier avec Pékin ont amélioré la capacité intérieure de contre-terrorisme, même si les services de renseignement étrangers resserrent leur coopération."
 CHI_war_footing_central_asia: "Mobilisation de guerre en Asie centrale"
 CHI_war_footing_central_asia_desc: "Production nationale tournée vers des opérations soutenues à l'ouest du Pamir."
 CHI_water_shortage: "Pénuries d'eau"
 CHI_water_shortage_desc: "The North China Plain, the Yellow River basin, and the Beijing-Tianjin-Hebei corridor together hold roughly half the country's cultivated land but less than a fifth of its freshwater. Per-capita water availability in the north falls well below the international scarcity threshold of 1,000 cubic metres per year. Industrial discharge and agricultural run-off have contaminated significant shares of available surface and groundwater, compounding the physical scarcity. Agriculture accounts for over 60 percent of total water consumption, and the energy sector's cooling demands add further strain to an already depleted resource base.\n§W--------------§!\nCompleting projects from the §Y$CHI_water_shortage_category$§! decision category, unlocked by the §Y$CHI_water_security_initiative$§! focus, and the South-North Water Transfer routes in the §Y$CHI_megaprojects$§! category raises our water conservation progress. This national spirit will §GImprove§! at §Y4§! completed projects."
 CHI_wenchuan_reconstruction_drive_idea: "Campagne de reconstruction de Wenchuan"
 CHI_wenchuan_reconstruction_drive_idea_desc: "Nous avons déployé plus de 100 000 soldats et équipes d'urgence en quelques jours après le séisme, puis suivi avec un plan de reconstruction de 1 000 milliards de RMB. L'ampleur de l'engagement a généré une envolée soutenue de l'activité de construction à travers le Sichuan et la région environnante."
 CHI_western_hemisphere_protector: "Protecteur des Amériques émergentes"
 CHI_western_hemisphere_protector_desc: "Nous nous sommes positionnés comme le garant de sécurité alternatif pour les nations d'Amérique latine cherchant à échapper à l'orbite de Washington. L'influence circule librement, et les réseaux de renseignement sont isolés de la contre-action occidentale."
 CHI_western_institutional_engagement_idea: "Engagement institutionnel occidental"
 CHI_western_institutional_engagement_idea_desc: "Une participation active à la gouvernance du FMI, de la Banque mondiale et de l'OMC bâtit une crédibilité internationale et élargit l'accès aux marchés financiers mondiaux."
 CHI_wto_implementation_idea: "Mise en œuvre de l'OMC"
 CHI_wto_implementation_idea_desc: "Des baisses tarifaires pluriannuelles, l'ouverture du secteur des services et l'alignement sur les règles commerciales internationales approfondissent notre intégration aux chaînes d'approvisionnement mondiales et améliorent notre standing auprès des partenaires commerciaux."
 CHI_xinjiang_crackdown_idea: "Opération de sécurité au Xinjiang"
 CHI_xinjiang_crackdown_idea_desc: "Une vaste opération de sécurité est en cours au Xinjiang. La résistance est amortie mais le coût retombe sur la stabilité intérieure."
 chinese_african_century: "Siècle sino-africain"
 chinese_african_century_desc: "Des décennies d'investissement FOCAC ont fait de la Chine le partenaire indispensable du continent africain, remodelant démographie, flux commerciaux et alignement politique."
 chinese_surveillance_systems: "Systèmes de surveillance chinois"
 chinese_surveillance_systems_desc: "Des plateformes de villes sûres importées, des caméras de reconnaissance faciale et des outils d'identité numérique durcissent le régime contre la dissidence et les opérations de renseignement étrangères."
 eurasian_land_bridge: "Pont terrestre eurasien"
 eurasian_land_bridge_desc: "Un corridor ferroviaire et de pipelines ininterrompu relie le Pacifique à l'Atlantique, les normes, écartements et procédures douanières chinois donnant le rythme du commerce terrestre."
 JAP_abandoned_by_ally: "Abandonné par Washington"
 JAP_abandoned_by_ally_desc: "Quand l'heure est venue, les Américains ont temporisé. L'alliance tient sur le papier mais la confiance est morte, et chaque faction de la Diète en tire ses propres conclusions."
 JAP_china_engagement: "Engagement avec la Chine"
 JAP_china_engagement_desc: "Tokyo a choisi un engagement politique ouvert avec Pékin, réduisant les frictions stratégiques au prix de sa crédibilité nationaliste."
 JAP_export_pain: "Coup porté aux exportations"
 JAP_export_pain_desc: "Un boycott de consommateurs chinois soutenu a laissé les industries d'export japonaises se débattre pour des marchés alternatifs."
 JAP_jcg_emergency_deployment: "Déploiement d'urgence du JCG"
 JAP_jcg_emergency_deployment_desc: "Les garde-côtes japonais sont en alerte de crise permanente en mer de Chine orientale, taxant l'industrie pour tenir les patrouilleurs en mer."
 JAP_rare_earth_diversification: "Campagne de diversification des terres rares"
 JAP_rare_earth_diversification_desc: "Un programme d'urgence pour sourcer les terres rares depuis l'Australie, le Vietnam et le recyclage national. Douloureux à court terme."
 JAP_revisionist_pride: "Fierté révisionniste"
 JAP_revisionist_pride_desc: "Le défi public à la critique étrangère sur la mémoire de guerre consolide un climat nationaliste à l'intérieur."
 JAP_sino_japanese_understanding: "Compréhension sino-japonaise"
 JAP_sino_japanese_understanding_desc: "Le communiqué de Tokyo a institutionnalisé des consultations régulières et des préférences commerciales avec Pékin."
 JAP_strategic_autonomy_drift: "Glissement vers l'autonomie stratégique"
 JAP_strategic_autonomy_drift_desc: "Le Quad rétrogradé au rang de dialogue, le Japon recalibre discrètement ses alignements loin de Washington."
 NKO_pro_beijing_regime: "Régime pro-Pékin"
 NKO_pro_beijing_regime_desc: "Le nouveau gouvernement de Pyongyang doit sa survie à Pékin. Des conseillers chinois siègent dans chaque ministère ; le pétrole chinois alimente chaque camion."
 pax_sinica: "Pax Sinica"
 pax_sinica_consensus: "Communauté de destin partagé"
 pax_sinica_consensus_desc: "Nous avons atteint la prééminence mondiale par des décennies d'investissement patient, de financement concessionnel et de diplomatie institutionnelle. L'ordre international reconnaît notre centralité par l'intérêt plutôt que par la coercition : un monde lié à nous par le bénéfice mutuel, non par la nécessité stratégique."
 pax_sinica_desc: "Nous nous tenons au sommet d'un ordre mondial que nous avons façonné selon nos propres termes, les Nouvelles routes de la soie comme tissu conjonctif d'un nouveau système international."
 petroyuan_settlement: "Réseau de colonies Petroyuan"
 petroyuan_settlement_desc: "Les contrats énergétiques transfrontaliers se règlent de plus en plus en renminbi, libérant notre industrie des goulets de compensation en dollars et accélérant la construction nationale."
 rmb_reserve_currency: "Le renminbi comme monnaie de réserve"
 rmb_reserve_currency_desc: "Le yuan a rejoint le panier des monnaies de réserve mondiales, ouvrant des marchés d'export et donnant à nos banques la résilience pour souscrire des prêts de relance mondiale."
 SCO_air_defense_initiator: "Défense aérienne conjointe de l'OCS (chef de file)"
 SCO_air_defense_initiator_desc: "En tant que nation chef de file du réseau de défense aérienne conjointe de l'OCS, ce pays coordonne la surveillance aérienne intégrée et la défense antimissile à travers les États membres."
 SCO_air_defense_member: "Défense aérienne conjointe de l'OCS"
 SCO_air_defense_member_desc: "La participation au réseau de défense aérienne conjointe de l'OCS donne accès à une couverture radar partagée et à une coordination antiaérienne."
 SCO_cultural_exchange_bonus: "Échange culturel SCO"
 SCO_cultural_exchange_bonus_desc: "Un programme d'échanges académiques et culturels favorise la collaboration de recherche transfrontalière."
 SCO_dev_bank_initiator: "Banque de développement de l'OCS (fondateur)"
 SCO_dev_bank_initiator_desc: "En tant que fondateur de la Banque de développement de l'OCS, ce pays oriente les flux d'investissement et a un accès privilégié au financement à bas intérêt."
 SCO_dev_bank_member: "Banque de développement de l'OCS"
 SCO_dev_bank_member_desc: "L'adhésion à la Banque de développement de l'OCS donne accès à des prêts de développement et à des programmes d'investissement conjoints."
 SCO_development_assistance: "Aide au développement de l'OCS"
 SCO_development_assistance_2: "Aide [CHI.GetAdjective] au développement"
 SCO_development_assistance_2_desc: "La Chine nous a accordé une aide au développement dont nous avions grand besoin sous les auspices de l'Organisation de coopération de Shanghai."
 SCO_development_assistance_desc: "L'Organisation de coopération de Shanghai canalise des ressources de développement vers ce pays."
 SCO_energy_deal_income: "Partenariat énergétique de l'OCS"
 SCO_energy_deal_income_desc: "Un accord d'approvisionnement énergétique à long terme génère des recettes stables."
 SCO_energy_grid_initiator: "Réseau énergétique de l'OCS (initiateur)"
 SCO_energy_grid_initiator_desc: "En tant qu'initiateur du réseau énergétique de l'OCS, ce pays dirige un réseau électrique intégré couvrant les États membres."
 SCO_energy_grid_member: "Réseau énergétique de l'OCS"
 SCO_energy_grid_member_desc: "La participation au réseau énergétique de l'OCS donne accès à une infrastructure électrique partagée et à des coûts énergétiques réduits."
 SCO_intel_sharing_bonus: "Partage de renseignements SCO"
 SCO_intel_sharing_bonus_desc: "Un canal sécurisé de partage du renseignement améliore la coordination antiterroriste."
 SCO_joint_drill: "Exercices conjoints de l'OCS"
 SCO_joint_drill_1: "Exercices conjoints de l'OCS (bilatéraux)"
 SCO_joint_drill_1_desc: "Des exercices militaires bilatéraux avec un partenaire de l'OCS affûtent la coordination tactique."
 SCO_joint_drill_desc: "La participation aux exercices militaires conjoints à l'échelle de l'OCS améliore la préparation opérationnelle."
 SCO_joint_drill_specific: "Exercices conjoints de l'OCS (ciblés)"
 SCO_joint_drill_specific_desc: "Des exercices conjoints ciblés avec un partenaire de l'OCS comblent des lacunes opérationnelles spécifiques."
 SCO_railway_initiator: "Chemin de fer transeurasien (initiateur)"
 SCO_railway_initiator_desc: "En tant que force motrice du chemin de fer trans-eurasien, ce pays bénéficie d'un accès de premier rang au corridor commercial continental."
 SCO_railway_member: "Chemin de fer transeurasien"
 SCO_railway_member_desc: "Le chemin de fer trans-eurasien relie ce pays à un réseau commercial à haute capacité à travers la zone de l'OCS."
 SCO_trade_agreement_bonus: "Accord commercial de l'OCS"
 SCO_trade_agreement_bonus_desc: "Un cadre commercial bilatéral sous l'égide de l'OCS stimule la production industrielle civile."
 CHI_airforce_modifier: "Force aérienne de l'Armée populaire de libération"
 CHI_airforce_modifier_desc: "La branche aérienne de l'Armée populaire de libération, alignant chasseurs, bombardiers, avions de transport et un réseau de défense aérienne intégré. Ceci représente sa doctrine, son entraînement et son équipement."
 CHI_belt_and_road_initiative_idea: "Initiative des Nouvelles routes de la soie"
 CHI_belt_and_road_initiative_idea_desc: "L'Initiative des Nouvelles routes de la soie de la Chine, lancée en 2013, finance construction portuaire, corridors ferroviaires, oléoducs, centrales et infrastructure numérique à travers l'Asie, l'Afrique, le Moyen-Orient et l'Europe. Les États éligibles postulent pour des projets, Pékin les finance et les construit, et chaque projet achevé élève le rang de ce partenaire et le standing de la Chine elle-même.\n\n[CHIGetBRIPortTier][CHIGetBRIRailwayTier][CHIGetBRIPipelineTier][CHIGetBRITelecomTier][CHIGetBRIMineTier][CHIGetBRIPowerplantTier][CHIGetBRIIndustrialZoneTier][CHIGetBRIPrestigeTier]"
 CHI_bri_state_industrial: "Projet industriel BRI"
 CHI_bri_state_industrial_desc: "Un projet industriel historique soutenu par la Chine étend la capacité d'usines locale et l'extraction de ressources."
 CHI_bri_state_infrastructure: "Projet d'infrastructure BRI"
 CHI_bri_state_infrastructure_desc: "Un projet d'infrastructure historique des Nouvelles routes de la soie accélère la construction régionale, les travaux de chantier naval et le débit d'approvisionnement."
 CHI_coast_guard_standoff: "Impasse de la Garde côtière"
 CHI_coast_guard_standoff_desc: "Des accrochages quotidiens entre milice chinoise et garde-côtes japonais dépriment l'activité économique locale."
 CHI_defense_industry: "Industrie de défense chinoise"
 CHI_defense_industry_desc: "La base industrielle de défense de la Chine s'articule autour de grands conglomérats d'État couvrant la production terrestre, aérienne, navale et électronique, alimentant à la fois les forces armées et le marché d'exportation. Ceci représente la capacité militaro-industrielle du pays."
 CHI_diplomacy_modifier: "Réseau diplomatique chinois"
 CHI_diplomacy_modifier_desc: "Une posture diplomatique variable accorde ou retire des bonus au gain d'opinion mensuel, aux relations commerciales, à la projection navale, à l'efficacité d'approvisionnement, aux opérations d'influence étrangère et au pouvoir politique selon la profondeur de l'investissement dans le réseau diplomatique de la Chine."
 CHI_economy_modifier: "Modèle économique chinois"
 CHI_economy_modifier_desc: "La Chine opère une économie de marché socialiste qui combine entreprises d'État, industrie privée et planification centrale par plans quinquennaux successifs. Ceci représente la base industrielle, la politique fiscale et la structure commerciale du pays."
 CHI_jap_industrial_partnerships: "Partenariats industriels sino-japonais"
 CHI_jap_industrial_partnerships_desc: "Une coopération économique structurée avec le Japon élargit l'accès à la fabrication de précision, aux chaînes d'approvisionnement avancées de l'automobile et de l'électronique, et au savoir-faire nucléaire civil. Le partenariat produit des gains en performance du blindage, agilité de la puissance aérienne, vitesse navale, débit de recherche et production industrielle, tout en portant une sensibilité politique intérieure compte tenu de l'animosité historique."
 CHI_korea_peninsula_modifier: "Stratégie de la péninsule coréenne"
 CHI_korea_peninsula_modifier_desc: "La Chine partage une frontière terrestre avec la péninsule coréenne et entretient des liens politiques, économiques et de renseignement à travers la région. Ceci représente la gestion par Pékin des relations, de la sécurité frontalière et des réseaux d'information sur son flanc nord-est."
 CHI_landforce_modifier: "Force terrestre de l'Armée populaire de libération"
 CHI_landforce_modifier_desc: "La branche terrestre de l'Armée populaire de libération, organisée en brigades interarmes sous le système de commandement de théâtre. Ceci représente sa doctrine, son entraînement et son équipement."
 CHI_navy_modifier: "Marine de l'Armée populaire de libération"
 CHI_navy_modifier_desc: "La branche navale de l'Armée populaire de libération, comprenant navires de surface, sous-marins, porte-avions et le corps des marines. Ceci représente la composition de sa flotte, sa doctrine et sa portée opérationnelle."
 CHI_northeast_revitalisation: "Revitalisation du Nord-Est"
 CHI_northeast_revitalisation_desc: "La stratégie de revitalisation du Nord-Est oriente le capital d'État vers les provinces de la ceinture de rouille du Liaoning, du Jilin et du Heilongjiang, priorisant l'industrie lourde, l'infrastructure énergétique et la construction de complexes industriels. Les installations de l'ère soviétique sont modernisées et de nouvelles capacités de production mises en service pour restaurer le rôle de la région comme base industrielle."
 CHI_political_system: "Système politique chinois"
 CHI_political_system_desc: "La République populaire de Chine est un État de parti unique dirigé par le Parti communiste chinois, organisé autour du centralisme démocratique et d'une vaste bureaucratie administrative. Ceci représente la structure de gouvernance, les institutions du parti et le contrôle de l'État."
 CHI_rare_earth_embargoed: "Embargo sur les terres rares"
 CHI_rare_earth_embargoed_desc: "Pékin a coupé les exportations critiques de terres rares vers le Japon, étouffant la production industrielle."
 CHI_rare_earth_embargoed_idea: "Embargo sur les terres rares"
 CHI_rare_earth_embargoed_idea_desc: "Pékin a coupé les exportations critiques de terres rares, étouffant les industries de défense et de haute technologie qui dépendent du raffinage chinois."
 CHI_rural_development: "Programme de développement rural"
 CHI_rural_development_desc: "Un investissement ciblé dans l'infrastructure rurale, y compris routes, services publics et capacité administrative locale, accélère l'activité de construction dans les comtés désignés. Le programme resserre l'écart de revenus urbain-rural et réduit les tensions sociales nées d'une modernisation inégale."
 JAP_china_market_partnerships: "Partenariats sur le marché chinois"
 JAP_china_market_partnerships_desc: "Une intégration profonde avec le marché de consommation et industriel chinois améliore l'efficacité des usines japonaises, stabilise les coûts des biens de consommation et soutient la cohésion politique intérieure. La capacité de production pour l'infrastructure civile s'étend, et les volumes commerciaux bilatéraux soutiennent la croissance même lorsque les frictions géopolitiques ailleurs créent des vents contraires."
