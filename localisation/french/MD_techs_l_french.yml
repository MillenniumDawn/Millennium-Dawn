 stealth_destroyer_1: "Destroyer furtif 2015"
 stealth_destroyer_1_desc: "Les changements dans les technologies de guerre modernes ont poussé les flottes les plus avancées à rechercher de nouvelles solutions pour la survie de leurs flottes. Les destroyers furtifs sont devenus une priorité. En restant cachés des capteurs et radars ennemis avancés, ces armes puissantes peuvent frapper plus près, plus rapidement et avec une létalité accrue, avec en prime une capacité de survie accrue dans les conflits modernes."
 stealth_destroyer_2: "Destroyer furtif 2030"
 stealth_destroyer_2_desc: "Les changements dans les technologies de guerre modernes ont poussé les flottes les plus avancées à rechercher de nouvelles solutions pour la survie de leurs flottes. Les destroyers furtifs sont devenus une priorité. En restant cachés des capteurs et radars ennemis avancés, ces armes puissantes peuvent frapper plus près, plus rapidement et avec une létalité accrue, avec en prime une capacité de survie accrue dans les conflits modernes."
 stealth_destroyer_3: "Destroyer furtif 2045"
