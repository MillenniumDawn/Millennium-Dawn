 MD_ftc_ex_operations_tt: "§Y$MD_ftc_exercise_operations$§!\n\n£navy_experience $NAVY_EXPERIENCE$: §R-450§!\nGains $POLITICS_NATIONAL_SPIRIT$ §Y$MD_ftc_exercise_operations$§! for §H90§! days:\n $MODIFIER_NAVY_FUEL_CONSUMPTION_FACTOR$: §R+25%§!\n $MODIFIER_NAVY_ORG_FACTOR$: §G+3%§!\n£doctrine_mastery §H$DOCTRINE_TRACK_SUPPORT$§! Mastery: [MD_ftc_exercise_mastery_tt_text] per day for §H90§! days\n\nRequires a navy of more than §H4§! ships."
