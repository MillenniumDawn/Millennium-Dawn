 GER_status_report_desc: "Status report will allow us to keep tabs on all radical elements in our nation. Mainly, the Islamist, Leftist, and Rightist extremists. If extremism is high, then that means the department responsible for managing them is failing to keep up, and their activities could soon disrupt national stability. If extremism is at medium, then it means that the department is doing a sub-par job at containing the groups, and there may be some issues, but nothing at the national level. Low extremism means that the group is being contained by the department, and they will not pose any threats to our democracy."
 GER_status_on_right_wing: "제 2 부서: 우익 극단주의"
 GER_status_on_right_wing_desc: "제 2 부서는 주요 우익 집단 및 조직을 감시합니다."
 GER_status_on_left_wing: "제 5 부서: 좌익 극단주의"
 GER_status_on_left_wing_desc: "제 5 부서는 주요 좌익 집단 및 조직을 감시합니다."
 GER_status_on_sand_people: "제 6 부서: 이슬람 극단주의"
 GER_status_on_sand_people_desc: "제 6 부서는 주요 이슬람 집단 및 조직을 감시합니다. 6 부서는 또한 국외의 이슬람주의 활동 또한 지켜보고 있습니다."
 GER_status_overview: "독일 연방헌법수호청 현황"
 GER_status_overview_desc: "모든 부서에 대한 종합 요약 보고서로 이동합니다"
