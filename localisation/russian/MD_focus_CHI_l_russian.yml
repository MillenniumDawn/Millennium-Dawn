 the_great_chip_race_modifier: "Великая гонка чипов"
 the_great_chip_race_modifier_desc: "Мы ведем гонку с Китаем за сохранение нашего превосходства в производстве микрочипов. Торговые выгоды, которые мы извлекаем из этого преимущества, необходимы для поддержания наших союзов и нашего положения в мире.\n\nПо мере роста производства микрочипов в КНР Тайвань будет получать увеличенный $production_speed_microchip_plant_factor$ и увеличенный $local_resources_microchips_factor$."
