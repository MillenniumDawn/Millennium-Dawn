 util_vehicle_9: "Внедорожник 2045"
 util_vehicle_9_desc: "Служебные внедорожники — машины, на которых мотопехота добирается до поля боя. Модели ранних поколений — джипы и грузовики — практически не бронированы и отличаются от гражданских аналогов в основном повышенной прочностью и проходимостью по труднопроходимой местности. Более поздние поколения представлены машинами типа Humvee с усиленной бронёй и защищёнными от мин автомобилями с ещё более высокой защитой экипажа. Если такие машины и вооружены, то обычно лёгким оружием, например пулемётами."
 util_vehicle_10: "Внедорожник 2055"
 util_vehicle_10_desc: "Служебные внедорожники — машины, на которых мотопехота добирается до поля боя. Модели ранних поколений — джипы и грузовики — практически не бронированы и отличаются от гражданских аналогов в основном повышенной прочностью и проходимостью по труднопроходимой местности. Более поздние поколения представлены машинами типа Humvee с усиленной бронёй и защищёнными от мин автомобилями с ещё более высокой защитой экипажа. Если такие машины и вооружены, то обычно лёгким оружием, например пулемётами."
