 # Western Togoland Rebellion (Issue #388)
 ghana.1.t: "Western Togoland Declares Sovereignty"
 ghana.1.d: "For weeks, signs welcoming travellers to \"Western Togoland\" have stood along the roads of the Volta Region and nobody saw who raised them. Now the Western Togoland Restoration Front, heir to the Ewe movements that voted against union with the Gold Coast in 1956, has proclaimed the former British Togoland a sovereign state and demands talks under United Nations auspices. The regional chiefs are silent, and our security services admit they saw none of it coming."
 ghana.1.a: "Send a joint military and police operation into the region."
 ghana.1.b: "Open talks through the Volta Regional House of Chiefs."
 ghana.1.c: "A handful of signposts. Ignore them."
 ghana.2.t: "Attacks Across the Volta Region"
 ghana.2.d: "Twelve hours after posting photographs of five hundred freshly trained recruits, the separatists struck before dawn. They broke into an armoury, stormed the police stations at Aveyime and Mepe, freed the inmates and drove off with rifles and police pick-ups. Three officers are held hostage, among them the district commander. Heaps of sand and burning tyres block every road into the region, two radio stations are in separatist hands, and the police have been given twenty-four hours to leave."
 ghana.2.a: "Sweep the region, recover the weapons, fly the suspects to Accra."
 ghana.2.b: "Open talks with the chiefs and the Homeland Study Group."
 ghana.2.c: "Declare a state of emergency across the Volta Region."
 ghana.3.t: "The Volta Region Falls Quiet"
 ghana.3.d: "The roads are clear and the four thousand Dragons promised in the separatists' video never marched. Dozens of suspects sit in custody in Accra, the Regional House of Chiefs has disowned the movement as criminals, and soldiers will guard the polling stations in December. What remains is a question for the courts."
 ghana.3.a: "Prosecute the ringleaders for treason."
 ghana.3.b: "Release them on bail, as in 2019, and move on."
