l_korean:
 GER_bmvi: "연방 교통 및 디지털 인프라 사업부(BMVI)"
 GER_bmvi_desc: "연방 교통 및 디지털 인프라 사업부(BMVI)의 창립은 메르켈 정권의 디지털화 중점을 위한 계획이었습니다. 연방 교통 및 디지털 인프라 사업부(BMVI)는 연방교통건설부(BMVBS)를 대체할 것입니다."
 GER_digitalrat: "디지털화(Digitalrat)"
 GER_digitalrat_desc: "메르켈의 제4차 내각의 소집으로 2018년에 디지털 위원회가 설립되었습니다. 미래 지향적인 거대 기업과 멀티미디어 및 혁신 분야의 혁신적인 스타트업 CEO로 구성된 총리의 새로운 디지털 자문 엘리트는 그녀에게 독일 경제를 위한 보다 효과적이고 수익성 있는 계획을 제공할 것입니다. 디지털화 노력."
 GER_redistribute_cap_subsidies: "CAP(공동 농업 정책) 보조금 재분배"
 GER_redistribute_cap_subsidies_desc: "1962년 실시된 CAP(공동 농업 정책)은 연합의 다양한 농업 구획에 농업 보조금을 분배했습니다. 서비스업 경제를 가진 독일은 2%의 배정밖에 받지 못하였습니다. 현재 CAP(공동 농업 정책) 자금은 '초기 농부'들에게 정체되어 있는 상태로 이들은 부농이 된 실정입니다. 소규모 농부들의 부담을 달래주기 위해 자금을 재분배 하여야 합니다."
 GER_animal_rights_reform: "동물권 개혁"
 GER_animal_rights_reform_desc: "The people at large are taking notice of brutalities against animals - more than 99% of male chickens are slaughtered upon birth, for example, as only female chickens are useful to lay eggs for agricultural production. Such atrocities are good for business, but are really unpopular with the public. Some organizations like Greenpeace or PETA and populations like vegetarians and vegans are particularly annoyed."
 GER_bundeswehr_reform: "연방방위군 개혁"
 GER_bundeswehr_reform_desc: "Since the end of the Second World War, Germany's military has been severely restricted in size and scope. With the German government spending less on the military than other European powers such as France and the United Kingdom, Germany's forces face chronic supply problems and dysfunctional weapons systems. After soldiers used broomsticks rather than machine guns in a recent training exercise, the time has more than come to reform the Bundeswehr and ensure that Germany can properly defend itself."
 GER_abolish_conscription: "군사 재판"
 GER_abolish_conscription_desc: "Wehrgerechtigkeit, or conscription fairness, refers to the argument within German circles for the establishment of a professional, volunteer army now that the Cold War is over. This concept advocates for a military structure that is fair and just, both in terms of personnel and organization. Proponents argue that transitioning to a professional, volunteer army would enhance the effectiveness, efficiency, and readiness of the German military, allowing for greater flexibility in recruitment, training, and deployment.\nBy moving away from conscription and adopting a volunteer-based system, advocates of Wehrgerechtigkeit believe that the military could attract individuals with a genuine interest in serving, leading to a more motivated and skilled force. Furthermore, they argue that a professional army would better reflect the values of democracy and individual freedom, as individuals would have the choice to serve based on their own volition rather than being obligated by law.\nOverall, the concept of Wehrgerechtigkeit represents a shift in thinking about the role and structure of the German military in a post-Cold War era, emphasizing the importance of fairness, efficiency, and effectiveness in meeting the security challenges of the modern world."
 GER_Form_Daimler_Chrysler_AG: "다임러크라이슬러"
 GER_Form_Daimler_Chrysler_AG_desc: "다임러 크라이슬러 AG(Daimler Chrysler AG)는 다임러-벤츠 AG와 크라이슬러 코퍼레이션의 합병으로 1998년에 설립된 독일계 미국 자동차 제조업체입니다.\n회사의 운영 및 관리 역량을 확장하려면 새로운 사무실 공간이 필요합니다."
 GER_Fujian_Benz_Automotive: "\"푸젠 벤츠\" 홍콩 법인"
 GER_Fujian_Benz_Automotive_desc: "Fujian Benz Automotive Co., Ltd.는 중국 푸저우에 본사를 둔 경상용차 제조 회사입니다."
 GER_Volkswagen_Crisis: "폭스바겐 위기"
 GER_Volkswagen_Crisis_desc: "2004년에 폭스바겐은 경제적 압박을 받았다. 그룹은 2003년 회계연도에 이익이 50% 이상 감소했습니다. 이사회는 직원들과 협력하여 비용을 절감하고 독일 생산 현장의 경쟁력을 높이기 위해 회사의 포괄적인 구조 조정을 발표했습니다."
 GER_Expand_Volkswagen_Nutzfahrzeuge: "폭스바겐 상용차"
 GER_Expand_Volkswagen_Nutzfahrzeuge_desc: "Volkswagen Group 소유의 독일 경상용차 브랜드입니다. 본사는 독일 니더작센 주 하노버에 있습니다. 원래는 폭스바겐 승용차(사업 영역)의 일부였으나 1995년부터 별도의 브랜드로 운영되고 있습니다."
 GER_BMW_Focus: "BMW"
 GER_BMW_Focus_desc: "독일 바이에른주 뮌헨에 본사를 둔 고급 차량 및 오토바이를 생산하는 독일의 다국적 제조업체입니다. 이 회사는 1916년에 항공기 엔진 제조업체로 설립되었으며, 1917년부터 1918년까지, 그리고 1933년부터 1945년까지 다시 생산했습니다."
 GER_BMW_CKD_System: "생산 조립 단지 (CKD) 시스템"
 GER_BMW_CKD_System_desc: "By shipping our cars as complete knock-down kits, we can transport them around the world and need a lot less transport capacity"
 GER_Restructure_Infrastructure: "기반시설 개혁"
 GER_Restructure_Infrastructure_desc: "독일의 인프라는 세계 나머지 국가와 여전히 격차가 뚜렷합니다. 유럽 최고의 국가 목록에서 경쟁하려면 이를 크게 개선해야 합니다."
 GER_Deutsche_Post: "독일 중앙 우체국 개혁"
 GER_Deutsche_Post_desc: "독일 연방우정청(BRD)은 세 개의 별도 지점으로 분리되었지만 우리는 BRD에 현대적인 통신 시스템을 형성하고 사람들이 청구서와 세금 편지를 받을 수 있도록 개혁을 계속해야 합니다!"
 GER_Deutsche_Post_AG: "도이체 포스트 (Deutsche Post)"
 GER_Deutsche_Post_AG_desc: "Deutsche Post AG는 독일 우편 서비스 및 택배 회사입니다. 독일 및 전세계에서 우편 및 소포 배달 서비스를 제공합니다."
 GER_DHL: "DHL"
 GER_DHL_desc: "DHL은 독일의 택배, 소포, 속달 우편 서비스 제공업체입니다. 세계 최대 물류회사인 Deutsche Post AG의 자회사입니다. DHL은 국제 운송, 창고 보관, 공급망 관리 등 다양한 서비스를 제공합니다."
 GER_Postbank: "포스트 방크 (Postbank) 은행"
 GER_Postbank_desc: "Postbank는 저축 계좌, 대출, 모기지 및 투자 상품을 포함한 다양한 금융 서비스를 제공하는 독일 소매 은행입니다."
 GER_Network_Infrastructure_desc: "Network infrastructure refers to the hardware and software that enables network connectivity and communication between users, devices, apps, the internet, and more.\nNetwork infrastructure is essential for organizations to communicate and for the flow of information. It also enables individuals to connect to the internet and access online services made available by our government."
 GER_UMTS_License_auction: "범용 이동 통신 시스템 (UMTS) 면허 경매"
 GER_UMTS_License_auction_desc: "독일에서 UMTS 라이센스 경매는 2000년에 열렸으며 458억 달러 이상을 모금했습니다. 이번 경매는 독일 정부가 진행했으며 Deutsche Telekom, Vodafone, Telefonica 등 다양한 회사에 6개의 라이센스가 부여되었습니다.\n이번 경매는 3세대(3G) 이동통신 시대의 시작을 알리는 이동통신 역사상 중요한 사건이다."
 GER_Schulen_ans_Netz: "비영리 기관 \"학교를 네트워크로\""
 GER_Schulen_ans_Netz_desc: "Schulen Ans Netz는 시대에 맞는 디지털 플랫폼에서 우리 아이들을 더 잘 교육하기 위해 교육에서 디지털 미디어의 사용을 장려하는 것을 목표로 하는 독일의 비영리 단체입니다."
 GER_Regional_Innovation_Center: "연구 혁신 부 (DWIH)"
 GER_Regional_Innovation_Center_desc: "독일 연구 혁신 센터(DWIH)는 독일의 과학, 연구 및 혁신을 대표합니다.\n그들은 독일 혁신 리더의 가시성을 높이고, 지식을 전달하며, 독일과 호스트 국가의 행위자들에게 조언 및 연결을 제공합니다."
 GER_Digitale_Agenda: "디지털 세계에 대한 의제"
 GER_Digitale_Agenda_desc: "디지털 어젠다(Digital Agenda)는 독일 정부의 디지털 정책 및 온라인 정책에 대한 지침을 개괄적으로 설명하는 정책 문서입니다."
 GER_Startup_Investments: "개인자 영업 (Ich-AG) 보조금"
 GER_Startup_Investments_desc: "이히-AG는 실업자들이 창업 보조금인 '엑시스텐츠그륀둥스추슈스'를 지급받아 스스로 사업을 시작할 수 있도록 돕는 것을 목표로 하는 독일 정부의 정책입니다. 이 제도는 독일 노동시장을 개혁하려는 하르츠 개혁의 일환으로 시행되었습니다."
 GER_Neuer_Markt: "새로운 시장"
 GER_Neuer_Markt_desc: "노이어 마르크트는 \\"신기술\\" 시장 부문을 반영하고 미래 지향적 산업의 신생 기업들에게 기업공개를 통한 자기자본 조달 기회를 제공하기 위해 1997년에 설립된 도이체 뵈르제의 한 부문입니다."
 GER_home_Grown_Software: "국내 소프트웨어"
 GER_home_Grown_Software_desc: "우리 기업에 투자함으로써 외국 거대 기술 기업에 대한 의존에서 벗어나 우리 기업들에 더 많이 의지할 수 있습니다!"
 GER_Tech_DAX: "TechDAX 주가 지수"
 GER_Tech_DAX_desc: "테크DAX는 기술 부문의 독일 대기업 30개의 실적을 추적하는 독일 주가지수입니다.\n테크DAX에 편입된 기업들은 주문 거래량과 시가총액 면에서 DAX에 편입된 기업들보다 순위가 낮습니다."
 GER_Bergbaufolgelandschaften: "채굴 이후 환경 조성 작업"
 GER_Bergbaufolgelandschaften_desc: "베르크바우 폴게 란트샤프트는 채굴 지역의 경관을 복원하기 위해 채굴 작업 중 또는 그 이후에 도입된 광산 경관 사업입니다."
 GER_Nature_reserve: "자연 보존"
 GER_Nature_reserve_desc: "자연 보호구역은 동식물이나 지질학적 또는 기타 특별한 관심 대상으로서 중요한 보호 지역으로, 보전과 학습 및 연구를 위한 특별한 기회를 제공할 목적으로 지정되어 관리됩니다."
 GER_forestry: "삼림 관리"
 GER_forestry_desc: " §Y그들이 나를 방에 가뒀어. 고무로 된 방에. 쥐가 있는 고무 방에.§!\n\n 임업은 숲을 조성하고 관리하고 돌보는 과학이자 실천입니다. 이는 인간과 환경의 이익을 위해 산림과 삼림지의 관련 자원을 개발하고 보전하며 복원하는 일을 포함합니다. 어쩌면 고무나무를 심는 것이 생태계에 도움이 될지도 모릅니다."
 GER_Military_trainings_area: "군사 훈련 지역"
 GER_Military_trainings_area_desc: "군사 훈련 지역은 군이 전투를 훈련하고 연습하는 데 사용하는 지정된 토지입니다. 이러한 지역은 대개 일반인의 출입이 금지되지만, 사용하지 않을 때에는 제한적으로 출입이 허용되는 곳도 있습니다."
 GER_Deutsche_Bahn: "독일 철도"
 GER_Deutsche_Bahn_desc: "도이체 반은 독일의 국영 철도 회사이며 독일 정부의 통제를 받는 국영 기업입니다."
 GER_Deutsche_Bahn_AG: "국영 기업 \"독일 철도\""
 GER_Deutsche_Bahn_AG_desc: "도이체 반 AG는 독일의 국영 기업이자 국영 철도 회사입니다. 도이체 반 AG는 전체 매출의 약 절반을 철도 운송 사업에서 올리며, 나머지 절반은 기타 운송 및 물류 사업과 각종 서비스 제공 업체로 구성됩니다."
 GER_DB_Fernverkehr_AG: "독일 철도 - 장거리 수송 계열사 (Fernverkehr)"
 GER_DB_Fernverkehr_AG_desc: "DB 페른페어케어 AG는 독일에서 장거리 및 전국 횡단 여객 열차를 운행하는 도이체 반의 반독립 자회사 부문입니다."
 GER_DB_Regio: "독일 철도 - 단거리 수송 계열사 (Regio)"
 GER_DB_Regio_desc: "DB 레기오는 독일에서 지역 열차와 단거리 통근 열차 서비스를 운행하는 도이체 반의 자회사입니다. DB 레기오는 인접 국가의 운행을 포함하여 독일 내 DB 그룹의 모든 지역 교통 활동(철도 및 버스)을 담당합니다."
 GER_DB_Cargo: "독일 철도 - 화물 계열사 (Cargo)"
 GER_DB_Cargo_desc: "DB 카르고는 유럽에서 철도 화물 서비스를 운영하는 도이체 반의 자회사입니다. DB 카르고의 주요 산업에는 금속과 석탄, 화학, 자동차, 건축 자재, 산업재 및 소비재, 복합 운송이 포함됩니다."
 GER_DB_Schenker: "독일 철도 - 오스트리아 지사 수송 계열사 (DB Schenker)"
 GER_DB_Schenker_desc: "DB 솅커는 물류에 주력하는 독일 철도 운영사 도이체 반의 한 부문입니다.\nDB 솅커는 전체 매출의 약 절반을 철도 운송 사업에서 올리며, 나머지 절반은 기타 운송 및 물류 사업과 각종 서비스 제공 업체로 구성됩니다."
 GER_DB_Netz_AG: "독일 철도 - 철도 유지 보수 계열사 (Netz)"
 GER_DB_Netz_AG_desc: "DB 넷츠 AG는 독일 철도 기반시설의 관리와 유지를 담당하는 도이체 반의 자회사입니다."
 GER_Restructure_the_Foreign_Ministery: "외교부"
 GER_Restructure_the_Foreign_Ministery_desc: "독일 외무부는 베를린으로 이전될 것이며, 해외에서의 우리 관계와 활동을 위한 새로운 의제가 추진될 것입니다."
 GER_found_Bundesagentur_fur_Aussenwirtschaft: "Bundesagentur für Außenwirtschaft"
 GER_found_Bundesagentur_fur_Aussenwirtschaft_desc: "독일은 해외에서 독일 기업을 지원하고 국제 무역을 촉진하는 데 전념하는 전담 기관인 연방 대외경제청(Bundesagentur für Außenwirtschaft)을 설립할 것입니다. 이 기관은 독일 기업이 해외 시장에 진출하고 국제 파트너십을 구축하며 투자를 확보하는 것을 지원할 것입니다. 이 새로운 기관은 독일의 세계 경제 전략의 핵심 요소로서 선도적인 수출국의 지위를 유지하는 데 기여할 것입니다."
 GER_Reform_the_GTZ: "Gesellschaft für Technische Zusammenarbeit"
 GER_Reform_the_GTZ_desc: " 독일 연방공화국이 소유한 이 조직은 파트너 국가 국민의 생활 여건을 지속 가능하게 개선하고 삶이 의존하는 천연자원 기반을 보전한다는 개발 정책상의 임무를 지닌 민간 부문 기업으로 운영됩니다."
 GER_Reform_the_DED: "Reform the DED"
 GER_Reform_the_DED_desc: "독일 개발 봉사단(DED)은 그 임무를 독일의 국제 개발 목표에 더 잘 부합시키기 위해 대대적인 개혁을 거칠 것입니다. 운영을 간소화하고 국제 파트너와의 협력을 강화함으로써, DED는 개발도상국의 빈곤 감소, 경제 발전, 역량 강화에 집중할 것입니다. 이러한 개혁을 통해 독일은 세계 개발에 대한 의지를 다지는 동시에 대외 원조 사업의 효율성과 효과를 보장할 것입니다."
 GER_Found_InWent: "Found InWEnt"
 GER_Found_InWent_desc: "독일은 역량 구축 및 훈련 프로그램을 위한 세계적 플랫폼으로 InWEnt(Internationale Weiterbildung und Entwicklung gGmbH)를 설립할 것입니다. 지도력 및 개발 교육을 제공함으로써 InWEnt는 신흥국과 개발도상국의 시민사회와 통치 구조를 강화하는 데 힘쓸 것입니다. 이러한 노력을 통해 독일은 장기적인 파트너십을 구축하고 세계적 규모의 지속 가능한 발전을 촉진하고자 합니다."
 GER_Found_the_GIZ: "Found the GIZ"
 GER_Found_the_GIZ_desc: "독일은 기술 협력과 국제 개발 프로젝트를 조율하는 세계적 개발 기관인 GIZ(Deutsche Gesellschaft für Internationale Zusammenarbeit)를 설립할 것입니다. GIZ 아래로 노력을 통합함으로써 독일은 신흥 시장의 기반시설 개발, 통치 개혁, 지속 가능한 성장을 지원하는 역량을 강화할 것입니다. GIZ는 또한 위기 관리, 평화 구축, 분쟁 후 재건에 관한 전문 지식도 제공할 것입니다."
 GER_Weizsacker_Kommision: "바이츠체커 (Weizsäcker) 위원회"
 GER_Weizsacker_Kommision_desc: "바이츠체커 위원회는 연방방위군 개혁을 위해 2000년 독일의 사회민주당-녹색당 정부가 설치한 위원회였습니다. 2001년에 발표된 위원회의 보고서는 징병 기간을 9개월에서 6개월로 단축하고 지원병을 위한 새로운 군 복무 제도를 신설하는 것을 포함하여 연방방위군에 대한 여러 변화를 권고하였습니다."
 GER_Establish_Streitkraftebasis: "육군 (Streitkräfte) 기반 설립"
 GER_Establish_Streitkraftebasis_desc: "슈트라이트크레프테바지스는 육군, 공군, 해군 등 독일 연방군의 다른 부문을 위한 서비스 제공 조직입니다.\n슈트라이트크레프테바지스는 군수, ABC 방어, 훈련, 헌병, 대규모 병력 이동 관리, 연료 및 물 보급 등의 분야에서 지원을 제공합니다."
 GER_transformation: "독일 연방방위군의 변화"
 GER_transformation_desc: "연방방위군의 변혁은 독일 연방군이 정치적, 군사적 여건의 변화에 적응하는 과정으로, 작전 준비태세와 지속 가능성을 높이는 것을 목표로 합니다."
 GER_Einsatzfuhrungskommando: "Einsatzführungskommando Establishment"
 GER_Einsatzfuhrungskommando_desc: "작전지휘사령부(Einsatzführungskommando)의 창설은 연방방위군의 해외 작전 지휘를 중앙집중화하는 데 중요한 걸음이었습니다. 이 지휘 구조는 모든 해외 파병의 계획과 실행을 책임지며, 간소화된 의사 결정과 협조를 보장합니다. 작전지휘사령부는 국제 위기와 군사적 개입에 연방방위군이 신속하고 효과적으로 대응하는 능력을 향상시켰습니다."
 GER_Heeresaufklarungstruppe: "Heeresaufklärungstruppe"
 GER_Heeresaufklarungstruppe_desc: "우리의 정찰 부대를 헤레스아우프클레룽스트루페의 지휘 아래 통합하면 효율성을 크게 높이고 작전 비용을 줄일 수 있습니다. 이러한 통합은 지휘 통제를 간소화하여 더 조율되고 효과적인 정찰 작전으로 이어질 것입니다. 또한 최전선 부대에 제공되는 정보의 정확성과 적시성을 높여 상황 인식과 전반적인 전투 효율을 향상시킬 것입니다. 정찰 노력을 중앙집중화하면 정보 수집과 분석에 더욱 통합된 접근이 가능해지며, 이는 정보에 입각한 전술적, 전략적 결정을 내리는 데 매우 중요합니다."
 GER_Heer_2010: "2010년 연방군"
 GER_Heer_2010_desc: "육군(Heer)은 창설 이래 여러 차례 구조 개편을 거쳤습니다. 가장 최근의 개편은 새로운 방위 정책 지침과 함께 시작되었습니다. 이 개편은 2010년까지 완료될 예정이며 \\"Heer 2010\\" 또는 \\"신육군\\"이라 불립니다. 육군은 개입군, 안정화군, 지원군을 포함한 여러 범주로 나뉩니다."
 GER_Neuausrichtung_des_Heeres: "독일 연방방위군 재정비"
 GER_Neuausrichtung_des_Heeres_desc: "연방방위군의 재편, 곧 독일 연방군의 구조 개편은 1955년 창설 이래 연방방위군에 가해지는 가장 포괄적인 개혁입니다. 이 중대한 개편에는 광범위한 계획 수립과 의사 결정 과정이 수반되지만, 우리 군이 얻게 될 기대 효과는 상당합니다.\n이 구조 개편은 21세기의 변화하는 안보 도전에 더 잘 대응하도록 연방방위군을 현대화하고 최적화하는 것을 목표로 합니다. 여기에는 전력 구조의 재편, 부대의 재조직, 장비와 기술의 갱신, 그리고 군 전 병과에 걸친 준비태세와 능력의 강화가 포함됩니다. 연방방위군을 현대적인 방위 요구와 전략적 목표에 맞춤으로써, 이 개혁은 우리 군이 다양한 위협과 시나리오에 민첩하고 유연하며 효과적으로 대처할 수 있도록 보장합니다.\n구조 개편의 과정은 복잡하고 힘겨울 수 있으나, 그 결과는 연방방위군의 전반적인 효율성, 준비태세, 작전 능력을 크게 높일 것입니다. 이는 국방에 대한 미래 지향적 접근을 나타내며, 독일이 자국의 이익을 지키고, 동맹 및 파트너에 대한 약속을 이행하며, 끊임없이 변화하는 지정학적 환경 속에서 세계 안보 노력에 기여할 준비를 갖추도록 보장합니다."
 GER_Army_Training_Command: "육군 교육사령부"
 GER_Army_Training_Command_desc: "아우스빌둥스코만도는 독일 육군의 지휘관 교육과 보수 교육의 계획 및 조율을 담당합니다. 육군 지휘 조직의 일부로서 육군 내 전체 교육 과정을 감독하는 데 핵심적인 역할을 합니다. 여기에는 교육과정 개발, 강좌 편성, 그리고 병사들이 지휘 임무를 효과적으로 수행하는 데 필요한 교육을 받도록 보장하는 일이 포함됩니다.\n또한 아우스빌둥스코만도는 다른 군 병과 및 외부 파트너와 긴밀히 협력하여 교육 프로그램이 폭넓은 방위 목표 및 군사 교육의 모범 사례와 부합하도록 합니다. 지속적인 학습과 전문성 개발의 문화를 조성함으로써, 현대전의 도전에 대응할 수 있는 숙련되고 유능한 지휘관 집단을 양성하는 데 기여합니다.\n전반적으로 아우스빌둥스코만도는 독일 육군의 능력과 준비태세를 형성하는 데 중대한 역할을 하며, 소속 인원이 잘 훈련되고 의욕적이며 국가에 봉사하는 임무를 수행할 준비가 되어 있도록 보장합니다."
 GER_Army_Concepts_and_Capabilities_Development_Centre: "Amt Für Heeresentwicklung"
 GER_Army_Concepts_and_Capabilities_Development_Centre_desc: "육군 발전청(Amt für Heeresentwicklung)은 개념, 훈련, 조직, 물자 계획의 추가 발전을 맡은 독일 육군의 기관입니다. 이 기관은 새롭게 부상하는 위협을 분석하고, 기술 발전을 평가하며, 교리와 전술, 장비에서 개선이 필요한 영역을 식별함으로써 육군의 미래 방향을 형성하는 데 중대한 역할을 합니다.\n그 책임에는 새로운 개념과 능력의 개발에 반영할 연구, 실험, 분석을 수행하는 일이 포함됩니다. 여기에는 혁신적인 전쟁 접근법의 모색, 현행 관행의 효과 평가, 과거 작전에서 얻은 교훈의 통합이 포함될 수 있습니다. 아울러 육군 발전청은 목표를 달성하기 위해 전문 지식과 자원을 활용하고자 다른 군 병과는 물론 산업계 파트너 및 학술 기관과도 긴밀히 협력합니다.\n지속적인 혁신과 적응에 집중함으로써 육군 발전청은 독일 육군이 군사적 효율성과 준비태세의 최전선에 머물도록 보장합니다. 이 기관의 노력은 육군이 변화하는 안보 도전에 대응하고, 전략적 중요성을 유지하며, 끊임없이 변화하는 지정학적 환경 속에서 임무를 효과적으로 수행하는 능력에 기여합니다."
 GER_Cyber_and_Information_Doman_Service: "사이버정보군"
 GER_Cyber_and_Information_Doman_Service_desc: "사이버·정보 영역 군(CIDS)은 독일 연방군인 연방방위군의 가장 새로운 군종입니다. 그 주된 임무는 연방방위군 내에서 사이버, 정보기술(IT), 군사 정보, 지리 정보, 작전 통신과 관련된 여러 부대의 재편 계획을 수립하는 것입니다.\n사이버 위협이 계속 진화하고 갈수록 정교해짐에 따라, CIDS의 창설은 현대전에서 사이버 보안과 정보 작전의 중요성에 대한 인식이 커지고 있음을 반영합니다. 이 군은 이러한 분야에서 연방방위군의 능력을 높이기 위해 여러 영역에 걸친 노력을 조율하고 통합하는 임무를 맡고 있습니다.\nCIDS는 연방방위군의 네트워크, 시스템, 정보 자산의 안전과 회복력을 보장하기 위한 포괄적인 전략과 정책, 절차를 개발할 책임이 있습니다. 또한 군사 목표를 지원하기 위한 정보 수집, 상황 인식, 통신을 포함하여 사이버 및 정보 작전을 수행하는 군의 능력을 강화하는 일도 합니다."
 GER_call_reservists: "Call Up the Reservists"
 GER_call_reservists_desc: "제8기갑여단, 제32·제5·제2기계화보병여단 같은 비활성 여단과 국가의 나머지 예비군이 활성화될 것입니다. 이 부대들은 정규군을 보강하여, 커지는 군사적 위협에 맞서 추가 인력과 장비를 제공함으로써 국가의 방위 능력을 강화할 것입니다."
 GER_deutschland_industrie: "Deutschland, Industrieland"
 GER_deutschland_industrie_desc: "독일은 한때 유럽의 산업 작업장이었으나, 지금은 나머지 유럽에 뒤처져 있습니다. 이제 새 천년이 되었으니 이 낡은 작업장의 톱니바퀴를 다시 돌릴 때입니다. "
 GER_alt_energy: "대체 에너지 계획"
 GER_alt_energy_desc: "새로운 시대에 접어들면서 사람들은 환경에 미치는 영향에 더 민감해졌고, 재생 불가능 자원이 방 안의 공룡 같은 존재라는 점이 분명해졌습니다. 의식 있는 사람들은 석탄, 석유, 가스 같은 화석 연료라는 낡은 방식에 대한 대안을 찾게 됩니다."
 GER_a_greener_germany: "A Greener Germany"
 GER_a_greener_germany_desc: "§R우리가 §!§G더 푸른§! §R독일이 되기 위해서는 먼저 §!§Y원자력 에너지§! §R지위를 제거해야 합니다!§!\n\n비재생 에너지라는 구시대적 방식에서 벗어나기 위해, 우리는 녹색 재생 에너지로 방향을 돌리기 시작하고 B90/녹색당(Grünen)의 정책에 더욱 발맞추어 독일 국민을 달래야 합니다."
 GER_a_nuclear_germany: "A Nuclear Germany"
 GER_a_nuclear_germany_desc: "이제 21세기이며 원자력은 수십 년간 존재해 왔고 화석 연료에 비해 안전하고 더 깨끗한 에너지원임이 입증되었으나, 특히 B90/녹색당(Grünen)을 중심으로 수년간 반대에 부딪혀 왔습니다. \n 원자력은 나아갈 길이며, 이제 국민들이 원자력이 지닌 잠재력과 힘을 볼 때입니다."
 GER_expand_uranium_mining: "우라늄 채굴 확장"
 GER_expand_uranium_mining_desc: "독일이 원자력의 새 시대에 접어들면서 핵연료용 우라늄에 대한 수요 역시 늘어납니다. 역사적으로 이 '핵 황금'의 방대한 매장량이 묻혀 있던 요한게오르겐슈타트 마을의 옛 광산을 다시 열어야 합니다."
 GER_nuclear_waste_recycling: "핵 폐기물 재활용"
 GER_nuclear_waste_recycling_desc: "핵폐기물은 원자력 발전 과정에서 나오는 부산물로, 통상 폐기됩니다. 표준 절차에 따라 폐기물을 저장 시설에 매립하는 대신, 폐기물을 재활용하는 새로운 수단이 등장했습니다. 폐기물에는 여전히 막대한 양의 에너지가 남아 있어 재활용하여 다른 용도로 쓸 수 있으며, 사용 후 연료의 수명과 활용도를 더욱 연장할 수 있습니다."
 GER_less_coal_more_nuclear: "석탄을 원자력 발전으로 대체"
 GER_less_coal_more_nuclear_desc: "최근의 새로운 정책과 원자력 투자로 독일은 그 혜택을 거두기 시작했습니다. 독일이 원자력으로 더욱 기울면서 석탄의 필요성은 크게 줄었습니다. 시간이 지나면 우리는 석탄 발전에 전혀 의존하지 않아도 되기를 바랄 수 있습니다."
 GER_revive_greifswald: "그라이프스발트 발전소 복원"
 GER_revive_greifswald_desc: "그라이프스발트 원자력 발전소는 독일 통일 직후 폐쇄되기 전까지 동독 최대의 원자력 발전소였습니다. 과거 원자로 중 하나가 전기적 결함으로 노심 융해 직전까지 간 적이 있었지만 그것은 과거의 일이며, 지금의 독일 원자력은 더 낫고 더 안전합니다. 그렇죠?"
 GER_national_grid: "국가 전력망 확장"
 GER_national_grid_desc: "에너지 생산 증가와 산업 확장으로 인해, 이러한 에너지 사용량과 생산량의 증가를 감당할 수 있도록 전국 전력망을 업그레이드하는 것이 필수적입니다."
 GER_renewable_energy_projects: "Begin The 'Renewable Energy project'"
 GER_renewable_energy_projects_desc: "독일은 친환경 재생 에너지 분야의 개척자가 되기 시작했습니다. 재생 에너지에 대한 수요가 늘어남에 따라 새로운 계약과 사업이 필요할 것입니다."
 GER_wind_power: "풍력 발전 지대 확장"
 GER_wind_power_desc: "작센안할트와 슐레스비히-홀슈타인에는 독일 최대 규모의 풍력 발전 단지 일부가 있습니다. 이 풍력 발전 단지를 확장하면 독일에 더 친환경적이고 깨끗한 에너지를 공급할 수 있습니다."
 GER_biomass_plants: "엠덴 유기 물질 발전소"
 GER_biomass_plants_desc: "니더작센 엠덴의 새로운 바이오매스 발전소는 독일 친환경 에너지 사업의 최신 성과입니다. 엠덴 바이오매스 발전소는 최첨단 기술과 기법을 사용하여 가장 깨끗한 에너지를 공급합니다."
 GER_large_solar_farms: "태양광 단지 확장"
 GER_large_solar_farms_desc: "독일이 더 친환경적인 에너지의 길로 나아감에 따라, 프랑켄, 헤센, 바덴뷔르템베르크에 여러 대규모 태양광 발전 단지를 건설하는 계획이 구체화되기 시작합니다."
 GER_complete_phase_one: "Complete Phase One"
 GER_complete_phase_one_desc: "'재생 에너지 사업'이 새로운 에너지 시설의 건설과 함께 계속되면서 1단계가 완료되었습니다."
 GER_more_biomass_plants: "란데스베르겐 유기 물질 발전소"
 GER_more_biomass_plants_desc: "연방 경제에너지부가 바이오매스 에너지에 추가 투자하려 함에 따라, 니더작센 란데스베르겐에 새 발전소가 건설될 예정입니다."
 GER_offshore_windfarms: "해안 풍력 발전 단지 증설"
 GER_offshore_windfarms_desc: "독일은 해안선이 짧으므로 이를 최대한 활용하고자 합니다. 북해와 발트해에 해상 풍력 발전 단지를 새로 건설하면 우리의 바다를 잘 활용하고 독일에 더 많은 재생 에너지 수단을 제공할 것입니다."
 GER_national_solar_energy_scheme: "국가 태양광 패널 계획"
 GER_national_solar_energy_scheme_desc: "독일이 태양광 에너지 역량을 더욱 확대하려 하면서 독일 국민에게 눈을 돌립니다. 독일 정부는 모든 가정에 지붕형 태양광 패널을 설치하여 친환경적이고 깨끗한 에너지를 공급하는 '국가 태양광 에너지 계획'을 통과시킵니다."
 GER_complete_renewable_energy_projects: "Complete The Project"
 GER_complete_renewable_energy_projects_desc: "에너지 시설에 마지막 자금이 투입되고 마무리 작업이 끝나면서, 프로젝트가 이제 완료되었습니다."
 GER_committed_to_green_power: "푸름과 헌신"
 GER_committed_to_green_power_desc: "B90/녹색당(Grünen)에 대한 정부의 지속적인 지지와 친환경이 되려는 추진력 및 결의로 독일은 화석 연료에서 벗어나 §G더 푸른§! 풀밭을 향해 나아가기 위해 재생 에너지 역량을 대폭 확대하는 데 성공했습니다."
 GER_carbon_neutral: "재생가능한 독일"
 GER_carbon_neutral_desc: "수년에 걸쳐 독일은 이전의 '더러운' 에너지 방식에서 벗어나 재생 에너지 프로그램을 확대해 왔으며, 이제 가까운 장래에 재생 에너지 목표를 달성할 궤도에 올랐다고 할 수 있습니다. 화석 연료는 과거의 것이 되었고, 앞길은 녹색으로 칠해져 있습니다. "
 GER_acquire_enbw_energy: "'EnBW 에너지' 인수"
 GER_acquire_enbw_energy_desc: "독일 정부는 독일의 에너지 역량에 대한 통제권을 되찾기 위해 EnBW 에너지를 인수하려 합니다."
 GER_acquire_eon_energy: "'E.ON 에너지' 인수"
 GER_acquire_eon_energy_desc: "독일 정부는 독일의 에너지 역량에 대한 통제권을 되찾기 위해 E.ON 에너지를 인수하려 합니다."
 GER_acquire_rwe_energy: "'RWE 에너지' 인수"
 GER_acquire_rwe_energy_desc: "독일 정부는 독일의 에너지 역량에 대한 통제권을 되찾기 위해 RWE 에너지를 인수하려 합니다."
 GER_nationalise_german_energy_companies: "에너지 부문 국유화"
 GER_nationalise_german_energy_companies_desc: "§YSpecial Conditions:§! The Cost Of Nationalisation Will Be Reduced If The §G'Renewable Energy Project'§! Is Completed.\n\nGermany has been pillaged by the greedy private owned energy companies for long enough, it's time the Government took hold of the reins and nationalised these thieves!"
 GER_the_power_of_the_atom: "원자의 힘"
 GER_the_power_of_the_atom_desc: "독일은 원자력의 개념을 완전히 파악하고 그 진정한 잠재력을 이해했으며, 이제 우리는 그 재생 에너지 쓰레기 대신 원자력을 채택할 것입니다!? 원자의 힘으로 집에 전기를 공급할 수 있는데, 거대한 선풍기에 바람을 불어 넣어 전기를 얻을 필요가 누구에게 있겠습니까?"
 GER_upgrade_nuclear_fuel_processing: "핵연료 공정 과정 개선"
 GER_upgrade_nuclear_fuel_processing_desc: "독일이 원자력으로 더욱 기움에 따라, 우리는 더 효율적인 처리 체계를 갖추기 위해 처리 능력을 업그레이드하기 시작할 것입니다."
 GER_the_glowing_one: "The Glowing One"
 GER_the_glowing_one_desc: "§Y이 모든 중점들은 핵겨울을 바라게 만들 지경입니다.§!\n\n 원자력의 세계로 더 깊이 파고들면서 우리는 새로운 원자력 에너지 수단을 발견하고 연구하고 있습니다. 방사성 동위원소 열전 발전소의 건설은 우리 원자력 경로의 다음 단계입니다. 이 발전소들은 붕괴하는 여러 핵물질에서 방출되는 열에너지를 통해 에너지를 공급합니다."
 GER_expand_oil_gas: "석유 & 가스 분야 확장"
 GER_expand_oil_gas_desc: "제2차 세계 대전의 실수에서 교훈을 얻어, 우리는 독일이 최상의 국내 석유 및 가스 공급원을 갖추고 있지 않음을 인식합니다.\n석유와 가스는 국가가 기능하는 데 중요한 부분이므로, 우리는 역사의 반복을 막고 천연가스와 석유의 안정적인 공급을 보장하기 위해 산업을 확대하고자 합니다."
 GER_foreign_investors: "외국 투자자 초청"
 GER_foreign_investors_desc: "석유·가스 부문을 더욱 확대하려는 우리는, 외국 국가와 기업이 독일을 다음 투자처로 선택하기를 바라며 국제 투자 부문에 눈을 돌립니다."
 GER_exxon_ops: "엑슨모빌 (ExxonMobil) 작전"
 GER_exxon_ops_desc: "엑슨모빌이 독일 석유·가스 부문 확대의 주요 투자자로 선정되었습니다."
 GER_construct_cologne_plant: "쾰른 발전소 건설"
 GER_construct_cologne_plant_desc: "엑슨이 독일에서 더욱 사업을 확장하려 함에 따라, 쾰른에 새로운 석유 처리 공장의 건설이 시작됩니다."
 GER_construct_karlsruhe_plant: "카를스루에 발전소 건설"
 GER_construct_karlsruhe_plant_desc: "독일에서 엑슨의 사업이 계속 확대됨에 따라, 그들의 최신 사업인 카를스루에의 새로운 엑슨 정유 시설 건설이 시작됩니다."
 GER_gazprom_ops: "가스프롬 작전"
 GER_gazprom_ops_desc: "가스프롬이 독일 석유·가스 부문 확대의 주요 투자자로 선정되었습니다."
 GER_shell_ops: "로얄 더치 쉘 (Shell) 작전"
 GER_shell_ops_desc: "셸이 독일 석유·가스 부문 확대의 주요 투자자로 선정되었습니다."
 GER_nordstream_one: "노르드스트림 1 파이프라인"
 GER_nordstream_one_desc: "Nordstream is a network of offshore natural gas pipelines in Europe which run under the Baltic Sea from Russia to Germany. These pipelines will provide essential gas to our European neighbours."
 GER_propose_nordstream_two: "노르드스트림 2 파이프라인"
 GER_propose_nordstream_two_desc: "러시아산 자원에 대한 수요의 성공과 높은 증가에 따라, 수요를 감당하고 충족하기 위해 두 번째 파이프라인이 건설될 것입니다."
 GER_northsea_steel_oilrigs: "북해 유정 굴착 장치를 위한 강철 투입"
 GER_northsea_steel_oilrigs_desc: "독일은 셸 PLC에 북해 석유 굴착 장치 건설용 강철을 공급하고자 합니다. 이는 우리에게 필수 자원을 제공하고 셸 PLC 및 영국과의 유대를 강화할 것입니다."
 GER_domestic_oil: "국내 석유 생산"
 GER_domestic_oil_desc: "우리 자산을 팔아넘기고 다른 국가와 기업이 우리 문제에 영향력을 행사하게 하는 것은 우리의 이익에 부합하지 않으므로, 독일은 보다 국내 중심의 접근 방식을 택하고 있습니다."
 GER_increase_oil_reserves: "국가 석유 비축고 확장"
 GER_increase_oil_reserves_desc: "석유 생산을 확대하기 시작하면서, 우리는 먼저 더 많은 물량을 보관할 수 있도록 국가 비축 시설을 확대해야 합니다."
 GER_german_oilrig_designs: "국산 유정 굴착 장치 설계"
 GER_german_oilrig_designs_desc: "석유와 가스의 국내 생산을 더욱 늘리기 위한 노력으로, 우리는 §Y[GER.GetNameWithFlag]§! 기업들과 계약하여 우리 해역에서 운용되어 천연가스와 석유를 채취할 일련의 해상 석유 굴착 플랫폼을 설계하도록 합니다."
 GER_construct_more_oilrigs: "해안에 유정 굴착 장치 건설"
 GER_construct_more_oilrigs_desc: "새로운 해상 석유 굴착 플랫폼의 설계가 완료되었으며 플랫폼 건설이 시작되었습니다. 우리가 유럽의 석유 국가가 되는 것도 머지않았습니다.\n\n §Y[USA.GetFlag]§!§YDId SoMEoNe SaY FreEdOm??§! "
 GER_alternative_fuel_options: "대체 연료 선택지"
 GER_alternative_fuel_options_desc: "표준적인 연료 생산 수단과 함께 대체 방안도 모색되고 있습니다. 기술은 비교적 새롭고 미개척이지만 새로운 혁신적 해결책입니다."
 GER_bio_options: "Bio Fuel Options"
 GER_bio_options_desc: "바이오 연료는 훌륭한 친환경 연료원입니다. 친환경일 뿐 아니라 기존 용도로는 더 이상 쓸모없는 폐자재를 활용하여 신이 주신 자원을 선용합니다."
 GER_ethanol_power: "'포도 동력'"
 GER_ethanol_power_desc: "에탄올 동력은 현재 주류 에너지원은 아니지만, 독일은 일찌감치 발판을 마련하고 있습니다. 에탄올 동력은 포도주, 감자 보드카, 크바스 등 여러 다양한 자원에서 얻을 수 있는 매우 지속 가능하고 재생 가능한 연료원입니다. \n무엇이든 말만 하십시오, 다 됩니다."
 GER_bio_diesel_production: "바이오 디젤 생산"
 GER_bio_diesel_production_desc: "바이오 디젤은 일반 대중 사이에서 더욱 인기 있는 연료원이 되고 있으며, 이제 산업 대기업들도 주목하기 시작했습니다. 이는 사용한 기름과 연료를 재활용하는 혁신적인 방법이 될 수 있으며, 결과적으로 우리에게 더 많은 연료를 제공할 것입니다."
 GER_lift_fracking_ban: "수압 파쇄형 (Fracking) 자원 추출 금지법 철회"
 GER_lift_fracking_ban_desc: "독일 땅에서의 수압 파쇄는 잠재적 위험 때문에 오랫동안 금지되어 왔습니다. 이는 모두 녹색 정당들이 퍼뜨린 거짓 선전일 뿐이며, 수압 파쇄는 놀랍고 안전한 석유·가스원입니다. 땅에서 가스가 조금 새어 나오는 것쯤은 괜찮으니 걱정하지 마십시오."
 GER_mining_in_germany: "Deutscher Bergbau"
 GER_mining_in_germany_desc: "독일에서 광업은 수백 년 동안 이 나라의 역사적 뿌리였으며, 특히 유럽 최대의 철과 석탄 수출국 중 하나라는 점에서 그러했습니다.\n새 천년에 들어선 지금, 광업을 어떻게 확장하고 성장시킬지에 대한 새로운 앞으로의 계획을 고민해야 합니다."
 GER_increase_mining_funds: "광업 부문 지원금 확대"
 GER_increase_mining_funds_desc: "광업 활동과 생산량을 늘리기 위해 광부들의 편에 서고자 하는 만큼, 우리의 요구 사항을 충족하기 위한 새 장비를 갖추도록 노동자와 기업에 충분한 자금을 제공해야 합니다."
 GER_miner_advertisement_campaign: "광부 모집 홍보 캠페인"
 GER_miner_advertisement_campaign_desc: "산업 광업 확장을 시작하면서, 비어 있는 일자리를 채울 노동자를 더 고용해야 합니다. 더 많은 시민과 외국인 노동자가 광업 직종에 지원하도록 요청하는 광고 캠페인에 자금을 지원하는 것은 훌륭한 해결책이 될 것이며, 우리는 카타르의 방식을 따를 것입니다.\n결국, 값싼 외국인 노동력을 싫어할 사람이 누가 있겠습니까?"
 GER_increase_mining_output: "채굴 산출량 확대"
 GER_increase_mining_output_desc: "독일은 광물과 자원이 풍부하며, 대지의 손아귀에서 풀려날 운명입니다.\n독일의 풍부한 자원을 최대한 활용하려면 광업 시설과 운영을 늘리는 것부터 시작해야 합니다."
 GER_samson_pit: "삼손 피트 (Samson Pit) 은 광산"
 GER_samson_pit_desc: "삼손 갱은 1800년대 중반부터 1900년대 초반까지 채굴된 역사적인 은광이었습니다. 이 갱에는 여전히 대량의 은이 매장되어 있는 것으로 믿어지므로, 채굴을 재개하기로 결정되었습니다."
 GER_glasebach_mine: "Profen Mine Revival"
 GER_glasebach_mine_desc: "차이츠 인근의 프로펜 갈탄 광산을 다시 열어 확장합니다. 채굴 기반시설에 대한 이러한 자본 투입은 작센안할트의 갈탄 생산량을 크게 늘리고 지역 경제 활동을 개선할 것입니다."
 GER_grunten_mine: "구룬텐 철광산"
 GER_grunten_mine_desc: "그륀텐에는 버려진 중세 철광산이 많으며, 대부분 아직 채굴되지 않은 막대한 철광석 매장량이 남아 있습니다."
 GER_ruhr_mine: "우워 철광산 "
 GER_ruhr_mine_desc: "루르는 루르강을 따라 펼쳐진 대규모 산업 지역입니다. 이 지역에는 다양한 금속과 석탄 매장지가 풍부합니다."
 GER_modernise_mining_equipment: "채굴 장비 현대화"
 GER_modernise_mining_equipment_desc: "광업 장비를 현대화하면 광물과 자재를 더 낫고 효율적으로 채굴할 수 있게 되어, 결과적으로 더 높은 산출량을 얻을 수 있습니다."
 GER_health_and_safety_reforms: "의료 & 안전 개혁"
 GER_health_and_safety_reforms_desc: "더 안전한 작업장을 보장하기 위해 보건 및 안전 절차를 개혁하면 더 안전한 작업장을 확보하고 사고를 예방하는 데 도움이 될 것입니다."
 GER_bigger_pharma: "거대한 제약 산업"
 GER_bigger_pharma_desc: "독일은 세계 최상위의 제약 수출국이자 제조국 중 하나입니다. 다른 주요 수출국 일부와 더 나은 연합 및 관계를 구축하면 독일에 더 나은 무역 선택지를 제공하고 앞으로 이들 국가와의 더 나은 거래를 가능하게 할 것입니다."
 GER_more_pfizer_contracts: "화이자에게 더 많은 계약 수주"
 GER_more_pfizer_contracts_desc: "화이자는 세계 최대의 연구 중심 제약 회사입니다. 화이자에 더 많은 보건 의료 계약을 위탁하면 우리 환자들이 제약 산업이 현재 제공할 수 있는 최고 수준의 의사와 의약품으로부터 최상의 치료와 돌봄을 받도록 보장할 것입니다."
 GER_appease_the_workforce: "노동자들과의 타협"
 GER_appease_the_workforce_desc: "노동자는 모든 산업의 근간이며, 이들이 없다면 산업은 아무것도 아닙니다.\n노동자들에게 호소하는 것은 필수이며, 공정한 임금, 연금, 충분한 병가 수당을 보장하면 노동력을 만족시키고 생산을 안정적으로 유지할 것입니다."
 GER_education_investment: "교육 투자"
 GER_education_investment_desc: "자녀들에게 충분한 교육을 제공하는 것은 성공적이고 건강한 정신 발달과 인생의 경력에 필수적이며, 이는 우리가 자녀들에게 거부해서는 안 되는 것입니다."
 GER_construct_more_healthcare_centres: "보건소 증설"
 GER_construct_more_healthcare_centres_desc: "독일의 보건 의료는 나쁘지 않지만 더 나아질 수 있습니다.\n정부가 보건 의료 정책과 재정을 개혁하려 함에 따라, 새로운 보건 의료 센터와 병원의 건설은 꽤 오랫동안 의제에 올라 있었습니다. 이 새로운 시설들은 과밀한 보건 의료 센터의 부담을 덜고 시민들에게 더 나은 서비스를 제공할 것입니다. "
 GER_stiff_competition: "'Stiff Competition'"
 GER_stiff_competition_desc: " §Y그건 총인가, 아니면 나를 만나서 반가운 건가?§!\n\n 뼈는 넘쳐나는데 묻을 곳이 없으니 위기가 우리 곁에 닥쳤습니다! 남성 인구에게 이 새로운 파란 알약을 공급한 것은 분명 시동을 걸어 주었지만, 이제는 멈추지를 못합니다!"
 GER_asian_persuasion: "'아시아를 설득하라'"
 GER_asian_persuasion_desc: "중국은 유럽 밖에서 제약 산업의 가장 큰 경쟁자이므로, 양국 간 교역은 항상 매우 드물고 높은 관세로 통제되어 왔습니다. 양국 간 새로운 무역 협정으로 우리는 보급품, 장비, 의약품을 더 나은 가격에 더 자유롭게 서로 공급할 수 있습니다."
 GER_chinas_policy: "중국의 정책 도입"
 GER_chinas_policy_desc: "중국은 한 자녀 정책을 채택하기 전에 인구가 급속히 증가했습니다. 지금 비슷한 정책을 채택하면 그와 같은 위기가 발생하기 전에 막을 수 있을지도 모릅니다."
 GER_shaking_up_the_system: "의료 시스템 개혁"
 GER_shaking_up_the_system_desc: "보건 의료 체계가 낡았으니, 이제 설계실에서 약간 뒤흔들어 볼 때일지도 모릅니다. 보건 의료 법규와 중점을 개혁하면 체계와 그 직원들이 겪고 있는 압박과 어려움을 다소 덜 수 있을지도 모릅니다."
 GER_more_healthcare_funding: "의료 지원금 확대"
 GER_more_healthcare_funding_desc: "현재 우리의 보건 의료 체계는 자금 부족으로 최상의 상태가 아닙니다. 건강한 국가를 유지하려면 이와 같은 필수 체계에 더 많은 자금을 제공해야 합니다."
 GER_revive_the_german_workshop: "'독일의 장난감 공작소를 부활시켜라'"
 GER_revive_the_german_workshop_desc: "독일은 한때 18~1900년대 유럽의 장난감 가게였습니다. 제2차 세계 대전 이후 독일은 순위에서 추락했고 세계는 그 모습을 지켜보았습니다. 이제 톱니바퀴를 다시 돌리고 우리 산업을 다시 일으켜 세울 때입니다!"
 GER_expand_automobile: "자동차 산업 확장"
 GER_expand_automobile_desc: "독일은 세계 최대의 자동차 수출국으로, 매년 수십억 유로 규모의 차량을 수출합니다. 수출 역량을 더욱 확대하면 가장 가까운 경쟁자와의 격차가 벌어져 더 많은 사업과 더 많은 돈을 확보할 수 있습니다."
 GER_brandenburg_projects: "브란덴부르크 프로젝트"
 GER_brandenburg_projects_desc: "브란덴부르크는 동부의 심장이며 서부에 비해 상당히 저개발 상태입니다. 소련의 괴뢰 통치 아래에서 동독의 브란덴부르크는 필요한 관심과 산업 지원을 받지 못했습니다. 이 새로운 사업들은 브란덴부르크를 서부 지역과 어깨를 나란히 하도록 끌어올리기 위해 새로운 산업 부문을 일으킬 것입니다."
 GER_dresden_projects: "드레스덴 프로젝트"
 GER_dresden_projects_desc: "드레스덴은 독일 동부의 주요 도시로, 기반시설과 산업이 서부에 비해 뒤처져 있습니다. 브란덴부르크와 마찬가지로 드레스덴 역시 분단된 독일의 통치 아래 방치되었습니다. 낡은 산업, 소련식 기반시설, 불안전한 건물이 그것입니다. 이 드레스덴 사업들은 한때 번영했던 드레스덴을 냉전 이전의 옛 아름다움으로 되살릴 것입니다."
 GER_berlin_projects: "베를린 프로젝트"
 GER_berlin_projects_desc: "베를린은 온갖 우여곡절을 겪어 왔습니다. 1945년 해방 이후의 폐허가 된 도시에서 냉전 시기의 분단된 도시에 이르기까지, 베를린은 모든 것을 보았습니다. 서베를린은 상태가 좋지만, 동베를린의 상당 부분은 통일 이전 소련 통치의 결과로 여전히 방치의 흔적을 보여 줍니다. 베를린은 영광스러운 도시였고 지금도 그러하니, 동쪽에 광채를 되찾아 줍시다."
 GER_real_steel: "'진짜 강철'"
 GER_real_steel_desc: "노르트라인베스트팔렌의 뒤스부르크 제철소는 독일에 건설된 가장 첨단이고 효율적인 제철소 중 하나입니다. \n이 새 제철소는 루르 지역의 새로운 채굴 사업에서 캐낸 대량의 철광석을 가공하는 데 도움이 될 것입니다."
 GER_new_docks_port_hamburg: "함부르크 항의 새로운 부두"
 GER_new_docks_port_hamburg_desc: "§YSpecial Conditions:§! Cost will be reduced if §Y[ROOT.GetNameWithFlag]§! has idea §Y$GER_maritime_industry$§!\n\nWith the increased demand for import/export, Germany must answer the call for more shipping capabilities. The construction of 2 new additional dock spaces in the Hamburg port will allow for additional ship manufacturing capabilities."
 GER_enrichment_facilities: "새로운 농축 시설"
 GER_enrichment_facilities_desc: "현재의 원자력 에너지 및 처리 능력에 대한 재편과 투자에 이어, 새로운 농축 시설의 건설은 더 효율적이고 '원자력 구동'인 독일로 가는 다음 단계입니다.\n이 새로운 시설로 우리는 더 농축되고 전력 효율이 높은 연료를 생산할 수 있으며, 장기적으로 더 많은 전력을 얻게 됩니다."
 GER_expand_mainstream_industry: "민간 부문 확장"
 GER_expand_mainstream_industry_desc: "공공 산업 부문의 개혁과 재편을 시작해야 합니다."
 GER_corporate_tax_cut: "법인세 감면"
 GER_corporate_tax_cut_desc: "법인세율을 인하하면 우리 기업들이 겪는 압박이 다소 완화될 것입니다."
 GER_the_divide: "'분단'"
 GER_the_divide_desc: "독일은 한때 분단 국가였습니다. 1990년에 재통일되었지만 국민 사이에는 여전히 뚜렷한 분열이 남아 있습니다. 이제 국민과 산업을 진정으로 통합할 때입니다."
 GER_expand_west: "서부 확장"
 GER_expand_west_desc: "국가 양측을 확장하고 개혁하기 시작하면서, 우리는 서쪽으로 눈을 돌려 국가를 더욱 확장하기 위한 새로운 기반시설과 새로운 사업을 확대하고 건설하기 시작합니다."
 GER_expand_east: "동부 확장"
 GER_expand_east_desc: "냉전 기간 동안 소련은 동독을 방치했습니다. 시간이 멈춘 채, 동독의 일부 지역은 여전히 '철의 장막'의 영향으로 뚜렷하게 고통받고 있습니다. 이제 동부와 서부 주 사이의 격차를 줄일 때입니다."
 GER_revive_the_rhine: "라인란트 산업의 부활"
 GER_revive_the_rhine_desc: "라인란트는 언제나 독일 산업과 경제의 주요 지역이었습니다. 라인란트 산업은 제2차 세계 대전 당시만큼 크지 않으니, 이제 다시 끌어올릴 때입니다."
 GER_bringing_germany_closer_together: "진정한 통일"
 GER_bringing_germany_closer_together_desc: "최근 우리의 부단한 노력으로 동부와 서부가 마침내 하나가 되었으며, 이제 독일은 정신적으로도, 산업적으로도, 마침내 진정한 통일을 이룩하였습니다."
 GER_contract_duetche_bahn: "Contract Deutsche Bahn"
 GER_contract_duetche_bahn_desc: "도이치 반에 계약을 발주하면 독일 전역과 이웃 유럽 국가로 이어지는 철도망을 건설하고 더욱 확장할 수 있습니다."
 GER_the_glorious_past: "영광의 과거"
 GER_the_glorious_past_desc: "독일 제국은 한때 전 세계에서 번영하는 강대국이었습니다. 80년 넘게 먼지가 쌓인 채 잠들어 있었으나, 오늘이야말로 신성 독일 제국이 다시 태어나는 날입니다!"
 GER_coronation: "대관식"
 GER_coronation_desc: "80년 넘게 군주제가 없었던 독일이 마침내 새로운 카이저에게 왕관을 씌웁니다!"
 GER_a_new_constitution: "신헌법"
 GER_a_new_constitution_desc: "새로운 헌법이 작성되어야 합니다. 그것은 군주제, 왕실의 새로운 추가 사항, 그리고 왕실의 권한과 예외를 포함하는 헌법입니다. 이는 우리의 새로운 정부 형태의 기초를 이루는 법적 토대가 될 것입니다."
 GER_bundeswehr_reforms: "연방방위군 개혁"
 GER_bundeswehr_reforms_desc: "연방방위군은 현재의 모습으로는 카이저라이히를 섬길 상태가 아니며, 무언가 조치가 필요합니다! 우리만큼 영광스러운 제국을 섬기려면 개혁이 절실합니다!"
 GER_hard_militarism: "강경한 군국주의"
 GER_hard_militarism_desc: "위대한 제국에는 위대한 군대가 필요합니다. 우리 군의 현재 상태로는 위대한 조국을 방어하기에 턱없이 부족합니다. 제국군을 과거의 영광스러운 위용으로 재건하려면 군국주의에 대한 우리의 접근 방식에 극적인 전환이 필요합니다."
 GER_all_will_serve: "최후의 한명까지"
 GER_all_will_serve_desc: "제국이 강해지려면 강한 군대가 필요합니다. 독일 제국은 군대를 포함하여 밑바닥부터 재건되어야 합니다.\n군 복무 연령의 모든 남성은 제국군에서 복무하게 될 것입니다!"
 GER_gardekorp: "근위군단 (Gardekorp)의 복원"
 GER_gardekorp_desc: "독일 제국의 부활에 따라 우리는 새로운 제국 근위대가 필요합니다. 가르데코르프는 원래의 근위대였으므로 우리의 뿌리로 돌아가 이 군단을 다시 창설하는 것이 마땅합니다."
 GER_yanke_go_home: "양키는 꺼져라!"
 GER_yanke_go_home_desc: "우리는 콘도그를 먹고, 트윙키를 씹고, 루트 비어를 마시면서 세계의 경찰 노릇을 하려는 양키들에게 진저리가 납니다!\n이제 누군가 나서서 그들에게 집에 돌아가 빚을 갚고 자기 일이나 신경 쓰라고 말해 줄 때입니다!"
 GER_revenge_for_versailles: "베르사유 조약 파기"
 GER_revenge_for_versailles_desc: "독일 제국은 1918년 카이저가 조국의 무조건 항복에 서명했을 때 무릎을 꿇었으며, 그는 우리를 바보처럼 보이게 만들었습니다. 국민은 카이저의 배신 때문에 잊을 수 없는 대가를 치렀습니다. 80년이 넘도록 우리는 개 취급을 받아 왔고, 1년도 더 그런 취급을 받지 않을 것입니다!"
 GER_ignore_final_settlement: "2 + 4 조약 무시"
 GER_ignore_final_settlement_desc: "최종 정착 협정(Final Settlement Agreement)은 조국의 배신자들이 독일 국민이 아닌 자신들을 위해 동의한 연합국의 또 다른 어릿광대 같은 요구였습니다! 조국은 이 우스꽝스러운 조약과 협정의 족쇄와 사슬에 너무 오래 묶여 있었으며, 이제 독일 국민이 자신의 권리와 조국을 위해 일어서서 이 독재적인 요구를 몰아낼 때입니다!"
 GER_bully_of_europe: "유럽의 왕따"
 GER_bully_of_europe_desc: "우리는 너무 오랫동안 피해자였고 마침내 폭발했습니다! 우리는 더 이상 짓밟히지 않을 것입니다. 이제 마침내 일어나 압제자들에게 우리가 개똥 취급을 당하지 않을 것임을 보여 줄 때입니다! 이 광대들에게 진짜 조커가 누구인지 보여 줄 때가 되었습니다..."
 GER_crusade_against_democracy: "민주주의를 향한 십자군 원정"
 GER_crusade_against_democracy_desc: "민주주의는 세계의 역병입니다. 민주주의에는 민주적인 것이 하나도 없습니다. 민주주의는 서방이 꼭두각시 조종 도구로 만들어 낸 잘못된 이념적 감각이며, 양의 탈을 쓴 늑대에 불과합니다."
 GER_resurrect_labor: "노동의 부활"
 GER_resurrect_labor_desc: "제국은 노동자 없이는 아무것도 아닙니다. 노동자가 없으면 상품이 없고, 상품이 없으면 수입이 없고, 수입이 없으면 제국이 없습니다! 우리는 노동 문화의 재건을 무엇보다 우선해야 합니다. 산업적이고 생산적인 시민이 이상적인 시민입니다!"
 GER_extended_work_quotas: "노력에는 그만한 대가를"
 GER_extended_work_quotas_desc: "상품에 대한 수요 증가로 우리는 몇 가지 희생을 감수해야 하며, 그중 하나가 여가 시간입니다. 도이칠란트는 새로운 시대로 나아가는 지금 그 어느 때보다 노동자들을 필요로 합니다."
 GER_women_in_munitions: "군수품 공장의 여성들"
 GER_women_in_munitions_desc: "우리가 여러분에게 참정권을 주었으니, 이제 부탁이 있습니다!\n\n여성들이 확장하는 제국을 위해 군수품과 무기 생산을 돕는 공장으로 돌아오고 있습니다. 참정권 운동가들에게 쓸 시간은 없으니 다시 일터로 돌아가십시오!"
 GER_the_bundestag_address: "연방 의회 (Bundestag) 선언"
 GER_the_bundestag_address_desc: "새롭게 재임명된 직함과 1918년 이후 독일 군주제의 진정한 복귀와 함께, 우리는 카이저와 왕가의 진정한 위력을 찬양하는 TV 생중계 대국민 연설로 연방의회 정치의 날을 시작합니다."
 GER_war_reparations: "전쟁 배상 요구"
 GER_war_reparations_desc: "우리는 제1차 및 제2차 세계 대전 중 적국에 끼친 피해에 대한 전쟁 배상금을 강제로 지불해야 했지만, 우리 돈은 어디에 있었습니까? 전쟁은 전쟁이고, 피해는 발생하기 마련입니다. 오늘 우리는 이러한 재정적 요구를 부과한 이들에게 그대로 되돌려, 그들이 우리에게 배상금을 지불하기를 바랍니다."
 GER_european_bully: "독일 정체성의 수호자"
 GER_european_bully_desc: "EU와 세계 나머지 국가들이 우리의 정체성에 영향을 미친 결과, 우리는 진정한 독일의 정체성을 서서히 잃어 가고 있습니다. 우리는 진정한 유산과 진정한 독일이 무엇인지를 지키기 위해 일어설 것입니다!"
 GER_european_mentor: "유럽의 멘토"
 GER_european_mentor_desc: "유럽에서 가장 영향력이 큰 단일 국가로서, 우리는 이웃 국가들과 우리 영향권 내 국가들의 대륙 멘토입니다."
 GER_germans_in_switzerland: "스위스의 독일인"
 GER_germans_in_switzerland_desc: "독일 국민은 스위스 일반 인구의 상당 부분을 차지합니다. 스위스에 대한 우리의 큰 영향력으로, 우리는 독일계 스위스 시민들에게 제국이 통치하는 스위스가 최선일 것이라고 설득할 수 있습니다!"
 GER_squash_bugs: "날파리를 짓눌러라"
 GER_squash_bugs_desc: "리히텐슈타인과 룩셈부르크는 중부 유럽의 벌레입니다. 그들은 세금을 회피하고 땅을 차지하는 것 말고는 아무것도 하지 않습니다. 제국은 이들이 독일 제국에 통합되는 편이 더 낫다고 결정했습니다."
 GER_germans_in_austrich: "오스트리아의 독일인"
 GER_germans_in_austrich_desc: "솔직히 말해 오스트리아는 진정한 독일 국가입니다. 1938년 안슐루스 이후 우리는 그것을 손에 쥐고 있었습니다. 이제 우리의 정당한 영유권을 되찾을 때일지도 모릅니다!"
 GER_germans_in_belg: "벨기에의 독일인"
 GER_germans_in_belg_desc: "벨기에는 독일의 어리석은 막냇동생이라고 할 수 있습니다. 그들은 우리 국기를 옆으로 돌리고 색상을 재배열하면 무사히 넘어갈 수 있다고 정말로 생각했습니다! 이 초콜릿 만드는 불량배들에게 진짜 형님이 누구인지 보여 줍시다!"
 GER_restore_italian_crown: "이탈리아의 왕정을 복원하라"
 GER_restore_italian_crown_desc: "독일과 이탈리아의 우정은 아주 오래전으로 거슬러 올라갑니다. 우리는 제2차 세계 대전 중에 정말 좋은 친구였습니다. 현대에는 우리의 우정이 예전만큼 굳건하지 않은데, 특히 정치적 성향이 서로 다르기 때문입니다. 아마 우리가 군주제에 대해 서로 같은 눈높이로 본다면 우정이 굳건해질 것입니다."
 GER_anti_nato: "Anti-NATO"
 GER_anti_nato_desc: "NATO는 유럽의 가짜 경찰입니다. 그들은 높은 말 위에 올라타 자신들이 모두 정의롭고 국가의 수호자인 척하며, 자신들과 길이 엇갈리는 누구에게나 감히 제재를 부과합니다.\n우리는 이러한 괴롭힘 행위를 용납하지 않을 것입니다!"
 GER_restore_ottoman_sultan: "오스만 술탄의 복원"
 GER_restore_ottoman_sultan_desc: "오스만 제국은 한때 그 시대의 위대한 동맹이었습니다. 오늘날의 튀르키예는 민주주의에 시달리고 있으니, 새로운 오스만 제국이 우리의 필요에 더 부합할 것입니다."
 GER_the_imperial_bloc: "제국주의의 연합"
 GER_the_imperial_bloc_desc: "훌륭한 이웃에게서 훌륭한 동맹이 나옵니다. 옛 친구들과 새로이 맺은 우정은 방어 세력을 요구합니다."
 GER_restore_the_empire: "'독일 제국'"
 GER_restore_the_empire_desc: "세계에 대한 우리의 장악력이 자리를 잡아 가는 지금, 복원된 영광스러운 제국에 마지막 손질을 가할 때입니다."
 GER_the_alternative: "공화당"
 GER_the_alternative_desc: "많은 이들이 알다시피 독일은 사회의 나머지와 다른 길을 택하는 것으로 잘 알려져 있으며, 특히 그것이 논란이 될 때 그렇습니다. 우리 당은 논란과 낯설지 않습니다. 이민자 유입 반대에서 EU 반대에 이르기까지 말입니다."
 GER_volk: "‘국민’"
 GER_volk_desc: "우리 당은 독일 국민에게 봉사하는 정당이며, 독일 국민에게 더 낫고 대안적인 삶을 제공한다는 가치를 지킵니다. 실업률과 노숙자 수준을 줄이기 위해, 고용주가 각계각층의 보다 다양한 사람들을 채용하도록 보장하는 새로운 정책이 통과되었습니다."
 GER_vaterland: "‘조국’"
 GER_vaterland_desc: " 조국과 독일의 정체성은 위협이 무엇이든 어떠한 대가를 치르더라도 반드시 지켜야 하는 국가의 보물입니다. 역사 속에서 독일의 정체성이 거의 사라질 뻔한 때가 너무 많았습니다. 우리 당은 이것이 결코 사라지지 않도록, 그리고 외국의 영향과 침략자로부터 보호되도록 정책을 통과시키고 있습니다."
 GER_against_islamism: "이슬람과 대적하라"
 GER_against_islamism_desc: "이슬람은 독일에서 인기가 높아지고 있음에도 독일의 국교가 아닙니다. 이것은 독일인으로서의 우리 민족 정체성에 대한 공격이며, 우리는 이를 막아야 합니다."
 GER_restrictions_on_practice: "전통의 제한"
 GER_restrictions_on_practice_desc: "우리는 우리의 유산과 생활 방식을 파괴하러 오는 이 외국 침략자들을 막아야 합니다.\n공개적인 종교 행위를 중단시키고, 추가적인 모스크의 건설을 중단시키며, ADD를 금지해야 합니다!"
 GER_law_and_order: "법과 질서"
 GER_law_and_order_desc: "돼지 같은 놈들과 외국 이방인들로부터 우리를 지키기 위해, 치안 서비스가 앞길을 가로막는 무엇이든 처리할 장비와 준비를 갖추도록 안보 예산을 늘려야 합니다."
 GER_against_immigration: "이민 반대"
 GER_against_immigration_desc: "우리는 이민자 위기의 한가운데에 있으며, 우리 자신을 먼저 돌볼 생각을 하기도 전에 너무 많이 받아들였습니다! 더 이상 이민자는 독일에 받아들여지지 않을 것이며, 불법으로 입국하다 적발되는 이는 누구든 처벌받을 것입니다!"
 GER_call_back_germans: "독일인들을 불러 모아라"
 GER_call_back_germans_desc: "많은 독일 시민들이 이제 스위스와 오스트리아에 거주하고 있습니다. 우리는 그들 동포들이 조국으로 돌아오기를 원합니다! 오늘 우리는 이 지역에 거주하는 모든 독일 시민들이 자신들의 정당한 고향으로 돌아오도록 요청했습니다."
 GER_german_heritage: "독일의 문화유산"
 GER_german_heritage_desc: "독일에는 오랜 역사와 자랑스러운 유산이 있으며 우리는 이를 자랑스럽게 여깁니다. 독일 국민이 자랑스러워할 만한 것이 종교, 산업, 역사에 많이 있으며, 이는 마땅히 가르쳐야 할 것입니다."
 GER_question_european_union: "유럽 연합에 대한 의문"
 GER_question_european_union_desc: "유럽 연합은 우리 정치와 일상생활에 큰 영향을 미칩니다. 우리가 자국을 어떻게, 무엇을 할지를 외부 위원회가 결정하게 놔두어도 정말 괜찮겠습니까?"
 GER_question_circumsicion: "할례에 대한 의문"
 GER_question_circumsicion_desc: " §Y이봐, 이봐, 그거 돌려줘! 그건 내 거야!§!"
 GER_restrictions_same_sex: "동성 결혼 제한"
 GER_restrictions_same_sex_desc: " 출구 문으로 들어가지는 않으시겠죠? \n\n성 정체성의 문제는 독일에서 오래전부터 있어 왔습니다. LGBT 집단이 말 그대로 위협이 되지는 않지만, 동성 결혼에 대한 제한은 가족의 가치를 보존하는 데 도움이 되기를 바랍니다."
 GER_combat_leftism: "좌파와 싸워라"
 GER_combat_leftism_desc: "좌파는 용납할 대상이 아닙니다! 그 공산주의자와 사회민주주의자라는 역병들... 으웩. 사회주의라는 말만으로도 점잖고 올곧은 시민이라면 누구나 구역질이 납니다. 좌파 지지자들은 끌어내려야 합니다."
 GER_question_the_climate: "기후 문제에 대한 의문"
 GER_question_the_climate_desc: "정말로 몇몇 공장과 자동차가 오존층을 얇아지게 만든다고 믿어야 합니까? 의심스럽습니다. \n기후 변화는 자유주의 원숭이들이 얼마나 많은 선전을 우리에게 믿게 만들 수 있는지 보려는 사회 실험입니다."
 GER_cease_bioenergy_funding: "바이오 에너지 지원금 중지"
 GER_cease_bioenergy_funding_desc: "우리는 실재하지도 않는 기후 위기에 맞서기 위해 지속 가능하고 재생 가능한 에너지원에 수십억 유로를 쏟아붓고 있습니다! 우리는 이 말도 안 되는 지출을 중단하고, 그 돈을 실제로 필요한 곳에 돌려놓겠습니다."
 GER_expand_youth_wing: "청년단 확장"
 GER_expand_youth_wing_desc: "청년 조직의 확대는 당에 훌륭한 조치입니다. 청소년에게 일찍부터 정보를 심어 주면 어린 나이부터 그들을 우리의 영향 아래 둘 수 있으며, 그들이 나이를 먹어도 우리의 장악력은 굳건히 유지될 것입니다."
 GER_civil_unions: "합법적 동성 결혼"
 GER_civil_unions_desc: "With same sex marriages being banned in the state, the government has opted for a new alternative work-around in an attempt to settle some of the unrest from the LGBT community. Civil unions grant LGBT couples some of the privileges that married couples receive but are not classed as married legally."
 GER_maintain_us_relations: "미국과의 관계 유지"
 GER_maintain_us_relations_desc: "독일과 미국은 지난 세월 동안 항상 의견이 일치하지는 않았지만, 현대에는 관계가 크게 개선되었으며 계속 개선해 나간다면 우리에게 큰 이익이 될 것입니다."
 GER_expand_russian_ties: "러시아와의 유대 확장"
 GER_expand_russian_ties_desc: "독일과 러시아는 한때 큰 적이었으나 지금은 매우 긴밀히 협력하고 있습니다. 러시아와의 유대를 확대하면 우리의 정치 및 경제 부문에 큰 이익이 될 것입니다."
 GER_conscription_increase: "징병 확대"
 GER_conscription_increase_desc: "조국을 적으로부터 지키려면 복무 인원 규모를 늘리기 위해 징집 기준을 확대해야 합니다."
 GER_green_alliance: "푸른 동맹"
 GER_green_alliance_desc: "녹색당은 꽃 공산주의자와 같습니다. 그들은 원자력 에너지의 폐지에 찬성하고 LGBT 권리를 지지합니다. 그들은 매우 확고하고 직설적인 정당이지만, 현대에 어떻게 살아남을 수 있을까요?"
 GER_eastward_expansion_nato: "Expand NATO's reach"
 GER_eastward_expansion_nato_desc: "NATO를 동쪽으로 확장하는 것은 우리 동맹을 보호하기 위한 다음 단계입니다. 동구권과 중국은 주시해야 할 대상이며, 이들의 군사력 규모와 핵 프로그램은 NATO 안보에 우려가 됩니다."
 GER_progressive_taxation: "누진세"
 GER_progressive_taxation_desc: "세금은 모든 경제의 필수적인 부분이며 독일도 예외가 아닙니다. 우리 금융 체계를 악용하는 이들에게 세금을 인상하여 우리나라 경제가 직면한 손실을 만회해야 합니다."
 GER_sustainable_development: "지속 가능한 개발"
 GER_sustainable_development_desc: "녹색당은 우리나라의 지속 가능한 삶과 발전에 헌신합니다. 탄소 배출 목표를 달성하고 탄소 발자국을 줄이는 것은 필수입니다!\n이 국가 정신은 §Y녹색당§!이 집권하거나 연립에 속해 있지 않으면 §R제거§!됩니다!"
 GER_a_hand_to_japan: "일본과 함께"
 GER_a_hand_to_japan_desc: " 한번 친구는 영원한 친구 \n\n우리는 일본에 새로운 방위 조약을 맺자고 제안하며 손을 내밉니다."
 GER_distance_from_china: "중국과 거리를"
 GER_distance_from_china_desc: "세계는 중국산 상품에 크게 의존하고 있으며 우리도 마찬가지입니다. 중국산 상품에서 벗어나는 것을 고려하고 보다 자급자족하는 국가가 되기 시작해야 합니다."
 GER_support_for_ev: "전기 동력 지원"
 GER_support_for_ev_desc: "녹색당으로서 우리는 독일이 내연기관 국가에서 전기차 국가로 전환하는 것을 전적으로 지지합니다. 이는 친환경 미래를 향한 거대한 디딤돌이 될 것입니다."
 GER_halt_nuclear_expansion: "핵 확장 중단"
 GER_halt_nuclear_expansion_desc: "사람들이 원자력 에너지를 아무리 깨끗하다고 포장해도, 사실 석탄과 석유 발전소보다 덜 지속 가능합니다. 핵폐기물은 처리하기가 너무 어렵고 체르노빌 사고의 과거도 있으니, 모든 것을 완전히 중단하는 것이 최선입니다."
 GER_eu_green_deal: "유럽연합 녹색 협약 (Green Deal)"
 GER_eu_green_deal_desc: "우리는 EU와 지속 가능성 접근 방식을 계속하고 앞으로 몇 년에 걸쳐 탄소 발자국을 계속 줄여 향후 수십 년 안에 탄소 중립 국가가 되기를 희망한다는 협약을 맺었습니다."
 GER_cancel_russian_deals: "러시아와의 거래 취소"
 GER_cancel_russian_deals_desc: "러시아인들은 지속 가능한 방식으로 잘 알려져 있지 않으며, 이는 우리가 진정으로 지향하는 바가 아닙니다. 독일은 스스로와 미래의 협상을 개선하기 위해 지속 불가능한 국가들로부터 멀어지고 있습니다."
 GER_tighter_regulations: "강경한 규제"
 GER_tighter_regulations_desc: "녹색당은 노동자의 권리와 규정에 관한 더 많은 법률과 규제를 통과시켰습니다. 이 새로운 규제는 노동자에게 작업장에서 더 나은 보호를 제공하고 노동자의 안전과 권리를 전반적으로 높입니다."
 GER_a_better_minimum_wage: "최저임금 인상"
 GER_a_better_minimum_wage_desc: "최저 임금을 인상하면 노동자들에게 시간당 몇 유로가 더 주어지며, 이는 그들의 지갑뿐 아니라 직장에서의 사기에도 큰 차이를 만들 것입니다."
 GER_rent_regulations: "임대 규제"
 GER_rent_regulations_desc: "임대료 규제가 유지되고 보장되도록 하면, 집주인들이 가장 도움이 필요한 이들, 특히 고산업 지역의 노동자들을 이용하는 것을 막을 수 있습니다."
 GER_the_peoples_germany: "독일인"
 GER_the_peoples_germany_desc: "독일 시민들은 우리의 지도력 내내 온전하고 한결같은 지지를 보내 주었으며, 이에 깊이 감사드립니다. 이제 자유, 삶의 질, 훌륭한 통치의 형태로 그 사랑에 보답할 때입니다."
 GER_partial_retirement_benefits: "일부분의 퇴직 혜택"
 GER_partial_retirement_benefits_desc: "우리의 노년층은 평생 우리 모두를 위해 열심히 일했으며, 이제 더 나은 도이칠란트를 건설하기 위한 그들의 헌신에 보답할 때입니다."
 GER_sanctuary_for_lgbt: "성소수자를 위한 성역"
 GER_sanctuary_for_lgbt_desc: "  §RPRONOUNS,§!  §YPRONOUNS!§!  §YGET§!  §GYOUR§!  §YPRONOUNS§!  §YHERE!§! \n\n우리 국민의 정체성은 우리의 관심사가 아닙니다. 오히려 우리는 모든 성별과 성적 지향을 포용하고 전적으로 지지해야 합니다!"
 GER_equal_work_equal_pay: "동일 노동, 동일 임금"
 GER_equal_work_equal_pay_desc: "같은 일을 하는 노동자에게 동일한 임금을 지급하는 것은 모든 계층이나 집단 사이에 임금 격차가 없도록 보장하고 직장 내 사기를 높일 필수 정책이며, 시민들이 우리의 통치를 더욱 자애롭게 인식하도록 만들 것입니다."
 GER_FDP: "자유민주당 (FDP)"
 GER_FDP_desc: "자유민주당은 독일의 자유주의 독수리들입니다. 완전한 자유 시장과 모든 서비스의 민영화를 추진하며, 경제적 자유주의가 독일에 돌아왔고 영원히 돌아왔습니다!"
 GER_a_stronger_military: "A Stronger Military"
 GER_a_stronger_military_desc: "연방방위군은 우리나라(그리고 유럽 일부)의 방위의 주요 토대이지만, 최근 몇 년간 심하게 방치되어 왔습니다. 이제 우리의 전우들에게 §G자유 자금(TM)§!을 더 지급할 때입니다!!"
 GER_free_market_principles: "자유 시장 원칙"
 GER_free_market_principles_desc: "자유 국가로서 우리는 자유 시장 경제도 운영해야 합니다. 개입주의적이고 공산주의식인 시장은 각각 탐욕스러운 자와 약한 자를 위한 것입니다."
 GER_social_welfare_reform: "고소득자의 세금 인하"
 GER_social_welfare_reform_desc: "부유하고 유명한 독일 국민들은 누진 과세 제도가 생긴 이래 무거운 세금의 피해자였습니다. 인생에서 성공한 사람들을 왜 벌해야 합니까? 결국 그들도 다른 모든 사람처럼 노력해서 얻은 것입니다."
 GER_nato_commitment: "NATO Commitment"
 GER_nato_commitment_desc: "NATO는 1949년 창설 이래 악으로부터 세계를 지키는 수호자였습니다. 그 어느 때보다 더 단호한 입장을 취하고 우리나라를 NATO에 헌신시키는 것이 필수적입니다. \n결국, 우리의 역사를 고려하면 애초에 가입해 있는 것만으로도 운이 좋은 일입니다..."
 GER_privatization_of_defense: "방산 업계 민영화"
 GER_privatization_of_defense_desc: "우리 군은 강하지만 민영화한다면 더 강해질 수 있습니다. 여러 기업이 장비와 기술의 제작을 놓고 경쟁하는 미군과 비슷한 방식을 따르는 것입니다."
 GER_workfare_programs: "근로 복지 제도 (Workfare)"
 GER_workfare_programs_desc: "우리의 근로 연계 복지 프로그램은 실업자들이 급여와 혜택을 받는 대가로 일하도록 장려하여, 돈과 혜택을 주는 대신 실업자를 활용하게 됩니다."
 GER_need_based_assistance: "필요한 곳에만 지원을"
 GER_need_based_assistance_desc: "우리는 돈이 정말로 필요하지 않다고 판단되는 이들에게 불필요한 돈을 너무 많이 쓰고 있습니다. 따라서 복지 혜택을 줄이고 자격 요건과 제한을 더 엄격하게 하여, 지원이 정말 필요한 이들에게만 닿도록 하겠습니다."
 GER_modernization_initiative: "현대화 계획"
 GER_modernization_initiative_desc: "현재 기술적으로 앞서 있다 하더라도 우리 군은 추가적인 현대화가 필요합니다. 지원 프로그램을 업그레이드하면 때가 왔을 때 큰 도움이 될 것입니다."
 GER_cybersecurity: "사이버 보안 증대"
 GER_cybersecurity_desc: " §R중국 봇이 공격할 때, 누가 우리의 국가 정보를 지킬까요?§! \n독일은 강대국이며 강대국이라면 강력한 사이버 보안 방화벽을 갖추어야 합니다.\nNordVPN(R)의 최신 버전으로 업그레이드하면 해결될 것입니다. 그렇죠?"
 GER_on_the_job_training: "노동 경험"
 GER_on_the_job_training_desc: "실무 중에 직업을 실용적인 방법으로 배우는 것이 교실에서 전통적인 방식으로 배우는 것보다 청소년을 가르치는 훨씬 효과적인 방법임이 밝혀졌습니다. 우리 아이들은 이러한 학습 방식의 혜택을 볼 것이므로 이를 받아들여야 합니다!"
 GER_e_government: "온라인 정부"
 GER_e_government_desc: "현대에는 현대적인 기법이 따릅니다. 정부 업무를 더 온라인 중심의 플랫폼으로 옮기면 사회가 더욱 발전하고 진보함에 따라 우리가 미래로 나아가는 데 도움이 될 것입니다."
 GER_cyber_workforce: "사이버 인력"
 GER_cyber_workforce_desc: "인공지능과 사이버 역량의 힘을 활용하는 것은 노동자들의 부담을 일부 덜고 산업 생산 방식의 속도를 높이는 훌륭한 방법입니다."
 GER_digital_democracy: "디지털 민주주의"
 GER_digital_democracy_desc: "정부와 시민에게 더 접근하기 쉬운 디지털 정부 및 시민 서비스를 제공하면 우리의 통치 체계가 크게 개선될 것입니다. 필요한 모든 정보를 갖춘 디지털 정부가 만들어질 것입니다."
 GER_points_based_immigration: "이민 점수제 (Points-Based Immigration)"
 GER_points_based_immigration_desc: "오스트레일리아와 비슷한 점수제 이민 제도가 독일에 채택될 것입니다. 이를 통해 독일에서 생활하고 일하도록 허용하는 사람을 더 엄격히 관리하여, 어떤 기술 직종을 받아들이고 어느 수준의 교육을 받은 사람을 시민으로 허용할지 더 잘 조정할 수 있습니다."
 GER_support_lgbt: "성소수자 지원"
 GER_support_lgbt_desc: "우리는 LGBT 공동체에 대해 보다 자유주의적인 정책을 추구할 것입니다."
 GER_legalization_of_cannabis: "Legalize Cannabis"
 GER_legalization_of_cannabis_desc: " §G걱정 마, 친구! 행복하라고!§! \n\n오락용 대마초의 합법화가 드디어 왔습니다. 간식이랑 시가나 좀 챙기십시오, 4시 20분이니까요!"
 GER_the_left: "좌파"
 GER_the_left_desc: "디 링케는 한 바퀴 돌아 제자리로 오기 직전까지 갈 수 있는 가장 왼쪽에 있습니다. 그들의 사회민주주의적 견해와 정치 정책 및 가치는 자본주의를 분쇄하고 반파시즘, 반군국주의, 친공산주의를 지향합니다."
 GER_destroy_fascists: "파시시트를 무너트려라"
 GER_destroy_fascists_desc: "파시즘의 방식은 명백히 잘못되었고 시대에 뒤떨어졌습니다. 파시즘에서 좋은 것이 나온 적은 없으며, 우리의 과거가 그 대표적인 예입니다. 이러한 견해를 지지하는 자들을 분쇄해야 합니다."
 GER_the_leftist_platform: "좌파의 지지 대상들"
 GER_the_leftist_platform_desc: "노동자 계급은 어느 나라에서나 인구의 다수를 차지하며, 이 점에서 독일도 다르지 않습니다. 그들과 노동조합을 달래면 우리 당의 인기도를 높이는 데 도움이 될 것입니다."
 GER_against_militarism: "군국주의에 저항"
 GER_against_militarism_desc: "전쟁에서는 고통과 괴로움 말고는 아무것도 나오지 않습니다.\n우리는 전쟁 중도 아니고 직접적인 적도 없는데 군대에 수십억 유로를 쓰고 있습니다. 그 돈을 대신 더 유용한 분야에 투자하는 것은 어떻겠습니까?"
 GER_german_pacifism: "독일 평화주의"
 GER_german_pacifism_desc: "독일은 과거에 충분한 피해를 입혔으며, 더 이상 그러고 싶지 않습니다. 독일 국민이 다른 이들의 전쟁에 끌려 들어가서는 안 됩니다. 오늘을 국가 평화주의의 날로 기념합니다."
 GER_security_with_russia: "러시아와 함께하는 보안"
 GER_security_with_russia_desc: "독일과 러시아는 정치적 우호 관계에서 노르트 스트림에 이르기까지 서로 매우 긴밀한 유대를 맺고 있습니다. 방위 안보를 요청함으로써 유대를 더욱 강화해야 합니다."
 GER_decentralization: "지방분권"
 GER_decentralization_desc: "중앙 정부의 한 사람이 모든 주의 정책을 통제해야 할 이유가 무엇입니까? 연방 주(Bundesländer)에 더 많은 자치의 자유를 허용하는 것이 더 나은 선택이며 지방 의회를 만족시킬 것입니다."
 GER_liner_taxation: "선형 세금 정책 (Linear Taxation)"
 GER_liner_taxation_desc: "우리의 세금 제도는 현재 최상의 상태가 아니며, 모든 사람에게 같은 세율로 과세하고 있습니다. 소득에 따라 누진 세율로 과세하는 새로운 선형 제도가 훨씬 신뢰할 수 있는(그리고 평등한) 구조입니다."
 GER_networth_tax: "순자산 기반 세금 정책"
 GER_networth_tax_desc: "순자산세는 부유층에 과세하는 것을 목적으로 하는 세금 제도입니다. 순자산과 보유한 돈 및 재산의 규모에 따라 매년 과세합니다."
 GER_socialism_in_europe: "유럽의 사회주의"
 GER_socialism_in_europe_desc: "독일 내 우리 당의 인기도가 높아짐에 따라, 여러 다른 나라의 많은 사람들이 우리의 대의를 믿고 따르며 일어서고 있습니다!"
 GER_cut_saudi_ties: "사우디와의 연대를 끊어라"
 GER_cut_saudi_ties_desc: "요즘 사우디아라비아와 독일은 정치적으로나 경제적으로나 잘 맞지 않습니다. 이제 작별을 고하고 더러운 과두 지배층과 결별할 때일지도 모릅니다."
 GER_minimum_wage_increase: "최저임금 인상"
 GER_minimum_wage_increase_desc: "최저 임금을 인상하면 노동자들에게 시간당 몇 유로가 더 주어지며, 이는 그들의 지갑뿐 아니라 직장에서의 사기에도 큰 차이를 만들 것입니다."
 GER_stage_the_union: "세계로 뻗어가는 연맹"
 GER_stage_the_union_desc: "우리는 유럽 전역에 영향력을 확산해야 하며, 우리의 시각과 견해를 세계 나머지에 보여 주어야 합니다. 프랑스가 완벽한 첫 번째 목표입니다!"
 GER_north_korean_visit: "북한 방문"
 GER_north_korean_visit_desc: "우리와 북한은 서로 많은 유사한 견해를 공유합니다. 북한을 방문하여 최고지도자를 만나 우리 우정의 미래를 논의하는 것이 이상적인 분위기 전환책입니다."
 GER_drive_out_american_bases: "미군기지 철수 요구"
 GER_drive_out_american_bases_desc: "양키들은 세계의 전쟁광입니다. 우리는 평화로운 국가이므로 이런 불량배들을 품고 싶지 않습니다.\n이제 이 깡패들을 우리나라에서 몰아낼 때입니다!"
 GER_chinese_cooperation: "중국과 상호 협력"
 GER_chinese_cooperation_desc: "현대의 중국은 세계의 공장이자 지금까지 존재한 모든 사회주의 정부의 자랑입니다.\n독일은 중국과의 유대를 강화하고 중국이 건설한 해군 및 군수 공장을 활용하기 위한 상호 계획에 합의해야 합니다."
 GER_economic_decentralization: "경제적 분권화"
 GER_economic_decentralization_desc: "분권화된 경제 체제는 주들이 어느 정도까지 자체 재정과 세금 제도를 관리할 수 있게 하여 더 많은 자유를 부여할 것입니다."
 GER_drain_our_stockpiles: "비축고를 남김없이 비워라"
 GER_drain_our_stockpiles_desc: "우리는 이 모든 잉여 장비를 쓸 곳이 없습니다. 이웃 나라에 있는 우리 추종자들에게 넘겨주면 그들이 더 잘 활용할 수 있을지도 모릅니다."
 GER_german_franco_union: "독일-프랑스 연합"
 GER_german_franco_union_desc: "독일과 프랑스는 항상 의견이 일치하지는 않았지만, 이제 프랑스와의 새로운 정치적 파트너십으로 오늘은 새로운 연합의 여명을 알립니다!"
 GER_CDU_rises: "기민/기사연합 (CDU/CSU)의 성장"
 GER_CDU_rises_desc: "아, 기독교민주연합입니다. 독일의 자유주의적 보수주의자들이죠. 이들은 연방의회의 중심 포괄 정당이며 독일 제2당입니다."
 GER_relax_conscription: "징병법 완화"
 GER_relax_conscription_desc: "독일 통일 이후 우리는 더 이상 고도의 경계 상태에 있지 않습니다. 이제 인력에 대한 필요가 그렇게 높지 않으므로 징집법을 완화할 수 있습니다."
 GER_nuclear_confusion: "핵 문제"
 GER_nuclear_confusion_desc: "원자력 문제는 독일 국민이 수년간 고민해 온 문제입니다. 추가 건설을 진행할지, 발전소를 폐쇄하고 추가적인 원자력 개발을 중단할지 결정해야 합니다."
 GER_shutdown_plants: "발전소 폐쇄"
 GER_shutdown_plants_desc: "국민과 정부는 우리나라가 원자력에서 벗어나기를 원한다고 결정했습니다. 원자의 힘은 가볍게 여길 수 없는 힘이며 우리는 더 이상 그 길을 걷지 않을 것입니다."
 GER_nuclear_lifeline: "핵은 우리의 생명"
 GER_nuclear_lifeline_desc: "국민과 정부는 원자력 에너지가 나아갈 길이라고 결정했습니다. 원자력은 석탄보다 깨끗합니다. 빛나는 힘이 나아갈 길입니다!"
 GER_sustainable_farming_practices: "지속 가능한 농업 전통"
 GER_sustainable_farming_practices_desc: "농업이 독일에서 매우 큰 산업이자 문화이므로, 유기질 비료, 전기 농기계 등 보다 지속 가능한 방식을 찾아야 합니다."
 GER_animal_welfare: "동물 복지"
 GER_animal_welfare_desc: "독일에서는 모든 동물(당신의 어머니 포함)을 아낍니다.\n동물을 보호하는 것은 국민에게 최선의 이익입니다. CDU 정부는 동물의 삶의 질을 높이기 위해 동물 복지 권리를 개선하는 새로운 법을 통과시켰습니다."
 GER_renewable_support: "재생가능한 지원"
 GER_renewable_support_desc: "재생 에너지는 미래의 동력이며, 일찍부터 발판을 마련하는 것은 좋은 생각이고 우리의 탄소 발자국과 탄소 배출량을 줄일 수 있게 해 줄 것입니다."
 GER_stance_on_migrants: "이민 문제"
 GER_stance_on_migrants_desc: "독일은 이민자와 이민 정책에 대한 견해에 입장을 정해야 합니다. 그들은 선물입니까, 부담입니까? 결과를 기대하십시오!"
 GER_stance_on_marriage: "결혼관에 대한 입장"
 GER_stance_on_marriage_desc: "결혼은 현대 세계에서 가장 자연스러운 일 중 하나이며, 소중히 여기고 보호해야 할 것입니다."
 GER_support_poland: "폴란드 지원"
 GER_support_poland_desc: "폴란드는 이민자, 특히 벨라루스 독재에서 탈출하려는 벨라루스 이민자에 대한 엄격한 국경 정책으로 인해 최근 몇 년간 국가적 화제가 되었습니다.\n오늘 우리는 폴란드와 그 국경 정책을 지지하며, 어쩌면 우리도 그 뒤를 따라야 할지 모릅니다."
 GER_tighten_borders: "국경 통제 강화"
 GER_tighten_borders_desc: "우리나라는 무임승차자를 위한 곳이 아니며, 우리는 성실하고 헌신적인 사람만을 필요로 합니다. 불법 이민자의 유입과 합법적으로 몰래 들어오려는 자들을 막기 위해 국경을 강화해야 하며, 오늘 우리는 이 이민자 전쟁을 끝낼 것입니다!"
 GER_affirmative_action: "적극적 우대조치"
 GER_affirmative_action_desc: "우리는 모든 이를 지지하며, 반대 방향으로 나아가기를 원하는 이들에게도 지지하는 입장을 취합니다. LGBT 공동체는 독일 정부의 전폭적인 지지를 받습니다."
 GER_family_values: "가정의 가치"
 GER_family_values_desc: "가족의 핵심 가치는 남성과 여성에 의한 자녀의 잉태입니다. \n기독교가 다수인 국가로서 우리는 이 핵심 가치를 고수해야 하며, 현대적이고 죄악 된 동성애 내용을 우리 아이들에게 설교해서는 안 됩니다."
 GER_european_ties: "유럽의 결속"
 GER_european_ties_desc: "중부 유럽 국가로서 우리는 이웃 유럽 국가들과의 정치적 우호를 강화해야 합니다. 그렇게 하면 우리 경제와 유럽 동맹이 더욱 굳건해질 뿐입니다."
 GER_european_values: "유럽의 가치"
 GER_european_values_desc: "독일은 제2차 세계 대전 직후 결성된 이래 유럽 공동체의 오랜 일원이며 현 유럽 연합의 창립 국가입니다. 우리는 우리가 함께 만든 가치를 지키는 데 힘을 보탰습니다."
 GER_reaffirm_american_friendship: "미국과의 우호 관계 재확인"
 GER_reaffirm_american_friendship_desc: "미국은 나치 독일의 해방과 서독 수립 이래 독일의 좋은 친구였습니다. 우리는 양키 친구들과의 우정을 소중히 여깁니다."
 GER_german_politics: "독일의 정치"
 GER_german_politics_desc: "독일의 정치 체계는 반전과 복잡한 헌법으로 가득한 깊은 토끼굴입니다. 민주주의의 세계로 뛰어들 준비가 되셨습니까?"
 GER_state_of_bundestag: "연방 의회 (Bundestag)의 유대 강화"
 GER_state_of_bundestag_desc: "연방의회는 독일의 연방 의회이며 국민이 선출합니다. 현재 여러 강력한 정당으로 구성되어 있어 단독 정당 정부를 구성하는 것은 불가능합니다. 우리는 다른 정당들과 동맹을 맺어야 합니다."
 GER_move_up_the_elections: "선거 촉진"
 GER_move_up_the_elections_desc: "기존 연립은 더 이상 독일에 이익이 되는 방식으로 기능할 수 없습니다. 이제 선거를 치를 때입니다."
 GER_ban_the_npd: "독일 국민민주당 (NPD) 금지"
 GER_coalition_linke: "연합: 좌파"
 GER_coalition_linke_desc: "좌익 정당 2개로 구성된 연립을 구성합니다."
 GER_coalition_center: "연합: 중도"
 GER_coalition_center_desc: "중도 정당 2개로 구성된 연립을 구성합니다."
 GER_coalition_recht: "연합: 우파"
 GER_coalition_recht_desc: "우익 정당 2개로 구성된 연립을 구성합니다."
 GER_deregulations: "규제 완화"
 GER_deregulations_desc: "노동 시장을 규제 완화하면 기업에 부과되는 제한이 줄어들어 경제 성장을 촉진하는 데 도움이 될 것으로 믿어집니다. 그러나 이렇게 하면 우리는 정부 스스로 발등을 찍는 셈인데, 새로운 정책의 결과로 세수가 줄어들기 때문입니다."
 GER_health_cuts: "의료 예산 감축"
 GER_health_cuts_desc: "어젠다 2010의 일환으로 우리는 보건 부문 지출을 삭감합니다. 이는 괜찮은 의료 서비스를 받는 국민 사이에서 인기가 없겠지만, 지출의 일부를 경제 개선으로 돌릴 것입니다."
 GER_social_cuts: "복지 예산 감축"
 GER_social_cuts_desc: "어젠다 2010의 일환으로 우리는 복지 지출을 삭감하며 이는 시민들 사이에서 꽤 인기가 없을 것입니다. 그러나 그렇게 하면 수입의 일부를 경제 발전에 돌릴 수 있습니다."
 GER_tax_cuts: "감세"
 GER_tax_cuts_desc: "우리는 기업에 대한 세금을 삭감하여 독일을 기업에 매력적인 곳으로 만들 것입니다. 이는 실업 위기를 해결하고 유럽 이웃 국가들과 경쟁할 수 있게 하는 중대한 걸음이 될 것입니다. 좌파 성향의 동지들이 이해해 주기를 바랍니다."
 GER_economic_growth: "경제 성장"
 GER_economic_growth_desc: "어젠다 2010 정책의 시행 덕분에 우리 경제는 개선되었으며 이제 모든 부문에서 급속한 성장을 경험하고 있습니다."
 GER_hartz_reform: "하르츠 (Hartz) 개혁 1 단계"
 GER_hartz_reform_desc: "우리나라의 증가하는 실업률에 대처하기 위해 연방고용청을 재편하고, 시간제 고용과 자영업을 장려하여 일자리 창출을 늘릴 것입니다."
 GER_hartz_ii: "하르츠 (Hartz) 개혁 2 단계"
 GER_hartz_ii_desc: "하르츠 II는 미니 잡과 미디 잡 같은 새로운 유형의 고용을 창출하는 것을 목표로 했습니다. 이는 지역 단위의 새로운 정부 시설 건설을 비롯한 여러 방법으로 달성되었습니다."
 GER_hartz_iii: "하르츠 (Hartz) 개혁 3 단계"
 GER_hartz_iii_desc: "하르츠 III는 연방 공공 고용 서비스를 재편하고 개혁하려 할 것입니다. 이는 노동조합과 평범한 노동자에게 크게 도움이 될 것입니다."
 GER_psas: "임시 고용 지원 기관 (PSA)"
 GER_psas_desc: "PSA는 일부 실업자에게 단기간 일자리를 제공하기 위한 임시 정부 기관입니다. PSA를 통해 우리는 시민을 고용하면서 비용을 상당히 줄일 수 있습니다."
 GER_shroders_legacy: "슈뢰더의 유산"
 GER_shroders_legacy_desc: "국가 복지보다 경제 자유화와 외국인 투자를 선호하여 실업 위기를 해결하려 한 슈뢰더의 정책 때문에, SPD는 전통적인 좌파 성향 지지층을 희생하는 대신 이전에는 반대편에 있던 중도파와 자유주의자들로부터 인기를 얻었습니다."
 GER_condemn_american_aggro: "미국의 공격성 규탄"
 GER_condemn_american_aggro_desc: "중동에서의 미국의 무력 사용을 무시할 수 없으며, 우리는 결코 이를 지지할 수 없습니다. 따라서 그들의 최근 결정에 대한 우리의 불만을 보여 주기 위해 성명을 발표할 것입니다."
 GER_move_from_nuclear_energy: "핵에너지로부터 변화"
 GER_move_from_nuclear_energy_desc: "원자력 에너지는 위험하며 환경에 위협이 됩니다. 원자로를 해체하고 대체 에너지원을 선호하는 편이 낫습니다... 이를테면 석탄이나... 가스나, 아니면..."
 GER_drift_from_socialism: "좌파로부터 변화"
 GER_drift_from_socialism_desc: "우리는 자유화된 시장을 위해 당의 좌파 성향 입장을 버렸고, 그로 인해 당의 일부 사회주의 지지자들이 불만을 품었습니다."
 GER_renewable_shift: "재생가능성으로 변화"
 GER_renewable_shift_desc: "이제 더 깨끗하고, 더 안전하며, 지속 가능한 에너지원으로 전환할 때입니다."
 GER_companies_are_lazy: "급진주의 좌파 제한"
 GER_companies_are_lazy_desc: "우리가 좌파의 동맹이라 하더라도 그들이 하는 일에는 견제가 필요합니다. 그렇지 않으면 그들은 날뛸 것이고 장기적으로 분명 국가에 해를 끼칠 것입니다."
 GER_friend_of_east: "동쪽의 친구"
 GER_friend_of_east_desc: "우리는 동방의 친구들과 결코 멀어지지 않았으며, 오히려 유대는 이전보다 더욱 강하고 좋아졌습니다. [GER.GetLeader]은(는) 최근 몇 년간 [SOV.GetLeader]와(과) 분명히 친밀해졌고, 우리는 이를 활용해 몇 가지 추가적인... 호의를 얻어낼 수 있습니다.."
 GER_chinese_visit: "중국 방문"
 GER_chinese_visit_desc: "중국은 세계 최대의 경제 대국 중 하나입니다. 중국의 존재를 무시하고 경제 협정을 맺지 않는 것은 비논리적입니다."
 GER_partnership_with_companies: "러시아와 협력"
 GER_partnership_with_companies_desc: " §Y뭐 하는 겁니까, 러시아 의붓오빠?§!\n\n 러시아와 [SOV.GetLeader]은(는) 국제 정치에서 자주 오해받습니다. 그들에게 손을 내밀면 그들이 덜 외로워하도록 도울 수 있고, 현금 팔레트를 우리 총리의 손에 실어 날려 보내고 싶은 마음이 더 들게 할 수 있습니다!"
 GER_the_homeland: "\"조국\""
 GER_the_homeland_desc: "독일은 진정한 게르마니아의 조국이며 NPD는 진정하고 순수한 독일을 지지하는 정당입니다. NPD는 반시온주의, 반이민, 친군국주의, 이슬람 혐오 정책을 자랑합니다. 네오나치 정당에서 더 무엇을 바라겠습니까?"
 GER_pro_party_protests: "정당 지지 시위"
 GER_pro_party_protests_desc: "우리는 대중에게 전염성 있는 영향력을 퍼뜨리는 이 병든 공산주의 정당과 민주주의 정당에 맞서야 합니다.\n우리 당은 일어나 입장을 밝히고 이 졸개들에 맞서 시위해야 합니다. 파시즘이 마을에 돌아왔습니다!"
 GER_pride_in_our_history: "우리 역사에 대한 자부심"
 GER_pride_in_our_history_desc: "독일에는 많은 역사가 있으며, 일부는 좋고 일부는 더욱 좋습니다.\n우리 역사에는 부끄러울 것이 없으며, 제1차 및 제2차 세계 대전도 마찬가지입니다. 우리는 조국을 방어했을 뿐입니다. 독일 역사는 국민에게 깊은 뿌리를 두고 있으며 보편적으로 가르쳐야 합니다."
 GER_german_global_order: "독일 주도 질서 회복"
 GER_german_global_order_desc: "독일은 한때 세계 질서의 지도자로 여겨졌으나, 지금은 한낱 유럽 국가에 불과합니다. 우리는 조국을 과거의 힘과 영광으로 되돌리고, 적을 분쇄하며, 누구도 우리의 길을 가로막지 못하게 해야 합니다!"
 GER_destroy_liberal_capatilist_system: "자본주의 체계 붕괴"
 GER_destroy_liberal_capatilist_system_desc: "자본주의는 서방의 사회 실험입니다. 우리는 이러한 체제를 없애고 다음 세대가 이를 접하거나 익숙해지지 않도록 해야 합니다. 그것은 우리 아이들의 두뇌를 해칠 뿐입니다."
 GER_torment_the_false_state: "정당하지 않은 국가에게는 고통을"
 GER_torment_the_false_state_desc: "이스라엘은 이 세계가 목격한 가장 터무니없는 국가입니다. 유대인들은 팔레스타인의 정당한 땅을 자신들을 위해 식민지로 삼았고 수십 년에 걸쳐 그들을 쫓아냈으니, 우리는 그들의 악마적인 행위와 죄를 규탄해야 합니다!"
 GER_befriend_israel: "이스라엘과 친선"
 GER_befriend_israel_desc: "이스라엘은 우리의 유럽 정복이 실패한 제2차 세계 대전 종전 이후 유대인 대중을 품어 왔습니다.\n역사적인 퓌러는 그들이 여전히 존재한다는 사실에 기뻐하지 않겠지만, 우리는 그들이 이제 우리와 떨어진 자신들의 땅에 있다는 것만으로 만족합니다."
 GER_police_state: "경찰국가"
 GER_police_state_desc: "우리의 안보는 이 자유주의 쥐새끼들의 잠재적 폭동과 봉기로 위협받고 있습니다. 그러한 사태가 발생하지 않도록 경찰력에 더 많은 자금을 쏟아부어야 합니다. 독일은 전체주의 경찰 국가가 될 것입니다!"
 GER_one_party_state: "일당제 국가"
 GER_one_party_state_desc: "한 정당이 모든 것을 해 줄 수 있는데 이 모든 다른 정당들을 두는 것이 무슨 의미가 있습니까! 전체주의 체제는 언제나, 특히 독일에서 나아갈 길입니다. 정치조차도 우리의 길을 가로막지 못할 것입니다!"
 GER_suppress_the_liberal_menace: "자유주의의 위협 억제"
 GER_suppress_the_liberal_menace_desc: "자유주의는 자본주의만큼이나 나쁩니다. 하지만 어느 것도 파시즘만큼 좋지는 않습니다! 이제 헛소리는 집어치우고 이 자유주의 병신들의 위협을 억누르며 누가 진짜 대장인지 보여 줄 때입니다!"
 GER_campaign_against_eu: "유럽연합 반대 운동"
 GER_campaign_against_eu_desc: "감히 스스로를 연합이라 부릅니까!? 흥, 농담 하나 해 드리지요. EU는 광대의 옷을 걸친 가짜 평의회에 불과합니다! 그들은 당신의 돈을 가져가고, 당신의 국민과 정부에 법과 정책을 강요하며, '민주주의'의 이름으로 우리 시민의 존엄을 훼손합니다! 우리는 이를 용납하지 않을 것입니다!"
 GER_blood_and_soil: "피와 대지"
 GER_blood_and_soil_desc: "우리 국민은 온갖 우여곡절을 헤쳐 왔습니다. 전쟁에서 기근에 이르기까지 모든 것을 겪었습니다. 독일 국민은 우리 땅에 피와 땀과 눈물을 쏟았으며, 이 전통과 정신을 이어 가는 것이 마땅합니다."
 GER_social_security: "사회 안전"
 GER_social_security_desc: "우리 국민은 우리의 생활 방식에 해를 끼치려는 자들로부터 사회적, 국내적 안전을 제공해 주기를 우리에게 의지하며, 우리는 이를 어떤 대가를 치르더라도 지켜야 합니다."
 GER_friends_in_right_places: "우리 친구들을 원래의 자리로"
 GER_friends_in_right_places_desc: "파시즘이 다시 부상하는 관점이 되고 있는 곳은 독일만이 아니며, 우리 친구들 중 일부는 이에 대한 지지를 멈춘 적이 없습니다. 독일은 새로운 시작에 있으며, 뜻을 같이하는 이들에게 지지를 보여 주고 받는 것이 마땅합니다."
 GER_self_sufficiency: "자급자족"
 GER_self_sufficiency_desc: "우리나라는 너무 오랫동안 주변에 의존해 왔습니다.\n자급자족과 독립은 어디로 갔습니까?\n우리는 우리 자신의 네트워크와 체계를 재건하고, 다른 사람들에게 의존해야 하는 토끼굴에 빠지는 일을 멈춰야 합니다."
 GER_campaign_against_nato: "Campaign Against NATO"
 GER_campaign_against_nato_desc: "1994년 NATO는 세계와 러시아에 더 이상 동쪽으로 확장하지 않겠다고 약속했지만, 불과 3년 후 폴란드, 헝가리, 체코를 가입하도록 초청했습니다!\nNATO는 거짓 동맹에 불과하며 거짓말하고 침략하는 것밖에 하지 않습니다. 다른 모두가 꼬리를 내리고 앉아 있으니, 그들에 맞서 일어서는 것은 독일이 될 것입니다!"
 GER_proclaim_the_reich: "제국 선언"
 GER_proclaim_the_reich_desc: "오늘 우리는 제4제국이 도래한 날을 기념합니다.\n우리는 다시 한번 적들을 짓밟고 행진할 것이며 승자로서 승리할 것입니다! 독일은 아돌프 히틀러가 한때 시작한 일을 마무리할 것입니다. 독일은 다시 한번 유럽을 지배할 것입니다!"
 GER_return_of_militarism: "독일 민족 통일주의"
 GER_return_of_militarism_desc: "강하고 지배적인 국가에는 강한 군대가 필요합니다. 독일은 너무 오랫동안 발목에 족쇄를 차고 있었으며 이제 그것을 끊고 나올 때입니다! 우리는 군대를 천 명의 위용으로 재건하고 우리의 길을 막는 자들을 분쇄할 것입니다!"
 GER_the_german_race: "게르만 혈통"
 GER_the_german_race_desc: "진정한 게르마니아에는 진정한 독일 국민이 살아야 합니다!\n그 오랜 세월 우리나라에 거주해 온 이 이방인들과 무임승차자들에게 쓸 시간은 없으며, 새로운 독일 민족의 창조가 시작되었습니다."
 GER_youth_wing_militarism: "청년단 군국주의"
 GER_youth_wing_militarism_desc: "청년 조직은 독일에서 언제나 강력한 도구였으며 현대에도 다르지 않습니다. 아이들이 다 자랄 때까지 기다릴 필요 없이 어릴 때부터 시작하게 하면 됩니다.\n독일은 보이 스카우트와 걸 가이드에 쓸 시간이 없으며, 군사 임무를 수행할 수 있는 강한 청년 조직이 필요합니다."
 GER_train_for_global_operations: "국제 작전을 위한 훈련"
 GER_train_for_global_operations_desc: "유능한 지배 세력이 되려면 언제든 어떤 계획에도 대비하여 잘 훈련되고 준비되어 있어야 하는 것이 필수적입니다. 결국, 우리가 국제적 지배를 한 지 꽤 오래되었으니까요."
 GER_wunder_waffen: "기적의 무기"
 GER_wunder_waffen_desc: "독일은 괴물 같은 전차와 철도포에서 V-2 로켓과 UFO에 이르기까지 언제나 경이로운 무기와 기술의 열렬한 팬이었습니다.\n왜 우리는 그것을 멈추었습니까? 무엇이 잘못되었습니까?\n경이로운 무기 프로그램의 재시작은 우리의 미래 성공에 필수적입니다."
 GER_tight_borders: "Tighten Our Borders"
 GER_tight_borders_desc: "사람들은 우리나라를 불법 이민자의 쓰레기 투기장 정도로 취급해 왔습니다. 우리는 이 무임승차하는 돼지들이 우리를 이용하도록 두지 않을 것입니다. 우리나라는 국경 통제를 강화하고 불법 이민자들을 그들이 온 쓰레기 매립지로 돌려보낼 것입니다!"
 GER_expel_the_turks: "튀르크인 추방"
 GER_expel_the_turks_desc: "튀르키예 이민자들은 수십 년간 독일에 있었으며 독일 시민을 이 나라의 소수로 만들 날이 멀지 않았습니다. 이제 케밥 가게를 닫고 이 나라에 진정한 독일의 질서를 되찾을 때입니다!"
 GER_prevent_growth_of_islam: "이슬람 성장 방지"
 GER_prevent_growth_of_islam_desc: "이슬람은 국가들 사이에 폭력과 기도용 깔개 말고는 아무것도 퍼뜨리지 않습니다. 독일은 이 공격적인 종교와 아무 관계도 맺고 싶지 않으며, 국내에서의 추가적인 성장을 확실히 막기 위한 조치를 마련할 것입니다."
 GER_the_new_world_police: "신세계의 경찰"
 GER_the_new_world_police_desc: "그들은 미국인들을 '세계의 경찰'이라 부르지만, 그렇다면 그들은 그 일을 꽤 못하고 있습니다. 우리의 말이 법이 될 것이고 우리가 세계를 우리 입맛대로 빚어낼 것이므로, 우리가 새로운 세계의 경찰로 불리도록 하겠습니다!"
 GER_swiss_incursion: "The Pimple Of Europe"
 GER_swiss_incursion_desc: " §R충분히 세게 짜면 터질 겁니다!§! \n\n스위스인들은 수십 년간 손대지 않은 채로 남겨졌으며, 스스로를 중립 강국이라 칭합니다. 그러나 그것과는 거리가 멉니다. 그들은 한낱 국제 은행이자 탐욕스러운 사업가들의 휴양지일 뿐입니다."
 GER_our_long_lost_glory: "Deutschland Über Allem"
 GER_our_long_lost_glory_desc: " §R거짓말을 크게 하고, 단순하게 하고, 계속 말하라, 그러면 결국 그들은 믿게 될 것이다§!\n\n우리는 국민의 신뢰와 지지를 얻었습니다. 이제 우리는 독일을 옛 영광으로 되돌리고 우리가 시작한 일을 끝낼 것입니다. 전체주의는 승리로 가는 길이며 신께 맹세코 우리는 그것을 이룰 것입니다. 우리가 새로운 제국으로 행진하는 동안 어떤 것도 우리의 길을 가로막지 못할 것입니다.\n새로운 새벽이 막 시작되었습니다. "
 GER_dismantle_russian_aggression: "러시아에 대한 공격성 완화"
 GER_dismantle_russian_aggression_desc: "러시아는 소련 붕괴 이후 민주적 가치를 지키겠다고 약속했지만, 정말 그랬습니까?\n우리는 그들의 세계적 영향력과 영향권에 맞서는 균형이 있도록 해야 합니다."
 GER_belarusian_democracy: "벨라루스인을 구조하라"
 GER_belarusian_democracy_desc: "벨라루스는 국민의 자유를 짓밟아 온 억압적인 정권에 짓눌리고 있습니다. 벨라루스가 진정으로 유럽 최후의 독재 국가임을 보장하고 권위주의적 지도부에 종지부를 찍을 계획을 시작해야 합니다."
 GER_destroy_lukashenko: "[BLR.GetLeader]의 파멸"
 GER_destroy_lukashenko_desc: "[BLR.GetLeader]은(는) 벨라루스 정권의 중심에 있었으며 그들의 억압적 정책의 주된 추진력이었습니다. 단순한 혁명으로는 충분하지 않으며 정권과 그 졸개들의 완전한 파괴가 필요합니다."
 GER_bribe_bsf: "벨라루스군 매수"
 GER_bribe_bsf_desc: "벨라루스군이 세계에서 가장 부패한 군대 중 하나라는 점은 의심의 여지 없이 말할 수 있습니다. 우리는 이를 우리에게 유리하게 활용하여 그들의 상층부에 뒷돈을 슬쩍 쥐여 줄 수 있습니다.."
 GER_promote_civil_disobedience: "민간 불복종 촉진"
 GER_promote_civil_disobedience_desc: "시민 불복종은 벨라루스에서 저항 세력을 만드는 데 핵심이 될 것이며, 우리는 싸움을 돕기 위해 그들에게 일종의 지원을 제공할 수 있습니다.."
 GER_aid_packages: "'원조' 패키지"
 GER_aid_packages_desc: "'원조' 꾸러미로 위장하여 벨라루스의 혁명 세력에 무기를 몰래 들여보내고 저항에 대비해 장비를 갖추도록 도울 수 있습니다."
 GER_europes_last_dicatorship: "Europe's Last Dictator"
 GER_europes_last_dicatorship_desc: "때가 왔습니다. 벨라루스 정권의 종말은 유럽 최후 독재자의 종말을 가져올 것입니다."
 GER_topple_lukashenko: "[BLR.GetLeader] 전복"
 GER_topple_lukashenko_desc: "우리가 들어가 벨라루스에 민주주의를 강제로 퍼뜨릴 수는 없습니다. 그곳 국민이 스스로, 평화적으로 해내야 합니다."
 GER_support_opposition: "민주주의에 저항하는 이들을 지원"
 GER_support_opposition_desc: "벨라루스에는 매우 강력한 민주 정당 전선이 있으며, 정권의 정통성을 무너뜨리기 위해 가능한 한 많이 그들을 지원해야 합니다."
 GER_belarusian_revolution: "벨라루스 혁명"
 GER_belarusian_revolution_desc: "벨라루스 국민이 독재에 맞서 일어나 민주적 체제를 수립할 때가 왔습니다!"
 GER_defense_for_baltic_states: "우리의 발트 이웃을 보호하라"
 GER_defense_for_baltic_states_desc: "우리는 발트 지역의 이웃 국가들과 훌륭한 관계를 맺고 있으며 서로 무역과 좋은 관계를 제공합니다. 견고한 발트 방위를 구성하기 위해 방위 측면에서도 그들과의 유대를 강화해야 합니다."
 GER_estonian_arms: "에스토니아 무기 거래"
 GER_estonian_arms_desc: "에스토니아 정부와 무기 계약을 체결하여 스스로를 지키기에 충분한 무기를 제공하는 것은, 외국의 공격 시 그들이 자기 몫을 감당할 수 있도록 보장하는 핵심 단계입니다."
 GER_latvian_arms: "라트비아 무기 거래"
 GER_latvian_arms_desc: "라트비아 정부와 무기 계약을 체결하여 스스로를 지키기에 충분한 무기를 제공하는 것은, 외국의 공격 시 그들이 자기 몫을 감당할 수 있도록 보장하는 핵심 단계입니다."
 GER_lithuanian_arms: "리투아니아 무기 거래"
 GER_lithuanian_arms_desc: "리투아니아 정부와 무기 계약을 체결하여 스스로를 지키기에 충분한 무기를 제공하는 것은, 외국의 공격 시 그들이 자기 몫을 감당할 수 있도록 보장하는 핵심 단계입니다."
 GER_estonian_base: "에스토니아에 군사 기지 건설"
 GER_estonian_base_desc: "에스토니아 정부는 우리가 자국 내에 독일군 기지를 건설하는 것을 허용했습니다. 이는 지역 내 훌륭한 작전 기지가 되어 양국 간 더 나은 합동 병력 훈련을 가능하게 할 것입니다."
 GER_lithuanian_base: "리투아니아에 군사 기지 건설"
 GER_lithuanian_base_desc: "리투아니아 정부는 우리가 자국 내에 독일군 기지를 건설하는 것을 허용했습니다. 이는 지역 내 훌륭한 작전 기지가 되어 양국 간 더 나은 합동 병력 훈련을 가능하게 할 것입니다."
 GER_ukrainian_assistance: "Ukrainian Assistance"
 GER_ukrainian_assistance_desc: "독일은 우크라이나를 독립 국가이자 주권 국가로 인정했습니다. 독일은 이러한 가치를 지키도록 필요한 지원을 제공할 것입니다."
 GER_support_ukrainian_unity: "우크라이나의 통일 지원"
 GER_support_ukrainian_unity_desc: "독일은 우크라이나의 언론의 자유와 국민이 선출한 자유로운 정부에 대한 권리, 그리고 외세의 영향으로부터의 단결을 지지합니다."
 GER_hearts_over_war: "전쟁 이전의 인도적 접근"
 GER_hearts_over_war_desc: "우리는 우크라이나 국민의 복지와 안녕을 소중히 여깁니다. 독일은 선의의 표시이자 그들 국가에 대한 지지의 표시로 그들에게 투자할 것입니다."
 GER_anti_russian_sentiment: "반러시아 정서"
 GER_anti_russian_sentiment_desc: "러시아는 모든 일에 손을 뻗치고 있습니다.\n이제 누군가 이웃 국가들 사이에서 벌어지는 이 괴사적인 러시아의 영향력을 막아야 할 때입니다. 그들에게는 자신들의 방식을 가질 권리가 있으며 러시아 곰의 꼭두각시가 되어서는 안 됩니다."
 GER_german_institutions: "독일 교육기관"
 GER_german_institutions_desc: "독일은 우크라이나 내에 두 나라의 무역을 효율적으로 하고 함께 번영하도록 도울 기관을 설립하려 합니다."
 GER_state_visit: "우크라이나에 국빈 방문"
 GER_state_visit_desc: "독일 관리들이 양국 간의 정치 현안과 관계를 논의하기 위해 우크라이나를 국빈 방문합니다."
 GER_imperial_bloc_invites: "제국주의의 연합"
 GER_imperial_bloc_invites_desc: "우리에게는 더 많은 이들을 우리의 대의에 초청할 능력이 있지만, 그들이 우리와 같은 정치적 가치를 믿는 경우에만 가능합니다.."
 GER_invite_italy: "[ITA.GetFlag] 이탈리아 초대"
 GER_invite_turkey: "[TUR.GetFlag] 터키 초대"
 GER_invite_france: "[FRA.GetFlag] 프랑스 초대"
 GER_invite_england: "[ENG.GetFlag] 영국 초대"
 GER_cdu_investigation: "기독교민주연합 (CDU)에 대한 감사"
 GER_investigate_send_evidences: "증거 보내기"
 GER_investigate_send_evidences_desc: "우리는 이 CDU의 정치적 혼란을 푸는 데 이미 너무 많은 시간을 낭비했습니다. 검찰총장에게 우리의 자료를 보내고 어떻게 되는지 지켜보십시오."
 GER_investigate_wlk: "발터 키프 (Walther Kiep) 소환 조사"
 GER_investigate_wlk_desc: "발터 라이슬러 키프는 카를하인츠 슈라이버로부터 서한을 받은 정치인 중 한 명입니다. 그러나 키프를 특별하게 만드는 것은 당시 CDU의 재무 담당자였다는 이전 직책이며, 그가 슈라이버와의 수상한 거래에 연루되었을 수 있다는 점입니다. 그는 1990년대에 다른 사건으로 이미 체포된 적이 있지만, 이번 사건에도 연루된 것으로 보입니다."
 GER_investigate_bear_head: "Review Schreiber's Bear Head Project"
 GER_investigate_bear_head_desc: "1987년에서 1997년 사이 슈라이버는 티센과 협력하여 캐나다 노바스코샤주의 베어 헤드라는 전차 공장 건설에 500만 이상을 투자했습니다.\n그러나 1995년 캐나다가 제너럴 모터스에서 전차를 구매하기로 결정하면서 이 사업은 취소되었습니다.\n\n이 거래를 다시 확인해 보면 수상한 점을 찾을 수 있을지도 모릅니다."
 GER_investigate_missing_files: "누락된 파일 찾기"
 GER_investigate_missing_files_desc: "카를하인츠 슈라이버와 관련된 증거를 찾기 시작하자마자, 우리는 그 시기의 많은 문서가 연방 총리실에서 사라졌음을 알게 되었습니다. 우리는 더 많은 단서를 찾고 문서 분실에 책임이 있는 사람들도 밝혀내기 위해 이를 조사해야 합니다."
 GER_investigate_fuchs_tanks: "푹스(Fuch) 기업의 매출 재확인"
 GER_investigate_fuchs_tanks_desc: "여기서 뭔가 앞뒤가 맞지 않으니, 다시 확인해 봐야 할 것입니다."
 GER_joschka_fischer_visits_iran: "이란에 국빈 방문"
 GER_joschka_fischer_visits_iran_desc: "이란과의 관계는 적어도 말하자면 골치 아픕니다. 어쩌면 우리 외무부 장관이자 녹색당 대표인 요슈카 피셔가 이 교착 상태에 변화를 가져올 수 있을 것입니다."
 GER_bundeswehr: "연방방위군"
 GER_bundeswehr_desc: "Here all decisions regarding our armed forces, the Bundeswehr, will be found."
 GER_call_in_generals: "퇴역 장군 복귀"
 GER_call_in_reserve: "예비군 소집"
 GER_declare_v_fall: "방어 태세 (V-Fall) 선언"
 GER_declare_v_fall_desc: "독일이 공격받고 있으며, 살아남기 위해 우리가 가진 모든 것을 동원해야 합니다."
 GER_move_parliament_bonn: "본 (Bonn) 지역으로 국회 이전"
 GER_move_parliament_bonn_desc: "베를린은 우리나라의 수도로 완벽하지만 동쪽의 적들에게 상당히 노출되어 있습니다. 냉전 때처럼 수도를 본으로 되돌리면 의회의 안전을 보장할 수 있습니다."
 GER_new_generals: "참모진 교체"
 GER_new_generals_desc: "우리 장군들은 조만간 연금 수령 연령에 도달하여 더 이상 우리가 쓸 수 없게 될 것입니다. 그러나 새로운 장군 세대가 등장하여 우리 병력을 지휘할 것입니다."
 GER_move_parliament_berlin: "베를린으로 환도"
 GER_move_parliament_berlin_desc: "정부에 대한 즉각적인 위험은 사라졌으며 베를린으로 다시 돌아가도 안전합니다."
 GER_demobilize_reserve: "예비군 동원 해제"
 GER_demobilize_reserve_desc: "우리 병력이 싸웠던 전쟁은 이제 끝났으며, 예비 부대를 동원 해제할 때입니다."
 GER_open_einsatze_tab: "임무 지도 열기"
 VDE_1: "독일 교통 프로젝트 1"
 VDE_2: "독일 교통 프로젝트 2"
 VDE_7: "독일 교통 프로젝트 7"
 VDE_8: "독일 교통 프로젝트 8"
 VDE_8.1: "독일 교통 프로젝트 8.1"
 VDE_8.2: "독일 교통 프로젝트 8.2"
 VDE_8.3: "독일 교통 프로젝트 8.3"
 VDE_9: "독일 교통 프로젝트 9"
 GER_Network_Infrastructure: "The Digital Era"
 Expand_Network_North: "북쪽으로의 확장"
 Expand_Network_South: "남쪽으로의 확장"
 Expand_Network_West: "서쪽으로의 확장"
 Expand_Network_North_east: "북동쪽으로의 확장"
 Expand_Network_east: "동쪽으로의 확장"
 GER_east_vs_west_divide: "동독과 서독의 갈등"
 GER_east_vs_west_divide_desc: "\n£GER_desctext_east_west_divide\n\n\n\n§HEast Germany§! has had a major §Rdistrust§! of the [GER.GetFlag] §HGerman§! government since reunification in the 1990's. This is partially due to neglect, and a sudden spike in §Runemployment§!, and a §Rdecrease§! in living standards. Some §HEast Germans§! have §RPro-Russian§! tendencies, making the region ripe for §Rdissent§! against our government, and the state.\n\nIf §HEast German§! opinion drops below §H40§!, then the §H[anarchist_communism_L]§! will start §Rrising§! in popularity. Additionally, if §HEast German§! opinion falls below §H30§!, there will be varying levels of §Runrest§! and §Rdisorder§! that will directly affect the states' productivity. \n\nIf we complete the focus §H'True Unification'§!, get §H4 Infrastructure§! in §HMecklenburg-Vorpommern, Brandenburg, Sachsen, Sachsen-Anhalt§!, and §HThuringen§!, and §H1000 Productivity§! in each of the states, we will be able to close the §REast vs West divide§!.\n\n§HEast German§! opinion: §Y[?GER_east_opinion]§!"
 GER_end_the_divide: "§P분단의 종결§!"
 GER_divide_open: "동독 복구 계획"
 GER_divide_open_desc: "우리는 동독이 다시 일어서고 나머지 국가와 보조를 맞출 수 있도록 동독 회복 계획을 마련해야 합니다!"
 GER_divide_close: "동독 복구 계획 연기"
 GER_divide_close_desc: "당분간 동독 회복 계획의 추가 진전을 중단하고 다른 중요한 현안에 집중해야 합니다."
 GER_increase_productivity_in_mecklenburg: "Funds for Mecklenburg-Vorpommern"
 GER_increase_productivity_in_mecklenburg_desc: "일정 예산을 배정함으로써 메클렌부르크포어포메른 주민들의 생산성을 높이는 데 도움을 줄 수 있습니다."
 GER_increase_productivity_in_brandenburg: "Funds for Brandenburg"
 GER_increase_productivity_in_brandenburg_desc: "일정 예산을 배정함으로써 브란덴부르크 주민들의 생산성을 높이는 데 도움을 줄 수 있습니다."
 GER_increase_productivity_in_sachsen: "Funds for Sachsen"
 GER_increase_productivity_in_sachsen_desc: "일정 예산을 배정함으로써 작센 주민들의 생산성을 높이는 데 도움을 줄 수 있습니다."
 GER_increase_productivity_in_sachsen_anhalt: "Funds for Sachsen-Anhalt"
 GER_increase_productivity_in_sachsen_anhalt_desc: "일정 예산을 배정함으로써 작센안할트 주민들의 생산성을 높이는 데 도움을 줄 수 있습니다."
 GER_increase_productivity_in_thuringen: "Funds for Thuringen"
 GER_increase_productivity_in_thuringen_desc: "일정 예산을 배정함으로써 튀링겐 주민들의 생산성을 높이는 데 도움을 줄 수 있습니다."
 GER_please_east_germans: "Satisfy East Germans"
 GER_please_east_germans_desc: "동독 주민들은 정부가 자신들을 위해 존재한다는 사실을 알아야 합니다. 따라서 그들이 우리에게 더 호의적인 시선을 갖도록 무엇이든 하겠습니다."
 GER_consult_with_an_advisor: "고문들의 조언 구하기"
 GER_consult_with_an_advisor_desc: "어렵나요? 고문들을 불러 이 상황을 어떻게 헤쳐나갈지 조언을 구해 봅시다."
 germany_divide.69420.t: "Advisor's Tip"
 germany_divide.69420.d: "동독인들의 삶을 개선하는데 어려움이 있으시군요! 걱정 마세요! 이를 위해 필요한 모든 것을 이 보고서로 알려드리겠습니다. 각 주의 생산성을 증가시키기 위해서는, 공장을 더 짓고, 기술을 개선하며, 네트워크 기반시설을 향상시킴과 더불어 안정적인 경제 순환을 유지하여 사람들에게 일자리를 제공해 줄 수 있도록 해야 합니다. 우리는 또한 생산성 값이 10에 도달할 때 까지 자금을 지원해줄 수도 있지만, 이 비용은 생각보다 만만치 않을 것입니다. 한 가지 팁을 더 드리자면, 기반시설은 다다익선입니다. 더 많은 기반시설을 건설할 수록 동독인들은 더욱 행복해 할 것입니다."
 germany_divide.69420.a: "알겠다"
 GER_bavarian_nationalism: "[BAY.GetFlag] 바이에른 민족주의"
 GER_bavarian_nationalism_desc: "Some [BAY.GetFlag] §HBavarians§! have been vying for independence ever since the creation of a unified [GER.GetFlag] German state. Many [BAY.GetFlag] §HBavarians§! accuse the [GER.GetFlag] German government of intruding on their autonomy, and therefore, §Hnationalism§! has risen in the region. [BAY.GetFlag] §HBavaria§! is one of our more important regions as it hosts quite a lot of tourists every year, and it's one of our wealthier areas.\n\n[BAY.GetFlag] §HBavarian nationalism§! will grow only when our economy is weakened. If our economy is in a §Rstagnation, recession§! or a §Rdepression§!, there is a §H40%§! chance that [BAY.GetFlag] §HBavarian nationalism§! will grow by §H1%§! at the end of each week as a result of [BAY.GetFlag] §HBavarian§! anger. If we have §Hfast growth§! or §Heconomic boom§!, [BAY.GetFlag] §HBavarian Nationalism§! will naturally come down.\n\nOnce [BAY.GetFlag] §HBavarian nationalism§! reaches §H100%§!, they will demand independence."
 GER_establish_ruling_party: "집권당 형성"
 GER_establish_ruling_party_desc: "[BAY.GetFlag] [BAY.GetName](이)가 해방되었을 때 혼란에 빠지지 않도록 집권당을 수립해야 합니다."
 GER_relocate_institutions: "정부 기관 재배치"
 GER_relocate_institutions_desc: "때가 오면 그들의 정부 기관과 충돌하지 않도록 독일 정부 기관을 철수시켜야 합니다."
 GER_relocate_military_personnel: "군 참모진 교체"
 GER_relocate_military_personnel_desc: "어떠한 충돌도 피하기 위해 해당 지역의 군 인력을 이전시켜야 합니다."
 GER_relocate_the_industrial_heartland: "산업 부문 재배치"
 GER_relocate_the_industrial_heartland_desc: "경제에 미칠 피해를 막기 위해 산업 부문을 북쪽으로 이전해야 합니다."
 GER_hold_referendum_BAY: "바이에른 공화국"
 GER_hold_referendum_BAY_desc: "[BAY.GetFlag] 바이에른 공화국을 자유롭고 독립된 국가로 수립해야 할 때가 왔습니다."
 GER_european_socialism: "유럽의 사회주의"
 GER_european_socialism_desc: "비록 우리 정당의 영향력과 많은 기관들이 있지만, 우리는 다른 유럽의 국가들을 통해 이념을 성장시킬 수도 있을 겁니다. 우리는 이를 위해 사회주의가 강세인 3개의 국가에서 활동을 진행할 수 있습니다. 바로 스웨덴, 핀란드, 그리고 덴마크 입니다.\n\n우리는 다양한 사회주의 집단에 자금을 지원하여 위 국가들에 정치적 혼란을 야기할 수 있으며, 그 이후 그들을 정부 친화적인 괴뢰국으로 변화시킬 수 있습니다."
 GER_the_false_state: "정당하지 않은 국가"
 GER_the_false_state_desc: "The False State, [ISR.GetFlag] §HIsrael§!, was created artificially by other §HEuropeans§! following the second world war. [ISR.GetFlag] §HIsrael's§! very existence undermines our country's history, and it makes us look like an evil to all nations.\nWe must correct the borders, and establish new control over the region using our connections in the region. Countries in the region will be §Hmore than willing§! to help us push them out of the region!"
 GER_trip_to_syria: "[SYR.GetFlag] [SYR.GetName] 방문"
 GER_trip_to_syria_desc: "[SYR.GetFlag] [SYR.GetName]을(를) 방문함으로써 새로운 유대를 맺고, 이스라엘 국가에 대한 우리의 '작전'을 돕도록 설득할 수 있을 것입니다."
 GER_trip_to_egypt: "[EGY.GetFlag] [EGY.GetName]  방문"
 GER_trip_to_egypt_desc: "[EGY.GetFlag] [EGY.GetName]을(를) 방문함으로써 새로운 유대를 맺고, 이스라엘 국가에 대한 우리의 '작전'을 돕도록 설득할 수 있을 것입니다."
 GER_trip_to_lebanon: "[HEZ.GetFlag] [HEZ.GetName]  방문"
 GER_trip_to_lebanon_desc: "[HEZ.GetFlag] [HEZ.GetName]을(를) 방문함으로써 새로운 유대를 맺고, 이스라엘 국가에 대한 우리의 '작전'을 돕도록 설득할 수 있을 것입니다."
 GER_arm_palestinian_groups: "[PAL.GetFlag] [PAL.GetName]  방문"
 GER_arm_palestinian_groups_desc: "[PAL.GetFlag] [PAL.GetName]을(를) 방문함으로써 새로운 유대를 맺고, 이스라엘 국가에 대한 우리의 '작전'을 돕도록 설득할 수 있을 것입니다."
 GER_the_clock_ticks: "\"작전\""
 GER_the_clock_ticks_desc: "오늘이 작전을 시행할 그 날입니다. 우리의 동맹과 함께, 우리는 '정당하지 않은 국가'를 몰아내고 그 지역을 해방시킬 것입니다!"
 GER_bundeswehr_reforms_decisions: "연방방위군 개혁"
 GER_bundeswehr_reforms_decisions_desc: "\n£GER_desctext_bundeswehr\n\n\n\nThe §HBundeswehr§!, our nation's armed forces, is in a dire §Rneed of repair§!. In its current state, it is quite §Rweak and ineffective§!. But by initiating a series of reforms and changes, we can fix that.\n\n§HBundeswehr Recovery§! will represent the progress we have made in §Hreforming§! the force. Once it reaches §H100%§!, any problems that remain will be §Gresolved§!, and the force can become combat ready."
 GER_allocate_larger_budget: "더 많은 예산 편성"
 GER_allocate_larger_budget_desc: "군에 대한 지원금을 늘려 군의 기본 물자를 개선함으로써 개혁 속도를 높일 수 있습니다."
 GER_upgrade_military_infrastructure: "군 기반시설 개선"
 GER_upgrade_military_infrastructure_desc: "우리의 군 기반시설은 개선이 필요합니다. 무너지고 있는 것은 아니지만 현대화해서 나쁠 것은 없습니다."
 GER_modernize_equipment: "장비 현대화"
 GER_modernize_equipment_desc: "비교적 현대화된 무기를 보유하고 있음에도, 통일 이후 많은 장비가 구식으로 남아 있습니다."
 GER_maximize_training_efficiency: "훈련 효율 극대화"
 GER_maximize_training_efficiency_desc: "신병들이 거쳐야 하는 훈련 기간이 길기 때문에, 훈련 중에 얻는 경험을 최대한 활용해야 합니다."
 GER_recruitment_campaigns: "모병 캠페인"
 GER_recruitment_campaigns_desc: "연방군은 최근 몇 년간 신병이 부족했으며, 새로운 모병 캠페인을 벌이는 것이 더 많은 인력을 확보하는 안전한 방법이 될 것입니다."
 GER_civil_war_mission: "공화국의 최후"
 GER_civil_war_mission_desc: "The Republic is coming to an §Rend§!. Public disorder, and §Rradical groups§! are running rampant. Due to our failures to provide §Hadequate funding§! to the BfV, §RRadical parties§! were able to entrench themselves into major government institutions, and have been calling for an §Ruprising§! against the Republic.\n\nAll hope is not lost however, we still have an opportunity to §Rpurge§! the institutions of these groups and save the Republic at a massive cost.\n\n§RThe Civil War will begin if we choose to do nothing. If the Civil War begins, an interim government will be established to transition the country into a new mode of power.§!"
 GER_purge_banks: "은행 폐쇄"
 GER_purge_banks_desc: "은행을 숙청함으로써 금융 부문을 급진 단체로부터 지킬 수 있습니다."
 GER_purge_government_institutions: "정부 기관 숙청"
 GER_purge_government_institutions_desc: "복지 부문이나 경찰과 같은 정부 기관을 숙청함으로써 급진 단체를 제거할 수 있습니다."
 GER_purge_military: "군부 숙청"
 GER_purge_military_desc: "군을 숙청함으로써 군대를 급진 단체로부터 지킬 수 있습니다."
 GER_incoming_collapse: "독일 내전"
 GER_incoming_collapse_desc: "The Republic will fade, but the German nation will not."
 GER_war_on_terror: "독일의 테러와의 전쟁"
 GER_war_on_terror_desc: "We have committed our §Hsoldiers, resources, and nation§! to fighting against §RTerrorism§! in [AFG.GetFlag] §HAfghanistan§!.\n\nWith our allies and other collaborators, we will have the capacity to carry out §Hmissions§! on foreign soil to push §Rterrorists§! out of the target nations. We will have a certain amount of troops we can deploy to fight against §Rterrorism§!, and we can gain influence in [AFG.GetFlag] §HAfghanistan§! based on our forces §HPopularity§!. Alongside the influence, we will be able to help maintain a good status on §HDepartment 6§!, if the §HBfV§! has not collapsed.\n\n If we have more than §H50% Popularity§!, we will get massive bonuses to our military. Additionally, the bonuses will increase as our Forces §HPopularity§! increases. At the end of our mission, which will come randomly, our forces will get a §Gpositive§! national spirit as a result of the many experiences in [AFG.GetFlag] §HAfghanistan§!. This National Spirit will only be made available if we have §H75%§! or more §HPopularity§!. Every month, there is a §Hchance§! that our popularity will §Rdrop§! by anywhere from §H1-3!§!\n\nWe currently have §Y[?GER_soldiers_in_mideast]§! Troops deployed in [AFG.GetFlag] §HAfghanistan§!.\nOur §HPopularity§! amongst their citizens is currently at §Y[?GER_soldiers_popularity_mideast]%§!"
 GER_authorize_attack: "테러리스트 기지에 대한 공격 승인"
 GER_authorize_attack_desc: "알려진 테러 기지에 대한 공격을 승인하여 테러 단체를 몰아내고 우리의 전투 효율을 높일 수 있습니다."
 GER_authorize_airstrike: "공습 승인"
 GER_authorize_airstrike_desc: "공습을 승인하여 목표물을 신속하고 효과적으로 제거할 수 있습니다. 그러나 아군 항공기가 잠재적인 대공 공격의 표적이 될 위험도 있습니다."
 GER_authorize_aid_mission: "인도주의적 지원 임무 승인"
 GER_authorize_aid_mission_desc: "테러의 영향을 받은 국가의 난민과 고통받는 시민들을 돕기 위한 인도주의 임무를 승인할 수 있습니다."
 GER_authorize_20_new_troops: "신규 병력 파병 승인"
 GER_authorize_20_new_troops_desc: "중동에서 활동 중인 병력을 지원하기 위해 연방군 병력 20명을 추가로 파견할 수 있습니다."
 GER_withdraw_troops: "우리 병력 철수"
 GER_withdraw_troops_desc: "모든 병력을 철수시킬 수 있으나, 다시 돌아갈 수는 없습니다."
 germany.1.t: "국민민주당 (NPD)의 감사 여부 결정"
 germany.1.d: "독일 국민민주당 (NPD)은 과거 나치당을 계승한 극우 초국가주의 정당입니다. 1964년에 창설된 이후, 그들은 민간 교육 정부 기관 아래의 여러 비정부 조직과 함께 활동하였고 이는 당연히 우리나라의 헌법과 민주주의에 위협이 되는 행위였습니다. 우리는 이 끔찍한 조직에 대한 전면 감사를 진행할 수 있으며 이로써 그들을 사회에서 매장하고 앞으로 이들을 박멸시킬 수 있기를 기대할 수 있습니다."
 germany.1.a: "An investigation is necessary."
 germany.1.b: "그들이 조그만한... 선물을 가져왔구만.."
 germany.2.t: "주 집행위원회 내부의 비밀 요원 존재 발각"
 germany.2.d: "NPD 수사를 통해 주 당대표와 그 부대표가 정보기관의 요원이었음이 드러났습니다. 이 스캔들은 우리 정부의 이미지와 기관에 대한 신뢰를 실추시켰습니다."
 germany.2.a: "이제 진짜 수상한 걸"
 germany.2.b: "정말로 더 깊이 파고들 필요가 있을까?"
 germany.3.t: "비밀 요원에 대한 조사"
 germany.3.d: "최근의 주 당대표 스캔들로 인해, 정보기관과 주 당대표의 연관성에 대한 수사를 시작할 수밖에 없게 되었습니다."
 germany.3.a: "제발 더 깊이 들어가지 않아도 되기를.."
 germany.4.t: "국민민주당 (NPD) 감사의 종결"
 germany.4.d: "안타깝게도 네오나치 NPD를 겨냥한 수사에서 이들에 대한 증거를 찾지 못했고, 독일 민주주의 헌법 체제에 대한 이 위험한 극단주의 위협을 주변부로 밀어내려던 우리의 노력은 끝나고 말았습니다."
 germany.4.a: "역시나 불필요했어"
 germany.402.t: "자금 문제로 중단된 국민민주당 (NPD) 감사"
 germany.402.d: "BfV는 NPD에 대한 수사 진행 중 여러 차례 막다른 길에 부딪혔습니다. 이들은 더 큰 예산을 요청하고 있지만, 우리 정부가 과연 이런 식으로 자금을 지원할 형편이 되는지 의문입니다."
 germany.402.a: "필요한 모든 것을 지원해 주어라"
 germany.402.b: "알겠다, 어느 정도 예산을 증편해주지"
 germany.402.c: "무시해라, 그냥 진짜 조금만 줘라"
 germany.401.t: "유죄로 판명난 국민민주당 (NPD)"
 germany.401.d: "NPD는 독일 민주주의를 해치려 한 혐의로 유죄 판결을 받았으며, 이에 따라 이 우익 정당에 대한 금지 처분이 내려졌습니다."
 germany.401.a: "좋아"
 germany.5.t: "뒤셀도르프의 폭발 사고"
 germany.5.d: "열 명의 사람들이 뒤셀도르프에서 독일어 수업을 마치고 집에 가기 위해 기차역으로 걸어가고 있었습니다. 걷던 중 바로 옆에 있던 비닐봉지 속의 폭탄이 갑자기 폭발했습니다.\n\n일부 부상은 생명이 위독할 정도였지만, 행인들의 빠른 대처와 병원에서의 후속 수술 덕분에 다행히 사망자는 없었습니다.\n\n경찰은 이미 범인을 찾기 위해 '아커슈트라세 수사위원회(Ermittlungskommission Ackerstraße)'를 설치할 계획이라고 발표했습니다. 누가 공격의 배후인지는 알려지지 않았지만, 부상자 12명 중 9명이 유대인이었고 거의 모두가 외국인이었기에 인종차별이 동기였을 가능성이 높습니다."
 germany.5.a: "당장 테러리스트를 찾아라!"
 germany.5.b: "그저 사고일 뿐이다!"
 germany.501.t: "용의자의 체포"
 germany.501.d: "몇 주 전 발생한 폭탄 테러와 관련하여 용의자가 체포되었습니다. 사법 당국은 이미 그의 처리를 준비하고 있으며, 당분간은 안심해도 좋습니다."
 germany.501.a: "사건 종결"
 germany.6.t: "Düsseldorf Synagogue Attacked!"
 germany.6.d: "올해 들어 두 번째로 뒤셀도르프에서 인종적 동기에 의한 공격이 발생했습니다. 신원 미상의 사람들이 밤중에 종교 건물 입구로 몰래 접근해 건물을 불태우려고 불을 질렀습니다.\n\n그러나 이번에는 경찰이 운이 더 좋았습니다. 튀니지와 모로코 출신의 두 남성이 범행을 자백했습니다. 최근 팔레스타인 소년이 이스라엘 군인의 총에 맞아 사망한 일에 대한 이스라엘에 대한 증오심 때문에 두 사람이 범행을 저질렀음이 분명해졌습니다."
 germany.6.a: "Good work, start the trial immediately"
 germany.6.b: "잘했다. 재판을 시작하고, 더 포괄적인 조사를 진행해라"
 germany.6.c: "Good work, but release the boys as our prisons are running out of space."
 germany.7.t: "슈로더의 신임 투표"
 germany.7.d: "지금은 우리 시대의 중대한 순간이며, 우리를 지지하는 다수가 임무를 수행할 능력이 있고 의회가 우리의 결의를 신뢰하도록 해야 합니다."
 germany.7.a: "어떻게 되는지 지켜보자."
 germany.8.t: "Terror Attack at Breitscheidplatz"
 germany.8.d: "아니스 암리가 저지른 치명적인 테러 공격이 베를린 브라이트샤이트 광장의 크리스마스 시장을 덮쳤습니다. 이 비극은 국가에 충격을 안겼으며, 독일의 국내 안보와 대테러 대책에 대한 의문을 불러일으켰습니다. 국민은 이러한 사건이 되풀이되지 않도록 단호한 대응을 요구하고 있습니다."
 germany.8.a: "Strengthen Security and Surveillance"
 germany.9.t: "독일의 선거"
 germany.9.d: "이제 독일 국민이 나서서 사랑하는 조국의 운명과 미래를 결정해야 할 때가 왔습니다. 미래는 대중의 여론에 달려 있습니다..."
 germany.9.a: "나는 민주주의를 사랑한다"
 germany.10.t: "기독교민주연합 (CDU)에 대한 감사를 시작한 특별조사위원회"
 germany.10.d: "독일 보수 정당 CDU의 재무 책임자 발터 라이슬러 키프가 검찰에 소환되어, 과거 재무 책임자 직책을 이용해 탈세를 저질렀음을 시인했습니다.\n\n키프가 모든 것을 우리에게 말하지는 않을 것이 분명하므로, 이 범죄가 얼마나 깊고 금액이 얼마나 되는지 밝혀내는 것은 이제 법원의 몫입니다."
 germany.10.a: "감사를 주도해라"
 germany.10.b: "Others can take care of that"
 germany.11.t: "슈라이버의 개입"
 germany.11.d: "아우크스부르크 검찰청이 사건과 그 범위에 대한 추가 정보를 입수했습니다. 슈라이버가 발터 라이슬러 키프에게 돈을 건넨 것으로 보입니다. 이 돈은 사우디아라비아로의 전차 수출과 관련하여 티센 AG가 조성한 비자금에서 나온 것이었습니다."
 germany.11.a: "생각보다 문제가 심각해지는 군"
 germany.11.b: "이제 지겹다, 또 유죄냐?"
 germany.11.c: "더 이상 감사를 진행할 이유가 없다, 그냥 소송을 취하해라"
 germany.12.t: "소송 취하"
 germany.12.d: "법원은 CDU에 제기된 혐의를 취하해야 한다고 판결했습니다. 그러나 제기된 모든 의혹의 결과로 이 정당은 혼란에 빠졌습니다."
 germany.12.a: "이럴거면 애초에 왜 시작한거지?"
 germany.13.t: "기독교민주연합 (CDU)에 막대한 벌금 부과"
 germany.13.d: "법원이 CDU에게 불리한 판결을 내리고 모든 혐의에 대해 유죄를 선고함에 따라, CDU는 국가에 막대한 벌금을 내야 하게 되었습니다. 관련된 모든 이들은 이제 개별 재판을 받게 됩니다."
 germany.13.a: "이것이 부패한 정치인들의 말로지"
 germany.14.t: "혼란에 휩싸인 기독교민주연합 (CDU)"
 germany.14.d: "볼프강 쇼이블레가 이미 CDU 대표직에서 사임할 뜻을 밝혔습니다. 앙겔라 메르켈이 그의 뒤를 이어 당 대표가 될 것이 거의 확실하며, 총리 후보가 될 가능성도 있습니다."
 germany.14.a: "흥미롭군"
 germany.15.t: "베어 헤드 프로젝트 (Bear Head Project): 감사 결과"
 germany.15.d: "요원들이 쓸 만한 것을 찾아내리라는 희망을 거의 잃을 뻔했습니다. 그러나 순전한 행운으로, 증류소에 관한 몇몇 서류 외에도 CDU 고위 정치인들에게 보낸 편지가 나왔습니다. 그는 편지에서 자신의 프로젝트에 대한 지원을 요청하고 있습니다.\n편지 중 하나는 당시 CDU 재무 책임자였던 발터 키프에게 직접 보낸 것으로, 푸크스 장갑차를 판매하는 무기 거래에 대한 지원을 요청하고 있습니다."
 germany.15.a: "결국 시작해 버렸군"
 germany.15.b: "이는 불필요한 그저 편집증이다!"
 germany.16.t: "누락된 파일의 운명"
 germany.16.d: "총리실 실종 문서(Verschwundene Kanzleramtsakten)\n\n독일 내 증류소에 관한 서류 사이에서 슈라이버의 '베어 헤드' 프로젝트에 관한 서류를 발견했습니다. 이 건을 조사해 볼 필요가 있을지도 모릅니다."
 germany.16.a: "Heads will roll."
 germany.16.b: "좋다, 이제 유용하게 활용해 볼까!"
 germany.17.t: "사우디와의 거래"
 germany.17.d: "카를하인츠 슈라이버가 1991년 발터 키프에게 건넨 돈이, 사우디아라비아에 독일산 전차를 제공한 전차 수출 거래와 관련하여 티센 AG가 조성한 비자금에서 나온 것이었음이 사실로 밝혀졌습니다."
 germany.17.a: "그래도 이제 그들도 차세대 전차는 보유하고 있으니 다행이지"
 germany.18.t: "볼메르령 (Volmer-Erlass)에 서명한 요슈카 피셔"
 germany.18.d: "루트거 폴머(현 외무부 국무장관)의 이름을 딴 새 훈령은 단기 비자(최대 3개월) 신청을 위한 긴 대기 줄을 줄이고, 더 빠른 처리를 위해 돈을 요구하는 외국 보안 세력의 불법 관행을 없애고자 합니다. 루트거 폴머는 독일의 대형 신문 헤드라인에서 자신의 이름이 붙은 것을 보고 상당히 놀랐는데, 훈령이 마련되던 당시 그는 필요한 치료를 받으러 병원에 입원해 있었기 때문입니다.\n\n이 훈령은 비자 만료 후 신청자가 정말로 귀국할지 확실하지 않더라도 대사관 직원들이 비자 신청을 받아들이도록 장려합니다.\n\n대중은 대체로 이 훈령을 두 팔 벌려 환영했으며, 특히 독일 기업, 인권 단체, 정치인들이 그러했습니다.\n\n내무장관 오토 쉴리와 FDP의 전직 고위 정치인 몇몇은 반대 입장을 밝혔습니다. 이들은 이 훈령이 인신매매와 불법 이민을 우리나라로 조장할 것이라고 주장합니다."
 germany.18.a: "그들을 환영해라"
 germany.19.t: "새로운 여행사 정책의 도입"
 germany.19.d: "라이제슈츠 AG의 대표가 새로운 여행자 보험을 내놓았습니다. 여행자 보험이라는 발상은 독일에 새로운 것이 아니며, ADAC(독일 자동차 클럽)는 이미 1995년부터 이를 제공해 왔습니다. 그러나 더 흥미로운 것은, 주요 산업계 인사와 정치인들이 이 보험과 유사한 여행자 보험들을 비자 신청에 필요한 지불 능력 증명으로 인정하자는 아이디어를 내놓았다는 점입니다.\n\n폴머 훈령과 함께라면 더 많은 사람이 단기로 독일을 찾도록 유치하는 데 도움이 될 수 있습니다.\n\n폴머 훈령과 직접적으로 연관된 불법 행위가 약간 증가한 것을 확인했음에도, 우리는 이 방식을 도입할 만한 대중의 지지를 여전히 확보하고 있습니다."
 germany.19.a: "진행시켜라"
 germany.19.b: "I think we'll stick to cash."
 germany.20.t: "여행사 정책 (Reisebüroverfahren)에 대한 문제"
 germany.20.d: "여행사 절차(Reisebüroverfahren)는 대사관 앞의 긴 대기 줄을 악용하는 마피아 같은 집단이 계속 늘어나는 문제를 해결하기 위해 콜 총리 재임 시 지난 입법 기간에 도입되었습니다. 신청자는 등록된 여행사에 가면 되고, 여행사가 비자 신청 업무를 대행합니다.\n\n노이울름의 한 여행사는 (아마 다른 많은 여행사도) 이 상황을 악용하여 꾸며낸 독일 여행 상품을 판매했습니다. 그는 신청서를 모아 키이우의 독일 대사관에 보냈습니다. 이후 이 사람들은 합법적인 단기 비자로 독일에 입국한 뒤 그대로 사라져 다른 유럽 국가로 더 이동하거나 수상한 분야에서 일하기 시작했습니다.\n\n우리는 대사관 앞의 불법 행위와 싸우기를 바랐지만, 문제를 다른 곳으로 옮겨놓았을 뿐인 듯합니다. 이제 야당들은 여행사 절차를 폐지할 것을 요구합니다."
 germany.20.a: "해체해라"
 germany.20.b: "긍정적 효과가 더 중요하다"
 germany.21.t: "볼메르령 (Volmer-Erlass)에 대한 문제"
 germany.21.d: "우리 대사관들은 지난 몇 달 동안 특히 동유럽에서 단기 비자 신청이 대폭 증가했다고 보고합니다. 1000달러나 하는 여행자 보험을 사서 독일로 들어온 뒤 그대로 사라지는 것이 일상이 되었습니다. 전문가들은 이미 이 문제를 해결하는 유일한 방법은 원래대로 현상 유지 상태로 되돌리는 것이라고 제안합니다. 폴머 훈령은 일부에게는 삶을 편하게 했지만, 불법 이민, 인신매매, 강제 성매매도 대규모로 조장했습니다.\n\n이것만으로도 부족하다는 듯, EU는 독일 정부가 이 훈령으로 솅겐 협정과 유럽법을 위반하고 있다고 의심하여 이 문제를 조사하겠다고 발표했습니다."
 germany.21.a: "처음부터 도입하지 말았어야 했는데"
 germany.21.b: "이제부터 유지 한다"
 germany.22.t: "볼메르령 (Volmer-Erlass)으로 독일을 고소한 유럽연합 - 독일의 패소"
 germany.22.d: "폴머 훈령을 계속 시행하기로 한 독일의 결정으로 인해 EU는 독일을 제소하기로 결정했습니다. 유럽 연합은 독일이 솅겐 협정과 유럽법 전반을 위반했다고 비난했습니다.\n\n법정 공방은 이제 몇 달간 이어졌으나, 결국 유럽사법재판소는 독일의 훈령 도입이 기존 법을 위반했다고 판결하고 우리에게 즉시 훈령을 철회하라고 강제했습니다."
 germany.22.a: "다시 법령을 가져오자"
 germany.23.t: "볼메르령 (Volmer-Erlass)으로 독일을 고소한 유럽연합 - 독일의 승소"
 germany.23.d: "폴머 훈령을 계속 시행하기로 한 독일의 결정으로 인해 EU는 독일을 제소하기로 결정했습니다. 유럽 연합은 독일이 솅겐 협정과 유럽법 전반을 위반했다고 비난했습니다.\n\n법정 공방은 이제 몇 달간 이어졌으나, 결국 유럽사법재판소는 훈령이 솅겐 협정의 범위 안에서 움직였으므로 독일의 훈령 도입이 어떤 기존 법도 위반하지 않았다고 판결했습니다."
 germany.23.a: "좋은 소식이군"
 germany.25.t: "그 누구도 환호하지 앟는 환경세 정책"
 germany.25.d: "'에코세'는 녹색당 B90/녹색당의 프로젝트였으며 연정 파트너인 SPD를 비롯해 많은 저항에 부딪혔습니다. 도입되자마자 납세자 협회, 화물 운송업 협회, 냉동 창고 협회가 제기한 위헌 소송이 법원에 쇄도했습니다. 공개 행사에서 자유주의 정당 FDP는 베를린의 한 주유소에서 모든 연료의 세금 비용을 대신 납부했습니다. 300명이 이런 방식으로 극히 저렴한 가격에 주유할 수 있었습니다."
 germany.25.a: "그저 세율을 조금 인상한 것 때문이겠지..."
 germany.26.t: "여성의 연방방위군 복무를 허용하는 유럽 의회"
 germany.26.d: "1949년의 우리 헌법은 여성이 독일 군대에서 복무하는 것을 명시적으로 금지하고 있습니다. 여성은 간호사나 군악대로 복무하는 것은 허용되었지만, 무기를 들 수는 없었습니다. 그 결과 1996년 한 독일 여성이 일반 병사로 입대하려던 지원이 거부되자 정부를 제소했습니다. 사건은 유럽 법원에 올라갔고, 이제 법원은 이것이 EU 법에 위배된다고 판결했습니다.\n\n독일 의회는 가까운 시일 내에 헌법의 해당 조항을 다시 써야 하며, 곧 여성도 동등한 병사로서 입대를 지원할 수 있게 됩니다."
 germany.26.a: "우리는 사람이 항상 부족하다"
 germany.26.b: "아닌 것 같다."
 germany.27.t: "Egon Krenz Imprisoned"
 germany.27.d: "독일민주공화국과 집권당 SED의 마지막 지도자 에곤 크렌츠가 베를린-하켄펠데에서 6년 6개월의 징역형에 직면했습니다. 크렌츠는 불과 49일 동안 집권했으나, 그 마지막 며칠 동안에도 국경 경비대의 무력 때문에 사람들이 죽었습니다. 이 살인 혐의로 그는 이미 1997년에 형을 선고받았지만, 다른 법원들에 제기한 이의 신청과 재심 덕분에 18일 만에 다시 풀려났습니다. 그러나 이번에는 그가 오랫동안 감옥에 남을 것으로 보입니다. 크렌츠는 여전히 혐의를 부인하며 자신이 승자의 정의의 희생자라고 말합니다. 또한 동독 시민에 대한 서독 법원의 어떠한 책임도 부인하지만, 이제 옛 동지들을 감옥에서 만나게 된 그에게 그런 주장은 도움이 되지 않을 것입니다."
 germany.27.a: "다시 감방에 처넣어라! 그는 유죄다."
 germany.27.b: "잘가라 크렌즈"
 germany.28.t: "마네스만과 병합하는 통신사 보다폰 (Vodafone)"
 germany.28.d: "만네스만 AG는 독일 최대의 이동통신 사업자로, D2라는 이름으로 독일 통신 시장의 민영화를 시작했습니다. 1999년에 유럽 최대 경쟁사 중 하나인 영국의 오렌지사를 인수했습니다. 이에 대한 반응으로, 역시 영국 기업인 보다폰 GmbH는 이미 지분의 약 30%를 보유한 만네스만 AG를 직접 인수하는 데 관심이 있음을 밝혔습니다.\n\n보다폰은 처음 제안에서 1000억 유로를 제시했고, 이후 그 금액을 1900억으로 늘렸습니다. 만네스만 이사회는 이미 그 제안에 동의했으며, 곧 독일 최대이자 가장 빠르게 성장하는 기업 중 하나가 분할되어 매각될 것입니다.\n\n이 과정은 독일 주요 기업에 대한 최초의 외국 인수이자 세계 역사상 최대 규모가 될 것입니다. 만네스만 AG가 통신 사업을 시작한 이래, 독일 우정 민영화의 결과로 텔레콤이라는 또 다른 기업이 이 분야에 뛰어들어 빠르게 성장하고 있습니다. 이를 막고 싶다면 마지막 수단은 독점 금지 절차를 개시하여 인수를 저지하는 것입니다."
 germany.28.a: "내버려둬라, 우리는 도이체 텔레콤 (Telekom)이 있다"
 germany.28.b: "용납하지 않을 것이다"
 germany.29.t: "함부르크와 베를린 사이의 초고속 자기부상열차 건설을 취소한 독일철도주식회사"
 germany.29.d: "함부르크와 베를린 사이에 계획된 트란스라피트 노선은 독일과 유럽 최초의 트란스라피트 노선이 될 것입니다. 1994년에 시속 430km의 자기부상열차 계획이 시작되었고, 최근 몇 년 사이 엠스란트에 시험 노선이 건설되었습니다. 이 사업은 티센, 지멘스, 다임러-벤츠, AEG로 구성된 컨소시엄이 자금을 조달했습니다.\n\n건설에 드는 50억 유로의 막대한 금액 외에도, 활동가들은 소음 공해와 환경 문제 가능성을 이유로 이에 항의합니다. 수년에 걸쳐 노선의 수입 예상치는 예상 승객 수와 함께 줄어들었고, 계획이 거의 완성된 상태였음에도 비용이 기하급수적으로 늘어나자 컨소시엄은 사업을 전면 중단하기로 했습니다."
 germany.29.a: "예산을 더 적절한 곳에 사용할 수 있다"
 germany.29.b: "We pay for the route, but not the maintenance."
 germany.30.t: "브륄의 열차 사고"
 germany.30.d: "열차는 밤에 암스테르담에서 스위스 바젤로 가던 중 브륄을 지나고 있었습니다. 15개국에서 온 승객 201명이 열차에 타고 있었고, 열차는 선로 전환 중에 탈선하여 인근 주택가로 충돌했습니다. 다행히 사망자는 9명에 그쳤고 149명이 부상했지만, 수색 및 구조 작업은 다음 날까지 이어졌습니다. 850명이 넘는 구조대원이 그 후 여러 날 동안 현장에 묶여 있었습니다. 현재 이 비극적 사고의 원인은 알려지지 않았지만, 철저한 조사를 통해 곧 더 많은 것이 밝혀질 것입니다.\n\n이번 사건을 더욱 비극적으로 만드는 것은 불과 1년 반 전에 사망자 101명의 더 끔찍한 에셰데 열차 사고가 있었다는 점입니다."
 germany.30.a: "Luckily this wasn't a Transrapid"
 germany.31.t: "Floods hit Lower Saxony"
 germany.31.d: "일주일간 이어진 집중 호우로 유럽의 상당 지역에 홍수가 발생했습니다. 독일을 포함한 중부 유럽의 여러 국가에 피해가 미쳤습니다. 오늘 특히 니더작센이 큰 타격을 입어 상당한 재산 피해와 인명 손실이 발생했습니다."
 germany.31.a: "신이시여 우리를 구원해주소서"
 germany.32.t: "Floods hit North Rhine-Westphalia"
 germany.32.d: "유럽 홍수로 노르트라인 지역이 황폐해져 기반시설 피해와 인명 손실이 발생했습니다."
 germany.32.a: "희생자의 가족에게 조의를 표한다."
 germany.33.t: "이란의 방문한 요슈카 피셔"
 germany.33.d: "피셔는 테헤란에서 이란 대통령 모하마드 하타미와 외무장관 카말 하라지를 만나 독일과 이란의 관계에 대해 논의했습니다. 독일 외무장관의 이란 방문은 9년 만에 처음인데, 그동안은 베를린의 그리스 식당 미코노스에서 일어난 쿠르드인 암살 사건과 헬무트 호퍼에 대한 가짜 재판으로 인해 그늘이 드리워져 있었기 때문입니다. 이제 이란이 호퍼를 석방함으로써 양국 관계를 다시 정상화하려는 새로운 시도의 길이 열렸습니다.\n\n피셔와 하라지의 공동 기자 발표에서 양측은 독일-이란 관계에 새로운 기회가 생겼다고 말했으며, 이란 대통령이 곧 독일을 방문할 것이라고 발표했습니다. 회담의 내용은 주로 이란의 인권 상황에 관한 것이었지만, 양국이 어떻게 관계를 다시 정상화할 수 있는지에 대해서도 다루었습니다."
 germany.33.a: "이제 드디어 서로 친구가 될 수 있지 않을까"
 germany.34.t: "자유가 된 헬무트 호퍼"
 germany.34.d: "Hofer is a German businessman who sold car parts to various contacts in Iran. As he visited Teheran in 1997 for the third time, he got arrested for illicit sex with a medical student. He indeed met her in a hotel foyer, gave her his business card and offered her a free stay in Hamburg if she wants to come there. He told the judges that they didn't even kiss, but the sentence was death by stoning in the end, as the media in Iran demanded it. German lawyers could later revert the sentence to imprisonment.\n\nA year later the court resumes the trial against Hofer, again for illicit sex with a Muslim, but now also for espionage and insulting Iranian officials. Again with the help from his lawyers and German officials the charges got dropped and his imprisonment lifted.\n\nBefore the Iranian government could summon him back to court for another trial, the German ambassador organized a flight back to Germany where he arrived today. It seems the 3 year-long hell trip ended for Helmut Hofer."
 germany.34.a: "Welcome back! Now it's time to pay your missing taxes"
 germany.35.t: "알리안츠와 드레스드너방크의 합병"
 germany.35.d: "드레스드너 은행은 독일 제2의 은행으로, 제2차 세계 대전 중 SS의 주거래 은행으로 유명해졌습니다. 한편 알리안츠 AG는 뮌헨에 본사를 둔 유럽 최대의 보험사입니다.\n\n드레스드너 은행과의 합병을 원하는 회사는 이번이 벌써 세 번째입니다. 첫 번째 시도는 2000년 도이체 방크였고, 같은 해 코메르츠방크가 뒤를 이었으며, 이제 금융계는 다시 프랑크푸르트를 바라보며 다음 대형 경쟁자가 누가 될지 지켜보고 있습니다. 알리안츠 AG는 지금까지 대부분 보험 분야에만 관여해 왔기에 은행 부문을 구축하려 합니다. 그러나 이 합병으로 프랑크푸르트에는 자기자본 680억, 80여 개국 직원 17만 명, 총자산 1.6조 마르크, 시가총액 2000억 마르크 이상의 세계 최대급 은행이 탄생하게 됩니다.\n\n이 거래는 알리안츠 AG가 보유한 독일 내 다른 은행들의 지분을 매각하는 한편, 동시에 그들이 보유한 드레스드너 은행 지분을 매입하는 방식으로 자금이 조달됩니다."
 germany.35.a: "이제 모든 것이 정상화되기를"
 germany.36.t: "The Scandal Breaks"
 germany.36.d: "베를린 은행 스캔들이 드러나면서, 베를리너 방크게젤샤프트가 위험한 대출을 승인하고 수상한 부동산 투자를 하여 막대한 금융 손실을 초래했음이 밝혀졌습니다. 은행 주택담보대출 부문의 책임자이자 CDU 정치인인 클라우스-뤼디거 란도프스키가 스캔들의 중심에 있습니다. 란도프스키는 인터뷰에서 은행으로부터 800만 마르크의 논란이 되는 대출을 받았음을 시인한 후 대중의 반발에 직면했습니다."
 germany.36.a: "This could damage the CDU's reputation!"
 germany.37.t: "Political Pressure Mounts"
 germany.37.d: "스캔들의 정치적 여파가 심화됩니다. 베를린의 SPD 원내대표 클라우스 보베라이트는 독립적인 수사를 요구하고, PDS 대표 그레고어 기지는 정치와 은행 간의 긴밀한 유착을 공개 비판합니다. 보베라이트는 '이것은 정치와 금융 체제 모두의 실패이다.'라고 말합니다. SPD와 CDU의 관계가 껄끄러워지면서 베를린 정부 내부의 긴장이 고조됩니다."
 germany.37.a: "독립적인 수사를 지지한다."
 germany.38.t: "Public Outcry"
 germany.38.d: "스캔들에 대한 더 많은 세부 사항이 드러나면서 베를린의 대중 시위가 커지고 있습니다. 시위대는 은행 체제의 투명성 강화와 정치적 정실주의의 종식을 요구합니다. 클라우스 란도프스키는 엄청난 압박 속에서 직책에서 물러났으며, 총리 게르하르트 슈뢰더는 '이것은 베를린 금융 신뢰도에 어두운 날이다.'라고 말합니다."
 germany.38.a: "We must heed the public's demand for transparency."
 germany.39.t: "정부 위기와 회복"
 germany.39.d: "SPD는 스캔들에 연루된 책임을 CDU에게 물으며 CDU와의 연정을 해체하겠다고 위협합니다. 시장 클라우스 보베라이트는 '우리의 신뢰는 산산조각 났다.'라고 말합니다. CDU의 인기는 급락하고 있으며 베를린은 정치적 붕괴의 위험에 처해 있습니다. 그러나 새로운 지도자로 떠오른 보베라이트는 개혁과 지도력을 통한 안정의 길을 제시합니다."
 germany.39.a: "Trust Wowereit and rebuild through reforms."
 germany.39.b: "Fight to hold the coalition together without changes."
 germany.40.t: "Who Will Pay to Save the Bank?"
 germany.40.d: "은행 스캔들이 베를린을 파산시킬 위기에 처하면서, 논쟁은 베를리너 방크게젤샤프트를 구제하는 데 드는 재정적 부담을 누가 질 것인가로 옮겨갑니다. 일부는 시가 개입해야 한다고 주장하고, 다른 이들은 연방의 지원이나 심지어 민간 투자를 촉구합니다. 보베라이트 시장은 \\"베를린 시민을 보호하기 위해 어려운 결정을 내려야 합니다.\\"라고 논평합니다. 도시의 재정적 미래가 걸려 있습니다."
 germany.40.a: "The city of Berlin should cover the costs."
 germany.40.b: "Ask for federal aid from the German government."
 germany.41.a: "그건 웃기게 생긴 콧수염 아저씨의 것이지, 우리 것이 아니다..."
 germany.41.b: "아, 드디어 우리의 영광스런 '인공물'이 발견되었구만"
 germany.41.t: "부에노스아이레스의 집에서 발견된 수많은 나치 잔재의 인공물"
 germany.41.d: "아르헨티나 수도 인근의 한 주택 비밀 방에서 경찰은 아돌프 히틀러의 흉상 부조, 스와스티카가 새겨진 고급 상자 속 확대경, 심지어 머리 크기를 재는 섬뜩한 의료 기구 등을 포함해 이 나라 역사상 최대 규모의 나치 유물 수집품을 발견한 것으로 보고 있습니다.\n부에노스아이레스 북쪽 교외 베카르의 수집가 주택에서 약 75점의 물품이 발견되었으며, 당국은 이것들이 제2차 세계 대전 중 독일 나치 고위층이 소유했던 원본으로 보인다고 밝혔습니다."
 germany.42.t: "동부의 핵 발전 복원"
 germany.42.d: "1990년 독일 재통일 이후 그라이프스발트 발전소가 폐쇄된 뒤, 이 발전소는 구 동독 지역에 가동 중단 상태로 남아 있었습니다. 수년간의 청원과 정부가 다시 원자력으로 기운 덕분에, 이 발전소는 앞으로 몇 년에 걸쳐 원자로 2기를 재정비하여 재가동될 예정입니다."
 germany.42.a: "사람들에게 더 많은 권력을 주어라"
 germany.42.b: "우리 비건들은 핵 에너지를 결사 반대한다!"
 germany.42.c: "이건 동부의 것이다!"
 germany.43.t: "그라이프스발트 발전소 완공"
 germany.43.d: "1990년 발전소가 폐쇄되었을 때 사람들은 이 원자력 발전소가 다시 문을 열 것이라는 희망을 거의 갖지 못했습니다.\n10여 년이 넘는 캠페인 활동과 정부의 지원 끝에 그라이프스발트 발전소가 마침내 재정비되어 재가동되었으며, 앞으로 수년간 전력을 공급할 새 원자로 2기를 제공합니다."
 germany.43.a: "왜 내가 불타고 있는 거지?"
 germany.44.t: "의료 센터 증축 계획"
 germany.44.d: "독일 정부는 의료 센터와 병원의 수를 늘리기 위해 과감한 조치를 취했습니다. 보건 예산 증액은 지방 당국에 필수 장비, 인력, 물자를 위한 더 많은 자금을 제공하는 데 도움이 될 것입니다."
 germany.44.a: "국제의료서비스 (GHS)에게 박수를"
 germany.48.t: "Opening Deutschland.DE"
 germany.48.d: "연방 대통령 요하네스 라우가 독일의 공식 온라인 포털 'deutschland.de'를 공식 개설했습니다. [insert date]에 있었던 연설에서 라우는 디지털 소통의 중요성이 커지고 있음을 강조하며 deutschland.de를 통해 세계를 향한 새로운 창을 엽니다. 이는 단순히 정보를 제공하는 것이 아니라 대화와 이해를 증진하는 일입니다라고 말했습니다. 독일 통일과 1990년대 인터넷의 부상 이후, 국제적으로 국가를 대표할 플랫폼이 필요하다는 점은 분명했습니다. 여러 언어로 제공되는 이 포털은 정치, 문화, 경제에 관한 콘텐츠를 제공합니다. 라우는 이 웹사이트가 국제 사회에 독일의 위상과 가치를 알리는 데 핵심적인 역할을 한다고 강조했습니다."
 germany.48.a: "Interesting"
 germany.49.t: "The 2001 Cebit"
 germany.49.d: "세계 최대의 통신 및 IT 박람회 세비트(CeBIT)가 하노버에서 다시 열렸으며, 독일 총리 게르하르트 슈뢰더가 행사의 공식 개막을 선언했습니다. 올해는 인터넷 기술의 급속한 발전, 특히 유럽 전역에서 더 빠른 모바일 인터넷 접속을 약속하는 UMTS(범용 이동통신 시스템)의 보급에 초점이 맞춰졌습니다. 도이체 텔레콤 등의 기업이 선두에 서서 차세대 네트워크를 독일에 구축할 준비가 되었음을 선보였습니다. 또 다른 주요 하이라이트는 모바일 데이터 서비스의 중요성 증대였습니다. GPRS(일반 패킷 무선 서비스)의 도입은 더 빠른 모바일 인터넷 탐색의 길을 열었고 업계에 중요한 진전을 이루었습니다. 무선 기기와 새로운 비즈니스 솔루션 같은 혁신 기술도 주목을 받았습니다. 한편 거대 기술 기업 마이크로소프트는 곧 시장을 변화시킬 휴대용 컴퓨팅의 미래를 엿볼 수 있는 새로운 태블릿 콘셉트를 선보였습니다. 2001년 세비트는 통신 및 IT 분야의 핵심 행사로서의 명성을 계속 공고히 했으며, 세계 기술 발전에서 독일의 두드러진 역할을 반영했습니다."
 germany.49.a: "Interesting"
 germany.50.t: "Möllemann Criticizes Israel's Politics"
 germany.50.d: "FDP 부대표 위르겐 묄레만이 팔레스타인인에 대한 이스라엘의 정책을 비판해 언론에서 파문을 일으켰습니다. 그는 연설에서 '샤론의 정책은 중동 평화에 위협이며, 우리나라에서조차 반유대주의를 부추깁니다.'라고 말했습니다. 이 발언은 유대인 단체와 정치인들 사이에서 분노를 불러일으켰습니다. 많은 이들이 그가 반유대주의를 부추기고 있다고 비난합니다."
 germany.50.a: "Condemn Möllemann's statements"
 germany.51.t: "Internal Tensions in the FDP"
 germany.51.d: "묄레만의 발언은 FDP 내부에 상당한 마찰을 일으켰습니다. 당내 한 분파는 그가 선을 넘었다고 보는 반면, 다른 이들은 이스라엘에 대한 비판이 반유대주의와 혼동되어서는 안 된다고 주장합니다. 당대표 귀도 베스터벨레는 입장을 밝히라는 압박을 받고 있습니다. 묄레만 본인은 사과를 거부하며 '샤론에 대한 비판은 반유대주의가 아닙니다. 나는 입을 다물지 않을 것입니다.'라고 말합니다."
 germany.51.a: "Demand Möllemann's resignation"
 germany_yearly.1.t: "The Völkerstrafgesetzbuch"
 germany_yearly.1.d: "국제형법전은 국제 범죄자가 독일 땅에 발을 들이면 독일 법원에서 재판할 수 있도록 하는 새로운 제안 법률입니다. 이는 범죄자와 피해자가 모두 외국인이고 범죄가 국외에서 저질러졌더라도 국제 범죄자를 이곳에서 재판할 수 있다는 의미입니다."
 germany_yearly.1.a: "A much needed law."
 germany_yearly.1.b: "아닌 것 같다."
 germany_yearly.2.t: "에르푸르트 대학살"
 germany_yearly.2.d: "오늘 아침 에르푸르트의 중등학교 구텐베르크 김나지움의 전직 학생이 16명을 살해했습니다. 희생자는 교직원 13명, 학생 2명, 경찰관 1명이었습니다. 이 학생 로베르트 슈타인하우저는 학교에서 퇴학당한 상태였으며, 학교에 복수하려는 것이 동기였던 것으로 추정됩니다."
 germany_yearly.2.a: "Pay reparations to the victims' families"
 germany_yearly.2.b: "A sad day for the nation."
 germany_yearly.3.t: "쾰른에서의 폭발"
 germany_yearly.3.d: "튀르키예계 이민자가 대부분을 차지하는 쾰른의 한 지역에서 못 폭탄이 터졌습니다. 이 공격은 국내 튀르키예계 이민자를 좋아하지 않는 우익 세력이 동기였을 것으로 의심됩니다. 그럼에도 22명이 다쳤으며, 이 공격으로 많은 상점과 차량이 파손되거나 완전히 파괴되었습니다."
 germany_yearly.3.a: "We need to be more alert about this stuff!"
 germany_yearly.3.b: "안타깝지만, 일어난 걸 뭐 어쩌겠나"
 germany_yearly.4.t: "엔네페탈에서 가족의 이주를 원하는 이란인의 인질극"
 germany_yearly.4.d: "50세가량의 이란 남성이 어린이 여럿이 탄 버스를 탔습니다. 최근 그가 어린이 몇 명을 데리고 강제로 침입한 인근 주택에 들어간 사실이 확인되었습니다. 그는 부엌칼로 무장하고 인질들과 집주인의 목숨을 위협하고 있습니다. 그는 독일 당국과의 대화를 요구하며, 가족이 이란에서 독일로 입국할 수 있도록 허가해 달라고 요청하려 합니다."
 germany_yearly.4.a: "알겠다, 들어와라. 그러나 너는 감옥에 갈 것이다!"
 germany_yearly.4.b: "알겠다, 들여보내라. 인질을 놔주면, 우리도 더이상 이 일에 관여하지 않겠다."
 germany_yearly.4.c: "협상할 시간 조차 없다, 당장 특수 작전 사령부를 파견해라"
 germany_yearly.5.t: "열차 폭발 미수"
 germany_yearly.5.d: "무장한 이슬람 극단주의자 집단이 쾰른 중앙역에서 폭탄 공격을 감행할 예정이라는 정보를 입수했습니다. 수사관을 투입할 수는 있지만 최근 우리의 예산이 매우 빠듯합니다."
 germany_yearly.5.a: "경찰을 보내라, 더 많은 희생자를 발생시킬 순 없다"
 germany_yearly.5.b: "We can't afford it."
 germany_yearly.6.t: "아프가니스탄에서의 논란"
 germany_yearly.6.d: "독일 병사가 아프가니스탄에서 인간의 해골을 들고 포즈를 취해 찍은 사진이 공개되면서 분노가 들끓고 있습니다. 다수의 병사들이 이런 자세를 취한 것으로 밝혀졌고, 일부는 심지어 입을 맞추기 까지 했습니다."
 germany_yearly.6.a: "당장 그들을 해고해라!"
 germany_yearly.6.b: "이를 감춰라!"
 germany_yearly.7.t: "독일을 덮친 사이클론 크릴"
 germany_yearly.7.d: "사이클론 키릴이 독일을 강타하여 13명이 사망하고 경로상의 많은 재산이 피해를 입었습니다. 재난 구호를 동원할 수 있지만 막대한 비용이 듭니다. 사이클론은 유럽의 나머지 지역을 거쳐 계속 서쪽으로 이동할 것으로 전해집니다."
 germany_yearly.7.a: "유감이군"
 germany_yearly.7.b: "재난구조팀을 동원해라"
 germany_yearly.8.t: "퇴직의 나이를 67세로 인상"
 germany_yearly.8.d: "퇴직 연령을 67세로 높이는 절차를 시작했습니다. 많은 사람이 분노하고 있지만, 경제의 기본적인 기능을 위해 필요한 조치입니다. 그러나 이를 취소하여 국내 수많은 노동조합을 만족시킬 수도 있습니다."
 germany_yearly.8.a: "아니다, 계속해라"
 germany_yearly.8.b: "취소하는 것이 좋겠지"
 germany_yearly.9.t: "폐쇄되는 노키아의 공장들"
 germany_yearly.9.d: "NOKIA가 보훔 공장 폐쇄를 발표했습니다. 이로 인해 약 2,300명이 일자리를 잃게 되며, 국내 휴대전화 시장에도 영향을 미칠 수 있습니다."
 germany_yearly.9.a: "오. 이런."
 germany_yearly.9.b: "자금을 지원해주자"
 germany_yearly.10.t: "통신 보관법에 따른 자원 투입"
 germany_yearly.10.d: "통신 회사들이 서버에 6개월간의 데이터를 저장하도록 요구하는 새로운 법이 통과되고 있습니다. 이는 인터넷 이용 기록은 물론 통화나 문자 메시지까지 추적하여 우리가 국가를 더 효율적으로 감시할 수 있게 해 줄 것입니다."
 germany_yearly.10.a: "좋아"
 germany_yearly.10.b: "아니다, 더 좋은 곳에 자원을 활용할 수 있을 것이다"
 germany_yearly.11.t: "Wolfgang Schneiderhan Controversy"
 germany_yearly.11.d: "쿤두즈 공습 여파 이후 정보를 은폐했다는 의혹과 관련하여 볼프강 슈나이더반의 사임을 요구하는 목소리가 나오고 있습니다. 그는 현재 연방군 총장으로, 매우 중요한 직위에 있습니다."
 germany_yearly.11.a: "충분히 이 문제를 감출 수 있을 것이다.."
 germany_yearly.11.b: "잘가라"
 germany_yearly.12.t: "인터넷 익스플로러에서 치명적인 결함 발견"
 germany_yearly.12.d: "최근 인터넷 익스플로러에서 일반 독일 사용자를 위협하는 취약점이 발견되었습니다. 이 취약점을 공개적으로 알리고 문제가 해결될 때까지 국민에게 해당 브라우저를 사용하지 말도록 촉구할 수 있습니다. 아니면 해당 프로그램을 아예 금지할 수도 있습니다."
 germany_yearly.12.a: "이 정도까지의 조치는 필요 없다"
 germany_yearly.12.b: "경고를 보내라"
 germany_yearly.12.c: "금지 시켜라"
 germany_yearly.14.t: "러브 퍼레이드 참사"
 germany_yearly.14.d: "오늘 일찍 뒤스부르크 러브 퍼레이드 음악 축제에서 군중 참사가 발생했습니다. 많은 참석자가 축제 구역으로 들어가는 경사로에서 빠져나가려 했고, 안타깝게도 652명이 다치고 21명이 사망한 것으로 보고되었습니다. 그 결과 축제 주최 측은 축제를 영구적으로 취소하겠다고 발표했습니다."
 germany_yearly.14.a: "유감이군"
 germany_yearly.14.b: "이제부터 다른 축제에서는 의료진들을 항시 대기시켜라!"
 germany_yearly.15.t: "프랑크푸르트 공항 총기 난사 사건"
 germany_yearly.15.d: "코소보 출생 알바니아계 21세 아리드 우카가 아프가니스탄에서의 미국 작전에 대한 보복 살인으로 추정되는 범행으로 미 공군 병사 2명을 총격 살해했습니다. 병사들이 버스를 기다리는 동안 우카는 이들에게 아프가니스탄으로 가는지 물었고, 그렇다는 것을 알게 되자 한 병사가 돌아선 뒤 그를 쏘아 죽였습니다. 이어 그는 버스에 난입해 운전사를 쏘아 죽이고 또 다른 병사를 죽이려 했으나 무기가 걸려 실패했습니다."
 germany_yearly.15.a: "심각한 비극이다"
 germany_yearly.15.b: "보안을 더더욱 신경써야 한다"
 germany_yearly.16.t: "공작소에서의 화재로 14명의 사상자 발생"
 germany_yearly.16.d: "장애인 작업장에서 발생한 화재로 14명이 목숨을 잃었습니다. 사망자 외에도 8명이 화재로 부상을 입었습니다. 티티제노이슈타트의 작은 마을은 이로 인해 큰 충격에 빠졌으며, 우리는 현재 화재 원인을 조사하고 있습니다."
 germany_yearly.16.a: "끔찍하군."
 germany_yearly.16.b: "We definitely need some state facilities that are actually safe."
 germany_yearly.17.t: "Volkswagen Group Wants to Acquire Several Companies"
 germany_yearly.17.d: "폭스바겐 그룹은 이탈리아의 '두카티', 독일의 '포르쉐'와 'MAN'을 비롯한 여러 기업을 인수하려 합니다. 이 인수는 폭스바겐 그룹을 수많은 경쟁사보다 우위에 올려놓아 독점이 서서히 형성될 수 있다는 우려를 낳고 있습니다."
 germany_yearly.17.a: "구매를 그만두자.."
 germany_yearly.17.b: "자유 시장의 사업체가 무슨 잘못이 있나"
 germany_yearly.18.t: "독일에 도달한 유럽의 홍수"
 germany_yearly.18.d: "이번 계절의 극심한 홍수가 우리나라를 매우 심하게 강타했습니다. 그 결과 많은 주가 황폐화되었고 수많은 건물이 피해를 입었습니다. 홍수는 독일에만 국한된 것은 아니었지만, 피해의 상당 부분이 우리 국경 안에서 발생했습니다."
 germany_yearly.18.a: "Truly Unfortunate"
 germany_yearly.18.b: "재난구조팀을 동원해라, 당장!"
 germany_yearly.19.t: "폭주하는 이민자들의 입국"
 germany_yearly.19.d: "올해 지금까지 약 40만 명이 독일로 이주한 것으로 보고되었습니다. 이 추정치는 우리나라 역사상 이민 규모에서 올해를 다른 모든 해보다 위에 올려놓습니다. 그러나 반이민 여론이 특히 국내의 보수적 계층을 중심으로 높아지고 있습니다."
 germany_yearly.19.a: "이곳에선 모두가 환영 받는다"
 germany_yearly.19.b: "안된다, 물러나라!"
 germany_yearly.20.t: "샤리아 경찰 사고"
 germany_yearly.20.d: "무슨 이유에서인지 부퍼탈의 일부 강경 살라피스트들이 도시를 순찰하며 샤리아 법을 집행하기로 했습니다. 그들은 술집, 바, 가정집을 돌아다니며 '비이슬람적' 행위를 했다고 지목하고 있습니다. 이는 치안을 어지럽히고 도시에 많은 문제를 일으키고 있습니다."
 germany_yearly.20.a: "뭐라고? 이 바보들을 당장 재판에 회부해라!"
 germany_yearly.20.b: "저들 스스로가 지치면 제발로 돌아가겠지"
 germany_yearly.21.t: "연방 최저임금 인상"
 germany_yearly.21.d: "연방 최저임금을 정하는 법안을 통과시키기로 합의했습니다. 이는 고용주들 사이에 약간의 분노를 불러일으켰습니다. 법안을 추진하면 노동자들은 크게 기뻐하겠지만 고용주들은 그 반대일 것입니다."
 germany_yearly.21.a: "어서 올리자"
 germany_yearly.21.b: "당분간은 유지하자"
 germany_divide.1.t: "§H[anarchist_communism_L]§! rises in popularity"
 germany_divide.1.d: "§H[anarchist_communism_L]§!은(는) 동독에서 서서히 인기를 얻고 있으며, 서독에서도 일부 지지가 늘고 있습니다."
 germany_divide.1.a: "젠장"
 germany_divide.2.t: "시위를 조직하는 §H[anarchist_communism_L]§!"
 germany_divide.2.d: "§H[anarchist_communism_L]§! 지지자들이 전국 여러 도시에서 시위를 벌이기 시작했으며, 이들의 활동으로 나라의 기능이 둔화되고 공공 시설이 피해를 입고 있습니다."
 germany_divide.2.a: "Damn"
 germany_divide.3.t: "폭동을 벌이는 §H[anarchist_communism_L]§!"
 germany_divide.3.d: "§H[anarchist_communism_L]§! 지지자들이 전국에서 폭동을 일으켜 나라 곳곳에 혼란과 불안정을 가져왔습니다."
 germany_divide.3.a: "아 제발!"
 germany_divide.4.t: "군에 침투하는 §H[anarchist_communism_L]§! 지지자들"
 germany_divide.4.d: "§H[anarchist_communism_L]§! 구성원들이 연방군의 고위직에 진출하기 시작했으며, 그들의 영향력이 서서히 상급 지휘부에 영향을 미칠 것입니다."
 germany_divide.4.a: "젠장"
 germany_divide.5.t: "정부에 반기를 드는 집회를 개최한 §H[anarchist_communism_L]§!"
 germany_divide.5.d: "§H[anarchist_communism_L]§!의 지도자가 오늘 대규모 집회를 열어 우리 정부를 모욕으로 비난하고 우리 행정부를 헐뜯었습니다."
 germany_divide.5.a: "젠장"
 germany_divide.6.t: "러시아와의 유대를 강화하는 §H[anarchist_communism_L]§!"
 germany_divide.6.d: "§H[anarchist_communism_L]§!이(가) 러시아와의 관계를 강화하여 러시아의 영향력이 우리나라에 스며들고 있습니다."
 germany_divide.6.a: "젠장"
 germany_divide.7.t: "공습을 진행하는 §H[anarchist_communism_L]§!"
 germany_divide.7.d: "§H[anarchist_communism_L]§! 지도부가 파업을 촉구했으며, 안타깝게도 일부는 이에 따르고 있는 것으로 보입니다."
 germany_divide.7.a: "우와."
 germany_divide.8.t: "해외 투자자를 몰아내는 §H[anarchist_communism_L]§!"
 germany_divide.8.d: "§H[anarchist_communism_L]§!이(가) 외국인 투자자들을 표적으로 삼아 괴롭히고 있으며, 일부는 아예 짐을 싸서 떠나고 있습니다."
 germany_divide.8.a: "젠장"
 germany_divide.9.t: "노동 조합을 시위로 내몬 §H[anarchist_communism_L]§!"
 germany_divide.9.d: "§H[anarchist_communism_L]§!이(가) 여러 도시에서 노동조합을 결집시켰으며, 이제 더 나은 임금과 근로 조건을 요구하고 있습니다."
 germany_divide.9.a: "젠장"
 germany_divide.10.t: "§H[anarchist_communism_L]§! media gains traction"
 germany_divide.10.d: "§H[anarchist_communism_L]§! 계열 언론이 최근 주목을 받고 있으며, 그 결과 더 많은 청중에게 영향을 미칠 수 있게 되었습니다."
 germany_divide.10.a: "젠장"
 germany_divide.11.t: "Russian media sways East Germans!"
 germany_divide.11.d: "러시아 언론이 일부 동독 소수 주민에게 영향을 미치기 시작했습니다. 수는 미미하지만, 가족 전체가 러시아의 선전과 언론에 세뇌되는 도미노 효과로 이어질 수 있습니다."
 germany_divide.11.a: "우리는 그 어떤 것도 할 수 있는게 없다"
 germany_divide.11.b: "외부 미디어 시청 시간을... 제한해라"
 germany_divide.12.t: "East Germans demand better job opportunities"
 germany_divide.12.d: "동부에 사는 일부 주민들이 이 지역에 더 나은 일자리 기회가 마련되기를 요구하기 시작했습니다. 우리 정부는 이들의 일상을 개선하려 노력해 왔지만 특정 분야에서는 어려움을 겪고 있습니다. 예산의 더 큰 부분을 할당하면 이 문제가 완화될 수도 있을 것입니다."
 germany_divide.12.a: "예산을 확대해라"
 germany_divide.12.b: "이건 그들 문제가 아닐까"
 germany_divide.13.t: "East Germans lose trust in our government"
 germany_divide.13.d: "동독 주민들이 언론에 나서서 사소한 행정 실책을 들어 우리 정부를 조롱하기 시작했습니다. 그들은 동부의 생활 여건을 제3세계 국가에 비유하며 여건 개선에 더 힘쓰라고 요구하고 있습니다. 물론 상당히 과장하고 있지만, 이에 대해 우리가 무엇을 할 수 있을까요?"
 germany_divide.13.a: "그래 알겠다, 우리 뭘 해줄 수 있는지 보자"
 germany_divide.13.b: "아 TV 좀 끄라고! 더 지껄이는 거 듣고 싶지 않아!"
 germany_divide.14.t: "East Germans migrate to the West"
 germany_divide.14.d: "최근 인구 통계에 따르면 상당수의 인구가 서독으로 이주했습니다. 이 추세가 계속되면 동독 경제가 결국 둔화되거나 심지어 붕괴할 수도 있습니다."
 germany_divide.14.a: "상관없는 일이다."
 germany_divide.14.b: "그들을 멈춰라!"
 germany_divide.15.t: "따라올 수 없는 경지에 이른 동독의 사업체들"
 germany_divide.15.d: "동독 기업들은 주로 서부에 기반을 둔 기업들과의 경쟁에서 밀렸습니다. 물론 동부에서 서독 기업의 존재감은 매우 크지만, 이들이 종종 소규모 신생 기업들을 압도하여 지역 경제에 타격을 줍니다."
 germany_divide.15.a: "중소 기업에 지원금 제공"
 germany_divide.15.b: "정말, 유감이군"
 germany_divide.16.t: "East Germans demand lower housing prices"
 germany_divide.16.d: "동독의 주택 가격이 지나치게 높은 것으로 보입니다. 많은 이들이 사람들이 집을 사고 정착하도록 돕는 정부 프로그램을 마련할 것을 요구하고 있습니다."
 germany_divide.16.a: "알겠다, 우리가 대주겠다"
 germany_divide.16.b: "안된다."
 germany_divide.17.t: "East Germans call for greater political representation"
 germany_divide.17.d: "동독 주민들은 우리가 정책 의제의 더 큰 부분을 동독 문제에 집중할 것을 요구하고 있습니다. 그들은 동독 주민과 그 대표자들에게 더 큰 목소리를 주는 방식으로 이를 달성하기를 원합니다."
 germany_divide.17.a: "안될 게 뭐 있나?"
 germany_divide.17.b: "안된다."
 germany_divide.18.t: "동독의 폐쇄되는 교회의 숫자 증가"
 germany_divide.18.d: "동독에서 점점 더 많은 교회가 문을 닫고 있으며 우리가 할 수 있는 일은 많지 않은 것으로 보입니다. 이는 동독의 무신론자 비율이 나라의 다른 지역보다 높아 종교의 인기가 낮기 때문입니다. 교회를 더 열 수는 있지만 현지 주민들에게는 공격적인 조치로 비칠 수 있습니다."
 germany_divide.18.a: "우리는 그 어떤 것도 할 수 있는게 없다"
 germany_divide.18.b: "그래, 더 많은 교회를 열어라"
 germany_divide.19.t: "동독의 사회 서비스 감소"
 germany_divide.19.d: "동독의 사회 서비스가 제 기능을 못하고 있어 이 지역에서 상당한 소동이 일고 있습니다. 이미 붕괴하고 있는 그곳의 체계를 살리기에는 너무 늦었을 수도 있지만, 일부 혜택을 맞바꾸어 체계를 구할 수 있을지도 모릅니다."
 germany_divide.19.a: "너무 늦었다"
 germany_divide.19.b: "좋은 생각이다, 그들의 이득을 대가로 변화를 꾀하자"
 germany_divide.20.t: "무너지는 동독의 민간 기반시설"
 germany_divide.20.d: "관리 부족의 결과로 동독의 기반 시설이 방치와 부적절한 관리로 인해 안으로 무너져 내리기 시작했습니다. 가능한 한 빨리 이 문제를 해결해야 합니다!"
 germany_divide.20.a: "Damn"
 germany_divide.20.b: "주요 부문 예산을 삭감하여 이를 고치자"
 bavaria.1.t: "[BAY.GetFlag] Bavarians call for independence"
 bavaria.1.d: "[BAY.GetFlag] Bavarians all across Bavaria have begun demanding independence. Our economic mismanagement, and reckless policies have pushed the people to the edge, so much so that they are demanding outright independence."
 bavaria.1.a: "잘가라, 바이에른"
 bavaria.2.t: "바이에른의 미래"
 bavaria.2.d: "오늘, 우리는 누가 바이에른의 집권당이 되어야 할지 결정할 것입니다. 물론 국민투표를 실시해 바이에른의 사람들이 결정하도록 놔둘 수도 있었겠지만, 그건 그들의 생각일 뿐이고, 중요한 건 오늘이 지나기전 우리가 어떻게 결정할지 입니다."
 bavaria.2.a: "바이에른 기독교사회연합 (CSU)"
 bavaria.2.b: "사회민주당 (SPD)"
 bavaria.2.c: "Die Grünen"
 GER_idea_afghan_bonus_1: "현지에서 지지를 얻는 우리 군"
 GER_idea_afghan_bonus_1_desc: "우리 군은 [AFG.GetFlag] 아프가니스탄에서 꽤 인기가 있으며, 그 결과 몇 가지 혜택을 누리고 있습니다."
 GER_idea_afghan_bonus_2: "현지에서 매우 인기있는 우리 군"
 GER_idea_afghan_bonus_2_desc: "우리 군은 [AFG.GetFlag] 아프가니스탄에서 매우 인기가 높으며, 그 결과 보상을 거두고 있습니다."
 GER_idea_afghan_bonus_3: "현지에서 인기를 독차지한 우리 군"
 GER_idea_afghan_bonus_3_desc: "우리 군은 [AFG.GetFlag] 아프가니스탄에서 믿기 어려울 만큼 인기가 높고 성공을 거두고 있으며, 그 결과 잃은 것보다 더 많은 것을 얻었습니다."
 GER_idea_afghan_bonus_4: "독일의 '테러와의 전쟁'의 유산"
 GER_idea_afghan_bonus_4_desc: "[AFG.GetFlag] 아프가니스탄에서의 우리의 노고 덕분에, 우리 군은 이제 수많은 임무에서 쌓은 유산을 향후 전쟁에 활용할 수 있게 됩니다."
 GER_idea_New_Ammunition: "혁신적인 탄약"
 GER_idea_paper_army: "무너지는 군부"
 GER_idea_deutsche_telekom: "도이체 텔레콤"
 GER_idea_health_reforms: "의료 개혁"
 GER_idea_hotels: "호텔 산업"
 GER_idea_DHL: "Modern Telekom & Deutsche Post"
 GER_idea_Privatisation_Post: "우편 민영화"
 GER_idea_Bergbaufolgelandschaften: "채굴 이후 환경 조성 작업"
 GER_idea_restructure_Infrastructure: "기반시설 재조직"
 GER_idea_Streitkraftegeinsame_Taktische_Feuerunterstutzung: "포병 사령부"
 GER_idea_drift_from_nuclear: "핵으로부터 변화"
 GER_idea_friends_with_east: "동쪽의 친구"
 GER_idea_german_order3: "기적의 무기 (Wunderwaffe) 계획"
 GER_war_machine: "독일 워머신 (War Machine)"
 GER_against_migrant: "반이민 정책"
 GER_idea_volmer_erlass1: "볼메르령 (Volmer-Erlass)"
 GER_idea_volmer_erlass2: "볼메르령 (Volmer-Erlass)"
 GER_idea_volmer_erlass3: "볼메르령 (Volmer-Erlass)"
 german_legacy: "독일의 유산"
 german_legacy_desc: "§YSpecial Rules:§!\n---\n§RWe cannot have§! §6Nuclear Doctrine§! §Ror develop§! §6Nuclear weapons!§!\n---\n§RWe cannot manually increase our military spending!§!\n---\n§RThe Army is limited to 370.000 Active Personnel (240.000 in army)!§!\n---\n§RWe cannot manually increase our administration!§!\n---\n§YCDU/CSU and SPD§! can always form coalition.\n---\n§YCan§! §RBan§! §Yextremist parties§!\n---\nWith the weight of Nazi war crimes on their shoulders, and as the instigator of the 1st & 2nd World War, Germany has worked hard to shed its bad image by refraining from even hinting towards a nationalistic outlook or militarism. In legal terms, Germany is bound by the 1990 Treaty on the 'Final Settlement with Respect to Germany', between Germany and the allied powers of the Soviet Union, United States, United Kingdom and France, as well as a separate final border treaty with Poland.\nThis treaty makes it illegal for Germany to ever make territorial claims, possess nuclear weapons and limits its armed forces to less than 370.000 personnel (220.000 in game) in total.\n§W--------------§!\nThis national spirit can be §RRemoved§! if we complete the §HOur New Legacy§! Focus."
 GER_idea_johannes_rau: "요하네스 라우 연방 대통령"
 GER_idea_roman_herzog: "로만 헤어초크 연방 대통령"
 GER_idea_bmw_company: "BMW 계약"
 GER_idea_bmw_company_desc: "BMW는 연방방위군의 다목적 차량 부대에 필수 부품, 장비 및 정비를 제공하도록 부분적으로 하청 계약을 맺었습니다."
 GER_idea_mercedes_benz_company: "메르세데스-벤츠 계약"
 GER_idea_mercedes_benz_company_desc: "메르세데스-벤츠는 연방방위군의 다목적 차량 부대에 필수 부품, 장비 및 정비를 제공하도록 부분적으로 하청 계약을 맺었습니다."
 GER_idea_rhineland_industry: "라인란트 산업"
 GER_idea_rhineland_industry_desc: "라인란트팔츠는 이 나라의 중심 산업 및 건설 지역 중 하나이며, 강철과 석탄 같은 천연자원을 가장 많이 수출하는 지역 중 하나이기도 합니다."
 GER_idea_war_reparations: "전쟁 배상금으로 인한 부채"
 GER_idea_war_reparations_desc: "The past of Germany's previous crimes through-out the 1st and 2nd World War still loom over its head; as does its mass of war reparation debt, owed to the Allies.\nIt will take years to pay off this debt, we estimate it will be §YOctober 2010§! roughly before it is fully paid off.\n§W--------------§!\nThis national spirit will be §Gautomatically Removed§! once we have §YPaid Off Our War Debt§!, or we can §RRemove§! it by completing the §HEnd of War Reparations§! Focus."
 GER_idea_renewable_energy_projects_phase_one: "재생에너지 프로젝트: 1 단계"
 GER_idea_renewable_energy_projects_phase_one_desc: "독일이 기존 에너지에서 벗어나 친환경 에너지의 길로 나아가면서, 독일 재생 에너지 사업의 '1단계'가 시작되어 보다 친환경적인 미래의 토대를 닦기 시작합니다."
 GER_idea_renewable_energy_projects_phase_two: "재생에너지 프로젝트: 2 단계"
 GER_idea_renewable_energy_projects_phase_two_desc: "더 친환경적인 독일을 위해 더 많은 자금과 지속적인 지원을 제공함에 따라, 재생 에너지 사업의 '2단계'가 시작됩니다. "
 GER_idea_renewable_energy_projects_complete: "재생에너지 프로젝트"
 GER_idea_renewable_energy_projects_complete_desc: "독일은 이제 유럽에서 가장 친환경적인 국가 중 하나입니다. 바이오매스, 태양광, 육상 및 해상 풍력 발전 단지에 대한 최근의 투자로 독일은 대규모 재생 에너지 사업을 완료하였으며, 이는 앞으로 수십 년간 국가에 더 깨끗한 에너지를 공급할 것입니다."
 GER_idea_carbon_neutral: "재생 가능 에너지 국가"
 GER_idea_carbon_neutral_desc: "독일이 재생 에너지에 전적으로 의존하는 국가가 되고 화석 연료에서 전환함에 따라, 국가는 낡은 에너지 생산 방식을 뒤로하려 합니다.\n\n§Y우리가§! §6원자력 에너지§! §Y지위를 가지게 되면 더 이상§! §G재생 에너지 국가§!§Y가 아닙니다!§!"
 GER_idea_nationalised_energy_companies: "국유화된 에너지 기업들"
 GER_idea_nationalised_energy_companies_desc: "수년 동안 민간 에너지 기업들은 탐욕으로 독일 국민을 착취해 왔습니다. 이제 독일 정부가 통제권을 되찾고 국민에게 공정한 에너지 가격을 제공할 때입니다."
 GER_idea_nuclear_power_country: "원자력 발전 국가"
 GER_idea_nuclear_power_country_desc: "독일은 깨끗한 원자력 에너지로 가동되는 유럽의 원자력 강국이 되었습니다. 태양광 같은 시시한 것은 필요 없습니다!\n\n§Y다음의 경우 더 이상§! §6원자력 국가§! §Y가 아닙니다:§! §G녹색당§! §Y이 집권하거나 연립에 참여하는 경우,§! §Y또는 우리가§! §6원자력 에너지§! §Y지위를 제거하는 경우!§!"
 GER_idea_aging_population: "고령 인구"
 GER_idea_aging_population_desc: "With our aging national population, we are in a decline in population growth and increased budget on our civil services.\n§W--------------§!\nThis national spirit can be §RRemoved§! if we complete the §HStiff Competition§! Focus, or the §HAdopt China's Policy§! Focus"
 GER_idea_increased_population_growth: "인구 성장률 증가"
 GER_increased_population_growth_idea_desc: "최근 의약품 판매가 급증하면서 인구 증가에도 그 영향이 나타났습니다."
 GER_idea_nuclear_expansion1: "핵 확장"
 GER_idea_nuclear_expansion2: "핵 확장"
 GER_idea_nuclear_expansion3: "핵 확장"
 GER_idea_nuclear_expansion4: "핵 확장"
 GER_idea_nuclear_expansion5: "핵 확장"
 GER_idea_stagnating_economy1: "경제 침체"
 GER_idea_stagnating_economy1_desc: "우리 경제는 정체기에 접어들어 거의 성장하지 못하는 시기를 겪고 있습니다."
 GER_idea_unemployment_crisis: "실업 위기"
 GER_idea_unemployment_crisis_desc: "The Unemployment rate has been entangled with the conditions brought about by the impact of economic challenges from the post-unification of Germany, the persistence of a rigid labor market, and demographic factors.\n§W--------------§!\nThis national spirit can be §RRemoved§! if we complete the §HEin Aktives Deutschland§! Focus or the §HEin Digitales Deutschland§! Focus."
 GER_idea_okosteuer: "환경세"
 GER_idea_okosteuer_desc: "Ökosteuer (Eco-Tax) is a form of environmental tax introduced to help meet EU environmental laws and targets. It's targeted at large industries to cover the costs of environmental damages caused by the consumption of energy i.e Electricity, Burning of fossil fuels etc.\n§W--------------§!\nThis national spirit can be §RRemoved§! if we complete the §HCampaign Against The EU§! or §HCrusade Against Democracy§! Focus."
 GER_idea_germany_divided: "동-서의 분리"
 GER_idea_germany_divided_desc: "Though East and West of Germany was re-unified in 1990, there is still a noticeable divide in both social and infrastructure aspects.\n§W--------------§!\nThis national spirit can be §RRemoved§! if we complete the §HTrue Unification§! Focus, build §H4 Infrastructure§! in the Eastern States, and get §H1000 Productivity§! in those states."
 GER_idea_fuck_versailles: "베르사유의 복수"
 GER_idea_fuck_versailles_desc: "베르사유 조약은 사기였으며 독일을 경제적으로, 도덕적으로 파괴했습니다. 조약의 조건은 우리 국민과 생계에 대한 공격이었으며, 우리는 이를 용납하지 않을 것입니다!\n이 조건들은 무시될 것입니다!\n§W--------------§!\n이 국가 정신은 §Y카이저§!가 집권하고 있지 않으면 §R제거§!됩니다!"
 GER_idea_crusade_against_democracy: "민주주의를 향한 십자군 원정"
 GER_idea_crusade_against_democracy_desc: "민주주의는 '미국의 실험'에서 비롯된 역병이며 사기에 불과하고, 중단되어야 합니다!\n§W--------------§!\n이 국가 정신은 §Y카이저§!가 집권하고 있지 않으면 §R제거§!됩니다!"
 GER_idea_extended_work_hours: "노력에는 그만한 대가를"
 GER_idea_extended_work_hours_desc: "제국에는 게으름뱅이를 위한 시간이 없습니다! 제국의 생산이 원활하게 돌아가려면 강하고 근면한 인력이 필요합니다.\n§W--------------§!\n이 국가 정신은 §Y카이저§!가 집권하고 있지 않으면 §R제거§!됩니다!"
 GER_idea_Leopard_Nutzergemeinschaft: "레오벤 커뮤니티 (LeoBen Gemeinschaft)"
 GER_idea_volk: " The People "
 GER_idea_volk_desc: "우리는 국민을 부양하는 데 뿌리를 둔 정당이며, 실제로 그렇게 해 나가고 있습니다. 최근 우리는 국가의 생산성을 높이기 위한 다수의 정책을 추진하였고, 이를 통해 일자리를 찾는 이들을 위한 일자리와 직위가 늘어났습니다.\n이 국가 정신은 §YAfD§!가 집권하고 있지 않으면 §R제거§!됩니다"
 GER_idea_vaterland: " The Fatherland "
 GER_idea_vaterland_desc: "우리 정당의 핵심 가치 중 하나는 독일의 정체성을 지키는 것입니다. 강력한 군대를 확보하면 우리에게 맞서는 자들로부터 그 정체성을 지킬 수 있습니다.\n이 국가 정신은 §YAfD§!가 집권하고 있지 않으면 §R제거§!됩니다"
 GER_idea_german_heritage: "독일의 문화유산에 대한 자부심"
 GER_idea_german_heritage_desc: "우리 독일인이 자랑스러워하는 것이 있다면, 그것은 바로 우리의 유산입니다. 폭스바겐에서 옥토버페스트에 이르기까지, 우리는 정말이지 자부심 넘치는 민족입니다!\n이 국가 정신은 §YAfD§!가 집권하고 있지 않으면 §R제거§!됩니다"
 GER_idea_anti_lgbt: "성소수자에 대한 반대"
 GER_idea_anti_lgbt_desc: "LGBT는 우리 사회와 아이들에게 해롭습니다. 이는 우리 시민들에게 설파되어서는 안 되는 것입니다.\n이 국가 정신은 §YAfD§!가 집권하고 있지 않으면 §R제거§!됩니다"
 GER_idea_sustainable_development: "지속 가능한 개발"
 GER_idea_sustainable_development_desc: "우리는 친환경 국가이며 탄소 발자국을 줄이고 지속 가능한 기반시설을 건설하는 데 전념하고 있습니다."
 GER_idea_greater_regulations: "강경한 규제"
 GER_idea_greater_regulations_desc: "규제 강화는 노동자와 시민에게 더 나은 사회적 보호와 더 많은 노동자 권리를 제공합니다.\n이 국가 정신은 §Y녹색당§!이 집권하거나 연립에 참여하고 있지 않으면 §R제거§!됩니다!"
 GER_idea_duetch_reichsban: "독일 철도 계약"
 GER_idea_duetch_reichsban_desc: "독일 철도망을 확장하기 위해 도이체 반과 계약을 체결하였습니다."
 GER_idea_decreased_population_growth: "인구 성장률 감소"
 GER_idea_decreased_population_growth_desc: "특정 정책을 채택함으로써 우리는 인구 증가를 엄격하게 관리해 왔으며, 현재 인구 증가율이 감소하고 있습니다."
 GER_idea_free_market_economy: "자유시장 경제"
 GER_idea_free_market_economy_desc: "우리는 자유 시장 원칙에 따라 경제를 운영하며, 누구에게나 자유로운 이용을 허용합니다.\n이 국가 정신은 §YFDP§!가 집권하거나 연립에 참여하고 있지 않으면 §R제거§!됩니다!"
 GER_idea_stern_nato_commitment: "NATO의 헌신"
 GER_idea_stern_nato_commitment_desc: "우리는 자랑스럽고 헌신적인 나토 회원국입니다.\n§W--------------§!\n이 국가 정신은 §YFDP§!가 집권하거나 연립에 참여하고 있지 않으면 §R제거§!됩니다!"
 GER_idea_cybersecurity: "사이버 보안"
 GER_idea_cybersecurity_desc: "독일은 외국 공격자들의 보안 공격을 막기 위해 철저한 사이버 보안 방화벽을 갖추고 있습니다.\n이 국가 정신은 §YFDP§!가 집권하거나 연립에 참여하고 있지 않으면 §R제거§!됩니다!"
 GER_idea_pacifist_nation: "평화주의 국가"
 GER_idea_pacifist_nation_desc: "독일은 과거에 세계에 충분한 피해를 입혔습니다. 오늘 우리는 꽃을 들고 평화를 요청합니다.\n이 국가 정신은 §Y좌파당§!이 집권하고 있지 않으면 §R제거§!됩니다!"
 GER_idea_bmvi: "연방 교통 및 디지털 인프라 사업부(BMVI)"
 GER_idea_bmvi_desc: "연방 디지털교통부\n§W--------------§!\n이 국가 정신은 §YCDU/CSU§!가 집권하고 있지 않으면 §R제거§!됩니다!"
 GER_idea_farming_practices: "농업 전통"
 GER_idea_farming_practices_desc: "우리나라에는 이용 가능한 광대한 농경지와 평야가 있으며, 이러한 새로운 영농 방식은 이를 최대한 활용할 수 있게 해 줍니다.\n§W--------------§!\n이 국가 정신은 §YCDU/CSU§!가 집권하고 있지 않으면 §R제거§!됩니다!"
 GER_idea_european_values: "유럽의 가치"
 GER_idea_european_values_desc: "유럽 연합 회원국으로서 우리는 유럽의 가치를 준수합니다.\n§W--------------§!\n이 국가 정신은 §YCDU/CSU§!가 집권하고 있지 않으면 §R제거§!됩니다!"
 GER_idea_agenda: "2010년 의제"
 GER_idea_agenda_desc: "어젠다 2010은 2010년까지 독일이 도달하기를 희망하는 모습에 대한 10개년 구상입니다.\n§W--------------§!\n이 국가 정신은 §YSPD§!가 집권하고 있지 않으면 §R제거§!됩니다!"
 GER_idea_german_order: "독일의 질서"
 GER_idea_german_order_desc: "독일의 질서는 우리 나라를 과거의 영광으로 되돌리기 위해 반드시 지켜져야 합니다.\n이 국가 정신은 §YNPD§!가 집권하고 있지 않으면 §R제거§!됩니다!"
 GER_idea_pride_in_history: "자랑스런 역사"
 GER_idea_pride_in_history_desc: "우리는 독일인이며 자랑스럽습니다! 그 무엇도 우리의 역사와 우리가 이룬 업적에 대한 자부심을 막을 수 없습니다.\n이 국가 정신은 §YNPD§!가 집권하고 있지 않으면 §R제거§!됩니다!"
 GER_idea_retention_law_comm: "통신 보관법 "
 GER_idea_retention_law_comm_desc: "시민의 데이터를 일정 기간 보관해 두면 국민이 무엇을 하고 무엇을 열람하는지 파악할 수 있습니다..."
 GER_idea_formidable_army: "가용가능한 전력"
 GER_idea_formidable_army_desc: "우리 군대의 위력은 군화 밑창으로 나라의 적들을 짓밟을 것입니다!"
 GER_idea_kebab_withdrawl: "Kebab Withdrawal"
 GER_idea_kebab_withdrawl_desc: "최근 독일계 튀르크인들이 추방되면서 케밥 가게를 운영할 사람이 없어졌고, 시민들이 그 여파를 체감하고 있습니다."
 GER_idea_crackheads: "만연한 약물 중독"
 GER_idea_crackheads_desc: "[THIS.GetName] 전역에서 모든 마약이 합법화된 이후, 빈곤한 지역 사회에서 크랙 중독이라는 새로운 전염병이 확산되었습니다.\n§W--------------§!\n이 국가 정신은 §H고도화된 보편적 의료§!를 갖추면 §R제거§!될 수 있습니다."
