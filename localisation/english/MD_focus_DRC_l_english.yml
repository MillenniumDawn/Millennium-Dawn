 mdrc_policy.4.t: "The Next Congolese Generation"
 mdrc_policy.4.d: "Reconstruction has produced institutions capable of planning beyond the next emergency. The cabinet can now concentrate its next two-year programme on laboratories, industrial renewal, or public works. The national renaissance spirit remains regardless of this choice."
 mdrc_policy.4.a: "Build a research partnership programme."
 mdrc_policy.4.b: "Renew industrial production."
 mdrc_policy.4.c: "Expand public works."
 MDRC_project_river_storage: "Congo River Storage Cooperatives"
 MDRC_project_river_storage_desc: "Complete one agricultural district in Bandundu. Costs 0.75 treasury and 50 political power. Requires ownership and control of the project state. This is a one-time project; funds are deducted when it is commissioned."
 MDRC_project_river_storage_tt: "Unlocks the one-time project: Congo River Storage Cooperatives (0.75 treasury and 50 political power)."
 MDRC_project_export_park: "Expand the Matadi Export Park"
 MDRC_project_export_park_desc: "Complete one civilian factory in Bas-Congo. Costs 2 treasury and 75 political power. Requires ownership and control of the project state. This is a one-time project; funds are deducted when it is commissioned."
 MDRC_project_export_park_tt: "Unlocks the one-time project: Expand the Matadi Export Park (2 treasury and 75 political power)."
 MDRC_project_processing_works: "Expand the Katanga Processing Works"
 MDRC_project_processing_works_desc: "Complete one civilian factory in Katanga. Costs 2 treasury and 75 political power. Requires ownership and control of the project state. This is a one-time project; funds are deducted when it is commissioned."
 MDRC_project_processing_works_tt: "Unlocks the one-time project: Expand the Katanga Processing Works (2 treasury and 75 political power)."
 MDRC_project_power_extension: "Commission an Inga Network Extension"
 MDRC_project_power_extension_desc: "Complete one renewable-energy infrastructure level in Bas-Congo. Costs $8.5 billion from the treasury and 75 political power. Requires ownership and control of the project state. This is a one-time project; funds are deducted when it is commissioned."
 MDRC_project_power_extension_tt: "Unlocks the one-time project: Commission an Inga Network Extension (1.5 treasury and 75 political power)."
 MDRC_project_provincial_internet: "Extend Internet Access into Bandundu"
 MDRC_project_provincial_internet_desc: "Complete one internet-station level in Bandundu. Space for the additional level must be available. Costs 0.5 treasury and 50 political power. Requires ownership and control of the project state. This is a one-time project; funds are deducted when it is commissioned."
 MDRC_project_provincial_internet_tt: "Unlocks the one-time project: Extend Internet Access into Bandundu (0.5 treasury and 50 political power)."
 MDRC_project_customs_offices: "Build the Matadi Customs Service Centre"
 MDRC_project_customs_offices_desc: "Complete one office-sector building in Bas-Congo. Costs 1 treasury and 50 political power. Requires ownership and control of the project state. This is a one-time project; funds are deducted when it is commissioned."
 MDRC_project_customs_offices_tt: "Unlocks the one-time project: Build the Matadi Customs Service Centre (1 treasury and 50 political power)."
 MDRC_project_kivu_cooperatives: "Resettle Kivu Farming Cooperatives"
 MDRC_project_kivu_cooperatives_desc: "Complete one agricultural district in South Kivu. Costs 0.75 treasury and 50 political power. Requires ownership and control of the project state. This is a one-time project; funds are deducted when it is commissioned."
 MDRC_project_kivu_cooperatives_tt: "Unlocks the one-time project: Resettle Kivu Farming Cooperatives (0.75 treasury and 50 political power)."
 MDRC_project_arsenal_tools: "Refit the Katanga Maintenance Workshops"
 MDRC_project_arsenal_tools_desc: "Complete one military factory in Katanga. Costs 1.5 treasury and 75 political power. Requires ownership and control of the project state. This is a one-time project; funds are deducted when it is commissioned."
 MDRC_project_arsenal_tools_tt: "Unlocks the one-time project: Refit the Katanga Maintenance Workshops (1.5 treasury and 75 political power)."
 MDRC_requires_democratic: "A Western party must be in power."
 MDRC_republic_petition: "A Right to Petition"
 MDRC_republic_petition_desc: "Give citizens a lawful route to challenge administrative decisions. Published responses make government answerable between elections. The programme provides the political, social or administrative resources shown in its rewards. Enter petitions in a common case register with deadlines. Repeated complaints become evidence for institutional reform. Additional effects: Treasury Reconstruction Team for 180 days, including its listed upkeep; one 20% computing research bonus. Each reform immediately improves Congolese Constitutional Accountability; its exact changes and ongoing costs are listed in the effects."
 MDRC_republic_bar: "An Independent Bar Association"
 MDRC_republic_bar_desc: "Train public defenders and establish professional standards for legal representation. Provincial legal aid brings constitutional guarantees within reach. A one-year national programme supports implementation. Fund legal-aid training and protect professional discipline from political interference. Accessible representation strengthens public justice. Additional effects: +1 stability percentage points; -10 political power. Each reform immediately improves Congolese Constitutional Accountability; its exact changes and ongoing costs are listed in the effects."
 MDRC_republic_records_research: "Congolese republic records Programme"
 MDRC_republic_records: "Open the Public Records"
 MDRC_republic_records_desc: "Create an accessible archive of budgets, appointments and land decisions. Records give legislators and journalists evidence to scrutinize official claims. Grants one 25% research bonus in the relevant field. Cross-reference land, concession and procurement records. Transparency exposes duplicated obligations and lost fees. Additional effects: +15 political power; +0.1 treasury. Each reform immediately improves Congolese Constitutional Accountability; its exact changes and ongoing costs are listed in the effects."
 MDRC_republic_ombudsman: "An Independent Ombudsman"
 MDRC_republic_ombudsman_desc: "Let citizens report administrative abuse to an office protected from ministerial dismissal. Case reviews turn individual complaints into practical reforms. The programme provides the political, social or administrative resources shown in its rewards. Refer repeated abuses to the responsible inspectorate. Mediation resolves complaints before they become wider confrontations. Additional effects: +1 stability percentage points; Ceasefire Liaison Network for 180 days, including its listed upkeep. Each reform immediately improves Congolese Constitutional Accountability; its exact changes and ongoing costs are listed in the effects."
 MDRC_republic_term_limits: "Enforce Presidential Term Limits"
 MDRC_republic_term_limits_desc: "Publish succession procedures and protect the institutions that administer elections. Predictable transfers of office reduce the incentive to settle disputes outside the constitution. A one-year national programme supports implementation. Prepare administrative handovers before the presidency changes. Incumbent allies surrender discretion while partners gain confidence in continuity. Additional effects: -20 political power; reciprocal +25 opinion with BEL only when those countries exist and are at peace with DRC. Each reform immediately improves Congolese Constitutional Accountability; its exact changes and ongoing costs are listed in the effects."
 MDRC_republic_committee: "Parliamentary Budget Committees"
 MDRC_republic_committee_desc: "Give the assembly trained analysts and time to examine expenditure. Oversight must continue after a budget receives its ceremonial approval. A one-year national programme supports implementation. Review multiyear commitments and cancel duplicated contracts. Parliamentary scrutiny releases funds lost between conflicting appropriations. Additional effects: -10 political power; +0.15 treasury. Each reform immediately improves Congolese Constitutional Accountability; its exact changes and ongoing costs are listed in the effects."
 MDRC_republic_unions: "A Labour Consultation Council"
 MDRC_republic_unions_desc: "Bring employers and independent unions into negotiations over workplace standards. Regular consultation gives industrial reform a wider constituency. The programme provides the political, social or administrative resources shown in its rewards. Unions and employers will negotiate training and workplace procedures. Rehabilitation teams help firms implement their agreement. Additional effects: +1 stability percentage points; Industrial Rehabilitation for 180 days, including its listed upkeep. Each reform immediately improves Congolese Constitutional Accountability; its exact changes and ongoing costs are listed in the effects."
 MDRC_republic_competition_research: "Congolese republic competition Programme"
 MDRC_republic_competition: "A Competition Authority"
 MDRC_republic_competition_desc: "Review exclusive concessions and give domestic suppliers a route to contest unfair tenders. Competition policy should produce opportunities beyond politically connected firms. Grants one 25% research bonus in the relevant field. Review exclusive contracts and reopen tenders to domestic suppliers. Competition recovers a modest sum while limiting privileged access. Additional effects: -10 political power; +0.1 treasury; one 20% production lines research bonus. Each reform immediately improves Congolese Constitutional Accountability; its exact changes and ongoing costs are listed in the effects."
 MDRC_republic_civic_research: "Congolese republic civic Programme"
 MDRC_republic_civic: "Civic Education in Every Province"
 MDRC_republic_civic_desc: "Explain electoral rights and public accountability through schools and local associations. Democratic institutions need informed participation as well as legal texts. Grants one 25% research bonus in the relevant field. Community organizations will explain voting, petitions and public accounts. Informed participation sustains constitutional protections between elections. Additional effects: +1 stability percentage points; +15 political power; one 20% information technology research bonus. Each reform immediately improves Congolese Constitutional Accountability; its exact changes and ongoing costs are listed in the effects."
 MDRC_republic_devolution: "Accountable Local Government"
 MDRC_republic_devolution_desc: "Publish municipal budgets and protect elected councils from arbitrary interference. Local democracy complements national institutions while keeping their responsibilities clear. A one-year national programme supports implementation. Equip municipal councils with procurement procedures and project supervisors. Local autonomy carries published responsibilities for works. Additional effects: -10 political power; Reconstruction Works for 180 days, including its listed upkeep. Each reform immediately improves Congolese Constitutional Accountability; its exact changes and ongoing costs are listed in the effects."
 MDRC_republic_settlement: "Western Institutions for a Generation"
 MDRC_republic_settlement_desc: "Bring the institutional, administrative and social branches of this political programme into a common long-term settlement. A one-year works programme supports the transition from emergency reform to normal government. Link parliament, universities and municipalities through policy evaluation. The constitutional settlement can improve policy through evidence as well as competition. Additional effects: Research Partnerships for 365 days, including its listed upkeep; reciprocal +25 opinion with USA only when those countries exist and are at peace with DRC. Each reform immediately improves Congolese Constitutional Accountability; its exact changes and ongoing costs are listed in the effects. Reveals the Central African Federation and United States of Central Africa decisions in Regional Unions and Integration. Unmet political and territorial requirements are shown on each decision. Formation preserves puppets."
 MDRC_requires_communism: "A Emerging party must be in power."
 MDRC_continuity_congress: "A National Reconstruction Congress"
 MDRC_continuity_congress_desc: "Bring the governing movement, provincial delegates and reconstruction specialists together. Their programme will turn political authority into a defined set of public commitments. The programme provides the political, social or administrative resources shown in its rewards. Adopt measurable production and service commitments. Debate exposes disagreements but gives the approved plan a clearer mandate. Additional effects: -1 stability percentage points; +25 political power. Each reform immediately improves Congolese Developmental Planning; its exact changes and ongoing costs are listed in the effects."
 MDRC_continuity_planning_research: "Congolese continuity planning Programme"
 MDRC_continuity_planning: "A Permanent Planning Commission"
 MDRC_continuity_planning_desc: "Employ statisticians and engineers to assess reconstruction proposals. A plan becomes useful when ministries can measure its progress and revise failed assumptions. Grants one 25% research bonus in the relevant field. Compile statistics independently of ministries competing for funds. Researchers must measure productive capacity rather than nominal targets. Additional effects: -10 political power; Research Partnerships for 180 days, including its listed upkeep; one 20% computing research bonus. Each reform immediately improves Congolese Developmental Planning; its exact changes and ongoing costs are listed in the effects."
 MDRC_continuity_cooperatives: "Producer Cooperatives"
 MDRC_continuity_cooperatives_desc: "Support cooperative purchasing and repair services for small producers. Shared facilities can overcome shortages that individual workshops cannot. A one-year national programme supports implementation. Pool agricultural purchases and repair facilities through producer cooperatives. Shared services let small producers participate in development. Additional effects: +0.05 treasury; Rural Recovery for 180 days, including its listed upkeep; one 20% agriculture research bonus. Each reform immediately improves Congolese Developmental Planning; its exact changes and ongoing costs are listed in the effects."
 MDRC_continuity_labour: "Labour and Production Councils"
 MDRC_continuity_labour_desc: "Create workplace consultation boards that connect production targets to conditions on the shop floor. These councils must report practical shortages rather than flattering statistics. A one-year national programme supports implementation. Workplace councils will report shortages directly to planners. Workers gain a formal role in making targets achievable. Additional effects: +1 stability percentage points; Industrial Rehabilitation for 180 days, including its listed upkeep. Each reform immediately improves Congolese Developmental Planning; its exact changes and ongoing costs are listed in the effects."
 MDRC_continuity_housing: "Workers Housing Programme"
 MDRC_continuity_housing_desc: "Coordinate serviced plots and municipal works near employment centres. Better living conditions strengthen the social foundation of reconstruction. A one-year national programme supports implementation. Include sanitation and employment access in housing projects. Health teams support settlements growing around reconstruction industries. Additional effects: -10 political power; Community Health for 180 days, including its listed upkeep; one 20% construction research bonus. Each reform immediately improves Congolese Developmental Planning; its exact changes and ongoing costs are listed in the effects."
 MDRC_continuity_cadres: "A Professional Cadre Secretariat"
 MDRC_continuity_cadres_desc: "Require party-appointed administrators to meet common standards of competence. Public administration must retain technical knowledge across political reshuffles. The programme provides the political, social or administrative resources shown in its rewards. Require professional examinations and accounting instruction for appointed cadres. Technical competence reduces reliance on personal connections. Additional effects: +15 political power; Treasury Reconstruction Team for 180 days, including its listed upkeep. Each reform immediately improves Congolese Developmental Planning; its exact changes and ongoing costs are listed in the effects."
 MDRC_continuity_inspectorate: "The Reconstruction Inspectorate"
 MDRC_continuity_inspectorate_desc: "Send rotating inspection teams to projects receiving central funds. Reports should identify missing materials and unfinished works before they become permanent losses. A one-year national programme supports implementation. Compare physical deliveries with recorded expenditure. Recoveries strengthen the plan, although exposed failures damage confidence. Additional effects: -1 stability percentage points; +0.15 treasury. Each reform immediately improves Congolese Developmental Planning; its exact changes and ongoing costs are listed in the effects."
 MDRC_continuity_rural_admin_research: "Congolese continuity rural admin Programme"
 MDRC_continuity_rural_admin: "Rural Administrative Posts"
 MDRC_continuity_rural_admin_desc: "Reopen local administrative offices and give them reliable communications. State authority must provide useful services beyond major towns. Grants one 25% research bonus in the relevant field. District offices will coordinate extension services and public records. State presence must assist communities as well as collect reports. Additional effects: +1 stability percentage points; Rural Recovery for 180 days, including its listed upkeep. Each reform immediately improves Congolese Developmental Planning; its exact changes and ongoing costs are listed in the effects."
 MDRC_continuity_technology_research: "Congolese continuity technology Programme"
 MDRC_continuity_technology: "Technology Transfer Institutes"
 MDRC_continuity_technology_desc: "Train engineers to adapt imported production methods to local maintenance and supply conditions. A working transfer programme leaves domestic expertise behind. Grants one 25% research bonus in the relevant field. Document imported production methods and train maintenance staff. Cooperation should leave expertise rather than permanent contractor dependence. Additional effects: Research Partnerships for 180 days, including its listed upkeep; reciprocal +25 opinion with SOV only when those countries exist and are at peace with DRC; one 20% industry research bonus. Each reform immediately improves Congolese Developmental Planning; its exact changes and ongoing costs are listed in the effects."
 MDRC_continuity_social_guarantee: "A Charter of Social Guarantees"
 MDRC_continuity_social_guarantee_desc: "Publish the services the state promises to deliver and the institutions responsible for them. Social legitimacy depends on commitments that citizens can recognize in daily life. The programme provides the political, social or administrative resources shown in its rewards. Publish minimum service commitments and their responsible institutions. Guarantees strengthen legitimacy while limiting discretionary allocation. Additional effects: +2 stability percentage points; -15 political power. Each reform immediately improves Congolese Developmental Planning; its exact changes and ongoing costs are listed in the effects."
 MDRC_continuity_settlement: "Emerging Institutions for a Generation"
 MDRC_continuity_settlement_desc: "Bring the institutional, administrative and social branches of this political programme into a common long-term settlement. A one-year works programme supports the transition from emergency reform to normal government. Connect planning, producer councils and social guarantees through an audited budget. Consolidation removes duplicate appropriations and sustains rehabilitation. Additional effects: +0.15 treasury; Industrial Rehabilitation for 365 days, including its listed upkeep; one 20% robotics research bonus. Each reform immediately improves Congolese Developmental Planning; its exact changes and ongoing costs are listed in the effects. Reveals the Central African People's Union and Union of African Socialist Republics decisions in Regional Unions and Integration. Unmet political and territorial requirements are shown on each decision. Formation preserves puppets."
 MDRC_requires_neutrality: "A Non-Aligned party must be in power."
 MDRC_federal_senate: "A Senate of the Provinces"
 MDRC_federal_senate_desc: "Give provincial representatives a chamber for negotiating national legislation. Regional interests can be heard without fragmenting the Republic. The programme provides the political, social or administrative resources shown in its rewards. Scrutinize legislation changing provincial powers and revenue. Negotiation takes effort but reduces destructive jurisdictional disputes. Additional effects: -15 political power; +1 stability percentage points. Each reform immediately improves The Congolese Provincial Compact; its exact changes and ongoing costs are listed in the effects."
 MDRC_federal_boundaries: "A Provincial Boundary Commission"
 MDRC_federal_boundaries_desc: "Resolve administrative boundary disputes through published evidence and consultation. Clear responsibilities reduce conflict over taxation and services. A one-year national programme supports implementation. Register disputed administrative responsibilities publicly. Shared evidence can settle conflicts before services are interrupted. Additional effects: +10 political power; Ceasefire Liaison Network for 180 days, including its listed upkeep. Each reform immediately improves The Congolese Provincial Compact; its exact changes and ongoing costs are listed in the effects."
 MDRC_federal_equalisation: "Equalisation Grants"
 MDRC_federal_equalisation_desc: "Design transfers that support provinces with weaker tax bases. National solidarity must survive differences in mineral wealth and commercial access. A one-year national programme supports implementation. Tie equalisation grants to published commitments in poorer provinces. Solidarity should not depend on personal agreements between elites. Additional effects: +1 stability percentage points; Rural Recovery for 180 days, including its listed upkeep. Each reform immediately improves The Congolese Provincial Compact; its exact changes and ongoing costs are listed in the effects."
 MDRC_federal_courts: "Provincial Constitutional Courts"
 MDRC_federal_courts_desc: "Train provincial courts to resolve disputes between local and national authorities. Federalism needs reliable arbitration as well as decentralization. The programme provides the political, social or administrative resources shown in its rewards. Train courts to settle provincial tax disputes. Enforceable responsibilities protect federalism from recurring fiscal confrontation. Additional effects: -10 political power; Treasury Reconstruction Team for 180 days, including its listed upkeep. Each reform immediately improves The Congolese Provincial Compact; its exact changes and ongoing costs are listed in the effects."
 MDRC_federal_council: "A Council of Provincial Premiers"
 MDRC_federal_council_desc: "Establish regular meetings between provincial executives and the national government. Joint decisions make cross-border services possible without dissolving local authority. A one-year national programme supports implementation. Maintain a joint secretariat for roads, utilities and markets. Cooperation creates national networks without dissolving local authority. Additional effects: +15 political power; Reconstruction Works for 180 days, including its listed upkeep. Each reform immediately improves The Congolese Provincial Compact; its exact changes and ongoing costs are listed in the effects."
 MDRC_federal_chiefs: "A Charter for Customary Authorities"
 MDRC_federal_chiefs_desc: "Define the relationship between customary leadership, elected councils and national law. Clear limits can preserve local knowledge while protecting public rights. The programme provides the political, social or administrative resources shown in its rewards. Define customary responsibilities and the public rights constraining them. Mediation preserves local knowledge while keeping power accountable. Additional effects: +1 stability percentage points; Ceasefire Liaison Network for 180 days, including its listed upkeep. Each reform immediately improves The Congolese Provincial Compact; its exact changes and ongoing costs are listed in the effects."
 MDRC_federal_land_research: "Congolese federal land Programme"
 MDRC_federal_land: "Provincial Land Registers"
 MDRC_federal_land_desc: "Document land use and recognized claims through local consultation. Accessible records reduce disputes and improve confidence in agricultural investment. Grants one 25% research bonus in the relevant field. Combine consulted surveys with public-fee records. Accessible registration reduces duplicate claims and recovers lost receipts. Additional effects: -10 political power; +0.1 treasury; one 20% agriculture research bonus. Each reform immediately improves The Congolese Provincial Compact; its exact changes and ongoing costs are listed in the effects."
 MDRC_federal_markets: "Interprovincial Market Agreements"
 MDRC_federal_markets_desc: "Standardize local permits and remove duplicate administrative barriers. Provincial autonomy should not make ordinary domestic trade unnecessarily difficult. A one-year national programme supports implementation. Recognize permits across provinces and coordinate inspections. Autonomy should not multiply the costs of domestic trade. Additional effects: +0.05 treasury; Industrial Rehabilitation for 180 days, including its listed upkeep. Each reform immediately improves The Congolese Provincial Compact; its exact changes and ongoing costs are listed in the effects."
 MDRC_federal_schools_research: "Congolese federal schools Programme"
 MDRC_federal_schools: "Provincial Teacher Partnerships"
 MDRC_federal_schools_desc: "Share training materials and teaching expertise between provincial education services. Local-language teaching works best with common professional standards. Grants one 25% research bonus in the relevant field. Share teacher qualifications and placement records. Local-language teaching can coexist with national professional standards. Additional effects: +1 stability percentage points; Research Partnerships for 180 days, including its listed upkeep. Each reform immediately improves The Congolese Provincial Compact; its exact changes and ongoing costs are listed in the effects."
 MDRC_federal_transport_research: "Congolese federal transport Programme"
 MDRC_federal_transport: "Joint Provincial Transport Boards"
 MDRC_federal_transport_desc: "Coordinate routes whose economic value crosses administrative borders. Shared maintenance schedules make decentralization compatible with a national market. Grants one 25% research bonus in the relevant field. Publish maintenance duties for cross-provincial routes. Shared engineering prevents neglected boundary sections breaking national connections. Additional effects: -10 political power; Reconstruction Works for 180 days, including its listed upkeep; one 20% construction research bonus. Each reform immediately improves The Congolese Provincial Compact; its exact changes and ongoing costs are listed in the effects."
 MDRC_federal_settlement: "Non-Aligned Institutions for a Generation"
 MDRC_federal_settlement_desc: "Bring the institutional, administrative and social branches of this political programme into a common long-term settlement. A one-year works programme supports the transition from emergency reform to normal government. Combine fiscal reconciliation, local rights and service standards in a permanent administration. Regional agreements can rely on institutions able to honour them. Additional effects: Rural Recovery for 365 days, including its listed upkeep; reciprocal +25 opinion with TNZ only when those countries exist and are at peace with DRC. Each reform immediately improves The Congolese Provincial Compact; its exact changes and ongoing costs are listed in the effects. Reveals the Central African Federation and United States of Central Africa decisions in Regional Unions and Integration. Unmet political and territorial requirements are shown on each decision. Formation preserves puppets. Reveals the Central African People's Union and Union of African Socialist Republics decisions in Regional Unions and Integration. Unmet political and territorial requirements are shown on each decision. Formation preserves puppets."
 MDRC_requires_nationalist: "A Nationalist party must be in power."
 MDRC_restoration_doctrine: "A Doctrine of National Independence"
 MDRC_restoration_doctrine_desc: "Set out the responsibilities of a sovereign state without assigning national policy to foreign patrons. The doctrine must translate into institutions capable of acting on their decisions. The programme provides the political, social or administrative resources shown in its rewards. Identify essential services that must withstand external pressure. Practical priorities replace unfunded declarations of self-sufficiency. Additional effects: +1 war-support percentage points; -10 political power; one 20% energy efficiency research bonus. Each reform immediately improves Congolese National Resilience; its exact changes and ongoing costs are listed in the effects."
 MDRC_restoration_resources_research: "Congolese restoration resources Programme"
 MDRC_restoration_resources: "A Strategic Resources Register"
 MDRC_restoration_resources_desc: "Survey strategic concessions and publish the obligations attached to them. National control requires information and technical capacity, not declarations alone. Grants one 25% research bonus in the relevant field. Reconcile concession surveys, royalties and resource estimates. Accurate records prevent public assets being pledged through incompatible agreements. Additional effects: +0.1 treasury; Treasury Reconstruction Team for 180 days, including its listed upkeep. Each reform immediately improves Congolese National Resilience; its exact changes and ongoing costs are listed in the effects."
 MDRC_restoration_resilience: "Economic Resilience Planning"
 MDRC_restoration_resilience_desc: "Identify essential imports and develop replacement supply arrangements. Contingency planning reduces vulnerability to external pressure. A one-year national programme supports implementation. Identify critical imports and train domestic maintenance workshops. Emergency stocks provide time for replacement arrangements to operate. Additional effects: +10000 fuel (subject to storage capacity); Industrial Rehabilitation for 180 days, including its listed upkeep. Each reform immediately improves Congolese National Resilience; its exact changes and ongoing costs are listed in the effects."
 MDRC_restoration_heritage: "Protect the National Archives"
 MDRC_restoration_heritage_desc: "Restore historical records and public cultural institutions. A common civic memory can sustain national belonging across regional and linguistic differences. The programme provides the political, social or administrative resources shown in its rewards. Preserve archives and document regional contributions to the Republic. Shared civic memory sustains belonging without erasing local identities. Additional effects: +1 stability percentage points; +15 political power; one 20% information technology research bonus. Each reform immediately improves Congolese National Resilience; its exact changes and ongoing costs are listed in the effects."
 MDRC_restoration_suppliers_research: "Congolese restoration suppliers Programme"
 MDRC_restoration_suppliers: "National Defence Suppliers"
 MDRC_restoration_suppliers_desc: "Certify domestic workshops capable of repairing military equipment. Reliable maintenance reduces dependence on emergency procurement abroad. Grants one 25% research bonus in the relevant field. Qualify domestic defence workshops through repair trials. Field feedback identifies the work that can reliably stay inside the country. Additional effects: +10 army experience; Industrial Rehabilitation for 180 days, including its listed upkeep. Each reform immediately improves Congolese National Resilience; its exact changes and ongoing costs are listed in the effects."
 MDRC_restoration_council: "A National Security Council"
 MDRC_restoration_council_desc: "Coordinate civilian and military planning through a permanent council. Shared assessments make national policy more consistent across ministries. The programme provides the political, social or administrative resources shown in its rewards. Establish common reporting and emergency delegations. Ministries must coordinate without losing clear responsibility. Additional effects: +15 command power; -10 political power. Each reform immediately improves Congolese National Resilience; its exact changes and ongoing costs are listed in the effects."
 MDRC_restoration_civil_defence: "A Civil Defence Service"
 MDRC_restoration_civil_defence_desc: "Train local responders and prepare emergency communications. National resilience includes protecting civilian life during disruption. A one-year national programme supports implementation. Prepare emergency communications and medical referrals. Protecting civilian life is part of national preparedness. Additional effects: +1 stability percentage points; Community Health for 180 days, including its listed upkeep. Each reform immediately improves Congolese National Resilience; its exact changes and ongoing costs are listed in the effects."
 MDRC_restoration_border_admin_research: "Congolese restoration border admin Programme"
 MDRC_restoration_border_admin: "Permanent Frontier Administration"
 MDRC_restoration_border_admin_desc: "Equip frontier offices to maintain records and communicate with central authorities. Security policy needs an administrative presence as well as patrols. Grants one 25% research bonus in the relevant field. Connect frontier revenue offices with local commands. Consistent administration recovers receipts lost through fragmented reporting. Additional effects: +0.05 treasury; Frontier Readiness Exercises for 180 days, including its listed upkeep. Each reform immediately improves Congolese National Resilience; its exact changes and ongoing costs are listed in the effects."
 MDRC_restoration_reserve_training: "A Reserve Training Calendar"
 MDRC_restoration_reserve_training_desc: "Coordinate training cycles so that provincial reservists can reinforce regular formations effectively. Predictable courses improve readiness without permanent mobilization. The programme provides the political, social or administrative resources shown in its rewards. Exercise mobilization records and transport plans. Training must test whether provincial formations can reinforce the national force. Additional effects: +15 army experience; +10 command power. Each reform immediately improves Congolese National Resilience; its exact changes and ongoing costs are listed in the effects."
 MDRC_restoration_mobilisation: "An Industrial Mobilisation Plan"
 MDRC_restoration_mobilisation_desc: "Prepare maintenance priorities and emergency supply contracts before a crisis. Industrial readiness requires a practical inventory of capacity and skilled labour. A one-year national programme supports implementation. Inventory repair capacity, skilled workers and emergency contracts. Preparedness creates a practical bridge between production and defence. Additional effects: +1 war-support percentage points; Industrial Rehabilitation for 180 days, including its listed upkeep; one 20% production lines research bonus. Each reform immediately improves Congolese National Resilience; its exact changes and ongoing costs are listed in the effects."
 MDRC_restoration_settlement: "Nationalist Institutions for a Generation"
 MDRC_restoration_settlement_desc: "Bring the institutional, administrative and social branches of this political programme into a common long-term settlement. A one-year works programme supports the transition from emergency reform to normal government. Maintain reserve, industrial and administrative plans through a standing secretariat. The common nationalist programme supports the ruling party governing institutions. Additional effects: +20 command power; Frontier Readiness Exercises for 365 days, including its listed upkeep. Each reform immediately improves Congolese National Resilience; its exact changes and ongoing costs are listed in the effects."
 MDRC_requires_fascism: "A Salafist party must be in power."
 MDRC_religious: "A Religious Governing Charter"
 MDRC_religious_desc: "A Salafist-outlook government must already hold office. Define the institutions through which the governing religious movement will administer a diverse Congolese republic. Publish the public obligations attached to governing authority. Formal duties unsettle informal arrangements while establishing a common standard. Additional effects: -1 stability percentage points; Treasury Reconstruction Team for 180 days, including its listed upkeep. Each reform immediately improves The Congolese Public-Service Covenant; its exact changes and ongoing costs are listed in the effects."
 MDRC_religious_council: "A Council of Civil Administration"
 MDRC_religious_council_desc: "Establish a civilian council responsible for budgets, appointments and public services. Religious legitimacy must be accompanied by administrative competence. Appoint trained civilian officials and a channel for service disputes. Authority gains an institution able to coordinate decisions. Additional effects: -10 political power; Ceasefire Liaison Network for 180 days, including its listed upkeep. Each reform immediately improves The Congolese Public-Service Covenant; its exact changes and ongoing costs are listed in the effects."
 MDRC_religious_statute: "Publish the Governing Statute"
 MDRC_religious_statute_desc: "Publish the powers and duties of national institutions. Citizens and officials need clear procedures rather than shifting informal instructions. Publish appointment and appeal procedures with the statute. Predictable rules distinguish public authority from personal instructions. Additional effects: +1 stability percentage points; +15 political power. Each reform immediately improves The Congolese Public-Service Covenant; its exact changes and ongoing costs are listed in the effects."
 MDRC_religious_audit_research: "Congolese religious audit Programme"
 MDRC_religious_audit: "Audit the Endowments"
 MDRC_religious_audit_desc: "Record the assets and obligations of public endowments. Transparent accounts make social provision more reliable. Disclose public endowment assets, beneficiaries and obligations. Reconciliation recovers duplicate payments and protects service resources. Additional effects: -10 political power; +0.1 treasury. Each reform immediately improves The Congolese Public-Service Covenant; its exact changes and ongoing costs are listed in the effects."
 MDRC_religious_courts: "Standards for Public Justice"
 MDRC_religious_courts_desc: "Train legal officers and publish appeal procedures. Predictable administration of justice can reduce arbitrary local decisions. Record schedules and publish appeal procedures. Comparable court records make justice more predictable between districts. Additional effects: +1 stability percentage points; Treasury Reconstruction Team for 180 days, including its listed upkeep. Each reform immediately improves The Congolese Public-Service Covenant; its exact changes and ongoing costs are listed in the effects."
 MDRC_religious_consultation: "Provincial Consultation Councils"
 MDRC_religious_consultation_desc: "Give provincial communities regular access to national administrators. Consultation helps identify public-service failures before they become political crises. Submit provincial service complaints through a national secretariat. Administrative access prevents local failures becoming wider confrontations. Additional effects: +15 political power; Ceasefire Liaison Network for 180 days, including its listed upkeep. Each reform immediately improves The Congolese Public-Service Covenant; its exact changes and ongoing costs are listed in the effects."
 MDRC_religious_services: "A Public Service Covenant"
 MDRC_religious_services_desc: "Set measurable commitments for schools, clinics and local administration. A governing movement must be judged by its ability to provide those services. Identify institutions responsible for health and education commitments. A service covenant needs a visible campaign and political investment. Additional effects: -15 political power; Community Health for 365 days, including its listed upkeep. Each reform immediately improves The Congolese Public-Service Covenant; its exact changes and ongoing costs are listed in the effects."
 MDRC_religious_charity: "Register Community Charities"
 MDRC_religious_charity_desc: "Coordinate community assistance and publish its accounts. Reliable records ensure that assistance reaches the intended communities. Share beneficiary records and publish audited charitable distributions. Coordination reduces duplication and strengthens public confidence. Additional effects: +1 stability percentage points; +0.05 treasury. Each reform immediately improves The Congolese Public-Service Covenant; its exact changes and ongoing costs are listed in the effects."
 MDRC_religious_clinics: "Community Clinic Partnerships"
 MDRC_religious_clinics_desc: "Train health workers and establish common supply arrangements for community clinics. Consistent care strengthens confidence in public institutions. Share procurement and referral arrangements with national health administrators. Reliable supplies make local initiative effective. Additional effects: -10 political power; Community Health for 180 days, including its listed upkeep. Each reform immediately improves The Congolese Public-Service Covenant; its exact changes and ongoing costs are listed in the effects."
 MDRC_religious_schools_research: "Congolese religious schools Programme"
 MDRC_religious_schools: "Common School Standards"
 MDRC_religious_schools_desc: "Set common teaching standards and recognize technical qualifications across community schools. Education must equip pupils for public life and employment. Recognize qualifications and provide common teacher-development courses. Community schooling must prepare pupils for the wider economy. Additional effects: +1 stability percentage points; Research Partnerships for 180 days, including its listed upkeep. Each reform immediately improves The Congolese Public-Service Covenant; its exact changes and ongoing costs are listed in the effects."
 MDRC_religious_farmers: "Rural Cooperative Finance"
 MDRC_religious_farmers_desc: "Pool local savings and technical assistance for agricultural cooperatives. Small producers need practical support as well as promises of renewal. Pool rural savings with extension and repair services. Cooperative purchasing gives small producers practical assistance. Additional effects: +0.05 treasury; Rural Recovery for 180 days, including its listed upkeep; one 20% agriculture research bonus. Each reform immediately improves The Congolese Public-Service Covenant; its exact changes and ongoing costs are listed in the effects."
 MDRC_religious_workshops_research: "Congolese religious workshops Programme"
 MDRC_religious_workshops: "Community Workshop Networks"
 MDRC_religious_workshops_desc: "Support repair workshops and vocational instruction through local institutions. Useful skills help households participate in the wider economy. Train apprentices and document repair standards. Vocational instruction gains value when customers can rely on its work. Additional effects: +10 political power; Industrial Rehabilitation for 180 days, including its listed upkeep. Each reform immediately improves The Congolese Public-Service Covenant; its exact changes and ongoing costs are listed in the effects."
 MDRC_religious_minorities: "A Covenant of Civil Protection"
 MDRC_religious_minorities_desc: "Set out the protection owed to every civilian community and the responsibilities of public officials. National administration must keep local disputes from becoming collective punishment. Bind officials to protect every civilian community from collective retaliation. Enforcing protection costs hardliner support but strengthens confidence. Additional effects: +2 stability percentage points; -15 political power. Each reform immediately improves The Congolese Public-Service Covenant; its exact changes and ongoing costs are listed in the effects."
 MDRC_religious_languages_research: "Congolese religious languages Programme"
 MDRC_religious_languages: "Accessible Public Notices"
 MDRC_religious_languages_desc: "Publish essential instructions in the languages used by local communities. Access to public information should not depend on a journey to the capital. Explain essential procedures in locally used languages. Official rules must remain usable outside the capital. Additional effects: +10 political power; Treasury Reconstruction Team for 180 days, including its listed upkeep. Each reform immediately improves The Congolese Public-Service Covenant; its exact changes and ongoing costs are listed in the effects."
 MDRC_religious_accounts: "Professional Ministry Accounts"
 MDRC_religious_accounts_desc: "Employ trained accountants and standardize reporting between ministries. Public administration needs records that can be compared and audited. Employ trained financial officers and reconcile ministry appropriations. Comparable accounts clarify service costs and recover duplicate spending. Additional effects: -10 political power; +0.1 treasury. Each reform immediately improves The Congolese Public-Service Covenant; its exact changes and ongoing costs are listed in the effects."
 MDRC_religious_mediation: "A National Mediation Secretariat"
 MDRC_religious_mediation_desc: "Train civilian mediators to resolve community and administrative disputes. Consistent procedures provide an alternative to escalating local confrontations. Record mediated agreements and monitor implementation. Reconciliation lasts when responsible institutions fulfil their promises. Additional effects: +1 stability percentage points; Ceasefire Liaison Network for 180 days, including its listed upkeep. Each reform immediately improves The Congolese Public-Service Covenant; its exact changes and ongoing costs are listed in the effects."
 MDRC_religious_technical_research: "Congolese religious technical Programme"
 MDRC_religious_technical: "Technical Service Fellowships"
 MDRC_religious_technical_desc: "Provide technical fellowships for public utilities and essential services. Skilled personnel make institutional commitments possible to fulfil. Place technical fellows in utilities with supervised practical work. Service commitments require engineers as well as declarations. Additional effects: -10 political power; Research Partnerships for 180 days, including its listed upkeep; one 20% energy efficiency research bonus. Each reform immediately improves The Congolese Public-Service Covenant; its exact changes and ongoing costs are listed in the effects."
 MDRC_religious_mature: "A Religious Administrative Settlement"
 MDRC_religious_mature_desc: "A formal administration coordinates community institutions and national public services. Reporting and oversight improve production-efficiency growth while adding administrative expenditure."
 MDRC_religious_settlement: "A Durable Religious Administration"
 MDRC_religious_settlement_desc: "Complete the governing, community-service and civil-administration branches of the religious political programme. A permanent national spirit grants +4% stability and +5% political-power gain. Consolidate endowments, ministries and community services into an audited covenant. Administrative savings sustain public-health provision. Additional effects: +0.1 treasury; Community Health for 365 days, including its listed upkeep. Each reform immediately improves The Congolese Public-Service Covenant; its exact changes and ongoing costs are listed in the effects."
 MDRC_requires_party_20: "The Right Wing Populists must be the ruling party."
 MDRC_nationalist_populist_1: "A Populist National Compact"
 MDRC_nationalist_populist_1_desc: "This programme requires the corresponding nationalist party to be in power. Develop its distinct governing institutions while retaining the common national reconstruction programme. The focus does not change the ruling party. Publish constituency promises and a delivery register. Turning a mass campaign into obligations exposes disagreements over priorities. Additional effects: -1 stability percentage points; +25 political power. Each reform immediately improves A National Popular Mandate; its exact changes and ongoing costs are listed in the effects."
 MDRC_nationalist_populist_2: "Constituency Service Offices"
 MDRC_nationalist_populist_2_desc: "This programme requires the corresponding nationalist party to be in power. Develop its distinct governing institutions while retaining the common national reconstruction programme. The focus does not change the ruling party. Constituency offices will coordinate service access and submit unresolved cases for review. The popular mandate becomes a working network. Additional effects: -10 political power; Rural Recovery for 180 days, including its listed upkeep. Each reform immediately improves A National Popular Mandate; its exact changes and ongoing costs are listed in the effects."
 MDRC_nationalist_populist_3: "A National Development Referendum"
 MDRC_nationalist_populist_3_desc: "This programme requires the corresponding nationalist party to be in power. Develop its distinct governing institutions while retaining the common national reconstruction programme. The focus does not change the ruling party. Ratify a published development programme and require implementation reports. The referendum mandates the completed constituency-service system. Additional effects: +1 stability percentage points; Reconstruction Works for 365 days, including its listed upkeep. Each reform immediately improves A National Popular Mandate; its exact changes and ongoing costs are listed in the effects."
 MDRC_requires_party_21: "The Fascists must be the ruling party."
 MDRC_nationalist_front_1: "A Corporatist National Front"
 MDRC_nationalist_front_1_desc: "This programme requires the corresponding nationalist party to be in power. Develop its distinct governing institutions while retaining the common national reconstruction programme. The focus does not change the ruling party. Consolidate industrial representation in a central corporatist framework. Concentrated direction disrupts independent economic bargaining. Additional effects: -2 stability percentage points; +15 command power. Each reform immediately improves Corporatist Industrial Direction; its exact changes and ongoing costs are listed in the effects."
 MDRC_nationalist_front_2: "National Production Syndicates"
 MDRC_nationalist_front_2_desc: "This programme requires the corresponding nationalist party to be in power. Develop its distinct governing institutions while retaining the common national reconstruction programme. The focus does not change the ruling party. Syndicates will coordinate strategic contracts and workforce training. Firms surrender independent allocation decisions to national priorities. Additional effects: -15 political power; Industrial Rehabilitation for 180 days, including its listed upkeep. Each reform immediately improves Corporatist Industrial Direction; its exact changes and ongoing costs are listed in the effects."
 MDRC_nationalist_front_3_research: "Congolese nationalist front 3 Programme"
 MDRC_nationalist_front_3: "A Central Industrial Directorate"
 MDRC_nationalist_front_3_desc: "This programme requires the corresponding nationalist party to be in power. Develop its distinct governing institutions while retaining the common national reconstruction programme. The focus does not change the ruling party. Maintain inventories and strategic agreements across the syndicates. Standing institutions support defence production at a continuing civilian cost. Additional effects: +1 war-support percentage points; Industrial Rehabilitation for 365 days, including its listed upkeep; one 20% robotics research bonus. Each reform immediately improves Corporatist Industrial Direction; its exact changes and ongoing costs are listed in the effects."
 MDRC_requires_party_22: "The Military Junta must be the ruling party."
 MDRC_nationalist_junta_1: "A National Defence Council"
 MDRC_nationalist_junta_1_desc: "This programme requires the corresponding nationalist party to be in power. Develop its distinct governing institutions while retaining the common national reconstruction programme. The focus does not change the ruling party. Define the military secretariat authority over reconstruction appointments. Clear command improves coordination while concentrated power creates friction. Additional effects: -1 stability percentage points; +15 army experience. Each reform immediately improves Military Administrative Command; its exact changes and ongoing costs are listed in the effects."
 MDRC_nationalist_junta_2: "Professional Military Administration"
 MDRC_nationalist_junta_2_desc: "This programme requires the corresponding nationalist party to be in power. Develop its distinct governing institutions while retaining the common national reconstruction programme. The focus does not change the ruling party. Rotate military administrators through budgeting and project-management courses. The council must deliver services without treating every problem as combat. Additional effects: +20 command power; Frontier Readiness Exercises for 180 days, including its listed upkeep. Each reform immediately improves Military Administrative Command; its exact changes and ongoing costs are listed in the effects."
 MDRC_nationalist_junta_3: "A Reconstruction Exit Strategy"
 MDRC_nationalist_junta_3_desc: "This programme requires the corresponding nationalist party to be in power. Develop its distinct governing institutions while retaining the common national reconstruction programme. The focus does not change the ruling party. Publish reconstruction milestones and permanent military responsibilities. A defined mandate reduces uncertainty without automatically replacing the government. Additional effects: +2 stability percentage points; Treasury Reconstruction Team for 365 days, including its listed upkeep. Each reform immediately improves Military Administrative Command; its exact changes and ongoing costs are listed in the effects. Reveals the Central African Military Directorate and Central African Defense State decisions in Regional Unions and Integration. Unmet political and territorial requirements are shown on each decision. Formation preserves puppets."
 MDRC_requires_party_23: "The House of Kilukeni must be the ruling party."
 MDRC_nationalist_crown_1: "The House of Kilukeni"
 MDRC_nationalist_crown_1_desc: "This programme requires the corresponding nationalist party to be in power. Develop its distinct governing institutions while retaining the common national reconstruction programme. The focus does not change the ruling party. Publish a royal statute and seek recognition across the historic Kongo region. Dynastic symbolism receives a defined institutional foundation. Additional effects: -20 political power; reciprocal +25 opinion with AGL only when those countries exist and are at peace with DRC. Each reform immediately improves The Kilukeni Royal Settlement; its exact changes and ongoing costs are listed in the effects."
 MDRC_nationalist_crown_2: "A Council of the Crown"
 MDRC_nationalist_crown_2_desc: "This programme requires the corresponding nationalist party to be in power. Develop its distinct governing institutions while retaining the common national reconstruction programme. The focus does not change the ruling party. Reconcile the royal household, provincial representation and administration through the council of the crown. Published accounts separate dynastic institutions from public funds. Additional effects: +1 stability percentage points; Treasury Reconstruction Team for 180 days, including its listed upkeep. Each reform immediately improves The Kilukeni Royal Settlement; its exact changes and ongoing costs are listed in the effects."
 MDRC_nationalist_crown_3: "A Modern Royal Administration"
 MDRC_nationalist_crown_3_desc: "This programme requires the corresponding nationalist party to be in power. Develop its distinct governing institutions while retaining the common national reconstruction programme. The focus does not change the ruling party. Bind royal administration to professional appointments and consultation. The dynasty can seek regional recognition through institutions able to honour agreements. Additional effects: Active Diplomatic Missions for 365 days, including its listed upkeep; reciprocal +25 opinion with CNG only when those countries exist and are at peace with DRC. Each reform immediately improves The Kilukeni Royal Settlement; its exact changes and ongoing costs are listed in the effects. Reveals the Restored Kingdom of Kongo and Greater Congolese Empire decisions in Regional Unions and Integration. Unmet political and territorial requirements are shown on each decision. Formation preserves puppets."
 MDRC_nationalist_consolidation: "A Consolidated Nationalist Settlement"
 MDRC_nationalist_consolidation_desc: "Complete the governing programme of the nationalist party in office. Its institutions now join the Republic common civil-service standards without imposing a different nationalist party. Adopt a common technical review process across the selected nationalist institutions. The settlement must keep learning after its founding campaign. Additional effects: Research Partnerships for 365 days, including its listed upkeep; reciprocal +25 opinion with ZAM only when those countries exist and are at peace with DRC. Each reform immediately improves Congolese National Resilience; its exact changes and ongoing costs are listed in the effects. Reveals the Greater Congo and Central African State decisions in Regional Unions and Integration. Unmet political and territorial requirements are shown on each decision. Formation preserves puppets."
 MDRC_literacy_adult: "Adult Literacy Centres"
 MDRC_literacy_adult_desc: "Open evening classes in towns and market centres so adults can learn without abandoning their livelihoods. Local instructors will use practical reading, writing and numeracy exercises. Raises the actual Millennium Dawn literacy rate by 2 percentage points, up to 100%, and updates its education modifiers. Use reading exercises drawn from work and public services. Common course records allow adults to continue learning after moving between districts. Additional effects: +20 political power; one 25% information technology research bonus. Each reform immediately improves Congolese Teaching and Technical Standards; its exact changes and ongoing costs are listed in the effects.\n\n§W--------------§!\nRequired earlier focus:\nComplete §Y$MDRC_schools$§!."
 MDRC_literacy_colleges: "Rebuild Teacher Training Colleges"
 MDRC_literacy_colleges_desc: "Restore teacher-training courses and supervised classroom practice. A reliable supply of qualified teachers is essential to expanding education beyond the capital. Raises the actual Millennium Dawn literacy rate by 2 percentage points, up to 100%, and updates its education modifiers. Accredit teacher trainers and require supervised classroom placements. Common assessments make qualified teachers useful across provincial boundaries. Additional effects: +25 political power; one 25% computing research bonus. Each reform immediately improves Congolese Teaching and Technical Standards; its exact changes and ongoing costs are listed in the effects.\n\n§W--------------§!\nRequired earlier focus:\nComplete §Y$MDRC_schools$§!."
 MDRC_literacy_textbooks: "Textbooks in Local Languages"
 MDRC_literacy_textbooks_desc: "Commission clear introductory textbooks in the languages pupils use at home. Common teaching standards will allow these materials to support national qualifications. Raises the actual Millennium Dawn literacy rate by 2 percentage points, up to 100%, and updates its education modifiers. Establish editorial review and transparent purchasing for local-language textbooks. Materials must be understandable, consistently produced and actually delivered. Additional effects: Treasury Reconstruction Team for 270 days, including its listed upkeep; one 25% production lines research bonus. Each reform immediately improves Congolese Teaching and Technical Standards; its exact changes and ongoing costs are listed in the effects.\n\n§W--------------§!\nRequired earlier focus:\nComplete §Y$MDRC_schools$§!."
 MDRC_literacy_rural: "Classrooms Beyond the Main Roads"
 MDRC_literacy_rural_desc: "Repair community classrooms and arrange rural teacher placements. Children should not need to migrate to a city to acquire basic literacy. Raises the actual Millennium Dawn literacy rate by 2 percentage points, up to 100%, and updates its education modifiers. Coordinate teacher housing, classroom maintenance and local transport through provincial service teams. Rural schooling depends on reliable supporting services. Additional effects: +20 political power; one 25% construction research bonus. Each reform immediately improves Provincial Livelihood Services; its exact changes and ongoing costs are listed in the effects.\n\n§W--------------§!\nRequired earlier focus:\nComplete §Y$MDRC_literacy_adult$§!."
 MDRC_literacy_girls: "Keep Girls in School"
 MDRC_literacy_girls_desc: "Support safe access, school attendance and completion for girls facing barriers to education. Teaching more of the population strengthens household welfare and the skilled workforce. Raises the actual Millennium Dawn literacy rate by 2 percentage points, up to 100%, and updates its education modifiers. Train school staff to identify attendance barriers and connect pupils with practical support. Continued participation turns initial access into completed learning. Additional effects: Community Health for 365 days, including its listed upkeep; one 25% information technology research bonus. Each reform immediately improves Congolese Teaching and Technical Standards; its exact changes and ongoing costs are listed in the effects.\n\n§W--------------§!\nRequired earlier focus:\nComplete §Y$MDRC_literacy_colleges$§!."
 MDRC_literacy_radio: "Lessons over Community Radio"
 MDRC_literacy_radio_desc: "Broadcast structured lessons and distribute printed exercises through local learning centres. Radio instruction can reach communities while permanent schools are being rebuilt. Raises the actual Millennium Dawn literacy rate by 1 percentage point, up to 100%, and updates its education modifiers. Prepare radio lessons with exercises and local study groups. Broadcasting works best when learners can ask questions and demonstrate progress. Additional effects: +20 political power; one 25% mobile networks research bonus. Each reform immediately improves Congolese Teaching and Technical Standards; its exact changes and ongoing costs are listed in the effects.\n\n§W--------------§!\nRequired earlier focus:\nComplete §Y$MDRC_literacy_textbooks$§!."
 MDRC_literacy_meals: "A School Meals Programme"
 MDRC_literacy_meals_desc: "Connect local producers to school meal contracts and make regular attendance easier for low-income families. Education and agricultural recovery can reinforce one another. Raises the actual Millennium Dawn literacy rate by 1 percentage point, up to 100%, and updates its education modifiers. Audit food contracts and publish school delivery schedules. Stable local purchasing connects attendance to rural production rather than irregular donations. Additional effects: +20 political power; one 25% agriculture research bonus. Each reform immediately improves Provincial Livelihood Services; its exact changes and ongoing costs are listed in the effects.\n\n§W--------------§!\nRequired earlier focus:\nComplete §Y$MDRC_literacy_rural$§!."
 MDRC_literacy_inspection: "A Professional School Inspectorate"
 MDRC_literacy_inspection_desc: "Inspect attendance, teaching standards and basic facilities using published criteria. Reliable reporting lets the education service direct assistance where it is needed most. Raises the actual Millennium Dawn literacy rate by 1 percentage point, up to 100%, and updates its education modifiers. Record learning outcomes and verify that resources reach classrooms. Published follow-up actions make inspection produce improvements rather than more forms. Additional effects: Treasury Reconstruction Team for 365 days, including its listed upkeep; one 25% computing research bonus. Each reform immediately improves Congolese Teaching and Technical Standards; its exact changes and ongoing costs are listed in the effects.\n\n§W--------------§!\nRequired earlier focus:\nComplete §Y$MDRC_literacy_girls$§!."
 MDRC_literacy_curriculum: "A National Basic Curriculum"
 MDRC_literacy_curriculum_desc: "Agree on national reading and numeracy standards while retaining room for local-language instruction. Clear progression makes qualifications meaningful across provincial borders. Raises the actual Millennium Dawn literacy rate by 2 percentage points, up to 100%, and updates its education modifiers. Connect basic literacy standards to vocational progression. Common qualifications help pupils move between provinces and continue into technical training. Additional effects: +30 political power; one 25% industry research bonus. Each reform immediately improves Congolese Teaching and Technical Standards; its exact changes and ongoing costs are listed in the effects.\n\n§W--------------§!\nRequired earlier focus:\nComplete §Y$MDRC_literacy_radio$§!."
 MDRC_literacy_complete: "Universal Access to Basic Literacy"
 MDRC_literacy_complete_desc: "Join adult education, rural schools, teacher training and a common curriculum into a permanent national programme. Completing this programme improves literacy; it does not instantly make every citizen literate. Raises the actual Millennium Dawn literacy rate by 2 percentage points, up to 100%, and updates its education modifiers. Create a permanent assessment service linking adult classes, schools and vocational education. Sustained literacy needs recognized pathways beyond the first programme. Additional effects: +50 political power; one 25% internet access research bonus. Each reform immediately improves Congolese Teaching and Technical Standards; its exact changes and ongoing costs are listed in the effects. Unlocks Launch an Adult-Literacy Refresher: a funded repeatable programme costing 0.75 treasury and 50 political power, with a 730-day cooldown.\n\n§W--------------§!\nRequired focuses: satisfy §Yevery§! line below:\nComplete §Y$MDRC_literacy_inspection$§!.\nComplete §Y$MDRC_literacy_meals$§!.\nComplete §Y$MDRC_literacy_curriculum$§!."
