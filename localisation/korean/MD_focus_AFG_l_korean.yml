l_korean:
 afghanistan_focus: "아프가니스탄 중점 계통도"
 AFG_civil_war: "탈레반에 대항"
 AFG_civil_war_desc: "우리나라는 극단주의자에 의해 분단 됐습니다. 우리는 이제 우리 삶의 방식의 생존을 위해 싸우는 마지막 다리에 서 있습니다. 우리는 나라를 분열시키려는 테러리스트에 맞서 싸워야 합니다."
 AFG_enlisting_personal: "군인 징집"
 AFG_enlisting_personal_desc: "우리는 마을 장로에 접근하여 탈레반과의 싸움에 참여할 젊은이를 모집해야 합니다. "
 AFG_foreign_loyalist: "아프가니스탄 소수민족 민병대"
 AFG_foreign_loyalist_desc: "아프가니스탄의 많은 소수민족들이 탈레반의 억압을 피해 대피하고 있습니다. 이러한 소수민족 대부분은 주변 국가의 소수민족과 동일한 출신입니다. 우리는 탈레반을 피해 대피한 사람들 중 우리와 싸우고자 하는 자들을 동원할 수 있을 뿐만 아니라, 우리 이웃 국가에서도 자원봉사자들을 모집할 수 있습니다."
 AFG_updating_equipment: "장비 개량"
 AFG_updating_equipment_desc: "우리의 병사들은 구식 장비로 탈레반에 맞서 싸웁니다. 전쟁에 승리하기 위해 병사들에게 더 좋은 장비를 지급할 필요가 있습니다.  "
 AFG_infrastructure_equal_war: "전쟁 필수 요소 도로"
 AFG_infrastructure_equal_war_desc: "고대 로마인들도 적절한 전쟁을 수행하려면 적절한 도로가 필요하다는 것을 알고 있었습니다. 우리는 우리가 통제하는 국가의 일부에 공급하기 위해 이러한 도로를 건설해야 합니다. 그렇지 않으면 이 전쟁에서 단순히 승리할 수 없을 것입니다."
 AFG_foreign_equipment: "러시아 무기"
 AFG_foreign_equipment_desc: "러시아인들은 체첸 반군을 지원하는 탈레반에 싫증이 났다. 그래서 그들은 우리에게 오래된 소련 무기를 공급하기로 결정했습니다."
 AFG_minor_military_construction: "소화기 제작"
 AFG_minor_military_construction_desc: "우리에게는 말할 수 있는 군사 생산도 없고 산업도 전혀 없습니다. 그러나 탈레반과 싸우면서 이번 전쟁 내내 병력 공급을 유지하려면 국내에서 일부 무기를 생산할 수 있어야 합니다."
 AFG_adjusting_our_economy: "경제 조정"
 AFG_adjusting_our_economy_desc: "내전이 격화되면서 대규모 경찰력은 우리에게 거의 쓸모가 없습니다. 우리는 군인들의 상황을 개선하기 위해 우리가 가지고 있는 얼마 안되는 자원을 병원에 전용해야 합니다."
 AFG_better_officers: "장교 교육"
 AFG_better_officers_desc: "그러나 이번에도 우리는 경찰 훈련 자원을 보다 긴급한 문제에 집중해야 합니다. 우리 장교들에게 적절한 군사 교육을 제공합니다. 전투에서 우리 병사들을 이끌려면 칼처럼 날카로워야 합니다."
 AFG_elite_help: "산악병"
 AFG_elite_help_desc: "우리는 지형을 잘 아는 다수의 타지크족이 살고 있는 바다흐샨 지역을 통제하고 있으며, 그들 중 상당 부분은 소련-아프가니스탄 전쟁에 참여했습니다. 비록 그들 대부분이 중년에 이르렀지만, 그들은 여전히 ​​우리나라의 생존을 위해 싸울 준비가 되어 있고 기꺼이 싸울 의지가 있습니다."
 AFG_enhanced_recruitment_efforts: "강화된 징병 주력"
 AFG_enhanced_recruitment_efforts_desc: "우리는 이 전쟁에서 패할 수 없으며, 이제 우리 시민들이 이를 이해해야 할 때입니다. 우리는 모집 노력을 강화해야 합니다."
 AFG_going_offensive: "공격 시작"
 AFG_going_offensive_desc: "우리는 너무 오랫동안 손을 놓고 앉아 우리에게 남은 작은 것을 방어해 왔습니다. 이제 우리는 탈레반과 싸워 정당하게 우리의 것을 되찾을 때입니다."
 AFG_getting_new_tech: "새로운 기술 습득"
 AFG_getting_new_tech_desc: "우리는 아직도 20세기인 것처럼 전쟁을 벌여왔습니다. 우리는 새로운 기술에 투자하고 군대를 현대화해야 합니다. 우리는 우월한 적과 싸우고 있습니다. 이제 그들을 능가할 때입니다."
 AFG_planes: "공군 창설"
 AFG_planes_desc: "비행기는 말할 것도 없지만 하늘을 장악하면 탈레반을 밀어내는 것이 훨씬 쉬울 것입니다."
 AFG_specialize_equipment: "전문화된 장비"
 AFG_specialize_equipment_desc: "우리가 이기려면 우리가 얻을 수 있는 이점을 최대한 많이 확보해야 합니다."
 AFG_cars_over_donkeys: "미국제 험비"
 AFG_cars_over_donkeys_desc: "당나귀는 우리 집의 산악 지형에서는 잘 지내지만 평지에서는 잘 지내지 못합니다. 적을 밀어내려면 속도가 중요합니다. 우리는 미국인들로부터 오래된 험비를 구입하겠다고 제안할 것입니다."
 AFG_fuel_for_economy: "경제를 위한 동력"
 AFG_fuel_for_economy_desc: "우리 경제는 엉망이고 부패가 만연하고 있습니다. 전쟁에서 승리하기 위해서뿐만 아니라 궁극적인 재건 과정을 위해서도 상황을 안정시켜야 합니다."
 AFG_war_experience: "전쟁 경험"
 AFG_war_experience_desc: "장기간의 전쟁을 통해 우리는 과거의 실수로부터 배우고 적응할 수 있었으며 그 과정에서 군사 및 전술을 개선할 수 있었습니다."
 AFG_army_budget: "육군 예산"
 AFG_army_budget_desc: "현재의 군대 개선에도 불구하고, 전쟁에서 승리할 수 있도록 사기를 높게 유지하려면 군대에 더 많은 자금을 지원해야 합니다."
 AFG_improving_our_economy: "의도치 않은 이득"
 AFG_improving_our_economy_desc: "우리는 탈레반과의 전쟁에서 승리하기 위해 우리나라를 변화시켜 왔지만, 이로 인해 우리 경제는 물론 국제 투자자와의 관계도 약간 개선되는 의도치 않은 이익을 얻었습니다. 비록 이들 투자자 중 상당수가 여전히 전쟁으로 폐허가 된 국가에 참여하는 것을 경계하고 있습니다."
 AFG_equipment_production: "장비 생산"
 AFG_equipment_production_desc: "장비 생산을 시작한 후 우리는 설계를 개선할 수 있는 방법을 빠르게 찾았습니다."
 AFG_large_equipment_production: "대규모 장비 생산"
 AFG_large_equipment_production_desc: "우리는 국내 생산 장비에 더 많은 돈을 투자하기로 결정했습니다. 이는 우리가 조만간 탈레반을 능가할 것이 확실하다는 것을 의미합니다."
 AFG_huge_equipment_production: "대규모 장비 생산"
 AFG_huge_equipment_production_desc: "우리나라의 빈약한 경제에도 불구하고, 우리 지도자들은 탈레반을 확실히 물리칠 수 있도록 우리가 가진 모든 것을 국내 군사 생산에 투입해야 할 때라는 것을 깨달았습니다."
 AFG_loyal_guards: "왕립 근위대"
 AFG_loyal_guards_desc: "우리는 Ahmad Shah Massoud에게 충성스럽다고 확신할 수 있는 경비원을 고용해야 합니다. 실제로 그들은 목숨을 걸고 그를 보호할 만큼 충성스럽습니다."
 AFG_elite_guards: "정예 경비병"
 AFG_elite_guards_desc: "우리는 우리 지도자들과 가장 가까운 경비병들이 최고의 자질을 갖추고 잘 훈련되었는지 확인해야 하며, 탈레반 암살자들이 공격할 기회를 허용해서는 안 됩니다."
 AFG_the_end_of_war: "전쟁의 끝"
 AFG_the_end_of_war_desc: "마침내... 우리 나라는 탈레반의 공격으로부터 안전합니다. 우리 지도자들은 우리를 승리로 이끌었습니다. 그의 의로운 아들과 딸들이 이 끔찍한 전쟁에서 승리할 수 있도록 허락하신 알라께 찬양을 드립니다."
 AFG_civil_war_recovery: "내전 회복"
 AFG_civil_war_recovery_desc: "마침내 탈레반을 격파하고 조국을 탈환했으니 이제는 회복에 집중해야 할 때다. 우리 경제는 내전으로 인해 심각한 타격을 입었습니다."
 AFG_pleasing_the_ulema: "이맘(Imam)에 우호적인 접근"
 AFG_pleasing_the_ulema_desc: "내전의 근본 원인 중 하나는 종교적 차이였습니다. 우리는 여전히 이슬람에 대한 믿음을 갖고 있지만 탈레반과 같은 해석을 따르지는 않습니다. 그들을 확고하게 물리친 후에 우리는 충성스러운 이맘들이 우리의 통치 방식에 동의하도록 해야 합니다."
 AFG_rebuild_mosques: "모스크 재건"
 AFG_rebuild_mosques_desc: "1978년 사우르 혁명 이후 우리를 괴롭힌 끝없는 갈등과 전쟁으로 인해 이 나라의 많은 모스크가 비극적으로 파괴되거나 파손된 상태로 남겨졌습니다. 이제는 이전의 영광을 회복할 때입니다."
 AFG_spread_our_religion: "우리 종교를 퍼트려라"
 AFG_spread_our_religion_desc: "우리나라에는 독실한 무슬림이 많고, 경제가 실질적으로 활성화되고 있는 상황에서 우리 국민과 이웃 국가 간의 국제 교류를 통해 이슬람에 대한 해석과 비전을 전파해야 합니다."
 AFG_un_troops: "유엔 평화유지군"
 AFG_un_troops_desc: "남북전쟁 이후 우리 나라의 많은 부분이 폐허로 변했고 아직까지도 완전히 통제할 수는 없습니다. 우리는 우리 군대의 나라 순찰을 돕기 위해 유엔 평화유지군을 요청해야 합니다."
 AFG_sticking_with_opium: "마약과 함께"
 AFG_sticking_with_opium_desc: "대량의 아편을 생산하고 판매하는 것은 과거에도 항상 우리에게 도움이 되었으며 그들이 말했듯이 그것이 고장나지 않았다면 고치지 마십시오."
 AFG_industrial_economy: "산업화"
 AFG_industrial_economy_desc: "이제는 경제를 건설하기 위해 산업화를 시작할 때입니다. 시민들이 일상생활에 필요한 모든 제품을 생산하려면 거대한 공장을 건설해야 합니다."
 AFG_changing_our_economy: "우리의 미래 경제"
 AFG_changing_our_economy_desc: "우리는 교차로에 서 있습니다. 우리는 현재의 아편 기반 경제를 두 배로 늘릴 것인지, 아니면 대신 국가를 산업화하려고 노력해야 하는지 결정해야 합니다."
 AFG_opium_barons: "마약 봉기"
 AFG_opium_barons_desc: "시장이 커지면서 특정 세력이 시장에 대한 영향력도 커졌습니다. 이들 세력은 아편 시장을 효과적으로 장악했습니다."
 AFG_focusing_on_infrastructure: "마약 시장 파괴"
 AFG_focusing_on_infrastructure_desc: "이제는 우리나라의 아편밭을 없애야 할 때입니다. 우리는 경제를 현대화하고 산업적 야망을 위한 길을 닦아야 합니다."
 AFG_selling_large_quantities: "마약 대량 판매"
 AFG_selling_large_quantities_desc: "아편 생산을 중앙집중적으로 통제함으로써 우리는 그로부터 큰 이익을 얻을 것입니다. 이제 우리가 이 중 일부를 매각하고 이 이익을 실현할 때입니다."
 AFG_focusing_on_factories: "산업 건설"
 AFG_focusing_on_factories_desc: "대부분의 양귀비 밭이 파괴되었으니 이제는 비어 있는 땅에 공장을 세워 우리 국민들이 우리 노력의 혜택을 누릴 때입니다."
 AFG_relief_effort: "구호 활동"
 AFG_relief_effort_desc: "The United Nations looked on as our nation was torn apart by the civil war without much involvement. After the dust settled, however, the Peacekeepers arriving acted as a stabilising factor, and the UN has decided to send funds to help us further rebuild and stabilise our country."
 AFG_building_society: "사회 재건"
 AFG_building_society_desc: "우리 예산의 대부분은 전쟁 중에 군대에 사용되었습니다. 이제 우리는 더 이상 탈레반의 위협에 대처할 필요가 없으므로 유엔은 우리가 사회와 국민을 돌보는 데 노력을 집중할 것을 요청했습니다."
 AFG_wounded_veterans: "베테랑을 위한 외상 치료"
 AFG_wounded_veterans_desc: "Most of our population has been exposed to the horrors of war. We need to make an effort to provide treatment for those who have been hurt most, not only for our country's recovery, but also so that we can draw from our veterans' expertise in the future."
 AFG_economic_recovery: "부분적인 회복"
 AFG_economic_recovery_desc: "UN의 도움으로 우리는 회복의 길에서 좋은 진전을 이루었습니다. 우리는 더 이상 단순한 생존에 집중할 필요가 없는 지점에 도달했으며 마침내 우리나라의 생활 수준 향상을 시작할 수 있습니다."
 AFG_un_troops_removal: "UN군 제거"
 AFG_un_troops_removal_desc: "우리는 국가 안정을 위해 큰 진전을 이루었으며, 이를 통해 더 이상 국가 순찰을 돕기 위해 UN 평화유지군이 필요하지 않습니다."
 AFG_tribes_or_cities: "부족인가 도시인가"
 AFG_tribes_or_cities_desc: "부족 정치와 현대화 정치 사이의 뚜렷한 대조는 항상 아프가니스탄 정치 과정의 일부였으며 현대 아프가니스탄을 건설하는 데 있어서 피할 수 없는 문제입니다. 우리는 기존 방식을 고수할지, 아니면 보다 현대적인 시스템을 채택할지 신중하게 선택해야 합니다."
 AFG_the_mountains: "부족"
 AFG_the_mountains_desc: "부족들은 아프가니스탄의 중추입니다. 우리는 국제 자본의 성장을 장려하기 위해 우리의 안정과 국가 정체성을 잃을 위험을 감수할 수 없습니다."
 AFG_the_rural_areas: "농촌 개발"
 AFG_the_rural_areas_desc: "우리의 농촌 지역은 거의 모두 미개발 상태입니다. 따라서 우리는 농촌 지역의 진정한 잠재력을 발휘하기 위해 개발을 시작해야 합니다."
 AFG_the_tribal_leaders: "부족 지도자 권력 강화"
 AFG_the_tribal_leaders_desc: "우리 국가의 부족과 중앙정부간 불화의 역사는 항상 국가적 불안이나 외국의 개입 또는 침략의 순환으로 이어졌습니다. 정부 부처에 부족 지도자를 포함함으로써 똑같은 실수를 반복하지 않을 수 있습니다."
 AFG_the_towns: "도시 개발"
 AFG_the_towns_desc: "국가의 현대화를 위해서는 마을부터 시작해 도시지역에 이르기까지 더 많은 개발이 필수적입니다. 이 조치는 부족들을 소원하게 만들 것이 확실하지만, 중앙정부가 기능하고 있는 한 모든 것은 통제 가능합니다."
 AFG_the_cities: "중심부 개발"
 AFG_the_cities_desc: "수십년의 전쟁 이후, 우리 도시들은 많은 개발 잠재력을 갖고 있고, 피해를 입은 건물 중 일부는 공장으로 개조, 전환해 시민들의 요구에 더 부응할 것입니다."
 AFG_the_capital: "카불 개발"
 AFG_the_capital_desc: "20세기 중반, 카불은 휴양지였습니다. 하지만, 수십 년의 전쟁은 도시를 폐허로 몰락시키는 원인이 됐습니다. 카불의 재건축과 현대화는 번영의 회복 뿐만이 아니라 중앙정부의 권위를 강조함도 있습니다."
 AFG_getting_running_water: "물부족 해결"
 AFG_getting_running_water_desc: "아프가니스탄은 세계 물 부족 국가들 중 하나이며, 우리의 아프간인들은 깨끗한 물에 접근할 수 없어 너무 많은 고통을 받고 있습니다. 정부가 제대로된 기반시설을 건설함으로써 물 부족 문제를 해결해야 할 때입니다."
 AFG_feed_the_nation: "전국가 식량 배급"
 AFG_feed_the_nation_desc: "대다수의 우리 시민들이 영양실조로 고통 받고 있습니다. 이젠 전쟁도 끝났으므로 더 이상 변명의 여지도 없습니다. 우린 시민, 특히 어린이들의 복지를 필사적으로 해결해야만 합니다."
 AFG_spread_electricity: "전력망 확장"
 AFG_spread_electricity_desc: "전쟁기 동안, 국가의 대다수 전력망은 파괴되거나 손상됐고, 사람들은 만성적인 전력 부족으로 발전기에 의존하고 있습니다. 이제 전력망을 재구축하고 확장할 때 입니다."
 AFG_means_of_communication: "통신의 수단"
 AFG_means_of_communication_desc: "이제 전력망이 복구 되면서, 탈레반이 파괴한 지역에 있는 시민들에게 기본적인 TV와 인터넷 접속을 제공할 수 있습니다."
 AFG_rebuild_the_roads: "도로 재건"
 AFG_rebuild_the_roads_desc: "대부분의 도로망은 전쟁기간에 손상됐고, 탈레반이 매설한 많은 IED가 도로에 남아있습니다. IED를 제거하고 도로를 재건해야 합니다."
 AFG_public_transportation: "교통 수단"
 AFG_public_transportation_desc: "우리 국가는 대중교통 시스템을 갖고 있지만, 탈레반의 테러 공격에 대한 공포 때문에 사실상 기능하지 않고 있습니다. 마침내, 이제는 평화가 찾아왔으니 대중교통 시스템의 혜택을 시민들에게 되돌려 줄 때입니다."
 AFG_our_nation_recovered: "국가 회복"
 AFG_our_nation_recovered_desc: "UN평화유지군의 철수로 우리나라가 정상 궤도에 올랐음이 확실해졌고, 이제 모두 소매를 걷어붙이고 아프가니스탄의 미래를 건설할 차례입니다."
 AFG_future_national_policy: "아프가니스탄의 미래"
 AFG_future_national_policy_desc: "전쟁이 끝났습니다. 하지만, 나라는 여전히 폐허 상태이고 나라의 미래를 만들 때입니다."
 AFG_approaching_nato: "서방을 향해"
 AFG_approaching_nato_desc: "서구 세력은 탄탄한 경제와 선진기술을 갖고 있습니다. 우리가 서방에 기대기로 선택한다면, 그들은 경제적으로나 군사적으로나 앞으로 상당한 양의 지원을 제공해줄 것이 확실합니다."
 AFG_aspiring_nato: "주요 비 NATO 동맹국이 되라"
 AFG_aspiring_nato_desc: "우리나라의 지리적 위치가 공식적인 NATO 회원국 자격을 얻게 하지는 못하지만, 주요 비-NATO 동맹국의 일원이 되게 할 수 있습니다. 그렇게 되면, 비-NATO 국가들이 미국으로부터 얻을 수 없는 다양한 군사적, 재정적 이점을 확보할 기회를 얻을 수 있습니다."
 AFG_emerging: "동방을 향해"
 AFG_emerging_desc: "서방 국가들은 제3세계 국가들과 거래할 때 종종 약속을 지키지 않으며, 과거 그들과의 협력은 서방 자본가 계급에 의한 우리 국민의 지배와 착취로 이어졌습니다. 이러한 착취는 소수의 정치인들만 이익을 볼 뿐입니다. 중국과 러시아 같은 동방의 신흥 국가들과 협력할 수 있는 새로운 기회가 많이 있습니다."
 AFG_seek_american_protection: "미국의 보호 추구"
 AFG_seek_american_protection_desc: "미국은 세계에서 가장 강력한 군사력이며, 강력한 국가들에 둘러싸인 우리의 독특한 전략적 지리적 위치를 고려할 때, 미국의 보호를 구하는 것은 외세의 침략으로부터 우리를 보호해 줄 뿐만 아니라 국내 안정을 유지하는 데에도 도움이 될 것입니다."
 AFG_monarchy: "바라크자이 왕조로의 회귀"
 AFG_monarchy_desc: "전직 총리 모하메드 다우드 칸은 사촌인 모하메드 자히르 샤 국왕을 폐위하고 공화제 독재를 수립하는 실수를 저질렀습니다. 이는 아프가니스탄에 수십 년간의 내분을 가져왔으며, 이제 나라에 안정을 가져올 왕국의 복귀를 준비할 때입니다."
 AFG_prepare_the_king: "왕의 복귀에 준비하라"
 AFG_prepare_the_king_desc: "우리가 사랑하는 전 국왕 모하메드 자히르 샤의 가족은 여전히 이탈리아에서 망명 생활을 하고 있습니다. 이제 그들이 아프가니스탄으로 돌아와 다시 한번 왕국으로서 우리나라를 통치할 수 있도록 준비할 때입니다."
 AFG_the_king_returns: "왕의 귀환"
 AFG_the_king_returns_desc: "기반이 마련되고 필요한 전환이 완료되었으므로, 이제 두 팔 벌려 국왕을 다시 맞이하고 그에게 권력의 고삐를 넘겨줄 때입니다."
 AFG_restore_the_constitution: "1964년 헌법 복원"
 AFG_restore_the_constitution_desc: "1964년 헌법은 현대 민주주의의 구현체로 여성의 권리, 시민권, 의회 선거를 특징으로 합니다. 이 헌법의 중요한 점은 군주가 왕좌에만 머물도록 한 점입니다. 우리는 왕국을 예전의 영광으로 되돌리기 위해 이 헌법을 복원해야 합니다."
 AFG_pro_establishment: "이슬람당 쿠데타"
 AFG_pro_establishment_desc: "이제 아프가니스탄을 중앙집권적인 파슈툰 이슬람 통치 아래 둘 때입니다! 부족 간 전쟁은 우리 국가의 현대화와 안정에 악영향을 끼쳤습니다. 서방은 우리를 버렸고 동방 강국들은 우리를 파괴하려 합니다. 우리는 아프가니스탄을 이슬람 통치 아래 영원히 두기 위해 열심히 일할 것입니다."
 AFG_bring_military_to_our_side: "군부를 우리 쪽으로"
 AFG_bring_military_to_our_side_desc: "우리 군은 나라를 지키고 국내 안정을 유지하는 임무를 맡고 있습니다. 그러나 이전 행정부 하의 높은 부패 수준과 고위 관리들의 잦은 군 급여 체불 때문에 군은 새 정권을 의심하고 있습니다. 새 정권의 안정을 보장하기 위해 이 문제를 해결하는 것이 필수적입니다."
 AFG_secure_the_power: "권력 강화"
 AFG_secure_the_power_desc: "이제 군을 우리 편으로 확보했으므로, 국가를 안정시키기 위해 경찰력을 구축하고 군과 함께 배치하여 부족의 영향력을 제거하고, 강력하고 중앙집권적이며 파슈툰이 주도하는 이슬람 정부라는 궁극적 목표에 도달할 때입니다."
 AFG_declare_the_emirate: "토후국 선포"
 AFG_declare_the_emirate_desc: "이제 동료 아프가니스탄인들에게 나라의 최선의 이익에 봉사할 강력하고 중앙집권적인 지도부를 안겨 줄 때입니다. 헤크마티아르가 우리의 자애로운 에미르가 될 것입니다."
 AFG_future_diplomacy: "우리의 외교적 입장"
 AFG_future_diplomacy_desc: "현대 세계에서 어떤 나라도 고립된 채 남을 여유가 없습니다. 우리의 상황을 고려하여, 다른 나라들을 대하는 방식을 신중하게 결정해야 합니다."
 AFG_invite_western_investors: "서방 투자자 초청"
 AFG_invite_western_investors_desc: "우리는 일부 서방 투자자들을 초청하여 우리나라의 경제를 활성화하고 향후 서방과의 경제 협력을 촉진할 몇 가지 사업에 기여하도록 할 수 있습니다."
 AFG_invite_eastern_investors: "동방 투자자 초청"
 AFG_invite_eastern_investors_desc: "동방 강국들은 이른바 \\"민주주의\\"와 \\"인권\\"이라는 조건부 요구 없이 진정으로 우리나라를 도우려는 나라들입니다. 우리는 그들을 초청하여 우리나라에 투자하게 하고, 경제적 유대를 강화하며, 향후 협력의 기회를 더 많이 열 수 있습니다."
 AFG_request_chinese_protection: "중국의 보호 요청"
 AFG_request_chinese_protection_desc: "중국은 우리의 이웃이지만 우리를 점령하거나 예속시키려는 의도를 가진 적이 없습니다. 양국은 국내 안보에 대해 같은 우려를 공유합니다. 따라서 우리는 우리나라에서 사업을 하는 데 따른 일부 이익을 제공하는 대가로 중국에 방위 조약을 제안할 수 있습니다."
 AFG_internal_policy: "내정에 집중"
 AFG_internal_policy_desc: "이제 나라가 안정되었으므로 어떤 길을 택할지 결정해야 합니다."
 AFG_aggresive_foreign_policy: "공격적인 외교 정책"
 AFG_aggresive_foreign_policy_desc: "속담에 이르듯 공격이 최선의 방어입니다. 우리나라가 역사를 통틀어 외국 제국들에게 계속 침략당한 이유는 우리가 늘 소극적 방어 정책을 취해 왔기 때문입니다. 역사가 되풀이되지 않도록 우리는 공세적이어야 합니다."
 AFG_isolism: "방어적인 외교 정책"
 AFG_isolism_desc: "아프가니스탄은 한때 역사적으로 강한 국가였고 두 전직 초강대국을 물리쳤지만, 오늘날 아프가니스탄이 지역 강국이 아님은 부인할 수 없습니다. 국민의 복지가 이 정부의 최우선 과제입니다. 우리는 또 다른 외세의 개입이나 침공을 피하기 위해 외교적으로 적극 방어 정책을 채택할 수 있습니다."
 AFG_increased_mobilization: "징병 확대"
 AFG_increased_mobilization_desc: "우리나라는 강력한 적들에 둘러싸여 있지만 국민은 싸울 준비가 되어 있지 않으며, 국민이 전쟁에 대비하도록 징병제를 시행해야 합니다."
 AFG_eyes_on_pakistan: "Publicly Denounce Durand Line"
 AFG_eyes_on_pakistan_desc: "19세기에 영국이 그은 두란트 선은 우리나라에 대한 수치이자 모욕입니다. 이 선은 우리 파슈툰 형제 대부분을 파키스탄이라는, 우리가 존재해서는 안 된다고 믿는 나라의 국경 안에 살게 만들었습니다. 우리는 결코 두란트 선을 인정하지 않을 것이며, 파키스탄이 역사적으로 우리 국민에게 가한 수십 년간의 고통을 잊지 않을 것입니다."
 AFG_defending_our_borders: "국경 방어"
 AFG_defending_our_borders_desc: "우리나라는 엄격한 중립 외교를 따르고 있지만, 주변 모든 나라가 안정적인 것은 아니므로 안심해서는 안 됩니다. 적극 방어 교리의 일환으로 파키스탄과의 국경에 방어 구조물을 건설할 것입니다."
 AFG_leg_infantry: "보병 개선"
 AFG_leg_infantry_desc: "과거 우리의 무기는 주로 이웃 국가와 지역 강국으로부터 얻은 것이었고, 우리 병사들은 주로 보병 위주였습니다. 병사들의 재무장은 미룰 수 있지만 우리의 무기는 현대에 심각하게 부족하므로 보병 무기를 쇄신해야 합니다."
 AFG_afghan_sof: "특수부대 중점"
 AFG_afghan_sof_desc: "21세기에 특수 부대는 종종 전장에 가장 먼저 들어가고 가장 나중에 빠져나오는 부대입니다. 이들은 정찰, 대테러, 재난 구호 등 가장 어렵지만 인정받지 못하는 임무를 맡습니다. 우리는 이러한 부대를 발전시켜야 합니다."
 AFG_mobile_units: "기동 부대 집중"
 AFG_mobile_units_desc: "현대전에서 보병은 고강도 분쟁 상황에서 의심할 여지 없이 총알받이입니다. 보병을 차량화한다면 그 효율성과 생존성이 크게 높아질 것입니다."
 AFG_preparing_invasion: "전쟁을 준비하라"
 AFG_preparing_invasion_desc: "정당히 우리 것인 파슈투니스탄을 되찾으려면 전쟁 준비를 시작해야 합니다. 파키스탄은 상대하기 쉬운 적이 아닐 것입니다."
 AFG_invade_pakistan: "우리의 영토를 되찾아라"
 AFG_invade_pakistan_desc: "때가 왔습니다. 동료 파슈툰 형제들을 파키스탄의 폭압적인 통치에서 해방시킬 때입니다."
 AFG_armoured_units: "기갑 부대 개발"
 AFG_armoured_units_desc: "제대로 된 기갑 부대가 없는 현대 군대는 효과적인 전투력이 아닙니다. 과거 전쟁에서 사용했던 전차는 다행히 경미한 손상, 파손된 궤도 등 쉽게 수리할 수 있는 문제만 입었습니다. 우리는 이 전차들을 수리하는 한편 자체 전차 설계를 개발하여 효과적인 기갑 군단을 편성할 수 있습니다."
 AFG_defensive_army: "방어군"
 AFG_defensive_army_desc: "우리의 국가 상황은 군사 부문에 예산을 너무 많이 쓸 수 없게 하지만, 소련과 영국을 몰아내려던 과거의 노력이 증명하듯 많은 경우 군의 전투 효율성은 무기의 현대성이나 수에 달려 있지 않습니다. 방어 전술을 가르침으로써 군사비를 과도하게 쓰지 않고도 군의 전투 효율성을 높일 수 있습니다."
 AFG_army_engineer_school: "육군 공병 학교"
 AFG_army_engineer_school_desc: "장교와 사병의 전투 효율성을 높이려면 미래의 장교를 가르칠 사관학교를 갖추는 것이 중요합니다. 정년을 보장받은 참전 용사들이 교수로 있는 만큼, 정부는 미래의 장교들이 우리 군을 성공으로 이끌 것이라 확신합니다."
 AFG_homeguard: "향토방위군"
 AFG_homeguard_desc: "군 지휘부의 관점에서 정규군만으로는 우리나라를 효과적으로 방어하기에 충분하지 않습니다. 다행히 우리의 독특한 지리는 산악전 전문가인 민병대 부대를 훈련할 수 있게 해 줍니다. 이 민병대원들은 평소에는 평범한 민간인 생활을 하지만 정기적인 군사 훈련을 받으며, 외세의 침략 시 우리나라를 지키기 위해 신속히 전투에 투입될 수 있습니다."
 AFG_the_swiss_way: "스위스처럼"
 AFG_the_swiss_way_desc: "아프가니스탄은 지난 세기 중반에 가장 평화롭고 안정적이었으며 당시 \\"중동의 스위스\\"라고 불렸습니다. 우리는 이 역사적 위상을 되찾으려 노력해야 합니다. 우리의 지리는 스위스와 어느 정도 비슷하며, 정부는 나라의 주요 거점 주변에 요새를 건설하는 데 스위스에게서 배울 수 있다고 생각합니다."
 AFG_superior_firepower: "화력 우세"
 AFG_superior_firepower_desc: "일부 국가에서는 순수한 군사력만으로도 공격자가 비용이 큰 침공을 감행하지 못하도록 억제할 수 있습니다. 우리는 국경을 가장 효과적으로 방어하기 위해 우세 화력 교리에 투자해야 합니다."
 AFG_military_research: "군사 연구"
 AFG_military_research_desc: "이제 나라가 안정되었으므로 국가 예산의 일부를 군사 연구, 특히 군용과 민수용으로 모두 사용할 수 있는 기술에 투자할 수 있습니다."
 AFG_moderate_islamists: "자미아티 이슬라미 정부"
 AFG_moderate_islamists_desc: "아흐마드 샤 마수드와 부르하누딘 랍바니는 우리나라의 단결을 증진한다는 의제를 가지고 있습니다. 이는 장차 나라를 되살릴 수 있는 계획처럼 들립니다. 현재 자미아트에이슬라미가 집권 중이며, 우리는 중앙 정부가 우리 의제를 위한 길을 닦도록 해야 합니다."
 AFG_fight_corruption: "정부 부패에 대적"
 AFG_fight_corruption_desc: "국민의 신뢰를 얻는 열쇠는 우리 정부가 나라에 만연한 부패에 맞서는 것입니다. 우리 정부가 권력층과 귀족 계급이 아닌 국민의 이익을 위해 봉사한다는 것을 국민이 아는 것이 중요합니다."
 AFG_decentralization: "지방분권화"
 AFG_decentralization_desc: "자미아트에이슬라미 의제의 핵심 중 하나는 분권화입니다. 아흐마드 샤 마수드는 아프가니스탄 내 권력 관계가 스위스 모델을 따라야 한다고 밝혔으며, 이는 사실상 분권형 정부를 만들고 카불로부터 권력을 이양하는 것을 의미합니다. 이를 통해 나라의 각 지방이 자원과 권력을 더 효율적으로 분배하여 나라 전체에 번영과 안정을 가져올 수 있습니다."
 AFG_jamiate_islami: "스위스 정치 모델"
 AFG_jamiate_islami_desc: "우리는 정부 구조를 개혁했으며 국민의 지지는 분명히 이 계획들의 편에 있습니다. 이제 아프가니스탄의 새로운 시대를 시작할 때입니다."
 AFG_authortarian: "아프가니스탄 국민 이슬람 운동 정부"
 AFG_authortarian_desc: "준비시밀리는 군 지도자 압둘 라시드 도스톰이 이끄는 포괄 정당 성격의 포퓰리스트 정당입니다. 이 정당은 세속주의를 증진하고, 아프가니스탄인·투르크멘인·우즈베크인의 이익을 보호하며, 지난 세기 공화제 통치 아래에서 누렸던 번영을 되찾는 것을 목표로 합니다. 도스톰은 분명 나라를 새로운 시대로 이끌 것입니다."
 AFG_helping_our_friends: "정치적 숙청"
 AFG_helping_our_friends_desc: "우리가 권력을 잡았지만, 과거의 동맹 중 일부는 중앙 정부의 권위에 큰 위협이 됩니다. 우리는 그들을 직위에서 숙청하고 우리에게 충성하는 이들로 대체해야 합니다."
 AFG_secularism_campaign: "세속 운동"
 AFG_secularism_campaign_desc: "도스톰 의제의 핵심 중 하나는 종교와 정치를 분리하는 것입니다. 이 조치는 중앙 정부의 힘을 키우고 물라들을 정치에서 배제하려는 것입니다. 이는 분명 일부 종교 공동체의 분노를 일으키겠지만, 우리는 여러 수단으로 이에 대응할 것입니다."
 AFG_junbishi_milli: "세속공화국 복원"
 AFG_junbishi_milli_desc: "지난 세기의 공화제 정부 아래에서 아프가니스탄은 빠르게 현대화될 수 있었고 여성은 해방되어 아프가니스탄 사회에 동등하게 참여할 수 있었습니다. 공화제 통치 방식은 아프가니스탄이 실제로 낡은 관습을 뒤로하고 나라를 현대화할 수 있음을 증명했습니다."
 AFG_pro_western: "친서방 독립국"
 AFG_pro_western_desc: "서방의 지원을 받는 독립 정부는 거의 확실히 서방 쪽으로 기울고 지역 내 현상 유지를 지속할 것입니다."
 AFG_supported_by_west: "서방 지원"
 AFG_supported_by_west_desc: "우리 정부는 내부의 부패 때문에 현재 국민의 지지를 받지 못하고 있습니다. 우리는 지배 엘리트를 국민의 분노로부터 보호해야 하며, 서방과 보조를 맞추고 있으므로 서방은 야당이 연립을 구성하도록 압박하는 것을 포함하여 분명 우리를 지원할 것입니다."
 AFG_increase_opium_trade: "비밀리에 마약 산업 지원"
 AFG_increase_opium_trade_desc: "아편 문제를 해결하겠다는 의지를 공개적으로 발표했음에도, 우리는 아무 조치도 취하지 않고 심지어 사복 경찰로 양귀비밭을 경비함으로써 아편 산업을 은밀히 지원할 수 있습니다. 그 대가로 아편 거물들로부터 상당한 정치 자금을 받게 될 것입니다."
 AFG_afghan_independents: "도둑정치 활성화"
 AFG_afghan_independents_desc: "변화? 변화가 누구에게 필요합니까? 우리에게는 우리를 도와줄 서방이 있고 상황은 계획대로 나아질 것입니다."
 AFG_remain_neutral: "중립을 향한 길"
 AFG_remain_neutral_desc: "20세기 중반 아프가니스탄의 번영은 서방에도 동방에도 치우치지 않는 것이 어느 쪽으로부터든 이익을 얻으면서도 어느 쪽의 비위도 거스르지 않을 수 있게 해 준다는 것을 증명했습니다. 이것이 오늘날 아프가니스탄에 가장 좋은 대외 관계 정책입니다."
 AFG_economy_first: "경제 우선"
 AFG_economy_first_desc: "우리는 중립적인 외교 관계를 추구하므로, 국가 발전의 초점은 민간 경제에 맞춰져야 하며 군사비는 스스로를 방어하고 우리가 직면한 반란을 진압할 수 있을 정도로만 낮게 유지되어야 합니다."
 AFG_looking_for_protection: "UN에 중립국 지위 인정 요청"
 AFG_looking_for_protection_desc: "영세 중립국으로서 의무를 이행할 능력을 입증한 만큼, 이제 유엔의 승인을 받고 유엔 안전보장이사회 상임이사국 최소 한 곳으로부터 우리가 영세 중립국으로 남을 것임을 보장받기만 하면 됩니다."
 AFG_idea_enhanced_recruitment_efforts: "강화된 징병 주력"
 AFG_idea_enhanced_recruitment_efforts_desc: "우리 국민이 군에 입대하도록 고무되고 있습니다. 싸울 인력이 없다면 이 전쟁에서 이길 수 없습니다."
 AFG_idea_starting_offensive: "공세 시작"
 AFG_idea_starting_offensive_desc: "우리는 너무 오랫동안 수세에 몰려 있었습니다. 이제 전세를 뒤집고 잃어버린 땅을 정복하기 위해 진격을 시작할 때입니다."
 AFG_idea_changing_economy: "산업 경제"
 AFG_idea_changing_economy_desc: "우리가 아편 기반 경제에서 방향을 전환함에 따라, 국제 투자자들과 강대국들이 큰 관심을 가지고 우리나라를 바라보기 시작했습니다."
 AFG_idea_war_experience: "전쟁 경험"
 AFG_idea_war_experience_desc: "장기간의 전쟁은 우리 세대를 전사의 세대로 만들었습니다."
 AFG_idea_equipment_production: "소규모 장비 생산"
 AFG_idea_equipment_production_desc: "카불과 헤라트의 작업장들이 자체적으로 소화기와 경장비를 생산하기 시작했습니다. 물량은 많지 않지만, 국내에서 조립되는 소총 한 정 한 정은 더 이상 해외에서 사 올 필요가 없는 소총입니다."
 AFG_idea_large_equipment_production: "대규모 장비 생산"
 AFG_idea_large_equipment_production_desc: "우리의 무기 작업장은 제대로 된 공장으로 성장하여, 이미 생산하던 소화기와 경장비에 더해 다목적 차량까지 추가했습니다. 이제 아프가니스탄은 자국 병사들이 휴대하는 장비의 대부분을 공급할 수 있습니다."
 AFG_idea_water_infrastructure_construction: "수자원 기반시설 건설 시작"
 AFG_idea_water_infrastructure_construction_desc: "우리나라는 최근 수자원 기반시설 사업을 시작했습니다. 제때 완료하려면 노동력에 많은 청년 성인이 필요할 것입니다."
 AFG_idea_recent_public_transportation: "최근 재도입된 대중 교통"
 AFG_idea_recent_public_transportation_desc: "우리나라는 최근 대중교통 체계를 다시 도입했으며, 이는 경제 호황기를 가져올 것입니다. 우리나라 국민 대부분이 자가용이 없으므로 교통망의 혜택을 분명 누릴 것이기 때문입니다."
 AFG_idea_recovered_from_war: "내전으로부터의 회복"
 AFG_idea_recovered_from_war_desc: "수십 년간의 전쟁 끝에 마침내 평화가 찾아왔습니다. 나라에 다시 미래가 생겼기에 국민은 나라를 위해 일할 의욕에 차 있습니다."
 AFG_idea_tribal_support: "부족의 지지"
 AFG_idea_tribal_support_desc: "우리의 부족 중심 정책은 부족들의 지지를 얻었으며, 이들은 이제 자신들의 이익이 충분히 보장되는 한 중앙 정부의 권위를 기꺼이 존중합니다."
 AFG_idea_diplomatic_interaction: "외교적 관계"
 AFG_idea_diplomatic_interaction_desc: "우리 정부는 마침내 국제 무대에서 다른 나라들과 교류하기 시작했으며, 처음 몇 달 동안은 이로부터 단기적 이익을 누릴 것입니다. 그러나 우리가 겪은 고통을 잊지는 않을 것입니다."
 AFG_idea_prepare_king_return: "왕의 복귀에 준비하라"
 AFG_idea_prepare_king_return_desc: "우리 국왕은 안타깝게도 여전히 이탈리아에서 망명 중입니다. 그의 불가피한 귀환에 앞서 미리 준비를 해 두어야 합니다."
 AFG_idea_internal_policy_debate: "내부 정책 갈등"
 AFG_idea_internal_policy_debate_desc: "정부는 국내 국민을 위해 나라의 미래를 결정할 수 있는 정책들에 대한 논의를 시작했습니다."
 AFG_idea_tribal_culture: "아프간 부족 문화"
 AFG_idea_tribal_culture_desc: "아프가니스탄은 근대 이전의 부족 문화로 잘 알려져 있으며 나라 전체가 \\"카불\\"과 \\"카불이 아닌 곳\\"의 차이로 나뉘어 있습니다. 역사적으로 중앙 정부가 지역 차원의 이익에 부응하기는 어려웠습니다. 각 부족의 사람들은 원로들에게 우선적으로 충성합니다. 부족에 속한 병사들이 싸울지 여부는 원로들의 결정에 달려 있습니다."
 AFG_idea_factional_infighting: "북부동맹 내부 파벌 갈등"
 AFG_idea_factional_infighting_desc: "아프가니스탄 북부 동맹은 서로 싸워왔던 여러 군벌들로 구성되어 있으며, 탈레반이 모든 군벌을 제거하려는 목표를 가지고 있기 때문에 탈레반에 저항하기 위해 함께 뭉쳐야 했습니다. 그럼에도 불구하고 군벌 간의 내전은 여전히 자주 발생하고 있으며, 일부 군벌들은 적대적인 파벌을 물리치기 위해 탈레반과 비밀리에 공모하기도 합니다.\n§W--------------§!\n£GFX_AFG_salafist_jihadism §Y탈레반§! 정권이 §Y전복§!되면 §R제거§!될 것이지만, 내전은 §R계속될§! 것입니다."
 AFG_idea_offensive_army: "공격적인 군대"
 AFG_idea_offensive_army_desc: "민간 지도부의 영향 아래 군은 공세적인 외교 정책을 추구하기로 했습니다."
 AFG_idea_defensive_army: "방어적인 군대"
 AFG_idea_defensive_army_desc: "민간 지도부의 영향 아래 군은 방어적인 외교 정책을 추구하기로 했습니다."
 AFG_offensive_war_preparation: "전쟁 준비"
 AFG_offensive_war_preparation_desc: "군을 전쟁에 대비시키려면 군을 완전히 동원하고 훈련시키기 위해 추가적인 노력을 기울여야 합니다."
 AFG_idea_state_sponsored_opium_industry: "국가주도 아편 산업"
