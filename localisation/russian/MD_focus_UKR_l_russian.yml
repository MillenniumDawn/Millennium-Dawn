 ukraine_modernize_sov_equipment_btr_60_modernization_btr_60m: "Заказать §YБТР-60М§! в Николаеве"
 ukraine_modernize_sov_equipment_btr_60_modernization_btr_60m_desc: "\n\n\n\n\n\n£UKR_desctext_modernize_sov_btr60m_for_tooltip\n\n\n\n\n\n\n\n\n§WВ нашей армии всё ещё служат сотни советских §YБТР-60ПБ§!. Два их бензиновых двигателя прожорливы и легко загораются. ХКБМ им. Морозова в Харькове разработало §YБТР-60М§!, где их заменяет один 300-сильный дизель УТД-20 от БМП-1, а штатная башня с 14.5-мм КПВТ остаётся. §YНиколаевский бронетанковый завод§! готов его строить.\n\nНа этом варианте основаны последующие модернизации БТР-60.\n------------------\nЭто решение — §Rобязательное условие§! для решения §YБТР-60МК§!. Если §Rпропустить§! его, вы §Rпотеряете§! возможность выполнить его.§!"
 ukraine_modernize_sov_equipment_btr_60_modernization_btr_60m_mission: "Последний шанс: §YБТР-60М§!"
 ukraine_modernize_sov_equipment_btr_60_modernization_btr_60m_mission_desc: "$ukraine_modernize_sov_equipment_btr_60_modernization_btr_60m_desc$\n\n§RКогда таймер истечёт, завод отзовёт предложение.§!"
 ukraine_modernize_sov_equipment_btr_60_modernization_approach: "Выбрать будущее наших §YБТР-60§!"
 ukraine_modernize_sov_equipment_btr_60_modernization_approach_desc: "\n\n\n\n\n\n£UKR_desctext_modernize_sov_btr60_for_tooltip\n\n\n\n\n\n\n\n\n§WВойна на востоке показала, что нам по-прежнему нужен каждый бронетранспортёр. Министерство обороны хочет решить, как сохранить в строю наши старые БТР-60. Если у нас уже есть §YБТР-60М§!, §YКОРТ§! может развить его дальше. §YНВК «Техимпекс»§! предлагает модернизацию поскромнее, подходящую для любого БТР-60ПБ.\n------------------\nЭто решение — §Rобязательное условие§! для решений §YБТР-60МК§! и §YБТР-60ПБ-Т§!. Если §Rпропустить§! его, вы §Rпотеряете§! возможность выполнить их.§!"
 ukraine_modernize_sov_equipment_btr_60_modernization_approach_mission: "Крайний срок: будущее наших §YБТР-60§!"
 ukraine_modernize_sov_equipment_btr_60_modernization_approach_mission_desc: "$ukraine_modernize_sov_equipment_btr_60_modernization_approach_desc$\n\n§RКогда таймер истечёт, выбирать всё равно придётся.§!"
 ukraine_modernize_sov_equipment_btr_60_modernization_kort_btr_60mk: "Заказать §YБТР-60МК§! у КОРТ"
 ukraine_modernize_sov_equipment_btr_60_modernization_kort_btr_60mk_desc: "\n\n\n\n\n\n£UKR_desctext_modernize_sov_btr60mk_for_tooltip\n\n\n\n\n\n\n\n\n§WКомпания §YКОРТ§! развивает нашу работу над §YБТР-60М§!. Её §YБТР-60МК§! получает два дизеля Cummins, навесную броню и увеличенные боковые люки для десанта. Позже башню можно заменить николаевским боевым модулем с 14.5-мм и 7.62-мм пулемётами и гранатомётом АГС-17.§!"
 ukraine_modernize_sov_equipment_btr_60_modernization_kort_btr_60mk_mission: "Последний шанс: §YБТР-60МК§!"
 ukraine_modernize_sov_equipment_btr_60_modernization_kort_btr_60mk_mission_desc: "$ukraine_modernize_sov_equipment_btr_60_modernization_kort_btr_60mk_desc$\n\n§RКогда таймер истечёт, КОРТ отзовёт предложение.§!"
 ukraine_modernize_sov_equipment_btr_60_modernization_techimpex_btr_60pb_t: "Заказать §YБТР-60ПБ-Т§! у «Техимпекс»"
 ukraine_modernize_sov_equipment_btr_60_modernization_techimpex_btr_60pb_t_desc: "\n\n\n\n\n\n£UKR_desctext_modernize_sov_btr60pb_t_for_tooltip\n\n\n\n\n\n\n\n\n§W§YНВК «Техимпекс»§! предлагает §YБТР-60ПБ-Т§!. Старую башню сменяет боевой модуль БМ-23-2, бензиновые двигатели заменяются дизелями, а система охлаждения двигателя, водомётный движитель и электрооборудование обновляются.§!"
 ukraine_modernize_sov_equipment_btr_60_modernization_techimpex_btr_60pb_t_mission: "Последний шанс: §YБТР-60ПБ-Т§!"
 ukraine_modernize_sov_equipment_btr_60_modernization_techimpex_btr_60pb_t_mission_desc: "$ukraine_modernize_sov_equipment_btr_60_modernization_techimpex_btr_60pb_t_desc$\n\n§RКогда таймер истечёт, «Техимпекс» отзовёт предложение.§!"
 ukraine_modernize_sov_equipment_btr_60_modernization_techimpex_btr_60pb_t_no_tech: "Разработать §YБТР-60ПБ-Т§! с «Техимпекс»"
 ukraine_modernize_sov_equipment_btr_60_modernization_techimpex_btr_60pb_t_no_tech_desc: "$ukraine_modernize_sov_equipment_btr_60_modernization_techimpex_btr_60pb_t_desc$\n\n§WСобственных необитаемых башен у нас пока нет, поэтому §YНВК «Техимпекс»§! придётся разрабатывать установку для БМ-23-2 с нуля. Работа займёт больше времени и обойдётся дороже, но даст нам технологию.§!"
 ukraine_modernize_sov_equipment_btr_60_modernization_techimpex_btr_60pb_t_no_tech_mission: "Последний шанс: §YБТР-60ПБ-Т§!"
 ukraine_modernize_sov_equipment_btr_60_modernization_techimpex_btr_60pb_t_no_tech_mission_desc: "$ukraine_modernize_sov_equipment_btr_60_modernization_techimpex_btr_60pb_t_no_tech_desc$\n\n§RКогда таймер истечёт, «Техимпекс» отзовёт предложение.§!"
 ukraine_modernize_sov_equipment_btr_60_modernization_unmanned_turret_tt: "Когда §YБТР-60ПБ-Т§! будет принят на вооружение, мы также получим технологию §YСовременное боевое отделение и вспомогательные системы§!, открывающую §YНеобитаемую башню§!."
 ukraine_modernize_sov_equipment_btr_60_modernization.1.name: "БТР-60М готов"
 ukraine_modernize_sov_equipment_btr_60_modernization.1.desc: "Николаевский завод завершил §YБТР-60М§!. Один дизель УТД-20 теперь заменяет два бензиновых двигателя, что снижает расход топлива и пожароопасность, а штатная башня сохраняет 14.5-мм КПВТ и 7.62-мм ПКТ. В будущем на основе этой конструкции могут работать и другие компании."
 ukraine_modernize_sov_equipment_btr_60_modernization.1.a: "Принять на вооружение §YБТР-60М§!"
 ukraine_modernize_sov_equipment_btr_60_modernization.1.b: "Приостановить проект"
 ukraine_modernize_sov_equipment_btr_60_modernization.2.name: "Будущее наших БТР-60"
 ukraine_modernize_sov_equipment_btr_60_modernization.2.desc: "У Министерства обороны на столе два предложения по БТР-60. §YКОРТ§! хочет развить наш §YБТР-60М§! с дизелями Cummins, навесной бронёй и увеличенными люками. §YНВК «Техимпекс»§! предлагает §YБТР-60ПБ-Т§!, который перевооружает старые машины и даёт им дизельные двигатели."
 ukraine_modernize_sov_equipment_btr_60_modernization.2.a: "Развить §YБТР-60М§! вместе с КОРТ"
 ukraine_modernize_sov_equipment_btr_60_modernization.2.b: "Перейти на §YБТР-60ПБ-Т§! от «Техимпекс»"
 ukraine_modernize_sov_equipment_btr_60_modernization.3.name: "Будущее наших БТР-60"
 ukraine_modernize_sov_equipment_btr_60_modernization.3.desc: "Мы так и не построили §YБТР-60М§!, поэтому глубокую модернизацию наших БТР-60 пришлось бы начинать с нуля. Вместо этого §YНВК «Техимпекс»§! предлагает модернизацию поскромнее: §YБТР-60ПБ-Т§! перевооружает старые машины и даёт им дизельные двигатели."
 ukraine_modernize_sov_equipment_btr_60_modernization.3.a: "Заказать небольшую модернизацию у «Техимпекс»"
 ukraine_modernize_sov_equipment_btr_60_modernization.4.name: "БТР-60МК готов"
 ukraine_modernize_sov_equipment_btr_60_modernization.4.desc: "§YКОРТ§! завершила §YБТР-60МК§! с двумя дизелями Cummins, навесной бронёй и увеличенными боковыми люками для десанта."
 ukraine_modernize_sov_equipment_btr_60_modernization.4.a: "Принять на вооружение §YБТР-60МК§!"
 ukraine_modernize_sov_equipment_btr_60_modernization.4.b: "Приостановить проект"
 ukraine_modernize_sov_equipment_btr_60_modernization.5.name: "БТР-60ПБ-Т готов"
 ukraine_modernize_sov_equipment_btr_60_modernization.5.desc: "§YНВК «Техимпекс»§! передала §YБТР-60ПБ-Т§! с боевым модулем БМ-23-2, дизельными двигателями и обновлёнными системами охлаждения, водомётного движителя и электрооборудования."
 ukraine_modernize_sov_equipment_btr_60_modernization.5.a: "Принять на вооружение §YБТР-60ПБ-Т§!"
