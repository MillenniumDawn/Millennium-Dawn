 karabakh.1.t: "우리 진지를 공격한 [ARM.GetNameWithFlag]!"
 karabakh.1.d: "나고르노카라바흐군과 아르메니아군이 미승인 나고르노카라바흐 공화국과의 국경 맞은편에 있는 우리 진지에 포격을 시작했습니다. 우리 군은 적의 공격을 격퇴하려 하고 있습니다."
 karabakh.1.a: "젠장!"
 karabakh.2.t: "[ARM.GetNameWithFlag]의 교전 승리!"
 karabakh.2.d: "최근 아르메니아군과 아제르바이잔군 부대 사이의 교전에서 아르메니아군이 승리하여 아제르바이잔 측에 큰 손실을 입혔습니다."
 karabakh.2.a: "분쟁은 계속된다"
 karabakh.3.t: "[ARM.GetNameWithFlag]의 교전 패배!"
 karabakh.3.d: "최근 아르메니아군과 아제르바이잔군 부대 사이의 교전에서 아제르바이잔군이 승리하여 아르메니아 측에 큰 손실을 입혔습니다."
 karabakh.3.a: "분쟁은 계속된다"
 karabakh.4.t: "교착 상태로 끝난 교전!"
 karabakh.4.d: "아르메니아군이 최근 아제르바이잔 진지를 공격한 이후 교전은 무승부로 끝났으며 진지에는 변화가 없었습니다."
 karabakh.4.a: "분쟁은 계속된다"
 karabakh.5.t: "우리 진지를 공격한 [AZE.GetNameWithFlag]!"
 karabakh.5.d: "아제르바이잔군이 아제르바이잔과의 국경 맞은편에 있는 우리 진지에 포격을 시작했습니다. 우리 군은 적의 공격을 격퇴하려 하고 있습니다."
 karabakh.5.a: "젠장!"
 karabakh.6.t: "[AZE.GetNameWithFlag]의 교전 승리!"
 karabakh.6.d: "최근 아르메니아군과 아제르바이잔군 부대 사이의 교전에서 아제르바이잔군이 승리하여 아르메니아 측에 큰 손실을 입혔습니다."
 karabakh.6.a: "분쟁은 계속된다"
 karabakh.7.t: "[AZE.GetNameWithFlag]의 교전 패배!"
 karabakh.7.d: "최근 아르메니아군과 아제르바이잔군 부대 사이의 교전에서 아르메니아군이 승리하여 아제르바이잔 측에 큰 손실을 입혔습니다."
 karabakh.7.a: "분쟁은 계속된다"
 karabakh.8.t: "드론 정찰 작전 성공!"
 karabakh.8.d: "최근 우리 정찰 드론이 작전에 성공하여 적에 관한 상당한 양의 정보를 수집했습니다."
 karabakh.8.a: "좋군!"
 karabakh.9.t: "드론 격추"
 karabakh.9.d: "우리의 공중 정찰 활동이 적에게 발각되었으며, 우리 드론이 운 좋은 휴대용 대공 미사일 사격에 격추되어 귀중한 장비를 잃었습니다."
 karabakh.9.a: "**** 놈들!"
 karabakh.101.t: "적 드론 격추"
 karabakh.101.d: "최근 적의 무인 정찰 드론이 운 좋은 휴대용 대공 미사일 사격에 격추되었습니다. 적의 정찰 임무는 실패했으며 그들은 귀중한 장비를 잃었습니다."
 karabakh.101.a: "좋군!"
 karabakh.10.t: "90년대 협상에 대한 우리의 최종 입장"
 karabakh.10.d: "90년대에 아제르바이잔은 우리의 승리를 인정하며, 우리가 승인의 대가로 하드루트 지역을 아제르바이잔에 넘기는 데 동의한다면 아르차흐를 승인하겠다고 했습니다. 승인의 대가로 영토를 내주는 것은 좋은 거래일 수 있지만, 우리 내부 세력들은 이에 몹시 불만을 가질 수 있습니다. 이 거래는 또한 우리가 정치적 야망을 가질 수 있는 능력을 파괴할 수도 있습니다..."
 karabakh.10.a: "동의해야 한다. 이쪽이 더 미래 지향적인 해결책이다."
 karabakh.10.b: "영토를 넘기는 것은 용납할 수 없다."
 karabakh.11.t: "우리의 90년대 조건에 동의한 [ARM.GetNameWithFlag]!"
 karabakh.11.d: "최근 성명에서 아르메니아 측은 우리가 나고르노카라바흐 공화국을 승인하는 대가로 하드루트 지역을 우리에게 이양한다는 우리의 오랜 조건에 동의했습니다. 분쟁은 완전히 해결될 것이며 우리는 아르메니아와 불가침 조약을 체결할 것입니다. 현재 아르메니아가 군사력에서 우리를 크게 능가한다는 점을 고려할 가치가 있습니다."
 karabakh.11.a: "훌륭하다, 이 조건에 동의한다!"
 karabakh.11.b: "메그리를 통과하는 회랑도 필요하다..."
 karabakh_news.2.t: "나고르노카라바흐 분쟁 해결!"
 karabakh_news.2.d: "오랜 세월 해결되지 않은 분쟁 끝에 아르메니아와 아제르바이잔 양측은 독자적으로 나고르노카라바흐 분쟁에 관한 합의에 도달했으며, 양측의 이익을 보장하는 해당 결의에 서명할 수 있었습니다. 이 변화가 남캅카스에 무엇을 가져올지는 여전히 미지수입니다."
 karabakh_news.2.o1: "캅카스에 평화가?"
 karabakh.12.t: "[ARM.GetNameWithFlag]의 나고르노카라바흐 완전 승인 요구!"
 karabakh.12.d: "최근 성명에서 아르메니아 측은 우리가 나고르노카라바흐 공화국을 승인하는 대가로 하드루트 지역을 우리에게 이양한다는 우리의 오랜 조건을 거부했습니다. 그들은 영토 변경 없이 나고르노카라바흐 공화국의 완전한 승인을 요구합니다. 현재 아르메니아가 군사력에서 우리를 크게 능가한다는 점을 고려할 가치가 있습니다. 지금은 말입니다."
 karabakh.12.a: "장기적으로는 우리가 승리할 것이다. 다음 협상에서 판돈을 올려라."
 karabakh.12.b: "어쩌면... 그들의 제안을 받아들여야 할까?"
 karabakh.13.t: "우리 제안을 거부한 [AZE.GetNameWithFlag]!"
 karabakh.13.d: "아제르바이잔은 우리의 협상 조건을 거부하고 새로운 조건에 관한 논의를 다음 회담으로 미뤘습니다."
 karabakh.13.a: "그렇다면 대비하자."
 karabakh.14.t: "우리의 새로운 입장"
 karabakh.14.d: "첫 번째 협상 라운드가 실패로 돌아간 후, 우리는 마침내 협상 과정에 대한 우리 입장을 재고할 준비가 되었습니다. 자네주르를 통과하는 통로를 요구해야 합니까, 아니면 협상 입장을 포기해야 합니까?"
 karabakh.14.a: "그들에게 우리의 새로운 요구 사항을 제시한다."
 karabakh.14.b: "나고르노카라바흐를 승인하자."
 karabakh.15.t: "[AZE.GetNameWithFlag]의 새로운 요구 사항 제시!"
 karabakh.15.d: "최근 아제르바이잔 정부가 우리에게 아르차흐 승인을 위한 새로운 요구 사항을 제시했습니다. 그들은 여전히 우리가 하드루트를 넘기기를 원하며, 이제는 이를 나히체반과 연결하는 시우니크 통과 회랑까지 원합니다. 이 새로운 조건에 동의해야 합니까?"
 karabakh.15.a: "이 조건은 용납할 수 없다!"
 karabakh.15.b: "충분히 합리적으로 들린다."
 karabakh.16.t: "우리 제안을 거부한 [ARM.GetNameWithFlag]!"
 karabakh.16.d: "아르메니아는 우리의 협상 조건을 거부하고 새로운 조건에 관한 논의를 다음 회담으로 미뤘습니다."
 karabakh.16.a: "그렇다면 대비하자."
 karabakh.17.t: "새로운 협상 입장"
 karabakh.17.d: "실패로 끝난 지난 협상 라운드 이후, 우리는 아르메니아에 대한 요구를 재고해야 합니다. 국제 무대에서 우리의 위상이 강화되었음을 고려하여, 나고르노카라바흐를 아르메니아의 일부로 승인하는 대가로 카르바차르 지역도 요구해야 합니다. 이것이 우리에게 가장 유리한 입장으로 보입니다."
 karabakh.17.a: "아르메니아에 새로운 조건을 제시한다."
 karabakh.17.b: "카라바흐를 아예 포기하자..."
 karabakh.18.t: "[AZE.GetNameWithFlag]의 새로운 조건!"
 karabakh.18.d: "최근 아제르바이잔은 아르차흐를 우리 영토로 승인하는 데 대한 새로운 요구 사항을 제시했습니다. 이제 그들은 스테파나케르트를 아르메니아 영토로 승인하는 대가로 카르바차르와 하드루트를 요구합니다. 아제르바이잔이 강해진 점을 고려할 때 이는 우리에게 큰 문제가 될 수 있습니다."
 karabakh.18.a: "이 조건은 용납할 수 없다!"
 karabakh.18.b: "항복해야 한다..."
 karabakh.24.t: "[ARM.GetNameWithFlag]의 나고르노카라바흐 승인 및 병합!"
 karabakh.24.d: "아르메니아는 예상치 못한 침략 행위로 나고르노카라바흐의 완전한 병합과 승인을 선언했습니다. 우리는 이를 완전하고 무조건적인 침략 행위로 인식합니다!"
 karabakh.24.a: "전진, 공격하라!"
 karabakh_news.3.t: "제2차 나고르노카라바흐 전쟁"
 karabakh_news.3.d: "최근의 사건으로 인해 아제르바이잔은 미승인 나고르노카라바흐 공화국 영토에 전면 공세를 개시했습니다. 아제르바이잔의 직접 침공에도 불구하고 나고르노카라바흐 영토는 아르메니아군에게 점령되었으며, 이로 인해 아제르바이잔은 침략이 아르메니아 측에서 비롯되었다는 인상을 받고 있습니다."
 karabakh_news.3.o1: "어두운 시대다."
 karabakh.25.t: "나고르노카라바흐의 기회!"
 karabakh.25.d: "나고르노카라바흐 전쟁이 지역의 세력 균형을 뒤흔들 만큼 오래 이어지고 있습니다. 이를 이용해 아르차흐에 우리 평화유지군을 투입하고 아르메니아가 일부 영토를 포기하도록 강요할 수도 있을 것입니다. 그렇게 하면 아르메니아와 아제르바이잔에 대한 우리의 영향력이 커질 것입니다. 실행하시겠습니까?"
 karabakh.25.a: "물론입니다!"
 karabakh.25.b: "우리가 관여할 일이 아닙니다."
 karabakh.26.t: "[SOV.GetNameWithFlag]의 카라바흐 문제 해결 요구!"
 karabakh.26.d: "러시아는 전쟁이 지나치게 번졌다고 판단하며, 우리가 양측 사이의 휴전을 협상해야 한다고 봅니다. 동의하시겠습니까?"
 karabakh.26.a: "물론이죠..."
 karabakh.26.b: "아니!"
 karabakh.27.t: "휴전 제안을 거부한 [FROM.GetNameWithFlag]!"
 karabakh.27.d: "[FROM.GetNameWithFlag]이(가) 우리의 휴전 제안을 거부했습니다. 우리는 이들에게 제재를 가했으나, 이들에 대한 우리의 영향력은 감소했습니다."
 karabakh.27.a: "나쁜 놈들!"
 karabakh.28.t: "[SOV.GetNameWithFlag]의 카라바흐 문제 해결 요구!"
 karabakh.28.d: "러시아는 전쟁이 지나치게 번졌다고 판단하며, 우리가 양측 사이의 휴전을 협상해야 한다고 봅니다. 아제르바이잔은 이미 동의했습니다. 동의하시겠습니까?"
 karabakh.28.a: "물론이죠..."
 karabakh.28.b: "끝까지 싸울 것이다!"
 karabakh_news.4.t: "나고르노카라바흐에서 휴전 성립!"
 karabakh_news.4.d: "러시아의 외교적 노력 덕분에 아르메니아와 아제르바이잔 양측이 휴전 협정에 서명하면서 최근 나고르노카라바흐 분쟁이 중단되었습니다. 남코카서스에 평화가 유지될 것인지, 아니면 이러한 변화가 오래가지 못할 것인지 주목됩니다."
 karabakh_news.4.o1: "마침내 평화가 찾아왔다."
 karabakh.29.t: "나고르노카라바흐 제2차 공세!"
 karabakh.29.d: "나고르노카라바흐를 다시 공격하여 남은 모든 것을 차지할 때가 왔습니다."
 karabakh.29.a: "전진!"
 arm_reaction.1.t: "조지아의 압하지야 병합"
 arm_reaction.1.d: "조지아 정부는 우리를 배제한 채 압하지야를 복속시키고 자국으로의 통합을 시작하겠다고 발표했습니다. 우리는 철저히 무시당한 채 기정사실을 통보받았다는 점에 극도로 분개하고 있습니다. 우리의 지정학적 이익을 침해한 이 행위에 어떻게 대응할지 결정할 때입니다."
 arm_reaction.1.a: "양동 작전을 펼친다."
 arm_reaction.1.b: "압하지야에서 봉기를 일으키자."
 arm_reaction.1.c: "분노를 표명하자."
 arm_reaction.1.f: "조지아에 선전포고한다."
 arm_reaction.2.t: "러시아가 벌인 공작!"
 arm_reaction.2.d: "압하지야가 우리 국가에 병합된 데 대한 보복으로, 러시아는 우리의 정치 구조를 교란하고 여러 민감한 사안을 둘러싸고 여론을 흔들려는 보복 공작을 감행하기로 했습니다."
 arm_reaction.2.a: "한심하군"
 arm_reaction.3.t: "압하지야의 폭동"
 arm_reaction.3.d: "러시아는 우리와 압하지야의 재통합을 받아들이지 못했고, 자국 군부에 충성하는 세력을 규합하여 쿠데타를 일으켰습니다. 게다가 러시아는 우리와의 전쟁 개시를 선언했습니다. 조지아의 통일을 바라는 우리의 염원 때문에 우리를 파괴하려는 듯합니다."
 arm_reaction.3.a: "미치광이들!"
 arm_reaction.4.t: "친러시아 쿠데타"
 arm_reaction.4.d: "러시아 특수 기관이 우리 공화국에서 쿠데타를 일으켜 권력을 장악했습니다. 이제 우리는 러시아의 통제 아래 놓였을 뿐 아니라, 러시아가 선전포고한 조지아와의 전쟁에도 휘말리게 되었습니다."
 arm_reaction.4.a: "두 불길 사이에서"
 arm_reaction.5.t: "러시아의 불만 표명"
 arm_reaction.5.d: "러시아는 압하지야 문제가 자신들의 참여 없이 해결된 데 대해 강한 불만을 표명하고 있습니다. 러시아와의 관계는 영영 망가졌을지도 모르지만, 이제 압하지야가 우리 손에 있으며 이것이 우리에게는 훨씬 더 중요합니다."
 arm_reaction.5.a: "울게 내버려 두자"
 arm_reaction.7.t: "러시아가 벌인 공작!"
 arm_reaction.7.d: "러시아는 우리가 더 이상 괴뢰국이 아니라는 사실을 받아들이지 못하고, FSB 병력을 동원해 정치 공작을 조직하여 정세를 뒤흔들려 하고 있습니다. 그러나 우리는 어떻게든 맞서 버틸 것입니다!"
 arm_reaction.7.a: "한심하군"
 arm_reaction.8.t: "친러시아 폭동"
 arm_reaction.8.d: "러시아의 영향권에서 이탈한 우리의 결정은 러시아 정부를 크게 모욕했지만, 우리는 이들이 우리나라에 행사하는 영향력의 크기를 과소평가했습니다. 이들은 우리를 겨냥하여 자신들에게 충성하는 세력의 반란을 조직하는 데 성공했습니다."
 arm_reaction.8.a: "한심하군"
 arm_reaction.9.t: "러시아의 불만 표명"
 arm_reaction.9.d: "러시아는 우리가 그들의 괴뢰 정부를 너무나 쉽고 빠르게 무너뜨린 데 대해 심각한 분노와 불만을 표명했습니다."
 arm_reaction.9.a: "울게 내버려 두자"
 arm_reaction.10.t: "러시아와의 전쟁!"
 arm_reaction.10.d: "우리는 러시아가 우리에 대한 통제권 상실을 받아들이지 않으리라 짐작했지만, 이들은 우리를 놓아주지 않기 위해서라면 피바다도 마다하지 않을 태세입니다!"
 arm_reaction.10.a: "미치광이들!"
 arm_reaction.11.t: "아제르바이잔에 와그너 PMC 파견"
 arm_reaction.11.d: "아르메니아에 대한 압박이 계속되고 있으며, 우리는 전투 지역을 확대할 준비가 되어 있습니다. 와그너 PMC는 아제르바이잔으로 가서 현지에서 아르메니아 정부에 대한 반란을 일으킬 준비가 되어 있습니다."
 arm_reaction.11.a: "출발한다"
 arm_reaction.11.b: "아니요"
 arm_reaction.12.t: "아제르바이잔의 와그너 PMC 반란"
 arm_reaction.12.d: "러시아는 우리 국가의 단합을 계속 약화시키고 있습니다. 와그너 PMC가 아제르바이잔에 파견되어 우리에 대한 봉기를 일으켰습니다. 반란군의 수는 적지만, PMC 대대들은 우리에게 충분히 맞서 싸울 능력이 있습니다."
 arm_reaction.12.a: "사태가 악화되고 있다"
 arm_reaction.13.t: "아제르바이잔의 승인 요청"
 arm_reaction.13.d: "아제르바이잔에서의 반란은 성공했으나, 이제 그들의 정부는 우리에게 공식 승인과 함께 우리의 보호령이 되어 달라고 요청하고 있습니다. 아르메니아와의 전쟁에서 패배할 가능성에 대비하려는 것일 수도 있으나, 그렇게 되면 우리도 이 전쟁에 개입해야 합니다."
 arm_reaction.13.a: "전쟁으로!"
 arm_reaction.13.b: "우리의 도움만으로 충분하다."
 arm_reaction.14.t: "아르메니아의 코카서스 분리주의 세력 지원"
 arm_reaction.14.d: "우리 특수 기관은 아르메니아 특수 기관이 코카서스의 분리주의 단체들을 지원하고 있다는 사실을 확인했습니다. 이는 아르메니아 특수 기관을 통해 이 지역의 정세 불안정을 전면적으로 부추기는 행위이며, 이제 이들에게 대응할 때입니다."
 arm_reaction.14.a: "양동 작전을 펼친다."
 arm_reaction.14.b: "그들의 지역에서 분리주의를 지원한다."
 arm_reaction.14.c: "분노를 표명하자."
 arm_reaction.14.f: "아르메니아에 선전포고한다."
 arm_reaction.15.t: "러시아가 벌인 공작!"
 arm_reaction.15.d: "러시아 특수 기관은 코카서스의 분리주의 세력 지원에 우리가 관여한 사실을 확인한 것으로 보이며, 우리 정치 체제를 교란하는 방식으로 즉각 보복하기로 결정했습니다."
 arm_reaction.15.a: "한심하군"
 arm_reaction.16.t: "러시아의 분리주의 세력 지원"
 arm_reaction.16.d: "러시아 특수 기관이 우리 괴뢰국들 내부의 분리주의 세력을 적극적으로 지원하고 있으며, 이로 인해 이 지역에서의 우리 영향력이 약화되고 있습니다."
 arm_reaction.16.a: "한심하군"
 arm_reaction.17.t: "러시아의 불만 표명"
 arm_reaction.17.d: "러시아는 자국 영토 내 분리주의에 대한 우리의 지원에 노골적인 불만을 표명하고 있습니다."
 arm_reaction.17.a: "울게 내버려 두자"
 arm_reaction.18.t: "러시아와의 전쟁!"
 arm_reaction.18.d: "러시아는 자국 지역의 분리주의 세력에 대한 우리의 지원에 강경하게 대응하기로 결정하고, 예고 없이 우리에게 선전포고했습니다."
 arm_reaction.18.a: "미치광이들!"
 ARM_retire_tt: "§W효과:§!\n§H[ROOT.GetLeader]§!§W이(가) [ROOT.GetName]의 지도자직에서 은퇴합니다.§!\n§H[show_ruling_party]§!§W이(가) 당내에서 새 지도자를 선출합니다.§!"
 ARM_utilize_military_knowledge: "군사 지식의 활용"
 ARM_utilize_military_knowledge_desc: "세르지 사르그샨의 군 경험을 우리 군대의 이익을 위해 활용해야 합니다. 그는 무엇을 해야 할지 알고 있습니다."
 ARM_raising_taxes_idea: "세금 인상"
 ARM_open_borders_with_AZE: "[AZE.GetNameWithFlag]에 국경 개방 제안"
 ARM_open_borders_with_AZE_desc: "카라바흐 분쟁이 해결되었으므로, 아제르바이잔에 공동 국경을 개방하여 관계를 정상화하고 양국 간 무역을 가능하게 하자고 제안할 수 있습니다."
 karabakh.30.t: "[ARM.GetNameWithFlag]의 국경 개방 제안"
 karabakh.30.d: "아르메니아가 양국 간 국경을 개방하자고 제안했습니다. 나고르노카라바흐 분쟁이 해결된 만큼 봉쇄를 유지할 이유가 더는 없다는 것이 이들의 주장입니다. 국경을 개방하면 양국 간 무역과 인적 왕래가 가능해져 양측 경제 모두에 이익이 될 것입니다."
 karabakh.30.a: "제안을 수락한다."
 karabakh.30.b: "제안을 거절한다."
 karabakh.31.t: "[AZE.GetNameWithFlag]의 답변"
 karabakh.31.d: "아제르바이잔이 양국 간 국경 개방에 관한 우리의 제안에 답변을 보내왔습니다."
 karabakh.31.a: "알겠다."
 eastern_church_arm_desc: "아르메니아 사도 교회(AAC)는 세계에서 가장 오래된 기독교 교회 중 하나입니다. 전설에 따르면 아르메니아 교회가 \\"사도\\"라 불리는 것은 그 창립자가 아르메니아에서 가장 먼저 기독교를 전파한 사도 다대오와 바르톨로메오였기 때문입니다. 역사적으로 AAC는 301년 계몽자 성 그레고리오스의 노력과 트르다트 3세 왕이 기독교를 국교로 채택하면서 형성되었습니다."
 ARM_footbal_diplo_desc: "아르메니아와 튀르키예 관계에서의 \\"축구 외교\\"는 2008년 9월 6일, 튀르키예의 압둘라 귈 대통령이 세르지 사르그샨 아르메니아 대통령의 초청으로 예레반을 방문하여 2010년 월드컵 예선 주기에 속한 양국 대표팀의 축구 경기를 함께 관람하면서 시작되었습니다. 경기 후 튀르키예 지도자는 아르메니아 대통령을 2009년 10월 14일 튀르키예에서 열리는 답례 경기에 초청했습니다. 2009년 10월 10일, 고위 정치인과 세계 지도자들의 지지 속에 취리히에서 양자 의정서가 서명되었습니다. 그리고 나흘 뒤 부르사에서 튀르키예와 아르메니아 대통령이 대표팀 경기를 함께 관람했습니다. 그러나 2010년 4월 22일, 사르그샨은 튀르키예가 시작된 과정을 계속할 준비가 되어 있지 않다고 설명하며 포고령으로 취리히에서 서명된 문서의 비준을 중단시켰습니다."
 arme.14.b: "우리는 이 연합에 관심이 없다."
 arme.222.b: "우리는 이 연합에 관심이 없다."
 ARM_new_unif_proj_desc: "외국의 경험을 참고하여, 우리 군을 위한 새로운 위장 군복 개발에 착수해야 합니다."
 ARM_invite_it_corp_shared_desc: "우리는 IT 부문 발전을 지원하기 위해 또 다른 대형 외국 IT 기업을 초청할 계획입니다."
 ARM_annex_states: "주 병합"
 ARM_Kocharyan_Opposition_loc1: "\n§g억눌린 야권§!:\n£western_outlook_campaign_cost_modifier_texticon 일일 친서방 지지: §R-0.01§!\n£nonaligned_outlook_campaign_cost_modifier_texticon 일일 비동맹 지지: §R-0.01§!\n£nationalist_outlook_campaign_cost_modifier_texticon 일일 민족주의 지지: §R-0.01§!\n§Y예상 의료 지출§!: §G-1.00§!\n"
 arm_reaction.6.t: "우리와 결별하는 아르메니아"
 arm_reaction.6.d: "아르메니아 정부는 우리 요원들을 체포하고 우리에게 충성하는 정당들을 금지했으며, 우리의 영향권을 벗어나겠다는 의사를 공공연히 밝혔습니다. 예레반은 독립 이후 줄곧 우리의 피보호국이었으며, 지금 이를 잃으면 코카서스의 다른 모든 수도가 우리의 인내심이 어디까지인지 시험하려 들 것입니다. 어떻게 대응할지 결정할 때입니다."
 arm_reaction.6.a: "양동 작전을 펼친다."
 arm_reaction.6.b: "아르메니아에서 봉기를 일으키자."
 arm_reaction.6.c: "분노를 표명하자."
 arm_reaction.6.f: "아르메니아에 선전포고한다."
 arm_strike_build_in_progress: "건설 사업이 이미 진행 중입니다"
 karabakh_regulated_flag: "카라바흐 문제가 종결되었습니다"
 NKR_marz_arm_desc: "아르메니아 내 자치 마르즈(영토 행정 구역)라는 아르차흐의 법적 지위는 아제르바이잔의 영유권 주장으로부터 이 지역의 뚜렷한 아르메니아인 다수를 보호하는 동시에 캅카스에서 완충 지대를 유지합니다. 이 체제는 소비에트 행정 구조에서 비롯되어 아르메니아의 영토 보전과 문화적 연속성의 초석으로 발전했습니다.\n§W--------------§!\n이 국가 정신은 아르차흐가 §H마르즈 자치§!를 상실하거나 §H아르차흐§!가 존재하지 않게 되면 §R제거§!됩니다."
 ARM_agree_on_places_desc: "코차랸은 지역 실력자 및 과두 세력과 비밀 협약을 맺어 권력을 공고히 합니다. 정부 요직의 분배, 경제적 특권의 보장, 그리고 기존 권력 구조를 존중하겠다는 약속을 대가로 자신의 대통령직에 대한 지지를 얻어냅니다. 이러한 엘리트 간 협약이 코차랸 체제를 안정적으로 유지합니다.\n§W--------------§!\n§H로베르트 코차랸§!이 더 이상 우리의 지도자가 아니면 이 국가 정신은 §R제거§!됩니다."
 ARM_suppressed_oppos_desc: "코차랸 정권은 경찰력 동원, 구금, 언론 접근 제한, 괴롭힘을 통해 야당과 반대 목소리를 억압합니다. 야권은 존재하지만 위축되어 있어 효과적으로 조직하거나 대통령의 권력 장악에 도전할 수 없습니다.\n§W--------------§!\n§H로베르트 코차랸§!이 더 이상 우리의 지도자가 아니면 이 국가 정신은 §R제거§!됩니다."
 ARM_cauc_tigr_desc: "건설 호황, 외국인 투자 유입, GDP 상승에 힘입은 코차랸 치하 아르메니아의 놀라운 경제 성장은 아시아의 호랑이들에 견주어집니다. 코차랸은 이 성장을 자신의 독재적이고 과두 세력에 우호적인 방식이 민주적 통치보다 더 효과적이라는 증거로 내세우며, 정치와 언론에 대한 자신의 강력한 통제를 정당화합니다.\n§W--------------§!\n§H로베르트 코차랸§!이 더 이상 우리의 지도자가 아니면 이 국가 정신은 §R제거§!됩니다."
 ARM_autocratic_grip_desc: "코차랸의 체제는 완전한 권위주의로 굳어집니다. 선거는 관리되고, 의회는 종속되며, 사법부는 대통령에게 복종하고, 야권은 주변부로 밀려납니다. 코차랸은 자신의 개인 통치에 대한 심각한 도전에 직면하지 않으며, 국가 기구는 내부 마찰 없이 그의 의지에 봉사합니다.\n§W--------------§!\n§H로베르트 코차랸§!이 더 이상 우리의 지도자가 아니면 이 국가 정신은 §R제거§!됩니다."
 ARM_armenia_kocharyan_idea_desc: "코차랸의 정치 체제 전체를 아우르는 포괄적 개념입니다. 엘리트 간 협약, 경제 성장, 야권 탄압, 과두 파트너에 대한 의존을 통한 개인 독재 권력의 공고화를 뜻합니다. 코차랸 통치의 실제 효과는 그의 통치 모델의 여러 측면을 반영하는 상호 연결된 하위 국가 정신을 통해 나타납니다.\n§W--------------§!\n§H로베르트 코차랸§!이 더 이상 우리의 지도자가 아니면 이 국가 정신은 §R제거§!됩니다."
 ARM_armenia_serj_idea_desc: "세르지 사르그샨의 대통령 재임기(2008-2018) 정치 체제 전체를 아우르는 포괄적 개념입니다. 군 충성 네트워크, 애국 교육 운동, 연금 개혁, 과두 세력이 후원하는 독점 기업, 러시아 안보 우산 아래 선별적 서구화가 이에 포함됩니다. 사르그샨 정권의 실제 효과는 그의 통치 모델의 여러 측면을 반영하는 상호 연결된 하위 국가 정신을 통해 나타납니다.\n§W--------------§!\n§H세르지 사르그샨§!이 더 이상 우리의 지도자가 아니면 이 국가 정신은 §R제거§!됩니다."
 ARM_tig_reforms_desc: "티그란 사르그샨 총리(2008-2014)는 연금 제도 개편, 맞춤형 세제 개혁, 인프라 현대화, 행정 효율 제고 등 테크노크라트적 경제 개혁을 시행합니다. 이러한 개혁은 단기적 성장을 가져오지만, 특히 급여 삭감에 직면한 연금 수급자와 노동자 사이에서 정치적으로 인기가 없는 것으로 드러납니다.\n§W--------------§!\n§H세르지 사르그샨§!이 더 이상 우리의 지도자가 아니면 이 국가 정신은 §R제거§!됩니다."
 ARM_loyal_military_idea_desc: "아르메니아 군은 사르그샨 정치 체제의 토대가 됩니다. 카라바흐 전쟁 당시 그 휘하에서 복무한 장교와 장군들이 충성스러운 엘리트를 형성하여 정치직과 사업상 지위로 승진합니다. 이러한 군부와 과두 세력의 융합은 정치적 안정을 보장하는 한편 군의 독립성을 대통령의 통제 아래 종속시킵니다.\n§W--------------§!\n§H세르지 사르그샨§!이 더 이상 우리의 지도자가 아니면 이 국가 정신은 §R제거§!됩니다."
 ARM_westernization_of_society_idea_desc: "사르그샨은 선별적인 서구 문화의 유입을 허용합니다. 서구의 패션, 음악, 영화, 소셜 미디어가 아르메니아에 공개적으로 들어옵니다. 고등 교육은 점차 서구 대학에서 이루어지고, 디아스포라의 자금이 유입됩니다. 이러한 문화적 서구화는 정치적 권위주의 및 러시아의 군사적 우위 유지와 공존하며 혼합형 사회를 만들어냅니다.\n§W--------------§!\n§H세르지 사르그샨§!이 더 이상 우리의 지도자가 아니면 이 국가 정신은 §R제거§!됩니다."
 ARM_increased_food_imports_idea_desc: "사르그샨의 과두 세력은 이웃 국가, 특히 러시아로부터의 밀, 설탕, 연료 수입을 독점합니다. 이러한 수입 카르텔 통제는 과두 세력을 살찌우는 반면 가격을 인위적으로 높게 유지하고 아르메니아를 러시아 중개인에게 의존하게 만듭니다. 농업 개혁과 경쟁은 과두 세력의 독점 지대를 위협합니다.\n§W--------------§!\n§H세르지 사르그샨§!이 더 이상 우리의 지도자가 아니면 이 국가 정신은 §R제거§!됩니다."
 ARM_loyal_generalitet_desc: "사르그샨의 장교단은 특권 계층이 됩니다. 높은 장교 봉급, 우선적인 사업 접근권, 국가 계약에서의 우선권이 군부와 과두 세력의 융합을 굳힙니다. 장군들은 민간 기업 경영진으로 순환 배치되며, 사르그샨에 대한 충성이 승진의 유일한 요건이 되어 군의 전문성은 정치적 복종에 종속됩니다.\n§W--------------§!\n§H세르지 사르그샨§!이 더 이상 우리의 지도자가 아니면 이 국가 정신은 §R제거§!됩니다."
 ARM_pension_reform_idea_desc: "티그란 사르그샨의 2014년 의무 적립식 연금 개혁은 위험을 노동자와 투자 시장으로 전가함으로써 국가의 연금 부담을 줄입니다. 이 개혁은 재정 수입을 창출하지만 깊은 반감을 사게 됩니다. 연금 수급자는 급여 삭감에 직면하고, 노동자는 민간 연금 기금을 불신하며, 노후 보장이 도둑맞았다는 인식에 파업이 일어납니다.\n§W--------------§!\n§H세르지 사르그샨§!이 더 이상 우리의 지도자가 아니면 이 국가 정신은 §R제거§!됩니다."
 ARM_patriotic_educ_spir_desc: "사르그샨 정권은 아르메니아 학교에 민족주의 교육을 심습니다. 군사 훈련, 카라바흐 전쟁의 미화, 아르메니아 문명의 독자성 강조가 이에 포함됩니다. 이러한 애국 교육은 국가 군사력에 애착을 가지며 안보 요구를 위해 시민의 자유를 기꺼이 종속시키는 세대를 길러냅니다.\n§W--------------§!\n§H세르지 사르그샨§!이 더 이상 우리의 지도자가 아니면 이 국가 정신은 §R제거§!됩니다."
 ARM_patriotic_educmore_spir_desc: "애국 교육의 심화 단계입니다. 병역은 청년에게 사실상 의무에 가까운 기대가 되고, 학교 교과과정은 전략 연구와 무인의 덕목을 강조하며, 국가 자금은 아르메니아 전사 전통을 기리는 프로그램으로 흘러갑니다. 교육 제도는 군사 동원의 도구가 됩니다.\n§W--------------§!\n§H세르지 사르그샨§!이 더 이상 우리의 지도자가 아니면 이 국가 정신은 §R제거§!됩니다."
 ARM_monopolies_supported_idea_desc: "사르그샨의 체제는 연료, 곡물, 건설 분야의 과두 독점을 명시적으로 보호합니다. 국가 계약은 승인된 과두 세력에 돌아가고, 외국과의 경쟁은 차단되며, 가격은 인위적으로 높게 유지됩니다. 경제 자유화는 수사에 그치고, 과두 카르텔이 기초 상품을 통제하며 아르메니아 소비자에게서 지대를 뽑아냅니다.\n§W--------------§!\n§H세르지 사르그샨§!이 더 이상 우리의 지도자가 아니면 이 국가 정신은 §R제거§!됩니다."
 ARM_nationalistic_educ_spir_desc: "애국 교육의 한층 이념적으로 적극적인 형태입니다. 아르메니아 민족주의는 유산에 대한 자부심을 넘어 민족적, 역사적 영유권의 공세적 주장이 됩니다. 교과서는 아르메니아의 영토적 기억을 강조하고, 국제 분쟁은 민족주의의 시각으로 해석되며, 경쟁하는 민족주의 운동은 국가가 승인한 시민 모델이 됩니다.\n§W--------------§!\n§H세르지 사르그샨§!이 더 이상 우리의 지도자가 아니면 이 국가 정신은 §R제거§!됩니다."
 ARM_glory_of_tigran_idea_desc: "카스피해에서 지중해에 이르는 제국을 다스렸던 고대의 왕, 대왕 티그라네스의 유산을 통한 아르메니아 민족적 자부심의 회복입니다. 민족주의-군주주의 세력은 이러한 역사적 위대함을 내세워 군주제 통치로의 복귀와 영토 회복에 대한 지지를 동원합니다.\n§W--------------§!\n§H민족주의 군주주의자§!가 권력을 잃으면 이 국가 정신은 §R제거§!됩니다."
 ARM_crusade_legacy_idea_desc: "과거의 기독교 아르메니아 왕국들은 신자들을 인접한 무슬림 세력에 맞서는 십자군으로 동원했습니다. 민족주의-군주주의 운동은 이 유산을 계승하여 아르메니아 국가의 존립을 기독교의 사명이자 지역 경쟁자들에 맞선 결집점으로 규정합니다.\n§W--------------§!\n§H민족주의 군주주의자§!가 권력을 잃으면 이 국가 정신은 §R제거§!됩니다."
 ARM_urheimat_restored_idea_desc: "아르메니아 민족의 역사적 중심지는 아나톨리아 고원과 남코카서스에 걸쳐 있습니다. 민족주의-군주주의 이념은 이 고대의 땅에 대한 아르메니아의 주권을 회복하고, 아르메니아의 진정한 영토적 고향으로 여겨지는 곳을 되찾는 데 초점을 둡니다.\n§W--------------§!\n§H민족주의 군주주의자§!가 권력을 잃으면 이 국가 정신은 §R제거§!됩니다."
 ARM_tseghakronism_one_idea_desc: "체가크론주의, 또는 \\"민족 군주주의\\"는 군주제 복원과 민족적 민족주의, 영토 극대주의, 기독교 정교 전통주의를 결합한 아르메니아 민족주의-군주주의 운동의 이념 강령입니다.\n§W--------------§!\n§H민족주의 군주주의자§!가 권력을 잃으면 이 국가 정신은 §R제거§!됩니다."
 ARM_renewed_knighthood_idea_desc: "현대 통치의 모델로서 아르메니아 봉건 질서의 부활입니다. 명예와 무용, 그리고 복원된 아르메니아 왕관에 대한 충성으로 결속된 전사 귀족입니다. 민족주의-군주주의자들은 고대 기사단과 현대 군사-귀족 구조 사이의 유사성을 끌어냅니다.\n§W--------------§!\n§H민족주의 군주주의자§!가 권력을 잃으면 이 국가 정신은 §R제거§!됩니다."
 ARM_tseghakronism_two_idea_desc: "체가크론주의가 포괄적인 국가 이념으로 발전한 단계입니다. 군주제, 민족주의, 정교회 기독교가 아르메니아 문명의 기둥으로 통합됩니다. 국가는 교회와 분리될 수 없게 되며, 왕좌에 대한 충성은 애국적 의무일 뿐 아니라 종교적 의무가 됩니다.\n§W--------------§!\n§H민족주의 군주주의자§!가 권력을 잃으면 이 국가 정신은 §R제거§!됩니다."
 ARM_state_christianity_idea_desc: "민족주의-군주주의 강령은 아르메니아 사도 교회를 아르메니아 민족의 영혼으로 삼습니다. 국가 정책은 기독교 신앙 실천과 정교 가치를 아르메니아 정체성, 시민권, 사회 질서의 토대로 강제합니다.\n§W--------------§!\n§H민족주의 군주주의자§!가 권력을 잃으면 이 국가 정신은 §R제거§!됩니다."
 ARM_armenia_dashnak_idea_desc: "아르메니아 혁명 연맹(다슈나크추툰)은 20세기 내내 독립과 민족 해방을 추구했으며, 사회주의적 뿌리에서 민족주의적 이상으로 진화했습니다. 이 포괄적 국가 정신은 당의 깊은 조직적 기반, 비밀 조직망, 그리고 아르메니아 국익에 봉사하는 이념적 유연성을 반영합니다.\n§W--------------§!\n§H아나키스트 공산주의자§!도 §H민족주의 파시스트§!도 권력을 쥐고 있지 않으면 이 국가 정신은 §R제거§!됩니다."
 ARM_dashnak_mitia_idea_desc: "\\"미티아\\"로 알려진 가레긴 은제데(무라드)는 외세 점령에 맞선 다슈나크추툰의 투쟁적 전통과 유격 저항을 구현했습니다. 그의 유산은 21세기에 이르기까지 당의 지하 조직망과 무장 투쟁 수사에 영감을 주었습니다.\n§W--------------§!\n§H아나키스트 공산주의자§!도 §H민족주의 파시스트§!도 권력을 쥐고 있지 않으면 이 국가 정신은 §R제거§!됩니다."
 ARM_legacy_of_nzhden_desc: "다슈나크추툰은 제국의 통제에서 벗어난 통일되고 독립된 아르메니아라는 은제데의 비전을 계승하여 그의 이념을 현대의 민족주의와 사회주의에 맞게 변용했습니다. 그의 철학은 당의 분권주의적 충동과 중앙집권적 외세 통치에 대한 불신에 영감을 주었습니다.\n§W--------------§!\n§H아나키스트 공산주의자§!도 §H민족주의 파시스트§!도 권력을 쥐고 있지 않으면 이 국가 정신은 §R제거§!됩니다."
 ARM_anti_imperialism_desc: "다슈나크추툰은 러시아와 서방 제국주의 세력에 대한 아르메니아의 의존을 비판하며 민족 자결과 경제적 자치를 옹호했습니다. 이러한 반제국주의 노선은 진정한 아르메니아 주권을 추구하는 좌파와 민족주의 지지층 모두에게 호소력을 가졌습니다.\n§W--------------§!\n§H아나키스트 공산주의자§!도 §H민족주의 파시스트§!도 권력을 쥐고 있지 않으면 이 국가 정신은 §R제거§!됩니다."
 ARM_dashnak_militarism_desc: "다슈나크추툰은 무장 투쟁과 군사적 대비 태세가 민족의 생존과 독립에 필수적임을 강조했습니다. 당은 준군사 전통을 길렀고 군 현대화를 지지했으며, 아르메니아의 분쟁을 협상의 대상이 아니라 존립이 걸린 문제로 보았습니다.\n§W--------------§!\n§H아나키스트 공산주의자§!도 §H민족주의 파시스트§!도 권력을 쥐고 있지 않으면 이 국가 정신은 §R제거§!됩니다."
 ARM_great_trial_radi_desc: "다슈나크추툰은 오스만 대학살부터 소련의 지배에 이르는 아르메니아의 역사적 고난을 민족 성격과 혁명적 헌신을 벼려낸 \\"대시련\\"으로 규정했습니다. 이 서사는 주권에 대한 당의 타협 없는 입장과 외세와의 타협에 대한 저항을 정당화했습니다.\n§W--------------§!\n§H아나키스트 공산주의자§!도 §H민족주의 파시스트§!도 권력을 쥐고 있지 않으면 이 국가 정신은 §R제거§!됩니다."
 ARM_class_strugle_desc: "다슈나크추툰의 사회주의 유산은 계급 투쟁을 민족 해방과 분리할 수 없는 것으로 자리매김했으며, 자본가 엘리트와 소련 관료 모두를 억압자로 비판했습니다. 당은 노동자와 농민을 아르메니아 민족 구원의 진정한 주체로 규정했습니다.\n§W--------------§!\n§H아나키스트 공산주의자§!도 §H민족주의 파시스트§!도 권력을 쥐고 있지 않으면 이 국가 정신은 §R제거§!됩니다."
 ARM_arm_revolt_dashnak_desc: "다슈나크추툰은 오스만 튀르키예에서 소련에 이르기까지 역사 전반에 걸쳐 외세 점령에 맞선 무장 봉기를 조직했습니다. 당의 지하 조직망은 반란과 사보타주를 수행했으며, 무장 봉기를 진정한 독립으로 가는 유일한 길로 보았습니다.\n§W--------------§!\n§H아나키스트 공산주의자§!도 §H민족주의 파시스트§!도 권력을 쥐고 있지 않으면 이 국가 정신은 §R제거§!됩니다."
 ARM_arm_revolt_selhoz_desc: "다슈나크추툰은 농촌과 농업 노동자(소련 통치기의 솔호즈)를 자신의 조직망으로 동원하며 민족 해방에서 농민층의 역할을 강조했습니다. 농본 사회주의는 아르메니아 농촌에서 당의 대중 영합적 호소력의 기둥이 되었습니다.\n§W--------------§!\n§H아나키스트 공산주의자§!도 §H민족주의 파시스트§!도 권력을 쥐고 있지 않으면 이 국가 정신은 §R제거§!됩니다."
 ARM_social_welfare_reform_idea_desc: "다슈나크추툰은 사회 복지, 노동권, 취약 계층 보호를 아르메니아의 생존 및 연대와 결부된 도덕적 책무로 옹호했습니다. 당은 협동조합 경제와 상호 부조를 주창하며 자본주의와 부패한 과두 체제 모두에 맞서 빈민의 수호자를 자처했습니다.\n§W--------------§!\n§H아나키스트 공산주의자§!도 §H민족주의 파시스트§!도 권력을 쥐고 있지 않으면 이 국가 정신은 §R제거§!됩니다."
 ARM_landforce_modifier: "아르메니아 지상군"
 ARM_landforce_modifier_desc: "소련 제7근위군으로부터 물려받고 제1차 나고르노카라바흐 전쟁에서 단련된 징집 보병 중심의 아르메니아군 육군 부문입니다. 내무 부대부터 향토 방위 예비대에 이르기까지 지상군의 모든 개혁이 이곳에 누적됩니다."
 ARM_airforce_modifier: "아르메니아 공군"
 ARM_airforce_modifier_desc: "아르메니아군의 공군 및 방공 부문입니다. 1992년 이관받은 소수의 소련제 기체를 중심으로 창설된 이래 항상 후발 군종이었으며, 그 능력은 전투기 못지않게 지상 배치 방공에 의존합니다."
 ARM_navalforce_modifier: "아르메니아 해군"
 ARM_navalforce_modifier_desc: "아르메니아는 해안선도 함대도 없지만, 총참모부는 소련 해군으로부터 물려받은 해군 간부단, 교육 기관, 해병 보병 전통을 유지하고 있습니다. 우리 국경이 바다에 닿거나 우리 수병들이 다른 깃발 아래에서 복무하게 된다면, 그 전문 지식은 이미 갖추어져 있을 것입니다."
 NKR_landforce_modifier: "아르차흐 방위군"
 NKR_landforce_modifier_desc: "1992년 지역 민병대 분견대로 편성되어 이후 아르메니아의 장비, 훈련, 장교에 의존해 유지되어 온 아르차흐 공화국의 지상군입니다. 예레반에서 이관된 개혁이 이곳에 누적됩니다."
 NKR_airforce_modifier: "아르차흐 방공군"
 NKR_airforce_modifier_desc: "아르차흐 공화국의 소규모 방공 조직입니다. 이렇다 할 자체 전투 항공 전력이 없어, 스테파나케르트는 접촉선 상공의 영공을 지키기 위해 거의 전적으로 지상 배치 체계에 의존합니다."
 ARM_security_modifier: "아르메니아 특수 기관"
 ARM_security_modifier_desc: "아르메니아 공화국의 국내 보안 기구로, 예레반의 국가안보국, 그 산하 국경수비 및 대테러 총국, 내무부 경찰, 그리고 2016년에 분리된 해외 정보 부서를 포함합니다. 특수 기관의 모든 개혁이 이곳에 누적됩니다."
 NKR_security_modifier: "아르차흐 보안 기관"
 NKR_security_modifier_desc: "아르메니아 모델에 따라 구축되고 주로 예레반에서 파견된 장교들이 근무하는 아르차흐 공화국의 보안 기구입니다. 아르메니아에서 채택된 개혁이 스테파나케르트로 전달되어 이곳에 누적됩니다."
 ARM_economy_modifier: "£text_icon_armdram 아르메니아 경제"
 ARM_economy_modifier_desc: "예레반의 소매 은행, 시우니크와 로리의 구리 및 몰리브덴 광산, 과일 가공업체, 시멘트 공장, 전력망으로 이루어진 아르메니아 경제의 국내 부문입니다. 생산에 투입되거나 민영화되거나 확장된 모든 기업이 이곳에 흔적을 남깁니다."
 ARM_western_partners_modifier: "서방 경제 파트너십"
 ARM_western_partners_modifier_desc: "서방 자본과 서방 기관에 의존하는 아르메니아 경제의 부분입니다. 캐나다의 담배 지분, 영국의 은행업, 네덜란드의 통신, 이스라엘의 광산 채굴권, 미국을 겨냥한 IT 부문, 유럽과 미국의 대학 프로그램이 이에 해당합니다. 이들 파트너는 머무르는 동안 예레반에서의 영향력을 사들입니다.\n§W--------------§!\n다음 중 어느 국가와 전쟁을 벌이면 이 국가 정신은 §R제거§!됩니다.§Y \n[USA.GetNameWithFlag] \n[ENG.GetNameWithFlag] \n[CAN.GetNameWithFlag] \n[FRA.GetNameWithFlag] \n[GER.GetNameWithFlag] \n[HOL.GetNameWithFlag] \n[ISR.GetNameWithFlag]§!"
 ARM_russian_partners_modifier: "러시아 경제 파트너십"
 ARM_russian_partners_modifier_desc: "모스크바가 여전히 자금을 지원하는 소련 시대의 과학 및 교육 연계입니다. 예레반의 연구소들과 아르메니아 내 러시아 대학 분교가 이에 속합니다. 이들은 아르메니아의 과학을, 그리고 그와 함께 예레반에서의 러시아 영향력을 살려 둡니다.\n§W--------------§!\n다음 국가와 전쟁을 벌이면 이 국가 정신은 §R제거§!됩니다.§Y \n[SOV.GetNameWithFlag]§!"
 NKR_economy_modifier: "아르차흐 경제"
 NKR_economy_modifier_desc: "전시 과세, 카라바흐 계곡의 농장, 임업 사업, 그리고 스테파나케르트가 유치할 수 있는 모든 투자로 이루어진 아르차흐 공화국의 소규모 전시 경제입니다. 스테파나케르트에서 통과된 모든 개혁이 이곳에 누적됩니다."
 ARM_alpha_mobilize_idea: "알파 그룹 (동원됨)"
 ARM_alpha_mobilize_idea_desc: "알파 대테러 그룹은 상시 임무에서 빠져 전선에 일반 전투 부대로 투입되었습니다. 배치되어 있는 동안 이 기관은 평소 수행하던 방첩 및 수비 임무를 잃습니다.\n§W--------------§!\n전쟁이 끝나면 이 국가 정신은 §R제거§!됩니다."
 ARM_police_troops_mobilize_idea: "경찰 부대 (동원됨)"
 ARM_police_troops_mobilize_idea_desc: "내무부의 내무 부대가 야전 부대로 동원되었습니다. 전선에 있는 동안에는 국내 치안을 담당하지 않습니다.\n§W--------------§!\n전쟁이 끝나면 이 국가 정신은 §R제거§!됩니다."
 ARM_outdated_airforce_idea_desc: "우리 공군은 소련 붕괴 당시 이관받은 소수의 항공기를 운용합니다. 기체 수명은 바닥나고 있고, 예비 부품은 불규칙하게 도착하며, 조종사들은 자격을 유지하기에 턱없이 적은 비행 시간만 기록합니다.\n§W--------------§!\n§H$ARM_institute_mo_ra$§! 중점을 완료하면 이 국가 정신은 §G개선§!되며, §H$ARM_air_fedence_force$§! 중점을 완료하면 §R제거§!됩니다.\n§H아르차흐§!로서는 §H$NKR_planes$§! 중점으로 §R제거§!됩니다."
 ARM_outdated_army_idea_desc: "우리 지상군은 1991년에 남겨진 소련제 비축 장비로 무장하고 있으며, 결코 치르지 않을 전쟁을 위해 작성된 교리에 따라 조직되어 있습니다. 차량은 부품을 위해 분해되고, 훈련은 형식적이며, 장교단은 독립 이후 개혁된 적이 없습니다.\n§W--------------§!\n§H$ARM_army$§!, §H$ARM_vazgen_academy$§!, §H$ARM_aspar_arms$§!, §H$ARM_k3_prototype$§!, §H$ARM_n2$§!, §H$ARM_lusan$§!, §H$ARM_uav_krunk$§! 또는 §H$ARM_new_army$§! 중점을 완료하면 이 국가 정신은 §G개선§!되며, 여덟 개를 모두 완료하면 §R제거§!됩니다.\n§H아르차흐§!로서는 대신 §H$NKR_safe_army$§!, §H$NKR_safe_univer$§!, §H$NKR_safe_special_forces$§!, §H$NKR_safe_vazgen$§!, §H$NKR_safe_mo_ra$§! 중점으로 §G개선§!되며, 다섯 개를 모두 완료하면 §R제거§!됩니다."
 ARM_nati_army_idea_desc: "카라바흐 전쟁 참전 용사들과 이들을 대변하는 정당들이 장교단과 징병 위원회를 장악했습니다. 그들은 대열을 채우고 전쟁에 대한 열망을 높이지만, 민간 정부는 그들에게 책임을 지는 만큼이나 그들도 정부에 책임을 집니다.\n§W--------------§!\n공산주의자가 집권하면 이 국가 정신은 §R제거§!됩니다."
 ARM_dziavory_idea_desc: "카라바흐 전쟁의 가장 유능한 지원자들로 구성된 엘리트 정찰 및 특수 작전 분견대입니다. 민족주의 성향이 강한 지아보리는 군사 부대인 만큼 정치적 지지 기반이기도 합니다.\n§W--------------§!\n공산주의자가 집권하면 이 국가 정신은 §R제거§!됩니다."
 ARM_102_idea_desc: "[SOV.GetNameWithFlag](이)가 귀므리의 제102 군사기지를 통해 제102 부대에 신호 정보, 방첩 훈련, 해외 비밀 작전 지원을 제공합니다. 이러한 유대는 우리가 민감한 통신을 보호하고 외국 요원을 색출하는 데 도움이 됩니다.\n§W--------------§!\n§Y$ARM_102st_base$§! 국가 정신을 잃거나 공산주의자가 집권하면 이 국가 정신은 §R제거§!됩니다."
 ARM_armenian_foreign_legion_idea_desc: "프랑스 외인부대를 본떠 만든 우리의 외인부대는 아르메니아를 위해 복무할 의사가 있는 모든 국적의 지원자를 모집합니다. 이는 징집 인력을 소모하지 않고도 전문 원정 간부단을 제공하지만, 그 대가로 장비와 훈련에 대한 외국의 영향력이 따릅니다.\n§W--------------§!\n군이 더 이상 지원자를 모집하지 않거나 외국 군사 연락 관계를 종료하면 이 국가 정신은 §R제거§!됩니다."
 ARM_armenian_foreign_legion_moblize_idea_desc: "외인부대 여단은 상시 임무에서 빠져 전선에 일반 전투 부대로 투입되었습니다. 디아스포라와 외국인 지원자 출신의 신병들은 전투가 지속되는 동안 징집병과 동일한 조건으로 복무합니다.\n§W--------------§!\n전쟁이 끝나면 이 국가 정신은 §R제거§!됩니다."
 ARM_national_guard_level_1_tt: "우리는 §Y국가 방위군§!을 창설했습니다"
 ARM_national_guard_level_2_tt: "우리는 §Y국가 방위군§!을 확대했습니다"
 ARM_peace_level_1_tt: "우리는 §Y평화유지 여단§!을 창설했습니다"
 ARM_anti_air_level_1_tt: "우리는 §Y방공군§!을 창설했습니다"
 ARM_vdv_level_1_tt: "우리는 §Y공수군§!을 창설했습니다"
 ARM_davisur_level_1_tt: "우리는 §Y다비수르§! 장비 계획을 채택했습니다"
 NKR_integrate_army_of_armenia_available: "[ARM.GetNameWithFlag]이(가) 우리가 아직 채택하지 않은 군종 하나를 개혁했습니다"
 ARM_nor_aven_first_desc: "예레반 중심부의 북부 대로 재건은 수도의 심장부에 현대화와 상업을 가져오며, 해당 주의 투자 유입과 사업 기회를 증가시킵니다."
 ARM_nor_aven_sec_desc: "예레반 구시가지의 보존은 수도에 문화적 연속성과 관광 잠재력을 가져오며, 역사적 중심지의 특성을 유지하면서 새로운 경제적 기회를 열어 줍니다.\n§W--------------§!\n예레반의 인프라 문제가 해소되면 이 주 변동치는 §R제거§!됩니다."
 ARM_armenia_pashik_idea_desc: "니콜 파시냔 정부는 2018년 벨벳 혁명 이후 시민 사회, 지방 분권, 민주적 규범을 받아들였습니다. 그의 행정부는 서방의 제도와 시민적 자유를 향해 나아갔으며, 수십 년간의 과두 통치와 날카롭게 단절했습니다.\n§W--------------§!\n§H중립 자유지상주의자§!가 권력을 잃으면 이 국가 정신은 §R제거§!됩니다."
 ARM_loyalists_in_government_desc: "파시냔은 국가 기관 내에 정치적 기반을 키워, 개혁 성향의 관료들과 자신의 의제에 공감하는 테크노크라트들을 임명했습니다. 이 충성파 네트워크는 구 권력 구조의 저항이 여전히 강했던 권력 공고화 초기에 결정적인 지지를 제공했습니다.\n§W--------------§!\n§H중립 자유지상주의자§!가 권력을 잃으면 이 국가 정신은 §R제거§!됩니다."
 ARM_armenian_soc_media_prop_idea_desc: "파시냔 정부는 소셜 미디어를 활용해 과두 세력이 통제하는 전통 언론 매체를 우회하고, 페이스북, 인스타그램, 텔레그램에서 시민들에게 직접 말을 걸었습니다. 이 현대적 선전 기구는 국민의 지도자라는 그의 이미지를 강화했으며 개혁에 대한 제도적 저항을 우회했습니다.\n§W--------------§!\n§H중립 자유지상주의자§!도 §H니콜 파시냔§!도 권력을 쥐고 있지 않으면 이 국가 정신은 §R제거§!됩니다."
 ARM_pashinyan_anti_corrupt_idea_desc: "반부패는 파시냔의 대표 정책이자 개인 브랜드가 되었으며, 이전 정권 시절 과두 세력에 대한 체포와 기소가 이어졌습니다. 그의 정부는 새로운 반부패 기구와 기소 체계를 수립했지만, 비판자들은 집행이 여전히 선택적이며 정치적 동기에 따른 것이라고 주장했습니다.\n§W--------------§!\n§H중립 자유지상주의자§!도 §H니콜 파시냔§!도 권력을 쥐고 있지 않으면 이 국가 정신은 §R제거§!됩니다."
 ARM_education_reforms_desc: "파시냔은 아르메니아 교육 제도의 현대화를 우선시하여 교사 급여를 인상하고 민주적 가치에 부합하는 새 교육 과정을 도입했습니다. 교육 개혁은 소련 시대의 주입식 교육과의 단절을 상징했으며 젊은 세대가 시민 사회의 역할을 맡을 수 있도록 준비시켰습니다.\n§W--------------§!\n§H중립 자유지상주의자§!가 권력을 잃으면 이 국가 정신은 §R제거§!됩니다."
 ARM_true_pashik_democracy_desc: "파시냔의 민주주의 비전은 투명한 제도, 독립 언론, 다원적 토론을 강조했으며, 이는 1990년대의 불투명한 과두 체제와 뚜렷한 대조를 이루었습니다. \\"파시크의 민주주의\\"라는 표현은 진정한 대의 통치와 책임성에 대한 그의 약속을 집약했습니다.\n§W--------------§!\n§H중립 자유지상주의자§!가 권력을 잃으면 이 국가 정신은 §R제거§!됩니다."
 ARM_controlled_democracy_desc: "시민적 자유를 증진하는 한편, 파시냔 정부는 핵심 기관, 민감한 부문, 정치적 결과에 대한 상당한 국가 통제를 유지했습니다. 민주주의의 외양과 행정부 권력 사이의 이러한 균형은 분열된 아르메니아 과두 체제와 지역적 긴장을 헤쳐 나가는 데 실용적임이 입증되었습니다.\n§W--------------§!\n§H중립 자유지상주의자§!가 권력을 잃으면 이 국가 정신은 §R제거§!됩니다."
 ARM_new_era_of_peace_idea_desc: "수년간의 분쟁 끝에, 파시냔은 처음에 아제르바이잔 및 튀르키예와의 대화와 긴장 완화를 추진하며 군사적 대립보다 경제 협력을 강조했습니다. 그의 정부는 국제 중재를 통해 나고르노카라바흐 분쟁에 대한 협상을 추진했습니다.\n§W--------------§!\n§H중립 자유지상주의자§!가 권력을 잃으면 이 국가 정신은 §R제거§!됩니다."
 ARM_support_of_ngo_idea_desc: "파시냔 정부는 국제 NGO 및 시민 사회 조직과의 유대를 강화하고 통치 및 인권에 대한 이들의 감시를 환영했습니다. 이 파트너십은 아르메니아의 민주적 이미지를 강화했으며 선정 개혁과 연계된 해외 원조를 확보했습니다.\n§W--------------§!\n§H중립 자유지상주의자§!가 권력을 잃으면 이 국가 정신은 §R제거§!됩니다."
 ARM_support_for_regions_desc: "지역 생산성과 접경 지역의 농업 생산량을 높이기 위한 농촌 농업, 관개 인프라, 작물 지원 프로그램에 대한 정부 투자입니다."
 ARM_de_sovietization_idea_desc: "소비에트 시대의 제도, 이념, 기반시설을 체계적으로 해체하는 정책입니다. 공산주의 상징을 교체하고, 교육과 문화에서 공산주의를 걷어내며, 민주주의적 방향으로 시민 사회를 재건합니다. 이 의제는 독립 이후 아르메니아에 대한 테르페트로시안의 자유주의적 민족주의 구상을 규정합니다.\n§W--------------§!\n§H중립 자유지상주의자§!나 §H레본 테르페트로시안§! 중 어느 쪽도 집권하지 않으면 이 국가 정신은 §R제거§!됩니다."
 ARM_land_reform_idea_desc: "소비에트 집단농장을 해체하고 토지를 사유로 되돌려 농업 생산성을 높이고 농촌의 쇠퇴를 되돌리려는 정책입니다. 이 자유민주주의적 개혁은 독립 자영농 계층을 만들고 아르메니아의 농촌을 되살리는 것을 목표로 합니다.\n§W--------------§!\n§H중립 자유지상주의자§!나 §H레본 테르페트로시안§! 중 어느 쪽도 집권하지 않으면 이 국가 정신은 §R제거§!됩니다."
 ARM_cilician_diplomacy_idea_desc: "아르메니아 디아스포라와 역사적인 킬리키아 아르메니아 왕국은 아르메니아의 외교 정책에 외교적, 문화적 자원을 제공합니다. 디아스포라 네트워크를 활용하고 킬리키아의 유산을 기리는 것은 아르메니아의 국제적 위상과 문화적 정통성을 강화합니다.\n§W--------------§!\n§H중립 자유지상주의자§!나 §H레본 테르페트로시안§! 중 어느 쪽도 집권하지 않으면 이 국가 정신은 §R제거§!됩니다."
 ARM_balanced_approach_idea_desc: "정교회 전통주의와 서구 자유주의 사이의 중도적 노선으로, 아르메니아의 기독교 유산과 서방 및 이웃 이슬람 국가들과의 실용적 관계를 균형 있게 유지합니다. 이 실용 외교는 이념적 대립이 아니라 계산된 중립과 경제 협력을 통해 안정을 추구합니다.\n§W--------------§!\n§H중립 자유지상주의자§!나 §H레본 테르페트로시안§! 중 어느 쪽도 집권하지 않으면 이 국가 정신은 §R제거§!됩니다."
 ARM_liberalization_of_economy_idea_desc: "소비에트식 중앙 계획을 대체하는 시장 개혁입니다. 국영 기업을 민영화하고, 가격 통제를 철폐하며, 아르메니아를 국제 무역에 개방하고, 현대적인 은행 제도를 확립합니다. 이 자유주의 경제 프로그램은 사회 보호를 유지하면서 자본주의의 생산적 에너지를 활용하는 것을 목표로 합니다.\n§W--------------§!\n§H중립 자유지상주의자§!나 §H레본 테르페트로시안§! 중 어느 쪽도 집권하지 않으면 이 국가 정신은 §R제거§!됩니다."
 ARM_crossroad_diplomacy_reverse_idea_desc: "우리나라는 아르메니아와 상호 이익이 되는 무역 협력 관계를 맺었으며, 그 전략적 위치를 활용해 여러 지역 시장과 자원에 접근하고 있습니다. 이 상업적 관계는 꾸준한 경제적 수익과 캅카스에서의 정치적 영향력을 가져다주며, 중립적 중개자를 통해 경제적 이득과 지정학적 이점을 모두 제공합니다.\n§W--------------§!\n아르메니아가 소멸하거나 우리가 아르메니아와 전쟁에 돌입하면 이 국가 정신은 §R제거§!됩니다."
 ARM_crossroad_diplomacy_idea_desc: "러시아, 페르시아, 튀르키예, 서방의 세력권이 만나는 교차로라는 아르메니아의 지리적 위치는 위험과 기회를 동시에 제공합니다. 테르페트로시안은 모든 진영과 실용적 관계를 맺고, 아르메니아를 어느 한 블록에 묶지 않은 채 경제 및 안보 협력을 활용합니다. 이러한 지속적인 접근은 중립 자유지상주의자 또는 테르페트로시안이 이끄는 정부가 장악하고 있을 때 가능합니다.\n§W--------------§!\n외교 구상이 성공하고 아르메니아가 블록 간 관계를 심화함에 따라 이 국가 정신은 §G개선§!됩니다."
 ARM_crossroad_diplomacy_idea_1_desc: "여러 세력권에 걸친 아르메니아의 관계가 깊어지고 있습니다. 러시아와는 안보, 서방과는 무역과 투자, 이란과는 에너지와 운송, 디아스포라와는 자본과 전문성 분야에서 협정을 맺었습니다. 이 고도의 균형 외교는 중립 자유지상주의 정부 또는 테르페트로시안의 지속적인 지도력에 달려 있습니다.\n§W--------------§!\n아르메니아가 모든 지역에서 외교 및 경제 관계를 확대함에 따라 이 국가 정신은 §G개선§!됩니다."
 ARM_crossroad_diplomacy_idea_2_desc: "아르메니아의 교차로적 위치는 생존 전략의 초석이 되었습니다. 경쟁하는 강대국 사이에서 중재자이자 중개인 역할을 하며, 군사적 위험과 정치적 부담을 최소화하는 한편 자국의 지리적, 문화적 자산을 최고 입찰자에게 팝니다. 이 섬세한 균형을 유지하려면 중립적 외교 정책에 대한 지속적인 헌신이 필요합니다.\n§W--------------§!\n중립적 교차로 파트너로서의 아르메니아의 가치가 높아짐에 따라 이 국가 정신은 §G개선§!됩니다."
 ARM_crossroad_diplomacy_idea_3_desc: "아르메니아는 동서양 사이의 진정한 가교로서의 입지를 굳혔습니다. 러시아 군사 기지를 유치하면서 나토 회원국들과도 관계를 맺고, 민주주의 및 권위주의 파트너 모두에게 판매하며, 모든 쪽의 투자를 유치합니다. 이 체제의 지속 가능성은 전적으로 아르메니아가 어느 이념 진영에도 속하지 않는 데 달려 있으며, 이는 자유지상주의 정부나 테르페트로시안 정부만이 유지할 수 있는 약속입니다.\n§W--------------§!\n아르메니아의 중립적 평판이 경쟁 강대국들에게 더욱 가치 있게 됨에 따라 이 국가 정신은 §G개선§!됩니다."
 ARM_crossroad_diplomacy_idea_4_desc: "아르메니아는 진정으로 없어서는 안 될 교차로가 되었습니다. 아르메니아의 영토, 디아스포라 네트워크, 금융 중심지, 중립적 입장은 러시아, 서방, 이란 등의 전략적 계산에 필수적인 요소가 되었습니다. 경제적 이권이 사방에서 흘러들어 어느 한 블록과 완전히 연합하지 않고도 아르메니아의 발전과 안보를 뒷받침합니다.\n§W--------------§!\n모든 당사자에 대한 아르메니아의 전략적 불가결성이 커짐에 따라 이 국가 정신은 §G개선§!됩니다."
 ARM_crossroad_diplomacy_idea_5_desc: "아르메니아는 교차로의 기술을 완성했습니다. 남캅카스에서 직접적인 대립 없이 영향력을 얻고자 하는 여러 강대국에게 선호되는 중개자이자 투자처가 되었습니다. 아르메니아의 지속적인 중립과 자유지상주의 통치는 이 엄청나게 수익성 높은 균형 외교를 유지하는 열쇠입니다.\n§W--------------§!\n아르메니아가 공식적인 연합 없이 모든 주요 강대국과의 관계를 계속 심화하면 이 국가 정신은 §G개선§!됩니다."
 ARM_crossroad_diplomacy_idea_6_desc: "수십 년간의 신중한 외교의 결실입니다. 아르메니아는 교차로 역할을 완전히 숙달하여 모든 주요 강대국의 지역 전략에 필수적인 존재가 되었습니다. 아르메니아 경제는 서로 경쟁하는 모든 블록에 얽혀 있으며, 아르메니아의 안보는 러시아의 주둔으로 보장되면서도 서방의 존중을 받습니다. 아르메니아 엘리트들은 곳곳에 자산을 보유하고 있습니다. 이 마지막 단계는 중립에 대한 흔들림 없는 헌신을 요구하며 이념적 전환을 견뎌 내지 못합니다.\n§W--------------§!\n§H중립 자유지상주의자§!나 §H레본 테르페트로시안§! 중 어느 쪽도 집권하지 않으면 이 국가 정신은 §R제거§!됩니다."
 ARM_national_liberal_agenda_idea_desc: "라피 호바니시안과 헤리티지당은 민족자유주의를 옹호합니다. 이는 시장 경제에 문화적 민족주의와 디아스포라 참여를 결합한 것입니다. 이 의제는 소비에트식 권위주의와 서구 신자유주의를 모두 거부하고, 시민적 민족주의, 기업가 정신, 디아스포라 자금 기반 발전이라는 아르메니아 고유의 길을 모색합니다.\n§W--------------§!\n§H서구 보수주의자§!가 권력을 잃으면 이 국가 정신은 §R제거§!됩니다."
 ARM_health_pindos_idea_desc: "아르메니아 의료를 현대화하고 민영화하려는 의료 개혁은 비용 상승, 빈곤층의 접근성 저하, 관료주의적 마찰, 의약품 및 장비 부족 등 예기치 못한 결과를 낳습니다. 미국식 의료 시장 모델을 아르메니아의 여건에 적용하려는 시도가 역효과를 내어 국민의 불만과 경제적 부담을 초래합니다.\n§W--------------§!\n§H서구 보수주의자§!가 권력을 잃으면 이 국가 정신은 §R제거§!됩니다."
 ARM_free_market_reforms_idea_desc: "호바니시안은 고전적 자유주의 경제를 옹호합니다. 국영 기업 민영화, 독점 해체, 가격 통제 철폐, 아르메니아의 경쟁 개방이 그 내용입니다. 자유 시장 개혁은 기업가 정신을 해방하고 과두 지대 추구를 없애는 것을 목표로 하지만, 복지 지원으로 균형을 맞추지 않으면 사회적 혼란과 불평등을 초래할 위험이 있습니다.\n§W--------------§!\n§H서구 보수주의자§!가 권력을 잃으면 이 국가 정신은 §R제거§!됩니다."
 ARM_protection_of_armenian_heritage_idea_desc: "헤리티지당은 아르메니아의 문화적, 정신적 유산을 정치의 중심에 둡니다. 아르메니아 사도교회에 대한 국가의 지원, 아르메니아 수도원과 사적지 보존, 아르메니아 문명의 연속성 강조가 그 내용입니다. 이 문화적 민족주의는 서구의 시민적 가치에 대한 개방성을 유지하면서 아르메니아를 소비에트 무신론과 구별 짓습니다.\n§W--------------§!\n§H서구 보수주의자§!가 권력을 잃으면 이 국가 정신은 §R제거§!됩니다."
 ARM_armenian_traders_culture_idea_desc: "호바니시안은 아르메니아의 역사적인 디아스포라 상인 네트워크를 상기시키며 기업가 정신과 상업적 연결망을 아르메니아 고유의 특성으로 칭송합니다. 국가는 기업 협회, 디아스포라 무역 제휴, 시장 지향적 교육을 장려하며, 자본주의와 아르메니아 정체성이 양립할 수 있다고 봅니다.\n§W--------------§!\n§H서구 보수주의자§!가 권력을 잃으면 이 국가 정신은 §R제거§!됩니다."
 ARM_protection_of_national_education_idea_desc: "헤리티지당은 아르메니아 교육을 외국(특히 러시아)의 문화적 지배로부터 보호합니다. 교과 과정에서 아르메니아의 역사, 언어, 문학을 강조하고, 디아스포라 교사를 유치하기 위해 교육 지출을 늘리며, 아르메니아 문화 정체성을 핵심으로 유지하면서 서방 대학과의 유대를 강화합니다.\n§W--------------§!\n§H서구 보수주의자§!가 권력을 잃으면 이 국가 정신은 §R제거§!됩니다."
 ARM_soil_of_libery_idea_desc: "아르메니아의 대지는 물리적으로나 비유적으로나 민주적 자유와 민족 독립의 토대가 됩니다. 호바니시안은 아르메니아의 국가 체제를 보편적 자유 원칙의 프로젝트로 규정합니다. 민주주의, 인권, 법치가 아르메니아의 대지에 뿌리내리고, 러시아의 권위주의와 과두 세력의 장악에 모두 맞섭니다.\n§W--------------§!\n§H서구 보수주의자§!가 권력을 잃으면 이 국가 정신은 §R제거§!됩니다."
 ARM_us_inspired_government_idea_desc: "호바니시안은 아르메니아의 통치를 명시적으로 미국의 제도에 맞춰 설계합니다. 헌법상 권력 분립, 독립적인 사법부, 연방 구조, 시민사회 중시가 그 내용입니다. 이러한 통치의 미국화는 서구 민주주의의 회복력을 도입하고 아르메니아를 러시아의 지배와 과두 세력의 장악으로부터 지키는 것을 목표로 합니다.\n§W--------------§!\n§H서구 보수주의자§!가 권력을 잃으면 이 국가 정신은 §R제거§!됩니다."
 ARM_social_promises_desc: "파시냔은 연금 인상, 공공 서비스 개선, 반부패 조치를 포함한 포괄적인 사회 개혁을 약속하여 대중적 정통성을 쌓았습니다. 이 공약들은 2018년 선거 운동과 초기 국정 구상의 근간을 이루었습니다.\n§W--------------§!\n§H중립 자유지상주의자§!가 권력을 잃으면 이 국가 정신은 §R제거§!됩니다."
 ARM_armenia_raffik_idea_desc: "라피 호바니시안의 서구 보수주의적 비전을 담은 포괄적 개념입니다. 아르메니아의 민족자유주의에 디아스포라 참여, 자유 시장 경제, 유산 보호, 미국식 민주적 통치가 결합되어 있습니다. 이 비전의 실제 효과는 아르메니아를 변혁하려는 호바니시안 모델의 여러 측면을 반영하는, 상호 연결된 하위 국가 정신들을 통해 나타납니다.\n§W--------------§!\n§H서구 보수주의자§!가 권력을 잃으면 이 국가 정신은 §R제거§!됩니다."
 ARM_sport_development_desc: "아르메니아는 국가적 자긍심과 국제적 위상을 키우기 위해 체육 기반시설, 훈련 아카데미, 경기 프로그램에 체계적으로 투자합니다. 올림픽 종목과 지역 대회에서의 성공은 아르메니아의 탁월함을 세계에 알리고, 공유된 국가적 성취를 중심으로 소프트 파워와 단결을 구축합니다.\n§W--------------§!\n§H스포츠 육성§! 중점을 완료하면 이 국가 정신은 §G개선§!됩니다."
 ARM_berkut_troops_desc: "황금독수리를 뜻하는 베르쿠트는 파업, 노동 조직화, 시민 소요를 진압하기 위해 과두 세력의 이해관계에 따라 투입되는 엘리트 폭동 진압 및 대테러 부대입니다. 이들의 존재는 올리가르히들이 자신의 경제적 독점을 대중의 도전으로부터 지키기 위해 기꺼이 무력을 사용한다는 점을 보여 줍니다.\n§W--------------§!\n§H중립 올리가르히§!가 권력을 잃으면 이 국가 정신은 §R제거§!됩니다."
 ARM_farmercracy_desc: "아르메니아의 올리가르히들은 곡물 가격, 수출 경로, 토지 보유를 통제하는 농업 독점으로 경제적 지배력을 유지합니다. 올리가르히가 후원하는 정당들은 농촌 아르메니아가 자신들의 후견 네트워크와 선거 지지에 계속 의존하도록 만드는 농업 보호 정책을 추진합니다.\n§W--------------§!\n§H중립 올리가르히§!가 권력을 잃으면 이 국가 정신은 §R제거§!됩니다."
 ARM_corporatocracy_desc: "올리가르히와 그 기업 대리인들에 의한 통치입니다. 국영 기업은 유력한 올리가르히들이 비공식적으로 통제하고, 정부 계약은 그들의 동맹에게 돌아가며, 국가 정책은 공공복리가 아니라 그들의 경제적 이해관계에 따라 좌우됩니다. 올리가르히들은 사실상 국가 기구를 사들였습니다.\n§W--------------§!\n§H중립 올리가르히§!가 권력을 잃으면 이 국가 정신은 §R제거§!됩니다."
 ARM_legacy_of_father_idea_desc: "공산당 지도자로서 데미르치얀이 남긴 유산은 산업 노동자와 소비에트 군인에 대한 지지에 기반했으며, 그는 이들을 아르메니아 발전의 근간으로 보았습니다. 이 단계는 노동 계급에 대한 그의 테크노크라트적 사회주의 모델의 기초적 호소력을 나타냅니다.\n§W--------------§!\n§H노동자와 군인§! 중점을 완료하면 이 국가 정신은 §G개선§!됩니다."
 ARM_legacy_of_father_two_idea_desc: "소비에트 아르메니아 발전에 대한 데미르치얀의 구상은 관리되는 사회주의 국가 안에서의 문화적 자치를 강조했으며, 민족 정체성과 프롤레타리아 국제주의의 균형을 추구했습니다. 이 단계는 테크노크라트적 통치와 소비에트 제도적 유산에 대한 심화된 헌신을 나타냅니다.\n§W--------------§!\n§H소비에트의 결정 규탄§! 중점을 완료하면 이 국가 정신은 §G개선§!됩니다."
 ARM_legacy_of_father_three_idea_desc: "경력 후반기에 데미르치얀이 경제학자, 기술자, 행정가 등 전략적 테크노크라트를 국가 현대화에 필수적인 존재로 강조한 것은 그의 통치 철학을 결정지었습니다. 이 단계는 후견 네트워크에 대한 전문성과 능력주의 원칙의 우위를 나타냅니다.\n§W--------------§!\n§H테크노크라트 승진§! 중점을 완료하면 이 국가 정신은 §G개선§!됩니다."
 ARM_legacy_of_father_four_idea_desc: "아르메니아의 전략적 이익과 발전을 관리하는 테크노크라트적 공산주의 국가는 데미르치얀 유산의 궁극적인 실현이며, 아르메니아에서 소비에트식 통치의 정점을 의미합니다. 이 마지막 단계는 모스크바의 간섭에서 벗어난 효율적이고 민족주의적인 공산주의라는 꿈을 담고 있습니다.\n§W--------------§!\n데미르치얀의 복원이 마무리되고 공산주의 프로젝트가 불가피한 도전에 직면하면 이 국가 정신은 §R제거§!됩니다."
 ARM_armenia_demirchyan_idea_desc: "소비에트 시대 아르메니아 공산당 지도자 카렌 데미르치얀은 소비에트 체제 안에서 테크노크라트적 통치와 민족주의적 충동을 구현했습니다. 그의 행정부는 산업 발전과 문화 보존을 강조했으며, 반대자들로부터도 유능함과 절제로 존경을 받았습니다.\n§W--------------§!\n§H중립 공산주의자§!가 권력을 잃으면 이 국가 정신은 §R제거§!됩니다."
 ARM_economy_shady_idea_desc: "현금 임금, 미등록 수입, 비과세 거래로 인해 아르메니아 상업의 상당 부분이 장부 밖에 있습니다. 이는 국고를 희생하여 사회적 평화를 사는 것입니다.\n§W--------------§!\n§Y지하 경제 영향력 제거§! 결정을 사용하면 이 국가 정신은 §G개선§!됩니다."
 ARM_economy_shady_idea4_desc: "회색 경제의 가장 작은 구석만 남아 있습니다. §Y카지노 사업§! 중점이 이를 §G제거§!합니다."
 ARM_multigroup_idea_desc: "멀티그룹 복합 기업은 연료, 담배, 건설, 정치에 이르기까지 손을 뻗치고 있습니다. 이 기업에 양보할 때마다 국가에 대한 장악력은 더욱 깊어집니다.\n§W--------------§!\n§Y멀티그룹 해체§! 결정을 사용하면 이 국가 정신은 §G개선§!됩니다."
 ARM_gaz_energy_problems_desc: "아르메니아는 더 이상 수요와 맞지 않는 가스 및 전력망을 물려받았으며, 1990년대 겨울 정전의 기억은 아직도 생생합니다.\n§W--------------§!\n§H가스프롬과의 협력§! 중점을 완료하면 이 국가 정신은 §R제거§!됩니다."
 ARM_has_artsakh_idea: "아르차흐 통치"
 ARM_has_artsakh_idea_desc: "예레반은 공식적으로 자국 영토로 인정하지 않는 지역의 민정, 치안, 연금을 떠안고 있습니다. 그 비용은 눈에 띄지 않지만 영구적입니다.\n§W--------------§!\n§H아르차흐§!가 §H마르츠 자치§!를 잃거나 소멸하면 이 국가 정신은 §R제거§!됩니다."
 ARM_integration_idea: "신규 영토 통합"
 ARM_integration_idea_desc: "새로 병합된 주가 아르메니아 법 아래로 편입되고 있습니다. 이행이 끝날 때까지 치안 비용이 늘어나고 주민이 떠납니다."
 ARM_Eraz_idea_desc: "예레반 자동차 공장(ErAZ)은 소비에트 시대 아르메니아 자동차 제조업의 초석으로, 소련과 구소련권 시장 전역에 수출하는 상징적인 ErAZ 밴과 상용차를 생산했습니다. ErAZ 생산의 부활은 아르메니아의 재산업화와 러시아 시장 및 기술에 대한 의존을 상징합니다.\n§W--------------§!\n러시아와 전쟁에 돌입하면 이 국가 정신은 §R제거§!됩니다."
 NKR_gaz_energy_problems_desc: "아르차흐의 대부분 지역은 여전히 장작과 병입 가스로 난방합니다.\n§W--------------§!\n§H가스 보급 추진§! 중점을 완료하면 이 국가 정신은 §R제거§!됩니다."
 NKR_corruption_in_police_idea_desc: "아르차흐 경찰은 검문소에서 뜯어낼 수 있는 것으로 먹고삽니다.\n§W--------------§!\n§H경찰 재편§! 중점을 완료하면 이 국가 정신은 §R제거§!됩니다."
 ARM_economy_tourism_income_tt: "£text_icon_armdram 아르메니아는 보유한 모든 휴양 지역에서 §Y월간 관광 수입§!을 얻습니다"
 ARM_have_bank_sector_tt: "우리는 통합된 §Y은행 부문§!을 보유하고 있습니다"
 ARM_have_green_energy_tt: "우리는 §Y녹색 에너지§! 프로그램을 보유하고 있습니다"
 ARM_have_electric_networks_tt: "우리는 §Y아르메니아 전력망§!을 소유하고 있습니다"
 arm_economic.24.t: "서방 파트너들의 철수"
 arm_economic.24.d: "첫 총성이 울린 순간 이사회가 열렸습니다. 담배 지주회사, 은행, 통신 사업자, 광산 채굴권, 대학 프로그램이 모두 동시에 아르메니아에서의 사업을 정리하고 있습니다. 어떤 곳은 제재를, 어떤 곳은 보험을 이유로 들며, 언제 돌아올지 말하는 곳은 하나도 없습니다."
 arm_economic.24.a: "어차피 남아 있을 자들이 아니었다."
 arm_economic.25.t: "모스크바의 연구소 폐쇄"
 arm_economic.25.d: "연구 자금 지원이 먼저 끊겼고, 이어 대학 분교는 입학을 중단하라는 통보를 받았습니다. 수십 년간 공동으로 운영해 온 실험실과 인력 교류가 행정 공문 한 장으로 해체되고 있으며, 이를 일군 과학자들은 벌써 해외에서 일자리를 찾고 있습니다."
 arm_economic.25.a: "우리 스스로 재건할 것이다."
 ARM_landmines_desc: "침공에 대한 방어책으로 아르차흐 영토 전역에 설치된 대전차 지뢰와 대인 지뢰입니다. 이는 적의 기계화 작전을 방해하지만, 민간 재건과 경제 발전을 어렵게 만듭니다."
 ARM_eu_coop_agreement_desc: "아르메니아는 2017년 유럽 연합과 포괄적·강화된 동반자 협정(CEPA)을 체결하여, 아르메니아가 유라시아 경제 연합에 가입하면서 폐기한 2013년 제휴 협정 이상으로 관계를 격상합니다. CEPA는 무역, 투자, 통치, 에너지, 안보 분야의 협력을 확립하며, 이는 유럽과의 관계와 러시아가 주도하는 지역 통합 사이의 줄타기입니다.\n§W--------------§!\n§H모든 통합 기구 폐쇄§! 중점을 완료하면 이 국가 정신은 §R제거§!됩니다."
 ARM_eu_council_desc: "아르메니아의 유럽 평의회 회원국 지위는 이 나라를 유럽의 인권 기준, 민주적 규범, 국제적 감시에 노출시킵니다. 유럽 통치 구조에 대한 이러한 제도적 닻은 국내 개혁에 정통성과 법적 틀을 제공하는 한편, 아르메니아의 정책을 외부의 압력과 감시 아래 놓이게 합니다.\n§W--------------§!\n§H모든 통합 기구 폐쇄§! 중점을 완료하면 이 국가 정신은 §R제거§!됩니다."
 ARM_eu_commitie_desc: "EU 통합에 전념하는 아르메니아 의회 위원회는 입법 조화를 조율하고, 유럽 기준을 이행하며, 아르메니아를 유럽 제도 네트워크와 연결하는 관료 기구를 운영합니다. 이 위원회는 유럽 통치에 대한 기대가 아르메니아 국가 운영에 깊이 자리 잡았음을 보여 줍니다.\n§W--------------§!\n§H모든 통합 기구 폐쇄§! 중점을 완료하면 이 국가 정신은 §R제거§!됩니다."
 ARM_eu_ngos_desc: "유럽 및 국제 NGO들이 아르메니아 전역에서 활동하며 인권을 감시하고, 서비스를 제공하며, 통치 개혁을 촉진합니다. 이들의 존재는 외부의 책임성 확보 장치를 제공하는 한편, 시민 사회에 대한 국가의 독점을 약화시키고 서구의 가치를 아르메니아 공동체에 투영합니다.\n§W--------------§!\n§HNGO 폐쇄§! 중점을 완료하면 이 국가 정신은 §R제거§!됩니다."
 ARM_eu_lgbt_desc: "유럽 인권 협약을 통해 성문화된 아르메니아의 명목상 LGBTQIA 권리 보장은 아르메니아의 보수적인 정교회 다수파의 깊은 사회적, 종교적 저항에 직면해 있습니다. 유럽의 법적 의무와 국내 가치 사이의 이러한 긴장은 아르메니아가 서방과 맺는 가장 첨예한 접점 중 하나로 남아 있습니다.\n§W--------------§!\n§H서구 가치에 대한 선전§! 중점을 완료하면 이 국가 정신은 §R제거§!됩니다."
 ARM_help_siryan_idea_desc: "아르메니아는 시리아 내전 중 위협받는 아르메니아인 공동체를 지원하기 위해 알레포의 시리아계 아르메니아인 거주지에 군 병력, 고문, 인도적 물자를 공수합니다. 이 임무는 디아스포라 공동체의 안전을 지키는 동시에 중동 전역의 아르메니아인 소수 집단을 보호하겠다는 아르메니아의 의지를 확인시켜 줍니다.\n§W--------------§!\n평화가 회복되고 우리의 인도적 임무가 끝나면 이 국가 정신은 §R제거§!됩니다."
 ARM_fsb_borderguards_desc: "러시아 연방보안국 국경 경비대는 1992년부터 양국 조약에 따라 아르메니아와 튀르키예, 이란의 국경에 주둔해 왔습니다. 이들은 국경을 순찰하고 밀수범을 차단하며, 우리 영토에 있는 러시아 군사 주둔의 눈에 띄는 상징을 유지합니다. 이들의 배치는 모스크바의 호의와 양자 관계의 안정에 달려 있습니다.\n§W--------------§!\n[SOV.GetNameWithFlag]와(과) 전쟁을 벌이거나, 민주주의 정부를 채택하거나, [SOV.GetNameWithFlag]이(가) 우리에 대해 부정적인 관계를 갖게 되면 이 국가 정신은 §R제거§!됩니다."
 ARM_syunik_pipeline_desc: "이란산 천연가스를 아르메니아로 공급하며 시우니크 주를 지나는 천연가스 파이프라인입니다. 이 파이프라인은 아르메니아의 만성적인 에너지 부족을 완화하고, 남부 지역을 국가 경제에 통합하며, 이란-아르메니아 무역에 귀중한 연결고리를 만들어 줍니다.\n§W--------------§!\n이 주 변동치는 §Y파이프라인 취소§! 결정을 통해 파이프라인을 취소하거나 §Y파이프라인 확장§! 결정을 통해 업그레이드하면 §R제거§!됩니다."
 ARM_syunik_pipeline_two_desc: "이란산 가스를 더 많이 아르메니아로 공급하며 시우니크 주를 지나는 업그레이드된 천연가스 파이프라인입니다. 확장된 파이프라인은 아르메니아와 이란의 경제적 통합을 심화시키고 이 지역의 발전을 크게 촉진합니다.\n§W--------------§!\n이 주 변동치는 §Y파이프라인 취소§! 결정을 통해 파이프라인을 취소하면 §R제거§!됩니다."
 ARM_arm_electr_deal_desc: "이란에서 아르메니아로 전력을 공급하는 협정으로, 자국 발전에 대한 의존도를 줄이고 이 지역의 계절적 전력난을 완화합니다."
 ARM_arm_electr_deal_two_desc: "이란의 전력 공급을 늘리는 확장 협정으로, 아르메니아의 전력망을 안정시키고 국경 지방의 산업 성장을 가능하게 합니다."
 ARM_legacy_of_grunwald_idea_desc: "아르메니아는 그룬발트의 교훈, 곧 게르만 패권에 맞선 단결된 저항을 되새깁니다. 튜턴 기사단의 팽창에 맞선 폴란드-리투아니아 동맹과 유사점을 찾으며, 아르메니아는 이 지역에서 독일의 산업적, 정치적 지배에 대한 균형추를 형성하기 위해 구소련 및 동유럽 파트너들에게 구애하고 있습니다.\n§W--------------§!\n이 국가 정신은 §H공산주의자§!가 집권하면 §R제거§!됩니다."
 ARM_amenia_iran_memo_desc: "아르메니아와 이란은 2000년대 초 에너지 협력, 수송로, 언론 조율을 다루는 중요한 양해각서에 서명했습니다. 이 협정들은 안정, 시장 접근, 공통의 경쟁국에 맞선 공동 방어에서의 공통된 이익을 인정했습니다. 이 동반자 관계는 아르메니아를 유라시아 유대 관계망에 단단히 묶어 두었습니다.\n§W--------------§!\n이 국가 정신은 이란의 우리에 대한 관계가 0 미만으로 떨어지면 §R제거§!됩니다."
 ARM_amenia_iran_dam_share_desc: "아르메니아와 이란은 시우니크 주의 아라스 강을 따라 수력 발전 기반시설에 공동으로 투자하여 공동 에너지 생산과 상호 경제 의존을 만들어 냈습니다. 이 합작 사업은 국경을 넘는 실질적 협력의 본보기였으며, 아르메니아에는 값싼 전력을 제공한 반면 이란은 아르메니아의 에너지 안보에 대한 영향력을 얻었습니다.\n§W--------------§!\n이 국가 정신은 이란의 우리에 대한 관계가 0 미만으로 떨어지면 §R제거§!됩니다."
 ARM_free_trade_zone_desc: "무역 흐름을 원활히 하고 관세 장벽을 낮추며, 아르메니아와 이란을 잇는 남부 국경 지역에 외국인 투자를 유치하기 위해 메그리 지역에 설립된 자유 무역 지대입니다."
 ARM_ukraine_cooperation_idea_desc: "아르메니아와 우크라이나는 우크라이나 내 상당한 아르메니아 디아스포라의 존재를 활용하여 전략적 동반자 관계를 구축합니다. 협력은 무역, 투자, 군사 기술, 그리고 소련 해체 후 공간에서의 정치적 조율을 아우르며, 러시아의 압박과 분쟁 중인 국경이라는 공통된 경험을 가진 두 나라를 하나로 묶습니다.\n§W--------------§!\n이 국가 정신은 우크라이나와 전쟁에 돌입하면 §R제거§!됩니다."
 ARM_yazidi_repatriation_desc: "아르메니아는 중동 전역에서 박해를 피해 달아나는 야지디인들을 환영하며, 이들에게 피난처와 문화적 자치, 그리고 아르메니아 정치 기관에서의 대표권을 제공합니다. 야지디 귀환 프로그램은 야지디 공동체와 아르메니아의 역사적 유대를 반영하며, 아르메니아를 디아스포라 전역에서 박해받는 소수자들의 피난처로 자리매김하게 합니다.\n§W--------------§!\n이 국가 정신은 §H그들의 자유를 위한 우리의 땅§! 중점이 완료되면 §G개선§!됩니다."
 ARM_yazidi_repatriation2_desc: "야지디 귀환이 절정에 이르렀습니다. 수만 명의 야지디인이 아르메니아 땅으로 돌아와 킬리키아 등지에 번성하는 문화 중심지를 형성했습니다. 이 공동체는 완전한 의회 대표권과 종교적 자치, 경제적 기회를 얻었으며, 아르메니아는 중동에서 박해받는 소수자들의 모범적인 피난처로 자리매김했습니다.\n§W--------------§!\n이 국가 정신은 킬리키아에 대한 통제권을 잃으면 §R제거§!됩니다."
 ARM_armenia_zhirayr_idea_desc: "세필리안의 급진적 친서방, 반러시아 정치 강령을 구현하는 포괄 개념입니다. 참전용사가 이끄는 통치, 과두 엘리트와의 대결, 반부패 활동, 그리고 NATO와 서방을 향한 극적인 방향 전환이 그 내용입니다. 이러한 급진적 변화의 실제 효과는 세필리안의 구상이 지닌 여러 측면을 반영하는 서로 연결된 하위 정신들을 통해 나타납니다.\n§W--------------§!\n이 국가 정신은 §H서방 독재자들§!이 권력을 잃으면 §R제거§!됩니다."
 ARM_zhirayr_veterans_idea_desc: "세필리안과 그의 운동은 군사적 경험과 희생이 정당성을 부여한다고 주장하며 전투 참전용사들, 특히 카라바흐 전쟁 지휘관들을 정치 지도부에 앉힙니다. 참전용사들이 민간인과 과두 세력을 권력 자리에서 밀어내고, 통치에 군대식 규율과 민족주의적 우선순위를 가져옵니다.\n§W--------------§!\n이 국가 정신은 §H서방 독재자들§!이 권력을 잃으면 §R제거§!됩니다."
 ARM_zhirayr_pro_western_position_idea_desc: "소련 해체 후 아르메니아 외교 정책과의 급격한 단절입니다. 세필리안의 운동은 러시아와의 군사 동반자 관계와 CSTO 의무를 버리고 NATO 가입, EU 통합, 서방 강국과의 연대를 택합니다. 아르메니아는 남캅카스에서 서방 동맹의 전초기지가 되어 국경을 맞대고 러시아와 직접 마주하게 됩니다.\n§W--------------§!\n이 국가 정신은 §H서방 독재자들§!이 권력을 잃으면 §R제거§!됩니다."
 ARM_zhirayr_no_russian_idea_desc: "세필리안은 러시아의 군사적 보호에 대한 아르메니아의 의존을 단호히 거부합니다. 아르메니아 땅에서 러시아군을 철수시키고, CSTO 의무를 거부하며, 아르메니아의 독자적 방위 능력을 구축하는 것이 이 반식민 민족주의 강령의 핵심이 됩니다. 아르메니아는 모스크바로부터 주권을 되찾습니다.\n§W--------------§!\n이 국가 정신은 §H서방 독재자들§!이 권력을 잃으면 §R제거§!됩니다."
 ARM_zhirayr_radicalism_idea_desc: "세필리안의 운동은 합의 정치와 자유주의적 타협을 단호히 거부하고, 기존 과두 질서에 대한 직접 행동과 이념적 대결을 받아들입니다. 무장 시위, 국가 건물 점거, 공개적 항명을 뜻하는 아르메니아 정치의 급진적 구도가 통치 원칙으로 제도화됩니다.\n§W--------------§!\n이 국가 정신은 §H서방 독재자들§!이 권력을 잃으면 §R제거§!됩니다."
 ARM_zhirayr_first_armenia_war_idea_desc: "세필리안과 그의 운동은 제1차 나고르노카라바흐 전쟁(1988-1994)을 아르메니아 독립과 군사적 영광을 규정하는 순간으로 숭상합니다. 이 전쟁의 기억은 아제르바이잔, 아르메니아의 미래를 둘러싼 러시아, 그리고 승리를 헛되이 날렸다고 여겨지는 국내 엘리트와의 새로운 대결을 위한 동원력이 됩니다.\n§W--------------§!\n이 국가 정신은 §H서방 독재자들§!이 권력을 잃으면 §R제거§!됩니다."
 ARM_zhirayr_fight_freedom_idea_desc: "세필리안은 현재의 투쟁을 아르메니아 해방 전쟁의 연장선으로 규정합니다. 외세(러시아)의 지배로부터의 자유, 국내 폭정(과두 세력)으로부터의 자유, 그리고 독자적 노선을 설정할 자유입니다. 영웅적 투쟁은 급진적 행동과 서방 동맹의 방법이자 명분이 됩니다.\n§W--------------§!\n이 국가 정신은 §H서방 독재자들§!이 권력을 잃으면 §R제거§!됩니다."
 ARM_zhirayr_heroes_idea_desc: "세필리안의 운동은 전쟁 영웅, 활동가 지도자, 순교자를 아르메니아 청년들의 롤모델로 추켜세우며, 과두 세력을 대신해 민족적 열망의 상징으로 삼습니다. 부패와 외세 의존에 맞선 투쟁 속에서 새로운 세대의 영웅들이 등장하여 국가 목표를 위한 더 높은 동원과 희생을 고취합니다.\n§W--------------§!\n이 국가 정신은 §H서방 독재자들§!이 권력을 잃으면 §R제거§!됩니다."
 ARM_zhirayr_e_commerce_idea_desc: "세필리안의 운동은 급진적 기술 전환을 받아들여, 아르메니아의 IT 부문을 서방 통합과 러시아로부터의 경제적 독립을 위한 지렛대로 발전시킵니다. 기술 경제는 현대성과 청년의 역량 강화, 그리고 소련 시대 유산 산업과의 단절을 상징하게 됩니다.\n§W--------------§!\n이 국가 정신은 §H서방 독재자들§!이 권력을 잃으면 §R제거§!됩니다."
 ARM_zhirayr_sassoun_idea_desc: "아르메니아 민담의 전설적인 사순 영웅들과, 세필리안이 2016년 경찰서 점거에서 이끈 무장 단체 사스나 츠레르에서 이름을 딴 이 정신은 무장 항거를 도덕적, 정치적 수단으로 찬양합니다. 전사-영웅 모델은 국내외의 폭정에 맞서는 본보기가 됩니다.\n§W--------------§!\n이 국가 정신은 §H서방 독재자들§!이 권력을 잃으면 §R제거§!됩니다."
 ARM_turkey_compliance_idea_desc: "아르메니아는 서아르메니아 망명 정부를 묵인하며, 튀르키예를 자극하지 않도록 외교적 순응을 유지하는 한편 역사적 아르메니아 땅에 대한 수복주의적 주장은 보존합니다. 이러한 조치로 아르메니아는 튀르키예의 직접적인 군사적 대응을 촉발하지 않고도 디아스포라의 이익을 옹호할 수 있습니다.\n§W--------------§!\n이 국가 정신은 §H서아르메니아의 봉기§! 사건이 발생하고 아르메니아가 해방을 선택하면 §R제거§!됩니다."
 ARM_kazah_cooperation_idea_desc: "아르메니아는 공통된 소비에트 유산, 디아스포라 연줄, 그리고 러시아 패권에 맞서는 데서의 상호 이익을 활용하여 카자흐스탄과 경제적, 정치적 유대를 맺습니다. 협력에는 에너지 무역, 투자, 안보 조율이 포함되어 아르메니아를 중앙아시아 관계망에 정착시킵니다.\n§W--------------§!\n이 국가 정신은 카자흐스탄과 전쟁에 돌입하면 §R제거§!됩니다."
 ARM_state_ateism: "국가 무신론"
 ARM_kom_code: "공산주의 도덕 규범"