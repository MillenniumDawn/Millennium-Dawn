 TOP_game_rule: "Covert Action: Targeted Operations"
 TOP_rules_group: "Intelligence and Covert Action"
 TOP_enabled_option: "Enabled"
 TOP_enabled_option_desc: "Named-person dossiers, authorization, native map raids, custody, and succession are integrated with counterterrorism and existing historical hunts. New campaigns only."
 TOP_disabled_option: "Off"
 TOP_disabled_option_desc: "Retain the existing counterterrorism, War on Terror, and Most Wanted gameplay."
