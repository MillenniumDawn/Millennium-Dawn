 arab_spring_category: "아랍의 봄"
 arab_spring_category_desc: "§Y아랍의 봄§!은(는) 2010년대 초 중동과 북아프리카 전역을 휩쓴 역사적인 일련의 대규모 시위를 가리킵니다. 새 천년에 접어든 지금, 정보의 급속한 확산과 인터넷의 부상에 힘입어 이 운동은 모든 아랍 국가 위에 드리워져 있습니다. 우리는 이러한 문제의 근본 원인을 해결하여 국민의 뜻을 진정으로 대변하는 새로운 아랍 세계를 효과적으로 세워 나가야 합니다... 아니면 권력에 대한 장악을 더욱 강화하는 길을 택할 수도 있습니다.\n\n§Y아랍의 봄§!은(는) 빠르면 §Y2010년§!에 발생할 수 있으며 §Y2013년§!까지는 반드시 발생합니다. 매달 §Y아랍의 봄§!은(는) 귀국의 현재 국가 상황에 따라 증가하거나 감소합니다. 아랍 세계의 어느 한 국가라도 시위 강도 §Y200§!에 도달하고 연도가 최소 §Y2010년§!이 되면 아랍의 봄이 시작됩니다. 일단 시작되면 도미노가 쓰러지듯 다른 모든 국가에서도 시위가 촉발됩니다.\n\n현재 시위 강도: [arab_protest_strength]  (값: [?arab_spring|0Y])\n현재 §Y시위 강도§!의 월간 변화: [?arab_spring_change|0Y].[AS_display_the_current_arab_spring_change]"
 protest_low: "§G낮음§!"
 protest_medium: "§Y중간§!"
 protest_high: "§R높음§!"
 arab_spring_encourage_supporters: "지지자 독려"
 arab_spring_encourage_supporters_desc: "야권의 집회는 우리 정부가 [ROOT.GetAdjective] 국민들 사이에서 지지를 받지 못하는 듯한 잘못된 인상을 줍니다. 이는 사실과 전혀 다릅니다. 우리는 정치적 의지를 결집하여 충성스러운 [ROOT.GetAdjective] 시민들이 정부를 지지하기 위해 거리로 나서도록 독려해야 합니다."
 arab_spring_request_crackdown: "반도 방패군 진압 요청"
 arab_spring_request_crackdown_desc: "걸프 협력 회의의 회원국으로서 우리는 여섯 회원국 모두의 병력으로 구성된 합동 군사 부대인 반도 방패군을 이용할 수 있습니다. 이 병력을 배치하면 한계에 이른 우리 보안 기관의 부담을 덜 수 있지만, 국내 질서를 유지하는 데 외국의 군사 개입에 점점 더 의존하게 될 것입니다."
 arab_spring_deploy_the_military: "육군 투입"
 arab_spring_deploy_the_military_desc: "우리의 내부 보안군은 소요의 규모에 압도당하고 있습니다. 군을 투입하면 질서를 회복하는 데 도움이 되겠지만, 이러한 강압적 접근은 긴장을 더욱 부추기고 군의 이탈 위험을 초래할 수 있습니다."
 arab_spring_return_to_barracks: "병력 병영 복귀"
 arab_spring_return_to_barracks_desc: "군 투입은 해결한 문제보다 더 많은 문제를 낳았습니다. 이제 병력을 물릴 때입니다."
 arab_spring_return_to_barracks_tt: "§G항명과 치명적인 충돌이 더 이상 발생하지 않습니다.§!"
 arab_spring_reshuffle_government: "내각 개편"
 arab_spring_reshuffle_government_desc: "우리 정부의 일부 장관들은 다른 이들보다 과거의 실패와 더 깊이 연관되어 있습니다. 특히 인기 없는 이들을 정리하면 남는 이들의 입지를 지키는 데 도움이 될 수 있습니다."
 arab_spring_amend_the_constitution: "헌법 개정"
 arab_spring_amend_the_constitution_desc: "야권은 현행 [ROOT.GetAdjective] 헌법이 정부에 지나치게 많은 권력을 준다고 비판해 왔습니다. 우리 권한에 대한 헌법상의 제한을 강화하면 책임 있는 통치에 대한 우리의 의지를 보여 주는 데 도움이 될 것입니다."
 constitutional_reform: "헌법 개혁"
 arab_spring_protests_1: "시위 진압"
 arab_spring_protests_1_desc: "당근과 채찍을 병행해야만 현재의 곤경에서 벗어날 수 있습니다. 상황을 통제하는 데 실패하면 권력을 내려놓거나, 권력을 유지하기 위해 극단적인 조치를 취할 수밖에 없게 됩니다."
 arab_spring_protests_2: "시위 진압"
 arab_spring_protests_2_desc: "당근과 채찍을 병행해야만 현재의 곤경에서 벗어날 수 있습니다. 상황을 통제하는 데 실패하면 권력을 내려놓거나, 권력을 유지하기 위해 극단적인 조치를 취할 수밖에 없게 됩니다."
 arab_spring_ended_tt: "시위 강도를 200으로 낮춰 시위가 충분히 약화되었습니다 (현재 시위 강도: [?arab_spring|0Y])\n"
 mutiny_possibility_tt: "§R육군 부대가 항명할 수 있습니다.§!\n"
 clashes_fatalities_tt: "§R충돌로 인해 사망자가 발생할 수 있습니다.§!\n"
 arab_spring.1.t: "[FROM.GetNameDef]에서 변화를 요구하는 시위가 터지다"
 arab_spring.1.d: "[FROM.GetNameDef]의 부패와 인권 침해에 대한 수년간의 불만이 마침내 전국적인 대규모 시위로 폭발했습니다. 일부 시위대는 단순히 실질적인 체제 개혁을 바라는 것으로 보이지만, 주요 도시 중심지의 군중은 \\"국민은 체제의 붕괴를 원한다\\"는 구호를 외치는 것으로 알려졌으며, 이는 일부가 정치 기득권의 전면적 거부를 지지함을 시사합니다.\n\n경찰은 최루탄과 고무탄으로 시위에 대응했으나, [FROM.GetLeader]이(가) 시위대의 요구를 수용하려 할지 아니면 자신의 권위에 대한 이 도전을 짓밟으려 할지는 여전히 가늠하기 어렵습니다."
 arab_spring.1.d_western: "[FROM.GetNameDef]의 부패와 인권 침해에 대한 수년간의 불만이 마침내 전국적인 대규모 시위로 폭발했습니다. 일부 시위대는 단순히 실질적인 체제 개혁을 바라는 것으로 보이지만, [FROM.Capital.GetName]의 군중은 \\"국민은 체제의 붕괴를 원한다\\"는 구호를 외치는 것으로 알려졌으며, 이는 일부가 정치 기득권의 전면적 거부를 지지함을 시사합니다.\n\n경찰은 최루탄과 고무탄으로 시위에 대응했으나, [FROM.GetLeader]이(가) 시위대의 요구를 수용하려 할지 아니면 자신의 권위에 대한 이 도전을 짓밟으려 할지는 여전히 가늠하기 어렵습니다. [FROM.GetLeader]을(를) 후원해 온 서방 국가들이 이 전례 없는 사태에 어떻게 반응할지도 지켜봐야 합니다."
 arab_spring.1.a: "우린 이 위기를 완화해야만 합니다!"
 arab_spring.1.b: "중동에서 변화의 바람이 불어오고 있다..."
 arab_spring.3.t: "위협받는 동맹"
 arab_spring.3.d: "수년간 [FROM.GetNameDef]의 [FROM.GetLeader] 정권은 전략적으로 중요한 지역에서 믿을 만한 [ROOT.GetAdjective] 파트너였습니다. 한때의 동맹은 이제 외부 세력이 아니라 자국민으로부터 위협을 받고 있습니다. [FROM.GetAdjective] 정부에 대한 지지를 표명할지, 아니면 [FROM.GetNameDef]의 민주화 세력을 규탄하기를 거부할지 결정해야 합니다."
 arab_spring.3.a: "우리는 동맹의 곁을 지킨다!"
 arab_spring.3.b: "우리는 민주적 개혁의 길을 가로막지 않겠다!"
 arab_spring.4.t: "우리를 지지하는 동맹!"
 arab_spring.4.d: "[ROOT.GetNameDef]의 오랜 우방인 [FROM.GetAdjective] 정부가 이 불확실한 시기에 합법적인 [ROOT.GetAdjective] 정부에 대한 지지를 표명했습니다."
 arab_spring.4.a: "그들의 지지는 환영할 일이다!"
 arab_spring.5.t: "우리의 동맹이 우릴 버렸다..."
 arab_spring.5.d: "[ROOT.GetNameDef]의 오랜 친구였던 [FROM.GetAdjective] 정부는 이 불확실한 시기에 합법적인 [ROOT.GetAdjective] 정부에 대한 지원의 의사를 표현하는 것을 거부하였고, 그 대신 우리 국민들의 이른바 민주적인 열망을 존중하라고 다그쳤습니다. 우리 정부의 이러한 포기 의사는 우리의 권위를 훼손시키려하는 반군 조직들을 더욱 자극하고 있습니다."
 arab_spring.5.a: "우리가 어려울 때 배신당했다..."
 arab_spring.6.t: "정권 지지자들의 집회"
 arab_spring.6.d1: "합법적인 [ROOT.GetAdjective] 정부의 충성스러운 지지자들이 반역적인 야권에 공공연히 맞서며 거리를 메우고 있습니다. 결코 금전적 유인에 의해 조성된 것이 아닌 이러한 정부 지지 시위는 우리의 지속적인 통치에 대한 국민적 지지를 강화할 것입니다. 친정부 시위대와 반정부 시위대 사이에 긴장이 존재하지만, 아직 광범위한 폭력 사태는 일어나지 않았습니다."
 arab_spring.6.d2: "합법적인 [ROOT.GetAdjective] 정부의 충성스러운 지지자들이 반역적인 야권에 공공연히 맞서며 거리를 메우고 있습니다. 결코 금전적 유인에 의해 조성된 것이 아닌 이러한 정부 지지 시위는 우리의 지속적인 통치에 대한 국민적 지지를 강화할 것입니다. 정부 지지자와 반대자 사이의 충돌이 폭력으로 번져 많은 부상자와 사망자까지 발생했습니다."
 arab_spring.6.a: "국민은 [ROOT.GetLeader]을(를) 사랑한다!"
 arab_spring.6.b: "긴장이 고조된다..."
 arab_spring.7.t: "항명하여 야권 편에 선 육군 부대"
 arab_spring.7.d: "군 내부의 정부에 대한 반감이 야권으로의 이탈로 이어졌습니다. 이러한 이탈은 우리의 통치에 맞서 시위하는 이들을 고무했고 우리 지지자들의 사기를 떨어뜨렸습니다. 고문들은 내전이 발발할 경우 이탈자들이 이전의 전우들을 향해 총구를 겨눌 것을 우려하고 있습니다."
 arab_spring.7.a: "우리의 권위가 약해지고 있다..."
 arab_spring.8.t: "병력과 시위대 충돌 후 사망자 발생"
 arab_spring.8.d: "시위대와 병사들 사이에 폭력 사태가 벌어져 다수의 사상자가 발생했습니다. 돌을 던진 시위대에게 우리 병력이 실탄으로 대응하면서 정부에 대한 민심의 반감은 더욱 커졌습니다."
 arab_spring.8.a: "이는 우리에게 좋지 않은 일이다..."
 arab_spring.9.t: "민심을 달래는 양보"
 arab_spring.9.d: "우리의 최근 개혁은 반정부 시위대에게 호의적으로 받아들여졌습니다. 일부 시위대는 여전히 우리 정부에 대한 불신을 표하지만, 운동은 대체로 우리의 조치를 올바른 방향으로 향하는 한 걸음이라며 환영했습니다."
 arab_spring.9.a: "이걸로 충분할까?"
 arab_spring.10.t: "양보가 추가적인 개혁 요구를 불러일으키다"
 arab_spring.10.d: "Our recent reforms have done nothing but fan the flames of discontent. Opposition leaders have continued to criticize us for doing too little too late, and have called upon us to enact \"genuine\" reform proposals."
 arab_spring.10.a: "폭도들은 결코 만족하지 않을 것입니다..."
 arab_spring.11.t: "시위가 일촉즉발의 상황으로 극에 달하다"
 arab_spring.11.d: "최선을 다했음에도 불구하고, 우리 정부는 더 이상 기존 방식으로는 권력을 유지할 수 없습니다. 이제 역사적인 선택의 기로에 서 있습니다. 패배를 인정하고 야당에게 정권을 넘겨줄 것인가, 아니면 최후의 수단으로 군대를 동원해 모든 반대 세력을 진압하고 정권을 지켜낼 것인가."
 arab_spring.11.a: "우린 패배를 인정해야 합니다..."
 arab_spring.11.b: "우리는 절대로 권력을 포기하지 않을 것입니다!"
 arab_spring.12.t: "정권을 휩쓸어버린 [FROM.GetNameDef]의 반란"
 arab_spring.12.d1: "퇴임하는 통치자의 정부가 붕괴되면서 [FROM.GetNameDef] 전역에서 축하 행사가 벌어졌습니다. [FROM.GetAdjective] 보안 기관의 고위 인사들이 야당 편에 서기로 결정한 후, 전직 독재자는 체포되었습니다.\n\n임시 정부가 총선이 실시될 때까지 권력을 잡았지만, 통치의 일시적인 성격을 강조했습니다. 그럼에도 불구하고 집권당의 완전한 해체와 모든 당원의 사퇴를 요구하는 시위는 계속되고 있는데, 이는 집권당이 이전 정권과 여전히 밀접한 관계를 유지하고 있기 때문입니다."
 arab_spring.12.d2: "Celebrations have broken out across [FROM.GetNameDef] following the collapse of the outgoing ruler's government. The former president has been forced to flee the country, taking refuge in [SAU.GetNameDef].\n\nA caretaker government has taken power until elections are held, but has stressed the temporary nature of its rule. Protests nonetheless continue, as many demand the complete dismantling of the ruling party and the resignation of all its members, as it continues to be closely associated with the outgoing regime of Zine el-Abidine Ben Ali."
 arab_spring.12.a: "시민들은 승리하였습니다!"
 arab_spring.12.b: "불쾌한 추세다"
 arab_spring.12.c: "민주주의는 진보한다..."
 arab_spring.13.t: "아랍의 세계로 퍼지는 시위의 물결"
 arab_spring.13.d: "[FROM.GetAdjective] 체제의 붕괴는 아랍 세계의 시민 운동에 불씨를 지폈습니다. 수많은 이들이 [FROM.GetAdjective] 혁명을 슬로건으로 내세우며 그들의 지도자에게 유의미한 국가 개혁을 촉구하거나, 일부의 경우 정권 내각의 전면적인 탄핵 및 사퇴를 요구하고 있습니다. 각 국가의 독재자들은 각자의 방식으로 시위를 잠재우거나 진압하는 노력을 하며, 그들 또한 [FROM.GetAdjective] 지도자와 같은 운명을 맞이하지 않기를 간절히 바라고 있습니다.\n\n이번 중동 아랍의 광범위한 친-민주적인 운동, 소위 ‘아랍의 봄’은 전 세계를 놀라게 하였습니다. 그러나 많은 외교 전문가들은 이전 부터 지속적으로 강압적인 통제와 감시를 통해 유지되는 아랍 독재 정권의 취약함을 비판하고 있었습니다. 아랍 전 지역에서 드러난 급격한 집권 엘리트층과의 격차, 걷잡을 수 없는 부패, 그로 인한 경제적 어려움이 누적되며 새로운 형태의 정부와 개혁을 요구하는 시민들의 열망이 광범위하게 확산되고 있었습니다. 이런 대중 심리가 마침내 동시다발적으로 폭발하며 변화를 요구하는 중동 전 지역의 시민 운동이 본격적으로 아랍의 세계를 물들이고 있습니다."
 arab_spring.14.t: "정부가 시위대를 박살내면서 내전이 발생한 [FROM.GetNameDef]"
 arab_spring.14.d: "[FROM.GetNameDef]에서 발생한 시위의 격화된 상황에 따라, [FROM.GetLeader]는 자신이 \"무법자 폭도\"와 \"테러리스트\"라고 지칭한 이들을 처벌하기 위해 전국적으로 군사 작전을 명령했습니다. 이들 폭도는 이름을 밝히지 않은 외국 세력에 의해 지원받고 있다는 주장이 나오고 있습니다. 군사 작전은 충돌을 일으켰으며, 일부 군대는 무기고와 군사 탈영병들에게서 얻은 총기를 가진 시위대와 맞서 싸우고 있습니다.\n\n이제, 한때 비폭력적인 시위 운동이 점차 반군 활동으로, 그리고 내전으로 변해가고 있음을 알 수 있습니다. 일부 지역에서는 반대 세력이 전 도시를 장악한 것으로 보이며, [FROM.GetNameDef]에서 나오는 정보는 혼란스럽고 복잡해지고 있습니다. 세계 지도자들은 자제를 촉구했으며, 인권 단체들은 [FROM.GetLeader]의 시위 탄압이 너무 폭력적이라고 비판하고 있습니다."
 arab_spring.14.a: "[FROM.GetNameDef]의 미래는 이 균형에 달려 있습니다..."
 arab_spring.15.t: "이라크 레반트 이슬람 국가 (ISIL)의 출현"
 arab_spring.15.d: "[ISI.GetLeader]는 오늘 이라크 레반트 이슬람 국가(ISIL)의 결성을 선언했습니다. 그는 시리아 정권과 싸우는 알누스라 전선이 이라크 이슬람 국가(ISIL) 구성원들에 의해 결성되었으며, 두 조직이 현재 합병 중이라고 밝혔습니다. 그러나 알누스라 전선과 그 배후 세력인 알카에다는 ISIL을 부인하며 그 해체를 촉구했습니다.\n\n분석가들은 알카에다와 그 시리아 지부인 알누스라가 ISIL과는 목표와 방법이 매우 다르지만, 시리아 정부에 대한 반대라는 공통된 이념을 공유한다고 보고 있다.[ISI.GetLeader]의 조직은 항상 알카에다와 독립적으로 활동하며, 알카에다가 같은 정도로 행하지 않았던 방식으로 무슬림 소수 집단을 표적으로 삼는 독자적인 종파적 의제를 추구해 왔습니다. 그들의 열망은 초국가적이지만, 알카에다의 분파인 알누스라와 같은 조직은 일반적으로 특정 정부를 표적으로 삼아 활동 범위를 제한해 왔습니다."
 arab_spring.15.a: "우리 정권의 또 다른 위협이다..."
 arab_spring.15.b: "세계 평화는 위협을 받고 있다..."
 arab_spring.15.c: "이 신생 기업들은 실패할 운명이다..."
 arab_spring.17.t: "'아랍의 봄'이 [ROOT.GetNameDef]에 도달하다"
 arab_spring.17.d: "아랍 세계를 휩쓸고 있는 민중 봉기의 물결이 마침내 우리 땅에도 도달했습니다. [ROOT.GetAdjective] 국민들은 심각한 개혁을 요구하고 있으며, 일부 경우에는 정부의 사임을 요구하고 있습니다. 우리가 어렵게 지켜온 권력을 유지하려면 신중하게 처신해야 합니다."
 arab_spring.18.t: "가라앉는 시위"
 arab_spring.18.d: "일부 강경파들이 여전히 정부에 반대하는 시위를 벌이고 있지만, 시위대의 열기가 급격히 식으면서 대다수는 집으로 돌아갔습니다. 하지만 제보자들에 따르면 전국 곳곳에 여전히 반정부 정서가 남아 있다고 합니다. 시위대의 지지가 약해진 것은 정부에 대한 지지가 높아져서라기보다는 피로감과 좌절감 때문인 것으로 보입니다. 그럼에도 불구하고 정부에 대한 당면한 위협은 성공적으로 해소되었습니다."
 arab_spring.18.d1: "우리 정부가 시위대의 요구를 해결하기 위해 노력한 결과, 우리나라의 민주화 운동은 동력을 잃었습니다. 이전 시위 참가자 대다수는 정부의 조치에 만족하는 듯하며, 더 이상의 개혁을 요구하지 않고 있습니다."
 arab_spring.18.a: "우리 정부는 겨우 목숨만 연명하고 있습니다..."
 arab_spring.19.t: "반도방위군의 개입을 요청한 [FROM.GetNameDef]"
 arab_spring.19.d: "[FROM.GetNameDef]에서 긴장이 고조됨에 따라 [FROM.GetLeader]는 GCC 합동 안보군인 페닌슐라 실드에 지원을 요청했습니다. [FROM.GetAdjective] 측은 자국 정부가 붕괴 위기에 처해 있으며 위험한 혁명 세력이 국가를 장악할 수 있다고 주장합니다. 우리는 [FROM.GetAdjective] 정부를 지원하기 위해 우리 군대를 파견하는 것이 필요한지 신중하게 검토해야 합니다."
 arab_spring.19.a: "우린 동맹을 도와야한다!"
 arab_spring.19.b: "그들이 망하도록 놔두자"
 arab_spring.20.t: "저희 요청이 승인되었습니다!"
 arab_spring.20.d: "우리 수도 거리에서 시위하는 급진적인 시위대가 지역 안보에 임박한 위협을 가하고 있음을 인식하여, [FROM.GetAdjective]는 우리에 대한 봉기를 진압하기 위해 반도방위군 파병을 지원하기로 합의했습니다."
 arab_spring.20.a: "우리를 구원해주는 [FROM.GetAdjective]!"
 arab_spring.21.t: "우리 요청은 거절되었습니다…"
 arab_spring.21.d: "[FROM.GetAdjective] 측은 우리 정부를 구하는 것이 반도 방패 작전 병력을 배치하는 데 드는 시간과 노력만큼의 가치가 없다고 판단했습니다."
 arab_spring.21.a: "우리 스스로만이 우릴 지켜내야 한다."
 arab_spring.22.t: "반도방위군의 [FROM.GetNameDef] 시위 진압"
 arab_spring.22.d: "[FROM.GetLeader] 정부에 반대하는 시위가 급격히 거세진 뒤 걸프 협력 회의의 합동 군사력인 반도 방패군이 [FROM.GetAdjective] 영토로 진입했습니다. [FROM.GetNameDef]과(와) 걸프 협력 회의는 반도 방패군 병력이 혼란 속에서 외부 간섭으로부터 주요 정부 건물을 방어하는 데만 투입되고 있다고 주장해 왔으나, 반도 방패군 병력이 [FROM.GetAdjective] 시위대에 강압적인 전술을 사용하고 있다는 보도가 빠르게 쏟아져 나왔습니다."
 arab_spring.22.a: "[FROM.GetLeader] 정부는 그들 정권을 유지시키기 위해 무엇이든 마다하지 않을 것이다…"
 hybrid_regime: "혼합 체제"
 hybrid_regime_western_desc: "이 나라의 정부는 선거를 치르면서도 다양한 비공식적 수단을 동원하여 선거에서 집권당이 과반수를 차지하도록 보장합니다. 따라서 선거를 통한 정권 교체는 극도로 어렵습니다."
 hybrid_regime_emerging_desc: "이 나라의 정부는 선거를 치르면서도 다양한 비공식적 수단을 동원하여 선거에서 집권당이 과반수를 차지하도록 보장합니다. 따라서 선거를 통한 정권 교체는 극도로 어렵습니다."
 concede_rojava: "북동부 양보"
 concede_rojava_desc: "시리아의 다수 쿠르드족이 거주하는 북동부 지역은 아직 우리 정부에 반대하는 대중 봉기에 동참하지 않았습니다. 이 지역에서 우리 군을 철수시키고 쿠르드 민병대에 점유되도록 내버려 두는 것이 우리에게 유리할 수 있습니다. 이는 군대를 지나치게 분산시켜 자유시리아군에 의해 패배할 위험을 감수하는 것보다 나을 수 있습니다."
