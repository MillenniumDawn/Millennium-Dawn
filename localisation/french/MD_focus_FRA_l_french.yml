 france_md.509.t: "Introduction de l'ECO"
 france_md.509.d: "La France a proposé de remplacer le franc CFA par l'ECO, une nouvelle monnaie commune pour l'Afrique de l'Ouest. L'adopter nous accorderait une plus grande autonomie monétaire et des liens plus étroits avec la France."
 france_md.509.a: "Adopter l'ECO"
 france_md.509.b: "Refuser l'offre"
 FRA_airbus_change: "Eurocopter a été rebaptisé Airbus Helicopters en 2014"
 FRA_naval_takeover: "DCNS a été rebaptisé Naval Group en 2017"
 Francosphere: "Francosphere"
 Continental_system: "Système continental"
 Holy_league: "Sainte Ligue"
 world_revolution_commune: "Commune Révolutionnaire Mondiale"
 FRA_PS: "Le Parti socialiste"
 FRA_PS_desc: "Refondé au congrès d'Épinay sous François Mitterrand, le Parti socialiste a dépassé les communistes comme force dominante de la gauche française et alterne au pouvoir avec la droite républicaine depuis. Notre base est large, répartie dans la plupart des classes, et notre retour à l'Élysée n'est qu'une question de temps."
 FRA_UDF_LREM: "L'Union centriste"
 FRA_UDF_LREM_desc: "Rassemblée en 1978 pour soutenir Valéry Giscard d'Estaing, l'Union pour la démocratie française est une confédération de libéraux, démocrates-chrétiens et radicaux plutôt qu'un parti unique. Relégués au rang de partenaire junior pendant deux décennies, nous entendons bâtir un centre qui gouverne de son propre chef."
 FRA_LR: "La droite républicaine"
 FRA_LR_desc: "La droite gaulliste est aussi vieille que la Ve République et détient la présidence depuis 1995, mais une dissolution ratée nous a coûté cher et a mis un socialiste à Matignon. Il faut consolider le centre droit avant que nos rivaux des deux flancs ne nous dépassent."
 FRA_RPF: "Rassemblement pour la France"
 FRA_RPF_desc: "Charles Pasqua et Philippe de Villiers ont fondé le Rassemblement pour la France en 1999 pour les gaullistes qui jugeaient la droite mainstream trop accommodante envers Bruxelles. Notre influence est faible aujourd'hui, mais chaque concession faite à l'Union européenne recrute pour nous."
 FRA_FN: "Le Front national"
 FRA_FN_desc: "Fondé en 1972 autour de Jean-Marie Le Pen, le Front national a passé trois décennies hors de la politique respectable tandis que tous les autres partis faisaient front contre lui. Le cordon sanitaire commence à se défaire, et nous entendons être prêts quand il cédera."
 FRA_LFI: "La France insoumise"
 FRA_LFI_desc: "Le Parti socialiste s'est usé à servir la soupe aux centristes et à mourir entre ses deux tendances. La France insoumise est la seule vraie opposition de gauche à l'ordre néolibéral, et nous ne chercherons aucun compromis avec lui."
 FRA_EELV: "Les Verts"
 FRA_EELV_desc: "Le mouvement écologiste concourt aux élections françaises depuis 1984 sans jamais être pris au sérieux, et notre base dépasse à peine les villes. Le temps est la seule ressource pour laquelle on ne peut pas faire campagne : il faut convertir les autres partis ou les remplacer."
 FRA_PCF: "Le Parti communiste français"
 FRA_PCF_desc: "Le Parti communiste français est tombé avec l'Union soviétique à laquelle il était lié, et notre base ouvrière dérive vers l'extrême droite ou l'abstention. Inverser ce déclin est toute la tâche qui nous attend."
 FRA_friend_eu: "Se lier d'amitié avec l'UE"
 FRA_friend_eu_desc: "L'Union européenne abrite de nombreuses nations dirigées par des partis semblables au nôtre. Nous devons user de cette convergence idéologique pour mettre en avant notre stance pro-européenne comme rempart contre le nationalisme."
 FRA_eternal_challenge: "L'éternel challenger"
 FRA_eternal_challenge_desc: "Depuis des décennies, nous sommes le seul parti à combattre à la fois dans la rue et au parlement pour défendre les travailleurs. Nos ennemis sont clairs : la droite et les extrémistes. Le peuple sait qu'il peut compter sur nous pour leur tenir tête. Nos ennemis ne dorment jamais, et nous ne devons pas l'oublier. Unis, nous pouvons faire reculer n'importe quelle menace."
 FRA_eu_federalism: "Le fédéralisme européen"
 FRA_eu_federalism_desc: "Les autres nations doivent se souvenir des valeurs que nous défendons en tant qu'Union européenne : les protéger, les développer et les répandre parmi les autres nations d'Europe."
 FRA_let_industry: "Laisser partir l'industrie"
 FRA_let_industry_desc: "L'industrie lourde est une perte de temps et d'énergie ; elle n'est plus assez productive dans une économie mondialisée comme la nôtre. Il ne faut pas entraver sa relocalisation vers les nouveaux centres industriels du monde. Tournons-nous plutôt vers une nouvelle forme d'économie : le secteur tertiaire. Les bureaux seront notre principal focus dans les années à venir. En les priorisant, nous pouvons réduire le chômage et augmenter les revenus qu'ils génèrent."
 FRA_finance_minister: "Une nouvelle politique économique"
 FRA_finance_minister_desc: "Dans un monde en mutation, nous aussi devons évoluer et déplacer notre focus économique. Les crises ont montré les limites de l'économie keynésienne : il faut changer de façon de penser. Nous devons donc choisir notre prochain programme économique pour le secteur financier. Il permettra de réduire les dépenses ; la seule question est de savoir à qui faire confiance."
 FRA_atlantist_drift: "Dérive de l'Atlantique"
 FRA_atlantist_drift_desc: "L'OTAN est l'alliance la plus forte actuellement. Si nous voulons qu'elle le reste, il faut améliorer l'entraînement de nos forces armées."
 FRA_greece_eurozone: "La Grèce dans la zone euro"
 FRA_greece_eurozone_desc: "La Grèce est connue pour ses problèmes de dette. Nous pouvons l'aider par un peu d'argent pour montrer que les pays de l'Union européenne se soucient vraiment les uns des autres."
 FRA_tax_evasion: "Combattre l’évasion fiscale"
 FRA_tax_evasion_desc: "Trop de gens continuent d'échapper à l'impôt par divers montages ; il faut y mettre fin, car nous nous y sommes engagés."
 FRA_liberal_turn: "Virage libéral"
 FRA_liberal_turn_desc: "Trop longtemps, nous avons tenté de contrôler l'économie et la finance, mais dans un monde mondialisé, il devient de plus en plus difficile de contrôler les flux de capitaux. Laissons donc le marché se réguler lui-même. Qu'est-ce qui pourrait mal tourner ?"
 FRA_ease_interventionism: "Faciliter l’interventionnisme"
 FRA_ease_interventionism_desc: "Nous devrions nous concentrer sur l'amélioration des relations diplomatiques en Europe, non envoyer nos gens combattre la guerre de quelqu'un d'autre. L'Europe est aujourd'hui un continent de paix, et comme puissance régionale majeure nous devons donner le bon exemple."
 FRA_modern_interest: "Intérêt moderne"
 FRA_modern_interest_desc: "Trop longtemps, nous avons défendu une classe improductive perpétuellement en crise. Il est grand temps de regarder vers l'avenir, et l'avenir est dans les services et la technologie."
 FRA_cut_with_unions: "Rompre avec les syndicats"
 FRA_cut_with_unions_desc: "Les syndicats ne sont plus aussi utiles au pays qu'autrefois. Nous ne devons plus céder à leurs exigences : après tout, nous ne sommes pas leurs otages."
 FRA_vigipirate: "Renforcer la sécurité"
 FRA_vigipirate_desc: "La mission Vigipirate sera notre système d'alerte de sécurité nationale et antiterroriste. Il est censé être un mécanisme permanent impliquant le gouvernement, les forces armées, les collectivités et les citoyens, conçu pour anticiper, prévenir et protéger le pays contre les menaces terroristes."
 FRA_not_done: "Nous n'avons pas fini"
 FRA_not_done_desc: "Le vingt-et-un avril fut une humiliation sans précédent. Notre candidat a été éliminé au premier tour et la République a dû choisir entre la droite et l'extrême droite. Pourtant les militants ne sont pas rentrés, les sections se réunissent encore, et les électeurs partis à l'extrême gauche n'ont nulle part de mieux. Nous reconstruisons de la base, et nous faisons la paix avec les syndicats que nous avions aliénés."
 FRA_meet_friends: "Rencontre avec des amis"
 FRA_meet_friends_desc: "C'est le bon moment d'organiser une rencontre avec d'autres pays socialistes pour discuter de la situation mondiale actuelle et du chemin vers le socialisme."
 FRA_turn_ecology: "Virage écologique"
 FRA_turn_ecology_desc: "Les Verts ne s'écarteront pas pour nous aux prochaines législatives sans un prix, et le prix est écrit sur les réacteurs. Vingt-quatre d'entre eux, Fessenheim d'abord, et la moitié de notre mix électrique cédée d'ici la fin de la décennie. Les fédérations énergie de la CGT ont déjà fait connaître leur avis. Il faut décider si l'alliance vaut la flotte."
 FRA_military_coop: "Coopération militaire"
 FRA_military_coop_desc: "En nous appuyant sur notre étroite coopération avec l'OTAN, nous devrions inviter d'autres pays à mener des entraînements militaires conjoints. Tout le monde y gagne, et cela montrera à nos ennemis à quel point nous sommes unis et prêts."
 FRA_party_unity: "Unité du Parti"
 FRA_party_unity_desc: "Chaque congrès se termine de la même façon. Les courants argumentent trois jours, personne ne gagne, et une motion de synthèse est rédigée dans la nuit pour que tous puissent crier victoire. Reims a failli nous briser pour quarante-deux voix. L'unité est possible, mais elle s'achète avec ministères et secrétariats, et la facture se paie toujours en clientélisme."
 FRA_strenght_throught_EU: "Renforcer grâce à l’UE"
 FRA_strenght_throught_EU_desc: "L'UE incarne les valeurs démocratiques, et nous aussi. Cela devrait suffire à garder cette organisation vivante, forte et stable. Si l'UE tombe, l'Europe pourrait à nouveau se diviser."
 FRA_stole_voter: "Reconnecter avec notre électorat"
 FRA_stole_voter_desc: "Le bassin minier et le Midi furent nôtres pendant un siècle et sont désormais le terrain le plus sûr de l'extrême droite. Sermonner ces électeurs n'a pas marché. Si nous les voulons, il faut aller vers eux avec quelque chose en main : des hauts fourneaux rallumés, des postes ouverts, une promesse industrielle faite en public. Faite, puis tenue, car une promesse brisée là-bas nous coûtera la région pour une génération."
 FRA_ps_lgbt: "Garantir les droits des LGBT"
 FRA_ps_lgbt_desc: "Le pacte civil de solidarité n'était qu'une demi-mesure. Mariage, adoption, pleine égalité des couples devant la loi : voilà la réforme qu'attendent nos électeurs et celle que la droite a promis de combattre dans la rue. La Manif pour Tous réserve déjà le Champ de Mars. Nous pouvons porter la loi entière, ou la rogner et garder la paix."
 FRA_ps_win: "Le socialisme a été sauvé"
 FRA_ps_win_desc: "Nous l'avons fait ! Nous avons accompli l'impossible. Après avoir évité de justesse l'effondrement et une défaite humiliante aux yeux des Français et de l'histoire, nous avons inversé la tendance. Nos adversaires nous croyaient finis, mais nous avons reconquis notre électorat et l'avons éloigné des sirènes de l'extrémisme. Notre victoire est un signe de la stabilité du socialisme dans le monde. Mais ce n'est que le début : fort de cette expérience, nous ne referons pas les mêmes erreurs."
 FRA_Neither_right_nor_left: "Ni à droite ni à gauche"
 FRA_Neither_right_nor_left_desc: "La meilleure façon de développer le pays est d'éviter la politique clivante. Occupons le centre, pas trop à droite, pas trop à gauche."
 FRA_Get_indecisives: "Soyez indécis"
 FRA_Get_indecisives_desc: "Ni droite ni gauche. Il y a dans ce pays des électeurs qui n'ont jamais trouvé de parti qui vaille le trajet jusqu'au bureau de vote, et des milliers de volontaires prêts à frapper à leur porte pour demander ce qu'ils veulent. La Grande Marche nous les amènera des deux vieux partis à la fois. Ce qu'elle ne nous amènera pas, c'est une seule fédération locale."
 FRA_abolish_ISF: "Abolir l'ISF"
 FRA_abolish_ISF_desc: "L'impôt de solidarité sur la fortune rapporte peu et exile beaucoup. Depuis trente ans le capital part à Bruxelles et à Genève, et les recettes n'ont jamais justifié la fuite. Nous le remplaçons par un impôt sur le seul patrimoine immobilier. L'argent reviendra. L'accusation aussi, dans chaque titre jusqu'à la prochaine élection : que nous gouvernons pour les riches."
 FRA_Fight_Deficit: "Combattre le déficit"
 FRA_Fight_Deficit_desc: "Notre dette est élevée. Il faut la combattre coûte que coûte si nous ne voulons pas nous noyer dans une dette irremboursable. Le peuple comprendra sûrement ces actions nécessaires."
 FRA_Reconize_Mistakes: "Reconnaître les erreurs"
 FRA_Reconize_Mistakes_desc: "Les dirigeants français précédents ont traité les nations coloniales de façon profondément injuste. Il faut enfin réparer en payant pour leurs actes. Que ce chapitre de notre histoire se ferme enfin."
 FRA_Western_policy: "Politique occidentale"
 FRA_Western_policy_desc: "L'Union européenne et l'alliance atlantique sont ce qui maintient ce continent en sécurité, et nous ne gagnons rien à faire semblant du contraire. Une intégration plus étroite avec nos alliés nous achète de l'influence à Bruxelles et de la bienveillance à Washington. Elle offre aussi aux souverainistes, gaullistes comme nationalistes, le seul argument dont ils ont jamais eu besoin : que la République est devenue un vassal."
 FRA_independant_Euro: "Europe indépendante"
 FRA_independant_Euro_desc: "Les autres pays doivent savoir qu'au sein d'une Europe unie, nous ne cherchons pas une influence excessive sur leur stabilité. Seuls, certains d'entre nous peuvent être vulnérables, mais ensemble nous devons être assez forts pour surmonter ces problèmes."
 FRA_reduce_tax: "Réduire l'impôt"
 FRA_reduce_tax_desc: "La taxe d'habitation pèse le plus sur les ménages qui l'absorbent le moins, et le crédit d'impôt pour l'emploi a déjà montré ce que le soulagement fait pour l'embauche. Nous la supprimerons entièrement. Les communes perdent leur assiette, donc l'État devra les compenser depuis Paris, et chaque maire de France nous écrira à ce sujet."
 FRA_increase_pension_age: "Relever l'âge de la retraite"
 FRA_increase_pension_age_desc: "Les gens peuvent ne pas aimer, mais à mesure que l'espérance de vie augmente grâce aux percées médicales, il faut continuer à financer le système social. Avec de moins en moins de jeunes pour financer les pensions d'un nombre croissant d'aînés, nous n'avons pas le choix. Il faut faire travailler plus longtemps la population active pour compenser ce manque de renouvellement générationnel."
 FRA_growing_tensions: "Des tensions croissantes"
 FRA_growing_tensions_desc: "Notre monde devient de moins en moins sûr, et la guerre peut revenir en Europe. Pour ne pas être pris au dépourvu, il faut nous y préparer."
 FRA_befriend_china: "Se lier d'amitié avec la Chine"
 FRA_befriend_china_desc: "La Chine est un partenaire commercial majeur de la France ; il est très largement dans notre intérêt de négocier des traités favorables avec elle."
 FRA_nuclear_eu: "Nucléariser l'UE"
 FRA_nuclear_eu_desc: "Cinquante-six réacteurs, et personne à Bruxelles prêt à les dire verts. La taxonomie s'écrit maintenant, et si le nucléaire en est exclu toute notre flotte devient un passif sur le papier. Berlin et Vienne nous combattront. Prague, Varsovie et Helsinki non. Nous bâtissons l'alliance, nous gagnons le vote, et nous acceptons que l'Allemagne s'en souvienne."
 FRA_reise_tertiary: "L'essor du tertiaire"
 FRA_reise_tertiary_desc: "L'économie occidentale d'aujourd'hui est une économie de services qui rassemble les divers acteurs de la production. La France doit jouer son rôle dans cette transition économique ; il n'y a pas d'autre voie."
 FRA_reduce_public_service: "Réduire le service public"
 FRA_reduce_public_service_desc: "En coupant dans les dépenses publiques, nous pourrons à nouveau réduire notre dette. Les gens détesteront, mais il faut choisir le moindre mal. Si le pays tombe à cause de la dette, la baisse des dépenses sociales sera le cadet de leurs soucis."
 FRA_strat_indus: "Financer nos industries stratégiques"
 FRA_strat_indus_desc: "Même si nos industries ne sont plus aussi compétitives qu'autrefois, certaines nous sont indispensables. L'industrie de défense en est une, car nous ne pouvons pas compter sur d'autres pays pour notre défense. La France a toujours produit ses propres armes. Il est donc de la plus haute importance que cela continue, surtout dans un monde où les tensions montent."
 FRA_arms_deal: "Accroître les exportations d'armes"
 FRA_arms_deal_desc: "Il est de notoriété publique que notre complexe militaro-industriel produit d'excellentes armes. Nous sommes ainsi l'un des premiers exportateurs d'armes depuis de nombreuses années. Ce commerce nous permet non seulement de projeter notre puissance, mais aussi de gagner beaucoup d'argent et d'influence. Ce ne peut donc être qu'une bonne chose."
 FRA_eu_mil: "Aider le renforcement militaire de l'UE"
 FRA_eu_mil_desc: "Si notre pays est relativement bien préparé au retour de la guerre en Europe, on ne peut pas en dire autant de tous nos partenaires européens. La majorité n'aurait aucune chance de tenir. Nous devrions les aider à développer leurs capacités, car leur sécurité est la nôtre."
 FRA_finance_student: "Meilleur étudiant en finance"
 FRA_finance_student_desc: "En appliquant la formule néolibérale à la perfection, notre économie n'a jamais été aussi étroitement intégrée aux dynamiques internationales. C'est une bonne chose : cela nous permettra de bénéficier des progrès des autres pays et d'investir partout dans le monde pour en récolter les fruits."
 FRA_right_left_money: "Le juste milieu"
 FRA_right_left_money_desc: "Trop longtemps, notre pays a été otage du clivage gauche-droite. Après toutes nos avancées en finance et en géopolitique, nous avons démontré la puissance de l'ordolibéralisme. Notre rôle est de permettre au marché de s'épanouir en France, et aux Français de bénéficier de la richesse ainsi générée."
 FRA_demograph_arms: "Promouvoir le réarmement démographique"
 FRA_demograph_arms_desc: "Une bonne campagne de natalité est un investissement de long terme dans l'avenir du pays."
 FRA_share_eu: "Partager notre puissance avec l'UE"
 FRA_share_eu_desc: "Nos ennemis doivent savoir que nous prenons très au sérieux la protection de l'indépendance des États membres de l'Union européenne. Si nécessaire, nous menacerons tout oppresseur de notre arsenal nucléaire."
 FRA_handle: "Gérer la situation"
 FRA_handle_desc: "Ils sont venus pour la taxe carburant et sont restés pour tout le reste. Les ronds-points sont occupés, les Champs-Élysées ont brûlé deux fois, et les tirs de LBD nous ont coûté des yeux et des titres à parts égales. Nous pouvons voter la loi anti-casseurs et les dégager par la force, ou ouvrir un grand débat et acheter la paix avec dix milliards d'euros que nous n'avons pas."
 FRA_startup_nation: "Nation des startups"
 FRA_startup_nation_desc: "Grâce à nos politiques audacieuses et à notre refus de céder face à ces Gaulois récalcitrants, nous avons atteint notre but. Nous avons transformé une société autrefois hostile à l'entrepreneuriat, la libérant des impôts et règlements qui la retenaient. Un avenir brillant d'innovation et de libéralisme s'ouvre. Voilà notre vision."
 FRA_Neo_gaulism: "Néo-gaullisme"
 FRA_Neo_gaulism_desc: "Le néo-gaullisme est un mouvement politique français qui a adapté les principes originels du général Charles de Gaulle. Il a souligné la souveraineté nationale, une présidence exécutive forte et l'indépendance de la politique étrangère pour s'adapter à l'ère moderne mondialisée."
 FRA_known: "Le parti inévitable"
 FRA_known_desc: "Depuis la fondation de la IIIe République et l'émergence d'un républicanisme stable, il y a toujours eu des conservateurs. Nous ne sommes que leur dernière incarnation. Depuis des décennies, nous sommes présents à chaque second tour. Rien n'indique que les prochaines élections seront différentes. Notre nouveau millénaire est plein d'incertitudes : nous devons être la voix de la stabilité et du bon sens face aux extrémistes."
 FRA_oppose_immigration: "S'opposer à l'immigration"
 FRA_oppose_immigration_desc: "Les immigrés ont déjà prouvé à quel point ils peuvent être dangereux, surtout ceux venus de régions en guerre sans fin. Il faut agir pour les empêcher d'arriver."
 FRA_continue_liberal: "Poursuivre les politiques libérales"
 FRA_continue_liberal_desc: "Nous continuerons d'appliquer notre programme de libéralisation économique, car c'est ainsi que l'économie fonctionne le mieux."
 FRA_patriotism: "Patriotisme"
 FRA_patriotism_desc: "Les Français devraient être fiers de leur nationalité et de l'histoire qui va avec. Ils doivent donc s'habituer à demander moins à l'État. Nous ne pouvons plus nous permettre la générosité d'autrefois. Ils doivent apprendre à se ranger du côté de l'État et cesser d'exiger sans cesse plus d'argent public."
 FRA_turn_west: "Tournez vers l'ouest"
 FRA_turn_west_desc: "Nous devrions améliorer nos relations avec nos amis d'outre-Atlantique en Amérique. Leurs politiciens peuvent changer, mais il faut s'assurer qu'aucun d'eux ne tournera jamais le dos à la France."
 FRA_third_voice: "La troisième voix de la France"
 FRA_third_voice_desc: "Dans un monde encore divisé entre l'OTAN et les vestiges de l'URSS, la France doit tracer sa propre voie, comme elle l'a toujours fait. Nous ne pouvons pas compter sur un allié lointain qui ne viendrait pas à notre défense ; nous devons donc forger notre destin aux côtés de ceux qui rejettent l'oppression de l'Est comme de l'Ouest."
 FRA_austerity: "Recourir à l'austérité"
 FRA_austerity_desc: "Le déficit est structurel et les agences de notation tournent autour. Nous coupons là où c'est possible : un fonctionnaire remplacé pour deux qui partent, ministères fusionnés, construction reportée. Les syndicats appelleront cela par son nom et feront descendre un million de personnes dans la rue pour l'âge de la retraite, et la gauche passera une décennie à faire campagne contre cette seule décision."
 FRA_question_ref: "Accélérer l’intégration européenne"
 FRA_question_ref_desc: "Bien que la France soit l'un des piliers fondateurs de l'Union européenne, son peuple est désormais parmi les plus sceptiques à son égard. Les Français se sont opposés à plusieurs reprises à l'introduction de nouveaux traités. Nous devrions cesser de leur demander leur avis sur chaque sujet, car cela ralentit considérablement l'intégration européenne. Beaucoup le prendront mal et s'opposeront encore plus à l'UE, mais au moins nous cesserons d'être ceux qui la retiennent."
 FRA_nato_integration: "Intégration à l'OTAN"
 FRA_nato_integration_desc: "Encore un pas pour améliorer notre sécurité sur ce continent. Sans l'OTAN, qui sait dans quel état serait l'Europe aujourd'hui."
 FRA_national_indep: "Indépendance nationale"
 FRA_national_indep_desc: "En adoptant une position entre Est et Ouest, la France peut défendre ses propres intérêts et n'a plus à tenir compte de l'avis d'un bureaucrate à Washington."
 FRA_end_proximity_police: "Mettre fin à la police de proximité"
 FRA_end_proximity_police_desc: "La police ne devrait pas se mêler aux gens qu'elle est censée surveiller. Une police d'intervention rapide serait plus rentable."
 FRA_reform_wealth: "Réformer l'État-providence"
 FRA_reform_wealth_desc: "Trop longtemps, la France a été un État-providence ; il est temps que les Français se débrouillent sans toujours compter sur l'argent public."
 FRA_looming_crisis: "La crise qui menace"
 FRA_looming_crisis_desc: "En janvier, la Société Générale a découvert qu'un seul trader lui avait fait perdre près de cinq milliards d'euros sans que personne ne s'en aperçoive. C'était l'avertissement. Le marché hypothécaire américain est pire, nos banques y sont exposées, et Dexia est déjà en difficulté. Nous pouvons bâtir l'appareil de supervision maintenant et ralentir notre propre économie, ou faire confiance au cycle et espérer."
 FRA_defend_interest: "La défense des intérêts de la France"
 FRA_defend_interest_desc: "Être indépendant signifie nous protéger de l'influence étrangère, dans notre pays et partout où nous avons des intérêts. Il faut agir en ce sens pour que la France reste une grande nation."
 FRA_lower_expanse: "Arrêtez de financer des entreprises improductives"
 FRA_lower_expanse_desc: "Subventionner l'activité économique a un coût de plus en plus lourd. Nous devrions examiner de près nos dépenses et ne subventionner que les industries efficaces et compétitives."
 FRA_oppose_lgbt: "Lutter contre le wokisme"
 FRA_oppose_lgbt_desc: "Des courants de pensée de plus en plus hostiles aux normes traditionnelles s'infiltrent dans notre société. Ces normes existent pour une raison et ont toujours prévalu. Il faut empêcher cette infiltration."
 FRA_return_rurality: "Embrasser la ruralité"
 FRA_return_rurality_desc: "Les grandes villes deviennent de plus en plus des foyers de décadence et de criminalité. Il faut encourager nos citoyens à s'en éloigner vers des régions certes moins prospères, mais plus proches du bon sens."
 FRA_end_assisted: "En finir avec la culture de l'assistanat"
 FRA_end_assisted_desc: "Une trop grande part de notre population vit d'allocations inconditionnelles accordées sans aucun travail. Cette situation est inacceptable et pèse sur nos finances. Il faut mettre fin à ces prestations : cela mettra les gens au travail."
 FRA_hostile_bear: "Hostilité à l'ours"
 FRA_hostile_bear_desc: "La Russie redevient une menace pour les intérêts et la sécurité européens. Les pays de première ligne doivent commencer à se préparer à se défendre en cas d'action hostile à l'est."
 FRA_wake_up: "Réveillez la France"
 FRA_wake_up_desc: "Libérés de la décadence et des tentations de l'inaction, les Français peuvent se remettre au travail."
 FRA_eternal_france: "La France éternelle"
 FRA_eternal_france_desc: "Nous avons rendu le pays plus fort que jamais. Nous avons accru notre protection contre les menaces étrangères, réduit les problèmes internes et diminué nos problèmes de dette. Nous avons assuré un avenir au pays. La France a toujours été là et le sera toujours."
 FRA_enought_soc: "Assez de socialisme"
 FRA_enought_soc_desc: "En tant que parti conservateur, les progressistes et le Parti socialiste sont nos principaux adversaires. Ils prônent une Europe libérale, précisément ce que les gens ne veulent plus, et nous travaillerons à nous en libérer. Nous devons montrer au peuple que nous sommes, et serons toujours, l'instrument par lequel s'exprime leur désir de stabilité et de protection. Nous sommes contre l'Union européenne libérale et le progressisme."
 FRA_sovereignism: "Questionner notre souveraineté"
 FRA_sovereignism_desc: "Trop longtemps, le peuple français a été méprisé ; personne dans notre pays ne voulait que l'Union européenne prenne de telles proportions. Traités ou élargissement, le peuple était sceptique à chaque fois, et à chaque fois ignoré. Il est temps qu'un parti soulève à nouveau la question de la souveraineté de la France."
 FRA_sacrifice: "Sacrifice nécessaire"
 FRA_sacrifice_desc: "Nous allons vers des temps difficiles, et le chemin qui s'ouvre exigera discipline et bonne volonté de la part des Français. Ils doivent réapprendre que c'est à eux de faire des sacrifices pour la France, et non l'inverse."
 FRA_elder_view: "Le regard de nos aînés"
 FRA_elder_view_desc: "Le Conseil national de la Résistance a fait un travail formidable pour reconstruire le pays sur les ruines de la Seconde Guerre mondiale, et ce faisant il est devenu un vassal des États-Unis. Mais depuis des décennies, leur œuvre a été progressivement minée par des politiciens, chacun plus libéral que le précédent. Il faut revenir à nos racines, suivre l'exemple du Général, investir dans l'industrie et reconstruire un pays ravagé par des décennies d'intégration européenne et de désindustrialisation."
 FRA_neccesity_leaving: "La nécessité de partir"
 FRA_neccesity_leaving_desc: "Notre chemin vers la sortie de l'Union européenne ne fait que commencer. Il faut faire comprendre au peuple que nous devons quitter cette Europe avant qu'il ne soit trop tard."
 FRA_fight_renouncement: "Combattre les partisans du renoncement"
 FRA_fight_renouncement_desc: "Le Général ne faisait pas confiance aux autres puissances européennes pour avoir la volonté de créer une Europe indépendante des États-Unis. Il avait raison : quelques décennies après sa mort, nos partenaires se soucient davantage de s'incliner devant les États-Unis et d'acheter leur matériel que de travailler à l'indépendance de l'Europe. Il faut dénoncer cette spirale, déjà une raison de quitter cette Europe vassale des États-Unis."
 FRA_back_gaulism: "Gaullisme stratégique"
 FRA_back_gaulism_desc: "La France doit avoir une politique étrangère indépendante de la volonté de Washington. Nous ne devons laisser personne s'immiscer dans notre politique, et certainement pas les États-Unis, qui ont toujours cherché à nous forcer à nous soumettre."
 FRA_social_gaulism: "Gaullisme social"
 FRA_social_gaulism_desc: "Face à la fin de la mondialisation heureuse et à l'attrait de l'extrémisme, il faut ramener les Français sur le chemin de la raison. Le gaullisme social rejette le capitalisme comme le communisme. Il implique l'intervention de l'État pour garantir l'indépendance et la sécurité de l'emploi. Avec cette stabilité, le peuple n'a pas besoin de tout cet assistanat."
 FRA_return_nation: "Retour à la nation"
 FRA_return_nation_desc: "Nous devons encourager les entreprises françaises opérant à l'étranger à revenir dans leur pays d'origine, par tous les moyens nécessaires."
 FRA_anti_eu: "Campagne contre l'UE"
 FRA_anti_eu_desc: "Maintenant que le peuple commence à réaliser que l'Union européenne ne sert plus les intérêts de ses fondateurs, dont elle cherche à éroder l'identité, nous pouvons intensifier notre campagne contre elle. Il faut faire comprendre au peuple que la plupart de ses problèmes viennent de là."
 FRA_anti_usa: "Hostilité envers les États-Unis"
 FRA_anti_usa_desc: "Les États-Unis voient d'un mauvais œil le retour du gaullisme au pouvoir. Ils ont raison de s'inquiéter : notre arrivée au pouvoir leur fera vite comprendre que nous ne sommes plus leurs alliés. Après tout, on sait bien que les États-Unis n'ont pas d'alliés ; ils ont surtout des intérêts."
 FRA_RPF_death: "Rétablir la peine de mort"
 FRA_RPF_death_desc: "La peine de mort a été abolie il y a des décennies, contre le vœu de la plupart des Français. Depuis, les délinquants de tout poil se sont enhardis, convaincus que l'État ne les punira jamais vraiment. Une nation souveraine doit pouvoir faire appliquer pleinement ses lois. Nous la rétablirons."
 FRA_destroy_liberalism: "Détruire le libéralisme économique"
 FRA_destroy_liberalism_desc: "Trop longtemps, notre politique économique a été dominée par un ultralibéralisme abhorré. Nos citoyens ont vu leurs emplois et notre force industrielle disparaître les uns après les autres. Déjà de son vivant, le Général avertissait que le capitalisme, du point de vue humain, était une mauvaise chose. Il faut revenir à l'intervention de l'État. Il faut remettre de l'ordre dans nos finances publiques et dans ce qui reste de notre économie."
 FRA_campaign_frexit: "Campagne pour le Frexit"
 FRA_campaign_frexit_desc: "Les Français ont enfin compris que l'Union européenne est une mauvaise chose ; il ne reste plus qu'à leur donner les moyens d'exprimer leur colère. Un bulletin dans l'urne suffira à mettre fin au démantèlement de la France."
 FRA_rebalance_foreign_policy: "Rééquilibrer notre politique étrangère"
 FRA_rebalance_foreign_policy_desc: "Bien que nous ayons clairement l'intention de rompre avec les États-Unis, notre classe politique reste infiltrée par leur politique, leur mode de vie et leurs entreprises. Il faut envoyer un message fort à ceux qui douteraient de la sincérité de cette rupture. Nous rétablirons le dialogue avec des puissances qui se sont toujours opposées à l'hégémonie américaine."
 FRA_leave_nato: "Rompre avec l'OTAN"
 FRA_leave_nato_desc: "Pour sauvegarder notre indépendance, il faut nous débarrasser d'une alliance dont nous n'avons jamais eu besoin et qui nous a apporté très peu. Nous sommes capables de défendre nos intérêts seuls."
 FRA_frexit_ref: "Référendum sur le Brexit"
 FRA_frexit_ref_desc: "L'heure est venue de quitter l'Union européenne une bonne fois pour toutes. Notre peuple a été suffisamment préparé pour la rejeter définitivement."
 FRA_strategic_autonomy: "Assurer l'autonomie stratégique"
 FRA_strategic_autonomy_desc: "Nous avons réussi à restaurer l'indépendance de la France ; nous sommes libres d'agir comme bon nous semble dans ce monde. La France est forte et libre, et nous sommes prêts à la défendre."
 FRA_strong_people: "Le peuple fort"
 FRA_strong_people_desc: "Plus d'incitations à l'oisiveté ; un capitalisme sous contrôle de l'État. Nous avons renouvelé le contrat social avec notre peuple. Ils savent que nous les protégeons et qu'ils nous doivent obéissance et bonne volonté."
 FRA_recover: "Reconstruire l'économie"
 FRA_recover_desc: "Malgré tous nos efforts pour préparer la sortie de l'Union européenne, notre économie a tout de même souffert. Il faut la reconstruire sur des bases solides avant même de songer à nous venger de nos oppresseurs."
 FRA_our_own_sphere: "Notre propre sphère"
 FRA_our_own_sphere_desc: "Nous ne sommes pas les seuls à nous être débarrassés de l'impérialisme américain. Nous pouvons trouver des alliés pour forger une alliance fondée sur le respect mutuel entre puissances indépendantes."
 FRA_paid_reconnexion: "Blocus européen"
 FRA_paid_reconnexion_desc: "Maintenant que nous avons quitté l'Union européenne en toute sécurité et avec succès, nous pouvons songer à lui rendre la monnaie de sa pièce. L'Union européenne et ses réseaux ont besoin de transiter par notre pays. Voilà une formidable occasion de prendre notre revanche."
 FRA_certain_idea: "Une certaine idée de la France"
 FRA_certain_idea_desc: "En quelques années seulement, nous avons réussi à rendre à la France ce qu'elle doit être : une grande puissance fière et libre. Le Général serait fier que nous ayons restauré son héritage. Il avait raison : la France ne peut être qu'une grande puissance ; sinon, ce ne serait pas la France."
 FRA_salvage_mondialisation: "Sauver les victimes de la mondialisation"
 FRA_salvage_mondialisation_desc: "Notre peuple a beaucoup souffert de la mondialisation. C'est particulièrement vrai de la population active, qui a vu ses emplois disparaître, son pays se défaire et ses valeurs piétinées. Nous devons leur montrer que nous sommes le camp du changement, celui qui osera poser les bonnes questions et qui aura une solution très simple à ces problèmes."
 FRA_raise_tariff: "Augmenter le tarif"
 FRA_raise_tariff_desc: "Augmenter nos droits de douane nous permettra de mettre fin à la concurrence déloyale de l'étranger et aux Français d'acheter des produits fabriqués en France."
 FRA_dynamise_periph: "Revitaliser les périphéries"
 FRA_dynamise_periph_desc: "Les zones rurales et périurbaines ont toujours été négligées par les politiques d'aménagement. Elles sont sous-investies et abritent souvent une population précaire mais pleine de bonne volonté. Il faut aider cette population à accéder aux mêmes infrastructures que dans les grandes villes."
 FRA_focus_insecurity: "Priorité à l'insécurité"
 FRA_focus_insecurity_desc: "L'immigration a entraîné une hausse significative de l'insécurité dans notre pays. Nous devons démontrer à la population que nous prenons ce problème très au sérieux en augmentant les effectifs de police, en renforçant les contrôles et en réprimant la criminalité."
 FRA_eurosepticism: "Menacer l'Union européenne"
 FRA_eurosepticism_desc: "L'Union européenne a toujours tenté de faire taire des pays comme le nôtre, opposés à ses politiques ultra-mondialistes. Nous devons leur faire comprendre que les choses doivent changer et que nous pouvons ranimer le mouvement eurosceptique en France."
 FRA_sovergnism_policies: "Politiques souverainistes"
 FRA_sovergnism_policies_desc: "La France doit exercer un plus grand contrôle sur son économie, sa politique étrangère et, surtout, ses frontières. Sans cela, nos efforts pour redresser le pays seront vains. Nous devons affirmer notre détermination à gouverner notre propre pays."
 FRA_economical_patriotism: "Patriotisme économique"
 FRA_economical_patriotism_desc: "Nous devons presser les entreprises françaises parties à l'étranger de revenir en France. Si elles refusent, il y aura des conséquences pour leurs activités en France."
 FRA_social_populism: "Populisme social"
 FRA_social_populism_desc: "Il nous suffit de donner au peuple ce qu'il réclame et de frapper ceux qu'il hait pour sécuriser notre base électorale et rester au pouvoir."
 FRA_criticize_eu_migrant: "Critiquer la politique migratoire européenne"
 FRA_criticize_eu_migrant_desc: "L'Union européenne n'en fait pas assez pour endiguer le flux de migrants et force les États membres à les accueillir. Nous devons exercer une pression pour y mettre un terme."
 FRA_common_accord_eu: "Un accord avec l'UE"
 FRA_common_accord_eu_desc: "La Commission européenne a compris qu'elle ne pouvait pas nous ignorer. Il faut maintenant lui faire comprendre qu'en nous donnant ce que nous voulons, elle s'assurera notre soutien."
 FRA_reinforce_nuke: "Renforcer notre capacité nucléaire"
 FRA_reinforce_nuke_desc: "Le nucléaire a prouvé sa fiabilité. Pourquoi se tourner vers d'autres sources d'énergie alors que nous avons cette expertise ? Il faut étendre notre capacité nucléaire pour faire face en cas de crise."
 FRA_FN_death: "Rétablir la peine de mort"
 FRA_FN_death_desc: "La peine de mort a été abolie il y a des décennies, et la criminalité violente n'a fait que s'enhardir depuis. Nos citoyens méritent de se sentir à nouveau en sécurité dans leur propre pays. Nous la rétablirons, et les crimes les plus graves porteront à nouveau les conséquences les plus dures."
 FRA_reject_immigration: "Rejeter l'immigration"
 FRA_reject_immigration_desc: "Maintenant que nous contrôlons mieux nos frontières, nous pouvons appliquer notre politique de répression de l'immigration clandestine."
 FRA_pro_russian_fn: "Politiques pro-russes"
 FRA_pro_russian_fn_desc: "L'UE ne cessera pas d'être ultra-mondialiste. Il faut nous rapprocher de la Russie, qui a toujours su rester à distance des perversions de l'Occident. Ensemble, nous irons loin."
 FRA_oppose_lgbt_fn: "Mettre fin au réveil"
 FRA_oppose_lgbt_fn_desc: "Certaines personnes ne devraient pas être autorisées à entrer dans notre pays. Mettons fin à ces insanités et concentrons-nous sur le rétablissement de l'ordre fondé sur le seul bon modèle de la famille."
 FRA_end_right_soil: "En finir avec le droit du sol"
 FRA_end_right_soil_desc: "Naître en France ne devrait pas suffire à être français. Il faut mettre fin au principe du jus soli ; nous méritons de choisir qui peut être citoyen français."
 FRA_support_rus_claim: "Soutenir la revendication russe"
 FRA_support_rus_claim_desc: "La Russie a tout à fait le droit de se sentir menacée par l'expansion de l'OTAN. Nous devons démontrer notre volonté de l'aider à réparer les injustices qu'elle a subies."
 FRA_electoral_reform: "Réforme électorale"
 FRA_electoral_reform_desc: "Les élections en France sont de plus en plus contestées au nom du mode de scrutin et de la représentativité des partis. Nous pouvons mettre en œuvre ces réformes tout en veillant à ce qu'elles jouent en notre faveur pour rester au pouvoir."
 FRA_our_identity: "Notre identité"
 FRA_our_identity_desc: "Il est difficile d'être nationaliste au sein d'une entité telle que l'Europe. Nous avons abandonné l'idée de la quitter, il faut donc forger une identité nouvelle, adaptée à notre place dans l'Union européenne, sans viser à nous diluer parmi la main-d'œuvre étrangère."
 FRA_boreal_space: "Notre position vis-à-vis de la Russie"
 FRA_boreal_space_desc: "Nous avons démontré notre désir de travailler avec la Russie, et nos efforts n'ont pas passé inaperçus. Il est temps de décider ce que nous voulons d'elle ; il est temps de lui tendre la main."
 FRA_long_travel: "La France l’emporte"
 FRA_long_travel_desc: "Au fil de ces dernières années au pouvoir, nous avons montré aux Français qu'avec de la détermination, les problèmes d'un pays se règlent très facilement. Nous avons rendu la France plus grande et moins dépendante de nos voisins et des flux migratoires, que nous avons su endiguer."
 FRA_sound_fury: "Le bruit et la fureur"
 FRA_sound_fury_desc: "Les Français ne veulent plus d'apaisement ; les modérés les ont déçus et n'ont jamais apporté de vrai changement. Nous sommes le parti du changement ; il faut montrer aux Français que nous sommes déterminés à défier l'ordre établi."
 FRA_silent_france: "Mobiliser les abstentionnistes"
 FRA_silent_france_desc: "De nombreux citoyens ont perdu foi en notre République et ses institutions. Il faut les encourager à revenir aux urnes pour un vrai changement."
 FRA_end_privatisation: "Mettre fin à la privatisation"
 FRA_end_privatisation_desc: "De nombreuses entreprises ont continué à délocaliser leurs sites de production hors de France pour booster la rentabilité. Cela fait monter le chômage et nous fait perdre notre savoir-faire. Il faut arrêter cette hémorragie en reprenant le contrôle de ces entreprises si nécessaire."
 FRA_pro_lgbt_lfi: "Promouvoir l’action positive"
 FRA_pro_lgbt_lfi_desc: "Il faut mettre fin aux discriminations que subissent depuis trop longtemps ceux qui s'écartent de ce que l'on considère à tort comme la norme. Notre société doit apprendre à accepter toutes les différences."
 FRA_toward_6th_rep: "Vers une 6ème République"
 FRA_toward_6th_rep_desc: "Nous pouvons maintenant commencer la partie la plus importante du mandat que le peuple nous a confié. Nous avons promis le changement, et ils l'auront. L'heure est venue de façonner une nouvelle République qui convienne à tous."
 FRA_distance_nato_lfi: "Rejeter la politique du Bloc"
 FRA_distance_nato_lfi_desc: "L'OTAN nous lie aux guerres de Washington aussi sûrement qu'une alliance avec Moscou nous lierait aux siennes. Nous rejetons les deux blocs ; le non-alignement véritable est la seule politique étrangère digne d'une France indépendante."
 FRA_oppose_eu_treaty: "S'opposer au traité européen"
 FRA_oppose_eu_treaty_desc: "Des traités injustes ont été imposés à nos citoyens. Nous n'avons aucune obligation de les respecter. Pour changer cette Europe injuste, il faut commencer par contester son cadre législatif."
 FRA_guarante_employment: "Garantir l'emploi"
 FRA_guarante_employment_desc: "Notre pays regorge de talents qui ne peuvent pas s'accomplir faute d'emplois causés par la crise. Il faut garantir à chacun un emploi stable et décent ; cela devrait former la base de tout contrat social."
 FRA_state_power: "Le pouvoir de l'État"
 FRA_state_power_desc: "Les institutions de la Ve République sont trop centrées sur la fonction de président de la République. Nous devrions encourager le débat public pour que le peuple décide à quoi ressemblera notre nouvelle République."
 FRA_democracy: "Libertés individuelles"
 FRA_democracy_desc: "Les nombreuses crises qu'a connues notre pays ont soulevé des questions pratiques sur la sécurité de la population. La surveillance est nécessaire pour protéger nos citoyens, mais jusqu'où l'État peut-il aller ? Nous devrions laisser à nos citoyens le droit de s'exprimer."
 FRA_foreign_recognition_lfi: "Réinitialiser notre politique étrangère"
 FRA_foreign_recognition_lfi_desc: "Trop longtemps, notre pays a soutenu des dictatures et refusé de reconnaître l'existence d'États souverains. Il faut y mettre fin."
 FRA_oppose_eu_immigration_lfi: "Remettre en cause la position de l'UE sur l'immigration"
 FRA_oppose_eu_immigration_lfi_desc: "L'Union européenne devient de plus en plus indulgente envers les populistes d'extrême droite. Elle n'en fait pas assez pour aider nos voisins dans le besoin et ne les voit que comme une source de main-d'œuvre bon marché. Nous devons nous distancier de cette approche et proposer une politique plus humaine."
 FRA_economic_question: "L'orientation de l'économie"
 FRA_economic_question_desc: "Le budget national et sa gestion sont des questions importantes dont tout le reste dépend. Nos citoyens doivent aussi avoir leur mot à dire."
 FRA_ho_topic: "Déconstruire les particularités françaises"
 FRA_ho_topic_desc: "De nombreuses lois et coutumes inhérentes à la culture française ne facilitent pas l'intégration d'autres cultures. Nous devrions demander aux citoyens de débattre de l'intégration des minorités."
 FRA_balance_tax: "Fiscalité du solde"
 FRA_balance_tax_desc: "Il est inacceptable que la classe moyenne et les précaires soient saignés par les impôts tandis que les riches ne paient pas leur juste part. Il faut rétablir l'équilibre."
 FRA_climate_war_eco: "Le défi de notre millénaire"
 FRA_climate_war_eco_desc: "L'environnement et le climat se détériorent à un rythme rapide. Il faut protéger ce qui reste de notre biodiversité et préparer la société à des temps difficiles."
 FRA_dawn_6th_rep: "L'aube de la VIe République"
 FRA_dawn_6th_rep_desc: "Notre travail sur la VIe République est achevé. Quel qu'en soit le résultat, notre œuvre est faite. Nous avons probablement marqué l'histoire."
 FRA_creolisation: "Créolisation"
 FRA_creolisation_desc: "Les siècles d'échanges culturels qu'a connus notre pays ont façonné une culture nouvelle. Pourtant beaucoup la nient ; il faut faire comprendre à nos citoyens que l'avenir est dans le vivre-ensemble. Nous avons encore tant à apprendre du monde."
 FRA_work_less: "Travailler moins, travailler mieux"
 FRA_work_less_desc: "Nos prédécesseurs étaient déterminés à faire travailler les Français de plus en plus longtemps dans des conditions de plus en plus mauvaises. Il faut inverser cette tendance et aider nos citoyens à mieux aimer leur travail. Ils seront alors d'autant plus créatifs et enthousiastes."
 FRA_reform_police: "Réformer la police française"
 FRA_reform_police_desc: "Trop longtemps, la police a servi d'outil de répression injuste contre nos citoyens. Il faut mettre en œuvre les réformes nécessaires pour alléger la pression sur eux, tout en assurant la sécurité de tous."
 FRA_post_empire: "Décoloniser notre politique internationale"
 FRA_post_empire_desc: "Notre passé colonial a causé beaucoup de mal à nos anciennes colonies. Beaucoup peinent encore à s'en remettre. Nous devons soutenir leurs efforts de reconstruction et cesser de chercher à les dominer."
 FRA_push_social_green_eu: "Répandre la défiance en Europe"
 FRA_push_social_green_eu_desc: "Nous avons beaucoup accompli en France, mais il faut aussi encourager nos partenaires européens à suivre le même chemin. Nous pouvons rallier leurs peuples pour faire pression sur leurs gouvernements afin de ne pas être les seuls à promouvoir le progressisme en Europe."
 FRA_social_green_fair_rep: "L'Insoumission"
 FRA_social_green_fair_rep_desc: "En quelques années seulement, nous avons tant accompli. Nous avons éloigné la France du libéralisme économique et de la précarité, et créé une France plus humaniste. Mais nous ne cesserons jamais de défier l'ordre établi, chez nous comme dans le reste du monde."
 FRA_no_time: "Nous n'avons plus le temps"
 FRA_no_time_desc: "Les scientifiques alertent depuis des décennies sur les effets dévastateurs du changement climatique. Ce qu'ils prédisaient se produit : des événements météorologiques de plus en plus extrêmes. Les gens doivent se réveiller s'ils veulent que la génération suivante ait une chance de vivre."
 FRA_strong_eu: "La force de l'UE"
 FRA_strong_eu_desc: "La France ne peut pas forcer le monde à prendre le changement climatique au sérieux. L'Union européenne, en revanche, peut servir de modèle au reste du monde."
 FRA_ecology_available: "Rendre l’écologie accessible"
 FRA_ecology_available_desc: "Trop longtemps, l'écologie a été considérée comme un privilège réservé aux nantis. Il faut continuer à la promouvoir comme un moyen d'économiser et de prévenir les tragédies pour tous."
 FRA_right_vote: "Élargir le droit de vote"
 FRA_right_vote_desc: "Le souci de l'environnement et de son avenir ne devrait pas attendre dix-huit ans. Nous devrions étendre le droit de vote à une part plus large de la population."
 FRA_question_growth: "Questionner la croissance économique"
 FRA_question_growth_desc: "Pendant des décennies, on a fait croire que le meilleur moyen d'aider l'environnement était le développement durable. Mais pourquoi toujours développer et croître ? La planète et ses ressources ont leurs limites. Nous devrions plutôt aller vers un ralentissement de la croissance."
 FRA_cooperate_eu: "Coopérer avec les partenaires de l'UE"
 FRA_cooperate_eu_desc: "Tous nos partenaires européens n'ont pas forcément les mêmes ressources ni le même engagement à transformer leurs économies pour affronter le changement climatique. Nous pouvons aider nos partenaires clés en investissant dans les infrastructures vertes chez eux."
 FRA_push_eco_eu: "Promouvoir un avenir vert"
 FRA_push_eco_eu_desc: "Nos partenaires européens n'en font pas autant que nous contre le changement climatique. Nous pouvons encourager leurs populations à agir en poussant leurs militants environnementaux à suivre l'exemple de la France."
 FRA_question_agriculture: "Une agriculture durable"
 FRA_question_agriculture_desc: "L'agriculture en France s'est tournée vers la production de masse pour les besoins du siècle dernier. Sur le plan environnemental, elle est plus responsable que bien d'autres, mais il reste du chemin. Outre les normes européennes, il faut encourager les agriculteurs à changer de méthodes au profit d'une production responsable et de qualité. Nous veillerons à ce que leurs produits soient mis en valeur et que cela leur soit rentable."
 FRA_cooperation_no_compet: "Coopération, pas concurrence"
 FRA_cooperation_no_compet_desc: "Le modèle de réussite sociale dans notre pays et dans le monde repose sur le succès individuel et l'étalage de sa richesse. Ce comportement nuit à la planète en encourageant la surconsommation et une concurrence toxique entre citoyens. Pour réduire l'impact de nos sociétés, il faut remettre en cause ces modèles sociaux."
 FRA_nuke_choice: "Diversifier notre mix énergétique"
 FRA_nuke_choice_desc: "Pendant des décennies, l'énergie en France a été produite par des dizaines de réacteurs nucléaires. Cette technologie peut être fiable et relativement sûre à court terme, mais elle produit des déchets dont nous ne savons pas nous débarrasser. Ce n'est donc pas la source idéale pour un avenir durable. Nous devrions diversifier l'approvisionnement en investissant davantage dans les renouvelables."
 FRA_green_eu: "Vers une UE plus verte"
 FRA_green_eu_desc: "Notre succès, chez nous et à l'étranger, contre le changement climatique sert de modèle à d'autres pays de l'Union européenne. Nous pouvons en être fiers."
 FRA_eco_life: "Mode de vie écologique"
 FRA_eco_life_desc: "Adopter des méthodes de production plus durables ne suffira pas à lui seul. Il faut encourager nos citoyens à consommer moins. Cela passe par le frein à la publicité omniprésente et la promotion de la modération. Nous n'avons pas besoin de tout cela ; nous pouvons être heureux avec moins."
 FRA_upgrade_transport: "Moderniser notre réseau de transport"
 FRA_upgrade_transport_desc: "Notre réseau de transport peut être efficace, mais il est très inégal et force les habitants des périphéries à voyager par des moyens plus chers et plus polluants. Il faut rendre une alternative accessible dans toutes les régions : améliorer les liaisons vers les périphéries plutôt que de continuer à développer un réseau toujours plus rapide qui ne relie que quelques villes européennes."
 FRA_dynamise_research: "Dynamiser la recherche"
 FRA_dynamise_research_desc: "Il faut continuer à développer la recherche ; nous ne cesserons jamais de trouver des moyens de faire plus avec moins et de développer les énergies renouvelables."
 FRA_help_transi: "Accompagner une transition européenne"
 FRA_help_transi_desc: "Nos partenaires européens commencent à réaliser que le changement climatique est un enjeu sérieux qui les touchera de plus en plus. Certains n'ont pourtant pas encore le niveau de développement requis pour investir dans ce secteur. Nous pouvons les y aider en créant un fonds commun dédié à la transition vers une économie bas carbone."
 FRA_end_fossile: "Mettre fin aux combustibles fossiles"
 FRA_end_fossile_desc: "Maintenant que l'importance de la transition verte est plus largement reconnue au sein de l'Union européenne, nous pouvons intensifier nos efforts. Nous pouvons proposer à nos partenaires d'aller vers la sortie des combustibles fossiles."
 FRA_opti_indus: "Optimiser nos industries"
 FRA_opti_indus_desc: "Il faut faire comprendre aux dirigeants des grandes entreprises que de vraies mesures environnementales seraient dans leur intérêt. Eux aussi pourraient faire plus en utilisant moins de ressources. Il faut toutefois veiller à ce que cela ne les encourage pas à produire encore davantage."
 FRA_promote_local: "Promouvoir la consommation locale"
 FRA_promote_local_desc: "Maintenant que nous avons une industrie plus responsable, il faut que nos citoyens puissent réellement s'offrir ses produits. Or les forces du marché favorisent la production à bas coût. Il faut donc que les produits de nos propres industries soient plus disponibles que ceux de l'autre bout du monde. Cela exigera de plier les règles du libre-échange. Mais nous devrions y arriver."
 FRA_subsidies_green: "Subventionner les industries vertes"
 FRA_subsidies_green_desc: "Encourager les entreprises à changer pour l'écologie ne suffira pas à convaincre tout le monde. Il faut fournir les ressources nécessaires et offrir des subventions selon l'engagement envers la planète et l'efficacité. Cette fois, il n'y aura pas de greenwashing."
 FRA_pressure_supply: "Chaînes d'approvisionnement sous pression"
 FRA_pressure_supply_desc: "C'est un fait : notre pays ne peut pas produire toutes les matières premières dont il a besoin. L'Union européenne importe énormément de ressources de pays aux normes environnementales laxistes. Il est inacceptable d'importer des ressources qui ne répondent pas à nos critères de production. Sinon, à quoi servent les réglementations ? Il faut nous unir à d'autres puissances européennes pour faire pression sur ces pays exportateurs."
 FRA_reduce_extraction: "Réduire l'extraction de ressources"
 FRA_reduce_extraction_desc: "L'extraction de minerais et de pétrole est un processus polluant qui dépasse souvent la capacité de la planète à les régénérer. Même si nous ne siégeons pas sur un champ pétrolier, nous devons donner l'exemple au monde en introduisant des réglementations plus strictes sur l'extraction des minerais et des combustibles."
 FRA_power_rail: "Prolonger EU-Rail"
 FRA_power_rail_desc: "L'Union européenne a déjà un vaste réseau ferroviaire, mais nous pouvons faire encore mieux. Trop de fret circule encore par camion ; il faut le réduire."
 FRA_altermondialism: "Promouvoir l’Altermondialisme"
 FRA_altermondialism_desc: "Que la mondialisation ait cessé de bénéficier au public n'étonne personne. Mais il faut éloigner le public du mouvement antimondialisation. Ces tendances sont dangereuses car elles opposent la mondialisation à une solution nationaliste souvent agressive. Il faut leur montrer que l'ennemi principal est le capitalisme."
 FRA_unite_struggle: "Convergence des luttes"
 FRA_unite_struggle_desc: "Il faut unir tous ceux qui sont opprimés, que ce soit pour leur genre, leur religion, leur couleur de peau ou toute autre caractéristique. Tous sont victimes du capitalisme et de ses conséquences sociales. Il faut leur montrer que tous leurs problèmes ont une cause et une solution."
 FRA_retake_past: "Reconquérir les travailleurs"
 FRA_retake_past_desc: "Après l'effondrement de l'URSS et la fin de la « mondialisation heureuse », une grande part de notre ancien électorat ouvrier s'est tournée vers les populistes d'extrême droite ou, pour la plupart, a cessé de voter. Aujourd'hui nous avons gagné les élections, mais pour durer il faut reconstruire notre base ouvrière, l'ADN même de notre parti. Pour cela, il faut prendre au sérieux leurs revendications, en commençant par ramener les emplois que nos prédécesseurs libéraux ont envoyés en Chine."
 FRA_turn_reform: "La réforme plutôt que la révolution"
 FRA_turn_reform_desc: "Maintenant que nous sommes de retour à la tête de ces institutions, nous n'avons plus à envisager d'agir pour défier l'État, car nous en faisons partie. Nous pourrons réformer la société de l'intérieur, en mettant de côté les idéaux révolutionnaires."
 FRA_leave_nato_PCF: "Rompre avec l'impérialisme américain"
 FRA_leave_nato_PCF_desc: "L'OTAN est un instrument de l'impérialisme américain et le véhicule de sa domination sur l'Europe. Il faut rompre avec elle et nous tenir aux côtés de tous les peuples qui résistent à l'hégémonie de Washington."
 FRA_renogociate_treaty: "Renégocier le traité européen"
 FRA_renogociate_treaty_desc: "Notre peuple a été forcé d'accepter des traités européens auxquels il s'était pourtant opposé. Pour mener notre programme, il faut amender le cadre législatif que nous impose l'Union européenne. Il y aura sans doute un bras de fer avec les institutions européennes et des sanctions, mais nous n'avons pas d'autre choix si nous voulons vraiment agir dans l'intérêt des Français."
 FRA_undo_lib_PCF: "Fermer la parenthèse libérale"
 FRA_undo_lib_PCF_desc: "Depuis le mandat du président Mitterrand, les Français ont subi des politiques libérales de gauche comme de droite. Il est temps d'y mettre fin et de montrer que nous sommes différents. Que nous sommes déterminés à combattre le capitalisme, quitte à entrer en conflit avec l'OMC ou l'Union européenne."
 FRA_protect_indus_pcf: "Protéger notre industrie"
 FRA_protect_indus_pcf_desc: "Il ne suffit pas d'investir dans les industries en France ; il faut les empêcher de se délocaliser là où la main-d'œuvre est moins chère et les réglementations plus faibles. C'est une question de souveraineté sur nos moyens de production et d'emplois et de conditions de vie décents pour nos travailleurs."
 FRA_left_front: "Élargir la coalition"
 FRA_left_front_desc: "Notre gouvernement est en place mais peu stable ; nous manquons d'alliés. Peut-être faut-il en chercher parmi les autres partis de gauche radicale. Ils n'ont pas accepté de rejoindre notre gouvernement, mais nous pourrions les en convaincre. Nous pourrions offrir quelques postes ministériels en échange de leur soutien."
 FRA_deal_devil_pcf: "Un accord avec les socialistes"
 FRA_deal_devil_pcf_desc: "Les autres partis de gauche radicale ne suffiront pas à assurer la stabilité que nous espérons. Peut-être pourrions-nous trouver un terrain d'entente avec le Parti socialiste. Après tout, quitter l'Europe n'a jamais fait partie de nos plans. Nous pouvons sûrement les ancrer dans notre coalition."
 FRA_tie_moscow: "Se lier à Moscou"
 FRA_tie_moscow_desc: "Tout au long de la guerre froide et même après, notre parti a toujours pris le parti de Moscou. L'ère de l'URSS est révolue, mais il semblerait que les autorités russes actuelles soient favorables aux idéaux communistes. Depuis notre départ, nous sommes menacés par nos anciens alliés. Un allié russe serait un rêve ; nous pourrions établir une coopération économique."
 FRA_eu_communism_PCF: "Promouvoir l’eurocommunisme"
 FRA_eu_communism_PCF_desc: "L'URSS n'est plus qu'un lointain souvenir, et aujourd'hui il faut nous en passer dans un monde où la Russie, notre ancien modèle, vacille entre oligarchie et ultranationalisme. Le communisme et l'Union européenne ne sont pas incompatibles ; d'autres pays européens n'y sont pas hostiles. Nous pouvons rester en Europe et faire de notre mieux pour l'éloigner du capitalisme et du fascisme."
 FRA_retake_sovereign: "Reconquérir notre souveraineté"
 FRA_retake_sovereign_desc: "Maintenant que nous avons repris le contrôle de notre appareil productif, nous avons les moyens d'aller plus loin. Il faut nous débarrasser de l'influence étrangère maintenant que nous pouvons agir de façon indépendante."
 FRA_empower_union_PCF: "Promouvoir les syndicats"
 FRA_empower_union_PCF_desc: "Malgré leur ancienne puissance, les syndicats ne pèsent plus grand-chose. Les autorités les ont volontairement affaiblis en divisant la classe ouvrière et en sapant la sécurité de l'emploi. Or une force capable de tenir tête au patronat est essentielle. Nous ne pouvons pas être partout ; la classe ouvrière doit reprendre le contrôle de son avenir. Il faut les aider à retrouver leur légitimité aux yeux des travailleurs."
 FRA_green_communism: "Tendre la main aux Verts"
 FRA_green_communism_desc: "L'humanité n'est pas la seule victime du capitalisme ; notre planète est aussi en danger à cause de la conduite imprudente de l'humanité. Nous pouvons trouver un terrain d'entente avec les Verts ; ils peuvent nous aider à concevoir notre programme écologique, dont nous aurons aussi besoin."
 FRA_no_russian_claim: "La menace russe"
 FRA_no_russian_claim_desc: "Il est fort probable que, tôt ou tard, l'Union européenne se retrouve en conflit avec la Russie. Comme la Russie visera probablement les territoires ukrainiens et baltes, il faut commencer par tendre la main aux Ukrainiens pour leur offrir notre aide."
 FRA_green_turn: "Communisme vert"
 FRA_green_turn_desc: "En collaboration avec nos alliés verts, nous avons élaboré un programme environnemental qui préparera la France aux défis du changement climatique. Cela exigera beaucoup d'efforts pour reconstruire nos moyens de production tout en limitant leur empreinte carbone. Mais il le faut : la classe ouvrière aussi a des enfants qui doivent pouvoir grandir dans un monde vivable."
 FRA_favor_lgbt: "Mettre fin à la discrimination"
 FRA_favor_lgbt_desc: "Maintenant que nous avons assuré les moyens de subsistence de base de notre population en lui donnant des emplois et un avenir, il faut aussi s'attaquer aux discriminations au sein des classes sociales. Il faut rappeler à notre peuple que toute discrimination, quels qu'en soient les motifs, est inacceptable. Notre société doit apprendre à accepter toutes les différences."
 FRA_dna_restored: "ADN restauré"
 FRA_dna_restored_desc: "La coalition assurée, nous pouvons nous concentrer sur le retour au premier plan de la classe ouvrière. En introduisant d'importantes lois de protection de l'emploi, nous devrions reconquérir notre base électorale. Cela ne plaira pas au monde des affaires, mais ce n'a jamais été notre but."
 FRA_condemn_rus: "Protéger l’Europe de l’Est"
 FRA_condemn_rus_desc: "L'agression russe pourrait ne pas s'arrêter à l'Ukraine. Pour protéger notre Europe naissante, il faut s'assurer que les pays d'Europe de l'Est et du Nord pourront résister à une éventuelle invasion russe."
 FRA_by_ourself: "Triomphe du réformisme"
 FRA_by_ourself_desc: "En bâtissant une coalition forte, nous avons posé les bases d'une France qui reste une nation de gauche. Nous avons restauré la confiance de l'électorat dans la gauche et ses institutions. Sans rayer le passé, tant que nous serons là, nous ne cesserons jamais de combattre le capitalisme et le fascisme, en Europe et dans le monde."
 FRA_friend_of_past_pcf: "Vers un nouveau Komintern"
 FRA_friend_of_past_pcf_desc: "Le gouvernement communiste russe semble lui aussi suffisamment consolidé. Nous pourrions leur proposer d'élargir notre coopération. Il est temps de rendre au communisme sa gloire d'antan. Les capitalistes et les fascistes doivent réapprendre à nous craindre."
 FRA_struggle_end: "La lutte ne fait que commencer"
 FRA_struggle_end_desc: "Au fil de ces quelques années au pouvoir, nous avons remis le communisme sur la carte politique. Nous avons renoué avec notre électorat et assuré un avenir aux générations à venir. Nous sommes pourtant loin d'avoir fini. Il y aura toujours d'autres défis. Mais nous avons au moins fait en sorte que la gauche ne soit plus le cheval de Troie du néolibéralisme."
 FRA_new_18th_brumaire: "Un nouveau 18 brumaire"
 FRA_new_18th_brumaire_desc: "Nous, bonapartistes, avons conquis les plus hautes charges de la République. L'opposition républicaine a été réduite au silence, et nous seuls sommes capables de diriger ce pays. Nos ennemis sont légion, mais rien ne s'interposera entre la France et son destin."
 FRA_revolution_bonapart: "L'héritage révolutionnaire"
 FRA_revolution_bonapart_desc: "Napoléon Ier et l'Empire français sont les héritiers directs de la Révolution française. Comme le peuple français est profondément attaché à ces valeurs, il faut leur montrer que notre Empire n'est pas une restauration. Notre Empire est le héraut d'une nouvelle révolution."
 FRA_despotism: "Le despotisme plutôt que le désordre"
 FRA_despotism_desc: "Les troubles de ces derniers mois ont causé une vive inquiétude parmi notre peuple et sur les marchés financiers. Il faut les rassurer : tant que nous serons au pouvoir, aucun désordre ne sera toléré."
 FRA_napoleon_constitution: "La Constitution napoléonienne"
 FRA_napoleon_constitution_desc: "Les institutions de l'ancienne République ne sont plus adaptées à l'époque ni à notre autorité. Il faut les refondre pour créer un État plus fort que jamais."
 FRA_reform_military_napoleon: "La nouvelle Grande Armée"
 FRA_reform_military_napoleon_desc: "Nos forces armées sont plus que suffisantes pour un pays comme le nôtre. Mais elles ne sont pas capables de soutenir un conflit prolongé contre plusieurs puissances étrangères. Il faut tout reprendre à zéro et bâtir une armée que personne ne pourra vaincre."
 FRA_question_eu: "L'Europe ou l'Empire"
 FRA_question_eu_desc: "Notre pays, membre fondateur de l'Union européenne, y est profondément intégré, et s'en détacher ne serait pas aisé. Sauf que nous entendons, en fait, combattre d'autres puissances européennes. Faut-il rejoindre les institutions de l'UE, comme le nouveau gouvernement français, ou la quitter pour de bon ? Dans tous les cas, nous serons forcés de les combattre."
 FRA_centralised_admin: "Centralisme administratif"
 FRA_centralised_admin_desc: "La décentralisation fut une erreur pour notre pays. Ce qu'il nous faut, c'est une chaîne de commandement claire et une structure organisationnelle verticale."
 FRA_blame_ennemy: "Rhétorique agressive"
 FRA_blame_ennemy_desc: "Notre Empire naissant est entouré de ses futurs ennemis. Tôt ou tard nous serons forcés de les combattre, mais notre société n'est pas prête à faire la guerre à nos anciens alliés. Nous les avons égarés en leur parlant d'un avenir pacifique ; tôt ou tard ils seront ramenés à la réalité. Pour cela, nous pouvons les préparer en sapant leur confiance en nos anciens partenaires et en leur faisant comprendre que nous sommes seuls contre tous."
 FRA_proclaim_empire: "Une proclamation impériale"
 FRA_proclaim_empire_desc: "En peu de temps, nous avons réussi à consolider notre pouvoir et à créer les conditions du retour de la France sur la scène internationale. Il est temps de jeter les masques. Nous proclamerons le retour de l'Empire français après un défilé démontrant toute l'étendue de nos capacités militaires. Une démonstration de force, un avertissement, l'aube d'une ère nouvelle pour la France. Ensuite, les choses seront claires : les alliés potentiels viendront à nous et nos adversaires se révéleront."
 FRA_la_grande_armee: "L'épine dorsale de notre armée"
 FRA_la_grande_armee_desc: "Ayant réformé notre chaîne de commandement, nous pouvons maintenant nous tourner vers des réformes plus spécifiques de notre structure militaire. Pour commencer, nous pouvons nous concentrer sur notre doctrine offensive en termes de ressources réelles disponibles pour conduire nos opérations."
 FRA_europe_nationalism: "Renforcer le nationalisme européen"
 FRA_europe_nationalism_desc: "Peu de nations européennes nous ont promis leur soutien. Elles voient d'un mauvais œil le retour d'une France dirigée par un parti nationaliste. Leur stance est une erreur ; elles devraient savoir qu'il vaut mieux être avec nous que contre nous. Nous allons leur faire payer leur inaction. Nous allons soutenir les groupes nationalistes dans leurs pays. Cela devrait semer un sacré désordre chez eux, et s'ils arrivent au pouvoir, nous aurons gagné un allié."
 FRA_plebiscites: "Gouverner par plébiscite"
 FRA_plebiscites_desc: "La fin de la République n'a nullement signifié que le peuple n'aurait plus de moyens de se faire entendre. Il faut montrer au peuple qu'il a encore son mot à dire en l'invitant à statuer sur diverses questions de notre politique. L'Empereur n'aura aucun mal à les convaincre, et cette démocratie de façade suffira à la plupart."
 FRA_firepower: "La puissance de feu moderne"
 FRA_firepower_desc: "Pendant les guerres napoléoniennes, la Grande Armée bénéficia d'innovations qui lui permirent de déchaîner une puissance de feu inédite sur les forces contre-révolutionnaires. Aujourd'hui, les règles du bombardement ont beaucoup changé avec l'arrivée des avions d'attaque et des drones. Notre pays a la chance d'exceller tant en artillerie qu'en aviation. Il faut donc décider laquelle prioriser afin de rationaliser notre production pour l'appui au combat."
 FRA_8th_coalition: "Entouré d'ennemis"
 FRA_8th_coalition_desc: "Comme au temps des guerres napoléoniennes, un jeu politique se dessine clairement. Nos ennemis nous craignent et n'attendent que le premier signe de faiblesse pour s'unir contre nous. Nous ne leur accorderons pas cette satisfaction. Nos frontières resteront militarisées aussi longtemps que nécessaire. L'Empire français ne survivra qu'en affrontant ses adversaires ; la différence avec le passé, c'est que cette fois la coalition n'aura pas le temps de se former, car nous les écraserons un par un."
 FRA_renew_meritocracy: "L'Empire méritocratique"
 FRA_renew_meritocracy_desc: "Malgré ses défauts connus, le Premier Empire dut son succès à sa préférence pour l'expérience et le professionnalisme plutôt que la classe sociale. Aujourd'hui, il faut renouveler cette promesse d'ascension sociale pour les Français. Ils doivent comprendre qu'en travaillant dur pour l'Empire et pour la France, ils peuvent s'élever plus haut qu'ils ne l'ont jamais fait."
 FRA_last_deluge: "Plus fort que jamais"
 FRA_last_deluge_desc: "Nous avons mené des réformes de grande ampleur dans notre chaîne de commandement, nos doctrines et nos chaînes d'approvisionnement. Il ne reste plus qu'à ouvrir les portes de notre armée au recrutement de masse. La conscription n'est plus une réalité depuis longtemps, mais les Français sont prêts à combattre pour leur Empire. La Grande Armée sera prête à partir à la conquête de l'Europe."
 FRA_ennemy_isolate: "Infiltrer nos adversaires"
 FRA_ennemy_isolate_desc: "Nous avons les moyens d'infiltrer les systèmes de défense civile de nos adversaires et de frapper là où ça fait mal. Ce sera un excellent entraînement pour nos services de renseignement, mais cela risque aussi de les rendre méfiants à notre égard."
 FRA_history_allies: "Les alliés de l'Empire"
 FRA_history_allies_desc: "Bien que nous soyons entourés d'ennemis, nous ne sommes pas seuls ; de nombreux pays entretiennent encore des relations amicales avec nous et pourraient être intéressés à rejoindre notre alliance. Nous pourrions mettre en avant notre histoire commune pour justifier une future alliance. Nous pouvons leur offrir des avantages importants, et ils nous seront d'une grande aide."
 FRA_imperial_pride: "Fierté impériale"
 FRA_imperial_pride_desc: "Le peuple français a retrouvé sa fierté. Nous leur avons montré que la paix et la République n'étaient que des illusions, et que l'avenir de la France est de devenir un Empire. Ils sont fiers de leur pays et haïssent nos adversaires. Notre société et notre économie sont tournées vers un conflit prolongé."
 FRA_declare_hostile: "Tester leurs défenses"
 FRA_declare_hostile_desc: "Nous n'avons plus aucune raison de cacher nos ambitions expansionnistes à nos futurs ennemis. Il est temps de montrer à leurs peuples qu'ils ont toutes les raisons de nous craindre et de se soumettre sans faire d'histoires."
 FRA_our_own_system: "Notre propre système"
 FRA_our_own_system_desc: "Chaque empire a sa propre alliance, et tenter de triompher seul coûterait cher. Un certain nombre de pays ont déjà exprimé leur volonté de s'allier à nous. Il est temps de formaliser cette coopération en créant une alliance forte entre partenaires qui se respectent."
 FRA_reclaim_empire: "Reconquérir l'Empire"
 FRA_reclaim_empire_desc: "L'heure est venue de partir reconquérir notre Empire. Nous avons passé des années à préparer notre société, notre économie et notre armée. Il est temps que ce travail porte ses fruits et que la France retrouve sa place légitime dans l'ordre mondial."
 FRA_french_commune: "La révolution victorieuse"
 FRA_french_commune_desc: "Nous avons réussi à arracher le contrôle des institutions aux communistes modérés et aux autres forces faibles ou marionnettes du capitalisme. En acceptant notre montée au pouvoir, le peuple français nous fait confiance. Lui aussi croit que le capitalisme peut être vaincu, et c'est ce que nous entendons entreprendre. Nous reconstruirons notre société et nous préparerons à l'affrontement avec les forces capitalistes."
 FRA_purge_military: "Sécuriser l'état-major"
 FRA_purge_military_desc: "Bien que nous ayons réussi à prendre le contrôle des institutions, l'armée, qui n'est pas intervenue, pourrait ne pas toujours rester de notre côté. Tôt ou tard, nous devrons affronter militairement une autre puissance. Pour assurer leur loyauté, il faut commencer par le haut de la chaîne de commandement. Ils comprendront assez vite qu'ils n'ont pas le choix, mais montreront sans doute quelque résistance pendant quelques mois. Une fois le sommet mis au pas, le reste obéira aux ordres."
 FRA_worker_right_comm: "Rassurer les travailleurs"
 FRA_worker_right_comm_desc: "Bien que la phase difficile de notre révolution soit désormais derrière nous, la société civile a exprimé une vive inquiétude sur la situation du pays. Il faut rassurer la main-d'œuvre en lui garantissant des emplois et la sécurité de l'emploi. Cela exigera que nos chaînes de production s'adaptent, mais ces garanties seront bénéfiques pour notre avenir."
 FRA_people_constitution_comm: "La dictature du prolétariat"
 FRA_people_constitution_comm_desc: "Les institutions de l'Ancienne République étaient fondamentalement injustes. Une petite caste corrompue exerçait un contrôle total sur le pays. Notre Révolution doit donner aux travailleurs les outils pour participer à la vie politique du pays qu'ils aident à faire tourner. Il est temps de mettre fin à la République injuste et d'imaginer une nouvelle forme de gouvernance."
 FRA_revolution_soil: "Une terre de révolution"
 FRA_revolution_soil_desc: "Des jacqueries aux Révolutions françaises, le peuple français a montré qu'il s'oppose à l'injustice des systèmes autoritaires. Dans le sillage de notre Révolution, il faut leur montrer que leurs prières ont été entendues et bâtir une société égalitaire capable de résister à toutes les attaques des contre-révolutionnaires."
 FRA_hostile_nato_comm: "L'Occident corrompu"
 FRA_hostile_nato_comm_desc: "L'OTAN est une marionnette des États-Unis et du capitalisme. Comme les deux sont nos ennemis mortels, nous ne devons plus rester dans cette alliance. Tôt ou tard, ils seront nos adversaires."
 FRA_fate_eurocommunism: "Abandonner l'expérience européenne"
 FRA_fate_eurocommunism_desc: "Même si nous y mettions toutes nos forces, nous ne pourrions pas remettre les institutions de l'Union européenne sur la bonne voie. Elles sont rongées par la corruption du capitalisme et du lobbying. De plus, ces pays s'opposent fermement à notre politique intérieure. La rupture blessera notre économie très intégrée, mais cette séparation est nécessaire."
 FRA_legacy_patriwar: "L'héritage de la Grande Guerre patriotique"
 FRA_legacy_patriwar_desc: "Au siècle dernier, l'URSS a montré au monde que le fascisme pouvait être vaincu par les armes. Cette guerre, qu'ils ont menée avec succès, nous a appris qu'une nation doit être unie à son armée. L'Armée rouge n'aurait jamais triomphé sans la résilience de la société soviétique. Il faut s'assurer que, dans les conflits à venir, l'enthousiasme public reste au plus haut. Nous aurons besoin de toutes nos forces pour ce qui nous attend."
 FRA_focus_education: "Éducation populaire"
 FRA_focus_education_desc: "Qu'il s'agisse de s'engager en politique ou d'être efficace et heureux au travail, notre peuple a besoin d'être informé. Il faut donner à chacun la chance d'apprendre tout ce qu'il faut pour comprendre le monde sans tomber dans la propagande des capitalistes et des fascistes."
 FRA_loyalty_cause: "Loyauté à la cause"
 FRA_loyalty_cause_desc: "Nous avons accordé à notre peuple de nombreux droits, de meilleures conditions de travail à la représentation politique, et nous avons réparé de nombreux torts. Ces nouveaux droits s'accompagnent toutefois de responsabilités. La dissidence est permise, mais chaque citoyen doit se soumettre pleinement à la volonté du collectif. Nous gouvernons cette société ensemble ; c'est donc la responsabilité de chacun de veiller à ce qu'elle continue de fonctionner correctement."
 FRA_paris_commune: "Les leçons de la Commune de Paris"
 FRA_paris_commune_desc: "Bien que les liens entre la Commune de Paris et l'idéologie communiste que nous défendons soient loin d'être évidents, nous pouvons encore tirer des leçons de cette période agitée. La Commune de Paris a péri par manque de ressources et de volonté de combattre les forces de la contre-révolution. Dans ce monde cruel, corrompu par la mondialisation, il faut garder à l'esprit que la survie de notre révolution dépend de l'écrasement des forces contre-révolutionnaires. Notre société doit en être consciente et s'unir pour affronter nos adversaires."
 FRA_unleash_agent: "Déstabiliser les capitalistes"
 FRA_unleash_agent_desc: "Nous ne pourrons pas toujours affronter nos adversaires sur le champ de bataille ; ce serait trop coûteux, et nous pourrions être vaincus. Nous pouvons toutefois nous faciliter la tâche en détruisant leur société de l'intérieur. Avec la DGSE, nous avons un service de renseignement formé à l'espionnage et à la déstabilisation, et nous pourrions en faire bon usage. Nous exporterons la révolution sans faire la guerre, et les capitalistes n'y pourront rien."
 FRA_spread_communism_eu: "Répandre le communisme en Europe"
 FRA_spread_communism_eu_desc: "Nous ne pouvons pas changer les institutions européennes, mais nous pouvons encourager certains de ses États membres à se rebeller. Puisque les politiques néolibérales mises en œuvre dans toute l'UE ne plaisent pas à tout le monde, nous n'aurons aucun mal à convaincre une part de leurs populations de nous rejoindre."
 FRA_red_army_comm: "La nouvelle Armée rouge"
 FRA_red_army_comm_desc: "Grâce à nos réformes, l'armée est pleinement sous le contrôle de la commune, et la société civile est prête à combattre aux côtés de ses forces armées. Nos réformes ont aussi libéré tout son potentiel ; nos soldats savent que la justice est de notre côté. La commune ne doit pas tomber, car elle porte le flambeau de la révolution."
 FRA_collectivisation: "Collectivisation de l'économie"
 FRA_collectivisation_desc: "Le contrôle de l'économie a toujours échappé à la classe ouvrière, restant entre les mains de quelques familles. Avant la révolution, l'oligarchie régnait en maître dans ce pays. Mais c'est fini ; le peuple français reprend le contrôle de ses moyens de production. Avec cela, nous assurerons la loyauté de nos moyens de production, ainsi que la sécurité financière de notre population."
 FRA_enforce_unions: "Renforcer les syndicats"
 FRA_enforce_unions_desc: "Maintenant que nous avons collectivisé l'économie française et donné aux travailleurs une plus grande responsabilité politique, il faut s'assurer qu'ils puissent garder le contrôle si l'État se montrait moins prudent. Les syndicats ont pu être rétablis par nos prédécesseurs modérés, mais nous pouvons faire plus. Nous donnerons encore plus de pouvoir aux syndicats et encouragerons les travailleurs à les rejoindre. Les travailleurs unis ne doivent jamais cesser de jouer un rôle significatif dans les décisions du pays."
 FRA_glorious_past_comm: "Le passé discutable du communisme"
 FRA_glorious_past_comm_desc: "Si toute l'Europe n'a pas de bons souvenirs du communisme stalinien, surtout à l'Est, il faut leur rappeler que nous sommes différents. Ces pays ont été écrasés par le totalitarisme stalinien, qui n'a pas libéré le peuple mais lui a seulement donné un nouveau maître. Nos seuls ennemis sont le capitalisme et le fascisme ; si ces pays doivent s'en libérer, nous pouvons les y aider. Mais notre but ne sera pas de les asservir, plutôt de les intégrer à notre Union du prolétariat de toutes les nations."
 FRA_befriend_comm: "Unité des travailleurs"
 FRA_befriend_comm_desc: "Bien que le communisme soit moins en vogue en ce nouveau millénaire, nous ne sommes pas seuls à suivre ses enseignements. Dans la lutte qui s'annonce, nous avons besoin d'alliés, et nous pouvons les trouver parmi les pays qui, comme nous, ont choisi de résister au capitalisme. Il faut proposer à ces pays de nous entraider pour détruire le capitalisme dans le monde entier. Ils ne sont pas seuls, et nous non plus."
 FRA_final_struggle: "La lutte finale"
 FRA_final_struggle_desc: "Notre société et notre armée sont prêtes à combattre le capitalisme. Elles ont conscience des progrès que nous avons faits et de la détermination des puissances capitalistes à nous rayer de la carte. Nous combattrons jusqu'au bout pour vaincre le capitalisme."
 FRA_UFSR_born: "Le communisme aux caractéristiques françaises"
 FRA_UFSR_born_desc: "La combinaison de l'idéologie communiste et de la détermination du peuple français à défendre ses droits était une très bonne idée. Nous avons clairement dit au public qu'il devait s'engager en politique et qu'il en a les moyens. De même que la Fête de la Fédération marque notre fête nationale, on peut dire que la révolution a désormais vraiment été acceptée par les Français. C'est un jour historique pour notre pays."
 FRA_new_kommintern: "Vers une nouvelle internationale"
 FRA_new_kommintern_desc: "De nombreux groupes dans le monde ont répondu à notre appel à une révolution mondiale. Il est temps de mettre notre alliance en pratique et de nous préparer à affronter le capitalisme."
 FRA_cold_war_round2: "La révolution mondiale"
 FRA_cold_war_round2_desc: "L'heure est venue de combattre le capitalisme et le fascisme. Nous apporterons la liberté aux travailleurs de chaque pays. L'oligarchie sera vaincue."
 FRA_kingdom_history: "Une longue histoire de monarchie"
 FRA_kingdom_history_desc: "La monarchie est de retour en France. Nos partisans ont pris le contrôle des institutions de l'ancienne République et ont appelé à notre retour. Et nous voici, deux siècles après la chute de la monarchie absolue, de nouveau sur le trône de France. Un long chemin nous attend. Il faut éradiquer l'héritage républicain de la Révolution tout en reconstruisant le nouveau Royaume de France. Pendant ce temps, nos ennemis nous guettent dans l'ombre, mais nous réussirons, car Dieu est avec nous, comme Il l'a toujours été."
 FRA_camelot: "Les Camelots du Roi"
 FRA_camelot_desc: "Pour que la population reste docile et ne rêve pas d'une nouvelle République, il faut intensifier la surveillance, et pour cela il nous faut une police politique. Nous pouvons user d'anciens membres de l'Action française formés par la DGSI. Nous fusionnerons ces organisations en un nouveau corps que nous appellerons les Camelots du Roi, en hommage à nos militants royalistes du siècle dernier."
 FRA_decentralisation_king: "Décentralisation complète"
 FRA_decentralisation_king_desc: "La centralisation héritée du jacobinisme et de la Révolution n'a pas fait des Français des citoyens mais des sujets. Les systèmes de droit coutumier aux échelons inférieurs servaient très bien de lien entre le citoyen et l'État central. Heureusement, notre pays avait déjà commencé à s'éloigner du centralisme pour se conformer aux normes de l'Union européenne. Nous pouvons donc achever cette transition, non pour entrer dans le moule des régions européennes, mais pour restaurer le système d'autorité locale d'avant la Révolution."
 FRA_king_rule: "Regnum Régis"
 FRA_king_rule_desc: "La première étape pour effacer la mémoire de la Révolution est de bâtir un système nouveau sur les ruines de l'ancien. Nous pouvons donc annoncer l'abolition de la République et la rédaction d'une nouvelle constitution. Cette constitution sera centrée sur le Roi, qui exercera un pouvoir absolu, comme au bon vieux temps."
 FRA_national_integralism: "Nationalisme intégral"
 FRA_national_integralism_desc: "Pour aider les Français à comprendre quel échec fut la Révolution et ses conséquences, il faut mettre en avant une célèbre théorie du penseur Charles Maurras. Le nationalisme intégral dépeint une République qui a abandonné le patriotisme à la suite d'une Révolution suscitée par des francs-maçons, des hérétiques et des étrangers. Il prône le retour à l'unité nationale et à l'ordre moral incarné par l'Église catholique. Ces enseignements sont pleins de vertu et entièrement applicables à notre Royaume naissant. Notre Royaume vient de trouver son manifeste."
 FRA_no_more_eu: "Quitter l'Union européenne"
 FRA_no_more_eu_desc: "L'Union européenne incarne tout ce contre quoi nous luttons : le libéralisme débridé, un idéalisme écœurant, une naïveté désastreuse et une corruption envahissante. Le seul but de cette organisation est de démanteler nos nations et nos cultures. Nous n'avons donc aucune raison d'y rester. Il faut partir avant qu'il ne soit trop tard, quelles qu'en soient les conséquences."
 FRA_eu_kingdom: "Les monarchies déchues"
 FRA_eu_kingdom_desc: "Il y a quelques siècles, l'Europe était un continent de monarchies. L'ordre international d'alors était, en un sens, façonné par l'équilibre des puissances et des alliances. Mais ces jours sont révolus. Le nationalisme a balayé les monarchies ou les a réduites au rang d'attractions touristiques. Le mieux que nous puissions faire pour trouver des alliés est donc d'aider les partisans de l'absolutisme en Europe à se soulever contre leurs oppresseurs républicains."
 FRA_king_modern_chivalry: "Chevalerie moderne"
 FRA_king_modern_chivalry_desc: "Le Royaume de France a toujours été réputé pour sa cavalerie et le rôle décisif qu'elle jouait dans les batailles. Aujourd'hui, la cavalerie ressemble à un monstre d'acier de 60 tonnes. Pourtant son rôle reste décisif. Nos forces armées feraient bien de se concentrer sur un usage intensif de la cavalerie blindée."
 FRA_no_deceit: "Mettre fin à la décadence"
 FRA_no_deceit_desc: "Notre ennemi principal est la décadence que la République a insufflée à notre société : des citoyens éloignés de l'ordre moral et qui attendent de l'État qu'il paie tout. Il faut les ramener à la réalité. L'ère de la République est révolue. Notre Royaume veut des citoyens vertueux."
 FRA_frankish_ancestor: "Nos ancêtres, les Francs"
 FRA_frankish_ancestor_desc: "Nous, Français, descendons des Francs ; c'est notre peuple et notre identité. Les républicains voulaient éradiquer la monarchie et les Francs, mais personne ne peut effacer de l'intérieur une civilisation et une culture. C'est notre héritage, et c'est à nous de le reconquérir."
 FRA_against_liberalism: "Contre le libéralisme et le socialisme"
 FRA_against_liberalism_desc: "La République a fait croire à nos citoyens qu'ils avaient besoin de plus de libertés et de droits. Notre Royaume vise à réparer ces torts. Avant tout, nos citoyens doivent retrouver le chemin de l'ordre moral et de l'unité de la nation autour de son roi. Tout le reste est secondaire."
 FRA_historical_ennemy: "L'ennemi éternel"
 FRA_historical_ennemy_desc: "S'il est un adversaire avec lequel nous nous sommes affrontés au fil des siècles, c'est sans doute le Royaume-Uni. Lui aussi est une monarchie, bien que le monarque n'ait plus de réel pouvoir. Nous nous retrouverons sûrement face à eux tôt ou tard. Mais qu'il s'agisse d'eux ou d'autres, notre marine doit être prête à combattre des puissances maritimes."
 FRA_friend_pope: "Protéger la papauté"
 FRA_friend_pope_desc: "Fille aînée de l'Église, la France a le devoir de protéger la papauté de tous ceux qui pourraient chercher à l'attaquer."
 FRA_army_of_elites: "Une force d'élite"
 FRA_army_of_elites_desc: "C'est la Révolution qui a introduit le concept de conscription. Nous avons vu pendant les deux dernières guerres mondiales que ce n'était pas forcément la meilleure des idées. Des soldats pas toujours bien formés étaient envoyés à la mort. Ces décisions ont décimé la population française au siècle dernier. Il faut veiller à ce que notre armée reste professionnelle en durcissant les critères de recrutement. Cela nous évitera aussi de nous retrouver avec des fauteurs de troubles dans nos rangs."
 FRA_positive_inequality: "Inégalité positive"
 FRA_positive_inequality_desc: "Tout n'a pas besoin d'être égalitaire. L'idée que nous devrions tous être égaux est encore une invention de la Révolution. Certains sont faits pour diriger, d'autres pour suivre. Les Français doivent s'en rendre compte, car passer son temps à se plaindre du succès des autres réduit l'efficacité de tous."
 FRA_destroy_republicanism: "Détruire le républicanisme"
 FRA_destroy_republicanism_desc: "L'absolutisme est de retour dans notre Royaume. Il n'y a plus aucune raison de perpétuer cette illusion de démocratie qu'est la politique. Le seul parti qui ait le droit d'exister est celui du Roi. Les Français doivent comprendre que l'État, c'est moi !"
 FRA_catholic_league: "Fonder la Ligue catholique"
 FRA_catholic_league_desc: "Notre rapprochement avec l'Église n'a laissé personne indifférent. Certains pays nous ont manifesté leur soutien. Peut-être pourrions-nous étendre notre croisade à d'autres puissances catholiques. Après tout, elles aussi ont le droit de se battre pour reprendre la Terre sainte."
 FRA_burry_revolution: "Enterrer la Révolution"
 FRA_burry_revolution_desc: "Le peuple français a enfin compris que la Révolution n'avait apporté que misère et que la primauté de la monarchie française était l'ordre naturel des choses. Nos institutions ont également été purgées des éléments révolutionnaires. Nous pouvons donc dire que nous avons réussi à tourner la page de cette maudite Révolution."
 FRA_elder_daughter: "La Fille aînée de l'Église"
 FRA_elder_daughter_desc: "La France a retrouvé sa place dans l'ordre du monde. Nous serons, comme nous l'avons longtemps été, les défenseurs de la chrétienté, et nous reprendrons la Terre sainte, comme nous l'avons fait tant de fois."
 FRA_republican_cancer: "Le cancer républicain"
 FRA_republican_cancer_desc: "Notre pays est parvenu à se débarrasser du républicanisme, mais nous sommes plus ou moins les seuls en Europe à n'être plus sous sa coupe. Il va sans dire que si nous sommes vaincus au combat, nos adversaires nous plongeront de nouveau dans le cauchemar républicain. Nous devons détruire la menace républicaine partout où elle se trouve. Ce n'est qu'ainsi que nous serons en sécurité."
 France_news.100.t1: "Drapeaux rouges sur l'Élysée"
 France_news.100.d1: "La télévision d'État française s'est éteinte avant l'aube. À son retour, le studio était occupé par des hommes en treillis lisant un communiqué d'un organe se nommant Comité de salut public. Des blindés ceignent l'Élysée et l'Assemblée nationale, et aucun ministre de la Cinquième République n'a été vu depuis minuit. Bruxelles a convoqué une session d'urgence et Washington a ordonné à son personnel d'ambassade de se mettre à l'abri."
 France_news.100.t2: "Paris tombe aux mains des traditionalistes"
 France_news.100.d2: "Des unités de gendarmerie fidèles aux réseaux traditionalistes se sont emparées du quartier gouvernemental dans la nuit et n'ont rencontré aucune résistance d'un haut commandement à qui l'on avait visiblement dit de s'écarter. Au matin, le drapeau tricolore de l'Élysée flottait aux côtés d'étendards qu'aucun gouvernement français n'avait tolérés depuis 1944. Les institutions de la République sont suspendues en attendant ce que les conjurés nomment une restauration nationale."
 France_news.100.a: "La Cinquième République est finie."
 France_news.100.b: "L'Europe ne peut pas laisser faire."
 France_news.100.c: "La France a enterré une république de plus."
 France_news.101.t: "La France exige ses « frontières naturelles"
 France_news.101.d: "Pour le destin économique de la France et sa protection militaire, le Rhin est sa frontière orientale indispensable. Nous devrons la reconquérir, par la force s'il le faut.\n\n[FRA.GetLeader] a suscité une vive controverse en annonçant une guerre prochaine sans autre raison que l'agression militaire de la France."
 France_news.101.a: "Le second tour est à nous… ou presque."
 France_news.101.b: "Paris mérite d’être surveillé."
 France_news.102.t1: "Cellules révolutionnaires rassemblées"
 France_news.102.d1: "Des raids coordonnés de la DGSI et du GIGN ont brisé les réseaux radicaux avant l'aube. Les chefs de cellules ont été extraits de leurs appartements à Saint-Denis et Villeurbanne, des caches d'armes ont été saisies dans trois départements, et l'appareil du parti qu'ils avaient passé deux ans à infiltrer a été purgé. Le gouvernement affirme que la République n'a jamais été en danger. Les mandats d'arrêt disent le contraire."
 France_news.102.t2: "Le complot restaurateur démantelé"
 France_news.102.d2: "Des raids coordonnés de la DGSI et du GIGN ont brisé les réseaux traditionalistes avant l'aube. Des organisateurs d'Action française ont été extraits de leurs domiciles, des caches d'armes ont été saisies dans trois départements, et les officiers qui avaient promis aux conjurés le silence de l'armée comparaissent désormais devant un tribunal militaire. La Cinquième République a survécu à son plus grand péril en quarante ans."
 France_news.102.a: "La République tient."
 France_news.102.b: "Un soulagement, et un avertissement."
 france_md.20.t: "L'état du parti centriste"
 france_md.20.d: "À l'origine parti de centre droit, l'UDF s'est imposée comme formation centriste, et par le passé nous avons pu gouverner sous la présidence de Valéry Giscard d'Estaing. Depuis, toutefois, nous avons été relégués au second plan, servant parfois lors des cohabitations, mais éclipsés par la droite républicaine et le Parti socialiste. Mais le monde change, et la tendance néolibérale gagne du terrain en Occident. Aujourd'hui, nous ne sommes pas très grands, mais nul doute qu'un jour nous gouvernerons."
 france_md.20.a: "Oui, j'ai hâte !"
 france_md.21.t: "L'état de la droite républicaine"
 france_md.21.d: "Notre parti est aussi vieux que la République et gouverne depuis 1995 sous le mandat de Jacques Chirac, mais le vent a tourné. Après une dissolution ratée qui l'a contraint à un Premier ministre socialiste, nous assistons à la montée de nos rivaux, qu'il s'agisse du Parti socialiste ou du Front national. Notre pays est, comme toujours, en difficultés financières et ses intérêts sont menacés partout à l'étranger. Une chose est sûre : nous allons devoir nous battre à l'intérieur comme à l'extérieur pour affirmer la puissance de la France à ceux qui pourraient en douter."
 france_md.21.a: "Au travail"
 france_md.22.t: "L'état du RPF"
 france_md.22.d: "Fondé en 1999, le Rassemblement pour la France (RPF) est un parti souverainiste de droite. Créé par Charles Pasqua, il s'oppose fermement à l'Union européenne, contre laquelle il a beaucoup œuvré. Notre influence est encore mineure, mais la roue tourne : l'Union européenne ne fait pas que des heureux, et nous accueillons de plus en plus de dissidents d'autres partis, des déçus qui ne trouvent nulle part ailleurs la volonté de mettre en œuvre le Frexit. Nous sommes bien sûr le parti le plus gaulliste qui soit, et comme cette République a été fondée par de Gaulle, notre place n'est nulle part ailleurs qu'à Matignon !"
 france_md.22.a: "Vive le général de Gaulle, vive la France !"
 france_md.23.t: "L'état du Front national"
 france_md.23.d: "Fondé en 1972 par Jean-Marie Le Pen, le Front national est un parti d'extrême droite. Depuis notre création, nous n'avons pas été considérés comme un parti sérieux, tout le paysage politique s'étant dressé contre nous pour notre opposition à l'immigration. La situation a changé depuis, et d'autres partis commencent à réaliser que leur attitude a mené le pays au chaos. Nous sommes les précurseurs de ce qui deviendra une tendance générale contre l'immigration. Mais on nous traite encore d'intouchables et on nous étiquette comme extrémistes : nous devons donc travailler à rendre notre parti acceptable pour l'Assemblée et l'électorat."
 france_md.23.a: "On y arrivera !"
 france_md.24.t: "L'état du Parti socialiste"
 france_md.24.d: "Rival historique de la droite républicaine, notre parti a l'âge canonique. La droite républicaine est désormais en difficulté, contrainte à la cohabitation. Nous disposons d'une base électorale solide dans la plupart des classes de la population, et notre victoire aux urnes est inévitable. Nous prônons une approche plus libérale que nos aînés, pour nous adapter à l'Europe que nous construisons. Toutefois, notre parti est miné par des divisions internes : une aile droite avide du centre libéral et une aile gauche menacée de radicalisation. Nul doute que nous gagnerons, mais une fois au sommet, nous marcherons sur des œufs."
 france_md.24.a: "Tout ira bien."
 france_md.25.t: "L'état de La France insoumise"
 france_md.25.d: "Le Parti socialiste n'a pas su porter les idéaux de gauche au pouvoir, déchiré entre ses deux tendances. Notre parti, La France insoumise, se dresse comme la seule véritable opposition de gauche à l'ordre néolibéral. C'est en cherchant le compromis à tout va que le Parti socialiste s'est enterré ; nous fonderons donc notre rhétorique sur la contestation, quitte à essuyer le feu des médias. Notre grand projet est de bâtir une nouvelle République, en finissant avec la monarchie présidentielle que nous subissons depuis trop longtemps. Notre parti a réussi auprès des jeunes, mais il ne faut pas s'en contenter si l'on veut gouverner un jour."
 france_md.25.a: "Un autre monde est possible."
 france_md.26.t: "L'état des Verts"
 france_md.26.d: "Le parti écologiste existe en France depuis 1984, mais il n'a pas connu le succès espéré. On ne nous prend jamais au sérieux, et notre base électorale est presque introuvable hors des centres urbains. Pour marquer les esprits, il nous faudra travailler avec d'autres partis et nous adapter à leurs vues. Mais vu l'état de la planète, notre présence à Matignon finira par s'imposer. Une fois là, nous nous efforcerons de transformer nos modes de vie et de production, pour assurer un avenir aux générations à venir. Les obstacles sont nombreux, mais les alliés potentiels ne manquent pas."
 france_md.26.a: "Le temps nous est compté."
 france_md.27.t: "L'état du Parti communiste français"
 france_md.27.d: "Le Parti communiste français est tombé avec l'URSS, à laquelle il était solidement attaché. Il n'est jamais facile de se retrouver du côté des perdants. Notre situation est plus que critique : à mesure que nous perdons en crédibilité, notre base électorale ouvrière dérive vers l'extrême droite ou l'abstention. Il nous faut inverser cette tendance et trouver de nouvelles manières de les reconquérir. Nous devrons sans doute négocier un temps avec d'autres partis, mais une fois aux commandes, peut-être pourrons-nous retrouver la confiance de nos anciens électeurs et notre autonomie. Notre parti a une longue histoire, et elle ne peut s'arrêter maintenant."
 france_md.27.a: "Nous reviendrons."
 france_md.30.t: "L'orientation de l'économie"
 france_md.30.d: "L'heure est venue de choisir notre ministre des Finances. Notre pays a un besoin urgent de réformes ; nous avons donc trouvé deux profils qui devraient répondre à nos attentes en matière financière. Le premier vient de nos rangs, un certain Olivier Ferrand, qui tout au long de sa carrière dans l'économie s'est familiarisé avec ce domaine. Le second, ancien inspecteur des finances, est tout nouveau en politique et a soutenu notre campagne. Sa vision sociale-libérale de la société ressemble à ce que nous voulons devenir, et sa présence au gouvernement nous vaudra peut-être l'aval du bloc libéral."
 france_md.30.a: "Du sang neuf dans le mouvement ! Nommez Emmanuel Macron à Bercy immédiatement !"
 france_md.30.b: "Non, mieux vaut mettre quelqu'un en qui nous avons vraiment confiance. Nommez Olivier Ferrand."
 france_md.150.t: "Aide supplémentaire de la France"
 france_md.150.d: "Le gouvernement français nous a proposé une aide supplémentaire dans la crise financière que nous traversons depuis notre adhésion à l'Union européenne. Devons-nous l'accepter ?"
 france_md.150.a: "Bien sûr que nous avons besoin de l'argent !"
 france_md.150.b: "Non, nous n'en avons pas besoin."
 france_md.151.t: "La France propose une rencontre internationale"
 france_md.151.d: "Le Parti socialiste français a décidé d'organiser une réunion de dirigeants socialistes du monde entier, et ils ont pensé à nous inviter. Nous pourrions en tirer parti pour gagner en légitimité. Faut-il y aller ou décliner poliment ?"
 france_md.151.a: "Nous serons au rendez-vous !"
 france_md.151.b: "Non, j'ai mieux à faire."
 france_md.160.t: "Effondrement du Parti socialiste"
 france_md.160.d: "Après une année d'instabilité et de divisions au sein du Parti socialiste, il est réduit à presque rien. C'est un moment historique, mais il est triste de voir la fin d'un parti qui a joué un rôle si central dans l'histoire de France. Pour quiconque héritera du poste de premier secrétaire, la tâche sera lourde."
 france_md.160.a: "Des erreurs ont été commises"
 france_md.161.t: "La déchirure se poursuit"
 france_md.161.d: "Une grande partie de nos adhérents et sympathisants est en train de se détacher de notre groupe. Il est clair que si nous voulons éviter la chute, nous allons devoir actionner tous les leviers à notre disposition pour conserver le soutien des élus et du public."
 france_md.161.a: "Pas une minute à perdre !"
 france_md.162.t: "Notre parti est menacé"
 france_md.162.d: "Les nombreuses réformes impopulaires que nous avons menées, malgré la désapprobation générale, nous ont valu la colère de la population, qui se demande si elle a bien fait de voter pour nous. De plus, nos nombreuses alliances avec le centre libéral, que nous avons tenté d'imiter, ont provoqué bien des ruptures au sein de notre parti. Notre aile gauche, déçue de nos choix, menace de basculer vers la gauche radicale, tandis que notre aile droite nous trouve trop mous face aux candidats libéraux, que nous avons parfois aidés malgré nous. S'il reste une chance, il va falloir travailler dur pour la saisir."
 france_md.162.a: "Ah, bon sang."
 france_md.163.t: "À qui la faute ?"
 france_md.163.d: "Après notre effondrement, une partie de nos électeurs s'est tournée vers les centristes, d'autres vers des formations plus à gauche qui revendiquent leur « radicalité » en se disant de gauche de « rupture », une posture qui attire de lourdes critiques médiatiques et unit l'opposition contre elles. L'aile que nous choisirons désormais d'affronter décidera si nos anciens électeurs nous reviendront un jour."
 france_md.163.a: "Les extrémistes de tout bord mettent notre société en danger"
 france_md.163.b: "Ce n'est rien à côté du danger que représente l'extrême centre"
 france_md.164.t: "La France propose des exercices militaires conjoints"
 france_md.164.d: "Des diplomates français nous ont adressé une proposition d'entraînement militaire conjoint. La récente montée des tensions internationales nous pousse en effet à nous unir entre États européens pour nous préparer au pire. Ce pourrait être une très bonne initiative pour entraîner nos forces armées aux conflits de haute intensité qui pourraient éclater à tout moment. Que leur répondre ?"
 france_md.164.a: "Avec plaisir, nous nous entraînerons à leurs côtés"
 france_md.164.b: "Non merci, nous n'avons pas besoin de leur aide"
 france_md.165.t: "La tempête arrive"
 france_md.165.d: "Plusieurs experts de divers domaines nous suggèrent depuis quelque temps d'établir des mesures de régulation au cas où une crise économique surviendrait n'importe où sur Terre. Ce ne serait ni la première ni la dernière, mais ces mesures nous permettraient de nous tenir à distance des complications qui accompagnent de telles crises. Cela impliquerait toutefois de réguler le secteur économique et de payer de nombreux experts pour superviser les opérations. Le voulons-nous vraiment ? Nos partenaires financiers pourraient le prendre mal."
 france_md.165.a: "La situation est effectivement très préoccupante ; il faut établir des mesures de régulation d'urgence"
 france_md.165.b: "Ce ne sont que des suppositions qui semblent mauvaises pour les affaires"
 france_md.170.t: "La France propose des réparations de guerre"
 france_md.170.d: "Le gouvernement français a décidé de nous indemniser pour la guerre d'Indochine meurtrière qui s'est déroulée sur notre sol pendant sept ans. Cet argent ne remplacera jamais les vies des 500 000 Vietnamiens morts pour l'indépendance, mais c'est un geste honorable qu'il ne faut pas refuser."
 france_md.170.a: "Maintenant, nous attendons les Américains"
 france_md.171.t: "La France propose des réparations de guerre"
 france_md.171.d: "Le gouvernement français semble enfin avoir accepté de reconnaître certains des crimes commis dans notre pays, et propose une indemnisation pour la guerre d'indépendance. Cet argent ne remplacera pas les vies des 600 000 Algériens morts pour la liberté, mais pour une fois qu'un Occidental reconnaît ses crimes, il serait sot de le refuser."
 france_md.171.a: "Au bon moment."
 france_md.172.t: "La France propose son expertise nucléaire"
 france_md.172.d: "La Présidence française a proposé de partager avec nous son expertise nucléaire contre une somme modeste. Cela pourrait s'avérer fort utile pour maîtriser cet atome instable et en tirer le meilleur parti. Si nous acceptons, cela pourrait grandement nous aider à éclairer notre peuple et faciliter la recherche dans ce domaine. Néanmoins, peut-être pourrions-nous employer cet argent à autre chose qu'à offrir à la France une place qu'elle ne mérite pas dans notre pays."
 france_md.172.a: "Un accord sur l'uranium 235"
 france_md.172.b: "Non, vous pouvez garder vos bombes à retardement"
 france_md.173.t: "La France propose sa protection"
 france_md.173.d: "Face à un monde en proie à de multiples crises, la France a décidé de garantir la protection de ses alliés européens. La Présidence française nous a en effet assuré ce matin qu'en cas d'agression par une puissance européenne étrangère, elle n'hésiterait pas à intervenir, jusqu'à invoquer l'emploi d'armes nucléaires. Bien que cette protection soit en soi une perte de souveraineté, elle pourrait s'avérer cruciale en ces temps."
 france_md.173.a: "On n'est jamais trop prudent"
 france_md.173.b: "Nous n'avons pas besoin de leur protection"
 france_md.175.t: "L'Union européenne nous impose des sanctions"
 france_md.175.d: "Suite à nos prises de position récentes et à notre volonté de nous retirer des traités qui nous lient aux États membres, une amende nous a été infligée par ces maudits bureaucrates européens. Rien ne nous force toutefois à la payer ; nos électeurs, avides de changement, y verraient même un signe de faiblesse ou de trahison. Refuser de payer pourrait cependant nuire à nos relations avec les États membres et déclencher des sanctions contre nous. Faut-il aller jusqu'au bout ?"
 france_md.175.a: "Nous paierons l'amende parce que nous respectons les règles ; c'est en les suivant que nous l'emporterons"
 france_md.175.b: "Et puis quoi encore ? On nous a déjà assez saignés"
 france_md.180.t: "Un vote historique"
 france_md.180.d: "Le peuple a parlé. Après de longues campagnes pour le Frexit et après avoir esquivé les pièges de ces maudits européistes, ainsi que ceux de ces vils populistes qui ont tenté de s'approprier nos succès, nous l'avons fait. La France quitte l'Europe aussi vite que possible. Bien sûr, ces serpents de Bruxelles ne manqueront pas de nous faire payer autant qu'ils le pourront, mais ces sanctions ne sont rien comparées à la liberté que nous avons recouvrée."
 france_md.180.a: "Désormais et pour toujours, la France est libre"
 france_md.181.t: "La France quitte l'Union européenne"
 france_md.181.d: "Après de nombreuses campagnes de désinformation eurosceptique, le mouvement nationaliste français est enfin parvenu à faire basculer la France vers le Frexit. Le départ de la France n'est plus qu'une question de temps ; il est néanmoins grave de voir un membre fondateur et structurant de l'UE partir si vite."
 france_md.181.a: "Il faut se montrer prudents face au populisme"
 france_md.182.t: "La France reconnaît nos revendications"
 france_md.182.d: "Le gouvernement français a récemment annoncé qu'il soutenait notre position sur les divers territoires historiquement nôtres qui nous ont été pris. Il a également proposé le début d'une coopération militaire entre nos deux nations ; pour l'heure, il ne s'agit que de facilités d'accès à nos infrastructures militaires. Ce soutien français soudain est bienvenu, mais devons-nous vraiment les laisser bénéficier de nos infrastructures ?"
 france_md.182.a: "Bien sûr qu'ils nous soutiennent ; ils sont les bienvenus"
 france_md.182.b: "Nous n'avons jamais demandé leur aide ; qu'ils restent à distance"
 france_md.183.t: "La France propose d'approfondir notre coopération"
 france_md.183.d: "Après avoir multiplié les prises de position en notre faveur et annoncé un rejet clair de l'OTAN, Paris a proposé d'approfondir notre coopération, des liens économiques jusqu'à une alliance militaire complète contre nos ennemis communs. Pouvons-nous vraiment faire confiance à des Occidentaux qui ont si vite abandonné leurs alliés précédents ?"
 france_md.183.a: "Je prends trois caisses de ce parfum ; c'est conclu"
 france_md.183.b: "Vous préférez les dunes du Sahel ou nos steppes gelées pour l'entraînement ? Nos armées n'en sortiront que plus fortes"
 france_md.183.c: "Qu'ils restent seuls"
 france_md.184.t: "Moscou accepte la coopération économique"
 france_md.184.d: "La réponse de Moscou n'a pas tardé ; nos économies pourraient toutes deux tirer parti de cet accord. Outre l'ouverture d'un marché considérable pour nos produits de luxe et de haute technologie, nos industries en mal de matières premières se sentiront plus en sécurité. Cet accord historique est une aubaine pour nous et un clou dans le cercueil de l'Union européenne. Nous qui l'avons créée, nous commercions désormais avec son pire ennemi."
 france_md.184.a: "Que le champagne et le pétrole coulent"
 france_md.185.t: "Moscou accepte une coopération économique et militaire"
 france_md.185.d: "La réponse de Moscou n'a pas tardé ; nos économies et nos armées pourraient toutes deux tirer parti de cet accord. Outre l'ouverture d'un marché considérable pour nos produits de luxe et de haute technologie, nos industries en mal de matières premières se sentiront plus en sécurité. De plus, une coopération renforcée entre nos forces armées nous permettra de gagner de l'expérience sur de nouveaux théâtres et de bénéficier de leurs avancées technologiques et stratégiques. Cet accord historique est une aubaine pour nous et un clou dans le cercueil de l'OTAN. Nous avons désormais un partenaire de confiance pour naviguer ce nouveau millénaire."
 france_md.185.a: "Nous nous retrouverons au Sahel, mais cette fois pas pour nous battre l'un contre l'autre"
 france_md.187.t: "Les Russes rompent les négociations"
 france_md.187.d: "Malgré tous les efforts déployés par nos diplomates, ils n'ont pas réussi à trouver un accord avec leurs homologues russes. Comme s'il n'y avait aucune volonté de faire affaire avec nous. C'est regrettable ; le potentiel d'un accord bilatéral eût été inestimable pour nos deux pays. Il n'est pas non plus impossible que nos anciens amis occidentaux aient exercé des pressions pour nous maintenir sous leur coupe. Mais ce n'est pas grave ; nous trouverons d'autres partenaires."
 france_md.187.a: "Le cancer américain a donc atteint l'Oural ; mieux vaut seul que mal accompagné"
 france_md.188.t: "La France exige des concessions"
 france_md.188.d: "Après la victoire du populisme en France et sa sortie de l'Union européenne, elle n'a cessé de prouver son hostilité à notre égard. Les sanctions économiques infligées après sa sortie ne l'ont pas laissée indemne ; désormais elle a fini de se relever et exige réparation. Aujourd'hui, des diplomates sont arrivés menaçant de couper l'accès à son territoire national si nous n'influençons pas la Banque européenne pour abaisser les taux d'intérêt de leur dette. Les conséquences de cette perte d'accès à leur territoire pourraient grandement compliquer les échanges au sein de l'Union européenne. Céder à leur chantage nous forcerait toutefois à détourner nos atouts."
 france_md.188.a: "Maudits soient-ils ; nous prendrons le moindre mal"
 france_md.188.b: "Nous ne céderons pas au chantage de quelques populistes"
 france_md.189.t: "L'Allemagne cède à nos concessions"
 france_md.189.d: "Sous la pression que nous avons exercée, le gouvernement allemand a accepté à contrecœur de faire pression sur la BCE pour réduire nos taux d'intérêt. C'est une formidable revanche sur nos anciens bourreaux. Ces Allemands peuvent continuer à profiter de nos ronds-points, mais grâce à eux nous mangeons aux frais de Bruxelles."
 france_md.189.a: "Œil pour œil, dent pour dent, en latin si possible"
 france_md.190.t: "L'Allemagne refuse nos exigences"
 france_md.190.d: "Nos diplomates sont rentrés de Berlin les mains vides, snobés par nos cousins allemands. Peut-être nos exigences étaient-elles trop élevées, ou ils entendent regarder ailleurs que vers nous. Nous n'aurons pas notre revanche contre l'Union européenne aujourd'hui, mais elle ne saurait attendre."
 france_md.190.a: "Nous restons libres et eux non ; fermez les frontières à l'est"
 france_md.191.t: "La France exige des concessions"
 france_md.191.d: "Après la victoire du populisme en France et sa sortie de l'Union européenne, elle n'a cessé de prouver son hostilité à notre égard. Les sanctions économiques infligées après sa sortie ne l'ont pas laissée indemne ; désormais elle a fini de se relever et exige réparation. Aujourd'hui, des diplomates sont arrivés menaçant de couper l'accès à son territoire national si nous ne remplaçons pas leur police maritime et côtière dans les opérations de rétention migratoire. Les conséquences de cette perte d'accès à leur territoire pourraient grandement compliquer les échanges au sein de l'Union européenne. Céder à leur chantage nous forcerait toutefois à détourner nos atouts."
 france_md.191.a: "Maudits soient-ils ; nous prendrons le moindre mal"
 france_md.191.b: "Nous ne céderons pas au chantage de quelques populistes"
 france_md.192.t: "L'Italie cède à nos concessions"
 france_md.192.d: "Sous la pression que nous avons exercée, le gouvernement italien a accepté à contrecœur de remplacer notre police sur nos frontières maritimes. C'est une formidable revanche sur nos anciens bourreaux. Ces Italiens seront ravis de profiter du flux de migrants, mais grâce à eux nous mangeons aux frais de Bruxelles."
 france_md.192.a: "Œil pour œil, dent pour dent, en latin si possible"
 france_md.193.t: "L'Italie refuse nos exigences"
 france_md.193.d: "Nos diplomates sont rentrés de Rome les mains vides, snobés par nos voisins latins. Peut-être nos exigences étaient-elles trop élevées, ou ils entendent regarder ailleurs que vers nous. Nous n'aurons pas notre revanche contre l'Union européenne aujourd'hui, mais elle ne saurait attendre."
 france_md.193.a: "Nous restons libres et eux non ; fermez les frontières au sud-est"
 france_md.194.t: "La France exige des concessions"
 france_md.194.d: "Après la victoire du populisme en France et sa sortie de l'Union européenne, elle n'a cessé de prouver son hostilité à notre égard. Les sanctions économiques infligées après sa sortie ne l'ont pas laissée indemne ; désormais elle a fini de se relever et exige réparation. Aujourd'hui, des diplomates sont arrivés menaçant de couper l'accès à son territoire national si nous n'utilisons pas les institutions que nous accueillons à leurs fins. Ils nous demandent d'influencer les décisions des institutions européennes et de leurs services d'espionnage. Les conséquences de cette perte d'accès à leur territoire pourraient grandement compliquer les échanges au sein de l'Union européenne. Céder à leur chantage nous forcerait toutefois à détourner nos atouts."
 france_md.194.a: "Maudits soient-ils ; nous prendrons le moindre mal"
 france_md.194.b: "Nous ne céderons pas au chantage de quelques populistes"
 france_md.195.t: "La Belgique cède à nos concessions"
 france_md.195.d: "Sous la pression que nous avons exercée, le gouvernement belge a accepté de faire pression sur les institutions européennes en notre faveur. C'est une formidable revanche sur nos anciens bourreaux. Ces Belges seront ravis de faire des heures supplémentaires au parlement, et grâce à eux nous mangeons aux frais de Bruxelles."
 france_md.195.a: "Œil pour œil, dent pour dent, en latin si possible"
 france_md.196.t: "La Belgique refuse nos exigences"
 france_md.196.d: "Nos diplomates sont rentrés de Bruxelles les mains vides, snobés par nos frères wallons et flamands. Peut-être nos exigences étaient-elles trop élevées, ou ils entendent regarder ailleurs que vers nous. Nous n'aurons pas notre revanche contre l'Union européenne aujourd'hui, mais elle ne saurait attendre."
 france_md.196.a: "Nous restons libres et eux non ; fermez les frontières au nord"
 france_md.197.t: "La France exige des concessions"
 france_md.197.d: "Après sa sortie de l'Union européenne et son rétablissement face aux sanctions qui en ont résulté, la France continue de prouver son hostilité à notre égard. Aujourd'hui ses diplomates sont arrivés menaçant de couper l'accès au territoire français à moins que nous ne leur remettions un registre détaillé des comptes bancaires détenus sur notre sol, une grave atteinte au secret bancaire que nous nous efforçons de préserver. Perdre cet accès compliquerait nos échanges dans l'Union, mais céder ferait de nous les complices de leur chantage."
 france_md.197.a: "Maudits soient-ils ; nous prendrons le moindre mal"
 france_md.197.b: "Nous ne céderons pas au chantage de quelques populistes"
 france_md.198.t: "Le Luxembourg cède à nos concessions"
 france_md.198.d: "Sous la pression que nous avons exercée, le gouvernement luxembourgeois a accepté de faire pression sur ses services bancaires pour nous fournir un registre détaillé des comptes qu'ils détiennent. Nous y avons trouvé bien des traîtres cherchant à échapper à leur devoir, mais aussi des informations sur de nombreuses entreprises privées établies sur notre territoire national. Ces découvertes aideront les efforts du fisc à poursuivre les mauvais patriotes et à faire payer les entreprises qui ont tenté de nous tromper dans notre pays. Les Luxembourgeois ont peut-être grandement perdu en crédibilité bancaire, mais grâce à eux nous mangeons aux frais de Bruxelles et au prix de leur maudit libre-échange."
 france_md.198.a: "Œil pour œil, dent pour dent, en latin si possible"
 france_md.199.t: "Le Luxembourg refuse nos exigences"
 france_md.199.d: "Nos diplomates sont rentrés du Luxembourg les mains vides, snobés par nos voisins millionnaires. Peut-être nos exigences étaient-elles trop élevées, ou ils entendent regarder ailleurs que vers nous. Nous n'aurons pas notre revanche contre l'Union européenne aujourd'hui, mais elle ne saurait attendre."
 france_md.199.a: "Nous restons libres et eux non ; fermez les frontières au nord-est"
 france_md.200.t: "La France exige des concessions"
 france_md.200.d: "Après sa sortie de l'Union européenne et son rétablissement face aux sanctions qui en ont résulté, la France continue de prouver son hostilité à notre égard. Aujourd'hui ses diplomates sont arrivés menaçant de couper l'accès au territoire français à moins que nous ne venions en aide à leur secteur agricole, qui développe un projet d'agrumes dans le sud en concurrence directe avec le nôtre. Perdre cet accès compliquerait nos échanges dans l'Union, mais céder ferait de nous les complices de leur chantage."
 france_md.200.a: "Maudits soient-ils ; nous prendrons le moindre mal"
 france_md.200.b: "Nous ne céderons pas au chantage de quelques populistes"
 france_md.201.t: "L'Espagne cède à nos concessions"
 france_md.201.d: "Sous la pression que nous avons exercée, le gouvernement espagnol a accepté de nous fournir une assistance technique et commerciale pour la production et la vente de notre nouvelle gamme d'agrumes qui inondera les marchés français et espagnol. Les Espagnols n'ont plus peut-être que leurs doigts à se mordre, mais grâce à eux nous mangeons aux frais de Bruxelles et avons montré notre hégémonie alimentaire sur le continent."
 france_md.201.a: "Œil pour œil, dent pour dent, en latin si possible"
 france_md.202.t: "L'Espagne refuse nos exigences"
 france_md.202.d: "Nos diplomates sont rentrés de Madrid les mains vides, snobés par nos voisins ibériques. Peut-être nos exigences étaient-elles trop élevées, ou ils entendent regarder ailleurs que vers nous. Nous n'aurons pas notre revanche contre l'Union européenne aujourd'hui, mais elle ne saurait attendre."
 france_md.202.a: "Nous restons libres et eux non ; fermez les frontières au sud-ouest"
 france_md.203.t: "La fin du voyage"
 france_md.203.d: "Après des mois de dialogue et de lutte sur le fond, le texte de réforme constitutionnelle est enfin prêt à être voté. Nos adversaires politiques ont peut-être profité de la rédaction pour y glisser des clauses servant leurs propres idéaux, mais refuser au peuple un vote après un processus si long les laisserait se sentir à juste titre trahis. Convocation du référendum relève de nous seuls, en vertu de l'article 11 de la Constitution, et nous seuls répondrons des conséquences."
 france_md.203.a: "Il est temps d'en finir ; je demande un référendum"
 france_md.203.b: "Ce texte est trop dangereux et ne doit pas être voté"
 france_md.204.t: "Le texte est adopté"
 france_md.204.d: "Aujourd'hui est un jour historique ; pour la première fois, le peuple tout entier participe à l'élaboration de sa constitution. Le résultat du vote n'est pas une surprise, une victoire écrasante du oui ; bien sûr, quand on donne à un Français le droit de décider de ses propres droits, il ne s'en prive pas. Ce texte n'est peut-être pas parfait, mais il reflète une ère nouvelle qui commence aujourd'hui, et nous avons fait de notre mieux pour qu'il défende les droits de nos citoyens tout en empêchant le peuple de succomber aux sirènes de nos adversaires politiques. Ici s'achève la Cinquième République et, avec ce Oui franc et massif, commence la Sixième République."
 france_md.204.a: "Le jour de gloire est arrivé"
 france_md.205.t: "Le texte est largement rejeté"
 france_md.205.d: "Contre toute attente, la réforme constitutionnelle que nous préparions depuis des mois a été rejetée aux urnes. Peut-être notre implication dans l'orientation des débats a-t-elle laissé croire que nous cherchions à les manipuler, ou peut-être nos citoyens voulaient-ils du changement sans jamais s'accorder sur sa forme. Tout n'est pas perdu : nous pouvons encore poursuivre notre vision de la République, une loi à la fois, mais la réforme d'ampleur que nous espérions devra attendre."
 france_md.205.a: "Complètement incompréhensible"
 france_md.206.t: "Débat sur les institutions, partie 1"
 france_md.206.d: "La question des institutions divise la France depuis la fondation de la Cinquième République en 1958, lorsque le pouvoir présidentiel a remplacé l'instabilité de la Quatrième. Ce pouvoir est désormais jugé excessif, permettant à un président malintentionné de bloquer le progrès avec peu de contre-pouvoirs, tandis que l'Assemblée nationale, plus représentative, ne dispose guère d'autorité exclusive. Rénover cette constitution datée est désormais à l'ordre du jour, et jusqu'où nous irons définira si le pouvoir penche de nouveau vers le parlement ou reste à la présidence."
 france_md.206.a: "C'est assez pratique de n'être pas constamment sous la menace de l'Assemblée"
 france_md.206.b: "À bas la République présidentielle, le Président inaugurera les chrysanthèmes"
 france_md.206.c: "Concentrons-nous simplement sur la promotion de la participation citoyenne"
 france_md.207.t: "Le triomphe du compromis"
 france_md.207.d: "Après des jours de délibération, les citoyens semblent s'être accordés autour d'un rééquilibrage des pouvoirs. L'article 49.3 a naturellement été la première cible de la colère populaire. Les pouvoirs présidentiels s'en tirent à bon compte et le peuple paraît satisfait de son travail. Un coup de force démocratique semble désormais moins probable ; nos institutions y gagnent en légitimité et en efficacité. On ne peut que regretter la légère déception de nos partisans les plus dévoués, à qui nous avions promis la fin de la monarchie présidentielle. Quoi qu'on en pense, le peuple a décidé ; nous pouvons désormais nous tourner vers les débats suivants."
 france_md.207.a: "Très bien, question suivante ! Mon bureau s'en est plutôt bien sorti."
 france_md.208.t: "La fin de la dictature présidentielle"
 france_md.208.d: "Les citoyens se sont enfin accordés : la Cinquième République a accumulé trop de rancœur face aux décisions présidentielles abusives, et nous ne pouvons plus risquer qu'autant de pouvoir repose sur le caprice d'un seul homme. Les pouvoirs du président se limitent désormais à ceux de chef des armées et de figure cérémonielle à l'Élysée, tandis que l'Assemblée nationale redevient toute-puissante. Les réformes y perdront peut-être en stabilité, mais elles avanceront bien plus facilement, et la confiance des Français dans nos institutions devrait s'en trouver renforcée."
 france_md.208.a: "Ainsi soit-il ; que les débats se poursuivent."
 france_md.209.t: "Débat sur les institutions, partie 2 :"
 france_md.209.d: "Alors que le débat institutionnel se clôt, une question divise nos citoyens : le contrôle des services secrets qui répondent au président. Ces services ont longtemps défendu les intérêts français, mais des excès passés, dont les assassinats d'Auriol en 1981, et leur liberté d'agir hors la loi ont soulevé des inquiétudes sur la transparence. Une plus grande ouverture renforcerait la confiance dans nos institutions, mais notre sécurité dans un monde de plus en plus instable ne saurait être prise à la légère."
 france_md.209.a: "La sécurité de nos citoyens avant tout ! Nous veillerons seulement à ce que leur vie privée ne soit pas trop menacée."
 france_md.209.b: "Le peuple a besoin de transparence ! Le peuple a besoin de justice ; l'État doit répondre de ses actes devant ses citoyens."
 france_md.209.c: "Ce débat suscite trop de tensions ; mieux vaudrait nous en tenir à l'écart."
 france_md.210.t: "Les services secrets en sortent indemnes"
 france_md.210.d: "Les citoyens ont décidé de maintenir les services secrets sous le contrôle de l'exécutif. En ces temps surtout, notre défense passive doit être en première ligne pour nous protéger des actions malveillantes de l'étranger et du terrorisme. Ce résultat a toutefois déçu nos militants qui voulaient plus de transparence et de démocratie. Beaucoup de nos concitoyens persistent à penser que la défense du pays ne devrait pas se faire au prix de leur vie privée en temps de paix. Certains craignent aussi le détournement de ces services par des gouvernements malintentionnés pour espionner l'opposition ou empêcher les fuites. Les électeurs ont décidé, et ils ont choisi la sécurité plutôt que la liberté. C'est leur choix, après tout."
 france_md.210.a: "Ce n'est simplement pas le moment de baisser la garde dans un monde où la force a pris le pas sur le droit international."
 france_md.211.t: "Le rideau se lève"
 france_md.211.d: "Après d'ardues négociations, nous avons enfin décidé de mettre fin à l'opacité totale de nos services secrets. Beaucoup de citoyens ne se sentaient plus en sécurité sachant qu'ils étaient sous surveillance constante à leur insu, et nos interventions à l'étranger suscitent souvent des controverses qu'ils préféreraient ne pas découvrir dans le journal. Cette nouvelle transparence devrait donner à nos citoyens davantage confiance en leur police et leurs forces armées, même si cela nous coûte un peu de sécurité intérieure et d'influence extérieure."
 france_md.211.a: "Nous n'avons pas besoin de services secrets pour nous protéger des ingérences étrangères."
 france_md.212.t: "Débat sur les droits personnels, partie 1 :"
 france_md.212.d: "La question des droits personnels est au cœur du débat constitutionnel. Faut-il renforcer les libertés individuelles face à l'État ou privilégier la sécurité collective ? Les discussions portent sur la protection des données personnelles, le droit à la vie privée et les limites de la surveillance étatique. Les progressistes plaident pour un élargissement des droits fondamentaux, tandis que les conservateurs craignent un affaiblissement de l'autorité publique. Notre position sur ce point déterminera en partie l'orientation de la nouvelle constitution."
 france_md.212.a: "Défendre fermement les libertés individuelles."
 france_md.212.b: "La sécurité collective doit primer."
 france_md.212.c: "Que le débat se poursuive sans nous."
 france_md.213.t: "Victoire des libertés individuelles"
 france_md.213.d: "Le débat s'est conclu en faveur du renforcement des libertés individuelles. La nouvelle constitution garantira des protections accrues contre l'intrusion de l'État dans la vie privée des citoyens. Cette victoire des progressistes marque un tournant dans notre rapport à l'autorité publique, même si certains s'inquiètent des conséquences pour la sécurité nationale."
 france_md.213.a: "Nos citoyens peuvent se réjouir de ces nouvelles garanties."
 france_md.214.t: "La sécurité l'emporte"
 france_md.214.d: "Malgré les efforts des défenseurs des libertés, la vision sécuritaire l'a emporté dans les débats constitutionnels. L'État conservera de larges pouvoirs de surveillance et d'intervention. Si cela rassure une partie de la population, les militants des droits civiques dénoncent un recul démocratique."
 france_md.214.a: "La stabilité a un prix"
 france_md.215.t: "Débat sur les droits personnels, partie 2 :"
 france_md.215.d: "Notre nation est connue pour son agitation, et quel que soit le résultat d'une élection, le mécontentement finit par descendre dans la rue. La question de la protection des citoyens lors des manifestations est désormais à l'ordre du jour : excès policiers d'un côté, protection insuffisante de l'autre, nombre de manifestations s'achevant dans le sang. Encadrer la police rétablirait la confiance du public mais alourdirait les coûts, tandis que la soutenir maintient l'ordre mais risque de nouveaux incidents à mesure que les mouvements se radicalisent."
 france_md.215.a: "Il faut réguler nos forces de police."
 france_md.215.b: "Qu'ils fassent leur travail."
 france_md.215.c: "Le peuple décidera ; après tout, c'est lui qui sera dans la rue pour protester contre cette loi."
 france_md.216.t: "Le peuple choisit de restreindre la police"
 france_md.216.d: "Après des heures de débat, la majorité s'est accordée sur la nécessité de réguler les forces de police pour prévenir de nouveaux scandales. Les technologies de maintien de l'ordre s'améliorent, et nous sommes déjà une nation très efficace en la matière ; inutile d'aller plus loin. De plus, éviter les blessures physiques graves parmi les manifestants réduira sûrement les dépenses de santé. L'État a aussi davantage de comptes à rendre à son peuple, puisque celui-ci pourra manifester dans la rue avec moins de danger. Il faudra toutefois s'attendre à des coûts supplémentaires pour la police, l'efficacité des forces de l'ordre s'en trouvant diminuée."
 france_md.216.a: "Ainsi notre peuple continuera de nous tenir en laisse. Question suivante !"
 france_md.217.t: "Le peuple choisit l'ordre"
 france_md.217.d: "Même si ce n'est pas ce que nous aurions préféré, l'efficacité policière l'a emporté. Il est vrai que certaines manifestations dégénèrent et causent d'importants dégâts matériels, si bien qu'un contrôle extérieur s'impose vu l'efficacité réduite des services de l'ordre. Nous faisons face à des crises budgétaires et sociales sans précédent ; à un moment, il nous faudra nous mettre une partie du peuple à dos. Il reste donc important d'être capables de tenir tête à n'importe quel mouvement social. Après tout, ils nous ont élus, n'est-ce pas ?"
 france_md.217.a: "Le peuple a choisi la sécurité plutôt que le droit de nous demander des comptes ; peut-on le lui reprocher ? Question suivante."
 france_md.218.t: "Débat sur l'économie, première partie"
 france_md.218.d: "Bien que la gestion de l'économie incombera aux gouvernements futurs, nous pouvons dès maintenant inscrire dans la constitution des fondamentaux sociaux, écologiques ou économiques, rendant inconstitutionnelles les lois qui les violeraient. Prioriser les protections sociales garantit l'emploi et la protection sociale mais peut laisser l'écologie de côté et inquiéter les investisseurs par la dette qui en résulterait. Prioriser l'écologie améliore la qualité de vie et nous oriente vers de nouvelles sources d'énergie, mais laisse certaines recettes et investissements de côté. Nous pourrions aussi feindre de soutenir l'économie pour semer la zizanie chez les autres factions, ou leur laisser entièrement la question."
 france_md.218.a: "Le social d'abord ! Nous devons nous tenir aux côtés de nos citoyens."
 france_md.218.b: "La planète se dégrade trop vite pour que nous restions les bras croisés."
 france_md.218.c: "Bonne idée ; nous leur ferons croire que les libéraux sont derrière tout ça."
 france_md.218.e: "Laissons les autres partis s'entre-déchirer sur cette question."
 france_md.219.t: "Le peuple choisit de prioriser le soutien social"
 france_md.219.d: "Après de longues heures d'hésitation, les citoyens se sont enfin accordés sur le pilier social de la République. En protégeant les gens ordinaires et leurs emplois, nous assurerons une transition saine vers un avenir meilleur. De plus, mieux vaut que nos usines soient construites aux normes et polluent ici plutôt que d'être délocalisées dans des pays moins concernés. Ce résultat n'est ni une surprise ni une mauvaise nouvelle."
 france_md.219.a: "Encore une question à laquelle nous pouvions apporter une réponse ; bravo."
 france_md.220.t: "Le peuple choisit l'écologie"
 france_md.220.d: "Ce résultat ne nous déplaît pas. La santé de la planète rejaillit en effet sur celle de ses habitants. Il n'est donc pas surprenant, et même bénéfique, que cet éveil se soit produit à plusieurs niveaux de la société. Nous allons donc devoir apprendre à transformer nos modes de vie et de production de biens et d'énergie. Le chemin sera semé d'embûches et ne servira pas toujours les intérêts de la majorité. Mais c'est la voie que nous devons suivre."
 france_md.220.a: "Il ne reste plus qu'à recycler ceux qui ont voté pour le grand capital."
 france_md.221.t: "Le peuple choisit l'économie"
 france_md.221.d: "Un résultat surprenant, celui de l'issue des débats d'aujourd'hui. Le peuple a donc choisi de protéger les entreprises de toutes sortes pour porter le développement du pays. On voit que certains croient encore à la théorie du ruissellement. On aurait aussi pu deviner qu'avec des médias souvent aux mains de quelques oligarques, ils feraient tout pour faire pencher la balance. Une journée plutôt décevante pour nos militants. Mais nous ne pouvons désormais remettre en cause l'avis du peuple souverain."
 france_md.221.a: "Demander l'avis du peuple était-il vraiment une si bonne idée ?"
 france_md.222.t: "Débat sur l'économie, deuxième partie"
 france_md.222.desc: "D'autres questions sociales attendront les républiques futures, mais nous pouvons dès maintenant fixer l'orientation constitutionnelle : qui doit payer pour notre couverture sociale exceptionnelle mais coûteuse ? Ce que cette réforme décidera maintenant, en matière de fiscalité, de financement budgétaire ou de coupes, façonnera l'ossature financière de notre État-providence pour des générations."
 france_md.222.a: "À bas le capitalisme !"
 france_md.222.b: "L'État financera le système ; nous ferons de notre mieux pour éviter de nouveaux impôts."
 france_md.222.c: "Nous ne pouvons pas risquer de mettre nos citoyens au chômage."
 france_md.222.d: "Mieux vaudrait ne pas nous mêler de ce débat."
 france_md.223.t: "Le peuple choisit de taxer le capital"
 france_md.223.d: "Les longs débats de ces dernières semaines se sont achevés par notre victoire dans cette confrontation idéologique. Ce sera le capital et les revenus des plus fortunés qui financeront la couverture sociale de la population. Cet acte symbolique marque une grande victoire du peuple contre le grand capital. Une victoire de la France sur la finance est une victoire de tout le peuple uni contre ses anciens maîtres. Nos débats économiques sont pour l'heure terminés, mais nous avons préparé le terrain pour les générations à venir. Ainsi, en quelques réformes seulement, nous avons fait la révolution."
 france_md.223.a: "Une grande victoire pour le peuple français."
 france_md.224.t: "Le peuple confirme le rôle de l'État"
 france_md.224.d: "L'issue des débats de la semaine dernière est claire : le peuple ne veut pas bouleverser l'économie telle qu'elle est. Est-ce dû à la propagande néolibérale dont on les abreuve chaque jour à la télévision ? Probablement, mais nous devons accepter leur verdict car c'est le seul qui compte. Au moins avons-nous réussi à ne pas encourager des coupes dans d'autres services de l'État pour financer celui-ci, mais il se peut que nos successeurs soient moins bienveillants envers la société pour financer notre système. Nous veillerons à ce que cela n'arrive pas."
 france_md.224.a: "Ce n'est pas vraiment la victoire que nous espérions, mais il faudra faire avec."
 france_md.225.t: "Le peuple choisit de couper ailleurs"
 france_md.225.d: "Si nous avions su que le verdict serait celui-ci, peut-être n'aurions-nous pas porté ce débat aux urnes, mais il est trop tard pour y penser. Le peuple vient en effet de décider du sort de notre système social. Il a recommandé aux législatures futures de préserver les services essentiels de l'État mais de couper d'autres dépenses publiques. Leur cible principale sera probablement les agents de la fonction publique et de nombreuses subventions qu'ils ne jugent pas essentielles. Le système de protection sociale sera financé, mais nous venons de justifier l'entrée du loup libéral dans les comptes de l'État. Tant que nous serons au pouvoir, nous pourrons l'empêcher, mais qui sait ce que feront les gouvernements futurs."
 france_md.225.a: "Cette réforme constitutionnelle ne se passe pas tout à fait comme prévu."
 france_md.226.t: "Débat sur les questions de société, partie 1 :"
 france_md.226.d: "Le système français d'intégration des minorités a longtemps reposé sur l'idéal du « creuset » de l'école républicaine et de la méritocratie, mais ce principe montre ses limites : le recul de la mobilité sociale alimente le chômage et la dérive communautariste. Le débat se tourne désormais vers la réforme de ce système. Pousser un modèle plus inclusif risque de bousculer un cadre qui prévaut depuis des générations, mais le laisser intact ne fait que donner à nos adversaires l'occasion de le durcir. Quoi qu'il en soit, notre choix ici façonnera le pays pour des générations."
 france_md.226.a: "Afin de permettre au plus grand nombre d'avoir une vie meilleure, le système doit être plus inclusif."
 france_md.226.b: "Laissons les citoyens décider eux-mêmes de cette question."
 france_md.227.t: "Le peuple choisit d'adapter le système"
 france_md.227.d: "L'issue des débats semble s'être orientée vers une adaptation du système actuel à la diversité inhérente à notre nouveau millénaire. Il nous faudra certes investir des ressources, mais notre système, en permettant cette inclusion, ne sera pas privé des nouveaux talents qui affluent vers notre pays. En offrant à chacun un avenir à portée de main, nous avons contribué à la pacification tout en favorisant notre développement à long terme."
 france_md.227.a: "Nous avons tant à apprendre des autres."
 france_md.228.t: "Le peuple choisit de durcir le système actuel"
 france_md.228.d: "Malgré nos efforts, il semble que la société actuelle ne soit pas prête à remettre en cause les fondamentaux de notre République. Le système français d'intégration semble encore avoir de beaux jours devant lui. Ce vote confirme l'attachement des Français à un système qui, malgré ses dysfonctionnements, a le mérite d'exister. Ce système pourra toujours être réformé à long terme, mais nous avons manqué l'occasion de faire tomber une autre forteresse."
 france_md.228.a: "Dommage"
 france_md.229.t: "Débat sur les questions de société, partie 2 :"
 france_md.229.d: "La liberté de culte est l'une des questions les plus brûlantes de notre millénaire. Depuis les lois de laïcité de la Troisième République, la France la protège farouchement, parfois au prix des libertés des citoyens eux-mêmes, surtout par l'interdiction des signes religieux dans les écoles primaires publiques, une règle de plus en plus au centre d'un débat national tendu. Assouplir ce cadre juridique pourrait apaiser les relations entre communautés, mais cela signifie remettre en cause une loi fondatrice à laquelle nos citoyens tiennent."
 france_md.229.a: "Notre société doit s'adapter aux besoins de reconnaissance des communautés religieuses."
 france_md.229.b: "Laissons les citoyens décider eux-mêmes de cette question."
 france_md.230.t: "Le peuple choisit d'assouplir la laïcité"
 france_md.230.d: "Les débats sur la laïcité se sont conclus en faveur d'un assouplissement du cadre juridique actuel. Le port de signes religieux sera à terme normalisé dans davantage de lieux qu'auparavant. Les diverses confessions auront aussi droit à une plus grande représentation dans la société, tout en maintenant la primauté de l'État et sa séparation d'avec la religion. C'est une victoire car nous avons su conserver le meilleur de notre ancien système tout en assurant l'assouplissement des parties les plus controversées. Il ne nous reste qu'à espérer que cette brèche dans cette loi fondatrice ne mène pas à une remise en cause progressive de ce cadre protecteur de la liberté de culte. Nous pouvons faire confiance à nos successeurs sur ce point."
 france_md.230.a: "Cela devrait bien se passer."
 france_md.231.t: "Le peuple choisit de durcir la loi de laïcité"
 france_md.231.d: "Nous ne nous attendions pas à ce qu'ouvrir un débat sur la laïcité produise un système plus strict que celui que nous avions. C'était un risque à prendre, et nous l'avons pris. Les signes religieux seront désormais encore moins tolérés dans les institutions publiques. Nos ancêtres avaient-ils prévu que nous irions si loin dans cette direction ? Nous y voici, et nous verrons où ces changements nous mènent. Ce qui est certain, c'est que notre idéal de tolérance paraît plus lointain que jamais."
 france_md.231.a: "Au moins la liberté de conscience reste garantie."
 france_md.235.t: "Bâtir la République de demain"
 france_md.235.d: "Maintenant que notre mandat est lancé, il est temps de tenir notre promesse la plus attendue : la Sixième République. Cette nouvelle République, que nous voulons débattue plutôt qu'imposée, occupera nos citoyens pendant des mois tandis qu'ils poseront les fondations de la société de demain. Il nous faudra parfois orienter le débat pour qu'il ne dérive pas, mais paraître trop impliqués risque de nous faire perdre la confiance du peuple. Ce projet doit être mené jusqu'au bout, et assez vite pour qu'on n'ait jamais l'impression que nous retardons la démocratie elle-même."
 france_md.235.a: "La Cinquième République vit ses derniers instants"
 france_md.236.t: "La Sixième République échoue"
 france_md.236.d: "Depuis plusieurs semaines, les espaces de débat restent vides et le projet de Sixième République s'enlise, non par la guerre ou la crise mais par le simple désintérêt. En tardant trop à organiser les débats et à agir sur les contributions de nos citoyens, nous avons laissé mourir l'enthousiasme populaire que nous avions galvanisé. Notre chance de changer le système nous échappe désormais. Nous pouvons encore faire passer une partie de ce travail sous forme de réformes ordinaires, mais sans l'ampleur espérée, et nous n'avons pas su remédier aux injustices inscrites dans notre constitution, la loi suprême du pays."
 france_md.236.a: "Nous avons manqué une occasion de changer le système"
 france_md.238.t: "La France nous place sous embargo"
 france_md.238.d: "La France a annoncé un embargo total contre nous, couvrant tout, des livraisons de matériel au commerce ordinaire. Depuis l'élection de La France insoumise, Paris a durci sa rhétorique à notre égard sur la question palestinienne, accusant notre gouvernement d'alimenter le conflit dans la région, et est désormais passé à l'embargo pur et simple. Pire, ils font pression sur le reste de l'Europe pour qu'il suive. Nos partenaires commerciaux européens sont essentiels, et nous ne pouvons pas laisser cette campagne aboutir."
 france_md.238.a: "Ils ne convaincront pas grand monde"
 france_md.239.t: "La France nous demande de placer l'État d'Israël sous embargo"
 france_md.239.d: "Suite à la décision de la France de placer l'État d'Israël sous embargo, des diplomates français nous ont contactés pour nous presser de faire de même. Ils invoquent la politique agressive de l'État d'Israël envers ses voisins, la déstabilisation de la région qui en résulte, et la situation humanitaire. Ces arguments ne manquent pas de fondement, et une part importante de notre électorat les soutient. Toutefois, de telles actions risquent de nous coûter cher sur le plan international, et d'ailleurs nous n'avons aucun intérêt géopolitique à nous détourner de notre allié israélien. Que décider ?"
 france_md.239.a: "Naturellement, l'État d'Israël doit freiner sa politique expansionniste"
 france_md.239.b: "Nous n'abandonnerons pas nos partenaires israéliens"
 france_md.240.t: "La France propose d'aider à stabiliser notre nation"
 france_md.240.d: "Après un siècle de colonisation et des décennies de néocolonialisme, il semble que la politique de la France en Afrique ait changé de cap. Ils proposent d'aider à stabiliser notre pays tout en s'assurant de réduire leur emprise sur lui. Cette nouvelle semble une bénédiction, et notre pays a plus que jamais besoin de cette aide. Néanmoins, il est probable que cette aide s'accompagne de promesses nécessaires de paix, allant de pair avec un apaisement au sein de la population. Notre ancien colonisateur semble désormais avoir réfléchi aux conséquences de ses actes. Devons-nous en faire autant ?"
 france_md.240.a: "L'aide est toujours bienvenue"
 france_md.240.b: "Nous n'avons pas besoin d'eux ; ils ne sont plus rien ici"
 france_md.244.t: "La France pousse une législation sociale"
 france_md.244.d: "Suite à la victoire de La France insoumise en France, de nombreuses voix s'élèvent dans notre pays pour réclamer l'adoption de lois similaires à celles votées en France. Le succès d'une gauche de rupture en France semble déborder sur nous et sur d'autres pays de l'Union européenne. Partout dans nos pays, des mouvements s'organisent pour exiger les mêmes innovations législatives que nos voisins français. La plupart de ces propositions concernent surtout les droits de l'homme, la justice sociale et l'écologie. Devons-nous accepter et adopter ces lois pour nous-mêmes ? Cela pourrait être bénéfique pour nos concitoyens."
 france_md.244.a: "Ces lois pourraient être un bon ajout à notre constitution"
 france_md.244.b: "Non, ce ne sera pas possible"
 france_md.245.t: "La France pousse une législation écologique"
 france_md.245.d: "La victoire des écologistes en France a envoyé une onde de choc à travers l'Europe : un membre fondateur de notre Union pousse désormais une législation climatique plutôt que le récit du libre-échange et de la croissance sur lequel l'UE a été bâtie. Des militants ont déjà commencé à relayer cet élan dans notre propre pays. Devons-nous adopter une partie de leur programme, un geste envers nos forces progressistes mais un frein au développement économique, ou prendre clairement position avant que la situation n'évolue plus loin dans leur direction sans nous ?"
 france_md.245.a: "Nous aussi, nous devrions nous protéger du changement climatique"
 france_md.245.b: "Quel changement climatique ?"
 france_md.246.t: "Une France verte prend la Commission"
 france_md.246.d: "Suite au dernier vote de nomination de la Commission européenne, il semble que l'écologie l'ait emporté. Après la victoire des écologistes en France, Europe Écologie Les Verts s'est hissée au plus haut niveau de l'Union européenne, signe frappant de la marche croissante de l'Union vers les questions climatiques. Au-delà de sensibiliser nos citoyens, cette victoire renforce leur confiance en une Europe qui prend au sérieux leur sécurité climatique."
 france_md.246.a: "Allons-nous vers une Europe verte ?"
 france_md.248.t: "Les députés écologistes multiplient les actions au Parlement européen"
 france_md.248.d: "Depuis leur élection en France, les députés écologistes semblent s'être multipliés au Parlement européen. Il semblerait que l'on assiste à un regain d'intérêt pour les questions écologiques dans les États membres de l'Union européenne. Ce nombre de députés, qui paraît prendre de l'importance, semble de plus en plus façonner le rapport de forces au Parlement européen au point de devenir un enjeu pour les prochaines commissions européennes. Cette influence croissante des écologistes sur l'Union européenne semble aussi déborder sur notre pays, où elle influe non seulement sur la popularité de nos partis écologistes, mais où elle renforce la confiance en une Union européenne plus attentive aux questions sanitaires et écologiques."
 france_md.248.a: "Ils n'accompliront pas grand-chose au Parlement européen"
 france_md.249.t: "La France propose un Fonds de transition verte"
 france_md.249.d: "Cette fois, nos amis français sont venus avec une nouvelle proposition sur la table. Ils nous proposent la création d'un fonds participatif entre pays européens pour aider à la transition écologique. Ce fonds devrait nous permettre de développer notre secteur énergétique avec de l'énergie verte si possible. Ils mettent en avant cet outil comme un moyen de confirmer notre souveraineté énergétique et de la modeler sur une base durable. Cet outil s'accompagnerait toutefois d'une plus grande mobilisation de notre secteur civil en faveur de ces investissements. Devons-nous participer ?"
 france_md.249.a: "Où signe-t-on ?"
 france_md.249.b: "Non merci, nous nous en sortons très bien seuls"
 france_md.250.t: "La France propose de réduire les émissions de carbone européennes"
 france_md.250.d: "Nos amis écologistes français sont revenus avec une proposition de réduction drastique des émissions de carbone, offerte à nous comme à nos voisins alors que l'UE finalise son Pacte vert. Ils soutiennent que réduire l'usage des combustibles fossiles permettrait à nos peuples de mieux respirer et de bâtir la souveraineté énergétique de l'Union, puisque aucun de nos pays ne produit de pétrole. Une telle restructuration serait coûteuse et lente, mais pourrait s'avérer décisive si les tensions avec la Russie, notre principale source d'énergies fossiles, venaient à éclater."
 france_md.250.a: "Ils ont raison ; les énergies fossiles nous rendent vulnérables"
 france_md.250.b: "Je ne vois pas dans quel monde nous pourrions être en froid avec la Russie"
 france_md.251.t: "Ingérence de la France dans notre politique commerciale"
 france_md.251.d: "Notre ambassadeur en France rapporte que la présidence veut que nous régulions notre secteur alimentaire : certains de nos produits, prétendent-ils, sont impropres à la consommation, en particulier la viande produite avec des molécules de croissance interdites dans l'UE. Ne pas s'y conformer risque des mesures protectionnistes contre nos marchandises et des pressions sur le reste de l'Union pour qu'il suive, bien que l'industrie agroalimentaire française ait clairement intérêt à taxer nos exportations de concurrence déloyale. Réguler permettrait à notre propre peuple de mieux bénéficier de l'agriculture, mais cela plafonnerait la croissance de notre secteur agroalimentaire."
 france_md.251.a: "Ils ont raison ; ces réglementations sont nécessaires"
 france_md.251.b: "Je mets ce que je veux dans mon bétail."
 france_md.252.t: "La France propose d'établir des barrières douanières contre le Brésil"
 france_md.252.d: "Notre partenaire français nous presse d'interdire les importations brésiliennes, un litige né du refus du Brésil d'appliquer les restrictions sanitaires européennes à sa production agroalimentaire, laissant l'alimentation sud-américaine moins chère mais plus susceptible de contenir des produits dangereux pour nos citoyens. Les industries européennes parlent de concurrence déloyale ; les financiers parlent de libre-échange. Il est clair que l'industrie alimentaire française a alimenté la plainte, mais le risque sanitaire pour notre peuple n'en est pas moins réel."
 france_md.252.a: "Ils ont raison ; c'est de la concurrence déloyale"
 france_md.252.b: "Et le libre-échange dans tout ça ?"
 france_md.253.t: "Ingérence de la France dans notre politique commerciale"
 france_md.253.d: "Notre ambassadeur en France rapporte que la présidence veut que nous régulions notre secteur manufacturier et extractif : une grande partie de notre production ignore les normes industrielles européennes, tout en inondant leur marché, et leurs industries qualifient le déséquilibre commercial qui en résulte de concurrence déloyale. Nous avons besoin de l'Europe comme partenaire commercial, et refuser leurs normes risque des restrictions d'importation sur nos marchandises qui nous nuiraient bien davantage. S'y conformer nous permettrait de produire plus responsablement pour notre peuple et la planète, mais cela limiterait la croissance de notre secteur industriel."
 france_md.253.a: "Nous ne pouvons pas perdre nos partenaires européens"
 france_md.253.b: "Ils ont besoin de ces produits bon marché et ils le savent."
 france_md.254.t: "La France propose d'établir des barrières douanières contre la Chine"
 france_md.254.d: "Notre partenaire français nous presse d'interdire les importations chinoises, un litige né du refus de la Chine d'appliquer les restrictions industrielles européennes à sa propre production, laissant biens manufacturés et matières premières moins chers mais plus susceptibles d'être produits dans des conditions douteuses. Les industries européennes parlent de concurrence déloyale ; les financiers parlent de libre-échange. Il est clair que le secteur industriel français a alimenté la plainte, mais les dégâts que ces produits causent à la planète et à nos industries n'en sont pas moins réels."
 france_md.254.a: "Ils ont raison ; c'est de la concurrence déloyale"
 france_md.254.b: "Et le libre-échange dans tout ça ?"
 france_md.255.t: "Ingérence de la France dans notre politique commerciale"
 france_md.255.d: "Notre ambassadeur en France rapporte que la présidence veut que nous régulions notre secteur d'extraction et de raffinage pétrolier : une grande partie de notre production ignore les normes européennes d'extraction et industrielles, tout en inondant leur marché, et leurs industries qualifient le déséquilibre commercial qui en résulte de concurrence déloyale. Nous avons besoin de l'Europe, et refuser leurs normes risque des restrictions d'importation sur nos marchandises qui nous nuiraient bien davantage. S'y conformer nous permettrait de produire plus responsablement pour notre peuple et la planète, mais cela limiterait la croissance de nos compagnies pétrolières."
 france_md.255.a: "Nous ne pouvons pas perdre nos partenaires européens"
 france_md.255.b: "Bonne chance pour vous chauffer cet hiver."
 france_md.256.t: "La France propose d'établir des barrières douanières contre la Russie"
 france_md.256.d: "Notre partenaire français nous presse de restreindre les importations d'hydrocarbures russes, un litige né du refus de la Russie d'appliquer les réglementations européennes d'extraction et de raffinage, produisant du carburant dans des conditions déplorables pour la planète. Certains secteurs extractifs européens parlent de concurrence déloyale et veulent moins de dépendance aux puissances étrangères, mais la Russie pose peut-être moins de menace qu'on ne le croit, et leurs normes laxistes maintiennent nos coûts de carburant à bas niveau."
 france_md.256.a: "Ils ont raison ; nous devrions restreindre notre dépendance énergétique"
 france_md.256.b: "Et le libre-échange dans tout ça ?"
 france_md.257.t: "La France propose la création d'un grand plan autour du rail"
 france_md.257.d: "Nos partenaires français sont revenus avec un nouveau projet : recentrer le fret européen sur le rail plutôt que sur les camions, une idée portée par les écologistes français pour rendre le transport de marchandises plus efficace et écologique. Cela exigerait un réseau ferroviaire efficace et unifié, ce qui nous manque aujourd'hui, avec des décalages comme l'écartement différent de l'Espagne qui ralentit encore le trafic transfrontalier. Puisque la circulation du fret est au cœur de l'Union, et que le réseau pourrait aussi faciliter les déplacements des personnes, cela vaut la peine d'être poursuivi, même si cela s'avère coûteux face à un secteur du transport routier déjà florissant."
 france_md.257.a: "Comptez sur nous"
 france_md.257.b: "je préfère mon camion"
 france_md.258.t: "La victoire des communistes en France bouleverse notre politique intérieure"
 france_md.258.d: "La victoire du Parti communiste français a envoyé une onde de choc à travers l'Europe : un membre fondateur d'une Union bâtie en opposition au bloc communiste presse désormais son propre peuple de rejoindre la lutte, ravivant les peurs de l'URSS que beaucoup de pays croyaient depuis longtemps enterrées. Des militants ont déjà commencé à relayer cet élan dans notre propre pays. Devons-nous adopter une partie de leur programme pour couper court à la vague de protestation, un geste envers nos forces progressistes mais un frein au développement économique, ou prendre clairement position avant que la situation n'évolue plus loin sans nous ?"
 france_md.258.a: "Ce n'est pas une si mauvaise idée"
 france_md.258.b: "Plutôt mort que rouge"
 france_md.259.t: "Une main tendue par la France communiste"
 france_md.259.d: "Depuis sa création, notre État n'a cessé d'être sous la coupe de la Russie ou de la craindre. Pourtant, il semble que cette fois l'aide soit prête à arriver. Des diplomates français nous ont en effet proposé un partenariat stratégique pour nous préparer à l'éventualité d'un conflit avec la Russie. Pour l'heure, ce n'est pas grand-chose : quelques papiers, un peu de matériel, mais surtout la promesse d'un soutien à venir. Le plus surprenant, c'est que ce soutien vienne d'une France communiste. Ce qui n'est pas sans rappeler l'oppression que nous avons subie de la part des Soviétiques à une époque où le PCF était stalinien. Pouvons-nous faire confiance à la France et à l'Europe, sachant que cela ne fera que durcir la position de la Russie à notre égard ?"
 france_md.259.a: "Ce partenariat est notre salut"
 france_md.259.b: "Nous sommes capables de nous débrouiller seuls"
 france_md.260.t: "La France propose son aide contre la Russie"
 france_md.260.desc: "Quelques décennies hors de l'oppression soviétique n'ont pas dissipé la crainte du retour de la Russie, mais la France a proposé son aide en cas de conflit, partageant notre peur que l'expansionnisme russe se tourne de nouveau vers l'Europe de l'Est. Ses propositions vont du prêt de matériel aux échanges de compétences, une aide qui pourrait nous donner une chance de nous battre avant même que l'OTAN ne se mobilise, à condition toutefois que l'OTAN et l'Europe viennent vraiment à notre secours. Accepter nuirait aux relations avec Moscou ; les préserver est peut-être notre voie la plus sûre."
 france_md.260.a: "Nous n'avons besoin que de matériel pour tenir les Russes à distance"
 france_md.260.b: "Nous avons besoin d'entraînement pour mener une guerre de haute intensité"
 france_md.260.c: "Nous aurons besoin de produire davantage d'armements sur le long terme"
 france_md.260.d: "Nous n'avons pas besoin d'aide, la Russie n'est pas notre ennemi"
 france_md.261.t: "La France propose de formaliser notre alliance"
 france_md.261.desc: "Le triomphe d'un parti autrefois stalinien en France pose la question des relations avec un allié potentiel en Europe occidentale, qui a exprimé son hostilité à l'Occident et aux Américains et montré une proximité idéologique avec l'ancienne URSS, allant jusqu'à qualifier son héritage de positif. Paris a multiplié les déclarations dénonçant l'impérialisme américain et l'aveuglement européen à le suivre, et propose désormais une coopération qui pourrait aller du commerce à un partenariat militaire et stratégique complet, si nous jugeons leur ancienne allégeance soviétique suffisante pour leur faire confiance."
 france_md.261.a: "C'est toujours un plaisir de faire affaire avec vous"
 france_md.261.b: "En effet, nous devons nous protéger de l'impérialisme américain"
 france_md.261.c: "Rien ne séparera la fraternité communiste"
 france_md.261.d: "Nous ne coopérons pas avec les communistes"
 france_md.262.t: "La Russie accepte d'élargir nos relations commerciales"
 france_md.262.d: "La Russie a répondu positivement à notre proposition d'élargir les relations. Elle a proposé de partager avec nous son savoir-faire industriel et extractif à condition que nous l'aidions à établir ses secteurs nucléaire et tertiaire. C'est une avancée majeure dans nos relations avec la Russie. Nos propositions de partenariat stratégique potentiel ont toutefois été mises de côté. Il est probable que la Russie ne nous accorde pas encore suffisamment de crédit, mais ce premier pas dans notre direction est une bonne chose. Il faudra du temps, mais cet accord est le commencement de la fin pour les impérialistes."
 france_md.262.a: "La confiance se construit toujours sur le long terme"
 france_md.263.t: "La Russie accepte d'établir un partenariat militaire et commercial avec nous"
 france_md.263.d: "La Russie a répondu positivement à notre proposition d'élargir les relations. Elle a proposé de partager avec nous son savoir-faire industriel et extractif à condition que nous l'aidions à établir ses secteurs nucléaire et tertiaire. C'est une avancée majeure dans nos relations avec la Russie. La Russie a de plus proposé d'étendre ce partenariat d'une composante militaire destinée à nous entraîner conjointement pour être prêts lorsque la menace impérialiste passera à l'action. Elle nous fournira des terrains d'entraînement et son expertise de la toundra, et nous lui donnerons accès à notre expérience de la guerre en désert et en jungle."
 france_md.263.a: "Ensemble, nous sommes inarrêtables"
 france_md.264.t: "La Russie propose une alliance"
 france_md.264.d: "Nous ne nous attendions pas à une réponse aussi positive de notre partenaire russe. Ils ont proposé que nous formions une alliance contre l'impérialisme occidental. Combinant des éléments économiques et géostratégiques, cette alliance nous permettra de nous préparer économiquement, militairement et diplomatiquement à une confrontation avec l'Occident. Nous échangerons nos savoirs et nos traditions industrielles, ainsi que nos terrains d'entraînement et une garantie d'assistance mutuelle en cas de conflit. Nous n'avions pas conclu une telle alliance avec eux depuis la Première Guerre mondiale ; c'est peut-être un mauvais présage. Cette alliance est toutefois des plus bienvenues et nous permettra de survivre dans un monde largement hostile au communisme."
 france_md.264.a: "L'impérialisme occidental sera impuissant contre nous"
 france_md.265.t: "La Russie refuse d'élargir les relations avec nous"
 france_md.265.d: "À la grande surprise de nos diplomates, la Russie semble décliner toute forme de coopération avec la République française. Intérêts divergents. Manque de confiance. Il semble que le souvenir de l'URSS leur soit bien lointain. Peut-être la corruption occidentale a-t-elle enfin atteint la Russie, qui fut jadis le rempart contre l'impérialisme américain. Une chose est sûre : nous sommes seuls, seuls dans une Europe qui ne nous comprend pas et nous sera toujours hostile."
 france_md.265.a: "Nous sommes les vrais communistes !"
 france_md.266.t: "La France s'oppose à l'UE sur l'immigration"
 france_md.266.d: "Nos collègues du Front national dirigent la France depuis des mois, et depuis leur prise de fonctions ils n'ont cessé de critiquer les politiques migratoires européennes comme trop laxistes. Les forces libérales et socialistes ont longtemps réduit notre voix au silence sur ce point au sein de l'Union, mais avec nos alliés désormais triomphants à Paris, ils ne peuvent plus nous ignorer. Notre propre peuple, ayant lui-même embrassé les idéaux nationalistes, salue cette victoire comme la preuve que notre voix avait raison depuis le début dans une Europe qui s'était égarée."
 france_md.266.a: "C'est le commencement de la fin pour les libéraux"
 france_md.267.t: "La France s'oppose à l'UE sur l'immigration"
 france_md.267.d: "Depuis la victoire du Front national en France, les critiques affluent au Parlement européen, et le basculement semble avoir déclenché une vague à travers la politique européenne, les partis nationalistes et eurosceptiques enregistrant des scores toujours plus forts. Le débat se centre sur l'immigration, les parlementaires reflétant de plus en plus une opinion publique qui se tourne vers une vision nationaliste de la politique intérieure, dénonçant ce qu'ils voient comme une politique trop laxiste. Notre propre électorat n'y fait pas exception, et le bouleversement causé par la France commence à le ébranler aussi. Devons-nous combattre cette dérive nationaliste ou accepter la nouvelle orientation européenne telle qu'elle se dessine ?"
 france_md.267.a: "Ils n'ont pourtant pas tort"
 france_md.267.b: "L'Europe a déjà payé le prix du nationalisme"
 france_md.268.t: "La France gagne son procès à Bruxelles"
 france_md.268.d: "La politique française a pris un nouveau tournant : malgré leur euroscepticisme historique, le parti a conclu un accord avec l'Union européenne, utilisant les campagnes eurosceptiques chez eux et chez leurs alliés pour convaincre Bruxelles du danger qu'ils représentaient, et se servant désormais de cet effet de levier pour forcer l'UE à expulser les migrants illégaux. C'est un vrai succès pour leur présidence. Notre propre gouvernement nationaliste est confronté à la même question de souveraineté : faut-il rechercher les avantages de l'UE en échange d'un assouplissement de notre propre euroscepticisme, sachant qu'une grande partie de notre parti voit cette posture comme une valeur fondatrice ?"
 france_md.268.a: "Pourquoi négocier quand on peut simplement quitter l'Europe."
 france_md.268.b: "C'est malin, nous devrions faire de même"
 france_md.269.t: "La France plaide pour une identité européenne"
 france_md.269.d: "Ayant obtenu des concessions de Bruxelles sur la migration, la direction française semble désormais abandonner tout à fait sa rhétorique eurosceptique, allant jusqu'à promouvoir l'adhésion à l'Union européenne tant qu'elle continue de s'éloigner des tendances libérales et socialistes. Les mouvements nationalistes semblent se multiplier au sein même de l'Union, rendant une Europe des nations de nouveau attractive, même si un tel basculement pourrait inquiéter les électeurs attachés au rejet pur et simple de l'UE. Devons-nous suivre l'exemple de la France, surtout si la direction de l'UE continue de dériver vers nous ?"
 france_md.269.a: "C'est une très bonne initiative"
 france_md.269.b: "On ne peut être à la fois nationaliste et européen"
 france_md.270.t: "La France propose d'investir dans notre défense"
 france_md.270.d: "Ces dernières années, la possibilité d'une nouvelle guerre sur le continent européen semble plus réelle que jamais. Bien que notre Union n'ait encore subi aucune agression, les actions préoccupantes de notre voisin russe semblent confirmer cette crainte. La France est venue vers nous avec une offre : elle propose de nous aider à bâtir notre complexe militaro-industriel en y investissant. Avec ces usines d'armement, nous pourrions nous préparer efficacement au jour où nous devrons nous battre pour notre pays et nos partenaires européens. Toutefois, les laisser investir dans notre armement nous rendrait plus dépendants d'eux, ce qui n'est peut-être pas une bonne idée. De plus, notre population pacifiste pourrait s'inquiéter d'une telle mobilisation de notre capital."
 france_md.270.a: "Merci pour cette aide cruciale"
 france_md.270.b: "Il n'y a pas lieu de s'inquiéter"
 france_md.271.t: "La France reconnaît nos revendications en Ukraine"
 france_md.271.d: "Depuis que le pouvoir en France est passé au Front national, ils se sont montrés de plus en plus favorables à notre égard, rompant avec une Europe qui s'est toujours opposée à nos ambitions vers l'est. Non seulement ils se sont exprimés en faveur de nos revendications sur le territoire ukrainien, ils nous ont offert l'accès à leur territoire et à leurs ports pour y faire transiter troupes et marchandises, facilitant notre logistique et émoussant tout embargo européen futur. Ce nouvel allié nous confirme sur la voie d'une guerre que nous pourrions encore entreprendre."
 france_md.271.a: "Le premier domino tombe"
 france_md.271.b: "Nous n'avons aucune intention de combattre nos frères ukrainiens"
 france_md.272.t: "La France propose d'élargir notre coopération"
 france_md.272.desc: "Après de nombreuses déclarations et accords en notre faveur, la France semble prête à élargir les relations avec nous, se présentant comme une défenseure de la morale et de la foi dans une Europe et un Occident qu'elle juge désormais décadents. Nos relations pourraient progresser du commerce à un partenariat militaire et stratégique complet, si nous voyons assez de potentiel en ce nouvel allié, ou nous pouvons décliner si nous comptons encore sur de bonnes relations avec l'Union européenne telle qu'elle est."
 france_md.272.a: "Notre économie en bénéficiera"
 france_md.272.b: "Notre économie et nos armées en bénéficieront"
 france_md.272.c: "Le monde tremblera devant nous"
 france_md.272.d: "Nous n'entendons pas coopérer avec la France"
 france_md.273.t: "La Russie accepte d'élargir nos relations commerciales"
 france_md.273.d: "La Russie a répondu positivement à notre proposition d'élargir les relations. Elle a proposé de partager avec nous son savoir-faire industriel et extractif à condition que nous l'aidions à établir ses secteurs nucléaire et tertiaire. C'est une avancée majeure dans nos relations avec la Russie. Nos propositions de partenariat stratégique potentiel ont toutefois été mises de côté. Il est probable que la Russie ne nous accorde pas encore suffisamment de crédit, mais ce premier pas dans notre direction est une bonne chose. Il faudra du temps, mais cet accord est le commencement de la fin pour les ultra-mondialistes."
 france_md.273.a: "La confiance se construit toujours sur le long terme"
 france_md.274.t: "La Russie accepte d'établir un partenariat militaire et commercial avec nous"
 france_md.274.d: "La Russie a répondu positivement à notre proposition d'élargir les relations. Elle a proposé de partager avec nous son savoir-faire industriel et extractif à condition que nous l'aidions à établir ses secteurs nucléaire et tertiaire. C'est une avancée majeure dans nos relations avec la Russie. La Russie a de plus proposé d'étendre ce partenariat d'une composante militaire destinée à nous entraîner conjointement pour être prêts lorsque la menace ultra-mondialiste passera à l'action. Elle nous fournira des terrains d'entraînement et son expertise de la toundra, et nous lui donnerons accès à notre expérience de la guerre en désert et en jungle."
 france_md.274.a: "Ensemble, nous sommes inarrêtables"
 france_md.275.t: "La Russie propose une alliance"
 france_md.275.d: "Nous ne nous attendions pas à une réponse aussi positive de notre partenaire russe. Ils ont en effet proposé que nous formions une alliance garantissant une assistance mutuelle en cas d'agression par des puissances étrangères. Combinant des éléments économiques et géostratégiques, cette alliance nous permettra de nous préparer économiquement, militairement et diplomatiquement à une confrontation avec le reste du monde. Cette alliance nous donnera la force de nous battre jusqu'au bout pour nous défendre contre l'ultra-mondialisme dans lequel nos voisins se sont enfoncés. Nous n'avions pas conclu une telle alliance avec eux depuis la Première Guerre mondiale ; c'est peut-être un mauvais présage. Cette alliance est toutefois des plus bienvenues et un succès majeur pour notre politique."
 france_md.275.a: "Nous sommes protégés contre la décadence libérale"
 france_md.276.t: "La Russie refuse d'élargir les relations avec nous"
 france_md.276.d: "À la grande surprise de nos diplomates, la Russie semble décliner toute forme de coopération avec la République française. Intérêts divergents. Manque de confiance. Peut-être la corruption occidentale a-t-elle enfin atteint la Russie, qui fut jadis forte et fière. Ce revirement n'est toutefois pas dramatique ; peut-être n'avions-nous pas tant en commun après tout. Nous trouverons sûrement d'autres alliés nationalistes sur le continent."
 france_md.276.a: "C'est dommage"
 france_md.277.t: "La France propose de nous protéger contre l'influence russe"
 france_md.277.d: "Depuis plusieurs années, les Russes semblent avoir investi le continent africain, offrant leurs services pour lutter contre les insurrections djihadistes et indépendantistes qui fleurissent dans les pays de l'ancienne Afrique française. La France et la Russie sont clairement en conflit d'influence sur ce continent. Avec eux, les valeurs s'affrontent : libéralisme occidental et autoritarisme. Dans cette situation où nous, pays africains, sommes la cible de l'influence russe, qui peut parfois aggraver les tensions entre minorités régionales, la France propose de nous aider à réduire leur présence en nous assistant à leur place. Cela signifierait toutefois nous rapprocher de nos anciens colonisateurs, ce qui n'est peut-être pas une bonne idée. Que décider."
 france_md.277.a: "Ils ont raison ; l'influence russe est dangereuse"
 france_md.277.b: "Nos anciens colonisateurs. Certainement pas"
 france_md.278.t: "La Commune de France quitte l'Union européenne"
 france_md.278.d: "Il y a quelques mois, la France a annoncé la fin de la République au profit de la Commune de France, une nouvelle entité fondée sur le communisme révolutionnaire, et il n'a pas fallu longtemps pour qu'elle quitte notre Union européenne, bâtie qu'elle est sur le libéralisme économique que leur nouvelle orientation rejette désormais. La sortie a été immédiate et définitive, sans intention apparente de négocier. Cela ne présage rien de bon pour un continent dont l'Union existait avant tout pour prévenir de nouveaux conflits, et une sortie brutale associée à une idéologie si révolutionnaire devra tôt ou tard être confrontée."
 france_md.278.a: "C'était à prévoir"
 france_md.279.t: "La Commune de France fait pression sur notre politique"
 france_md.279.d: "Comme prévu, la sortie de la Commune de France de l'Union européenne n'était pas une impasse ; à peine libre, elle relance déjà son économie, et son succès commence à gagner l'admiration de ceux, chez nous, qui n'ont pas grand amour pour les valeurs libérales européennes. Les services de renseignement français, remodelés en un service de propagande internationale, aident à former ces agitateurs, et nous ferions bien de prendre cela au sérieux avant de nous retrouver dans leur situation. Nous pouvons défendre les valeurs européennes et la paix qu'elles apportent, ou adopter leur programme nous-mêmes pour émousser la violence à venir, même si cela signifie embrasser une politique communiste et anti-européenne."
 france_md.279.a: "Inutile de se battre si nous pouvons les battre à leur propre jeu"
 france_md.279.b: "Nous devons combattre ces extrémistes"
 france_md.280.t: "La Commune de France nous invite à un sommet sur la révolution mondiale"
 france_md.280.d: "Ayant assuré leur contrôle à l'intérieur, les communistes révolutionnaires de France entendent désormais exporter leur révolution, nous invitant à un sommet sur la révolution mondiale parce que notre propre gouvernement s'est déjà rangé du côté des valeurs communistes chères à la nouvelle Commune de France. Ils sont déterminés à répandre ces valeurs dans le monde entier, et cette invitation est sûrement un test pour savoir si nous les suivrions. Une telle révolution ne viendra pas sans guerre, probablement sanglante, tant de grandes puissances ne l'accepteront jamais. Les idéaux communistes nous sont chers, mais sommes-nous prêts à risquer la vie de nos citoyens pour les réaliser ?"
 france_md.280.a: "Comptez sur nous, vive la révolution"
 france_md.280.b: "L'histoire a prouvé que la liberté ne s'apporte pas à la pointe du fusil"
 france_md.281.t: "L'Empereur entreprend de profondes réformes des forces armées françaises"
 france_md.281.d: "Notre Empereur a entrepris de profondes réformes de nos forces armées, visant à les rendre plus adaptables aux guerres que nous pourrions être amenés à mener. Les mener à bien exige de lourds investissements et toute notre attention, laissant moins de place à une préparation immédiate ; nous serons donc plus vulnérables un temps avant de pouvoir reprendre le renforcement de nos forces. Cette première vague vise le commandement de l'armée lui-même, jugé inapte aux réformes à venir, et la refonte de la chaîne de commandement devrait prendre un peu moins d'un an, une année pendant laquelle nous devrons limiter nos opérations militaires pour un gain à long terme."
 france_md.281.a: "Ces réformes sont nécessaires"
 france_md.282.t: "Nos réformes de l'état-major sont achevées"
 france_md.282.d: "Nos réformes ont été achevées en un temps record. Certains ont résisté, mais la plupart de notre état-major a accepté la refonte de la chaîne de commandement. Au-delà de rendre notre commandement plus efficace, ces réformes ouvrent la porte à de nouveaux généraux talentueux, au prix d'une formation plus poussée, et elles ne sont que la première pierre de la transformation de nos forces armées. Dans les mois à venir, d'autres réformes définiront les moyens et objectifs de nos forces et donneront à notre complexe militaro-industriel un carnet de commandes plus clair. C'était un pari à long terme, et nous semblons l'avoir gagné."
 france_md.282.a: "Nous avons tenu bon. Passons maintenant à des questions plus importantes"
 france_md.283.t: "L'épine dorsale de notre armée"
 france_md.283.d: "Le premier ensemble de réformes concernant notre approche du champ de bataille est arrivé, définissant la stratégie à employer dans tout conflit de grande ampleur contre un adversaire futur. Depuis notre refonte d'après la Seconde Guerre mondiale, nos armées ont toujours privilégié des stratégies offensives fondées sur la mobilité et la manœuvre, et nous pourrions approfondir cela en centrant notre doctrine et nos commandes d'équipement sur les chars d'assaut et la capture rapide d'objectifs. L'alternative est de nous concentrer plutôt sur l'infanterie, en renforçant son rôle et son équipement pour répondre aux contre-attaques ennemies par une puissance de feu supérieure, une approche plus sûre mais qui remettrait en question notre doctrine passée."
 france_md.283.a: "L'infanterie a toujours joué un rôle central ; c'est l'approche la plus sûre"
 france_md.283.b: "Notre armée s'est construite autour d'une guerre de mouvement depuis la guerre froide, et il n'y a aucune raison que cela change"
 france_md.284.t: "Notre puissance de feu"
 france_md.284.d: "Une dernière vague de réforme doctrinale est arrivée, nous forçant à décider comment notre armée détruit les forces ennemies à distance. Nous avons longtemps équilibré artillerie et aviation, mais la route à venir exige une spécialisation. Nos canons Caesar sont mobiles et efficaces, nous permettant de bombarder les troupes ennemies en sécurité. Notre armée de l'air et nos hélicoptères offrent une puissance de feu polyvalente, mais restent vulnérables à la défense antiaérienne ennemie, et perdre le contrôle du ciel pourrait s'avérer désastreux. Nous devons choisir entre un risque minimal et une plus grande puissance de feu."
 france_md.284.a: "L'artillerie est plus rentable"
 france_md.284.b: "Notre aviation est très efficace ; ce serait sot de ne pas l'utiliser"
 france_md.285.t: "Notre position vis-à-vis de l'Union européenne"
 france_md.285.d: "Trop longtemps, notre nation a priorisé l'Union européenne au détriment de son propre développement. Mettre de côté notre développement et notre sécurité nous a menés à une crise démocratique sans précédent, dont nous sommes néanmoins sortis vainqueurs. Mais aujourd'hui nous avons l'occasion d'inverser cette tendance. Libérés des institutions démocratiques passées, nous sommes libres de faire nos propres choix et pouvons quitter l'Union européenne si nous le souhaitons. Toutefois, partir du jour au lendemain pourrait porter un coup sévère à notre nation à peine remise de l'oppression libérale. Faut-il négocier avec l'Union européenne pour monnayer notre retour parmi eux, ou sceller notre rupture en achevant notre départ de l'Union européenne ?"
 france_md.285.a: "Videz les poches de Bruxelles ou nous partons !"
 france_md.285.b: "L'Union européenne nous a assez nui. Frexit !"
 france_md.286.t: "La France quitte l'Union européenne"
 france_md.286.d: "Suite à un bouleversement majeur chez notre partenaire français, des mouvements nationalistes se réclamant du bonapartisme se sont emparés de la France. Aussitôt, ils se sont employés à détruire ce qui restait du sentiment pro-européen en France. Ils annoncent désormais le départ de la France de l'Union européenne. Ils ont montré un refus catégorique de négocier. La victoire de ces mouvements nationalistes n'est pas seulement une fissure dans le projet de construction européenne, mais un modèle pour les eurosceptiques de toute l'Union."
 france_md.286.a: "Le nationalisme est un danger pour notre Union européenne"
 france_md.287.t: "L'Union européenne plie devant nos exigences"
 france_md.287.d: "Il semble que nous ayons pris la bonne décision en négociant notre retour dans les institutions européennes. Non seulement nous avons évité une crise économique, mais nous avons aussi extrait des fonds de la Banque centrale européenne. Voilà ce qu'on peut appeler une opération financière réussie ! Nul doute que nous affronterons tôt ou tard nos partenaires sur le champ de bataille, mais qu'ils sommeillent dans l'illusion. Une chose est sûre : nos adversaires doivent être furieux que nos négociations avec la BCE aient abouti."
 france_md.287.a: "Notre heure viendra"
 france_md.288.t: "Nos négociations échouent"
 france_md.288.d: "Notre tentative était audacieuse mais s'est révélée infructueuse. Peut-être avons-nous trop demandé, ou n'avons-nous pas inspiré confiance à nos interlocuteurs européens. En tout cas, la BCE a refusé de nous payer pour rester. C'est leur décision, et elle ne sert pas nos intérêts, mais c'est la réalité. Nous devons désormais décider si nous restons dans l'Union européenne. Le départ serait économiquement coûteux, mais rester confirmerait notre échec devant l'Union. Quoi qu'il en soit, nous les affronterons tôt ou tard sur le champ de bataille, avec ou sans appartenance à l'Union européenne. La seule question est de savoir si le coût monétaire du départ dépasse le coût moral de rester."
 france_md.288.a: "Quitter l'Union nous coûterait trop cher ; pour l'heure, nous ne pouvons pas nous le permettre"
 france_md.288.b: "Nous n'avons plus rien à faire ici"
 france_md.289.t: "La France obtient un arrangement avec l'Union européenne"
 france_md.289.d: "Après des mois de pression diplomatique et de menaces de départ, la France bonapartiste a plié l'Union européenne à sa volonté, monnayant son appartenance contre des avantages supplémentaires pour rester. Cet accord est désastreux pour nous et nos partenaires : rien ne garantit que la France se comportera maintenant que des nationalistes obsédés par la revanche la contrôlent. La France reste un membre essentiel, mais elle est aujourd'hui un danger pour tout le continent, et notre peuple doit payer le prix des caprices de son partenaire."
 france_md.289.a: "Était-ce vraiment une bonne idée ?"
 france_md.290.t: "L'aube d'un nouvel Empire"
 france_md.290.d: "Après des mois de troubles intérieurs et de réforme constitutionnelle, nous avons réussi. Nous avons éradiqué les institutions et le pouvoir de la honteuse République. Désormais la France doit devenir ce qu'elle n'aurait jamais dû cesser d'être : un Empire ! Pour célébrer le retour de l'empire, nous avons préparé une grande fête diffusée dans toute la France. Par cet événement, notre peuple saisira notre force et notre détermination à rendre à la France sa gloire d'antan. Cette célébration enverra aussi un message clair à nos adversaires : une démonstration de puissance. Désormais ils ne peuvent plus nous ignorer ; leurs jours sont comptés avant que la France ne vienne réclamer son dû. Cette fois, nulle coalition ne pourra nous arrêter !"
 france_md.290.a: "L'Empire recouvrera sa grandeur d'antan !"
 france_md.291.t: "La France appelle à une union des nationalismes"
 france_md.291.d: "La victoire de nos camarades nationalistes en France a ébranlé l'Europe, et les Bonaparte ont pivoté leur politique étrangère contre l'Union européenne, ses valeurs et son avenir. Ils nous ont désormais tendu la main, estimant que notre gouvernement partage assez de leur caractère pour faire cause commune. Une alliance tacite avec la France paraît attractive, mais rien ne garantit qu'ils ne se retourneront pas contre nous ensuite. Nous devons peser soigneusement les conséquences."
 france_md.291.a: "Ils sont sur la bonne voie ; nous ferions bien de les rejoindre"
 france_md.291.b: "Nous ne partageons pas cette vision du nationalisme"
 france_md.292.t: "La France bonapartiste fait pression sur notre politique"
 france_md.292.d: "Comme nous l'avions anticipé, la rhétorique nationaliste et anti-européenne de la France n'était pas un accident : depuis que les Bonaparte ont pris le pouvoir, l'Union européenne est devenue la cible des nationalistes partout. Des pans de notre population craignent désormais le retour de la guerre, tandis que d'autres ont rejoint la cause nationaliste et mené des opérations de déstabilisation contre notre gouvernement, largement soutenues et formées par le renseignement français agissant comme un appareil de propagande internationale. Nous devons prendre cela avec le plus grand sérieux, car leur but est de nous diviser. L'Union européenne doit rester unie !"
 france_md.292.a: "L'Europe finira par vaincre le nationalisme"
 france_md.293.t: "Entouré d'ennemis"
 france_md.293.d: "Comme aux jours des guerres révolutionnaires, il semble que les changements nécessaires dans notre nation engendrent du ressentiment. Tandis que nous reconstruisons, nos ennemis conspirent déjà contre nous et se préparent à la confrontation. Ils ont raison d'être prudents, car nous sommes prêts à reprendre nos territoires par la force si besoin. Quoi qu'il en soit, nous nous tenons isolés face à une Europe qui nous voit à juste titre comme une menace. Pour l'heure, nous devons avant tout nous préparer à des années de conflit avec nos adversaires. Nous pourrons peut-être forger des alliances, mais nous devons surtout compter sur nous-mêmes. Mais une chose est sûre : une fois vaincue la menace européiste et atlantiste, nous serons inarrêtables."
 france_md.293.a: "Combien de coalitions Napoléon a-t-il vaincues ? Nous en ferons notre affaire"
 france_md.294.t: "La France propose que nous rejoignions son alliance"
 france_md.294.d: "Nous venons de recevoir une proposition de diplomates français. Observant qu'ils sont isolés en Europe et cernés d'ennemis de leur propre fait, les Bonaparte ont fait appel à nous. Précisément parce qu'ils jugent notre nation suffisamment respectable pour mériter une alliance avec eux. Il va sans dire que ce n'est pas un simple pacte défensif et que nous y joindre nous entraînerait vite dans des conflits qui ne sont pas nécessairement les nôtres. Toutefois, cette alliance pourrait nous servir à affronter nos propres adversaires, et toutes choses égales, mieux vaut être avec eux que contre eux. Une alliance avec la France paraît tentante, mais les rejoindre serait peut-être un billet tout droit pour l'enfer, puisqu'ils apporteront bientôt la guerre en Europe."
 france_md.294.a: "Nous pouvons tirer parti de cette alliance"
 france_md.294.b: "Certainement pas"
 france_md.295.t: "La France propose que nous rejoignions son Komintern"
 france_md.295.d: "Les factions communistes révolutionnaires qui dirigent la France ont développé un appétit pour le conflit, poursuivant la révolution mondiale et recrutant des alliés pour l'exporter par tous les moyens. Elles ont fait appel à nous, d'autant que nous aussi avons embrassé le socialisme, offrant une chance de vaincre le capitalisme et le fascisme sur le champ de bataille. Toutefois, ce n'est pas un simple pacte défensif, et nous y joindre nous entraînerait vite dans des conflits qui ne sont pas nécessairement les nôtres."
 france_md.295.a: "Ils ont raison ; il est temps d'exporter la révolution"
 france_md.295.b: "Certainement pas"
 france_md.296.t: "Le peuple français nous a poussés à attaquer"
 france_md.296.d: "Notre propagande nationaliste incessante a trop bien fonctionné : convaincu que des puissances rivales cherchent notre destruction, le public s'attend désormais à ce que nous frappions les premiers. Des milices se sont rassemblées aux frontières, prêtes à affronter les forces de sécurité de nos voisins, et l'opinion publique bouillonne. Nous devons veiller à ne pas effrayer ces puissances au point qu'elles s'allient contre nous prématurément."
 france_md.296.a: "Il est temps de régler les comptes"
 france_md.296.b: "Notre heure viendra"
 france_md.297.t: "Escarmouches dans le tunnel sous la Manche"
 france_md.297.d: "Des milices françaises ultra-nationalistes, enhardies par leur nouveau chef bonapartiste, ont attaqué nos citoyens et nos policiers autour du tunnel sous la Manche, tuant une vingtaine de personnes et en blessant des dizaines. Nous n'étions pas seuls : la nuit dernière, ces groupes ont frappé la plupart des voisins de la France qui partagent notre défi au nouvel Empire napoléonien. Nous sommes visiblement une cible de premier plan, et la confrontation avec la France bonapartiste semble désormais inévitable."
 france_md.297.a: "Nous devons contenir l'agression française en protégeant leurs cibles potentielles"
 france_md.297.b: "Nous devons nous préparer au conflit avec eux"
 france_md.298.t: "Escarmouches à la frontière française"
 france_md.298.d: "Des milices françaises ultra-nationalistes, enhardies par leur nouveau chef bonapartiste, ont attaqué nos citoyens et nos policiers le long de notre frontière commune, tuant une quinzaine de personnes et en blessant des dizaines. Nous n'étions pas seuls : la nuit dernière, ces groupes ont frappé la plupart des voisins de la France, toutes cibles potentielles de l'expansionnisme bonapartiste. Nous sommes visiblement une cible de premier plan, et la confrontation avec le nouvel Empire napoléonien semble désormais inévitable."
 france_md.298.a: "Nous devons contenir l'agression française en protégeant leurs cibles potentielles"
 france_md.298.b: "Nous devons nous préparer au conflit avec eux"
 france_md.298.c: "Il n'y a pas lieu de s'inquiéter"
 france_md.299.t: "[FROM.GetName] nous appelle à l'aide"
 france_md.299.d: "Face à la nouvelle menace imminente posée par la France, les autres nations attaquées n'ont pas tardé à réagir. Comme beaucoup d'autres, [FROM.GetName] nous appelle à l'aide pour se défendre contre une invasion potentielle. Certes, ils seront probablement attaqués plus tôt que nous. Mais sommes-nous vraiment prêts à les protéger ? Devons-nous sacrifier des mois de notre préparation pour [FROM.GetName] ? Cette crise a bouleversé notre politique étrangère et les demandes d'aide affluent. Deux voies s'offrent à nous : nous pouvons aider [FROM.GetName] en l'ajoutant à notre partenariat stratégique, ou les laisser affronter Napoléon seuls. Après tout, il y a du mérite à le laisser s'user contre un adversaire comme [FROM.GetName]."
 france_md.299.a: "Nous devons les protéger"
 france_md.299.b: "Pourquoi mourir pour [FROM.GetName]"
 france_md.300.t: "La France propose que nous rejoignions son alliance"
 france_md.300.d: "Le chef bonapartiste de la France a attiré l'ire de l'Europe, se déclarant prêt à la guerre pour restaurer la grandeur de sa nation, et nous tend désormais la main. Les diplomates français invoquent l'histoire, rappelant comment Napoléon aida jadis le peuple polonais contre l'oppression slave et germanique, et proposent de renouveler ce pacte. Une telle alliance nous protégerait contre la menace russe toujours présente, mais pourrait aussi nous entraîner dans des guerres ingagnables."
 france_md.300.a: "Nous serons les nouveaux Dombrowski et Kniaziewicz !"
 france_md.300.b: "Mourir pour Paris ? Je vous le demande"
 france_md.301.t: "La France propose que nous rejoignions son alliance"
 france_md.301.d: "Le chef bonapartiste de la France a attiré l'ire de l'Europe, se déclarant prêt à la guerre pour restaurer la grandeur de sa nation, et nous tend désormais la main. Les diplomates français invoquent la descendance de notre maison royale de Jean-Baptiste Bernadotte, maréchal de Napoléon, et proposent d'unir nos efforts en mémoire de nos ancêtres. Une telle alliance nous protégerait contre la menace russe toujours présente, mais pourrait aussi nous entraîner dans des guerres ingagnables."
 france_md.301.a: "Il est temps de reprendre du service"
 france_md.301.b: "Le passé est le passé"
 france_md.302.t: "Les États-Unis, amis ou ennemis"
 france_md.302.desc: "Ayant envoyé des propositions d'alliance aux quelques alliés potentiels que nous pouvons trouver en Europe, une question demeure : comment traiter avec les États-Unis ? Pendant la Révolution et sous Napoléon, nous avons entretenu de bonnes relations avec eux, partageant une haine commune de l'Angleterre. Mais les temps ont changé. La Seconde Guerre mondiale et la conduite américaine en Europe ont souvent couru à l'encontre des intérêts français, et si les relations ont tenu jusqu'à notre arrivée au pouvoir, Washington pourrait désormais barrer notre route vers l'hégémonie."
 france_md.302.a: "Leur proposer de rejoindre notre alliance"
 france_md.302.b: "Leur puissance commerciale nous aidera à surmonter les sanctions internationales"
 france_md.302.c: "Nous préparer à la confrontation avec eux"
 france_md.302.d: "Assurer l'Europe reste notre priorité"
 france_md.303.t: "La France nous propose une alliance"
 france_md.303.d: "Le chef bonapartiste de la France a attiré l'ire de l'Europe et propose désormais une alliance, à condition que nous n'intervenions pas dans leurs affaires. Les diplomates français soulignent que Napoléon et la France révolutionnaire ont longtemps été des alliés vitaux pour nous. Mais la France s'est consacrée à combattre d'autres puissances européennes, dont beaucoup sont nos propres alliés, et a déclaré le Royaume-Uni comme cible prioritaire, notre allié historique et un partenaire précieux. Devons-nous rejoindre la France et risquer la guerre avec Londres ?"
 france_md.303.a: "Ils peuvent compter sur nous"
 france_md.303.b: "Les Anglais sont nos alliés avant tout"
 france_md.304.t: "La France propose d'élargir nos relations commerciales"
 france_md.304.d: "Le chef bonapartiste de la France a attiré l'ire de l'Europe et propose désormais d'élargir nos relations commerciales, car son économie, isolée par l'hostilité envers d'anciens partenaires, a plus que jamais besoin de notre expertise et de notre puissance industrielle. Les diplomates français soulignent que Napoléon et la France révolutionnaire ont longtemps été des alliés vitaux pour nous. Mais la France s'est consacrée à combattre d'autres puissances européennes, dont la plupart sont nos propres alliés, et soutenir son effort de guerre par le commerce pourrait attirer leur désapprobation."
 france_md.304.a: "Plus de commerce, c'est toujours bon"
 france_md.304.b: "Nous ne serons pas leurs complices"
 france_md.305.t: "La France quitte l'Union européenne"
 france_md.305.d: "Suite à une crise majeure chez nos partenaires français. Des mouvements nationalistes appelant au retour de la monarchie absolue se sont emparés de l'État français. Depuis, ils se sont employés à détruire ce qui restait du sentiment pro-européen en France. Ils annoncent désormais le retrait de la France de l'Union européenne. Ils ont affiché un refus catégorique de négocier. La victoire de ces mouvements nationalistes n'est pas seulement une fissure dans l'unité européenne, mais aussi un modèle pour tous les eurosceptiques au sein de l'Union."
 france_md.305.a: "Le nationalisme est une menace pour notre Union européenne"
 france_md.306.t: "Les monarchistes triomphent en France"
 france_md.306.d: "La victoire de nos camarades monarchistes en France a ébranlé toute l'Europe : qu'un pilier de l'Union embrasse le nationalisme a suffi à enrager Bruxelles. Les royalistes ont orienté leur politique étrangère contre l'Union européenne, ses valeurs et son avenir, tout comme nous, monarchistes, avons longtemps lutté contre une Union qui voulait nous faire taire. À travers l'Europe, l'exemple français semble enhardir l'opposition à la bureaucratie européenne. Notre propre pays est déjà engagé dans la cause monarchiste, si bien que la victoire de la France est une victoire pour les nationalistes européens partout."
 france_md.306.a: "Une victoire du nationalisme en Europe"
 france_md.307.t: "Le Royaume de France fait pression sur notre politique"
 france_md.307.d: "Comme nous l'avions prévu, la rhétorique nationaliste et anti-européenne de la France n'était pas un accident : depuis la victoire de la monarchie, l'Union européenne est devenue la cible des nationalistes partout, et la France a montré une volonté claire de faire la guerre à ceux qu'elle considère comme ennemis. Une partie de notre population craint désormais le retour de la guerre, tandis que d'autres, déjà tièdes envers l'Europe, se sont rangés du côté des nationalistes et ont mené des actions de déstabilisation contre notre gouvernement, aidés et formés par les services de renseignement français devenus machine de propagande internationale. Nous devons prendre cela au sérieux : leur but est de nous diviser."
 france_md.307.a: "L'Europe finira par vaincre le nationalisme"
 france_md.308.t: "La France nous invite à rejoindre sa croisade"
 france_md.308.d: "La victoire de nos camarades nationalistes en France a ébranlé toute l'Europe. Au-delà de l'Union, qu'il voit comme son adversaire, le royaume de France a déclaré qu'il protégerait la foi chrétienne à travers l'Europe et le monde, dénonçant la démocratie occidentale comme une perversion qui a éloigné les peuples de la religion, et appelant au retour de l'Église au pouvoir. Comme notre pays a une majorité chrétienne, cet appel nous est en partie destiné : ils proposent que nous nous unissions pour restaurer le christianisme dans sa puissance d'antan. L'invitation pourrait nous apporter le pouvoir au service de Notre Seigneur, mais garantit le retour de la guerre en Europe."
 france_md.308.a: "Nous rejoindrons leur croisade"
 france_md.308.b: "Nous ne partageons pas cette vision du christianisme"
 france_md.309.t: "Préparer la Dixième Croisade"
 france_md.309.d: "Depuis des semaines, notre roi a montré une détermination inébranlable à reconquérir la Terre sainte, bien que nous n'ayons aucun pied-à-terre dans la région. Nos partenaires libanais entretiennent des relations cordiales avec nous, mais leur gouvernement est trop instable et sous influence iranienne pour aider, malgré la importante minorité chrétienne maronite du Liban qui en ferait un point de débarquement idéal pour notre croisade. Nous pourrions préparer une intervention amphibie, ce qui renforcerait notre marine mais nous marquerait comme agresseurs contre un État innocent, ou exercer une pression politique, ce qui comporte moins de risques mais nulle garantie de succès."
 france_md.309.a: "Nous devrions d'abord leur demander (poliment, bien sûr)"
 france_md.309.b: "Ceux qui ne sont pas avec nous sont de toute façon contre nous"
 france_md.310.t: "Le Royaume de France menace notre indépendance"
 france_md.310.d: "Le Royaume de France a annoncé il y a des mois son intention de reconquérir la Terre sainte, préparant une Dixième Croisade vers Jérusalem. Pour cela, ils ont besoin d'un pied-à-terre près de Jérusalem, et la forte minorité maronite de notre pays nous a mis dans leur viseur. Des agitateurs français s'emploient désormais à saper notre légitimité et à pousser les Maronites à renverser notre gouvernement. Un contrôle français pourrait nous protéger des ingérences d'Israël et du Hezbollah, mais déchirerait probablement notre pays dans une guerre fratricide. Est-ce vraiment ce que nous voulons ?"
 france_md.310.a: "Ils nous protégeront contre nos voisins belliqueux"
 france_md.310.b: "Ils n'apporteront que davantage de conflits !"
 france_md.311.t: "Le Liban plie devant nos exigences"
 france_md.311.d: "Ce matin est un grand jour. Suite à nos pressions, le gouvernement libanais a annoncé sa reddition aux exigences des manifestants chrétiens maronites. Aussitôt, un gouvernement à majorité maronite a été nommé et a placé le Liban sous notre protection. Nous avons fait le bon choix en privilégiant la diplomatie ; les puissances occidentales n'y trouveront rien à redire puisque cela affaiblit l'influence de l'Iran. Nous avons bien manœuvré géopolitiquement. Il ne reste plus qu'à nous préparer à un conflit terrestre contre ceux qui se dresseraient entre nous et le Royaume des Cieux."
 france_md.311.a: "Jérusalem est à notre portée"
 france_md.312.t: "Le Liban nous refuse"
 france_md.312.d: "Ce matin, le Liban a publiquement annoncé son refus de céder à la pression française sur sa politique. Nos agitateurs n'ont apparemment eu aucun effet, et le soutien maronite à notre cause n'a pas suffi. Notre échec tient probablement à ce que le Liban reste fermement sous le contrôle de l'Iran et du Hezbollah. Le refus du Liban de travailler avec nous n'est toutefois pas la fin. Nous pourrons toujours y revenir quand nous en aurons besoin, et cette fois ils ne pourront pas résister. Toutefois, nos efforts politiques semblent avoir échoué. Peut-être devrions-nous nous concentrer sur la manière dont nous faisons pression sur les autres et renforcer notre diplomatie internationale, car nous pourrions en avoir besoin à l'avenir."
 france_md.312.a: "Préparer une intervention navale"
 france_md.312.b: "Nous devons renforcer notre diplomatie ; elle ne semble pas être notre point fort"
 france_md.313.t: "La Commune de France exige la chute de notre gouvernement"
 france_md.313.d: "Il y a des mois, la Commune de France a annoncé son désir d'apporter la révolution au monde, et semble désormais faire pression sur nous. Des agitateurs de propagande ont infiltré notre population, incitant les citoyens à rejoindre leur cause, et des groupes de manifestants et d'extrémistes communistes se sont déjà organisés. Des émissaires français ont menacé d'intervenir si nous ne cédons pas. Nous pourrions nous rendre et rejoindre la France, perdant notre indépendance, ou emprisonner les extrémistes qui menacent notre gouvernement."
 france_md.313.a: "Vive la révolution"
 france_md.313.b: "Plutôt mort que rouge"
 france_md.314.t: "[FROM.GetName] rejoint la révolution mondiale"
 france_md.314.d: "[FROM.GetName] vient d'annoncer la chute de son gouvernement face à nos protestations et à notre pression diplomatique. C'est une excellente nouvelle pour nous ; un nouveau pouvoir rejoint la révolution, et tout cela sans effusion de sang. D'autres puissances capitalistes ont annoncé leur stupeur face à ce changement dramatique de l'ordre mondial. Elles peuvent protester, mais elles ne peuvent pas s'opposer à la volonté du peuple. La révolution viendra aussi pour elles. La chute de [FROM.GetName] n'est que le commencement ; d'autres suivront."
 france_md.314.a: "La Révolution grandit"
 france_md.315.t: "[FROM.GetName] refuse la volonté du peuple"
 france_md.315.d: "Les manifestations exigeant la chute du gouvernement de [FROM.GetName] semblent s'être dissipées. En effet, le gouvernement de [FROM.GetName] les a violemment réprimées et a refusé tout compromis. Si cet éclat semble avoir triomphé de la volonté du peuple, peut-être devrions-nous nous impliquer davantage dans la révolution à [FROM.GetName]. Nos forces sont prêtes à intervenir militairement pour faire respecter la volonté du peuple souverain. Toutefois, cette intervention pourrait dégénérer en un conflit de grande ampleur. Faut-il intervenir ou non ?"
 france_md.315.a: "La Révolution viendra qu'ils le veuillent ou non"
 france_md.315.b: "Nous reviendrons"
 france_md.316.t: "La Commune victorieuse en Europe"
 france_md.316.d: "C'est un grand jour pour notre Commune : nous avons apporté la révolution à toute l'Europe. Depuis la chute de l'Union soviétique, le continent grouillait de capitalistes et de nationalistes en herbe, mais rien ne nous a arrêtés, ni les sanctions, ni les bombardements, ni les guerres que nous avons menées pour porter le prolétariat au pouvoir. Parfois il a fallu enseigner une leçon aux oppresseurs à coups de canons, mais le triomphe de la révolution justifie les moyens. Tandis que l'armée du peuple défile à Paris, l'Europe commence à se reconstruire sur des bases saines, loin du capitalisme. Notre prochain objectif est de réaliser le rêve des internationalistes partout : une grande fédération où tous les travailleurs se sentent chez eux."
 france_md.316.a: "L'Internationale sera l'humanité"
 france_md.317.t: "Par les Ardennes"
 france_md.317.d: "Notre empereur a longtemps discuté de l'invasion du Benelux, vital pour notre empire naissant. La Belgique abrite une importante minorité francophone en Wallonie et est le centre névralgique de l'Union européenne, tout en restant mal défendue, une première cible parfaite pour restaurer nos frontières légitimes. Parce que nous entendons occuper ces terres de façon permanente, car elles sont légitimement nôtres, l'empereur nous a ordonné d'éviter les bombardements et de frapper vite, avant que nos ennemis ne puissent se préparer. Il est temps de reprendre le berceau de la nation franque au-delà des Ardennes."
 france_md.317.a: "Ils n'ont aucune chance"
 france_md.318.t: "La deuxième campagne d'Espagne"
 france_md.318.d: "Notre empereur a ordonné la conquête de la péninsule Ibérique, essentielle pour sécuriser notre flanc ouest avant la marche vers l'est jusqu'à Moscou. Prendre l'Espagne nous rapproche de Gibraltar, clé du contrôle de la Méditerranée. Le terrain montagneux favorise le défenseur, aussi l'empereur appelle-t-il à une avance lente et sûre appuyée par les chasseurs alpins, tout en pressant la vitesse avant que nos ennemis ne puissent se préparer. La défaite de Napoléon nous a enseigné que le terrain conquis doit être tenu : nous devons imposer des États clients stables ou durcir les forces d'occupation."
 france_md.318.a: "Cette fois, nous les surveillerons de près"
 france_md.319.t: "Au-delà du Rhin"
 france_md.319.d: "Notre empereur a nommé notre prochain adversaire : l'Allemagne, cœur économique de l'Europe et dévouée à une vision de l'Europe que nous méprisons. Le conflit était inévitable, et il marque notre premier pas vers l'est en direction de Moscou, notre ennemi ultime. De la campagne éclair de Napoléon contre la Prusse à Sedan et à deux guerres mondiales, nous connaissons bien cet ennemi. L'empereur ordonne une avance sûre et préparée, avec de puissants chars et une aviation pour sécuriser nos objectifs, bien qu'une occupation complète ne soit pas nécessaire. Cette guerre est malheureuse mais inévitable."
 france_md.319.a: "Jamais une autre berline !"
 france_md.320.t: "La guerre pour les Alpes"
 france_md.320.d: "La retraite de Napoléon Ier de Russie vit les alliés se révolter dès qu'il s'affaiblit, aussi avant de marcher sur Moscou notre empereur nous ordonne de sécuriser notre flanc sud : l'Italie et les anciennes terres austro-hongroises. Menaces mineures aujourd'hui, elles pourraient devenir dangereuses si notre campagne de Russie s'éternise. Leur terrain montagneux appelle les chasseurs alpins et l'artillerie pour déloger les défenseurs des points forts, sécurisant nos arrières sans gaspiller les hommes dont nous aurons besoin pour la Russie. Ces pays sont au mauvais endroit au mauvais moment."
 france_md.320.a: "Nous enterrerons le Saint-Empire une fois pour toutes !"
 france_md.321.t: "L'Empereur nous appelle à nous préparer à la guerre"
 france_md.321.d: "Notre allié français a convoqué une réunion pour discuter de la destruction de la Russie, qu'il voit comme une menace pour l'Europe et l'empire que nous partageons désormais. Il nous presse de bâtir nos capacités militaires et a envoyé des experts en armement pour optimiser notre production, avec un mot d'ordre : se préparer à une guerre longue et difficile. L'annonce est une sombre nouvelle pour nos citoyens, qui pourraient être appelés à mourir, mais cette guerre est nécessaire et juste. Nous devons protéger l'Europe de la Russie avant de devenir sa cible."
 france_md.321.a: "Merci, mon empereur"
 france_md.322.t: "Percer le glacis"
 france_md.322.d: "Notre marche sur Moscou est imminente, mais d'abord nous devons sécuriser notre point de départ : l'Europe de l'Est, jadis un tampon contre l'expansion russe, désormais un obstacle à la nôtre. Nous avons tendu la main à ceux qui voulaient nous rejoindre ; les autres ont ignoré notre appel, et leur jour de jugement est venu. Nouvellement indépendantes, ces nations ne seront pas dures à écraser. Nous avançons vite, avec une percée blindée appuyée par l'artillerie. Elles se battront jusqu'au bout. Pas de quartier."
 france_md.322.a: "Les Français donneront au monde à la fois la paix et la liberté"
 france_md.475.t: "La deuxième campagne de Russie"
 france_md.475.d: "Après des années de préparation, l'heure est venue. Notre Empereur a donné ses derniers ordres pour la campagne de Russie, notre plus grand adversaire et, comme pour Napoléon Ier, une menace inévitable. Pour une fois, il hésite : nulle erreur n'est permise contre une puissance qui a toujours défendu son propre sol. Quoi que nous décidions, la vitesse est essentielle, car l'ennemi aussi se prépare. Faites le bon choix, mais qu'ils le sachent : Le peuple souverain s'avance, les tyrans descendent au tombeau pour s'y cacher !"
 france_md.475.a: "Une offensive éclair, nous serons à Moscou dans deux semaines !"
 france_md.475.b: "Préparez une guerre d'usure"
 france_md.476.t: "Briser le blocus"
 france_md.476.d: "Notre économie et notre peuple ont assez souffert des mains de la perfide Albion, et maintenant, l'Europe étant assurée, nous pouvons nous tourner vers notre plus vieil adversaire. Seule la Manche barre notre chemin vers leur île misérable. Notre Empereur offre deux options : frapper avec la supériorité aérienne, les écraser sous les bombes avant de parachuter nos forces, ou exploiter leur marine affaiblie et concentrer notre flotte pour un débarquement direct. La vitesse est essentielle. Faites le bon choix, citoyen. Notre victoire est imminente."
 france_md.476.a: "Leur marine n'est plus que l'ombre d'elle-même. La Royale en fera son affaire"
 france_md.476.b: "Un Blitz 2.0, ça sonne bien"
 france_md.477.t: "L'Empereur proclame la victoire du Blocus continental"
 france_md.477.d: "Ils nous ont sanctionnés. Ils nous ont soumis à l'embargo. Ils nous ont bombardés. Mais ils n'ont jamais brisé notre esprit. Après des années de guerre, notre Empereur a déclaré la victoire : l'Europe s'incline à nouveau devant l'Empire français. Ces conquêtes ont coûté des milliers de vies françaises, martyrs que l'on n'oubliera pas. Le jour de la Victoire est désormais un jour férié en leur mémoire. Mais notre triomphe en Europe ne règle rien : tôt ou tard, nous affronterons d'autres puissances sur d'autres fronts. La France est éternelle. La guerre aussi."
 france_md.477.a: "Le jour de gloire est arrivé"
 france_md.478.t: "Quelle quête pour notre Royaume ?"
 france_md.478.d: "Notre place à la tête du Royaume de France est assurée : nous avons écrasé la Révolution et rendu à la religion sa place légitime. Reste à savoir par où commencer le rétablissement de notre ancienne gloire. Nous pourrions reconquérir nos terres franques ancestrales, au prix d'une guerre avec d'anciens alliés peu enclins à les céder, ou gagner le cœur des chrétiens du monde entier en marchant d'abord libérer la Terre sainte, nous épargnant une guerre sur notre propre sol. Quoi que nous décidions, nous n'avons rien à craindre, car Dieu est avec nous."
 france_md.478.a: "Nous sommes, avant tout, des Francs"
 france_md.478.b: "La croisade n'attendra pas, il faut libérer nos lieux saints"
 france_md.479.t: "Le Royaume de France exige notre annexion"
 france_md.479.d: "Une requête des plus singulières nous est parvenue ce matin de nos collègues français. Leur roi ne reconnaît plus notre souveraineté et exige que nous lui remettions nos territoires, nos réserves et notre armée, promettant une intégration en douceur de notre population. On croirait un poisson d'avril, mais l'état-major français a annoncé une mobilisation spéciale, et tout indique une intervention imminente sur notre sol. Se soumettre ou combattre : quoi que nous décidions, il faut agir vite."
 france_md.479.a: "Un conflit infligerait à notre peuple des souffrances inutiles"
 france_md.479.b: "Comment osent-ils ? Nous sommes un pays souverain"
 france_md.480.t: "[FROM.GetName] satisfait à nos exigences"
 france_md.480.d: "Avant même le premier coup de canon, le gouvernement de [FROM.GetName] a annoncé sa dissolution et sa reddition inconditionnelle à notre royaume. Excellente nouvelle pour notre peuple et notre diplomatie. Notre roi a promis que le statut des nouveaux citoyens français serait régularisé au plus vite et qu'ils seraient intégrés aussi efficacement que possible. C'était la décision la plus sage qu'ils pouvaient prendre. Ils n'auraient pas pu résister à une intervention de notre part."
 france_md.480.a: "Parfois, il suffit de demander poliment"
 france_md.481.t: "[FROM.GetName] refuse de céder"
 france_md.481.d: "Le gouvernement de [FROM.GetName] vient d'annoncer qu'il condamne notre tentative d'intimidation. Nos revendications ethniques n'auraient pas leur place à la table des négociations. Cet échec diplomatique était prévisible ; il eût été étrange qu'un pays souverain annonce sa reddition sans même se battre. Tant mieux : nous nous étions en réalité préparés à cette éventualité. Nos forces sont prêtes à intervenir sur leur sol. Il n'est toutefois pas certain qu'un conflit ouvert soit le meilleur moyen d'obtenir justice."
 france_md.481.a: "Ils vont le regretter"
 france_md.481.b: "Ce n'est pas la fin pour nous"
 france_md.482.t: "Le Royaume de France exige notre soumission"
 france_md.482.d: "Une requête des plus singulières nous est parvenue ce matin de nos collègues français. Leur roi, invoquant les temps carolingiens, ne nous fait plus confiance pour protéger la papauté face aux tensions croissantes, et exige le contrôle total de notre gouvernement ainsi que le corridor vers le Vatican, qu'il entend administrer directement. C'est intolérable : nous n'avons jamais failli à la papauté, et la religion ne saurait justifier les ambitions nationalistes de notre voisin. Pourtant ce ne sont pas de vaines menaces : l'état-major français a ordonné une mobilisation spéciale, et tout indique une intervention sur notre territoire. Céder ou combattre : quoi que nous décidions, il faut agir vite."
 france_md.482.a: "Nous ne faisons pas le poids"
 france_md.482.b: "Comment osent-ils ? Nous sommes un pays souverain"
 france_md.483.t: "[FROM.GetName] refuse de satisfaire à nos exigences"
 france_md.483.d: "Le gouvernement de [FROM.GetName] vient d'annoncer qu'il condamne notre tentative d'intimidation. Ils refusent de se plier à nos exigences et entendent défendre leur souveraineté sur leurs décisions et leurs politiques. Il semble qu'ils aient rejeté notre appel à la raison. Nous ne pouvons pas les laisser s'en tirer ainsi. Nos forces sont prêtes à intervenir militairement. Nous ne pouvons pas risquer que nos adversaires s'unissent contre nous. Il faut en faire un exemple. Une guerre avec [FROM.GetName] n'est toutefois peut-être pas ce dont nous avons besoin."
 france_md.483.a: "Ils n'ont pas compris de quel côté était le fusil"
 france_md.483.b: "Nous pouvons les plier autrement"
 france_md.484.t: "Le Royaume de France exige notre soumission"
 france_md.484.d: "Une exigence des plus singulières nous est parvenue ce matin de nos collègues français. Leur roi ne nous fait plus confiance pour protéger notre peuple et affirme que notre gouvernement se trouve du mauvais côté de l'équilibre actuel des alliances, exigeant le contrôle total de notre gouvernement et de nos forces armées. Ces exigences sont absurdes : nous n'avons jamais failli à gouverner notre territoire, et notre autorité ne vient que du mandat de notre peuple. Pourtant ce ne sont pas de vaines menaces : l'état-major français a ordonné une mobilisation spéciale, et tout indique une intervention sur notre sol. Céder ou combattre : quoi que nous décidions, il faut agir vite."
 france_md.484.a: "Nous ne faisons pas le poids"
 france_md.484.b: "Seul notre peuple est souverain"
 france_md.485.t: "L'essor de l'Empire d'Occident"
 france_md.485.d: "Après des années de luttes et de trahisons, le peuple franc a triomphé. Lorsque nous avons renversé la république usurpatrice, l'Europe nous a ostracisés et sanctionnés, mais Dieu a toujours été avec nous : la France, fille aînée de l'Église, n'était jamais destinée à une république. Les ennemis du peuple franc devaient périr, et désormais les Francs ont reconquis leurs terres. Il est temps de proclamer notre Empire, l'Empire d'Occident, l'Empire de la Foi, consacré par la papauté pour notre protection éternelle. Peut-être est-il aussi temps de partir vers l'est reconquérir la Terre sainte."
 france_md.485.a: "Et cette fois, c'est moi qui poserai la couronne"
 france_md.485.b: "Deus Vult!"
 france_md.486.t: "Le Royaume de France exige notre soumission"
 france_md.486.d: "Une requête des plus singulières nous est parvenue ce matin de nos collègues français. Leur roi, déterminé à mener à bien la Dixième croisade qu'il a lancée, prétend que nos territoires insulaires se trouvent sur sa route et les exige, ainsi que le contrôle total de notre gouvernement, pour faire bonne mesure. C'est intolérable : la religion ne saurait justifier les ambitions nationalistes de notre voisin. Pourtant ce ne sont pas de vaines menaces : l'état-major français a ordonné une mobilisation spéciale, et tout indique une intervention sur notre sol. Céder ou combattre : quoi que nous décidions, il faut agir vite."
 france_md.486.a: "C'est le meilleur moyen d'assurer le succès de cette campagne ; nous acceptons"
 france_md.486.b: "Comment osent-ils ? Nous sommes un pays souverain"
 france_md.487.t: "La Dixième croisade victorieuse"
 france_md.487.d: "Après des mois de combats intenses à travers la Méditerranée et le Moyen-Orient, nous sommes sortis vainqueurs. D'île en île, nous avons sécurisé les derniers bastions chrétiens, puis assiégé Jérusalem elle-même. D'innombrables adversaires se sont dressés sur notre route, et bien des Français sont morts aux côtés d'innocents tombés sous notre puissance vengeresse, mais la fin justifie les moyens. Nos gains consolidés et l'instabilité du Moyen-Orient neutralisée, une question demeure : faut-il s'arrêter ici, ou achever ce que les guerres de religion en Europe n'ont pas su accomplir ?"
 france_md.487.a: "Il y aura une nouvelle croisade"
 france_md.487.b: "Nous avons atteint notre but en restaurant le Royaume de Jérusalem. Inutile d'aller plus loin"
 france_md.488.t: "Le Royaume de France nous presse de rejoindre son alliance"
 france_md.488.d: "Une proposition nous est parvenue des diplomates français. Ayant conclu leur aventure moyen-orientale, le roi de France, protecteur de l'Église catholique, déclare désormais la guerre à tous ceux qui rejettent son autorité, et nous invite dans une alliance qu'il compare à l'arche de Noé avant le déluge. Cette annonce est aussi folle que terrifiante, accompagnée de la mobilisation de l'armée croisée désormais de retour. La proposition ressemble davantage à un ultimatum, vu la férocité de leur croisade, et doit être prise au sérieux. Quoi que nous décidions, il faut le faire vite."
 france_md.488.a: "Mieux vaut les avoir avec nous que contre nous"
 france_md.488.b: "Sont-ils fous ?"
 france_md.489.t: "La Onzième croisade victorieuse en Europe"
 france_md.489.d: "Cette croisade fut plus sanglante que la précédente. Elle fut aussi plus difficile, car nous avons affronté de grandes puissances. Mais nous l'avons fait. Nous sommes victorieux. Pourtant, tandis que nous pansons nos plaies et reconstruisons notre pays et ceux que nous avons conquis, une question se pose. Faut-il imposer un contrôle strict de leurs politiques pour qu'ils restent dans le droit chemin ? Ou leur montrer la lumière et les laisser décider par eux-mêmes ? En les laissant choisir, nous ferions preuve de clémence, et ils seraient moins enclins à se révolter. À l'inverse, un contrôle plus serré aiderait à ce qu'aucune autre brebis ne s'égare. Que faire ?"
 france_md.489.a: "Il faut les surveiller"
 france_md.489.b: "Notre Seigneur les jugera le moment venu"
 france_md.490.t: "La restauration de nos frontières naturelles"
 france_md.490.d: "De Richelieu à de Gaulle, l'idée des frontières naturelles de la France n'a jamais été abandonnée : une préoccupation fondamentale, enracinée à la fois dans les revendications ethniques du peuple franc et dans notre sécurité. Aujourd'hui, nous pouvons accomplir ce destin. Nous avons chassé nos adversaires des rives du Rhin, assuré nos positions montagneuses, et les populations locales ont enfin accepté le nouvel ordre. Il ne reste plus qu'à formaliser cette annexion. Par elle, nous vengeons la Révolution et ouvrons une ère de sécurité et de prospérité pour l'Empire et le peuple français."
 france_md.490.a: "Les frontières de la France sont marquées par la nature (Danton, 1793)"
 france_md.491.t: "L'union du peuple franc"
 france_md.491.d: "Trop longtemps, des puissances soucieuses de limiter l'influence de la France ont contrecarré l'unité du peuple franc, taillant des États comme le Benelux en champ de bataille entre Francs et autres peuples germaniques, et nous convainquant que l'Union européenne était notre véritable patrie. Mais le destin des Francs n'appartient qu'aux Francs, et rien ne pouvait les tenir divisés à jamais. Nous avons reconquis la terre ancestrale qui a vu naître la nation française, et après des mois nos frères de sang ont compris que leur destin est avec nous. Maintenant que le Royaume est entier, justice est faite."
 france_md.491.a: "Un État pour tous les Francs"
 france_md.492.t: "Le retour des Carolingiens"
 france_md.492.d: "À la mort de Charlemagne, son empire fut partagé en Francie occidentale, médiane et orientale, et l'héritage de l'empereur franc commença à s'effacer tandis que les Francs étaient dépouillés de leurs terres. Nous avons réparé cette erreur. Après des années de conflit, nous avons chassé les usurpateurs de notre territoire et montré à ses habitants qu'ils n'avaient jamais été Allemands, Italiens ou Suisses, mais des Francs qui avaient simplement oublié. Par cette réunification, nous redressons les torts du traité de Verdun et mille ans d'une Europe bâtie sur de faux fondements. Ce jour marque le début d'une Europe nouvelle, franque."
 france_md.492.a: "L'empire et l'État franc ne font qu'un"
 france_md.493.t: "Le Royaume de Jérusalem ressurgit"
 france_md.493.d: "Il y a un peu moins d'un millénaire, nos aïeux croisés virent leur bien le plus précieux leur être arraché. Neuf croisades n'ont pas suffi à conquérir et tenir nos lieux saints, mais nous sommes revenus tenir cette promesse faite au Seigneur. Nous avons repris pied au Moyen-Orient dans les derniers bastions chrétiens du Liban, et nous avons reconquis Jérusalem et la Terre sainte. S'ensuivit une lutte pour établir notre royaume au Moyen-Orient et faire comprendre à la population que les lieux saints doivent rester sous notre contrôle pour garantir leur sécurité."
 france_md.493.a: "La Dixième croisade triomphe !"
 france_md.494.t: "Un empire renaît"
 france_md.494.d: "Il y a quelque cent cinquante ans, le Second Empire de Napoléon tomba face à la Prusse et aux peuples germaniques, inaugurant un siècle de revanche et de conflits pour la France. Tous prédisaient notre lent déclin de ancienne puissance coloniale, mais nous, bonapartistes, les avons démentis, arrachant le pouvoir à la république instable et restaurant la France dans sa gloire d'antan. Cela a eu un prix, mais nous avons reconquis les frontières du Premier Empire de Napoléon Ier et chassé les puissances ennemies. Par cette victoire historique sur la Huitième Coalition, la France a montré au monde qu'elle est de retour, et le Blocus continental triomphe désormais en Europe."
 france_md.494.a: "Jamais deux sans trois"
 france_md.495.t: "Le retour de l'Empire colonial"
 france_md.495.d: "Les empires bonapartistes ont toujours visé la domination de l'Europe, mais les colonies comptaient aussi beaucoup, de la révolte haïtienne à l'expansion de Napoléon III en Afrique. Depuis la chute des empires coloniaux, nous avons été progressivement chassés des pays que nous contrôlions jadis, et il est temps de rétablir l'ordre naturel. Notre Empereur nous a ordonné de préparer le retour de la France dans ses anciennes colonies, en mobilisant des troupes de nos départements et régions d'outre-mer, mieux adaptés à cet environnement. Nous envahirons les villes côtières pour y assurer des bases navales avant de pousser à l'intérieur, où le climat se fait plus rude."
 france_md.495.a: "Ces bienheureux jours des colonies"
 france_md.496.t: "Notre suzerain français exige notre annexion"
 france_md.496.d: "Nous aurions dû comprendre que le contrôle de notre politique imposé par la France finirait tôt ou tard ainsi. Les autorités françaises viennent d'annoncer que notre pays sera bientôt absorbé par la France. Cette annonce n'est pas tombée du ciel : la France a longtemps eu l'œil sur certains de nos territoires et semble déterminée à s'en emparer cette fois. Ils croient mieux administrer notre pays que nous. En ces heures sombres, nous devons choisir non seulement pour notre indépendance, mais aussi pour la sécurité de notre peuple. Céder ou combattre, telles sont nos options. Quoi que nous décidions, il faut agir vite."
 france_md.496.a: "Nous n'avons pas les moyens de nous y opposer"
 france_md.496.b: "Cette terre est nôtre, qu'ils viennent la prendre"
 france_md.497.t: "[FROM.GetName] se révolte contre notre suzeraineté"
 france_md.497.d: "Le gouvernement de [FROM.GetName] condamne notre tentative d'annexion et est prêt à défendre son indépendance à n'importe quel prix. Ils acceptent le vassalage mais refusent de céder les territoires que nous avons exigés, chassent notre administration et se préparent à nous affronter. Nous pouvons écraser cette rébellion maintenant pour en faire un exemple, ou reporter leur châtiment à plus tard, puisque rien n'empêche notre retour."
 france_md.497.a: "Cela servira de leçon à eux et à quiconque serait tenté"
 france_md.497.b: "Nous les écraserons plus tard"
 france_md.498.t: "La France propose d'investir dans notre industrie"
 france_md.498.d: "Nos partenaires français nous ont fait une offre tentante : l'Europe veut recentrer des capacités de production qu'elle peut contrôler, aussi la France propose d'investir dans notre économie en aidant à implanter des usines sur notre territoire, dans le cadre d'un projet plus large de renforcement de la souveraineté et de la résilience européennes. Cela nous profiterait grandement, mais aussi aux Français, qui pourraient prendre des parts dans notre capital et nos entreprises. Faut-il sacrifier un peu de souveraineté pour aider notre industrie ?"
 france_md.498.a: "Où signe-t-on ?"
 france_md.498.b: "L'Europe et la France n'ont pas à se mêler de notre économie"
 france_md.499.t: "La France propose d'investir dans notre réseau d'infrastructures"
 france_md.499.d: "Lors d'une discussion fort agréable avec nos partenaires français, ils nous ont fait une offre plutôt séduisante. L'objectif principal de l'Europe est de faciliter la circulation des personnes et des marchandises entre pays de l'UE, et ils souhaitent aider notre pays à cet égard. Le gouvernement français a donc proposé d'investir dans notre réseau de transports en aidant à moderniser nos infrastructures. Cette offre s'inscrit dans un projet visant à accroître la souveraineté européenne tout en aidant ses États membres à affronter les crises à venir. Elle nous serait fort bénéfique, mais profiterait aussi aux Français, qui pourraient gagner de l'influence sur la gestion de nos infrastructures. Faut-il sacrifier un peu de notre souveraineté pour moderniser nos infrastructures ?"
 france_md.499.a: "Où signe-t-on ?"
 france_md.499.b: "Notre réseau d'infrastructures se porte déjà très bien sans eux"
 france_md.502.t: "La France propose d'investir dans notre transition écologique"
 france_md.502.d: "Lors d'une discussion fort agréable avec nos partenaires français, ils nous ont fait une offre plutôt tentante. Leur objectif à long terme étant de rendre l'Europe plus respectueuse de l'environnement, ils proposent d'investir conjointement dans la transition verte. Le gouvernement français a donc proposé d'investir dans nos infrastructures de production d'énergies renouvelables. Cette offre nous serait fort bénéfique, mais profiterait aussi aux Français, qui pourraient prendre pied dans notre production d'électricité. Faut-il sacrifier un peu de notre souveraineté pour avancer notre transition verte ?"
 france_md.502.a: "Où signe-t-on ?"
 france_md.502.b: "Nous n'avons pas besoin de leur transition écologique"
 france_md.520.t: "La fragmentation continue"
 france_md.520.d: "Un malheur n'arrive jamais seul. Tandis que nous sombrons dans les sondages, notre parti se déchire : notre aile libérale s'est ralliée au parti centriste, et le ministre Emmanuel Macron a lancé son propre parti, La République en Marche, pour nous défier. Notre aile gauche a aussi fait sécession, déçue par notre bilan social et économique, se rassemblant derrière Jean-Luc Mélenchon pour bâtir son propre parti de gauche radicale. Ces développements sont désastreux, mais ils sont aussi le signe que nous pouvons inverser la tendance et reconquérir notre électorat avant qu'il ne soit trop tard."
 france_md.520.a: "Malédiction !"
 france_md.521.t: "Des agents français percent notre système de défense"
 france_md.521.d: "À l'aube, nous avons été réveillés par des klaxons et des collisions. Les rues de notre capitale sont à l'arrêt, victime de ce qui semble être un acte de sabotage contre nos infrastructures de transport. Nos techniciens font tout pour rétablir la situation, mais les accidents ont déjà coûté la vie à plusieurs membres de nos forces de police, et nous craignons que la sécurité de nos forces armées ne soit aussi menacée. Cette attaque vient clairement de la France bonapartiste, qui tient depuis plusieurs mois un discours hostile à notre égard. Il faut nous préparer avant que ces petits jeux d'agents secrets ne deviennent la norme."
 france_md.521.a: "Bon sang"
 france_md.522.t: "Nos forces de police ont repoussé un raid français"
 france_md.522.d: "C'est avec un soupir de soulagement que nous avons appris que nos forces de police avaient réussi à empêcher un sabotage de grande ampleur dans notre capitale. L'ennemi a pu s'échapper, mais nous avons évité le pire. Cette attaque a néanmoins coûté la vie à deux policiers lors d'accrochages sporadiques dans les rues de la capitale. L'opération vient clairement de la France bonapartiste, qui tient depuis plusieurs mois un discours hostile à notre égard. Il faut nous préparer avant que ces petits jeux d'agents secrets ne deviennent la norme."
 france_md.522.a: "Nous n'aurons pas toujours cette chance"
 france_md.523.t: "La France proclame le Troisième Empire"
 france_md.523.d: "La France vient de déclarer le retour de l'Empire. Il y a quelque temps, une faction monarchiste nationaliste s'est emparée du pouvoir en France et a visiblement consolidé son emprise. Ils ont donc organisé une grande cérémonie pour annoncer le retour de l'Empire, et c'est désormais le sujet de toutes les conversations. La cérémonie a été couverte par les médias et largement relayée sur les réseaux sociaux. Cette célébration n'est pas seulement un événement artistique, c'est aussi une démonstration de force de la France. Depuis plusieurs mois, la France affiche publiquement un désir de conquête et de conflit. Cette proclamation n'est donc pas une fin mais un commencement : le commencement de complications en Europe et dans le monde."
 france_md.523.a: "Il faut prendre cette menace au sérieux"
 france_md.523.b: "Ils ne sont plus une menace depuis longtemps"
 france_md.524.t: "Plus de fonds pour l'armée ?"
 france_md.524.d: "Nos récents investissements dans la défense étaient indispensables pour conserver notre place dans la stratégie de défense européenne, mais ne pourrions-nous pas en faire davantage ? Face à la menace d'un retour de la guerre en Europe, de nombreux pays alliés ont déployé d'énormes ressources pour préparer leurs forces à un conflit de haute intensité. Peut-être devrions-nous faire de même et investir encore plus dans nos capacités de production d'armement."
 france_md.524.a: "On n'est jamais trop prudent"
 france_md.524.b: "Nous avons déjà beaucoup dépensé"
 france_md.525.t: "Les ressources pour réaliser nos ambitions"
 france_md.525.d: "Malgré nos appels au peuple français à travailler davantage et à se défaire d'une culture de l'assistanat, la réalité est crue : notre pays manque d'emplois stables malgré une main-d'œuvre nombreuse, volontaire et talentueuse. Nous pourrions stimuler l'emploi en injectant des fonds dans des secteurs stratégiques de notre économie, car attendre que le marché se corrige seul pourrait prendre des siècles, ou financer plutôt notre industrie de défense de pointe, submergée de commandes qu'elle n'a pas les moyens d'honorer, et laisser le secteur civil se débrouiller."
 france_md.525.a: "Nos concitoyens ont besoin de ces emplois"
 france_md.525.b: "Notre industrie de défense fera un meilleur usage de ces fonds"
 france_md.526.t: "Relance de l'activité économique"
 france_md.526.d: "Des années d'ultralibéralisme ont affaibli notre économie, or survivre à notre sortie de l'Union européenne exige une économie robuste et affranchie des sanctions de l'UE. Nous pourrions investir dans le capital d'entreprises privées françaises pour les encourager à s'implanter en France, allégeant l'implication de l'État dans la reprise, sans garantie toutefois qu'elles n'investiront pas ailleurs où la main-d'œuvre est moins chère. Ou nous pourrions subventionner directement la création et la croissance de nouvelles entreprises, solution que le secteur financier n'apprécierait guère mais dont l'efficacité est certaine."
 france_md.526.a: "Nous investirons dans le marché, pour qu'ils investissent en France."
 france_md.526.b: "Du point de vue humain, le capitalisme n'offre pas de solution satisfaisante (Charles de Gaulle)"
 france_md.527.t: "Élargir notre soutien aux zones rurales"
 france_md.527.d: "Notre projet de redonner de la vitalité économique aux zones rurales et périurbaines est déjà bien engagé, et il faut maintenant décider de la suite : continuer à développer les liaisons de transport et l'emploi dans les régions moins peuplées, ou nous tourner vers l'agriculture et ses filières dépendantes, isolées des grands centres de décision et privées des mêmes privilèges. Les subventionner améliorerait leur accès aux centres de production et de consommation, et nous vaudrait leur faveur."
 france_md.527.a: "Nous continuerons d'apporter connectivité et emplois aux banlieues"
 france_md.527.b: "Donnons plutôt cet argent au secteur agroalimentaire. Ils en feront meilleur usage."
 france_md.528.t: "La nouvelle économie"
 france_md.528.d: "Ayant cédé des industries coûteuses et improductives désormais délocalisées, nous devons trouver du travail à notre population de plus en plus qualifiée mais encore sous-employée. Le secteur des services est le pari le plus sûr pour un pays développé comme le nôtre : il génère des recettes solides, produit peu de pollution directe, et relie le secteur privé aux consommateurs. Mais la France est aussi reconnue pour la recherche, de la défense à la médecine et à la chimie, et des crises répétées ont imposé de profondes coupes dans le financement de la science. Peut-être faudrait-il y consacrer davantage en subventionnant des programmes de recherche."
 france_md.528.a: "Le secteur des services est plus rentable et aidera à réduire le chômage"
 france_md.528.b: "Nous devons entrer dans cette société de la connaissance"
 france_md.529.t: "Plus d'emplois ou plus de services ?"
 france_md.529.d: "Notre récent investissement dans les secteurs productifs porte ses fruits : nous avons stoppé la spirale d'appauvrissement et commencé à reconstruire un marché du travail stable. Nous pourrions continuer à créer des emplois qui profiteront aux générations futures, ou nous tourner vers la reconstruction des services publics que nos prédécesseurs ont démantelés en même temps que ces emplois, laissant les citoyens payer de lourds impôts pour des services toujours plus maigres. Une meilleure éducation rendrait nos travailleurs plus efficaces, et de meilleurs soins leur permettraient de vivre plus longtemps. Faut-il recentrer sur les services publics, ou le marché du travail reste-t-il notre priorité ?"
 france_md.529.a: "Notre priorité est de créer davantage d'emplois"
 france_md.529.b: "Nous en avons assez fait sur le front de l'emploi, il faut reconstruire les services publics"
 france_md.530.t: "Relocaliser notre approvisionnement alimentaire"
 france_md.530.d: "Alors que nous nous apprêtons à rapatrier notre approvisionnement alimentaire, une question se pose : comment ? Notre secteur agroalimentaire pourrait nous nourrir seul, mais une concurrence déloyale nous force à importer des biens dont nous n'avons pas besoin, nuisant à la planète par le transport et une production irresponsable à l'étranger. Nous pourrions imposer des barrières tarifaires sur les denrées dont nous n'avons pas besoin ou qui ne répondent pas à nos normes, au risque de s'attirer les foudres de nos partenaires européens et de l'OMC. Ou rester dans les règles du marché et subventionner notre agroalimentaire pour qu'il concurrence et réduise notre dépendance aux importations. Quoi que nous décidions, nous en avons les moyens ; c'est une question de volonté."
 france_md.530.a: "Le marché et la libre concurrence nuisent à nos habitants et à notre planète"
 france_md.530.b: "Il faut jouer selon les règles"
 france_md.531.t: "La France enfreint les règles du libre-échange"
 france_md.531.d: "Nous venons d'apprendre par un communiqué du gouvernement français qu'il a décidé de rétablir des barrières douanières sur les importations alimentaires. Cette décision marque le début de ce qu'ils appellent un plan de relocalisation de leur approvisionnement alimentaire. Quoiqu'ils aient de nombreux arguments en sa faveur, ce plan enfreint de nombreuses règles de l'Organisation mondiale du commerce et de l'Union européenne. Les Français ont signé des accords de libre-échange et devraient être tenus de les honorer. Il n'est pas certain qu'ils soient sanctionnés, mais cette décision nuit à l'intégration européenne. Notre peuple attend toutefois notre réaction : ont-ils bien ou mal agi ?"
 france_md.531.a: "C'est inacceptable"
 france_md.531.b: "Nous devrions faire de même"
 france_md.532.t: "Notre souveraineté économique"
 france_md.532.d: "Se libérer des puissances qui nous ont longtemps contrôlés a un coût : des décennies de règne capitaliste ont cédé une grande part de notre industrie au capital étranger, qui peut désormais s'enfuir, nous forçant à reprendre le secteur privé avant qu'il ne s'effondre. Nous pourrions lancer un grand plan d'emplois, rapide mais coûteux à soutenir le temps que de nouveaux pôles soient bâtis, ou créer des postes dans les secteurs existants, moins cher et plus durable s'ils peuvent absorber la main-d'œuvre supplémentaire."
 france_md.532.a: "Nous pouvons créer ces nouveaux espaces de travail en un an"
 france_md.532.b: "Sans rien construire de plus, nous pouvons employer davantage de monde dans les installations existantes"
 france_md.533.t: "Vers une coalition de gauche"
 france_md.533.d: "Après de longs mois de négociation, nous avons trouvé un terrain d'entente avec un large éventail de partis de gauche, qui ont accepté de ne plus s'opposer à notre gouvernement et de rejoindre notre coalition autour d'un programme commun pour une France plus juste. C'est un coup de maître : notre gouvernement était contesté par des partis qui refusaient de reconnaître sa légitimité, et nous avons bâti une majorité plus solide sans compromettre nos principes. L'accord implique une hausse modeste des prestations sociales, mais nous prévoyions déjà cette augmentation de toute façon."
 france_md.533.a: "La menace d'une motion de censure s'éloigne"
 france_md.534.t: "D'autres partis de gauche rejettent notre coalition"
 france_md.534.d: "Des députés d'autres groupes de gauche ont annoncé ce matin qu'ils ne soutiendraient pas la coalition proposée, invoquant trop de divergences entre nos programmes et nos priorités. Mauvaise nouvelle pour un gouvernement déjà en peine de tenir sa position dans une Assemblée nationale divisée. Nous pourrons encore négocier texte par texte, sous la pression de tous les côtés à chaque fois. Ces partis ont agi de façon irresponsable, et si une partie de l'opinion publique soutient notre approche unitaire, cela ne suffira peut-être pas à garantir la survie de notre gouvernement."
 france_md.534.a: "C'était une tentative valeureuse"
 france_md.535.t: "Le Parti socialiste rejoint le gouvernement"
 france_md.535.d: "Après de longs mois de négociation, nous avons trouvé un terrain d'entente avec le Parti socialiste, qui a accepté de cesser de s'opposer à nous et de rejoindre le gouvernement, autour d'un programme commun largement calqué sur le nôtre puisqu'ils n'étaient pas en position d'imposer le leur. C'est un coup de maître : notre gouvernement était contesté par des partis qui refusaient de reconnaître sa légitimité, et nous avons bâti une majorité plus stable à moindre coût. L'accord exige un investissement dans le secteur privé, pas tout à fait ce qu'attendait notre électorat, mais cela en vaut la peine si cela nous permet de faire passer la législation."
 france_md.535.a: "Léon Blum serait fier"
 france_md.536.t: "Le Parti socialiste refuse de rejoindre le gouvernement"
 france_md.536.d: "Des députés socialistes ont annoncé ce matin qu'ils ne soutiendraient pas notre proposition de coalition, invoquant trop de divergences entre nos programmes, et ressassant visiblement encore nos attaques pendant la campagne. Mauvaise nouvelle pour un gouvernement déjà en peine de tenir sa position dans une Assemblée nationale divisée. Nous pourrons encore négocier texte par texte, sous la pression de tous les côtés à chaque fois. Ces partis ont agi de façon irresponsable, et si une partie de l'opinion publique soutient notre approche unitaire, cela ne suffira peut-être pas à garantir la survie de notre gouvernement."
 france_md.536.a: "Léon Blum se retourne dans sa tombe"
 france_md.537.t: "Un mandat à achever"
 france_md.537.d: "Le mandat du Président a encore deux ans à courir, et l'appareil du parti se dispute déjà sur ce qu'il faut en faire. Nous pouvons gouverner dès maintenant sous les couleurs du titulaire et faire nôtre son programme, ou temporiser et laisser l'élection de 2002 décider quel parti dirige la France avant de nous engager."
 france_md.537.a: "Gouverner maintenant, sous le Président en exercice"
 france_md.537.b: "Attendre l'élection de 2002"
 france_md.538.t: "Jacques Chirac se retire de la vie politique"
 france_md.538.d: "Après la défaite de son parti à l'élection présidentielle, l'ancien président Chirac a décidé de mettre un terme à sa carrière politique. De ministre à président, il avait fait du chemin et vu la France changer à travers les IVe et Ve Républiques. Les difficultés de son parti pendant la campagne tenaient toutefois aussi à ses politiques, qui n'ont pas séduit tout le monde. S'il y a une leçon à tirer de son échec, c'est que la situation a changé ; le monde n'est plus le même, et l'on ne peut plus penser comme autrefois sans prendre de risques. Il ne nous reste plus qu'à espérer faire mieux que lui."
 france_md.538.a: "Cela lui laissera le temps de manger ses pommes"
 france_md.539.t: "La chute du Menhir"
 france_md.539.d: "Jean-Marie Le Pen, fondateur et ancien chef de notre parti, est de retour dans l'actualité pour de mauvaises raisons : après des années de propos négationnistes et antisémites, il refuse désormais de traiter le maréchal Pétain de traître. Depuis qu'il a quitté la direction, il s'oppose à la nouvelle ligne du parti, des retraites aux conflits du siècle dernier, et ses propos nous empêchent enfin de prendre notre place dans le champ républicain. Nous pourrions l'exclure, au risque d'aliéner la vieille garde qui partage ses vues. Voulons-nous vraiment transformer notre parti aux normes républicaines, ou risquer de perdre notre identité ?"
 france_md.539.a: "Il est devenu un fardeau, il faut l'exclure du parti"
 france_md.539.b: "Qu'on lui rappelle simplement de se tenir"
 france_md.540.t: "Du Front au Rassemblement"
 france_md.540.d: "Après de nombreux débats internes et congrès, des responsables du Front national ont annoncé d'importants changements de politique et de statut. Le parti s'appellera désormais Rassemblement national et est clairement déterminé à se défaire de l'étiquette d'extrême droite. À cette fin, ils ont annoncé l'exclusion de nombreux militants jugés trop extrêmes et réaffirmé leur engagement à rester dans l'Union européenne. Cette évolution marque l'ultime étape du déclin de l'ancien Front national, remodelé pour paraître plus acceptable. Quoique ces changements soient mineurs, nous devons tout faire pour empêcher le public de croire que cela change quoi que ce soit."
 france_md.540.a: "Ils n'en sont pas moins dangereux"
 france_md.541.t: "La chute du Saint-Siège"
 france_md.541.d: "Une puissance étrangère occupe actuellement le Vatican. Nous ne pouvons donc garantir la sécurité de la papauté tant que le Vatican reste sous le contrôle de nos adversaires. Or notre pays a déjà abrité la papauté au palais des Papes d'Avignon. Rien n'empêche donc d'amener le Collège des cardinaux et le pape actuel à Avignon. Ce sera un bouleversement pour la chrétienté mondiale, mais le Vatican occupé, nous seuls sommes assez puissants pour assurer la protection de l'Église, comme notre Royaume l'a toujours fait."
 france_md.541.a: "La papauté sera en sécurité ici, auprès de nous."
 france_md.550.t: "Nicolas Sarkozy remporte la présidence"
 france_md.550.d: "Le second tour a confirmé ce que les sondages laissaient entrevoir. Nicolas Sarkozy, le ministre de l'Intérieur qui s'est fait une réputation d'intransigeance face aux troubles urbains, a porté l'Union pour un mouvement populaire à l'Élysée avec une avance nette sur Ségolène Royal. La campagne s'est jouée sur le travail, l'autorité et l'identité nationale, et le taux de participation fut le plus élevé d'une génération. Le nouveau président promet une rupture avec les années Chirac : réforme des retraites, marché du travail plus tendu, et retour de la France dans le commandement intégré de l'Alliance atlantique. Ses adversaires préviennent que la rupture pèsera le plus fort sur ceux qui peuvent le moins se le permettre."
 france_md.550.a: "Travailler plus pour gagner plus."
 france_md.551.t: "François Hollande remporte la présidence"
 france_md.551.d: "Après cinq ans de présidence Sarkozy, les socialistes sont de retour au pouvoir. François Hollande, longtemps taxé de gestionnaire de parti plutôt que d'homme d'État, a gagné le second tour sur un programme de justice fiscale, de renégociation du traité budgétaire européen et de retrait d'Afghanistan. La crise financière et l'urgence de la zone euro ont dominé chaque débat, et le président sortant n'a pu échapper à son bilan. La nouvelle administration hérite d'une économie stagnante, d'un déficit sous tension et d'un partenariat européen qui attend de la France qu'elle mène plutôt qu'elle n'objecte."
 france_md.551.a: "Le changement, c'est maintenant."
 france_md.552.t: "Emmanuel Macron remporte la présidence"
 france_md.552.d: "L'ancien système partisan s'est effondré. Ni les socialistes ni les Républicains n'ont atteint le second tour, et le ballottage a opposé un mouvement fondé à peine un an plus tôt au Front national. Emmanuel Macron, ancien banquier d'affaires et ministre de l'Économie, l'a emporté confortablement sur un programme de libéralisation du marché du travail, d'intégration européenne et d'une politique qui se prétend ni de droite ni de gauche. Son mouvement affronte désormais les législatives sans base parlementaire ni appareil local, et ses adversaires des deux flancs s'organisent déjà dans la rue."
 france_md.552.a: "Ni à droite, ni à gauche."
 france_md.553.t: "Emmanuel Macron est réélu"
 france_md.553.d: "Pour la deuxième fois, le second tour a opposé le président au Rassemblement national, et pour la deuxième fois le front républicain a tenu, quoique par une marge plus étroite qu'il y a cinq ans. La campagne a été éclipsée par la guerre en Europe, par les prix de l'énergie et par une réforme des retraites que le président a promis de mener quoi qu'il arrive. Il devient le premier président français en vingt ans à obtenir un second mandat, et le premier à le faire face à une extrême droite jamais aussi proche du pouvoir."
 france_md.553.a: "Un second mandat, plus étroit."
 france_md.503.t: "Opposition à [FRA.GetLeader] : quelle tendance ?"
 france_md.503.d: "Alors que le mandat du président [FRA.GetLeader] touche à sa fin, la campagne présidentielle entre dans sa dernière ligne droite et l'équilibre des forces électorales se précise. Le favori, Lionel Jospin, a été Premier ministre sous Chirac, menant des politiques sociales-démocrates conformes aux normes européennes tout en s'éloignant de la tradition socialiste : moderne, mais pas socialiste. Divers candidats de gauche, Verts et Parti communiste français, n'ont pas les moyens de l'emporter seuls, mais pourraient encore prendre de l'élan. La gauche dans son ensemble est-elle clairement favorite, ou ses divisions pourraient-elles propulser un autre candidat au second tour ?"
 france_md.503.a: "La gauche parvient à séduire l'électorat"
 france_md.503.b: "Aucun des candidats de gauche n'a obtenu le soutien escompté"
 france_md.986.t: "Lionel Jospin face aux critiques"
 france_md.986.d: "Bien qu'il soit le candidat favori de la gauche pour l'élection à venir, Lionel Jospin ne bénéficie pas d'un soutien unanime au sein de la gauche sur son programme, jugé par certains trop libéral et trop proche de celui de Chirac. Face à lui, le Parti communiste français ; quoique devenu l'ombre de lui-même depuis la fin de la guerre froide, il a encore des alliés dans la gauche radicale et peut séduire ceux que le second mandat de l'ancien président Mitterrand a déçus. Il pourrait attaquer Jospin sur son glissement vers le libéralisme, mais le fera-t-il ?"
 france_md.986.a: "Le PCF a décidé de ne pas attaquer Lionel Jospin"
 france_md.986.b: "Le PCF a réussi à séduire les électeurs de gauche"
 france_md.986.c: "Une attaque du PCF sans lendemain"
 france_md.987.t: "Lionel Jospin donné bien en avance"
 france_md.987.d: "Le triomphe de Lionel Jospin et du Parti socialiste est incontesté au sein de la gauche. Quoiqu'il ait été attaqué auparavant, ses adversaires ne sont pas en position de le défier ni d'atteindre le second tour. Que l'on soit d'accord ou non avec son programme, ce sera lui contre [FRA.GetLeader] au second tour de l'élection présidentielle."
 france_md.987.a: "Il ne pouvait en être autrement"
 france_md.988.t: "Résurgence communiste"
 france_md.988.d: "Attaquer Jospin sur ses liens avec la gauche était le bon choix. Le vote socialiste s'est scindé entre gauche et centre, donnant au PCF la crédibilité qui lui manquait pour mener l'opposition aux politiques libérales et conservatrices trop longtemps dominantes. Le PCF a scellé une alliance avec d'autres partenaires de gauche comme la Ligue communiste révolutionnaire et Lutte ouvrière. Les centristes mécontents de [FRA.GetLeader] auraient toutefois préféré Jospin à une alliance radicale, et voteront probablement contre nous au second tour. Peut-être pourrons-nous arranger des investissements locaux dans leurs villes en échange de leur silence."
 france_md.988.a: "Les centristes s'abstiendront"
 france_md.988.b: "Les centristes appelleront à un front uni contre l'extrême gauche"
 france_md.989.t: "Un favori improbable"
 france_md.989.d: "La fin de cette campagne présidentielle s'est révélée tumultueuse pour de nombreux partis. Après les attaques du PCF contre Lionel Jospin, communistes et socialistes se sont livrés une bataille médiatique sans relâche, et comme aucun des deux n'a su convaincre, l'électorat de gauche s'est tourné vers un candidat moins controversé, plus mesuré. Les Verts ont saisi l'occasion de se présenter comme la voix du calme et de la raison au milieu de la tempête. Il est donc fort probable que les Verts atteignent le second tour, où ils affronteront un ancien président affaibli par la fin de son mandat."
 france_md.989.a: "Qui l'eût cru ?"
 france_md.990.t: "Ni gauche ni droite"
 france_md.990.d: "Les conservateurs déjà au second tour et la gauche en déroute, l'ancien président paraît certain de l'emporter, quoique des incertitudes demeurent. Certains Français sont las du clivage gauche-droite qui structure la politique depuis des décennies, inadapté à une époque tournée vers la stabilité et l'intégration européenne. L'Union pour la démocratie française libérale a donc un argument à faire valoir : la politique d'indépendance de Chirac ne pèse plus grand-chose dans un monde où de nouvelles puissances et de nouveaux blocs émergent. Le centre libéral a un rôle à jouer, mais convaincra-t-il l'électorat de cette nouvelle réalité ?"
 france_md.990.a: "Les libéraux parviendront à capter l'attention"
 france_md.990.b: "Les Français restent attachés à leur souveraineté"
 france_md.991.t: "Le camp souverainiste divisé"
 france_md.991.d: "Le centre libéral n'ayant pas su convaincre, les électeurs las du clivage gauche-droite se sont tournés vers les souverainistes. Ce camp, toutefois, parle de deux voix. Le Rassemblement pour la République porte la tradition gaulliste d'indépendance nationale dans le courant majoritaire, respectable et de gouvernement, tandis que le Front national offre une ligne plus dure que les partis établis ont passé deux décennies à contenir. Tous deux revendiquent le même électorat désabusé. Celui qui atteindra le second tour décidera si l'euroscepticisme français reste l'affaire de la droite de gouvernement, ou s'il brise le cordon sanitaire."
 france_md.991.a: "La tradition gaulliste commande encore le vote souverainiste"
 france_md.991.b: "Le Front national capitalisera sur le mécontentement"
 france_md.510.t: "Personne n'aurait pu le voir venir"
 france_md.510.d: "Devant l'incapacité des partis à capter l'attention des électeurs, aucun n'a la force d'atteindre le second tour contre [FRA.GetLeader]. Profitant de la disparition de ses rivaux des projecteurs, le Front national a échappé à leurs controverses et, malgré son chef Jean-Marie Le Pen, pourrait éventuellement se qualifier. Cela reste improbable : Lionel Jospin est encore le favori, et perdrait sûrement face à [FRA.GetLeader]. Mais si le FN atteint le second tour, comment réagiraient les autres partis ?"
 france_md.510.a: "Les partis ne s'inquiéteront pas de la montée de l'extrémisme"
 france_md.510.b: "Tous les partis appelleront à voter contre le Front national"
 france_md.511.t: "Jour d'élection"
 france_md.511.d: "Après des mois d'une campagne tumultueuse pleine de rebondissements, l'heure est enfin venue pour les Français de voter. Ce n'est que le premier tour, destiné à réduire le champ aux deux candidats qui ont recueilli le plus de soutien. Un second tour départagera ensuite s'il n'y a pas de majorité."
 france_md.511.a: "Allons voter !"
 france_md.512.t: "Le Front national est donné vainqueur de l'élection présidentielle"
 france_md.512.d: "Contre toute attente, le Front national est sorti vainqueur du premier tour, alors que tous les pronostics annonçaient un duel Jospin-[FRA.GetLeader]. Devant l'incapacité des autres candidats à séduire l'électorat, le Front s'est qualifié pour le second tour, et les choses s'annoncent sombres pour [FRA.GetLeader] : les autres partis n'ont pas appelé à le soutenir, ses politiques trop controversées pour certains. Une partie de l'électorat devrait se rassembler contre le candidat d'extrême droite, mais battre Le Pen, qui se pose en choix anti-système, est loin d'être acquis."
 france_md.512.a: "Que vient-il de se passer ?"
 france_md.513.t: "Le Front national accède au second tour"
 france_md.513.d: "Contre toute attente, le Front national est sorti vainqueur du premier tour, alors que tous les pronostics annonçaient un duel Jospin-[FRA.GetLeader]. Devant l'incapacité des autres candidats à séduire l'électorat, le Front s'est qualifié pour le second tour. Heureusement, [FRA.GetLeader] devrait l'emporter : partis politiques et société civile, choqués qu'un parti d'extrême droite atteigne le ballottage, ont appelé à un vote massif contre Le Pen. De grandes manifestations ont eu lieu dans tout le pays en soutien au président sortant. C'est un événement historique ; espérons qu'il soit le seul."
 france_md.513.a: "Comment diable en est-on arrivé là ?"
 france_md.514.t: "Le PCF déclaré vainqueur de l'élection présidentielle"
 france_md.514.d: "Contre toute attente, le Parti communiste français est sorti vainqueur du premier tour, des mois après avoir croupi à son plus bas depuis la fin de la guerre froide. Les faiblesses du candidat Jospin et une alliance de la gauche radicale ont permis au PCF de rassembler la gauche et de s'assurer une avance nette vers le second tour, socialistes et centristes acceptant de ne pas s'y opposer pourvu qu'il ne quitte pas l'UE. Son chef a équilibré opposition à l'ordre libéral et réformisme pour ne pas aliéner le centre. La victoire du PCF ne fait pas de doute, mais tiendra-t-il sa coalition ?"
 france_md.514.a: "Des jours meilleurs sont enfin là"
 france_md.515.t: "Le PCF s'est qualifié pour le second tour"
 france_md.515.d: "Contre toute attente, le Parti communiste français est sorti vainqueur du premier tour, à peine des mois après avoir croupi à son plus bas depuis la fin de la guerre froide. Les faiblesses du candidat Jospin et une alliance de la gauche radicale ont permis au PCF d'obtenir une place au second tour. Sa victoire n'est toutefois pas complète : les centristes ont annoncé qu'ils voteraient pour [FRA.GetLeader], voyant un triomphe de la gauche radicale comme un mauvais présage pour l'intégration européenne et les marchés. Le second tour n'a pas encore eu lieu, mais il y a de fortes chances que [FRA.GetLeader] triomphe une fois de plus."
 france_md.515.a: "C'était moins une"
 france_md.516.t: "Le RPF a atteint le second tour"
 france_md.516.d: "Contre toute attente, le président sortant a été éliminé du second tour, abattu par son propre parti : le gaulliste Charles Pasqua a réussi à siphonner assez de conservateurs et de souverainistes à droite pour perturber la campagne de [FRA.GetLeader]. Le RPF n'est toutefois pas seul au second tour. Il y affrontera Lionel Jospin, le candidat socialiste qui a atteint le ballottage malgré les divisions internes à gauche. Ce duel sera acharné, car il ne s'agit pas simplement de socialisme contre conservatisme : la semaine prochaine, le peuple français décidera s'il veut plus ou moins d'Europe."
 france_md.516.a: "La souveraineté l'emportera"
 france_md.516.b: "Le vote de contestation reste minoritaire"
 france_md.517.t: "L'UDF accède au second tour"
 france_md.517.d: "Le rassemblement des électeurs pro-européens derrière l'UDF a permis au parti d'atteindre le second tour. Les socialistes n'étaient pas les seuls à promouvoir l'Union européenne, et les libéraux étaient plus proches des valeurs libérales de l'Union. On a souvent tendance à préférer l'original à l'imitation. L'UDF a donc réussi à rejoindre le président sortant au second tour. C'est donc un duel entre la politique d'indépendance de Chirac et l'Europe à tout prix des libéraux. L'élection s'annonce serrée, les principaux blocs étant eux-mêmes profondément divisés sur cette question. Heureusement, nous n'aurons pas longtemps à attendre : le second tour est imminent."
 france_md.517.a: "Le vieux conservateur est tenu à distance"
 france_md.517.b: "Le programme de l'UDF se révèle un peu trop libéral pour l'électorat"
 france_md.518.t: "Les Verts se qualifient pour le second tour"
 france_md.518.d: "Après une campagne entre partis de gauche, les Verts ont réussi, contre toute attente, à se qualifier pour le second tour. Leur programme social et environnemental est à la pointe du progrès, et ayant gardé leur sang-froid au milieu des accrochages PCF-PS, ils en sont venus à incarner la solution la plus sage et la plus juste. Ils rejoignent désormais le président sortant au second tour. Le duel s'annonce acharné, mais pour une fois il y a unanimité dans chaque bloc : la gauche vote le progressisme, la droite le conservatisme, et le choc de la semaine prochaine portera autant sur l'environnement que sur le social."
 france_md.518.a: "Un logiciel conservateur dépassé n'est plus à la hauteur des défis de notre millénaire"
 france_md.518.b: "L'environnement n'est pas encore assez prioritaire."
 france_md.519.t: "Lionel Jospin s'est qualifié pour le second tour"
 france_md.519.d: "Comme le prédisaient tous les sondages, le candidat socialiste s'est qualifié pour le second tour sans trop de mal. Son programme moderne et pro-européen a séduit socialistes et centristes, lui donnant une base électorale solide, tandis que les partis de gauche plus radicale, profondément divisés, n'ont pas menacé l'ancien Premier ministre. Il affrontera son rival cette semaine, à nouveau le choc entre progressisme et conservatisme. Mais les sondages sont serrés, et Jospin pourrait avoir besoin du soutien des partis de gauche, car le RPR pourrait bénéficier de groupes plus à droite peu enclins à accepter un président socialiste."
 france_md.519.a: "Jospin parvient à séduire le reste de la gauche"
 france_md.519.b: "Jospin n'a pas séduit les électeurs plus à gauche, son programme étant trop libéral"
 FRA_Macron_eco: "La loi Macron"
 FRA_Macron_eco_desc: "Nous avons décidé de suivre la politique définie par notre ministre des Finances, Emmanuel Macron. Une loi qui simplifiera l'investissement et l'emploi tout en réduisant les dépenses de l'État."
 FRA_Ferrand_eco: "La loi Ferrand"
 FRA_Ferrand_eco_desc: "Nous avons décidé de suivre la politique définie par notre ministre des Finances, Olivier Ferrand. Une loi qui simplifiera l'investissement et l'emploi tout en réduisant les dépenses de l'État."
 FRA_ineluctable_collapse: "Effondrement de la coalition"
 FRA_ineluctable_collapse_desc: "Notre parti et notre coalition se délitent ; il faut régler cela vite avant qu'il ne soit trop tard !"
 FRA_manif_pour_tous: "La Manif pour Tous"
 FRA_manif_pour_tous_desc: "Des centaines de milliers de personnes dans la rue chaque mois, un mouvement conservateur que la droite n'avait pas réussi à bâtir en vingt ans, et un parti au pouvoir qui doit désormais légiférer à travers lui."
 FRA_grand_debat: "Le Grand Débat National"
 FRA_grand_debat_desc: "Dix mille mairies, deux millions de contributions, et un paquet de concessions assez lourd pour vider les ronds-points. La paix était réelle. La facture aussi."
 FRA_bassin_minier: "L'engagement du bassin minier"
 FRA_bassin_minier_desc: "Hauts fourneaux rallumés et postes ouverts dans l'ancien bassin houiller et dans le Midi. La promesse retient l'extrême droite tant qu'on la tient."
 FRA_resist_inevitable: "Efforts de stabilisation"
 FRA_resist_inevitable_desc: "Le déclin n'est pas irréversible. Nos militants sont de retour aux portes, et la fuite loin de nous a ralenti."
 FRA_resist_inevitable2: "Efforts de stabilisation"
 FRA_resist_inevitable2_desc: "L'hémorragie a cessé. Nous avons stabilisé le parti et tourné notre attention vers la base industrielle dont dépendent nos électeurs."
 FRA_resist_inevitable3: "Efforts de stabilisation"
 FRA_resist_inevitable3_desc: "Nous avons survécu aux nécrologies. Le parti est de nouveau sur un terrain ferme, avec une base consolidée et un programme auquel nos rivaux doivent désormais répondre."
 FRA_socialism_renew: "Le socialisme renouvelé"
 FRA_socialism_renew_desc: "Nous avons reconstruit la légitimité de notre parti sur des bases solides. L'avenir est devant nous."
 FRA_pension_reform: "Réforme des retraites"
 FRA_pension_reform_desc: "Face à la crise budgétaire, nous avons dû relever l'âge de la retraite ; ils n'étaient pas contents, mais il le fallait"
 FRA_french_rearmament: "Réarmement Phase 1"
 FRA_french_rearmament_desc: "Les tensions se rallumant en Europe, nous n'avons d'autre choix que de nous réarmer pour écarter le pire."
 FRA_french_rearmament2: "Réarmement Phase 2"
 FRA_french_rearmament2_desc: "Former davantage de soldats ne suffit pas ; il faut accroître notre capacité à produire des armes"
 FRA_french_rearmament3: "Réarmement accompli"
 FRA_french_rearmament3_desc: "Notre population et nos forces armées sont prêtes à affronter un conflit de grande ampleur"
 french_nuclear_expert: "Experts nucléaires français"
 french_nuclear_expert_desc: "Nous avons accepté l'aide d'experts français en technologie nucléaire. Ils nous aideront à bâtir notre indépendance énergétique."
 french_dissuasion: "Dissuasion Nucléaire Française"
 french_dissuasion_desc: "Nous avons accepté la protection de la France et de l'Union européenne en cas de conflit avec une puissance hostile."
 FRA_Our_project: "Notre projet pour la France"
 FRA_Our_project_desc: "Malgré la résistance initiale de l'opinion, elle a compris que tout ce que nous faisons doit l'être pour protéger l'avenir de la France. Plus que jamais, nous sommes à l'abri des soubresauts économiques et géopolitiques. Et cela le restera longtemps."
 FRA_french_independant1: "Un cap à nous"
 FRA_french_independant1_desc: "La France ne s'alignera derrière aucun des deux blocs. Rester à l'écart nous vaut l'oreille de toute autre puissance qui refuse de se choisir un maître."
 FRA_french_independant2: "Ne rendre de comptes à aucune capitale"
 FRA_french_independant2_desc: "Notre refus de nous aligner s'est durci en politique établie. Ni Washington ni Moscou n'attendent plus notre voix, et le monde non-aligné nous traite comme l'un des siens."
 FRA_french_independant3: "L'indépendance sous les armes"
 FRA_french_independant3_desc: "L'indépendance n'est plus une posture diplomatique mais une doctrine de défense. Une nation qui ne rend de comptes à personne doit pouvoir tenir son sol sans aide, et la nôtre le peut désormais."
 FRA_NATO_support: "Soutien de l'OTAN"
 FRA_NATO_support_desc: "En réaffirmant notre soutien à notre alliance, nous avons forgé des partenariats avec d'autres pays membres."
 FRA_entente_china: "Entente avec la Chine"
 FRA_entente_china_desc: "Nous avons conclu des accords avec la Chine pour faciliter le commerce entre nos deux pays."
 FRA_regulation: "Régulation des marchés"
 FRA_regulation_desc: "En acceptant de réguler le marché et ses activités, nous pouvons éviter les crises à venir."
 FRA_eternal_fra: "La France éternelle"
 FRA_eternal_fra_desc: "Nous arrivons au terme de notre programme, convaincus d'avoir montré au monde que la France est de retour et ne s'effacera jamais de la scène internationale."
 FRA_europhile_anger_idea: "Manifestations pro-européennes"
 FRA_europhile_anger_idea_desc: "Certains de nos concitoyens répugnent à quitter l'Union européenne. Cela ne durera qu'un temps, mais il faut faire comprendre au peuple français que c'est la seule voie."
 FRA_EU_Retaliate: "Reprise de l’économie"
 FRA_EU_Retaliate_desc: "Quitter l'Union européenne nous a mis dans une situation économique difficile, mais nous rebondirons, quel qu'en soit le coût."
 FRA_EU_Retaliate2: "Récupération initiale"
 FRA_EU_Retaliate2_desc: "Nos efforts commencent à payer ; notre économie se rétablit, et cette fois personne ne nous met la pression ni ne nous empêche de faire ce que nous voulons de notre argent."
 FRA_russian_cooperation1: "La coopération russe"
 FRA_russian_cooperation1_desc: "Le gouvernement russe a accepté de partager son expertise industrielle avec nous. Puisse cette coopération durer."
 FRA_russian_cooperation2: "Le partenariat russe"
 FRA_russian_cooperation2_desc: "Le gouvernement russe a accepté de partager son expertise industrielle et militaire avec nous. Puisse cette coopération durer."
 FRA_a_certain_idea: "Une certaine idée de la France"
 FRA_a_certain_idea_desc: "Nous sommes parvenus au bout du chemin. Nous avons sauvé la France d'être reléguée au profit de l'Europe. L'indépendance de la France est assurée. Notre maître Charles de Gaulle serait fier de nous."
 FRA_blocade: "Flux commerciaux perturbés"
 FRA_blocade_desc: "Nous avons refusé de céder au chantage de la France, alors ils font tout pour empêcher les marchandises du reste de l'Union européenne de nous parvenir."
 FRA_shocking: "Population déçue"
 FRA_shocking_desc: "Notre peuple était très enthousiaste à l'idée du plan de VIe République, mais nous avons finalement décidé de garder la Constitution telle quelle. Ils n'étaient pas contents."
 FRA_draft6threp: "Instabilité politique"
 FRA_draft6threp_desc: "Notre volonté de changement radical de la Constitution de notre république a suscité un grand enthousiasme dans la population. Elle ouvre de nouveaux horizons. Elle ouvre aussi la voie à l'émergence de nouveaux mouvements politiques qui ne seront pas toujours en notre faveur."
 FRA_fail6threp: "L'échec de la réforme"
 FRA_fail6threp_desc: "Nous n'avons pas réussi à libérer notre peuple de la Ve République ; ils ont fini par perdre espoir face à la difficulté de parvenir à un consensus. Peut-être parviendrons-nous à changer nos lois, mais pour notre peuple, nous aurons échoué à lui apporter le changement qu'il espérait."
 FRA_ecological_transition: "Assurer la transition écologique"
 FRA_ecological_transition_desc: "Pour assurer un avenir aux générations suivantes, il faut protéger l'environnement. Pour cela, il faut changer notre façon de consommer et de produire."
 FRA_insoumission: "L'Insoumission"
 FRA_insoumission_desc: "Nous avons mené à bien le programme pour lequel nous avons été élus. Nous avons rendu la France plus sociale, plus écologique et plus humaniste qu'elle ne l'a jamais été. Mais il reste encore beaucoup à accomplir, et nous relèverons le défi. Il faut faire encore mieux."
 FRA_eu_social_climate: "Réformes sociales et environnementales"
 FRA_eu_social_climate_desc: "Nous avons accepté de suivre l'exemple de La France insoumise. Notre peuple s'en est inspiré. Quoique cela pèse sur nos finances, on peut y voir un investissement à long terme."
 FRA_research_boost: "Investissements dans la recherche"
 FRA_research_boost_desc: "Nous avons fortement investi dans la recherche et l'éducation pour que les générations futures soient encore mieux armées face aux défis modernes. Cela devrait payer à long terme."
 FRA_refit_network: "Moderniser notre réseau de transports"
 FRA_refit_network_desc: "Pour optimiser le transport des marchandises et des voyageurs, il faut d'abord moderniser notre réseau. Nous y avons consacré les ressources nécessaires."
 FRA_eden_garden: "Notre jardin d'Éden"
 FRA_eden_garden_desc: "En faisant tout pour protéger notre pays et le monde des ravages du changement climatique, nous avons posé les bases d'une société armée pour affronter les défis de notre millénaire. Lutter contre le changement climatique exigera encore des efforts, mais nous avons fait de notre mieux pour mener le mouvement."
 FRA_eu_green_reform: "Réformes environnementales"
 FRA_eu_green_reform_desc: "Nous avons décidé de suivre l'exemple des Verts français en investissant dans la transition verte. Quoique cela ralentisse la croissance de notre pays, c'est un investissement pour les générations futures."
 FRA_EU_transit: "Fonds de soutien à la transition écologique"
 FRA_EU_transit_desc: "Nous avons accepté de participer au fonds de soutien à la transition écologique. Cette initiative, lancée par les Verts français, vise à nous aider à passer d'une économie carbonée à une économie bas carbone."
 FRA_eu_ban_fossile: "Éliminer progressivement les combustibles fossiles"
 FRA_eu_ban_fossile_desc: "Nous sommes en train de sortir des énergies fossiles. Nos véhicules rouleront à l'électricité, et les fossiles ne serviront plus qu'à des usages marginaux. Cette transition, initiée par les Verts français, sera coûteuse. Mais c'est un investissement dans notre avenir et dans notre indépendance vis-à-vis des pays pétroliers."
 FRA_regulation_agra: "Règlements agricoles"
 FRA_regulation_agra_desc: "Nous avons accepté de nous conformer aux réglementations de l'Union européenne sur la production alimentaire. C'était notre seule option si nous ne voulions pas perdre un partenaire commercial clé."
 FRA_regulation_indus: "Régulations industrielles"
 FRA_regulation_indus_desc: "Nous avons accepté de nous conformer aux réglementations de l'Union européenne sur la production de biens. C'était notre seule option si nous ne voulions pas perdre un partenaire commercial clé."
 FRA_regulation_fuel: "Réglementation de l'extraction pétrolière"
 FRA_regulation_fuel_desc: "Nous avons accepté de nous conformer aux réglementations de l'Union européenne sur l'extraction de combustibles. C'était notre seule option si nous ne voulions pas perdre un partenaire commercial clé."
 FRA_EU_rail: "Construire un réseau de transport européen"
 FRA_EU_rail_desc: "Nous avons accepté d'aider la France et le reste de l'Union européenne à bâtir ensemble un meilleur réseau de transports pour faciliter le commerce et optimiser le transport des marchandises."
 FRA_eu_pcf_reform: "Acheter la paix sociale"
 FRA_eu_pcf_reform_desc: "Nous avons accepté des concessions à notre gauche radicale après qu'elle a commencé à s'agiter suite à la victoire du communisme en France. Nous leur avons donné ce qu'ils voulaient, et ils devraient maintenant se taire."
 FRA_fr_military_assistance: "Assistance militaire française"
 FRA_fr_military_assistance_desc: "Nous avons accepté l'aide de la France pour préparer nos forces armées à un conflit de haute intensité avec la Russie. Le jour où ils franchiront notre frontière, nous serons prêts."
 FRA_european_internationale: "L'Internationale européenne"
 FRA_european_internationale_desc: "Nous avons formé une alliance avec une autre puissance communiste en Europe. Ensemble, nous vaincrons le capitalisme et le fascisme une fois pour toutes."
 FRA_international_will_be_humankind: "L'Internationale sera le genre humain"
 FRA_international_will_be_humankind_desc: "Nous avons consolidé le pouvoir durement conquis. Nous avons accompli l'impossible : assurer le triomphe durable du communisme en France. Il reste encore beaucoup à faire, mais nous avons posé les bonnes bases de la lutte contre le capitalisme et le fascisme en France."
 FRA_eu_FN_reform: "Garantir la sécurité"
 FRA_eu_FN_reform_desc: "Nous avons répondu positivement à l'appel de notre peuple à mettre en œuvre la préférence nationale et à lutter contre l'insécurité. Quoique ces réformes soient une conséquence de la montée de l'extrême droite en Europe, elles renforcent aussi notre capacité à exercer un contrôle sur notre population, ce qui est une bonne chose."
 FRA_nuke_boost: "Primauté nucléaire"
 FRA_nuke_boost_desc: "Le nucléaire nous fournit de l'énergie depuis des décennies ; c'est un formidable moyen de produire une énergie bas carbone à bas coût. Il faudrait simplement renforcer la surveillance de ces réacteurs pour qu'il n'arrive rien de grave."
 FRA_Boreal_Space: "L'espace boréal"
 FRA_Boreal_Space_desc: "L'espace boréal est un partenariat entre la sphère russe et la francosphère, visant à intégrer la Russie dans une alliance européenne. Notre but aujourd'hui est de combattre la menace ultra-mondialiste, un ennemi que nous partageons."
 FRA_france_for_french: "La France aux Français"
 FRA_france_for_french_desc: "Depuis notre fondation, nous avons dû affronter une faction pro-immigration toujours unie contre nous. Mais maintenant que nous avons achevé notre programme, nous avons démontré notre capacité à diriger et à conduire la France vers son destin ; toute résistance supplémentaire est désormais vaine."
 FRA_red_purges: "La purge du corps des officiers"
 FRA_red_purges_desc: "L'ancien corps des officiers n'a jamais été nôtre, aussi l'avons-nous brisé et promu depuis les rangs. Le commandement est désormais loyal, et bon marché à remplacer, mais une armée professionnelle a été échangée contre une qui apprend encore son métier sous le feu."
 FRA_people_constitution: "La Constitution du peuple"
 FRA_people_constitution_desc: "Notre révolution a réussi, mais il faut consolider notre pouvoir en donnant aux travailleurs la possibilité de décider eux-mêmes comment ils veulent être gouvernés."
 FRA_commies_redarmy1: "La nouvelle Armée rouge"
 FRA_commies_redarmy1_desc: "Notre révolution a besoin d'une armée pour se défendre et répandre sa cause. Sur les fondations de l'armée française, nous avons établi une force nouvelle qui défendra le peuple et la révolution."
 FRA_commies_redarmy2: "La nouvelle Armée rouge"
 FRA_commies_redarmy2_desc: "Notre révolution a besoin d'une armée pour se défendre et répandre sa cause. Sur les fondations de l'armée française, nous avons établi une force nouvelle qui défendra le peuple et la révolution."
 FRA_red_agent_lar: "Direction générale de l'action révolutionnaire"
 FRA_red_agent_lar_desc: "Nous avons calqué notre approche sur les techniques de la DGSE afin d'obtenir des informations cruciales sur nos ennemis réactionnaires et capitalistes."
 FRA_red_agent_non_lar: "Direction générale de l'action révolutionnaire"
 FRA_red_agent_non_lar_desc: "Nous avons calqué notre approche sur les techniques de la DGSE afin d'obtenir des informations cruciales sur nos ennemis réactionnaires et capitalistes."
 FRA_monarchist_anger: "La colère des monarchistes"
 FRA_monarchist_anger_desc: "Nos alliés monarchistes ont été déçus par notre refus de restaurer les privilèges aristocratiques. Le bonapartisme est héritier de la Révolution ; il ne pouvait en être autrement."
 FRA_bonapart_constitution: "La Constitution bonapartiste"
 FRA_bonapart_constitution_desc: "Depuis la IIIe République, nos institutions ne sont plus conçues pour accueillir un Empereur de notre stature. Il faut donc adapter la Constitution à notre prochain règne. Nous pouvons en profiter pour répondre à certaines critiques que notre peuple adressait aux républiques précédentes ; ce sera un pas dans la bonne direction pour eux."
 FRA_bonapart_military_reform: "Réorganisation de la Grande Armée"
 FRA_bonapart_military_reform_desc: "Nos forces armées suffisent à assurer notre sécurité sur notre territoire, mais pas à mener nos plans de reconquête de l'Empire. Une restructuration s'impose ; nous allons tout démonter du sommet jusqu'à la base, pour ensuite réformer chaque arme plus efficacement."
 FRA_army_reformed_1: "Chaîne de commandement restructurée"
 FRA_army_reformed_1_desc: "Maintenant que notre chaîne de commandement a été restructurée, nous pouvons nous permettre une réforme plus profonde de nos forces armées, y compris leur technologie et leur carnet de commandes. Une entreprise majeure nous attend, mais cela nous donnera les moyens de réaliser nos ambitions."
 FRA_army_reformed_infantry: "Réforme de la Grande Armée : la ligne d'infanterie"
 FRA_army_reformed_infantry_desc: "Notre Empereur a tranché en faveur d'une avance lente et contrôlée. La priorité ira donc à l'infanterie et à l'équipement dont elle a besoin."
 FRA_army_reformed_cavalry: "Réforme de la Grande Armée : le coin blindé"
 FRA_army_reformed_cavalry_desc: "Notre Empereur a tranché en faveur d'une attaque rapide et puissante. La priorité ira donc aux bataillons de chars et à l'équipement dont ils ont besoin."
 FRA_army_reformed_artillery_infantry: "Réforme de la Grande Armée : infanterie et canons"
 FRA_army_reformed_artillery_infantry_desc: "Notre Empereur a tranché en faveur d'une avance lente et contrôlée appuyée par l'artillerie. La priorité ira donc à l'infanterie et à l'artillerie, ainsi qu'à l'équipement associé."
 FRA_army_reformed_artillery_cavalry: "Réforme de la Grande Armée : blindés et canons"
 FRA_army_reformed_artillery_cavalry_desc: "Notre Empereur a tranché en faveur d'une attaque rapide et puissante appuyée par l'artillerie. La priorité ira donc aux bataillons de chars et à l'artillerie, ainsi qu'à l'équipement associé."
 FRA_army_reformed_air_infantry: "Réforme de la Grande Armée : infanterie et puissance aérienne"
 FRA_army_reformed_air_infantry_desc: "Notre Empereur a tranché en faveur d'une avance lente et contrôlée appuyée par des avions d'attaque. La priorité ira donc aux bataillons d'infanterie et à la production en masse d'appareils."
 FRA_army_reformed_air_cavalry: "Réforme de la Grande Armée : blindés et puissance aérienne"
 FRA_army_reformed_air_cavalry_desc: "Notre Empereur a tranché en faveur d'une attaque rapide et puissante appuyée par des avions d'attaque. La priorité ira donc aux bataillons de chars et à la production en masse d'appareils."
 FRA_BCE_money: "L'argent de l'UE"
 FRA_BCE_money_desc: "Nous avons réussi à négocier notre retour dans les institutions de l'Union européenne en échange d'une aide de la Banque européenne. Cette aide sera vitale pour préparer les guerres que nous allons leur livrer !"
 FRA_4th_empire_desc: "L'Empire bonapartiste est de retour, plus fort que jamais, et cette fois aucune coalition ne nous vaincra."
 FRA_grande_arme_art_inf: "La Grande Armée moderne"
 FRA_grande_arme_art_inf_desc: "Après des mois de réformes, notre armée est pleinement prête à partir reconquérir les territoires perdus de l'Empire. Après une refonte complète de son système, nous l'avons reconstruite autour d'une stratégie d'avance lente et régulière, appuyée par des bombardements intensifs des lignes ennemies. L'infanterie reste la reine du champ de bataille, mais l'aviation d'assaut lui facilitera considérablement la tâche."
 FRA_grande_arme_art_cav: "Un déluge de feu et d'acier"
 FRA_grande_arme_art_cav_desc: "Après des mois de réformes, notre armée est pleinement prête à partir reconquérir les territoires perdus de l'Empire. Après une refonte complète de son système, nous l'avons reconstruite autour d'une stratégie d'avance rapide et brutale, appuyée par des bombardements intensifs. Cette stratégie s'appuie sur des ressources technologiquement avancées, mais nous avons les moyens de surpasser le déluge de Napoléon."
 FRA_grande_arme_air_inf: "Le ciel ouvre la voie"
 FRA_grande_arme_air_inf_desc: "Après des mois de réformes, notre armée est pleinement prête à partir reconquérir les territoires perdus de l'Empire. Nous l'avons reconstruite autour d'une avance d'infanterie mesurée menée entièrement sous notre propre couverture aérienne, avions d'attaque et reconnaissance brisant chaque position avant qu'un fusilier n'y soit engagé. Le fantassin prend encore le terrain, mais il n'y marche plus à l'aveugle."
 FRA_grande_arme_air_cav: "Le tonnerre avant la charge"
 FRA_grande_arme_air_cav_desc: "Après des mois de réformes, notre armée est pleinement prête à partir reconquérir les territoires perdus de l'Empire. Nous l'avons reconstruite autour de colonnes blindées qui n'avancent que là où l'armée de l'air est déjà passée, échangeant le train d'artillerie contre des ailes d'attaque qui suivent le rythme de l'avance. Rien ne ralentit la charge, et rien ne survit devant elle."
 FRA_surrounded: "Blocus continental"
 FRA_surrounded_desc: "Notre accession au pouvoir n'est pas passée inaperçue, et il est clair que les autres puissances européennes complotent déjà contre nous. En particulier la Grande-Bretagne, notre ennemie jurée par le passé. Il faut abattre chacune de ces puissances européennes ; notre survie et celle de la révolution en dépendent."
 FRA_Sachons_vaincre: "Le Déluge"
 FRA_Sachons_vaincre_desc: "Ayant passé des mois à préparer notre peuple à un conflit de haute intensité, il est désormais prêt pour cette guerre tant attendue. Leur enthousiasme et leur foi peuvent déplacer des montagnes, mais il faut agir vite avant qu'ils ne s'étiolent. Il faut écraser nos adversaires aussi rapidement que possible."
 FRA_prepare_to_fight: "Préparer notre retour"
 FRA_prepare_to_fight_desc: "Nous avons opté pour une approche prudente ; sachant que notre peuple soutient pleinement nos ambitions expansionnistes, il ne reste plus qu'à lui en donner les moyens. Il faut veiller à ce que, le moment venu, nous soyons prêts."
 FRA_defense_napoleon: "État d'urgence"
 FRA_defense_napoleon_desc: "Après les attentats commis à nos frontières par les bonapartistes, notre pays est en alerte maximale. Quoi qu'il arrive, nous serons prêts."
 FRA_thousands_planes: "Course aux armements aériens"
 FRA_thousands_planes_desc: "Nous avons choisi d'affronter les États-Unis, qui trop longtemps ont cherché à nous dominer, nous et le reste de l'Europe. Pour protéger l'Europe, il faut les détruire, et pour les détruire il faut pouvoir rivaliser dans les airs, car nous n'avons pas les moyens de les vaincre en mer."
 FRA_trade_USA: "Commerce transatlantique"
 FRA_trade_USA_desc: "Les États-Unis et l'Empire français se sont unis pour commercer à travers l'Atlantique. Ces accords leur apporteront paix et prospérité en échange de garanties de paix."
 FRA_king_camelot_lar: "Les Camelots du Roi"
 FRA_king_camelot_lar_desc: "Notre police secrète, chargée de réprimer toutes les tendances révolutionnaires et autres mouvements anti-royalistes."
 FRA_king_camelot_non_lar: "Les Camelots du Roi"
 FRA_king_camelot_non_lar_desc: "Notre police secrète, chargée de réprimer toutes les tendances révolutionnaires et autres mouvements anti-royalistes."
 FRA_king_constitution: "La Constitution monarchiste"
 FRA_king_constitution_desc: "Toutes ces républiques que notre pays a traversées ont bâti des institutions sur des fondations branlantes. Il faut réécrire cette infamie, car tout État, même sous notre règne absolu, a besoin de lois."
 FRA_chivalry: "Chevalerie moderne"
 FRA_chivalry_desc: "La monarchie française s'est toujours appuyée sur une puissante cavalerie. Nous avons choisi de poursuivre dans cette voie en privilégiant la cavalerie mécanisée plutôt que l'infanterie."
 FRA_elite_army: "Une armée d'élites"
 FRA_elite_army_desc: "Les guerres révolutionnaires ont instauré la conscription. Toutefois, les nombreux conflits que nous avons connus se sont révélés extrêmement coûteux en vies humaines. Les sujets du Roi ne sont pas toujours bien formés à la guerre. Nous avons donc choisi de miser sur une force plus réduite mais bien mieux entraînée."
 FRA_prepare_crusade: "La Dixième croisade"
 FRA_prepare_crusade_desc: "Nos forces sont prêtes à partir à la conquête de la Terre sainte."
 FRA_political_preassure: "Renforcer notre diplomatie"
 FRA_political_preassure_desc: "Nous n'avons pas réussi à gagner diplomatiquement le Liban, aussi faut-il améliorer notre façon d'engager les puissances étrangères."
 FRA_navy_crusade: "La croisade maritime"
 FRA_navy_crusade_desc: "Nous avons décidé de reprendre la Terre sainte par la mer. Cela exige des capacités offensives amphibies efficaces."
 FRA_commie_europe_integration: "Assimilation européenne"
 FRA_commie_europe_integration_desc: "Nous avons apporté la révolution et le communisme au reste de l'Europe. Il est maintenant temps de forger une union du prolétariat de chaque pays en une fédération européenne capable d'assurer la pérennité de la révolution."
 FRA_counter_insurgency: "Un maintien de l'ordre militaire efficace"
 FRA_counter_insurgency_desc: "Les guérillas espagnoles ont posé un problème à Napoléon Ier, mais ce ne sera pas le cas pour nous."
 FRA_attack_benelux: "Plan de bataille : Benelux"
 FRA_attack_benelux_desc: "Il faut nous concentrer sur l'anéantissement des forces du Benelux. Notre Empereur nous a donné les moyens de les vaincre rapidement."
 FRA_attack_iberia: "Plan de bataille : Ibérie"
 FRA_attack_iberia_desc: "Il faut nous concentrer sur l'anéantissement des forces ibériques. Notre Empereur nous a donné les moyens de les vaincre rapidement."
 FRA_attack_germany: "Plan de bataille : Allemagne"
 FRA_attack_germany_desc: "Il faut nous concentrer sur l'anéantissement des forces allemandes. Notre Empereur nous a donné les moyens de les vaincre rapidement."
 FRA_attack_holy_roman: "Plan de bataille : Europe du Sud"
 FRA_attack_holy_roman_desc: "Il faut nous concentrer sur l'anéantissement des restes des forces d'Europe du Sud. Notre Empereur nous a donné les moyens de les vaincre rapidement."
 FRA_BON_support_allies: "Préparation à une guerre longue"
 FRA_BON_support_allies_desc: "Notre partenaire français a suggéré que nous nous préparions à un conflit de haute intensité avec la Russie."
 FRA_attack_east: "Plan de bataille : Europe de l'Est"
 FRA_attack_east_desc: "Il faut nous concentrer sur l'anéantissement des forces d'Europe de l'Est. Notre Empereur nous a donné les moyens de les vaincre rapidement. C'est l'ultime étape avant notre campagne finale."
 FRA_attack_russia_fast: "La Fleur au Fusil"
 FRA_attack_russia_fast_desc: "Nous serons à Moscou dans deux semaines !"
 FRA_attack_russia_slow: "Avance prudente"
 FRA_attack_russia_slow_desc: "Cette fois, il n'y aura pas de Bérézina"
 FRA_attack_UK_naval: "Traverser la Manche"
 FRA_attack_UK_naval_desc: "La Royal Navy n'est plus une menace pour nous ; la victoire est à notre portée."
 FRA_attack_UK_air: "Sauter par-dessus la Manche"
 FRA_attack_UK_air_desc: "Il faut maintenir le contrôle de l'espace aérien et prendre notre adversaire par surprise."
 FRA_BON_victory: "Protectorat Impérial"
 FRA_BON_victory_desc: "Nous avons été conquis par l'Empire napoléonien."
 FRA_expansion_europe: "Héritier de Charlemagne"
 FRA_expansion_europe_desc: "Notre destin est de reconquérir l'Empire carolingien."
 FRA_expansion_europe_crusades: "Croisade carolingienne"
 FRA_expansion_europe_crusades_desc: "Les Francs ont repris leurs terres ; il faut maintenant partir pour la Terre sainte."
 FRA_expansion_crusades: "Héritier de Saint Louis"
 FRA_expansion_crusades_desc: "Le devoir de notre Royaume est de servir Dieu et de reconquérir la Terre sainte."
 FRA_EMPIRE_occident: "L'Empire d'Occident"
 FRA_EMPIRE_occident_desc: "Nous avons reconquis l'Empire carolingien et avons été couronnés Empereur d'Occident."
 FRA_crusade_done_jerusalem: "La croisade victorieuse"
 FRA_crusade_done_jerusalem_desc: "La Dixième croisade a atteint son objectif en reprenant Jérusalem et la Terre sainte."
 FRA_expansion_crusades_plus: "La dernière croisade"
 FRA_expansion_crusades_plus_desc: "Ayant reconquis nos lieux saints, nous avons décidé de réparer les erreurs du passé. Tous les schismes doivent cesser."
 FRA_protestant_anger: "Résistance protestante"
 FRA_protestant_anger_desc: "Notre rhétorique agressive envers les protestants a provoqué leur colère dans notre pays."
 FRA_harsh_subjugation: "Une soumission dure"
 FRA_harsh_subjugation_desc: "Notre suzerain, le roi de France, a décidé de contrôler notre économie et nos politiques. La défaite a un lourd prix."
 FRA_victory_crusade_2_conversion: "Le cinquième cavalier de l'Apocalypse"
 FRA_victory_crusade_2_conversion_desc: "La colère divine s'est déchaînée sur nos ennemis."
 FRA_enlightment: "Protectorat de l'Église"
 FRA_enlightment_desc: "Notre suzerain, le roi de France, a décidé de nous aider à reconstruire notre pays, et de nous soutenir dans la reconstruction physique et culturelle de notre société."
 FRA_victory_crusade_2_freedom_light: "La fille aînée de l'Église"
 FRA_victory_crusade_2_freedom_light_desc: "Il faut traiter les brebis égarées avec la plus grande bonté."
 FRA_attack_colonies: "Reconquérir les colonies de l'Empire"
 FRA_attack_colonies_desc: "Le système continental doit trouver les ressources pour assurer sa pérennité."
 france_md.404.t: "L'accord avec les Verts"
 france_md.404.d: "La négociation est close et le texte est sur la table. Vingt-quatre réacteurs fermés, Fessenheim en premier, et le nucléaire ramené à la moitié du mix électrique d'ici la décennie. En échange, les Verts se retirent dans soixante circonscriptions et la majorité tient. Les fédérations de l'énergie ont déjà voté contre, et Montebourg a dit en public ce que la moitié du groupe parlementaire dit en privé. Signons-nous ?"
 france_md.404.a: "Signer. L'alliance vaut plus que les réacteurs"
 france_md.404.b: "Le parc n'est pas une monnaie d'échange"
 france_md.405.t: "La Manif pour Tous"
 france_md.405.d: "Notre récente proposition de loi ne semble pas faire l'unanimité parmi nos concitoyens. Ils ont envahi le Champ de Mars et entendent le faire chaque mois jusqu'à ce que le texte meure. Les organisateurs sont prudents, les pancartes roses et bleues, et derrière elles se tiennent toutes les associations conservatrices du pays plus une bonne part du groupe parlementaire de droite. Le texte tel que rédigé couvre le mariage, l'adoption et la filiation. Nous pouvons tenir sur les trois, ou retirer ce qui draine les plus grandes foules et faire passer le reste en silence."
 france_md.405.a: "La loi passe entière. Qu'ils défilent"
 france_md.405.b: "Élaguer le texte et prendre ce que l'on peut"
 france_md.406.t: "Les ronds-points sont occupés"
 france_md.406.d: "Huit week-ends. Les préfectures font état d'un millier de ronds-points tenus, l'Arc de Triomphe a été vandalisé, et les tirs de LBD ont crevé des yeux devant les caméras. Il n'y a pas de direction avec qui négocier, car ils refusent d'en nommer une. L'Intérieur veut la loi anti-casseurs et les mains libres. Les autres veulent un débat national, des mairies dans chaque commune, et un paquet de concessions assez large pour en finir avant les européennes."
 france_md.406.a: "Faire passer la loi anti-casseurs et dégager les ronds-points"
 france_md.406.b: "Ouvrir le Grand Débat et payer la paix"
 FRA_change_politics_nationalist: "Modifie §Y$FRA_political_balance$§! : $FRA_balance_domestic_nationalist_drift$ de [?temp_change|%+]\n"
 FRA_truly_absolutism_TT: "§gNous§! §Rbannirons§! §gtous les autres partis, et déclarerons le royaume une§! §Ymonarchie véritablement absolue§!"
 FRA_social_welf_need_tooltip_modifier_effect_TT: "Modifie §Y$FRA_social_balance$§! : $FRA_SOC_welf_ned$ de [?temp_change|%-]\n"
 FRA_4th_empire: "Troisième Empire français"
 threat_FRA_napo_empire: "Napoléon est de retour"
 FRA_liberal_arms_contracts: "Politique libérale d'exportation d'armes"
 FRA_liberal_arms_contracts_desc: "Dassault, Naval Group, Thales et MBDA dirigent l'une des industries de défense les plus avancées au monde. Une politique d'export libérale nous permet de poursuivre des contrats lucratifs avec des nations en quête de modernisation, remplissant les carnets de commandes de nos usines tout en étendant l'influence française par des partenariats militaires."
 FRA_liberal_arms_contracts_tt: "Dans les mois à venir, nous proposerons des contrats d'armement à l'§YArabie saoudite§!, aux §YÉmirats arabes unis§!, à la §YSerbie§!, à la §YGrèce§!, à l'§YÉgypte§! et à l'§YInde§!."
 FRA_arms_contract_opinion: "Partenariat pour les contrats d’armement"
 france_md.323.t: "Courtiser Riyad"
 france_md.323.d: "Riyad cherche un chasseur pour voler aux côtés de ses Eurofighter, et les ingénieurs de Naval Group entretiennent encore les frégates de classe Al Riyadh construites dans le cadre du programme Sawari. Notre ministère de la Défense a préparé une proposition pour [SAU.GetNameWithFlag]. Que proposer ?"
 france_md.323.a: "Lot d'armes légères ($5 milliards)"
 france_md.323.b: "Lot d'armes lourdes ($15 milliards)"
 france_md.323.c: "Lot Rafale premium ($30 milliards)"
 france_md.323.e: "Nous ne poursuivrons pas ce contrat"
 france_md.324.t: "Riyad pèse une offre française"
 france_md.324.d: "[FRA.GetNameWithFlag] propose le Rafale comme alternative à nos escadrons Eurofighter, ainsi qu'une extension du programme de frégates Sawari que Naval Group entretient depuis des décennies."
 france_md.324.a: "Accepter le contrat"
 france_md.324.b: "Refuser l'offre"
 france_md.325.t: "Courtiser Abu Dhabi"
 france_md.325.d: "L'armée de l'air émiratie vole encore le Mirage 2000-9, la variante que Dassault a conçue spécifiquement pour Abou Dabi dans les années 1990. Cette flotte vieillissant, notre ministère de la Défense voit une ouverture pour proposer son successeur, le Rafale, à [UAE.GetNameWithFlag]. Que proposer ?"
 france_md.325.a: "Lot d'armes légères ($5 milliards)"
 france_md.325.b: "Lot d'armes lourdes ($15 milliards)"
 france_md.325.c: "Lot Rafale premium ($30 milliards)"
 france_md.325.e: "Nous ne poursuivrons pas ce contrat"
 france_md.326.t: "Abou Dhabi pèse une offre française"
 france_md.326.d: "[FRA.GetNameWithFlag] propose le Rafale comme successeur de notre flotte de Mirage 2000-9, la variante sur mesure que Dassault a construite pour nous il y a trois décennies."
 france_md.326.a: "Accepter le contrat"
 france_md.326.b: "Refuser l'offre"
 france_md.327.t: "Courtiser Belgrade"
 france_md.327.d: "[SER.GetNameWithFlag] vole encore des MiG-29 de l'ère soviétique et achète sa défense aérienne à courte portée à Moscou. Nous pouvons proposer le Rafale pour les remplacer, appuyé par les missiles portables Mistral de MBDA pour leurs unités de défense aérienne. Que proposer ?"
 france_md.327.a: "Lot d'armes légères ($3 milliards)"
 france_md.327.b: "Lot d'armes lourdes ($8 milliards)"
 france_md.327.c: "Lot Rafale premium ($15 milliards)"
 france_md.327.e: "Nous ne poursuivrons pas ce contrat"
 france_md.328.t: "Belgrade pèse une offre française"
 france_md.328.d: "[FRA.GetNameWithFlag] propose le Rafale comme alternative occidentale à notre vieillissante flotte de MiG-29, ainsi que les missiles Mistral de MBDA pour nos unités de défense aérienne. Accepter marquerait notre premier grand contrat d'armement hors de l'orbite russe."
 france_md.328.a: "Accepter le contrat"
 france_md.328.b: "Refuser l'offre"
 france_md.329.t: "Courtiser Athènes"
 france_md.329.d: "[GRE.GetNameWithFlag] vole déjà nos Rafale et souhaite étendre la relation à la marine. Naval Group a proposé un paquet de frégates dérivées FREMM pour accompagner la commande de l'armée de l'air. Que proposer à nos alliés hellènes ?"
 france_md.329.a: "Lot d'armes légères ($4 milliards)"
 france_md.329.b: "Lot d'armes lourdes ($12 milliards)"
 france_md.329.c: "Lot Rafale premium ($20 milliards)"
 france_md.329.e: "Nous ne poursuivrons pas ce contrat"
 france_md.330.t: "Athènes pèse une offre française"
 france_md.330.d: "[FRA.GetNameWithFlag] propose un paquet autour de frégates dérivées FREMM, prolongeant une relation de défense déjà ancrée par notre précédente commande de Rafale."
 france_md.330.a: "Accepter le contrat"
 france_md.330.b: "Refuser l'offre"
 france_md.331.t: "Courtiser le Caire"
 france_md.331.d: "[EGY.GetNameWithFlag] vole déjà nos Rafale, opère les deux porteurs de classe Mistral construits pour la Russie et redirigés vers Le Caire, et a mis en service la frégate FREMM Tahya Misr issue du carnet de commandes de notre propre marine. Que proposer pour approfondir le partenariat ?"
 france_md.331.a: "Lot d'armes légères ($4 milliards)"
 france_md.331.b: "Lot d'armes lourdes ($12 milliards)"
 france_md.331.c: "Lot Rafale premium ($25 milliards)"
 france_md.331.e: "Nous ne poursuivrons pas ce contrat"
 france_md.332.t: "Le Caire pèse une offre française"
 france_md.332.d: "[FRA.GetNameWithFlag] propose d'élargir un partenariat qui couvre déjà nos escadrons Rafale, les porteurs de classe Mistral et la frégate FREMM Tahya Misr."
 france_md.332.a: "Accepter le contrat"
 france_md.332.b: "Refuser l'offre"
 france_md.333.t: "Courtiser New Delhi"
 france_md.333.d: "[IND.GetNameWithFlag] représente l'un des plus grands marchés de défense au monde. New Delhi vole déjà trente-six Rafale et construit des sous-marins de classe Scorpène sous licence à Mazagon Dock. Que proposer pour élargir le partenariat ?"
 france_md.333.a: "Lot d'armes légères ($6 milliards)"
 france_md.333.b: "Lot d'armes lourdes ($20 milliards)"
 france_md.333.c: "Lot Rafale premium ($40 milliards)"
 france_md.333.e: "Nous ne poursuivrons pas ce contrat"
 france_md.334.t: "New Delhi pèse une offre française"
 france_md.334.d: "[FRA.GetNameWithFlag] propose de s'appuyer sur les Rafale déjà en service dans l'Indian Air Force et les sous-marins de classe Scorpène construits sous licence à Mazagon Dock."
 france_md.334.a: "Accepter le contrat"
 france_md.334.b: "Refuser l'offre"
 FRA_joint_weapon_projects_category: "Projets d'armement conjoints"
 FRA_joint_weapon_projects_category_desc: "La France a une longue histoire de programmes de défense conjoints, du Jaguar d'attaque avec la Grande-Bretagne à l'hélicoptère Tigre avec l'Allemagne. De nouveaux projets conjoints nous permettent de partager les coûts de développement et de mettre en service un matériel qu'aucun partenaire n'aurait pu s'offrir seul."
 FRA_joint_project_germany: "Proposer un projet conjoint SCAF/MGCS"
 FRA_joint_project_germany_desc: "Le SCAF (Système de combat aérien du futur) associe Dassault à Airbus pour concevoir un chasseur de sixième génération successeur du Rafale et de l'Eurofighter. Le MGCS (Main Ground Combat System) confie à KNDS un nouveau char de combat pour remplacer le Leclerc et le Leopard 2. Ensemble, ce seraient les plus grands programmes de défense que l'une ou l'autre nation ait menés depuis la guerre froide."
 FRA_socialist_government_required_tt: "Requiert un gouvernement §Ysocialiste§! ou §Yde gauche§! au pouvoir"
 FRA_joint_project_russia: "Proposer le projet franco-russe ATOM"
 FRA_joint_project_russia_desc: "Nous proposons le véhicule de combat d'infanterie ATOM comme programme conjoint avec Moscou, associant les équipes de conception de Nexter aux ingénieurs russes de véhicules blindés. Rompre aussi profondément avec nos alliés occidentaux exige d'abord de quitter l'UE."
 FRA_nationalist_government_required_tt: "Requiert un gouvernement §Ynationaliste§! ou du §YRassemblement national§! au pouvoir"
 FRA_joint_project_opinion: "Partenaire d'armement conjoint"
 france_md.335.t: "Proposition de projet franco-allemand SCAF/MGCS"
 france_md.335.d: "[FRA.GetNameWithFlag] propose de lancer le SCAF (Système de combat aérien du futur) et le MGCS (Main Ground Combat System) comme programmes conjoints : un chasseur de sixième génération successeur du Rafale et de l'Eurofighter, et un char de combat pour remplacer le Leclerc et le Leopard 2. Dassault, Airbus et KNDS se partageraient le travail d'ingénierie entre Paris et Berlin."
 france_md.335.a: "Bâtissons ensemble l'avenir de la défense européenne"
 france_md.335.b: "Nous préférons développer nos systèmes de façon indépendante"
 france_md.336.t: "L'Allemagne accepte le projet SCAF/MGCS"
 france_md.336.d: "[GER.GetNameWithFlag] a accepté notre proposition pour le SCAF et le MGCS. Les ingénieurs de Dassault et d'Airbus travailleront aux côtés de leurs homologues allemands sur le programme de chasseur, tandis que KNDS mènera le char."
 france_md.336.a: "Parfait ! Vive la coopération franco-allemande !"
 france_md.337.t: "Proposition de projet franco-russe ATOM"
 france_md.337.d: "[FRA.GetNameWithFlag] propose le véhicule de combat d'infanterie ATOM comme programme franco-russe conjoint, associant les ingénieurs de Nexter aux concepteurs russes de véhicules blindés. S'étant déjà éloignée de ses alliés occidentaux traditionnels, Paris se tourne désormais vers l'est pour des partenaires de défense."
 france_md.337.a: "Une nouvelle ère de coopération franco-russe commence"
 france_md.337.b: "Cette proposition est trop controversée"
 france_md.338.t: "La Russie accepte le projet ATOM"
 france_md.338.d: "[RUS.GetNameWithFlag] a accepté notre proposition pour le programme ATOM. Les ingénieurs de Nexter travailleront aux côtés de leurs homologues russes sur un nouveau véhicule de combat d'infanterie, notre premier grand partenariat de défense avec Moscou depuis la guerre froide."
 france_md.338.a: "Un nouveau chapitre des relations franco-russes !"
 FRA_FCAS_MGCS_project: "Programme de développement SCAF/MGCS"
 FRA_FCAS_MGCS_project_desc: "La France et l'Allemagne développent conjointement le SCAF (Système de combat aérien du futur), un chasseur de sixième génération mené par Dassault et Airbus, et le MGCS (Main Ground Combat System), un nouveau char de combat mené par KNDS. Ensemble, ce sont les plus grands programmes de défense que l'un ou l'autre pays ait menés depuis la guerre froide."
 GER_FCAS_MGCS_project: "Programme de développement SCAF/MGCS"
 GER_FCAS_MGCS_project_desc: "L'Allemagne et la France développent conjointement le SCAF (Système de combat aérien du futur), un chasseur de sixième génération mené par Airbus et Dassault, et le MGCS (Main Ground Combat System), un nouveau char de combat mené par KNDS. Ensemble, ce sont les plus grands programmes de défense que l'un ou l'autre pays ait menés depuis la guerre froide."
 FRA_RUS_joint_project: "Programme ATOM franco-russe"
 FRA_RUS_joint_project_desc: "La France et la Russie ont lancé un programme de développement militaire conjoint, le projet de véhicule de combat d'infanterie ATOM. Les ingénieurs de Nexter s'associent aux concepteurs russes de véhicules blindés pour produire une nouvelle plateforme de VCI."
 RUS_FRA_joint_project: "Programme ATOM franco-russe"
 RUS_FRA_joint_project_desc: "La Russie et la France ont lancé un programme de développement militaire conjoint, le projet de véhicule de combat d'infanterie ATOM. Les concepteurs russes de véhicules blindés s'associent aux ingénieurs de Nexter pour produire une nouvelle plateforme de VCI."
 FRA_constitutional_crisis_pcf: "La tentation révolutionnaire"
 FRA_constitutional_crisis_pcf_desc: "Au sein de notre coalition de gauche, une faction radicale gagne en influence. Ces durs révolutionnaires croient que le socialisme démocratique va trop lentement et exigent une transformation immédiate et totale. La direction modérée de La France insoumise et du PCF peine à contenir des extrémistes qui voient la grève générale comme le premier pas vers la révolution."
 FRA_abolish_fifth_republic_pcf: "Les extrémistes s'emparent du contrôle"
 FRA_abolish_fifth_republic_pcf_desc: "La faction radicale au sein de la gauche a débordé la direction modérée. Mélenchon et les réformistes du PCF ont été écartés par des durs révolutionnaires qui rejettent entièrement la « démocratie bourgeoise » de la Ve République. Ils exigent une assemblée constituante pour rédiger une nouvelle constitution, appuyés par assez de puissance de rue pour imposer leur volonté."
 FRA_sixth_republic: "Proclamer la VIe République"
 FRA_sixth_republic_desc: "La faction modérée a repris une part d'influence, orientant la révolution vers une VIe République socialiste démocratique plutôt que vers le communisme pur. Ce compromis préserve les institutions républicaines tout en transformant fondamentalement la société française par la voie parlementaire."
 FRA_french_commune_peaceful: "Établir la Commune de France"
 FRA_french_commune_peaceful_desc: "Les durs révolutionnaires ont triomphé complètement. Dans l'esprit de la Commune de Paris de 1871, la France deviendra un véritable État ouvrier. Les moyens de production seront collectivisés, des conseils ouvriers gouverneront à tous les niveaux, et les réformistes modérés ont perdu tout contrôle."
 FRA_republic_safe_pcf: "Notre bien le plus précieux"
 FRA_republic_safe_pcf_desc: "Nous avons arrêté les chefs de la faction radicale et démantelé leurs cellules paramilitaires. La République survit. Mélenchon et les réformistes modérés conservent le contrôle de la gauche. Le rêve révolutionnaire est fini, remplacé par la voie plus lente et plus stable de la réforme démocratique."
 FRA_question_republic_fn: "La République en question"
 FRA_question_republic_fn_desc: "Au sein du Rassemblement national, une faction traditionaliste gagne en influence. Tandis que [FRA.GetLeader] et la direction majoritaire restent attachés à la République, ces extrémistes, inspirés par l'Action française et le mouvement traditionaliste catholique, se demandent ouvertement si la démocratie elle-même a échoué à la France. Il faut agir avant qu'il ne soit trop tard."
 FRA_referendum_republic: "Les durs imposent un référendum"
 FRA_referendum_republic_desc: "La faction traditionaliste a débordé les républicains modérés de Le Pen. Militants de l'Action française, intégristes catholiques et monarchistes nostalgiques se sont emparés de l'appareil du parti. Ils exigent un référendum sur l'existence même de la République, et la direction majoritaire ne peut plus les arrêter."
 FRA_restore_kingdom_fn: "Restaurer le Royaume"
 FRA_restore_kingdom_fn_desc: "La faction monarchiste au sein du mouvement a gagné. Que nous couronnions le prétendant orléaniste Jean d'Orléans « roi des Français » ou le prétendant légitimiste Louis de Bourbon « roi de France », les républicains modérés de la coalition gouvernementale ont été complètement écartés par les extrémistes traditionalistes."
 FRA_restore_empire_fn: "Restaurer l'Empire"
 FRA_restore_empire_fn_desc: "La faction bonapartiste a triomphé. Jean-Christophe Napoléon Bonaparte sera couronné Napoléon VII. Les républicains modérés qui dirigeaient jadis le gouvernement ont été balayés par ceux qui rêvent de gloire impériale : une France forte unie sous un Empereur, non des parlementaires querelleurs."
 FRA_republic_safe_fn: "Sauver la République"
 FRA_republic_safe_fn_desc: "Nous avons arrêté les chefs de la faction traditionaliste et démantelé leurs cellules paramilitaires. La République survit ! Notre gouvernement et les nationalistes modérés conservent le contrôle. Prenant la crise pour justification, nous faisons passer des réformes pour renforcer le pouvoir de l'État : services de sécurité élargis, contrôles plus stricts sur les organisations extrémistes, et autorité exécutive renforcée. La Ve République endure, plus forte que jamais."
 france_md.370.t: "Garder les mains propres"
 france_md.370.d: "Notre accession au pouvoir semble déjà avoir attiré l'attention de mouvements politiques. Ce matin, des cellules communistes révolutionnaires nous ont contactés. Elles ont proposé de nous aider à consolider notre emprise, notamment en recueillant des informations sur nos adversaires politiques et en traquant des groupuscules d'extrême droite pour les empêcher de nous nuire. Nous ne devrions pas nous lier à de tels groupes, car nous sommes désormais engagés dans la réforme et la République. Mais cet outil n'en serait pas moins utile."
 france_md.370.a: "Les laisser s'organiser : nous avons besoin de leur soutien"
 france_md.370.b: "Les rejeter : nous sommes des démocrates, pas des révolutionnaires"
 france_md.371.t: "Des voix dans l'ombre"
 france_md.371.d: "Notre succès aux élections et notre efficacité à mettre en œuvre un programme nationaliste n'ont pas passé inaperçus. Nous avons reçu des propositions de divers groupuscules traditionalistes : sympathisants de l'Action française, intégristes catholiques, et ceux qui rêvent de restaurer la monarchie. Impressionnés par nos résultats, ils nous offrent leurs réseaux paramilitaires et leurs relais politiques en échange du droit de s'organiser au grand jour. Leurs véritables intentions restent voilées."
 france_md.371.a: "Les laisser s'organiser : leur soutien nous fortifie"
 france_md.371.b: "Les rejeter : nous restons avec la République"
 france_md.372.t: "La République tient"
 france_md.372.d: "La faction radicale a été brisée. Ses chefs sont arrêtés, ses cellules démantelées, ses rêves de révolution écrasés. Les réformistes modérés restent aux commandes, et la France demeure une république, transformée peut-être mais encore reconnaissablement démocratique. Les extrémistes ont joué et perdu."
 france_md.372.a: "Le réformisme gagne toujours"
 france_md.373.t: "Vive la République !"
 france_md.373.d: "Le putsch traditionaliste a été déjoué ! La DGSI a agi vite : les chefs de l'Action française sont en garde à vue, les cellules monarchistes ont été perquisitionnées, et les rêves de restauration gisent en ruines. Le peuple célèbre dans les rues tandis que Le Pen s'adresse à la nation : la Cinquième République tient bon. Prenant cette crise pour justification, nous faisons voter des réformes d'ampleur pour renforcer l'autorité de l'État et garantir que de telles menaces ne se reproduisent plus."
 france_md.373.a: "La République est sauvée, plus forte que jamais !"
 france_md.374.t: "Les factions se disputent le pouvoir"
 france_md.374.d: "Le putsch a réussi. La République est tombée. Mais les factions traditionalistes se retournent maintenant les unes contre les autres. Les monarchistes exigent la restauration de la lignée Bourbon ou Orléans. Les bonapartistes rêvent de gloire impériale sous Napoléon VII. Une seule faction peut l'emporter. Quelle vision prévaudra ?"
 france_md.374.a: "Les monarchistes l'emportent : restaurer le Royaume !"
 france_md.374.b: "Les bonapartistes triomphent : restaurer l'Empire !"
 france_md.340.t: "Le soulèvement qui se prépare"
 france_md.340.d: "La faction radicale est devenue trop audacieuse. Ses cellules paramilitaires ont été mises au jour, son infiltration de l'appareil du parti révélée. On murmure même qu'elle a infiltré le haut commandement de notre armée et prépare un coup d'État. Il faut choisir : les réprimer maintenant et préserver la République, ou les laisser poursuivre leur œuvre et voir où cela mène. La DGSI attend nos ordres."
 france_md.340.a: "Réprimer : arrêter les chefs radicaux"
 france_md.340.b: "Les laisser faire : la révolution doit continuer"
 france_md.341.t: "Les radicaux s'emparent du pouvoir"
 france_md.341.d: "Cela s'est joué en une seule nuit. La faction radicale a frappé avec précision : ses cellules paramilitaires ont saisi les bâtiments clés, ses infiltrés dans l'armée ont sécurisé les bases cruciales. [FRA.GetLeader] et les réformistes modérés se réveillent prisonniers en tout sauf le nom. Les durs de la révolution ont exécuté leur putsch. La Cinquième République est morte."
 france_md.341.a: "La révolution a commencé"
 france_md.345.t: "La Commune se lève à nouveau"
 france_md.345.d: "Les durs de la révolution ont gagné complètement. Rejetant tout compromis avec la « démocratie bourgeoise », ils ont proclamé la Commune de France, un véritable État ouvrier dans la tradition de 1871. Les réformistes modérés qui avaient bâti la coalition d'origine ont été purgés ou ont fui. Le drapeau rouge flotte sur le palais de l'Élysée, et la révolution ne fait que commencer."
 france_md.345.a: "Vive la Commune ! L'Internationale sera le genre humain !"
 france_md.375.t: "Combattre ou céder"
 france_md.375.d: "La faction traditionaliste est devenue trop sûre d'elle. Ses réseaux paramilitaires ont été mis au jour, son infiltration de l'appareil du parti révélée. On murmure même qu'elle a infiltré le haut commandement de notre armée et prépare un coup d'État. Il faut choisir : les réprimer maintenant et préserver la République, ou les laisser poursuivre leur œuvre et voir où cela mène. La DGSI attend nos ordres."
 france_md.375.a: "Réprimer : arrêter les chefs traditionalistes"
 france_md.375.b: "Les laisser faire : la restauration doit continuer"
 france_md.376.t: "Les traditionalistes s'emparent du pouvoir"
 france_md.376.d: "Cela s'est joué en une seule nuit. La faction traditionaliste a frappé avec précision : ses cellules paramilitaires ont sécurisé les bâtiments clés, ses alliés dans l'armée ont garanti la non-ingérence. [FRA.GetLeader] et les républicains modérés se réveillent complètement mis à l'écart. Les extrémistes ont exécuté leur putsch. La Cinquième République est morte. Mais qui gouvernera la France nouvelle ?"
 france_md.376.a: "Les factions doivent maintenant décider"
 france_md.354.t: "Les monarchistes choisissent leur roi"
 france_md.354.d: "La faction monarchiste du mouvement doit maintenant choisir son souverain. Deux prétendants se présentent : Jean d'Orléans, comte de Paris, représente la lignée orléaniste et serait un monarque constitutionnel, « roi des Français ». Louis de Bourbon, duc d'Anjou, représente la lignée légitimiste de Louis XIV et serait « roi de France » de droit divin. Les traditionalistes de l'Action française doivent trancher."
 france_md.354.a: "Couronner Jean d'Orléans, roi des Français"
 france_md.354.b: "Couronner Louis de Bourbon, roi de France"
 france_md.357.t: "Les bonapartistes triomphent"
 france_md.357.d: "La faction bonapartiste du mouvement a gagné la lutte interne. Jean-Christophe Napoléon Bonaparte sera couronné Napoléon VII. L'armée et ceux qui rêvent de gloire impériale ont prévalu sur les monarchistes. Marine Le Pen et la vieille garde républicaine du Rassemblement national ont été complètement balayées. La France sera à nouveau un Empire."
 france_md.357.a: "Vive l'Empereur ! Vive la France !"
 france_md.358.t: "Les bonapartistes s'emparent du pouvoir en France"
 france_md.358.d: "Nouvelle stupéfiante depuis [FRA.GetNameWithFlag] : des factions extrémistes au sein du parti au pouvoir ont pris le contrôle et aboli la Cinquième République. La direction modérée a été mise à l'écart tandis que les radicaux restaurent le régime impérial. Ce putsch spectaculaire contre la démocratie a choqué le monde. Comment devons-nous réagir ?"
 france_md.358.a: "Condamner cette prise de pouvoir extrémiste"
 france_md.358.b: "C'est une affaire intérieure française"
 FRA_extremist_paramilitary_left: "Paramilitaire révolutionnaire"
 FRA_extremist_paramilitary_left_desc: "Nous avons laissé la faction radicale organiser ouvertement ses réseaux paramilitaires. Ces cellules révolutionnaires nous donnent le contrôle de la rue et de la contestation potentielle. Mais à quel prix ? Leur loyauté véritable reste à la révolution, non à la direction du parti."
 FRA_extremist_paramilitary_right: "Paramilitaire traditionaliste"
 FRA_extremist_paramilitary_right_desc: "Nous avons laissé la faction traditionaliste organiser ouvertement ses réseaux paramilitaires. Ces cellules de l'Action française nous donnent le contrôle de la rue et de la contestation potentielle. Mais à quel prix ? Leur loyauté véritable reste à la restauration, non à la direction du parti."
 FRA_radical_infiltration: "Infiltration radicale"
 FRA_radical_infiltration_desc: "La faction radicale infiltre en silence l'appareil du parti et l'armée. Ses cellules révolutionnaires se répandent dans les institutions, bâtissant le réseau dont elles auront besoin le moment venu. La direction modérée ignore encore à quel point l'infiltration est profonde."
 FRA_traditionalist_infiltration: "Infiltration traditionaliste"
 FRA_traditionalist_infiltration_desc: "La faction traditionaliste infiltre en silence l'appareil du parti et l'armée. Ses cellules monarchistes se répandent dans les institutions, bâtissant le réseau dont elles auront besoin le moment venu. La direction modérée ignore encore à quel point l'infiltration est profonde."
 FRA_republic_stabilized_left: "République stabilisée"
 FRA_republic_stabilized_left_desc: "La menace radicale a été neutralisée. La DGSI a arrêté les chefs extrémistes et démantelé leurs cellules paramilitaires. La France demeure une république, et les réformistes modérés gardent le contrôle de la gauche. La révolution n'aura pas lieu, mais nous veillerons à donner au peuple d'autres moyens de s'exprimer."
 FRA_republic_stabilized_right: "République forte"
 FRA_republic_stabilized_right_desc: "La menace traditionaliste a été écrasée, et nous avons utilisé la crise pour faire voter des réformes d'ampleur renforçant le pouvoir de l'État. La DGSI dispose désormais d'une autorité de surveillance élargie, la police a de nouveaux pouvoirs contre les organisations extrémistes, et l'autorité exécutive a été consolidée. La Cinquième République demeure : plus forte, plus centralisée, et fermement sous contrôle nationaliste."
 FRA_general_strike: "Grève générale révolutionnaire"
 FRA_general_strike_desc: "Une faction radicale au sein de la coalition de gauche a mobilisé les travailleurs pour une grève générale, au-delà de ce que la direction modérée avait prévu. La CGT a été capturée par des durs révolutionnaires qui voient là le premier pas vers la fin de la République. La direction du parti a perdu le contrôle du mouvement qu'elle avait lancé."
 FRA_sixth_republic_idea: "La Sixième République"
 FRA_sixth_republic_idea_desc: "Plus personne ne voulait de la Cinquième République, aussi l'avons-nous close démocratiquement et établi une république nouvelle, plus proche du peuple."
 FRA_commune_reborn_idea: "La Commune de France"
 FRA_commune_reborn_idea_desc: "Les durs de la révolution ont triomphé complètement. Les réformistes modérés qui dirigeaient naguère la gauche ont été purgés tandis que la France se transforme en État ouvrier. Dans l'esprit de 1871, les conseils ouvriers gouvernent désormais et les moyens de production ont été collectivisés. Le drapeau rouge flotte là où flottait le tricolore."
 FRA_kingdom_restored_idea: "Le Royaume restauré"
 FRA_kingdom_restored_idea_desc: "Les extrémistes traditionalistes du mouvement nationaliste ont réalisé leur rêve : la France a de nouveau un roi. Les républicains modérés du Rassemblement national regardent, incrédules, l'Action française célébrer et la fleur de lys remplacer le tricolore."
 FRA_exploitation: "Saignés pour la métropole"
 FRA_exploitation_desc: "Nos usines, notre commerce et nos impôts vont d'abord à Paris, et à notre propre peuple ensuite. Chaque cargaison qui quitte les quais nous achète un peu plus de ressentiment au pays et un peu plus de distance avec l'Empire."
 FRA_empire_restored_idea: "L'Empire restauré"
 FRA_empire_restored_idea_desc: "La faction bonapartiste du mouvement a restauré l'Empire français sous Napoléon VII. Les républicains modérés qui avaient bâti le Rassemblement national ont été balayés par ceux qui rêvent de gloire impériale. La France est de nouveau gouvernée par un empereur, et l'alliance militaro-traditionaliste célèbre sa victoire complète."
 FRA_investing_eu: "Investir dans un pays de l'UE"
 FRA_investing_eu_desc: "Nous aidons actuellement un autre pays de l'UE à se reconstruire"
 FRA_election_result: "Les résultats"
 FRA_election_result_desc: "L'élection présidentielle est terminée ou sur le point de l'être ; les intentions de vote ne devraient plus bouger de sitôt."
 FRA_spy_napoleon_lar: "Service secret bonapartiste"
 FRA_spy_napoleon_lar_desc: "Une nouvelle génération d'agents secrets formés à semer la discorde chez nos ennemis, alimentant en renseignement en temps réel nos états-majors de terre, de mer et de l'air à mesure que la reconquête s'accélère."
 FRA_spy_napoleon_non_lar: "Service secret bonapartiste"
 FRA_spy_napoleon_non_lar_desc: "Une nouvelle génération d'agents secrets formés à semer la discorde chez nos ennemis, surveillant nos propres casernes et ministères contre le prochain complot contre le trône."
 FRA_5th_republic: "La Cinquième République"
 FRA_5th_republic_desc: "Le système politique français actuel, en place depuis 1958. Une république établie sous le général de Gaulle et taillée à sa mesure. Un système stable, mais qui commence à montrer ses limites dans un pays de plus en plus déséquilibré, avec un président tout-puissant."
 FRA_war_against_republic: "Guerre au républicanisme"
 FRA_war_against_republic_desc: "La monarchie française fut à son apogée sous l'absolutisme. Depuis, notre pays a enduré des décennies de républiques, chacune plus instable que la précédente. Les valeurs républicaines et démocratiques sont dangereuses pour notre pays et se répandent comme un cancer dans le monde. Il faut y mettre un terme."
 FRA_EU_strong: "La force avec l'UE"
 FRA_EU_strong_desc: "Être un pilier de l'Union européenne est une grande responsabilité, mais aussi une grande force. Notre destin est lié à celui de l'Union européenne, que cela nous plaise ou non."
 FRA_NOTRe_law: "Loi NOTRe"
 FRA_NOTRe_law_desc: "La décentralisation n'a pas été correctement mise en œuvre en France, laissant de nombreuses lacunes juridiques et incohérences. La loi portant nouvelle organisation territoriale de la République permettra de corriger ces manques et de simplifier l'organisation et l'aménagement de nos territoires."
 FRA_military_indus_boost: "Investir dans notre industrie de défense"
 FRA_military_indus_boost_desc: "Face aux tensions internationales croissantes, nous ne devons rien épargner pour nous préparer à un conflit possible."
 FRA_civilian_jobs_boost: "Priorité à la création d'emplois"
 FRA_civilian_jobs_boost_desc: "Il nous faut investir davantage dans le marché du travail pour offrir à nos citoyens un éventail diversifié d'emplois."
 FRA_internal_investment_boost: "Priorité aux investissements intérieurs"
 FRA_internal_investment_boost_desc: "En versant des subventions au secteur privé, nous l'encouragerons à créer davantage d'emplois."
 FRA_direct_construction_boost: "Investir dans les travaux publics"
 FRA_direct_construction_boost_desc: "Le marché ne fonctionne pas bien : il faut mobiliser notre main-d'œuvre pour bâtir l'économie de demain."
 FRA_indusfarm_boost: "Subventionner l’agriculture"
 FRA_indusfarm_boost_desc: "Nous devons aider notre secteur agricole à reconquérir les marchés européens en augmentant notre production, quels qu'en soient les moyens."
 FRA_civilian_infra_boost: "Investir dans les infrastructures"
 FRA_civilian_infra_boost_desc: "Il faut investir dans les territoires hors métropole afin que leurs habitants accèdent aux mêmes services qu'en métropole."
 FRA_indusbuild_services_boost: "Investir dans le secteur des services"
 FRA_indusbuild_services_boost_desc: "Nous bâtissons l'économie de demain, affranchie des industries non compétitives et polluantes."
 FRA_techno_boost: "Investissements dans l'éducation"
 FRA_techno_boost_desc: "Ce qu'il nous faut, c'est permettre à chacun de poursuivre les études les plus avancées."
 FRA_res_health_boost: "Priorité aux services publics"
 FRA_res_health_boost_desc: "Nous devons reconstruire l'offre de services trop longtemps visée par les politiques ultralibérales."
 FRA_local_consumption_boost: "Soutenir la relocalisation de notre alimentation"
 FRA_local_consumption_boost_desc: "Nos tables se remplissent depuis l'autre bout du monde tandis que les fermes françaises sombrent. Raccourcir la chaîne du champ à l'assiette conserve cette valeur dans le pays."
 FRA_job_planned_boost: "Investir dans notre industrie"
 FRA_job_planned_boost_desc: "Nous devons aider nos entreprises à créer plus d'emplois et les empêcher de licencier. Cela nous permettra d'en finir avec le chômage tout en renforçant la sécurité de l'emploi."
 FRA_ps_EUtrain: "Mission de formation française"
 FRA_ps_EUtrain_desc: "Le gouvernement français nous a invités à participer à des exercices militaires conjoints aux côtés d'autres pays de l'Union européenne."
 FRA_PCF_EUtrain: "Préparer l’escalade vers l’Est"
 FRA_PCF_EUtrain_desc: "Face à une agression possible de la Russie, nous devons nous préparer à l'affronter sur le champ de bataille."
 FRA_EU_LEAVE: "Reconstruire notre économie"
 FRA_EU_LEAVE_desc: "Notre économie était trop étroitement intégrée à l'Union européenne ; s'en détacher a eu des conséquences profondes. Nous la reconstruirons plus forte et plus indépendante encore."
 FRA_patriotic_fervor: "Ferveur patriotique"
 FRA_patriotic_fervor_desc: "La reconquête de notre Empire ne fait que commencer."
 FRA_learning_from_worforce: "Société intégratrice"
 FRA_learning_from_worforce_desc: "Nous sommes en train d'intégrer les savoirs et la main-d'œuvre d'une nation sœur."
 FRA_attack_UK_king: "La Royale"
 FRA_attack_UK_king_desc: "Notre attention peut se porter sur le Royaume-Uni, ancien ennemi de la France. Mais de toute façon, il nous faudra affronter une puissance maritime un jour ou l'autre. La Marine nationale doit donc être prête à combattre en mer."
 FRA_french_papacy: "La papauté sous contrôle"
 FRA_french_papacy_desc: "Nous avons décidé d'accueillir le siège de l'Église catholique en France. Nous sommes donc en mesure de le protéger et d'en tirer une plus grande légitimité aux yeux des autres pays chrétiens."
 FRA_gaullist_foreign_policy: "Politique étrangère gaulliste"
 FRA_gaullist_foreign_policy_desc: "Selon la vision du général de Gaulle, la France mène une politique d'indépendance stratégique vis-à-vis des deux superpuissances. Nous tenons Washington à distance tout en dialoguant de façon pragmatique avec la Russie et la Chine. La France doit être une grande puissance à part entière, non un vassal de Washington."
 FRA_anti_american_stance: "Position anti-américaine"
 FRA_anti_american_stance_desc: "Le gouvernement français a adopté une attitude ouvertement hostile envers les États-Unis. Les opérations militaires américaines ne recevront pas le soutien français, et les relations diplomatiques se sont nettement refroidies. La France trace sa propre voie, affranchie des contraintes atlantiques."
 FRA_fn_russia_alignment_idea: "Alignement Rassemblement national-Russie"
 FRA_fn_russia_alignment_idea_desc: "Le gouvernement du Rassemblement national a cultivé des liens étroits avec la Russie, reflet de connexions historiques et d'une opposition commune au libéralisme américain. Les éloges de Marine Le Pen pour les « valeurs traditionnelles » de Poutine se sont traduits par un alignement concret sur plusieurs dossiers."
 FRA_fn_protectionism: "Patriotisme économique"
 FRA_fn_protectionism_desc: "Les droits de douane et les marchés publics favorisent désormais le producteur français face à l'import moins cher, et nos usines tournent plus à plein qu'elles ne l'ont fait depuis des années. Nos partenaires commerciaux l'ont remarqué, et ils ne nous en savent aucun gré."
 FRA_fn_nationalist_policy: "Préférence nationale"
 FRA_fn_nationalist_policy_desc: "L'une de nos mesures clés est la préférence nationale : reléguer au second plan tout ce qui n'est pas français."
 FRA_communist_foreign_policy: "Politique étrangère communiste"
 FRA_communist_foreign_policy_desc: "Le Parti communiste a opéré une réorientation radicale de la politique étrangère française : l'alliance avec les États-Unis est impossible, et la France cherche plutôt la solidarité avec les États socialistes du monde entier. L'appartenance à l'OTAN est fondamentalement incompatible avec notre idéologie."
 FRA_lfi_non_aligned_policy: "France non alignée"
 FRA_lfi_non_aligned_policy_desc: "La France insoumise a mis en œuvre une politique de non-alignement, rejetant à la fois l'hégémonie américaine et l'autoritarisme russe. La France ne participera pas aux aventures militaires américaines et conserve son indépendance vis-à-vis des structures de commandement de l'OTAN, tout en cherchant à diriger un nouveau mouvement des non-alignés."
 FRA_lfi_anti_nato: "Politiques anti-OTAN"
 FRA_lfi_anti_nato_desc: "Nous nous sommes retirés avec succès de l'OTAN ; nous ne pouvions plus tolérer les agissements de l'impérialisme américain. Notre position actuelle nous donne un plus grand contrôle sur notre politique étrangère."
 FRA_worker_internationalism: "Phare de l'internationalisme"
 FRA_worker_internationalism_desc: "Le communisme a réussi en France, et c'est un fait. Ce succès nous vaut une main-d'œuvre satisfaite et nous permet d'attirer des travailleurs du monde entier."
 FRA_lfi_social_europe: "Réforme des services publics européens"
 FRA_lfi_social_europe_desc: "La France de LFI a réussi à imposer un nouvel agenda social à l'Union européenne. C'est une victoire majeure contre cette institution profondément néolibérale."
 FRA_strategic_independance: "Indépendance stratégique"
 FRA_strategic_independance_desc: "La France s'est engagée dans une autonomie stratégique complète, maintenant sa dissuasion nucléaire indépendante et refusant toute subordination à une puissance étrangère. Les bases américaines ne sont pas les bienvenues sur le sol français, et la France décidera seule de ses interventions militaires."
 FRA_global_south_solidarity: "Solidarité mondiale du Sud"
 FRA_global_south_solidarity_desc: "Le colonialisme a indéniablement marqué le développement des pays du Sud. Nous ferons ce qu'il faut en les aidant à s'en remettre."
 FRA_sovereigntist_eu_policy: "Politique européenne souverainiste"
 FRA_sovereigntist_eu_policy_desc: "La France bloque toute fédéralisation supplémentaire de l'UE, défendant la souveraineté nationale contre la technocratie bruxelloise. Tout en restant dans l'UE, nous vetons tout transfert de souveraineté et nous opposons à la création d'un super-État européen. La France ne deviendra pas une province."
 FRA_distance_nato: "Distance vis-à-vis de l'OTAN"
 FRA_distance_nato_desc: "Suivant le précédent de De Gaulle en 1966, la France se tient à distance de la structure de commandement intégré de l'OTAN tout en restant partie au traité. Aucune troupe américaine n'est stationnée sur le sol français, et la France se réserve le droit d'agir militairement de façon indépendante."
 FRA_left_nato: "Quitter l'OTAN"
 FRA_left_nato_desc: "La France s'est entièrement retirée de l'Organisation du traité de l'Atlantique nord. N'étant plus liée par l'article 5, elle trace une voie véritablement indépendante en matière militaire, rejetant d'emblée l'hégémonie américaine."
 FRA_political_balance: "Tendances de l'opinion publique"
 FRA_political_balance_desc: "Bien que nos institutions aient été conçues pour assurer la stabilité, l'équilibre politique n'a jamais été si précaire. Les partis montent et s'effondrent. Qui que vous soyez, il vous faudra consolider notre emprise sur l'opinion."
 FRA_econ_policy: "État de l'économie française"
 FRA_econ_policy_desc: "L'économie française est un bon exemple d'économie occidentale à l'aube du nouveau millénaire, passant d'une puissance industrielle à une économie en cours de restructuration. Nous verrons comment vos réformes infléchiront sa trajectoire."
 FRA_social_balance: "Politiques sociales françaises"
 FRA_social_balance_desc: "La France est un pays qui investit lourdement dans sa politique sociale à tous les niveaux. Pourtant, la plupart des partis ont des griefs contre cette politique. Chacun a sa vision de la façon dont elle doit changer. Nous verrons comment vos décisions l'affectent."
 FRA_6th_rep: "Réformes de la Sixième République"
 FRA_6th_rep_desc: "La France insoumise a réussi à réformer la Cinquième République. Mais au-delà des institutions, ces réformes auront des conséquences profondes pour la société et l'économie françaises."
 FRA_Commies_agenda: "Politiques de la Commune française"
 FRA_Commies_agenda_desc: "La Commune de France a décidé de rompre net avec le passé et est déterminée à reconstruire la société à partir de zéro."
 FRA_Bonapartist_agenda: "La société impériale"
 FRA_Bonapartist_agenda_desc: "Notre nouvel empereur a décidé de réformer la société française pour la rendre plus grande et plus forte face aux conflits qui s'annoncent."
 FRA_Royalist_agenda: "La nouvelle société franque"
 FRA_Royalist_agenda_desc: "Il faut en finir avec toutes les inventions diaboliques de l'accursée Révolution. Nous reconstruirons la société franque sur des fondations solides."
 FRA_World_revolution: "La révolution mondiale"
 FRA_World_revolution_desc: "À mesure que nous libérons les peuples du capitalisme, des peuples nous rejoignent, apportant leurs savoirs et leurs espoirs. Bientôt, l'Internationale sera le genre humain tout entier."
 FRA_arab_solidarity_tt: "Relations améliorées avec les nations arabes et à majorité musulmane"
 FRA_blocks_eu_federalization_tt: "La France bloque la fédéralisation de l'UE en raison de sa politique souverainiste"
 FRA_cannot_ally_usa_hard_tt: "Ne peut pas s'allier avec les États-Unis"
 FRA_cannot_host_american_bases_tt: "Ne peut pas accueillir de bases militaires américaines"
 FRA_cannot_join_american_coalitions_tt: "Ne peut pas rejoindre de coalitions militaires dirigées par les États-Unis"
 FRA_debt_forgiveness_tt: "Soutient l'annulation de la dette et la coopération au développement pour le Sud global"
 FRA_demands_eu_social_reform_tt: "Exige une réforme sociale des institutions de l'Union européenne"
 FRA_immigration_restrictions_tt: "L'immigration en France est fortement restreinte"
 FRA_improved_russia_relations_tt: "Relations améliorées avec la Russie"
 FRA_israel_relations_penalty_tt: "Relations détériorées avec Israël"
 FRA_left_nato_command_tt: "La France a quitté la structure de commandement intégré de l'OTAN"
 FRA_non_aligned_policy_tt: "La France mène une politique de non-alignement"
 FRA_opposes_nato_expansion_tt: "S'oppose à toute nouvelle expansion de l'OTAN"
 FRA_socialist_solidarity_tt: "Relations améliorées avec les États socialistes et communistes"
 FRA_trade_protectionism_tt: "L'industrie nationale est protégée de la concurrence étrangère"
 FRA_usa_relations_penalty_tt: "Relations détériorées avec les États-Unis"
 FRA_worker_solidarity_tt: "Attire des travailleurs du monde entier par la solidarité ouvrière internationale"
 france_md.800.t: "La France se retourne contre l'Amérique"
 france_md.800.d: "Le nouveau gouvernement français a adopté une posture ouvertement anti-américaine, rejetant la coopération avec Washington et critiquant durement la politique étrangère des États-Unis. C'est un basculement spectaculaire des relations transatlantiques. Comment les États-Unis doivent-ils répondre à ce tournant hostile à Paris ?"
 france_md.800.a: "Condamner cette politique hostile"
 france_md.800.b: "Tentative de sensibilisation diplomatique"
 france_md.801.t: "Ouverture diplomatique américaine"
 france_md.801.d: "Malgré notre posture anti-américaine, Washington a multiplié les ouvertures diplomatiques, cherchant à maintenir un minimum de coopération. Le Département d'État semble prêt à passer sur notre rhétorique en échange d'un engagement limité. Comment répondre à ces efforts américains ?"
 france_md.801.a: "Rejeter entièrement les ouvertures américaines"
 france_md.801.b: "Envisagez une coopération limitée"
 france_md.802.t: "La France se tourne vers la Russie"
 france_md.802.d: "Le nouveau gouvernement français a signalé un basculement spectaculaire de sa politique étrangère, cherchant des liens plus étroits avec Moscou tout en s'éloignant de Washington. C'est une occasion d'étendre l'influence russe en Europe occidentale. Comment devons-nous répondre à ce réalignement français ?"
 france_md.802.a: "Renforcer les liens avec la France"
 france_md.802.b: "Procédez avec prudence"
 france_md.803.t: "Conséquences de la politique étrangère communiste"
 france_md.803.d: "Notre politique étrangère communiste nous a isolés des alliés occidentaux traditionnels mais a ouvert des portes auprès des mouvements socialistes et anti-impérialistes du monde entier. Cuba, le Venezuela et d'autres gouvernements de gauche saluent notre nouvelle orientation. Cela a toutefois un coût pour nos relations avec les alliés de l'OTAN et nos partenaires habituels."
 france_md.803.a: "Embrasser la solidarité socialiste"
 france_md.803.b: "Modérer notre approche"
 france_md.804.t: "La France prend ses distances avec l'OTAN"
 france_md.804.d: "[FRA.GetNameWithFlag] a annoncé une politique de distance vis-à-vis de l'OTAN, dans le sillage du retrait de De Gaulle du commandement intégré en 1966. Le gouvernement français a mis l'accent sur l'« indépendance stratégique » et rejeté toute subordination au commandement militaire américain. Comment devons-nous juger ce développement ?"
 france_md.804.a: "Exprimer des inquiétudes sur la cohésion de l'alliance"
 france_md.804.b: "Rester neutre vis-à-vis de la politique française"
 france_md.805.t: "Reconnaissance de la Palestine"
 france_md.805.d: "Notre politique étrangère d'extrême gauche nous engage à reconnaître l'État de Palestine et à soutenir la solution à deux États. Cela améliorera les relations avec les États arabes et s'alignera sur nos principes anti-impérialistes, mais détériorera les relations avec Israël et potentiellement les États-Unis. Faut-il procéder à une reconnaissance formelle ?"
 france_md.805.a: "Reconnaître la Palestine immédiatement"
 france_md.805.b: "Reporter la reconnaissance pour l'instant"
 france_md.806.t: "La France reconnaît la Palestine"
 france_md.806.d: "Le gouvernement français a formellement reconnu l'État de Palestine, marquant un tournant notable de la politique étrangère parisienne. Cette décision aligne la France sur de nombreuses nations européennes mais rompt avec la prudence précédente. Comment Israël doit-il répondre à ce développement diplomatique ?"
 france_md.806.a: "Condamner fermement la reconnaissance française"
 france_md.806.b: "Émettre une réponse mesurée"
 france_md.807.t: "Le dilemme de la guerre en Ukraine"
 france_md.807.d: "L'invasion de l'Ukraine par la Russie met en crise notre politique étrangère prorusse. Notre alignement antérieur sur Moscou est désormais profondément problématique alors que les chars russes pénètrent dans une nation européenne souveraine. Le coût politique du maintien de la neutralité est énorme, mais condamner la Russie serait un revirement complet. Quelle position la France doit-elle prendre ?"
 france_md.807.a: "Condamner l'agression russe"
 france_md.807.b: "Maintenir la neutralité"
 france_md.807.c: "Soutenez la position de la Russie"
 france_md.808.t: "Politique souverainiste française"
 france_md.808.d: "[FRA.GetNameWithFlag] a adopté une posture fortement souverainiste au sein de l'Union européenne, bloquant toute intégration supplémentaire et vetant les transferts de souveraineté à Bruxelles. Le gouvernement français plaide pour une « Europe des nations » plutôt qu'un super-État fédéral. Comment répondre à cet obstructionnisme français ?"
 france_md.808.a: "S'opposer à l'obstructionnisme français"
 france_md.808.b: "Comprendre les préoccupations de souveraineté"
 france_md.809.t: "Initiative du mouvement des non-alignés"
 france_md.809.d: "Notre politique étrangère non alignée a attiré l'intérêt d'autres nations cherchant des alternatives aux sphères d'influence américaine et russe. Nous avons l'occasion de positionner la France comme chef de file d'un nouveau mouvement des non-alignés, aux côtés de l'Inde, du Brésil et d'autres puissances hors des blocs traditionnels."
 france_md.809.a: "Rechercher un leadership non aligné"
 france_md.809.b: "Priorité aux priorités intérieures"
 france_md.810.t: "Indépendance stratégique française"
 france_md.810.d: "[FRA.GetNameWithFlag] a annoncé une politique d'indépendance stratégique complète, refusant toute subordination à une puissance étrangère et soulignant le rôle de la dissuasion nucléaire française. Cela pourrait avoir des implications pour le partenariat franco-allemand, fondement de la coopération européenne. Comment l'Allemagne doit-elle répondre ?"
 france_md.810.a: "Exprimer des inquiétudes sur les relations bilatérales"
 france_md.810.b: "Respecter la souveraineté française"
 france_md.811.t: "La France adopte la multipolarité"
 france_md.811.d: "Le gouvernement français a annoncé son soutien à un ordre mondial multipolaire, rejetant l'hégémonie américaine et cherchant des liens plus étroits avec les puissances émergentes. C'est une occasion pour la Chine d'étendre son influence en Europe. Comment Pékin doit-il répondre à cette ouverture française ?"
 france_md.811.a: "Renforcer les liens avec la France"
 france_md.811.b: "Maintenir un engagement prudent"
 france_md.812.t: "La France quitte l'OTAN"
 france_md.812.d: "Nous nous sommes formellement retirés de l'Organisation du traité de l'Atlantique nord, achevant notre rupture avec l'hégémonie américaine. La France se tient désormais seule, ni liée par l'article 5 ni soumise au commandement militaire américain. Cette décision ouvre de nouvelles possibilités autant que de réels dangers. Quelle voie la France doit-elle suivre ?"
 france_md.812.a: "Adopter une indépendance stratégique totale"
 france_md.812.b: "Rechercher de nouvelles alliances"
 FRA_extremist_foreign_policy_category: "Politique étrangère extrémiste"
 FRA_extremist_foreign_policy_category_desc: "Actions diplomatiques et de politique étrangère disponibles pour la France sous une gouvernance extrémiste ou gaulliste."
 FRA_rejoin_nato_command: "Rejoignez le Commandement intégré de l’OTAN"
 FRA_rejoin_nato_command_desc: "Après nous être distancés de l'OTAN, nous pouvons choisir de rejoindre la structure de commandement militaire intégré. Cela rétablirait notre position au sein de l'alliance et améliorerait les relations avec les alliés américains et européens."
 FRA_seek_russian_partnership: "Rechercher un partenariat avec la Russie"
 FRA_seek_russian_partnership_desc: "Notre politique étrangère indépendante crée une occasion de renforcer les liens avec Moscou. Nous pouvons rechercher des relations diplomatiques et économiques plus étroites avec la Russie, au prix toutefois d'une tension accrue avec Washington."
 FRA_recognize_palestine: "Reconnaître la Palestine"
 FRA_recognize_palestine_desc: "Notre politique étrangère anti-impérialiste exige que nous reconnaissions l'État de Palestine et soutenions le droit du peuple palestinien à l'autodétermination. Cela améliorera les relations avec les États arabes mais détériorera les liens avec Israël."
 FRA_condemn_russia_ukraine: "Condamner l’agression russe"
 FRA_condemn_russia_ukraine_desc: "L'invasion de l'Ukraine par la Russie a rendu notre posture prorusse politiquement intenable. Nous pouvons choisir de condamner l'agression et de nous distancer de Moscou, même si cela constitue un revirement majeur."
 FRA_non_aligned_initiative: "Initiative de leadership non-aligné"
 FRA_non_aligned_initiative_desc: "Notre politique étrangère non alignée positionne la France pour diriger un nouveau mouvement de nations cherchant des alternatives à l'hégémonie américaine comme à l'influence russe. Nous pouvons renforcer les liens avec l'Inde, le Brésil et d'autres puissances hors des blocs traditionnels."
 FRA_socialist_solidarity: "Solidarité Socialiste"
 FRA_socialist_solidarity_desc: "Notre politique étrangère communiste appelle à la solidarité avec les États socialistes du monde entier. Nous pouvons renforcer les liens avec Cuba, le Venezuela et d'autres gouvernements de gauche, bâtissant un réseau international de coopération anticapitaliste."
 FRA_veto_eu_federalization: "Veto sur la fédéralisation de l’UE"
 FRA_veto_eu_federalization_desc: "En tant que nation souveraine au sein de l'UE, nous pouvons user de notre droit de veto pour bloquer toute fédéralisation supplémentaire et tout transfert de souveraineté à Bruxelles. Cela défend l'indépendance française mais tend les relations avec les États membres favorables à l'intégration."
 FRA_immigration_wave: "Tirer parti de la vague migratoire"
 FRA_immigration_wave_desc: "Les politiques d'immigration libérales actuelles de la France ont entraîné un afflux important de migrants. Certains y voient une nécessité humanitaire ou une opportunité économique, d'autres s'en inquiètent de plus en plus. Le Rassemblement national peut capitaliser sur ces sentiments, se présentant comme le défenseur de l'identité et de la sécurité françaises. Plus nos frontières sont ouvertes, plus le contrecoup que nous pouvons exploiter est fort."
 FRA_high_immigration_tooltip: "La France doit avoir la loi §YFrontières ouvertes§! ou §YImmigration légèrement réglementée§!"
 FRA_immigration_backlash: "Contrecoup de l’immigration"
 FRA_immigration_backlash_desc: "Une vague de sentiment anti-immigration balaie la société française. Le discours du Rassemblement national sur l'immigration, la sécurité et l'identité nationale trouve un écho chez une part croissante de la population, faisant basculer le paysage politique vers la droite et affaiblissant le soutien au statu quo."
 FRA_end_extraction: "Restreindre l’extraction des ressources"
 FRA_end_extraction_desc: "Pour servir notre vision environnementale, nous imposerons des réglementations strictes sur les mines, l'extraction pétrolière et les activités industrielles lourdes dans toute la France métropolitaine. Cela réduira la production intérieure de ressources d'environ un tiers, mais constitue une étape nécessaire pour la protection de l'environnement. Les gouvernements futurs pourront inverser cette politique si les circonstances changent."
 FRA_green_extraction_ban: "Restrictions environnementales en matière d'extraction"
 FRA_green_extraction_ban_desc: "La France a mis en œuvre des restrictions environnementales d'ensemble sur l'extraction des ressources. Les mines font face à des plafonds stricts, le forage pétrolier est lourdement réglementé, et l'extraction industrielle doit satisfaire des normes exigeantes. Si cela a réduit d'environ un tiers la disponibilité intérieure des ressources, la baisse de la pollution a produit des gains sanitaires mesurables : les taux de cancer dans d'anciennes régions industrielles ont nettement reculé, et les coûts de santé diminuent."
 FRA_environmental_policy_decisions: "Politique environnementale"
 FRA_environmental_policy_decisions_desc: "Décisions relatives aux politiques environnementales de la France et à la réglementation de l'extraction des ressources."
 FRA_reverse_extraction_ban: "Abroger les restrictions du code minier"
 FRA_reverse_extraction_ban_desc: "Le code minier réécrit a mis notre industrie extractive hors jeu et laissé les raffineries dépendantes des importations. L'abroger rétablit la production intérieure, et rompt avec les Verts et les associations environnementales qui l'ont rédigé."
 france_md.960.t: "La France réécrit son code minier"
 france_md.960.d: "[FRA.GetNameWithFlag] a réécrit son code minier, mettant fin aux permis d'hydrocarbures et plafonnant l'extraction dans toute la France métropolitaine. Environ un tiers de la production intérieure française disparaît avec lui. Les associations environnementales sont en liesse, et les fédérations industrielles sont déjà à Bruxelles pour alerter sur le précédent."
 france_md.960.a: "Un précédent à suivre"
 france_md.960.b: "L'industrie européenne paiera pour cela"
 france_md.900.t: "Le compte caché du ministre du Budget"
 france_md.900.d: "Notre ministre du Budget, qui mène depuis Bercy la campagne contre la fraude fiscale, a nié détenir un compte à l'étranger devant l'Assemblée nationale elle-même. Un site d'investigation a désormais publié la piste : Genève d'abord, puis Singapour. Le démenti est au procès-verbal, et c'était un mensonge."
 france_md.900.a: "Congédier le ministre et transmettre le dossier aux procureurs"
 france_md.900.b: "Acceptez une démission tranquille"
 france_md.900.c: "Soutenir le ministre"
 france_md.901.t: "Une Haute Autorité pour la transparence de la vie publique"
 france_md.901.d: "Le scandale a rendu les déclarations de patrimoine inévitables. Nous pouvons créer une autorité indépendante pour la transparence de la vie publique, obligeant chaque ministre, député et sénateur à déclarer ses intérêts et sa fortune, avec le pouvoir de saisir les procureurs des cas douteux. L'Assemblée en ressentira chaque ligne."
 france_md.901.a: "Créer l'autorité de la transparence"
 france_md.901.b: "Publier un code de conduite et passer à autre chose"
 france_md.902.t: "L'assistant parlementaire fictif du candidat"
 france_md.902.d: "Le Canard enchaîné a publié les fiches de paie : un candidat de premier plan à la présidentielle a placé un membre de sa famille sur la paie parlementaire pour un travail que personne au bureau ne peut attester. Le Parquet national financier a ouvert une enquête préliminaire dès le matin. Le candidat parle de complot institutionnel et refuse de se retirer."
 france_md.902.a: "Retirer le candidat de la course"
 france_md.902.b: "Poursuivre la campagne malgré tout"
 france_md.902.c: "Accuser les juges et la presse"
 france_md.903.t: "Un ancien président au banc des accusés"
 france_md.903.d: "Un ancien président de la République est accusé d'emplois municipaux fictifs payés par les contribuables parisiens, et de factures de campagne imputées à une société pour des meetings qui n'ont jamais eu lieu. L'immunité présidentielle s'est éteinte avec son mandat. Le tribunal correctionnel a fixé une date."
 france_md.903.a: "Laisser la justice faire son travail"
 france_md.903.b: "Dénoncer un procès politique"
 france_md.910.t: "Gilets jaunes sur les ronds-points"
 france_md.910.d: "Une taxe carbone sur le gazole a mis des gilets haute visibilité sur tous les ronds-points du pays. Il n'y a ni syndicat derrière, ni parti, ni délégation avec qui négocier : seulement des automobilistes, des petits commerçants et des retraités qui ne peuvent absorber un centime de plus à la pompe. Le samedi est devenu une manifestation permanente."
 france_md.910.a: "Annuler la hausse de la taxe carburant"
 france_md.910.b: "Maintenir la taxe et ouvrir des discussions"
 france_md.910.c: "Tenir sur la taxe"
 france_md.911.t: "Les Champs-Élysées brûlent le samedi"
 france_md.911.d: "Les cortèges du samedi s'achèvent désormais au gaz lacrymogène sur les Champs-Élysées, l'Arc de Triomphe tagué et les brasseries de l'avenue pillées. La préfecture de police manque de compagnies de CRS reposées et se voit reprocher tout l'après-midi. Les commerces planchent pour la saison."
 france_md.911.a: "Convoquer le Grand débat national"
 france_md.911.b: "Relever le SMIC et baisser la CSG sur les retraites"
 france_md.911.c: "Envoyer les CRS"
 france_md.912.t: "Cinquième mois sur les ronds-points"
 france_md.912.d: "Les occupations en sont à leur cinquième mois, et les balles de caoutchouc tirées par notre propre police font elles-mêmes l'objet d'une enquête judiciaire. Les recettes des centres-villes se sont effondrées et les préfectures n'arrivent plus à trouver de compagnies fraîches. Matignon veut une décision cette semaine."
 france_md.912.a: "Déclarer l'urgence économique et sociale"
 france_md.912.b: "Interdire les cortèges et imposer l'état d'urgence"
 france_md.920.t: "Les socialistes perdent leur siège"
 france_md.920.d: "Le financement public suit les sièges, et après les deux derniers tours il n'y en a plus assez pour garder les lumières allumées à Solférino. Les frondeurs veulent ramener le parti à gauche, les maires et les ministres sortants veulent le garder en état de gouverner, et les deux ailes sont courtisées de l'extérieur. L'immeuble est déjà estimé."
 france_md.920.a: "Ramener le parti à gauche"
 france_md.920.b: "Ancrer le parti au centre gouvernant"
 france_md.920.c: "Laisser les ailes partir"
 france_md.921.t: "Le parti débat de la dédiabolisation"
 france_md.921.d: "La nouvelle direction du Rassemblement national veut la respectabilité : des arguments économiques plutôt qu'ethniques, plus de provocations sur les camps, et des candidats capables de tenir un plateau. La cible est le front républicain qui a tenu le parti hors de chaque second tour. La génération fondatrice y voit une reddition."
 france_md.921.a: "Laisser le parti se normaliser"
 france_md.921.b: "Maintenir le parti sur sa ligne d'origine"
 france_md.921.c: "Laisser la famille fondatrice se quereller en public"
 france_md.922.t: "Le fondateur contre son propre parti"
 france_md.922.d: "Le fondateur a répété sa vieille provocation sur les camps, caméra au poing, au milieu d'une campagne qu'il ne mène pas. La direction a convoqué une instance disciplinaire et raye la présidence d'honneur des statuts. Le congrès dira si le parti garde son nom."
 france_md.922.a: "Remettre le parti à la nouvelle génération"
 france_md.922.b: "Exclure le fondateur"
 france_md.923.t: "La droite brise le front républicain"
 france_md.923.d: "Le chef de la droite traditionnelle est passé au journal de vingt heures et a annoncé un pacte électoral avec le Rassemblement national, sans le soumettre à son propre bureau politique. Le bureau a dû se réunir dans une salle louée, parce qu'il avait fait fermer le siège. Quarante ans de front républicain se sont achevés en une seule émission."
 france_md.923.a: "L'exclure et refuser le pacte"
 france_md.923.b: "Ratifier le pacte pour le second tour"
 france_md.923.c: "Laisser le parti se scinder en deux"
 france_md.930.t: "Huit syndicats contre la réforme des retraites"
 france_md.930.d: "Le relèvement de l'âge légal de départ a mis les huit syndicats représentatifs sur le même estrade pour la première fois depuis une génération. La SNCF et la RATP mènent des grèves reconductibles, les raffineries sont les suivantes, et l'Assemblée n'a pas de majorité pour le texte. L'article 49.3 est sur la table à Matignon."
 france_md.930.a: "Faire passer le texte par le 49.3"
 france_md.930.b: "Négocier avec les syndicats réformistes"
 france_md.930.c: "Retirer le texte"
 france_md.931.t: "Les syndicats réformistes proposent des termes"
 france_md.931.d: "Les confédérations réformistes accepteront un âge de départ plus tardif s'il arrive par paliers trimestriels et si les longues carrières et la pénibilité portent des exemptions. Les économies baissent de moitié et les fédérations dures ne signeront rien. C'est le seul texte qui porte des signatures."
 france_md.931.a: "Signer le compromis"
 france_md.931.b: "Refuser et laisser les grèves courir"
 france_md.932.t: "Les universités sont bloquées"
 france_md.932.d: "Un contrat première embauche permettant aux employeurs de licencier les moins de 26 ans sans motif a mis des poubelles devant les grilles de la Sorbonne et de la moitié des campus de province. Les syndicats étudiants ont été rejoints par les lycées et par la CGT. La préfecture demande l'autorisation d'évacuer les bâtiments."
 france_md.932.a: "Retirer le contrat"
 france_md.932.b: "Négocier avec les syndicats étudiants"
 france_md.932.c: "Évacuer les campus"
 france_md.940.t: "Une élection tendue"
 france_md.940.d: "Le premier tour d'une élection locale a éliminé les candidats sortants de la plupart des villes de France et placé un parti extrémiste au second tour. Dans l'heure, les appels au front républicain étaient lancés : voter pour qui reste, et en débattre après. D'autres répondent qu'un suffrage obtenu ainsi n'est pas un mandat."
 france_md.940.a: "Appeler à un front républicain"
 france_md.940.b: "Laisser le second tour aux électeurs"
 france_md.940.c: "Traiter le résultat comme un verdict sur nous"
 france_md.941.t: "Un mouvement hors des vieux partis"
 france_md.941.d: "Un ancien ministre a quitté le gouvernement pour bâtir un mouvement à lui, ni de gauche ni de droite, financé par des meetings payants et bâti sur une liste d'adhérents constituée porte à porte. Des députés des deux partis de gouvernement demandent déjà des places sur ses listes. Ni l'un ni l'autre n'a de candidat qui le dépasse dans les sondages."
 france_md.941.a: "Soutenir le mouvement"
 france_md.941.b: "Rejetez-le comme une mode passagère"
 france_md.941.c: "Forcer les vieux partis à se renouveler"
 france_md.950.t: "Nuits d'émeutes dans les banlieues"
 france_md.950.d: "Deux adolescents sont morts en fuyant un contrôle d'identité dans une cité de Seine-Saint-Denis. Dès la troisième nuit, les voitures brûlées se comptaient par milliers, des banlieues nord jusqu'à Toulouse et Strasbourg. Les maires demandent des couvre-feux au titre de la loi de 1955."
 france_md.950.a: "Imposer des couvre-feux au titre de la loi de 1955"
 france_md.950.b: "Financer l'agence de rénovation et les quartiers prioritaires"
 france_md.950.c: "Promettre de nettoyer les cités"
 france_md.949.t: "Attaques coordonnées à travers Paris"
 france_md.949.d: "Les attaques se poursuivent dans les arrondissements de l'est et au Stade de France. La BRI est à la porte d'une salle de concert avec des otages à l'intérieur. Tous les hôpitaux d'Île-de-France sont passés en plan blanc."
 france_md.949.a: "Décréter trois jours de deuil national"
 france_md.951.t: "Le Parlement se réunit en Congrès"
 france_md.951.d: "Les cortèges sont terminés et les deux chambres ont été convoquées à Versailles. Beauvau veut la prolongation de l'état d'urgence et le doublement de Sentinelle, le Quai d'Orsay veut envoyer le groupe aéronaval à l'est, et le Conseil d'État nous met déjà en garde sur les perquisitions administratives."
 france_md.951.a: "Prolonger l'état d'urgence"
 france_md.951.b: "Envoyer le groupe aéronaval à l'est"
 france_md.951.c: "Refuser les pouvoirs d'exception"
 france_md.952.t: "Référendum sur la Constitution européenne"
 france_md.952.d: "Le traité ira au pays plutôt qu'au Congrès, et la campagne a fendu les deux partis de gouvernement en leur milieu. Le non s'argumente à gauche comme une charte du travail détaché et à droite comme la fin de la souveraineté française. Les derniers sondages placent les deux camps dans la marge d'erreur."
 france_md.952.a: "Faire campagne dur pour le oui"
 france_md.952.b: "Rester hors de la campagne"
 france_md.952.c: "Ratifier par le Congrès à la place"
 france_md.953.t: "La gauche négocie une plateforme commune"
 france_md.953.d: "Les socialistes, les communistes, les Verts et les insoumis se répartissent les circonscriptions, une candidature à la fois. Les points de blocage n'ont pas bougé depuis la dernière tentative : les traités européens, et qui dirige la plateforme. Chaque parti calcule si l'accord lui coûte plus de sièges qu'il n'en gagne."
 france_md.953.a: "Placer un modéré à la tête du bloc"
 france_md.953.b: "Laisser les insoumis fixer la plateforme"
 france_md.953.c: "Laisser les pourparlers s'effondrer"
 france_md.954.t: "Une Assemblée sans majorité"
 france_md.954.d: "L'Assemblée est revenue en trois blocs et aucun n'atteint 289 sièges. Tout candidat à Matignon peut être censuré le jour de sa nomination, et le budget doit passer avant la fin de la session. L'Élysée reçoit les chefs de parti un par un et n'avance nulle part."
 france_md.954.a: "Nommer un gouvernement de techniciens"
 france_md.954.b: "Dissoudre et retourner devant le pays"
 france_md.954.c: "Bâtir une coalition à travers les blocs"
 FRA_ps_platform: "Plateforme du Parti Socialiste"
 FRA_ps_platform_desc: "Le parti campe sur le bilan de la gauche plurielle : les trente-cinq heures, la couverture maladie universelle et les emplois-jeunes, le tout financé par un élargissement de l'assiette fiscale plutôt que par l'emprunt. Chaque engagement pris au congrès a une ligne budgétaire derrière lui, et la rue de Solférino entend être jugée sur l'arrivée de l'argent."
 FRA_udf_platform: "Plateforme syndicale centriste"
 FRA_udf_platform_desc: "Le centre fait campagne sur des charges plus légères pour les entreprises, une main plus douce sur le code du travail et la fin du réflexe de répondre à chaque problème par un nouvel impôt. Son argument est que le capital ne restera en France que si la France cesse de traiter l'investissement comme quelque chose à punir."
 FRA_lr_platform: "Plateforme de la droite républicaine"
 FRA_lr_platform_desc: "La droite gaulliste offre le marchandage classique de la Cinquième République : une armée financée pour agir seule lorsque la République l'exige, et un État débarrassé des couches d'administration qui se sont accumulées autour de lui. L'ordre au-dedans et l'indépendance au-dehors sont présentés comme une seule et même politique."
 FRA_rpf_platform: "Plateforme souverainiste"
 FRA_rpf_platform_desc: "Pasqua et de Villiers font campagne sur une seule proposition : qu'aucun traité ne puisse transférer ce qui appartient au peuple français, et ils l'appliquent à l'euro, à Schengen et aux pouvoirs de la Commission. Les partenaires commerciaux lisent le programme comme une menace pour chaque arrangement qu'ils ont signé avec Paris."
 FRA_fn_platform: "Plateforme du Front national"
 FRA_fn_platform_desc: "La préférence nationale dans le logement, l'emploi et les prestations, l'arrêt du regroupement familial et le rétablissement des contrôles aux frontières forment l'essentiel du programme. Il rassemble des foules qu'aucun autre parti ne peut réunir et durcit d'autant l'opposition de tous les autres contre lui."
 FRA_lfi_platform: "Plateforme France Insoumise"
 FRA_lfi_platform_desc: "Le mouvement fait campagne pour une assemblée constituante qui enterre la monarchie présidentielle, et il bâtit son cas dans la rue et la salle de meeting plutôt qu'à l'Assemblée nationale. Les soins gratuits au point d'usage sont la revendication phare, et les vieilles loyautés de parti se dissolvent partout où passe la campagne."
 FRA_eelv_platform: "Plateforme écologiste"
 FRA_eelv_platform_desc: "Les Verts demandent l'arrêt progressif du programme de réacteurs, que la construction réponde à l'examen environnemental et que l'argent aille à la recherche de ce qui remplace l'un et l'autre. La transition qu'ils décrivent est réelle, et l'est aussi la décennie de construction plus lente qu'elle exige."
 FRA_pcf_platform: "Plateforme du Parti communiste"
 FRA_pcf_platform_desc: "Le parti tient encore les municipalités de la ceinture rouge et les sections syndicales des grandes usines, et il fait campagne là où il est le plus fort : à l'atelier, sur les salaires, les horaires et la défense de l'emploi industriel. Là où les cellules sont actives, les usines tournent mieux que ne le prédisent les comptes."
 FRA_idea_transparency_reforms: "Transparence de la vie publique"
 FRA_idea_transparency_reforms_desc: "Chaque ministre, député et sénateur dépose désormais une déclaration d'intérêts et de patrimoine auprès d'une autorité indépendante qui peut les publier et saisir les procureurs des cas douteux. La classe politique a ressenti l'obligation comme une offense et s'y est pliée."
 FRA_idea_national_debate: "Grand débat national"
 FRA_idea_national_debate_desc: "Pendant deux mois, les maires ouvrent leurs salles de conseil à quiconque se présente, et les contributions se comptent par dizaines de milliers. Cela coûte de l'argent et du temps ministériel, et cela déplace l'argument des ronds-points vers les mairies."
 FRA_idea_social_emergency_measures: "Urgence économique et sociale"
 FRA_idea_social_emergency_measures_desc: "La prime d'activité a été relevée, les heures supplémentaires ont été défiscalisées, et la hausse de CSG a été annulée pour les plus petites retraites. La facture tombe sur le déficit dès le trimestre, et Bruxelles l'a remarqué."
 FRA_idea_pension_reform_passed: "Réforme des retraites par l'article 49.3"
 FRA_idea_pension_reform_passed_desc: "L'âge de départ a été relevé sans vote, au titre de l'article qui engage la responsabilité du gouvernement, et la motion de censure a échoué à une poignée de députés près. Les comptes des retraites s'améliorent, et chaque texte que nous enverrons ensuite à l'Assemblée sera lu à travers celui-ci."
 FRA_idea_pension_compromise: "Réforme des retraites négociée"
 FRA_idea_pension_compromise_desc: "L'âge de départ s'élève par paliers trimestriels, avec des exemptions pour les longues carrières et le travail classé pénible. Les confédérations réformistes ont signé, les fédérations dures non, et les économies sont à peu près la moitié de ce que promettait le texte d'origine."
 FRA_idea_political_renewal: "Renouveau de la classe politique"
 FRA_idea_political_renewal_desc: "La moitié des bancs de l'Assemblée n'a jamais exercé de mandat, et les machines de parti ne contrôlent plus leurs propres investitures. La nouvelle promotion est visible, énergique et totalement inexpérimentée."
 FRA_idea_urban_renewal: "Rénovation urbaine dans les cités"
 FRA_idea_urban_renewal_desc: "L'agence de rénovation signe des conventions de quinze ans avec les maires des quartiers prioritaires, démolissant les pires tours et reconstruisant les écoles derrière. Les résultats arrivent longtemps après le gouvernement qui les a ordonnés."
 FRA_idea_national_unity: "Union nationale après les attentats"
 FRA_idea_national_unity_desc: "L'opposition a suspendu ses motions, les tricolores sont aux fenêtres, et la réserve et la gendarmerie ont plus de volontaires qu'elles ne peuvent en traiter. Cela ne durera pas l'année, et tant que cela tient, cela vaut quelque chose."
 FRA_idea_technocratic_government: "Gouvernement de techniciens"
 FRA_idea_technocratic_government_desc: "Préfets, inspecteurs des finances et anciens banquiers centraux tiennent les ministères, nommés depuis l'Élysée et tolérés par une Assemblée qui ne s'accorde sur rien d'autre. Ils peuvent faire passer un budget. Ils ne peuvent pas faire passer une réforme."
 FRA_heightened_security: "Plan Vigipirate actif"
 FRA_heightened_security_desc: "Vigipirate a été porté au niveau sécurité renforcée, et la garde des sites sensibles est passée de la police à l'armée sous l'opération Sentinelle. Des milliers de soldats se tiennent désormais devant les gares, les écoles et les lieux de culte, et l'armée impute le coût à sa disponibilité opérationnelle plutôt qu'à Beauvau."
 FRA_state_of_emergency_terrorism: "Déclaration de l'État d'Urgence"
 FRA_state_of_emergency_terrorism_desc: "La loi de 1955 est en vigueur : les préfets peuvent ordonner des perquisitions sans magistrat, assigner à résidence et interdire des rassemblements de leur propre autorité. Le Parlement la renouvelle tous les trois mois et le Conseil d'État compte les recours."
 FRA_terror_threat_elevated: "Menace terroriste élevée"
 FRA_terror_threat_elevated_desc: "La DGSI porte plus de dossiers de revenants et de radicalisés qu'elle n'a d'officiers pour les surveiller, et la liste ne cesse de s'allonger. Les grands événements sont annulés par arrêté préfectoral plutôt que sécurisés."
 FRA_terror_threat_critical: "Menace terroriste critique"
 FRA_terror_threat_critical_desc: "Les services ont plusieurs cellules opérationnelles sous surveillance à la fois et n'espèrent plus toutes les intercepter. Les congés ont été annulés dans la police et la gendarmerie, et le ministre de l'Intérieur a cessé de donner des dates."
 FRA_national_mourning: "Jours de deuil national"
 FRA_national_mourning_desc: "Les drapeaux sont en berne sur tous les bâtiments publics, la minute de silence est observée à midi, et les noms sont lus aux Invalides. Aucune affaire n'est traitée cette semaine."
 FRA_damaged_infrastructure: "Infrastructures critiques endommagées"
 FRA_damaged_infrastructure_desc: "Les attentats ont mis hors service une correspondance de métro et un tronçon du réseau haute tension, et les réparations accusent du retard sur le calendrier d'urgence. Les opérateurs travaillent sous réquisition préfectorale et l'État porte la facture."
 FRA_tourism_crisis: "Crise du tourisme"
 FRA_tourism_crisis_desc: "Le taux d'occupation hôtelier en Île-de-France s'est effondré et les voyagistes long-courriers ont annulé pour la saison. Le tourisme est notre premier pourvoyeur de devises, et il reviendra au rythme des bulletins étrangers plutôt qu'à celui de notre politique de sécurité."
 france_md.970.t: "Bombe dans le RER aux heures de pointe"
 france_md.970.d: "Un engin laissé dans une voiture a explosé dans une station de correspondance pendant la pointe du matin, dans un tronçon de tunnel que les secours ne peuvent atteindre qu'à pied. Des dizaines de morts, et le décompte des blessés continue de monter. Tout le réseau est arrêté et le plan d'afflux massif de victimes est en vigueur."
 france_md.970.a: "Réquisitionner les hôpitaux et les services d'urgence"
 france_md.970.b: "Décréter un jour de deuil national"
 france_md.970.c: "Rouvrir le réseau et refuser les pouvoirs d'exception"
 france_md.971.t: "Des hommes armés attaquent un commissariat"
 france_md.971.d: "Des assaillants à l'arme d'assaut et un véhicule-bélier ont combattu un commissariat des banlieues nord pendant quarante minutes avant l'arrivée de la BRI. Des officiers sont morts et le bâtiment est inutilisable. Quiconque l'a planifié connaissait l'heure de la relève."
 france_md.971.a: "Verrouiller le département et chasser les complices"
 france_md.971.b: "Fortifier chaque commissariat du pays"
 france_md.972.t: "Des équipes suicides frappent à travers la capitale"
 france_md.972.d: "Trois équipes à l'arme d'assaut et ceintures explosives ont frappé, dans la même heure, l'approche d'un stade, une enfilade de bars et une salle de concert. Plus de cent morts, et les chirurgiens d'Île-de-France opèrent sur un pied de guerre. Rien de cette ampleur n'avait été commis sur notre sol depuis la guerre."
 france_md.972.a: "Déclarer l'état d'urgence"
 france_md.972.b: "Invoquer la clause européenne de défense mutuelle"
 france_md.972.c: "Frapper les bases de l'organisation à l'étranger"
 france_md.973.t: "Attentat au Louvre"
 france_md.973.d: "Un homme à la lame a été arrêté au poste du Carrousel, mais l'équipe derrière lui est entrée par les Tuileries avec des explosifs et se trouve désormais dans l'aile Denon. Les visiteurs sont retranchés dans les galeries au-dessus d'eux. Les conservateurs demandent du temps pour déplacer ce qui peut encore l'être."
 france_md.973.a: "Faire sortir les visiteurs d'abord"
 france_md.973.b: "Sécuriser la collection avant l'assaut"
 france_md.974.t: "Des assaillants dans une base militaire"
 france_md.974.d: "Une équipe a franchi le périmètre d'une base aérienne au seul point où les réparations de clôture avaient été suspendues, et a atteint l'aire d'alerte avant que la garde ne les arrête. Ils connaissaient le roulement et les codes des portes. Le contre-espionnage militaire enquête désormais sur notre propre personnel."
 france_md.974.a: "Revoir la sécurité de chaque installation"
 france_md.974.b: "Laisser le contre-espionnage cribler les rangs"
 france_md.975.t: "Otages à la tour Eiffel"
 france_md.975.d: "Des hommes armés ont pris les ascenseurs avec les premiers touristes du jour et tiennent la plateforme supérieure avec plusieurs centaines d'otages. Les machines d'ascenseur sont piégées et le GIGN ne peut s'approcher à travers le Champ-de-Mars sans être vu sur un kilomètre. Ils veulent la libération de prisonniers et une retransmission."
 france_md.975.a: "Envoyer le GIGN dans la tour"
 france_md.975.b: "Leur parler et gagner du temps"
 france_md.975.c: "Refusez toute demande"
 france_md.976.t: "Assaut contre une centrale nucléaire"
 france_md.976.d: "Des assaillants tiennent le bloc administratif et le bâtiment du combustible usé d'une centrale de la vallée de la Loire. Ils disent qu'ils ouvriront la piscine de combustible dès que le site sera approché. L'institut de radioprotection a modélisé le panache : il traverse trois frontières."
 france_md.976.a: "Mettre le réacteur à froid et envoyer le GIGN"
 france_md.976.b: "Donner l'assaut avec tout ce que nous avons"
 france_md.980.t: "Des attaques coordonnées dévastent Paris"
 france_md.980.d: "Des assauts simultanés sur l'approche d'un stade, une salle de concert et une enfilade de bars à Paris ont tué plus de cent personnes. La France a fermé ses frontières et mis l'armée dans les rues. Les ministères de l'Intérieur de toute l'Europe relisent leurs propres dossiers sur les revenants."
 france_md.980.a: "Nous sommes aux côtés de la France"
 france_md.981.t: "Des hommes armés prennent d'assaut le Louvre"
 france_md.981.d: "Des assaillants armés sont dans l'aile Denon du Louvre, des visiteurs retranchés dans les galeries autour d'eux. Le musée détient des œuvres qu'aucune assurance ni aucune restauration ne peut remplacer. Chaque grande collection du continent revoit ce qu'elle ferait."
 france_md.981.a: "Proposer une assistance à la France"
 france_md.982.t: "Otages retenus à la tour Eiffel"
 france_md.982.d: "Plusieurs centaines de visiteurs sont retenus sur la plateforme supérieure de la tour Eiffel par des hommes armés qui ont piégé les machines d'ascenseur. Les forces spéciales françaises se mettent en place sur le Champ-de-Mars, sous les caméras du monde. Les ministères des Affaires étrangères comptent leurs nationaux sur les listes de visiteurs."
 france_md.982.a: "Offrir toute l'aide que la France voudra bien prendre"
 france_md.983.t: "Centrale nucléaire française attaquée"
 france_md.983.d: "Des alertes d'urgence ont été émises à travers l'Europe alors que des terroristes attaquent une installation nucléaire française. Les autorités insistent qu'il n'y a pas de risque radiologique immédiat, mais le potentiel d'un désastre à l'échelle de Tchernobyl a envoyé une onde de choc sur le continent. Les gouvernements préparent des plans de contingence, et les populations proches de l'installation ont reçu l'ordre de se confiner."
 france_md.983.a: "Préparer des plans d'intervention d'urgence"
 france_md.985.t: "Un complot terroriste déjoué"
 france_md.985.d: "Les services de renseignement français ont déjoué avec succès un complot terroriste majeur. Des mois de surveillance, d'opérations sous couverture et de coopération internationale ont mené à des raids coordonnés qui ont capturé les comploteurs avant qu'ils ne frappent. Les détails restent classifiés, mais les sources indiquent que l'attaque prévue aurait pu être catastrophique. Ce succès valide l'investissement lourd dans les capacités antiterroristes."
 france_md.985.a: "Féliciter les services de renseignement"
 france_md.985.b: "Maintenir la sécurité renforcée"
 FRA_counter_terrorism_category: "Opérations antiterroristes"
 FRA_french_communism_expansionism_decision_category: "La guerre contre le capitalisme"
 FRA_3rd_empire_decision_category: "Étendre le Troisième Empire"
 FRA_LFI6th_decision_category: "L'aube d'une nouvelle République"
 FRA_french_socialist_downfall_decision_category: "La chute du socialisme"
 FRA_frexit_decision_category: "Quitter l'Union européenne"
 FRA_royalist_expansion_decision_category: "La reconquête"
 FRA_EU_assistance_decision_category: "Partenariat économique européen"
 FRA_GREEN_EU_assistance_decision_category: "La transition écologique européenne"
 FRA_activate_vigipirate: "Activer Vigipirate"
 FRA_activate_vigipirate_desc: "Activer le système d'alerte de sécurité nationale de la France, déployer des soldats armés pour patrouiller les espaces publics et renforcer la sécurité des sites sensibles. Cela protège contre les attentats terroristes mais entraîne des coûts permanents."
 FRA_declare_state_of_emergency: "Déclarer l'état d'urgence"
 FRA_declare_state_of_emergency_desc: "Face à la menace terroriste critique, déclarer l'état d'urgence national. Cela accorde aux forces de sécurité des pouvoirs élargis mais suspend certaines libertés civiles."
 FRA_end_state_of_emergency: "Mettre fin à l'état d'urgence"
 FRA_end_state_of_emergency_desc: "La menace immédiate ayant reculé, lever l'état d'urgence et rétablir les libertés civiles normales. Cela aidera à normaliser la vie quotidienne et à réduire les tensions politiques."
 FRA_intelligence_surge: "Augmentation du renseignement"
 FRA_intelligence_surge_desc: "Augmenter nettement les crédits et les moyens des services de renseignement pour améliorer la surveillance et les opérations antiterroristes. Cela permet d'agir de façon proactive contre les réseaux terroristes."
 FRA_secure_critical_infrastructure: "Sécuriser les infrastructures critiques"
 FRA_secure_critical_infrastructure_desc: "Investir dans le durcissement des infrastructures critiques — centrales électriques, nœuds de transport, télécommunications — face aux attentats. C'est coûteux, mais cela réduit la vulnérabilité aux attaques majeures."
 FRA_operation_sentinelle: "Opération Sentinelle"
 FRA_operation_sentinelle_desc: "Déployer des milliers de soldats pour des missions de sécurité intérieure : patrouiller les rues, protéger les sites sensibles et appuyer la police. Cette présence militaire rassure le public, mais elle éprouve les forces armées."
 FRA_anti_terror_raid: "Mener un raid antiterroriste"
 FRA_anti_terror_raid_desc: "Sur la base du renseignement collecté, lancer des raids contre les cellules terroristes suspectées. Un succès pourrait perturber les attentats préparés et abaisser le niveau de menace."
 FRA_terrorism_defeated: "Déclarer la victoire sur le terrorisme"
 FRA_terrorism_defeated_desc: "La stabilité rétablie et sans attentat récent, déclarer officiellement que la menace terroriste a été neutralisée. Cela remonte le moral et permet à la nation d'aller de l'avant."
 FRA_rebuild_after_attack: "Reconstruire les infrastructures endommagées"
 FRA_rebuild_after_attack_desc: "Investir dans la réparation des infrastructures endommagées par les attentats. Restaurer ces installations est essentiel pour revenir à la normale et démontrer notre résilience."
 FRA_tourism_recovery_campaign: "Campagne de relance du tourisme"
 FRA_tourism_recovery_campaign_desc: "Lancer une grande campagne internationale pour promouvoir la France comme destination touristique sûre. Relancer le tourisme est vital pour l'économie et montre que les terroristes ne peuvent détruire le mode de vie français."
 FRA_6threp_mission: "Enthousiasme populaire"
 FRA_6threp_mission_desc: "Notre engagement à réformer le système politique a réjoui beaucoup de monde. Beaucoup veulent le changement, mais nous ne devons pas passer pour ceux qui cherchent à retarder le processus."
 FRA_rally_support: "Montrer nos progrès"
 FRA_rally_support_desc: "Nos adversaires essaient de ralentir le processus et de remettre en cause chaque changement. Nous devons tenir bon. Nous avons déjà beaucoup accompli et il faut le montrer."
 FRA_rally_ennemy: "L'opposition critique nos réformes"
 FRA_rally_ennemy_desc: "Ces changements sont indispensables, mais ils ne plaisent pas à tout le monde. L'opposition fait tout pour critiquer chaque décision concernant l'avenir de notre République."
 FRA_timebomb_mission: "Le divorce inévitable"
 FRA_timebomb_mission_desc: "Les deux principales factions du Parti socialiste menacent de le quitter si nous ne réglons pas la situation. Nous devons leur montrer qu'il y a un avenir au Parti socialiste, avant qu'il ne soit trop tard."
 FRA_support_decrease_mission: "Notre parti se scinde"
 FRA_support_decrease_mission_desc: "Plus nous tardons à rassurer nos militants, plus ils nous quitteront pour des groupes plus proches de leurs idéologies. Il faut rectifier le tir rapidement."
 FRA_campaign_against_extremism: "Campagne contre l'extrémisme"
 FRA_campaign_against_extremism_desc: "En ces temps troublés, nous devons rappeler à la gauche et au centre que nous, socialistes, sommes le bon choix face à la montée de l'extrémisme politique."
 FRA_campaign_clash_traitors: "Riposter contre les traîtres du parti"
 FRA_campaign_clash_traitors_desc: "Quiconque nous quitte pour un parti plus à la mode doit s'attendre à ce que nous l'exposions dans les médias. Ce ne sont que des opportunistes et des agents du chaos."
 FRA_boost_eurosceptism: "Campagne contre l'Union européenne"
 FRA_boost_eurosceptism_desc: "Des débats publics aux affiches dans la rue, toute notre société doit respirer l'euroscepticisme. Il faut faire comprendre aux Français que les bureaucrates européens sont la cause de tous nos maux."
 FRA_disobey_treaties: "Violer les traités européens"
 FRA_disobey_treaties_desc: "Nous ne devons plus nous plier à ces lois stupides. Nous sommes maîtres chez nous, et de toute façon ce n'est qu'une question de temps avant que nous quittions l'Union européenne."
 FRA_denounce_eu_policies: "Dénoncer la politique européenne"
 FRA_denounce_eu_policies_desc: "Il faut concentrer notre protestation sur les lois injustes qui sortent du Parlement européen sans que nous puissions nous y opposer. À quoi bon voter si le résultat ne dépend plus vraiment de nous ?"
 FRA_threaten_media: "Menacer les médias pro-européens"
 FRA_threaten_media_desc: "Le sentiment pro-européen a infiltré nos institutions, jusqu'aux médias. Il faudrait rappeler à ces plumitifs de s'en tenir à des sujets à leur niveau, et de cesser de ramer à contre-courant."
 FRA_red_benelux: "Libérer le Benelux"
 FRA_red_benelux_desc: "Nous devons libérer le Benelux du capitalisme et du libéralisme européen."
 FRA_benelux_boost: "Intégrer les cultures du Benelux"
 FRA_benelux_boost_desc: "Ouvriers néerlandais, flamands et wallons rejoignent désormais la révolution comme un seul homme, leurs usines et syndicats absorbés dans notre projet socialiste."
 FRA_done_with_dumping: "La fin des paradis fiscaux"
 FRA_done_with_dumping_desc: "L'existence même de ces pays, qui consacrent leur vie à servir de paradis fiscaux, est un affront à l'égalité et à la solidarité. Il faut y mettre un terme."
 FRA_dumping_boost: "Intégrer la culture suisse"
 FRA_dumping_boost_desc: "Nous avons brisé les cadres bancaires qui soutenaient le paradis fiscal, et la main-d'œuvre suisse est réintégrée à notre projet économique."
 FRA_red_iberia: "Jamais un autre dictateur"
 FRA_red_iberia_desc: "Nous devons veiller à ce que notre flanc sud ne retombe pas sous l'influence du fascisme."
 FRA_iberia_boost: "Intégrer les cultures ibériques"
 FRA_iberia_boost_desc: "Les mouvements ouvriers espagnols et portugais voient enfin la promesse que 1936 n'a pas pu tenir, et rejoignent notre révolution d'égal à égal."
 FRA_ciao_bella: "Ciao Bella"
 FRA_ciao_bella_desc: "La révolution communiste a échoué en Italie, mais elle a laissé une empreinte durable. Il est temps de réparer les torts du passé."
 FRA_italy_boost: "Intégrer la culture italienne"
 FRA_italy_boost_desc: "L'héritage du PCI vit encore. Nous achevons le biennio rosso que les ouvriers italiens ont commencé et jamais terminé."
 FRA_avenge_long_knife: "La nuit des longues faucilles"
 FRA_avenge_long_knife_desc: "Nous devons provoquer une révolution dans les États germaniques pour les libérer du capitalisme et empêcher le nationalisme de triompher à nouveau."
 FRA_ger_aus_boost: "Intégrer les cultures germaniques"
 FRA_ger_aus_boost_desc: "Les cadres industriels est-allemands et les syndicats autrichiens apportent leur discipline et leur expérience à notre projet révolutionnaire."
 FRA_ostalgia: "Ramener la révolution en Europe de l'Est"
 FRA_ostalgia_desc: "Les pays d'Europe de l'Est ont beaucoup souffert sous l'occupation soviétique. Nous devons leur montrer que le communisme a aussi ses vertus."
 FRA_ostalgia_boost: "Intégrer les cultures d'Europe de l'Est"
 FRA_ostalgia_boost_desc: "Nous transformons l'Ostalgie qui persiste en Europe de l'Est en un véritable enthousiasme pour notre révolution."
 FRA_birthplace_revolution: "Reprendre le berceau du communisme"
 FRA_birthplace_revolution_desc: "Nous devons ramener la révolution aux Russes qui ont oublié la gloire passée du communisme."
 FRA_birthplace_boost: "Intégrer les cultures slaves"
 FRA_birthplace_boost_desc: "Nous reprenons le berceau de la révolution, en accueillant les peuples russes et slaves dans le mouvement qu'ils ont jadis dirigé."
 FRA_no_more_neutrality: "Briser la neutralité du Nord"
 FRA_no_more_neutrality_desc: "Les pays d'Europe du Nord ont trop longtemps évité de choisir entre socialisme et capitalisme. Il est temps qu'ils fassent ce choix."
 FRA_neutrality_boost: "Intégrer les cultures nordiques"
 FRA_neutrality_boost_desc: "La social-démocratie nordique se convertit enfin : ses travailleurs et ses institutions sont intégrés à notre projet révolutionnaire plus large."
 FRA_cold_war2: "Plus de guerre froide"
 FRA_cold_war2_desc: "Nous allons venger l'URSS et l'effondrement du pacte de Varsovie en détruisant ce qui reste de l'OTAN."
 FRA_cold_war_boost: "Intégrer les cultures anglaises"
 FRA_cold_war_boost_desc: "Prolétaires de tous les pays, unissez-vous ! La tradition ouvrière de l'Anglosphère trouve enfin sa place dans notre révolution."
 FRA_red_Europe: "Achever la révolution européenne"
 FRA_red_Europe_desc: "Nous allons porter la révolution à toute l'Europe, encore sous l'oppression des capitalistes."
 FRA_red_victory: "Triomphe de la révolution européenne"
 FRA_red_victory_desc: "Nous avons libéré les États européens des chaînes du capitalisme. C'est une grande victoire pour la révolution."
 FRA_annex_puppet_napo: "Faire valoir nos revendications"
 FRA_annex_puppet_napo_desc: "L'une de nos dépendances possède un territoire que nous revendiquons. Il est temps que ce territoire nous soit rendu."
 FRA_reunionism: "Réaliser le réunionnisme"
 FRA_reunionism_desc: "Il est temps de rassembler les peuples de culture française. Et cette fois, pour de bon."
 FRA_Never_another_guerilla: "Sécuriser le Sud-Ouest"
 FRA_Never_another_guerilla_desc: "Nous marchons vers l'est, il faut donc s'assurer que personne ne nous prenne à revers. Cette fois, il n'y aura pas de guérilla, car nous écraserons toute résistance."
 FRA_Avenge_Sedan: "Vengeance Berline"
 FRA_Avenge_Sedan_desc: "C'est la montée de l'Empire allemand qui a mis fin à l'ancien Empire français. Nous devons venger cet outrage et reprendre nos frontières naturelles."
 FRA_natural_border: "Intégrer les frontières naturelles"
 FRA_natural_border_desc: "Les populations des territoires conquis ont fini par accepter la nouvelle réalité. Le Rhin forme la frontière de la France."
 FRA_crush_coalition: "Europe centrale sécurisée"
 FRA_crush_coalition_desc: "Ces territoires seront essentiels à la longue marche vers Moscou actuellement en préparation."
 FRA_napoleon_empire: "Intégrer l'Empire napoléonien"
 FRA_napoleon_empire_desc: "Les populations des territoires conquis ont fini par accepter la nouvelle réalité. Elles sont désormais citoyennes à part entière du Troisième Empire français."
 FRA_prepare_russia: "Unifier l’Europe de l’Est"
 FRA_prepare_russia_desc: "Notre invasion de la Russie est imminente ; nous devons assurer la sécurité de nos alliés et les préparer à un conflit de haute intensité avec la Russie."
 FRA_2nd_empire_colonies: "Retrouver l'empire colonial"
 FRA_2nd_empire_colonies_desc: "Nous achèverons ce que Napoléon III et la Troisième République ont commencé. Nous bâtirons un empire colonial stable."
 FRA_no_more_berezina: "Opération Tislit"
 FRA_no_more_berezina_desc: "Le moment est venu de détruire l'Empire russe une fois pour toutes. Cette fois, ils n'auront pas le temps de brûler Moscou."
 FRA_the_Foe: "En finir avec la perfide Albion"
 FRA_the_Foe_desc: "Nous allons briser ce blocus continental une fois pour toutes. L'ennemi numéro un de la Révolution tombera."
 FRA_new_order: "Proclamer le nouvel ordre européen"
 FRA_new_order_desc: "Notre domination sur le continent est assurée. Nous avons unifié l'Europe sous notre Empire. Un nouveau chapitre de l'histoire européenne commence."
 FRA_Expansion_policy: "Choisir notre politique d'expansion"
 FRA_Expansion_policy_desc: "Le nouveau Royaume franc doit se fixer un objectif de conquête."
 FRA_operation_clovis: "Opération Clovis"
 FRA_operation_clovis_desc: "Nous reprendrons le berceau de la civilisation franque aux soi-disant États du Benelux."
 FRA_operation_bouvines: "Opération Bouvines"
 FRA_operation_bouvines_desc: "Pour que l'Empire franc voie le jour, le Saint-Empire romain germanique doit à nouveau tomber."
 FRA_operation_marignan: "Opération Marignan"
 FRA_operation_marignan_desc: "Nous devons reconquérir la péninsule italienne. Pour reprendre le contrôle du siège de l'Église catholique. Seul le pape à Rome pourra nous couronner empereur."
 FRA_operation_roland: "Opération Roland"
 FRA_operation_roland_desc: "L'arrière-garde ne tombera plus."
 FRA_unite_frank_europe: "Unifier le peuple franc"
 FRA_unite_frank_europe_desc: "Nous avons réintégré tous les peuples qui, comme nous, descendent des Francs. C'est un grand jour pour la nation franque."
 FRA_frankish_empire: "Intégrer l'Empire franc"
 FRA_frankish_empire_desc: "L'Empire franc a été réunifié. L'injustice du traité de Verdun a été réparée."
 FRA_annex_puppet_king: "Faire valoir nos revendications"
 FRA_annex_puppet_king_desc: "L'une de nos dépendances possède un territoire que nous revendiquons. Il est temps que ce territoire nous soit rendu."
 FRA_glacis: "Percer le glacis"
 FRA_glacis_desc: "Les pays de l'Est se dressent entre nous et notre destin. Nous devons unir l'Occident sous notre bannière."
 FRA_a_war_for_europe: "La guerre pour l'Europe"
 FRA_a_war_for_europe_desc: "Les puissances d'Europe occidentale et la Russie se sont toujours disputé le contrôle de l'Europe. Il est temps de mettre fin à ce conflit et d'unifier l'Occident."
 FRA_operation_hastings: "Opération Hastings"
 FRA_operation_hastings_desc: "Il est temps de mettre fin à une rivalité qui a façonné l'histoire. Je vous promets que celle-ci ne durera pas cent ans."
 FRA_king_europe_victory: "Proclamer la victoire en Europe"
 FRA_king_europe_victory_desc: "Nos ennemis n'existent plus. Nous sommes la seule puissance européenne encore debout. L'Occident devra se rassembler derrière nous."
 FRA_recover_7_year_war_charlemagne: "Reprendre les colonies du Royaume"
 FRA_recover_7_year_war_charlemagne_desc: "L'Europe est en sécurité. Nous pouvons maintenant reprendre le contrôle des colonies qui nous ont été enlevées."
 FRA_start_crusade: "Sécuriser la Méditerranée"
 FRA_start_crusade_desc: "Pour que la croisade parte vers la Terre sainte, il nous faut contrôler les îles sur notre route. Notre chaîne logistique doit être assurée."
 FRA_crusade_siege: "Une tête de pont en Terre sainte"
 FRA_crusade_siege_desc: "Reprendre la Terre sainte par une attaque frontale contre ses occupants exigera d'engager toutes nos forces. Nous devons pouvoir les déployer à proximité."
 FRA_claim_jerusalem: "Reprendre la Terre sainte"
 FRA_claim_jerusalem_desc: "Le moment est venu de reprendre Jérusalem et la Terre sainte. La Dixième croisade a atteint son but."
 FRA_revenge_over_saladin: "Assurer la stabilité au Moyen-Orient"
 FRA_revenge_over_saladin_desc: "Nous devons stabiliser la région en écrasant chacune de ses puissances régionales, dont les conflits la déstabilisent."
 FRA_king_crusade1_victory: "Proclamer le triomphe de la Dixième croisade"
 FRA_king_crusade1_victory_desc: "Nous avons repris la Terre sainte."
 FRA_kingdom_heaven: "Proclamer le Royaume de Jérusalem"
 FRA_kingdom_heaven_desc: "Le Royaume de Jérusalem renaîtra"
 FRA_rally_frank: "Protéger les Francs"
 FRA_rally_frank_desc: "L'Europe sera bientôt le théâtre d'une nouvelle guerre. Dans ces conditions, nous devons veiller à ce que nos frères francs n'en soient pas victimes."
 FRA_unite_frank: "Réintégrer les Francs"
 FRA_unite_frank_desc: "Nous avons réintégré tous les peuples qui, comme nous, descendent des Francs. C'est un grand jour pour la nation franque."
 FRA_noah_ark: "Rassembler les nations catholiques"
 FRA_noah_ark_desc: "Nous unirons les nations catholiques d'Europe sous notre bannière."
 FRA_war_against_protestantism: "La guerre contre le protestantisme"
 FRA_war_against_protestantism_desc: "Les huit premières croisades contre les hérétiques ont échoué. Nous ne échouerons pas une neuvième fois."
 FRA_end_the_schism: "Il n'en peut rester qu'un"
 FRA_end_the_schism_desc: "Nous devons affronter toutes les nations orthodoxes d'Europe en devenant les gardiens de l'Europe. L'Église sera à l'abri pour toujours."
 FRA_king_crusade2_victory: "Proclamer la victoire totale de l'Église"
 FRA_king_crusade2_victory_desc: "Nous régnons en maîtres sur l'Europe"
 FRA_recover_7_year_war_holy: "Reprendre les colonies du Royaume"
 FRA_recover_7_year_war_holy_desc: "Nos ennemis n'existent plus. Nous sommes la seule puissance européenne encore debout. L'Occident devra se rassembler derrière nous."
 FRA_inst_civ_GER: "Investir dans l'économie allemande"
 FRA_inst_civ_GER_desc: "Nous investissons directement dans les entreprises d'ingénierie allemandes, renforçant l'épine dorsale industrielle de notre union commune."
 FRA_inst_civ_GRE: "Investir dans l'économie grecque"
 FRA_inst_civ_GRE_desc: "La marine marchande grecque reste le sang de son économie, et notre investissement renforce cette industrie maritime vitale."
 FRA_inst_civ_ITA: "Investir dans l'économie italienne"
 FRA_inst_civ_ITA_desc: "Nous soutenons le secteur italien de la machine-outil, renforçant la base d'ingénierie de précision au cœur de son industrie."
 FRA_inst_civ_BEL: "Investir dans l'économie belge"
 FRA_inst_civ_BEL_desc: "L'industrie chimique ancre l'économie belge, et nos capitaux élargiront sa production et sa capacité d'exportation."
 FRA_inst_civ_SPR: "Investir dans l'économie espagnole"
 FRA_inst_civ_SPR_desc: "Nous investissons dans le secteur automobile espagnol, soutenant les chaînes d'assemblage qui emploient des centaines de milliers de travailleurs."
 FRA_inst_civ_POL: "Investir dans l'économie polonaise"
 FRA_inst_civ_POL_desc: "Les chantiers navals polonais ont jadis mené la construction navale européenne, et notre investissement aidera à restaurer leur capacité industrielle."
 FRA_inst_inf_GER: "Investir dans le réseau de transport de l'Allemagne"
 FRA_inst_inf_GER_desc: "Nous finançons l'amélioration du corridor Rhin-Rhône, facilitant le flux de marchandises entre nos deux économies."
 FRA_inst_inf_GRE: "Investir dans le réseau de transport de la Grèce"
 FRA_inst_inf_GRE_desc: "L'investissement dans le corridor Athènes-Thessalonique modernisera la principale artère de transport nord-sud de la Grèce."
 FRA_inst_inf_ITA: "Investir dans le réseau de transport de l'Italie"
 FRA_inst_inf_ITA_desc: "Nous soutenons la modernisation du corridor du Brenner, renforçant la liaison ferroviaire vitale entre l'Italie et l'Europe du Nord."
 FRA_inst_inf_BEL: "Investir dans le réseau de transport de la Belgique"
 FRA_inst_inf_BEL_desc: "Nous investissons dans le corridor ferroviaire mer du Nord-Méditerranée, renforçant l'artère de fret qui traverse les ports belges."
 FRA_inst_inf_SPR: "Investir dans le réseau de transport de l'Espagne"
 FRA_inst_inf_SPR_desc: "Notre investissement dans les franchissements ferroviaires pyrénéens reliera enfin correctement les réseaux ibérique et français."
 FRA_inst_inf_POL: "Investir dans le réseau de transport de la Pologne"
 FRA_inst_inf_POL_desc: "Nous finançons le corridor Via Baltica, connectant enfin la Pologne au réseau de transport européen élargi."
 FRA_inst_eco_GER: "Investir dans la transition écologique allemande"
 FRA_inst_eco_GER_desc: "Nous soutenons la sortie du nucléaire allemand, en finançant les capacités renouvelables nécessaires pour combler le vide."
 FRA_inst_eco_GRE: "Investir dans la transition écologique grecque"
 FRA_inst_eco_GRE_desc: "La Grèce dépend encore fortement du lignite, et notre investissement accélérera son virage vers des sources d'énergie plus propres."
 FRA_inst_eco_ITA: "Investir dans la transition écologique italienne"
 FRA_inst_eco_ITA_desc: "L'Italie reste dangereusement dépendante du gaz importé, et notre investissement soutient sa diversification vers les énergies renouvelables."
 FRA_inst_eco_BEL: "Investir dans la transition écologique belge"
 FRA_inst_eco_BEL_desc: "Nous aidons la Belgique à gérer sa propre sortie du nucléaire, en finançant la capacité de réseau nécessaire pour garder les lumières allumées."
 FRA_inst_eco_SPR: "Investir dans la transition écologique espagnole"
 FRA_inst_eco_SPR_desc: "L'Espagne a un énorme potentiel solaire, et notre investissement aidera à étendre sa capacité de production renouvelable."
 FRA_inst_eco_POL: "Investir dans la transition écologique polonaise"
 FRA_inst_eco_POL_desc: "La Pologne reste tributaire du charbon pour l'essentiel de son électricité, et notre investissement soutient sa transition vers une énergie plus propre."
 FRA_vigipirate_activated_tt: "§GPlan Vigipirate activé - attentats terroristes bloqués§!"
 FRA_state_of_emergency_declared_tt: "§YÉtat d'urgence déclaré - pouvoirs de sécurité renforcés§!"
 FRA_state_of_emergency_ended_tt: "§GL'état d'urgence est levé - les libertés civiles sont rétablies§!"
 FRA_intelligence_surge_tt: "§GLes services de renseignement reçoivent un financement supplémentaire - des capacités antiterroristes améliorées§!"
 FRA_securing_infrastructure_tt: "§YDébut des améliorations de sécurité des infrastructures§!"
 FRA_infrastructure_secured_tt: "§GInfrastructures critiques sécurisées contre les attaques§!"
 FRA_sentinelle_deployed_tt: "§G7 000 soldats déployés pour la sécurité intérieure§!"
 FRA_conducting_raid_tt: "§YMener des opérations antiterroristes§!"
 FRA_raid_success_tt: "§GRaid réussi - cellule terroriste perturbée§!"
 FRA_raid_failure_tt: "§RRaid échoué - les terroristes se sont échappés§!"
 FRA_terrorism_defeated_tt: "§GLa menace terroriste a été vaincue — la France est de nouveau en sécurité§!"
 FRA_rebuilding_infrastructure_tt: "§YReconstruction des infrastructures endommagées§!"
 FRA_infrastructure_rebuilt_tt: "§GLes infrastructures endommagées ont été réparées§!"
