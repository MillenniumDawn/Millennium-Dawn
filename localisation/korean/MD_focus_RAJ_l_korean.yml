 indian_event.53.t: "인도와의 연합 조약"
 indian_event.53.d: "오늘 인도 대표단이 우리 수도에 도착하여 양국 간 군사 협력과 우호를 제안했습니다. 우리는 오래전부터 아시아에서 강력한 동맹이 될 만한 상대를 찾고 있었는데, 이제 그 기회가 찾아왔습니다. 어떻게 하시겠습니까?"
 indian_event.53.a: "우호가 전쟁보다 낫다"
 indian_event.53.b: "인도는 우리의 선택지가 아니다"
 indian_event.54.t: "아프가니스탄 내 세력권 분할 제안"
 indian_event.54.d: "우리가 이제 인도의 동맹이 된 만큼, 아프가니스탄의 세력권을 나누어 양국 사이에 육상 연결로를 만드는 문제가 대두되었습니다. 이 제안은 매우 매력적입니다. 이렇게 하면 우리의 세력권을 넓히고 세계에서의 입지를 강화할 수 있기 때문입니다."
 indian_event.54.a: "제국을 건설할 때다"
 indian_event.54.b: "우리 영토만으로도 충분하다"
 HE_accepted_TT: "§R아프가니스탄 분할이 이루어지려면 투르크메니스탄이 동맹 협정을 수락해야 합니다§!"
 TRK_accepted_this: "연합 조약이 체결되었습니다"
 indian_event.55.t: "BRICS 군사 연합"
 indian_event.55.d: "최근 BRICS 회의에서 BRICS를 군사 동맹으로 통합하자는 제안이 나왔습니다. 가입하시겠습니까?"
 indian_event.55.a: "참여한다!"
 indian_event.55.b: "사양하겠다"
 indian_event.56.t: "NATO 플러스 협상"
 indian_event.56.d: "인도는 최근 몇 년간 서방과의 연대를 훨씬 강화했습니다. 우리 장관들과 외교관들은 인도를 정식 회원국에는 미치지 못하는 'NATO 플러스' 파트너 지위인 주요 비NATO 동맹국으로서 동맹에 묶어 둘 것을 제안합니다. 추진하시겠습니까?"
 indian_event.56.a: "초대하자!"
 indian_event.56.b: "응? 안 돼!"
