 ukr_modernize_sov_equipment_t55_next_modernization: "다음 §YT-55§! 개량 발주"
 ukr_modernize_sov_equipment_t55_next_modernization_desc: "\n\n\n\n\n\n£UKR_desctext_modernize_sov_t55_modernized_for_tooltip\n\n\n\n\n\n\n\n\n§W§YKMDB§!는 또 다른 §YT-55§! 개량 사업을 맡을 수 있습니다. 이미 개발한 개량형은 다시 제시되지 않습니다.§!\n\n$UKR_rada_modernization_adoption_tt$\n\n개발 비용은 계획을 시작하는 연대에 따라 달라집니다. 설계안을 선택하려면 해당 단계에 필요한 자금이 있어야 합니다."
 ukr_modernize_sov_equipment_t55_procurement_program: "§YT-55§! 조달 계획 개시"
 ukr_modernize_sov_equipment_t55_procurement_program_desc: "\n\n\n\n\n\n£UKR_desctext_modernize_sov_t55_procurement_for_tooltip\n\n\n\n\n\n\n\n\n§W보관 중인 §YT-54§!와 §YT-55§! 차체가 §Y하르키우 장갑차 공장§!을 거쳐 우리가 개발한 개량 패키지를 달고 돌아옵니다. 계획이 종료될 때까지 하르키우의 §R군수 공장 한 곳§!이 일반 생산에서 빠집니다.§!"
