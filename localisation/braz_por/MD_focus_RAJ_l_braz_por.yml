 RAJ_rebellion.1.a:0 "Isto é um desastre."
 RAJ_rebellion.1.b:0 "A situação se estabilizou."
 RAJ_rebellion_ladakh_title:0 "Ladakh Declara Independência"
 RAJ_rebellion_ladakh_desc:0 "A população muçulmana de Ladakh perdeu toda a fé no governo central. Separatistas armados tomaram o controle da região e declararam independência. Nossas forças foram expulsas da área."
 RAJ_rebellion_meghalaya_title:0 "Meghalaya Declara Independência"
 RAJ_rebellion_meghalaya_desc:0 "As comunidades cristãs de Meghalaya se levantaram contra o governo central. Milícias tribais tomaram o controle do estado e declararam independência."
 RAJ_rebellion_manipur_title:0 "Manipur Declara Independência"
 RAJ_rebellion_manipur_desc:0 "As comunidades cristãs e tribais de Manipur se levantaram contra o governo central. Grupos armados tomaram o controle do estado e declararam independência."
 RAJ_rebellion_sikkim_title:0 "Sikkim Declara Independência"
 RAJ_rebellion_sikkim_desc:0 "A população budista de Sikkim perdeu toda a fé no governo central. Forças separatistas tomaram o controle e declararam independência, buscando restaurar a soberania de Sikkim."
 RAJ_rebellion_punjab_title:0 "Punjab Declara Independência"
 RAJ_rebellion_punjab_desc:0 "A população sikh de Punjab perdeu toda a fé no governo central. Separatistas do Khalistan tomaram o controle da região e declararam independência."
 indian_event.70.t:0 "Convite para Membro Pleno do BRICS"
 indian_event.70.d:0 "[FROM.GetName] estendeu um convite para que nossa nação ingresse no BRICS como membro pleno. Isso representa uma oportunidade significativa de aprofundar nossos laços econômicos e políticos com as economias emergentes mais dinâmicas do mundo. A adesão plena nos concede direito a voto, acesso ao Novo Banco de Desenvolvimento e participação em todas as iniciativas do BRICS."
 indian_event.70.a:0 "Aceitar o convite com honra"
 indian_event.70.b:0 "Recusar - não atendemos aos requisitos"
 indian_event.71.t:0 "[FROM.GetName] Aceita a Adesão Plena ao BRICS"
 indian_event.71.d:0 "[FROM.GetName] aceitou formalmente nosso convite para ingressar no BRICS como membro pleno. Essa expansão histórica fortalece nossa aliança e traz novas oportunidades de cooperação em comércio, finanças e segurança."
 indian_event.71.a:0 "Recebê-los no grupo"
 indian_event.72.t:0 "[FROM.GetName] Recusa a Adesão Plena ao BRICS"
 indian_event.72.d:0 "[FROM.GetName] recusou nosso convite para ingressar no BRICS como membro pleno. Embora decepcionante, respeitamos sua decisão e esperamos continuar o engajamento diplomático por outros canais."
 indian_event.72.a:0 "Uma oportunidade perdida"
 indian_event.73.t:0 "Convite para Membro Associado do BRICS"
 indian_event.73.d:0 "[FROM.GetName] nos convidou para sermos membro associado do BRICS. Esse status oferece maiores oportunidades de cooperação sem direito pleno a voto. Os membros associados participam de iniciativas econômicas e têm status de observador nas cúpulas."
 indian_event.73.a:0 "Aceitar a adesão como associado"
 indian_event.73.b:0 "Recusar - requisitos não atendidos"
 indian_event.74.t:0 "[FROM.GetName] Aceita a Adesão como Associado ao BRICS"
 indian_event.74.d:0 "[FROM.GetName] aceitou nosso convite de adesão como associado ao BRICS. Isso fortalece nossos laços econômicos e abre novos caminhos de cooperação."
 indian_event.74.a:0 "Um passo mais perto da integração plena"
 indian_event.75.t:0 "[FROM.GetName] Recusa a Adesão como Associado ao BRICS"
 indian_event.75.d:0 "[FROM.GetName] recusou nossa oferta de adesão como associado ao BRICS. Continuamos abertos à cooperação futura."
 indian_event.75.a:0 "Talvez em outra ocasião"
 indian_event.76.t:0 "Convite para Status de Observador do BRICS"
 indian_event.76.d:0 "[FROM.GetName] nos ofereceu o status de observador no BRICS. Isso nos permite participar de cúpulas, integrar grupos de trabalho e construir relações com os Estados-membros enquanto consideramos um engajamento mais profundo."
 indian_event.76.a:0 "Aceitar o status de observador"
 indian_event.76.b:0 "Recusar - sem interesse"
 indian_event.77.t:0 "[FROM.GetName] Aceita o Status de Observador do BRICS"
 indian_event.77.d:0 "[FROM.GetName] aceitou nosso convite para o status de observador no BRICS. Isso marca o início do que pode ser uma relação mais profunda."
 indian_event.77.a:0 "Toda jornada começa com um único passo"
 indian_event.78.t:0 "[FROM.GetName] Recusa o Status de Observador do BRICS"
 indian_event.78.d:0 "[FROM.GetName] recusou nossa oferta de status de observador no BRICS. O convite continua de pé caso reconsiderem."
 indian_event.78.a:0 "Talvez com o tempo"
 indian_event.79.t:0 "Oferecida a Adesão como Associado ao BRICS"
 indian_event.79.d:0 "[FROM.GetName] se ofereceu para elevar nossa posição no BRICS de observador para membro associado. O status de associado nos dá um assento nas iniciativas econômicas do bloco e uma voz mais forte nas discussões de cúpula, aprofundando nossa parceria com as economias emergentes."
 indian_event.79.a:0 "Aceitar a promoção"
 indian_event.79.b:0 "Recusar - estamos satisfeitos como observadores"
 indian_event.82.t:0 "Oferecida a Adesão Plena ao BRICS"
 indian_event.82.d:0 "[FROM.GetName] se ofereceu para elevar nossa posição no BRICS de associado para membro pleno. A adesão plena concede direito a voto, acesso ao Novo Banco de Desenvolvimento e entrada nos arranjos de segurança da aliança, vinculando nosso futuro ao bloco."
 indian_event.82.a:0 "Aceitar a adesão plena"
 indian_event.82.b:0 "Recusar - o compromisso é grande demais"
