 ukraine_parliament.21.t: "El Parlamento acepta nuestro nuevo presupuesto de salud"
 ukraine_parliament.21.d: "The Parliament has approved our request to decrease healthcare spending. This comes following our proposal that was made a few days back, and it appears that the motion gained a lot of popularity and support."
 ukraine_parliament.21.a: "Genial"
 ukraine_parliament.22.t: "El Parlamento rechaza nuestro nuevo presupuesto de salud"
 ukraine_parliament.22.d: "The Parliament has rejected our request to decrease healthcare spending. This comes following our proposal that was made a few days back, and it appears that the motion has not gained a lot of popularity and support."
 ukraine_parliament.22.a: "Desafortunado"
 ukraine_parliament.22.b: "Quizás un pequeño soborno pueda cambiar su opinión..."
