 ukraine_modernize_sov_equipment_brdm_2_modernization.1.name: "BRDM-2 현대화 제안"
 ukraine_modernize_sov_equipment_brdm_2_modernization.1.desc: "우리의 BRDM-2 개량 요청이 방위산업계에 전달되었습니다. §Y미콜라이우 전차 수리 공장§!은 10년에 걸친 일련의 개량을 약속하고, §YNVK 테크임펙스§!는 시간이 필요하지만 차량을 철저히 재구축하려 하며, 키이우·크레멘추크·비니차의 소규모 공장들은 더 저렴한 해법을 제시합니다. 낡은 정찰 장갑차를 그대로 둘 수도 있습니다."
 ukraine_modernize_sov_equipment_brdm_2_modernization.1.a: "미콜라이우 전차 수리 공장을 선택한다"
 ukraine_modernize_sov_equipment_brdm_2_modernization.1.b: "NVK 테크임펙스를 선택한다"
 ukraine_modernize_sov_equipment_brdm_2_modernization.1.c: "소규모 공장들을 선택한다"
 ukraine_modernize_sov_equipment_brdm_2_modernization.1.d: "BRDM-2 계획을 영구히 종료한다"
 ukraine_modernize_sov_equipment_brdm_2_modernization.2.name: "BRDM-2 조기 개량형 준비 완료"
 ukraine_modernize_sov_equipment_brdm_2_modernization.2.desc: "미콜라이우 공장이 두 가지 조기 개량형을 모두 완성했습니다. §YBRDM-2LD§!는 항속거리를 4분의 1 늘려 주는 우크라이나제 SMD-21 디젤 엔진을 얻고, §YBRDM-2M§!은 기존 가솔린 엔진을 그대로 두고 측면 해치만 추가합니다."
 ukraine_modernize_sov_equipment_brdm_2_modernization.2.a: "디젤 엔진을 단 §YBRDM-2LD§!를 채택한다"
 ukraine_modernize_sov_equipment_brdm_2_modernization.2.b: "더 저렴한 §YBRDM-2M§!을 채택한다"
 ukraine_modernize_sov_equipment_brdm_2_modernization.2.c: "계획을 보류한다"
 ukraine_modernize_sov_equipment_brdm_2_modernization.3.name: "BRDM-2DI 하자르 준비 완료"
 ukraine_modernize_sov_equipment_brdm_2_modernization.3.desc: "미콜라이우 공장이 IVECO 텍터 디젤 엔진, 열상 장비, 하차 병력용 추가 해치를 갖춘 §YBRDM-2DI 하자르§!를 완성했습니다. 추가 비용을 들이면 신형 §Y부흐§! 무장 스테이션도 장착할 수 있습니다."
 ukraine_modernize_sov_equipment_brdm_2_modernization.3.a: "§YBRDM-2DI 하자르-부흐§!를 채택한다"
 ukraine_modernize_sov_equipment_brdm_2_modernization.3.b: "§YBRDM-2DI 하자르§!를 채택한다"
 ukraine_modernize_sov_equipment_brdm_2_modernization.3.c: "계획을 보류한다"
 ukraine_modernize_sov_equipment_brdm_2_modernization.4.name: "BRDM-2의 새 제조사들"
 ukraine_modernize_sov_equipment_brdm_2_modernization.4.desc: "또 다른 업체 네 곳이 BRDM-2 제안서를 국방부에 보냈습니다. 그중 한 곳을 미콜라이우와 나란히 계획에 참여시킬 수 있습니다. 아니면 미콜라이우에만 집중하여 그들의 개발 주기가 이점을 얻게 할 수도 있습니다."
 ukraine_modernize_sov_equipment_brdm_2_modernization.4.a: "NVK 테크임펙스에서 §YBRDM-2T§!를 주문한다"
 ukraine_modernize_sov_equipment_brdm_2_modernization.4.b: "마야크에서 §YBRDM-2DP§!를 구입한다"
 ukraine_modernize_sov_equipment_brdm_2_modernization.4.c: "비니차 공장을 끌어들인다"
 ukraine_modernize_sov_equipment_brdm_2_modernization.5.name: "남은 BRDM-2"
 ukraine_modernize_sov_equipment_brdm_2_modernization.5.desc: "낡은 BRDM-2 다수가 아직 개량을 기다리고 있습니다. 미콜라이우 공장은 저렴하고 빠르게 만들 수 있는 동원형 개량안인 §YBRDM-2L1§!, 또는 정찰 차량을 완전히 새로 구상한 §YBRM 만후스트§!를 제안합니다."
 ukraine_modernize_sov_equipment_brdm_2_modernization.5.a: "동원형 §YBRDM-2L1§!을 채택한다"
 ukraine_modernize_sov_equipment_brdm_2_modernization.5.b: "§YBRM 만후스트§!를 개발한다"
 ukraine_modernize_sov_equipment_brdm_2_modernization.5.c: "계획을 보류한다"
 ukraine_modernize_sov_equipment_brdm_2_modernization.6.name: "아레이, 자체 정찰차를 만들다"
 ukraine_modernize_sov_equipment_brdm_2_modernization.6.desc: "미콜라이우가 만후스트 작업에 착수하는 동안, 육군과 국가방위군 자원자로 이루어진 엔지니어링 그룹 §Y아레이§!는 폐쇄된 키이우 공장에서 BRDM-2를 재제작하고 있습니다. 이들의 §YBKM 헤콘§!은 같은 역할을 목표로 합니다."
 ukraine_modernize_sov_equipment_brdm_2_modernization.6.a: "§YBRM 만후스트§!에 집중한다"
 ukraine_modernize_sov_equipment_brdm_2_modernization.6.b: "아레이와 그 §YBKM 헤콘§!을 지원한다"
 ukraine_modernize_sov_equipment_brdm_2_modernization.6.c: "두 시제품을 모두 기다린다"
 ukraine_modernize_sov_equipment_brdm_2_modernization.7.name: "BRM 만후스트 시제품 준비 완료"
 ukraine_modernize_sov_equipment_brdm_2_modernization.7.desc: "미콜라이우 공장이 §YBRM 만후스트§!를 공개했습니다. 엔진을 제외한 모든 구성품이 우크라이나제이며, 새 해치 덕분에 병력이 신속히 하차할 수 있고, 원격 무장 스테이션에는 14.5mm 기관총과 7.62mm 기관총이 탑재됩니다."
 ukraine_modernize_sov_equipment_brdm_2_modernization.7.a: "§YBRM 만후스트§!를 채택한다"
 ukraine_modernize_sov_equipment_brdm_2_modernization.8.name: "만후스트 또는 헤콘"
 ukraine_modernize_sov_equipment_brdm_2_modernization.8.desc: "두 시제품 모두 시험을 마쳤습니다. §YBRM 만후스트§!는 방호력이 잘 갖춰진 공장 생산품이고, §YBKM 헤콘§!은 병력 아홉 명을 태울 수 있으며 전선이 무엇을 필요로 하는지 아는 병사들이 설계했습니다."
 ukraine_modernize_sov_equipment_brdm_2_modernization.8.a: "§YBRM 만후스트§!를 채택한다"
 ukraine_modernize_sov_equipment_brdm_2_modernization.8.b: "§YBKM 헤콘§!을 채택한다"
 ukraine_modernize_sov_equipment_brdm_2_modernization.9.name: "BRDM-2T 시제품 준비 완료"
 ukraine_modernize_sov_equipment_brdm_2_modernization.9.desc: "§YNVK 테크임펙스§!가 §YBRDM-2T zr. 2012§!를 공개했습니다. GAZ-41 가솔린 엔진을 D-245 디젤 엔진으로 교체하여 화재 위험과 연료 소모를 줄였으며, 차체도 대대적인 정비를 거쳤습니다."
 ukraine_modernize_sov_equipment_brdm_2_modernization.9.a: "§YBRDM-2T zr. 2012§!를 채택한다"
