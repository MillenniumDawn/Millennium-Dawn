 inf_eq_gadjets_desc: "조준경, 개머리판, 손잡이 등 개인 및 분대 단위의 장비입니다"
 inf_eq_mortars: "박격포 개량"
 inf_eq_mortars_desc: "더 잘 갖춰진 탄약 보관, 더 나은 포탄, 더 다양한 포탄 종류 등을 포함합니다."
 inf_eq_heavy_weapons: "중화기"
 inf_eq_heavy_weapons_desc: "중기관총, 자동 유탄발사기, 대물 저격총 등입니다."
 inf_eq_cutting_corners: "원가 절감"
