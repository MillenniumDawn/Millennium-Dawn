l_korean:
 morocco.400.t: "카사블랑카 폭탄 테러"
 morocco.400.d: "오늘 이른 시각, 카사블랑카 시내 여러 장소에서 연쇄 폭탄 테러가 발생했습니다. 배낭에 폭탄을 숨긴 12명의 자살 폭탄 테러범들이 카사 데 에스파냐(Casa de España), 파라 호텔(Hotel Farah), 카사블랑카 유대인 연합회(Jewish Alliance of Casablanca), 그리고 벨기에 영사관과 옛 유대인 묘지 인근의 여러 장소에서 폭발을 일으켰습니다. 이번 공격으로 자살 폭탄 테러범 12명을 포함해 45명이 숨졌고, 최소 100명 이상의 민간인이 부상을 입었습니다. 국내에서 최근 살라피스트 설교자들의 부상이 이러한 원인으로 꼽히며, 이들 중 다수는 소련-아프가니스탄 전쟁 참전 용사들로서 시간이 흐를수록 더욱 급진화되어 온 것으로 추측됩니다. 모로코 이슬람 전투단(GICM)과 알카에다는 유대인 희생자가 단 한 명도 발생하지 않았음에도 불구하고, 시내의 유대인들을 표적으로 삼아 공격을 감행했다며 자신들의 소행이라고 선언했습니다. 일부 지역 단체들은 이번 사태가 도시 내에 이른바 \"판자촌\"이 급증하면서 도시와 모로코의 빈곤층 사이에서 급진화의 길이 열렸기 때문이라고 주장하고 있습니다."
 morocco.400.a: "비극적이군..."
 morocco.400.b: "장례 비용을 대주어야겠군."