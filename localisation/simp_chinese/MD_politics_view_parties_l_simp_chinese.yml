 PHI.Neutral_green: "£PHI_neutral_green (PROMDI) 推动自主权下放的进步运动"
 PHI.Neutral_green_icon: "£PHI_neutral_green"
 PHI.Neutral_green_desc: "中立绿党 - 进步权力下放运动倡导联邦制、政治权力下放、环境保护和菲律宾经济现代化。该党由前基督教穆斯林民主力量党成员组成，支持宪法改革、议会制政府和更大的区域自治权，以实现更具代表性的治理。\n"
