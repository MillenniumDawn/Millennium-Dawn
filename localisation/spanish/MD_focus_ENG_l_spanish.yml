 ENG_queen_elizabeth_class_carrier: "Portaaviones Clase Queen Elizabeth"
 ENG_queen_elizabeth_class_carrier_desc: "Los portaaviones de la Clase Queen Elizabeth fueron un punto culminante en la aviación naval británica, significando un salto transformador en la capacidad de los portaaviones. Estos colosos fortalecieron la proyección marítima del Reino Unido, encarnando la modernidad con su tecnología avanzada, capacidad de aeronaves y alcance operativo expansivo, afianzando el estatus de defensa global de la nación."
 ENG_elizabeth_line_decision: "Completar la Elizabeth Line"
 ENG_elizabeth_line_decision_desc: "Terminamos la Elizabeth Line a lo largo de Londres, conectando Heathrow, el West End, la City y Canary Wharf con trenes urbanos rápidos y frecuentes que reducen los tiempos de trayecto e impulsan la productividad."
 ENG_elizabeth_queen: "Isabel II"
 ENG_elizabeth_queen_trait: "Reina"
 ENG_elizabeth_queen_idea: "$ENG_elizabeth_queen_trait$"
 ENG_elizabeth_queen_charles_andrew: "$ENG_queen_eldest$"
 ENG_elizabeth_queen_anne_edward: "$ENG_queen_middle$"
 ENG_elizabeth_queen_philip_william: "$ENG_queen_youngest$"
 ENG_elizabeth_ruling_monarch: "§Y$ENG_elizabeth_queen$§! es la §Ymonarca reinante§! actual"
 ENG_typhoon_tranche_debate: "Debate sobre el Tranche 1 del Typhoon"
 ENG_typhoon_tranche_debate_desc: "El Debate sobre el Tranche 1 del Typhoon se refiere a discusiones y análisis en torno al Eurofighter Typhoon, un avión de combate multirrol versátil desarrollado por varias naciones europeas. Estos debates suelen profundizar en diversos aspectos del Typhoon, incluyendo su rendimiento, capacidades, relación calidad-precio y significado estratégico en la guerra aérea moderna."
 ENG_silicon_glenn: "Silicon Glen"
 ENG_silicon_glenn_tt: "§YImpulso tecnológico anual para $CAT_computing_tech$, $CAT_internet_tech$ o $CAT_ai$§!"
 ENG_operation_excellence_desc: "Nuestro ejército es una fuerza pequeña pero profesional y capaz, que puede ser desplegada rápidamente en el suelo nacional para proporcionar ayuda al poder civil y otros departamentos gubernamentales cuando sea necesario. Esta capacidad de seguridad nacional puede expandirse y apoyarse para mantener a Gran Bretaña a salvo."
 ENG_modern_littoral_force_desc: "La Fuerza Litoral Moderna Británica es una iniciativa estratégica que enfatiza las capacidades navales en regiones costeras. Liderada por el Reino Unido, esta fuerza modernizada integra tecnologías navales avanzadas, embarcaciones versátiles y capacidades de respuesta rápida para asegurar el dominio marítimo en entornos litorales. Con un enfoque en la agilidad y la adaptabilidad, la fuerza mejora la capacidad del Reino Unido para salvaguardar los intereses costeros, responder a las amenazas emergentes y contribuir a la estabilidad regional."
 ENG_trident_nuclear_program_desc: "El Programa Trident es el disuasivo nuclear continuo en el mar del Reino Unido, desplegando submarinos de la clase Vanguard con misiles balísticos Trident II D5. Esta iniciativa estratégica, gestionada en instalaciones en Aldermaston y Burghfield, subraya el compromiso de la nación con una capacidad de defensa ágil y potente."
 ENG_mothballing_operations: "Operaciones de Almacenamiento"
 ENG_mothballing_operations_desc: "En respuesta a las restricciones financieras, el Gobierno Británico elige la ruta pragmática de almacenar barcos navales, una decisión recibida con reservas por parte de la industria naval, en particular BAE. Destinada a conservar recursos, esta medida genera preocupaciones dentro de la industria sobre las posibles implicaciones para la producción y la fuerza laboral."
 ENG_modern_landing_craft_desc: "En su compromiso continuo de mejorar las capacidades navales, el Reino Unido ha buscado iniciativas de modernización, incluyendo inversiones en nuevas embarcaciones de desembarco. Alineado con el programa Future Commando Force, el Reino Unido busca fortalecer sus fuerzas anfibias, en particular los Royal Marines, asegurando una mayor efectividad en las operaciones litorales y anfibias."
 ENG_mechanised_amphibious_assault_desc: "Enfatizando la adaptabilidad y la velocidad, el Reino Unido traza una Doctrina de Asalto Anfibio Mecanizado integral. Anclada en la sinergia entre los Royal Marines y la Royal Navy, esta estrategia emplea Vehículos de Asalto Anfibio (AAV) especializados y embarcaciones de desembarco para un despliegue costero rápido. El mando y control integrados, el apoyo aéreo y el despliegue de barcos de asalto anfibio dedicados subrayan el compromiso del Reino Unido de mantener una fuerza formidable y versátil, asegurando la preparación para diversos escenarios a través de un entrenamiento y ejercicios rigurosos."
 ENG_strike_brigades_desc: "En respuesta a las amenazas evolucionarias, el Reino Unido establece las Brigadas de Ataque Británicas, unidades versátiles y de despliegue rápido diseñadas para operaciones terrestres ágiles. Compuestas por infantería, blindados y artillería, estas brigadas encarnan el compromiso de la nación con respuestas militares rápidas y adaptables. El enfoque en las Brigadas de Ataque mejora la capacidad del Reino Unido para proyectar poder y responder efectivamente a los desafíos de seguridad dinámicos y diversos."
 ENG_carrier_group_debate_desc: "Una parte vital de una marina moderna son las fuerzas de ataque de portaaeronaves. Necesitamos discutir cuál es la mejor manera de crearlas."
 ENG_mothballing_operations_idea: "Operaciones de reserva naval"
 ENG_mothballing_operations_idea_desc: "A medida que aumentan las presiones financieras, el gobierno británico se inclina por pasar buques de la armada a la reserva, una medida práctica que ha tenido una acogida dispar en la industria naval, especialmente por parte de BAE. Aunque su objetivo es la conservación de recursos, esta decisión despierta inquietud en el sector, ensombreciendo tanto la producción como las consideraciones relativas a la mano de obra."
 ENG_quality_over_quantity_desc: "Guiado por el principio de calidad sobre cantidad, el Reino Unido prioriza la excelencia y la superioridad tecnológica en sus fuerzas militares. Este espíritu nacional hace hincapié en la adquisición de equipos avanzados y sofisticados, garantizando una postura de defensa formidable y tecnológicamente avanzada. Al centrarse en la calidad, el Reino Unido pretende maximizar la eficacia de sus fuerzas, creando una ventaja estratégica frente a los desafíos modernos."
 ENG_mothballing_operations_idea_tt: "Mientras este espíritu nacional esté activo, §Rno§! se te permite seleccionar §Yenfoques nacionales navales§!."
 ENG_mothballing_operations_negative_opinion_tt: "Modifica la §Yopinión de la industria marítima§! en §R-20§! mientras se tenga este espíritu nacional."
 ENG_Space_Command: "Mando Espacial del Reino Unido"
 ENG_Space_Command_desc: "El Mando Espacial del Reino Unido es el líder de la defensa en operaciones espaciales, fuerza laboral espacial y capacidad espacial. Se trata de un mando conjunto, con sede en RAF High Wycombe, y cuenta con personal de la Marina Real, el Ejército Británico y la Real Fuerza Aérea, junto con funcionarios públicos y contratistas."
 ENG_Space_Command2_desc: "El Mando Espacial del Reino Unido es el líder de la defensa en operaciones espaciales, fuerza laboral espacial y capacidad espacial. Se trata de un mando conjunto, con sede en RAF High Wycombe, y cuenta con personal de la Marina Real, el Ejército Británico y la Real Fuerza Aérea, junto con funcionarios públicos y contratistas. Con el regreso de los famosos 'Casacas Rojas', la organización goza de una mayor moral y un renovado orgullo."
 ENG_british_spaceports_privatized: "Privatización de los puertos espaciales británicos"
 ENG_british_spaceports_privatized_desc: "El Reino Unido se adentra en una nueva frontera de la exploración espacial, privatizando los puertos espaciales para facilitar las actividades comerciales más allá de la Tierra. Estas instalaciones de gestión privada señalan un cambio hacia el fomento de la innovación y el apoyo a una floreciente industria espacial comercial en el Reino Unido."
 ENG_establish_asteroid_mining_network_mission: "Establecer Red de Minería de Asteroides"
 ENG_establish_asteroid_mining_network_mission_desc: "La Agencia Espacial del Reino Unido está desplegando plataformas orbitales y equipos de prospección para comenzar las operaciones de recursos fuera del mundo."
 ENG_asteroid_mining_light_operation: "Estudio de Prospección"
 ENG_asteroid_mining_light_operation_desc: "Una misión de estudio a pequeña escala despliega sondas robóticas para identificar asteroides cercanos a la Tierra viables para la extracción."
 ENG_asteroid_mining_medium_operation: "Misión de Extracción"
 ENG_asteroid_mining_medium_operation_desc: "Una misión de extracción dedicada se dirige a los depósitos de asteroides identificados, recuperando metales utilizables para la industria británica."
 ENG_asteroid_mining_heavy_operation: "Expedición Minera a Gran Escala"
 ENG_asteroid_mining_heavy_operation_desc: "Se lanza una operación industrial a gran escala hacia el cinturón de asteroides, movilizando los activos mineros orbitales más avanzados del Reino Unido."
 ENG_sovereign_capability_doctrine: "Doctrina de Capacidad Soberana"
 ENG_sovereign_capability_doctrine_desc: "Gran Bretaña se compromete a mantener una base industrial de defensa independiente y de espectro completo. Los costos de transición estructural imponen una carga a corto plazo en la producción civil mientras las fábricas se reequipan."
 ENG_consolidate_national_champions: "Consolidar Campeones Nacionales"
 ENG_consolidate_national_champions_desc: "BAE Systems, Rolls-Royce y Babcock son designados como anclas industriales estratégicas. Los contratos gubernamentales, la adquisición preferencial y la facilitación de exportaciones se dirigen hacia estas empresas."
 ENG_rolls_royce_raynesway_expansion: "Expansión de Rolls-Royce Raynesway"
 ENG_rolls_royce_raynesway_expansion_desc: "La instalación de Derby en Raynesway, que fabrica sistemas de propulsión nuclear para submarinos de la Royal Navy, recibe una importante inyección de capital. Dos nuevas fábricas de armas se ponen en línea en el East Midlands."
 ENG_barrow_strategic_shipyard: "Astillero Estratégico de Barrow"
 ENG_barrow_strategic_shipyard_desc: "El astillero de BAE Systems en Barrow-in-Furness es designado como un activo soberano protegido. Se añaden tres nuevos diques secos al complejo naval de Cumbria para asegurar la capacidad para la próxima clase de submarinos nucleares."
 ENG_combat_air_sovereignty: "Soberanía del Combate Aéreo"
 ENG_combat_air_sovereignty_desc: "El Programa Global de Combate Aéreo define la capacidad de combate aéreo futuro de Gran Bretaña. BAE Systems lidera la fase de diseño, con subvenciones de I+D respaldadas por el gobierno que aceleran la línea de tiempo de desarrollo de la plataforma."
 ENG_rolls_royce_aerospace_centre: "Centro Aeroespacial de Rolls-Royce"
 ENG_rolls_royce_aerospace_centre_desc: "Una nueva instalación de prueba y producción de motores se abre en Filton, Bristol, central para el desarrollo del sistema de propulsión de próxima generación para el programa GCAP."
 ENG_munitions_strategic_reserve: "Reserva Estratégica de Municiones"
 ENG_munitions_strategic_reserve_desc: "Una auditoría de existencias expuso carencias críticas en municiones de precisión. Se encargan dos nuevas líneas de producción para reconstruir las reservas operativas al nivel de la era de la Guerra Fría."
 ENG_land_systems_sovereignty: "Soberanía de Sistemas Terrestres"
 ENG_land_systems_sovereignty_desc: "Los programas Ajax y Challenger 3 definen el camino hacia la producción nacional completa de vehículos blindados. Se encarga una nueva instalación de armas para apoyar el cronograma de entrega del programa."
 ENG_skills_pipeline_apprenticeship_act: "Ley de Canal de Habilidades y Aprendizaje"
 ENG_skills_pipeline_apprenticeship_act_desc: "Un pacto industria-gobierno crea 50,000 aprendizajes de ingeniería de defensa, abordando la brecha de habilidades dejada por la contracción industrial posterior a la Guerra Fría. Dos instalaciones adicionales de producción de armas se abren a medida que crece la fuerza laboral."
 ENG_national_armaments_director: "Director Nacional de Armamento"
 ENG_national_armaments_director_desc: "Se crea el puesto de Director Nacional de Armamento dentro del Ministerio de Defensa para proporcionar supervisión estratégica de la base industrial soberana, coordinando la adquisición, las licencias de exportación y la interoperabilidad aliada."
 ENG_strategic_export_pact: "Pacto de Exportación Estratégica"
 ENG_strategic_export_pact_desc: "BAE Systems está autorizada para concluir acuerdos de exportación respaldados por el gobierno con Australia, Canadá, Japón e Italia. Los marcos AUKUS y Global Combat Air proporcionan la arquitectura diplomática."
 ENG_full_spectrum_industrial_base: "Base Industrial de Espectro Completo"
 ENG_full_spectrum_industrial_base_desc: "Gran Bretaña logra la autosuficiencia en los cinco pilares de la industria de defensa: submarinos, aeronaves de combate, vehículos blindados, municiones y armas de precisión. El complejo es formalmente designado como un activo nacional estratégico."
 ENG_lean_defence_posture: "Postura de Defensa Ágil"
 ENG_lean_defence_posture_desc: "El Ministerio de Defensa adopta un modelo de señal de demanda, reduciendo los compromisos industriales nacionales y aceptando una mayor dependencia de los proveedores aliados. Los ahorros del Tesoro fluyen de inmediato."
 ENG_value_for_money_review: "Revisión de Relación Calidad-Precio"
 ENG_value_for_money_review_desc: "La revisión de la Oficina Nacional de Auditoría sobre la adquisición del Ministerio de Defensa identifica sobrecostos sistemáticos. Una renegociación integral de los principales contratos reduce los costos unitarios y elimina programas duplicados."
 ENG_mothball_strategic_yards: "Almacenar Astilleros Estratégicos"
 ENG_mothball_strategic_yards_desc: "Tres instalaciones de astilleros de la Royal Navy se colocan en estado de mantenimiento reducido. El ahorro inmediato es sustancial, pero la capacidad de construcción naval no volverá sin una inversión futura significativa."
 ENG_cancel_legacy_programmes: "Cancelar Programas Heredados"
 ENG_cancel_legacy_programmes_desc: "El Nimrod MRA4, Sentinel R1 y sus sucesores son cancelados antes de la entrega. La decisión libera capital, pero abre una brecha de capacidad de vigilancia y patrulla marítima que tardará años en cerrarse."
 ENG_off_the_shelf_procurement: "Adquisición de Estantería"
 ENG_off_the_shelf_procurement_desc: "Gran Bretaña abandona el desarrollo personalizado a favor de plataformas extranjeras probadas. Este enfoque reduce los costos iniciales, pero disminuye el rendimiento industrial nacional y reduce la base de investigación."
 ENG_f35_partnership_deepening: "Profundización de la Asociación F-35"
 ENG_f35_partnership_deepening_desc: "El Reino Unido acelera su adquisición de F-35B a 48 aeronaves y profundiza la integración con la cadena de suministro del Joint Strike Fighter. Las empresas británicas suministran aproximadamente el 15 por ciento de cada aeronave producida."
 ENG_european_defence_cooperation: "Cooperación Europea de Defensa"
 ENG_european_defence_cooperation_desc: "Gran Bretaña vuelve a comprometerse con asociaciones bilaterales de capacidad con Francia, Alemania e Italia. La investigación conjunta reduce la redundancia, aunque la producción de armas nacionales disminuye a medida que aumenta la adquisición extranjera."
 ENG_smart_acquisition_reform: "Reforma de Adquisición Inteligente"
 ENG_smart_acquisition_reform_desc: "El Programa de Reforma de Adquisición de Defensa se implementa en su totalidad. El análisis de inversión inicial y la modelación de costos a lo largo de la vida útil se vuelven obligatorios, reduciendo las costosas modificaciones en etapas tardías."
 ENG_dual_use_innovation: "Innovación de Doble Uso"
 ENG_dual_use_innovation_desc: "Se formalizan los mecanismos de transferencia de tecnología defensa-civil, con empresas de electrónica y comunicaciones que contribuyen a los programas militares de C4ISR. Se liberan dos rondas de subvenciones para investigación en electrónica."
 ENG_naval_squeeze_efficiency: "Eficiencia de Compresión Naval"
 ENG_naval_squeeze_efficiency_desc: "La Dirección de Preparación de la Flota consolida los ciclos de mantenimiento en Rosyth, utilizando herramientas y grupos de trabajo compartidos para reducir el costo por mes de casco. Una nueva instalación de astillero se abre para absorber la carga de trabajo consolidada."
 ENG_minimum_viable_industrial_base: "Base Industrial Mínima Viable"
 ENG_minimum_viable_industrial_base_desc: "Gran Bretaña define el piso irreducible de capacidad de producción soberana. Por debajo de este piso, no se permiten más recortes. Este compromiso estabiliza las expectativas de la industria y calma el descontento laboral."
 ENG_strategic_reliance_doctrine: "Doctrina de Dependencia Estratégica"
 ENG_strategic_reliance_doctrine_desc: "El Consejo de Seguridad Nacional concluye que la dependencia de los aliados, principalmente de los Estados Unidos, es la postura más rentable para una economía de tamaño medio. Los términos de préstamo y arrendamiento se mejoran permanentemente."
 ENG_industrial_realignment_idea: "Realineación Industrial de Defensa"
 ENG_industrial_realignment_idea_desc: "Los recursos se están redirigiendo de las líneas de producción civiles a las de defensa. Las fábricas que se reequipan para programas de armas soberanas reducen temporalmente la producción civil."
 ENG_capability_gap_idea: "Brecha de Capacidad"
 ENG_capability_gap_idea_desc: "La cancelación de programas heredados ha dejado a las fuerzas armadas sin sistemas de reemplazo. La preparación operativa se reduce hasta que se completen las nuevas adquisiciones."
 ENG_p125_revival: "Reactivación del programa P.125"
 ENG_p125_revival_desc: "La reactivación del proyecto P.125 ha revitalizado la fabricación nacional de cazas, reduciendo el coste de producción de aviones ligeros mientras el programa madura."
