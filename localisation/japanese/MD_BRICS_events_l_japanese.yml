l_japanese:
 brics_join.1.t: "[FROM.GetNameDef]がBRICSへの加盟を求めている"
 brics_join.1.d: "[FROM.GetNameDef]はBRICSへの加盟を正式に申請した。同ブロックの盟主として、加盟を承認するかどうかは我々次第だ。"
 brics_join.1.a: "彼らはこのブロックを強化する。受け入れよう。"
 brics_join.1.b: "彼らの加盟は何の役にも立たない。"
 brics_join.2.t: "申請が受理された"
 brics_join.2.d: "BRICSは加盟申請を承認した。我が国は同ブロックの加盟国の一員となった。"
 brics_join.2.a: "これでBRICSの一員だ"
 brics_join.3.t: "BRICS加盟申請が却下された"
 brics_join.3.d: "BRICSの盟主は我々の申請を却下した。だが扉は永遠に閉ざされたわけではない。時期を見て改めて申し入れを行おう。"
 brics_join.3.a: "後ほど再度申請しよう"
 brics_join.3.b: "加入を断念しよう"
 brics_join.4.t: "[ROOT.GetNameDef]がBRICSに加盟した"
 brics_join.4.d: "[ROOT.GetNameDef]がBRICSに加盟し、同ブロックの国際秩序における影響力と存在感が拡大した。"
 brics_join.4.a: "変化するバランス"
 brics_join.5.t: "BRICSに再び加盟申請すべき時"
 brics_join.5.d: "前回の却下から時間は十分に経過した。BRICSに新たな申請を提出しようか？"
 brics_join.5.a: "申請を再提出する"
 brics_join.5.b: "まだだ"
 brics_join.6.t: "[FROM.GetNameDef]がBRICSの設立を呼びかける"
 brics_join.6.d: "[FROM.GetNameDef]はBRICSの設立を進めており、我々に創設国家の一員として加わり、このブロックの形成に初期段階から携わるよう要請してした。"
 brics_join.6.a: "BRICS設立を支援しよう"
 brics_join.6.b: "我々は距離を保つ"