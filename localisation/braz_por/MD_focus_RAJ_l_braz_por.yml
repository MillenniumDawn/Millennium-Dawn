 RAJ_brics_invite_associate_member:0 "Convidar [FROM.GetName] como Membro Associado"
 RAJ_brics_invite_associate_member_desc:0 "[FROM.GetName] pode se qualificar para a adesão como associado, fortalecendo o alcance global do BRICS por meio de maior cooperação econômica."
 RAJ_brics_invite_observer:0 "Convidar [FROM.GetName] como Observador"
 RAJ_brics_invite_observer_desc:0 "[FROM.GetName] pode se qualificar para o status de observador, podendo participar das discussões e dos grupos de trabalho do BRICS."
 RAJ_brics_promote_to_associate:0 "Promover [FROM.GetName] a Associado"
 RAJ_brics_promote_to_associate_desc:0 "Elevar [FROM.GetName] de observador a membro associado, concedendo maiores direitos de cooperação econômica."
