l_spanish:
 TAI_legacy_of_1949: "Legacy of 1949"
 TAI_legacy_of_1949_desc: "The end of the Chinese Civil War in 1949 saw the Nationalist Guomindang (KMT) and their supporters flee to the island province of Taiwan. The legacy of this event, combined with a local, nativist Taiwanese movement has led to a strong rejection of reunification with the mainland by the majority of Taiwanese citizens."
 TAI_the_great_chip_empire: "The Great Chip Empire"
 TAI_the_great_chip_empire_desc: "Having taken advantage of semiconductor and microchip production in it's infancy, and by being a more attractive investment than other nations. Taiwan has catapulted itself to the forefront of the industry. Though cheap, efficient production, and large exports to western nations, Taiwan has balanced its economy and national security on being the supply of microchips to the western world, and continues to be an industry leader through constant and regular innovation."
 TAI_flight_crew_strike: "Taoyuan Flight Attendants Union strike"
 TAI_flight_crew_strike_desc: "No results! No stopping!"
 USA_tsmc_access_modifier: "Access to TSMC"
 USA_tsmc_access_modifier_desc: "American industry benefits from dependable access to Taiwan's semiconductor ecosystem. The benefit is suspended if Taiwan ceases to exist, loses control of Taipei, goes to war with the United States, or restricts semiconductor exports."
 TAI_tsmc_trade_benefits_tier_1_tt: "TSMC development increases §YResources per Factory§! to §G+1§! for §YTaiwan§! and the §YUnited States§!. The American benefit requires continued access to Taiwan."
 TAI_tsmc_trade_benefits_tier_2_tt: "TSMC development increases §YResources per Factory§! to §G+2§! for §YTaiwan§! and the §YUnited States§!. The American benefit requires continued access to Taiwan."
 TAI_tsmc_trade_benefits_tier_3_tt: "TSMC development increases §YResources per Factory§! to §G+3§! for §YTaiwan§! and the §YUnited States§!. The American benefit requires continued access to Taiwan."
 TAI_foxconn_ev_pipeline: "EV Pipeline Without Volume"
 TAI_foxconn_ev_pipeline_desc: "Reference vehicles and partner programs create engineering options, but validated products and solvent customers remain scarce. Capital is committed before dependable volume arrives."
 TAI_foxconn_factory_behind_brand: "The Factory Behind the Brand"
 TAI_foxconn_factory_behind_brand_desc: "Hon Hai/Foxconn turns customer designs into repeatable production through tooling, procurement, process engineering, testing, and logistics. Its enormous throughput remains constrained by thin margins and powerful clients."
 TAI_foxconn_factory_city_production: "Factory-City Production"
 TAI_foxconn_factory_city_production_desc: "Dense supplier networks, dormitories, transport, and industrial services permit rapid production ramps. Concentrating work and daily life inside a few campuses also magnifies labor and disruption risks."
 TAI_foxconn_resilient_manufacturing_network: "Resilient Manufacturing Network"
 TAI_foxconn_resilient_manufacturing_network_desc: "A Build, Operate, Localize network connects qualified regional hubs while retaining valuable mainland capacity. Redundancy improves market access and crisis recovery at a permanent coordination cost."
 taiwan.300.a: "Build the densest mainland network"
 taiwan.300.a_bonus: "Mainland Assembly Network"
 taiwan.300.b: "Chase our own brand instead of building for others"
 taiwan.300.d: "By 2000, Taiwan-based Hon Hai/Foxconn has become an established electronics manufacturer with a rapidly expanding mainland production system. Management must decide whether to keep building at scale for other people's brands, or spend the same capital trying to establish one of its own."
 taiwan.300.t: "The Factory Behind the Brand"
 taiwan.301.a: "Raise standards and automate carefully"
 taiwan.301.a_bonus: "Automated Assembly Lines"
 taiwan.301.b: "Hold the line on costs and move production inland"
 taiwan.301.d: "A cluster of worker deaths and reports of distress has brought scrutiny to working hours, compensation, safety, and life inside the factory-city system. The causes are contested, but the need for an institutional response is not."
 taiwan.301.t: "The Shenzhen Labor Crisis"
 taiwan.302.a: "Concentrate the launch system in Zhengzhou"
 taiwan.302.a_bonus: "Concentrated Launch Capacity"
 taiwan.302.b: "Build several inland production nodes"
 taiwan.302.d: "Zhengzhou offers infrastructure, recruitment support, and enough space for an immense inland production campus. The project can create extraordinary launch capacity while deepening dependence on one customer, place, and policy environment."
 taiwan.302.t: "iPhone City"
 taiwan.303.a: "Lead the Sharp recapitalization"
 taiwan.303.a_bonus: "Display Panel Engineering"
 taiwan.303.b: "Preserve a strategic partnership"
 taiwan.303.d: "Sharp needs a recapitalization partner, while Foxconn wants display expertise, engineers, and a closer component relationship. Control would bring a difficult Japanese turnaround rather than an instant transfer of technology."
 taiwan.303.t: "Sharp at the Brink"
 taiwan.304.a: "Commit to the Wisconsin project"
 taiwan.304.a_bonus: "Overseas Plant Construction"
 taiwan.304.b: "Reduce the project before construction"
 taiwan.304.d: "Washington has answered Foxconn's proposal. The company must now decide whether the available support justifies the full commitment, or whether the project should be cut back before ground is broken."
 taiwan.304.t: "The Wisconsin Commitment"
 taiwan.305.a: "A manufacturing network no single shock can break"
 taiwan.305.b: "A supplier for the electric vehicle era"
 taiwan.305.c: "A factory city built around one product launch"
 taiwan.305.e: "The factory behind everyone else's brand"
 taiwan.305.d: "Complete AI racks combine boards, accelerators, power, cooling, cables, and exacting system validation. A quarter century of scale, crisis, and diversification has already decided which kind of manufacturer arrives at that work."
 taiwan.305.t: "The AI Factory"
 taiwan.310.t: "Twelve Inches Through the Crash"
 taiwan.310.d: "The semiconductor collapse has emptied cleanrooms that cost billions to build, and a fab earns nothing while it is idle. The 300 mm transition would cut the cost of every wafer, but only after years of tools, integration and patient yield work. Building it now means building it into a market that has stopped buying."
 taiwan.310.a: "Fund the 300 mm ramp through the downturn"
 taiwan.310.a_bonus: "Large Wafer Process Integration"
 taiwan.310.b: "Preserve cash until demand returns"
 taiwan.310.b_bonus: "Foundry Capital Discipline"
 taiwan.311.t: "Blueprints Without Betrayal"
 taiwan.311.d: "Customers need design kits, libraries, tools and qualification data to build anything on our process, and every one of them competes with the others. The Open Innovation Platform would hand all of them the same materials without handing any of them a rival's design. Trust is the product being manufactured here."
 taiwan.311.a: "Publish the kits and open the platform"
 taiwan.311.a_bonus: "Open Innovation Platform"
 taiwan.311.b: "Keep every customer engagement bilateral"
 taiwan.311.b_bonus: "Confidential Customer Engineering"
 taiwan.312.t: "The Mobile Anchor"
 taiwan.312.d: "A single handset maker wants more leading-edge capacity than most of our customers combined, and will pay to reserve it years ahead. That volume would fund the next node on its own. It would also make the foundry's fortunes turn on one company's product cycle."
 taiwan.312.a: "Reserve leading capacity for the anchor customer"
 taiwan.312.a_bonus: "High Volume Mobile Process"
 taiwan.312.b: "Hold the line on foundry neutrality"
 taiwan.312.b_bonus: "Neutral Capacity Allocation"
 taiwan.313.t: "Arizona: Insurance at a Price"
 taiwan.313.d: "Washington wants leading-edge wafers made on American soil and is willing to help pay for them. An announcement is not a fab: the tools, the engineers, the water and the customers all have to arrive before a single qualified wafer does, and every one of them costs more there than here. The insurance is real, and so is the premium."
 taiwan.313.a: "Commit to the overseas fabs"
 taiwan.313.a_bonus: "Overseas Fab Qualification"
 taiwan.313.b: "Keep the leading edge on the island"
 taiwan.313.b_bonus: "Concentrated Cluster Efficiency"
 taiwan.314.t: "Chips Are the Bottleneck"
 taiwan.314.d: "Carmakers, consumer brands and computing customers are all bidding for output that does not exist, and their governments have started making the calls themselves. Letting the state set allocation would buy considerable goodwill in capitals that matter. It would also tell every customer that a queue they cannot see now decides their place in it."
 taiwan.314.a: "Let the state direct allocation"
 taiwan.314.a_bonus: "Directed Industrial Allocation"
 taiwan.314.b: "Keep allocation commercial"
 taiwan.314.b_bonus: "Commercial Allocation Discipline"
 taiwan.315.t: "The CoWoS Constraint"
 taiwan.315.d: "The wafer is no longer the hard part. Accelerators need advanced packaging, stacked memory and substrates before they are worth anything, and there is nowhere near enough of it. Building that capacity turns a wafer foundry into something larger, and puts us into businesses our own customers currently occupy."
 taiwan.315.a: "Build advanced packaging into a business"
 taiwan.315.a_bonus: "Advanced Packaging Capacity"
 taiwan.315.b: "Stay a pure wafer foundry"
 taiwan.315.b_bonus: "Pure Play Wafer Focus"
 taiwan.316.t: "What Kind of Foundry Have We Built?"
 taiwan.316.d: "Twenty five years of nodes, downturns, anchor customers and overseas groundbreakings have settled what the island actually manufactures, and who decides where it goes."
 taiwan.316.a: "A foundry the state directs"
 taiwan.316.b: "A trusted allied network"
 taiwan.316.c: "A systems foundry, not a wafer shop"
 taiwan.316.e: "A pure play foundry, and nothing else"
 TAI_tsmc_state_directed_foundry: "State Directed Foundry"
 TAI_tsmc_state_directed_foundry_desc: "Allocation runs through the ministry before it runs through the sales office, and the queue is a matter of policy. Capacity answers to the island's interests first and its customers second, and the customers have noticed."
 TAI_tsmc_trusted_allied_foundry_network: "Trusted Allied Foundry Network"
 TAI_tsmc_trusted_allied_foundry_network_desc: "Arizona, Kumamoto and Dresden qualified and ran, so the leading edge is no longer a single point on a single island. It costs more per wafer than concentrating everything at home, and it buys something concentration never could."
 TAI_tsmc_systems_foundry_platform: "Systems Foundry Platform"
 TAI_tsmc_systems_foundry_platform_desc: "Wafers, packaging, stacked memory and test now leave as one qualified product. The foundry sells the finished capability rather than the layer underneath it, which is where the constraint had moved anyway."
 TAI_tsmc_disciplined_pure_play_foundry: "Disciplined Pure Play Foundry"
 TAI_tsmc_disciplined_pure_play_foundry_desc: "No brands, no products, no competing with the people who buy from us. The discipline that made the model work is the model, and it has been kept exactly as it was."
 taiwan.320.t: "Acer Divides Brand from Factory"
 taiwan.320.d: "Building other companies' computers and selling your own into the same shelves is a conflict customers can read on an invoice. Splitting the manufacturing out would let each half chase business the other half cost it. It also cuts the company in two at the moment it is finally large."
 taiwan.320.a: "Split the brand from the factory"
 taiwan.320.a_bonus: "Contract Manufacturing Separation"
 taiwan.320.b: "Keep one integrated manufacturer"
 taiwan.320.b_bonus: "Integrated Systems Manufacturing"
 taiwan.321.t: "The x86 Question Settles"
 taiwan.321.d: "Years of litigation over instruction sets and chipsets end in a cross licence rather than a courtroom victory. The terms secure the right to keep building, on conditions written by the incumbent. A third x86 vendor remains legally possible and commercially unlikely."
 taiwan.321.a: "Settle and secure the licence"
 taiwan.321.a_bonus: "Cross Licensed Architecture"
 taiwan.321.b: "Hold out for better terms"
 taiwan.321.b_bonus: "Independent Chipset Design"
 taiwan.322.t: "A Republic of Gamers"
 taiwan.322.d: "Component buyers who choose their own motherboards will pay a premium for parts that announce themselves. A dedicated premium line would earn margins the commodity business never sees, and it demands marketing, support and design that a component supplier has never had to do."
 taiwan.322.a: "Build the premium brand"
 taiwan.322.a_bonus: "Premium Systems Branding"
 taiwan.322.b: "Stay a component supplier"
 taiwan.322.b_bonus: "Commodity Component Scale"
 taiwan.323.t: "The Second Separation"
 taiwan.323.d: "The same conflict that split Acer now splits its rival: the brand cannot grow while the factory serves the brand's competitors. Spinning out the manufacturing arm creates one of the largest contract manufacturers on earth. It also gives away the factory that made the brand possible."
 taiwan.323.a: "Spin out the manufacturing arm"
 taiwan.323.a_bonus: "Original Design Manufacturing"
 taiwan.323.b: "Keep brand and factory together"
 taiwan.323.b_bonus: "Vertically Integrated Assembly"
 taiwan.324.t: "A Small PC for Everyone"
 taiwan.324.d: "A cheap, light, underpowered laptop has become the fastest selling category in computing, and every Taiwanese maker can build one by the weekend. The margins are terrible and the volumes are enormous. Whether this is the future of the industry or a fad that trains customers to expect nothing is not yet clear."
 taiwan.324.a: "Chase the mobile transition"
 taiwan.324.a_bonus: "Low Cost Mobile Platforms"
 taiwan.324.b: "Defend the desktop margins"
 taiwan.324.b_bonus: "Desktop Performance Systems"
 taiwan.325.t: "The Margin Squeeze"
 taiwan.325.d: "Phones took the volume, the brands took the shelf space, and the island's makers are competing with each other for what is left of a shrinking market. Coordinating the industry from above would stop them undercutting one another. It would also mean deciding, in a ministry, which of them deserves to survive."
 taiwan.325.a: "Coordinate the industry from above"
 taiwan.325.a_bonus: "Coordinated Industrial Policy"
 taiwan.325.b: "Let the market consolidate it"
 taiwan.325.b_bonus: "Competitive Consolidation"
 taiwan.326.t: "Taiwan's Computing Ecosystem Assessed"
 taiwan.326.d: "A quarter century of splits, spinouts, premium brands and price wars has settled what the island's computer industry is: whose name is on the box, and whose factory is behind it."
 taiwan.326.a: "A full spectrum computing ecosystem"
 taiwan.326.b: "A branded systems powerhouse"
 taiwan.326.c: "A global component commonwealth"
 taiwan.326.e: "A margin squeeze nobody escaped"
 TAI_pc_full_spectrum_computing_ecosystem: "Full Spectrum Computing Ecosystem"
 TAI_pc_full_spectrum_computing_ecosystem_desc: "Components, contract manufacturing and finished brands were kept in one coordinated industry rather than left to cut each other apart. The island builds every layer of a computer and decides between them deliberately."
 TAI_pc_branded_systems_powerhouse: "Branded Systems Powerhouse"
 TAI_pc_branded_systems_powerhouse_desc: "The names on the boxes are Taiwanese and they command a premium, which is a position no component supplier ever holds. Brands are held by attention, and attention is rented rather than owned."
 TAI_pc_global_component_commonwealth: "Global Component Commonwealth"
 TAI_pc_global_component_commonwealth_desc: "Nearly every computer sold anywhere contains parts built here, under someone else's name. The volumes are extraordinary and the margins belong to whoever puts the badge on."
 TAI_pc_fragmented_margin_squeeze: "Fragmented Margin Squeeze"
 TAI_pc_fragmented_margin_squeeze_desc: "Too many capable firms chased the same shrinking market and undercut each other the whole way down. The engineering never stopped being good; the pricing never stopped falling."