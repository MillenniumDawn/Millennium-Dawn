 SIA_bhumjaithai_coalition: "£SIA_Neutral_conservatism_1 §Y(BJT) — партия «Бхумджайтай»§! обладает решающим голосом."
 SIA_tt_shan_militia_support: "Требуется поддержка ополчения шан на уровне не менее 60."
 SIA_tt_reform_pressure: "Требуется давление на проведение реформ выше 20%."
 SIA_tt_populist_tide_20: "Для этого требуется, чтобы волна популизма превысила 20%."
 SIA_tt_palace_bargain_support: "Для принятия закона необходимо, чтобы роялистский блок «Дом Махидол» набрал более 15 процентов голосов."
 SIA_tt_china_contracts_renegotiated: "Китайские контракты еще не были пересмотрены."
 SIA_tt_us_security_reviewed: "Обзор отношений в сфере безопасности между США и Таиландом еще не завершен."
 SIA_tt_tax_modernized: "Система сбора налогов до сих пор не модернизирована."
 SIA_tt_gripen_ef_contracted: "Контракт на поставку Gripen E/F еще не подписан."
 SIA_the_quiet_word: "Тихое Слово"
 SIA_the_quiet_word_desc: "Звонок из нужного кабинета делает то, что раньше делали танки. Сеть ясно даёт понять, чьё это на самом деле правительство, и сообщение доходит без единого выстрела. Выборы остаются, бюллетени считают — а страна всё равно сдвигается к дворцу."
 SIA_judicial_review_route: "Управление посредством судебного запрета"
 SIA_judicial_review_route_desc: "Конституционный суд находит формальность, и правящая партия распускается в одночасье. Ни казарм, ни комендантского часа, только вердикт и очень тихая передача власти."
 SIA_the_appointed_senate: "Верхняя камера, отобранная вручную"
 SIA_the_appointed_senate_desc: "Двести пятьдесят мест, которые никогда не будут замещены ни одним голосованием, заполняются сетью и подотчетны только ей. Теперь каждое правительство управляет страной по усмотрению Сената."
 SIA_coalition_kingmakers: "«Создатели королей коалиции»"
 SIA_coalition_kingmakers_desc: "Кабинетные должности, бюджетные ассигнования и деликатное обращение к влиятельным политическим деятелям формируют правительство, которое подотчетно дворцовой сети прежде, чем избирателям."
 SIA_constitutional_engineering: "Разработка Хартии"
 SIA_constitutional_engineering_desc: "Новая конституция, разработанная в комитетах, а не под дулом пистолета, закрепляет преимущества сети в основном законе страны. Ни для чего из этого не потребовался ни один солдат."
 SIA_the_establishment_consensus: "Консенсус истеблишмента"
 SIA_the_establishment_consensus_desc: "Суды, сенат, армия и бизнес теперь действуют как единое целое, а выборы стали формальностью, в которой побеждает любая сеть. Никому не пришлось вызывать танки."
 SIA_judicial_review_route_choice_tt: "Выберите, насколько далеко распространяется действие решения Конституционного суда.\n - §YПолный роспуск§!: подрывает популярность партии, но усиливает давление на проведение реформ.\n - §YУзкое техническое решение§!: стоит дешевле"
 SIA_coalition_kingmakers_choice_tt: "Выберите партнера по коалиции.\n - §YПровинциальные влиятельные лица§!: подкуплены казной\n - §YБизнес-элита§!: привлечена ценой небольших потерь для стабильности"
 SIA_royalist_no_coup_path: "Приверженность роялистскому пути, исключающему государственные перевороты (сетевая монархия)."
 SIA_establishment_category: "Управление предприятием"
 SIA_establishment_category_desc: "Инструменты сетевой монархии, которой никогда не требовался переворот: назначаемый сенат, коллегиальная коллегия и собственные каналы убеждения дворца."
 SIA_senate_procedural_vote: "Провести процедурное голосование"
 SIA_senate_procedural_vote_desc: "Принудительно заставить назначенную палату подчиниться законопроекту, который избранная палата никогда бы не приняла. Это требует политического капитала, но исход голосования никогда не вызывает сомнений. §GСтабильность повышается.§!"
 SIA_court_referral: "Передать дело в суд"
 SIA_court_referral_desc: "Передайте последнюю уловку популистов на рассмотрение сочувствующей им судебной коллегии, и пусть решение суда сделает то, что не могут сделать выборы. §RПопулярность правящей партии падает, но чем чаще используется эта тактика, тем сильнее она подпитывает давление в сторону реформ.§!"
 SIA_palace_audience: "Запросить аудиенцию во дворце"
 SIA_palace_audience_desc: "Официальная встреча позволяет армии и старым землевладельческим семьям убедиться, что сеть по-прежнему представляет их интересы. §GУлучшается отношение к военным и землевладельцам.§!"
 thailand.434.t: "Постановление суда"
 thailand.434.d: "Конституционный суд выносит вердикт по поводу действий правящей партии. Всем в зале суда уже известно, чем всё закончится."
 thailand.434.a: "Полностью распустить партию"
 thailand.434.b: "Сузить круг возможных решений до формального момента."
 thailand.435.t: "Сделка создателей королей"
 thailand.435.d: "Для формирования правительства, с которым сеть сможет смириться, необходимо кому-то заплатить. Вопрос лишь в том, кому и в какой валюте."
 thailand.435.a: "Подкупите провинциальных боссов"
 thailand.435.b: "Заигрывайте с деловой элитой"
 SIA_no_lar_dlc_tt: "Для полноценной работы механики разведывательного агентства требуется дополнение La Resistance. Вместо этого предоставляется политическая власть."
 SIA_the_national_intelligence: "Национальное разведывательное агентство"
 SIA_the_national_intelligence_desc: "Теперь единое Национальное разведывательное агентство возвышается над полицией, армией и гражданскими службами, которые раньше конкурировали за одну и ту же информацию. Его создание обходится дорого, а поглощенные им агентства не уступают свою территорию без борьбы."
 SIA_special_branch_police: "Специальное отделение"
 SIA_special_branch_police_desc: "Создание специализированного политического и контртеррористического подразделения полиции позволяет государству более пристально следить за подрывной деятельностью и беспорядками. Сотрудники ожидают, что финансирование будет соответствовать поставленным задачам, и это ожидание сохраняется и после создания подразделения."
 SIA_counter_insurgency_south: "Южный пожар"
 SIA_counter_insurgency_south_desc: "Разведывательные силы перебрасываются на юг, к очагам повстанческого движения в Паттани, Яле и Наратхивате, выслеживая сети, которые армия в одиночку никогда не смогла бы составить. Жесткие меры позволяют отвоевать позиции у боевиков, но требуют от жителей провинции терпения."
 SIA_signals_intelligence: "Слушающее государство"
 SIA_signals_intelligence_desc: "Подразделение, занимающееся сигнальной и криптографической экспертизой, обеспечивает Таиланду доступ к радиоволнам и сетям региона. Взломщики кодов и серверные фермы — это постоянные расходы, которые никогда не прекращаются."
 SIA_humint_networks: "Мужчины в поле"
 SIA_humint_networks_desc: "Оперативные сотрудники и платные информаторы создают сеть контактов за пределами национальных границ, которую не заменит ни один спутник. Вербовка и управление агентами таким образом — дорогостоящая и не самая привлекательная работа, которая оплачивается политическим капиталом, а не помпезностью."
 SIA_cia_partnership: "Связь с Лэнгли"
 SIA_cia_partnership_desc: "Официальный канал связи с Центральным разведывательным управлением предоставляет доступ и обучение в обмен на попытку сблизиться с Вашингтоном. Каждый канал связи, идущий в Лэнгли, — это канал, который Лэнгли может читать в обе стороны."
 SIA_mss_cooperation: "Рукопожатие Гоаньбу"
 SIA_mss_cooperation_desc: "Скрытый канал связи с Министерством государственной безопасности Китая предполагает обмен сотрудничества на сближение с Пекином. Эти отношения углубляют китайско-тайские связи, но несут в себе ту же двустороннюю уязвимость, что и любые зарубежные контакты."
 SIA_the_watchful_state: "Бдительное государство"
 SIA_the_watchful_state_desc: "Внутренняя полицейская деятельность и внешняя разведка объединены в единый постоянно действующий аппарат безопасности, сфера его действия расширена за счет модернизации ведомств и найма новых сотрудников на местах. Поддержание всей системы в рабочем состоянии теперь является постоянной статьей бюджета."
 SIA_surveillance_state: "Паноптикум"
 SIA_surveillance_state_desc: "Мандат агентства исчерпан до предела, возможности обнаружения и защиты подняты настолько высоко, насколько позволяет закон, и даже немного выше. Бизнес не выдерживает пристального внимания, казначейство теряет политический капитал, а стабильность покрывает разницу."
 SIA_accountable_oversight: "Верховенство права"
 SIA_accountable_oversight_desc: "Судебный контроль, парламентский надзор и требования к публичной отчетности возложены на это ведомство, в результате чего грубая сила выявления нарушений обменивается на легитимность и снижение уровня коррупции. Служба работает медленнее и менее всеведуща, но она подотчетна кому-то, помимо себя самой."
 SIA_national_intelligence_idea: "Доктрина национальной разведки"
 SIA_national_intelligence_idea_desc: "Основной принцип нового агентства распространяется по всей бюрократии: информация — это сила, и каждое министерство теперь передает ее вышестоящему руководству. Привычка наблюдать сохраняется независимо от того, какое правительство находится у власти."
 SIA_territorial_defense: "Доктрина национальной обороны"
 SIA_territorial_defense_desc: "Солдат Королевства учат удерживать позиции, а не преследовать противника. Подразделения окапываются, инженеры обследуют границу для строительства постоянных укреплений, и в вооруженных силах внедряется оборонительная доктрина, укрепляющая пехоту и ускоряющая темпы строительства укреплений еще до первого выстрела."
 SIA_shorad_defense: "ПВО ближнего действия"
 SIA_shorad_defense_desc: "Ракеты малой дальности, орудия с радиолокационным наведением и укрепленные зенитные установки образуют единый, перекрывающийся щит. Вражеские самолеты, пролетающие над тайским небом, обнаруживают, что все подходы уже находятся на заданной дистанции, а каждая батарея готова к ответному удару."
 SIA_border_fortification_program: "Программа укрепления границы"
 SIA_border_fortification_program_desc: "Инженерному корпусу поручают постоянный мандат и постоянный бюджет: проводить топографическую съемку, заливку бетона и укрепление позиций вдоль всей границы, включая длинную и слабо контролируемую границу с Лаосом, чтобы новые укрепления возводились быстрее, а окопавшиеся войска могли крепче удерживать позиции там, где это необходимо."
 SIA_anti_amphibious_command: "Противодесантное командование"
 SIA_anti_amphibious_command_desc: "Специально созданное командование изучает каждый пляж и устье реки, которые может использовать захватчик. Береговые батареи, многоуровневые датчики и отлаженные силы быстрого реагирования превращают высадку на берега Королевства в кровавую и рискованную авантюру."
 SIA_defend_myanmar_border: "Укрепить границу с Мьянмой"
 SIA_defend_myanmar_border_desc: "Извилистая западная граница с Мьянмой тянется вдоль всего королевства. В перевалах и речных долинах вырыты бункерные линии и подготовленные позиции, превращая труднопроходимую местность в неприступную стену."
 SIA_defend_cambodia_border: "Укрепить камбоджийскую границу"
 SIA_defend_cambodia_border_desc: "Воспоминания о столкновениях в Преах-Вихеаре еще свежи. Восточная граница укреплена новыми сооружениями, чтобы в будущем солдаты Королевства не оказались под открытым небом во время каких-либо конфликтов."
 SIA_defend_malaysia_border: "Укрепить малазийскую границу"
 SIA_defend_malaysia_border_desc: "Неспокойный южный регион испещрен бункерами и опорными пунктами, которые служат опорой для границы с Малайзией и предоставляют гарнизонам Паттани твердую почву для отступления."
 SIA_fortress_thailand: "Крепость Таиланд"
 SIA_fortress_thailand_desc: "Каждая граница огорожена стенами, каждый подход осуществляется дистанционно. Сражаясь на родной земле, тайские формирования наносят удары и удерживают позиции с уверенностью защитника, знающего местность. Захватчик истекает кровью в жаре, на холмах и в бесконечных выстроенных линиях."
 SIA_defend_myanmar_border_tt: "Строки §YУровень 2§! наземные форты в §Y9§! приграничные провинции, немедленно.\n - §YСеверный Таиланд§!: 4 провинции\n - §YЦентральный Таиланд§!: 2 провинции\n - §YЮжный Таиланд§!: 3 провинции"
 SIA_defend_cambodia_border_tt: "Строки §YУровень 2§! наземные форты в §Y6§! приграничные провинции, немедленно.\n - §YЦентральный Таиланд§!: 3 провинции\n - §YИсаан§!: 3 провинции"
 SIA_defend_malaysia_border_tt: "Строки §YУровень 2§! наземные форты в §Y5§! приграничные провинции, немедленно.\n - §YПаттани§!: 4 провинции\n - §YЮжный Таиланд§!: 1 провинция"
 SIA_sovereign_wealth_fund_allocation: "Распределить средства из Суверенного фонда благосостояния"
 SIA_sovereign_wealth_fund_allocation_desc: "Направьте еще один транш отчислений от добычи полезных ископаемых в зарубежный портфель суверенного фонда. Это размещение заблокирует капитал на год, после чего его доход начнет поступать в бюджет."
 SIA_state_resource_stake: "Получите долю в государственных ресурсах"
 SIA_state_resource_stake_desc: "Казначейство напрямую инвестирует в концессии на добычу полезных ископаемых и энергоресурсов, а не просто облагает их налогами. Деньги поступают быстро; то же самое происходит и с документами, которые никто не хочет слишком внимательно изучать."
 thailand.436.t: "Как вырваться из ловушки среднего дохода"
 thailand.436.d: "Статистики подтверждают это: Таиланд преодолел порог дохода, который на протяжении целого поколения удерживал в ловушке многих его соседей. Заводы, которые раньше собирали детали для других, теперь занимаются их проектированием. Вопрос, стоящий перед Кабинетом министров, заключается в том, что делать с этим моментом."
 thailand.436.a: "Объявите о достижении"
 thailand.436.b: "Накопите дивиденды"
 SIA_the_army_question: "Вопрос об армии"
 SIA_the_army_question_desc: "На каждые несколько сотен солдат приходится один генерал, продвижение по службе основано на классовой принадлежности и принадлежности к фракции, а не на заслугах, а фонд заработной платы пополняется за счет предприятий, не имеющих отношения к обороне. Армия Королевства работает, но не в плане военной службы. Кто-то должен решить, какой именно армией она должна стать."
 SIA_the_professional_turn: "Профессиональный поворот"
 SIA_the_professional_turn_desc: "Меньше солдат, но лучше подготовлены, отвечают по заслугам, а не по списку кадров. Это более сложный путь, и он ставит каждого генерала, которому нужно защищать свои интересы, в положение готовности."
 SIA_the_reshuffle_list: "Перестановка кадров — это не план войны."
 SIA_the_reshuffle_list_desc: "Ежегодная перестановка кадров — это истинный ритм работы RTARF, и она проводится под подписью гражданского министра, а не по расчётам самих казарм. Командование начинает подотчётно правительству, находящемуся у власти."
 SIA_retire_the_experts: "Уволить экспертов"
 SIA_retire_the_experts_desc: "Каждому выпускнику старших курсов полагается дополнительная должность «эксперта» или «специалиста», независимо от того, приносит ли эта должность какую-либо пользу. Выкупите должности почетных генералов и закройте вакансии, оставшиеся после них."
 SIA_close_the_ledger: "Закрыть бухгалтерскую книгу"
 SIA_close_the_ledger_desc: "Военный телеканал, поля для гольфа, земельные владения и программы социального обеспечения, которые функционировали за счет неоплачиваемого труда солдат, передаются в ведение гражданской администрации. Жизнь в казармах становится более стесненной. Бюджет становится более прозрачным."
 SIA_break_the_class_ladder: "Разрушьте школьную лестницу"
 SIA_break_the_class_ladder_desc: "Повышение по классу довоенного училища и фракционной принадлежности — «Вонгтеван» против «Бурафа Пхаяк» — уступает место повышению по личному делу. Это лишает старые связи контроля над тем, кто будет командовать дальше."
 SIA_all_volunteer_force: "Вседобровольцы"
 SIA_all_volunteer_force_desc: "Армия была построена исключительно на тех, кто её выбрал: лучше обученные, лучше организованные и получающие соответствующую зарплату. Это была в целом компетентная армия с постоянным уровнем заработной платы, который казначейство будет оплачивать постоянно."
 SIA_the_elite_spearhead: "Элитный передовой отряд"
 SIA_the_elite_spearhead_desc: "Вместо того чтобы профессионализировать всю армию, следует сосредоточить инвестиции. Небольшой отряд спецназа, дорогостояще оснащенный и содержащийся, должен быть способен наносить гораздо более мощные удары, чем та армия, которая за ним стоит."
 SIA_high_readiness_army: "Армия высокой готовности"
 SIA_high_readiness_army_desc: "Постоянные формирования поддерживаются в состоянии боевой готовности: они проходят учения, планируют действия и разведывают обстановку до начала боя. Поддержание такой готовности никогда не обходится бесплатно, но это означает, что армия, которая прибывает на место, — это именно та армия, которая была обещана."
 SIA_the_minister_decides: "Совет дает рекомендации, министр принимает решение."
 SIA_the_minister_decides_desc: "Верховный командный совет сохраняет свое место за столом переговоров, но решения принимают гражданские министры, а исполняют генералы. Это реформа, против которой старая гвардия борется наиболее упорно, и именно она обеспечивает успех всех остальных реформ."
 SIA_the_conscript_host: "Призывное войско"
 SIA_the_conscript_host_desc: "Цифры важнее качества. Расширение призыва позволяет дешево пополнить ряды, казначейство перестает тратиться на раздутый фонд заработной платы специалистов, а офицерский корпус сохраняет все имеющиеся у него привилегии."
 SIA_fill_the_quota: "Выполните квоту"
 SIA_fill_the_quota_desc: "Ежегодная лотерея призыва на военную службу позволяет охватить более широкий круг лиц, имеющих право на призыв. Чем больше имен будет выбрано, тем больше людей прибудет на службу, и тем ниже будет порог для ношения военной формы."
 SIA_the_boys_in_black: "Возвращение «Парней в чёрном»"
 SIA_the_boys_in_black_desc: "Добровольцы-рейнджеры из отряда Тахан Пхран, расположенного на границе, удвоили свою численность. Получая небольшую зарплату и будучи воспитанниками местных жителей, они удерживают приграничные деревни и истощают силы захватчиков на территории, которую знают лучше, чем любое обычное формирование."
 SIA_or_sor_grid: "«Ор Сор» в каждом тамбоне"
 SIA_or_sor_grid_desc: "Деревенских ополченцев зовут «ор сор», и набираются они в каждом тамбоне (подрайоне) по всей сельской местности. Это сеть ополчения, которой не нужна линия снабжения, потому что они защищают собственные дома."
 SIA_cheap_steel_many_hulls: "Дешевая сталь, много корпусов"
 SIA_cheap_steel_many_hulls_desc: "Вооружайте массы тайскими заводами, а не зарубежными каталогами. Комплект проще, а преимущество не такое явное, но оружейные заводы производят его быстро и дёшево."
 SIA_the_barracks_economy: "Экономика казарм"
 SIA_the_barracks_economy_desc: "Пусть предприятия генералов оплачивают мобилизацию, вместо того чтобы воевать с ними. Канал, поля для гольфа и остальная часть портфеля откроют свои счета для военных расходов, деньги сейчас, а коррупцию навсегда."
 SIA_reserve_of_the_realm: "Заповедник Королевства"
 SIA_reserve_of_the_realm_desc: "Каждый мужчина, когда-либо носивший военную форму, зарегистрирован, отслеживается и готов к призыву. Численность резервистов увеличивается, и призыв происходит быстрее, но это происходит за счет того, что система подготовки кадров оказывается перегружена."
 SIA_the_old_guard_endures: "Командование, которое никогда не спит"
 SIA_the_old_guard_endures_desc: "Массовая армия становится постоянной, фонд жалованья наконец возвращён к тому, что казна способна вынести, а вместе с ним закреплён и костяк офицерского корпуса. О гражданском контроле можно забыть навсегда. Старая гвардия просто научилась жить по средствам."
