 SOV_parnas: "PARNAS"
 SOV_parnas_desc: "El Partido de la Libertad del Pueblo (PARNAS) es un partido político liberal-democrático y uno de los primeros partidos de oposición fundado a finales de la época soviética."
 SOV_kasyanov: "Mikhail Kasyanov"
 SOV_kasyanov_desc: "Mijaíl Mijáilovich Kasyanov (nacido el 8 de diciembre de 1957) es un estadista y político ruso, actualmente presidente del Partido de la Libertad del Pueblo."
 SOV_from_center_to_regions: "Del Centro a las Regiones"
 SOV_from_center_to_regions_desc: "Creemos que la verdadera prosperidad económica depende del empoderamiento político, económico y administrativo de las regiones y municipios."
 SOV_eliminate_FSS: "Eliminar el FSS"
 SOV_eliminate_FSS_desc: "Transformar el FSS en un Servicio Federal de Contrainteligencia eliminando funciones de investigación y anticorrupción y excluyendo el Servicio de Comunicaciones del Gobierno y las Tropas Fronterizas."
 SOV_demilitarize_mia: "Desmilitarizar el Ministerio del Interior"
 SOV_demilitarize_mia_desc: "Retirar las tropas internas del Ministerio del Interior y establecer una Guardia Nacional Popular bajo supervisión presidencial y parlamentaria, prohibiendo el uso de OMON contra protestas pacíficas."
 SOV_reduce_taxes_on_small_businesses: "Reducir Impuestos a Pequeñas Empresas"
 SOV_reduce_taxes_on_small_businesses_desc: "Bajar los impuestos a las pequeñas empresas es esencial para estimular nuestra economía y fomentar el crecimiento."
 SOV_ease_administrative_pressure: "Aliviar la Presión Administrativa"
 SOV_ease_administrative_pressure_desc: "La presión administrativa sobre las regiones está aumentando y debemos actuar para detener y revertir esta tendencia."
 SOV_anti_corruption_agency: "Agencia Anti-Corrupción"
 SOV_anti_corruption_agency_desc: "La corrupción está arraigada en el poder. Es esencial un programa anticorrupción vigoroso a nivel nacional que involucre a toda la ciudadanía."
 SOV_adhere_to_nato_policy: "Adherirse a la Política de la OTAN"
 SOV_adhere_to_nato_policy_desc: "La cooperación con la OTAN promueve la seguridad, la estabilidad y el entendimiento mutuo. Mantiene la influencia de Rusia y equilibra los intereses globales."
 SOV_establishment_of_free_independent_alliance: "Establecimiento de la Alianza Independiente Libre"
 SOV_establishment_of_free_independent_alliance_desc: "Debemos restablecer los lazos diplomáticos con todos los estados postsoviéticos y posiblemente formar una unión para el desarrollo económico y militar conjunto."
 SOV_membership_in_a_free_independent_alliance: "Miembros de la Alianza Independiente Libre"
 SOV_membership_in_a_free_independent_alliance_desc: "Una vez establecida nuestra alianza, invitaremos a todas las ex repúblicas soviéticas a unirse y defender juntas la democracia."
 SOV_membership_subjects: "Miembros de Sujetos"
 SOV_membership_subjects_desc: "Nuestra alianza está incompleta sin la participación de los súbditos de nuestra federación."
 SOV_membership_east: "Miembros del Este"
 SOV_membership_east_desc: "Invitar a los países del Este fortalecerá nuestra alianza con sus recursos, economías y capacidades militares, mejorando nuestra defensa y la protección de la democracia."
 SOV_membership_pribalt: "Membresía de los Países Bálticos"
 SOV_membership_pribalt_desc: "Incluir a los Estados Bálticos ofrece acceso estratégico al Mar Báltico e impulsa su fortaleza industrial y tecnológica. Sin ellos, nuestra alianza corre el riesgo de perder territorio y aliados clave."
 SOV_membership_caucasus: "Membresía del Cáucaso"
 SOV_membership_caucasus_desc: "El Cáucaso aporta recursos estratégicos e importancia geopolítica. Excluirlos corre el riesgo de debilitar nuestra influencia regional y la estabilidad democrática."
 SOV_membership_ces: "Membresía de Asia Central"
 SOV_membership_ces_desc: "Los recursos y la posición de Asia Central son vitales. Su inclusión ampliará los mercados, fortalecerá la seguridad e impulsará nuestra influencia regional."
 SOV_free_economic_zone: "Zona Económica Libre"
 SOV_free_economic_zone_desc: "Debemos transformar Kaliningrado en una zona económica libre que sirva de puente para la cooperación entre Rusia y la UE."
 SOV_transfer_state_shares_to_pension_funds: "Transferir Acciones Estatales a Fondos de Pensiones"
 SOV_transfer_state_shares_to_pension_funds_desc: "Para mejorar el nivel de vida y la longevidad de los ciudadanos, las acciones estatales se transferirán al Fondo de Pensiones de Rusia con restricciones de voto."
