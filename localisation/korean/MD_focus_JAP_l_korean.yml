 JAP_kansai_medical_special_zone_active: "§Y$JAP_kansai_medical_special_zone$§! 시행됨"
 JAP_kyushu_logistics_special_zone_active: "§Y$JAP_kyushu_logistics_special_zone$§! 시행됨"
 JAP_expand_special_zones_nationwide_done: "§Y$JAP_expand_special_zones_nationwide$§! 시행됨"
 JAP_japanese_economy_decisions: "고착된 수요 부족"
 JAP_japanese_economy_decisions_desc: "20년에 걸친 물가 하락은 일본의 가계와 기업에 기다리는 법을 가르쳤습니다. 임금은 제자리에 머물고, 기업은 투자하지 않고 현금을 쌓아 두며, 부양책으로 풀린 1엔마저 소비되지 않고 저축됩니다. 경제는 붕괴하고 있지 않습니다. 단지 움직이기를 거부하고 있을 뿐입니다.\n\n§Y할 수 있는 일§!\n아래의 결정들은 수요 진작 수단입니다. 물가 목표 발표, 소비세 인하, 가계 현금 지급, 공공 투자 재원 마련, 내구재 구매 촉진은 각각 §Y수요 회복 진행도§!를 높입니다. 수요 분기의 중점들이 이러한 수단을 해금하며, §Y$JAP_active_public_investment$§!과(와) §Y$JAP_improvement_private_investment_climate$§!은(는) 각각 진행도를 직접 높여 줍니다.\n\n§Y수요 회복 진행도§!: [?JAP_demand_recovery_progress|0] / 100\n\n§G단계 기준§!\n§G30§!: §Y$JAP_entrenched_demand_shortfall_idea_1$§!이(가) §Y$JAP_entrenched_demand_shortfall_idea_2$§!(으)로 완화됩니다.\n§G60§!: 다시 §Y$JAP_entrenched_demand_shortfall_idea_3$§!(으)로 완화됩니다.\n§G85§!: 국가 정신이 제거되고 일본의 경제 성장이 가속됩니다.\n\n§R경고§!: 이 진행도는 감소하지 않지만, 저절로 오르지도 않습니다. 아무 결정도 내리지 않으면 일본은 침체에서 영원히 벗어나지 못합니다."
 JAP_entrenched_demand_shortfall_idea_2: "더딘 수요 회복"
 JAP_entrenched_demand_shortfall_idea_2_desc: "보다 명확한 물가 목표와 가계 지원으로 경제는 최악의 국면에서 벗어났으나, 회복은 여전히 취약합니다. 소비와 투자가 일부 분야에서 개선되고 있지만, 나라 전체를 끌어올릴 만큼 강하지는 않습니다. 수요는 돌아오고 있으나 경제에는 여전히 신중론이 드리워져 있습니다.\n-------------\n§Y$JAP_japanese_economy_decisions$§!의 결정을 사용하여 §Y수요 회복 진행도§!를 최소 §G60§!까지 올리면 이 국가 정신의 효과를 §G완화§!할 수 있습니다!"
 JAP_entrenched_demand_shortfall_idea_3: "잔존 수요 저하"
 JAP_entrenched_demand_shortfall_idea_3_desc: "소비를 진작하려는 정부의 조치가 경제를 앞으로 밀어냈지만, 수년간의 정체가 남긴 신중함은 여전히 깊이 뿌리내리고 있습니다. 가계와 기업은 예전보다 활발히 움직이고 있으나, 자생적인 회복에는 마지막 한 번의 추진력이 더 필요합니다. 일본 경제는 정체에서 벗어나는 문턱에 서 있지만, 아직 완전히 벗어나지는 못했습니다.\n-------------\n§Y$JAP_japanese_economy_decisions$§!의 결정을 사용하여 §Y수요 회복 진행도§!를 최소 §G85§!까지 올리면 이 국가 정신을 §G제거§!할 수 있습니다!"
 JAP_declaration_price_target: "물가 목표 선언"
 JAP_declaration_price_target_desc: "경제를 끌어내리는 것은 약한 수요만이 아닙니다. 물가와 임금이 결코 움직이지 않으리라는 믿음이 가계와 기업을 신중함에 가두어 두었습니다. 명확한 물가 목표는 국가가 더 이상 정체를 정상으로 받아들이지 않겠다는 선언이며, 얼어붙은 기대를 풀어 놓기 위한 첫걸음입니다."
 Japan_economy.17.t: "물가 목표 달성"
 Japan_economy.17.d: "한때 불가능해 보였던 일이 일어나기 시작했습니다. 물가가 사람들이 더는 외면할 수 없는 방식으로 오르고 있습니다. 가장 중요한 변화는 수치 자체가 아니라, 정체가 영원하지 않다는 감각이 커지고 있다는 점입니다. 그 감각이 가계와 기업의 신중함을 풀어놓기 시작하고 있습니다."
 Japan_economy.17.a: "분위기가 달라졌다."
 Japan_economy.18.t: "물가 목표 미달"
 Japan_economy.18.d: "목표는 실질적인 움직임으로 이어지지 못했고, 침체를 깨겠다는 정부의 약속에 대한 의구심이 퍼지기 시작했습니다. 가계는 다시 신중해지고 있으며, 기업은 약한 수요 앞에서 관망하는 자세로 물러나고 있습니다. 회복에 대한 신뢰는 분명히 훼손되었고, 무거운 분위기가 일본 경제에 다시 내려앉고 있습니다."
 Japan_economy.18.a: "신뢰는 쉽게 회복되지 않는다."
 JAP_price_target_mission: "물가 상승의 약속"
 JAP_price_target_mission_desc: "목표를 선언하는 것만으로는 충분하지 않습니다. 정해진 기간 안에 물가 상승의 가시적인 징후를 보여 주고, 변화가 실제로 시작되었음을 국민에게 납득시켜야 합니다."
 JAP_cash_transfers_households: "가계 직접 지원"
 JAP_cash_transfers_households_desc: "미래에 대한 불안이 클 때 회복은 저절로 시작되지 않습니다. 국가는 구매력을 가계의 손에 직접 쥐여 주어야 합니다. 저소득층과 중산층을 겨냥한 지원은 특히 실제 소비로 이어질 가능성이 높아 내수에 즉각적인 힘을 불어넣습니다."
 JAP_cash_transfers_households_decision: "저소득 및 중산층 가계 지급"
 JAP_cash_transfers_households_decision_desc: "지출할 가능성이 가장 높은 계층에 지원을 전달하여 수요를 직접 끌어올립니다."
 JAP_temporary_tax_cuts: "한시적 세금 감면"
 JAP_temporary_tax_cuts_desc: "한시적 감세는 가계가 지금 소비할 이유를 주어, 미뤄 온 구매를 앞당기고 정체된 경제에서 수요에 눈에 보이는 동력을 부여합니다."
 JAP_temporary_consumption_tax_cut: "한시적 소비세 인하"
 JAP_temporary_consumption_tax_cut_desc: "지금 소비할 이유를 만들어, 미뤄진 소비를 회복의 동력으로 바꿉니다."
 JAP_active_public_investment: "적극적 공공 투자"
 JAP_active_public_investment_desc: "민간 기업이 계속 신중하다면 정부가 직접 수요를 창출하여 지역 경제와 고용에 자금을 투입해야 합니다. 공공 투자는 마침내 움직임이 돌아왔다는 감각을 되살립니다."
 JAP_active_public_investment_decision: "공공 투자 명령"
 JAP_active_public_investment_decision_desc: "국가의 행동으로 수요를 창출하고 지역 경제와 고용으로 흘러드는 자금의 흐름을 되살립니다."
 JAP_improvement_private_investment_climate: "민간 투자 환경 개선"
 JAP_improvement_private_investment_climate_desc: "정부 지출만으로는 회복을 완성할 수 없습니다. 기업이 다시 투자할 자신감을 가져야 하며, 미래에 대한 불확실성이 줄어들어야 합니다. 지속적인 회복에는 기업이 방어에서 다시 확장으로 전환하는 것이 필요합니다."
 JAP_focus_improving_investment_climate: "투자 환경 개선에 집중"
 JAP_focus_improving_investment_climate_desc: "정부는 기업 투자에 더 유리한 환경을 조성하는 일을 우선시하고 있습니다. 조율, 설득, 제도 개혁에 정치적 자본이 소모되어 다른 단기 구상에 쓸 여력이 줄어듭니다."
 Japan_economy.02.t: "민간 투자 환경 개선"
 Japan_economy.02.d: "기업들은 영원히 방어적인 자세를 유지하는 것이 기회를 놓치는 일임을 깨닫기 시작하고 있습니다. 불확실성은 여전하지만 신규 투자를 가로막던 무게의 일부가 걷히기 시작했습니다. 처음으로 회복이 오로지 국가 주도로만 남을 운명처럼 보이지 않습니다."
 Japan_economy.02.a: "민간 부문이 꿈틀거리고 있다."
 JAP_stimulating_demand_durable_goods: "내구재 수요 진작"
 JAP_stimulating_demand_durable_goods_desc: "자동차, 가전, 주택 관련 구매와 같은 내구재는 수요가 움직이기 시작하면 자기 부문을 훨씬 넘어서는 효과를 끌어올릴 수 있습니다. 그러나 정체기에는 가장 먼저 미뤄지는 구매이기도 합니다. 이를 되살리면 회복에 눈에 보이는 동력이 생기고 오랫동안 사라졌던 활력을 되찾게 됩니다."
 JAP_stimulating_demand_durable_goods_decision: "내구재 구매 캠페인"
 JAP_stimulating_demand_durable_goods_decision_desc: "수년간 미뤄진 대형 구매를 장려하여 회복에 눈에 보이는 동력을 부여합니다."
 Japan_economy.22.t: "내구재 수요 회복 조짐"
 Japan_economy.22.d: "수년간 미뤄졌던 대형 구매가 마침내 돌아오기 시작했습니다. 내구재 수요는 관련 부문 전반에 폭넓은 효과를 미치며, 가계가 미래에 대해 조금이나마 희망을 갖기 시작했다는 신호이기도 합니다. 회복은 수치뿐만 아니라 일상생활의 분위기에서도 나타나기 시작하고 있습니다."
 Japan_economy.22.a: "동력이 퍼지게 하라."
 JAP_strict_audits_banks: "엄격한 은행 검사"
 JAP_strict_audits_banks_desc: "수년간의 지연으로 은행 체계의 상처는 보기 어려워졌고, 금융 불안은 계속 확산되었습니다. 첫걸음은 위험한 부실 채권을 어둠 속에서 끌어내고 은행이 현실을 직시하게 하는 것입니다. 고통스럽겠지만 그 고통 없이는 진정한 회복도 있을 수 없습니다."
 Japan_economy.23.t: "신세이의 풋옵션"
 Japan_economy.23.d: "조항은 보도된 그대로입니다. 매수자들이 가치의 5분의 1을 잃었다고 판단하는 모든 대출은 장부가로 예금보험기구에 되돌려지고, 그 차액은 국가가 흡수합니다. 은행은 불법적인 일을 하지 않았습니다. 계약을 작성한 관료들보다 더 꼼꼼히 읽었을 뿐이며, 그 관료들은 여전히 자리를 지키고 있습니다."
 Japan_economy.23.a: "계약서를 공개하고 서명자를 밝힌다"
 Japan_economy.24.t: "소고의 붕괴"
 Japan_economy.24.d: "체인은 구할 수 없으며 장관에게 조언하는 모두가 이를 압니다. 문제는 채권자들과 그들을 봐준 관료들의 이름이 공개되는 법정에서 정리될 것인가, 아니면 부채의 공적 몫을 조용히 탕감하고 비공개로 구조조정될 것인가 하는 점뿐입니다."
 Japan_economy.24.a: "공개 법정에서 무너지게 둔다"
 JAP_injection_public_funds: "공적 자금 투입"
 JAP_injection_public_funds_desc: "약해진 은행에 지원 없이 손실 처리와 대출 재개를 동시에 요구하는 것은 비현실적입니다. 금융 체계 자체에 대한 신뢰를 지키려면 국가가 최후의 보루로 나서 붕괴의 연쇄를 막아야 합니다. 정치적으로 무거운 결정이지만 회피할 여지가 거의 없습니다."
 Japan_economy.25.t: "마이칼"
 Japan_economy.25.d: "그룹의 주거래 은행은 버블이 끝난 뒤 매년 차환해 주었으나, 이제 노동성에 더는 그러지 않겠다고 통보했습니다. 다른 누구와도 거래해 본 적 없는 간사이의 납품업체들은 이미 현청 사무소에 전화를 걸고 있습니다. 이번 주에 무엇이 결정되든 지역 전체에서 옛 방식이 여전히 유효한지에 대한 입장 표명으로 읽힐 것입니다."
 Japan_economy.25.a: "무너지게 두고 이를 떠안은 은행을 감사한다"
 JAP_new_lenders: "신규 대출 기관 유치"
 JAP_new_lenders_desc: "기존 은행들이 방어적 신중함에 갇혀 있는 한 신용의 흐름은 약한 채로 남을 것입니다. 신규 대출 기관의 진입을 장려하여 금융 자체의 병목을 깨야 합니다. 경쟁과 새로운 자본 경로는 일본 금융 체계가 잃어버린 유연성을 일부 회복시킬 수 있습니다."
 JAP_new_lenders_idea: "신규 대출 기관의 부상"
 JAP_new_lenders_idea_desc: "전통적인 은행 밖의 새로운 신용 공급원이 나타나기 시작하고 있습니다. 금융의 막힘이 완전히 해소된 것은 아니지만, 자본이 경제를 통과해 움직일 새로운 길이 열리고 있습니다."
 JAP_protection_deposits: "예금 보호 제도 마련"
 JAP_protection_deposits_desc: "예금자들이 자신의 저축이 안전한지 의심하기 시작하는 순간 은행 위기는 현실이 됩니다. 따라서 국가는 예금이 보호될 것임을 분명히 해야 합니다. 이것만으로 신뢰를 완전히 회복할 수는 없지만, 공포가 붕괴로 번지지 않게 막는 방벽이 될 수 있습니다."
 Japan_economy.26.t: "리소나"
 Japan_economy.26.d: "이연법인세자산을 빼면 자본비율은 무너집니다. 감사관들은 서명하지 않을 것이며 이는 그 자체로 전례가 없는 일이고, 정부에는 몇 주가 아닌 며칠밖에 없습니다. 2조 엔이면 은행은 온전해지고 국가가 그 소유주가 됩니다. 거부하면 전후 이 나라가 허용한 최초의 주요 은행 파산이며, 어디서 멈출지는 아무도 알 수 없습니다."
 Japan_economy.26.a: "자금을 투입하고 이사회 전원을 교체한다"
 JAP_rehabilitation_small_medium_enterprises: "중소기업 신용 안전망"
 JAP_rehabilitation_small_medium_enterprises_desc: "부실 채권을 처리하면 중소기업이 부실 기업과 함께 자금난에 빠질 위험이 있습니다. 은행은 존속 가능한 중소기업에 대한 대출을 유지해야 하며, 금융 구조조정 체계는 신용 경색을 감시하여 지역 경제의 붕괴 앞에 장벽을 세웁니다."
 JAP_rehabilitation_small_medium_enterprises_idea: "중소기업 신용 안정에 집중"
 JAP_rehabilitation_small_medium_enterprises_idea_desc: "부실 채권 처리가 중소기업에 대한 신용을 막아 버리지 않도록 감독, 조율, 구조조정 지원에 정치적 자원이 집중되고 있습니다. 이는 지역 경제를 지키는 데 필수적이지만 다른 분야에서 행동할 여력을 줄입니다."
 Japan_economy.27.t: "아시카가 은행"
 Japan_economy.27.d: "현 정부와 현의 기업들, 그리고 수많은 가계가 다른 곳과는 거래하지 않습니다. 검사관들의 판단은 명백합니다. 은행은 지급 불능이며 한참 전부터 그러했습니다. 일시적 국유화는 모든 예금자를 보호하고 모든 주주를 무너뜨리는데, 그중 다수는 자신의 대출 조건으로 주식 보유를 요구받은 지역 기업들입니다."
 Japan_economy.27.a: "국유화하고 주주의 지분을 0으로 감자한다"
 Japan_economy.28.t: "다이에"
 Japan_economy.28.d: "산업재생기구는 이를 인수하고 이사회를 교체하며 팔 수 있는 것을 매각할 준비가 되어 있습니다. 창업주는 전쟁의 폐허에서 이 회사를 일으켰고 당내에 이를 기억하는 친구들이 있습니다. 그들은 한 번 더 차환해 달라고 요청하고 있으며, 큰 소리로 요청하고 있습니다."
 Japan_economy.28.a: "산업재생기구에 넘긴다"
 Japan_economy.29.t: "가네보 회계"
 Japan_economy.29.d: "벌지 않은 이익 2천억 엔이 5년에 걸쳐 보고되었고, 매번 같은 회계법인이 승인했습니다. 회사를 기소하는 것은 간단합니다. 그 감사인을 기소하면 일본의 모든 회계법인에 서명이 형식이 아닌 책임임을 알리게 되고, 수많은 다른 재무제표가 갑자기 다시 읽을 가치를 갖게 됩니다."
 Japan_economy.29.a: "회사를 기소하고 감사인을 정직시킨다"
 Japan_economy.30.t: "경제 단체의 물러섬"
 Japan_economy.30.d: "압박이 사라졌습니다. 단체는 이의를 철회하지 않았지만 조사에 반대하는 브리핑을 멈추었고, 가장 목소리가 컸던 회원사들은 잠잠해졌습니다. 이는 동의가 아닙니다. 싸움이 더는 그들에게 치를 만한 가치가 없다는 판단입니다."
 Japan_economy.30.a: "고요함이 지속되는 동안 누린다."
 Japan_economy.31.t: "경제 단체의 실행"
 Japan_economy.31.d: "회원사 전반의 설비 투자 계획이 연기되었고 하나같이 불확실성을 이유로 듭니다. 오늘 아침 발표된 채용 동결은 신중함으로 포장되어 있습니다. 메시지는 분명하며 분명하도록 의도되었고, 기업에 투자를 강제할 수 있는 법령은 없습니다."
 Japan_economy.31.a: "그들이 뜻을 관철했다."
 Japan_economy.06.t: "기업들의 반격"
 Japan_economy.06.d: "감사관들이 실제 수치를 요구하는 순간 로비가 시작됩니다. 산업 연합들은 대규모 도산과 일자리 상실을 경고하고, 우호적인 관료들은 인내를 권합니다. 은행들은 손실을 자기 일정에 맞춰, 할 수만 있다면 아예 보고하지 않기를 바랍니다. 우리는 그들을 강제할 수도 있고, 그들이 선택한 것을 내놓게 둘 수도 있으며, 애초에 수고할 가치가 없었다고 결정할 수도 있습니다."
 Japan_economy.06.a: "장부를 소환한다"
 Japan_economy.07.t: "벼랑 끝의 은행"
 Japan_economy.07.d: "감사로 인해 부실 채권에 허덕이는 지방 대출 기관이 드러났습니다. 재무제표 전체를 공개하면 공황이 퍼질 수 있고, 공개를 억제하면 부패는 반쯤 숨겨진 채 남지만 시장은 평온을 유지합니다. 어느 쪽이든 조사는 계속 진행됩니다."
 Japan_economy.07.a: "전면 공개를 강제한다"
 Japan_economy.08.t: "조사 결과 공표"
 Japan_economy.08.d: "보고서가 인쇄소로 넘어갑니다. 그 내용은 전적으로 감사관들이 무엇을 밝혀내도록 허용되었는가에 달려 있습니다. 지급 불능 기업들과 이들을 비호한 관료들의 목록일 수도, 최악의 이름이 지워진 부분적 설명일 수도, 수백 쪽을 채우고도 누구도 비난하지 않는 문서일 수도 있습니다. 대중은 어느 쪽이든 읽을 것이고, 투명한 서구식 시장을 약속받았던 사람들도 그럴 것입니다."
 Japan_economy.08.a: "전부 공개하고 대중이 판단하게 한다"
 Japan_economy.09.t: "노동성의 정보 유출"
 Japan_economy.09.d: "기업들은 어느 감사관이 어느 날 아침에 올지 알고 있었습니다. 서류 보관함은 주말 동안 비워졌고, 이사 두 명은 갑자기 해외 출장으로 연락이 닿지 않습니다. 노동성의 누군가가 그들에게 알려 주고 있으며, 이 자리의 모두가 그가 누구인지 짐작할 수 있습니다. 그는 자신이 비호하는 은행에서 이곳으로 파견되었고 퇴직하면 다시 그곳으로 돌아갈 것이기 때문입니다."
 Japan_economy.09.a: "손실을 받아들이고 넘어간다"
 Japan_economy.10.t: "경제 단체의 최후통첩"
 Japan_economy.10.d: "경제 단체는 자체 수치를 들고 국회를 찾아왔습니다. 연기된 투자, 동결된 채용, 훼손된 신뢰가 모두 조사의 탓이라는 것입니다. 정중함 아래의 메시지는 은근하지 않습니다. 이를 접으십시오. 그렇지 않으면 이 단체의 회원사들은 불확실성이 이어지는 동안 어떤 것에도 약속할 수 없게 될 것입니다."
 Japan_economy.10.a: "공개적으로 입장을 밝히게 하라."
 Japan_economy.11.t: "검사의 몰락"
 Japan_economy.11.d: "실패한 것은 조사가 아니었습니다. 수사 책임 검사가 신고하지 않은 골프 회원권을 받았고, 그것도 자신의 수사 대상 명단에 오른 기업이 준 것이었으며, 그가 이를 받는 사진을 가진 신문이 있었습니다. 장관은 책임을 지고 사임했습니다. 조사는 검토가 끝날 때까지 중단되었는데, 이는 대중이 관심을 거두는 시점까지를 뜻한다고 모두가 이해합니다."
 Japan_economy.11.a: "주도권을 잃었다."
 JAP_expectation_of_being_rewarded: "보상받을 것이라는 기대"
 JAP_expectation_of_being_rewarded_desc: "회복에는 노력이 임금과 생활 수준으로 보상받을 것이라는 믿음을 되살리는 것이 필요합니다. 임금 상승이 없으면 부양책은 일시적인 것에 그치며, 오직 그 기대만이 회복을 자생적인 것으로 만듭니다."
 JAP_wage_negotiations: "임금 인상 협상"
 JAP_wage_negotiations_decision: "임금 상승에 대한 신뢰를 회복하여 수요 회복이 한시적인 부양의 분출로 끝나지 않게 합니다."
 Japan_economy.12.t: "기업과의 임금 협상"
 Japan_economy.12.d: "수요 회복이 자생적인 것이 되려면 임금도 함께 올라야 합니다. 그러나 기업들은 미래의 위험과 이익 압박을 여전히 경계하고 있습니다. 정부는 이제 임금 인상을 얼마나 강하게 밀어붙일지 결정해야 합니다."
 Japan_economy.12.a: "임금 인상을 장려한다."
 Japan_economy.12.b: "압력을 가한다."
 Japan_economy.12.c: "민간 부문에 맡긴다."
 Japan_economy.14.t: "임금 상승, 목표 달성"
 Japan_economy.14.d: "임금이 마침내 눈에 띄게 움직이기 시작했습니다. 중요한 것은 소득의 증가 자체만이 아니라, 노력이 다시 보상받을 수 있다는 더 깊은 감정이 돌아왔다는 점입니다. 그 정서의 변화가 약했던 소비를 더 강하고 지속적인 것으로 바꾸기 시작하고 있습니다."
 Japan_economy.14.a: "회복이 현실이 되고 있다."
 Japan_economy.15.t: "임금 상승, 목표 미달"
 Japan_economy.15.d: "임금 상승은 목표에 이르지 못했지만 노력이 헛되지는 않았습니다. 기업들은 여전히 신중하나 임금 인상의 필요성은 이전보다 폭넓게 이해되고 있습니다. 한 걸음은 작지만, 오랜 정체의 분위기를 깨는 데에는 여전히 의미가 있습니다."
 Japan_economy.15.a: "이를 토대로 쌓아 나간다."
 Japan_economy.12_a_TT: "임금 상승이 목표 수준에 도달할 확률은 §Y반반§!입니다"
 Japan_economy.12_b_TT: "임금 상승이 목표 수준에 도달할 확률은 §G높음§!입니다"
 Japan_economy.12_c_TT: "임금 상승이 목표 수준에 도달할 확률은 §R낮음§!입니다"
 JAP_wage_negotiations_TT: "§Y수요 회복 진행도§!가 상승하지만, 그 양은 §Y임금 협상§!의 결과에 따라 달라집니다"
 JAP_glorious_decade_desc: "침체의 원인을 미루지 않고 재정, 기업, 수요를 병행하여 재건합니다. 동시에 저출산과 \\"취업 빙하기\\" 세대의 영향에 맞서고, 일하는 방식 개혁과 사람에 대한 투자를 중심으로 가계 안정과 더 강한 성장 잠재력의 균형을 이룰 것입니다."
 JAP_inflation_target_desc: "정부와 중앙은행은 경제를 뒷받침하는 정책 기조와 이를 유지할 조건을 분명히 전달할 것입니다. 미래의 불확실성을 줄이고 가계와 기업의 \\"관망\\" 태도를 누그러뜨림으로써 소비와 투자가 살아나기 쉽게 만들 것입니다."
 JAP_diplomacy.34.d: "지역의 금융 안전망을 강화하기 위해 일본 정부는 \\"치앙마이 이니셔티브\\"를 통해 우리나라와의 통화 스와프 협정을 확대할 것을 제안했습니다. 위기 시 유동성을 확보하면 시장의 불안을 진정시키고 경제 안정에 기여할 수 있습니다.\n\n이 제안을 수락하고 금융 협력 강화에 동참해야 합니까?"
 JAP_diplomacy.40.d: "일본 정부는 교육, 인재 개발, 연구 분야에서 현지 기업 및 기관과 협력하여 수행하는 지원으로서 우리나라에 대한 \\"질적 ODA\\" 협력을 제안했습니다. 이 협력은 기술 형성과 제도 역량을 강화하여 산업 고도화와 혁신을 촉진할 것입니다. 제안을 수락하면 아세안(ASEAN) 내 일본의 영향력도 커질 것입니다.\n\n이 제안을 수락하고 인적 자본과 연구 개발을 강화해야 합니까?"
 JAP_diplomacy.41.d: "[FROM.GetName](은)는 교육, 인재 개발, 연구 분야에서 일본의 \\"질적 ODA\\" 협력 제안을 수락했습니다. 현지 기업 및 기관과의 조율이 진전됨에 따라 상대국의 제도 역량과 기술 기반이 강화되어 지속 가능한 성장에 기여할 것입니다. 이 합의는 아세안(ASEAN) 내 일본의 영향력을 틀림없이 높일 것입니다."
 JAP_diplomacy.42.d: "[FROM.GetName](은)는 교육, 인재 개발, 연구 분야에서의 \\"질적 ODA\\" 협력 제안을 거절하겠다고 밝혔습니다. 상대국은 국내 우선순위와 제도적 준비를 우선시하는 것으로 보이나, 이것이 제안 자체를 거부한다는 뜻은 아닙니다. 일본은 상대국의 사정을 염두에 두면서 대화 경로를 열어 두어야 합니다."
 JAP_diplomacy.49.d: "일본 정부는 자연재해에 대한 공통의 취약성을 바탕으로 재난 대응의 전문 지식과 교훈을 공유하기 위해 \\"일본-대만 재난 대비 지식 플랫폼\\"을 설립하자는 제안을 제시했습니다. 정보 공유 표준화, 합동 훈련 실시, 복구 절차 개발을 통해 비상 대응 능력을 강화하고 복구를 앞당기는 것이 목표입니다. 이 협력이 진전되면 피해를 줄이고 복구를 가속할 것으로 기대됩니다."
 JAP_diplomacy.50.d: "일본 정부는 일본과 대만의 연구 기관과 민간 기업을 연결하여 최첨단 민수 기술의 공동 연구를 진전시키는 \\"일본-대만 첨단 기술 협력\\"을 제안했습니다. 연구 자원을 공유하고 공동 개발을 추진하며 기술자 교류를 촉진함으로써 혁신을 가속하고 산업 생산성과 경쟁력을 높이는 것이 목표입니다. 이 협력이 뿌리를 내리면 양국 민수 기술 부문의 장기 성장을 위한 토대가 될 것입니다."
 JAP_diplomacy.56.t: "\\"한자 문화권\\" 문화 협력 사업"
 JAP_diplomacy.56.d: "일본 정부는 공통의 역사적 토대를 공유하는 \\"한자 문화권\\" 내의 문화적 유대를 강화하기 위한 중일 문화 협력 사업을 제안했습니다. 학술 교류, 문화 사업, 미디어와 교육 협력을 통해 공유된 가치와 역사적 연결을 더 가시화하고, 이를 외부 영향에 대한 문화적 완충재로 기능하게 하는 것이 목표입니다. 이 틀이 진전되면 보다 우호적인 국제 이미지를 만드는 데 기여하는 소프트 파워도 강화될 것으로 기대됩니다."
 JAP_diplomacy.59.d: "일본 정부는 지역 단위의 기업 교류를 제도화하고 일본과 대한민국의 지역 기업 간 협력을 촉진하는 \\"지역 비즈니스 교류 구상\\"을 제안했습니다. 비즈니스 매칭 행사, 공동 전시회, 공급망 연결, 기술과 노하우 공유를 통해 지역 경제를 활성화하고 민수 산업의 성장을 가속하는 것이 목표입니다. 이 틀이 뿌리를 내리면 중앙 정부의 주도에 지나치게 의존하지 않는 실질적 협력이 확대되어 민간 주도의 산업 네트워크가 강화될 것입니다."
 JAP_historical.20010426.d: "모리 요시로는 총리 취임 불과 1년 만에 사임을 발표했습니다. 그의 지지율은 하락했고, \\"신의 나라\\" 발언과 에히메마루 사건 대응으로 상징되는 그와 국민 사이의 괴리는 더 벌어지기만 했습니다.\n\n그의 후임으로 자민당 총재 선거에서 선출된 인물은 \\"자민당을 부수겠다\\"는 대담한 선언으로 전국의 주목을 받고 화려하고 눈에 띄는 선거 운동을 펼친 고이즈미 준이치로였습니다. 국민의 기대는 높았고, 그는 지방 투표에서 압승을 거두었습니다.\n\n옛 자유민주당과 결별한 스타일과 존재감으로 고이즈미는 총리직에 오르며 \\"개혁\\"의 깃발을 들었습니다.\n그러나 그가 부수겠다고 맹세한 폐허에서 무엇이 나올지는 아직 아무도 모릅니다."
 JAP_historical.20060926.d: "5년 넘게 장기 집권한 고이즈미 준이치로 총리는 자민당 총재 임기 만료와 함께 물러날 뜻을 밝혔습니다. 고이즈미는 임기 말에 물러나고 싶다는 뜻을 공개적으로 밝혀 왔으나 그에 대한 대중의 지지는 여전히 높았고, 당내에서도 많은 이들이 연임을 계속 요구했습니다.\n\n한편 자민당 내에서는 젊은 나이에 급속히 승진하여 내각 관방장관이 된 아베 신조가 유력한 후계자로 부상했습니다. 젊음, 인지도, 정치적 혈통, \\"포스트 고이즈미\\"로서의 상징적 지위를 갖춘 그는 당내 전반에서 폭넓은 지지를 모으고 있었습니다.\n\n경험 많은 현직과 다음 세대로 횃불을 넘길 준비가 된 새 지도자 가운데 누가 나라를 이끌어 가는 데 더 적합합니까? 결단의 때가 왔습니다."
 JAP_historical.20070926.d: "아베 신조 총리는 정부 운영이 갈수록 어려워지고 있다는 이유로 갑작스럽게 사임 의사를 밝혔습니다. 취임한 지 겨우 1년이었습니다. 잇따른 각료 스캔들 속에서 그의 정권 기반은 심각하게 흔들렸습니다.\n그의 사임에 대응하여 자민당 일각에서는 \\"국민의 신뢰를 회복하려면 새 얼굴이 필요하다\\"며 전 내각 관방장관 후쿠다 야스오를 영입하자는 움직임이 일었습니다. 그러나 아베의 유임을 강하게 지지하는 목소리도 여전히 많습니다.\n\n일본은 이제 정치적 혼란의 한가운데에 서 있습니다. 누가 나라의 키를 잡을지 결정할 때가 왔습니다."
 JAP_historical.20080924.d: "후쿠다 야스오 총리는 총리 관저에서 예고 없이 기자회견을 열어 사임을 발표했습니다.\n\n회견에서 그는 \\"국민의 생활을 위해 새로운 진용이 정책을 추진해 주기를 바랍니다\\"라고 말하며 지도부 교체를 차분히 받아들이는 모습을 보였습니다. 그러나 사임 이유를 분명히 설명하지 않았기에, 이 발표는 많은 시민을 혼란스럽고 불안하게 했습니다.\n이에 대응하여 자유민주당은 신속히 총재 선거 준비에 들어갔습니다. 아소 다로 간사장이 유력 후보로 떠올라 당내 여러 파벌의 지지를 빠르게 얻고 있습니다. 그래도 당내 소수는 후쿠다의 유임을 계속 요구하고 있습니다.\n\n정치적 정체를 깨기 위해 나라에 필요한 것은 변화입니까? 아니면 지금 일본에는 안정이 더 큰 우선순위입니까? 결단의 때가 왔습니다."
 JAP_focus_renewable_energy_decision_repeal: "재생 에너지 집중 철회"
 JAP_focus_renewable_energy_decision_repeal_desc: "재생 에너지에 대한 공약을 번복하는 것은 태양광과 풍력 투자에서 벗어나는 정책 전환을 뜻하며, 정부가 자원을 다른 에너지 우선순위로 돌릴 수 있게 해 줍니다."
 JAP_focus_thermal_power_decision_repeal: "화력 발전소 집중 철회"
 JAP_focus_thermal_power_decision_repeal_desc: "화력 발전소 확충을 번복하는 것은 석탄, 석유, 가스 투자에서 벗어나는 정책 전환을 뜻하며, 정부가 자원을 다른 에너지 우선순위로 돌릴 수 있게 해 줍니다."
 JAP_historical.121006001.t: "2000년 돗토리현 서부 지진"
 JAP_historical.121006001.d: "일본은 환태평양 조산대 위에 떠 있는 화산 열도로 이루어져 있습니다. 이는 일본과 그 국민이 끊임없이 거대한 지진을 겪어야 한다는 뜻입니다. 이는 지난 천년기 동안 달라지지 않았으며, 다음 천년기에도 달라지지 않을 것입니다.\n\n2000년 10월 6일 오후 1시 30분 - 규모 7.3, 진도 6강의 지진이 돗토리현 서부를 강타했습니다. 이 지진으로 수많은 도로와 가옥이 큰 피해를 입었고, 오사카와 후쿠오카 같은 먼 지역에서도 진동이 느껴졌습니다. 특히 고베는 1995년 한신·아와지 대지진 이후 처음으로 강한 지진을 겪었습니다."
 JAP_historical.disaster_help: "지금 당장 도웁시다!"
 JAP_historical.disaster_leave: "내버려 둡시다. 그들 스스로 복구할 것입니다."
 JAP_historical.130210001.t: "에히메마루 참사"
 JAP_historical.130210001.d: "2001년 2월 9일, 수산고등학교 소속 실습선 에히메마루가 [USA.GetName]의 잠수함 그린빌에 들이받혔습니다. 학생과 교사를 포함해 35명이 타고 있던 에히메마루는 가라앉았고 9명이 사망했습니다.\n\n양국 정부 관계자들이 이 비극적인 사고에 관한 모든 정보를 수집하는 동안, [Root.GetLeader] 총리는 휴가를 즐기며 골프를 치고 있습니다.\n\n물론 휴가를 포기하고 지금 당장 도쿄로 돌아가야 하지 않겠습니까?"
 JAP_historical.130210001.oA: "지금 당장 도쿄로 돌아가라!"
 JAP_historical.130210001.oB: "잠깐! 한 번만 더 치고..."
 JAP_historical.130324001.t: "2001년 게이요 지진"
 JAP_historical.130324001.d: "2001년 3월 24일 오후 3시 27분 - 규모 6.7, 진도 6약의 지진이 히로시마 서부를 강타했습니다. 2명이 사망하고 288명이 부상당했습니다. 진원지와 가장 가까운 도시인 구레가 가장 큰 피해를 입었습니다. 한편 다른 많은 지방 정부는 1995년 한신·아와지 대지진과 작년 돗토리 지진 이후 대책을 마련해 두었기 때문에 피해를 줄일 수 있었습니다. 주요 피해는 수도관 파손과 산 사면 붕괴였습니다."
 JAP_historical.9130901001.t: "가부키초 빌딩 화재"
 JAP_historical.9130901001.d: "2001년 9월 1일 새벽, 도쿄 신주쿠구 가부키초에 있던 \\"묘조 56 빌딩\\"에서 불이 나, 마작장과 스트립 클럽을 찾은 44명이 일산화탄소 중독으로 사망했습니다. 소방서 보고에 따르면 불은 처음에는 작았으나, 불을 발견한 직원이 문을 열면서 발생한 백드래프트 현상으로 크게 번졌습니다. 보고서는 또한 화재경보기가 천장에 가려져 있거나 오작동을 이유로 꺼져 있어 초기 진화 시기를 놓쳤다고 덧붙였습니다. 건물 직원들이 방문객의 대피를 유도하지 않았다는 보고도 있습니다. 한편 소방서와 합동 수사를 벌인 경시청은 가스관이 부자연스럽게 파손된 것을 발견했습니다. 화재 원인이 사고인지 방화인지는 아직 밝혀지지 않았으나, 방화 의식의 부족이 피해를 키운 것은 분명합니다."
 JAP_historical.9130901001.oA: "이보다 더 끔찍한 건물 화재는 다시 보지 않기를 바랍니다."
 JAP_historical.131201001.t: "아이코 내친왕 전하의 탄생"
 JAP_historical.131201001.d: "2001년 12월 1일, 나루히토 황태자와 마사코 황태자비의 딸이 황궁 내 병원에서 태어났습니다. 제3천년기 최초로 태어난 내친왕인 그녀는 중국 유교 경전 『맹자』에서 따온 이름인 아이코로 명명되었습니다. 또한 아이코 내친왕 전하는 아키히토 천황 폐하의 손녀이기도 합니다. 1965년 후미히토 아키시노노미야 전하가 태어난 이래 오랜만에 맞는 가장 기쁜 사건이어서 전국 거의 모든 사람이 축하했습니다. 그리고 정치인과 유명 인사를 포함한 2만 명이 황궁에서 만세를 외쳤습니다. 한편 일부 사람들은 이 상황이 현 황실의 대가 끊기게 할 것을 우려했습니다. 마사코 황태자비는 아이를 낳기에는 나이가 너무 많아 둘째를 낳는 것이 위험했기 때문입니다. 또한 아이코 내친왕이 성장하면 두 왕자인 나루히토와 후미히토 사이의 나이 차가 비교적 크기 때문에 \\"마지막 황족으로서\\" 모계 여제가 될 수도 있습니다. 그러나 이는 남계 혈통에게만 황위를 허용하는 황실전범을 어기는 일이 됩니다. 결국 모두가 모계 여제를 가능하게 하기 위한 황실전범 개정을 두고 논쟁을 벌이기 시작했습니다."
 JAP_historical.131201001.oA: "만세!"
 JAP_historical.150526001.t: "2003년 미야기현 앞바다 지진"
 JAP_historical.150526001.d: "2003년 5월 26일 오후 6시 24분 - 규모 7.1, 진도 6약의 지진이 미야기현과 이와테현 경계 앞바다에서 발생하여 육지를 강타했습니다. 도호쿠 지방 넓은 지역이 신칸센 고가교 파손과 산사태 등 큰 피해를 입었으나 사망자는 없었습니다. 이번에는 쓰나미가 물결처럼 매우 약했습니다. 이러한 보고가 있었지만, 홋카이도에서 간토에 이르기까지 많은 사람이 흔들림을 느꼈습니다."
 JAP_historical.150726001.t: "2003년 미야기현 북부 연속 지진"
 JAP_historical.150726001.d: "2003년 7월 26일 - 하루 동안 새벽 0시부터 저녁까지 무려 네 차례의 지진이 미야기현 북부를 연이어 강타했습니다! 가장 강한 지진은 오전 7시 13분에 기록된 규모 6.4, 진도 6강이었으며, 가장 약한 지진도 규모 5.1, 진도 5약이었습니다. 이 지진들은 수백 채의 가옥뿐 아니라 항공자위대 마쓰시마 기지에도 피해를 입혔습니다. 매우 불쾌한 하루였지만, 다행히 사망자는 없었습니다."
 JAP_historical.150926001.t: "2003년 홋카이도 지진"
 JAP_historical.150926001.d: "2003년 9월 26일 오전 4시 50분 - 규모 8.0, 진도 6약의 지진이 홋카이도 남부 앞바다에서 발생했습니다. 강한 흔들림을 겪은 마을은 소수에 불과했으나, 이내 그 끔찍한 여파가 현실로 드러났습니다. 이 지진은 해안 매립지대의 토양 액상화와 석유 저장 탱크 화재를 일으켰습니다. 이에 더해 거대한 쓰나미가 동일본 동해안을 덮쳐 2명이 사망했습니다."
 JAP_historical.161023001.t: "2004년 니가타현 주에쓰 지진"
 JAP_historical.161023001.d: "2004년 10월 23일 오후 5시 56분 - 규모 6.8, 진도 7의 지진이 니가타에서 발생했습니다. 1995년 한신 대지진 이후 개정된 기상청 진도 계급으로는 처음 관측된 진도 7이었습니다. 야마코시에서는 산사태로 모든 도로가 파괴되어 주민 전원이 마을에 고립되었습니다. 조에쓰 신칸센 선로를 달리던 열차가 충격으로 탈선했으나 사망자는 없었습니다. 그러나 이 지진으로 인해 총 68명이 사망했습니다."
 JAP_historical.170320001.t: "2005년 후쿠오카현 서방 앞바다 지진"
 JAP_historical.170320001.d: "2005년 3월 20일 오전 10시 53분 - 규모 7.0, 진도 6약의 지진이 후쿠오카시 앞바다에서 발생했습니다. 기타큐슈 북부는 지진 기록이 적은 지역이며, 이번 지진은 1922년 이래 가장 큰 규모이기도 했습니다. 후쿠오카시 겐카이섬에서는 약 700명이 대피했고, 재해 통신과 순찰을 위해 열 명이 남기로 했습니다. 후쿠오카 중심가에서는 대부분의 창문이 깨졌고, 그 파편이 보도에 떨어져 보행자 두 명이 다쳤습니다. 이 지진은 쓰시마뿐만 아니라 한국과 중국에서도 느껴졌습니다. 이 지진으로 한 명이 사망했습니다."
 JAP_historical.170425001.t: "후쿠치야마선 탈선 사고"
 JAP_historical.170425001.d: "2005년 4월 25일 오전 9시 18분, JR 니시니혼 후쿠치야마선(JR 다카라즈카선으로도 알려져 있음)의 쾌속 열차가 효고현 아마가사키시의 급커브에서 탈선하여 인근 아파트 1층으로 충돌했습니다.\n열차는 7량 편성이었으나, 선두 차량이 건물에 완전히 박혀 버린 탓에 초기 보도에서는 6량이라고 잘못 전해졌습니다. 조사 결과, 해당 구간의 제한 속도는 시속 70km(43마일)였으나 열차는 약 시속 116km(72마일)로 커브에 진입한 것으로 드러났습니다. 과속으로 인한 원심력이 탈선의 원인으로 보입니다.\n운전사는 이 사고로 사망했으나, 후미 차량에 있던 차장의 증언에 따르면 승무원들이 약 90초의 지연을 만회하려 했을 가능성이 있습니다. 이후 이 회사에는 사소한 운행 실수에도 엄격한 내부 징계 조치가 존재했다는 사실이 보도되었습니다. 이러한 조치에는 재교육, 사규 필사 등의 교정 관행이 포함되었으며, 그 기원은 나카소네 정권 시기 일본 국유철도(JNR)의 민영화로 거슬러 올라갑니다.\n다행히 반대 방향에서 접근하던 특급 열차는 선로가 막힌 것을 보고 긴급 정차하여 2차 충돌을 피할 수 있었습니다. 그러나 사고는 아침 출근 시간대에 발생했기 때문에 열차 안은 붐볐습니다. 총 107명이 사망하고 562명이 부상당해, 1963년 이래 일본에서 가장 큰 인명 피해를 낸 철도 사고가 되었습니다. 일부 의료 전문가들은 몇몇 승객이 충돌 당시 즉사한 것이 아니라 장시간 압박으로 인한 압궤 증후군으로 나중에 사망했을 수 있다고 지적했습니다."
 JAP_historical.180906001.t: "히사히토 친왕 전하의 탄생"
 JAP_historical.180906001.d: "2006년 9월 6일, 후미히토 친왕과 기코 친왕비의 아들이 미나미아자부의 사립 병원에서 태어났습니다. 제3천년기 최초로 태어난 친왕인 그는 \\"느긋한 모습\\"을 뜻하는 \\"히사\\"와 헤이안 시대부터 이어져 온 황실 작명 전통인 \\"히토\\"를 따서 히사히토라고 명명되었습니다. 그는 황궁이 아닌 사립 병원에서 제왕절개로 태어났으며, 둘 다 황실 역사상 처음 있는 일이었습니다. 이는 새로운 황족의 탄생일 뿐만 아니라 황위 계승의 적통 남성이 태어난 것으로서 환영받았습니다. 소년의 탄생 이후 황실전범 개정 논쟁은 점차 수그러들고 있습니다."
 JAP_historical.180906001.oA: "만세!"
 JAP_historical.190216001.t: "\\"사라진 연금\\""
 JAP_historical.190216001.d: "1997년 일본 사회보험청(SIA)은 개인별 연금 기록을 하나의 \\"기초연금번호\\" 체계로 통합하기 시작했습니다. 그러나 2006년부터 2007년 사이에 사회보험청은 종이 문서를 디지털 형식으로 옮기는 과정에서 발생한 오류로 인해 연결되지 않았거나 불일치가 있는 연금 기록이 약 5천만 건에 달한다는 사실을 발견했습니다.\n이 누락된 기록 중 일부는 현재 연금 수급자에게 영향을 미쳐, 잘못된 금액이 지급되었을 수 있다는 우려를 낳았습니다. 또한 일부 기록은 직원 연금 데이터를 갱신하는 과정에서 분실되었거나 실수로 삭제된 것으로 알려졌습니다.\n이에 [JAP.GetRulingParty]는 문제를 조사할 특별 전담팀을 출범시키고 피해자 구제를 위한 긴급 입법을 제안했습니다. 그럼에도 야당은 정부를 맹렬히 비판하고 있으며, 국민의 불만은 여전히 높습니다."
 JAP_historical.190216001.oA: "이 무슨 참사인가!"
 JAP_historical.190325001.t: "2007년 노토반도 지진"
 JAP_historical.190325001.d: "2007년 3월 25일 오전 9시 41분 - 규모 6.9의 강진이 호쿠리쿠 지방을 강타했습니다. 기상청 진도 계급은 이시카와현 와지마시에서 6강으로 산정되었으며, 이는 1922년 지진 관측이 시작된 이래 이 지역에서 관측된 가장 강한 지진이었습니다. 진원은 지금까지 어떤 연구에서도 단층이 발견되지 않았던 지역에 있는 것으로 보고되었습니다. 홋카이도에서 고치현까지 느껴진 진동은 20cm(7.87인치)의 쓰나미를 일으켰습니다. 이 지진으로 석등이 무너져 1명이 사망하고 356명이 부상당했으며, 건물과 가옥 3만 채 이상이 피해를 입었습니다."
 JAP_historical.190716001.t: "2007년 니가타현 주에쓰 앞바다 지진"
 JAP_historical.190716001.d: "2007년 7월 16일 오전 10시 13분 - 또다시 규모 6.8의 지진이 니가타현을 강타했습니다. 기상청 진도 계급은 여러 마을에서 6강으로 산정되었으나, 가시와자키가리와 원자력 발전소에서는 비공식적으로 7로 계산되었습니다. 이 진동으로 쓰나미도 발생하여 가시와자키시에서 1m(3.28피트)가 기록되었습니다. 이 지진으로 직접 및 간접적으로 15명이 사망하고 2,346명이 부상당했으며, 전파 1,331채를 포함해 3만 4천 채 이상의 건물과 가옥이 피해를 입었습니다. 앞서 언급한 가시와자키가리와 원자력 발전소에서 화재가 발생했으나, 초기 소화 활동 중 정보 공유 착오로 진화가 두 시간 지연되었고 이로 인해 방사성 물질이 누출되었습니다. 다만 환경상 무시할 수 있는 수준이었습니다. 이 지진은 노토반도 지진 불과 4개월 뒤, 파괴적이었던 2004년 니가타현 주에쓰 지진 3년 뒤에 발생했습니다."
 JAP_historical.200614001.t: "2008년 이와테·미야기 내륙 지진"
 JAP_historical.200614001.d: "2008년 6월 14일 오전 8시 43분 - 규모 7.2의 강진이 이와테현 지하에서 발생했으며, 기상청 진도 계급은 미야기현 구리하라시와 이와테현 오슈시에서 6강으로 산정되었습니다. 내륙 지진임에도 불구하고 홋카이도에서 간토 지방까지 진도 3 이상의 진동이 기록되었습니다. 이 지진은 드물게도 건물 피해는 적었으나 수많은 산사태를 일으켜 결국 17명이 사망하고 중상자 70명, 경상자 356명이 발생했으며 6명은 아직 실종 상태입니다. 다리 붕괴와 문화재 피해 등의 보고도 있었습니다."
 JAP_historical.210811001.t: "2009년 스루가만 지진"
 JAP_historical.210811001.d: "2009년 8월 11일 오전 5시 7분 - 규모 6.5의 큰 지진이 스루가만에서 발생하여 1명이 사망하고 319명이 부상당했습니다. 이 지진은 40cm(1.31피트)의 쓰나미를 일으켰습니다. 기상청 진도 계급은 시즈오카현 여러 지역에서 6약으로 산정되었으며, 가옥 8,678채와 여러 역사적 건물이 피해를 입었으나 완전히 붕괴된 가옥은 없었습니다. 시즈오카현을 포함하는 도카이 지방은 장차 발생할 도카이·도난카이 대지진과 쓰나미의 재해 예상 핵심 지역이기 때문에, 주민들은 대피 훈련과 가구 고정, 가옥 및 건물 보강으로 대비해 왔습니다. 이것이 지진 규모에 비해 피해자와 피해가 적었던 이유입니다. 그럼에도 공장, 차밭, 도메이 고속도로의 피해 보고가 있었습니다."
 JAP_diplomacy.16.t: "일본 교착 상태"
 JAP_diplomacy.16.d: "도쿄는 제9조의 해석 확대에 계속 저항하고 있습니다. 워싱턴은 어디까지 밀어붙일지, 그리고 어떤 대가를 치를지 결정해야 합니다."
 JAP_diplomacy.16.a: "이 문제는 접는다. 이 지역의 다른 이익이 우선이다."
 JAP_diplomacy.16.b: "일본에 대한 안전 보장을 철회한다."
 JAP_diplomacy.16.c: "일본산 수출품에 관세를 부과한다."
 JAP_diplomacy.16.e: "일본에 대한 해상 봉쇄를 실시한다."
 JAP_asteroid_mining_network_established: "[JAP.GetNameWithFlag]의 소행성 채굴 네트워크 구축 완료"
 JAP_asteroid_mining_operation_active: "현재 소행성 채굴 작전 수행 중"
 JAP_claiming_taiwan_tt: "모든 대만 섬 주에 대해 일본의 영유권을 한꺼번에 주장합니다. 영유권 주장이 이루어지면 중점을 완료하여 대만의 복종을 요구하십시오."
 JAP_improvement_private_investment_climate_idea: "민간 투자 환경 개선"
 JAP_improvement_private_investment_climate_idea_desc: "정부 지출만으로는 복구를 완수할 수 없습니다. 기업이 다시 투자할 확신을 가질 수 있어야 하며, 미래에 대한 불확실성이 줄어들어야 합니다. 지속적인 회복은 기업이 방어에서 다시 확장으로 옮겨 가는 것을 요구합니다."
 JAP_demographic_crisis: "위기에 대한 전례 없는 조치"
 JAP_demographic_crisis_desc: "일본의 어린이가정청은 출산 장려 인센티브, 여성 노동력 동원, 이민 개혁 등 인구 감소에 대한 범정부적 대응을 조율합니다. 국회는 오직 하나의 경로만 택합니다. 각 경로는 서로 다른 화폐로 대가를 치르는데, 현금 수당, 노동력 교란, 문화적 변혁이 그것입니다."
 JAP_demographic_crisis_tt: "인구 감소에 대한 일본의 대응이 시작됩니다. 뒤따르는 세 가지 전략은 서로 배타적입니다."
 JAP_traditionalist_backlash_opposition_tt: "§R전통주의자의 반발:§! 전통적 가족의 퇴조에 대한 보수층의 분노가 민족주의 야당을 키웁니다"
 JAP_traditionalist_backlash_stability_tt: "§R전통주의자의 반발:§! 전통적 가족의 퇴조에 대한 보수층의 분노가 안정도를 훼손합니다"
 JAP_japan_belongs_to_the_japanese: "일본은 일본인의 것"
 JAP_japan_belongs_to_the_japanese_desc: "일본은 가족 수당, 출산 장려 인센티브, 문화 쇄신을 통해 출산율을 높일 것입니다. 국가는 출생아 수가 늘어나는지와 상관없이 영구적인 복지 지출을 약속합니다. 이 길은 쇠퇴의 재정적 불확실성을 되돌릴 수 없는 수급 권리의 확실성과 맞바꾸는 것입니다."
 JAP_pronatalist_turn: "플러스 원 구상"
 JAP_pronatalist_turn_desc: "일본은 2000년대 초 '플러스 원' 전략에서 영감을 받아 출산을 시민적 우선 과제로 장려하는 종합 캠페인을 시작할 것입니다. 세제 혜택, 공공 홍보, 자녀가 여럿인 가정에 대한 문화적 인정을 통해 국가는 사회적 인식을 대가족 쪽으로 바꾸는 한편, 부모가 되는 일을 더 부담 없고 매력적으로 만드는 구체적인 지원을 제공할 것입니다."
 JAP_national_revival_campaign: "지방 창생 구상"
 JAP_national_revival_campaign_desc: "일본은 젊은이들이 도쿄로 흘러들면서 공동화된 지역 공동체를 되살리기 위해 지방에 투자를 쏟을 것입니다. 일자리를 창출하고 생활 편의시설을 개선하며 일본 지방에 대한 믿음을 회복함으로써, 대도시 밖에 가정을 정착시키고 농촌 쇠퇴를 심화시키는 인구 집중을 늦추는 것을 목표로 합니다. 강한 지방은 안정된 가정과 지속 가능한 출산율의 토대입니다."
 JAP_three_generation_household: "3세대 가구"
 JAP_three_generation_household_desc: "일본은 세제 혜택과 주거 지원을 통해 3세대 가구에 보조금을 지급하여, 조부모가 시장 임금 없이 육아와 노인 돌봄을 제공하는 방식을 되살릴 것입니다. 국가는 복지 비용을 가족 유대에 떠넘겨 자체 지출을 줄입니다. 집에서 이루어지는 돌봄은 국가가 비용을 치르지 않는 돌봄입니다."
 JAP_homeland_production_drive: "국내 모노즈쿠리"
 JAP_homeland_production_drive_desc: "일본은 줄어드는 노동력에서 생산량을 극대화하기 위해 자동화와 노동자 교육에 투자하며 국내 제조업에 대한 헌신을 심화할 것입니다. 생산을 해외로 이전하거나 이민자를 고용하는 대신, 일본은 물건을 잘 만드는 기술인 모노즈쿠리 전통을 추구합니다. 그 대가는 에너지 부담과 더 높은 비용입니다."
 JAP_incentivize_large_families: "아동 수당 확대"
 JAP_incentivize_large_families_desc: "일본은 자녀가 한 명 늘 때마다 금액이 커지는 후한 현금 지급으로 지도 데아테(아동수당)를 확대할 것입니다. 부모가 되는 부담을 덜어 줌으로써 국가는 가족 규모를 가로막던 결정적 제약을 제거합니다. 일단 법제화되면 이 수당은 어떤 후속 정부도 감히 삭감하지 못할 영구적인 권리가 됩니다."
 JAP_state_family_mandate: "국가 과제로서의 가족"
 JAP_state_family_mandate_desc: "일본은 고용법, 연금 우대, 사회적 메시지를 통해 여성에게는 모성을, 남성에게는 부성을 압박하며 가족 형성을 의무화할 것입니다. 이는 값싼 해법입니다. 국가는 거의 비용을 들이지 않고 국민을 출산에 동원합니다. 그 대가는 정당성의 손상과 반감입니다."
 JAP_a_nation_reborn: "다시 태어난 나라"
 JAP_a_nation_reborn_desc: "출산율은 안정되어 상승하기 시작했고, 모성은 존중받으며, 지역 공동체는 활력을 되찾았습니다. 일본은 지속적인 출산 장려 투자를 통해 인구 감소를 되돌렸습니다. 20년에 걸친 수당, 주거 보조, 노인 돌봄은 어떤 후속 정부도 삭감할 수 없는 권리로 굳어졌습니다."
 JAP_womenomics: "우머노믹스"
 JAP_womenomics_desc: "일본은 장벽을 허물고, 보육을 제공하며, 기업 문화를 바꿔 모든 경제 부문에서 여성을 동원할 것입니다. 이는 아이를 더 낳지 않고도 생산 능력과 세수를 끌어올립니다. 국가는 보육 체계를 구축하고 인력을 충원해야 하며, 보수적인 일본은 이를 가족에 대한 공격으로 받아들일 것입니다."
 JAP_eliminate_daycare_waitlists: "대기 아동 제로 구상"
 JAP_eliminate_daycare_waitlists_desc: "일본은 육아 안심 플랜을 시행하여 대기자 명단이 사라질 때까지 보육원, 어린이집, 방과 후 돌봄을 확충할 것입니다. 종사자 임금과 시설 건설에 대한 대규모 투자는 여성의 노동 참여를 가로막는 결정적 제약을 제거합니다. 이러한 시설에는 영구적으로 인력과 재원을 대야 합니다."
 JAP_reform_spousal_tax_deduction: "103만 엔의 벽 철폐"
 JAP_reform_spousal_tax_deduction_desc: "일본은 103만 엔에서 발생하는 배우자 공제 절벽을 없애고 그 배후의 사회보험 기준을 재편할 것입니다. 이로써 수백만 여성을 시간제 노동에 묶어 두었던 정규직 고용에 대한 불이익이 사라집니다. 벽을 허물면 숙련되고 교육받은 방대한 여성 인력이 정규직 고용으로 풀려납니다."
 JAP_normalize_parental_leave: "이쿠멘 캠페인"
 JAP_normalize_parental_leave_desc: "일본은 이쿠멘 캠페인을 개시하여 양쪽 부모 모두에게 유급 육아휴직을 보장하고 남성에게 이를 사용하도록 압박할 것입니다. 아버지가 일상적으로 양육자가 되면 여성은 더 이상 모성에 얽매이지 않고 부담은 분담됩니다. 기업은 생산 손실이라는 비용을 치러야 하며, 샐러리맨 세대는 조용히 양보하지 않을 것입니다."
 JAP_women_in_management: "202030 이니셔티브"
 JAP_women_in_management_desc: "일본은 202030 목표, 즉 지도적 직위 열 자리 중 세 자리를 여성이 차지하는 것을 추구할 것입니다. 여성의 직업생활 활약 추진에 관한 법률은 구속력 있는 기업 및 공공 부문 목표를 설정하고 공시를 강제하며 변화를 이끄는 기업에 보상합니다. 여성이 모든 이사회와 관청 부서에서 실질적인 권력을 쥐게 될 것입니다."
 JAP_family_first_model: "근무 방식 개혁: 가족 경로"
 JAP_family_first_model_desc: "근무 방식 개혁 운동은 가족 경로를 우선시할 것입니다. 유연 근무, 시간제 경력 트랙, 확대된 아동수당으로 여성이 모성의 가능성을 포기하지 않고도 노동시장에 남을 수 있게 됩니다. 이 경로는 경력과 출산을 모두 지키기 위해 전체 생산량 저하를 받아들이며, 최대의 경제 성장보다 사회 안정과 완만한 인구 회복이 더 중요하다는 데 걸고 있습니다."
 JAP_career_first_model: "근무 방식 개혁: 경력 경로"
 JAP_career_first_model_desc: "근무 방식 개혁 운동은 경력 경로를 우선시합니다. 유연성도 시간제 트랙도 없지만, 승진과 임금에서 진정한 평등이 보장됩니다. 여성은 모든 직위에서 대등한 입장에서 경쟁하며 경제 생산량과 여성 소득이 극대화됩니다. 이는 출산을 더 어렵게 만들며, 많은 이들이 가족보다 야망을 택함에 따라 출산율은 더욱 하락할 것입니다."
 JAP_a_society_where_women_thrive: "여성이 빛나는 사회"
 JAP_a_society_where_women_thrive_desc: "구조적 장벽은 무너졌고 여성은 모든 수준에서 진정한 평등과 선택권을 가지고 일하며, 노동력과 세원이 모두 두터워졌습니다. 개혁이 끝내 가져다주지 못한 것은 아이들이었습니다. 일본은 더 많이 일하고 더 많이 벌지만 여전히 줄어들고 있으며, 국가가 영원히 재원을 대야 하는 보육 및 교육 체계에 의존하고 있습니다."
 JAP_open_japan: "열린 일본"
 JAP_open_japan_desc: "일본은 이주 협정, 기술 기반 이민, 비자 개혁을 통해 해외에서 노동자를 체계적으로 끌어들여 노동력 격차를 메울 것입니다. 이는 노동력 부족을 수십 년이 아니라 몇 년 안에 해소하여 완전 고용과 연금 건전성을 확보합니다. 문화적 정체성은 압박을 받고, 공동체는 합의보다 빠르게 변하며, 모든 단계가 민족주의의 반발을 부를 것입니다."
 JAP_labor_migration_pact: "양자 간 노동 이동 협정"
 JAP_labor_migration_pact_desc: "일본은 인접국과의 양자 노동 협정을 공식화하여 기능실습제도를 확대하고, 건설, 농업, 간병, 제조업에 노동자를 들여올 새로운 상호 협정을 체결할 것입니다. 이러한 협정은 신속하고 효율적입니다. 수만 명의 노동자를 몇 달 안에 투입하여 핵심적인 노동력 공백을 메우고, 그렇지 않으면 위축되거나 완전히 사라질 부문의 고용을 안정시킬 수 있습니다."
 JAP_points_based_immigration: "고도 전문직 프로그램"
 JAP_points_based_immigration_desc: "일본은 학력, 경력, 언어 능력, 거주 이력에 점수를 부여하는 고도 전문직 포인트제를 도입할 것입니다. 기술자, 간호사, 연구자, 금융 전문가가 고부가가치 일자리를 채워 성장의 제약을 완화합니다. 숙련 인력은 가족을 데려오고 국제학교를 기대하는데, 국가는 달리 살 수 없는 연구 역량을 얻는 대가로 이 비용을 감수합니다."
 JAP_integration_programs: "다문화 공생 통합 체계"
 JAP_integration_programs_desc: "일본은 이주 노동자와 그 가족을 위한 언어 교육, 커뮤니티 센터, 영주권 취득 경로를 통해 다문화 공생이라는 적극적 통합에 투자할 것입니다. 소속될 수단을 얻은 신규 이주민은 마찰을 덜 일으키고 더 온전히 기여합니다. 이주민 가족을 위한 언어 교육, 학교 교육, 복지는 상시 예산 부담이 되지만, 관리되지 않은 이주가 치안에 초래할 비용을 상쇄합니다."
 JAP_multicultural_society: "다문화 사회"
 JAP_multicultural_society_desc: "일본은 이주민과 그 자녀에게 법적 지위, 시민 참여, 문화적 인정을 부여하여 국민 공동체의 온전한 구성원으로 받아들입니다. 이는 역사적 폐쇄성과의 근본적인 단절로, 잠재적 반감을 소속감으로 바꾸고 사회 안정을 유지합니다. 수백만 신규 일본인에게 완전한 시민권과 복지 권리를 부여하는 것은 비용이 많이 드는 영구적 권리이며, 교육 및 사회 예산에서 다시는 빠지지 않을 것입니다."
 JAP_guest_worker_system: "특정기능 비자 확대"
 JAP_guest_worker_system_desc: "일본은 특정기능 비자(도쿠테이 기노)를 확대하여 건설, 농업, 간병, 제조업에 기간제 계약으로 노동자를 들여올 것입니다. 이들은 와서 일하고 계약이 끝나면 고국으로 돌아가므로, 영구 이민의 마찰 없이 노동력 공백을 메웁니다. 그러나 보호 장치가 거의 없고 공동체에 이해관계도 없는 순환 인구가 생겨나며, 이를 단속하는 일은 상시적인 기업 비용이 됩니다."
 JAP_an_open_nation: "열린 나라"
 JAP_an_open_nation_desc: "일본의 인구는 이주를 통해 안정되고 증가하여, 단일 민족 국가를 다문화 국가로 탈바꿈시켰습니다. 경제 안정과 연금 건전성은 지켜졌지만 민족적 동질성에 대한 감각은 깨졌고, 기성세대는 사라져 가는 나라를 애도합니다. 제도가 갖춰지는 속도보다 빠르게 도착한 인구에 대한 치안, 학교 교육, 사회 서비스는 한 세대 동안 높은 수준으로 유지될 것입니다."
 JAP_economic_sectors: "일본의 경제 부문"
 JAP_economic_sectors_desc: "지역에 뿌리내린 농림수산업에서 제조업, 서비스업, 첨단 기술에 이르기까지, 우리는 산업 전반에 걸쳐 일본의 강점을 이끌어 낼 것입니다. 국내 고용과 공급 능력을 뒷받침하는 한편, 수출 경쟁력과 신성장 분야 투자의 균형을 맞추어 우리의 산업 기반을 다음 시대로 이어 가겠습니다."
 JAP_agricultural_revitalization: "1차 산업 부흥"
 JAP_agricultural_revitalization_desc: "농림수산성은 25년 만에 처음으로 기본법을 개정하여 세 부문을 식량 안보를 위한 하나의 국가 전략으로 묶습니다. 농민의 평균 연령이 일흔을 향해 가고 전국 각지의 농지가 버려지는 가운데, 이러한 통합은 농촌 회복과 뒤따르는 모든 개혁의 토대가 됩니다."
 JAP_corporate_farm_consolidation: "농지 은행과 겐탄의 종식"
 JAP_corporate_farm_consolidation_desc: "농지 집약 은행은 흩어진 농지를 더 큰 규모로 모으고, 겐탄(쌀 생산 조정) 폐지는 농민에게 휴경 보상금을 지급하던 반세기의 관행을 끝냅니다. 기계화와 시장 규율이 생산성을 높이겠지만, 경쟁할 수 없는 영세 가족 농가는 땅에서 밀려날 것입니다."
 JAP_revitalize_rural_communities: "지방 창생 전략"
 JAP_revitalize_rural_communities_desc: "지호 소세이(지방 창생)의 기치 아래 정부는 직접 지불로 외진 지역의 농업을 유지하고, 고향납세를 통해 도시의 부를 마을로 돌려 농지가 황무지로 돌아가기 쉬운 곳에 젊은 가족이 정착하도록 유도합니다. 성장은 기업형 집약보다 느리지만 농촌을 살려 둡니다."
 JAP_smart_rice_farming: "스마트 농업과 사케 장인 정신"
 JAP_smart_rice_farming_desc: "일본은 쌀 문화유산과 스마트 농업을 결합합니다. 위성 유도, 드론, 센서 기반 논 덕분에 줄어들고 고령화되는 노동력이 더 적은 손으로 더 넓은 땅을 돌볼 수 있습니다. 고시히카리 같은 프리미엄 브랜드와 일본 사케에 대한 세계적 갈증이 수확물을 국내외 식탁으로 실어 나릅니다."
 JAP_premium_wagyu_brand: "와규 수출 브랜드"
 JAP_premium_wagyu_brand_desc: "지리적 표시 보호와 와규 유전자 밀반출을 막는 법률을 바탕으로, 일본은 이 품종을 물량이 아닌 원산지와 품질로 값을 받는 프리미엄 수출품으로 키웁니다. 세계 최고의 레스토랑들이 일본산 쇠고기를 취급하게 될 것입니다."
 JAP_sustainable_fisheries: "어업법 개혁"
 JAP_sustainable_fisheries_desc: "70년 만의 첫 전면 개편인 2018년 어업법 개혁은 과학에 기반한 어획 할당량을 부과하고 책임 있는 어업에 보상하며, 양식 참다랑어에서 연안 패류에 이르기까지 양식업에 투자를 쏟아붓습니다. 지속 가능한 바다는 연안 마을의 생업과 나라의 식문화를 이어 줄 것입니다."
 JAP_forestry_revival: "삼림환경세"
 JAP_forestry_revival_desc: "삼림환경세를 재원으로 일본은 방치된 삼나무와 편백 조림지를 솎아 내고 다시 심으며, 벌목을 기계화하고 직교집성판(CLT)을 장려하여 국산 목재가 건설 현장으로 돌아오게 합니다. 되살아난 임업은 산간 마을에 일자리를 되돌리고 오래 놀리던 자원을 국력으로 바꿔 놓습니다."
 JAP_pharmaceutical_powerhouse: "약품 시차 문제 대응"
 JAP_pharmaceutical_powerhouse_desc: "일본의 세계 3위 제약 시장은 다케다, 아스텔라스, 다이이치산쿄, 주가이가 차지하고 있지만, 벌어지는 약품 시차로 환자들은 해외 의약품을 몇 년씩 기다려야 합니다. 정부는 PMDA 승인 절차를 간소화하고 바이오 기술과 재생 의료를 지원하여 성숙한 산업을 고부가가치 성장의 엔진으로 바꿀 것입니다."
 JAP_rural_revitalization: "6차 산업화"
 JAP_rural_revitalization_desc: "6차 산업화(로쿠지 산교카) 아래에서 1차 생산자는 자신이 생산한 것을 가공하고 판매하기도 합니다. 농가 체험 숙박, 브랜드화된 지역 식품, 소비자 직거래가 어려움을 겪던 마을을 관광지로 바꾸고, 젊은 가족을 다시 땅으로 불러들여 인구 감소의 흐름에 맞서는 가장 믿음직한 닻이 됩니다."
 JAP_agricultural_construction_drive: "농업 건설 추진"
 JAP_agricultural_construction_drive_desc: "정치적 의지와 보조금이 맞물려 있는 동안 새로운 농지와 농촌 시설에 착공하여 전국 농촌의 건설을 가속하려는 범국가적 노력입니다."
 JAP_automotive_industry: "나라의 바퀴"
 JAP_automotive_industry_desc: "일본의 일곱 제조사는 합쳐서 연간 800만 대의 차량을 조립하며, 부품업체, 판매점, 운송업체를 포함해 일본 일자리의 약 12분의 1을 떠받치고 있습니다. 아이치의 조립 공장에서 요코하마의 수출 부두에 이르기까지, 일본은 세계 최대 차량 수출국의 자리를 지킬 것입니다."
 JAP_lean_production_system: "도요타 생산 방식"
 JAP_lean_production_system_desc: "도요타 생산 방식은 적시 납품, 지도카, 낭비(무다) 제거를 추구하는 카이젠을 통해 현대 제조업을 빚어냈으며, 일본 공장이 어떤 경쟁자보다 적은 결함과 적은 재고로 더 많은 자동차를 만들도록 했습니다. 일본은 산업 전반에 린 규율을 확산시켜, 다른 이들이 보지 못하는 낭비를 알아보는 세대를 길러 낼 것입니다."
 JAP_keiretsu_supplier_network: "게이레쓰 공급망"
 JAP_keiretsu_supplier_network_desc: "완성차 뒤에는 수십 년의 신뢰로 묶인 공급업체의 피라미드가 있습니다. 덴소, 아이신, 도요타 산업, 그리고 모노즈쿠리 정신으로 저마다 장인의 경지에 오른 수천 개의 소규모 업체들입니다. 일본은 이러한 게이레쓰 관계를 심화하고 2차, 3차 협력업체의 생존을 보장하여 공급망 회복력을 전략 자산으로 만들 것입니다."
 JAP_precision_machine_tools: "자동차를 만드는 로봇"
 JAP_precision_machine_tools_desc: "화낙과 야스카와는 산업용 로봇의 세계 시장을 장악하고 있으며, 야마자키 마작, DMG 모리, 오쿠마는 정밀 공작기계의 기준을 세우고 있습니다. 노동력이 고령화되고 줄어드는 가운데, 일본은 로봇공학과 메카트로닉스에 막대한 투자를 하여 세계 공장에 장비를 공급하는 작업장의 지위를 지킬 것입니다."
 JAP_domestic_champions: "렉서스 기준"
 JAP_domestic_champions_desc: "렉서스는 일본이 독일 고급 브랜드에 그들의 안방에서 도전할 수 있음을 증명했고, 그 교훈은 이후 업계 전반으로 퍼졌습니다. 일본은 자국 공학 기술의 브랜드 가치를 키우고 고수익 부문을 추구하며, 가격만이 아닌 품질과 위신으로 경쟁할 것입니다."
 JAP_hybrid_powertrains: "하이브리드 혁명"
 JAP_hybrid_powertrains_desc: "프리우스는 아직 세상에 없던 충전망을 요구하지 않고 가솔린 엔진과 전기 모터를 결합함으로써, 다른 이들이 두려워하던 곳에서 일본이 승부를 걸 수 있음을 증명했습니다. 일본은 이 하이브리드 노선에 더욱 힘을 실어, 석유 시대와 그 다음 시대를 잇는 실용적인 가교로 다듬을 것입니다."
 JAP_battery_electric_shift: "배터리 전기차의 도박"
 JAP_battery_electric_shift_desc: "닛산 리프는 최초의 대중 시장용 전기차였지만, 일본은 이후 경쟁자들이 순수 배터리 방식으로 앞서 나가는 것을 지켜보았습니다. 따라잡기 위해 정부는 전고체 전지에 대한 집중 프로그램과 국내 기가팩토리 물결에 매진하여, 자동차에서 가장 값진 부품을 국내에서 만들 것입니다."
 JAP_hydrogen_society: "수소 사회를 향하여"
 JAP_hydrogen_society_desc: "연료전지 세단 미라이와 수소 기본 전략은 자동차, 트럭, 가정, 발전소가 우주에서 가장 풍부한 원소로 움직이며 물 외에는 아무것도 배출하지 않는 비전을 제시합니다. 일본은 충전 인프라를 구축하고 연료전지 제조사를 지원하여, 수소를 연소의 종말에 대한 일본 고유의 해답으로 추구할 것입니다."
 JAP_automotive_superpower: "모빌리티 초강대국"
 JAP_automotive_superpower_desc: "일본은 미래로 가는 길 중 하나만 고르도록 강요받지 않을 것입니다. 하이브리드, 배터리, 연료전지를 동시에 마스터하고, 이를 만드는 세계 최고의 린 공장과 공급망을 유지함으로써 일본은 금세기 모빌리티 초강대국으로서의 입지를 확보합니다."
 JAP_automotive_retooling_drive: "조립 라인 재정비"
 JAP_automotive_retooling_drive_desc: "투자와 정치적 의지가 맞물려 있는 동안 자동차 조립 라인을 재정비하고 현대화하여, 차세대 차량을 위해 공장을 다시 구성하려는 범국가적 노력입니다."
 JAP_battery_gigafactory_program: "배터리 기가팩토리 프로그램"
 JAP_battery_gigafactory_program_desc: "국내 배터리 기가팩토리를 세우기 위한 집중적인 추진으로, 전기차의 심장이 수입이 아닌 국내에서 만들어지도록 셀 생산 능력을 신속히 끌어올립니다."
 JAP_motorcycle_kingdom: "두 바퀴의 왕국"
 JAP_motorcycle_kingdom_desc: "혼다, 야마하, 가와사키, 스즈키는 동남아시아 전역에서 수억 명의 발이 되는 통근용 스텝스루부터 MotoGP와 월드 슈퍼바이크 그리드를 지배하는 리터급 슈퍼바이크에 이르기까지, 지구상 동력 이륜차의 압도적 다수를 생산합니다. 일본은 이륜차 공장에 투자하고, 경쟁자들이 한 세대 뒤처져 일본 엔진을 쫓게 만드는 공학적 우위를 지킬 것입니다."
 JAP_kei_car_mobility: "경차 국가"
 JAP_kei_car_mobility_desc: "일본에서 팔리는 신차의 거의 5분의 2는 더 가난했던 시대의 세법이 660cc로 상한을 둔 소형차, 곧 경차 규격에 속하며, 도시 밖에서 인구가 고령화됨에 따라 경차는 연금 생활자가 병원이나 가게에 갈 수 있는 마지막 현실적 수단이 되고 있습니다. 일본은 경차 규격을 저렴하고 잘 만들어진 상태로 유지하여, 열차가 더 이상 다니지 않는 곳의 이동성을 지탱할 것입니다."
 JAP_jdm_soft_power: "그란 투리스모 국가"
 JAP_jdm_soft_power_desc: "스카이라인 GT-R, 수프라, RX-7은 이니셜 D 같은 애니메이션과 그란 투리스모 시리즈를 통해 자동차 문화의 세계적 아이콘이 되었고, 이는 한 세대의 플레이어들에게 JDM 배지를 사랑하도록 가르쳤습니다. 일본은 강철과 더불어 이미지의 수출을 키우고, 일본 고성능 자동차를 전 세계적 숭배의 대상으로 만든 튜너 숍, 토게 문화, 모터스포츠 유산을 뒷받침할 것입니다."
 JAP_export_wharves: "수출 부두"
 JAP_export_wharves_desc: "일본에서 조립되는 차량의 대략 절반은 요코하마, 나고야, 고베에서 자동차 운반선에 실려 세계 각지의 항구로 향하며, 일본을 지구상 최대의 차량 수출국으로 만듭니다. 정부는 이 자동차의 흐름이 끊김 없이 바깥으로 이어지도록 부두, 야적장, 운반선단을 확장할 것입니다."
 JAP_automotive_export_drive: "자동차 수출 추진"
 JAP_automotive_export_drive_desc: "수출 주문이 가득 찬 동안 자동차 및 부품 공장의 교대조와 작업 공간을 늘려 조립 및 수출 공장 능력을 확충하려는 기한부 범국가적 추진입니다."
 JAP_electronics_revitalization: "전자 및 반도체 부흥"
 JAP_electronics_revitalization_desc: "일본의 전자 산업은 한때 지배하던 시장에서 한국, 대만, 중국의 경쟁자들에게 밀려났습니다. 경제산업성의 반도체 부흥 전략 아래, 국가는 소재, 장비, 정밀 공학에 남아 있는 강점을 결집하여 경쟁력을 재건합니다. 지금 투자가 흘러든다면 반도체에 대한 옛 장악력을 되찾을 수 있습니다."
 JAP_semiconductor_materials: "소재 및 장비의 명장"
 JAP_semiconductor_materials_desc: "일본은 반도체 공급망 상류에 대한 장악력을 잃은 적이 없습니다. 도쿄 일렉트론은 증착 및 식각 장비를 지배하고, 신에쓰와 SUMCO는 세계의 실리콘 웨이퍼를 공급하며, JSR과 도쿄오카는 포토레지스트 시장을 쥐고 있습니다. 정부는 이 영향력에 대한 투자를 확대하여 모든 외국 파운드리가 일본의 소재와 일본의 기계에 의존하도록 만듭니다."
 JAP_rapidus_moonshot: "라피더스 문샷"
 JAP_rapidus_moonshot_desc: "도요타, 소니, 국가의 지원을 받는 라피더스는 IBM, imec과 손잡고 홋카이도 지토세에 2나노미터 팹을 건설하기 위해 질주합니다. 어떤 일본 기업도 수년간 최첨단에 닿지 못했고 TSMC와의 격차는 수십억 단위로 가늠됩니다. 성공한다면 일본은 단숨에 업계의 최전선으로 복귀합니다."
 JAP_foundry_partnership: "구마모토 파운드리 제휴"
 JAP_foundry_partnership_desc: "라피더스가 최첨단에 승부를 거는 한편, 구마모토의 JASM은 TSMC, 소니와 제휴하여 자동차와 센서용 성숙 공정을 생산합니다. 문샷보다 천장은 낮지만 경제를 받치는 바닥입니다. 공급 부족을 감당할 수 없는 산업을 위해 국내에서 대량으로 반도체를 만드는 것입니다."
 JAP_semiconductor_sovereignty: "반도체 주권"
 JAP_semiconductor_sovereignty_desc: "설계 기업, 장비 제조사, 소재 공급업체, 팹이 스스로 지탱하는 국내 생태계로 엮입니다. 수출 통제와 병목 지점의 시대에, 일본은 경제를 돌리는 실리콘을 다시는 외국의 호의에 의존하지 않을 것입니다."
 JAP_home_electronics: "갈라파고스의 유령"
 JAP_home_electronics_desc: "갈라파고스 증후군은 일본 소비자 전자제품을 국내에서는 훌륭하지만 해외 판매에는 부적합하게 만들었고, 가라케이 피처폰은 스마트폰이 상륙하는 순간 구식이 되었습니다. 샤프, 소니, 파나소닉은 한때 지배하던 시장에서 밀려났습니다. 국가는 남은 것을 떠받치며, 업계가 발판을 찾는 동안 조립 라인과 장인 기술을 유지합니다."
 JAP_gaming_powerhouse: "게임 강국"
 JAP_gaming_powerhouse_desc: "닌텐도의 콘솔은 역대 가장 많이 팔린 기기에 속하고, 소니의 플레이스테이션은 세계적 제국의 중심에 있으며, 캡콤, 세가, 스퀘어 에닉스, 반다이 남코는 양쪽에 소프트웨어를 공급합니다. 정부는 스튜디오와 하드웨어 투자를 확대하고, 일본을 인터랙티브 엔터테인먼트의 중심에 머물게 하는 인재 파이프라인을 넓힙니다."
 JAP_rights_and_licensing_regime: "해외 권리 및 라이선스"
 JAP_rights_and_licensing_regime_desc: "애니메이션, 만화, 게임, 음악은 어떤 대사관보다 멀리 일본의 이미지를 실어 나르며, 쿨 재팬 구상은 그 영향력을 수익으로 전환하기 위해 존재합니다. 국가는 유통, 번역, 권리 관리에 투자하여 창작물이 해외로 새어 나가지 않고 해외에서 수익을 내도록 합니다. 모든 라이선스는 외국의 계약법과 외국의 방송 기준 아래 체결되며, 업계는 이를 계약 하나하나씩 배워 갑니다."
 JAP_broadband_nation: "광케이블의 나라"
 JAP_broadband_nation_desc: "세계 대부분이 아직 구리선으로 기어가던 때 NTT와 경쟁사들은 각 가정까지 광케이블을 깔아, 일본에 지구상에서 가장 빠르고 저렴한 연결망 가운데 일부를 안겨 주었습니다. 정부는 고용량 광케이블을 마지막 소외된 계곡과 섬에까지 확장하여 나라의 어느 구석도 디지털 경제에서 단절되지 않도록 합니다."
 JAP_beyond_5g: "비욘드 5G를 향하여"
 JAP_beyond_5g_desc: "일본은 스마트폰 전쟁에서 배제되었고 비욘드 5G마저 놓칠 생각이 없습니다. 국가는 무선 접속망에서 광 백본에 이르기까지 연구 컨소시엄과 개방형 네트워크 구조에 자금을 대어, 일본 기업이 2030년대 네트워크를 단순히 사들이는 데 그치지 않고 그 조건을 정하게 합니다."
 JAP_electronics_superpower: "다시 전자 초강대국으로"
 JAP_electronics_superpower_desc: "소재, 홋카이도와 규슈의 팹, 콘솔, 광케이블 인프라가 이제 전자 산업 구조 전체를 완성합니다. 실리콘 시대의 옛 명장이 싸워서 최전선으로 돌아왔습니다. 서울, 타이베이, 상하이는 일본의 복귀를 감안하지 않을 수 없습니다."
 JAP_energy_resource_strategy: "전략 에너지 계획"
 JAP_energy_resource_strategy_desc: "경제산업성은 에너지 충격으로부터 나라를 보호하기 위해 발전, 전력망 회복력, 자원 안보 전반에 걸쳐 기본 에너지 계획을 조율합니다. 원자력에서 재생 에너지, 전략 비축에 이르기까지, 이 부처는 불을 켜 두고 제련소에 원료를 공급하는 데 국가 기구 전체를 지휘합니다."
 JAP_renewable_energy_expansion: "고정가격매입제 혁명"
 JAP_renewable_energy_expansion_desc: "고정가격매입제는 규슈 전역의 태양광 설비와 아키타 앞바다의 풍력 발전 단지를 폭발적으로 늘리고, 톱 러너 효율 기준은 모든 가전제품과 공장 라인에서 낭비를 짜냅니다. 교세라와 샤프는 태양광 사업으로 옮겨 갑니다. 해와 바람은 결코 금수 조치를 당할 수 없습니다."
 JAP_power_grid_stabilization: "다시는 어둠 속에 있지 않으리"
 JAP_power_grid_stabilization_desc: "새로운 주파수 변환기와 연계선이 나라를 하나의 탄력적인 체계로 엮어, 한때 전력망을 갈랐던 50헤르츠 동부와 60헤르츠 서부의 분단을 잇습니다. 전력 회사는 예비 용량을 보유하고, 충격이 올 때마다 태양광, 화력, 저장 중 무엇으로 대응할지 선택하도록 명령받습니다."
 JAP_resource_security_initiative: "산업의 힘줄을 지켜라"
 JAP_resource_security_initiative_desc: "국가 자원 전략은 전략 비축, 해외 광산 지분, 재활용, 배타적 경제수역을 아우르며, 그 모두가 금수 조치로부터 산업을 보호하는 데 맞춰져 있습니다. 각 부처는 강철, 석유, 희소 금속을 가장 필요한 공장으로 보내, 수입 의존을 관리되는 회복력으로 바꿉니다."
 JAP_hydroelectric_power: "산악 하천을 활용하라"
 JAP_hydroelectric_power_desc: "일본의 가파르고 비가 풍부한 하천은 믿을 만한 터빈을 돌리며, 간나가와 같은 양수 발전소는 값싼 야간 전력을 저녁 피크 시간대를 위해 비축합니다. 개조된 댐은 나라가 이미 보유한 설비에서 더 많은 출력을 끌어냅니다. 이 흐름은 깨끗하고 국산이며 꾸준합니다."
 JAP_hydroelectric_power_TT: "§Y[613.GetName]§!, §Y[615.GetName]§!, §Y[616.GetName]§!의 수력 발전량 §G25%§! 증가"
 JAP_geothermal_development: "열도 아래의 불"
 JAP_geothermal_development_desc: "일본 금속 에너지 안전보장 기구는 국립공원과 온천 소유주의 반대를 무릅쓰고 하치조지마에서 아피 고원에 이르기까지 지열 탐사에 자금을 댑니다. 바이너리 사이클 발전소는 날씨와 상관없이 밤낮으로 꾸준한 전력을 공급하며, 불의 고리의 열을 끌어다 전력망에 보탭니다."
 JAP_geothermal_development_TT: "§Y[609.GetName]§!, §Y[616.GetName]§!, §Y[617.GetName]§!의 지열 발전량 §G25%§! 증가"
 JAP_nuclear_restart: "원자로 재가동"
 JAP_nuclear_restart_desc: "녹색 전환 정책 아래 정부는 규슈의 센다이에서 동해 연안의 광대한 가시와자키가리와 단지에 이르기까지 원전 전체를 다시 가동합니다. 규제 당국은 엄격하고 국민은 경계하지만, 에너지 안보의 셈법은 냉정합니다. 원자력이 다시 한번 기저 부하를 떠맡아야 합니다.\n-------------\n원자력 발전을 다시 활성화하고 각 발전소를 하나씩 재가동하는 §Y원자로 재가동 프로그램§!을 개시합니다. 센다이, 이카타, 후쿠이 단지는 즉시 가동할 수 있으며, 더 까다로운 부지는 규제 및 동의 중점이 완료되는 대로 뒤따릅니다."
 JAP_nuclear_regulatory_compliance: "신안전 기준 충족"
 JAP_nuclear_regulatory_compliance_desc: "재가동을 원하는 발전소는 세계에서 가장 엄격한 원자력규제위원회의 기준을 통과해야 합니다. 내진 및 쓰나미 보강, 의무 안전 시설, 그리고 신뢰만으로는 아무것도 허락하지 않는 심사가 그것입니다. 작업은 더디고 막대한 비용이 들지만 가동 가능한 원전군으로 가는 유일한 길입니다. 이를 통과한 발전소는 이전보다 더 잘 가동됩니다.\n-------------\n§Y강화된 원자력 안전 기준§! 정신을 해제하고 겐카이, 오나가와, 시마네 재가동을 개시합니다."
 JAP_local_consent_accords: "지역 동의 확보"
 JAP_local_consent_accords_desc: "재가동에는 규제 당국의 승인 이상이 필요합니다. 현 지사와 입지 지자체가 사실상 거부권을 쥐고 있고 지방법원이 이전에 가처분을 내린 적도 있기 때문입니다. 가고시마와 에히메는 보조금, 일자리, 인내심 있는 지역 신뢰 구축으로 이루어진 입지 공동체 협정을 협상하여 센다이와 이카타를 통과시켰습니다. 보조금 체제는 비용이 많이 들지만 가장 어려운 재가동을 가능하게 하는 유일한 수단입니다.\n-------------\n나라에서 가장 어려운 두 부지인 도마리와 가시와자키가리와 재가동을 개시합니다."
 JAP_restart_flagship_fleet: "롯카쇼 핵연료 주기"
 JAP_restart_flagship_fleet_desc: "아오모리의 롯카쇼 재처리 공장은 핵연료 주기를 완결하여 사용후핵연료에서 플루토늄과 우라늄을 회수해 새 원자로에 쓰게 합니다. 일본은 분리된 플루토늄과 이를 더 농축할 상시 능력을 보유하고 있으며, 베이징, 서울, 평양은 이 사실을 단 한 번도 놓친 적이 없습니다.\n-------------\n일본의 이웃 나라들은 이 비축량을 §R곱지 않은 시선§!으로 바라볼 것입니다."
 JAP_decommissioning_authority: "긴 가동 중단"
 JAP_decommissioning_authority_desc: "원전군을 안전하게 해체하는 데는 수십 년이 걸리며, 줄어드는 원자력 기술자 인력을 붙들어 두어야 하고 원자로가 식은 뒤에도 오랫동안 부지를 관리해야 합니다. 국민은 한결 안심하지만 재무상태표는 그렇지 못합니다. 세계의 모든 노후 원전군이 같은 결산을 마주하고 있으며, 이 작업을 먼저 숙달한 나라는 그 전문성을 모두에게 팔 수 있습니다.\n-------------\n주파수 변환기, 홋카이도 연계선, 고베 수소 프로젝트를 개시합니다."
 JAP_lng_bridge_supply: "화석 연료 가교"
 JAP_lng_bridge_supply_desc: "액화천연가스와 석탄이 가동 중단된 원자로가 남긴 공백을 메우며, 일본을 세계 최대의 LNG 수입국으로 만듭니다. 훗쓰와 센보쿠의 가스 화력 발전소는 빠르게 지어 힘차게 돌릴 수 있지만, 모든 화물은 외화로 값을 치러야 합니다. 그 차액은 가정의 전기요금이 짊어집니다.\n-------------\n가교이지만 §R값비싼§! 가교입니다. 암모니아 혼소 프로젝트가 결국 일본이 이 가교에서 벗어나는 길입니다."
 JAP_renewable_acceleration: "태양, 바람, 그리고 물"
 JAP_renewable_acceleration_desc: "아키타와 지바 해역의 해상 풍력 입찰, 대규모 태양광, 개정된 전력망 접속 규칙은 고정가격매입제만으로는 이루지 못했던 속도로 재생 에너지 비중을 끌어올립니다. 간헐성과 전력망 한계는 여전하며, 가장 저렴한 킬로와트시는 여전히 일본이 쓰지 않는 법을 익힌 그 한 단위입니다."
 JAP_fusion_energy_program: "확대 접근"
 JAP_fusion_energy_program_desc: "일본은 ITER 유치를 포기하는 대신 확대 접근을 택했습니다. 롯카쇼의 핵융합 소재 가속기와 국제 연구 센터, 나카의 JT-60SA 토카막입니다. 초전도 코일, 자이로트론, 플라스마 물리학에서의 오랜 수련이 그 거래의 대가입니다.\n-------------\n원자로가 재가동되든 폐쇄되든 핵융합의 타당성은 변함없습니다. 이것은 §Y어느 길도 가로막지 않는§! 유일한 에너지 투자입니다."
 JAP_national_energy_security: "전력을 갖춘 나라"
 JAP_national_energy_security_desc: "복원된 기저 부하든 재생 에너지와 저장 설비의 전력망이든 안정적이고 탄력적인 공급이 핵분열을 넘어서는 연구 기반 위에 놓입니다. 에너지 안보는 더 넓은 경제의 토대가 됩니다."
 JAP_monarchy_resource_anchor_tt: "§Y$JAP_rare_earth_resilience$§!의 효과가 향상됩니다"
 JAP_reactors_recommissioned_tt: "폐쇄된 원자로가 §G재가동 승인§!되어 다시 전력을 생산할 수 있습니다"
 JAP_national_energy_security_tt1: "원자로 부지 §Y8§!곳 중 §Y6§!곳이 재가동된 경우 (현재 §Y[?JAP_reactor_sites_online|0]§!):"
 JAP_national_energy_security_tt2: "녹색 전환 프로젝트 §Y8§!건 중 §Y6§!건이 완료된 경우 (현재 §Y[?JAP_gx_projects_completed|0]§!):"
 JAP_national_energy_security_tt3: "어느 쪽 기준도 충족하지 못한 경우:"
 JAP_minamitori_deep_sea: "미나미토리의 진흙"
 JAP_minamitori_deep_sea_desc: "미나미토리시마 주변 일본 배타적 경제수역의 해저에는 지구상 어디에서도 찾을 수 없는 농도의 희토류 진흙이 5천 미터 넘는 물밑에 놓여 있습니다. JOGMEC과 도쿄대학은 채굴 자체를 가능케 할 라이저 파이프와 양수 시험에 자금을 댑니다. 진흙을 끌어올릴 수 있다면 일본은 자석과 모터에 필요한 금속을 단일 외국 공급처에 의존하는 일에서 벗어납니다."
 JAP_national_petroleum_stockpile: "국가 비축분 채우기"
 JAP_national_petroleum_stockpile_desc: "일본 금속 에너지 안전보장 기구는 시부시, 기이레, 도마코마이의 해안 탱크 기지에 보관된 전략 석유 비축량을 확대하고 암염 공동 및 지상 저장고를 추가합니다. 더 큰 비축량은 호르무즈 해협이 봉쇄될 경우에 대비한 몇 달 치 보험을 나라에 마련해 줍니다. 가득 찬 탱크는 조용한 힘입니다."
 JAP_grid_battery_storage: "미래의 전력망"
 JAP_grid_battery_storage_desc: "리튬 이온 시대의 베테랑인 GS 유아사와 파나소닉은 셀을 전력망 규모 저장 설비로 돌리고, 국가 보조금은 변전소 옆에 들어서는 배터리를 뒷받침합니다. 더 똑똑한 전력망과 결합된 저장 설비는 피크를 완화하고 골을 메웁니다. 정오에 아낀 전자가 해 질 녘 도시를 밝힙니다."
 JAP_urban_mining: "도시를 채굴하라"
 JAP_urban_mining_desc: "나오시마와 오나하마 제련소에서 미쓰비시 머티리얼은 전 세계에서 들어온 전자 폐기물로부터 금, 구리, 희소 금속을 회수합니다. 도쿄 올림픽의 메달은 재활용 금속으로 주조되었습니다. 나라가 버리는 것을 다시 녹여 새것으로 만듭니다."
 JAP_horizontal_recycling: "끝없는 금속"
 JAP_horizontal_recycling_desc: "수평 재활용은 알루미늄과 강철을 원래 등급으로 되돌려 고물상과 압연 공장 사이의 고리를 닫습니다. UACJ와 고베 제강소는 캔에서 캔으로, 부품에서 부품으로의 회수가 산업 규모로 작동하게 하는 선별 및 정련 라인을 세웁니다. 유통에 남겨 둔 1톤은 다시는 수입하지 않아도 되는 1톤입니다."
 JAP_nankai_methane_hydrate: "난카이 해곡의 불타는 얼음"
 JAP_nankai_methane_hydrate_desc: "일본 금속 에너지 안전보장 기구는 태평양 연안 난카이 해곡에 갇힌 메탄 하이드레이트를 상업적으로 채굴할 방법을 찾아 연구선을 밀어붙입니다. 일본은 그곳에서 세계 최초의 해상 생산 시험을 수행했으나 기술은 아직 입증되지 않았고 경제성은 여전히 만만치 않습니다. 불타는 얼음이 결실을 맺는다면 일본은 다시는 가스를 구걸할 필요가 없습니다."
 JAP_model_competition: "동아시아 전자 경쟁"
 JAP_model_competition_desc: "일본의 전자 산업은 이웃 나라들과 쉼 없는 경쟁에 갇혀 있습니다. 삼성과 SK하이닉스는 메모리를 지배하고, TSMC는 최첨단 파운드리 사업을 장악하며, 중국의 팹들은 바닥을 모르는 국가 기금의 지원을 받아 공정을 한 단계씩 올라옵니다. 경쟁자의 모든 진전은 잃어버린 시장이고, 쥐어짜인 이윤이며, 해외로 유혹당한 기술자 세대입니다. 지속적인 투자만이 압박을 막아 내며, 경쟁이 거세지는데 느슨해지면 일본의 발밑 땅이 무너집니다.\n-------------\n§Y전자 회복력§!을 경쟁 압력 이상으로 끌어올리면 압력이 줄어들다가 결국 이 국가 정신이 사라집니다. 현재 수치는 §Y$JAP_technological_isolation_category$§!에서 확인하십시오."
 JAP_consumer_electronics_drive: "소비자 전자 추진"
 JAP_consumer_electronics_drive_desc: "업계가 폭풍을 견디는 동안 국내 소비자 전자 라인을 최대 가동률로 유지하여 공장, 협력업체, 이를 조립하는 숙련 인력을 지탱하려는 기한부 추진입니다."
 JAP_foundry_localization: "파운드리 현지화 프로그램"
 JAP_foundry_localization_desc: "새 팹 주변의 장비, 소재, 숙련 기술자를 갖추어 국내 반도체 생산이 빠르게 확대될 수 있도록 파운드리 공급망을 현지화하려는 집중적인 노력입니다."
 JAP_electronics_export_offensive: "전자 수출 공세"
 JAP_electronics_export_offensive_desc: "보조금, 무역 사절단, 공동 마케팅을 조율하여 외국 경쟁자에게 빼앗긴 시장 점유율을 되찾고, 세계 전자 무역에서 일본의 입지를 다지기 위해 막대한 자금을 투입합니다."
 JAP_electronics_resilience_up_tt: "외국 경쟁에 맞선 §Y전자 회복력§!: $RIGHT|+=0$"
 JAP_CHI_chip_rivalry: "반도체 경쟁"
 JAP_electronics.1.t: "따라붙는 아시아의 도전자들"
 JAP_electronics.1.d: "도쿄에서 분기 실적은 암울하게 읽힙니다. 삼성과 SK하이닉스는 메모리에서 격차를 벌렸고, TSMC의 수주 잔고는 터질 지경이며, 중국 파운드리들은 한때 으레 일본으로 오던 계약을 따내고 있습니다. 분석가들은 일본 전자 부문이 구조적 쇠퇴에 빠졌다고 공공연히 말합니다. 가와사키와 오사카의 경영진은 그 진실을 압니다. 경쟁자들은 더 이상 따라잡는 것이 아니라 앞서 나가고 있습니다."
 JAP_electronics.1.a: "싸우지도 않고 시장을 내줄 수는 없다."
 JAP_electronics.2.t: "최전선에 도달한 중국"
 JAP_electronics.2.d: "소식은 망치로 내려치듯 날아듭니다. 국가 집적회로 기금의 지원을 받고 수년간의 서방 제재에도 굴하지 않은 중국의 팹들이, 지구상에서 손에 꼽는 기업만이 닿을 수 있는 로직 제조의 최첨단에 도달했습니다. 대륙이 한 세대 뒤처져 있다는 일본 산업의 마지막 안일한 가정은 사라졌습니다. 최전선은 이동했고, 일본은 도전에 맞설지 그 뒤안길에 남을지 결정해야 합니다."
 JAP_electronics.2.a: "최전선은 이동했다. 우리는 응답해야 한다."
 JAP_electronics.3.t: "실리콘 왕관을 되찾은 일본"
 JAP_electronics.3.d: "역경을 딛고 조류가 바뀌었습니다. 일본의 팹은 대량으로 출하하고 있고, 일본의 소재는 여전히 없어서는 안 되며, 일본의 설계와 콘텐츠는 전 세계에서 존중받습니다. 서울, 타이베이, 상하이의 경쟁자들이 사라진 것은 아니지만, 한 세대 만에 처음으로 그들이 어깨 너머를 살피는 쪽이 되었습니다. 긴 후퇴는 끝났고, 일본은 다시 강자의 위치에서 경쟁합니다."
 JAP_electronics.3.a: "일본이 다시 업계의 정상에 선다."
 JAP_electronics.4.t: "반도체 최전선으로 복귀한 일본"
 JAP_electronics.4.d: "홋카이도에서 규슈에 이르는 팹에서, 연구소와 게임 스튜디오와 광케이블 공사 현장에서, 일본은 거의 아무도 가능하다고 생각하지 않았던 재도약을 완수했습니다. 10년 전 전자 시대의 퇴물 기득권자로 치부되던 나라가 최첨단으로 기어올라 그곳에 머물겠다는 의지를 알렸습니다. 동아시아 기술 경쟁의 균형추가 움직였고, 서울에서 워싱턴에 이르는 모든 수도가 계산을 다시 하고 있습니다."
 JAP_electronics.4.a: "놀라운 재도약이다."
 JAP_demographic_pressure_modifier: "인구 압박"
 JAP_demographic_pressure_modifier_desc: "일본은 세계에서 가장 고령화되고 가장 빠르게 줄어드는 사회 중 하나로, 사망자가 출생아를 웃돌고 생산 가능 인구가 급격히 감소하고 있습니다. 이 위기는 생산을 지탱하는 노동력을 압박하고, 복지 및 의료 예산을 한계까지 늘리며, 재정 안정을 갉아먹고, 사회 구조를 시험합니다. 인구, 노동력, 안정도, 실업, 의료비, 사회 비용의 여섯 축에서 일본은 서로 얽힌 압박에 직면해 있습니다. 가족 친화, 고용, 이민 정책에 걸친 지속적이고 다각적인 개혁은 이러한 부담을 덜고 나라를 안정적이거나 증가하는 인구의 길로 올려놓을 수 있습니다."
 JAP_economy_modifier: "일본 경제"
 JAP_economy_modifier_desc: "일본 경제 쇄신의 공통된 엔진입니다. 역대 정부가 인구 감소와 한국, 중국, 대만의 거세지는 경쟁에 맞서면서, 개혁은 경제의 모든 기둥에 미칩니다. 국민을 먹이는 농지와 어장, 수출을 떠받치는 자동차 제조사와 공작기계 업체, 침체를 벗어나려 질주하는 반도체와 전자 업계의 강자, 자체 자원이 거의 없는 열도를 위한 에너지와 핵심 자원 확보 노력, 그리고 섬들을 하나로 엮는 철도 대동맥입니다. 모든 진전은 여기에 복리로 쌓여 생산성, 공장 효율, 연구를 끌어올리는 동시에 일본이 산업, 자원, 전력망에 거는 요구를 재편합니다."
 JAP_political_modifier: "고쿠카이"
 JAP_political_modifier_desc: "인구 위기에 대응하여 추진된 개혁이 국가 정치를 재편하고 있으며, 나라를 이주에 개방하는 한편 변화에 익숙하지 않은 국가의 사회적 결속과 안정을 시험합니다."
 JAP_f15_programe_desc: "미쓰비시가 면허 생산한 F-15J 기단은 단계적 현대화를 거칩니다. 남길 가치가 있는 기체에는 새로운 레이더, 임무 컴퓨터, 조종석 디스플레이를 달고, 나머지는 합리화된 공급망으로 지원합니다. 전투기 및 항공우주 연구가 빨라지고 경형 및 중형 기체는 더 싸게 생산됩니다."
 JAP_submarine_modernization_idea_desc: "디젤-전기 잠수함 전력은 공기 불요 추진으로, 이후에는 리튬 이온 전지로 전환하여 원자로 없이 잠항 지속 시간을 늘립니다. 가와사키와 미쓰비시가 고베에서 선체를 번갈아 건조하여 두 조선소의 역량을 유지하고 단가를 낮춥니다."
 JAP_carrier_aviation_desc: "고정익 해군 항공 전력이 1945년 이후 처음으로 일본 함대에 돌아옵니다. 헬리콥터 구축함은 항공함으로 재평가되고, 단거리 이륙 항공기를 위한 갑판 코팅과 승강기가 연구되며, 함재 항공단을 운용하는 교리 작업이 본격적으로 시작됩니다."
 JAP_keen_sword_operation_idea_desc: "미국과의 격년 합동 훈련은 해상자위대를 홀로는 도달할 수 없는 규모의 연합 함대 기동, 상륙, 방공 훈련으로 이끕니다. 승조원들은 더 날카로워져 돌아오고, 교훈은 훈련보다 오래 남습니다."
 JAP_nuclear_power_program: "장기 원자력 프로그램"
 JAP_nuclear_power_program_desc: "52기의 원자로가 국가 전력의 약 3분의 1을 공급하고 있으며, 원자력위원회의 장기 계획은 일본이 롯카쇼 재처리를 중심으로 한 핵연료 주기 폐쇄를 추진하도록 규정하고 있습니다. 운영 실적은 훌륭하지만 지역 사회의 동의는 무너졌습니다. 도카이무라 JCO 공장의 임계 사고로 노동자 두 명이 사망하면서 업계와 규제 당국에 대한 대중의 신뢰가 파괴되었고, 2000년 3월 정부는 제안된 20개 발전소 전체의 건설 계획을 재검토에 부쳤습니다. 마키 정이 주민 투표로 원자로를 거부한 이후, 어느 현도 새로운 부지를 수용하리라고 기대할 수 없게 되었습니다."
 JAP_nuclear_local_consent: "지역 동의 협정"
 JAP_nuclear_local_consent_desc: "현 지사와 유치 지자체는 구속력 있는 안전 협정, 수익 분배, 재가동에 대한 사전 협의권을 통해 다시 절차에 참여하게 되었습니다. 한 세대 동안 일본의 원전 건설을 가로막았던 거부권은 강행 돌파가 아닌 협상을 통해 해소되었으며, 전력 회사들은 다시 신규 설비를 계획할 수 있게 되었습니다."
 JAP_consolidate_national_defense_framework_cancel_tt: "§Y제9조§!의 §Y안정도§! 보너스가 사라지고 §Y전쟁 지지도§!와 §Y모집 가능 인구§!에 대한 페널티가 완전히 해소되면 종료됩니다"
 JAP_modernize_joint_command_cancel_tt: "§Y제9조§!의 §Y육군, 공군 및 해군 경험치 획득§!, §Y지휘력§!, §Y장교 비용§!에 대한 페널티가 완전히 해소되면 종료됩니다"
 JAP_normalize_defense_procurement_mission: "방위 조달 체계 정상화"
 JAP_normalize_defense_procurement_mission_desc: "방위 책임의 확대는 기존의 조달 및 산업 체계에 큰 부담을 주었습니다. 일본은 신중한 개혁과 장기 계획, 업계와의 긴밀한 협조를 통해 방위 조달을 정상화하고 전환기의 비효율을 줄이기 위해 노력합니다.\n\n$JAP_article9_mission_explainer_tt$"
 JAP_normalize_defense_procurement_cancel_tt: "§Y제9조§!의 §Y육군 공격§!과 §Y육군 방어§!에 대한 페널티가 완전히 해소되고 §Y중핵 영토 공격§!과 §Y중핵 영토 방어§! 보너스가 사라지면 종료됩니다"
 JAP_establish_asteroid_mining_network_mission: "소행성 채굴 네트워크 구축"
 JAP_establish_asteroid_mining_network_mission_desc: "일본은 최초의 소행성 채굴 네트워크를 구축하고 있으며, 지구 밖 자원 사업이 본격화됨에 따라 궤도 플랫폼을 배치하고 탐사 장비를 투입하고 있습니다."
 JAP_reactor_restart_category: "원자로 재가동 계획"
 JAP_reactor_restart_category_desc: "한때 54기의 원자로가 일본 전력의 3분의 1을 공급했습니다. 2011년 이후 그 모두가 멈췄고, 이를 되살리는 일은 단일한 결정이 아니라 발전소별, 현별로 치러야 하는 싸움입니다. 재가동마다 수년이 걸리는 규제 심사와, 겁먹은 유권자에게 책임을 지는 지사의 동의, 수천억 엔에 달하는 내진 보강 비용이 요구됩니다. 그 대가로 얻는 것은 이 나라가 가질 수 있는 가장 값싼 기저 전력입니다.\n\n재가동이 완료될 때마다 일본의 원자력 발전이 §G영구적으로 향상§!되고 원전 설비 유지 비용이 낮아집니다."
 JAP_restart_sendai: "센다이 재가동"
 JAP_restart_sendai_desc: "가고시마현 사쓰마센다이에 있는 규슈전력의 가압수형 원자로 2기는 전국에서 가장 먼저 새 안전 기준을 통과하였으며, 2015년 8월 센다이 1호기는 거의 2년 만에 전력을 생산한 일본 최초의 원자로가 되었습니다. 이토 지사의 동의가 이를 가능하게 했고, 방조제와 필터 벤트, 긴급 통제 센터가 이를 정당화했습니다."
 JAP_restart_ikata: "이카타 재가동"
 JAP_restart_ikata_desc: "시코쿠전력의 발전소는 에히메현의 좁은 사다미사키 반도에 자리 잡고 있으며, 몇 킬로미터 앞바다에는 중앙구조선이 지나갑니다. 3호기는 2016년에 운전을 재개했으나 이후 인접 현 법원들에 의해 여러 차례 정지와 복구를 겪었습니다. 일본의 어떤 발전소도 규제 당국의 허가가 싸움의 절반에 불과하다는 점을 이보다 잘 보여 주지 못합니다."
 JAP_restart_takahama_ohi: "후쿠이 원전군 재가동"
 JAP_restart_takahama_ohi_desc: "후쿠이현에는 일본에서 가장 밀집한 원자로 단지가 있습니다. 다카하마, 오이, 미하마의 간사이전력 원자로들은 수십 년 동안 오사카와 고베의 산업에 전력을 공급했으며, 그중 여러 기는 이제 40년을 넘겨 운전하려면 논란이 큰 별도의 연장 승인이 필요할 만큼 낡았습니다. 이 단지를 재가동하면 산업 중심지의 전력 공급이 한 번에 복원됩니다."
 JAP_restart_genkai: "겐카이 재가동"
 JAP_restart_genkai_desc: "사가현에 있는 규슈전력의 발전소는 새 규정에 따라 지은 최초의 전문 안전 시설 중 하나를 포함한 보강 공사를 거쳐 2018년에 복귀했습니다. 겐카이는 또한 일본의 플루서멀 계획을 담당하여, 원자로와 롯카쇼 재처리 공장 사이의 순환 고리 일부를 닫는 혼합산화물 연료를 연소합니다."
 JAP_restart_onagawa: "오나가와 재가동"
 JAP_restart_onagawa_desc: "미야기현의 오나가와는 후쿠시마 제1원전보다 2011년 지진의 진앙에 더 가까웠으나 14미터 높이의 방조제가 버텨 냈습니다. 마을은 발전소 자체의 체육관에 피난민들을 수용했습니다. 2024년 2호기를 복귀시킨 것은 제1원전에서 실패했던 것과 같은 유형의 비등수형 원자로를 최초로 재가동한 일이었으며, 업계가 가진 가장 강력한 논거였습니다."
 JAP_restart_shimane: "시마네 3호기 완공"
 JAP_restart_shimane_desc: "주고쿠전력의 발전소는 일본에서 유일하게 도청 소재지 안, 마쓰에 시 변두리에 입지한 원자력 발전소입니다. 3호기는 건설이 끝났으나 가동되지 못한 채 긴 가동 중단 기간 내내 완공된 상태로 방치되었습니다. 이를 가동하는 것은 재가동이 아니라 첫 가동이며, 이 과정에서 되찾은 건설 전문 기술은 다시는 사라지지 않을 것입니다."
 JAP_restart_tomari: "도마리 재가동"
 JAP_restart_tomari_desc: "홋카이도전력의 도마리 원자로 3기는 북쪽 섬의 유일한 원자력 발전소이며, 이를 잃은 홋카이도는 가느다란 연계선과 노후한 화력 설비에 의존하게 되었고, 2018년의 섬 전체 정전이 이를 뼈저리게 드러냈습니다. 부지의 지진 재평가는 십 년 넘게 질질 끌었습니다. 도마리를 복구해야 홋카이도의 전력망이 온전해집니다."
 JAP_restart_kashiwazaki_kariwa: "가시와자키 가리와 재가동"
 JAP_restart_kashiwazaki_kariwa_desc: "니가타 해안의 7개 호기 덕분에 이곳은 세계 어디에도 없던 최대 규모의 원자력 발전소입니다. 또한 후쿠시마를 잃은 기업 도쿄전력의 것이며, 니가타 지사들은 수년간 그 사실을 잊기를 거부해 왔습니다. 이곳의 보안 허점으로 인해 한때 회사는 운전 허가를 아예 잃기도 했습니다. 가시와자키 가리와를 되살릴 수 있다면 원전군에 손이 닿지 않을 곳은 없습니다."
 JAP_gx_transition_category: "녹색 전환"
 JAP_gx_transition_category_desc: "원자로 없는 일본은 다른 곳에서 전력을 찾아야 하는데, 이 열도에는 바람과 열과 기술자 외에는 모든 것이 부족합니다. 녹색 전환이 그 해답입니다. 닻을 내리기엔 너무 깊은 바다의 부유식 터빈, 북부 산악 아래의 화산열, 마침내 50헤르츠와 60헤르츠의 경계를 가로질러 이어지는 전력망, 그리고 무엇보다 누구도 생각지 못한 만큼 적게 쓰는 국가적 재능이 그것입니다.\n\n프로젝트가 완료될 때마다 일본의 재생 에너지 생산량이 §G영구적으로 향상§!되거나 국가 수요가 줄어들며, 해당 지역의 원자로는 영구히 폐쇄됩니다."
 JAP_gx_goto_floating_wind: "고토 부유식 해상 풍력"
 JAP_gx_goto_floating_wind_desc: "일본 앞바다의 해저는 북해에서 쓰이는 고정식 기초를 쓰기엔 너무 가파르게 꺼지기 때문에, 이 나라의 해상 풍력 구상은 깊은 바다에 계류하는 부유식 플랫폼에 달려 있습니다. 나가사키현 고토 열도 앞바다의 단지는 이 기술의 시험장이며, 한때 유조선을 건조하던 조선소가 선체를 제작하기에 가장 적합한 장소입니다."
 JAP_gx_tohoku_geothermal: "도호쿠 지열 단지"
 JAP_gx_tohoku_geothermal_desc: "일본은 세계에서 세 번째로 큰 지열 매장량을 보유하고 있으나 거의 활용하지 못하는데, 국립공원 경계와 시추로 물이 줄어들까 두려워하는 온천 업주들이 가로막고 있기 때문입니다. 이와테현의 아피는 2024년 이 교착 상태를 깨고 수십 년 만의 대규모 지열 발전소가 되었습니다. 화산이 있는 곳에 전력이 있으며, 그것은 어둠 속에서도 바람 없는 날에도 흐릅니다."
 JAP_gx_kanto_setsuden: "세쓰덴 캠페인"
 JAP_gx_kanto_setsuden_desc: "재해 이후의 여름, 도쿄는 그저 덜 썼습니다. 사무실은 조명을 낮추고 넥타이를 벗었으며, 공장은 교대 근무를 주말로 옮겼고, 수도는 모두가 예견했던 정전 없이 피크를 넘겼습니다. 세쓰덴은 비상 조치로 여겨졌습니다. 건축 기준, 산업 표준, 톱러너 제도를 통해 상시화된 지금 그것은 발전소 하나보다 가치가 크면서 그 일부의 비용만 듭니다."
 JAP_gx_frequency_converter: "주파수 변환 설비 확장"
 JAP_gx_frequency_converter_desc: "도쿄는 1890년대에 독일제 발전기를 들여왔기에 50헤르츠로, 오사카는 미국제를 들여왔기에 60헤르츠로 돌아갑니다. 한 세기가 지난 지금도 나라의 두 반쪽은 전력을 자유롭게 주고받지 못하며, 2011년 도쿄가 암흑에 빠졌을 때 서부는 동쪽으로 겨우 1기가와트를 흘려보낼 수 있었을 뿐입니다. 사쿠마, 신시나노, 히가시시미즈의 변환소를 확장하면 마침내 둘로 나뉜 전력망이 하나의 전국 전력망이 됩니다."
 JAP_gx_hokkaido_hvdc: "홋카이도 연계선"
 JAP_gx_hokkaido_hvdc_desc: "홋카이도는 일본 최고의 풍력 자원을 가졌으나 이를 쓸 인구는 가장 적어, 혼슈가 수입 가스를 태우는 동안 터빈은 출력이 제한되는 상황이 벌어집니다. 동해 연안을 따라 내려가는 고압 직류 송전선은 북쪽의 바람을 수요가 있는 곳으로 실어 나르며, 2018년 섬 전체 정전 때도 전등을 켜 둘 수 있었을 것입니다."
 JAP_gx_kobe_hydrogen: "고베 수소 공급망"
 JAP_gx_kobe_hydrogen_desc: "세계 최초의 액화수소 운반선이 2022년 고베에 입항하여, 오스트레일리아의 갈탄 광산에서 포트 아일랜드의 터미널로 이어지는 공급망을 완성했습니다. 수소는 탄소 없이 연소하며 터빈이 만들어 낸 전력 중 전력망이 아직 쓰지 못하는 것을 저장하는데, 가와사키 중공업은 십 년 동안 이를 다룰 운반선과 저장 탱크, 터빈을 만들어 왔습니다."
 JAP_gx_hekinan_ammonia: "암모니아 혼소"
 JAP_gx_hekinan_ammonia_desc: "아이치현 헤키난의 석탄 발전소는 전국 최대이며, JERA는 이곳 보일러에 석탄과 함께 암모니아를 넣어 왔는데, 처음엔 5분의 1 비율로 시작하여 꾸준히 비율을 높이고 있습니다. 암모니아는 선박과 배관이 이미 다룰 줄 아는 형태로 수소를 실어 나르며, 기존 화력 발전소를 허물고 다시 짓지 않고도 연료를 덜 태우게 해 줍니다."
 JAP_gx_shikoku_solar_storage: "시코쿠 태양광 및 저장"
 JAP_gx_shikoku_solar_storage_desc: "시코쿠는 일본에서 햇빛이 가장 강하고 전력망은 정오의 태양광 출력을 둘 곳이 없어 제한해야 할 만큼 작습니다. 대규모 발전 단지에 전력망 배터리를 짝지으면 잉여 전력이 정오에서 저녁 피크로 옮겨 가며, 이는 서류상에만 존재하는 재생 발전 용량과 실제로 쓰이는 재생 전력의 차이를 가릅니다."
 JAP_rubber_butadiene_branch_decision: "부타디엔 고무 부문"
 JAP_rubber_butadiene_branch_decision_desc: "천연 고무는 차단될 수도, 배급제로 묶일 수도, 가격으로 약점이 될 수도 있으며, 일본은 그러한 지렛대가 존재하도록 놔둘 수 없습니다. 우리는 부타디엔 기반 합성 고무 부문을 확장하여 산업과 군대에 필요한 타이어, 밀봉재, 핵심 부품을 확보하겠습니다."
 JAP_demand_south_kuril_reject_tt: "§Y$STATE_1168$§!을 두고 §Y국경 전쟁§!을 개시하거나, §R[SOV.GetName]에 선전포고§!하여 북방 영토를 무력으로 차지할 수 있습니다"
 JAP_demand_north_kuril_reject_tt: "§Y$STATE_1168$§!을 두고 §Y국경 전쟁§!을 개시하거나, §R[SOV.GetName]에 선전포고§!하여 북방 영토를 무력으로 차지할 수 있습니다"
 JAP_demand_sakhalin_reject_tt: "§Y$STATE_691$§!에 대한 §Y특수 부대 습격§!을 잠금 해제하거나, §R[SOV.GetName]에 선전포고§!하여 북방 영토를 무력으로 차지할 수 있습니다"
 JAP_claiming_philippines: "필리핀 제도 영유권 주장"
 JAP_claiming_philippines_desc: "필리핀 제도는 서태평양으로 향하는 접근로와 우리 산업을 먹여 살리는 해상 교통로를 장악하고 있습니다. 우리는 공식적으로 영유권을 주장하고, 다른 나라의 동의 여부와 관계없이 이 섬들이 일본의 전략적 영향권에 속함을 분명히 하겠습니다. 선언이 이루어지면 이 지역은 우리 해군이 이 해역을 누가 통과할지 결정하려 한다는 것을 이해하게 될 것입니다."
 JAP_demographic_emergency_taskforce: "저출산 긴급 대응"
 JAP_demographic_emergency_taskforce_desc: "인구 붕괴에 대응하여 정부는 아동가정청의 구조를 본뜬 범정부 비상 대책반을 설치하고, 관련된 모든 부처에 걸쳐 자원의 신속한 투입을 조율하고 있습니다. 정치적 관심이 집중되고, 관료제의 칸막이가 허물어지며, 정책 실험이 쏟아져 나올 수 있게 됩니다. 이 집중과 동원의 시기는 일시적이며, 730일의 지속적인 노력 뒤에는 비상 분위기가 가라앉고 정책 수립은 통상의 제도적 양상으로 돌아가지만 개혁 자체는 남습니다."
 JAP_increase_birth_budget: "긴급 아동수당 두 배 인상"
 JAP_increase_birth_budget_desc: "일본은 아동수당 제도에 긴급 국고 자금을 투입하여 자녀가 있는 가구에 대한 직접 현금 지급을 두 배로 늘립니다. 이 즉각적이고 눈에 띄는 지출은 젊은 가정에 숨통을 틔워 주고 양육에 대한 국가의 의지를 알려 단기적으로 출산율을 끌어올립니다. 장기 비용은 상당하여 영구적인 수급 예산을 부풀리지만, 출생이 저조한 동안에는 인구학적 배당이 이 비용을 정당화합니다."
 JAP_child_care_subsidies: "유아 교육 및 보육 전면 무상화"
 JAP_child_care_subsidies_desc: "2019년 10월 정책에 따라 일본은 모든 가정에 유아 교육과 보육을 무상으로 제공하여 어린이집과 유치원의 수업료를 없앱니다. 이 보조금은 부모의 취업에 대한 주요 장벽을 제거하여, 돌봄 담당자(주로 어머니)가 노동 시장으로 복귀하고 소득이 빠듯한 가구가 더 많은 자녀를 가질 수 있게 합니다. 비용은 크지만 고용 증가와 완만한 출산율 개선을 모두 가져옵니다."
 JAP_invest_in_robotics: "소사이어티 5.0 자동화 추진"
 JAP_invest_in_robotics_desc: "일본은 2015년 신로봇전략을 가속하여, 부족한 노동자를 보완하기 위해 산업 자동화, AI, 로봇공학에 보조금을 지급합니다. 건설, 제조, 물류에서 인간 노동을 기계로 대체함으로써 일본은 더 적은 노동력으로 생산량을 유지할 수 있습니다. 이 전략은 자본 집약적이나 강력하지만, 저숙련 노동자의 대체로 인해 운영·유지보수 분야에서 새 일자리가 생기기 전까지는 실업이 처음에는 늘어날 수 있습니다."
 JAP_fertility_ivf_program: "체외수정 보험 적용"
 JAP_fertility_ivf_program_desc: "일본은 체외수정(IVF)과 보조생식기술에 대한 보험 적용을 확대하여, 소득에 관계없이 자격을 갖춘 모든 부부가 치료를 받을 수 있게 합니다. 2022년부터 시행되는 보험 보조금은 불임 치료의 경제적 장벽을 없애, 그렇지 않았다면 아이가 없었을 부부가 자녀를 가질 수 있게 합니다. 출산율에 미치는 영향은 크지만 의료 제도의 비용 부담이 급격히 늘어 공공 재정에 압박을 줍니다."
 JAP_family_housing_construction: "적정가 가족 주택 계획"
 JAP_family_housing_construction_desc: "일본은 육아 가구를 겨냥한 적정 가격의 가족 규모 주택의 대규모 건설에 자금을 댑니다. 높은 땅값과 주거비는 가정을 꾸리는 데 큰 장벽이며, 보조금을 받은 건설은 젊은 부부가 결혼해 자녀를 갖는 데 필요한 재정적 문턱을 낮춥니다. 이 계획은 자본 집약적이나 젊은 가정에 내 집 마련의 믿을 만한 길을 제시함으로써 사회를 안정시키고, 그들의 미래에 대한 국가의 의지를 알립니다."
 JAP_marriage_support_program: "신혼부부 지원 사업"
 JAP_marriage_support_program_desc: "일본은 곤카쓰(결혼 활동) 사업과 AI 기반 중매 플랫폼에 대한 자금 지원을 포함하여 신혼부부에게 주택 보조금과 중매 서비스를 보조합니다. 국가는 또한 지방 정부와 협력하여 지역 단위의 결혼 행사를 조직합니다. 이 사업은 결혼 성사를 둘러싼 재정적, 사회적 마찰을 줄임으로써 출산 장려금만 쓸 때보다 낮은 재정 비용으로 출산율을 소폭 끌어올리지만, 효과는 완만합니다."
 JAP_raise_retirement_age: "고령자 고용 안정법"
 JAP_raise_retirement_age_desc: "일본은 공식 정년을 70세를 향해 점진적으로 높이고, 의무 고용 기여를 연장하며 연금 수급 자격을 늦춥니다. 2021년 입법에 따라 국가는 고용주가 고령 노동자를 유지하도록 유인하고 전통적인 65세 기준을 넘어 계속 고용을 제공하도록 압박합니다. 정치적으로 고통스럽습니다. 노동자들은 늘어난 근로 연수에 반발하고 정부는 이를 밀어붙이는 데 정치적 자본을 써야 하지만, 노동력은 직접적으로 늘어나고 연금 부담은 줄어듭니다."
 JAP_silver_employment_initiative: "실버 인재 센터"
 JAP_silver_employment_initiative_desc: "일본은 모든 주요 도시에 실버 인재 센터를 설립하고 재정을 지원하여, 65세 이상의 건강한 고령자에게 시간제 일자리 알선, 재교육, 멘토링을 제공합니다. 이 센터들은 청소, 경비, 보육 지원, 행정 분야에서 유연한 노동력이 필요한 고용주와 경험 많은 은퇴자를 연결해 줍니다. 이 사업은 비용이 낮고 존엄을 지켜 주며, 의무 정년을 올리지 않고도 생산적인 노동자를 늘려 적은 비용으로 실업 압박을 완화합니다."
 JAP_preventive_health_program: "건강 수명 연장 사업"
 JAP_preventive_health_program_desc: "일본은 전 인구를 대상으로 한 예방 의료에 투자합니다. 보조금을 받는 검진, 예방 접종, 생활 습관 상담, 만성 질환의 조기 개입이 그것입니다. 고령 인구가 더 오래 건강하고 자립적으로 지내게 함으로써 국가는 값비싼 집중 치료와 요양원 거주로 보내는 연수를 줄입니다. 이 사업은 순수한 예방(병을 치료하는 것이 아니라 막는 것)이며, 노인이 80대까지 활동적이고 자립을 유지함에 따라 의료비 절감으로 높은 수익을 냅니다."
 JAP_elderly_care_reform: "장기 요양 제도 현대화"
 JAP_elderly_care_reform_desc: "일본은 장기 요양 보험 제도를 개편하여 시설(요양원) 중심 돌봄에서 지역 기반의 통합 돌봄, 즉 방문 도우미, 주간 보호 센터, 지역 의원, 가족 지원 중심으로 전환하며 값비싼 거주 시설에서 벗어납니다. 값비싼 시설에 대한 의존을 줄이고 지역 사회를 동원함으로써 국가는 의료 예산과 사회 복지 예산을 모두 줄입니다. 전환 과정은 혼란스럽습니다. 선호하던 시설 돌봄을 잃는 사람도 있고 이행 기간에 행정이 과부하를 겪지만, 장기적 절감 효과는 상당합니다."
 Japan.105.t: "제국 선포"
 Japan.105.d: "선포문 초안이 내각 탁상 위에 놓여 있고, 그 옆에는 옥새가, 날짜는 비어 있습니다. 더는 복원할 것이 남아 있지 않습니다. 황실은 건재하고, 의례는 지켜지며, 추밀원은 열려 있습니다. 다만 문구만이 정해지지 않았습니다.\n\n육군상이 먼저 입을 엽니다. 제국은 대륙에서, 즉 일으킨 사단의 수와 장악한 땅으로 가늠되는 것이니 선포문도 그렇게 말해야 한다는 것입니다. 해군상은 목소리를 높이지 않고 답합니다. 일본은 해상 교통로에 기대어 사는 섬나라이며, 함대 위에 게양된 깃발은 블라디보스토크에서 싱가포르에 이르는 모든 항구에서 올바르게 읽힐 것이라고 말입니다. 두 사람 모두 침묵하고 옥좌를 바라봅니다."
 Japan.105.a: "£JAP_EMPIRE_flag     제국의 힘은 육군에 있다."
 Japan.105.b: "£JAP_EMPIRE_NAVAL_flag     제국의 힘은 바다에 있다."
 JAP_american_pressure_article_nine_desc: "워싱턴은 무역 현안을 방위 현안과 연계했습니다. 관세 위협과 자원 지렛대가 도쿄를 더 폭넓은 군사적 역할로 밀어붙이는 데 사용되고 있으며, 이 논쟁이 매듭지어질 때까지 일본은 협상 테이블에서 약한 쪽에서 협상합니다."
 JAP_jsw_tank_mio_trait_ladle_refining: "청정강 레이들 정련"
 JAP_jsw_tank_mio_trait_muroran_arc_furnace: "무로란 전기 아크로"
 JAP_jsw_tank_mio_trait_high_tensile_plate: "고장력 강판 압연"
 JAP_jsw_tank_mio_trait_scrap_recycling: "고철 재활용 라인"
 JAP_jsw_steel_modifier: "일본제강소"
 JAP_jsw_steel_modifier_desc: "일본제강소에 내리는 주문은 곧 무로란에 내리는 주문입니다. 포신과 장갑판을 쏟아내는 용광로는 조선소와 건설업, 자동차 제조업체에도 철강을 공급하는 바로 그 용광로이며, 이를 최대 가동률로 유지시키는 계약 하나하나가 수입 강편에 대한 국가의 의존도를 낮춥니다. 국방 예산이 포신용 강재에 쓰는 만큼, 더 넓은 경제가 톤수로 거두어들입니다."
 JAP_zombie_companies: "좀비 기업"
 JAP_zombie_companies_desc: "수년간의 관용으로 수익성 없고 과다 채무를 진 기업들이 값싼 신용에 의지해 연명하며, 더 건전한 산업이 필요로 하는 자본, 노동력, 경영 역량을 묶어 두고 있습니다. 이들 기업이 구조조정되거나 정리되기 전까지는 건설, 생산성, 법인세 수입이 모두 타격을 받습니다.\n-------------\n§Y기업 구조조정 진행도§!를 높이면 §Y$JAP_restructure_next_tranche$§! 결정이 해금되며, 이 결정은 이 국가 정신을 한 단계씩 완화합니다. 현재 수치는 §Y$JAP_corporate_reform_category$§!에서 확인하십시오."
 JAP_ykk_group: "YKK 그룹"
 JAP_ykk_group_desc: "요시다 고교는 전 세계에서 생산되는 지퍼의 약 절반, 연간 약 70억 개를 70개국 이상에 있는 공장에서 만들어 냅니다. 이 회사는 황동을 직접 가공하고, 폴리에스터를 직접 방적하며, 염료를 직접 배합하고, 완제품 슬라이더를 조립하는 기계까지 직접 제작하는 수직 계열화를 이루어, 제품과 관련된 어떤 것도 회사의 통제 밖에 두지 않습니다. 군 조달은 이 사업에서 작은 비중에 불과하지만 요구 조건은 엄격합니다. 방탄 조끼, 전투 조끼, 위장복의 잠금장치는 야전에서 가장 먼저 고장 나는 부품이기 때문입니다. 일본의 군복 및 보호 장비 사업은 하청업체를 기다리는 대신 직물 띠, 코팅, 내식 합금을 자체적으로 수정할 수 있는 공급업체에 의존합니다."
 JAP_karoshi_crisis: "과로사 위기"
 JAP_karoshi_crisis_desc: "만성적인 과로가 일본의 노동력을 갉아먹고 있습니다. 지나친 무급 초과근무와 '서비스 잔업' 문화는 월급쟁이 노동자들 사이에서 뇌졸중, 심부전, 자살을 불러오며, 지친 가정은 아이 갖기를 미루고 있습니다. 안정도, 생산성, 연구가 모두 타격을 받고, 의료와 사회 지출은 늘어나며, 인구는 해마다 서서히 줄어들고 있습니다.\n-------------\n개혁 중점과 직장 캠페인은 $JAP_worker_wellbeing$을(를) 높입니다. §G30§!과 §G60§!에서 §Y$JAP_enforce_next_reforms$§! 결정이 해금되어 이 국가 정신을 한 단계씩 완화하며, 선택한 경로의 끝에 있는 중점은 이를 영구히 해소합니다. 일본의 §Y좀비 기업§!이 해결되지 않은 동안에는 모든 캠페인의 효과가 절반이 됩니다. 현재 수치는 §Y$JAP_corporate_reform_category$§!에서 확인하십시오."
 JAP_karoshi: "과로사"
 JAP_karoshi_desc: "정부는 과로사를 국가적 위기로 규정합니다. 과로로 숨진 노동자들, 책상 앞에서 겪는 뇌졸중과 심부전, 월 100시간 근무 끝에 이어지는 자살이 그것입니다. 덴쓰 직원 다카하시 마쓰리의 죽음은 이 문제를 다시 국가 의제로 끌어올렸고 회사 사장은 자리를 잃었습니다. 국가는 이제 노동을 견딜 만한 것으로 만들기 위해 직장에 어디까지 개입할지 결정해야 합니다."
 JAP_corporate_laws: "노동기준법 개혁"
 JAP_corporate_laws_desc: "정부는 입법의 길을 택하여 일하는 방식 개혁법으로 제36조의 허점을 막고, 사부로쿠 협정을 강화된 노동기준감독서가 집행하는 엄격한 상한으로 대체합니다. 이를 관철하려면 국회의 모든 위원회 단계에서 고용주와 유연근무 로비 세력에 맞서 싸워야 합니다. 세 가지 해법 중 가장 포괄적이지만 결실이 가장 늦게 찾아옵니다."
 JAP_cultural_change: "과로 문화에 맞서다"
 JAP_cultural_change_desc: "정부는 법령 대신 문화로 캠페인을 벌입니다. 프리미엄 프라이데이는 한 달에 한 번 노동자를 일찍 퇴근시키고, 정신 건강 검진이 직장까지 확대되며, 연례 과로사 백서는 고용주와 채용 담당자 모두에게 희생자들을 계속 보이게 합니다. 이 중 어느 것도 성실한 사람은 과장이 퇴근한 뒤에야 떠난다는 불문율은 건드리지 못합니다. 이 경로는 일본인과 노동의 관계가 아래로부터, 직장 하나와 가정 하나씩 변화하리라는 데 걸어 보는 도박입니다."
 JAP_keiretsu_pact: "게이레쓰와의 협상"
 JAP_keiretsu_pact_desc: "국가는 기업 집단 및 게이단렌 경영자 연합과 직접 협상합니다. 안정을 대가로 한 관리된 개혁, 보존되는 종신 고용, 혼란으로부터 보호받는 부채 기업들이 그 내용입니다. 입법도 없고 어떤 기업도 공개 망신을 당하지 않으며, 양보는 예측 가능성과 맞바꿔집니다. 개혁으로 가는 가장 느린 길이며 일본 기업계를 가장 적게 변화시키는 길입니다."
 JAP_overtime_cap: "제36조 상한"
 JAP_overtime_cap_desc: "노동 당국에 제출된 사부로쿠 협정은 법정 주 40시간 근로를 하나의 권고 사항으로 만들어 버렸고, 일하는 방식 개혁법이 그 구멍을 막습니다. 월 45시간, 연 360시간의 초과근무가 법적 상한이 되고 어떤 달에도 100시간을 넘을 수 없으며, 그 수치의 배후에는 행정 지도가 아닌 형사 처벌이 있습니다. 이 수치는 후생노동성이 뇌졸중이나 자살이 업무로 인한 것인지 판단할 때 사용하는 과로사 기준선을 따릅니다."
 JAP_mandatory_paid_leave: "노동자가 반드시 써야 하는 닷새"
 JAP_mandatory_paid_leave_desc: "의무가 뒤집힙니다. 열흘 이상의 휴가를 부여하는 고용주는 이제 그중 최소 닷새가 실제로 사용되도록 해야 하며, 노동자가 쓰지 않으면 직접 날짜를 지정해야 합니다. 일본 노동자들에게 부족한 것은 휴일이라기보다 그것을 쓸 허락이며, 부여된 휴가의 절반 남짓만이 사용됩니다. 같은 개정안은 유럽의 근무 간 휴식 제도, 즉 교대 사이 11시간 휴식도 차용하지만 노력 의무에 그칩니다."
 JAP_labour_inspection_offices: "노동기준감독서"
 JAP_labour_inspection_offices_desc: "정부는 노동기준감독서가 조언에 그치지 않고 집행하도록 재원을 지원합니다. 더 많은 감독관, 100시간의 초과근무를 서류상 20시간으로 만드는 위조된 출퇴근 기록을 잡아내기 위한 법회계 분석, 그리고 기소하겠다는 의지가 그것입니다. 수천 명의 감독관으로 6천만 노동자를 감시할 수는 없기에 대부분의 위반은 누군가 사망하고 유족이 변호사를 선임한 뒤에야 드러납니다. 후생노동성은 이미 법을 어긴 기업의 이름을 공표하고 있으며, 덴쓰 자신도 다카하시 마쓰리의 죽음 이후 유죄 판결을 받았습니다."
 JAP_karoshi_prevention_act: "과로사 방지법"
 JAP_karoshi_prevention_act_desc: "국회는 과로사 등 방지 대책 추진법을 통과시켜, 국가가 과로사를 조사하고 연례 백서를 발간하며 측정 가능한 목표를 스스로 지키도록 의무화합니다. 주 60시간 근무자를 노동자의 5퍼센트 미만으로, 유급 휴가 사용률을 70퍼센트로, 모든 기업에 정신 건강 제공을 달성하는 것이 그 목표입니다. 수치를 공개하는 것이 핵심인데, 그래야 목표를 놓쳤을 때 공개적으로 드러나기 때문입니다. 같은 법안 묶음에는 최고 임금 전문직의 근로시간 규정을 면제하는 고도 프로페셔널 제도 예외도 담겨 있으며, 노조들은 이 예외가 확대되리라 예상합니다."
 JAP_end_of_karoshi: "노동이 사람을 죽이지 않는 나라"
 JAP_end_of_karoshi_desc: "감독관들이 예고 없이 들이닥치고 검사들이 뒤를 따르기에 초과근무 상한이 지켜지고, 법이 요구하기에 휴가가 사용되며, 당신 옆자리의 계약직 노동자가 당신과 같은 임금을 받습니다. 무급 노동 시간에 기대어서만 살아남을 수 있던 기업들은 연장된 신용으로 떠받쳐지는 대신 정리되었으므로, 살아남으려면 어쩔 수 없다고 호소하는 이는 이제 아무도 없습니다. 일본은 여전히 열심히 일하겠지만, 탈진을 충성의 증거로 여기는 일은 그만두었습니다.\n-------------\n§Y일본의 좀비 기업§!이 완전히 정리되어 있어야 하며, §Y$JAP_karoshi_crisis$§!이(가) 이미 최종 단계로 완화되어 있어야 하고, $JAP_worker_wellbeing$이(가) 최소 §G85§!이어야 합니다. 이 중점을 완료하면 과로사 위기가 영구히 해소됩니다."
 JAP_premium_friday: "프리미엄 프라이데이"
 JAP_premium_friday_desc: "경제산업성은 게이단렌과 함께 프리미엄 프라이데이를 시작합니다. 매달 마지막 금요일에 직원들은 3시에 퇴근하여 저녁 시간을 책상 앞이 아닌 상점가에서 보냅니다. 월말은 결산이 마감되고 할당량이 정해지는 때라 시기가 좋지 않으며, 열의를 가지고 따르는 기업은 거의 없습니다. 남는 것은 국가가 시간을 정해 놓고 나라에 일을 멈추라고 말한 선례입니다."
 JAP_ikumen_project: "이쿠멘 프로젝트"
 JAP_ikumen_project_desc: "후생노동성은 육아하는 아버지를 해명이 필요한 존재가 아닌 존경받는 존재로 만들기 위해 이쿠멘 캠페인을 벌입니다. 일본의 육아휴직은 서류상으로는 세계에서 가장 관대한 축에 속하여 1년간, 일부 급여가 지급되지만 사실상 아무도 신청하지 않습니다. 신청하는 남성은 동료들이 자기 업무를 대신 떠맡게 하고 과장이 기억해 두는 남성이 되기 때문입니다. 개정법은 출산 후 8주 이내에 4주를 분할 가능하며 신고만으로 쓸 수 있게 하는데, 머뭇거리는 아버지도 실제로 쓸 만큼 문턱이 낮습니다."
 JAP_stress_check_programme: "스트레스 체크"
 JAP_stress_check_programme_desc: "개정 노동안전위생법은 직원 50인 이상의 모든 사업장에 연 1회 심리 자가 평가를 제공하도록 요구하며, 이는 국가가 일본 기업에 직원들의 상태를 묻도록 의무화한 최초의 사례입니다. 점수가 나쁜 노동자는 의사와의 면담과 업무 조정을 요청할 수 있으나, 결과는 직원의 것이며 관리자는 동의 없이는 아무것도 볼 수 없습니다. 이는 개인을 보호하지만 수단의 날을 무디게도 하며, 직원 50인 미만 기업에는 노력 의무만 부과됩니다."
 JAP_telework_normalization: "어디서든 일하기"
 JAP_telework_normalization_desc: "정부는 사상 처음으로 디지털 전환 담당 장관을 임명하고 디지털청을 출범시켜, 압도적 다수의 행정 절차에서 인감(한코) 요건을 없앱니다. 재택근무가 미미한 수준이었던 것은 기술이 없어서가 아니라 계약에 새겨진 인감이 필요하고 서류가 여전히 팩스로 도착했기 때문이며, 그래서 누군가는 도장을 들고 건물 안에 있어야 했습니다. 이 가운데 무엇이 비상 상황 이후에도 남을지는 열린 질문인데, 기업들은 직원이 필요 없음을 입증한 책상으로 그들을 다시 불러들였기 때문입니다."
 JAP_ending_service_zangyo: "서비스 잔업의 종말"
 JAP_ending_service_zangyo_desc: "서비스 잔업은 기록되지 않은 채 공짜로 바쳐지는 근무 시간입니다. 근무일이 자기 신고로 측정되었고 직원은 과장이 그 숫자가 어떻게 적혀 있기를 기대하는지 알았기 때문입니다. 이 개혁은 문화가 아닌 셈법을 공략합니다. 고용주는 카드 리더나 로그인 시간 같은 객관적 수단으로 근로시간을 확인해야 하며, 두 기록 사이의 차이가 곧 증거입니다. 노동성은 매년 회수한 금액, 즉 수백억 엔의 미지급 임금을 공표하며, 그 기업들은 모두 예외적인 곳이 아니라 적발된 곳일 뿐입니다."
 JAP_ending_compulsory_nomikai: "자율 회식"
 JAP_ending_compulsory_nomikai_desc: "회식(노미카이)이 자발적이라 함은 초대가 질문 형태로 표현된다는 의미에서일 뿐이며, 두 번 거절한 후배는 어떤 인사 평가에도 기록되지 않을 자신에 대한 무언가를 말한 셈이 됩니다. 직장 내 괴롭힘 방지법은 옆에서 이 문제에 접근합니다. 일본 법령상 처음으로 직장 내 권력형 괴롭힘을 규정하고, 모든 기업에 고충 처리 절차를 운영하며 신고자를 보호하도록 의무화합니다. 젊은 노동자 세대는 이미 참석을 그만두었고, 법이 그들을 따라잡았습니다."
 JAP_work_to_live: "살기 위해 일하다"
 JAP_work_to_live_desc: "근로시간은 기계가 기록하여 실제와 일치하고, 휴가는 쓰는 데 아무 대가가 없기에 사용되며, 아버지들은 출산 후 몇 주의 휴가를 신청하고 같은 책상과 같은 전망으로 돌아옵니다. 이 중 어느 것도 법령만으로 얻어진 것이 아닌데, 문제는 애초에 법령이 아니라 아무도 집행하지 않을 때 직장이 기대하는 바에 있었기 때문입니다. 일본은 여전히 열심히 일하지만, 이를 죽도록 일하는 것과 혼동하는 일은 그만두었습니다.\n-------------\n§Y일본의 좀비 기업§!이 완전히 정리되어 있어야 하며, §Y$JAP_karoshi_crisis$§!이(가) 이미 최종 단계로 완화되어 있어야 하고, $JAP_worker_wellbeing$이(가) 최소 §G85§!이어야 합니다. 이 중점을 완료하면 과로사 위기가 영구히 해소됩니다."
 JAP_corporate_reform_category: "일본 기업 개혁"
 JAP_corporate_reform_category_desc: "일본의 기업 부문은 서로 연결된 두 가지 병을 안고 있습니다. 은행은 수익성 없고 과다 채무를 진 기업들을 만기 연장된 신용으로 연명시켜, 더 건전한 산업이 필요로 하는 자본과 노동자를 묶어 두고 있습니다. 바로 그 기업들이 무급 초과근무로 충성을 사들이며, 그 결과가 과로로 인한 죽음, 곧 과로사입니다. 한쪽이 지속되는 한 다른 쪽도 완전히 치유될 수 없습니다.\n\n§Y좀비 기업§!\n§Y기업 구조조정 진행도§!: [?JAP_corporate_restructuring_progress|0] / 100\n조사가 종결되고 해결 방안이 선택될 때까지 구조조정은 §R월 +0.25§!의 느린 속도로 진행됩니다. 이후 §Y$JAP_controlled_downsize$§!은(는) 기업들을 신속히 정리하고, §Y$JAP_forced_mergers$§!은(는) 그 절반의 속도로 흡수하며, 보고서의 질이 두 방안 모두의 효과를 좌우합니다. 아래의 은행 중점과 회복 프로그램은 일회성 수치를 더해 줍니다.\n§R해결 방안이 선택될 때까지 진행도는 84에서 멈춥니다.§!\n§G단계 기준§!\n§G30§!과 §G60§!: 아래의 §Y$JAP_restructure_next_tranche$§! 결정이 해금되며, 사용할 때마다 §Y$JAP_zombie_companies$§!이(가) 한 단계씩 완화됩니다.\n§G85§!: 선택한 경로의 끝에 있는 중점이 §Y$JAP_the_lost_decade_ends$§! 또는 §Y$JAP_consolidated_japan_inc$§!으로 이를 영구히 제거하지만, 후자는 영구적인 흔적을 남깁니다.\n§R경고§!: §Y$JAP_keiretsu_pact$§!은(는) 월별 누적 속도를 늦춥니다.\n\n§Y과로사 위기§!\n$JAP_worker_wellbeing$: [?JAP_karoshi_wellbeing|0] / 100\n선택한 경로의 개혁 중점은 노동자 복지를 직접 높이며, 아래의 직장 캠페인은 비용을 계속 지불하는 동안 이를 보충해 줍니다.\n§G단계 기준§!\n§G30§!과 §G60§!: 아래의 §Y$JAP_enforce_next_reforms$§! 결정이 해금되며, 사용할 때마다 §Y$JAP_karoshi_crisis$§!이(가) 한 단계씩 완화됩니다.\n§G85§!: 선택한 경로의 끝에 있는 중점이 §Y$JAP_end_of_karoshi$§!, §Y$JAP_work_to_live$§! 또는 §Y$JAP_the_bargain_kept$§!으로 이를 영구히 제거합니다. 각각 먼저 위기가 최종 단계까지 완화되어 있어야 합니다.\n§R경고§!: §Y$JAP_zombie_companies$§!이(가) 남아 있는 동안 모든 캠페인은 §G8§! 대신 §R4§!만 얻으며, 경로 중점만으로는 §G85§!에 도달할 수 없습니다.\n\n§G힌트§!: §Y$JAP_a_society_where_women_thrive$§!은(는) §Y$JAP_cultural_change$§! 캠페인이 국고에 부과하는 비용을 절반으로 줄여 줍니다."
 JAP_premium_friday_campaign: "프리미엄 프라이데이 홍보"
 JAP_premium_friday_campaign_desc: "노동성의 홍보 활동과 이에 수반되는 소매 할인을 한 차례 더 지원하고, 경영자 연합을 압박하여 회원사들이 일찍 문을 닫게 합니다. 3시에 불을 끄는 기업들은 그 모습이 사진으로 남게 될 것입니다."
 JAP_ikumen_campaign: "이쿠멘 캠페인 전개"
 JAP_ikumen_campaign_desc: "육아휴직 중인 아버지들을 포스터, 노동성 광고, 텔레비전에 내보내고 기업별 사용률을 공표하여 낮은 수치가 채용 문제가 되게 합니다. 목표는 휴가 신청을 용기 있는 행동이 아닌 평범한 일로 만드는 것입니다."
 JAP_mental_health_campaign: "직장 정신 건강 운동"
 JAP_mental_health_campaign_desc: "연례 스트레스 체크를 직원 50인 미만 사업장까지 확대하고, 산업의를 둘 수 없는 소규모 기업에 보조금을 지급하며, 상담 전화에 적절히 인력을 배치합니다. 검진은 그 끝에서 응답해 줄 사람이 있을 때에만 도움이 됩니다."
 JAP_no_overtime_day_campaign: "초과근무 없는 날 선포"
 JAP_no_overtime_day_campaign_desc: "평일 하루를 정해 지정된 시각에 사무실 조명을 끄고 과장들부터 먼저 퇴근시킵니다. 후배는 상사보다 먼저 떠나지 않기 때문입니다. 투박하고 눈에 띄지만, 지금까지 통한 유일한 형태의 지시입니다."
 JAP_karoshi_resolved: "일본의 과로사 위기가 완전히 해소되었습니다"
 JAP_keidanren_charter: "일과 삶의 균형 헌장"
 JAP_keidanren_charter_desc: "정부, 게이단렌, 렌고는 일과 삶의 균형 헌장에 서명하고 수치 목표를 정합니다. 주 60시간 근무자를 절반으로 줄이고, 부여된 유급 휴가를 모두 사용하며, 한 자릿수 초반에 머무는 남성 육아휴직을 끌어올리는 것입니다. 이 문서에는 법적 구속력도 처벌도 없으며, 기업이 대등한 위치로 참여하는 협의회에서 매년 공개 검토를 받을 뿐입니다. 일본의 근로시간은 기소로 줄어든 적이 없지만, 기업들이 서로에게 수치를 설명해야 할 때는 줄어듭니다."
 JAP_shunto_offensive: "춘투"
 JAP_shunto_offensive_desc: "내각은 춘투 임금 협상에 직접 참여하여, 게이단렌에 보너스가 아닌 기본급 인상을 촉구하고 이에 응하는 기업에 세액 공제로 뒷받침합니다. 비판자들은 이를 관민 춘투, 즉 정부가 관리하는 교섭이라 부르며, 총리실에서 운영하는 임금 협상은 더 이상 단체교섭이 아니라고 주장합니다. 기본급이 오르기 전까지 샐러리맨은 상한이 어떻든 주택 대출을 갚아 주는 초과근무를 계속합니다."
 JAP_health_management_stocks: "건강 경영"
 JAP_health_management_stocks_desc: "노동성과 도쿄증권거래소는 건강경영 우량 종목을 선정하기 시작하여, 직원의 건강이 복지가 아닌 설비 투자라고 투자자들에게 알립니다. 그 배후의 인증인 화이트 500은 블랙 기업 명단의 의도적인 대칭이며, 지친 노동자는 쉬는 노동자보다 적게 생산하고 비용은 더 든다는 발견에 기반합니다. 기업들은 인증을 받기 위해 근로시간과 건강에 관한 자체 수치를 제출하며, 제출하지 못하는 기업은 주주와 신규 채용자 모두에게 책임을 져야 합니다."
 JAP_morning_shift_system: "아침 근무제"
 JAP_morning_shift_system_desc: "옛 게이레쓰의 중심에 있는 종합상사 이토추는 밤 10시 이후의 근무를 금지하고 대신 이른 아침 근무에 할증 수당을 지급합니다. 이유는 인도적인 것이 아니라 상업적인 것입니다. 전날 아침 9시부터 책상에 앉아 있는 트레이더는 가격을 잘못 매기며, 저녁 시간은 하루 중 생산성이 가장 낮습니다. 저녁 초과근무가 급감하고 총 근로시간이 줄었으나 이익은 유지되었고 회사의 출산율은 올랐으며, 짧은 근로시간은 감당할 수 없다고 말해 온 모든 경쟁사가 머쓱해졌습니다."
 JAP_job_based_employment: "회사가 아닌 직무에 채용되다"
 JAP_job_based_employment_desc: "일본의 고용은 멤버십형입니다. 노동자는 직무가 아닌 회사에 채용되어 정해진 업무 없이 회사의 재량으로 순환 배치되며, 끝없는 근무일은 여기서 시작됩니다. 히타치, 후지쯔, KDDI, 시세이도는 이제 직무에 따라 급여 등급을 매긴 실제 직무 기술서를 공개하고 있고, 게이단렌은 종신 고용이 유지될 수 없음을 인정했습니다. 국가는 이 전환이 배신이 아닌 기회로 읽히도록 1조 엔의 재교육 자금을 지원합니다."
 JAP_the_bargain_kept: "지켜진 거래"
 JAP_the_bargain_kept_desc: "기업 집단들이 근로시간이 벌어들이는 것보다 비용이 더 든다는 것을 깨닫기에 근로시간이 줄어들고, 깨달은 뒤에는 국회의 어떤 위원회보다 빠르게 움직입니다. 상호 지분 보유는 그대로 유지되고, 주거래 은행들은 각 집단의 중심에 남으며, 짧아진 근무일이 풀어낸 생산성은 임금 인상 요구가 아닌 연구소로 흘러갑니다. 거래가 감당하지 않는 부분은 국가가 짊어집니다. 이미 몸이 망가진 노동자들의 건강보험 청구서와, 부실 기업들을 숨 쉬게 하는 관용이 그것입니다.\n-------------\n§Y일본의 좀비 기업§!이 완전히 정리되어 있어야 하며, §Y$JAP_karoshi_crisis$§!이(가) 이미 최종 단계로 완화되어 있어야 하고, $JAP_worker_wellbeing$이(가) 최소 §G85§!이어야 합니다. 이 중점을 완료하면 과로사 위기가 영구히 해소됩니다."
 JAP_demand_recovery_progress_tt: "§Y수요 회복 진행도§!: $RIGHT|+=0$"
 JAP_corporate_restructuring_progress_tt: "§Y기업 구조조정 진행도§!: $RIGHT|+=0$"
 Japan_economy.32.t: "지방법원, 재가동 중단 결정"
 Japan_economy.32.d: "지방법원이 원전 인근의 지진 안전성과 피난 계획에 대한 해소되지 않은 의문을 이유로 원자로 재가동을 막는 가처분 결정을 내렸습니다. 판결은 확정된 것이 아니지만, 항소심이 진행되는 동안 원자로의 운전 복귀를 동결합니다. 지역 주민과 반핵 단체들은 이 결정을 환영하고 있으며, 전력회사들은 가동 중단 설비가 계속될 경우의 비용을 경고합니다."
 Japan_economy.32.a: "항소심까지 다툰다."
 Japan_economy.32.b: "지역 안전 보장을 강화한다."
 JAP_zombie_firms_investigation: "좀비 기업 조사"
 JAP_zombie_firms_investigation_desc: "은행들은 지급 불능 차입자들에게 대출을 만기 연장해 왔고, 상호 지분 보유 덕분에 경영진은 서로의 뒤에 숨을 수 있었습니다. 이제 감사관들이 장부를 열어 연장된 신용으로만 연명하는 기업들의 이름을 밝히고 수치를 공개하도록 강제합니다."
 JAP_zombie_firms_investigation_TT: "조사를 개시합니다. 사건 자료는 §Y$JAP_zombie_investigation_category$§!을(를) 통해 구축되며, 기업들은 반격할 것입니다."
 JAP_zombie_investigation_idea: "좀비 기업 조사"
 JAP_zombie_investigation_idea_desc: "감사관들이 지급 불능 기업들의 장부를 샅샅이 뒤지고 있습니다. 조사가 진행되는 동안 불확실성이 이사회를 뒤흔들고 사무를 더디게 합니다."
 Japan_economy.06.b: "은행이 자체 보고하게 둔다"
 Japan_economy.07.b: "여파를 차단한다"
 JAP_zombie_investigation_western_pop_TT: "관용을 공개하면 친서방 개혁 진영의 신뢰가 떨어집니다. §R자유당 인기도 하락§!"
 JAP_controlled_downsize: "통제된 규모 축소"
 JAP_controlled_downsize_desc: "금융재생프로그램은 더 엄격한 자산 평가와 현금흐름 할인 충당금 적립을 적용하여, 홀로 서지 못하는 재무제표에 공적 자본을 강제로 투입합니다. 지급 불능 기업은 정리되고 공장은 폐쇄되며, 걸어 다니는 시체 속에 갇힌 노동자들이 산 자들의 세계로 풀려납니다."
 JAP_complete_downsizing: "경제의 완전한 규모 축소"
 JAP_complete_downsizing_desc: "청산이 끝났습니다. 신용은 이제 상환할 수 있는 기업으로 흐르고, 토지는 그 용도를 반영한 가격에 거래되며, 경영진은 더 이상 직원 수로 성공을 측정하지 않습니다. 개혁가들이 약속한 경제입니다. 서류상으로는 더 작아졌지만 장부상으로는 훨씬 더 강해졌습니다."
 JAP_venture_capital_funds: "벤처 캐피털 펀드"
 JAP_venture_capital_funds_desc: "일본이노베이션네트워크는 민간 스타트업 뒤에 국가 자본을 투입하여 벤처의 위험을 공적 후원과 맞바꿉니다. 일본 가계는 막대한 저축을 보유하고 있으나 창업자에게는 거의 닿지 않으며, 이것이 그 자본을 움직이게 하는 방법입니다."
 JAP_infrastructure_investments: "기반시설 투자"
 JAP_infrastructure_investments_desc: "국토강인화 기본계획은 국토교통성에 고도 성장기에 건설된 교량, 터널, 방조제를 새로 단장하도록 의무화합니다. 이들 대부분은 이제 사용 연한 50년을 넘겼습니다. 공공사업은 제대로 수행될 때 산업 국가의 동맥이 됩니다."
 JAP_growth_tax_reform: "성장 촉진을 위한 세제 개편"
 JAP_growth_tax_reform_desc: "일본은 오랫동안 선진국 중 가장 무거운 법인 부담을 안고 있었습니다. 잇따른 개혁으로 실효세율은 약 37퍼센트에서 20퍼센트대로 낮아졌고, 과세 기반은 넓히면서 세율은 낮추고 임금을 올리며 국내에 투자하는 기업에 보상을 주었습니다. 이익을 굴리는 기업은 쌓아 두기만 하는 기업보다 국고에 더 가치가 있습니다."
 JAP_startup_education_programs: "신규 기업을 위한 교육 프로그램"
 JAP_startup_education_programs_desc: "EDGE 및 EDGE-NEXT 프로그램은 국립대학 안에 기업가 정신 교육을 도입하고, 기술이전 사무소는 연구실 특허를 기업으로 전환합니다. 도쿄대나 도쿄공업대학 졸업생은 창업을 부모님께 해명해야 할 수치가 아닌 하나의 경력으로 보아야 합니다."
 JAP_retirement_reform: "정년 개혁"
 JAP_retirement_reform_desc: "개정 고령자고용안정법은 고용주에게 70세까지 일할 기회를 확보하도록 요청합니다. 고령자들은 건강하고 숙련되었으며 의욕이 있고, 이들을 노동 인력으로 남겨 두면 연금 부담이 줄어들고 수십 년간 축적된 기술이 공장 현장으로 돌아옵니다."
 JAP_forced_mergers: "합병"
 JAP_forced_mergers_desc: "노동성은 약한 기업이 쓰러지도록 두는 대신 강한 기업과 결합시킵니다. 경계선은 노동성이 긋고 자본은 은행이 대며 아무도 실패를 인정할 필요가 없습니다. 좀비 기업들은 등록부에서 사라지지만, 불만스러운 기술자들과 중복된 공장들, 그리고 미움받는 새 주인들은 모두 그대로 남습니다."
 JAP_megabank_consolidation: "메가뱅크 통합"
 JAP_megabank_consolidation_desc: "일본은 부실한 시중은행들을 미즈호, 스미토모 미쓰이, 미쓰비시 UFJ의 3대 메가뱅크로 합칩니다. 합병은 10년치 부실 채권을 의문을 제기하기에는 너무 거대한 재무제표 속에 묻어 버리고, 어떤 정부도 쓰러지게 둘 수 없는 대출 기관들을 만들어 냅니다."
 JAP_industrial_revitalization_corp: "산업재생기구"
 JAP_industrial_revitalization_corp_desc: "일본산업재생기구는 부실 채권을 사들이고 어려움에 처한 기업을 인수하며, 구조조정 대상 41개사 중에는 다이에와 가네보가 있습니다. 국영 회생 기관은 어떤 민간 채권자도 감히 시도하지 못할 방식으로 조건을 지시하고, 채무를 재편하며, 주주 지분을 조용히 희석할 수 있습니다."
 JAP_national_champion_mergers: "국가대표 기업 합병"
 JAP_national_champion_mergers_desc: "경제산업성은 경쟁 기업들의 적자 사업부를 합쳐 그 합계를 챔피언이라 부릅니다. NEC, 히타치, 미쓰비시의 반도체 부문에서 르네사스를, 소니, 도시바, 히타치의 패널 사업에서 재팬 디스플레이를 만들었습니다. 고전하는 세 부문을 더한다고 건강한 하나의 회사가 되는지는 조심스럽게 언급되지 않은 채 남겨져 있습니다."
 JAP_keiretsu_cross_shareholding: "게이레쓰 상호 지분 보유"
 JAP_keiretsu_cross_shareholding_desc: "상호 지분 보유(모치아이)의 그물망은 일본 기업계의 조용한 뼈대이며, 지금까지의 모든 개혁은 이를 풀어내려 해 왔습니다. 정부는 오히려 매듭을 조여, 재벌 그룹을 행동주의 투자자와 적대적 인수 제안으로부터 보호합니다. 일자리는 안전하게 유지되고, 평범한 경영진도 모두 안전합니다."
 JAP_employment_preservation_pact: "고용 보전 협약"
 JAP_employment_preservation_pact_desc: "종신 고용(슈신코요)은 법이 아니라 기업, 노조, 국가 사이의 거래였으며 조정 보조금으로 유지되었습니다. 정부는 이를 명문화합니다. 어떤 노동자도 합병으로 일자리를 잃지 않습니다. 국가는 사회적 평화를 사고, 그 대가로 결코 문을 닫을 수 없는 공장들을 떠안습니다."
 JAP_consolidated_japan_inc: "통합 재팬 주식회사"
 JAP_consolidated_japan_inc_desc: "마지막 남은 약한 기업이 합병 계약에 서명되고 등록부가 닫힙니다. 챔피언들은 거대하고, 노동성은 산업 지도를 한 장에 그릴 수 있으며, 외국 경쟁자들은 모든 거인에게 마땅한 경계 섞인 존중으로 이를 대합니다. 안에서는 중복된 공장들이 여전히 가동되고 불만스러운 기술자들은 여전히 여섯 시에 줄지어 퇴근합니다.\n-------------\n이 중점은 §Y$JAP_zombie_companies$§!과(와) 합병과 함께 따라온 §Y$JAP_fusion_restructuring$§!을(를) §G제거§!하고, §Y$JAP_consolidated_conglomerates$§!을(를) 영구히 남깁니다."
 JAP_venture_capital_funds_decision: "혁신 펀드 자본 확충"
 JAP_venture_capital_funds_decision_desc: "운용 담당자들이 승자를 가려낸다는 조건으로 민간 운용사와 나란히 펀드에 공적 자금을 투입합니다. 신생 기업 전반에 걸쳐 1년간 집중적인 연구 노력을 보증합니다."
 JAP_infrastructure_investments_decision: "주부 갱신 공사 개시"
 JAP_infrastructure_investments_decision_desc: "주부 산업 지대의 도로, 교량, 공공 설비를 갱신하는 데 민간 건설 역량을 투입합니다. 공사가 진행되는 동안 공장이 묶이지만, 이 지역의 기반시설은 크게 개선됩니다."
 JAP_growth_tax_reform_decision: "법인세율 인하"
 JAP_growth_tax_reform_decision_desc: "1년간 실효 법인세율을 낮춰 기업이 번 것을 더 많이 보유하게 합니다. 기업들이 감면분의 일부를 가계에 전가하면서 소비자 물가가 완화됩니다."
 JAP_startup_education_programs_decision: "대학 스타트업 과정 지원"
 JAP_startup_education_programs_decision_desc: "국립대학에 기업가 정신 학부와 기술이전 사무소를 기금으로 설립하여 연구실의 성과를 기업으로 바꾸고 우리의 산업 연구를 가속합니다."
 JAP_retirement_reform_decision: "고용 보장을 70세까지 연장"
 JAP_retirement_reform_decision_desc: "전통적인 정년을 넘겨 숙련 노동자를 유지하는 고용주에게 보조금을 지급합니다. 수십 년간 축적된 기술이 1년 더 공장 현장에 남습니다."
 JAP_rail_modernization: "철도 현대화"
 JAP_rail_modernization_desc: "도카이도 신칸센은 지구상에서 가장 조밀한 철도망의 중추이며, 그 배후의 차량, 신호, 역사는 노선별로 새로 단장되고 있습니다. 철도는 실패를 용납할 수 없는 산업 경제의 근간으로 남아 있습니다."
 JAP_shinkansen_network_expansion: "신칸센망 확장"
 JAP_shinkansen_network_expansion_desc: "전국 신칸센철도정비법에 따라 역대 정부는 고속 간선을 도카이도 중심부에서 호쿠리쿠, 규슈, 홋카이도로 바깥으로 뻗어 왔습니다. 이들 사업을 가속하면 먼 현들이 국가 경제로 엮이고 본토 전역의 보급선이 단축됩니다."
 JAP_chuo_shinkansen_maglev: "주오 신칸센 자기부상열차"
 JAP_chuo_shinkansen_maglev_desc: "주오 신칸센은 JR 도카이의 초전도 자기부상 노선으로 도쿄, 나고야, 오사카를 잇습니다. L0계는 시속 603km로 세계 철도 속도 기록을 보유하고 있습니다. 국가의 투자는 지금껏 시도된 가장 빠른 상업 철도의 시제 제작과 심층 터널 굴착을 뒷받침합니다."
 JAP_freight_modal_shift: "화물 수송 수단 전환"
 JAP_freight_modal_shift_desc: "일본화물철도는 장거리 트럭에서 철도로의 화물 수송 전환을 이끌고 있으며, 에코레일 마크와 표준화된 31피트 컨테이너로 이를 장려합니다. 더 많은 화물을 철도로 옮기면 배출량이 줄고, 운전기사 부족이 완화되며, 산업 공급망이 강화됩니다."
 JAP_station_city_model: "역 도시 모델"
 JAP_station_city_model_desc: "JR 동일본은 주요 터미널을 그 자체로 상업 도시로 바꾸어, 에키나카라 불리는 상업 통로와 시나가와, 시부야, 도쿄역 주변의 고층 건물을 개발했습니다. 사무실과 상업 시설을 교통 거점에 집중하면 도심의 지가와 생산성이 높아집니다."
 JAP_regional_line_preservation: "지방 노선 보존"
 JAP_regional_line_preservation_desc: "농촌 인구 감소로 승객이 줄면서 JR 서일본과 제3섹터 철도들은 지방 노선 유지에 애쓰고 있습니다. 시골을 버리는 대신, 간선이 우회하는 지역의 보급 접근성과 이동성을 지키기 위해 지역 철도에 보조금을 지급하겠습니다."
 JAP_port_rail_intermodal: "항만-철도 복합 운송"
 JAP_port_rail_intermodal_desc: "국제 전략 거점 항만 정책은 컨테이너 물동량을 게이힌 및 한신 항만군에 집중시킵니다. 부두 내 철도 인입선과 내륙 터미널을 연장하면 항구가 화물망에 직접 연결되어, 불필요한 트럭 운송 없이 컨테이너가 선박에서 열차로 옮겨집니다."
 JAP_green_logistics_network: "녹색 물류망"
 JAP_green_logistics_network_desc: "전철화 철도, 배터리 및 수소 기관차, 통합 물류 센터로 이루어진 녹색 물류망은 탄소 중립을 추구하며 전국의 물자 이동을 탈탄소화합니다."
 JAP_rail_technology_exports: "철도 기술 수출"
 JAP_rail_technology_exports_desc: "일본의 고속철도는 대표적인 수출품입니다. E5 계열 편성은 인도의 뭄바이-아마다바드 노선의 기반이 되고, 700T는 대만 고속철도에서 운행되며, JICA의 금융 패키지는 신칸센 기술을 전 세계로 실어 나릅니다. 이들 계약을 따내면 우리의 표준과 영향력이 퍼집니다."
 JAP_global_rail_superpower: "세계 철도 초강대국"
 JAP_global_rail_superpower_desc: "주오 신칸센이 오사카까지 관통하고 우리 수출품이 전 세계를 누비면서, 일본은 고속철도의 부동의 선두에 섭니다. 자기부상의 시대는 본국에서 시작하여 바깥으로 퍼져 나가며, 일본 공학의 영속적인 상징이 됩니다."
 JAP_chuo_shinkansen_program: "주오 신칸센 계획"
 JAP_chuo_shinkansen_program_desc: "초전도 자기부상열차의 시제 제작을 위한 전담 국가적 노력으로, 우리의 자기부상 특별 사업을 가속합니다."
 JAP_high_speed_line: "고속 노선"
 JAP_high_speed_line_desc: "새로운 신칸센 회랑은 지역 생산성을 높이고 현지 건설을 앞당기며 보급 처리량을 넓힙니다."
 JAP_rail_category: "철도 부문"
 JAP_hokuriku_shinkansen_extension: "호쿠리쿠 신칸센: 가나자와-쓰루가"
 JAP_hokuriku_shinkansen_extension_desc: "호쿠리쿠 신칸센을 가나자와에서 쓰루가까지 연장합니다. 이 구간은 2024년에 개통되었으며, 동해 연안을 전국 고속망에 연결합니다."
 JAP_nishi_kyushu_shinkansen: "니시규슈 신칸센"
 JAP_nishi_kyushu_shinkansen_desc: "2022년부터 운행 중인 나가사키행 니시규슈 노선을 개통하여 규슈 서부를 신칸센망에 편입합니다."
 JAP_sanyo_shinkansen_upgrade: "산요 신칸센 개량"
 JAP_sanyo_shinkansen_upgrade_desc: "N700S 차량을 투입하고 오사카-하카타 간선을 현대화하여 더 높은 속도와 더 큰 신뢰성을 확보합니다."
 JAP_tohoku_shinkansen_upgrade: "도호쿠 신칸센 시속 320km"
 JAP_tohoku_shinkansen_upgrade_desc: "도호쿠 간선에서 E5계 열차를 시속 320km로 운행하여 도쿄에서 아오모리 방면의 주행 시간을 단축합니다."
 JAP_hokkaido_shinkansen_sapporo: "홋카이도 신칸센: 삿포로 연장"
 JAP_hokkaido_shinkansen_sapporo_desc: "신하코다테호쿠토에서 삿포로까지 신칸센을 잇기 위해 터널을 뚫고 고가교를 세웁니다."
 JAP_shikoku_shinkansen: "시코쿠 신칸센"
 JAP_shikoku_shinkansen_desc: "오랫동안 계획되어 온 기본계획 노선을 실현하여 시코쿠 섬에 처음으로 고속철도를 들입니다."
 JAP_plutonium_stockpile_concern: "분리 플루토늄 비축량"
 JAP_galapagos_syndrome: "갈라파고스 증후군"
 JAP_galapagos_syndrome_desc: "일본은 자국 국경 안에 완결된 기술 세계를 구축했으나, 그 어느 것도 수출할 수 없음을 알게 되었습니다. 일본의 이동통신망은 PDC로 돌아갔지만 나머지 세계는 GSM으로 표준화되어, 국내 단말기는 해외에 팔 수 없었고 외국 단말기는 이곳에서 팔 수 없었습니다. 웹 브라우징은 i-mode로, 결제는 FeliCa로 이루어졌는데, 둘 다 해외의 어떤 것보다 수년 앞서 있었고 해외의 모든 것과 호환되지 않았습니다. 국내 인증, JIS 규격, 게이레쓰 조달이 나머지를 채워, 내수 시장은 다른 곳에는 존재하지 않는 고객을 위해 설계된 제품으로 가득 찼습니다. 1억 2천만 소비자는 산업 하나를 유지하기에는 충분하지만 그 산업을 바깥으로 밀어내기에는 간신히 부족한 규모입니다.\n-------------\n이 국가 정신은 저절로 약화되지 않습니다. 일본이 닫혀 있는 동안 §R연구 속도§!는 꾸준히 하락하며, 임시 조치로 늦춰질 뿐 되돌려지지는 않습니다. 오직 §Y세계와의 통합§! 경로를 §Y개방성§! §G85§!까지 이어 가야만 제거됩니다. 현재 수치는 §Y$JAP_technological_isolation_category$§!에서 확인하십시오."
 JAP_galapagos_modifier: "갈라파고스 표류"
 JAP_galapagos_modifier_desc: "일본이 교역 상대인 세계로부터 얼마나 멀어졌는지에 대한 누적 기록입니다. 나라가 자국 표준을 고수하는 달마다 연구는 조금씩 더 뒤처지며, 고객이 사용하는 표준과 멀어질수록 더 빠르게 뒤처집니다. 임시 조치는 하락을 늦출 뿐입니다. 진정한 통합만이 이를 멈춥니다."
 JAP_galapagos_resolved: "일본이 갈라파고스 고립에서 벗어났습니다"
 JAP_galapagos_syndrome_focus: "갈라파고스 문제"
 JAP_galapagos_syndrome_focus_desc: "일본의 내수 시장은 수익성이 있지만 줄어들고 있으며, 나라를 다른 모든 곳에서 차단하는 표준에 의해 보호받고 있습니다. 노동성은 해답이 수렴, 즉 세계에 맞추어 표준을 다시 쓰는 것인지, 상품화, 즉 그 차이 자체를 파는 것인지를 두고 논쟁합니다. 부분적인 조치들은 연구 표류를 늦추지만, 그 밑바닥의 선택을 다루는 것은 하나도 없습니다."
 JAP_technological_isolation_category: "갈라파고스와 전자 전쟁"
 JAP_technological_isolation_category_desc: "일본 산업은 일본만을 위한 제품을 완성했습니다. 뛰어난 단말기와, 내수 시장 밖의 누구도 쓸 수 없는 표준과 서비스를 만들었고, 그동안 나머지 세계는 다른 누군가를 중심으로 표준화되었습니다. 바로 그 폐쇄성이 중국이 기술의 사다리를 오르는 지금 일본의 반도체 부문을 취약하게 만들고 있습니다.\n\n§Y갈라파고스 증후군§!\n§Y개방성§!: [?JAP_galapagos_openness|0] / 100\n§Y$JAP_galapagos_drift_review_mission$§!은(는) 30일마다 표류를 보고하며, 적용되기 전의 정확한 수치를 보여 줍니다. 개방성이 낮을수록 연구는 더 빨리 뒤처지고, §G100§!에서는 전혀 뒤처지지 않으며, 최악이라도 §R-15%§!를 넘지 않습니다.\n§G개방성 높이기§!: 통합 중점이 대부분을 담당하고 전자 중점이 나머지를 더합니다. 아래의 두 캠페인이 조금 더 보태 주지만, 표류를 늦출 뿐 증후군을 치유할 수는 없습니다.\n§G제거 조건§!: 오직 §Y$JAP_world_integration$§! 경로만이 §Y$JAP_galapagos_syndrome$§!을(를) 제거하며, 개방성이 §G85§!를 넘어야 합니다. §Y$JAP_cool_japan_doctrine$§! 경로는 의도적으로 이 정신을 유지하며 일본의 문화적 영향력을 영향력으로 전환합니다.\n\n§Y모델 경쟁§!\n§Y경쟁 압력§!: [?JAP_electronics_pressure|0] / 3\n§Y전자 회복력§!: [?JAP_electronics_resilience|0]\n압력은 §R1§!에서 시작하여 한국과 대만이 앞서가면(2008년부터, 또는 중국이 반도체 사다리를 더 일찍 오르면 그 이전부터) §R2§!로, 중국이 최첨단에 도달하면 §R3§!로 오릅니다. 압력에서 회복력을 뺀 값이 일본이 겪는 §Y$JAP_model_competition$§!의 단계를 결정합니다. 압력에 맞서면 정신이 걷히고, 압력이 다시 회복력을 넘어서면 정신이 돌아옵니다.\n§G회복력 높이기§!: 반도체 중점이 회복력을 부여하며 각각 마이크로칩 생산 IV를 필요로 하고, 아래의 수출 공세는 회복력이 §G5§!에 이를 때까지 매년 1씩 더합니다.\n§G제거 조건§!: §Y$JAP_electronics_superpower$§!이(가) 경쟁을 영구히 끝냅니다."
 JAP_international_standards_adjustment: "국제 표준 조정"
 JAP_international_standards_adjustment_desc: "일본 산업은 이동통신의 PDC, 방송의 ISDB 같은 자체 표준을 제정하며, 그 하나하나가 내수 시장을 바깥의 GSM 및 DVB 세계로부터 차단합니다. 정부는 ISO와 IEC 실무반에 기술자들을 파견하는데, 이는 괴리를 하루아침에 되돌릴 수 없지만 10년 뒤 다른 모든 나라가 읽게 될 초안에 일본의 이름을 올려 줍니다. 그 대가는 조항을 양보할 때마다 다시 쓰이는 적합성 시험이라는 형태로 국내에서 치러집니다."
 JAP_english_business_environment: "영어 비즈니스 환경"
 JAP_english_business_environment_desc: "일본 관리자들은 계약서가 작성되는 언어로 자신의 해외 자회사를 운영할 인력을 구하지 못합니다. 정부는 기업 영어 프로그램과, 일본 기업의 업무 언어를 영어로 정했다가 결과가 나오기 전까지 조롱받았던 라쿠텐의 실험을 지원합니다. 과장들이 제2언어로 회의를 주재하는 법을 배우는 동안 수년간의 생산성 손실이 따르며, 일부는 끝내 배우지 못할 것입니다."
 JAP_international_standards_adjustment_campaign: "표준화 대표단 지원"
 JAP_international_standards_adjustment_campaign_desc: "ISO, IEC, ITU 실무반에 기술자를 한 차례 더 순환 파견하는 비용과, 일본이 양보하는 모든 조항 뒤에 따르는 국내 적합성 시험 비용을 댑니다. 대표단은 초안을 가지고 귀국하고 산업계는 다음 개정 전까지 1년간 적응할 시간을 얻습니다. 지원을 끊으면 그 자리는 다른 누군가에게 넘어갑니다."
 JAP_english_business_environment_campaign: "기업 영어 프로그램 보조금 지급"
 JAP_english_business_environment_campaign_desc: "회원 기업들이 스스로 지불하기를 꺼려 온 어학 교육을 후원합니다. 사내 강사, 근무 시간 중 TOEIC 응시, 합격한 모든 이를 위한 해외 사무소 파견이 그것입니다. 사람들이 공부하는 동안 생산량은 떨어집니다. 이를 끝까지 이어 가는 기업은 방 안에 통역사가 필요 없게 됩니다."
 JAP_cool_japan_doctrine: "쿨 재팬 독트린"
 JAP_mitsubishi_aerospace_aircraft_manufacturer_header_wings_pilot_readiness: "날개 및 조종사 대비 태세"
 JAP_mitsubishi_aerospace_aircraft_manufacturer_header_air_defense_shield: "대공 방어 방패"
