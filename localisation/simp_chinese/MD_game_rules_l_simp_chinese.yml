 RULE_YES_ALLOW_TOGGLING_CHEAT_DECISIONS_DESC: "§Y（可选的）§!\n\n开启全局作弊模式\n§Y注意：§!全球任何国家都可以切换为作弊模式，而且这将影响§Y全局§!。一旦有国家切换为该模式，便会有事件弹出告知其他国家。\n§Y您应该确定在当前的多人游戏中，您被允许使用该模式！§!\n\n§Y注意：§!如果您想作弊，还需要启用“允许作弊模式”这一游戏规则！"
