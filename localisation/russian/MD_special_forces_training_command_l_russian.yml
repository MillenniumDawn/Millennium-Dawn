 MD_sftc_ex_ranger_tt: "§YОтборочные учения рейнджеров§!\n\n£army_experience Опыт армии: §R-300§!\n£air_experience Опыт авиации: §R-150§!\n£command_power Командный ресурс: §R-75§!\nДаёт национальный дух §YОтборочные учения рейнджеров§! на §Y90§! дней:\n £fuel_consumption_texticon  Потребление горючего армией: §R+10%§!\n £out_of_supply_texticon  Нехватка снабжения у спецназа: §G-5%§!\n£doctrine_mastery Освоение направления §Y«Специальный полк рейнджеров»§!: [MD_sftc_exercise_mastery_tt_text] в день в течение §Y90§! дней\n\nТребуется общая доктрина §Y«Смешанное командование»§! или §Y«Рейнджерский спецназ»§!."
 MD_sftc_ex_marine_tt: "§YУчения по морскому рейду§!\n\n£navy_experience Опыт флота: §R-300§!\n£army_experience Опыт армии: §R-150§!\n£command_power Командный ресурс: §R-75§!\nДаёт национальный дух §YУчения по морскому рейду§! на §Y90§! дней:\n £fuel_consumption_texticon  Потребление горючего флотом: §R+10%§!\n £amphibious_texticon  Скорость десантной высадки: §G+5%§!\n£doctrine_mastery Освоение направления §Y«Специальные силы морской пехоты»§!: [MD_sftc_exercise_mastery_tt_text] в день в течение §Y90§! дней\n\nТребуется общая доктрина §Y«Смешанное командование»§! или §Y«Морской спецназ»§!."
 MD_sftc_ex_airborne_tt: "§YУчения по воздушной заброске§!\n\n£air_experience Опыт авиации: §R-300§!\n£army_experience Опыт армии: §R-150§!\n£command_power Командный ресурс: §R-75§!\nДаёт национальный дух §YУчения по воздушной заброске§! на §Y90§! дней:\n £fuel_consumption_texticon  Потребление горючего авиацией: §R+10%§!\n £organisation_paratroop_texticon  Организация после выброски: §G+5%§!\n£doctrine_mastery Освоение направления §Y«Воздушно-десантные роты»§!: [MD_sftc_exercise_mastery_tt_text] в день в течение §Y90§! дней\n\nТребуется общая доктрина §Y«Смешанное командование»§! или §Y«Воздушно-десантный спецназ»§!."
 MD_sftc_ex_joint_tt: "§YСовместные учения специальных операций§!\n\n£army_experience Опыт армии: §R-150§!\n£navy_experience Опыт флота: §R-150§!\n£air_experience Опыт авиации: §R-150§!\n£command_power Командный ресурс: §R-75§!\nДаёт национальный дух §YСовместные учения специальных операций§! на §Y90§! дней:\n £fuel_consumption_texticon  Потребление горючего армией: §R+10%§!\n £attack_specops_texticon  Атака спецназа: §G+2%§!\n£doctrine_mastery Освоение направления §Y«Специальные операции»§!: [MD_sftc_exercise_mastery_tt_text] в день в течение §Y90§! дней\n\nТребуется общая доктрина §Yспецназа§!."
 MD_sftc_ex_air_assault_tt: "§YАэромобильный рейд§!\n\n£army_experience Опыт армии: §R-225§!\n£air_experience Опыт авиации: §R-225§!\n£command_power Командный ресурс: §R-75§!\nДаёт национальный дух §YАэромобильный рейд§! на §Y90§! дней:\n £fuel_consumption_texticon  Потребление горючего авиацией: §R+10%§!\n £defence_specops_texticon  Защита спецназа: §G+2%§!\n£doctrine_mastery Освоение направления §Y«Дополнительные силы специального назначения»§!: [MD_sftc_exercise_mastery_tt_text] в день в течение §Y90§! дней\n\nТребуется общая доктрина §Y«Морской спецназ»§!."
 MD_sftc_ex_littoral_tt: "§YПрибрежные учения рейнджеров§!\n\n£army_experience Опыт армии: §R-225§!\n£navy_experience Опыт флота: §R-225§!\n£command_power Командный ресурс: §R-75§!\nДаёт национальный дух §YПрибрежные учения рейнджеров§! на §Y90§! дней:\n £fuel_consumption_texticon  Потребление горючего флотом: §R+10%§!\n £specops_training_speed_texticon  Время обучения спецназа: §G-5%§!\n£doctrine_mastery Освоение направления §Y«Дополнительные силы специального назначения»§!: [MD_sftc_exercise_mastery_tt_text] в день в течение §Y90§! дней\n\nТребуется общая доктрина §Y«Воздушно-десантный спецназ»§!."
 MD_sftc_ex_envelopment_tt: "§YУчения по вертикальному охвату§!\n\n£navy_experience Опыт флота: §R-225§!\n£air_experience Опыт авиации: §R-225§!\n£command_power Командный ресурс: §R-75§!\nДаёт национальный дух §YУчения по вертикальному охвату§! на §Y90§! дней:\n £fuel_consumption_texticon  Потребление горючего авиацией: §R+10%§!\n £naval_invasion_speed_texticon  Скорость подготовки морского десанта: §G+5%§!\n£doctrine_mastery Освоение направления §Y«Дополнительные силы специального назначения»§!: [MD_sftc_exercise_mastery_tt_text] в день в течение §Y90§! дней\n\nТребуется общая доктрина §Y«Рейнджерский спецназ»§!."
 MD_sftc_school_tt_1: "£army_experience Опыт армии: §R-200§!\n£navy_experience Опыт флота: §R-175§!\n£air_experience Опыт авиации: §R-175§!\nДаёт национальный дух §YШкола специальных операций I§!:\n £specops_training_speed_texticon  Время обучения спецназа: §G-5%§!\n Лимит спецназа: §G+1%§!\nЕжедневное £doctrine_mastery §Yосвоение§! на учениях спецназа растёт с §Y0.5§! до §G0.75§!"
 MD_sftc_school_tt_2: "£army_experience Опыт армии: §R-250§!\n£navy_experience Опыт флота: §R-200§!\n£air_experience Опыт авиации: §R-200§!\nДаёт национальный дух §YШкола специальных операций II§!:\nЗаменяет §YШколу специальных операций I§! (если установлен).\n £specops_training_speed_texticon  Время обучения спецназа: §G-10%§!\n Лимит спецназа: §G+2%§!\nЕжедневное £doctrine_mastery §Yосвоение§! на учениях спецназа растёт с §Y0.75§! до §G1.0§!"
 MD_sftc_school_tt_3: "£army_experience Опыт армии: §R-300§!\n£navy_experience Опыт флота: §R-250§!\n£air_experience Опыт авиации: §R-250§!\nДаёт национальный дух §YШкола специальных операций III§!:\nЗаменяет §YШколу специальных операций II§! (если установлен).\n £specops_training_speed_texticon  Время обучения спецназа: §G-15%§!\n Лимит спецназа: §G+3%§!\nЕжедневное £doctrine_mastery §Yосвоение§! на учениях спецназа растёт с §Y1.0§! до §G1.25§!"
