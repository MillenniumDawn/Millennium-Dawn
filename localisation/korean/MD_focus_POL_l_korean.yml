 POL_remove_in_lubusz: "루부시(Lubuskie)의 기념물 철거"
 POL_remove_in_wielkopolska: "대폴란드(Wielkopolska)의 기념물 철거"
 POL_remove_in_lower_silesia: "하실롱스크(Dolny Slask)의 기념물 철거"
 POL_remove_in_silesia: "상실롱스크(Górny Slask)의 기념물 철거"
 POL_remove_in_lodz: "우치(Lódz)의 기념물 철거"
 POL_remove_in_malopolska: "키엘체의 기념물 철거"
 POL_remove_in_subcarpathia: "루벨스키 지방(Lubelszczyzna)의 기념물 철거"
 POL_remove_in_galicia: "소폴란드(Malopolska)의 기념물 철거"
 POL_visegrad_unification_category: "비셰그라드 그룹 통합 - [CZE.GetName]"
 POL_visegrad_unification_category_desc: "비셰그라드 그룹을 통합할 때가 왔습니다. 체코인들 사이에서 우리의 구상에 대한 지지를 얻으면 그들의 정부가 동군연합을 수립하도록 설득할 수 있으며, 이는 궁극적으로 통합으로 이어질 것입니다.\n\n현재 우리의 지지 강도는 [?THIS.support]입니다"
 POL_political_speech: "정치 연설"
 POL_political_speech_desc: "많은 정치인이 여전히 우리 국가들의 통합이 왜 좋은 생각인지 이해하지 못하고 있습니다. 이 조치가 얼마나 중요하고 유익한지 그들에게 깨우쳐 주어야 합니다."
 POL_military_funding: "군사 자금 지원"
 POL_military_funding_desc: "군사 지원을 제공함으로써 우리나라가 이러한 지출을 감당할 수 있음을, 그리고 따라서 통합할 가치가 있음을 보여 줄 것입니다."
 POL_support_economy: "경제 지원"
 POL_support_economy_desc: "남쪽 이웃 국가들의 경제는 특별히 발전하지 못했습니다. 공산주의 정부가 여기에 큰 영향을 미쳤습니다."
 POL_personal_union: "[CZE.GetName] 통합"
 POL_personal_union_desc: "우리는 체코에 통합을 제안할 준비가 되었습니다. 지금은 평범한 괴뢰국의 형태이지만 자치도는 많이 부여할 것입니다. 그들은 우리가 [SLO.GetName]을(를) 설득하는 것을 도울 것입니다."
 POL_visegrad_unification2_category: "비셰그라드 그룹 통합 - [SLO.GetName]"
 POL_visegrad_unification2_category_desc: "비셰그라드 그룹 통합의 두 번째 단계는 [SLO.GetName]과(와)의 우호 관계 수립입니다.\n\n현재 우리의 지지 강도는 [?THIS.support2]입니다"
 POL_political_speech2: "정치 토론"
 POL_political_speech2_desc: "체코 정치인들과 협력하면 슬로바키아 의회가 우리의 구상을 따르도록 더 효과적으로 설득할 수 있습니다."
 POL_support_for_industry_research: "산업 연구 지원"
 POL_support_for_industry_research_desc: "연구와 과학 프로젝트는 모든 국가에 중요한 요소입니다. [SLO.GetName]에는 더 선진적인 연구 비용을 충당할 자금이 많지 않으므로 우리가 그들에게 일부 자금을 기부하겠습니다."
 POL_support_for_military_research: "군사 연구 지원"
 POL_support_for_military_research_desc: "군사 연구는 국가들이 외부 위협으로부터 스스로를 더 잘 방어할 수 있게 합니다. [SLO.GetName]은(는) 강한 나라가 아니므로, 우리와의 동맹이 더 나은 방어를 제공할 것임을 보여 주겠습니다."
 POL_military_exercises: "군사 훈련"
 POL_military_exercises_desc: "비공개 합동 군사 훈련은 우리 국가들의 군대를 더욱 가깝게 만들 것입니다."
 POL_slovakia_unification: "[SLO.GetName] 통합"
 POL_slovakia_unification_desc: "우리는 [SLO.GetName]을(를) 우리 구상에 포함시킬 준비가 되었습니다. 그들이 동의하면 비셰그라드 그룹 통합에 한 걸음 더 가까워질 것입니다."
 POL_visegrad_unification3_category: "비셰그라드 그룹 통합 - [HUN.GetName]"
 POL_visegrad_unification3_category_desc: "우리는 이제 물러서기에는 너무 많은 것을 희생했습니다. [HUN.GetName]이(가) 우리와 함께하도록 설득해야 합니다. 성공하면 비셰그라드 그룹 통합 절차를 시작할 수 있습니다.\n\n현재 우리의 지지 강도는 [?THIS.support3]입니다"
 POL_political_speech3: "정치적 신념"
 POL_political_speech3_desc: "폴란드, [CZE.GetName], [SLO.GetName]의 연합 역량이 헝가리 정치인들이 통합을 좋은 생각으로 인정하도록 설득할 것입니다."
 POL_increased_security: "강화된 안보"
 POL_increased_security_desc: "헝가리인들은 여러 사회 문제에 직면해 있습니다. 우리가 그들이 이를 해결하도록 돕는다면, 우리가 공동 시민을 보살필 수 있음을 보여 줄 수 있습니다."
 POL_increase_position_in_the_world: "세계 내 입지 강화"
 POL_increase_position_in_the_world_desc: "우리 그룹의 통합이 우리뿐 아니라 그들의 국제 무대에서의 중요성도 높일 것임을 [HUN.GetName]이(가) 알도록 해야 합니다."
 POL_equal_rights: "평등권"
 POL_equal_rights_desc: "헝가리인들은 재통합 이후에도 모든 권리와 의무를 유지할 것임을 알아야 합니다. 우리는 어떤 민족도 편애하지 않을 것이며 모두가 평등할 것입니다."
 POL_visegrad_unification4_category: "비셰그라드 지지 균형"
 POL_visegrad_unification4_category_desc: "[CZE.GetName], [SLO.GetName], [HUN.GetName]이(가) 통합에 동의했음에도 불구하고, 우리는 이 통합이 모든 수고를 감수할 가치가 있음을 여전히 그들에게 보여 주어야 합니다. 그러나 우리가 실패하면 그들의 지지를 잃고 결국 그룹이 분열될 수 있습니다.\n\n§G[CZE.GetName]§!의 불만도는 §Y[?THIS.CZEunhappy]§!입니다\n\n§G[SLO.GetName]§!의 불만도는 §Y[?THIS.SLOunhappy]§!입니다\n\n§G[HUN.GetName]§!의 불만도는 §Y[?THIS.HUNunhappy]§!입니다\n\n§R한 국가가 그룹을 떠나면 나머지 모두도 떠납니다!§!"
 POL_info: "정보"
 POL_info_desc: "불만 수준은 비셰그라드 관련 중점에 따라 함께 증가하거나 감소합니다. 비셰그라드 연합국이 분열되지 않도록 올바른 중점을 선택하여 각 국가 사이의 균형을 맞춰야 합니다."
 POL_visegrad_breakup: "비셰그라드 분열"
 POL_territorial_defense_forces_category: "영토방위군"
 POL_territorial_defense_forces_category_desc: "우리나라의 전략적 목표를 지키려면 영토방위군(Wojska Obrony Terytorialnej)이 필요합니다. 새로운 부대를 훈련시키고 우리 지역에서 싸우는 방법을 가르쳐야 합니다. 또한 동방과 서방 중 어느 쪽의 위협으로부터 방어할지도 선택해야 합니다."
 POL_create_3_units: "영토방위 보병(Piechota Obrony Terytorialnej) 3개 대대 훈련"
 POL_create_3_units_desc: "보병은 건물 내부를 확보하고 요새를 방어할 수 있게 해 줍니다. 보병은 모든 군대의 중요한 요소이며, 사람의 작은 실루엣은 적으로부터 쉽게 위장할 수 있습니다."
 POL_create_2_units: "영토방위 기갑 여단(Pancerna Brygada Obrony Terytorialnej) 2개 대대 훈련"
 POL_create_2_units_desc: "기계화 사단 역시 조국 방어의 중요한 부분입니다. 이들은 우리 보병을 효과적으로 지원할 것입니다."
 POL_know_your_territory: "자신의 영토를 알라"
 POL_know_your_territory_desc: "우리 병사들은 자기 집 뒤뜰에서 싸우는 방법을 알아야 합니다. 폴란드는 주로 저지대 국가여서 신속한 기계화 공격에 유리합니다. 병사들은 그러한 공격으로부터 스스로를 방어하는 방법을 알아야 합니다."
 POL_build_bunkers_ahead_belarusian_border: "벨라루스 국경 앞 벙커 건설"
 POL_build_bunkers_ahead_belarusian_border_desc: "러시아는 벨라루스에서 큰 영향력을 행사하고 있으며, 이는 장차 위협이 될 수 있습니다. 어떤 일이 일어나기 전에 대응하여 지금 그들과의 국경을 요새화할 것입니다."
 POL_build_bunkers_ahead_ukrainian_border: "우크라이나 국경 앞 벙커 건설"
 POL_build_bunkers_ahead_ukrainian_border_desc: "우리는 우크라이나의 의도를 확신할 수 없습니다. 러시아 또한 그들 쪽을 노리는 듯하므로, 만일을 대비해 그들과의 국경을 봉쇄하겠습니다."
 POL_strengthen_west_border: "서부 국경 강화"
 POL_strengthen_west_border_desc: "러시아에 합류하려면 먼저 우리가 나토로부터 스스로를 분리할 수 있음을 보여 주어야 합니다."
 POL_build_bunkers_ahead_german_border: "독일 국경 앞 벙커 건설"
 POL_build_bunkers_ahead_german_border_desc: "아이러니하게도 가장 큰 위협은 독일입니다. 남쪽 국경은 때가 되면 처리할 수 있지만, 지금은 대부분 저지대인 독일 국경을 확보하는 것이 가장 중요합니다."
 POL_buy_russian_equipment: "러시아 장비 구매"
 POL_buy_russian_equipment_desc: "한 나라와의 군사 관계를 강화하려면 그 나라의 무기를 받아들일 준비가 되어 있음을 보여 주어야 합니다. 러시아 무기 수입으로 전환하면 그들은 우리의 합류 의지를 더 기꺼이 받아들일 것입니다."
 POL_k2pl_export: "K2 PL 수출 중점"
 POL_k2pl_export_desc: "생산량 증가 덕분에 우리는 나토 국가들에 신형 전차를 보낼 준비가 되었습니다. 이를 통해 수익을 얻고 다른 나라에서의 평판을 높일 수 있습니다."
 POL_export_to_germany: "독일 수출"
 POL_export_to_germany_desc: "독일인들은 강력한 레오파르트를 보유하고 있지만, 우리의 제안을 받아들일 수도 있습니다."
 POL_export_to_france: "프랑스 수출"
 POL_export_to_france_desc: "프랑스군에는 신형 전차가 필요할 수 있습니다."
 POL_export_to_italy: "이탈리아 수출"
 POL_export_to_italy_desc: "이탈리아의 C1 전차는 다소 구형 모델입니다. 우리의 K2 PL은 이탈리아에 분명 유용할 것입니다."
 POL_export_to_hungary: "헝가리 수출"
 POL_export_to_hungary_desc: "우리는 남쪽의 친구들도 잊지 말아야 합니다. 앞으로 비셰그라드 그룹을 통합할 계획이라면 전차 수출 제안은 좋은 수가 될 수 있습니다."
 POL_export_to_britain: "영국 수출"
 POL_export_to_britain_desc: "우리는 영국 제도에도 전차를 일부 보낼 것입니다."
 POL_air_defense_category: "폴란드 대공 방어"
 POL_air_defense_category_desc: "과거에는 일반적인 대공포만으로도 공습으로부터 방어하기에 충분했습니다. 이제는 장거리 미사일, 첨단 레이더, 훨씬 기동성이 뛰어난 항공기의 등장으로 우리의 안전을 보장하기 위해 훨씬 더 많은 노력을 기울여야 합니다. 어려운 과제가 되겠지만, 하늘에서 패배하지 않으려면 반드시 완수해야 합니다."
 POL_short_range_defense_vehicles: "단거리 방어 차량"
 POL_short_range_defense_vehicles_desc: "우리 보병은 언제든 적 항공기를 격추할 수 있어야 하므로 휴대용 로켓 발사기를 지급해야 합니다."
 POL_airspace_security: "영공 안보"
 POL_airspace_security_desc: "강력한 대공 방어력을 갖춘 지상 기지는 중요 건물과 기타 전략 목표물을 지키는 데 도움이 될 것입니다."
 POL_buy_aa_missiles: "대공 미사일 구매"
 POL_buy_aa_missiles_desc: "우리 육군은 스스로 적 항공기를 격멸할 수 있어야 하므로 병사들에게 휴대용 로켓 발사기를 지급할 것입니다. 그러나 생산을 수년 동안 기다릴 수는 없으므로 미국에서 구매하겠습니다."
 POL_anti_missile_security: "대미사일 방호"
 POL_anti_missile_security_desc: "우리 방어의 마지막 단계는 로켓의 폭발을 견딜 수 있는 새로운 벙커입니다."
 POL_intensified_army_training_category: "강화된 군 훈련"
 POL_intensified_army_training_category_desc: "기술은 극도로 빠르게 발전하고 있으며, 강대국의 군대는 더 빠르게 발전하고 있습니다. 우리는 군에 현대적인 체계를 도입하고 새로운 훈련 단계를 시작하여 더 큰 나라들을 따라잡아야 합니다."
 POL_rzeczpospolita_training: "\\"레치포스폴리타\\" 훈련"
 POL_rzeczpospolita_training_desc: "\\"레치포스폴리타\\" 훈련은 폴란드에서 열린 사상 최대 규모의 군사 훈련이었습니다. 훈련은 폴란드, 리투아니아, 라트비아, 에스토니아에서 진행되었으며, 폴란드, 미국, 영국, 독일, 체코, 슬로바키아에서 온 3만 명이 넘는 병사가 참가했습니다."
 POL_improved_reconnaissance: "개선된 정찰"
 POL_improved_reconnaissance_desc: "원격 조종 드론은 접근하기 어려운 지형에서의 정찰에 매우 적합합니다. 아울러 새로운 열상 및 야간 투시 장비에도 투자할 것입니다."
 POL_baltic_maneuvers: "발트 기동 훈련"
 POL_baltic_maneuvers_desc: "우리에게는 바다가 하나뿐이지만, 그렇다고 해서 우리 함대가 약해야 하는 것은 아닙니다. 얕은 바다에서도 적절한 훈련은 매우 중요합니다."
 POL_more_reliable_parachutes: "더 신뢰할 수 있는 낙하산"
 POL_more_reliable_parachutes_desc: "보강된 케이블, 더 높은 품질의 소재, 병사들에 대한 더 나은 훈련은 결함 있는 장비로 인한 항공 사고를 예방할 것입니다."
 POL_virtual_reality_trainings: "가상 현실 훈련"
 POL_virtual_reality_trainings_desc: "VR 및 AR 장비를 이용한 훈련은 매우 효과적인 훈련 방법입니다. 안전하며 모든 조건에서 실제 분쟁을 현실감 있게 모의할 수 있습니다."
 POL_increase_soldiers_pay: "병사 급여 인상"
 POL_increase_soldiers_pay_desc: "병사 급여 인상은 사람들이 군에 입대하도록 장려하고 현재 참전 용사들의 사기를 높일 것입니다."
 POL_korwin_walesa_bop_category: "정치적 라이벌 관계"
 POL_bribe_the_politicians: "정치인 매수"
 POL_bribe_the_politicians2: "정치인 매수"
 POL_censoring_social_media: "소셜 미디어 검열"
 POL_censoring_social_media2: "소셜 미디어 검열"
 POL_promises_of_a_great_poland: "위대한 폴란드의 약속"
 POL_promises_of_a_great_poland2: "위대한 폴란드의 약속"
 POL_calling_for_protests: "시위 촉구"
 POL_calling_for_protests2: "시위 촉구"
 POL_benefits_from_the_european_union: "유럽 연합의 혜택"
 POL_benefits_from_the_european_union2: "유럽 연합의 혜택"
 POL_opposition_to_the_tyrannical_rule_of_korwin: "코르빈의 폭정에 대한 반대"
 POL_opposition_to_the_tyrannical_rule_of_korwin2: "코르빈의 폭정에 대한 반대"
 POL_polish_ukrainian_war_category: "폴란드-우크라이나 전쟁"
 POL_polish_ukrainian_war_category_desc: "우크라이나와의 전쟁은 우리의 안정에 위험합니다. 이 분쟁이 길어질수록 우리 군의 전투 의욕은 떨어집니다. 극단적인 상황에서는 권력을 잃을 수도 있습니다."
 POL_war_escalation: "전쟁 확대"
 POL_ukraine_cooperation_category: "우크리아나와의 협력"
 POL_ukraine_cooperation_category_desc: "Ukraine, although recently it did not mean much in Europe, is nevertheless a country that is developing at a fairly fast pace. We should persuade Ukraine to stand on our side before Russia builds too much influence there.\n\nCurrent Ukrainian acceptance is §Y[?THIS.ukr]§!"
 POL_military_training: "군사 훈련"
 POL_military_training_desc: "우크라이나가 동맹에 가입해야 한다면, 우리는 나머지 국가들에게 우크라이나가 신뢰할 만하다는 것을 보여 주어야 합니다."
 POL_no_border_restrictions: "국경 제한 철폐"
 POL_no_border_restrictions_desc: "국경은 나라들을 갈라놓습니다. 나토와 같은 동맹국들 사이에서는 이러한 국경이 정치적 장벽에 불과하지만, 그러한 동맹 밖의 국가들에게는 군사적 봉쇄이기도 합니다. 우리는 서로를 신뢰하고 이 국경을 없애야 합니다."
 POL_eastern_threat: "동방의 위협"
 POL_eastern_threat_desc: "우크라이나는 러시아가 자국에 치명적인 위협임을 기억해야 합니다. 나토가 그들을 보호해 줄 수는 있지만, 우리가 그들에게 가입을 강요할 수는 없습니다."
 POL_economical_cooperation: "경제 협력"
 POL_economical_cooperation_desc: "우크라이나는 경제적으로 더 발전해야 하며, 그래야 군도 더 빠르게 강해져서 러시아로부터 스스로를 더 효과적으로 지킬 수 있습니다."
 POL_weaken_russian_influence: "러시아 영향력 약화"
 POL_weaken_russian_influence_desc: "우크라이나는 우리의 임무를 지지하지만, 그동안 러시아가 우리의 모든 계획을 망치도록 놔둘 수는 없습니다."
 POL_ukraine_in_nato: "나토 내 우크라이나"
 POL_ukraine_in_nato_desc: "Ukraine is still not ready to join NATO. We must ensure that their corruption is not strengthened and convince NATO countries to accept Ukraine in our alliance.\n\nCurrent §Yacceptance§! is §Y[?THIS.ukr2]§!"
 POL_investigate_the_government: "정부 조사"
 POL_investigate_the_government_desc: "우크라이나는 수년간 높은 수준의 부패를 겪어 왔습니다. 나토가 우크라이나를 받아들이려면 우리가 부패를 낮추도록 도와야 합니다."
 POL_convince_nato_to_accept_ukraine: "나토가 우크라이나를 받아들이도록 설득"
 POL_convince_nato_to_accept_ukraine_desc: "우크라이나가 나토에 가입하려면 각국이 비준해야 합니다. 이것이 좋은 생각임을 그들에게 설득합시다."
 POL_new_ally: "새로운 동맹국"
 POL_new_ally_desc: "이제 마침내 우크라이나를 나토에 가입시킬 때입니다"
 POL_SOV_ukraine_in_nato: "우크라이나, 나토 가입 시도"
 POL_SOV_ukraine_in_nato_desc: "Ukraine is still not ready to join NATO, but Poland does everything it can to convince NATO countries to accept Ukraine in their alliance. We have to stop them.\n\nCurrent §Yacceptance§! is §Y[?THIS.ukr2]§!"
 POL_false_propaganda: "허위 선전"
 POL_false_propaganda_desc: "우크라이나인은 신뢰할 수 없습니다. 우리는 이를 알고 있지만, 나토 역시 그들에 대해 같은 의견을 가져야 합니다."
 POL_recognize_old_sins: "과거의 죄 인정"
 POL_recognize_old_sins_desc: "우크라이나인들은 과거에 많은 실수를 저질렀습니다. 우리는 NATO 국가들에 대해 하나씩 지적할 것입니다. 그들이 이러한 비극을 기억할 때 어떻게 반응할지 흥미롭습니다."
 POL_kaliningrad_problem: "칼리닌그라드 문제"
 POL_kaliningrad_problem_desc: "푸틴의 역외 영토로도 알려진 칼리닌그라드는 수십 년 동안 유럽 지도에서 우리의 시야를 어지럽혀 왔습니다. 이제는 이 지역을 러시아의 손에서 빼앗아 우리 영토로 편입해야 합니다."
 POL_show_them_our_strength: "우리의 힘을 보여 주자"
 POL_show_them_our_strength_desc: "러시아와 국경 분쟁을 벌일 필요도, 이 지역을 팔도록 강요하려는 것도 무의미합니다. 우리는 칼리닌그라드를 무력으로 차지할 것입니다."
 POL_start_the_riots: "폭동 개시"
 POL_start_the_riots_desc: "우리는 칼리닌그라드 국경에서 도발을 시작할 것입니다. 우리 부대가 적의 방어를 돌파하면 러시아가 이 지역을 포기하도록 강요할 것입니다."
 POL_conflict_draw: "분쟁 무승부"
 POL_conflict_draw_desc: "두 달 안에 칼리닌그라드를 장악하지 못하면 러시아 정부와 타협해야 합니다."
 POL_buy_kaliningrad: "칼리닌그라드 매입"
 POL_buy_kaliningrad_desc: "이 영토를 차지하기 위해 전쟁을 벌일 필요는 없습니다. 우리는 러시아가 칼리닌그라드를 우리에게 팔도록 설득할 것입니다."
 POL_set_peace: "평화 수립"
 POL_set_peace_desc: "우리는 칼리닌그라드를 장악했습니다"
 POL_polsa_construction_category: "POLSA 건설 현장"
 POL_polsa_construction_category_desc: "우리만의 우주국을 세우는 것은 막대한 지출입니다. 이 현대적인 건물 단지가 완공되면 대규모 우주 연구를 시작하고 자체 위성과 로켓의 생산을 확대할 수 있습니다. 이 기관의 성대한 개관은 폴란드에 중대한 이정표가 될 것입니다."
 POL_polsa_construction_first_stage: "POLSA 건설 1단계"
 POL_polsa_construction_first_stage_desc: "POLSA 기관 건설을 시작할 수 있습니다."
 POL_polsa_prepare_fundements: "기초 공사 준비"
 POL_polsa_prepare_fundements_desc: "건설을 시작하기 전에 잔해를 치우고 가장 중요한 기초를 준비해야 합니다."
 POL_polsa_reinforced_concrete_buildings: "철근 콘크리트 건물"
 POL_polsa_reinforced_concrete_buildings_desc: "완성된 기초 위에 보강된 벽, 바닥, 천장을 세울 것입니다."
 POL_polsa_electrical_installations: "전기 설비"
 POL_polsa_electrical_installations_desc: "실내 작업을 준비하기 전에 케이블과 전자 시스템을 설치해야 합니다."
 POL_polsa_construction_second_stage: "POLSA 건설 2단계"
 POL_polsa_construction_second_stage_desc: "이제 실내 공간에 집중할 수 있습니다."
 POL_polsa_equip_lobaratories: "연구 실험실 장비 구축"
 POL_polsa_equip_lobaratories_desc: "연구 실험실에서는 위성과 로켓 제작을 위한 신기술을 개발하고 여러 종류의 로켓 연료를 시험할 수 있습니다."
 POL_polsa_equip_offices: "사무 구역 장비 구축"
 POL_polsa_equip_offices_desc: "사무실에서는 기관의 미래를 논의하고 새로운 프로젝트 시작 여부를 표결할 것입니다."
 POL_polsa_equip_technical_areas: "기술 구역 장비 구축"
 POL_polsa_equip_technical_areas_desc: "우리 기관의 기술 부문은 실험실이나 사무 부문 못지않게 중요합니다. 이곳에서 우리의 멋진 기계들을 제작할 것입니다."
 POL_polsa_finish_construction: "POLSA 건설 완료"
 POL_polsa_finish_construction_desc: "단지 전체가 가동할 준비를 마쳤습니다. 우리 시설은 이미 제 역할을 하고 있지만, 기관 전체는 여전히 테이프 커팅과 POLSA 우주국의 공식 개관을 기다리고 있습니다."
 POL_polsa_research_facility_category: "POLSA 연구 시설"
 POL_polsa_research_facility_category_desc: "우리의 우주 기술 연구소는 첫 번째 연구를 시작할 준비가 되었으며, 우리는 여기서 얻은 지식을 활용해 달로 곧장 쏘아 올릴 첫 대형 로켓을 제작할 것입니다!"
 POL_polsa_methane_based_fuel: "메탄 기반 연료"
 POL_polsa_methane_based_fuel_desc: "액체 메탄 기반 연료는 독성이 낮으며 기존의 케로신 기반 로켓 연료의 대안입니다. 우리 실험실이 이러한 종류의 연료를 개선하는 데 도움을 줄 것입니다."
 POL_polsa_rocket_weight_reduction: "로켓 경량화"
 POL_polsa_rocket_weight_reduction_desc: "더 가벼운 로켓은 지구의 성층권을 더 빨리 벗어나고 연료를 덜 소모합니다. 이는 기계의 신뢰성을 유지하면서 생산 비용을 절감하는 데 도움이 될 것입니다."
 POL_polsa_advanced_cosmonaut_training_chambers: "첨단 우주비행사 훈련실"
 POL_polsa_advanced_cosmonaut_training_chambers_desc: "달에 착륙한 최초의 우주비행사들은 상당히 좋은 훈련을 받았습니다. 하지만 '상당히 좋은' 정도로는 우리에게 충분하지 않으므로, 우리의 젊은이들을 최선을 다해 훈련시킬 것입니다!"
 POL_polsa_ai_calculations: "AI 계산"
 POL_polsa_ai_calculations_desc: "인공지능은 인간보다 훨씬 빠르고 정밀하게 계산을 수행합니다. 약간의 감독만 있으면 비행 궤적과 좌표를 결정하는 일을 믿고 맡길 수 있습니다."
 POL_polsa_asteroid_defense: "소행성 방어"
 POL_polsa_asteroid_defense_desc: "우주 암석으로부터의 방어는 모든 인류의 안전을 위해 매우 중요합니다. 우리는 공룡과 같은 운명을 맞고 싶지 않으므로, 어쩌면 피할 수 없을지도 모를 재앙을 막는 방법을 알아야 합니다."
 POL_moon_launch_mission: "달 발사 준비"
 POL_moon_launch_mission_desc: "달에 가기 전에 기초 연구 및 생존 장비를 준비해야 합니다. 또한 즉시 달 식민지 건설에 착수할 것이므로 신규 기지의 시제품도 준비할 것입니다."
 POL_moon_rovers: "달 탐사차"
 POL_moon_rovers_desc: "달 탐사차는 극히 낮은 중력의 험난한 지형에서도 잘 대처할 수 있으며, AI의 지원을 받는 원격 조종 시스템을 갖추면 우주비행사를 위험에 빠뜨리지 않고 지형을 탐사할 수 있습니다."
 POL_moon_house_project: "달 주택 프로젝트"
 POL_moon_house_project_desc: "달에 우리만의 식민지를 건설하려면, 그것이 어떠한 위협에서도 살아남고 우주 방사선을 적절히 차단할 수 있는지 확실히 해야 합니다."
 POL_cooperation_with_nasa: "NASA와의 협력"
 POL_cooperation_with_nasa_desc: "미국의 NASA는 오랫동안 우주 연구의 선구자였습니다."
 POL_cooperation_with_cnes: "CNES와의 협력"
 POL_cooperation_with_cnes_desc: "프랑스의 CNES 덕분에 신형 기계에 필요한 자재 운송 비용을 절감할 수 있습니다."
 POL_cooperation_with_roscosmos: "ROSCOSMOS와의 협력"
 POL_cooperation_with_roscosmos_desc: "우리는 러시아 우주국 ROSCOSMOS와 함께해야 합니다."
