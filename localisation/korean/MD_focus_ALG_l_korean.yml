 alg_promote_arabization: "아랍화 촉진"
 alg_promote_arabization_desc: "아랍 정체성을 강화하여 국가 통합을 강화합니다. 이는 국가를 안정시키겠지만 카빌과 모자브인의 분노를 살 것입니다."
 alg_recognize_tamazight: "타마지트어 공인"
 alg_recognize_tamazight_desc: "타마지트어에 공식 지위를 부여하여 카빌인을 만족시키지만 아랍 민족주의자의 분노를 삽니다."
 alg_ethnicity.100.t: "카빌 시위"
 alg_ethnicity.100.d: "카빌리아의 불만이 문화적 권리와 자치를 요구하는 시위로 폭발했습니다. 정부는 이를 진압할 것인지 양보할 것인지 결정해야 합니다."
 alg_ethnicity.100.a: "시위를 진압한다"
 alg_ethnicity.100.b: "양보한다"
 alg_ethnicity.200.t: "카빌리아의 위기"
 alg_ethnicity.200.d: "카빌 소요가 한계점에 이르렀습니다. 카빌리 자결 운동은 공공연히 독립을 요구하고 있고, 헌병대는 티지우주에 대한 통제력을 잃었으며, 아루크 마을 위원회는 정부가 제시하는 모든 채널을 거부하고 있습니다. 알제는 지역이 완전히 떨어져 나가기 전에 대응해야 합니다."
 alg_ethnicity.200.a: "원하는 것을 준다"
 alg_ethnicity.200.b: "내전의 위험을 감수한다"
 alg_ethnicity.200.c: "타마지트어를 공인하고 개혁한다"
 alg_appease_kabyles: "카빌리 주민 달래기"
 alg_appease_kabyles_desc: "카빌리아의 불안이 커져 국가 안정을 위협하고 있습니다. 문화적 인정, 경제 투자, 제한적 자치와 같은 양보를 제시함으로써 긴장을 가라앉힐 수 있지만, 다른 지역들도 같은 것을 요구하도록 부추길 위험이 있습니다."
 alg_ethnic_policy: "민족 정책"
 alg_ethnic_policy_desc: "\n£MAIN_arab_kabyle\n\n\n\n알제리는 아랍인, 카빌인, 투아레그인, 모자브인, 샤위인 등 상당한 규모의 민족 집단이 있는 다양한 나라입니다. 정부 정책은 그들의 요구 사이에서 균형을 잡아야 합니다. 결정은 이익을 가져다주지만, 어느 한 집단이라도 불쾌하게 하면 불안과 심지어 분리 독립의 위험이 있습니다."
 ALG_sahara_poaching: "사하라의 밀렵"
 ALG_sahara_poaching_desc: "밀렵은 알제리의 광대한 사하라와 스텝 전역에서 중대한 문제입니다. 가젤, 느시, 바바리 양이 불법으로 사냥되며, 밀매 경로는 국제 시장과 연결되어 있습니다. 과도한 방목, 물 남용과 겹쳐 밀렵은 사막화와 생물 다양성 손실을 가속합니다.\n\n§Y사막화§! 확률: §R[?sahara_expands]%§!\n§Y안정화§! 확률: [?sahara_steady]%\n§Y오아시스화§! 확률: §G[?sahara_retreats]%§!\n\n매달\n§Y[?chance_to_not_kill_poachers]%§! 확률로 §Y15명의 새로운 밀렵꾼§!이 활동에 가담합니다.\n§Y[?chance_to_kill_poachers]%§! 확률로 우리 보안 병력이 §Y[?no_of_poachers_to_kill]명의 밀렵꾼§!을 제거합니다.\n\n더 높은 §Y내부 안보 지출§!과 표적화된 밀렵 단속 조치는 성공 확률을 높입니다.\n\n추정되는 활동 중인 밀렵꾼: [?no_of_poachers]명 ([ALG_threat_level_of_poachers])"
 ALG_bi_yearly_poaching_report: "연간 밀렵 보고서"
 ALG_bi_yearly_poaching_report_desc: "12개월마다 밀렵의 영향이 평가됩니다. §G낮은 위협§!은 사막화 위험을 줄이고, §R높은 위협§!은 이를 높입니다."
 ALG_anti_poaching_extra_security: "추가 순찰대원 고용"
 ALG_anti_poaching_extra_security_desc: "사하라와 스텝 전역의 밀렵에 맞서 싸우기 위해 더 많은 순찰대원과 순찰조를 모집합니다."
 ALG_anti_poaching_extra_security_tt: "§G밀렵꾼 제거 확률이 10% 증가합니다§!"
 ALG_anti_poaching_heavy_weapons: "밀렵 단속 부대 무장"
 ALG_anti_poaching_heavy_weapons_desc: "순찰대에 차량, 드론, 중화기를 제공하면 무장한 밀렵 집단에 대한 효과가 높아집니다."
 ALG_anti_poaching_heavy_weapons_tt: "§G제거되는 밀렵꾼의 수가 5명 증가합니다§!"
 ALG_anti_poaching_awareness: "야생 동물 보호 캠페인"
 ALG_anti_poaching_awareness_desc: "멸종 위기종을 밀렵으로부터 보호하는 것의 중요성에 대한 인식을 높이기 위한 대중 캠페인을 벌입니다."
 ALG_threat_level_of_poachers_low: "§G낮은 위협§!"
 ALG_threat_level_of_poachers_medium: "§Y중간 위협§!"
 ALG_threat_level_of_poachers_high: "§R높은 위협§!"
 ALG_eliminate_half_of_poachers: "§G밀렵꾼 수가 §Y[?poachers_killed]§!명 감소합니다§!"
 ALG_anti_poaching_decisions: "사하라의 밀렵"
 ALG_anti_poaching_decisions_desc: "알제리 사하라의 밀렵은 지속적인 문제로 남아 있습니다. 아닥스 영양, 가젤, 사막 치타와 같은 멸종 위기종이 거래나 유희를 위해 사냥되며, 밀수 경로는 종종 이러한 활동을 사헬 전역의 더 광범위한 범죄 및 테러 조직망과 연결합니다. 일부 밀렵꾼은 이웃한 말리, 니제르, 리비아에서 오지만 현지 집단도 가담하고 있습니다. 알제리 당국은 §Y밀렵꾼§!에 대해 강경한 입장을 취했으며, 그들과 보안 병력 사이의 충돌은 드문 일이 아닙니다.\n\n밀렵은 (과도한 방목, 기후 변화, 지속 불가능한 토지 이용과 함께) 사하라의 지속적인 사막화의 한 원인이 됩니다. 밀렵에 맞서 싸우고 취약한 생태계를 보호하는 것은 생물 다양성과 인간의 생계를 모두 지키기 위한 중요한 걸음입니다.\n\n§Y사막화§! 확률: §R[?sahara_expands]%§!\n§Y안정화§! 확률: [?sahara_steady]%\n§Y오아시스화§! 확률: §G[?sahara_retreats]%§!\n\n매달\n§Y[?chance_to_not_kill_poachers]%§! 확률로 §Y15명의 새로운 밀렵꾼§!이 활동을 시작합니다.\n§Y[?chance_to_kill_poachers]%§! 확률로 우리 보안 병력이 §Y[?no_of_poachers_to_kill]명의 밀렵꾼§!을 제거합니다.\n\n§Y내부 안보§! 지출을 늘리거나 병력을 사막 작전에 맞게 장비하고 훈련시키면 밀렵꾼을 제거할 확률을 높일 수 있습니다.\n\n현재 추정되는 밀렵꾼 수: [?no_of_poachers]명 ([ALG_threat_level_of_poachers])"
 ALG_anti_poaching_dehorn_camels: "낙타 표식 캠페인"
 ALG_anti_poaching_dehorn_camels_desc: "사하라 전역의 낙타 떼에 표식을 하고 면밀히 감시하면 밀렵꾼과 밀수업자를 단념시키는 데 도움이 될 수 있습니다. 낙타는 멸종 위기종은 아니지만 밀수 경로나 불법 거래의 표적이 되는 경우가 많습니다. 식별 태그, 지역 사회 감독, 순찰 협력을 도입하면 밀렵꾼이 낙타 절도와 거래로 이익을 얻기가 더 어려워질 것입니다."
 ALG_anti_poaching_dehorn_camels_tt: "§G캠페인이 성공하면 밀렵꾼 수가 절반으로 줄어듭니다§!"
 ALG_total_ban_on_poaching: "밀렵 전면 금지"
 ALG_total_ban_on_poaching_desc: "밀렵은 아닥스 영양, 가젤, 사막 치타와 같은 멸종 위기종을 위협합니다. 일부 사냥 전통이 남아 있지만, 우리는 자연 유산을 보호하기 위해 보호 구역과 취약한 생태계 전역에서 밀렵을 전면 금지하는 단호한 조치를 취해야 합니다."
 alg_appease_kabyles_tt: "카빌족이 다수인 지역, 문화 사업, 지역 자치에 대한 지원금을 늘립니다. 아랍 민족주의자들이 불쾌해할 것입니다."
 alg_arabization_tt: "교육과 공적 생활에서 아랍어와 아랍-이슬람 정체성을 장려합니다. 베르베르 공동체가 저항할 것입니다."
 alg_ethnic.10.t: "타마지그트어 인정의 결실"
 alg_ethnic.10.d: "타마지그트어를 인정한 지 석 달이 지나, 베르베르 공동체들이 국가와의 관계가 개선되었다고 보고하고 있습니다. 국민 지지도가 오르고 있습니다."
 alg_ethnic.10.a: "알제리의 새로운 장."
 ALG_ethnic_data.1.t: "알제리의 민족 인구 구성"
 ALG_ethnic_data.1.d: "검은 봄 이후 알제리의 민족 구성에 대한 분석이 완료되었습니다. 이 위기는 우리 사회의 깊은 균열을 드러냈습니다.\n\n§Y아랍인§!: [?ALG_ethnic_arab]%, 만족도: [?ALG_arab_satisfaction]/100\n다수 인구입니다. 그들의 지배적 지위가 의문시되고 있습니다.\n\n§Yⵣ 카빌족§!: [?ALG_ethnic_kabyle]%, 만족도: [?ALG_kabyle_satisfaction]/100\n§R검은 봄이 많은 이들을 급진화했습니다. 긴장도가 위험한 수준입니다.§!\n\n§Y샤위족§!: [?ALG_ethnic_chaoui]%, 만족도: [?ALG_chaoui_satisfaction]/100\n카빌리아의 사태를 예의주시하고 있습니다.\n\n§Y⵿ 투아레그족§!: [?ALG_ethnic_tuareg]%, 만족도: [?ALG_tuareg_satisfaction]/100\n사하라 지역 공동체들은 알제로부터 소외되었다고 느낍니다.\n\n§Yⵎ 모자브족§!: [?ALG_ethnic_mozabite]%, 만족도: [?ALG_mozabite_satisfaction]/100\n독자적인 이바디파 공동체를 유지하고 있습니다.\n\n§Y기타§!: [?ALG_ethnic_other]%\n\n§Y민족 관리 체계가 이제 활성화되었습니다.§!"
 ALG_ethnic_data.1.a: "이 문제는 신중하게 관리해야 한다."
 ALG_ethnic_system_active_tt: "§G민족 관리 체계가 이제 활성화되었습니다!§!\n\n결정 패널에서 만족도를 확인하십시오.\n정책으로 집단들의 만족도를 유지하십시오.\n소외된 집단은 문제를 일으킬 것입니다!"
 ALG_ethnic_data_category: "[ALG.GetFlag]§Y민족 인구 구성§!"
 ALG_ethnic_data_category_desc: "§Y알제리의 민족 모자이크§!는 우리 국가를 이루는 민족들의 복잡한 직물을 나타냅니다. 파괴적인 §R내전(1991-2002)§!의 여파 속에서 민족 관계의 관리는 국가 안정에 결정적이 되었습니다. [ALG.GetLeader] 대통령의 국민 화합 정책은 모든 공동체의 불만을 해소해야 합니다.\n\n특히 §Y카빌족 인구§!는 여전히 동요하고 있으며, 그들의 우려가 해소되지 않으면 §R2001년의 검은 봄§!이 지평선에 다가옵니다. 한편 남부의 §Y투아레그족§! 공동체는 이웃한 말리와 니제르의 사태를 관심 있게 지켜보고 있습니다.\n\n§H 작동 방식 §!\n\n각 민족 집단에는 §Y만족도§!(0-100)가 있습니다.\n§G- 70 초과§!: 집단이 §G만족§! -> 국가 보너스 제공\n§Y- 40-70§!: 집단이 §Y중립§! -> 특별한 효과 없음\n§R- 40 미만§!: 집단이 §R불만§! -> 페널티 발생\n§R- 25 미만§!: §R위험§! -> 심각한 페널티, 반란 가능\n\n소외된 집단의 §Y만족도는 매월 감소합니다§!. 한 집단을 편들면 다른 집단이 불만을 품는 경우가 많습니다!\n\n§H 현재 상태 §!\n\n§Y아랍인§! - 인구의 [?ALG_ethnic_arab]%\n  만족도: [?ALG_arab_satisfaction]/100\n  §Y만족 시:§! §G+정치력, +안정도, +인력§!\n\n§Y카빌족§! - 인구의 [?ALG_ethnic_kabyle]%\n  만족도: [?ALG_kabyle_satisfaction]/100\n  §Y만족 시:§! §G+연구 속도§!\n  §R경고: 만족도가 낮게 유지되면 검은 봄이 발생할 수 있습니다!§!\n\n§Y샤위족§! - 인구의 [?ALG_ethnic_chaoui]%\n  만족도: [?ALG_chaoui_satisfaction]/100\n  §Y만족 시:§! §G+건설 속도, +자원§!\n\n§Y투아레그족§! - 인구의 [?ALG_ethnic_tuareg]%\n  만족도: [?ALG_tuareg_satisfaction]/100\n  §Y만족 시:§! §G+육군 조직률, +사막 전투§!\n\n§Y모자브족§! - 인구의 [?ALG_ethnic_mozabite]%\n  만족도: [?ALG_mozabite_satisfaction]/100\n  §Y만족 시:§! §G-소비재, +무역§!\n\n§Y기타§! - 인구의 [?ALG_ethnic_other]%"
 ALG_census_tt: "인구 자료를 갱신하고 정책에 반영하기 위해 포괄적인 전국 인구 조사를 실시합니다."
 ALG_ethnic_data.2.t: "인구 조사 결과와 국가 정체성"
 ALG_ethnic_data.2.d: "인구 조사로 알제리의 민족 다양성이 드러났습니다. 정치적으로 어떻게 대응해야 합니까?"
 ALG_ethnic_data.2.a: "아랍-이슬람 정체성을 강화한다."
 ALG_ethnic_data.2.b: "베르베르와 아랍 유산을 동등하게 기린다."
 ALG_ethnic_data.2.c: "입장을 밝히지 않는다."
 ALG_ethnic_data.20.t: "가르다이아 충돌"
 ALG_ethnic_data.20.d: "§R2013년 - 음자브 계곡§!\n\n음자브 계곡에서 역사적 도시 가르다이아를 중심으로 아랍 공동체와 모자브 공동체 사이에 폭력적 충돌이 일어났습니다. 묘지 분쟁에서 시작된 폭력은 광범위한 공동체 폭동으로 번졌습니다.\n\n모자브 상점과 주택이 공격당하고 불탔습니다. 양측에서 여러 명이 사망했습니다. 고대 루스탐 왕조의 후예인 모자브 공동체는 자신들의 존재 자체가 위협받고 있다고 느낍니다.\n\n보안군은 상황을 억제하는 데 애를 먹고 있습니다. 어떻게 대응해야 합니까?"
 ALG_ethnic_data.20.a: "아랍인들의 불만에는 정당한 면이 있다. 그들 편에 선다."
 ALG_ethnic_data.20.b: "모자브 소수 집단을 보호한다. 그들의 지역을 확보하기 위해 병력을 투입한다."
 ALG_ethnic_data.20.c: "양 공동체 사이에서 중립적 중재를 시도한다."
 ALG_ghardaia_arab_side_tt: "우리는 아랍 공동체 편에 섭니다.\n§R모자브족 만족도 -20§!\n§G아랍인 만족도 +5§!"
 ALG_ghardaia_mozabite_side_tt: "모자브족을 보호하기 위해 병력을 배치합니다.\n§R모자브족 만족도 -5§! (고마워하지만 트라우마를 입음)\n§R아랍인 만족도 -10§!"
 ALG_ghardaia_neutral_tt: "중재를 시도합니다.\n§R모자브족 만족도 -10§!\n§R아랍인 만족도 -3§!\n어느 쪽도 완전히 만족하지 못합니다."
 ALG_ethnic_data.10.t: "고조되는 민족 간 긴장도"
 ALG_ethnic_data.10.d: "불만을 품은 민족 공동체들 사이에서 불안이 커지고 있다는 보고가 있습니다. 지방 관리들은 시위가 조직되고 있다고 경고하며, 우려가 해소되지 않으면 더 급진적인 행동이 나올 수 있다고 걱정하는 이들도 있습니다.\n\n§R현재 위기 집단:§!"
 ALG_ethnic_data.10.a: "모든 불만을 해결할 수는 없다."
 ALG_ethnic_data.10.b: "관리를 보내 그들의 우려를 해소한다."
 ALG_show_ethnic_data: "§Y민족 개요 보기§!"
 ALG_show_ethnic_data_desc: "알제리 내 모든 민족 집단의 현재 상태를 검토합니다."
 ALG_ethnic_overview_full_tt: "§H민족 집단 개요§!\n\n§Y아랍인§! | 인구: §G[?ALG_ethnic_arab]%§! | 만족도: §B[?ALG_arab_satisfaction]§!/100\n§Yⵣ 카빌족§! | 인구: §G[?ALG_ethnic_kabyle]%§! | 만족도: §B[?ALG_kabyle_satisfaction]§!/100\n§Y샤위족§! | 인구: §G[?ALG_ethnic_chaoui]%§! | 만족도: §B[?ALG_chaoui_satisfaction]§!/100\n§Y⵿ 투아레그족§! | 인구: §G[?ALG_ethnic_tuareg]%§! | 만족도: §B[?ALG_tuareg_satisfaction]§!/100\n§Yⵎ 모자브족§! | 인구: §G[?ALG_ethnic_mozabite]%§! | 만족도: §B[?ALG_mozabite_satisfaction]§!/100\n§Y기타§! | 인구: §G[?ALG_ethnic_other]%§!\n\n§Y기억하십시오:§! 집단은 적극적으로 지원하지 않으면 만족도를 잃습니다!"
 ALG_favor_arab_policies: "친아랍 정책"
 ALG_favor_arab_policies_desc: "아랍어와 아랍-이슬람 문화 정체성을 장려하고, 개발에서 아랍 지역을 우선시합니다.\n\n§G효과:§!\n• 아랍인 만족도 §G+10§!\n• 카빌족 만족도 §R-5§!\n• 샤위족 만족도 §R-3§!\n• 투아레그족 만족도 §R-3§!\n• 모자브족 만족도 §R-3§!\n\n§Y재사용 대기:§! 60일"
 ALG_favor_arab_tt: "§G아랍인들이 우리의 지원에 만족합니다!§!\n§R소수 집단들은 소외감을 느낍니다.§!"
 ALG_favor_kabyle_policies: "친카빌 정책"
 ALG_favor_kabyle_policies_desc: "타마지그트어 교육, 카빌 문화 보존, 카빌리 지역 개발을 지원합니다.\n\n§G효과:§!\n• 카빌족 만족도 §G+10§!\n• 아랍인 만족도 §R-5§!\n• 샤위족 만족도 §R-2§!\n\n§Y재사용 대기:§! 60일"
 ALG_favor_kabyle_tt: "§G카빌족이 자신들의 유산이 인정받은 것을 기뻐합니다!§!\n§R아랍인들은 자신들의 지배적 지위가 위협받는다고 느낍니다.§!"
 ALG_favor_chaoui_policies: "친샤위 정책"
 ALG_favor_chaoui_policies_desc: "아우레스 산악 지역 개발에 투자하고 샤위족 문화 사업을 지원합니다.\n\n§G효과:§!\n• 샤위족 만족도 §G+10§!\n• 아랍인 만족도 §R-3§!\n• 카빌족 만족도 §R-2§!\n\n§Y재사용 대기:§! 60일"
 ALG_favor_chaoui_tt: "§G샤위족이 자신들의 지역 개발에 감사합니다!§!"
 ALG_favor_tuareg_policies: "친투아레그 정책"
 ALG_favor_tuareg_policies_desc: "사하라에서의 투아레그 자치를 지원하고, 남부 개발에 투자하며, 투아레그 공동체를 통합합니다.\n\n§G효과:§!\n• 투아레그족 만족도 §G+10§!\n• 아랍인 만족도 §R-3§!\n\n§Y재사용 대기:§! 60일"
 ALG_favor_tuareg_tt: "§G사막의 푸른 사람들이 우리의 관심에 감사합니다!§!"
 ALG_favor_mozabite_policies: "친모자브 정책"
 ALG_favor_mozabite_policies_desc: "이바디파 종교 관행을 보호하고, 모자브 상인 공동체를 지원하며, 음자브 계곡을 개발합니다.\n\n§G효과:§!\n• 모자브족 만족도 §G+10§!\n• 아랍인 만족도 §R-2§!\n\n§Y재사용 대기:§! 60일"
 ALG_favor_mozabite_tt: "§G모자브 상인들이 교역망을 확장합니다!§!"
 ALG_recognize_tamazight_1: "타마지그트어 공인"
 ALG_recognize_tamazight_1_desc: "타마지그트어를 아랍어와 함께 알제리의 국어로 공식 인정합니다. 이 역사적 결정은 베르베르 운동의 핵심 요구를 해소할 것입니다.\n\n§G효과:§!\n• 카빌족 만족도 §G+20§!\n• 샤위족 만족도 §G+15§!\n• 투아레그족 만족도 §G+10§!\n• 모자브족 만족도 §G+10§!\n• 아랍인 만족도 §R-10§!\n• 안정도 §G+5%§!\n\n§Y2002년 이후 사용 가능§!"
 ALG_recognize_tamazight_tt: "§G타마지그트어가 국어로 역사적 공인을 받았습니다!§!\n모든 베르베르 집단이 만족하지만 아랍 민족주의자들은 분노합니다."
 ALG_national_unity_initiative: "국민 통합 구상"
 ALG_national_unity_initiative_desc: "부테플리카의 화해 정책을 바탕으로 민족 분열보다 알제리 국가 정체성을 우선시하는 포괄적 계획을 시작합니다.\n\n§G효과:§!\n• 모든 집단 만족도 §G+5§!\n• 완료 시 안정도 §G+3%§!\n\n§Y비용이 많이 들지만 균형 잡힌 정책입니다.§!\n§Y재사용 대기:§! 180일"
 ALG_unity_policy_tt: "§G모든 알제리인이 국기 아래 하나가 됩니다!§!"
 ALG_suppress_ethnic_unrest: "§R민족 불안 진압§!"
 ALG_suppress_ethnic_unrest_desc: "보안군을 동원해 민족 시위를 진압하고 질서를 회복합니다.\n\n§R비상 조치§! - 집단이 위기 상태(만족도 25 미만)일 때만 사용할 수 있습니다.\n\n§Y효과:§!\n• 위기 집단 만족도 §G+15§!\n• 안정도 §R-5%§!\n• 전쟁 지지도 §R-3%§!\n\n§R이는 일시적인 해결책일 뿐입니다!§!"
 ALG_suppress_unrest_tt: "보안군이 당분간 질서를 회복합니다.\n§R이는 근본적인 문제를 해결하지 못합니다.§!"
 ALG_conduct_national_census: "전국 인구 조사 실시"
 ALG_conduct_national_census_desc: "우리 인구 구성을 더 잘 이해하기 위해 상세한 인구 조사를 수행합니다."
 ALG_census_arab_focus_tt: "§G아랍인들이 만족합니다!§! 다른 집단들은 소외감을 느낍니다."
 ALG_census_balanced_tt: "§G모든 집단이 다양성의 인정에 감사합니다!§!"
 ALG_census_neutral_tt: "우리는 정체성 정치에 대해 공식적 입장을 취하지 않습니다."
 ALG_arab_content: "아랍 공동체 지지"
 ALG_arab_content_desc: "아랍 다수 집단이 정부를 진심으로 지지하며, 정치적 후원과 열의 있는 신병을 우리 군에 제공합니다."
 ALG_arab_discontent: "아랍인의 불만"
 ALG_arab_discontent_desc: "아랍 인구는 자신들의 희생 위에 소수 집단을 우대하는 것으로 보이는 정부 정책에 점점 불만을 품고 있습니다."
 ALG_arab_unrest: "아랍인의 소요"
 ALG_arab_unrest_desc: "아랍 다수 집단이 깊이 불만을 품고 있습니다. 시위와 민간 소요가 흔해지고 있으며, 내전 이후 힘들게 얻은 안정을 위협하고 있습니다."
 ALG_chaoui_content: "아우레스의 번영"
 ALG_chaoui_content_desc: "샤위족은 아우레스 산악 지대 전역의 건설 및 채굴 사업에 기여하여 지역 발전을 촉진하고 있습니다."
 ALG_chaoui_discontent: "아우레스 소외"
 ALG_chaoui_discontent_desc: "샤위족 주민들은 중앙정부로부터 잊혔다고 느낍니다. 아우레스 지역의 개발은 내전 이후 정체되어 있습니다."
 ALG_tuareg_content: "투아레그 동맹"
 ALG_tuareg_content_desc: "긍지 높은 투아레그 전사들이 정부를 지지하며 전설적인 사막전 전문성을 우리 군에 빌려 줍니다."
 ALG_tuareg_discontent: "사하라 긴장"
 ALG_tuareg_discontent_desc: "투아레그 공동체는 알제가 자신들을 무시한다고 느낍니다. 말리와 니제르의 지역 불안정이 그들로 하여금 충성을 의심하게 만들고 있습니다."
 ALG_tuareg_unrest: "투아레그 봉기"
 ALG_tuareg_unrest_desc: "투아레그 전투원들이 사하라에서 무장 저항을 조직하고 있습니다. 말리 및 니제르와의 국경을 넘나드는 움직임이 상황을 복잡하게 만듭니다. 남부는 통치 불가능해지고 있습니다."
 ALG_mozabite_content: "모자브 상업"
 ALG_mozabite_content_desc: "사업 수완이 뛰어난 모자브 공동체는 상업적 전문성으로 교역망을 키우고 소비재 비용을 낮추고 있습니다."
 ALG_mozabite_discontent: "음자브 긴장"
 ALG_mozabite_discontent_desc: "모자브 공동체가 국가 경제 참여에서 물러나고 있습니다. 음자브 계곡에서 아랍 이웃들과의 긴장도가 높아지고 있습니다."
 ALG_ethnic_harmony: "민족 화합"
 ALG_ethnic_harmony_desc: "모든 주요 민족 집단이 정부 정책에 만족하고 있습니다. 알제리는 하나로 뭉쳐 마침내 내전의 트라우마를 극복하고 있습니다!"
 ALG_ethnic_tension: "민족 간 긴장도"
 ALG_ethnic_tension_desc: "여러 민족 집단이 깊이 불만을 품고 있습니다. 나라가 민족 경계를 따라 분열하면서 부테플리카 시대의 위태로운 평화가 무너지고 있습니다."
 ALG_census_conducted: "인구 조사 실시됨"
 ALG_ethnic_data_initialized: "민족 업무 체계 수립됨"
 ALG_recent_ethnic_policy: "최근 민족 정책 시행됨"
 ALG_recent_unity_policy: "최근 통합 구상"
 ALG_recent_suppression: "최근 진압 조치"
 ALG_tamazight_recognized: "타마지그트어 공인됨"
 ALG_ghardaia_clashes_happened: "가르다이아 충돌 발생함"
 ALG_ethnic_warning_recent: "최근 민족 간 긴장도 해소"
 ALG_arabization_hardline: "강경 아랍화 정책"
 ALG_arabization_pushed_once: "초기 아랍화 추진"
 ALG_arabization_recent: "최근의 아랍화 노력"
 ALG_kabyle_appeased_recently: "카빌족 정서 달래기"
 ALG_sahara_expansion: "사하라 사막화"
 ALG_sahara_expansion_desc: "사하라는 알제리 대부분을 덮고 있으며 북쪽의 스텝 지대와 이 나라의 제한된 농경지로 꾸준히 밀려오고 있습니다. 과도한 방목, 지속 불가능한 관개, 자원 채취는 이 과정을 가속하고, 보전, 지속 가능한 농업, 재생 에너지는 이를 늦춥니다.\n\n1년에 한 번 사막의 상태에 대한 갱신을 받습니다. 사막은 확장(§Y사막화§!, 한 단계 악화)하거나, 유지(§Y안정화§!)되거나, 물러날(§Y오아시스화§!, 한 단계 개선) 수 있습니다.\n\n§Y사막화§! 확률: §R[?sahara_expands]%§!\n§Y안정화§! 확률: [?sahara_steady]%\n§Y오아시스화§! 확률: §G[?sahara_retreats]%§!\n\n이 확률들은 각각 중점을 통해 §Y5%§!씩 변동합니다. §Y$ALG_increase_cattle_grazing$§!, §Y$ALG_oil_production$§!, §Y$ALG_hassi_massoud_exploitation$§!과 같은 농업 및 산업 확장은 사막화 가능성을 높입니다. §Y$ALG_optimize_pastoral_practices$§!, §Y$ALG_expand_nature_reserves_sahara$§!, §Y$ALG_solar_panel_grid$§!와 같은 보전 및 재생 에너지는 가능성을 낮춥니다."
 ALG_ethnic_relations_desc: "알제리는 국가에 대한 충성도가 크게 다른 여러 민족으로 이루어진 모자이크입니다.\n\n§Y아랍 인구:§! [ALG_arab_satisfaction_text]\n§Y카빌 인구:§! [ALG_kabyle_satisfaction_text]\n§Y샤위 인구:§! [ALG_chaoui_satisfaction_text]\n§Y투아레그 인구:§! [ALG_tuareg_satisfaction_text]\n§Y므자브 인구:§! [ALG_mozabite_satisfaction_text]"
 ALG_black_spring_event_desc: "카빌리 전역에서 시위가 일어났습니다. 주민들의 정서: [ALG_kabyle_satisfaction_text]. 정권은 대응 방식을 결정해야 합니다."
 deep_state_growing_tt: "알제리 내에서 딥 스테이트의 영향력이 커지고 있습니다."
 deep_state_power_increased_1_tt: "§R딥 스테이트 권력: +1§!"
