 ARM.Nat_Autocracy_wagner_desc: "在我国夺取政权的瓦格纳系。从最理想角度来说也只能说是纯正的军事独裁政权"
 AST.liberalism_icon: "£AST_liberalism"
 AUS.Western_Autocracy: "£generic_Western_Autocracy_small SGA - 黑黄联盟"
 AUS.Western_Autocracy_desc: "君主主义 - 黑黄联盟成立于2004年，是一个君主主义政党，寻求恢复世袭君主制（最好是哈布斯堡家族），并自然主张奥地利、匈牙利、克罗地亚、捷克共和国、斯洛文尼亚和斯洛伐克在一个共同皇帝之下联合，一如奥匈帝国皇冠下的昔日时光。"
 AUS.Neutral_Communism_icon: "£AUS_emerging_left_wing_radical"
 AZE.socialism_icon: "£AZE_western_social_democrat"
 AZE.Caliphate_desc_1: "（萨拉菲圣战主义） - 该组织此前被视为伊斯兰国“高加索省”的一部分，2015年，在当地团体与伊斯兰国领导层的支持下于阿塞拜疆宣告成立了一个省。该组织寻求建立一个更具凝聚力的伊斯兰国分支，其意识形态与目标比组织涣散的高加索省更为紧密地一致。"
 AZE.Neutral_Muslim_Brotherhood: "£AZE_non_aligned_moderate_islamist (MP) - 穆萨瓦特党"
 AZE.Neutral_Muslim_Brotherhood_icon: "£AZE_non_aligned_moderate_islamist"
 AZE.Neutral_Muslim_Brotherhood_desc: "（伊斯兰民主） - 作为阿塞拜疆历史最悠久的政党之一，最初成立于1911年，但现代形态直到1989年才出现。尽管它作为反对党曾取得初步成功，且根植于阿塞拜疆历史之中，但党内各派系之间的内部分歧以及不明确的政纲或缺乏统一主张，使其失去了最初的民众支持。在意识形态上，该党融合了温和自由主义与阿塞拜疆民族主义，不过历史上该党也曾受到伊斯兰保守主义影响，并由此塑造了内部各派系。"
 BOS.Neutral_conservatism: "£Bosnian_Neutral_conservatism 民主进步党"
 BOS.Neutral_conservatism_icon: "£Bosnian_Neutral_conservatism"
 BOS.Neutral_conservatism_desc: "民主进步党是波斯尼亚和黑塞哥维那的一个政党，成立于1999年。该党自称为中右翼政党，其纲领强调民主、经济自由主义和欧洲一体化。民主进步党由一群政治家组建，他们此前曾与塞尔维亚民主党有关联，但后来对塞尔维亚民主党的民族主义议程及其创始人拉多万·卡拉季奇的领导感到失望 - 卡拉季奇后来因战争罪被起诉。民主进步党的创始成员将该党视为塞尔维亚民主党更为温和的替代选择，侧重于经济和政治改革，而非民族主义言论。自成立以来，民主进步党已成为波斯尼亚和黑塞哥维那的主要政党之一，尤其是在塞族共和国实体中。该党曾参与实体和国家层面的执政联盟，其成员也曾在政府和议会中任职。民主进步党现任领导人为布拉尼斯拉夫·博雷诺维奇，他自2016年起担任该职位。该党一直是波斯尼亚和黑塞哥维那政治与经济改革的积极倡导者，并对该国复杂的政府体制持批评态度——该体制将权力分散于多个实体和治理层级之间。民主进步党还强调欧洲一体化和与欧盟建立更紧密关系的重要性。"
 BOS.neutral_Social: "£Bosnian_neutral_Social 独立社会民主人士"
 BOS.neutral_Social_icon: "£Bosnian_neutral_Social"
 BOS.neutral_Social_desc: "独立社会民主人士联盟（NSD）是波斯尼亚和黑塞哥维那的一个政党，成立于2006年。该党将自身定位为中左翼政党。NSD由一群前波斯尼亚和黑塞哥维那社会民主党（SDP BiH）成员创立，他们对兹拉特科·拉古姆季亚领导下的该党方向感到失望。NSD的创始成员将该党视为SDP更为进步的替代选择，侧重于社会正义与人权。自成立以来，NSD一直参与波黑地区与国家层面的执政联盟。该党还积极推动政治与经济改革，并批评该国复杂的政府体制以及它认为阻碍进步的政治精英。NSD现任领导人为兹德拉夫科·克尔斯马诺维奇，他自2020年起担任该职位。该党纲领强调社会正义、人权以及对欧洲一体化的承诺。NSD还积极推动巴尔干地区加强区域合作，并倡导在波黑建立一个更具包容性和民主的社会。"
 ISR.conservatism_alt_icon: "£ISR_conservatism_alt"
 ISR.conservative_alt2: "£ISR_liberalism_alt1 前进"
 ISR.conservative_alt2_desc: "（自由派犹太复国主义） - §4前进§!\n\n前进党是以色列的一个中间派与自由主义政党。它最初创建是为了获得推行单边撤离计划的自由 - 即从巴勒斯坦领土上撤除以色列定居点，并划定以色列与未来巴勒斯坦国之间的边界。"
 ISR.conservative_alt2_icon: "£ISR_liberalism_alt1"
 ISR.neutral_democrats: "£ISR_democrats 民主党 - 梅雷兹派"
 ISR.neutral_democrats_desc: "（社会进步主义） - §4民主党§!-§7梅雷兹派§!\n\n民主党是以色列的一个社会民主主义政党。该党于2024年由工党与梅雷兹党合并而成。作为秉承劳工犹太复国主义传统、支持福利国家与工会联系的政党，民主党主张支持以巴和平进程、务实的外交政策以及社会民主主义的经济政策。"
 ISR.neutral_democrats_icon: "£ISR_neutral_Social"
 LES.Western_Autocracy: "£generic_Western_Autocracy_small (MFP) - 马雷马特卢自由党"
 LES.Western_Autocracy_desc: "（保皇派）\n马雷马特卢自由党\n\n马雷马特卢自由党成立于1962年，由自由党与马雷马-特卢党合并而成，主张进一步巩固塞伊索王室的地位。成立后不久，该党便吸引了众多从巴索托兰大会党脱离的成员。"
 LES.Neutral_conservatism: "£generic_Neutral_conservatism_small (NIP) - 民族独立党"
 LES.Neutral_conservatism_desc: "（共和保守主义）\n民族独立党\n\n在1985年从巴苏陀国民党（BNP）分裂后，民族独立党试图从保守主义立场出发，将自己定位为BNP的替代选择。该党愿意与南非的种族隔离政府合作，并在此问题上与BNP存在重大分歧，从而将自己塑造为更为共和主义的保守派。\n\n该党将其大部分目标集中于代表农民及其他农村民众的利益，与任何政治运动或基金会均无实质性的国际联系。"
 LOG.Nat_Autocracy: "£generic_Nat_Autocracy_small 中非共和国复兴人民阵线"
 LOG.Nat_Autocracy_desc: "（军事叛乱组织）- 中非共和国复兴人民阵线\n中非复兴人民阵线是作为一个叛乱组织而成立的，是几个前塞雷卡叛乱派别之一。在努尔丁·亚当的领导下，该组织在中非共和国东北部建立了自己的平行国家，称为洛贡共和国（亦称达尔库提）。"
 MAD.Nat_Autocracy: "£generic_Nat_Autocracy_small (TM) - 马达加斯加武装部队"
 MAD.Nat_Autocracy_desc: "（军政府）\n马达加斯加武装力量\n\n其根源可追溯至16世纪的萨卡拉瓦与梅里纳军队，而马达加斯加武装力量的现行建制自1960年起马达加斯加从法国获得独立便已存在。\n\n自成立以来，马达加斯加武装力量从未卷入任何武装冲突，包括马达加斯加境内。在政治动荡时期，军方偶尔被用于恢复秩序，其中军方在其中发挥了重要作用的显著事例包括1972年的军事督政府，以及向第三共和国过渡的进程。"
 MOZ.Neutral_Muslim_Brotherhood: "£generic_Neutral_Muslim_Brotherhood_small (PIMO) - 莫桑比克独立党"
 MOZ.Neutral_Muslim_Brotherhood_desc: "（伊斯兰民主主义）\n莫桑比克独立党\n\n莫桑比克独立党成立于1992年，其大部分政策与纲领均建立在对伊斯兰教的解读之上。\n\n然而，由于莫桑比克的选举法，该党被禁止具有公开的宗教或地区归属。尽管独立党尽力遵守选举准则，但仍被许多人视为一个伊斯兰民主政党。"
 MOZ.neutral_Social: "£generic_neutral_Social_small (FUMO) - 莫桑比克联合阵线"
 MOZ.neutral_Social_desc: "（社会民主主义）\n莫桑比克联合阵线\n\n莫桑比克联合阵线于1976年在流亡中成立，最初是反对莫桑比克解放阵线党的政党，在共产主义理念上立场不同。\n\n这种形式的莫桑比克联合阵线一直存在到1980年，随后解散，并于1992年莫桑比克内战结束时重建。新形式的莫桑比克联合阵线与莫桑比克解放阵线党一样，政治立场已趋于温和，不过莫桑比克联合阵线的温和程度更甚，宣称自己是社会民主主义者，而非像莫桑比克解放阵线党那样的泛非社会主义者。"
 MOZ.Monarchist: "£generic_Monarchist_small 恩克苏马洛家族"
 MOZ.Monarchist_desc: "（君主主义）\n恩克苏马洛家族\n\n恩克苏马洛家族之名源自加扎帝国首位酋长的姓氏。自加扎最后一位酋长恩古恩古尼亚耶在葡萄牙吞并今莫桑比克地区后被送往亚速尔群岛以来，该家族大多流亡在外。\n\n如今的恩克苏马洛家族居住于[274.GetName]，实质上延续着自葡萄牙人以来的流亡状态，尽管自1975年莫桑比克独立以来这一流放已是完全出于自愿。"
 PHI.Conservative: "£generic_Conservative_small 菲律宾联邦党"
 PHI.Conservative_desc: "反动派 - 联邦党是一个支持杜特尔特现政府的联邦主义政党。"
 PHI.Nat_Populism_Icon: "£PHI_Nat_Populism"
 SAF.liberalism_DA: "£SAF_liberal (DA) - 民主联盟"
 SAF.liberalism_DA_icon: "£SAF_liberal"
 SAF.liberalism_DA_desc: "（南非自由主义）\n民主联盟\n\n在民主党衰落及随后又并不完全的崛起之后，民主联盟于2000年中期成立，作为民主党的直接延续，这是一种让合并后的自由派政党能够参加选举而不因议员倒戈触发补选的方式。民主联盟于2003年全面接管了民主党遗留下来的政党机构。\n\n该党着重强调人权、联邦制和自由企业，主张进一步放开经济，并放松对经济和劳动法诸多方面的管制。"
 SAF.liberalism_DP: "£SAF_liberal (DP) - 民主党"
 SAF.liberalism_DP_icon: "£SAF_liberal"
 SAF.liberalism_DP_desc: "（保守自由主义）\n民主党\n\n民主党成立于1989年，几乎是进步联邦党的直接延续，而进步联邦党在国民党执政前期曾是种族隔离制度下的一个微弱反对力量。\n\n民主党在1989年选举中首次亮相，当时仍处于种族隔离法律之下，而这次选举也是此类法律下的最后一次选举。该党从原先作为进步联邦党的地位中获得了13个席位，跃居第三位，从国民党手中夺走了大量自由派选票。一些人士认为，这一令人震惊的结果促使国民党迅速放宽其种族政策，最终导致非国大被解禁，以及随后的1994年首次民主选举。"
 SAF.anarchist_communism_left_solo_desc: "（非洲民族主义者 - 左翼）\n$SAF.anarchist_communism_main_desc$\n\n非国大现任领导人属于“左翼”派系，并将试图按照其派系路线施政。"
 SAF.anarchist_communism_left_solo_TEMP_desc: "（非洲民族主义者 - 左翼）\n$SAF.anarchist_communism_main_desc$\n\n非国大现任领导人属于“左翼”派系，将试图按照其派系路线施政。\n\n§2非国大不再是三方联盟的成员，将独立参加选举§!§2!§!"
 SAF.anarchist_communism_left_tripartite_desc: "（非洲民族主义者 - 左翼）\n$SAF.anarchist_communism_main_desc$\n\n非国大现任领导人属于“左翼”派系，将试图按照其派系路线施政。\n\n§2非国大是三方联盟的成员，上台后将自动与§!§Y$SAF.communist_state$§!§2和§!§Y(COSATU) - 南非工会大会§!§2联合！§!"
 SAF.anarchist_communism_main_desc: "非洲人国民大会\n\n作为南非历史最悠久的政党，非洲人国民大会成立于1912年，最初是南非黑人的倡导团体，随后迅速成为反对种族隔离的地下抵抗运动的一部分，直至该制度最终崩溃，并于1990年获得合法地位。\n\n在被取缔的岁月里，非洲人国民大会开展了多种形式的抵抗，起初是和平方式，如非暴力反抗；沙佩维尔大屠杀后，则转向武装抵抗，并成立了其准军事组织“民族之矛”。"
 SAF.anarchist_communism_right_solo_desc: "（非洲民族主义者 - 右翼）\n$SAF.anarchist_communism_main_desc$\n\n非国大现任领导人属于“右翼”派系，并将试图按照其派系路线施政。"
 SAF.anarchist_communism_right_solo_TEMP_desc: "（非洲民族主义者 - 右翼）\n$SAF.anarchist_communism_main_desc$\n\n非国大现任领导人属于“右翼”派系，并将试图按照其派系路线施政。\n\n§2非国大不再是三方联盟的成员，将独立参加选举§!§2!§!"
 SAF.anarchist_communism_right_tripartite_desc: "（非洲民族主义者 - 右翼）\n$SAF.anarchist_communism_main_desc$\n\n非国大现任领导人属于“右翼”派系，并将试图按照其派系路线施政。\n\n§2非国大是三方联盟的成员，上台后将自动与§!§Y$SAF.communist_state$§!§2和§!§Y南非工会大会§!§2联合！§!"
 SAF.Neutral_Muslim_Brotherhood_AJ: "£SAF_moderate_islamist (AJ) - 伊斯兰社群党"
 SAF.Neutral_Muslim_Brotherhood_AJ_icon: "£SAF_moderate_islamist"
 SAF.Neutral_Muslim_Brotherhood_AJ_desc: "（伊斯兰民主主义）\n伊斯兰社群党\n\n伊斯兰社群党由商人和教师加尼夫·亨德里克斯于2007年创立，主要旨在支持穆斯林的权利和利益，但其政策通过遵循与伊斯兰民主融合的乌班图原则，广泛支持所有南非人。\n\n伊斯兰社群党与南非穆斯林学生协会有密切联系，因为加尼夫·亨德里克斯在该协会的创立中也发挥了重要作用。"
 SAF.Neutral_Muslim_Brotherhood_AMP: "£SAF_moderate_islamist (AMP) - 非洲穆斯林党"
 SAF.Neutral_Muslim_Brotherhood_AMP_icon: "£SAF_moderate_islamist"
 SAF.Neutral_Muslim_Brotherhood_AMP_desc: "（少数族裔政治）\n非洲穆斯林党\n\n非洲穆斯林党成立于1994年，通常只在[281.GetName]地区参加选举，但在1999年以非洲道德党的名义参加了联邦选举。他们主要致力于代表南非庞大的穆斯林群体。"
 SAF.Nat_Populism_VF: "£SAF_right_wing_populism (VF) - 自由阵线"
 SAF.Nat_Populism_VF_icon: "£SAF_right_wing_populism"
 SAF.Nat_Populism_VF_desc: "（阿非利卡民族主义）\n自由阵线\n\n由退役的南非国防军炮兵康斯坦德·维尔容于1994年创立，维尔容在参与博普塔茨瓦纳危机期间的冲突后，寻求以更民主的方式实现其政治目标。这场血腥危机以及随后阿非利卡抵抗运动的介入，导致他退出了人民阵线运动。\n\n自由阵线最初开始努力尝试向民主政府请愿，以允许建立一个“民族国家”，尽管这一理念近年来已经减弱，该党仍然强烈专注于倡导南非境内阿非利卡人的权利和利益，其大部分基础支持来自[277.GetName]。"
 SAF.Nat_Populism_VFP: "£SAF_right_wing_populism (VF+) - 自由阵线加"
 SAF.Nat_Populism_VFP_icon: "£SAF_right_wing_populism"
 SAF.Nat_Populism_VFP_desc: "(阿非利卡民族主义)\n自由阵线加\n\n作为自由阵线的延续，VF+是由自由阵线、阿非利卡人统一运动和保守党合并而成。VF+不再公开寻求建立“民族国家”，而是广泛倡导阿非利卡人的利益，但党内许多人仍坚持阿非利卡民族主义目标。"
 SIA.conservatism_1: "£generic_conservatism_small (PMT) 中立民主党"
 SIA.conservatism_1_icon: "£generic_conservatism_small"
 SIA.conservatism_2: "£SIA_western_liberal (BJT) 泰自豪党"
 SIA.conservatism_2_icon: "£SIA_western_liberal"
 SIA.conservatism_desc_1: "(中间派) - 成立于2007年的人民力量党是泰爱泰党的继承者，声称要继续其民粹主义纲领 - 尽管其自身政策更为温和，且在选举中取得的成功远不如前。"
 SIA.conservatism_desc_2: "（国家保守主义）- 泰自豪党成立于2008年，作为中立民主党的非官方延续而运作。该党强烈支持君主制，并维持着大体上保守的议程，党内派系则采取更为民粹主义和以福利为导向的立场。"
 SOV.liberalism_yash: "£SOV_yashin (FN) 自由北方"
 SOV.liberalism_yash_icon: "£SOV_yashin"
 SOV.Conservative_dum: "£SOV_volodin (EDRF) 俄罗斯联邦紧急杜马"
 SOV.Conservative_dum_icon: "£SOV_volodin"
 SOV.Nat_Autocracy_zol: "£SOV_zolotov 国家近卫军"
 SOV.Nat_Autocracy_zol_icon: "£SOV_zolotov"
 SWA.Western_Autocracy: "£generic_Western_Autocracy_small 德拉米尼家族（立宪）"
 SWA.Western_Autocracy_desc: "(君主立宪主义)\n德拉米尼家族(立宪)\n\n$SWA.Monarchist_shared_desc$\n\n§2如果该党上台，§!§Y[SWA.GetNameWithFlag]§!§2应被视为君主立宪制国家！§!"
 SWA.liberalism: "£generic_liberalism_small (SPP) - 斯威士兰进步党"
 SWA.liberalism_desc: "（公民民族主义）\n斯威士兰进步党\n\n斯威士兰进步党最初成立于1959年，对[SWA.GetAdjective]争取独立起到了至关重要的作用。然而，由于独立后建立的政治结构，该党在索布扎二世的皇家委员会干预后于1973年被取缔。\n\n尽管主要创始人已相继离世，但该党的核心理念得以延续。独立后，斯威士兰进步党秉持四项主要原则：维护自身独立，即便面对南非亦然；采纳《联合国人权宣言》；实现[SWA.GetName]境内所有种族的融合；以及终结种族歧视。"
 SWA.socialism: "£generic_socialism_small (PUDEMO) - 人民联合民主运动"
 SWA.socialism_desc: "（民主社会主义者）\n人民联合民主运动\n\n人民联合民主运动成立于1983年，即索布扎二世逝世后不久，迄今为止一直试图改变[SWA.GetName]的政治体制，但收效甚微。\n\n该党自诩秉持民主社会主义意识形态，同时与欧洲及世界许多主要进步团体保持联系。\n\n自姆斯瓦蒂三世加冕以来，人民联合民主运动便不断遭到安全部队的针对，甚至被以“恐怖组织”之名取缔。该党是国内组织罢工与抗议的主要机构之一。"
 SWA.anarchist_communism: "£generic_anarchist_communism_small (NNLC) - 恩格瓦尼民族解放大会"
 SWA.anarchist_communism_desc: "（泛非社会主义者）\n恩格瓦尼民族解放大会\n\n恩格瓦尼民族解放大会成立于1963年，在[SWA.GetAdjective]独立后作为一个政党显得颇为独特 - 因为它的创建者之一，是王室成员杜米萨王子。\n\n恩格瓦尼民族解放大会与安布罗斯·兹瓦内博士一道，将自身确立为一个泛非政党，遵循加纳首任总统克瓦米·恩克鲁玛的诸多教诲。该党在1960年代后期取得了重大进展，却触犯了1973年的皇家委员会 - 该委员会取缔了[SWA.GetName]境内所有政党，迫使该党流亡运作。"
 SWA.Nat_Autocracy: "£generic_Nat_Autocracy_small (UEDF) - 斯威士兰国防军"
 SWA.Nat_Autocracy_desc: "（军政府）\n乌姆布特福·埃斯瓦蒂尼国防军\n\n乌姆布特福·埃斯瓦蒂尼国防军于1979年以其现行形式成立，以取代皇家斯威士兰防卫军 - 后者本身是为接替1968年英国军队撤离后留下的空缺而组建的。该部队是[SWA.GetName]的主要安全力量。\n\n乌姆布特福·埃斯瓦蒂尼国防军几乎仅用于威慑抗议或执行边境巡逻，至今尚未进行过任何有意义的军事部署。[SWA.GetName]的国王既是总司令，也是国防部长。然而，这大多停留在纸面上，因为这些职责在很大程度上被委派给了国防委员会。"
 SWA.Monarchist_shared_desc: "[SWA.GetName]的君主制由该家族的同名先祖 - 德拉米尼一世（又称马塔拉塔拉） - 约于16世纪创立，世代以来一直是该地区酋长政治中的中流砥柱，而德拉米尼也是南非最常见的氏族名称。\n\n[SWA.GetName]的君主制通常由一位国王领导，与世界上几乎所有其他君主制一样。但[SWA.GetAdjective]君主制的独特之处在于，它在技术上是一种共治君主制，由国王与太后共同统治。\n\n与许多其他恩古尼民族一样，斯威士人实行一夫多妻制，而[SWA.GetAdjective]国王通常拥有一个非常庞大的家族。"
 ZIM.Autocracy: "£generic_Autocracy_small (ZNLWVA) - 津巴布韦民族解放战争退伍军人协会"
 ZIM.Autocracy_desc: "（特殊利益集团）\n津巴布韦民族解放战争退伍军人协会\n\n津巴布韦民族解放战争退伍军人协会成立于1989年，并非传统意义上的政党，但被视为津巴布韦境内的一个特殊利益集团。该协会成立的初衷，是为在丛林战争中为黑人民族主义组织作战的退伍军人和游击队员发声，其中包括津巴布韦非洲民族解放军（ZANLA）和津巴布韦人民革命军（ZIPRA）的前成员等。\n\n如今，津巴布韦民族解放战争退伍军人协会依赖津巴布韦非洲民族联盟-爱国阵线（ZANU-PF）的资助与支持，但其最初成立时却遭到了该党的反对。这在很大程度上可归因于土地重新分配方式所引发的紧张关系——土地大多被分配给了少数与ZANU-PF有联系的特定地主。\n\n在1997年陈杰莱·洪兹维出任主席之前，该协会在津巴布韦政治中基本无足轻重。洪兹维以演说家闻名，他将津巴布韦民族解放战争退伍军人协会从相对默默无闻的地位提升为一支全国性力量，并通过施压策略实现了其大部分初始目标。"
 ZIM.Neutral_conservatism: "£generic_Neutral_conservatism_small (FPZ-MM) - 津巴布韦论坛党（马塔贝莱兰-马斯温戈）"
 ZIM.Neutral_conservatism_desc: "（保守主义）\n论坛党（马塔贝莱兰-马斯温戈）\n\n论坛党（马塔贝莱兰-马斯温戈）成立于1993年，大体上是津巴布韦保守联盟的延续——尽管并非直接延续。较大的论坛党于1999年底并入民主变革运动（MDC），以便作为联合反对派参加选举，对抗穆加贝和ZANU-PF。然而，一些地区派系并未加入MDC，论坛党（马塔贝莱兰-马斯温戈）便是其中之一。\n\n该党以马塔贝莱兰和马斯温戈市为基地，在政治上保持保守立场，这使其与更广泛的MDC内的许多人意见相左；同时，其部族归属与马塔贝莱兰的恩德贝莱人一致，而非北部的绍纳人。\n\n论坛党（马塔贝莱兰-马斯温戈）是一个联邦主义政党，寻求赋予津巴布韦各省更多权力，而非让马塔贝莱兰地区完全独立。"
 ZIM.neutral_Social: "£generic_neutral_Social_small (ZANU-N) - 津巴布韦非洲民族联盟-恩东加"
 ZIM.neutral_Social_desc: "（泛非社会主义者）\n津巴布韦非洲民族联盟-恩东加\n\n津巴布韦非洲民族联盟-恩东加与ZANU-PF一同诞生于1975年ZANU的分裂，是站到恩达巴宁吉·西索尔一边的派系。分裂的主要原因在于丛林战争中的战术分歧，但此后不久便演变为部族界线：恩德贝莱人支持恩达巴宁吉·西索尔和ZANU-N，绍纳人则支持穆加贝和ZANU。\n\n西索尔及其非军事化策略，使他得以在当时由首相阿贝尔·穆佐雷瓦领导的津巴布韦-罗得西亚过渡政府中获得一席之地。西索尔也出席了《兰卡斯特宫协议》的签署，该协议确立了废除白人专属统治的框架，实质上终结了丛林战争；正是在此期间，新宪法得以签署生效，津巴布韦首次多种族选举的筹备工作也随之展开。\n\n尽管在这片初生的民主政体中扮演了关键角色，ZANU-N却在1980年选举中未能赢得一个席位——而正是那场选举使ZANU-PF（当时仅称ZANU）上台执政。1992年自我流放归来后，西索尔在随后1995年的选举中，当选为恩德贝莱人据点奇平盖的代表。"
 ZIM.Neutral_Communism: "£generic_Neutral_Communism_small (ZLP) - 津巴布韦工党"
 ZIM.Neutral_Communism_desc: "（劳工运动）\n津巴布韦工党\n\n津巴布韦工党成立于1995年，是一个劳工组织，致力于争取和维护劳工权利。\n\n该党公开宣称自己是马克思主义组织，其既定目标是为工人、农民和穷人的政治和经济利益而奋斗。他们与津巴布韦非洲民族联盟-爱国阵线（ZANU-PF）也存在矛盾，宣称津巴布韦的工人和农民斗争已被该党劫持。津巴布韦工党谴责ZANU-PF不过是民族主义者，抨击该党及其国际支持者是津巴布韦人民的叛徒。"
 ZIM.Monarchist: "£generic_Monarchist_small 大津巴布韦王位宣称者"
 ZIM.Monarchist_desc: "（各类君主与酋长）\n大津巴布韦的觊觎者\n\n尽管大津巴布韦王国在16至17世纪基本遭到废弃，但它的名字被现代津巴布韦所沿用，而津巴布韦鸟则装点着现代津巴布韦的国旗。\n\n然而，关于哪个氏族对“姆安博”这一头衔拥有最合法的主张，并无真正共识；但若政治条件成熟，确有多个氏族会 - 或很可能将 - 加入角逐，以重新夺取这一头衔。"
 ZIM.ZOOPP_member: "\n\n§2该党目前是§!§Y津巴布韦反对党政治组织§!§2联盟的成员，一旦任何成员发挥主导作用，所有其他成员都将加入执政联盟！§!"
 ZIM.united_parties_member: "\n\n§2该党派目前是§!§Y联合政党§!§2联盟的成员，一旦其中任何成员取得主导地位，其他所有成员都将加入执政联盟！§!"
 BAN.socialism: "£generic_socialism_small (JSD) - 孟加拉国民族社会党"
 BAN.socialism_desc: "（民主社会主义） - 孟加拉国民族社会党\n\n孟加拉国民族社会党是一个左翼民族主义政党，已在人民联盟的势力范围内融入民主社会主义。它主张世俗国家、工农权利和解放战争遗产，并首先将自己定义为反对伊斯兰主义政治。\n\n作为人民联盟领导的14党联盟成员，它分享政权而非竞争政权，在其主席哈桑努尔·哈克·伊努的领导下，于2012年至2019年掌管信息部。2016年围绕总书记职务的争端分裂出一个对立派系。其影响力在于其解放战争资历、其学生和劳工阵线，以及其作为联盟左翼的角色。"
 BAN.Kingdom: "£generic_Kingdom_small (HIB) - 孟加拉国伊斯兰保卫者"
 BAN.Kingdom_desc: "（迪欧班德伊斯兰主义） - 孟加拉国伊斯兰捍卫者组织\n\n伊斯兰捍卫者组织并非一个政党，而是一个由迪欧班德派教士与卡乌米宗教学校学生组成的网络，于2010年在吉大港哈塔扎里神学院周围形成。它要求制定亵渎法、终止世俗教育改革、限制女性的公共角色，并给予卡乌米教育体系国家承认。它将自身定位为信仰的守护者，而非职位的竞争者。\n\n它通过大规模集会以及对执政党施加压力来运作，时而与国家对抗 - 如2013年在沙普拉广场，以及2021年抗议印度总理访问期间 - 时而又从国家那里争取让步，例如2017年其最高学位获得承认。其影响力植根于宗教学校网络，以及它有能力让数万人走上达卡街头。"
 BAN.Neutral_Muslim_Brotherhood: "£muslim_brotherhood_small (BJI) - 孟加拉国伊斯兰大会党"
 BAN.Neutral_Muslim_Brotherhood_desc: "（伊斯兰主义） - 孟加拉国伊斯兰大会党\n\n孟加拉国伊斯兰大会党是该国最大的伊斯兰主义政党，是一个遵循毛杜迪传统、纪律严明的干部组织，谋求通过选举、福利工作以及学校、银行和医院网络建立伊斯兰国家。它主张以沙里亚法为基础的法律、国家的穆斯林身份认同，以及与印度保持距离，并且最常作为孟加拉国民族主义党的次要伙伴开展活动。\n\n它曾于2001年至2006年参与四党联盟政府，此后则面临2013年注册被取消、战争罪法庭处决其高级领导人，以及2024年短暂被禁，直至2025年最高法院恢复其注册。其影响力植根于其学生翼、有组织的选票，以及在压力下维持自身存续的能力。"
 BAN.Neutral_conservatism: "£generic_Neutral_conservatism_small (LDP) - 自由民主党"
 BAN.Neutral_conservatism_desc: "（自由保守主义） - 自由民主党\n\n自由民主党是一个小型中右翼政党，由孟加拉国民族主义党的脱党者于2006年创立，其中包括前总统A.Q.M.巴德鲁多扎·乔杜里，以及自2007年巴德鲁多扎离开后一直领导该党的奥利·艾哈迈德上校。它主张市场经济、宪政政府，以及终结政治中的王朝控制，承诺比其脱离的政党更为清廉的保守主义。\n\n它作为联盟伙伴而非竞争者运作，2008年起加入人民联盟的大联盟，后于2012年回归由孟加拉国民族主义党领导的联盟。其影响力植根于奥利·艾哈迈德的吉大港基地、他作为解放战争老兵的地位，以及它对任何需要自由保守派门面的阵营的用处。"
 BAN.oligarchism: "£generic_oligarchism_small (FBCCI) - 孟加拉国工商联合会"
 BAN.oligarchism_desc: "(法团主义) - 孟加拉国工商联合会\n\n孟加拉国工商联合会是私营部门的最高机构，联合了约八十个商会和三百多个行业协会，涵盖从服装纺织到银行航运的各行各业。它游说争取降低关税和公司税、更便宜的信贷、可靠的工业能源以及对雇主有利的劳动法，并捍卫出口经济进入西方和亚洲市场的渠道。\n\n它作为政府在预算和贸易政策方面的咨询伙伴运作，其主席惯于与执政党保持一致。它的筹码在于服装行业带来的出口收入；它对国家的依赖在2024年显露无遗，当时商务部解散了其董事会并任命了一名管理人。"
 BAN.neutral_Social: "£generic_neutral_Social_small (NCP) - 全国公民党"
 BAN.neutral_Social_desc: "（公民民粹主义） - 国家公民党\n\n国家公民党是推翻人民联盟政府的学生运动的政治继承者，由“反歧视学生运动”领导人于2025年创立，纳希德·伊斯兰担任召集人。该党主张建立第二共和国：制定新宪法、终结王朝政治与腐败，并推行既不亲印度也不亲巴基斯坦的外交政策。\n\n该党自定位为中间派和多元主义，既拒绝强硬世俗主义，也拒绝宗教极端主义，并通过2024年起义的网络和象征进行竞选。该党于2025年以睡莲符号在选举委员会注册，其影响力在于过去起义的道德资本，以及既有政党无法掌控的青年基础。"
 BAN.Neutral_Communism: "£generic_Neutral_Communism_small (CPB) - 孟加拉国共产党"
 BAN.Neutral_Communism_desc: "（马克思列宁主义） - 孟加拉国共产党\n\n孟加拉国共产党是该国历史最悠久的共产主义组织，是一个马克思列宁主义政党。它置身于两大王朝阵营之外，通过工会、农民阵线和街头动员，为一个世俗的社会主义共和国而奋斗。它拒绝人民联盟的联盟政治，将人民联盟与孟加拉国民族主义党一视同仁，皆视为资本家的政党。\n\n它领导着2018年与孟加拉国社会党共同组建的左翼民主联盟，抵制它认为受操控的选举，并参加了2024年的起义。2001年，其在达卡帕尔坦广场的集会遭到炸弹袭击，这使它成为伊斯兰主义武装分子的目标。其影响力植根于其有组织的劳工基础以及清廉的声誉，而非议会席位。"
 BAN.Nat_Autocracy: "£generic_Nat_Autocracy_small (BAF) - 孟加拉国武装部队"
 BAN.Nat_Autocracy_desc: "（军政府） - 孟加拉国武装部队\n\n孟加拉国武装部队是一支约有二十万人员的职业化军队，有着干预政治的历史，且在文官统治恢复后，通过军事情报总局在幕后塑造政治。其机构利益在于“2030年部队目标”现代化计划、使该国成为最大部队派遣国之一的联合国维和部署，以及军方信托基金旗下的商业资产。\n\n军方曾支持2007年至2008年在紧急状态下执政的看守政府，并通过拒绝向抗议者开火决定了2024年起义的结局。其影响力植根于它作为两大王朝政党都必须迁就的唯一机构这一地位。"
 BAR.conservatism: "£generic_conservatism_small (CBLP) - 保守巴巴多斯领导党"
 BAR.conservatism_desc: "(保守主义) - 保守巴巴多斯领导党\n\n保守巴巴多斯领导党是巴巴多斯第一个自称保守主义的政党，由律师科里·贝克尔于2025年在圣迈克尔创立。该党主张个人责任、家庭与创业精神，并将青年赋权作为其标志性事业，自诩为年轻专业人士的中右翼家园，这些年轻人认为自独立以来轮流执政的两个工党毫无区别。\n\n该党在议会中没有任何席位，并与其他第三党派联合竞选。其影响力在于工党机器视为理所当然的教会选民和商业选民。"
 BAR.anarchist_communism: "£generic_anarchist_communism_small (PEP) - 人民赋权党"
 BAR.anarchist_communism_desc: "（民主社会主义）- 人民赋权党\n\n人民赋权党是克莱门特·佩恩运动的选举翼，该运动是由律师大卫·科米西翁领导的泛非主义社会主义团体，其立场远在两个工党之左。该党致力于二十一世纪社会主义、奴隶制赔偿和共和制，并与拉丁美洲左翼一同参加圣保罗论坛。\n\n其外交姿态是反帝国主义的，与古巴和委内瑞拉关系密切，敌视美国霸权和自由贸易协定。自科米西翁于2018年成为加勒比共同体大使以来，该党一直处于休眠状态。其影响力在于赔偿运动的道德权威，而非选票。"
 BAR.oligarchism: "£generic_oligarchism_small (BPSA) - 巴巴多斯私营部门协会"
 BAR.oligarchism_desc: "(法团主义) - 巴巴多斯私营部门协会\n\n巴巴多斯私营部门协会是该岛商业机构的伞式组织，成员涵盖工商会、雇主联合会，以及制造商、酒店业者、银行家和国际商业公司。它是与政府和工会组成的三方社会伙伴关系中的雇主支柱，通过这一机制谈判工资、价格以及应对每一次财政危机，并游说争取便利经商环境、税收竞争力，以及保护离岸部门免受欧洲和OECD黑名单的冲击。\n\n作为一个统治集团，它将主张由布里奇敦的董事会阶层执政，政策由旅游业、银行业和贸易商行制定。"
 BAR.Neutral_Libertarian: "£generic_Neutral_Libertarian_small (SB) - 巴巴多斯解决方案"
 BAR.Neutral_Libertarian_desc: "(中间派技术官僚) - 巴巴多斯解决方案\n\n巴巴多斯解决方案是由结构工程师格伦维尔·菲利普斯二世于2015年创立的技术官僚第三方，旨在以管理能力取代部落政治。它提议对个人和企业收入征收10%的统一税率，废除增值税，将每一项政府服务管理至国际质量标准，并实施严格的反腐败规则，同时承诺不让任何公共部门工作人员失业或减薪。\n\n它推出完整候选人名单，并与其他第三方达成协议，以避免抗议选票被分散。其影响力在于那些对两个工党都不耐烦的专业阶层，以及为大型政党必须回应的有成本核算的政策设定基准。"
 BAR.neutral_Social: "£generic_neutral_Social_small (PdP) - 民主与发展人民党"
 BAR.neutral_Social_desc: "（基督教左翼） - 民主与发展人民党\n\n民主与发展人民党是主教约瑟夫·阿瑟利（Joseph Atherley）的政治工具。这位巴巴多斯工党成员在2018年该党以压倒性优势获胜后数日内便脱离政府，成为反对党领袖，也是众议院中唯一的反对派声音。该党主张基督教左翼的社会民主主义，倡导问责政府、社会保护与道德领导，并利用其反对党地位提名参议员，对在议会中不受任何其他制衡的政府提出质询。\n\n其影响力完全来自反对党的宪法角色以及阿瑟利作为神职人员的声望，而非来自群众组织。"
 BAR.neutral_Social_app: "£generic_neutral_Social_small (APP) - 进步联盟党"
 BAR.neutral_Social_app_desc: "(基督教左翼) - 进步联盟党\n\n进步联盟党是2021年底由约瑟夫·阿瑟利主教的人民民主与发展党和莱内特·伊斯特蒙德的联合进步党结成的联盟，阿瑟利任领袖，伊斯特蒙德任副手。它主张善治、社会保护与基督教道德领导的中左翼政治，并将自己标榜为分裂该岛的两大工党之外的最大力量。\n\n它与“巴巴多斯解决方案”及较小的第三党结盟参加选举。其影响力在于两个工党阵营中那些幻想破灭、希望议会能受到制衡的选民。"
 BAR.Monarchist: "£generic_Monarchist_small (HOW) - 温莎王室"
 BAR.Monarchist_desc: "（立宪君主主义） - 温莎王室\n\n温莎王朝统治着巴巴多斯，巴巴多斯是英联邦成员国。君主由巴巴多斯总督代表，总督负责批准法律、召集和解散议会，并任命参议员和法官。在自由民族运动党和进步自由党的竞争中，王室凌驾于宪法延续性之上，其地位由既得利益集团的共识所维系，而共和制问题则留待日后讨论。\n\n作为执政派别，它将拥护王室作为国家统一的基石，权力源自总督办公室而非各党派，并坚定地遵循英联邦和英国的法律传统。支持者称之为稳定；反对者则称其为殖民时代的遗物。"
 BEL.conservatism_icon: "£BEL_western_conservative"
 BEL.conservatism_cdv: "£BEL_western_conservative (CD&V) - 基督教民主与弗拉芒"
 BEL.conservatism_cdv_icon: "£BEL_western_conservative"
 BEL.conservatism_cdv_desc: "（基督教民主） - 基督教民主与弗拉芒\n\n基督教民主与弗拉芒是基督教人民党于2001年采用的名称，旨在摆脱其教派形象并突出其弗拉芒身份。它仍然是基督教支柱的政党，与基督教工会、农民联盟和小企业联合会保持联系，主张社会市场经济、家庭、辅助性原则以及通过协商而非对抗进行国家改革。\n\n它亲欧洲且亲大西洋主义，在各级通过联盟妥协执政。其影响力在于其社会组织、在弗拉芒各地的市政根基，以及其在联邦和弗拉芒内阁中作为不可或缺合作伙伴的习惯。"
 BEL.liberalism_openvld: "£BEL_western_liberal (Open Vld) - 开放弗拉芒自由民主党"
 BEL.liberalism_openvld_icon: "£BEL_western_liberal"
 BEL.liberalism_openvld_desc: "(自由主义) - 开放弗拉芒自由民主党\n\n开放弗拉芒自由民主党是弗拉芒自由派在2007年采用的名称，当时他们将卡特尔伙伴吸收进一个单一的开放名单。该党主张自由企业、降低税收、预算纪律和养老金改革，同时在个人自由方面采取社会进步的路线，并坚定致力于法治。\n\n它是该国最亲欧洲和大西洋主义的政党之一，也是各色政府可靠的联盟伙伴。其影响力在于弗拉芒商界、跨语言边界的自由派伙伴以及其在联邦行政部门的长期任职。"
 BEL.anarchist_communism: "£generic_anarchist_communism_small (LSP-PSL) - 左翼社会党"
 BEL.anarchist_communism_desc: "(托洛茨基主义) - 左翼社会党\n\n左翼社会党是托洛茨基主义国际的比利时支部，诞生于一个脱离社会党公开组织起来的马克思主义派别。它主张在工人控制下将关键部门国有化，缩短每周工作时间而不减薪，并采取大规模行动反对紧缩政策，它将选举视为平台而非通往执政的道路。\n\n它秉持国际主义并反对北约，反对欧盟作为资本的工具。其影响力在于学生运动、罢工委员会和左翼联合名单，而非选票，它致力于将更广泛的左翼拉向革命立场。"
 BEL.Caliphate: "£generic_Caliphate_small (S4B) - 比利时沙里亚"
 BEL.Caliphate_desc: "（萨拉菲圣战主义） - 比利时沙里亚\n\n比利时沙里亚是一个萨拉菲圣战主义组织，由福阿德·贝尔卡塞姆于2010年在安特卫普创立，要求在比利时建立以沙里亚法统治的伊斯兰国家。它拒绝民主与融合，扰乱公开讲座，威胁政客，并鼓吹通过人口结构变化和圣战来接管国家。\n\n它作为招募网络而非政党运作，将来自安特卫普和布鲁塞尔的年轻人输送至黎凡特战场，并将比利时法院视为敌对机构。其影响力植根于一小批激进化的追随者、它所制造的恐惧，以及它与更广泛的圣战运动的联系。"
 BEL.Neutral_Muslim_Brotherhood: "£muslim_brotherhood_small (ISLAM) - ISLAM党"
 BEL.Neutral_Muslim_Brotherhood_desc: "（伊斯兰主义） - 诚信、团结、自由、本真、道德\n\n伊斯兰党是布鲁塞尔的一个伊斯兰主义政党，由雷杜安·阿赫鲁什于2012年创立，旨在为首都的穆斯林选民提供一个属于他们自己的宗教代言声音。它主张建立以沙里亚法为基础的伊斯兰国家，要求在公共机构提供清真餐食和宗教节日，主张公共交通上的性别隔离，并推行源自宗教法的道德秩序。\n\n它敌视世俗主义，也敌视那些迎合穆斯林选票却不认同其目标的主流政党。其影响力植根于布鲁塞尔穆斯林聚居的市镇 - 在那里，几千张选票便能赢得议会席位 - 以及它在比利时整个政治光谱中引发的警觉。"
 BEL.Neutral_conservatism: "£generic_Neutral_conservatism_small (VU) - 人民联盟"
 BEL.Neutral_conservatism_desc: "（弗拉芒民族主义） - 人民联盟\n\n人民联盟是民主的弗拉芒民族主义政党，是弗拉芒自治运动的政治家园。它主张将权力从比利时国家转移至各大区和语区，保护布鲁塞尔及其周边地区的荷兰语，并建立一个终结法语主导地位的联邦体制。其纲领横跨进步翼与保守翼，两者将它拉向不同的方向。\n\n它传统上亲欧洲且和平主义，将欧盟视为弗拉芒民族得以独立立足的框架。其影响力植根于弗拉芒运动、其文化协会，以及它作为联盟伙伴推动国家改革的记录。"
 BEL.Neutral_conservatism_nva: "£generic_Neutral_conservatism_small (N-VA) - 新弗拉芒联盟"
 BEL.Neutral_conservatism_nva_desc: "（弗拉芒民族主义） - 新弗拉芒联盟\n\n新弗拉芒联盟是保守的弗拉芒民族主义政党，由人民联盟的右翼在该党解散后于2001年创立。它主张以邦联制作为通往独立弗拉芒的道路，主张财政纪律与降低劳动力成本，主张严格的移民与融合政策，并主张一种与法语区南部相对的弗拉芒文化身份。\n\n它亲大西洋主义且持欧洲现实主义立场，支持北约，同时抵制向布鲁塞尔进一步转移权力。其影响力植根于其作为弗拉芒最大政党的地位、它对弗拉芒政府的掌控，以及它组建或瓦解每一届联邦联盟的能力。"
 BEL.oligarchism: "£generic_oligarchism_small (VBO-FEB) - 比利时企业联合会"
 BEL.oligarchism_desc: "(法团主义) - 比利时企业联合会\n\n比利时企业联合会是唯一活跃于全部三个地区的雇主联合会，统一了工业、银行和服务业的行业联合会。它在与工会谈判工资、指数化及工作条件的“十人集团”中拥有两个席位，并游说推动工资节制、降低劳动力成本以及具有竞争力的税收制度。\n\n作为一个统治集团，它将代表布鲁塞尔和安特卫普的董事会阶层执政，政策通过社会协商而非议会制定。其影响力在于工资标准与港口经济。"
 BEL.Neutral_Libertarian_ldd: "£BEL_non_aligned_libertarian (LDD) - 自由意志、直接、民主"
 BEL.Neutral_Libertarian_ldd_icon: "£BEL_non_aligned_libertarian"
 BEL.Neutral_Libertarian_ldd_desc: "（自由意志保守主义） - 自由意志、直接、民主\n\n“自由意志、直接、民主”是“德德克尔名单”于2011年采用的名称，旨在将其作为一套纲领而非个人政治工具来呈现。它主张单一税、精简国家、具有约束力的公投、严格的移民管控以及弗拉芒自治，并反对补贴、工会权力以及整个政治阶层。\n\n它疑欧且亲大西洋主义，敌视进一步的欧洲一体化。其影响力植根于让-马里·德德克尔在沿海地区的据点、一个小型的自由意志主义活动分子基础，以及它作为右翼自由派选民抗议选项的角色 - 这些选民认为主流政党过于软弱。"
 BEL.neutral_Social: "£generic_neutral_Social_small (SP) - 社会党"
 BEL.neutral_Social_desc: "（社会民主主义） - 社会党\n\n社会党是弗拉芒的社会民主党，是旧有统一社会主义运动的荷兰语部分，也是弗拉芒社会主义工会与互助医疗基金的政治臂膀。它主张福利国家、公共服务和工资指数化，并与基督教民主党人或自由党人联合执政。\n\n它亲欧洲且支持北约，同时推动为一体化附加社会条件。其影响力植根于根特与安特卫普的工业城市、工会与医疗基金网络，以及它作为弗拉芒和联邦内阁中不可或缺的左翼伙伴这一角色。"
 BEL.neutral_Social_spa: "£generic_neutral_Social_small (SPA) - 不同社会党"
 BEL.neutral_Social_spa_desc: "（社会民主主义） - 不同社会党\n\n“不同社会党”是弗拉芒社会主义者于2001年采用的名称，以标志与过去的丑闻和柱化政治决裂，并超越工会基础。它主张现代福利国家、积极的劳动力市场政策、对教育与照护的公共投资，以及一个开放、进步的社会，并尝试与较小的进步政党组成卡特尔和联合名单。\n\n它亲欧洲且亲大西洋主义，并带有社会议程。其影响力植根于弗拉芒各城市、社会主义工会与医疗基金，以及它作为联邦联盟左翼锚点的地位。"
 BEL.neutral_Social_vooruit: "£generic_neutral_Social_small (Vooruit) - 前进"
 BEL.neutral_Social_vooruit_desc: "（社会民主主义） - 前进\n\n“前进”是弗拉芒社会主义者于2021年采用的名称，借自历史悠久的根特合作社，旨在重建为一个广泛的民众运动，而非一个柱化政党。它围绕购买力、可负担住房、稳定就业，以及在法律、秩序和融合问题上的强硬路线开展竞选，试图争取那些已流向民族主义右翼的工人阶级选民。\n\n它亲欧洲且亲大西洋主义，并愿意与各光谱的政党联合执政。其影响力植根于根特与安特卫普等城市、社会主义工会与医疗基金，以及它乐于成为右倾联盟中唯一左翼政党的意愿。"
 BEL.Neutral_Communism: "£generic_Neutral_Communism_small (PC) - 瓦隆-布鲁塞尔共产党"
 BEL.Neutral_Communism_desc: "（马克思列宁主义） - 瓦隆-布鲁塞尔共产党\n\n瓦隆-布鲁塞尔共产党是历史上比利时共产党的法语继承者，是一个在埃诺和列日的矿业与钢铁城镇中存续的马克思列宁主义组织。它主张能源与工业的公有制、捍卫养老金和社会保障，并声援各社会主义国家，以自身名单或与更广泛的激进左翼联盟推出候选人。\n\n它反北约，并敌视各项欧洲条约。其影响力植根于少数几位市议员、劳工运动的老兵，以及对瓦隆工业历史的记忆，而非任何全国性的选票。"
 BEL.Nat_Populism_belang: "£BEL_nationalist_right_wing_populist (VB) - 弗拉芒利益党"
 BEL.Nat_Populism_belang_icon: "£BEL_nationalist_right_wing_populist"
 BEL.Nat_Populism_belang_desc: "（弗拉芒民族主义） - 弗拉芒利益党\n\n弗拉芒利益党是弗拉芒集团在2004年法院判定其附属组织犯有煽动歧视罪后采用的名称，保留了原有纲领和缩写，但缓和了措辞。它主张弗拉芒独立、停止移民与移民回流、禁止政治伊斯兰、维护弗拉芒家庭的购买力，以及对犯罪采取强硬路线，但它至今仍面临着一道将其排除在所有行政机构之外的“防疫线”。\n\n它疑欧，并与欧洲民粹右翼结盟。其影响力植根于它在弗拉芒最大政党之列的地位、社交媒体的覆盖面，以及它对民族主义主流施加的压力。"
 BEL.Monarchist_bub: "£generic_Monarchist_small (B.U.B.) - 比利时联盟"
 BEL.Monarchist_bub_desc: "（比利时统一主义） - 比利时联盟\n\n比利时联盟是一个统一主义与君主主义政党，由律师汉斯·范德考特于2002年创立，旨在逆转联邦化并恢复统一的比利时国家。它主张废除大区和语区，代之以分权的省份；在全国推行双语教育；强化君主制作为国家统一的象征；并终结它归咎于传统政党的语言争端。\n\n按照比利时的传统，它亲欧洲且亲大西洋主义。其影响力植根于布鲁塞尔和语言边界地区的亲比利时情感，以及它是唯一一个彻底拒绝联邦制安排的政党，而非任何议会席位。"
 BEN.Western_Autocracy: "£generic_Western_Autocracy_small (UP) - 进步联盟"
 BEN.Western_Autocracy_desc: "（社会民主主义） - 进步联盟\n\n进步联盟是2018年政党宪章迫使贝宁碎片化的政党整合后，为推行帕特里斯·塔隆总统纲领而组建的两个集团中较大的一个。它吸收了社会民主党、贝宁重生党的一翼以及太阳联盟，自称为社会民主主义政党，却以围绕总统职位的纪律严明的多数机器进行治理。\n\n在执政期间，它支持塔隆的改革议程：基础设施与港口主导的增长、财政纪律、与法国及西非金融机构的紧密关系，以及对反对派和新闻界的严密管控。其影响力植根于对国民议会的控制，以及主导全国选举准入的赞助规则。"
 BEN.Western_Autocracy_2022: "£generic_Western_Autocracy_small (UPR) - 进步联盟革新"
 BEN.Western_Autocracy_2022_desc: "（社会民主主义） - 进步联盟革新党\n\n进步联盟革新党是进步联盟在2022年吸收民主复兴党、将总统多数派与阿德里安·洪贝吉的波多诺伏基地联合后所采用的名称。该党由约瑟夫·乔格贝努领导，是塔隆时代的主导政党，也是国民议会中最大的党团。\n\n它将社会民主主义的标签与亲市场、面向投资者的治理相结合：公共工程、港口与棉花改革、财政纪律，以及与法国、欧盟和区域金融机构的合作。其影响力植根于其议会多数、对全国选举候选人赞助的控制，以及对全国地方政府的掌控。"
 BEN.conservatism: "£generic_conservatism_small (BR) - 共和集团"
 BEN.conservatism_desc: "（社会自由主义） - 共和集团\n\n共和集团是帕特里斯·塔隆总统多数派的第二大支柱，于2018年在新政党宪章推动较小组织合并为单一集团时，在帕拉库成立。该党由前国际货币基金组织官员阿卜杜拉耶·比奥·查内担任主席，大量依托北部和商业网络，并以“自由、工作与繁荣”为座右铭开展竞选。\n\n它与进步联盟联合执政，而非与之对抗，支持相同的总统候选人，同时争夺部委、席位和地方议会。其纲领强调私人投资、农业现代化和行政改革。其影响力植根于其北部基地、技术官僚干部队伍，以及它使多数派成为一个联盟而非单一政党的能力。"
 BEN.Neutral_Autocracy: "£generic_Neutral_Autocracy_small (FCBE) - 新兴贝宁贝壳力量"
 BEN.Neutral_Autocracy_desc: "（古典自由主义） - 新兴贝宁贝壳力量\n\n贝壳力量是托马斯·博尼·亚伊的总统运动。这位前区域开发银行家以局外人身份开展竞选，对抗旧政党巨头，并以个人主义改革者的姿态执政。FCBE承诺通过小额信贷、基础设施和反腐败运动，打造一个新兴的贝宁，同时将权力集中于总统职位，并试探宪法的极限。\n\n其外交姿态务实且不结盟，同时向北京、海湾国家和西方捐助者示好。在亚伊卸任并后来与该党决裂后，该党萎缩为一个较小的反对派组织。其影响力植根于北部和中部地区的恩庇网络以及亚伊的名号。"
 BEN.oligarchism: "£generic_oligarchism_small (CNP-Bénin) - 贝宁全国雇主委员会"
 BEN.oligarchism_desc: "(法团主义) - 贝宁全国雇主委员会\n\n全国雇主委员会是贝宁主要的商业联合会，联合了贸易、运输、银行、农工业和科托努港的专业协会。作为一个执政集团，它代表着主导该国与尼日利亚转口经济的商业精英的利益：低税收、宽松监管、私有化和开放贸易体制。\n\n其领导层处于政治核心；前总统塞巴斯蒂安·阿贾冯，这位家禽业巨头曾竞选总统，后来与本身是棉花大亨的塔隆总统闹翻。其影响力在于对该国依赖海关的经济、港口以及国家所依赖的私人资本的控制。"
 BEN.neutral_Social_2019: "£generic_neutral_Social_small (LD) - 民主党"
 BEN.neutral_Social_2019_desc: "（社会民主主义） - 民主党\n\n民主党是由前总统托马斯·博尼·亚伊在与贝壳力量决裂后创立的政党，也是塔隆时代的主要反对派。该党属于中左翼，是进步联盟的参与者，主张恢复多元选举，并释放雷基亚·马杜古等被监禁的反对者。\n\n它围绕社会支出、保护小商贩和农民，以及重新开放政治空间开展竞选。它是唯一一个拥有全国性组织、且其领导人曾担任总统的反对派组织。其影响力植根于亚伊在北部和中部地区的声望，以及它作为一切反塔隆抗议参照点的角色。"
 BHR.Western_Autocracy_desc: "（绝对君主制） - 哈利法家族\n\n哈利法家族以世袭君主制统治巴林，国王任命政府、半数立法机构及高级司法官员，而经选举产生的议院则在王宫设定的界限内运作。国王哈马德与王储萨勒曼·本·哈马德（自2020年起担任首相）代表着该王朝改革派、面向西方的一脉，倾向经济多元化、有管理的对话以及2001年《民族行动宪章》框架。\n\n家族接纳美国第五舰队，将其安全基石锚定于海湾合作委员会和沙特阿拉伯，并于2020年与以色列实现关系正常化。其影响力依托于安全部门、石油与铝业收入，以及它所培植的效忠派逊尼派社团。"
 BHR.conservatism: "£generic_conservatism_small (Mithaq) - 民族行动宪章协会"
 BHR.conservatism_desc: "（自由保守主义） - 民族行动宪章协会\n\n民族行动宪章协会是一个效忠派政治社团，由来自巴林老牌商人家庭的逊尼派和什叶派商界人士于2002年创立。它捍卫2001年《民族行动宪章》作为既定的宪政框架，主张渐进式行政改革而非任何权力从王室转移，并推行亲市场、技术官僚化的议程。\n\n该协会在逊尼派及混合城市选区开展竞选，并加入效忠派选举联盟而非反对派。其影响力较少来自投票箱，而更多来自王室对其成员进入协商会议的任命以及其创始人的商业网络。"
 BHR.Caliphate_icon: "£SAU_salafist_jihadism"
 BHR.oligarchism: "£generic_oligarchism_small (BCCI) - 巴林工商会"
 BHR.oligarchism_desc: "（法团主义） - 巴林工商会\n\n巴林工商会是该国商人与制造商的伞式联合会，也是老牌贸易家族的政治代言人，其中包括卡努、法赫罗、穆阿耶德和纳斯等家族。它就劳工配额、外籍人士费用、税收和国家合同进行游说，并支持向金融、铝业和物流领域多元化发展的举措。\n\n该商会坚定支持君主制和支持海湾一体化，更偏好以技术官僚渠道接触政治，而非开放政治。其影响力植根于它在经济政策机构中的席位、其董事会选举，同时也是商人精英自身的角逐，以及政府对私人资本推动增长的依赖。"
 BHR.Nat_Populism: "£generic_Nat_Populism_small (NUG) - 民族统一集会"
 BHR.Nat_Populism_desc: "（逊尼派保皇派民粹主义） - 民族统一集会\n\n民族统一集会源自2011年起义期间在法提赫清真寺举行的效忠派反集会，由谢赫阿卜杜勒-拉蒂夫·马哈茂德领导。它自称为不再沉默的逊尼派社群代言，要求对什叶派反对派采取强硬路线、停止让步、警惕伊朗影响，同时也就住房、就业和归化问题向政府施压。\n\n该运动于2012年分裂，当时“法提赫觉醒”一翼指责它已被王宫收编。其影响力植根于它有能力让效忠派人群填满街头，以及政府利用它来制衡反对派。"
 BHR.Monarchist_icon: "£BHR_Autocracy_small"
 BLR.Neutral_Communism_just_world: "£BLR_Neutral_Communism (BPL) - 白俄罗斯左翼党“公正世界”"
 BLR.Neutral_Communism_just_world_icon: "£BLR_Neutral_Communism"
 BLR.Neutral_Communism_just_world_desc: "（民主社会主义） - 白俄罗斯左翼党“公正世界”\n\n“公正世界”是白俄罗斯共产党人党于2009年采用的名称，标志着其从马克思列宁主义转向欧洲民主社会主义。在谢尔盖·卡利亚金领导下，该党主张社会正义、工人权利、自由选举和法治，反对总统垂直权力体系，并与民主反对派合作，同时拒绝北约和快速的市场转型。\n\n它是欧洲左翼党的成员。其影响力植根于其地区组织网络，以及那些将其视为诚实左翼的工人和退休人员。2023年，国家将其取缔，它是最后一个被注册的反对党。"
 BOL.conservatism_pdc: "£BOL_Nat_Populism  (PDC) - 基督教民主党"
 BOL.conservatism_pdc_icon: "£BOL_Nat_Populism"
 BOL.conservatism_pdc_desc: "（基督教民主主义） - 基督教民主党\n\n基督教民主党是玻利维亚的基督教人文主义政党，也是美洲基督教民主组织和中间派民主党国际的成员。多年来，它一直是一个注册空壳，将其候选人资格借给外来者 - 从豪尔赫·基罗加到福音派郑治铉，再到“我们相信”联盟 - 直到罗德里戈·帕斯于2025年代表该党赢得总统职位，其承诺是“全民资本主义”。\n\n在执政期间，它削减开支与税收，恢复与美国的大使级关系及缉毒局的回归，重续与以色列的关系，并使玻利维亚疏远古巴、委内瑞拉和尼加拉瓜。其影响力植根于总统职位以及它在周围组建的联盟。"
 BOL.socialism_un: "£BOL_neutral_Social (UN) - 民族统一阵线"
 BOL.socialism_un_icon: "£BOL_neutral_Social"
 BOL.socialism_un_desc: "（社会民主主义） - 民族统一阵线\n\n民族统一阵线是水泥大亨塞缪尔·多里亚·梅迪纳的政党，于2003年从左派革命运动中分裂而成立，是社会党国际的成员。它主张社会市场经济、制度稳定以及中产阶级改良主义，并将自身标榜为介于“争取社会主义运动”与强硬右翼之间的温和第三选项。它通过广泛的联盟开展竞选，2014年领导“民主联盟”，2025年领导“统一联盟”。\n\n它亲西方且对商界友好。其影响力植根于其创始人的财富、其城市专业人士基础，以及它作为反MAS反对派组织者的角色。"
 BOL.Conservative: "£generic_Conservative_small (FSB) - 玻利维亚社会主义长枪党"
 BOL.Conservative_desc: "（长枪党主义） - 玻利维亚社会主义长枪党\n\n玻利维亚社会主义长枪党是天主教、民族主义极右翼的老牌政党，建立于第三条道路、法团主义和激进反共主义之上。它于2003年失去选举登记资格，此后作为一个干部组织存续，为其他候选人背书 - 2002年支持公民团结联盟，2014年支持豪尔赫·基罗加 - 而它的传统则在它创立的“圣克鲁斯青年联盟”中延续。\n\n它敌视“争取社会主义运动”、原住民民族主义以及广义上的左翼，并认同东部低地的西班牙裔与天主教身份。其影响力植根于其圣克鲁斯网络及其青年翼，而非选票。"
 BOL.Vilayat_e_Faqih_desc: "（什叶派伊斯兰主义） - 拉丁美洲真主党\n\n拉丁美洲真主党是一个由资助者、协助者和同情者组成的网络，黎巴嫩什叶派运动正是通过它在三国交界区以及美洲黎巴嫩侨民中运作。它没有针对玻利维亚的政治纲领；它筹集并洗白资金，并为由贝鲁特和德黑兰指挥的行动提供掩护。\n\n玻利维亚在埃沃·莫拉莱斯执政期间于2007年与伊朗建立全面关系，并于2023年与德黑兰签署了一份涵盖边境监控和无人机的防务备忘录，此举遭到阿根廷犹太社区的谴责。其影响力植根于这一结盟关系以及玻利维亚边境管控的薄弱。"
 BOL.Neutral_conservatism_democratas: "£BOL_western_conservative_democratas (MDS) - 社会民主运动"
 BOL.Neutral_conservatism_democratas_icon: "£BOL_western_conservative_democratas"
 BOL.Neutral_conservatism_democratas_desc: "（自由保守主义、地方主义） - 社会民主运动\n\n社会民主运动，又称“民主党人”，是鲁本·科斯塔斯的政党，也是圣克鲁斯自治运动的政治臂膀。它主张省级自治、私营企业以及东部低地的农业出口经济，并通过联盟开展竞选，2014年加入“民主联盟”，2019年加入“玻利维亚说不”，2025年加入豪尔赫·基罗加的“自由”党。\n\n它亲西方，是拉丁美洲政党联盟的成员。其影响力植根于圣克鲁斯省政府、公民委员会以及这个全国最富裕地区的商业协会。"
 BOL.Neutral_Communism: "£generic_Neutral_Communism_small (MIP) - 帕查库蒂原住民运动"
 BOL.Neutral_Communism_desc: "（原住民主义、卡塔里主义） - 帕查库蒂原住民运动\n\n帕查库蒂原住民运动是费利佩·基斯佩 - 即“埃尔·马库” - 的政党。他是农民联合会玻利维亚农村工人联合工会的领袖，也是图帕克·卡塔里游击队的前游击队员。该党成立于2000年，主张艾马拉民族主义、卡塔里斯莫，以及对原住民问题的马克思主义解读，寻求建立一个印第安人的国家，而非在克里奥尔人的国家中占有一席之地，并通过高原上的道路封锁开展运动。2005年，在“争取社会主义运动”吸收了其基础后，该党解散，尽管基斯佩之子桑托斯·基斯佩后来于2021年代表“哈亚利亚”赢得了拉巴斯省省长职位。\n\n该党反帝国主义，且敌视所有传统政党。其影响力植根于高原上的艾马拉社区。"
 BOT.Conservative: "£generic_Conservative_small (BRP) - 博茨瓦纳共和党"
 BOT.Conservative_desc: "（基督教民主主义） - 博茨瓦纳共和党\n\n博茨瓦纳共和党是一个小型基督教保守党，由牧师兼前议员比吉·布塔莱于2023年创立，他此前曾领导博茨瓦纳爱国阵线。该党以捍卫基督教家庭价值观、反对同性恋和堕胎合法化以及对公共生活进行道德革新为竞选纲领，他们认为执政党和主流反对派都已放弃了这一理念。\n\n该党没有议席，依靠教会网络和其创始人的个人影响力。它的优势在于动员那些感觉自己没有被世俗政党代表的社会保守派选民。"
 BOT.oligarchism: "£generic_oligarchism_small (BOCCIM) - 博茨瓦纳工商人力资源联合会"
 BOT.oligarchism_desc: "（社团主义） - 博茨瓦纳工商人力资源联合会\n\n博茨瓦纳工商人力资源联合会是博茨瓦纳最高雇主组织，代表私营部门的集体利益，而非政党。它代表矿业公司、银行、零售商和制造商，并通过由总统主持的高级别协商委员会与政府进行谈判，游说政府放宽监管、加快许可证审批速度、提高劳动力灵活性并促进产业多元化，摆脱对钻石的依赖。\n\n作为执政派别，它将以商业主导的技术官僚体制治理国家，优先考虑投资者信心和财政纪律。其影响力在于国家所需的私人资本，以减少对国家和戴比尔斯的依赖。"
 BOT.oligarchism_2015: "£generic_oligarchism_small (BB) - 博茨瓦纳商业协会"
 BOT.oligarchism_2015_desc: "（社团主义） - 博茨瓦纳商业协会\n\n博茨瓦纳商业协会是博茨瓦纳最高雇主组织，于2015年由博茨瓦纳工商人力资源联合会更名而来，代表私营部门的集体利益，而非政党。该协会代表矿业公司、银行、零售商和制造商，并通过由总统主持的高级别协商委员会与政府进行谈判，游说政府放宽监管、提高劳动力灵活性并实现经济多元化，摆脱对钻石的依赖。\n\n作为执政派别，它将以商业主导的技术官僚体制治理国家，优先考虑投资者信心和财政纪律。其影响力在于国家所需的私人资本，以减少对国家和戴比尔斯的依赖。"
 BRA.conservatism: "£BRA_conservatism (PFL) - 自由阵线党"
 BRA.conservatism_desc: "（自由保​​守主义）- 自由阵线党\n\n自由阵线党是巴西政坛主要的中右翼力量，它将社会保守主义与市场自由主义纲领相结合，主张私有化、财政纪律和开放贸易。该党自诩为任何改革派政府的天然合作伙伴，并与巴西社会民主党共同组成执政联盟。\n\n其影响力主要源于东北部，尤其是巴伊亚州的地区政治机器，以及众多州长、参议员和市长，这使得它对任何国会多数派都不可或缺。在国际上，它与中间派民主国际和国际民主联盟结盟。"
 BRA.conservatism_2022: "£generic_conservatism_small (UNIÃO) - 巴西联盟"
 BRA.conservatism_2022_desc: "（自由保守主义）- 巴西联盟\n\n巴西联盟党是2022年由民主党和社会自由党合并而成的中右翼政党。该党倡导经济自由主义、私有化和削减公共开支，但在安全和社会问题上持保守立场，并标榜自己是不愿被博尔索纳里主义定义的右翼人士的“大帐篷”。\n\n这次合并使其成为国会成立时最大的席位，也是公共政党基金的最大份额之一，该基金将其转变为两个阵营政府的州长、市长和部委。它是国际民主联盟的成员。"
 BRA.Neutral_conservatism_2019: "£generic_Neutral_conservatism_small (PODE) - 我们能"
 BRA.Neutral_conservatism_2019_desc: "（自由保守主义）- 我们能\n\n我们能党是一个中右翼政党，于2019年合并了人文主义团结党，并标榜自身是倡导一种崭新、更清廉政治的载体。其纲领的核心是通过全民公投、罢免投票和民众倡议等方式实现直接民主，坚持毫不妥协的反腐败立场，并奉行以保守社会价值观为支撑的自由主义经济政策。\n\n它争取受“洗车行动”调查动员起来的选民，并招募法官、检察官和政界人士作为候选人。它的影响力在于不断壮大的参议院席位、被其吸收的政党所扩大的党费，以及对那些既不信任工人党也不信任传统中右翼的选民的吸引力。"
 BRA.oligarchism_icon: "£BRA_MDB"
 BRA.oligarchism_2017: "£BRA_MDB (MDB) - 巴西民主运动"
 BRA.oligarchism_2017_desc: "（中间主义）- 巴西民主运动\n\n巴西民主运动于2017年从其名称中去掉“党”字，以重拾其反对派时期的声望，该党是中间派的支柱。它以务实、亲市场的中间派政党形象执政，执政时支持支出上限、劳工改革和私有化，而在野时则以选票换取部长职位和预算修正案。\n\n它的优势在于拥有全国最大的市长和州政府网络，以及能够左右立法日程的参议院席位。无论意识形态如何，对于任何寻求在国会获得多数席位的总统而言，它都是不可或缺的合作伙伴。"
 BRA.oligarchism_pcc: "£generic_oligarchism_small (PCC) - 首都第一司令部"
 BRA.oligarchism_pcc_desc: "（犯罪集团）- 首都第一司令部\n\n首都第一司令部是巴西最大的犯罪组织，诞生于圣保罗监狱系统内，现在控制着大部分监狱、通过桑托斯港的可卡因出口路线以及覆盖巴拉圭、玻利维亚和西非的特许经营网络。它的运作有成文的章程、会员费和纪律严明的领导层，由最高安全级别的小组发布命令。\n\n作为一股政治力量，它通过恐吓和庇护进行统治：收买官员，通过对警察和公共交通的协同攻击瘫痪城市，并在国家遗弃的贫民窟中提供秩序和福利。它的统治是将公共权威瓦解为毒品国家。"
 BRA.Neutral_Libertarian: "£BRA_NOVO (NOVO) - 新党"
 BRA.Neutral_Libertarian_icon: "£BRA_NOVO"
 BRA.Neutral_Libertarian_desc: "（古典自由主义）- 新党\n\n新党是一个古典自由主义政党，由银行家和企业高管创立，他们反对巴西政治中的裙带关系。该党主张精简政府、私有化国有企业、简化税法、废除强制投票和取消公共政党经费（该党长期以来一直拒绝接受公共经费），并通过遴选程序和管理培训来筛选候选人。\n\n其基础是南部和东南部的城市中上阶层，其影响力在于其人数虽少但声音响亮的支持者，以及将米纳斯吉拉斯州打造为财政紧缩的典范。它在外部支持亲市场政府，但不加入其中。"
 BRA.neutral_Social_2019: "£generic_neutral_Social_small (Cidadania) - 公民党"
 BRA.neutral_Social_2019_desc: "（社会自由主义）- 公民党\n\n“公民党”是人民社会党于2019年采用的名称，标志着该党从共产主义起源彻底转型为社会自由主义、亲民主的中间派。该党倡导共和制度、议会制、精简廉洁的政府、环境保护和人人平等，并反对左翼和右翼民粹主义。\n\n其基础是城市中产阶级专业人士，其影响力来自于与较大的中间派政党（尤其是巴西社会民主党）结盟，以跨越选举门槛并促成反民粹主义联盟。该党成员较少，却扮演着自由派中间派和温和左派之间的桥梁角色。"
 BRA.Nat_Populism_2022: "£generic_Nat_Populism_small (PL) - 自由党"
 BRA.Nat_Populism_2022_desc: "（右翼民粹主义）- 自由党\n\n自由党是博索纳罗主义右翼的主要政党，它原是中间派政党，在雅伊尔·博索纳罗于2022年大选前加入后，转变为民族主义运动的中心。该党主张经济自由主义、基督教家庭价值观、拥枪权、农业综合企业以及强硬的打击犯罪立场，并将劳工党和最高法院视为国家的敌人。\n\n它在众议院拥有最大的席位，并建立了一个由众多市长组成的庞大网络，资金来源是该党公共基金的最大份额。它的影响力结合了这一庞大网络以及在福音派教会、安全部队和农村地区的动员基础。"
 BRA.Nat_Fascism: "£BRA_PRONA (PRONA) - 国家秩序重建党"
 BRA.Nat_Fascism_icon: "£BRA_PRONA"
 BRA.Nat_Fascism_desc: "（超民族主义）- 国家秩序重建党\n\n国家秩序重建党是心脏病专家埃内亚斯·卡内罗的个人政治工具。他的广播节目呼吁建立一个强大且技术治理完善的国家，以重建国家工业，捍卫巴西主权免受外国资本和国际贷款机构的侵害，并恢复社会秩序和道德规范。该党反对新自由主义全球化，并承诺建立一个拥有核武器且自给自足的巴西。\n\n除了创始人之外，该组织几乎没有其他组织，但他的电视露面却能将边缘民族主义转化为大规模的抗议投票，尤其是在圣保罗。该组织的影响力在于其个人追随者以及那些因他的支持而当选的议员。"
 BRA.Nat_Fascism_2006: "£generic_Nat_Fascism_small (FIB) - 巴西整合主义阵线"
 BRA.Nat_Fascism_2006_desc: "（整体主义）- 巴西整合主义阵线\n\n巴西整合主义阵线是一个运动，而非注册政党。它复兴了以“上帝、祖国和家庭”为口号的整体主义理论，主张建立一个有机、基督教、社团主义的国家。该运动反对自由民主和马克思主义，反对堕胎、全球化和文化自由主义，并呼吁建立一个强大的国家，通过专业社团而非政党来组织社会。\n\n它拥有数百名活跃成员，以国家核心小组和学习小组的形式组织起来，并将追随者的选票引导给任何它认为最不令人反感的民族主义候选人。它的影响力在于意识形态而非选举：它为更广泛的民族主义右翼提供象征符号和干部。"
 BRA.Monarchist_house: "£BRA_Monarchist (HOB) - 奥尔良-布拉干萨家族"
 BRA.Monarchist_house_desc: "(君主主义) - 奥尔良-布拉干萨家族\n\n奥尔良-布拉干萨家族是巴西的皇室家族，通过瓦索拉斯支系传承自末代皇帝，并作为执政王朝复辟。该家族将王冠呈现为团结、秩序和基督教传统的保障者，超然于国会纷争之上，并通过议会君主制进行统治，其中大臣对立法机构负责，而皇帝掌握中立权。\n\n其统治依赖于传统主义天主教右翼、武装部队和农村地主，并倾向于主权外交政策和谨慎地与西方结盟。其影响力源于复辟合法性以及复辟机构的忠诚。"
 ABK.communist_state: "£generic_Communist_State_small (CPA) - 阿布哈兹共产党"
 ABK.communist_state_desc: "（马克思列宁主义） - 阿布哈兹共产党\n\n阿布哈兹共产党起源于1921年成立的党组织，并于1995年3月4日重新组建为一个独立政党，主张马克思列宁主义、苏维埃爱国主义以及与俄罗斯尽可能紧密的一体化；它隶属于声称继承苏共遗产的共产党联盟，并且不同寻常地公开谴责斯大林的政治遗产。在弗拉季斯拉夫·阿尔津巴领导下，它充当忠诚的反对派，批评政府但不挑战国家，此后一直保持这一角色。自2005年起由列夫·沙姆巴领导十年，它在人民议会中没有席位，但仍是该国少数拥有真正党员的组织化政党之一，并于2016年2月帮助创立了既非政府也非反对派的集团，民族统一委员会。"
 ADY.communist_state: "£SOV_emerging_communism (KPRF) - 俄罗斯联邦共产党"
 ADY.communist_state_icon: ""
 ADY.communist_state_desc: "（马克思列宁主义） - 俄罗斯联邦共产党\n\n俄罗斯联邦共产党是苏联共产党的继承者，也是俄罗斯最大的反对党，主张战略产业公有制、苏维埃爱国主义以及有计划地恢复国家工业基础。其阿迪格共和国委员会依托迈科普的退休人员、农村和苏联时代劳动力，并且在每次按党派名单选举的国务委员会中都是第二大党。\n\n它在2011年赢得54席中的6席，2016年赢得50席中的4席，2021年以17.65%赢得5席，足以维持一个党团，但从未能威胁到统一俄罗斯党。与根纳季·久加诺夫领导下的联邦级政党一样，它是一个体制内反对党：在社会政策上强硬，在外交政策和战争问题上忠诚。"
 AFG.communist_state: "£AFG_communist_state (CMPA) - 阿富汗共产党（毛派）"
 AFG.communist_state_icon: ""
 AFG.communist_state_desc: "（马克思列宁主义-毛主义） - 阿富汗共产党（毛派）\n\n阿富汗共产党（毛派）成立于2004年，当时五个源自进步青年组织和1960年代“永恒火焰”运动的毛主义团体联合起来，组建了一个统一的先锋党。它斥责苏联支持的阿富汗人民民主党为修正主义，斥责圣战者为反动派，呼吁对一切外国占领和喀布尔政府发动人民战争，并曾隶属于革命国际主义运动。\n\n它作为一个秘密组织运作，在激进学生和老毛派左翼中拥有追随者，其影响力源于意识形态而非选举。自2021年塔利班卷土重来以来，它已将推翻酋长国列为首要任务。"
 AGL.communist_state: "£AGL_emerging_left_wing_radical (MPLA-PT) - 安人运-劳动党"
 AGL.communist_state_icon: ""
 AGL.communist_state_desc: "（马克思列宁主义）- 安哥拉人民解放运动-劳动党\n\n安人运-劳动党是执政运动在1977年12月第一次代表大会上采用的名称，此前数月，它粉碎了尼托·阿尔维斯派系的政变企图，宣布自己为工农马克思列宁主义先锋党，并按照苏联和古巴模式建立了一党制国家。它主张中央计划、石油和钻石财富的国家所有制、与社会主义阵营的联盟以及党对政治生活的垄断。\n\n其实力在于军队、安全机关以及古巴远征军，后者支撑国家对抗安盟和南非，而它在安人运内部的影响力仍存于从未接受转向市场经济的保守派之中。该党在1990年12月第三次代表大会上放弃了马克思列宁主义称号，但先锋国家的习惯比理论更长久。"
 ALB.communist_state: "£ALB_emerging_communism (PKSh) - 阿尔巴尼亚共产党"
 ALB.communist_state_icon: ""
 ALB.communist_state_desc: "（霍查主义） - 阿尔巴尼亚共产党\n\n阿尔巴尼亚共产党是拒绝社会党转向社会民主主义的反修正主义残余，由希斯尼·米洛希于1991年12月14日创立，以延续马克思列宁主义和霍查主义路线。它认为1991年的转型是一场反革命，捍卫劳动党的历史，并呼吁恢复国家所有制、计划生产，以及对北约和欧盟的敌视。\n\n实际上，该党从一开始便处于边缘地位。议会于1992年7月16日将其取缔，它一直在地下运作，直到1998年4月禁令解除；此后，它在每一次选举中的得票率都远低于百分之一。2012年米洛希去世后，该党由切马尔·齐措拉里接手。其影响力仅限于怀旧圈子及《真理之声报》，但它仍是霍查主义遗产唯一有组织的继承者。"
 ALG.communist_state: "£generic_Communist_State_small (PADS) - 阿尔及利亚民主与社会主义党"
 ALG.communist_state_desc: "（马克思列宁主义） - 阿尔及利亚民主与社会主义党\n\n阿尔及利亚民主与社会主义党是旧社会主义先锋党的正统共产主义残余，成立于1993年，当时阿卜杜勒哈米德·本齐纳领导的马克思列宁主义派别拒绝让团结党转向广泛的世俗阵线。该党主张国家的石油租金属于工人和农民，1990年代的私有化和国际货币基金组织计划是对独立的背叛，伊斯兰主义叛乱和军事政权是同一反动的两面。\n\n实际上，该党没有议会席位，通过其报纸、工会联系和共产党国际会议开展活动。其实力在于与可追溯至1930年代的阿尔及利亚共产主义传统的联系，而其影响力在小型激进左翼之外微不足道。"
 ALT.communist_state: "£SOV_emerging_communism (KPRF) - 俄罗斯联邦共产党"
 ALT.communist_state_icon: ""
 ALT.communist_state_desc: "（马克思列宁主义） - 俄罗斯联邦共产党\n\n俄罗斯联邦共产党是苏联共产党的继承者，也是俄罗斯最大的反对党，主张战略性产业的公有制、苏联爱国主义，以及在自1993年起担任主席的根纳季·久加诺夫领导下有计划地恢复国家的工业基础。它将马克思列宁主义学说与俄罗斯民族主义和东正教保守主义相结合，自2003年以来一直是每一届杜马中的第二大党。\n\n在阿尔泰共和国，它是唯一持久的反对派。在自1999年起担任共和国委员会第一书记的维克托·罗曼什金领导下，该党名单在2006年获得8.96%，2010年获得24.83%，2019年获得29.50%并赢得七个席位，为其最佳成绩，随后在2024年跌至13.63%和一个席位。罗曼什金在2014年首长选举中对阵亚历山大·别尔德尼科夫时获得7.72%，而该党的力量植根于农村地区和老集体农场的退休人员。"
 ARG.communist_state: "£ARG_Communist_State (PCA) - 阿根廷共产党"
 ARG.communist_state_icon: "£ARG_Communist_State"
 ARG.communist_state_desc: "（马克思列宁主义） - 阿根廷共产党\n\n阿根廷共产党由社会党国际主义派于1918年1月6日创建，七十年来遵循苏联路线，这使其在20世纪40年代与庇隆主义对立，并且在其最具破坏性的时期，将1976年军政府中的魏地拉派系视为值得接触的温和派。它主张通过广泛的民主和反帝阵线实现社会主义，将银行和战略工业国有化，以及拉丁美洲一体化以对抗美国。\n\n在1989年至2016年担任总书记的帕特里西奥·埃切加赖、2016年至2024年的维克托·科特以及此后的豪尔赫·克雷内斯领导下，该党依附于基什内尔主义，在2011年支持胜利阵线，在2023年支持祖国联盟，并通过这些阵线获得了一些市政和省级职位。其1996年的分裂出的共产党特别代表大会带走了党内更具批判性的派系；剩下的是一个规模小、纪律严明的组织，在工会、大学和人权运动中都有存在。"
 ARM.communist_state: "£ARM_Communist_State (ACP) - 亚美尼亚共产党"
 ARM.communist_state_icon: "£ARM_Communist_State"
 ARM.communist_state_desc: "（马克思列宁主义） - 亚美尼亚共产党\n\n亚美尼亚共产党于1991年7月注册，自称是苏联时期亚美尼亚共产党的继承者，至今仍是该国主要的马克思列宁主义组织。它拒绝西方式的市场改革，呼吁实行混合社会主义经济，并主张与俄罗斯建立联盟国家。\n\n在选举方面，该党在1995年和1999年选举后均拥有十个席位，但在2003年降至2.1%，并且自2018年以来抵制了每一次投票。其影响力主要存续于老年党员和苏联怀旧情绪之中，2006年声称拥有18000名党员。"
 AST.communist_state: "£AST_Communist_State (CPA) - 澳大利亚共产党"
 AST.communist_state_icon: "£AST_Communist_State"
 AST.communist_state_desc: "(马克思列宁主义) - 澳大利亚共产党\n\n澳大利亚共产党是一个小型的马克思列宁主义政党，于1971年12月5日由拒绝劳里·阿伦斯与莫斯科决裂的成员创立，当时名为澳大利亚社会党，并在原党解散后于1996年10月恢复了旧名称。它主张关键行业的公有制、工会斗争以及反对美国联盟的反帝外交政策。其影响力在于每周的《卫报》以及在工会与和平运动中的积极活动，而非通过选票。"
 AUS.communist_state: "£AUS_emerging_communism (KPÖ) - 奥地利共产党"
 AUS.communist_state_icon: "£AUS_emerging_communism"
 AUS.communist_state_desc: "（共产主义）- 奥地利共产党\n\n奥地利共产党成立于1918年哈布斯堡王朝崩溃之际，是世界上最古老的共产党之一，是一个反法西斯抵抗的政党，在冷战将其推向边缘之前，曾进入战后最初的几届政府。它早已放弃马克思列宁主义，转而信奉以公共住房、租金管制、社会福利以及反对北约和新自由主义欧洲一体化为核心的民主社会主义，并隶属于欧洲左翼党。\n\n其实力立足于地方且具体务实：在格拉茨和施泰里亚，该党通过捐出市议员的大部分薪水和运营社会咨询服务建立了追随者群体，而这种市政模式正是其重返国家政治的路径。其弱点在于党名，在其政绩为人所知的城区之外，这个名字仍然让它损失选票。"
 AZE.communist_state: "£AZE_emerging_communism (AKP) - 阿塞拜疆共产党"
 AZE.communist_state_icon: "£AZE_emerging_communism"
 AZE.communist_state_desc: "(马克思列宁主义) - 阿塞拜疆共产党 (阿塞拜疆语: Azərbaycan Kommunist Partiyası, AKP)\n\n阿塞拜疆共产党由拉米兹·艾哈迈多夫于1993年创立，是1991年自行解散的苏联党阿塞拜疆分支的继承者。该党呼吁恢复苏维埃政权、公有制、前苏联各族人民的联盟，并反对西方石油利益和北大西洋公约组织在高加索地区的存在，它隶属于前苏联共产党联盟，并参加共产党和工人党国际会议。\n\n该党在本世纪之初便陷入了艾哈迈多夫与菲鲁丁·哈萨诺夫派系之间关于自身领导权的争端，这是众多分裂中的第一次，导致数个团体都声称为其名称拥有者。当局将其视为退休人士和工业城镇中对旧秩序无害的怀旧情绪而加以容忍，而执政党本身作为苏联权贵阶层的继承者，几乎不给他留下任何空间。"
 BAN.communist_state: "£generic_Communist_State_small (WPB) - 孟加拉国工人党"
 BAN.communist_state_desc: "（马克思列宁主义） - 孟加拉国工人党\n\n孟加拉国工人党是一个马克思列宁主义政党，选择参与而非对抗，加入了由人民联盟领导的14党联盟，并以其候选人身份进入政府。它主张世俗社会主义共和国、土地改革、工会权利和国家主导的工业，并将打击伊斯兰主义政治作为首要任务。\n\n在其主席拉希德·汗·梅农的领导下，该党于2014年至2019年期间担任内阁职务，先后负责民用航空和社会福利，同时保留了自己的工会和学生阵线。其影响力在于这些阵线，以及作为世俗左翼伙伴对人民联盟的价值；它对该联盟的依赖使其命运与人民联盟紧密相连。"
 BEL.communist_state: "£BEL_emerging_communism (PVDA-PTB) - 比利时工人党"
 BEL.communist_state_icon: "£BEL_emerging_communism"
 BEL.communist_state_desc: "(马克思主义) - 比利时工人党\n\n比利时工人党是该国唯一双语全国性政党，一个马克思主义组织，其竞选纲领围绕购买力、百万富翁税、退休年龄和公共医疗保健。该党拒绝加入联合政府，通过工会斗争、支持罢工、免费医疗中心网络和青年学生组织来建立其基础。\n\n该党反对北大西洋公约组织成员国身份、武器交付和欧洲紧缩规则，并将欧盟视为资本的市场项目。其影响力在于瓦隆的工业带、布鲁塞尔和安特卫普的工人阶级社区，以及其将社会主义和绿色选票拉向左翼的能力。"
 BEN.communist_state: "£generic_Communist_State_small (PCB) - 贝宁共产党"
 BEN.communist_state_desc: "(霍查主义) - 贝宁共产党\n\n贝宁共产党是一个反修正主义马克思列宁主义政党，由帕斯卡尔·方托吉在秘密状态下创立，其后由菲利普·努杰努梅领导。它既拒绝旧的人民革命党政权，也拒绝取而代之的自由主义秩序，呼吁建立工农政府，终结法国和国际货币基金组织的监护。\n\n它在议会中没有分量，但在工会、学生圈子和街头抗议中持续存在，出版《火焰报》，并隶属于马克思列宁主义政党和组织国际会议。它谴责塔隆对反对派的排斥。其影响力在于其干部以及作为不妥协反对声音的声望。"
 BFA.communist_state: "£generic_Communist_State_small 桑卡拉主义政党"
 BFA.communist_state_desc: ""
 BHR.communist_state: "£generic_Communist_State_small (Al-Minbar) - 进步民主论坛"
 BHR.communist_state_desc: "（共产主义） - 进步民主论坛\n\n进步民主论坛是地下共产主义组织民族解放阵线的合法继承者，于2001年成立，当时流亡者返回并在新的政治社团框架下登记注册。该组织是世俗性的，并刻意跨越教派界限，以工人权利、住房、养老金和平等公民权为竞选纲领，并主张巴林政治应以阶级而非教派为基础来组织。\n\n该社团隶属于共产党和工人党国际会议，并与海湾及阿拉伯左翼政党保持联系。其影响力在于工会圈子、专业协会以及规模虽小但持久的议会存在，并在宪法改革方面与“维法克”和“瓦阿德”合作。"
 BLR.communist_state: "£BLR_Communist_State (KPB) - 白俄罗斯共产党"
 BLR.communist_state_icon: "£BLR_Communist_State"
 BLR.communist_state_desc: "（马克思列宁主义） - 白俄罗斯共产党\n\n白俄罗斯共产党是支持卢卡申科作为苏联遗产捍卫者的忠诚共产主义政党。它主张国家掌控经济命脉、苏维埃爱国主义、与俄罗斯的联盟国家以及对北约的敌视，并认为总统的垂直权力体系是现有最接近工人国家的形式。它在当局的认可下推举候选人，并在议会中与当局保持一致投票。\n\n它在2023年将反对党一扫而空的重新登记中幸存下来。其影响力在于对国有媒体和行政机器的掌控、其退休人士基础以及与俄罗斯共产党人的联系。"
 BNG.communist_state: "£generic_Communist_State_small 摩洛人民解放组织"
 BNG.communist_state_desc: ""
 BOL.communist_state: "£BOL_emerging_communism (PCB) - 玻利维亚共产党"
 BOL.communist_state_icon: "£BOL_emerging_communism"
 BOL.communist_state_desc: "（马克思列宁主义） - 玻利维亚共产党\n\n玻利维亚共产党是一个马克思列宁主义政党，于2003年失去选举注册资格，此后作为争取社会主义运动的盟友而非独立竞争者活动。该党主张战略部门国有化、计划经济以及有组织工人阶级的领导地位，其干部在争取社会主义运动政府和工会领导层中任职。\n\n该党与古巴和委内瑞拉保持一致，并参加圣保罗论坛和共产党国际会议。其影响力在于其工会组织者、意识形态干部以及在更广泛左翼中的影响。"
 BOS.communist_state: "£Bosnian_Communist (KBiH) - 波斯尼亚和黑塞哥维那共产党人"
 BOS.communist_state_icon: "£Bosnian_Communist"
 BOS.communist_state_desc: "（马克思列宁主义） - 波斯尼亚和黑塞哥维那共产党人\n\n波斯尼亚的共产主义运动依托前共产主义者联盟的老兵和机构。它主张国家所有制、世俗政府以及前南斯拉夫各民族之间的重新合作。其在战后多党制体系中的影响力有限。"
 BOT.communist_state: "£BOT_Communist_State (MELS) - 博茨瓦纳马恩列斯运动"
 BOT.communist_state_icon: "£BOT_Communist_State"
 BOT.communist_state_desc: "（马克思列宁主义） - 博茨瓦纳马恩列斯运动\n\n马恩列斯运动以马克思、恩格斯、列宁和斯大林的名字命名，是博茨瓦纳唯一公开的马克思列宁主义政党。它结合了反修正主义共产主义与毛主义和泛非主义思想，谴责执政党是西方资本的新殖民主义附庸，并呼吁将钻石产业和土地国有化。\n\n其基础是学生和激进教师，而非工人，与其说它是选举机器，不如说它更像是学习小组和宣传渠道。该运动参加竞选主要是为了保持其纲领的可见度。"
 BRA.communist_state: "£BRA_Communist_State (PCdoB) - 巴西共产党"
 BRA.communist_state_icon: "£BRA_Communist_State"
 BRA.communist_state_desc: "（马克思列宁主义） - 巴西共产党\n\n巴西共产党是一个正统的马克思列宁主义政党，将社会主义作为长期目标加以捍卫，同时在广泛的左翼阵营中作为一个有纪律的伙伴开展活动。该党主张国家控制战略部门，维护对亚马逊和自然资源的国家主权，并推行反帝国主义的对外政策，倾向于南南合作和多极秩序，而非与华盛顿结盟。\n\n其影响力来自在学生运动中深厚的根基 - 它主导着全国学生联合会 - 以及在工会中的根基，此外还有国会中可靠的支持力量，以换取部长职位来支持劳工党政府。其据点位于马拉尼昂州和东北部。"
 BRY.communist_state: "£SOV_emerging_communism 布里亚特共产党"
 BRY.communist_state_icon: "£SOV_emerging_communism"
 BSH.communist_state: "£SOV_emerging_communism 巴什基尔达斯坦共产党"
 BSH.communist_state_icon: "£SOV_emerging_communism"
 BSH.communist_state_desc: "共产主义国家 - 巴什科尔托斯坦共产党（领导人：尤尼尔·库特卢古任）。苏联共产党的继承者是巴什科尔托斯坦共产党。寻求与世界及俄罗斯共产党人的联系。"
 BUL.communist_state: "£BUL_emerging_communism 保加利亚共产党"
 BUL.communist_state_icon: "£BUL_emerging_communism"
 BUL.communist_state_desc: ""
 CAM.communist_state: "£generic_Communist_State_small (UPC) - 喀麦隆人民联盟"
 CAM.communist_state_desc: "（马克思列宁主义） - 成立于1948年，最初作为反殖民主义组织，曾短暂地被称为非洲民主联盟的喀麦隆分部，喀麦隆人民联盟很快便与左翼理想保持一致。该组织在喀麦隆战争及整个喀麦隆独立运动中发挥了重要作用，尽管在选举或政治上鲜有成功 - 在喀麦隆人民民主联盟上台后，它被迫流亡。反对党合法化后，喀麦隆人民联盟重返国内，在参与选举中取得了一些有限的成功。"
 CAN.communist_state: "£can_emerging_communism 共产党"
 CAN.communist_state_icon: "£can_emerging_communism"
 CAN.communist_state_desc: ""
 CAS.communist_state: "£generic_Communist_State_small 红山党"
 CAS.communist_state_icon: "£generic_Communist_State_small"
 CAS.communist_state_desc: "£generic_Communist_State_small 红山党 - (RMP) 红山党是一个相当单一的政党。他们信奉早于马克思主义的古典社会主义。他们着眼于国家经济和/或集体所有制，而非传统的阶级斗争。许多人对这个政党感到困惑，因为现代大部分时期基本上都是“共产主义和社会主义是坏的”。但有了这种“原始社会主义”，现在有了更好的经济论据，可以试验并实际改变经济在社会本身方面的运作方式。"
 CBD.communist_state: "£generic_Communist_State_small (CPP) 柬埔寨人民党 - (左翼)"
 CBD.communist_state_desc: "（务实社会主义） - 柬埔寨人民党成立于1951年，前身为柬埔寨人民革命党，最初是一个马克思列宁主义政党，与越南和苏联结盟，而非像其主要对手柬埔寨共产党（红色高棉）那样与中国结盟。该党并未与波尔布特领导下崛起的红色高棉结盟，而是在越南的支持下组建政府，以终止其推行的政策。此后，该党在世界剧变时期统治着动荡的柬埔寨，随着社会主义阵营的崩溃，该党逐渐放弃了马克思列宁主义的承诺，随后又放弃了社会主义。尽管90年代仍有持更左翼观点的派系活跃，但他们被务实派边缘化，务实派的目标是在不向任何特定意识形态靠拢的情况下维持对柬埔寨的控制。"
 CHI.communist_state: "£CHI_communism 中国共产党"
 CHI.communist_state_icon: "£CHI_communism"
 CHI.communist_state_desc: "(邓小平理论) - 中国共产党是中华人民共和国的创始党和执政党，是中国大陆唯一的执政党。它最初成立于1921年，自1949年中国解放战争结束后一直掌权，也是中华统一战线的领导党。"
 CHL.communist_state: "£CHL_emerging_communism 智利共产党"
 CHL.communist_state_icon: "£CHL_emerging_communism"
 CHL.communist_state_desc: ""
 CHU.communist_state: "£SOV_emerging_communism 楚瓦什共产党"
 CHU.communist_state_icon: "£SOV_emerging_communism"
 CKK.communist_state: "£SOV_emerging_communism 楚科奇共产党"
 CKK.communist_state_icon: "£SOV_emerging_communism"
 COL.communist_state: "£COL_emerging_communism (FARC–EP) 哥伦比亚革命武装力量-人民军"
 COL.communist_state_icon: "£COL_emerging_communism"
 COL.communist_state_desc: "（马克思列宁主义） - 哥伦比亚革命武装力量由哈科沃·阿雷纳斯于1964年创立，其诞生背景是冷战时期以及哥伦比亚国内针对共产党的暴力镇压行动。对同情共产主义或全力支持共产主义的社区所发动的攻击，促使该组织成立，并标志着对哥伦比亚政府武装斗争的开始。这一冲突时期随着冷战本身的结束才有所缓和，而哥伦比亚革命武装力量不仅要应对社会主义阵营的崩溃，还要面对其创始人的死亡以及日益依赖犯罪活动来获取资金的问题。即便如此，该组织仍继续保有少量孤立据点，并在名义上维持其意识形态路线。"
 COS.communist_state: "£generic_Communist_State_small (VP) - 人民先锋党"
 COS.communist_state_desc: ""
 CRM.communist_state: "£SOV_emerging_communism 俄罗斯共产党"
 CRM.communist_state_icon: "£SOV_emerging_communism"
 CRO.communist_state: "£CRO_emerging_communism (SRP) - 克罗地亚社会主义工党"
 CRO.communist_state_icon: "£CRO_emerging_communism"
 CRO.communist_state_desc: "（广泛左翼）自我标榜为一个包容性强的左翼组织，社会革命党成立于1997年，旨在利用当时缺乏显著左翼政党的情况。尽管该党在很大程度上认同一些东德怀旧观点，但它也支持新左翼的若干方面，并倡导民主与工人自治。"
 CSA.communist_state: "£generic_Communist_State_small 邦联工人党"
 CSA.communist_state_icon: "£generic_Communist_State_small"
 CSA.communist_state_desc: "£generic_Communist_State_small 邦联工人党 - (CWP) 被视为一个边缘的极左政党，许多人甚至质疑是否应允许其参与。他们奉行更为传统的马克思主义政策，但希望将这一框架建立在邦联州的文化之中。仅凭这一点，该党就是一个充满矛盾倾向的政党，主张保留它们的人利用这一自相矛盾的纲领来分裂一般的左翼或社会主义类型政党。"
 CSB.communist_state: "£SIB_emerging_communism 统一共产党"
 CSB.communist_state_icon: "£SIB_emerging_communism"
 CUB.communist_state: "£CUB_emerging_communism 古巴共产党 (PCC)"
 CUB.communist_state_icon: "£CUB_emerging_communism"
 CUB.communist_state_desc: "古巴共产党是古巴共和国的政党，也是该国最大的政党。它成立于1965年，以马克思列宁主义、卡斯特罗主义和格瓦拉主义为原则。它在社会生活中发挥着重要作用，并拥有多个青年组织。"
 CYP.communist_state: "£CYP_emerging_communism 劳动人民进步党 (AKEL)"
 CYP.communist_state_icon: "£CYP_emerging_communism"
 CYP.communist_state_desc: ""
 CZE.communist_state: "£CZE_emerging_communism 捷克和摩拉维亚共产党 (KSČM)"
 CZE.communist_state_icon: "£CZE_emerging_communism"
 CZE.communist_state_desc: "波希米亚和摩拉维亚共产党是一个共产主义政党。各方资料对该党在政治光谱上的定位描述不一，有的称其为左翼，有的称其为极左翼。它是后共产主义中东欧地区少数几个未从党名中去掉“共产党”称号的前执政党之一，尽管该党已修改其党纲以遵守1989年后通过的法律。该党曾是欧洲议会中欧洲联合左翼/北欧绿色左翼党团的成员党，也是欧洲左翼党的观察员党，但现已不再隶属任何组织。"
 DAG.communist_state: "£SOV_emerging_communism 达吉斯坦共产党"
 DAG.communist_state_icon: "£SOV_emerging_communism"
 DEN.communist_state: "£DEN_emerging_communism 丹麦共产党"
 DEN.communist_state_icon: "£DEN_emerging_communism"
 DEN.communist_state_desc: "丹麦共产党是丹麦的马克思列宁主义政党。该党于1919年成立，当时名为丹麦左翼社会党，后更名为现名。该党支持丹麦向共产主义社会过渡。"
 DJI.communist_state: "£generic_Communist_State_small 吉布提共产党"
 DJI.communist_state_desc: ""
 DOM.communist_state: "£generic_Communist_State_small 多米尼加劳动党 (PTD)"
 DOM.communist_state_desc: ""
 DON.communist_state: "£DON_emerging_communism 俄罗斯共产党"
 DON.communist_state_icon: "£DON_emerging_communism"
 DON.communist_state_desc: "俄罗斯共产党"
 DPR.communist_state: "£DPR_communist_state 朝鲜共产党"
 DPR.communist_state_icon: "£DPR_communist_state"
 DPR.communist_state_sov: "£SOV_emerging_communism 俄罗斯联邦共产党"
 DPR.communist_state_sov_icon: "£SOV_emerging_communism"
 ECU.communist_state: "£ECU_emerging_communism (MPD) 人民民主运动"
 ECU.communist_state_icon: "£ECU_emerging_communism"
 ECU.communist_state_desc: "（马克思列宁主义） - 成立于1978年，人民民主运动是厄瓜多尔马克思列宁主义共产党的选举翼。人民民主运动的目标是在国内推动革命，帮助组织罢工，并与其他目标相似的团体合作，以实现最终的马克思列宁主义未来。"
 ECU.communist_state_1: "£generic_Communist_State_small (UP) 人民团结"
 ECU.communist_state_1_desc: "（革命社会主义） - 2014年崛起以取代进步运动党，人民团结党试图联合更广泛的极左翼力量。该联盟强调反帝国主义和革命，同时持有多元民族主义、集体主义和环保主义观点。尽管其意识形态路径更为宽泛，却始终与其他左翼政党保持距离。"
 EGY.communist_state: "£EGY_Communist_State 埃及共产党"
 EGY.communist_state_icon: "£EGY_Communist_State"
 EGY.communist_state_desc: "（马克思列宁主义） - 现代埃及共产党于1975年由前埃及共产党的一些成员组建而成。在安瓦尔·萨达特总统和胡斯尼·穆巴拉克总统的统治下，新成立的共产党遭到国家镇压，并被禁止参加选举。\n\n§H军方§!对该党派持§H中立§!态度"
 ENG.communist_state: "£eng_emerging_communism (CPB) - 英国共产党"
 ENG.communist_state_icon: "£eng_emerging_communism"
 ENG.communist_state_desc: "（马克思列宁主义） - 英国共产党（英文：Communist Party of Britain，CPB）\n\n英国共产党是一个规模不大但纪律严明的马克思列宁主义政党，自诩为英国议会共识之外的革命替代选择。它主张关键产业公有制、强大的工会权力，并坚决与它所谓的资本主义危机管理决裂。\n\n在外交政策上，该党通常反对西方干涉主义，批评北约主导的安全架构，主张采取更为反帝国主义的立场。尽管其选举影响力有限，但通过行动主义、劳工组织和意识形态宣传维持着影响力。"
 ERI.communist_state_ETH: "£ETH_emerging_communism (WPE-§3ER§!) - 埃塞俄比亚工人党-厄立特里亚分支"
 ERI.communist_state_ETH_desc: "（马克思列宁主义） - 埃塞俄比亚工人党（阿姆哈拉语罗马化：Ye'Ityopia Serategnoch Parti）\n\n曾是埃塞俄比亚人民民主共和国唯一的合法政党，1991年，这一地位终结。但这并非该党存在的终结，其许多最显赫的成员逃离了随之而来的内战。\n\n然而，这是该党的厄立特里亚分支，只能在厄立特里亚境内夺取政权。"
 ESB.communist_state: "£FAR_emerging_communism 西伯利亚共产党"
 ESB.communist_state_icon: "£FAR_emerging_communism"
 ETH.communist_state: "£ETH_emerging_communism (WPE) - 埃塞俄比亚工人党"
 ETH.communist_state_icon: "£ETH_emerging_communism"
 ETH.communist_state_desc: "（马克思列宁主义） - 埃塞俄比亚工人党（阿姆哈拉语罗马化：Ye'Ityopia Serategnoch Parti）\n\n曾是埃塞俄比亚人民民主共和国唯一的合法政党，1991年，这一地位终结。但这并非该党存在的终结，其许多最显赫的成员逃离了随之而来的内战。"
 FAR.communist_state: "£FAR_emerging_communism 远东共和国共产党"
 FAR.communist_state_icon: "£FAR_emerging_communism"
 FIN.communist_state: "£FIN_Communist_State_small (KTP) - 共产主义工人党"
 FIN.communist_state_icon: "£FIN_Communist_State_small"
 FIN.communist_state_desc: "（马克思列宁主义） - 共产主义工人党\n\n共产主义工人党-争取和平与社会主义是一个马克思列宁主义政党，由旧共产党中的强硬派共产主义者组成。该党定期前往圣彼得堡庆祝十月革命，他们支持朝鲜的主体思想原则，该党还支持菲律宾和哥伦比亚的共产主义叛乱。"
 FRA.communist_state: "£FRA_Communist_State (PCF) - 法国共产党"
 FRA.communist_state_icon: "£FRA_Communist_State"
 FRA.communist_state_desc: "（马克思列宁主义） - 法国共产党\n\n法国共产党成立于1920年图尔代表大会，凭借其在抵抗运动中的功绩，建立了西欧最强大的共产主义运动。它加入了战后共和国的左翼联合政府，并在密特朗和若斯潘执政期间担任部长职务。苏联解体后，其得票率崩溃，但它仍保留着密集的市镇、工会和地方协会网络。"
 FRA.communist_state2: "£FRA_Communist_State (PRP) - 无产阶级革命党"
 FRA.communist_state2_icon: "£FRA_Communist_State"
 FRA.communist_state2_desc: "（革命社会主义） - 无产阶级革命党\n\n无产阶级革命党拒绝法国共产党所走的议会道路，而是为反对资本主义和法西斯主义的世界革命而组织起来。它主张无产阶级专政和无产阶级国际主义，拒绝与改良主义政党结成选举联盟。其影响力在于在劳工中的鼓动，而非选票。"
 GAH.communist_state: "£GAH_communist_statism (CPP) - 人民大会党"
 GAH.communist_state_icon: "£GAH_communist_statism"
 GAH.communist_state_desc: "（非洲社会主义） - 成立于1949年，作为支持独立的联合黄金海岸大会的一个分支，人民大会党是该国更大范围反殖民运动的一部分。它与当时盛行的左翼泛非运动紧密结盟，成为加纳独立的主要呼声，并最终成为其第一个执政党。该党在很大程度上受其创始人夸梅·恩克鲁玛的影响，他本人也是加纳的第一任总统。尽管由于90年代民主恢复后组织工作面临困难，该党在近期的选举中鲜有成功，但它仍保持着左翼立场和对泛非主义的关注。"
 GEO.communist_state: "£GEO_emerging_communism 格鲁吉亚统一共产党-§G新兴主义派§!"
 GEO.communist_state_icon: "£GEO_emerging_communism"
 GEO.communist_state_desc: ""
 GER.communist_state: "£GER_emerging_communism (DKP) 德国共产党"
 GER.communist_state_icon: "£GER_emerging_communism"
 GER.communist_state_desc: "共产主义 - 德国共产党（Deutsche Kommunistische Partei）。德国共产党是一个马克思列宁主义政党，在冷战期间于西德成立，受东德监督，并从中获得大部分资金。德国统一后，该党的受欢迎程度持续下降。"
 GRA.communist_state: "£generic_Communist_State_small 格林纳达联合工党 (GULP)"
 GRA.communist_state_desc: ""
 GRE.communist_state: "£GRE_emerging_communism (KKE) - 希腊共产党"
 GRE.communist_state_icon: "£GRE_emerging_communism"
 GRE.communist_state_desc: "（马克思列宁主义） - 希腊共产党\n\n希腊共产党成立于1918年，自1924年起沿用现名，是希腊历史最悠久的政党，坚持正统马克思列宁主义、反帝国主义，并反对欧洲联盟和北大西洋公约组织。该党自1991年起由阿莱卡·帕帕里加领导，2013年起由季米特里斯·库楚巴斯领导，拒绝与任何其视为资产阶级的政党联合，这一立场促成了2012年6月的重新选举。该党民调长期维持在百分之五至百分之九之间，2023年6月获得7.69%，2024年欧洲选举获得9.25%，其欧洲议会议员于2014年退出欧洲联合左翼/北欧绿色左翼党团，以无所属议员身份任职。"
 GUA.communist_state: "£generic_Communist_State_small 危地马拉民族革命团结党-玛雅兹"
 GUA.communist_state_desc: "共产主义 - 危地马拉全国革命联盟是危地马拉的一个共产党。它遵循多种意识形态，其中最著名的是马克思列宁主义、查韦斯主义、玻利瓦尔主义和民粹主义。该党成立于1982年，但直到2003年才成功进入议会。自那以后，它的得票率一直保持在较低的个位数，从未超过4%。2011年和2015年，它与维纳克党组成选举联盟参选。"
 GUB.communist_state: "£GUB_emerging_left_wing_radical PAIGC（强硬派）"
 GUB.communist_state_icon: "£GUB_emerging_left_wing_radical"
 GUB.communist_state_desc: "共产主义 - 几内亚和佛得角非洲独立党最初成立是为了和平争取从葡萄牙独立，该党在20世纪60年代转向武装冲突，并成为几内亚比绍独立战争的交战方之一。战争接近尾声时，该党建立了一个马克思列宁主义的一党制国家，直到90年代初引入民主。"
 HAI.communist_state: "£HAI_communist_state NPCH(ML) - 海地新共产党（马列）"
 HAI.communist_state_icon: "£HAI_communist_state"
 HAI.communist_state_desc: "马克思列宁主义共产主义 - 海地新共产党（马克思列宁主义）（法文：Nouveau Parti Communiste Haïtien (Marxiste-Léniniste)，英文：New Haitian Communist Party (Marxist-Leninist)）是一个成立于2000年的政党，该党汇集了马克思列宁主义者、毛主义者和斯大林主义者的广泛混合。\n\n他们被广泛认为是反修正主义的，是海地统一共产党（Parti Unifié des Communistes Haïtiens）的思想继承者。海地统一共产党在弗朗索瓦·“老爹医生”·杜瓦利埃及其子让-克洛德·“娃娃医生”·杜瓦利埃的统治下遭到镇压并最终流亡。"
 HKG.communist_state: "£HK_PLA 中国人民解放军驻香港部队"
 HKG.communist_state_icon: "£HK_PLA"
 HKG.communist_state_desc: "共产主义 - 驻港解放军部队的存在是为了维护特别行政区的防务。虽然基本法限制驻军干预地方事务，但若香港政府提出请求，驻军可被召唤以恢复公共秩序。"
 HLS.communist_state: "£generic_Communist_State_small 伊甸公社"
 HLS.communist_state_icon: "£generic_Communist_State_small"
 HLS.communist_state_desc: ""
 HOL.communist_state: "£HOL_emerging_communism (NCPN) - 荷兰新共产党"
 HOL.communist_state_icon: "£HOL_emerging_communism"
 HOL.communist_state_desc: "(共产主义) - 荷兰新共产党。荷兰新共产党坚持基于反资本主义、工人控制和抵制北约及西方经济结构的马克思列宁主义纲领。它主张主要产业国有化、扩大社会保障以及独立于美国和欧盟影响的外交政策。尽管在选举中处于边缘地位，该党在工会圈子和左翼活动网络中仍保持存在，自称为荷兰历史共产主义运动的意识形态继承者。"
 HPR.communist_state: "£HPR_Communist_State 哈尔科夫人民党"
 HPR.communist_state_icon: "£HPR_Communist_State"
 HPR.communist_state_desc: "共产主义 - 哈尔科夫人民党。KPP是在哈尔科夫起义期间成立的亲俄共产主义政党。它与俄罗斯共产党人联系紧密，并主张马克思列宁主义。"
 HPR.communist_state_sov: "£SOV_emerging_communism 俄罗斯联邦共产党"
 HPR.communist_state_sov_icon: "£SOV_emerging_communism"
 HUN.communist_state: "£HUN_emerging_communism 匈牙利工人党"
 HUN.communist_state_icon: "£HUN_emerging_communism"
 HUN.communist_state_desc: ""
 ICE.communist_state: "£ICE_emerging_communism 冰岛人民阵线"
 ICE.communist_state_icon: "£ICE_emerging_communism"
 ICE.communist_state_desc: "（生态社会主义）- 冰岛人民阵线寻求“将人民从市场资本主义的枷锁中解放出来”，并无条件反对北约和欧盟，认为它们都是帝国主义组织。"
 IKR.communist_state: "£IKR_CPI (CPI) - 伊朗共产党库尔德斯坦科马拉组织"
 IND.communist_state: "£generic_Communist_State_small (PKI) 印度尼西亚共产党"
 IND.communist_state_desc: "（毛主义） - 该党起源于荷属东印度的小型政党，与荷兰本土的左翼运动有联系。直到俄国革命之后，荷兰与印度尼西亚之间的分歧才导致这个原本更偏左翼的社会民主运动发生了激进的转向。它最初采用了“印度群岛共产主义联盟”这一名称，在反殖民运动中变得更加活跃，并在印度尼西亚公开支持苏联式的马克思列宁主义，随后又将重心更多地转向中国。然而，在1965年苏哈托政变后，该党遭到大规模镇压 - 共产主义和社会主义组织成为各种屠杀和拘留的主要目标。即使恢复了多党民主制，该党也未能像其他政党那样复兴，甚至左翼政党也不例外 - 它反而与其他共产主义组织一道继续被取缔。"
 ING.communist_state: "£SOV_emerging_communism 印古什共产党"
 ING.communist_state_icon: "£SOV_emerging_communism"
 IRE.communist_state: "£IRE_emerging_communism 工人党"
 IRE.communist_state_desc: ""
 ISR.communist_state: "£ISR_Communist_State (Hadash) - 和平与平等民主阵线"
 ISR.communist_state_icon: "£ISR_Communist_State"
 ISR.communist_state_desc: "（共产主义） - 和平与平等民主阵线\n\n哈达什成立于1977年，是围绕以色列共产党（马基）以及较小的犹太和阿拉伯左翼团体组成的阵线。它自称为非锡安主义的犹太-阿拉伯政党，是最早呼吁两国方案的以色列议会议员之一，并要求承认以色列的阿拉伯公民为少数民族。其选民主要是加利利地区的世俗阿拉伯人和基督教社群。1999年至2015年由穆罕默德·巴拉凯领导，2015年至2023年由艾曼·奥德领导，它支撑了联合名单，该名单在2015年赢得13个席位，2020年赢得15个席位。"
 ITA.communist_state: "£ITA_emerging_communism 意大利共产党"
 ITA.communist_state_icon: "£ITA_emerging_communism"
 ITA.communist_state_desc: "意大利共产党（PCI）在1991年苏联解体时解散。此后，许多较小的实体试图继承其遗产，却在重建这个西方曾盛极一时的最大共产党方面屡屡失败。PCI遵循苏联列宁主义和斯大林主义思想，秉持对苏联共产主义的古典式愿景。重新分配土地和生产资料是其目标的重要部分，为实现这些目标，任何手段都不会被排除在外。一旦无产阶级革命的时代最终到来，或许需要一个专政的过渡时期来确保其安全。正如贝卢斯科尼曾说过的那样，“很明显，他们是、并且永远是贫穷共产主义。”"
 JAM.communist_state: "£generic_Communist_State_small 牙买加共产党"
 JAM.communist_state_desc: ""
 JOR.communist_state: "£generic_Communist_State_small 约旦民主党"
 JOR.communist_state_desc: ""
 KAE.communist_state: "£SOV_emerging_communism 卡累利阿共产党"
 KAE.communist_state_icon: "£SOV_emerging_communism"
 KAZ.communist_state: "£generic_Communist_State_small (KPK) - 共产主义党"
 KAZ.communist_state_desc: "（共产主义）- 哈萨克斯坦共产党\n\n哈萨克斯坦共产党成立于1936年，当时哈萨克斯坦被授予苏联内的加盟共和国地位。在苏联解体之前，哈萨克斯坦共产党一直是苏联共产党的一个分支。"
 KBK.communist_state: "£SOV_emerging_communism 卡巴尔达-巴尔卡尔共产党"
 KBK.communist_state_icon: "£SOV_emerging_communism"
 KCC.communist_state: "£SOV_emerging_communism 卡拉恰伊-切尔克斯共产党"
 KCC.communist_state_icon: "£SOV_emerging_communism"
 KEN.communist_state: "£generic_Communist_State_small (SDP) - 肯尼亚社会民主党"
 KEN.communist_state_desc: "(共产主义) - 肯尼亚社会民主党\n\n肯尼亚社会民主党成立于1992年，多年来经历了重大变革，并持续倾向于极左翼。"
 KHM.communist_state: "£KHM_emerging_communism 俄罗斯联邦共产党"
 KHM.communist_state_icon: "£KHM_emerging_communism"
 KHM.communist_state_desc: "共产主义 - 俄罗斯联邦共产党（Kommunisticheskaya Partiya Rossiyskoy Federatsii）是旧苏联共产党的继承者。它信奉马克思列宁主义，在俄罗斯整个后苏联历史中一直是第二大政党。"
 KHS.communist_state: "£SOV_emerging_communism 哈卡斯共产党"
 KHS.communist_state_icon: "£SOV_emerging_communism"
 KLM.communist_state: "£SOV_emerging_communism 卡尔梅克共产党"
 KLM.communist_state_icon: "£SOV_emerging_communism"
 KOM.communist_state: "£SOV_emerging_communism 科米共产党"
 KOM.communist_state_icon: "£SOV_emerging_communism"
 KOR.communist_state: "£kor_emerging_communism (NDFSK) - 韩国民族民主战线"
 KOR.communist_state_icon: "£kor_emerging_communism"
 KOR.communist_state_desc: ""
 KOS.communist_state: "£KOS_emerging_communism (LKCK) - 科索沃民族解放运动"
 KOS.communist_state_icon: "£KOS_emerging_communism"
 KOS.communist_state_desc: ""
 KUB.communist_state: "£SOV_emerging_communism (CPK) - 库班共产党"
 KUB.communist_state_icon: "£SOV_emerging_communism"
 KYR.communist_state: "£KYR_emerging_communism 吉尔吉斯斯坦共产党"
 KYR.communist_state_icon: "£KYR_emerging_communism"
 KYR.communist_state_desc: "吉尔吉斯斯坦共产党是吉尔吉斯斯坦的一个共产主义政党，成立于1992年6月22日。该党出版日报《吉尔吉斯斯坦真理报》。该党自认为是苏联时期统治吉尔吉斯斯坦的吉尔吉斯共产党（俄共（布）吉尔吉斯地区组织）的继承者。"
 LAO.communist_state: "£generic_Communist_State_small (LPRP) - 老挝人民革命党"
 LAO.communist_state_desc: "（马克思列宁主义）- 老挝人民革命党于1955年从印度支那共产党中分离成立，随即与越南北部共产主义政府结盟，并对当时存在的老挝王国发动了起义。受苏联马克思列宁主义思想及越南自身胡志明思想的影响，该党最终建立了以两者为基础的社会主义制度。随着社会主义阵营的解体，该党被迫在国内推行改革，但与邻国越南不同，老挝收回了其中大部分改革内容，以保留更多控制权。"
 LAT.communist_state: "£LAT_communist_state (LSP) - 拉脱维亚社会党"
 LAT.communist_state_icon: "£LAT_communist_state"
 LAT.communist_state_desc: "(共产主义) - 拉脱维亚社会党\n\n 拉脱维亚社会党成立于1994年，是在前拉脱维亚共产党被禁止后，由前党职人员建立的。拉脱维亚社会党谴责拉脱维亚从苏联分离，并将其定性为民族资产阶级政变，现在该党极端左翼，在俄语人口中颇受欢迎。"
 LBA.communist_state: "£generic_Communist_State_small (LCP) - 利比亚共产党"
 LBA.communist_state_desc: "（马克思列宁主义） - 利比亚共产党\n\n利比亚共产党成立于第二次世界大战结束后不久。然而，共产党人随即遭到了王国当局的镇压。卡扎菲上台后，镇压仍在继续，共产党人被指控传播西方宣传和资本主义。"
 LEB.communist_state: "£LEB_emerging_communism (LCP) - 黎巴嫩共产党"
 LEB.communist_state_icon: "£LEB_emerging_communism"
 LEB.communist_state_desc: "（马克思列宁主义） - 作为1924年成立的叙利亚-黎巴嫩共产党的一部分存在，直到1964年正式分裂后，黎巴嫩共产党才成为独立的组织。在委任统治时期被禁止，后来因其对纳赛尔主义和泛阿拉伯主义的立场而被边缘化，该党后来选择与其他左翼政党以及黎巴嫩国内的进步力量结盟。在内战期间，该党反对以色列支持的马龙派政府，尽管其大部分成员是基督徒，但以与主要由穆斯林组成的民兵结盟而闻名。然而，随着内战的结束，该党开始经历危机；内战的结束恰逢苏联解体。即使有一位一直推动意识形态上独立于苏联本身的领导人，随后仍发生了多次内部选举和动荡时期，该党难以稳定下来。"
 LES.communist_state: "£generic_Communist_State_small (CPL) - 莱索托共产党"
 LES.communist_state_desc: "（马克思列宁主义）\n莱索托共产党\n\n莱索托共产党成立于1962年，是巴苏陀人争取独立斗争以及随后在边境对面南非反抗种族隔离制度的关键参与者。\n\n与非洲内外许多其他共产党不同，莱索托共产党并未分裂为两个交战派系，而是选择以民主方式解决亲苏派与亲华派之间的意识形态分歧，最终亲苏派赢得了多数选票。1970年，该党在莱阿布阿·乔纳森的统治下几乎立即被取缔，直到1991年才合法化。\n\n种族隔离制度垮台后，莱索托共产党曾多次主张以联盟地位重新加入南非。"
 LIT.communist_state: "£generic_Communist_State_small 立陶宛共产党"
 LIT.communist_state_desc: "(马克思列宁主义) - 尽管在立陶宛因反共产主义法律而被禁止，立陶宛共产党仍以各种形式或非正式网络继续存在 - 其中较为温和的党派与前成员保持联系，或积极倡导其正式重建。"
 LKT.communist_state: "£generic_Communist_State_small 农民革命阵线"
 LKT.communist_state_icon: "£generic_Communist_State_small"
 LKT.communist_state_desc: "£generic_Communist_State_small 农民革命阵线 - (FRF)是一个马克思主义政党，强调国家的工人，特别是新共和国的工人，就是农民。因此，组织国家的农民意味着可以诞生一场真正的革命，进而掀起一场新的世界革命，对抗企业阶级中的暴利者。"
 LPR.communist_state: "£LPR_communist_state 卢甘斯克共产主义联盟"
 LPR.communist_state_icon: "£LPR_communist_state"
 LPR.communist_state_sov: "£SOV_emerging_communism 俄罗斯联邦共产党"
 LPR.communist_state_sov_icon: "£SOV_emerging_communism"
 LUX.communist_state: "£generic_Communist_State_small 卢森堡共产党"
 LUX.communist_state_desc: ""
 MAC.communist_state: "£MAC_PLA 中国人民解放军驻澳门部队"
 MAC.communist_state_icon: "£MAC_PLA"
 MAC.communist_state_desc: "共产主义 - 驻澳解放军部队的存在是为了维护特别行政区的防务。虽然基本法限制驻军干预当地事务，但若澳门政府提出请求，驻军可被召唤以恢复公共秩序。"
 MAD.communist_state: "£generic_Communist_State_small (AKFM) - 马达加斯加独立大会党"
 MAD.communist_state_desc: "（马克思主义）\n马达加斯加独立大会党\n\n马达加斯加独立大会党成立于1958年，创始主席是理查德·安德里亚曼贾托，他是一位与法国共产党有联系的梅里纳神父。\n\n马达加斯加独立大会党积极参与争取独立的努力，并大力主张立即从法国独立，而不是逐步独立。在其整个存在期间，马达加斯加独立大会党一直由梅里纳人主导，尽管如此，马达加斯加独立大会党仍坚持反种族主义政策。"
 MAL.communist_state: "£MAL_communism 非洲民主与独立团结"
 MAL.communist_state_icon: "£MAL_communism"
 MAL.communist_state_desc: "（泛非共产主义）- 非洲民主与独立团结党\n非洲民主与独立团结党是马里的主要共产党之一。它一贯以马克思列宁主义共产主义和泛非主义为纲领开展运动。该党名义上声称其主要竞选意识形态是泛非主义，但实际上本质上是共产主义的。此外，该党在国际上与国际共产主义研讨会有联系，后者后来成为国际共产党和工人党会议，使其成为马里最前沿的共产主义和公认的共产党之一。"
 MEL.communist_state: "£SOV_emerging_communism 马里埃尔共产党"
 MEL.communist_state_icon: "£SOV_emerging_communism"
