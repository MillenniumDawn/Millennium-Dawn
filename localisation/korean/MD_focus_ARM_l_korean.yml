 ARM_defence: "아르메니아 수호"
 ARM_defence_desc: "우리나라에는 더 나은 보호가 필요하며, 이는 최고의 특수 기관만이 제공할 수 있습니다. 우리는 이들에게 아낌없이 자금을 지원할 것입니다."
 ARM_police: "아르메니아 경찰"
 ARM_police_desc: "아르메니아 공화국 경찰은 아르메니아의 국가 경찰입니다. 이제 우리는 이 조직의 전면적인 개혁을 단행할 준비가 되었습니다. 신규 인력을 채용하고, 부패한 관료를 제거하며, 경찰 예산을 늘릴 것입니다."
 ARM_police_troops: "경찰 부대"
 ARM_police_troops_desc: "아르메니아 경찰 부대는 구 내무군 및 그 소비에트 전신과 함께 모든 주요 작전에 참여했습니다. 이들의 임무는 특수 시설 경비, 공공질서 유지, 치안 확보, 징집병과 부사관의 예비 훈련을 포괄합니다."
 ARM_national_central_bureua: "국가 중앙국"
 ARM_national_central_bureua_desc: "국가 중앙국은 범죄 수사, 작전 지원, 기술 지원의 세 부서로 업무를 나누어 수행합니다. 우리는 예산을 늘리고 인사 개혁을 단행하여 세 부서 모두가 최대 역량으로 기능하도록 할 것입니다."
 ARM_special_oper_forces: "특수작전군"
 ARM_special_oper_forces_desc: "국가에 대한 무장 위협에 대응하는 임무를 맡은 아르메니아 경찰의 엘리트 특수 부대입니다. 현재의 구성과 장비는 현대 기준에 미치지 못하므로, 둘 다 완전히 쇄신할 계획입니다."
 ARM_black_panters: "블랙 팬서"
 ARM_black_panters_desc: "블랙 팬서는 경찰 특수 부대에 편입된 전직 군인들입니다. 이들의 전투 경험과 현장 기법은 우리 법 집행 조직에 귀중한 자산입니다."
 ARM_nss: "국가안보국"
 ARM_nss_desc: "국가안보국은 아르메니아의 국가 안보 및 정보 분야의 주요 기관입니다. 아직 비교적 역사가 짧아 경험 많은 인력이 부족합니다. 우리는 맞춤형 개혁과 예산 증액으로 이를 해결할 것입니다."
 ARM_take_border_troops: "국경 경비대"
 ARM_take_border_troops_desc: "아르메니아 국경 경비대는 튀르키예, 아제르바이잔, 이란, 조지아와 맞닿은 아르메니아의 국경을 감시하고 지킵니다. 만성적인 예산 부족으로 현재는 부여된 기능의 일부만을 수행하고 있습니다. 우리가 이를 바로잡겠습니다."
 ARM_economic_corruption_security: "경제 안보 및 부패 방지"
 ARM_economic_corruption_security_desc: "이 부서는 부패와 싸우고 내부 사보타주로부터 아르메니아 경제를 보호하는 일을 맡고 있습니다. 경제 안보가 그 어느 때보다 중요한 만큼, 이 부서에 대한 투자는 사치가 아니라 필수입니다."
 ARM_constitutional_teerorism: "안보와 헌법"
 ARM_constitutional_teerorism_desc: "이 부서는 헌정 질서를 수호하고 테러에 대응하기 위해 존재합니다. 추가 예산은 부서의 역량을 날카롭게 하고 대응 능력을 향상시킬 것입니다."
 ARM_alpha: "알파 특수부대"
 ARM_alpha_desc: "조직범죄 대응부터 대테러에 이르기까지 광범위한 임무를 수행하는 아르메니아 정보기관의 엘리트 특수 부대입니다. 인력 쇄신과 예산 증액이 이들의 역량을 크게 향상시킬 것입니다."
 ARM_fis: "해외정보국"
 ARM_fis_desc: "해외정보국은 아르메니아의 주요 해외 정보 기관입니다. 우리 자체의 국가 정보 기관으로서 우리의 모든 비공식 대외 정책 활동을 담당하게 될 것입니다."
 ARM_special_services_category: "아르메니아 특수 기관"
 ARM_special_services_category_desc: "[ARM.GetFlag]§Y아르메니아§!는 [NKR.GetFlag]§R카라바흐 분쟁§!을 §G승리§!로 극복한 용맹한 군대뿐 아니라 용맹한 £text_icon_armnss §2법 집행 및 특수 기관§!에 의해서도 보호받고 있으며, 이는 §Y국가의 £text_icon_armnss 내부 안보§!의 열쇠이므로 국가가 인색하게 굴어서는 안 됩니다.\n\n£text_icon_armnss §Y특수 기관 분야§!의 중점을 §G완료§!하면 아래에 표시되는 §Y국가 정신§!이 점점 더 많이 §G해금§!됩니다."
