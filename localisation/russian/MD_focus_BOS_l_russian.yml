 Bos_will_pull_us_into_a_war: "Это втянет нас в §Rгражданскую войну§! с §YРеспубликой Сербской§! в течение §Yдвух недель§!."
 BOS_may_draw_us_closer_to_civil_war: "§RПриблизит нас к гражданской войне§!"
 bos_run_the_chance_of: "Есть риск §Rнемедленной войны§!"
 BOS_unlocks_desc_yugonost: "£decision_icon_small §YОткрывает§! решения §YЮгоностальгия§!"
 BOS_ATTITUDE_TOOLTIP: "Показатель §YДоверие§! отражает, насколько та или иная группа поддерживает центральное правительство: от §tвраждебности§! через §gбезразличие§! и §Gдружелюбие§! до §Gлояльности§!. Враждебные группы могут устраивать демонстрации и блокировать политические пути, а совокупные значения влияют на стабильность страны."
 bos_srpska_gui_info_TOOLTIP: "§YСербы§! в основном проживают в Республике Сербской — территории, которая охватывает Федерацию Боснии и Герцеговины с востока и севера. Республика Сербская является автономным образованием в составе Боснии и Герцеговины. Сербы преимущественно исповедуют православие."
 bos_bosniak_gui_info_TOOLTIP: "§YБоснийцы§! — это этническая группа, которая совместно образует Федерацию Боснии и Герцеговины (не путать с названием страны Босния и Герцеговина). Они проживают преимущественно в центральной Боснии и исповедуют преимущественно ислам."
 bos_croat_gui_info_TOOLTIP: "§YХорваты§! являются группой меньшинства в составе Федерации Боснии и Герцеговины. В основном они живут в юго-западном регионе Боснии вдоль границы с южным побережьем Хорватии. Они преимущественно католики по вере."
