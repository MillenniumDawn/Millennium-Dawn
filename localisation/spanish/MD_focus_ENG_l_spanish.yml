 ENG_finalize_scottish_union_settlement: "Finalizar el Acuerdo Escocés"
 ENG_finalize_scottish_union_settlement_desc: "Se han aprobado tres acuerdos en Escocia, y el mandato que los partidos separatistas consideraron imposible de reunir está completo. Lo que queda es el acto formal: plasmar el resultado en el estatuto, desmantelar la maquinaria del referéndum de forma definitiva y eliminar los núcleos reclamados pendientes de Escocia del registro para que no quede ninguna ambigüedad que un futuro gobierno pueda explotar. Holyrood conserva sus instituciones, pero la cuestión constitucional que el acuerdo de descentralización dejó abierta en 1998 queda cerrada."
 ENG_finalize_north_irish_union_settlement: "Finalizar el Acuerdo Norirlandés"
 ENG_finalize_north_irish_union_settlement_desc: "Se han aprobado tres acuerdos en Irlanda del Norte, y el mandato que la facción republicana consideró imposible de reunir está completo. Lo que queda es el acto formal: plasmar el resultado en el estatuto, desmantelar la maquinaria del referéndum fronterizo de forma definitiva y eliminar los núcleos reclamados pendientes de Irlanda del Norte del registro para que no quede ninguna ambigüedad que un futuro gobierno pueda explotar. Stormont conserva sus instituciones, pero la cuestión constitucional que el acuerdo del Viernes Santo dejó abierta queda cerrada."
 ENG_finalize_welsh_union_settlement: "Finalizar el Acuerdo Galés"
 ENG_finalize_welsh_union_settlement_desc: "Se han aprobado tres acuerdos en Gales, y el mandato que el ala independentista del Senedd consideró imposible de reunir está completo. Lo que queda es el acto formal: plasmar el resultado en el estatuto, desmantelar la maquinaria del referéndum de forma definitiva y eliminar los núcleos reclamados pendientes de Gales del registro para que no quede ninguna ambigüedad que un futuro gobierno pueda explotar. El Senedd conserva sus instituciones, pero la cuestión constitucional que el acuerdo de descentralización dejó abierta queda cerrada."
 ENG_integrate_scotland_tt: "[SCO.GetFlag] Escocia se integra en la Unión:\n - La §HAgitación§! y el §HNacionalismo§! de Escocia se fijan en §G0§!\n - La §HDependencia§! de Escocia se fija en §G100§!\n - No se podrán convocar más referéndums Escoceses"
 ENG_integrate_northern_ireland_tt: "[NIR.GetFlag] Irlanda del Norte se integra en la Unión:\n - La §HTensión Sectaria§! y el §Hnacionalismo§! de Irlanda del Norte se fijan en §G0§!\n - La §HDependencia§! de Irlanda del Norte se fija en §G100§!\n - No se podrán convocar más referéndums ni consultas fronterizas"
