 JAP_mitsubishi_heavy_industries_tank_manufacturer_header_battle_recon_power: "Puissance de combat et de reconnaissance"
 JAP_mitsubishi_heavy_industries_tank_manufacturer_header_artillery_anti_air_systems: "Artillerie et systèmes anti-aériens"
