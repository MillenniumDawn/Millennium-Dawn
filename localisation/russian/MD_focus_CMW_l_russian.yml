l_russian:
 Commonwealth_member_modifier: "Член содружества"
 CMW_Leaving.1.t: "[FROM.GetName] покидает Содружество наций"
 CMW_Leaving.1.d: "[FROM.GetName] официально объявила о выходе из Содружества наций. Это решение знаменует собой значительный сдвиг во внешней политике страны, отражающий стремление к большей автономии и новым международным альянсам. Выход из Содружества может повлиять на дипломатические отношения и экономические связи внутри организации, создав новые проблемы и открыв новые возможности как для выходящей страны, так и для остальных государств-членов."
 CMW_Leaving.1.a: "Удачи вам"
 Commonwealth_member_modifier_desc: "Как член Содружества Наций, наша страна пользуется преимуществами прочных дипломатических связей и экономического сотрудничества с другими государствами-членами. Это историческое объединение обеспечивает нам сеть взаимной поддержки и общих ценностей, укрепляя наш международный авторитет и торговые возможности. Однако балансирование нашего суверенитета с коллективными интересами Содружества иногда может привести к дипломатическим и политическим проблемам."
 CMW_member_eng_influence_tt: "[ENG.GetNameWithFlag] $foreign_influence_modifier$: §G+10%§!"