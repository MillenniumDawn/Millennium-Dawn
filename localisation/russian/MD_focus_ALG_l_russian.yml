 ALG_cabinet_loyal: "Лояльное правительство"
 ALG_cabinet_loyal_desc: "Нынешнее правительство состоит в основном из лоялистов. Политическая надёжность высока, но управленческих талантов немного."
 ALG_cabinet_competent: "Компетентное правительство"
 ALG_cabinet_competent_desc: "В нынешнем правительстве — способные технократы и опытные управленцы. Дела идут эффективно, но лояльность не всегда гарантирована."
 ALG_cabinet_balanced: "Сбалансированное правительство"
 ALG_cabinet_balanced_desc: "Нынешний состав правительства разумно сочетает политическую надёжность и профессиональную компетентность."
 ALG_cabinet_reformist: "Реформаторское правительство"
 ALG_cabinet_reformist_desc: "В нынешнем правительстве преобладают люди реформаторских взглядов со слабыми связями с глубинным государством. Управление может улучшиться, но военная верхушка встревожена."
 ALG_cabinet_disloyal: "Нелояльное правительство"
 ALG_cabinet_disloyal_desc: "Лояльность ключевых министров под вопросом. Управление парализовано борьбой группировок и взаимным недоверием."
 ALG_cabinet_incompetent: "Некомпетентное правительство"
 ALG_cabinet_incompetent_desc: "Правительству не хватает управленческих талантов. Решения исполняются медленно и ненадёжно."
 ALG_cabinet_deep_state_dominated: "Правительство глубинного государства"
 ALG_cabinet_deep_state_dominated_desc: "Правительство насквозь пронизано военными и спецслужбами. Гражданский контроль в лучшем случае номинален."
 ALG_economic_liberalization: "Либерализация экономики"
 ALG_economic_liberalization_desc: "Министерство финансов проводит либеральные экономические реформы, открывая рынки и сокращая вмешательство государства."
 alg_tamazight_recognition_started_tt: "Начат конституционный процесс признания тамазигхта…"
 alg_tamazight_recognition_complete_tt: "Тамазигхт официально закреплён в конституции."
 recent_officer_appointments: "Недавние назначения офицеров"
 alg_deep_state.202.t: "Республика в опасности"
 alg_deep_state.202.d: "Попытка сопротивления военному захвату провалилась. Вооружённые сторонники правительства и армейские части сходятся в уличных боях. Страна балансирует на грани полномасштабной гражданской войны. От нынешних решений зависит, уцелеет ли Алжир как единое государство."
 alg_deep_state.202.a: "Пусть конфликт идёт своим чередом"
 alg_deep_state.202.b: "Договориться, пока не поздно"
 alg_civil_war_erupts_tt: "Политический кризис перерос в открытое вооружённое противостояние. Стабильность рушится, страна на пороге гражданской войны."
 alg_civil_war_averted_tt: "Ценой болезненного компромисса худшего удалось избежать. Военные сохраняют немалое влияние, но полномасштабной гражданской войны пока нет."