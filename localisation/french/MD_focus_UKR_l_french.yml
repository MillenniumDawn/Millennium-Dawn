 UKR_equipment_develop_domestic_modernize_stuhna_p_atgm: "Modernize §YRK-2 'Stuhna-P'§! ATGM"
 UKR_equipment_develop_domestic_modernize_stuhna_p_atgm_desc: "\n\n\n\n\n\n£UKR_desctext_develop_domestic_modernize_stuhna_p_for_tooltip\n\n\n\n\n\n\n\n\n§WWe can further modernize the §YRK-2 'Stuhna-P'§! ATGM complex, to better stay in touch with current threats.\nWith this one the system will incorporate significant ergonomic and technological upgrades to its remote control unit, including adjustable screen brightness, integrated system status diagnostics, and direct thermal imager feed display.\nFurthermore, the modernization will introduce integrated GPS navigation with real-time mapping, displaying the launcher's coverage radius, orientation, and a digital distance-measuring ruler directly on the operator's interface.\n------------------\nThis Decision is a §Rprerequisite§! for unlocking the next §Y1§! decision in the same equipment category. If you §Rskip§! this decision, you will §Rlose§! the opportunity to complete the subsequent one.§!"
 UKR_equipment_develop_domestic_modernize_stuhna_p_atgm_flag: "Completed decision §YModernize RK-2 'Stuhna-P' ATGM§!"
 ukraine_equipment_develop_domestic_atgm.5.name: "RK-2M 'Stuhna-PM' ATGM: Development Finished"
 ukraine_equipment_develop_domestic_atgm.5.desc: "The wonderful people at Luch Design Bureau have finished the development of the RK-2M 'Stuhna-PM' ATGM, and we can select the next step for acquiring this new system into our [ROOT.GetFlag] [ROOT.GetAdjective] Armed Forces."
 ukraine_equipment_develop_domestic_atgm.5.a: "Get the design itself"
 ukraine_equipment_develop_domestic_atgm.5.b: "Launch the full-scale modernization"
 UKR_equipment_develop_domestic_bulava_atgm_with_tech: "Develop §Y'Bulava'§! next-gen ATGM"
 UKR_equipment_develop_domestic_bulava_atgm_with_tech_desc: "\n\n\n\n\n\n£UKR_desctext_develop_domestic_bulava_for_tooltip\n\n\n\n\n\n\n\n\n§W§Y'Bulava'§! is a proposed future ATGM complex with fire-and-forget capabilities.\nIt will incorporate this long-awaited feature and is rumored to be more mobile and lethal.\nNow to absolutely non-connected news: it's a great honor for all our military to finally receive and test the god-like American §Y'Javelin'§! ATGM complex!\n------------------\nThis Decision's requirements are §Glowered§! because §Y[ROOT.GetFlag][ROOT.GetName]§! has researched the §Y$Anti_tank_3$§! technology.\n\nThis Decision is a §Rprerequisite§! for the §YObject 477A1 'Nota'§! modernization. If you §Rskip§! both §Y'Bulava'§! decisions, you will §Rlose§! the opportunity to complete it.§!"
 UKR_equipment_develop_domestic_bulava_atgm_without_tech: "Develop §Y'Bulava'§! next-gen ATGM"
 UKR_equipment_develop_domestic_bulava_atgm_without_tech_desc: "\n\n\n\n\n\n£UKR_desctext_develop_domestic_bulava_for_tooltip\n\n\n\n\n\n\n\n\n§W§Y'Bulava'§! is a proposed future ATGM complex with fire-and-forget capabilities.\nIt will incorporate this long-awaited feature and is rumored to be more mobile and lethal.\nNow to absolutely non-connected news: it's a great honor for all our military to finally receive and test the god-like American §Y'Javelin'§! ATGM complex!\n------------------\nThis Decision's requirements can be greatly §Glowered§! if §Y[ROOT.GetFlag][ROOT.GetName]§! has the §Y$Anti_tank_3$§! technology researched.\n\nThis Decision is a §Rprerequisite§! for the §YObject 477A1 'Nota'§! modernization. If you §Rskip§! both §Y'Bulava'§! decisions, you will §Rlose§! the opportunity to complete it.§!"
 UKR_equipment_develop_domestic_bulava_atgm_flag: "Completed decision §YDevelop 'Bulava' next-gen ATGM§!"
 UKR_equipment_develop_domestic_sokil_300: "Develop the §Y'Sokil-300'§! Strike Drone"
 UKR_equipment_develop_domestic_sokil_300_desc: "\n\n\n\n\n\n£UKR_desctext_develop_domestic_sokil_300_for_tooltip\n\n\n\n\n\n\n\n\n§WThe §Y'Sokil-300'§! is a §Y[ROOT.GetFlag]Ukrainian§! medium-altitude long-endurance strike drone developed by the §LLuch Design Bureau§!.\nIt carries the same §Y'Barrier-V'§! anti-tank guided missiles as our attack helicopters, and its reconnaissance equipment lets it find and strike targets far behind the front line.\n------------------\nThis Decision requires the completed §Y'Barrier'§! ATGM decision.§!"
 UKR_equipment_develop_domestic_kombat_konus_atgm: "Develop §Y'Kombat'§! and §Y'Konus'§! Tank-Fired ATGMs"
 UKR_equipment_develop_domestic_kombat_konus_atgm_desc: "\n\n\n\n\n\n£UKR_desctext_develop_domestic_kombat_konus_for_tooltip\n\n\n\n\n\n\n\n\n§WThe §Y'Kombat'§! is a §Y[ROOT.GetFlag]Ukrainian§! 125 mm anti-tank guided missile developed by the §LLuch Design Bureau§! to be fired through the main gun of the §YT-64§!, §YT-72§!, §YT-80§! and §YT-84§! tanks. The §Y'Konus'§! is its counterpart for 120 mm guns.\nBoth are second-generation laser beam-riding missiles that let our tanks hit armored targets far beyond the range of their shells.\n------------------\nThis Decision is a §Rprerequisite§! for every tank decision in which the tank fires guided missiles through its gun.§!"
 UKR_equipment_develop_domestic_kombat_konus_atgm_flag: "Completed decision §YDevelop 'Kombat' and 'Konus' Tank-Fired ATGMs§!"
 UKR_equipment_develop_domestic_kombat_konus_atgm_mission: "Last Chance for §Y'Kombat'§! and §Y'Konus'§!"
 UKR_equipment_develop_domestic_kombat_konus_atgm_mission_desc: "§WWe missed the planned start of the §Y'Kombat'§! and §Y'Konus'§! programme, so the §LLuch Design Bureau§! will finish the tank-fired missiles on its own schedule. When this mission ends, the work is done and its cost is taken from our treasury. Every tank decision that fires guided missiles through the gun needs these missiles.§!"
 ukraine_equipment_develop_domestic_atgm.13.name: "'Kombat' and 'Konus' ATGMs: Development Finished"
 ukraine_equipment_develop_domestic_atgm.13.desc: "The Luch Design Bureau has finished the 'Kombat' and 'Konus' tank-fired missiles. Our tank designers can now give their vehicles guns that fire guided missiles."
 ukraine_equipment_develop_domestic_atgm.13.a: "Hand them to the tank designers"
 UKR_equipment_develop_domestic_bm3_shturm: "Develop the §YBM-3 'Shturm'§! Combat Module"
 UKR_equipment_develop_domestic_bm3_shturm_desc: "\n\n\n\n\n\n£UKR_desctext_develop_domestic_bm3_shturm_for_tooltip\n\n\n\n\n\n\n\n\n§WThe §YBM-3 'Shturm'§! is a §Y[ROOT.GetFlag]Ukrainian§! combat module developed by the §LKharkiv Morozov Design Bureau§! for armored personnel carriers and infantry fighting vehicles.\nIt combines a 30 mm automatic cannon, a coaxial machine gun, an automatic grenade launcher and launchers for the §Y'Barrier'§! anti-tank guided missiles.\n------------------\nThis Decision is a §Rprerequisite§! for the §YBTR-3E1§! and §YBTR-4§! decisions.§!"
 UKR_equipment_develop_domestic_bm3_shturm_flag: "Completed decision §YDevelop the BM-3 'Shturm' Combat Module§!"
 UKR_equipment_develop_domestic_stuhna_p_vehicle: "Mount §YRK-2 'Stuhna-P'§! on a Vehicle Chassis"
 UKR_equipment_develop_domestic_stuhna_p_vehicle_desc: "\n\n\n\n\n\n£UKR_desctext_develop_domestic_stuhna_p_vehicle_for_tooltip\n\n\n\n\n\n\n\n\n§WThe §YRK-2 'Stuhna-P'§! launcher can be mounted on light armored vehicles and MRAPs, turning them into fast self-propelled anti-tank vehicles.\nThe crew fires the missiles under armor protection and leaves the firing position before the enemy can answer.\n------------------\nEvery researched chassis gets its own vehicle: §YDozor-B§! and §YKozak§! from §Y2005§!, §YNovator§! and §YKozak-2§! from §Y2015§!. The 2015 chassis are more reliable.§!"
 UKR_equipment_develop_domestic_stuhna_p_vehicle_chassis_tt: "Has researched a utility vehicle or MRAP chassis from §Y2005§! or §Y2015§!"
 UKR_equipment_export_skif_buyer_money_0_2_tt: "The buyer has at least £treasury §Y0.2§! billion to pay for the first batch"
