 RULE_NKO_NAM_RULES: "Kim Dzong Nam"
 RULE_NKO_NAM_RULES_DESC: "Kim Dzong-nam będzie kontrolował władzę i na zawsze zmieni Koreę na ścieżkę „Reform i otwarcia”."
 RULE_NKO_UN_RULES: "Kim Dzong Un"
 RULE_NKO_UN_RULES_DESC: "Jako wybrany następca Kim Dzong-ila Kim Dzong-un będzie nadal podążał ścieżką Dżucze, antyamerykanizmu, samodzielności i opresyjnych rządów."
 RULE_NKO_JUNTA_RULES: "Zamach stanu w Juncie"
