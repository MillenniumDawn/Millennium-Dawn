 ARM_mister_p: "[ARM_Pashik_misters_loc]"
 ARM_mister_p_desc: "우리는 양국 관계를 강화하고 우리가 그에게 반대하지 않는다는 점을 납득시키기 위해 러시아 대통령과 만나야 합니다."
 ARM_crackdown_on_corruption: "부패 척결"
 ARM_crackdown_on_corruption_desc: "\\"더 이상 뇌물도, 독점도 없으며, 인권은 보호받고 법치가 승리할 것이다!\\" - 아르메니아 의회가 그를 나라의 새 총리로 선출하기에 앞서 한 연설에서 시위 지도자 니콜 파시냔이 한 말."
 ARM_exit_problems: "문제로부터의 출구"
 ARM_exit_problems_desc: "우리의 새로운 의제는 모든 문제로부터의 출구입니다. 우리는 변화의 정당입니다!"
 ARM_educ_curicullum: "새 교육 과정"
 ARM_educ_curicullum_desc: "새로운 시대에는 교육이 바뀌어야 합니다. 모든 교육이 우리의 새로운 이념적 선호를 따르도록 해야 합니다."
 ARM_renew_view_hist: "아르메니아 역사관 쇄신"
 ARM_renew_view_hist_desc: "아르메니아 역사에 대한 관점은 우리 지도자의 구상에 따라 재편되어야 합니다. 세상은 관점으로 이루어져 있으며, 그것을 바꾸는 것이 우리의 의무입니다!"
 ARM_irrecons_contr: "화해할 수 없는 모순 해소"
 ARM_irrecons_contr_desc: "우리 헌법에는 자유주의와 민족주의 사이의 많은 모순이 존재합니다. 우리는 이를 해결하고 헌법을 개정해야 합니다."
 ARM_gather_loyalists: "충성파 결집"
 ARM_gather_loyalists_desc: "우리는 당내 모든 충성파를 모아 각 장관직에 앉혀야 합니다. 빌어먹을 테크노크라트들은 정치적으로 너무 불충하여 우리 행정 기구의 골칫거리가 될 수 있습니다."
 ARM_investig_clique: "파벌 조사"
 ARM_investig_clique_desc: "세르조롭 파벌을 조사하여 마침내 우리나라에서 탄압과 부패의 피를 씻어내야 합니다."
 ARM_change_gov_structure: "정부 구조 개편"
 ARM_change_gov_structure_desc: "우리의 정부 구조는 더 이상 효율적으로 일하는 방식에 부합하지 않습니다. 이를 바꾸어야 합니다."
 ARM_social_media_prop: "소셜 미디어 선전"
 ARM_social_media_prop_desc: "우리가 옳다고 국민을 설득하려면, 우리 지도자가 시민들의 정보 영역에 끊임없이 존재해야 합니다. 모든 아르메니아인이 국민과 가까운 위대한 민족 지도자를 읽고 보게 될 것입니다."
 ARM_hijack_nat_voters: "민족주의 유권자 가로채기"
 ARM_hijack_nat_voters_desc: "우리 총리에 대한 지지를 높이려면, 급진 우파를 포함한 대중에게 호소해야 합니다."
 ARM_era_of_peace: "평화 시대 의제"
 ARM_era_of_peace_desc: "우리의 새로운 교리는 전쟁이 아닌 평화입니다! 1915년과 90년대에 일어난 일을 잊어야 합니다. 우리는 이제 새로운 나라입니다."
 ARM_police_guard: "경찰 경비대"
 ARM_police_guard_desc: "우리는 경찰력에서 분리된 별도의 부대를 창설하고자 합니다. 경찰 경비대는 엄격히 민간 법 집행 기능의 범위 내에서만 활동하며 전투 작전에는 참여하지 않습니다."
 ARM_csto_dilemm: "CSTO에 대한 입장은?"
 ARM_csto_dilemm_desc: "우리는 CSTO에 대한 입장을 정해야 합니다. 탈퇴해야 하겠습니까, 아니면 유대를 강화해야 하겠습니까?"
 ARM_anti_belarus_rhetoric: "반벨라루스 수사"
 ARM_anti_belarus_rhetoric_desc: "벨라루스는 오랫동안 아제르바이잔의 잔학 행위를 지지해 왔습니다. 우리는 이를 다루어야 합니다!"
 ARM_NGO_friend: "NGO와의 친교"
 ARM_NGO_friend_desc: "우리의 새롭고 젊은 민주주의는 동맹이 필요합니다. NGO는 이 역할에 안성맞춤입니다!"
 ARM_you_are_that_one_man: "'그리고 당신이 바로 그 한 사람입니다'"
 ARM_you_are_that_one_man_desc: "니콜 파시냔은 서민의 사람입니다! 그는 시골 사람들이 무엇을 필요로 하는지 알며, 그들은 다시 모든 선거를 좌우합니다. 당신이 아르메니아의 운명을 결정하는 바로 그 한 사람입니다!"
 ARM_i_am_that_one_man: "'그리고 내가 바로 그 한 사람입니다'"
 ARM_i_am_that_one_man_desc: "니콜 파시냔은 선택받은 자입니다! 선거로만이 아니라 신으로부터도 선택받았습니다. 국민의 선택은 결국 우리 지도자 니콜을 권력에 앉히기 위해 도래한 우주적 힘의 배치를 반영합니다."
 ARM_armenia_pashik_idea: "파시냔의 아르메니아"
 ARM_loyalists_in_government: "정부 내 충성파"
 ARM_armenian_soc_media_prop_idea: "소셜 미디어 선전"
 ARM_pashinyan_anti_corrupt_idea: "반부패 정책"
 ARM_education_reforms: "교육 개혁"
 ARM_true_pashik_democracy: "코카서스의 민주주의 보루"
 ARM_controlled_democracy: "통제된 민주주의"
 ARM_new_era_of_peace_idea: "평화의 시대"
 ARM_support_of_ngo_idea: "NGO 지원"
 arm_pashinyan.1.t: "[ARM_Pashik_misters_loc]"
 arm_pashinyan.1.d: "[ARM.GetNameWithFlag] 정부는 자국의 자유주의 정부가 우리에게 위협이 되지 않는다고 주장하며 추가 협력에 동의합니다."
 arm_pashinyan.1.a: "좋다, 동의한다"
 arm_pashinyan.1.b: "아니요"
 arm_pashinyan.2.t: "[SOV.GetNameWithFlag], 우리를 신뢰"
 arm_pashinyan.2.d: "[FROM.GetNameWithFlag]이(가) 우리의 입장을 받아들였으며 또한 우리를 적으로 보지 않는다고 확인해 주었습니다."
 arm_pashinyan.2.a: "좋다"
 arm_pashinyan.3.t: "[SOV.GetNameWithFlag], 우리를 불신"
 arm_pashinyan.3.d: "[FROM.GetNameWithFlag]은(는) 우리의 외교 정책이 자신들에게 위협이며, 그들의 생각을 바꾸려는 우리의 시도는 [SOV.GetNameWithFlag]의 적들과의 협력을 위한 위장일 뿐이라고 밝혔습니다."
 arm_pashinyan.3.a: "나쁘다"
 arm_pashinyan.5.t: "우리를 향한 국민의 지지"
 arm_pashinyan.5.d: "2년 전 우리는 시민들의 삶을 개선하겠다고 약속했고 이를 성공적으로 이행했습니다. 이제 국민은 우리를 전폭적으로 지지합니다."
 arm_pashinyan.5.a: "좋다"
 arm_pashinyan.6.t: "그들이 우리의 약속을 기억한다고?"
 arm_pashinyan.6.d: "뜻밖에도 국민은 생활 수준을 개선하겠다는 우리의 말을 기억하고 있었습니다. 이제 우리가 할 일은 이 실패를 다른 이유로 정당화하는 것뿐입니다."
 arm_pashinyan.6.a: "너무 많은 돈을 쓰지 않고도 해낼 수 있다고 생각했는데..."
 arm_pashinyan.7.t: "헌법의 논란"
 arm_pashinyan.7.d: "우리 헌법에는 상충하는 조항이 여러 개 있어 이웃 국가들과 정상적인 외교 관계를 수립하는 것이 불가능합니다."
 arm_pashinyan.7.a: "알겠다"
 arm_pashinyan.8.t: "권력의 경쟁자들"
 arm_pashinyan.8.d: "세르지 사르그샨과 로베르트 코차랸은 권력에 복귀할 수 있으므로 우리 권력을 위협합니다. 그들의 권위를 약화시켜야 합니다."
 arm_pashinyan.8.a: "전면적인 조사를 실시한다"
 arm_pashinyan.8.b: "단순한 정치적 중상으로 충분하다"
 arm_pashinyan.9.t: "정치 체제의 문제"
 arm_pashinyan.9.d: "우리의 정치 강령이 대부분의 목표를 달성한 지금, 앞으로 어떻게 나아갈지 결정해야 합니다. 민주주의 원칙을 계속 고수할 수도 있고, 정치적 자유를 다소 제한할 수도 있습니다"
 arm_pashinyan.9.a: "주도권을 잃어서는 안 됩니다"
 arm_pashinyan.9.b: "우리는 국민에게 민주주의를 약속했으며, 그 약속을 지킬 것입니다"
 arm_pashinyan.10.t: "의회에서의 반벨라루스 연설"
 arm_pashinyan.10.d: "\\"나는 이제부터 다시는 벨라루스에 가지 않을 것임을 밝힙니다. 알렉산드르 루카셴코 대통령이 벨라루스에 있는 한 그렇습니다. 아울러 이제부터 아르메니아의 공식 대표는 단 한 명도 벨라루스에 가지 않을 것임을 선언합니다. 절대로\\""
 arm_pashinyan.10.a: "나는 감자가 싫다"
 arme.35.t: "CSTO 딜레마"
 arme.35.d: "CSTO는 우리나라에 아무런 도움이 되지 않는 것으로 드러났습니다. 명목상의 동맹국들은 우리 영토 보전을 끊임없이 침해하는 아제르바이잔인들에 맞선 우리를 돕기를 거부하고 있습니다. CSTO에서의 우리 지위를 어떻게 할지 결정해야 합니다."
 arme.35.a: "서류를 찢고 작별을 고하자!"
 arme.35.b: "회원 자격을 동결하는 편이 좋겠다."
 arme.36.t: "[ARM.GetNameWithFlag]의 CSTO 탈퇴!"
 arme.36.d: "최근 아르메니아 측은 CSTO를 탈퇴하고자 한다고 발표했으며, 현재 기구에서의 완전한 탈퇴를 위한 문서 작업을 진행하고 있습니다. 이는 이 지역에서의 우리 영향력에 큰 타격을 줄 것입니다."
 arme.36.a: "소시지처럼 굴러가라!"
 arme.37.t: "[ARM.GetNameWithFlag]의 CSTO 회원 자격 동결!"
 arme.37.d: "최근 아르메니아 측은 CSTO 회원 자격을 동결하고자 한다고 발표했으나, 기구에서의 완전한 탈퇴를 위한 문서 작업은 진행하지 않고 있습니다. 어쩌면 자국의 국내 정치를 겨냥한 정치적 결정일 수 있습니다."
 arme.37.a: "응?"
