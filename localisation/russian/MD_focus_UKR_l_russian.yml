 UKR_storage_item_spg9_tt: "§YСПГ-9§!\n\n\n£SOV_INF_SPG_9\n\n\n\nНа хранении: §Y[?ukraine_has_spg9_stockpile|0]§!\nПоколение: 73-мм безоткатное орудие, на вооружении с 1962 года.\nТип техники: §YПротивотанковые средства§!\n\nВарианты на хранении:\n• СПГ-9: §Y[?ukraine_has_spg9_stockpile|0]§!\n\nЛёгкое безоткатное орудие мотострелковых рот."
