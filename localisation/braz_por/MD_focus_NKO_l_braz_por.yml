 NKO_spa.56.t:0 "Cobertura de Radar para Pyongyang"
 NKO_spa.56.d:0 "O Batalhão de Construção propõe um complexo de radar para proteger Pyongyang e coordenar nossas defesas aéreas. Uma dotação de $7 bilhões concluirá imediatamente uma estação de radar de nível 4 na capital.\n\nEsta proposta é oferecida apenas uma vez. Se recusarmos, o batalhão continuará com seus outros deveres e não apresentará o projeto novamente."
 NKO_spa.56.a:0 "Destinar $7 bilhões e construir o complexo de radar."
 NKO_spa.56.b:0 "Recusar o projeto."
