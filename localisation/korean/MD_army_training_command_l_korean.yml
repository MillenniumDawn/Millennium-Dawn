 MD_artc_ex_dedicated_tt: "§Y전투 훈련 센터 순환 훈련§!\n\n£army_experience 육군 경험치: §R-450§!\n£command_power 지휘력: §R-75§!\n§H90§!일간 국가 정신 §Y전투 훈련 센터 순환 훈련§!을 획득합니다:\n £fuel_consumption_texticon  육군 연료 소비: §R+25%§!\n £attack_texticon  사단 공격: §G+2%§!\n£doctrine_mastery §H전담 교리§! 숙련도: 하루당 [MD_artc_exercise_mastery_tt_text], §H90§!일간\n\n§Y충격과 공포§!, §Y종심 방어§!, §Y전장 지원§! 또는 §Y게릴라전§! 대교리와 최소 §H10§!개 사단이 필요합니다."
 MD_artc_ex_training_tt: "§Y실사격 훈련 주기§!\n\n£army_experience 육군 경험치: §R-450§!\n£command_power 지휘력: §R-75§!\n§H90§!일간 국가 정신 §Y실사격 훈련 주기§!를 획득합니다:\n £fuel_consumption_texticon  육군 연료 소비: §R+25%§!\n £training_speed_texticon  사단 훈련 시간: §G-5%§!\n£doctrine_mastery §H훈련§! 숙련도: 하루당 [MD_artc_exercise_mastery_tt_text], §H90§!일간\n\n§Y연합 병과§!, §Y충격과 공포§!, §Y종심 방어§!, §Y임무형 지휘§! 또는 §Y전장 지원§! 대교리와 최소 §H10§!개 사단이 필요합니다."
 MD_artc_ex_leadership_tt: "§Y지휘소 훈련§!\n\n£army_experience 육군 경험치: §R-450§!\n£command_power 지휘력: §R-75§!\n§H90§!일간 국가 정신 §Y지휘소 훈련§!을 획득합니다:\n £fuel_consumption_texticon  육군 연료 소비: §R+25%§!\n £planning_speed_texticon  계획 속도: §G+5%§!\n£doctrine_mastery §H리더십§! 숙련도: 하루당 [MD_artc_exercise_mastery_tt_text], §H90§!일간\n\n지상 대교리와 최소 §H10§!개 사단이 필요합니다."
 MD_artc_ex_technology_tt: "§Y실험 부대 시험§!\n\n£army_experience 육군 경험치: §R-450§!\n£command_power 지휘력: §R-75§!\n§H90§!일간 국가 정신 §Y실험 부대 시험§!을 획득합니다:\n £fuel_consumption_texticon  육군 연료 소비: §R+25%§!\n £breakthrough_texticon  돌파: §G+2%§!\n£doctrine_mastery §H기술§! 숙련도: 하루당 [MD_artc_exercise_mastery_tt_text], §H90§!일간\n\n지상 대교리와 최소 §H10§!개 사단이 필요합니다."
 MD_artc_ex_structure_tt: "§Y부대 전비 태세 훈련§!\n\n£army_experience 육군 경험치: §R-450§!\n£command_power 지휘력: §R-75§!\n§H90§!일간 국가 정신 §Y부대 전비 태세 훈련§!을 획득합니다:\n £fuel_consumption_texticon  육군 연료 소비: §R+25%§!\n £army_morale_texticon  사단 회복률: §G+3%§!\n£doctrine_mastery §H구조§! 숙련도: 하루당 [MD_artc_exercise_mastery_tt_text], §H90§!일간\n\n지상 대교리와 최소 §H10§!개 사단이 필요합니다."
 MD_artc_academy_tt_1: "£army_experience 육군 경험치: §R-550§!\n육군사관학교 정신 슬롯에 §Y전투 훈련 센터 I§!을 해금합니다:\n £doctrine_mastery 지상 교리 숙련도 획득: §G+5%§!\n £training_speed_texticon  사단 훈련 시간: §G-5%§!\n육군 훈련 £doctrine_mastery 하루당 §H숙련도§!가 §Y0.5§!에서 §G0.75§!로 상승합니다"
 MD_artc_academy_tt_2: "£army_experience 육군 경험치: §R-650§!\n육군사관학교 정신 슬롯에 §Y전투 훈련 센터 II§!를 해금합니다:\n장착 중인 경우 §Y전투 훈련 센터 I§!을 대체합니다.\n £doctrine_mastery 지상 교리 숙련도 획득: §G+10%§!\n £training_speed_texticon  사단 훈련 시간: §G-10%§!\n육군 훈련 £doctrine_mastery 하루당 §H숙련도§!가 §Y0.75§!에서 §G1.0§!으로 상승합니다"
