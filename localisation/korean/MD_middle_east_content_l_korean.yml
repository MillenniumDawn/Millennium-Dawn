 GCC_blockade: "§RInitiate Blockade§! Against §Y[FROM.GetFlag][FROM.GetNameDef]§!"
 GCC_blockade_desc: "[FROM.GetAdjective]는 너무 오랫동안 독자적인 외교 정책을 펼치며 우리의 국익과 GCC의 단결을 훼손해 왔습니다. 경제적 압력을 가해 그들의 일탈 행위를 종식시켜야 합니다."
 GCC_drop_the_blockade: "§GDrop the Blockade§! Against §Y[FROM.GetFlag][FROM.GetNameDef]§!"
 GCC_drop_the_blockade_desc: "§Y[FROM.GetFlag][FROM.GetNameDef]§! 정부가 당분간 우리의 압박에 굴복할 가능성은 낮습니다. 관계를 회복하기 위해 봉쇄를 끝내는 것이 최선일 수 있습니다."
 GCC_accept_blockade_demands: "§GAccept the Demands§! of the Blockaders"
 GCC_accept_blockade_demands_desc: "봉쇄국 측이 조만간 봉쇄를 완화할 것 같지는 않습니다. 우리 국민의 고통을 끝내기 위해 그들의 요구를 수용하는 방안을 고려해야 할지도 모릅니다."
 GCC_support_gcc_membership: "§GSupport§! §Y[FROM.GetFlag][FROM.GetAdjective]§! Membership of the GCC"
 GCC_support_gcc_membership_desc: "[FROM.GetNameDef]의 GCC 가입은 우리에게 이익이 될 수 있습니다. 하지만 새로운 회원국을 받아들일 때 발생할 수 있는 파장을 신중하게 고려해야 합니다. 가입하려는 국가의 정치·경제적 상황이 기존 GCC 회원국들과 다를수록, 그 국가의 가입은 GCC의 단결에 더 큰 해를 끼칠 수 있습니다."
 GCC_pressure_countries_to_support: "[FROM.GetAdjective]의 가입을 지지하도록 §G각국 압박§!"
 GCC_pressure_countries_to_support_desc: "우리가 다른 GCC 회원국에 미치는 영향력이 클수록, 그들은 [FROM.GetNameDef]의 GCC 회원국 가입 후보 자격을 지지하도록 우리에게 압력을 가할 가능성이 더 커질 것입니다."
 GCC_show_supporters: "우리의 가입을 지지하는 §Y국가 표시§!"
 GCC_show_supporters_desc: "GCC에 가입하면 GCC 회원국으로서 누릴 수 있는 정치적, 경제적 이점을 활용할 수 있게 됩니다. 기존 GCC 회원국들이 우리의 가입 신청을 지지할 가능성은 우리의 안정성, 정부 형태, 외교 정책, 그리고 주요 종교가 기존 GCC 회원국들의 그것과 얼마나 유사한지 등 여러 요인에 달려 있습니다."
 GCC_begin_accession_process: "GCC 가입 절차 §G개시§!"
 GCC_begin_accession_process_desc: "GCC는 만장일치로 결정되기 때문에, GCC 가입 절차를 공식적으로 시작하고 허가를 받으려면 기존 GCC 회원국 모두의 지지를 확보해야 합니다."
 GCC_complete_accession_plan: "GCC 가입 계획 §G완료§!"
 GCC_complete_accession_plan_desc: "우리는 기존 GCC 회원국 모두의 지지를 확보했지만, GCC 정회원국이 되는 목표는 아직 달성하지 못했습니다. 회원국 자격을 얻기 위해서는 먼저 우리나라가 GCC 요건에 부합하도록 일련의 정치적, 경제적 변화를 완료해야 합니다."
 every_gcc_member_supports_tt: "모든 걸프협력회의 국가들이 우리의 회원 자격을 지지합니다"
 GCC_support_gcc_membership_tt: "모든 GCC 회원국이 [FROM.GetAdjective] 멤버십을 지원하는 경우 [FROM.GetNameDef]에서 가입 절차를 시작할 수 있습니다.\n§R[FROM.GetNameDef]가 회원국이 되면 GCC Unity는 [FROM.GetNameDef]의 정치적 상황에 따라 25%, 20%, 10% 또는 5% 감소합니다.§!"
 GCC_support_gcc_membership1_tt: "만약, 모든 걸프 협력 회의 (GCC) 회원국이 지지한다면, [pressured_to_accept](은)는 가입 절차를 시작할 수 있을 것입니다.\n§R만약 [pressured_to_accept](이)가 회원국이 된다면, 걸프 협력 회의 (GCC) 단결성은 [pressured_to_accept]의 정치적 상황에 따라 25, 20, 10, 또는 5% 단위로 감소할 것입니다.§!"
 not_pro_monarchy_tt: "집권당은 군주제를 지지하지 않습니다."
 gcc_focus_completed_tt: "GCC 주도 회원국이 완료함"
 subversive_activities: "전복 공작"
 subversive_activities_desc: "공개적인 충돌이 국익 추구를 위한 방안으로 점점 실효성을 잃어 가는 시대에, 우리는 영향력을 투사하고 적을 약화시키기 위해 더욱 은밀한 수단에 의존해야 합니다."
 send_support_to_the_syrian_opposition: "시리아 반정부 세력에 소형 화기 지원"
 send_support_to_the_syrian_opposition_desc: "아사드에 맞서는 혁명 세력은 투쟁에서 우리의 지원으로 분명 도움을 얻을 것입니다."
 send_support_to_hamas: "하마스에 소형 화기 지원"
 send_support_to_hamas_desc: "팔레스타인 무슬림 형제단에서 갈라져 나온 급진 분파로 등장한 하마스는 이후 팔레스타인 국가 수립을 추진하는 가장 활동적인 단체 중 하나가 되었습니다. 오슬로 협정의 실패로 보다 기성 세력인 파타가 정당성과 온건성을 잃은 만큼, 하마스는 팔레스타인 정치에서 가장 효과적이고 급진적인 반이스라엘 세력입니다."
 send_support_to_hezbollah: "헤즈볼라에 소형 화기 지원"
 send_support_to_hezbollah_desc: "이란이 지원하는 무장 조직 헤즈볼라는 IDF를 상대로 어느 정도 성과를 거둔 몇 안 되는 주체 중 하나입니다. 이는 이스라엘 국가를 약화시키는 강력한 수단일 뿐 아니라, 레바논 정치에서 시아파 종파주의의 입지를 키우는 효과적인 방법이기도 합니다."
 send_support_to_pro_government_forces: "시리아 민병대에 소형 화기 지원"
 send_support_to_pro_government_forces_desc: "시리아 아랍군은 세속적인 조직이지만, 이란이 결성을 도운 여러 시아파 민병대는 보다 노골적인 종파적 의제를 갖고 있습니다. 이 민병대를 지원하면 역사적으로 세속 공화국이었던 이 나라에서 시아파의 대의에 도움이 될 것입니다."
 send_support_to_pmu: "인민동원군에 소형 화기 지원"
 send_support_to_pmu_desc: "알카에다 같은 극단주의 수니파 세력으로부터 이라크의 시아파를 지키기 위해 생겨난 시아파 민병대는 이란 이슬람 공화국으로부터 상당한 지원을 받아 왔습니다. 이들을 지원하면 이라크 정치에 대한 이란, 나아가 시아파의 장악력을 높이는 데 도움이 될 것입니다."
 send_support_to_arabs: "아랍계 반군에 소형 화기 지원"
 send_support_to_arabs_desc: "수년간 아흐와즈 해방을 위한 아랍 투쟁 운동은 이란 이슬람 공화국에 맞서 게릴라전을 벌여 왔습니다. 이 아랍인들 대다수가 시아파임에도 불구하고, 페르시아인이 장악한 이슬람 공화국 체제라는 공동의 적을 상대한다는 점에서 우리는 이들과 이해를 같이합니다."
 send_support_to_balochis: "발루치계 반군에 소형 화기 지원"
 send_support_to_balochis_desc: "이란의 시스탄 발루치스탄주에 있는 살라피 운동 세력은 시아파 페르시아 정권의 자국민 탄압에 맞서 수년간 싸워 왔습니다. 머지않아 이들이 은혜를 갚을 기회가 올 것이므로 그들의 대의를 지원해야 합니다."
 send_support_to_gna: "리비아 국민통합정부에 무기 지원"
 send_support_to_gna_desc: "리비아 임시 정부는 국제적으로 승인된 합법적인 리비아 정부입니다. 그럼에도 불구하고, 반항적인 반군들이 강력한 반 이슬람 국가의 지원 아래 군사적으로 권력에 지속적으로 도전하고 있습니다. 반면 리비아 임시정부는 대부분의 국제 사회에서 버려진 상태입니다. 우리는 이러한 불균형을 바로잡을 수 있도록 리비아에서 사용할 수 있는 우리의 상당한 자원을 지원해주어야 합니다."
 send_support_to_gnc: "[GNC.GetNameDef]에 무기 지원"
 send_support_to_gnc_desc: "[GNC.GetNameDef]은(는) 리비아 국민의 정당한 대표이며, 따라서 잔혹하고 권위주의적인 적들에 맞서 우리의 전적인 지지를 받아야 합니다."
 send_support_to_hor: "리비아 국민군에 무기 지원"
 send_support_to_hor_desc: "혼란스러운 전장이 된 리비아는 무슬림 형제단이라는 독과 연계된 이슬람주의 세력의 온상이 되었습니다. 전쟁으로 피폐해진 이 실패 국가에 안정과 안보를 가져올 수 있는 유일한 세력을 전폭적으로 지지해야 합니다."
