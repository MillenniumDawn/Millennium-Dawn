l_spanish:
 SRA_idea_isolationist_focused_foreign_office: "Dominio contra la política exterior"
 SRA_idea_isolationist_focused_foreign_office_desc: "Con el estado de nuestra nación y su repentino y volátil \"nacimiento\", muchos dentro del gobierno, así como el público en general, ni siquiera consideran una política exterior, y mucho menos cuál debería ser. Por ahora, el Ministerio de Relaciones Exteriores es visto más como un sustituto para ayudar a fortalecer el gobierno que como un nombramiento real."
 SRA_idea_neighborhood_foreign_policy: "Programa limitado de política exterior"
 SRA_idea_neighborhood_foreign_policy_desc: "A través del desarrollo de nuestra justa nación, así como del cambio en la percepción pública de nuestra gran nación del Sur. Ahora buscaremos abrir nuestros ojos más allá de nuestras fronteras, porque podemos hacer amigos y sabemos con certeza que tendremos enemigos. Pero por ahora buscamos comprender qué hay más allá de nuestras fronteras en lugar de qué hay más allá de nuestro lado del mundo."
 SRA_idea_historical_tensions: "Tensiones históricas"
 SRA_idea_historical_tensions_desc: "Los Estados Confederados y la historia del sur en su conjunto están sumidos en la esclavitud, Jim Crow, la segregación y Dios sabe qué más. Independientemente de este pasado turbulento y sangriento, debemos buscar una manera de deshacernos del espectro del pasado y tratar de mejorar no sólo nuestra imagen sino también las vidas de todos los ciudadanos del Sur."
 Southern_Republic_of_America_focus: "Árbol de Enfoque de la República del Sur de América"
 CSA_focus_creating_a_federal_government: "Creación de un Gobierno Federal"
 CSA_focus_creating_a_federal_government_desc: "La sociedad se ha desmoronado ante nuestros propios ojos. Debemos buscar la creación de algún tipo de gobierno central si queremos organizarnos y llegar a alguna parte en términos de paz o estabilidad."
 CSA_focus_bayou_battle: "La batalla del Bayou"
 CSA_focus_bayou_battle_desc: "El estado de Luisiana tiene una economía fuerte, además de ser un centro de comercio masivo con su costa del golfo. No obstante, debemos reconstruir este estado para que vuelva a gozar de estabilidad si queremos restablecer los servicios civiles."
 CSA_focus_cajun_cookin: "Cocina Cajun"
 CSA_focus_cajun_cookin_desc: "With economic semblance now restored we can look to reintroducing civil services and order to the state. This is but a stepping stone to the road to unity. For it is this unity that will solidify our future."
 CSA_focus_mississippi_mayhem: "El caos del Mississippi"
 CSA_focus_mississippi_mayhem_desc: "El río Misisipi es un centro estratégico y económico vital para el comercio y la defensa. Debemos devolver las capacidades económicas al estado si queremos revitalizar cosas como el río y las urbanizaciones de la costa del golfo."
 CSA_focus_magnolia_miracle: "Milagro de Magnolia"
 CSA_focus_magnolia_miracle_desc: "La economía del estado se está normalizando y las cosas empiezan a calmarse. Ha llegado el momento de reintroducir servicios civiles como bomberos, servicios de emergencias y fuerzas del orden. Pronto el estado estará de vuelta con su familia sureña."
 CSA_focus_the_rotten_peach: "Melocotón podrido"
 CSA_focus_the_rotten_peach_desc: "Cuando los Grandes Disturbios de la unión se abatieron sobre Georgia, hirvieron y asolaron el estado. Atlanta era una zona de guerra por derecho propio, con saqueos masivos, violencia de bandas y Dios sabe qué más. Ahora, cuando el polvo se asiente, debemos hacer algún tipo de reconstrucción si queremos llegar a alguna parte en términos de estabilidad para el estado."
 CSA_focus_the_fruitful_venture: "La empresa fructífera"
 CSA_focus_the_fruitful_venture_desc: "Con las inversiones en la reconstrucción del estado de Georgia, ahora podemos dedicarnos a restablecer la cohesión administrativa y los servicios civiles para restablecer plenamente la ley y el orden en el estado."
 CSA_focus_a_carolina_reaping: "Una cosecha en Carolina"
 CSA_focus_a_carolina_reaping_desc: "La economía de Carolina del Sur no era demasiado para empezar, sin embargo con el estado absoluto de todo debemos invertir para traer de vuelta la cohesión y una idea de una sociedad funcional. Esto también ayudaría a conseguir el comercio con otros estados, así como los puertos costeros operativos."
 CSA_focus_sweet_caroline: "Sweeeet Caroline"
 CSA_focus_sweet_caroline_desc: "Bum, bum, buum. El Estado tiene ahora tan buen aspecto que podremos reactivar los servicios civiles y los medios administrativos que queden. Aunque es probable que queramos invertir en cosas nuevas para mantener el orden."
 CSA_focus_alabama_abyss: "Abismo de Alabama"
 CSA_focus_alabama_abyss_desc: "El estado de Alabama, la única competencia real en violencia étnica junto al propio Mississippi. Este estado ha visto días mejores y tendremos que devolverle algo si queremos asegurarnos un control real sobre él. Empezaremos organizando la actividad económica a lo largo de la costa del golfo y estableciendo algún tipo de red eléctrica."
 CSA_focus_rose_of_alabamy: "La rosa de Alabama"
 CSA_focus_rose_of_alabamy_desc: "Del valle del Mississippi hemos convertido ahora Alabama en una nueva rosa en flor. Con esto trataremos de introducir los servicios civiles y la aplicación de la ley para asegurar la paz y la estabilidad del estado dentro de nuestra justa nación."
 CSA_focus_florida_flounder: "La platija de Florida"
 CSA_focus_florida_flounder_desc: "The sandbar that is the state of Florida is a mess in its own right even before the fall of the union. A massive tourist and vacationing spot now turned into a shell of its former self. It is this knowledge we must use to better plan and better future proof economic and city planning so we avoid the hot spot attraction it had and will likely return to once we ensure the stability of our nation."
 CSA_focus_the_sun_shines_once_more: "El sol vuelve a brillar"
 CSA_focus_the_sun_shines_once_more_desc: "La actividad económica es ahora nominal, se han podido reintroducir ciertas cosas como el agua y la electricidad. Ahora es el momento de hacer que el sol vuelva a brillar en esta playa de arena y de organizar los servicios civiles y los asuntos administrativos para garantizar la plena reintroducción de este Estado en la familia del Sur."
 CSA_focus_raleigh_rumble: "El Rumor de Raleigh"
 CSA_focus_raleigh_rumble_desc: "Preparémonos para negociar en el estado hermano de Carolina del Norte. La creación de infraestructuras de agua y electricidad, así como de algún tipo de economía, nos permitirá devolver la paz al estado."
 CSA_focus_sisters_united_once_more: "Hermanas unidas una vez más"
 CSA_focus_sisters_united_once_more_desc: "Ahora que las cosas empiezan a estabilizarse en Carolina del Norte, podemos intentar que la ley y el orden vuelvan al estado y allanar el camino para que esta hermana perdida se reúna con su estado hermano del sur. Así como unirnos a esta alegre reunión de nuestra familia sureña."
 CSA_focus_tennessee_tumble: "El vuelco de Tennessee"
 CSA_focus_tennessee_tumble_desc: "El valle de Tennessee, un estado grande y tranquilo. Hogar de la cultura musical sureña, así como frontera entre el verdadero sur y la zona intermedia de los Apalaches antes que los yanquis y los del medio oeste del norte. Debemos utilizar las vías fluviales para ayudar a reintroducir los esfuerzos de construcción y los medios para reanudar algún tipo de estabilidad en el estado."
 CSA_focus_nashville_renewal: "La renovación de Nashville"
 CSA_focus_nashville_renewal_desc: "Cuando los servicios y la estabilidad empiecen a volver al Estado, intentaremos consolidarlos reconstruyendo unos servicios civiles cohesionados y medios para administrar adecuadamente el Estado dentro del resto de la república."
 CSA_focus_arkansee_saw: "Arkansee-Saw"
 CSA_focus_arkansee_saw_desc: "The strange balance of the state of Arkansas is one which does kind of baffle even our administration. But during the great riots, most of the economy was concentrated in places like Little Rock and Fayetteville, etc. But aside from this not much in the state did honestly change and so we've only to rebuild these hubs and help out those who need water and food until we can restore proper order to the region."
 CSA_focus_fort_smith_fantasy: "La fantasía de Fort Smith"
 CSA_focus_fort_smith_fantasy_desc: "Con la reactivación del Estado y las inversiones iniciales que empiezan a dar sus frutos, la administración y el orden social pueden empezar a afianzarse en la región. La aplicación de la ley y otros servicios civiles ayudarán a allanar el camino hacia la estabilidad social."
 CSA_focus_tulsa_troubles: "Problemas en Tulsa"
 CSA_focus_tulsa_troubles_desc: "El estado de Oklahoma es un estado eminentemente agrario con sólo pequeños núcleos de poder industrial. Tenemos que reparar, reconstruir y asegurar una economía diversificada antes de pensar en asegurar cualquier otro desarrollo. De este modo no crearemos una división en el estado como la que nos causó en su día el gobierno federal de la vieja unión."
 CSA_focus_red_river_revival: "El renacimiento del río Rojo"
 CSA_focus_red_river_revival_desc: "Con el retorno de la cohesión social y la obtención de resultados reales de las inversiones, podemos empezar a reintegrar Oklahoma en la familia del Sur. Más como un primo, pero les seguimos queriendo igual, porque la familia sigue siendo la familia."
 CSA_focus_we_fought_all_the_way: "Luchamos hasta el final"
 CSA_focus_we_fought_all_the_way_desc: "Hemos recorrido un largo camino de recuperación, pero por fin lo hemos conseguido. La Familia del Sur vuelve a estar completa y ahora podemos mirar hacia nuevos horizontes en lo que respecta a nuestra economía y nuestra política."
 CSA_focus_the_political_circus: "El circo político"
 CSA_focus_the_political_circus_desc: "The state of politics in the modern age is but a circus in its own right. Nevertheless we must look to quell extremists, prop up stability and serious political movements as well as ensure we move forward and not backwards. It'll be a struggle in its own right, but it can't get any worse....right?"
 CSA_focus_the_center_mass_of_politics: "La masa central de la política"
 CSA_focus_the_center_mass_of_politics_desc: "The political center is the most stabilizing force which we have in our political realm of understanding. Not entirely being \"go-getters\" per se these parties however are a safer bet to stabilizing and building up our nation for the world stage than the extremes and fringes of the window framework that is our Overton window. Regardless we still have a choice and we must make that choice sooner than later."
 CSA_focus_the_overton_window_shatters: "La ventana de Overton se rompe"
 CSA_focus_the_overton_window_shatters_desc: "Through political lobbying as well as fear tactics and so forth, the results have led to a rise in support for more extreme and fringe parties over the political center of the nation. Our only hope is that these new waves don't destroy what little we have left of a nation."
 CSA_focus_ddp_secures_victory: "El DDP asegura la victoria"
 CSA_focus_ddp_secures_victory_desc: "In a surprising turn of events the DDP or Dixie & Delta Party has turned their obscurities into an actual political victory. Some praise this as a step forward in things like industrialization and public transport. But others fear that the party is merely a facade to more oligarchic means. Regardless they have won and only time will tell if they are a force of good or bad."
 CSA_focus_administrative_overhaul_plan: "Plan de reforma administrativa"
 CSA_focus_administrative_overhaul_plan_desc: "El estado absoluto de la administración ha dado lugar, entre otras cosas, a una corrupción rampante, sobornos más allá de los medios presupuestarios y una burocracia disfuncional en el mejor de los casos. Debemos abordar este problema de frente si queremos llegar a algún lugar pronto con nuestros planes y aspiraciones."
 CSA_focus_comprehensive_healthcare_restructuring: "Plan de reestructuración de la salud"
 CSA_focus_comprehensive_healthcare_restructuring_desc: "The CHR is a clean slate plan to start from the beginning and pre-emptively go after issues which arise as a national healthcare or even just a healthcare system of scale start to expand past a reasonable administrative point. Through redistricting and balancing of funding through regional, state and local administrative districts we help to decentralize and ensure the funding is better managed through locals who understand better. This will allow for direct and immediate needs of the facilities under their supervision to obtain their requests at a faster rate due to the more hands on understanding of this administrative level system. Consequently an oversight commission independent of the network will do periodical checks for corruption and ensure things like the budgets are going to where they are listed as going towards to prevent the infamous \"missing middle man\" that can happen in such an extensive network."
 CSA_focus_welfare_is_healthcare_plan: "El bienestar es el plan de salud"
 CSA_focus_welfare_is_healthcare_plan_desc: "The modern welfare state is in its own right a healthcare plan for the extremes of the populations in terms of age. Food stamps for those unable to acquire a job that fits the economic standard of living, social security for those who have dedicated their life to the economic growth of our nation and child care and assistance programs to help families who wish to grow and contribute new lives to our nation and its survival. It is therefore better to create a parallel plan similar to the Healthcare Restructuring plan as a way to limit national government need in the administration efforts. As well as with a similar oversight commission it will allow us to fine tune regulations and expansions related to said programs to get to who they need rather than who can abuse the system the best."
 CSA_focus_economic_opportunities_commission: "Comisión de Oportunidades Económicas"
 CSA_focus_economic_opportunities_commission_desc: "The EOC is a dedicated body which works with state governments in ensuring jobs which are available are shown and given the exposure to the public through job fairs and postings. The biggest issue anyone has is finding a job, getting one isn't that hard, but finding one is another story. Some may not know just what is open to them in their own neighborhood or county. That's where the EOC steps in and makes those unknowns into known."
 CSA_focus_revenue_revitalization_plan: "El Plan de Revitalización de Ingresos"
 CSA_focus_revenue_revitalization_plan_desc: "El RRP es un plan en tres etapas para revisar, agilizar y fomentar la mejora y el pensamiento futuro de los flujos de ingresos de nuestra nación. La fase inicial es despejar y rehacer lo básico del código tributario."
 CSA_focus_modern_monetary_education: "Educación Monetaria Moderna"
 CSA_focus_modern_monetary_education_desc: "The MME plan is a revamping of the education curriculum to include and make essential the understanding as well as abilities to manage and properly comprehend spending and means of obtaining currency in a modern economy. This monetary focused education helps to pre-emptively teach and make ready new generations to be a part of the greater national economy in what way they can with the knowledge they need."
 CSA_focus_railroad_mania: "Manía Ferroviaria"
 CSA_focus_railroad_mania_desc: "El mundo moderno necesita un flujo y bienes a granel. Granos para alimentos, arena para concreto y construcción, la lista continúa. Lo que necesitamos para maximizar nuestro potencial, así como nuestra huella no solo en nuestra propia economía, sino también en la global, es crear una red ferroviaria integral. Una que no solo sirva para conectar la nación socialmente, sino también económicamente para garantizar nuestras capacidades nacionales, así como nuestra cohesión en exportación e importación extranjera."
 CSA_focus_decentralization_initiative: "Iniciativa de Descentralización"
 CSA_focus_decentralization_initiative_desc: "The national government only needs to acquire funding for its direct expenses. Things like the healthcare and social networks which are organized and created via the national government. However one approach to this sort of more top down thinking is to allow the dissemination of tax collection on the state level. This means that state officials can more flexibly adapt local taxes to suit the needs of their constituents and we can better keep in check the national spending and how we proceed on expansion of programs as well as planning out their futures."
 CSA_focus_strategic_power: "Poder Estratégico"
 CSA_focus_strategic_power_desc: "Nuestra red eléctrica nacional permitirá que los planes se ejecuten de manera más rápida y eficiente que las redes tradicionales. Al incorporar la construcción de plantas de energía junto a proyectos ferroviarios, esto, a su vez, permitirá el transporte a granel y la producción eficiente de electricidad que luego se podrá difundir a través de nuestra nación y sus tierras en desarrollo."
 CSA_focus_investments_across_dixie: "Inversiones a través de Dixie"
 CSA_focus_investments_across_dixie_desc: "Si siquiera pensamos en tener una vasta y superior red ferroviaria, entonces debemos tener una economía que la respalde. Por lo tanto, invertiremos en todo Dixie en una serie de planes de inversión para garantizar la vitalidad de nuestra gran nación."
 CSA_focus_civilian_industrial_expansions: "Expansiones Industriales Civiles"
 CSA_focus_civilian_industrial_expansions_desc: "The CIE is a series of investment plans to build up the manufacturing and general industrial base of our consumer and civilian sectors. The hope is to ensure a strong baseline to support not only our railroad plans but also create the real economic activities which creates an honest standard of living."
 CSA_focus_tech_and_service_diversification: "Diversificación en Tecnología y Servicios"
 CSA_focus_tech_and_service_diversification_desc: "En el mundo moderno, cosas como los servicios y las innovaciones en tecnología son la realidad que debemos entender. Como tal, debemos impulsar una serie de planes de inversión para crear este tipo de industrias si vamos a ser algo en los mercados globales más amplios."
 CSA_focus_defense_and_export_scheme: "Plan de Defensa y Exportación"
 CSA_focus_defense_and_export_scheme_desc: "El D&ES es una serie de proyectos civiles y militares relacionados con las industrias de armas y navales. Este plan general tiene como objetivo no solo establecer lo doméstico, sino también darnos un ingreso adicional mediante la exportación de equipos producidos a aquellos que puedan necesitarlos. Parece que no faltan conflictos hoy en día, eso es seguro."
 CSA_focus_mississippi_central_expansions: "Expansiones del Centro de Mississippi"
 CSA_focus_mississippi_central_expansions_desc: "The MCR is the principal railway company which connects the western half of our great nation. This fair railroad is in need of new business and as such we will not only invest in the railroad itself to expand, but we will invest in the businesses for which they will be servicing as well."
 CSA_focus_southern_railway_expansions: "Expansiones del Ferrocarril del Sur"
 CSA_focus_southern_railway_expansions_desc: "El Sur, de hecho, sirve al sur y, como tal, debemos asegurarnos de que sirva a la mayor parte del sur posible. Por lo tanto, concederemos subvenciones de expansión para su infraestructura, así como para las economías locales, lo que resultará en beneficios generales para nuestra economía nacional y nuestra red ferroviaria en crecimiento."
 CSA_focus_department_for_transport_innovation: "Departamento de Innovación en Transporte"
 CSA_focus_department_for_transport_innovation_desc: "El DTI es un departamento dedicado a la investigación y desarrollo de todo lo relacionado con el transporte. Una economía moderna requiere medios de transporte modernos y, como tal, debemos comprender, utilizar y conectar no solo nuestra economía, sino nuestra nación en su conjunto. Porque realmente puede ser un mundo pequeño a través de la innovación y los desarrollos."
 CSA_focus_transportation_history_is_still_history: "La historia del transporte sigue siendo historia"
 CSA_focus_transportation_history_is_still_history_desc: "La historia del transporte en sí define el desarrollo y la innovación de nuestra especie, bueno, eso y la guerra, pero divago. Independientemente, debemos asegurarnos de que cuando se enseñe historia, nuestras futuras generaciones comprendan que el transporte es una parte clave de nuestras vidas y que no es algo simple de olvidar. Claro, puede ser un uso rutinario, pero tener ese uso en primer lugar es entender por qué lo necesitábamos o queríamos en primer lugar."
 CSA_focus_a_true_balance_of_power: "Un verdadero equilibrio de poder"
 CSA_focus_a_true_balance_of_power_desc: "Nuestras necesidades energéticas superan con creces nuestras ambiciones y debemos asegurar una acción rápida. Por lo tanto, un acto masivo de equilibrio de inversiones nucleares nacionales asegurará nuestras demandas energéticas más allá de nuestros sueños más salvajes."
 CSA_focus_breaking_the_chains: "Rompiendo las cadenas"
 CSA_focus_breaking_the_chains_desc: "The history of our nation, both now, future and long ago is a fragile, bloody and shameful one in terms of modern standards. But with our connectiveness programs, our economic investments and in general our way of making a true Southern nation. We have shown that those old ways mean nothing more than lessons which to learn from. For every soul which is a part of our fair southern lands is a Southern soul and they shall be treated, cared for and respected as such. Break the chains of the past and set forth to a future united as one Southern Family."
 CSA_focus_the_old_ways_coalition: "La Coalición de las Viejas Formas"
 CSA_focus_the_old_ways_coalition_desc: "The OWC or Old Ways Coalition has secured a general victory and it is now up to the big three of the coalition to help build and secure the future of the nation. The SCP, WPD and PDP will attempt to work together to form policies as well as handle the economic and foreign policy situation that our young nation will be facing."
 CSA_focus_the_SCP_programs: "Los programas del SCP"
 CSA_focus_the_SCP_programs_desc: "Los conservadores sureños han salido a la cabeza de la coalición. Buscarán implementar sus programas para tratar de asegurar su lugar político, así como quitarle el viento a las facciones socialistas. El WPD y el PDP intentarán moderar cualquier exceso, pero en general la estabilidad política es la prioridad."
 CSA_focus_servicing_defense_needs: "Atendiendo las necesidades de defensa"
 CSA_focus_servicing_defense_needs_desc: "La DII o Iniciativa de la Industria de Defensa es una necesidad para prepararnos en caso de futuros actos extranjeros contra nosotros. No es mucho, pero esto debería remediar cosas como la capacitación y la escasez de suministros. Esperemos que no necesitemos usar esto, pero al menos podemos usar las armas adicionales para obtener algunos ingresos."
 CSA_focus_economic_deregulation: "Desregulación económica"
 CSA_focus_economic_deregulation_desc: "La antigua unión cayó debido a su lenta presión sobre el entorno empresarial con sus idas y venidas en las legislaciones. Como tal, desregularemos algunos temas clave en términos de creación de empresas y permitiremos una reorganización del código tributario general para incentivar mejor a las empresas locales."
 CSA_focus_tried_and_true_power: "Poder probado y verdadero"
 CSA_focus_tried_and_true_power_desc: "La trifecta del poder de los combustibles fósiles, carbón, petróleo y gas natural son métodos probados y confiables para asegurar las necesidades energéticas. Como tal, invertiremos en toda la nación, educación, investigación, recursos e infraestructura por igual para asegurar que cubramos las necesidades básicas de nuestra nación en su conjunto."
 CSA_focus_industrialization_investment_initiatives: "Iniciativas de inversión en industrialización"
 CSA_focus_industrialization_investment_initiatives_desc: "El III o el esquema de la sociedad industrial sureña, es una serie de inversiones legislativas y presupuestarias para fomentar la manufactura y la industrialización general de nuestra justa nación en su conjunto. Esto debería permitir que nuestra economía se diversifique y se complete de una manera más equilibrada."
 CSA_focus_the_WPD_programs: "Los programas del WPD"
 CSA_focus_the_WPD_programs_desc: "The Wigs have taken the lead for the coalition and are seeking to make sure they've left their mark. Of course not straying too far from the coalition's goals they still intend to sway the nation in the favor of their more classical liberalistic ideals. Obviously the SCP and PDP will try to exert counter influences to keep the balances, but hey that's politics."
 CSA_focus_its_the_economy_stupid: "Es la economía, estúpido!"
 CSA_focus_its_the_economy_stupid_desc: "Lo hemos escuchado una y otra vez, \"Es la economía, estúpido!\", bueno, resulta que cuando lo desglosas, mucho de eso realmente lo es. Con este conocimiento, debemos invertir adecuadamente en nuestra educación y simplificar la burocracia para que nuestros ciudadanos puedan tanto crear como participar en la economía, de esa manera pueden ganarse la vida de verdad y disfrutar de esa vida también."
 CSA_focus_modern_economy_means_modern_jobs: "Una economía moderna significa trabajos modernos"
 CSA_focus_modern_economy_means_modern_jobs_desc: "En la nueva economía, el sector tecnológico y, en términos generales, el \"sector de oficinas\", es de donde provendrá una parte de cosas como nuestras innovaciones y diversidad en términos de nuestra economía en general. Por lo tanto, deberíamos afinar nuestras regulaciones y nuestro sistema educativo para preparar y exponer mejor a las futuras generaciones a estos nuevos trabajos."
 CSA_focus_economic_health_is_healthcare: "La salud económica es atención médica"
 CSA_focus_economic_health_is_healthcare_desc: "La salud y el bienestar de nuestra economía también dictan directamente la salud y el bienestar del ciudadano promedio. Por lo tanto, debemos fomentar empleos mejor remunerados, la capacidad de obtener esos empleos, así como un pequeño suplemento a la infraestructura de salud y bienestar existente para asegurar que nuestros ciudadanos reciban la atención que merecen."
 CSA_focus_the_power_rangers_of_energy_itself: "Los Power Rangers de la energía en sí"
 CSA_focus_the_power_rangers_of_energy_itself_desc: "The Power Rangers Program, while not being as cool as one would assume, is our best bet at meeting our energy needs. With a surveying of our diverse land we can invest and setup different energy production methods and better streamline the network to reduce inefficiencies as well. While some will not be happy at the use of nuclear, it is clear that we need it to complete the energy puzzle we find ourselves in."
 CSA_focus_the_PDP_programs: "Los Programas del PDP"
 CSA_focus_the_PDP_programs_desc: "The Progressive Democracy Party has come out on top in leading the coalition. As such they'll look to push more progressive tax reforms and promote the modern welfare state to care for the citizens where companies fail to. Of course SCP and WPD members will look to counter these leading moves so as to not stray too far left, but regardless the first steps are being started by a left foot forward."
 CSA_focus_social_education_programs: "Programas de Educación Social"
 CSA_focus_social_education_programs_desc: "El SEP es una inversión dedicada a programas educativos en torno a la atención sanitaria con la esperanza de que más personas se unan a estos campos más adelante en la vida. Como tal, la expansión local de esta fuerza laboral nos permitiría proporcionar un mejor cuidado y un aumento mínimo en los presupuestos generales a través de esta inversión a largo plazo."
 CSA_focus_true_progressive_taxation: "Tributación Progresiva Real"
 CSA_focus_true_progressive_taxation_desc: "Reformar los códigos fiscales con un enfoque sinceramente progresivo es cómo aseguramos la estabilidad fiscal y presupuestaria. En lugar de verlo simplemente como \"más dinero significa tasas altas\", buscaremos equilibrarlo más en función del ingreso proporcional. Como tal, ya no habrá argumentos distractores sobre quién está y quién no está pagando su parte justa de impuestos."
 CSA_focus_department_of_transportative_infrastructure: "Departamento de Infraestructura de Transporte"
 CSA_focus_department_of_transportative_infrastructure_desc: "El DoTI es un departamento dedicado del gobierno nacional en el que se supervisa el desarrollo, la inversión y el mantenimiento de la infraestructura orientada al transporte existente. Esto nos permite ofrecer empleo a personas que puedan estar pasando por dificultades, además de fomentar los estándares adecuados para mantener la infraestructura moderna en su conjunto."
 CSA_focus_biofuel_investments: "Inversiones en Biocombustibles"
 CSA_focus_biofuel_investments_desc: "Considering the massive amounts of agriculture our great nation is known for, we must utilize this key aspect in diversifying our energy production methods. One such way is investing in biofuel plants to allow for excess crop wastes and potential candidates for tomorrow's fuel source to be used in the production of local energy needs. This should also help to supplement the national network, but starting small gives us a more reliable data pool."
 CSA_focus_startup_grants_for_southern_industries: "Subvenciones para Nuevas Empresas en Industrias Sureñas"
 CSA_focus_startup_grants_for_southern_industries_desc: "Debemos fomentar el crecimiento económico nacional y una forma de hacerlo es establecer un sistema de subvenciones para nuevas empresas. Para asegurar que una nueva empresa tenga éxito, esta debe proporcionar la documentación adecuada para demostrar que la subvención se utilizó correctamente. Además, un tercio de la subvención debe ser devuelto en los primeros 5 años para garantizar la buena voluntad y el progreso genuino del negocio recién establecido."
 CSA_focus_promoting_organized_agriculture: "Promoviendo la Agricultura Organizada"
 CSA_focus_promoting_organized_agriculture_desc: "Con el mundo necesitando productos como soya, algodón y bienes a granel como cereales, etc., nosotros, como una tierra fuertemente influenciada por la agricultura, debemos hacer nuestra parte para asegurar que se satisfagan las necesidades globales. Para ello, debemos promover más empresas agrícolas organizadas para garantizar que estas necesidades se cubran."
 CSA_focus_dixie_dynamics: "Dinámicas de Dixie"
 CSA_focus_dixie_dynamics_desc: "El núcleo de Dixie en sí mismo es un buen terreno central de planificación para la fabricación de armas y naval, así como para entrenar dinámicamente y establecer campos de pruebas para nuestros servicios armados. Los bosques, pantanos y ríos ayudarán a preparar y defender estas industrias que abastecerán nuestras necesidades de defensa."
 CSA_focus_memphis_miami_project: "Proyecto Memphis-Miami"
 CSA_focus_memphis_miami_project_desc: "El proyecto M&M son algunas inversiones dirigidas a los sectores de servicios y oficinas de los estados de Florida y Tennessee. Esto debería ayudar a desarrollar las economías locales y también debería ayudar a cerrar algunas brechas entre los estados en futuras inversiones."
 CSA_focus_old_habit_die_new_hopes_are_born: "Where Old Habits Die, New Hopes Are Born"
 CSA_focus_old_habit_die_new_hopes_are_born_desc: "We as a nation have come a long way, and despite our past, both recent and far back, we have learned to understand, to care and love one another as family. Sure family fights one another now and again, but in the end, family is family and no one can take that understanding away from us."
 CSA_focus_new_ways_coalition_victory: "Coalición de Nuevas Maneras"
 CSA_focus_new_ways_coalition_victory_desc: "Con los partidos más moderados buscando aprovechar a sus seguidores frente a los extremos. Debemos asegurarnos de no caer en viejos hábitos. Con esto llega la Coalición de Nuevas Maneras, el FDP, SIP y SLP han negociado un acuerdo para formar dicha coalición como una manera de dar una nueva perspectiva a la nación Sureña en su conjunto. Los tres partidos están de acuerdo con el nuevo camino Sureño, y han acordado trabajar juntos para asegurarse de dejar su huella en la creación de \"Un Nuevo Sur\"."
 CSA_focus_FDP_programs: "Programas del FDP"
 CSA_focus_FDP_programs_desc: "El Partido Federalizar Dixie ha demostrado ser más popular dentro de la coalición. Con este entendimiento, el FDP busca avanzar en la creación de un verdadero compromiso entre la antigua estructura de gobierno federal y la aún más antigua estructura de gobierno confederado de la CSA. El SIP y el SLP tomarán medidas para tratar de asegurar un equilibrio en la coalición, aunque el FDP no está realmente preocupado ya que solo el SLP quiere un enfoque más laxo, mientras que el SIP es más indiferente a cualquiera de los dos lados."
 CSA_focus_industrialize_without_automation: "Industrializar sin Automatización"
 CSA_focus_industrialize_without_automation_desc: "La Ley Anti-Automatización es esencialmente una medida provisional para fomentar la industrialización y cubrir las necesidades de empleo. Necesitamos asegurarnos de que nuestros ciudadanos puedan obtener trabajos y que los productos fabricados estén más orientados a las necesidades nacionales que a tratar de atraer a los explotadores extranjeros."
 CSA_focus_primary_needs_need_primary_care: "Las Necesidades Primarias, Necesitan Atención Primaria"
 CSA_focus_primary_needs_need_primary_care_desc: "La Ley de Atención Industrial Primaria o la Ley PIC es un esquema nacional de inversión para desarrollar industrias locales que aseguren el desarrollo de industrias primarias o orientadas a los recursos. Permitiendo nuevas industrias, así como nuevos bienes y servicios que se proporcionen a un costo más bajo para la nación."
 CSA_focus_revitalizing_the_interstate_system: "Revitalizando el Sistema Interestatal"
 CSA_focus_revitalizing_the_interstate_system_desc: "What remains of the interstate highway system is a bit of a mess to say it in kinder words. More over if we are to get anything anywhere we must actually invest in infrastructure as a whole. Therefore we must first start off with one of the biggest things and that is the major roadways which connect our states into one family."
 CSA_focus_electrical_grid_advancements: "Avances en la red eléctrica"
 CSA_focus_electrical_grid_advancements_desc: "La Ley de Avances en la Red es un paquete de inversiones para renovar la red eléctrica nacional. Nuevas subestaciones, líneas de energía más eficientes y, en general, asegurando que el desperdicio excesivo de transporte y almacenamiento de electricidad se mantenga al mínimo posible."
 CSA_focus_SIP_programs: "Programas del SIP"
 CSA_focus_SIP_programs_desc: "El Partido de la Identidad Sureña ha tomado el manto del liderazgo en la coalición. Aunque no están realmente orientados políticamente, quieren asegurar la aparición de una definición concreta de una cultura sureña. Otros miembros de la coalición en el FDP y el SLP utilizarán esta falta de dirección política directa para influir en los resultados futuros, pero al final al SIP realmente no le importa."
 CSA_focus_confederate_history_innovations: "Innovaciones en la historia confederada"
 CSA_focus_confederate_history_innovations_desc: "The CHI is an education reforms package over the principles of teaching our cultural history, or general history, with a highlight of the brutal realities of what Southern slavery caused. As well the reasons why it was so bitterly contested despite the more practical realities of slow abolishment of the institution for more productive and conventional means. As we learn and understand our dark history, we understand what clearly to avoid, but also where we can stand out and shine. In this regards we will be investing in dedicated agricultural courses to expose newer generations to different agricultural fields of study, their developments over time and hopefully encourage future innovations in these same fields of study."
 CSA_focus_connecting_the_south: "Conectando el sur"
 CSA_focus_connecting_the_south_desc: "Una de las principales causas de la ineficiencia sureña en su conjunto, ya sea la guerra civil en la década de 1860 o incluso en su batalla perpetua por volverse económicamente diversa, es su infraestructura. Como tal, debemos invertir mejor como trampolín para futuras inversiones en el núcleo de los estados identificables del sur, o en otras palabras, los comienzos de la 'causa' sureña. En este caso, los estados hermanos de Carolina y Georgia son un gran comienzo."
 CSA_focus_agricultural_developments: "Desarrollos agrícolas"
 CSA_focus_agricultural_developments_desc: "Our heritage and land is most suited for agricultural development as a whole. While we could prioritize things like the tech and office sector, these things would cost way more and put a strain on our financial situation than the current state of affairs already has. Therefore general developments in agricultural industrialization will help to soften the blow and make things just a little better for the time being."
 CSA_focus_confederate_cash_crops: "Cultivos comerciales confederados"
 CSA_focus_confederate_cash_crops_desc: "El CCC es un esquema de desarrollo del corazón para apoyar la región central de nuestra próspera nación sureña. Mississippi y Alabama son vistos como el corazón de Dixie en sí mismo, por lo que debemos cuidar y mejorar la condición del corazón de nuestra nación."
 CSA_focus_SLP_programs: "Programas del SLP"
 CSA_focus_SLP_programs_desc: "El Partido de la Libertad Sureña ha salido en la cima de la coalición y con sus influencias más libertarias planea crear un verdadero gobierno para el pueblo. A través de sus programas minarquistas, la esperanza para ellos es que la gente entienda sus necesidades y el gobierno solo necesita proporcionar los medios para que puedan alcanzar esos objetivos. El SIP y el FDP obviamente querrán influir en algunas decisiones para mantener la coalición sólida, pero también las influencias del pueblo de la nación para futuras elecciones."
 CSA_focus_new_wave_deregulations: "Nueva ola de desregulación"
 CSA_focus_new_wave_deregulations_desc: "Con esta nueva ola de política, debemos asegurar la desregulación adecuada para poder construir nuevos desarrollos en su conjunto. Con esto permitiremos la desregulación de permisos de construcción y la burocracia cuando se trata de zonificación, de esa manera se agiliza el proceso sin ser intrusivo para los ciudadanos privados en general y sus propiedades."
 CSA_focus_education_advancement_choice_program: "Programa de elección de avance educativo"
 CSA_focus_education_advancement_choice_program_desc: "Education should not be a luxury, but a choice for one's life and direction they want to take it. With this in mind we need to better streamline and give choices to our future generation of what they feel comfortable doing. Do they want to slowly make their way to college and use that as a way to be a specialized field or business startup. Or do they want to get the core of the basics of knowledge to enjoy and understand life and just focus on joining the workforce and making a steady yet enjoyable career from there. Life is full of choices and we should give our future generations the ability to understand and make the choices they want."
 CSA_focus_selfcare_is_welfare: "El autocuidado es bienestar"
 CSA_focus_selfcare_is_welfare_desc: "La gente sabe cuáles son sus necesidades, sabemos que necesitan los recursos y la capacidad para buscar dichas necesidades. Por lo tanto, recortaremos los programas federales y gubernamentales y todo eso se puede devolver en ahorros empresariales, así como recortes de impuestos directos para la población."
 CSA_focus_the_modern_energy_economy: "La economía energética moderna"
 CSA_focus_the_modern_energy_economy_desc: "The world is more reliant on fossil fuels for energy than at any other point in human history. This is only going to grow as our species continues to grow. Therefore we must assume a modern role in today's energy economy by investing in finding new deposits as well as diversifying our energy needs through things like natural gas, coal, coal conversions, carbon trapping, as well as biofuels. Then we can truly stay ahead of the curve and ensure a stable future for our economy and our nation as a whole."
 CSA_focus_expand_the_office_sectors: "Expandir los sectores de oficinas"
 CSA_focus_expand_the_office_sectors_desc: "Nuestra economía debe perdurar a través de la diversificación, por lo tanto, debemos buscar que las personas inviertan en relación con el desarrollo de los sectores de oficinas de nuestra economía. Esto será un buen contrapeso a la economía unilateral que nuestra región tiende a tener, que es la agricultura."
 CSA_focus_expand_the_industrial_base: "Expansión general de la base industrial"
 CSA_focus_expand_the_industrial_base_desc: "Nuestra manufactura siempre ha sido limitada, pero a través de inversiones y desarrollos generales deberíamos poder incorporarla en general con los recursos nacionales que tenemos. Después de todo, la agricultura es una buena base sobre la cual construir."
 CSA_focus_down_by_the_docks: "Abajo en los muelles"
 CSA_focus_down_by_the_docks_desc: "Las costas de nuestra justa nación serán la mejor manera de abrirnos paso en términos de contribución económica nacional y global. Podemos mejorar, expandir e invertir en nuevos astilleros e industrias navales en todos nuestros territorios costeros y asegurar una contribución constante y una gran cantidad de opciones para canalizar bienes comerciales de entrada y salida."
 CSA_focus_dixie_defense_contracts: "Contratos de defensa de Dixie"
 CSA_focus_dixie_defense_contracts_desc: "Temporada de caza, autodefensa, defensa nacional, lo que sea y podemos suministrarlo. La creación de una industria de defensa general y la configuración de contratistas para dicha industria permitirá no solo la diversificación continua de nuestra economía, sino que también puede contribuir en gran medida a la defensa de nuestra nación en su conjunto. Estableciendo el escenario para una nación sureña verdaderamente defendida y su cultura y tierras incontestadas por potencias extranjeras."
 CSA_focus_old_reliable: "Viejo confiable"
 CSA_focus_old_reliable_desc: "Our economic \"Old Reliable\", the agricultural sector of our economy is something we can never earnestly move away from. The lands are just too suited for the industry that its more inefficient to use that land for other means. However a balance is what we need and with our previous projects we can now come full circle. With this national overhaul of an economic miracle as well as our coalition's efforts to better the people's of these lands, we seek to finally break away from the past and create a real future for our people. For we are a Southern Family and family always sticks together."
 CSA_focus_party_for_economic_prosperity_victory: "La prosperidad asegura la victoria"
 CSA_focus_party_for_economic_prosperity_victory_desc: "In a mild upset to many the PEP or Party for Economic Prosperity has won the recent elections. With this victory comes to a head the reality that the PEP needs to actually do some nation leading instead of being what some believed to be a \"Tycoon's Gentlemen Club\" of sorts. Regardless of what the opposition says the PEP has stated that their obvious main goal will be to economically rebound the nation and create the fiscal and economic situation to allow for social debates. Many question the wording of such a statement but most see it as, if they pull through we only have a net positive, if they fail, it can't be worse than what we just pulled ourselves out of...right?"
 CSA_focus_paving_the_way_forward: "Pavimentando el camino hacia adelante"
 CSA_focus_paving_the_way_forward_desc: "Para llegar literalmente a cualquier parte con nuestros planes de desarrollo, debemos asegurarnos de que nuestras carreteras y la infraestructura de transporte en general estén a la altura para el aumento del flujo de tráfico."
 CSA_focus_establishing_the_labour_corps: "Establecimiento del Cuerpo de Trabajo"
 CSA_focus_establishing_the_labour_corps_desc: "The SLC or the Southern Labour Corps is an organization for the unemployed as well as the incarcerated to work on infrastructure projects. Things like upkeeping and creating new infrastructure projects, as well as starting clearing and foundation startings for future development programs for the economy. Overall this will help increase employment as well as we can use better budgeting in the law enforcement of the nation to secure the validity of the SLC which in turn can distribute the pay of working on projects which involve unemployed."
 CSA_focus_southern_agriculture_dominance: "Dominio de la Agricultura Sureña"
 CSA_focus_southern_agriculture_dominance_desc: "Our lands are meant for cultivation, our lands are meant for the farms and fields of agriculture. For this we will ensure the sheer dominance of our Southern agriculture over even those which dominate the world nowadays. Understanding this, we will also need to invest and develop within this sector if we are to keep ahead of any real competition."
 CSA_focus_heartland_development_scheme: "Esquema de Desarrollo del Corazón"
 CSA_focus_heartland_development_scheme_desc: "Nuestro primer programa de desarrollo central será nada menos que el núcleo de nuestra nación. Los estados de Misisipi y Alabama han sido vistos como uno de los estados menos desarrollados dentro de la antigua unión. Pues ya no más, haremos de este corazón de nuestro cuerpo nacional sureño el centro neurálgico palpitante de nuestra gran nación."
 CSA_focus_overhauling_taxation_practices: "Reforma de las Prácticas Tributarias"
 CSA_focus_overhauling_taxation_practices_desc: "If we are to utilize the most from our lands we must be able to fund it properly. So overhauling the taxation manners and enforcement will allow us to cut down on corruption and bring in more revenue in general."
 CSA_focus_atlantic_advancements: "Avances Atlánticos"
 CSA_focus_atlantic_advancements_desc: "Los Avances Atlánticos son una creciente influencia industrial en la parte oriental de la nación. Debemos invertir en la expansión de sus operaciones si vamos a ayudar a impulsar nuestra prosperidad económica."
 CSA_focus_dixie_demolitions: "Demoliciones de Dixie"
 CSA_focus_dixie_demolitions_desc: "Dixie Demolitions is a construction and mining firm making headways in the heart of Dixie itself. Recently geological surveys have uncovered a thin belt of lithium from southern Alabama to potentially all the way in Texas. This is a key mineral in developing a lot of battery tech as well as a fair amount of machines as a whole. We must help kickstart this little lithium boom so we can secure our domestic interests."
 CSA_focus_cajun_computers: "Computadoras Cajún"
 CSA_focus_cajun_computers_desc: "Computadoras Cajún Inc. es una empresa tecnológica emergente en las partes occidentales de la nación que ha estado haciendo algunos avances decentes. Debemos invertir en esta empresa para permitir su expansión y no solo aumentar nuestras capacidades económicas, sino también generar empleos y nuevas oportunidades para estos estados occidentales."
 CSA_focus_national_research_institute: "Instituto Nacional de Investigación"
 CSA_focus_national_research_institute_desc: "Para ser una fuerza económica a tener en cuenta, debemos innovar y desarrollar nuevos métodos de mejora económica. Como tal, crear un instituto nacional de investigación nos dará los recursos con ese objetivo en mente. De manera pasiva, obviamente ayudará a nuestros esfuerzos de investigación, pero esperamos innovar en la industria, en los esfuerzos de construcción y en mucho más."
 CSA_focus_corps_of_engineers_expansion: "Expansión del Cuerpo de Ingenieros"
 CSA_focus_corps_of_engineers_expansion_desc: "El Cuerpo de Ingenieros de nuestra fuerza militar es la columna vertebral de las métricas logísticas y defensivas que mantienen unidas a nuestras fuerzas armadas. Independientemente de esto, este aspecto clave de nuestra fuerza militar debe ser refinado y expandido. No solo por el bien de la fuerza militar, sino también para incorporar una rama civil que pueda tener aplicaciones prácticas en tiempos de paz."
 CSA_focus_growing_defense_capabilities: "Crecimiento de las Capacidades de Defensa"
 CSA_focus_growing_defense_capabilities_desc: "Nuestra defensa nacional es una prioridad principal sin importar cómo se lo vea. Con esto, crearemos las industrias que contribuirán a nuestra defensa. A través de inversiones dirigidas, también podemos obtener algunos ingresos suaves con estas nuevas plantas de armas."
 CSA_focus_reforming_industrialization: "Reforma de los Esfuerzos de Industrialización"
 CSA_focus_reforming_industrialization_desc: "Nuestras capacidades industriales están limitadas por el hecho de que realmente no tenemos las máquinas ni la base para garantizar una producción máxima. Como tal, podemos buscar la compra de maquinaria y reformar nuestras regulaciones para revitalizar nuestros esfuerzos industriales en general."
 CSA_focus_naval_industrial_expansions: "Expansión de la Industria Naval"
 CSA_focus_naval_industrial_expansions_desc: "We have an expansive coastline, as such we must utilize this by expanding and growing our naval industrial capacity."
 CSA_focus_national_infrastructure_improvements: "Mejoras en la Infraestructura Nacional"
 CSA_focus_national_infrastructure_improvements_desc: "A medida que nuestra nación crece, debemos asegurarnos de que nuestra infraestructura pueda manejar las crecientes demandas de transporte de recursos y las cadenas de suministro en general. Por lo tanto, llevaremos a cabo una expansión y crecimiento de nuestras redes viales existentes según sea necesario."
 CSA_focus_growing_produce_plan: "Plan de Crecimiento de la Producción"
 CSA_focus_growing_produce_plan_desc: "Sí, ya cultivamos productos, la ironía es que podemos expandir este sector existente y de ahí el plan de crecimiento de la producción. ¿Por qué conformarnos con lo justo cuando podemos asegurar más producción y utilizar el exceso como poder blando para las relaciones exteriores?"
 CSA_focus_connecting_the_sister_states: "Conectando los Estados Hermanos"
 CSA_focus_connecting_the_sister_states_desc: "The Carolinas are a union in their own right. However this union is limited to whatever connections are available to them and it is with this in mind that we shall strengthen that bond ever more. Through comprehensive railroad projects we can expand the throughput capabilities of the Carolinas and allow for bulk transport goods to flow near freely through the sister states."
 CSA_focus_the_mississippi_western_railroad: "El Ferrocarril Occidental del Misisipi"
 CSA_focus_the_mississippi_western_railroad_desc: "Para unir y crear un contrapeso occidental al plan de unidad de nuestros estados hermanos, estamos creando el MWRR o Ferrocarril Occidental del Misisipi. Este ferrocarril, aunque una mezcla de propiedad gubernamental y privada, tiene como socio intermedio al Mississippi Central. Con su experiencia, ayudará a crear una competencia cooperativa y saludable, así como la descentralización de la red ferroviaria nacional."
 CSA_focus_southern_power: "Poder Sureño"
 CSA_focus_southern_power_desc: "Poder Sureño es una compañía eléctrica de rápido crecimiento y su alcance abarca gran parte de la nación. Nacionalizaremos sutilmente esta empresa mediante la compra de sus acciones y distrayéndolos a través de inversiones para expandir sus operaciones en general."
 CSA_focus_dont_look_back_look_forward: "No mires atrás, solo mira hacia adelante"
 CSA_focus_dont_look_back_look_forward_desc: "Es hora de dejar de lamentarnos por nuestro pasado como cultura y como impacto histórico. Nunca llegaremos a ningún lado de manera sincera si constantemente actuamos como si los actos injustos de hace casi siglos fueran los de hace unas pocas horas. Debemos mirar hacia adelante, a través de nuestros enormes desarrollos y programas, aseguraremos un futuro donde cada ciudadano sureño logrará los objetivos de una vida cómoda y podrá disfrutar realmente de la vida por lo que puede ser y no por lo que \"creemos que debe ser\"."
 CSA_focus_cwuf_victory: "Victoria del Frente de Unidad de los Trabajadores Confederados"
 CSA_focus_cwuf_victory_desc: "In a seemingly shocking turn of events, the oddball coalition of the Confederate Workers Party and Southern Tradition Party have taken the first victory in the elections. Many wonder how this coalition works when the reality is it kinda works. The main uniting principle is the Confederate identity and mantra they both espouse. However one is clearly more on the other side of the aisle politically than the other. Now that the coalition has won it'll be interesting to see who ends up having the most influence."
 CSA_focus_CWP_policy_plan: "Plan de Política del CWP"
 CSA_focus_CWP_policy_plan_desc: "The Confederate Workers Party has taken leadership in the polls and consequently won the election. With this they now have the platform to initiate their policies, which will now be enacted to start the road to a real and fair society for the working man."
 CSA_focus_industrialized_agriculture: "Agricultura Industrializada"
 CSA_focus_industrialized_agriculture_desc: "Nuestros esfuerzos para hacer del hombre trabajador el principal hombre no pueden convertirse en realidad cuando nuestro sector agrícola requiere tanta mano de obra. Por lo tanto, debemos mejorar, mecanizar y organizar mejor nuestro sector agrícola de nuestra economía."
 CSA_focus_the_real_economy: "La Economía Real"
 CSA_focus_the_real_economy_desc: "Industria, manufactura y las tiendas pequeñas. Esta es la verdadera economía de la era moderna, así como lo fue la economía de hace décadas y casi siglos. Debemos construir, apoyar y establecer esto como la base sólida de la cual buscaremos la grandeza."
 CSA_focus_a_honest_tax_system: "Un Sistema Tributario Honesto"
 CSA_focus_a_honest_tax_system_desc: "Seamos realistas, para organizar y apoyar a la sociedad, la riqueza creada necesita ser organizada y recolectada en una medida para asegurar que se utilice mejor para la sociedad en general. Como resultado, debemos ser honestos y directos sobre reformar y establecer un sistema tributario fresco. No nos hará populares a corto plazo, pero si podemos eliminar a los administradores problemáticos y realmente poner el dinero en buen uso, la gente nos amará más adelante."
 CSA_focus_a_needed_evil: "Un Mal Necesario"
 CSA_focus_a_needed_evil_desc: "The \"Corporate\" sector of our economy contains services and technologies as a whole. While the C word is a bit ugly to be using we cannot deny that it is a needed evil for which to keep our edge over foreign powers. As such we can reform some labor laws and make the sector a bit smaller in scale as to keep it a bit more down to earth like more core industries."
 CSA_focus_welfare_reforms: "Reformas del Bienestar"
 CSA_focus_welfare_reforms_desc: "La ciudadanía de nuestra nación debe ser atendida y la única forma en la que podemos hacer eso es reformando y reponiendo nuestras redes de seguridad social. Un trabajador feliz es un trabajador productivo y es esta felicidad la que nos esforzamos por asegurar para una sociedad cohesionada."
 CSA_focus_STP_policy_plan: "Plan de Política del STP"
 CSA_focus_STP_policy_plan_desc: "Con la victoria electoral del CWUF, el Partido de la Tradición Sureña ha salido adelante y busca usar esta victoria total para abrir la puerta a sus políticas. Aunque están más enfocados en políticas económicas y culturales, probablemente intentarán comenzar a distanciarse del lado socialista de la coalición cuando sea posible."
 CSA_focus_energizing_the_lands: "Energizando Las Tierras"
 CSA_focus_energizing_the_lands_desc: "Los vastos bosques y el terreno poco favorable para establecer una infraestructura real para la red eléctrica no son lo mejor. Por lo tanto, necesitamos buscar mejores formas de satisfacer las necesidades de generación de energía más descentralizadas. A partir de ahí, estos \"bloques\" pueden encontrar enlaces mutuos que luego puedan contribuir a un tipo de red nacional."
 CSA_focus_the_promising_ventures_act: "La Ley de Empresas Prometedoras"
 CSA_focus_the_promising_ventures_act_desc: "La PVA es un paquete colectivo de inversiones y reformas para desarrollar y promover el entorno empresarial nacional. Reformas fiscales, regulaciones para mejorar la felicidad de los trabajadores mientras se agiliza el tiempo de establecimiento harán una economía redondeada y cohesionada entre la facción socialista y la capitalista en nuestra coalición."
 CSA_focus_machining_imports: "Importación de Maquinarias"
 CSA_focus_machining_imports_desc: "Targeted machining equipment for imports allows us to not only upgrade and modernize our production capabilities. But these imports can be reverse engineered and redone in different ways to spur research as well as get around foreign long term dependency."
 CSA_focus_mississippi_technological_institute: "Instituto Tecnológico de Mississippi"
 CSA_focus_mississippi_technological_institute_desc: "MTI, una referencia discreta al MIT, es la respuesta sureña a la innovación y la investigación. Al ser una ubicación más central, se dedicará financiación a la I+D en una serie de áreas que pueden ayudar a mejorar la vida en general. Desde avances en construcción hasta métodos de purificación y extracción de recursos, el MTI será la cúspide de la innovación sureña."
 CSA_focus_riverland_investments: "Inversiones en Riverland"
 CSA_focus_riverland_investments_desc: "El esquema de Inversiones en Riverland es un plan económico integral para desarrollar los estados en el río Mississippi. Desde Louisiana hasta Tennessee, estos cuatro estados serán desarrollados a través de proyectos económicos generales y especializados para garantizar los mejores resultados para las poblaciones locales."
 CSA_focus_raw_energy_methods: "Métodos de Energía Cruda"
 CSA_focus_raw_energy_methods_desc: "From oil to natural gas, to green grass and charcoal made on mass. With a comprehensive investment in each state's infrastructure as well as their best energy producing means we can create a raw energy economy to satisfy our needs and future endeavors."
 CSA_focus_domestic_petrochemicals: "Petroquímicos Domésticos"
 CSA_focus_domestic_petrochemicals_desc: "The oil and coal, albeit in limited supply in the states of Oklahoma and Louisiana can be partly converted towards more direct and diverse petrochemical industries. Creating such industries allows us to secure a lot of chemical and synthetic products we may have had to rely on by foreign imports. Its not much, but its enough and that's all that matters."
 CSA_focus_mid_atlantic_mining_co: "Compañía Minera del Atlántico Medio"
 CSA_focus_mid_atlantic_mining_co_desc: "La Compañía MAM es una empresa minera basada en Carolina del Norte que ha buscado inversiones gubernamentales nacionales para apuntar a metales preciosos, así como operaciones mineras basadas en litio y mica que pueden ayudar tanto comercial como potencialmente en lo militar. De todos modos, necesitaremos invertir en la defensa de Carolina del Norte si queremos mantener tales inversiones."
 CSA_focus_jobs_a_plenty_act: "Ley de Abundancia de Empleos"
 CSA_focus_jobs_a_plenty_act_desc: "La JaPA creará empleos en servicios y de propósito general que ayudan al empleo y aseguran que la gente de la nación pueda ser atendida con rapidez, eficiencia, y además con un empleo que pueda costear los fundamentos de la vida."
 CSA_focus_southern_nucleus: "Ley del Núcleo Sureño"
 CSA_focus_southern_nucleus_desc: "El corazón de nuestra nación debe ser también el corazón de nuestra capacidad para producir energía para nuestras necesidades nacionales. Para producir tales necesidades energéticas necesitamos los medios posiblemente más eficientes para producir electricidad y esas son inversiones limitadas en energía nuclear. Aunque la gente protestará por la decisión debido a la clase de temores difusos hacia la energía nuclear, podemos silenciar a los más vociferantes colocando estratégicamente las plantas de energía en áreas aisladas de los centros poblacionales y la costa en caso de eventos climáticos severos."
 CSA_focus_southern_cultural_society: "La Sociedad Cultural Sureña"
 CSA_focus_southern_cultural_society_desc: "The national southern cultural society is a national and local effort to put aside just a little bit from everything and give it back via an annual week long celebration and historical remembrance of our nation's long and very troubled history. For we are no longer natives, europeans or even americans. We are Southerners, a part of one big happy Southern Family."
 CSA_focus_the_southern_dream: "El Sueño Sureño"
 CSA_focus_the_southern_dream_desc: "At long last, through unity and developing a better future for all our citizens, we can now truly move on. No longer will we let our past define us. But rather we understand that even if it is a part of us, that it is but a past mistake for which we have not only learned from, but built better and strived to correct the journey we are on to a brighter future. For a dream can be a reality if we work together."
 CSA_focus_fasp_victory: "Victoria del Pacto de la Sociedad Agraria Libre"
 CSA_focus_fasp_victory_desc: "What will the fringes think of next, as in yet another sort of blind side the Union of Revolution Party and the Agrarian Union Party have teamed up and practically stolen victory from like literally anyone else. Many in and outside the coalition have no real idea how the coalition functions. But insiders with each party seem to think they can use the other for their own means to an end. The URP wanting the AUP for their agriculture expertise in converting the nation into a socialist utopia. The AUP wanting the URP for their popularity among industrial workers overall. One thing that each has in common is that agriculture is the future and quote, \"we must seize this moment now and not later\"."
 CSA_focus_URP_programs: "Programas del URP"
 CSA_focus_URP_programs_desc: "With the victory of the Free Agrarian Society the Union of Revolution Party has come out on top within the coalition. With this initial victory the URP looks to better decentralize and bring about as close to anarchistic-socialism as possible before the AUP wins leadership or gets enough influence to potentially reverse certain policies. Regardless we can expect more agriculture investment as well as lowered government spending overall."
 CSA_focus_return_their_wealth_act: "Ley de Devolución de su Riqueza"
 CSA_focus_return_their_wealth_act_desc: "La RTWA es un esfuerzo de redistribución de la riqueza para devolverle al pueblo su dinero duramente ganado a través de lo que podamos recortar de los gastos nacionales del gobierno. A cambio, esto irónicamente nos permitirá obtener ingresos futuros, ya que estas personas ahora tendrán más dinero para reinvertir en la economía como mejor les parezca."
 CSA_focus_the_basics_of_life: "Lo Básico de la Vida"
 CSA_focus_the_basics_of_life_desc: "Comida, agua, refugio. Estos son los básicos de la vida que cualquier especie necesita para sobrevivir. Con esto y nuestros recientes recortes presupuestarios, podemos alentar a la gente de nuestra nación a invertir en expandir el sector agrícola. Este pilar de nuestra economía ayudará a alimentar a nuestra gente y asegurar una vida cómoda basada en las necesidades, no solo en la vida de deseos y consumismo del viejo orden que conduce a una vida destructiva de insatisfacción."
 CSA_focus_the_anti_revenue_act: "Ley Antirecaudación"
 CSA_focus_the_anti_revenue_act_desc: "El objetivo de la ley es hacer algo así como lo inverso de su nombre. A través de recortar los gastos gubernamentales y devolverlo mediante reducciones de impuestos y reformas regulatorias, preparamos el terreno para la reinversión a largo plazo de nuestros pueblos para que usen su dinero para reinvertir en la nación. Claro, esto tomará tiempo, pero nuestros ingresos generales realmente aumentarán, solo que no será en el corto plazo."
 CSA_focus_stagnation_industrialism_act: "Ley de Estancamiento del Industrialismo"
 CSA_focus_stagnation_industrialism_act_desc: "Para crear una economía estable y verdadera que satisfaga las necesidades de nuestra gente, debemos asegurarnos de que nuestra estructura económica apoye a las mismas personas que la crean. Por lo tanto, comenzaremos a estancar y reducir la industrialización en su conjunto, asegurando la primacía de nuestro sector agrícola."
 CSA_focus_local_care_act: "Ley de Cuidado Local"
 CSA_focus_local_care_act_desc: "La LCA es un paquete de reformas médicas y de bienestar que despoja los gastos nacionales y los aparatos sobrecentralizados, para luego devolverlos a los gobiernos locales y a los individuos que pueden reinvertir en instalaciones de atención local que son necesarias para esos mismos locales. La gente y las comunidades de nuestra nación saben lo que necesitan, así que démosles los medios para garantizar que esas necesidades se cubran."
 CSA_focus_AUP_programs: "Programas del AUP"
 CSA_focus_AUP_programs_desc: "To the victors go the spoils, however these victors must share and sharing is indeed something they do not care for. As a result the Agrarian Unity Party leading the coalition victory has resulted in quick movements to secure their own initiative above all other influences where possible. The true agrarian society will be realized and the AUP will seek to make it as such."
 CSA_focus_agricultural_industrialism: "Industrialismo Agrícola"
 CSA_focus_agricultural_industrialism_desc: "Agricultural industries are still industrial in nature. This is the benchmark we will set and make to ensure our future is a future of filled bellies and satiated minds."
 CSA_focus_food_securities_act: "Ley de Seguridad Alimentaria"
 CSA_focus_food_securities_act_desc: "La FSA es un proyecto de ley de seguridad interna que otorga más fondos a las agencias de aplicación de la ley, así como a una nueva Administración de Seguridad Alimentaria. Esta nueva administración tendrá la tarea de asegurar las instalaciones de almacenamiento de alimentos a granel y las principales instalaciones de procesamiento para garantizar las cadenas de suministro ininterrumpidas de cualquier cadena basada en alimentos. Un gran efecto secundario es la recolección asegurada de los ingresos corporativos de estas empresas para garantizar que sus productos estén a salvo de fuerzas tanto internas como externas."
 CSA_focus_continued_agrarian_developments: "Desarrollos Agrarios Continuos"
 CSA_focus_continued_agrarian_developments_desc: "Los esquemas CAD están diseñados para continuar el industrialismo agrícola basado en la agricultura, lo que nos dará una creciente influencia pasiva en el escenario global. Nuestra nación será la piedra angular que asegurará nuestra estabilidad interna y nuestras influencias regionales."
 CSA_focus_self_investments_act: "Ley de Inversiones Propias"
 CSA_focus_self_investments_act_desc: "La SIA es una legislación de reforma fiscal que pone más énfasis en gravar a las empresas o entidades corporativas en lugar de a las personas individuales. La salvaguarda es que las agencias de aplicación de la ley alrededor de la ejecución fiscal también estarán reportando regularmente para asegurar que no se intente explotar lagunas legales. Las cámaras gubernamentales nacionales ya tienen un proyecto de ley de reforma salarial corporativa y regulación que solo espera a que alguien intente."
 CSA_focus_farmlife_care_act: "Ley de Atención a la Vida en la Granja"
 CSA_focus_farmlife_care_act_desc: "El gobierno ha considerado oportuno reformar el sistema de salud en torno a nuestra economía en desarrollo. Entendiendo las tensiones físicas que la vida en la granja puede tener, así como los beneficios que también puede proporcionar. Comprender estos equilibrios e influencias nos permitirá preparar reformas futuras y garantizar que la atención a nuestros ciudadanos se construya para sus vidas."
 CSA_focus_natural_energy_production_act: "Ley de Producción de Energía Natural"
 CSA_focus_natural_energy_production_act_desc: "La Ley NEP es un paquete de investigación para dedicar algunos fondos y recursos a expandir y modernizar el uso de biocombustibles en su conjunto. Muchos no ven los biocombustibles como una alternativa real, sin embargo, con nuestro agrarismo siendo el punto culminante de nuestra sociedad, tenemos los recursos reales para dedicar a tales iniciativas de investigación. Ahora, aunque estos primeros resultados pueden no demostrar mucho, esto ciertamente allana el camino para un futuro verdaderamente verde."
 CSA_focus_electric_highways_act: "La Ley de Autopistas Eléctricas"
 CSA_focus_electric_highways_act_desc: "El gobierno nacional ha aprobado un proyecto de ley de financiamiento para permitir la modernización y optimización de la red eléctrica para establecer una especie de sistema de autopistas para las necesidades eléctricas de nuestra nación. Esto permitirá la dispersión y distribución adecuada de electricidad en toda la nación, así como hacerla flexible para futuras demandas y crecimientos donde sea necesario."
 CSA_focus_moving_mississippis_initiative: "Iniciativa de Movimiento de Mississippi"
 CSA_focus_moving_mississippis_initiative_desc: "The MMI is a governmental megaproject set to fundamentally change how we obtain and use the natural energy from which the Mighty Mississippi River has. Through creating localized and man made rivers and hydroelectrical measures, the main plan in the long term is to increase our energy production as well as look into using this run off water source as a way to replenish fresh water sources in the surrounding states. Of course this will be a long term project, but if its paced right and planned out correctly, then we can be assured of the results and limited to no earnest impacts to the wildlife native to the Mississippi river itself."
 CSA_focus_solidifying_domestic_manufacturing: "Solidificando la manufactura nacional"
 CSA_focus_solidifying_domestic_manufacturing_desc: "A pesar de nuestras esperanzas y sueños de una economía puramente agraria, no podemos ignorar la realidad de que una economía diversa es una economía segura. Así que haremos lo suficiente para asegurar esa red de seguridad."
 CSA_focus_limited_office_sector_investments: "Limited Office Sector Investments"
 CSA_focus_limited_office_sector_investments_desc: "Keeping true to our diversity program, we will initiate some limited office sector related investments to allow our economy to flourish in all directions. But never forget where we came from...the farms and homes we make."
 CSA_focus_a_past_not_so_easily_forgotten: "Un pasado no tan fácilmente olvidado"
 CSA_focus_a_past_not_so_easily_forgotten_desc: "A pesar de nuestros mejores esfuerzos, muchos todavía desconfían de la existencia de nuestra nación y de su oscura historia asociada. Aunque hemos hecho buenos avances para avanzar, las cicatrices persisten y parecen no querer sanar adecuadamente. Esperemos que podamos seguir sanando y tal vez algún día disfrutar de un futuro sin manchas."
 CSA_focus_dpl_victory: "Victoria de la Liga de la Pureza de Dixie"
 CSA_focus_dpl_victory_desc: "In a drastic turn of events apparently old habits don't die as much as many had hoped. The coalition of the Dixie First Party and the League Of The South has created a massive upset as with their victory comes a troubling road ahead. Many wonder just what exactly they will do with fears of history's past being ever more conscious in the minds of the Southern citizenry."
 CSA_focus_DFP_programs: "Programas de Primero Dixie"
 CSA_focus_DFP_programs_desc: "The Dixie First Party has taken the main leadership role within the Purity League and has come out on top. While its main programs are similar to its \"White\" League counter part, many see a slight rift in just how aggressive certain domestic type policies should be. This will obviously cause some \"White\" League members to push back but in the end should keep the coalition stable regardless."
 CSA_focus_voluntary_emigration_programs: "Programas de emigración voluntaria"
 CSA_focus_voluntary_emigration_programs_desc: "The VEP is a governmental initiative to give those the option that don't want to be more uniformed with society the chance to seek better lives for themselves. Of course many will argue that \"This is our land too, we've lived here for generations, bla, bla, bla\". But the fact of the matter is, that with the right incentives and maybe just a little pressure, not enough to be negligent, but enough to sway the more stubborn to be more considerate. We can begin to free up our nation from the stain of modern multi-culturalism and its naturally destabilizing mannerisms."
 CSA_focus_electrical_prioritization_programs: "Programas de priorización eléctrica"
 CSA_focus_electrical_prioritization_programs_desc: "Como una forma de ejercer un poco de poder blando, especialmente en el estado de nuestra nación. Podemos establecer puntos de priorización y crear apagones programados. Aunque para desviar la atención de nosotros, todos deberán participar, sin embargo, aquellos que se resistan recibirán un buen favoritismo de nuestra parte."
 CSA_focus_robust_economics: "Economía robusta"
 CSA_focus_robust_economics_desc: "Mientras manejamos la diversidad que causa dolor, podemos aumentar la diversidad que nos permite crecer. Una ronda de inversiones económicas integrales y diversas traerá nueva luz, nuevos empleos y nueva prosperidad a las tierras de nuestra nación."
 CSA_focus_energy_research_priority: "Prioridad de investigación energética"
 CSA_focus_energy_research_priority_desc: "La iniciativa ERP es un tipo de inversión de impacto y asombro hacia la producción y el uso de innovaciones energéticas. Las mayores necesidades de cualquier economía moderna, además de la comida y el refugio, son la energía en sí misma. Como tal, avanzaremos y tomaremos firmemente cualquier forma en que podamos forzar algún tipo de innovación, de modo que podamos liberarla a la nación y extender con facilidad la satisfacción de nuestras necesidades energéticas nacionales que se han cumplido y se cumplirán."
 CSA_focus_domestic_taxation_reforms: "Reformas fiscales nacionales"
 CSA_focus_domestic_taxation_reforms_desc: "Las necesidades de nuestro pueblo son lo primero. Estas necesidades se basan en el hecho de que establecemos reformas para limitar la cantidad de dinero que las personas intentarían sacar de nuestra nación."
 CSA_focus_LotS_programs: "Agenda de la Liga del Sur"
 CSA_focus_LotS_programs_desc: "The Purity League has been victorious and with this a fearful reality has come to pass. The League of the South has taken the leading role in the coalition's victory and as a result is already moving quickly to secure their base and enact their programs to aggressively unify and uniform the nation and its people itself. Counterparts in the DFP have begun to protest as the League's policies seem to be way more aggressive and likely destabilizing than what the DFP proposes. Regardless only time will tell just how far from the tree the fruit may fall."
 CSA_focus_organized_deportations: "Deportaciones Organizadas"
 CSA_focus_organized_deportations_desc: "Hay muchas personas que abusan de los actuales programas sociales, educativos y de salud disponibles para aquellos ciudadanos que contribuyen a nuestra sociedad. Por lo tanto, comenzaremos a organizar deportaciones y programas de reubicación para aquellos que no hacen nada por nuestra sociedad, pues su pérdida no es una pérdida desde el principio."
 CSA_focus_the_basic_needs_program: "Programa de Necesidades Básicas"
 CSA_focus_the_basic_needs_program_desc: "The BNP is a series of employment programs as a way to reform light risk criminals as well as those who may be perceived as \"useless\", to our society. While we don't expect much, this would help to stop gap any kind of overt aggressive actions and potential reactions for the time being."
 CSA_focus_a_hard_border_is_a_real_border: "Una Frontera Dura Es Una Frontera Real"
 CSA_focus_a_hard_border_is_a_real_border_desc: "The ailing uncle Sam, or at least whatever remains of the federalists in the capital region have been uppity about their ambitions. We don't know exactly what they are planning but suffice to say we will never fall victim to their tyranny again. As such we shall construct a true and hard border between our nations to ensure the peace and defense of our fair Southern nation."
 CSA_focus_fueling_the_nation: "Abasteciendo a la Nación"
 CSA_focus_fueling_the_nation_desc: "We need to power our very nation to ensure the needs of our people as well as our economy are met."
 CSA_focus_mining_expansions: "Expansiones Mineras"
 CSA_focus_mining_expansions_desc: "Las tierras de nuestra nación del Sur son aquellas que solo realmente han sido utilizadas para un único truco económico. Este siendo la industria agrícola y sus muchos subsectores que alimentan y mantienen viva a nuestra nación. Sin embargo, a través de extensas encuestas geológicas y enfocándonos más en las necesidades y excedentes nacionales, podemos expandir y crear la base de la autarquía de materias primas. No es mucho, pero los nuevos depósitos de litio en el corazón del país y Luisiana tienen a muchos esperanzados por futuros descubrimientos y proyectos."
 CSA_focus_military_productions_act: "Ley de Producción Militar"
 CSA_focus_military_productions_act_desc: "La defensa de nuestra nación es primordial para garantizar la seguridad y protección de nuestra sociedad y estilo de vida. Con esto, comenzaremos reformas e inversiones en la expansión de nuestras capacidades de producción militar."
 CSA_focus_heartland_training_complex: "Complejo de Entrenamiento del Corazón"
 CSA_focus_heartland_training_complex_desc: "To ensure peak training efficiency we must create a complex to be able to diversely and rigorously train new recruits into our armed forces. The army being paramount defense from all enemies on land means that creating an extensive network of interconnected bases and training facilities will speed up, refine, and harden new recruits to defend their homes and families."
 CSA_focus_coastal_contingencies: "Contingencias costeras"
 CSA_focus_coastal_contingencies_desc: "La preservación de nuestras propias tierras debe enfrentarse de frente y, como tal, se requieren inversiones costeras significativas a nivel nacional y militarización. Además de invertir en la expansión de nuestras industrias navales y de transporte marítimo, podemos establecer un punto de referencia que solo crecerá con el tiempo."
 CSA_focus_food_procurement_and_surplus_initiative: "Iniciativa de adquisición y excedentes de alimentos"
 CSA_focus_food_procurement_and_surplus_initiative_desc: "The FP&SI is a general investment scheme to develop foodstuffs storage and baseline expansion. This reduction in prices at the store as well as lessening the burden on average folks will boost our appeal and national health as a whole. We also hope this food security of such will encourage general employment trends to increase and lessen the average real unemployment rates."
 CSA_focus_national_preservation_act: "Ley de preservación nacional"
 CSA_focus_national_preservation_act_desc: "La preservación de nuestra nación y su funcionalidad comienza desde la cima con el propio gobierno nacional. Con este hecho evidente en mente, las cámaras gubernamentales han aprobado un proyecto de ley para crear una organización de auditoría independiente para eliminar la corrupción. Un buen efecto secundario es una transparencia general y un aumento en los ingresos en tiempo real a medida que las personas tanto que recaudan como que pagan impuestos se vuelven más confiables con el sistema y los resultados que producirá."
 CSA_focus_targeted_energy_diplomacy: "Diplomacia energética dirigida"
 CSA_focus_targeted_energy_diplomacy_desc: "Utilizar inversiones en investigación y asegurar acuerdos comerciales con naciones que tengan puntos de vista o posiciones similares nos permitirá aumentar nuestras influencias geopolíticas. Puede que no sea mucho, pero estos son simplemente pequeños pasos para mejorar nuestra nación y asegurar nuestra posición frente a tipos más agresivos."
 CSA_focus_ignoring_the_past: "Ignorar y seguir adelante"
 CSA_focus_ignoring_the_past_desc: "No podemos cambiar lo que ha estado muerto durante mucho tiempo y ha sucedido, así que ¿para qué molestarse? Ahora podemos asegurarnos a nosotros mismos y a nuestra sociedad y preparar y crear el futuro que queremos. Así que malditos sean aquellos que no pueden avanzar, sean dejados atrás, ¿no les parece?"
 CSA_focus_smrs_victory: "Victoria de la Sociedad Real Moderna del Sur"
 CSA_focus_smrs_victory_desc: "En una especie de suspiro de alivio, la Sociedad Real Moderna del Sur ha tomado la victoria en las elecciones. La sociedad, compuesta por exmiembros y miembros actuales del servicio militar, así como el Movimiento Monárquico Moderno del Sur, también conocido como la Casa de Meridian, ha entregado una victoria que muchos esperan que sea mucho más moderada a pesar de las duras realidades de la oposición. Solo queda esperar, sin embargo."
 CSA_focus_military_victory: "Una victoria militar"
 CSA_focus_military_victory_desc: "A raíz de la victoria de la Sociedad Real del Sur en las elecciones, el ala política de las fuerzas armadas ha tomado la delantera dentro de la coalición. Muchos esperan que el ejército cree un estándar de uniformidad, orgullo y simplemente una sensación de seguridad, ya que la función principal es defender y asegurar el bienestar de la nación. Algunos temen que el militarismo pueda ser explotado, pero la mayoría está sorprendentemente tranquila. De todos modos, sus aliados a través de la Casa de Meridian harán lo que puedan para ayudar y traer equilibrio a las decisiones políticas."
 CSA_focus_arms_economics: "Economía de armas"
 CSA_focus_arms_economics_desc: "La industria de armas, así como la industria de defensa en general, es algo que muchos no se dan cuenta de que puede contribuir a la economía. A través de la venta de armas pequeñas y equipos similares para la caza doméstica, así como acuerdos extranjeros, sentamos un precedente para hacer que la militarización de la economía siga siendo una economía funcional independientemente."
 CSA_focus_expanding_naval_industries: "Expansión de industrias navales"
 CSA_focus_expanding_naval_industries_desc: "The versatility that is the general naval industrial apparatus allows us to continue our economic militarization through flexible means. While most of these are dedicated to civilian affairs, the general metrics of ship building or naval based industrialization means converting these to military production will be a breeze."
 CSA_focus_corruption_affairs_administration: "Administración de asuntos de corrupción"
 CSA_focus_corruption_affairs_administration_desc: "La corrupción es la ruina de la existencia de cualquier sociedad funcional. Un ejército en sí mismo no es más que una sociedad dentro de la sociedad civil y es con este conocimiento que se creará un departamento independiente para auditar y manejar legalmente la corrupción y los asuntos internos fuera del aparato civil y militar. Después de todo, el poder corrompe, así que ¿por qué no dejar que aquellos que no necesitan poder lo usen para el bienestar de todos?"
 CSA_focus_central_southern_research_institute: "Instituto de Investigación del Sur Central"
 CSA_focus_central_southern_research_institute_desc: "El CSRI es un complejo de investigación y desarrollo conjunto civil y militar que buscará coordinar innovaciones militares y civiles y cómo algunas de estas innovaciones pueden combinarse entre sí. Como la historia misma ha demostrado, las innovaciones militares provocan innovaciones civiles y crean un bonito bucle de retroalimentación de algún tipo."
 CSA_focus_dixie_power_llc: "Dixie Power LLC"
 CSA_focus_dixie_power_llc_desc: "El establecimiento de una compañía de energía a nivel nacional nos permitirá orientar y ayudar a las comunidades y áreas que están más subdesarrolladas en comparación con el resto de la nación. Si bien las entidades privadas y locales continuarán como de costumbre, la compañía a nivel nacional actuará como un complemento y fuerza equilibrante para mantener la competencia a largo plazo. No solo eso, sino que esto nos permite invertir directamente en la creación de nuevas plantas de energía y expandir la red donde algunas compañías pueden verlo como una pérdida neta a corto plazo."
 CSA_focus_meridian_royal_victory: "Victoria Real de Meridian"
 CSA_focus_meridian_royal_victory_desc: "The Modern Royal Society known as the House of Meridian seeks to create a new way forward through combining old traditions with new ideals. Through reforms related to the principle of an elective monarchy the HoM wishes to reform this through changing the one thing which technically separates a monarch and royalty from any other system. That is by getting rid of the need of titles of offices being held by those of the blood. Instead office titles will simply be attached to those who are elected to said office. Now it won't be a little white lie to tell your daughter that she is a princess, cause one day she may well indeed be one."
 CSA_focus_titles_renewal_act: "Ley de renovación de títulos"
 CSA_focus_titles_renewal_act_desc: "Esta legislación es un paquete integral de reformas. Los trabajos gubernamentales relacionados con los titulares de cargos tendrán títulos apropiados. Un ejemplo sería que la oficina del presidente ahora se cambiaría a Rey del Sur. Con esto también viene la convención de nomenclatura para los titulares de cargos. En resumen, se basará en el uso del primer nombre. Comenzando con el actual Rey electo, si el Rey se llamara John, sería el Rey John I del Reino del Sur. Si en el futuro otro John es elegido, esa persona se convertiría en el Rey John II del Reino del Sur. Los antiguos titulares de títulos pueden renovar legalmente el título que una vez ocuparon por una tarifa anual, esta tarifa se utilizaría como fondo para ayudar a desarrollar económicamente la nación."
 CSA_focus_royal_energies_act: "La Ley de Energías Reales"
 CSA_focus_royal_energies_act_desc: "La REA es un paquete general de gastos para el desarrollo de energía que busca construir más instalaciones productoras de energía en toda la nación y hacer que esas mismas instalaciones sean más abastecidas y eficientes."
 CSA_focus_imperial_minerals_security_act: "Ley de Seguridad de Minerales Imperiales"
 CSA_focus_imperial_minerals_security_act_desc: "Nuestra vasta nación tiene grandes riquezas no explotadas. Para asegurar nuestra posición en el mercado global, debemos asegurar nuestros mercados nacionales. Por lo tanto, el financiamiento extensivo para mejorar, investigar y crear nuevas operaciones mineras que expandan nuestros recursos nacionales nos permitirá dejar una huella que tal vez nunca pensamos lograr."
 CSA_focus_making_an_economy: "Creando una Economía"
 CSA_focus_making_an_economy_desc: "Si queremos avanzar en el futuro cercano, realmente necesitamos tener una economía que nos ayude a llegar a donde necesitamos. Por lo tanto, se llevará a cabo un plan económico nacional para diversificar adecuadamente e invertir en nuestra nación en su conjunto, promoviendo la economía nacional y potenciando las especialidades de las economías locales."
 CSA_focus_royal_nation_proclaimed: "Reino Real Proclamado"
 CSA_focus_royal_nation_proclaimed_desc: "Con nuestras reformas y nuestra ciudadanía disfrutando de la nueva esperanza para nuestra nación, ahora es el momento de crear un nuevo camino hacia adelante, hacer de la identidad del Sur una realidad y dejar nuestra huella en la historia como una nación de unidad y movilidad social. En lugar de las cicatrices y dolores que algunos aún intentan marcarnos."
 CSA_focus_automation_integration_programs: "Programas de Integración de Automatización"
 CSA_focus_automation_integration_programs_desc: "The fears of change itself is a prevalent thing throughout human history. None more obvious than the fear of losing one's job and livelihood to provide for themselves or their family. But with innovation comes change and to change we must learn to adapt. Therefore businesses looking to implement automation or tech which potentially makes certain people's jobs redundant. Employees can apply for an automation retraining stipend which allows for the government to issue a pay grant for the period covering the time which the company needs to retrain the person. This way the individual still has a job, they learn a new skill and there is no earnest loss to the business."
 CSA_focus_tax_code_reforms: "Reformas al Código General de Impuestos"
 CSA_focus_tax_code_reforms_desc: "La implementación y la confusión, así como su naturaleza inflada, del antiguo código tributario, están en desesperada necesidad de una revisión. Por lo tanto, el gobierno nacional considera necesario reescribir todo el código y tomar varias sesiones legislativas para revisar individualmente las secciones del código. Este nuevo código, con suerte, será más fácil de aplicar, más fácil de comprender y lo suficientemente simple y directo para limitar no solo el impulso instintivo de encontrar un vacío legal, sino también para cerrar preventivamente los vacíos legales que eran comunes en los antiguos códigos."
 CSA_focus_military_expansions: "Expansiones Militares"
 CSA_focus_military_expansions_desc: "Our military is woefully under equipped to deal with any modern force, let alone to even defend from one. Therefore we must invest in general military expansion projects if we are to create a military worthy of our Southern tradition as well as creating a functional force to actually defend our homeland."
 CSA_focus_logistics_improvements: "Mejoras Logísticas"
 CSA_focus_logistics_improvements_desc: "Ya sea en el ámbito militar o civil, la logística juega un papel crucial en la funcionalidad de hacer las cosas ahora, en lugar de más tarde. Como tal, se crearán y construirán inversiones estratégicas en infraestructura ferroviaria, vial e internet, así como en necesidades logísticas para ayudar en tiempos de necesidad para ambos lados de la moneda social."
 CSA_focus_geological_and_mineral_institute: "Instituto Geológico y Mineral"
 CSA_focus_geological_and_mineral_institute_desc: "El GMI es una instalación dedicada a la investigación geológica y científica de minerales. El objetivo principal es invertir en la búsqueda y el desarrollo de nuevas innovaciones en métodos de extracción de recursos, purificación y levantamiento geológico. Este instituto, con financiamiento mixto y pesado, con suerte nos dará una ventaja en comparación con algunas naciones mientras encontramos nuevas formas de encontrar más y hacer más de lo que originalmente se consideraba mínimo o 'no vale la pena'."
 CSA_focus_southern_militarism: "Militarismo del Sur"
 CSA_focus_southern_militarism_desc: "La historia del Sur tiene una rica tradición de comandantes militares capaces y destreza táctica. Aunque algunos pueden ver que estratégicamente estamos fallando, no obstante, capitalizaremos esta tradición y buscaremos ampliar nuestro presupuesto militar para adquirir mejor equipo, aumentar la compensación de nuestros soldados y garantizar que su entrenamiento los refine para defender verdaderamente sus hogares."
 CSA_focus_from_past_pains_to_future_honors: "Dolores del Pasado, Honores del Futuro"
 CSA_focus_from_past_pains_to_future_honors_desc: "The past of our nation is soaked in the blood and riddled with the pains of all those who suffered for their times in history and the old ways. No more. We shall no longer be held hostage by old and delusional ideals of the past and instead we shall stab the ire of old with the pole of justice and freedom. We shall plant these very ideals into the foundation of our new and prosperous nation and set a new course to create new honors."
 CSA_focus_dixinomics: "Dixinómica"
 CSA_focus_dixinomics_desc: "Necesitamos poner nuestros pies en el suelo ahora. Una forma rápida de poner en funcionamiento la economía nuevamente es comenzar con una base para la que estas tierras fueron hechas, la agricultura. A partir de ahí, podremos analizar nuestra situación económica y decidir hacia dónde queremos ir de aquí en adelante."
 CSA_focus_department_of_energy: "Departamento de Energía"
 CSA_focus_department_of_energy_desc: "The DoE or some people refer to it as the Dixie Energy Department, is a national administrative branch which seeks to regulate as well as improve the cohesion of energy use and production. It doesn't have much to go off of, but it's a start to hopefully a truly brighter tomorrow."
 CSA_focus_electrical_storage_reforms: "Reformas en Almacenamiento Eléctrico"
 CSA_focus_electrical_storage_reforms_desc: "El ESR es una serie de inversiones en instalaciones de almacenamiento que esperan hacer que las subestaciones y transformadores en todo el país sean más eficientes y de mayor capacidad, hablando individualmente."
 CSA_focus_power_infrastructure_future_proofing: "Asegurando la Infraestructura Eléctrica para el Futuro"
 CSA_focus_power_infrastructure_future_proofing_desc: "La creación de infraestructura eléctrica, al igual que cualquier otra infraestructura, es que si se está construyendo sobre tierras ya desarrolladas, debe construirse para el futuro y no solo para el presente. Por supuesto, no tenemos una bola de cristal para ayudarnos, pero de todos modos podemos observar las tendencias históricas de urbanización para entender cómo implementar mejor la infraestructura eléctrica. No solo estamos creando las ciudades del mañana, sino también asegurándonos de que la infraestructura pueda satisfacer las necesidades energéticas del futuro."
 CSA_focus_investing_in_more_conductive_cables: "Invertir en Cables Más Conductivos"
 CSA_focus_investing_in_more_conductive_cables_desc: "Todos recuerdan que el cobre es un metal conductor, que toma y puede mantener la corriente eléctrica. Sin embargo, con las demandas modernas, necesitamos formas modernas de conductividad. Por lo tanto, invertiremos en cables mejores y más fuertes para permitir una red más estable y una red que pueda prepararse para las demandas futuras."
 CSA_focus_expanding_fossil_fuel_facilities: "Expansión de Instalaciones de Combustibles Fósiles"
 CSA_focus_expanding_fossil_fuel_facilities_desc: "El viejo confiable, a pesar de las constantes quejas de los defensores del medio ambiente, no pueden negar la realidad de que, a menos que quieran que todos pasen por apagones rotativos, las demandas energéticas modernas superan la supuesta 'razonable' tabla de tiempos de hacer todo renovable. Por lo tanto, debemos expandir una gama de plantas de combustibles fósiles como una forma de repartir las demandas individuales en lugar de confiar solo en el gas natural o el petróleo."
 CSA_focus_renewable_diversity: "Diversidad Renovable"
 CSA_focus_renewable_diversity_desc: "Our lands are made up of geographic regions which are suitable for the varied means of renewable energy methods. As such we shall invest in these regions to ensure our power needs are met through a diverse set of methods."
 CSA_focus_real_green_energy: "Energía Verde Real"
 CSA_focus_real_green_energy_desc: "The future be it fictional or reality itself is led by nuclear power. Currently nuclear energy has been the most developed energy method due to its checkered history. Granted all were either mother nature herself or human error, but regardless these mistakes have been studied, developed and now nuclear energy is becoming more and more practical as the days go on. So now we shall join the future and make our own nuclear energy."
 CSA_focus_brighter_tomorrow: "Un Mañana Más Brillante"
 CSA_focus_brighter_tomorrow_desc: "La independencia energética de nuestra nación es fundamental y, como tal, nuestra seguridad se fortalece indirectamente. Estos desarrollos y los futuros que vendrán harán que nuestros días venideros sean más brillantes de lo que alguna vez pensamos."
 CSA_focus_modern_agrinomics_plan: "Plan Agrinómico Moderno"
 CSA_focus_modern_agrinomics_plan_desc: "Un pilar clave en la sociedad es la capacidad de adquirir y tener alimentos para alimentar a su gente. Como tal, con las tecnologías modernas a las que tenemos acceso, así como las tierras que son tan fértiles para el uso agrícola, podemos orientar nuestra economía para que sea diversa pero especializada al mismo tiempo."
 CSA_focus_frontier_industrialism: "Industrialismo Fronterizo"
 CSA_focus_frontier_industrialism_desc: "El corazón del país tendrá los alimentos, la frontera tendrá la industria. Se creará un equilibrio donde el núcleo de nuestra justa nación estará en línea con el verdadero corazón económico que impulsa y hace que nuestra economía sea tan vibrante."
 CSA_focus_cash_crops: "Cultivos Comerciales"
 CSA_focus_cash_crops_desc: "Crops for cash and cash for crops, a great circle of economic and societal life itself. However some people value things a little more than other things and it is this value that we will use to spread the wealth of these crops to every state where and when possible. From cotton to tobacco we shall figure out a way to bring in the money with our national exports."
 CSA_focus_manufacturing_investments: "Inversiones en Manufactura"
 CSA_focus_manufacturing_investments_desc: "Our coastal states in the east and west are the perfect grounds for light and some heavy manufacturing. From the ports to the factories we can streamline basic supply chains and then be able to ship them to the agrarian heartlands or the industrial frontier states."
 CSA_focus_arms_production_investments: "Inversiones en Producción de Armas"
 CSA_focus_arms_production_investments_desc: "Our nation needs to defend itself and what better way than to set up a domestic arms market. Our lands are rich hunting grounds and if we need to invest in anything larger than that, then war time conversions shouldn't be too hard considering its a similar field of manufacturing."
 CSA_focus_naval_investments: "Inversiones Navales"
 CSA_focus_naval_investments_desc: "Las aguas costeras de nuestra nación son vastas y salvajes, debemos invertir no solo en el transporte marítimo nacional, sino también en la capacidad naval militar. El golfo es una cosa, pero el océano Atlántico en sí mismo plantea otro tipo de guerra naval con la que lidiar."
 CSA_focus_agrinomics_expansion: "Expansiones Agronómicas"
 CSA_focus_agrinomics_expansion_desc: "La tendencia de nuestro Plan Agronómico ha mostrado resultados que muchos hubieran considerado imposibles en esta era moderna. Sin embargo, con la determinación viene la fuerza de voluntad, y esa misma fuerza que es el corazón palpitante de nuestros ciudadanos ha puesto el esfuerzo y el tiempo para crear tales resultados. Tendremos una de las industrias agrícolas más fuertes del mundo y daremos un verdadero ejemplo de cómo vivir una vida más sencilla en estos días complejos y agotadores de 'modernidad'."
 CSA_focus_dixie_agrinomics_practice: "Práctica Agronómica Dixie"
 CSA_focus_dixie_agrinomics_practice_desc: "The DAP is an economic theory that provides a modern context to old style Agrarianism. Understanding the short falls of a pure Agrarian society we instead have reformed the economy to be well rounded and domestic focused, with the economic speciality of agriculture being the leverage for international support. When things go a little wrong internationally, we simply just have a better domestic supply to feed and grow our pop, maintain our military, schools, welfare and healthcare programs with foodstuffs and much more. It's a society of plenty, but plenty without all the negative influences of consumerism and \"the paradox of choice\" of a modern 4th Industrial Revolution Economy has."
 CSA_focus_department_of_natural_resources: "Departamento de Recursos Naturales"
 CSA_focus_department_of_natural_resources_desc: "La creación del DoNR es para centralizar y crear un enfoque uniforme nacional sobre cómo debemos manejar nuestros recursos naturales. Entendemos que tenemos depósitos minerales en las partes bajas de Mississippi y Alabama, tenemos acero, cobre y oro en Georgia, así como una buena mezcla de otras cosas a lo largo de las tierras que controlamos. Es esta comprensión la que plantea una pregunta interesante. ¿Deberíamos hacer solo lo suficiente, o deberíamos asegurar el potencial del futuro en sí mismo?"
 CSA_focus_the_future_is_now: "El futuro es ahora!"
 CSA_focus_the_future_is_now_desc: "Nuestra nación es nueva y relativamente vulnerable. Para asegurar nuestro futuro, asegurar nuestros hogares y asegurar nuestra forma de vida en sí misma. Nuestra nación debe y asegurará la excavación, utilización y mejorará las habilidades para cosechar sus recursos naturales."
 CSA_focus_dixie_lithium_belt: "Cinturón de Litio de Dixie"
 CSA_focus_dixie_lithium_belt_desc: "Recent geological survey data in the southern half of both Alabama and Mississippi going up into north Louisiana and potentially into Texas has seen a long strip of Lithium rich deposits. These new found deposits will do wonders to secure our tech needs in regards to battery and certain tech based manufacturing."
 CSA_focus_a_devils_deal_with_georgia: "Un trato con el diablo con Georgia"
 CSA_focus_a_devils_deal_with_georgia_desc: "The rich mineral state of Georgia has a mix of copper, iron, gold and much more. Therefore a mining and subsequent industrial hub around the Appalachian northern region of the state will be dedicated to finding, extracting and acquiring these great and diverse mineral resources."
 CSA_focus_black_gold_and_more: "Oro negro y más"
 CSA_focus_black_gold_and_more_desc: "Nuestra nación tiene una rica variedad de combustibles fósiles y otros recursos energéticos. Debemos asegurarnos de que se cosechen para garantizar que se satisfagan las necesidades energéticas de nuestra nación."
 CSA_focus_self_security_over_exhaustion: "Seguridad propia sobre el agotamiento"
 CSA_focus_self_security_over_exhaustion_desc: "Los recursos de nuestra nación pueden ser diversos y abundantes, pero la certeza de esto es desconocida. Como tal, debemos hacer solo lo necesario para asegurar la estabilidad y cohesión de nuestra economía y limitar la dependencia excesiva de potencias extranjeras."
 CSA_focus_little_lithium: "Pequeño litio"
 CSA_focus_little_lithium_desc: "LLM y LLA se refieren a las empresas de nueva creación de minería de litio en lo que se conoce como Little Lithium Mississippi y Alabama, respectivamente. Siendo parcialmente subsidiadas por el gobierno nacional, el objetivo es asegurar una necesidad nacional simple de litio para I+D, así como para uso comercial o manufacturero general."
 CSA_focus_buford_salem_project: "Proyecto Buford-Salem"
 CSA_focus_buford_salem_project_desc: "The BSP is a general investment series of mining start ups in Georgia and the Carolinas. Minerals like gold, copper, iron and much more are scattered throughout the Appalachian regions of these states. Therefore we can target each state and set them to mine a specific resource which will help general mining, plus if the future does genuinely demand it, their mining operations can help one another out in switching for what resource to look for."
 CSA_focus_petrochemical_diversity_programs: "Programas de diversidad petroquímica"
 CSA_focus_petrochemical_diversity_programs_desc: "The Petro Diversity Programs are a series of research and fossil fuel extraction initiatives to try and boost domestic energy independence as well as ensuring a small series of petrochemical related products."
 CSA_focus_ending_the_resource_debates: "Terminando los debates sobre recursos"
 CSA_focus_ending_the_resource_debates_desc: "Con una comprensión consciente y clara de cómo deseamos utilizar los recursos naturales de nuestra nación, ahora podemos declarar oficialmente al DoNR como una parte funcional de nuestro aparato nacional. Con este curso establecido, ahora aseguramos un camino hacia el futuro en el que deseamos esforzarnos."
 CSA_focus_modernized_dixinomics_program: "Programa de Dixinomía Modernizada"
 CSA_focus_modernized_dixinomics_program_desc: "With our nation having a history of being left behind it's no wonder many don't take us seriously. It is with this painful truth that we must force ourselves into the 21st century and join the industrialized economies of the world."
 CSA_focus_tech_industry_investments: "Inversiones en la Industria Tecnológica"
 CSA_focus_tech_industry_investments_desc: "Para comenzar nuestro viaje hacia la verdadera modernización, debemos asegurar inversiones reales para establecer el sector industrial tecnológico de nuestro sector de oficinas en general. Estas inversiones nos ayudarán a crear formas privadas de investigación e innovaciones dentro del sector tecnológico para permitir que nuestra nación comience a buscar el futuro de la innovación."
 CSA_focus_national_industrialization_efforts: "Esfuerzos de industrialización nacional"
 CSA_focus_national_industrialization_efforts_desc: "Las inversiones generalizadas en la industria y la manufactura apoyarán, diversificarán y empoderarán las diversas tierras y pueblos de nuestra nación con nuevos recursos y bienes que les permitirán disfrutar de un verdadero estándar de vida que tal vez no hayan experimentado antes."
 CSA_focus_banking_and_office_sector_jobs: "Banking & Office Sector Jobs"
 CSA_focus_banking_and_office_sector_jobs_desc: "Debemos invertir en la creación de empleos en el sector de oficinas y el sector bancario para impulsarnos fiscalmente y continuar la diversificación de nuestra economía."
 CSA_focus_armaments_investments: "Inversiones en armamentos"
 CSA_focus_armaments_investments_desc: "To secure such an economic growth we must build a sufficient armaments industry to supply and help arm our military forces."
 CSA_focus_shipping_industrial_expansions: "Expansiones industriales de transporte marítimo"
 CSA_focus_shipping_industrial_expansions_desc: "Con nuestra expansión comercial y manufacturera, también necesitaremos expandir nuestras capacidades de transporte marítimo. En consecuencia, también necesitaremos aumentar nuestro compromiso naval para asegurar que dicho transporte esté debidamente protegido si es necesario."
 CSA_focus_establishing_a_modern_dixie: "Estableciendo una Dixie moderna"
 CSA_focus_establishing_a_modern_dixie_desc: "The continued industrialization will put our nation on a higher standard than the old agrarian society could've even thought of. As such we'll ensure a new round of investments throughout our nation to secure this standard and better prepare our economy to be globally competitive."
 CSA_focus_modern_dixinomics_success: "Éxito de la Dixinomía moderna"
 CSA_focus_modern_dixinomics_success_desc: "With the programs, investments and so forth these past months we have created a well rounded and most diverse economy for which to secure our very national foundation. With this success we can seek out the means to an end for the future in which we want."
 CSA_focus_department_of_transportation: "Departamento de Transporte"
 CSA_focus_department_of_transportation_desc: "Establecer el DoT nos permitirá organizar los asuntos logísticos tanto de necesidades civiles como potencialmente militares en el futuro, si fuera necesario."
 CSA_focus_southeastern_highways_act: "Ley de Autopistas del Sureste"
 CSA_focus_southeastern_highways_act_desc: "The general improvement and flexibility of our highways is paramount for future proofing civilian automotive needs. This is even more apparent around the southeastern states which have most of the coastline, which in turn means more material transports to and from the ports."
 CSA_focus_greater_mississippi_highways_act: "Ley de Autopistas del Gran Misisipi"
 CSA_focus_greater_mississippi_highways_act_desc: "El río Misisipi es una de las mayores barreras naturales para nuestra defensa nacional. Sin embargo, también es nuestro mayor obstáculo natural para el flujo de tráfico civil. Por lo tanto, debemos invertir en los estados alrededor del Misisipi para asegurar una nación bien desarrollada y mejor conectada dentro de esta región del país."
 CSA_focus_reestablishing_the_southern_railway: "Restableciendo el Ferrocarril del Sur"
 CSA_focus_reestablishing_the_southern_railway_desc: "The Southern Serves The South, that was the model of the ole Southern Railway back before it was disastrously merged with the Norfolk & Western to form the cluster that was the Norfolk Southern. Well now we have a real chance to serve our Southern nation once more by raising this fallen flag and giving her new life."
 CSA_focus_reestablishing_the_mississippi_central: "Restableciendo el Mississippi Central"
 CSA_focus_reestablishing_the_mississippi_central_desc: "The MCRR or Mississippi Central Railroad was a decent Class 3 almost Class 2 railroad back in its day. But with having our own control of our own lands now we have the ability to revive this railroad and make it a nice western counterpart to the eastern Southern Railway. Working hand in hand these two as well as the other smaller railroads will be able to move tons upon tons of cargo throughout the nation."
 CSA_focus_dot_prioritized_budgeting: "Presupuesto Prioritario del DoT"
 CSA_focus_dot_prioritized_budgeting_desc: "The maintenance and improving of our infrastructure nationally is what makes a society function with peak cohesion. We therefore will prioritize budgeting around the initial amount we give to the Department of Transportation"
 CSA_focus_southern_military_forces: "Las Fuerzas Militares del Sur"
 CSA_focus_southern_military_forces_desc: "Las SMF son la columna vertebral de nuestra defensa nacional. Compuestas por las ramas del Ejército, la Armada y la Fuerza Aérea, estas ramas, para mantenerse verdaderamente al ritmo de nuestros enemigos, deben ser examinadas y desarrolladas en consecuencia. Porque no podemos permitirnos perder nuestra libertad recién adquirida tan pronto."
 CSA_focus_southern_army: "El Ejército del Sur"
 CSA_focus_southern_army_desc: "El Sur tiene una rica historia y tradición militar, pero con esto vienen algunos veteranos reacios a cambiar. Necesitamos comenzar con una reorganización inicial para asegurar que nuestro ejército empiece con el pie izquierdo en lugar del derecho, ¿de qué otra manera aprenderán a marchar?"
 CSA_focus_standardization_of_training_practices: "Estandarización de Prácticas de Entrenamiento"
 CSA_focus_standardization_of_training_practices_desc: "To ensure proper mobilization, should the need arise. We must create a uniformed standard for our training programs within the army. This allows us to train more soldiers at quicker rates as drill instructors learn the training regimens for basic training itself."
 CSA_focus_basic_industrial_support: "Apoyo Industrial Básico"
 CSA_focus_basic_industrial_support_desc: "Para operar un ejército realmente se necesita equipo. Por lo tanto, realizaremos algunas inversiones básicas en nuestra industria de defensa para mejorar nuestro creciente ejército."
 CSA_focus_logistical_centric_planning: "Planificación Centrada en la Logística"
 CSA_focus_logistical_centric_planning_desc: "LCP is a different approach to military operations than what standard doctrine would see practiced in the field. While our movements may be more sparse, our supply lines and ability to supply our troops will result in an overall efficiency increase. The hope is by tooling our doctrine and style of organization to be more logistically inclined, this'll allow us to be more thoughtful of how we plan while minimizing overall losses in equipment and hopefully troops themselves."
 CSA_focus_jrotc_education_requirements: "Requisitos Educativos del JROTC"
 CSA_focus_jrotc_education_requirements_desc: "La exposición pasiva al ejército es la mejor manera de atraer nuevos reclutas, así como de fomentar el orgullo nacional por las fuerzas armadas. Como tal, trabajaremos conjuntamente con las instituciones educativas y el ejército para crear un aparato dedicado a garantizar que los estudiantes realicen al menos dos años del programa JROTC durante sus años de escuela secundaria."
 CSA_focus_equal_opportunity_officer_training_program: "Programa de Entrenamiento de Oficiales de Oportunidad"
 CSA_focus_equal_opportunity_officer_training_program_desc: "To ensure the quality of leadership and that the leadership roles needed to organize a standing army are filled, we must create a new OTP or officer training program. The goal of the OOTP is to create an environment which encourages non-commissioned officers as well as civilians looking to join the military to apply and train to be an officer. This will function like a basic training but for the officer class, however it will have significantly more requirements and standards set to ensure the quality of our officer corps is kept in check."
 CSA_focus_well_rounded_army: "Ejército Bien Equilibrado"
 CSA_focus_well_rounded_army_desc: "Con nuestras reformas iniciales y nuevos estándares establecidos, nuestro ejército se ha vuelto lo suficientemente estable como para defenderse adecuadamente. Ahora tenemos la capacidad de destacarnos y establecer una especie de dirección que queremos que tome nuestro ejército para el futuro de nuestra defensa nacional y nuestra política exterior."
 CSA_focus_doctrine_debates: "Comienzan los Debates sobre la Doctrina"
 CSA_focus_doctrine_debates_desc: "Con la creación y la sólida base que hemos establecido con nuestra rama de servicio del ejército, ahora se ha hecho evidente que necesitamos entender la dirección o doctrina que utilizaremos para llevarnos a la victoria en el campo de batalla moderno. Como tal, debemos revisar nuestras opciones y comprender exactamente qué es lo que necesitamos para el futuro que deseamos para la rama."
 CSA_focus_civil_defense_doctrine: "Doctrina de Defensa Civil"
 CSA_focus_civil_defense_doctrine_desc: "La DDC es una doctrina de honor personal y orgullo. A través del uso de la cultura de caza y armas de nuestra región y la antigua US, podemos refinar programas independientes y regularlos para alinearlos con una especie de \"guardia nacional privada\". Esto significa que las unidades de milicia y organizaciones, así como los civiles semi-entrenados, serán más fáciles de querer unirse o reclutar si y cuando se lo exija el deber. Esto, por supuesto, significa que cualquier guerra ofensiva será vista con desdén, ya que la doctrina se centra más en la defensa del hogar que en la ofensiva personal. Pero estas supuestas tácticas de \"guerra de 3.5 generación\" ayudarán a mantener a nuestro enemigo adivinando."
 CSA_focus_funding_independent_company_programs: "Financiación de Programas de Compañías Independientes"
 CSA_focus_funding_independent_company_programs_desc: "Los ICPs son una serie de programas financiados a nivel nacional para establecer \"compañías\", o unidades locales independientes asignadas a un área o municipio específico. Por supuesto, el truco es que, en caso de una guerra defensiva, estas compañías, si es necesario, pueden ser convocadas para unirse al ejército regular hasta el final de dicha guerra."
 CSA_focus_rotc_and_jrotc_standards: "Estándares de ROTC & JROTC"
 CSA_focus_rotc_and_jrotc_standards_desc: "La implementación de los programas JROTC y ROTC en el sistema educativo fue una buena manera de exponer pasivamente a la población a la idea del ejército en su conjunto. Sin embargo, debemos reorganizar estos programas para garantizar y capacitar preventivamente a nuestros ciudadanos en cómo defender, liderar y entender por qué luchamos por el hogar y la patria."
 CSA_focus_continual_planning_doctrine: "Doctrina de Planificación Continua"
 CSA_focus_continual_planning_doctrine_desc: "La DPC es una doctrina centrada en el aparato de planificación del ejército. Las operaciones, inteligencia, y demás son influencias de la planificación y es con esta noción que nos preparamos con el conocimiento para refinar, mejorar y escalar la planificación misma para asegurar resultados sobre solo la fuerza bruta de material y mano de obra. Después de todo, la estrategia sin tácticas es la ruta más lenta hacia la victoria y, sin embargo, las tácticas sin estrategia son solo ruido antes de la derrota."
 CSA_focus_improving_logistical_standards: "Mejorando los Estándares Logísticos"
 CSA_focus_improving_logistical_standards_desc: "Mejorar nuestra capacidad para retener mejor nuestras necesidades logísticas será invaluable en esta nueva era de planificación de todo."
 CSA_focus_orienteering_proficiency_training: "Entrenamiento de Competencia en Orientación"
 CSA_focus_orienteering_proficiency_training_desc: "La broma del antiguo ejército es que los oficiales recién comisionados, o \"butter bars\", siempre se pierden fácilmente en el entrenamiento de navegación terrestre. Como tal, tomemos esto a pecho y hagamos de la navegación terrestre nuestro estudio principal. Esto permitirá que nuestra cohesión de fuerzas y comprensión del terreno sea mucho más flexible de lo que el entrenamiento tradicional permitiría."
 CSA_focus_shells_not_soldiers_doctrine: "Doctrina de Conchas, No Soldados"
 CSA_focus_shells_not_soldiers_doctrine_desc: "La doctrina SNS es una doctrina centrada en el material. Usando los principios de que los proyectiles, grandes o pequeños, son mejores en cantidad que simplemente poca mano de obra de calidad. El punto principal es que puedes hacer más balas y proyectiles más rápido de lo que puedes hacer un nuevo soldado estándar. Esto será un poco más exigente para nuestra economía, pero debería dar una mejor idea a todos para el esfuerzo de guerra que solo los soldados mismos, lo que lleva a una división social más cohesionada y menos impulsada por el ego sobre unirse o no al ejército."
 CSA_focus_increasing_production_abilities: "Aumentar las Capacidades de Producción"
 CSA_focus_increasing_production_abilities_desc: "Para mantenernos al día con una doctrina tan exigente, necesitamos entender cómo podemos aumentar la producción de materia prima con lo que ya tenemos."
 CSA_focus_logistical_elitism: "Elitismo Logístico"
 CSA_focus_logistical_elitism_desc: "Nuestra doctrina significa que necesitamos la capacidad de transportar y buscar todas estas balas, bombas y suministros. Por lo tanto, el cuerpo logístico será elevado a una especie de \"fuerzas especiales\" por derecho propio. No solo eso, en el combate moderno debemos hacer lo que podamos para proteger estos suministros vitales de las unidades aéreas enemigas, por lo que el énfasis en el cuerpo logístico también es un aumento en su probabilidad de muerte en, alrededor y cerca de cualquier guerra en la que nos encontremos."
 CSA_focus_true_southern_army: "Un Verdadero Ejército Sureño"
 CSA_focus_true_southern_army_desc: "Nuestros debates doctrinales han terminado, nuestro ejército es la máquina bien aceitada para asegurar nuestra nación y sus intereses. A partir de aquí creamos un pilar para consolidar un liderazgo de estado mayor verdaderamente moderno."
 CSA_focus_southern_air_force: "La Fuerza Aérea Sureña"
 CSA_focus_southern_air_force_desc: "La costa espacial, los hermanos Wright, estos son algunos ejemplos de la vibrante historia de nuestra nación con el vuelo mismo. Es esta historia la que asegura que la creación de una rama de servicio aérea no solo es una necesidad, sino también un derecho por tradición histórica. Crearemos una fuerza aérea para establecer un nuevo hito histórico y hacer que nuestros antepasados se sientan orgullosos."
 CSA_focus_air_r_and_d_department: "Departamento de I+D de la Fuerza Aérea"
 CSA_focus_air_r_and_d_department_desc: "Es necesario un departamento especializado dentro de la fuerza aérea para mantenerse a la vanguardia desde el punto de vista militar. Sin embargo, a través de la contratación civil, esto también puede servir para una aplicación civil, impulsando en general cosas como los viajes aéreos y las innovaciones en el transporte aéreo."
 CSA_focus_sky_defense_doctrine: "Doctrina de Defensa Aérea"
 CSA_focus_sky_defense_doctrine_desc: "Al priorizar los desarrollos en supremacía aérea, establecemos el punto de referencia para cómo equipamos y perfeccionamos nuestra fuerza aérea en el futuro."
 CSA_focus_raining_thunder_doctrine: "Doctrina del Trueno Lluvia"
 CSA_focus_raining_thunder_doctrine_desc: "This doctrine prioritizes the ground attack and bombing capabilities of our air force. This prioritization will rely on the current trend of aircraft development to be sufficient enough to deal with wresting control of the skies while whatever bombers we have will decimate enemy ground and naval forces to prevent any real harm done to our overall war fighting abilities. After all, factories can be rebuilt, soldiers killed can not."
 CSA_focus_wright_aircraft_production_company: "Compañía de Producción de Aeronaves Wright"
 CSA_focus_wright_aircraft_production_company_desc: "Los hermanos Wright fueron pioneros en el primer vuelo sostenido y sentaron las bases para una nueva comprensión del transporte. Ahora honramos su nombre estableciendo la compañía WAP en Carolina del Norte para la producción de aeronaves tanto civiles como militares."
 CSA_focus_production_alignments: "Alineación de Producción"
 CSA_focus_production_alignments_desc: "Nuestra nueva doctrina requiere que nuestra producción militar se reconfigure para garantizar que nuestra adopción coherente y el compromiso con dicha doctrina se cumpla."
 CSA_focus_the_blank_canvas_measurement: "La Medición del Lienzo en Blanco"
 CSA_focus_the_blank_canvas_measurement_desc: "Con nuestra elección de doctrina solidificada, preparamos el escenario para que nuestra fuerza aérea haga del campo de batalla moderno un lienzo en blanco sobre el cual nuestros ejércitos puedan marchar y crear una nueva imagen para que los mejores futuros se hagan realidad."
 CSA_focus_national_aviation_association: "Asociación Nacional de Aviación"
 CSA_focus_national_aviation_association_desc: "La NAA es un grupo de membresía conjunto militar y civil que organiza eventos en toda la nación para inspirar e informar al público sobre las bellezas del vuelo, las máquinas y las personas detrás de esas máquinas. La exposición pasiva brinda un buen impulso al reclutamiento militar mientras también crea una nueva generación de pilotos dispuestos, ya sean civiles o militares."
 CSA_focus_expanding_airbases: "Expansión de Bases Aéreas"
 CSA_focus_expanding_airbases_desc: "Si vamos a tener una fuerza aérea de tamaño razonable para defender adecuadamente nuestros cielos nacionales, debemos expandir la capacidad de varias bases aéreas estratégicas en todo el país."
 CSA_focus_southern_skies_for_southern_eyes: "Cielos del Sur Para Ojos del Sur"
 CSA_focus_southern_skies_for_southern_eyes_desc: "Our air force is a proud and determined branch which makes up but a portion of the Southern Military Forces. Just like the Army and the Navy we are proud and honored to create and have such a splendid service branch and their serving members which defend our skies above."
 CSA_focus_southern_navy: "Armada Sureña"
 CSA_focus_southern_navy_desc: "Despite the wealth of coastline we have our naval forces are not really the best. Most naval power comes from the Atlantic coastline or over there in the pacific. However given the Mississippi river and the gulf of Mexico, we do have ample training grounds to refine and make do with a naval force of our choosing."
 CSA_focus_naval_maintenance_standardization: "Estandarización del Mantenimiento Naval"
 CSA_focus_naval_maintenance_standardization_desc: "Nuestras instalaciones navales son muy especializadas y tienden a ser un poco un desastre logístico. Por lo tanto, necesitamos crear un estándar general para permitir la flexibilidad de las instalaciones con el fin de recibir cualquier barco que necesite reparaciones."
 CSA_focus_family_pay_incentives: "Incentivos de Pago Familiar"
 CSA_focus_family_pay_incentives_desc: "Los buques navales requieren mucha gente para operar, y las personas también estarán más o menos aisladas en cualquier misión o guerra en la que nos encontremos, durante días a la vez. Con esto en mente, debemos buscar una mejor justificación para que nuestro personal naval asuma tal carga, para que el pago tenga un estipendio familiar adaptativo que permita a los soldados cubrir no solo sus necesidades, sino también las de su familia en casa."
 CSA_focus_propulsion_testing_program: "Programa de Pruebas de Propulsión"
 CSA_focus_propulsion_testing_program_desc: "Modern ships are big and stuffed to the brim with a lot of weaponry. We need to find ways to make our vessels more agile, making sure the enemy wastes munitions and is forced to use heavy stuff like missiles. This soft form of attritional warfare at sea will allow us to hopefully keep a real standard with the added benefit of long term cost reductions in times of crisis."
 CSA_focus_njrotc_programs: "Programas NJROTC"
 CSA_focus_njrotc_programs_desc: "While the JROTC programs can be any service branch which the education institution would like to have a program there, naval programs are a lot more unique to give students real exposure to the navy itself. Therefore a certain radius of schools close to the coastline or Mississippi river will have dedicated Naval JROTC programs on top of what may be already present. The goal is to allow these naval JROTC programs to have funding and access to major water ways to allow for more hands on understandings of certain things the students could be expected to do if they chose to go into the navy."
 CSA_focus_general_training_improvements: "Mejoras Generales en el Entrenamiento"
 CSA_focus_general_training_improvements_desc: "El GTI es una serie de inversiones generales para asegurar la calidad y eficiencia de los escenarios de disparo y respuesta a crisis en el mar. En consecuencia, estos programas permitirán que las tripulaciones sean un poco más flexibles con la especialización en la clase de barco, siendo esto un paso siguiente en lugar del curso principal."
 CSA_focus_from_the_gulf_to_the_ocean: "Del Golfo Al Océano"
 CSA_focus_from_the_gulf_to_the_ocean_desc: "Con programas de refinamiento general y la solidificación de nuestra rama de servicio naval, nos complace decir que ahora tenemos las instalaciones para establecer, construir y defender nuestras aguas y rutas comerciales como cualquier otra nación."
 CSA_focus_what_color_water_debate: "Qué Color de Agua, Debate"
 CSA_focus_what_color_water_debate_desc: "Tener una fuerza naval suficiente para defender es una cosa, sin embargo, tenemos una verdadera elección que hacer para la seguridad futura de nuestra nación. El desarrollo de la marina de aguas verdes o azules preparará y ajustará nuestros desarrollos navales para responder y sentar un precedente que definirá nuestras fuerzas navales en el futuro."
 CSA_focus_if_it_floats_its_a_boat: "Si Flota, Es Un Barco"
 CSA_focus_if_it_floats_its_a_boat_desc: "Quantity over quality. The life long debate is something which many struggle with as each has its ups and downs. However we may have just found a way to make quantity viable again for a naval force. By shrinking, standardizing and streamlining things like ship designs and personnel training, we set up the game to allow our naval force to be responsive through volume rather than overtly precise strikes. The enemy morale will surely take a hint and seeing the ocean disappear into a wave of steel and guns."
 CSA_focus_the_steel_wave_doctrine: "La Doctrina de la Ola de Acero"
 CSA_focus_the_steel_wave_doctrine_desc: "La Doctrina de la Ola de Acero es una doctrina de cantidad centrada en escalar los barcos navales y el entrenamiento en torno a estos nuevos estándares más pequeños. Esta reescalabilidad nos permite desplegar más barcos a costa de habilidades ofensivas crudas. Esto significa que podemos maniobrar y responder con flexibilidad a las fuerzas navales enemigas de una manera más parecida a las hormigas hacia la miel."
 CSA_focus_ship_building_supremacy: "Supremacía en la Construcción Naval"
 CSA_focus_ship_building_supremacy_desc: "SBS es la dedicación de las industrias navales para ayudar y ser flexibles en la producción de barcos de flota en tiempos de guerra que puedan contribuir y asegurar el tamaño y la determinación de nuestro poder naval."
 CSA_focus_green_water_gremlins: "Gremlins de Agua Verde"
 CSA_focus_green_water_gremlins_desc: "El golfo de México es el campo de entrenamiento perfecto para nuestras fuerzas navales. Estas aguas costeras nos permitirán crear una marina que no necesite recorrer el mundo, sino que se limite a defender nuestras aguas con determinación y habilidad."
 CSA_focus_coastal_coordination: "Coordinación Costera"
 CSA_focus_coastal_coordination_desc: "Nuestras flotas necesitan entender cómo coordinarse mejor con las fuerzas terrestres y aéreas si quieren ser una parte de la máquina militar que son las Fuerzas Armadas del Sur."
 CSA_focus_submerged_animals: "Animales Sumergidos"
 CSA_focus_submerged_animals_desc: "Nuestra flota de submarinos debe ser tan letal como las imágenes que nuestra flota de superficie proporciona. Es con esta noción que adaptamos nuestra doctrina para hacer que estos animales de las profundidades se ganen la fama de ser tales animales."
 CSA_focus_blue_sea_sailors: "Marineros del Mar Azul"
 CSA_focus_blue_sea_sailors_desc: "El mundo está cubierto de aguas azul profundas y si vamos a responder a cualquier verdadera fuerza naval moderna debemos crear una marina que se ajuste a tal común."
 CSA_focus_fleet_standards_doctrine: "Doctrina de Estándares de Flota"
 CSA_focus_fleet_standards_doctrine_desc: "La FSD es una doctrina que refina y establece un estándar para el tamaño y composición de la flota para permitir que nuestra marina esté organizada de manera similar a como lo estaría un ejército. Esto permite una escalada adecuada de la fuerza, así como una respuesta a las fuerzas enemigas con flotas de composición similar."
 CSA_focus_seamen_for_a_sea_fleet: "Marineros para una Flota Naval"
 CSA_focus_seamen_for_a_sea_fleet_desc: "El entrenamiento y perfeccionamiento de nuestro personal naval para asegurar que se cumpla su calidad para flotas marítimas y oceánicas solidifica nuestra nueva doctrina para reorganizar nuestras industrias navales en consecuencia."
 CSA_focus_sailing_the_ocean_blue: "Navegando en el Océano Azul"
 CSA_focus_sailing_the_ocean_blue_desc: "El futuro de nuestra marina está sellado, hemos creado una fuerza que sentará un precedente para nuestra política nacional durante décadas. Esperemos haber hecho lo correcto para el bienestar de nuestra nación."
 CSA_focus_the_southern_general_staff: "El Estado Mayor del Sur"
 CSA_focus_the_southern_general_staff_desc: "El perfeccionamiento y desarrollo de nuestras fuerzas armadas ha visto al cuerpo de oficiales convertirse en un faro de reforma y esperanza para el futuro. Debemos usar esta innovación y destreza al máximo antes de que el tiempo se apodere de nosotros y comience a desgastar los excesos normales de la fragilidad humana."
 CSA_focus_southern_sunrise: "Un Amanecer del Sur"
 CSA_focus_southern_sunrise_desc: "Hemos reunido nuestras ideas y descubierto cómo funcionar como nación. Ya es hora de comenzar a pensar en algo más que en nosotros mismos en este punto. La pregunta es, ¿qué tipo de relaciones exteriores deberíamos tomar honestamente?"
 CSA_focus_the_golden_policy_plan: "El Plan de Política Dorada"
 CSA_focus_the_golden_policy_plan_desc: "La posición de nuestra nación, así como su estructura económica, permiten un enfoque único para la política exterior dentro de la región del Golfo. Es con esto en mente que podríamos revivir una antigua idea para consolidar nuestra nueva identidad nacional y eliminar el olor del federalismo de nuestra antigua unión."
 CSA_focus_subjugating_the_yellow_rose: "Subyugar la Rosa Amarilla"
 CSA_focus_subjugating_the_yellow_rose_desc: "Nuestro primer paso para revivir el Círculo Dorado es establecer nuestra entrada al jugador más grande del plan, que es México. Sin embargo, para llegar a México tendremos que pasar por Texas. Aunque compartimos muchas similitudes culturales, esperamos darles a los texanos lo que quieren, que es su identidad cultural. Después de todo, si le preguntas a un texano qué eran en los días de los EE. UU., te dirían: Somos texanos en primer lugar, sureños en segundo lugar y estadounidenses por último."
 CSA_focus_war_plan_rodeo: "Plan de Guerra Rodeo"
 CSA_focus_war_plan_rodeo_desc: "The Road to the Circle is met by the 2nd largest speed bump. This speed bump being of course the nation of Texas, and while yes there are similarly sized nations like Colombia and Venezuela, these do not compare in fighting spirit like that of the Texas people. Therefore only war is the way for which to secure and show these rodeo clowns just how the tables will indeed turn."
 CSA_focus_the_west_indies_whirlwinds: "Los Remolinos de las Indias Occidentales"
 CSA_focus_the_west_indies_whirlwinds_desc: "In order to secure the Golden Circle, we must also actually secure the internals which comprise the circle. Therefore we need to set the stage to focus and have our own set of island hopping if we are to achieve anything meaningful in the near future."
 CSA_focus_war_plan_guantanamo: "Plan de Guerra Guantánamo"
 CSA_focus_war_plan_guantanamo_desc: "There is clearly no real negotiating power with Cuba, they're too stuck in their ways with the influences of Castro still gripping them by the neck. So we go to war to free them and show them a real and fairer system."
 CSA_focus_hispaniola_heart_to_heart: "Hispaniola Corazón a Corazón"
 CSA_focus_hispaniola_heart_to_heart_desc: "Haiti is a mess, its neighbor the Dominican Republic is not all that better. We can incentivize these two through economic means and social stability through help with civil services. Just another step towards our golden goal."
 CSA_focus_hispaniola_hiccup: "Hispaniola Tropiezo"
 CSA_focus_hispaniola_hiccup_desc: "La isla de Hispaniola tiene una historia problemática incluso hasta el día de hoy. Es con esta noción que debemos asegurar la estabilidad de la isla mediante acciones rápidas y directas contra estos gobiernos fallidos. Para un mejor mañana, traeremos estabilidad a la isla y a su gente."
 CSA_focus_carribbean_cleanup: "Operación Limpieza Caribeña"
 CSA_focus_carribbean_cleanup_desc: "El estado de estos puntos en el mapa es variado e impredecible. No deberíamos esperar mucho de estas naciones y, como tal, nuestras fuerzas de invasión deberían poder barrer y limpiar las cosas y crear una nueva entidad política de unidad y estabilidad. No solo eso, sino que piensa en el monopolio del turismo que obtendremos, parece bastante bueno para mí."
 CSA_focus_british_concessions: "Concesiones británicas"
 CSA_focus_british_concessions_desc: "Para solidificar nuestra hegemonía regional, necesitamos encontrar diferentes formas de adquirir las tierras extranjeras que aún están bajo control europeo. Los británicos no están muy bien fiscalmente hablando, así que tal vez podamos simplemente comprarles las islas."
 CSA_focus_french_concessions: "Concesiones francesas"
 CSA_focus_french_concessions_desc: "Los franceses aún mantienen bastiones dentro de nuestros futuros planes regionales aquí en el Caribe. Necesitamos discutir algún tipo de resolución para poder solidificar nuestro control general del Caribe frente a potencias extranjeras fuera de nuestro hemisferio."
 CSA_focus_dutch_concessions: "Las concesiones holandesas"
 CSA_focus_dutch_concessions_desc: "One of the last bastions of European control here in the western hemisphere is that of the Netherlands with the island of Curacao. We should be able to grant them a generous lump sum to take it off their hands."
 CSA_focus_retooling_our_bureaucracy: "Reajustando nuestra burocracia"
 CSA_focus_retooling_our_bureaucracy_desc: "La naturaleza de los medios administrativos de nuestra nación está siendo llevada al límite. Debemos buscar actualizar, optimizar y organizar mejor si queremos mantener el ritmo de nuestras necesidades extranjeras y domésticas."
 CSA_focus_war_plan_aztec: "Plan de guerra Azteca"
 CSA_focus_war_plan_aztec_desc: "Ha llegado el momento de cruzar el Río Grande y asegurar nuestro frente sur. Después de todo, no puede haber inmigración ilegal, si ya están dentro de tus fronteras."
 CSA_focus_war_plan_fruit_basket: "Plan de guerra Canasta de frutas"
 CSA_focus_war_plan_fruit_basket_desc: "Las guerras bananeras fueron un tiempo interesante para los antiguos intereses extranjeros de Estados Unidos en Centroamérica. Bueno, ahora es el momento de tener nuestras propias guerras bananeras para asegurar la dominancia regional y asegurar el bienestar económico regional de los pueblos de estas tierras."
 CSA_focus_war_plan_canal_crosser: "Plan de guerra Cruzador del Canal"
 CSA_focus_war_plan_canal_crosser_desc: "Across the Panama and into the lands of the old Gran Colombian state. Once we solidify this southern front of Venezuela, Colombia and Panama, we will have but to simply clasp down and take hold of everything in between."
 CSA_focus_stabilizing_the_territories: "Estabilizando los territorios"
 CSA_focus_stabilizing_the_territories_desc: "Nuestras incursiones extranjeras han llegado a un punto crítico y, como tal, debemos tomar un respiro y recolectar y reorganizar nuestros nuevos territorios adquiridos."
 CSA_focus_dallas_dance: "El baile de Dallas"
 CSA_focus_dallas_dance_desc: "Integrar nuestras culturas y buscar más estabilidad en lugar de división nos permitirá tener a la población civil del estado de Texas más amigable hacia el liderazgo sureño sobre la región."
 CSA_focus_cuban_calm: "La calma cubana"
 CSA_focus_cuban_calm_desc: "El espectro de Castro ya no está. Ahora podemos llevar estabilidad a la antigua nación de Cuba y dejar que el pueblo se una con nosotros y consigo mismo."
 CSA_focus_western_civil_integrations: "Integraciones civiles occidentales"
 CSA_focus_western_civil_integrations_desc: "Las islas occidentales de La Española, Bahamas y Jamaica pueden iniciar iniciativas de integración mediante la introducción de servicios públicos más eficientes. En general, podremos al menos moderar la situación hasta que se oficialice por completo."
 CSA_focus_eastern_civil_integrations: "Integraciones civiles orientales"
 CSA_focus_eastern_civil_integrations_desc: "From Puerto Rico to Trinidad & Tobago, the eastern islands are small but numerous and as such we'll need to find ways to streamline and better integrate these islands with one another to set the stage for eventual true integration with our new regional union."
 CSA_focus_cartel_contingencies: "Contingencias del cartel"
 CSA_focus_cartel_contingencies_desc: "Las negociaciones con los carteles locales, la introducción de servicios civiles cohesivos y la búsqueda de formas de llevar estabilidad a la antigua nación de México nos permitirán ver el cumplimiento y la cooperación de las poblaciones locales para sentar las bases de nuestras uniones regionales."
 CSA_focus_centroamerican_unity: "Unidad centroamericana"
 CSA_focus_centroamerican_unity_desc: "Promover los valores y el regionalismo centroamericanos nos permitirá centrarnos en tener esta región como una pieza del mayor rompecabezas dorado. Esto permitirá una mejor integración con la unión regional mientras que también les dará una especie de doble orgullo."
 CSA_focus_golden_confederation_proclaimation: "La Confederación Dorada"
 CSA_focus_golden_confederation_proclaimation_desc: "Hoy es el día en que todo nuestro arduo trabajo rinde frutos, verduras, cigarros, azúcares y una plétora de productos económicos y alimenticios para disfrutar. Porque hoy ya no somos solo la \"nación del Sur\", ahora somos la Confederación Dorada y nos yerguemos con orgullo junto a nuestros hermanos y hermanas del Golfo, América Central y el Caribe, que conformaron una parte significativa de este hemisferio occidental. Hoy nos unimos y nos encaminamos hacia un futuro de unidad, prosperidad y un amanecer dorado que podamos contemplar con gracia, paz y tranquilidad. ¡Por la Confederación Dorada!"
 CSA_focus_old_glories_policy_plan: "El Plan de Política de las Viejas Glorias"
 CSA_focus_old_glories_policy_plan_desc: "At the height of its power the United States of America spanned from sea to shining sea. Basking in a continents' worth of natural resources it was matched by few abroad. However with massive power comes daunting responsibilities and the decadence that was the old order resulted in the great republic to finally collapse in on itself. Now we are in a very unique situation as we can set forth to recreate this greatness once more with a fresh slate and understanding. While a fair amount of people won't be too happy with this ambitious direction on foreign policy, we might as well do it now before the opportunity is lost forever."
 CSA_focus_great_northern_expedition: "La Gran Expedición del Norte"
 CSA_focus_great_northern_expedition_desc: "Para comenzar la gran reclamación, primero debemos marchar al norte y asegurar todo lo que podamos al este de la gran barrera que es el poderoso río Misisipi."
 CSA_focus_war_plan_superior: "Plan de Guerra Superior"
 CSA_focus_war_plan_superior_desc: "Our initial invasion must straddle our most western borders, from there it'll be easier to encircle and advance onto the more eastern opposition forces."
 CSA_focus_war_plan_appalachia: "Plan de Guerra Apalache"
 CSA_focus_war_plan_appalachia_desc: "La invasión de los Estados Libres asegurará la antigua sede del poder, Washington D.C. Esto se puede definir como el uso de la cordillera de los Apalaches a nuestro favor a medida que avanzamos hacia el noreste."
 CSA_focus_war_plan_greater_hudson: "Plan de Guerra Gran Hudson"
 CSA_focus_war_plan_greater_hudson_desc: "Desde el río Hudson hasta Maine, nos esforzamos por reclamar el noreste en su conjunto y traer de vuelta a la redil nuestro destino por el cual nos embarcamos. Porque con este último empuje, solidificamos nuestro control sobre la mitad oriental de nuestra futura gran Segunda República de América."
 CSA_focus_cultural_integration_plans: "Planes de Integración Cultural"
 CSA_focus_cultural_integration_plans_desc: "Debemos asegurarnos de no dividirnos tan fácilmente como lo hacía la antigua república. Por lo tanto, debemos planificar preventivamente para establecer un nuevo y moderno estándar de unidad e inclusión cultural entre nosotros."
 CSA_focus_midwestern_brothers: "Hermanos del Medio Oeste"
 CSA_focus_midwestern_brothers_desc: "Hunting is the best unifying trait that the south and midwest share. We can use this catalyst as a way to bring together and unite the regions together as one, using the differences in food as a way to create new foods and cultural unity. Not to mention mannerisms are not entirely that far apart from one another just expressed using different words."
 CSA_focus_capital_compromises: "Compromisos Capitalinos"
 CSA_focus_capital_compromises_desc: "The capital region also known as the Federalist States is a region fairly unique to the rest of the nation of the old republic. However where their culture may differ due to all the outer influences they make up more than enough with its history. The founding of both the articles of confederation, then the constitution as well as the nation itself stems from this focal region. As such we can make some compromises to allow for the preservation of this cultural neutrality and set forth a standard of unity through understanding and reason."
 CSA_focus_northeastern_needs: "Necesidades del Noreste"
 CSA_focus_northeastern_needs_desc: "Las personalidades audaces y variadas de la región del Noreste serán algo difíciles de integrar. Sin embargo, al atender más sus necesidades, establecemos un precedente de cuidado y amabilidad que algunos quizás no se habían dado cuenta de que deseaban. Desde el neoyorquino hasta el bostoniano, la variedad de personalidades que conforman la naturaleza única del noreste en su conjunto sentará las bases para el malestar. Pero si prestamos suficiente atención y realmente nos ocupamos de ellos, deberíamos esperar un camino más suave por delante. Sin mencionar que algunas de estas personalidades coinciden con ciertas regiones del Medio Oeste y el Sur, por lo que siempre podemos apelar a esas lo mejor que podamos."
 CSA_focus_organizing_the_east: "Organizando El Este"
 CSA_focus_organizing_the_east_desc: "Organizar nuestras ganancias orientales nos permite recolocar nuestra comprensión de los recursos que tenemos disponibles. Sin mencionar que esto nos ayuda a sentar las bases para comenzar nuestra expansión hacia el oeste cuando llegue el momento."
 CSA_focus_pacific_pearls: "Perlas del Pacífico"
 CSA_focus_pacific_pearls_desc: "Hoy nos ponemos en marcha hacia el oeste para completar nuestro destino. Desde el poderoso Misisipi, ahora trazamos el camino para adquirir las perlas del Pacífico y unir estas grandes tierras una vez más."
 CSA_focus_war_plan_houston: "Plan de Guerra Houston"
 CSA_focus_war_plan_houston_desc: "La República de Texas es una nación que, aunque pequeña, está muy bien motivada y conoce su territorio. Así que debemos aislarla y derrotarla antes de que sus ambiciones superen nuestra viabilidad de integrarlas adecuadamente."
 CSA_focus_war_plan_wheat_field: "Plan de Guerra Campo de Trigo"
 CSA_focus_war_plan_wheat_field_desc: "La República Lakota abarca gran parte de la antigua región de las grandes llanuras de la antigua república. Debemos asegurar esta canasta de pan y establecer planes de integración utilizando su espíritu aislado e independiente como una manera de comparar y unir con los de Medio Oeste y Sur."
 CSA_focus_war_plan_canyon: "Plan de Guerra Cañón"
 CSA_focus_war_plan_canyon_desc: "La Unión de Deseret es solo una unión en nombre, sus territorios son tan diversos en influencias de sus culturas circundantes e internas que invadirlos debería ser una tarea bastante sencilla, aparte del terreno mismo. Sin embargo, podemos usar esta falta de unidad para integrarlos en el futuro y darles una identidad verdadera y real a la que unirse."
 CSA_focus_war_plan_cascade: "Plan de Guerra Cascada"
 CSA_focus_war_plan_cascade_desc: "El noroeste del Pacífico, también conocido como la región Cascadia, es una de origen relativamente joven en términos de espíritu independiente. Como tal, esta juventud podemos utilizarla a nuestro favor en el futuro. Por ahora, debemos tener cuidado con cómo nos conducimos, ya que las montañas serán una tarea muy tediosa para intentar atravesarlas."
 CSA_focus_war_plan_gold: "Plan de Guerra Oro"
 CSA_focus_war_plan_gold_desc: "La fiebre del oro de los años 1800 vio a muchos dirigirse al estado de California, ahora nos ponemos en marcha e invadimos el estado de la fiebre del oro y completamos nuestra cruzada continental."
 CSA_focus_westward_integrations: "Integraciones hacia el Oeste"
 CSA_focus_westward_integrations_desc: "We'll begin integration and unity programs with the border territories. This sets the stage for a three phased general integration effort as the next phase will be the states around the Rockies."
 CSA_focus_rocky_mountain_integrations: "Integraciones en las Montañas Rocosas"
 CSA_focus_rocky_mountain_integrations_desc: "The Rocky Mountains are one of the greatest natural barriers and so integration of anything on or beyond them will be a bit harder than usual. However we can use this as a way to compromise and assess the needs of these areas that way these vast distances don't seem so far any more."
 CSA_focus_pacific_pacification_efforts: "Esfuerzos de Pacificación del Pacífico"
 CSA_focus_pacific_pacification_efforts_desc: "Estar a un continente de distancia significa que los programas tradicionales de unidad no van a ser los más fáciles de llevar a cabo. Por lo tanto, necesitaremos integrar nuevos servicios civiles y garantizar la estabilidad dentro de la región para luego permitir que nuestros esfuerzos de integración den frutos."
 CSA_focus_the_second_republic: "La Segunda República"
 CSA_focus_the_second_republic_desc: "After so long we have done it, today we can declare the 2nd American Republic and set forth a new destiny for which we have manifested through true grit and hard work. A new dream has become a new reality and it is now our job to set forth a new beginning for which we can be proud of."
 CSA_focus_cajun_way_forward: "El Plan de Política Cajún"
 CSA_focus_cajun_way_forward_desc: "A significant influence on our culture can stem from the Cajun and Creole peoples around and in the state of Louisiana. This significant influence traces back to the old French territory of Louisiana which had replaced the lost Acadian colony the French had in Canada and New England. As such we believe that a better foreign policy plan would be to rediscover these roots and take inspiration from the old and give new light. Thus we shall begin national directive Arcadia and set forth to make a new name for ourselves."
 CSA_focus_midwestern_meltdowns: "Colapsos del Medio Oeste"
 CSA_focus_midwestern_meltdowns_desc: "The Great Lakes Confederation is a vital logistical hub, be it railroads that spin like a web from Chicago, or the rivers of the Mississippi and Ohio. The region is ripe for the picking and now all's we need to do is just set the stage to lay out our potential justifications."
 CSA_focus_war_plan_windy_city: "Plan de Guerra Ciudad de los Vientos"
 CSA_focus_war_plan_windy_city_desc: "Ha llegado el momento de incorporar a nuestros hermanos y hermanas del Medio Oeste. De solidificar nuestras culturas y unirnos como un solo pueblo nuevo nacido de las cenizas de la antigua república y de este estado pseudo-tribal."
 CSA_focus_capital_crisis: "Crisis Capitalina"
 CSA_focus_capital_crisis_desc: "La región capitalina no tiene cultura, excepto por ser el 'hogar' de los ideales federalistas del pasado. Por lo tanto, podemos proceder rápidamente a establecer reclamaciones y condiciones de crisis para actuar en consecuencia."
 CSA_focus_war_plan_arlington: "Plan de Guerra Arlington"
 CSA_focus_war_plan_arlington_desc: "El momento ha llegado, lancémonos sobre los enemigos del nuevo mundo, pues en la capital solo piensan en el pasado. Ahora es el momento de mostrarles el futuro."
 CSA_focus_northeastern_nagging: "Molestias del Noreste"
 CSA_focus_northeastern_nagging_desc: "Las personalidades combativas del pueblo neoyorquino facilitarán el aumento de tensiones, preparando el escenario para implicar a sus supuestos vecinos más pasivos."
 CSA_focus_war_plan_tea_party: "Plan de Guerra Fiesta del Té"
 CSA_focus_war_plan_tea_party_desc: "Ahora que el juego está listo, podemos avanzar hacia el noreste y consolidar nuestro control sobre la mitad oriental del antiguo territorio continental de los Estados Unidos. Esto sienta las bases para nuestra nueva identidad, para nuestra estabilidad regional y para un futuro que podemos forjar por nosotros mismos."
 CSA_focus_border_settlements: "Asentamientos Fronterizos"
 CSA_focus_border_settlements_desc: "Derribar antiguas fronteras y crear nuevos asentamientos nos permite integrar y mezclar mejor las diferentes culturas, un verdadero primer paso hacia adelante."
 CSA_focus_chicago_cheers: "Vítores en Chicago"
 CSA_focus_chicago_cheers_desc: "Chicago es el corazón del Medio Oeste, y debe ser tratado como tal. Por ello, utilizaremos la Ciudad de los Vientos para compartir diferencias culturales y celebrar nuestra unidad como una familia de pueblos."
 CSA_focus_detroit_delight: "Delicia de Detroit"
 CSA_focus_detroit_delight_desc: "While Chicago may be the heart, then Detroit might as well be the lungs of the Midwest. Setting the stage for manufacturing companies big and small, Detroit will be a good second staging ground for our cultural celebrations and integration efforts."
 CSA_focus_crossing_more_than_the_delaware: "Cruzando Más que el Delaware"
 CSA_focus_crossing_more_than_the_delaware_desc: "Sobre las colinas y más allá, a través de D.C., Filadelfia y hasta la bahía, viajamos lejos para llevar calma a estas tierras de conflictos. Ahora es el momento de traer cohesión y estabilidad a esta región."
 CSA_focus_boston_beautiful: "Hermosa Boston"
 CSA_focus_boston_beautiful_desc: "Brindar servicios civiles y restaurar la calma en la región nos permitirá organizar eventos y celebraciones en Boston. Donde la revolución de antaño comenzó con la Fiesta del Té, ahora iniciaremos las celebraciones del futuro al unirnos más como una gran familia."
 CSA_focus_a_new_beginning: "Un Nuevo Comienzo"
 CSA_focus_a_new_beginning_desc: "Ahora comienza el proceso de renovación, un nuevo comienzo y una nueva era para nuestro pueblo."
 SRA_idea_railroad_mania: "Locura Ferroviaria"
 SRA_idea_railroad_mania_desc: "El tren, por su naturaleza, es el vehículo terrestre más poderoso. Y las locomotoras de la República Sureña son la fuerza detrás de los muelles, las industrias y las ramificaciones ferroviarias que conformarán nuestra futura red ferroviaria de renombre mundial. No solo construiremos, sino que también contaremos las historias de nuestros grandes ferrocarriles del sur."
 SRA_idea_department_for_transport_innovation: "Departamento de Innovación en Transporte"
 SRA_idea_department_for_transport_innovation_desc: "Dedicated to the wholesale initiative of developing better, more advanced and more efficient ways of transporting both people and goods alike. The DTI is the result of dedicated funding to achieving such goals."
 SRA_idea_promoting_agriculture_influence: "Promoting Agricultural Influence"
 SRA_idea_promoting_agriculture_influence_desc: "Nuestras tierras son perfectas para el cultivo de productos agrícolas esenciales a nivel mundial. Aunque no necesitamos que nuestra economía dependa completamente de ello, sin duda podemos usar esta ventaja para ejercer influencia de manera sutil y garantizar nuestras necesidades internas."
 SRA_idea_old_habits_new_hopes: "El Sueño Sureño"
 SRA_idea_old_habits_new_hopes_desc: "Hemos construido una gran nación, una para todos y donde todos pueden estar para uno. Esta realidad ha tomado una cantidad considerable de tiempo en asegurarse y con ello viene la necesidad de sacudirnos las cadenas de nuestro pasado. Abrazarnos en el presente, así como crear y forjar un futuro para todos los ciudadanos del Sur sin importar cómo luzcan. Hemos hecho y haremos, Un Sueño Sureño."
 SRA_idea_historical_innovation_classes: "Clases de Innovaciones Históricas"
 SRA_idea_historical_innovation_classes_desc: "La historia del Sur es una historia de desarrollo agrícola. Ahora bien, si bien debemos asegurarnos de que las partes malas de nuestra historia sean enseñadas y comprendidas, también debemos hacer primordial que la verdadera innovación se realice cuando un problema se vuelve grave. En ese sentido, en su lugar, nos enfocaremos en el problema perpetuo de la seguridad alimentaria y la investigación agrícola, lo que dejará nuestra marca en el mundo y nos dará un sello cultural en la comunidad científica."
 SRA_idea_agricultural_industrialism: "Industrialismo Agrícola"
 SRA_idea_agricultural_industrialism_desc: "La agricultura es la base fundamental de una sociedad funcional. A través de inversiones en la diversificación de todo el sector agrícola, podemos garantizar que nuestros desarrollos industriales no solo satisfagan sus demandas básicas de la sociedad, sino que también puedan optimizar, expandir y hacer crecer nuestra joya de la corona que es nuestro sector agrícola."
 SRA_idea_expanded_corps_of_engineers: "Cuerpo de Ingenieros Expandido"
 SRA_idea_expanded_corps_of_engineers_desc: "With the expansion of our Corps of Engineers we can incorporate a civilian extension of the Corps and apply several peace time abilities. Consequently this gives a reserve force which could be mobilized if need be to help with military logistics and back line defensive works."
 SRA_idea_a_southern_dream: "Un Sueño Sureño"
 SRA_idea_a_southern_dream_desc: "Nuestras tierras, nuestra gente, nuestra familia. Nuestro destino es sureño y el sueño de comodidad, familia y el espíritu del Sur es lo que nos esforzamos en garantizar que cada ciudadano disfrute. Porque no hay nada mejor que el hogar y la comida casera de mamá."
 SRA_idea_industrial_stagnation: "Doctrina de Estancamiento Industrial"
 SRA_idea_industrial_stagnation_desc: "El sector agrícola es la columna vertebral de la civilización, y esta columna vertebral debe ser cuidada y reforzada en su totalidad. Por lo tanto, debemos cambiar la mentalidad de cómo desarrollamos nuestra nación en su conjunto para asegurarnos de que esta columna vertebral no se vuelva frágil y desaparezca."
 SRA_idea_nature_navigators: "Navegantes de la Naturaleza"
 SRA_idea_nature_navigators_desc: "Con una geografía tan diversa, nuestra capacidad de entrenar y perfeccionar de manera integral a nuestros soldados permite no solo que nuestros hombres en tierra tengan flexibilidad, sino que nuestros pilotos también obtengan una mejor comprensión de cómo rastrear los movimientos enemigos en terrenos difíciles de detectar."
 SRA_idea_historical_scars: "Cicatrices Históricas"
 SRA_idea_historical_scars_desc: "Sometimes it's best to not forget the past. But those pains leave scars, and though our nation has come a long way, the national and somewhat international stigma around our very existence is still something which is of hesitation. Maybe some day we can truly move on..."
 SRA_idea_ignoring_the_past: "Ignorando el Pasado"
 SRA_idea_ignoring_the_past_desc: "El pasado es exactamente eso, el pasado. No se puede cambiar, así que ¿por qué preocuparse por él? Además, tenemos el presente y nuestro futuro de los que preocuparnos."
 SRA_idea_from_past_scars_to_future_honors: "De Cicatrices del Pasado a Honores del Futuro"
 SRA_idea_from_past_scars_to_future_honors_desc: "No nos quedaremos más atrapados en el pasado y sus horrores. Ahora miraremos hacia adelante juntos como una familia sureña y buscaremos defendernos unos a otros de los enemigos que desean arrebatarnos nuestra recién encontrada libertad. Por la familia, los amigos y el hogar, Por la Nación Sureña!"
 SRA_idea_formalized_department_of_energy: "Departamento de Energía Formalizado"
 SRA_idea_formalized_department_of_energy_desc: "With the establishment and investments made into the DoE, we can now look to better attend to our nation's energy needs."
 SRA_idea_from_theory_to_practice: "De la Teoría a la Práctica"
 SRA_idea_from_theory_to_practice_desc: "The Dixie Agrinomics Theory has proven way more sustainable and tamer in reliance of a more domestic focus economy. Of course we still do global trade but where we trade what we genuinely have in excess, we get in return imports of a whole variety of quality."
 SRA_idea_formalized_department_of_natural_resources: "Departamento de Recursos Naturales Formalizado"
 SRA_idea_formalized_department_of_natural_resources_desc: "Con los grandes debates sobre los recursos ya resueltos, hemos establecido oficialmente la base de funcionalidad para el Departamento de Recursos Naturales. Ahora, el rumbo está fijado para la mejora de nuestra nación y para la construcción de un futuro más brillante."
 SRA_idea_a_modern_dixie: "Un Dixie Moderno"
 SRA_idea_a_modern_dixie_desc: "The well rounded and diverse nature of our Modernized Dixinomics Program has seen us rise to new standards of economic power and quality of life than ever before. We now have a foundation for which we can secure the future we want and will have."
 SRA_idea_priority_budgeting: "Presupuesto Prioritario"
 SRA_idea_priority_budgeting_desc: "Con el Departamento de Transporte recibiendo la primera prioridad en el presupuesto, podremos perfeccionar, adaptar y expandir nuestra infraestructura para satisfacer las necesidades siempre cambiantes de nuestra nación, ya sean civiles o militares."
 SRA_idea_civil_defense_doctrine: "Doctrina de Defensa Civil"
 SRA_idea_civil_defense_doctrine_desc: "La Doctrina de Defensa Civil combina el sistema de milicia con influencias del ejército regular. De alguna manera, se supone que es un puente entre la guerra moderna tradicional y lo que se conoce como \"guerra de cuarta generación\". Algunos en el departamento de registros han comenzado a bromear poniendo \"guerra de tercera y media generación\" como un nombre alternativo para la doctrina."
 SRA_idea_civil_defense_doctrine_one: "Doctrina de Defensa Civil"
 SRA_idea_civil_defense_doctrine_one_desc: "La Doctrina de Defensa Civil combina el sistema de milicia con influencias del ejército regular. De alguna manera, se supone que es un puente entre la guerra moderna tradicional y lo que se conoce como \"guerra de cuarta generación\". Algunos en el departamento de registros han comenzado a bromear poniendo \"guerra de tercera y media generación\" como un nombre alternativo para la doctrina."
 SRA_idea_continual_planning_doctrine: "Doctrina de Planificación Continua"
 SRA_idea_continual_planning_doctrine_desc: "La CPD es una doctrina de refinamiento y perseverancia que utiliza el aparato de planificación de la funcionalidad del ejército para mejorar la cohesión general entre los elementos de combate y logísticos del ejército."
 SRA_idea_continual_planning_doctrine_one: "Doctrina de Planificación Continua"
 SRA_idea_continual_planning_doctrine_one_desc: "La CPD es una doctrina de refinamiento y perseverancia que utiliza el aparato de planificación de la funcionalidad del ejército para mejorar la cohesión general entre los elementos de combate y logísticos del ejército."
 SRA_idea_shells_not_soldiers_doctrine: "Doctrina de Proyectiles en Lugar de Soldados"
 SRA_idea_shells_not_soldiers_doctrine_desc: "The SNS doctrine is a straight forward, material supremacy doctrine. While more costly to us economically, it would cost us way more as a society to lose more men and soldiers than it would bullets and bombs."
 SRA_idea_shells_not_soldiers_doctrine_one: "Doctrina de Proyectiles en Lugar de Soldados"
 SRA_idea_shells_not_soldiers_doctrine_one_desc: "La doctrina SNS es una doctrina de supremacía material directa. Aunque nos resulte más costosa económicamente, perder más hombres y soldados nos costaría mucho más como sociedad que perder balas y bombas."
 SRA_idea_airforce_sky_defense_doctrine: "Doctrina de Defensa Aérea"
 SRA_idea_airforce_sky_defense_doctrine_desc: "La SDD es una doctrina enfocada en la superioridad selectiva para mantener el control del espacio aéreo. Esta prioridad hará que las incursiones de bombardeo sean más efectivas, aunque retrasará nuestras innovaciones en desarrollo de bombardeos debido a la falta de atención en este ámbito."
 SRA_idea_airforce_raining_thunder_doctrine: "Doctrina de Trueno Atronador"
 SRA_idea_airforce_raining_thunder_doctrine_desc: "Al priorizar nuestras capacidades de bombardeo, aumentamos nuestra habilidad para infligir graves daños a las fuerzas enemigas en el propio campo de batalla."
 SRA_idea_airforce_sky_defense_doctrine_one: "Doctrina de Defensa Aérea"
 SRA_idea_airforce_sky_defense_doctrine_one_desc: "La SDD es una doctrina enfocada en la superioridad selectiva para mantener el control del espacio aéreo. Esta prioridad hará que las incursiones de bombardeo sean más efectivas, aunque retrasará nuestras innovaciones en desarrollo de bombardeos debido a la falta de atención en este ámbito."
 SRA_idea_airforce_raining_thunder_doctrine_one: "Doctrina de Trueno Atronador"
 SRA_idea_airforce_raining_thunder_doctrine_one_desc: "Al priorizar nuestras capacidades de bombardeo, aumentamos nuestra habilidad para infligir graves daños a las fuerzas enemigas en el propio campo de batalla."
 SRA_idea_steeL_wave_doctrine: "Doctrina de la Ola de Acero"
 SRA_idea_steeL_wave_doctrine_desc: "The SWD is the refinement of quantity over quality in naval terms. This means that an overall reduction in training and ship sizes will allow us to field more vessels and be more alert and responsive to enemy forces."
 SRA_idea_steeL_wave_doctrine_one: "Doctrina de la Ola de Acero"
 SRA_idea_steeL_wave_doctrine_one_desc: "La SWD es el refinamiento de la cantidad sobre la calidad en términos navales. Esto significa que la reducción general en el entrenamiento y el tamaño de los barcos nos permitirá desplegar más embarcaciones y estar más alerta y preparados ante las fuerzas enemigas."
 SRA_idea_green_water_gremlins: "Duendes del Agua Verde"
 SRA_idea_green_water_gremlins_desc: "Las aguas costeras son las únicas que debemos preocuparnos por proteger. Por lo tanto, entrenaremos y mejoraremos nuestro aparato naval en torno a esta idea para garantizar la seguridad total de nuestra nación."
 SRA_idea_green_water_gremlins_one: "Duendes del Agua Verde"
 SRA_idea_green_water_gremlins_one_desc: "Las aguas costeras son las únicas que debemos preocuparnos por proteger. Por lo tanto, entrenaremos y mejoraremos nuestro aparato naval en torno a esta idea para garantizar la seguridad total de nuestra nación."
 SRA_idea_fleet_standards_doctrine: "Doctrina de Estándares de Flota"
 SRA_idea_fleet_standards_doctrine_desc: "Esta doctrina nos permite crear mini flotas que pueden responder con flexibilidad a las fuerzas enemigas. Esto permite que nuestra armada, en su conjunto, evite movimientos imprudentes y, al mismo tiempo, brinde a las tripulaciones y al liderazgo experiencia suficiente mediante estos formatos estandarizados de composición de flota."
 SRA_idea_fleet_standards_doctrine_one: "Doctrina de Estándares de Flota"
 SRA_idea_fleet_standards_doctrine_one_desc: "Esta doctrina nos permite crear mini flotas que pueden responder con flexibilidad a las fuerzas enemigas. Esto permite que nuestra armada, en su conjunto, evite movimientos imprudentes y, al mismo tiempo, brinde a las tripulaciones y al liderazgo experiencia suficiente mediante estos formatos estandarizados de composición de flota."
 SRA_idea_southern_general_staff: "Estado Mayor Sureño"
 SRA_idea_southern_general_staff_desc: "Las Fuerzas Militares Sureñas han desarrollado y refinado sus ramas individuales hasta alcanzar un gran nivel, y además estos avances han llegado hasta el cuerpo de oficiales y el Estado Mayor. La riqueza de experiencia se utilizará para mantenernos a la vanguardia y esperar que los futuros sureños puedan disfrutar y enorgullecerse de esta tradición militar."
 SRA_idea_retooling_administrative_means: "Reestructuración de los Medios Administrativos"
 SRA_idea_retooling_administrative_means_desc: "Through the means of our ambitious foreign policy strategy, we've begun to have some administrative draw backs. We'll need to handle these excesses and get them under control if we are to more cohesively move our way forwards."
 SRA_idea_cultural_integrations_program: "Programas de Integración Cultural"
 SRA_idea_cultural_integrations_program_desc: "The biggest fault of the old republic was the inflexibility to understand, adapt and integrate the differing sub-cultures which comprised it. We shall not make that mistake and instead begin cultural sharing and integration programs with the different regions so there is no individualism through these sub-cultures. Rather these will be pieces to the puzzle of our new American culture and way of life."
 SRA_idea_the_second_american_republic: "La Segunda República Americana"
 SRA_idea_the_second_american_republic_desc: "A través del sudor de nuestra frente y grandes esfuerzos, hemos creado la Segunda República. Ahora tenemos un nuevo comienzo con un futuro lleno de posibilidades casi infinitas."
 southern_republic_divided_we_fell: "Divididos Caímos"
 southern_republic_divided_we_fell_desc: "The union is no more, now lies a shattered mirror of sub-cultures and ashes from its violent demise. We must figure out how to hold our own before we can truly move on and go anywhere if we plan on becoming a true and independent nation."
 southern_republic_domestic_policies: "Políticas Domésticas Sureñas"
 southern_republic_domestic_policies_desc: "A pesar de la historia manchada de blanco y negro, así como de rojo sangre, que ha tenido el Sur, los cambios demográficos modernos han moderado en gran medida las fuerzas más extremas que alguna vez estuvieron en juego. Sin embargo, esas mismas fuerzas han evolucionado y parecen no querer desaparecer sin resistencia, por decirlo de alguna manera. No obstante, debemos superar estos excesos y garantizar la tranquilidad y supervivencia de nuestra nueva nación. Después de todo, ya saben que tenemos una reputación que mantener con la hospitalidad sureña."
 southern_republic_federal_budgets: "Gastos del Gobierno"
 southern_republic_federal_budgets_desc: "El gobierno central de la SRA o República Sureña es, cuanto menos, peculiar. Dado que a nadie le gusta realmente la palabra \"federal\", la evitan utilizando términos como 'gastos gubernamentales'. Independientemente de los malabares mentales que la gente haga, el gobierno central de la república es un acto de equilibrio entre proveer a la gente y evitar caer en el mismo camino que llevó a la antigua unión a su desaparición."
 southern_republic_industrial_policies: "Departamento de Industrialización Sureña"
 southern_republic_industrial_policies_desc: "El DID... jeje, 'hizo', bueno, en fin. El Departamento de Industrialización Sureña se encarga exactamente de lo que dice, industrializar y desarrollar continuamente la nación. Nuestra tierra solo puede dar tantos cultivos, así que tendremos que luchar para mantenernos al ritmo de la mayoría de las demás naciones."
 southern_republic_resource_management_policies: "Administración de Gestión Sureña"
 southern_republic_resource_management_policies_desc: "La DMA tiene la tarea de organizar la fuerza laboral disponible, así como de garantizar que las industrias clave de nuestra nación puedan acceder a materias primas fácilmente disponibles. En otras palabras, la minería y la agricultura suelen estar bajo la supervisión de la DMA."
 southern_republic_tax_policies: "Departamento de Donaciones de Dixie"
 southern_republic_tax_policies_desc: "Here we go again with the loop-de-looping, the DDD or as some joke, the Dixie Asking Department, is responsible for organization and implementation of the tax codes of the nation to ensure a general balancing of the books. They expect ups and downs, but they don't like the word taxes as many of the population were either a part of or aligned more with the old Libertarian Party of the union."
 southern_republic_army_service_branch: "El Ejército del Sur"
 southern_republic_army_service_branch_desc: "The SAB or Southern Army is a highly traditional branch of the Southern Military Forces. Its honoring of historic military leaders that were born and from its territory means it tends to do a lot more training and imposes higher standards for its officer corps than it really should for its regular infantryman. Regardless the army is gonna have to take a long look at itself and figure out what earnest direction it wishes to go if its to defend its homeland or seek new adventures."
 southern_republic_air_force_service_branch: "Fuerza Aérea del Sur"
 southern_republic_air_force_service_branch_desc: "The Southern Air Force or SAF is a sort of neglected step child in terms of honest investment into its training and R&D department. Nevertheless with the influences of the Space Coast in Florida as well as several prominent airbases that are located in the Southern Republic, the Air Force makes do with what they got. But if the nation is to properly defend itself it's certainly going to need something more than what it's got."
 southern_republic_navy_service_branch: "Servicio Naval del Sur"
 southern_republic_navy_service_branch_desc: "El SNS o a veces simplificado a la Armada del Sur, es un servicio bastante robusto. Dado que la nación abarca prácticamente un tercio de las tierras costeras del Golfo de México, hay muchas instalaciones civiles y militares que participan en medios náuticos. Aunque estas instalaciones han sufrido mucho debido a la caída de la antigua unión y, como tal, se necesitarán reparaciones, entrenamiento y algunas inversiones serias si queremos ser capaces de defender adecuadamente tal costa."
 SRA_new_orleans_capital: "Ha hecho de §YNueva Orleans§! la capital"
 SRA_meridian_capital: "Ha hecho de §YMeridian§! la capital"
 SRA_atlanta_capital: "Ha hecho de §YAtlanta§! la capital"
 SRA_charleston_capital: "Ha hecho de §YCharleston§! la capital"
 SRA_country_flag_the_window_holds: "La Ventana de Overton se mantiene"
 SRA_country_flag_the_window_shatters: "La Ventana de Overton se rompe"
 SRA_fort_earl_van_dorn: "Fuerte Earl Van Dorn"
 SRA_fort_edward_asbury_oneal: "Fuerte Edward Asbury O'Neal"
 SRA_fort_james_deshler: "Fuerte James Deshler"
