 SPYSAT1: "SPYSAT 1965"
 SPYSAT1_desc: "Satélites militares o de inteligencia diseñados para llevar a cabo una gama variada de misiones, desde la recopilación de información hasta la detección de artefactos nucleares.\n\nSatélite de reconocimiento (SPYSAT 1965):\nEl satélite §Y$SPYSAT1$§! es un satélite de reconocimiento con una resolución de imagen de §Y5 m GSD§!. Son necesarios para un sistema de satélites de reconocimiento de §Y5 m GSD§!.\n§YGSD§! - §YGround Sample Distance§! (Distancia de muestreo terrestre): GSD es la distancia entre los centros de los píxeles medida en el suelo. Para este satélite, las ubicaciones de las imágenes de los píxeles adyacentes están a una distancia de 5 m en el suelo."
 SPYSAT2: "SPYSAT 1975"
