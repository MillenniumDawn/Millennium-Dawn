l_russian:
 greece_focus: "Древо фокусов Греции"
 earthquake_diplomacy: "Дипломатия землетрясений"
 airspace_violations: "Нарушения воздушного пространства "
 GRE_debt_crisis: "Долговой кризис"
 GRE_debt_crisis_desc: "У Греции $300 млрд внешнего долга — один из самых больших в мире. Это создало для нас огромную проблему, поскольку долг быстро растет и создает огромные проблемы для нашей экономики. Нам придется найти способ решить проблему долга, прежде чем она выйдет из-под контроля."
 GRE_constitutional_crisis: "Конституционный кризис"
 GRE_constitutional_crisis_desc: "Старая конституция была написана для совершенно другой Греции. Ее система сдержек и противовесов теперь мешает проведению необходимых стране реформ. Переписывание конституции — рискованное предприятие, но полумеры уже нас подвели."
 GRE_drift_modifiers: "Парламент эллинов"
 GRE_debt_modifier: "Долговой кризис"
 GRE_debt_modifier_desc: "Долговой кризис имеет более жесткие последствия в зависимости от того, как власти управляют деньгами, однако траты внушительных средств на создание рабочих мест принесут пользу в долгосрочной перспективе."
 GRE_press_opposition: "Оппозиция СМИ"
 GRE_press_opposition_desc: "Средства массовой информации не представляли нас в лучшем свете с тех пор, как мы восстановили порядок в правительстве, и вполне логично, что слабые боятся сильных."
 GRE_one_party: "Однопартийное государство"
 GRE_one_party_desc: "Объявив, что КПГ является единственной политической партией, разрешенной в Греции, мы имеем право делать все, что захотим, но ценой крови, которая должна быть пролита, чтобы обеспечить подчинение населения."
 GRE_reorganize_army_idea: "Реорганизация армии"
 GRE_reorganize_army_idea_desc: "Мы не можем просто защитить армию до такой степени дисфункции. Может наступить время, когда нам понадобятся сильные вооруженные силы, и для этого возможностей мы обеспечим лояльную и готовую нашу армию."
 GRE_cracked_foundation_desc: "Основанию государства противоречили так много раз, что если мы продолжим наш нынешний путь, мы можем столкнуться с чем-то опасным: революцией. \n\n§RЕсли стабильность упадет ниже 30%, мы столкнемся с революцией в Греции!§!"
 GRE_militarist_education_idea: "Военное образование"
 GRE_militarist_education_idea_desc: "Система образования внедрила в свою программу ценности военной службы, что обеспечивает большую готовность к внезапным атакам."
 GRE_elam: "Возрождение Национального народного фронта"
 GRE_elam_desc: "ELAM, Национальный народный фронт Кипра, стал своего рода проводником нашей идеологии по всему острову. Направление финансирования и политической поддержки в Никосию укрепляет наши позиции в любом будущем процессе воссоединения без необходимости прямого вмешательства."
 GRE_rename_istanbul: "Переименование Стамбула"
 GRE_austerity_tension1: "Незначительная"
 GRE_austerity_tension2: "Главный"
 GRE_austerity_tension3: "Гражданские восстания!"
 GRE_CYP_category: "Кипрский конфликт"
 GRE_CYP_category_desc: "С 1974 года Кипр остается разделённым между Турецкой Республикой Северного Кипра и Республикой Кипр после поддержанного Грецией переворота, который едва не привёл к объединению острова с Грецией. В ответ Турция вторглась на остров, что привело к продолжающемуся разделению Кипра, это вторая по продолжительности военная оккупация в современной истории, уступающая лишь израильской.\n\n§YСила греко-киприотов:§! §C[?145.GRE_SUPPORT]%§!\n§YСила турко-киприотов:§! §C[?146.GRE_SUPPORT]%§!\n\n§CПервая сторона, достигшая 100 единиц силы, объединит Кипр под своей властью!§!"
 GRE_guarantee_turkish_property: "Искра, объединяющая протесты по всему Кипру"
 GRE_guarantee_turkish_property_desc: "Создавая стремление к единству, мы посеем хаос по всему Кипру, что даст нам возможность укрепить собственную силу, пока турки будут заняты подавлением протестов."
 GRE_please_south: "Благодать греческим киприотам"
 GRE_please_north: "Благодать турецким киприотам"
 TUR_CYP_incite_riot: "Подстрекательство к беспорядкам на севере"
 TUR_CYP_propaganda_north: "Северная антигреческая пропаганда"
 TUR_CYP_propaganda_south: "Южная антигреческая пропаганда"
 TUR_attack_CYP_strength: "Нападение на греко-кипрские силы"
 GRE_attack_turkish_strength: "Нападение на турецко-кипрские силы"
 GRE_south_50_TT: "§HГреко-кипрская сила будет на уровне 55§!"
 GRE_north_50_TT: "§HТурецко-кипрская сила будет на уровне 45§!"
 TUR_unify_cyp: "§GЮжный Кипр объединится с Северным Кипром!§!"
 GRE_unify_cyp: "§GСеверный и Южный Кипр объединятся в Грецию!§!"
 TUR_unify_cyprus: "Объединить Кипр"
 GRE_unify_cyprus: "Объединить Кипр"
 GRE_failures_capitalism_TT: "§RВлияние фокуса на масштабы долгового кризиса.§!"
 GRE_communist_takeover_TT: "§GГреческий народ требует выборов!§!\n\nУбедитесь, что у вас накоплено достаточно политической власти. Если потерпеть §Rнеудачу§! при избрании и формировании правительства, §Rнужно будет провести ещё одни внеочередные выборы,§! чтобы расширить возможности §Y[communist_state_L]§!"
 GRE_fascist_takeover_TT: "§GГреческий народ требует выборов!§!\n\nУбедитесь, что у вас достаточно политической власти, накопленной для этого. Если потерпеть §Rнеудачу§! при избрании и формировании правительства, §Rнужно будет провести еще одни внеочередные выборы,§! чтобы расширить возможности §Y[Nat_Fascism_L]§!"
 GRE_civil_units_TT: "§RПредлагается передислоцировать нашу армию к границам региона Центральная Греция, где мы сможем попытаться сдержать повстанцев.§!"
 GRE_worsen_debt_TT: "§RУсугубление долгового кризиса!§!"
 GRE_lowers_debt_TT: "§GСмягчение долгового кризиса!§!"
 GRE_end_austerity_TT: "§GКонец протестам против жесткой экономии!§!"
 GRE_increase_drift_TT: "§GУсиливается политический дрейф в сторону этой партии!§!"
 GRE_process_sco_member_tt: "§YНачинается процесс интеграции в ШОС.§!"
 GRE_enemy_blocked_us: "§RЕсли эти решения недоступны, значит, враг временно помешал нам набрать силу или мы не выполняем другие требования!§! (Дней блокировки: [?TUR_greece_blocked_us:days_left|R0])"
 GRE_unable_to_gain_strength: "§HГреко-киприоты§! будут §GНЕСПОСОБНЫ§! набрать силу в течение §H100 дней§!"
 TUR_unable_to_gain_strength: "§HТурецкие киприоты§! будут §GНЕСПОСОБНЫ§! набрать силу в течение §H100 дней§!"
 GRE_south_-5_TT: "§HГреки-киприоты§! §RПОТЕРЯЮТ§! §H5 силы!§!"
 GRE_north_5_TT: "§HТурки-киприоты§! §GПОЛУЧАТ§! §H5 силы§!"
 GRE_south_-20_TT: "§HГреки-киприоты§! §RПОТЕРЯЮТ§! §H20 силы!§!"
 GRE_gain_5_strength: "§HГреки-киприоты§! §GПОЛУЧАТ§! §H5 силы!§!"
 GRE_gain_20_strength: "§HГреки-киприоты§! §GПОЛУЧАТ§! §H20 силы!§!"
 TUR_gain_20_strength: "§HТурки-киприоты§! §GПОЛУЧАТ§! §H20 силы!§!"
 GRE_turks_lose_5_strength: "§HТурки-киприоты§! §RПОТЕРЯЮТ§! §H5 силы!§!"
 GRE_lose_20_gain_20: "§HТурки-киприоты§! §RПОТЕРЯЮТ§! §H20 силы!§!"
 TUR_CYP_incite_riot_TT: "§HТурки-киприоты§! имеют §H50%§! или более силы"
 TUR_GRE_support: "§HГреки-киприоты§! имеют §H5%§! или более силы."
 TUR_has_100_strength: "§HТурки-киприоты§! имеют §H100%§! силы."
 GRE_has_100_strength: "§HГреки-киприоты§! имеют §H100%§! силы."
 GRE_ICBC: "Одолжение у ICBC"
 GRE_ICBC_desc: "Промышленно-торговый банк Китая — один из крупнейших банков в мире. Если мы перенаправим часть нашей покупательной способности и долгов через этот китайский банк, мы сможем обеспечить дальнейшее сотрудничество с Пекином и расширить наши возможности по поддержанию роста нашей быстро развивающейся экономики."
 GRE_chi_real_estate: "Китайские инвестиции в недвижимость"
 GRE_chi_real_estate_desc: "Китайские инвесторы начали проявлять интерес к покупке недвижимости по всей Греции, особенно в Афинах и на островах. Этот приток иностранного капитала может снизить нагрузку на государственные финансы и привлечь дополнительные китайские инвестиции, углубляя экономические связи между двумя странами."
 GRE_chi_investments: "Китайские инвестиции"
 GRE_chi_investments_desc: "Китай заинтересован в обширных проектах по всей Греции. Они способны вдохнуть новую жизнь в определенные сферы экономики, для улучшения которых у нас самих банально нет ресурсов."
 GRE_piraeus: "Отказ от Пиреи"
 GRE_piraeus_desc: "Предложение о продаже порта Пирей обсуждалось среди членов правительства, и, похоже, в условиях долгового кризиса это ослабит некоторое давление на нас."
 GRE_piraeus_corruption: "Сворачивание задумок Китая"
 GRE_piraeus_corruption_desc: "Планы Китая расширить свой плацдарм в Греции опасны для нашей независимости. Под прикрытием Центрального археологического совета мы можем деликатно остановить любые планы Китая по экспансии."
 GRE_chi_investments_piraeus: "Инвестиции вокруг Пирея"
 GRE_chi_investments_piraeus_desc: "Китайцы проявили большой интерес к инвестированию в районы вокруг порта Пирей. Хотя некоторые эксперты указывают на то, что этот проект может быть опасен для нашей независимости, мы не видим подобной угрозы."
 GRE_chi_nationwide_investments: "Общенациональные китайские инвестиции"
 GRE_chi_nationwide_investments_desc: "Выгода от предоставления Китаю возможности свободно инвестировать в нашу страну огромна, мы должны позволить китайцам инвестировать так, как им заблагорассудится."
 GRE_invest_elliniko: "Инвестиции в Эллинико"
 GRE_invest_elliniko_desc: "Эллинико — это субгородская часть Афин, которую можно считать удрученной проектами возрождения, запущенными в других местах. Этот район особенно важен, так как является центром притяжения для туристов."
 GRE_unemployed: "Безработица"
 GRE_unemployed_desc: "Тщательно управляя безработицей, мы можем гарантировать, что те, кто потеряет работу из-за долгового кризиса, не останутся без средств, необходимых для обеспечения хотя бы базового уровня жизни."
 GRE_glass_cannon_economics: "Экономика стеклянной пушки"
 GRE_glass_cannon_economics_desc: "Наша финансовая сторона и граждане видят преимущества здоровой экономики. Когда они тратят свои деньги, это помогает стране расти, социально в том числе.\n\nВо всяком случае, до тех пор, пока что-то §Rпровальное§! не случится с экономикой."
 GRE_strength: "Столпы выздоровления"
 GRE_strength_desc: "Несмотря на то, что долговой кризис доминирует в заголовках новостей, Греция далека от банкротства. Крупнейший в мире торговый флот, фармацевтический сектор, уступающий по объему экспорта только нефтепереработке, туризм, не уступающий ни одному в Средиземноморье, и продукция, которую можно найти на столах по всему миру, — это реальные и прочные основы. Поддержка этих отраслей с помощью целенаправленной политики, а не повсеместной экономии, диктуемой из-за рубежа, — вот как можно построить устойчивое восстановление экономики."
 GRE_pharma: "Мощный центр по производству дженериков"
 GRE_pharma_desc: "Греция играет в медицине гораздо более значительную роль, чем можно было бы ожидать, поскольку ее заводы производят дженерики и фирменные лекарства для таких компаний, как Vianex и Elpen, которые занимают второе место по экспорту после нефтеперерабатывающих заводов. Благодаря тому, что эти таблетки и ампулы продаются на рынках Европы и стран Персидского залива, отрасль получает твердую валюту, даже несмотря на экономические трудности внутри страны. Более глубокие инвестиции в исследования и производственные линии укрепили бы один из немногих действительно первоклассных секторов нашей экономики."
 GRE_construction_mat: "Строительные материалы"
 GRE_construction_mat_desc: "Мрамор из Пентели, известняк с островов, щебень из Фракии. Перенаправление отечественных строительных материалов с экспортных рынков на собственные инфраструктурные проекты снижает затраты и позволяет экономить средства внутри страны."
 GRE_austerity: "Кампании жесткой экономии"
 GRE_austerity_desc: "Дефицит в государстве неизбежен, и если мы не будем действовать в ближайшее время, экономика войдет в худшее состояние, чем сейчас. §RЭто вызовет беспорядки по всей стране§!, но если мы сдержим волнения, то сможем восстановить контроль над нашим финансовым положением."
 GRE_turn_century: "На рубеже веков"
 GRE_turn_century_desc: "Поскольку наш путь в этом новом мире подходит к новому тысячелетию, многое остается неопределенным, политика и экономика под вопросом. От нас зависит, как вести нашу страну в эту новую эпоху."
 GRE_golden_dawn: "Золотая Заря"
 GRE_golden_dawn_desc: "Крайне правая партия «Золотая заря» — политическая партия, основанная на идеалах национализма и симпатизирующая националистическим движениям по всей Европе. Многие критиковали «Золотую зарю» как неонацистскую и преступную организацию, но эти люди — лжецы. «Золотая заря» — единственный путь вперед для Греции, и мы должны гарантировать, что она станет лидером страны."
 GRE_subtle_propaganda_campaigns: "Деликатные агитационные кампании"
 GRE_subtle_propaganda_campaigns_desc: "Народ должен узнать правду о том, чего хочет достичь \"Золотая Заря\" и как демократы разрушили эту страну, ввергнув ее в хаос и экономический кризис."
 GRE_open_youth_front: "Открытие Молодежного фронта"
 GRE_open_youth_front_desc: "Молодежь «Золотой Зари» дает молодым грекам дисциплину, националистическое воспитание и чувство цели, от которых отказались демократические партии. Поддержка молодежи — это основа любого долгосрочного движения, и поколение, воспитанное в наших ценностях, не променяет их."
 GRE_influence_police: "Влияние на полицию"
 GRE_influence_police_desc: "Если удастся заручиться поддержкой полиции, мы получим еще большую силу, а также будет легче избавиться от политических предателей и всевозможных оппонентов."
 GRE_committee_national_memory: "Комитет национальной памяти"
 GRE_committee_national_memory_desc: "Человек без истории и предков — ничто. Мы должны чтить великих героев-националистов, которые сражались и умирали за нацию, напоминая людям об их принципах, чтобы мы все могли объединиться под одной прекрасной целью."
 GRE_form_golden_dawn_death_legions: "Формирование Легионов смерти"
 GRE_form_golden_dawn_death_legions_desc: "Партии необходимо боевое крыло. Легионы смерти \"Золотой Зари\" станут нашим главным военизированным подразделением. Им будет поручено очищать улицы от предателей, а также обеспечивать порядок и при необходимости выступать на защиту страны от различных врагов."
 GRE_glorify_regime_of_colonels: "Прославление Режима полковников"
 GRE_glorify_regime_of_colonels_desc: "С 1967 по 1974 год Грецией управляла военная хунта, более известная как \"Режим полковников\" При полковниках Греция переживала бурный экономический рост, а также внутреннюю стабильность и огромную армию, которая защищала страну. Поэтому мы должны напомнить народу о достижениях былых управленцев."
 GRE_golden_greece: "Требование немедленных выборов"
 GRE_golden_greece_desc: "Пришло время возглавить эту страну после того, как мы заручились поддержкой большинства населения. Мы потребуем от коррумпированной власти выборов, чтобы показать, кто действительно должен быть у власти."
 GRE_fund_elam: "Обширное финансирование ELAM"
 GRE_fund_elam_desc: "ELAM или Национальный народный фронт — родственная партия «Золотой зари» на Кипре. Предоставляя фронту больше средств, чем он когда-либо получал, мы можем, по крайней мере, обеспечить себе популярность среди киприотов-греков."
 GRE_revive_megali_idea: "Возрождение идеи Мегали"
 GRE_revive_megali_idea_desc: "Мегали Идэа — это ирредентистская мечта греков в период Османской Греции, подразумевавшая реставрацию Византии с центром в Константинополе. Идея Мегали была сильной концепцией великой греческой нации, состоящей из бывших греческих территорий, таких как Северный Эпир и прибрежные районы Турции. Наша судьба — возродить идею Мегали и сделать так, чтобы предки нами гордились."
 GRE_censor_media: "Цензура СМИ"
 GRE_censor_media_desc: "Средства массовой информации до того, как мы пришли к власти, были фальшивыми новостными агентствами, поскольку их содержание было напичкано продемократической пропагандой. Теперь, будучи у власти, мы заменим фальшивые новости нашими собственными государственными СМИ, которые будут вещать истину."
 GRE_one_religion: "Одна религия"
 GRE_one_religion_desc: "Православное христианство — наша государственная религия и важная часть нашего наследия. Мы должны всеми силами уделять больше внимания нашей религии."
 GRE_oppress_political_opposition: "Подавление политической оппозиции"
 GRE_oppress_political_opposition_desc: "Мы должны искоренить предателей, которые продали страну и развратили ее, а также всех тех, кто настроен против греков. \"Золотая Заря\" очистит Грецию от врагов нации и ненавистников родины."
 GRE_army_first: "Армия в первую очередь"
 GRE_army_first_desc: "Принимая политику, которая ставит в приоритет нашу армию и ее расширение, мы можем гарантировать, что даже без поддержки среднего грека мы все равно сохраним контроль. Конечно, этого никогда не произойдет."
 GRE_economic_control: "Экономический контроль"
 GRE_economic_control_desc: "Предыдущие правительства позаботились о том, чтобы разрушить экономику, непомерно и резко увеличив долг Греции. Чтобы не допустить этого снова, усиление контроля над экономикой неизбежно."
 GRE_anti_migrant_policies: "Антимигрантская политика"
 GRE_anti_migrant_policies_desc: "Иммигранты потребляют ресурсы и занимают рабочие места, которые могли бы быть лучше использованы греками. Мы не можем позволить им продолжать производить деградацию Греции."
 GRE_metaxism: "Современный Метаксизм"
 GRE_metaxism_desc: "Мы во многом опираемся на режим Метаксаса, особенно на политику, которую он поддерживал: корпоративизм, льготы для рабочего класса и приоритет греческой нации. Единственное, что мы должны подавить, — это антиимпериалистические настроения, которых придерживался Метаксас."
 GRE_depart_ecomomic_migrants: "Отбытие трудовых мигрантов"
 GRE_depart_ecomomic_migrants_desc: "Теперь, когда правительство начало принимать антимигрантские законы, разумно начать отправлять экономических мигрантов обратно в свои страны."
 GRE_metaxas_policies: "Метаксасистская политика"
 GRE_metaxas_policies_desc: "Иоаннис Метаксас, пришедший к власти в результате переворота 4 августа 1936 года, является огромным вдохновением для Золотой Зари. Он был одним из величайших лидеров Греции, поскольку он привел греческий народ к славе и сопротивлялся державам Оси во Второй мировой войне. Мы должны пересмотреть его политику, чтобы почтить его память."
 GRE_dissolve_plutocracy: "Ликвидация плутократии"
 GRE_dissolve_plutocracy_desc: "Слишком долго наша казна эксплуатировалась демократическими режимами и иностранцами. Сейчас самое время уничтожить эту подлую систему раз и навсегда."
 GRE_increase_agricultural_production: "Укрупнение с/х производства"
 GRE_increase_agricultural_production_desc: "Сельское хозяйство уже давно является самым крупным и успешным сектором в Греции, и мы должны сделать его еще лучше, инвестируя больше средств в отстающие растительные культуры."
 GRE_exploit_and_export: "Использовать и экспортировать"
 GRE_exploit_and_export_desc: "Эта родная земля полна неиспользуемых природных ресурсов и мы должны быстро эксплуатировать их во благо страны."
 GRE_revise_national_debt: "Пересмотр долга"
 GRE_revise_national_debt_desc: "Демократам удалось поднять греческий долг до $300 млрд. Это создает проблемы для экономики. Поэтому необходимо вести переговоры, чтобы избавиться от этого огромного долга."
 GRE_nationalize_resources: "Национализация ресурсов"
 GRE_nationalize_resources_desc: "В настоящее время многие иностранные компании владеют природными ресурсами в Греции, и это недопустимо. Мы конфискуем все иностранные активы внутри страны."
 GRE_trade_agreements: "Торговые соглашения"
 GRE_trade_agreements_desc: "Греческая торговая власть очень низкая, так как мы недостаточно конкурентоспособны в современном мире. Мы будем принимать торговые сделки, чтобы мы могли экспортировать наши продукты в большее количество стран."
 GRE_nationalize_banks: "Национализация банковского сектора"
 GRE_nationalize_banks_desc: "В рамках схемы экономического контроля банки должны быть национализированы государством, поскольку они владеют ценными активами, которые государство может эксплуатировать."
 GRE_force_germany_to_pay_debt_taken_from_occupation: "Принудительное погашение немецких долгов"
 GRE_force_germany_to_pay_debt_taken_from_occupation_desc: "Немецкая оккупация Греции во время Второй мировой войны была очень жесткой, так как  из-за боевых действий уничтожена большая часть Греции и они должны нам $300 млрд репараций, которые так и не были отправлены. Сейчас самое время напомнить немцам о платеже..."
 GRE_russia: "Торговля с Россией"
 GRE_russia_desc: "Россия является нашим историческим союзником, поскольку мы обе православные христианские страны, и она много раз оказывала нам помощь на протяжении истории, поэтому мы должны расширять торговые отношения с Россией."
 GRE_china: "Торговля с Китаем"
 GRE_china_desc: "Хотя Китай и отличается идеологически, он все чаще поддерживает националистические режимы, и является мировой торговой державой. Необходимо расширять экономические связи с китайцами."
 GRE_iran: "Торговля с Ираном"
 GRE_iran_desc: "Несмотря на то, что Иран, возможно, не имеет ничего общего с нашей страной, у нас хотя бы достаточно общих целей. Будет разумно развивать сотрудничество с Ираном."
 GRE_of_continents_seas: "Греция двух континентов и пяти морей"
 GRE_of_continents_seas_desc: "«Великая идея» предполагает Грецию, простирающуюся на два континента и пять морей: Эгейское, Ионическое, Средиземное, Черное и Мраморное. Наш военно-морской флот должен быть восстановлен и стать силой, достойной этих амбиций, способной проецировать мощь на все воды, которые когда-то принадлежали Греции."
 GRE_resolve_naming_dispute: "Урегулировать спор о названии."
 GRE_resolve_naming_dispute_desc: "Спор о названии Македонии — тривиален и долог. Мы просто решим вопрос, полностью аннексировав Северную Македонию. Кроме того, наша культура схожа, и мы считаем македонян греками, независимо от того, что многие считают их славянами."
 GRE_strike_albania: "Удар по Албании"
 GRE_strike_albania_desc: "Греческое меньшинство Северного Эпира терпит албанское правление с 1913 года. Их язык подавляется, церкви закрываются, имущество конфискуется. Столетие дипломатических жалоб ни к чему не привело. Мы сами решим этот вопрос."
 GRE_strike_bulgaria: "Удар по Болгарии"
 GRE_strike_bulgaria_desc: "Византийские миссионеры разработали первый литературный язык славянских народов — алфавит, который впоследствии стал болгарским. Славянские народы Фракии и Македонии были интегрированы в эллинскую цивилизацию задолго до существования какого-либо болгарского государства. Эта кампания — скорее возвращение домой, чем война."
 GRE_greater_greece: "Великая Греция"
 GRE_greater_greece_desc: "Греция была в центре самых могущественных наций в истории, мы бы опозорили такое наследие, не продолжив его."
 GRE_great_greece: "Великая Греция"
 GRE_great_greece_desc: "Мы не пойдем по пути разжигания войны, который приведет к гибели даже величайшую из империй в истории."
 GRE_agriculture_focus: "Агрокультура"
 GRE_agriculture_focus_desc: "Сельское хозяйство является одним из самых сильных элементов греческой экономики, поскольку мы предоставляем большую часть продуктов, таких как оливковое масло. Мы должны инвестировать больше денег в сельское хозяйство, чтобы мы могли полностью экспортировать наши продукты в остальный мир."
 GRE_greater_state_control: "Усиление гос. экономического контроля"
 GRE_greater_state_control_desc: "Свободный рынок подвел Грецию. Капитал покинул страну, когда он был нужен больше всего, частные банки отказывались предоставлять кредиты, чтобы защитить прибыль акционеров, а иностранные владельцы извлекали прибыль во время чрезвычайного положения в стране. Прямой государственный контроль над стратегическими отраслями возвращает экономические решения туда, где им и место."
 GRE_kke: "КПГ"
 GRE_kke_desc: "КПГ (Коммунистическая партия Греции) — крайняя левая партия, основанная на идеях марксизма-ленинизма и решительно выступающая против иностранного империализма, стремящаяся устранить неравенство и обеспечить права трудящихся, приверженная созданию истинного социалистического общества. Мы все должны сплотиться вокруг КПГ, чтобы вести народ вперед!"
 GRE_communist_education: "Коммунистическое воспитание"
 GRE_communist_education_desc: "Молодые умы часто бывают самыми впечатлительными. Привитие подрастающему поколению базовых ценностей коммунизма и обучение студентов высших учебных заведений славе коммунизма могло бы значительно продвинуть наше дело."
 GRE_labour_focus_unions: "Контакт с профсоюзами"
 GRE_labour_focus_unions_desc: "Профсоюзы будут очень рады иметь правительство, готовое не только сотрудничать, но и уступать их требованиям. Мы позаботимся о том, чтобы их влияние не распространялось дальше положенного, чтобы избежать §Rконфликта интересов.§!"
 GRE_failures_capitalism: "Неудачи капитализма"
 GRE_failures_capitalism_desc: "Капитализм больше не благословляет нас бесконечным богатством, которое он обещал. Настало время пойти своим собственным путем, чтобы гарантировать, что такой ужасный кризис никогда не повторится! §RВлияние этого фокуса масштабируется в зависимости от величины долгового кризиса.§!"
 GRE_working_class: "Рабочий класс"
 GRE_working_class_desc: "Рабочий класс, где рождаются и гибнут мечты. Мы пообещаем им, что с ними будут хорошо обращаться и воздадут им должное за труд, дабы они стали основой нового коммунистического общества."
 GRE_communist_propaganda: "Пропагандистская машина"
 GRE_communist_propaganda_desc: "Благодаря нашему растущему влиянию можно позволить себе развернуть пропагандистскую машину в Греции. Хотя денежное содержание высоко, \"работа с умами\" не является чем-то, что следует игнорировать, и она будет чрезвычайно эффективна в обращении греческого населения на правильную сторону."
 GRE_prepare_government: "Подготовка государства"
 GRE_prepare_government_desc: "Создав правительство в составе нашей политической партии, мы обеспечим эффективный переход, который позволит действовать в соответствии с нашими желаниями быстрее, чем соперники смогут собраться. Это будет дорого стоить, но, учитывая шансы на победу, это хорошая ставка."
 GRE_damn_market: "Долой свободный рынок"
 GRE_damn_market_desc: "Мы в состоянии нанести последний удар капиталистам, а с силой пропаганды на нашей стороне имеется шанс нанести сокрушительный последний удар свободной рыночной экономике! В процессе мы можем узурпировать трон, на котором сидят капиталисты, и претендовать на него как на свой собственный!"
 GRE_election_com: "Требование немедленных выборов"
 GRE_election_com_desc: "Товарищи, время пришло, воззвание народа к коммунистическому государству привело к этому моменту... \n\n§RМы добьемся того, что народное правительство будет у власти еще 1000 лет!§!"
 GRE_com_democratic: "Демократический коммунизм"
 GRE_com_democratic_desc: "Наплевать, что говорят другие! Истинная форма коммунизма — это та, которая позволяет среднему рабочему избирать своего лидера в правительство, а пренебрежение этим правом является предательством коммунистической идеи."
 GRE_com_authoritarian: "Авторитарный коммунизм"
 GRE_com_authoritarian_desc: "Народ слишком легко обманывают и пичкают произвольными обещаниями, которые на деле не будут выполнены, даже если они будут задекларированы документально. Слишком большой риск — позволить легко манипулируемой публике решать будущее Греции, это слишком опасно."
 GRE_handle_bankers: "Разборки с банкирами"
 GRE_handle_bankers_desc: "Капиталистам нет места в таком коммунистическом государстве, как наше, необходимо немедленно перераспределить их богатства в пользу бедных."
 GRE_com_constitutionalism: "Коммунистический конституционализм"
 GRE_com_constitutionalism_desc: "Мы разработаем новую конституцию для гарантии, что никто никогда не будет нарушать право народа голосовать, среди прочего, скорее всего, это будет означать, что глава государства не будет обладать чрезмерно большой властью."
 GRE_government_purge: "Государственные чистки"
 GRE_government_purge_desc: "Мы полностью захватим власть и утвердимся как единственная правильная партия, которой разрешено управлять Грецией. Фашисты и либералы скрываются повсюду, желая поскорее разрушить прекрасную коммунистическую утопию, которую мы пытаемся создать!"
 GRE_curtail_corruption: "Борьба с коррупцией"
 GRE_curtail_corruption_desc: "Наш приход к власти создал вакуум в высших эшелонах, который новые в политике люди стремятся заполнить, и мы должны обеспечить, чтобы наше правительство оставалось чистым и преданным народу."
 GRE_promote_local: "Содействие местному бизнесу"
 GRE_promote_local_desc: "Современные коммунистические страны, к сожалению, должны инкорпорировать капиталистические концепции в государство, чтобы обеспечить выживание. Местный бизнес — это основа экономики, и для того, чтобы осуществить политические мечты, требуется укрепить эту основу."
 GRE_investment_effort: "Инвестиции в инфраструктуру"
 GRE_investment_effort_desc: "Дороги, железные дороги и линии электропередач составляют основу продуктивной экономики. Годы недофинансирования привели к изоляции целых регионов от национальных рынков. Государственные инвестиции в инфраструктуру заполняют пробелы, которые частный сектор никогда бы не смог восполнить."
 GRE_subsidize_farmers: "Субсидирование фермеров"
 GRE_subsidize_farmers_desc: "Греческие фермеры годами испытывали давление из-за импортных квот ЕС, растущей задолженности и конкуренции со стороны иностранных компаний, которым они не могут противостоять по цене. Прямые субсидии на семена, оборудование и сельские кредиты дают им возможность модернизировать свою деятельность и поддерживать продуктивность своих земель."
 GRE_abandon_army: "Отказ от армии"
 GRE_abandon_army_desc: "Армия в настоящее время является бременем для государства и шансы на эффективное применение такой силы маловероятны, поэтому вполне логично начать перестройку и сокращение армии."
 GRE_reorganize_army: "Реорганизация армии"
 GRE_reorganize_army_desc: "Старый офицерский корпус обязан своим званием предыдущему правительству. Нам необходимо искоренить эту лояльность и перестроить командную структуру вокруг людей, которые подотчетны партии, а не мертвой конституции."
 GRE_silence_press: "Молчание прессы"
 GRE_silence_press_desc: "Мы освободители, а не тираны. Если СМИ слишком промыты мозгами, чтобы это понять, то мы должны взять дело в свои руки."
 GRE_extend_education: "Развитие образования"
 GRE_extend_education_desc: "Народ этой страны заслуживает только самого лучшего образования, чтобы имелся резерв хорошо образованных людей для занятия продвинутых рабочих мест."
 GRE_com_resources: "Эксплуатация природных ресурсов"
 GRE_com_resources_desc: "Благодаря развитой инфраструктуре государственные предприятия теперь могут добывать и перерабатывать природные ресурсы в больших масштабах. Шахты, карьеры и месторождения энергоресурсов, которые когда-то приносили прибыль частным акционерам, теперь будут финансировать общественное благосостояние."
 GRE_farmer_tax: "Снижение фермерских налогов"
 GRE_farmer_tax_desc: "Необходимо предоставить налоговые льготы фермерам, чтобы не только побудить больше людей присоединиться к этой профессии, но и обеспечить им большую прибыль, что позволит расширить хозяйства и угодья с помощью более эффективных методов производства и еще большего количества земли."
 GRE_new_army: "Новая армия"
 GRE_new_army_desc: "Мы реформировали нашу армию до такой степени, что она была заменена полицией с точки зрения внутренней безопасности. Однако как мы можем проецировать влияние без настоящей вооружённой силы, способной подкрепить наше слово? Даже если она не будет использована, нам следует начать создавать новую армию, соответствующую новой Греции."
 GRE_red_army: "Красная армия"
 GRE_red_army_desc: "Мы обеспечим присутствие коммунистического духа в глубоких рядах новой Красной Армии. Этот идеологический фанатизм будет нам на пользу, поскольку он создаст армию, лояльную государству, и армию, которая будет сражаться до конца за сохранение социализма в Греции."
 GRE_pacify_unions: "Усмирение профсоюзов"
 GRE_pacify_unions_desc: "Мы расширили полномочия профсоюзов до такой степени, что они нарушают работу государства на нескольких уровнях из-за всё более незначительных поводов. Наша партия предана народу, а народу нужна работающая экономика, где можно найти работу, поэтому мы должны попросить профсоюзы прекратить это, прежде чем нам придётся законодательно запретить им вмешиваться."
 GRE_purge_unions: "Чистка профсоюзов"
 GRE_purge_unions_desc: "Профсоюзы показали неспособность проявлять сдержанность и лояльность — наша снисходительность не безгранична."
 GRE_militarist_education: "Милитаристское образование"
 GRE_militarist_education_desc: "Вводя военное образование в нашу учебную программу, мы можем гарантировать, что население в целом будет готово к призыву в случае чрезвычайных обстоятельств."
 GRE_balkan_diplomacy: "Балканская дипломатия"
 GRE_balkan_diplomacy_desc: "Пришло время реализовать наши истинные амбиции... И хотя мы не считаемся славянским этносом, Греция все еще следует православию и находится на Балканах, поэтому, возможно, наш культурный нейтралитет обеспечит стабильность такого государства... \n\nГреко-славянского государства."
 GRE_balkan_hegemony: "Балканская гегемония"
 GRE_balkan_hegemony_desc: "Последние две попытки такого государства потерпели неудачу, однако они всегда пытались объединиться дипломатически, а не через силу. Если не было сил победить их, то зачем пытаться удержать силой эти земли вместе! Не стоит сомневаться, что мы сможем удержать такое государство в целости с помощью внутренней дипломатии, однако остро стоит вопрос о том, чтобы сначала отодвинуть неизбежную войну."
 GRE_constitution: "Конституция"
 GRE_constitution_desc: "Конституция — это последнее, с чем нам нужно иметь дело, прежде чем окончательно утвердиться у власти и восстановить Грецию такой, какой мы ее себе представляем."
 GRE_european_communists: "Европейские коммунисты"
 GRE_european_communists_desc: "Коммунизм оставил свой след на Балканах с тех пор, как закончился период существования СССР и рухнул коммунистический блок. Возможно, обладая достаточной властью и интригами, мы сможем снова зажечь факел, оставленный нашими товарищами. Нам нужна лишь искра, чтобы разжечь огонь."
 GRE_bulgaria: "Приход революции в Болгарию"
 GRE_bulgaria_desc: "Болгария, некогда процветающая коммунистическая страна, сбилась с пути после распада СССР. Дать им еще один пример, на который можно равняться и за которым можно следовать — это должно позволить коммунизму утвердиться и на данной территории."
 GRE_albania: "Приход революции в Албанию"
 GRE_albania_desc: "Албания - это страна, которая столкнулась со многими трудностями за свое существование. Предоставление им защиты и экономического развития будет достаточным фактором для того, чтобы завоевать сердца и умы албанского народа, но при этом в какой-то степени уважать его суверенитет."
 GRE_macedonia: "Приход революции в Македонию"
 GRE_macedonia_desc: "Македония когда-то была частью Югославии, наслаждаясь тем же коммунизмом, что и Сербия, однако после распада Югославии и культурных \"заблуждений\" они отказались от пути коммунизма. Развеивание этих заблуждений позволит населению вновь поддержать коммунистический режим."
 GRE_serbia: "Приход революции в Сербию"
 GRE_serbia_desc: "Сербия когда-то была центром Югославии во времена коммунистического правления и лидерства Броза Тито. В то время как сербы приняли идеологию национализма, некоторые все еще питают коммунистические симпатии, и это идеальная цель для расширения пролетарской революции."
 GRE_romania: "Приход революции в Румынию"
 GRE_romania_desc: "Румыния богата ресурсами и военной мощью. Распространение революции на них, несомненно, покажет миру, что коммунизм восстановил себя на Балканах."
 GRE_dictatorship: "Начало диктатуры"
 GRE_dictatorship_desc: "Теперь, когда наши враги побеждены, мы можем наконец начать управлять страной так как считаем нужным."
 GRE_cypriot_question: "Кипрский вопрос"
 GRE_cypriot_question_desc: "Напряженность достигла точки кипения, мы должны действовать сейчас же. §RЭто приведет к войне с Турцией и ее союзниками§!, однако, если мы получим контроль над Кипром в течение 30 дней при сохранении большей части нашей основной территории, то мы сможем подписать мирный договор."
 GRE_turkish_trade: "Торговля с Турцией"
 GRE_turkish_trade_desc: "Один из лучших способов развивать хорошие отношения с двумя странами — это экономическое сотрудничество друг с другом. Продвигая торговлю с Турцией, обе страны выиграют на честных основаниях."
 GRE_settle_eez_dispute: "Урегулирование спора об ИЭЗ"
 GRE_settle_eez_dispute_desc: "Спор об исключительной экономической зоне между Грецией и Турцией затянулся и не принес выгоды ни одной из сторон. Если мы будем содействовать свободной торговле в обеих зонах и договоримся о справедливом механизме распределения ресурсов, мы сможем положить конец этому конфликту и направить энергию на сотрудничество."
 GRE_increased_privatization: "Повышенная приватизация"
 GRE_increased_privatization_desc: "Увеличение приватизации греческой промышленности могло бы принести пользу в укреплении тяжелых отраслей и сектора промышленности в целом, а также в создании новых рабочих мест."
 GRE_leadership: "Вечное лидерство"
 GRE_leadership_desc: "Наш лидер Николаос Михалолиакос сумел объединить народ Греции и создать идеальное греческое общество. Николаос Михалолиакос и партия «Золотая заря» должны править Грецией пожизненно."
 GRE_new_greece_old_ways: "Старые пути новой Греции"
 GRE_new_greece_old_ways_desc: "На протяжении десятилетий нами правили правительства, которые повергли нашу страну в хаос. Теперь греческий народ требует перемен, чтобы мы могли вернуться к тем временам, когда нас славили во всем мире."
 GRE_draft_youth_wing: "Проект Молодежного крыла"
 GRE_draft_youth_wing_desc: "Поскольку мы привлекли больше поддержки со стороны молодежи, следующим этапом станет организация их в военизированные формирования, чтобы они могли защищать страну от врагов революции."
 GRE_foreign_relations: "Международные отношения"
 GRE_foreign_relations_desc: "Новая Греция не может быть изолирована. Нам нужны партнеры для торговли, безопасности и легитимности на мировой арене. Вопрос не в том, следует ли вступать в контакт. Вопрос в том, с кем вступать в контакт и на каких условиях."
 GRE_dev_cyp: "Развитие Кипра"
 GRE_the_hellenic_republic: "Греческая Республика"
 GRE_the_hellenic_republic_desc: "Несмотря на смятение, с которыми мы сталкиваемся, мы не должны отказываться от идеалов демократии и обращаться к тирании, чтобы решить наши проблемы, потому что это было бы предательством для каждого мужчины и женщины в Греции."
 GRE_discredit_eu: "Дискредитация Европейского Союза"
 GRE_discredit_eu_desc: "Чтобы защитить наши идеалы, мы должны показать людям истинные ценности демократии и осуждать радикализм как угрозу для свободы."
 GRE_support_eu: "Вместе с ЕС"
 GRE_support_eu_desc: "Европейский Союз продвигает сотрудничество с нациями, демократические ценности, осуждает радикализм и хочет мирной Европы, и Греция должна расширять связи с Европейским Союзом."
 GRE_dominant_party_desc: "Как и в каждой демократической стране, партии играют большую роль в политике нашей страны, и нам нужно будет мудро выбрать, какая партия поведет нашу страну вперед."
 GRE_dominant_party: "Доминирующая партия"
 GRE_new_democracy: "Новая демократия"
 GRE_new_democracy_desc: "Правоцентристская партия \"Новая демократия\", продемонстрировавшая свою компетентность во многих вопросах и идеалах сохранения наших традиций, является наиболее подходящей партией, которая может возглавить Грецию."
 GRE_socialist_coalition: "СИРИЗА"
 GRE_socialist_coalition_desc: "Основные греческие партии подвели страну и ввергли ее в экономическую катастрофу, а также разделили наше общество. Греции нужна новая партия, чтобы вести ее народ вперед, и мы сплотимся вокруг левой партии СИРИЗА, которая поддерживает народ и выступает против политики наших предыдущих правительств."
 GRE_economic_liberalism: "Экономический либерализм"
 GRE_economic_liberalism_desc: "Экономический либерализм должен быть нашим приоритетом, если мы хотим укрепить греческую экономику, поскольку он приносит увеличение оборотов торговли, а также больше экономических возможностей для наших граждан (например, расширение возможностей трудоустройства)."
 GRE_anti_migration_policies: "Антииммиграционная политика"
 GRE_anti_migration_policies_desc: "В последние годы Греция привлекла большое количество мигрантов. В то время как наше правительство терпимо относится к мигрантам, приезжающим в Грецию в поисках экономических возможностей, нас больше беспокоят незаконные мигранты, так как их число постепенно растёт, и нам потребуется ввести более жёсткие ограничения."
 GRE_counter_radicals: "Противодействие радикалам"
 GRE_counter_radicals_desc: "Радикальные партии в Греции постепенно набирают популярность, и их главная цель — разрушить идеологию созданной нашей нацией демократии. Эти партии также рассматриваются многими как преступные организации в связи с конкретными нападениями на определенные группы людей. Если мы хотим сохранить демократию, нам нужно будет противостоять влиянию радикальных партий."
 GRE_increase_corruption_measures: "Антикоррупционные меры"
 GRE_increase_corruption_measures_desc: "В Греции уже давно существует проблема коррупции во всех секторах государственного управления и она создала много бед для государства. Если имеется цель создать лучшую администрацию, нам нужно искоренить коррупцию в правительстве."
 GRE_increase_industrial_privatization: "Расширение приватизации"
 GRE_increase_industrial_privatization_desc: "Греческая государственная система является одним из крупнейших секторов в Греции. Это на некоторое время создало проблему, поскольку греческий частный сектор относительно слаб. По сравнению с другими странами, конкуренция невелика. Если мы хотим развивать нашу экономику, нам нужно будет отойти от государственного сектора и принять частный."
 GRE_reinforce_justice: "Укрепление системы правосудия"
 GRE_reinforce_justice_desc: "Во многих регионах нашей страны уровень преступности высок из-за недостаточной работы правоохранительных органов. Нашему правительству необходимо укрепить систему правосудия, чтобы снизить уровень преступности в Греции."
 GRE_begin_changing_education_system: "Реформы системы образования"
 GRE_begin_changing_education_system_desc: "Греческая система образования значительно отстает от других европейских стран по количеству школ, финансированию и научному базису. Также имеется отсутствие возможностей для тех, кто имеет низкую квалификацию. Если мы хотим иметь современную систему образования, перспективным будет проведение широкого спектра реформ, чтобы создать лучшую среду для наших детей."
 GRE_worker_rights: "Права рабочих"
 GRE_worker_rights_desc: "В рамках нашей идеологии мы будем расширять права трудящихся, чтобы уменьшить неравенство для всех работающих мужчин и женщин в Греции."
 GRE_question_eu_policies: "Вопрос политики ЕС"
 GRE_question_eu_policies_desc: "Хотя мы считаем, что Европейский союз полезен, многие из его политик неприемлемы, например, усиление экономического контроля. Пока существуют эти политики, Европейский союз не даст нам никаких преимуществ."
 GRE_left_united: "Союз левых сил"
 GRE_left_united_desc: "Наша партия состоит из многих левых отделений и это долгое время создавало проблемы внутри структуры, поэтому мы должны увеличить единство, чтобы объединить левых как одно целое. В ином случае возможны расколы на фракции."
 GRE_support_the_public_sector: "Поддержка гос. сектора"
 GRE_support_the_public_sector_desc: "Государственный сектор является самым крупным в Греции, поскольку в нем занято большое количество людей. Укрепление и его точечная модернизация могут принести больше возможностей для трудоустройства бюджетников, а также большую поддержку правительству."
 GRE_remind_the_failures_of_pasok_and_new_democracy: "Провалы ПАСОК и «Новой демократии»"
 GRE_remind_the_failures_of_pasok_and_new_democracy_desc: "Мы должны напомнить греческому народу о неудачах ПАСОК и Новой демократии, поскольку им удалось увеличить экономическое и социальное неравенство, увеличить внешний долг до $300 млрд, создать долговой кризис, а также увеличить уровень коррупции. Они должны понять, что греческий народ не забыл их катастрофы."
 GRE_encourage_agricultural_growth: "Стимулирование с/х роста"
 GRE_encourage_agricultural_growth_desc: "Сельское хозяйство, безусловно, является крупнейшим и сильным сектором в нашей экономике, и многие из наших экспорта в другие страны являются сельскохозяйственными продуктами, такими как оливковое масло. Увеличение финансирования в сельском хозяйстве повысит нашу экономику, а также увеличит экспорт в другие страны."
 GRE_the_greek_crisis: "Решение долгового кризиса"
 GRE_the_greek_crisis_desc: "Наша экономика из-за огромного долга близка к краху. Поэтому необходимо принять радикальные меры для спасения греческой экономики."
 GRE_enact_austerity_measures: "Принятие мер жесткой экономии"
 GRE_enact_austerity_measures_desc: "Принятие мер жесткой экономии может спасти нашу экономику от краха, но эти меры не будут восприняты легкомысленно населением."
 GRE_reduce_education: "Сокращение средств на образование"
 GRE_reduce_education_desc: "В рамках нашей программы жесткой экономии необходимо сократить финансирование системы образования, чтобы высвободить больше средств, необходимых для восстановления экономических сфер деятельности. Это, к сожалению, снизит эффективность греческой системы образования, но в конечном итоге, поможет всей экономике."
 GRE_reduce_health: "Сокращение расходов на здравоохранение"
 GRE_reduce_health_desc: "Здравоохранение является наиболее дорогим благом в стране. Сумма денег из бюджета, которая идет в греческую систему здравоохранения, слишком велика и является львиной долей трат на уровне социального страхования. Если мы вынужденно сократим средства, которые идут на медицину, это потенциально поможет экономике, но в результате условия лечения граждан заметно ухудшатся, ударив по продолжительности жизни."
 GRE_reduce_welfare: "Сокращение соц. обеспечения"
 GRE_reduce_welfare_desc: "Наша страна инвестировала значительные средства в социальное обеспечение, и хотя это повысило качество жизни наших граждан, это также уменьшило необходимые средства для укрепления нашей экономики. Чтобы спасти экономику, мы должны положить конец государству всеобщего благосостояния, за которое наша страна была известна."
 GRE_reduce_army: "Сокращение военных расходов"
 GRE_reduce_army_desc: "В последние годы потребность в увеличении военного финансирования утратила свою остроту, поскольку наша страна в ближайшее время не собирается воевать. Поэтому было бы разумно изъять часть финансирования из армии, чтобы укрепить более важные секторы нашей экономики."
 GRE_recovery: "Восстановление экономики"
 GRE_recovery_desc: "После трудных решений и неприятных мер жесткой экономии стране удалось остановить экономический спад, а также снизить огромный долг. Стоит надеяться, что держава станет великой, как когда-то."
 greece.1.t: "Возмущение на фоне новой политики жесткой экономии"
 greece.1.d: "Сегодня греческое правительство ввело новые меры жесткой экономии в соответствии с программой спасения долга ЕС. То, что последовало за этим, не назвать мягче, чем возмущение общественности, породившей такие обозначения, как \"антигреческий аскетизм.\" Эти беспорядки только ухудшают положение Греции и можно предположить, что это исключительно верхушка айсберга."
 greece.1.a: "У меня плохое предчувствие."
 greece.2.t: "Беспорядки на улицах!"
 greece.2.d: "Сегодня протесты в Афинах переросли в насилие после того, как полиция попыталась сдержать постоянно растущую толпу. Чтобы остановить толпу от дальнейших разрушений, использовались слезоточивый газ и резиновые пули, и хотя толпа в конечном итоге отступила, напряженность все еще висит в воздухе."
 greece.2.a: "Это они начали!"
 greece.3.t: "Напряженность усиливается"
 greece.3.d: "Толпы на улицах стали шире и шумнее, и они проявляют все больше недовольства. Несомненно, что ситуация только ухудшилась."
 greece.3.a: "Как такое могло произойти?"
 greece.4.t: "«Золотая заря» призывает к выборам"
 greece.4.d: "После роста поддержки крайне правая политическая партия «Золотая заря» потребовала от правительства провести выборы — требование, на которое правительство Греции согласилось из-за высокой поддержки народа, а также внутреннего давления правительства. Ожидается, что партия «Золотая заря» победит, поскольку она имеет высокую поддержку и пригрозила, что если правительство не допустит ее победы, партия вместе со своими сторонниками примет ответные меры против правительства."
 greece.4.a: "Новый великий рассвет Греции!"
 greece.4.b: "Понятно"
 greece.5.t: "КПГ призывает к выборам в Греции"
 greece.5.d: "Получив поддержку большинства рабочего класса Греции и нескольких политических деятелей, КПГ (Коммунистическая партия Греции) призвала правительство провести выборы, на что греческое правительство согласилось, учитывая, что КПГ получила массовую поддержку, и правительство находилось под давлением со стороны многих политиков, требующих провести выборы. Ожидается, что партия КПГ победит на выборах, поскольку она пользуется поддержкой большинства населения, а представитель партии заявил, что если им не позволят провести выборы, рабочий класс поднимет восстание, чтобы свергнуть правительство."
 greece.5.a: "Трудящиеся Греции расправляют крылья"
 greece.5.b: "Посмотрим..."
 greece.6.t: "Греция двигается вправо"
 greece.6.d: "После политической напряженности, а также миграционного и экономического кризиса, народ Греции устал от демократических правительств и пришел поддержать крайне правую партию «Золотая заря». Партия «Золотая заря» выступает против экономической политики правительства, а также решительно настроена против левых и иммиграционных сил и пообещала греческому народу, что они уничтожат все проблемы, которые есть в греческом обществе."
 greece.6.a: "Греция снова поднимется!"
 greece.6.b: "Любопытно"
 greece.7.t: "Греция движется влево"
 greece.7.d: "После жесткой экономической политики, проводимой недавним греческим правительством, безработица возросла, и рабочий класс Греции требует действий против текущего руководства. Рабочие сплотились вокруг крайне левой партии КПГ (Коммунистическая партия Греции), которая выступает против безработицы, нарушений прав трудящихся, а также придерживается антизападной политики и организует постоянные беспорядки, чтобы оказать давление на греческие власти."
 greece.7.a: "Рабочие Греции, ваше освобождение приближается!"
 greece.7.b: "Интересно"
 greece.12.t: "Алексис Ципрас становится лидером СИРИЗА"
 greece.12.d: "10 августа 2008 года левая партия СИРИЗА избрала 33-летнего Алексиса Ципраса своим лидером, что сделало его одним из самых молодых лидеров политических партий в истории Греции."
 greece.12.a: "Поздравления..."
 greece.13.t: "Беспорядки на Северном Кипре"
 greece.13.d: "На севере Кипра вспыхнули вооруженные беспорядки, направленные против планов Греции по объединению Кипра. Беспорядки, очевидно, были организованы турецкими властями; однако их враждебность определенно подорвала наше восприятие."
 greece.13.a: "Ужас!"
 greece.14.t: "Профсоюзы предлагают поддержку"
 greece.14.d: "Наше недавнее нападение на конституцию дало нам значительную политическую оппозицию, профсоюзы предложили свою поддержку в обмен на большую власть. У нас действительно есть выбор?"
 greece.14.a: "Выбора нет."
 greece.15.t: "Профсоюзы требуют больше уступок"
 greece.15.d: "Профсоюзы снова посещают нас, но на этот раз они предлагают не свою добрую и безвозмездную помощь, а свою поддержку, которую они угрожают отнять, если мы не уступим им еще больше власти."
 greece.15.a: "Ублюдки!"
 greece.16.t: "Треснувший фундамент"
 greece.16.d: "С каждой ночью, когда страна разваливается на куски, спать становится все труднее и труднее. Самые северные города подвергаются организованным атакам, которые привели к сотням жертв с обеих сторон, мы не можем долго сдерживать их с такой степенью силы...\n\n §RПытаться сдерживать их на севере бессмысленно, мы должны сосредоточить наши войска для защиты Афин и прилегающих районов, так что увидимся на передовой.§!"
 greece.16.a: "Немедленно собрать генералов!"
 greece.17.t: "Время вышло"
 greece.17.d: "Наши прогнозы окзались верны, северные повстанцы организовались в армию, однако они не кажутся такими агрессивными, как мы изначально ду... \nСекунду, необходимо ответить... \nДа. \nДа.\nВы уверены?\n\n...Мать вашу."
 greece.17.a: "'Их, кажется, хватит на несколько попыток прорыва через наши рубежи.'"
 greece.18.t: "Греция отказывается от Пирея"
 greece.18.d: "Порт Пирей недавно был продан греческим правительством в попытке получить средства для долгового кризиса, было бы более чем стоящей инициативой добавить Пирей в нашу коллекцию, и это также открыло бы дверь для дальнейших проектов внутри Греции, а также Европы, расширяя наше влияние в регионе."
 greece.18.a: "Укажите самую высокую ставку."
 greece.18.b: "Наша незаинтересованность в таком проекте не может быть выражена простыми словами."
 greece.19.t: "Китай претендует на Пирей"
 greece.19.d: "Китайцы проявили интерес к порту Пирей и впоследствии предложили значительную сумму денег за исключительные права на порт, выиграв тендер. То, что Китай решит делать с портом в будущем, зависит от них, однако у нас также есть возможность помешать Китаю расширить порт или начать какие-либо другие проекты, если мы сочтем это опасным."
 greece.19.a: "Сделка с дьяволом."
 greece.20.t: "Китай не проявляет интереса к Пирею"
 greece.20.d: "Несмотря на все наши усилия, китайское правительство отклонило наше предложение почти без раздумий."
 greece.20.a: "Как знать, к лучшему или к худшему."
 greece.22.t: "Напряженность в области жесткой экономии рассеивается"
 greece.22.d: "Как видно, это \"тихий\" день для Греции, поскольку демонстрации против жесткой экономии, кажется, на какое-то время прекратились, возможно, это просто истощение постоянного протеста, а возможно и что-то еще..."
 greece.22.a: "Слава Богу."
 greece.23.t: "Энозис"
 greece.23.d: "После десятилетий беспорядков, разобщенности и тревоги по поводу разрыва семейных уз и связей конференции «Энозис» принесли свои плоды.\n\nГреки-киприоты празднуют на улицах, турки-киприоты достаточно умиротворены, и британцы, похоже, вполне довольны достигнутыми нами договоренностями.\n\nОстается еще один нерешенный вопрос: что делать с Акротири и Декелией?"
 greece.23.a: "Запросить полный контроль"
 greece.23.b: "Позволить Королевским ВВС поддерживать базы"
 greece.24.t: "Правительство Греции хочет вернуть Акротири!"
 greece.24.d: "Достигнув своих целей по Энозису, греческое правительство обратилось к нам с просьбой вернуть базы в Акротири и Декелии. Должны ли мы позволить им вернуться под греческое правление?"
 greece.24.a: "Было бы неправильно не выполнять их требования"
 greece.24.b: "Нет!"
 greece.25.t: "Правительство Греции разрешает нам оставаться на Кипре!"
 greece.25.d: "Добившись своих целей в рамках Энóсиса, греческое правительство пришло к выводу, что возвращение Акротири и Декелии было бы неудобным для всех сторон. К счастью, нам не придётся выводить наши войска с этой территории."
 greece.25.a: "Тогда хорошо!"
 GRE_tax_relief_for_businessman: "Налоговые льготы для бизнесменов"
 GRE_tax_relief_for_businessman_desc: "Мы должны оказать финансовую помощь бизнесам, так как они были оставлены бороться за себя в условиях политики наших предыдущих администраций, и поэтому мы снизим их налоги."
 istanbul_renamed: "Стамбул переименован"
 GRE_9833_name: "Константинополь"
 GRE_constantinople_not_istanbul: "Константинополь, а не Стамбул"
 GRE_constantinople_not_istanbul_desc: "На протяжении пяти веков Константинополь был известен под другим именем. Город Константина и Юстиниана, Святой Софии и Феодосиевских стен, переименованный и переписанный завоевателем. Теперь, когда город находится в руках греков, мы восстанавливаем то, что история у нас отняла."
 GRE_gain_10_strength: "§HГреко-киприоты§! §Gполучат§! §H10 силы!§!"
 GRE_lose_10_gain_10: "§HТурки-киприоты§! §Rпотеряют§! §H10 силы!§!"
 GRE_austerity_idea: "Напряженность в области жесткой экономии"
 GRE_austerity_idea_desc: "Программа жесткой экономии исчерпала терпение общественности. Протесты распространяются от Афин до Салоников, забастовки парализуют порты и больницы, политическая обстановка накаляется. Каждое новое сокращение лишь подливает масла в огонь. Если не удастся справиться с напряженностью, полномасштабные беспорядки станут вполне реальной угрозой."
 GRE_please_south_desc: "Продолжая угождать киприотам-грекам, мы можем быть уверены, что они с большей вероятностью поддержат нас в нашем стремлении объединить Кипр и, в конечном счёте, достичь цели Энозиса."
 GRE_please_north_desc: "Подчёркиваем, что турки-киприоты не являются ни греками, ни киприотами. Они — колонизаторы и захватчики, которых нужно изгнать с Кипра."
 TUR_CYP_incite_riot_desc: "Пришло время начать провоцировать беспорядки на Южном Кипре, чтобы не дать грекам получить политическое влияние в регионе."
 TUR_CYP_propaganda_north_desc: "Усиление и распространение пропаганды среди северных киприотов, чтобы они не поддавались влиянию греков, имеет первостепенное значение для нашего успеха в регионе."
 TUR_CYP_propaganda_south_desc: "Усиление и распространение пропаганды среди южных киприотов, чтобы они не поддались влиянию греков, имеет первостепенное значение для нашего успеха в регионе."
 TUR_attack_CYP_strength_desc: "Нанося удары по позициям киприотов-греков, мы можем гарантировать, что они не смогут получить политическое влияние в регионе."
 GRE_attack_turkish_strength_desc: "Нанося удары по позициям турок-киприотов, мы можем гарантировать, что они не смогут получить политическое влияние в регионе."
 GRE_nato_pressure_turkey_accept_tt: "Союзники, поддерживающие Грецию, ослабляют напряженность в Эгейском море и наращивают темпы переговоров по Кипру, что повышает вероятность того, что Турция отступит в течение месяца."
 GRE_nato_pressure_turkey_reject_tt: "Союзники, которые отказываются, не добавляют дипломатического веса, что снижает вероятность уступок со стороны Турции."
 GRE_hellenic_economy: "Греческая экономика"
 GRE_hellenic_economy_desc: "Греческая экономика находится в сложном положении. Растущий долг, безработица и вопрос о вступлении в еврозону — все это неотложные проблемы. Однако у нас есть сильный торговый флот, стратегическое положение и туризм, который ежегодно привлекает миллионы посетителей. Мы должны максимально использовать то, что у нас есть."
 GRE_debt_mounts: "Долг растет"
 GRE_debt_mounts_desc: "Наш долг вырос почти до $300 млрд, что является одним из самых высоких показателей на душу населения в мире. Процентные платежи поглощают огромную часть нашего бюджета, оставляя мало места для инвестиций. Иностранные банкиры начинают проявлять беспокойство, а ЕС требует ответов. Нам необходимо действовать, прежде чем ситуация ухудшится."
 GRE_debt_mounts_req_tt: "Наш коэффициент задолженности §YUnified Debt Ratio§! выше, чем §Y90%§! (текущий §Y[?GRE_unified_debt_ratio|-1%]§!)"
 GRE_brics_membership_req_tt: "Показатель выравнивания по восточному направлению превышает 7."
 GRE_pillar_of_the_west_req_tt: "Уровень приверженности Запада превышает 3."
 GRE_aegean_assertiveness_event_tt: "§YЧерез 90 дней Турция ответит на наши патрулирования в Эгейском море.§!"
 GRE_cyprus_gas_crisis_event_tt: "§RВ условиях и без того высокой напряженности бурение спровоцирует реакцию турецкого военно-морского флота в течение нескольких дней.§!"
 GRE_greek_bonds: "Возвращение на рынки облигаций"
 GRE_greek_bonds_desc: "После кризиса Афины оказались не в состоянии позволить себе долгосрочные заимствования, в результате чего казначейство зависит от краткосрочных векселей и выплат кредиторам. Выпуск десятилетних облигаций, размещенных через Агентство по управлению государственным долгом среди европейских и американских фондов, позволил бы проверить, готовы ли инвесторы снова предоставлять Греции кредиты на обычных условиях."
 GRE_solve_evasion: "Раскрыть проблему уклонения от уплаты налогов"
 GRE_solve_evasion_desc: "Ежегодно из-за уклонения от уплаты налогов теряются миллиарды доходов. Если мы улучшим сбор налогов, инвестируем в более совершенные технологии и примем жесткие меры в отношении оффшорных счетов, мы сможем закрыть лазейки и вернуть наш бюджет в нужное русло."
 GRE_convert_to_euro: "Перевести в евро"
 GRE_convert_to_euro_desc: "Евро – это одновременно и возможность, и риск. Его принятие связывает нашу экономику с европейской, что означает большую стабильность, чем когда-либо обеспечивала драхма, но мы теряем контроль над собственной денежно-кредитной политикой. От нас зависит, стоит ли этот компромисс того."
 GRE_skouries_mines: "Шахты Скуриес"
 GRE_skouries_mines_desc: "Месторождение меди и золота Скуриес на Халкидики — одно из крупнейших в Европе. Иностранные корпорации хотят получить права на добычу, обещая рабочие места и богатство. Экологи выступают против. Нам нужно будет решить, что важнее."
 GRE_local_manufacturing: "Сделано в Греции"
 GRE_local_manufacturing_desc: "Греческая обрабатывающая промышленность сократилась до нескольких секторов: пищевая промышленность, производство цемента, алюминия, фармацевтика и судостроение вдоль побережья Перама. Правило приоритета отечественных предприятий в государственных закупках в сочетании с инвестиционными стимулами в рамках Закона о развитии позволило бы оставшимся заводам получить необходимый портфель заказов для повторного найма персонала."
 GRE_military_industrial: "Греческая оружейная промышленность"
 GRE_military_industrial_desc: "Компания Elliniki Viomichania Oplon и ее дочерняя фирма Pyrkal вооружают греческих солдат еще со времен холодной войны, однако десятилетия государственной собственности оставили их обремененными долгами и простаивающими производственными линиями. Постоянные, целенаправленные субсидии могли бы поддерживать работу печей, обеспечить внутренние поставки боеприпасов и стрелкового оружия, а также объединить две компании в единого конкурентоспособного производителя, а не превращать их в постоянную обузу для казны."
 GRE_agriculture_sector: "Основа сельской местности"
 GRE_agriculture_sector_desc: "Почти пятая часть греков по-прежнему зарабатывает на жизнь земледелием, от оливковых рощ Пелопоннеса до хлопковых полей Фессалии. Однако этот сектор стареет, раздроблен на крошечные участки и зависит от субсидий Брюсселя в рамках Единой сельскохозяйственной политики. Поддержка наших фермеров и одновременно развитие ирригации, кооперативов и современной техники позволили бы сохранить поставки оливок Каламата, феты и ассиртико на мировые столы."
 GRE_power_corporations: "Государственная энергетическая корпорация"
 GRE_power_corporations_desc: "На протяжении полувека государственная энергетическая корпорация DEI обеспечивала электроснабжение, сжигая бурый уголь, добываемый в шахтах Птолемаиды и Мегалополиса. Этот уголь дешев, но грязен, а наша зависимость от импортной нефти и газа делает нас уязвимыми перед любыми потрясениями на Ближнем Востоке. Модернизация энергосистемы, расширение газовой сети DEPA и строительство новых электростанций превратили бы эти предприятия в стратегическую опору страны."
 GRE_austerity_measures: "Меры жесткой экономии"
 GRE_austerity_measures_desc: "Кредиторы требуют сокращения пенсий, повышения налогов и отмены социальных выплат. Без мер жесткой экономии мы столкнемся с банкротством, но вместе с ним — с общественным недовольством. Протесты и забастовки неизбежны. Здесь нет простых решений."
 GRE_debt_refactoring: "Стратегическая реструктуризация долга"
 GRE_debt_refactoring_desc: "Аукционы облигаций дали нам время, но этого недостаточно. Кредиторы теряют терпение, а процентные платежи истощают казну. Нам необходимо реструктурировать наш долг: пересмотреть условия, продлить сроки погашения и показать нашим партнерам, что, предоставив нам передышку, мы действительно сможем им вернуть деньги."
 GRE_ilarionas_hydro: "Иларионас ГЭС"
 GRE_ilarionas_hydro_desc: "Река Иларионас на севере Греции обладает огромным гидроэнергетическим потенциалом. Гидроэлектроэнергия — это чистый, возобновляемый источник энергии, работающий по требованию, в отличие от солнечной или ветровой энергии. Этот проект мог бы обеспечить электроэнергией сотни тысяч домов."
 GRE_telecomms: "Инвестиции в OTE"
 GRE_telecomms_desc: "Миллионы греков в островных деревнях и горных городах до сих пор не имеют надежного доступа к телефонной связи и интернету. Государственные инвестиции в проект OTE могли бы соединить эти районы с остальной частью страны, обеспечив фермерам доступ к рынкам, а студентам — к университетам."
 GRE_new_railways: "Реконструкция железнодорожной линии Афины-Салоники"
 GRE_new_railways_desc: "Афинско-Салоникиский коридор является основой экономики материковой Греции, но железнодорожная линия работает мучительно медленно. Современный подвижной состав и модернизированные пути могли бы сократить время в пути вдвое и дать реальный импульс экономике провинции."
 GRE_highway_initiatives: "Продлить автомагистрали AX"
 GRE_highway_initiatives_desc: "Горы, некогда разделявшие древние города-государства, до сих пор изолируют общины и препятствуют торговле. Предлагаемая сеть автомагистралей AX пройдет через Пиндский хребет и соединит западное побережье с Фессалией. Это будет дорогостоящим проектом, но экономические выгоды могут его оправдать."
 GRE_hellas_gold: "Углубить шахты Кассандры"
 GRE_hellas_gold_desc: "В горнодобывающем районе Кассандра имеются значительные запасы хрома, которые еще не полностью разработаны. Расширение существующих разработок и инвестиции в добывающее оборудование позволят вывести эти богатства на рынок и снизить нашу зависимость от импорта."
 GRE_euboea_bauxite_deposits: "Бокситовые месторождения Эвбеи"
 GRE_euboea_bauxite_deposits_desc: "Эвбея обладает значительными запасами бокситов, которые являются основной рудой для производства алюминия. Крупномасштабная добыча могла бы обеспечить нашу промышленную базу и сократить дорогостоящий импорт."
 GRE_industrial_lignite_mining: "Бассейн реки Птолемаида"
 GRE_industrial_lignite_mining_desc: "Открытые угольные месторождения вокруг Птолемаиды и Аминтайо в Западной Македонии на протяжении полувека обеспечивали электроэнергией Государственную энергетическую корпорацию. Расширение добычи и строительство завода по сжижению угля превратят этот бассейн из устаревшего угольного района в источник внутреннего топлива."
 GRE_rare_element_prospecting: "Исследование греческих недр"
 GRE_rare_element_prospecting_desc: "Золото-медно-порфировые месторождения Халкидики, бокситовый пояс Парнаса и Пелопоннеса, а также никелевые латериты Эвбеи — это лишь обозначенные на карте месторождения. Национальная геологическая служба, проводимая IGME и подкрепленная лицензиями на разведку, позволит определить следующее поколение мест добычи."
 GRE_transport_sector: "Дороги, железные дороги и паромы"
 GRE_transport_sector_desc: "Жизнь и судьба страны, состоящей из островов и гор, зависят от её транспорта. Автобусы KTEL курсируют по перевалам, сине-белые паромы соединяют Эгейское море, а автобусы и троллейбусы OASA каждое утро доставляют жителей Афин на работу. Обновление устаревающего автопарка, расширение маршрутов в пригороды и объединение автомобильного, железнодорожного и морского транспорта в единую систему с билетами позволило бы товарам доставляться на рынок, а рабочим — на работу."
 GRE_vintage_wines: "Греческие винтажи"
 GRE_vintage_wines_desc: "Греки прессовали виноград еще до основания Рима, однако мир до сих пор знает наше вино только как дешевую рецину в графине из таверны. Это несправедливо по отношению к вулканическому Ассиртико с Санторини, смелому Ксиномавро из Наоуссы и рубиновому Агиоргитико из Немеи. Инвестиции в розлив вина из собственных хозяйств, маркировку защищенного происхождения и винный туризм могли бы, наконец, поставить греческие вина в один ряд с великими винами Франции и Италии."
 GRE_tobacco_plantations: "Восточный табак"
 GRE_tobacco_plantations_desc: "Высушенные на солнце листья басмы из Македонии и Фракии на протяжении поколений наполняли ароматом лучшие в мире смеси, а такие дома, как Papastratos в Пирее, сколотили на них целые состояния. Возможно, спрос на курение на Западе снижается, но он сохраняется на Балканах и Ближнем Востоке, и тысячи мелких фермеров вокруг Кавалы и Ксанти по-прежнему зависят от урожая. Мы должны поддерживать производителей, одновременно помогая тем, кто может, перейти к выращиванию новых культур."
 GRE_gas_oil_plants: "Нефтеперерабатывающие заводы Аттики"
 GRE_gas_oil_plants_desc: "Нефтеперерабатывающие заводы, расположенные вокруг Саронического залива, — Hellenic Petroleum в Аспропиргосе и Элефсине и Motor Oil Hellas в Агиои-Теодорои — перерабатывают нефть, которая обеспечивает функционирование Греции и половины Балкан. Но старые установки изношены, и их рентабельность снижается. Новые мощности по крекингу, более чистая десульфуризация и расширенные хранилища обеспечили бы нам место в качестве нефтеперерабатывающего центра юго-восточного Средиземноморья."
 GRE_trim_the_fat: "Сбросьте жир"
 GRE_trim_the_fat_desc: "Правительство раздулось и стало неэффективным. Министерства переполнены, контракты достаются друзьям и родственникам, а бюрократия душит всё. Нам нужно сократить расходы, убрав лишнее, автоматизировав там, где это возможно, и привлекая людей к ответственности."
 GRE_debt_swaps: "Партнеры по обмену долгов"
 GRE_debt_swaps_desc: "Обмен наших долговых обязательств на облигации, номинированные в иностранной валюте, может снизить нашу подверженность волатильности. Для этого необходимы хорошие банковские партнеры и определенные финансовые маневры, но это один из способов управления долгом без значительных политических последствий."
 GRE_debt_swap_initial_tt: "§G50 миллиардов§! государственного долга будет передано выбранному партнёру под §G3%§! годовых."
 GRE_debt_swap_accepted_opinion: "Принятый обмен долговых обязательств"
 GRE_debt_swap_rejected_opinion: "Отклоненный обмен долговых обязательств"
 GRE_olympic_airways: "Олимпик Эйрвейс"
 GRE_olympic_airways_desc: "Авиакомпания Olympic Airways, основанная Аристотелем Онассисом, когда-то была гордостью греческой авиации. В последние годы авиакомпания испытывает трудности, но ее имя по-прежнему имеет значение. Возрождение перевозчика могло бы привлечь туристов и заставить их возвращаться снова и снова."
 GRE_trainose: "TrainOSE"
 GRE_trainose_desc: "Греческая железнодорожная система, некогда заброшенная, обрела новую жизнь. Компания TrainOSE осуществляет пассажирские и грузовые перевозки, соединяя Афины с Салониками, Пелопоннес с материковой частью Греции. Расширяя маршруты, улучшая расписание и инвестируя в подвижной состав, мы можем сделать железную дорогу реальной альтернативой."
 GRE_cotton_plantations: "Хлопковые плантации"
 GRE_cotton_plantations_desc: "Греческий хлопок из Фессалии и Македонии считается одним из лучших в мире. Прочные волокна и превосходное качество делают его идеальным для текстильной промышленности. Поддержка наших хлопководов и инвестиции в производство могли бы вернуть эту отрасль на тот уровень, на котором она должна быть."
 GRE_fisheries_expansion: "Богатства Эгейского моря"
 GRE_fisheries_expansion_desc: "Греция вылавливает больше выращенного морского леща и морского окуня, чем любая другая страна Европы, ее садки расположены вдоль защищенных заливов Ионического и Эгейского морей. Но дикие запасы истощаются из-за чрезмерного вылова, загрязнения и траулеров, пересекающих морскую границу. Расширение аквакультуры, обновление прибрежного флота и обеспечение честных квот позволили бы сохранить как рыбаков, так и рыбу."
 GRE_aegean_wind_banks: "Использование Мелтеми"
 GRE_aegean_wind_banks_desc: "Каждое лето над Кикладами с ревом проносится Мельтеми, один из самых надежных ветров во всей Европе. Турбины, протянутые по островам и горным хребтам материка, могли бы поставлять в сеть чистую энергию и разорвать нашу зависимость от импортной нефти и угля. Однако еще большей целью является межсетевой соединитель, который наконец-то подключит дизельные генераторы островов к национальной сети."
 GRE_resolution_crisis: "Разрешение кризиса"
 GRE_resolution_crisis_desc: "Мы слишком долго занимались урегулированием кризиса вместо того, чтобы действительно его решать. Пришло время для полноценного плана, который одновременно решит проблемы долга, роста, банковской системы и реформ. Это будет непросто, но это единственный путь вперед. Завершение работы над этим направлением позволит навсегда преодолеть долговой кризис, поэтому мы должны сначала взять наш долг под контроль: процентные ставки ниже 8%, а отношение долга к ВВП ниже 50%."
 GRE_urban_railways: "Расширение Афинского метрополитена"
 GRE_urban_railways_desc: "Афинское метро преобразило столицу перед Олимпийскими играми 2004 года, но целые районы по-прежнему остаются вне его досягаемости, Салоники десятилетиями ждут собственной линии, а пригородная железная дорога Проастиакос едва ли реализует свой потенциал. Прокладка новых тоннелей, продление трамвайной линии до побережья и соединение городов транспортными сетями позволили бы разгрузить транспортный поток, очистить смог и улучшить повседневную жизнь миллионов людей."
 GRE_ionian_solar: "Ионическое Солнечное"
 GRE_ionian_solar_desc: "Ионические острова получают много солнечного света. Установка солнечных электростанций на Корфу, Лефкаде и Закинтосе позволила бы нам воспользоваться этим преимуществом и снизить зависимость от импортируемого ископаемого топлива."
 GRE_tourism_boom: "Воплотите свой миф в Греции."
 GRE_tourism_boom_desc: "От пляжей Крита до кальдеры Санторини и белоснежных улочек Миконоса Греция ежегодно привлекает десятки миллионов туристов, и туризм уже приносит почти пятую часть всего дохода экономики страны. Скоординированные усилия Национальной туристической организации по маркетингу, увеличению пропускной способности аэропортов и улучшению транспортной доступности островов могли бы превратить этот сезонный поток туристов в подлинный источник национального богатства."
 GRE_tourism_boom_event_TT: "§YРекордный сезон вызывает споры о том, куда следует направить деньги.§!"
 GRE_mass_tourism: "Солнце, песок и пакетные предложения"
 GRE_mass_tourism_desc: "Заполните чартерные рейсы из Манчестера и Дюссельдорфа, постройте вдоль побережья курорты «все включено» и позвольте миллионам туристов хлынуть сюда. Массовый туризм наполняет казну и позволяет каждому островитянину получать летнюю зарплату, но он истощает водоносные горизонты Миконоса, засыпает скалы Санторини пассажирами круизных лайнеров и изматывает терпение тех, кто там живет."
 GRE_premium_tourism: "Яхты и бутик-отели"
 GRE_premium_tourism_desc: "Меньше гостей, но каждый платит гораздо больше и бережет гораздо больше. Ориентация на пятизвездочные курорты, культурный и археологический туризм, а также яхтенные пристани Ионического моря защищает хрупкие острова и греческий бренд. Хотя общее количество прибывающих туристов растет медленнее, деньги, оставшиеся на островах, поступают гораздо значительнее."
 GRE_diaspora_remittances: "Ухаживания за диаспорой"
 GRE_diaspora_remittances_desc: "Миллионы греков за границей, от Мельбурна до Чикаго, поддерживают связи со своей родиной. Направляя свои сбережения и денежные переводы в экономику, они превращают чувства в капитал."
 GRE_diaspora_remittances_event_TT: "§YДиаспора откликается на призыв к инвестициям.§!"
 GRE_reverse_brain_drain: "Остановить утечку мозгов"
 GRE_reverse_brain_drain_desc: "Кризис вынудил целое поколение греческих инженеров, врачей и исследователей уехать за границу. Налоговые льготы, финансирование исследований и реальные рабочие места могут вернуть их и их опыт на родину."
 GRE_eu_cohesion_funds: "Фонды сплочения ЕС"
 GRE_eu_cohesion_funds_desc: "Как один из стран-членов Европейского союза с самым низким уровнем дохода, Греция является чистым получателем структурного и когезионного финансирования. Использование каждого доступного евро направляется на строительство дорог, портов и региональное развитие."
 GRE_recovery_resilience_facility: "Центр восстановления и повышения устойчивости"
 GRE_recovery_resilience_facility_desc: "Фонд восстановления и повышения устойчивости после пандемии направляет десятки миллиардов на «зеленый» и цифровой переход. При грамотном расходовании это крупнейшая инвестиционная программа в современной истории Греции."
 GRE_recovery_facility_event_TT: "§YБрюссель выделяет первый транш, и Афинам предстоит решить, как быстро его потратить.§!"
 GRE_infrastructure_cofinancing: "Софинансирование инфраструктуры"
 GRE_infrastructure_cofinancing_desc: "Европейские деньги покрывают большую часть расходов, греческие — остальную. Автомагистрали, линии метро и транспортные сети, финансируемые совместно, строятся за гораздо меньшую сумму, чем в среднем по стране."
 GRE_deterrence_posture: "Позиция сдерживания"
 GRE_forward_posture_mod: "Агрессивная передовая позиция"
 GRE_defense_partner: "Партнер по обороне"
 GRE_naval_partner: "Военно-морской партнер"
 GRE_strong_naval_partner: "Близкий военно-морской партнер"
 GRE_defense_exporter: "Экспортер оборонной продукции"
 GRE_f35_partner: "Партнер программы F-35"
 GRE_aegean_encroachment: "Эгейское вторжение"
 GRE_refused_debt_call_opinion: "Отказано в требовании о погашении долга"
 GRE_debt_forgiven_opinion: "Долг прощён"
 GRE_debt_fully_repaid_opinion: "Долг полностью погашен"
 GRE_forgave_debt_opinion: "Простили наш долг"
 GRE_economy_modifier: "Греческая экономика"
 GRE_debt_crisis_category: "Долговой кризис [GRE.GetAdjective]"
 GRE_debt_crisis_category_desc: "Несмотря на экономический рост, наш долг продолжает расти, достигая всё больших размеров, будь то из-за неэффективных государственных расходов, погашения облигаций или регулярных бюджетных дефицитов. Нам необходимо справиться с долгом, прежде чем он перерастёт в кризис, или превратить его в инструмент обеспечения нашего дальнейшего процветания в новом тысячелетии.\n\nТекущее соотношение ВВП к государственному долгу: [?debt_ratio|%Y]\nТекущий §YДолг, удерживаемый кредиторами§!: $$[?GRE_total_creditor_debt|0]\n"
 GRE_austerity_tension_mission: "Напряженность, вызванная мерами жесткой экономии"
 GRE_austerity_tension_mission_desc: "Сокращение расходов и повышение налогов вызвали недовольство населения. Мы должны снизить наш единый коэффициент задолженности ниже §Y75%§!, чтобы положить конец напряжённости. Каждый раз, когда время истекает, протесты усиливаются, и если они достигнут своего пика, страна скатится в полномасштабный долговой кризис."
 GRE_debt_crisis_mission: "Долговой кризис [GRE.GetAdjective]"
 GRE_debt_crisis_mission_desc: "Меры жёсткой экономии провалились, и рынки потеряли в нас веру. Мы должны снизить наш единый коэффициент задолженности ниже §Y75%§! за счёт сокращения расходов и перекладывания долга на иностранных кредиторов. Каждый раз, когда время истекает, правительство расплачивается за это, и наш провал рискует потянуть за собой всю еврозону."
 GRE_austerity_placate_decision: "Умиротворить протестующих"
 GRE_austerity_placate_decision_desc: "Информационно-просветительская работа правительства и адресная помощь могут смягчить общественное недовольство. Снижение видимого давления, вызванного мерами жесткой экономии, должно способствовать восстановлению стабильности и уменьшению напряженности."
 GRE_slash_public_spending_decision: "Сокращение государственных расходов"
 GRE_slash_public_spending_decision_desc: "Повсеместные сокращения министерств, государственных зарплат и пенсий. Бухгалтерский учет будет выглядеть лучше, но люди почувствуют каждый евро. Сократит наш государственный долг на §Y5%§!."
 GRE_emergency_tax_hikes_decision: "Экстренное повышение налогов"
 GRE_emergency_tax_hikes_decision_desc: "Повышение НДС и подоходного налога для покрытия дефицита бюджета. Доходы реальны, как и недовольство правящей партией. Сократит наш государственный долг на §Y4%§!."
 GRE_privatization_drive_decision: "Кампания по приватизации"
 GRE_privatization_drive_decision_desc: "Продажа государственных активов, от портов до коммунальных предприятий, тому, кто готов заплатить. Единовременная прибыль, которую профсоюзы быстро не простят. Сократит наш государственный долг на §Y8%§!."
 GRE_unified_ratio_below_75_tt: "Наш §YЕдиный коэффициент задолженности§! ниже §Y75%§! (текущее значение: §Y[?GRE_unified_debt_ratio|-1%]§!)"
 GRE_buys_mission_time_tt: "§GДобавляет 30 дней к сроку действия миссии по погашению долга§!"
 GRE_austerity_mission_active: "\nТекущая напряженность в режиме жесткой экономии составляет §R[gre_austerity_tension]§!"
 GRE_generic_decisions_category: "[GRE.GetNameWithFlag] Политические решения"
 GRE_generic_decisions_category_desc: "В компетенции греческого правительства принимаются политические решения."
 GRE_rename_istanbul_desc: "После того как Константинополь перешел под греческий контроль, правительство официально восстановило историческое название города. Переименование имеет глубокое культурное значение и поднимает национальный моральный дух."
 GRE_archipelago_air_base_rapid_repair: "Программа быстрого ремонта авиабаз"
 GRE_archipelago_air_base_rapid_repair_desc: "Размещение специализированных ремонтных бригад и заблаговременно подготовленного оборудования на островных авиабазах позволяет быстрее устранять повреждения, нанесенные вражескими ударами, и поддерживать боеспособность нашей авиации."
 GRE_archipelago_anti_air_rapid_repair: "Протоколы технического обслуживания противовоздушных батарей"
 GRE_archipelago_anti_air_rapid_repair_desc: "Мобильные ремонтные бригады на островных объектах противовоздушной обороны, оснащенные стандартизированными запчастями и прошедшие соответствующее обучение, позволили бы нам быстрее восстанавливать поврежденные батареи и поддерживать целостность нашей системы противовоздушной обороны."
 GRE_archipelago_bunker_repair_protocols: "Корпус по ремонту островных укреплений"
 GRE_archipelago_bunker_repair_protocols_desc: "Специализированные инженерные подразделения по всему архипелагу сосредоточены на быстром восстановлении бункеров. Поврежденные укрепления можно быстро вернуть в полную боеспособность."
 GRE_archipelago_naval_base_repair_protocols: "Инициатива по техническому обслуживанию военно-морской базы"
 GRE_archipelago_naval_base_repair_protocols_desc: "Заранее подготовленные ремонтные материалы и квалифицированные специалисты на военно-морских базах островов позволяют быстрее восстанавливать поврежденную портовую инфраструктуру и обеспечивать бесперебойную работу морских операций."
 GRE_archipelago_coastal_obstacle_network: "Сеть прибрежных препятствий"
 GRE_archipelago_coastal_obstacle_network_desc: "Подводные препятствия, минные поля и заграждения на потенциальных зонах высадки значительно затруднят любую вражескую военно-морскую атаку на наши берега."
 GRE_archipelago_supply_disruption: "Отказ в поставках на ключевой территории"
 GRE_archipelago_supply_disruption_desc: "Заранее спланированные логистические сбои в работе наших островных центров затруднят любому оккупационному противнику поддержание линий снабжения или эксплуатацию местных ресурсов."
 GRE_archipelago_coastal_battery_expansion: "Программа расширения береговой батареи"
 GRE_archipelago_coastal_battery_expansion_desc: "Расширение наших береговых артиллерийских установок за пределы возможностей, обычно предоставляемых рельефом местности. Островная география не должна ограничивать наши возможности по обороне береговой линии."
 GRE_archipelago_island_fortress_expansion: "Программа расширения островной крепости"
 GRE_archipelago_island_fortress_expansion_desc: "Необходимо финансировать инженерные работы по строительству бункеров за пределами существующих ограничений по рельефу местности. Наши острова способны выдержать более мощные укрепления, чем предполагалось в рамках нынешней доктрины."
 GRE_archipelago_attrition_doctrine: "Доктрина истощения архипелага"
 GRE_archipelago_attrition_doctrine_desc: "Кодификация тактики, использующей островной рельеф для истощения любых атакующих сил. Подразделения противника на открытой местности будут подвергаться более высоким потерям и постоянным атакам с наших подготовленных позиций."
 GRE_archipelago_supply_interdiction: "Операции по перехвату грузов на островах"
 GRE_archipelago_supply_interdiction_desc: "Подготовка и размещение подразделений с целью активного пресечения доступа вражеских сил к местным ресурсам. Любой противник, действующий на наших островах, столкнется с систематическим перекрытием источников снабжения."
 GRE_archipelago_missile_battery_expansion: "Расширение системы противоракетной обороны острова"
 GRE_archipelago_missile_battery_expansion_desc: "Дополнительное финансирование позволит построить объекты противоракетной обороны за пределами обычных ограничений рельефа на территории архипелага. Увеличение инвестиций в инженерные разработки позволит нам преодолеть типичные ограничения, связанные с рельефом местности."
 GRE_archipelago_air_defense_expansion: "Расширенная сеть противовоздушной обороны"
 GRE_archipelago_air_defense_expansion_desc: "Повышение предельной высоты для размещения зенитных установок сверх стандартных ограничений по рельефу местности. Даже небольшие острова смогут получить плотное противовоздушное покрытие."
 GRE_archipelago_decision_active: "Программа защиты архипелага уже реализуется."
 GRE_archipelago_set1_A_chosen: "Программа ускоренного ремонта авиабаз завершена."
 GRE_archipelago_set1_B_chosen: "Протоколы технического обслуживания зенитных батарей завершены."
 GRE_archipelago_set2_A_chosen: "Корпус по ремонту островных укреплений завершил работы."
 GRE_archipelago_set2_B_chosen: "Инициатива по техническому обслуживанию военно-морской базы завершена."
 GRE_archipelago_set3_A_chosen: "Завершено строительство сети прибрежных препятствий."
 GRE_archipelago_set3_B_chosen: "Отказ в поставках на основной территории завершен."
 GRE_archipelago_set4_A_chosen: "Программа расширения береговой батареи завершена."
 GRE_archipelago_set4_B_chosen: "Программа расширения островной крепости завершена."
 GRE_archipelago_set5_A_chosen: "Доктрина истощения архипелага завершена."
 GRE_archipelago_set5_B_chosen: "Операции по перехвату грузов на острове завершены."
 GRE_archipelago_set6_A_chosen: "Завершено расширение системы противоракетной обороны острова."
 GRE_archipelago_set6_B_chosen: "Завершено расширение сети противовоздушной обороны."
 GRE_lie_about_financial_records_decision: "Внесите благоприятные корректировки в финансовую отчетность."
 GRE_lie_about_financial_records_decision_desc: "Несмотря на постоянный экономический рост, устаревшая валюта и другие экономические проблемы мешают нам завершить заключение экономических соглашений с Европейским союзом."
 GRE_negotiate_debt_swap_deals_decision: "Ведение переговоров по сделкам обмена долгов"
 GRE_negotiate_debt_swap_deals_decision_desc: "Начать переговоры с иностранной державой о реструктуризации нашего долга посредством валютных свопов. Переложив наши обязательства на центральный банк другой страны, мы можем добиться более выгодных условий погашения."
 GRE_defer_payments_decision: "Отложить выплаты по программе Focus"
 GRE_defer_payments_decision_desc: "Вместо того чтобы оплачивать экономические программы авансом, лучше отложить эти расходы на погашение государственного долга. Это позволит сохранить нашу казну за счет увеличения наших обязательств."
 GRE_do_not_defer_payments_decision: "Возобновить прямые платежи"
 GRE_do_not_defer_payments_decision_desc: "Прекратите откладывать расходы и вернитесь к прямому финансированию экономических программ из казначейства."
 CYP_NCY_diplomatic_category: "Переговоры о воссоединении Кипра"
 GRE_brit_5_TT: "§GПолучить 5 ед. британской поддержки§!"
 GRE_brit_30_TT: "§GПолучить 30 ед. британской поддержки§!"
 GRE_unification_TT: "После завершения проекта будет проводиться ежемесячная конференция, на которой, в зависимости от одобрения, может быть достигнут прогресс."
 PER_presidential_decisions_only_one_is_available_TT: "Одновременно может действовать только одно из этих решений."
 GRE_homelessness_crisis_category: "Кризис бездомности в Афинах"
 GRE_homelessness_crisis_category_desc: "После землетрясения 1999 года в Афинах тысячи греческих граждан остались без крова. В настоящее время в городе ведутся работы по оказанию помощи и восстановлению, но мы можем помочь в реализации этой инициативы по завершению ремонта городских и жилых районов."
 GRE_reconstruction_efforts_in_athens_decision: "Финансирование дополнительных усилий по реконструкции Афин"
 GRE_reconstruction_efforts_in_athens_decision_desc: "Землетрясение нанесло серьезный ущерб по всей Афине. Многоквартирные дома рухнули, инфраструктура повреждена, целые кварталы превращены в руины. Начались первоначальные ремонтные работы, но средств, выделенных на помощь, недостаточно. Направление дополнительных средств на реконструкцию ускорило бы процесс восстановления."
 GRE_issue_relief_funds_to_victims_decision: "Выделить средства на оказание помощи пострадавшим от землетрясения"
 GRE_issue_relief_funds_to_victims_decision_desc: "Помимо физических разрушений, землетрясение оставило многие семьи ни с чем. Сбережения уничтожены, предприятия разрушены, люди получили ранения. Выделение прямой финансовой помощи пострадавшим обеспечило бы немедленную поддержку в виде продуктов питания, одежды, временного жилья и предметов первой необходимости для начала восстановления."
 GRE_petition_turkey_for_support_decision: "Петиция [TUR.GetName] о поддержке"
 GRE_petition_turkey_for_support_decision_desc: "Обращение к [TUR.GetNameWithFlag] с просьбой о поддержке в восстановлении после землетрясения. Надеюсь, они найдут в себе силы поддержать нас в трудную минуту."
 GRE_cypriot_TT: "§YКипр§! объявляет войну §YСеверный Кипр§!"
 GRE_debt_crisis_experienced_tt: "Мы столкнулись с §RДолговой кризис§!"
 GRE_joining_the_euro_interest_rate_tt: "Изменяет требования для §Y$EU_join_the_euro_decision$§!:\n- Требование к §YПроцентной ставке§! до §Y6.5%§! вместо §Y3.5%§!\n"
 GRE_defer_payments_decision_tt: "Позволяет нам откладывать оплату будущих действий (например, решений, задач) в наш §YГосударственный долг§! или §YИностранному кредитору§! вместо оплаты наличными."
 GRE_golden_visa_deals: "Золотые визы"
 GRE_golden_visa_deals_desc: "Программа «Золотая виза» предоставляет пятилетний вид на жительство любому инвестору, вложившему соответствующую сумму в инвестиции. [GRE.GetAdjective] недвижимость или бизнес. Покупатели с высоким уровнем дохода из-за пределов ЕС проявили большой интерес, обеспечив прямой приток иностранного капитала на внутренний рынок."
 GRE_targeted_pension_reforms: "Целенаправленные пенсионные реформы"
 GRE_targeted_pension_reforms_desc: "Пенсионная система поглощает непропорционально большую долю ВВП. Целенаправленные реформы, ужесточающие критерии получения пенсии, сокращающие злоупотребления при досрочном выходе на пенсию и переводящие дополнительные пенсии на накопительную модель, позволят снизить финансовое бремя, не разрушая при этом систему социальной защиты полностью."
 GRE_merchant_marine: "Торговый флот"
 GRE_merchant_marine_desc: "Греция управляет крупнейшим в мире торговым флотом под флагом Союза греческих судовладельцев, одного из самых влиятельных промышленных лобби в Афинах. Судовладельцы и их семьи контролируют две пятых тоннажа флота и обеспечивают поступление 7-8% ВВП в национальный бюджет за счет заработной платы, налогов и портовых сборов. Укрепление их конкурентных позиций поддерживает работу этого мощного механизма."
 GRE_tonnage_tax_regime: "Сохранить налог на тоннаж"
 GRE_tonnage_tax_regime_desc: "Семьи судовладельцев долгое время пользовались благоприятным режимом налогообложения тоннажа, который обеспечивает прибыльность судов под греческим флагом и препятствует переходу под иностранные регистры. Сохранение этого режима обеспечивает приток доходов в греческие порты и верфи, поддерживая работу верфей в Скарамангасе, Элефсине и Неорионе."
 GRE_tax_the_shipowners: "Обложите налогом судоходных магнатов"
 GRE_tax_the_shipowners_desc: "Судоходные магнаты долгое время избегали бремени налогообложения, которое ложится на плечи простых греков. Демонтаж системы тоннажного налога и прямое взимание налога с судовладельцев принесло бы в казну значительную единовременную прибыль, хотя угроза выхода судов под свой флаг остается постоянной."
 GRE_shipbuilding_revival: "Возродить греческие верфи"
 GRE_shipbuilding_revival_desc: "Верфи в Скарамангасе, Элефсине и Неорионе когда-то строили торговый флот, который приносил богатство Греции. Восстановление их мощностей с помощью целевых субсидий и контрактов позволило бы вернуть рабочие места на верфях и обеспечить внутренние поставки современных корпусов судов."
 GRE_pdo_exports: "Экспорт товаров премиум-класса с защищенным происхождением"
 GRE_pdo_exports_desc: "Оливки Каламата, оливковое масло первого отжима, сыр фета и вино Ассиртико известны во всем мире. Инвестиции в защиту наименования места происхождения и премиальный маркетинг позволяют вывести эти продукты из разряда товаров массового потребления и добиться более высоких цен на международных рынках."
 GRE_recapitalize_banks: "Рекапитализация банков"
 GRE_recapitalize_banks_desc: "В период кризиса четыре крупнейших греческих банка накопили триллионы долларов невозвратных кредитов. Греческий фонд финансовой стабильности мог бы влить новый капитал посредством принудительной рекапитализации, восстановив их способность к кредитованию и стабилизировав финансовую систему за счет значительных бюджетных издержек."
 GRE_hercules_scheme: "Схема защиты активов «Геркулес»"
 GRE_hercules_scheme_desc: "В рамках программы HAPS неработающие кредиты списываются с балансов банков, что размораживает их кредитные возможности и снижает стоимость заимствований для предприятий и домохозяйств, нуждающихся в кредите."
 GRE_privatize_banks: "Вернуть банки в частные руки"
 GRE_privatize_banks_desc: "Продажа государственных долей в рекапитализированных банках частным инвесторам вызовет высокий корпоративный спрос и обеспечит значительный источник налоговых поступлений. Рыночный вотум доверия также ознаменует возвращение Греции к нормальной жизни."
 GRE_state_bank_control: "Сохраните банки в руках государства."
 GRE_state_bank_control_desc: "Сохранение государственной собственности на банки позволяет направлять их кредитование на развитие отечественного строительства, промышленности и стратегических секторов без давления со стороны частных акционеров, стремящихся к прибыли. Политические издержки государственной собственности компенсируются контролем над распределением кредитов."
 GRE_nationalist_takeover_TT: "Греческий народ требует переизбрания!\n\nУбедитесь, что у вас достаточно политической власти для этого. Если вы §Rнеудача§! Чтобы избрать и сформировать правительство, вам потребуется... §Rнеобходимо провести еще одни внеочередные выборы§! расширить возможности §Y[Nat_Fascism_L]§!"
 GRE_dev_cyp_desc: "Кипр десятилетиями страдал от разделения и недостаточного инвестирования. Теперь, когда остров находится под греческим суверенитетом, мы можем начать работу по развитию его инфраструктуры, экономики и институтов до уровня материковой части страны."
 GRE_decrease_taxes: "Снижение налогов"
 GRE_decrease_taxes_desc: "Греческий народ не должен испытывать давления из-за высоких налогов. Более того, снижение налогов может привести к снижению уровня уклонения от уплаты налогов, что является серьезной проблемой в нашей стране."
 GRE_eastern_neighborhood: "Восточный район"
 GRE_eastern_neighborhood_desc: "Греции необходимо определить свои отношения с ближайшими соседями — Турцией и разделённым островом Кипр. То, как мы будем взаимодействовать с обеими сторонами, определит будущее региона на целое поколение."
 GRE_turkey_rapprochement: "Сближение с Турцией"
 GRE_turkey_rapprochement_desc: "У Греции и Турции гораздо больше общего, чем признают обе стороны. Структурированный диалог по вопросам торговли, миграции и Эгейского моря может снизить напряженность и открыть путь к стабильному сосуществованию."
 GRE_turkey_confrontation: "Противостояние турецким амбициям"
 GRE_turkey_confrontation_desc: "Неоднократные нарушения Турцией греческого воздушного пространства и провокации в Эгейском море не могут остаться без ответа. Греция займет твердую позицию и сплотит своих союзников для сопротивления дальнейшим посягательствам."
 GRE_aegean_dialogue: "Эгейский диалог"
 GRE_aegean_dialogue_desc: "Официальный канал для диалога по вопросам прав и границ в Эгейском море снижает риск случайной эскалации и закладывает основу для долгосрочного морского соглашения."
 GRE_migration_cooperation: "Миграционная кооперация"
 GRE_migration_cooperation_desc: "Координация миграционной политики с Турцией имеет важное значение для управления потоком беженцев через Эгейское море. Разделенная ответственность означает меньшее количество кризисов для обеих сторон."
 GRE_greco_turkish_trade: "Греко-турецкое торговое соглашение"
 GRE_greco_turkish_trade_desc: "Расширение двусторонней торговли снижает стимул к политической конфронтации. Экономическая взаимозависимость между Грецией и Турцией отвечает интересам обоих народов."
 GRE_nato_pressure_turkey: "Давление НАТО на Турцию"
 GRE_nato_pressure_turkey_desc: "Греция будет использовать свое положение в НАТО, чтобы привлечь Турцию к ответственности за нарушения норм альянса. Наши союзники должны понимать, что стабильность в Восточном Средиземноморье требует от Турции сдержанности."
 GRE_aegean_assertiveness: "Эгейская напористость"
 GRE_aegean_assertiveness_desc: "Греческий военно-морской флот увеличит патрулирование и количество учений в спорных водах для утверждения суверенитета над континентальным шельфом и воздушным пространством Эгейского моря."
 GRE_aegean_deterrence: "Эгейское сдерживание"
 GRE_aegean_deterrence_desc: "Инвестиции в береговую оборону и силы быстрого реагирования ясно показывают, что Греция готова защищать свою территорию от любого вторжения."
 GRE_enosis_campaign: "Кампания «Энозис»"
 GRE_enosis_campaign_desc: "Греция начинает дипломатическую и культурную кампанию по укреплению связей с греко-кипрской общиной и продвижению идеала возможного воссоединения с родиной."
 GRE_cypriot_economic_integration: "Кипрская экономическая интеграция"
 GRE_cypriot_economic_integration_desc: "Укрепление торговых и финансовых связей между Грецией и Республикой Кипр делает воссоединение экономически привлекательным и усиливает греческое влияние на острове."
 GRE_northern_outreach: "Сближение с Севером"
 GRE_northern_outreach_desc: "Греция налаживает контакты с турками-киприотами на севере, предлагая экономические стимулы и культурный обмен, чтобы показать, что воссоединение отвечает их интересам так же, как и интересам всех остальных."
 GRE_british_bases_accord: "Британское соглашение о военных базах"
 GRE_british_bases_accord_desc: "Соединенное Королевство сохраняет за собой две суверенные военные базы на Кипре. Достижение соглашения с Лондоном гарантирует британский нейтралитет (или активную поддержку) любого будущего процесса воссоединения."
 GRE_cyprus_gas_exploitation: "Эксплуатация газа на Кипре"
 GRE_cyprus_gas_exploitation_desc: "В водах к югу от Кипра обнаружены значительные запасы природного газа. Греция намерена совместно разрабатывать эти месторождения, создавая тем самым общие экономические интересы на едином острове."
 GRE_confederation_framework: "Рамочная структура Конфедерации"
 GRE_confederation_framework_desc: "Греция предлагает модель формальной конфедерации, которая сохраняет автономию общин, объединяя остров под единым суверенитетом, — модель, приемлемую для обеих общин."
 GRE_cyprus_reunification: "Воссоединение Кипра"
 GRE_cyprus_reunification_desc: "Благодаря широкой поддержке движения Cyprus Momentum со стороны обеих общин, достаточно низкому уровню напряженности в Эгейском море, исключающему вмешательство Турции, заключенному соглашению о британских военных базах и полной проработке рамок конфедерации, наконец-то настал момент для воссоединения острова."
 GRE_force_enosis: "Надавить на проблему"
 GRE_force_enosis_desc: "Переговоры провалились, и остров превратился в пороховую бочку. Вместо того чтобы ждать урегулирования, которого никогда не будет, Афины доводят Эносис до предела, бросая вызов Северной Кипру. Если турецко-кипрское руководство Никосии первым нанесет удар, Республика Кипр будет иметь полное право воссоединить остров силой."
 GRE_aegean_tension_high_TT: "§BНапряжённость в Эгейском море выше §H50§!§!"
 GRE_recognize_unified_cyprus: "Признать Единую Республику Кипр"
 GRE_recognize_unified_cyprus_desc: "Войска Никосии захватили север острова. Раздел, терзавший остров на протяжении полувека, завершен. Афины официально признают единую, ориентированную на Грецию Республику Кипр и помогают ей интегрировать территорию."
 GRE_western_alignment: "Западное выравнивание"
 GRE_western_alignment_desc: "Греция подтверждает свое место в центре западной дипломатии. Будучи одним из основателей НАТО, одним из первых членов ЕС и естественным центром Восточного Средиземноморья, Афины стремятся преобразовать свой географический вес в обязательные политические обязательства, начиная кампанию двустороннего и многостороннего взаимодействия, которая будет оцениваться по степени приверженности Западу."
 GRE_franco_hellenic_pact: "Франко-греческое стратегическое партнерство"
 GRE_franco_hellenic_pact_desc: "Опираясь на стратегическое партнерство, подписанное в Афинах в сентябре 2021 года, Греция стремится к созданию всеобъемлющей двусторонней структуры с Францией, охватывающей оборонную промышленность, согласование внешней политики и безопасность в Восточном Средиземноморье. Париж является наиболее заинтересованным старшим партнером в Европе; укрепление его связей является краеугольным камнем любой убедительной позиции Запада."
 GRE_eastmed_trilateral: "Восточно-Средиземноморский трехсторонний"
 GRE_eastmed_trilateral_desc: "Греция, Израиль и Кипр формализуют свое давнее трехстороннее сотрудничество: совместные военно-морские учения, обмен разведывательной информацией и скоординированная позиция в вопросах безопасности Восточного Средиземноморья. В результате три дружественные столицы превращаются в единый стратегический блок, ориентированный на Левантийский бассейн."
 GRE_eu_political_anchor: "Якорь — член-учредитель ЕС"
 GRE_eu_political_anchor_desc: "Греция подтверждает свою идентичность как одного из основателей европейского проекта. Занимая ведущую позицию в Брюсселе по вопросам сплоченности, расширения и общей внешней политики, Афины превращают многолетнее членство в политический вес в наши дни."
 GRE_strategic_partnership_treaty: "Статья 2. Пункт о взаимной обороне"
 GRE_strategic_partnership_treaty_desc: "Греция доводит франко-эллинское партнерство до конца: в договоре закрепляется обязательная оговорка о взаимной обороне, смоделированная по образцу статьи 5. Франция становится первой европейской державой, связанной договором о защите греческой территории, что навсегда меняет порядок безопасности в Средиземноморье."
 GRE_eastmed_gas_forum: "Участник форума EastMed Gas"
 GRE_eastmed_gas_forum_desc: "Греция формализует свою роль в Восточно-Средиземноморском газовом форуме наряду с Кипром, Израилем, Египтом, Италией, Иорданией и Палестиной. Институциональная структура закрепляет региональное энергетическое сотрудничество, обеспечивает преференциальный доступ для греческого судоходства и предоставляет Афинам постоянное место за столом дипломатических переговоров в Восточном Средиземноморье."
 GRE_3plus1_dialogue: "Стратегический диалог 3+1"
 GRE_3plus1_dialogue_desc: "Греция, Кипр и Израиль формализуют диалог в формате «3+1» с Соединенными Штатами — формат, поддерживаемый Госдепартаментом и охватывающий энергетическую безопасность, морское сотрудничество и борьбу с терроризмом. Это соглашение предоставляет Вашингтону структурированный канал взаимодействия в рамках трехстороннего диалога между странами Востока и Средиземноморья и венчает региональную архитектуру американским участием."
 GRE_eu_strategic_compass: "Стратегический компас ЕС"
 GRE_eu_strategic_compass_desc: "Греция становится активным сторонником Стратегического компаса ЕС, добиваясь европейской стратегической автономии, более глубокой интеграции в ПЕСКО и европейского статуса в рамках НАТО. Афины присоединяются к Парижу и Берлину в вопросах континентальной обороны, обменивая молчаливое членство на активную роль в формировании ситуации."
 GRE_pillar_of_the_west: "Столп Запада"
 GRE_pillar_of_the_west_desc: "Многолетняя работа приносит свои плоды. Греция выступает не на периферии западной дипломатии, а в качестве одного из ее краеугольных камней. Глубина наследия, измеряемая уровнем западной приверженности, накопленной в ходе кампании, определяет, насколько прочно Афины интегрированы в эту структуру."
 GRE_regional_diplomacy: "Региональная дипломатия"
 GRE_regional_diplomacy_desc: "Греция является опорой Балканского региона и должна поддерживать прочные отношения со всеми своими соседями. Стабильность в регионе неотделима от собственной безопасности и процветания Греции."
 GRE_prespa_implementation: "Реализация соглашения Prespa"
 GRE_prespa_implementation_desc: "Преспанское соглашение разрешило многолетний спор о названии Северной Македонии. Греция в полной мере выполняет свои обязательства, нормализуя отношения и открывая двери для расширения торговли."
 GRE_albania_minority: "Права албанского меньшинства"
 GRE_albania_minority_desc: "Значительное греческое меньшинство проживает на юге Албании. Греция стремится к конструктивному диалогу по правам меньшинств, используя этот вопрос как основу для более глубокого двустороннего взаимодействия, а не для конфронтации."
 GRE_egypt_maritime: "Египетское морское партнерство"
 GRE_egypt_maritime_desc: "Греция и Египет подписали соглашение о морской границе в Восточном Средиземноморье, создающее правовую основу для совместной разработки энергетических ресурсов и исключающее претензии Турции на этот район."
 GRE_italy_mediterranean_axis: "Ось Италия-Средиземноморье"
 GRE_italy_mediterranean_axis_desc: "Италия является крупнейшим торговым партнером Греции в ЕС, объем двусторонней торговли превышает двенадцать миллиардов евро в год. Официальное партнерство расширяет сотрудничество в области энергетики, транспорта и обороны в центральной части Средиземноморья."
 GRE_balkan_energy_corridor: "Балканский энергетический коридор"
 GRE_balkan_energy_corridor_desc: "Греко-болгарский газопровод-интерконнектор и плавучий терминал Александруполис превращают Грецию в важнейший транзитный узел энергоснабжения. Новый трубопровод в Северную Македонию расширяет эту сеть вглубь Балкан."
 GRE_mediterranean_energy_hub: "Средиземноморский энергетический центр"
 GRE_mediterranean_energy_hub_desc: "Благодаря работе плавучей установки по хранению и регазификации СПГ в Александруполисе и терминала в Ревитуссе на полную мощность, Греция позиционирует себя как главный европейский центр СПГ, заменяя зависимость от российских трубопроводов морскими поставками из Восточного Средиземноморья и других регионов."
 GRE_gulf_strategic_partners: "Стратегические партнёры в Заливе"
 GRE_gulf_strategic_partners_desc: "Греция создает Высший совет стратегического сотрудничества с Саудовской Аравией и углубляет оборонные и инвестиционные связи с ОАЭ. В Восточное Средиземноморье поступает капитал из стран Персидского залива и осуществляется военное сотрудничество."
 GRE_balkans_eu_advocacy: "Балканы: защита интересов ЕС"
 GRE_balkans_eu_advocacy_desc: "Опираясь на обязательства, принятые на саммите в Салониках в 2003 году, Греция выступает за вступление стран Западных Балкан в ЕС. Будучи самым опытным членом ЕС в регионе, Греция получает рычаги влияния в отношениях с Сербией, Албанией и Северной Македонией."
 GRE_imec_gateway: "Шлюз IMEC"
 GRE_imec_gateway_desc: "Индийско-Ближневосточно-Европейский экономический коридор определяет Пирей в качестве своей европейской конечной точки. Масштабные инвестиции в портовую и логистическую инфраструктуру превращают центральную Грецию в трансконтинентальный торговый центр, связывающий Азию с Европой."
 GRE_se_european_pillar: "Юго-восточноевропейский столп"
 GRE_se_european_pillar_desc: "Греция укрепляет свои позиции в качестве незаменимого центра Юго-Восточной Европы: энергетические ворота, покровитель Балкан, якорь средиземноморской торговли и конечная точка коридора, связывающего три континента."
 GRE_eastern_alignment: "Поворот на Восток"
 GRE_eastern_alignment_desc: "После десятилетия политики жесткой экономии и атлантистского господства Афины смотрят на Восток. Греция будет развивать параллельные отношения с Россией, Китаем, Ираном и православными Балканами, и со временем превратится в средиземноморский центр многополярного мира."
 GRE_strategic_autonomy: "Стратегическая автономия"
 GRE_strategic_autonomy_desc: "Греции не нужно выбирать единого хозяина. Член НАТО, который по-прежнему покупает российский газ, заигрывает с капиталом стран Персидского залива и Китая и выступает посредником между соперниками, может добиться уступок от каждой стороны. Афины же выбирают многовекторный курс, не зависящий ни от одного блока и выгодный для всех."
 GRE_strategic_autonomy_event_TT: "§YНачинается дискуссия о том, как использовать позицию неприсоединения Греции.§!"
 GRE_russia_outreach: "Открыть каналы связи с Москвой"
 GRE_russia_outreach_desc: "Греция втайне обращается к Кремлю с предложением: долгосрочные контракты на поставку природного газа, расширение доступа российских судов к портам и более позитивные политические сигналы. Ответ Москвы задаст тон новому средиземноморскому партнерству."
 GRE_china_outreach: "Взаимодействие с Пекином"
 GRE_china_outreach_desc: "Греческие посланники приезжают в Пекин с целью углубления взаимодействия: промышленное финансирование, телекоммуникации, инфраструктура. Приобретение Китаем Пирея уже доказало эффективность этой модели. Теперь Афины предлагают распространить ее на всю греческую экономику."
 GRE_iran_outreach: "Налаживание контактов с Тегераном"
 GRE_iran_outreach_desc: "Греция, давно сочувствующая Ирану из-за санкций, втайне предлагает создать систему бартера и обмена энергоносителями вне рамок SWIFT. Этот шаг провокационен в Брюсселе и Вашингтоне, но будет выгоден, если Тегеран согласится."
 GRE_orthodox_outreach: "Православное братство"
 GRE_orthodox_outreach_desc: "Афины созывают саммит с Белградом, Никосией и Ереваном, формируя культурный и политический альянс православной Европы. Патриархальная дипломатия превращается в государственную политику, создавая региональный блок, не подчиняющийся ни Брюсселю, ни Вашингтону."
 GRE_russia_milcoop: "Греко-российские переговоры по вопросам обороны"
 GRE_russia_milcoop_desc: "Вслед за энергетическим партнерством Афины предлагают Москве официальное сотрудничество в области обороны: совместные учения, модернизацию ЗРК С-300 ПМУ-2 и обмен разведывательной информацией. Политический сигнал НАТО недвусмысленен."
 GRE_china_bri_anchor: "Опорный пункт ОПОП"
 GRE_china_bri_anchor_desc: "Греция позиционирует себя как европейский якорь китайской инициативы «Один пояс и один путь», расширяя присутствие COSCO, открывая новые зоны свободной торговли в Аттике и интегрируя греческую логистику в китайские цепочки поставок."
 GRE_iran_med_corridor: "Восточно-Средиземноморский коридор"
 GRE_iran_med_corridor_desc: "Афины предлагают создать энергетический коридор между Ираном и Грецией, предусматривающий поставку нефти и сжиженного природного газа через посредников из третьих стран в обход западных санкций. Если Тегеран согласится, Греция станет для Ирана окном в Европу."
 GRE_orthodox_security: "Православный договор о безопасности"
 GRE_orthodox_security_desc: "Православный собор формализует оборонный пакт: совместная подготовка кадров, сотрудничество в области разведки и постоянные политические консультации. Сербия, Кипр и Армения присоединяются к Греции в рамках негласного, но недвусмысленного блока."
 GRE_brics_membership: "Присоединяйтесь к BRICS+"
 GRE_brics_membership_desc: "Греция официально присоединяется к БРИКС+ в качестве первого европейского члена. Разрыв с НАТО завершен; в обмен Афины получают преференциальный доступ к Новому банку развития, системе расчетов в юанях и рублях, а также место за столом переговоров в многополярных странах."
 GRE_multipolar_anchor: "Опорный пункт многополярного мира"
 GRE_multipolar_anchor_desc: "Греция объявляет себя опорой нового многополярного порядка. Атлантический альянс отвергается, Европейский союз покидает страну, и из Афин рождается средиземноморская республика, объединяющая три континента (евразийский, левантийский, африканский)."
 GRE_eastern_outreach: "Восточное сближение"
 GRE_eastern_outreach_desc: "Афины начали налаживать партнерские отношения за пределами Атлантического альянса. Дипломатические связи смещаются на восток, автономия в торговой политике расширяется, но западные столицы внимательно следят за развитием событий."
 GRE_eurasian_partner: "Евразийский партнер"
 GRE_eurasian_partner_desc: "Греция теперь признана евразийским партнером. Капитал из Москвы, Пекина и Тегерана поддерживает греческую промышленность, в то время как западное общественное мнение ужесточается. Путь назад сужается."
 GRE_brics_anchor: "Якорь БРИКС"
 GRE_brics_anchor_desc: "Греция сидит за столом БРИКС+. Атлантический альянс остался в прошлом; Средиземное море – многополярное. Афины выступают с авторитетом, сравнимым с авторитетом континентального центра."
 GRE_orthodox_defense_pact: "Православный оборонительный пакт"
 GRE_orthodox_defense_pact_desc: "Постоянное соглашение об обороне между православными странами Европы: совместные учения, общая доктрина и обмен разведывательной информацией с Белградом, Никосией и Ереваном."
 GRE_iran_barter_framework: "Бартер в стиле INSTEX"
 GRE_iran_barter_framework_desc: "Греко-иранская торговля осуществляется через бартерный клиринговый центр вне системы SWIFT, что позволяет обходить санкции и открывает иранские рынки для греческих экспортеров."
 GRE_iran_med_corridor_idea: "Восточно-Средиземноморский энергетический коридор"
 GRE_iran_med_corridor_idea_desc: "Иранская нефть и СПГ поступают в Европу по коридору, базирующемуся в Греции. Расширяются мощности нефтепереработки, увеличиваются запасы топлива, и Афины становятся региональным энергетическим центром."
 GRE_diplomacy_category: "Греческая дипломатия"
 GRE_host_putin_summit: "Провести саммит с Россией"
 GRE_host_putin_summit_desc: "Пригласить президента России в Афины на важный двусторонний саммит. Подписываются соглашения о сотрудничестве в сфере торговли, устраиваются фотосессии, а западные посольства выражают неодобрение."
 GRE_cosco_pier_expansion: "Расширение пирса COSCO"
 GRE_cosco_pier_expansion_desc: "Софинансирование очередного этапа расширения завода COSCO в Пирее. Гражданский завод обязуется участвовать в проекте в течение трех месяцев; взамен компания Attica получает постоянный слот для инфраструктуры."
 GRE_instex_iran_barter: "Запустите канал обмена товарами с Ираном."
 GRE_instex_iran_barter_desc: "Обработайте транш греко-иранской торговли через бартерный расчетный центр, обновите его структуру и вознаградите торговцев, которые поддерживают его функционирование."
 GRE_orthodox_patriarchate_summit: "Созовите Православный Собор"
 GRE_orthodox_patriarchate_summit_desc: "Провести в Афинах саммит Патриархата, который соберет сербских, кипрских и армянских лидеров для церковных и политических консультаций."
 GRE_retry_russia_outreach: "Возобновить контакт с Москвой"
 GRE_retry_russia_outreach_desc: "После предыдущего отказа греческие дипломаты готовят пересмотренное предложение и возобновляют каналы связи с Кремлем."
 GRE_retry_russia_milcoop: "Возобновить переговоры по вопросам обороны"
 GRE_retry_russia_milcoop_desc: "Возобновить предложение о греко-российском сотрудничестве в области обороны, смягчив условия и подав более сдержанные сигналы."
 GRE_retry_china_outreach: "Возобновить диалог с Пекином"
 GRE_retry_china_outreach_desc: "Направить в Пекин нового посланника с пересмотренными условиями и новым пакетом инвестиционных гарантий."
 GRE_retry_china_bri_anchor: "Повторно представьте роль ключевого участника ОПОП"
 GRE_retry_china_bri_anchor_desc: "Пересмотреть ключевое предложение в рамках инициативы «Один пояс и один путь» с учетом более широких уступок в вопросах логистики, собственности и политической согласованности."
 GRE_retry_iran_outreach: "Возобновить диалог с Тегераном"
 GRE_retry_iran_outreach_desc: "После первоначального отказа Тегерана Афины возобновляют неофициальные переговоры через посредников из третьих стран."
 GRE_retry_iran_med_corridor: "Вновь выдвинуть проект Средиземноморского коридора."
 GRE_retry_iran_med_corridor_desc: "Пересмотреть проект Восточно-Средиземноморского коридора, добавив новые варианты маршрутов, которые еще больше снизят уязвимость Ирана перед западными санкциями."
 GRE_retry_orthodox_outreach: "Возобновить проведение Православного саммита"
 GRE_retry_orthodox_outreach_desc: "Наладить отношения после провалившегося первого саммита и пригласить православных министров иностранных дел обратно в Афины."
 GRE_retry_orthodox_security: "Вновь внести предложение о заключении Соглашения о безопасности."
 GRE_retry_orthodox_security_desc: "Возобновить православное соглашение о безопасности с пересмотренными обязательствами по обмену разведывательной информацией и ротации участников учений."
 greece.530.t: "Греческое энергетическое предложение"
 greece.530.d: "Афины предлагают всеобъемлющее партнерство в области энергетики и торговли: долгосрочные газовые контракты, концессии на порты для российского судоходства и деликатную переориентацию греческой внешней политики в сторону Москвы. Министр иностранных дел Греции ожидает ответа."
 greece.530.a: "Долгожданный шанс. Подписать."
 greece.530.b: "Афины не могут выполнить свои обещания. Отказаться."
 greece.531.t: "Москва принимает партнерство"
 greece.531.d: "Кремль принимает греческое предложение. Происходит обмен торговыми портфелями, подписывается улучшенное двустороннее соглашение, и начинается поставка российского газа на выгодных условиях. Афины обретают своего первого восточного партнера."
 greece.531.a: "Добро пожаловать в новую внешнюю политику Греции."
 greece.532.t: "Москва отказывается"
 greece.532.d: "Кремль вежливо отклоняет предложение Греции. Без твердых гарантий выхода Афин из Атлантического альянса у Москвы нет стимула идти на политические риски. Неудача реальна, но дверь не закрыта."
 greece.532.a: "Перегруппируйтесь и попробуйте снова."
 greece.533.t: "Предложение Греции по сотрудничеству в области обороны"
 greece.533.d: "Афины предлагают формальную греко-российскую структуру обороны: совместные учения, поддержка модернизации С-300 ПМУ-2 и обмен разведывательной информацией. Москва взвешивает политическую выгоду и дипломатическую негативную реакцию со стороны НАТО."
 greece.533.a: "Историческое совпадение. Принимаем."
 greece.533.b: "Греция по-прежнему является членом НАТО. Отказаться."
 greece.534.t: "Москва соглашается на переговоры по вопросам обороны."
 greece.534.d: "Российское министерство обороны соглашается на официальное сотрудничество. Греческие офицеры отправляются в Москву на обучение; российские инженеры прибывают на военно-морскую базу Саламин. Преимущество в сухопутной доктрине значительно, но и политические издержки тоже."
 greece.534.a: "Начинается сотрудничество между Грецией и Россией в сфере вооружений."
 greece.535.t: "Москва отказалась от переговоров по вопросам обороны."
 greece.535.d: "Москва отказывается, ссылаясь на сохранение Грецией обязательств перед НАТО. До тех пор, пока Афины не выйдут из Атлантического альянса или, по крайней мере, не дадут понять о своем намерении сделать это, формального сотрудничества в области обороны не будет."
 greece.535.a: "Обратите внимание на требование большей приверженности."
 greece.536.t: "Греческий подход к Пекину"
 greece.536.d: "Афины обратились к Пекину с предложением об углублении экономического сотрудничества: в сфере телекоммуникаций, финансирования инфраструктуры и более широкой интеграции в рамках инициативы «Один пояс и один путь». Министерство иностранных дел Китая приняло это предложение к рассмотрению."
 greece.536.a: "Идеально подходит. Рекомендую."
 greece.536.b: "Политические издержки перевешивают выгоды. Отказаться."
 greece.537.t: "Пекин принимает"
 greece.537.d: "Китайское руководство одобряет партнерство. Государственный капитал начинает поступать в греческие промышленные и телекоммуникационные проекты, и влияние Греции в расчетах Пекина заметно возрастает."
 greece.537.a: "Китайско-греческое партнерство углубляется."
 greece.538.t: "Пекин отказывается"
 greece.538.d: "Пекин возражает: Афины, по его мнению, не могут предложить то, что уже обеспечено более тихими каналами. Греческие дипломаты возвращаются с пустыми руками, но не сдаваясь."
 greece.538.a: "Пересмотрите ситуацию и попробуйте снова."
 greece.539.t: "Греческое предложение по созданию опорной зоны инициативы «Один пояс и один путь»"
 greece.539.d: "Афины позиционируют себя как европейский центр инициативы «Один пояс и один путь»: расширенные концессии COSCO, зоны свободной торговли в Аттике и политическое единство по вопросам Индо-Тихоокеанского региона. Цена высока, но и награда тоже."
 greece.539.a: "Якорь исторических амбиций. Принять."
 greece.539.b: "Условия пока неприемлемы. Отказ."
 greece.540.t: "Пекин поддерживает ключевой элемент инициативы «Один пояс и один путь»."
 greece.540.d: "Китай официально назначает Грецию опорой инициативы «Один пояс и один путь». Мобилизуются строительные бригады; капитал поступает в Аттику; в столичном регионе строится дополнительный гражданский завод, поскольку китайские инвестиции поддерживают греческую промышленность."
 greece.540.a: "Греция является европейской конечной точкой инициативы «Один пояс и один путь»."
 greece.541.t: "Пекин отказывается от роли «якоря»."
 greece.541.d: "Пекин отказывается от официального назначения в качестве «якоря», считая политическую нестабильность в Греции слишком высокой для принятия обязательств такого масштаба. Афины должны продемонстрировать более твердую приверженность друг другу, прежде чем предложение будет возобновлено."
 greece.541.a: "Условия необходимо пересмотреть."
 greece.542.t: "Греческая инициатива по налаживанию связей с Тегераном"
 greece.542.d: "Греческий посланник в Тегеране предлагает создать систему бартера и торговли вне рамок SWIFT, призванную обойти западные санкции и открыть иранские рынки для греческих экспортеров. Высший совет национальной безопасности обсуждает это предложение."
 greece.542.a: "Добро пожаловать, наш партнер из Европы. Принимаем."
 greece.542.b: "Афины олицетворяют Запад. Отказаться."
 greece.543.t: "Тегеран принимает рамочное соглашение"
 greece.543.d: "Тегеран соглашается. В Афинах создается клиринговая площадка для бартерных сделок, и греческие экспортеры получают преференциальный доступ к иранским рынкам. Западные столицы не в восторге."
 greece.543.a: "Первое европейское вступление в иранскую систему."
 greece.544.t: "Тегеран отказывается"
 greece.544.d: "Тегеран отказывается. Греция, как отмечает иранский министр иностранных дел, по-прежнему является государством НАТО, и любая подобная схема станет уязвимой для вторичных санкций США в момент ее активации."
 greece.544.a: "Проявите сначала самостоятельность."
 greece.545.t: "Предложение по созданию греческого средиземноморского коридора"
 greece.545.d: "Афины предлагают Восточно-Средиземноморский коридор: иранская нефть и СПГ будут доставляться через посредников из третьих стран на греческие терминалы, а затем в Европу. Иранская сторона взвешивает преимущества и последствия ответных мер со стороны США."
 greece.545.a: "Этот коридор — стратегически важная добыча. Принимайте."
 greece.545.b: "Слишком большая огласка. Отказаться."
 greece.546.t: "Тегеран поддерживает создание коридора"
 greece.546.d: "Тегеран одобряет создание коридора. Иранская нефть начинает поступать в греческие порты; мощности по переработке нефти расширяются в Аттике и Беотии. Греция становится узким энергетическим узлом Средиземноморья, а Тегеран — тихим бенефициаром."
 greece.546.a: "Восточно-Средиземноморский энергетический коридор открыт."
 greece.547.t: "Тегеран отказывается от коридора"
 greece.547.d: "Тегеран отказывается, ссылаясь на противодействие США государствам-посредникам. Вопрос о создании коридора отложен; обе столицы вернутся к нему, когда позволят условия."
 greece.547.a: "Дождитесь подходящего момента."
 greece.548.t: "Афины созывают Православный собор"
 greece.548.d: "Афины предлагают проводить регулярные политические консультации между православными государствами Европы: Сербией, Кипром, Арменией и другими. Патриархальная дипломатия предлагается в качестве прикрытия; истинная цель — государственная политика."
 greece.548.a: "Давно назревшее братство. Принимаем."
 greece.548.b: "Риски перевешивают выгоды. Отказаться."
 greece.549.t: "Белград поддерживает Совет"
 greece.549.d: "Белград одобряет предложение, и Никосия следует его примеру. В Афинах созывается православный собор с участием министров иностранных дел Греции, Сербии и Кипра. Сформировался сдержанный, но несомненный блок."
 greece.549.a: "Родился православный блок."
 greece.550.t: "Белград отказывается"
 greece.550.d: "Белград отказывается, ссылаясь на опасения спровоцировать Брюссель и осложнить вступление Сербии в ЕС. Православный проект отложен, но не отменен."
 greece.550.a: "Терпение. Этот момент обязательно настанет."
 greece.551.t: "Предложение по греческому соглашению о безопасности"
 greece.551.d: "Афины предлагают формализовать православный блок в рамках оборонного соглашения: совместная подготовка кадров, обмен разведывательной информацией и постоянные политические консультации. Белград взвешивает эту возможность, учитывая неизбежную реакцию Брюсселя."
 greece.551.a: "Договор укрепляет нас всех. Принимаем."
 greece.551.b: "Белград не может рисковать. Отказаться."
 greece.552.t: "Православный оборонный договор подписан."
 greece.552.d: "Белград, Никосия и Ереван присоединяются к Афинам в формализации Православного оборонного пакта. Начинаются совместные учения; открываются каналы разведки; на карте появляется незаметный европейский полюс."
 greece.552.a: "Создана ортодоксальная архитектура безопасности."
 greece.553.t: "Белград отклонил Соглашение"
 greece.553.d: "Белград отклоняет официальное соглашение, считая дипломатические издержки слишком высокими в период активных переговоров о вступлении в ЕС. Православный блок сохраняется, но в неофициальном порядке."
 greece.553.a: "Продолжайте другими способами."
 greece.554.t: "Добро пожаловать в BRICS+"
 greece.554.d: "Лидеры стран БРИКС+ официально приветствуют Грецию как первого европейского члена альянса. Послы России, Китая, Индии и Ирана прибывают в Афины на церемонию вступления. Атлантическое отделение альянса закрыто."
 greece.554.a: "Афины занимают место за столом многополярных переговоров."
 greece.555.t: "Греция является опорой многополярного мира."
 greece.555.d: "Греция официально отказалась от Атлантического альянса и Европейского союза, провозгласив себя опорой нового многополярного порядка. В Афинах провозглашена средиземноморская республика, объединяющая три континента. Мир соответственно перестраивается."
 greece.555.a: "Греческое будущее началось."
 greece.555.b: "Запад утратил свой средиземноморский фланг."
 greece.555.c: "Появился новый полюс. Обратите на это внимание."
 CYP_seek_greek_union: "Стремиться к объединению с Грецией"
 CYP_seek_greek_union_desc: "Республика Кипр предпринимает официальные дипломатические инициативы для укрепления связей с Грецией, стремясь к возможному политическому союзу."
 CYP_appeal_to_un: "Обращение к Организации Объединенных Наций"
 CYP_appeal_to_un_desc: "Кипр выносит вопрос о воссоединении на рассмотрение Организации Объединенных Наций, стремясь к международной легитимности соглашения, которое отвечало бы интересам греко-кипрской общины."
 CYP_economic_incentive_north: "Экономические стимулы для Севера"
 CYP_economic_incentive_north_desc: "Кипр предлагает экономические льготы турецко-кипрским общинам на севере, демонстрируя, что воссоединение приносит ощутимые выгоды всем жителям острова."
 NCY_seek_turkish_union: "Стремиться к объединению с Турцией"
 NCY_seek_turkish_union_desc: "Северный Кипр углубляет политические и экономические связи с Турцией, приближая перспективу формального объединения под турецким руководством."
 NCY_recognition_campaign: "Международная кампания по признанию"
 NCY_recognition_campaign_desc: "Северный Кипр начинает дипломатическую кампанию с целью получения более широкого международного признания и легитимизации своего правительства в глазах всего международного сообщества."
 GRE_aegean_defense_posture: "Эгейская оборонительная позиция"
 GRE_aegean_defense_posture_desc: "Повышенная боеготовность и передовые силы поддерживают греческую армию в состоянии повышенной готовности. Каждый перехват, каждое патрулирование, каждое учение — это сигнал о том, что греческая территория будет защищена."
 GRE_cypriot_integration_idea: "Кипрская экономическая интеграция"
 GRE_cypriot_integration_idea_desc: "Глубокая экономическая интеграция с Республикой Кипр, включая таможенный союз и гармонизацию банковской системы, укрепляет торговые связи и обеспечивает стабильные поступления от корпоративного налога в экономику обеих стран."
 GRE_north_macedonian_ties: "Северомакедонские связи"
 GRE_north_macedonian_ties_desc: "Нормализация отношений со Скопье после Преспанского соглашения открыла новые дипломатические каналы на Балканах, породив доброжелательные отношения, которые, в свою очередь, трансформируются в политическое влияние."
 GRE_chinese_investment: "Китайские инвестиции в инфраструктуру"
 GRE_chinese_investment_desc: "Китайский государственный капитал финансирует инфраструктурные и промышленные строительные проекты по всей Греции, ускоряя строительные программы, которые не могут быть покрыты исключительно за счет внутреннего бюджета."
 GRE_lng_gateway: "СПГ-шлюз"
 GRE_lng_gateway_desc: "Греция позиционирует себя как основной европейский пункт поставки сжиженного природного газа, обеспечивая региональных партнеров энергией, не требующей трубопроводного транспорта."
 GRE_balkan_advocate: "Представитель ЕС по Балканам"
 GRE_balkan_advocate_desc: "Будучи ведущим сторонником вступления стран Западных Балкан в ЕС, Греция оказывает все большее влияние на своих северных соседей, используя «мягкую силу»."
 GRE_imec_terminus: "Европейский терминал IMEC"
 GRE_imec_terminus_desc: "Назначение Пирея европейской конечной точкой Индийско-Ближневосточно-Европейского экономического коридора принесет значительные доходы от транзита и инвестиции в инфраструктуру."
 GRE_regional_pillar: "Столп Юго-Восточной Европы"
 GRE_regional_pillar_desc: "Греция закрепила за собой роль незаменимого центра в юго-восточноевропейском регионе, оказывая влияние в энергетической, торговой и дипломатической сферах."
 GRE_epirus_cultural_ties: "Культурные связи Эпира"
 GRE_epirus_cultural_ties_desc: "Официальное соглашение с Тираной о правах меньшинств стабилизировало положение грекоязычных общин на юге Албании, превратив давний источник раздражения в ненавязчивый дипломатический инструмент."
 GRE_italo_hellenic_axis: "Итало-эллинская ось"
 GRE_italo_hellenic_axis_desc: "Скоординированная промышленная политика и программы совместного использования верфей с Римом объединили Афины и итальянский полуостров в единое средиземноморское экономическое пространство."
 GRE_balkan_gas_transit: "Балканский газотранспорт"
 GRE_balkan_gas_transit_desc: "Расширение трубопровода IGB направляет газ из Каспийского моря и Восточного Средиземноморья через территорию Греции в более широкий балканский регион, обеспечивая стабильный доход от транзита."
 GRE_gulf_capital_inflow: "Приток капитала из стран Персидского залива"
 GRE_gulf_capital_inflow_desc: "Суверенные фонды Аравийского полуострова инвестируют в греческую промышленность и логистику, ускоряя формирование капитала во всей экономике."
 GRE_eez_delimitation: "Соглашение о разграничении исключительной экономической зоны"
 GRE_eez_delimitation_desc: "Двустороннее соглашение с Каиром об исключительной экономической зоне предоставляет греческим судам свободные проходы через Восточное Средиземноморье и правовую основу для защиты от конкурирующих морских претензий."
 greece.500.t: "Смерть Стивена Сондерса"
 greece.500.d: "Британский военный атташе Стивен Сондерс был убит в Афинах террористической организацией «17 ноября». Это дерзкое нападение вызвало международное осуждение и оказало огромное давление на греческие службы безопасности с целью ликвидации группировки."
 greece.500.a: "Усилить меры по борьбе с внутренним терроризмом"
 greece.500.b: "Сотрудничать с международными разведывательными службами"
 greece.501.t: "Суд над революционной организацией"
 greece.501.d: "Захваченные 17 ноября члены группировки предстали перед судом в Афинах. После десятилетий уклонения от правосудия руководство группировки предстанет перед судом по обвинению в серии убийств и взрывов. Этот судебный процесс является знаковым моментом для греческой борьбы с терроризмом."
 greece.501.a: "Выносить суровые приговоры"
 greece.501.b: "Воспользуйтесь этим как возможностью для реформирования служб безопасности."
 greece.502.t: "Протесты против войны с терроризмом"
 greece.502.d: "В Греции вспыхнули массовые антивоенные протесты в ответ на вторжение в Ирак. Десятки тысяч человек вышли на улицы Афин и Салоников, отражая глубокое общественное несогласие с возглавляемой США кампанией."
 greece.502.a: "Разрешить мирные демонстрации"
 greece.502.b: "Ограничить протесты для поддержания порядка."
 greece.503.t: "Катастрофа рейса 522 авиакомпании Helios Airways"
 greece.503.d: "Рейс 522 авиакомпании Helios Airways потерпел крушение недалеко от Грамматико после полёта на автопилоте в режиме «полёта-призрака», в результате чего погибли все 121 пассажир и член экипажа. Трагедия, вызванная несоблюдением герметизации салона, подняла серьёзные вопросы о контроле за безопасностью полётов в Греции."
 greece.503.a: "Начать реформы в области авиационной безопасности"
 greece.503.b: "Объявить национальный день траура."
 greece.504.t: "Курдские протесты в Афинах"
 greece.504.d: "Члены курдской диаспоры в Афинах организовали масштабные демонстрации в поддержку прав курдов. Протесты привлекли внимание Анкары, которая с подозрением относится к любой поддержке курдского активизма за рубежом."
 greece.504.a: "Разрешите протестам продолжаться."
 greece.504.b: "Разогнать толпу"
 greece.505.t: "Протесты в связи с кризисом в Газе"
 greece.505.d: "В греческих городах вспыхнули пропалестинские демонстрации в ответ на эскалацию кризиса в Газе. Протестующие призывают правительство занять более жесткую позицию в отношении военных операций и оказать гуманитарную помощь."
 greece.505.a: "Выразите солидарность с протестующими."
 greece.505.b: "Призываем к сдержанности и дипломатическим решениям."
 greece.506.t: "Лесные пожары в Греции 2007 года"
 greece.506.d: "Разрушительные лесные пожары охватили Пелопоннес и Эвбею, унеся жизни десятков людей и уничтожив целые деревни. Пожары выявили серьезные недостатки в возможностях Греции по реагированию на стихийные бедствия и вызвали общественное недовольство действиями правительства в условиях кризиса."
 greece.506.a: "Мобилизация ресурсов для оказания экстренной помощи"
 greece.506.b: "Запросить международную помощь"
 greece.507.t: "Смерть Александроса Григоропулоса"
 greece.507.d: "В районе Эксархия в Афинах полицейский застрелил 15-летнего Александроса Григоропулоса. Это убийство спровоцировало самые масштабные беспорядки в Греции за последние десятилетия, повлекшие за собой масштабные разрушения в крупных городах."
 greece.507.a: "Привлечь к ответственности виновных сотрудников полиции"
 greece.507.b: "Для восстановления порядка необходимо задействовать отряды полиции по борьбе с беспорядками."
 greece.508.t: "Лесные пожары в Греции 2009 года"
 greece.508.d: "В Греции снова бушует разрушительный сезон лесных пожаров, опустошающий леса и угрожающий населенным пунктам в Аттике и восточном Пелопоннесе. Несмотря на уроки 2007 года, противопожарная инфраструктура страны по-прежнему испытывает серьезные проблемы."
 greece.508.a: "Инвестируйте в противопожарную инфраструктуру."
 greece.508.b: "Оказание помощи должно быть направлено на пострадавшие общины."
 greece.509.t: "«Золотая Заря» входит в парламент"
 greece.509.d: "Крайне правая партия «Золотая заря» впервые получила места в парламенте, воспользовавшись общественным недовольством мерами жесткой экономии и экономическим кризисом. Их откровенно националистическая и насильственная риторика встревожила демократические институты по всей Европе."
 greece.509.a: "Внимательно следите за их деятельностью."
 greece.509.b: "Игнорировать их как маргинальное движение"
 greece.510.t: "Формируется партия «Греческое решение»"
 greece.510.d: "Телеведущий Кириакос Велопулос основал партию «Греческое решение», позиционируя её как консервативно-националистическую альтернативу. Партия привлекает избирателей, разочарованных как традиционными правыми, так и крайне правыми радикалами."
 greece.510.a: "Признать новую политическую обстановку"
 greece.510.b: "Отвергните их как популистов."
 greece.511.t: "Смерть Павлоса Фиссаса"
 greece.511.d: "В Керацини член «Золотой зари» зарезал антифашистского рэпера Павлоса Фиссаса. Убийство вызвало национальное возмущение и усилило призывы к правительству принять решительные меры против насильственной сети этой партии."
 greece.511.a: "Принять жесткие меры против «Золотой Зари»"
 greece.511.b: "Призыв к спокойствию и соблюдению надлежащей правовой процедуры."
 greece.512.t: "Суд над членами «Золотой зари»"
 greece.512.d: "Руководство «Золотой зари» предстало перед судом по крупнейшему уголовному делу против политической партии в истории Европы. Обвинения включают в себя организацию преступной группировки, убийство и многочисленные нападения на иммигрантов и политических оппонентов."
 greece.512.a: "Добиваться максимально суровых приговоров."
 greece.512.b: "Пусть восторжествует правосудие."
 greece.513.t: "Сильное землетрясение в Эгейском море"
 greece.513.d: "Мощное землетрясение произошло в восточной части Эгейского моря недалеко от Лесбоса, причинив значительный ущерб и приведя к жертвам. Турция также пострадала, что открыло редкую возможность для двустороннего сотрудничества в области ликвидации последствий стихийного бедствия между двумя соседними странами."
 greece.513.a: "Начать общенациональную операцию по оказанию помощи"
 greece.513.b: "Сотрудничать с Турцией в оказании помощи"
 greece.514.t: "Лесные пожары в Аттике в 2018 году"
 greece.514.d: "Катастрофические лесные пожары охватили восточную Аттику, унеся жизни более ста человек в приморском городе Мати. Это самая смертоносная лесная катастрофа в истории Греции, выявившая системные недостатки в планировании действий в чрезвычайных ситуациях и гражданской защите."
 greece.514.a: "Капитальный ремонт систем гражданской защиты"
 greece.514.b: "Оказать незамедлительную помощь пострадавшим"
 greece.515.t: "Еще одно землетрясение в Афинах"
 greece.515.d: "Вблизи Афин произошло землетрясение, повредившее здания и вызвавшее повсеместную тревогу в столице. Хотя число жертв ограничено, это событие возобновило дискуссию о сейсмической устойчивости стареющей инфраструктуры Греции."
 greece.515.a: "Ужесточить строительные нормы и правила."
 greece.515.b: "Оказание экстренной помощи"
 greece.517.t: "Сильное землетрясение в Эгейском море"
 greece.517.d: "Мощное землетрясение произошло в восточной части Эгейского моря недалеко от Лесбоса, причинив значительный ущерб и приведя к жертвам. Турция также пострадала, что открыло редкую возможность для двустороннего сотрудничества в области ликвидации последствий стихийного бедствия между двумя соседними странами."
 greece.517.a: "Мобилизация усилий по оказанию помощи"
 greece.518.t: "Лесные пожары в Аттике в 2018 году"
 greece.518.d: "Катастрофические лесные пожары охватили восточную Аттику, унеся жизни более ста человек в приморском городе Мати. Это самая смертоносная лесная катастрофа в истории Греции, выявившая системные недостатки в планировании действий в чрезвычайных ситуациях и гражданской защите."
 greece.518.a: "Начать реагирование на чрезвычайную ситуацию"
 greece.519.t: "Еще одно землетрясение в Афинах"
 greece.519.d: "Вблизи Афин произошло землетрясение, повредившее здания и вызвавшее повсеместную тревогу в столице. Хотя число жертв ограничено, это событие возобновило дискуссию о сейсмической устойчивости стареющей инфраструктуры Греции."
 greece.519.a: "Координация действий экстренных служб"
 greece.620.t: "Вопрос о союзе"
 greece.620.d: "Афины официально пригласили Республику Кипр завершить формирование конфедерации и воссоединиться с греческим государством. Решение остается за Никосией."
 greece.620.a: "Присоединяйтесь к Греческому союзу"
 greece.620.b: "Остаться независимой республикой"
 greece.621.t: "Северный вопрос"
 greece.621.d: "Предложение Греции распространяется на север острова. Воссоединение под властью Афин означало бы роспуск отдельной северной администрации и включение ее территории в состав греческого государства."
 greece.621.a: "Принять воссоединение"
 greece.621.b: "Отклонить предложение"
 greece.630.t: "Просьба из Афин"
 greece.630.d: "Греция обратилась к Турции с просьбой помочь смягчить жилищный кризис, охвативший ее города. Сотрудничество облегчило бы бремя для Афин и стало бы редким проявлением доброй воли между двумя соседними странами."
 greece.630.a: "Оказать поддержку"
 greece.630.b: "Отказаться от вмешательства"
 greece.631.t: "Прибыла помощь из Турции."
 greece.631.d: "В Грецию начали поступать турецкая помощь и поддержка в строительстве, что смягчает острую нехватку жилья и улучшает отношения по обе стороны Эгейского моря."
 greece.631.a: "Приветливая рука"
 greece.632.t: "Анкара не оказала никакой помощи."
 greece.632.d: "Турция отказалась вмешиваться в жилищные проблемы Греции. Афинам придется справляться с кризисом самостоятельно."
 greece.632.a: "Мы сами по себе"
 greece.641.t: "Рекордный сезон"
 greece.641.d: "Летом были побиты все рекорды по количеству прибытий. Отели заполнены, аэропорты переполнены, а доходы льются рекой. Вопрос в том, кто получит выгоду от этой неожиданной прибыли."
 greece.641.a: "Вложите средства в развитие островов."
 greece.641.b: "Пусть операторы это оставят себе."
 greece.642.t: "Ответы диаспоры"
 greece.642.d: "Обращение к грекам за рубежом нашло отклик. Инвестиционные обещания и денежные переводы поступают из общин по всему миру, стремящихся к восстановлению родины."
 greece.642.a: "Создать суверенный фонд поддержки диаспоры"
 greece.642.b: "Сопоставьте денежные переводы с налоговыми льготами."
 greece.643.t: "Брюссель открывает краны"
 greece.643.d: "Утвержден первый транш средств на восстановление экономики. Десятки миллиардов уже в пути, их выделение зависит от проведения реформ и от способности Греции фактически потратить эти деньги вовремя."
 greece.643.a: "Начните реализацию проектов с самого начала."
 greece.643.b: "Тратьте деньги с умом."
 greece.650.t: "Доктрина многовекторного подхода"
 greece.650.d: "Афины заявили, что будут взаимодействовать как с Востоком, так и с Западом на своих собственных условиях. Кабинет министров обсуждает, как лучше всего использовать эту независимость в качестве рычага влияния."
 greece.650.a: "Диверсифицировать наших партнеров в энергетическом и торговом секторах."
 greece.650.b: "позиционировать Грецию как регионального посредника"
 greece_military.01.t: "Греческие системы обороны сформированы"
 greece_military.01.d: "Компания Pyrkal и греческая оборонная промышленность объединены в единое государственное предприятие — Hellenic Defence Systems. Цель объединения — оптимизация закупок, стандартизация производства и восстановление отечественного оборонно-промышленного потенциала под единым управлением."
 greece_military.01.a: "Родился национальный чемпион"
 greece_military.02.t: "Греческий военно-морской флот бросает вызов нашим водам."
 greece_military.02.d: "Греция завершила свою стратегию по контролу над суверенными водами и теперь открыто заявляет о своих претензиях на спорные воды Эгейского и Критского морей. Расширение её военно-морского флота является прямым вызовом нашим позициям в Восточном Средиземноморье."
 greece_military.02.a: "Расширить флот"
 greece_military.02.b: "Подать дипломатический протест"
 greece.516.t: "Националистическое движение набирает обороты."
 greece.516.d: "Поддерживаемые Грецией националисты из организации ELAM распространяют свое влияние по всему нашему острову. Их риторика призывает к объединению с Грецией и находит отклик у части населения. Мы можем либо терпеть их присутствие, либо принять жесткие меры, что приведет к общественным беспорядкам."
 greece.516.a: "Пусть они работают"
 greece.516.b: "Подавить движение"
 greece_debt.1.t: "Партнер по обмену долгов"
 greece_debt.1.desc: "Счета продолжают поступать, а казначейство продолжает сокращаться. Наш министр финансов предложил обменять часть нашего еврового долга на иностранную валюту через центральный банк страны-партнера. Новый держатель будет взимать проценты, но по договорным ставкам и на более выгодных условиях, чем наши нынешние кредиторы. В качестве партнера могли бы выступить Индия, Россия, Китай или ЕЦБ, но у каждого из них своя политическая цена."
 greece_debt.1.a: "Возможно, рупия"
 greece_debt.1.b: "Возможно, рубль"
 greece_debt.1.c: "Юань может быть хорошим выбором."
 greece_debt.1.e: "Продолжайте в том же духе."
 GRE_debt_swap_accept_tt: "§GЕсли они согласятся:§! Они выкупают долю нашего долга, становясь кредитором, которому мы должны выплачивать проценты, тем самым облегчая наше финансовое положение сейчас в обмен на стабильные платежи в будущем."
 GRE_debt_counter_refund_tt: "Мы отклоняем встречное предложение. Предоставленный потенциальным кредитором капитал возвращается в полном объеме."
 greece_debt.2.a: "Мы должны отказаться"
 greece_debt.2.b: "Мы возьмём на себя их долг."
 GRE_homelessness_crisis_idea: "Кризис бездомности в Афинах"
 GRE_homelessness_crisis_idea_desc: "Землетрясение в Афинах оставило тысячи людей без крова и заставило их ночевать в парках. Социальные службы перегружены, и по всей столице разрастаются палаточные городки. Чем дольше мы будем медлить с принятием мер, тем хуже станет ситуация."
 GRE_the_drachma_idea: "Драхма"
 GRE_the_drachma_idea_desc: "Работа вне еврозоны означает, что мы управляем драхмой самостоятельно. Нестабильность валюты и высокие процентные ставки по заимствованиям тормозят экономику, но ослабление драхмы поддерживает конкурентоспособность греческого экспорта и увеличивает доходы на международных рынках."
 GRE_solving_tax_evasion_idea: "Устранение налоговых лазеек"
 GRE_solving_tax_evasion_idea_desc: "Устранение налоговых лазеек позволит нам ликвидировать пробелы, но потребует создания большого количества комитетов и пересмотра нашего национального налогового кодекса."
 GRE_tax_evasion_idea: "Безудержное уклонение от уплаты налогов"
 GRE_tax_evasion_idea_desc: "Уклонение от уплаты налогов глубоко укоренилось в греческой финансовой системе и истощает государственные доходы. Без средств на финансирование основных услуг и реформ государство оказывается в тупике."
 GRE_bonds_issued_idea: "Высокодоходные краткосрочные облигации"
 GRE_bonds_issued_idea_desc: "Мы выпустили краткосрочные облигации с высокими процентными ставками. Вливание денежных средств сейчас полезно, но высокая доходность станет бременем до момента погашения долга."
