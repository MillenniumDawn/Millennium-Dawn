 if_policy_smbo_startup_grants_desc: "We fund grants for new small firms, easing their start-up costs at the expense of civilian industry tax income."
 if_policy_smbo_deregulation_desc: "We cut licensing red tape for small firms, letting them run more productively at the cost of corporate tax revenue."
 if_policy_smbo_procurement_quota_desc: "We reserve a share of government contracts for small firms, speeding internet infrastructure build-out while nudging up consumer goods costs."
 if_policy_smbo_licensing_crackdown_desc: "We tighten licensing rules on small firms, raising their tax burden and choking their productivity."
 if_policy_bankers_deregulation_desc: "We deregulate the banking sector, lowering interest rates and the cost of managing economic cycles for financiers."
 if_policy_bankers_bailout_guarantee_desc: "We guarantee state bailouts for troubled banks, cutting their exposure to economic cycles at the expense of corporate tax revenue."
 if_policy_bankers_capital_freedom_desc: "We free capital flows across borders, cutting the cost of sending and receiving investment for financial interests."
 if_policy_bankers_capital_controls_desc: "We impose capital controls on the banking sector, raising the tax take while souring our trade relations."
 if_policy_fossil_drilling_permits_desc: "We issue new drilling permits, boosting oil extraction and exports for the fossil fuel industry."
 if_policy_fossil_fuel_subsidy_desc: "We subsidize fuel production, raising national fuel output and cutting the fuel our power plants burn."
 if_policy_fossil_export_terminals_desc: "We fund new export terminals, speeding fuel silo construction and resource exports for the industry."
 if_policy_fossil_windfall_tax_desc: "We levy a windfall tax on oil profits, raising the take while choking off oil exports."
 if_policy_conglomerates_industrial_policy_desc: "We steer industrial policy toward the big conglomerates, expanding factory capacity at the cost of civilian tax revenue."
 if_policy_conglomerates_export_credits_desc: "We extend export credits to the conglomerates, boosting their resource exports and international market earnings."
 if_policy_conglomerates_infrastructure_contracts_desc: "We award infrastructure contracts to the conglomerates, speeding construction while raising its cost to the state."
 if_policy_conglomerates_antitrust_desc: "We pursue antitrust action against the conglomerates, raising their tax burden and shrinking their factory capacity."
 if_policy_oligarchs_privatisation_deals_desc: "We hand state industry to the oligarchs through privatization deals, speeding construction while feeding corruption."
 if_policy_oligarchs_resource_concessions_desc: "We grant resource concessions to the oligarchs, boosting local resource output and exports."
 if_policy_oligarchs_media_holdings_desc: "We let the oligarchs consolidate media holdings, boosting our political power and our defense against ideological drift."
 if_policy_oligarchs_asset_seizure_desc: "We seize oligarch assets, raising the tax take while souring our trade relations."
 if_policy_maritime_shipbuilding_subsidy_desc: "We subsidize shipyards, speeding dockyard construction while cutting the tax bite on maritime income."
 if_policy_maritime_cabotage_law_desc: "We pass a cabotage law reserving domestic shipping for national carriers, boosting dockyard capacity at the cost of trade relations."
 if_policy_maritime_port_authority_desc: "We expand port authority powers, speeding naval base construction and extending our operating range at sea."
 if_policy_maritime_tonnage_levy_desc: "We impose a tonnage levy on shipowners, raising the tax on maritime income while shrinking dockyard capacity."
 if_policy_military_officer_pay_rise_desc: "We raise officer pay, boosting army morale at a higher cost to the defense budget."
 if_policy_military_procurement_priority_desc: "We give the military first call on factory output, boosting military production at the expense of civilian industry."
 if_policy_military_promotion_autonomy_desc: "We let the officer corps handle its own promotions, sharpening army experience at the cost of political oversight."
 if_policy_military_political_commissars_desc: "We place political commissars in every unit, watching the officer corps at the cost of army organization."
 if_policy_defense_domestic_procurement_desc: "We favor domestic arms procurement, speeding arms factory construction while raising the cost of buying from abroad."
 if_policy_defense_export_licenses_desc: "We loosen arms export licensing, boosting international market income for defense firms at some cost to trade relations."
 if_policy_defense_rnd_grants_desc: "We fund research grants for defense contractors, speeding factory efficiency gains while cutting their tax burden."
 if_policy_defense_contractor_audit_desc: "We audit defense contractors for overcharging, raising their tax burden and slowing military factory output."
 if_policy_intel_surveillance_powers_desc: "We expand domestic surveillance powers, cutting foreign subversive activity at some cost to public stability."
 if_policy_intel_black_budget_desc: "We fund a black budget for the intelligence services, boosting decryption capability while raising policing costs."
 if_policy_intel_covert_action_authority_desc: "We authorize covert action abroad, boosting our foreign influence and our own encryption capability."
 if_policy_intel_service_purge_desc: "We purge the intelligence services of suspect officers, tightening political control while leaving us more exposed to foreign subversion."
 if_policy_unions_collective_bargaining_desc: "We recognize collective bargaining rights, cutting the cost of social programs while raising demand for consumer goods."
 if_policy_unions_strike_protection_desc: "We protect the right to strike, speeding factory efficiency gains for workers at some cost to public stability."
 if_policy_unions_board_seats_desc: "We give union representatives seats on company boards, boosting their political power at some cost to civilian factory output."
 if_policy_unions_strike_ban_desc: "We ban strikes outright, forcing factories back to full capacity at the cost of public stability."
 if_policy_landowners_estate_tax_relief_desc: "We grant estate tax relief to landowners, easing their tax burden and calming rural discontent."
 if_policy_landowners_tenancy_law_desc: "We rewrite tenancy law in favor of landowners, boosting farm productivity while easing the burden of conscription on tenants."
 if_policy_landowners_land_registry_desc: "We formalize land registries for large estates, boosting local resource output and cutting their labor requirements."
 if_policy_landowners_land_reform_desc: "We push through land reform against the great estates, raising their tax burden and stirring rural unrest."
 if_policy_farmers_price_supports_desc: "We guarantee price supports for farmers, boosting agricultural productivity while raising demand for consumer goods."
 if_policy_farmers_rural_credit_desc: "We extend rural credit to farmers, speeding agricultural development and easing their tax burden."
 if_policy_farmers_draft_exemption_desc: "We exempt farm labor from the draft, keeping families on the land and easing the burden of conscription."
 if_policy_farmers_land_tax_desc: "We raise the land tax on smallholders, squeezing farm income and dragging down agricultural productivity."
 if_policy_cadres_party_schools_desc: "We fund party schools to train loyal cadres, boosting political power at a higher cost to the education system."
 if_policy_cadres_nomenklatura_posts_desc: "We reserve bureaucratic posts for the party nomenklatura, cutting administrative costs while feeding corruption."
 if_policy_cadres_mass_mobilisation_desc: "We organize mass mobilization campaigns through the cadres, speeding military mobilization while raising demand for consumer goods."
 if_policy_cadres_anti_corruption_purge_desc: "We purge the party of corrupt cadres, cutting corruption at the cost of the party's own political authority."
 if_policy_priesthood_religious_schools_desc: "We let the priesthood run religious schools, cutting education costs while slowing scientific research."
 if_policy_priesthood_morality_laws_desc: "We enact morality laws backed by the priesthood, calming public stability."
 if_policy_priesthood_tax_exemption_desc: "We grant the priesthood tax-exempt status, boosting political power while trimming state tax revenue."
 if_policy_priesthood_secularisation_desc: "We push secularization against the priesthood, speeding research while unsettling public stability."
 if_policy_ulema_religious_schools_desc: "We let the ulema run religious schools, cutting education costs while slowing scientific research."
 if_policy_ulema_morality_laws_desc: "We enact morality laws backed by the ulema, calming public stability."
 if_policy_ulema_tax_exemption_desc: "We grant the ulema tax-exempt status, boosting political power while trimming state tax revenue."
 if_policy_ulema_secularisation_desc: "We push secularization against the ulema, speeding research while unsettling public stability."
 if_policy_clergy_religious_schools_desc: "We let the clergy run religious schools, cutting education costs while slowing scientific research."
 if_policy_clergy_morality_laws_desc: "We enact morality laws backed by the clergy, calming public stability."
 if_policy_clergy_tax_exemption_desc: "We grant the clergy tax-exempt status, boosting political power while trimming state tax revenue."
 if_policy_clergy_secularisation_desc: "We push secularization against the clergy, speeding research while unsettling public stability."
 if_policy_wahabi_religious_schools_desc: "We let the wahabi ulema run religious schools, cutting education costs while slowing scientific research."
 if_policy_wahabi_religious_police_desc: "We deploy religious police backed by the wahabi ulema, calming public stability while raising policing costs."
 if_policy_wahabi_charity_exemption_desc: "We grant the wahabi ulema tax-exempt status for their charitable endowments, boosting political power while trimming state tax revenue."
 if_policy_wahabi_secularisation_desc: "We push secularization against the wahabi ulema, speeding research while unsettling public stability."
 if_policy_donju_market_tolerance_desc: "We tolerate donju market activity, speeding industrial construction while feeding corruption."
 if_policy_donju_trade_permits_desc: "We grant the donju trade permits, boosting their resource exports and international market earnings."
 if_policy_donju_foreign_currency_shops_desc: "We let the donju run foreign currency shops, raising state tax revenue while easing demand for consumer goods."
 if_policy_donju_market_closures_desc: "We shut down donju markets, tightening political control at the cost of consumer goods supply."
 if_policy_sarf_royal_stipends_desc: "We pay royal stipends to the extended family, calming public stability while raising social program costs."
 if_policy_sarf_court_appointments_desc: "We fill bureaucratic posts with royal court appointees, boosting political power while raising administrative costs."
 if_policy_sarf_family_council_desc: "We empower the family council to police succession, shoring up the state against ideological drift while feeding corruption."
 if_policy_sarf_anti_corruption_detentions_desc: "We detain royal family members in an anti-corruption sweep, raising the tax take while shaking public stability."
 if_policy_quds_proxy_funding_desc: "We fund proxy militias abroad through the Quds Force, expanding our volunteer deployments while trimming state tax revenue."
 if_policy_quds_training_camps_desc: "We host Quds Force training camps for special forces, expanding our special forces capacity at some political cost."
 if_policy_quds_smuggling_networks_desc: "We rely on Quds Force smuggling networks to bypass sanctions, cutting the cost of foreign purchases while souring trade relations."
 if_policy_quds_operations_freeze_desc: "We freeze Quds Force operations abroad, mending trade relations at the cost of our foreign influence."
 if_policy_jihadis_recruitment_drive_desc: "We back a jihadi recruitment drive, swelling our manpower pool while unsettling public stability."
 if_policy_jihadis_frontline_autonomy_desc: "We give jihadi fighters autonomy on the frontline, sharpening our attack power there at some cost to organization."
 if_policy_jihadis_martyr_glorification_desc: "We glorify jihadi martyrdom in state media, boosting war support while souring our trade relations."
 if_policy_jihadis_foreign_fighter_purge_desc: "We purge foreign fighters from our ranks, calming public stability at the cost of war support."
 if_policy_wall_street_deregulation_desc: "We deregulate Wall Street, lowering interest rates and the cost of managing economic cycles for financiers."
 if_policy_wall_street_bailout_guarantee_desc: "We guarantee bailouts for Wall Street banks, cutting their exposure to economic cycles at the expense of corporate tax revenue."
 if_policy_wall_street_dollar_diplomacy_desc: "We back dollar diplomacy abroad on behalf of Wall Street, boosting returns on investment and our foreign influence."
 if_policy_wall_street_financial_regulation_desc: "We impose new financial regulation on Wall Street, raising the tax take while souring trade relations."
 if_policy_chaebols_industrial_policy_desc: "We steer industrial policy toward the chaebols, expanding factory capacity at the cost of civilian tax revenue."
 if_policy_chaebols_export_credits_desc: "We extend export credits to the chaebols, boosting their resource exports and international market earnings."
 if_policy_chaebols_cross_shareholding_desc: "We tolerate cross-shareholding among the chaebols, cutting their investment costs while feeding corruption."
 if_policy_chaebols_governance_reform_desc: "We force governance reform on the chaebols, raising their tax burden and shrinking their factory capacity."
