 UKR_develop_t72amt: "Développez §YT-72AMT§!"
 UKR_develop_btr3u: "Rechercher le BTR-3U 'Myslyvets'"
 UKR_develop_btr3u_desc: "Le BTR-3U 'Myslyvets' (également connu sous le nom de BTR-3U 'Guardian') est une modification profonde du BTR-94K dotée d'un moteur Deutz BF6M1015 de 326 ch et d'une transmission automatique Allison MD3066, ou d'un moteur UTD-20 de 300 ch.\nLe bureau d'études Morozov de Kharkiv a réalisé la documentation technique : développement du châssis et intégration de tous les systèmes et armements de la machine.\nL'armement comprend un module de combat KBA-105 'Shkval' avec un canon automatique de 30 mm ZTM-1, une mitrailleuse jumelée KT-7.62, deux lanceurs ATGM 9M114M 'Konkurs-M' et un lance-grenades automatique de 30 mm.\nIl est équipé du complexe de visée OTP-20, intégré au système de contrôle de tir des missiles guidés et au stabilisateur d'armement biplan SVU-500."
 UKR_develop_btr3e: "Rechercher le BTR-3E"
 UKR_develop_btr3e_desc: "Le BTR-3E est une modification équipée d'un moteur UTD-20 ou Deutz BF6M1015.\nIl est équipé du module de combat BM-3M 'Sturm-M', dont l'armement comprend un canon automatique de 30 mm ZTM-1, une mitrailleuse de 7,62 mm KT-7.62 jumelée, deux lanceurs (6 roquettes) 'Baryer' et un lance-grenades automatique de 30 mm KBA-117."
 UKR_develop_btr3e1: "Rechercher le BTR-3E1"
 UKR_develop_btr3e1_desc: "Le BTR-3E1 est une modification du BTR-3E, spécifiquement réalisée pour répondre aux exigences du contrat thaïlandais en 2005-2006.\nLes principales caractéristiques de cette version par rapport au BTR-3E sont : l'installation du module de combat modernisé BM-3M 'Shturm', une réduction de la hauteur de 2928 mm à 2774 mm, une augmentation de l'équipage de combat de 9 à 13 personnes, l'installation d'une station radio VRC-950 et le placement de munitions supplémentaires pour le module de combat."
 UKR_develop_btr3da: "Rechercher le BTR-3DA"
 UKR_develop_btr3da_desc: "Le BTR-3DA est une évolution du transport de troupes blindé, prenant en compte l'expérience de la guerre dans l'est de l'Ukraine.\nLe BTR-3DA est plus rapide et plus maniable que ses prédécesseurs, il possède une protection blindée améliorée pour l'équipage et dispose d'un module optique-électronique avec des canaux de télévision et d'imagerie thermique.\nGrâce à cela, il est devenu possible de tirer de nuit.\nUne unité de puissance auxiliaire permet de contrôler le module de combat sans utiliser le moteur principal."
 UKR_develop_btr3u_flag: " Décision terminée §YRechercher le BTR-3U 'Myslyvets'§!"
 UKR_develop_btr3e_flag: " Décision terminée §YRechercher le BTR-3E§!"
 UKR_develop_btr3e1_flag: " Décision terminée §YRechercher le BTR-3E1§!"
 UKR_develop_btr3da_flag: " Décision terminée : §YRechercher le BTR-3DA§!"
 UKR_develop_btr3e1_cse90lp: "Rechercher le BTR-3E1 CSE90LP"
 UKR_develop_btr3e1_cse90lp_desc: "Le BTR-3E1 CSE90LP est une modification du BTR-3E1, équipée d'une tourelle Cockerill CSE 90LP avec un canon basse pression de 90 mm.\nLa tourelle est équipée d'une mitrailleuse coaxiale de 7,62 mm et d'un lance-grenades automatique de 40 mm.\nLa tourelle est équipée d'un système de conduite de tir automatique, comprenant un télémètre laser, une imagerie thermique et un calculateur balistique."
 UKR_develop_btr3e1_cpws30: "Rechercher le BTR-3E CPWS-30"
 UKR_develop_btr3e1_cpws30_desc: "Le BTR-3E CPWS-30 est une modification du BTR-3E, équipée d'une tourelle CPWS-30 avec un canon automatique de 30 mm.\nLa tourelle est équipée d'une mitrailleuse coaxiale de 7,62 mm et d'un lance-grenades automatique de 40 mm.\nLa tourelle est équipée d'un système de conduite de tir automatique, comprenant un télémètre laser, une imagerie thermique et un calculateur balistique."
 UKR_develop_btr4_category: "Développer le BTR-4[UKR_btr4_development_steps_loc]"
 UKR_develop_btr4_category_desc: "\n\n\n\n\n\n£UKR_desctext_btr4_main\n\n\n\n\n\n\n\n\nNous pouvons investir du temps et des ressources pour rechercher et tester une conception nationale entièrement nouvelle de VBTT moderne."
 UKR_develop_btr4_choose_role: "Choisir le rôle du §YBTR-4§!"
 UKR_develop_btr4_choose_role_desc: "\n\n\n\n\n\n£UKR_desctext_btr4_for_tooltip_roles\n\n\n\n\n\n\n\n\nLe §YBTR-4§! a été conçu pour surpasser les anciens modèles soviétiques en intégrant des armements plus lourds dès la conception. Nous pouvons choisir son rôle : un VBTT plus léger et économique ou un VCI lourdement armé et coûteux."
