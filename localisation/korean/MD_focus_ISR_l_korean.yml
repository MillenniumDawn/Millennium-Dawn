 israel_mechanic.14.t: "거셈 솔레이마니 암살 시도 실패!"
 israel_mechanic.14.d: "최근 미국과 이스라엘군으로 추정되는 세력이 거셈 솔레이마니를 암살하려고 드론 공격을 감행했습니다. 그러나 드론 공격은 실패했으며 장군은 무사히 생존해 있습니다."
 israel_mechanic.14.a: "흥미롭군."
