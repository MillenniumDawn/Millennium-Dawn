 SOV_russian_government_idea_tt: "[SOV_ForRepublic_loc][SOV_Federalism_loc]"
 russia.118.t: "El Destino del Crucero «Baku»"
 russia.118.d: "El destino del crucero Baku ha sido incierto durante años. Desde los años 90, la India ha mostrado interés en comprarlo. Ahora, debemos decidir si conservamos y modernizamos el crucero para nuestra armada o si lo vendemos a la India para obtener fondos."
 russia.118.a: "Actualizarlo"
 russia.118.b: "Véndelo"
 SOV_slavic_wagner_TT: "Se creará PMC de Wagner."
 russia_news.51.t: "La Muerte de Alexander Dugin"
 russia_news.51.d: "Alexander Dugin, controvertido ideólogo ruso y fundador del movimiento eurasianista, ha fallecido en su domicilio a causa de la rabia que, al parecer, contrajo a través de su rata mascota, Logos. Las autoridades no entienden por qué no acudió al médico. Debido a las circunstancias sospechosas, el caso se está investigando como un posible homicidio."
 russia_news.51.o1: "¡Una gran tragedia!"
 russia_news.51.o2: "Una Muerte Cruel"
 SOV_promotion_of_unite_with_russia_bulgaria: "Promociona los intereses de §YRusia§! en §Y[BUL.GetNameWithFlag]§!"
 russia_governorate.24.t: "El problema de Artsaj"
 russia_governorate.24.d: "La República de Artsaj se encuentra en una encrucijada respecto a quién la gobernará en las circunstancias actuales. Ahora que Armenia y Rusia están más unidas que nunca, el futuro de Artsaj pende de un hilo."
 russia_governorate.24.o1: "Dejemos que Rusia tome el control."
 russia_governorate.24.o2: "Artsaj es nuestro."
 sov_economic.43.t: "[From.GetName] y MTS"
 sov_economic.43.d: "[From.GetName] y nuestra empresa MTS han firmado un nuevo acuerdo que nos concede acceso a su mercado. Se espera que esta asociación impulse significativamente la capitalización de nuestra empresa."
 sov_economic.43.a: "Excelente"
 sov_economic.44.t: "[From.GetName] y Gazprom"
 sov_economic.44.d: "[From.GetName] y Gazprom han cerrado un acuerdo que abre el acceso a su mercado. Es probable que este acuerdo refuerce nuestra capitalización y presencia en el mercado."
 sov_economic.44.a: "Excelente"
 sov_economic.45.t: "[From.GetName] y VTB"
 sov_economic.45.d: "[From.GetName] y VTB han firmado un acuerdo que nos proporciona acceso al mercado a través de su red, lo que debería tener un impacto positivo en nuestra capitalización."
 sov_economic.45.a: "Excelente"
 sov_economic.46.t: "[From.GetName] y Rosneft"
 sov_economic.46.d: "[From.GetName] y Rosneft han firmado un acuerdo que nos permite acceder a su mercado, lo que promete tener un efecto positivo en nuestra capitalización."
 sov_economic.46.a: "Excelente"
 sov_economic.47.t: "[From.GetName] y ALROSA"
 sov_economic.47.d: "[From.GetName] y ALROSA han firmado un acuerdo que nos otorga acceso al mercado a través de esta empresa. Se espera que este acuerdo mejore nuestra capitalización."
 sov_economic.47.a: "Excelente"
 SOV_allied_nrk_2: "Alianza con Corea del Norte"
 SOV_allied_nrk_2_desc: "Planeamos expandir nuestras alianzas hacia el este, comenzando por Corea del Norte, una nación cuyo pueblo agradece nuestro apoyo histórico y debe su continua existencia en gran parte a nosotros."
 SOV_warsaw_finland: "Finlandia Roja"
 SOV_warsaw_finland_desc: "Durante la Guerra Civil Rusa, se intentó establecer un gobierno socialista en Finlandia para recuperar el territorio perdido. Ahora, estamos preparados para completar esta misión incorporando a Finlandia al Pacto de Varsovia."
 SOV_mongolia_question: "Pregunta de Mongolia"
 SOV_mongolia_question_desc: "Mongolia ha mantenido históricamente la neutralidad a petición nuestra para evitar conflictos con China y preservar las relaciones amistosas. Sin embargo, ahora estamos dispuestos a dejar de lado estas preocupaciones y proponer una unión plena con Mongolia."
 SOV_vietnam_question: "Pregunta vietnamita"
 SOV_vietnam_question_desc: "Vietnam ha sido durante mucho tiempo un aliado y socio confiable. Ha llegado el momento de profundizar nuestra cooperación y llevar esta asociación a un nuevo nivel."
 SOV_spain_influ: "Revisando el resultado de la guerra civil"
 SOV_spain_influ_desc: "Las fuerzas socialistas fueron derrotadas en la Guerra Civil Española. Estamos dispuestos a ayudar a los comunistas españoles a alzarse de nuevo y restaurar la dictadura del proletariado en España."
 SOV_avenge_afgan: "Segunda intervención en Afganistán"
 SOV_avenge_afgan_desc: "Nuestro intento inicial de tomar el control de Afganistán fracasó. Ahora, estamos listos para vengar esa derrota y finalmente lograr nuestros objetivos en el llamado \"Cementerio de Imperios\"."
 SOV_iraq_influ_desc: "Aunque Irak está geográficamente distante y nunca ha sido un aliado cercano con nosotros, estamos dispuestos a apoyar sus esfuerzos para derrocar al régimen antisoviético actualmente en el poder."
 SOV_warsaw_greece: "Repetir la guerra civil en Grecia"
 SOV_warsaw_greece_desc: "La Guerra Civil griega de 1946 a 1949 terminó con la derrota de las fuerzas comunistas. Ahora estamos dispuestos a volver y vengarnos para recuperar nuestra influencia."
 SOV_influence_on_spain: "Cooperación con los comunistas españoles"
 SOV_iraq_influ: "Irak rojo"
 SOV_influence_on_greece: "Cooperación con los comunistas griegos"
 SOV_warsaw_perevorot_greece: "Golpe comunista en §Y[GRE.GetNameWithFlag]§!"
 SOV_influence_on_vietnam: "Cooperación con los comunistas vietnamitas"
 SOV_warsaw_perevorot_vietnam: "Golpe comunista en §Y[VIE.GetNameWithFlag]§!"
 SOV_influence_on_mongolia: "Cooperación con los comunistas mongoles"
 SOV_warsaw_perevorot_mongolia: "Golpe comunista en §Y[MON.GetNameWithFlag]§!"
 SOV_influence_on_finland: "Cooperación con los comunistas finlandeses"
 SOV_warsaw_perevorot_finland: "Golpe comunista en §Y[FIN.GetNameWithFlag]§!"
 SOV_warsaw_perevorot_poland: "Golpe comunista en §Y[POL.GetNameWithFlag]§!"
 SOV_warsaw_perevorot_bulgaria: "Golpe comunista en §Y[BUL.GetNameWithFlag]§!"
 SOV_warsaw_perevorot_romania: "Golpe comunista en §Y[ROM.GetNameWithFlag]§!"
