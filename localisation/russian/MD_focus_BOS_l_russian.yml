 BOS_focus: "Дерево фокусов Боснии"
 BOS_army_of_the_federation_bosnia_herzegovina: "Армия Федерации"
 BOS_army_of_the_federation_bosnia_herzegovina_desc: "Боснийские и хорватские формирования Федерации должны войти в национальную командную структуру, не теряя при этом оперативной готовности."
 BOS_army_of_republic_of_srpska: "Армия Республики Сербской"
 BOS_army_of_republic_of_srpska_desc: "Для обеспечения устойчивости военного объединения необходимо, чтобы формирования Республики Сербской были представлены в новых вооруженных силах."
 BOS_air_doctrine: "Пересмотреть доктрину ВВС"
 BOS_air_doctrine_desc: "Небольшой авиации Боснии необходима доктрина, подходящая для территориальной обороны, транспортных перевозок и поддержки сухопутных войск."
 BOS_air_defence_initiative: "Инициатива противовоздушной обороны"
 BOS_air_defence_initiative_desc: "Многоуровневая система противовоздушной обороны предлагает Боснии практичное решение для борьбы с вражеской авиацией, не требующее большого истребительного флота."
 BOS_apc_armament: "Бронетранспортеры"
 BOS_apc_armament_desc: "Оснащение подразделений бронетранспортерами обеспечит защиту пехоты, а также повысит огневую мощь механизированных формирований."
 BOS_re_enlist_ratko_mladic: "Вернуть Ратко Младича в армию"
 BOS_re_enlist_ratko_mladic_desc: "Возвращение Ратко Младича на командный пост означало бы получение опыта ценой примирения и утраты международной легитимности."
 BOS_detain_ratko_mladic: "Задержать Ратко Младича"
 BOS_detain_ratko_mladic_desc: "Сотрудничество с международными органами правосудия позволит отстранить Ратко Младича от военных дел, но вызовет гнев у многих боснийских сербов."
 BOS_sam_systems: "Развернуть ЗРК"
 BOS_sam_systems_desc: "Стационарные зенитно-ракетные комплексы обеспечат защиту Сараево и основных объектов военной инфраструктуры от воздушных атак."
 BOS_aa_personnel_equipment: "Оснастить подразделения ПВО"
 BOS_aa_personnel_equipment_desc: "Для сопровождения наземных подразделений мобильным группам противовоздушной обороны необходимы современные пусковые установки, датчики и подготовка."
 BOS_helicopter_transportation: "Расширение вертолетных перевозок"
 BOS_helicopter_transportation_desc: "Увеличение парка транспортных вертолетов позволит оперативно развертывать силы, проводить эвакуацию и оказывать помощь при стихийных бедствиях."
 BOS_radar_detection_advancement: "Усовершенствованное радиолокационное обнаружение"
 BOS_radar_detection_advancement_desc: "Современная радиолокационная станция объединит подразделения противовоздушной обороны Боснии и обеспечит более раннее предупреждение о приближающихся самолетах."
 BOS_domestic_production: "Отечественное производство самолетов"
 BOS_domestic_production_desc: "Создание отечественного военного завода позволит поддерживать боеготовность военно-воздушных сил и снизить зависимость от ненадежных иностранных поставщиков."
 BOS_national_air_force_scheme: "Национальная программа ВВС"
 BOS_national_air_force_scheme_desc: "Национальная программа развития военно-воздушных сил объединит инвестиции в истребители, вспомогательное вооружение и базы в рамках единого плана закупок."
 BOS_house_of_representatives: "Расширить полномочия Палаты представителей"
 BOS_house_of_representatives_desc: "Укрепление Палаты представителей обеспечит национальному законодательству чёткий демократический мандат, сохраняя при этом конституционное представительство для каждого государствообразующего народа."
 BOS_bosnian_elections_crisis_gate_tt: "Доступно только в условиях финансового кризиса в стране."
 BOS_the_federation: "Возобновить действие Федерального соглашения"
 BOS_the_federation_desc: "Возобновление федерального соглашения позволит уточнить полномочия образований и уменьшить иностранное влияние, хотя руководству каждого государствообразующего народа придётся поступиться частью свободы действий."
 BOS_elections_political: "Реформировать избирательную систему"
 BOS_elections_political_desc: "Избирательная реформа обеспечит устойчивый мандат для ротационного Президиума и определит, какая национальная коалиция будет контролировать программу модернизации."
 BOS_balkan_backyard: "Балканский задний двор"
 BOS_balkan_backyard_desc: "Общая память о процветании Югославии может стать основой для добровольного регионального проекта, но правительства соседних стран нужно убеждать, а не оказывать на них давление или принуждать."
 BOS_fight_or_perish: "Сражайся или погибни"
 BOS_fight_or_perish_desc: "Государство будет использовать оставшиеся людские ресурсы и примет на себя нагрузку, необходимую для выживания в условиях гражданской войны."
 BOS_unified_armed_forces: "Объединенные Вооруженные Силы"
 BOS_unified_armed_forces_desc: "Объединённые силы, приемлемые для всех государствообразующих народов, завершат программу совместного восстановления и положат конец чрезвычайным финансовым мерам."
 BOS_anti_federation_propaganda: "Бросьте вызов Федерации"
 BOS_anti_federation_propaganda_desc: "Бросить вызов федеральной власти, направить новые отрасли промышленности в Республику Сербскую и углубить связи с Сербией за счет национальной стабильности."
 BOS_alija_izetbegovic_legacy: "Наследие Алии Изетбеговича"
 BOS_alija_izetbegovic_legacy_desc: "Наследие Алии Изетбеговича связывает боснийскую государственность как с демократическими институтами, так и с мобилизацией во время войны. Его преемникам предстоит решить, какая часть этого наследия будет определять развитие Боснии."
 BOS_european_relations: "Возродить югославское наследие"
 BOS_european_relations_desc: "Культурная и политическая работа на территории бывшей Югославии позволит превратить ностальгию в поддержку регионального сотрудничества."
 BOS_revive_relation_with_serbia_yugoslavia: "Возобновить отношения с [SER.GetName]"
 BOS_revive_relation_with_serbia_yugoslavia_desc: "Восстановление официальных связей с Сербией укрепит правительство под руководством Сербской, но вызовет тревогу у боснийских и хорватских лидеров."
 BOS_eu_loans: "Кредиты ЕС на развитие"
 BOS_eu_loans_desc: "Европейский кредит на развитие обеспечит немедленную ликвидность для восстановления, одновременно создавая взвешенные долговые обязательства."
 BOS_bosnian_revanchism: "Боснийский реваншизм"
 BOS_bosnian_revanchism_desc: "Лидеры реваншистов поставят боснийские военные претензии выше Дейтонского компромисса, укрепляя военные интересы и рискуя спровоцировать возобновление межобщинных конфликтов."
 BOS_western_objectives: "Западная ориентация"
 BOS_western_objectives_desc: "Твердая приверженность Западу откроет доступ к евроатлантическим институтам и помощи в сфере безопасности, одновременно закрыв восточную альтернативу."
 BOS_eastern_frontier: "Восточная ориентация"
 BOS_eastern_frontier_desc: "Босния будет стремиться к партнерству с Россией и Сербией в качестве восточного противовеса западному контролю."
 BOS_a_new_struggle: "Новая борьба"
 BOS_a_new_struggle_desc: "Реваншистские организаторы мобилизуют националистические сети и ослабят послевоенное политическое урегулирование."
 BOS_us_assistance: "Американская помощь"
 BOS_us_assistance_desc: "Более тесные торговые связи с Соединенными Штатами заменят широкие торговые связи НАТО целенаправленным двусторонним партнерством."
 BOS_bosnian_euro_defence_clause: "Европейские оборонные гарантии"
 BOS_bosnian_euro_defence_clause_desc: "Ключевые европейские государства будут самостоятельно решать, предоставлять ли гарантии Боснии, поскольку EUFOR передает ответственность национальным институтам."
 BOS_russo_bosnian_alignment: "Российское партнерство"
 BOS_russo_bosnian_alignment_desc: "Официальное партнерство с Россией позволит углубить торговлю с Востоком и укрепить политическую поддержку, не лишая Боснию суверенитета."
 BOS_serbian_bosnian_arms_treaty: "Договор о вооружениях: [SER.GetName] — Босния"
 BOS_serbian_bosnian_arms_treaty_desc: "Выдача сербских лицензий на производство ускорит перевооружение и усилит влияние Белграда на оборонную политику Боснии."
 BOS_srpska_supremacy: "Превосходство Сербской"
 BOS_srpska_supremacy_desc: "Программа господства демонтирует систему разделения власти и подчинит государство институтам Сербской, что вызовет недовольство других государствообразующих народов."
 BOS_national_awakening: "Национальное пробуждение"
 BOS_national_awakening_desc: "Реваншистское движение порвет с международным контролем и подготовит захват государственной власти исламистами."
 BOS_relax_conscription_laws: "Смягчить законы о воинской повинности"
 BOS_relax_conscription_laws_desc: "Сокращение срочной службы облегчит бремя для домохозяйств по мере возвращения сил образований под национальный гражданский контроль."
 BOS_cooperation_alignment: "Согласование сотрудничества"
 BOS_cooperation_alignment_desc: "Совместное управление и меры по борьбе с коррупцией позволят привести деятельность этих субъектов в соответствие с Сараево, не упраздняя при этом их автономию."
 BOS_bosnian_trade_alliance: "Западное партнерство вооружений"
 BOS_bosnian_trade_alliance_desc: "Лицензии на производство американского авиационного и пехотного оружия станут основой западного партнерства в сфере вооружений."
 BOS_beograd_conference: "Белградская конференция"
 BOS_beograd_conference_desc: "Конференция в Белграде урегулирует споры в сфере безопасности и экономики, прежде чем Босния начнет стремиться к более широкому восточному альянсу."
 BOS_muslim_strong_arm: "Исламистский авангард"
 BOS_muslim_strong_arm_desc: "Исламистский авангард укрепит новый режим и будет искать поддержки у сочувствующих ему правительств за рубежом."
 BOS_muslim_nationalism: "Мусульманский национализм"
 BOS_muslim_nationalism_desc: "Мусульманский национализм будет сочетать в себе религиозный авторитет, мобилизацию и интервенционистскую внешнюю политику."
 BOS_demote_serbian_irrational_nationalism_new: "Сдержать сербских радикалов"
 BOS_demote_serbian_irrational_nationalism_new_desc: "Федеральные партии намерены изолировать радикальные сербские фракции, обменяв краткосрочную напряженность на укрепление гражданского государства."
 BOS_accommodate_serbian_pride_new: "Пойти навстречу сербской автономии"
 BOS_accommodate_serbian_pride_new_desc: "Конституционные уступки приведут к признанию сербской автономии и вовлечению умеренных сербских партий в правительство."
 BOS_nato_status: "Стремиться к членству в НАТО"
 BOS_nato_status_desc: "Босния будет добиваться членства в НАТО только после достижения внутреннего примирения и прекращения чрезвычайного внешнего контроля."
 BOS_union_with_serbia: "Союз с Сербией"
 BOS_union_with_serbia_desc: "Сербия получит согласованное предложение о политическом союзе и может принять или отклонить включение Боснии в свой состав."
 BOS_mosque_construction: "Программа строительства мечетей"
 BOS_mosque_construction_desc: "Государственная поддержка мечетей и религиозных учреждений укрепит исламскую идентичность режима."
 BOS_milorad_dodik_new: "Отстранить Милорада Додика"
 BOS_milorad_dodik_new_desc: "Ликвидация патронажной сети Милорада Додика снизит коррупцию, но оттолкнет часть сербского электората."
 BOS_european_affairs: "Европейские дела"
 BOS_european_affairs_desc: "Европейская торговля и демократические институты станут основой мирной внешней политики Боснии."
 BOS_pathway_towards_eu_membership: "Путь к членству в ЕС"
 BOS_pathway_towards_eu_membership_desc: "Босния будет соответствовать европейским требованиям к инфраструктуре и управлению, в то время как члены ЕС будут решать, инвестировать ли в этот регион."
 BOS_formation_of_bonds_with_the_eu: "Укрепление экономических связей с ЕС"
 BOS_formation_of_bonds_with_the_eu_desc: "Расширение торговых связей с Европейским союзом углубит доступ на рынок и снизит затраты на финансирование."
 BOS_yugoslav_cultural_revival: "Югославское культурное возрождение"
 BOS_yugoslav_cultural_revival_desc: "Финансируемые государством кино, музыка и создание общих мемориалов, посвященных войне, представят югославские десятилетия как общее наследие, а не как неудачный эксперимент."
 BOS_common_market_proposal: "Предложение о создании общего рынка"
 BOS_common_market_proposal_desc: "Предложение о беспошлинной торговле между государствами-преемниками позволит восстановить торговые связи, разорванные в 1990-х годах."
 BOS_federal_charter: "Разработать проект федеральной хартии"
 BOS_federal_charter_desc: "Опубликованный проект конституции добровольной федерации даст движению за воссоединение конкретную политическую программу."
 BOS_reconciliation_commission: "Комиссия по примирению"
 BOS_reconciliation_commission_desc: "Совместная комиссия по военным обидам заслушает показания всех трех составляющих народов и снизит внутренние издержки югославского проекта."
 BOS_convene_the_federation: "Созовите Федерацию"
 BOS_convene_the_federation_desc: "Сараево созовет правительства стран-преемников для переговоров о восстановлении федерации, как только это позволит народная поддержка."
 BOS_greater_srpska_state: "Великая Республика Сербская"
 BOS_greater_srpska_state_desc: "Централизованное государство будет перестроено вокруг институтов Республики Сербской, а проект объединения уступит место верховенству этого образования внутри страны."
 BOS_purge_the_federation: "Очистить Федерацию"
 BOS_purge_the_federation_desc: "Боснийские и хорватские чиновники будут отстранены от должностей в министерствах, судах и полицейских управлениях, что положит конец организованному сопротивлению власти Республики Сербской."
 BOS_srpska_command_primacy: "Первенство командования Республики Сербской"
 BOS_srpska_command_primacy_desc: "Офицеры Республики Сербской займут все высшие должности в вооружённых силах, что привяжет армию к руководству этого образования."
 BOS_dominant_entity: "Господствующее образование"
 BOS_dominant_entity_desc: "Республика Сербская теперь фактически и юридически управляет Боснией. Остальные федеральные институты существуют для обслуживания этого образования."
 BOS_council_democracy: "Советская демократия"
 BOS_council_democracy_desc: "Рабочие советы будут избирать делегатов в национальные органы, что обеспечит организованному труду постоянную конституционную роль."
 BOS_nationalize_heavy_industry: "Национализация тяжелой промышленности"
 BOS_nationalize_heavy_industry_desc: "Государство получит контрольные пакеты акций заводов, шахт и машиностроительных предприятий и передаст их под управление советов."
 BOS_workers_republic: "Провозгласите Рабочую Республику"
 BOS_workers_republic_desc: "Рабочее движение заменит постдейтонский порядок социалистической республикой, управляемой через свои советы."
 BOS_business_sector_management: "Развитие бизнес-сектора"
 BOS_business_sector_management_desc: "Проект строительства офисного здания в Сараево, стоимость которого будет рассчитана, позволит формализовать экономику услуг, при условии наличия достаточного количества работников для его укомплектования."
 BOS_lumber_harvesting: "Развивать лесной сектор"
 BOS_lumber_harvesting_desc: "Устойчивое лесопользование и стандарты переработки позволят расширить экспорт из сельской местности без необходимости вводить еще одну постоянную программу субсидирования."
 BOS_land_mines_desc: "Минные поля военного времени продолжают уносить жизни мирных жителей, препятствовать заселению и выводить из эксплуатации плодородные земли."
 BOS_prep_for_civil_war_map: "Подготовка к гражданской войне"
 BOS_prep_for_civil_war: "Операции по подготовке к гражданской войне"
 BOS_prep_for_civil_war_desc: "Республика Сербская перевооружается в связи с приближением нового гражданского конфликта в Боснии. Подготовительные операции могут обеспечить поставки оружия и повысить боеготовность правительства до начала боевых действий."
 BOS_bosnian_faction_management: "Управление государствообразующими группами"
 BOS_internal_factions: "Народы Боснии"
 BOS_internal_factions_desc: "Дейтонское соглашение разделяет полномочия между национальными институтами, Федерацией Боснии и Герцеговины и Республикой Сербской. Государственная политика влияет на отношение, стабильность и готовность каждой из этих групп предоставлять людские ресурсы."
 BOS_return_of_entitled_lands: "Интегрировать контролируемые земли"
 BOS_return_of_entitled_lands_desc: "Интегрировать соседний контролируемый регион после того, как подчинение в нём достигнет не менее 80%, а сопротивление упадёт ниже 10%."
 BOS_islamic_uprising: "Судьба боснийской гражданской войны"
 BOS_islamic_uprising_desc: "Если гражданская война затянется дольше, чем они смогут выдержать, боевики группировки «Эль Муджахид» могут выступить против Сараево и Республики Сербской."
 BOS_declare_islamic_takeover: "Восстание «Эль Муджахид»"
 BOS_declare_islamic_takeover_desc: "Иностранные исламистские боевики готовятся порвать с правительством и создать собственное государство, в то время как гражданская война продолжается."
 BOS_core_states_2: "Интегрировать [FROM.GetName]"
 BOS_core_states_2_desc: "Выделить политические и промышленные ресурсы на интеграцию этого покорного соседнего региона."
 BOS_raid_weapon_stockpiles: "Налёт на склады оружия"
 BOS_raid_weapon_stockpiles_desc: "Захватите пехотное оружие с незащищенных складов военного времени до начала нового гражданского конфликта."
 BOS_civil_war: "Надвигающаяся буря"
 BOS_civil_war_desc: "Республика Сербская готовится к отделению. Если кризис не будет урегулирован, после истечения срока действия этой миссии начнётся гражданская война."
 BOS_croats_declare_independence: "Хорваты провозгласили независимость"
 BOS_croats_declare_independence_desc: "Враждебно настроенные хорватские общины могут поддержать отделение Герцеговины, если уровень национальной стабильности останется низким."
 BOS_srpska_declares_independence: "Республика Сербская провозглашает независимость"
 BOS_srpska_declares_independence_desc: "Враждебно настроенные сербские общины могут поддержать отделение, если уровень национальной стабильности останется низким."
 BOS_quell_serbians: "Подавление сербской оппозиции"
 BOS_quell_serbians_desc: "Применять принудительные меры против враждебно настроенных сербских организаций, снижая их лояльность и стабильность, а также изменяя партийную поддержку."
 BOS_gain_srpska_popular_support: "Завоевать поддержку сербского народа"
 BOS_gain_srpska_popular_support_desc: "Финансирование информационно-просветительской работы и местных программ, направленных на улучшение отношения сербов и повышение их стабильности."
 BOS_fund_bosniak_community_programs: "Финансирование программ для боснийской общины"
 BOS_fund_bosniak_community_programs_desc: "Оплачивайте школы, клиники и местные службы в боснийских районах из государственного бюджета. Это восстанавливает доверие боснийцев так же, как это сделала бы политическая кампания, но с помощью денег, а не политической власти."
 BOS_fund_croat_community_programs: "Финансирование хорватских общественных программ"
 BOS_fund_croat_community_programs_desc: "Финансирование школ, клиник и местных служб в хорватских районах осуществляется из государственной казны. Это восстанавливает доверие хорватов так же, как это сделала бы политическая кампания, но с помощью денег, а не политической власти."
 BOS_fund_srpska_community_programs: "Финансирование программ для сербской общины"
 BOS_fund_srpska_community_programs_desc: "Финансирование школ, клиник и местных служб в сербских районах осуществляется из государственной казны. Это восстанавливает доверие сербов так же, как это сделала бы политическая кампания, но с помощью денег, а не политической власти."
 BOS_collaboration_with_serbians: "Сотрудничать с сербскими лидерами"
 BOS_collaboration_with_serbians_desc: "Превратить дружественных сербских лидеров в лояльных партнеров посредством устойчивого политического сотрудничества."
 BOS_quell_bosniaks: "Подавление боснийской оппозиции"
 BOS_quell_bosniaks_desc: "Применять принудительные меры против враждебных боснийских организаций, соглашаясь на немедленную нестабильность ради изменения партийной поддержки."
 BOS_collaboration_with_bosniaks: "Сотрудничать с боснийскими лидерами"
 BOS_collaboration_with_bosniaks_desc: "Превратить дружественных боснийских лидеров в лояльных партнеров посредством устойчивого политического сотрудничества."
 BOS_quell_croats: "Подавление хорватской оппозиции"
 BOS_quell_croats_desc: "Применять принудительные меры против враждебных хорватских организаций, допуская немедленную нестабильность для изменения партийной поддержки."
 BOS_gain_bosniak_popular_support: "Завоевать поддержку боснийского народа"
 BOS_gain_bosniak_popular_support_desc: "Финансирование информационно-просветительских и местных программ, направленных на улучшение отношения боснийцев и повышение их стабильности."
 BOS_collaboration_with_croats: "Сотрудничать с хорватскими лидерами"
 BOS_collaboration_with_croats_desc: "Превратите дружественных хорватских лидеров в лояльных партнеров посредством устойчивого политического сотрудничества."
 BOS_gain_croat_popular_support_desc: "Финансирование информационно-просветительской работы и местных программ, направленных на улучшение отношения хорватов и повышение их стабильности."
 BOS_destabilize_the_government_desc: "Намеренно подорвать доверие населения и боеготовность. При таком низком уровне стабильности и поддержки войны враждебные сербские или хорватские образования могут объявить о своей независимости."
 BOS_srpska_faction: "Сербы"
 BOS_bosniak_faction: "Боснийцы"
 BOS_croat_faction: "Хорваты"
 srpska_attitude_friendly: "§GДружественное§!"
 BOS_all_factions_at_least_friendly_trigger: "Все три составляющие группы как минимум §Gдружелюбны§!"
 bosniak_attitude_friendly: "§GДружественное§!"
 croat_attitude_friendly: "§GДружественное§!"
 BOS_anti_government_demonstrations_desc: "Многие вышли на улицы из-за наших действий. Беспорядки утихнут, как только отношение и стабильность пострадавшего народа восстановятся."
 BOS_internal_faction_balance: "Народы Боснии"
 BOS_internal_faction_balance_desc: "Баланс интересов боснийцев, хорватов и сербов в государственном аппарате определяет стабильность и вербовку кадров."
 BOS_landmine_contamination: "Загрязнение минами"
 BOS_landmine_contamination_desc: "Неразминированные минные поля военного времени в этом регионе приводят к гибели мирных жителей, ограничивают возможности заселения и делают невозможным использование плодородных земель."
 BOS_cooperator: "Боснийский кооператор"
 BOS_political_reformer: "Политический реформатор"
 BOS_presidency_rotation_cooldown: "Настала пора ротации."
 BOS_rotation_of_leaders: "Провести президентскую ротацию"
 BOS_rotation_of_leaders_desc: "Передайте председательство в коллективном Президиуме следующему представителю государствообразующих народов после окончания текущего периода ротации."
 BOS_rotation_branch_available_tt: "Один из представителей учредительных народов в настоящее время возглавляет Президиум."
 BOS_s_bridge_builder: "Боснийский строитель мостов"
 bos_croat_war_info_tool_tip: "§RПРИМЕЧАНИЕ§!\nГерцег-Босния отделится и объявит войну нам и Республике Сербской.\nНекоторые фокусы будут заблокированы до окончания гражданской войны.\nПосле окончания войны они будут разблокированы в результате события."
 bos_dodik_gains_power_2010_tt: "Милорад Додик приходит к власти примерно в 2010-2011 годах"
 bos_this_will_lock_certain_paths_within_the_focus_tree: "§RЭто заблокирует пути для некоторых частей дерева фокуса§!"
 BOS_united_nations_aid: "Помощь от международных партнеров"
 BOS_croats_declare_independence_hidden: "Восстановить послевоенные демилитаризованные зоны"
 BOS_croats_declare_independence_hidden_desc: "Восстановить демилитаризованные зоны образования, когда сепаратистский кризис не перерастет в гражданскую войну."
 bos_srpska_builds_up: "§YРеспублика Сербская§! ознакомилась с нашими действиями и начала §Rперевооружение§! всех бывших военнослужащих!"
 bos_remove_idea_tooltips: "Теперь игрок может обосновывать цели войны.\nУстранена возможность объявления краха гражданской войны."
 BOS_financial_crisis_desc: "Падение экспорта, дефицит кредитов и рост безработицы ослабляют государственные финансы Боснии. Последовательная программа восстановления может сократить продолжительность кризиса."
 BOS_treasury_higher_than_3_5_tt: "Требуется больше, чем §Y$3,5 млрд§! в казначействе."
 BOS_treasury_higher_than_4_5_tt: "Требуется больше, чем §Y$4,5 млрд§! в казначействе."
 BOS_treasury_higher_than_8_5_tt: "Требуется больше, чем §Y$8,5 млрд§! в казначействе."
 BOS_treasury_higher_than_4_3_tt: "Требуется больше, чем §Y$4,3 млрд§! в казначействе."
 BOS_treasury_higher_than_12_6_tt: "Требуется больше, чем §Y$12,6 млрд§! в казначействе."
 BOS_convene_the_federation_tt: "£decision_icon_small Решение §YСозвать Федерацию§! завершает воссоединение, как только каждое государство-преемник достигнет §Y75%§! Югоностальгии, и мы возглавляем возрождение"
 BOS_purge_quell_decisions_tt: "£decision_icon_small Решения §YПодавление боснийской оппозиции§! и §YПодавление хорватской оппозиции§! остаются доступными"
 BOS_faction_attitude_header: "Доверие"
 BOS_faction_stability_header: "Суммарный эффект"
 BOS_faction_manpower_header: "Людские ресурсы"
 BOS_faction_value_unavailable: "§gНедоступно§!"
 BOS_STABILITY_TOOLTIP: "§YСуммарный эффект§! показывает суммарные национальные модификаторы, которые в настоящее время создают составляющие группы: изменение стабильности, обусловленное их доверием, и изменение призывного населения, обусловленное их людскими ресурсами."
 BOS_net_stability_factor_display: "§YСтабильность§!: [?ROOT.BOS_internal_faction_stability_factor|%0]"
 BOS_net_manpower_factor_display: "§YПризывники§!: [?ROOT.BOS_internal_faction_manpower_factor|%0]"
 BOS_MANPOWER_TOOLTIP: "§YЛюдские ресурсы§! показывают количество новобранцев, которое может предоставить каждая составляющая группа. Совокупные значения изменяют призывное население."
 bos_no_wars_tt: "§RМы не можем объявлять войны.§!\nЕсли уровень стабильности упадет ниже 30%, а входящие в состав фракции проявят нелояльность, риск гражданской войны резко возрастет."
 bos_serbian_attitude_not_loyal_tt: "Требуется, чтобы доверие £text_icon_bos_srpska §Yсербов§! было ниже уровня §GЛояльны§!."
 bos_croat_attitude_not_loyal_tt: "Требуется, чтобы доверие £text_icon_bos_croat §Yхорватов§! было ниже уровня §GЛояльны§!."
 bos_srpska_manpower_will_rise_tt: "£text_icon_bos_srpska §YСербы:§! Людские ресурсы: [?temp_manpower_change|0+] (сейчас: [?THIS.BOS_srpska_manpower|Y0])"
 bos_bosniak_manpower_will_rise_tt: "£text_icon_bos_bosniak §YБошняки:§! Людские ресурсы: [?temp_manpower_change|0+] (сейчас: [?THIS.BOS_bosniak_manpower|Y0])"
