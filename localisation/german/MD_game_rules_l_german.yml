 MD_RULES: "Diverse Regeln"
 MD_CHEAT_RULES: "Cheat-Optionen"
 MD_RANDOM_RULES: "Zufällige Spielregeln"
 RULE_HARD_AI_ECONOMIC: "Wirtschafts-KI"
 RULE_DISABLE_HARD_AI_ECONOMIC: "Standardbeschränkung"
 RULE_DISABLE_HARD_AI_ECONOMIC_DESC: "Eine Standardeinschränkung der KI, welche ihr nicht erlaubt ihre Wirtschaft zu stärken. Für ein historisch korrektes Spiel"
 RULE_ENABLE_HARD_AI_ECONOMIC: "Keine Einschränkungen"
 RULE_ENABLE_HARD_AI_ECONOMIC_DESC: "Wenn du es leid bist, dass in jedem Spiel die KI nicht aus der Wirtschaftskrise herauskommt – das hier ist für dich. Die KI ist nicht länger in Entscheidungen über ihre Wirtschaft begrenzt. Sei darauf vorbereitet, dass viele Länder reicher werden als deines. Nur für diejenigen, die sich einer Herausforderung stellen wollen. Grüße von der \"Battle-KI\" ;)"
 RULE_AI_STARTING_POLITICAL_POWER: "Politische Macht der KI zu Beginn"
 RULE_AI_STARTING_POLITICAL_POWER_NO: "Keine politische Macht zu Beginn."
 RULE_AI_STARTING_POLITICAL_POWER_NO_DESC: "Die KI startet ohne politische Macht."
 RULE_AI_STARTING_POLITICAL_POWER_250: "250 Politische Macht"
 RULE_AI_STARTING_POLITICAL_POWER_250_DESC: "Allen KI-Nationen 250 politische Macht hinzufügen."
 RULE_AI_STARTING_POLITICAL_POWER_500: "500 Politische Macht"
 RULE_AI_STARTING_POLITICAL_POWER_500_DESC: "Allen KI-Nationen 500 politische Macht hinzufügen"
 RULE_AI_STARTING_POLITICAL_POWER_1000: "1000 Politische Macht"
 RULE_AI_STARTING_POLITICAL_POWER_1000_DESC: "Allen KI-Nationen 1.000 politische Macht hinzufügen"
 RULE_DISABLE_AI_DEBT_WAR_TITLE: "Schuldenkriege für KI"
 RULE_DISABLE_AI_DEBT_WAR: "Deaktivieren"
 RULE_DISABLE_AI_DEBT_WAR_DESC: "Dies deaktiviert die Kriegsschulden für die KI. Die KI wird keine Länder mehr angreifen, welche Ihre Schulden nicht zurückzahlen."
 RULE_ENABLE_AI_DEBT_WAR: "Aktivieren"
 RULE_ENABLE_AI_DEBT_WAR_DESC: "Diese Einstellung macht es wahrscheinlicher, dass die KI den Krieg erklärt, wenn du deine Schulden bei ihr nicht begleichst."
 RULE_ENABLE_AI_FIGHTING_AUTONOMY_FOCUS: "KI nutzt §T Erhöhung des Autonomiefokus §!"
 RULE_ENABLE_FIGHTING_AUTONOMY_FOCUS: "Aktivieren"
 RULE_ENABLE_FIGHTING_AUTONOMY_FOCUS_DESC: "Die wird deine Autonomie bekämpfen, indem sie kontinuierlich §Y Verbessere Autonomie §! nutzt."
 RULE_DISABLE_FIGHTING_AUTONOMY_FOCUS: "Deaktivieren"
 RULE_DISABLE_FIGHTING_AUTONOMY_FOCUS_DESC: "Die KI wird Ihre Autonomie nicht mehr durch den kontinuierlichen Fokus §Y Autonomie verbessern §! beeinträchtigen."
 RULE_ALLOW_CHAOTIC_PEACE_CONFERENCE: "Aktiviert chaotische Friedensverhandlungsergebnisse"
 RULE_OPTION_CHAOTIC_PC_NO: "Nein"
 RULE_OPTION_CHAOTIC_PC_NO_DESC: "Diese Option soll hoffentlich verhindern, dass alle bei KI-Friedenskonferenzen Landraub betreiben.\nDies geschieht, indem nur noch Großmächte und Fraktionsführer Staaten beanspruchen können. (Dies betrifft nur die KI, nicht den Spieler.)"
 RULE_OPTION_CHAOTIC_PC_YES: "Ja"
 RULE_OPTION_CHAOTIC_PC_YES_DESC: "Für diejenigen, die tatsächlich Spaß an den verfluchten Friedenskonferenzen haben: Warum sollte man die Welt auf 1 §Y Russland §! beschränken, wenn 12 §Y Russlands §! möglich sind!\n(Ich übernehme keine Verantwortung für die Ergebnisse, die sich aus dieser Option ergeben könnten!)"
 RULE_ALLOW_PLAYER_LED_PEACE_CONFERENCE: "Aktiviert vom Spieler geleitete Friedensverhandlungen"
 RULE_OPTION_PLAYER_LED_PC_NO: "Nein"
 RULE_OPTION_PLAYER_LED_PC_NO_DESC: "Diese Option erlaubt es der KI ihre eigenen Entscheidungen zu treffen, so dumm diese auch sein mögen."
 RULE_OPTION_PLAYER_LED_PC_YES: "Ja"
 RULE_OPTION_PLAYER_LED_PC_YES_DESC: "Für alle die der KI nicht zutrauen, das runde Teil in das runde Loch zu stecken - nur Spieler können Ansprüche während einer Friedenskonferenz anmelden."
 RULE_SALAFIST_BRANCH: "Aktiviere Salafismus"
 RULE_YES_SALAFIST_BRANCH_DESC: "Aktiviert den Salafismus als Zweig im Fokusbaum für alle Nationen, unabhängig von der Ausgangsreligion."
 RULE_NO_SALAFIST_BRANCH_DESC: "Aktiviert den Salafismus als Zweig im Fokusbaum für alle Nationen, die als Religion eine Variante des Islam haben."
 CUB_AI_BEHAVIOR: "@CUB Kuba"
 RULE_OPTION_DEMOCRAT: "Demokratisch orientiert"
 RULE_OPTION_DEMOCRAT_AI_DESC: "The §8Democratic Party§! holds the White House and the Congress and governs from the centre-left for a generation. Washington spends at home, and leads abroad through institutions rather than through force."
 RULE_OPTION_REPUBLICAN: "Republikanisch orientiert"
 RULE_OPTION_REPUBLICAN_AI_DESC: "The §8Republican Party§! holds the White House and the Congress and governs from the centre-right for a generation. Washington cuts at home, and keeps the world in order by weight of arms."
 RULE_OPTION_REFORMED_REPUBLIC: "Reformierte Republik"
 RULE_OPTION_REFORMED_REPUBLIC_AI_DESC: "Public pressure forces through the political and electoral reform that gives third parties real ballot access and real representation. The two-party lock breaks, and American government becomes a coalition problem for the first time."
 RULE_OPTION_POST_UNITED: "Ära nach den \"Vereinigten Staaten\""
 RULE_OPTION_POST_UNITED_AI_DESC: "The federal government loses its grip and the United States comes apart into the successor republics that inherit its territory. North America becomes a continent of rival American states §Rand this path cannot be combined with the historical AI rule§!."
 FIJ_AI_BEHAVIOR: "@FIJ Fiji"
 NIG_AI_BEHAVIOR: "@NIG Nigeria"
 RULE_OPTION_FRA_HISTORICAL: "Historical"
 RULE_OPTION_FRA_HISTORICAL_DESC: "The Fifth Republic holds its course as the presidency passes from Chirac to Sarkozy, then Hollande and Macron, with the §8Republicans§! and the centre trading office between them. France anchors European integration and keeps its hand on the Françafrique sphere."
 BRM_AI_BEHAVIOR: "@BRM Myanmar"
 RULE_OPTION_NORTHERN_AMBITION: "Nördliche Ambitionen"
 RULE_OPTION_NORTHERN_AMBITION_AI_DESC: "The Swedish nationalist right surges and turns northern sentiment into a programme of union. Stockholm sets out to gather Scandinavia and the Baltic under a restored Swedish empire, by treaty where it can and by force where it must."
 SYR_AI_BEHAVIOR: "@SYR Syria"
 RULE_OPTION_SYR_HISTORICAL: "Historische KI"
 RULE_OPTION_SYR_HISTORICAL_DESC: "Hafez al-Assad wird von seinem ältesten Sohn Bashar al-Assad beerbt werden. Bashar wird Syrien als ein mit Russland verbündetes Land mit einem ausgewogenen Fokus auf Diplomatie, Militär und Wirtschaft weiterführen."
 RULE_OPTION_SYR_IRON_LADY: "Eiserne Dame von Syrien"
 RULE_OPTION_SYR_IRON_LADY_DESC: "Hafez al-Assad wird von seiner Tochter Bushra al-Assad beerbt werden. Bushra wird einen neutraleren Ansatz zwischen den Großmächten verfolgen und sich dabei auf Diplomatie und Wirtschaft konzentrieren."
 RULE_OPTION_SYR_SYRIAN_SAVAGE: "Syrischer Wilder"
 RULE_OPTION_SYR_SYRIAN_SAVAGE_DESC: "Hafez al-Assad is succeeded by his youngest son Maher rather than by Bashar, and the army is handed the state outright. Syria rearms for a Greater Syria, and the Levant gets an aggressive power where it had a cautious one."
 RULE_OPTION_SYR_NEW_ASSAD: "Neuer al-Assad"
 RULE_OPTION_SYR_NEW_ASSAD_DESC: "Nach dem Damaszener Frühling wird Hafez al-Assad von seinem Bruder Rifaat al-Assad beerbt. Rifaat wird sich auf eine pro-saudische Politik konzentrieren, deren Schwerpunkt auf Diplomatie und Wirtschaft liegt."
 RULE_OPTION_SYR_DAMASCUS_SPRING: "Frühling in Damaskus"
 RULE_OPTION_SYR_DAMASCUS_SPRING_DESC: "The §8Damascus Spring§! salons are never shut down, and the reformers turn a season of debate into a change of government. Syria becomes a functioning democracy, and the Ba'athist order loses its second capital."
 BHR_AI_BEHAVIOR: "@BHR Bahrain"
 SAU_AI_BEHAVIOR: "@SAU Saudi Arabia"
 RULE_OPTION_RULE_BRITANNIA: "Herrsche Britannien"
 RULE_OPTION_RULE_BRITANNIA_AI_DESC: "The Crown's partisans break the two-party system, build their movement out of the country's decline and take power outright. The empire is restored by force, and Britain stops being Washington's junior partner."
 BOT_AI_BEHAVIOR: "@BOT Botswana"
 NKO_AI_BEHAVIOR: "@NKO North Korea"
 SIN_AI_BEHAVIOR: "@SIN Singapur"
 SIN_GLOBAL_DIPLOMACY: "Weltweite Diplomatie"
 SIN_GLOBAL_DIPLOMACY_DESC: "Singapore spends its wealth on convening rather than only on trading, and makes the island the room where Asia's rivalries are talked down. Small states get a hearing they would not otherwise have, and the great powers meet on neutral carpet."
 SIN_SINGAPORE_ALONE: "Allein Singapur"
 SIN_SINGAPORE_ALONE_DESC: "The §8People's Action Party§! governs without interruption and keeps the island's defence in its own hands, trusting no guarantee it did not pay for. Singapore stays rich, armed and unaligned, and takes nobody's side further than trade requires."
 SIN_PRESSURE_SOUTH_ASIAN_SEAS: "Druck auf die südasiatischen Meere"
 SIN_PRESSURE_SOUTH_ASIAN_SEAS_DESC: "Singapore turns its navy and its money outward and starts setting terms in the straits it depends on. Southeast Asia acquires a small power willing to police its sea lanes, and its larger neighbours notice."
 SER_AI_BEHAVIOR: "@SER Jugoslawien"
 RULE_OPTION_MILOCEVIC_COMMI: "Milosevic ist ein Kommunist"
 RULE_OPTION_MILOCEVIC_COMMI_AI_DESC: "Slobodan Milošević survives the challenge to his rule and takes the country back towards socialism rather than defending what is left of the republic. Yugoslavia is rebuilt as a socialist federation, and the Balkans have a Marxist power in them again."
 RULE_OPTION_MILOCEVIC_NATI: "Milosevic's Großserbien"
 RULE_OPTION_MILOCEVIC_NATI_AI_DESC: "Slobodan Milošević survives and turns the state to the Greater Serbia project, claiming every district where Serbs live. The Yugoslav wars are reopened rather than settled, and every neighbour with a Serb minority becomes a target."
 RULE_OPTION_MILOCEVIC_FEDERATION: "Milosevic's Balkan Federation"
 RULE_OPTION_MILOCEVIC_FEDERATION_AI_DESC: "Slobodan Milošević survives and revives the §8Balkan Federation§!, the union the region's socialists never managed to build. Belgrade offers its neighbours membership rather than conquest, and the peninsula is gathered under one roof."
 RULE_OPTION_SERBIAN_KINGDOM: "Königreich Serbien"
 RULE_OPTION_SERBIAN_KINGDOM_AI_DESC: "Milošević is overthrown and the nationalists and monarchists take the state in his place, seating the §8Karađorđević§! dynasty back in Belgrade. Serbia governs by crown and church, and pursues the same old claims by more respectable means."
 RULE_OPTION_SERBIAN_LIBERALS: "Liberal Serbia"
 RULE_OPTION_SERBIAN_LIBERALS_AI_DESC: "The reformers who brought Milošević down keep the country and rebuild it as a liberal democracy. Serbia sets its course for the European Union and settles its quarrels with its neighbours instead of nursing them."
 UKR_AI_BEHAVIOR: "@UKR Ukraine"
 UKR_VINTRENKO: "Vitrenko"
 UKR_VINTRENKO_DESC: "Nataliya Vitrenko's §8Progressive Socialist Party§! takes the country on a programme that fuses Orthodoxy, Soviet nostalgia and her own brand of women's politics. Ukraine turns hard against the West and reads the European offer as an act of hostility."
 UKR_NATIONALISTS: "Ukrainian Nationalism"
 UKR_NATIONALISTS_DESC: "The heirs of the §8Ukrainian Insurgent Army§! take power and rebuild the state around the nationalist tradition. Ukraine confronts Moscow without waiting for the West to permit it, and its Russian-speaking regions are governed rather than courted."
 UKR_DEMOCRATIC: "Demokratische Ukraine"
 UKR_DEMOCRATIC_DESC: "Ukraine holds to the pro-Western line and organises the whole state around accession to the European Union and NATO. Kyiv becomes the eastern edge of the Western bloc, and Moscow treats that as a loss it must reverse."
 UKR_COMMUNISM: "Kommunistische Ukraine"
 UKR_COMMUNISM_DESC: "The §8Communist Party of Ukraine§! wins the argument the transition left unfinished and takes the republic back. Kyiv works to reassemble the Soviet Union rather than to escape it."
 UKR_SOCIALISM: "Sozialistische Ukraine"
 UKR_SOCIALISM_DESC: "The §8Socialist Party of Ukraine§! takes power and rebuilds the country on redistribution and public ownership without reaching for the old red flag. The oligarchs lose their hold, and Kyiv keeps its distance from Brussels and Moscow alike."
 UKR_YUSHENKO: "Yushchenko"
 UKR_YUSHENKO_DESC: "The Orange camp holds the presidency behind Viktor Yushchenko and governs on rehabilitation, language and the road west. Ukraine leans on Europe and the United States, and the gas that heats it becomes a weapon in Moscow's hands."
 UKR_YANUK: "Yanukovych"
 UKR_YANUK_DESC: "Viktor Yanukovych and the §8Party of Regions§! hold the state and steer it back towards Moscow. The European agreement is left unsigned, and the country's east and west are governed as rival constituencies."
 SPR_CONSERVATIVE_LEANINGS: "Conservative Leanings"
 SPR_CONSERVATIVE_LEANINGS_DESC: "The §8People's Party§! and the wider Spanish right hold the Cortes and govern on the market-liberal, Atlanticist line. Spain stays a firm NATO member and an unadventurous partner in Brussels."
 SPR_RENACIMIENTO_NACIONALISTA: "Renacimiento Nacionalista"
 SPR_RENACIMIENTO_NACIONALISTA_DESC: "§8Vox§! and the nationalist right break out of the fringe and take the government. Spain turns against the autonomous communities and against migration, and finds itself arguing with Brussels rather than following it."
 SPR_NACION_UNIDAD_IMPERIO: "Nacion Unidad Imperio"
 SPR_NACION_UNIDAD_IMPERIO_DESC: "§8La Falange§! returns from the political wilderness and rebuilds the Spanish state on the national-syndicalist model. The Cortes gives way to the vertical syndicates, and Spain looks to its old empire rather than to Europe."
 SPR_SOCIALISM_RISING: "Socialism Rising"
 SPR_SOCIALISM_RISING_DESC: "The §8Spanish Socialist Workers' Party§! and the wider left hold power for a generation and push the welfare state further than any government before them. Spain becomes the social-democratic argument in Europe and pulls the Mediterranean along with it."
 SPR_COMMUNIST_REVISIONISM: "Communist Revisionism"
 SPR_COMMUNIST_REVISIONISM_DESC: "The §8Communist Party of Spain§! takes the state the socialists would not, and the republic is rebuilt on Marxist lines. Spain leaves the Western camp behind, and NATO loses its southern flank."
 SPR_THE_OLD_WAYS: "The Old Ways"
 SPR_THE_OLD_WAYS_DESC: "The crown and the church are put back at the centre of the state, and Spain sets about recovering the empire it lost. Gibraltar, the Maghreb and the old viceroyalties are treated as unfinished business rather than as history."
 GEO_AI_BEHAVIOR: "@GEO Georgien"
 GEO_NATIONALIST_behavior: "@GEO Nationalist's behavior"
 GEO_help_CHE_behavior: "@GEO Help for Chechens"
 GEO_2008_war_behavior: "@GEO Behavior in 2008 war"
 GEO_WILL_FOLLOW_OWN_WAY: "Eigener Weg"
 GEO_WILL_FOLLOW_OWN_WAY_DESC: "Nationalist Georgia will follow its own path and will crush Armenia and Azerbaijan"
 GEO_WILL_BE_PRO_ARMENIA: "Pro-Armenisch"
 GEO_WILL_BE_PRO_ARMENIA_DESC: "Nationalist Georgia will help Armenia to crush Azerbaijan"
 GEO_WILL_BE_PRO_AZERI: "Pro-Aserbaidschanisch"
 GEO_WILL_BE_PRO_AZERI_DESC: "Nationalist Georgia will help Azerbaijan to crush Armenia"
 GEO_WILL_HELP: "Help @CHE Chechens"
 GEO_WILL_HELP_DESC: "Georgia will help Chechens in war with Russia. They can help Georgia in the future."
 GEO_WONT_HELP: "Don't Help @CHE Chechens"
 GEO_WONT_HELP_DESC: "Georgia won't help Chechens in war with Russia. They will be hostile to Georgia."
 GEO_ATTACK_RUS: "Vorbereitungen für den Krieg"
 GEO_ATTACK_RUS_DESC: "Georgia will be prepared for the 2008 war and will try to win in the war."
 GEO_WEAKBOY: "Kompromiss mit Russland"
 GEO_WEAKBOY_DESC: "Georgia will seek a compromise with Russia to avoid battle actions."
 BLR_union_state_ai_behavior: "@BLR Union State Behavior"
 BLR_WONT_FOLLOW_UNION_STATE: "Verfolge keinen gemeinsamen Staat"
 BLR_WONT_FOLLOW_UNION_STATE_DESC: "Belarus won't form Union State and won't become a Russian puppet."
 BLR_WILL_FOLLOW_UNION_STATE: "Gründe einen gemeinsamen Staat"
 BLR_WILL_FOLLOW_UNION_STATE_DESC: "Belarus will try to form Union State. At first they will become a Russian puppet, but later..."
 PMR_sub_behavior: "@PMR Transnistria Sub-Behavior"
 PMR_PASSIVE_DEFAULT: "Wirtschaftliche Priorität"
 PMR_PASSIVE_DEFAULT_DESC: "Transnistria will focus its attention on the economic branch."
 PMR_SHERIFF: "The Sheriff Republic"
 PMR_SHERIFF_DESC: "Tiraspol lets the §8Sheriff§! holding absorb the state it was built inside, until the company's own security arm answers for the republic. Transnistria ends up governed by its largest business rather than by its parliament."
 RULE_OPTION_GER_GREEN: "The Green Chancellery"
 RULE_OPTION_GER_GREEN_DESC: "The §8Greens§! take the chancellery in their own right and spend it on the nuclear phase-out, a European green deal and progressive taxation. Germany pushes the alliance eastward and puts distance between itself and both Moscow and Beijing."
 RULE_OPTION_GER_NATIONALIST: "Rule of the National Democrats"
 RULE_OPTION_GER_NATIONALIST_DESC: "The constitutional order collapses into civil war and the §8National Democratic Party§! takes the ruins, building a one-party police state on blood, soil and expulsion. Germany turns openly irredentist and every border around it becomes a claim."
 RULE_OPTION_GER_SOCIALIST: "The Left Ascendant"
 RULE_OPTION_GER_SOCIALIST_DESC: "§8Die Linke§! takes power out of the wreckage of the Federal Republic, throws the Americans off their bases and disarms the country. Germany then presses France, Poland and Sweden into a workers' union, by force if they refuse it."
 RULE_OPTION_GER_MONARCHIST: "The Kaiser Returns"
 RULE_OPTION_GER_MONARCHIST_DESC: "The republic falls and the §8Kaiser§! is crowned again over a restored empire. Germany puts monarchs back on the Swiss, Austrian, Belgian, Ottoman and Italian thrones and gathers them into an imperial bloc."
 RULE_DISABLE_FORMABLE_NATIONS: "Deaktiviere formbare Nationen"
 RULE_YES_FORMABLE_NATIONS_DESC: "Deaktiviere Entscheidungen zu formbaren Nationen"
 RULE_NO_FORMABLE_NATIONS_DESC: "Formbare Nationen sind aktiviert"
 RULE_ALLOW_EDGY_FLAGS: "Allow Edgy Flags"
 RULE_ALLOW_EDGY_FLAGS_BLOCKED_DESC: "Keeps some of the more controversial flag options from appearing."
 RULE_ALLOW_EDGY_FLAGS_ALLOWED_DESC: "Allows more controversial flag options that would normally be censored."
 RULE_DISABLE_EU: "Deaktiviere die EU"
 RULE_YES_DISABLE_EU_DESC: "Alle Staaten werden aus der europäischen Union entfernt."
 RULE_NO_DISABLE_EU_DESC: "Die europäische Union existiert wie sie ist."
 RULE_EUROPEAN_VOTING_COOLDOWN_LIMIT: "European Union Voting Cooldown"
 RULE_OPTION_EU_SIXTY: "60 Tage"
 RULE_OPTION_EU_SIXTY_DESC: "The European Parliament and European Council voting cooldown will be set to sixty days instead of the default one hundred and eighty days."
 RULE_OPTION_EU_NINETY: "90 Tage"
 RULE_OPTION_EU_NINETY_DESC: "The European Parliament and European Council voting cooldown will be set to ninety days instead of the default one hundred and eighty days."
 RULE_OPTION_EU_ONE_HUNDRED_EIGHTY: "180 Tage"
 RULE_OPTION_EU_ONE_HUNDRED_EIGHTY_DESC: "The European Parliament and European Council voting cooldown will be set to the default one hundred and eighty days."
 RULE_OPTION_EU_TWO_HUNDRED_TEN: "210 Tage"
 RULE_OPTION_EU_TWO_HUNDRED_TEN_DESC: "The European Parliament and European Council voting cooldown will be set to two hundred and ten days instead of the default one hundred and eighty days."
 RULE_DISABLE_NATO: "NATO deaktivieren"
 RULE_YES_DISABLE_NATO_DESC: "NATO will be disabled upon loading into the game."
 RULE_NO_DISABLE_NATO_DESC: "Die NATO bleibt eine Fraktion."
 RULE_SPREAD_INFLUENCE_AMOUNT_GAIN: "Spread Influence Amount Gain"
 RULE_SPREAD_INFLUENCE_AMOUNT_GAIN_DESC: "Change the influence gained from spreading influence."
 RULE_SPREAD_INFLUENCE_GAIN_3: "3%"
 RULE_SPREAD_INFLUENCE_GAIN_3_DESC: "3% influence gained per spread action. For if you want to ramp up influence gain."
 RULE_SPREAD_INFLUENCE_GAIN_0_5: "0.5%"
 RULE_SPREAD_INFLUENCE_GAIN_0_5_DESC: "0.5% influence gained per spread action. For if you really want to slow down influence gain."
 RULE_SPREAD_INFLUENCE_GAIN_1_5: "1.5%"
 RULE_SPREAD_INFLUENCE_GAIN_1_5_DESC: "1% influence gained per spread action. The default influence gain per spread influence action."
 RULE_SPREAD_INFLUENCE_GAIN_1: "1%"
 RULE_SPREAD_INFLUENCE_GAIN_1_DESC: "1% influence gained per spread action. For if you really want to slow down influence gain."
 RULE_SPREAD_INFLUENCE_GAIN_2: "2%"
 RULE_SPREAD_INFLUENCE_GAIN_2_DESC: "2% influence gained per sprad action. For if you really want to ramp influence gain."
 RULE_SPREAD_INFLUENCE_GAIN_4: "4%"
 RULE_SPREAD_INFLUENCE_GAIN_4_DESC: "4% influence gained per spread action. For if you really want to ramp up influence gain."
 RULE_SPREAD_INFLUENCE_AMOUNT_COOLDOWN: "Spread Influence Cooldown"
 RULE_SPREAD_INFLUENCE_30_COOLDOWN: "30 Tage"
 RULE_SPREAD_INFLUENCE_30_COOLDOWN_DESC: "The default cooldown. Once every 30 days, you can spread your influence to another nation."
 RULE_SPREAD_INFLUENCE_14_COOLDOWN: "14 Tage"
 RULE_SPREAD_INFLUENCE_14_COOLDOWN_DESC: "Once every 14 days, you can spread your influence to another nation."
 RULE_SPREAD_INFLUENCE_0_COOLDOWN: "Kein Cooldown"
 RULE_SPREAD_INFLUENCE_0_COOLDOWN_DESC: "No cooldown for spreading influence, for when you want to dump all your §HPolitical Power§! into influencing other nations!"
 RULE_SPREAD_INFLUENCE_60_COOLDOWN: "60 Tage"
 RULE_SPREAD_INFLUENCE_60_COOLDOWN_DESC: "Once every 60 days, you can spread your influence to another nation."
 RULE_INVEST_INFLUENCE_AMOUNT_GAIN: "Investment Influence Gain"
 RULE_INVEST_DEFAULT_GAIN_1: "1%"
 RULE_INVEST_DEFAULT_GAIN_1_DESC: "1% influence gained whenever someone accepts your investments."
 RULE_INVEST_DEFAULT_GAIN_0_5: "0.5%"
 RULE_INVEST_DEFAULT_GAIN_0_5_DESC: "0.5% influence gained whenever someone accepts your investments."
 RULE_INVEST_DEFAULT_GAIN_2: "2%"
 RULE_INVEST_DEFAULT_GAIN_2_DESC: "2% influence gained whenever someone accepts your investments."
 RULE_INFLUENCE_COOLDOWN: "Investment Influence Gain Cooldown"
 RULE_14_DAY_INFLUENCE: "14 Tage Cooldown"
 RULE_14_DAY_INFLUENCE_DESC: "The default option. The cooldown for influence gained from investing is 14 days or 2 weeks. This applies to the nation for all possible investment opportunities. Though you can still invest, you will not gain any influence in this timeframe."
 RULE_0_DAY_INFLUENCE: "Kein Cooldown"
 RULE_0_DAY_INFLUENCE_DESC: "Old school MD influence gained from the investment time limit. You can invest as often as you like whilst still gaining influence, not recommended for those who enjoy balance!"
 RULE_30_DAY_INFLUENCE: "30 Tage Cooldown"
 RULE_30_DAY_INFLUENCE_DESC: "The suggested multiplayer option. The cooldown for influence gained from investing is 30 days or roughly 1 month. This applies to the nation for all possible investment opportunities. Though you can still invest, you will not gain any influence in this timeframe."
 RULE_MONTHLY_DOMESTIC_INFLUENCE_TICK: "Enable Monthly §YDomestic Independence§! Growth Tick"
 RULE_MONTHLY_DOMESTIC_INFLUENCE_TICK_NO_DESC: "Disables the Monthly §YDomestic Independence§! Growth Tick."
 RULE_MONTHLY_DOMESTIC_INFLUENCE_TICK_YES_DESC: "Enables the Monthly §YDomestic Independence§! Growth Tick. Every month §YDomestic Independence§! will grow by the value set in the game rule \"Monthly §YDomestic Independence§! Growth Tick\" which is set to default to 0.10% per month."
 RULE_MONTHLY_DOMESTIC_INFLUENCE_GAIN_AMOUNT: "Monthly §YDomestic Independence§! Growth Tick Amount"
 RULE_MONTHLY_DOMESTIC_INFLUENCE_GAIN_AMOUNT_05: "0.05%"
 RULE_MONTHLY_DOMESTIC_INFLUENCE_GAIN_AMOUNT_05_DESC: "Each month §YDomestic Independence§! increases by 0.05% as long as the Monthly §YDomestic Independence§! Growth Tick is enabled."
