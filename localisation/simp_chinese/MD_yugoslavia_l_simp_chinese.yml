l_simp_chinese:
 yugo_nost_overview: "@SLV [SLV.GetName] §Y[?SLV.yugo_nostalgia|0]%§!\n@CRO [CRO.GetName] §Y[?CRO.yugo_nostalgia|0]%§!\n@BOS [BOS.GetName] §Y[?BOS.yugo_nostalgia|0]%§!\n@SER [SER.GetName] §Y[?SER.yugo_nostalgia|0]%§!\n@FYR [FYR.GetName] §Y[?FYR.yugo_nostalgia|0]%§!\n@MNT [MNT.GetName] §Y[?MNT.yugo_nostalgia|0]%§!\n@KOS [KOS.GetName] §Y[?KOS.yugo_nostalgia|0]%§!"
 yugo_nost_rise_tt: "§Y+[?temp_yugo_nost_gain|0]§! 南斯拉夫在[THIS.GetFlag][THIS.GetName]"
 yugo_consensus_tt: "每个幸存的继承国都至少有75%的人怀有南​​斯拉夫怀旧情结。"
 yugo_nost_ser_ready_tt: "@SER [SER.GetName]南斯拉夫情结超过75%"
 yugo_dominant_tt: "我们在前南斯拉夫各加盟共和国中拥有最大的影响力，并领导着南斯拉夫复兴运动。"
 yugo_dominant_none: "没有主导成员"
 yugo_sends_invites_tt: "向所有剩余的前南斯拉夫国家发出邀请，组建新的联邦。"
 yugo_invite_accept_tt: "响应国并入重建后的南斯拉夫联邦。"
 yugo_invite_reject_tt: "回应国保持独立，联邦因此获得了针对该国的统一战争目标。"
 yugoslavia.1.t: "邀请参加南斯拉夫"
 yugoslavia.1.d: "[FROM.GetName]邀请我们加入重建后的南斯拉夫联邦。接受邀请意味着加入，而拒绝邀请则可能使其统一运动反过来对我们不利。"
 yugoslavia.1.a: "加入联邦"
 yugoslavia.1.b: "拒绝统一"
 yugoslavia.30.t: "一个国家变成南斯拉夫"
 yugoslavia.30.d: "支持恢复南斯拉夫联邦的民众已超过四分之三。这个在上世纪90年代被埋没的想法，如今在这里再次成为一个鲜活的政治议题。"
 yugoslavia.30.a: "梦想长存"
 yugoslavia_news.20.t: "南斯拉夫复兴运动的新领导人"
 yugoslavia_news.20.d: "重建南斯拉夫的努力有了新的重心。§Y[GetYugoDominantName]§!当前在前共和国中拥有最大的影响力，最适合召集联邦会议。"
 yugoslavia_news.20.a: "我们将继续这场运动"
 yugoslavia_news.20.b: "密切关注巴尔干半岛局势"
 formed_yugoslavia: "南斯拉夫的荣耀"
 formed_yugoslavia_desc: "恢复后的联邦承担起了整合前南斯拉夫各共和国的领土、机构和组成民族的责任。"
 yugoslavia_restored: "南斯拉夫"
 yugo_bloc_dominant: "南斯拉夫复兴运动的领袖"
 yugo_bloc_dominant_desc: "我们在前共和国中的影响力超过任何其他继承国。我们的首都是就重建联邦进行谈判的天然会晤地点。"
 yugo_bloc: "南斯拉夫统一"
 yugo_bloc_desc: "在所有幸存的继承国中，支持恢复南斯拉夫的呼声必须达到75%，统一进程才能继续进行。在原共和国中最具影响力的国家引领了复兴：§Y[GetYugoDominantName]§!。\n\n$yugo_nost_overview$"
 yugo_bloc_map: "南斯拉夫统一"
 yugo_promote_nostalgia: "在[FROM.GetName]推崇南斯拉夫情结"
 yugo_promote_nostalgia_desc: "资助文化交流、共享媒体和联合纪念活动，以争取对恢复联邦的支持。这需要对目标国施加实质性影响。"
 yugo_promote_own_nostalgia: "在家培养南斯拉夫怀旧情结"
 yugo_promote_own_nostalgia_desc: "资助国内纪念活动、学校课程和公共媒体，为旧联邦提供有利的信息。比在国外宣传怀旧情绪更慢、成本更高，但它不需要在另一个国家立足。"
 yugo_form_federation: "召集联邦"
 yugo_form_federation_desc: "召集所有幸存的继承国加入重建后的南斯拉夫联邦。拒绝加入的国家将使联邦面临统一战争的目标。只有占主导地位的成员国才能召开谈判，而且只有在所有继承国都支持重新统一的情况下才能进行。"
 news.85.t: "南斯拉夫复国"
 news.85.desc: "在各前加盟共和国的支持下，一个重建的南斯拉夫联邦正式宣布成立。新成立的南斯拉夫联邦声称，上世纪90年代瓦解的原南斯拉夫联邦的政治和战略遗产得以保留。"
 news.85.a: "一个巴尔干国家回归"
 yugoslavia_not_restored_tt: "南斯拉夫§R尚未§!由另一个继承国复辟。"