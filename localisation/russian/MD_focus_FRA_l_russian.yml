 france_md.509.t: "Введение в ЭКО"
 france_md.509.d: "Франция предложила заменить франк КФА на ЭКО — новую единую валюту для Западной Африки. Ее принятие предоставит нам большую денежную автономию и укрепит связи с Францией."
 france_md.509.a: "Примите экологический подход."
 france_md.509.b: "Отклонить предложение"
 FRA_airbus_change: "В 2014 году компания Eurocopter была переименована в Airbus Helicopters."
 FRA_naval_takeover: "В 2017 году компания DCNS была переименована в Naval Group."
