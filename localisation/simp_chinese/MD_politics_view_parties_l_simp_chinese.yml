 PER.conservatism_Novin_desc: "（亲民主保守主义）- 伊朗新党\n\n伊朗新党是伊朗帝国穆罕默德·礼萨·巴列维统治下的保皇派国家政党。伊朗新党致力于瓦解伊斯兰共和国的制度，并倡导经济和文化自由主义。"
 PUK.Autocracy: "£KUR_Autocracy_small 库尔德斯坦爱国联盟 - 寡头派"
 PUK.Autocracy_icon: "£KUR_Autocracy_small"
 PUK.Autocracy_desc: "专制主义 - 库尔德斯坦爱国联盟是一个融合的库尔德政党，作为一个更左翼的替代政党而成立，仍然反对库尔德民主党强大的巴尔扎尼家族的统治。库尔德自治区内战结束后，它有效控制了伊拉克库尔德斯坦南部，并仍然控制着大批佩什梅加部队。在库尔德人彻底独立的问题上，它比库尔德民主党更加务实，并且随着库尔德民主党与伊朗关系的降温，它加强了与伊朗的关系。"
 PUK.neutral_Social: "£KUR_oligarchism_small 库尔德斯坦爱国联盟"
 PUK.neutral_Social_desc: "库尔德斯坦爱国联盟是一个融合的库尔德政党，作为一个更左翼的替代政党而成立，仍然反对库尔德民主党强大的巴尔扎尼家族的统治。库尔德自治区内战结束后，它有效控制了伊拉克库尔德斯坦南部，并仍然控制着大批佩什梅加部队。在库尔德人彻底独立的问题上，它比库尔德民主党更加务实，并且随着库尔德民主党与伊朗关系的降温，它加强了与伊朗的关系。"
 IEK.Neutral_Muslim_Brotherhood: "£AFG_salafist_jihadism 库尔德斯坦伊斯兰运动"
 IEK.Neutral_Muslim_Brotherhood_icon: "£AFG_salafist_jihadism"
 IEK.Neutral_Muslim_Brotherhood_desc: ""
 SIN.Nat_Populism: "£SIN_conservatism 人民行动党 - §Y民族主义派系§!"
 SIN.Nat_Populism_desc: "人民行动党自1950年代后期以来一直在新加坡执政。它被许多人视为美化的寡头政治，但也为新加坡的经济繁荣做出了贡献。 人民行动党制定的政策在本质上通常是保守的，同时拒绝任何真正西方的标签。\n\n§Y民族主义派系§!属于强硬的优先考虑国内利益的右翼分子，并且毫不犹豫地与他认为的敌人对抗。"
 SIN.Nat_Populism_icon: "£SIN_conservatism"
 HOL.Nat_Populism2006: "£HOL_nationalist_right_wing_populist2006 (PVV) - 自由党"
 HOL.Nat_Populism2006_icon: "£HOL_nationalist_right_wing_populist2006"
 HOL.Nat_Populism2006_desc: "(右翼民粹主义) - 自由党。自由党由海尔特·维尔德斯于2006年离开自由民主人民党后创立。该党主张严格限制移民，强烈反对政治伊斯兰，并重申荷兰国家主权。自由党反对更深层次的欧盟一体化，呼吁加强边境管控，并加强对国家立法的控制。维尔德斯的对抗性风格和对文化保护的重视为自由党赢得了稳固的选民基础，使其成为荷兰最具影响力的民粹主义运动之一，并始终对荷兰政治建制派构成挑战。"
 BOL.Neutral_Libertarian: "£BOL_western_liberal (UCS) - 团结公民联盟"
 BOL.Neutral_Libertarian_icon: "£BOL_western_liberal"
 BOL.Neutral_Libertarian_desc: "（民粹保守主义）- 团结公民联盟\n\n团结公民联盟是费尔南德斯酿酒家族的政党，由大亨马克斯·费尔南德斯创立，并由其子、圣克鲁斯市市长约翰尼·费尔南德斯领导。该党主张亲市场务实主义，注重就业和公共工程，而非意识形态。它以国会选票换取政府部门，曾加入雨果·班泽尔的超级联盟，后于2020年加入“我们相信”联盟。\n\n它亲西方，是拉丁美洲政党联盟的成员。它的影响力在于啤酒厂的薪资和人脉、圣克鲁斯市政府，以及在大党团需要选票时扮演“造王者”的角色。"
 BOL.Nat_Populism: "£generic_Nat_Populism_small (Creemos) - 我们相信"
 BOL.Nat_Populism_desc: "（右翼民粹主义）- 我们相信\n\n“我们相信”联盟以路易斯·费尔南多·卡马乔为核心组建。卡马乔是公民委员会主席，领导了2019年的抗议活动，并于2021年当选圣克鲁斯省省长，后因该危机于2022年被捕。该联盟主张极端保守价值观、地区自治、经济自由主义和基督教民族主义，其目标直指争取社会主义运动党。联盟通过街头动员和其领导人的个人影响力开展活动。该联盟由团结公民联盟和基督教民主党共同创立，于2022年签署了《马德里之声宪章》，并于2025年加入团结联盟。\n\n它亲西方，与拉丁美洲的极右势力关系密切。它的影响力来自于圣克鲁斯州州长、公民委员会和低地商业精英。"
 BOL.Nat_Fascism: "£BOL_Nat_Fascism (UJC) - 圣克鲁斯青年联盟"
 BOL.Nat_Fascism_icon: "£BOL_Nat_Fascism"
 BOL.Nat_Fascism_desc: "（新法西斯主义，圣克鲁斯民族主义）- 圣克鲁斯青年联盟\n\n圣克鲁斯青年联盟是“支持圣克鲁斯公民委员会”的突击力量，该委员会由长枪党创立，至今仍要求其成员效忠长枪党。该联盟主张圣克鲁斯民族主义、低地自治以及捍卫东部精英阶层免受拉巴斯和原住民左翼势力的侵害。从2008年的自治公投到2019年和2022年的罢工，该联盟一直通过恐吓和强制公民罢工来达到目的。人权组织称其为准军事组织。\n\n它反共、信奉天主教，并且敌视争取社会主义运动党。它的优势在于其纪律严明的干部队伍和公民委员会的保护。"
 IRQ.Western_Autocracy: "£generic_Western_Autocracy_small (CPA)联军临时管理当局"
 IRQ.Western_Autocracy_desc: "（亲西方占领者）- 联军临时管理当局是多国联军入侵伊拉克后建立的伊拉克过渡政府。"
 PER.Neutral_Autocracy2: "£PER_Neutral_Autocracy (UMI) - 联合国驻伊朗代表团"
 LAT.Western_Autocracy_icon: "£LAT_western_autocracy"
 LAT.Western_Autocracy_alt: "£LAT_western_autocracy_alt (RP)  - 改革党"
 LAT.Western_Autocracy_alt_icon: "£LAT_western_autocracy_alt"
 LAT.Western_Autocracy_alt_desc: "（自由保守主义） - 改革党\n\n改革党是由瓦尔迪斯·扎特勒斯创立的自由主义政党。改革党主张打击腐败和寡头对国家的影响，并反对与所谓的“寡头政党”合作。"
 LAT.Western_Autocracy_alty: "£LAT_western_autocracy_alty (LRA)  - 拉脱维亚地区协会"
 LAT.Western_Autocracy_alty_icon: "£LAT_western_autocracy_alty"
 LAT.Western_Autocracy_alty_desc: "(地区利益) - 拉脱维亚地区协会\n\n拉脱维亚地区协会最初是由多个地区性政党组成的联盟，旨在参与议会选举，后来合并为一个单一政党，并赋予其地区分支机构广泛的自治权。该党倡导可持续和公平的经济发展，并支持地方自治。"
 LAT.Western_Autocracy_altyn: "£LAT_western_autocracy_altyn (KPV) -  谁拥有这个国家？"
 LAT.Western_Autocracy_altyn_icon: "£LAT_western_autocracy_altyn"
 LAT.Western_Autocracy_altyn_desc: "(民粹主义) - 谁拥有这个国家？\n\n谁拥有这个国家是一个由阿图斯·凯明什创立的民粹主义政党。该党反对腐败和精英主义，倡导传统价值观、国家透明度和社会保障。"
 LAT.Western_Autocracy_altynu: "£LAT_western_autocracy_altynu (PCL)  - 为了一个充满人道的拉脱维亚"
 LAT.Western_Autocracy_altynu_icon: "£LAT_western_autocracy_altynu"
 LAT.Western_Autocracy_altynu_desc: "(民粹主义) - 为了一个充满人道的拉脱维亚\n\n为了一个充满人道的拉脱维亚被描述为右翼民粹主义、民粹主义、情绪民粹主义、反建制主义和疑欧主义。"
 LAT.conservatism_icon: "£LAT_western_conservative"
 LAT.conservatism_alt: "£LAT_western_conservative_alt (V) -  团结"
 LAT.conservatism_alt_icon: "£LAT_western_conservative_alt"
 LAT.conservatism_alt_desc: "(保守自由主义) - 团结党\n\n团结党是一个自由保守主义政党，最初是由包括新时代党在内的几个政党组成的选举联盟。该党主张财政保守主义和亲欧外交政策，并且是欧洲人民党的成员。"
 LAT.conservatism_alty: "£LAT_western_conservative_alty (JV)  - 新团结党"
 LAT.conservatism_alty_icon: "£LAT_western_conservative_alty"
 LAT.conservatism_alty_desc: "(保守自由主义) - 新团结党\n\n新团结党是一个自由保守主义联盟，以团结党为基础，该党由许多政治纲领相似的地区性政党组成。该联盟倡导财政保守主义和亲欧外交政策，并且是欧洲人民党的成员。"
 LAT.liberalism_icon: "£LAT_western_liberal"
 LAT.liberalism_alt: "£LAT_western_liberal_alt (LPP/LC)  - 拉脱维亚第一党/拉脱维亚道路"
 LAT.liberalism_alt_icon: "£LAT_western_liberal_alt"
 LAT.liberalism_alt_desc: "(大帐篷) - 拉脱维亚第一党/拉脱维亚道路\n\n拉脱维亚第一党/拉脱维亚道路是拉脱维亚第一党和拉脱维亚道路党组成的自由主义联盟。该联盟倡导民主化和个人权利，但两党分别加入不同的组织，拉脱维亚道路党加入欧洲自由民主联盟，拉脱维亚第一党加入欧洲人民党。"
 LAT.liberalism_alty: "£LAT_western_liberal_alty (LA)  - 为了拉脱维亚的发展"
 LAT.liberalism_alty_icon: "£LAT_western_liberal_alty"
 LAT.liberalism_alty_desc: "(古典自由主义) - 为了拉脱维亚的发展\n\n为了拉脱维亚的发展是一个古典自由主义政党，由颇受欢迎的政治家埃纳尔斯·雷普舍创立。该党支持自由市场、法治和个人权利，同时也是欧洲自由民主联盟党的成员。"
 LAT.socialism_icon: "£LAT_western_social"
 LAT.socialism_alt: "£LAT_western_social_alt (PRO) -  进步党"
 LAT.socialism_alt_icon: "£LAT_western_social_alt"
 LAT.socialism_alt_desc: "(北欧模式) - 进步党\n\n进步党是一个进步政党，由同名非营利组织发展而来。进步党倡导在拉脱维亚推行北欧模式，并建立性别配额制度。该党还倡导绿色环保举措，主张放缓经济增长速度，以促进社会和性别平等，并提升拉脱维亚在西方组织中的地位。进步党也是欧洲绿党的成员。"
 LAT.anarchist_communism_icon: "£LAT_anarchist_communism"
 LAT.anarchist_communism_alt: "£LAT_anarchist_communism_alt (TKL) -  拉脱维亚人民公仆"
 LAT.anarchist_communism_alt_icon: "£LAT_anarchist_communism_alt"
 LAT.anarchist_communism_alt_desc: "(工团主义经济) - 拉脱维亚人民公仆\n\n拉脱维亚人民公仆是由几个亲俄左翼政党合并而成。该党主张在拉脱维亚建立工团主义经济，并支持扩大社会援助。"
 LAT.Conservative: "£LAT_conservative (PCTVL)  - 为了统一拉脱维亚的人权"
 LAT.Conservative_icon: "£LAT_conservative"
 LAT.Conservative_desc: "(俄罗斯少数族裔利益) - 为了统一拉脱维亚的人权\n\n为了统一拉脱维亚的人权是由多个亲俄政党组成的选举联盟，主张维护非公民，特别是俄罗斯族人的权利。因此，为了统一拉脱维亚的人权在俄语人口中享有很高的声望。该党主张拉脱维亚所有民族平等，废除非公民制度，并推动国家退出西方组织。"
 LAT.Conservative_alt: "£LAT_conservative_alt (LKS)  - 拉脱维亚俄罗斯联盟"
 LAT.Conservative_alt_icon: "£LAT_conservative_alt"
 LAT.Conservative_alt_desc: "(俄罗斯少数族裔利益) - 拉脱维亚俄罗斯联盟\n\n拉脱维亚俄罗斯联盟是由多个亲俄政党组成的选举联盟，主张维护非公民，特别是俄罗斯族人的权利。因此，拉脱维亚俄罗斯联盟在俄语人口中享有很高的声望。该党主张拉脱维亚所有民族平等，废除非公民制度，并推动国家退出西方组织。"
 LAT.Autocracy: "£LAT_autocracy (RP) -  行动党"
 LAT.Autocracy_icon: "£LAT_autocracy"
 LAT.Autocracy_desc: "(亲俄的欧洲怀疑主义) - 行动党\n\n行动党是一个疑欧派政党，反对拉脱维亚加入西方组织，并支持拉脱维亚与俄罗斯关系缓和。该党成立之初支持左翼观点，但随着时间的推移，其立场逐渐右倾；该党还支持废除非公民身份，并支持俄罗斯的政治决策。"
 LAT.Neutral_Autocracy_alt: "£LAT_neutral_autocracy_alt (LZS)  - 拉脱维亚农民联盟"
 LAT.Neutral_Autocracy_alt_icon: "£LAT_neutral_autocracy_alt"
 LAT.Neutral_Autocracy_alt_desc: "(农业保守主义) - 拉脱维亚农民联盟\n\n拉脱维亚农民联盟是拉脱维亚历史最悠久的政党之一，成立于1917年独立战争期间。该党曾是最具影响力的保守派运动之一，但在独裁政权建立后被取缔。苏联解体后，一些团体返回拉脱维亚，声称继承了该党的遗产，最终合并为一个统一的拉脱维亚农民联盟。该党奉行中间路线，但其成员也经常发表相当保守和民族主义的言论。"
 LAT.Neutral_conservatism_icon: "£LAT_neutral_conservative"
 LAT.Neutral_conservatism_alt: "£LAT_neutral_conservative_alt (KDS) -  基督教民主联盟"
 LAT.Neutral_conservatism_alt_icon: "£LAT_neutral_conservative_alt"
 LAT.Neutral_conservatism_alt_desc: "(民族保守主义) - 基督教民主联盟\n\n基督教民主联盟成立于1991年，是一个奉行基督教民主理念的政党。在许多方面，该党以德国基督教民主联盟的纲领为基础。基督教民主联盟也支持基础设施建设和基督教价值观，并且是欧洲基督教政治运动的成员。"
 LAT.Neutral_conservatism_alty: "£LAT_neutral_conservative_alty (JKP)  - 新保守党"
 LAT.Neutral_conservatism_alty_icon: "£LAT_neutral_conservative_alty"
 LAT.Neutral_conservatism_alty_desc: "(保守主义) - 新保守党\n\n新保守党是一个奉行反腐败纲领的保守政党。该党曾多次参与选举，成绩不一，但在市政层面拥有相当的实力。"
 LAT.Neutral_conservatism_altyn: "£LAT_neutral_conservative_altyn (AS)  - 联合名单"
 LAT.Neutral_conservatism_altyn_icon: "£LAT_neutral_conservative_altyn"
 LAT.Neutral_conservatism_altyn_desc: "(地区主义) - 联合名单\n\n联合名单是由多个地区性和主要政党组成的选举联盟，奉行保守主义纲领。它主张区域均衡发展，支持拉脱维亚建国，但该党因支持已被定罪的寡头艾瓦尔斯·伦贝格斯担任总理而闻名。"
 LAT.oligarchism_icon: "£LAT_oligarchism"
 LAT.oligarchism_alt: "£LAT_oligarchism_alt (AL)  - 拉脱维亚的觉醒"
 LAT.oligarchism_alt_icon: "£LAT_oligarchism_alt"
 LAT.oligarchism_alt_desc: "(社会保守主义) - 拉脱维亚的觉醒\n\n拉脱维亚的觉醒是由前审计员英古娜·苏德拉巴创立的政党。拉脱维亚的觉醒奉行标准的保守主义纲领，并倡导公平的工资和养老金。该党也因其与寡头的密切联系和不透明的资金来源而闻名。"
 LAT.oligarchism_alty: "£LAT_oligarchism_alty (ST!)  - 为了稳定!"
 LAT.oligarchism_alty_icon: "£LAT_oligarchism_alty"
 LAT.oligarchism_alty_desc: "(俄罗斯少数族裔利益) - 为了稳定!\n\n为了稳定!是一个民粹主义政党，由里加议会前议员于2021年创立。该党自称中间派，反对与新冠疫情相关的限制措施。为了稳定!也支持俄罗斯少数族裔的利益。"
 LAT.oligarchism_altyn: "£LAT_oligarchism_altyn (VPG)  - 21世纪全拉脱维亚党"
 LAT.oligarchism_altyn_icon: "£LAT_oligarchism_altyn"
 LAT.oligarchism_altyn_desc: "(社会保守主义) - 21世纪全拉脱维亚党\n\n21世纪全拉脱维亚党成立于2005年，奉行保守主义理念。该党自称代表拉脱维亚多数民众，支持基督教传统价值观。21世纪全拉脱维亚党还主张国家摆脱西方体制的束缚，并与亲俄政党合作。"
 LAT.Neutral_Libertarian_icon: "£LAT_neutral_libertarian"
 LAT.Neutral_Libertarian_alt: "£LAT_neutral_libertarian_alt (VL)  - 团结支持拉脱维亚"
 LAT.Neutral_Libertarian_alt_icon: "£LAT_neutral_libertarian_alt"
 LAT.Neutral_Libertarian_alt_desc: "(古典自由主义) - 团结支持拉脱维亚\n\n团结支持拉脱维亚是由著名政治家兼寡头艾纳尔斯·什莱瑟斯创立的自由主义政党。该党主张经济自由主义，不拒绝与亲俄政党合作，但支持拉脱维亚加入西方组织。"
 LAT.neutral_Social_icon: "£LAT_neutral_socialism"
 LAT.neutral_Social_alt: "£LAT_neutral_socialism_alt (\"Saskaņa\")  - 社会民主党“和谐”"
 LAT.neutral_Social_alt_desc: "(社会民主主义) - 社会民主党“和谐”\n\n“和谐”党是代表俄罗斯少数族裔利益的最大政党。该党以“和谐”选举联盟为基础成立，该联盟囊括了众多亲俄左翼政党。该党支持社会民主政策，并维护非公民的权利。"
 LAT.Nat_Populism_icon: "£LAT_national_populist"
 LAT.Nat_Populism_alt: "£LAT_national_populist_alt (NA)  - 国民联盟"
 LAT.Nat_Populism_alt_icon: "£LAT_national_populist_alt"
 LAT.Nat_Populism_alt_desc: "(民族保守主义) - 国民联盟 \"一切为了拉脱维亚！\" - \"为了祖国与自由党/拉脱维亚民族独立运动\"\n\n国民联盟是拉脱维亚最大的民族主义政党，由“一切为了拉脱维亚！”和“为了祖国与自由党/拉脱维亚民族独立运动”党组成选举联盟。该党奉行民族主义立场，支持建立单一民族的拉脱维亚，并主张进一步放松经济管制，支持拉脱维亚加入西方组织。"
 LAT.Nat_Fascism: "£LAT_national_fascism (NST)  - 全国正义联盟"
 LAT.Nat_Fascism_icon: "£LAT_national_fascism"
 LAT.Nat_Fascism_desc: "(极端民族主义) - 全国正义联盟\n\n全国正义联盟是一个极端民族主义政党，主张拉脱维亚民族的专属权。该党支持者以尊崇“森林兄弟”和二战期间为德国作战的拉脱维亚军人而闻名。此外，该党还因其反对同性恋骄傲游行和苏联纪念碑的行动而臭名昭著。"
 LAT.Nat_Autocracy_icon: "£LAT_military_junta"
 LAT.Monarchist: "£LAT_monarchism (KMK)  - 库尔兰贵族会议"
 LAT.Monarchist_icon: "£LAT_monarchism"
 LBA.Caliphate_reform: "£LBA_Caliphate (LIM) - 利比亚伊斯兰运动"
 LBA.Caliphate_reform_desc: "（萨拉菲圣战主义） - 利比亚伊斯兰运动\n\n利比亚伊斯兰运动是利比亚伊斯兰战斗组织的更名版本。该运动声称正在寻求更民主的方式来实现其目标，但其许多武装人员仍然与基地组织有关联。"
 LBA.Nat_Autocracy_rebels: "£generic_Nat_Autocracy_small (NLA) - 民族解放军"
 LBA.Nat_Autocracy_rebels_desc: "（军政府） - 民族解放军\n\n利比亚自由共和国民族解放军，正式名称为“利比亚自由共和国民族解放武装力量”，是由各民兵、武装分子、武装团体和革命者组成的联合体，在全国过渡委员会的领导下共同作战。该组织最初名为“利比亚自由军”，但很快更名，以彰显其日益增强的专业化。然而，尽管采取了更为专业的策略，派系斗争和内讧依然普遍存在，这支军队未来的发展走向仍有待观察。"
 LBA.Nat_Autocracy_LNA: "£generic_Nat_Autocracy_small (LNA) - 利比亚国民军"
 LBA.Nat_Autocracy_LNA_desc: "（军政府） - 利比亚国民军\n\n利比亚国民军由民族解放军组建而成，后者在内战期间是全国过渡委员会的武装力量。利比亚国民军的任务是将国内各派民兵整合为一支统一的部队，并重建一支非卡扎菲主义的专业军队。"
 LAT.neutral_Social_alt_icon: "£LAT_neutral_socialism_alt"
 CZE.Monarchist: "£CZE_Monarchism 捷克君主党"
 CZE.Monarchist_icon: "£CZE_Monarchism"
 CZE.Monarchist_desc: "捷克君主党是捷克共和国的一个小型政党，主张恢复该国的君主立宪制。该党成立于1990年天鹅绒革命之后，此后一直致力于恢复君主制，认为君主制将为捷克政治体制带来稳定性和延续性。该党还倡导传统价值观和文化遗产，并致力于提升捷克共和国在欧洲和世界舞台上的地位。"
 PHI.conservatism_icon: "£PHI_conservatism"
 PHI.liberalism_icon: "£PHI_liberalism"
