l_simp_chinese:
 france_focus: "法国国策树"
 FRA_state_of_french_politics: "政治现状"
 FRA_state_of_french_politics_desc: "法国的政治地位在世界上既引人注目又动荡不安。长期以来，法兰西第五共和国一直保持着稳定的局面，政权在社会主义阵营和保守派阵营之间轮换。但随着我们迈入新千年，局势变得愈发扑朔迷离。一些政党正在崛起，而另一些政党则走向衰落；没有人能够预知未来几年将走向何方。"
 FRA_nationalism_in_europe: "民族主义的兴起"
 FRA_nationalism_in_europe_desc: "法国波拿巴派的胜利似乎正在鼓舞欧洲各国的民族主义者更加积极地参与政治。虽然这种势头或许能让我们更好地抵御与外国的冲突，但这些煽动者在和平时期的行为却是一个不容忽视的问题。"
 FRA_economic_policy: "贝尔西议程"
 FRA_economic_policy_desc: "贝尔西掌控着财政部和法国国家统计与经济研究所的统计人员，所有经手一分钱的部门最终都要向他负责。法国在全球经济体中排名第五，这一排名并非取决于经济规模，而是取决于政策。"
 FRA_free_market: "进入单一市场"
 FRA_free_market_desc: "单一市场已经将价格制定权从财政部手中夺走，让我们的出口商能够按照自己的条件展开竞争。法国电信和法国航空公司已经私有化。现在要做的就是开放其余市场，让贸易主动找上门来。"
 FRA_total_sa: "道达尔公司"
 FRA_total_sa_desc: "道达尔收购了比利时石油财务公司和埃尔夫·阿基坦，成为全球最大的石油生产商之一，拥有拉克气田和帕伦蒂斯油井，其工程运营由位于波城的CSTJF中心负责。阿基坦地区的石油储量仍然远超大型石油公司目前开采的水平。如果能按照共和国的条件建立合作关系，就能让这些石油为我们服务。"
 FRA_french_economic_intervention: "控制"
 FRA_french_economic_intervention_desc: "科尔伯特开创了先例：政府挑选关键产业，并扶持领军企业运营。规划委员会制定方向，各部委则坐享其成。现有工厂将被大力推广，无论这会对新工厂的审批流程造成何种影响。"
 FRA_reduction_in_taxes: "削减企业税"
 FRA_reduction_in_taxes_desc: "职业税针对的是机器设备和厂房，也就是说，正是我们声称想要的投资。加上社会保险缴款，法国承担着欧洲最沉重的强制性税负之一。削减这项税收应该能让国库和工资里多出些钱。"
 FRA_deregulation: "阿塔利委员会"
 FRA_deregulation_desc: "由雅克·阿塔利担任主席的“法国增长解放委员会”指出，现行规则的束缚最为严苛：商业区划、受保护职业、耗时数年的审批流程。取消这些限制将为规划者此前放弃发展的地区开辟新的道路。工会方面会将委员会的每一条规定都视为威胁。"
 FRA_state_stock_in_sa: "黄金股"
 FRA_state_stock_in_sa_desc: "黄金股和通过国家投资局持有的股权赋予共和国一项任何股东大会都无法撼动的投票权。产量、出口合同和加油站价格都由我们掌控。"
 FRA_paris_employment_projects: "大巴黎工厂"
 FRA_paris_employment_projects_desc: "塞纳-圣但尼省至今仍未恢复失去的工作，而几站之外的拉德芳斯高楼林立。大巴黎地区的工程可以利用这部分差额：法兰西岛大区内的工地、合同和工资支出。"
 FRA_nationalization_of_steel: "收回优基诺"
 FRA_nationalization_of_steel_desc: "优基诺-萨西洛尔公司拥有洛林盆地以及福斯河畔和弗洛朗日的钢铁厂，它对股东而非共和国负责。一旦造船厂和坦克工厂依赖钢铁，钢铁就不再是一种商品。将钢铁厂收归国有，工会会欢欣鼓舞，而董事会则会怒不可遏。"
 FRA_private_contracting: "与大型企业签订合同"
 FRA_private_contracting_desc: "布依格、万西和艾法日将竞标合作合同，在这种合同中，承包商自行定价并保留利润。工地完工速度远超任何政府部门的管理能力，而我们则为此支付溢价。"
 FRA_tapping_resources: "布里尼奥尔和萨劳"
 FRA_tapping_resources_desc: "布里尼奥尔和莱博附近的普罗旺斯铝土矿为加尔丹的氧化铝厂提供原料，而萨劳的阿里埃日河下仍然蕴藏着钨矿。由于进口成本更低，这些矿藏被废弃。重新开采这些矿藏，意味着我们能够从购买合金转向自行生产。"
 FRA_offshore_oilrigs: "圭亚那海事许可证"
 FRA_offshore_oilrigs_desc: "库鲁附近的扎伊迪乌斯油田勘探结果证明，圭亚那海事区块深水区蕴藏石油。许可证已在我们手中，我们可以随时授予钻井平台，钻井平台一年内即可投入使用。圭亚那和苏里南都声称拥有同一片海域的主权，并且会对此大声疾呼。"
 FRA_state_run_construction: "国家主导的公共工程"
 FRA_state_run_construction_desc: "在公共项目所有权模式下，政府部门决定价格、工期和人员编制，承包商不从中抽取任何利润。这种弊端屡见不鲜：资金不足的项目一旦获得批准，施工人员就会闲置一整个施工季。"
 FRA_infrastructure_projects: "国家区域规划合同"
 FRA_infrastructure_projects_desc: "国家政府与各地方议会协商达成的规划合同，将共同出资建设道路、铁路和网络，这些项目是任何一个地方议会都无法单独承担的。高速公路复兴计划和区域规划办公室的相关文件已经准备就绪。"
 FRA_decentralization: "权力下放第二幕"
 FRA_decentralization_desc: "宪法可以明确规定共和国的组织形式是权力下放的。权力和用于支付这些权力的税收从地方长官下放到地区议会，决策在问题实际发生的地方做出。巴黎的财政收入比以往要少得多。"
 FRA_centralization: "雅各宾国家"
 FRA_centralization_desc: "雅各宾派传统认为，一个共和国意味着一个政府，而地方长官团的存在正是为了维护这一原则。每一笔地方开支最终都要送回贝尔西签署。这耗费了大量的人力物力，但也造就了一个唯命是从的国家。"
 FRA_french_healthcare: "社会保障制度"
 FRA_french_healthcare_desc: "社会保障制度覆盖所有人，世界卫生组织将其评为全球第一。无论共和国在其他方面争论不休，没有人发起运动要求废除这项制度。将医疗预算提高到与已承诺的数额相符，可以安抚国内民众，但这并非易事。"
 FRA_french_arms_industries: "军备总局"
 FRA_french_arms_industries_desc: "法国军备总局负责制定需求并向奈克斯特、达索、泰雷兹、法国海军集团、MBDA和赛峰集团等公司支付款项。正因如此，法国才能在无需征得任何人的许可的情况下设计战斗机、护卫舰和导弹。"
 FRA_research_and_dev_projects: "法国国家科学研究中心和法国原子能委员会"
 FRA_research_and_dev_projects_desc: "法国国家科学研究中心和原子能委员会是法国科学的支柱，而科研税收抵免政策则吸引了私人资金的投入。竞争力集群将大学与周边产业紧密联系起来。这项法案最终纳入教育预算。"
 FRA_reformed_universal_healthcare: "全民医疗保障"
 FRA_reformed_universal_healthcare_desc: "全民医疗保障取代了以往按收入比例发放的零散医疗服务，保障范围不再取决于就业，而是取决于居住地。民众健康状况改善，社会氛围也更加宁静，但代价是政府部门无人愿意推行这项改革。偏远农村地区仍然有一些地方完全没有医生，而按服务量付费的医院也没有理由开设诊所。"
 FRA_nexter: "奈克斯特系统"
 FRA_nexter_desc: "GIAT工业公司（后更名为奈克斯特）生产勒克莱尔主战坦克、凯撒车载榴弹炮和VBCI装甲车。设计部门位于巴黎郊外的萨托里，组装部门位于罗阿讷。这两个厂址都拥有我们从未付清全部费用的产能。"
 FRA_dassault: "达索航空"
 FRA_dassault_desc: "达索航空生产阵风战斗机和幻影2000战斗机，以及用于补贴其生产的猎鹰公务机，还有接下来的神经元验证机。最终组装在波尔多郊外的梅利尼亚克进行，并得到法国南部-比利牛斯山脉航空航天产业集群的支持。"
 FRA_thales_group: "泰雷兹和海军集团"
 FRA_thales_group_desc: "汤姆逊-CSF公司已更名为泰雷兹公司，为欧洲多用途护卫舰和“戴高乐”号航空母舰提供雷达和作战系统。舰体由圣纳泽尔的造船厂和瑟堡的潜艇船厂建造。维持所有这些设施的正常运转是业内最昂贵的投入。"
 FRA_usa_fra_collaboration: "赛峰-通用电气合作关系"
 FRA_usa_fra_collaboration_desc: "赛峰集团和通用电气合资成立的CFM国际公司，将法国发动机置于美国公司的掌控之下，并向双方支付了丰厚的报酬。法国国家空间研究中心的仪器已经应用于NASA的任务中。未来，这种合作模式还有拓展空间，可以延伸到其背后的实验室。"
 FRA_french_armed_forces: "法国武装部队"
 FRA_french_armed_forces_desc: "在法国历史的大部分时期，法国武装部队一直是我们国家无比自豪的源泉。从当年为捍卫法国国王而与英国人作战的军队，到曾效力于拿破仑麾下的将士，军队始终是我们区别于其他国家的最有力证明之一。"
 FRA_the_french_army: "陆军"
 FRA_the_french_army_desc: "法国陆军是我国武装部队三大核心军种之一。我国陆军的功绩广为传颂。我们应当继续尊重和扩充军队，以推动国家进一步发展。"
 FRA_the_french_air_force: "空军"
 FRA_the_french_air_force_desc: "我们的空军是世界上历史最悠久的空军之一。法国空军的第一支部队成立于1909年，当时是法国陆军的一个飞行中队。如今，它已成为一支独立的空军，并向世界出口世界上最优秀的空军力量之一。"
 FRA_french_navy: "法国海军"
 FRA_french_navy_desc: "法国海军助力我们在全球范围内实现抱负和愿望。它帮助建立了世界上规模最大的殖民帝国之一，足以与西班牙和英国相媲美。投资法国海军将使我们能够进一步拓展海外业务。"
 FRA_amx_leclerc: "AMX 勒克莱尔"
 FRA_amx_leclerc_desc: "AMX勒克莱尔及其后续型号是法国军队的主力坦克。它像大多数现代坦克一样，坚固耐用且性能全面。加大对它们的研发投入可以增强我们的装甲部队实力。"
 FRA_network_centric_warfare: "网络中心战"
 FRA_network_centric_warfare_desc: "我们应该像美国和其他欧洲大国一样，投资于技术更先进的战争方法，摆脱对人力的依赖，开始更多地依赖技术。这种改变将代价高昂，但最终将挽救更多法国人的生命。"
 FRA_land_air_coordination: "陆空协同"
 FRA_land_air_coordination_desc: "陆空协同对任何联合特遣部队行动都至关重要。没有地面部队，我们就无法推进前线；没有空中力量，我们就无法指望有效的火力支援。因此，我们应该推动空中战争和地面战争更好地协同。"
 FRA_the_mirage: "幻影"
 FRA_the_mirage_desc: "幻影已成为法国空军的标志性战斗机之一。世界上还有9个国家/地区使用它，也被很多国家进口。"
 FRA_maritime_fighters: "海上战斗机"
 FRA_maritime_fighters_desc: "空军和海军的共同进步需要更高效的海上战斗机。"
 FRA_lafayette_class: "隐形轻型护卫舰"
 FRA_lafayette_class_desc: "隐形轻型护卫舰于20世纪80年代末设计，旨在取代老旧的驱逐舰。这些舰艇轻巧、用途广泛，非常适合在法国舰队中执行防御任务。"
 FRA_de_gaulle_class: "戴高乐级"
 FRA_de_gaulle_class_desc: "戴高乐级航空母舰是法国海军服役的第十艘航空母舰，也是美国海军之外唯一一艘核动力航空母舰，这使其成为一艘强大而坚固的航母。"
 FRA_amx_10: "AMX-10"
 FRA_amx_10_desc: "AMX-10是法国陆军的轻型侦察坦克。在足够理想的地形上，AMX的速度能达到令人印象深刻的85km/h。毋庸置疑，AMX很快。"
 FRA_vbci: "VBCI"
 FRA_vbci_desc: "VBCI步兵坦克是为了取代老旧的AMX-10P而研发的，于2008年投入使用。VBCI进行了多项改进，包括最高时速可达100公里/小时，比速度飞快的AMX坦克更快。然而，VBCI为了追求更轻的武器装备和更高的速度，牺牲了主炮。"
 FRA_forward_air_bases: "前线空军基地"
 FRA_forward_air_bases_desc: "为了应对各类突发事件，我们必须建立前方空军基地，以确保正确制定进攻或防御计划。"
 FRA_mirage_2000d: "幻影 2000D"
 FRA_mirage_2000d_desc: "幻影2000D是一款中规中矩的攻击机，自问世以来一直忠实地为我们服务。追求更先进的战机只会是对幻影战机辉煌历史的最好致敬。"
 FRA_carrier_fighters: "阵风海军型"
 FRA_carrier_fighters_desc: "“阵风”海军型是普通阵风战斗机的航母型。它拥有与陆基变体类似的构造。总体而言，该战斗机是海上战斗机中的怪物。"
 FRA_med_naval_bases: "地中海海军基地"
 FRA_med_naval_bases_desc: "科西嘉岛的海军基地应不断完善。它与大陆分离，防御上又是一体的。"
 FRA_triomphant_class: "凯旋级"
 FRA_triomphant_class_desc: "凯旋级潜艇的建造是为了取代早期的潜艇，现在已成为核威慑力量远洋分支的基础部分。"
 FRA_ifv_investment: "75式投资"
 FRA_ifv_investment_desc: "投资更好的步兵战车和其他类型的轻型装甲车辆应该能够帮助我们提升军事实力和经济水平！"
 FRA_national_arms_exports: "国家武器出口"
 FRA_national_arms_exports_desc: "法国已成为国防工业的主要参与者，我们应该继续沿着这条道路走下去。"
 FRA_the_space_program: "太空计划"
 FRA_the_space_program_desc: "太空是一个全新的领域，而且最近我们已经证明，我们可以从太空学到很多宝贵的知识！重塑人们对我们太空计划的信心是值得的。"
 FRA_floreal_class: "花月级"
 FRA_floreal_class_desc: "花月级代表了法国舰队中的大多数轻型护卫舰。花月级及其后继型号是现役舰艇，可进行多用途战斗，如反舰，海军陆战队支援，防空和适度的反潜战。"
 FRA_laredoubtable_class: "可畏级"
 FRA_laredoubtable_class_desc: "可畏级潜艇是法国海军现役最老的潜艇之一。然而，它们的重要性不容置疑，因为它们在法国的核威慑海军战略中起着至关重要的作用。"
 FRA_honour_and_fidelity: "荣耀与忠诚"
 FRA_honour_and_fidelity_desc: "法国外籍军团的座右铭与我们国家的价值观非常契合。军队尤其体现了这些价值观：在工作中恪守荣誉，并对法兰西祖国保持永不磨灭的忠诚。"
 FRA_cnes_budgeting: "国家空间研究中心预算"
 FRA_cnes_budgeting_desc: "国家空间研究中心是法国航空航天的支撑。 我们应该为他们留出预算，以便我们继续推动这一新领域并保持竞争力。"
 FRA_international_space_research: "国际空间站倡议"
 FRA_international_space_research_desc: "我们应该与美国等其他国家合作，推动这一边疆！"
 FRA_kourou_launch_pad: "库鲁发射台"
 FRA_kourou_launch_pad_desc: "法属圭亚那的库鲁既是发射基地所在地，也是我们直接控制的领土。我们也可以利用这个优越的地理位置与其他太空机构进行交流。"
 FRA_french_space: "法国的太空"
 FRA_french_space_desc: "主导太空对我们的资源和收益尤为重要。"
 FRA_francosphere: "法语圈"
 FRA_francosphere_desc: "自二战结束以来，法国一直奉行新殖民主义政策。虽然法国并未直接占领这些国家的领土，但它却扮演着幕后操纵者的角色，为己谋利。然而，随着21世纪的到来，许多国家都希望减少对巴黎领导地位的依赖。因此，法国现在也应该采取相应的行动了。"
 FRA_francafrique: "法语"
 FRA_francafrique_desc: "非洲曾是我们前殖民帝国的重要支柱之一。前法兰西非洲各国必须继续追随我们的脚步，迈入新世纪。我们应该探索帮助他们并维持我们对该地区影响力的最佳途径。"
 FRA_faction_the_paris_accord: "巴黎协定"
 FRA_house_of_bonaparte_crowned: "波拿巴上台"
 FRA_a_peaceful_rise_flag: "和平外交政策"
 France_news.99.t1: "吾王归来"
 France_news.99.t2: "吾皇归来"
 France_news.99.d1: "波旁王室已返回由祖先路易十四建造的凡尔赛宫，再次君临法兰西。\n\n国王[FRA.GetLeader]承诺将为法国和世界开启一个崭新而辉煌的时代。“法国的合法统治者和西欧的保护者已经回归其应有的地位。”这是他演讲的结尾语 - 此番言论立即遭到其他欧洲领导人和法国共和党人的批评，他们认为这番话带有沙文主义色彩，且过于自以为是。"
 France_news.99.d2: "自封的皇帝拿破仑一世·波拿巴（1769-1821）的后代，“波拿巴皇室”已返回凡尔赛。拿破仑（及其后裔）在法国一直很受欢迎，但在国外却不那么受欢迎——不论贵族平民。\n\n德国，英国，意大利和俄罗斯的领导人对最近成为法国皇帝的[FRA.GetLeader]的最近的侵略性言辞进行了质疑。法国的新统治者几乎没有盟友。\n\n法国与新的统治系统一起，揭开了新的旗帜：与旧旗帜类似，但红色在左，这是对法国大革命的呼唤。第一帝国后的一段时间也有了类似的旗帜。"
 France_news.99.o1: "吾王万岁！"
 France_news.99.o2: "吾皇万岁!"
 France_news.99.o3: "哦，好吧。"
 france_md.11.t: "法美太空合作"
 france_md.11.d: "法国国家空间研究中心的领导层已与我们联系，探讨扩大NASA与法国国家空间研究中心之间合作的可能性。他们认为，太空蕴藏着丰富的知识，两大航天项目的资源整合将使双方都受益匪浅。拟议的协议指出，双方将各自出资100亿美元，以加强科学合作。"
 france_md.11.a: "物有所值"
 france_md.11.b: "不"
 FRA_french_space_decision_category: "法国航天计划和法国国家空间研究中心"
 FRA_french_space_decision_category_desc: "太空：最后的边疆。如果我们想继续在世界眼中保持强国地位，就必须认真地开始征服这片边疆，但这需要付出巨大的代价。由于我们无法确定大规模太空计划能否带来任何实际的经济效益，法国人民必须始终坚信这是一项值得投入的事业！\n§R（如果我们的太空计划热情降至35以下，太空计划将流产！）§!此外，由于公众对§Y国家空间研究中心§!不感兴趣，我们的§Y太空计划热情§!每周都会下降§Y0.1§!\n\n\n我们的太空计划热情目前为：[?FRA.FRA_peoples_support|+50.0]\n每周来自§Y太空行动§!的收入为：[?FRA.FRA_space_income_var|+3]B"
 FRA_run_support_campaigns_short: "发起短期公共支持宣传造势"
 FRA_run_support_campaigns_short_desc: "如果我们的顶尖科学家才刚刚开始揭开太空中的科学奇迹，那么我们的人民一定对整个过程感到非常困惑。一个简短的社交媒体活动应该会给我们一些支持！"
 FRA_run_support_campaigns_long: "发起长期公共支持宣传造势"
 FRA_run_support_campaigns_long_desc: "如果我们的顶尖科学家才刚刚解锁太空中的科学奇迹，那么人民则肯定无法理解我们的意图。一场详尽的太空计划教育应该能让人民坚定地支持我们。"
 FRA_launch_commercial_satellite: "发射商业卫星"
 FRA_launch_commercial_satellite_desc: "如今信息时代蓬勃发展，各大私营公司争相发射卫星。允许其中一些公司从我们的设施发射卫星，应该能带来可观的经济效益。但是，请注意，民众可能会对我们这种以商业为导向的项目感到厌倦！"
 FRA_prep_international_space_station: "准备国际空间站发射项目"
 FRA_prep_international_space_station_desc: "虽然这是一项全球性成就和举措，但我们可以准备将​​我们的补给火箭连同我们的人员一起送往国际空间站。"
 FRA_french_iss_launch: "法国-国际空间站发射项目"
 FRA_french_iss_launch_desc: "经过数月的规划和准备，我们的补给航天飞机任务已准备就绪。三。二。一。升空！"
 FRA_french_space_TT: "§R该国策的效果将在适当的时候显现出来。§!"
 FRA_international_space_nasa_TT: "§G这笔交易需要美国和法国共同出资10B§!"
 fra_has_enough_space_support_tt: "我们有足够的§Y太空计划热情§!进行此操作。"
 FRA_idea_the_francosphere: "法语圈"
 FRA_idea_the_francosphere_desc: "法语圈是法语民族和国家组成的政治和全球共同体。它是一个帮助法国向前殖民地施加影响力的机制，但它仍然是法语国家之间的合作。"
 FRA_idea_french_armored_production: "法国装甲车辆"
 FRA_idea_central_decentral: "官僚体制改革"
 FRA_idea_the_french_military: "改革后的军队"
 FRA_idea_the_french_military_desc: "多年来，我们放任军队陷入混乱，如今终于下定决心改革老化的军队。现在，我们可以进一步强调，法国既是一个不容小觑的国家，也是一个值得结交的国家！"
 FRA_idea_reformed_cnes: "改革国家空间研究中心"
 FRA_idea_cnes_failing: "国家空间研究中心预算不足"
 FRA_idea_prep_the_launch: "准备发射"
 FRA_idea_space_research: "空间研究"
 FRA_idea_nasa_partnership: "法美太空合作"
 FRA_the_french_agriculture: "欧洲粮仓"
 FRA_the_french_agriculture_desc: "法国是欧盟最大的农业生产国，也是共同农业政策的最大受益国。法国国家农业、食品和环境协会代表着农民的利益，而巴黎农展会则是政客们公开露面的场所。肥沃的土壤是一项战略资产，理应得到妥善的管理。"
 FRA_the_vineyard_industries: "原产地命名制度"
 FRA_the_vineyard_industries_desc: "正是由法国国家原产地命名管理局监管的原产地命名制度，才使得波尔多、勃艮第和香槟与海外所有仿制品区别开来。酩悦轩尼诗将这一成果销往全球各个市场。任何广告预算都无法换来如此卓越的声誉。"
 FRA_the_dairy_industry: "拉克塔利斯和合作社"
 FRA_the_dairy_industry_desc: "拉克塔利斯和达能从索迪亚尔合作社以及诺曼底和汝拉地区的牧场采购牛奶。孔泰奶酪和卡门贝尔奶酪拥有受保护的名称，而未供应给奶酪制造商的牛奶则被制成奶粉、酸奶和婴儿配方奶粉，销往世界各地。"
 FRA_wheat_industry: "博斯的小麦"
 FRA_wheat_industry_desc: "博斯平原是法国的粮仓，其收成通过铁路运往鲁昂——欧洲最大的粮食出口港。北非和近东各地的买家都依赖这些货物的到来，这种影响力是任何大使馆都无法比拟的。"
 FRA_mechanized_agriculture: "农机合作社"
 FRA_mechanized_agriculture_desc: "共享农机合作社让那些原本无力直接购买联合收割机和打捆机的农场也能用得起这些设备。萨弗恩的库恩农机具、马尼图的搬运车和卫星导航收割机已经投入使用。这些设备背后的工程技术值得在国内进行研发。"
 FRA_packaging_industries: "西德尔和维拉利亚"
 FRA_packaging_industries_desc: "西德尔在诺曼底建造食品行业赖以运转的灌装和包装生产线，而从圣戈班剥离出来的维拉利亚则供应玻璃。在法国制造且可回收的包装确保了价值链不会止步于国界。"
 FRA_agriculture_industry: "农业食品巨头"
 FRA_agriculture_industry_desc: "达能、拉克塔利斯、贝尔和邦杜尔等公司将收成转化为品牌出口产品，这些产品在任何市场都能保持价格。满足自身粮食需求是底线，出售剩余产品才是收益。"
 FRA_improved_railways: "法国铁路网"
 FRA_improved_railways_desc: "法国铁路网公司拥有法国国家铁路公司所有线路下方的铁轨，因此，铁路网的建设由国家决定。阿尔斯通的信号系统和新建高速铁路线路的勘测工作，是下一代铁路网络建设的关键所在。"
 FRA_focus_on_rails: "贝尔福特铁路车辆"
 FRA_focus_on_rails_desc: "阿尔斯通在贝尔福生产机车，在拉罗谢尔生产车厢，在克雷斯潘生产干线双层高速列车和区域列车。目前的订单保证了这些厂房的正常运转和车辆的持续生产。"
 FRA_high_speed_rail_lines: "欧洲轻轨"
 FRA_high_speed_rail_lines_desc: "通往斯特拉斯堡和莱茵河的高速铁路向东延伸，将我们的铁路网络覆盖到德国境内，而大力士高速列车和欧洲之星列车则通过英吉利海峡隧道连接德国。世界铁路速度纪录保持者正是法国的铁路线。因此，铁路网络的版图不应止步于国界线。"
 FRA_luxury_goods: "酩悦·轩尼诗-路易·威登和开云集团"
 FRA_luxury_goods_desc: "酩悦·轩尼诗-路易·威登、开云集团、爱马仕和香奈儿主导着一个国外无人能及的行业，而科尔伯特委员会则守护着其背后的精湛工艺。旺多姆广场和蒙田大道本身就是极具吸引力的地标。这些品牌扎根巴黎，它们的总部也应如此。"
 FRA_tourism_industry: "法国旅游发展署"
 FRA_tourism_industry_desc: "法国旅游发展署致力于推广世界上游客最多的国家，而实际的旅游收入也印证了这一点。卢浮宫、埃菲尔铁塔和巴黎迪士尼乐园吸引的游客数量已经远远超出了城市的承受能力，当地居民也开始公开表达不满。"
 FRA_the_gorgeous_coasts: "海岸保护协会"
 FRA_the_gorgeous_coasts_desc: "海岸保护协会在海岸线被开发建设之前将其收购，范围从诺曼底的花海岸到科西嘉岛的悬崖、蔚蓝海岸以及卢瓦尔河地区的大西洋海滩。这些海岸线的开发利用，减轻了城市的压力。"
 FRA_the_spaces_between: "法国乡村"
 FRA_the_spaces_between_desc: "普瓦捷郊外的未来世界电影节证明，内陆地区的场地也能吸引数百万游客。利穆赞高原、兰斯的葡萄园和大教堂以及萨瓦的阿尔卑斯山度假胜地也具备同样的吸引力，而且没有拥挤之感。它们所缺乏的是交通连接，而那些被铁路遗弃的村庄不会永远等待下去。"
 FRA_beaches_of_france: "从多维尔到比亚里茨"
 FRA_beaches_of_france_desc: "诺曼底的登陆海滩、比亚里茨的冲浪海岸和奥帕尔海岸的广阔沙滩吸引着那些从未踏足巴黎的游客。无论季节和地区如何，全年都有雇佣需求，而且没有人对此感到不满。"
 FRA_energy_sector: "梅斯默计划"
 FRA_energy_sector_desc: "梅斯默计划在罗讷河、莱茵河和英吉利海峡沿岸建造了反应堆，如今法国四分之三的电网都使用核裂变能源。法国电力公司、法马通公司和法国原子能委员会负责建造和运营这些反应堆。法国的电价不受任何外国垄断集团的控制。"
 FRA_renewable_investments: "罗讷河水坝"
 FRA_renewable_investments_desc: "罗讷河国家电力公司运营着沿河一系列水坝，包括位于其上游的塞尔蓬松水坝和阿尔卑斯山抽水蓄能电站，以及横跨奥弗涅地区的特吕耶尔水坝。朗斯河上的潮汐发电站早在人们称之为可再生能源之前就已经开始运转。无论燃料市场如何波动，水流依然源源不断地涌入。"
 FRA_solar_investments: "中部太阳能"
 FRA_solar_investments_desc: "普罗旺斯阳光地带和罗纳河下游河谷的日照条件令北方地区艳羡不已，法国电力可再生能源公司已在那里兴建太阳能发电厂。奥德伊洛的太阳能发电厂早在太阳能电池板普及之前就已验证了其物理原理。它造价昂贵，但取之不尽用之不竭。"
 FRA_wind_investments: "特拉蒙塔纳走廊"
 FRA_wind_investments_desc: "北部平原风力资源丰富，从地平线延伸至地平线，大西洋风电场的机舱则在圣纳泽尔和勒阿弗尔组装。奥德河下游的山风驱动着法国第一批风力涡轮机，并在几十年前就证明了这一点。风力资源无需成本，而且永不停歇。"
 FRA_the_northern_reactors: "绍兹反应堆"
 FRA_the_northern_reactors_desc: "绍兹核电站的反应堆位于阿登地区的默兹河畔，诺让核电站则位于下游的塞纳河畔，两座核电站都从跨越国界的河流中抽取冷却水。两座完全升级的机组将保障北方电网未来一代人的供电。布鲁塞尔和柏林一旦得知计划，必将提出抗议。"
 FRA_improved_nuclear_waste_management: "拉阿格和布雷"
 FRA_improved_nuclear_waste_management_desc: "拉阿格核电站将乏燃料再处理成混合氧化物，马尔库尔核电站处理无法再利用的乏燃料，而布雷深层处置库正在挖掘中，用于处置剩余部分。浪费是反对者最擅长的论点，因此也是我们必须回应的论点。"
 FRA_expanded_enrichment_facilities: "乔治·贝塞二世"
 FRA_expanded_enrichment_facilities_desc: "位于特里卡斯坦核电站的乔治·贝塞二世反应堆采用离心机浓缩技术，取代了以往耗能相当于一座反应堆的扩散车间。在国内进行浓缩意味着燃料不再依赖外国供应商。"
 FRA_the_new_energy_dawn: "欧洲之光"
 FRA_the_new_energy_dawn_desc: "这些互联线路将多余的电力输送到英国、意大利、西班牙和德国，而法国则是欧洲大陆最大的电力净出口国。我们的邻国为我们自己的电网不需要的电力买单。"
 FRA_honour_homeland_valour_discipline: "荣誉、祖国、价值、纪律"
 FRA_honour_homeland_valour_discipline_desc: "法国海军的座右铭不仅仅表达了在军队服役的意义。我们的人民与祖国融为一体，充满荣誉感和勇气，并以勇气和纪律约束着他们。"
 FRA_the_levant_problem: "黎凡特问题"
 FRA_the_levant_problem_desc: "黎凡特是法语圈中经常被忽视的地区。该地区曾为法兰西帝国提供宝贵的粮食、水果和石油。"
 FRA_antagonize_syria: "激怒叙利亚"
 FRA_antagonize_syria_desc: "在阿萨德政权的统治下，叙利亚做出了太多错误的决定。我们应该破坏该政权的稳定，引导叙利亚走向我们的意识形态，并推翻独裁者。"
 FRA_supporting_armenia: "支持亚美尼亚"
 FRA_supporting_armenia_desc: "亚美尼亚虽然是法语世界的新成员，但它仍然是我们的战略盟友。这个国家的困境与我们自身的困境有很多相似之处，我们必须支持亚美尼亚在卡拉巴赫的斗争。"
 FRA_anti_assad_regime_message: "反阿萨德政权讯息"
 FRA_anti_assad_regime_message_desc: "尽管我们一直以来都对叙利亚抱有敌意，但现在是时候表明我们的立场，不再拐弯抹角地表达我们的真实想法了。阿萨德家族领导下的叙利亚局势每况愈下，我们必须继续公开表达我们对阿萨德家族的蔑视。"
 FRA_escalation_from_the_damascus_spring: "大马士革之春事件升级"
 FRA_escalation_from_the_damascus_spring_desc: "大马士革之春已全面展开。现在，我们继续支持叙利亚和整个中东地区的民主运动至关重要。"
 FRA_collaboration_with_the_fsa: "与叙利亚叛军合作"
 FRA_collaboration_with_the_fsa_desc: "叛军需要大量资源来对抗阿萨德。我们应该研究我们的选择，以及我们能为带领叙利亚前进的组织提供什么。"
 FRA_oil_and_gas_investments: "石油和天然气投资"
 FRA_oil_and_gas_investments_desc: "黎凡特地区尤其拥有大量石油和天然气储量。向该地区的石油和天然气行业投入资源和人力将永远有利。"
 FRA_reminder_of_the_taif_agreement: "塔伊夫协议的提醒"
 FRA_reminder_of_the_taif_agreement_desc: "《塔伊夫协议》（正式名称为《民族和解协议》）的达成标志着黎巴嫩内战的结束，并旨在恢复正常秩序。我们必须提醒黎巴嫩和中东各国铭记《塔伊夫协议》，并努力终结真主党。"
 FRA_root_out_hezbollah: "铲除真主党"
 FRA_root_out_hezbollah_desc: "真主党是对黎巴嫩、塔伊夫协议和该地区和平的直接侮辱。铲除真主党是帮助建立中东和平的第一步。"
 FRA_agriculture_works_in_the_levant: "黎凡特的农业工作"
 FRA_agriculture_works_in_the_levant_desc: "在黎凡特地区开展各种不同的农业投资是值得的。与大多数外国对该地区的看法相反，该地区具有巨大的发展潜力。黎凡特郁郁葱葱的海岸或叙利亚的河谷可以种植许多农作物。我们应该探索在该地区的投资，帮助挖掘黎凡特的农业潜力。"
 FRA_francophone_solidarity: "法语国家团结"
 FRA_francophone_solidarity_desc: "这项倡议旨在向法语国家推广法语文化和法国价值观。该倡议包括为低收入国家提供更多教育机会，并为发展中国家提供经济支持，希望它们能够巩固并发展自非殖民化以来所保持的地位。尤其是在非洲国家，法国积极参与支持非洲国家间的伙伴关系，以维持其影响力并创造丰厚收益。"
 FRA_continue_cold_war_mentality: "延续冷战思维"
 FRA_continue_cold_war_mentality_desc: "许多公众和国际社会人士认为，我们作为全球强国的地位正在衰落。我们必须不惜一切代价维护我们作为全球领先国家的地位。回到过去的做法在国际上不会受欢迎，但必须采取行动。批评之声终将平息。"
 FRA_NEPAD_development: "非洲发展新伙伴关系的发展"
 FRA_NEPAD_development_desc: "非洲发展新伙伴关系是由非洲联盟与欧盟、中国、日本和其他八国集团成员国共同制定的经济发展计划。我们对非洲发展新伙伴关系的发展尤为关注，并已成为欧盟在资金和政治上支持该计划的主要力量。我们应该着眼于扩大非洲发展新伙伴关系的发展范围，并增加对该计划的资金和支持，以惠及整个非洲。"
 FRA_CFA_Reforms: "非洲金融共同体法郎改革"
 FRA_CFA_Reforms_desc: "解决非洲金融共同体问题是我们最关注的问题之一。随着影响力日渐式微，我们被迫进行改革以维持新殖民帝国的存续。我们的一些改革旨在增强银行体系的自主权，简化货币资金的使用，并加强外汇管制。"
 FRA_introduce_the_eco: "引入埃科"
 FRA_introduce_the_eco_desc: "我们必须摆脱对西非法郎的控制，消除前殖民地对我们的依赖。埃科是拟议的新货币，它应该能够赋予西非各国一定程度的经济自主权，并促进采用该货币的新国家之间的合作。我们应该支持他们创建新的共同货币的努力，并争取说服所有前法属非洲国家使用这种新货币。"
 FRA_unrestricted_subjugation: "无限制征服"
 FRA_unrestricted_subjugation_desc: "我们过去的行为只有剥削和掠夺。但现在我们应该重新审视这一立场，重新思考我们的外交策略，进入治理和控制的新阶段。这个选择不会受欢迎，但它完全符合一个国家的利益及其全球地位。"
 FRA_intervention_in_africa: "法非干涉主义"
 FRA_intervention_in_africa_desc: "我们的前殖民地需要援助。现在是时候让我们进一步推行干预该地区的政策，并在需要的地方提供军事援助。"
 FRA_sahel_region: "萨赫勒地区"
 FRA_sahel_region_desc: "萨赫勒地区蕴藏着丰富的采矿和资源开采潜力，也是法国地缘政治布局和企业利益的重要前沿阵地。随着新千年极端主义的抬头，我们必须采取行动，保障法国在该地区的资产和公民安全。圣战叛乱正在萨赫勒地区蔓延，威胁着我们在该地区的利益。我们必须主动出击，不惜一切代价捍卫自身地位，根除这一威胁。"
 FRA_afrique_centrale: "中央非洲"
 FRA_afrique_centrale_desc: "非洲中部地区是非洲的心脏和灵魂，拥有无数自然奇观和丰富的资源和潜力，其中许多尚未开发。"
 FRA_CAR_intervention: "红蝴蝶行动"
 FRA_CAR_intervention_desc: "红蝴蝶行动是拟议的对中非共和国内战的行动和干预的绰号。"
 FRA_operation_artemis: "阿尔忒弥斯行动"
 FRA_operation_artemis_desc: "第二次刚果战争如火如荼地进行，乌干达军队撤出后，法国和其他欧洲国家主导对该国东部地区进行自主干预。这标志着欧盟外交和军事联合行动的重大转折。"
 FRA_resources_prospects: "资源前景"
 FRA_resources_prospects_desc: "撒哈拉以南非洲地区自然资源丰富，法国企业已在当地建立了许多合作伙伴关系，并从中获益。随着对这些资源的需求不断增长，我们必须主动出击，投资海外资产，以巩固并深化我们的市场地位。"
 FRA_oef_hoa: "持久自由行动 - 非洲之角"
 FRA_oef_hoa_desc: "索马里内战已经持续太久了。我们必须代表索马里政府进行干预，帮助他们收复饱受战火蹂躏的国家，并协助索马里政府努力稳定国家局势。"
 FRA_operation_licorne: "独角兽行动"
 FRA_operation_licorne_desc: "独角兽行动是法国维和部队的代号，该部队被派往科特迪瓦，以应对科特迪瓦新生力量与科特迪瓦武装部队之间的内战。"
 FRA_the_second_ivory_coast_civil_war: "第二次科特迪瓦内战"
 FRA_the_second_ivory_coast_civil_war_desc: "第二次科特迪瓦内战是洛朗·巴博的支持者和当选总统阿拉萨内·瓦塔拉的支持者之间爆发的第二次武装冲突。双方的冲突升级为全面战争。我们应该介入，帮助稳定局势，以免事态失控。"
 FRA_Industrial_expansion: "工业扩张"
 FRA_Industrial_expansion_desc: "我们的前殖民地国家急需经济复兴。主要以农业为主的社会可以通过向该地区注入投资资金来促进其经济。"
 FRA_educational_development: "发展教育"
 FRA_educational_development_desc: "为我们前殖民地提供教育资金将有助于那里的民众提高教育水平，进而提高他们的生产力。"
 FRA_operation_serval: "薮猫行动"
 FRA_operation_serval_desc: "“薮猫行动”是马里内战期间法国和马里领导的一系列干预行动的绰号，这是该地区针对伊斯兰极端分子的冲突的第一阶段。"
 FRA_French_pillar_of_counterterrorism: "反恐支柱"
 FRA_French_pillar_of_counterterrorism_desc: "我们的反恐、反极端力量享誉世界，成为全球反恐的支柱和代表。"
 FRA_the_french_foreign_legion: "法国外籍兵团"
 FRA_the_french_foreign_legion_desc: "法国外籍军团是法国陆军的精锐部队，由各种专业兵种组成。它由当时的国王路易·菲利普于1831年组建，旨在为外国新兵提供在法国军队中服役的机会。因此，外籍军团是一支多元种族、多元文化的作战力量，以其严明的纪律和团结协作的精神享誉世界。"
 FRA_sahel_support_initiative: "萨赫勒支持倡议"
 FRA_sahel_support_initiative_desc: "萨赫勒地区的军队往往装备不足。我们可以考虑在财政或军事方面重新调配一些资源给他们，以帮助他们巩固我们在非洲的地位。"
 FRA_sahel_officer_training: "萨赫勒军官培训"
 FRA_sahel_officer_training_desc: "萨赫勒地区各国的武装部队需要更多的训练，以使他们成为一支更有效的战斗力量。我们应该投资于该地区盟友的军队，提高其军官的素质。"
 FRA_takuba_task_force: "塔库巴特遣队"
 FRA_takuba_task_force_desc: "塔库巴特遣队是法国、马里、欧盟和美国军队在马里内战期间继续与伊斯兰极端分子作战的又一系列联合行动。我们再次开始在马里进行干预，以确保该地区的稳定，这是我们的战略目标。"
 FRA_haitian_coup: "海地政变"
 FRA_haitian_coup_desc: "让-贝特朗·阿里斯蒂德仍然是我们国家的一根眼中钉。他要求赔偿的做法令人愤慨。或许我们应该考虑为海地寻找新的领导人。"
 FRA_repeal_the_ordiance: "废除条例"
 FRA_repeal_the_ordiance_desc: "为了促进海地与法国关系正常化，应当废除查理十世1825年的法令。正是这项法令导致了海地近75年的独立赔偿金支付。现在是时候废除这项古老的法令了，这是我们迈向和解的第一步。"
 FRA_senegalese_civil_war: "塞内加尔内战"
 FRA_senegalese_civil_war_desc: "塞内加尔内战始于近期的大选，最初只是一场局部冲突。塞内加尔作为沿海国家，对法国至关重要，因为它是内陆和北部地区物资运往法国的必经之路。为了继续我们在非洲的扩张野心，干预该地区势在必行。"
 FRA_returning_to_indochina: "重返印度支那"
 FRA_returning_to_indochina_desc: "在越南独立战争爆发前，印度支那曾是法国远东殖民地的巅峰。现在是时候重返印度支那了，或许不再是以殖民者的身份，而是以朋友的身份。随着中国的崛起，我们在该地区的利益日益凸显，使其成为至关重要的地区。"
 FRA_former_indian_colonial: "印度洋事务"
 FRA_former_indian_colonial_desc: "法国在印度洋的资产以及印度洋法语国家对于阻止和打击不受欢迎的外国势力具有重要的战略意义。现在是时候做好准备重返这些具有重要战略意义的地区，并带来投资和其他战略改善。"
 france_md.100.t: "亚美尼亚支持"
 france_md.100.d: "亚美尼亚在阿尔察赫与阿塞拜疆的斗争让我们想起了我们自身。支持他们的努力不仅是我们所希望的，也是我们在这个地区利益所必需的。我们可以向他们提供物质、财政或政治支持。我们应该如何帮助我们在埃里温的朋友？"
 france_md.100.a: "在政治上支持亚美尼亚"
 france_md.100.b: "在财政上支持亚美尼亚"
 france_md.100.c: "在军事上支持亚美尼亚"
 france_md.101.t: "法国支持我们！"
 france_md.101.d: "法国决定在我们为建立国家而进行的持续斗争中给予我们支持。与阿塞拜疆的冲突以及土耳其问题继续困扰着我们，但我们现在在欧洲有了盟友。"
 france_md.101.a: "又朝着正确方向迈出了一步"
 france_md.102.t: "第一次科特迪瓦内战"
 france_md.102.d: "科特迪瓦第一次内战已经全面爆发。冲突愈演愈烈，丝毫没有缓和的迹象。这片曾经的法兰西非洲明珠，如今已沦为交战双方的杀戮战场。随着国家四分五裂，该地区的稳定岌岌可危。究竟哪一方最符合我们当前的利益？"
 france_md.102.a: "支持洛朗·巴博"
 france_md.102.b: "支持纪尧姆·索罗"
 france_md.102.c: "支持第三阵营"
 france_md.103.t: "第二次科特迪瓦内战"
 france_md.103.d: "科特迪瓦第二次内战正在全面爆发，交战双方是科特迪瓦新军和[CDI.GetName]政府。冲突始于总统选举之后，尽管瓦塔拉赢得了公平自由的选举，但巴博拒绝下台。哪一方最符合我们当前的利益？"
 france_md.103.a: "支持洛朗·巴博"
 france_md.103.b: "支持阿拉萨内·瓦塔拉"
 france_md.104.t: "阿尔忒弥斯行动"
 france_md.104.d: "欧盟提议的“阿尔忒弥斯行动”将向刚果民主共和国派遣维和部队，干预伊图里地区。我们政府内部许多人希望由法国领导欧盟的军事行动。我们可以在参与方中选择支持哪一方。卢旺达及[RWA.GetLeader]可能是一个强大的盟友，尽管他们位于东部，并不寻求控制整个国家。[UGA.GetLeader]和[RCD.GetName]也是不错的选择，但他们主要集中在北部地区。我们当然也可以支持金沙萨的现任政府，这或许是最稳妥的选择。我们究竟应该支持谁？"
 france_md.104.a: "支持刚果民主共和国"
 france_md.104.b: "支持乌干达"
 france_md.104.c: "支持卢旺达"
 france_md.105.t: "塞内加尔内战"
 france_md.105.d: "塞内加尔内战演变成一场范围更广的冲突，令所有相关方都感到意外。卡萨芒斯问题以及对选举舞弊的指控，使非洲又一个国家陷入动荡。根据我们的目标，我们的选择多种多样。我们可以支持[SEN.GetLeader]及其政府、反叛派别或卡萨芒斯人民。无论我们选择哪一方，都将有助于塞内加尔在该地区开辟新的未来。"
 france_md.105.a: "支持塞内加尔"
 france_md.105.b: "支持叛军"
 france_md.105.c: "支持卡萨芒斯"
 france_md.106.t: "红蝴蝶行动"
 france_md.106.d: "我国国民议会和军方已提议对中非共和国进行新的干预，以应对该国的新冲突。这项名为“桑加里斯行动”的拟议行动将使我国军队支持内战中的某一派别。我们将支持冲突中的哪一方？"
 france_md.106.a: "支持中非共和国"
 france_md.106.b: "支持争取团结民主力量联盟"
 france_md.106.c: "支持塞雷卡"
 france_md.106.d1: "支持洛贡"
 france_md.106.e: "支持反巴拉卡"
 france_md.107.t: "薮猫行动"
 france_md.107.d: "作为对马里图阿雷格人叛乱的回应，国民议会已提议实施“薮猫行动”。目前，薮猫行动的目标是部署法国军队来支持[MAL.GetName]和[MAL.GetLeader]政府。如果我们愿意，我们可以改变外交政策并支持图阿雷格人的事业。我们应该代表冲突的哪一方进行干预？"
 france_md.107.a: "支持马里政府"
 france_md.107.b: "支持图阿雷格人"
 france_md.108.t: "塔库巴特遣队"
 france_md.108.d: "伊斯兰叛乱分子已经开始与[MAL.GetAdjective]政府和图阿雷格武装交战。“薮猫行动”已经进行了一段时间，我们可以继续支持之前支持的派系，也可以彻底改变策略，转而支持马里境内的新支持者。未来我们将支持哪个派系？"
 france_md.108.a: "支持马里政府"
 france_md.108.b: "支持图阿雷格人"
 france_md.108.c: "支持信仰卫士"
 france_md.109.t: "海地政变"
 france_md.109.d: "海地政府的执政机构目前对我们不利。执政党所树立的先例对我们的外交政策毫无益处。发动政变并支持反对派是我们确保其他殖民地不会开始就殖民时期的侵权行为向我们索要赔偿的最佳选择之一。"
 france_md.109.a: "策动政变"
 france_md.109.b: "支持叛军"
 france_md.350.t: "法国正在把我们赶出黎巴嫩！"
 france_md.350.d: "法国通过精心策划的外交施压和经济诱惑，系统性地削弱了我们在黎巴嫩的地位。他们的影响力行动取得了超出预期的成功 - 当地政客现在公开呼吁我们撤离，黎巴嫩政府也正式要求我们撤出。这无疑是一次令人羞辱的挫败，但或许并非不可逆转。我们可以尝试重新确立我们的影响力，尽管这样做可能会引发国际事件。"
 france_md.350.a: "鼠辈！你会付出代价的！"
 france_md.350.b: "落实宣称"
 france_md.355.t: "法国在民众中灌输反抗意识"
 france_md.355.d: "法国人一直在积极向黎巴嫩民众传播其革命理念。由巴黎资助的民间社会组织要求进行民主改革、提高透明度并举行自由选举。抗议运动在贝鲁特及其他地区愈演愈烈。如果我们不迅速采取行动控制局势，我们可能会面临一场受法国共和主义原则启发的大规模起义。"
 france_md.355.a: "这真让人难受"
 france_md.360.t: "法国能源投资提案"
 france_md.360.d: "法国能源巨头道达尔能源公司已向我国政府提交了一份全面的油气开发方案。该方案将带来大量外国投资和技术专长，并创造数千个就业岗位。然而，一些国内批评人士认为，接受法国资本将增强巴黎对我国经济政策的影响力。方案条款固然有利，但会对我们的主权造成怎样的损害？"
 france_md.360.a: "经济效益大于风险"
 france_md.360.b: "我们不能把资源卖给外国利益集团。"
 france_md.400.t: "法国对黎巴嫩北部的发展援助"
 france_md.400.d: "法国开发署已提出一项针对黎巴嫩北部地区的大型基础设施建设方案，包括道路改善、水处理设施和电信网络建设。该地区长期以来被忽视，法国的投资有望改善当地居民的生活水平。有人认为这是法国出于与黎巴嫩的历史渊源而展现的真诚人道主义关怀；也有人认为这是法国为扩大其在这一战略要地的影响力而精心策划的举措。"
 france_md.400.a: "这项合作将使我们的人民受益。"
 france_md.400.b: "我们更倾向于自主开发基础设施"
 france_md.401.t: "法国南部基础设施倡议"
 france_md.401.d: "法国已提出资助黎巴嫩南部的大型基础设施项目，该地区多年来饱受冲突和忽视之苦。该项目包括医院、学校和电网现代化改造。虽然人道主义需求毋庸置疑，但接受法国在南部的存在可能会使我们与其他地区大国的关系复杂化，这些国家对任何西方介入都抱有怀疑态度。"
 france_md.401.a: "南方迫切需要这笔投资。"
 france_md.401.b: "政治局势过于复杂。"
 france_md.402.t: "法国工业投资计划"
 france_md.402.d: "法国企业正计划对黎巴嫩制造业进行大规模投资，承诺建立工厂，为数千名黎巴嫩公民创造就业机会。青年失业问题一直困扰着黎巴嫩，这些工作岗位或许有助于遏制人才外流的趋势，避免黎巴嫩人才流失。然而，对法国资本的产业依赖可能会重塑黎巴嫩经济，而这种重塑最终将主要惠及巴黎。"
 france_md.402.a: "目前，就业是我们的首要任务。"
 france_md.402.b: "我们必须发展自己的工业基础。"
 france_md.403.t: "法国驻黎巴嫩人道主义援助团"
 france_md.403.d: "为应对当前危机，法国已提出派遣人道主义援助团，运送医疗物资、食品和技术援助。法国非政府组织和政府机构将与地方当局协调救援工作。马克龙总统已亲自呼吁国际社会支持黎巴嫩，并强调两国人民之间深厚的历史和文化渊源。这项援助不仅能提供急需的救济，还能在黎巴嫩局势脆弱之际提升法国的国际影响力。"
 france_md.403.a: "我们衷心感谢这份帮助。"
 france_md.403.b: "我们可以管理好自己的事务。"
 france_md.500.t: "卢米奥袭击事件"
 france_md.500.d: "卢米奥的一个小市镇遭到科西嘉民族解放阵线的袭击。这次袭击没有造成人员伤亡，但对该市镇少量军事基础设施造成了严重破坏，并造成数名宪兵受伤。"
 france_md.500.a: "一件令人不安的事件，仅此而已。"
 france_md.501.t: "马赛酒店袭击事件"
 france_md.501.d: "马赛发生了一系列小型爆炸事件。科西嘉民族解放阵线声称对这些袭击负责。多人因这些事件受伤入院，但目前看来，他们似乎没有计划对其他酒店发动更多爆炸袭击。"
 france_md.501.a: "我们不会被吓倒。"
 france_md.504.t: "麦当劳爆炸案"
 france_md.504.d: "少数布列塔尼民族主义者决定炸毁布列塔尼凯韦尔的一家当地麦当劳。炸弹爆炸导致麦当劳内一人死亡。正在进行的调查尚未找到太多证据，无法确定这是否是一个更大的阴谋，但这起悲剧事件。"
 france_md.504.a: "毫无意义的生命逝去"
 FRA_balance_the_cnes_budget: "重新平衡法国国家空间研究中心预算"
 FRA_balance_the_cnes_budget_desc: "我们的航天计划 - 法国国家空间研究中心 - 过去在资金使用效率低下和轻微腐败方面存在一些问题。我们应该派遣国家审计人员协助控制过度支出，并为CNES重塑亟需的良好声誉。"
 FRA_invest_LEB_decision_category: "法国-黎巴嫩投资"
 FRA_invest_LEB_decision_category_desc: "黎巴嫩曾经是我们的殖民地，因此我们必须重返该地区并投资伟大的国家[LEB.GetNameWithFlag]。"
 FRA_LEB_invest_infrastructure_south: "投资南黎巴嫩"
 FRA_LEB_invest_infrastructure_south_desc: "促进黎巴嫩南部经济发展有助于防止该地区的极端化。该地区经济机会越多，最终对所有相关方都越有利。"
 FRA_LEB_invest_infrastructure_north: "投资北黎巴嫩"
 FRA_LEB_invest_infrastructure_north_desc: "黎巴嫩的经济中心几乎一直都集中在贝鲁特及其周边地区。向该国北部扩张和投资将带来丰厚的回报。"
 FRA_LEB_invest_civilian_factory: "投资黎巴嫩民用工业"
 FRA_LEB_invest_civilian_factory_desc: "黎巴嫩可以对其民用工业进行额外投资。发展这些工业可以进一步帮助黎巴嫩经济发展，并使其在全球舞台上更加自给自足。"
 FRA_LEB_financial_help: "向黎巴嫩提供财政援助"
 FRA_LEB_financial_help_desc: "我们应该向黎巴嫩提供财政援助，以帮助弥补他们的部分预算不足等。"
 FRA_french_africa_decision_category: "法国非洲/非洲决议"
 FRA_french_africa_decision_category_desc: "对我们来说，非洲和法属非洲常常是同义词。非洲大陆需要我们的帮助和照料，因此我们应继续将非洲作为我们外交政策和利益的焦点。"
 FRA_invest_in_NEPAD_education_decision: "投资于非洲发展新伙伴关系教育项目"
 FRA_invest_in_NEPAD_education_decision_desc: "非洲发展新伙伴关系教育项目需要额外的资金和支持。我们将承担增加的资金，但非洲国家将看到教育支出成本进一步降低。"
 FRA_invest_in_NEPAD_healthcare_decision: "投资非洲发展新伙伴关系医疗保健项目"
 FRA_invest_in_NEPAD_healthcare_decision_desc: "非洲发展新伙伴关系计划的医疗保健项目需要一些额外的资金和支持。我们将支付增加的资金，但非洲国家将看到医疗保健支出成本的进一步降低。"
 FRA_invest_in_NEPAD_social_care_decision: "投资非洲发展新伙伴关系社会保障项目"
 FRA_invest_in_NEPAD_social_care_decision_desc: "非洲发展新伙伴关系社会保障项目需要额外的资金和支持。我们将承担增加的资金，但非洲国家将看到社会保障支出成本进一步降低。"
 FRA_invest_in_NEPAD_economic_program_decision: "投资非洲发展新伙伴关系经济项目"
 FRA_invest_in_NEPAD_economic_program_decision_desc: "非洲发展新伙伴关系经济计划需要一些额外的资金和支持。我们将承担增加的资金，但非洲国家将看到生产力的提高和建设速度的加快。"
 FRA_extend_the_NEPAD_program_decision: "延长非洲发展新伙伴关系项目"
 FRA_extend_the_NEPAD_program_decision_desc: "该项目需要延长。我们可以向该项目追加一些资金，以维持其持续运行。"
 FRA_space_enthusiasm_effect_tt: "我们的§Y太空计划热情§!改变[?temp_change|1+]（当前：[?FRA.FRA_peoples_support|1Y]）"
 FRA_space_income_effect_tt: "我们的§Y太空计划每周收入§!改变[?temp_change|3+]（当前：[?FRA.FRA_space_income_var|Y3+]）"
 FRA_nepad_cost_increase_cost_effect_tt: "$FRA_idea_nepad_modifier$改变[?temp_change|-3]（当前：[?FRA.FRA_nepad_sponsor_weekly_cost|-3]）"
 FRA_nepad_program_counter_currently_tt: "非洲发展新伙伴关系计划目前正在进行中（当前：[?AFRICA_nepad_focus_FRA:days_left|Y0]）"
 FRA_cfa_franc_influence_gain_TT: "当受到§Y[FRA.GetNameWithFlag]§!影响时$foreign_influence_defense_modifier$减少§Y10%§!\n"
 FRA_cfa_franc_custodian_idea_TT: "额外收入： $$[?additional_income_FRA_cfa_franc_custodian|+]\n"
 FRA_idea_Light_for_Europe_income_TT: "额外收入： $$§G2.00§!"
 FRA_expansion_tooltip_TT: "§Y直到我们完成共产主义或民族主义国策之后，这些国策才会显示其真正的效果。§!\n"
 FRA_french_canadian_TT1: "§Y法国帮助加拿大政府，法裔加拿大人的幸福感大幅提升。§!\n"
 FRA_french_canadian_TT2: "§Y由于法国人支持魁北克人，法裔加拿大人的幸福感下降。§!\n"
 FRA_idea_development_investment_tt: "在§C[FRA.GetNameWithFlag]§!的投资中改变$investment_cost_modifier$与$investment_duration_modifier$§G5%§!。\n"
 FRA_idea_administrative_reforms: "行政改革"
 FRA_idea_administrative_reforms_desc: "法国的官僚机构经历了一系列重要改革，降低了部分成本并扩大了政府制定和实施各种新政策的能力。"
 FRA_idea_french_armored_production_desc: "法国装甲车辆是世界上最好的作战车辆之一。我们必须继续保持这一优势，并继续生产装甲车辆，以应对不断涌现的新全球威胁。"
 FRA_idea_central_decentral_desc: "巴黎和各地区之间的职权范围正在重新划分，每一份转移的文件都需要花费金钱和时间才能产生回报。"
 FRA_idea_military_improvement_army: "军事改革 - 陆军"
 FRA_idea_military_improvement_army_desc: "多项改革措施中的第一项已经启动，军队改革被列为优先事项。我们之所以选择军队，是因为它能够保卫我们国家以及盟国的边境，因此军队最为重要。"
 FRA_idea_military_improvement_navy: "军事改革 - 海军"
 FRA_idea_military_improvement_navy_desc: "众多改革措施中的第一项已启动，海军改革成为首要任务。我国海军在维护关键补给线、投送军事力量和保障海外领土安全方面发挥着重要作用。"
 FRA_idea_military_improvement_air_force: "军事改革 - 空军"
 FRA_idea_military_improvement_air_force_desc: "多项改革措施中的第一项已经启动，空军改革成为首要任务。之所以选择空军，是因为它有能力阻止任何人从空中夺取我国的领土，并为海军和陆军提供有效的支援。"
 FRA_idea_military_improvement_army_and_navy: "军事改革 - 陆军与海军"
 FRA_idea_military_improvement_army_and_navy_desc: "我们下一阶段的改革重点是陆军和海军。陆军和海军都需要进行更好的改革，以加强跨军种协调，有效防御舰艇，并更有效地与陆军协同运用海军力量。"
 FRA_idea_military_improvement_army_and_air_force: "军事改革 - 陆军与空军"
 FRA_idea_military_improvement_army_and_air_force_desc: "陆军和空军的联合兵种训练与能力提升是我们能够推行的最关键改革之一。这两个不同军种的协同作战能够也必将确保我们在未来的冲突中取得胜利。"
 FRA_idea_military_improvement_air_force_and_navy: "军事改革 - 空军与海军"
 FRA_idea_military_improvement_air_force_and_navy_desc: "空军和海军密不可分，也同样不可或缺。对这两个军种的改进将使我们能够保护自身利益，以及我们在欧洲和全球范围内的朋友、盟友和平民的利益。"
 FRA_idea_space_agency_name: "法国国家空间研究中心"
 FRA_idea_space_agency_name_desc: "法国国家空间研究中心是法国国家航天机构的名称。它由时任总统夏尔·戴高乐于1961年创立，是世界上历史第三悠久的航天机构，仅次于美国国家航空航天局和苏联航天计划及其后继者俄罗斯航天局。"
 FRA_idea_reformed_cnes_desc: "法国国家空间研究中心是法国国家航天机构的名称。它由时任总统戴高乐于1961年创立，是世界上历史第三悠久的航天机构，仅次于美国国家航空航天局和苏联航天计划及其后继者俄罗斯航天局。近年来，由于预算调整和其他政治变革，法国国家空间研究中心进行了改革，演变为我们今天所熟知的版本。"
 FRA_idea_cnes_failing_desc: "由于欧盟正在提议成立自己的航天局，法国国家空间研究中心在过去的一年里出现了几次预算短缺，导致该行业遭到了极大的蔑视。"
 FRA_idea_prep_the_launch_desc: "国家空间研究中心目前正在准备发射一艘航天器。它还需要一段时间才能准备发射。"
 FRA_idea_space_research_desc: "研究太空是更好地了解我们周围世界的最有益方法之一。专注于太空研究可以确保我们遥遥领先于对手和竞争对手。"
 FRA_idea_nasa_partnership_desc: "美国国家航空航天局和我们自己的国家空间研究中心之间的合作不仅是为了盈利，而且是为了共同利益。与我们的盟友扩大和讨论有助于全面改善科学研究，并帮助这两个机构拓展到新的领域。"
 FRA_idea_Light_for_Europe: "欧洲之光"
 FRA_idea_Light_for_Europe_desc: "多余的核能和可再生能源电力通过互联线路流出。邻近地区居民则需为电网不需要的电力付费。"
 FRA_cfa_franc_custodian: "非洲金融共同体法郎托管人"
 FRA_cfa_franc_custodian_desc: "我们创建非洲金融共同体法郎是为了保护我们的殖民地免受二战后法郎贬值的影响。尽管我们现在不再使用法郎，但我们仍然是西非国家货币的保管者。他们将其一半的国库储备存放在我们这里，因此我们可以利用这些储备带来的资产。\n\n使用§Y非洲金融共同体法郎§!的国家将为我们提供其§Y总GDP0.5%§!作为§Y额外收入§!。当前§Y使用非洲金融共同体法郎国家§!§Y总GDP§!为：[?FRA.FRA_cfa_franc_gdp_total]B"
 the_eco: "埃科"
 the_eco_desc: "埃科是西非国家经济共同体和西非货币区提议在西非发行的货币。法语国家非洲金融共同体法郎持有者也希望支持这种新货币。它统一了该地区的货币体系，使商品贸易更加便捷，并形成了一种各国可以团结起来的统一货币。"
 FRA_idea_the_french_pillar_of_counterterroism: "反恐支柱"
 FRA_idea_the_french_pillar_of_counterterroism_desc: "恐怖主义正在兴起，我们法国人民有责任遏制这种趋势，保护我们自己、欧洲和所有可能受到伤害的人。随着极端主义的兴起，法国的未来不仅需要我们的言语，还需要我们的武力，因为我们要打击对我们国家日益增长的威胁。"
 FRA_idea_the_french_foreign_legion: "法国外籍兵团"
 FRA_idea_the_french_foreign_legion_desc: "法国外籍军团是法国陆军的一支精锐部队，由步兵、骑兵、工兵和空降兵等多个专业部队组成。外籍军团是一支独特的战斗部队，因为它允许所有外国人加入，而且训练有素。"
 FRA_idea_Grand_ambitions: "在非洲的宏伟抱负"
 FRA_idea_Grand_ambitions_desc: "非洲已经成熟，我们需要继续前进，宣布我们新的宏伟抱负。最重要的是，我们要继续巩固我们在非洲的地位，以确保我们目前和全体法国人民的未来。"
 FRA_idea_development_investment: "开发投资"
 FRA_idea_development_investment_desc: "[FRA.GetNameWithFlag]正在向我们提供经济援助，帮助我们发展国家。"
 AFRICA_idea_nepad_modifier: "非洲发展新伙伴关系发展计划"
 AFRICA_idea_nepad_modifier_desc: "非洲发展新伙伴关系是由非洲联盟与欧盟、中国、日本和其他八国集团成员国共同制定的经济发展计划。我们对NEPAD的发展尤为关注，并在欧盟内部成为其主要的资金和政治支持者。我们应该考虑如何帮助扩大该计划的覆盖范围，增加其资金和支持，从而惠及整个非洲。\n\n[FRA.GetNameWithFlag]是该计划的主要赞助人。"
 AFRICA_idea_nepad_modifier_tt: "当受到§Y[FRA.GetNameWithFlag]§!影响时$foreign_influence_defense_modifier$减少§Y10%§!\n"
 FRA_idea_nepad_modifier: "非洲发展新伙伴关系赞助人"
 FRA_idea_nepad_modifier_desc: "非洲发展新伙伴关系是由非洲联盟与欧盟、中国、日本和其他八国集团成员国共同制定的经济发展计划。我们对NEPAD的发展尤为关注，并在欧盟内部成为其主要的资金和政治支持者。我们应该考虑如何帮助扩大该计划的覆盖范围，增加其资金和支持，从而惠及整个非洲。\n\n[FRA.GetNameWithFlag]是该计划的主要赞助人，因此我们将获得额外的好处，例如增加目前从该计划中受益的国家的外国影响力。\n"
 FRA_idea_nepad_modifier_cost_tt: "我们对非盟非洲发展新伙伴关系发展费用的赞助为每周$[?FRA.FRA_nepad_sponsor_weekly_cost|-3]B。"
 FRA_unrestricted_subjugation_idea: "无限制征服"
 FRA_unrestricted_subjugation_idea_desc: "我们拥有的殖民地为我们带来了惊人的财富，并在全球舞台上赢得了极大的尊重。在某些方面，我们必须回到我们以前的方式，开始重新对抗其他国家，保护我们应得的东西。征服可以通过多种方式实现，例如通过军事力量、外交强硬等等。阻止我们这样做的障碍必须而且应该被消除。"
 FRA_SYR_anti_assad_regime_message_idea: "反阿萨德政权讯息"
 FRA_SYR_anti_assad_regime_message_idea_desc: "[FRA.GetNameWithFlag]已开始传播和散布针对叙利亚政府的宣传信息。这些信息开始削弱政府的权威，并持续煽动青年反对统治阶级。这也表明叙利亚政府容易受到外国势力的影响。"
 FRA_educational_development_idea: "发展教育"
 FRA_educational_development_idea_desc: "[FRA.GetNameWithFlag]正在协助我国开展教育项目。教育发展不仅减轻了部分成本，也使我们能够满足并改进当前的教育需求。"
 FRA_resource_prospects_idea: "资源勘探"
 FRA_resource_prospects_idea_desc: "[FRA.GetNameWithFlag]目前正在协助勘探我国的资源，以便为经济提供更多的发展途径。"
 FRA_SYR_escalation_from_the_damascus_spring_idea: "大马士革之春事件升级"
 FRA_SYR_escalation_from_the_damascus_spring_idea_desc: "[FRA.GetNameWithFlag]持续散布关于我们国家走向民主的宣传。在我们努力稳定国家局势之际，这些行为不断削弱我们领导人[SYR.GetLeader]的权威。"
 FRA_an_aggressive_expansionism_flag: "侵略性外交政策"
 FRA_aze_supports_our_enemy: "支持亚美尼亚"
 FRA_antagonize_syria_opinion: "激怒我们！"
 FRA_haiti_demands_reparations_opinion: "要求赔偿"
 FRA_repealed_the_ordinance_opinion: "废除条例"
 FRA_francophone_solidarity_opinion: "法语国家团结"
 FRA_supported_nepad_development_opinion: "支持非洲发展新伙伴关系"
 FRA_preparing_launch: "准备发射法国国际空间站"
 FRA_french_pillar_of_counterterrorism_tt: "派遣§Y外国顾问§!到各国用于§Y反恐目的§!，我们的顾问将为§Y受建议国§!提供双倍加成。"
 FRA_leave_eu_tt: "如果民族主义支持率大于25%有几率脱欧运动兴起"
 france_md.110.t: "马约特地位全民公投"
 france_md.110.d: "马约特岛人民决定举行全民公投，以决定他们在法兰西共和国的命运。自1841年马达加斯加前国王将该岛出售给法国以来，马约特岛一直是法兰西共和国的一部分。当地主要官员正寻求巩固其在法兰西共和国的地位，他们希望通过三种方式实现这一目标：正式成为法兰西共和国的一部分、寻求脱离法国独立，或者加入科摩罗。我们应该怎么做？"
 france_md.110.a: "允许举行全民公投"
 france_md.110.b: "拒绝举行全民公投"
 france_md.110.c: "给予他们有限的自主权。"
 france_md.111.t: "马约特地位全民公投结果"
 france_md.111.d: "公投终于落下帷幕，结果已经出炉。马约特岛的未来掌握在这些结果手中。"
 france_md.111.a: "完美"
 france_md.505.t: "克劳斯-玛菲·韦格曼-奈克斯特合并提案"
 france_md.505.d: "法国和德国政府正在敲定一项计划，将奈克斯特系统公司和克劳斯-玛菲·韦格曼公司合并为一家法德合资国防企业。合并后的坎特财团将把勒克莱尔坦克和豹2坦克的生产线集中在同一厂房内，打造联合火炮和弹药产品组合，并为未来的欧洲主战坦克项目奠定基础。\n\n部长们希望在股份转让进行之前获得政治批准。"
 france_md.505.a: "批准合并"
 france_md.505.b: "维持奈科斯特独立"
 TT_FRA_knds_merge_carry_traits: "§Y在奈克斯特解锁的所有特质都将继承至新的KNDS组织。§!"
 france_md.506.t: "阿库斯：工业整合"
 france_md.506.d: "沃尔沃集团旗下的两家防务子公司 - 雷诺卡车防务公司和帕纳德通用防务公司 - 已完成合并，成立了新的公司阿库斯。新公司融合了雷诺的轮式移动平台和帕纳德的侦察技术，使法国成为欧洲装甲车辆市场的统一竞争者。两家原公司的生产知识、项目和改装能力均已转移到新公司。"
 france_md.506.a: "法国装甲机动性的新篇章"
 france_md.506_tt: "雷诺和潘哈德将合并为阿库斯汽车公司。"
 FRA_arguus_established: "雷诺和潘哈德在2018年已合并为阿库斯公司。"
 france_md.507.t: "欧洲直升机公司更名为空客直升机公司"
 france_md.507.d: "自今日起，欧洲直升机集团正式更名为空中客车直升机公司，并将欧洲航空防务航天公司的旋翼机业务整合到统一的空中客车品牌之下。马里尼亚讷工厂、多瑙沃特工厂以及法国宇航公司的传承生产线现均在同一品牌下运营。"
 france_md.507.a: "欧洲旋翼机发展的新篇章。"
 TT_FRA_airbus_change_carry_traits: "§Y在$FRA_eurocopter_manufacturer$解锁的所有特质将继承至$FRA_airbus_manufacturer$§!"
 france_md.508.t: "DCNS更名为海军集团"
 france_md.508.d: "自即日起，历史悠久的国有造船厂\"舰艇建造总局\"正式更名为\"海军集团\"，标志着其全面转型为私营企业。洛里昂、瑟堡和布雷斯特的造船厂如今在统一品牌下运营，同时还包括与芬坎蒂尼集团合资的纳维里斯公司，以及围绕叙弗朗级潜艇和贝尔哈拉防御与干预护卫舰展开的新一轮出口攻势。"
 france_md.508.a: "法国造船业的新篇章。"
 TT_FRA_naval_takeover_carry_traits: "§Y在$FRA_dcn_manufacturer$解锁的所有特质将继承至$FRA_naval_group_naval_manufacturer$§!"
 FRA_nexter_manufacturer: "法国地面武器工业集团"
 FRA_nexter_merge: "奈克斯特已与克劳斯-玛菲·威格曼在2015年合并"
 FRA_nexter_cold_war_legacy: "冷战遗产"
 FRA_nexter_scorpion_programme: "“蝎”式计划"
 FRA_nexter_firepower_ammo: "火力与弹药"
 FRA_nexter_manufacturer_trait: "“凯撒”火力运用原则"
 FRA_nexter_manufacturer_trait_desc: "从布尔日兵工厂的锻造车间到车载凯撒榴弹炮，奈克斯特系统公司凭借轻量化履带与轮式平台提供的快速精准火力，奠定了其行业声誉。"
 FRA_nexter_leclerc_programme: "勒克莱尔计划"
 FRA_nexter_leclerc_programme_desc: "勒克莱尔主战坦克是奈克斯特系统公司的旗舰产品，自20世纪70年代末开始研发，1992年正式服役。其自动装弹系统和模块化装甲树立了法国装甲兵学说的发展标杆。"
 FRA_nexter_leclerc_mk2: "勒克莱尔系列2"
 FRA_nexter_leclerc_mk2_desc: "“系列2”整体升级引入了混合式空调、升级型电子设备及改进型复合装甲套件，将平台服役寿命延长至2020年代。"
 FRA_nexter_leclerc_xlr: "勒克莱尔XLR现代化升级"
 FRA_nexter_leclerc_xlr_desc: "XLR中期升级对勒克莱尔进行了重新设计，围绕遥控武器站、模块化装甲套件和SCORPION战斗管理系统集成展开，使其在与新型主战坦克设计的竞争中保持优势。"
 FRA_nexter_vbci: "VBCI 轮式步兵战车"
 FRA_nexter_vbci_desc: "VBCI(Véhicule Blindé de Combat d'Infanterie)步兵战车为法国陆军提供了首款现代化轮式步兵战车。该车型于2008年投产，并成为机械化团装甲机动能力的骨干装备。"
 FRA_nexter_famas: "法玛斯制式步枪"
 FRA_nexter_famas_desc: "无托式法玛斯突击步枪自1981年起成为法国制式步兵武器。奈克斯特公司的轻武器生产线正是源于该枪的生产与持续保障合同。"
 FRA_nexter_scorpion_core: "蝎式战斗集成"
 FRA_nexter_scorpion_core_desc: "“蝎”式计划于2014年正式立项，通过通用战场管理系统和数字化骨干网络，将法国陆军新型轮式作战车族互联成网。"
 FRA_nexter_griffon: "VBMR 狮鹫"
 FRA_nexter_griffon_desc: "“格里芬”是“蝎子”家族的六轮多用途战术运载车，用于取代VAB成为法国陆军标准装甲人员输送车。"
 FRA_nexter_jaguar: "EBRC 美洲豹"
 FRA_nexter_jaguar_desc: "美洲豹六轮侦察战斗车搭载40毫米CTA机炮与阿凯隆MP导弹，继承了勒克莱尔坦克已验证的火力设计理念。"
 FRA_nexter_serval: "VBMR-L 薮猫"
 FRA_nexter_serval_desc: "轻型四轮“薮猫”采用紧凑型铝合金车体，将“蝎子”家族的机动能力延伸至特种部队、巡逻及指挥改型。"
 FRA_nexter_40cta: "40毫米CTA机炮"
 FRA_nexter_40cta_desc: "与BAE系统公司通过CTA国际联合开发的40毫米定装式伸缩炮，为整个蝎式车族提供了紧凑型高速反装甲火力。"
 FRA_nexter_caesar: "凯撒 155毫米平台"
 FRA_nexter_caesar_desc: "凯撒车载155毫米榴弹炮兼具战略机动性与远程精确打击能力，成为奈克斯特公司最成功的出口型火炮平台。"
 FRA_nexter_eurenco: "欧洲含能材料公司发射药"
 FRA_nexter_eurenco_desc: "欧洲含能材料公司(Eurenco)提供推进剂、炸药及含能材料，支撑法国火炮和轻武器弹药的生产，使奈克斯特的生产与稳定的上游供应链紧密相连。"
 FRA_nexter_nbc_sys: "NBC-Sys 核生化套装"
 FRA_nexter_nbc_sys_desc: "NBC-Sys子公司专门为法国及出口部队提供核生化和核检测与净化设备。"
 FRA_nexter_lu_family: "LU系列弹药"
 FRA_nexter_lu_family_desc: "LU211及LU系列155毫米炮弹通过底部排气和改进的空气动力学设计延长了火炮射程，实现了北约兼容火炮系统远程火力标准化。"
 FRA_nexter_bonus: "BONUS智能弹药"
 FRA_nexter_bonus_desc: "BONUS传感器引信155毫米炮弹可释放自瞄准子弹药攻击装甲纵队，使标准榴弹炮部队具备精确反装甲能力。"
