 SAU_events.11.t:0 "[SAU.GetFlag]Oil for Security"
 SAU_events.11.d:0 "Riyadh offers Washington a standing bargain: a reliable flow of Saudi oil to American markets in exchange for closer security cooperation. The Kingdom awaits an answer."
 SAU_events.12.t:0 "[SAU.GetFlag]A Saudi-British Partnership"
 SAU_events.12.d:0 "Saudi Arabia proposes a long-term partnership with Britain. Oil revenue would pay for British industry and expertise, reviving the spirit of Al-Yamamah."
 SAU_events.13.t:0 "[SAU.GetFlag]A Franco-Saudi Investment Pact"
 SAU_events.13.d:0 "Setting old suspicions aside, Riyadh offers Paris a sweeping investment pact: Saudi capital for French industry, and French expertise for the Kingdom. Both governments stand to gain."
 SAU_events.13.a:0 "A profitable arrangement."
 SAU_events.14.t:0 "[SAU.GetFlag]Investment in Nato Countries"
 SAU_events.14.d:0 "Saudi Arabia investment in our country, in exhange of investment, if we accept, we will get it."
 SAU_events.15.t:0 "[SAU.GetFlag]A Saudi-Spanish Partnership"
 SAU_events.15.d:0 "Riyadh approaches Madrid with a naval offer: Spanish yards would build for the Royal Saudi Navy, and Saudi money would flow into Spanish industry."
 SAU_events.16.t:0 "[SAU.GetFlag]The American Shield"
 SAU_events.16.d:0 "The Kingdom asks Washington for an expanded air-defence umbrella. Patriot batteries would ring Saudi cities and oil fields, paid for in full by Riyadh."
 SAU_oil_for_security_focus_tt:0 "[USA.GetFlag]§HIf the United States accepts the offer, we will gain a Fossil Fuel Powerplant, oil revenue, Stability, and the Oil for Security National Spirit§!"

 SAU_UK_partnership_focus_tt:0 "[ENG.GetFlag]§HIf Britain accepts the offer, we will gain a Investment Return National Spirit for the two countries!§!"
 SAU_UK_stratgic_friendship_UKOne:0 "The Saudi-British Partnership"
 SAU_never_trust_french_focus_tt:0 "[FRA.GetFlag]§HFrance will be offered an investment pact: both nations gain a National Spirit§!"
 SAU_MNNA_focus_tt:0 "[SAU.GetFlag]§HIf they accepts, We will get Military Factor From Each Major Country§!"
 SAU_spain_partnership_focus_tt:0 "[SPR.GetFlag]§HIf Spain accepts the offer, we will gain a Naval Dockyard in Jeddah§!"
 SAU_american_shield_focus_tt:0 "[USA.GetFlag]§HIf the United States accepts, we will gain two levels of Anti-Air protection in Riyadh§!"
 SAU_french_investment_pact:0 "Franco-Saudi Investment Pact"
 SAU_french_investment_pact_desc:0 "French and Saudi capital flows both ways under a state-backed pact. Total, Airbus, and Thales set up shop in the Kingdom while Saudi funds buy into French industry."
 SAU_french_investment_pact_FRA:0 "Saudi-French Investment Pact"
 SAU_french_investment_pact_FRA_desc:0 "A state-backed pact opens Saudi markets to French industry and brings Gulf capital into France."
 SAU_oil_for_security_pact:0 "Oil for Security"
 SAU_oil_for_security_pact_desc:0 "The Kingdom keeps American markets supplied with oil, and Washington underwrites Saudi security. The arrangement anchors the riyal, the dollar, and the House of Saud alike."
 SAU_oil_for_security_pact_USA:0 "Oil for Security"
 SAU_oil_for_security_pact_USA_desc:0 "Riyadh guarantees the flow of oil to American markets: cheap, reliable fuel in exchange for the American security umbrella."
 SAU_IMEC_india_deal_new:0 "The IMEC Corridor"
 SAU_IMEC_india_deal_new_desc:0 "The India-Middle East-Europe corridor channels Indian trade through Saudi ports and rail. The Kingdom collects the tolls of a new Silk Road."
 SAU_OPEC_Russia_deal_new:0 "OPEC+ Coordination"
 SAU_OPEC_Russia_deal_new_desc:0 "Riyadh and Moscow set production quotas together. Two oil superpowers steering one market."
 PER_houthi_support_category:0 "Support the Houthis"
 yemen_partition_category:0 "The Two Yemens"
 SAU_Salman_Abdulaziz:0 "The Accession of King Salman"
 SAU_Salman_Abdulaziz_desc:0 "King Abdullah is dead. Salman bin Abdulaziz, last great prince of the Sudairi Seven and governor of Riyadh for nearly half a century, ascends the throne in January 2015."
 SAU_salman_accession_tt:0 "§HKing Salman takes the throne. The Kingdom rallies to its new Custodian.§!"
 SAU_must_be_king_salman_tt:0 "§YKing Salman§! must be the leader of Saudi Arabia."
 SAU_twilight_tt:0 "§HThe question of the succession can no longer be postponed.§!"
 focus_Salman_abdulazia_15_tt:0 "It give you §H-5% Comsumer Good§! and §R-5% Consturtion speed§!"
 focus_Salman_abdulazia_14_tt:0 "It give you §H5% Consturtion speed§! and §R5% Comsumer Goods§!"
 focus_Salman_abdulazia_16_tt:0 "It give you §H3% Stablitiy§! and §H2% Political power§!"
 focus_Salman_abdulazia_13_tt:0 "It give you §H1% Defense on Core§!"
 SAU_succession_race_unlock_tt:0 "§YThe contest to succeed King Abdullah opens. See the Crown Prince decisions.§!"
 SAU_crown_prince_category:0 "Crown Prince"
 SAU_crown_prince_category_desc:0 "[ROOT.GetSAUSuccessionPanel]"
 SAU_back_salman:0 "Back Salman bin Abdulaziz"
 SAU_back_salman_desc:0 "Throw your weight behind the senior Sudairi prince and longtime governor of Riyadh. Committing to a candidate binds the court to his cause for the rest of the succession."
 SAU_back_mbn:0 "Back Mohammed bin Nayef"
 SAU_back_mbn_desc:0 "Throw your weight behind the Interior Minister, architect of the Kingdom's counterterrorism state and favourite of Washington. Committing to a candidate binds the court to his cause for the rest of the succession."
 SAU_back_mutaib:0 "Back Mutaib bin Abdullah"
 SAU_back_mutaib_desc:0 "Throw your weight behind King Abdullah's son, commander of the National Guard and heir to his father's tribal following. Committing to a candidate binds the court to his cause for the rest of the succession."
 SAU_rally_support:0 "Rally Support for Our Candidate"
 SAU_rally_support_desc:0 "Marshal the patronage of the royal family, the religious establishment, and the press behind your prince. The gain may be slight, solid, or a major breakthrough."
 SAU_rally_support_tt:0 "§GRaises your candidate's share of influence§! (slight, normal, or major)"
 SAU_undermine_salman:0 "Undermine Salman bin Abdulaziz"
 SAU_undermine_salman_desc:0 "Whisper against the prince in the majlis, leak word of his frailties, and starve his allies of favour. The plot may come to nothing, or it may cost him dearly."
 SAU_undermine_mbn:0 "Undermine Mohammed bin Nayef"
 SAU_undermine_mbn_desc:0 "Whisper against the prince in the majlis, leak word of his frailties, and starve his allies of favour. The plot may come to nothing, or it may cost him dearly."
 SAU_undermine_mutaib:0 "Undermine Mutaib bin Abdullah"
 SAU_undermine_mutaib_desc:0 "Whisper against the prince in the majlis, leak word of his frailties, and starve his allies of favour. The plot may come to nothing, or it may cost him dearly."
 SAU_undermine_tt:0 "§RReduces the rival's share of influence§! (the plot may fail)"
 SAU_rally_slight_tt:0 "§GA modest gain§! for your candidate"
 SAU_rally_normal_tt:0 "§GA solid gain§! for your candidate"
 SAU_rally_major_tt:0 "§GA major breakthrough§! for your candidate"
 SAU_undermine_fail_tt:0 "§RThe plot is uncovered.§! No change to the rival's standing."
 SAU_undermine_minor_tt:0 "§GA minor blow§! to the rival's standing"
 SAU_undermine_major_tt:0 "§GA serious blow§! to the rival's standing"
 SAU_maneuver_tt:0 "§RThe rival's faction advances his claim§! (and may chip at your candidate)"
 SAU_maneuver_slight_tt:0 "§RThe rival gains a little ground.§!"
 SAU_maneuver_normal_tt:0 "§RThe rival gains ground.§!"
 SAU_maneuver_major_tt:0 "§RThe rival surges ahead.§!"
 SAU_maneuver_scheme_tt:0 "§RThe rival gains ground and schemes against another prince.§!"
 SAU_choose_mbs_tt: "Mohammed bin Salman is thrust toward the throne: §G+15 crown points§!.\n§RWarning: this openly commits the Kingdom to MBS and sidelines the rival princes.§!"
 SAU_frontrunner_salman:0 "Salman bin Abdulaziz"
 SAU_frontrunner_mbn:0 "Mohammed bin Nayef"
 SAU_frontrunner_mutaib:0 "Mutaib bin Abdullah"
 SAU_salman_maneuver:0 "Salman's Faction Maneuvers"
 SAU_salman_maneuver_desc:0 "The Sudairi bloc works to advance Salman's claim, and may turn the court against your own candidate."
 SAU_mbn_maneuver:0 "Bin Nayef's Faction Maneuvers"
 SAU_mbn_maneuver_desc:0 "The security services work to advance Mohammed bin Nayef's claim, and may turn the court against your own candidate."
 SAU_mutaib_maneuver:0 "Mutaib's Faction Maneuvers"
 SAU_mutaib_maneuver_desc:0 "The National Guard works to advance Mutaib's claim, and may turn the court against your own candidate."
 SAU_events.88.t:0 "The Death of King Fahd"
 SAU_events.88.d:0 "King Fahd bin Abdulaziz Al-Saud is dead. Felled by a stroke a decade ago, he reigned in name while his half-brother Abdullah ruled as regent, and now Abdullah ascends the throne in his own right. Yet Abdullah is himself past eighty, and across the majlis of the House of Saud the princes already weigh who shall follow him.\n\n§YThe contest to succeed King Abdullah now begins. See the Crown Prince decisions.§!"
 SAU_events.88.a:0 "The succession is already in question"
 SAU_events.89.t:0 "The Death of King Abdullah"
 SAU_events.89.d:0 "King Abdullah bin Abdulaziz Al-Saud is dead. For a decade the princes of the House of Saud weighed and bargained over who should follow him. That question can wait no longer, and the prince who commands the greatest share of influence will be proclaimed King.\n\n§YSalman bin Abdulaziz:§! [?SAU_salman_share|0]%\n§YMohammed bin Nayef:§! [?SAU_mbn_share|0]%\n§YMutaib bin Abdullah:§! [?SAU_mutaib_share|0]%"
 SAU_events.89.a:0 "The crown passes"
 SAU_arab_spring_breaking_point:0 "The Breaking Point"
 SAU_arab_spring_breaking_point_desc:0 "Protests have reached a fever pitch across the Kingdom. Within fifteen days the streets will force a reckoning, unless the demonstrations are brought back under control."
 SAU_royal_reign:0 "The Reign of Salman and Mohammed bin Salman"
 SAU_mutaib_reign:0 "The Reign of King Mutaib"
 SAU_abdullah_legacy:0 "King Abdullah's Legacy"
 SAU_focus_MBN:0 "Mohammed bin Nayef Ascends"
 SAU_focus_MBN_desc:0 "Mohammed bin Nayef, Interior Minister and the man who broke al-Qaeda in the Kingdom, takes the throne. A cautious technocrat trusted in Washington, he rules through the security services he built."
 SAU_mbn_reign:0 "The Reign of King Mohammed bin Nayef"
 SAU_spread_revolution_category:0 "Spread the Revolution"
 SAU_spread_revolution_category_desc:0 "The People's Republic of Arabia is only the first spark. The revolution must spread until every Arab worker has thrown off his chains.\n\nThis category unlocks once §YThe People's Republic of Arabia§! is complete and a communist government rules. §YBroadcast the Revolution§! raises communist support inside Arab countries, while §YFound the Arab Comintern§! gathers fellow workers' states. A §YLaunch the Socialist Revolution§! decision stays §Rhidden§! on each Arab country until its communists reach §Y30%§! support, so keep broadcasting until it appears. Once it does, strike: at §Y50%§! or more the revolution seizes the state outright, while §Y30-50%§! ignites a revolutionary civil war. Fellow workers' states are never overthrown, only welcomed into the §YArab Comintern§! through §YInvite to the Arab Comintern§!."
 Arab_Comintern:0 "Arab Comintern"
 SAU_broadcast_revolution:0 "Broadcast the Revolution"
 SAU_broadcast_revolution_desc:0 "Radio Free Arabia beams the message of revolution across the peninsula, stirring the workers and the dispossessed of every Arab capital."
 SAU_arm_arab_revolutionaries:0 "Arm the Arab Revolutionaries"
 SAU_arm_arab_revolutionaries_desc:0 "Crates of rifles and cadres of trained agitators slip across the borders to the communist undergrounds of the Arab world."
 SAU_found_arab_comintern:0 "Found the Arab Comintern"
 SAU_found_arab_comintern_desc:0 "Arabia summons the communist states of the Arab world into a single revolutionary bloc under its own leadership."
 SAU_events.91.t:0 "Close the Strait of Hormuz?"
 SAU_events.91.d:0 "The war has reached the Gulf. Our missile batteries and fast-attack boats stand ready along the Strait of Hormuz, the artery through which a fifth of the world's oil must pass. We can choke it shut now and bring the world economy to its knees, or hold the threat over our enemies and close it at a moment of our choosing."
 SAU_events.91.a:0 "Close it now"
 SAU_events.91.b:0 "Hold it as leverage"
 SAU_events.91.b.tt:0 "The §YStrait Blockade§! decision stays available to shut the strait at the moment of your choosing."
 SAU_events.90.t:0 "The Arab Spring Reaches the Kingdom"
 SAU_events.90.d:0 "The fever sweeping the Arab world has crossed into the Kingdom. Crowds fill the streets of the Eastern Province and the cities of the Hejaz, demanding an end to absolute rule. The mutaween hesitate, the National Guard waits on its orders, and the House of Saud must decide whether to answer the people with force or to let the old order fall."
 SAU_events.90.a:0 "Stand with the Crown"
 SAU_events.90.b:0 "Abolish the Kingdom"
 SAU_declare_republic_tt:0 "The House of Al Saud no longer rules Arabia"
 SAU_declare_republic_warning_tt:0 "§RWarning:§! Proclaiming the Republic of Arabia is permanent. The House of Al Saud can never be restored, and the royal succession tree is closed forever."
 SAU_declare_republic_of_Arabia_1:0 "Declare the Republic of Arabia"
 SAU_declare_republic_of_Arabia_1_desc:0 "The monarchy has fallen and the provisional council holds power in the name of the people. Now the old kingdom is dissolved for good and a new state is proclaimed: the Republic of Arabia, built on the will of its citizens rather than the bloodline of a dynasty."
 SAU_republic_provisional_government:0 "The Provisional Government"
 SAU_republic_provisional_government_desc:0 "The Transitional National Council governs a country without a constitution, without elections, and without a settled future. Its first task is simply to keep order and to lay the groundwork for the republic that will follow."
 SAU_republic_provisional_government_2:0 "The Communist Party"
 SAU_republic_provisional_government_5:0 "The Islamic Parties"
 SAU_republic_provisional_government_3:0 "The National Democratic Assembly"
 SAU_republic_provisional_government_3_desc:0 "Hand the new republic to the liberal democrats of the National Democratic Assembly. They promise a written constitution, an elected parliament, and an open economy answerable to the ballot box."
 SAU_republic_provisional_government_7:0 "The Social Democrats"
 SAU_republic_provisional_government_7_desc:0 "Build the republic on the Saudi Social Democratic Party: a welfare state funded by oil revenue, strong labour rights, and a parliamentary order between the liberal centre and the Marxist left."
 SAU_republic_provisional_government_8:0 "The Popular Solidarity Movement"
 SAU_republic_provisional_government_8_desc:0 "Entrust the transition to the Popular Solidarity Movement, the non-aligned reformists of the civic protests. They promise clean government and broad participation without binding the republic to any rigid ideology."
 SAU_com_nationalize_oil:0 "Nationalize the Oil Fields"
 SAU_com_nationalize_oil_desc:0 "The wealth beneath the sands belongs to the people, not the princes. ARAMCO is seized and placed under workers' control."
 SAU_com_red_guard:0 "Form the Red Guard"
 SAU_com_red_guard_desc:0 "A revolutionary militia drawn from the oil workers and the urban poor, sworn to defend the revolution."
 SAU_com_dictatorship_proletariat:0 "Dictatorship of the Proletariat"
 SAU_com_dictatorship_proletariat_desc:0 "Power is concentrated in the working class through a single revolutionary party that brooks no opposition."
 SAU_com_command_economy:0 "The Command Economy"
 SAU_com_command_economy_desc:0 "Production is planned from the center. Quotas replace markets, and the state directs every factory and field."
 SAU_com_land_reform:0 "Land to the Fellahin"
 SAU_com_land_reform_desc:0 "The great estates are broken up and handed to the peasants who till them."
 SAU_com_oil_workers_soviet:0 "Soviets of the Oil Workers"
 SAU_com_oil_workers_soviet_desc:0 "The oil workers govern their fields through elected soviets, the beating heart of the proletarian state."
 SAU_com_state_industrialization:0 "State Industrialization"
 SAU_com_state_industrialization_desc:0 "Crash programs raise steel mills, dams, and factories, dragging Arabia into the industrial age."
 SAU_com_state_atheism:0 "State Atheism"
 SAU_com_state_atheism_desc:0 "Religion is declared the opium of the masses. The clergy are stripped of power and the mosques fall silent."
 SAU_com_progressive_islam:0 "Progressive Islam"
 SAU_com_progressive_islam_desc:0 "Rather than crush the faith, the party enlists progressive clerics to preach a socialism compatible with Islam."
 SAU_com_collectivization:0 "Collectivization"
 SAU_com_collectivization_desc:0 "Private farms are merged into vast collectives worked in common and answering to the plan."
 SAU_com_rural_literacy:0 "Rural Literacy Brigades"
 SAU_com_rural_literacy_desc:0 "Cadres fan out across the countryside to teach reading, writing, and revolutionary doctrine."
 SAU_com_proletarian_nation:0 "A Proletarian Nation"
 SAU_com_proletarian_nation_desc:0 "Arabia is reforged as a nation of workers, its identity bound to labor rather than tribe or crown."
 SAU_com_new_arab_man:0 "The New Arab Man"
 SAU_com_new_arab_man_desc:0 "A new revolutionary culture is cultivated, sweeping away the old order's superstitions and hierarchies."
 SAU_com_agrarian_revolution:0 "The Agrarian Revolution"
 SAU_com_agrarian_revolution_desc:0 "The transformation of the countryside is complete, its surplus feeding the cities and the revolution."
 SAU_com_womens_emancipation:0 "Women's Emancipation"
 SAU_com_womens_emancipation_desc:0 "Women are brought into the workforce and the party as equals, shattering the old patriarchal order."
 SAU_com_vanguard_region:0 "Vanguard of the Region"
 SAU_com_vanguard_region_desc:0 "Arabia sets itself up as the vanguard of revolution across the Arab world and the Gulf."
 SAU_com_pan_arab_union:0 "Toward Pan-Arab Union"
 SAU_com_pan_arab_union_desc:0 "The revolution reaches outward, seeking union with the other progressive Arab states."
 SAU_com_gulf_revolution:0 "Ignite the Gulf"
 SAU_com_gulf_revolution_desc:0 "Agents and arms flow to the oppressed of the Gulf monarchies, fanning the flames of revolt."
 SAU_com_moscow_alignment:0 "Embrace Moscow"
 SAU_com_moscow_alignment_desc:0 "Arabia throws in its lot with the Soviet bloc, trading oil for arms and ideological kinship."
 SAU_com_non_aligned:0 "The Non-Aligned Road"
 SAU_com_non_aligned_desc:0 "Arabia charts an independent course, leading the non-aligned nations against imperialism and Soviet domination alike."
 SAU_com_peoples_republic:0 "The People's Republic of Arabia"
 SAU_com_peoples_republic_desc:0 "The provisional order gives way to a fully constituted workers' state: the People's Republic of Arabia."
 SAU_com_arabian_comintern:0 "The Arabian Comintern"
 SAU_com_arabian_comintern_desc:0 "Arabia becomes the seat of a new revolutionary international, coordinating communist movements across the region."
 SAU_com_permanent_revolution:0 "The Permanent Revolution"
 SAU_com_permanent_revolution_desc:0 "The revolution is declared unending, exporting itself abroad and renewing itself at home against all reaction."
 SAU_communist_state_tt:0 "The dictatorship of the proletariat in Arabia. These gains hold only while the Saudi Communist Party rules. Should it lose power, they vanish."
 SAU_com_nationalize_oil_tt:0 "§YThe Workers' State grows:§!\n§G+3% Construction Speed, +2% Factory Efficiency§!"
