 bulg.13.t: "불가리아 산업"
 bulg.13.d: "1990년대 이후 불가리아는 1989년 공산주의 붕괴에 뒤따른 경제적, 정치적 혼란에서 여전히 회복 중이었습니다. 나라는 1990년대 초 초인플레이션 시기를 겪었고, 이어서 안정화와 점진적인 경제 성장의 시기가 이어졌습니다. 그러나 1996년 불가리아는 은행 체계의 붕괴와 자국 통화의 급격한 평가절하의 결과로 부분적으로 발생한 심각한 경제 위기를 겪었습니다. 2000년에 이르러 불가리아 경제는 위기에서 서서히 회복하고 있었지만 여전히 여러 과제에 직면해 있었습니다. 국가의 GDP는 완만한 속도로 성장하고 있었으나 실업률은 여전히 높았고 빈곤 수준도 상당했습니다. 정부는 재정 적자를 줄이고 공공 재정을 개선하며 외국인 투자를 촉진하는 것을 목표로 하는 일련의 경제 개혁을 시행하고 있었습니다."
 bulg.13.a: "흥미롭군"
 bulg.14.t: "튀르키예계 시위"
 bulg.14.d: "튀르키예계 소수민족 활동가 집단이 불가리아 의회 앞에서 더 큰 권리와 차별 중단을 요구하며 시위를 벌였습니다. 경찰이 군중을 해산시키려 하자 시위는 폭력적으로 변했고, 양측에서 충돌과 부상자가 발생했습니다. 불가리아의 튀르키예계 소수민족은 또한 튀르키예어 학교의 강제 폐쇄와 튀르키예식 이름 사용 제한 등 자신들 공동체에 대한 정부의 정책을 비판해 왔습니다. 이들은 공식적인 상황에서 자신들의 언어를 사용할 권리를 포함해 불가리아 국가 안에서 더 큰 자치와 인정을 요구해 왔습니다."
 bulg.14.a: "아!"
