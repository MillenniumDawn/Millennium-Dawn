name: Focus Trees
description: Task for a focus tree for Millennium Dawn. Kind and Region are required; everything else is optional tracking for who is doing it and any information they want to provide.
title: "[FOCUS TREE] "
labels: ["enhancement"]
type: focus trees
body:
  - type: markdown
    attributes:
      value: Leave assignees empty; the council assigns after triage.
  - type: dropdown
    id: kind
    attributes:
      label: Kind
      options:
        - New country
        - Rework
    validations:
      required: true
  - type: dropdown
    id: region
    attributes:
      label: Region
      options:
        - Africa
        - Latin America
        - East Asia
        - Middle East
        - Europe
        - Other
    validations:
      required: true
  - type: input
    id: tag
    attributes:
      label: Country tag
      description: The three-letter HOI4 tag.
      placeholder: NIG
  - type: dropdown
    id: tagteam
    attributes:
      label: Tagteam
      description: Focus trees may be built by two developers.
      options:
        - Solo
        - Looking for a partner
        - Already have a partner
  - type: input
    id: partner
    attributes:
      label: Partner
      description: GitHub handle of the partner, if already paired.
      placeholder: "@handle"
  - type: checkboxes
    id: scope
    attributes:
      label: Scope
      description: What the finished work should include.
      options:
        - label: Focus tree
        - label: Ideas and national spirits
        - label: Decisions
        - label: Events
        - label: Order of battle
        - label: Characters and leaders
        - label: Namelists
        - label: AI strategy
        - label: Graphics
        - label: Localisation
  - type: textarea
    id: goals
    attributes:
      label: Goals for the Tree
      description: Information for the focus tree or goals for it. For a rework, what is wrong with the current content.
  - type: textarea
    id: notes
    attributes:
      label: Notes
  - type: textarea
    id: documentation
    attributes:
      label: Documentation
