 module_naval_sub_vls_cells_4: "VLS sous-marin (4 cellules)"
 module_naval_sub_vls_cells_4_desc: "Tubes de lancement vertical montés sur la coque du sous-marin. Le nombre de cellules fixe la capacité de lancement : davantage de cellules augmentent la charge de munitions missiles au prix d'un coût et d'un déplacement accrus.\n\n§GIndice du concepteur : les cellules VLS de sous-marin multiplient les statistiques de combat du rôle missile du bateau. De plus grandes batteries offrent plus de puissance de feu missile, mais ajoutent plus de CI, de main-d'œuvre, de carburant et de visibilité sous-marine.§!\n§GIndice concepteur : les cellules VLS de sous-marin multiplient les statistiques de combat liées aux missiles du bâtiment. De plus grands bancs offrent plus de puissance de feu missiles, mais ajoutent plus de CI, d'effectifs, de carburant et de visibilité sous-marine.§!"
