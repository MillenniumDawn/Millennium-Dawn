 SOV.liberalism_yash_desc: "（大帐篷）自由北方联盟。\n\n自由北方联盟是俄罗斯北部地区各种自由党派和地区主义组织的联盟。联盟的目标是在俄罗斯北部领土上建立一个自由独立的国家，并击败私人军事公司瓦格纳的军队。"
 SOV.Conservative_dum_desc: "（紧急政府）俄罗斯联邦紧急杜马\n\n在俄罗斯共产党瓦格纳政变的背景下，国家杜马召开了紧急会议。杜马议员以多数票通过了成立由杜马议长维亚切斯拉夫·沃洛金领导的紧急政府的议案。"
