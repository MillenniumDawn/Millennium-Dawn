 tech_rail_battery_3_desc: "Las baterías de cañones de riel de tercera generación añaden una vida útil del tubo de última generación, gestión térmica y automatización de los pañoles de munición, lo que permite un fuego de salva sostenido a alta cadencia sin sufrir un desgaste crítico. Con una distribución de energía más inteligente y puntería avanzada, estos montajes triples de riel pueden dominar los enfrentamientos de superficie y proporcionar un apoyo de fuego de precisión a larga distancia mucho más allá de la artillería naval convencional."
 composite_production_6: "Producción de compuestos de vanguardia"
 composite_production_6_desc: "La producción de compuestos de vanguardia expande el uso de materiales termoplásticos, la colocación robótica de capas y la monitorización de procesos en tiempo real, lo que permite producir estructuras aéreas furtivas complejas, paneles de blindaje y estructuras de vehículos de forma más rápida y con menos defectos."
 composite_production_7: "Producción de compuestos del futuro cercano"
 composite_production_7_desc: "La producción de compuestos del futuro cercano integra nanomateriales, capas absorbentes de radar y sensores estructurales integrados, creando componentes más ligeros que pueden mejorar la protección, reduce las firmas detectables y monitorizar los daños durante la operación."
 composite_production_8: "Producción de compuestos del futuro"
 composite_production_8_desc: "La producción de compuestos del futuro utiliza fibras programables, matrices autorreparables y fabricación optimizada por IA para crear estructuras ultraligeras que combinan protección de blindaje, rendimiento de sigilo, control térmico y resistencia a los daños del campo de batalla."
